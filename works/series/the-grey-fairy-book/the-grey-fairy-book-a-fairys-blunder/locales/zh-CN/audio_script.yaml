audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 亲切从容，保留古老童话的神秘感
        timbre: 温暖清晰
        pace: 舒缓
        pitch: 中音
    dindonette:
      display_name: 丁多内特
      tts:
        delivery: 热心善良却冒失自负，闯祸后慌乱懊恼
        timbre: 明亮轻盈
        pace: 稍快
        pitch: 中高音
    selnozoura:
      display_name: 塞尔诺祖拉
      tts:
        delivery: 威严慈爱，遇事审慎，劝解时沉着清楚
        timbre: 温润端庄
        pace: 适中
        pitch: 中音
    cornichon:
      display_name: 科尔尼雄
      tts:
        delivery: 真诚热烈，待爱人殷勤，偶尔笨拙自得
        timbre: 清朗柔和
        pace: 适中
        pitch: 中音
    toupette:
      display_name: 图佩特
      tts:
        delivery: 聪敏爱美，情绪坦率，受伤时尖锐而脆弱
        timbre: 清亮细腻
        pace: 适中
        pitch: 中高音
    kristopo:
      display_name: 克里斯托波
      tts:
        delivery: 高傲强势，醒悟后郑重克制
        timbre: 深沉有力
        pace: 稍慢
        pitch: 中低音
    zeprady:
      display_name: 泽普拉迪王子
      tts:
        delivery: 有礼稳重，调停争端时简洁坚定
        timbre: 清晰沉稳
        pace: 适中
        pitch: 中音
  chapters:
    - id: ch01
      title: 丁多内特的魔泉
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            从前，有个仙女叫丁多内特。她有一副世上最善良的心肠，却没有多少见识。她总想给人带来好处，事情到了最后，受苦的偏偏还是那些人。大海中央有座美丽的小岛，依照仙界的规矩，归她特别照管。她日夜琢磨，想让那里不但最美，也成为全世界最宜人的地方。
        - id: ch01-b02
          speaker: narrator
          text: >-
            她隐去身形，一家一家走过去。孩子们都盼望快点长大，以为长大了便能想做什么就做什么。老人们却谈着往事，叹息不能再年轻一回。丁多内特听见这些话，十分同情他们。
        - id: ch01-b03
          speaker: dindonette
          text: >-
            难道没有办法让这些可怜人都如愿吗？有了！别人试过青春泉，可那只能叫人返老还童。我会做得更好。我要给果园中央的泉水施法，让孩子一喝就长大，让老人一喝就回到童年。
        - id: ch01-b04
          speaker: narrator
          text: >-
            要是她先去问问别的仙女，也许有人能给她一个好建议。可她谁也没找，立刻跑去给泉水施了魔法。那是岛上唯一的淡水泉。天刚亮，各个年纪的人都来取水。丁多内特躲在玫瑰丛后面，每听见脚步声，就探出头看一眼，满心等着大家得到幸福。
        - id: ch01-b05
          speaker: narrator
          text: >-
            没过多久，魔法就在她眼前显灵了。孩子们转眼长成大人，有了成年人的身量和力气。老人们却立刻缩成弱小无助的婴儿。丁多内特对自己的成果满意极了，再也藏不住身形。她从玫瑰丛后走出来，到处告诉人们，这是她做的好事，还高高兴兴等着众人向她道谢。
        - id: ch01-b06
          speaker: narrator
          text: >-
            众人的愿望突然实现，起初自然欢喜。可魔水见效实在太快，他们很快就害怕起来。谁都愿意正值力量最强、容貌最美的年纪，可谁也不愿继续变老。丁多内特只顾匆忙施法，根本没安排他们停在最好的年华。孩子刚刚成人，大人刚刚变成婴儿，所有人就以骇人的速度朝老年奔去。等她明白自己犯了错，已经来不及补救了。
        - id: ch01-b07
          speaker: narrator
          text: >-
            岛上的人看清自己遭遇了什么，全都陷入绝望。他们四处挖井，想摆脱那眼魔泉，可沙土里没有水，雨季也早已过去。他们收集露珠，榨出水果和草叶的汁液，可那点水比起所有人的需要，不过是沧海一粟。岛上没有船，有些人便跳进大海，希望洋流能把自己带到别处。几个更急躁的人当场结束了生命。剩下的人只能听凭命运处置。
        - id: ch01-b08
          speaker: narrator
          text: >-
            也许更可怕的是，每个人从一个年纪变到下一个年纪，都快得来不及准备。若是国民大会上商议战争与和平的人，只长着婴儿的模样，心里仍有成年人的知识和判断，那倒不要紧。他依然可以站起来，为国家该打仗还是求和提出意见。可他连婴儿的无助和愚昧也一并得到了，又没有人能教导他。还不到一个月，全岛的人便死光了。丁多内特看到自己的愚行造成这样的结果，又羞又痛，只得永远离开这座岛。
    - id: ch02
      title: 两个孩子喝下泉水
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            几百年以后，塞尔诺祖拉仙女身体不适。医生让她每周环游世界两次，好换换空气。有一回，她来到了泉水岛。她出门从不独行，总带着两个疼爱的孩子。十四岁的男孩科尔尼雄，幼年时从奴隶市场买来。图佩特只比他小几个月，是她的监护人克里斯托波神灵托付给仙女照料的。塞尔诺祖拉打算等他们年纪合适，就让两人成婚。
        - id: ch02-b02
          speaker: narrator
          text: >-
            在两个孩子长到适婚年龄以前，他们便乘着一艘小飞船，陪塞尔诺祖拉四处旅行。它飞过天空的速度，恰好是我们最快船只的一千九百五十倍。仙女见小岛十分美丽，便把飞船开到地面。她将船交给航行时住在舱底的巨龙看守，领着两个伙伴上岸。岛上有座大城，可所有街道与房屋都空无一人。仙女看得十分奇怪，决定用自己的魔法查清原因。
        - id: ch02-b03
          speaker: narrator
          text: >-
            她忙着查探时，两个孩子自己走开了，来到那眼泉边。天气很热，泉水汩汩冒出，看起来清凉可口。他们各自喝了一大口。就在这时，已经查明真相的塞尔诺祖拉匆匆赶来。
        - id: ch02-b04
          speaker: selnozoura
          text: >-
            当心！快住口！那是致命的毒水，喝下去，你们这一生就全毁了！
          emotion: fearful
        - id: ch02-b05
          speaker: toupette
          text: >-
            毒水？我从没喝过这么清爽的水。科尔尼雄也一定这么想！
        - id: ch02-b06
          speaker: selnozoura
          text: >-
            可怜的孩子，我还是晚了一步！你们为什么要离开我？听我说，我来告诉你们岛上的人遭遇了什么，而你们又会遭遇什么。
          emotion: sad
        - id: ch02-b07
          speaker: selnozoura
          text: >-
            岛上的人就是这样遭了难，同样的命运也会落到你们身上。仙女纵有强大的法力，也不能毁掉另一个仙女的魔法。你们很快就会衰老，变得虚弱而糊涂。我只能尽力减轻你们的痛苦，亲自照料你们，不让你们像岛民那样，因为无人照管而死。咒语已经开始发作了。科尔尼雄比一个钟头前更高大、更像个男子，图佩特也不再有小姑娘的模样。
        - id: ch02-b08
          speaker: narrator
          text: >-
            这番话一点不错。可两个年轻人并没有像塞尔诺祖拉那样悲痛。
        - id: ch02-b09
          speaker: cornichon
          text: >-
            请不要可怜我们。命里既然注定我们很快老去，就别再拖延婚礼了。衰老提前来到又怎样？至少我们的幸福也能早些开始。
        - id: ch02-b10
          speaker: narrator
          text: >-
            塞尔诺祖拉觉得他有道理。再看看图佩特的脸，她知道姑娘也不反对。
        - id: ch02-b11
          speaker: selnozoura
          text: >-
            那就这样决定。不过婚礼不能在这可怕的地方办。我们马上回巴戈塔，我要让你们的庆典比从前任何一场都辉煌。
        - id: ch02-b12
          speaker: narrator
          text: >-
            大家登上飞船，几个钟头便越过四千五百英里，回到巴戈塔。宫里的人看到两个孩子离开这么短的时间，模样竟变化得如此厉害，无不惊讶。塞尔诺祖拉答应过不泄露泉水岛的秘密，众人便什么也问不出来，只顾准备礼服。婚礼定在第二天夜里。
    - id: ch03
      title: 克里斯托波抢走新娘
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            第二天一早，克里斯托波照例来到宫廷看望自己的被监护人。他一见图佩特，便惊讶于这个孩子忽然长成了少女。他本来就喜欢她，如今竟一下子陷入狂热的爱恋。他匆匆求见塞尔诺祖拉，提出要娶图佩特，自信这样显贵的婚事，仙女一定不会拒绝。
        - id: ch03-b02
          speaker: narrator
          text: >-
            可塞尔诺祖拉根本不肯听，还暗示他，为他自己着想，最好把心思转到别处。克里斯托波装作接受了劝告，离开以后却直奔图佩特的房间。他从窗口带着姑娘飞走了。就在同一时刻，等候成婚的新郎还在楼下盼着她出现。
        - id: ch03-b03
          speaker: narrator
          text: >-
            塞尔诺祖拉发现真相，气得怒火冲天。她一批接一批地派出使者，前往克里斯托波在拉蒂布夫的宫殿，命他马上归还图佩特，否则便要开战。神灵始终不给明确答复，只把图佩特严密看守在一座高塔里。
        - id: ch03-b04
          speaker: narrator
          text: >-
            姑娘苦苦劝他推迟婚礼，却怎么说也不管用。几天之后，悲伤和魔水同时侵蚀着她，容貌变得连克里斯托波也害怕起来。他说她需要消遣和新鲜空气，既然见到自己只会伤心，今后可以自由行动。但他仍有一件事不肯答应，那便是送她回巴戈塔。
        - id: ch03-b05
          speaker: narrator
          text: >-
            两边都开始集结军队。克里斯托波请来一位名将统兵，塞尔诺祖拉则把军队交给科尔尼雄。战争还没正式宣告，图佩特的父母便应神灵召唤，来到了拉蒂布夫。他们自女儿还是婴儿时分别以后，就再没见过她，只从旅人口中听说她美貌出众。
        - id: ch03-b06
          speaker: narrator
          text: >-
            如今他们见到的不是漂亮少女，而是一位已经失去青春的中年妇人。她虽然仍算端庄，模样却比亲生父母还老。大家全惊呆了。克里斯托波以为廷臣藏起了图佩特，又找个年长女人来戏弄他。他立刻召来全城的仆役与卫兵，怒问是谁如此大胆，真正的囚徒又去了哪里。
        - id: ch03-b07
          speaker: narrator
          text: >-
            众人告诉他，图佩特由他们看管以后，从未揭下面纱走出房间。就连她到附近花园散步时，脸也始终遮得严严实实。她的食物由人送进屋里，放在桌上。因为她喜欢独自用餐，所以谁也没看过她的脸，更不知道她原来是什么模样。他们显然没有撒谎，克里斯托波只得相信。
        - id: ch03-b08
          speaker: kristopo
          text: >-
            既然不是他们动了手脚，那一定是塞尔诺祖拉的法术。让军队准备出发！
          emotion: angry
        - id: ch03-b09
          speaker: narrator
          text: >-
            塞尔诺祖拉当然知道神灵将会看到什么，可听说他把这卑劣的骗局怪到自己头上，仍觉得受了极大的侮辱。她本想立即交战，大臣们费尽口舌，才劝她暂缓行动，先派使者调解。
        - id: ch03-b10
          speaker: narrator
          text: >-
            泽普拉迪王子就这样前往拉蒂布夫。他在路上遇见科尔尼雄和驻扎在巴戈塔城门外的军队，便拿出仙女的手令，说明现在仍须维持和平。科尔尼雄太想再见图佩特，恳求随王子一同出使。
        - id: ch03-b11
          speaker: narrator
          text: >-
            到了这时候，惹出一切麻烦的那场迷恋，早已从克里斯托波心里消失。他愿意接受泽普拉迪提出的和平条件，却仍坚持图佩特的变化是仙女造成的。
        - id: ch03-b12
          speaker: zeprady
          text: >-
            关于她究竟是不是图佩特，我带来了一位证人。他比任何人都更能辨认真相。请把科尔尼雄叫来吧。
    - id: ch04
      title: 衰老的恋人
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            图佩特听说能再见旧日的恋人，心里欢喜得直跳。可她立刻记起这段日子的遭遇，也想到科尔尼雄必定同样衰老。他们相见的那一刻，并不全是快乐。图佩特尤其难过。她只要想到已经失去的美貌，心里便无法平静。克里斯托波一直在旁看着，终于相信眼前的人确实是图佩特，谁也没有拿别人来骗他。他这才带着随从离开房间，出去签署和约。
        - id: ch04-b02
          speaker: cornichon
          text: >-
            啊，图佩特，我亲爱的图佩特！我们终于又在一起了。过去那些苦恼，就让它们全都过去吧。
          emotion: happy
        - id: ch04-b03
          speaker: toupette
          text: >-
            让它们过去？我们丢掉的美貌，还有前面那样可怕的日子，也都不算了吗？你比我上次见你时老了足足五十岁。我知道，我自己也不会好到哪里去！
          emotion: sad
        - id: ch04-b04
          speaker: narrator
          text: >-
            科尔尼雄握住她的手，竭力安慰她。
        - id: ch04-b05
          speaker: cornichon
          text: >-
            别这么说。你确实变了，可每个年纪都有自己的美。哪一个六十岁的女人能比你漂亮？你的眼睛若还像过去那样明亮，跟如今黯淡的皮肤反倒不相称。额头的皱纹衬出了双颊的丰润，颈项虽然枯萎，衰老的姿态仍很优雅。你的五官年老以后还这样和谐，正说明它们从前有多美。
        - id: ch04-b06
          speaker: narrator
          text: >-
            图佩特听完，放声哭了起来。
        - id: ch04-b07
          speaker: toupette
          text: >-
            你这个怪物！这就是你能给我的全部安慰吗？
          emotion: angry
        - id: ch04-b08
          speaker: cornichon
          text: >-
            可你以前明明说过，只要我的心属于你，你根本不在乎美貌。
        - id: ch04-b09
          speaker: toupette
          text: >-
            是，我说过。但我现在又老又难看，你怎么还能继续爱我？
          emotion: sad
        - id: ch04-b10
          speaker: cornichon
          text: >-
            图佩特，你说的是傻话。我的心还像从前那样属于你。世上没有任何事情能改变它。
        - id: ch04-b11
          speaker: narrator
          text: >-
            泽普拉迪王子走进房间，告诉他们，克里斯托波很后悔自己的行为，已经准许科尔尼雄随时带图佩特离开。他想在二人动身前先行告辞，请他们原谅，也希望不久以后能去巴戈塔拜访。
        - id: ch04-b12
          speaker: narrator
          text: >-
            那晚，两个恋人都没有睡。科尔尼雄想到终于能够回家，欢喜得无法入眠。图佩特却害怕回到巴戈塔以后，自己的虚荣心会承受重重一击。返程路上，科尔尼雄又拿前一天讲过的那些道理安慰她，当然一点用处也没有，她反而越来越难受。进了宫，她直奔从前住过的房间，恳求仙女让自己和科尔尼雄都藏在里面，不去见任何人。
        - id: ch04-b13
          speaker: narrator
          text: >-
            塞尔诺祖拉忙着筹办庆祝和平的盛典，又要接待一心重修旧好的克里斯托波，便把两个年轻人丢在了一旁。起先，这正合他们的心意。可过了一段时间，他们又觉得自己仿佛受了冷落。
        - id: ch04-b14
          speaker: narrator
          text: >-
            一天早晨，他们从窗前看见塞尔诺祖拉和克里斯托波带着全体廷臣，仪仗堂堂地走来。图佩特马上藏进房间最暗的角落。科尔尼雄却忘了自己已不是十四岁的少年，像从前那样拔腿跑去迎接他们。跑动间，他脚下一绊，重重摔倒在地，一只眼睛伤得不轻。
        - id: ch04-b15
          speaker: narrator
          text: >-
            图佩特见恋人无助地倒在地上，急忙奔过去。她衰弱的双腿却忽然一软，几乎摔到他身上，三颗松动的牙齿正好撞在他的额头上，全掉了下来。塞尔诺祖拉此时进门，见了这一幕，忍不住流泪。克里斯托波却暗示她，用不了多久，一切都会恢复正常。
    - id: ch05
      title: 只能解除一半的咒语
      blocks:
        - id: ch05-b01
          speaker: kristopo
          text: >-
            上次仙女大会审查每位仙女的行为时，有人提议，应当尽量补救丁多内特给泉水施法造成的祸害。大家认为她的本意完全出于善良，所以准她解除一半咒语。她本来一直可以直接毁掉那眼致命的泉水，那才是最好的办法，可她从没想到。尽管这样，她的心肠实在很好。一听说有人需要她，她一定会飞来帮忙。
        - id: ch05-b02
          speaker: kristopo
          text: >-
            不过，她来以前，夫人必须作出选择。科尔尼雄和图佩特，只能有一个恢复过去的力量与美貌。
        - id: ch05-b03
          speaker: narrator
          text: >-
            塞尔诺祖拉的心沉了下去。两个孩子对她一样亲，她怎能牺牲一个，偏爱另一个？廷臣们却各有主意。男人全不明白，她为何不马上选择图佩特。女人则毫不犹豫地支持科尔尼雄。仙女迟疑不决，两位恋人自己倒都拿定了主意。
        - id: ch05-b04
          speaker: cornichon
          text: >-
            亲爱的，我终于能向你证明，我看重你的心灵，远胜过你的容貌。宫里最迷人的女人都会被我的青春和力量吸引，可我只会把她们带到你脚下，再向你的年纪和皱纹献上真心的敬意！
        - id: ch05-b05
          speaker: toupette
          text: >-
            你别忙着替自己打算！凭什么所有好处都给你？你还要这样羞辱我吗？仙女一定会公正处置，不会让我受这种委屈。
          emotion: angry
        - id: ch05-b06
          speaker: narrator
          text: >-
            她说完便回到自己的房间，任科尔尼雄怎样请求、怎样想解释，也不肯再出来。
        - id: ch05-b07
          speaker: narrator
          text: >-
            等待丁多内特的那几天，整个宫廷只谈这一件事。大家都以为她一到，就能立刻解决难题。可她自己完全不知道怎样做才好。她同谁交谈，便赞同谁的意见。最后，她想到了一个自以为能让双方满意的办法，请塞尔诺祖拉召集宫廷与全城百姓，听她宣布决定。
        - id: ch05-b08
          speaker: dindonette
          text: >-
            能够补救自己造成的祸害，已经很幸福。可从未闯下祸事的人，才更加幸福。
        - id: ch05-b09
          speaker: narrator
          text: >-
            没有人出声反驳，她便继续往下说。
        - id: ch05-b10
          speaker: dindonette
          text: >-
            我只能解除自己造成的一半祸害。科尔尼雄，我可以把青春还给你。图佩特，我也可以把美貌还给你。我要两件事都做，又要两件事都不做。
        - id: ch05-b11
          speaker: narrator
          text: >-
            人群中响起好奇的低语，两个恋人惊得浑身发抖。
        - id: ch05-b12
          speaker: dindonette
          text: >-
            我绝不会残忍地让一个人衰老，让另一个独享青春。既然不能把你们同时变回原样，我就让你们各自一半的身体恢复年轻，剩下的一半继续衰老。你们可以自己选择。我既能沿腰画一条横线，也能从头到脚，在身体中间画一条竖线。
        - id: ch05-b13
          speaker: narrator
          text: >-
            丁多内特骄傲地望向四周，满以为大家会为这个聪明主意喝彩。科尔尼雄和图佩特却气得浑身发抖，失望到了极点。其余的人听见这种荒唐办法，全都放声大笑起来。塞尔诺祖拉见这对不幸的恋人实在可怜，便走上前去替他们说话。
        - id: ch05-b14
          speaker: selnozoura
          text: >-
            你何不规定一段时间，让他们轮流恢复原来的青春和美貌？这样总比你的办法好，而且我相信，你做起来并不难。
        - id: ch05-b15
          speaker: dindonette
          text: >-
            真是个好主意！对，当然应该这样。那我先碰你们哪一个？
          emotion: happy
        - id: ch05-b16
          speaker: cornichon
          text: >-
            先让图佩特恢复吧。我了解她的心，所以不怕她变了以后忘记我。
        - id: ch05-b17
          speaker: narrator
          text: >-
            丁多内特俯下身，用魔法戒指碰了图佩特一下。老妇人顷刻间又成了少女。整个宫廷欢喜得流下眼泪。图佩特跑向惊讶得跌倒的科尔尼雄，答应以后常来探望，还要把自己参加的舞会和水上游宴全讲给他听。
    - id: ch06
      title: 丁多内特又忘了一件事
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: >-
            两位仙女各自回房，克里斯托波跟过去向她们告辞。他的话还没说完，丁多内特忽然叫了起来。
        - id: ch06-b02
          speaker: dindonette
          text: >-
            哎呀！我忘了规定科尔尼雄什么时候轮到变年轻。我怎么这么笨！我本该在戒指碰到图佩特以前把时间讲清楚，现在恐怕已经太迟了。哎呀，为什么没有人提醒我？
          emotion: surprised
        - id: ch06-b03
          speaker: selnozoura
          text: >-
            你的动作实在太快，我早就知道你又闯了祸。如今只能等科尔尼雄老到极限，让他再喝泉水，变回婴儿。到那时，图佩特一辈子既要做他的妻子，又要做保姆，还得时时照料他。
        - id: ch06-b04
          speaker: narrator
          text: >-
            图佩特已经在忧虑和衰弱中受苦太久。青春一回来，她仿佛怎么游乐都不够，总觉得还没尽兴。她仍旧喜欢科尔尼雄，待他也很亲切，却很少能从热闹的生活里抽出时间去看他。即使没有他陪伴，她照样过得十分快活。可怜的科尔尼雄已经老得几乎看不见、听不清，却并没有错过这一点。他知道图佩特不再需要自己，也能快乐地生活。
        - id: ch06-b05
          speaker: narrator
          text: >-
            最后，解除丁多内特魔法的人是克里斯托波。他偶然发现，科尔尼雄原来是自己的儿子，这便使他更愿意为年轻人讨回青春。他参加仙女们每年一度的大会，请求大家看在他曾帮助许多仙女的份上，赐给他这一个恩典。
        - id: ch06-b06
          speaker: narrator
          text: >-
            仙界从来没人提出过这样的请求，几位年长仙女很不赞同。不过，克里斯托波与塞尔诺祖拉都极受敬重，反对的声音终于被压了下去。大会宣布，魔泉最后一名受害者可以摆脱咒语。克里斯托波只求随塞尔诺祖拉回到巴戈塔，亲眼看着儿子恢复真正的模样。
        - id: ch06-b07
          speaker: narrator
          text: >-
            他们决定只告诉图佩特，已经替她找到一个丈夫。婚礼定在第二天晚上，到时再给她惊喜。图佩特听完大吃一惊。她想到另一个人会取代科尔尼雄，而科尔尼雄必然伤心，心里一阵阵难受。但她不敢违抗仙女，整整一天都在猜测新郎会是谁。
    - id: ch07
      title: 真正的新郎
      blocks:
        - id: ch07-b01
          speaker: narrator
          text: >-
            约定的婚礼时刻到了。大群宾客聚在仙女的宫殿里，四周装饰着只生长在仙界、香气最甜美的花朵。图佩特已经站到自己的位置，可新郎仍不见踪影。
        - id: ch07-b02
          speaker: selnozoura
          text: >-
            去把科尔尼雄带来。
        - id: ch07-b03
          speaker: toupette
          text: >-
            夫人，求您饶过他吧！别让他承受这种痛苦，让他安静地躲起来吧。
          emotion: sad
        - id: ch07-b04
          speaker: selnozoura
          text: >-
            他必须到这里来，而且他绝不会为此后悔。
        - id: ch07-b05
          speaker: narrator
          text: >-
            科尔尼雄被人领进了大厅。他已老得糊涂，望着衣着华丽的人群，只会露出傻乎乎的笑容。
        - id: ch07-b06
          speaker: selnozoura
          text: >-
            把他带到图佩特面前。
        - id: ch07-b07
          speaker: narrator
          text: >-
            塞尔诺祖拉一面说，一面朝图佩特挥手。姑娘又惊又怕，猛地向后退去。仙女握住可怜老人的手，克里斯托波走上前，用戒指碰了他三次。刹那间，科尔尼雄变回了英俊的青年。
        - id: ch07-b08
          speaker: kristopo
          text: >-
            愿你长久地活着，与妻子共享幸福，也永远爱你的父亲。
        - id: ch07-b09
          speaker: narrator
          text: >-
            丁多内特仙女造成的祸害，就这样终于全部结束了。这个故事据《仙女宝库》译出。
