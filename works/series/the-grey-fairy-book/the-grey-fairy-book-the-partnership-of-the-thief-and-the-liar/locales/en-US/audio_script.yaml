  chapters:
    - id: ch01
      title: A Partnership Begins
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Once there was a thief who had no work. As he wandered alone beside the sea, he passed a man standing still and watching the waves.
        - id: ch01-b02
          speaker: thief
          text: Have you ever seen a stone swim?
        - id: ch01-b03
          speaker: liar
          text: Of course I have. I even saw that same stone leap from the water and fly through the air.
        - id: ch01-b04
          speaker: thief
          text: Excellent! You and I should become partners. We'll surely make our fortunes. Let's go to the palace in the next country. I'll tell the king the most astonishing thing I can invent. Then you come after me and swear my lie is true.
        - id: ch01-b05
          speaker: narrator
          text: The man agreed, and they started out together on their travels. After several days on the road, they reached the town where the king's palace stood. There they separated for a few hours. The thief sought an interview with the king, went into his presence alone, and asked His Majesty for a glass of beer.
        - id: ch01-b06
          speaker: king_one
          text: I can't give you one. Every crop has failed this year, including the hops and grapes. There isn't any beer or wine in my whole kingdom.
        - id: ch01-b07
          speaker: thief
          text: How strange! I've just left a country where the crops grew so well that one branch of hops made twelve barrels of beer.
        - id: ch01-b08
          speaker: king_one
          text: I'll wager three hundred florins that isn't true.
        - id: ch01-b09
          speaker: thief
          text: And I'll wager three hundred that it is.
        - id: ch01-b10
          speaker: narrator
          text: They each put up three hundred florins. The king decided to send a servant to that country and learn the truth.
        - id: ch01-b11
          speaker: narrator
          text: The servant mounted a horse and rode off. Along the road he met a man and asked where he had come from. It was the thief's new partner. He told the servant he came from the very country the servant was heading toward.
        - id: ch01-b12
          speaker: servant_one
          text: Then you can tell me how tall the hops grow there. How many barrels of beer do you get from one branch?
        - id: ch01-b13
          speaker: liar
          text: I couldn't tell you that. But I was there when they gathered the hops. I watched three men work for three days with axes just to cut down one branch.
        - id: ch01-b14
          speaker: narrator
          text: The servant thought this could save him the rest of his long journey. He gave the man ten florins and told him to repeat the same story to the king. Then the two of them turned back and entered the king's presence together.
        - id: ch01-b15
          speaker: king_one
          text: Well? Was the story about the hops true?
        - id: ch01-b16
          speaker: servant_one
          text: Yes, sire. I brought back a man from that country who confirms it.
        - id: ch01-b17
          speaker: narrator
          text: The man backed up the thief's lie just as they had planned. So the king paid the thief the three hundred florins he had wagered. Then the two partners left the palace together and set out once more in search of adventures.
    - id: ch02
      title: The Giant Cauliflower
      blocks:
        - id: ch02-b01
          speaker: thief
          text: This time I'll visit another king and tell him something even more astonishing. You must follow after me and back up my lie again. We'll get some money out of him. Just wait and see if we don't.
        - id: ch02-b02
          speaker: narrator
          text: They traveled on until they reached the next kingdom. The thief presented himself at the palace, went before the king, and asked His Majesty to give him a cauliflower.
        - id: ch02-b03
          speaker: king_two
          text: A blight has ruined our vegetables, so we have no cauliflower.
        - id: ch02-b04
          speaker: thief
          text: That's strange. I've come from a country where cauliflower grows so well that a single head filled twelve water tubs.
        - id: ch02-b05
          speaker: king_two
          text: I don't believe that.
        - id: ch02-b06
          speaker: thief
          text: I'll wager six hundred florins that it's true.
        - id: ch02-b07
          speaker: king_two
          text: And I'll wager six hundred that it isn't.
        - id: ch02-b08
          speaker: narrator
          text: The king called for a servant and ordered him to leave at once for the country the thief had named. He was to find out whether the cauliflower tale was true. On the journey, the servant met a man. He stopped his horse and asked where the man came from. The answer was the very country where the servant was going.
        - id: ch02-b09
          speaker: servant_two
          text: Then you'll know how large cauliflower grows there. Can one head really fill twelve water tubs?
        - id: ch02-b10
          speaker: liar
          text: I haven't seen that myself. But I did see twelve wagons, each pulled by twelve horses, carrying one cauliflower to market.
        - id: ch02-b11
          speaker: servant_two
          text: Here are ten florins. You've saved me a long ride. Come with me and tell the king exactly what you told me.
        - id: ch02-b12
          speaker: liar
          text: Very well.
        - id: ch02-b13
          speaker: narrator
          text: They went back to the palace together. When they came before the king, he asked his servant whether he had learned the truth about the enormous cauliflower.
        - id: ch02-b14
          speaker: servant_two
          text: Sire, everything you heard was true. This man comes from that country, and he'll tell you himself.
        - id: ch02-b15
          speaker: narrator
          text: The liar's story seemed to confirm everything the thief had said. So the king had to pay the thief the six hundred florins he had wagered. The partners now had nine hundred florins between them, and they set off on their travels once again.
    - id: ch03
      title: The Bird That Pecked the Stars
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: They came to the country of another neighboring king. The thief entered the royal presence and opened the conversation with a question. Had the king heard about a town in a nearby kingdom where a bird had landed on the church steeple? That steeple was so high, and the bird's beak was so long, that it pecked at the stars until some of them fell from the sky.
        - id: ch03-b02
          speaker: king_three
          text: I don't believe it.
        - id: ch03-b03
          speaker: thief
          text: Even so, I'll wager twelve hundred florins that it's true.
        - id: ch03-b04
          speaker: king_three
          text: And I'll wager twelve hundred that it's a lie.
        - id: ch03-b05
          speaker: narrator
          text: At once, the king sent a servant into the neighboring country to learn the truth. As the servant rode along, he met a man coming in the opposite direction. He called out to him and asked where he came from. The man said he had just left the very town the servant meant to visit. So the servant asked whether the story about the bird with the long beak was true.
        - id: ch03-b06
          speaker: liar
          text: I know nothing about the bird, because I've never seen it. But once I saw twelve men straining with brooms to push one enormous egg into a cellar.
        - id: ch03-b07
          speaker: servant_three
          text: Splendid! Here are ten florins. Come tell the king your story and save me the rest of this journey.
        - id: ch03-b08
          speaker: narrator
          text: The liar went back with the servant and repeated the story before the king. With such a tale offered as proof, the king had nothing left to do but pay the thief twelve hundred florins.
    - id: ch04
      title: Three Missing Florins
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: The partners left with their dishonest winnings and divided the money into equal shares. But the thief secretly kept three florins that should have gone to the liar. Soon afterward, both men married and settled into homes of their own.
        - id: ch04-b02
          speaker: narrator
          text: One day the liar discovered that his partner had cheated him of those three florins. He went to the thief's house and demanded his money.
        - id: ch04-b03
          speaker: thief
          text: Come back next Saturday, and I'll pay you then.
        - id: ch04-b04
          speaker: narrator
          text: The thief never meant to hand over the money. When Saturday morning arrived, he stretched out stiff and straight on his bed. He told his wife to say that he was dead. She rubbed her eyes with an onion so that she would look as if she had been crying. When the liar came to the door, she met him in tears. Her husband was dead, she said, and therefore the three florins could not be paid.
        - id: ch04-b05
          speaker: liar
          text: Since he didn't pay me, I'll pay him instead, with three hard strokes of my riding whip.
        - id: ch04-b06
          speaker: narrator
          text: The liar knew his partner's tricks and had suspected the truth at once. The threat of those three lashes brought the thief springing to his feet. He hurried to the door and made another promise.
        - id: ch04-b07
          speaker: thief
          text: Come back next Saturday. I'll pay you then, I promise.
        - id: ch04-b08
          speaker: narrator
          text: The liar was satisfied with that promise and went away. But when Saturday morning came, the thief rose early and hid beneath a truss of hay in the hayloft. When the liar arrived to demand his three florins, the wife met him with tears in her eyes. Once again, she said that her husband was dead.
        - id: ch04-b09
          speaker: liar
          text: Where did you bury him?
        - id: ch04-b10
          speaker: thief_wife
          text: In the hayloft.
        - id: ch04-b11
          speaker: liar
          text: Then I'll take some hay to settle his debt.
        - id: ch04-b12
          speaker: narrator
          text: The liar climbed to the hayloft and began tossing the hay around with a pitchfork. He drove its points deep into one truss after another as he searched for the hay he meant to take. The thief became terrified for his life. At last he crawled out and promised his partner that he would pay the three florins on the following Saturday.
    - id: ch05
      title: The Treasure in the Crypt
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: On that Saturday, the thief rose at sunrise and went into the crypt of a nearby chapel. There he stretched out, still and stiff, inside an old stone coffin.
        - id: ch05-b02
          speaker: narrator
          text: The liar was every bit as clever as his partner. It did not take him long to think of the crypt. He set out for the chapel, confident that he would soon discover his friend's hiding place.
        - id: ch05-b03
          speaker: narrator
          text: He had only just entered, and his eyes had not yet grown used to the darkness, when whispers came through the grated windows. He listened closely and overheard a band of robbers making plans. They had brought their treasure to the crypt. They meant to hide it there while they went out in search of fresh adventures.
        - id: ch05-b04
          speaker: narrator
          text: All the while, the robbers were pulling the bars from the window. In another minute they would be inside, and then they would discover the liar. He thought quickly. Wrapping his mantle around himself, he stepped into a niche in the wall and stood stiff and upright. In the dim light, he looked exactly like an old stone statue.
        - id: ch05-b05
          speaker: narrator
          text: As soon as the robbers entered the crypt, they began the work of dividing their treasure. There were twelve robbers, but their chief made a mistake and divided the gold into thirteen heaps.
        - id: ch05-b06
          speaker: robber_chief
          text: We don't have time to count all this again. That thirteenth heap belongs to whichever one of us can strike the head from the old stone statue in the niche with a single blow.
        - id: ch05-b07
          speaker: narrator
          text: With that, the chief picked up an axe and approached the niche where the liar stood. He swung the axe up over his head and prepared to strike. Just then, a deep, hollow voice came from the stone coffin.
        - id: ch05-b08
          speaker: thief
          text: Get out of here, or the dead will rise from their coffins and the statues will step down from the walls. We'll drive you away more dead than alive!
        - id: ch05-b09
          speaker: narrator
          text: The thief bounded out of his coffin, and the liar sprang from his niche. The robbers were so terrified that they fled wildly from the crypt. They left all their gold behind and swore they would never set foot in that haunted place again.
        - id: ch05-b10
          speaker: narrator
          text: The two partners divided the robbers' gold between them and carried their shares back to their homes. And that is the last history tells us about either of them.
