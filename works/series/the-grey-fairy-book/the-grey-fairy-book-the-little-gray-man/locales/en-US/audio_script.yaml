  chapters:
    - id: ch01
      title: The Deserted Castle
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Once, a nun, a countryman, and a blacksmith went wandering through the world together. One day they lost their way in a forest so thick and dark that they could no longer tell where they were. At last, they saw the walls of a house in the distance. They were thankful for the sight and hoped to find shelter there for the night.
        - id: ch01-b02
          speaker: narrator
          text: When they came closer, they discovered an old deserted castle. Much of it was falling into ruin, though a few rooms could still be lived in. The three travelers had no homes, so they decided to remain there. Each day, one of them would stay behind and keep house. The other two would go out into the world to seek their fortunes.
        - id: ch01-b03
          speaker: narrator
          text: The nun was the first to stay at home. After the countryman and the blacksmith went into the woods, she cleaned the rooms and cooked the day's food. Her companions did not return for the midday meal, so she ate her own share and put theirs in the oven to keep it warm.
        - id: ch01-b04
          speaker: narrator
          text: She had just sat down to sew when the door opened. A little gray man walked in and stood before her.
        - id: ch01-b05
          speaker: gray_man
          text: Oh, I am so cold!
        - id: ch01-b06
          speaker: narrator
          text: The nun felt very sorry for him.
        - id: ch01-b07
          speaker: nun
          text: Come and sit beside the fire. You can warm yourself there.
        - id: ch01-b08
          speaker: narrator
          text: The little man sat by the fire as she had told him. Before long, he called out again.
        - id: ch01-b09
          speaker: gray_man
          text: Oh, I am so hungry!
        - id: ch01-b10
          speaker: nun
          text: You'll find food in the oven. Help yourself to it.
        - id: ch01-b11
          speaker: narrator
          text: He needed no second invitation. He began eating at once and finished every bit of food as quickly as he could. The nun saw that nothing remained for her companions, and she angrily scolded him.
        - id: ch01-b12
          speaker: nun
          text: You have eaten everything! What are my companions supposed to have when they come home?
          emotion: angry
        - id: ch01-b13
          speaker: narrator
          text: Her words sent the little man into a terrible rage. He grabbed the nun, beat her, and flung her against one wall and then the other. When she was nearly dead, he left her on the floor and hurried out of the castle.
        - id: ch01-b14
          speaker: narrator
          text: That evening, the countryman and the blacksmith came home and demanded their dinner. When they found there was none, they blamed the nun bitterly. She tried to explain what had happened, but neither man believed her.
    - id: ch02
      title: The Gray Man Returns
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: The next day, the countryman asked to take charge of the house. He promised that if he stayed behind, no one would go to bed hungry. The nun and the blacksmith went into the forest, while he cooked the day's food. He ate his own portion, put the rest in the oven, and cleared everything away.
        - id: ch02-b02
          speaker: narrator
          text: Then the door opened, and the little gray man came in. This time, he had two heads. He stood there shaking and trembling.
        - id: ch02-b03
          speaker: gray_man
          text: Oh, I am so cold!
        - id: ch02-b04
          speaker: narrator
          text: The countryman was frightened out of his wits.
        - id: ch02-b05
          speaker: countryman
          text: Please, come closer to the fire and get warm.
          emotion: fearful
        - id: ch02-b06
          speaker: narrator
          text: Soon the dwarf began looking greedily around the room.
        - id: ch02-b07
          speaker: gray_man
          text: Oh, I am so hungry!
        - id: ch02-b08
          speaker: countryman
          text: There is food waiting in the oven. You may eat it.
        - id: ch02-b09
          speaker: narrator
          text: Both of the little man's heads fell to eating, and soon they had swallowed the final morsel. The countryman scolded him for taking it all. Then the dwarf treated him just as he had treated the nun. He beat the poor man and left him more dead than alive.
        - id: ch02-b10
          speaker: narrator
          text: In the evening, the blacksmith returned with the nun. There was no supper for them. The blacksmith flew into a passion. He swore that he would stay home the following day and make certain no one went to bed without food.
        - id: ch02-b11
          speaker: narrator
          text: At dawn, the nun and the countryman set off into the woods. The blacksmith prepared all the food, just as the others had done. Once again, the gray dwarf walked into the castle without knocking. Now he had three heads.
        - id: ch02-b12
          speaker: gray_man
          text: Oh, I am so cold!
        - id: ch02-b13
          speaker: blacksmith
          text: Then sit down near the fire and warm yourself.
        - id: ch02-b14
          speaker: gray_man
          text: Oh, I am so hungry!
        - id: ch02-b15
          speaker: narrator
          text: The blacksmith placed some food on a plate and gave it to him. The dwarf quickly ate everything he had been served. Then all six of his eyes searched the room for more.
        - id: ch02-b16
          speaker: gray_man
          text: Give me more food!
        - id: ch02-b17
          speaker: blacksmith
          text: No. You will not have another bite.
        - id: ch02-b18
          speaker: narrator
          text: The dwarf flew into a terrible rage and tried to beat the blacksmith as he had beaten the others. But this time, he had met his match. The blacksmith seized a huge hammer and struck off two of the creature's heads.
        - id: ch02-b19
          speaker: narrator
          text: The little man yelled in pain and fury, then rushed from the house. The blacksmith ran after him and chased him a long way. At last, they reached an iron door. The dwarf slipped through it, and the door shut behind him. The blacksmith could follow no farther, so he returned to the castle.
        - id: ch02-b20
          speaker: narrator
          text: By then, the nun and the countryman were back. They were delighted when the blacksmith set food before them and showed them the two heads he had knocked off with his hammer. All three decided that they would free themselves from the gray dwarf's power. The very next day, they set out to find him.
    - id: ch03
      title: Beyond the Iron Door
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: They walked a great distance and searched for hours before they found the iron door where the dwarf had vanished. Even then, they had enormous trouble opening it. At last, they forced the lock and stepped into a large hall.
        - id: ch03-b02
          speaker: narrator
          text: A young and lovely girl sat there, working at a table. The moment she saw the nun, the countryman, and the blacksmith, she fell at their feet. Tears filled her eyes as she thanked them for setting her free.
        - id: ch03-b03
          speaker: first_princess
          text: I am a king's daughter. A mighty magician shut me inside this castle. Yesterday, at about noon, I suddenly felt his magic lose its hold on me. Since then, I have been waiting and longing for my rescuers to arrive. Another princess is still imprisoned here. She, too, has fallen under the magician's power.
        - id: ch03-b04
          speaker: narrator
          text: The three companions went on through hall after hall and room after room. At last, they found the second princess. She was every bit as grateful as the first and thanked them warmly for freeing her.
        - id: ch03-b05
          speaker: second_princess
          text: You have broken the power that held me here. Thank you, all three of you, for giving me my freedom.
        - id: ch03-b06
          speakers: [first_princess, second_princess]
          ensemble: duo
          text: A great treasure lies hidden in the castle cellars, but a fierce and terrible dog guards it.
        - id: ch03-b07
          speaker: narrator
          text: The warning did not frighten the companions. With the princesses, they went downstairs at once. There they found the savage animal guarding the treasure, exactly as they had been told.
        - id: ch03-b08
          speaker: narrator
          text: One blow from the blacksmith's hammer put an end to the monster. Beyond it was a vaulted chamber filled with gold, silver, and precious stones.
    - id: ch04
      title: The Prince's Secret
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: Beside the treasure stood a handsome young man. He came forward to meet the nun, the blacksmith, and the countryman, and thanked them for breaking the spell that had bound him.
        - id: ch04-b02
          speaker: prince
          text: I am a king's son. A wicked magician banished me to this castle and changed me into the three-headed dwarf. When the blacksmith struck off two of my heads, the spell over both princesses was broken. And when he killed that horrible dog, I was freed as well.
        - id: ch04-b03
          speaker: narrator
          text: The prince wanted to show his gratitude to the three companions.
        - id: ch04-b04
          speaker: prince
          text: Please divide this treasure among yourselves. Take it as my thanks for all you have done.
        - id: ch04-b05
          speaker: narrator
          text: So the nun, the countryman, and the blacksmith divided the treasure. There was so much gold, silver, and so many precious stones that the work took them a very long time.
    - id: ch05
      title: Three Weddings
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: The princesses also wished to show how grateful they were to their rescuers. One princess married the blacksmith, and the other married the countryman.
        - id: ch05-b02
          speaker: narrator
          text: Then the prince claimed the nun as his bride.
        - id: ch05-b03
          speaker: narrator
          text: And they all lived happily together until they died.
