audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 亲切从容，带一点温和的诙谐
        timbre: 温暖清晰
        pace: 舒缓
        pitch: 中音
    nun:
      display_name: 修女
      tts:
        delivery: 心地善良，受委屈时直率而克制
        timbre: 柔和成熟
        pace: 适中
        pitch: 中音
    countryman:
      display_name: 乡下人
      tts:
        delivery: 朴实爽快，害怕时有些慌张
        timbre: 厚实自然
        pace: 适中
        pitch: 中低音
    little_gray_man:
      display_name: 小灰人
      tts:
        delivery: 乍听可怜，转眼便贪婪暴躁
        timbre: 尖细古怪
        pace: 稍快
        pitch: 高音
  chapters:
    - id: ch01
      title: 林中的破城堡
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            从前，修女、乡下人和铁匠结伴在世间漂泊。有一天，他们在一片又密又暗的森林里迷了路。三人远远看见一道房屋的围墙，都松了一口气，以为终于有地方过夜了。
        - id: ch01-b02
          speaker: narrator
          text: >-
            走近以后，他们才看清，那是一座荒废的古堡，许多地方已经坍塌，幸好还有几间屋子能住。三个人原本就没有家，于是决定在这里安顿下来。每天留下一人照看住处，另外两人出去闯荡，寻找各自的好运。
        - id: ch01-b03
          speaker: narrator
          text: >-
            第一天，修女抽中留守。乡下人和铁匠走进森林后，她收拾好屋子，又做好一天的饭。到了中午，两位同伴没有回来。修女吃了自己的那份，把剩下的饭菜放在炉子里保温。她刚坐下做针线，门忽然开了。一个小灰人走进来，站到了她面前。
        - id: ch01-b04
          speaker: little_gray_man
          text: >-
            哎哟，我浑身都快冻僵了！
        - id: ch01-b05
          speaker: nun
          text: >-
            快坐到火边来，好好暖一暖吧。
        - id: ch01-b06
          speaker: narrator
          text: >-
            小灰人坐到火边，没过多久，又大声叫了起来。
        - id: ch01-b07
          speaker: little_gray_man
          text: >-
            哎哟，我肚子饿极了！
        - id: ch01-b08
          speaker: nun
          text: >-
            吃的就在炉子里，你自己取吧。
        - id: ch01-b09
          speaker: narrator
          text: >-
            小灰人听了，立刻扑向食物，一口气把饭菜吃得干干净净。修女气坏了，责怪这个侏儒不该一点也不给她的同伴留下。
        - id: ch01-b10
          speaker: narrator
          text: >-
            小灰人不但不认错，反而勃然大怒。他抓住修女痛打一顿，又把她从一面墙摔向另一面墙。修女被打得只剩半条命，倒在地板上。小灰人这才匆匆离开。
        - id: ch01-b11
          speaker: narrator
          text: >-
            傍晚，乡下人和铁匠回到城堡，开口就要吃饭。听说什么也没剩下，他们狠狠责备修女。修女勉强讲出白天发生的事，两人却一个字也不相信。
    - id: ch02
      title: 一个、两个、三个脑袋
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            第二天，乡下人主动要求看家。他保证，只要自己留下，晚上谁也不会饿着肚子睡觉。修女和铁匠进了森林，乡下人便做好饭，吃掉自己的一份，把其余的放进炉子里。刚刚收拾完，门开了。小灰人又走了进来，可这次肩上长着两个脑袋。他冷得直发抖。
        - id: ch02-b02
          speaker: little_gray_man
          text: >-
            哎哟，我冷得骨头都发颤了！
        - id: ch02-b03
          speaker: narrator
          text: >-
            乡下人吓得魂都快没了，赶紧请他坐到火旁取暖。过了一会儿，侏儒用贪婪的目光扫过整间屋子。
        - id: ch02-b04
          speaker: little_gray_man
          text: >-
            哎哟，我已经饿得受不了了！
        - id: ch02-b05
          speaker: countryman
          text: >-
            饭菜在炉子里，你想吃就去拿吧。
        - id: ch02-b06
          speaker: narrator
          text: >-
            小灰人的两个脑袋一起吃起来，很快连最后一点残渣也吞光了。乡下人忍不住责骂他。结果，小灰人像前一天痛打修女那样，把乡下人也打得奄奄一息，丢在屋里。
        - id: ch02-b07
          speaker: narrator
          text: >-
            晚上，铁匠陪修女回来，发现晚饭又没了，顿时火冒三丈。他发誓，第三天一定由自己看家，绝不会再让人空着肚子睡觉。
        - id: ch02-b08
          speaker: narrator
          text: >-
            天一亮，修女和乡下人进了树林。铁匠照样备好饭菜。不久，小灰人连门也不敲就闯了进来。这一次，他竟然有三个脑袋。他喊冷，铁匠就让他烤火。他喊饿，铁匠便盛了一盘饭给他。
        - id: ch02-b09
          speaker: narrator
          text: >-
            侏儒转眼就吃光了。六只眼睛仍在屋里到处搜索，他还想再要一些。铁匠一口拒绝。小灰人立刻暴跳起来，也想像前两次那样动手。
        - id: ch02-b10
          speaker: narrator
          text: >-
            可铁匠的力气不比他小。铁匠抄起一柄大锤，猛地砸掉了他的两个脑袋。小灰人痛得惨叫，怒气冲冲地逃出门去。铁匠提着锤子紧紧追在后面，一直追到很远的地方。
        - id: ch02-b11
          speaker: narrator
          text: >-
            前面出现了一扇铁门。小灰人钻进去，门立刻在他身后关死。铁匠只得回到城堡。修女和乡下人已经回来了。铁匠端出特意留下的饭菜，又给他们看锤下来的两个脑袋。两人又惊讶又高兴。
        - id: ch02-b12
          speaker: narrator
          text: >-
            三个伙伴当场商定，一定要彻底摆脱小灰人的魔掌。第二天，他们便一起出发，寻找那扇铁门。
    - id: ch03
      title: 铁门后的公主
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            他们走了很远，又找了好几个钟头，总算认出了小灰人消失的地方。可是，铁门紧锁着。三人费尽力气，好不容易才撬开门锁，走进一座宽阔的大厅。
        - id: ch03-b02
          speaker: narrator
          text: >-
            一位年轻美丽的姑娘正坐在桌旁做活。看见修女、铁匠和乡下人，她立刻扑倒在三人脚边，眼里含着泪，不住感谢他们让自己重获自由。
        - id: ch03-b03
          speaker: narrator
          text: >-
            姑娘说，她原是一位公主，却被法力强大的魔法师关进这座城堡。就在前一天中午，她忽然感觉到控制自己的魔力消失了。打那以后，她一直盼着救命恩人赶来。城堡里还有另一位公主，也受着同一个魔法师的控制。
        - id: ch03-b04
          speaker: narrator
          text: >-
            三个伙伴穿过一间又一间屋子，走过许多大厅，终于找到了第二位公主。她也感激不尽，热切地感谢三人救自己脱离了囚禁。
        - id: ch03-b05
          speaker: narrator
          text: >-
            两位公主还告诉他们，城堡的地窖里藏着数不清的财宝。只是宝藏旁守着一条凶恶可怕的狗，谁也不能轻易靠近。
    - id: ch04
      title: 魔法解除以后
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            这并没有吓退他们。五个人立刻下到地底，果然看见那头凶兽守在宝藏前。铁匠只用大锤打了一下，就结果了这个怪物。
        - id: ch04-b02
          speaker: narrator
          text: >-
            怪物一死，他们便走进一间拱顶密室。那里到处都是金子、银子和珍贵的宝石。宝藏旁还站着一位英俊的年轻男子。他走上前，感谢修女、铁匠和乡下人解开了自己身上的魔咒。
        - id: ch04-b03
          speaker: narrator
          text: >-
            原来，这位年轻人是一位王子。邪恶的魔法师把他放逐到城堡里，又将他变成了三头侏儒。铁匠砸掉其中两个脑袋时，两位公主身上的魔力就消失了。等到守护宝藏的恶狗死在锤下，王子也恢复了自由。
        - id: ch04-b04
          speaker: narrator
          text: >-
            王子为了报答三人，请他们分掉所有宝藏。三个人答应了。可是金银珠宝实在太多，他们花了很久才分完。
        - id: ch04-b05
          speaker: narrator
          text: >-
            两位公主也想报答救命恩人。于是，一位公主嫁给了铁匠，另一位嫁给了乡下人。
        - id: ch04-b06
          speaker: narrator
          text: >-
            最后，王子提出要娶修女为妻。从此以后，他们一同幸福地生活，直到生命走到尽头。
        - id: ch04-b07
          speaker: narrator
          text: >-
            这个故事译自德文，署名克莱特克。
