audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 亲切从容，带一点温和的诙谐
        timbre: 温暖清晰
        pace: 舒缓
        pitch: 中音
    lazarus:
      display_name: 拉撒路先生
      tts:
        delivery: 机灵自信，透着不动声色的幽默
        timbre: 温暖厚实
        pace: 适中
        pitch: 中低音
    spring_draken:
      display_name: 泉边的德拉肯
      tts:
        delivery: 谨慎强硬，容易受惊
        timbre: 低沉粗粝
        pace: 舒缓
        pitch: 低音
    water_draken:
      display_name: 挑水的德拉肯
      tts:
        delivery: 直率焦急，声势逼人
        timbre: 浑厚洪亮
        pace: 适中
        pitch: 低音
    wood_draken:
      display_name: 打柴的德拉肯
      tts:
        delivery: 粗声粗气，急切而有威势
        timbre: 低沉沙哑
        pace: 适中
        pitch: 低音
    escort_draken:
      display_name: 护送的德拉肯
      tts:
        delivery: 外强中干，一受惊便慌张起来
        timbre: 宽厚轰鸣
        pace: 适中
        pitch: 低音
    first_child:
      display_name: 大孩子
      tts:
        delivery: 响亮活泼，精神十足
        timbre: 清亮稚嫩
        pace: 稍快
        pitch: 高音
    second_child:
      display_name: 小孩子
      tts:
        delivery: 兴冲冲的，活泼有力
        timbre: 明亮稚嫩
        pace: 稍快
        pitch: 高音
    fox:
      display_name: 狐狸
      tts:
        delivery: 狡黠自得，话里带笑
        timbre: 轻巧尖亮
        pace: 稍快
        pitch: 中高音
  chapters:
    - id: ch01
      title: 一击杀四十
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            从前有个鞋匠，名叫拉撒路，最喜欢蜂蜜。有一天，他坐着做活，顺便吃起蜂蜜。苍蝇一下子围来一大群，他只打了一巴掌，竟然打死了四十只。
        - id: ch01-b02
          speaker: narrator
          text: >-
            拉撒路马上请人铸了一把剑，还在剑身刻上“一击杀四十”。剑做好以后，他把剑佩在身上，出门闯荡去了。走到第二天，他来到一眼泉水旁，躺下睡着了。
        - id: ch01-b03
          speaker: narrator
          text: >-
            这个国家住着一群德拉肯。一个德拉肯来泉边打水，看见熟睡的拉撒路，也看见了剑上的字。他赶紧回去，把这件事告诉同伴。大家都说，这么厉害的陌生人，可得跟他结成兄弟。于是，他又来到泉边，叫醒了拉撒路。
        - id: ch01-b04
          speaker: spring_draken
          text: >-
            拉撒路先生，要是您愿意，咱们结为兄弟怎么样？
        - id: ch01-b05
          speaker: lazarus
          text: >-
            好啊，我很愿意。
        - id: ch01-b06
          speaker: narrator
          text: >-
            一位神父为他们祝了福。随后，拉撒路跟着那个德拉肯回去，就住在了他们中间。
    - id: ch02
      title: 挑水和打柴
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            过了几天，德拉肯对拉撒路说，大家向来轮流挑水、打柴。既然他如今也是自己人，就得照样轮班。前面几回都是德拉肯去，终于有一天，该拉撒路打水了。
        - id: ch02-b02
          speaker: narrator
          text: >-
            德拉肯装水用的是一只大皮囊，足足能盛二百份水。皮囊还是空的，拉撒路就费了好大的力气，才把它拖到泉边。他心里明白，若是灌满水，自己绝对背不回去。于是，他一滴水也没装，反而在泉水四周挖起土来。
        - id: ch02-b03
          speaker: narrator
          text: >-
            拉撒路久久不归，德拉肯只好派一个同伴出来找他。那个德拉肯赶到泉边，正看见拉撒路还在四周挖土。
        - id: ch02-b04
          speaker: lazarus
          text: >-
            天天挑水多费劲。我干脆把整眼泉搬回去，一次就把这份苦差事解决掉。
        - id: ch02-b05
          speaker: water_draken
          text: >-
            千万别搬，拉撒路先生！泉没了，我们都会渴死。以后我们自己轮流挑水，您再也不用管了！
          emotion: fearful
        - id: ch02-b06
          speaker: narrator
          text: >-
            后来，又轮到拉撒路打柴。德拉肯每次进森林，都是拔起整棵大树，扛在肩上带回家。拉撒路可办不到。他拿出一根粗绳，把林子里的树全捆在一起，一直忙到傍晚。
        - id: ch02-b07
          speaker: narrator
          text: >-
            德拉肯又派了一个同伴去找人。那个德拉肯来到树林里，问拉撒路打算做什么。
        - id: ch02-b08
          speaker: lazarus
          text: >-
            我要一趟把整座森林搬回家。这样一来，以后谁也不用再出来打柴了。
        - id: ch02-b09
          speaker: wood_draken
          text: >-
            这可万万不行，拉撒路先生！森林搬走了，我们都会冻死。打柴的事交给我们，您只管歇着！
          emotion: fearful
        - id: ch02-b10
          speaker: narrator
          text: >-
            那个德拉肯说完，拔起一棵树往肩上一扛，自己带回家去了。
    - id: ch03
      title: 夜里的斧头
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            一起住了一阵以后，德拉肯越来越厌烦拉撒路，便暗中商量好要杀掉他。等他夜里睡熟，每个德拉肯都拿斧头砍他一下。
        - id: ch03-b02
          speaker: narrator
          text: >-
            可这个计谋传进了拉撒路耳朵里。当天晚上，他搬来一截圆木，放在自己平日睡觉的地方，再盖上斗篷，自己躲到了一旁。夜深以后，德拉肯一个接一个地溜进来。每人都对准斗篷下面砍了一斧，直到圆木被砍得碎屑四溅。
        - id: ch03-b03
          speaker: narrator
          text: >-
            德拉肯以为事情办成了，又躺下睡觉。拉撒路出来扔掉碎木头，自己躺回原处。快天亮时，他故意哼哼起来。德拉肯听见动静，便问他怎么了。
        - id: ch03-b04
          speaker: lazarus
          text: >-
            昨夜的蚊虫可真厉害，把我叮得好苦。
        - id: ch03-b05
          speaker: narrator
          text: >-
            德拉肯全吓坏了。拉撒路竟把他们的斧头当成蚊虫叮咬，这还怎么对付？无论如何，也得把他送走。第二天早上，他们问拉撒路家里有没有妻子和孩子，还说，只要他肯回去探望家人，就送他一袋金子。
        - id: ch03-b06
          speaker: narrator
          text: >-
            拉撒路痛快地答应了，可那一大袋金子，他不肯自己背。他要一个德拉肯陪他回去，替他扛着金袋。德拉肯答应了，派出一个同伴跟他上路。
    - id: ch04
      title: 德拉肯肉
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            两人一路走到离拉撒路家只剩一小段路的地方，拉撒路忽然停住脚步。
        - id: ch04-b02
          speaker: lazarus
          text: >-
            你先在这里等着。我得赶在前面，把孩子们捆好，要不然他们会吃了你。
        - id: ch04-b03
          speaker: narrator
          text: >-
            拉撒路回到家，果真用粗绳捆住孩子们，还仔细教他们等会儿该怎么喊。
        - id: ch04-b04
          speaker: lazarus
          text: >-
            一看到德拉肯，你们就使出最大的力气喊：“德拉肯肉！德拉肯肉！”
        - id: ch04-b05
          speaker: narrator
          text: >-
            那个德拉肯刚刚露面，两个孩子便一齐扯开了嗓子。
        - id: ch04-b06
          speakers: [first_child, second_child]
          ensemble: duo
          text: >-
            德拉肯肉！德拉肯肉！
        - id: ch04-b07
          speaker: narrator
          text: >-
            德拉肯听得魂都飞了。他扔下那袋金子，转身就逃。
    - id: ch05
      title: 狐狸的担保
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: >-
            逃跑的德拉肯在路上遇见一只狐狸。狐狸见他惊慌失措，便问出了什么事。
        - id: ch05-b02
          speaker: escort_draken
          text: >-
            拉撒路先生的孩子差点把我吃了！真的只差那么一点点，我才逃出来。
          emotion: fearful
        - id: ch05-b03
          speaker: narrator
          text: >-
            狐狸听了，忍不住笑起来。
        - id: ch05-b04
          speaker: fox
          text: >-
            你竟然怕拉撒路的孩子？他一共养了两只鸡，我昨天吃了一只，现在还要去叼另一只呢。你要是不信，就跟我亲眼看看。不过，你得先把自己拴在我的尾巴上。
        - id: ch05-b05
          speaker: narrator
          text: >-
            德拉肯把自己拴在狐狸尾巴上，就这样跟着它回到拉撒路家，要看狐狸究竟有什么本事。拉撒路正站在那里，举枪瞄准，随时准备开火。他一看狐狸带着德拉肯来了，立刻冲狐狸喊起来。
        - id: ch05-b06
          speaker: lazarus
          text: >-
            我不是叫你把所有德拉肯都带来吗？怎么只有这一个？
        - id: ch05-b07
          speaker: narrator
          text: >-
            德拉肯一听，马上转身狂奔。他跑得太快，狐狸被一路拖着撞上石头，最后摔成了碎片。
        - id: ch05-b08
          speaker: narrator
          text: >-
            拉撒路终于摆脱了德拉肯。他用那些金子盖起一座富丽堂皇的大宅，从此舒舒服服，尽情享受余下的日子。
