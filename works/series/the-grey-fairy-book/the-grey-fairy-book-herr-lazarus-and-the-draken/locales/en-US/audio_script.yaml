  chapters:
    - id: ch01
      title: Forty at One Blow
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Once there was a cobbler named Lazarus, and he dearly loved honey. One day he sat working while he ate some. So many flies gathered around it that he killed forty with a single blow.
        - id: ch01-b02
          speaker: narrator
          text: Lazarus ordered a sword. He had the words "With one blow I have slain forty" written on the blade. As soon as it was ready, he took the sword and set off into the world. After two days on the road, he reached a spring. He lay down beside it and fell asleep.
        - id: ch01-b03
          speaker: narrator
          text: Draken lived in that country. One of them came to the spring for water and found Lazarus asleep. When he read the words on the sword, he hurried home and told the others what he had seen. They all advised him to make fellowship with such a powerful stranger. So he returned to the spring and woke Lazarus.
        - id: ch01-b04
          speaker: spring_draken
          text: Herr Lazarus, if it pleases you, will you join us in fellowship?
        - id: ch01-b05
          speaker: lazarus
          text: Yes, that suits me very well.
        - id: ch01-b06
          speaker: narrator
          text: A priest blessed their fellowship. Then Lazarus went back with the Draken and made his home among them.
    - id: ch02
      title: Water and Wood
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: After several days, the Draken explained that everyone took a turn bringing home wood and water. Lazarus belonged to their company now, so he must take his turn as well. The others went first. At last, it was Lazarus's day to fetch water.
        - id: ch02-b02
          speaker: narrator
          text: The Draken used a huge leather bag that held two hundred measures of water. Even while it was empty, Lazarus could barely drag it all the way to the spring. He knew he could never carry it home once it was full. So he did not fill it at all. He left the bag empty and began digging up the ground all around the spring.
        - id: ch02-b03
          speaker: narrator
          text: He was gone so long that the Draken sent one of their number to find him. The Draken reached the spring and asked what he was doing.
        - id: ch02-b04
          speaker: lazarus
          text: We should not wear ourselves out carrying water every day. I am going to bring the whole spring home at once. Then that work will be over for good.
        - id: ch02-b05
          speaker: water_draken
          text: No, Herr Lazarus! Do not do that, or we shall all die of thirst. We will take turns with the water ourselves. You need never carry it.
          emotion: fearful
        - id: ch02-b06
          speaker: narrator
          text: Next came Lazarus's turn to fetch wood. Whenever the Draken went to the forest, each one pulled up a whole tree, put it over his shoulder, and carried it home. Lazarus could not do the same. Instead, he tied all the trees together with a thick rope and stayed there until evening.
        - id: ch02-b07
          speaker: narrator
          text: Once again, the Draken sent someone to see what had happened. The Draken found Lazarus among the trees and asked what he meant to do.
        - id: ch02-b08
          speaker: lazarus
          text: I am bringing the entire forest home in one trip. After that, none of us will have to fetch wood again.
        - id: ch02-b09
          speaker: wood_draken
          text: By no means, Herr Lazarus! If you take the whole forest, we shall all die of cold. We will fetch the wood ourselves, and you can leave that work to us.
          emotion: fearful
        - id: ch02-b10
          speaker: narrator
          text: The Draken tore up one tree, threw it over his shoulder, and carried it home.
    - id: ch03
      title: The Hatchets in the Night
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: After they had lived together for some time, the Draken grew tired of Lazarus. They secretly agreed to kill him. During the night, while he slept, every Draken would strike him once with a hatchet.
        - id: ch03-b02
          speaker: narrator
          text: But Lazarus heard about their plan. That evening he put a log where he usually slept, covered it with his cloak, and hid nearby. In the darkness, the Draken crept in one after another. Each struck the covered log with a hatchet, until the wood flew to pieces.
        - id: ch03-b03
          speaker: narrator
          text: Certain that Lazarus was dead, the Draken lay down again. Lazarus threw away the broken log and took its place. Near dawn, he began to groan. The Draken heard him and asked what was wrong.
        - id: ch03-b04
          speaker: lazarus
          text: The gnats have stung me terribly.
        - id: ch03-b05
          speaker: narrator
          text: The Draken were terrified. If Lazarus thought their hatchet blows were only gnat stings, they had to get rid of him somehow. The next morning they asked whether he had a wife or children. They offered him a bag of gold if he would go and visit his family.
        - id: ch03-b06
          speaker: narrator
          text: Lazarus gladly agreed to go. But the bag was another matter. He asked that one of the Draken come with him and carry the gold. They consented, and one of them set out beside him with the bag.
    - id: ch04
      title: Drakenflesh
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: When they were a short distance from Lazarus's house, he turned to his companion.
        - id: ch04-b02
          speaker: lazarus
          text: Wait here while I go ahead and tie up my children. Otherwise, they may eat you.
        - id: ch04-b03
          speaker: narrator
          text: Lazarus went home and tied his children with strong ropes. Then he told them what to do.
        - id: ch04-b04
          speaker: lazarus
          text: The moment you see the Draken, shout as loudly as you can, "Drakenflesh! Drakenflesh!"
        - id: ch04-b05
          speaker: narrator
          text: As soon as the Draken came into sight, the children raised their voices together.
        - id: ch04-b06
          speakers: [first_child, second_child]
          ensemble: duo
          text: Drakenflesh! Drakenflesh!
        - id: ch04-b07
          speaker: narrator
          text: The cry frightened the Draken so badly that he dropped the bag of gold and ran away.
    - id: ch05
      title: The Fox's Promise
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: On the road, the fleeing Draken met a fox. The fox asked why he looked so frightened.
        - id: ch05-b02
          speaker: escort_draken
          text: Herr Lazarus's children nearly ate me. I escaped by no more than a hair's breadth.
          emotion: fearful
        - id: ch05-b03
          speaker: narrator
          text: The fox laughed at him.
        - id: ch05-b04
          speaker: fox
          text: You were frightened of Lazarus's children? He owned two fowls. I ate one yesterday, and I am going back for the other now. Come and see for yourself if you do not believe me. Just tie yourself to my tail first.
        - id: ch05-b05
          speaker: narrator
          text: The Draken tied himself to the fox's tail and followed it back to Lazarus's house to see what the fox would do. Lazarus was standing there with his gun raised, ready to fire. When he saw the fox bringing the Draken, he called out.
        - id: ch05-b06
          speaker: lazarus
          text: Did I not order you to bring me every Draken? Why have you brought only one?
        - id: ch05-b07
          speaker: narrator
          text: The Draken heard this and turned at once. He ran so fast that the fox was dashed to pieces against the stones.
        - id: ch05-b08
          speaker: narrator
          text: Lazarus was rid of the Draken at last. With their gold, he built himself a magnificent house and spent the rest of his days in great enjoyment.
