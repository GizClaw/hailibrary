  chapters:
    - id: ch01
      title: The Portrait Behind the Curtain
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Once there was a king with one son, and he loved that son dearly. One day, the old king called the prince to him.
        - id: ch01-b02
          speaker: old_king
          text: My dearest child, my hair has turned grey, and I am growing old. Soon I will no longer feel the sun or see the trees and flowers. Before I die, I want to see you married to a good wife. Please marry as soon as you can.
          emotion: sad
        - id: ch01-b03
          speaker: prince
          text: Father, I have always wanted to obey you, and I still do. But I do not know any woman I could bring home as your daughter-in-law.
        - id: ch01-b04
          speaker: narrator
          text: The king took a golden key from his pocket and handed it to his son.
        - id: ch01-b05
          speaker: old_king
          text: Climb the stairs to the very top of the tower. Look carefully at everything there, then return and tell me which one you like best.
        - id: ch01-b06
          speaker: narrator
          text: The prince had never entered the tower and had no idea what waited inside. The staircase curled around and around until his head nearly spun. Now and then he passed a large room opening off the stairs, but his father had sent him to the top, so he kept climbing.
        - id: ch01-b07
          speaker: narrator
          text: At last he reached a hall with an iron door at one end. The golden key opened it, and he stepped through. Beyond lay a vast chamber. Golden stars shone across its blue ceiling, and a green silk carpet felt as soft as grass beneath his feet. Sunlight poured through twelve windows framed in gold. On each window was painted a beautiful young woman, and each seemed lovelier than the one before.
        - id: ch01-b08
          speaker: narrator
          text: As the astonished prince studied their faces, the painted women raised their eyes and smiled. He waited for them to speak, but not one made a sound. Then he noticed a white silk curtain covering one window.
        - id: ch01-b09
          speaker: narrator
          text: He lifted the curtain. There stood the image of a maiden as beautiful as day and as sad as the tomb. She wore a white robe, a silver girdle, and a crown of pearls. The prince stared as though he had turned to stone. Her sorrow seemed to enter his own heart.
        - id: ch01-b10
          speaker: prince
          text: She will be my wife. I choose her, and no one else.
        - id: ch01-b11
          speaker: narrator
          text: At those words, the maiden blushed and lowered her head. Every other figure vanished from the windows. The prince hurried down the winding staircase and returned to his father. He described the starry chamber, the painted maidens, and the one he had chosen. The old king listened to the whole tale with a sorrowful face.
        - id: ch01-b12
          speaker: old_king
          text: My son, you did wrong to uncover what was hidden, and now you are hurrying toward great danger. A wicked sorcerer holds that maiden in an iron castle. Many young men have tried to rescue her, and none returned. Still, what is done cannot be undone. You have given your word. Go and face your fate, then come safely home to me.
          emotion: fearful
        - id: ch01-b13
          speaker: narrator
          text: The prince embraced his father, mounted his horse, and rode away to find his bride.
    - id: ch02
      title: Three Remarkable Companions
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: For several hours the prince rode along cheerfully. Then he entered a strange wood and lost his way among deep valleys and winding paths. The trees hid the sun, so he could not tell north from south. At last he gave up hope of finding a way out. Just then, a voice called behind him.
        - id: ch02-b02
          speaker: long
          text: Hey! Wait a moment!
        - id: ch02-b03
          speaker: narrator
          text: A very tall man came running as fast as his long legs could carry him.
        - id: ch02-b04
          speaker: long
          text: Wait for me and take me into your service. You will never regret it.
        - id: ch02-b05
          speaker: prince
          text: Who are you, and what can you do?
        - id: ch02-b06
          speaker: long
          text: My name is Long, and I can stretch my body whenever I please. See that nest at the top of the pine tree? I can fetch it without climbing.
        - id: ch02-b07
          speaker: narrator
          text: Long grew taller and taller until he stood as high as the pine itself. Without any climbing, he reached the nest and slipped it into his pocket. Then, before the prince could so much as blink, Long shrank to his usual size and stood before him again.
        - id: ch02-b08
          speaker: prince
          text: You certainly know how to do that. But I am too old to care about birds' nests. If you can lead me out of this wood, then you will truly be useful.
        - id: ch02-b09
          speaker: long
          text: That will be easy enough.
        - id: ch02-b10
          speaker: narrator
          text: Long stretched until he was three times taller than the highest tree. He looked in every direction from above the forest.
        - id: ch02-b11
          speaker: long
          text: This is the way out.
        - id: ch02-b12
          speaker: narrator
          text: He shortened himself, took the horse by the bridle, and guided the prince through the trees. Soon they reached a broad plain. Far ahead stood a wall of high rocks dotted with trees, like the defenses of a town.
        - id: ch02-b13
          speaker: long
          text: My lord, one of my comrades is coming. Take him into your service too. He will be a great help to you.
        - id: ch02-b14
          speaker: prince
          text: Call him over. Let me see what kind of man he is.
        - id: ch02-b15
          speaker: long
          text: He is too far away to hear me, and he has so much to carry that he will be a while. I had better bring him here myself.
        - id: ch02-b16
          speaker: narrator
          text: Long stretched upward until his head disappeared into the clouds. Then he crossed the plain in two or three enormous strides. He lifted his friend onto his back, carried him all the way to the prince, and gently set him down. The newcomer was a very fat man, as round as a barrel.
        - id: ch02-b17
          speaker: prince
          text: Who are you, and what can you do?
        - id: ch02-b18
          speaker: broad
          text: Your worship, I am Broad. I can make myself as wide as I like.
        - id: ch02-b19
          speaker: prince
          text: Show me how you do it.
        - id: ch02-b20
          speaker: broad
          text: Run, my lord! Get back into the wood as fast as you can!
        - id: ch02-b21
          speaker: narrator
          text: Broad began to swell. The prince did not understand the warning, but when Long raced for the trees, he followed. He barely escaped. Broad grew so suddenly that he almost knocked over both prince and horse. Soon he covered acres of ground and looked like a mountain.
        - id: ch02-b22
          speaker: narrator
          text: At last Broad stopped growing. He drew a breath so deep that the forest shook, then shrank back to his ordinary size.
        - id: ch02-b23
          speaker: prince
          text: You made me run for my life. Still, a man like you does not come along every day. I will take you into my service.
        - id: ch02-b24
          speaker: narrator
          text: The three traveled on. Near the rocks, they met a man with a bandage across his eyes.
        - id: ch02-b25
          speaker: long
          text: Your excellency, here is our third comrade. You would do well to take him too. I promise he will earn his keep.
        - id: ch02-b26
          speaker: prince
          text: Who are you? And why cover your eyes? How can you see where you are going?
        - id: ch02-b27
          speaker: quickeye
          text: It is the other way around, my lord. I wear the bandage because I see too well. Even through it, I see as clearly as anyone else. When I uncover my eyes, I can look through anything. Whatever I stare at either catches fire or shatters into a thousand pieces. They call me Quickeye.
        - id: ch02-b28
          speaker: narrator
          text: Quickeye removed the bandage and turned his uncovered eyes toward the rock. A sharp crack rang out. Under his gaze, the great rock split apart and, within moments, crumbled into a heap of sand. Something bright gleamed among the grains. Quickeye picked it up and carried it to the prince. It was a lump of pure gold.
        - id: ch02-b29
          speaker: prince
          text: You are truly astonishing, and I would be a fool not to hire you. Since your sight reaches so far, tell me how distant the Iron Castle is and what is happening there now.
        - id: ch02-b30
          speaker: quickeye
          text: Alone, you would need at least a year to reach it. With us, you will arrive tonight. At this moment, they are preparing supper.
        - id: ch02-b31
          speaker: prince
          text: There is a princess in that castle. Can you see her?
        - id: ch02-b32
          speaker: quickeye
          text: A wizard holds her behind iron bars in a high tower.
        - id: ch02-b33
          speaker: prince
          text: Then please help me set her free!
        - id: ch02-b34
          speaker: narrator
          text: The three companions promised they would help him. Together they entered the grey rocks through the breach Quickeye's gaze had made. Beyond it, they climbed great mountains and crossed deep forests. Again and again the road was blocked, and each time Long, Broad, or Quickeye found a way to move the obstacle aside.
        - id: ch02-b35
          speaker: narrator
          text: At sunset, the prince saw the towers of the Iron Castle. He crossed its iron bridge just before the sun vanished. The moment darkness fell, the bridge lifted and the gates closed behind them. There was no turning back.
    - id: ch03
      title: The First Night in the Iron Castle
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: The prince took his horse into the stable. There, everything looked as though someone had been expecting a guest, though no one came to greet him. Then the four men marched straight into the castle. In the courtyard, throughout the stables, and inside the great halls, they saw richly dressed men. Every one stood silent and motionless, for every one had been turned to stone.
        - id: ch03-b02
          speaker: narrator
          text: They crossed what seemed like an endless chain of rooms, with one opening into the next. At last they entered a dining hall filled with brilliant light. Wine and fruit covered the table, and exactly four places had been laid. The travelers waited several minutes for someone to appear. No one did. Since hunger had followed them through the long journey, they sat down, ate, and drank.
        - id: ch03-b03
          speaker: narrator
          text: When supper was over, they began looking for a place to sleep. Suddenly the door flew open. An old, hunchbacked wizard entered. His head was bald, his grey beard hung to his knees, and three iron bands circled the waist of his black robe.
        - id: ch03-b04
          speaker: narrator
          text: The wizard led a beautiful lady by the hand. Her white dress, silver girdle, and pearl crown were just as the prince remembered, and her face was as pale and sad as death. He knew her at once and stepped eagerly toward her. The wizard spoke before he could say a word.
        - id: ch03-b05
          speaker: wizard
          text: I know why you have come. You may take her if you can keep her from escaping for three nights in a row. Fail once, and you and your servants will turn to stone like all the men who came before you.
        - id: ch03-b06
          speaker: narrator
          text: The wizard offered the princess a chair, then walked out of the hall. The prince could not take his eyes from her, because she was so lovely. He began talking to her, hoping for some reply. She did not answer. She did not even smile. Pale and silent, she sat as though she herself had been carved from marble.
        - id: ch03-b07
          speaker: narrator
          text: The prince sat beside her, determined not to close his eyes. Long stretched himself around the room like a strap. Broad blocked the doorway and swelled until even a mouse could not pass. Quickeye leaned against the pillar that held up the roof. Yet within half a second, every one of them was fast asleep. They slept soundly all night.
        - id: ch03-b08
          speaker: narrator
          text: At the first light of dawn, the prince woke with a start. The princess had vanished. He shook his companions awake and begged them to help him.
        - id: ch03-b09
          speaker: quickeye
          text: Steady yourself, my lord. I have already found her. A hundred miles away stands a forest. In its center is an old oak, and at the top of that oak is an acorn. The acorn is the princess. If Long carries me on his shoulders, we will soon bring her back.
          emotion: calm
        - id: ch03-b10
          speaker: narrator
          text: In less time than it takes to walk around a cottage, Long and Quickeye returned. Long placed the acorn in the prince's hand.
        - id: ch03-b11
          speaker: quickeye
          text: Throw it onto the floor, your excellency.
        - id: ch03-b12
          speaker: narrator
          text: The prince obeyed and threw the acorn down. To his delight, it vanished, and the princess appeared beside him. Just as the sun first showed above the mountains, the door burst open and the wizard strode in with a loud, mocking laugh. Then he caught sight of the princess. His face darkened, and a low growl came from his throat. One of the iron bands around his waist snapped with a crash. He caught the young woman by the hand and carried her away.
        - id: ch03-b13
          speaker: narrator
          text: The prince spent that day exploring the strange treasures of the castle. Everywhere, life seemed to have stopped in a single moment. One stone prince still gripped the sword he had been swinging. A stone knight remained caught while running away. A servant stood forever with a piece of beef halfway to his mouth. All around them, others kept the exact poses they had held when the wizard condemned them to marble.
        - id: ch03-b14
          speaker: narrator
          text: Inside the castle and beyond its walls, everything was empty and bleak. The trees had no leaves. The fields bore no grass. One river lay there without flowing, and no fish lived in it. No flowers opened, and no birds sang.
        - id: ch03-b15
          speaker: narrator
          text: Food appeared by magic three times that day for the prince and his servants. Only after supper did the wizard return and place the princess in the prince's care once more.
    - id: ch04
      title: The Stone in the Mountain
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: All four men swore they would stay awake this time, no matter what it cost. Their resolve made no difference. Once again they fell asleep, and when the prince woke in the morning, the room was empty.
        - id: ch04-b02
          speaker: narrator
          text: Shame struck him. He rushed to Quickeye and shook him awake.
        - id: ch04-b03
          speaker: prince
          text: Wake up, Quickeye! Do you know where the princess has gone?
        - id: ch04-b04
          speaker: quickeye
          text: Yes, I see her. Two hundred miles away is a mountain. Inside that mountain is a rock, and inside the rock is a precious stone. The stone is the princess. Long can carry me there, and we will return before you can turn around.
        - id: ch04-b05
          speaker: narrator
          text: Long lifted Quickeye onto his shoulders, and they set off at once. Each of Long's strides carried them twenty miles across the land. When they drew near the distant mountain, Quickeye uncovered his burning eyes and fixed his gaze upon it. In a single instant, the whole mountain split into a thousand pieces. Among the fallen rocks, the precious stone flashed and sparkled.
        - id: ch04-b06
          speaker: narrator
          text: They carried the stone back to the castle. The prince quickly threw it onto the floor, and the princess stood before him again. When the wizard arrived and saw her, flames of fury seemed to shoot from his eyes. With a sharp crack, his second iron band broke and fell away. He seized the princess and led her off, growling more fiercely than before.
        - id: ch04-b07
          speaker: narrator
          text: The next day passed exactly like the day before. After supper, the wizard brought the princess back. This time he stared straight into the prince's eyes.
        - id: ch04-b08
          speaker: wizard
          text: Tonight we will discover which of us wins the prize in the end.
          emotion: angry
        - id: ch04-b09
          speaker: narrator
          text: That night, the prince and his companions fought harder than ever to stay awake. They walked around the room instead of sitting. It was useless. One after another, they gave in to sleep. For the third time, the princess escaped them.
    - id: ch05
      title: The Ring in the Black Sea
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: In the morning, the prince was again the first to wake. When he saw that the princess was gone, he hurried to Quickeye.
        - id: ch05-b02
          speaker: prince
          text: Get up, Quickeye! Tell me where the princess is!
        - id: ch05-b03
          speaker: narrator
          text: Quickeye searched the distance for a long while before he answered.
        - id: ch05-b04
          speaker: quickeye
          text: Oh, my lord, she is very far away. Three hundred miles from here lies a black sea. A little shell rests in the middle of it, and inside that shell is a gold ring. The ring is the princess. Do not torment yourself. We will fetch her. But today, Long must carry Broad as well. We will need him badly.
          emotion: calm
        - id: ch05-b05
          speaker: narrator
          text: Long placed Quickeye on one shoulder and Broad on the other. Every stride covered thirty miles. At the black sea, Quickeye pointed out where the shell lay. Long reached down as far as his arm would stretch, but the shell was on the seabed, beyond his grasp.
        - id: ch05-b06
          speaker: broad
          text: Wait, friends. It will be all right. I can help.
        - id: ch05-b07
          speaker: narrator
          text: Broad began to swell until the world itself seemed too small to contain him. Then he bent over the black sea and drank. Every mouthful swallowed an enormous quantity of water. He drank and drank, and after only a minute or two, the water had fallen low enough for Long's hand to reach the seabed. Long felt along the bottom, found the little shell, opened it, and pulled out the gold ring.
        - id: ch05-b08
          speaker: narrator
          text: But finding the ring had cost them precious time, and Long still had two companions to carry. He drove himself onward with Quickeye on one shoulder and Broad on the other. The sky grew lighter with every enormous stride. Dawn was already breaking as they hurried toward the castle, where the prince waited alone in terrible fear.
        - id: ch05-b09
          speaker: narrator
          text: Soon the first rays of sunlight appeared above the mountaintops. The door burst open. When the wizard found the prince standing there alone, he roared with wicked laughter, certain that he had won. Then came a tremendous crash. The window shattered into a thousand pieces, and a gold ring flashed through the air. The moment it struck the floor, the princess stood before the wizard.
        - id: ch05-b10
          speaker: narrator
          text: Quickeye had watched the castle from afar and warned Long that the prince was in danger. Gathering all his strength for one tremendous effort, Long had thrown the ring straight through the window.
        - id: ch05-b11
          speaker: narrator
          text: The wizard shrieked and howled with rage until the castle shook to its foundations. His third iron band split in two with a final crash. Then the wizard vanished, and a crow flew out through the broken window.
        - id: ch05-b12
          speaker: narrator
          text: At last, the enchantment that had kept the princess silent was broken. Blushing like a rose, she thanked the prince for a rescue she had never expected.
        - id: ch05-b13
          speaker: princess
          text: Thank you, Prince. You have set me free when I had lost all hope of rescue.
        - id: ch05-b14
          speaker: narrator
          text: The wicked black crow's flight restored far more than the princess. The marble figures became living men and resumed whatever they had been doing when the spell struck. Horses neighed in the stables. Flowers opened in the garden. Birds flew through the air, and fish darted through flowing water. Everywhere, life and joy returned.
        - id: ch05-b15
          speaker: narrator
          text: The knights who had been stone came together to honor the prince who had freed them.
        - id: ch05-b16
          speaker: prince
          text: Please do not thank me. I did nothing by myself. Without my faithful servants, Long, Broad, and Quickeye, I would have become one of you.
        - id: ch05-b17
          speaker: narrator
          text: The prince said farewell to the freed knights and left the Iron Castle with the princess and his three faithful companions. Together they traveled all the way back to his father's kingdom. The old king had waited so long that he had given up every hope of seeing his son again. When the prince finally came home, the king wept with joy and insisted that the wedding take place as soon as possible.
        - id: ch05-b18
          speaker: narrator
          text: Every knight once enchanted in the Iron Castle came to the wedding. After the celebration, Long, Broad, and Quickeye said goodbye to the young couple. They meant to go looking for more work.
        - id: ch05-b19
          speaker: narrator
          text: The prince offered them anything their hearts desired if they would stay. They answered that an idle life could never please them. They could only be happy while they were busy. So they went away to seek their fortunes, and for all I know, they are seeking still.
