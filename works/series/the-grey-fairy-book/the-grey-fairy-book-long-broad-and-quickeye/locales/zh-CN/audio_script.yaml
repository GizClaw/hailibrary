audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 亲切从容，保留古老童话的神秘感
        timbre: 温暖清晰
        pace: 舒缓
        pitch: 中音
    king:
      display_name: 老国王
      tts:
        delivery: 慈爱而忧心，劝诫时庄重恳切
        timbre: 苍老浑厚
        pace: 稍慢
        pitch: 低音
    prince:
      display_name: 王子
      tts:
        delivery: 真诚勇敢，遇险时急切却不失礼
        timbre: 清朗坚定
        pace: 适中
        pitch: 中音
    long:
      display_name: 长人
      tts:
        delivery: 爽快自信，办事利落可靠
        timbre: 明亮修长
        pace: 稍快
        pitch: 中高音
    broad:
      display_name: 阔人
      tts:
        delivery: 豪爽沉着，显本领时带着憨厚自信
        timbre: 宽厚饱满
        pace: 适中
        pitch: 中低音
    quickeye:
      display_name: 千里眼
      tts:
        delivery: 敏锐镇定，说明所见时清楚果断
        timbre: 清晰锐利
        pace: 适中
        pitch: 中音
    wizard:
      display_name: 巫师
      tts:
        delivery: 阴冷傲慢，发怒时凶狠暴烈
        timbre: 沙哑低沉
        pace: 稍慢
        pitch: 低音
    princess:
      display_name: 公主
      tts:
        delivery: 温柔含蓄，解除魔法后真挚感激
        timbre: 柔和清澈
        pace: 舒缓
        pitch: 中高音
  chapters:
    - id: ch01
      title: 塔顶的画像
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            从前有一位国王，膝下只有一个儿子，他把这个孩子看得比什么都珍贵。一天，国王把王子叫到身边。他已经老了，满头白发，知道留给自己的日子不多了。
        - id: ch01-b02
          speaker: king
          text: >-
            我最亲爱的孩子，我很快就再也晒不到暖暖的太阳，也看不见树木和鲜花了。可我临死以前，还想亲眼看着你娶一位贤惠的妻子。儿啊，尽快成婚吧。
          emotion: sad
        - id: ch01-b03
          speaker: prince
          text: >-
            父王，我无论何时都愿照您的话做。只是我连该娶哪位姑娘都不知道，又怎么给您带回一位儿媳呢？
        - id: ch01-b04
          speaker: narrator
          text: >-
            老国王听完，从衣袋里摸出一把金钥匙，交到儿子手上。
        - id: ch01-b05
          speaker: king
          text: >-
            顺着楼梯一直走到塔顶。到了那里，好好看看四周。然后回来告诉我，你最喜欢看见的哪一个。
        - id: ch01-b06
          speaker: narrator
          text: >-
            王子从没进过这座塔，完全猜不到里面有什么。他沿着盘旋的楼梯一圈圈往上走，绕得头都快晕了。途中不时有宽敞的房间从身旁闪过，可父王叫他去塔顶，他就没有停步。
        - id: ch01-b07
          speaker: narrator
          text: >-
            最高处是一座厅堂，尽头有一扇铁门。王子用金钥匙打开门，走进一间广阔的屋子。湛蓝的屋顶洒满金星，脚下的绿绸地毯像草地一样柔软。十二扇金框窗子迎着阳光，每一扇上面都画着一位少女，而且一个比一个美。阳光从她们身边照进来，整间屋子明亮得像一个奇异的梦。
        - id: ch01-b08
          speaker: narrator
          text: >-
            王子惊奇地望着她们，不知该选谁。画中的少女渐渐抬起眼睛，对他微笑。他等着她们说话，屋里却始终没有一点声音。这时，他发现其中一扇窗被白绸帘子遮住了。
        - id: ch01-b09
          speaker: narrator
          text: >-
            他掀开帘子，看见一位姑娘。她美得像灿烂的白昼，又悲伤得像一座坟墓。她穿着白袍，腰间束着银带，头上戴着珍珠王冠。王子一动不动地看着，仿佛也成了石头。姑娘脸上的哀愁一点点落进他心里。
        - id: ch01-b10
          speaker: prince
          text: >-
            她就是我的妻子。除了她，我谁也不娶。
        - id: ch01-b11
          speaker: narrator
          text: >-
            姑娘顿时红了脸，低下头去。其余少女的身影全都消失了。王子赶回父王身边，把塔里的一切和自己的选择都说了出来。老国王越听越忧伤。
        - id: ch01-b12
          speaker: king
          text: >-
            儿啊，你揭开了本来藏着的东西，这件事做得不好。那姑娘落在一个邪恶巫师手中，巫师住在铁城堡里。许多年轻人都去救过她，可没有一个回来。现在说什么也迟了。你许下的诺言不能反悔。去面对自己的命运吧，但愿你能平安归来。
          emotion: sad
        - id: ch01-b13
          speaker: narrator
          text: >-
            王子拥抱父亲，骑上马，出发寻找新娘。他兴冲冲走了几个钟头，闯进一片陌生的森林，很快就在弯曲的小路和深谷间迷失方向。他一次次停下来寻找方向，可树木密得连太阳都遮住了。他分不清哪边是北，哪边是南，更不知道该朝哪里走。王子越来越绝望，最后连走出这片可怕森林的希望也放弃了。就在这时，背后忽然有人高喊。
        - id: ch01-b14
          speaker: long
          text: >-
            喂！前面的人，等一等！
        - id: ch01-b15
          speaker: narrator
          text: >-
            王子回头一看，一个高得出奇的人正在拼命追赶。那人跑到跟前，累得直喘气。
        - id: ch01-b16
          speaker: long
          text: >-
            请等我一下，收我做您的仆人吧。您若肯收下我，往后绝不会后悔。
        - id: ch01-b17
          speaker: prince
          text: >-
            你是什么人？会什么本领？
        - id: ch01-b18
          speaker: long
          text: >-
            我叫长人，想把身子伸多长，就能伸多长。您看见松树顶上的鸟巢了吗？不用爬树，我也拿得到。
        - id: ch01-b19
          speaker: narrator
          text: >-
            长人越长越高，很快就跟松树齐了。他取下鸟巢，放进口袋，眨眼间又缩回原样。
        - id: ch01-b20
          speaker: prince
          text: >-
            你的本事确实不小。可我早就不玩鸟巢了。你要是真能带我走出这片森林，那才对我有用。
        - id: ch01-b21
          speaker: long
          text: >-
            这有什么难的？
        - id: ch01-b22
          speaker: narrator
          text: >-
            长人一直伸到比最高的树还高三倍，四面望了望，便指明出去的方向。他缩回身子，牵着王子的马，很快走出森林。前面是一片宽广的平原，尽头堆着高高的岩石，岩间零星长着树，远看就像一座城的防御工事。
    - id: ch02
      title: 三个奇人
      blocks:
        - id: ch02-b01
          speaker: long
          text: >-
            殿下，我有个伙伴正朝这里来。您也把他收下吧，他会帮上大忙。
        - id: ch02-b02
          speaker: prince
          text: >-
            那就叫他过来，让我看看他是什么样的人。
        - id: ch02-b03
          speaker: long
          text: >-
            他离得太远，听不见我喊。他背的东西又多，一时赶不过来，我还是亲自去接他吧。
        - id: ch02-b04
          speaker: narrator
          text: >-
            长人的身体直伸进云里，连脑袋也看不见了。他只迈两三步，就找到伙伴，把他背到王子面前。来人胖得惊人，圆滚滚的像一只木桶。
        - id: ch02-b05
          speaker: prince
          text: >-
            你是什么人？又会做什么？
        - id: ch02-b06
          speaker: broad
          text: >-
            殿下，我叫阔人。我愿意变得多宽，就能变得多宽。
        - id: ch02-b07
          speaker: prince
          text: >-
            那就把本领使出来，让我看看。
        - id: ch02-b08
          speaker: broad
          text: >-
            快跑，殿下！使劲往树林里跑，躲起来！
        - id: ch02-b09
          speaker: narrator
          text: >-
            阔人一边喊，身子一边向外膨胀。王子还没弄懂为什么要逃，见长人已经飞奔进树林，也赶紧跟上。他刚刚躲好，阔人的身子就猛地铺展开来，差一点把他和马一起撞倒。方圆好几亩都被阔人占满了。那模样，简直就是一座山。
        - id: ch02-b10
          speaker: narrator
          text: >-
            过了一会儿，阔人不再变大。他深吸一口气，震得整片森林发抖，随后缩回了原样。
        - id: ch02-b11
          speaker: prince
          text: >-
            你可把我吓得逃进树林了。不过，你这样的人不是天天都能遇见。我愿意收下你。
        - id: ch02-b12
          speaker: narrator
          text: >-
            三人继续赶路。快到岩山时，他们遇见一个人，那人的双眼蒙着布带。
        - id: ch02-b13
          speaker: long
          text: >-
            殿下，这是我们的第三位伙伴。您最好也收他做仆人。我敢保证，他吃您的饭绝不会白吃。
        - id: ch02-b14
          speaker: prince
          text: >-
            你是谁？为什么蒙住眼睛？这样还能看见路吗？
        - id: ch02-b15
          speaker: quickeye
          text: >-
            正好相反，殿下。我就是看得太清楚，才不得不蒙住双眼。隔着布，我也跟常人看得一样清楚。摘掉布带，我的眼睛能穿透一切。能烧的东西会被目光点燃，烧不了的便会碎成千百块。人们都叫我千里眼。
        - id: ch02-b16
          speaker: narrator
          text: >-
            千里眼摘下布带，望向岩山。一声爆响传来，山岩很快散成一堆沙。沙中闪着亮光，他走过去捡起一块纯金，送到王子手上。
        - id: ch02-b17
          speaker: prince
          text: >-
            你真是个奇人，我若不收下你才是傻瓜。既然你看得这么远，就告诉我，铁城堡离这里还有多远？那边眼下在做什么？
        - id: ch02-b18
          speaker: quickeye
          text: >-
            若是您独自走，至少要一年。如今我们三个都在，今晚就能赶到。他们这会儿正在准备晚饭。
        - id: ch02-b19
          speaker: prince
          text: >-
            城堡里有位公主。你看得到她吗？
        - id: ch02-b20
          speaker: quickeye
          text: >-
            看得到。一个巫师把她关在高塔里，外面围着铁栅栏。
        - id: ch02-b21
          speaker: prince
          text: >-
            请你们帮我把她救出来！
        - id: ch02-b22
          speaker: narrator
          text: >-
            三个奇人都答应了。他们穿过千里眼在灰岩间打出的缺口，一路越过高山，走进深林。不管路上出现什么阻碍，三个伙伴总能用各自的本领把它移开。夕阳将落时，王子终于望见铁城堡一座座高耸的塔楼。太阳还没沉下地平线，他便跨上了通向城门的铁桥。他们刚刚过去，最后一点日光就消失了。铁桥自己升到空中，沉重的城门也在身后紧紧关上。
        - id: ch02-b23
          speaker: narrator
          text: >-
            这一下，他们再也没有回头路了。
    - id: ch03
      title: 铁城堡的第一夜
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            王子把马牵进马厩，那里收拾得整整齐齐，一切都像早知道会有客人来。四个人随后径直走进城堡。庭院里、马厩中，还有一座座宽阔的厅堂里，到处站着衣着华丽的人，可每一个都已化成石头。他们继续往里走，穿过一间又一间彼此相通的屋子，仿佛永远也走不到尽头。最后，眼前终于出现一座灯火通明的宴会厅。
        - id: ch03-b02
          speaker: narrator
          text: >-
            宴会厅里亮堂堂的，桌上摆满美酒和水果，餐具正好有四份。他们站在那里等了片刻，以为主人就要出现，可门内门外始终没有一个人影。四个人赶了很远的路，早已饿坏，便自己坐下来吃喝。等他们吃完晚饭，正要四处找个睡觉的地方，大门忽然砰地敞开了。
        - id: ch03-b03
          speaker: narrator
          text: >-
            一个年迈驼背的巫师走进大厅。他头顶秃秃的，灰胡子垂到膝盖，黑袍腰间箍着三道铁环。他牵着一位美丽得叫人惊叹的姑娘。姑娘穿白袍，束银带，戴着珍珠王冠，脸色却像死亡一样苍白悲伤。王子一眼认出她，急忙走上前去。巫师不许他开口。
        - id: ch03-b04
          speaker: wizard
          text: >-
            我知道你为什么来。很好，只要你连续三个晚上不让她逃掉，她便归你。要是有一次失败，你和仆人们就会跟先前那些人一样，全都变成石头。
        - id: ch03-b05
          speaker: narrator
          text: >-
            巫师替公主拉过一把椅子，让她坐下，随后独自离开。王子被她的美貌迷住了，眼睛怎么也移不开。他想让公主听见自己的声音，便不停同她说话。公主却一个字也不回答，脸上也没有一丝笑意。她静静坐在那里，真的就像一尊大理石像。
        - id: ch03-b06
          speaker: narrator
          text: >-
            王子坐在公主身边，打定主意彻夜不眠。长人把身体伸得像一条长带，沿着屋子围了一整圈。阔人堵在门口，胀得连老鼠也钻不过去。千里眼靠着大厅中央支撑屋顶的柱子。可才过半秒钟，四个人全都沉沉睡去，一觉睡到了天亮。
        - id: ch03-b07
          speaker: narrator
          text: >-
            第一缕曙光露出来时，王子猛然惊醒，公主已经不见了。他急忙叫醒仆人，求他们快想办法。
        - id: ch03-b08
          speaker: quickeye
          text: >-
            殿下，请您镇定。我已经找到她了。一百英里以外有片森林，中央长着一棵老橡树，树顶有颗橡子。那颗橡子就是公主。只要长人扛着我，我们马上能带她回来。
          emotion: calm
        - id: ch03-b09
          speaker: narrator
          text: >-
            绕一座农舍走一圈的工夫还没过去，两人就从森林赶了回来。长人把橡子递给王子。
        - id: ch03-b10
          speaker: long
          text: >-
            殿下，把它扔到地上。
        - id: ch03-b11
          speaker: narrator
          text: >-
            王子把橡子一扔，公主立刻出现在身边，他惊喜极了。太阳刚从群山上探出头，门又砰地打开。巫师大笑着进来，一看见公主，脸色立刻变黑。他低声咆哮，腰间一道铁环随即轰然崩断。巫师抓住公主的手，把她带走了。
        - id: ch03-b12
          speaker: narrator
          text: >-
            那一天，王子在城堡里四处游荡，察看里面稀奇古怪的宝物。他看到一个石头王子双手紧握着剑，那把剑永远停在挥出去的一瞬间。另一个骑士刚刚转身逃跑，也在那一刻变成了石头。还有一个仆人正把一块牛肉送向嘴边，从此再也吃不进去。周围还有许多人，全都保持着巫师说出“从今以后变成大理石”时的姿势。
        - id: ch03-b13
          speaker: narrator
          text: >-
            城堡内外没有一点生气。树上不长叶，田里不长草。河水一动不动，水中没有鱼。花儿不开，鸟儿也不唱。白天里，食物凭空出现三次。晚饭结束以后，巫师才再次现身，把公主交给王子。
    - id: ch04
      title: 第二次藏匿
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            这回四个人发誓，不管怎样都要保持清醒。可他们还是和前一晚一样睡着了。第二天早晨，王子睁开眼睛，房间里又只剩下他们四个。他又惭愧又难受，赶紧奔到千里眼身边。
        - id: ch04-b02
          speaker: prince
          text: >-
            醒醒！千里眼，快醒醒！你知道公主去了哪里吗？
        - id: ch04-b03
          speaker: quickeye
          text: >-
            知道，我看见她了。两百英里以外有一座山，山腹里藏着岩石，岩石里面又藏着一颗宝石。那颗宝石就是公主。长人带我过去，您还没来得及转身，我们便能回来。
        - id: ch04-b04
          speaker: narrator
          text: >-
            长人扛起千里眼，立刻动身。他每迈一步，脚下就越过二十英里。快到山边时，千里眼摘下布带，用燃烧的目光盯住山体。整座山顷刻裂开，散成千百块碎石，其中一块正闪着宝石的光。他们把宝石捡起来，沿原路飞奔，很快送回王子手中。
        - id: ch04-b05
          speaker: narrator
          text: >-
            王子连忙把宝石摔到地板上。宝石刚落地，公主就站在他面前。巫师随即到来，愤怒得双眼冒火。只听咔嚓一声，他腰间第二道铁环也断了。巫师比前一天吼得更凶，抓起公主的手，把她带走。
        - id: ch04-b06
          speaker: narrator
          text: >-
            接下来的一天和前一天没有两样。直到吃完晚饭，巫师才把公主领回来。他直直盯着王子的眼睛。
        - id: ch04-b07
          speaker: wizard
          text: >-
            到最后究竟谁能得到她，我们等着瞧！
          emotion: angry
        - id: ch04-b08
          speaker: narrator
          text: >-
            第三夜，四个人为了不睡着，连坐都不肯坐，只在屋里来回走动。可是那股睡意谁也抵挡不了。他们一个接一个倒下，第三次让公主从眼前消失。
    - id: ch05
      title: 黑海里的金戒指
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: >-
            早晨，仍旧是王子最先醒来。公主果然不见了，他又奔到千里眼面前。
        - id: ch05-b02
          speaker: prince
          text: >-
            快起来，千里眼！求你告诉我，公主究竟在哪里？
        - id: ch05-b03
          speaker: narrator
          text: >-
            千里眼望了好一阵，才找到公主的踪迹。
        - id: ch05-b04
          speaker: quickeye
          text: >-
            殿下，她离得很远，非常远。三百英里外有一片黑海，海中央有只小贝壳，贝壳里嵌着一枚金戒指。那枚戒指就是公主。不过您别太忧心，我们一定会带她回来。只是今天还得把阔人带上，没有他的本领可不行。
          emotion: calm
        - id: ch05-b05
          speaker: narrator
          text: >-
            长人一边肩膀扛着千里眼，另一边扛着阔人，迈开大步出发了。他每走一步，就把三十英里抛在身后。来到黑海边，千里眼指出贝壳所在的位置。长人把手臂伸到极限，仍旧够不着。原来贝壳沉在海底。
        - id: ch05-b06
          speaker: broad
          text: >-
            伙伴们，稍等一下，不会有事的。我来帮你们。
          emotion: calm
        - id: ch05-b07
          speaker: narrator
          text: >-
            阔人不断胀大，仿佛整个世界都快容不下他。他俯身喝起海水，每一口都吞下多得吓人的水。只过一两分钟，海面便降了下去，长人的手终于够到海底。他摸出贝壳，取下里面的金戒指。
        - id: ch05-b08
          speaker: narrator
          text: >-
            可他们已经耽搁不少时间，长人肩上又扛着两个人，回去的路比前两次更加艰难。等三人赶回城堡，东方的天色正在飞快变亮。王子独自在大厅里等着他们，迟迟看不见金戒指，心里怕得要命。
        - id: ch05-b09
          speaker: narrator
          text: >-
            第一缕阳光从山顶探出，门猛地打开。巫师看见只有王子一个人，立刻放声狂笑。可笑声还没停，窗子就哗啦一声碎成千百片。一枚金戒指闪着光飞进屋里，公主紧接着出现在巫师面前。
        - id: ch05-b10
          speaker: narrator
          text: >-
            千里眼远远看见王子处境危险，马上告诉长人。长人把全部力气聚在这一下，隔着遥远的路程，将戒指径直投进城堡的窗户。
        - id: ch05-b11
          speaker: narrator
          text: >-
            巫师尖叫起来，愤怒的吼声震动了整座城堡。随后传来一声巨响，第三道铁环裂成两半。一只黑乌鸦从巫师那里飞出窗外，再也没有回来。
        - id: ch05-b12
          speaker: narrator
          text: >-
            公主身上的沉默魔法终于消失了。她的脸红得像玫瑰，转向救了自己的王子。
        - id: ch05-b13
          speaker: princess
          text: >-
            谢谢您。我从没想到，自己真的会有获救的一天。
          emotion: happy
    - id: ch06
      title: 城堡重获生命
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: >-
            黑乌鸦飞走以后，重获生命的并不只有公主。所有大理石像都变回活人，接着去做受咒以前没做完的事。马儿在厩里嘶鸣，花朵在园中开放，鸟儿重新飞上天空，鱼儿也在河水里穿梭。放眼望去，处处是生命，处处是欢乐。
        - id: ch06-b02
          speaker: narrator
          text: >-
            曾经化为石头的骑士们一同来到王子面前，要向解救他们的人表达敬意。
        - id: ch06-b03
          speaker: prince
          text: >-
            请不要谢我，我其实什么也没做。要不是长人、阔人和千里眼忠心帮助，我早就和你们一样，也成了一尊石像。
        - id: ch06-b04
          speaker: narrator
          text: >-
            王子说完，便向骑士们一一告别。他带着公主和三个忠实伙伴，踏上返回父王国度的路。老国王等了太久，早已不敢再盼望儿子活着归来。如今王子真的带着新娘站在眼前，他望着儿子，欢喜的眼泪不停往下流，还坚持要他们尽快举行婚礼，一天也不要再耽搁。
        - id: ch06-b05
          speaker: narrator
          text: >-
            所有曾在铁城堡里受过魔法的骑士都接到了邀请。婚礼举行过后，长人、阔人和千里眼也来向新婚夫妇辞行。他们说，自己该去找新的事情做了。
        - id: ch06-b06
          speaker: narrator
          text: >-
            王子舍不得他们离开。他答应三个人，只要愿意留下，不管心里想要什么，都能得到。可他们不喜欢无所事事的生活。若没有事情可忙，他们便不会快乐。
        - id: ch06-b07
          speaker: narrator
          text: >-
            于是，长人、阔人和千里眼离开王宫，各自寻找新的际遇去了。据我所知，他们直到今天还在寻找呢。
