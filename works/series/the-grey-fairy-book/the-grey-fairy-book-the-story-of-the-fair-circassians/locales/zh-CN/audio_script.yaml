audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 亲切从容，保留古老童话的神秘感
        timbre: 温暖清晰
        pace: 舒缓
        pitch: 中音
    dely:
      display_name: 德莉
      tts:
        delivery: 聪敏坦率，讲到悲痛往事时克制而深情
        timbre: 明亮柔美
        pace: 适中
        pitch: 中高音
    tezila:
      display_name: 特齐拉
      tts:
        delivery: 温柔机敏，感情真挚
        timbre: 柔和清亮
        pace: 适中
        pitch: 中高音
    prince_delicate:
      display_name: 德利凯特王子
      tts:
        delivery: 年轻热烈，彬彬有礼
        timbre: 清澈柔和
        pace: 适中
        pitch: 中高音
    thelamis:
      display_name: 特拉米斯
      tts:
        delivery: 自信果断，嫉妒时急躁凌厉
        timbre: 明朗坚实
        pace: 适中
        pitch: 中音
    dervish:
      display_name: 托钵僧
      tts:
        delivery: 老练神秘，言语沉着
        timbre: 苍老低沉
        pace: 稍慢
        pitch: 低音
    bassa:
      display_name: 海上巴沙
      tts:
        delivery: 威严厚道，遇到家人时温和
        timbre: 浑厚稳重
        pace: 稍慢
        pitch: 低音
    azemi:
      display_name: 阿泽米
      tts:
        delivery: 机灵大胆，说话恭敬却藏着得意
        timbre: 清朗灵活
        pace: 适中偏快
        pitch: 中音
    hassan:
      display_name: 哈桑
      tts:
        delivery: 多愁善感，欢喜时热情奔放
        timbre: 年轻醇厚
        pace: 适中
        pitch: 中音
  chapters:
    - id: ch01
      title: 离开切尔克斯
      blocks:
        - id: ch01-b01
          speaker: dely
          text: >-
            我和姐姐特齐拉出生在切尔克斯一个穷苦人家，我叫德莉。我们除了美貌，没有别的倚仗。父母便用心教导我们，把一切能取悦于人的本领都教给了姐妹俩。我们学得很快，从小便会弹奏各样乐器，也能唱歌，尤其擅长跳舞。我们的性情又活泼又快活。后来虽受尽磨难，这份天性倒一直没有丢，直到今天还是如此。
        - id: ch01-b02
          speaker: dely
          text: >-
            我们很容易满足，对家里的生活也十分称心。一天早晨，苏丹派来挑选妻妾的官员看中了我们，被姐妹俩的美貌深深打动。我们早知道美貌迟早会带来这样的命运，也只好认了。偏在等待进宫的时候，两个年轻人来到家中。年长的约二十岁，头发乌黑，一双眼睛亮得出奇。另一个最多十五岁，皮肤白皙，容貌十分秀美，就算扮成姑娘，恐怕也没人看得出来。
        - id: ch01-b03
          speaker: dely
          text: >-
            两人怯生生地敲门，说迷了路，请求借宿。父母迟疑一会儿，还是让他们进了我们所在的房间。父母都被他们的容貌打动，我们自然也不例外。一想到第二天就要进宫，心里忽然再也无法忍受。
        - id: ch01-b04
          speaker: dely
          text: >-
            夜里我醒来，发现年幼的陌生人坐在床边，正握着我的手。
        - id: ch01-b05
          speaker: prince_delicate
          text: >-
            美丽的德莉，别怕我。我从来不懂爱情，直到见了你。我是黑大理石岛国王的儿子，名叫德利凯特。与我同行的特拉米斯是我国最富有的贵族之一，他知道的秘密连苏丹也会眼红。我们离开故乡，是因为父王逼我迎娶一位绝色姑娘，只因她有一只眼睛比另一只稍小一点儿。
        - id: ch01-b06
          speaker: dely
          text: >-
            他这么快便爱上我，叫我的虚荣心得到了满足。那番倾诉也实在动人。我慢慢抬起眼睛望他，只这一眼，王子便激动得几乎失去理智，向前一栽，昏倒在我面前。我吓得浑身僵住，不敢移动。幸好特齐拉匆忙披上衣服赶来，特拉米斯也跟着她，大家一起救助王子，过了好一阵才全都恢复过来。
        - id: ch01-b07
          speaker: dely
          text: >-
            大家缓过来后，我们说起当天就要去君士坦丁堡，不由得一同哀叹。特拉米斯保证，他和王子会一路跟着，总能想出办法同我们说话，我们才稍稍安心。两人吻过我们的手，从侧门离开。没过多久，父母来报护送的人到了。我们与他们告别，登上骆驼，坐进固定在骆驼两侧的厢笼。每只厢笼都很宽敞，足够一个人舒舒服服地睡觉。上方还有一扇窗口，我们一路都能看见经过的乡野。
        - id: ch01-b08
          speaker: dely
          text: >-
            走了几天，我们始终担心将来的命运。一天，我从窗口向外望，忽然听见有人叫我。一个衣着华美的姑娘从骆驼另一侧跳出来，我一眼就认出那是王子，欢喜得心都快跳出胸口。
        - id: ch01-b09
          speaker: prince_delicate
          text: >-
            是特拉米斯叫我换上女装。他自己扮作奴隶贩子，要把我这位绝世美人献给苏丹。他还说服商队领队，把空厢笼租给我们。这样，我便能从那边爬出来见你。
        - id: ch01-b10
          speaker: dely
          text: >-
            这个妙计使我们欣喜极了，隔着窗口的交谈也十分愉快。可王子来到我们这一侧以后，骆驼两边失去平衡，走得歪歪扭扭。侍从察觉不对，赶来查看出了什么事。幸好他们的动作很慢，王子赶在他们走近以前爬回自己的厢笼，两边恢复平衡，整个机关才没有被人看穿。
        - id: ch01-b11
          speaker: dely
          text: >-
            王子和特拉米斯绝不肯让我们进苏丹的宫殿，却一直想不出逃走后该去哪里。快到君士坦丁堡时，特拉米斯结识了一位神圣的托钵僧。他谎称我们是自己的姐妹，正违背他的意愿被卖作奴隶。老人很同情，答应只要我们逃得出守卫的监视，就给我们一个藏身之所。这很危险，却是唯一的生路。
        - id: ch01-b12
          speaker: dely
          text: >-
            当夜，商队里所有人都沉沉睡去。我们轻轻掀开厢笼的顶盖，由特拉米斯扶着，一点声音也没发出便爬了出来。大家先沿来路往回走了很远，免得被守卫发现，接着转上另一条岔路，终于来到托钵僧安排的住处。那里已经备好食物，也有安稳的地方让我们休息。再次摆脱看守，重新获得自由，心里的快活真是说也说不尽。
    - id: ch02
      title: 护符与黑大理石岛
      blocks:
        - id: ch02-b01
          speaker: dely
          text: >-
            托钵僧很快也被我们的美貌迷住。第二天，他带我们去附近一家客店，说那里有两个犹太人，他们身上的珍贵护符本不属于自己。
        - id: ch02-b02
          speaker: dervish
          text: >-
            你们想个法子，把那两件护符拿到手。
        - id: ch02-b03
          speaker: dely
          text: >-
            那家店虽不在去君士坦丁堡的大路上，饭菜却出了名，店里已有六七个客人。大家客气地招呼我们一起入席。那两个犹太人到来后，托钵僧使个眼色，姐姐和我便分别让他们坐在身边。
        - id: ch02-b04
          speaker: dely
          text: >-
            托钵僧先前无意间提过，他们的兄弟曾经跳舞。当时我们没留意，如今忽然想起，便决定让这两人也跳一场。为了达到目的，我们把所有迷人的本领都使了出来。他们很快便对我们百依百顺，再也拒绝不了任何要求。到了傍晚，两件护符都归了我们，那两个人则被留在那里，听凭命运处置。王子和特拉米斯比从前更爱我们，还郑重宣称，世上再没有比我们姐妹更美的女子。
        - id: ch02-b05
          speaker: dely
          text: >-
            离开客店时，太阳已经落下，我们却连下一步去哪里也没有商量好。王子提议别再耽搁，立刻乘船前往黑大理石岛，我们便欣然接受。那座岛真叫人吃惊。岸边耸立着比黑玉还黑的峭壁，岩石投下浓重阴影，仿佛整片国土都被黑暗罩住。船上的水手从未来过这里，几乎同我们一样害怕。好在特拉米斯主动做了领航人，终于把船平安带到海滩。
        - id: ch02-b06
          speaker: dely
          text: >-
            越过黑玉般的海岸峭壁，眼前却是另一番景象。田野比别处更绿，溪水更加清澈，阳光也格外明亮。百姓们拥到王子周围，热烈欢迎他们一向爱戴的人，却告诉他，国王仍在为两件事发怒。一件是他拒绝迎娶表妹奥金帕蕾公主，另一件便是他私自出逃。大家都求他千万不要进京，否则性命只怕保不住。我虽很想看看心爱王子的家乡，仍恳求他听从这番明智的劝告。于是我们一起去了特拉米斯位于茫茫森林中央的宫殿。
        - id: ch02-b07
          speaker: dely
          text: >-
            我和姐姐从小住在茅屋，那座粉红色大理石宫殿在我们眼里简直是仙境。每一块石头都打磨得光亮如镜，四周的鲜花和溪流清清楚楚地映在墙面上。为了衬我的黑发，宫里特意给我布置了一套房间，里面到处是黄色绸缎和白银饰物。姐妹俩每天都有崭新的衣服，还有奴仆随时服侍。那段日子实在幸福。可惜，它为什么不能永远继续下去呢？
        - id: ch02-b08
          speaker: dely
          text: >-
            特拉米斯明知王子的心属于我，却仍嫉妒姐姐同王子亲切来往。每天总有温柔的责怪和解释。不过特齐拉一哭，他必定跪下求她原谅。
        - id: ch02-b09
          speaker: dely
          text: >-
            这样的日子过了几个月，国王病危的消息忽然传来。我劝王子立刻回宫，一来该去探望父亲，二来也要让元老和贵族亲眼见到王位继承人。可他爱我胜过渴望王冠，迟迟不肯离开，仿佛已经预见后来会发生的灾祸。最后，特齐拉当着特拉米斯的面，十分认真地劝了他一番。他终于决定前往，却一再向我们保证，天黑以前一定会回到宫殿。
    - id: ch03
      title: 错换的头颅
      blocks:
        - id: ch03-b01
          speaker: dely
          text: >-
            天黑了，王子仍没回来。特齐拉觉得是自己劝走了他，显得很不安，特拉米斯立刻又起疑心。我更是痛苦得无法入睡，只好沿王子离开的路走进森林。远处忽然响起马蹄声，王子很快跃下马，来到我身边。
        - id: ch03-b02
          speaker: prince_delicate
          text: >-
            德莉，我真是爱你爱得发狂。特拉米斯的爱情永远比不上我的！
          emotion: happy
        - id: ch03-b03
          speaker: dely
          text: >-
            他话音刚落，我便听见身后一声轻响。我们还来不及回头，两颗脑袋已经滚到面前。
        - id: ch03-b04
          speaker: thelamis
          text: >-
            你们两个背信弃义的东西，回答我！特齐拉，你为什么这样无情地背叛我？
          emotion: angry
        - id: ch03-b05
          speaker: dely
          text: >-
            原来他怒火蒙心，把我错认成姐姐。我的脑袋只能用微弱的声音回答他。
        - id: ch03-b06
          speaker: dely
          text: >-
            唉，我不是特齐拉，我是德莉。你杀了我，也杀了自己的朋友。
          emotion: sad
        - id: ch03-b07
          speaker: dely
          text: >-
            特拉米斯停下来想了片刻，语气终于缓和。
        - id: ch03-b08
          speaker: thelamis
          text: >-
            不必害怕，我有办法让你们恢复完整。
        - id: ch03-b09
          speaker: dely
          text: >-
            他把魔法粉末撒在我们舌上，再将脑袋放回脖子。转眼间，头颅便同身体接合，连疤也没留下。可他仍被怒火遮着眼，竟把我的脑袋安在王子身上，又把王子的脑袋安在我的身体上。
        - id: ch03-b10
          speaker: dely
          text: >-
            这场变化让我们浑身都觉得古怪，却又说不出哪里不对。我们不约而同地抬起手来。王子摸到的头发梳成了女子的式样，我则伸手去抬压得额头发沉的头巾。夜色太黑，我们仍不知道真相。就在这时，特齐拉出现了，身后跟着一群手捧鲜花的奴仆。借着他们的火把，我们才看清彼此的模样。说来可笑，我们最初甚至以为只是互相换了衣服。
        - id: ch03-b11
          speaker: dely
          text: >-
            人总是更喜欢自己的身体。我们虽深爱彼此，刚开始也有些恼恨特拉米斯。王子倒很快为这场变化高兴起来。
        - id: ch03-b12
          speaker: prince_delicate
          text: >-
            现在我的幸福才算十全十美。德莉，我的心早就是你的，如今连脑袋也是你的了。
          emotion: happy
        - id: ch03-b13
          speaker: dely
          text: >-
            特拉米斯却为自己的愚蠢羞愧不已。
        - id: ch03-b14
          speaker: thelamis
          text: >-
            我还有两粒同样有魔力的药丸。让我再砍一次你们的头，这回一定能放对。
        - id: ch03-b15
          speaker: dely
          text: >-
            这个办法听来诱人，却太冒险。我们商量后，还是决定维持现状。
        - id: ch03-b16
          speaker: thelamis
          text: >-
            既然不肯接受，以后可别怪我。不过，你们收好这两粒药。万一又被砍头，就照我刚才的办法做，各人便能找回自己的脑袋。
        - id: ch03-b17
          speaker: dely
          text: >-
            我们带着药丸回到城堡，错换头颅造成的麻烦却刚刚开始。我的脑袋根本没想自己如今长在谁身上，照旧领着王子的身体走向我的房间。侍女们只看衣服，认定我走错了长廊，还叫来奴仆，把我送进王子的房间。这已经够难堪了。偏偏夜还没过去，我的仆人便动手替我脱衣。我又惊又窘，险些当场昏倒。城堡另一头，顶着王子脑袋的那副身体想必也正受着同样的折磨。
        - id: ch03-b18
          speaker: dely
          text: >-
            第二天早晨，我们已经稍稍习惯。你们不难猜到，那一夜我们谁也没有睡好。走到镜前一看，王子有了黝黑的皮肤和乌亮的头发，我的脑袋却顶着他那头卷曲金发。第一天过去以后，宫里的人也全习惯了这场变化，谁都不再盯着我们看，也不再觉得稀奇。
    - id: ch04
      title: 王位与死亡
      blocks:
        - id: ch04-b01
          speaker: dely
          text: >-
            几星期后，国王去世。王子的脑袋装着称王的雄心，急着进京继位。可贵族会承认一个长着姑娘身体的王子吗？仔细一想，我们两个究竟谁是王子、谁是姑娘，也很难说清。
        - id: ch04-b02
          speaker: dely
          text: >-
            大家争论了很久，最后还是我的脑袋占了上风，决定立刻启程。到了京城才知道，老国王早已指定奥金帕蕾公主继位。大部分元老和贵族公开承认，他们其实宁愿拥立合法的王位继承人。可眼前一个长着王子的身体，一个顶着王子的脑袋，他们无论看谁都认不出完整的王子。最后，他们索性把我们两个都当成冒名顶替的骗子，一起投入监牢。
        - id: ch04-b03
          speaker: dely
          text: >-
            几天后，跟随我们进京的特齐拉和特拉米斯来到监牢。他们说，新女王控告我们犯了叛国罪，还亲自出席审判。荒唐的是，整场审判根本没有让我们两个被告到场。他们一直怕得要命，不知道法官会判下怎样的刑罚。谁知据特拉米斯说，我们的运气好得出奇，因为最后的判决竟是斩首。我对姐姐说，自己实在看不出这份好运究竟好在哪里。特拉米斯听见后，粗暴地打断了我。
        - id: ch04-b04
          speaker: thelamis
          text: >-
            这还不明白吗？我当然会用那两粒药丸，然后……
        - id: ch04-b05
          speaker: dely
          text: >-
            他没能说完。奥金帕蕾不许拖延，官差已经来押我们去大广场。那里人山人海，中央搭着行刑台，戴黑面罩的刽子手守在一旁。我先登台，转眼间，脑袋已经滚到他脚边。
        - id: ch04-b06
          speaker: dely
          text: >-
            特齐拉和特拉米斯立刻跃到我身旁。特拉米斯闪电般夺过弯刀，又砍下王子的头。人群还没回过神，我们的脑袋已经回到各自真正的身体上，药丸也放进舌间。特拉米斯把王子领到高台边缘。
        - id: ch04-b07
          speaker: thelamis
          text: >-
            看哪，这才是你们合法的国王！
        - id: ch04-b08
          speaker: dely
          text: >-
            特拉米斯的话音刚落，人群的欢呼声便震动长空，一直传进宫里。奥金帕蕾听见王子复位的消息，绝望得倒在阳台上，失去了知觉。奴仆们只得把她抬起来，送回自己的宅邸。可就在全国百姓为王子欢呼时，我们方才得到的喜悦却忽然全化成悲痛。我满怀深情地冲上高台，正要紧紧拥抱他，他的脸色突然变得惨白，脚下踉跄，身体也摇晃起来。
        - id: ch04-b09
          speaker: prince_delicate
          text: >-
            德莉，我到死都忠于你。而且，我死的时候已经是一位国王。
          emotion: sad
        - id: ch04-b10
          speaker: dely
          text: >-
            他把头靠在我肩上，安静地断了气。原来颈间的一根动脉被割断了。我神志全失，踉跄着去拿弯刀，只想马上追随他。特拉米斯及时抓住我的手，我却在疯狂中把刀反刺向他。刀锋穿透他的心脏，他倒在了我的脚下。
        - id: ch04-b11
          speaker: narrator
          text: >-
            众人屏住呼吸听到这里。德莉已经说不下去，特齐拉也扑在软垫上，掩住了脸。赞巴克命女仆好好照料，把昏迷的姐妹俩抬进自己的房间。
        - id: ch04-b12
          speaker: narrator
          text: >-
            易卜拉欣一向谨慎，却提议趁姐妹俩昏迷时搜身，看看西罗科女儿的护符是否藏在她们那里。巴沙认为这样对待客人太无礼，坚决不答应。他希望第二天能劝她们自愿交出护符。
    - id: ch05
      title: 阿泽米找回两块表
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: >-
            此时已近午夜。南吉尔站在苏米身边，取出阿让蒂娜的画像。听说真人甚至比画像更美，他喜不自胜。大家踮着脚等待时钟敲响十二下，盼着金表和银表回来寻找苏米。巴沙不愿耽搁片刻，命人把所有门统统敞开。门果然开了，走进来的却不是大家朝思暮想的两块手表，而是先前因无礼插嘴、受罚赶走的侍童。
        - id: ch05-b02
          speaker: bassa
          text: >-
            阿泽米，我不是命令你不许再出现在我面前吗？
          emotion: angry
        - id: ch05-b03
          speaker: azemi
          text: >-
            大人，我一直藏在门外，听两位切尔克斯姑娘讲故事。我知道您爱听故事，也让我讲一个吧。我保证不会很长。
        - id: ch05-b04
          speaker: bassa
          text: >-
            那就讲吧。不过，你可要当心自己的话。
        - id: ch05-b05
          speaker: azemi
          text: >-
            今天早晨，我在城里看见一个男子，身后跟着奴仆。他先买面包，又到几家店买了许多食物。奴仆再也拿不下时，他便吩咐奴仆回家，准备午夜的晚餐。
        - id: ch05-b06
          speaker: azemi
          text: >-
            男子独自走进珠宝铺，出来时拿着一块银表。走出几步，他又从脚边捡起一块金表。我跑上去，说他若不分我一半价钱，我就去卡迪那里告发。他把我领回家，给了我四百枚塞金。我拿到钱便走了。
        - id: ch05-b07
          speaker: azemi
          text: >-
            后来我陪您去见卡迪，听完三个犹太人的故事，才明白那两块表何等要紧。我立刻赶回陌生人的家，可他已经外出，只有奴仆在。我谎称带来了要紧消息。奴仆以为我是主人朋友，请我进去等候，正好把我领进放着两块表的房间。我把手表收进口袋，给金表留下四百枚塞金，又给银表留下买它所花的三枚金币。反正这些手表从不会留在买主手里，那人能收回钱，已经十分走运。我已经替两块表上好发条。就在此刻，奥萝拉和阿让蒂娜正锁在我的房里，安安全全。
        - id: ch05-b08
          speaker: narrator
          text: >-
            众人欢喜得拥住阿泽米，险些叫他喘不过气。南吉尔恨不得立刻破门，可他连侍童住在哪里都不知道。阿泽米请求亲自去接两位姑娘，很快便一手牵着一个，把她们领来。
        - id: ch05-b09
          speaker: narrator
          text: >-
            屋里顿时欢喜得乱成一团。易卜拉欣跪到奥萝拉面前，在她裙子的第五道褶里找到了那颗珊瑚珠。《魔法书》果然没有说错。念珠完整了，他漫长的寻觅也结束了。只有哈桑还满面愁容。
        - id: ch05-b10
          speaker: hassan
          text: >-
            唉，大家都幸福了，只有我仍旧可怜。从前我还能安慰自己，至少有一个兄弟和我同样不幸。现在，连这点安慰也没了。
          emotion: sad
        - id: ch05-b11
          speaker: bassa
          text: >-
            别灰心。偷走粉红袋子的托钵僧，迟早一定能找到。
          emotion: calm
        - id: ch05-b12
          speaker: narrator
          text: >-
            随后，晚餐摆上了桌。席间有许多珍奇果实，大家尝过以后，都觉得那滋味胜过世间的一切美食。等众人吃饱，巴沙命人取来装着爱情灵药的瓶子，让相爱的年轻人一起喝下。药液入口，他们眼里仿佛燃起了新的火焰，当场彼此发誓，无论未来发生什么，都要忠贞相爱，直到死亡把他们分开。
        - id: ch05-b13
          speaker: narrator
          text: >-
            仪式刚刚结束，时钟便敲响一点。奥萝拉和阿让蒂娜转眼消失，她们方才站立的地方只剩两块表。大家都把魔法忘得干干净净，屋里一下陷入寂静。这时阿泽米开口，请求替苏米保管两块手表直到第二天。他还拿自己的脑袋担保，一定会让两位姑娘永远摆脱咒语。苏米同意后，巴沙便答应了。为了酬谢侍童已经立下的功劳，他又送给阿泽米一只钱袋，里面装着整整一千枚塞金。安排妥当，众人才各自回房休息。
    - id: ch06
      title: 六场婚礼
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: >-
            阿泽米从没拥有过这么多钱，整夜欢喜得睡不着。天一亮，他便到花园里琢磨解咒的办法。忽然，他听见女子柔和的说话声。透过灌木一看，特齐拉正在替德莉把鲜花插进头发。树叶沙沙一响，德莉起身要逃。阿泽米赶紧求她留下，请她说说爱人死后发生了什么，又是怎样找到托钵僧的。
        - id: ch06-b02
          speaker: dely
          text: >-
            奥金帕蕾罚我们带着满腔悲伤，在当天的全国庆典上唱歌跳舞。这个命令几乎逼疯了我们。于是我们发誓，要让天下恋人都像我们一样痛苦。这个打算太成功了。没过多久，京城的贵妇便结伴去求女王，赶在我们彻底毁掉她们的生活以前，把我们逐出国境。女王答应了，下令把姐妹俩和奴仆古卢库送上船。
        - id: ch06-b03
          speaker: dely
          text: >-
            到了海岸，我们看见一个老人正在淹死几只小黑猪，还不停地同它们讲话。
        - id: ch06-b04
          speaker: dervish
          text: >-
            你们这一族都该受诅咒！得到我魔法手镯的人遭受的一切灾祸，全是你们害的。统统去死吧！
          emotion: angry
        - id: ch06-b05
          speaker: dely
          text: >-
            我们走近一看，原来是第一次逃离商队时收留我们的托钵僧。他认出我们，高兴得忘乎所以，邀请我们住进洞窟。我们欣然答应，还带上了最后那只小猪，那是他送的礼物。
        - id: ch06-b06
          speaker: dervish
          text: >-
            海上巴沙愿意出任何价钱买下这只猪。
        - id: ch06-b07
          speaker: dely
          text: >-
            我没问它为何珍贵，只把它放进针线袋。昨天我们拿给巴沙，他却嘲笑我们。姐妹俩气恨托钵僧，趁他睡着剪掉胡子。如今他羞得不敢见人。
        - id: ch06-b08
          speaker: azemi
          text: >-
            这样美丽的人，不该把一生浪费在叫别人痛苦上。忘掉不幸的过去，想想将来吧。德莉，请收下这块表，让它替你记住前方明亮的时光。特齐拉，这块银表送给你。它虽不如金表贵重，却是我仅剩的礼物。你一定有一枚银印章，挂在它上面正合适。
        - id: ch06-b09
          speaker: dely
          text: >-
            对呀，姐姐，你的确有银印章。把它系在银表上，我也把自己的金印章挂起来。
        - id: ch06-b10
          speaker: narrator
          text: >-
            姐妹俩取出印章。阿泽米猜得不错，那正是她们从伊齐夫和伊祖夫手里夺来的护符，只是分别镶上了金银。两块表闪电般滑落，奥萝拉和阿让蒂娜出现在眼前，护符也回到她们指间。久违的阳光和突来的变化令她们迷惘。等明白魔法终于解除，她们欢喜得说不出话。
        - id: ch06-b11
          speaker: narrator
          text: >-
            切尔克斯姐妹失去护符，怎么劝也无法宽心。奥萝拉和阿让蒂娜请她们擦干眼泪，说父亲西罗科是亚历山大城的总督，无论她们想要怎样的报答，父亲都不会拒绝。不久，西罗科本人便同巴沙和他的两个儿子来到花园，亲口证实了这番承诺。家里的女眷也很快赶来。只有哈桑不在，因为这正是他每天注定要对着乌木手哭泣的时辰。
        - id: ch06-b12
          speaker: narrator
          text: >-
            露台一角忽然喧闹起来。哈桑在奴仆簇拥下出现，一边拍手，一边欢呼。
        - id: ch06-b13
          speaker: hassan
          text: >-
            我正像往常一样哭，泪水忽然不肯再流了。低头一看，手上的黑色已经消失。美丽的泽丽达，现在再没有什么能拦着我把这只手献给你。我的心早就是你的了！
          emotion: happy
        - id: ch06-b14
          speaker: narrator
          text: >-
            哈桑只顾高兴，根本没问为何痊愈，其他人却想得明白。小黑猪一定死了，可它何时、怎样死的呢？奴仆说，早晨看见一名男子被三个人追赶，躲进他们奉命看守的洞窟。于是奴仆依照命令，用巨石封住洞口。
        - id: ch06-b15
          speaker: narrator
          text: >-
            奴仆的话还没说完，一阵尖厉的叫声便打断了他们。老托钵僧忽然从露台转角冲出来，三个犹太人紧紧追在后面。切尔克斯姐妹一眼便认出了老人。托钵僧看到花园里聚着这么多人，吓得立刻转上另一条小路，可奴仆很快追过去，把前后四个人全都抓住，押到主人面前。巴沙仔细一看，惊讶得几乎不敢相信。这位失去胡子的老人，正是从前把念珠、铜牌和手镯分别送给他三个儿子的人。
        - id: ch06-b16
          speaker: bassa
          text: >-
            神圣的老人家，别害怕，在我这里你很安全。只请告诉我们，你为什么会来到这儿？
          emotion: calm
        - id: ch06-b17
          speaker: dervish
          text: >-
            大人，两个切尔克斯姑娘趁我睡着剪掉胡子，我羞得不敢见人，只得带着粉红绸袋逃走。夜里，我遇到这三个人，同他们聊了一阵。天亮后，其中一人认出我就是纵容切尔克斯姑娘偷走护符的托钵僧。我想逃回洞窟，他们却追得更快。刚到您的花园，他们便抢走装着小黑猪的袋子，扔进海里。他们救了您的儿子，请您宽恕他们从前的过错，还要奖赏他们。
        - id: ch06-b18
          speaker: narrator
          text: >-
            巴沙答应了老人的请求，也宽恕并奖赏了那三个人。他看出其中两个犹太人已经拜倒在切尔克斯姐妹的魅力之下，便同意了他们的婚事，并把婚期定在伊扎夫和聪慧的苏米成婚的同一天。卡迪应召而来，犹太人摘下本族的帽子，换上先知信徒的头巾。经历了这么多灾难，巴沙的三个儿子再也不愿等待，恳求父亲不要继续拖延他们的幸福。正午时分，卡迪为六对新人一同举行了婚礼。
