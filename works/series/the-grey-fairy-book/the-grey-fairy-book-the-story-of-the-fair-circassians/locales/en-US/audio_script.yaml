  chapters:
    - id: ch01
      title: The Journey from Circassia
      blocks:
        - id: ch01-b01
          speaker: dely
          text: Tezila and I were born to poor parents in Circassia. She is my sister, and my name is Dely. Beauty was all we had to help us through life, so our parents trained us in every art that might give pleasure. We learned quickly. From childhood, we could play many instruments, sing, and best of all, dance. We were lively and merry then, and even after all our sorrows, we remain so today.
        - id: ch01-b02
          speaker: dely
          text: We had been content with our simple life at home. Then one morning, officials searching for wives for the Sultan saw us and were struck by our beauty. We had always known this might happen, and we had accepted our fate. But just then, two young men came into our house. The elder was about twenty, with black hair and brilliant eyes. The younger could not have been more than fifteen. He was so fair that he might easily have passed for a girl.
        - id: ch01-b03
          speaker: dely
          text: They knocked timidly and asked our parents for shelter, saying they had lost their way. Our parents hesitated over the strangers' request, then agreed and invited them into the room where we sat. The young men's beauty touched our hearts as much as it touched our parents'. Suddenly, the thought of leaving for the palace the next day became unbearable.
        - id: ch01-b04
          speaker: dely
          text: That night, I woke and found the younger stranger beside my bed. He took my hand.
        - id: ch01-b05
          speaker: prince_delicate
          text: Do not be afraid, lovely Dely. I never knew love until I saw you. I am Prince Delicate, son of the king of the Isle of Black Marble. My companion is one of the richest nobles in our country, and even the Sultan envies the secrets he knows. We left home because my father wanted me to marry a beautiful lady whose only fault was that one eye was a little smaller than the other.
        - id: ch01-b06
          speaker: dely
          text: Such a quick conquest flattered my vanity, and his declaration charmed me. I slowly turned my eyes toward him. One look from me nearly robbed him of his senses. He fainted and fell forward. I could not move until Tezila hurried in, hastily dressed, with the prince's noble friend, Thelamis.
        - id: ch01-b07
          speaker: dely
          text: Once we had all recovered from the prince's faint, we grieved over our fate and the journey to Constantinople that was to begin that very day. Thelamis gave us a little comfort. He promised that he and the prince would follow us every step of the way and somehow manage to speak with us again. We clung to that hope. Then the two men kissed our hands and slipped out by a side entrance before anyone else came.
        - id: ch01-b08
          speaker: dely
          text: A few moments later, our parents came to tell us the escort had arrived. We said farewell to them, mounted the camels, and settled into the traveling boxes fastened to the animals' sides. Each box was large enough for us to lie down and sleep in comfort. A window near the top let us look out over every part of the country through which the caravan passed.
        - id: ch01-b09
          speaker: dely
          text: For several days, we traveled on, sad and anxious about what would become of us. Then, while I was looking through our window, I heard someone call my name. A beautifully dressed girl climbed from the box on the other side of our camel. One glance told me it was the prince, and my heart leaped.
        - id: ch01-b10
          speaker: prince_delicate
          text: This disguise was Thelamis's idea. He is pretending to be a slave dealer, and I am the peerless maiden he means to present to the Sultan. He persuaded the officer leading the caravan to rent him the empty box. Now I can climb through my window and reach yours.
        - id: ch01-b11
          speaker: dely
          text: We were enchanted by the clever trick, but our pleasant talk did not last. The attendants noticed that the camel was walking crookedly and came to see what was wrong. Fortunately, they moved slowly. The prince had just enough time to scramble back into his box and balance the load before they discovered him.
        - id: ch01-b12
          speaker: dely
          text: Neither the prince nor Thelamis meant to let us enter the Sultan's palace. Still, we could not see how to escape the caravan or what would become of us once we had. As we drew near Constantinople, the prince brought news. Thelamis had made friends with a holy dervish he met on the road. He told the man that we were his sisters and were being sold as slaves against his will. The good man was moved by the story and willingly offered us shelter, if only we could slip past the watchful guards. The danger was great, but it was our one chance.
        - id: ch01-b13
          speaker: dely
          text: That night, when the whole caravan was asleep, we raised the tops of our boxes. Thelamis helped us climb out without a sound. We went back along the road for some distance, turned onto another path, and finally reached the refuge the dervish had prepared. There we found food and rest. You can imagine our happiness at being free again.
    - id: ch02
      title: The Talismans and the Isle of Black Marble
      blocks:
        - id: ch02-b01
          speaker: dely
          text: Our beauty soon won the dervish over completely. The day after our escape, he offered to take us to a nearby inn. Two men would be there, he said, carrying precious talismans that were not truly theirs.
        - id: ch02-b02
          speaker: dervish
          text: Find some way to take those talismans from them.
        - id: ch02-b03
          speaker: dely
          text: The inn stood away from the main road to Constantinople, but merchants loved it for its excellent food. When we arrived, six or eight travelers were already there. They greeted us politely, and we all sat at the table together. Before long, the two men the dervish had described entered. At his signal, Tezila made room beside her for one, and I welcomed the other to my side.
        - id: ch02-b04
          speaker: dely
          text: The dervish had happened to remark that their brother had danced. We had paid no attention then, but now his words returned to us. We decided that these two men should dance as well. To make it happen, we used every art we knew. Very soon, we had bent them so completely to our wishes that they could refuse us nothing. By the end of the day, the talismans belonged to us, and we left the men to their fate. The prince and Thelamis loved us more than ever and declared that no women in the world could equal our beauty.
        - id: ch02-b05
          speaker: dely
          text: The sun had set before we left the inn, and we had made no plan for our next journey. So we gladly agreed when the prince proposed sailing at once for the Isle of Black Marble. What a place it was! Cliffs blacker than jet rose above the shore and cast a heavy darkness over the land. Our sailors had never seen it and were almost as frightened as we were. But Thelamis took the helm and brought us safely to the beach.
        - id: ch02-b06
          speaker: dely
          text: Once we left the coast and its walls of jet behind, we entered a beautiful country. Its fields were greener, its streams clearer, and its sunlight brighter than anywhere else. People crowded around to welcome the prince they loved dearly. Yet they warned him that the king remained furious. His son had refused to marry his cousin, Princess Okimpare, and then had fled the kingdom. Everyone begged the prince to avoid the capital, where his life would scarcely be safe.
        - id: ch02-b07
          speaker: dely
          text: I longed to see my beloved prince's home, but I pleaded with him to follow that wise advice. Instead, we all went to Thelamis's palace, deep in a vast forest.
        - id: ch02-b08
          speaker: dely
          text: Tezila and I had grown up in a cottage, so Thelamis's home seemed like fairyland. It stood in the heart of the forest and was built of pink marble polished until it gleamed like a mirror. The flowers and streams surrounding it shone in its walls. A whole set of rooms had been prepared especially for me. They were furnished in yellow silk and silver to suit my black hair. Fresh dresses appeared for both of us every day, and servants waited on our smallest wishes. Ah, if only that happiness could have lasted forever!
        - id: ch02-b09
          speaker: dely
          text: But Thelamis's jealousy disturbed our peace. He could not bear to see Tezila speaking kindly with the prince, though he knew perfectly well that the prince's heart was mine. Every day brought tender accusations and explanations. Every day, Tezila's tears brought Thelamis to his knees to beg forgiveness.
    - id: ch03
      title: The Heads That Changed Places
      blocks:
        - id: ch03-b01
          speaker: dely
          text: We had lived this way for several months when word came that the king was dangerously ill. I begged the prince to hurry to court. He needed to see his father and show himself to the senators and nobles. Yet he loved me more than he wanted a crown, and he hesitated, almost as if he knew what would follow. At last, Tezila spoke so seriously to him in front of Thelamis that he agreed to go. He promised to return before night.
        - id: ch03-b02
          speaker: dely
          text: Night came, but the prince did not. Tezila had urged him to leave, and now her uneasiness woke Thelamis's jealousy again. As for me, I cannot tell you how I suffered. I could not sleep, so I rose and wandered into the forest along the road the prince had taken hours earlier.
        - id: ch03-b03
          speaker: dely
          text: Suddenly, I heard hoofbeats in the distance. Moments later, the prince leaped from his horse and stood beside me.
        - id: ch03-b04
          speaker: prince_delicate
          text: Oh, how I adore you! Thelamis could never love as deeply as I do.
          emotion: happy
        - id: ch03-b05
          speaker: dely
          text: He had barely spoken when I heard a faint sound behind us. Before either of us could turn, both our heads were rolling on the ground.
        - id: ch03-b06
          speaker: thelamis
          text: You lying wretches, answer me! And you, faithless Tezila, why have you betrayed me?
          emotion: angry
        - id: ch03-b07
          speaker: dely
          text: Then I understood. In his rage, Thelamis had mistaken me for my sister.
        - id: ch03-b08
          speaker: dely
          text: I am not Tezila. I am Dely. You have destroyed my life and your friend's as well.
          emotion: sad
        - id: ch03-b09
          speaker: dely
          text: My severed head could speak only weakly. Thelamis stopped and thought for a moment.
        - id: ch03-b10
          speaker: thelamis
          text: Do not be frightened. I can put you both back together.
          emotion: calm
        - id: ch03-b11
          speaker: dely
          text: He laid magic powder on our tongues and set our heads on our necks. In an instant, they joined our bodies without leaving even a scar. But Thelamis was still blinded by rage. He had placed my head on the prince's body and the prince's head on mine.
        - id: ch03-b12
          speaker: dely
          text: Neither of us could describe how strange it felt. We both raised our hands without thinking. The prince touched the hair on my head, which was dressed like a woman's. I lifted the turban pressing heavily on his forehead. The night was still dark, so we did not yet understand what had happened.
        - id: ch03-b13
          speaker: dely
          text: Then Tezila arrived with a line of servants carrying flowers. Their torches showed us the truth. At first, both of us thought we had simply exchanged clothes.
        - id: ch03-b14
          speaker: dely
          text: Whatever people may say, everyone prefers their own body. Even though we loved each other, we could not help feeling a little cross with Thelamis. The prince's love was so deep, however, that he soon found a reason to celebrate the change.
        - id: ch03-b15
          speaker: prince_delicate
          text: Now my happiness is complete. My heart has always belonged to you, beautiful Dely, and now I have your head as well.
          emotion: happy
        - id: ch03-b16
          speaker: dely
          text: The prince made the best of it, but Thelamis was deeply ashamed of his mistake.
        - id: ch03-b17
          speaker: thelamis
          text: I have two more pastilles with the same magic power. Let me cut off your heads once more, and this time I can set everything right.
        - id: ch03-b18
          speaker: dely
          text: The offer was tempting, but it also seemed dangerous. We talked it over and decided to remain as we were.
        - id: ch03-b19
          speaker: thelamis
          text: Then do not blame me if you refuse my help. Keep these two pastilles. If you are ever beheaded again, use them as I have shown you. Each of you will get the right head back.
        - id: ch03-b20
          speaker: dely
          text: He gave us the pastilles, and we all returned to the castle. But the troubles caused by our exchange had only begun. Without thinking, my head led the prince's body toward my own rooms. My women looked only at the clothing. They insisted I had taken the wrong corridor and called servants to escort me to the prince's chambers.
        - id: ch03-b21
          speaker: dely
          text: That was bad enough. Then, because it was still night, the prince's servants began to undress me. I nearly fainted from surprise and confusion. No doubt the prince's head was enduring the same misery at the other end of the castle.
        - id: ch03-b22
          speaker: dely
          text: You can guess that neither of us slept much. By morning, we had partly adjusted to our strange condition. In the mirror, the prince now looked brown-skinned and black-haired, while my head wore his curling golden hair. After the first day, everyone in the palace grew so used to the change that they stopped thinking about it.
        - id: ch03-b23
          speaker: dely
          text: A few weeks later, we learned that the king of the Isle of Black Marble had died. The prince's head, which had once been mine, now filled with ambitious thoughts. He longed to ride straight to the capital, show himself to the court, and claim the crown. But then we faced a question none of us could answer. Would the nobles recognize a prince who had a girl's body? Once we began to think about it, which one of us was truly the prince, and which was the girl?
        - id: ch03-b24
          speaker: dely
          text: We argued for a long time. At last, my head carried the day, and we set out. We arrived only to learn that the king had named Princess Okimpare as his successor. Most senators and nobles admitted that they would have preferred the rightful heir. Yet they could recognize him neither in me nor in the prince. They called us impostors and threw us into prison.
        - id: ch03-b25
          speaker: dely
          text: A few days later, Tezila and Thelamis, who had followed us to the capital, were allowed to visit our prison. They told us that the new queen had charged us with high treason. Okimpare herself had attended the trial, though it had been held without either prisoner present to answer the charge. Tezila and Thelamis had waited in mortal fear to hear our sentence. Then, by an extraordinary piece of luck, they said, the judges condemned us to be beheaded.
        - id: ch03-b26
          speaker: dely
          text: I told Tezila that I could not see what was lucky about that.
        - id: ch03-b27
          speaker: thelamis
          text: What do you mean? Of course I will use the pastilles, and then—
          emotion: surprised
        - id: ch03-b28
          speaker: dely
          text: Officers arrived before he could finish. Okimpare wanted no delay, and they led us to the great square for the execution. People of every age and rank packed the square. A platform and scaffold stood in the center, with a masked executioner waiting beside them.
        - id: ch03-b29
          speaker: dely
          text: At the executioner's signal, I climbed the steps first. A moment later, my head rolled at his feet. Tezila and Thelamis sprang onto the platform before anyone could stop them. With a leap, Thelamis snatched the sword from the masked headsman and cut off the prince's head as well. The whole crowd stared at these strange events. Before they could recover from their astonishment, Tezila and Thelamis put our true heads onto the proper bodies and placed the magic pastilles on our tongues.
        - id: ch03-b30
          speaker: dely
          text: Our bodies joined to the proper heads. Then Thelamis led the prince to the edge of the platform and presented him to the people.
        - id: ch03-b31
          speaker: thelamis
          text: Behold your lawful king!
        - id: ch03-b32
          speaker: dely
          text: The people shouted for joy, and their cries reached Okimpare in the palace. When she heard the news, despair overcame her. She fainted on her balcony, and her servants carried her back to her own house.
        - id: ch03-b33
          speaker: dely
          text: But our joy became sorrow. I ran to embrace the prince, and suddenly he turned pale and stumbled.
        - id: ch03-b34
          speaker: prince_delicate
          text: I die faithful to you, and I die a king.
          emotion: sad
        - id: ch03-b35
          speaker: dely
          text: He rested his head on my shoulder and quietly died. The sword had cut through one of the arteries in his neck.
        - id: ch03-b36
          speaker: dely
          text: I no longer knew what I was doing. I staggered toward the sword, meaning to follow my beloved prince in death. Thelamis caught my hand just in time. In my madness, I turned the blade against him. He fell at my feet, pierced through the heart.
    - id: ch04
      title: Azemi and the Two Watches
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: The whole company had listened without a breath. Now Dely could say no more, and Tezila had thrown herself onto a pile of cushions and hidden her face. Zambac ordered her women to care for the sisters and have them carried into her own rooms.
        - id: ch04-b02
          speaker: narrator
          text: While both Circassians lay unconscious, the prudent Ibrahim made a suggestion to his parents. This would be the perfect chance, he said, to search the sisters and see whether they carried the talismans that belonged to Siroco's daughters. The Bassa was shocked by the thought of searching helpless guests under his own roof. He refused to act in such an inhospitable way. By the next day, he hoped to speak with the sisters and persuade them to surrender the talismans of their own free will.
        - id: ch04-b03
          speaker: narrator
          text: It was nearly midnight. Neangir stood beside Sumi and took out Argentine's portrait. He was delighted when Sumi told him the real Argentine was even more beautiful. Everyone waited eagerly for the two enchanted watches. They expected the watches to come looking for Sumi at the stroke of twelve. To make sure nothing delayed them, the Bassa ordered every door opened wide.
        - id: ch04-b04
          speaker: narrator
          text: The doors opened. But the watches did not appear. Instead, in walked the page who had been banished in disgrace. The Bassa rose in fury.
        - id: ch04-b05
          speaker: bassa
          text: Azemi! Did I not command you never to stand before me again?
          emotion: angry
        - id: ch04-b06
          speaker: azemi
          text: My lord, I hid outside the door and listened to the Circassians' tale. I know how fond you are of stories. Please let me tell you one as well. I promise it will be short.
        - id: ch04-b07
          speaker: bassa
          text: Go on, then. But be careful what you say.
        - id: ch04-b08
          speaker: azemi
          text: This morning, my lord, I saw a man walking through town with a servant behind him. The man went into a baker's shop, bought bread, and gave it to the servant. I followed them as they stopped at other shops for more provisions. When the servant could carry nothing else, his master sent him home to prepare supper for midnight.
        - id: ch04-b09
          speaker: azemi
          text: Once the servant had gone home, the man continued alone. He walked farther up the street, turned into a jeweler's shop, and came out carrying what looked to me like a silver watch. After a few more steps, he bent down and picked up a gold watch lying at his feet. I ran over and told him I would report him to the Cadi unless he gave me half its value. He agreed and led me back to his house. There he counted out four hundred sequins, saying that this was my share. I had what I wanted, so I went away.
        - id: ch04-b10
          speaker: azemi
          text: Then it was time to attend you. I returned home and went with you to the Cadi. There I heard the story of the three Jews and learned how important those two watches were. I hurried back to the stranger's house, but he had gone out. Only the servant remained. I claimed to have urgent news for his master. Thinking I was a friend, he invited me to wait inside.
        - id: ch04-b11
          speaker: azemi
          text: In the room where the servant left me, I saw the two watches lying together on a table. I put them both into my pocket. In place of the gold watch, I returned the four hundred sequins. For the silver one, I left three gold pieces, because I knew exactly what it had cost. As you know, the watches never remain with the person who buys them. That stranger may count himself lucky to recover his money instead of losing everything. I have wound both watches, and at this very moment, Aurora and Argentine are locked safely in my room.
        - id: ch04-b12
          speaker: narrator
          text: Everyone was so delighted that their embraces nearly smothered Azemi. Neangir wanted to run out and break down the door, though he did not even know where the page slept. Azemi begged for the honor of fetching the ladies himself. Soon he returned, leading Aurora and Argentine by the hand.
        - id: ch04-b13
          speaker: narrator
          text: For several minutes, the room dissolved into happy confusion. Ibrahim used the moment to kneel before Aurora and search the fifth fold of her dress. There he found the missing coral bead, exactly where the Book of Spells had promised. The chaplet was complete, and his long search was over.
        - id: ch04-b14
          speaker: narrator
          text: Only Hassan looked gloomy amid all that rejoicing.
        - id: ch04-b15
          speaker: hassan
          text: Everyone is happy except the wretched man before you. My one comfort was knowing I had a brother who shared my misfortune, and now even that is gone!
          emotion: sad
        - id: ch04-b16
          speaker: bassa
          text: Take heart. Sooner or later, someone will find the dervish who stole the pink bag.
          emotion: calm
        - id: ch04-b17
          speaker: narrator
          text: Supper was served, and the whole company sat down together. They ate rare fruits that seemed more delicious than any others in the world. When the meal ended, the Bassa ordered the flask containing the elixir of love to be brought in. The young people each drank from it. At once, a new fire shone in their eyes, and they solemnly promised to remain true to one another until death.
        - id: ch04-b18
          speaker: narrator
          text: The ceremony had barely ended when the clock struck one. Aurora and Argentine vanished at once. Two watches lay where they had stood. Silence fell over the company. In their happiness, everyone had forgotten the enchantment.
        - id: ch04-b19
          speaker: azemi
          text: Let me keep the watches until tomorrow. I pledge my head that I will break their enchantment.
        - id: ch04-b20
          speaker: narrator
          text: Sumi gave her consent. The Bassa rewarded Azemi for all he had already done with a purse holding a thousand sequins. Then everyone retired to their rooms.
    - id: ch05
      title: The Enchantments End
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: Azemi had never owned so much money. Joy kept him awake all night. Very early, he went into the garden and tried to think of a way to free Siroco's daughters. Then he heard a woman's soft voice. Peering through the bushes, he saw Tezila arranging flowers in Dely's hair.
        - id: ch05-b02
          speaker: narrator
          text: Leaves rustled. Dely started and sprang up as though she meant to run, but Azemi begged her to stay. He asked what had happened after their lovers died and how they had found the dervish again.
        - id: ch05-b03
          speaker: dely
          text: Queen Okimpare ordered us to sing and dance through our grief at a great festival for all her people. That cruel punishment nearly drove us mad. We swore a solemn oath to make every pair of lovers as miserable as we were.
        - id: ch05-b04
          speaker: dely
          text: We succeeded so well that before long, the ladies of the capital went together to Okimpare. They begged her to banish us before we ruined every life in the kingdom. The queen agreed and sent us away on a ship with our servant Gouloucou.
        - id: ch05-b05
          speaker: dely
          text: On the shore, we saw an old man drowning some little black pigs. All the while, he spoke to them as though they understood him.
        - id: ch05-b06
          speaker: dervish
          text: Cursed creatures! Your kind caused every misery suffered by the man who received my magic bracelet. You must all perish!
          emotion: angry
        - id: ch05-b07
          speaker: dely
          text: Curiosity drew us closer to the old man. Then we recognized the dervish who had sheltered us after our first escape from the caravan. When he discovered who we were, he could hardly contain his delight at seeing us again. He offered us a home in the cave where he lived, and we gladly accepted his refuge. We all went there together. The last little black pig went with us too, because the dervish gave it to us as a gift.
        - id: ch05-b08
          speaker: dervish
          text: The Bassa of the Sea will pay any price you care to name for that pig.
        - id: ch05-b09
          speaker: dely
          text: I did not ask what made it valuable. I simply put it into my workbag, where it has stayed ever since. Yesterday, we offered it to the Bassa, and he laughed at us. That made us so furious with the dervish that we cut off his beard while he slept. Now he is too ashamed to show himself.
        - id: ch05-b10
          speaker: azemi
          text: Such beauty should not be wasted on making others unhappy. Leave your sorrow behind and think of the future. Dely, please accept this watch to mark the brighter hours ahead.
        - id: ch05-b11
          speaker: narrator
          text: Azemi laid the watch on Dely's knee, then turned to Tezila.
        - id: ch05-b12
          speaker: azemi
          text: And for you, fair Tezila, I have this other watch. It is only silver, but it is all I have left to give. I feel certain you own a silver seal that would suit it perfectly.
        - id: ch05-b13
          speaker: dely
          text: Why, you do! Fasten your silver seal to your watch, Tezila, and I will hang my gold seal from mine.
          emotion: surprised
        - id: ch05-b14
          speaker: narrator
          text: The sisters brought out the seals. Azemi had guessed correctly. They were the talismans Dely and Tezila had taken from Izif and Izouf, now mounted in gold and silver. In a flash, the watches slipped from their hands. Aurora and Argentine stood before them, each wearing her talisman on one finger.
        - id: ch05-b15
          speaker: narrator
          text: At first, the two young women seemed confused by the change and by sunlight they had not seen for so long. Slowly, they understood that the spell had ended. Their happiness was too great for words.
        - id: ch05-b16
          speaker: narrator
          text: Dely and Tezila wept over the loss of the talismans and could scarcely be comforted. Aurora and Argentine begged the sisters to dry their tears. Their father, Siroco, was the governor of Alexandria, they explained. He would certainly reward the Circassians and grant them anything they wished in return for the part they had played in ending the enchantment.
        - id: ch05-b17
          speakers: [aurora, argentine]
          ensemble: duo
          text: Please dry your tears. Our father will reward you in any way you choose.
        - id: ch05-b18
          speaker: narrator
          text: Siroco soon confirmed their promise. He entered the garden with the Bassa and his two sons, and the ladies of the family quickly joined them. Hassan alone was missing. This was the hour when he was condemned to mourn his ebony hand.
        - id: ch05-b19
          speaker: narrator
          text: A noise from a corner of the terrace surprised them all. Hassan appeared among the servants, clapping his hands and shouting with joy.
        - id: ch05-b20
          speaker: hassan
          text: I was weeping as I always do when suddenly no more tears would come. I looked down and saw that the blackness had vanished from my hand. Lovely Zelida, nothing can stop me now from offering you the hand whose heart has always been yours!
          emotion: happy
        - id: ch05-b21
          speaker: narrator
          text: Hassan did not stop to ask what had cured him. He did not seem to care, but everyone else wanted an answer. Plainly, the little black pig was dead. But how had it died, and when? The servants said that earlier that morning, they had seen one man running away from three others. The fugitive had rushed into the cave they had been ordered to guard. Obeying their instructions, the servants rolled a great stone over the entrance and sealed him inside.
        - id: ch05-b22
          speaker: narrator
          text: Piercing shrieks cut off the servants' story. A man came racing around the corner of the terrace, with three others close behind him. Dely and Tezila saw at once that the fugitive was their old dervish. When he found so many people gathered before him, he turned sharply and fled down another path. He did not get far. The servants captured the dervish and all three pursuers, then brought the four men before their master.
        - id: ch05-b23
          speaker: narrator
          text: The Bassa stared in amazement. This was the very dervish who had given his three sons the chaplet, the copper plaque, and the bracelet.
        - id: ch05-b24
          speaker: bassa
          text: Have no fear, holy father. You are safe with me. But tell us, how did you come here?
          emotion: calm
        - id: ch05-b25
          speaker: dervish
          text: My lord, the two Circassians cut off my beard while I slept. I was too ashamed to show my face, so I fled with the pink silk bag. During the night, I met these three men, and we talked for some time. At dawn, when we could see one another clearly, one of them recognized me as the dervish who had traveled with the Circassians who stole the talismans from the Jews.
        - id: ch05-b26
          speaker: dervish
          text: I jumped up and ran for my cave, but they were faster. Just as we reached your garden, they seized the bag that held the little black pig and threw it into the sea. That act has freed your son. I beg you to forgive them for any wrong they have done you. More than that, please reward them for what they did.
        - id: ch05-b27
          speaker: narrator
          text: The Bassa granted the holy man's request and forgave the three pursuers. He also saw that Izif and Izouf had fallen completely under the spell of the Circassian sisters' beauty. He consented to their marriages, which would take place at the same time as the wedding of Izaf and the wise Sumi. The Cadi was summoned at once. Before the ceremony, the men exchanged the hats of their own people for the turbans worn by the followers of the Prophet.
        - id: ch05-b28
          speaker: narrator
          text: After so many misfortunes and so many enchantments, the Bassa's three sons begged their father not to delay their happiness any longer. Every promised couple was gathered together, and all the preparations were made without another moment's delay. At the hour of noon, the Cadi performed all six marriages.
