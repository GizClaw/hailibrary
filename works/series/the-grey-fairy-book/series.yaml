cover_prompt: |-
  A wordless cover gathers mysterious but gentle motifs from The Grey Fairy Book across a misty mountain kingdom. A young woman carries a basket of plums, three unusually gifted companions scan a distant road, a small fairy tries to mend a harmless mistake, and a gray bird perches above a hidden doorway. At the center, the companions pull together to lift a heavy stone and reveal a warm-lit path beneath it. Their cooperative discovery is the focal action, with the other tale motifs arranged in quiet layered distance. Use a broad elevated composition of slate hills, silver trees, and an old castle, leaving generous misty sky at the top. Keep every figure original, non-frightening, respectful of the different source traditions, and independent of modern adaptation imagery. No readable text, letters, numbers, labels, logos, captions, speech bubbles, signatures, or watermarks.
