  chapters:
    - id: ch01
      title: Antonio and the Ogre
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Once upon a time, in the land of Marigliano, there lived a poor woman named Masella. She had six pretty daughters, all straight and tall as young fir trees, and one son named Antonio. Antonio was so simple that he could barely look after himself. Almost every day, his mother scolded him.
        - id: ch01-b02
          speaker: masella
          text: What foolish thing are you doing now, you useless boy? If you could take care of yourself at all, I would send you away and never let you show your face here again.
          emotion: angry
        - id: ch01-b03
          speaker: narrator
          text: Each day brought some new piece of foolishness. At last, Masella lost all patience and gave Antonio a sound beating. It frightened him so badly that he ran from the house. He did not stop until darkness fell and the stars shone overhead. Even then, he wandered on because he had no idea where to go. At last, he reached a cave. An ogre sat at its mouth, uglier than anything you could imagine.
        - id: ch01-b04
          speaker: narrator
          text: The ogre had a huge head and a wrinkled brow. His eyebrows met, his eyes squinted, and his broad nose lay flat above a great gash of a mouth. Two enormous tusks stuck out of it. Hair covered his skin. His arms were immense, his legs were thin as sword blades, and his feet were flat as a duck's. He was both the most hideous and the most ridiculous creature in the world.
        - id: ch01-b05
          speaker: narrator
          text: For all his faults, Antonio was no coward. He was also a very polite young man. He took off his hat and greeted the ogre.
        - id: ch01-b06
          speaker: antonio
          text: Good day, sir. I hope you're well. Would you please tell me how far it is from here to wherever I'm going?
        - id: ch01-b07
          speaker: narrator
          text: The question was so strange that the ogre burst out laughing. He liked Antonio's good manners, though, and made him an offer.
        - id: ch01-b08
          speaker: ogre
          text: Would you like to work for me?
        - id: ch01-b09
          speaker: antonio
          text: How much would you pay me?
        - id: ch01-b10
          speaker: ogre
          text: Serve me faithfully, and I promise your wages will be more than enough.
        - id: ch01-b11
          speaker: narrator
          text: They struck the bargain, and Antonio became the ogre's servant. In every way, the ogre treated him very well. Antonio had hardly any work to do. Within days, he was as fat as a quail, as round as a barrel, as red as a lobster, and as bold as a bantam rooster.
        - id: ch01-b12
          speaker: narrator
          text: After two years, Antonio grew tired of doing nothing. He desperately wanted to see his home again. The ogre could read his heart and knew how unhappy he was.
        - id: ch01-b13
          speaker: ogre
          text: Dear Antonio, I know you long to see your mother and sisters. I love you as the apple of my eye, so I will let you visit them. Take this donkey and ride instead of walking. But never say "Bricklebrit" to him. If you do, you will regret it.
        - id: ch01-b14
          speaker: narrator
          text: Antonio took the donkey without even saying thank you. He jumped on its back and hurried away.
    - id: ch02
      title: The Donkey and the Innkeeper
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: Antonio had not ridden two hundred yards before he climbed down and called out the forbidden word.
        - id: ch02-b02
          speaker: antonio
          text: Let's see what you can do. Bricklebrit!
        - id: ch02-b03
          speaker: narrator
          text: At once, the donkey opened its mouth. Out poured rubies, emeralds, diamonds, and pearls as large as walnuts. Antonio could only stare at such wealth. Delighted by what he saw, he filled a huge sack with the precious stones. Then he mounted the donkey again and rode on until he came to an inn.
        - id: ch02-b04
          speaker: antonio
          text: Good landlord, please put this donkey in your stable. Give the poor animal plenty of oats and hay, but don't say "Bricklebrit" to him. You will regret it if you do. And take this heavy sack and keep it safe for me.
        - id: ch02-b05
          speaker: narrator
          text: The landlord was no fool. He had heard the odd warning, and he could see precious stones sparkling through the canvas sack. He became terribly curious about what the forbidden word might do. First, he served Antonio an excellent dinner with a bottle of fine old wine. Then he prepared a comfortable bed for him. The landlord waited until the simple young man had closed his eyes and begun to snore loudly. As soon as he heard those snores, he hurried to the stable.
        - id: ch02-b06
          speaker: landlord
          text: Now let's uncover your secret. Bricklebrit!
        - id: ch02-b07
          speaker: narrator
          text: As usual, the donkey poured out precious stones in great numbers. When the landlord saw the treasure, he wanted such a valuable animal for himself. He decided to steal it from his foolish guest. Before morning, he replaced the magic donkey with an ordinary one and filled another sack with gravel to take the place of Antonio's jewels.
        - id: ch02-b08
          speaker: narrator
          text: At daylight, Antonio woke, rubbed his eyes, and stretched a hundred times. Then he called for the landlord.
        - id: ch02-b09
          speaker: antonio
          text: Come along, my friend, and bring me the bill. Settle quickly, stay friends for a long time.
        - id: ch02-b10
          speaker: narrator
          text: Antonio paid. He went to the stable and led away the donkey he thought was his own. He fastened the sack to its back, never knowing that the landlord had filled it with gravel, and set off for home.
        - id: ch02-b11
          speaker: antonio
          text: Mother, hurry! Bring out the tablecloths and sheets and spread them on the ground. Wait until you see the wonderful treasure I've brought you.
          emotion: happy
        - id: ch02-b12
          speaker: narrator
          text: Masella rushed inside and opened the linen chest that held her daughters' wedding things. She brought out her finest sheets and tablecloths and spread them flat and smooth. Antonio led the donkey onto them.
        - id: ch02-b13
          speaker: antonio
          text: Bricklebrit! Bricklebrit! Bricklebrit! Bricklebrit!
        - id: ch02-b14
          speaker: narrator
          text: Nothing happened. The donkey paid no more attention to the magic word than if someone had played a lyre beside its ear. Antonio tried the command two, three, and four times, but every attempt failed. He might as well have spoken to the wind.
        - id: ch02-b15
          speaker: narrator
          text: Furious with the poor animal, Antonio grabbed a thick stick and beat it until he nearly broke every bone in its body. The miserable donkey became so frantic that instead of producing jewels, it tore and dirtied all the fine linen.
        - id: ch02-b16
          speaker: narrator
          text: Masella watched the donkey destroy her sheets and tablecloths. Instead of becoming rich, she had only been made a fool. She snatched up another stick and beat Antonio without mercy. He fled before her blows and did not stop running until he was back at the ogre's cave.
        - id: ch02-b17
          speaker: narrator
          text: One look at Antonio's sorry state told the ogre what had happened. He did not soften the truth. Antonio had behaved like a fool. He had allowed the landlord to trick him and had accepted a worthless animal in place of the magic donkey.
        - id: ch02-b18
          speaker: narrator
          text: Antonio listened humbly and solemnly promised never to be so foolish again. A year passed. Then homesickness overcame him once more, and he longed to see his family.
    - id: ch03
      title: The Magic Tablecloth
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: The ogre was hideous to look at, but he had a very kind heart. He saw Antonio growing restless and unhappy and understood how badly the young man wanted to go home. Without delay, he gave Antonio permission to visit his family. This time, his parting gift was a beautiful tablecloth.
        - id: ch03-b02
          speaker: ogre
          text: Give this to your mother, and don't lose it the way you lost the donkey. Until you are safely home, never say, "Tablecloth, open," or, "Tablecloth, shut." If you disobey me, the trouble will be your own fault. I have warned you fairly.
        - id: ch03-b03
          speaker: narrator
          text: Antonio set out. The cave was hardly out of sight when he laid the cloth on the ground.
        - id: ch03-b04
          speaker: antonio
          text: Tablecloth, open!
        - id: ch03-b05
          speaker: narrator
          text: In a moment, it unfolded and revealed a great mass of precious stones and other treasures.
        - id: ch03-b06
          speaker: antonio
          text: Tablecloth, shut!
        - id: ch03-b07
          speaker: narrator
          text: The cloth closed, and Antonio continued on his way. He returned to the same inn and handed it to the landlord.
        - id: ch03-b08
          speaker: antonio
          text: Keep this tablecloth safe for me. Whatever you do, don't tell it to open or shut.
        - id: ch03-b09
          speaker: landlord
          text: Leave it with me. I'll care for it as though it belonged to me.
        - id: ch03-b10
          speaker: narrator
          text: The rogue gave Antonio plenty to eat and drink and found him another comfortable bed. Then he went straight to the cloth.
        - id: ch03-b11
          speaker: landlord
          text: Tablecloth, open!
        - id: ch03-b12
          speaker: narrator
          text: The cloth opened at once and displayed treasures of great value. One look was enough for the landlord. He decided then and there that he would steal it. The next morning, when Antonio awoke, the landlord handed him an ordinary tablecloth that looked exactly like the magical one.
        - id: ch03-b13
          speaker: narrator
          text: Antonio carried the false cloth carefully over his arm and went straight to his mother's house.
        - id: ch03-b14
          speaker: antonio
          text: Now we'll be richer than we ever dreamed. We'll never wear rags again, and we'll always have the finest food.
          emotion: happy
        - id: ch03-b15
          speaker: narrator
          text: He spread the tablecloth on the ground.
        - id: ch03-b16
          speaker: antonio
          text: Tablecloth, open!
        - id: ch03-b17
          speaker: narrator
          text: He repeated the command again and again, but it was a waste of breath. Nothing happened.
        - id: ch03-b18
          speaker: antonio
          text: That old scoundrel at the inn has tricked me again. He'll regret it. If I ever go back there, I'll make him pay for my donkey and every other treasure he stole.
          emotion: angry
        - id: ch03-b19
          speaker: narrator
          text: This new disappointment sent Masella into a rage. She could no longer hold back her anger. She called Antonio every name she could think of and ordered him out of her sight at once. She told him she would never acknowledge him as her son again. Crushed by her words, the poor young man crept back to his master like a dog with its tail between its legs.
        - id: ch03-b20
          speaker: narrator
          text: The ogre guessed everything as soon as Antonio appeared. Then he gave the young man a fierce scolding.
        - id: ch03-b21
          speaker: ogre
          text: What keeps me from smashing your head, you useless good-for-nothing? You tell everyone everything. Your tongue never stops wagging. If you had kept quiet at the inn, none of this would have happened. You have no one but yourself to blame.
          emotion: angry
        - id: ch03-b22
          speaker: narrator
          text: Antonio said nothing. He looked like a whipped dog. Three more years passed in the ogre's service. Then another painful fit of homesickness came over him, and once again he longed for his mother and sisters.
    - id: ch04
      title: The Carved Stick
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: Antonio asked to visit home, and the ogre agreed at once. Before the journey, his master gave him a beautifully carved stick.
        - id: ch04-b02
          speaker: ogre
          text: Keep this stick to remember me by. But don't say, "Rise up, Stick," or, "Lie down, Stick." If you do, I certainly would not want to be in your shoes.
        - id: ch04-b03
          speaker: antonio
          text: Don't worry about me. I'm not as foolish as you think. I know as well as anyone that two and two make four.
        - id: ch04-b04
          speaker: ogre
          text: I'm glad to hear it. But talk is easy, and actions prove the truth. You heard my warning, so now you know what to expect.
        - id: ch04-b05
          speaker: narrator
          text: This time, Antonio warmly thanked the ogre for all his kindness. He began the journey in high spirits, carrying the beautifully carved stick with him. Yet before he had gone half a mile, he tried the forbidden words.
        - id: ch04-b06
          speaker: antonio
          text: Rise up, Stick!
        - id: ch04-b07
          speaker: narrator
          text: The words had hardly left his mouth when the stick leaped up. Blows rained across poor Antonio's back as fast as lightning. The stick struck so quickly and so hard that he could barely find the strength to force out the command that would stop it. By then, his back was black and blue.
        - id: ch04-b08
          speaker: antonio
          text: Lie down, Stick!
          emotion: fearful
        - id: ch04-b09
          speaker: narrator
          text: At once, the stick dropped and lay still. Antonio had learned a painful lesson, but he was full of joy. Now he knew how to take revenge on the wicked landlord.
    - id: ch05
      title: Antonio Wins Back His Treasures
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: Once more, Antonio reached the inn. The landlord welcomed him with every show of friendship and hospitality. Antonio greeted him just as warmly.
        - id: ch05-b02
          speaker: antonio
          text: My friend, would you take care of this stick for me? Whatever you do, don't say, "Rise up, Stick." If you do, you'll be sorry, and you won't get any sympathy from me.
        - id: ch05-b03
          speaker: narrator
          text: The landlord thought a third piece of good fortune had walked through his door. He gave Antonio an excellent supper and waited until his guest was comfortably in bed. Then he ran straight to the stick. Certain that another treasure was about to appear, he called his wife over to watch the fun.
        - id: ch05-b04
          speaker: landlord
          text: Rise up, Stick!
        - id: ch05-b05
          speaker: narrator
          text: The stick sprang up the instant he spoke and began beating the landlord without mercy. There was no way to escape its blows. The landlord and his wife ran screaming to Antonio's room. They woke him from his sleep and begged him to save them.
        - id: ch05-b06
          speakers: [landlord, landlords_wife]
          ensemble: duo
          text: Please stop it! Have mercy on us!
          emotion: fearful
        - id: ch05-b07
          speaker: antonio
          text: I won't help unless you return everything you stole from me. If you refuse, the stick will beat you to death.
        - id: ch05-b08
          speaker: narrator
          text: The landlord already felt close to death.
        - id: ch05-b09
          speaker: landlord
          text: Take your property back! Just free me from this terrible stick!
          emotion: fearful
        - id: ch05-b10
          speaker: narrator
          text: With that, the landlord ordered the magic donkey, the tablecloth, and all the other treasures returned to their rightful owner. Antonio waited until every one of his belongings was back in his hands. Only then did he give the command.
        - id: ch05-b11
          speaker: antonio
          text: Stick, lie down!
        - id: ch05-b12
          speaker: narrator
          text: The stick stopped beating the landlord at once. Antonio took his donkey and tablecloth and reached home safely with them.
        - id: ch05-b13
          speaker: narrator
          text: |-
            This time, the magic words had exactly the effect Antonio wanted. The donkey and the tablecloth gave the family more treasure than they could count. Antonio soon arranged a marriage for his sister and made his mother rich for the rest of her life.

            And they all lived happily ever after.
