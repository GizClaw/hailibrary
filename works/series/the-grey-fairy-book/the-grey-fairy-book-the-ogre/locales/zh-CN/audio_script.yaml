audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 亲切从容，保留古老童话的神秘感
        timbre: 温暖清晰
        pace: 舒缓
        pitch: 中音
    masella:
      display_name: 马塞拉
      tts:
        delivery: 直率泼辣，对儿子的愚行又急又气
        timbre: 明亮有力
        pace: 稍快
        pitch: 中音
    antonio:
      display_name: 安东尼奥
      tts:
        delivery: 憨直有礼，得意时冒失，受挫时老实
        timbre: 年轻清朗
        pace: 适中
        pitch: 中高音
    ogre:
      display_name: 食人妖
      tts:
        delivery: 外表粗野而内心厚道，训人时严厉干脆
        timbre: 粗厚低沉
        pace: 稍慢
        pitch: 低音
    innkeeper:
      display_name: 店主
      tts:
        delivery: 表面殷勤，暗地贪婪狡猾，求饶时惊慌
        timbre: 圆滑偏沙
        pace: 适中
        pitch: 中低音
    innkeeper_wife:
      display_name: 店主的妻子
      tts:
        delivery: 爱看热闹，遇险时惊恐慌乱
        timbre: 尖细清楚
        pace: 稍快
        pitch: 中高音
  chapters:
    - id: ch01
      title: 食人妖与宝驴
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            从前，马里利亚诺住着一个穷女人，名叫马塞拉。她有六个漂亮女儿，个个像小枞树一样挺拔。她还有一个独生儿子安东尼奥。这个年轻人实在太愚钝，几乎和傻子没有两样。母亲几乎天天都要数落他。
        - id: ch01-b02
          speaker: masella
          text: >-
            你这个没用的东西，又在干什么？要不是你蠢得连自己都照顾不了，我早叫你滚出家门，永远别再让我看见你了！
          emotion: angry
        - id: ch01-b03
          speaker: narrator
          text: >-
            安东尼奥每天都能闯出新的蠢祸。马塞拉终于忍无可忍，把他狠狠揍了一顿。他吓得拔腿就逃，一直跑到天色全黑，星星也亮了，才停下来。接着，他漫无目的地走了很久，最后来到一座山洞前。洞口坐着一个食人妖，丑得叫人无法想象。
        - id: ch01-b04
          speaker: narrator
          text: >-
            食人妖脑袋硕大，额头皱巴巴的，两道眉毛连在一起，眼睛斜斜地瞪着。扁平的大鼻子下面，嘴巴像一道裂口，两根巨大的獠牙从里面伸出来。他全身是毛，胳膊粗壮，两条腿却薄得像刀刃，一双脚扁得像鸭掌。世上再没有比他更丑、更可笑的模样了。
        - id: ch01-b05
          speaker: narrator
          text: >-
            安东尼奥虽然有不少毛病，却从不胆怯，说话也很客气。他摘下帽子，彬彬有礼地向怪物问好。
        - id: ch01-b06
          speaker: antonio
          text: >-
            您好，先生。看您气色不错。请问，从这里到我想去的地方，还要走多远？
        - id: ch01-b07
          speaker: narrator
          text: >-
            食人妖听见这么古怪的问题，放声大笑。他很喜欢年轻人的礼貌，便问安东尼奥愿不愿意做自己的仆人。
        - id: ch01-b08
          speaker: antonio
          text: >-
            那您会给我多少工钱？
        - id: ch01-b09
          speaker: ogre
          text: >-
            只要你忠心服侍我，我保证给你的工钱足够让你满意。
        - id: ch01-b10
          speaker: narrator
          text: >-
            两人就这样谈妥了。安东尼奥在食人妖那里处处受到优待，几乎不用干活。没过几天，他便吃得像鹌鹑一样肥，像木桶一样圆，脸红得像龙虾，还像矮脚公鸡一样神气。可两年过去，他厌倦了这种闲日子，想家想得不得了。食人妖看透了他的心思。
        - id: ch01-b11
          speaker: ogre
          text: >-
            亲爱的安东尼奥，我知道你想念母亲和姐妹。你是我的心肝宝贝，我准你回去看看她们。骑上这头驴吧，免得一路步行。不过，你绝不能对它说“布里克勒布里特”，不然准会后悔。
        - id: ch01-b12
          speaker: narrator
          text: >-
            安东尼奥连谢谢也没说，骑上驴便匆匆出发。还没走出两百码，他就跳下来，喊出了那句禁语。
        - id: ch01-b13
          speaker: antonio
          text: >-
            布里克勒布里特！
        - id: ch01-b14
          speaker: narrator
          text: >-
            驴子马上张开嘴，吐出红宝石、祖母绿、钻石和珍珠，颗颗都有核桃那么大。安东尼奥从没见过这样的财富，一下看呆了。他欢欢喜喜装满一只大口袋，再骑上驴赶路，直到来到一家客店。他下了驴，径直找到店主，请他把驴牵进马厩，多喂些燕麦和干草，又把沉重的口袋交给对方保管。
        - id: ch01-b15
          speaker: antonio
          text: >-
            老板，请务必照看好这头可怜的驴。可别对它说“布里克勒布里特”，否则你一定会后悔。这只口袋也请仔细替我收好。
        - id: ch01-b16
          speaker: narrator
          text: >-
            店主可不傻。他听见这番警告，又看见宝石在口袋的粗布缝隙里闪光，越发想试试那句禁语。他用丰盛的晚餐和陈年好酒款待安东尼奥，还替他铺好舒服的床。等客人闭上眼睛，鼾声震天，店主便溜进马厩，对驴子念出“布里克勒布里特”。牲口果然吐出数不清的宝石。
        - id: ch01-b17
          speaker: narrator
          text: >-
            店主望着满地珍宝，贪心大起。他一心要把这头宝驴据为己有，便决定从愚蠢的客人手里偷走它。第二天天亮，安东尼奥揉揉眼睛，足足伸了一百次懒腰，才叫店主来结账。他还说，账目结得清，朋友做得久。付过钱后，他从马厩牵走了一头驴，以为那就是自己的。店主早把真驴换了，还把宝石倒掉，换成一袋碎石，绑到了假驴背上。
        - id: ch01-b18
          speaker: narrator
          text: >-
            安东尼奥一到家，就叫母亲快拿桌布和床单铺在地上，好看看他带回的惊人财富。马塞拉急忙跑进屋，打开存放女儿们嫁妆的衣物箱，取出最精细的亚麻桌布和床单，再把它们一张张铺得平平整整。安东尼奥把驴牵到上面，一连喊了四遍“布里克勒布里特”。驴子毫无反应，就像有人在它耳边弹琴一样。那些口令全是说给风听了。
        - id: ch01-b19
          speaker: narrator
          text: >-
            安东尼奥又厌恶又气愤，抄起粗棍狠打那头可怜的牲口，几乎打断它全身的骨头。驴子被折磨得发了狂，非但没吐宝石，反而撕烂、弄脏了所有精美的亚麻布。马塞拉眼看桌布和床单全毁了，自己没能发财，倒成了笑话，也抓起一根棍子，毫不留情地痛打儿子。安东尼奥被追得落荒而逃，一路跑回食人妖的山洞才停下。
        - id: ch01-b20
          speaker: narrator
          text: >-
            食人妖见他带着这副可怜相回来，立刻明白了一切。他一点也不绕弯子，直截了当地骂安东尼奥太蠢，竟任凭店主欺骗，让人拿一头不值钱的牲口冒充宝驴塞给自己。安东尼奥低头听训，郑重保证再也不犯这样的傻。可一年过去，他又害起思乡病，满心想见亲人。
    - id: ch02
      title: 会变出珍宝的桌布
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            食人妖虽然长得吓人，心肠却很好。他看安东尼奥整日坐立不安，马上准他回家探亲，还送给他一张美丽的桌布。
        - id: ch02-b02
          speaker: ogre
          text: >-
            把这张桌布送给你母亲。可别像弄丢驴子那样，又把它弄丢。平安到家以前，不能说“桌布，打开”，也不能说“桌布，合上”。你若惹出祸来，只能怪自己。我已经警告过你了。
        - id: ch02-b03
          speaker: narrator
          text: >-
            安东尼奥刚走到看不见山洞的地方，就把桌布铺在地上，叫它打开。桌布转眼自行展开，里面藏着一大堆宝石和别的珍宝。他亲眼看过以后，又叫桌布合上，接着赶路，偏偏再次来到原先那家客店。他把店主叫到面前，交出桌布，吩咐对方仔细保管，无论如何都不能念那两句口令。
        - id: ch02-b04
          speaker: innkeeper
          text: >-
            你只管放心交给我。我会把它当成自己的东西一样仔细照看。
        - id: ch02-b05
          speaker: narrator
          text: >-
            这个店主其实是个十足的恶棍。他让安东尼奥尽情吃喝，再替他安排好一张舒适的床。等客人睡着，便径直走到桌布跟前，命它打开。桌布立刻在他眼前展开，显出数不尽的贵重宝物。店主看得贪心大起，当场决定，连这件宝贝也要偷走。
        - id: ch02-b06
          speaker: narrator
          text: >-
            第二天早晨安东尼奥醒来，店主把一张外表一模一样的假桌布交给了他。这个傻小伙半点没有察觉，只把它小心地搭在臂弯里，径直回到母亲家中。他宣布，从此全家会富得连梦都想不到，再也不用穿破衣，也不会缺少最好的食物。说完，他把桌布铺到地上，叫它打开。
        - id: ch02-b07
          speaker: narrator
          text: >-
            可他无论念多少遍口令，桌布都毫无动静，只让他白费唇舌。安东尼奥终于知道自己又上了当。
        - id: ch02-b08
          speaker: antonio
          text: >-
            那个老坏蛋店主又骗了我！他迟早会后悔。只要我再走进那家店，一定让他为我的驴子，还有偷走的其他财宝，吃足苦头！
          emotion: angry
        - id: ch02-b09
          speaker: narrator
          text: >-
            马塞拉盼望发财，却又一次落了空，气得再也忍不住。她转过身，把安东尼奥痛骂一顿，叫他立刻从眼前消失，还说往后再也不认这个儿子。可怜的年轻人被这些话伤透了心，垂头丧气，像夹着尾巴的狗一样溜回主人身边。食人妖一看见他，就猜中了全部经过，狠狠训斥起他来。
        - id: ch02-b10
          speaker: ogre
          text: >-
            你这个没用的饭桶！我真不知道，是什么拦着我没砸烂你的脑袋。你什么话都往外倒，那根长舌头一刻也不肯停。你要是在客店闭紧嘴巴，哪会有这场祸？如今吃苦，全怪你自己！
          emotion: angry
        - id: ch02-b11
          speaker: narrator
          text: >-
            安东尼奥一言不发地听着，活像挨过打的狗。他又服侍了食人妖三年，思乡病再一次发作，十分想念母亲和姐妹。
    - id: ch03
      title: 会打人的棍子
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            安东尼奥请求回家看看，食人妖马上答应。临行前，主人送给他一根雕刻精美的棍子，留作纪念。
        - id: ch03-b02
          speaker: ogre
          text: >-
            千万别说“棍子，起来”，也别说“棍子，躺下”。你要是真说了，那种滋味，我可一点也不想替你尝。
        - id: ch03-b03
          speaker: antonio
          text: >-
            您不用担心。我没有您想的那么蠢。二加二等于几，我比大多数人都明白。
        - id: ch03-b04
          speaker: ogre
          text: >-
            听你这么说，我很高兴。不过，空话像女人，行动才是男人。我的嘱咐你听见了。事先有了警告，自然就能防备。
        - id: ch03-b05
          speaker: narrator
          text: >-
            这一回，安东尼奥热情地谢过主人的恩惠，兴高采烈地上路。可他连半英里都没走到，便忍不住叫棍子起来。
        - id: ch03-b06
          speaker: narrator
          text: >-
            口令刚出口，棍子就跳到空中，快得像闪电，朝可怜的安东尼奥背上劈头盖脸地打。棍子落得又急又密，他差点连喊话的力气也没有，好不容易才叫它躺下。第二句口令一出口，棍子应声落地，总算不再把他的脊背打得青一块、紫一块。
        - id: ch03-b07
          speaker: narrator
          text: >-
            安东尼奥吃了一顿苦头，却满心欢喜。现在，他知道该怎样向恶毒的店主报仇了。他又来到那家客店，店主照旧热情招待他。安东尼奥也亲热地向对方问好，再请他代为保管棍子。
        - id: ch03-b08
          speaker: antonio
          text: >-
            朋友，劳驾替我照看这根棍子。不过，无论怎样都别说“棍子，起来”。你要是说了，一定会后悔，到时可别指望我同情你。
        - id: ch03-b09
          speaker: narrator
          text: >-
            店主以为第三桩好运终于到了，便给安东尼奥准备了上好的晚餐。等客人舒舒服服睡下，他飞奔到棍子跟前，还叫妻子一起来看热闹，然后迫不及待地念出了口令。
        - id: ch03-b10
          speaker: innkeeper
          text: >-
            棍子，起来！
        - id: ch03-b11
          speaker: narrator
          text: >-
            棍子立刻跳起来，毫不留情地痛打店主。店主被打得受不了，和妻子一起尖叫着奔进安东尼奥的房间。他们把熟睡的客人叫醒，眼看棍子还追着不放，只得苦苦求他饶命。
        - id: ch03-b12
          speakers: [innkeeper, innkeeper_wife]
          ensemble: duo
          text: >-
            求求你，快让它停下来！饶了我们吧！
          emotion: fearful
        - id: ch03-b13
          speaker: antonio
          text: >-
            除非你把偷走的东西全部还给我，否则我绝不会救你。那就让棍子一直打，直到把你活活打死！
          emotion: angry
        - id: ch03-b14
          speaker: innkeeper
          text: >-
            你的东西全都拿回去！只求你快救我，让这根可怕的棍子停下！
          emotion: fearful
        - id: ch03-b15
          speaker: narrator
          text: >-
            店主觉得自己已经命悬一线，立刻叫人归还驴子、桌布和其他财宝。安东尼奥收回所有东西，才命令棍子躺下。棍子马上停止殴打店主。
    - id: ch04
      title: 带回家的财富
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            安东尼奥带着失而复得的驴子和桌布，平平安安回到家。这一次，两句魔法口令终于都显了灵。宝驴和桌布给一家人带来源源不尽、数也数不清的财富。
        - id: ch04-b02
          speaker: narrator
          text: >-
            安东尼奥很快替一个姐妹办了婚事，又使母亲一辈子衣食无忧。从此，他们永远过着幸福快乐的生活。
        - id: ch04-b03
          speaker: narrator
          text: >-
            这个故事据克莱特克的意大利文本译出。
