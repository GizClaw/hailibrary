  chapters:
    - id: ch01
      title: The Goldfish and the Two Brothers
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Once there was a fisherman who had plenty of money, but no children. One day, an old woman came to his wife and asked what good all that prosperity could do when there were no children in the house.
        - id: ch01-b02
          speaker: fishermans_wife
          text: It is God's will that we have none.
        - id: ch01-b03
          speaker: wise_woman
          text: No, my child. Your husband is at fault. If he catches the little goldfish, you will surely have children. Tell him to return to the water tonight and bring the fish home. Cut it into six pieces. You must eat one, and your husband must eat another. Before long, you will have two children. Give the third piece to the dog, and she will have two puppies. Give the fourth to the mare, and she will have two foals. Bury one piece to the right of your door and the last piece to the left. Two cypress trees will grow there.
        - id: ch01-b04
          speaker: narrator
          text: That evening, the fisherman's wife repeated every word of the old woman's advice. Her husband promised to bring home the little goldfish. Early the next morning, he went down to the water and caught it. They cut it into six pieces. Husband and wife ate their shares, fed one piece to the dog and one to the mare, and buried the last two pieces on either side of the door.
        - id: ch01-b05
          speaker: narrator
          text: In time, the wife gave birth to two sons who looked so much alike that no one could tell them apart. The dog had two identical puppies, and the mare had two identical foals. Beside the front door, one on each side, two matching cypress trees sprang from the earth.
        - id: ch01-b06
          speaker: narrator
          text: The boys grew into young men. Though their family was wealthy, they did not want to stay at home. Both wished to travel through the world and make names for themselves. Their father could not bear to let his only children leave together.
        - id: ch01-b07
          speaker: fisherman
          text: One of you may travel first. When he comes home, the other may take his turn.
        - id: ch01-b08
          speaker: narrator
          text: So the elder twin chose his horse and his dog and prepared to leave. Before he set out, he spoke to his brother.
        - id: ch01-b09
          speaker: elder_twin
          text: Watch the cypress trees. While they stay green, you will know that I am alive and well. But if one begins to wither, hurry after me.
        - id: ch01-b10
          speaker: narrator
          text: With that, he rode away into the world.
    - id: ch02
      title: The Three Tasks
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: One day, the traveler stopped at an old woman's house. That evening, as he sat outside her door, he saw a castle on a hill and asked who lived there.
        - id: ch02-b02
          speaker: first_old_woman
          text: My son, that is the castle of the Fairest in the Land.
        - id: ch02-b03
          speaker: elder_twin
          text: Then I have come to ask her to marry me.
        - id: ch02-b04
          speaker: first_old_woman
          text: Many men have tried, my son, and every one of them lost his life. She cut off their heads and placed them on that post you see.
        - id: ch02-b05
          speaker: elder_twin
          text: Tomorrow I will go and court her. Either she will do the same to me, or I will win her.
        - id: ch02-b06
          speaker: narrator
          text: He took out his zither and began to play. The music was more beautiful than anything the people of that land had heard before. Even the princess came to her window to listen.
        - id: ch02-b07
          speaker: narrator
          text: The next morning, the Fairest in the Land sent for the old woman.
        - id: ch02-b08
          speaker: fairest_princess
          text: Who is staying with you, and who plays the zither so beautifully?
        - id: ch02-b09
          speaker: first_old_woman
          text: He is a stranger, Princess. He arrived yesterday evening.
        - id: ch02-b10
          speaker: narrator
          text: The princess ordered the stranger to be brought before her. When he arrived, she questioned him about his home, his family, and one thing after another. At last she admitted that his music had delighted her. She was willing to take him as her husband. He answered that he had come to the castle with exactly that hope.
        - id: ch02-b11
          speaker: fairest_princess
          text: Go to my father now and ask him for my hand. He will set you three problems. Come back afterward and tell me what they are.
        - id: ch02-b12
          speaker: narrator
          text: The stranger went straight to the king and asked to marry his daughter.
        - id: ch02-b13
          speaker: first_king
          text: I will gladly agree if you can do what I demand. If you fail, you will lose your head. A thick log lies outside. It is more than two fathoms long. Split it in two with a single stroke of your sword, and my daughter shall be your wife. Fail, and your life is forfeit.
        - id: ch02-b14
          speaker: narrator
          text: The young man returned to the old woman's house in deep distress. He was certain the task would cost him his head the next day. He thought so hard about how to split the log that he forgot all about his zither.
        - id: ch02-b15
          speaker: narrator
          text: That evening, the princess came to her window expecting music, but everything was silent. She called down to him.
        - id: ch02-b16
          speaker: fairest_princess
          text: Why are you so troubled tonight? Why aren't you playing your zither?
        - id: ch02-b17
          speaker: narrator
          text: He told her about the log and the king's threat. The princess only laughed.
        - id: ch02-b18
          speaker: fairest_princess
          text: Is that all you're worrying about? Bring out your zither and play for me. Come to me early tomorrow morning.
        - id: ch02-b19
          speaker: narrator
          text: He played for her throughout the evening. In the morning, she pulled one hair from her head and handed it to him.
        - id: ch02-b20
          speaker: fairest_princess
          text: Wind this hair around your sword. Then you will be able to split the log.
        - id: ch02-b21
          speaker: narrator
          text: The stranger did as she said. With one blow, he cleaved the great log in two. But the king was not ready to give up his daughter.
        - id: ch02-b22
          speaker: first_king
          text: You must complete another task before you can marry her.
        - id: ch02-b23
          speaker: elder_twin
          text: Tell me what I must do.
        - id: ch02-b24
          speaker: first_king
          text: Mount a horse and gallop for three miles. Carry a full goblet of water in each hand as you ride. Spill not one drop, and you may marry my daughter. If you fail, I will take your life.
        - id: ch02-b25
          speaker: narrator
          text: Once more, the stranger went back to the old woman's house. Once more, his fear made him forget the zither. The princess came to the window that evening, but heard no music.
        - id: ch02-b26
          speaker: fairest_princess
          text: What has happened now? Why don't you play for me?
        - id: ch02-b27
          speaker: narrator
          text: He explained the king's new command.
        - id: ch02-b28
          speaker: fairest_princess
          text: Don't let it trouble you. Play now, and come to me tomorrow morning.
        - id: ch02-b29
          speaker: narrator
          text: The next morning, she gave him her ring.
        - id: ch02-b30
          speaker: fairest_princess
          text: Throw this ring into the water. It will freeze at once, and not a drop will spill.
        - id: ch02-b31
          speaker: narrator
          text: He followed her instructions and carried both goblets all the way without losing any water.
        - id: ch02-b32
          speaker: first_king
          text: I have one final task for you. Tomorrow, my black champion will fight you. Defeat him, and you shall marry my daughter.
        - id: ch02-b33
          speaker: narrator
          text: This time, the stranger returned to the old woman's house full of joy. He was so cheerful that evening that the princess called to him from her window.
        - id: ch02-b34
          speaker: fairest_princess
          text: You sound very merry tonight. What did my father say to make you so glad?
        - id: ch02-b35
          speaker: elder_twin
          text: Tomorrow I must fight his black champion. He is only a man, as I am. I believe I can overcome him and win the contest.
        - id: ch02-b36
          speaker: fairest_princess
          text: This is the hardest task. I am the black champion. I drink a potion that changes me and gives me strength no one can defeat. Tomorrow morning, buy twelve buffalo hides at the market and wrap them around your horse. Tie this cloth around yourself. Show it to me when they set me loose against you, so I can hold back and spare your life. Strike my horse between the eyes. Once you kill it, you will have defeated me.
        - id: ch02-b37
          speaker: narrator
          text: The next morning, he went to the market and bought twelve buffalo hides. He wrapped every one of them around his horse and fastened the princess's cloth around himself. Then the fight began. When the black champion came at him, he showed the cloth, and she held back enough to spare him. Even so, the combat went on for a long time, until eleven of the hides had been torn apart. Then the stranger struck the champion's horse between the eyes. The horse fell dead, and with its fall, the black champion was defeated.
        - id: ch02-b38
          speaker: first_king
          text: You have solved all three problems. I accept you as my son-in-law.
        - id: ch02-b39
          speaker: elder_twin
          text: I have one matter to finish first. In fourteen days, I will return and take my bride home.
    - id: ch03
      title: The Giant at the Spring
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: The young man left that country and traveled on. In another land, he came to a great town and stopped at the house of an old woman. After supper, he asked her for a drink of water.
        - id: ch03-b02
          speaker: second_old_woman
          text: My son, I have no water. A giant has seized the spring. He lets us draw water only once a year, after we bring him a maiden to eat. This time, the lot has fallen on the king's daughter. Tomorrow they will lead her to the spring.
        - id: ch03-b03
          speaker: narrator
          text: The next day, the princess was taken to the spring and bound there with a golden chain. All the people went away, leaving her alone.
        - id: ch03-b04
          speaker: narrator
          text: Once everyone had gone, the stranger came out and approached the maiden. He asked what terrible thing had happened to make her weep so bitterly. Bound beside the giant's spring, she told him that the giant would soon arrive and eat her.
        - id: ch03-b05
          speaker: elder_twin
          text: I will set you free, if you will take me as your husband.
        - id: ch03-b06
          speaker: narrator
          text: The princess agreed with joy. Before long, the giant appeared at the spring. The stranger sent his dog straight at him. The dog caught the giant by the throat and throttled him until he died. Only then did the stranger release the princess from the golden chain.
        - id: ch03-b07
          speaker: narrator
          text: When the king heard what had happened, he gladly approved the marriage. The wedding was celebrated with great rejoicing, and the young bridegroom remained in the palace for one hundred and one weeks.
        - id: ch03-b08
          speaker: narrator
          text: At last, palace life began to feel too dull to him, and he decided to go hunting. The king tried to stop him, but the young man would not change his mind. Then the king begged him to take a proper escort. He refused that too and rode out with only his horse and his dog.
    - id: ch04
      title: The Hut of Stone
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: The hunter had ridden a long way when he spotted a hut in the distance. He made for it, hoping to get some water. An old woman was there, and he asked her for a drink.
        - id: ch04-b02
          speaker: witch
          text: First, let me tap your dog with my little wand. Then it cannot bite me while I fetch the water.
        - id: ch04-b03
          speaker: narrator
          text: The hunter agreed, believing she only meant to protect herself from a bite. But the moment her little wand touched the dog, it turned to stone. Then she struck the hunter with the wand and turned him to stone. His horse was the last to feel its touch, and it became stone beside them.
        - id: ch04-b04
          speaker: narrator
          text: At that very moment, the cypress trees outside the fisherman's house began to wither. The younger twin saw them and set out at once to find his brother.
        - id: ch04-b05
          speaker: narrator
          text: His search first brought him to the town where his brother had killed the giant. By chance, he lodged with the same old woman his brother had visited. Because the twins looked exactly alike, she mistook him for the bridegroom.
        - id: ch04-b06
          speaker: second_old_woman
          text: My son, please don't think badly of me because I failed to come and congratulate you on your marriage to the king's daughter.
        - id: ch04-b07
          speaker: narrator
          text: The younger twin understood her mistake, but did not explain it.
        - id: ch04-b08
          speaker: younger_twin
          text: Never mind that, old woman.
        - id: ch04-b09
          speaker: narrator
          text: He rode on without another word and reached the king's palace. The king and the princess also believed he was his twin.
        - id: ch04-b10
          speakers: [second_king, spring_princess]
          ensemble: duo
          text: Why were you away for so long? We feared that something terrible had happened to you.
        - id: ch04-b11
          speaker: narrator
          text: That night, the princess still believed he was her husband. When they lay down to sleep, the younger twin placed his sword between them. At dawn, he rose and went hunting.
    - id: ch05
      title: The Brother's Rescue
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: Chance led the younger twin along the same road his brother had taken. From a distance, he saw the stone figure and recognized his brother. He went into the hut and commanded the old woman to break the spell.
        - id: ch05-b02
          speaker: witch
          text: Let me touch your dog with my wand first. Then I will free your brother.
        - id: ch05-b03
          speaker: narrator
          text: But the younger twin ordered his dog to seize her. The animal bit her up to the knee, and she cried out in pain.
        - id: ch05-b04
          speaker: witch
          text: Call off your dog, and I will set your brother free!
        - id: ch05-b05
          speaker: younger_twin
          text: Tell me the magic words. I will free him myself.
        - id: ch05-b06
          speaker: narrator
          text: The witch refused, so he ordered the dog to bite her up to the hip. At last, she gave in.
        - id: ch05-b07
          speaker: witch
          text: I have two wands. The green one turns living creatures to stone. The red one brings them back to life.
        - id: ch05-b08
          speaker: narrator
          text: The younger twin took the red wand from her. First he touched his brother and brought him back to life. Then he used it on his brother's horse and dog, restoring them both. When all three were free of the spell, he ordered his own dog to devour the witch completely.
        - id: ch05-b09
          speaker: narrator
          text: The brothers started back toward the king's castle. As they traveled, the younger twin explained everything. He told how the cypress tree had suddenly dried and withered, how he had left home at once to search for his twin, and how he had reached the father-in-law's castle and claimed the princess as his wife.
        - id: ch05-b10
          speaker: narrator
          text: When the elder twin heard this, anger overcame him. He struck his brother on the forehead and killed him. Then he returned alone to his father-in-law's house.
    - id: ch06
      title: The Water of Life
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: That night, as the elder twin lay in bed, the princess asked him a question.
        - id: ch06-b02
          speaker: spring_princess
          text: What was wrong with you last night? You never said one word to me.
        - id: ch06-b03
          speaker: elder_twin
          text: That was not me. It was my brother. I killed him because he told me that he had come here and claimed you as his wife!
          emotion: angry
        - id: ch06-b04
          speaker: spring_princess
          text: Do you know where you killed him? Can you find his body again?
        - id: ch06-b05
          speaker: elder_twin
          text: I know the exact place.
        - id: ch06-b06
          speaker: spring_princess
          text: Then tomorrow, we will ride there together.
        - id: ch06-b07
          speaker: narrator
          text: The next morning, they set out. When they reached the place, the princess drew out a small bottle she had brought with her. She sprinkled a few drops of its water over the body, and the younger twin came back to life at once.
        - id: ch06-b08
          speaker: narrator
          text: As soon as his brother stood up, the elder twin asked for forgiveness.
        - id: ch06-b09
          speaker: elder_twin
          text: Forgive me, dear brother. I killed you in my anger.
        - id: ch06-b10
          speaker: narrator
          text: The brothers embraced. Together, they returned to the Fairest in the Land, and the younger twin took her as his wife.
        - id: ch06-b11
          speaker: narrator
          text: Then the brothers brought their parents to live with them, and they all lived together in joy and happiness.
