audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 亲切从容，保留古老童话的神秘感
        timbre: 温暖清晰
        pace: 舒缓
        pitch: 中音
    fishermans_wife:
      display_name: 渔夫妻子
      tts:
        delivery: 朴实温顺，心中藏着对孩子的渴望
        timbre: 柔和清亮
        pace: 适中
        pitch: 中高音
    wise_woman:
      display_name: 神秘老妇人
      tts:
        delivery: 笃定神秘，说话像在传授古老秘密
        timbre: 苍老清晰
        pace: 稍慢
        pitch: 中低音
    first_twin:
      display_name: 先出门的兄弟
      tts:
        delivery: 勇敢自信，冲动中带着年轻人的骄傲
        timbre: 明亮有力
        pace: 适中
        pitch: 中音
    second_twin:
      display_name: 前来相救的兄弟
      tts:
        delivery: 果断机警，重情而克制
        timbre: 清朗坚定
        pace: 适中
        pitch: 中音
    first_hostess:
      display_name: 第一位女主人
      tts:
        delivery: 慈和谨慎，熟知城堡里的危险
        timbre: 苍老温厚
        pace: 稍慢
        pitch: 中低音
    fairest_princess:
      display_name: 天下第一美人
      tts:
        delivery: 聪慧从容，言语中自有主见
        timbre: 清澈端庄
        pace: 适中
        pitch: 中高音
    first_king:
      display_name: 第一位国王
      tts:
        delivery: 威严冷峻，出题时不容置疑
        timbre: 浑厚沉稳
        pace: 稍慢
        pitch: 低音
    second_hostess:
      display_name: 第二位女主人
      tts:
        delivery: 善良忧虑，谈起巨人时满怀惧意
        timbre: 苍老柔和
        pace: 稍慢
        pitch: 中低音
    rescued_princess:
      display_name: 泉边的公主
      tts:
        delivery: 温柔真挚，危难中仍很勇敢
        timbre: 柔润清亮
        pace: 适中
        pitch: 中高音
    second_king:
      display_name: 第二位国王
      tts:
        delivery: 慈爱庄重，对女儿的安危十分关切
        timbre: 浑厚温和
        pace: 稍慢
        pitch: 低音
    witch:
      display_name: 石屋老妇人
      tts:
        delivery: 阴险狡猾，受制时惊慌求饶
        timbre: 干涩低哑
        pace: 适中
        pitch: 中低音
  chapters:
    - id: ch01
      title: 金鱼的预言
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            从前，有个渔夫很有钱，可夫妻俩一直没有孩子。一天，一位神秘的老妇人来见渔夫的妻子，问她家里没有孩子，再富足又有什么用。
        - id: ch01-b02
          speaker: fishermans_wife
          text: >-
            这是上帝的旨意。
        - id: ch01-b03
          speaker: wise_woman
          text: >-
            不，孩子，错在你丈夫。只要他捉住那条小金鱼，你们就会有孩子。今晚叫他回到水边，把鱼捉来，切成六块。你们夫妻各吃一块，就会生下两个孩子。第三块喂狗，第四块喂母马，它们也会各生两个孩子。最后两块分别埋在大门左右，那里会长出两棵柏树。
        - id: ch01-b04
          speaker: narrator
          text: >-
            傍晚，妻子把老妇人的嘱咐全都告诉了渔夫。渔夫答应下来，第二天一大早便去水边，果然捉回小金鱼。夫妻俩照老妇人的话一一做了。日子到了，他们生下两个长得一模一样的儿子，谁也分辨不出。狗生了两只毫无分别的小狗，母马生了两匹相同的小马，门前左右也各长出一棵柏树，两棵树分毫不差。
        - id: ch01-b05
          speaker: narrator
          text: >-
            两个孩子长大后，虽然家里十分富有，却不愿一辈子守在家中。他们都想到外面的世界闯荡，挣出自己的名声。父亲只有这两个孩子，舍不得他们同时离开，只答应先让一个出去，等他回来，另一个再走。
        - id: ch01-b06
          speaker: first_twin
          text: >-
            我走以后，你就看着门前的柏树。只要两棵树还青翠，我便平安无事。要是有一棵开始枯萎，你马上来找我。
        - id: ch01-b07
          speaker: narrator
          text: >-
            说完，他带着自己的马和狗离开家，独自走进外面的世界，开始四处闯荡。
    - id: ch02
      title: 天下第一美人的三道难题
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            一天，年轻人投宿在一位老妇人家中。傍晚，他坐在门前，看见对面山上高高矗立着一座城堡，便问老妇人，那座气派的城堡究竟是谁的住处。
        - id: ch02-b02
          speaker: first_hostess
          text: >-
            孩子，那是天下第一美人的城堡。
        - id: ch02-b03
          speaker: first_twin
          text: >-
            我正是来向她求婚的！
        - id: ch02-b04
          speaker: first_hostess
          text: >-
            已经有许多人这样做过，可他们全都丢了性命。公主砍下他们的头，插在那根柱子上。
        - id: ch02-b05
          speaker: first_twin
          text: >-
            明天我也要去。要么她砍下我的头，要么我赢得她的心。
        - id: ch02-b06
          speaker: narrator
          text: >-
            年轻人取出齐特琴，在门前弹奏起来。那琴声美得整个国度从未听过，连城堡里的公主也来到窗前倾听。第二天早晨，她派人把老妇人叫去，想知道这位琴师是谁。
        - id: ch02-b07
          speaker: fairest_princess
          text: >-
            住在你家的是谁？他的齐特琴为什么弹得那么好？
        - id: ch02-b08
          speaker: first_hostess
          text: >-
            公主，是一位异乡人，昨晚才到这里。
        - id: ch02-b09
          speaker: narrator
          text: >-
            公主随即命人把异乡人带到面前。她问起他的故乡和家人，又问了许多别的事。谈到最后，公主坦言自己十分喜爱他的琴声，愿意嫁他为妻。异乡人也告诉她，自己千里迢迢来到这里，正是为了娶她。
        - id: ch02-b10
          speaker: fairest_princess
          text: >-
            那你先去见我父王，告诉他你想娶我。他会给你出三道难题。听完以后，再回来告诉我。
        - id: ch02-b11
          speaker: narrator
          text: >-
            异乡人来到国王面前，说明了自己的心愿。
        - id: ch02-b12
          speaker: first_king
          text: >-
            只要你办到我交代的事，我便答应。外面的空地上躺着一根粗木头，足有两英寻多长。你若能只用一剑把它从中劈成两半，就能娶我女儿。劈不开，便拿自己的脑袋来抵。
        - id: ch02-b13
          speaker: narrator
          text: >-
            异乡人退出王宫，愁苦万分地回到老妇人家中。他认定自己第二天非得用脑袋向国王偿命不可，满心只想着怎样劈开那根又粗又长的木头，连最喜爱的齐特琴也忘了弹。傍晚，公主又来到窗边听琴，四周却一点声音也没有。
        - id: ch02-b14
          speaker: fairest_princess
          text: >-
            你今晚怎么这样垂头丧气，连齐特琴也不弹了？
        - id: ch02-b15
          speaker: narrator
          text: >-
            异乡人说出自己的烦恼，公主却笑了。
        - id: ch02-b16
          speaker: fairest_princess
          text: >-
            就为这个发愁吗？快弹首曲子给我听，明天一早再来找我。
        - id: ch02-b17
          speaker: narrator
          text: >-
            异乡人拿出齐特琴，为公主弹了整整一晚。第二天一早，他依约来到城堡。公主从自己的头发中拔下一根，交到他手里。
        - id: ch02-b18
          speaker: fairest_princess
          text: >-
            把这根头发缠在剑上，你就能劈开木头。
        - id: ch02-b19
          speaker: narrator
          text: >-
            异乡人把那根头发牢牢缠在剑上，来到空地。他举剑只劈了一下，粗大的木头就从中裂成两半。国王亲眼见他完成难题，却还不肯让他娶公主。
        - id: ch02-b20
          speaker: first_king
          text: >-
            在你迎娶我女儿以前，我还要再给你一道难题。
        - id: ch02-b21
          speaker: first_twin
          text: >-
            请继续说吧。
        - id: ch02-b22
          speaker: first_king
          text: >-
            你要双手各端一杯满满的水，骑马飞奔三英里。一滴不洒，我便把女儿嫁给你。失败了，我就取你性命。
        - id: ch02-b23
          speaker: narrator
          text: >-
            这一次，异乡人又愁得忘了弹琴。公主来到窗前，发现四下仍然寂静。
        - id: ch02-b24
          speaker: fairest_princess
          text: >-
            今天又出了什么事？你的齐特琴怎么不响了？
        - id: ch02-b25
          speaker: narrator
          text: >-
            异乡人说完国王的命令，公主叫他别烦恼，只管弹琴，明早再去见她。第二天，她将自己的戒指递给他。
        - id: ch02-b26
          speaker: fairest_princess
          text: >-
            把戒指丢进水里，水马上会结冰，一滴也洒不出来。
        - id: ch02-b27
          speaker: narrator
          text: >-
            异乡人照公主说的，把戒指丢进水里。杯中的水立刻冻住了。他双手端着杯子，骑马全速跑完三英里，果然没有洒出一滴。可国王还没有让他迎娶公主，而是出了第三道，也是最后一道难题。
        - id: ch02-b28
          speaker: first_king
          text: >-
            我有一个黑人。明天你要同他决斗，打赢以后才能娶我女儿。
        - id: ch02-b29
          speaker: narrator
          text: >-
            异乡人满心欢喜地回到老妇人家。那天晚上，他兴致勃勃地弹起琴来。公主听出了他格外快活，便在窗前问他，父王究竟说了什么。
        - id: ch02-b30
          speaker: first_twin
          text: >-
            明天我只要同一个黑人决斗。他也和我一样是个人，我一定能制服他。
        - id: ch02-b31
          speaker: fairest_princess
          text: >-
            这才是最难的一关。那个黑人就是我。我喝下药水，会变成一个力大无穷的黑人。明早去买十二张水牛皮，把你的马裹住，再把这块布系在身上。交手时让我看见它，我才能收住力气，不杀死你。你还要击中我的马双眼之间。杀死那匹马，你才算胜过我。
        - id: ch02-b32
          speaker: narrator
          text: >-
            第二天一早，异乡人到集市买来十二张水牛皮，一张又一张裹住自己的坐骑。决斗开始了，双方交战了很久。黑人的力量果然无人能敌，十二张水牛皮已有十一张被撕破。就在这时，异乡人终于击中对方坐骑的双眼之间。那匹马当场倒地死去，黑人也就败下阵来。
        - id: ch02-b33
          speaker: first_king
          text: >-
            你破解了三道难题，我认你做女婿。
        - id: ch02-b34
          speaker: first_twin
          text: >-
            我还有事情没办完。十四天以后，我会回来接走新娘。
    - id: ch03
      title: 泉边的公主
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            异乡人去了另一个国家，在一座大城里投宿。吃过晚饭，他向女主人讨水喝。
        - id: ch03-b02
          speaker: second_hostess
          text: >-
            孩子，我这里一滴水也没有。巨人霸占了泉眼，每年只准我们取一次水，还要送给他一个少女。他先把少女吃掉，然后才让城里的人打水。今年抽中了国王的女儿，明天她就要被带到泉边。
        - id: ch03-b03
          speaker: narrator
          text: >-
            第二天，公主果然被人带到泉边，用一条金链锁在那里。等所有人都离开，只留下她孤零零一个，异乡人才走上前去，问她为什么这样悲伤。公主哭着说，巨人很快就会赶来吃掉自己。异乡人答应救她重获自由，只问她是否愿意嫁给自己。公主听说还有生路，欢天喜地地答应了。
        - id: ch03-b04
          speaker: narrator
          text: >-
            巨人一出现在泉边，异乡人便放狗扑上去。狗一口咬住巨人的咽喉，死死扼住，直到他断了气。被金链锁住的公主终于得救。国王听见这个消息，也欣然答应女儿的婚事。婚礼办得喜气洋洋，年轻的新郎从此住进王宫，一住便是一百零一个星期。
        - id: ch03-b05
          speaker: narrator
          text: >-
            后来，他渐渐觉得宫中的日子太乏味，想要出门打猎。国王很想拦住他，却怎么也劝不动，只好请求女婿至少带上足够的随从。年轻人还是婉言推辞了，独自带着自己的马和狗上路。
    - id: ch04
      title: 枯萎的柏树
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            猎人已经骑出很远，才望见远处有一间小屋。他径直来到屋前，向里面的老妇人讨水喝。老妇人说，她去取水以前，得先用小魔杖打一下他的狗，免得狗咬她。猎人答应了。魔杖刚碰到狗，狗立刻化成石头。老妇人接着碰了猎人和他的马，他们也一动不动地成了石像。
        - id: ch04-b02
          speaker: narrator
          text: >-
            就在猎人化成石头的那一刻，渔夫家门前那两棵一直青翠的柏树开始枯萎。另一个兄弟一看，知道孪生兄弟出了事，立刻动身去寻找他。他先来到巨人被杀的那座城。命运又把他引到兄弟投宿过的老妇人家中。老妇人看见两人长得毫无分别，便把他认错了。
        - id: ch04-b03
          speaker: second_hostess
          text: >-
            孩子，你同国王的女儿成婚时，我没去道喜，你可不要怪我。
        - id: ch04-b04
          speaker: second_twin
          text: >-
            没关系，老婆婆。
        - id: ch04-b05
          speaker: narrator
          text: >-
            他看出老妇人认错了人，却没有解释，也没再多说一句，只管骑马来到王宫。国王和公主看见那张一模一样的脸，也都把他当成了失踪许久的亲人。
        - id: ch04-b06
          speakers: [rescued_princess, second_king]
          ensemble: duo
          text: >-
            你怎么去了这么久？我们还以为你遇上了祸事。
        - id: ch04-b07
          speaker: narrator
          text: >-
            夜里，公主仍以为他是自己的丈夫。两人睡在同一张床上，他却把剑横在彼此之间，一夜没有越过。第二天一早，他早早起身，独自出去打猎。命运把他引上孪生兄弟走过的那条路。他从远处便看见那尊石像，也一眼认出，石像正是自己苦苦寻找的人。
        - id: ch04-b08
          speaker: narrator
          text: >-
            他走进小屋，命令老妇人解除魔法。
        - id: ch04-b09
          speaker: witch
          text: >-
            先让我用魔杖碰一下你的狗，我就救你兄弟。
        - id: ch04-b10
          speaker: narrator
          text: >-
            年轻人反而命令狗咬住老妇人，一直咬到她膝盖。
        - id: ch04-b11
          speaker: witch
          text: >-
            快叫它松口！我这就救你兄弟！
          emotion: fearful
        - id: ch04-b12
          speaker: second_twin
          text: >-
            把解开魔法的咒语告诉我，我自己救他。
        - id: ch04-b13
          speaker: narrator
          text: >-
            老妇人不肯说，年轻人便叫狗继续往上咬，一直咬到她腰间。
        - id: ch04-b14
          speaker: witch
          text: >-
            我有两根魔杖！绿魔杖把人变成石头，红魔杖能让人重新活过来！
          emotion: fearful
        - id: ch04-b15
          speaker: narrator
          text: >-
            年轻人立刻拿起红魔杖，让自己的兄弟恢复原样，又救活了兄弟的马和狗。随后，他命令自己的狗把老妇人整个吃掉。
    - id: ch05
      title: 两次死而复生
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: >-
            兄弟俩一同踏上返回王宫的路。途中，前来相救的那一个把自己的经历从头说起。他讲到门前的柏树怎样突然枯萎，自己怎样马上出门寻找兄弟，又怎样来到对方岳父的王宫，把那里的公主认作自己的妻子。获救的兄弟一听到这句话，顿时怒火冲天。他猛击救命恩人的额头，竟把亲兄弟打死了，随后独自回到岳父家中。
        - id: ch05-b02
          speaker: rescued_princess
          text: >-
            昨晚你是怎么了？为什么一句话也不肯对我说？
        - id: ch05-b03
          speaker: first_twin
          text: >-
            昨晚那个人不是我，是我的兄弟！我已经杀了他。他在回来的路上告诉我，他把你认作了自己的妻子！
          emotion: angry
        - id: ch05-b04
          speaker: rescued_princess
          text: >-
            你还记得杀死他的地方吗？能找到他的尸体吗？
        - id: ch05-b05
          speaker: first_twin
          text: >-
            我记得清清楚楚。
        - id: ch05-b06
          speaker: rescued_princess
          text: >-
            那么，我们明天一起骑马去那里。
        - id: ch05-b07
          speaker: narrator
          text: >-
            第二天一早，两人一同骑马出发。来到杀人的地方，公主取出随身带来的一只小瓶，将几滴瓶中的水洒在尸体上。水滴刚一落下，死去的兄弟便立刻活了过来，重新站起身。
        - id: ch05-b08
          speaker: first_twin
          text: >-
            好兄弟，请原谅我。我一时发怒，竟然杀了你。
        - id: ch05-b09
          speaker: narrator
          text: >-
            兄弟俩紧紧拥抱，彼此和好。随后，他们一同去见那位天下第一美人，尚未成婚的兄弟终于迎娶了她。最后，兄弟俩把父母接到身边，大家住在一起。从此，一家人欢欢喜喜，过着幸福快乐的生活。
