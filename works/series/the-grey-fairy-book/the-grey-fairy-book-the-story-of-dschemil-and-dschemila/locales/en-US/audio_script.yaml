  chapters:
    - id: ch01
      title: The Iron Mortar
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: There once lived a young man named Dschemil, and his cousin was called Dschemila. Their parents had promised them to each other when they were children. Now Dschemil believed it was time for them to marry. He traveled two or three days to the nearest large town to buy furnishings for their new home.
        - id: ch01-b02
          speaker: narrator
          text: While he was gone, Dschemila went into the nearby woods with several maidens to gather sticks. There she found an iron mortar on the ground and set it on top of her bundle. Each time she lifted the bundle toward her shoulders, the mortar slid off one side. At last she decided to untie the sticks and fasten it in the very center. She had just begun when her companions called to her.
        - id: ch01-b03
          speaker: maiden_1
          text: Dschemila, what are you still doing? It's nearly dark. If you're coming home with us, you must hurry.
        - id: ch01-b04
          speaker: dschemila
          text: You'd better go without me. I won't leave this mortar here, even if it takes me until midnight.
        - id: ch01-b05
          speaker: maiden_2
          text: Then do as you please.
        - id: ch01-b06
          speaker: narrator
          text: The maidens started home. Night came quickly. As the last light faded, the mortar suddenly turned into an ogre. He threw Dschemila across his back and carried her to a lonely place a whole month's journey from her town. He shut her inside a castle and told her not to be afraid, because he would spare her life. Then he went back to his wife and left Dschemila there, weeping over the trouble she had brought upon herself.
        - id: ch01-b07
          speaker: narrator
          text: By then, the other maidens had reached home. Dschemila's mother came out to meet them, looking anxiously for her daughter.
        - id: ch01-b08
          speaker: dschemila_mother
          text: Where is Dschemila? What have you done with her?
          emotion: fearful
        - id: ch01-b09
          speaker: maiden_1
          text: We had to leave her in the woods. She found an iron mortar and couldn't manage to carry it.
        - id: ch01-b10
          speaker: narrator
          text: The mother hurried straight toward the forest, calling Dschemila's name as she went. People in the town heard her cries.
        - id: ch01-b11
          speaker: townsman_1
          text: Go home. We'll search for your daughter. This is work for strong men, and you shouldn't face it alone.
        - id: ch01-b12
          speaker: dschemila_mother
          text: Yes, you must go, but I'm going with you. Perhaps we'll find only her body. An asp may have stung her, or a wild beast may have eaten her.
          emotion: fearful
        - id: ch01-b13
          speaker: narrator
          text: The men saw that nothing could change her mind, so they argued no more. They ordered one of the maidens to come along and show them exactly where Dschemila had been left. When they reached the place, her bundle of wood still lay where she had dropped it. But the maiden herself was nowhere to be seen.
        - id: ch01-b14
          speakers: [dschemila_mother, townsman_1, townsman_2, maiden_1]
          ensemble: chorus
          text: Dschemila! Dschemila!
        - id: ch01-b15
          speaker: narrator
          text: No answer came.
        - id: ch01-b16
          speaker: townsman_2
          text: Let's make a fire. She may see its light.
        - id: ch01-b17
          speaker: narrator
          text: They lit a fire, then went off through the forest in different directions to search. As they moved among the trees, they whispered about what they might find. If a lion had killed her, it would surely have left some trace. If she had fallen asleep somewhere, the sound of their voices should wake her. If a snake had bitten her, they would at least come upon her body. They searched through the entire night. Morning arrived, and they knew no more than before.
        - id: ch01-b18
          speaker: townsman_1
          text: This is no use. Come home with us. Nothing has happened to your daughter except that she has run away with a man.
        - id: ch01-b19
          speaker: dschemila_mother
          text: I'll come, but first I must search the river. Someone may have thrown her into it.
        - id: ch01-b20
          speaker: narrator
          text: Dschemila was not in the river. For four days, her father and mother watched and waited for her return. At last they lost hope.
        - id: ch01-b21
          speaker: dschemila_father
          text: What can we do? What will we tell the man she was promised to? We'll kill a goat and bury its head in a grave. When Dschemil returns, we must tell him that Dschemila is dead.
    - id: ch02
      title: A Message from the Castle
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: Dschemil soon returned with carpets and soft cushions for the home he meant to share with his bride. Dschemila's father met him as he entered the town.
        - id: ch02-b02
          speaker: dschemila_father
          text: Welcome home. Dschemila is dead.
        - id: ch02-b03
          speaker: narrator
          text: At those words, Dschemil broke into loud cries. For some time, grief left him unable to speak. A crowd gathered around him, and when he finally found his voice, he turned to one of the people standing there.
        - id: ch02-b04
          speaker: dschemil
          text: Where did they bury her?
          emotion: sad
        - id: ch02-b05
          speaker: townsman_1
          text: Come with me to the graveyard.
        - id: ch02-b06
          speaker: narrator
          text: Dschemil took some of the beautiful things he had bought and followed the man to the graveyard. He laid the carpets and other goods on the grass beside the grave, then began to weep again. He remained there all day. When night fell, he gathered up the things and carried them home. But as soon as day broke, he took them in his arms and returned. He stayed beside the grave for as long as there was light, playing softly on his flute. He did the same thing every day for six months.
        - id: ch02-b07
          speaker: narrator
          text: One morning, a man who had lost his way in the desert came upon the lonely castle. The sun burned overhead, and he was exhausted.
        - id: ch02-b08
          speaker: stranger
          text: I'll rest for a while in the castle's shade.
        - id: ch02-b09
          speaker: narrator
          text: He stretched out comfortably and had almost fallen asleep when a soft voice called down to him.
        - id: ch02-b10
          speaker: dschemila
          text: Are you a ghost, or are you a man?
        - id: ch02-b11
          speaker: narrator
          text: The traveler looked up and saw a maiden leaning from a window.
        - id: ch02-b12
          speaker: stranger
          text: I'm a man, and a better one than your father or your grandfather.
        - id: ch02-b13
          speaker: dschemila
          text: Then may good luck go with you. But why have you come into this land of ogres and horrors?
        - id: ch02-b14
          speaker: stranger
          text: Does an ogre truly live in this castle?
        - id: ch02-b15
          speaker: dschemila
          text: He certainly does, and night is near. He'll be back soon. Please leave quickly, my friend, or he'll catch you and eat you for supper.
          emotion: fearful
        - id: ch02-b16
          speaker: stranger
          text: But I'm dying of thirst. Please give me something to drink. There must be a spring somewhere, even in this desert.
        - id: ch02-b17
          speaker: dschemila
          text: Whenever the ogre brings water home, he comes from that direction. Follow the same way, and perhaps you'll find the spring.
        - id: ch02-b18
          speaker: narrator
          text: The man jumped up to leave, but Dschemila called to him once more.
        - id: ch02-b19
          speaker: dschemila
          text: Wait. Where are you going?
        - id: ch02-b20
          speaker: stranger
          text: Why do you ask?
        - id: ch02-b21
          speaker: dschemila
          text: I have a task for you, but first tell me whether you're traveling east or west.
        - id: ch02-b22
          speaker: stranger
          text: I'm going to Damascus.
        - id: ch02-b23
          speaker: dschemila
          text: Then please do this for me. When you pass through our village, ask for Dschemil. Tell him, “Dschemila sends you greetings from the faraway castle that rocks in the wind. There is only a goat in my grave. Take heart.”
        - id: ch02-b24
          speaker: narrator
          text: The stranger promised and went on until he found the spring. He drank a great draught, then lay down on the bank and slept peacefully. When he woke, he thought about the maiden's kindness. Without her directions, a few more hours might have killed him. He decided he would certainly do as she asked. He would find her town and seek out the man who was meant to hear her message.
        - id: ch02-b25
          speaker: narrator
          text: He traveled for a month. At last he reached Dschemil's town. There sat the young man outside his door, his beard unshaven and his shaggy hair falling over his eyes.
        - id: ch02-b26
          speaker: dschemil
          text: Welcome, stranger. Where have you come from?
        - id: ch02-b27
          speaker: stranger
          text: I came from the west, and I'm heading east.
        - id: ch02-b28
          speaker: dschemil
          text: Stay with us for a while. Come in, rest, and eat.
        - id: ch02-b29
          speaker: narrator
          text: The stranger went inside, and food was placed before him. He sat down with the maiden's father, her brothers, and the others in the house. Only Dschemil kept away from the table. He stayed crouched on the threshold while everyone else ate.
        - id: ch02-b30
          speaker: stranger
          text: Why aren't you eating with us?
        - id: ch02-b31
          speaker: brother_1
          text: Leave him alone and don't pay attention. He eats only at night.
        - id: ch02-b32
          speaker: narrator
          text: The stranger quietly returned to his food. Then one of Dschemil's brothers called across the room.
        - id: ch02-b33
          speaker: brother_2
          text: Dschemil, bring us some water.
        - id: ch02-b34
          speaker: narrator
          text: At the sound of that name, the stranger remembered his promise.
        - id: ch02-b35
          speaker: stranger
          text: Is there someone here named Dschemil? I was lost in the desert when I found a castle. A maiden looked down from a window and—
        - id: ch02-b36
          speakers: [brother_1, brother_2]
          ensemble: duo
          text: Quiet! Stop talking!
          emotion: fearful
        - id: ch02-b37
          speaker: narrator
          text: They feared that Dschemil would hear, but it was too late. He stepped forward.
        - id: ch02-b38
          speaker: dschemil
          text: What did you see? Tell me the truth, or I'll cut off your head this instant!
          emotion: angry
        - id: ch02-b39
          speaker: stranger
          text: My lord, I was wandering through the desert, lost, hot, and tired. I saw a great castle and said I would rest in its shade. A maiden looked from the window and asked whether I was a ghost or a man. I said I was a man, and a better one than her father or grandfather. I begged her for water because I felt near death, but she had none. She told me the ogre who owned the castle always brought water from one direction, so I might find it there. Before I left, she asked me to come to her town and find you. Her message was this. “Dschemila sends you greetings from the faraway castle that rocks in the wind. There is only a goat in my grave. Take heart.”
        - id: ch02-b40
          speaker: dschemil
          text: Is this true? Is Dschemila alive after all? Was she taken from her home?
        - id: ch02-b41
          speakers: [dschemila_father, brother_1, brother_2]
          ensemble: chorus
          text: No, his story is nothing but lies. Dschemila is dead. Everyone knows that.
        - id: ch02-b42
          speaker: dschemil
          text: I'll find out for myself.
        - id: ch02-b43
          speaker: narrator
          text: He snatched up a spade and hurried to the grave where the goat's head had been buried. When the truth could no longer be hidden from him, the family confessed everything.
        - id: ch02-b44
          speaker: dschemila_father
          text: Then hear what happened. While you were away, she went to gather wood with the other maidens. She found an iron mortar and wanted to bring it home, but she could neither carry it nor leave it. The others came back without her. Night fell, and we searched everywhere, but found nothing. We feared that if you learned she was missing, you would go after her and be lost as well. So we killed a goat, buried it in her grave, and told you she was dead. Now you know the truth. Do what you must, but take this traveler with you so he can show you the way.
        - id: ch02-b45
          speaker: dschemil
          text: That's the best plan. Give me food and my sword. We leave at once.
        - id: ch02-b46
          speaker: stranger
          text: I won't waste another whole month leading you back to that castle. If it were only a day or two, I might agree, but not a month.
        - id: ch02-b47
          speaker: dschemil
          text: Come with me for three days. Put me on the right road, and I'll reward you well.
        - id: ch02-b48
          speaker: stranger
          text: Very well. We'll do it that way.
    - id: ch03
      title: Inside the Ogre's Castle
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: For three days, the two men traveled from sunrise until sunset. Then the stranger stopped.
        - id: ch03-b02
          speaker: stranger
          text: Dschemil?
        - id: ch03-b03
          speaker: dschemil
          text: Yes?
        - id: ch03-b04
          speaker: stranger
          text: Keep straight ahead until you reach a spring. Go a little beyond it, and the castle will soon stand before you.
        - id: ch03-b05
          speaker: dschemil
          text: I'll do exactly that.
        - id: ch03-b06
          speaker: stranger
          text: Then farewell.
        - id: ch03-b07
          speaker: narrator
          text: The stranger turned toward home. Dschemil traveled on alone for another twenty-six days. At last he saw a patch of green rising from the sandy desert and knew the spring must be near. He hurried to it, knelt, and drank thirstily from the bubbling water. Then he stretched out on the cool grass to think.
        - id: ch03-b08
          speaker: dschemil
          text: If the stranger was right, the castle must be close. I'll sleep here tonight. Tomorrow, in daylight, I should be able to find it.
        - id: ch03-b09
          speaker: narrator
          text: He slept long and peacefully. The sun stood high when he woke. He jumped up, washed his face and hands in the spring, and started on the last part of his journey. He had not walked far when the castle suddenly stood before him. Only a moment earlier, he had looked across the same ground and seen no trace of it.
        - id: ch03-b10
          speaker: dschemil
          text: How can I get inside? I can't knock, because the ogre might hear. I'd better climb the wall and wait to see what happens.
        - id: ch03-b11
          speaker: narrator
          text: Dschemil climbed to the top of the wall and sat there for about an hour. Then a window above him opened.
        - id: ch03-b12
          speaker: dschemila
          text: Dschemil!
          emotion: surprised
        - id: ch03-b13
          speaker: narrator
          text: He looked up. There was Dschemila, whom he had mourned for so long. The sight of her brought tears to his eyes.
        - id: ch03-b14
          speaker: dschemila
          text: Dear cousin, why have you come here?
        - id: ch03-b15
          speaker: dschemil
          text: Because I couldn't bear the grief of losing you.
          emotion: sad
        - id: ch03-b16
          speaker: dschemila
          text: Oh, leave at once! If the ogre returns, he'll kill you.
          emotion: fearful
        - id: ch03-b17
          speaker: dschemil
          text: I swear by your head, queen of my heart, I didn't find you only to lose you again. If I must die, then I must.
        - id: ch03-b18
          speaker: dschemila
          text: Then what can I do for you?
        - id: ch03-b19
          speaker: dschemil
          text: Anything you choose.
        - id: ch03-b20
          speaker: dschemila
          text: If I lower a cord, can you fasten it beneath your arms and climb to me?
        - id: ch03-b21
          speaker: dschemil
          text: Of course I can.
        - id: ch03-b22
          speaker: narrator
          text: Dschemila lowered the cord from the window. Dschemil fastened it securely beneath his arms and climbed all the way up to her. After believing each other lost for so long, the cousins held each other tenderly and burst into tears of joy.
        - id: ch03-b23
          speaker: dschemila
          text: But what will I do when the ogre comes back?
        - id: ch03-b24
          speaker: dschemil
          text: Trust me.
        - id: ch03-b25
          speaker: narrator
          text: A chest stood in the room, and Dschemila used it to store her clothes. She made Dschemil climb inside and lie flat at the bottom. He must not move or make the slightest sound. She had barely closed the lid when the ogre's heavy steps sounded on the stairs. He flung open the door and entered, carrying man's flesh for his own supper and lamb's flesh for the maiden.
        - id: ch03-b26
          speaker: ogre
          text: I smell a man! What is he doing here?
          emotion: angry
        - id: ch03-b27
          speaker: dschemila
          text: How could anyone possibly reach this lonely desert?
        - id: ch03-b28
          speaker: narrator
          text: Dschemila burst into tears.
        - id: ch03-b29
          speaker: ogre
          text: Don't cry. Perhaps a raven dropped scraps from its claws.
        - id: ch03-b30
          speaker: dschemila
          text: Oh, yes. I had forgotten. A raven did drop some bones here.
        - id: ch03-b31
          speaker: ogre
          text: Burn them into powder so I can swallow it.
        - id: ch03-b32
          speaker: narrator
          text: Dschemila burned some bones and carried the powder to him.
        - id: ch03-b33
          speaker: dschemila
          text: Here's the powder. Swallow it.
        - id: ch03-b34
          speaker: narrator
          text: After the ogre swallowed it, he stretched out and fell asleep. Before long, the man's flesh cooking for his supper called out.
        - id: ch03-b35
          speaker: mans_flesh
          text: Hush, hush! A man is hidden in the chest!
        - id: ch03-b36
          speaker: lambs_flesh
          text: He is your brother, and cousin to the other!
        - id: ch03-b37
          speaker: narrator
          text: The ogre stirred drowsily.
        - id: ch03-b38
          speaker: ogre
          text: What did the meat say, Dschemila?
        - id: ch03-b39
          speaker: dschemila
          text: It only said I must remember the salt.
        - id: ch03-b40
          speaker: ogre
          text: Then add salt.
        - id: ch03-b41
          speaker: dschemila
          text: I already have.
        - id: ch03-b42
          speaker: narrator
          text: The ogre sank back into sleep. A second time, the man's flesh cried out.
        - id: ch03-b43
          speaker: mans_flesh
          text: Hush, hush! A man is hidden in the chest!
        - id: ch03-b44
          speaker: lambs_flesh
          text: He is your brother, and cousin to the other!
        - id: ch03-b45
          speaker: ogre
          text: What did it say this time, Dschemila?
        - id: ch03-b46
          speaker: dschemila
          text: It only said I should add pepper.
        - id: ch03-b47
          speaker: ogre
          text: Then add pepper.
        - id: ch03-b48
          speaker: dschemila
          text: I've done that too.
        - id: ch03-b49
          speaker: narrator
          text: The ogre was worn out after a long day of hunting. His eyes closed again. For the third time, the man's flesh called.
        - id: ch03-b50
          speaker: mans_flesh
          text: Hush, hush! A man is hidden in the chest!
        - id: ch03-b51
          speaker: lambs_flesh
          text: He is your brother, and cousin to the other!
        - id: ch03-b52
          speaker: ogre
          text: Now what did it say, Dschemila?
        - id: ch03-b53
          speaker: dschemila
          text: Only that the meat is ready and should come off the fire.
        - id: ch03-b54
          speaker: ogre
          text: Then bring it here. I'll eat it now.
        - id: ch03-b55
          speaker: narrator
          text: Dschemila took the meat from the fire and carried it to the ogre. While he ate his supper, she ate some of the lamb's flesh. She also managed to put a portion aside for her cousin inside the chest. At last the ogre finished his meal and washed his hands. Then he spoke again.
        - id: ch03-b56
          speaker: ogre
          text: Make my bed. I'm tired.
        - id: ch03-b57
          speaker: narrator
          text: She made the bed, gave him a soft pillow, and tucked him in.
        - id: ch03-b58
          speaker: dschemila
          text: Father?
        - id: ch03-b59
          speaker: ogre
          text: What is it?
        - id: ch03-b60
          speaker: dschemila
          text: Dear father, when you're truly asleep, why do your eyes always stay open?
        - id: ch03-b61
          speaker: ogre
          text: Why are you asking me that? Are you planning some trick against me?
        - id: ch03-b62
          speaker: dschemila
          text: Of course not, father. How could I trick you? What good would that do?
        - id: ch03-b63
          speaker: ogre
          text: Then why do you want to know?
        - id: ch03-b64
          speaker: dschemila
          text: Last night I woke and saw the whole castle glowing red. It frightened me.
          emotion: fearful
        - id: ch03-b65
          speaker: ogre
          text: That red light appears when I'm fast asleep.
        - id: ch03-b66
          speaker: dschemila
          text: And why do you guard this pin so carefully?
        - id: ch03-b67
          speaker: ogre
          text: If I throw it ahead of me, it becomes an iron mountain.
        - id: ch03-b68
          speaker: dschemila
          text: What about this darning needle?
        - id: ch03-b69
          speaker: ogre
          text: That turns into a sea.
        - id: ch03-b70
          speaker: dschemila
          text: And the hatchet?
        - id: ch03-b71
          speaker: ogre
          text: It becomes a thorn hedge that no one can cross. But why all these questions? I'm sure you have a plan in your head.
        - id: ch03-b72
          speaker: dschemila
          text: I only wanted to know. Besides, how could anyone ever find me here?
        - id: ch03-b73
          speaker: narrator
          text: She began to cry again.
        - id: ch03-b74
          speaker: ogre
          text: Don't cry. I was only teasing you.
    - id: ch04
      title: The Flight Through the Desert
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: Soon the ogre slept again, and a yellow light shone through the castle.
        - id: ch04-b02
          speaker: dschemil
          text: Come quickly! We must escape while he's asleep.
        - id: ch04-b03
          speaker: dschemila
          text: Not yet. The light is yellow. I don't think he's truly asleep.
        - id: ch04-b04
          speaker: narrator
          text: They waited for an hour. Then Dschemil whispered from the chest once more.
        - id: ch04-b05
          speaker: dschemil
          text: Wake up! We have no time to lose.
        - id: ch04-b06
          speaker: dschemila
          text: Let me make sure he's asleep.
        - id: ch04-b07
          speaker: narrator
          text: She peeped into his room and saw the red light. Then she slipped back to her cousin.
        - id: ch04-b08
          speaker: dschemila
          text: But how will we get out of the castle?
        - id: ch04-b09
          speaker: dschemil
          text: Bring the rope. I'll lower you from the wall.
        - id: ch04-b10
          speaker: narrator
          text: Dschemila fetched the rope, the hatchet, the pin, and the needles.
        - id: ch04-b11
          speaker: dschemila
          text: Put these in your cloak pocket, and take great care not to lose them.
        - id: ch04-b12
          speaker: narrator
          text: Dschemil secured them in his pocket. He tied the rope around Dschemila and lowered her over the wall.
        - id: ch04-b13
          speaker: dschemil
          text: Are you safely down?
        - id: ch04-b14
          speaker: dschemila
          text: Yes, I'm safe.
        - id: ch04-b15
          speaker: dschemil
          text: Untie the rope so I can pull it back up.
        - id: ch04-b16
          speaker: narrator
          text: She untied it, and within a few minutes Dschemil stood beside her. The ogre had heard nothing. But his dog went to his bed and spoke.
        - id: ch04-b17
          speaker: ogres_dog
          text: Sleep on and enjoy your dreams! Dschemila has abandoned you and run away.
        - id: ch04-b18
          speaker: narrator
          text: The ogre climbed out of bed, but instead of looking for Dschemila, he gave the dog a kick. Then he went back to bed and slept until morning. When daylight came, he finally rose and called Dschemila's name through the castle.
        - id: ch04-b19
          speaker: ogre
          text: Dschemila! Dschemila!
        - id: ch04-b20
          speaker: narrator
          text: Only the echo of his own voice answered. He dressed as quickly as he could, buckled on his sword, and whistled for his dog. He knew which road the fugitives must have taken, and the two of them set off in pursuit. Far ahead on that same road, Dschemila suddenly turned and looked back.
        - id: ch04-b21
          speaker: dschemila
          text: Cousin!
        - id: ch04-b22
          speaker: dschemil
          text: What is it?
        - id: ch04-b23
          speaker: dschemila
          text: The ogre is following us. I saw him.
          emotion: fearful
        - id: ch04-b24
          speaker: dschemil
          text: Where? I can't see him.
        - id: ch04-b25
          speaker: dschemila
          text: Over there. From here, he looks no taller than a needle.
        - id: ch04-b26
          speaker: narrator
          text: Dschemil and Dschemila ran as fast as they could. Behind them, the ogre and his dog kept drawing nearer. Soon the distance between them was almost gone. In another few steps, the pursuers would have been at their side. Dschemila threw the darning needle behind her, and in a moment an iron mountain rose between the cousins and their enemy.
        - id: ch04-b27
          speaker: ogre
          text: My dog and I will smash it down!
          emotion: angry
        - id: ch04-b28
          speaker: narrator
          text: The ogre and the dog hurled themselves against the mountain until they forced a path through. Again, they drew closer and closer.
        - id: ch04-b29
          speaker: dschemila
          text: Cousin, the ogre and his dog are coming again!
          emotion: fearful
        - id: ch04-b30
          speaker: dschemil
          text: Run ahead of me.
        - id: ch04-b31
          speaker: narrator
          text: They raced on, but the ogre and his dog kept gaining.
        - id: ch04-b32
          speaker: dschemila
          text: They're almost upon us! You must throw the pin!
          emotion: fearful
        - id: ch04-b33
          speaker: narrator
          text: Dschemil pulled the pin from his cloak and threw it behind him. A thick wall of thorns sprang up around their pursuers, and neither the ogre nor the dog could pass.
        - id: ch04-b34
          speaker: ogre
          text: I'll get through somehow, even if I have to burrow under it!
          emotion: angry
        - id: ch04-b35
          speaker: narrator
          text: Before long, the ogre and his dog emerged on the other side.
        - id: ch04-b36
          speaker: dschemila
          text: Cousin, they're close again.
          emotion: fearful
        - id: ch04-b37
          speaker: dschemil
          text: Keep ahead of me. Don't be afraid.
        - id: ch04-b38
          speaker: narrator
          text: Dschemila ran a little farther, then stopped and looked back.
        - id: ch04-b39
          speaker: dschemila
          text: He's only a few yards behind us now!
          emotion: fearful
        - id: ch04-b40
          speaker: narrator
          text: Dschemil flung the hatchet to the ground. It became a lake.
        - id: ch04-b41
          speaker: ogre
          text: I'll drink it dry, and my dog will drink with me!
          emotion: angry
        - id: ch04-b42
          speaker: narrator
          text: The ogre and his dog began drinking the lake. The dog swallowed so much water that it burst and died. The ogre did not even stop when he saw what had happened. He drank on and on until almost the whole lake was dry. Then he lifted his head and shouted a curse after Dschemila.
        - id: ch04-b43
          speaker: ogre
          text: Dschemila, let your head become a donkey's head, and let fur cover your hair!
          emotion: angry
        - id: ch04-b44
          speaker: narrator
          text: The curse took hold. Dschemil stared at his cousin in horror.
        - id: ch04-b45
          speaker: dschemil
          text: She truly is a donkey, not a woman at all!
          emotion: fearful
        - id: ch04-b46
          speaker: narrator
          text: He abandoned her and went home.
    - id: ch05
      title: Dschemila Comes Home
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: For two days, poor Dschemila wandered alone and wept bitterly. Meanwhile, Dschemil continued toward his hometown. As he drew near it, he began to think carefully about his conduct. He remembered how he had left his cousin helpless in the desert, and he felt ashamed of himself.
        - id: ch05-b02
          speaker: dschemil
          text: Perhaps she has her own shape again by now. I'll go back and see.
        - id: ch05-b03
          speaker: narrator
          text: He turned around and made all the haste he could. At last he saw Dschemila seated on a rock. A pack of wolves surrounded her, eager to make a meal of her, and she was struggling to hold them back. Dschemil rushed at the wolves and drove them away.
        - id: ch05-b04
          speaker: dschemil
          text: Get up, dear cousin. You barely escaped with your life.
        - id: ch05-b05
          speaker: dschemila
          text: Well done, my friend. You persuaded me to run away with you, and then you left me helpless.
          emotion: angry
        - id: ch05-b06
          speaker: dschemil
          text: Shall I tell you the truth?
        - id: ch05-b07
          speaker: dschemila
          text: Tell me.
        - id: ch05-b08
          speaker: dschemil
          text: I thought you were a witch, and I was frightened of you.
        - id: ch05-b09
          speaker: dschemila
          text: But you saw me before I changed. You watched the ogre cast the spell with your own eyes.
        - id: ch05-b10
          speaker: dschemil
          text: What can I do now? If I bring you into town, everyone will laugh. They'll ask what strange toy I found, with a woman's hands, feet, and body, but a donkey's head and fur for hair.
        - id: ch05-b11
          speaker: dschemila
          text: Then what do you mean to do with me? Take me to my mother after dark, and tell no one.
        - id: ch05-b12
          speaker: dschemil
          text: That's what I'll do.
        - id: ch05-b13
          speaker: narrator
          text: They remained there until night was close, and then Dschemil led his cousin home. He knocked softly at her mother's door.
        - id: ch05-b14
          speaker: dschemila_mother
          text: Is that you, Dschemil?
        - id: ch05-b15
          speaker: dschemil
          text: Yes, it's me.
        - id: ch05-b16
          speaker: dschemila_mother
          text: Did you find her?
        - id: ch05-b17
          speaker: dschemil
          text: Yes. I've brought her home to you.
        - id: ch05-b18
          speaker: dschemila_mother
          text: Where is she? Oh, let me see her!
        - id: ch05-b19
          speaker: dschemil
          text: She's here, behind me.
        - id: ch05-b20
          speaker: narrator
          text: The mother saw Dschemila and shrieked.
        - id: ch05-b21
          speaker: dschemila_mother
          text: Are you mocking me? When did I ever give birth to a donkey?
          emotion: angry
        - id: ch05-b22
          speaker: dschemil
          text: Hush! The whole world doesn't need to know. Look at her body. You'll find two scars.
        - id: ch05-b23
          speaker: dschemila
          text: Mother, don't you know your own daughter?
          emotion: sad
        - id: ch05-b24
          speaker: dschemila_mother
          text: Of course I know my daughter.
        - id: ch05-b25
          speaker: dschemila
          text: Then tell me where her two scars are.
        - id: ch05-b26
          speaker: dschemila_mother
          text: A dog bit her thigh and left one scar. The other is a burn on her breast from when she pulled a lamp onto herself as a little child.
        - id: ch05-b27
          speaker: dschemila
          text: Look at me, then, and see whether I'm your daughter.
        - id: ch05-b28
          speaker: narrator
          text: Dschemila showed her the two scars. Her mother recognized them and embraced her, weeping.
        - id: ch05-b29
          speaker: dschemila_mother
          text: My dear daughter, what terrible fate has done this to you?
          emotion: sad
        - id: ch05-b30
          speaker: dschemila
          text: The ogre carried me away, and later he put this spell on me.
        - id: ch05-b31
          speaker: dschemila_mother
          text: But what can we do with you now?
        - id: ch05-b32
          speaker: dschemila
          text: Hide me and tell no one I'm here. Dear cousin, if the neighbors question you, say you still haven't found me.
        - id: ch05-b33
          speaker: dschemil
          text: I promise I will.
        - id: ch05-b34
          speaker: narrator
          text: Dschemil and her mother led her upstairs and hid her inside a cupboard. She had to remain hidden there for an entire month. Only after night had fallen, when the whole town was asleep, could she slip outside for a walk.
        - id: ch05-b35
          speaker: narrator
          text: Dschemil returned to his own house. His parents, brothers, and neighbors greeted him with joy.
        - id: ch05-b36
          speaker: neighbor_1
          text: When did you return? Did you find Dschemila?
        - id: ch05-b37
          speaker: dschemil
          text: No. I searched the whole world and heard nothing about her.
        - id: ch05-b38
          speaker: brother_1
          text: Did you stay with the traveler who left with you?
        - id: ch05-b39
          speaker: dschemil
          text: No. After three days, he became too weak to continue. He must have reached home a month ago. I went on alone. I searched every castle and every house, but found no sign of her. At last I gave up.
        - id: ch05-b40
          speaker: neighbor_2
          text: We warned you that it was hopeless. An ogre or an ogress must have eaten her. How could you ever expect to find her?
        - id: ch05-b41
          speaker: dschemil
          text: I loved her too much to sit still.
        - id: ch05-b42
          speaker: narrator
          text: His friends did not understand. Before long, they raised the matter again.
        - id: ch05-b43
          speaker: neighbor_1
          text: We'll find another wife for you. There are many girls prettier than Dschemila.
        - id: ch05-b44
          speaker: dschemil
          text: Perhaps there are, but I don't want any of them.
        - id: ch05-b45
          speaker: brother_2
          text: Then what will you do with those carpets, cushions, and all the beautiful things you bought?
        - id: ch05-b46
          speaker: dschemil
          text: They can remain in the chests.
        - id: ch05-b47
          speaker: brother_2
          text: The moths will eat them. A few weeks won't matter, but after a year or two they'll be ruined.
        - id: ch05-b48
          speaker: dschemil
          text: They can lie there for ten years. Dschemila is the only woman I'll marry. I'll rest here for a month or two, then go out and search for her again.
        - id: ch05-b49
          speaker: neighbor_2
          text: You must be mad! Is she the only maiden in the world? There are plenty who would make a better wife.
        - id: ch05-b50
          speaker: dschemil
          text: If there are, I've never seen them. Why are you all making such a fuss? Every man understands his own affairs best.
        - id: ch05-b51
          speaker: neighbor_1
          text: You're the one making all the fuss.
        - id: ch05-b52
          speaker: narrator
          text: Dschemil turned away and went inside because he did not want to quarrel.
    - id: ch06
      title: The Ogre's Gifts
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: Three months passed. Then a traveling merchant came across the desert and reached the ogre's castle. Tired from his journey, he stretched out beneath the castle wall to rest. He remained there until evening, when the ogre came upon him.
        - id: ch06-b02
          speaker: ogre
          text: What are you doing here, merchant? Have you brought anything to sell?
        - id: ch06-b03
          speaker: traveler
          text: I have only a few clothes.
        - id: ch06-b04
          speaker: narrator
          text: The merchant was terrified, but the ogre laughed.
        - id: ch06-b05
          speaker: ogre
          text: Don't be afraid. I won't eat you. In fact, I'll travel part of the way with you.
        - id: ch06-b06
          speaker: traveler
          text: I'm ready, gracious sir.
        - id: ch06-b07
          speaker: ogre
          text: Go straight ahead until you reach a town. There you'll find a maiden named Dschemila and a young man named Dschemil. Take this mirror and comb. Tell Dschemila, “Your father the ogre sends greetings. Look at your face in this mirror, and it will become what it was. Comb your hair with this comb, and your hair will be restored.” If you fail to obey me, I'll eat you the next time we meet.
        - id: ch06-b08
          speaker: traveler
          text: Oh, I will carry out every word exactly!
          emotion: fearful
        - id: ch06-b09
          speaker: narrator
          text: For thirty days, the merchant traveled with the mirror and comb. At last he passed through the gate of Dschemil's town. He went no farther than the first street. Hungry, thirsty, and worn out, he sank down in the full glare of the sun. By chance, Dschemil came along that street and stopped when he saw him.
        - id: ch06-b10
          speaker: dschemil
          text: Get up from there. If you stay in that sun, you'll make yourself ill.
        - id: ch06-b11
          speaker: traveler
          text: Good sir, I've traveled for a whole month. I'm too tired to move.
        - id: ch06-b12
          speaker: dschemil
          text: Which direction did you come from?
        - id: ch06-b13
          speaker: traveler
          text: From out there.
        - id: ch06-b14
          speaker: narrator
          text: He pointed behind him.
        - id: ch06-b15
          speaker: dschemil
          text: You say you've been traveling for a month. Did you see anything strange along the way?
        - id: ch06-b16
          speaker: traveler
          text: Yes, good sir. I found a castle and rested in its shade. An ogre woke me and ordered me to come to this town. He said I would find a young man named Dschemil and a maiden named Dschemila.
        - id: ch06-b17
          speaker: dschemil
          text: My name is Dschemil. What does the ogre want from me?
        - id: ch06-b18
          speaker: traveler
          text: He gave me presents for Dschemila. How can I find her?
        - id: ch06-b19
          speaker: dschemil
          text: Come with me. You can place them in her own hands.
        - id: ch06-b20
          speaker: narrator
          text: They went to the house of Dschemil's uncle. Dschemil led the merchant into his aunt's room.
        - id: ch06-b21
          speaker: dschemil
          text: Aunt, this merchant has come from the ogre. He brought a mirror and a comb as gifts for Dschemila.
        - id: ch06-b22
          speaker: dschemila_mother
          text: But this may be another wicked trick from the ogre.
        - id: ch06-b23
          speaker: dschemil
          text: I don't believe it is. Give her the gifts.
        - id: ch06-b24
          speaker: narrator
          text: They called Dschemila from her hiding place. She approached the merchant.
        - id: ch06-b25
          speaker: dschemila
          text: Where did you come from?
        - id: ch06-b26
          speaker: traveler
          text: From your father, the ogre.
        - id: ch06-b27
          speaker: dschemila
          text: What did he send you to do?
        - id: ch06-b28
          speaker: traveler
          text: He told me to give you this mirror and comb. His message was, “Look into the mirror, and comb your hair with the comb. Your face and hair will become what they were before.”
        - id: ch06-b29
          speaker: narrator
          text: Dschemila took the two gifts from the merchant. First she looked at her face in the mirror. Then she drew the comb through her strange covering of hair. At once, the donkey's head and fur vanished. Her own face and hair returned, and she stood before them as a beautiful maiden once more.
        - id: ch06-b30
          speaker: narrator
          text: At this wonderful sight, both her mother and Dschemil were filled with joy. Dschemila no longer needed to hide in the cupboard. The news that she had returned soon spread through the town, and neighbors came flocking into the house with questions and greetings.
        - id: ch06-b31
          speaker: neighbor_1
          text: When did you come home?
        - id: ch06-b32
          speaker: dschemila
          text: My cousin brought me back.
        - id: ch06-b33
          speaker: neighbor_2
          text: But he told us he couldn't find you!
        - id: ch06-b34
          speaker: dschemil
          text: I said that on purpose. I didn't want everyone to know she was here.
        - id: ch06-b35
          speaker: narrator
          text: Then he turned to his parents, brothers, and sisters-in-law.
        - id: ch06-b36
          speaker: dschemil
          text: We must begin the preparations at once. The wedding will be today.
        - id: ch06-b37
          speaker: narrator
          text: The family immediately prepared a beautiful litter to carry the bride from her father's house to her new home. Everything was ready for the procession, but Dschemila drew back and refused to enter it.
        - id: ch06-b38
          speaker: dschemila
          text: I'm afraid the ogre will carry me away again.
          emotion: fearful
        - id: ch06-b39
          speakers: [neighbor_1, neighbor_2, brother_1, brother_2]
          ensemble: chorus
          text: How could the ogre reach you with all of us here? We number two thousand, and every man carries a sword.
        - id: ch06-b40
          speaker: dschemila
          text: He'll find some way to do it. He's a powerful king.
          emotion: fearful
        - id: ch06-b41
          speaker: old_man
          text: She is right. Put the litter away. If she's afraid, let her walk.
        - id: ch06-b42
          speakers: [neighbor_1, neighbor_2, brother_1, brother_2]
          ensemble: chorus
          text: That's absurd! How could the ogre possibly take her from us?
        - id: ch06-b43
          speaker: dschemila
          text: I won't go. You don't know that monster the way I do.
        - id: ch06-b44
          speaker: narrator
          text: While everyone argued, the bridegroom arrived.
        - id: ch06-b45
          speaker: dschemil
          text: Leave her in peace. She can remain in her father's house. I can live here with her, and the wedding feast can be prepared here too.
        - id: ch06-b46
          speaker: narrator
          text: And so Dschemil and Dschemila were married at last.
        - id: ch06-b47
          speaker: narrator
          text: They lived all their days without a single quarrel.
