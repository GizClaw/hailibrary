audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 亲切从容，保留古老童话的神秘感
        timbre: 温暖清晰
        pace: 舒缓
        pitch: 中音
    moscione:
      display_name: 莫肖内
      tts:
        delivery: 坦率好奇，行事莽撞却充满自信
        timbre: 年轻清朗
        pace: 适中
        pitch: 中音
    quick_as_thought:
      display_name: 快念
      tts:
        delivery: 活泼爽快，对自己的速度胸有成竹
        timbre: 轻快明亮
        pace: 明快
        pitch: 中高音
    hares_ear:
      display_name: 兔耳
      tts:
        delivery: 专注敏锐，说话准确而不慌不忙
        timbre: 细致清晰
        pace: 稳健
        pitch: 中音
    hit_the_point:
      display_name: 神射
      tts:
        delivery: 沉稳精准，带着不动声色的自豪
        timbre: 集中有力
        pace: 稳健
        pitch: 中低音
    workman:
      display_name: 工人
      tts:
        delivery: 乐观爽朗，口气朴实
        timbre: 粗粝温厚
        pace: 适中
        pitch: 中低音
    blow_blast:
      display_name: 吹风
      tts:
        delivery: 豪爽顽皮，显露本领时气势十足
        timbre: 通透饱满
        pace: 适中
        pitch: 中音
    strong_back:
      display_name: 铁背
      tts:
        delivery: 踏实自信，性情随和
        timbre: 低沉宽厚
        pace: 从容
        pitch: 低音
    canetella:
      display_name: 卡内泰拉公主
      tts:
        delivery: 高傲端庄，争强好胜
        timbre: 明亮华贵
        pace: 适中
        pitch: 中高音
    crowd_voice_1:
      display_name: 看客甲
      tts:
        delivery: 兴奋热烈
        timbre: 清亮活泼
        pace: 明快
        pitch: 中音
    crowd_voice_2:
      display_name: 看客乙
      tts:
        delivery: 豪爽激动
        timbre: 温厚有力
        pace: 明快
        pitch: 中低音
    crowd_voice_3:
      display_name: 看客丙
      tts:
        delivery: 欢快高昂
        timbre: 清脆年轻
        pace: 明快
        pitch: 高音
    king:
      display_name: 国王
      tts:
        delivery: 威严多疑，算计落空时难掩恼怒
        timbre: 浑厚冷峻
        pace: 稳健
        pitch: 低音
    counsellor:
      display_name: 王家谋士
      tts:
        delivery: 圆滑精明，言语里带着轻蔑
        timbre: 干涩文雅
        pace: 稳健
        pitch: 中低音
  chapters:
    - id: ch01
      title: 傻小子出门
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            从前有个财主，钱多得花不完，可他的福气偏偏缺了一角。他只有一个儿子，名叫莫肖内。这孩子实在太傻，连二加二都算不利落。父亲终于忍无可忍，塞给他一袋金币，叫他到外国去闯荡。他相信，出门见世面的傻瓜，总比守在家里的傻瓜强一点。
        - id: ch01-b02
          speaker: narrator
          text: >-
            莫肖内骑上马，直奔威尼斯。他打算在那里搭船去开罗。走了一程，他看到白杨树下站着一个人，便停马问话。
        - id: ch01-b03
          speaker: moscione
          text: >-
            朋友，你叫什么？打哪儿来？又有什么本事？
        - id: ch01-b04
          speaker: quick_as_thought
          text: >-
            大家叫我快念。我从疾行镇来，跑起来就跟闪电一样快。
        - id: ch01-b05
          speaker: moscione
          text: >-
            光说可不算，让我亲眼瞧瞧。
        - id: ch01-b06
          speaker: quick_as_thought
          text: >-
            那就等一小会儿，我马上证明给你看。
        - id: ch01-b07
          speaker: narrator
          text: >-
            他才说完，一只小母鹿便穿过田野。快念故意让它先跑一段，接着轻轻追了上去。他的脚步快得出奇，就算地上撒着面粉，也留不下一点踪迹。没跃几步，他已经赶上母鹿。莫肖内看得心服口服，当场请他同行，还答应日后一定重重酬谢。快念痛快地答应了，两人便离开田野，一同上路。
    - id: ch02
      title: 五位奇人
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            他们还没走出一英里，又碰见一个年轻人。莫肖内照旧问起姓名、来处和本领。
        - id: ch02-b02
          speaker: hares_ear
          text: >-
            我叫兔耳，来自好奇谷。只要趴下听听大地，我一步不用走，就能知道天下的动静。宫里和茅屋里的密谋，老鼠和人心里的盘算，我都听得见。
        - id: ch02-b03
          speaker: moscione
          text: >-
            那你听一听，我家现在出了什么事？
        - id: ch02-b04
          speaker: narrator
          text: >-
            兔耳伏下身，耳朵刚贴到地面，马上便听清了远方的话。
        - id: ch02-b05
          speaker: hares_ear
          text: >-
            有个老头儿正跟妻子说，总算把莫肖内送走了。等他在外面待上一阵，也许能懂点常理，回来时就没出门时那么傻了。
        - id: ch02-b06
          speaker: moscione
          text: >-
            行了，你听得一点不错！跟我们来吧，好日子正等着你呢。
        - id: ch02-b07
          speaker: narrator
          text: >-
            兔耳相信跟着莫肖内真能交好运，便加入了队伍。又走了大约十英里，他们遇见第三个人。莫肖内还是那三个问题，这回得到的回答也很不寻常。
        - id: ch02-b08
          speaker: hit_the_point
          text: >-
            我叫神射，生在百发百中城。只要我拉开弓，石头上的一颗豌豆也逃不过我的箭。
        - id: ch02-b09
          speaker: moscione
          text: >-
            你若愿意，就露一手给我看看。
        - id: ch02-b10
          speaker: narrator
          text: >-
            神射把一颗豌豆放上石头，搭箭开弓，轻轻松松射中了正中心。莫肖内亲眼见识到他没有夸口，立刻请他同行。于是队伍里又多了一个伙伴。
        - id: ch02-b11
          speaker: narrator
          text: >-
            几天以后，他们看见一群人顶着毒日头挖沟。热气烫得仿佛真能把鸡蛋烤熟，莫肖内忍不住替他们叫苦。
        - id: ch02-b12
          speaker: moscione
          text: >-
            朋友们，这么热还要拼命干活，你们怎么熬得住？
        - id: ch02-b13
          speaker: workman
          text: >-
            我们舒服着呢，个个都精神十足。这里有个年轻人，一直朝我们背上吹着西风。
        - id: ch02-b14
          speaker: moscione
          text: >-
            快请他过来，我要见见。
        - id: ch02-b15
          speaker: narrator
          text: >-
            年轻人来了。莫肖内问完那三个熟悉的问题，他张口便报出了自己的本领。
        - id: ch02-b16
          speaker: blow_blast
          text: >-
            我是风城来的吹风。你要哪一种风，我用嘴就能吹出来。西风转眼就到，北风则能把眼前的房子全掀倒。
        - id: ch02-b17
          speaker: moscione
          text: >-
            我得看过才信。
        - id: ch02-b18
          speaker: narrator
          text: >-
            吹风先吐出一口柔气，四周顿时像有晚风轻轻拂过，挖沟的人也享受到一片凉爽。他再转过身猛吹，风暴骤然卷起，一整排橡树轰然倒下。莫肖内喜出望外，马上请他跟着队伍一起走。
        - id: ch02-b19
          speaker: narrator
          text: >-
            再往前走，他们又遇到一个人。莫肖内问过姓名、故乡和本领，那人答得十分干脆。
        - id: ch02-b20
          speaker: strong_back
          text: >-
            我是大力城的铁背。哪怕把一座山放到我背上，我也只当驮了一根羽毛。
        - id: ch02-b21
          speaker: moscione
          text: >-
            这本事可了不得。不过，你总得拿出证据来。
        - id: ch02-b22
          speaker: narrator
          text: >-
            铁背往身上堆满巨石和一根根树干。一百辆大车也运不完的重量，他一个人便稳稳背了起来。莫肖内又一次见识到真本领，当然也请他加入。从此，六个人一同向前赶路。
    - id: ch03
      title: 与公主赛跑
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            六个人又结伴走了好些日子，终于来到一个名叫花谷的国度。这里的国王有个独生女儿，名叫卡内泰拉。她跑得跟风一样快，脚下也轻得惊人，穿过青青的燕麦田，连一根麦秆都不会踩弯。国王已经向全国宣布，谁能跑赢公主，便能娶她。输的人却要把脑袋留下。
        - id: ch03-b02
          speaker: narrator
          text: >-
            莫肖内听说后，立刻进宫挑战。到了比赛那天，他又托人告诉国王，自己身体不适，要派别人替跑。
        - id: ch03-b03
          speaker: canetella
          text: >-
            换谁都一样。尽管叫他来，我会在赛场上等着。
        - id: ch03-b04
          speaker: narrator
          text: >-
            到了约定的时刻，赛场周围挤满了想看比试的人。快念准时站上起点，公主穿着短裙和轻便的鞋，也准备妥当。银号一响，两人同时冲了出去，就像猎犬紧追着野兔。快念果然没有辜负自己的名字，一路超过公主，先到了终点。
        - id: ch03-b05
          speakers: [crowd_voice_1, crowd_voice_2, crowd_voice_3]
          ensemble: chorus
          text: >-
            外乡人赢了，外乡人万岁！
        - id: ch03-b06
          speaker: narrator
          text: >-
            众人一边拍手，一边为外乡人欢呼。卡内泰拉输得十分难受。好在还要再赛一次，她暗暗发誓绝不会重蹈覆辙。回去以后，她送给快念一枚有魔力的戒指，请他为了她把戒指戴上。可这件礼物暗藏恶意，戴戒指的人连走路都办不到，更别说赛跑了。
        - id: ch03-b07
          speaker: narrator
          text: >-
            第二天一早，观众又围满了赛场，卡内泰拉和快念重新开始较量。公主依然跑得飞快，可怜的快念却像一头被重物压垮的驴，站在原地一步也动不了。幸好兔耳早已听见公主暗中使诈，又把真相告诉了神射。
        - id: ch03-b08
          speaker: narrator
          text: >-
            神射见朋友陷入危险，立刻弯弓放箭。箭头从远处准确击落了戒指上的宝石。快念的双腿一下恢复自由，他只用五个大步就追过卡内泰拉，再次拿下胜利。
    - id: ch04
      title: 搬空国库
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            国王眼看自己必须把莫肖内认作未来的女婿，心里别提多厌恶了。他急忙召来宫廷智者，问他们怎样才能摆脱这桩难题。谋士们觉得，那样娇贵的公主若嫁给一个四处漂泊的补锅匠，简直像把美味送进了不配的嘴里。
        - id: ch04-b02
          speaker: counsellor
          text: >-
            陛下，不如拿黄金打发他。那种穷汉见了钱，肯定觉得比得到世上任何妻子都好。
        - id: ch04-b03
          speaker: narrator
          text: >-
            国王听了十分高兴，觉得这办法妙极了。他把莫肖内叫到面前，问对方肯收下多少钱，才愿意放弃早已许给他的公主。莫肖内没有独自决定，先同伙伴们商量了一番，然后才提出条件。
        - id: ch04-b04
          speaker: moscione
          text: >-
            我的伙伴能够背走多少金银珠宝，我就收多少。
        - id: ch04-b05
          speaker: narrator
          text: >-
            国王以为只付一点财宝就能保住女儿，自己实在太走运了，立即命人抬出成箱的黄金、成袋的白银和满柜的宝石。谁知压在铁背身上的财宝越多，他的腰杆反而挺得越直。国库很快被搬得一干二净，国王只得派廷臣到臣民家里，把大家所有的金银也搜集起来。
        - id: ch04-b06
          speaker: narrator
          text: >-
            可铁背还是嫌少，伸手继续要。谋士们眼看自己的计策闯出大祸，马上换了说法。他们声称，让一伙游荡的强盗带走全国的财富才是真正的愚蠢，又催国王派兵追回所有金银珠宝。
        - id: ch04-b07
          speaker: narrator
          text: >-
            国王照办了。他派出一支全副武装的队伍，步兵和骑兵一起追赶莫肖内一行，非要夺回铁背背走的财宝不可。
    - id: ch05
      title: 带着财富回家
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: >-
            可国王和谋士的盘算全被兔耳听见了。天边刚刚扬起追兵的尘土，他便把危险告诉了同伴。吹风一听，立刻转身鼓起一阵可怕的狂风。国王的整支军队像一排木柱一样倒在地上，无论怎样挣扎都爬不起来，只能眼看着莫肖内他们继续赶路。
        - id: ch05-b02
          speaker: narrator
          text: >-
            追兵倒下以后，再没有任何人能拦住他们，也没有别的麻烦找上门来。莫肖内和五位伙伴带着全部财宝，平安走回了家。他按照最初的承诺，把带来的财宝分给众人，伙伴们人人都欢喜，也都得到了丰厚的回报。莫肖内自己则留在父亲身边。从前把他当作十足傻瓜的父亲，到这时也不得不承认，自己的儿子看着虽傻，其实还真没有那么傻。
