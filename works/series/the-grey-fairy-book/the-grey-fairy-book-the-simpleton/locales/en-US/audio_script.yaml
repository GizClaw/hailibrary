  chapters:
    - id: ch01
      title: Moscione Sets Out
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Once upon a time, there lived a man who was as rich as anyone could be. Still, no happiness in this world is ever quite complete. His only son, Moscione, was such a simpleton that he could scarcely add two and two.
        - id: ch01-b02
          speaker: narrator
          text: At last, his father would bear his foolishness no longer. He gave the young man a purse full of gold and sent him away to seek his fortune in foreign lands. Perhaps a fool who roamed the world would learn more than one who stayed at home.
        - id: ch01-b03
          speaker: narrator
          text: Moscione mounted a horse and set out for Venice. From there, he hoped to find a ship bound for Cairo. After riding for some time, he came upon a man standing beneath a poplar tree.
        - id: ch01-b04
          speaker: moscione
          text: Tell me, friend. What's your name, where do you come from, and what can you do?
        - id: ch01-b05
          speaker: quick_as_thought
          text: They call me Quick-as-Thought. I come from Fleet-town, and I can run as fast as lightning.
        - id: ch01-b06
          speaker: moscione
          text: I'd like to see that for myself.
        - id: ch01-b07
          speaker: quick_as_thought
          text: Then wait just a moment. I'll show you I spoke the truth.
        - id: ch01-b08
          speaker: narrator
          text: The words had hardly left his mouth when a young doe raced across the field. Quick-as-Thought let her get a little ahead. Then he flew after her so lightly that even flour scattered over the ground would not have shown his footprints. A few bounds were enough for him to overtake her.
        - id: ch01-b09
          speaker: narrator
          text: Moscione was amazed by the man's speed. He asked Quick-as-Thought to travel with him and promised him a handsome reward. Quick-as-Thought agreed, and the two continued on together.
    - id: ch02
      title: Companions with Remarkable Gifts
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: They had gone barely a mile when they met another young man. Moscione stopped to question him.
        - id: ch02-b02
          speaker: moscione
          text: What's your name, friend? Where are you from, and what can you do?
        - id: ch02-b03
          speaker: hares_ear
          text: I am Hare's-ear, from Curiosity Valley. If I put my ear to the ground, I can stay right here and hear everything happening across the world. I hear plots in palaces and cottages, and every plan made by mice or men.
        - id: ch02-b04
          speaker: moscione
          text: Then tell me what's happening at my home right now.
        - id: ch02-b05
          speaker: narrator
          text: Hare's-ear bent down and pressed one ear against the earth. At once, he told Moscione what he heard.
        - id: ch02-b06
          speaker: hares_ear
          text: An old man is speaking to his wife. He says, “Thank heaven Moscione is gone. Perhaps the world will teach him some common sense, and he'll come home less foolish than when he left.”
        - id: ch02-b07
          speaker: moscione
          text: That's enough! You've told the truth, so I believe you. Come with us, and you'll make your fortune.
        - id: ch02-b08
          speaker: narrator
          text: Hare's-ear joined them. About ten miles farther on, the travelers met a third man, and Moscione asked him the same questions.
        - id: ch02-b09
          speaker: hit_the_point
          text: My name is Hit-the-Point, and I come from Perfect-aim. My bow is so exact that I can shoot a pea from the top of a stone.
        - id: ch02-b10
          speaker: moscione
          text: If you don't mind, let me see you do it.
        - id: ch02-b11
          speaker: narrator
          text: Hit-the-Point placed a pea on a stone and drew his bow. With perfect ease, he sent the arrow straight through the middle of the pea. Moscione had all the proof he needed, and he immediately invited the archer to join the company.
        - id: ch02-b12
          speaker: narrator
          text: After several days of travel, they found a group of people digging a trench beneath a blazing sun. Moscione pitied them and called out.
        - id: ch02-b13
          speaker: moscione
          text: Friends, how can you work so hard in heat fierce enough to cook an egg in a minute?
        - id: ch02-b14
          speaker: workman
          text: We're as fresh as daisies. A young man here blows across our backs like the west wind.
        - id: ch02-b15
          speaker: moscione
          text: Let me meet him.
        - id: ch02-b16
          speaker: narrator
          text: The workers called the young man over, and Moscione asked about his name, his home, and his talent.
        - id: ch02-b17
          speaker: blow_blast
          text: I'm Blow-Blast, from Wind-town. I can make any wind you ask for. I can bring you a west wind in a second, or send a north wind strong enough to flatten these houses.
        - id: ch02-b18
          speaker: moscione
          text: I'll believe it when I see it.
        - id: ch02-b19
          speaker: narrator
          text: Blow-Blast began with a breath as soft as the gentle breeze at evening. Then he turned around and blew from the other direction. This time, he raised such a mighty storm that a whole row of oak trees crashed to the ground. Moscione was delighted by the display and asked him to come along.
        - id: ch02-b20
          speaker: narrator
          text: Farther down the road, they met one more man. Once again, Moscione asked what he was called, where he came from, and what he could do.
        - id: ch02-b21
          speaker: strong_back
          text: I am Strong-Back, from Power-borough. I am so strong that I can carry a mountain as though it were a feather.
        - id: ch02-b22
          speaker: moscione
          text: That would make you a remarkable fellow. But first, I need proof.
        - id: ch02-b23
          speaker: narrator
          text: Strong-Back piled great boulders and tree trunks onto his shoulders. He carried more than a hundred wagons could have hauled away. Moscione persuaded him to join the troop, and together they continued their journey.
    - id: ch03
      title: The First Race
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: At last, the company entered a country called Flower Vale. Its king had one daughter, Princess Canetella, who ran as swiftly as the wind. Her feet were so light that she could cross a field of young oats without bending a single blade.
        - id: ch03-b02
          speaker: narrator
          text: The king had proclaimed that whoever beat Canetella in a race would marry her. Anyone who tried and lost would have his head cut off. As soon as Moscione heard the proclamation, he hurried to the king and challenged the princess.
        - id: ch03-b03
          speaker: narrator
          text: On the morning of the trial, however, Moscione sent word that he was unwell. Since he could not run, someone else would take his place.
        - id: ch03-b04
          speaker: canetella
          text: It makes no difference to me. Send anyone you please. I am ready to race him.
        - id: ch03-b05
          speaker: narrator
          text: When the hour came, the racecourse was packed with people eager to watch. Quick-as-Thought stood at the starting point. Beside him was Canetella, lightly shod and dressed in a short skirt for running.
        - id: ch03-b06
          speaker: narrator
          text: A silver trumpet rang out, and the two racers sprang forward. As they flew over the course, they looked for all the world like a greyhound chasing a hare. But Quick-as-Thought lived up to his name. He passed the princess, reached the goal ahead of her, and won the first race.
        - id: ch03-b07
          speakers: [crowd_voice_1, crowd_voice_2, crowd_voice_3]
          ensemble: chorus
          text: Long live the stranger!
          emotion: happy
        - id: ch03-b08
          speaker: narrator
          text: Canetella was deeply unhappy about losing. The contest had to be run a second time, though, and she was determined not to lose again. She went home and sent Quick-as-Thought a magic ring. Anyone who wore it could neither run nor even walk. Her message begged him to wear it for her sake.
    - id: ch04
      title: The Magic Ring
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: Early the next morning, the crowd returned to the racecourse. Canetella and Quick-as-Thought began their second trial. The princess raced away as swiftly as before, but poor Quick-as-Thought was as slow as an overloaded donkey. He could not take a single step.
        - id: ch04-b02
          speaker: narrator
          text: Hare's-ear had heard all about the princess's trick and told Hit-the-Point. When the archer saw his friend in danger, he seized his bow and shot the stone straight out of the magic ring.
        - id: ch04-b03
          speaker: narrator
          text: At once, Quick-as-Thought's legs were free. In five great bounds, he caught Canetella and won the race again.
        - id: ch04-b04
          speaker: narrator
          text: The king was disgusted. He would have to accept Moscione as his future son-in-law. Hoping to escape that promise, he summoned the wise men of his court and asked them to find another way.
        - id: ch04-b05
          speaker: counsellor
          text: Canetella is much too fine a prize for a wandering tinker. Offer him gold instead. A beggar like that will surely choose money over any bride in the world.
        - id: ch04-b06
          speaker: narrator
          text: The king was delighted by this advice. He called Moscione before him and put the bargain to him.
        - id: ch04-b07
          speaker: king
          text: What sum of money will you take instead of the bride I promised you?
        - id: ch04-b08
          speaker: narrator
          text: Moscione first spoke with his friends. Then he gave the king his answer.
        - id: ch04-b09
          speaker: moscione
          text: Give me as much gold and as many precious stones as my followers can carry away.
    - id: ch05
      title: Strong-Back Empties the Treasury
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: The king thought he had escaped his promise very cheaply. He ordered his servants to bring out coffers of gold, sacks of silver, and chests filled with precious stones. They heaped every load onto Strong-Back. Yet the more treasure they placed on his shoulders, the straighter the mighty man stood.
        - id: ch05-b02
          speaker: narrator
          text: Before long, the royal treasury was empty. The king even sent courtiers through the country to collect all the gold and silver his subjects possessed. It made no difference. Strong-Back simply asked for more.
        - id: ch05-b03
          speaker: narrator
          text: When the counsellors saw the unexpected result of their advice, they changed their minds. It would be worse than foolish, they said, to let a band of wandering thieves carry such a fortune out of the country. They urged the king to send soldiers after them, recover the gold and jewels, and bring the treasure home.
        - id: ch05-b04
          speaker: narrator
          text: So the king dispatched armed men on horseback and on foot. Their orders were to recover every piece of treasure Strong-Back was carrying away.
    - id: ch06
      title: The Companions Return Home
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: Hare's-ear had listened from afar while the counsellors gave the king their new advice. He told his companions exactly what had been planned. At that very moment, they looked back and saw the dust raised by their pursuers spreading across the horizon.
        - id: ch06-b02
          speaker: narrator
          text: The moment Blow-Blast understood their danger, he filled his lungs and sent out a tremendous wind. It struck the king's army with such force that the soldiers all toppled like a row of ninepins. Men on foot and men on horseback went down together. None of them could get back up, so Moscione and his companions continued without any further hindrance.
        - id: ch06-b03
          speaker: narrator
          text: When they finally reached Moscione's home, all the companions gathered around the treasure they had carried from Flower Vale. Moscione divided the riches among them, and each man was delighted with his share. The journey was over, and Moscione himself remained at home with his father.
        - id: ch06-b04
          speaker: narrator
          text: And at last, his father had to admit that his son was not quite as foolish as he looked.
