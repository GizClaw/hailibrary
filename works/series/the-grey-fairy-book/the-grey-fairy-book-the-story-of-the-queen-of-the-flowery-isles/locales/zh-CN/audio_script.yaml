audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 亲切从容，保留古老童话的神秘感
        timbre: 温暖清晰
        pace: 舒缓
        pitch: 中音
    flowery_queen:
      display_name: 花岛女王
      tts:
        delivery: 温柔端庄，忧虑时仍不失威严
        timbre: 柔和沉稳
        pace: 适中
        pitch: 中音
    elder_princess:
      display_name: 大公主
      tts:
        delivery: 真挚坚定，语气高贵而不傲慢
        timbre: 清澈柔润
        pace: 适中
        pitch: 中高音
    younger_princess:
      display_name: 小公主
      tts:
        delivery: 聪慧果断，对姐姐满怀关切
        timbre: 明亮清脆
        pace: 适中
        pitch: 中高音
    queen_of_all_isles:
      display_name: 万岛女王
      tts:
        delivery: 骄矜冷淡，话里透着强烈的自负
        timbre: 华丽冷冽
        pace: 稍慢
        pitch: 中音
    court_lady:
      display_name: 宫廷夫人
      tts:
        delivery: 谨慎急切，低声直言
        timbre: 成熟柔和
        pace: 适中
        pitch: 中音
    ugly_man:
      display_name: 丑陋的男人
      tts:
        delivery: 生硬执拗，不肯让步
        timbre: 粗哑低沉
        pace: 稍慢
        pitch: 低音
    chamberlain:
      display_name: 宫廷侍从
      tts:
        delivery: 恭敬利落，禀报清楚
        timbre: 清晰沉稳
        pace: 适中
        pitch: 中低音
    emerald_prince:
      display_name: 翡翠岛王子
      tts:
        delivery: 谦恭诚挚，讲述往事时沉静坦率
        timbre: 温厚清朗
        pace: 舒缓
        pitch: 中低音
  chapters:
    - id: ch01
      title: 美貌招来的灾祸
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            从前，花岛由一位女王统治。她成婚才几年便失去了丈夫，心里悲痛万分。从此，她几乎把全部心思都用来教养两个可爱的女儿。她只有这两个孩子。大公主越长越美，母亲却越看越担忧。因为万岛女王自认是天下第一美人，容不得任何人胜过自己，还非要所有可能与她争艳的人都拜服在她面前。
        - id: ch01-b02
          speaker: narrator
          text: >-
            为满足这份虚荣，万岛女王怂恿丈夫征服周围所有岛屿。国王一心只想讨她欢喜，所以每征服一个国家，只提出一项条件。当地王室的每一位公主年满十五岁，都得来到他的宫廷，向王后的绝世美貌致敬。花岛女王清楚这条法令，大公主十五岁一过，便只好带她前去。
        - id: ch01-b03
          speaker: narrator
          text: >-
            万岛女王早听过公主的美名，等待她来访时便有些不安。真正见面以后，不安很快变成了嫉妒。公主实在太光彩照人，谁见了都不免目眩神迷。就连万岛女王也不得不承认，自己从没见过这样美的人。
        - id: ch01-b04
          speaker: queen_of_all_isles
          text: >-
            当然，除了我自己。
        - id: ch01-b05
          speaker: narrator
          text: >-
            可满朝上下毫不掩饰的赞叹骗不了人。万岛女王这才明白，公主真的胜过了自己。她妒火中烧，假装生病躲回寝宫，免得亲眼看着公主大出风头。接着，她又叫人传话，说自己身体不适，不能再见客，请花岛女王带女儿回国。负责传话的宫廷夫人，恰好是花岛女王的老朋友。
        - id: ch01-b06
          speaker: court_lady
          text: >-
            别再等着正式辞行了。请您马上带公主回去，越快越好。
        - id: ch01-b07
          speaker: narrator
          text: >-
            花岛女王一点就明白，立刻带女儿离开，一刻也没有耽搁。她知道那位恼羞成怒的女王法力高强，回国后便警告女儿，六个月内无论有什么缘故，都绝不能离开王宫，否则会有大祸。公主答应一定服从。为了让她过得愉快，宫中上下也想尽了办法。
        - id: ch01-b08
          speaker: narrator
          text: >-
            到了最后一天，宫外草地正要举行盛大庆典。公主从窗前看遍了筹备过程，忍不住央求母亲带她去。女王以为危险已经过去，终于答应了。
        - id: ch01-b09
          speaker: narrator
          text: >-
            人人都为心爱的公主重获自由而高兴，兴高采烈地赶去参加庆典。公主终于又站在户外，欢喜得走到了队伍前面。就在这时，脚下的大地突然裂开，把她一口吞了进去，又立刻合拢。母亲吓得当场昏倒，妹妹哭得喘不过气，众人费了很大力气才把她拉走。整个宫廷都被这场灾难吓呆了。人们奉命往地下深处挖了又挖，却找不到公主的一点踪迹。
    - id: ch02
      title: 地下花园与小狗
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            公主一直落到地底，四周只有岩石和树木。唯一的活物是一只漂亮的小狗。它亲热地跑来让她抱，随后又跑到前面，不时回头请她跟上。
        - id: ch02-b02
          speaker: narrator
          text: >-
            小狗把她领上山坡。从那里望下去，山谷里长满美丽的果树，枝头同时开着花、结着果，鲜花和果子也铺满地面。谷地中央有一眼喷泉，四周围着柔软如天鹅绒的草地。公主赶到这迷人的地方坐下，一想起自己的遭遇和眼下的孤苦，便伤心地哭了。
        - id: ch02-b03
          speaker: elder_princess
          text: >-
            果子和泉水能让我活下去。可要是野兽来了，我怎么逃得掉呢？
          emotion: fearful
        - id: ch02-b04
          speaker: narrator
          text: >-
            她把可能发生的灾祸想了个遍，只能同小狗玩耍，暂且不再胡思乱想。她一整天都待在喷泉边。天色渐渐暗下来，她正发愁夜里该怎么办，小狗忽然扯起她的裙子。起初公主没有理会，可它不停地扯，每扯几下，又朝同一个方向跑上几步，再回头等她。公主终于决定跟上去。小狗把她带到一块岩石前便停了下来。岩石中央有个很大的洞口，看那意思，它显然想让公主进去。
        - id: ch02-b05
          speaker: narrator
          text: >-
            那是一座宽敞美丽的岩洞，洞壁镶满发光的石头，把里面照得通明。角落里还有一张铺满软苔的小床。公主经历了这么多事，早已疲惫不堪，躺下很快便睡着了，小狗就蜷在她脚边。第二天清早，许多鸟儿的歌声唤醒了她。小狗也醒来，亲热地绕着她蹦跳，又像昨日一样跑在前面，折回来咬住裙角，牵着她回到花园。公主在那里吃果子、喝泉水，在花间散步，和小狗玩耍，夜里再回洞中安睡。
        - id: ch02-b06
          speaker: narrator
          text: >-
            几个月就这样过去了。公主渐渐不再害怕，也慢慢接受了命运，而小狗始终是她最亲密的伙伴。
        - id: ch02-b07
          speaker: narrator
          text: >-
            一天，小狗忽然显得十分忧伤，也不像平时那样亲近她。公主怕它生病，便抱它去找曾经吃过的几种草，希望那些草能让它好起来。可小狗一点也不肯碰。整整一夜，它都痛苦地叹息呻吟。公主后来睡着了，醒来第一个念头就是看看自己的小宝贝，脚边却空空如也。她赶忙跑出洞口，只来得及看见一个老人匆匆离去。那人走得太快，她还没看清，人影便消失了。
        - id: ch02-b08
          speaker: narrator
          text: >-
            这意外给她的震动，几乎不亚于失去小狗本身。从相遇的第一天起，那只小狗一直忠实地陪着她。它是自己走失了，还是被老人偷走了？种种猜想与恐惧折磨着公主。她茫然往前走，忽然被一团浓云包住，托着飞向空中。公主没有挣扎。没过多久，她惊奇地发现，自己竟站在一条通向出生王宫的林荫道上，而那团云已经消失得无影无踪。
    - id: ch03
      title: 失而复得的公主
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            王宫里人人身穿黑衣。公主越往前走越害怕，不知这场哀悼究竟为了谁。很快便有人认出了她，欢呼声顿时响成一片。妹妹听见声音，含着喜悦的泪水跑来，紧紧抱住失而复得的姐姐，也带来了一个悲伤的消息。
        - id: ch03-b02
          speaker: younger_princess
          text: >-
            姐姐，你失踪以后，母亲受不住打击，只活了几天。后来由我戴上王冠。现在你回来了，王位本来就属于你，我把它交还给你。
          emotion: sad
        - id: ch03-b03
          speaker: elder_princess
          text: >-
            除非你和我共享一切权力，否则这顶王冠，我不能接受。
        - id: ch03-b04
          speaker: narrator
          text: >-
            新女王登基后，头几件事便是隆重追念母亲，又以最宽厚、最深挚的情意善待妹妹。可她仍为失去小狗而伤心，便派人到每个国家仔细寻找。始终没有一点消息，她悲痛难当，只好宣布，无论是谁，只要能送回小狗，就能得到半个王国。
        - id: ch03-b05
          speaker: narrator
          text: >-
            宫中许多绅士经不起重赏诱惑，纷纷往四面八方出发，却一个个空着手回到女王面前。女王彻底绝望了。她觉得没有小狗，日子再也过不下去，于是把赏赐改成了自己的婚约。谁能把小狗带回来，她就嫁给谁。这个奖赏更加诱人，几乎所有廷臣都踏上了寻狗之路，宫廷转眼像荒漠一样空了。
        - id: ch03-b06
          speaker: narrator
          text: >-
            廷臣们都不在的时候，有一天，宫里有人禀报，说一个模样极其丑陋的男人求见女王。女王当时正和妹妹坐在一个房间里，便吩咐把那人带到自己面前。
        - id: ch03-b07
          speaker: ugly_man
          text: >-
            只要陛下肯兑现承诺，我就把您的小狗交出来。
        - id: ch03-b08
          speaker: younger_princess
          text: >-
            女王成婚，必须得到国民同意。这么重大的事，应当先召集全国议会。
        - id: ch03-b09
          speaker: narrator
          text: >-
            女王找不出话来反驳，只得先在宫里给那人安排住处，下令第二天召开议会。次日，议会郑重集会。众人听从小公主的建议，决定出一大笔钱买下小狗。如果那人拒绝，就把他逐出王国，再也不许面见女王。那人果然不肯收钱，转身离开了议事大厅。
        - id: ch03-b10
          speaker: elder_princess
          text: >-
            议会的处置没有错。可是我的命运由我自己作主。我会放弃王位，走遍天下，直到找回小狗。
        - id: ch03-b11
          speaker: narrator
          text: >-
            妹妹被这个决定吓坏了，苦苦哀求姐姐改变主意，不要放弃王位，也不要独自漂泊天下。姐妹俩还在争论，一名宫廷侍从忽然走了进来，带来了一桩出人意料的消息。
        - id: ch03-b12
          speaker: chamberlain
          text: >-
            陛下，海湾里已经布满了船只。
    - id: ch04
      title: 翡翠岛的船队
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            姐妹俩跑上阳台，只见庞大的船队张满风帆，正朝港口驶来。她们看了一会儿，断定来者一定是友邦。每艘船都挂着鲜艳的旗帜、飘带和三角旗，最前面的小船还高举一面巨大的白色和平旗。女王立刻派专使去港口打听，很快便得知，这是翡翠岛王子的船队。
        - id: ch04-b02
          speaker: chamberlain
          text: >-
            王子请求登上您的国土，亲自向您表达敬意。
        - id: ch04-b03
          speaker: narrator
          text: >-
            女王马上派几位宫廷显贵前去迎接王子，向他致意。她坐在宝座上等候，见王子进来，便起身迎上几步，又请他坐下。两人密谈了约莫一个钟头。谈话结束后，王子被引到一套华丽的房间休息。到了第二天，他提出想私下觐见女王。
        - id: ch04-b04
          speaker: narrator
          text: >-
            女王在自己的起居室接见了王子，身边只有妹妹陪伴。三人先彼此问候。寒暄过后，王子说，他有一些极其离奇的事情要告诉女王，而世上只有她听了以后，会知道这些话句句都是真的。
        - id: ch04-b05
          speaker: emerald_prince
          text: >-
            陛下，我的国家与万岛女王的领土相邻，其中一部分国土还和她的领地隔着一条狭窄的地峡。有一天，我正在追猎一头雄鹿，不幸遇见了她。因为没有认出她，我没有停下脚步，按照应有的礼节向她致敬。
        - id: ch04-b06
          speaker: emerald_prince
          text: >-
            您比任何人都清楚，她既精通魔法，又有多么爱报复。这两样，我都付出代价，亲自领教过了。大地突然在我脚下裂开，我一直落到一个遥远的地方，还被变成了一只小狗。就是用那副模样，我才有幸在荒野里遇见了陛下。
        - id: ch04-b07
          speaker: emerald_prince
          text: >-
            六个月以后，她仍不肯息怒，又把我变成一个丑陋的老人。我怕这副面貌令您厌恶，便躲进森林深处，在那里又过了三个月。
        - id: ch04-b08
          speaker: emerald_prince
          text: >-
            三个月期满以后，我幸运地遇上一位善良的仙女。她把我从那位骄傲女王的法力下解救出来，也把您的全部经历和如今的所在都告诉了我。自从我们在荒野里第一次相逢，我的心便完全属于您。今天，我正是来把这颗心献给您的。
    - id: ch05
      title: 花岛的婚礼
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: >-
            几天以后，一名传令官走遍全国，向所有人宣告这个喜讯：花岛女王将与年轻的翡翠岛王子成婚。他们幸福地生活了许多年，也把自己的百姓治理得很好。
        - id: ch05-b02
          speaker: narrator
          text: >-
            至于那位虚荣又嫉妒、惹出无数祸事的万岛女王，仙女们也没有忘记她。她们夺走了那位坏女王所有的法力，作为惩罚。
        - id: ch05-b03
          speaker: narrator
          text: >-
            这个古老的故事，出自《仙女书斋》。
