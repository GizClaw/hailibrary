  chapters:
    - id: ch01
      title: The Jealous Queen
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Long ago, a queen ruled the Flowery Isles. A few years after her marriage, her husband died, leaving her in great grief. She then devoted nearly all her care to educating their only children, two charming princesses.
        - id: ch01-b02
          speaker: narrator
          text: The elder princess grew lovelier every year. Her mother feared this would stir the jealousy of the Queen of All the Isles. That proud queen called herself the world's most beautiful woman and expected every rival to bow before her charms.
        - id: ch01-b03
          speaker: narrator
          text: To satisfy her vanity, she persuaded her husband to wage war on the surrounding islands. Eager to please her, the king made one demand of each conquered country. Every royal princess must come to court at fifteen and honor his queen's unmatched beauty.
        - id: ch01-b04
          speaker: narrator
          text: The Queen of the Flowery Isles knew the law. She meant to present her daughter as soon as the girl's fifteenth birthday had passed.
        - id: ch01-b05
          speaker: narrator
          text: The proud queen had heard rumors of the princess's beauty and waited uneasily for her visit. When the girl finally appeared, worry turned to jealousy. She was so radiant that the queen had to admit she had never seen anyone so lovely.
        - id: ch01-b06
          speaker: proud_queen
          text: No one, that is, except me.
        - id: ch01-b07
          speaker: narrator
          text: Nothing could have persuaded her that anyone might outshine her. But the whole court spoke openly of the princess's beauty, and their admiration soon showed the queen the truth.
        - id: ch01-b08
          speaker: narrator
          text: Furious, she pretended to be ill and withdrew rather than watch the princess's triumph. She sent word that she was too unwell to receive them again and advised the Queen of the Flowery Isles to take her daughter home.
        - id: ch01-b09
          speaker: narrator
          text: The message came through a great lady of the court, an old friend of the visiting queen. Along with it, the lady gave her own warning.
        - id: ch01-b10
          speaker: court_lady
          text: Do not wait for a formal farewell. Take your daughter home as quickly as you can.
        - id: ch01-b11
          speaker: narrator
          text: The Queen of the Flowery Isles understood at once. She knew the angry queen possessed magic, so she hurried away with her daughter. At home, she warned the princess that some terrible danger threatened her. For six months, the girl must not leave the palace for any reason.
        - id: ch01-b12
          speaker: mother_queen
          text: Promise me you will stay safely inside until those six months are over.
        - id: ch01-b13
          speaker: elder_princess
          text: I promise, Mother. I will obey you.
        - id: ch01-b14
          speaker: narrator
          text: Everyone tried to make the confinement pleasant. On the final day of the six months, a splendid festival was planned in a lovely meadow near the palace. The princess watched every preparation from her window.
        - id: ch01-b15
          speaker: elder_princess
          text: Please, Mother, may I go only as far as the meadow? It is so near, and today is the last day.
        - id: ch01-b16
          speaker: narrator
          text: The queen believed the danger must surely have passed. She agreed and promised to take her daughter herself. The whole court rejoiced to see their beloved princess free again, and they all set out happily for the festival.
        - id: ch01-b17
          speaker: narrator
          text: Delighted to be outdoors, the princess walked a little ahead of the others. Without warning, the earth opened beneath her feet. It swallowed her, then closed again.
        - id: ch01-b18
          speaker: narrator
          text: The queen fainted. The younger princess wept so bitterly that she could hardly be pulled away. Horror swept through the court. Workers bored deep into the ground, but found no trace of the vanished princess.
    - id: ch02
      title: Beneath the Earth
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: The princess fell through the earth into a deserted land of rocks and trees, with no person anywhere. The only living creature she saw was a pretty little dog, who ran up and greeted her affectionately.
        - id: ch02-b02
          speaker: narrator
          text: She lifted him into her arms and played with him for a while. When she put him down, he trotted ahead, looking back again and again as if asking her to follow.
        - id: ch02-b03
          speaker: narrator
          text: The princess let him lead her to a small hill. From its top, she saw a valley filled with beautiful fruit trees. Flowers and fruit grew on the branches together, while more fruit and blossoms covered the ground. In the middle of the valley, a fountain rose from a lawn as soft as velvet.
        - id: ch02-b04
          speaker: narrator
          text: She hurried down and sat on the grass. Thinking of the disaster that had carried her there, she burst into tears. Fruit and clear water could keep her from hunger and thirst. But how could she escape if a wild beast came to eat her?
        - id: ch02-b05
          speaker: narrator
          text: After imagining every possible danger, she tried to escape her fears by playing with the dog. They stayed beside the fountain all day. As night came, she wondered where to sleep. Then the dog began tugging at her dress.
        - id: ch02-b06
          speaker: narrator
          text: At first she ignored him. Still he pulled at the cloth, ran a few steps in one direction, and returned to pull again. At last she followed. He stopped before a rock with a wide opening in its center and plainly wanted her to go inside.
        - id: ch02-b07
          speaker: narrator
          text: Beyond the opening lay a beautiful cave, lit by brilliant stones in its walls. In one corner stood a little couch covered in soft moss. The princess lay down, the dog curled at her feet, and she soon fell asleep.
        - id: ch02-b08
          speaker: narrator
          text: Very early the next morning, many birds woke her with their songs. The dog sprang up too and danced around her as lovingly as ever. When she went outside, he ran ahead, kept turning back, and tugged at her dress to draw her onward.
        - id: ch02-b09
          speaker: narrator
          text: She followed him back to the garden. There she ate fruit, drank from the fountain, and felt she had enjoyed an excellent meal. She wandered among the flowers and played with her companion. When night returned, she went back to sleep in the cave.
        - id: ch02-b10
          speaker: narrator
          text: Several months passed this way. Her first terrors faded, and she grew more resigned to her fate. The faithful little dog remained her constant companion and greatest comfort.
        - id: ch02-b11
          speaker: narrator
          text: Then one day, the dog seemed deeply sad. He did not even come to caress her. Afraid he was ill, the princess carried him to some special herbs she had once seen him eat. She hoped they would help him, but he would not touch them. All that night he sighed and groaned as though he were in terrible pain.
        - id: ch02-b12
          speaker: narrator
          text: At last the princess fell asleep. The moment she awoke, she thought of her little friend. He was not at her feet. She ran out of the cave to search for him and caught sight of an old man hurrying away. He vanished so quickly that she barely saw him.
        - id: ch02-b13
          speaker: narrator
          text: This new surprise shook her almost as much as losing the dog who had stayed beside her from the first day. Had he wandered away? Or had the old man stolen him?
        - id: ch02-b14
          speaker: narrator
          text: Troubled by fear after fear, she wandered on. Suddenly, a thick cloud wrapped around her and carried her through the air. She did not resist. Before long, the cloud set her down in an avenue leading to the palace where she had been born. Then it disappeared without a trace.
    - id: ch03
      title: The Princess Returns
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: Near the palace, the princess saw everyone dressed in black and feared someone had died. She hurried on. Soon she was recognized, and joyful shouts rang out.
        - id: ch03-b02
          speaker: narrator
          text: Her sister heard the cheering and ran to meet her. She embraced the wanderer with tears of happiness, but the news she brought was sorrowful.
        - id: ch03-b03
          speaker: younger_princess
          text: The shock of losing you was too terrible for Mother. She lived only a few days after you disappeared. I have worn the crown since then, but now I give it back to you. It belongs to you by right.
          emotion: sad
        - id: ch03-b04
          speaker: narrator
          text: The elder sister wanted to refuse the throne. In the end, she would accept it on only one condition.
        - id: ch03-b05
          speaker: elder_princess
          text: If I take the crown, you must share all its power with me.
        - id: ch03-b06
          speaker: narrator
          text: The new queen first honored her beloved mother's memory and showered affection on her sister. Still grieving for her dog, she had every country searched. When no trace was found, she offered half her kingdom for his return.
        - id: ch03-b07
          speaker: narrator
          text: Many gentlemen of the court set off in every direction, but all returned empty-handed. In despair, the queen found life without her little companion unbearable and made a greater promise.
        - id: ch03-b08
          speaker: elder_princess
          text: Whoever brings my little dog back to me shall have my hand in marriage.
        - id: ch03-b09
          speaker: narrator
          text: Nearly every courtier rushed away on the quest, leaving the court deserted. Then an unpleasant-looking man asked to speak with the queen. She had him brought to the room where she sat with her sister.
        - id: ch03-b10
          speaker: prince
          text: I can give you your little dog, Your Majesty, if you are ready to keep the promise you made.
        - id: ch03-b11
          speaker: narrator
          text: Before the queen could answer, her sister spoke.
        - id: ch03-b12
          speaker: younger_princess
          text: The queen cannot marry without the nation's consent. For a matter this important, the general council must be called.
        - id: ch03-b13
          speaker: narrator
          text: The queen could not deny that this was true. She gave the man an apartment in the palace and ordered the council to assemble the following day.
        - id: ch03-b14
          speaker: narrator
          text: The council met in state. On the younger princess's advice, they offered the stranger a large sum for the dog. He refused, so they banished him without letting him see the queen again.
        - id: ch03-b15
          speaker: narrator
          text: The younger princess told her sister what had happened. The queen approved of the council's actions, but her own decision was already made.
        - id: ch03-b16
          speaker: elder_princess
          text: I am still free to choose my own path. I will give up the throne and wander through the world until I find my little dog.
        - id: ch03-b17
          speaker: narrator
          text: Her sister was deeply alarmed and begged her to reconsider. While they were still arguing, a chamberlain entered with urgent news.
        - id: ch03-b18
          speaker: chamberlain
          text: Your Majesty, the bay is covered with ships.
    - id: ch04
      title: The Fleet in the Bay
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: The sisters hurried to the balcony. A great fleet sailed toward the port. It seemed friendly, for every vessel flew bright flags, streamers, and pennons. A small ship led the way beneath a great white flag of peace.
        - id: ch04-b02
          speaker: narrator
          text: The queen sent a special messenger to the harbor. Word quickly came back that the fleet belonged to the Prince of the Emerald Isles. He asked permission to land in her kingdom and present his humble respects. The queen sent several high officers of the court to welcome him.
        - id: ch04-b03
          speaker: narrator
          text: She waited on her throne. When the prince appeared, she rose and walked a few steps to meet him, then invited him to sit. They remained deep in conversation for about an hour.
        - id: ch04-b04
          speaker: narrator
          text: Afterward, servants led the prince to a splendid set of rooms. The next day, he asked to speak with the queen in private. She received him in her own sitting room, with only her sister beside her.
        - id: ch04-b05
          speaker: narrator
          text: Once the first greetings were over, the prince said he had a very strange story to tell. Only the queen herself would know that every word was true.
        - id: ch04-b06
          speaker: prince
          text: Your Majesty, my lands border those of the Queen of All the Isles. A narrow strip of land joins part of my country to hers. One day, while I was hunting a stag, I had the misfortune to meet that queen. I did not recognize her, so I failed to stop and greet her with all the ceremony she expected.
        - id: ch04-b07
          speaker: prince
          text: You know better than anyone how fiercely she takes revenge, and you know that she commands magic. I learned both truths at my own expense. The earth opened under my feet, and I fell into a far-off land. There she changed me into a little dog. In that shape, I had the honor of meeting you.
        - id: ch04-b08
          speaker: prince
          text: Six months passed, but her revenge was still not satisfied. She changed me again, this time into a hideous old man. I feared that the sight of me would be unpleasant to you, so I hid deep in the woods and stayed there for three more months.
        - id: ch04-b09
          speaker: prince
          text: At the end of that time, I was fortunate enough to meet a kind fairy. She freed me from the proud queen's power. Then she told me everything that had happened to you and showed me where I could find you.
        - id: ch04-b10
          speaker: prince
          text: And so I have come to offer you my heart. It has belonged entirely to you from the day we first met in that lonely land.
    - id: ch05
      title: The Queen's Happy Ending
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: A few days later, a herald traveled through the kingdom with joyful news. The Queen of the Flowery Isles would marry the young Prince of the Emerald Isles.
        - id: ch05-b02
          speaker: narrator
          text: The queen and prince lived happily for many years, and together they ruled their people well.
        - id: ch05-b03
          speaker: narrator
          text: As for the wicked queen, whose vanity and jealousy had caused so much harm, the Fairies punished her by taking away all her power.
