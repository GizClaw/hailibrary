audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm, observant, and gently dramatic
        timbre: clear and rounded
        pace: measured
        pitch: medium
    king:
      display_name: The King
      tts:
        delivery: noble, tender, and easily troubled
        timbre: resonant and mature
        pace: measured
        pitch: medium-low
    prince:
      display_name: The Prince
      tts:
        delivery: brave, courteous, and youthful
        timbre: clear and open
        pace: natural
        pitch: medium
    kostiei:
      display_name: King Kostiei
      tts:
        delivery: sharp, menacing, and quick to rage
        timbre: thin and rasping
        pace: forceful
        pitch: medium-high
    youngest_princess:
      display_name: The Youngest Princess
      tts:
        delivery: gentle, clever, and quietly resolute
        timbre: soft and luminous
        pace: natural
        pitch: medium-high
    spittle:
      display_name: The Enchanted Spittle
      tts:
        delivery: uncanny and playfully imitative
        timbre: light and hollow
        pace: natural
        pitch: medium
  chapters:
    - id: ch01
      title: The Promise at the Well
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Long ago, a king and queen lived without children, though both of them longed for a little son. Each tried to hide the sorrow from the other. They hunted, went hawking, and filled their days with every sport they could find. At last the king could bear it no longer. He announced that he would visit the farthest corners of his realm and would not return to the capital for many months.
        - id: ch01-b02
          speaker: narrator
          text: He hoped the journey would give him so much to think about that he would stop grieving for the son who never came.
        - id: ch01-b03
          speaker: narrator
          text: The kingdom was vast, with high stony mountains and sandy deserts that made travel difficult. One day, the king wandered away alone. He meant to go only a short distance, but the land looked the same in every direction, and he lost the path. For hours he struggled beneath the burning sun until his legs shook. He might have died of thirst if he had not stumbled upon a little well that looked freshly dug.
        - id: ch01-b04
          speaker: narrator
          text: A silver cup with a golden handle floated on the water. Whenever the king reached for it, it bobbed away. He was too thirsty to keep trying, so he knelt and drank his fill. Then he tried to stand, but his beard was caught fast in the water. He jerked his head again and again. It only hurt, and his beard would not come free.
        - id: ch01-b05
          speaker: king
          text: Let me go this instant! Who is holding me?
          emotion: angry
        - id: ch01-b06
          speaker: kostiei
          text: I am King Kostiei. You drank from my spring, and I will not release you until you make me a promise. You must give me the most precious thing in your palace that was not there when you left.
        - id: ch01-b07
          speaker: narrator
          text: The voice came from a little man beneath the water. He had green eyes and an enormous head. Now, the king cared for nothing in the palace as much as he cared for the queen. But she had been weeping on a heap of cushions in the great hall when he rode away, so she could not be the thing Kostiei meant.
        - id: ch01-b08
          speaker: narrator
          text: The king gladly gave the promise the ugly little man demanded. In an instant, the man, the spring, and the silver cup all vanished. The king found himself kneeling on dry sand, wondering whether he had dreamed it. Yet his thirst was gone, and he felt strong again. That convinced him the strange meeting had truly happened. He sprang onto his horse and rode off with a light heart to search for his companions.
        - id: ch01-b09
          speaker: narrator
          text: A few weeks later, the royal party started home. They reached the capital on a hot day, eight months after leaving it. The king's people loved him, and crowds packed the roadside, cheering and waving their hats as he passed.
        - id: ch01-b10
          speaker: narrator
          text: The queen waited on the palace steps with a splendid golden cushion in her arms. Upon it lay the most beautiful baby boy anyone had ever seen, wrapped in a cloud of lace. At once, Kostiei's words came rushing back to the king. Everyone expected him to be overcome with joy, but instead he wept bitterly.
        - id: ch01-b11
          speaker: narrator
          text: The king tried to lose himself in work, but nothing he did could make him forget his promise. Whenever the baby left his sight, he feared he had seen his son for the last time. But the years went by. The prince grew first into a big boy and then into a fine young man. Kostiei gave no sign and sent no message. Little by little, even the anxious king thought less about him, until at last he forgot him completely.
    - id: ch02
      title: The Unlooked-for Prince
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: No family in the kingdom was happier than the king, the queen, and their son. Then one day, while the young prince was hunting in a lonely part of the woods, he met a little old man.
        - id: ch02-b02
          speaker: kostiei
          text: So, how is my unlooked-for prince? You certainly kept everyone waiting long enough!
        - id: ch02-b03
          speaker: prince
          text: Who are you?
        - id: ch02-b04
          speaker: kostiei
          text: You will find out soon enough. When you return, give your father my compliments. Tell him I want him to settle his account with me. If he refuses to pay what he owes, he will regret it bitterly.
        - id: ch02-b05
          speaker: narrator
          text: With that, the old man vanished. The prince went back to the palace and told his father everything. The king turned pale and confessed the terrible story of the well and his promise.
        - id: ch02-b06
          speaker: prince
          text: Don't grieve, Father. It may not be as dreadful as it seems. I will find a way to make Kostiei surrender his claim on me. But if I have not returned in a year, you must give up hope of seeing me again.
        - id: ch02-b07
          speaker: narrator
          text: The prince began preparing for the journey at once. His father gave him a full suit of steel armor, a sword, and a horse. His mother hung a golden cross around his neck. Both parents knew where he was going and what might await him there. They kissed him tenderly, wept many tears, and at last let him ride away.
        - id: ch02-b08
          speaker: narrator
          text: He rode steadily for three days. At sunset on the fourth, he reached the seashore. Twelve white dresses lay on the sand, dazzling as snow, but he could see no one they might belong to. Curious about what would happen, he picked up one dress. He let his horse wander in the nearby fields, hid among some willows, and waited.
        - id: ch02-b09
          speaker: narrator
          text: Soon a flock of geese paddled in from the sea. They put on the dresses and struck the sand with their feet. In a flash, eleven of them became beautiful young women and flew away. The twelfth goose, the youngest, stayed in the water. She stretched out her long white neck and searched the shore anxiously. Then she spotted the prince among the willows and called to him in a human voice.
        - id: ch02-b10
          speaker: youngest_princess
          text: Oh, Prince, please return my dress. I will be grateful to you forever.
        - id: ch02-b11
          speaker: narrator
          text: The prince quickly placed the dress on the sand and turned away. The maiden slipped off her goose skin, dressed herself, and came toward him. Her beauty was greater than anyone had ever seen or told of. Blushing, she held out her hand and spoke softly.
        - id: ch02-b12
          speaker: youngest_princess
          text: Thank you, noble Prince, for granting my request. I am the youngest daughter of Kostiei the Immortal. My father has twelve daughters, and he rules the kingdoms beneath the earth. He has waited a long time for you, and his anger is great. But don't be afraid. Just do exactly as I tell you.
        - id: ch02-b13
          speaker: youngest_princess
          text: When you meet King Kostiei, drop to your knees. Pay no attention to his threats or his screams. Keep moving boldly toward him. You will learn what comes next when the time arrives. Now, come with me.
        - id: ch02-b14
          speaker: narrator
          text: She stamped her foot. A great opening split the ground beneath them, and together they went down into the very heart of the earth. Before long they reached Kostiei's palace. Though it stood in the dark kingdoms below, its own radiance was brighter than the sun and cast light all around it. The prince remembered every word the princess had told him. Then he entered the great hall boldly.
    - id: ch03
      title: Three Impossible Tasks
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: Kostiei sat at the center of the hall upon a golden throne, a shining crown on his head. His green eyes glittered like glass, and his hands looked like the claws of a crab. The moment he saw the prince, he gave such piercing shrieks that the palace walls shook.
        - id: ch03-b02
          speaker: narrator
          text: The prince ignored the noise. Still on his knees, he moved steadily toward the throne. Just as he drew near, Kostiei burst out laughing.
        - id: ch03-b03
          speaker: kostiei
          text: You are lucky. You managed to make me laugh. You may stay here in our underground kingdom, but first you must complete three tasks. It is late tonight, so go to bed. Tomorrow I will tell you what to do.
        - id: ch03-b04
          speaker: narrator
          text: Early the next morning, word came that Kostiei was ready for him. The prince dressed and hurried to the throne room. He bowed low before the little king, who began at once.
        - id: ch03-b05
          speaker: kostiei
          text: Here is your first task. Before nightfall, build me a marble palace with crystal windows and a golden roof. It must stand in a great park filled with streams and lakes. Do it, and you will be my friend. Fail, and I will have your head.
        - id: ch03-b06
          speaker: narrator
          text: The prince said nothing. He returned to his room and thought of the certain death waiting for him. While he sat lost in misery, a bee struck the window and tapped against the glass.
        - id: ch03-b07
          speaker: youngest_princess
          text: Let me in.
        - id: ch03-b08
          speaker: narrator
          text: The prince opened the window. Instead of a bee, the youngest princess stood before him.
        - id: ch03-b09
          speaker: youngest_princess
          text: What are you sitting here dreaming about, Prince?
        - id: ch03-b10
          speaker: prince
          text: I was thinking about your father. He has arranged my death.
        - id: ch03-b11
          speaker: youngest_princess
          text: Don't be afraid. Sleep peacefully tonight. When you wake tomorrow, the palace will be finished.
          emotion: calm
        - id: ch03-b12
          speaker: narrator
          text: She kept her word exactly. In the morning, the prince left his room and found the task complete. Before him rose a palace more beautiful than anything his imagination had ever pictured. The marble walls, crystal windows, golden roof, park, lakes, and streams were all there. Kostiei could scarcely believe his own eyes. He studied the wonderful place and thought deeply about how it could have appeared.
        - id: ch03-b13
          speaker: kostiei
          text: Well, you have won this time. But I will not release you so easily. Tomorrow my twelve daughters will stand in a row. If you cannot tell me which one is the youngest, I will have your head.
        - id: ch03-b14
          speaker: prince
          text: Not recognize the youngest princess? As if that could happen!
        - id: ch03-b15
          speaker: narrator
          text: The prince had hardly entered his room when the bee answered him from near the ceiling.
        - id: ch03-b16
          speaker: youngest_princess
          text: The task is much harder than you think. Without my help, you will never succeed. All twelve of us look so exactly alike that even our father can barely tell us apart.
        - id: ch03-b17
          speaker: prince
          text: Then what should I do?
        - id: ch03-b18
          speaker: youngest_princess
          text: Look for a ladybird on one girl's eyelid. That girl will be the youngest. Watch very carefully. Now I must go.
        - id: ch03-b19
          speaker: narrator
          text: The next morning, Kostiei summoned the prince once more. All twelve princesses stood in a row. They wore precisely the same clothes, their faces looked alike, and every pair of eyes was lowered. The prince was astonished by their likeness. He walked slowly along the line once, then a second time, but he could not find the promised sign. On his third pass, his heart suddenly began to pound. There, on one girl's eyelid, was a tiny speck. It was the ladybird.
        - id: ch03-b20
          speaker: prince
          text: This is the youngest daughter.
        - id: ch03-b21
          speaker: kostiei
          text: How could you possibly know? There is some trick behind this! But you will not get away from me so easily. Come back in three hours and prove your cleverness once more. I will light a handful of straw. Before it burns away, you must turn it into a pair of boots. If you fail, I will have your head.
          emotion: angry
    - id: ch04
      title: Flight into the Sunlight
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: The prince returned sadly to his room. The bee was already waiting for him.
        - id: ch04-b02
          speaker: youngest_princess
          text: Why do you look so miserable, my handsome prince?
        - id: ch04-b03
          speaker: prince
          text: How could I look otherwise? Your father expects me to make him a pair of boots. Does he think I am a shoemaker?
        - id: ch04-b04
          speaker: youngest_princess
          text: What are you going to do?
        - id: ch04-b05
          speaker: prince
          text: I certainly will not make boots. I am not afraid to die. After all, a person can only die once.
        - id: ch04-b06
          speaker: youngest_princess
          text: No, Prince. You will not die. I will do everything I can to save you. We will escape together, or we will die together.
        - id: ch04-b07
          speaker: narrator
          text: She spat upon the floor. Then she pulled the prince out of the room, locked the door behind them, and threw away the key. Hand in hand, they climbed up into the sunlight and came out beside the same sea. The prince's horse was still grazing quietly in the neighboring meadow.
        - id: ch04-b08
          speaker: narrator
          text: At the sight of his master, the horse whinnied and galloped over. The prince leaped into the saddle, swung the princess up behind him, and raced away like an arrow from a bow.
        - id: ch04-b09
          speaker: narrator
          text: When the hour for the last trial arrived and the prince did not appear, Kostiei sent servants to ask why he was late. They found his door locked and pounded on it. From inside came the prince's voice, or so it seemed. The princess's spittle was speaking in his place.
        - id: ch04-b10
          speaker: spittle
          text: I will be there in one moment.
        - id: ch04-b11
          speaker: narrator
          text: The servants carried the answer to Kostiei. He waited, but still the prince did not come. He sent them to the room again, and the same voice answered.
        - id: ch04-b12
          speaker: spittle
          text: I am coming right away.
        - id: ch04-b13
          speaker: kostiei
          text: He is mocking me! Break down that door and bring him here!
          emotion: angry
        - id: ch04-b14
          speaker: narrator
          text: The servants hurried to obey. They smashed open the door and found no prince and no princess inside. There was only the spittle, shaking with laughter at the trick. Kostiei was beside himself with rage. He called for his guards and ordered them to ride after the fugitives. They must capture both of them. If the guards dared return without their prisoners, Kostiei warned, their own heads would pay for the failure.
    - id: ch05
      title: The River and the Forest
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: By then, the prince and princess had gained a good lead and were beginning to feel happy. Suddenly, they heard galloping far behind them. The prince jumped from the saddle and pressed his ear to the ground.
        - id: ch05-b02
          speaker: prince
          text: They are chasing us.
        - id: ch05-b03
          speaker: youngest_princess
          text: Then we have no time to waste.
        - id: ch05-b04
          speaker: narrator
          text: At once, the princess changed herself into a river and the prince into a bridge. She turned the horse into a crow. Beyond the bridge, she split the broad road into three narrow paths.
        - id: ch05-b05
          speaker: narrator
          text: When Kostiei's soldiers reached the bridge, they stopped in confusion. They saw nothing but a river, a bridge, a crow, and three roads stretching away on the other side. There was no sign of the riders. With three paths ahead, the soldiers had no way to know which one the fugitives had taken. At last they gave up the search. They turned their horses around and rode back to Kostiei, trembling at the thought of facing him.
        - id: ch05-b06
          speaker: kostiei
          text: You fools! The bridge and the river were the fugitives. Did that never occur to you? Go back at once!
          emotion: angry
        - id: ch05-b07
          speaker: narrator
          text: The soldiers galloped away like lightning. But they had lost precious time, and the prince and princess were already far ahead.
        - id: ch05-b08
          speaker: youngest_princess
          text: I hear a horse coming.
        - id: ch05-b09
          speaker: narrator
          text: The prince dismounted and listened with his ear against the ground.
        - id: ch05-b10
          speaker: prince
          text: Yes. They are close now.
        - id: ch05-b11
          speaker: narrator
          text: In the next instant, the prince, the princess, and the horse all vanished. A dense forest stood in their place, crossed and recrossed by more paths than anyone could count. Kostiei's soldiers dashed recklessly among the trees. Again and again, they believed they could see the fleeing horse with its two riders just ahead. They followed it deeper through the twisting paths. Just when they seemed close enough to catch it, the horse, the riders, and the whole forest disappeared. The soldiers found themselves standing at the very place where they had started.
        - id: ch05-b12
          speaker: narrator
          text: They could do nothing but return and tell Kostiei about this new defeat.
        - id: ch05-b13
          speaker: kostiei
          text: Bring me a horse! I will chase them myself. This time they will not escape me!
          emotion: angry
        - id: ch05-b14
          speaker: narrator
          text: Foaming with anger, Kostiei mounted and galloped away.
    - id: ch06
      title: Beyond Kostiei's Power
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: Far ahead, the princess listened to the road behind them.
        - id: ch06-b02
          speaker: youngest_princess
          text: I think someone is following us.
        - id: ch06-b03
          speaker: prince
          text: Yes, I hear him too.
        - id: ch06-b04
          speaker: youngest_princess
          text: This time it is Kostiei himself. His power ends at the first church, and he cannot pass it. Give me your golden cross.
        - id: ch06-b05
          speaker: narrator
          text: The prince took off the cross his mother had given him. The princess quickly changed herself into a church. She turned the prince into a priest and the horse into a bell tower. She had scarcely finished when Kostiei thundered up.
        - id: ch06-b06
          speaker: kostiei
          text: Greetings, monk. Have you seen two travelers ride past here?
        - id: ch06-b07
          speaker: prince
          text: Yes. The prince and Kostiei's daughter passed only a moment ago. They went into the church, and they asked me to give you their greetings if you appeared.
        - id: ch06-b08
          speaker: narrator
          text: Then Kostiei knew he had been beaten beyond all hope. The prince and princess went on with their journey, and no further adventures troubled them.
