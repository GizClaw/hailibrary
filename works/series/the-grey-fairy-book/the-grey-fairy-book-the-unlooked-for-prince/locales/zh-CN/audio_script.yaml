audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 亲切从容，保留古老童话的神秘感
        timbre: 温暖清晰
        pace: 舒缓
        pitch: 中音
    king:
      display_name: 国王
      tts:
        delivery: 仁厚而忧郁，危急时仍有君王的果断
        timbre: 成熟浑厚
        pace: 稳健
        pitch: 中低音
    kostiei:
      display_name: 科斯切伊
      tts:
        delivery: 阴狠暴躁，得意时带着尖刻的戏谑
        timbre: 尖厉粗哑
        pace: 变化迅疾
        pitch: 中高音
    old_man:
      display_name: 小老头
      tts:
        delivery: 神秘冷淡，话里带着催债般的威胁
        timbre: 苍老干涩
        pace: 缓慢
        pitch: 中高音
    prince:
      display_name: 王子
      tts:
        delivery: 勇敢坦率，面对威胁时沉着坚定
        timbre: 年轻清朗
        pace: 适中
        pitch: 中音
    youngest_princess:
      display_name: 小公主
      tts:
        delivery: 聪慧温柔，做决定时干脆勇敢
        timbre: 柔和明亮
        pace: 适中
        pitch: 中高音
    magic_spittle:
      display_name: 魔法唾沫
      tts:
        delivery: 模仿王子的声音，回答简短机灵
        timbre: 年轻清亮
        pace: 适中偏快
        pitch: 中音
  chapters:
    - id: ch01
      title: 国王的诺言
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            很久以前，有一位国王和一位王后。他们没有孩子，却一心盼望能有个小王子。两人都把难过藏在心里，不愿让对方看见，只装作一心享受打猎、放鹰和各种游乐。后来，国王实在熬不下去了，宣布要巡视王国最偏远的地方，几个月后才回京城。他以为一路上事情繁多，要想的事也多，或许能让自己忘掉那个一直没有降生的儿子，不再日日为他难过。
        - id: ch01-b02
          speaker: narrator
          text: >-
            这个王国十分辽阔，到处是石头嶙峋的高山和茫茫沙漠，从一处去另一处很不容易。有一天，国王独自走出去，本来没想走远，谁知周围景物处处相同，他再也找不到来时的路了。他顶着烈日走了好几个钟头，太阳一直烤着脑袋，两条腿也在身下直发抖。就在快要渴死时，他忽然绊到一口像是刚挖好的小井。水上漂着一只金柄银杯，可他每次伸手，杯子都会晃悠悠地躲开。国王渴得再也等不下去，索性跪在井边喝了个饱。
        - id: ch01-b03
          speaker: narrator
          text: >-
            喝完水，他正要起身，胡子却像粘在井里一样，怎么拔也拔不出来。他猛扯几下，只把自己弄得生疼，终于气恼地喊了起来。
        - id: ch01-b04
          speaker: king
          text: >-
            立刻放开！是谁抓着我？
          emotion: angry
        - id: ch01-b05
          speaker: narrator
          text: >-
            井水下面，一个绿眼睛、大脑袋的小个子抬头望着他。
        - id: ch01-b06
          speaker: kostiei
          text: >-
            是我，科斯切伊王。你喝了我的泉水，我可不能白白放你走。你得答应我，把宫里最宝贵的东西交出来。那件东西，是你离开时还没有的。
        - id: ch01-b07
          speaker: narrator
          text: >-
            国王在宫中最珍爱的只有王后。他动身时，王后明明还坐在大厅的一堆软垫上伤心哭泣，所以科斯切伊说的绝不会是她。国王便痛快地答应了那个丑陋小人的条件。转眼间，小人、泉水和银杯全不见了，只剩他一个人跪在干燥的沙地上。他一度以为自己做了场梦，可身体确实恢复了力气，也舒服了许多，便知道这场奇遇是真的。于是，他一跃上马，心情轻快地去寻找同伴。
        - id: ch01-b08
          speaker: narrator
          text: >-
            几个星期后，国王一行踏上归途。离家整整八个月，他们终于在一个炎热的日子回到京城。百姓都爱戴国王，挤满道路，欢呼着挥舞帽子。宫殿台阶上，王后抱着华美的金色软垫，垫上躺着世间最漂亮的男婴，花边像云雾一样裹着他。国王猛然想起科斯切伊的条件，竟当众痛哭起来。所有人都以为他见到儿子会欢喜得发狂，谁也不懂他为何落泪。无论他怎样努力，怎样用繁忙事务分心，都忘不掉自己的承诺。从此以后，只要孩子离开他的视线，国王就怕这一眼已经是永别。
        - id: ch01-b09
          speaker: narrator
          text: >-
            岁月一年年过去。小王子先长成高大少年，又成了俊美青年，科斯切伊却始终没有露出半点踪影。原本忧心忡忡的国王慢慢少了顾虑，想起他的次数越来越少，最后竟把那件事全忘了。全国再也找不出比这一家三口更幸福的人。直到有一天，年轻的王子在一处偏僻的树林里打猎，遇见一个小老头。
        - id: ch01-b10
          speaker: old_man
          text: >-
            你好啊，我那意外降生的王子！你可让他们等了太久。
        - id: ch01-b11
          speaker: prince
          text: >-
            你是谁？
        - id: ch01-b12
          speaker: old_man
          text: >-
            用不了多久，你自然会知道。回去替我问候你父亲，叫他把欠我的账结清。他若不肯还债，迟早会后悔。
        - id: ch01-b13
          speaker: narrator
          text: >-
            老头说完就消失了。王子回宫讲了这番遭遇，国王脸色发白，只好把当年的可怕诺言原原本本告诉他。
        - id: ch01-b14
          speaker: prince
          text: >-
            父亲，别再伤心了。这件事没那么可怕。我会找到办法，让科斯切伊放弃对我的权利。可要是一年以后我还没回来，你们就别再等我了。
        - id: ch01-b15
          speaker: narrator
          text: >-
            王子开始准备远行。父亲给了他钢甲、宝剑和骏马，母亲把一枚金十字架挂在他颈上。国王和王后含泪吻别，终于让他独自上路。
    - id: ch02
      title: 地下王国
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            王子一刻不停地赶了三天路，第四天日落时来到海边。面前的沙滩上放着十二件雪白耀眼的衣裳，可他放眼望去，四周一个主人也不见。他想看看接下来会发生什么，便拿走一件，让马儿在附近田野随意走动，自己藏进柳树丛等候。没过多久，一群原在海里戏水的鹅游上岸，各自穿起白衣，脚一踏沙地，眨眼间就变成十一个美丽少女，飞快地离去了。最小的第十二只还留在水里，焦急地伸长雪白的颈子四处寻找。它忽然看见柳树后的王子，竟用人的声音叫他。
        - id: ch02-b02
          speaker: youngest_princess
          text: >-
            王子，请把衣裳还给我吧。我会永远记得你的恩情。
        - id: ch02-b03
          speaker: narrator
          text: >-
            王子立刻把衣裳放回沙滩，走到一旁。少女脱去鹅皮，穿好衣裳，来到他面前。她美得世上从未有人见过，也从未有人说起过。少女红着脸伸出手，声音很轻。
        - id: ch02-b04
          speaker: youngest_princess
          text: >-
            高贵的王子，谢谢你肯帮我。我是不死的科斯切伊最小的女儿。父亲一共有十二个女儿，还统治着地下的许多王国。他等你很久了，现在正气得厉害。不过你别怕，只要听我的。见到他就马上跪下，不管他怎样威胁、怎样吼叫，你都别停，只管大胆向前。后面的事，到时你就明白了。现在跟我来。
        - id: ch02-b05
          speaker: narrator
          text: >-
            公主说完，用脚在地上一踏，那里顿时裂开一道深渊。两人沿着裂口往下走，一直来到大地的心脏。没过多久，他们便看见科斯切伊的宫殿。宫殿自身发出比太阳还明亮的光，把地下那些黑暗的王国照得通明。王子牢牢记着公主的叮嘱，大胆走进了大厅。
        - id: ch02-b06
          speaker: narrator
          text: >-
            科斯切伊头戴闪亮的王冠，坐在大厅中央的金宝座上。他的绿眼睛像玻璃一样闪着光，两只手则像螃蟹的钳子。看到王子，他立刻发出一阵阵刺耳的尖叫，震得整座宫殿的墙都在发颤。王子对那些威胁充耳不闻，仍然跪着，一步步大胆挪向宝座。等他几乎来到跟前时，科斯切伊忽然放声笑了起来。
        - id: ch02-b07
          speaker: kostiei
          text: >-
            你居然能把我逗笑，算你走运。就留在地下王国吧，不过要先办好三件事。今晚太晚了，你先去睡，明天再听吩咐。
        - id: ch02-b08
          speaker: narrator
          text: >-
            第二天一早，王子收到传话，说科斯切伊已经准备见他。他赶紧起床穿好衣服，来到接见大厅。小个子国王早已坐在宝座上。王子出现以后，先向他深深行了一礼，然后站在那里等候吩咐。
        - id: ch02-b09
          speaker: kostiei
          text: >-
            今天夜里以前，你得替我造一座大理石宫殿。窗户要用水晶，屋顶要用黄金。宫殿得立在大花园中央，园中还要有溪流和湖泊。造得出来，你就是我的朋友。造不出来，我就砍你的头。
        - id: ch02-b10
          speaker: narrator
          text: >-
            王子默默听完这道惊人的命令，回到自己房里，坐下来想着等待自己的必死结局。他想得出了神，一只蜜蜂忽然飞来撞上窗户，又笃笃敲着玻璃，请他放它进来。王子起身打开窗，眼前站着的已经不是蜜蜂，而是最小的公主。
        - id: ch02-b11
          speaker: youngest_princess
          text: >-
            王子，你在发什么愁？
        - id: ch02-b12
          speaker: prince
          text: >-
            我在想你父亲。他已经安排好要杀我了。
        - id: ch02-b13
          speaker: youngest_princess
          text: >-
            不用害怕。今晚安心睡吧，明早醒来，宫殿自然会好好地立在那里。
          emotion: calm
        - id: ch02-b14
          speaker: narrator
          text: >-
            小公主说到做到。第二天清晨，王子一走出房门，就看见一座比他想象过的任何宫殿都美的建筑。大理石、水晶窗和金屋顶样样齐全，四周的花园里也有溪流与湖泊。科斯切伊瞪着眼前的一切，几乎不敢相信自己的眼睛。他沉思了很久，怎么也想不出这座宫殿究竟是怎样出现的。
        - id: ch02-b15
          speaker: kostiei
          text: >-
            好，这一回是你赢了，可别以为这样就能脱身。明天，我会让十二个女儿并排站在你面前。你若认不出最小的那一个，脑袋就保不住了。
    - id: ch03
      title: 三场考验
      blocks:
        - id: ch03-b01
          speaker: prince
          text: >-
            我怎么会认不出小公主？这也算考验吗？
        - id: ch03-b02
          speaker: narrator
          text: >-
            王子刚回到房间，天花板下那只蜜蜂就接了话。
        - id: ch03-b03
          speaker: youngest_princess
          text: >-
            这件事比你想的难。我们姐妹长得完全一样，连父亲都常常分不清。没有我帮你，你一定会选错。
        - id: ch03-b04
          speaker: prince
          text: >-
            那我要怎么认？
        - id: ch03-b05
          speaker: youngest_princess
          text: >-
            仔细看眼睛。眼皮上停着一只瓢虫的，就是我。千万别看漏了。再会啦。
        - id: ch03-b06
          speaker: narrator
          text: >-
            第二天早晨，科斯切伊又派人召王子过去。十二位年轻公主并排站着，衣裳和打扮分毫不差，眼睛也全都低垂。她们实在太像了，王子看得惊讶不已。他沿着队伍来回走了两遍，始终找不到约好的记号。走到第三遍时，他终于瞧见一个姑娘眼皮上的小斑点，心一下跳得飞快。
        - id: ch03-b07
          speaker: prince
          text: >-
            她就是最小的公主。
        - id: ch03-b08
          speaker: kostiei
          text: >-
            你究竟怎么猜中的？这里面一定有诡计！不过你还是逃不了。三个钟头以后再来。我要点燃一把麦秆，你必须在它烧完以前，把麦秆变成一双靴子。否则，我照样砍你的头！
          emotion: angry
        - id: ch03-b09
          speaker: narrator
          text: >-
            王子垂头丧气地回房，发现蜜蜂已经等在那里。
        - id: ch03-b10
          speaker: youngest_princess
          text: >-
            我英俊的王子，你怎么看起来这么难过？
        - id: ch03-b11
          speaker: prince
          text: >-
            你父亲要我给他做靴子，我还能高兴吗？难道他真把我当鞋匠？
        - id: ch03-b12
          speaker: youngest_princess
          text: >-
            那你准备怎么做？
        - id: ch03-b13
          speaker: prince
          text: >-
            我反正不会做靴子。我也不怕死，谁都只能死一次。
        - id: ch03-b14
          speaker: youngest_princess
          text: >-
            不，你不能死。我会救你。我们一起逃出去，要是逃不掉，就一起死。
        - id: ch03-b15
          speaker: narrator
          text: >-
            公主说着朝地上吐了一口唾沫，拉着王子离开房间。她从外面锁好门，又把钥匙远远扔掉。两人紧握着手，一路回到阳光下，发现自己又站在原来的海边。王子的马还在附近草地上安静地吃草，一看见主人，立刻嘶鸣着飞奔过来。王子片刻也不耽搁，纵身跳上马背，又把公主拉到身后坐好。两人像离弦的箭一样飞驰而去。
    - id: ch04
      title: 逃离科斯切伊
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            最后一场考验的时辰到了，王子却没有出现。科斯切伊派仆人去催。房门锁着，仆人用力敲门，屋里传出王子的声音。其实，那是公主留下的唾沫在模仿他。
        - id: ch04-b02
          speaker: magic_spittle
          text: >-
            马上就好。
        - id: ch04-b03
          speaker: narrator
          text: >-
            科斯切伊听到回话，等了一阵，还是不见王子。他又派仆人去问，屋里的声音再次回答。
        - id: ch04-b04
          speaker: magic_spittle
          text: >-
            立刻就来。
        - id: ch04-b05
          speaker: kostiei
          text: >-
            他竟敢耍我！把门撞开，立刻把他抓来！
          emotion: angry
        - id: ch04-b06
          speaker: narrator
          text: >-
            仆人急忙照办，撞开房门一看，屋里根本没人，只有那口唾沫笑得前仰后合。科斯切伊气得失去理智，立刻命令卫兵骑马追赶逃走的两个人。他还警告他们，要是空手回来，每个人都得拿自己的脑袋赔罪。
        - id: ch04-b07
          speaker: narrator
          text: >-
            这时，王子和公主已经逃出很远，心里正轻松，忽然听见后方传来急促的马蹄。王子下马，把耳朵贴在地上听了听。
        - id: ch04-b08
          speaker: prince
          text: >-
            是追兵，他们赶上来了。
        - id: ch04-b09
          speaker: youngest_princess
          text: >-
            那我们不能再耽搁。
        - id: ch04-b10
          speaker: narrator
          text: >-
            公主说话间便变成一条河，把王子变成横跨河面的桥，又把马变成一只乌鸦。桥另一头的宽阔大路，也被她分成三条小径。士兵赶到桥边，犹犹豫豫地停了下来。眼前三条路一模一样，他们根本不知道逃走的两个人究竟去了哪里。众人只能绝望地放弃追赶，浑身发抖地回去向科斯切伊复命。
        - id: ch04-b11
          speaker: kostiei
          text: >-
            一群蠢货！那条河和那座桥就是他们！你们竟然想不到？马上回去追！
          emotion: angry
        - id: ch04-b12
          speaker: narrator
          text: >-
            士兵像闪电一样策马返回，可他们已经耽误了时间，王子和公主早已跑出老远。过了一会儿，公主又听见马蹄声。
        - id: ch04-b13
          speaker: youngest_princess
          text: >-
            我听见后面有马。
        - id: ch04-b14
          speaker: narrator
          text: >-
            王子再次下马，把耳朵贴到地上。
        - id: ch04-b15
          speaker: prince
          text: >-
            没错，他们离我们不远了。
        - id: ch04-b16
          speaker: narrator
          text: >-
            一转眼，王子、公主和马全都不见了，原地变成一片浓密森林，无数小路在林间纵横交错。士兵匆匆冲进去，以为自己看见那匹驮着两个人的马就在前面逃跑。他们追得越来越近，眼看就要赶上，马、树林和所有景物却忽然一起消失。众人四下一看，竟又回到了原来出发的地方。士兵再没有别的办法，只得回去，把这场新的灾祸告诉科斯切伊。
    - id: ch05
      title: 第一座教堂
      blocks:
        - id: ch05-b01
          speaker: kostiei
          text: >-
            给我备马！这次我亲自去追，他们绝不可能再逃掉！
          emotion: angry
        - id: ch05-b02
          speaker: narrator
          text: >-
            科斯切伊气得口吐白沫，骑马追了出去。远处，公主又听到了追赶的声音。
        - id: ch05-b03
          speaker: youngest_princess
          text: >-
            好像又有人追来了。
        - id: ch05-b04
          speaker: prince
          text: >-
            是的，我也听到了。
        - id: ch05-b05
          speaker: youngest_princess
          text: >-
            这回来的是科斯切伊本人。不过他的法力只能到第一座教堂，再往前就不管用了。快把你的金十字架给我。
        - id: ch05-b06
          speaker: narrator
          text: >-
            王子马上解下母亲临行前送给他的金十字架。公主接过来，急忙把自己变成一座教堂，把王子变成一名神父，又把那匹马变成一座钟楼。这一切才刚刚变好，科斯切伊便骑着马追到了眼前。
        - id: ch05-b07
          speaker: kostiei
          text: >-
            你好，修士。你有没有看见几个骑马的旅人从这里过去？
        - id: ch05-b08
          speaker: prince
          text: >-
            看见了。王子和科斯切伊的女儿刚刚从这里经过。他们进过教堂，还让我遇见你时，代他们向你问好。
        - id: ch05-b09
          speaker: narrator
          text: >-
            科斯切伊听完这番话，终于明白自己已经彻底输了，无论如何也不可能再抓到他们。王子和公主恢复原样，继续踏上归途。此后的路十分平静，他们再也没有遇见任何波折。
