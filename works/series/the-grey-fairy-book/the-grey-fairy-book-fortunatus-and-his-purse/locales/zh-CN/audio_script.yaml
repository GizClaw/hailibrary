audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 亲切从容，带一点温和的诙谐
        timbre: 温暖清晰
        pace: 舒缓
        pitch: 中音
    theodorus:
      display_name: 西奥多鲁斯
      tts:
        delivery: 忧郁诚恳，带着悔意
        timbre: 温厚低沉
        pace: 稍慢
        pitch: 中低音
    fortunatus:
      display_name: 富尔图纳图斯
      tts:
        delivery: 爽朗自信，年轻时略显冲动，年长后沉稳
        timbre: 明亮清晰
        pace: 适中
        pitch: 中音
    dame_fortune:
      display_name: 命运女神
      tts:
        delivery: 神秘庄重，从容而不容置疑
        timbre: 清澈柔和
        pace: 舒缓
        pitch: 中音
    sultan:
      display_name: 苏丹
      tts:
        delivery: 威严好客，谈到宝物时颇为得意
        timbre: 浑厚清晰
        pace: 适中
        pitch: 中低音
  chapters:
    - id: ch01
      title: 家道中落
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            从前，塞浦路斯岛的法马古斯塔城里住着一个富翁，名叫西奥多鲁斯。他想要什么就有什么，还有深爱的妻子和年幼的儿子，本该比谁都幸福。偏偏他对什么都很快厌倦，总要再找新的乐子。这样花用下去，结局不难猜。儿子富尔图纳图斯还不到十岁，家里的钱已经被他花得一枚也不剩了。
        - id: ch01-b02
          speaker: narrator
          text: >-
            西奥多鲁斯总算还没有糊涂到底，立刻出去找活儿。他的妻子也不责骂他，只把仆人遣散，卖掉骏马，自己操持全部家务，连丈夫和孩子的衣服也亲手洗。日子一天天过去，富尔图纳图斯长到了十六岁。一天吃晚饭时，他看出父亲满面愁容，便问出了什么事，还说自己也许能帮忙。
        - id: ch01-b03
          speaker: theodorus
          text: >-
            儿子，我有的是伤心的理由。都是我害了你，不然你现在什么快乐都能享受到，哪会困在这么小的屋子里。
          emotion: sad
        - id: ch01-b04
          speaker: fortunatus
          text: >-
            父亲，别再为这件事难过了。如今我也该自己挣钱。虽然我没学过手艺，总不会什么都做不了。我去海边走走，想想办法。
        - id: ch01-b05
          speaker: narrator
          text: >-
            机会来得比少年料想的还快，他也聪明地抓住了机会。佛兰德斯伯爵招他做了侍童。恰逢伯爵的女儿出嫁，宫中举行盛大庆典，富尔图纳图斯还在几场马上比武中赢了奖。宫里的贵族男女喜欢他讨喜的举止，又送来许多礼物。奖品和馈赠堆在一起，他觉得自己已经十分富有。
        - id: ch01-b06
          speaker: narrator
          text: >-
            他没有因此得意忘形，其他侍童却嫉妒起来。一个名叫罗伯特的侍童想把他赶走，便骗他说，伯爵已经厌恶他，准备杀掉他。富尔图纳图斯信了。他收起钱财和漂亮衣服，趁天没亮悄悄逃出宫廷。
        - id: ch01-b07
          speaker: narrator
          text: >-
            富尔图纳图斯经过许多大城，一路吃好住好。他出手慷慨，又和多数同龄少年一样不大懂得节制，很快便花光了钱。他也像父亲当年那样，到了这时才想到做工。他徒步走过大半个布列塔尼，到处寻找活儿，却始终没有人愿意雇他。他只好从一处流浪到另一处。走着走着，他迷失在一片又密又暗的森林里。林中没有小路，树冠遮住了大半阳光。他转了整整两天，没吃一点东西，只喝到一点水。先朝这边走，再换另一个方向，怎么也找不到出口。
        - id: ch01-b08
          speaker: narrator
          text: >-
            第一夜，他累得倒头就睡，根本顾不上害怕人或野兽。第二次天黑以后，远处传来了野兽的低吼。他慌忙找棵高树，爬到分叉的枝头上躲好。刚刚坐稳，一头狮子便来到树边。那里有股泉水从岩石中涌出来，狮子伏下身，贪婪地喝着。眼前的情形虽然吓人，幸好狮子不会爬树，他只要留在高处就安全。可是狮子才走，一头熊又占了它的位置。熊可是爬树的能手。富尔图纳图斯心跳得飞快，而且怕得很有道理。那熊转身离开时一抬头，果真看见了他。
        - id: ch01-b09
          speaker: narrator
          text: >-
            当时的年轻人个个腰间佩剑，这个风尚恰好救了他。熊爬到离他不到一码的地方时，他拔剑朝前猛刺。熊痛得发狂，想要纵身扑上来，脚下的树枝却承受不住它的重量，咔嚓一声断裂了。熊重重摔到地上。富尔图纳图斯先仔细看过四周，确定没有别的野兽，才爬下树，一剑杀死了它。他正想生起火来，用滋味并不坏的熊肉饱餐一顿，忽然发现身旁站着一位美丽的夫人。她倚着一只轮子，眼睛上蒙着布带。
    - id: ch02
      title: 命运女神的钱袋
      blocks:
        - id: ch02-b01
          speaker: dame_fortune
          text: >-
            我是命运女神，要送你一件礼物。智慧、力量、长寿、财富、健康和美貌，你想要哪一样？仔细想过再回答。
        - id: ch02-b02
          speaker: narrator
          text: >-
            饿着肚子的人，哪里想得出高明的主意。富尔图纳图斯刚刚亲身体会到这句话的道理，马上作出了选择。
        - id: ch02-b03
          speaker: fortunatus
          text: >-
            好夫人，请给我多得用不完的财富吧。这样我再也不会像现在一样挨饿了。
        - id: ch02-b04
          speaker: narrator
          text: >-
            命运女神递给他一个钱袋。只要把手伸进去，他和他的子孙每次都能摸出十枚金币。等他们全都离开人世，钱袋才会失去魔力。富尔图纳图斯高兴得几乎说不出感谢的话。女神却告诉他，眼下最要紧的是先离开森林。临别时，她替他指明了该走的道路。
        - id: ch02-b05
          speaker: narrator
          text: >-
            他拖着虚弱的身体，沿小路尽力往前走。终于，前方出现一点叫人安心的灯光，附近一定有人家。那是一间客栈。进去之前，他想先试试女神的话，便取出钱袋向里面看。十枚亮闪闪的金币果然躺在那里。他顿时有了底气，大步走进客栈，叫人马上备一顿丰盛的晚饭。他已经饿坏了，还要店里拿出最好的酒。他花钱毫不在意，众人都以为来了位大贵族。每当他开口召唤，人人都抢着上前，看谁跑得最快。
        - id: ch02-b06
          speaker: narrator
          text: >-
            在软床上舒舒服服地睡过一晚，他的精神好多了，便请店主帮忙找几个男仆，再指点他去哪里能买到好马。他又为自己置办一身华服，租下一座大宅，设宴款待附近宫殿里的贵族和美丽夫人。转眼间，一年过去了。他只顾享乐，一次也没想起远在塞浦路斯的父母。
        - id: ch02-b07
          speaker: narrator
          text: >-
            富尔图纳图斯虽然轻率，心却不坏。父母一旦浮现在脑海中，他立刻准备回家探望。他不喜欢独自旅行，想找个年长又有见识的人陪伴。很快，他遇见一位老人。老人多年前告别远方的妻儿，走进世界寻找财富，可那份财富始终没有找到。他答应陪富尔图纳图斯去塞浦路斯，不过有个条件。那个岛屿陌生又遥远，在冒险出海以前，必须让他先回自己家住几个星期。富尔图纳图斯一向喜欢新鲜事，欣然同意和他一起回去。
        - id: ch02-b08
          speaker: narrator
          text: >-
            这一路长得很。两人渡过许多条大河，翻越一座座高山，又穿过茂密的森林，最后才抵达老人的城堡。老人的妻子和儿女早已几乎不抱重逢的希望，如今见他回来，全都激动地拥到他身边。不到五分钟，富尔图纳图斯就爱上了老人最小的女儿卡桑德拉。她是世上最美丽的姑娘。
        - id: ch02-b09
          speaker: fortunatus
          text: >-
            请把卡桑德拉嫁给我吧。以后我们大家一起去法马古斯塔生活。
        - id: ch02-b10
          speaker: narrator
          text: >-
            他们买下一艘大船，足够坐下富尔图纳图斯、老人夫妇和他们的十个孩子，也就是五个儿子和五个女儿。启航前一天，婚礼办得盛大而热闹，处处都是欢声笑语。宾客们都猜新郎准是一位隐瞒身份的王子。可到了塞浦路斯，富尔图纳图斯才悲伤地得知，父母已经去世，也已经下葬。他羞愧自己多年来把双亲忘得一干二净，关在屋里，很久不肯见人。后来，他恳求老人夫妇留下来，从此代替自己的父母。
    - id: ch03
      title: 再游世界
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            此后十二年，富尔图纳图斯和卡桑德拉带着两个小儿子，在法马古斯塔过着幸福的日子。他们住在漂亮的大宅里，凡是可能想要的东西，一样也不缺。卡桑德拉的姐妹们出嫁时，钱袋还为每个人送上了一份嫁妆。后来，富尔图纳图斯又厌倦了待在家中，想去看看外面的世界。卡桑德拉刚听他说起这个愿望时，流了许多眼泪。他费了很大力气劝说，又答应两年后一定回来，才终于得到她的同意。
        - id: ch03-b02
          speaker: narrator
          text: >-
            临走前，他让妻子看了三箱金子。箱子全都放在一个格外牢固的房间里。那里装着一扇铁门，四面的墙足足有十二英尺厚。
        - id: ch03-b03
          speaker: fortunatus
          text: >-
            如果我遇到意外，再也回不来了，你就留下一箱金子，另外两箱分别交给我们的两个儿子。
        - id: ch03-b04
          speaker: narrator
          text: >-
            富尔图纳图斯拥抱妻儿，登船驶向亚历山大港。一路顺风，几天后船便进了港。他上岸时，有人提醒他，要想在城里受到礼遇，得先送苏丹一份厚礼。
        - id: ch03-b05
          speaker: fortunatus
          text: >-
            这件事容易。
        - id: ch03-b06
          speaker: narrator
          text: >-
            他走进金匠铺，买下一只价值五千英镑的大金杯。苏丹收到这份礼物十分高兴，下令回赠一百桶香料。富尔图纳图斯把香料全都装上自己的船，命船长返回塞浦路斯，亲手交给卡桑德拉。随后，他得到苏丹接见，请求准许自己游历这个国家。苏丹爽快地答应，还写了几封信，让他带给沿途想拜访的其他国土的统治者。
        - id: ch03-b07
          speaker: narrator
          text: >-
            富尔图纳图斯又能自由周游世界了，欢喜得一天也不愿多等。他从一座宫廷走到另一座宫廷。华贵无比的衣饰和豪奢惊人的礼物，让所到之处的每个人都赞叹不已。终于，他对漫游也感到了厌倦，就像从前厌倦居家一样。他返回亚历山大港，发现当初载他离开塞浦路斯的那艘船正停在那里。他到港后的第一件事，当然是去向苏丹致意。苏丹也急着听他一路经历了什么。
    - id: ch04
      title: 神奇的红帽子
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            富尔图纳图斯讲完旅途中的种种奇遇，苏丹听了，便要给他看一件更奇妙的东西。
        - id: ch04-b02
          speaker: sultan
          text: >-
            你见过的奇事确实不少。不过我这里有一样东西，比那些都更神奇。
        - id: ch04-b03
          speaker: narrator
          text: >-
            苏丹领他走进一个房间。珍贵的宝石沿着墙壁堆成小山，光芒耀得富尔图纳图斯眼花缭乱。苏丹没有停步，一直走到房间另一头，打开那里的一扇门。富尔图纳图斯尽力往里面看，只见柜子里空空荡荡，除了一顶土耳其士兵常戴的红色小帽，什么也没有。
        - id: ch04-b04
          speaker: sultan
          text: >-
            你看看它。
        - id: ch04-b05
          speaker: fortunatus
          text: >-
            这帽子看起来没什么贵重的。单是今天，我就见过十来顶比它更好的。
        - id: ch04-b06
          speaker: sultan
          text: >-
            你这么说，是因为不知道它有什么本领。谁把它戴到头上，再想一想要去的地方，眨眼间就能到达那里。
        - id: ch04-b07
          speaker: fortunatus
          text: >-
            这顶帽子是谁做的？
        - id: ch04-b08
          speaker: sultan
          text: >-
            那我就不知道了。
        - id: ch04-b09
          speaker: fortunatus
          text: >-
            它戴起来沉不沉？
        - id: ch04-b10
          speaker: sultan
          text: >-
            一点儿也不沉。你亲手试试吧。
        - id: ch04-b11
          speaker: narrator
          text: >-
            富尔图纳图斯接过帽子戴在头上，根本没有细想，便希望自己回到那艘正要开往法马古斯塔的船上。只用了一瞬间，他已经站在船头，水手们正在起锚。苏丹还留在宫中，为自己一时糊涂、竟让富尔图纳图斯试戴帽子而懊悔，那艘船却早已全速驶向塞浦路斯了。
    - id: ch05
      title: 最后的嘱托
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: >-
            船回到塞浦路斯，富尔图纳图斯见妻子和孩子都平安无事，两位老人却已离世下葬。两个儿子长得高大强壮，但他们不像父亲，并不想周游世界，最大的乐趣只是打猎和马上比武。富尔图纳图斯大多数时候也愿意安静地留在家里。偶尔又起了远游的念头，他就戴上帽子离开几个小时，还没等家人发觉便能回来。当然，他一直没有把这件宝物送还苏丹。
        - id: ch05-b02
          speaker: narrator
          text: >-
            一年又一年，富尔图纳图斯渐渐老了。他感觉自己已经没有多少日子可活，便把两个儿子一同叫到身边。他拿出那个永远装着金币的钱袋，又拿出能把人送往任何地方的红帽子，给他们看过以后，留下最后的嘱托。
        - id: ch05-b03
          speaker: fortunatus
          text: >-
            永远不要丢掉这两件宝物。它们比我留下的所有金子和土地都珍贵。也绝不能把秘密说出去，哪怕面对自己的妻子，或是最亲密的朋友。这个钱袋已经帮了我四十年，可从来没有人知道我的财富从哪里来。
        - id: ch05-b04
          speaker: narrator
          text: >-
            说完这些话不久，富尔图纳图斯便去世了。卡桑德拉亲手安葬了丈夫。此后许多年里，法马古斯塔的人们一直为他哀悼。
