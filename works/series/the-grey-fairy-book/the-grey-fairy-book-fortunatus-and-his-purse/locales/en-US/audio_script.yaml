  chapters:
    - id: ch01
      title: Theodorus Loses His Fortune
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Long ago, in Famagosta on the island of Cyprus, there lived a rich man named Theodorus. He had everything he could ask for. He had a wife he loved and a little son named Fortunatus. Yet nothing pleased him for long. He was always searching for some new amusement. People who live that way often come to the same end. By the time Fortunatus was ten, every bit of the family money was gone.
        - id: ch01-b02
          speaker: narrator
          text: Theodorus had behaved foolishly, but he still had enough sense to look for work. His wife did not scold him. She dismissed the servants, sold the fine horses, and took care of the whole house herself. She even washed the clothes that her husband and child wore.
        - id: ch01-b03
          speaker: narrator
          text: Six years went by. One evening, as the family sat at supper, Fortunatus saw the sadness on his father's face.
        - id: ch01-b04
          speaker: fortunatus
          text: Father, why are you so unhappy? Tell me what's troubling you. Maybe I can help.
        - id: ch01-b05
          speaker: theodorus
          text: I have good reason to feel sad, my son. If it weren't for me, you could be enjoying every pleasure in the world. Instead, you have to live shut away in this tiny house.
          emotion: sad
        - id: ch01-b06
          speaker: fortunatus
          text: Please don't worry about that. I'm old enough to earn my own money now. I never learned a trade, but there must be some work I can do. I'll walk along the shore and think it over.
        - id: ch01-b07
          speaker: narrator
          text: An opportunity came sooner than Fortunatus expected, and he was wise enough to take it. He became a page to the Earl of Flanders. The earl's daughter was about to be married, so the court held splendid celebrations for her. Fortunatus entered some of the tilting matches and won prizes. The lords and ladies liked his pleasant manner and gave him gifts as well. Before long, he felt rich.
        - id: ch01-b08
          speaker: narrator
          text: Their attention did not make Fortunatus vain, but it did make some of the other pages jealous. One page, Robert, wanted him gone. He told Fortunatus that the earl had begun to hate him and planned to have him killed. Fortunatus believed the lie. Before sunrise, he packed his fine clothes and money and quietly escaped.
        - id: ch01-b09
          speaker: narrator
          text: Fortunatus traveled through one great town after another and spent freely wherever he went. He was generous, and no wiser with money than most young men. Soon he had nothing left. Like his father before him, he went looking for work. He walked across half of Brittany, but no one wanted to hire him.
    - id: ch02
      title: Dame Fortune's Gift
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: As Fortunatus wandered from place to place, he entered a thick forest. There were no paths, and hardly any daylight reached the ground. For two days he searched for a way out. He had no food and very little water. First he went one way, then he turned and tried another, but the forest always seemed to close around him again.
        - id: ch02-b02
          speaker: narrator
          text: On the first night, weariness made him sleep too deeply to fear any man or beast. On the second night, he heard growls far away in the darkness. Frightened now, he found a tall tree and climbed beyond the reach of anything below.
        - id: ch02-b03
          speaker: narrator
          text: He had barely settled into a fork between the branches when a lion came to a spring beside the tree. Water burst there from a rock, and the lion crouched to drink. The sight was terrible, but Fortunatus knew that lions could not climb. As long as he stayed where he was, he would be safe.
        - id: ch02-b04
          speaker: narrator
          text: Then the lion went away, and a bear took its place. Bears could climb trees. Fortunatus knew that very well. His heart began to pound. As the bear turned from the spring, it looked up and saw him.
        - id: ch02-b05
          speaker: narrator
          text: Young men in those days wore swords at their belts, and Fortunatus was glad of the custom. He drew his sword. When the bear came within a yard, Fortunatus thrust the blade at it with all his strength. Mad with pain, the bear tried to leap. The branch under it snapped beneath its weight, and the animal crashed to the ground.
        - id: ch02-b06
          speaker: narrator
          text: Fortunatus looked carefully for any other wild beasts. When he saw none, he climbed down and killed the bear with one blow. Bear meat was considered good food, and after two hungry days, he was ready for a hearty dinner. He was about to make a fire when a beautiful lady appeared beside him. She leaned upon a wheel, and a bandage covered her eyes.
        - id: ch02-b07
          speaker: dame_fortune
          text: I am Dame Fortune, and I have come to give you a gift. You may choose wisdom, strength, long life, riches, health, or beauty. Think carefully. Which one do you want?
        - id: ch02-b08
          speaker: narrator
          text: Fortunatus had learned how hard it was to think on an empty stomach. So he answered at once.
        - id: ch02-b09
          speaker: fortunatus
          text: Good lady, give me so much wealth that I will never suffer hunger like this again.
        - id: ch02-b10
          speaker: narrator
          text: Dame Fortune held out a purse. She told him that whenever he reached inside, he would find ten gold pieces. His children would find them too, for as long as they lived. After their deaths, the purse would lose its magic.
        - id: ch02-b11
          speaker: narrator
          text: Fortunatus was so overjoyed that he could scarcely thank her. Dame Fortune told him that the wisest thing now was to leave the forest. Before saying farewell, she showed him the path he must follow.
        - id: ch02-b12
          speaker: narrator
          text: Weak as he was, Fortunatus hurried along the path. Soon he saw a welcoming light and found an inn. Before he went inside, he opened the purse to test Dame Fortune's promise. Ten bright gold pieces lay within it.
        - id: ch02-b13
          speaker: narrator
          text: Fortunatus strode into the inn and ordered a fine supper at once, along with the best wine in the house. He spent so easily that everyone took him for a great lord. Each servant tried to be the quickest whenever he called.
        - id: ch02-b14
          speaker: narrator
          text: After sleeping in a soft bed, he felt much stronger. He asked the innkeeper to find him servants and good horses. Then he bought handsome clothes and rented a large house, where he gave grand feasts for the nobles and beautiful ladies who lived nearby.
    - id: ch03
      title: The Old Traveler's Home
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: A whole year passed this way. Fortunatus was so busy enjoying himself that he never thought about the parents he had left in Cyprus. He was thoughtless, but he was not hardhearted. The moment he remembered them, he began making plans to go home.
        - id: ch03-b02
          speaker: narrator
          text: Fortunatus did not like traveling alone. He searched for an older, wiser companion and soon met an old man who had left his own wife and children in a distant country. Many years earlier, the man had gone into the world to seek his fortune, but he had never found it.
        - id: ch03-b03
          speaker: old_man
          text: I will travel with you to Cyprus, but first I must spend a few weeks at home with my family. After that, I'll be ready to sail to an island so far away and strange to me.
        - id: ch03-b04
          speaker: narrator
          text: Fortunatus agreed. Anything new appealed to him, so he decided to go home with the old traveler.
        - id: ch03-b05
          speaker: narrator
          text: Their journey took them over high mountains, across wide rivers, and through deep forests. At last they reached the old man's castle. His wife and children had nearly given up hope that he would ever return. Now they pressed eagerly around him.
        - id: ch03-b06
          speaker: narrator
          text: In less than five minutes, Fortunatus fell in love with the youngest daughter. Her name was Cassandra, and to him she seemed the most beautiful creature in the world.
        - id: ch03-b07
          speaker: fortunatus
          text: Let Cassandra become my wife, and then all of you can come with us to Famagosta.
        - id: ch03-b08
          speaker: narrator
          text: They bought a ship large enough for Fortunatus, the old man and his wife, and all ten of their children, five sons and five daughters. The day before they sailed, Fortunatus and Cassandra were married amid magnificent celebrations. Everyone was certain that the bridegroom must be a prince in disguise.
    - id: ch04
      title: Home in Famagosta
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: When the ship reached Cyprus, sorrow was waiting for Fortunatus. His father and mother had both died. Ashamed that he had forgotten them for so many years, he shut himself inside his house and refused to see anyone for a long while.
        - id: ch04-b02
          speaker: narrator
          text: At last, Fortunatus came out of his solitude. He asked Cassandra's father and mother to stay with him and take the place of the parents he had lost.
        - id: ch04-b03
          speaker: narrator
          text: For twelve years, Fortunatus and Cassandra lived happily in Famagosta with their two little boys. They owned a beautiful house and had everything they could want. When Cassandra's sisters married, the magic purse supplied a fortune for every one of them.
        - id: ch04-b04
          speaker: narrator
          text: In time, Fortunatus grew weary of staying home. He longed to see the world again. When he told Cassandra, she wept many tears. It took all his persuasion before she would consent to let him leave.
        - id: ch04-b05
          speaker: fortunatus
          text: I promise I will come home when two years have passed.
        - id: ch04-b06
          speaker: narrator
          text: With that promise, Cassandra agreed. Before Fortunatus left, he took her to a room behind an iron door and walls twelve feet thick. Three chests of gold stood inside.
        - id: ch04-b07
          speaker: fortunatus
          text: If something happens to me and I never return, keep one chest for yourself. Give the other two to our sons.
        - id: ch04-b08
          speaker: narrator
          text: Then Fortunatus embraced Cassandra and the boys, boarded a ship, and sailed for Alexandria.
    - id: ch05
      title: The Sultan of Alexandria
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: A fair wind carried the ship into Alexandria's harbor within a few days. When Fortunatus stepped ashore, a man offered him some useful advice.
        - id: ch05-b02
          speaker: traveler
          text: If you want the people of this city to welcome you, begin by giving the Sultan a handsome present.
        - id: ch05-b03
          speaker: fortunatus
          text: That will be easy enough.
        - id: ch05-b04
          speaker: narrator
          text: Fortunatus entered a goldsmith's shop and bought an enormous golden cup worth five thousand pounds. The Sultan was so pleased with the gift that he gave Fortunatus a hundred casks of spices in return.
        - id: ch05-b05
          speaker: narrator
          text: Fortunatus loaded the spices onto his ship and ordered the captain to carry them back to Cassandra in Cyprus. Then he met with the Sultan and asked for permission to travel through the country. The Sultan gladly granted it. He also gave Fortunatus letters for the rulers of any other lands he might visit.
        - id: ch05-b06
          speaker: narrator
          text: Fortunatus was delighted to be free to roam the world once more. He began his journey without wasting a day. The Sultan's letters opened the way as he moved from one ruler's court to the next. Everywhere, he amazed people with his splendid clothes and costly gifts.
        - id: ch05-b07
          speaker: narrator
          text: At last, wandering tired him just as staying home had tired him before. He returned to Alexandria and found the same ship that had carried him from Cyprus waiting in the harbor. His first duty was to visit the Sultan, who was eager to hear about all he had seen.
        - id: ch05-b08
          speaker: narrator
          text: Fortunatus told the Sultan the whole tale of his travels. When he had finished, the Sultan smiled.
        - id: ch05-b09
          speaker: sultan
          text: You have seen many marvelous things. But I can show you something more marvelous than any of them.
    - id: ch06
      title: The Wishing Cap
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: The Sultan led Fortunatus into a room where precious stones were piled against the walls. Their brilliance dazzled him. Without stopping, the Sultan crossed the room and opened a door at the far end.
        - id: ch06-b02
          speaker: narrator
          text: Inside was a cupboard that looked empty except for one small red cap, the kind worn by Turkish soldiers.
        - id: ch06-b03
          speaker: sultan
          text: Take a look at this.
        - id: ch06-b04
          speaker: fortunatus
          text: I don't see anything valuable about that cap. I've passed a dozen finer ones today.
        - id: ch06-b05
          speaker: sultan
          text: Then you don't know what it can do. Put it on, wish to be somewhere, and in that very moment you will be there.
        - id: ch06-b06
          speaker: fortunatus
          text: Who made such a cap?
        - id: ch06-b07
          speaker: sultan
          text: I cannot tell you that.
        - id: ch06-b08
          speaker: fortunatus
          text: Does it feel heavy on your head?
        - id: ch06-b09
          speaker: sultan
          text: No, it is very light. Try it and see.
        - id: ch06-b10
          speaker: narrator
          text: Fortunatus took the cap and placed it on his head. Without pausing to think, he wished himself aboard the ship that was leaving for Famagosta.
        - id: ch06-b11
          speaker: narrator
          text: One instant later, he stood at the ship's prow as the sailors raised the anchor. Back in the palace, the Sultan bitterly regretted letting Fortunatus try the cap. But the ship was already speeding toward Cyprus.
    - id: ch07
      title: Fortunatus Comes Home
      blocks:
        - id: ch07-b01
          speaker: narrator
          text: Fortunatus reached home and found Cassandra and the children well. The old traveler and his wife, however, had both died and been buried. Fortunatus's sons were now tall and strong. They did not share their father's desire to see the world. Hunting and tilting gave them all the pleasure they wanted.
        - id: ch07-b02
          speaker: narrator
          text: For the most part, Fortunatus was content to live quietly at home. Whenever restlessness came over him, he could put on the cap and go away for a few hours without anyone missing him. He never returned it to the Sultan.
        - id: ch07-b03
          speaker: narrator
          text: Years passed, and Fortunatus grew old. When he knew that little time remained to him, he called his two sons to his side and showed them the purse and the cap.
        - id: ch07-b04
          speaker: fortunatus
          text: Never give away these precious things. They are worth more than all the lands and gold I leave you. Never reveal their secret, not even to your wife or your closest friend. This purse has served me for forty years, and no one has ever learned where my wealth came from.
        - id: ch07-b05
          speaker: narrator
          text: Then Fortunatus died. Cassandra buried him, and the people of Famagosta mourned him for many years.
