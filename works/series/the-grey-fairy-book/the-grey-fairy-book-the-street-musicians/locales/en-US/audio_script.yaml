  chapters:
    - id: ch01
      title: Four Runaways
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: A man once owned a donkey who had worked faithfully for him over many years. At last the poor animal grew old and weak, and each day's labor became harder to carry. His master believed the donkey was no longer any use and decided to shoot him. When the donkey learned the fate waiting for him, he chose not to stay and die. He ran away toward the nearest town, where he planned to earn his living as a street musician.
        - id: ch01-b02
          speaker: narrator
          text: After trotting some distance, he found a greyhound stretched out on the road, panting for dear life. The donkey stopped beside him.
        - id: ch01-b03
          speaker: donkey
          text: Well, brother, what's wrong? You look worn out.
        - id: ch01-b04
          speaker: dog
          text: I am. I'm getting older and weaker every day, and I can't go hunting anymore. Because of that, my master wanted to poison me. Life is still sweet to me, so I took my leave of him. But I have no idea how I'll earn my own living now.
        - id: ch01-b05
          speaker: donkey
          text: I'm going to the nearest big town to be a street musician. Why not make music for a living and come with me? I'll play the flute, and you can play the kettle-drum.
        - id: ch01-b06
          speaker: narrator
          text: The greyhound liked that idea very much, and the two went on together. Before long, they met a cat whose face looked as long as three rainy days.
        - id: ch01-b07
          speaker: donkey
          text: Friend puss, what's happened to make you so unhappy?
        - id: ch01-b08
          speaker: cat
          text: How can I look cheerful when I feel this low? I'm old now, and most of my teeth are gone. I'd rather sit by the fire than catch mice, so my old mistress tried to drown me. I don't want to die yet, and that's why I ran away. But good advice is hard to find. I don't know where to go or what to do.
          emotion: sad
        - id: ch01-b09
          speaker: donkey
          text: Come with us to the nearest big town and try your luck as a street musician. I've heard the sweet music you make at night. You're sure to do well.
        - id: ch01-b10
          speaker: narrator
          text: The cat was delighted by the proposal, so all three continued on their way. Soon they reached the courtyard of an inn. There they found a cock crowing with all his strength.
        - id: ch01-b11
          speaker: donkey
          text: What in the world is wrong with you? That noise is enough to burst our eardrums.
        - id: ch01-b12
          speaker: cock
          text: I'm only promising good weather for tomorrow. But tomorrow is also a feast day, and the inn expects a great many people. Just because it's a holiday and guests are coming, the landlady has ordered them to wring my neck tonight. She means to have me made into soup for tomorrow's dinner.
        - id: ch01-b13
          speaker: donkey
          text: Listen, redcap. You'd be much better off coming to the nearest town with us. You have a fine voice, and you can join the street band we're putting together.
        - id: ch01-b14
          speaker: narrator
          text: The cock was very pleased with the idea, and the four travelers set out together.
    - id: ch02
      title: A Light in the Wood
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: The nearest big town lay far away, and they could not reach it in a single day. That evening they entered a wood and decided to spend the night there. The donkey and the greyhound settled under a large tree. The cat and the cock climbed into its branches. The cock flew all the way to the highest twig, where he thought no danger could reach him.
        - id: ch02-b02
          speaker: narrator
          text: Before going to sleep, the cock looked toward all four points of the compass. Far away, he saw one small spark burning in the darkness. He called down to his companions that a house must be nearby, because a light was shining there.
        - id: ch02-b03
          speaker: cock
          text: I can see a light shining in the distance.
        - id: ch02-b04
          speaker: donkey
          text: Then let's get up and find that house. This shelter is very poor.
        - id: ch02-b05
          speaker: dog
          text: Yes. A few bones and a scrap or two of meat would do me good.
        - id: ch02-b06
          speaker: narrator
          text: They set out for the place where the light glimmered faintly in the distance. As they drew closer, it grew brighter and brighter. At last they stood before a brilliantly lit house. The donkey was the largest of the four, so he went to the window and looked inside for the others.
        - id: ch02-b07
          speaker: cock
          text: Well, greyhead, what can you see?
        - id: ch02-b08
          speaker: donkey
          text: There's a table covered with excellent food and drink. A band of robbers is sitting around it and having a wonderful time.
        - id: ch02-b09
          speaker: cock
          text: I wish we were enjoying it instead.
        - id: ch02-b10
          speaker: donkey
          text: So do I. There must be some way to drive those robbers out and take the house for ourselves.
        - id: ch02-b11
          speaker: narrator
          text: The animals put their heads together and formed a plan. The donkey placed his front feet on the windowsill. The greyhound climbed onto his back, the cat stood on the dog's shoulders, and the cock perched on the cat's head.
    - id: ch03
      title: The Robbers Flee
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: Once they were all in place, they waited for their signal. Then each began making music in his own way.
        - id: ch03-b02
          speakers: [donkey, dog, cat, cock]
          ensemble: chorus
          text: Hee-haw! Woof! Meow! Cock-a-doodle-doo!
        - id: ch03-b03
          speaker: narrator
          text: Still braying, barking, meowing, and crowing, they scrambled through the window into the room. The glass broke into a thousand pieces around them. The robbers jumped at the dreadful noise. They were sure that evil spirits, at the very least, were bursting into the house. With their hair standing on end from terror, they rushed out into the wood.
        - id: ch03-b04
          speaker: narrator
          text: The four companions were delighted that their trick had worked so well. They took the robbers' places at the well-covered table, then ate the food and drank the wine their frightened hosts had left behind.
        - id: ch03-b05
          speaker: narrator
          text: When the meal was over, they put out the lights. Then each animal chose a place that suited him for the night. The donkey lay in the courtyard outside. The dog curled up behind the door. The cat settled in front of the fire, and the cock flew onto a high shelf. Their long day had tired them all, and soon they were asleep.
    - id: ch04
      title: The Robber Returns
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: A little after midnight, the robbers looked toward the house. No light was burning there, and everything seemed quiet once more. Their captain began to think they had fled too quickly, and he spoke to the others.
        - id: ch04-b02
          speaker: robber_captain
          text: We were fools to let ourselves be frightened away so easily.
        - id: ch04-b03
          speaker: narrator
          text: Then the captain turned to one of his men and ordered him to go back alone and find out whether the house was safe.
        - id: ch04-b04
          speaker: narrator
          text: The robber found the house completely dark and silent. He crept into the kitchen and thought he had better strike a light before going farther. In the darkness, the cat's fiery eyes looked exactly like two glowing coals. He took out a match and held it to her eyes, expecting it to catch fire.
        - id: ch04-b05
          speaker: narrator
          text: The cat did not find this funny at all. She sprang at his face, spitting and scratching as hard as she could. The terrified man rushed for the back door, but he tripped over the greyhound, who bit him in the leg. He ran yelling across the courtyard, straight past the donkey. The donkey kicked him with a hind leg. Meanwhile, all the noise had woken the cock. Feeling wonderfully cheerful, he called from his shelf.
        - id: ch04-b06
          speaker: cock
          text: Cock-a-doodle-doo!
          emotion: happy
        - id: ch04-b07
          speaker: narrator
          text: The robber fled back to his captain as fast as he could.
        - id: ch04-b08
          speaker: robber
          text: Sir, there's a dreadful witch in that house! She spat at me and tore my face with her long fingers. A man with a long knife was waiting by the door, and he slashed my leg. Then a black monster in the courtyard struck me with a huge wooden club. And up on the roof sat a judge, shouting, “Bring the rascal to me!” I ran for my life!
          emotion: fearful
    - id: ch05
      title: A Home for the Musicians
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: After hearing that story, the robbers did not dare enter the house again. They abandoned it forever.
        - id: ch05-b02
          speaker: narrator
          text: But the four street musicians liked their new lodging so much that they decided to make the robbers' house their home.
        - id: ch05-b03
          speaker: narrator
          text: And for all I know, they may be living there to this very day.
