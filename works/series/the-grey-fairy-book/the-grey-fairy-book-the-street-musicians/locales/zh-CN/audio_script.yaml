audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 亲切从容，保留古老童话的神秘感
        timbre: 温暖清晰
        pace: 舒缓
        pitch: 中音
    donkey:
      display_name: 驴
      tts:
        delivery: 直爽乐观，遇事很有主意
        timbre: 粗厚明亮
        pace: 适中
        pitch: 中低音
    greyhound:
      display_name: 猎犬
      tts:
        delivery: 忠厚疲惫，说话朴实诚恳
        timbre: 低沉沙哑
        pace: 稍慢
        pitch: 低音
    cat:
      display_name: 猫
      tts:
        delivery: 敏锐清醒，略带忧郁和自尊
        timbre: 柔和清亮
        pace: 适中
        pitch: 中高音
    cock:
      display_name: 公鸡
      tts:
        delivery: 响亮爽快，天生带着昂扬劲头
        timbre: 高亢清脆
        pace: 明快
        pitch: 高音
    robber_captain:
      display_name: 强盗头子
      tts:
        delivery: 粗暴专横，强装镇定
        timbre: 浑厚冷硬
        pace: 稳健
        pitch: 低音
    robber:
      display_name: 强盗
      tts:
        delivery: 粗野胆小，受惊后语速急促
        timbre: 粗粝紧张
        pace: 偏快
        pitch: 中音
  chapters:
    - id: ch01
      title: 四位逃亡者
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            从前，有头驴忠心耿耿地替主人干了许多年。后来它老了，身子也弱了，每天的活儿都压得它越来越吃力。主人觉得它再也没了用处，竟打算开枪打死它。驴知道等待自己的是什么，不肯留下来等死。它逃出家门，要到最近的城里去当街头乐师。
        - id: ch01-b02
          speaker: narrator
          text: >-
            驴小跑了一程，看见一条猎犬瘫在路边，喘得几乎接不上气。
        - id: ch01-b03
          speaker: donkey
          text: >-
            老兄，你这是怎么了？瞧你累成这样。
        - id: ch01-b04
          speaker: greyhound
          text: >-
            我的确累坏了。我年纪大了，力气一天不如一天，再也不能跟着主人出去打猎。他便想毒死我。可活着还是好，我只好向他告别，自己逃了出来。如今该靠什么养活自己，我连一点主意也没有。
        - id: ch01-b05
          speaker: donkey
          text: >-
            那就跟我走吧。我正要去大城里当街头乐师。你也来做音乐这一行。我吹长笛，你敲定音鼓，咱们一起谋生。
        - id: ch01-b06
          speaker: narrator
          text: >-
            猎犬很喜欢这个主意，便和驴结伴上路。没走多久，它们又遇见一只猫。那张脸拉得老长，简直像连下了三天的雨。
        - id: ch01-b07
          speaker: donkey
          text: >-
            猫朋友，什么事把你的快活劲儿全赶跑了？
        - id: ch01-b08
          speaker: cat
          text: >-
            心里发愁，哪里还笑得出来？我老了，牙也快掉光了。如今比起追老鼠，我更愿意坐在炉火前暖和暖和。老女主人因此要把我淹死。我还不想死，只好从她那里逃出来。可想个好主意哪有那么容易，我该去哪儿、该做什么，全都拿不定主意。
          emotion: sad
        - id: ch01-b09
          speaker: donkey
          text: >-
            和我们一起进城吧。你夜里唱得那么好听，当街头乐师一定能闯出名堂。
        - id: ch01-b10
          speaker: narrator
          text: >-
            猫高高兴兴地加入了它们。三个伙伴很快来到一家客店的院子，只见一只公鸡正拼命啼叫，嗓门大得惊人。
        - id: ch01-b11
          speaker: donkey
          text: >-
            你到底出了什么事？再这样叫下去，我们的耳朵都要让你震聋了。
        - id: ch01-b12
          speaker: cock
          text: >-
            我只是在预报明天的好天气。明天过节，客店会来许多人。老板娘已经吩咐今晚扭断我的脖子，好拿我给明天的宴席做汤。
        - id: ch01-b13
          speaker: donkey
          text: >-
            红冠子，别留在这儿了，跟我们进城吧。你的嗓子这么响亮，正适合加入我们的街头乐队。
        - id: ch01-b14
          speaker: narrator
          text: >-
            公鸡觉得这个安排再好不过。于是，四个伙伴一同离开客店，朝那座大城继续赶路。
    - id: ch02
      title: 林中的灯光
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            大城离得太远，它们走了一整天也没有赶到。傍晚，四个伙伴来到一片树林，决定不再往前，就在这里过夜。驴和猎犬睡在一棵大树底下，猫和公鸡爬上树枝。公鸡一直飞到最顶端的细枝上，觉得那里什么危险也伤不到它。临睡前，它朝四面八方望了一圈，忽然发现远处有一点火星在闪。
        - id: ch02-b02
          speaker: cock
          text: >-
            伙伴们，那边有灯！附近一定有房子。
        - id: ch02-b03
          speaker: donkey
          text: >-
            那就赶快起来，咱们去找找看。这里实在不是什么好住处。
        - id: ch02-b04
          speaker: greyhound
          text: >-
            对。要是那儿有几根骨头，再有一两块肉，我这身子准会舒服不少。
        - id: ch02-b05
          speaker: narrator
          text: >-
            它们离开树林，朝那点微弱的光走去。每靠近一步，灯光就亮一些。最后，一所灯火通明的房子出现在眼前。驴在四个伙伴里个头最高，便走到窗前，探头向屋里仔细张望。
        - id: ch02-b06
          speaker: cock
          text: >-
            灰脑袋，里面有什么？
        - id: ch02-b07
          speaker: donkey
          text: >-
            桌上摆满了好酒好菜。几个强盗正围在那里，吃喝得快活极了。
        - id: ch02-b08
          speaker: cock
          text: >-
            要是坐在桌边的是我们，那该多好。
        - id: ch02-b09
          speaker: donkey
          text: >-
            我也想进去。咱们得想个办法，把强盗赶走，把这所房子占下来。
    - id: ch03
      title: 一场可怕的音乐会
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            四个伙伴凑在一起商量了一阵，终于想出妙计。驴把两只前蹄搭上窗台，猎犬爬到驴背上，猫又蹲上猎犬的肩头，公鸡最后站到了猫头顶。等它们一个叠一个稳稳站好，约定的信号一响，奇怪的音乐会便开始了。
        - id: ch03-b02
          speaker: narrator
          text: >-
            驴嘶鸣，猎犬狂吠，猫扯着嗓子叫，公鸡放声啼。四种声音一起冲进屋里。接着，它们猛然跃过窗户，把玻璃撞成无数碎片，也一齐闯进了房间。
        - id: ch03-b03
          speaker: narrator
          text: >-
            强盗们哪受得住这番动静。他们以为闯进来的至少也是一群恶鬼，吓得头发都竖了起来，转身逃进树林。四个伙伴见自己的计策大获成功，高兴极了。它们立刻围桌坐下，把强盗留下的食物和美酒全都吃喝得一干二净。
        - id: ch03-b04
          speaker: narrator
          text: >-
            吃饱以后，它们吹灭灯火，各自找地方休息。驴睡在院子里，猎犬守在门后，猫卧在炉火前，公鸡飞上高高的搁板。赶了一天路，大家都累透了，很快便沉沉睡去。
    - id: ch04
      title: 强盗摸黑回屋
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            午夜过后，树林里的强盗望见屋里已经熄灯，四周也静悄悄的。强盗头子越想越不服气。
        - id: ch04-b02
          speaker: robber_captain
          text: >-
            咱们这么容易就被吓跑，实在蠢透了。你回去看看，那边到底安不安全。
        - id: ch04-b03
          speaker: narrator
          text: >-
            一个强盗只好摸回屋里。房中又黑又静，他走进厨房，觉得最好先点个火。黑暗里，猫的双眼闪着红光。强盗把那双眼睛当成两块烧红的煤，便取出一根火柴，凑到猫眼前，想借那两点红光把火柴点着。
        - id: ch04-b04
          speaker: narrator
          text: >-
            猫可不觉得强盗拿它的眼睛点火是什么有趣的玩笑。它猛地扑到强盗脸上，冲他吐着唾沫，两只前爪又抓又挠，半点也不留情。强盗吓得魂不附体，慌忙奔向后门，却绊上猎犬，被一口咬住了腿。他痛得号叫起来，逃过院子时，驴又抬起后蹄，狠狠踢了他一下。
        - id: ch04-b05
          speaker: narrator
          text: >-
            这时，公鸡也被吵醒了。它在高搁板上抖擞起精神，亮开嗓门大叫。
        - id: ch04-b06
          speaker: cock
          text: >-
            喔喔喔！
          emotion: happy
    - id: ch05
      title: 强盗再也不敢回来
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: >-
            那强盗一路逃回树林，急急忙忙向头领禀报。
        - id: ch05-b02
          speaker: robber
          text: >-
            头儿，屋里住着一个吓人的女巫！她朝我吐唾沫，还用长指甲抓破了我的脸。门边有个拿长刀的男人，在我腿上狠狠割了一刀。院子里又卧着一头黑怪物，抡起大木棒揍了我。屋顶上还有一个法官，他大喊：“把那个恶棍押到我这里来！”我哪还敢停，只能拼命逃回来。
          emotion: fearful
        - id: ch05-b03
          speaker: narrator
          text: >-
            从那以后，强盗们再也不敢回到这所房子，索性永远丢下了它。四位街头乐师却十分喜欢这个住处，决定留在强盗的屋里安家。至于它们后来怎样，据我所知，说不定直到今天，它们还住在那里。
        - id: ch05-b04
          speaker: narrator
          text: >-
            这个故事据克莱特克的德文译本收入书中。
