audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm, observant, and gently dramatic
        timbre: clear and rounded
        pace: measured
        pitch: medium
    dog:
      display_name: The Dog
      tts:
        delivery: weary, honest, and trusting
        timbre: warm and rough
        pace: natural
        pitch: medium-low
    sparrow:
      display_name: The Sparrow
      tts:
        delivery: quick, loyal, and fiercely determined
        timbre: bright and crisp
        pace: brisk
        pitch: high
    carter:
      display_name: The Carter
      tts:
        delivery: coarse, scornful, and hot-tempered
        timbre: heavy and harsh
        pace: forceful
        pitch: low
    carters_wife:
      display_name: The Carter's Wife
      tts:
        delivery: plainspoken, anxious, and direct
        timbre: clear and mature
        pace: natural
        pitch: medium
  chapters:
    - id: ch01
      title: A Hungry Traveler
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Long ago, there was a sheepdog whose master treated him cruelly and gave him so little food that the poor creature was starving. At last, the dog could bear it no longer. One day, he ran away from home and set off down the road.
        - id: ch01-b02
          speaker: narrator
          text: As he trotted along, he met a sparrow. She took one look at his unhappy face and stopped him.
        - id: ch01-b03
          speaker: sparrow
          text: Brother, why do you look so miserable?
        - id: ch01-b04
          speaker: dog
          text: Because I'm hungry, and I have nothing at all to eat.
          emotion: sad
        - id: ch01-b05
          speaker: sparrow
          text: Is that all? Come into town with me, dear brother. I'll soon find you something to eat.
        - id: ch01-b06
          speaker: narrator
          text: They went into town together and stopped outside a butcher's shop. The sparrow told the dog to wait while she knocked down a piece of meat for him. She looked all around to make sure no one was watching. Then she pecked at a piece of meat near the edge of a shelf until it dropped to the floor.
        - id: ch01-b07
          speaker: narrator
          text: The dog snatched it up and ran with it into a dark corner. He was ravenous, and within minutes he had devoured it. When he had finished, the sparrow led him to another butcher's shop. There she brought down a second piece of meat so he could eat his fill. Once he had gobbled that down as well, she asked if he had finally had enough.
        - id: ch01-b08
          speaker: dog
          text: I've had plenty of meat, but I haven't had any bread.
        - id: ch01-b09
          speaker: sparrow
          text: Then you shall have all the bread you want. Just follow me.
        - id: ch01-b10
          speaker: narrator
          text: She took him to a baker's shop and pecked at two rolls on a shelf until both fell down. The dog ate them, but he was still hungry. So the sparrow found another bakery and brought down more rolls for him. After he had eaten those too, she asked once more if he was satisfied.
        - id: ch01-b11
          speaker: dog
          text: Yes, I am. Now let's take a little walk outside the town.
    - id: ch02
      title: The Carter on the Road
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: The dog and the sparrow wandered out into the countryside. It was a very hot day. They had not gone far before the dog told his companion that he was tired and wanted to sleep.
        - id: ch02-b02
          speaker: sparrow
          text: Go to sleep, then. I'll sit in a tree and watch over you.
        - id: ch02-b03
          speaker: narrator
          text: The dog lay down in the middle of the road and soon fell fast asleep. Before long, a carter came along. His wagon was drawn by three horses and carried two barrels of wine. The sparrow saw that he had no intention of steering around the sleeping dog. He kept driving straight down the middle of the road, directly toward him.
        - id: ch02-b04
          speaker: sparrow
          text: Carter, watch where you're going! If you hurt him, I'll make you pay for it.
        - id: ch02-b05
          speaker: narrator
          text: The carter only laughed. He cracked his whip and drove the wagon straight over the dog. The heavy wheels killed the poor animal.
        - id: ch02-b06
          speaker: sparrow
          text: You have killed my brother with your cruelty. It will cost you your wagon and all three horses.
          emotion: angry
        - id: ch02-b07
          speaker: carter
          text: My wagon and horses? I'd like to see a little bird like you take them from me!
        - id: ch02-b08
          speaker: narrator
          text: The sparrow did not answer. She slipped beneath the wagon's cover and pecked at the stopper in one wine barrel. She kept at it until the cork came loose. Every drop of wine poured away, and the carter noticed nothing.
        - id: ch02-b09
          speaker: narrator
          text: At last, he looked behind him and saw that the bottom of the wagon was wet. When he examined the load, he found one barrel completely empty.
        - id: ch02-b10
          speaker: carter
          text: Oh, what terrible luck I have!
        - id: ch02-b11
          speaker: sparrow
          text: Worse luck is still coming.
    - id: ch03
      title: Three Horses Lost
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: The sparrow landed on the head of the first horse and pecked out its eyes. When the carter saw what had happened, he seized an axe and tried to strike her. The little bird darted into the air before the blow could reach her. Instead, the axe came down on the blind horse's head, and the animal fell dead.
        - id: ch03-b02
          speaker: carter
          text: Oh, what terrible luck I have!
        - id: ch03-b03
          speaker: sparrow
          text: Your luck will grow worse yet.
        - id: ch03-b04
          speaker: narrator
          text: The carter drove on with his two remaining horses. Once again, the sparrow crept under the cover. This time, she pecked the cork from the second barrel, and all the wine streamed out onto the road.
        - id: ch03-b05
          speaker: narrator
          text: When the carter discovered this new disaster, he cried out again.
        - id: ch03-b06
          speaker: carter
          text: Oh, what terrible luck I have!
        - id: ch03-b07
          speaker: sparrow
          text: Your bad luck isn't over.
        - id: ch03-b08
          speaker: narrator
          text: She flew onto the second horse and pecked out its eyes. The carter jumped down with his axe, determined to kill her. But the sparrow rose high above him, and the axe came down on the poor blind horse. The blow killed it where it stood.
        - id: ch03-b09
          speaker: carter
          text: Oh, what terrible luck I have!
        - id: ch03-b10
          speaker: sparrow
          text: You still haven't reached the end of it.
        - id: ch03-b11
          speaker: narrator
          text: The sparrow settled on the head of the third horse and pecked out its eyes too. The carter was blind with rage. He hurled his axe at the bird, but she escaped once more. The weapon struck his last horse and killed it.
        - id: ch03-b12
          speaker: carter
          text: Oh, what terrible luck I have!
        - id: ch03-b13
          speaker: sparrow
          text: Worse is still to come. Now I mean to leave your home desolate.
          emotion: angry
    - id: ch04
      title: The Empty Barn
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: With all three horses dead, the carter had to abandon his wagon in the road. He went home in a towering rage. The moment he saw his wife, he shouted out the news.
        - id: ch04-b02
          speaker: carter
          text: What dreadful luck I've had! All my wine has spilled, and every one of my three horses is dead.
          emotion: angry
        - id: ch04-b03
          speaker: carters_wife
          text: Dear husband, the bad luck has followed you home. A wicked little sparrow gathered all the other birds in the world. They're in our barn right now, eating everything we have.
        - id: ch04-b04
          speaker: narrator
          text: The carter hurried to the barn where he stored his grain. It was exactly as his wife had said. Thousands upon thousands of birds were eating the corn, and the little sparrow sat among them.
        - id: ch04-b05
          speaker: carter
          text: Oh, what terrible luck I have!
        - id: ch04-b06
          speaker: sparrow
          text: Not terrible enough. Mark my words, carter. Your cruel deed will cost you your life.
          emotion: angry
        - id: ch04-b07
          speaker: narrator
          text: With that, she flew up into the air. The carter had lost all his worldly goods. Deeply miserable, he sat beside the fire and plotted how he might take revenge on the sparrow.
    - id: ch05
      title: The Sparrow at the Window
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: The little bird came to the window ledge. In a mocking voice, she sang out the same warning.
        - id: ch05-b02
          speaker: sparrow
          text: Yes, carter. Your cruel deed will cost you your life.
        - id: ch05-b03
          speaker: narrator
          text: The carter seized his axe and threw it at her. He shattered the windowpanes, but he did not harm the sparrow at all. She hopped through the broken window and perched on the mantelpiece.
        - id: ch05-b04
          speaker: sparrow
          text: Yes, carter. It will cost you your life.
        - id: ch05-b05
          speaker: narrator
          text: By now, the carter was beside himself with rage. He charged at the sparrow again and again, swinging his axe wherever she landed. Each time, the little creature slipped away before the blade reached her. Blow after blow missed the bird, and all he managed to do was destroy every piece of his own furniture.
        - id: ch05-b06
          speaker: narrator
          text: At last, however, he caught the bird in his hands. His wife saw that he had her and called out to him.
        - id: ch05-b07
          speaker: carters_wife
          text: Shall I wring her neck?
        - id: ch05-b08
          speaker: carter
          text: Certainly not! That death would be far too easy. She must die much more cruelly. I'll eat her alive!
          emotion: angry
    - id: ch06
      title: The Final Blow
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: The carter did exactly what he had threatened and swallowed the sparrow alive. But inside him, she fluttered and struggled until she worked her way back up into his mouth. Then she poked out her head and spoke once more.
        - id: ch06-b02
          speaker: sparrow
          text: Yes, carter. It will cost you your life.
        - id: ch06-b03
          speaker: narrator
          text: The carter handed the axe to his wife.
        - id: ch06-b04
          speaker: carter
          text: Wife, strike the bird in my mouth and kill her!
        - id: ch06-b05
          speaker: narrator
          text: His wife swung the axe with all her strength. She missed the bird and struck the carter squarely on top of the head. He fell down dead. The sparrow escaped from his mouth and flew away into the air.
