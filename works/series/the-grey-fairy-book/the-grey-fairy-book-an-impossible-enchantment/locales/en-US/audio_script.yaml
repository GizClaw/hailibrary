  chapters:
    - id: ch01
      title: The King's Bride
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: There once was a king who loved his people, and they loved him just as warmly. His life was very happy except for one thing. He could not bear the thought of marriage, and he had never wanted to fall in love. His subjects begged him to choose a wife until at last he promised he would try. Since he cared for none of the women he had met, he decided to travel and look for someone he could love.
        - id: ch01-b02
          speaker: narrator
          text: He put the affairs of his kingdom in order and set out with only one equerry. The man was not especially clever, but he had excellent good sense, which often makes a better traveling companion. For two years they crossed one country after another. The king tried his best to fall in love and failed every time. At last he turned toward home with his heart as free as it had been when he left.
        - id: ch01-b03
          speaker: narrator
          text: One day, as they rode through a forest, they heard a terrible storm of cats miaowing and shrieking. The noise came closer and closer. Then a hundred enormous Spanish cats raced past through the trees, packed so tightly that one large cloak might have covered them all. Two huge apes in purple suits and beautifully made boots chased them. The apes rode splendid mastiffs, blew sharp notes on little toy trumpets, and spurred their mounts forward as fast as they could.
        - id: ch01-b04
          speaker: narrator
          text: The king and his equerry stopped to watch. Behind the apes came more than twenty little dwarfs in purple silk uniforms. Some rode wolves and led spare animals. Others held cats on leashes. Then a beautiful young woman appeared, racing toward them on a tiger. She swept past the king without even looking at him. One look at her was enough. In that moment, the king lost his heart.
        - id: ch01-b05
          speaker: narrator
          text: To his delight, one dwarf had fallen behind the hunt. The king stopped him and asked who the lady was.
        - id: ch01-b06
          speaker: dwarf
          text: That is Princess Mutinosa, the daughter of this country's king. She loves hunting, and today she is chasing rabbits.
        - id: ch01-b07
          speaker: narrator
          text: The king asked for directions to the royal court. Once the dwarf had shown him the way, he hurried on and reached the capital within two hours. He gave the king and queen his name and the name of his country, and they welcomed him with open arms.
        - id: ch01-b08
          speaker: narrator
          text: Princess Mutinosa returned soon afterward. The hunt had gone very well, so the visiting king praised her success. She did not answer. Her silence surprised him. At supper, she never spoke once. Now and then she seemed ready to say something, but each time her father or mother began talking instead.
        - id: ch01-b09
          speaker: narrator
          text: None of that weakened the king's love. That night, in his own rooms, he told his faithful equerry how he felt. The equerry was not pleased, and he made no effort to hide it.
        - id: ch01-b10
          speaker: king
          text: Why does this upset you? The princess is beautiful enough to please anyone.
        - id: ch01-b11
          speaker: equerry
          text: She is certainly very handsome, sire. But beauty alone cannot make love happy. If I may speak honestly, there is something hard in her face.
        - id: ch01-b12
          speaker: king
          text: You mistake pride and dignity for hardness. Nothing could suit her better.
        - id: ch01-b13
          speaker: equerry
          text: Call it pride or hardness, as you wish. I still distrust it. She chooses fierce creatures for her sport, which may point to a fierce temper. And why are her parents so careful not to let her speak?
        - id: ch01-b14
          speaker: narrator
          text: This was excellent sense. But opposition often makes love burn hotter, especially in a king who hates being contradicted. The very next day, he asked to marry Princess Mutinosa. Her parents agreed on two conditions. The wedding must be held the following day, and he must not speak to the princess until she was his wife. The equerry objected, but the king accepted both terms.
        - id: ch01-b15
          speaker: narrator
          text: The first word he heard from his bride was the yes she gave at their wedding. After that, she no longer held her tongue. She spoke rudely to her ladies and scolded even the king. He was good-tempered and deeply in love, so he endured it patiently. A few days later, the newly married pair left for his kingdom, and very few people were sorry to see them go.
        - id: ch01-b16
          speaker: narrator
          text: The equerry's fears soon proved true. Before a month had passed, the young queen had made herself hated throughout the court. Her spite and bad temper seemed to have no limit, and her dreadful reputation spread far and wide.
    - id: ch02
      title: The Fairies' Judgment
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: One day, while riding out, Mutinosa passed a poor old woman on the road. The woman made a curtsy and began to walk on. The queen ordered her to stop.
        - id: ch02-b02
          speaker: mutinosa
          text: What an impertinent creature you are! Don't you know I am the queen? How dare you make such a shallow curtsy to me?
          emotion: angry
        - id: ch02-b03
          speaker: placida
          text: Madam, no one ever taught me how to measure a curtsy. I meant no disrespect.
        - id: ch02-b04
          speaker: mutinosa
          text: What? You dare answer me? Tie her to my horse's tail. I will take her straight to the finest dancing master in town and have her taught to curtsy properly.
          emotion: angry
        - id: ch02-b05
          speaker: narrator
          text: The old woman cried for mercy. Mutinosa refused to listen and mocked her when she said the fairies protected her. At last the poor woman let herself be tied to the horse. But when the queen urged the animal forward, it would not move. She drove in her spurs, yet the horse stood as still as if it had been cast in bronze.
        - id: ch02-b06
          speaker: narrator
          text: At the same instant, the rope around the old woman became a wreath of flowers. The woman herself rose tall and stately. She was the fairy Placida, and she looked at Mutinosa with contempt.
        - id: ch02-b07
          speaker: placida
          text: Wicked woman, you are not worthy to wear a crown. I came to learn whether everything I had heard about you was true. Now I have no doubt. You laughed at the fairies, and soon you will learn whether that was wise.
          emotion: angry
        - id: ch02-b08
          speaker: narrator
          text: Placida blew a small gold whistle. At once, a chariot arrived, drawn by six magnificent ostriches. The Fairy Queen sat inside, with twelve other fairies riding dragons around her. They all dismounted, and Placida told them what had happened.
        - id: ch02-b09
          speaker: narrator
          text: The Fairy Queen approved of Placida's actions and wanted to turn Mutinosa into bronze, just like her horse. But Placida was kind and gentle. She pleaded for a less terrible punishment. At last they decided that Mutinosa must serve Placida for the rest of her life, unless she had a child who could take her place.
        - id: ch02-b10
          speaker: narrator
          text: The king was told what had become of his wife. Since he had no power to help her, he accepted the fairies' judgment. The other fairies departed, and Placida took Mutinosa home as her servant.
        - id: ch02-b11
          speaker: placida
          text: You deserve to work in the scullery. Still, you were raised in comfort, and that change might be too great. Instead, you will sweep my rooms carefully and wash and comb my little dog.
        - id: ch02-b12
          speaker: narrator
          text: Mutinosa knew disobedience would do no good. She carried out her orders without a word. After some time, she gave birth to a beautiful little girl. When she had recovered, Placida spoke sternly to her about her former life, made her promise to behave better, and sent her back to her husband.
        - id: ch02-b13
          speaker: narrator
          text: The baby princess remained with Placida. The fairy devoted herself to the child and thought carefully about which fairies to invite as godmothers. She wanted the little girl to receive the best possible gifts. At last she chose two kind, cheerful fairies and invited them to the christening feast.
        - id: ch02-b14
          speaker: narrator
          text: When the feast ended, the baby was carried in. She lay in a crystal cradle hung with red silk curtains embroidered in gold. Her smile was so sweet that the fairies resolved to do everything they could for her. First, they named her Graziella.
        - id: ch02-b15
          speaker: placida
          text: Dear sisters, when one of our kind wishes to punish someone, she often turns beauty into ugliness or cleverness into stupidity. More often still, she changes the person's shape altogether. Each of us may give only one gift. Let one of you give Graziella beauty and the other good understanding. I will make sure no one can ever change her into another form.
        - id: ch02-b16
          speaker: narrator
          text: The godmothers agreed. They gave Graziella their gifts and went home. Placida then took charge of her education. The child learned so well and grew so lovely that her fame spread while she was still very young. It spread farther than was safe.
        - id: ch02-b17
          speaker: narrator
          text: One day, the Fairy Queen came to see Placida. Beside her stood another fairy with a grave, severe face. The queen immediately spoke of Mutinosa.
        - id: ch02-b18
          speaker: fairy_queen
          text: I am astonished by the way you treated her. Mutinosa insulted all fairies, and she deserved punishment. You were free to forgive a wrong done to you, but not a wrong done to all of us. You were far too gentle. Now I have come to avenge us upon her daughter.
          emotion: angry
        - id: ch02-b19
          speaker: fairy_queen
          text: You have made the child beautiful and clever, and you have protected her from any change of form. So I will put her in an enchanted prison. She will never escape until she finds herself in the arms of a lover whom she loves in return. I will make certain that never happens.
        - id: ch02-b20
          speaker: narrator
          text: Graziella's prison was a tall tower in the middle of the sea, built from shells of every color and shape. The lowest floor was like a huge bathing room, where the water could be let in or drained away. The princess lived on the next floor in beautiful rooms of her own.
        - id: ch02-b21
          speaker: narrator
          text: Above that stood a library, a great wardrobe filled with fine clothes and linen, and a music room. There was also a pantry stocked with excellent wines and a storeroom full of preserves, sweets, pastries, and cakes. Everything stayed as fresh as the moment it came from the oven.
        - id: ch02-b22
          speaker: narrator
          text: The roof of the tower was a garden. Lovely flowers filled its beds, fine fruit grew on the trees, and shady bowers stood among the shrubs. Birds sang in the branches. The fairies brought Graziella and her governess, Bonnetta, into the tower. Then the fairies climbed onto a dolphin that waited for them outside.
        - id: ch02-b23
          speaker: narrator
          text: Once they were some distance away, the Fairy Queen waved her wand. Two thousand great, savage sharks appeared around the tower. She ordered them to keep watch and allow no living soul to enter.
        - id: ch02-b24
          speaker: narrator
          text: Bonnetta took great care with Graziella's education. By the time the princess was nearly grown, she was accomplished in every way. Better still, she had become a sweet and good young woman.
    - id: ch03
      title: Visitors from the Sea
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: One day, Graziella stood on a balcony and saw an extraordinary shape rise from the sea. She quickly called Bonnetta. The creature looked something like a man, but his face was blue and long green hair streamed around his head. He swam straight toward the tower, and the sharks left him alone.
        - id: ch03-b02
          speaker: bonnetta
          text: He must be a merman.
        - id: ch03-b03
          speaker: graziella
          text: A man? Then come quickly. Let us go down to the door and see him more closely.
          emotion: surprised
        - id: ch03-b04
          speaker: narrator
          text: The merman stopped outside the doorway and stared at Graziella with open admiration. His voice was so rough and husky that the women could not understand him. When he realized this, he began using signs instead. He carried a small wicker basket filled with rare shells and held it out to the princess.
        - id: ch03-b05
          speaker: narrator
          text: Graziella accepted the basket and thanked him with signs of her own. Dusk was falling, so she went back inside. The merman plunged beneath the waves.
        - id: ch03-b06
          speaker: graziella
          text: What a dreadful creature! Why did those hateful sharks let him near us? Surely all men do not look like that.
          emotion: disgusted
        - id: ch03-b07
          speaker: bonnetta
          text: Certainly not. Perhaps the sharks think he is some kind of relation, and that is why they did not attack him.
        - id: ch03-b08
          speaker: narrator
          text: Several days later, the women heard a strange kind of music. They looked from the window and saw the merman again. Water plants crowned his head, and he was blowing into a huge seashell with all his strength. Graziella and Bonnetta went down to the door. The princess politely received the coral and other treasures he had brought from the sea.
        - id: ch03-b09
          speaker: narrator
          text: After that, he returned every evening. Sometimes he played his shell. Sometimes he dived and performed tricks below Graziella's window. She bowed to him from the balcony, but no matter how he beckoned, she would not come down again.
        - id: ch03-b10
          speaker: narrator
          text: Some days later, he brought a mermaid with him. Her hair was beautifully arranged, and her voice was lovely. The two women went down to meet her. The mermaid tried several languages until at last she spoke theirs, and she greeted Graziella with a graceful compliment about her beauty.
        - id: ch03-b11
          speaker: narrator
          text: The mermaid saw that the bottom floor of the tower was full of water.
        - id: ch03-b12
          speaker: mermaid
          text: Why, this room is perfect for us! We cannot live entirely out of the water.
        - id: ch03-b13
          speaker: narrator
          text: She and her brother swam inside and settled in the bathing room. Graziella and Bonnetta sat on the steps around its walls.
        - id: ch03-b14
          speaker: mermaid
          text: Madam, perhaps you left the land to escape a crowd of admirers. I am afraid even this tower cannot protect you from love. My brother is already wasting away for you. And once the people of our city see you, he will have plenty of rivals.
        - id: ch03-b15
          speaker: narrator
          text: She explained that her brother was miserable because he could not make himself understood.
        - id: ch03-b16
          speaker: mermaid
          text: That is why I speak for him. A fairy taught me several languages.
        - id: ch03-b17
          speaker: graziella
          text: Then there are fairies beneath the sea too?
          emotion: sad
        - id: ch03-b18
          speaker: mermaid
          text: Yes, there are. And unless I am mistaken, the fairies on land have caused you great sorrow.
        - id: ch03-b19
          speaker: narrator
          text: Graziella told the mermaid her whole story. The mermaid said she was deeply sorry and urged the princess not to lose courage.
        - id: ch03-b20
          speaker: mermaid
          text: Perhaps one day you will discover a way out of all your troubles.
          emotion: calm
        - id: ch03-b21
          speaker: narrator
          text: After the visitors left, Graziella felt happier than she had in a long while. At least she had met someone new to talk with.
        - id: ch03-b22
          speaker: graziella
          text: We can get to know more of the sea people. I am sure they cannot all be as ugly as the first one. At any rate, we will not be so terribly lonely.
          emotion: happy
        - id: ch03-b23
          speaker: bonnetta
          text: Young people are wonderfully hopeful! I am afraid of these creatures myself. And what do you think of the admirer you have won?
        - id: ch03-b24
          speaker: graziella
          text: I could never love him. I cannot bear the sight of him. Still, his sister says they are related to the fairy Marina. Perhaps that connection could help us.
          emotion: disgusted
        - id: ch03-b25
          speaker: narrator
          text: The mermaid came back often. Every time, she spoke of her brother's love. Every time, Graziella spoke of her longing to leave the tower. At last, the mermaid promised to bring the fairy Marina, hoping the fairy might know what to do.
    - id: ch04
      title: Two Possible Suitors
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: Marina arrived with the mermaid the next day, and Graziella welcomed her eagerly. After they had talked for a little while, the fairy asked to see the inside of the tower and the garden on its roof. She could move about with the help of crutches. Because she was a fairy, she could also remain out of the water for a long time, as long as she wet her forehead now and then.
        - id: ch04-b02
          speaker: narrator
          text: Graziella gladly led her upstairs, while Bonnetta stayed below with the mermaid. As soon as they reached the garden, Marina came to the point.
        - id: ch04-b03
          speaker: marina
          text: Let us waste no time. Tell me what I can do for you.
        - id: ch04-b04
          speaker: narrator
          text: Graziella told her everything. Marina listened, then gave her answer.
        - id: ch04-b05
          speaker: marina
          text: My dear princess, I have no power over the dry land, so I cannot free you that way. But if you would honor my cousin by marrying him, you could live with us beneath the sea. I can teach you to swim and dive as well as any sea creature. I can even harden your skin without changing its lovely color. My cousin is one of the finest matches in the ocean. I will give him so many gifts that you are sure to be happy.
        - id: ch04-b06
          speaker: narrator
          text: Marina argued so skillfully, and for so long, that Graziella began to waver. She promised to think about the marriage.
        - id: ch04-b07
          speaker: narrator
          text: As they prepared to leave the garden, they noticed a ship sailing closer to the tower than any ship had come before. A young man lay beneath a magnificent awning on its deck and watched the tower through a spyglass. Before they could see him well, the vessel sailed away. Marina left soon afterward, promising to return before long.
        - id: ch04-b08
          speaker: narrator
          text: Graziella told Bonnetta about Marina's proposal. The governess did not like it at all. She had no wish to become a mermaid in her old age. She considered the problem carefully and formed a plan.
        - id: ch04-b09
          speaker: narrator
          text: Bonnetta was a gifted artist. The next morning, she began painting a handsome young man with curling hair, a fine complexion, and lovely blue eyes. When the portrait was finished, she showed it to Graziella. She hoped the princess would see how different such a young man was from the merman who courted her.
        - id: ch04-b10
          speaker: graziella
          text: Is it truly possible for a man to be as handsome as this?
          emotion: surprised
        - id: ch04-b11
          speaker: bonnetta
          text: There are many men like him in the world, and a great many who are handsomer still.
        - id: ch04-b12
          speaker: graziella
          text: I can hardly believe it. But even if they exist, I will probably never see them, and they will never see me. What good does that do? Oh, how miserable I am!
          emotion: sad
        - id: ch04-b13
          speaker: narrator
          text: Graziella spent the rest of the day gazing at the picture. It completely ruined the merman's hopes. When Marina returned several days later to hear her decision, the princess barely listened to her. Graziella showed such dislike for the proposed marriage that Marina departed in a fury.
        - id: ch04-b14
          speaker: narrator
          text: Without knowing it, Graziella had already won another heart. The young man on the ship was Prince Blondel, the handsomest prince in the world. He had heard stories about the enchanted tower and was determined to sail as close as he could. Through the powerful spyglass aboard his ship, he saw the princess clearly and fell desperately in love with her.
        - id: ch04-b15
          speaker: narrator
          text: Blondel wanted the ship steered straight toward the tower. He meant to take a small boat the rest of the way. His entire crew fell at his feet and begged him not to risk it. The captain pleaded with him too.
        - id: ch04-b16
          speaker: captain
          text: Your Highness, that course will lead every one of us to certain death. Please let us anchor closer to shore. I know a kind fairy who has helped me many times. I am sure she will try to help you too.
          emotion: fearful
        - id: ch04-b17
          speaker: narrator
          text: The prince gave in, though he did so unwillingly. They landed at the nearest point, and the captain hurried away to seek the fairy's advice. Blondel had a tent raised on the shore. From there, he spent every hour watching the tower and searching for Graziella through his glass.
        - id: ch04-b18
          speaker: narrator
          text: Several days later, the captain returned with the fairy. Blondel was delighted to see her and received her with every honor.
        - id: ch04-b19
          speaker: helpful_fairy
          text: I have heard about your difficulty. We must act quickly. I will send a trusty pigeon to test the enchantment. If there is one weak place in it, the bird will find a way through. I will tell him to bring back a flower as proof. If he succeeds, I have every hope that I can send you in as well.
        - id: ch04-b20
          speaker: blondel
          text: Could the pigeon carry a note telling the princess that I love her?
        - id: ch04-b21
          speaker: helpful_fairy
          text: Certainly. That is an excellent idea.
        - id: ch04-b22
          speaker: narrator
          text: Blondel wrote a short letter.
        - id: ch04-b23
          speaker: blondel
          text: Lovely princess, I adore you. Please accept my heart, and believe that there is nothing I would not do to end your misfortunes. Blondel.
        - id: ch04-b24
          speaker: narrator
          text: They tied the letter around the pigeon's neck, and he flew away at once. He made good speed until he neared the tower. Then a savage wind struck him head-on and stopped him. The pigeon would not give up. He circled the top of the tower with great care until he found one small place the enchantment had missed. He slipped into the garden bower and waited.
    - id: ch05
      title: The Pigeon and the Hummingbird
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: Before long, Graziella entered the garden alone. The pigeon fluttered straight to her and behaved so tamely that she stopped to stroke him. Then she noticed the pink ribbon around his neck and the letter tied to it. She read Blondel's words several times before writing an answer.
        - id: ch05-b02
          speaker: graziella
          text: You tell me that you love me, but I cannot promise to love a man I have never seen. Send your portrait back with this faithful bird. If I return it, you must give up all hope. If I keep it, you will know that by helping me, you will also help yourself. Graziella.
        - id: ch05-b03
          speaker: narrator
          text: Before the pigeon left, he remembered that he needed proof of his visit. He spotted a flower tucked into Graziella's dress, stole it neatly, and flew back across the sea.
        - id: ch05-b04
          speaker: narrator
          text: Blondel was wild with joy when the pigeon returned carrying Graziella's answer. The faithful little bird rested for an hour. Then they sent him off again with a miniature portrait of the prince, which Blondel happened to have with him.
        - id: ch05-b05
          speaker: narrator
          text: The pigeon found Graziella in the rooftop garden. She quickly untied the ribbon and opened the portrait case. To her amazement and delight, Blondel looked very much like the handsome young man Bonnetta had painted. Graziella kept the portrait and sent the pigeon home. You can imagine Blondel's joy when the bird returned without it.
        - id: ch05-b06
          speaker: helpful_fairy
          text: We must not lose another moment. The only way I can bring you to her is by changing you into a bird. Do not worry. I will restore your true shape when the right moment comes.
          emotion: calm
        - id: ch05-b07
          speaker: narrator
          text: Blondel was eager to begin. The fairy touched him with her wand and turned him into the loveliest hummingbird anyone had ever seen. She allowed him to keep his human voice. Then she ordered the pigeon to guide him to the tower.
        - id: ch05-b08
          speaker: narrator
          text: Graziella was surprised when an unfamiliar hummingbird flew into her garden. She was even more astonished when it spoke.
        - id: ch05-b09
          speaker: blondel
          text: Good morning, sweet princess.
        - id: ch05-b10
          speaker: narrator
          text: The princess was delighted with the beautiful creature and let him perch on her finger.
        - id: ch05-b11
          speaker: blondel
          text: Give the little bird a kiss. Just one kiss.
        - id: ch05-b12
          speaker: narrator
          text: Graziella gladly kissed him, then petted and stroked his feathers. She had risen very early that morning, and after a while she became tired. The sun was hot, so she lay down on a mossy bank in the shade of the bower. She held the little bird close to her breast and began to fall asleep.
        - id: ch05-b13
          speaker: narrator
          text: At that moment, the helpful fairy restored Blondel's proper shape. Graziella opened her eyes and found herself in the arms of a lover whom she loved in return.
        - id: ch05-b14
          speaker: narrator
          text: The enchantment broke at once. The tower rocked and split apart. Bonnetta rushed up to the garden, determined to die beside her dear princess if she could not save her. Just as she arrived, the helpful fairy appeared with Placida. They rode in a carriage of Venetian glass drawn by six eagles.
        - id: ch05-b15
          speakers: [helpful_fairy, placida]
          ensemble: duo
          text: Come quickly! The tower is about to sink!
          emotion: fearful
        - id: ch05-b16
          speaker: narrator
          text: Blondel, Graziella, and Bonnetta leaped into the glass carriage. It rose into the air at the very instant the tower fell into the sea with a terrible crash. Marina and the mermen had destroyed its foundations to avenge Graziella's rejection, but the good fairies had defeated their wicked plan. The carriage flew toward the kingdom of Graziella's parents.
        - id: ch05-b17
          speaker: narrator
          text: Queen Mutinosa had died several years before. Her kind husband was still alive, ruling his country peacefully and well. He welcomed his daughter with immense joy, and the whole kingdom celebrated the lovely princess's return.
        - id: ch05-b18
          speaker: narrator
          text: Graziella and Blondel were married the very next day. For many days afterward, there were balls, feasts, tournaments, concerts, and every sort of amusement, continuing through the days and nights.
        - id: ch05-b19
          speaker: narrator
          text: The fairies were all invited with great care. They arrived in magnificent state and promised the young couple their protection and many wonderful gifts.
        - id: ch05-b20
          speaker: narrator
          text: Prince Blondel and Princess Graziella lived to a good old age. Everyone loved them, and as the years passed, they loved each other more and more.
