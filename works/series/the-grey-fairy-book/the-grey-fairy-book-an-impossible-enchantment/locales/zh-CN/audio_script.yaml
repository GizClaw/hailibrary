audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 亲切从容，带一点温和的诙谐
        timbre: 温暖清晰
        pace: 舒缓
        pitch: 中音
    king:
      display_name: 国王
      tts:
        delivery: 温和坦率，恋爱时热切而固执
        timbre: 明朗沉稳
        pace: 适中
        pitch: 中低音
    equerry:
      display_name: 侍从
      tts:
        delivery: 忠诚明理，劝告时谨慎直率
        timbre: 朴实清晰
        pace: 适中
        pitch: 中音
    mutinosa:
      display_name: 穆蒂诺莎王后
      tts:
        delivery: 骄横尖刻，发怒时咄咄逼人
        timbre: 冷亮锐利
        pace: 稍快
        pitch: 中高音
    placida:
      display_name: 普拉西达仙女
      tts:
        delivery: 温柔端庄，训诫时不失威严
        timbre: 柔和醇厚
        pace: 舒缓
        pitch: 中音
    fairy_queen:
      display_name: 仙后
      tts:
        delivery: 威严冷峻，措辞果断
        timbre: 清越有力
        pace: 稍缓
        pitch: 中音
    graziella:
      display_name: 格拉齐埃拉公主
      tts:
        delivery: 纯真温柔，喜怒都真挚鲜明
        timbre: 清澈甜美
        pace: 适中
        pitch: 中高音
    bonnetta:
      display_name: 博内塔
      tts:
        delivery: 慈爱机敏，忧虑时仍然沉着
        timbre: 温厚清晰
        pace: 适中
        pitch: 中音
    mermaid:
      display_name: 人鱼姑娘
      tts:
        delivery: 亲切伶俐，劝说时热情周到
        timbre: 悦耳明亮
        pace: 适中
        pitch: 中高音
    marina:
      display_name: 玛丽娜仙女
      tts:
        delivery: 能言善辩，受挫时傲慢不悦
        timbre: 圆润清亮
        pace: 稍快
        pitch: 中音
    blondel:
      display_name: 布隆代尔王子
      tts:
        delivery: 真诚热烈，行动时果敢急切
        timbre: 清朗温暖
        pace: 适中
        pitch: 中低音
    captain:
      display_name: 船长
      tts:
        delivery: 老练忠诚，劝阻时恳切坚定
        timbre: 粗粝沉稳
        pace: 适中
        pitch: 低音
    kind_fairy:
      display_name: 善良的仙女
      tts:
        delivery: 从容可靠，安排事情简洁果断
        timbre: 温润清晰
        pace: 适中
        pitch: 中音
  chapters:
    - id: ch01
      title: 国王爱上沉默的公主
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            从前有位国王，百姓爱戴他，他也真心爱护百姓。他的日子本来过得很幸福，偏偏一提到娶妻就十分厌烦。他从没想过要爱上谁。臣民一再恳求，他才答应试一试。可身边见过的女子都没能打动他，于是他决定出门远游，盼着遇见一位自己真心爱得上的姑娘。
        - id: ch01-b02
          speaker: narrator
          text: >-
            国王妥善安排好国事，只带一名侍从上路。侍从不算格外聪明，却很有见识。这样的人，往往正是最好的旅伴。国王走遍好几个国家，想尽办法让自己坠入情网，始终没能如愿。两年以后，他只好回国，一颗心仍和出发时一样自由。
        - id: ch01-b03
          speaker: narrator
          text: >-
            归途中，他们骑马穿过森林，忽然听见一片骇人的猫叫。声音越来越近，一百只硕大的西班牙猫从树间冲了出来，挤得密密匝匝，简直能用一件大斗篷全罩住。它们沿着同一道踪迹飞奔，后面有两只穿紫色套装的巨猿穷追不舍。巨猿脚上的靴子精巧漂亮，身下骑着神气的獒犬，一面用马刺催赶，一面把小小的玩具号角吹得又尖又响。
        - id: ch01-b04
          speaker: narrator
          text: >-
            国王和侍从停下观看这场奇异的狩猎。队伍后面还有二十多个小矮人，有的骑着狼，手里牵着替换的坐骑，有的用皮带牵着猫。他们全穿着和巨猿一样的紫绸制服。紧接着，一位美丽的年轻女子骑着老虎疾驰而来。她从国王近旁掠过，连看也没有看他。国王却在那一瞬间中了她的魔法，一颗心就这样丢了。
        - id: ch01-b05
          speaker: narrator
          text: >-
            恰好有个小矮人落在后面。国王赶忙打听，才知道那女子是这个国家的穆蒂诺莎公主，酷爱打猎，此刻追的是兔子。他问明王宫的方向，策马赶去，两小时后便到了都城。国王和王后一听他的名号，立刻热情接待。公主不久也打猎归来。国王听说她收获颇丰，便称赞了她，她却一个字也没答。
        - id: ch01-b06
          speaker: narrator
          text: >-
            公主一声不响，已经叫国王十分诧异。到了晚餐时，她仍然一次也没有开口。偶尔她像是要说话，父王或母后就马上接过话头。国王虽然吃惊，爱意却一点没淡。夜里回到房间，他把心事全告诉了忠心的侍从。侍从听完很失望，也没有打算瞒着他。
        - id: ch01-b07
          speaker: king
          text: >-
            你为什么这样不高兴？公主难道还不够美，不能叫人倾心吗？
        - id: ch01-b08
          speaker: equerry
          text: >-
            她确实很漂亮。可是陛下，爱情要让人真正幸福，不能只靠美貌。说实话，我觉得她的神情有些冷酷。
        - id: ch01-b09
          speaker: king
          text: >-
            那不是冷酷，是骄傲和尊严。这样的神情最适合她。
        - id: ch01-b10
          speaker: equerry
          text: >-
            陛下愿意叫它骄傲也好，冷酷也好。她玩乐时偏要选这些凶猛的野兽，我看她的性情恐怕也很凶悍。何况，她的父母千方百计不让她说话，这里面也很可疑。
        - id: ch01-b11
          speaker: narrator
          text: >-
            侍从说得句句在理。可男人的爱情遇上反对，常常只会烧得更旺，尤其这还是一位讨厌别人反驳的国王。第二天，他便请求迎娶穆蒂诺莎。对方答应了，却有两个条件。婚礼必须就在第二天举行，而且在公主成为他的妻子以前，他不能同她说话。
        - id: ch01-b12
          speaker: narrator
          text: >-
            侍从极力劝阻，国王还是全部答应。因此，他听见新娘说的第一句话，就是婚礼上回答的那一声“愿意”。一成婚，穆蒂诺莎便再也不约束自己。侍女们每天都要承受她的刻薄斥骂，连国王也逃不过她的责骂。他脾气温和，又深爱妻子，只能一次次耐心忍受。几天后，新婚夫妇启程回国，身后并没有多少人为他们的离去感到遗憾。
    - id: ch02
      title: 仙女的惩罚与公主的诞生
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            侍从担心的事全都成了真，国王也为自己的选择吃尽了苦头。年轻的王后走到哪里，就让哪里的人不得安宁。她对整个宫廷都十分刻薄，恶毒和坏脾气没有边际。还不到一个月，远近的人便都知道她是个十足的悍妇。
        - id: ch02-b02
          speaker: narrator
          text: >-
            一天，王后骑马出游，遇见一个贫穷的老妇人。老妇人行过屈膝礼，正要赶路，王后却命人将她拦住。
        - id: ch02-b03
          speaker: mutinosa
          text: >-
            你真是无礼！难道不知道我是王后？见到我，怎么敢不把礼行得更深？
          emotion: angry
        - id: ch02-b04
          speaker: placida
          text: >-
            王后陛下，我从没学过怎样量屈膝礼的深浅，可我绝没有失礼的意思。
        - id: ch02-b05
          speaker: mutinosa
          text: >-
            什么？你还敢顶嘴！把她捆在我的马尾巴上。我这就拖她去城里最好的舞蹈教师那里，让她学会该怎样行礼！
          emotion: angry
        - id: ch02-b06
          speaker: narrator
          text: >-
            老妇人哭喊求饶，王后根本不听。老人说自己有仙女庇护，王后反而大声嘲笑。可怜的老人只好任人把自己捆在马尾上。谁知王后一催坐骑，那匹马竟没有挪动一步。她一次次用马刺扎它，也全无用处，马仿佛变成了青铜。就在这时，捆人的绳索化作一圈圈鲜花，老妇人也变成一位高挑庄严的贵妇。她就是普拉西达仙女。
        - id: ch02-b07
          speaker: placida
          text: >-
            恶毒的女人，你不配戴这顶王冠。我特意来查明那些传闻是真是假，如今已经没有半点疑问。你马上就会知道，仙女可不是任人取笑的。
          emotion: disgusted
        - id: ch02-b08
          speaker: narrator
          text: >-
            普拉西达说完便吹响一枚金色小哨。一辆由六只华美鸵鸟拉着的车立刻出现，仙后端坐车中，身边还有十二位骑着龙的仙女护送。她们纷纷下来，听普拉西达从头讲完遭遇。仙后认为普拉西达所做的一切都很对，还提议把穆蒂诺莎也变成青铜，和她那匹动弹不得的马一模一样。
        - id: ch02-b09
          speaker: narrator
          text: >-
            可普拉西达仁慈温柔，替王后求了情。最后大家议定，穆蒂诺莎要终身做她的奴仆，除非生下一个孩子来代替自己。国王得知妻子的命运，只好接受。他无力相救，也没有别的办法。
        - id: ch02-b10
          speaker: narrator
          text: >-
            仙女们各自散去，普拉西达带着王后回到宫殿。
        - id: ch02-b11
          speaker: placida
          text: >-
            按理说，你该到厨房里做粗活。不过你从小娇养惯了，这样的变化也许太大。我只要你把我的房间仔细打扫干净，再替我的小狗洗澡梳毛。
        - id: ch02-b12
          speaker: narrator
          text: >-
            穆蒂诺莎知道反抗没有用，便默默照办。过了一段日子，她生下一个无比可爱的小女孩。等她恢复健康，普拉西达把她过去的所作所为好好训诫了一番。穆蒂诺莎答应从今以后改过，仙女这才把她送回丈夫身边。小公主留在普拉西达身边，交由她照料。从此，仙女把全部心力都用在这个孩子身上。
        - id: ch02-b13
          speaker: narrator
          text: >-
            普拉西达反复思量，该请哪几位仙女来做孩子的教母，才能让养女得到最好的天赋。最后，她选了两位格外善良开朗的仙女。洗礼结束，婴儿被抱到她们面前，躺在美丽的水晶摇篮里，周围垂着绣金的红绸帘子。孩子冲她们笑得那么甜，两位仙女立刻决定把最好的赐给她。
        - id: ch02-b14
          speaker: placida
          text: >-
            我们先给她取名格拉齐埃拉。亲爱的姐妹们，我们一族最常见的恶作剧和惩罚，就是把美貌变成丑陋，把聪明变成愚笨，更多时候还会把人彻底变成另一副模样。既然每人只能赐下一份天赋，你们一个给她美貌，一个给她智慧。我来保证，她永远不会被变成别的形体。
        - id: ch02-b15
          speaker: narrator
          text: >-
            两位教母都赞成这个办法。赐福以后，她们回了家，普拉西达则一心教养孩子。格拉齐埃拉学会了各种才艺，也出落得越发美丽。她还很年幼，美名就传得太广了。一天，仙后忽然来到宫中，身旁还跟着一位神情严厉冷峻的仙女。
        - id: ch02-b16
          speaker: fairy_queen
          text: >-
            你对穆蒂诺莎的处置，真叫我吃惊。她侮辱了我们整个仙族，本来就该受罚。你可以宽恕她对你犯下的错，却不能替别人也原谅她。你待她太宽厚，如今我要在她女儿身上替大家复仇。你保她美丽聪明，不会变成别的形体，那我就把她关进施过魔法的牢狱。除非她投入一个情人的怀抱，而且她自己也爱着那个人，否则永远不能离开。我会亲自设法，不让这样的事发生。
        - id: ch02-b17
          speaker: narrator
          text: >-
            那座魔法牢狱是一座高高的塔，孤零零立在大海中央，塔身全用各种形状、各种颜色的贝壳砌成。最底层像一间宽阔的浴室，海水想放进来就放进来，想排出去也随时可以。第一层是公主的卧房，陈设华美。第二层有图书室，还有一间很大的衣帽间，里面装满漂亮衣服和各种细麻布。此外还有音乐室、酒窖与储藏室。酒窖里摆着最好的葡萄酒，储藏室里收着各式蜜饯、糖果、酥点和糕饼。无论放多久，它们都像刚从炉里端出来一样新鲜。
        - id: ch02-b18
          speaker: narrator
          text: >-
            塔顶被修成一座花园。花坛里开着最可爱的花，园中长着上好的果树，还有阴凉的凉亭和茂密的灌木，许多鸟儿藏在枝叶间歌唱。仙女们把格拉齐埃拉和女教师博内塔送进塔中，然后骑上一条等候的海豚。来到离塔稍远的地方，仙后挥动魔杖，一口气召来两千条巨大凶猛的鲨鱼，命它们贴近高塔严加看守，不许任何生灵进去。
    - id: ch03
      title: 海中的求婚者
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            博内塔悉心教导格拉齐埃拉。公主长到将近成年，不仅才艺出众，性情也温柔善良。一天，她站在阳台上，看见一个古怪的身影从海里冒出来，便赶紧叫来博内塔。那东西有几分像人，脸色发蓝，披着海藻般的长长绿发。他朝塔游来，鲨鱼却完全不理他。
        - id: ch03-b02
          speaker: bonnetta
          text: >-
            那一定是个人鱼。
        - id: ch03-b03
          speaker: graziella
          text: >-
            你说他是个男人？我们快到门口去，走近些看清楚！
          emotion: surprised
        - id: ch03-b04
          speaker: narrator
          text: >-
            她们来到门边，人鱼也停下来端详公主。他做了许多手势，表示自己多么倾慕她。他的嗓音又粗又哑，发现两人听不懂，索性完全改用手势。人鱼还提着一个柳条编成的小篮子，里面装满珍奇贝壳，把它献给公主。格拉齐埃拉收下礼物，也用手势向他道谢。天色渐暗，她回到楼上，人鱼则一头扎回海里。
        - id: ch03-b05
          speaker: graziella
          text: >-
            刚才那东西长得真可怕！那些讨厌的鲨鱼为什么肯让他靠近？总不会所有男人都和他一个模样吧？
        - id: ch03-b06
          speaker: bonnetta
          text: >-
            当然不会。鲨鱼大概把他看作某种亲戚，这才没有袭击他。
        - id: ch03-b07
          speaker: narrator
          text: >-
            几天后，一阵古怪的音乐飘进塔里。人鱼又来了，头戴水草冠冕，正使出全身力气吹一只大海螺。格拉齐埃拉来到塔门，礼貌地收下珊瑚和其他海中奇物。从此，他每晚都来，有时吹海螺，有时潜入水中，在公主窗下做出各种怪相。公主只在阳台上点头致意，不管他怎样打手势，都不肯再到门边。
        - id: ch03-b08
          speaker: narrator
          text: >-
            又过几天，人鱼带来一位同族姑娘。她头发梳得很有品味，声音也格外悦耳。这个新来的客人终于劝动了公主和博内塔，让她们下楼相见。人鱼姑娘接连试过好几种语言，最后竟用她们的语言说起话来，还巧妙地称赞了格拉齐埃拉的美貌，叫两人十分惊喜。她看见塔底灌满海水，更是高兴，因为人鱼不能完全离开水生活。兄妹俩游进浴室，公主与博内塔则坐在四周的台阶上。
        - id: ch03-b09
          speaker: mermaid
          text: >-
            公主殿下，您离开陆地，想必是为了躲开成群的爱慕者。可是即使住在这里，恐怕也躲不开。我哥哥已经爱您爱得快没命了。要是我们城里的人见到您，他还会多出不少情敌呢。
        - id: ch03-b10
          speaker: narrator
          text: >-
            人鱼姑娘说，哥哥不能让公主听懂自己的话，为此非常难过。
        - id: ch03-b11
          speaker: mermaid
          text: >-
            我能替哥哥传话。有位仙女教过我好几种语言。
        - id: ch03-b12
          speaker: graziella
          text: >-
            原来海里也有仙女？
          emotion: surprised
        - id: ch03-b13
          speaker: mermaid
          text: >-
            当然有。不过我想，陆地上的仙女一定让您吃过不少苦。
        - id: ch03-b14
          speaker: narrator
          text: >-
            格拉齐埃拉从头讲起，把自己怎样被仙后关进高塔、怎样由鲨鱼日夜看守的经历，全都告诉了人鱼姑娘。人鱼姑娘听后十分同情她，也请她千万不要灰心。
        - id: ch03-b15
          speaker: mermaid
          text: >-
            也许有一天，您会找到摆脱困境的办法。
        - id: ch03-b16
          speaker: narrator
          text: >-
            人鱼姑娘的来访让公主很高兴，她带来的希望也让公主心里亮堂了一些。困在塔中这么久，她终于遇到一个新朋友，可以和对方说说话，这本身已经是一件难得的好事。
        - id: ch03-b17
          speaker: graziella
          text: >-
            我们还可以再认识几个海里的人。他们总不至于全像第一个人鱼那样丑。这样一来，我们至少不会再寂寞得那么难熬。
        - id: ch03-b18
          speaker: bonnetta
          text: >-
            年轻人真是满怀希望！我却有点怕这些海里的人。对了，你觉得那位被你迷住的情郎怎么样？
        - id: ch03-b19
          speaker: graziella
          text: >-
            我永远也不会爱他，我实在受不了他。不过，他妹妹说他们和玛丽娜仙女是亲戚。也许他们能帮上我们的忙。
        - id: ch03-b20
          speaker: narrator
          text: >-
            人鱼姑娘后来常来高塔探望。每次见面，她都要说起哥哥对公主的爱慕。格拉齐埃拉也一次次诉说，自己多么渴望逃出这座牢笼。她们就这样各说各的，说过了许多回。最后，人鱼姑娘终于答应带玛丽娜仙女来见她，希望那位仙女能替公主想出一个真正可行的办法。
    - id: ch04
      title: 画像与飞来的信
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            第二天，玛丽娜果真和人鱼姑娘一起来了。交谈片刻，她请格拉齐埃拉领自己参观高塔和塔顶花园。她虽然得拄拐杖，却还能走动。只要不时弄湿额头，仙女的本领足够让她在水外待很久。格拉齐埃拉欣然答应，博内塔留在楼下陪人鱼姑娘。到了花园，玛丽娜立刻问公主需要怎样的帮助。
        - id: ch04-b02
          speaker: narrator
          text: >-
            格拉齐埃拉又讲了一遍自己的遭遇。玛丽娜听完，便把能够给出的办法告诉她。
        - id: ch04-b03
          speaker: marina
          text: >-
            亲爱的公主，陆地上的事我帮不了你，我的法力超不出自己的水域。不过，只要你肯答应嫁给我表弟，就能来海里和我们一起生活。我顷刻间便能教会你游水潜水，让你的本领不输给任何一个海里的人。我还能使你的皮肤变得坚韧，却不损伤肤色。我表弟是海里最出色的婚配对象之一。我会再赐给他许多礼物，你一定能过得幸福。
        - id: ch04-b04
          speaker: narrator
          text: >-
            玛丽娜口才很好，说起来又滔滔不绝。格拉齐埃拉不免有些动心，答应认真考虑。她们正要离开花园，忽然看见一艘船靠近高塔，比从前任何船只都近。甲板上有位年轻男子，躺在华美的遮篷下，举着望远镜凝视高塔。她们还没来得及看清他的模样，船便渐渐远去了。两人在花园里分手，玛丽娜答应很快再来，随即离开了高塔。
        - id: ch04-b05
          speaker: narrator
          text: >-
            公主马上把玛丽娜的话一句句告诉博内塔。女教师很不喜欢事情的走向。她年纪已经不轻，可不想跟着公主一起被变成人鱼。博内塔把这件事翻来覆去想了很久，终于有了办法。她很会画画，第二天一早便画起一位英俊青年。他有漂亮的鬈发、俊秀的面容，还有一双可爱的蓝眼睛。画好以后，她拿给格拉齐埃拉看，好让公主亲眼明白，俊美的青年和那个海中求婚者究竟相差多远。
        - id: ch04-b06
          speaker: graziella
          text: >-
            世上真有这样好看的男子吗？
          emotion: surprised
        - id: ch04-b07
          speaker: bonnetta
          text: >-
            当然有，而且多得很。其实，比画像里还英俊的男子也大有人在。
        - id: ch04-b08
          speaker: graziella
          text: >-
            我简直不敢相信。可即使真有，我也永远见不到他们，他们也见不到我，又有什么用？我实在太不幸了！
          emotion: sad
        - id: ch04-b09
          speaker: narrator
          text: >-
            那天剩下的时间，公主一直望着画像。那个人鱼原有的一点希望，就这样全被画像毁了。几天后，玛丽娜回来问她想好了没有。格拉齐埃拉几乎不理她，对那桩婚事更是满脸厌恶。玛丽娜恼怒极了，气冲冲地离开高塔。
        - id: ch04-b10
          speaker: narrator
          text: >-
            公主并不知道，她已经征服了另一颗心。先前那艘船上，坐着世上最英俊的王子布隆代尔。他听过魔塔的传说，决心尽量靠近。透过船上的强力望远镜，他清楚看见格拉齐埃拉，立刻深深地爱上了她。王子想把船径直驶向高塔，再乘小艇划过去。全体船员却跪在他脚下，求他不要冒险，船长也恳切地劝阻。
        - id: ch04-b11
          speaker: captain
          text: >-
            殿下这样做，只会带着大家一同送死。请把船停在靠近陆地的地方。我认识一位善良的仙女，她一向愿意帮我的忙。我去找她，她一定肯设法帮助殿下。
        - id: ch04-b12
          speaker: narrator
          text: >-
            王子虽然很不情愿，最后还是听从了这番合乎情理的劝告。他在离高塔最近的陆地登岸，立刻派船长去求仙女指点和帮助，自己则命人在岸边搭起帐篷。等待的日子里，他把全部时间都用来凝望高塔，一遍遍从望远镜里寻找公主。几天后，船长终于带着仙女归来。王子欢喜极了，对她殷勤备至。
        - id: ch04-b13
          speaker: kind_fairy
          text: >-
            这件事我已经听说了，我们不要耽误时间。我先派一只可靠的鸽子去试探魔法。只要有一处薄弱的地方，它准能找到，也能钻进塔里。我会叫它带一朵花回来，作为成功的凭证。它若办得到，我就很有把握也把殿下送进去。
        - id: ch04-b14
          speaker: blondel
          text: >-
            我能不能让鸽子带封信去，把我的爱意告诉公主？
        - id: ch04-b15
          speaker: kind_fairy
          text: >-
            当然可以，这个主意很好。
        - id: ch04-b16
          speaker: narrator
          text: >-
            王子马上写了一封信。
        - id: ch04-b17
          speaker: blondel
          text: >-
            美丽的公主，我倾心爱慕着您。请收下我的真心，也请相信，为了终结您的苦难，无论什么事我都愿意去做。布隆代尔。
        - id: ch04-b18
          speaker: narrator
          text: >-
            信系在鸽子颈上，鸽子立刻起飞。临近高塔时，一阵狂风迎面吹来，叫它无法前进。它没有认输，而是小心绕着塔顶飞了一圈。终于，它找到一处没有受到魔法保护的地方，飞快钻进凉亭，等着公主。
        - id: ch04-b19
          speaker: narrator
          text: >-
            格拉齐埃拉不久便独自来到花园。鸽子扑扇着翅膀迎上去，显得那么驯顺，公主忍不住停下来抚摸它。这时，她看见鸽子颈上系着粉红丝带，下面还拴着一封信。她把信读了好几遍，随后写下回信。
        - id: ch04-b20
          speaker: graziella
          text: >-
            你说你爱我，可我还没有见过你，不能答应也爱你。请让这位忠实的信使送来你的画像。要是我把画像退还，你就必须放弃希望。要是我把它留下，你便会明白，帮助我也是在帮助你自己。格拉齐埃拉。
        - id: ch04-b21
          speaker: narrator
          text: >-
            鸽子还记得仙女要它带回一朵花。它看见公主衣襟上别着一朵，便把花偷走，展翅飞回岸边。王子收到回信，简直欣喜若狂。鸽子休息了一小时，又带着王子随身携带的一幅小画像飞向高塔。
        - id: ch04-b22
          speaker: narrator
          text: >-
            这回，它在花园里找到了公主。格拉齐埃拉赶紧解下丝带，打开画像的小匣子。画中人竟和博内塔画的青年十分相像，她又惊又喜，立刻叫鸽子回去。王子见鸽子独自归来，知道公主留下了自己的画像，那份欢喜自然不难想象。
    - id: ch05
      title: 魔法终于破解
      blocks:
        - id: ch05-b01
          speaker: kind_fairy
          text: >-
            现在不能再耽误了。我要让殿下如愿，只能先把您变成一只鸟。不过到了恰当的时候，我一定会让您恢复原形。
        - id: ch05-b02
          speaker: narrator
          text: >-
            王子迫不及待地要出发。仙女用魔杖轻轻一点，把他变成了一只无比可爱的蜂鸟，却保留了他说话的本领。那只可靠的鸽子在前面为他引路。
        - id: ch05-b03
          speaker: narrator
          text: >-
            格拉齐埃拉看见一只从未见过的鸟儿，正觉得惊奇，它忽然飞到她面前开了口。
        - id: ch05-b04
          speaker: blondel
          text: >-
            早安，亲爱的公主。
        - id: ch05-b05
          speaker: narrator
          text: >-
            公主喜欢极了这只漂亮的小鸟，让它停在自己的手指上。
        - id: ch05-b06
          speaker: blondel
          text: >-
            亲亲小鸟儿吧，亲一亲吧。
        - id: ch05-b07
          speaker: narrator
          text: >-
            格拉齐埃拉高高兴兴地亲了它，还不停抚摸它、逗它玩。她那天起得很早，过了一会儿便困倦起来。正午的阳光很热，她走到凉亭的阴影中，躺在长满青苔的坡地上，把漂亮的小鸟轻轻贴在胸口。就在她将要睡着的时候，远处的仙女算准了时机，施展法术，让王子恢复原形。格拉齐埃拉睁开双眼，发现自己正躺在一个爱慕者的怀中，而她也爱着眼前这个人。
        - id: ch05-b08
          speaker: narrator
          text: >-
            就在这一刻，束缚公主的魔法解除了。高塔开始摇晃，塔身裂开。博内塔急忙奔上塔顶，至少要和亲爱的公主死在一起。她刚赶到花园，帮助王子的仙女便和普拉西达一同飞来。她们坐着一辆威尼斯玻璃制成的车，由六只鹰拉着。
        - id: ch05-b09
          speakers: [kind_fairy, placida]
          ensemble: duo
          text: >-
            快上车，高塔马上就要沉了！
        - id: ch05-b10
          speaker: narrator
          text: >-
            王子、公主和博内塔不敢耽搁，立刻登上车。车子刚刚升入空中，高塔便发出一声可怕的巨响，整个沉进了大海深处。原来，玛丽娜和那些海中人鱼为了报复格拉齐埃拉，暗中毁掉了高塔的根基。幸好他们的恶毒计划最终落了空。两位善良的仙女驾着玻璃车，带众人飞向格拉齐埃拉父母的王国。
        - id: ch05-b11
          speaker: narrator
          text: >-
            众人回到王国，才知道穆蒂诺莎王后早在几年前便去世了。她那善良的丈夫仍平静地生活着，把国家治理得井井有条，百姓也安乐幸福。国王终于见到失散多年的女儿，喜不自胜。美丽的公主平安归来的消息传开，全国上下都沉浸在欢庆之中。
        - id: ch05-b12
          speaker: narrator
          text: >-
            第二天，布隆代尔王子和格拉齐埃拉公主便举行了婚礼。此后的许多天里，舞会、宴席、比武大会、音乐会和各种娱乐从白天一直办到夜晚，一项接着一项，整个王国始终热闹非凡。所有仙女都被恭敬地请来。她们盛装出席，答应永远庇护这对年轻夫妇，还送上了各种美好礼物。
        - id: ch05-b13
          speaker: narrator
          text: >-
            王子和公主就这样幸福地相守到老。人人都爱戴他们，而岁月越久，他们也爱彼此越深。
