audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 轻快而诙谐
        timbre: 温暖清亮
        pace: 舒缓
        pitch: 中音
  chapters:
    - id: ch01
      title: 圈栏里的西芹香菜
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 西芹香菜住在圈栏里。
    - id: ch02
      title: 天天来的绅士
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 她给绅士们酿上好的麦酒。绅士们每天都来。
    - id: ch03
      title: 逃走了
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 后来，西芹香菜逃走了。
