audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 轻快而亲切
        timbre: 温暖清亮
        pace: 舒缓
        pitch: 中音
  chapters:
    - id: ch01
      title: 雪白的裙袄
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 瞧，她穿着白裙袄。
    - id: ch02
      title: 红红的鼻头
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 她的鼻头红彤彤的。
    - id: ch03
      title: 越来越短
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 她站得越久，身子就缩得越短。
