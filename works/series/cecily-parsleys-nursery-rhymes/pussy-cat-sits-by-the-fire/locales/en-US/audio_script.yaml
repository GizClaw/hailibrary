  chapters:
    - id: ch01
      title: By the Fire
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Pussy-cat sits by the fire. Doesn't she look fair? In walks the little dog.
        - id: ch01-b02
          speaker: little_dog
          text: Pussy, are you there? How are you, Mistress Pussy? Tell me, how are you?
        - id: ch01-b03
          speaker: mistress_pussy
          text: Thank you kindly, little dog. I fare as well as you!
