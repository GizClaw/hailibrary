audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 俏皮而富有轻柔韵律
        timbre: 温暖清亮
        pace: 从容
        pitch: 中音
    little_dog:
      display_name: 小狗儿
      tts:
        delivery: 友善而热切
        timbre: 明亮清脆
        pace: 轻快
        pitch: 中高音
    mistress_pussy:
      display_name: 猫咪太太
      tts:
        delivery: 亲切有礼，略带俏皮
        timbre: 柔和清亮
        pace: 舒缓
        pitch: 中高音
  chapters:
    - id: ch01
      title: 炉火旁
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 猫咪坐在炉火旁。她过得怎么样呢？
    - id: ch02
      title: 小狗来了
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 这时，小狗儿走了进来。
        - id: ch02-b02
          speaker: little_dog
          text: 猫咪，你在吗？
    - id: ch03
      title: 彼此问候
      blocks:
        - id: ch03-b01
          speaker: little_dog
          text: 猫咪太太，你好呀！近来怎么样？
        - id: ch03-b02
          speaker: mistress_pussy
          text: 谢谢你惦记，小狗儿。我呀，跟你一样好！
