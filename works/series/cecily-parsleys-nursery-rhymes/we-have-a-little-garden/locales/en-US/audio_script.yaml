  chapters:
    - id: ch01
      title: Our Little Garden
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: We have a little garden, all our own.
    - id: ch02
      title: Seeds We Have Sown
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: Every day, we water the seeds we've sown there.
    - id: ch03
      title: We Tend It with Care
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: We love our little garden and tend it with care. There's not a faded leaf or blighted blossom there.
