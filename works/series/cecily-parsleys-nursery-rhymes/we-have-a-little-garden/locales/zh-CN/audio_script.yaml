audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 轻快而亲切
        timbre: 温暖清亮
        pace: 舒缓
        pitch: 中音
  chapters:
    - id: ch01
      title: 我们的小花园
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 我们有座自己的小花园，那是我们的小天地。
    - id: ch02
      title: 亲手播下的种子
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 每天，我们都去园里浇水，照看亲手播下的种子。
    - id: ch03
      title: 仔细照料
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 我们爱这座小花园，总是仔细照料。园里没有枯叶，也没有染病的花。
