cover_prompt: |-
  A wordless cover gathering of cheerful nursery-rhyme animals takes place in an early-twentieth-century English cottage garden. Cecily Parsley is a small brown rabbit in a simple blue skirt and white apron, standing beside a patch of parsley, while a gray goose, three pink piglets, a black cat by a hearth, and three tiny mice form a playful procession. Cecily offers a garden leaf toward the curious animals, making her welcoming gesture the focal action. Low stone walls, hollyhocks, a thatched cottage, and a wooden gate establish the rural period without modern details. Use a child-height wide view with the figures arranged in a gentle arc and generous pale sky above the cottage. Keep the animal clothing modest and original, based on the verses rather than any later commercial character design. No readable text, letters, numbers, labels, logos, captions, speech bubbles, signatures, or watermarks.
