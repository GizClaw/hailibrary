    - id: ch01
      title: Three Blind Mice
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Three blind mice. See how they run!
    - id: ch02
      title: After the Farmer's Wife
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: They all run after the farmer's wife. She cuts off their tails with a carving knife.
    - id: ch03
      title: Such a Sight
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: Ever see such a thing in your life? Three blind mice!
