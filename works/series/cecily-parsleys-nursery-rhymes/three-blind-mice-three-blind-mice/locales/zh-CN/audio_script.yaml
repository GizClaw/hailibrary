audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 轻快而诙谐，结尾带着惊叹
        timbre: 温暖清亮
        pace: 舒缓
        pitch: 中音
  chapters:
    - id: ch01
      title: 三只瞎眼老鼠
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 快瞧，它们跑得多快！
    - id: ch02
      title: 追着农夫妻子
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 它们一齐追着农夫的妻子跑。她用切肉刀，把它们的尾巴全砍掉了。
    - id: ch03
      title: 这样的怪事
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 你这一辈子可曾见过这样的怪事？三只瞎眼老鼠！
