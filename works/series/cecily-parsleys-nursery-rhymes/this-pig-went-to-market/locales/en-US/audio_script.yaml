audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: playful and gently rhythmic
        timbre: warm and clear
        pace: measured
        pitch: medium
    little_pig:
      display_name: Little Pig
      tts:
        delivery: young and plaintive
        timbre: light and clear
        pace: moderate
        pitch: high
  chapters:
    - id: ch01
      title: Market and Home
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: One pig went to market. One stayed home.
    - id: ch02
      title: Meat or None
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: One pig had a bit of meat. One had none.
    - id: ch03
      title: The Way Home
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: The pig cried,
        - id: ch03-b02
          speaker: little_pig
          text: Wee! Wee! Wee! I can't find my way home.
          emotion: sad
