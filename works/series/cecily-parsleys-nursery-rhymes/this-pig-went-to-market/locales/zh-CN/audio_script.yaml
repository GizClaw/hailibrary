audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 轻快而诙谐
        timbre: 温暖清亮
        pace: 舒缓
        pitch: 中音
    little_pig:
      display_name: 小猪
      tts:
        delivery: 稚嫩而委屈
        timbre: 轻柔清亮
        pace: 适中
        pitch: 高音
  chapters:
    - id: ch01
      title: 赶集和守家
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 一只小猪赶集去了，另一只留在家里。
    - id: ch02
      title: 有肉和没肉
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 一只小猪分到一点肉，另一只什么也没有。
    - id: ch03
      title: 找不到回家的路
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 最后那只小猪急得哭了起来。
        - id: ch03-b02
          speaker: little_pig
          text: 呜！呜！呜！我找不到回家的路！
          emotion: sad
