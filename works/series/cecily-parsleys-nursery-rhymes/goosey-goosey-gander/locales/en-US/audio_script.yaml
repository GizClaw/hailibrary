  chapters:
    - id: ch01
      title: Where Will Goosey Go?
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Goosey, goosey, gander, where will you roam?
    - id: ch02
      title: Up and Down
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: Upstairs, then downstairs,
    - id: ch03
