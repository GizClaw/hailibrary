audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 轻快而诙谐
        timbre: 温暖清亮
        pace: 舒缓
        pitch: 中音
  chapters:
    - id: ch01
      title: 大公鹅要去哪儿
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 大公鹅呀，你要去哪儿？
    - id: ch02
      title: 楼上楼下
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 上楼，下楼，到处游逛。
    - id: ch03
      title: 夫人的闺房
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 还要去我家夫人的闺房！
