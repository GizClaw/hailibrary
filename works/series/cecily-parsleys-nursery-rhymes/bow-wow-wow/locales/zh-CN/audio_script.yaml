audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 轻快而亲切
        timbre: 温暖清亮
        pace: 舒缓
        pitch: 中音
    questioner:
      display_name: 问话人
      tts:
        delivery: 好奇而自然
        timbre: 清澈柔和
        pace: 适中
        pitch: 中音
    dog:
      display_name: 小狗
      tts:
        delivery: 天真而神气
        timbre: 明亮稚嫩
        pace: 轻快
        pitch: 中高音
  chapters:
    - id: ch01
      title: 谁家的狗
      blocks:
        - id: ch01-b01
          speaker: questioner
          text: 你是谁家的狗？
    - id: ch02
      title: 小狗回答
      blocks:
        - id: ch02-b01
          speaker: dog
          text: 我是小汤姆·廷克家的狗。
    - id: ch03
      title: 汪，汪，汪
      blocks:
        - id: ch03-b01
          speaker: dog
          text: 汪，汪，汪！
