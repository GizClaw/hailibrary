  chapters:
    - id: ch01
      title: "CHAPTER X. WHITE WINGS AND A BROWNIE"
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            First, you had better hear exactly how Edred got even with old Parrot-nose, as he called it. Master Parados was the Arden children's tutor in King James the First's time. His listening at doors and carrying tales had put Edred and Elfrida in the Tower of London. There was hardly any time left for getting even with anyone. And of course, getting even with people is not at all proper. Still, Edred did it.
        - id: ch01-b02
          speaker: narrator
          text: >-
            Edred had rescued Elfrida from the Tower in the same way Lady Nithsdale once rescued her husband. Now the children were back at Arden House in Soho with Cousin Richard. Their old nurse, who was also an old witch, had warned them that they must hurry.
        - id: ch01-b03
          speaker: edred
          text: "But I have to pay old Parrot-nose back before we go."
        - id: ch01-b04
          speaker: narrator
          text: >-
            Edred felt wonderfully brave and splendid inside after planning Elfrida's escape and carrying it through. The success of his Nithsdale plan had given him a very grand opinion of himself. Besides, he could not bear to return to his own century without somehow showing Mr. Parados just what he thought of him.
        - id: ch01-b05
          speaker: narrator
          text: >-
            But Cousin Richard must not help. Edred and Elfrida would speak a poem to summon the Mouldiwarp, and it would find them some white road back to their own time. Richard could not go with them. He would stay behind and take all the blame for whatever they did. The brother and sister settled this in a hurried, whispered conference. Richard demanded to know what they were discussing. He had wanted to punish Parrot-nose for four years, so why should he be left out now?
        - id: ch01-b06
          speaker: elfrida
          text: "If we explain, you won't believe a word of it."
        - id: ch01-b07
          speaker: richard
          text: "You could at least try me."
        - id: ch01-b08
          speaker: narrator
          text: >-
            So they told him everything as quickly as they could. Even so, it took a while. Richard listened closely and said nothing when they had finished.
        - id: ch01-b09
          speaker: edred
          text: "You don't believe us. I knew you wouldn't. Never mind. What can we do to old Parrot-nose?"
        - id: ch01-b10
          speaker: richard
          text: >-
            I don't like this at all. It has never happened this way before. Now none of it feels real. I suppose it really is only a dream, though I always believed it wasn't.
        - id: ch01-b11
          speaker: edred
          text: >-
            I don't understand a word you're saying, but our story is true anyway. Look at this. I bet you have nothing like it. It comes from our time, ever so far ahead in history, from the place we belong. Those years haven't happened yet, at least not while we're standing here. You won't even know what this thing is. It's a machine that lets the sun make pictures.
        - id: ch01-b12
          speaker: narrator
          text: >-
            He darted to a dark corner of the parlor and brought out the camera he had hidden behind a curtain.
        - id: ch01-b13
          speaker: richard
          text: >-
            Oh, stop it. I know now that this is a silly dream, but I won't pretend I don't know a Kodak. That's a Brownie.
        - id: ch01-b14
          speaker: narrator
          text: >-
            For a moment, nobody could speak.
        - id: ch01-b15
          speaker: elfrida
          text: >-
            If you've dreamed about our time, then perhaps you can believe we're dreaming about yours. Did you dream of anything besides Brownies? Fine carriages, perhaps, or boats, or—
        - id: ch01-b16
          speaker: richard
          text: >-
            Don't talk to me as though I were a baby. I know all about railways and steamboats. I know the Hippodrome and the Crystal Palace. I even know that Kent scored six hundred and fifteen against Derbyshire last Thursday. Now what do you say to that?
        - id: ch01-b17
          speaker: edred
          text: "But how? Do tell us!"
        - id: ch01-b18
          speaker: richard
          text: >-
            I won't tell you another thing. But I'll help you with Parrot-nose. I don't care if you leave me here. Let's shovel all the snow from the roof into his room and take our chances.
        - id: ch01-b19
          speaker: narrator
          text: >-
            Edred and Elfrida would have preferred a cleverer revenge, but there was no time to invent one.
        - id: ch01-b20
          speaker: richard
          text: "I know where the shovels are, unless the dream has muddled them up."
        - id: ch01-b21
          speaker: edred
          text: "I say, I'd like to write down that score for Kent and check it afterward."
        - id: ch01-b22
          speaker: narrator
          text: >-
            A quill stood in the pewter inkpot on their lesson table, but there was no paper.
        - id: ch01-b23
          speaker: richard
          text: "Here, be quick. I'll write it for you."
        - id: ch01-b24
          speaker: narrator
          text: >-
            Richard pulled a sheet from inside his doublet, wrote on it, crumpled it up, and gave it to Edred. Edred tucked it into his own doublet.
        - id: ch01-b25
          speaker: narrator
          text: >-
            Then all three climbed onto the roof. They groped through the snow until they found the edge of the skylight above the tutor's attic room. They smashed its thick glass with the edges of their spades and shoveled in load after load of heavy white snow. Angry shouts and fierce words rose from the room below. The louder Mr. Parados shouted, the harder the children shoveled.
        - id: ch01-b26
          speaker: narrator
          text: >-
            Mr. Parados came stumbling and shivering onto the roof. The children slipped behind the chimney stack, reached the trapdoor first, bolted it beneath him, and called up together.
        - id: ch01-b27
          speakers: [edred, elfrida, richard]
          ensemble: chorus
          text: "A-ha!"
        - id: ch01-b28
          speaker: narrator
          text: >-
            On their way downstairs they locked his bedroom door too. They left Mr. Parados free to choose between two unpleasant paths. He could stand on the snowy roof and shout down to the street until someone came to help him. Or he could drop through the broken skylight into the great heap of snow they had shoveled into his room. The choice was entirely his. The children never learned which path he chose, and neither will you.
        - id: ch01-b29
          speaker: narrator
          text: >-
            The witch-nurse sent Richard to bed, and he went. Then the children summoned the Mouldiwarp. It declared that they must jump from the roof to reach their own time. Unfortunately, Mr. Parados was still up there. Worse yet, soldiers were striking the front door with the butts of their pistols.
        - id: ch01-b30
          speaker: edred
          text: "We can't use the roof. Mr. Parados is up there."
        - id: ch01-b31
          speaker: narrator
          text: "Edred explained what they had done."
        - id: ch01-b32
          speaker: mouldiwarp
          text: >-
            Humph. That's terr'ble unfortunate. The window on the top landing will have to serve. Where's the other child?
        - id: ch01-b33
          speaker: nurse
          text: "In bed."
        - id: ch01-b34
          speaker: mouldiwarp
          text: >-
            Te-he! Some people are too clever by half. And you call yourself a witch, yet you never found that out. Te-he!
        - id: ch01-b35
          speaker: narrator
          text: >-
            All the while, the soldiers kept pounding furiously at the front door. Elfrida clutched the Mouldiwarp, Nurse caught Edred by the hand, and all four raced up flight after flight to the very top landing. A small window waited at the far end. The air there was already sharp and cold. The window opened only with great difficulty, and when it finally moved, the freezing air outside made the landing colder still.
        - id: ch01-b36
          speaker: mouldiwarp
          text: "Off you go. Ladies first!"
        - id: ch01-b37
          speaker: elfrida
          text: "You can't really mean we're supposed to jump out into nothing!"
          emotion: fearful
        - id: ch01-b38
          speaker: mouldiwarp
          text: >-
            I mean you're to jump, right enough. What you land in is anybody's guess, and my concern anyway.
        - id: ch01-b39
          speaker: elfrida
          text: "Isn't it a little bit our concern too?"
          emotion: fearful
        - id: ch01-b40
          speaker: narrator
          text: >-
            Her teeth chattered, though she always claimed later that this was only from the cold. The Mouldiwarp began to disappear.
        - id: ch01-b41
          speaker: mouldiwarp
          text: "Then find your own way home."
        - id: ch01-b42
          speaker: elfrida
          text: "Oh, don't! Please don't go!"
          emotion: fearful
        - id: ch01-b43
          speaker: narrator
          text: "Below them, the blows against the door grew louder."
        - id: ch01-b44
          speaker: mouldiwarp
          text: >-
            If I stay, you must go. Put me down and jump, for goodness' sake!
        - id: ch01-b45
          speaker: narrator
          text: >-
            The Mouldiwarp stopped vanishing, and Elfrida set it down. Suddenly Nurse swept Elfrida into her arms and kissed her again and again.
        - id: ch01-b46
          speaker: nurse
          text: >-
            Farewell, my honey love. Not every parting lasts forever, or I could scarcely let you go. Climb up now. Put your foot on the beam, then your knee on the sill. There. Jump!
        - id: ch01-b47
          speaker: narrator
          text: >-
            Elfrida crouched on the window ledge, where the snow lay thick and crisp. It was bitterly cold. Have you ever had to leap from a top-floor window into darkness while snow fell around you? If you have, you know exactly how much courage it takes. Elfrida clenched her teeth and stared down into black emptiness, speckled with drifting white flakes. Then she looked back into the black passage behind her. Nurse's small rushlight was the only light there.
        - id: ch01-b48
          speaker: elfrida
          text: "Edred will be all right, won't he? You're certain he'll jump?"
          emotion: fearful
        - id: ch01-b49
          speaker: edred
          text: "Of course I will. Let me go first and prove I'm no coward."
        - id: ch01-b50
          speaker: narrator
          text: >-
            That settled it. Elfrida jumped at once, and Edred followed the next moment. It was a dreadful instant. However much they trusted the Mouldiwarp, they could not suddenly forget what they had been taught all their lives. Anyone who jumped from a top-floor window ought to be smashed on the stones below. They remembered that certain danger and still jumped clear. That was truly brave, and brave deeds earn their reward sooner or later.
        - id: ch01-b51
          speaker: narrator
          text: >-
            Their reward came very soon. As Elfrida fell, she saw the snowflakes gather and thicken into a cloud beneath her. This was not the sort of cloud that lets you fall through. It felt as solid and soft as a great mound of eiderdown feathers. Whether it rose to catch her or she dropped onto it, she never knew. The next moment Edred was beside her. Then the white, downy softness began shaping itself around and beneath them. It made a seat with a back, arms at the sides, and a place for their feet.
        - id: ch01-b52
          speaker: elfrida
          text: "What have you got in your hand?"
        - id: ch01-b53
          speaker: edred
          text: "Reins. White reins. This is a carriage."
        - id: ch01-b54
          speaker: narrator
          text: >-
            It was a carriage made entirely from white snowflakes, yet every flake was warm and soft as a feather. White carriage rugs curled around the children and tucked themselves in snugly, all without any help. Magic had woven the snowflake reins together so that they felt like warm white velvet in Edred's hands. There was only one surprise left. The creatures pulling this carriage were not horses at all.
        - id: ch01-b55
          speaker: elfrida
          text: "Those aren't horses. They're swans! Six white swans!"
          emotion: surprised
        - id: ch01-b56
          speaker: mouldiwarp
          text: "All white things obey me."
        - id: ch01-b57
          speaker: narrator
          text: >-
            The Mouldiwarp's voice floated softly from somewhere behind and above. Edred knew how to drive, and he could not resist one last joke. He guided the six swans around to the front of Arden House. They swooped just over the soldiers who were still beating on the door.
        - id: ch01-b58
          speaker: edred
          text: "Ha, ha! Fooled again!"
          emotion: happy
        - id: ch01-b59
          speaker: narrator
          text: >-
            The soldiers looked thoroughly startled. Edred wheeled the swans around and drove swiftly through the air. Without being told, he knew exactly which way to go. As the carriage turned, both children had a strange, sudden vision. A smaller snow carriage, drawn by only two swans, circled above their own. It vanished into the deep darkness of the sky, but not before they caught one tantalizing glimpse of a familiar face. They knew it, and yet they could not remember it clearly enough to name its owner.
        - id: ch01-b60
          speaker: narrator
          text: >-
            The swans spread their mighty white wings into the air. Their long, strong necks strained against their collars, and the snowy carriage streamed out of London like a slender white scarf driven before the wind. Soon the city and its snowstorm lay behind them. A dark blue sky arched overhead, jeweled with the quiet silver of watchful stars. Far below, the Kentish countryside was a deeper darkness. Quiet golden lights shone from the windows of farms already half asleep.
        - id: ch01-b61
          speaker: narrator
          text: >-
            The rushing air against their faces no longer felt cold. It was as soft as the air in June, and Elfrida always declared afterward that she smelled white lilies throughout the journey. On and on they flew across the darkened counties, above sleeping houses and fields. The ride was more wonderful than any they had taken before. They never had one like it again.
        - id: ch01-b62
          speaker: narrator
          text: >-
            All too soon, the swans glided to a stop outside the window of a tower at Arden Castle. The children did not know this tower, but there could be no doubt that they were meant to climb through its open window.
        - id: ch01-b63
          speaker: elfrida
          text: >-
            Dear swans, couldn't we stay in the carriage until daylight? We want so much to photograph the castle.
        - id: ch01-b64
          speaker: narrator
          text: >-
            The swans shook their flat, white, snakelike heads as though they understood every word. The open window stood before the children and seemed to be waiting to welcome them. Very unwillingly, they climbed out of the soft carriage and into the unknown tower. They found themselves alone in a dark room, and it was very cold.
        - id: ch01-b65
          speaker: narrator
          text: >-
            Before they had time to think about how cold and uncomfortable the night would be, six swan heads appeared at the window. The birds said something in their own language.
        - id: ch01-b66
          speaker: elfrida
          text: "I wish we'd learned Swanish at school instead of French!"
        - id: ch01-b67
          speaker: narrator
          text: >-
            It did not matter. The swans ducked out of sight and rose again with the soft white carriage rugs in their beaks. With their strong wings, they pushed the rugs through the window and made a few more remarks in Swanish.
        - id: ch01-b68
          speakers: [edred, elfrida]
          ensemble: duo
          text: "Thank you! Goodbye, goodbye!"
        - id: ch01-b69
          speaker: narrator
          text: >-
            Wide wings rushed away into the night. The exhausted children curled up together on the hard tower floor and wrapped themselves in the soft rugs. The happiest sort of dreams seemed to be tucked into those coverlets with them. The night passed as though it were no time at all. When they woke, winter sunlight was already looking in through the tower's narrow windows.
        - id: ch01-b70
          speaker: narrator
          text: >-
            Elfrida sprang up and tossed aside her silver-white, downy coverlet. At once it tore itself into five pieces, each with a different shape and size. Before her eyes, the pieces screwed themselves up, drew themselves inward, and puffed themselves out again. They became a silver basin filled with warm water, a cake of lily-scented soap, a towel, a silver comb, and an ivory toothbrush.
        - id: ch01-b71
          speaker: elfrida
          text: "Well!"
          emotion: surprised
        - id: ch01-b72
          speaker: narrator
          text: >-
            Elfrida used all five things to make her simple morning toilet. As soon as she finished, the basin, soap, towel, toothbrush, and comb ran together like bright drops of quicksilver. For a moment they made a curious, tousled lump. Then the lump straightened itself and became the fluffy white coverlet again.
        - id: ch01-b73
          speaker: elfrida
          text: "Well!"
          emotion: surprised
        - id: ch01-b74
          speaker: narrator
          text: >-
            Elfrida woke Edred, and his coverlet performed the same clever and pretty trick for him. Later, the children took the Brownie camera and prepared to explore the castle. The shining coverlets jumped up and changed into two white fur coats, finer than anything even very rich motorists might wear. One coat came politely to the side of each child. It held out its sleeves as though saying, “Please be so kind as to put me on.” Naturally, both children obliged.
        - id: ch01-b75
          speaker: narrator
          text: >-
            They crept down the narrow corkscrew staircase and passed through a heavy door beneath the arch of the great gateway. The castle gate stood open. Across from them, a soldier sat on another doorstep with his helmet held between his knees. He whistled as he scoured the metal with sand. When he saw the children, he touched his forehead with one sandy hand but did not get up.
        - id: ch01-b76
          speaker: castle_guard
          text: "You're out early."
        - id: ch01-b77
          speaker: narrator
          text: "He went on polishing his helmet."
        - id: ch01-b78
          speaker: elfrida
          text: "It's such a lovely day. May we go outside?"
        - id: ch01-b79
          speaker: castle_guard
          text: >-
            You're welcome to. Just stay within the twelve-acre field, where no rough folk or Egyptians can trouble you. Don't wander far. Breakfast will soon call you back loudly enough.
        - id: ch01-b80
          speaker: narrator
          text: >-
            The children stepped out, but their shoes did not touch the turf. Instead, the wooden planks beneath them rang hollow.
        - id: ch01-b81
          speaker: edred
          text: "It's a drawbridge! Look, there's a moat, and the edges have cat-ice on them."
          emotion: surprised
        - id: ch01-b82
          speaker: narrator
          text: >-
            So there was. Thin cat-ice covered the water along the moat's edges. At the far side, brown and yellow reeds and sedge stood with their feet frozen into it. Their dry stems whispered and rustled as a wild duck suddenly flew out from among them.
        - id: ch01-b83
          speaker: elfrida
          text: "How lovely! I wish our Arden still had a moat."
        - id: ch01-b84
          speaker: edred
          text: "If we find where its water comes from, we might restore it after we find the treasure."
        - id: ch01-b85
          speaker: narrator
          text: >-
            They crossed the bridge, and frozen dew crackled beneath their feet as they walked over the grass. Before photographing the castle, they set off to discover where the moat water came from. They found that a stream flowed from Arden Knoll and ran all the way across the field. It entered the moat at the northeast corner and left it again from the corner in the southwest.
        - id: ch01-b86
          speaker: narrator
          text: >-
            They followed the stream until they reached the middle of the field and stood well away from the castle. Only then did they see how beautiful the whole building was. It was quite perfect and complete. Not one arch had crumbled. Not one pillar was broken. There were no shattered stones and no battered gaps in any wall.
        - id: ch01-b87
          speaker: edred
          text: "It's beautiful! I'm so glad we have a castle like this."
          emotion: happy
        - id: ch01-b88
          speaker: elfrida
          text: "Our castle doesn't look like this."
        - id: ch01-b89
          speaker: edred
          text: "It will when we find the treasure. You did bring both rolls of film, didn't you?"
        - id: ch01-b90
          speaker: elfrida
          text: "Yes. They're in this enormous pocket under my skirt. Oh, look! Where has the stream gone? It just stops!"
          emotion: surprised
        - id: ch01-b91
          speaker: narrator
          text: >-
            The great awkward pocket beneath Elfrida's full skirt swung and bumped against her legs. Beside them, the swift stream looked like a strip of steel-gray ribbon laid across the green cloth of the field. Halfway over, that ribbon seemed to stop. It was as though giant scissors had snipped it off and someone had rolled up the missing length and put it safely away.
        - id: ch01-b92
          speaker: edred
          text: "My hat, it really does end!"
          emotion: surprised
        - id: ch01-b93
          speaker: narrator
          text: >-
            Curiosity sent Edred running, and Elfrida raced after him. At the place where the giant scissors seemed to have cut the ribbon, they found that the stream had apparently grown tired of flowing above ground. Without the slightest warning, it plunged straight into the earth through a hole less than eight feet wide. Its bed did not slope downward. Its banks did not grow any deeper. The water simply dropped away.
        - id: ch01-b94
          speaker: narrator
          text: >-
            The children stood fascinated and watched the water shoot over the rim of the hole. It looked like a smooth and shining steel band racing around a driving wheel. The stream rushed downward so swiftly and evenly that it hardly seemed to be moving at all.
        - id: ch01-b95
          speaker: edred
          text: >-
            I could watch it forever. But we'll bring it back one day. Come on, let's find where it begins.
        - id: ch01-b96
          speaker: elfrida
          text: "Photograph this first, so we'll know the place."
        - id: ch01-b97
          speaker: narrator
          text: >-
            The Brownie clicked twice. Then they retraced their steps beside the stream, walked around two sides of the moat, and crossed the field toward Arden Knoll. There they found another wonder. The stream came straight out of the Knoll at the place where the hill joined the rest of the world. A rough, low arch of stone lay close above the very edge of the water.
        - id: ch01-b98
          speaker: elfrida
          text: >-
            So this is where it starts, and that hole is where it goes. What happened to it? Why isn't it at Arden now?
        - id: ch01-b99
          speaker: edred
          text: "We'll bring it back when we find the treasure."
        - id: ch01-b100
          speaker: narrator
          text: "The Brownie clicked again."
        - id: ch01-b101
          speaker: elfrida
          text: "And we'll rebuild the castle just as it is now. Come on, let's take the pictures."
        - id: ch01-b102
          speaker: narrator
          text: >-
            They returned to the castle and photographed it from the north, south, east, and west. They took it from the northeast and southeast. Then came the north-northwest and all the other points of the compass they could manage. I could easily tell you the name of every direction if I chose, but why should a story become tiresome and instructive?
        - id: ch01-b103
          speaker: narrator
          text: >-
            At last they crossed the hollow, echoing drawbridge again. The soldier had polished his helmet to his complete satisfaction and now wore it. On the bridge, the children held a brief but eager argument, and breakfast was the whole subject. Edred wanted to stay and discover what country people ate for breakfast in King James the First's time. Elfrida wanted to return to 1908 and the comforting certainty of eggs and bacon.
        - id: ch01-b104
          speaker: elfrida
          text: >-
            If we stay, we'll be pulled into another adventure. History is always making adventures happen to us, and I'm tired. Oh, Edred, please come home!
        - id: ch01-b105
          speaker: edred
          text: "I think they're cooking ducks. It smells like onion stuffing."
        - id: ch01-b106
          speaker: elfrida
          text: >-
            Nonsense. That will be dinner. They'd probably give us bread and water for breakfast because we'd done something wrong. Please come before we get punished. Don't you want to check Richard's cricket score?
        - id: ch01-b107
          speaker: edred
          text: "Well, yes. And we can always come here again, can't we?"
        - id: ch01-b108
          speaker: elfrida
          text: "Of course we can. Come on!"
        - id: ch01-b109
          speaker: narrator
          text: >-
            They climbed the twisty, corkscrew stairs and found the tower room where they had slept beneath the wonderful white coverlets, which were now coats. Then both children stopped still and stared at each other. The same sudden shock had struck them both. Neither needed to say the question trembling on their lips. How in the world were they going to get home?
        - id: ch01-b110
          speaker: narrator
          text: >-
            The white coats cuddled close around their necks. Somehow, their soft, friendly touch gave the children comfort and confidence. When you are wrapped in that kind of magic fur, it is almost impossible to believe that everything will not come perfectly right, just as soon as you truly and earnestly wish it to.
        - id: ch01-b111
          speaker: elfrida
          text: "Our clothes."
        - id: ch01-b112
          speaker: edred
          text: "Oh, yes. I forgot."
        - id: ch01-b113
          speaker: elfrida
          text: >-
            You may as well keep forgetting. They aren't here. They're on the other side of that twisting, inside-out, upside-down shaking that changed the attic into this tower. I suppose the tower would become the attic again if we could make the shaking happen backward.
        - id: ch01-b114
          speaker: edred
          text: "I suppose it would. Hallo, what's this?"
        - id: ch01-b115
          speaker: narrator
          text: >-
            He had pushed his fingers between the buttons of his doublet and found a folded paper.
        - id: ch01-b116
          speaker: elfrida
          text: >-
            That's Richard's note about the cricket. Leave it alone. I want to get home. We probably need to make up another poem.
        - id: ch01-b117
          speaker: narrator
          text: "Edred unfolded the paper anyway."
        - id: ch01-b118
          speaker: edred
          text: >-
            It might disappear or get stuck in this time. Then when we get home, it will be gone. Let's quickly see what he says Kent scored.
        - id: ch01-b119
          speaker: narrator
          text: >-
            He smoothed the sheet, looked once, then looked again. Suddenly he held it at arm's length.
        - id: ch01-b120
          speaker: edred
          text: >-
            Look! If this is real, Richard certainly has dreamed about our time. More than that, he's brought things from our time back here.
          emotion: surprised
        - id: ch01-b121
          speaker: narrator
          text: >-
            Elfrida took the paper. Her mouth fell open.
        - id: ch01-b122
          speaker: elfrida
          text: "If it's real? It has to be real!"
          emotion: surprised
        - id: ch01-b123
          speaker: narrator
          text: >-
            She nearly dropped it. This was no scrap of paper from King James's reign. One side held a bill from Gamage's for three ships' guns, a compass, and half a dozen flags. It was made out to Mr. R. D. Arden at 117 Laurie Grove, New Cross, London, Southeast. On the other side, in pencil, Richard had written the runs Kent made the previous Thursday.
        - id: ch01-b124
          speaker: elfrida
          text: "I say—"
        - id: ch01-b125
          speaker: narrator
          text: >-
            Whatever clever and interesting thought was coming next never arrived. Elfrida's coat began to creep and wriggle through its whole soft length and width. No wriggle had ever expressed a warning more clearly. There was danger, and she had better escape while she still could. The fur around her neck ruffled violently. It seemed to tell her not to stand there talking, but to go now, now, now.
        - id: ch01-b126
          speaker: narrator
          text: >-
            Elfrida was much too curious not to look. She hurried to the window. A shiver ran down her back, and her fingers and toes suddenly felt hollow.
        - id: ch01-b127
          speaker: elfrida
          text: "Soldiers! They're coming for us. I know they are!"
          emotion: fearful
        - id: ch01-b128
          speaker: narrator
          text: "Her wriggling coat plainly knew it too."
        - id: ch01-b129
          speaker: edred
          text: >-
            They're raising the drawbridge. Why? And look at the portcullis. Doesn't it look like a guillotine coming down?
        - id: ch01-b130
          speaker: narrator
          text: >-
            Edred had joined her. The tower stood beyond the gate, and from its side window they could see the drawbridge below and the portcullis sinking slowly into place.
        - id: ch01-b131
          speaker: elfrida
          text: "My coat keeps telling me to go. Doesn't yours?"
        - id: ch01-b132
          speaker: edred
          text: "It might, if I bothered to listen."
        - id: ch01-b133
          speaker: narrator
          text: >-
            The soldiers were close enough now for Elfrida to see how fierce they looked. She recognized them as the same men who had hammered so loudly and so hard on the door of Arden House in Soho. They must have ridden all through the night to reach the castle. Elfrida tightened her mind to make poetry, just as you tighten your muscles before jumping a gate or running a hundred yards. Almost before she knew she had begun, the words came out.
        - id: ch01-b134
          speaker: elfrida
          text: >-
            Dear Mouldiwarp, since Cousin Dick buys his beautiful flags from Gamage's, take us away, and take us quick, before the soldiers do us any damages.
        - id: ch01-b135
          speaker: narrator
          text: >-
            At the final word, the white magic coats grew upward and downward at once. They wrapped the children as tightly and softly as silkworms wrap themselves when they are tired of being silkworms. The creatures hide inside their cocoons, and that is their first step toward becoming beings with wings.
        - id: ch01-b136
          speaker: narrator
          text: >-
            Can you imagine warm tubfuls of lovely liquid sleep being poured over you? That was how it felt inside the white cocoons. The children knew the tower was turning upside down and inside out, but they did not care at all. Sleep rained over them in magic showers. Then it closed nearer and nearer in soft, delicious layers of warmth. A gentle humming filled their ears, like bees when you brush through a bed of Canterbury bells. The next thing they knew, they came out of the past into the present with a snap of light and a twist of sound. It was like coming out of a railway tunnel into daylight.
        - id: ch01-b137
          speaker: narrator
          text: >-
            The wonderful coverlet-coat-cocoons had even saved them the work of changing clothes. The stiff, heavy garments from the past had vanished completely. Edred and Elfrida were dressed once more in the ordinary little clothes they had always been used to wearing.
        - id: ch01-b138
          speaker: elfrida
          text: "Now let's see whether that Gamage's paper disappeared. I expect it did."
        - id: ch01-b139
          speaker: narrator
          text: "It had not. They started downstairs."
          
        - id: ch01-b140
          speaker: edred
          text: "I'd like to meet Dick again. He was the jolliest boy I've ever known."
        - id: ch01-b141
          speaker: elfrida
          text: >-
            Perhaps we will meet him. After all, he does come into our time. I expect that when he visited New Cross, he stayed quite a long while, just as we stayed for so long in the time of the Gunpowder Plot. Or perhaps we could go back to Richard's time a little later, after all the danger of the plot has died away and everyone has forgotten it.
          emotion: happy
        - id: ch01-b142
          speaker: edred
          text: >-
            It still isn't forgotten, and that was three hundred years ago. Let's develop our films. I'm not sure they'll work. We carried the film there and brought it back, but we didn't carry the picture on it into the past with us. The film may be blank.
        - id: ch01-b143
          speaker: elfrida
          text: >-
            It was very clever of you to think of that, but I do hope it's a perfectly silly idea. Let's ask Mrs. Honeysett whether we may use that old room she said used to be the stillroom. Once we put up the shutters and keep the light out, it will make a ripping darkroom for developing the films.
        - id: ch01-b144
          speaker: mrs_honeysett
          text: >-
            Course you can. I'll bring two pails of water. The floor is stone, so a little splashing won't hurt. You work the pump, my lord, and I'll hold the pails.
        - id: ch01-b145
          speaker: narrator
          text: >-
            The old pump groaned until the pails were full. When it fell silent, Elfrida looked around the neglected part of the house.
        - id: ch01-b146
          speaker: elfrida
          text: "Why did everyone let these rooms get so dirty and full of cobwebs?"
        - id: ch01-b147
          speaker: mrs_honeysett
          text: >-
            That part of the house has always been left just so. I couldn't take it upon myself to clear anything away without Miss Edith giving the order. Not that I don't want to. Every time I see the dirt and cobwebs, my fingers itch to get at them with a broom and a good scrubbing brush.
        - id: ch01-b148
          speaker: elfrida
          text: "But why?"
        - id: ch01-b149
          speaker: mrs_honeysett
          text: "Oh, it's one of those ancient stories. Old Beale might know, if anyone does."
        - id: ch01-b150
          speaker: edred
          text: >-
            Then we'll go down and talk to old Beale as soon as we've developed our pictures of the castle. That is, we'll go if the films really have any pictures on them.
        - id: ch01-b151
          speaker: mrs_honeysett
          text: >-
            You never can tell with those photo machines. My husband's cousin's wife once had her picture taken with her whole family beside their own back door. But their billy goat jogged the young fellow's elbow while he held the camera. When they washed out the picture, they found they had photographed the next-door neighbors' water barrel instead. And it wasn't a bit like any one of the family.
