audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 亲切从容，带一点温和的幽默
        timbre: 温暖清亮
        pace: 舒缓而有变化
        pitch: 中等
    edred:
      display_name: 埃德雷德
      tts:
        delivery: 聪明好胜，认真里带着孩子气
        timbre: 清脆明亮的男孩声
        pace: 自然偏快
        pitch: 中高
    elfrida:
      display_name: 埃尔弗丽达
      tts:
        delivery: 直率活泼，敏锐又有主意
        timbre: 清亮的女孩声
        pace: 轻快
        pitch: 高
    mole:
      display_name: 鼹鼠精
      tts:
        delivery: 脾气暴躁，古怪又爱挖苦人
        timbre: 尖细干涩
        pace: 偏快，抱怨时一气呵成
        pitch: 偏高
    witch:
      display_name: 女巫
      tts:
        delivery: 古怪自信，直率中带着神秘
        timbre: 沙哑而有力的老妇人声
        pace: 从容，兴起时稍快
        pitch: 中低
    richard:
      display_name: 理查德
      tts:
        delivery: 机敏忠诚，措辞老成又爱打趣
        timbre: 明亮的少年声
        pace: 自然
        pitch: 中高
    guard:
      display_name: 卫兵
      tts:
        delivery: 朴实守礼，带着善意
        timbre: 粗厚的成年男声
        pace: 稳健
        pitch: 中低
    mrs_honeysett:
      display_name: 霍尼塞特太太
      tts:
        delivery: 热心爽快，乡下口吻朴实幽默
        timbre: 温厚略粗的成年女声
        pace: 自然偏快
        pitch: 中等
  chapters:
    - id: ch01
      title: 第十章　白色的翅膀与布朗尼
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 这一章，先得把埃德雷德怎样跟老鹦鹉鼻“扯平”讲清楚。詹姆斯一世在位时，帕拉多斯是阿登家的家庭教师。正是他偷听，又把听来的话告出去，才害得两个孩子进了伦敦塔。留给他们报复谁的时间已经不多，而且报复别人当然不是什么正当的事。可埃德雷德还是非做不可。
        - id: ch01-b02
          speaker: narrator
          text: 他照尼斯代尔夫人的办法救出了姐姐。现在，埃德雷德、埃尔弗丽达和表兄理查德都回到苏活区的阿登府。老保姆，也就是那个老女巫，已经催他们马上离开。
        - id: ch01-b03
          speaker: edred
          text: 可我走以前，非得跟老鹦鹉鼻算清这笔账。
        - id: ch01-b04
          speaker: narrator
          text: 亲手定下计策，又照着尼斯代尔夫人的办法把姐姐救出伦敦塔，叫埃德雷德心里又勇敢又得意，觉得自己简直了不起。他可不愿一声不响地回到自己的时代。临走以前，怎么也得做一点什么，让帕拉多斯知道，他心里究竟有多恨这个人。
        - id: ch01-b05
          speaker: narrator
          text: 但这件事不能叫理查德参加。姐弟俩只要念诗请白鼹鼠精帮忙，它就会找到一条白色道路，把他们一下带走。理查德却走不了，只能留在这个时代，替所有人受罚。姐弟俩凑在一旁，压低声音匆匆说定了这件事。理查德偏要问，他们究竟在谈什么，又为什么不让他帮忙做这件盼了整整四年的事。
        - id: ch01-b06
          speaker: elfrida
          text: 就算告诉你，你也不会信呀。
        - id: ch01-b07
          speaker: richard
          text: 你们不妨说出来试试。
        - id: ch01-b08
          speaker: narrator
          text: 他们只好从头讲起。两个人已经说得飞快，还是讲了好一阵。理查德听得非常专心，听完却没有开口。
        - id: ch01-b09
          speaker: edred
          text: 我就知道你不信。算了，不信也不要紧。还是想想怎么收拾老鹦鹉鼻吧。
        - id: ch01-b10
          speaker: richard
          text: 我不喜欢这件事。以前做梦从来不是这样。现在一切都显得不真了。也许它原本就是一场梦，可我过去一直相信不是。
        - id: ch01-b11
          speaker: edred
          text: 你说的我一句也不懂，可我们的故事全是真的。你看这个！
        - id: ch01-b12
          speaker: narrator
          text: 他冲到小客厅昏暗的角落，从帘幕后面拿出相机，说这是很久以后的时代才有的东西，是一架让太阳替人画画的机器。
        - id: ch01-b13
          speaker: richard
          text: 得了吧。现在我知道这全是个傻梦了。可我明明认得柯达，何必硬梦见自己不认得？这是一架布朗尼！
        - id: ch01-b14
          speaker: narrator
          text: 三个孩子全愣住了，屋里静得谁也说不出话。
        - id: ch01-b15
          speaker: elfrida
          text: 既然你能梦到我们的时代，就该相信我们也能梦到你的时代。你还梦见过什么？漂亮马车？漂亮的船？
        - id: ch01-b16
          speaker: richard
          text: 别拿我当小娃娃。铁路、汽船、竞技场、水晶宫，我全知道。我还知道上星期四，肯特队对德比郡拿了六百一十五分。
        - id: ch01-b17
          speaker: elfrida
          text: 那你快说说，你还知道什么？
        - id: ch01-b18
          speaker: richard
          text: 我什么也不说了。不过我会帮你们对付鹦鹉鼻。你们走后，就算把我留在这里也没关系。咱们把屋顶的雪全铲进他房里，出了事再说。
        - id: ch01-b19
          speaker: narrator
          text: 姐弟俩原想找个更精巧的办法，可他们没有时间慢慢琢磨。理查德知道铲子放在哪里，只盼那些铲子别在这场梦里跑错了地方。埃德雷德又想起肯特队的比分。他要把理查德说的话记下，回到自己的时代再查个明白。平日做功课的桌上摆着白镴墨水台，鹅毛笔就插在里面，偏偏找不到一张纸。
        - id: ch01-b20
          speaker: richard
          text: 快拿去。我这里有纸。要不要我替你写？
        - id: ch01-b21
          speaker: narrator
          text: 理查德从紧身上衣胸前抽出纸，很快写好，揉成一团递过去。埃德雷德把它塞进自己的衣服里。随后，三个人爬上屋顶，在厚雪里摸索了好一阵，才碰到帕拉多斯房间那扇天窗的边缘。阿登府把学问安排在阁楼里，所以这扇天窗也就是家庭教师的窗户。
        - id: ch01-b22
          speaker: narrator
          text: 他们拿铲子的边沿砸破厚玻璃，一铲又一铲地往房里送又厚又白的雪。下面很快传来喊声和怒骂，声音越响，他们反而铲得越卖力。帕拉多斯终于气冲冲地爬上屋顶，冷得直抖，还在雪里跌跌撞撞。三个孩子闪到烟囱后面，趁他看不见，抢先钻回活板门。他们关门插闩，还隔着门板大叫一声“啊哈！”走过家庭教师的房间时，又把那扇门也锁了。
        - id: ch01-b23
          speaker: narrator
          text: 帕拉多斯就这样被留在屋顶上。他可以朝下面街道大喊，等人来救，也可以从破天窗跳回自己的房间，落在刚才铲进去的雪堆上。他完全自由，爱选哪条路都行。孩子们后来始终没弄清他究竟选了什么，你当然也永远不会知道。
        - id: ch01-b24
          speaker: narrator
          text: 老女巫保姆随后叫理查德上床，他乖乖去了。白鼹鼠精被召来以后，却坚持说，回到他们自己的时代只有一个办法，就是从屋顶跳下去。平常也许还能照办，可帕拉多斯偏偏还在屋顶，这下事情就完全不同了。更糟的是，守卫的士兵已经赶到前门，正拿手枪柄一下接一下砰砰砸门。
        - id: ch01-b25
          speaker: edred
          text: 我们上不了屋顶。帕拉多斯还被关在上面呢。
        - id: ch01-b26
          speaker: mole
          text: 哼，那可真是不幸。既然这样，只好从顶层平台的窗户走了。另一个孩子在哪里？
        - id: ch01-b27
          speaker: witch
          text: 已经上床了。
        - id: ch01-b28
          speaker: mole
          text: 嘻嘻，有的人就是聪明过了头。亏你还是女巫，居然没看出那件事。
        - id: ch01-b29
          speaker: narrator
          text: 士兵还在疯狂砸门，声音一下比一下急。埃尔弗丽达抓起白鼹鼠精，保姆拉住埃德雷德，四个身影沿楼梯一路飞奔，一口气冲到最高的平台。那里尽头只有一扇小窗。屋里的空气本来已经寒冷刺骨，窗子又推了好几下才打开。刚露出缝隙，更冷的夜风便迎面直灌进来。
        - id: ch01-b30
          speaker: mole
          text: 快出去，女士优先！
        - id: ch01-b31
          speaker: elfrida
          text: 您不会真要我们跳出去吧？外面明明什么都没有！
        - id: ch01-b32
          speaker: mole
          text: 我就是叫你跳。至于会跳到什么上面，谁猜得着？那是该我操心的事。
        - id: ch01-b33
          speaker: elfrida
          text: 可这件事，我们也该操一点心吧？
        - id: ch01-b34
          speaker: narrator
          text: 她的牙齿正打着战。不过她后来坚持说，那只是因为太冷。
        - id: ch01-b35
          speaker: mole
          text: 既然不肯跳，你们就照自己的办法回家吧。
        - id: ch01-b36
          speaker: narrator
          text: 白鼹鼠精说着，身子已经开始消失。
        - id: ch01-b37
          speaker: elfrida
          text: 不要！请别走！
          emotion: fearful
        - id: ch01-b38
          speaker: mole
          text: 我不走，那就得你们走。把我放下，快点跳吧！
        - id: ch01-b39
          speaker: narrator
          text: 它总算停住了。埃尔弗丽达把它放到地上。保姆忽然搂紧女孩，一连亲了她好多下。
        - id: ch01-b40
          speaker: witch
          text: 再会了，我的甜心宝贝。分别不全是永别，不然我真舍不得放你走。来，脚踩横梁，膝盖放上窗台。就是这样。跳吧！
        - id: ch01-b41
          speaker: narrator
          text: 埃尔弗丽达蹲在窗沿上，身旁积着又厚又脆的雪。天气冷得要命，黑夜里还飘着大雪，她却得从顶楼跳下去。你若做过同样的事，就一定记得那需要多大勇气。她咬紧牙关，往下看，只见雪花点点的漆黑虚空。再回头时，身后也是一条黑过道，只有保姆手里的灯心草蜡烛亮着一点微光。
        - id: ch01-b42
          speaker: elfrida
          text: 埃德雷德不会出事吧？您能保证他也好好跳下来吗？
        - id: ch01-b43
          speaker: edred
          text: 我当然能跳。让我先来，好叫你看看我不是胆小鬼。
        - id: ch01-b44
          speaker: narrator
          text: 埃尔弗丽达一听弟弟要先来，马上纵身跳了出去。下一刻，埃德雷德也跟着跳了。那一瞬间可怕极了。哪怕再相信白鼹鼠精，他们也没法突然忘记一辈子听过的道理。从顶楼窗口跳下去，一定会摔在下面的石板地上，落得粉身碎骨。心里明明记得这一点，却还是敢跳出去，实在非常勇敢。勇敢的事迟早会得到奖赏，这两个孩子的奖赏来得尤其快。
        - id: ch01-b45
          speaker: narrator
          text: 埃尔弗丽达刚跳出去，就看见雪花在她身下越聚越密，最后变成一团云。这可不是能叫人直接穿过去的云。它结实又柔软，像一层层堆起来的鸭绒。云升起来接住她，也可能是她落在云上，她始终弄不清。下一刻，埃德雷德也来到身旁。那片雪白、柔软如绒的东西在他们四周和身下慢慢变形，最后变出一张完整的座椅，有椅背、扶手，还有让双脚休息的地方。
        - id: ch01-b46
          speaker: elfrida
          text: 你手里拿的是什么？
        - id: ch01-b47
          speaker: edred
          text: 是缰绳，白色的缰绳。这是一辆马车。
        - id: ch01-b48
          speaker: narrator
          text: 果真是一辆雪花马车。组成车身的雪花像羽毛，又暖又软。车里还有白色绒毯，它们不用人碰，自己便卷到孩子身边，把他们从四面裹好。缰绳同样由雪花组成，不知什么魔法把它们细细织在一起。握在手里时，它们像白天鹅绒一样柔软温暖。车有了，缰绳也有了，可是拉车的马呢？
        - id: ch01-b49
          speaker: elfrida
          text: 不是马，是天鹅！六只白天鹅！
          emotion: surprised
        - id: ch01-b50
          speaker: mole
          text: 一切白色的东西都听我号令。
        - id: ch01-b51
          speaker: narrator
          text: 白鼹鼠精的声音从后上方轻轻传来。埃德雷德会驾车，便赶着天鹅绕到阿登府正面。他实在忍不住，驾车贴着砸门士兵的头顶俯冲过去。
        - id: ch01-b52
          speaker: edred
          text: 哈，哈！你们又上当啦！
          emotion: happy
        - id: ch01-b53
          speaker: narrator
          text: 士兵果然吓了一大跳。埃德雷德调转六只天鹅，飞快驶上空中一条道路。根本没有人指点，他却清清楚楚地知道这就是正确的方向。雪车刚转弯，姐弟俩忽然同时看见另一辆更小的雪车。那辆车只由两只天鹅拉着，在他们上方绕了一圈，很快消失在黑沉沉的天空深处。车上露出一张他们分明认得的脸。可那一眼太短，也太模糊，他们怎么也想不起那是谁，只留下心里痒痒的一瞥。
        - id: ch01-b54
          speaker: narrator
          text: 六只天鹅把强健的白翅膀迎风展开，长长的脖颈使劲向前伸，拉紧了颈圈。整套雪白的车驾像一条被风吹起的细围巾，飘飘地飞出了伦敦。城市退到身后，暴风雪也被抛下了。头顶是深蓝的夜空，守望的星星镶着安静的银光。脚下是颜色更深的肯特郡大地，已经半睡的农舍窗里闪着宁静金光。扑在孩子脸上的风也不再寒冷，像六月的空气一样柔和。埃尔弗丽达后来一直说，这一路都有白百合的香味。
        - id: ch01-b55
          speaker: narrator
          text: 他们就这样飞过一个又一个沉入黑暗的郡。这一趟比他们从前经历过的任何旅程都神奇，后来也再没有哪一次比得上。只是奇妙的路程总嫌太短。没过多久，天鹅便伸平长翅，稳稳悬停在阿登城堡一座塔楼的窗外。两个孩子从来没有见过那座塔楼，也不知道里面是什么地方。可他们看一眼敞开的窗口，就明白自己该从那里进去。
        - id: ch01-b56
          speaker: elfrida
          text: 亲爱的天鹅，我们能不能留在车里，等天亮再进去？我们特别想给城堡拍张照片。
        - id: ch01-b57
          speaker: narrator
          text: 她说这话时，怀里还紧紧抱着布朗尼相机。天鹅像是真的听懂了，却只是摇摇扁平雪白、看起来有些像蛇的脑袋。敞开的窗口正对着雪车，仿佛专门在那里等候，准备欢迎他们。姐弟俩没有别的办法，只好非常不情愿地离开温暖柔软的车厢，跨进塔楼里一间又黑又冷的房间。
        - id: ch01-b58
          speaker: narrator
          text: 他们还没来得及发愁这一夜会有多难熬，六只天鹅的脑袋又出现在窗口，嘴里说着他们听不懂的话。
        - id: ch01-b59
          speaker: elfrida
          text: 真希望我们在学校学的是天鹅语，不是法语！
        - id: ch01-b60
          speaker: narrator
          text: 好在听不懂也没关系。天鹅低下头，再抬起来时，嘴里衔着雪车上的白绒毯。它们用翅膀把毯子推进窗口，又说了几句天鹅语。
        - id: ch01-b61
          speakers: [elfrida, edred]
          ensemble: duo
          text: 谢谢你们！再见，再见！
        - id: ch01-b62
          speaker: narrator
          text: 宽大的翅膀带起一阵急风，天鹅终于飞走了。孩子们早已累得一点力气也没有，便把柔软的毯子裹在身上，彼此依偎着躺到地板上。那床白被子里仿佛早已藏满世上最快乐的梦，一个接一个替他们盖好。两个孩子觉得自己明明才刚闭上眼睛，冬日阳光就从塔楼的窄窗里探进头来，把他们照醒了。
        - id: ch01-b63
          speaker: narrator
          text: 埃尔弗丽达一下跳起来，掀掉银白色、软得像绒毛的被子。被子当场把自己撕成五块，每一块的大小和形状都不一样。它们有的卷起来，有的往里收，有的吹气似的鼓起来，又在她眼前转了几圈。最后，五块东西分别变成一只盛满温水的银盆、一块散发百合香味的肥皂、一条毛巾、一把银梳子，还有一支象牙牙刷。
        - id: ch01-b64
          speaker: elfrida
          text: 哎呀！
          emotion: surprised
        - id: ch01-b65
          speaker: narrator
          text: 等她梳洗完，那些东西又像水银珠一样流到一起，先聚成乱蓬蓬的一团，再伸展开来，变回柔软的被子。
        - id: ch01-b66
          speaker: elfrida
          text: 哎呀！
          emotion: surprised
        - id: ch01-b67
          speaker: narrator
          text: 她叫醒弟弟，埃德雷德的被子也替他表演了同样聪明又漂亮的把戏。两个人梳洗完，带上布朗尼相机，正准备下楼给城堡拍照，两床闪亮的被子又自己跳起来，变成两件白色皮毛大衣。这是极有钱的人乘汽车时也许会穿的款式，只是那些有钱人未必想得出这么漂亮的衣裳。一件大衣走到一个孩子身边，彬彬有礼地伸开双袖，活像在客气地邀请他们穿上。两个孩子当然都答应了。
        - id: ch01-b68
          speaker: narrator
          text: 他们蹑手蹑脚走下盘旋的楼梯，穿过一扇厚重的门。门开在巨大城门的拱洞下面，城堡大门此刻正敞着。就在他们出来那扇门的对面，另一道门的台阶上坐着一名士兵。他把头盔稳稳夹在两膝之间，一边吹口哨，一边用沙子擦洗。看见孩子们，他只用沾满沙子的手碰了碰额头，并没有站起来。
        - id: ch01-b69
          speaker: guard
          text: 你们这么早就出来啦。
        - id: ch01-b70
          speaker: elfrida
          text: 今天天气这么好，我们能出去走走吗？
        - id: ch01-b71
          speaker: guard
          text: 尽管去。不过别走出十二英亩地，外头有粗野的人和吉卜赛人。也别走远，早餐会大声把你们叫回来的。
        - id: ch01-b72
          speaker: narrator
          text: 两个人一出门，鞋底并没有踩上草地，反而敲得木板咚咚回响。
        - id: ch01-b73
          speaker: edred
          text: 原来这是一座吊桥！你看，下面还有护城河，河边都结薄冰了。
          emotion: surprised
        - id: ch01-b74
          speaker: narrator
          text: 护城河果真就在桥下，边缘盖着一层一碰就碎的薄冰。对岸长着枯黄的灯心草和莎草，根都牢牢冻在冰里。那些草已经干了，颜色黄黄褐褐。一只野鸭忽然从草丛中飞起，干枯的叶子便沙沙作响，好像在彼此低声说话。
        - id: ch01-b75
          speaker: elfrida
          text: 多漂亮呀！要是现在的阿登也有护城河就好了。
        - id: ch01-b76
          speaker: edred
          text: 只要查出河水从哪里来，等找到宝藏，我们也许能把护城河修回来。
        - id: ch01-b77
          speaker: narrator
          text: 他们走过吊桥，踏上草地，鞋底踩得草叶上的冻露喀嚓作响。两个人暂时顾不上拍城堡，决定先沿水去找护城河的源头。这水来自一条小溪。溪水从阿登丘流来，横穿田野，在东北角流进护城河，再从西南角流出去。他们一直跟到田野正中，离城堡已经很远，才真正看清那座城堡究竟有多美。整座城堡完美无缺。拱门没有一处坍塌，石柱没有一根折断，连墙也没有破碎或斑驳。
        - id: ch01-b78
          speaker: edred
          text: 它真漂亮！想到我们也有这样一座城堡，我就高兴。
        - id: ch01-b79
          speaker: elfrida
          text: 可我们的城堡才不是这样。
        - id: ch01-b80
          speaker: edred
          text: 等找到宝藏，它就会变回这样。两卷胶卷都在你那里吧？
        - id: ch01-b81
          speaker: elfrida
          text: 都在这个大口袋里。你快看，小河呢？怎么忽然断了？
        - id: ch01-b82
          speaker: narrator
          text: 溪水刚才还像绿布上的一条钢灰丝带，沿着田野飞快流动。可走到田野半途，那条丝带竟突然断了，前面连一滴继续流淌的水也看不见。好像有一把巨人的剪刀在这里咔嚓一声，把丝带整齐剪断。至于剩下的一卷，大概已经有人卷好收起，妥妥帖帖藏到了不碍事的地方。
        - id: ch01-b83
          speaker: edred
          text: 我的天，还真是说断就断了！
          emotion: surprised
        - id: ch01-b84
          speaker: narrator
          text: 好奇心催得埃德雷德先跑起来，埃尔弗丽达也跟在旁边。来到溪水消失的地方，他们才看见，小溪像是厌倦了在地面奔跑，决定改走地下。它事先没有半点预告，河床既没有慢慢倾斜，也不肯把两岸一点点挖深，只从一个不到八英尺宽的洞里，突然直冲进土中。孩子们着迷地看着水越过洞边，像传动轮上的钢带那样光亮平滑。它明明快得惊人，看起来却几乎纹丝不动。
        - id: ch01-b85
          speaker: edred
          text: 我能站在这里看一辈子。不过以后我们一定要把它找回来。现在走吧，再去看看它从哪里出来。
        - id: ch01-b86
          speaker: elfrida
          text: 先拍下来吧。留张照片，我们以后才认得准。
        - id: ch01-b87
          speaker: narrator
          text: 布朗尼咔嚓响了两次，把这处奇怪的地方收进胶卷。他们又沿着溪水原路折回，绕过护城河的两边，穿过整片田野来到阿登丘。奇妙的景象正在那里等着他们。就在山丘与外面世界相接的地方，溪水从丘底直接涌出来。水面边缘紧贴着一道粗糙低矮的石拱，溪流便从拱门下面钻进田野。
        - id: ch01-b88
          speaker: elfrida
          text: 原来它从这里出来，又在那里钻进地下。不知道后来发生了什么，为什么现在的阿登没有这条溪？
        - id: ch01-b89
          speaker: edred
          text: 等找到宝藏，我们会把它带回来。
        - id: ch01-b90
          speaker: narrator
          text: 布朗尼又响了一声。
        - id: ch01-b91
          speaker: elfrida
          text: 还要把城堡也变回现在的样子。走，咱们去拍下来。
        - id: ch01-b92
          speaker: narrator
          text: 他们回到城堡边，从北面、南面、东面、西面给城堡拍照，又从东北、东南、西北偏北去拍。其余所有罗盘方位，我若愿意也能一一说给你听，不过何必又烦人又爱说教呢？照片终于拍够了，他们再次踏上吊桥。桥板在鞋下发出空洞回声。刚才坐着擦头盔的士兵已经把它擦到完全满意，这会儿正端端正正戴在头上。
        - id: ch01-b93
          speaker: narrator
          text: 姐弟俩在吊桥上开了一个短短的热烈会议，谈的全是早餐。埃德雷德想留下。他很想知道詹姆斯一世时代，乡下人早晨究竟吃些什么。埃尔弗丽达却只想回到一九〇八年。在自己的时代，早餐是什么不必猜，她至少能确定桌上会有鸡蛋和培根。
        - id: ch01-b94
          speaker: elfrida
          text: 再留下去，我们一定又会卷进新冒险。历史就是最容易发生冒险的地方，我从没见过别处有这么厉害。而且我累了。埃德雷德，跟我回去吧！
        - id: ch01-b95
          speaker: edred
          text: 我闻着像烤鸭，还有洋葱馅的味道。
        - id: ch01-b96
          speaker: elfrida
          text: 别胡说，那多半是晚餐。我们的早餐也许只有面包和清水。说不定他们已经发现我们做错了事，还要罚我们。趁现在快走。你难道不想知道理查德说的板球比分对不对吗？
        - id: ch01-b97
          speaker: edred
          text: 那当然想。而且以后随时还能再回来，对不对？
        - id: ch01-b98
          speaker: elfrida
          text: 当然能。快走吧！
        - id: ch01-b99
          speaker: narrator
          text: 他们穿过厚门，沿着弯弯扭扭、盘旋而上的楼梯，回到昨夜睡过的房间。那两床神奇白被子如今还穿在他们身上，正是暖和的大衣。姐弟俩一进门便突然停住，带着同样的惊讶互相望着对方。一个谁也没说出口的问题同时来到两个人唇边。他们当初莫名其妙到了这里，现在到底该怎么回去？
        - id: ch01-b100
          speaker: narrator
          text: 魔法白大衣在他们颈边轻轻依偎着，好像知道两个孩子正在害怕。柔软又友善的皮毛一贴上来，便带来安慰，也带来信心。穿着这样的衣裳，你根本没法觉得事情会一直坏下去。只要自己真心、认真、彻彻底底地希望一切好起来，仿佛下一刻，所有事情就会变得再好不过。
        - id: ch01-b101
          speaker: elfrida
          text: 我们原来的衣服呢？
        - id: ch01-b102
          speaker: edred
          text: 对呀，我差点忘了。
        - id: ch01-b103
          speaker: elfrida
          text: 那就继续忘吧，衣服根本不在这里。它们留在那阵弯弯扭扭、上下翻转、里外颠倒的摇晃另一边。就是那阵奇怪的摇晃把阁楼变成了塔楼。只要能让它重新开始，再朝上次相反的方向摇一回，眼前这座塔楼大概就会翻回去，重新变成他们熟悉的阁楼。
        - id: ch01-b104
          speaker: narrator
          text: 埃德雷德正把手指伸进上衣纽扣之间，忽然摸到一样东西。他抽出一张折好的纸。
        - id: ch01-b105
          speaker: elfrida
          text: 是理查德写板球比分的纸。现在别看了，我只想回去。我们应该先编首诗。
        - id: ch01-b106
          speaker: narrator
          text: 埃德雷德还是把纸展开了。
        - id: ch01-b107
          speaker: edred
          text: 它也许会消失，或者卡在这个时代。回家再找，说不定已经没了。咱们只看一眼，看看肯特队到底拿了多少分。
        - id: ch01-b108
          speaker: narrator
          text: 他把纸铺平，看了一遍，又看一遍，突然伸直胳膊，把纸远远举起来。
        - id: ch01-b109
          speaker: edred
          text: 你看！这要是真的，理查德准梦见过我们的时代。他不只梦见过，还从我们的时代带了东西回来。
        - id: ch01-b110
          speaker: narrator
          text: 埃尔弗丽达接过纸，只看了一眼，嘴巴就惊得张开了。原来那根本不是什么十七世纪的纸，而是一张加米奇商店开的账单。账单上列着三门船炮、一只罗盘和半打旗帜，收账人则是伦敦东南区新十字劳里树林街一一七号的 R. D. 阿登先生。理查德带回来的证据还不只这些。纸的另一面，正用铅笔记着上星期四肯特队拿到的分数。
        - id: ch01-b111
          speaker: elfrida
          text: 这要是真的？可它一定是真的！
          emotion: surprised
        - id: ch01-b112
          speaker: narrator
          text: 埃尔弗丽达刚说了一个开头，正要接着讲出一大串聪明又有趣的话，身上的皮毛大衣忽然从头到脚、从左到右扭了起来。世上没有任何一次扭动能把意思说得更清楚。危险来了，危险来了，趁来得及赶快逃。她颈边的毛又猛烈竖起，一下接一下扫着她，简直是在催她别再站着闲聊，现在就走，马上就走。
        - id: ch01-b113
          speaker: narrator
          text: 人们说一个女人是“夏娃的女儿”，意思就是她好奇。埃尔弗丽达身上正有足够的夏娃女儿性子。尽管大衣拼命催她离开，她还是先冲到窗口，把头探过去向外看。眼前的景象让一股寒意从她的脊背顶端直冲下去，最后一直钻到手指尖和脚趾尖，在那里变成空落落的感觉。
        - id: ch01-b114
          speaker: elfrida
          text: 士兵！他们是来抓我们的，我知道！
          emotion: fearful
        - id: ch01-b115
          speaker: narrator
          text: 要是知识也能用扭动表达，那件大衣同样知道士兵为什么而来。埃德雷德也赶到窗边。他们看见吊桥正在一点点升起，铁闸则从上方慢慢落下。埃德雷德觉得，那副样子简直像一架断头台。因为这座塔楼伸到城门外面，从正窗向下正好能看见吊桥，从侧窗望出去，又能把下降的铁闸看得清清楚楚。
        - id: ch01-b116
          speaker: elfrida
          text: 我的绒毛大衣一直叫我快走。你的没有吗？
        - id: ch01-b117
          speaker: edred
          text: 我要是肯听，它也会说。
        - id: ch01-b118
          speaker: narrator
          text: 士兵越走越近，已经近得能看清他们凶狠的脸。埃尔弗丽达忽然认出来了。这些人正是昨夜在苏活区猛砸阿登府大门的卫兵，他们准是骑着马追赶了一整夜。现在再犹豫就来不及了。她只好把心思绷得紧紧的，像一个人要跳过栅栏或跑完一百码时，会绷紧全身肌肉那样，使劲去编诗。她几乎还没意识到自己开始用力，那首诗就从心里拧了出来。
        - id: ch01-b119
          speaker: elfrida
          text: 亲爱的白鼹鼠精，既然理查德表哥，漂亮旗帜全从加米奇买到，快把我们带走，越快越好，别让士兵伤到我们一根毫毛。
        - id: ch01-b120
          speaker: narrator
          text: 最后一个字刚刚念完，两件魔法白大衣便同时动起来。它们往上伸，又往下长，从四周向孩子身上合拢，把两个人裹得又紧又软。那样子像极了蚕儿。蚕做腻了蚕，便把自己一层层包进茧里，安静等候下一场变化，因为进茧正是它成为有翅膀之人的第一步。
        - id: ch01-b121
          speaker: narrator
          text: 想象一下，有人把大盆大盆温暖的、融化了的睡意，从头到脚浇到你身上。孩子们待在白茧里，感觉就是这样。他们知道塔楼正在上下翻转、里外颠倒，却觉得那一点也不要紧。睡意像一阵阵魔法细雨落下。不，又不完全像雨。它更像一层层温暖甜美的东西，从四周越合越紧，越靠越近。耳边还有轻柔的嗡嗡声，像人拨开一片坎特伯雷风铃草时听见的蜜蜂。接下来，亮光啪地一闪，声音也跟着扭了一下。他们已经从过去回到现在，仿佛火车钻出长长的隧道，突然重新驶进白昼。
        - id: ch01-b122
          speaker: narrator
          text: 被子、大衣和茧连衣服也替他们换好了。沉重僵硬的古装不见了，身上又是平日的小衣服。
        - id: ch01-b123
          speaker: elfrida
          text: 现在再看看加米奇那张纸吧。我猜它准已经消失了。
        - id: ch01-b124
          speaker: narrator
          text: 可那张纸还在。
        - id: ch01-b125
          speaker: edred
          text: 我真想再见迪克一次。他是我遇见过最有趣的男孩。
        - id: ch01-b126
          speaker: elfrida
          text: 也许我们还会见到。毕竟他真的来过我们的时代。新十字那一次，我猜他在那里待了很久，就像我们去火药阴谋时代时，也在过去停了很久一样。要不然，我们还可以自己回去找他，只要把时间选得稍晚一点。那时火药阴谋早已结束，所有危险也都过去，被人忘得差不多了。
        - id: ch01-b127
          speaker: edred
          text: 三百年过去了，到现在也没人忘掉。先去冲洗胶卷吧。我对那两卷东西可一点把握也没有。胶卷的确是我们从现在带过去，又从过去带回来的。可胶卷上的影像不一样，那些景物原本并没有跟我们一起过去。要是洗出来只有一片空白，我也一点不会吃惊。
        - id: ch01-b128
          speaker: elfrida
          text: 你能想到这个，真是聪明得不得了。不过我希望这只是一个彻底的傻念头。咱们问问霍尼塞特太太，能不能借那间旧蒸馏室冲洗。关上百叶窗，它一定是最好的暗房。
        - id: ch01-b129
          speaker: mrs_honeysett
          text: 当然能用。我再替你们提两桶水。地面是石头的，洒出来也不要紧。少爷，您来压水泵，我扶桶。
        - id: ch01-b130
          speaker: narrator
          text: 埃德雷德压动水泵，霍尼塞特太太在旁边扶着两只桶。嘶哑的抽水声在旧屋里响了好一阵，直到两桶水都接满，才终于安静下来。埃尔弗丽达望着四周积下的灰尘和蛛网，忍不住问，为什么这一边的房子一直无人收拾，任它变得又脏又破。
        - id: ch01-b131
          speaker: mrs_honeysett
          text: 那里一直就是这样。没有伊迪丝小姐吩咐，我不敢擅自收拾。可我的手天天发痒，真想拿扫帚和板刷好好刷一遍。
        - id: ch01-b132
          speaker: elfrida
          text: 可它为什么非得一直这样？
        - id: ch01-b133
          speaker: mrs_honeysett
          text: 那是他们古老得不得了的旧故事之一。要说还有谁能讲清楚，那就只有比尔老头了。
        - id: ch01-b134
          speaker: edred
          text: 那我们洗完城堡的照片，就马上到比尔老头家去，请他把这段旧故事讲清楚。当然，得先看看胶卷上究竟有没有拍到城堡。要是一张照片也没有，就没什么可洗的了。
        - id: ch01-b135
          speaker: mrs_honeysett
          text: 照相机器的事，谁说得准呢？我丈夫表亲的太太，有一回带着一家老小，站在自家后门外面拍全家照。相机原本该把他们一家人全收进去。可等照片拿去冲洗，洗出来的却不是他们，而是隔壁人家的储水桶。后来才知道，是他们那只公山羊忽然撞了拿相机的年轻人一下胳膊肘，镜头便歪到旁边去了。最要紧的是，那只水桶跟他们一家人谁也不像。
