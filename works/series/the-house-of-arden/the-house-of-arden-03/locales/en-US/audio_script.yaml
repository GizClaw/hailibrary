  chapters:
    - id: ch01
      title: "CHAPTER III. IN BONEY'S TIMES"
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            Edred crept back to his stool and took hold of his corner of Dr. Watts's marble-backed book. His fingers were trembling. This was his first real adventure, so perhaps we should not think badly of him. Even in his ordinary life and his proper time, nothing thrilling had happened to him before he became Lord Arden and explored the castle. Now he and Elfrida had found a forgotten house and a wonderful garret full of chests. Then mysterious pigeon noises had dressed them in clothes from another age. You may say that pigeon noises cannot put clothes on anyone, and Edred told himself exactly the same thing. Yet somehow they had. That impossibility made everything more mysterious. Somehow, too, the children had gone back a hundred years. One sheet of newspaper was Edred's only proof, but he felt the truth of it in his bones. Perhaps the very air felt a century younger. Shepherds and country people can tell the hour at night by the feel of the air. Perhaps very sensitive people can tell the century in much the same way. Those may be the very people most likely to have adventures in other times. We must consider what is likely, especially in a story about unlikely things.
        - id: ch01-b02
          speaker: edred
          text: >-
            Look, we've gone back to 1807. That's what the newspaper says.
        - id: ch01-b03
          speaker: elfrida
          text: "I know."
        - id: ch01-b04
          speaker: narrator
          text: >-
            Elfrida must have felt the truth of it as strongly as her brother did.
        - id: ch01-b05
          speaker: elfrida
          text: >-
            I wish I could remember what happened in 1807. We never get beyond Edward the Fourth at school. Every time new girls come, we have to start again with the Saxons.
        - id: ch01-b06
          speaker: edred
          text: "But this isn't history. We're at Arden."
        - id: ch01-b07
          speaker: elfrida
          text: >-
            Of course it's history. It will be awful if we don't even know who the king is.
        - id: ch01-b08
          speaker: grandmother
          text: "Silence!"
          emotion: angry
        - id: ch01-b09
          speaker: narrator
          text: >-
            The stiff old lady peered at them over her enormous silver-rimmed spectacles. Soon she put down the Times and brought out ink and paper, though no envelope. Her letter already covered most of one side of the large sheet. She finished that side with a white goose-quill pen, turned the page, and wrote new lines straight across the old ones. Her china inkstand was painted with gold scrolls, cupids, and wreaths of roses. One side held the ink. Another part looked like a china pepper pot, and a tray in front held pens and sealing wax. The children already knew their dreadful poem by heart, so they watched this grandmother of the children they were supposed to be. When the page was full, she shook dust from the pepper pot over the letter to dry the wet ink. There was no blotting paper anywhere. At last she folded the sheet, pressed a silver seal onto it, and wrote the address on the outside.
        - id: ch01-b10
          speaker: grandmother
          text: "Have you learned your task?"
        - id: ch01-b11
          speaker: elfrida
          text: "Here it is."
        - id: ch01-b12
          speaker: narrator
          text: >-
            Elfrida held up the book.
        - id: ch01-b13
          speaker: grandmother
          text: >-
            Don't be impudent, miss. You know I mean, have you learned it by heart? And when you speak to me, you must say “ma'am.”
        - id: ch01-b14
          speaker: elfrida
          text: "Yes, ma'am."
        - id: ch01-b15
          speaker: narrator
          text: >-
            Grandmother took that to mean Elfrida knew the poem.
        - id: ch01-b16
          speaker: grandmother
          text: >-
            Then come and recite it. No, you know better. Feet in first position, hands behind your backs, heads straight, and no fidgeting.
        - id: ch01-b17
          speaker: narrator
          text: >-
            Elfrida recited the miserable verses first, and Edred followed.
        - id: ch01-b18
          speaker: grandmother
          text: "Now you may play in the garden."
        - id: ch01-b19
          speaker: elfrida
          text: "May we take your letter to the post?"
        - id: ch01-b20
          speaker: grandmother
          text: >-
            Yes, but don't stay in the George's bar, even if Mrs. Skinner asks you. Give her the letter and come straight out. Close the door gently, and don't drag your feet.
        - id: ch01-b21
          speaker: elfrida
          text: "Yes, ma'am."
        - id: ch01-b22
          speaker: narrator
          text: >-
            At last they escaped.
        - id: ch01-b23
          speaker: edred
          text: >-
            They're certain to catch us. We don't know anything about this time. I don't know where the George is, or how to buy a stamp, or anything at all.
        - id: ch01-b24
          speaker: elfrida
          text: "We must find someone we trust and tell them the truth."
        - id: ch01-b25
          speaker: edred
          text: >-
            There isn't anyone I'd trust here. People who tie this baby nonsense around a fellow's neck can't be trusted.
        - id: ch01-b26
          speaker: narrator
          text: >-
            He crushed his stiff frill in hot, angry fingers.
        - id: ch01-b27
          speaker: elfrida
          text: >-
            Mine scratches all around my neck too. And mine comes lower. You get wider farther down, so it scratches more of me than yours does of you.
        - id: ch01-b28
          speaker: edred
          text: >-
            Let's find the attic and get back to our own time. I expect we came through the wrong door. We should go now.
        - id: ch01-b29
          speaker: elfrida
          text: >-
            Oh, no! That would be terribly dull. We can see all kinds of things, and we'll be first in history for the rest of our lives. Let's stay and see it through.
        - id: ch01-b30
          speaker: edred
          text: >-
            Do you remember which attic door it was? Was it the third door on the left?
        - id: ch01-b31
          speaker: elfrida
          text: "I don't know, but we'll find it easily when we need it."
        - id: ch01-b32
          speaker: edred
          text: >-
            I want to know now. You never know when you'll need something. Mrs. Honeysett says you should always be able to put your hand on whatever you want at once. We ought to know exactly where our clothes are. Suppose someone tidies them away. You know what people are like.
        - id: ch01-b33
          speaker: elfrida
          text: >-
            All right. We'll go and tidy the clothes ourselves. It won't take a minute.
        - id: ch01-b34
          speaker: narrator
          text: >-
            It would not have taken five minutes if things had been as they expected. They raced upstairs to the passage where the old prints hung. Edred was certain it was not the first door, so they opened the second. The attic was not there. They went along the corridor, trying the doors one after another. At last, though Edred had been so sure, they even opened the first door. That was wrong too. The attic was not behind any of them.
        - id: ch01-b35
          speaker: edred
          text: "This must be the wrong passage."
        - id: ch01-b36
          speaker: elfrida
          text: "It's the only one."
        - id: ch01-b37
          speaker: narrator
          text: >-
            It was the only passage. They hunted through the entire house, upstairs and downstairs. They opened every door they could find, but never saw the attic or the clothes that could take them home. Then they went back and counted. The house contained fifty-seven doors, and the missing attic door was not one of them.
        - id: ch01-b38
          speaker: elfrida
          text: >-
            Fifty-five, fifty-six, fifty-seven. The door's gone! We'll have to stay here forever and ever. Oh, I want Auntie. I do, I do!
          emotion: sad
        - id: ch01-b39
          speaker: narrator
          text: >-
            Elfrida ended in a sob and dropped onto a little green mat outside the last door, which happened to be the kitchen. Edred has always said that he did not cry too, though we have only his word for it. If his account is true, Elfrida must have been crying much more loudly than she usually did, because someone heard the children through the closed kitchen door.
        - id: ch01-b40
          speaker: narrator
          text: >-
            The kitchen door opened at once. Two plump arms swept the children up from the mat and hurried them inside. It was a cheerful kitchen, with bright brass and copper pans hanging on the walls. Between a great fire and a great meat screen, a leg of mutton turned round and round with no one helping it. The arms belonged to a stout woman in a chocolate-colored dress sprigged with blue roses. A broad linen apron covered her front, and beneath the floppy frills of her cap was a kind, jolly face very like Mrs. Honeysett's.
        - id: ch01-b41
          speaker: cook
          text: >-
            Hush that noise, or your granny will come after you, and Boney too. Here, quiet now. See what Cookie has for you.
        - id: ch01-b42
          speaker: narrator
          text: >-
            She opened a tin canister and took out two brown lumps. They looked as if they were made of sand and were about the size and shape of prunes.
        - id: ch01-b43
          speaker: edred
          text: "What's that?"
        - id: ch01-b44
          speaker: cook
          text: >-
            Drat me, what a child! Don't you know sugar when you see it? Well, Master Edred, whatever next?
        - id: ch01-b45
          speaker: narrator
          text: >-
            The children put the lumps in their mouths and sucked. They truly were sugar, but a strong, coarse flavor hid beneath the sweetness. If Edred and Elfrida had been even a little less polite and kind, they would have obeyed nature and spat the lumps out. That would have been disgusting and ungrateful, so they forced the sugar down somehow. All the while, Cook beamed between the frills of her cap. Her hands, each as large as a little beefsteak pudding, rested on her hips.
        - id: ch01-b46
          speaker: cook
          text: "No more crying now. Run along and play."
        - id: ch01-b47
          speaker: edred
          text: >-
            We have to post Granny's letter, and we don't—
        - id: ch01-b48
          speaker: elfrida
          text: "Cook, can you keep a secret?"
        - id: ch01-b49
          speaker: cook
          text: >-
            Can't I just? I've kept the secret of furmety and Bakewell pies, haven't I? No one in this country makes furmety like mine, and you know it.
        - id: ch01-b50
          speaker: elfrida
          text: >-
            We don't know anything. That's the trouble. We can't let Granny find out how much we've forgotten. Something happened to us, and now neither of us remembers anything from more than an hour ago.
        - id: ch01-b51
          speaker: cook
          text: >-
            Bless me! Don't you remember old Cookie giving you baked apple dumplings when you were sent to bed without supper a week ago Thursday?
        - id: ch01-b52
          speaker: elfrida
          text: "No, but I'm sure you did. What are we going to do?"
        - id: ch01-b53
          speaker: cook
          text: >-
            You're not tricking poor Cookie again, are you? Not like the time you said French soldiers were hiding in the windmill and upset the whole village?
        - id: ch01-b54
          speaker: elfrida
          text: >-
            No, it really is true. It's dreadfully true. You must help us. We don't remember anything, either of us.
        - id: ch01-b55
          speaker: narrator
          text: >-
            Cook dropped heavily into a polished armchair with a patchwork cushion.
        - id: ch01-b56
          speaker: cook
          text: >-
            Someone has overlooked you. There's no doubt. You've been bewitched! Oh, my poor little dears, that I should ever see this day—
          emotion: sad
        - id: ch01-b57
          speaker: narrator
          text: >-
            Her round, merry face began to twist and crumple in a way each child had often seen on the other's face.
        - id: ch01-b58
          speakers: [edred, elfrida]
          ensemble: duo
          text: "Don't cry!"
        - id: ch01-b59
          speaker: elfrida
          text: "Who overlooked us?"
        - id: ch01-b60
          speaker: cook
          text: >-
            Old Betty Lovell, I'll be bound. She's bewitched you both, sure as eggs are eggs. I knew there would be trouble when his lordship put her in the stocks for stealing firewood. She must take the spell off you. Unless you can find a white Mouldiwarp, and that's not likely.
        - id: ch01-b61
          speakers: [edred, elfrida]
          ensemble: duo
          text: "A white Mouldiwarp?"
        - id: ch01-b62
          speaker: narrator
          text: >-
            They spoke together like a chorus and exchanged a look like two conspirators.
        - id: ch01-b63
          speaker: cook
          text: >-
            You know the rhyme. Oh, but if you've forgotten everything, that will be gone too.
        - id: ch01-b64
          speaker: edred
          text: "Please say it for us."
        - id: ch01-b65
          speaker: cook
          text: >-
            Let me see how it goes. White Mouldiwarp a spell can make, white Mouldiwarp a spell can break. When all is well, let Mouldiwarp be. When all goes ill, then turn to he.
        - id: ch01-b66
          speaker: elfrida
          text: >-
            Well, everything hasn't gone wrong yet. Let's go and see the witch.
        - id: ch01-b67
          speaker: narrator
          text: >-
            She wriggled inside her scratchy muslin collar.
        - id: ch01-b68
          speaker: cook
          text: >-
            You should take her something. She'd like a little packet of sugar and a pinch of tea.
        - id: ch01-b69
          speaker: edred
          text: >-
            She wouldn't even thank us for those tiny packets.
        - id: ch01-b70
          speaker: cook
          text: >-
            You've forgotten that tea costs ten shillings a pound, and sugar has risen to three and six since the war.
        - id: ch01-b71
          speaker: edred
          text: "What war?"
        - id: ch01-b72
          speaker: cook
          text: >-
            The war with Boney and the French, of course. Don't you remember our church bonfire when the news came that we'd given them a beating at Trafalgar? And poor dear Lord Nelson, God bless him! Your grandfather stood on the George's balcony to read the news to everyone. The whole village waited to cheer, but pride and sorrow for Lord Nelson choked his voice. The people found they could not cheer either. They all blew their noses and shook one another's hands. It was like the strangest funeral anyone ever saw.
          emotion: sad
        - id: ch01-b73
          speaker: elfrida
          text: "How splendid! But we don't remember it."
        - id: ch01-b74
          speaker: cook
          text: >-
            Nor how you killed all the white butterflies last year because you called them Frenchmen in white coats? His lordship had you birched for cruelty to helpless creatures, and you howled for a whole hour.
        - id: ch01-b75
          speaker: edred
          text: "I'm glad we've forgotten that, anyway."
        - id: ch01-b76
          speaker: cook
          text: >-
            Good gracious, it's half past eleven, and I haven't even broken the eggs for my pudding! Off you go with the letter. Tell no one else about forgetting. Come home by Dering's Spinney and visit old Betty. Speak politely, give her the tea and sugar, and cross your feet under the chair if she asks you to sit. I'll put an old knife blade in each of your pockets. Steel will stop her harming you. Ask her to remove the ill-wishing, but don't let her know you brought steel. Witches don't like people getting ahead of them.
        - id: ch01-b77
          speaker: narrator
          text: >-
            The children set off across the fields toward the George. Bean flowers smelled as sweet as ever, skylarks sang clearly overhead, and the sun and sky were just as golden and blue as they had been last week. But that last week now lay a hundred years in the future. At the same time, it really had been only last week for Edred and Elfrida. Time was terribly confusing when you looked at it from where they stood. The children said so to each other more than once as they walked.
        - id: ch01-b78
          speaker: narrator
          text: >-
            Halfway up Arden village stood the George. It was a grand house shaped like the letter E, with rows of windows and a balcony over its wide porch. Inside, a woman in a round cap sat sewing in a pleasant room. Bottles and kegs filled the place. Bright pewter ale pots stood in rows, with squat little mugs for measuring other drinks, and pewter plates lined a brown dresser. Greyhounds sprawled before the broadest hearth the children had ever seen. Their legs, shoulders, and tails were tangled together like a bundle of dead eels. Edred and Elfrida gave the woman Grandmother's letter.
        - id: ch01-b79
          speaker: narrator
          text: >-
            They remembered the warning and hurried away at once. Outside, a coach had stopped by the porch. It looked top-heavy under its great pile of luggage, and ostlers were already leading its six hot, steaming horses toward the stables.
        - id: ch01-b80
          speakers: [ostler_1, ostler_2, ostler_3]
          ensemble: chorus
          text: "Hello there, little ones!"
        - id: ch01-b81
          speaker: narrator
          text: >-
            Edred felt that he simply had to see the stables. The children followed the horses and found a building as large as the inn itself. Horses were going in while others came out. There was hay and straw everywhere. Some ostlers carried buckets, while others carried harness. Beyond them were more stalls and loose boxes than the children could count. Everywhere they looked, men and horses hurried through a bustle beyond describing.
        - id: ch01-b82
          speaker: elfrida
          text: "How many horses have you got here?"
        - id: ch01-b83
          speaker: narrator
          text: >-
            She asked a man who had not joined the friendly greeting. She guessed he was new, and she was right.
        - id: ch01-b84
          speaker: stableman
          text: "Fifty-two."
        - id: ch01-b85
          speaker: elfrida
          text: "What do you need them all for?"
        - id: ch01-b86
          speaker: stableman
          text: >-
            For coaches, post chaises, and the King's messengers, of course. How would anyone travel through the country or hear the news without the George's stable?
        - id: ch01-b87
          speaker: narrator
          text: >-
            Only then did the children remember that railways, telegraphs, and telephones did not exist in this time. People needed all those horses to carry travelers, messages, and news. It is always hard to remember exactly where you are when you happen to stumble into a century that is not your own. Edred would gladly have stayed all day. He wanted to watch every busy ostler and every beautiful horse. But Elfrida pulled him away and reminded him that they still had to find the witch.
        - id: ch01-b88
          speaker: narrator
          text: >-
            They found her in a dreadful, sagging cottage with great holes in its roof of rotten thatch. She looked exactly like the witches in storybooks, except that she had no broomstick and wore no tall pointed hat. Instead, she had a dirty cap that had once been white and a rusty dress that had once been black. A streaked shawl hung around her shoulders. Perhaps it had once been scarlet, though no one could be certain now. A black cat sat on a very dirty wooden settle. The old woman herself perched on a shaky stool with only three legs. Her wrinkled face bent over a speckled hen in her lap, and she held the bird gently in yellow, wrinkled hands.
        - id: ch01-b89
          speaker: narrator
          text: >-
            Edred stopped as soon as he saw her through the crooked doorway.
        - id: ch01-b90
          speaker: edred
          text: >-
            I'm not going in. What's the use? We know she didn't bewitch us. If we annoy her, she might do it now, and then we'll be in real trouble.
        - id: ch01-b91
          speaker: elfrida
          text: "But we have the tea and sugar."
        - id: ch01-b92
          speaker: edred
          text: >-
            Give them to her and come straight back. I'll wait by the stile.
        - id: ch01-b93
          speaker: narrator
          text: >-
            Elfrida entered alone and gave a rather frightened good morning.
        - id: ch01-b94
          speaker: elfrida
          text: "I've brought you some tea and sugar."
        - id: ch01-b95
          speaker: narrator
          text: >-
            She waited for a thank-you. Without one, it would be rude to say good morning again and leave. But the thanks never came. The old woman stopped stroking the hen.
        - id: ch01-b96
          speaker: wise_woman
          text: "What did you bring them for? I've done you no harm."
        - id: ch01-b97
          speaker: elfrida
          text: "No. I'm sure you wouldn't hurt me."
        - id: ch01-b98
          speaker: wise_woman
          text: "Then why have you brought me anything?"
        - id: ch01-b99
          speaker: elfrida
          text: >-
            Oh, just because they're for you. I thought you might like them. It's a sort of love-gift.
        - id: ch01-b100
          speaker: narrator
          text: >-
            That was Aunt Edith's name for a present given for no birthday, Christmas, or lost tooth.
        - id: ch01-b101
          speaker: wise_woman
          text: "A love-gift? After all these years?"
          emotion: surprised
        - id: ch01-b102
          speaker: narrator
          text: >-
            Elfrida could not understand, and how could she? Even clever grown-ups now can hardly imagine how a woman might be treated in those days once people suspected her of witchcraft. It might begin simply because she was cleverer than her neighbors. She might understand what was wrong with sick people and be clever enough to cure them. Her knowledge might help her predict storms, gales, and frosts. Perhaps she could even find water with a divining rod, that mysterious forked hazel twig held between both hands while she crossed a meadow. A woman who could locate hidden water could probably discover many things her duller neighbors would never dream of. In those days, being much cleverer than the people around you could be enough. First they called such a woman wise. From wise woman to witch was a very short step.
        - id: ch01-b103
          speaker: elfrida
          text: "Yes. Is your hen ill?"
        - id: ch01-b104
          speaker: wise_woman
          text: "She'll recover. The healing in my hands has passed into her."
        - id: ch01-b105
          speaker: narrator
          text: >-
            The old woman rose and set the hen on the hearth. It fluttered and squawked before settling into the gray ashes. The black cat was plainly and thoroughly annoyed by the disturbance. Then the woman suddenly laid both hands on Elfrida's shoulders.
        - id: ch01-b106
          speaker: wise_woman
          text: >-
            Now the healing in my hands is for you. You brought me a love-gift. For fifty years, no one has given me anything except from fear or as payment for my help. Every gift was meant to buy me. People wanted me to remove a spell or lay one. But yours is a love-gift, and I tell you that you shall have your heart's desire. Love will surround you all your life. What was lost shall be found, and what never came shall return. You shall be blessed with the goods of this world and with the riches of the heart. I know it. I can see it. Everything ahead of you is good and fair. Your future shall be as clean and sweet as your kind heart.
        - id: ch01-b107
          speaker: narrator
          text: >-
            The old woman lowered her hands. Elfrida was deeply moved by praise she knew she did not deserve. She stood helplessly, almost ready to cry.
        - id: ch01-b108
          speaker: elfrida
          text: "I only brought it because Cook told me to."
        - id: ch01-b109
          speaker: wise_woman
          text: >-
            Cook didn't give you the kind heart that makes you want to weep for me now.
        - id: ch01-b110
          speaker: narrator
          text: >-
            The woman folded herself into a crouching heap, and her voice became a chant.
        - id: ch01-b111
          speaker: wise_woman
          text: >-
            I know many things. Through the long days and the nights that feel like death, I sit alone and learn to see. A cat sees through darkness. I see through days that have passed and days still to come. I know you are not truly here or now. You will return to the place you came from, and this time that is not yours will keep no trace of you. My blessing will follow you into your own time and place, because you brought a love-gift to Arden's poor old wise woman.
        - id: ch01-b112
          speaker: elfrida
          text: "Is there anything I can do for you?"
          emotion: sad
        - id: ch01-b113
          speaker: narrator
          text: >-
            She felt truly sorry, because the old woman's voice was so pitiful.
        - id: ch01-b114
          speaker: wise_woman
          text: >-
            Kiss me. Kiss me with the mouth of a little child who came back a hundred years to do it.
        - id: ch01-b115
          speaker: narrator
          text: >-
            Elfrida did not want to kiss that wrinkled gray face. But her heart wanted to be kind, so she obeyed it.
        - id: ch01-b116
          speaker: wise_woman
          text: >-
            Ah, now I see! Never have I had a vision like this. None of my other visions has ever come close. Great globes of light, bright as the sun, will shine in city streets where only little oil lamps and smoky lanterns stand now. Iron roads will cross the land, and fiery dragons will pull coaches along them. Rich and poor will ride up and down together. A man speaking in England will be heard in France. More than that, the voices of dead men will be kept alive in boxes and made to speak whenever the living wish. Handlooms will vanish from cottages, and weavers will work in palaces with a thousand windows, all bright as day. The sun itself will bend down to make portraits truer than any painter can make. Ships like conger eels will travel beneath the sea, and ships like giant birds will ride above the clouds. Bread that costs a shilling and ninepence now will cost fivepence. Corn and beef will cross the ocean to feed us. Every child who can learn will be taught, and—
          emotion: surprised
        - id: ch01-b117
          speaker: lord_arden
          text: "Enough, you prattler!"
          emotion: angry
        - id: ch01-b118
          speaker: narrator
          text: >-
            The stern command came from the doorway. Elfrida turned. Lord Arden stood there, tall, straight, and gray, leaning on his gold-headed cane. Edred stood beside him, looking very small and thoroughly caught. The wise woman seemed not to see them. Her rolling, blinking eyes saw nothing, but she had heard.
        - id: ch01-b119
          speaker: wise_woman
          text: >-
            Loss and sorrow are coming to Arden. Spiders will claim the hangings in your house. Mice will eat your carved furniture. Your gold will dwindle, and your house will sink lower and lower until not one field around it belongs to you.
          emotion: sad
        - id: ch01-b120
          speaker: narrator
          text: >-
            Lord Arden only shrugged.
        - id: ch01-b121
          speaker: lord_arden
          text: >-
            Those are fine tales for frightening babies. If you want me to believe you, tell me what will happen tomorrow.
        - id: ch01-b122
          speaker: wise_woman
          text: "Tomorrow the French will land in Lymchurch Bay."
        - id: ch01-b123
          speaker: narrator
          text: >-
            Lord Arden laughed.
        - id: ch01-b124
          speaker: wise_woman
          text: >-
            I give you three signs. First, when you enter your home, the white Mouldiwarp, Arden's badge, will sit on your threshold.
        - id: ch01-b125
          speaker: lord_arden
          text: "So that will be your first sign."
        - id: ch01-b126
          speaker: narrator
          text: >-
            His voice mocked her.
        - id: ch01-b127
          speaker: wise_woman
          text: >-
            The second sign will be your family's badge again, sitting in your own chair in your own parlor.
        - id: ch01-b128
          speaker: lord_arden
          text: "That sounds very likely."
        - id: ch01-b129
          speaker: wise_woman
          text: >-
            The third sign will be the badge of your house in this child's arms.
        - id: ch01-b130
          speaker: narrator
          text: >-
            She turned her back on them and lifted the speckled hen from the ashes. Lord Arden took Edred in one hand and Elfrida in the other, then led them away from the cottage. All the way across the fields, he spoke severely about disobedient children who went wandering after wicked witches. Edred and Elfrida had an explanation, but they could not give it without blaming Cook for sending them. Of course, neither child would betray her, so they had no defense at all.
        - id: ch01-b131
          speaker: lord_arden
          text: "Bread and water for dinner will teach you better behavior."
        - id: ch01-b132
          speaker: elfrida
          text: >-
            Oh, Grandfather, please don't be so unkind! Remember when you were little. I know you must have liked looking at witches too. Didn't you?
        - id: ch01-b133
          speaker: narrator
          text: >-
            Lord Arden stared at her angrily for a moment. Then the anger broke, and he chuckled.
        - id: ch01-b134
          speaker: lord_arden
          text: >-
            You're a bold girl. I remember seeing a witch ducked at Newchurch. I even played truant from my tutor to watch.
        - id: ch01-b135
          speaker: elfrida
          text: >-
            There, you see? We don't mean to be naughty. We're only behaving as you did. You won't give us bread and water, will you? Especially when bread costs so much.
        - id: ch01-b136
          speaker: narrator
          text: >-
            Lord Arden chuckled again.
        - id: ch01-b137
          speaker: lord_arden
          text: >-
            Why, the little white mouse has found her voice. No one has spoken so boldly to me since I wore petticoats myself. Very well. We'll say no more about it this time.
        - id: ch01-b138
          speaker: narrator
          text: >-
            Until the punishment disappeared, Edred had privately thought Elfrida was behaving like a perfect idiot. Now he changed his mind about that.
        - id: ch01-b139
          speaker: narrator
          text: >-
            They turned across the summer fields and made their way back toward Arden Castle. As they approached, there seemed to be much more of the castle than there had been when the children first saw it in their own time. It was far tidier too, with none of the neglect they knew. And there, waiting on the doorstep, sat a white mole.
        - id: ch01-b140
          speaker: elfrida
          text: "There! Look!"
          emotion: surprised
        - id: ch01-b141
          speaker: narrator
          text: >-
            The mole vanished like a streak of white paint rubbed away.
        - id: ch01-b142
          speaker: lord_arden
          text: "Nonsense. There are plenty of white moles in the world."
        - id: ch01-b143
          speaker: narrator
          text: >-
            They went inside. There was the white mole again, now sitting upright in Lord Arden's own carved chair in his own parlor. Even Lord Arden had to admit that finding it there was very unusual indeed. The wise woman's second sign had come true exactly where she said it would.
        - id: ch01-b144
          speaker: narrator
          text: >-
            Elfrida bent down and opened her arms. She was wonderfully glad to see the mole. Ever since she and Edred had entered this strange time, she had felt that nothing could comfort her more than having it close at hand. The mole understood everything. It could stay with them, advise them, and, above all, carry them safely back into the century where they belonged. The Mouldiwarp made a little run and a little jump. Elfrida caught it and held it against her waist in both hands.
        - id: ch01-b145
          speaker: elfrida
          text: "Stay with me."
        - id: ch01-b146
          speaker: lord_arden
          text: "By George!"
          emotion: surprised
        - id: ch01-b147
          speaker: narrator
          text: >-
            Lord Arden spoke to the whole universe.
        - id: ch01-b148
          speaker: edred
          text: "Now you see."
