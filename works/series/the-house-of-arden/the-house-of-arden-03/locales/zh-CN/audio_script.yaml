audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 亲切从容，带一点温和的幽默
        timbre: 温暖清亮
        pace: 舒缓而有变化
        pitch: 中等
    edred:
      display_name: 埃德雷德
      tts:
        delivery: 聪明好胜，认真里带着孩子气
        timbre: 清脆明亮的男孩声
        pace: 自然偏快
        pitch: 中高
    elfrida:
      display_name: 埃尔弗丽达
      tts:
        delivery: 直率活泼，敏锐又有主意
        timbre: 清亮的女孩声
        pace: 轻快
        pitch: 高
    grandmother:
      display_name: 祖母
      tts:
        delivery: 古板严厉，时时讲究礼法
        timbre: 苍老而清晰
        pace: 缓慢端正
        pitch: 中低
    cook:
      display_name: 厨娘
      tts:
        delivery: 热心爽快，带朴实的乡间口吻
        timbre: 丰满亲切
        pace: 明快
        pitch: 中等
    wise_woman:
      display_name: 智慧女人
      tts:
        delivery: 孤独温柔，预言时转为悠远的吟唱
        timbre: 苍老沙哑
        pace: 缓慢
        pitch: 低
    lord_arden:
      display_name: 阿登勋爵
      tts:
        delivery: 威严守旧，笑起来又有几分豪爽
        timbre: 苍老浑厚
        pace: 稳健
        pitch: 低
    stableman:
      display_name: 马夫
      tts:
        delivery: 忙碌直爽，乡音自然
        timbre: 粗实明亮
        pace: 自然偏快
        pitch: 中低
  chapters:
    - id: ch01
      title: 第三章　拿破仑时代
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 埃德雷德悄悄回到小凳上，捏着那本大理石纹封面的《瓦茨博士赞美诗集》一角，手指还在发抖。请别急着笑他胆小，这是他头一回真正遇上历险。在原本属于他的年代里，生活从没带来什么惊心动魄的事。直到他成了阿登勋爵，又去探索阿登城堡，一切才忽然不同。如今，他和埃尔弗丽达不但发现了一座废弃的宅院，还找到一间堆着箱子的奇妙阁楼，更让一团神秘的鸽声替他们穿上了另一个时代的衣服。声音怎么能替人穿衣服呢？不论衣服属于什么年代，都说不通。埃德雷德自己也这样想，可鸽声偏偏做到了。正是这种事，让整场遭遇越来越神秘。如今兄妹俩又莫名其妙回到了一百年前。他只有一张报纸可以作证，却从骨头里知道这是真的。也许空气本身就年轻了一百岁。牧羊人和乡下人能从夜气里辨出时辰，特别敏感的人，说不定也能用差不多的办法，感觉出眼下是哪一个世纪。过去和现在的奇遇，大概正爱找这种人。读到稀奇的故事时，我们可不能忘了想一想，事情究竟合不合情理。
        - id: ch01-b02
          speaker: edred
          text: 我说，咱们真的回到一八〇七年了。那张报纸写得清清楚楚。
        - id: ch01-b03
          speaker: elfrida
          text: 我知道。我真希望还记得一八〇七年出了什么事。可我们的历史课从没讲到爱德华四世以后。班里一来新生，大家就又得从撒克逊人学起。
        - id: ch01-b04
          speaker: edred
          text: 可咱们又没进历史里。这里是阿登。
        - id: ch01-b05
          speaker: elfrida
          text: 这里当然也在历史里。连现在的国王是谁都不知道，那才糟呢。
        - id: ch01-b06
          speaker: narrator
          text: 埃尔弗丽达也早就感觉到了，看来她那种像牧羊人凭夜气辨时辰的本领，比哥哥还要强些。可她刚说到国王，腰板笔直的老太太便从那副镜片很厚、银框很大的眼镜上方抬眼看过来。
        - id: ch01-b07
          speaker: grandmother
          text: 安静！
          emotion: angry
        - id: ch01-b08
          speaker: narrator
          text: 老太太放下《泰晤士报》，拿来墨水和一大张信纸，却没有信封。她是在续写一封快写完的信，纸的一面差不多全写满了。等最后一点空白也填上，她把信纸转过来，横着从原有的字迹上写过去。手里用的是白鹅毛笔。瓷墨水台上画满金色卷枝、丘比特和玫瑰花环，一边盛墨，另一边像只瓷胡椒罐，前面的小槽里放着笔、封蜡和银印章。两个孩子早已背熟那首愁苦的诗，只管盯着这位把他们当成孙辈的祖母。她写完以后，从瓷罐里撒出粉末吸干墨迹。屋里根本没有吸墨纸。接着，她把纸折好，用银印封住，直接在外面写上地址。
        - id: ch01-b09
          speaker: grandmother
          text: 你们的功课会了吗？
        - id: ch01-b10
          speaker: elfrida
          text: 书在这里。
        - id: ch01-b11
          speaker: grandmother
          text: 小姐，不许顶嘴。你明知道我问的是背熟了没有。还有，跟我说话，每次都要称我“夫人”。
        - id: ch01-b12
          speaker: elfrida
          text: 已经背熟了，夫人。
        - id: ch01-b13
          speaker: grandmother
          text: 那就过来背。别那样站。双脚站第一位，手放到背后，头抬正，两只脚不许乱动。
        - id: ch01-b14
          speaker: narrator
          text: 埃尔弗丽达先背，埃德雷德随后，把那几段叫人丧气的诗一字不漏地背了出来。
        - id: ch01-b15
          speaker: grandmother
          text: 好了，到花园里玩吧。
        - id: ch01-b16
          speaker: elfrida
          text: 我们替您把信送去邮寄，好吗？
        - id: ch01-b17
          speaker: grandmother
          text: 可以。不过不许待在“乔治客栈”的酒吧里，斯金纳太太请你们留下也不行。把信交给她就出来。关门要轻，走路别拖脚。
        - id: ch01-b18
          speaker: elfrida
          text: 是，夫人。
        - id: ch01-b19
          speaker: narrator
          text: 两个孩子终于逃了出来。
        - id: ch01-b20
          speaker: edred
          text: 他们一定会看穿咱们。咱们什么都不知道。“乔治客栈”在哪儿，上哪儿买邮票，我一样也不知道。
        - id: ch01-b21
          speaker: elfrida
          text: 得找一个靠得住的人，把实话全告诉他。
        - id: ch01-b22
          speaker: edred
          text: 谁也靠不住。能把这种哄小娃娃的破东西套到别人脖子上的人，我才不信。
        - id: ch01-b23
          speaker: narrator
          text: 那圈哄小娃娃的破玩意儿，就是他脖子上的褶领。他又热又恼，用手指把浆得硬邦邦的布边狠狠揉皱。
        - id: ch01-b24
          speaker: elfrida
          text: 我的领子也扎人，而且领口比你的低。身子越往下越宽，我被扎到的地方可比你多。
        - id: ch01-b25
          speaker: edred
          text: 咱们回阁楼吧，想办法回自己的时代。也许刚才只是走错了门。现在就去。
        - id: ch01-b26
          speaker: elfrida
          text: 不要，那多没意思！留在这里，什么稀奇事都能看见，以后咱们一辈子都能考历史第一。还是把这场历险走到底吧。
        - id: ch01-b27
          speaker: edred
          text: 可你还记得阁楼是哪扇门吗？左边第三扇？
        - id: ch01-b28
          speaker: elfrida
          text: 不记得。不过真想回去时，肯定很容易找到。
        - id: ch01-b29
          speaker: edred
          text: 我现在就想弄清楚。谁知道什么时候会忽然用上什么东西？霍尼塞特太太总说，需要一样东西时，就该马上拿得到。我得确定咱们随时找得到自己的衣服。万一大人把它们收走了呢？你也知道大人会怎么做。
        - id: ch01-b30
          speaker: elfrida
          text: 那咱们自己去把衣服收好。用不了一分钟。
        - id: ch01-b31
          speaker: narrator
          text: 要是事情和他们想的一样，连五分钟也用不了。兄妹俩飞快跑上楼梯，来到挂着旧版画的走廊。埃德雷德认定不是第一扇，于是先开第二扇。可第二扇不是。接着他们依次试过每一扇门，开到最后，只得回头把第一扇也打开。第一扇同样不是。整条走廊找完了，没有一扇是阁楼的门。
        - id: ch01-b32
          speaker: edred
          text: 咱们走错走廊了。
        - id: ch01-b33
          speaker: elfrida
          text: 可这里只有这一条。
        - id: ch01-b34
          speaker: narrator
          text: 她说得没错，这座房子只有这一条那样的走廊。他们仍不死心，上楼下楼，找遍整栋屋子，把遇见的每扇门都打开。走廊、卧房和楼梯边的门，他们一处也没有放过，可阁楼的入口就是再也没有出现。更奇怪的是，等他们重新数过所有的门，不算那扇失踪的阁楼门，屋里仍旧恰好有五十七扇。门的总数一点没少，能送他们回去的那一扇却凭空消失了。
        - id: ch01-b35
          speaker: elfrida
          text: 五十五、五十六、五十七……门不见了！咱们得永远留在这里了。我要姑妈，我要她！
          emotion: fearful
        - id: ch01-b36
          speaker: narrator
          text: 埃尔弗丽达一下坐到最后一扇门前的绿色小垫子上，哭了起来。碰巧，那是厨房门。埃德雷德坚称自己没有跟着哭。假如他说的是实话，妹妹这回一定哭得比平常响得多，因为门忽然开了。两条胖胳膊一把抱起他们，急急带进一间叫人心里舒坦的厨房。墙上挂满闪亮的黄铜锅和红铜锅。熊熊炉火和大挡热屏之间，一只羊腿不用任何人帮忙，自己一圈又一圈地转着。抱他们的女人非常肥胖，穿一身点缀蓝玫瑰的巧克力色印花布裙，围着宽大的亚麻围裙，帽子垂着松软的褶边。褶边中间，是一张像霍尼塞特太太一样亲切、善良、快活的脸。
        - id: ch01-b37
          speaker: cook
          text: 别嚷啦，要不祖母就来找你们了，没准连拿破仑也要来。别哭，看看老厨娘给你们留了什么，先把嘴堵上。
        - id: ch01-b38
          speaker: narrator
          text: 她打开白铁罐，取出两块像沙土的褐色东西，大小和形状都像西梅。
        - id: ch01-b39
          speaker: edred
          text: 这是什么？
        - id: ch01-b40
          speaker: cook
          text: 真见鬼，这孩子怎么了！看见糖都不认得。埃德雷德少爷，我倒想知道你接下来还要问什么。
        - id: ch01-b41
          speaker: narrator
          text: 孩子们接过糖块，含进嘴里。那确实是糖，可甜味底下压着一股又浓又粗涩的怪味。要不是他们刚刚格外懂礼、格外友善，准会照天性的催促把它吐出来。不过，他们知道那样做既恶心又忘恩负义，两个人只好忍着那股粗糙的后味，想尽办法把糖咽下。厨娘笑眯眯地看着他们，帽子褶边中间那张脸又亲切又灿烂。她双手叉腰，每只手都有一只小牛肉布丁那么大。
        - id: ch01-b42
          speaker: cook
          text: 好了，别再当爱哭鬼，去玩吧。
        - id: ch01-b43
          speaker: edred
          text: 我们还得替祖母寄信，可我们不知道……
        - id: ch01-b44
          speaker: elfrida
          text: 厨娘，你能替人保守秘密吗？
        - id: ch01-b45
          speaker: cook
          text: 我不能？杂粮甜粥和贝克韦尔馅饼怎么做，我不是一直守口如瓶吗？整个郡也找不到比我做得更好的杂粮甜粥，这你们明明知道。
        - id: ch01-b46
          speaker: elfrida
          text: 可我们什么都不知道。我们不敢让祖母知道自己忘了多少事。我们出了点怪事，一个钟头以前发生过什么，现在全想不起来了。
        - id: ch01-b47
          speaker: cook
          text: 老天保佑！上上个星期四，你们没吃晚饭就被罚睡觉，老厨娘给你们烤苹果饺子，这也忘了？
        - id: ch01-b48
          speaker: elfrida
          text: 忘了，不过我相信你一定给过。现在我们该怎么办？
        - id: ch01-b49
          speaker: cook
          text: 你们没在骗可怜的老厨娘吧？别又像上回那样，说法国兵藏在风车里，闹得全村鸡飞狗跳。
        - id: ch01-b50
          speaker: elfrida
          text: 这回是真的，真得吓人。你一定得帮我们。我们两个什么都不记得了。
        - id: ch01-b51
          speaker: narrator
          text: 厨娘重重坐进铺着拼布垫子的亮光扶手椅。
        - id: ch01-b52
          speaker: cook
          text: 有人拿邪眼看过你们，准没错。你们让人施了魔法。啊，我漂亮的小心肝儿，想不到我活着还能见到这一天……
          emotion: sad
        - id: ch01-b53
          speaker: narrator
          text: 厨娘那张胖胖的快活脸忽然扭曲起来，皱成一团。两个孩子都熟悉这种模样，因为他们不止一次在对方脸上见过。她马上就要哭了。
        - id: ch01-b54
          speakers: [edred, elfrida]
          ensemble: duo
          text: 别哭。
        - id: ch01-b55
          speaker: elfrida
          text: 可是谁拿邪眼看了什么？
        - id: ch01-b56
          speaker: cook
          text: 我敢打包票，是老贝蒂·洛弗尔！她给你们两个下了咒，就像鸡蛋一定是鸡蛋。老爷因为她在林子里偷捡柴，把她关进木枷时，我就知道迟早要闹出事。得求她解咒，除非你们找得到一只白鼹鼠精，可那怎么可能呢？
        - id: ch01-b57
          speakers: [edred, elfrida]
          ensemble: duo
          text: 白鼹鼠精？
          emotion: surprised
        - id: ch01-b58
          speaker: narrator
          text: 两个人又一次同时开口，声音像一小段合唱。他们立刻互相望了一眼，那神情又像两个藏着同一个秘密的同谋。
        - id: ch01-b59
          speaker: cook
          text: 你们本来知道那首歌谣。哎呀，既然什么都忘了，当然也忘了它。
        - id: ch01-b60
          speaker: edred
          text: 那就念给我们听吧。
        - id: ch01-b61
          speaker: cook
          text: 我想想啊。白鼹鼠精能把咒语念，白鼹鼠精能让咒语断；万事顺遂，任它自由自在，一旦遭难，就向它求援。
        - id: ch01-b62
          speaker: elfrida
          text: 眼下还没有万事都糟。咱们先去看看女巫吧。
        - id: ch01-b63
          speaker: narrator
          text: 说话时，她不停扭动脖子，想躲开那圈扎人的细棉布领巾。至少在她看来，事情还没有坏到非请白鼹鼠精不可的地步。
        - id: ch01-b64
          speaker: cook
          text: 最好带点东西给她。一小包糖，再来一撮茶叶，她准喜欢。
        - id: ch01-b65
          speaker: edred
          text: 就这么一点？她连声谢谢都不会说吧。
        - id: ch01-b66
          speaker: cook
          text: 看来你们真忘了。茶叶一磅十先令，打仗以后，糖已经涨到三先令六便士了。
        - id: ch01-b67
          speaker: edred
          text: 什么仗？
        - id: ch01-b68
          speaker: cook
          text: 和法国人的仗呀！咱们正在跟拿破仑和法国人交战。特拉法尔加大胜的消息传来时，教堂旁边还烧过篝火。还有可怜的纳尔逊勋爵，愿上帝保佑他！你们祖父站在“乔治客栈”的阳台上念战报，大家等着欢呼，可他一想到胜利，又想到纳尔逊勋爵，喉咙哽住，什么也念不出来。底下的人也一样，喊不出欢呼，只顾擤鼻涕、握手，活像一场发了疯的葬礼。这些也全忘了？
        - id: ch01-b69
          speaker: elfrida
          text: 真了不起。可我们一点也不记得。
        - id: ch01-b70
          speaker: cook
          text: 去年，你们还把白蝴蝶全杀了，说它们是穿白军服的法国佬。老爷说你们虐待不会说话的动物，用桦条狠狠抽了一顿。你们哭号了足足一个钟头，这也忘啦？
        - id: ch01-b71
          speaker: edred
          text: 这件事忘了倒挺好。
        - id: ch01-b72
          speaker: cook
          text: 天哪，十一点半了，我做布丁的鸡蛋一个都没打。快去送信，忘事的秘密别再告诉别人。回来走德林小林子，去见老贝蒂。对她客气些，把茶和糖送去。她若请你们坐下，就在椅子底下交叉双脚。我再给你们一人一片旧刀刃放进口袋，身上有钢铁，她就伤不了你们。求她解掉恶咒，可别让她发现你们带了钢铁。她们最讨厌别人抢先防着自己。
        - id: ch01-b73
          speaker: narrator
          text: 兄妹俩带着信，穿过一片片田野去“乔治客栈”。蚕豆花仍旧那么香甜，云雀的歌声仍旧那么清亮，头顶的太阳和天空也像上星期一样灿金湛蓝。可那个上星期，其实还在一百年后的未来。从他们眼下所在的地方说来，它偏偏又真是上星期。这两种说法明明相反，却又都是真的。这样的念头怎么想都想不明白，两个孩子一路上不止一次对彼此说，时间这东西实在叫人糊涂。
        - id: ch01-b74
          speaker: narrator
          text: “乔治客栈”坐落在阿登村半山腰，是一栋气派的 E 字形大宅，窗户很多，大门廊上还有阳台。孩子们走进一间舒服的屋子，把信交给一个戴圆帽、正在做针线的太太。屋里摆着许多瓶子和小桶，一排排白镴啤酒壶擦得发亮，还有量别种饮料用的小胖杯。棕色餐具架上也放着白镴盘子。几只猎兔犬摊在孩子们见过的最宽大的壁炉前，腿、肩膀和尾巴绞成一捆，像一堆死鳗鱼。信刚送到，他们马上出来。门廊前停着一辆驿车，车顶的行李堆得头重脚轻，马夫正牵走六匹浑身冒着热气的马。埃德雷德非要看看马厩，两个人便跟了过去。马厩竟和客栈一样大。马匹有的进来，有的出去，四周堆着干草和麦秸，提桶的马夫、拿马具的马夫来回穿梭。隔间和单马厩多得数不过来，忙乱热闹的情形更没法用几句话说清楚。
        - id: ch01-b75
          speaker: elfrida
          text: 你们到底养了多少匹马？
        - id: ch01-b76
          speaker: narrator
          text: 她特意问了一个没跟其他马夫一起亲切招呼“小家伙们”的男人。既然他不认识他们，她便猜他刚来不久。事实证明，她猜得一点没错。
        - id: ch01-b77
          speaker: stableman
          text: 五十二匹。
        - id: ch01-b78
          speaker: elfrida
          text: 这么多马拿来做什么？
        - id: ch01-b79
          speaker: stableman
          text: 拉驿车、拉邮车、载国王的信使呀。要不是“乔治客栈”养着这些马，大家怎么走遍全国，又怎么听见各地的消息？
        - id: ch01-b80
          speaker: narrator
          text: 听了马夫的话，孩子们这才记起来，他们来到的是铁路、电报和电话都还没有出现的年代。一个人不小心闯进不属于自己的世纪以后，真不容易时时记清自己在哪里。埃德雷德恨不得留上一整天，看每个人怎样忙碌，也看那些漂亮的马匹。埃尔弗丽达却硬把他拖走了。他们还有一件要紧事，得去寻找女巫。
        - id: ch01-b81
          speaker: narrator
          text: 两个人终于在一间吓人的破屋里找到了她。腐烂的茅草顶破着几个大洞，整栋小屋摇摇欲坠。她和故事书插图里的女巫简直一模一样，只是手里没有扫帚，头上也没有尖顶高帽。她戴着一顶肮脏的软帽，原先也许是白的。锈迹斑斑的旧长袍原先也许是黑的，满是污痕的披肩从前也许是鲜红色，如今谁也说不准。一只黑猫坐在非常肮脏的木长椅上。老妇人自己蜷在摇晃的三脚凳上，怀里抱着一只芦花母鸡。她低着满是皱纹的脸，用两只黄瘦多皱的手，温柔地护着那只鸡。埃德雷德隔着歪歪斜斜的门洞，刚一看清她的模样，脚步便停住了。
        - id: ch01-b82
          speaker: edred
          text: 我不进去。进去有什么用？咱们明知道她没给我们下咒。要是跑进去说难听话，她倒可能真下一个，那可就惨了。
        - id: ch01-b83
          speaker: elfrida
          text: 可茶和糖还在这里。
        - id: ch01-b84
          speaker: edred
          text: 你送给她就出来。我在篱笆门边等。
        - id: ch01-b85
          speaker: narrator
          text: 埃尔弗丽达只好独自进屋，害怕地问了一声早安。
        - id: ch01-b86
          speaker: elfrida
          text: 我给您带了一点茶和糖。
        - id: ch01-b87
          speaker: narrator
          text: 她站在那里，等老妇人说一声谢谢。她觉得，自己既然先道了早安，又送上礼物，要是没等到这句回答便转身离开，实在不大合礼貌。可那声谢谢始终没有来。老妇人只是停下那只抚摸母鸡的手。
        - id: ch01-b88
          speaker: wise_woman
          text: 为什么？我又没有害你。
        - id: ch01-b89
          speaker: elfrida
          text: 没有，我相信您不会害我。
        - id: ch01-b90
          speaker: wise_woman
          text: 那你为什么带东西来？
        - id: ch01-b91
          speaker: elfrida
          text: 就是想送给您。我猜您会喜欢。这算一份心意礼吧。
        - id: ch01-b92
          speaker: narrator
          text: 这是伊迪丝姑妈教给她的说法。凡是一份礼物，不是因为赶上生日或圣诞节，也不是为了安慰刚拔过一颗牙的人，姑妈就把它叫作心意礼。
        - id: ch01-b93
          speaker: wise_woman
          text: 心意礼？隔了这么漫长的岁月，竟然还有人送我心意礼？
          emotion: surprised
        - id: ch01-b94
          speaker: narrator
          text: 埃尔弗丽达当然听不懂，她又怎么可能懂呢？一个女人一旦被怀疑是女巫，从前会受怎样的对待，就连我们当中最年长、最聪明的大人也很难想象，而那其实并不是多么久远的事。事情往往从这里开始。一个老妇人比邻居聪明，更能看出病人得了什么毛病，也更有办法治好他们。她的聪明还能帮她预告风暴、狂风和霜冻，也能叫她用探水杖寻找水源，那可是件神秘的事。只要双手握着一根分叉的榛树枝，从草地上走过，她就知道地下哪里有水。能这样发现水的人，多半还能找出许多别的事，是那些愚笨的邻居做梦也想不到的。在那些年月里，光是比邻居聪明许多，就足以惹祸。大家很快会叫她“智慧女人”，而从智慧女人到女巫，只有短短一步。
        - id: ch01-b95
          speaker: elfrida
          text: 您的鸡病了吗？
        - id: ch01-b96
          speaker: wise_woman
          text: 它会好的。我的双手已经把治愈的力量送进它身体里了。
        - id: ch01-b97
          speaker: narrator
          text: 老妇人起身把母鸡放到壁炉边。它先是一阵扑腾，又尖声咯咯叫起来，最后才伏进灰白的炉灰里。这番动静把黑猫惹得很不高兴。就在这时，老妇人突然伸出双手，按住埃尔弗丽达的肩头。
        - id: ch01-b98
          speaker: wise_woman
          text: 现在，这双手的治愈之力要送给你。你给我带来了一份心意礼。整整五十年来，我收到的礼物不是出于恐惧，就是求我办事的报酬。有人花钱买通我，叫我解咒，也有人叫我给别人下咒。从来没有人单单因为一片好心送我东西。可你带来的真是一份心意礼。我要告诉你，你心中所愿必会实现。你一生四周都会有爱。失去的终会找回，没有来的终会重来。世间的财物会眷顾你，心里的珍宝也会眷顾你。我知道，我看得见。你的前途尽是美好和光明，会像你善良的心一样纯净甘美。
          emotion: calm
        - id: ch01-b99
          speaker: narrator
          text: 老妇人收回双手。埃尔弗丽达被这番赞美深深打动了，又觉得自己实在不配。她一动不动地站在那里，不知道该说什么，也不知道该做什么，只觉得眼泪快要涌出来。
        - id: ch01-b100
          speaker: elfrida
          text: 可我只是听了厨娘的话，才把东西带来。
        - id: ch01-b101
          speaker: wise_woman
          text: 厨娘没有给你这颗善良的心。此刻为我难过得想哭的，是你自己。
        - id: ch01-b102
          speaker: narrator
          text: 老妇人慢慢沉下身子，重新缩成蜷曲的一团。她的说话声也跟着变了，不再像平常交谈，而像从很远的地方飘来的低低吟唱。
        - id: ch01-b103
          speaker: wise_woman
          text: 我知道许多事。漫长的白昼，像死亡一样漫长的黑夜，我一直孤零零地待着，也学会了看见。猫能看穿黑暗，我能看穿过去和未来。你不属于这里，也不属于现在。你会回到来处，这段不属于你的时光不会留下半点痕迹。等你回到自己的时代、自己的地方，我的祝福还会跟着你。因为你给阿登可怜的老智慧女人送来了一份心意礼。
        - id: ch01-b104
          speaker: elfrida
          text: 有什么事是我能替您做的吗？
          emotion: sad
        - id: ch01-b105
          speaker: wise_woman
          text: 亲亲我。用你这张小孩子的嘴亲亲我。它走过一百年光阴，就是为了给我这个吻。
        - id: ch01-b106
          speaker: narrator
          text: 埃尔弗丽达不愿意亲那张灰暗而布满皱纹的脸，可她的心愿意善待老妇人，于是她听从了自己的心。
        - id: ch01-b107
          speaker: wise_woman
          text: 啊，现在我看见了！我从来没有见过这样的幻象，从前没有一次能和今天相比。我看见城里的街道上，一团团像太阳似的光芒照耀着，如今那里却只有小小的油灯和忽明忽暗的提灯。我看见铁做的道路，喷火的巨龙拖着车厢，穷人和富人都坐在里面来来往往。人在英格兰开口，法国也能听见他的声音。不止如此，死去之人的声音也会保存在匣子里，只要活着的人愿意，它就能再次开口。乡间小屋里的手织机会消失，织工们将在有一千扇窗户的宫殿里劳作，每一扇窗都亮得如同白昼。太阳会俯下身来，替人留下肖像，比任何画家画得都更相像。有些船会像康吉鳗一样潜在海底，有些船会像大鸟一样飞过云层。如今一先令九便士的面包，将来只卖五便士。粮食和牛肉会越过大海运来，养活我们。每一个能够学习的孩子都会受到教导，而且……
          emotion: surprised
        - id: ch01-b108
          speaker: lord_arden
          text: 住口，饶舌的女人！
          emotion: angry
        - id: ch01-b109
          speaker: narrator
          text: 埃尔弗丽达回过头。祖父阿登勋爵站在门边，身姿笔直高大，满头灰发，身子倚着一根金头手杖。埃德雷德站在他旁边，显得又矮小，又像个当场被抓住的犯错孩子。老女巫仿佛根本看不见他们。她那双眼睛不停转动，又不断眨着，却没有望向任何东西。不过她一定听见了门口的呵斥，因为预言立刻换了方向。
        - id: ch01-b110
          speaker: wise_woman
          text: 阿登家将失去一切，阿登家将遭逢悲苦。宅中的帷幔会交给蜘蛛结网，精美的雕花家具会被老鼠一点点啃食。你们的金子越来越少，你们的家业不断衰败，一直往下落，直到房屋四周再没有一片田地属于阿登。
        - id: ch01-b111
          speaker: narrator
          text: 阿登勋爵耸了耸肩。
        - id: ch01-b112
          speaker: lord_arden
          text: 这故事倒很适合吓唬小娃娃。你若想让我信，就说说明天会发生什么。
        - id: ch01-b113
          speaker: wise_woman
          text: 明天，法国人会在利姆彻奇湾登陆。
        - id: ch01-b114
          speaker: narrator
          text: 阿登勋爵笑了起来。
        - id: ch01-b115
          speaker: wise_woman
          text: 我再给你三个征兆。
        - id: ch01-b116
          speaker: narrator
          text: 她的声音已经变得很虚弱。看进未来原本就是一件累人的事。即使有一个真正去过未来的人，用一个吻照亮了她的眼睛，也不会因此变得轻松。
        - id: ch01-b117
          speaker: wise_woman
          text: 你进门时，会在门槛上看见白鼹鼠精，那是阿登家的族徽。
        - id: ch01-b118
          speaker: lord_arden
          text: 这就算第一个征兆。
        - id: ch01-b119
          speaker: wise_woman
          text: 第二次，你还会看见自家的族徽。它会坐在自家客厅里，坐上你自己的椅子。
        - id: ch01-b120
          speaker: lord_arden
          text: 听起来可真有可能。
        - id: ch01-b121
          speaker: wise_woman
          text: 第三个征兆，是你家的族徽落在这个孩子怀里。
        - id: ch01-b122
          speaker: narrator
          text: 说完第三个征兆，她便背过身去，从炉灰里抱起那只芦花母鸡。阿登勋爵一手牵着一个孩子，把他们带离小屋。一路上，他把不听话的孩子训斥得很厉害，说他们不该四处乱跑，更不该去寻找邪恶的女巫。两个孩子没法替自己辩解，因为一开口，就只能说是厨娘叫他们来的，那样等于把责任推给她。他们当然不肯这样做，只得默默听着。
        - id: ch01-b123
          speaker: lord_arden
          text: 午饭只准吃面包喝水，好好学学规矩。
        - id: ch01-b124
          speaker: elfrida
          text: 祖父，别这么狠心。想想您小时候吧。您小时候肯定也爱去看女巫，对不对？
        - id: ch01-b125
          speaker: narrator
          text: 阿登勋爵先是气冲冲地瞪着她。可他听着听着，脸上的怒气忽然松开，最后竟咯咯笑出了声。
        - id: ch01-b126
          speaker: lord_arden
          text: 真是个大胆的丫头。我承认，我还记得在新教堂村附近看人把女巫按进水里。为了去看，我连家庭教师的课都逃过。
        - id: ch01-b127
          speaker: elfrida
          text: 您瞧，我们不是故意淘气，只是和小时候的您一模一样。您不会真罚我们只吃面包喝水吧？尤其是面包还那么贵。
        - id: ch01-b128
          speaker: narrator
          text: 这句关于面包的话再次逗乐了阿登勋爵，他又咯咯笑了起来。
        - id: ch01-b129
          speaker: lord_arden
          text: 这只小白鼠竟然也长出舌头了。我自己还穿衬裙的时候起，就没人敢这样顶撞我。好了，这回不追究。
        - id: ch01-b130
          speaker: narrator
          text: 埃德雷德原本暗暗觉得妹妹像个十足的傻瓜，这时却改变了看法。三个人转身穿过夏日的田野，朝阿登城堡走去。眼前的城堡似乎比孩子们第一次见到时多出了不少地方，也比那时整齐得多。走近大门，他们看见门阶上端端正正坐着一只白鼹鼠。
        - id: ch01-b131
          speaker: elfrida
          text: 您瞧！
          emotion: surprised
        - id: ch01-b132
          speaker: narrator
          text: 话音刚落，鼹鼠便倏地消失了，快得像一笔白颜料刚刚涂上，就被人一把擦掉。
        - id: ch01-b133
          speaker: lord_arden
          text: 呸，世上的白鼹鼠多着呢。门口碰见一只，有什么可稀奇的？
        - id: ch01-b134
          speaker: narrator
          text: 可是等阿登勋爵走进自家的客厅，看见白鼹鼠端坐在他自己的雕花扶手椅上，他也不得不承认，这件事十分不同寻常。埃尔弗丽达立刻弯下腰，朝它伸出双臂。再次见到鼹鼠，她实在高兴极了。自从兄妹俩来到这个陌生时代，她一直觉得，只要鼹鼠就在手边，就是世上最大的安慰。它明白所有事情，可以留下来保护他们，在需要时给他们出主意。最重要的是，它还能把两个孩子平平安安送回真正属于自己的世纪。
        - id: ch01-b135
          speaker: narrator
          text: 鼹鼠精朝她短短跑了几步，接着轻轻一跃，正好跳进她伸出的双臂。埃尔弗丽达稳稳接住它，用两只手把这团白色的小东西搂在腰间。
        - id: ch01-b136
          speaker: elfrida
          text: 陪着我吧。
        - id: ch01-b137
          speaker: lord_arden
          text: 老天爷！
          emotion: surprised
        - id: ch01-b138
          speaker: narrator
          text: 阿登勋爵这一声并不是对着某一个人说的。他抬眼望着四周，简直是在冲天地万物惊叹。
        - id: ch01-b139
          speaker: edred
          text: 这下您总该明白了吧。
