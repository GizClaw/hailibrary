audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 亲切从容，带一点温和的幽默
        timbre: 温暖清亮
        pace: 舒缓而有变化
        pitch: 中等
    edred:
      display_name: 埃德雷德
      tts:
        delivery: 聪明好胜，认真里带着孩子气
        timbre: 清脆明亮的男孩声
        pace: 自然偏快
        pitch: 中高
    elfrida:
      display_name: 埃尔弗丽达
      tts:
        delivery: 直率活泼，敏锐又有主意
        timbre: 清亮的女孩声
        pace: 轻快
        pitch: 高
    mouldiwarp:
      display_name: 白鼹鼠精
      tts:
        delivery: 古怪倦怠，乡音浓重又爱挖苦人
        timbre: 沙哑细小的老者声
        pace: 忽快忽慢
        pitch: 中高
    richard:
      display_name: 表兄理查德
      tts:
        delivery: 机敏爽朗，警觉时果断认真
        timbre: 明亮的少年声
        pace: 自然偏快
        pitch: 中高
    lord_arden:
      display_name: 阿登勋爵
      tts:
        delivery: 正直沉稳，温厚中带着责任感
        timbre: 温暖坚实的成年男声
        pace: 从容
        pitch: 中低
    uncle_jim:
      display_name: 吉姆舅舅
      tts:
        delivery: 爽快务实，遇事果断
        timbre: 明朗厚实的成年男声
        pace: 自然
        pitch: 中低
    aunt_edith:
      display_name: 伊迪丝姑妈
      tts:
        delivery: 温柔热切，喜悦时真挚动情
        timbre: 柔和清亮的成年女声
        pace: 自然偏缓
        pitch: 中等
  chapters:
    - id: ch01
      title: 最后一次白时钟之旅
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 白鼹鼠精高喊着去找理查德·阿登，跳上珍珠象牙时钟的时针。钟针转得太快，谁也没法开口。它忽然停下，埃德雷德才喘过一口气，立刻扯着嗓子喊，要时钟带他们去找爹爹。钟针应声重新飞转，孩子们根本来不及看清它刚才停在了哪里。他们只瞥见自己到过一间屋子，也看见白鼹鼠精忽然长得像一头巨大的北极熊。它探出钟沿，用一只足有一英尺长的爪子去抓什么东西。有人喊了一句话，他们没能听清。几乎同时，时钟停住了，一个身影从钟上爬下来。等孩子们再看清四周，时钟已经回到走私者洞穴，眼前正是表兄理查德。他换掉了亨利八世五月节时的衣裳，穿得很像埃德雷德去波尼时代时的样子。洞穴也和那次一模一样，堆着一桶桶、一捆捆货物，溪水仍从洞里流过。
        - id: ch01-b02
          speaker: mouldiwarp
          text: 你非跟我们走不可。还不明白吗？这两个孩子要是让父亲认出来，就得把整件魔法的事解释清楚。可魔法一经解释，所有魔力就全没啦，跟香水瓶忘了塞瓶塞、香气一点点跑光一样。不过你不一样。你可以去见他，也可以在他需要时帮忙，而且半句魔法都不必解释。
        - id: ch01-b03
          speaker: richard
          text: 好吧。不过我把自己的魔法丢在这里了。
        - id: ch01-b04
          speaker: narrator
          text: 理查德从沙地捡起一根挂满银铃的小棍，像嘉年华会上愚人拿的那一种。棍上刻着阿登家的盾牌、方格和白鼹鼠精。
        - id: ch01-b05
          speaker: richard
          text: 现在可以走了。表弟表妹，我把以前说过的话全收回来。你们看，我父亲已经死了。要是当初我能有你们一半的机会……我刚才想的就是这个。现在明白了吗？来吧，把手给我。
        - id: ch01-b06
          speaker: narrator
          text: 大家把手握在一起。可埃尔弗丽达害怕了。先前的一切像游戏，这一次却是真的。
        - id: ch01-b07
          speaker: mouldiwarp
          text: 这回当然是真的，我的小袜羔儿。理查德会帮你们。等你们把父亲找回来，俺一点也不怀疑你们会找到，迪克表兄就会回到自己的时代，回到他自己那一辈人中间，从此再也不出现。你们父亲永远不会猜到，你们曾经离他那么近，就像这一回这样近。
        - id: ch01-b08
          speaker: elfrida
          text: 我不相信我们能找到他。
        - id: ch01-b09
          speaker: mouldiwarp
          text: 你自己都不信，当然找不到。这道理跟葡萄干面包一样明白。
        - id: ch01-b10
          speaker: edred
          text: 我相信我们能找到。埃尔弗丽达只是个女孩子。也许这一切是一场梦，可我宁愿留在梦里。不带父亲回去，我绝不回阿登。
        - id: ch01-b11
          speaker: mouldiwarp
          text: 听清楚。俺去你们那个世纪里的另一个时间和地方，这趟魔法就彻底结束。以后什么也没有啦。
        - id: ch01-b12
          speaker: edred
          text: 我们再也不能回到过去找宝藏了吗？
        - id: ch01-b13
          speaker: mouldiwarp
          text: 不是机会不机会。俺是说，再也不会有白时钟给你们。还有，你找到父亲，就不再是阿登勋爵了。
        - id: ch01-b14
          speaker: narrator
          text: 听见最后一句，埃德雷德胸口真的疼了一下，像一把尖刀刺进有血有肉的胸膛。他明明可以用一个头衔换回爹爹，却在一瞬间冒出了最可怕的念头。也许这全是胡闹，也许爹爹根本不在那里，反正寻找也没有用。他想继续做阿登勋爵，甚至想问一句，他们是不是干脆回家更好。说实话，这样的想法很不应该，可它们并非埃德雷德有意招来的。他仿佛用两只手把它们狠狠推开，又因为它们来过而厌恶自己。以后每次想起来，他都会再恨自己一次，哪怕那不是他的本意，也不是他愿意去想的。念头最糟糕的地方就在这里。它们会永远活着。
        - id: ch01-b15
          speaker: edred
          text: 我不想当阿登勋爵，我要我的父亲。
        - id: ch01-b16
          speaker: narrator
          text: 这句话是他的真心话。
        - id: ch01-b17
          speaker: mouldiwarp
          text: 要俺陪你们一道去吗？
        - id: ch01-b18
          speakers: [edred, elfrida, richard]
          ensemble: chorus
          text: 要！
        - id: ch01-b19
          speaker: narrator
          text: 去一个谁也不认识的地方，身边有只友善的白鼹鼠精，确实很有用。可它仍不厌其烦地提醒大家，这就是最后的结局。以后不会再有阁楼里的箱子、箱子里的华服，也不会再有白时钟。
        - id: ch01-b20
          speaker: edred
          text: 我们懂了。现在快走吧。
        - id: ch01-b21
          speaker: mouldiwarp
          text: 别急。你们得决定变成什么样，还得选好让父亲从哪条路出来。俺看就走白垩裂缝。
        - id: ch01-b22
          speaker: elfrida
          text: 随你安排。亲爱的白鼹鼠精，我们以后真的再也见不到你了吗？
        - id: ch01-b23
          speaker: mouldiwarp
          text: 俺可没说这个。你们每天吃饭都能见到俺。匙子和叉子上都有俺呢。
        - id: ch01-b24
          speaker: narrator
          text: 它窃笑起来，笑声比任何时候都气人。埃德雷德却突然想出了主意。
        - id: ch01-b25
          speaker: edred
          text: 鼹鼹，你把我们变个样子，不让父亲认出。这样不管那边发生什么，我们都能跟着。
        - id: ch01-b26
          speaker: richard
          text: 这主意好极了。我也要变。
        - id: ch01-b27
          speaker: mouldiwarp
          text: 你不行。
        - id: ch01-b28
          speaker: narrator
          text: 白鼹鼠精朝两个孩子挥了挥白爪子。他们立刻穿上紧贴身体的白毛衣裳，连手也套进肥厚的白毛手套，每根指头尖上还伸着一只老虎爪。与此同时，白鼹鼠精又膨胀起来，足有一头很小的北极熊那么大，表兄理查德也突然变成了巨人的身量。它一声令下，所有人都跃上白时钟。钟针一刻也没耽搁，马上带着他们离开洞穴。
    - id: ch02
      title: 白猫越过悬崖
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 时钟停在一片厚厚的苔藓上。头顶尽是参天巨树，星星透过枝叶发出奇妙的金光。空气暖融融的，呼吸起来也带着花一样的香气。奇怪的是，孩子们裹着毛皮衣裳，却一点也不觉得热。脚下的苔藓实在太柔软，他们很想用手也摸一摸，便自然而然趴成了四肢着地的样子。紧接着，他们又渴望躺下，在苔藓上打滚。那愿望强烈得抵挡不住，于是两人真的滚了起来。柔软的苔藓贴着全身，滋味美妙极了。理查德仍有巨人那么大，站在旁边低头直笑。孩子们只顾打滚，忙得连彼此变成了什么模样都没看。
        - id: ch02-b02
          speaker: richard
          text: 这才叫好玩。现在去白垩裂缝。白鼹鼠精，要我抱着您吗？
        - id: ch02-b03
          speaker: narrator
          text: 白鼹鼠精竟然答应了。理查德抱着它向前走，孩子们跟在后面。不知是苔藓、毛皮衣裳，还是那双毛手套的缘故，四肢着地走路格外容易，也格外自然。其实，他们的手走起路来和脚一样好用。他们从没觉得身体这样轻，心情这样快活，也从没觉得走路是如此轻松的事。理查德领他们穿过森林，前方忽然立起一道大悬崖，把树林齐齐截断，仿佛灌木园尽头的一堵墙。崖壁中嵌着一道黑色裂口，黑暗一直伸向他们头顶。月亮从云后出来，照亮雪白的崖面。那崖面和裂口的模样，活像白鼹鼠精在家乡萨塞克斯丘陵掀开草皮时留下的白垩裂缝。孩子们一路始终没有互看，因为值得看的东西实在太多了。
        - id: ch02-b04
          speaker: richard
          text: 就是那里。
        - id: ch02-b05
          speaker: narrator
          text: 裂口里没有台阶，只有窄小的石棱，连最客气的山羊也只能勉强称它们为落脚处。
        - id: ch02-b06
          speaker: edred
          text: 你这么大，肯定爬不上去。
        - id: ch02-b07
          speaker: narrator
          text: 可埃德雷德毫不怀疑自己和姐姐能爬。白鼹鼠精跳到地上，说该由自己驮理查德，随即从容地长成北极熊大小。
        - id: ch02-b08
          speaker: richard
          text: 他们竟然还没看出来。
        - id: ch02-b09
          speaker: elfrida
          text: 看出什么？
        - id: ch02-b10
          speaker: richard
          text: 看出你们变成了什么。亲爱的表弟表妹，你们是两只白猫！
        - id: ch02-b11
          speaker: narrator
          text: 姐弟俩终于互相看了一眼。果然，他们都是猫。
        - id: ch02-b12
          speaker: richard
          text: 这里的人从没见过驯养的猫。他们把能驯服动物的人当成魔法师，我上次来时就知道了。如今我有三只白色的驯兽，只要白鼹鼠精肯配合。你会配合吧？
        - id: ch02-b13
          speaker: mouldiwarp
          text: 啊，俺当然配合！
        - id: ch02-b14
          speaker: richard
          text: 你们只许喵喵叫和打呼噜。我叫做什么就做什么。除了我和你们父亲，谁的吩咐也别听。
        - id: ch02-b15
          speaker: elfrida
          text: 父亲真的在这里？
          emotion: fearful
        - id: ch02-b16
          speaker: richard
          text: 他就在悬崖另一边。人爬不过这道崖，可你们能。
        - id: ch02-b17
          speaker: narrator
          text: 理查德骑上白鼹鼠精的背，两条胳膊紧紧搂住它北极熊般的脖子。白鼹鼠精驮稳了他，开始沿着裂口向上爬。那可真是一场艰难的攀登。如今埃德雷德和埃尔弗丽达不得不承认，自己的确变成了猫。可就连猫，要在那些又窄又滑、还向外倾斜的石棱上站稳，也几乎得使出全身本领。他们每一步都要找准爪子落下的位置，再小心把身体提上去。要不是长着能看穿黑暗的猫眼，他们根本不可能走过这条路。攀登又漫长得出奇。头顶的出口仿佛永远那么遥远，这场爬行也仿佛永远不会结束。
        - id: ch02-b18
          speaker: elfrida
          text: 我听说过在外国攀爬，可没想到是这样。这里算外国吧？
        - id: ch02-b19
          speaker: richard
          text: 南美洲。回家以后可以找地图，不过你们找不到这里。继续走！
        - id: ch02-b20
          speaker: narrator
          text: 登上崖顶，他们还得从另一面爬下去。悬崖像一堵巨墙，把森林与辽阔平原隔在两边。等他们终于落到平地，太阳已经越过崖顶，低头照着大家。这片奇妙的平原大得望不到边，四周又全是高耸的悬崖。道路、林荫大道、田野和园林铺展得井井有条，城镇与宫殿散落其间。一道架在数百根石柱上的高大引水渠，从崖面的一座拱门把水送到平原中央。许多运河又从那里流向四周的崖壁，笔直匀称，像车轮的一根根辐条。它们最终钻进低矮的石拱，重新流回悬崖底下。平原上还有湖泊、花园和一座座宏伟石屋。朝阳落在屋顶上，把它们照得像金子一样闪亮。
        - id: ch02-b21
          speaker: narrator
          text: 田里放着长角牛和肩背高耸的奇怪绵羊。
        - id: ch02-b22
          speaker: richard
          text: 那是羊驼。我在邮票上见过。
        - id: ch02-b23
          speaker: narrator
          text: 一行人继续向平原深处走，最后在一棵枝叶舒展的大树下坐好。理查德告诉大家，现在什么也不必做，只需在原地等人发现。他俨然已经完全接管了这趟远征，所有事都由他发号施令。埃德雷德和埃尔弗丽达既然变成了猫，只能服从他的安排，可两人心里并不喜欢。不久，清早前来照料羊群的牧人发现了树下的奇景。一个身穿奇装异服的少年坐在那里，身旁守着一头大白熊和两只雪白的猫。
        - id: ch02-b24
          speaker: narrator
          text: 牧人见到白熊并不害怕，只是围在一旁好奇地打量。白鼹鼠精先用后腿站起来，向他们庄重地鞠了一躬。两只猫也听从理查德的号令，一会儿站起，一会儿躺下，又伸爪握手，接着连翻几个筋斗。牧人们越看越觉得有趣。其中一个忽然下定决心，把红色羊毛斗篷紧紧裹在身上，又打手势示意理查德跟随自己。他转身使出全身力气，朝最近的城镇飞奔而去。
        - id: ch02-b25
          speaker: narrator
          text: 没过多久，他们站在一座举世无双的美丽城镇中央。真希望我有时间，把那里的一切都讲给你听，可惜没有。我只能告诉你，这座城既整洁宏伟，又灿烂舒适。从城头走到城尾，看不见一个肮脏角落，也看不见一张忧愁的脸。房屋全用巨石砌成，金银精巧地镶在石块之间。每条街边都流着清澈小溪，或者说，是婴儿般的小运河。宽阔街道两旁各有一排树，一直从街头延伸到街尾。城中铺着开阔草地，也有一畦畦花坛。花朵有的绽放着天然可爱的颜色，有的却由金银珠宝巧妙制成。那里还有喷泉和一座座微小瀑布，清亮的水声在街道间流动。居民肤色黝黑，神情和善，脸上没有皱纹。市集摊位摆着诱人的水果、糕点，还有颜色鲜艳、摸起来一定很柔软的衣料。城中央有一座大会堂，平坦屋顶上还建着花园。牧人领他们穿过所有这些景物，径直走向那里。
    - id: ch03
      title: 黄金平原里的父亲
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 大会堂高大的镶嵌木门敞开着。长厅里挤满了人，个个穿着颜色美丽的柔软衣料。大厅露天而建，一幅起皱的篷布收拢在一旁，看来只要人们愿意，随时都能把头顶遮起来。大厅尽头有一座高起的石台，台上摆着三把椅子。人群为牧人和他领来的奇异队伍让开道路。两只白猫走近石台，抬头看见正中的大椅里坐着一位气派非凡、面色黝黑的国王。他戴着头巾般的冠帽，上面插着两根长羽毛。左右两边的人穿着精美绣衣，脖子上围着闪亮的珠宝项圈。那两个人竟然就是父亲和吉姆舅舅。
        - id: ch03-b02
          speaker: richard
          text: 一句话也不许说！
        - id: ch03-b03
          speaker: narrator
          text: 他来得及拦住孩子们的声音，却拦不住他们的行动。大厅里每一个人都看见，两只白猫猛然冲到右边椅子前，围着那个人的腿拼命磨蹭。埃德雷德和埃尔弗丽达够不着父亲别处，只好用整个白猫身体贴着他的双腿，满心狂喜地发出响亮呼噜声。所处的危险不许他们说话，能这样亲近父亲，已经叫人无比快慰。国王从高座站起，用睿智和善的眼睛低头看着他们，似乎问了一个问题。谁也听不懂他的语言，可白鼹鼠精像是知道该怎样回答。它立刻在这座神秘王国的国王面前跳起舞来。它的舞不输任何受训的熊，姿态却优美得多。大厅里所有人的目光都追着这头奇异白熊。迪克吹了声口哨，两只猫才恋恋不舍地离开他们唯一够得到的父亲的双腿，用两条白色后腿站起。
        - id: ch03-b04
          speaker: edred
          text: 小步舞。
        - id: ch03-b05
          speaker: narrator
          text: 迪克吹起一首孩子们从没听过、却恰好合用的曲子。众人眼前出现了一幕奇景。两只白猫一本正经地慢慢起舞，转身、迈步、鞠躬，把复杂的小步舞一式一式跳了出来。伊迪丝姑妈从前教他们的优雅姿态，他们竟然一个也没忘。最后一次鞠躬和屈膝礼结束时，国王亲自喊出一个词。孩子们确信，那意思就是“跳得好”。所有居民也跟着喊，只有父亲和吉姆舅舅喊的是“好极了”。国王随后向迪克问话，他却不回答，只把一根手指按在嘴唇上。国王便转向父亲。父亲先用英语和法语提问，又换了几种别的语言。迪克仍一遍遍把手指放在唇上，白熊颇为悲伤地摇着头，两只白猫则始终盯着父亲，响亮地打着呼噜。
        - id: ch03-b06
          speaker: richard
          text: 你们父亲一出去，就跟着他。
        - id: ch03-b07
          speaker: narrator
          text: 国王离开王座，其他人也都跟着动了起来。两只白猫立刻抛下迪克，紧跟在父亲脚后，一步也不肯落下。国王看见以后，向几个正把理查德领往别处的人说了几句话。那些人随即改变方向。不久，两只猫、白鼹鼠精变成的熊和理查德，便与父亲、吉姆舅舅单独站在一座美丽露台上。头顶枝叶舒展的树木遮着阴凉，露台边缘则整整齐齐摆满纯银花瓶。奇妙的红花、白花和紫花从瓶口垂下来，沿着露台边缘铺成一片鲜艳的帘子。理查德仔细看了看四周。附近再没有一个棕色皮肤的当地居民，他这才转过身，直视孩子们父亲的眼睛，把声音压得极低。
        - id: ch03-b08
          speaker: richard
          text: 我是英国人，是来救你们的。
        - id: ch03-b09
          speaker: lord_arden
          text: 你这孩子胆量很大，可我们逃不出去。
        - id: ch03-b10
          speaker: richard
          text: 时间不多。他们只是想看看你们认不认识我们，恐怕还在偷听。老勋爵已经去世，如今您才是阿登勋爵。只要完全听我的，我就能带您离开。
        - id: ch03-b11
          speaker: uncle_jim
          text: 值得一试。不管是什么办法，都值得试。
        - id: ch03-b12
          speaker: richard
          text: 你们能随意去任何地方吗？
        - id: ch03-b13
          speaker: lord_arden
          text: 可以。这里只通一条出路，那里守着一百个带毒箭的人。
        - id: ch03-b14
          speaker: richard
          text: 还有我们来的那条路。白熊能一次驮一个人出去。
        - id: ch03-b15
          speaker: lord_arden
          text: 我们真要冒险吗？
        - id: ch03-b16
          speaker: uncle_jim
          text: 当然！想想伊迪丝和孩子们。
        - id: ch03-b17
          speaker: lord_arden
          text: 我想的正是他们。只要还活着，就总有机会。可要是逃跑失败，他们会杀了我们。
        - id: ch03-b18
          speaker: richard
          text: 不会失败，我会帮你们回家。不过我很想知道，你们怎么会落到这里。只是好奇。过了今天，我也许再见不到您了。
        - id: ch03-b19
          speaker: lord_arden
          text: 我们在这些山里勘探金矿，无意间撞见了黄金平原唯一的入口。从那以后，他们一直把我们当作囚犯，因为他们决心不让外面的世界知道这片平原确实存在。外界总有关于这里的传闻，可到现在为止，还没有任何所谓的文明人真正找到过它。这里的每一位国王登上王位时都要立誓。他宁可死，也绝不准现代文明带来的邪恶和残酷侵入这里，玷污这片平原。
        - id: ch03-b20
          speaker: richard
          text: 我也赞成。
        - id: ch03-b21
          speaker: lord_arden
          text: 这里的文明比印加文明还古老，这里的生活也是我做过的最美好的梦。他们要是肯信任我，我绝不会出卖他们。即使我真的逃出去，也永远不会泄露这里的秘密。要是我让外界那套可怕的托拉斯、辛迪加、唯利是图和罪恶闯进来，毁掉这种黄金般的生活，我会明白自己犯下了大罪。那罪行不会比亲手把一个小孩子扔给野兽轻一点。
        - id: ch03-b22
          speaker: narrator
          text: 两只白猫惊讶又敬佩。父亲和理查德说话，完全把他当作成年人。
        - id: ch03-b23
          speaker: lord_arden
          text: 我们想办法给一家报纸捎去了一句话，说自己被强盗抓走。他们只准我们透露这么多。除了不能自由离开，我们在这里什么都有。这里的人给我们食物和衣裳，也给我们善意、公正与关爱。为了我的妹妹伊迪丝和孩子们，只要有可能，我们就非逃走不可。可我得承认，离开这里，真像从伊甸园走出去，一脚踏进烟尘笼罩的黑乡。
        - id: ch03-b24
          speaker: uncle_jim
          text: 一点不错。
        - id: ch03-b25
          speaker: lord_arden
          text: 既然以后也许见不到你，那就告诉我，你为什么冒这么大的风险来帮我们？
        - id: ch03-b26
          speaker: richard
          text: 我欠每一个姓阿登的人一笔债。
        - id: ch03-b27
          speaker: narrator
          text: 他的声音越说越低，两只猫只听见了“家族之主”。
        - id: ch03-b28
          speaker: richard
          text: 看见那边的黑色裂口了吗？月亮升起时，你们两个到那里，我会让你们安全回到阿登城堡。
        - id: ch03-b29
          speaker: lord_arden
          text: 你也得跟我们走。也许我能帮你。我们在利马的银行存着一笔不小的钱，没用自己的名字。只要你救我们出去，我们就能取到。你给我们带来了好运，跟我们走，也分一份吧。
        - id: ch03-b30
          speaker: richard
          text: 不行。我得回到自己的时代，也就是自己的地方。现在该走了。小猫们，跟上。
        - id: ch03-b31
          speaker: narrator
          text: 两只猫恳求地看着父亲，仍旧站到理查德身边。
        - id: ch03-b32
          speaker: richard
          text: 我们可以走吗？
        - id: ch03-b33
          speaker: lord_arden
          text: 这里每个人都完全自由，只有一件事不准做，就是离开黄金平原。这个地方奇怪得很，法律少得出奇。所有人都可以随心所欲，可谁也不愿意去做会伤害别人的事。只有一条不能触犯。如果有人想逃到外面的世界，或者企图把外面的人带进来，他就会被处死。行刑不会让他受痛苦，也不是为了报复。这里的人只是认为，为了保护平原，那件事非做不可。
        - id: ch03-b34
          speaker: narrator
          text: 两只白猫忧郁地对望。这可不像他们记忆中爹爹对孩子说话的样子。
        - id: ch03-b35
          speaker: lord_arden
          text: 可为了孩子和妹妹，我们必须冒险。我完全信任你。月亮升起时，我们一定到裂缝那里。
        - id: ch03-b36
          speaker: narrator
          text: 理查德带着三只白色动物离开露台，顺着凿在整块岩石里的台阶向下走。城里人热情地围过来，把各式礼物塞到他们面前。他们送给理查德新鲜水果和玉米烤成的饼，又捧出黄金浅盘，给两只白猫盛来牛奶。过了一阵，理查德揉揉眼睛，打手势表示自己困了。人们没有阻拦，让他走到田野里休息，三只白色动物依旧紧紧跟在后面。谁也没有露出怀疑的神色，更没有人知道，这场看似有趣的驯兽表演，其实是在为逃亡争取机会。时间一点点过去。等到约定的时刻，所有人都悄悄来到那道巨大悬崖下碰面。月光将高高的崖壁照得苍白，通往外界的裂缝就在他们头顶。悬崖是黄金平原天然的围墙，也是守护这里不受外界侵扰的卫士。
    - id: ch04
      title: 从黄金平原逃回阿登
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 白鼹鼠精先把吉姆舅舅驮上崖顶，又沿着险峻石棱返回，准备再接阿登勋爵和理查德。可他们还没来得及继续行动，身后的城里突然爆出一声呐喊。一千支火把同时燃起，像一片摇晃的火海从黑暗中冒出来。所有人马上明白，他们的逃亡已经暴露。
        - id: ch04-b02
          speaker: mouldiwarp
          text: 没时间啦！
        - id: ch04-b03
          speaker: narrator
          text: 白熊张嘴说话，惊得阿登勋爵目瞪口呆。两只白猫也忘了禁令。
        - id: ch04-b04
          speakers: [edred, elfrida]
          ensemble: duo
          text: 啊，爹爹，太可怕了！我们该怎么办？
          emotion: fearful
        - id: ch04-b05
          speaker: mouldiwarp
          text: 闭上傻嘴！早叫你们别唠叨。快用白爪子挖条路！
          emotion: angry
        - id: ch04-b06
          speaker: narrator
          text: 白鼹鼠精立刻做给他们看。它用那双强壮、粗钝又弯曲的前爪，拼命抓挠巨大的悬崖。两只猫也扑到崖前，挥起白色肉垫手套上的老虎爪，一下一下跟着刨。坚硬的岩石竟然在爪下退让。一道白色裂缝先是细细出现，接着越张越宽。与此同时，平原上的火把摇摇晃晃，旋转涌动着向他们逼近，已经越来越近了。
        - id: ch04-b07
          speaker: mouldiwarp
          text: 进去！全都进去！
        - id: ch04-b08
          speaker: lord_arden
          text: 吉姆不来，我绝不走！
        - id: ch04-b09
          speaker: mouldiwarp
          text: 他已经爬到一半了。快走，俺叫你走就走！
        - id: ch04-b10
          speaker: narrator
          text: 白鼹鼠精用巨大的白肩膀顶住阿登勋爵，把他一步步推进裂缝，又催着理查德和两只白猫全都钻进去。最后一只爪子刚离开入口，身后的悬崖便严丝合缝地闭拢，再也看不出那里曾有一道门。它像在追兵面前竖起一个巨大而无法反驳的“不”字，把所有火把和喊声都挡在了黄金平原那边。
        - id: ch04-b11
          speaker: mouldiwarp
          text: 朝前面亮着的地方走，那边就是出口。
        - id: ch04-b12
          speaker: edred
          text: 这里是走私者洞穴！时钟也在那儿！
        - id: ch04-b13
          speaker: narrator
          text: 可下一刻，时钟便不在那里了。理查德已经纵身跳上钟面，跟着它一起消失。最后关头，白鼹鼠精也跃起身，牢牢攀住时针。两只白猫，也就是埃德雷德和埃尔弗丽达，赶忙向后退，躲开飞旋的钟针。那阵旋转正是消失的第一步。他们看见父亲和吉姆舅舅走上石阶，向那扇粗糙木门走去。门上的钥匙像一把教堂大门的钥匙。门外就是金雀花丛中的出口，也是孩子们从前离开以后，再也没能找到的地方。
        - id: ch04-b14
          speaker: narrator
          text: 等时钟彻底消失，两只猫才跟着父亲走上台阶，重新来到阳光明媚的户外。云雀仍和往常一样在天空歌唱。他们出来得恰是时候，远远看见两个人影正朝城堡走去，而且已经离大门很近。直到这时，孩子们才停下来，转过头认真打量彼此。
        - id: ch04-b15
          speaker: edred
          text: 你已经不是猫了！
          emotion: surprised
        - id: ch04-b16
          speaker: elfrida
          text: 你也不是。埃德雷德，他们进大门了！这次究竟是真的，还是一场梦？这一回比以前任何经历都更像梦。
        - id: ch04-b17
          speaker: edred
          text: 我觉得自己一辈子都是猫，还每天都被人揪着尾巴甩。我得坐一会儿，弄清自己到底是白猫，还是埃德雷德·阿登。
        - id: ch04-b18
          speaker: elfrida
          text: 我知道自己是谁。
        - id: ch04-b19
          speaker: narrator
          text: 可她也很乐意坐下歇歇。
        - id: ch04-b20
          speaker: edred
          text: 那很容易。你既不是白猫，也不是埃德雷德·阿登。两个都不是。
    - id: ch05
      title: 爱与欢乐的宝藏
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 半小时后，孩子们才从草地上站起来，慢慢走下山坡，回到城堡。他们一路仍旧拿不准，那些魔法般的事情究竟真的发生过，还是所有看似发生的魔法，只是一场两个人同时做的梦，也就是一对孪生的梦。走到门前时，他们看见伊迪丝姑妈正在那里等着。她的脸白得像白时钟上的珍珠与象牙，眼睛却亮得像埃尔弗丽达献给王后的野花上那些露珠。她显然已经等了很久，满腔喜悦几乎从发亮的眼睛里涌出来。
        - id: ch05-b02
          speaker: aunt_edith
          text: 啊，孩子们！我亲爱的、最亲爱的孩子们！
          emotion: happy
        - id: ch05-b03
          speaker: narrator
          text: 伊迪丝姑妈说着便跪到地上，让自己的脸靠近孩子们的脸，让自己的双臂也能从同样的高度环住他们。这样一来，她就可以像一个和他们一般高的人那样，平等地把两个孩子紧紧搂进怀里。
        - id: ch05-b04
          speaker: aunt_edith
          text: 发生了一件最美好的事，好得让你们不敢相信。
          emotion: happy
        - id: ch05-b05
          speaker: narrator
          text: 孩子们立刻热烈地亲吻她。他们这样做，一半是因为真的爱她，见她如此快活，自己也十分欢喜。另一半却是为了遮住脸上的表情，免得姑妈看出，他们听见这个天大的好消息，竟然一点也没有露出惊讶的样子。
        - id: ch05-b06
          speaker: aunt_edith
          text: 这是世上最美好的事。你们猜猜是什么？
          emotion: happy
        - id: ch05-b07
          speaker: elfrida
          text: 爹爹回家了。
        - id: ch05-b08
          speaker: narrator
          text: 埃尔弗丽达觉得自己假装猜中，实在虚伪得可怕。
        - id: ch05-b09
          speaker: aunt_edith
          text: 对！你真聪明，我的小宝贝。吉姆舅舅也回来了。他们被囚禁在南美洲，是一个带表演熊的英国男孩帮他们逃出来的。
          emotion: happy
        - id: ch05-b10
          speaker: narrator
          text: 她半句也没提猫。孩子们觉得受了伤。
        - id: ch05-b11
          speaker: aunt_edith
          text: 后来他们吃尽了苦，走了好几个月、好几个月、好几个月，才穿过南美洲内陆。一路上找不到水，还遇见印第安人和各种各样的险事。你们爹爹发了高烧，怎么也不肯改口，非说那头熊就是我们家徽上的白鼹鼠精。它活过来以后，还能像你我一样开口说话。他又说那里有两只白猫，声音和你们一模一样，还管他叫爹爹。不过他现在已经没事了，只是身体仍然很虚弱。所以我才要先把这些全告诉你们。你们见到他时，一定要安安静静，温温柔柔。啊，这件事美好得简直不像真的，实在太美好了！
          emotion: happy
        - id: ch05-b12
          speaker: narrator
          text: 那么，到底是孩子们的父亲发了脑热，才幻想出这一切？还是那两个没有发烧、脑子也不算太多的孩子，把一切都想象了出来？吉姆舅舅能把事情怎样发生讲得清清楚楚，可他的故事里一点魔法也没有。父亲，我是说阿登勋爵，从来不谈自己脑热时做过什么梦。埃德雷德和埃尔弗丽达也不谈自己没有发脑热时发生的事。至少，他们会谈，却只肯告诉我。
        - id: ch05-b13
          speaker: narrator
          text: 这一切都奇妙而神秘。其实，生活本来就常常如此，只要你肯稍稍钻到表皮下面，不满足于只读报纸、只坐地铁、只买现成衣裳，也不认定一件事除非无聊透顶，否则就不可能是真的。
        - id: ch05-b14
          speaker: aunt_edith
          text: 我找到了阿登城堡旧画的翻拍照片，漂亮极了。照着照片，我们能把城堡完全修复。真希望我知道原画在哪里。
        - id: ch05-b15
          speaker: lord_arden
          text: 恐怕还是修不起。我们那点财产能让大家舒服生活，却重建不了诺曼人的石墙。
        - id: ch05-b16
          speaker: edred
          text: 真希望我们找到了埋藏的宝藏。
        - id: ch05-b17
          speaker: aunt_edith
          text: 我们已经有足够多的宝藏了。
        - id: ch05-b18
          speaker: narrator
          text: 伊迪丝姑妈说这句话时，眼睛并没有望向城堡的石墙，也没有望向那些能帮助他们修复城堡的旧画照片。她含着笑，安安静静看着吉姆舅舅。至于埃尔弗丽达心里怎样想，真希望你能亲眼看见她傍晚走进客厅时的脸。就在不久以前，伊迪丝姑妈还跪下来，让自己与孩子们一样高，从相同的高度平等地把他们拥进怀里。姑妈也亲口告诉他们，一份由爱与欢乐组成的宝藏已经回到了阿登。现在，埃尔弗丽达正要走进房间，亲眼看看这份比埋藏的金银更加珍贵的宝藏。
        - id: ch05-b19
          speaker: narrator
          text: 阿登勋爵正舒舒服服地坐在大扶手椅上。他看起来与火药阴谋时代埃尔弗丽达认识的阿登勋爵一模一样，也与她从小到大认识的爹爹一模一样。椅子上方就是那块秘密嵌板。爱德华·塔尔博特爵士假扮圣乔治骑士时，曾藏在嵌板后面。父亲那张亲爱的脸一点也没变，脸上的笑仍只属于她一个人。那笑快活、温柔，眼睛里闪着光，世上再没有别人能得到同样的微笑。埃尔弗丽达只在门口站了一瞬。可有些瞬间短得像怀表发出一声滴答，又长得像一整年。她站在那里问自己，一切难道都是梦？难道真的没有白鼹鼠精，也根本没有宝藏？
        - id: ch05-b20
          speaker: narrator
          text: 她还站在门口时，一股巨大的爱与渴望忽然涌来，像潮水一样把她整个人卷了进去。先前所有怀疑，在这股潮水里一下子失去了分量。她终于明白，无论世上究竟有没有白鼹鼠精，无论那些历险是现实还是梦，那份真正的宝藏都已经属于她。这个答案只用了一个闪念。下一眨眼，她已经飞快穿过整间客厅，扑进父亲张开的怀抱里。她紧紧搂住父亲，一面流泪，一面欢笑，只会反反复复喊出同一句话。
        - id: ch05-b21
          speaker: elfrida
          text: 啊，我的爹爹！我的爹爹，我的爹爹！
          emotion: happy
