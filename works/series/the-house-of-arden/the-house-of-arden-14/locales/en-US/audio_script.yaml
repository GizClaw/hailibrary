  chapters:
    - id: ch01
      title: "CHAPTER XIV. THE FINDING OF THE TREASURE"
      blocks:
        - id: ch01-b01
          speaker: mouldiwarp
          text: "To Richard Arden!"
        - id: ch01-b02
          speaker: narrator
          text: >-
            The Mouldiwarp sprang onto the hour hand of the pearl and ivory clock. At once, the hands flew round too fast for anyone to speak. The clock stopped without warning, and Edred caught his breath.
        - id: ch01-b03
          speaker: edred
          text: "Now take us to my daddy!"
        - id: ch01-b04
          speaker: narrator
          text: >-
            The hands raced again before either child could see where they had landed. For one instant they knew only that they were in a room. The Mouldiwarp had suddenly grown as large as an enormous polar bear, and it leaned over the clock to seize something with a paw a foot long. Someone called out, but the flying hands made the words impossible to hear. Almost at once, the clock stopped. They saw something climb down from it, and found themselves back in the cave.
        - id: ch01-b05
          speaker: narrator
          text: >-
            Cousin Richard stood beside them. His clothes were nothing like the ones he had worn at King Henry the Eighth's maying. They looked like the clothes Edred had worn in Boney's time. Around them, the cave was just as it had been then, with kegs and bales beside the running stream.
        - id: ch01-b06
          speaker: mouldiwarp
          text: >-
            You must come with us. If these children let their father see them, they'll have to explain the magic. Once magic is explained, it all escapes, like scent from a bottle with the cork left out. But you can see him and help him, if he needs help, without explaining a thing.
        - id: ch01-b07
          speaker: richard
          text: >-
            All right. The Head of the House comes first. But wait. I dropped my own magic here.
        - id: ch01-b08
          speaker: narrator
          text: >-
            Richard bent over the sand and picked up a little stick ringed with silver bells, like the one Folly carries at a carnival.
        - id: ch01-b09
          speaker: richard
          text: >-
            Look, it has the Arden arms and crest. There's the shield, the chequers, and the Mouldiwarp. Now I'm ready. Cousins, I take back everything I said. My father is dead, you see. If I'd had even half your chance, I'd have taken it. That was what I was thinking. Give me your hands.
        - id: ch01-b10
          speaker: narrator
          text: >-
            By the clock's light, the children saw every mark on the little stick. Then they gave Richard their hands.
        - id: ch01-b11
          speaker: elfrida
          text: >-
            Oh, but this isn't like the other adventures. Those were a game. This is... this is...
        - id: ch01-b12
          speaker: mouldiwarp
          text: >-
            This is real, my sock-lamb. Your Cousin Richard will help you. When you get your father back, as I'm sure you will, Cousin Dick will return to his own time and vanish from yours. Your father will never guess that you came so close to him.
        - id: ch01-b13
          speaker: elfrida
          text: "I don't believe we'll find him."
        - id: ch01-b14
          speaker: narrator
          text: >-
            Elfrida nodded stubbornly. For the first time in this story, she truly did not believe.
        - id: ch01-b15
          speaker: mouldiwarp
          text: >-
            Oh, very well. If you don't believe you'll find him, then you won't. That's as plain as a currant loaf.
          emotion: angry
        - id: ch01-b16
          speaker: edred
          text: >-
            I believe we'll find him. Elfrida is only a girl. Of course it may all be a dream. I know that. But if it is, I'm staying in it. I won't go back to Arden without my father.
        - id: ch01-b17
          speaker: mouldiwarp
          text: >-
            Do you understand what happens if I take you to another time or place in your own century? That will be the full stop. There'll be nothing after it.
        - id: ch01-b18
          speaker: edred
          text: >-
            You mean we could never go into the past again, not even to hunt for treasure?
        - id: ch01-b19
          speaker: mouldiwarp
          text: >-
            Never mind chance. I mean no magic clock will ever be made for you again. And if you find your father, you won't be Lord Arden anymore!
        - id: ch01-b20
          speaker: narrator
          text: >-
            I hope you will not be too shocked by what happened next. A sharp pang went through Edred's flesh-and-blood chest. It felt like a knife. He might get his daddy back in exchange for nothing more than a title, so it was dreadful that he could think of anything else. But I mean to tell you the truth. For one terrible moment, Edred wanted to keep being Lord Arden. He thought perhaps the whole adventure was nonsense, perhaps his father was not there, and perhaps searching would do no good. Why not stop looking and go home?
        - id: ch01-b21
          speaker: narrator
          text: >-
            Those thoughts came without his choosing or wanting them. Edred pushed them away, as if he could use both hands, and hated himself because they had appeared. Whenever he remembered that moment for the rest of his life, he would hate that the thoughts had ever entered his mind. That is the worst thing about thoughts. They live forever.
        - id: ch01-b22
          speaker: edred
          text: "I don't want to be Lord Arden. I want my father."
        - id: ch01-b23
          speaker: narrator
          text: >-
            And that was the truth, no matter what unwanted thoughts he could never forget.
        - id: ch01-b24
          speaker: mouldiwarp
          text: "Shall I come with you?"
        - id: ch01-b25
          speakers: [edred, elfrida, richard]
          ensemble: chorus
          text: "Yes, please come!"
        - id: ch01-b26
          speaker: narrator
          text: >-
            They all answered very earnestly. When you are going somewhere unknown, a friendly Mouldiwarp is a useful companion.
        - id: ch01-b27
          speaker: mouldiwarp
          text: >-
            Then make no mistake. This is the wind-up and the end-all. No more chestses in atticses. No more fine clotheses coming out of them. And no more white clocks.
        - id: ch01-b28
          speaker: edred
          text: "We understand. Now let's go."
        - id: ch01-b29
          speaker: mouldiwarp
          text: >-
            Wait a bit. You must decide what you're going to be, and how your father should come out. I say he comes through the chink in the chalk.
        - id: ch01-b30
          speaker: elfrida
          text: >-
            Any way you like. But dear Mouldiwarp, won't we ever see you again?
        - id: ch01-b31
          speaker: mouldiwarp
          text: "I didn't say that. You'll see me at dinner every day."
        - id: ch01-b32
          speaker: elfrida
          text: "At dinner?"
        - id: ch01-b33
          speaker: mouldiwarp
          text: "I'm on every spoon and fork, aren't I?"
        - id: ch01-b34
          speaker: narrator
          text: >-
            The creature sniggered more aggravatingly than ever. Then an idea struck Edred.
        - id: ch01-b35
          speaker: edred
          text: >-
            Mouldie, I've got it! Disguise us so Father won't know who we are. Then we can still be part of whatever happens.
        - id: ch01-b36
          speaker: richard
          text: "That's an excellent plan. Disguise me too."
        - id: ch01-b37
          speaker: mouldiwarp
          text: "Not you."
        - id: ch01-b38
          speaker: narrator
          text: >-
            It waved one white paw at Edred and Elfrida. Tight white fur covered them at once. Even their hands wore thick white gloves with tiger claws at the fingertips. At the same moment, the Mouldiwarp grew to the size of a small polar bear, and Cousin Richard grew into a giant.
        - id: ch01-b39
          speaker: mouldiwarp
          text: "Now!"
        - id: ch01-b40
          speaker: narrator
          text: >-
            They all jumped onto the white clock, and its hands began to race.
        - id: ch01-b41
          speaker: narrator
          text: >-
            When the clock stopped, they stepped onto a deep carpet of moss. Enormous trees rose overhead, and wonderfully bright golden stars shone between their branches. The warm air smelled as if flowers filled it, though the children's fur coats did not feel a bit too hot. The moss was so soft beneath their feet that they wanted to feel it with their hands as well. Down they went onto all fours. Then came an even stronger wish. They longed to lie down and roll, and the longing grew until they had to give in. Rolling through that soft moss was delicious.
        - id: ch01-b42
          speaker: narrator
          text: >-
            Richard, still far too large, looked down and laughed. The children were much too busy rolling to look at each other.
        - id: ch01-b43
          speaker: richard
          text: >-
            This is a first-rate lark! Now we need the cleft in the chalk. Mouldiwarp, may I carry you?
        - id: ch01-b44
          speaker: narrator
          text: >-
            Rather surprisingly, the Mouldiwarp agreed.
        - id: ch01-b45
          speaker: richard
          text: "Come along, you two."
        - id: ch01-b46
          speaker: narrator
          text: >-
            The children followed on all fours. Perhaps it was the moss, or perhaps it was the fur suits and gloves, but walking that way felt perfectly natural. Their hands were as useful as their feet. They had never felt so light or cheerful, and walking had never been so easy.
        - id: ch01-b47
          speaker: narrator
          text: >-
            They followed Richard through the forest until a great cliff rose before them as suddenly as a wall at the end of a garden. It seemed to bring the whole forest to a stop. A dark cleft ran high up its white face. The moon came from behind a cloud and shone full upon the cliff. In that light, the children saw that both the white face and the shape of the cleft looked just like the little crack the Mouldiwarp had made when it pulled up the turf on the Sussex downs. Until then, Edred and Elfrida had still not looked at each other. There had been far too much else to see.
        - id: ch01-b48
          speaker: richard
          text: "That's our way up."
        - id: ch01-b49
          speaker: narrator
          text: >-
            There were no steps in the black cleft, only narrow ledges that even a very polite goat might barely have called footholds.
        - id: ch01-b50
          speaker: edred
          text: "Richard, you could never climb that at your size."
        - id: ch01-b51
          speaker: narrator
          text: >-
            Somehow, Edred never doubted that he and Elfrida could climb it.
        - id: ch01-b52
          speaker: mouldiwarp
          text: "No, he can't. I'll have to carry him."
        - id: ch01-b53
          speaker: narrator
          text: >-
            The Mouldiwarp jumped from Richard's arms and calmly grew as big as a polar bear.
        - id: ch01-b54
          speaker: richard
          text: "They still haven't noticed."
        - id: ch01-b55
          speaker: elfrida
          text: "Noticed what?"
        - id: ch01-b56
          speaker: richard
          text: "Your disguises. My dear cousins, you're white cats!"
        - id: ch01-b57
          speaker: narrator
          text: >-
            At last Edred and Elfrida looked at each other. Richard was right. They really were cats.
        - id: ch01-b58
          speaker: richard
          text: >-
            Here's my plan. The people here have never seen tame cats, and they think anyone who can tame animals must be a magician. I learned that when I came before. Now I have three tame white animals, if the Mouldiwarp will play its part.
        - id: ch01-b59
          speaker: mouldiwarp
          text: "Oh, I'll play!"
          emotion: angry
        - id: ch01-b60
          speaker: narrator
          text: >-
            It gave a little snarl.
        - id: ch01-b61
          speaker: richard
          text: >-
            You cats must only mew and purr, and you must do exactly what I say. Don't perform for anyone except me and your father. You'll soon see how it works.
        - id: ch01-b62
          speaker: elfrida
          text: "Is Father truly here?"
        - id: ch01-b63
          speaker: narrator
          text: >-
            Elfrida trembled a little as she asked.
        - id: ch01-b64
          speaker: richard
          text: >-
            He's beyond this great cliff, the cliff no man can climb. But you can climb it.
        - id: ch01-b65
          speaker: narrator
          text: >-
            Richard climbed onto the Mouldiwarp's back and clasped its polar-bear neck. Then the creature began to climb. It was a tremendous climb. Even Edred and Elfrida, who could no longer help noticing their cat bodies, could barely keep their footing on the tiny ledges. Every foothold was smooth, narrow, and sloping. Without cats' eyes to see in the dark, they could never have managed at all. It went on and on until the climb seemed as if it would last forever.
        - id: ch01-b66
          speaker: elfrida
          text: >-
            I've heard people speak of foreign climbs, but I never thought they'd be like this. We are abroad, aren't we?
        - id: ch01-b67
          speaker: richard
          text: >-
            We're in South America. You can search the map when you get home, but you won't find this place. Keep climbing!
        - id: ch01-b68
          speaker: narrator
          text: >-
            At the top, they had to climb all the way down the other side. The cliff stood like a wall between the forest and an immense plain. By the time they reached the ground, the sun had risen over the cliff.
        - id: ch01-b69
          speaker: narrator
          text: >-
            The plain was vast and wonderful, with towering cliffs enclosing it on every side. Roads, avenues, fields, and parks spread across it in careful order. Towns and palaces stood here and there. A tall aqueduct, resting on hundreds of pillars, carried water from an arch in the cliff toward the center of the plain. From there, straight canals ran back toward the surrounding wall like the spokes of a wheel. Each one vanished beneath a low stone arch at the foot of the cliff. There were lakes and gardens, and great stone buildings whose roofs shone like gold wherever the rising sun touched them.
        - id: ch01-b70
          speaker: narrator
          text: >-
            Long-horned cattle grazed in the fields beside strange sheep with high shoulders.
        - id: ch01-b71
          speaker: richard
          text: "Those are llamas. I recognize them from postage stamps."
        - id: ch01-b72
          speaker: narrator
          text: >-
            They went farther into the plain and sat beneath a spreading tree.
        - id: ch01-b73
          speaker: richard
          text: "Now we simply wait until someone finds us."
        - id: ch01-b74
          speaker: narrator
          text: >-
            Richard had taken complete command. As cats, Edred and Elfrida had to obey him, though they did not enjoy it.
        - id: ch01-b75
          speaker: narrator
          text: >-
            Before long, shepherds came out early to tend their flocks. They discovered a strangely dressed boy beneath the tree with a great white bear and two white cats. The bear did not frighten them. They only stared with curiosity and interest. Then the Mouldiwarp stood on its hind legs and made a grave bow. At Richard's commands, the cats stood up, lay down again, shook paws, and turned somersaults. That settled something in one shepherd's mind. He wrapped his red woolen cloak firmly around himself, motioned for Richard to follow, and set off as fast as he could toward the nearest town.
        - id: ch01-b76
          speaker: narrator
          text: >-
            Soon they found themselves in the central square of one of the most beautiful towns in the world. I wish I had time to tell you exactly what every part looked like, but I have not. I can only say that the place was clean and grand, splendid and comfortable all at once. From one end of the town to the other, there was not a dirty corner or a single sad face.
        - id: ch01-b77
          speaker: narrator
          text: >-
            Great houses were built from blocks of stone wonderfully inlaid with gold and silver. Clear streams, like baby canals, ran along the side of every broad street, between double rows of trees. Grassy spaces and flower beds lay open to the sun. Some flowers glowed with their own lovely colors, while others had been skillfully made from gold, silver, and jewels. Fountains splashed beside miniature waterfalls. The people had dark, kind, unwrinkled faces. In the market, stalls offered pleasant fruit and cakes, along with soft clothes in bright colors.
        - id: ch01-b78
          speaker: narrator
          text: >-
            In the middle of town stood a great Hall with a garden on its flat roof. The shepherd led them straight toward it. Wide doors of inlaid wood stood open, and a crowd in soft clothes of beautiful colors filled the long room inside. Above them was open sky. A great awning lay folded and wrinkled along one side, ready to be drawn across whenever the people wished to have a roof.
        - id: ch01-b79
          speaker: narrator
          text: >-
            At one end, three chairs stood on a raised stone platform. The crowd made way for the shepherd and the strange procession behind him. As they came nearer, the two white cats looked up. In the middle and largest chair sat a splendid dark-faced man. He wore a fringed turban with two long feathers. On his right and left sat two men dressed in beautifully embroidered cloth, with shining collars of jewels around their necks. One was Father. The other was Uncle Jim.
        - id: ch01-b80
          speaker: richard
          text: "Not a word!"
        - id: ch01-b81
          speaker: narrator
          text: >-
            Richard spoke just in time to stop the children from crying out, but he could not stop them moving. Everyone in the Hall saw the two white cats leap forward and rub against the legs of the man in the right-hand chair. Edred and Elfrida could reach no more of their father than that. Since they dared not speak, they pressed their white bodies against him in joy and purred with all their might. Being able to purr was a wonderful relief.
        - id: ch01-b82
          speaker: narrator
          text: >-
            The King rose from his high seat. He looked down with wise, kind eyes and asked a question in words the children could not understand. The white Mouldiwarp danced before him as cleverly as any trained bear, and far more gracefully.
        - id: ch01-b83
          speaker: narrator
          text: >-
            Richard whistled. Edred and Elfrida pulled themselves away from their father's legs and stood upright on their white hind paws.
        - id: ch01-b84
          speaker: edred
          text: "The minuet."
        - id: ch01-b85
          speaker: narrator
          text: >-
            He whispered quickly. Richard began to whistle a clear tune. The children had never heard it before, yet somehow it was exactly right. Then everyone in the Hall saw two white cats perform the complicated dance. Slowly and solemnly, they turned, bowed, paced, and moved through every figure. They managed all the graceful steps Aunt Edith had taught them when they were Edred and Elfrida instead of white cats.
        - id: ch01-b86
          speaker: narrator
          text: >-
            When their final bow and curtsy ended, the King shouted a word that surely meant, “Well done!” The whole crowd repeated it. Only Father and Uncle Jim called, “Bravo!”
        - id: ch01-b87
          speaker: narrator
          text: >-
            The King questioned Richard. Richard gave no answer and only laid a finger across his lips. The King turned to Father, who tried asking the boy questions in English, then French, then several other languages. Still Richard answered by touching his lips. The white bear shook its head with a sorrowful air, while the white cats kept their eyes fixed on their father and purred aloud.
        - id: ch01-b88
          speaker: richard
          text: "When your father leaves, follow him."
        - id: ch01-b89
          speaker: narrator
          text: >-
            The King rose and went out, and everyone else followed. The white cats abandoned Richard and stayed close behind their father. The King noticed. He spoke to the men leading Richard elsewhere, and before long the cats, the bear, and Richard were alone with Father and Uncle Jim on a beautiful terrace. Trees shaded it, and red, white, and purple flowers trailed from solid silver vases along the edge.
        - id: ch01-b90
          speaker: richard
          text: "I'm English, and I've come to rescue you."
        - id: ch01-b91
          speaker: lord_arden
          text: "You're a brave boy, but no rescue is possible."
        - id: ch01-b92
          speaker: richard
          text: >-
            We have very little time. They only brought us here to learn whether you knew us, and I expect someone is listening. The old lord is dead, so you are Lord Arden now. I can take you out if you follow every word I say.
        - id: ch01-b93
          speaker: uncle_jim
          text: "Whatever your plan is, it's worth attempting."
        - id: ch01-b94
          speaker: richard
          text: "May you go wherever you please?"
        - id: ch01-b95
          speaker: lord_arden
          text: >-
            Yes, because there's only one way out. A hundred men with poisoned arrows guard it.
        - id: ch01-b96
          speaker: narrator
          text: >-
            This was Edred's father speaking. Edred himself was no longer Lord Arden.
        - id: ch01-b97
          speaker: richard
          text: >-
            There is another way. We came through it. The white bear can carry you over, one at a time.
        - id: ch01-b98
          speaker: lord_arden
          text: "Do you think we should take the risk?"
        - id: ch01-b99
          speaker: uncle_jim
          text: "Of course we should! Think of Edith and the children."
        - id: ch01-b100
          speaker: lord_arden
          text: >-
            They are exactly whom I'm thinking about. As long as we live, there's still a chance of reaching them. If we try to escape and fail, we'll be killed.
        - id: ch01-b101
          speaker: richard
          text: >-
            You won't fail. I'll see you safely home. But please tell me how you came to be here. It is only curiosity, but I may never see you again after today.
        - id: ch01-b102
          speaker: lord_arden
          text: >-
            We were prospecting for gold in these mountains when we stumbled upon the one entrance to this golden plain. The people have kept us here ever since. They are determined that the outside world must never learn this place exists. There have always been rumors, but no so-called civilized people have found it before us. Every new King swears he will die before allowing the wicked cruelty of modern civilization to infect the plain.
        - id: ch01-b103
          speaker: richard
          text: "I think he's right."
        - id: ch01-b104
          speaker: lord_arden
          text: >-
            Their civilization is older than the Incas, and their way of life is more beautiful than anything I ever dreamed of. If they had trusted me, I would never have betrayed them. If I escape, I still won't betray them. If I brought our trusts, syndicates, commercial greed, and crime into this golden life, I would feel as guilty as a man who threw a little child to wild beasts.
        - id: ch01-b105
          speaker: narrator
          text: >-
            The white cats listened with wonder and respect. Their father spoke to Richard exactly as if the boy were a grown man.
        - id: ch01-b106
          speaker: lord_arden
          text: >-
            They let us send one line to a newspaper saying bandits had captured us. Apart from taking away our freedom, they have given us everything. We have food, clothes, kindness, justice, and affection. We must escape if we can, because Edith and the children need us. Still, leaving this place feels like walking out of Eden and into the Black Country.
        - id: ch01-b107
          speaker: uncle_jim
          text: "That's exactly how it feels."
        - id: ch01-b108
          speaker: lord_arden
          text: >-
            If we truly won't meet again, tell me why you took such a great risk to help us.
        - id: ch01-b109
          speaker: richard
          text: >-
            I owe a debt to everyone who bears the name of Arden. The Head of the House most of all.
        - id: ch01-b110
          speaker: narrator
          text: >-
            Richard's voice dropped so low that the cats barely caught those last words.
        - id: ch01-b111
          speaker: richard
          text: >-
            Do you see that black crack across the plain? Both of you must be there at moonrise. Then you'll escape safely to Arden Castle.
        - id: ch01-b112
          speaker: lord_arden
          text: >-
            Naturally, you must come with us. I may be able to help you. We have a respectable little fortune in a bank in Lima under other names. If you can get us out, we can recover it. I'm certain you've brought us luck. Come with us and take your share.
        - id: ch01-b113
          speaker: richard
          text: >-
            I can't. I must return to my own time. I mean, my own place. I have to go now. Come along, cats.
        - id: ch01-b114
          speaker: narrator
          text: >-
            The cats gazed pleadingly at their father, but they obeyed Richard and stood beside him.
        - id: ch01-b115
          speaker: richard
          text: "Are we allowed to leave?"
        - id: ch01-b116
          speaker: lord_arden
          text: >-
            Everyone here is free. The only forbidden thing is leaving the golden plain. There are hardly any laws. People may do as they please, and no one seems to want to harm anyone else. But anyone caught trying to enter the outer world, or let the outer world in, is killed. They do it without pain and not for revenge, but because they believe it is necessary.
        - id: ch01-b117
          speaker: narrator
          text: >-
            The white cats exchanged an uneasy look. Their daddy had never spoken to them this way.
        - id: ch01-b118
          speaker: lord_arden
          text: >-
            Even so, we must risk it for the children and my sister. I trust you completely. We'll be at the crack when the moon rises.
        - id: ch01-b119
          speaker: narrator
          text: >-
            Richard and his three white animals left the terrace by steps cut into the solid rock. In the streets, townspeople crowded around them. They brought fruit and maize cakes for Richard, and set down milk for the cats in platters of gold. Later, Richard made signs to show that he had grown sleepy. The people let him wander away among the fields, with all three white creatures following close behind.
        - id: ch01-b120
          speaker: narrator
          text: >-
            At the appointed hour, everyone met beneath the vast cliff, the natural wall that guarded the golden plain. The Mouldiwarp carried Uncle Jim up toward the top. Then it came back for Lord Arden and Richard. But there was no time to finish the climb. A shout rose from the city they had left, and a thousand torches sprang to life at once. Their escape had been discovered.
        - id: ch01-b121
          speaker: mouldiwarp
          text: "There's no time."
        - id: ch01-b122
          speaker: narrator
          text: >-
            Lord Arden stared in utter astonishment. The white bear had opened its long mouth and spoken. Then the two white cats forgot every warning and cried out too.
        - id: ch01-b123
          speakers: [edred, elfrida]
          ensemble: duo
          text: "Oh, Daddy, this is awful! What can we do?"
          emotion: fearful
        - id: ch01-b124
          speaker: mouldiwarp
          text: >-
            Hold your foolish tongues! You were told not to gossip. Use those white paws and scratch us a way out.
          emotion: angry
        - id: ch01-b125
          speaker: narrator
          text: >-
            The Mouldiwarp set the example. It attacked the enormous cliff with its strong, blunt, curved front claws. The cats scratched beside it with the tiger claws on their padded white paws. To their wonder, the solid rock yielded beneath them. A thin white crack appeared. It opened wider and wider while the mass of torches swayed, swirled, and streamed ever closer across the plain.
        - id: ch01-b126
          speaker: mouldiwarp
          text: "Get inside! All of you, get in!"
        - id: ch01-b127
          speaker: lord_arden
          text: "What about Jim? I won't leave without him!"
        - id: ch01-b128
          speaker: mouldiwarp
          text: >-
            He's already halfway across. Move, I tell you!
        - id: ch01-b129
          speaker: narrator
          text: >-
            The Mouldiwarp drove Lord Arden forward with one great white shoulder. Everyone tumbled into the crack, and the cliff sealed itself behind them. Its solid face gave their pursuers an answer that could not be argued with. No.
        - id: ch01-b130
          speaker: mouldiwarp
          text: "The way out is over there, where you see the light."
        - id: ch01-b131
          speaker: narrator
          text: >-
            It pointed ahead with one dusty claw.
        - id: ch01-b132
          speaker: edred
          text: "Why, this is the smugglers' cave! And there's the clock!"
        - id: ch01-b133
          speaker: narrator
          text: >-
            A moment later, the clock was gone. Richard had leaped onto it, and both boy and clock vanished. At the last instant, the Mouldiwarp caught hold of the hour hand and disappeared with them.
        - id: ch01-b134
          speaker: narrator
          text: >-
            Edred and Elfrida, still white cats, drew away from the blur of spinning hands that came just before vanishing. Their father and Uncle Jim climbed the steps toward the rough wooden door. Its enormous key looked like a church key. Beyond it lay the opening among the gorse which the children had searched for and never managed to find again.
        - id: ch01-b135
          speaker: narrator
          text: >-
            Once the vanishing clock left the way clear, the children followed their father and Uncle Jim. They climbed out into the sunny open air just in time to see them. The skylarks were singing as they always did, as if nothing strange had happened beneath the ground. Ahead, the two figures were walking toward the castle. They had already crossed most of the distance and were very near the building, almost at the great gate.
        - id: ch01-b136
          speaker: narrator
          text: >-
            Edred and Elfrida turned to look at each other.
        - id: ch01-b137
          speaker: edred
          text: "Why, you're not a cat anymore!"
        - id: ch01-b138
          speaker: elfrida
          text: >-
            Neither are you. Oh, Edred, they're going through the great gate! Do you think this was real, or did we dream it? This adventure felt much more like a dream than any of the others.
        - id: ch01-b139
          speaker: edred
          text: >-
            I feel as if I've been a cat all my life, and someone has swung me by the tail every day of it. I'm sitting here until I know whether I'm a white cat or Edred Arden.
        - id: ch01-b140
          speaker: narrator
          text: >-
            He sat down suddenly.
        - id: ch01-b141
          speaker: elfrida
          text: "Well, I know which one I am."
        - id: ch01-b142
          speaker: narrator
          text: >-
            Even so, Elfrida was glad to sit beside him.
        - id: ch01-b143
          speaker: edred
          text: "That's easy. You aren't either one."
        - id: ch01-b144
          speaker: narrator
          text: >-
            Half an hour later, they walked slowly down to the castle. They still could not decide whether any magic had truly happened, or whether every magical adventure had been only a shared dream. Aunt Edith met them at the door. Her face was as pale as the pearl and ivory clock, and her eyes shone like dew on the wildflowers Elfrida had once given the Queen.
        - id: ch01-b145
          speaker: aunt_edith
          text: "Oh, children! My dear, darling children!"
          emotion: happy
        - id: ch01-b146
          speaker: narrator
          text: >-
            She knelt so she could hold them at their own height.
        - id: ch01-b147
          speaker: aunt_edith
          text: >-
            Something wonderful has happened. It is so beautiful that you won't believe it.
          emotion: happy
        - id: ch01-b148
          speaker: narrator
          text: >-
            They kissed her warmly, partly because they loved her and partly to hide the fact that they were not surprised.
        - id: ch01-b149
          speaker: aunt_edith
          text: >-
            Darlings, the loveliest thing in the world has happened. Can you guess what it is?
          emotion: happy
        - id: ch01-b150
          speaker: elfrida
          text: "Daddy has come home."
        - id: ch01-b151
          speaker: narrator
          text: >-
            Elfrida felt terribly deceitful.
        - id: ch01-b152
          speaker: aunt_edith
          text: >-
            Yes! What a clever guess, my pet. Uncle Jim is home too. They were prisoners in South America, and an English boy with a performing bear helped them escape.
          emotion: happy
        - id: ch01-b153
          speaker: narrator
          text: >-
            Aunt Edith said nothing about cats, and the children felt rather hurt.
        - id: ch01-b154
          speaker: aunt_edith
          text: >-
            They had the most dreadful journey afterward. It took months and months and months to cross the interior. There was no water, and there were Indians and every sort of adventure. Daddy came down with a fever. He kept insisting that the performing bear was the Mouldiwarp from our family crest, come alive and talking like you or me. He also said there were white cats with your voices, and that they called him Daddy. He is himself again now, but he is still very weak. That is why I'm telling you before you see him. You must be very quiet and gentle. Oh, my dears, it is almost too wonderful to be true!
          emotion: happy
        - id: ch01-b155
          speaker: narrator
          text: >-
            So who imagined it? Did the children's father see strange things because of his brain fever? Or did Edred and Elfrida, who were blameless of fever and not too burdened with brains, dream the whole adventure themselves? Uncle Jim can explain exactly how everything happened, but there is no magic anywhere in his version. Father, who was Lord Arden now, never spoke about the things he dreamed during his illness. The children never spoke about what happened when they had no illness at all. At least, they told no one except me.
        - id: ch01-b156
          speaker: narrator
          text: >-
            It is all very wonderful and mysterious. Life often is, once you look a little way beneath its crust. You will miss that mystery if you are content to read newspapers, travel by the Tube Railway, buy all your clothes ready-made, and decide that nothing can possibly be true unless it is uninteresting.
        - id: ch01-b157
          speaker: aunt_edith
          text: >-
            I found the most wonderful photographs of paintings of Arden Castle. We could use them to restore every part of it perfectly. If only I knew where the real paintings were.
        - id: ch01-b158
          speaker: lord_arden
          text: >-
            I'm afraid we can't restore the castle. Our little fortune will keep us comfortable, but it won't rebuild Norman stonework.
        - id: ch01-b159
          speaker: narrator
          text: >-
            Lord Arden laughed as he said it.
        - id: ch01-b160
          speaker: edred
          text: "I wish we had managed to find the buried treasure."
        - id: ch01-b161
          speaker: aunt_edith
          text: "We already have all the treasure we need."
        - id: ch01-b162
          speaker: narrator
          text: >-
            She looked at Uncle Jim as she spoke. And as for what Elfrida thought, I wish you could have seen her face later that evening. She walked into the parlor after Aunt Edith had knelt to meet the children on equal terms and told them about the real treasure. It was the treasure of love and joy that had come home to Arden.
        - id: ch01-b163
          speaker: narrator
          text: >-
            There was Lord Arden, sitting comfortably in the great chair. Just above him was the secret panel where Sir Edward Talbot had hidden when he pretended to be the Chevalier Saint George. Lord Arden looked exactly like the father Elfrida had known during the days of the Gunpowder Plot. At the same time, he looked exactly like the daddy she had known and loved all her life. His dear face was just the same. The smile on it was her own smile, merry, tender, and twinkling. It was the smile he kept for her, and for no one else in the world.
        - id: ch01-b164
          speaker: narrator
          text: >-
            Elfrida stood in the doorway for only a moment, but it was one of those moments as short as the tick of a watch and as long as a year. She stayed there looking at him and asked herself whether she had dreamed it all. Perhaps there was no Mouldiwarp after all. Perhaps there had never been any treasure.
        - id: ch01-b165
          speaker: narrator
          text: >-
            Then a great wave of love and longing caught hold of her. In that instant she knew the answer that mattered. Mouldiwarp or no Mouldiwarp, the treasure was truly hers. In a flash, she crossed the whole room and threw herself into her father's arms. She sobbed and laughed at the same time, saying the same beloved words again and again.
        - id: ch01-b166
          speaker: elfrida
          text: "Oh, my daddy! Oh, my daddy, my daddy!"
          emotion: happy
