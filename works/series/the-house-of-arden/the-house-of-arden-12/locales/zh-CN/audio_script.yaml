audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 亲切从容，带一点温和的幽默
        timbre: 温暖清亮
        pace: 舒缓而有变化
        pitch: 中等
    edred:
      display_name: 埃德雷德
      tts:
        delivery: 聪明好胜，认真里带着孩子气
        timbre: 清脆明亮的男孩声
        pace: 自然偏快
        pitch: 中高
    elfrida:
      display_name: 埃尔弗丽达
      tts:
        delivery: 直率活泼，敏锐又有主意
        timbre: 清亮的女孩声
        pace: 轻快
        pitch: 高
    mrs_honeysett:
      display_name: 霍尼塞特太太
      tts:
        delivery: 热心爽快，乡下口吻朴实幽默
        timbre: 温厚略粗的成年女声
        pace: 自然偏快
        pitch: 中等
    aunt_edith:
      display_name: 伊迪丝姑妈
      tts:
        delivery: 温柔能干，亲昵中带一点克制
        timbre: 温暖沉稳的成年女声
        pace: 自然舒缓
        pitch: 中等
    mouldiwarp:
      display_name: 白鼹鼠精
      tts:
        delivery: 古怪倦怠，乡音浓重又爱挖苦人
        timbre: 沙哑细小的老者声
        pace: 忽快忽慢
        pitch: 中高
    richard:
      display_name: 表兄理查德
      tts:
        delivery: 机敏爽朗，警觉时果断认真
        timbre: 明亮的少年声
        pace: 自然偏快
        pitch: 中高
  chapters:
    - id: ch01
      title: 第十二章　胶卷与云
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 到了睡觉时，胶卷已经干透了。这个夜晚没有半点奇异的魔法，却有另一种魔力，那就是谁也不来打扰的快乐。埃德雷德悄悄溜出去，拔下别针，把胶卷藏进埃尔弗丽达墙角的抽屉。他很有道理地认为，姐姐的抽屉一定比自己的干净。于是，那些宝贝胶卷就躺在她最好的花边衣领和手帕套之间。手帕套上绣着三朵胖乎乎的金凤花，是伊迪丝姑妈送的圣诞礼物。
        - id: ch01-b02
          speaker: narrator
          text: 埃德雷德又回到客厅，睡前玩最后一局“谚语牌”。拿起牌时，他忽然觉得很不可思议。自己明明在伦敦塔里坐过牢，也跟沃尔特·雷利爵士谈过话，现在却像任何一个普通男孩那样，安安静静地陪姑妈和姐姐打牌。那一边是惊险万分的旧时代，这一边是再寻常不过的家庭夜晚，两种日子居然都属于他。
        - id: ch01-b03
          speaker: edred
          text: 哈，我这是过着双重生活呢。
          emotion: happy
        - id: ch01-b04
          speaker: narrator
          text: 他从书上看过“双重生活”这个说法，如今能用在自己身上，实在让他高兴。
        - id: ch01-b05
          speaker: aunt_edith
          text: 看埃德雷德那副得意样！我敢说，你手里的牌已经能拼出一整句谚语了，就算还没有，也快了。
        - id: ch01-b06
          speaker: edred
          text: 一会儿您也会得意的，反正您每次都赢。
        - id: ch01-b07
          speaker: narrator
          text: 姑妈果然赢了。埃德雷德的心早飞到了宝藏那里。他想象着自己和埃尔弗丽达郑重地走到姑妈面前，一人牵起她的一只手，再一路领她去看宝藏的藏身之处。等秘密终于揭开，姑妈脸上一定会出现最欢喜的神情。埃德雷德只顾想着那一刻，哪里还记得自己手里拿着什么牌。
        - id: ch01-b08
          speaker: edred
          text: 请看我们阿登家的宝藏！现在能重建城堡，也能补好农舍漏雨的茅草屋顶。我可以去伊顿，再去牛津。姑妈会有钻石王冠，埃尔弗丽达和我都能有小马骑。
          emotion: happy
        - id: ch01-b09
          speaker: narrator
          text: 埃尔弗丽达想的也差不多。两个人都心不在焉，伊迪丝姑妈当然赢了。
        - id: ch01-b10
          speaker: aunt_edith
          text: 霍尼塞特太太告诉我，你们一直很乖。
        - id: ch01-b11
          speaker: edred
          text: 也没有特别乖。所有事都这么快活，想做个好孩子也很容易。
        - id: ch01-b12
          speaker: elfrida
          text: 我们其实吵过一两回。
        - id: ch01-b13
          speaker: edred
          text: 对，确实吵过。
        - id: ch01-b14
          speaker: narrator
          text: 这件事原本不必招认。正因为主动说了出来，两人才觉得，即使从前不算好孩子，现在总算是了。
        - id: ch01-b15
          speaker: aunt_edith
          text: 那以后别再吵了。我很快就会一直住在这里，到时候我们一定过得特别快活。也许还能找到宝藏。你们听说过宝藏吗？
        - id: ch01-b16
          speaker: edred
          text: 岂止听说过！
        - id: ch01-b17
          speaker: elfrida
          text: 我们还找过呢，只是没有找到。姑妈，您以前找过吗？
        - id: ch01-b18
          speaker: aunt_edith
          text: 没有，可我一直想找。我祖父小时候倒找过。
        - id: ch01-b19
          speaker: edred
          text: 您祖父也是阿登勋爵吗？
        - id: ch01-b20
          speaker: aunt_edith
          text: 不是，他的祖父才是。那位老阿登勋爵还只是个少年时，曾替人称詹姆斯三世的王位觊觎者打过仗。大家见他实在年轻，后来便饶过了他。再往后，为了资助歌谣里唱的查理王子，也就是小王位觊觎者，他把阿登家所有土地都拿去抵押。他借到一大笔钱，全送给了王子。当然，查理王子答应，自己当上国王就会还钱。可他偏偏从来没有当上国王。
          emotion: sad
        - id: ch01-b21
          speaker: edred
          text: 所以阿登家的土地才全落进油脂大王手里？
        - id: ch01-b22
          speaker: aunt_edith
          text: 正是这样。所以英国人宁愿要油脂大王，也不要斯图亚特家的国王。抵押的意思，就是老勋爵借了钱，并且答应，到了期限还不上，人家就收走土地。他果然没能还钱，土地便全没了，只留下村里的一小块地和阿登丘。这两处早有规定，不能转让。
        - id: ch01-b23
          speaker: edred
          text: 找到宝藏以后，我们就把土地买回来。油脂大王要卖掉它们。比尔老头说，他如今肥得流油，连阿登家的地也瞧不上了。姑妈，我们还会重建城堡吧？也会补好村民家里那些漏雨的茅草屋顶吧？
        - id: ch01-b24
          speaker: aunt_edith
          text: 你们常进村民家里去吗？
        - id: ch01-b25
          speaker: narrator
          text: 她问得有些不安。大人仿佛天生就有一种奇怪的恐惧，总怕染上疾病。
        - id: ch01-b26
          speaker: elfrida
          text: 我想，村里每一家我们都去过。比尔老头叫我们去看看，免得找到宝藏以后，还不知道该为大家做什么。他们真可爱。我觉得他们喜欢我们，是因为我们姓阿登。还是因为埃德雷德是勋爵呢？
        - id: ch01-b27
          speaker: edred
          text: 我们一定得找到宝藏。只有这样，才能好好照料自己的百姓。
        - id: ch01-b28
          speaker: narrator
          text: 他一认真起来，就像极了已经离世的父亲，伊迪丝姑妈几乎不忍心看。
        - id: ch01-b29
          speaker: elfrida
          text: 还要赶走油脂大王。
        - id: ch01-b30
          speaker: aunt_edith
          text: 可就算没找到，你们也别不开心。这终究只是一场游戏。我认识的人里，从来没有谁真的找到过宝藏。想想我们已经得到的东西吧。如今住的是阿登城堡，不是海景台阶，也不用再面对那些房客了。晚安，小宝贝们。
        - id: ch01-b31
          speaker: narrator
          text: 第二天，两个孩子还没起床，姑妈已经离开。他们早晨的头一件大事，就是晒印照片。霍尼塞特太太正在把客厅彻底翻出来打扫，所以他们占用了厨房。再说，厨房的窗户又宽又亮。那张旧桌子不知刷洗过多少回，连木头纹理都凸成一道道棱，桌面又大又空，正好能稳稳摆下盛药水的调色盘。
        - id: ch01-b32
          speaker: narrator
          text: 他们选了无光相纸，觉得它不像亮面相纸那么俗气，更有图画的味道。可两人只有一个印相框，只能一张一张慢慢来，整整忙了一上午，才印出十八张棕色的城堡照片。从东南西北各个方向拍的都有。方向的事我以前讲过，就不再说了。照片贴在窗玻璃上晾干以后，他们又得找个地方好好收藏。
        - id: ch01-b33
          speaker: narrator
          text: 人当然不能永远对着照片陶醉。不过很长一阵子，他们什么也不愿做，只想把十八张照片看过一遍，再从头看一遍，一次次指点其中的塔楼、城墙和拱门，念叨城堡原本就该这样，将来也一定要修成这样。相比之下，别的事情都不值得马上去做。
        - id: ch01-b34
          speaker: narrator
          text: 两个孩子把照片带进刚收拾好的客厅。房间一尘不染，蜂蜡和松节油的气味浓得有点过头。他们把照片铺在锃亮的椭圆餐桌上，又看得入了迷。
        - id: ch01-b35
          speaker: elfrida
          text: 每一处都看得清清楚楚。虽然稍微有点模糊，可能是距离没调准，不过这样反而更像一幅画。相纸选得太大，也让它更有画的样子。只要懂建筑的人看见这些，就知道该怎样把城堡重新盖起来。就像照着盒盖里的图样，把积木一块块放回盒子。
        - id: ch01-b36
          speaker: mrs_honeysett
          text: 这些破烂你们都不要啦？
        - id: ch01-b37
          speakers: [edred, elfrida]
          ensemble: duo
          text: 不要啦！
        - id: ch01-b38
          speaker: narrator
          text: 两人一起回答，倒是件好事。否则，后来准会为了是谁说错了话而闹起“口角”。可下一刻，他们同时想起了一件事。
        - id: ch01-b39
          speakers: [edred, elfrida]
          ensemble: duo
          text: 胶卷！
          emotion: fearful
        - id: ch01-b40
          speaker: narrator
          text: 两人冲进厨房，正赶上看见炉火里冒起一道特别的噼啪亮焰。只有胶卷碰上火，才会烧出那种古怪的亮光。他们来得不算晚，正好看见最后的证据，却又来得太晚，再也救不回任何东西。霍尼塞特太太把胶卷当成别的破烂，一起丢进了炉子。正如她指出的，这怪不得别人。
        - id: ch01-b41
          speaker: mrs_honeysett
          text: 我问你们是不是全都不要了，你们自己喊“不要啦”。这事只能怪你们。
        - id: ch01-b42
          speaker: narrator
          text: 任凭两个孩子怎样哀号，她都把这句话说了一遍又一遍。他们只好承认，她说得对。
        - id: ch01-b43
          speaker: edred
          text: 那我们只能格外小心地收好照片。
        - id: ch01-b44
          speaker: narrator
          text: 他们把《阿登家族史》选作藏照片的地方。那里既安全，又再合适不过。
        - id: ch01-b45
          speaker: elfrida
          text: 胶卷毁了也没那么要紧，反正不能给别人看。等找到宝藏，我们可以故意让姑妈发现这些照片，比如把《家族史》留在外面。她会以为照片拍的是画出来的城堡。那就没问题了。
        - id: ch01-b46
          speaker: narrator
          text: 他们把照片一张张夹进书里。“护城河”和“供水”几个字突然吸引了埃尔弗丽达。她读下去，又翻了一页。
        - id: ch01-b47
          speaker: edred
          text: 别停下来读书呀。
        - id: ch01-b48
          speaker: narrator
          text: 埃尔弗丽达挥手叫他别吵，又翻回前一页。
        - id: ch01-b49
          speaker: elfrida
          text: 你听。古时，阿登城堡四面有一条护城河。建造这座巍峨古堡的先贤极有巧思，留下的长久丰碑令一切善于思索的人赞叹。他们把附近丘陵白垩岩层里的一条地下溪流改了道。据说，那条溪最后在高潮水位线以下大约五十码的地方流进大海。这项让心智驾驭万物的伟大工程，一直维持到一六四七年。那时，披着人皮的恶魔奥利弗·克伦威尔派兵围攻城堡。领军将领为了攻城方便，下令让溪流重归旧道。他的爪牙照办，护城河就干了，这大大帮了那些可恨弑君者的卑劣阴谋。
        - id: ch01-b50
          speaker: elfrida
          text: 传说几百年以后，那条溪依然没有消失，还在地下沿原来的水道奔流。可本书作者在一八二一年秋天亲自拜访现任阿登伯爵的居所，承蒙伯爵阁下十分礼貌地准许，他把那片地方从头到尾仔细勘察了一遍，仍没找到溪流存在的半点痕迹。本地乡野居民也全都否认知道这条溪。可他们深陷无知和迷信，既不懂得欣赏哲理造就的伟业，也不会领会大自然令人敬畏的美。
        - id: ch01-b51
          speaker: edred
          text: 写书的人真够乏味！等等，这书是一八二二年印的？我知道那些乡下什么人为什么不肯说出小溪的事了。那就是流过走私洞穴的溪水。当时他们正拼命走私，当然要保守秘密。
        - id: ch01-b52
          speaker: elfrida
          text: 你真聪明。
        - id: ch01-b53
          speaker: edred
          text: 等找到宝藏，我敢说我们也能找到小溪留下的痕迹。走，再试试那些箱子。这次找到什么就穿什么，豁出去试一回。没什么能拦住我们。我们又没吵架。
        - id: ch01-b54
          speaker: narrator
          text: 他们确实没吵架，可还是有东西拦住了他们。那扇门找不到了。它干脆不在那里。
        - id: ch01-b55
          speaker: narrator
          text: 两人把东宅找了一遍又一遍，却没有哪扇门肯领他们进入神奇的阁楼，走到那两排箱子中间。埃尔弗丽达绝望地坐上阁楼楼梯最高一级，连厚厚的灰尘也不管了。
        - id: ch01-b56
          speaker: elfrida
          text: 可我们明明没有吵架，也没做什么坏事呀。
          emotion: sad
        - id: ch01-b57
          speaker: edred
          text: 全完了。我看得出来，我们一定在什么地方弄砸了。也许本来就不该拍那些照片。
          emotion: sad
        - id: ch01-b58
          speaker: elfrida
          text: 你说，会不会……会不会所有事情都是我们梦见的？
          emotion: fearful
        - id: ch01-b59
          speaker: edred
          text: 不会，照片还在。至少我想它们还在。我们下楼看看。
        - id: ch01-b60
          speaker: narrator
          text: 两人一边怀疑，一边凄凄惨惨地下楼。照片还好好夹在《阿登家族史》里。
        - id: ch01-b61
          speaker: edred
          text: 我实在想不出还能做什么。你有办法吗？
          emotion: sad
        - id: ch01-b62
          speaker: narrator
          text: 自从来到阿登，种种事情一直排着热闹的队伍，一桩接一桩地赶来。如今竟这样收场，实在太悲惨了。孩子们觉得，仿佛真有一扇门当着他们的面砰然关上，再也推不开。他们的冒险故事也像忽然翻到一页，上面横着几个清清楚楚的大字：“再也没有了。”
        - id: ch01-b63
          speaker: elfrida
          text: 真希望还能找到那位女巫。可她说过，自己只能来这个时代一次。
        - id: ch01-b64
          speaker: edred
          text: 不知道为什么。那个叫迪克的家伙一定常来这里，不然怎么会在新十字区有地址？不如给他写信吧。至少有件事能做。
        - id: ch01-b65
          speaker: narrator
          text: 于是埃尔弗丽达写了一封信，两个人一起签名。
        - id: ch01-b66
          speaker: elfrida
          text: 亲爱的表兄理查德，你还记得在火药阴谋那次遇见我们吧。要是你又来到现代，我们想认识你，也想知道你怎样来到未来。说不定我们也能用同样的办法回到过去，因为以前那个办法已经不灵了。下次你也许可以来这里，不必去新十字区。远方的亲爱朋友，埃尔弗丽达·阿登小姐，埃德雷德·阿登勋爵。
        - id: ch01-b67
          speaker: edred
          text: 又及，我不知道勋爵该怎样署名，因为我当勋爵还没多久。不过你会知道我是谁。再及，别忘了老鹦鹉鼻子。
        - id: ch01-b68
          speaker: narrator
          text: 他们拿着信走去投邮，一路想起在波拿巴时代，自己怎样带着老阿登夫人的信去乔治客栈。埃德雷德没精打采地说，要是能找到走私洞穴，倒也有点意思。两人买来邮票，仔细舔过，再贴到信封上。寄出信以后，他们又爬上悬崖，钻进一丛丛金雀花之间，到处寻找走私洞穴的入口。可找来找去，什么也没找到。
        - id: ch01-b69
          speaker: narrator
          text: 世上再没有什么事，比寻找一样怎么也找不着的东西更容易让人热得冒汗。世上也再没有什么地方，比夏日晴朗的午后、丘陵上一大片密密麻麻的金雀花丛更热。枝叶从四面八方挤过来，太阳又一直晒在头顶。孩子们终于走到一片干净、平坦又光滑的草地，赶紧坐下歇息，望着远处海面淡蓝的一线，心里都松了一口气。
        - id: ch01-b70
          speaker: narrator
          text: 其实，他们一点也不喜欢刚才那场寻找。无用的懊悔正咬着两个人的心。埃德雷德先把心里话喊了出来。
        - id: ch01-b71
          speaker: edred
          text: 啊，要是有机会时，我们就穿上那些金色衣服该多好！
          emotion: sad
        - id: ch01-b72
          speaker: elfrida
          text: 是啊，要是当时穿上了该多好！
          emotion: sad
        - id: ch01-b73
          speaker: narrator
          text: 两个人沉默下来，久久望着大海。
        - id: ch01-b74
          speaker: narrator
          text: 如果你安安静静地坐上很久，只看着海、天空，或河里不停流动的水，心里就会发生一种魔法。它不像我讲过的那些猛烈魔法，不会忽然把你卷进冒险。它发生在人的心里，温和，却有很强的力量。乱成一团的事情会慢慢清楚起来，你也会看明白什么真正重要，什么其实不值得烦恼。下次你大发脾气，觉得别人待你很不公平，或者为一件事失望透顶、伤透了心，也可以亲自试一试。
        - id: ch01-b75
          speaker: narrator
          text: 这魔法在两个孩子心里慢慢生效。过了一会儿，埃德雷德说出了新的想法。
        - id: ch01-b76
          speaker: edred
          text: 不管怎么说，我们已经有了城堡。
        - id: ch01-b77
          speaker: elfrida
          text: 而且经历过那么多痛快的事。
        - id: ch01-b78
          speaker: narrator
          text: 他们又默默看了一阵海。希望悄悄来到埃尔弗丽达耳边，对她说了句话。
        - id: ch01-b79
          speaker: elfrida
          text: 白鼹鼠精！也许还没全完。它叫我们找门，我们也找到了。要是现在召唤它，而且它肯来，说不定会告诉我们新的办法。
          emotion: happy
        - id: ch01-b80
          speaker: edred
          text: 对，要是它肯来。
        - id: ch01-b81
          speaker: elfrida
          text: 别说话，快作诗。
        - id: ch01-b82
          speaker: narrator
          text: 可埃德雷德怎么也不会作诗。对他来说，那就像回想一个从没听过的名字，又像拿一个已经忘掉的数，去乘另一个根本想不起的数。
        - id: ch01-b83
          speaker: narrator
          text: 埃尔弗丽达这位年轻的小诗人皱紧眉头，咬着嘴唇，双手扭来扭去。她在脑海里拼命伸手，去够那些总差一点才能想起来的字句。终于，字句一点点变得驯服，自己飞进她伸手可及的地方。她立刻把它们捉住，再关进韵脚编成的栅栏里。
        - id: ch01-b84
          speaker: elfrida
          text: 亲爱的白鼹鼠精，有空快来吧。快告诉我们，有没有好办法。能不能教教我们两个小孩，像从前那样，回到过去的时代。亲爱的白鼹鼠精，不想把你催，可我们真的急得不得了，快些飞！
        - id: ch01-b85
          speaker: narrator
          text: 白鼹鼠精突然出现在他们中间那片焦黄的草地上。
        - id: ch01-b86
          speaker: mouldiwarp
          text: 你们哪回不急。唉，年轻就是犯傻的好时节。如今又怎么啦？俺可让这一套累坏了。真希望只消把宝藏交给你们，俺就能走自己的路。你们连一分钟清静也不给可怜的白鼹鼠精，简直跟苍蝇一样烦人，可不是嘛。
        - id: ch01-b87
          speaker: elfrida
          text: 还有别的办法能回到过去吗？我们现在找不到那扇门了。
        - id: ch01-b88
          speaker: mouldiwarp
          text: 当然找不到。机会错过，这辈子都回不来啦。能做偏偏不肯做，想做已经没法做。现在告诉俺，你们想到哪里去。俺给你们造一只倒着走的白时钟。
        - id: ch01-b89
          speaker: edred
          text: 随你喜欢，哪里都行。
        - id: ch01-b90
          speaker: narrator
          text: 这句话说得太大意了。鼹鼠懊恼地揉着鼻子，啧啧出声。
        - id: ch01-b91
          speaker: mouldiwarp
          text: 又一个机会错过，这辈子都回不来啦。你们可真会糟蹋机会。快回答，得像黄鼠狼的鼻子一样快。过去有没有谁，是你们想见的？心里没个人，哪儿也去不成。俺这诗随便哪天拿出来，都不比你的差。
        - id: ch01-b92
          speakers: [elfrida, edred]
          ensemble: duo
          text: 表兄理查德。
        - id: ch01-b93
          speaker: narrator
          text: 这是他们唯一想得起来的名字。
        - id: ch01-b94
          speaker: mouldiwarp
          text: 坐着别动，亲爱的孩子们。俺给你们铺一条白路，一直通到他那里。
        - id: ch01-b95
          speaker: narrator
          text: 他们浑身上下都不动，只有舌头例外。
        - id: ch01-b96
          speaker: elfrida
          text: 他是在过去吗？如果真在过去，我们给他写信就没什么用了。
        - id: ch01-b97
          speaker: mouldiwarp
          text: 管好你们的小舌头，闭紧小嘴，睁大眼睛，再好好祝白魔法成功。世上从没有哪一种魔法，会因为别人真心祝愿，就变得更糟。
        - id: ch01-b98
          speaker: elfrida
          text: 我能不能再说一句，而且不妨碍魔法？
        - id: ch01-b99
          speaker: mouldiwarp
          text: 拿白手帕盖住脸，隔着手帕说，那就行。
        - id: ch01-b100
          speaker: narrator
          text: 真是难得的巧合，埃尔弗丽达的手帕恰好是白的，还保持着洗衣女工熨出的十六个整齐方格。她躺到草地上，把手帕蒙住脸，隔着它开口。
        - id: ch01-b101
          speaker: elfrida
          text: 我还想再见那位保姆女巫。
        - id: ch01-b102
          speaker: mouldiwarp
          text: 不见表兄理查德，改见她？
        - id: ch01-b103
          speaker: elfrida
          text: 不是，我两个都要见。
        - id: ch01-b104
          speaker: mouldiwarp
          text: 这就对啦。愿望不该乱改，可谁也没说不能把它添大一些，恰恰相反。现在看吧！
        - id: ch01-b105
          speaker: narrator
          text: 埃尔弗丽达立刻把手帕掀开，睁大眼睛看去。你有没有仔细瞧过，拔起浴缸塞子以后，洗澡水怎样打着旋流走？你又有没有见过人把漏斗插进窄窄的瓶口，再把水从上面灌进去？接下来的景象，就有一点像这两件事。
        - id: ch01-b106
          speaker: narrator
          text: 白鼹鼠精向深蓝的天空伸出双手。也许该说，那是两只前爪。天上的白云正像一群巨大的绵羊，挤在一起。鼹鼠开了口，却不像说话，倒像唱歌。不过，那到底算不算歌，也很难说。那声音更像演奏大师刚一拉弓，小提琴发出的头几个音。
        - id: ch01-b107
          speaker: narrator
          text: 白云像是听见召唤，俯下身来回应。它们在蓝天里一圈又一圈地旋转，越聚越紧，又盘旋着向下，就像拔开写着“排水”的浴缸塞子以后，水围着出水口打旋。云朵转了一圈又一圈，最后变成一只无比巨大的白漏斗。细长的漏斗颈化作一个大圆环，正悬在丘陵的干草地上，笼罩着那一小群身影。圆环还在越垂越低，终于严丝合缝地套了下来。三个人站进一座白塔，塔底接触草地的地方很窄，向上却一路展开，直通头顶的蓝天。
        - id: ch01-b108
          speaker: mouldiwarp
          text: 手拉起来！只要周围有魔法，就一定要牵着手。
        - id: ch01-b109
          speaker: narrator
          text: 两个孩子握住了彼此。
        - id: ch01-b110
          speaker: mouldiwarp
          text: 两只手都得拉住！
        - id: ch01-b111
          speaker: narrator
          text: 他们又各自伸出另一只手，也有人握住了。云漏斗飞快旋转，一圈又一圈，速度还在不断加快。脚边那只鼹鼠的声音渐渐又轻又远。
        - id: ch01-b112
          speaker: mouldiwarp
          text: 起来！起来！连云朵都肯为你们的快乐跳舞，你们难道偏要站着，一步也不肯跳吗？
        - id: ch01-b113
          speaker: narrator
          text: 孩子们跳了起来。云中真的传来了音乐，可那声音如此遥远，又如此模糊，哪怕你见过最耳聪目明的音乐教师，也辨不出究竟是什么曲调。可是节拍分明地一下、一下、一下敲着，执拗得叫人的双脚只想跟上。渐渐地，旋律又穿透节拍钻了出来。那就像你到海边度假，恰好住在教会少年队快乐的白帐篷营地附近，看见少年们列队走过，笛子的声音越过鼓点，直钻进耳朵。
        - id: ch01-b114
          speaker: narrator
          text: 这一回，两个孩子的脚再也抵挡不住音乐。他们跟着节拍跳起来，脚下踏出的舞步连自己都不知道自己会跳。他们也第一次真正明白，舞蹈原来可以有这样的快乐。这才不是你们平常跳的华尔兹，甚至也不是端端正正的小步舞。这样的舞，意味着青春，意味着欢欣，也意味着出门度假的自由。跳舞的人已经下定决心，无论接下来遇见什么，都要一直享受到最后一口气。
        - id: ch01-b115
          speaker: narrator
          text: 他们跳个不停。白云漏斗越降越低，终于在四周合拢，仿佛用一团白棉花把他们从头到脚裹住。可那团白色太柔软了，柔软得连肌肤都感觉不到，孩子们只能继续在其中转圈、踏步。空气里渐渐浮起一阵甜香。在那片云雾般柔软的白色中，他们看不见一朵花，也说不出香味究竟来自什么花，却知道那里面有春天，有辽阔的田野和长长的树篱。这些地方都远远离开了丑陋的城镇，也远离了砖墙和烟尘。四周的香味越来越浓，包住他们的云雾反而越来越薄，一缕缕绿色微光终于从白色深处透了进来。
        - id: ch01-b116
          speaker: narrator
          text: 绿光越来越亮，云漏斗慢慢升了上去。埃德雷德和埃尔弗丽达还在跳舞，可眼前已经不是刚才的丘陵。他们发现，自己只是三十来个孩子当中的两个。所有孩子手牵着手，围成一个大圆圈，在绿枝筑成的两道墙壁之间起舞，脚下是一方绿草铺成的柔软地毯。每个人头上，都戴着洁白的山楂花环。白鼹鼠精用白云施展魔法，送到他们面前的，就是这幅奇妙的景象。
        - id: ch01-b117
          speaker: edred
          text: 这是怎么回事？我们为什么在跳舞？
        - id: ch01-b118
          speaker: narrator
          text: 埃德雷德问的是左手牵着的小女孩。他这才发现，那只手拉着的不是姐姐。小女孩听了只是快活地笑，却一个字也没有回答。
        - id: ch01-b119
          speaker: narrator
          text: 埃尔弗丽达牵着埃德雷德的右手，自己的右手又握着一个绿衣男孩。她立刻认出了他。
        - id: ch01-b120
          speaker: elfrida
          text: 啊，是你！再见到你真好！这是怎么回事？我们为什么在跳舞？
          emotion: happy
        - id: ch01-b121
          speaker: richard
          text: 今天是五朔节。国王要来观看庆典。
        - id: ch01-b122
          speaker: elfrida
          text: 哪一位国王？
        - id: ch01-b123
          speaker: richard
          text: 还能是谁？当然是哈里国王，还有他的新王后。她不久以前还是安娜·博林小姐。
        - id: ch01-b124
          speaker: edred
          text: 喂，迪克，再见到你真是太好了。我们——
          emotion: happy
        - id: ch01-b125
          speaker: richard
          text: 现在别说，一个字也别说。这里不安全。而且，国王来了！
