  chapters:
    - id: ch01
      title: "CHAPTER XII. FILMS AND CLOUDS"
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            By bedtime, the films were quite dry. The evening had been delightful, with no magic at all except the magic of everyone being happy together without interruption. Edred slipped away, unpinned the films, and hid them in Elfrida's corner drawer. He judged, quite correctly, that it would be cleaner than any place in his own room. The precious films lay between her best lace collar and the handkerchief case Aunt Edith had given her at Christmas, the one embroidered with three fat buttercups. Then Edred returned to the parlor for one last game of Proverbs before bed. As he picked up his cards, he thought how strange it was. He had been imprisoned in the Tower and talked with Sir Walter Raleigh, and now he sat quietly playing cards with his aunt and sister like any ordinary little boy.
        - id: ch01-b02
          speaker: edred
          text: "Aha! That's it. I'm living a double life."
        - id: ch01-b03
          speaker: narrator
          text: >-
            He had found that expression in a book, and he was delighted with the idea.
        - id: ch01-b04
          speaker: aunt_edith
          text: >-
            Just look how pleased Edred is with himself! I expect he already has a whole proverb in his hand, or very nearly.
        - id: ch01-b05
          speaker: edred
          text: "You'll be pleased soon enough. You always win."
        - id: ch01-b06
          speaker: narrator
          text: >-
            And she did win. Edred's thoughts had wandered away to the treasure. He pictured himself and Elfrida taking Aunt Edith by the hand and leading her to its hiding place.
        - id: ch01-b07
          speaker: edred
          text: >-
            Behold the treasure of our house! Now we can rebuild the castle and mend the broken thatch on the cottages. I can go to Eton and Oxford. You can have a diamond tiara, Auntie, and Elfrida and I can each have a pony.
        - id: ch01-b08
          speaker: narrator
          text: >-
            Elfrida's thoughts were much the same, so Aunt Edith won the game of Proverbs.
        - id: ch01-b09
          speaker: aunt_edith
          text: "Mrs. Honeysett tells me you've both been very good."
        - id: ch01-b10
          speaker: narrator
          text: >-
            She gathered the cards together.
        - id: ch01-b11
          speaker: edred
          text: "Not especially. It's easy to be good when everything is so jolly."
        - id: ch01-b12
          speaker: elfrida
          text: "We did quarrel once or twice, you know."
        - id: ch01-b13
          speaker: edred
          text: "Yes, we did."
        - id: ch01-b14
          speaker: narrator
          text: >-
            They had not needed to confess that. The confession made them feel that now, if never before, they really were good.
        - id: ch01-b15
          speaker: aunt_edith
          text: >-
            Well, don't quarrel anymore. I'll be coming here for good quite soon, and then we'll have glorious times. Perhaps we'll even find the treasure. You have heard about it, haven't you?
        - id: ch01-b16
          speaker: edred
          text: "I should jolly well think we have!"
        - id: ch01-b17
          speaker: elfrida
          text: "We've looked for it too, but we haven't found it. Did you ever look?"
        - id: ch01-b18
          speaker: aunt_edith
          text: >-
            No, though I always wanted to. My grandfather searched for it when he was a little boy.
        - id: ch01-b19
          speaker: edred
          text: "Was your grandfather Lord Arden?"
        - id: ch01-b20
          speaker: aunt_edith
          text: >-
            No. He was the grandson of the Lord Arden who fought for the man they called King James the Third, the Pretender. Lord Arden was only a boy, so they let him off. Later, he mortgaged all the Arden lands to support the Young Pretender, Prince Charlie from the ballads. He raised money to send him, expecting Prince Charlie to repay it once he became king. Only he never did become king.
          emotion: sad
        - id: ch01-b21
          speaker: edred
          text: "Is that how the Tallow King got all the Arden land?"
        - id: ch01-b22
          speaker: aunt_edith
          text: >-
            Yes, dear. That is why English people prefer Tallow kings to Stuart kings. Old Lord Arden mortgaged everything. That means he borrowed money and promised that, if he failed to repay it by a certain date, the lenders could take the land instead. He could not repay it, so they did take the land. All that remained was a little property in the village and Arden Knoll, because those had been settled so that he could never part with them.
        - id: ch01-b23
          speaker: edred
          text: >-
            When we find the treasure, we'll buy the land back. The Tallow King means to sell it. Old Beale says he has grown so tallowy that Arden land isn't good enough for him. And we'll rebuild the castle too, won't we, Auntie? We'll mend the holes where rain comes through the thatch in people's cottages.
        - id: ch01-b24
          speaker: aunt_edith
          text: "Have you been inside many of the village cottages?"
        - id: ch01-b25
          speaker: narrator
          text: >-
            Aunt Edith asked anxiously. She had that strange fear of infection which seems to be part of being grown up.
        - id: ch01-b26
          speaker: elfrida
          text: >-
            I think we've been in every cottage. Old Beale told us we should visit them, so we'd know what needed doing if we found the treasure. The people are such dears. I think they like us because we're Ardens. Or is it because Edred is a lord?
        - id: ch01-b27
          speaker: narrator
          text: >-
            Edred looked very serious. At such moments he looked so much like his lost father that Aunt Edith could hardly bear it.
        - id: ch01-b28
          speaker: edred
          text: "We must find the treasure, so we can take proper care of our people."
        - id: ch01-b29
          speaker: elfrida
          text: "And throw out the Tallow King."
        - id: ch01-b30
          speaker: aunt_edith
          text: >-
            But you won't be unhappy if you never find it, will you? The search is really only a sort of game. No one I ever knew found a treasure. And think what you have found already. You have Arden Castle instead of Sea View Terrace and the lodgers. Good night, chicks.
        - id: ch01-b31
          speaker: narrator
          text: >-
            Aunt Edith was gone before the children woke next morning. Their first business was printing the photographs. They worked in the kitchen because Mrs. Honeysett was giving the parlor a thorough cleaning. Besides, sunlight poured through the wide kitchen window, and the broad old table gave them a large, clear place for the toning dishes. It had been scrubbed so many times that the grain of the wood rose in ridges. They chose matte paper because it seemed less ordinary than shiny paper and made each print feel more like a picture. With only one printing frame, the work took all morning. At last they had eighteen brown views of the castle, taken from every possible direction.
        - id: ch01-b32
          speaker: narrator
          text: >-
            They dried the prints by sticking them on the windows, as you know photographs are best dried. Then they had to decide where to put them. They could not gloat over them forever. Still, for quite a long while, looking at them again and again seemed better than doing anything else. They kept pointing to one part or another and saying, “That is how the castle ought to look. That is how we'll rebuild it.” At last they carried the prints into the parlor, now as neat as a new pin and smelling almost too strongly of beeswax and turpentine. They spread them across the polished oval dining table and admired them all over again.
        - id: ch01-b33
          speaker: elfrida
          text: >-
            Every little part shows exactly right. They're just a tiny bit blurred. Perhaps we had the distance wrong, but that only makes them look more like real pictures. Printing them on paper that's too large makes them look more pictury too. Anyone who understands buildings could use them to put the castle back together. It would be like putting bricks into a box by following the picture inside the lid.
        - id: ch01-b34
          speaker: mrs_honeysett
          text: "Have you finished with all this litter?"
        - id: ch01-b35
          speakers: [edred, elfrida]
          ensemble: duo
          text: "Yes!"
        - id: ch01-b36
          speaker: narrator
          text: >-
            They kept looking at the pictures. It was fortunate that both had answered. If only one had called out, Mrs. Honeysett might later have had what she called words with that child. A moment later, they both remembered what was still in the kitchen.
        - id: ch01-b37
          speakers: [edred, elfrida]
          ensemble: duo
          text: "The films!"
          emotion: surprised
        - id: ch01-b38
          speaker: narrator
          text: >-
            They rushed in just in time to see a sharp, crackling flare brighten the kitchen fire. Mrs. Honeysett had thrown the films in with the rest of the litter. As she pointed out, it was no one's fault but theirs.
        - id: ch01-b39
          speaker: mrs_honeysett
          text: >-
            I asked if you were done with all of it, and you both said yes. You've only yourselves to blame.
        - id: ch01-b40
          speaker: narrator
          text: >-
            She repeated this through all their cries of grief, and they had to admit that she was right.
        - id: ch01-b41
          speaker: edred
          text: "We'll just have to take extra-special care of the prints."
        - id: ch01-b42
          speaker: narrator
          text: >-
            They chose the History of the Ardens as a safe and suitable hiding place.
        - id: ch01-b43
          speaker: elfrida
          text: >-
            Losing the films doesn't matter quite so much because we could never have shown them to anyone. If we find the treasure, we'll arrange for Auntie to discover the prints. We could leave the History lying around. She'll think they're photographs of paintings, so that will be all right.
        - id: ch01-b44
          speaker: narrator
          text: >-
            While they slipped the prints between the pages, Elfrida noticed the words “moat” and “water supply.” She began to read and turned the page.
        - id: ch01-b45
          speaker: edred
          text: "Don't stop and read now."
        - id: ch01-b46
          speaker: narrator
          text: >-
            Elfrida waved him away, then turned back to the passage.
        - id: ch01-b47
          speaker: elfrida
          text: >-
            Listen to this. In ancient times, a moat surrounded Arden Castle. The first builders showed their great cleverness by diverting an underground stream. It rose through the chalk in the nearby hills and was said to empty into the sea about fifty yards below the high-water line. Their engineering works lasted until 1647, when the castle was besieged by the troops of what this author calls “that monster in human form, Oliver Cromwell.” To make the attack easier, the commanding officer ordered the stream returned to its original channel. His men obeyed, the moat ran dry, and that helped what the author calls the treacherous plans of the regicides. People say that even after all these centuries, the stream still keeps to its underground course. But the author visited the Earl of Arden in the autumn of 1821, received his gracious permission to search the site, and found no trace of it. The country people denied knowing of any stream. The author says they were sunk in ignorance and superstition, with no admiration for philosophy or the awe-inspiring beauties of nature.
        - id: ch01-b48
          speaker: edred
          text: >-
            What a dull fellow! When was that printed? Eighteen twenty-two? I think I know why those country What's-their-names would not admit anything about the stream. It must run through the smugglers' cave, and in those days they were smuggling as hard as they could.
        - id: ch01-b49
          speaker: elfrida
          text: "That was clever of you."
        - id: ch01-b50
          speaker: edred
          text: >-
            I bet we'll find signs of the stream after we find the treasure. Come on, let's try the chests again. This time we'll put on the first clothes we touch and take our chances. Nothing can stop us. We haven't quarreled or anything.
        - id: ch01-b51
          speaker: narrator
          text: >-
            They had not quarreled, but something stopped them all the same. They could not find the Door. It simply was not there. They searched the East House again and again, but no door would lead them to the marvelous attic with its two marvelous rows of chests. At last Elfrida sat on the top stair, not caring about the thick dust.
        - id: ch01-b52
          speaker: elfrida
          text: "But we haven't quarreled or done anything wrong."
          emotion: sad
        - id: ch01-b53
          speaker: edred
          text: >-
            It's all over. I can see that. We must have spoiled it somehow. Perhaps we shouldn't have taken those photographs.
          emotion: sad
        - id: ch01-b54
          speaker: elfrida
          text: "Do you think we could possibly have dreamed all of it?"
        - id: ch01-b55
          speaker: edred
          text: >-
            No. The prints are real. At least, I suppose they are. Let's go down and make sure.
        - id: ch01-b56
          speaker: narrator
          text: >-
            Full of miserable doubt, they went downstairs. The photographs were still where they had hidden them, between the pages of the History of Arden.
        - id: ch01-b57
          speaker: edred
          text: "I can't think of anything we can do now. Can you?"
          emotion: sad
        - id: ch01-b58
          speaker: narrator
          text: >-
            It was a wretched ending to all the adventures that had followed one another in such a lively procession ever since they arrived at Arden. It felt as if a door had been shut directly in their faces. Across the chapter that held all their adventures, someone seemed to have written the words “Not anymore” in letters too plain to mistake.
        - id: ch01-b59
          speaker: elfrida
          text: >-
            I wish we could find the witch again, but she said she could only come into our time once.
        - id: ch01-b60
          speaker: edred
          text: >-
            I wonder why. That fellow Dicky must have come here often enough to get an address in New Cross. What if we wrote to him? At least it would give us something to do.
        - id: ch01-b61
          speaker: narrator
          text: >-
            So they wrote a letter. Elfrida did the writing, and they both signed it.
        - id: ch01-b62
          speaker: elfrida
          text: >-
            Dear Cousin Richard, you may remember meeting us during the Gunpowder Plot. If you are visiting modern times again, we would like to know you and learn how you travel into the future. Perhaps we could reach the past in the same way, because our old way no longer works. Next time, perhaps you could come here instead of New Cross. Your affectionate friends at a distance, Miss Elfrida Arden and Lord Edred Arden.
        - id: ch01-b63
          speaker: edred
          text: >-
            Postscript. I don't know how lords sign letters because I haven't been one for long, but you'll know who I am. Second postscript. Remember old Parrot-nose.
        - id: ch01-b64
          speaker: narrator
          text: >-
            They walked down to the post with the letter. On the way, they remembered carrying old Lady Arden's letter to the George in Bonaparte's time. Edred remarked rather listlessly that finding the smugglers' cave might be fun. They bought a stamp, licked it, fixed it to the envelope, and posted the letter. Then they climbed the cliff and searched among the furze bushes for the cave entrance. They found nothing. Nothing makes you hotter than hunting for something you cannot find, and on a sunny summer afternoon there is nowhere hotter to search than a whole forest of furze on the downs. The children were thankful when they found a clean, smooth patch of grass where they could sit and gaze at the faint blue line of the sea.
        - id: ch01-b65
          speaker: narrator
          text: >-
            They had not truly enjoyed the search. Both were tormented by useless regrets, and Edred finally said his aloud.
        - id: ch01-b66
          speaker: edred
          text: "Oh, if only we'd put on those golden clothes when we had the chance!"
          emotion: sad
        - id: ch01-b67
          speaker: elfrida
          text: "Oh, if only we had!"
          emotion: sad
        - id: ch01-b68
          speaker: narrator
          text: >-
            Then they sat quietly and watched the sea for a long time. If you sit perfectly still for long enough and look at the sea, the sky, or the running water of a river, a sort of magic begins to work. It is not the fierce magic that brings the kind of adventures you have been hearing about. This magic is gentle, but very strong, and it works inside you. It clears your thoughts and shows you which things truly matter and which do not. Try it the next time you are in a very bad temper, when someone seems to have treated you unfairly, or when disappointment has left you hurt.
        - id: ch01-b69
          speaker: narrator
          text: >-
            That quiet magic worked on Edred and Elfrida.
        - id: ch01-b70
          speaker: edred
          text: "After all, we do have the castle."
        - id: ch01-b71
          speaker: elfrida
          text: "And we have had some ripping times."
        - id: ch01-b72
          speaker: narrator
          text: >-
            They watched the sea in silence again. During that silence, Hope whispered to Elfrida.
        - id: ch01-b73
          speaker: elfrida
          text: >-
            The Mouldiwarp! Perhaps this isn't the end. It told us to find the Door, and we did find it. Maybe it would tell us something new if we called it now, and if it came.
        - id: ch01-b74
          speaker: edred
          text: "Yes, if it came."
        - id: ch01-b75
          speaker: elfrida
          text: "Don't talk. Make some poetry."
        - id: ch01-b76
          speaker: narrator
          text: >-
            But Edred could never make poetry. To him, trying to write a poem was like trying to remember a name he had never heard. It was also like being asked to multiply a number he had forgotten by another number he could not recall. Elfrida was different. The young poet frowned, bit her lips, and twisted her hands. She reached outward in her mind for words she could not quite think of. At last the words grew tame and flew near enough for her to catch them. Then she caged them safely behind the bars of rhyme.
        - id: ch01-b77
          speaker: elfrida
          text: >-
            Dear Mouldiwarp, please come if you can, and tell us whether you know of a plan that will take us two into the past, the way that we went in days that are past. Dear Mouldiwarp, we don't mean to worry you, but we really are in a terrible hurry.
        - id: ch01-b78
          speaker: mouldiwarp
          text: >-
            So you always be. Well, well! Youth be the season for foolishness. What be wrong now? I be turble tired of all this. I wish I had only to give you the treasure and go my way. You don't give a poor Mouldiwarp one minute's rest. You plague me like flies, you do.
        - id: ch01-b79
          speaker: narrator
          text: >-
            The white Mouldiwarp had suddenly appeared between them on the dry yellow grass.
        - id: ch01-b80
          speaker: elfrida
          text: "Is there another way to reach the past? We can't find the Door now."
        - id: ch01-b81
          speaker: mouldiwarp
          text: >-
            Course you can't. That chance be gone, and gone forever. He that will not when he may, he shall not when he would-a. Tell me where you want to go, and I'll make you a backways-working white clock.
        - id: ch01-b82
          speaker: edred
          text: "Anywhere you like."
        - id: ch01-b83
          speaker: mouldiwarp
          text: >-
            Tch, tch! There be another chance gone forever. You be terrible wasteful with your chances. Now answer sharp as a weasel's nose. Be there anyone in the past you'd like to see? If you don't know, then you don't go. And that be poetry as good as yours any day of the week.
        - id: ch01-b84
          speakers: [elfrida, edred]
          ensemble: duo
          text: "Cousin Richard!"
        - id: ch01-b85
          speaker: narrator
          text: >-
            His was the only name they could think of.
        - id: ch01-b86
          speaker: mouldiwarp
          text: "Bide still, my dears, and I'll make you a white road straight to where he be."
        - id: ch01-b87
          speaker: narrator
          text: >-
            They sat still, except for their tongues.
        - id: ch01-b88
          speaker: elfrida
          text: "Is he in the past? Because if he is, our letter won't be much use."
        - id: ch01-b89
          speaker: mouldiwarp
          text: >-
            Hold your little tongues. Keep your little mouths shut and your little eyes open, and wish the white magic well. No magic was ever made worse by a good wish.
        - id: ch01-b90
          speaker: elfrida
          text: "May I say one thing without stopping the magic?"
        - id: ch01-b91
          speaker: mouldiwarp
          text: "Put your white handkerchief over your face and speak through it. Then you may."
        - id: ch01-b92
          speaker: narrator
          text: >-
            By a rare and fortunate chance, Elfrida's handkerchief was white. In fact, it was still folded into the sixteen perfect squares left by the laundress's iron. Elfrida lay back on the turf, threw it over her face, and spoke through it.
        - id: ch01-b93
          speaker: elfrida
          text: "I'd like to see the nurse witch again."
        - id: ch01-b94
          speaker: mouldiwarp
          text: "Instead of Cousin Richard?"
        - id: ch01-b95
          speaker: elfrida
          text: "No, as well as him."
        - id: ch01-b96
          speaker: mouldiwarp
          text: >-
            That's right. You should never change a wish, but no rule says you can't make it larger. Quite the opposite. Now look!
        - id: ch01-b97
          speaker: narrator
          text: >-
            Elfrida whipped away the handkerchief and looked. Have you watched bathwater run away when the plug is pulled, or seen a bottle filled through a funnel? The white Mouldiwarp stretched its hands toward the deep blue sky. Perhaps we ought to call them front paws. High above, the white clouds were herded together like enormous sheep.
        - id: ch01-b98
          speaker: narrator
          text: >-
            The Mouldiwarp made a sound. It was not quite speech, though you could not quite call it singing either. It sounded more like the first notes drawn from a violin when a master musician sets bow to strings. The clouds bent down to answer. They wheeled around and around the blue sky, drawing together and swirling lower just as bathwater circles away. Soon they formed a vast white funnel. Its narrow end hung as a great ring above the little group on the dry grass. Lower and lower it stooped. The ring settled around them, and they stood inside a white tower, narrow at its grassy base and widening overhead toward the blue.
        - id: ch01-b99
          speaker: mouldiwarp
          text: "Take hands! Always hold hands when magic be near."
        - id: ch01-b100
          speaker: narrator
          text: >-
            The children clasped one pair of hands.
        - id: ch01-b101
          speaker: mouldiwarp
          text: "Both hands."
        - id: ch01-b102
          speaker: narrator
          text: >-
            Each child reached out the other hand, and each hand was caught and held. Around and around them went the cloud funnel, moving faster and faster until its speed was almost beyond belief. Through all that whirling whiteness, the Mouldiwarp's voice at their feet began to sound faint and very far away.
        - id: ch01-b103
          speaker: mouldiwarp
          text: >-
            Up! Shall the clouds themselves dance for your pleasure while you stand still and refuse to join them?
        - id: ch01-b104
          speaker: narrator
          text: >-
            The children jumped. Something came through the cloud that had to be music, though it was so faint and distant that the sharpest music teacher they had ever known could not have found its tune. The rhythm was clear and insistent. Beat, beat, beat. It made their feet ache to keep time. Then a melody pierced the rhythm, just as the sound of pipes rises through the sound of drums when the Church Brigade boys march past on a seaside holiday, near their cheerful camp of white tents. This time, the children's feet could resist no longer.
        - id: ch01-b105
          speaker: narrator
          text: >-
            They danced steps they had never known they knew. For the first time, they discovered the joy of real dancing. This was none of your waltzing, or even your minuets. It was the dance of youth and gaiety, of being away on holiday and being determined to enjoy everything to the very last breath. As they danced, the white funnel sank and closed around them. It wrapped them in cloudy whiteness as soft as cotton wool, too soft even to feel against their skin.
        - id: ch01-b106
          speaker: narrator
          text: >-
            A sweet scent filled the air all around both of the children. In that soft cloudy whiteness, they could not tell which flower carried it. They only knew it smelled of spring, and of distant fields and hedges far from the ugliness of towns. The scent seemed to grow thicker while the cloud around them grew thinner. Then green lights began to show through the whiteness.
        - id: ch01-b107
          speaker: narrator
          text: >-
            The green lights grew brighter, and at last the cloud funnel lifted away from them into the blue sky. Edred and Elfrida were still dancing, but now they found themselves only two among a ring of about thirty children dancing together. Beneath their feet was a carpet of green turf, and on both sides rose walls of leafy green branches. Every child in the dancing ring wore a wreath of white May blossom upon their head. This was the magical scene that had come to them through the white cloud of the white Mouldiwarp's magic.
        - id: ch01-b108
          speaker: narrator
          text: >-
            Edred discovered that his left hand held the hand of a little girl, not Elfrida's.
        - id: ch01-b109
          speaker: edred
          text: "What is this? Why are we dancing?"
        - id: ch01-b110
          speaker: narrator
          text: >-
            The little girl laughed and laughed, but she gave him no answer at all. Elfrida was still holding Edred's right hand. Her own right hand was clasped in the hand of a boy dressed in green, and she recognized him at once.
        - id: ch01-b111
          speaker: elfrida
          text: "Oh, it's you! I'm so glad. What is happening? Why are we all dancing?"
          emotion: happy
        - id: ch01-b112
          speaker: richard
          text: "It is May Day, and the King is coming to watch the revels."
        - id: ch01-b113
          speaker: elfrida
          text: "Which king?"
        - id: ch01-b114
          speaker: richard
          text: >-
            Why, King Harry, of course. He is coming with his new Queen, who until lately was Lady Anne Boleyn.
        - id: ch01-b115
          speaker: edred
          text: "Dick, I am jolly glad to see you again. We—"
          emotion: happy
        - id: ch01-b116
          speaker: richard
          text: >-
            Not now. Don't say another word. It isn't safe, and besides, the King is coming!
