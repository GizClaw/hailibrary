  chapters:
    - id: ch01
      title: "CHAPTER I. ARDEN'S LORD"
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            Once, Arden Castle had been the heart of a great estate. It had farms and fields, jewels and money, tenants, squires, and armed men. One head of the family rode for three days to meet King Henry at the edge of his lands. The King came back with him and slept in the tall state bed in the castle guest room. An Arden heir later led his followers against Cromwell. Younger sons fought overseas for England and brought honor to their country. Each new exploit laid another thin coat of glory over the old Arden name, though glory fades as surely as gold leaf. Ardens had lived there since Saxon times. Ardens still lived, but there were very few of them now, and they were poor. The lands were gone. So were the squires and armed men. The castle had no roof, and no glass remained in its windows. Those empty windows stared across fields that belonged to strangers and now reached to the foot of the worn gray walls. Only two male Ardens were known to be left: an old man and a child.
        - id: ch01-b02
          speaker: narrator
          text: >-
            The old man was Lord Arden, head of the family. He lived alone in a small house built from stones knocked out of the castle walls by time and Cromwell's cannon fire. The child was Edred Arden. His home stood in a clean, windy town on a cliff.
        - id: ch01-b03
          speaker: narrator
          text: >-
            It was a bright, cheerful house with bow windows and a green balcony looking straight over the glittering sea. Three tidy white steps led up from the street. On the front door was a brass knocker, rubbed so often and so carefully that it had become pale and smooth. From outside, everything about the place looked pretty and welcoming. It would have been a very pleasant house to live in if not for one thing: the lodgers. I can no longer hide the truth from you. Edred lived with his aunt, and his aunt earned their living by letting rooms. Letting lodgings is one of the most unpleasant ways anyone can make a living. Before you choose it, I advise you to try every other honest way first.
        - id: ch01-b04
          speaker: narrator
          text: >-
            People who rent rooms at the seaside somehow seem much harder to please than hotel guests. They expect far more waiting on. They want meal after meal, often at the oddest hours, and they ring the bell nearly all day. Sand comes home from the beach in every fold of their clothes. It shakes loose over the carpets, sinks into the sofa cushions, and finds its way onto everything else in the house. They hang long, wet trails of seaweed against the pretty roses on the new wallpaper. Their washbasins always seem to be full of shells and sea anemones.
        - id: ch01-b05
          speaker: narrator
          text: >-
            They are noisy, too. Their boots always seem to be pounding on the stairs, especially when you have a headache. When you give them the bill, they are sure it is too high, however little you charge. So, if you can possibly avoid it, do not let lodgings.
        - id: ch01-b06
          speaker: narrator
          text: >-
            Miss Arden could not avoid it. This was how it happened.
        - id: ch01-b07
          speaker: narrator
          text: >-
            Edred and his sister, Elfrida, were away at school. Miss Arden lived nearby so she could often see them. She was preparing her wedding clothes, and the man she was to marry was on his way home from South America with a fortune. Edred and Elfrida's father was coming home with a fortune as well, because he and her sweetheart were business partners. The children already called the sweetheart Uncle Jim. Whenever they met their aunt, they all talked about the splendid life ahead. Father and Uncle Jim would return, and everyone would live happily together in the country.
        - id: ch01-b08
          speaker: narrator
          text: >-
            Then terrible news arrived. Brigands had captured Father and Uncle Jim, and all the money was lost. Nothing remained except the house on the cliff. Miss Arden took the children out of their expensive London school. Since there was no money to live on and no other way to earn it, she bravely began taking lodgers and did the work well. After that came word that Father and Uncle Jim were dead. For a while, all the light seemed to go out of life at Cliff House.
        - id: ch01-b09
          speaker: narrator
          text: >-
            That had happened two years before, but the children never grew used to the lodgers. They hated them. At first they tried to make friends with the lodgers' children. Those children soon made it clear that they thought Edred and Elfrida far beneath them. Often they were just the sort of children anyone might have looked down on, if looking down on people were ever right or kind. It was hard to feel friendly after Master Reginald Potts of Peckham stuck out his tongue on the promenade and called out for everyone to hear.
        - id: ch01-b10
          speaker: reginald
          text: "Lodgings! Yah!"
        - id: ch01-b11
          speaker: narrator
          text: >-
            There were almost always guests, because the house was comfortable and people returned. While they stayed, the family had to squeeze into the very top and very bottom of the house: the attics and the basement.
        - id: ch01-b12
          speaker: narrator
          text: >-
            When there were no guests, the family used every room in turn so none would grow stale and shut up. The children liked the large basement parlor best. All its furniture had belonged to Ardens long dead, and every picture on the walls showed another long-dead Arden. The lodgers' rooms had newer furniture. It was neat enough, but none of it had stories attached to it. The polished oak tables and writing desks in the basement seemed to carry all the old tales of the family with them.
        - id: ch01-b13
          speaker: narrator
          text: >-
            Every day Edred and Elfrida went to school. They learned reading, writing, arithmetic, geography, history, spelling, and useful knowledge. They hated every subject equally.
        - id: ch01-b14
          speaker: narrator
          text: >-
            Strangely enough, they did like homework when Aunt Edith had time to help. With her, geography turned into adventure, history became a story, and even arithmetic suddenly meant something.
        - id: ch01-b15
          speaker: edred
          text: >-
            I wish you could always teach us. Trying to learn things when they're only words in books seems so silly.
        - id: ch01-b16
          speaker: narrator
          text: >-
            Edred was covered in ink, but for once he was interested in the things China exported.
        - id: ch01-b17
          speaker: aunt_edith
          text: >-
            I wish I could teach you, but I can't do twenty-nine thousand and seventeen things at the same time, and—
        - id: ch01-b18
          speaker: narrator
          text: >-
            A bell jangled. Aunt Edith stood and went into the kitchen.
        - id: ch01-b19
          speaker: aunt_edith
          text: >-
            Seven times since tea! There it goes again, poor Eliza. Answer the bell, but whatever they say, don't answer back. It never helps, and it may stop them leaving you half a crown when they go.
        - id: ch01-b20
          speaker: elfrida
          text: "I do love the part where they leave."
        - id: ch01-b21
          speaker: aunt_edith
          text: >-
            So do I. A cab piled high with luggage and the horse pointing toward the station is a heavenly sight, once the bill is paid. But then I'm just as happy when the luggage first arrives. Chickens, when my ship comes home, we'll live on a desert island. There won't be any cabs, and no lodgers will ever come to our cave.
        - id: ch01-b22
          speaker: edred
          text: >-
            When I'm grown up, I'll cross the sea, find your ship, and bring it home. I'll take a steam tug and steer it myself.
        - id: ch01-b23
          speaker: elfrida
          text: "Then I'll be captain."
        - id: ch01-b24
          speaker: edred
          text: "No, I'll be captain."
        - id: ch01-b25
          speaker: elfrida
          text: "You can't be captain if you're steering."
        - id: ch01-b26
          speaker: edred
          text: "Of course I can!"
        - id: ch01-b27
          speaker: elfrida
          text: "No, you can't!"
        - id: ch01-b28
          speaker: edred
          text: "Yes, I can!"
        - id: ch01-b29
          speaker: elfrida
          text: >-
            Fine, then, do it. I know you can't. While you're trying, I'll dig up a gold mine in the garden. By the time you come back, Aunt Edith will be rolling in money and won't need your silly old ship.
        - id: ch01-b30
          speaker: aunt_edith
          text: "Spelling next. How do you spell disagreeable?"
        - id: ch01-b31
          speaker: edred
          text: "Which one of us do you mean?"
        - id: ch01-b32
          speaker: aunt_edith
          text: "Both of you."
        - id: ch01-b33
          speaker: narrator
          text: >-
            Aunt Edith tried to look very stern. Children are always dreaming that their ship will come home. They imagine having a hundred pounds, or a thousand, or a million, all to spend as they please. My own favorite dream was a thousand pounds, with everyone clearly agreeing that none of it had to be spent on anything useful.
        - id: ch01-b34
          speaker: narrator
          text: >-
            Once you have dreamed up your fortune, you can happily spend hour after hour deciding what presents to buy for everyone you love. You picture each person's surprise and delight when the beautiful gifts arrive. You also enjoy imagining how wonderfully generous everyone will think you are. Very few people spend every penny of a dream fortune on themselves. Naturally, you begin by buying yourself a motor bicycle, footballs and bats, dolls with real hair, a proper china tea set, a huge box of mixed chocolates, Treasure Island, and every book Mrs. Ewing ever wrote. Once those important purchases are settled, you begin planning gifts for other people.
        - id: ch01-b35
          speaker: narrator
          text: >-
            It is a beautiful dream. Too often, by the time a hundred or a thousand pounds truly comes our way, we have forgotten what we meant to do with it. Instead of those generous presents, the money goes into stocks and shares, promising building sites, fat cigars, and fur coats. If I were young again, I would sit down and write a list of every kind thing I meant to do when my ship came home. Then, if the ship ever did arrive, I would take out that list, read it carefully, and—
        - id: ch01-b36
          speaker: narrator
          text: >-
            But the parlor bell was ringing for the eighth time. The front door, first floor, and second floor bells were ringing too, while Eliza tried to answer four bells at once. That is always a very difficult thing to do.
        - id: ch01-b37
          speaker: narrator
          text: >-
            The postman was at the front door with three letters. One was a bill for repairing the lid of the water tank. Edred had recently lit a fire on it because he believed wood could not burn with water on the other side. The blackened lid proved that belief completely wrong. The second letter asked whether Miss Arden would house a clergyman for half price because his very large family had all just had measles.
        - id: ch01-b38
          speaker: narrator
          text: >-
            The third was the letter. It was not merely another piece of post. It was the seed from which this story grew, the point where everything began, the backbone that holds the whole adventure together, and the reason for telling it at all.
        - id: ch01-b39
          speaker: narrator
          text: >-
            Edred had collected the letters from the postman. He waited while Aunt Edith read them because he collected postmarks and could not tell in the dim gaslight of the hall whether any were valuable. The third letter affected his aunt very strangely. She read it once and rubbed a hand across her eyes. Then she stood beneath the chandelier, though its worn-out burners gave hardly any light, and read it again. She read it a third time.
        - id: ch01-b40
          speaker: aunt_edith
          text: "Oh, I can hardly believe it!"
          emotion: surprised
        - id: ch01-b41
          speaker: elfrida
          text: "What is it, Auntie? Is it the taxes?"
        - id: ch01-b42
          speaker: narrator
          text: >-
            Once before, a letter had been about taxes, and Elfrida had never forgotten it. If you do not understand, ask your poorest relations. They are also likely to be the nicest. If they cannot explain, ask the washerwoman.
        - id: ch01-b43
          speaker: aunt_edith
          text: "No, darling. It isn't the taxes. Quite the opposite."
        - id: ch01-b44
          speaker: narrator
          text: >-
            The children had no idea what the opposite of taxes might be. Neither do I. Still, they felt sure it must be something pleasant.
        - id: ch01-b45
          speakers: [edred, elfrida]
          ensemble: duo
          text: "Oh, Auntie, we're so glad!"
          emotion: happy
        - id: ch01-b46
          speaker: narrator
          text: >-
            They said it several times before asking what the news actually was.
        - id: ch01-b47
          speakers: [edred, elfrida]
          ensemble: duo
          text: "But what is it?"
        - id: ch01-b48
          speaker: aunt_edith
          text: >-
            I think—I'm not certain—but perhaps my ship has come home. Only the tiniest piece of a ship, mind you. Hardly more than a toy boat. I must take the first train to London tomorrow and find out whether it truly is a ship, and what sort. Mrs. Blake will come in. You'll both be as good as gold, won't you?
        - id: ch01-b49
          speakers: [edred, elfrida]
          ensemble: duo
          text: "Yes. Oh, yes!"
        - id: ch01-b50
          speaker: aunt_edith
          text: >-
            No setting traps for the butcher, no climbing onto the roof in your nightclothes, no playing Red Indians in the dustbin, and no making apple-pie beds for the lodgers?
        - id: ch01-b51
          speaker: narrator
          text: >-
            She had hurriedly named only a few of the little amusements that had lately made her nephew's and niece's spare time more exciting, and everyone else's rather less peaceful.
        - id: ch01-b52
          speaker: edred
          text: >-
            We honestly won't. We'll even try not to think of anything new and fun.
        - id: ch01-b53
          speaker: narrator
          text: >-
            That last promise called for real self-sacrifice.
        - id: ch01-b54
          speaker: aunt_edith
          text: >-
            My train leaves at eight thirty. I wish I could think of some way to keep you amused.
        - id: ch01-b55
          speaker: narrator
          text: >-
            She was too kind to say that she meant keeping them out of mischief for the day.
        - id: ch01-b56
          speaker: aunt_edith
          text: >-
            I'll bring you something splendid for your birthday, Edred. Would you like to spend the day with dear Mrs. Hammond?
        - id: ch01-b57
          speaker: edred
          text: >-
            Oh, no! Why can't Elf and I have a picnic on the downs for my birthday? It won't matter if we go one day early, will it? Last summer you said we were too small and we could go this summer. Well, this is this summer. I've grown two inches and Elf has grown three, so together we're five inches taller than when you said we weren't big enough.
        - id: ch01-b58
          speaker: aunt_edith
          text: >-
            Now you see how useful arithmetic can be. Very well, you may go. Wear your old clothes and keep the road in sight at all times. You can have the whole day off. And now, bed. Oh, that bell again! Poor Eliza.
        - id: ch01-b59
          speaker: narrator
          text: >-
            As Edred and Elfrida passed through the baize door between the basement and the rest of the house, one lodger's boy happened to be going upstairs. He poked his tongue through the banisters at them.
        - id: ch01-b60
          speaker: lodger_boy
          text: "Little servants!"
        - id: ch01-b61
          speaker: narrator
          text: >-
            He expected to reach the top before they could run around the banisters. He had forgotten how long Elfrida's arm was. Her hand shot through, caught his leg, and held him until Edred came around. The boys struggled upward together, then rolled all the way back down. Their relations separated them at the bottom. Apart from that small incident, bedtime passed quietly.
        - id: ch01-b62
          speaker: narrator
          text: >-
            Aunt Edith left on the eight-thirty train the next morning. Instead of books, the children's school satchels held buns. Sandwiches replaced their exercise books, and where their inky pencil boxes usually lay were two magnificent boxes of peppermint creams. Each had cost a whole shilling. Aunt Edith had bought them recklessly in the excitement of saying goodbye at the station.
        - id: ch01-b63
          speaker: narrator
          text: >-
            The children walked slowly up the red-brick pavement. Those bricks always looked as if someone had only just finished washing them. When they reached the top of the hill, both children stopped. They looked at each other, each knowing exactly what the other had in mind.
        - id: ch01-b64
          speaker: edred
          text: "It can't be wrong."
        - id: ch01-b65
          speaker: elfrida
          text: "She never said we mustn't."
        - id: ch01-b66
          speaker: edred
          text: >-
            I've noticed that when grown-ups say they'll see about something you want, it never happens.
        - id: ch01-b67
          speaker: elfrida
          text: "I've noticed that too. Auntie always said she'd see about taking us there."
        - id: ch01-b68
          speaker: edred
          text: >-
            Exactly. And we won't be sneaky about it. We'll tell her the moment she comes home.
        - id: ch01-b69
          speaker: narrator
          text: >-
            No one had accused him of being sneaky. Elfrida felt relieved anyway, since she had not been sure he planned to confess.
        - id: ch01-b70
          speaker: elfrida
          text: "Of course we will."
        - id: ch01-b71
          speaker: edred
          text: >-
            Besides, it is our castle. We ought to see the cradle of our race. That's what Cliffgate and Its Environs calls it. Let's say we're pilgrims. We can use our satchels as packs and spend your penny on two halfpenny walking sticks. We could even put peas in our shoes, if you like.
        - id: ch01-b72
          speaker: elfrida
          text: >-
            We'd have to go back for the peas, and split peas probably don't count. They might hurt, too. And I wanted my penny for—
        - id: ch01-b73
          speaker: narrator
          text: >-
            She saw her brother frown and stopped.
        - id: ch01-b74
          speaker: elfrida
          text: >-
            All right, take it. But the next time you get a penny, you must give me half. That's only fair.
        - id: ch01-b75
          speaker: edred
          text: "I'm not usually unfair. Let's forget being pilgrims."
        - id: ch01-b76
          speaker: elfrida
          text: "But I'd like to be pilgrims."
        - id: ch01-b77
          speaker: edred
          text: "No. We'll simply walk."
        - id: ch01-b78
          speaker: narrator
          text: >-
            So they simply walked, and did it rather gloomily. The town began to thin out like the knitted threads around a hole in a stocking. The houses stood farther and farther apart, and broad gardens opened around them. In one garden, a maid was shaking out the mats and singing quietly to herself. Somehow, maids do not seem to sing while they work nearly so often in towns.
        - id: ch01-b79
          speaker: maid
          text: >-
            Good luck, I say to my sweetheart, for I will love you true. Through all the time we have to part, my luck shall go with you.
        - id: ch01-b80
          speaker: elfrida
          text: "That's lucky for us."
        - id: ch01-b81
          speaker: edred
          text: "We're not her silly sweetheart."
        - id: ch01-b82
          speaker: elfrida
          text: >-
            No, but we heard the song and he didn't, since he isn't here. Look, a signpost. How far have we walked? I'm terribly tired.
        - id: ch01-b83
          speaker: edred
          text: >-
            You should have agreed to be pilgrims. Pilgrims never get tired, however many peas they have in their shoes.
        - id: ch01-b84
          speaker: elfrida
          text: "Then I'll be a pilgrim now."
        - id: ch01-b85
          speaker: edred
          text: "You can't. It's too late, and we're miles from the shop with the sticks."
        - id: ch01-b86
          speaker: elfrida
          text: >-
            Very well, then I won't go any farther. You got out on the wrong side of bed. I've tried all morning to answer you as sweetly as I can, and I'm finished trying. There!
        - id: ch01-b87
          speaker: edred
          text: "Then don't try. Go home if you want. You're only a girl."
        - id: ch01-b88
          speaker: elfrida
          text: "I'd rather be only a girl than be what you are."
        - id: ch01-b89
          speaker: edred
          text: "And what am I, exactly?"
        - id: ch01-b90
          speaker: narrator
          text: >-
            Elfrida stopped and squeezed her eyes shut.
        - id: ch01-b91
          speaker: elfrida
          text: >-
            Don't, don't, don't, don't! I won't be cross. I won't be cross. I won't be cross. Peace. Stop it. Let's not!
        - id: ch01-b92
          speaker: edred
          text: "Let's not what?"
        - id: ch01-b93
          speaker: elfrida
          text: >-
            Quarrel over nothing. We do it all the time, and Auntie says it's becoming a habit. If boys are so much more splendid than girls, they ought to be able to stop whenever they choose.
        - id: ch01-b94
          speaker: edred
          text: "What if they don't choose to?"
        - id: ch01-b95
          speaker: narrator
          text: >-
            He kicked his boots through the thick white dust.
        - id: ch01-b96
          speaker: elfrida
          text: "Well, I'll apologize first. Will that satisfy you?"
        - id: ch01-b97
          speaker: edred
          text: >-
            I was just about to apologize first myself. Come on. There's the signpost. Let's read it.
        - id: ch01-b98
          speaker: narrator
          text: >-
            The sign plainly announced, without any nonsense at all, that they had walked one and three-quarter miles. Then it added, most unkindly, that Arden Castle was still eight miles away. There was one useful piece of news. Ardenhurst Station was only another quarter of a mile down the road.
        - id: ch01-b99
          speaker: edred
          text: "We'll take the train."
        - id: ch01-b100
          speaker: elfrida
          text: "We haven't any money."
        - id: ch01-b101
          speaker: edred
          text: "Aha! Now you'll see I'm not stingy. I brought my new two-shilling piece."
        - id: ch01-b102
          speaker: elfrida
          text: "Oh, Edred, you are noble."
          emotion: surprised
        - id: ch01-b103
          speaker: edred
          text: "Pooh. That's nothing. Come on."
        - id: ch01-b104
          speaker: narrator
          text: >-
            His ears went red. Triumph and modesty were mixed together in exactly the right proportions. They hurried on toward the station, and so the pilgrims caught their first sight of Arden Castle from the train instead of from the road.
        - id: ch01-b105
          speaker: narrator
          text: >-
            The castle stood boldly on the cliff. It had been built there to keep foreign enemies away and protect all the country around it. Almost nothing remained of its old splendor. Great walls still rose above the land, with grasses and wildflowers growing from their stones. Round towers stood empty because their floors and ceilings had fallen away. Owls made their homes in roofless chambers, while brambles and green ferns grew strong and thick inside the ruins.
        - id: ch01-b106
          speaker: narrator
          text: >-
            The children followed the cliff path toward it. High in the pale sky, skylarks sang as if they had gone mad with joy. Bees moved busily through the bean fields, and the flowers gave off the sweetest smell in the world. That sweetness mixed with the salty scent of brown seaweed, rising and falling in the wash of the tide against the rocks at the foot of the cliff.
        - id: ch01-b107
          speaker: elfrida
          text: "Let's eat here."
        - id: ch01-b108
          speaker: narrator
          text: >-
            They had reached a small mound overlooking the castle, so there they ate. Their rule was two bites of sandwich followed by one bite of peppermint cream. As they munched, they gazed down at the castle and loved it more with every minute.
        - id: ch01-b109
          speaker: elfrida
          text: >-
            Don't you wish it were a real house again, and we could live there?
        - id: ch01-b110
          speaker: narrator
          text: >-
            By then they had eaten as much as they wanted of everything except the peppermint creams, which were completely gone.
        - id: ch01-b111
          speaker: edred
          text: "What remains of it is real."
        - id: ch01-b112
          speaker: elfrida
          text: >-
            You know what I mean. I wish it had chimneys and fireplaces, doors with bolts, and glass in the windows.
        - id: ch01-b113
          speaker: edred
          text: "I wonder whether we can get inside."
        - id: ch01-b114
          speaker: elfrida
          text: "Perhaps we could climb over."
        - id: ch01-b115
          speaker: narrator
          text: >-
            She looked hopefully at the enormous walls. They were sixty feet high, without a gate or opening anywhere in sight.
        - id: ch01-b116
          speaker: edred
          text: >-
            There's an old man crossing that field. Not that one, the bright green field. Let's ask him.
        - id: ch01-b117
          speaker: narrator
          text: >-
            They left their satchels on the short turf among the wild thyme and hurried down. They were not quite fast enough. The old man crossed a field of young corn, climbed a stile, and disappeared between the tall hedges of a deep lane. The children went over the stile and down after him. They caught up just as his garden gate clicked shut and he turned toward a brick path bordered by woodruff, anemones, narcissus, and tulips of every color.
        - id: ch01-b118
          speaker: narrator
          text: >-
            His back was turned, and it is very difficult to address a back politely.
        - id: ch01-b119
          speaker: edred
          text: "Hello there!"
        - id: ch01-b120
          speaker: elfrida
          text: "Hello! I say!"
        - id: ch01-b121
          speaker: narrator
          text: >-
            The old man turned and found two small figures in sailor suits standing at his gate. The children saw a deeply wrinkled face, browned by years of sun. His hair was snowy white, and silver-white whiskers ran down both cheeks in the old-fashioned mutton-chop style. Against that weathered skin, his blue eyes looked especially bright and full of fun. His chin and upper lip were clean-shaven, and his mouth held a smile that was kind, though rather tightly closed.
        - id: ch01-b122
          speaker: old_man
          text: "Well now, what do you two want?"
        - id: ch01-b123
          speaker: elfrida
          text: "We wanted to ask—"
        - id: ch01-b124
          speaker: edred
          text: "About the castle. Can we go inside and see it?"
        - id: ch01-b125
          speaker: old_man
          text: "I've got the keys."
        - id: ch01-b126
          speaker: narrator
          text: >-
            He reached through his doorway and took them from a nail.
        - id: ch01-b127
          speaker: elfrida
          text: "I suppose nobody lives there?"
        - id: ch01-b128
          speaker: old_man
          text: >-
            Not now. Lord Arden died two weeks ago last Tuesday. The place stays locked until they find the new lord.
        - id: ch01-b129
          speaker: narrator
          text: >-
            He came back along the garden path, and the children followed him into the lane.
        - id: ch01-b130
          speaker: edred
          text: "I wish I were the new lord."
        - id: ch01-b131
          speaker: old_man
          text: "And how old would you be, young fellow?"
        - id: ch01-b132
          speaker: edred
          text: "Nearly ten. My birthday is tomorrow. How old are you?"
        - id: ch01-b133
          speaker: old_man
          text: >-
            Nearly eighty, and I've seen plenty in my time. If you were the young lord, you'd have a chance none of the others ever had, because of your age.
        - id: ch01-b134
          speaker: edred
          text: "What kind of chance?"
        - id: ch01-b135
          speaker: old_man
          text: >-
            Why, don't you know the old saying? I thought everyone hereabouts knew it.
        - id: ch01-b136
          speaker: edred
          text: "What saying?"
        - id: ch01-b137
          speaker: old_man
          text: >-
            I haven't enough breath to walk and talk together, least of all in poetry.
        - id: ch01-b138
          speaker: narrator
          text: >-
            He stopped, drew a deep breath, and recited.
        - id: ch01-b139
          speaker: old_man
          text: >-
            When Arden's lord still lacketh ten, and may not see his nine again, let Arden stand as Arden may on Arden Knoll at death of day. If he have skill to say the spell, he shall find the treasure, and all be well!
        - id: ch01-b140
          speakers: [edred, elfrida]
          ensemble: duo
          text: "I say!"
          emotion: surprised
        - id: ch01-b141
          speaker: edred
          text: "Where is Arden Knoll?"
        - id: ch01-b142
          speaker: old_man
          text: "Up there."
        - id: ch01-b143
          speaker: narrator
          text: >-
            He pointed to the mound where they had eaten lunch.
        - id: ch01-b144
          speaker: elfrida
          text: "What treasure does the saying mean?"
        - id: ch01-b145
          speaker: narrator
          text: >-
            That question was not answered just then.
        - id: ch01-b146
          speaker: old_man
          text: >-
            If I'm to keep talking, I must sit. Shall we sit here, or inside the castle?
        - id: ch01-b147
          speaker: narrator
          text: >-
            Two different curiosities pulled at the children. The stronger one won.
        - id: ch01-b148
          speakers: [edred, elfrida]
          ensemble: duo
          text: "Inside the castle."
        - id: ch01-b149
          speaker: narrator
          text: >-
            Inside the castle, the old man settled on a pillar that had fallen from one of the chapel arches, and he patiently waited. The children ran up and down the grassy enclosure. They peered into ruined chambers, picked a careful path along the remains of the colonnade, and climbed the steps of the only tower where any steps still survived. When they had seen all they could, they came back and sat beside him on grass so thick with daisies that it looked white.
        - id: ch01-b150
          speakers: [edred, elfrida]
          ensemble: duo
          text: "Now tell us!"
        - id: ch01-b151
          speaker: old_man
          text: >-
            Well then. The Ardens were always great gentlefolk. Folks say Ardens have lived here since before William the Conqueror, whoever he was.
        - id: ch01-b152
          speaker: edred
          text: "That was ten sixty-six."
        - id: ch01-b153
          speaker: narrator
          text: >-
            Edred said it under his breath.
        - id: ch01-b154
          speaker: old_man
          text: >-
            Like everyone else, rich or poor, they had good times and bad. Once, during some war or trouble abroad, a great store of money, jewels, and silver plate was hidden away. That's the treasure in the rhyme. The men who hid it were killed. Those were dangerous days to be alive. Nobody else ever knew the hiding place.
        - id: ch01-b155
          speaker: edred
          text: "Did anyone ever find it?"
        - id: ch01-b156
          speaker: old_man
          text: >-
            Let me finish. In those ancient days there lived a wise woman. The family went to ask how they could find the treasure, and she fell into what you'd now call a historical fit. She never said anything worth hearing unless she was having one. Right there in the fit she made up that saying in poetry, and it was all they could get from her. She refused to tell them the spell.
        - id: ch01-b157
          speaker: old_man
          text: >-
            But when she lay dying, the Lady Arden of that time nursed her with great care. Just before her last breath, the wise woman told Lady Arden the spell.
        - id: ch01-b158
          speaker: narrator
          text: >-
            The old man ran out of breath. The children were even more breathless than he was.
        - id: ch01-b159
          speakers: [edred, elfrida]
          ensemble: duo
          text: "What is the spell?"
        - id: ch01-b160
          speaker: old_man
          text: "Nobody knows."
        - id: ch01-b161
          speaker: edred
          text: "Then where is it?"
        - id: ch01-b162
          speaker: old_man
          text: >-
            Nobody knows that either. I've heard it may be written in a book in the library of the house over there. But that does no good. Every Lord Arden who inherited the title had left ten years far behind him.
        - id: ch01-b163
          speaker: narrator
          text: >-
            A very strange feeling came into Edred's head. His hands grew hot and dry, then cold and damp.
        - id: ch01-b164
          speaker: edred
          text: >-
            Does it have to be Lord Arden? Wouldn't the spell work for an ordinary John Arden, or James Arden, or Edred Arden? My name is Arden, and I'd like to try.
        - id: ch01-b165
          speaker: narrator
          text: >-
            The old man bent down, gripped Edred's arm, and drew the boy between his knees.
        - id: ch01-b166
          speaker: old_man
          text: >-
            Let me look at you, sonny. Aye, you're an Arden, sure enough. Fancy me not seeing it! That long nose and the chin sticking out like a spur should have told me at once. My eyes aren't what they were. If you were Lord Arden— What was your father's Christian name?
        - id: ch01-b167
          speaker: edred
          text: "Edred, like mine. But my father is dead."
        - id: ch01-b168
          speaker: old_man
          text: "And your grandfather? He wasn't George, was he? George William?"
        - id: ch01-b169
          speaker: edred
          text: "Yes, he was. How did you know?"
          emotion: surprised
        - id: ch01-b170
          speaker: narrator
          text: >-
            The old man released him, stood, and touched his forehead.
        - id: ch01-b171
          speaker: old_man
          text: >-
            I've worked this land since I was a boy. I'm proud to have lived long enough to see a new Lord Arden take the place of the one we've lost. Bless me, boy, don't gape like that. You truly are Lord Arden.
        - id: ch01-b172
          speaker: edred
          text: "I—I can't be."
          emotion: surprised
        - id: ch01-b173
          speaker: elfrida
          text: >-
            Auntie said Lord Arden was related to us. He was some sort of great-uncle-cousin.
        - id: ch01-b174
          speaker: old_man
          text: >-
            That's right, miss. The late lord's Christian name was James, and he was your grandfather George's first cousin. George's son was your father Edred. Lord James had no son, nor even a daughter, so the title passes to your side of the family. Snigsworthy, the lawyer's apprentice from Lewes, has explained it more than fifty times in the past three weeks. I'm telling you, boy, you are Lord Arden.
        - id: ch01-b175
          speaker: edred
          text: "If I am, I'll speak the spell and find the treasure."
        - id: ch01-b176
          speaker: elfrida
          text: "Then you must hurry. The day after tomorrow, you'll be older than ten."
        - id: ch01-b177
          speaker: edred
          text: "So I will."
        - id: ch01-b178
          speaker: old_man
          text: >-
            When you're Lord Arden—I mean, when you're grown and can enjoy the title, as God willing you will—remember the poor and needy, young master. Be sure you do that.
        - id: ch01-b179
          speaker: edred
          text: "I will, if I find the treasure."
        - id: ch01-b180
          speaker: old_man
          text: >-
            Do it whether you find treasure or not. I must be getting home. You'd like to play here for a while, wouldn't you? Bring the keys when you're done. I can trust you not to harm your own place after all these centuries in the family.
        - id: ch01-b181
          speaker: edred
          text: "Of course you can! Goodbye, and thank you."
        - id: ch01-b182
          speaker: old_man
          text: "Goodbye, my lord."
        - id: ch01-b183
          speaker: narrator
          text: >-
            The old man went away.
        - id: ch01-b184
          speaker: edred
          text: "I say, Elf. What if I really am Lord Arden?"
        - id: ch01-b185
          speaker: elfrida
          text: >-
            You are, you are! I am completely certain. I suppose that makes me Lady Arden. How perfectly ripping! At least now we can silence those lodgers' children. What's wrong?
        - id: ch01-b186
          speaker: narrator
          text: >-
            Edred frowned and pulled the velvety moss from the large stone where he had absentmindedly sat.
        - id: ch01-b187
          speaker: edred
          text: "Would it be like burglary to enter your own house without permission?"
        - id: ch01-b188
          speaker: elfrida
          text: "Not if it really belongs to you. Of course it wouldn't."
        - id: ch01-b189
          speaker: edred
          text: "But suppose it doesn't belong to me. They might put me in prison."
        - id: ch01-b190
          speaker: elfrida
          text: >-
            You could tell the policeman you believed it was yours. Oh, Edred, let's go in!
        - id: ch01-b191
          speaker: edred
          text: "It isn't vulgar curiosity, as Auntie calls it. I only want the spell."
        - id: ch01-b192
          speaker: elfrida
          text: "As if I didn't know that. But where is the house?"
        - id: ch01-b193
          speaker: narrator
          text: >-
            It was a fair question. Nothing that looked like a house could be seen. There were only the castle's tall gray walls, edged with flowers and grass against the pale blue June sky. Here and there, gray wooden doors almost disappeared into the stone.
        - id: ch01-b194
          speaker: edred
          text: "The house must be behind one of those. We'll try every key in every door."
        - id: ch01-b195
          speaker: narrator
          text: >-
            And that is what they did. The first door opened into an apple loft. Behind another was a cellar where brooms, spades, and picks leaned against the damp wall among baskets and heaps of sacks. A third led to a tower used as a pigeon house.
        - id: ch01-b196
          speaker: narrator
          text: >-
            The very last door they tried opened into a long garden trapped between two high walls. Weeds had already risen tall among the forget-me-nots and pansies. At the far end stood a narrow house with a red roof. It was fitted tightly between two towering gray walls that belonged to the castle itself. Every blind had been pulled down. The garden felt cold and silent, and the air smelled of damp earth and dead leaves.
        - id: ch01-b197
          speaker: elfrida
          text: "Oh, Edred, are you sure we ought to do this?"
          emotion: fearful
        - id: ch01-b198
          speaker: narrator
          text: >-
            She shivered.
        - id: ch01-b199
          speaker: edred
          text: >-
            Yes, I'm sure. You aren't being good, no matter what you think. You're only frightened.
        - id: ch01-b200
          speaker: elfrida
          text: "I'm not frightened. Come on."
        - id: ch01-b201
          speaker: narrator
          text: >-
            Yet they approached very slowly, almost on tiptoe and hardly breathing. The covered windows looked like blind eyes. The front door was locked, and not one key fitted.
        - id: ch01-b202
          speaker: edred
          text: >-
            I don't care. If I am Lord Arden, I have the right to enter. If I'm not, then nothing matters. Here goes.
        - id: ch01-b203
          speaker: narrator
          text: >-
            Elfrida nearly screamed, half in horror and half in admiration. Edred climbed an elder tree beside a small window. The window would not open, so he deliberately drove his elbow through the glass.
        - id: ch01-b204
          speaker: edred
          text: "And so the heir of Arden Castle enters his estate again."
        - id: ch01-b205
          speaker: narrator
          text: >-
            His voice was not quite steady. He opened the window and vanished through it. Elfrida stood outside, clasping and unclasping her hands. She could not stop imagining a very large policeman appearing at the garden door and asking in the deep voice admired in village constables where her brother was.
        - id: ch01-b206
          speaker: narrator
          text: >-
            Luckily, no policeman came. Before long, one blind rose and a French window opened. Edred stood there beckoning like a conspirator. It took courage to follow, but Elfrida went in. He closed the window and lowered the blind once more.
        - id: ch01-b207
          speaker: elfrida
          text: "Oh, let's not do this."
          emotion: fearful
        - id: ch01-b208
          speaker: edred
          text: "Nonsense. There's nothing scary here. These rooms are just like ours at home."
        - id: ch01-b209
          speaker: narrator
          text: >-
            And they were. The children went through the whole house to make sure. Some rooms upstairs were nearly bare, but the furniture was the same old-fashioned sort Aunt Edith owned, and the family portraits looked familiar too. Only the library was different. It was enormous and held no pictures at all. There were books, books, and more books, every one bound in yellowish leather. They filled shelves from floor to ceiling. More shelves stood between the windows and even stretched over the mantelpiece. Hundreds of books were there, perhaps thousands. Faced with them all, even Edred lost heart.
        - id: ch01-b210
          speaker: edred
          text: "This is hopeless. Searching all these books will take years."
        - id: ch01-b211
          speaker: elfrida
          text: "We can at least search a few."
        - id: ch01-b212
          speaker: narrator
          text: >-
            Elfrida was less daring than her brother, but far more persistent. She sat on the worn carpet and began reading the titles on the lowest shelf.
        - id: ch01-b213
          speaker: elfrida
          text: >-
            Burton's Atomy of Melon Something. Locke on Understanding.
        - id: ch01-b214
          speaker: narrator
          text: >-
            She found many more dull and tiring names, but none sounded likely to hide a treasure spell. Burgess on the Precious Metals tempted her for a moment. One look at its tightly printed, brown-speckled pages showed there was no room for anything so interesting.
        - id: ch01-b215
          speaker: narrator
          text: >-
            Time went by. The stripes of sunlight under the blinds moved to a completely different place on the carpet, and Elfrida kept searching. Edred became more and more restless.
        - id: ch01-b216
          speaker: edred
          text: >-
            It's useless. Let's give up. I expect that old fellow was teasing us. I don't feel the way I did about it anymore. Please, let's go home.
        - id: ch01-b217
          speaker: narrator
          text: >-
            Elfrida continued even when her head and back began to ache. I wish I could say her persistence earned the reward, but it did not, and facts are facts. Edred found the book. He was idly drawing one finger along the shelf just to see the soft, mouse-gray dust gathered at the end.
        - id: ch01-b218
          speaker: edred
          text: "What about this one?"
        - id: ch01-b219
          speaker: narrator
          text: >-
            He pulled out a large white volume. Its cover bore a golden shield marked with squares and small spots, and a gold pig stood on top. Along the spine were the words The History of the Ardens of Arden.
        - id: ch01-b220
          speaker: narrator
          text: >-
            In an instant the book lay open between them on the floor. They turned the pages with quick, anxious hands. But it held no spell. It was every bit as disappointing as old Burgess.
        - id: ch01-b221
          speaker: narrator
          text: >-
            At last Edred announced that he had had quite enough and slammed it shut. A paper fluttered free, sailed like a pigeon, and settled on the empty hearth. It was the spell. There could be no doubt.
        - id: ch01-b222
          speaker: narrator
          text: >-
            Faint ink covered a square of yellowed letter paper. It had been folded and unfolded so many times that the crease was worn thin and scarcely held the halves together. The handwriting was fine, pointed, and ladylike. Across the top someone had written, The Spell Aunt Anne Told Me, December twenty-fourth, seventeen ninety-three.
        - id: ch01-b223
          speaker: narrator
          text: "Below that came the spell."
        - id: ch01-b224
          speaker: narrator
          text: >-
            Hear, Oh badge of Arden's house, the spell my little age allows. Arden speaks it without fear. Badge of Arden's house, draw near. Make me brave and kind and wise, and show me where the treasure lies.
        - id: ch01-b225
          speaker: narrator
          text: >-
            A final note said it must be spoken at sunset by a Lord Arden after his ninth birthday and before his tenth. Then it added that the whole thing was foolishness and not to be believed.
        - id: ch01-b226
          speaker: edred
          text: "This is the one. Come on, let's get out."
        - id: ch01-b227
          speaker: narrator
          text: >-
            They turned to leave. Something moved in a corner of the library. It was small, but they could not see what shape it had.
        - id: ch01-b228
          speaker: narrator
          text: >-
            Neither child breathed freely again until they had escaped the house, the garden, and the castle. At last they stood on the broad downs among the wild thyme. Blue sky stretched above them, skylarks sang, and fresh scents of seaweed and bean fields filled the air.
        - id: ch01-b229
          speaker: elfrida
          text: >-
            Oh, I'm so glad the spell doesn't have to be said at midnight. You'd be much too frightened.
        - id: ch01-b230
          speaker: edred
          text: "I would not. I'd say it even at midnight."
        - id: ch01-b231
          speaker: narrator
          text: >-
            Edred was very pale and walking quickly away from the castle. He almost believed his own claim.
        - id: ch01-b232
          speaker: narrator
          text: >-
            When the shape moved, Edred had dropped the paper. Elfrida had picked it up and still held it tightly.
        - id: ch01-b233
          speaker: edred
          text: "It was probably only a rat or something."
        - id: ch01-b234
          speaker: narrator
          text: >-
            His heart was beating nineteen to the dozen, as people say in Kent and elsewhere.
        - id: ch01-b235
          speaker: elfrida
          text: "Oh, yes. I'm certain it was only a rat or something."
        - id: ch01-b236
          speaker: narrator
          text: >-
            Her lips trembled a little.
        - id: ch01-b237
          speaker: narrator
          text: >-
            There was no sign of sunset when they reached the top of Arden Knoll. They had time to steady themselves, listen to the skylarks, smell the bean blossoms, and wonder how they could have been foolish enough to fear a rat or something. Crumbs of cake and pieces of sandwich remained from lunch. They had seemed uninteresting then, but tasted quite different now.
        - id: ch01-b238
          speaker: narrator
          text: >-
            They ate and waited. At last the sun seemed to rest on the brown shoulder of the downs. The hill looked as if it were lifting itself to meet the round red ball that evening mist had made of the sun.
        - id: ch01-b239
          speaker: narrator
          text: >-
            For several minutes, neither child spoke. All four eyes watched the sun. Its lower edge seemed to flatten against the hill.
        - id: ch01-b240
          speaker: elfrida
          text: "Now, Edred!"
        - id: ch01-b241
          speaker: narrator
          text: >-
            She handed Edred the paper. They had read it so often while the light faded that both knew the words by heart. That was fortunate, because the faint ink was nearly invisible on the yellow page in the thick pink light.
        - id: ch01-b242
          speaker: narrator
          text: "Edred stood."
        - id: ch01-b243
          speaker: elfrida
          text: "Now! Say it now."
        - id: ch01-b244
          speaker: narrator
          text: >-
            Edred spoke loudly, using the pleasant singsong voice he used at school for Macaulay's stirring ballads and the story of the boy on the burning deck.
        - id: ch01-b245
          speaker: edred
          text: >-
            Hear, Oh badge of Arden's house, the spell my little age allows. Arden speaks it without fear. Badge of Arden's house, draw near. Make me brave and kind and wise, and show me where the treasure lies.
        - id: ch01-b246
          speaker: narrator
          text: >-
            He spoke slowly and carefully. Elfrida listened closely, ready to correct any mistake. He made none.
        - id: ch01-b247
          speaker: edred
          text: "And show me where the treasure lies."
        - id: ch01-b248
          speaker: narrator
          text: >-
            The great silence of the downs rushed in like a wave to fill the place where his voice had been.
        - id: ch01-b249
          speaker: narrator
          text: >-
            Nothing else happened. A flush of pink sunset spread across the downs. Every thin grass stem stood out sharply in the strange, even light. The skylarks had stopped singing. In the new stillness, the mingled smell of bean flowers and seaweed seemed stronger than ever. The children waited, but still nothing happened at all.
        - id: ch01-b250
          speaker: edred
          text: "What's that?"
          emotion: surprised
        - id: ch01-b251
          speaker: narrator
          text: >-
            Something beside his foot had moved. It did not dart or jump. It shifted gently, quietly, and unmistakably. In the soft pink sunset, it glittered like gold.
        - id: ch01-b252
          speaker: elfrida
          text: "Why, it's—"
          emotion: surprised
