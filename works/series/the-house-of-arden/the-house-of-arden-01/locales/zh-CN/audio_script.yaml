audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 亲切从容，带一点温和的幽默
        timbre: 温暖清亮
        pace: 舒缓而有变化
        pitch: 中等
    edred:
      display_name: 埃德雷德
      tts:
        delivery: 聪明好胜，认真里带着孩子气
        timbre: 清脆明亮的男孩声
        pace: 自然偏快
        pitch: 中高
    elfrida:
      display_name: 埃尔弗丽达
      tts:
        delivery: 直率活泼，敏锐又有主意
        timbre: 清亮的女孩声
        pace: 轻快
        pitch: 高
    aunt_edith:
      display_name: 伊迪丝姑妈
      tts:
        delivery: 温柔能干，疲惫时仍带着幽默
        timbre: 柔和温暖
        pace: 从容
        pitch: 中等
    maid:
      display_name: 女仆
      tts:
        delivery: 一边做事一边自在哼唱
        timbre: 朴实清亮
        pace: 舒展
        pitch: 中高
    old_man:
      display_name: 老人
      tts:
        delivery: 和善健谈，郑重处有旧日庄园人的庄严
        timbre: 苍老厚实
        pace: 缓慢，长句间自然换气
        pitch: 低
  chapters:
    - id: ch01
      title: 阿登领主
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 从前，这里有过一座显赫的府邸，阿登家就在里面生活。他们有自己的庄园和一片片田野，家里存着钱财和珠宝，手下还有佃户、乡绅，以及披着铠甲的武士。阿登家的一家之主曾经骑马赶了整整三天路，一直走到自家领地的边界，去迎接亨利国王。国王接受了他的邀请，跟着他回到城堡，还在客房那张高大的礼仪床上睡过一夜。后来，阿登家的继承人率领部众，亲自与克伦威尔交战。家里的幼子们则远赴异邦，在那里征战，为英格兰争得荣誉，也给古老的阿登姓氏增光。他们一次又一次把荣耀镀在这个姓氏上，不过，那层金箔总是一闪就过去了，从来留不长久。
        - id: ch01-b02
          speaker: narrator
          text: 早在撒克逊时代，阿登家族就已经存在了。过了这么多年，到了我们要讲的这个时候，阿登家的人依然还在，只是所剩无几，而且已经穷困潦倒。属于他们的土地没有了，跟随他们的乡绅和武士也没有了。就连城堡本身也没有了屋顶。一扇扇窗户早已失去玻璃，只剩下空洞洞的窗口，茫然望着已经属于别人的田野。那些田地一直伸展到城堡脚下，紧挨着它那饱经风雨的灰色墙壁。至于阿登家的男子，那时世人知道的总共只剩两位，一个是老人，另一个还是孩子。
        - id: ch01-b03
          speaker: narrator
          text: 老人就是阿登勋爵，也是如今阿登家的一家之主。他孤零零住在一间小屋里，没有别的家人陪伴。砌起小屋的石块，全是从旧城堡上坠落下来的。有些经过许多年风吹雨打，自己从高墙上剥落。有些却是从前打仗时，让克伦威尔的圆炮弹硬生生轰下来的。至于那个孩子，他名叫埃德雷德·阿登，并不住在城堡附近。他的家在悬崖上一座干干净净的小镇里，那里从早到晚都吹着海风。
        - id: ch01-b04
          speaker: narrator
          text: 他住的房子看起来很开朗。屋子有向外凸出的凸肚窗，还有一座绿色阳台，正对着亮闪闪的大海。门前一共三级洁白的台阶，每一级都收拾得整整齐齐。门上的黄铜门环常年有人擦，已经擦得颜色浅淡，表面光滑。这房子很漂亮，本来也应该住得很舒适，要不是里面还有一样东西，那就是房客。事情到了这里，我不能再瞒着你了。埃德雷德·阿登跟姑妈住在一起，而姑妈要靠出租房间来过日子。靠出租房间谋生，是天下最不愉快的营生之一。所以我劝你，除非实在没有办法，不然先把其他一切正当的谋生办法都试一遍，最后再走上这条路。
        - id: ch01-b05
          speaker: narrator
          text: 那些到海边度假、另外租房子住的人，不知道为什么，似乎总比住旅馆的人更难伺候。他们一会儿要人做这件事，一会儿又要人做那件事，要做的事情多得不得了。他们一顿接着一顿地吃，偏偏吃饭的钟点还很古怪。从早到晚，他们几乎一直在摇铃。等他们从海滩回来，衣服的每一道褶子里都夹满了沙。一抖衣服，地毯上有沙，沙发垫上有沙，连屋里的每一件东西上也全都是沙。他们还会把一绺一绺湿淋淋的长海藻挂在刚糊好的墙纸上，不偏不倚，正好遮住墙纸上那些漂亮的玫瑰。至于洗脸盆，里面总盛满海葵和贝壳，好像它根本不是拿来洗脸的。
        - id: ch01-b06
          speaker: narrator
          text: 房客还吵闹得很。不论你的头疼得有多厉害，楼梯上仿佛总有他们的靴子在咚咚作响，一刻也不肯安静。等你终于把账单送到他们手里，不管上面收的钱多么少，他们都会觉得太贵，仿佛你做的那些事根本不值钱。所以，我还得再劝一遍，只要生活还有别的办法，就千万别靠出租房间过日子。可惜，阿登小姐偏偏没有别的办法。要明白这是怎么回事，还得从前面说起。
        - id: ch01-b07
          speaker: narrator
          text: 那时候，埃德雷德和妹妹都还在学校里读书。我有没有提过他还有一个妹妹？他的确有，妹妹名叫埃尔弗丽达。阿登小姐住得离学校很近，所以常常能够见到两个孩子。那阵子，她正在一针一线准备结婚时要穿的衣裳。要娶她的那位先生正在从南美洲回来，因为他已经在那里发了财。孩子们的父亲也在回来的路上，同样带着自己挣下的财产。他和阿登小姐的心上人原本就是生意伙伴，所以两个人会一起回家。
        - id: ch01-b08
          speaker: narrator
          text: 孩子们每次见到姑妈，都要说起快要到来的好日子。等爸爸和吉姆舅舅回来，大家就搬到乡下，从此幸福地生活。他们那时已经管姑妈的心上人叫吉姆舅舅了。
        - id: ch01-b09
          speaker: narrator
          text: 可后来传来的消息完全变了。爸爸和吉姆舅舅在南美洲被强盗捉去了，两个人辛苦挣来的钱也全都丢了。除了悬崖上的那栋房子，一家人什么都没有剩下。阿登小姐只好让孩子们离开伦敦那所昂贵的学校，三个人一起搬进悬崖屋生活。可光有房子还不够，家里没有钱买每天要用的东西。阿登小姐又找不到别的挣钱门路，勇敢的她只好当真开始出租房间。尽管这门营生那么难，她还是把事情做得很好。
        - id: ch01-b10
          speaker: narrator
          text: 接着又有消息来了，说爸爸和吉姆舅舅都死了。那以后，好长一阵子，悬崖屋里生命的光像是全熄灭了。
        - id: ch01-b11
          speaker: narrator
          text: 这是两年前的事。两个孩子却一直没能习惯房客，他们讨厌房客。起初，他们也想跟房客家的孩子交朋友，很快却发现，那些孩子觉得埃德雷德和埃尔弗丽达低人一等，瞧不起他们。况且，房客的孩子常常恰好是那种谁见了都可能瞧不起的孩子。当然，前提是瞧不起任何人也能算对，也能算善良。
        - id: ch01-b12
          speaker: narrator
          text: 比如那位从佩卡姆来的雷金纳德·波茨少爷。你走在海滨大道上，周围明明有那么多人，他还是会站到你面前，伸出舌头，大声喊“出租屋，呸！”他一点也不怕别人听见。等一个孩子做过这样的事以后，你实在很难还像从前那样看待他，更不用说继续把他当朋友。当然，这还是在我们承认瞧不起别人可能是对的、可能是善良的情况下。
        - id: ch01-b13
          speaker: narrator
          text: 悬崖屋里几乎总是住着房客。原因很简单，这栋房子住起来确实舒服，所以来过一次的人以后还会再来。可只要有房客，孩子们和姑妈就不能随便使用自己的家。他们只好住在整栋房子的最顶上和最底下，顶上是阁楼，底下是地下室，中间那些舒适房间全都留给客人。偶尔没有房客时，一家人才会轮流打开所有房间的门，在每个房间里住一住，也让长久关闭的屋子好好透一透气。
        - id: ch01-b14
          speaker: narrator
          text: 在所有这些房间里，孩子们最喜欢的还是地下室那间大客厅。客厅里的每件家具，都曾经属于早已故去的阿登家先人。墙上挂着的一幅幅画像，画的也全是早已故去的阿登家先人。房客所住的那些屋子里，摆着当时流行的新式家具。地下客厅却完全不同，那里有擦得锃亮的老橡木桌，还有同样古老的写字柜。孩子们知道，那里的每一件家具都有自己的来历，也都有一个故事。
        - id: ch01-b15
          speaker: narrator
          text: 埃德雷德和埃尔弗丽达每天都得去上学。他们要学阅读和写字，还要学算术、地理、历史、拼写，以及一门叫作实用知识的功课。兄妹俩对这些功课一视同仁，每一样都讨厌。他们讨厌任何一门的程度，都跟讨厌其他功课一模一样，不多一点，也不少一点。只有家庭作业是个例外，他们反而喜欢。要是伊迪丝姑妈恰好有空，能坐下来帮他们，地理就不再只是地名，会变成一场历险。历史也不再是年代，会像故事书一样好听。就连算术那些数字，也会忽然显出一点道理来。
        - id: ch01-b16
          speaker: edred
          text: 真希望你能天天教我们。费那么大劲去学书上的几个字，实在太傻了。
        - id: ch01-b17
          speaker: narrator
          text: 埃德雷德满手墨水。这还是头一回，他对中国出口的货物有了兴趣。
        - id: ch01-b18
          speaker: aunt_edith
          text: 我也希望能教呀，可我不能一下子做两万九千零十七件事，而且……
        - id: ch01-b19
          speaker: narrator
          text: 一只铃哐啷响了起来。
        - id: ch01-b20
          speaker: aunt_edith
          text: 喝完茶，这已经是第七回了。又有人摇铃。可怜的伊莱莎。没关系，你去应铃吧，不过无论他们说什么，都别顶嘴。顶嘴没用，有时还会害得他们临走时不肯赏你半克朗。
        - id: ch01-b21
          speaker: narrator
          text: 她说着起身进了厨房。
        - id: ch01-b22
          speaker: elfrida
          text: 我最喜欢房客离开的时候。
        - id: ch01-b23
          speaker: aunt_edith
          text: 我也是。马车上的行李堆得摇摇晃晃，马鼻子朝着车站，只要账付清了，那就是天堂里的美景。不过，看到行李运来，我也一样高兴。小鸡崽儿们，等我的船装得满满地回来，咱们就搬到荒岛上去。那里没有马车，咱们的山洞也绝不收房客。
        - id: ch01-b24
          speaker: edred
          text: 等我长大，我就渡海去找你的船，再把它带回来。我开一艘蒸汽拖船，自己掌舵。
        - id: ch01-b25
          speaker: elfrida
          text: 那我来当船长。
        - id: ch01-b26
          speaker: edred
          text: 不行，我才当船长。
        - id: ch01-b27
          speaker: elfrida
          text: 你都掌舵了，就不能再当船长。
        - id: ch01-b28
          speaker: edred
          text: 我就能！
        - id: ch01-b29
          speaker: elfrida
          text: 你不能！
        - id: ch01-b30
          speaker: edred
          text: 我能！
        - id: ch01-b31
          speaker: elfrida
          text: 好吧，你当吧！等你忙着当那个根本当不了的船长，我就在花园里挖出一座金矿。你回来时，伊迪丝姑妈早就富得满地打滚了，谁还稀罕你那艘傻乎乎的旧船。
        - id: ch01-b32
          speaker: aunt_edith
          text: 下一项是拼写。“讨人嫌”三个字怎么写？
        - id: ch01-b33
          speaker: edred
          text: 你问的是我们俩当中的哪一个？
        - id: ch01-b34
          speaker: aunt_edith
          text: 两个都问。
        - id: ch01-b35
          speaker: narrator
          text: 伊迪丝姑妈竭力装出十分严厉的样子。
        - id: ch01-b36
          speaker: narrator
          text: 小时候，人总爱梦想自己的船有一天会满载归来。你会梦见自己突然有了一百镑、一千镑，甚至一百万镑，而且每一个铜板都能由你随心所欲地花。我还记得，自己最爱做的梦是一千镑。梦开始前，还得明明白白定下一条规矩，那就是不准把钱花在任何有用的东西上。等你在梦里有了一百万、一千或一百镑，就会一小时又一小时地快活盘算。你会替每一个自己喜欢的人挑选礼物，还会想象他们收到那些漂亮礼物时的模样。他们看到你竟然如此慷慨，一定会大吃一惊，也一定会欢喜得不得了。
        - id: ch01-b37
          speaker: narrator
          text: 我想，很少有人会把梦里的全部财产只花在自己身上。当然，一开头，我们总会给自己买一辆摩托脚踏车，再买足球和球棒。我们还会买长着真头发的娃娃、一套真正的瓷茶具，还有一大盒什锦巧克力。书也少不了，先买一本《金银岛》，再把尤因夫人写过的每一本书全都买齐。可是，等这些属于自己的东西买完，我们就会开始替别人买了。这个要得到一样礼物，那个人也该得到一样，每一样都选得那么合适。这样的梦真是美丽。
        - id: ch01-b38
          speaker: narrator
          text: 可是，等这个梦真有一天实现，哪怕只实现到一百镑或一千镑，人往往已经长大，也早就忘了当初想拿钱做什么。到了那时，钱反而会全都花在股票、合股投资、适合盖房子的地皮、粗大的雪茄和皮毛大衣上。假如我能重新年轻一回，我一定先坐下来，仔仔细细写一张清单。等我的船满载归来时，我想替别人做的每一件好事，都要写在上面。这样，将来那艘船如果真的回来，我就能先读一遍那张清单，然后照着它去做。可是说到这里……
        - id: ch01-b39
          speaker: narrator
          text: 可客厅的铃已经响了第八回。前门铃也响了，一楼和二楼都在摇铃。伊莱莎想同时去应四只铃，而这种事无论在什么时候都难极了。
        - id: ch01-b40
          speaker: narrator
          text: 前门铃是邮差摇响的，他一共送来了三封信。第一封信是一张账单，要阿登小姐付修理蓄水箱盖子的钱。不久以前，埃德雷德曾在那块盖子上点起一堆火。他当时想，木板另一面就是水，既然挨着水，木板当然烧不起来。这个想法听起来似乎有点道理，可惜完全错误。那块后来变得焦黑的蓄水箱盖子，已经再清楚不过地证明了这一点，现在账单又来证明了一遍。
        - id: ch01-b41
          speaker: narrator
          text: 第二封来信是询问房价的。写信的人问阿登小姐，能不能只收平常一半的钱，接待一位要来海边的牧师。信里给出的理由是，牧师家人口很多，而且就在不久以前，他们一家人刚刚全都出过麻疹。然后就是第三封信。前两封固然也跟悬崖屋有关，可真正重要的是这一封。它正是整个故事的种子，是一切事情的开端，也是支撑故事的脊梁，更是这个故事能够存在的韵脚和理由。
        - id: ch01-b42
          speaker: narrator
          text: 埃德雷德亲手从邮差那里接过三封信。姑妈拆信的时候，他一直站在旁边耐心等着，因为他有收集邮戳的爱好。他很想马上看看，信封上有没有自己还没有的、值钱的邮戳。偏偏门厅里的煤气灯只发出浓稠又昏暗的光，整个地方半明不暗。在这样的光线下，他根本看不清那几枚邮戳，只好等姑妈把信读完。
        - id: ch01-b43
          speaker: narrator
          text: 伊迪丝姑妈读到第三封信时，整个人忽然显得很古怪。她先从头到尾读了一遍，随后抬起手来揉了揉眼睛，像是怀疑自己看错了。她又站起身，拿着信走到枝形吊灯下面，想借着那里的光看得更清楚。可那盏灯早就应该换灯头了，燃着一种看似有光、其实什么也照不亮的火焰。姑妈还是站在那里，又把信读了第二遍。读完以后，她没有放下，反而从头读了第三遍。
        - id: ch01-b44
          speaker: aunt_edith
          text: 啊！
          emotion: surprised
        - id: ch01-b45
          speaker: elfrida
          text: 怎么了，姑妈？又要交税吗？
        - id: ch01-b46
          speaker: narrator
          text: 埃尔弗丽达问得很焦急，因为有一回，发生的事情确实跟交税有关。从那一次以后，她就牢牢记住了这个可怕的词，再也没有忘记。你若是不明白为什么一封谈税的信会让人这样担心，不妨去问问家里最穷的亲戚。说来也怪，他们往往恰好也是亲戚里最讨人喜欢的。要是连他们也说不明白，那就再去问洗衣妇，她多半会知道。
        - id: ch01-b47
          speaker: aunt_edith
          text: 不是，不是税，宝贝儿。恰好相反。
        - id: ch01-b48
          speaker: narrator
          text: 我跟孩子们一样，不知道税的反面究竟是什么。不过我敢肯定，那一定是非常美妙的东西，孩子们也同样肯定。
        - id: ch01-b49
          speakers: [edred, elfrida]
          ensemble: duo
          text: 啊，姑妈，我们真高兴！
          emotion: happy
        - id: ch01-b50
          speaker: narrator
          text: 两个人把这句话说了好几遍，才终于想起要问。
        - id: ch01-b51
          speakers: [edred, elfrida]
          ensemble: duo
          text: 到底是什么事？
        - id: ch01-b52
          speaker: aunt_edith
          text: 我想……我还不敢肯定，不过我想，是一艘船回来了。只是一艘小得不能再小的船，一只玩具船，顶多就那么大。明天一早我得去伦敦，看看它到底是不是真的船，又是怎样的一艘船。布莱克太太会来照看你们。你们会乖得像金子一样，对不对？
        - id: ch01-b53
          speakers: [edred, elfrida]
          ensemble: duo
          text: 会，我们一定会！
        - id: ch01-b54
          speaker: aunt_edith
          text: 不给肉铺伙计设傻瓜陷阱，不穿着睡衣爬上屋顶，不钻进垃圾箱玩红印第安人，也不把房客的床铺成苹果派？
        - id: ch01-b55
          speaker: narrator
          text: 伊迪丝姑妈一口气数出这些小小的娱乐。最近，正是这些新花样让侄儿侄女的空闲时间热闹了不少。
        - id: ch01-b56
          speaker: edred
          text: 不会，我们真的不会。我们还会拼命忍住，不去想任何又新鲜又好玩的事。
        - id: ch01-b57
          speaker: narrator
          text: 埃德雷德添上最后一句，作出了真正的牺牲。
        - id: ch01-b58
          speaker: aunt_edith
          text: 我得赶八点半的火车。真希望能想出个办法，让你们玩得开心一点。
        - id: ch01-b59
          speaker: narrator
          text: 这是她最后想出来的说法。伊迪丝姑妈实在太善良了，所以没有把心里真正那句话说出口。她原本想说的是，希望能找个办法，让两个孩子一整天都闯不了祸。可到了嘴边，她却把这句话换成了让他们玩得开心。两个孩子听见的，自然也只有这一句。
        - id: ch01-b60
          speaker: aunt_edith
          text: 我会给你带一件有趣的生日礼物回来，埃德雷德。你们愿意去亲切的哈蒙德太太家过一天吗？
        - id: ch01-b61
          speaker: edred
          text: 哦，不愿意。我们为什么不能去野餐呢？就小埃尔和我，到丘陵草地上过生日。提前一天也没关系吧？去年夏天你说我们还小，要今年才能去。现在就是今年了，我长高两英寸，小埃尔长高三英寸。加起来，我们比你说不够大的时候高了整整五英寸。
        - id: ch01-b62
          speaker: aunt_edith
          text: 这下知道算术有用了吧。好，你们去。只能穿旧衣服，而且无论什么时候，都要待在能看见大路的地方。对，你们可以放一整天假。现在上床睡觉。哦，铃又响了！可怜的好伊莱莎。
        - id: ch01-b63
          speaker: narrator
          text: 两个孩子穿过一扇包着绿呢的门，那扇门把他们住的地下室和房客所在的楼上隔开。就在这时，正巧有一只从克拉珀姆来的小兽要上楼睡觉。所谓小兽，其实是某位房客家的孩子。他隔着楼梯栏杆，把舌头伸给房东家的两个孩子看，还骂了他们一声“小奴才”。他算好了距离，以为等兄妹俩绕到栏杆尽头，自己早就能逃上楼。可他有一件事没有算到，那就是埃尔弗丽达的胳膊竟然那么长。
        - id: ch01-b64
          speaker: narrator
          text: 埃尔弗丽达猛地把手从栏杆缝里伸过去，一下抓住小兽的一条腿，怎么也不肯松开。她牢牢抓着，直到埃德雷德绕过栏杆尽头赶到。接着，两个男孩扭打着一路上了楼。到了楼梯顶，他们又抱成一团，骨碌骨碌从最高一级一直滚到最底下。最后，两边各自的亲属赶来，把他们从地上捡起来，再把两个人分开。除了这一个小小的插曲，那天晚上上床睡觉时，再也没有发生别的事。
        - id: ch01-b65
          speaker: narrator
          text: 第二天一早，伊迪丝姑妈按计划坐上八点半的火车，往伦敦去了。孩子们也背起平常上学用的书包，可书包里装的东西完全变了。课本被拿出来，换成了一个个小圆面包。练习本也不在里面，原来的位置上放着三明治。至于那个沾满墨水的铅笔盒，更是无影无踪，取代它的是两盒包装华美的薄荷奶油糖。每一盒糖都足足花了一先令。姑妈在车站同他们分别时心绪激动，一时顾不得节省，就不顾一切地买下了它们。
        - id: ch01-b66
          speaker: narrator
          text: 姑妈的火车开走以后，兄妹俩沿着铺红砖的人行道，慢慢朝坡上走去。那条路不知为什么，看上去总像刚刚让人用水冲洗过，红砖又干净又鲜亮。他们一路走到坡顶，忽然同时停了下来。谁也没有立刻开口，只是面对面站着，彼此望着对方。他们两个人心里显然都在想着同一个没有得到明确允许的去处。
        - id: ch01-b67
          speaker: edred
          text: 这可不能算做错事。
        - id: ch01-b68
          speaker: elfrida
          text: 姑妈从来没说过不许我们去。
        - id: ch01-b69
          speaker: edred
          text: 我发现，大人要是对你想做的事说“以后再说”，那件事肯定永远不会发生。
        - id: ch01-b70
          speaker: elfrida
          text: 我也发现了。姑妈总说，以后再谈带我们去那里的事。
        - id: ch01-b71
          speaker: edred
          text: 没错。可我们不能偷偷摸摸，那太卑鄙了。姑妈一回来，我们立刻告诉她。
        - id: ch01-b72
          speaker: narrator
          text: 根本没人说他会偷偷摸摸，可埃德雷德还是坚持讲清楚。
        - id: ch01-b73
          speaker: elfrida
          text: 当然要告诉她。
        - id: ch01-b74
          speaker: narrator
          text: 埃尔弗丽达松了口气，因为她刚才还真不确定哥哥是不是这样打算的。
        - id: ch01-b75
          speaker: edred
          text: 再说，那是我们的城堡，我们本来就该去看看自己家族的摇篮。《悬崖门及其周边》就是这么叫它的。不如把这次出门叫作朝圣吧。书包可以当行囊，再拿你那一便士买两根半便士的手杖。你愿意的话，我们还可以往鞋里塞豌豆。
        - id: ch01-b76
          speaker: narrator
          text: 最后这个建议，他提得十分慷慨。
        - id: ch01-b77
          speaker: elfrida
          text: 那就得回去拿。我觉得，剖成两半的豌豆恐怕不能算，而且塞在鞋里也许会硌疼脚。再说，我那一便士还得留着……
        - id: ch01-b78
          speaker: narrator
          text: 她看见哥哥皱起眉，赶紧停住。
        - id: ch01-b79
          speaker: elfrida
          text: 好吧，给你就是了。不过下次你有一便士，也得分一半给我，这才公平。
        - id: ch01-b80
          speaker: edred
          text: 我平常又不是不公平的人。算了，咱们别当朝圣者了。
        - id: ch01-b81
          speaker: elfrida
          text: 可是我想当。
        - id: ch01-b82
          speaker: edred
          text: 不，我们就这样走。
        - id: ch01-b83
          speaker: narrator
          text: 于是他们谁也不肯改主意，就这样继续往前走。两个人走得一点也不痛快，方才出门时的好心情已经全不见了。渐渐地，镇上的房屋变得稀疏，好像袜子破洞周围越来越薄的织纹。房子与房子之间隔得越来越远，每一栋周围都有一座很大的花园。他们走过其中一座花园时，看见一个女仆正在抖一块小地毯。她一边干活，一边自顾自地唱歌，歌声一直飘到路上。不知道为什么，城里的女仆很少这样自在地唱歌。
        - id: ch01-b84
          speaker: maid
          text: 我对心上人说，祝你好运。我的真心永远不变。就算我们不得不分开，也愿我的好运陪在你身边。
        - id: ch01-b85
          speaker: elfrida
          text: 这对我们是个好兆头。
        - id: ch01-b86
          speaker: edred
          text: 我们又不是她那个傻乎乎的心上人。
        - id: ch01-b87
          speaker: elfrida
          text: 可我们听见她唱了，他又不在这里，根本听不见。前面有路标。我们到底走了多远？我快累死了。
        - id: ch01-b88
          speaker: edred
          text: 你刚才要是当朝圣者就好了。朝圣者不管鞋里塞了多少豌豆，从来都不会累。
        - id: ch01-b89
          speaker: elfrida
          text: 那我现在就当朝圣者。
        - id: ch01-b90
          speaker: edred
          text: 不行，太晚了。我们离卖手杖的店已经有好几英里啦。
        - id: ch01-b91
          speaker: elfrida
          text: 好吧，那我不走了。你今天早上准是从床上脾气坏的那一边下来的。我整个上午都拼命好声好气地回答你，现在再也不试了。就是这样。
        - id: ch01-b92
          speaker: edred
          text: 那你就别试。你乐意的话，自己回家去。你不过是个女孩。
          emotion: angry
        - id: ch01-b93
          speaker: narrator
          text: 埃德雷德气呼呼地说。
        - id: ch01-b94
          speaker: elfrida
          text: 只当一个女孩，也比当你那种东西强。
          emotion: angry
        - id: ch01-b95
          speaker: edred
          text: 那你倒说说看，我是哪种东西？
        - id: ch01-b96
          speaker: narrator
          text: 埃尔弗丽达停下来，紧紧闭上了眼睛。
        - id: ch01-b97
          speaker: elfrida
          text: 别，别，别，别！我不生气，我不生气，我不生气！休战吧，别说了。咱们别这样！
        - id: ch01-b98
          speaker: edred
          text: 别哪样？
        - id: ch01-b99
          speaker: elfrida
          text: 别为一点小事就吵架。我们老是这样，姑妈说，这都成习惯了。男孩要是真比女孩强那么多，想停下来的时候，就应该停得下来。
        - id: ch01-b100
          speaker: narrator
          text: 她睁开眼睛，飞快地往前走。埃德雷德踢着路上厚厚的白尘，也继续向前。
        - id: ch01-b101
          speaker: edred
          text: 可要是男孩根本不想停呢？
        - id: ch01-b102
          speaker: elfrida
          text: 那好吧，我先道歉。这样总行了吧？
        - id: ch01-b103
          speaker: edred
          text: 我本来正想抢在你前面说呢。走吧，路标就在那儿，看看写了什么。
        - id: ch01-b104
          speaker: narrator
          text: 埃德雷德说得满腹委屈，不过说到“走吧”时，又显得大方了一点。
        - id: ch01-b105
          speaker: narrator
          text: 路标上的字写得清清楚楚，态度一本正经，一点也没有跟人开玩笑的意思。它先告诉两个孩子，他们已经走了一又四分之三英里。随后，它又极不友好地宣布，从这里到阿登城堡还有足足八英里。幸好路标上不只有这个坏消息。它还写着，阿登赫斯特车站离这里仅仅四分之一英里。有了这句话，剩下的路忽然又有了办法。
        - id: ch01-b106
          speaker: edred
          text: 我们坐火车去。
        - id: ch01-b107
          speaker: narrator
          text: 埃德雷德说得很有气派。
        - id: ch01-b108
          speaker: elfrida
          text: 可我们没有钱。
          emotion: sad
        - id: ch01-b109
          speaker: narrator
          text: 埃尔弗丽达的声音听起来凄凉极了。
        - id: ch01-b110
          speaker: edred
          text: 哈！这下你看着吧。我花钱可不小气。我带了那枚新的两先令银币。
        - id: ch01-b111
          speaker: elfrida
          text: 哦，埃德雷德，你真高尚。
        - id: ch01-b112
          speaker: edred
          text: 嗐，这算什么。走吧。
        - id: ch01-b113
          speaker: narrator
          text: 男孩又得意又不好意思，两只耳朵都红了。
        - id: ch01-b114
          speaker: narrator
          text: 就这样，两位朝圣者没有步行，而是在火车上第一次望见了阿登城堡。城堡高高雄踞在悬崖上。当初，人们特意把它建在那里，是为了抵挡从外面来的敌人，也为了守护四周的乡野。可是许多岁月过去，昔日的辉煌已经消失，只剩下一道道高大的墙垣。青草和野花沿着石缝攀生，把墙面染出斑斑绿色。还有几座圆塔留在那里，只是里面的楼板与天花板早已坍塌。一间又一间大厅敞着，没有屋顶，猫头鹰把那里当成自己的家。黑莓藤和绿色蕨草也钻进废墟，长得又密又壮。
        - id: ch01-b115
          speaker: narrator
          text: 下了火车以后，孩子们顺着悬崖边的小径，一步步朝城堡走去。头顶的天空颜色淡淡的，云雀却在高处唱得发了狂，歌声不停落下来。路边是一片豆田，蜜蜂在花间忙个不停。豆花送来世上最甜美的香气，那股甜香里又混进褐色海藻的气味。海藻就在悬崖脚下，躺在一块块岩石旁边。潮水不断冲向岸边，它们也跟着海水一下升起，一下落下。
        - id: ch01-b116
          speaker: narrator
          text: 他们登上一座小丘，从那里正好能俯瞰城堡。
        - id: ch01-b117
          speaker: elfrida
          text: 就在这里吃午饭吧。
        - id: ch01-b118
          speaker: narrator
          text: 于是他们就在小丘顶坐下来，把书包里的午饭取出来吃。吃东西还有一条规矩，那就是先吃两口三明治，然后才能吃一口薄荷奶油糖。两个人一口一口嚼着，眼睛始终没有离开下方的城堡。他们看着那些高墙、圆塔和没有屋顶的房间，觉得每一处都好。看得越久，他们就越喜欢这座属于阿登家的废墟。
        - id: ch01-b119
          speaker: elfrida
          text: 你不希望它还是一座真正的城堡，我们就住在里面吗？
        - id: ch01-b120
          speaker: narrator
          text: 这时他们已经吃够了。当然，他们不是吃够了薄荷奶油糖，只是糖全都吃完了。
        - id: ch01-b121
          speaker: edred
          text: 它本来就是真的。剩下来的这些全是真的。
        - id: ch01-b122
          speaker: elfrida
          text: 我知道。我是说，要是它还是一栋房子，有烟囱和壁炉，门上装着门闩，窗户里也有玻璃。
        - id: ch01-b123
          speaker: edred
          text: 不知道我们能不能进去？
        - id: ch01-b124
          speaker: elfrida
          text: 可以爬墙进去呀。
        - id: ch01-b125
          speaker: narrator
          text: 她满怀希望地望着那堵巨墙。墙足有六十英尺高，既没有门，也找不到一个缺口。
        - id: ch01-b126
          speaker: edred
          text: 那边有个老人正穿过田野。不是这一块，是那片特别绿的田。咱们去问问他。
        - id: ch01-b127
          speaker: narrator
          text: 两个人把书包留在丘顶短短的草皮上。那一小片草地里，几乎有一半长的都是野百里香。放好东西，他们立刻走下小丘，想赶在老人走远以前追上他，可到底还是慢了一点。等他们来到田边，老人已经穿过一片颜色青嫩的麦田，又翻过一架架在篱笆上的梯子。他的身影一晃，就消失在一条深深陷下去的乡间小路里。小路两边的树篱长得很高，从上方望去，几乎看不见走在里面的人。
        - id: ch01-b128
          speaker: narrator
          text: 孩子们也翻过梯子，下到小路。追上老人时，他刚咔嗒一声关好自家花园门，转身要沿砖铺的小径往里走。小径两边的花畦里，种着香车叶草、银莲花、水仙，还有各种颜色的郁金香。
        - id: ch01-b129
          speaker: narrator
          text: 老人背对着他们。要彬彬有礼地招呼一个人的后背，实在很难。所以，埃德雷德喊了一声“喂”，埃尔弗丽达则喊了一声“嗨，我说”。这也没什么可奇怪的。
        - id: ch01-b130
          speaker: narrator
          text: 听见喊声，老人终于转过身。他看见自家花园门口站着两个小小的人影，两个人都穿着人们所谓的水手服。孩子们也终于看清了老人。他有一张布满皱纹的老脸，头发已经雪白，两边脸颊上长着银白色的络腮胡。他的脸让太阳晒成了棕色，那双蓝眼睛却又明亮又爱笑。嘴唇周围刮得干干净净，唇边挂着一点笑意。那笑是和善的，却又收得紧紧的，没有一下子全露出来。
        - id: ch01-b131
          speaker: old_man
          text: 好吧，你们想要什么？
        - id: ch01-b132
          speaker: elfrida
          text: 我们想问……
        - id: ch01-b133
          speaker: edred
          text: 想问城堡的事。我们能进去看看吗？
        - id: ch01-b134
          speaker: old_man
          text: 钥匙在我这里。
        - id: ch01-b135
          speaker: narrator
          text: 老人把手从门口伸进去，从一枚钉子上取下钥匙。
        - id: ch01-b136
          speaker: elfrida
          text: 我想，现在已经没人住在那儿了吧？
        - id: ch01-b137
          speaker: old_man
          text: 现在没有。阿登勋爵在两个星期前的星期二去世了。找到新领主以前，那里得一直锁着。
        - id: ch01-b138
          speaker: narrator
          text: 老人沿着花园小径走回来，孩子们跟着他一起沿小路走。
        - id: ch01-b139
          speaker: edred
          text: 真希望我就是那个新领主。
        - id: ch01-b140
          speaker: old_man
          text: 那你今年几岁啦？
        - id: ch01-b141
          speaker: edred
          text: 快十岁了。明天是我的生日。你多大？
        - id: ch01-b142
          speaker: old_man
          text: 我快八十了，这辈子见过不少事。你要是小领主，就会有一个别的领主从没得到过的机会，因为你的年纪正合适。
        - id: ch01-b143
          speaker: edred
          text: 什么机会？
        - id: ch01-b144
          speaker: old_man
          text: 怎么，你们没听过那句老话吗？我还以为这附近人人都知道。
        - id: ch01-b145
          speaker: edred
          text: 什么老话？
        - id: ch01-b146
          speaker: old_man
          text: 我要是说话，就没有力气同时走路，至少念诗的时候不行。
        - id: ch01-b147
          speaker: narrator
          text: 老人停下来，深深吸了一口气。
        - id: ch01-b148
          speaker: old_man
          text: 阿登领主未满十，九岁光阴将逝时，落日阿登丘上立，哪怕阿登只剩此。若会咒语亲口念，宝藏寻得万事吉！
        - id: ch01-b149
          speakers: [edred, elfrida]
          ensemble: duo
          text: 我说！
          emotion: surprised
        - id: ch01-b150
          speaker: edred
          text: 阿登丘在哪里？
        - id: ch01-b151
          speaker: old_man
          text: 就在上头那边。
        - id: ch01-b152
          speaker: narrator
          text: 老人指向他们刚才吃午饭的那座土丘。
        - id: ch01-b153
          speaker: elfrida
          text: 那宝藏是什么？
        - id: ch01-b154
          speaker: narrator
          text: 可这个问题当时没有得到回答。
        - id: ch01-b155
          speaker: old_man
          text: 我要讲话，就得先坐下。咱们坐在这里，还是到城堡里面坐？
        - id: ch01-b156
          speaker: narrator
          text: 两种好奇心打了一架，更强的那一种赢了。
        - id: ch01-b157
          speakers: [edred, elfrida]
          ensemble: duo
          text: 到城堡里面去！
        - id: ch01-b158
          speaker: narrator
          text: 进了城堡，老人先来到礼拜堂，在一根从拱门上倒下来的石柱上坐好，留在那里等他们。两个孩子却没有马上听故事。他们先跑遍长满青草的围院，一间一间朝坍毁的房屋里探头，想看看里面还剩些什么。他们又小心穿过残破的柱廊，免得在碎石上绊倒。后来，他们找到唯一一座还有台阶可以往上爬的塔楼，便沿台阶爬了上去。直到每个能玩的地方都玩够了，两人才回到老人身边，在一片开满白色雏菊的草地上坐下来，催他往下讲。
        - id: ch01-b159
          speakers: [edred, elfrida]
          ensemble: duo
          text: 好啦，现在讲吧！
        - id: ch01-b160
          speaker: old_man
          text: 好吧。阿登家从来都是了不起的大户人家。听说从征服者威廉以前，管他是谁呢，阿登家就一直住在这里。
        - id: ch01-b161
          speaker: edred
          text: 一〇六六年。
        - id: ch01-b162
          speaker: narrator
          text: 埃德雷德悄悄对自己说。
        - id: ch01-b163
          speaker: old_man
          text: 阿登家也和世上的别人一样，不管一个人身份尊贵还是地位卑微，日子里总会有走运的时候，也会有倒霉的时候。有一回，国外打起了仗，也可能是出了别的什么大乱子，谁也说不清了。为了保住家里的东西，人们把一大笔钱藏了起来，同它们一起藏起的，还有珠宝首饰和整套餐桌上用的银器。那句老话里面提到的宝藏，指的正是这些东西。可负责藏东西的人后来全都被杀了。唉，我告诉你们，那些年月里，能平安活着可不容易。从那以后，就再也没人知道宝藏究竟埋在了哪里。
        - id: ch01-b164
          speaker: edred
          text: 后来有人找到过吗？
        - id: ch01-b165
          speaker: old_man
          text: 我不是正在往下讲吗？古时候有一个聪明女人，大家听说她知道许多别人不知道的事，就跑去问她，到底怎样才能找到那批宝藏。问题刚问出口，她立刻发了一种病。那种病要是放到今天，大概会有个名字，叫作“历史病”。这个聪明女人平常不发病的时候，嘴里从来吐不出一句值得人听的话。可一旦病发起来，她说出口的话就不一样了。正是在发病的时候，她把关于阿登领主与宝藏的那句老话编成了诗。
        - id: ch01-b166
          speaker: old_man
          text: 可大家从她那里问出来的，也就只有诗里的这些话。无论别人怎样追问，她都不肯再说半个字，更不肯告诉人们，诗里提到的咒语究竟是什么。一直到她快要去世的时候，事情才有了变化。当时的阿登夫人一心一意照料她，没有因为她古怪就丢下她不管。聪明女人终于被打动了。就在咽下最后一口气以前，她把那个秘密咒语告诉了阿登夫人，只告诉了她一个人。
        - id: ch01-b167
          speaker: narrator
          text: 老人的气不够用了，只好停下来。
        - id: ch01-b168
          speakers: [edred, elfrida]
          ensemble: duo
          text: 咒语是什么？
        - id: ch01-b169
          speaker: narrator
          text: 两个孩子问得比老人喘得还厉害。
        - id: ch01-b170
          speaker: old_man
          text: 谁也不知道。
        - id: ch01-b171
          speaker: edred
          text: 可咒语在哪里？
        - id: ch01-b172
          speaker: old_man
          text: 这也没人知道。不过我听说，咒语就在那边屋里，写在书房的一本书中。可找到也没用，因为从来没有哪位阿登勋爵继承爵位时，还没把十岁远远丢在身后。
        - id: ch01-b173
          speaker: narrator
          text: 埃德雷德脑袋里的感觉古怪得无法形容。他的手先变得又热又干，接着又变得又冷又湿。
        - id: ch01-b174
          speaker: edred
          text: 一定非得是阿登勋爵吗？要是只叫约翰·阿登、詹姆斯·阿登，或者埃德雷德·阿登，却没有爵位，就不行吗？因为我也姓阿登，我想试试看。
        - id: ch01-b175
          speaker: narrator
          text: 听完这句话，老人忽然弯下腰。他伸出一只手，一把抓住埃德雷德的胳膊，把男孩拉到自己跟前。接着，他让埃德雷德站在自己的两膝中间，好让那张年轻的脸离自己更近一些，也好借着白天的光，把男孩从头到脸仔细看个明白。
        - id: ch01-b176
          speaker: old_man
          text: 让我看看你，小家伙。
        - id: ch01-b177
          speaker: narrator
          text: 老人仔细端详了他一番。
        - id: ch01-b178
          speaker: old_man
          text: 对，你准是阿登家的人。真想不到，我竟然没认出来。看看这只长鼻子，还有这马刺似的尖下巴，我早就该认出来才对。只是我的眼睛不如从前了。要是你真是阿登勋爵，你父亲叫什么？我是问他的教名。
        - id: ch01-b179
          speaker: edred
          text: 他叫埃德雷德，跟我一样。不过爸爸已经死了。
        - id: ch01-b180
          speaker: narrator
          text: 埃德雷德说得很郑重。
        - id: ch01-b181
          speaker: old_man
          text: 那你祖父呢？他不会叫乔治吧？乔治·威廉？
        - id: ch01-b182
          speaker: edred
          text: 没错。你怎么会知道？
        - id: ch01-b183
          speaker: narrator
          text: 听见乔治·威廉这个名字，老人终于把埃德雷德的胳膊松开了。他不再坐在倒下的石柱上，而是慢慢站起身来。等站稳以后，他面对这个还不到十岁的男孩，抬起一只手，郑重地碰了碰自己的额头。
        - id: ch01-b184
          speaker: old_man
          text: 我从年轻小伙子的时候起，就在这片土地上干活。如今还能活着，亲眼看见又一位阿登勋爵接替去世的老爷，我真是骄傲。
        - id: ch01-b185
          speaker: old_man
          text: 老天在上，孩子，别张着嘴发呆了。你就是阿登勋爵，一点也不错。
        - id: ch01-b186
          speaker: narrator
          text: 老人忽然严厉起来。
        - id: ch01-b187
          speaker: edred
          text: 我……我不可能是。
          emotion: surprised
        - id: ch01-b188
          speaker: narrator
          text: 埃德雷德喘着气说。
        - id: ch01-b189
          speaker: elfrida
          text: 姑妈说，阿登勋爵是我们的亲戚，好像是远房舅公，又好像是表亲。
        - id: ch01-b190
          speaker: old_man
          text: 那就对了，小小姐。阿登勋爵的教名是詹姆斯，他是乔治先生的嫡亲表兄，也就是你们祖父的表兄。乔治先生的儿子埃德雷德先生，正是你们的父亲。去世的老爷没有儿子，连女儿也没有，所以爵位就传到了你们这一支。
        - id: ch01-b191
          speaker: old_man
          text: 刘易斯来的律师学徒斯尼格斯沃西，这三个星期已经把这件事讲过五十多遍了。我告诉你，你就是阿登勋爵。
        - id: ch01-b192
          speaker: edred
          text: 如果真是这样，我就去念咒语，把宝藏找出来。
        - id: ch01-b193
          speaker: elfrida
          text: 那你可得快一点。后天你就满十岁了。
        - id: ch01-b194
          speaker: edred
          text: 是啊。
        - id: ch01-b195
          speaker: old_man
          text: 等你做了阿登勋爵，我是说，等你长大成人，能够享有爵位的时候，愿上帝保佑你活到那一天。小主人，你一定要记得那些穷苦无依的人。这才是你该做的事。
        - id: ch01-b196
          speaker: edred
          text: 要是我找到了宝藏，我会记得的。
        - id: ch01-b197
          speaker: old_man
          text: 不管找不找得到，你都得这样做。现在我该回家了。你们还想留在这里玩一会儿，是不是？好，玩够了以后，把钥匙送还给我。我信得过你们，你们不会弄坏自己的地方。几百年来，这里一直属于你们家。
        - id: ch01-b198
          speaker: edred
          text: 那还用说！再见，谢谢你。
        - id: ch01-b199
          speaker: old_man
          text: 再见，我的领主。
        - id: ch01-b200
          speaker: narrator
          text: 老人说完就走了。埃德雷德手里握着那一大串钥匙。
        - id: ch01-b201
          speaker: edred
          text: 我说，要是我真是阿登勋爵！
        - id: ch01-b202
          speaker: elfrida
          text: 你就是，你就是！我完全肯定。那我大概就是阿登小姐了。真是太好了！这下我们总能叫房客家的孩子闭嘴了。咦，你怎么了？
          emotion: happy
        - id: ch01-b203
          speaker: narrator
          text: 可埃德雷德没有像妹妹一样欢呼。他坐在那里皱起眉头，心里显然在想另一件事。他刚才无意间坐在一块大石头上，这时低头看着石面，伸手一点一点扯下上面的苔藓。那层苔藓又厚又软，摸起来像绿色的天鹅绒，可他根本没有心思欣赏。
        - id: ch01-b204
          speaker: edred
          text: 没有得到允许，就进自己的房子。你觉得这像不像做贼？
        - id: ch01-b205
          speaker: narrator
          text: 他慢慢地说。
        - id: ch01-b206
          speaker: elfrida
          text: 如果那真是你的房子，当然不算。
        - id: ch01-b207
          speaker: edred
          text: 可万一不是呢？人家说不定会把你关进监狱。
        - id: ch01-b208
          speaker: elfrida
          text: 你可以告诉警察，你以为那是你的。我说，埃德雷德，咱们进去吧！
