cover_prompt: |-
  A wordless cover scene on a thyme-covered knoll outside a ruined English castle in the early twentieth century shows a brother and sister seeing a small golden, pig-like animal appear at their feet at sunset. The boy is almost ten and his sister is twelve, and both wear the matching sailor costumes described in the story. The children stand perfectly still with wonder while the restless little creature turns its nose from side to side in the pink evening light. Behind them, roofless grey castle walls and blank unglazed windows rise above fields stretching to the weather-worn stone, while distant downs suggest the nearby sea. Use a child-height three-quarter view with the golden creature as the bright lower-center focus, the children leaning toward it, the castle framing one side, and broad calm sunset sky across the top. Keep the period clothing, landscape, masonry, and expressions natural, original, child-friendly, and independent of any screen adaptation. No readable text, letters, numbers, labels, logos, captions, speech bubbles, signatures, or watermarks.
