audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 亲切从容，带一点温和的幽默
        timbre: 温暖清亮
        pace: 舒缓而有变化
        pitch: 中等
    edred:
      display_name: 埃德雷德
      tts:
        delivery: 聪明好胜，认真里带着孩子气
        timbre: 清脆明亮的男孩声
        pace: 自然偏快
        pitch: 中高
    elfrida:
      display_name: 埃尔弗丽达
      tts:
        delivery: 直率活泼，敏锐又有主意
        timbre: 清亮的女孩声
        pace: 轻快
        pitch: 高
    nurse:
      display_name: 老乳母
      tts:
        delivery: 急躁严厉，训斥中仍有照料孩子的熟稔
        timbre: 粗哑结实的老妇人声
        pace: 明快
        pitch: 中低
    lady_arden:
      display_name: 阿登夫人
      tts:
        delivery: 庄重慈爱，措辞优雅
        timbre: 柔和丰润
        pace: 从容
        pitch: 中等
    richard:
      display_name: 理查德表哥
      tts:
        delivery: 快活爽朗，勇敢而直率
        timbre: 明亮的男孩声
        pace: 轻快
        pitch: 中高
    tutor:
      display_name: 帕拉多斯先生
      tts:
        delivery: 阴沉克制，追问时咄咄逼人
        timbre: 干冷尖刻
        pace: 缓慢而紧逼
        pitch: 中低
    lord_arden:
      display_name: 阿登勋爵
      tts:
        delivery: 镇定威严，对家人温和可靠
        timbre: 深沉浑厚
        pace: 沉稳
        pitch: 低
  chapters:
    - id: ch01
      title: 第八章　盖伊·福克斯
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 因为那场争吵，魔法整整停了三天。不过，只要阳光明亮，又正好赶上假期，眼前还有一座巨大的古堡废墟等着探索，日子总会过得飞快。何况这座城堡还属于你，或者属于你的弟弟。
        - id: ch01-b02
          speaker: elfrida
          text: 说到底，就算白鼹鼠精一点魔法也不用，我们说不定照样能找到宝藏。咱们好好搜，别漏掉一块石头。
        - id: ch01-b03
          speaker: edred
          text: 你看看头顶这座主堡。这里的石头多得很，恐怕我们非漏掉一些不可。
        - id: ch01-b04
          speaker: elfrida
          text: 你明明知道我是什么意思。走吧！
        - id: ch01-b05
          speaker: narrator
          text: 两人沿着陡峭磨损的楼梯往上爬。黑暗里，楼梯一圈又一圈地盘旋，台阶上散着枯叶、霉土、掉落的羽毛，还有猫头鹰和寒鸦遗弃的干巢。忽然，楼梯到了明亮的日光里，最后一级又高又陡。再跨一步，他们就站上了爬满常春藤的宽墙顶。
        - id: ch01-b06
          speaker: narrator
          text: 从那里望下去，可以一直往下看，再往下看。视线越过墙上从前架设粗大横梁的孔洞，越过被早已熄灭的炉火熏黑的旧壁炉，也越过一排排门窗。门窗后面的房间早已没有地板。再一直看到塔楼最底下，羊齿草、青草和荆棘正在那里绿油油地生长。四周还有拱门，通往一排排低矮又结实的柱廊。墙上的窗子窄窄的，更有一些出人意料的奇妙小屋和角落。天底下再没有比这里更适合认真又起劲地玩捉迷藏的地方了。
        - id: ch01-b07
          speaker: narrator
          text: 一场惊险的“我看见”游戏过后，两个人跑得满脸通红，喘着气坐下来休息。
        - id: ch01-b08
          speaker: elfrida
          text: 要是能把所有破损的地方都修好，又一点儿也看不出哪里是新补的，那该多美呀。要是整座城堡能恢复到刚造好时的样子，就更好了。
        - id: ch01-b09
          speaker: edred
          text: 城堡刚造好时，还没有现在这座宅子。我想，那时也不会有一间堆满箱子的阁楼。
        - id: ch01-b10
          speaker: elfrida
          text: 当然不会，至少不会有现在这些箱子。箱子里有些衣服，比城堡晚了好多年才做出来。大人不是能从一件破东西看出它原来的样子吗？骨头就行，乳齿象什么的都能看出来。我听说，他们只找到赫拉克勒斯的一只脚，就知道他原来长什么样。
        - id: ch01-b11
          speaker: narrator
          text: 最后一句，她说得有点含糊。
        - id: ch01-b12
          speaker: edred
          text: 我有主意了。我们可以回到城堡完好得像模型一样的时候，把每个地方都画下来。等找到宝藏，就会确切知道该照什么样子重建了。
        - id: ch01-b13
          speaker: elfrida
          text: 是啊，确实会。可是，我们不是得先学会画画吗？
        - id: ch01-b14
          speaker: edred
          text: 当然。只要认真学，也花不了多久。我在学校从来没认真过，因为我不喜欢画画。可我知道，画画很容易。伯斯勒姆每回都拿绘画奖，你也知道他有多笨。咱们现在就学，好不好？
        - id: ch01-b15
          speaker: narrator
          text: 埃尔弗丽达走到城堡院子中央，在一块倒下的石头上坐下来。她看看那些复杂又奇妙的拱门和柱子，看看塔楼顶上雉堞交错的城垛，又看看那几面结实得堂堂正正的高墙，忍不住叹了一口气。
        - id: ch01-b16
          speaker: elfrida
          text: 好吧，那就现在开始。
        - id: ch01-b17
          speaker: edred
          text: 那你得借我一支铅笔。上次钥匙在你口袋里，我拿自己的铅笔撬起居室的门，把它折得粉碎。那支本来还挺长呢。埃尔芙，借我一支长的吧。小笔头缩在手心里，另一头还扎人，我可没法用它画。
        - id: ch01-b18
          speaker: elfrida
          text: 可以借你，只要你别把它放进嘴里。
        - id: ch01-b19
          speaker: narrator
          text: 他们拿来大张信纸，又拿来一本棕色小牛皮封面的书垫在下面，把纸铺得平平整整，开始画阿登城堡。埃尔弗丽达不只想画眼睛看得到的东西，还想把她知道存在的一切全都画进去。没过多久，她的画就几乎被铅笔涂得一片乌黑了。
        - id: ch01-b20
          speaker: narrator
          text: 两人没有橡皮，画错了也只能让错处留在纸上。刚学画的人总会画错许多，对不对？我敢保证，谁也看不出埃尔弗丽达纸上那团黑灰相间的乱线原来是一座城堡。埃德雷德的画倒容易认，根本不用等他在下面用又大又歪的字写上“阿登城堡”。他一次也没抬头看眼前的废墟，只管画自己心里那座城堡正面从外面看去的样子。他还非常专心地吮着铅笔，当然，是埃尔弗丽达的铅笔，所以画出来的线条黑得格外醒目。
        - id: ch01-b21
          speaker: edred
          text: 瞧，我画得比你像多了。
        - id: ch01-b22
          speaker: elfrida
          text: 是啊，可我画进去的东西更多。
        - id: ch01-b23
          speaker: edred
          text: 东西再多，别人看不出你画的是什么，也没有用。我这幅就不一样。塔楼、大门、窗户，还有顶上弯弯曲曲、凹进去又凸出来的地方，全看得见。
        - id: ch01-b24
          speaker: elfrida
          text: 是啊，可是……算了，我们做点别的吧。我看，在找到宝藏以前，我们谁也来不及把画学好，更别说照着图重建城堡了。也许我们会在过去遇到一位真正的画家，就像昨天画城堡的那个人。可以请他画好，再把画带回来，然后……
        - id: ch01-b25
          speaker: narrator
          text: 埃德雷德突然大叫一声，猛地跳起来。他的杰作、小牛皮书和铅笔全掉到了地上。
        - id: ch01-b26
          speaker: edred
          text: 我知道了！布朗尼照相机！
        - id: ch01-b27
          speaker: elfrida
          text: 布朗尼照相机？
        - id: ch01-b28
          speaker: edred
          text: 对，把它也带去。这样就能拍下完整的城堡了。
        - id: ch01-b29
          speaker: elfrida
          text: 可我们带不过去呀。
        - id: ch01-b30
          speaker: edred
          text: 谁说带不过去？你知道的也就这么多。头一回去的时候，我鞋里有一小块灰泥。到了那边，它还在。后来学“狗儿的欢乐”时，我把它掏出来弹到窗外。可等我们回来换好衣服，那块灰泥又回到我鞋里了。既然灰泥带得过去，照片也能带过去，我是说，照相机也能。
        - id: ch01-b31
          speaker: narrator
          text: 这套严密又聪明的推理让埃尔弗丽达十分佩服。她真希望这个主意是自己想出来的，可她鞋里偏偏没有灰泥。
        - id: ch01-b32
          speaker: elfrida
          text: 你现在变得挺聪明了，是不是？
        - id: ch01-b33
          speaker: edred
          text: 哈，你恨不得是自己想到的，对吧？我有时也会跟你一样聪明。
        - id: ch01-b34
          speaker: narrator
          text: 心思被人看穿，实在很恼人。埃尔弗丽达立刻回了一句，说他才不会经常聪明。话刚出口，她就猛地停住了。两个孩子神色古怪地对望片刻，接着一起松了口气。
        - id: ch01-b35
          speaker: edred
          text: 挡住了！
        - id: ch01-b36
          speaker: elfrida
          text: 正好来得及！这不算吵架，谁也不能说这算。走吧，我们照女巫说的，去看看那些茅屋。
        - id: ch01-b37
          speaker: narrator
          text: 他们果然去了。这一天、第二天、第三天，两人把附近的茅屋挨家挨户看了一遍，也见到了成年调查员绝对见不到的事。穷人对孩子往往十分友善亲切。他们愿意让孩子进屋，陪孩子说话，把家里的种种情形一一指给他们看，对孩子那些成年的亲戚却绝不会这样。当然，来的得是一个真正讨人喜欢、待人尊重又友好的孩子才行。
        - id: ch01-b38
          speaker: narrator
          text: 没多久，埃德雷德和埃尔弗丽达对阿登四周的茅屋，已经比任何大人花上一年调查知道得还多。他们知道各家的男主人挣多少工钱，晚饭吃什么，更常见的是根本没什么可吃。他们也知道每家有多少孩子还活着，又有多少没能活下来。天气不好时，雨从腐烂的茅草顶哪一处漏进来，冷风从哪几块没接严的地板直灌进屋，他们都一清二楚。有的门关不上，有的门打不开，卧室的窗户十有八九根本没做成能打开的样子。
        - id: ch01-b39
          speaker: narrator
          text: 不去茅屋，也不在城堡探险时，他们又找到一种快活的消遣，轮流大声朗读《阿登家史》。埃尔弗丽达仔细找过，想看看书里有没有提到爱德华·塔尔博特爵士假扮圣乔治骑士的事，可一个字也没找到。不过，书中确实有一位爱德华·塔尔博特爵士。他曾经和当时的阿登勋爵一起受过指控，说他们密谋反对至为虔敬的詹姆斯一世国王。
        - id: ch01-b40
          speaker: elfrida
          text: 不知道他是不是我见过的那个爱德华·塔尔博特？我还想见见他，告诉他，我们出生时，他已经死去好多年了。不过这很难解释，对不对？咱们翻翻格林的历史书，看看至为虔敬的詹姆斯一世那时候，人们都穿成什么样。
        - id: ch01-b41
          speaker: narrator
          text: 也许就是这句话，让两个孩子在三日期满后，挑了最像格林历史书里詹姆斯一世时代的衣服。埃德雷德穿上鼓得像气球的宽大马裤，戴一顶尖顶高帽，身上是深红天鹅绒短上衣，小小的脖子上还套着一圈浆得硬邦邦的大皱领。那东西比连续穿了好多天法兰绒衣服以后，再套上一只伊顿式硬领还要难受。埃尔弗丽达束紧长长的紧身胸衣，前襟插着一大片扁木板，极其宽大的长裙撑在一只陡然向外张开的裙架上。
        - id: ch01-b42
          speaker: narrator
          text: 三天一过，阁楼的门重新出现了。每次吵架以后，这扇门都会变得完全看不见，怎么找也找不到。现在，它却清楚得像你认识的那个相貌最平常的人脸上的鼻子。孩子们走进去，一只只翻看箱子，直到找到想要的衣服。两人换好皱领和其余全套衣裳时，鸽子的咕咕声一直轻轻陪着他们，或者说，那声音仿佛总在帮忙。
        - id: ch01-b43
          speaker: narrator
          text: 换衣服时，埃尔弗丽达始终用这只手或那只手紧紧抓住布朗尼照相机。穿戴因此变得又慢又难，可他们早就商量好了，非这样不可。不然，照埃德雷德的话说，照相机很可能消失，正像一切属于他们自己时代的东西那样，只有穿在身上的衣服除外。至于他们的衣服为什么不会消失，我现在没法解释，那可说来话长。不过，这全是白羽毛魔法的一部分。而白羽毛，你知道，正是白鸽的衣裳。
        - id: ch01-b44
          speaker: narrator
          text: 埃德雷德刚穿好第二只鞋，这也是两人合力装扮的最后一道工序，墙壁突然颤抖起来。它摇摇晃晃地歪向一边，像纸牌搭成的房子即将倒塌。地板斜得越来越厉害，站起来越来越难，到最后根本站不住。椽木全都歪斜交错，活像一盒火柴撒在地上。露出一道道蓝天的瓦顶转得像陀螺，谁也分不出哪边朝上。
        - id: ch01-b45
          speaker: narrator
          text: 这一切来得可怕又突然，却几乎刚刚开始，就像一台出了故障的发条机车一样猛然卡住。阁楼不见了，箱子不见了，透着蓝光的屋瓦、墙壁和椽木也全不见了。房间缩小了一半还多，却变得更高。这里已经不是阁楼，而是一间有窄窗的圆屋。壁炉上罩着石头烟罩，正和他们从塔顶向下见过的那些壁炉一样。你一定听人说过，有些事情会叫人惊得喘不过气。这场突变真的夺走了两个孩子的呼吸。好一会儿，他们只能彼此瞪着。埃尔弗丽达后来还说，他们当时活像两张盖伊·福克斯面具。
        - id: ch01-b46
          speaker: edred
          text: 我明白了。塔楼坍塌以后，阁楼就在这个地方。
        - id: ch01-b47
          speaker: elfrida
          text: 可阁楼其实不存在。我们一吵架就找不到它，霍尼塞特太太也从来找不到。它根本不在任何地方。
        - id: ch01-b48
          speaker: edred
          text: 它当然在。要是它不在，我们怎么可能找不到它？
        - id: ch01-b49
          speaker: elfrida
          text: 好吧，我只希望以后还能找得到它。我们出去吧，留在这间讨厌的小屋里也没用。
        - id: ch01-b50
          speaker: narrator
          text: 她伸手去摆弄那个形状完全陌生的铁门闩，另一件更让人不安的事又发生了。它甚至比刚才那场使阁楼和箱子消失的翻转更叫人难受，而且很难形容。你坐火车时要是不喜欢背对着车头，就知道那种头疼、后颈发怪、脸色发白的滋味。同行的大人会追问你怎么了，有时还会冷酷地断定，你难受是因为在换乘站吃了小圆面包，或是临别时吃了弗雷德叔叔或伊莫金姑妈塞给你的巧克力夹心糖。最糟的是，你会觉得自己的心脏、肺，连同背心的前襟，都在慢慢穿过脊梁骨，被坚定地拖到很远很远的地方。
        - id: ch01-b51
          speaker: narrator
          text: 此刻攫住两个孩子的，正是那种难受，而且猛烈得让他们紧紧闭上双眼。旋转、头疼、后颈的怪劲儿，还有背心被抽走的感觉，又像出现时那样突然，转眼全部停了。他们睁开眼，发现自己已经站在另一间屋里。至少埃德雷德从没见过这里，埃尔弗丽达却觉得又陌生又熟悉。她认得房间的形状、门窗的位置和壁炉架上奇异的雕花，也认得几件家具。屋里只是空荡荡的，比它本该有的样子空得多。可她要是从没来过，又怎么知道它本来不该这么空呢？除非，她其实来过这里。
        - id: ch01-b52
          speaker: elfrida
          text: 啊，我知道了！这里是阿登勋爵在城里的宅邸。我跟贝特表姐来过。那时有更漂亮的椅子，还有别的东西，屋里也挤满了人。
        - id: ch01-b53
          speaker: narrator
          text: 埃德雷德一句话也说不出来。他半张着嘴，半闭着眼，惊愕得像中了迷魂。这场冒险跟他上回参加的那次太不一样。上一次，他只是到了拿破仑时代的阿登城堡宅邸，而且不过沿着一段熟悉的楼梯走下去。这一次，那股猛烈又难受的力量不但把他从自己的时代送到久远的过去，还把他从熟悉的阿登城堡送到了从没见过的伦敦宅邸。于是他一直沉默。等他终于开口，口气已经不只是抱怨，简直快变成厌恶了。
        - id: ch01-b54
          speaker: edred
          text: 我不喜欢这里。我们回去吧。照片也没拍成，衣服又讨厌。我觉得自己像气球和蓝制服慈善学校的男生合到了一起。你也傻得很，像诺亚方舟玩具里的诺亚太太，只是胖乎乎的。我们连自己该是谁都不知道。我也不信这里真是阿登宅邸。就算是，你也不知道现在是哪一年。万一赶上宗教裁判所，他们把我们绑到火刑柱上呢？回去吧，我不喜欢。
        - id: ch01-b55
          speaker: elfrida
          text: 现在你只管听。我心里明白，可你要是不肯好好听，就永远不会懂。
        - id: ch01-b56
          speaker: edred
          text: 说吧。
        - id: ch01-b57
          speaker: elfrida
          text: 就算真是宗教裁判所的时代，我们两个也不会有事。
        - id: ch01-b58
          speaker: edred
          text: 你怎么知道？
        - id: ch01-b59
          speaker: elfrida
          text: 我不知道自己怎么知道，可我就是知道。你看，我以前来过这里。这里不是真的。
        - id: ch01-b60
          speaker: edred
          text: 明明是真的。
        - id: ch01-b61
          speaker: narrator
          text: 他还踢了踢桌腿。
        - id: ch01-b62
          speaker: elfrida
          text: 对，当然是真的，可是你听我说。还记得伯爵宫的水上滑道吗？你那次吓坏了。
        - id: ch01-b63
          speaker: edred
          text: 我才没有。
        - id: ch01-b64
          speaker: elfrida
          text: 你明明有。我自己也不喜欢，刚坐上去时还后悔了。可滑道一开动，我们就知道非坐到底不可。那时可怕极了，结束以后，我们却还想再坐，也真的坐了。现在想起来多快活呀。这里就和那件事一样。懂了吗？
        - id: ch01-b65
          speaker: edred
          text: 不懂。你说的我一个字也听不明白。这里跟水上滑道一点也不像，难道不是吗？
        - id: ch01-b66
          speaker: narrator
          text: 埃尔弗丽达皱起了眉。后来她很庆幸，自己只是皱眉，没有吵起来。船上吵架已经很危险，在一个不属于自己的世纪里吵架，就更危险了。她刚张开嘴，房门也像学她似的张开了。一个矮小黝黑、满脸不耐烦的女人匆匆进来。她穿着棕裙子，戴着一顶怪帽子。
        - id: ch01-b67
          speaker: nurse
          text: 原来你们躲在这里！我上上下下找了半天，就为了给你们换衣裳。
        - id: ch01-b68
          speaker: edred
          text: 为什么？
        - id: ch01-b69
          speaker: narrator
          text: 女人毫不温柔地抓住他的胳膊，把他拖出房间，又拖下楼梯。
        - id: ch01-b70
          speaker: nurse
          text: 还问为什么？当然是陪你父亲大人和母亲大人去白厅看假面舞会。你不是一直盼着去吗？这样就能穿那套绣着橙褐色花纹的新白天鹅绒衣裳，扣上你母亲大人的钻石搭扣，披丝斗篷，戴鞋花和蛛网细麻布做的硬皱领，再佩一把小宝剑，样样齐全。
        - id: ch01-b71
          speaker: narrator
          text: 埃尔弗丽达一路跟在后面，心想这个女人最刺人的地方，大概只是说话的口气。她要是真的那么讨厌，就不会拿天鹅绒衣裳、宝剑和钻石搭扣来哄埃德雷德开心了。
        - id: ch01-b72
          speaker: elfrida
          text: 那我不能去吗？
        - id: ch01-b73
          speaker: narrator
          text: 女人回过身来，啪地打了她一下。这一下打得不重，却十分干脆。
        - id: ch01-b74
          speaker: nurse
          text: 早就告诉过你，再管不住那张纠缠不休的嘴，就会挨这一下。不行，你不能去。小淑女要留在家里绣花样。别急，你进宫廷的日子很快就会来的。
        - id: ch01-b75
          speaker: narrator
          text: 埃尔弗丽达坐在旁边，看着埃德雷德被草草洗了一遍。肥皂照样钻进他的眼睛，和今天钻进你眼睛时没有两样。接着，他换上漂亮的白色侍童服。白天鹅绒、钻石搭扣和小宝剑，一件也不少。
        - id: ch01-b76
          speaker: elfrida
          text: 你真神气。啊，我真希望自己是个男孩！
        - id: ch01-b77
          speaker: narrator
          text: 这句话，在埃尔弗丽达短短的一生里，大概已经说过两千零三十二次了。
        - id: ch01-b78
          speaker: nurse
          text: 等轮到你进宫，就不会这么想了。好了，我的小少爷，亲亲你的老乳母。站仔细些，规规矩矩的，别弄脏这身漂亮羽毛。听到你母亲的长裙在楼梯上沙沙响，就出去，照家庭教师教的那样行礼。
        - id: ch01-b79
          speaker: narrator
          text: 教埃德雷德行礼的其实不是他的家庭教师。可楼梯上传来绸裙的窸窣声时，他还是走了出去，对着那位庄严华贵、一路飘然而来的夫人，行了一个很像样的大礼。埃尔弗丽达觉得，自己最好也站到弟弟身边屈膝行礼。伊迪丝姑妈教过他们跳小步舞，不知怎么，那支舞里的鞠躬和屈膝礼现在恰好用得上。
        - id: ch01-b80
          speaker: narrator
          text: 楼梯上的夫人满意地笑了。她的衣饰华美得惊人。上身是一件刺绣繁丽的黄缎紧身衣，下身穿着带条纹的金丝裙，外面还披着红天鹅绒长袍。长袍的里子是带纯金条纹的黄细布。她腰间系着针尖花边围裙，精工细作的皱领下面还衬着一圈白缎领子。美丽的珠宝在她全身闪耀着光辉。
        - id: ch01-b81
          speaker: lady_arden
          text: 亲爱的儿子，你真是个气派的侍童。站到一边，等我走过时替我提起裙裾。亲爱的女儿，等你长到年纪，也会有长裙裾，也会有侍童替你提着。
        - id: ch01-b82
          speaker: narrator
          text: 她翩然走过，两个孩子跟在后面。阿登勋爵正在大厅里等候，华贵的程度几乎不输给妻子。随后，众人登上一辆马车离去。马车十分堂皇，只是稍微显得笨重。它的形状让埃尔弗丽达想到仙女教母用南瓜变给灰姑娘的那辆马车。
        - id: ch01-b83
          speaker: narrator
          text: 她隔着一群穿号衣的仆人偷看马车离开，觉得自己简直就是灰姑娘，像到谁也不能要求更多了，或许还多出了一点。她只好暗暗安慰自己，总觉得一定会有事情发生。事情后来果然发生了。我要讲的也正是这件事。我承认，我也很想把埃德雷德那边的事情讲给你听。可他经历的那一半其实算不上冒险，虽然只要他还记得任何魔法经历，就一辈子也忘不了那一天。
        - id: ch01-b84
          speaker: edred
          text: 后来我们去了国王的宅子，那里叫白厅。要不是我的宅子已经叫阿登城堡，我也想把它叫白厅。那儿大概有成千上万的仆人，一个个气派得叫你做梦也想不到。还有好多勋爵和夫人，好多吃的，花园里还有熊戏和斗鸡。
        - id: ch01-b85
          speaker: elfrida
          text: 太残忍了！你没看吧？
        - id: ch01-b86
          speaker: edred
          text: 看了一点。男孩得敢看流血和可怕的场面，不然长大当兵时受不了怎么办？不过我最喜欢假面舞会。王后也参加了。没有人说话，大家只管装扮和跳舞，有点像哑剧，只是没那么亮闪闪。舞台上还有一片海，银色波浪会动，周围有布景板、海豚、各种鱼一样的东西，还有一只会张开的巨大贝壳。王后和那些夫人从贝壳里出来跳舞。我也吃了很多东西，样样都怪得很。后来我睡着了，醒来时国王本人正看着我，还说我有一张“漂亮脸蛋”。“漂亮”就是好看的意思。国王总该更懂事一点，你说对不对？
        - id: ch01-b87
          speaker: narrator
          text: 埃德雷德能讲出来的就只有这么多。我本来也能再讲一些，可一个人不可能把每件事情全都说完，何况埃尔弗丽达那边的冒险还在等着我们呢。
        - id: ch01-b88
          speaker: narrator
          text: 马车消失在雾气和泥泞里以后，埃尔弗丽达重新上楼，回到老乳母留下的那间屋子。天气一点也不像夏天，而她也不知道还能去哪里。
        - id: ch01-b89
          speaker: nurse
          text: 坐下，绣你的花样去。
        - id: ch01-b90
          speaker: narrator
          text: 一幅精细的花样就摆在那里，绷在宽大的光面木框上。
        - id: ch01-b91
          speaker: elfrida
          text: 我真希望不用绣。
        - id: ch01-b92
          speaker: narrator
          text: 她不安地望着那些纤细的丝线，觉得针线活实在叫人为难。
        - id: ch01-b93
          speaker: nurse
          text: 啧，啧。针线都不好好做，将来怎么当一位淑女？
        - id: ch01-b94
          speaker: elfrida
          text: 我更想跟你说说话。
        - id: ch01-b95
          speaker: nurse
          text: 你尽管一边绣一边说。你这张嘴给我添过多少麻烦呀！但愿你的针也能像舌头一样快。坐下吧。午饭前要是绣完这棵小树，就准你去见理查德表哥。
        - id: ch01-b96
          speaker: narrator
          text: 埃尔弗丽达拿起针，心想，听起来自己大概很喜欢理查德表哥。针线活很难做，眼睛也绣得发疼，可她还是坚持做了下去。过了一会儿，有人把乳母叫走，屋里只留下埃尔弗丽达一个人。她马上不再坚持了。
        - id: ch01-b97
          speaker: elfrida
          text: 何必呢？反正我根本来不及绣完。再说，这幅花样早在我出生许多年以前就磨坏了。现在绣它的那个埃尔弗丽达跟我同岁，还和我同一天出生呢。
        - id: ch01-b98
          speaker: narrator
          text: 她又想知道，今天究竟是哪月哪日，又究竟是哪一年。她还在琢磨，一边漫不经心地把针从同一个孔里穿进穿出，连丝线也没带。忽然，楼梯上传来一阵杂乱响动。房门猛地撞开，一个跟她年纪相仿的快活男孩冲了进来。
        - id: ch01-b99
          speaker: richard
          text: 功课做完了吗？我的做完了。老鹦鹉鼻子逼着我用功，可我一直想着你，这回他说什么我都照做。现在我们自由了。走，到花园里玩球！
        - id: ch01-b100
          speaker: narrator
          text: 埃尔弗丽达认定他就是迪克表哥，也马上决定，自己确实很喜欢他。宅子后面有一座美丽的大花园。两个孩子在那里打球，沿着黄杨树篱夹成的小径奔跑，又在修剪整齐的树木、石凳、雕像和喷泉之间捉迷藏。
        - id: ch01-b101
          speaker: narrator
          text: “老鹦鹉鼻子”就是理查德表哥的家庭教师。他穿着一身黑衣，脸上的神情仿佛刚吃过柠檬拌醋。他有时坐在凳上看孩子们玩，有时把拇指夹进一本灰扑扑的书里，沿着铺石露台来回踱步。
        - id: ch01-b102
          speaker: narrator
          text: 孩子们停下来休息，坐到石阶上，背靠着一张石凳。老鹦鹉鼻子轻手轻脚绕到石凳后面，站在两个孩子看不见的地方偷听。我们都知道，偷听很不光彩。可在那个年代，家庭教师并不总觉得自己有必要光明正大地对待学生。
        - id: ch01-b103
          speaker: narrator
          text: 我一直认为，而且永远都会认为，所有乱子都是这个讨厌的帕拉多斯先生，也就是老鹦鹉鼻子，躲在后面偷听才惹出来的。埃尔弗丽达却一直相信，而且永远会相信，灾祸是因为她懂得太多历史才发生的。从那以后，她格外小心，再也不肯让这种不幸因为历史知识重来。这也是她在学校拿不到历史奖的原因之一。每逢别人问她历史问题，她都会想，谁知道会出什么事呢。事实上，考试时她也真的从来“不知道”。
        - id: ch01-b104
          speaker: narrator
          text: 当时，埃尔弗丽达跑累了，忽然想起自己坐在绣花架前琢磨的问题。眼前正好有一个应该答得上来的人，她便开口问了。
        - id: ch01-b105
          speaker: elfrida
          text: 理查德表哥，今天是几号？
        - id: ch01-b106
          speaker: narrator
          text: 埃尔弗丽达听理查德表哥亲口告诉她，当天的日期确确实实是十一月五日。
        - id: ch01-b107
          speaker: elfrida
          text: 真的吗？那今天就是盖伊·福克斯日。你们放烟火吗？请你牢牢记心间，十一月五日这一天，火药叛乱与阴谋。火药叛乱这桩事，有什么理由，叫后人忘得一干二净？
        - id: ch01-b108
          speaker: richard
          text: 这歌可不快活，表妹，也不安全。叛国的事最好别唱。
        - id: ch01-b109
          speaker: elfrida
          text: 可阴谋没有成功呀。最后人们还会把他的假人烧掉。
        - id: ch01-b110
          speaker: richard
          text: 还有别的歌词吗？
        - id: ch01-b111
          speaker: elfrida
          text: 没有了。
        - id: ch01-b112
          speaker: richard
          text: 不知道唱的是哪一桩叛国案？
        - id: ch01-b113
          speaker: elfrida
          text: 你不知道吗？我知道。我还记得好几个密谋者的名字，也知道他们想杀谁。整件事我都知道。
        - id: ch01-b114
          speaker: narrator
          text: 就在这一刻，她犯了错，忍不住卖弄起自己的历史知识。
        - id: ch01-b115
          speaker: richard
          text: 那就讲给我听听。
        - id: ch01-b116
          speaker: elfrida
          text: 国王对天主教徒不公平，所以许多人决定杀死他，还要炸掉议会大厦。参与阴谋的人很多。他们说阿登勋爵也有份，其实他没有。有些人打算假装去打猎，趁机抓住伊丽莎白公主，宣布她是女王。其他人就等国王主持议会开幕时，把整座议会大厦炸上天。
        - id: ch01-b117
          speaker: richard
          text: 我的老师从没讲过这个故事。继续呀，表妹。
        - id: ch01-b118
          speaker: elfrida
          text: 后来，珀西先生租下议会大厦旁边的一所房子。他们挖了一条秘密地道，通到议会大厦下面的地窖，又放进去三打火药桶，上面盖满柴捆。他们本来会把所有人炸死，可特雷沙姆先生写信给亲戚蒙蒂格尔勋爵，告诉他那些人准备炸死国王，还要……
        - id: ch01-b119
          speaker: richard
          text: 哪个国王？
        - id: ch01-b120
          speaker: elfrida
          text: 詹姆斯一世国王。怎么，你……
        - id: ch01-b121
          speaker: narrator
          text: 理查德一下从石阶上跳了起来。老鹦鹉鼻子已经从石凳后走出，一把抓住埃尔弗丽达的手腕。他坐到凳上，只轻轻一拉，就让她站在面前。动作虽然轻，那只手却正是书里常写的，藏在天鹅绒手套里的铁手。
        - id: ch01-b122
          speaker: tutor
          text: 好了，阿登小姐。把刚才讲给表哥的奇闻，再对我说一遍。
        - id: ch01-b123
          speaker: narrator
          text: 埃尔弗丽达只好把刚才那段故事，从头到尾又讲了一遍。
        - id: ch01-b124
          speaker: tutor
          text: 那么，这个动听的故事，你是从哪里听来的？
        - id: ch01-b125
          speaker: elfrida
          text: 我们现在是什么地方？
        - id: ch01-b126
          speaker: narrator
          text: 她喘着气，已经开始明白了。
        - id: ch01-b127
          speaker: richard
          text: 就在花园里呀，还能在哪里？
        - id: ch01-b128
          speaker: narrator
          text: 理查德显然什么也没明白。
        - id: ch01-b129
          speaker: tutor
          text: 就在我的掌握之中。现在把一切都交代出来。每一个名字，每一个细节。否则，你和你父亲都不会有好下场。
        - id: ch01-b130
          speaker: richard
          text: 先生，别这样。你吓到我表妹了。她说的不过是个故事。她一向活泼，脑子里总有新鲜想法。
        - id: ch01-b131
          speaker: narrator
          text: 家庭教师用力攥紧了埃尔弗丽达的手腕。
        - id: ch01-b132
          speaker: tutor
          text: 她会在权势比我更高的人面前，把这个故事重新讲一遍。
        - id: ch01-b133
          speaker: elfrida
          text: 可是，这是历史呀！所有书里都写着！
          emotion: fearful
        - id: ch01-b134
          speaker: tutor
          text: 哪些书？
        - id: ch01-b135
          speaker: elfrida
          text: 我不知道。所有书。
        - id: ch01-b136
          speaker: narrator
          text: 她闷闷地回答。她之所以这样气闷，是因为这时终于真的明白了。自己那份异乎寻常的历史知识，还有公平地说，同样异乎寻常的卖弄欲，究竟把她送进了一场怎样的冒险。
        - id: ch01-b137
          speaker: tutor
          text: 现在，把密谋者的名字告诉我。
        - id: ch01-b138
          speaker: narrator
          text: 埃尔弗丽达暗暗告诉自己，这不会造成任何伤害。她现在身处詹姆斯一世的时代，可对她来说，这毕竟是三百年前，一切都早已发生过了。不管她说什么，都不可能再改变已经发生的事情，所以最好把自己记得的名字全告诉他。那个可恨的教师又摇晃起她来。
        - id: ch01-b139
          speaker: elfrida
          text: 好啦，好啦。
        - id: ch01-b140
          speaker: narrator
          text: 她心里还补了一句，这一切不过有点像梦，说出来也没关系。她张开嘴，准备说出自己还记得的那些可怜的、许多年前没能成功的火药阴谋密谋者的名字。可她听见自己说出口的，完全是另一番话。
        - id: ch01-b141
          speaker: elfrida
          text: 我不告诉你。随便你把我怎么样。我真后悔提起这件事。全是胡说，我是说，这不过是历史。你躲在门后偷听，真该害臊。我是说，你躲在屋外的石凳后面，偷听别人跟表哥说些胡话。
          emotion: angry
        - id: ch01-b142
          speaker: narrator
          text: 后面的事，埃尔弗丽达记不太清。一个人气到发狂时，所有东西都会混进一片可怕的红雾。她只记得那个教师坏透了，一面扭着她的手腕，一面逼她招供。她尖叫着，想抬脚踢他。理查德表哥虽然没有尖叫，却真的一脚踢中了教师。接着，她被拖回屋里，锁进一间没有窗户的小房间，四周漆黑一片。
        - id: ch01-b143
          speaker: elfrida
          text: 要是埃德雷德在就好了。我可以试着编几句诗，把白鼹鼠精叫来带我们离开。可他回家以前，我一点办法也没有。
          emotion: sad
        - id: ch01-b144
          speaker: narrator
          text: 她含着愤怒又屈辱的眼泪，独自等在黑暗里。埃德雷德看过熊戏、斗鸡、宴会和假面舞会，终于回来了。阿登勋爵和夫人自然也和他一起回来。他们发现宅子已经被一队武装卫兵占领。那个没有窗户的黑暗小屋里，还关着一个哭得筋疲力尽、脸色惨白的孩子。
        - id: ch01-b145
          speaker: elfrida
          text: 那全是胡说，只是历史。我不是故意说出来的，真的不是。
          emotion: fearful
        - id: ch01-b146
          speaker: narrator
          text: 她一遍又一遍这样保证，说那全是胡说，不过是历史，自己不是故意讲出来的，真的不是。阿登夫人顾不得身上华贵的红天鹅绒，也顾不得满身珠宝，把她紧紧搂进怀里，温柔地抱住。
        - id: ch01-b147
          speaker: lord_arden
          text: 你没有闯祸，那不过是一堆荒唐故事。明天我去见索尔兹伯里勋爵，把这个愚蠢的泡影戳破。亲爱的，你去睡吧，让小姑娘跟你一起。眼泪和恐惧已经把她折磨得浑身发抖了。明天，国务大臣大人会教这些花架子认清自己的位置，阿登宅邸也会把他们扫地出门。到时候，我们再笑一笑，看一个一本正经的捣蛋鬼，怎么凭一两个名字和小孩子的幻想，闹出这样一场乱子。明晚以前，一切都会平安无事，我们也会安稳睡下。
          emotion: calm
        - id: ch01-b148
          speaker: narrator
          text: 然而第二天夜晚到来时，它也和所有夜晚一样，背后已经有了整整一天造成的结果。阿登勋爵、阿登夫人和几个孩子没有躺在苏活区的阿登宅邸，也没有躺在海边丘陵上的阿登城堡。他们全都躺在伦敦塔里，被控犯下叛国重罪，正在等待审判。
        - id: ch01-b149
          speaker: narrator
          text: 原来，索尔兹伯里勋爵去了议会大厦下面的地窖。在那里，他发现了大胆的雇佣兵盖伊·福克斯。那人有一双黑眼睛，手里提着一盏暗灯笼，心里也藏着黑暗的企图。密谋者的名字随后都被供了出来，詹姆斯国王和整个议会因此得救了。可那些受国王欺骗，又因为他的欺骗而反对他的天主教绅士，只能去面对刑架和断头台。
        - id: ch01-b150
          speaker: narrator
          text: 这一切，我完全解释不了。埃尔弗丽达跟我一样清楚，这些事情发生在三百年前。或者，你愿意的话，也可以换一种说法，说它根本从来没有发生过。无论如何，把阿登一家和其他绅士送进伦敦塔、推到死亡阴影下的，是特雷沙姆先生写给蒙蒂格尔勋爵的那封信，并不是埃尔弗丽达唱的那首傻歌。
        - id: ch01-b151
          speaker: narrator
          text: 可埃尔弗丽达仍然觉得，是自己亲口出卖了他们。她又想，自己揭发的是一场卑鄙的阴谋，本来应该高兴才对，可她一点也高兴不起来。她觉得自己是个告密者，还这样骂自己。她仗着比这些人晚出生许多年，又仗着历史学得相当好，竟然泄露了这些贵族和绅士的性命。就算他们背叛了国王和议会，也丝毫不能让她好受一点。她太痛苦地觉得，真正的叛徒正是她自己。
        - id: ch01-b152
          speaker: narrator
          text: 伦敦塔的牢房围着厚厚的墙，墙上新刻不久的“罗利”两个字还清楚可见。阿登夫人和埃德雷德早已安静睡去，埃尔弗丽达却久久醒着。她恨透了自己，一遍又一遍骂自己是叛徒、胆小鬼，是个彻头彻尾的笨蛋。
