  chapters:
    - id: ch01
      title: "CHAPTER VIII. GUY FAWKES"
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            The quarrel kept the attic hidden for three days. Still, three sunny holiday days pass quickly when you have a great ruined castle of your own to explore, or at least one that belongs to your brother.
        - id: ch01-b02
          speaker: elfrida
          text: >-
            We might find the treasure by ourselves, without any Mouldiwarp magic. Let's search properly and leave no stone unturned.
        - id: ch01-b03
          speaker: narrator
          text: >-
            Edred looked up at the huge gray keep, rising high and grim above them.
        - id: ch01-b04
          speaker: edred
          text: >-
            We shall have to leave quite a lot of those stones where they are.
        - id: ch01-b05
          speaker: elfrida
          text: >-
            You know what I mean. Come on!
        - id: ch01-b06
          speaker: narrator
          text: >-
            Off they went. They climbed steep worn stairs that curled round and round through the dark. Dead leaves, mold, fallen feathers, and the dry deserted nests of owls and jackdaws lay underfoot. Then the stairs ended without warning in daylight. One last steep step brought them onto the top of a broad wall covered with ivy. From there they could look down, and down, and down. They looked past holes in the walls where great wooden beams had once rested. They looked past old fireplaces, still black from fires that had gone out centuries ago, and past the doors and windows of rooms whose floors had fallen away. Far below, at the very foot of the tower, ferns, grass, and brambles grew thick and green.
        - id: ch01-b07
          speaker: narrator
          text: >-
            Arched doorways opened onto covered walks with sturdy little pillars and narrow windows. There were strange small rooms and secret-looking corners everywhere. No place in the world could have been better for a serious, energetic game of hide-and-seek.
        - id: ch01-b08
          speaker: narrator
          text: >-
            After a thrilling game of I Spy, they stopped to rest. Both children were scarlet in the face and breathing hard.
        - id: ch01-b09
          speaker: elfrida
          text: >-
            Wouldn't it be glorious if every broken part were mended so neatly that you couldn't see where the new stones joined the old ones? The whole castle could be just as it was when it was brand-new.
        - id: ch01-b10
          speaker: edred
          text: >-
            The house wasn't there when the castle was brand-new. Not the house as it is now. And I don't suppose the new castle had an attic full of chests.
        - id: ch01-b11
          speaker: elfrida
          text: >-
            It couldn't have had all those chests. Some of the clothes weren't made until much later. But grown-ups can work out what broken things looked like when they were new. They do it with mastodon bones and things. I believe they once worked out the whole of Hercules from one foot they found.
        - id: ch01-b12
          speaker: edred
          text: >-
            I've thought of something. We could go back to a time when the castle was whole, like a model, and draw every part of it. Then, after we find the treasure, we'll know exactly how to rebuild it.
        - id: ch01-b13
          speaker: elfrida
          text: >-
            Yes, we would. But first we'd have to know how to draw, wouldn't we?
        - id: ch01-b14
          speaker: edred
          text: >-
            Of course, but we could soon learn if we really tried. I never try at school because I don't like it. Drawing is easy, though. Burslem Minor always wins the prize, and you know what a duffer he is. We could start learning now.
        - id: ch01-b15
          speaker: narrator
          text: >-
            Elfrida sat on a fallen stone in the castle yard. She studied the wonderful maze of arches and pillars, the notched battlements on the towers, and the great thick walls. Then she sighed.
        - id: ch01-b16
          speaker: elfrida
          text: >-
            All right. Let's start now.
        - id: ch01-b17
          speaker: edred
          text: >-
            You'll have to lend me one of your pencils. I smashed mine trying to open the parlor door that day when you had the key in your pocket. It was a good long pencil, too. Lend me a long one, Elf. I can't draw with those tiny ends that disappear into your hand and prick you.
        - id: ch01-b18
          speaker: elfrida
          text: >-
            I will, as long as you don't put it in your mouth.
        - id: ch01-b19
          speaker: narrator
          text: >-
            They fetched big sheets of writing paper and brown books bound in calfskin to make a firm surface. Then they settled down to draw Arden Castle. Elfrida did not limit herself to the walls and towers in front of her. She tried to put in everything she knew was there, along with everything her eyes could actually see. The two kinds of knowledge did not fit together very neatly. Before long, black pencil covered almost the whole page.
        - id: ch01-b20
          speaker: narrator
          text: >-
            They had no eraser, so anything drawn wrongly had to remain on the paper. When people first begin drawing, they draw a great many things wrongly, as you may remember. I assure you that no one would have recognized Elfrida's black-and-gray muddle as a picture of a castle. Edred's was much easier to recognize, even before he wrote ARDEN CASTLE beneath it in large, uneven letters. He achieved this without raising his eyes from the page even once. Instead of drawing what stood before him, he drew what he believed the castle front must look like from outside. He also sucked Elfrida's pencil very earnestly, despite his promise. That made every line in his picture especially black.
        - id: ch01-b21
          speaker: edred
          text: >-
            There! Mine looks much more like the castle than yours does.
        - id: ch01-b22
          speaker: elfrida
          text: >-
            Yes, but mine has much more in it.
        - id: ch01-b23
          speaker: edred
          text: >-
            That doesn't matter if nobody can tell what the picture is. Look at mine. You can see the towers, the great gate, the windows, and all the little in-and-out bits along the top.
        - id: ch01-b24
          speaker: elfrida
          text: >-
            Yes, but... let's do something else. I don't think either of us can learn enough drawing to rebuild Arden before we find the treasure. Perhaps we'll meet a real artist in the past, like the man we saw drawing the castle yesterday. We could ask him to draw it and bring his picture home with us.
        - id: ch01-b25
          speaker: narrator
          text: >-
            Edred sprang up. His masterpiece, the calf-bound book, and the pencil all fell to the ground.
        - id: ch01-b26
          speaker: edred
          text: >-
            Oh, I know! The Brownie camera!
        - id: ch01-b27
          speaker: elfrida
          text: >-
            The Brownie?
        - id: ch01-b28
          speaker: edred
          text: >-
            We'll take it with us. Then we can photograph the castle while it's perfect.
        - id: ch01-b29
          speaker: elfrida
          text: >-
            But we can't take it into the past.
        - id: ch01-b30
          speaker: edred
          text: >-
            Can't we? You don't know everything. The first time we changed clothes, I had a bit of plaster in my shoe. It went into the past with me. I took it out during the lesson about dog's delight and flicked it through the window. But after we came home and changed back, there it was in my shoe again. If plaster can travel with us, so can a camera.
        - id: ch01-b31
          speaker: narrator
          text: >-
            Elfrida respected this close and clever reasoning. She wished she had thought of it, though of course she had not had plaster in her shoe.
        - id: ch01-b32
          speaker: elfrida
          text: >-
            You're becoming quite clever, aren't you?
        - id: ch01-b33
          speaker: edred
          text: >-
            Aha! You wish you'd thought of it yourself. I can be clever sometimes, just as you can.
        - id: ch01-b34
          speaker: narrator
          text: >-
            It is very annoying when someone reads your thoughts.
        - id: ch01-b35
          speaker: elfrida
          text: >-
            Not very often, you can't.
        - id: ch01-b36
          speaker: narrator
          text: >-
            She stopped at once. The children looked at each other with very peculiar faces. Then they both sighed with relief.
        - id: ch01-b37
          speaker: edred
          text: >-
            Fielded!
        - id: ch01-b38
          speaker: elfrida
          text: >-
            Just in time! That wasn't a quarrel. Nobody could call it one. Come on. Let's inspect the cottages, like the witch told us to.
        - id: ch01-b39
          speaker: narrator
          text: >-
            They did. That day, and the next day, and the day after that, they made their tour of inspection. They saw many things no grown-up inspector would ever have seen. Poor people are often friendly and open with children. They let a child come into the house, talk to the child, and show the child things they would never dream of showing to that child's grown-up relations. Of course, the child must be truly nice and must treat them in a friendly, respectful way. Edred and Elfrida did just that.
        - id: ch01-b40
          speaker: narrator
          text: >-
            Very soon, Edred and Elfrida knew more about the insides of the cottages around Arden than any grown-up could have learned in a year. They knew how much money the head of each household earned. They knew what each family had for dinner and, even more often, what the family did not have. They learned how many children were still living and how many had failed to live. They saw exactly where rain came through the rotten thatch in bad weather and where boards did not meet properly, leaving cracks for cold drafts. Some doors would not close. Others would not open. More often than not, the bedroom windows had been built so that they could not open at all.
        - id: ch01-b41
          speaker: narrator
          text: >-
            When they were not visiting cottages or exploring the castle, they happily read the history of Arden aloud to each other. Elfrida searched for Sir Edward Talbot, who had pretended to be the Chevalier St. George. She found no mention of that adventure. She did find a Sir Edward Talbot accused, along with the Lord Arden of his time, of plotting against His Most Christian Majesty, King James the First.
        - id: ch01-b42
          speaker: elfrida
          text: >-
            I wonder whether he was my Edward Talbot. I'd like to see him again. I wish I'd told him that we were born years and years after he died, though that would have been hard to explain. Let's look in Green's History and see what people wore in the time of His Most Christian Majesty, King James the First.
        - id: ch01-b43
          speaker: narrator
          text: >-
            Perhaps that search through Green's History settled their choice. When the three days ended, they chose clothes that looked most like the pictures from the reign of James the First. Edred found full breeches puffed out like balloons, a tall steeple-shaped hat, and something like a tunic made of crimson velvet. Around his small neck went a huge starched ruff. It felt even more uncomfortable than an Eton collar does after you have spent days and days wearing flannels. Elfrida wore long tight stays. A broad flat piece of wood ran down the front, and her long, very full skirts spread over a hoop that stuck out with surprising suddenness.
        - id: ch01-b44
          speaker: narrator
          text: >-
            After the quarrel, the attic door had been invisible and impossible to find. Now the three days were over, it stood out as plainly as the nose on anyone's face. The children entered and searched the chests until they found what they wanted. Soft pigeon sounds seemed to accompany them, or even help them, as they put on the ruffs and all the rest.
        - id: ch01-b45
          speaker: narrator
          text: >-
            Elfrida kept the Brownie camera clutched in one hand or the other while she dressed. This made everything slow and awkward, but the children had agreed that otherwise it might vanish. Things from their own time always vanished when they traveled, except for their clothes. Why the clothes stayed would take far too long to explain. It belonged to the magic of white feathers, which are, as you know, the clothes of white pigeons.
        - id: ch01-b46
          speaker: narrator
          text: >-
            Then something very strange happened. As Edred put on his second shoe, the last piece of either costume, the walls trembled and bent like a house of cards just before it falls. The floor tipped so sharply that standing became impossible. Rafters twisted together like matches spilled from a box. Above them, the tiled roof with its cracks of blue daylight spun like a top. The children could no longer tell which way was up.
        - id: ch01-b47
          speaker: narrator
          text: >-
            It began with dreadful suddenness and ended almost at once, with the jerk of a clockwork engine breaking down. The attic had vanished. So had the chests, the rafters, the walls, and the roof tiles streaked with blue. The room was now less than half its former size and much taller. It was no attic at all. It was round, with narrow windows and a fireplace under a stone hood, just like the rooms they had seen from the tower tops. The change truly took their breath away. For several moments they could only stare at each other, looking, as Elfrida said later, like Guy Fawkes masks.
        - id: ch01-b48
          speaker: edred
          text: >-
            I understand. This room stood where the attic was before the tower fell apart.
        - id: ch01-b49
          speaker: elfrida
          text: >-
            But the attic isn't really anywhere. We can't find it after a quarrel, and Mrs. Honeysett never finds it at all.
        - id: ch01-b50
          speaker: edred
          text: >-
            It must be somewhere. We couldn't fail to find it if it didn't exist.
        - id: ch01-b51
          speaker: elfrida
          text: >-
            I only hope we'll be able to find it again. We may as well leave. There's no point staying in this horrid little room.
        - id: ch01-b52
          speaker: narrator
          text: >-
            Elfrida put her hand on an unfamiliar iron latch and tried to work out how it opened. Before she could manage it, something even more upsetting happened. The feeling is hard to describe, unless you dislike riding backward on a train. If you do dislike it, you probably dislike it very much indeed. Your head begins to ache. A queer feeling creeps over the back of your neck, and you turn so pale that the grown-ups traveling with you ask what is wrong. Sometimes they heartlessly insist that the real trouble is a bun you ate at the station or the chocolate creams that Uncle Fred or Aunt Imogen pressed into your hand when you said goodbye. Worst of all is the feeling that your heart, your lungs, and even the front of your waistcoat are being pulled slowly through your backbone and carried a very long way off.
        - id: ch01-b53
          speaker: narrator
          text: >-
            Edred and Elfrida felt every bit of that so sharply that both of them shut their eyes. There was the whirling, the headache, the queer feeling behind the neck, and the awful sense that the front of one's waistcoat was being pulled away through one's back. Then all of it stopped as abruptly as it had begun. The children opened their eyes. They were standing in a room Edred had never seen. To Elfrida, it seemed strange and familiar at the same time. She knew the shape of the room and the positions of the doors and windows. She recognized the mantelpiece with its curious carvings and even some of the furniture. Yet the room looked bare, much barer than it should have been. And how could she know how much furniture was missing unless she had seen it before?
        - id: ch01-b54
          speaker: elfrida
          text: >-
            Oh, I know this room! It's Lord Arden's London house. I was here with Cousin Betty. The chairs were nicer then, and the room was full of people.
        - id: ch01-b55
          speaker: narrator
          text: >-
            Edred stood silent, his mouth half open and his eyes half shut in a kind of amazed trance. This journey was nothing like his last adventure. That time, he had only visited the house inside Arden Castle as it had been in Boney's day. He had reached it in the simplest possible way, by walking down a staircase he already knew. Now he had been carried in a most violent and unpleasant fashion, not merely out of his own time into a much earlier one, but out of the familiar castle and into an Arden house he had never seen. For quite a while, he could say nothing. When words finally came, they were full of discontent and very close to disgust.
        - id: ch01-b56
          speaker: edred
          text: >-
            I don't like this. Let's go home. We didn't even take the photograph. These clothes are horrible. I feel like a balloon crossed with a Bluecoat boy, and you look like a fat Mrs. Noah from the toy ark. We don't know who we're meant to be. This may not be Arden House at all, and even if it is, we don't know the year. What if it's the Inquisition and they burn us at the stake? I want to go back.
          emotion: disgusted
        - id: ch01-b57
          speaker: elfrida
          text: >-
            Listen carefully. I know what I mean inside my own head, but you won't understand unless you pay attention.
        - id: ch01-b58
          speaker: edred
          text: >-
            Go on, then.
        - id: ch01-b59
          speaker: elfrida
          text: >-
            Even if this were the Inquisition, it would still be all right for us.
        - id: ch01-b60
          speaker: edred
          text: >-
            How can you know that?
        - id: ch01-b61
          speaker: elfrida
          text: >-
            I can't explain how, but I do know. I've been here before, you see. It isn't real.
        - id: ch01-b62
          speaker: narrator
          text: >-
            Edred kicked a leg of the table.
        - id: ch01-b63
          speaker: edred
          text: >-
            It is real.
        - id: ch01-b64
          speaker: elfrida
          text: >-
            Yes, of course it is, but think about the water chute at Earl's Court. You were terribly frightened.
        - id: ch01-b65
          speaker: edred
          text: >-
            I was not.
        - id: ch01-b66
          speaker: elfrida
          text: >-
            You were. I didn't much like it either. Once it began, we knew we had to finish, and it was horrible. But afterward we wanted another ride. We went again, and remembering it has been splendid. This adventure is like that. Don't you see?
        - id: ch01-b67
          speaker: edred
          text: >-
            I don't understand one word of that. This isn't anything like the water chute.
        - id: ch01-b68
          speaker: narrator
          text: >-
            Elfrida frowned. Later, she was very glad that she had done nothing worse than frown. You know how dangerous it is to quarrel in a boat. It is far more dangerous to quarrel in a century that does not belong to you. Elfrida kept to the frown, though she opened her mouth to answer. At that exact moment, the door seemed to follow her example and opened too. A short, dark, cross-looking woman hurried through it. She wore a brown skirt and a strange cap.
        - id: ch01-b69
          speaker: nurse
          text: >-
            So this is where you've hidden! I've searched high and low because you must change your clothes.
        - id: ch01-b70
          speaker: narrator
          text: >-
            She caught Edred's arm, none too gently.
        - id: ch01-b71
          speaker: edred
          text: >-
            What for?
        - id: ch01-b72
          speaker: nurse
          text: >-
            What for? To attend thy lord father and lady mother at the masque at Whitehall. Hast thou forgotten? Thou wert desperate to wear thy new white velvet embroidered in orange-tawny, thy mother's diamond buckles, the silk cloak, shoe roses, cobweb-lawn ruff, and little sword.
        - id: ch01-b73
          speaker: narrator
          text: >-
            By then she had dragged Edred from the room and toward the stairs. Elfrida followed and decided the harsh way the nurse spoke was the worst thing about her. A truly horrible woman would not try to cheer Edred with velvet, swords, and diamond buckles.
        - id: ch01-b74
          speaker: elfrida
          text: >-
            Can't I go too?
        - id: ch01-b75
          speaker: narrator
          text: >-
            The nurse turned and slapped her. It was not hard, but it was sharp.
        - id: ch01-b76
          speaker: nurse
          text: >-
            I warned thee what would happen if thou couldst not hold that tiresome tongue. No, thou canst not go. Little ladies stay home and sew their samplers. Thou'lt go to Court soon enough.
        - id: ch01-b77
          speaker: narrator
          text: >-
            Elfrida watched while Edred was partly washed. Soap got in his eyes exactly as it does today. Then the nurse dressed him as a page in white velvet, with diamond buckles, a little sword, and all the rest.
        - id: ch01-b78
          speaker: elfrida
          text: >-
            You look splendid! Oh, I do wish I were a boy.
        - id: ch01-b79
          speaker: narrator
          text: >-
            This may have been the two thousand and thirty-second time she had said so in her short life.
        - id: ch01-b80
          speaker: nurse
          text: >-
            Thou'lt think differently when thy own turn comes to attend Court. Now kiss thy old nurse, my little lord. Stand carefully and do not soil those fine feathers. When thou hearest thy mother's skirts on the stairs, go out and bow as thy tutor taught thee.
        - id: ch01-b81
          speaker: narrator
          text: >-
            No tutor had taught Edred his bow. Still, when silk rustled on the stairs, he stepped out and bowed very well to the stately figure sweeping toward him. Elfrida curtseyed beside him. Aunt Edith had taught them the minuet, and its bow and curtsey seemed just right. The lady smiled with approval.
        - id: ch01-b82
          speaker: narrator
          text: >-
            She was magnificently dressed. Her yellow satin bodice was richly embroidered. She wore a striped petticoat of gold tissue and a red velvet robe lined with yellow muslin and pure gold stripes. A lace apron, a white satin collar, and a delicate ruff completed the costume. Beautiful jewels blazed all over her.
        - id: ch01-b83
          speaker: lady_arden
          text: >-
            Thou art a fine page indeed, my dear son. Stand aside and carry my train as I pass. And thou, dear daughter, when thou art old enough, thou shalt have a train and a page of thine own to carry it.
        - id: ch01-b84
          speaker: narrator
          text: >-
            Lady Arden swept onward, with the children following. Lord Arden waited in the hall, dressed with hardly less splendor than his wife. Then the parents and Edred climbed into a coach that was very grand, though rather clumsy. Its shape reminded Elfrida of the coach Cinderella's fairy godmother had made from a pumpkin. Elfrida stayed behind. She peered between the many servants in their fine livery and watched the carriage depart. At that moment, she felt as much like Cinderella as anyone could possibly wish to feel, and perhaps a little more. She comforted herself with a secret certainty that something was bound to happen to her. Sure enough, something did.
        - id: ch01-b85
          speaker: narrator
          text: >-
            Something did. I would like to tell you what happened to Edred as well, but his part was hardly an adventure, though he would remember it as long as he remembered any magic. Later, he told Elfrida all he could.
        - id: ch01-b86
          speaker: edred
          text: >-
            We went to the King's house. It's called Whitehall. I'd like to name my own house Whitehall, if it weren't already Arden Castle. There must have been thousands of servants, all finer than you can imagine, and crowds of lords and ladies. There was plenty to eat, and they had bear-baiting and cockfighting in the garden.
        - id: ch01-b87
          speaker: elfrida
          text: >-
            How cruel! I hope you didn't watch.
          emotion: disgusted
        - id: ch01-b88
          speaker: edred
          text: >-
            Only a little. Boys must learn to face blood and dreadful sights in case they grow up to be soldiers. I liked the masque best. The Queen acted in it. Nobody spoke. They only dressed up and danced. It was rather like a pantomime, but not so glittery. There was a silver sea with moving waves, painted scenes, dolphins, and other fishy creatures. A huge shell opened, and the Queen and her ladies came out and danced. I ate all sorts of funny things, then fell asleep. When I woke, the King himself was looking at me and saying I had a bonny face. Bonny means pretty. You'd think a king would know better, wouldn't you?
        - id: ch01-b89
          speaker: narrator
          text: >-
            That was all Edred could tell. I could tell you more, but no one can tell everything, and Elfrida's adventure must come next.
        - id: ch01-b90
          speaker: narrator
          text: >-
            The coach disappeared into mist and mud, for the weather was nothing like summer. Elfrida went back upstairs to the old nurse because she did not know where else to go.
        - id: ch01-b91
          speaker: nurse
          text: >-
            Sit thee down and work at thy sampler.
        - id: ch01-b92
          speaker: narrator
          text: >-
            A very fine sampler stood ready in a large frame of polished wood. Elfrida looked anxiously at its delicate silk threads.
        - id: ch01-b93
          speaker: elfrida
          text: >-
            I wish I didn't have to.
        - id: ch01-b94
          speaker: nurse
          text: >-
            Tut, tut. How wilt thou ever grow into a lady if thou dost not attend to thy needle?
        - id: ch01-b95
          speaker: elfrida
          text: >-
            I'd much rather sit and talk to you.
        - id: ch01-b96
          speaker: nurse
          text: >-
            Thou canst chatter while thou sewest. I know that well enough. If only thy needle moved as quickly as thy tongue! Sit down. Finish the little tree before dinner, and thou mayst see Cousin Richard.
        - id: ch01-b97
          speaker: narrator
          text: >-
            Elfrida supposed this meant she was fond of Cousin Richard. She picked up the needle. The sewing was difficult and made her eyes ache, but she went on trying. After a while, someone called for the nurse, and Elfrida was left by herself. The moment she was alone, she stopped trying altogether.
        - id: ch01-b98
          speaker: narrator
          text: >-
            She wondered what use there could be in working on a sampler she had no time to finish. Even if it were finished, the cloth would wear out years and years before her own birth. The Elfrida who ought to be sewing it must have been born on the same day as her and must be exactly the same age. That curious thought made her wonder what day it was now, and what year. She was still wondering as she pushed the needle idly in and out of the same hole, without ever taking the silk through with it. Then feet clattered on the stairs. The door burst open, and a cheerful boy about her own age rushed into the room.
        - id: ch01-b99
          speaker: cousin_richard
          text: >-
            Hast thou finished thy task? Mine is done. Old Parrot-nose kept me working, but I thought of thee and obeyed him for once. Now we're free. Come and play ball in the garden.
        - id: ch01-b100
          speaker: narrator
          text: >-
            This must be Cousin Dick. Elfrida decided at once that she was fond of him.
        - id: ch01-b101
          speaker: narrator
          text: >-
            A large and beautiful garden lay behind the house. The children played ball there. They raced along the box alleys and played hide-and-seek among clipped trees, stone seats, statues, and fountains. Cousin Richard's tutor watched all this. Old Parrot-nose, as Richard called him, was really named Mr. Parados. He dressed entirely in black and looked as if he had been eating lemons and vinegar. Sometimes he sat on a seat and watched the children. At other times, he walked back and forth along the paved terrace with his thumb marking a place in a very dull-looking book.
        - id: ch01-b102
          speaker: narrator
          text: >-
            At last the children stopped their game to rest. They sat on a stone step and leaned back against a stone seat. Mr. Parados came up very quietly on the other side of that seat. He stood where neither child could see him and listened to their private talk. Listening in secret is a dishonorable thing to do, as we all know. In those days, however, tutors did not always think they had to behave honorably toward their pupils.
        - id: ch01-b103
          speaker: narrator
          text: >-
            I have always thought, and always will think, that the tiresome tutor and his eavesdropping caused all the trouble that followed. Elfrida has always believed something different. She blames the disaster on knowing too much history. That is one reason she now takes great care never to win the history prize at school. You never know what might happen, she says. And when an examination actually asks her a question about history, she never does know the answer.
        - id: ch01-b104
          speaker: narrator
          text: >-
            Once she stopped running, Elfrida remembered the question that had puzzled her over the sampler. Now she could ask someone who might know.
        - id: ch01-b105
          speaker: elfrida
          text: >-
            Cousin Richard, what day is it?
        - id: ch01-b106
          speaker: narrator
          text: >-
            His answer sounded like the fifth of November.
        - id: ch01-b107
          speaker: elfrida
          text: >-
            Is it really? Then it's Guy Fawkes Day. Do you have fireworks? Please to remember the Fifth of November, the gunpowder treason and plot. I see no reason why gunpowder treason should ever be forgot.
        - id: ch01-b108
          speaker: cousin_richard
          text: >-
            That is neither a merry song nor a safe one, cousin. It is best not to sing about treason.
        - id: ch01-b109
          speaker: elfrida
          text: >-
            But the plot fails, and they always burn Guy Fawkes in the end.
        - id: ch01-b110
          speaker: cousin_richard
          text: >-
            Does the song have more verses?
        - id: ch01-b111
          speaker: elfrida
          text: >-
            No.
        - id: ch01-b112
          speaker: cousin_richard
          text: >-
            I wonder which act of treason the ballad means.
        - id: ch01-b113
          speaker: elfrida
          text: >-
            Don't you know? I do. I know some of the conspirators' names, whom they meant to kill, and everything else.
        - id: ch01-b114
          speaker: narrator
          text: >-
            Elfrida had made the mistake of showing off her history.
        - id: ch01-b115
          speaker: cousin_richard
          text: >-
            Tell me, then.
        - id: ch01-b116
          speaker: elfrida
          text: >-
            The King had treated the Catholics unfairly, so a group of them decided to kill him and destroy the Houses of Parliament. Many men joined the plot. People accused Lord Arden, though he was innocent. Some conspirators planned to pretend they were hunting, seize Princess Elizabeth, and proclaim her Queen. The others meant to blow up Parliament when the King came to open it.
        - id: ch01-b117
          speaker: cousin_richard
          text: >-
            My tutor has never told me this tale. Go on, cousin.
        - id: ch01-b118
          speaker: elfrida
          text: >-
            Mr. Piercy rented a house beside Parliament House. The conspirators dug a secret passage toward the cellars under Parliament and hid three dozen barrels of gunpowder there beneath bundles of sticks. Everyone would have been blown up, except Mr. Tresham warned his relation, Lord Monteagle, that they meant to kill the King and...
        - id: ch01-b119
          speaker: cousin_richard
          text: >-
            Which king?
        - id: ch01-b120
          speaker: elfrida
          text: >-
            King James the First. Why? What is it?
        - id: ch01-b121
          speaker: narrator
          text: >-
            Cousin Richard sprang to his feet. At the same moment, Old Parrot-nose closed his hand around Elfrida's wrist. He sat down on the stone seat and drew her gently forward until she stood before him. He moved gently, but there was no escaping him. It was like the iron hand inside the velvet glove that you may have read about.
        - id: ch01-b122
          speaker: tutor
          text: >-
            Now, Mistress Arden, tell me once more this romance thou hast told thy cousin.
        - id: ch01-b123
          speaker: narrator
          text: >-
            Elfrida repeated it.
        - id: ch01-b124
          speaker: tutor
          text: >-
            And where didst thou hear this pretty story?
        - id: ch01-b125
          speaker: elfrida
          text: >-
            Where are we now?
        - id: ch01-b126
          speaker: narrator
          text: >-
            At last she was beginning to understand.
        - id: ch01-b127
          speaker: cousin_richard
          text: >-
            Here in the garden. Where else could we be?
        - id: ch01-b128
          speaker: tutor
          text: >-
            Here in my custody. Now tell me everything. I want every name and every detail, or matters will go worse for thee and thy father.
        - id: ch01-b129
          speaker: cousin_richard
          text: >-
            Please, sir, you are frightening my cousin. It was only a tale. She is always merry and invents all kinds of things.
        - id: ch01-b130
          speaker: tutor
          text: >-
            Then she shall repeat her tale before men of greater power than I possess.
        - id: ch01-b131
          speaker: narrator
          text: >-
            He spoke with thorough unpleasantness, and his fingers tightened around Elfrida's wrist.
        - id: ch01-b132
          speaker: elfrida
          text: >-
            But it's history! It's written in all the books.
          emotion: fearful
        - id: ch01-b133
          speaker: tutor
          text: >-
            Which books?
        - id: ch01-b134
          speaker: elfrida
          text: >-
            I don't know. All of them.
        - id: ch01-b135
          speaker: narrator
          text: >-
            She answered sullenly. By now she understood exactly what sort of adventure she had fallen into. Her knowledge of history was unusual, but to be fair, her wish to show off that knowledge was almost equally unusual. Together, they had landed her in a very dangerous position.
        - id: ch01-b136
          speaker: tutor
          text: >-
            Tell me the conspirators' names.
        - id: ch01-b137
          speaker: narrator
          text: >-
            Elfrida tried to reason it out. Telling him could not possibly do any harm. This was the time of James the First, and somehow she was inside it. Yet it was still three hundred years ago. Everything had already happened, so nothing she said now could make any difference. She decided it would be best to tell him every conspirator's name she could remember. While she was thinking, the hateful tutor shook her.
        - id: ch01-b138
          speaker: elfrida
          text: >-
            Yes, all right.
        - id: ch01-b139
          speaker: narrator
          text: >-
            It was only a sort of dream, she thought. She opened her mouth to name the conspirators in the poor old Gunpowder Plot that had failed so many years ago. But those were not the words that came out.
        - id: ch01-b140
          speaker: elfrida
          text: >-
            I won't tell you. I don't care what you do. I'm sorry I said anything at all. It's nonsense. I mean, it's only history. You should be ashamed of listening from behind doors. Or outside, behind stone seats. Especially when people are only talking nonsense to their own cousins.
          emotion: angry
        - id: ch01-b141
          speaker: narrator
          text: >-
            Elfrida never remembered the next part very clearly. She had become furiously angry, and when people are that angry, events tangle together inside a dreadful red mist. She did remember that the tutor behaved horribly. He twisted her wrists to make her speak. Elfrida screamed and tried to kick him. Cousin Richard did not scream, but he did succeed in kicking the tutor. Then they dragged Elfrida back inside the house and shut her in a room with no window. The room was completely dark.
        - id: ch01-b142
          speaker: elfrida
          text: >-
            If Edred were here, we could make some poetry and call the Mouldiwarp to take us away. But nothing can happen until he comes home.
          emotion: sad
        - id: ch01-b143
          speaker: narrator
          text: >-
            Much later, Edred came home from the bear-baiting, the cockfighting, the feast, and the masque. Lord and Lady Arden returned with him, of course. They found their own house occupied by armed guards. In the little dark room, they found a pale child completely worn out from crying. Again and again, Elfrida tried to explain that it was all nonsense. It was only history, and she truly had not meant to tell anyone. Lady Arden took the child into her arms and held her close and tenderly. She did not care what the tears did to her grand red velvet or her beautiful jewels.
        - id: ch01-b144
          speaker: lord_arden
          text: >-
            Thou hast done no harm. These are nothing but foolish tales. Tomorrow I shall see Lord Salisbury and prick this silly bubble. Go to bed, sweetheart, and let the little maid sleep beside thee. She is trembling with tears and terror. Tomorrow the Lord Secretary will teach these popinjays their place. They will leave Arden House, and we shall laugh at the grand trouble one solemn meddler has made from a few names and a child's fancy. By tomorrow night, all will be well, and we shall sleep in peace.
          emotion: calm
        - id: ch01-b145
          speaker: narrator
          text: >-
            Tomorrow night did come. Like every night, it arrived after the day's work had already been done. Lord Arden, his lady, and the two little children did lie down, but not in Arden House in Soho. They did not sleep at Arden Castle on the downs above the sea, either. They lay in the Tower of London, charged with high treason and waiting to be put on trial.
        - id: ch01-b146
          speaker: narrator
          text: >-
            Lord Salisbury had gone down to the cellars beneath the Houses of Parliament. There he found Guy Fawkes, a bold soldier of fortune. The man had dark eyes, a dark lantern, and a dark purpose. Before long, the names of the men in the conspiracy were given up. King James was saved, and so were the members of Parliament. But the Catholic gentlemen had been deceived by the King, and they had turned against him because of those deceits. Now they stood face to face with torture on the rack and death on the executioner's scaffold.
        - id: ch01-b147
          speaker: narrator
          text: >-
            I cannot explain Elfrida's feelings at all. She knew as well as I do that the Gunpowder Plot had happened three hundred years before her own life. Or perhaps you would rather put it another way and say that this adventure had never truly happened. She also knew that Mr. Tresham's warning letter to Lord Monteagle had exposed the conspirators. Her foolish rhyme had not brought the Ardens or the other gentlemen to the Tower and the shadow of death. She knew all that, and yet she felt that she herself had betrayed them.
        - id: ch01-b148
          speaker: narrator
          text: >-
            Another thought troubled her. If she had truly exposed a wicked plot, then surely she ought to feel glad. She did not feel glad at all. Instead, she called herself a sneak. She had been born centuries later than these people, and she had used that advantage, along with her rather good knowledge of history, to give away the lives of nobles and gentlemen. The fact that those men were traitors to their King and to Parliament made no difference to her feelings. In her own bitter thoughts, the true traitor was Elfrida herself.
        - id: ch01-b149
          speaker: narrator
          text: >-
            They spent the night in a room with the thick stone walls of the Tower all around them. Raleigh's name had been carved into one of those walls, and the cut letters still looked fresh. At last Lady Arden fell asleep, and Edred slept peacefully too. Elfrida could not join them. She lay awake long after both of them were sleeping and hated herself. Nothing could quiet the bitter shame she felt. She believed the betrayal was hers, and the same cruel names went around and around in her mind. She called herself a Traitor, a Coward, and an Utter Duffer.
