        timbre: 深沉温暖的成年男声
        pace: 沉稳
        pitch: 低
    richard:
      display_name: 理查德
      tts:
        delivery: 机敏忠诚，措辞老成又爱打趣
        timbre: 明亮的少年声
        pace: 自然
        pitch: 中高
    guard:
      display_name: 卫兵
      tts:
        delivery: 朴实守礼，带着善意
        timbre: 粗厚的成年男声
        pace: 稳健
        pitch: 中低
  chapters:
    - id: ch01
      title: 第九章　伦敦塔里的囚徒
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 埃尔弗丽达被关进伦敦塔，还背上了叛国重罪的嫌疑。更糟的是，她已经承认，自己对火药阴谋知道得未免太多。这时她才觉得，能回到自己的时代、回到阿登，实在再好不过。在那里，只要安安分分，不碰任何白鼹鼠精式的魔法，也不横加干涉，日子就不会危险，不会浪漫，更不会惊心动魄。可你知道，她从前待在阿登时，偏偏从来都闲不住。她和埃德雷德有城堡，有宅子。光是那两样，已经足以叫你我心满意足，他们却还嫌不够。他们想找宝藏，也想找冒险，尤其是埃尔弗丽达。现在冒险真的来了，两个人都陷在里面，结局却谁也不知道。而这，归根结底正是冒险之所以成为冒险的地方。
        - id: ch01-b02
          speaker: narrator
          text: 埃德雷德同阿登勋爵和另外几位绅士住在白塔，埃尔弗丽达和阿登夫人则被安置在这座建筑完全不同的一边。两个孩子不许见面，自然谁也无法设法回到自己的时代。他们有时会吵架，心里却真正在乎对方。何况在詹姆斯一世和火药阴谋的年代，哪怕换成一个自己不怎么喜欢的人，我们大概也不会忍心把他独自留在伦敦塔做囚徒。
        - id: ch01-b03
          speaker: narrator
          text: 埃尔弗丽达每天服侍母亲，还要在样布上刺绣。老保姆送来夫人的衣裳和她身上的衣服时，倒很细心地连样布也带来了。可是这里没有游戏。她唯一能去的户外，是一条极窄的露台。石板路窄得只容一个人走，绝容不下两个，路旁更窄的花圃里尽是直挺挺的枯花梗。从那里，她能看见河上胖乎乎、模样古怪的船，还能看见圣保罗大教堂高高的尖塔。
        - id: ch01-b04
          speaker: narrator
          text: 埃德雷德的运气稍微好些，可以到伦敦塔总管的花园里玩。可他一点也不想玩，只想找到埃尔弗丽达，再回阿登去。人人待他都很客气，他却必须比平日安静得多，开口得称“阁下”和“夫人”，还得等别人先问，自己才能说话。世界上明明摆着一千件有趣的事，每一件都叫人想开口发问，这规矩有多折磨人，你简直想象不到。
        - id: ch01-b05
          speaker: narrator
          text: 他们在那里住了好些天。终于有一天，埃德雷德碰见一个喜欢回答问题的人。这件事带来的变化，比你以为的还大。那是个晴朗的冬日早晨，他在总管的私人花园散步，看见一位容貌非凡的老绅士迎面走来。老人的衣裳华美得耀眼，上面的珠宝闪闪发光。那时关在伦敦塔里的绅士，多半觉得坐牢只配穿最旧的衣裳。因此这片穿过花园而来的灿烂光彩，不仅耀眼，也实在少见。埃德雷德还没想起不许先开口的规矩，已经鞠了一躬。
        - id: ch01-b06
          speaker: edred
          text: 愿为您效劳，阁下。您看上去真是棒极了！
        - id: ch01-b07
          speaker: sir_walter
          text: 我不大明白你的意思。
        - id: ch01-b08
          speaker: edred
          text: 我是说，您看上去气派极了！
        - id: ch01-b09
          speaker: sir_walter
          text: 能博得你的赞赏，我很欣慰。
        - id: ch01-b10
          speaker: edred
          text: 我说的是您的衣裳。您的脸也很气派，不过人家教过我，不能当面说别人长得好看。霍尼塞特太太总说，当面夸人，正是丢人。
        - id: ch01-b11
          speaker: sir_walter
          text: 夸我的脸可不丢人。在这几堵墙里，这倒是件叫人高兴的新鲜事。
        - id: ch01-b12
          speaker: edred
          text: 今天是您的生日，还是有什么喜事？
        - id: ch01-b13
          speaker: sir_walter
          text: 不是我的生日。你为什么这么问？
        - id: ch01-b14
          speaker: edred
          text: 因为您穿得这么华贵。您一定是位王子吧？
        - id: ch01-b15
          speaker: sir_walter
          text: 不是王子，是囚徒。
        - id: ch01-b16
          speaker: edred
          text: 哦，我懂了。您今天要获释，所以换上最好的衣裳回家。我真替您高兴。虽说我舍不得您走，可这对您是好事。
        - id: ch01-b17
          speaker: sir_walter
          text: 你这孩子真大胆。可惜猜错了，我仍会是囚徒。至于这些小玩意儿，绝不能让人说，牢狱的阴影蒙住了沃尔特·雷利的骄傲，叫他忘了装扮这副曾有幸跪拜童贞女王的身躯。
        - id: ch01-b18
          speaker: narrator
          text: 说到身上的装饰，他把胸膛高高挺起。钻石纽扣、红宝石耳环和镶满宝石的项圈，在冬日阳光下齐齐闪亮。说到自己曾跪拜女王，他又摘下帽子，郑重而潇洒地向外一挥，帽子几乎扫到了地面。这个动作做得气派极了。
        - id: ch01-b19
          speaker: edred
          text: 啊，您真是沃尔特·雷利爵士！太了不起了！请您给我讲金光灿灿的南美洲，讲海战、无敌舰队和西班牙人，再讲讲您小时候玩什么。
          emotion: surprised
        - id: ch01-b20
          speaker: sir_walter
          text: 好，我有的是故事。他们总不会不许我同你说话。只可惜我再也看不见那条河了。从前的房间能望见河，还能看见一艘艘漂亮的船驶进驶出，驶向茫茫大海。
        - id: ch01-b21
          speaker: narrator
          text: 沃尔特爵士叹了一声，沉默片刻，又说眼前的孩子竟然已经认不出老朋友雷利。他被忘得干干净净了。就在两年前，埃德雷德还骑在他的剑上，把剑当作马儿，他也曾陪着孩子在阿登的院子里玩耍。可是，连英格兰都忘得这样快，又怎能苛求一个孩子记得更久？
        - id: ch01-b22
          speaker: edred
          text: 对不起。
        - id: ch01-b23
          speaker: sir_walter
          text: 不必。年岁短，记性也短。跟我到房里来吧。我给你看海图，还有温达戈科阿的地图。亲爱而光荣的女王陛下恩准我用她的名号，把那里改称弗吉尼亚。
        - id: ch01-b24
          speaker: narrator
          text: 埃德雷德又欢喜又自豪，牵着爵士的手去了他的住处。那里有墨西哥来的羽毛衣，有陌生海岛来的奇异金像，也有格陵兰独角鲸的一截角尖，还有许许多多海外奇物。爵士给他讲航海与战斗，也讲起儿时的游戏。那时他和汉弗莱·吉尔伯特、阿德里安·吉尔伯特、小杰克·戴维斯一起在长溪放玩具船，又划着小艇，从港口的一艘艘大船之间穿进穿出。他们仰望高高伸在水面上的巨大船首像，猜那些形象有什么故事，也猜大船来自怎样陌生的国度。
        - id: ch01-b25
          speaker: sir_walter
          text: 我们还常遇见海船的船长，他们给我们几个小子讲旅行故事。后来，我们先驶小船，又驶大船。如今我却泊在这座船坞里，再也不能启航。唉，要是能再看一眼德文郡的荒原，再看看长溪清亮的水面！可我永远也看不到了。
          emotion: sad
        - id: ch01-b26
          speaker: narrator
          text: 他说着把胳膊靠在窗台上。若不是这人正是历史书里的伟大人物沃尔特·雷利爵士，埃德雷德准会以为他哭了。
        - id: ch01-b27
          speaker: edred
          text: 您别难过！我不知道他们肯不肯让您回德文郡，可总有一天，他们会让您带十二艘船再去美洲。您的船叫“命运号”，从泰晤士河启航。阿登勋爵会去送您，临别时亲吻您，还送您一枚奖章。您的儿子也会同行。我昨天才从书里看到，这些全是真的。
        - id: ch01-b28
          speaker: sir_walter
          text: 一本书？莫非是预言？
        - id: ch01-b29
          speaker: edred
          text: 您愿意这么叫也行。反正它说的是真的。
        - id: ch01-b30
          speaker: narrator
          text: 埃德雷德是在《阿登家史》里读到这些事的。笑意重新回到沃尔特爵士快活的眼睛里。
        - id: ch01-b31
          speaker: sir_walter
          text: 倘若我真能再度驶向金色西方，我一定攻下一座西班牙城镇，再给你带一条金项圈和满满一大袋银币回来，否则就叫我受罚。
        - id: ch01-b32
          speaker: edred
          text: 非常感谢。您真好，可到那时，我不会在这里了。
        - id: ch01-b33
          speaker: narrator
          text: 沃尔特爵士一再追问，埃德雷德却既不肯说自己怎么知道，也不肯解释为何将来不在这里。此后，他们每天都在总管的花园见面。两个囚徒彼此安慰，至少埃德雷德得到了安慰，沃尔特爵士看上去也一样。可那究竟是真的，还是只装作如此，谁都说不准。
        - id: ch01-b34
          speaker: narrator
          text: 这又牵出一个总让两个孩子头晕的问题。他们进入过去，会不会改变过去的人和事？每次谈起来，两个人都觉得脑袋仿佛转起圈来。身在历史之中，说过的话、做过的事，当时似乎都要紧极了。可如果回到过去只是一场梦，过去的人便不会知道，除非他们也做了同样的梦。埃尔弗丽达认为这很可能，尤其是在时间根本不作数，白色时钟又能骗过时间的时候。
        - id: ch01-b35
          speaker: narrator
          text: 反过来，如果他们真的到了真正的过去，所作所为就该真的算数。可他们又把后来学到的知识全带了进去。凭着这些知识，他们可以揭穿阴谋，可以预告战争的胜负和国王的命运，甚至像埃尔弗丽达所说，让历史变得完全不一样。那又怎么说得通？贝蒂·洛弗尔说过，他们不会在过去留下任何痕迹，可这句话放在哪一种解释里，都没能真正解开这个结。眼下姐弟俩不能见面，更没法讨论。他们天天盼望相遇，始终没有碰上。
        - id: ch01-b36
          speaker: narrator
          text: 后来，王后想起阿登夫人，认为她和儿子该获释。她把意思告诉国王，国王又告诉某某勋爵，某某勋爵再去通知伦敦塔总管。于是阿登府匆忙派来他们自己的马车，把阿登夫人和埃德雷德突然送回苏活区的家。埃尔弗丽达却留在塔里，由和善的总管夫人看管。一个仍在伦敦塔，一个已经回到阿登府。姐弟俩连一句话都没说上，更来不及商量怎样回到一九〇八年，回到海边的阿登城堡。
        - id: ch01-b37
          speaker: narrator
          text: 埃尔弗丽达之所以没被放走，当然是因为她唱过一首歌谣。正是那几句人人熟悉的词，让听见的人觉得，或者装作觉得，她对火药阴谋知道得太多。
        - id: ch01-b38
          speaker: elfrida
          text: 请记住，请记住，十一月的第五日。火药叛国大阴谋。
        - id: ch01-b39
          speaker: narrator
          text: 人们因此认定她对火药阴谋知道得一清二楚。她当然确实知道。可问题在于，她若想向那个时代的任何人说明，自己究竟是从哪里、又是怎么知道这一切的，就很难不落个叛徒的罪名。这件事解释起来，几乎比沉默还危险。
        - id: ch01-b40
          speaker: narrator
          text: 她现在每天都能见到阿登勋爵，也越来越喜欢他。他出奇地像她自己的爸爸。爸爸跟吉姆叔叔去了南美洲，再也没有回来。阿登勋爵也一天比一天疼她。
        - id: ch01-b41
          speaker: lord_arden
          text: 你这丫头胆子真大，还一天大似一天。这样顶撞爸爸，就不怕我抽你吗？
        - id: ch01-b42
          speaker: elfrida
          text: 不怕！我知道您不会打自己的女儿，对不对，爸爸？
        - id: ch01-b43
          speaker: narrator
          text: 她绕过他的轮状皱领，尽力把他抱紧。那感觉几乎像抱着自己的爸爸，那个去了南美洲、再也不会回来的爸爸。她从《阿登家史》里知道，这位阿登勋爵不会因火药阴谋丧命，只会被逐出宫廷，最后回阿登幸福地度过余生。她几乎想任凭事情自然发展，自己留在三百年前，陪着这位新爸爸，亲亲他，也让他疼爱自己。可她惦记埃德雷德，觉得无论如何也得做点什么，偏又想不出任何办法，甚至不知道弟弟眼下是快乐还是难过。
        - id: ch01-b44
          speaker: narrator
          text: 实际上，埃德雷德即使不算难过，也很不自在。讨厌的家庭教师帕拉多斯还住在阿登府，教他和表兄理查德。你无论走进哪一所海滨小绅士学校，恐怕也找不出比他更讨厌的人。帕拉多斯偷听了不该听的话，又把它报告到最能惹祸的地方。这种行为一向很讨詹姆斯一世欢心，所以他正得宠，阿登夫人根本不敢辞退他。何况她自己已经忧虑成疾。
        - id: ch01-b45
          speaker: edred
          text: 爸爸不会被判叛国，也不会被处死。他只会回阿登，安安静静跟您生活。我在书里看见了。
        - id: ch01-b46
          speaker: narrator
          text: 阿登夫人却只是哭。帕拉多斯上课下课都爱敲埃德雷德的指关节。
        - id: ch01-b47
          speaker: richard
          text: 他一门心思就是窥探我们，威吓我们。
        - id: ch01-b48
          speaker: edred
          text: 他总是鬼鬼祟祟地捣乱，这个告密鬼。走以前，我一定要跟他算账。
        - id: ch01-b49
          speaker: richard
          text: 走以前？你要去哪里？
        - id: ch01-b50
          speaker: narrator
          text: 埃德雷德本想说，他和埃尔弗丽达要离开。可话一出口，他就想到，一九〇八年的自己走后，一六〇五年的埃尔弗丽达和埃德雷德自然还会留在这里。至少，如果过去确实是那样的话……那些纠缠不清的老问题又冒出来。他眼下没有时间细想，便把它们统统压住，用一种自己从未有过的坚定口气说了下去。要是埃尔弗丽达听见，一定既惊讶又高兴。
        - id: ch01-b51
          speaker: edred
          text: 我有两件事要办。先把埃尔弗丽达救出伦敦塔，再跟老鹦鹉鼻算账。救她要紧，而且她也会乐意帮我做另一件事。
        - id: ch01-b52
          speaker: narrator
          text: 两个男孩坐在屋顶的铅板上，背靠一座烟囱，面对唯一的活板门。那扇门也是登上屋顶的唯一通道。北风不停吹，屋顶冷得厉害，他们还是特意来到这里，因为整座宅子里能让人放心说秘密的地方并不多。至少帕拉多斯绝不可能悄悄从背后摸来，偷听他们正在商量什么。
        - id: ch01-b53
          speaker: richard
          text: 把她救出来？但愿我们办得到。
        - id: ch01-b54
          speaker: edred
          text: 办得到。从离开伦敦塔起，我一直在想，现在已经有办法了。我需要你帮忙，还需要一个大人。
        - id: ch01-b55
          speaker: richard
          text: 一个大人？
        - id: ch01-b56
          speaker: edred
          text: 我想保姆肯帮忙。先得确认能不能信她。
        - id: ch01-b57
          speaker: richard
          text: 她愿意为阿登家任何人去死。就算死在刑架上，也不会泄露我们一句话。
        - id: ch01-b58
          speaker: edred
          text: 那就没问题了。
        - id: ch01-b59
          speaker: richard
          text: 你打算怎么做？
        - id: ch01-b60
          speaker: narrator
          text: 理查德没有笑，虽然埃德雷德看上去那么小，那么瘦弱，伦敦塔却那么庞大坚固。
        - id: ch01-b61
          speaker: edred
          text: 我要照尼斯代尔夫人救丈夫的办法，把埃尔弗丽达救出来。只要知道卫兵什么时候换岗，就不难。我正好知道。
        - id: ch01-b62
          speaker: richard
          text: 尼斯代尔夫人怎么救出她丈夫的？又是从哪儿救的？
        - id: ch01-b63
          speaker: narrator
          text: 埃德雷德差点回答“从伦敦塔”。这才想起，尼斯代尔勋爵眼下还没被关进去，说不定还没出生。他只好说会把整个故事讲给理查德听。故事讲得虽有些含糊，却十分鼓舞人心。至于详情，任何熟悉历史的大人都很乐意讲给你听。
        - id: ch01-b64
          speaker: narrator
          text: 理查德听得兴致勃勃，简直叫讲故事的人受宠若惊。可天越来越暗，也越来越冷。屋里已经点起灯，活板门便成了屋顶上的一个黄色方块。忽然，方块里出现一道影子。理查德看见了那道警告，立刻伸手掐了掐埃德雷德的胳膊。
        - id: ch01-b65
          speaker: richard
          text: 我们该去读书了。品行端正的少年，即使老师不在，也会当他就在眼前。我现在正觉得老师就在眼前。可见我一定品行端正。
        - id: ch01-b66
          speaker: narrator
          text: 话音一落，那道影子猛地消失了。两个男孩心里都明白刚才是谁在偷听。他们不敢放声笑，只把笑憋在肚子里，闷声闷气地下楼，装作什么也没发生。随后，他们借着两支不断淌蜡的牛脂蜡烛温习功课。那两支寒酸的蜡烛，偏偏插在沉甸甸的纯银烛台里。
        - id: ch01-b67
          speaker: narrator
          text: 第二天，埃德雷德请老保姆带他去宫廷。王后一向很喜欢阿登夫人，他竟真的见到王后陛下，还拿到她亲笔写的许可。手令吩咐伦敦塔总管，准许阿登家的埃德雷德少爷、理查德少爷和一名随从入塔探望。此后两天，保姆忙个不停，一直坐在那里缝纫。帕拉多斯照样敲男孩们的手指，照样责骂，照样朝他们瞪眼，却怎么也不明白，两个人为什么突然如此耐心，什么都肯忍受。终于，那个日子到了。天气冷得刺骨，午后渐深，天空开始下雪。
        - id: ch01-b68
          speaker: witch
          text: 越是这样越好，越是这样越好。
        - id: ch01-b69
          speaker: narrator
          text: 伦敦塔的大门在黄昏换岗。提前一刻钟，阿登勋爵的马车停到塔门前。老保姆戴着皱领和帽子，披着红斗篷，从车里扶下两个小绅士。埃德雷德一身黑衣，斗篷镶着松鼠皮。理查德穿灰色天鹅绒，配着貂皮。总管被请来，读过王后的手令，和气地朝埃德雷德点点头，便放他们进去。他们穿过庭院，朝阿登勋爵居住的白塔走。天气冷得厉害，浓密的雪落满斗篷和毛皮，又冻在衣料上。
        - id: ch01-b70
          speaker: witch
          text: 越是这样越好，越是这样越好。
        - id: ch01-b71
          speaker: narrator
          text: 访客进门时，埃尔弗丽达正坐在阿登勋爵膝上。她欢叫着跳起来，紧紧抱住弟弟。
        - id: ch01-b72
          speaker: edred
          text: 跟保姆走。她叫你做什么，你就一件不差地照做。
        - id: ch01-b73
          speaker: elfrida
          text: 可我已经编好诗了，而且现在你也来了。
        - id: ch01-b74
          speaker: edred
          text: 照吩咐做。我们非把你救出去不可。别犯傻，想想尼斯代尔夫人。
        - id: ch01-b75
          speaker: narrator
          text: 他的口气凶得出奇，埃尔弗丽达立刻明白了。她跑回阿登勋爵身边，搂住他的脖子，一遍遍亲他，眼泪也流了下来。
        - id: ch01-b76
          speaker: lord_arden
          text: 好了，好了，我的姑娘。
          emotion: calm
        - id: ch01-b77
          speaker: witch
          text: 跟我到房里来。我要给你量尺寸，做一件新长袍和衬裙。
        - id: ch01-b78
          speaker: lord_arden
          text: 她舍不得离开爸爸，对不对，我的姑娘？
        - id: ch01-b79
          speaker: elfrida
          text: 不，不，我不想离开爸爸！
          emotion: sad
        - id: ch01-b80
          speaker: lord_arden
          text: 不过量一会儿罢了。你这只小乖羊羔，快去吧，去得快，也回来得快。
          emotion: calm
        - id: ch01-b81
          speaker: elfrida
          text: 再见，亲爱的、亲爱的、最亲爱的爸爸！啊，我亲爱的爸爸，再见！
          emotion: sad
        - id: ch01-b82
          speaker: witch
          text: 不过做件新衣裳，也值得这样大闹？我可没耐心哄这孩子。
        - id: ch01-b83
          speaker: narrator
          text: 保姆抓住埃尔弗丽达的手，把她拖进隔壁房间，跪下来解她的长袍。
        - id: ch01-b84
          speaker: witch
          text: 快，一刻也不能耽搁。出去时拿手帕捂住脸，装作正在哭。咦，你已经哭了！越是这样越好！
        - id: ch01-b85
          speaker: narrator
          text: 她从宽大的裙撑和衬裙下掏出藏好的衣服，那是一整套黑色小礼服。帽子、斗篷、长袜、鞋子，每一样都和埃德雷德身上的分毫不差。埃尔弗丽达甚至还没来得及把眼泪流完，站起来时已经成了弟弟一模一样的影子。只有脸不像，而那张脸会藏在手帕后面。时间一刻也不能浪费，保姆立刻走到房门口，去同守在那里的卫兵交涉。
        - id: ch01-b86
          speaker: witch
          text: 好心的先生，我家小少爷病了。他身子太弱，经不起这样伤心的相聚和离别。请带我们去外门，让我送他上车。随后我回来接他的表兄。
        - id: ch01-b87
          speaker: guard
          text: 原来如此，可怜的孩子！人生就是这样，人人都有该流的眼泪。
        - id: ch01-b88
          speaker: narrator
          text: 卫兵不能擅自离开阿登勋爵的门，只好给她们指路。她们独自穿过庭院，雪花落在斗篷上，随即冻住。塔门口的守卫刚才隔着大雪，看见一个老保姆带两个小男孩进来。现在，他又隔着大雪，看见一个老保姆带一个小男孩出去。几个人身上全都覆着雪，正好看不出细微的不同。男孩拿手帕遮着脸，似乎哭得十分伤心。保姆解释说，这也难怪，因为他刚见过身陷囹圄的父亲和姐姐。
        - id: ch01-b89
          speaker: witch
          text: 我先送他上马车，随后回来接年轻的理查德·阿登少爷。
        - id: ch01-b90
          speaker: narrator
          text: 她顺利把穿男装的埃尔弗丽达带出塔门，来到一直等在外面的马车旁。车夫按照事先的约定，在车驾座上睡觉。听差也按照事先的约定，到附近的小酒馆喝东西去了。眼下没有一个人会好奇地探头来看车厢里面。
        - id: ch01-b91
          speaker: witch
          text: 钻到座位底下。
        - id: ch01-b92
          speaker: narrator
          text: 她把埃尔弗丽达塞进车厢，关门离开。女孩穿着男装，蜷在座位下的麦秸里。第一步成功了，最危险的部分却还在后头。
        - id: ch01-b93
          speaker: narrator
          text: 保姆轻易回到塔内，刚才看见她出去的卫兵又放她进了门。她缓缓穿过积雪的庭院时，听见新岗哨在门洞下跺脚取暖。真正的危险，是阿登勋爵房门口的人，还有她再次出来时，旧岗哨会不会仍在大门附近逗留。照他们的预想，她该带一个男孩出来，实际却会带两个。这个险非冒不可。保姆便在角落里安静等待，在不耽误事情的限度内尽量多拖一阵，好减少遇见旧守卫的可能。等她终于说时候到了，已经知道房门前换了卫兵。
        - id: ch01-b94
          speaker: edred
          text: 现在该闯这一关了。
        - id: ch01-b95
          speaker: narrator
          text: 埃德雷德和理查德跟着保姆走下窄台阶，穿过白雪覆盖的庭院。新卫兵看见一个女人带着两个男孩，新卫队长又读了王后的手令。保姆早已留心从总管手里把它取回。手令上清清楚楚写着，阿登家的埃德雷德少爷、理查德少爷和随从一同进塔，他们自然也获准一同离开。两分钟后，大马车已经隆隆驶过积雪的街道。车里四个人兴奋得忘乎所以，紧紧抱在一起，庆贺这个计策成功。
        - id: ch01-b96
          speaker: richard
          text: 这个办法是埃德雷德想的，一切也都是他安排并办成的。
        - id: ch01-b97
          speaker: elfrida
          text: 他真了不起！
          emotion: happy
        - id: ch01-b98
          speaker: narrator
          text: 埃尔弗丽达没有扫弟弟的兴，这一点也很了不起。这是埃德雷德有生以来第一次完全靠自己计划并完成一场冒险，他正在为这件事感到前所未有的自豪和喜悦。其实姐姐只要说上一句话，就能把这一切破坏得干干净净。她完全可以指出，整套计策根本没有必要。他们本可在伦敦塔随便找个角落，念诗召来白鼹鼠精，然后轻轻松松离开。可她一句也没说。
        - id: ch01-b99
          speaker: narrator
          text: 马车回到阿登府。车夫显然又睡着了。听差打开前门以后，绕到马车旁，不知在挽具上摆弄些什么。保姆趁机支开了那个开门的听差，让他立刻吩咐厨房给埃德雷德少爷和理查德少爷摆饭。因此谁也没有看见，下午离开阿登府的是两个小男孩，晚上回来的却有三个。保姆把孩子们径直带进小客厅，在身后关紧了门。
        - id: ch01-b100
          speaker: witch
          text: 理查德少爷去换下礼服，阿登小姐去小房间换衣裳。埃德雷德少爷，你留在这里陪我。
        - id: ch01-b101
          speaker: narrator
          text: 另外两人听话离开。保姆望着埃德雷德，眼睛越睁越大，也越来越不像原来的眼睛。埃德雷德的眼睛也越睁越圆。
        - id: ch01-b102
          speaker: edred
          text: 您是那个女巫！就是我们送茶和食物去给她的女巫。
          emotion: surprised
        - id: ch01-b103
          speaker: witch
          text: 就算我是，又怎样？难道只有你们能回到别的时代？阿登家的少爷，你还远远不是整个世界。不过，你有希望长成出色的男孩和男人。我看你在这些古老年月里，也学到了一点东西。
        - id: ch01-b104
          speaker: narrator
          text: 他的确学到了一点东西，这毫无疑问。究竟是因为自己重要到足以被关进伦敦塔，还是因为和那位天才卓绝、气度非凡的沃尔特·雷利爵士长谈过许多次，又或是因为帕拉多斯不停敲他的指关节、朝他怒目而视，我也说不准。可有一件事能够确定。这场冒险正是埃德雷德开始改变的地方。后来，他终于成为古老歌谣要他成为的那种勇敢、善良、聪明的人。
        - id: ch01-b105
          speaker: witch
          text: 一刻也不能耽搁。伦敦塔已经识破我们的计策。你们必须回到自己的时代。
        - id: ch01-b106
          speaker: edred
          text: 她就是那个女巫。
        - id: ch01-b107
          speaker: witch
          text: 一刻也不能耽搁。
        - id: ch01-b108
          speaker: edred
          text: 我非先跟老帕拉多斯算账不可。
        - id: ch01-b109
          speaker: narrator
          text: 他果真去跟老帕拉多斯算了账，而且这件事恰好花掉二十分钟。经过嘛，我答应过一会儿再从头到尾讲给你听。等埃德雷德终于回来，老保姆先打发理查德上床睡觉。埃尔弗丽达知道时间紧迫，赶紧提起自己早已编好的那首诗。
        - id: ch01-b110
          speaker: elfrida
          text: 我确实编了诗召唤白鼹鼠精，可诗里全是伦敦塔，我们现在又不在那里。既然已经不在塔里，再念“啊，白鼹鼠精，你本领高强，快救我们逃离这讨厌的塔墙”，就一点用也没有。我又想不出别的，而且……
        - id: ch01-b111
          speaker: witch
          text: 别管诗。诗给孩子用用倒不错，可我知道一个胜过两首诗的法子。
        - id: ch01-b112
          speaker: narrator
          text: 她把他们领进餐厅。餐具柜上摆满了银器。她放下蜡烛，从柜上取下那只刻着阿登家纹章的大银盘，摆到桌上。随后，她朝银盘呵了一口气，趁银面蒙着水汽，用手指画出几个三角和一个圆圈。呼出的雾气渐渐消散，银面重新变得光洁明亮。就在这时，活生生的阿登白鼹鼠精突然出现在银盘中央，抬眼望着他们，看上去恼火极了。
        - id: ch01-b113
          speaker: mole
          text: 你真没礼貌！这样随随便便把我弄来，连一句“请您允许”也不说。埃尔弗丽达明明可以编诗。你知道这些三角形会让我实实在在地难受。诗又容易又简单！
          emotion: angry
        - id: ch01-b114
          speaker: witch
          text: 今晚念诗太慢。把孩子们带走，我的事办完了。
        - id: ch01-b115
          speaker: mole
          text: 你总把事情弄得麻烦。你们这种人自以为什么都懂，其实只懂一点。要是我照念诗的法子来，就能轻松送他们回去。现在可不行了。我当然会送，但他们不会喜欢。他们得爬上屋顶，再从上面跳下去。
          emotion: angry
        - id: ch01-b116
          speaker: witch
          text: 我不相信非这样不可。
        - id: ch01-b117
          speaker: mole
          text: 那好，你自己送他们走。
        - id: ch01-b118
          speaker: narrator
          text: 白鼹鼠精话一说完，身体竟真的开始从银盘中央一点点消失。看来它宁可撒手不管，也不肯听女巫质疑自己的办法。
        - id: ch01-b119
          speaker: elfrida
          text: 不，不！您叫我们做什么，我们都做。
        - id: ch01-b120
          speaker: witch
          text: 屋顶上积了一英尺厚的雪。
        - id: ch01-b121
          speaker: mole
          text: 越是这样越好，越是这样越好。你应该明白。
        - id: ch01-b122
          speaker: witch
          text: 你以为自己聪明得很。
        - id: ch01-b123
          speaker: mole
          text: 还不到我真正聪明的一半呢！听见没有？快上屋顶，逃命去！我可不能保证现在还来得及。
        - id: ch01-b124
          speaker: narrator
          text: 就在这时，前门猛然响起猛烈的捶门声，把寂静的夜晚一下砸得粉碎。屋里的人再也没有时间争辩。门外的敲击声还在继续，一下比一下响，一下比一下急。
