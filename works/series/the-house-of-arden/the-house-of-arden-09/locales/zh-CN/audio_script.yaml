        timbre: 清脆明亮的男孩声
        pace: 自然偏快
        pitch: 中高
    elfrida:
      display_name: 埃尔弗丽达
      tts:
        delivery: 直率活泼，敏锐又有主意
        timbre: 清亮的女孩声
        pace: 轻快
        pitch: 高
    mole:
      display_name: 鼹鼠精
      tts:
        delivery: 脾气暴躁，古怪又爱挖苦人
        timbre: 尖细干涩
        pace: 偏快，抱怨时一气呵成
        pitch: 偏高
    witch:
      display_name: 女巫
