  chapters:
    - id: ch01
      title: "CHAPTER IX. THE PRISONERS IN THE TOWER"
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            Elfrida was locked in the Tower of London, accused of high treason. Worse still, she had admitted knowing far too much about the Gunpowder Plot. For once, she could not help thinking it might be nice to be safely back in her own time at Arden. If you left events alone there, and did not interfere with them through any kind of magical mouldiwarp business, then nothing dangerous, romantic, or thrilling ever happened. Of course, when Elfrida was at home, she never could leave events alone. She and Edred had not been satisfied with the castle and the house they already had, though either place would have made you or me perfectly happy. They wanted to find the treasure. Elfrida, especially, wanted adventures. Well, now they both had one. There was no telling how it would end, and not knowing the end is the very heart of an adventure.
        - id: ch01-b02
          speaker: narrator
          text: >-
            Edred was kept in the White Tower with Lord Arden and several other gentlemen. Elfrida and Lady Arden were held in a completely different part of the building, and the children were not allowed to meet. That made it impossible for either child to try to carry them both home to their own time. Edred and Elfrida sometimes quarreled, as you know, but they were truly fond of each other. Most of us would hesitate to escape alone and leave even someone we did not particularly like as a prisoner in the Tower during the reign of James the First, with the Gunpowder Plot hanging over everyone.
        - id: ch01-b03
          speaker: narrator
          text: >-
            Elfrida had to wait on Lady Arden and spend her time stitching at her sampler. The old nurse had thoughtfully brought it along with the clothes for both of them. There were no games to play. The only chance Elfrida had to go outdoors was a very narrow terrace. Dead flower stalks poked from an even narrower border beside the flagged path, and the path had room for one person to walk, but not two together. From there she could watch the fat, odd-looking ships moving on the river and see the spire of Saint Paul's in the distance.
        - id: ch01-b04
          speaker: narrator
          text: >-
            Edred was luckier. He was allowed to play in the private garden belonging to the Lieutenant of the Tower, though he had very little wish to play. What he wanted was to find Elfrida and return to Arden. Everyone treated him kindly, but life among the adults was tiresome. He had to be far quieter than he was used to being. He had to call everyone Sir or Madam, and he was not supposed to speak until someone spoke to him first. You may not realize how difficult that is. The world is full of a thousand interesting things, and at any moment you may think of another question that simply must be asked.
        - id: ch01-b05
          speaker: narrator
          text: >-
            They had been prisoners for quite a number of days when Edred finally met someone who seemed to enjoy answering questions. That one meeting changed things far more than you might expect at first.
        - id: ch01-b06
          speaker: narrator
          text: >-
            One bright winter morning, Edred was walking in the garden when a handsome old gentleman came toward him. His clothes were handsome too, and they blazed with jewels. Most gentlemen imprisoned in the Tower wore their oldest clothes, so this splendid figure was as unusual as he was dazzling. Before Edred remembered the rule about waiting to be spoken to, he bowed.
        - id: ch01-b07
          speaker: edred
          text: "Your servant, sir. You look absolutely ripping!"
        - id: ch01-b08
          speaker: sir_walter_raleigh
          text: "I do not understand what you mean."
        - id: ch01-b09
          speaker: narrator
          text: >-
            The gentleman smiled kindly.
        - id: ch01-b10
          speaker: edred
          text: "I mean you look splendid!"
        - id: ch01-b11
          speaker: narrator
          text: >-
            The old gentleman looked pleased.
        - id: ch01-b12
          speaker: sir_walter_raleigh
          text: "I am happy to have won your admiration."
        - id: ch01-b13
          speaker: edred
          text: >-
            I meant your clothes. Your face is splendid too, only I was taught proper manners. You mustn't tell people they're handsome to their faces. Mrs. Honeysett says, “Praise to the face is open disgrace.”
        - id: ch01-b14
          speaker: sir_walter_raleigh
          text: >-
            Praise to my face is no disgrace. Inside these walls, it is a pleasant change.
        - id: ch01-b15
          speaker: edred
          text: "Is it your birthday, or something?"
        - id: ch01-b16
          speaker: sir_walter_raleigh
          text: "It is not my birthday. Why do you ask?"
        - id: ch01-b17
          speaker: edred
          text: "Because you're dressed so grandly. Are you a prince?"
        - id: ch01-b18
          speaker: sir_walter_raleigh
          text: "No, not a prince. A prisoner."
        - id: ch01-b19
          speaker: edred
          text: >-
            Oh, I see. You're being released today, and you've put on your best clothes to go home. I'm so glad! I mean, I'm sorry you're going, but I'm glad for you.
        - id: ch01-b20
          speaker: sir_walter_raleigh
          text: >-
            You are a bold young fellow. But no, I am a prisoner, and I expect to remain one. As for these trinkets, no one shall say that a prison's shadow dulled Walter Raleigh's pride in dressing a body that once knelt before the Virgin Queen.
        - id: ch01-b21
          speaker: narrator
          text: >-
            He drew himself up until his diamond buttons, ruby earrings, and jeweled collar flashed in the winter sun. At the words “Virgin Queen,” he swept off his hat and flourished it almost to the ground.
        - id: ch01-b22
          speaker: edred
          text: >-
            Oh! Are you really Sir Walter Raleigh? How splendid! You can tell me about golden South America, the sea battles, the Armada and the Spaniards, and what games you played when you were little.
          emotion: surprised
        - id: ch01-b23
          speaker: sir_walter_raleigh
          text: >-
            Aye, I shall tell you stories enough. Surely they will not forbid me to talk with you. If only I could see the river again! From my last chamber I watched the fine ships come and go, sailing down into the great waters.
        - id: ch01-b24
          speaker: narrator
          text: >-
            Sir Walter looked around impatiently. Then he sighed and fell silent for a moment.
        - id: ch01-b25
          speaker: sir_walter_raleigh
          text: >-
            So you did not know your old friend Raleigh. All forgotten, all forgotten! Yet you once rode astride my sword, and I played with you in the courtyard at Arden. If England forgets so quickly, what more can anyone expect from a child?
        - id: ch01-b26
          speaker: edred
          text: "I'm sorry."
        - id: ch01-b27
          speaker: sir_walter_raleigh
          text: >-
            No, no. It was two years ago, and short years make short memories. Come to my chamber. I will show you a chart and a map of Windargocoa, which Her Dear Glorious Majesty allowed me to rename Virginia in honor of her great and gracious self.
        - id: ch01-b28
          speaker: narrator
          text: >-
            Sir Walter gently pinched Edred's ear. Then the delighted, proud boy took his hand and went with him to his apartments.
        - id: ch01-b29
          speaker: narrator
          text: >-
            There Edred saw wonders brought from across the seas. There were clothes made of feathers from Mexico, strange golden figures from strange islands, the tip of a narwhal's horn from Greenland, and many other curious things. Sir Walter told him stories of his voyages and his battles. He also told Edred about being a boy with Humphrey Gilbert, Adrian Gilbert, and little Jack Davis. They used to sail their toy boats on the Long Stream. Then they would row in and out among the great ships down at the Port. They stared up at the enormous figureheads standing high above the water and wondered about those carved faces and the distant lands the ships had come from.
        - id: ch01-b30
          speaker: sir_walter_raleigh
          text: >-
            Often we found a sea captain willing to tell us boys the same kind of travelers' tales I have told you. First we sailed our little ships. Then we sailed our great ones. Now here I lie in dock, never to sail again. Oh, to see the Devon moors once more, and the clear stretches of the Long Stream! But I never shall.
          emotion: sad
        - id: ch01-b31
          speaker: narrator
          text: >-
            He leaned one arm on the windowsill. If he had not been the great Sir Walter Raleigh from all the history books, Edred would have thought he was crying.
        - id: ch01-b32
          speaker: edred
          text: >-
            Please cheer up! I don't know whether they'll let you go to Devon, but I know they'll send you back to America one day. You'll have twelve ships. I read it only yesterday. Your own ship will be called the Destiny, and you'll sail from the Thames. Lord Arden will come to see you off. He'll kiss you goodbye and give you a medal to remember him by. Your son will sail with you. I know it's true. It's all in the book!
        - id: ch01-b33
          speaker: sir_walter_raleigh
          text: "The book? Is it some prophecy?"
        - id: ch01-b34
          speaker: edred
          text: "You may call it that if you like. Anyway, it is true."
        - id: ch01-b35
          speaker: narrator
          text: >-
            Edred had read every bit of it in the History of Arden.
        - id: ch01-b36
          speaker: sir_walter_raleigh
          text: >-
            If that comes true, and I ever sail to the Golden West again, then I swear I shall sack a Spanish town for you. I will bring you a golden collar and a great bag full of pieces of eight.
        - id: ch01-b37
          speaker: narrator
          text: >-
            The smile had returned to Sir Walter's merry eyes.
        - id: ch01-b38
          speaker: edred
          text: "Thank you very much. That's very kind, but I won't be here."
        - id: ch01-b39
          speaker: narrator
          text: >-
            Sir Walter asked question after question, but Edred would not explain how he knew, or what he meant.
        - id: ch01-b40
          speaker: narrator
          text: >-
            After that, Edred met Sir Walter every day in the Lieutenant's garden, and the two prisoners comforted each other. Edred certainly felt better. Sir Walter seemed to feel better too, though no one could be sure it was more than an appearance. That uncertainty was part of a question that always puzzled the children. They would talk it over until their heads felt as if they were spinning. When they entered the past and took part in history, did anything they said or did truly make a difference to the people living there? At the time, every word and action certainly seemed to matter very much.
        - id: ch01-b41
          speaker: narrator
          text: >-
            But suppose visiting the past was only a sort of dream. Then the people in that time would know nothing about it unless they happened to dream the same dream. Elfrida thought that quite possible, especially if time did not count, or if white clocks could cheat it. On the other hand, if the children truly entered the real past, then their actions had to count for something, as Edred always said. Yet how could that work? They carried everything they had learned in their own time back with them. They could uncover plots, reveal who would win wars, tell the fate of kings, and, as Elfrida put it, make history turn out completely differently. You see the trouble, don't you? Betty Lovell had told them they could leave no mark on times past, but that did not seem to settle the question at all.
        - id: ch01-b42
          speaker: narrator
          text: >-
            For now, Edred and Elfrida were separated in different parts of the Tower, so they could not debate that question or any other question. Each of them kept hoping they would somehow meet. Day after day, they never did.
        - id: ch01-b43
          speaker: narrator
          text: >-
            At last the Queen happened to remember Lady Arden. She decided that Lady Arden and her son Edred ought to be released from the Tower, so she spoke to the King. The King passed the word to a certain lord, who passed it to the Lieutenant of the Tower. Without warning, Lady Arden and Edred were sent home in their own coach, which had been summoned suddenly from Arden House. Elfrida was left behind in the care of the Lieutenant's wife, though that lady was very kind to her. Now Elfrida remained a prisoner in the Tower while Edred was at Arden House in Soho. They had not managed to speak even once, so they had made no plan at all for returning to 1908 and to Arden Castle beside the sea.
        - id: ch01-b44
          speaker: narrator
          text: >-
            Elfrida was kept prisoner because she had sung a rhyme asking everyone to remember the fifth of November and the Gunpowder Treason and Plot. People thought, or appeared to think, that she knew all about the plot. Of course she did. The hard part would have been explaining how she knew without sounding like a traitor.
        - id: ch01-b45
          speaker: narrator
          text: >-
            She was now allowed to visit Lord Arden every day, and she came to love him dearly. He was strangely like her own father, who had gone to South America with Uncle Jim and never returned to his little girl. Lord Arden seemed to grow more fond of her each day too.
        - id: ch01-b46
          speaker: lord_arden
          text: >-
            You are a bold little piece, and every day you grow bolder. Aren't you afraid your daddy will have you whipped for answering him so pertly?
        - id: ch01-b47
          speaker: elfrida
          text: >-
            No! I know you would never beat your own girl, would you, Daddy?
        - id: ch01-b48
          speaker: narrator
          text: >-
            She hugged him as well as she could around his ruff. It felt almost like hugging her own father, who would never come home from America.
        - id: ch01-b49
          speaker: narrator
          text: >-
            Elfrida was nearly content. She knew Lord Arden was not one of the people who would suffer terribly for the Gunpowder Plot. The History of Arden said he would only be banished from Court. After that he would return to Arden and live out his days there happily. She was almost tempted to stop trying to change anything. She could simply stay with this new father who had lived three hundred years before her, pet him, and let him pet her. But Edred was still somewhere beyond her reach, and she felt she had to do something for his sake. The worst part was that she could not think of a single thing to do. She did not even know what was happening to Edred, or whether he was happy or unhappy.
        - id: ch01-b50
          speaker: narrator
          text: >-
            In fact, he was not exactly miserable, but he was certainly uncomfortable. Mr. Parados still lived at Arden House and taught Edred and his cousin Richard. He was as nasty as any tutor you might find at a seaside academy for young gentlemen. The King favored him because he had listened to a private conversation and reported it where it would cause the most harm, which always pleased King James the First. Lady Arden did not dare dismiss him.
        - id: ch01-b51
          speaker: narrator
          text: >-
            Besides, Lady Arden was ill with worry and grief. Edred tried to comfort her again and again.
        - id: ch01-b52
          speaker: edred
          text: >-
            Father won't be convicted of treason. They won't execute him. They'll only send him to Arden, where he'll live quietly with you. I saw it all in a book.
        - id: ch01-b53
          speaker: narrator
          text: >-
            But Lady Arden only wept.
        - id: ch01-b54
          speaker: narrator
          text: >-
            Mr. Parados was harsh. During lessons, and even outside them, he was forever rapping Edred's knuckles.
        - id: ch01-b55
          speaker: richard
          text: "He is always trying to spy on us and frighten us into obedience."
        - id: ch01-b56
          speaker: edred
          text: >-
            He's forever sneaking around and meddling. I want to pay old Parrot-nose back before I leave, and I will.
        - id: ch01-b57
          speaker: richard
          text: "Before you leave? Where are you going?"
        - id: ch01-b58
          speaker: edred
          text: "Elfrida and I are going away."
        - id: ch01-b59
          speaker: narrator
          text: >-
            Then Edred realized there was no use explaining. After the Edred from 1908 went home, the Edred and Elfrida of 1605 would still be here. At least, they would if... But he had no time for those old questions. Instead he spoke with a firm confidence Elfrida would have been amazed and delighted to hear.
        - id: ch01-b60
          speaker: edred
          text: >-
            I have two things to do. First, I must rescue Elfrida from the Tower. Then I mean to get even with old Parrot-nose, and Elfrida will enjoy helping with that.
        - id: ch01-b61
          speaker: narrator
          text: >-
            The boys were up on the lead roof, with their backs against a chimney and their faces toward the trapdoor. It was bitterly cold and the north wind blew hard, but this was one of the few places where Mr. Parrot-nose could not creep up behind them and listen.
        - id: ch01-b62
          speaker: richard
          text: "Get her out of the Tower? If only we could!"
          emotion: sad
        - id: ch01-b63
          speaker: narrator
          text: >-
            Richard laughed, then grew sad.
        - id: ch01-b64
          speaker: edred
          text: >-
            We can. I've thought about it ever since we left the Tower, and I know how to do it. I need your help, Dick, and the help of one grown-up.
        - id: ch01-b65
          speaker: richard
          text: "One grown-up?"
        - id: ch01-b66
          speaker: edred
          text: "I think Nurse will do. I only need to find out whether we can trust her."
        - id: ch01-b67
          speaker: richard
          text: >-
            Trust her? She would die for any Arden. Why, she would endure the rack before betraying even the smallest word spoken by one of us.
        - id: ch01-b68
          speaker: edred
          text: "Then that part is settled."
        - id: ch01-b69
          speaker: richard
          text: "What is your plan?"
        - id: ch01-b70
          speaker: narrator
          text: >-
            Richard did not laugh, though he might have wanted to. Edred looked so small and weak, while the Tower was so huge and strong.
        - id: ch01-b71
          speaker: edred
          text: >-
            I'm going to rescue Elfrida the way Lady Nithsdale rescued her husband. It should be easy. Everything depends on knowing when the guard changes, and I do know.
        - id: ch01-b72
          speaker: richard
          text: "How did Lady Nithsdale get Lord Nithsdale out, and where was he imprisoned?"
        - id: ch01-b73
          speaker: edred
          text: "Why, she got him out of the Tower. You know—"
        - id: ch01-b74
          speaker: narrator
          text: >-
            Then Edred remembered that Richard did not know and could not know. Lord Nithsdale had not yet escaped the Tower. He had not even entered it, and perhaps he had not been born.
        - id: ch01-b75
          speaker: edred
          text: "Never mind. I'll tell you the whole story of Lady Nithsdale."
        - id: ch01-b76
          speaker: narrator
          text: >-
            So Edred told Richard a rather vague but wonderfully inspiring version of that wise and brave lady's story. I have no time to tell it to you, but any grown-up who knows history will be delighted to do so.
        - id: ch01-b77
          speaker: narrator
          text: >-
            Richard listened with very flattering attention, although dusk was falling and the air grew colder. Lamps came on inside the house, turning the open trapdoor into a yellow square. Then a shadow crossed that square. Richard pinched Edred's arm.
        - id: ch01-b78
          speaker: richard
          text: >-
            Come, let us return to our books. Good boys behave while their tutor is away exactly as they would if he were present. I feel as if our tutor is present, so I must be a very good boy indeed.
        - id: ch01-b79
          speaker: narrator
          text: >-
            The shadow vanished at once. Choking back their laughter, the boys went downstairs and learned their lessons by two guttering tallow candles set in solid silver candlesticks.
        - id: ch01-b80
          speaker: narrator
          text: >-
            The next day, Edred persuaded the old nurse to take him to Court. Because the Queen was fond of Lady Arden, he actually gained an audience with Her Majesty. Even better, she gave him permission to visit his father and sister in the Tower.
        - id: ch01-b81
          speaker: narrator
          text: >-
            The Queen wrote the permission with her own hand. Her order told the Lieutenant of the Tower to admit Master Edred Arden, Master Richard Arden, and one attendant. After that, the old nurse became very busy with her sewing. Two full days went by. All the while, Mr. Parados rapped the boys' fingers, scolded them, and glared at them. He could not understand why they accepted every punishment so patiently.
        - id: ch01-b82
          speaker: narrator
          text: >-
            Then the day arrived. It was fiercely cold, and snow began to fall as the afternoon faded.
        - id: ch01-b83
          speaker: nurse
          text: "So much the better. Yes, so much the better."
        - id: ch01-b84
          speaker: narrator
          text: >-
            The Tower guard changed at dusk. A quarter of an hour before then, Lord Arden's carriage stopped at the gate. An old nurse climbed down in a ruff, cap, and red cloak. She helped out two young gentlemen. Edred wore black and a squirrel-trimmed cloak. Richard wore gray velvet and marten fur. The Lieutenant came, read the Queen's order, and nodded kindly to Edred. All three went inside.
        - id: ch01-b85
          speaker: narrator
          text: >-
            As they crossed the yard toward Lord Arden's rooms in the White Tower, thick snow landed on their cloaks and furs and froze there. The cold was that sharp.
        - id: ch01-b86
          speaker: nurse
          text: "So much the better."
        - id: ch01-b87
          speaker: narrator
          text: >-
            Elfrida was sitting on Lord Arden's knee when the visitors entered. She sprang up with a glad cry and hugged Edred tightly.
        - id: ch01-b88
          speaker: edred
          text: "Go with Nurse. Whatever she tells you, do it."
        - id: ch01-b89
          speaker: narrator
          text: >-
            He whispered into the hug.
        - id: ch01-b90
          speaker: elfrida
          text: "But I've written a piece of poetry, and now you're here—"
        - id: ch01-b91
          speaker: edred
          text: >-
            Do as you're told. We have to get you out. Don't be a duffer. Think of Lady Nithsdale.
        - id: ch01-b92
          speaker: narrator
          text: >-
            Elfrida had never heard him speak so fiercely. She forgot her poetry and understood. Letting go of Edred, she ran back to Lord Arden, threw her arms around his neck, and kissed him again and again.
        - id: ch01-b93
          speaker: lord_arden
          text: "There, there, my girl. There, there."
        - id: ch01-b94
          speaker: narrator
          text: >-
            He gently patted her shoulder while she cried.
        - id: ch01-b95
          speaker: nurse
          text: "Come to your chamber with me. I need to measure you for a new gown and petticoat."
        - id: ch01-b96
          speaker: narrator
          text: >-
            Elfrida only clung to Lord Arden more tightly.
        - id: ch01-b97
          speaker: lord_arden
          text: "She does not want to leave her father. Do you, my girl?"
        - id: ch01-b98
          speaker: elfrida
          text: "No, no! I don't want to leave my daddy!"
          emotion: sad
        - id: ch01-b99
          speaker: lord_arden
          text: >-
            Come now. It will only take as long as the measuring. The sooner you go, little lamb, the sooner you can come back.
        - id: ch01-b100
          speaker: elfrida
          text: "Goodbye, my dear, dear, dear daddy! Oh, my dear daddy, goodbye!"
          emotion: sad
        - id: ch01-b101
          speaker: narrator
          text: >-
            Suddenly she stood up.
        - id: ch01-b102
          speaker: nurse
          text: >-
            What a fuss over a new dress! I have no patience with this child.
        - id: ch01-b103
          speaker: narrator
          text: >-
            Speaking crossly, the nurse seized Elfrida's hand and pulled her into the next room. Then she dropped to her knees and began undoing the girl's gown.
        - id: ch01-b104
          speaker: nurse
          text: >-
            Now, we haven't a moment to waste. Hold your handkerchief over your face and look as if you're crying when we leave. Why, you are crying already. So much the better!
        - id: ch01-b105
          speaker: narrator
          text: >-
            From beneath her broad hoop and petticoat, the nurse drew a little black suit exactly like Edred's. The cap, cloak, stockings, and shoes all matched his perfectly. Before Elfrida had finished crying, she looked exactly like her brother except for her face, and the handkerchief would hide that.
        - id: ch01-b106
          speaker: narrator
          text: >-
            The nurse hurried to the apartment door and addressed the guard.
        - id: ch01-b107
          speaker: nurse
          text: >-
            Good sir, my little master is ill. He is too frail for such sad meetings and still sadder farewells. Please guide us to the outer gate, so I can find our coach and take him home. Then I shall return for my other charge, his noble cousin.
        - id: ch01-b108
          speaker: tower_guard
          text: >-
            Is that so? Poor child! Well, such is life, mistress. We all have our tears to shed.
        - id: ch01-b109
          speaker: narrator
          text: >-
            The guard spoke kindly, but he could not leave his post at Lord Arden's door. He told them the way instead. They crossed the courtyard alone while snow fell on their cloaks and froze.
        - id: ch01-b110
          speaker: narrator
          text: >-
            At the gate, the guard remembered seeing an old nurse and two small boys enter through the snow. Now he saw an old nurse and one snow-covered boy leave. The child appeared to be crying bitterly. The nurse explained that this was only natural after seeing his dear father and sister imprisoned.
        - id: ch01-b111
          speaker: nurse
          text: >-
            I will take him to our coach, good sirs, and come back for my other charge, young Master Richard Arden.
        - id: ch01-b112
          speaker: narrator
          text: >-
            With that, she brought Elfrida through the gate in her boy's clothes and bundled her into the waiting carriage. By arrangement, the coachman slept on his box and the footman refreshed himself at a nearby tavern.
        - id: ch01-b113
          speaker: nurse
          text: "Under the seat."
        - id: ch01-b114
          speaker: narrator
          text: >-
            She pushed Elfrida inside, shut the carriage door, and left her crouching among the straw beneath the seat.
        - id: ch01-b115
          speaker: narrator
          text: >-
            So far, everything had worked. The most dangerous part was still ahead. The nurse easily reentered through the gate whose guard had just seen her leave. As she crossed the snowy courtyard, she heard stamping feet beneath the arch. The replacement soldiers had arrived to take over the watch. Again, so far, so good.
        - id: ch01-b116
          speaker: narrator
          text: >-
            The danger lay with the guard outside Lord Arden's rooms, and with whoever might still be waiting at the outer gate. The old guards expected the nurse to come back with one little boy. If any of them lingered long enough to see her leave with two, the trick would be discovered. But there was no choice. They had to risk it. The nurse stood quietly in a corner while Lord Arden talked with the boys. She waited as long as she dared, giving the old watch every possible moment to move away. By the time she finally spoke, she already knew that a new guard stood outside the room.
        - id: ch01-b117
          speaker: nurse
          text: "The visit is over, my lord."
        - id: ch01-b118
          speaker: edred
          text: "Now we do it."
        - id: ch01-b119
          speaker: narrator
          text: >-
            Edred and Richard followed the nurse down the narrow stairs and across the white courtyard. The new guard saw one woman and two boys. Its captain read the Queen's paper, which the nurse had carefully reclaimed from the Lieutenant. The order plainly said that Master Edred Arden, Master Richard Arden, and their attendant had entered. Now those same three people appeared to leave, so the guard let them pass.
        - id: ch01-b120
          speaker: narrator
          text: >-
            Two minutes later, the great coach rumbled through the snowy streets. Inside, four people hugged one another in delight. Their trick had worked.
        - id: ch01-b121
          speaker: richard
          text: >-
            Edred thought of the plan. He arranged every part of it and carried it through.
        - id: ch01-b122
          speaker: narrator
          text: >-
            Richard said this because honor required it.
        - id: ch01-b123
          speaker: elfrida
          text: "How splendid of him!"
          emotion: happy
        - id: ch01-b124
          speaker: narrator
          text: >-
            It was rather splendid of Elfrida not to spoil Edred's pride in the first adventure he had ever planned and completed all by himself. She could easily have pointed out that the whole plan was unnecessary. They might simply have found a corner in the Tower and recited poetry to the Mouldiwarp.
        - id: ch01-b125
          speaker: narrator
          text: >-
            At last they reached Arden House. The coachman appeared to be asleep again. After the front door was opened, the footman went around the carriage and busied himself with the harness. The nurse quickly sent the servant who answered the door away to order an immediate meal for Master Arden and Master Richard. Everything fell into place so neatly that no one saw the children arrive together. Two little boys had left Arden House that afternoon, while three came back that evening, and not a single person noticed the difference.
        - id: ch01-b126
          speaker: narrator
          text: >-
            The nurse led them into the parlor and closed the door.
        - id: ch01-b127
          speaker: nurse
          text: >-
            Master Richard, go and take off your fine suit. Miss Arden, change your clothes in the little room. Master Edred, you stay here with me.
        - id: ch01-b128
          speaker: narrator
          text: >-
            The others obeyed. Then the nurse stood staring at Edred, her eyes growing wider and somehow different. Edred stared back, his own eyes becoming rounder and rounder.
        - id: ch01-b129
          speaker: edred
          text: "Why, you're the witch! The witch we brought tea and food to!"
          emotion: surprised
        - id: ch01-b130
          speaker: nurse
          text: >-
            And what if I am? Do you imagine you two are the only people who can travel into other times? You are not the whole world yet, Master Arden of Arden. Still, you have the makings of a fine boy and a fine man. I believe these ancient days have taught you something.
        - id: ch01-b131
          speaker: narrator
          text: >-
            There was no doubt that Edred had learned something in those ancient days. Perhaps the change began when people thought him important enough to imprison in the Tower. Perhaps it grew out of his long talks with Sir Walter Raleigh, that brilliant man and great gentleman. Or perhaps Mr. Parados's endless knuckle-rapping and scowling had helped in its own unpleasant way. No one can say for certain. What is certain is that this adventure began a change in Edred. In time, that change would make him “brave and kind and wise,” just as the old rhyme had told him he must be.
        - id: ch01-b132
          speaker: nurse
          text: >-
            We haven't a moment to waste. They have discovered our trick at the Tower already. You must return to your own time.
        - id: ch01-b133
          speaker: narrator
          text: >-
            Elfrida came back in her own clothes, her eyes openly asking what had happened.
        - id: ch01-b134
          speaker: edred
          text: "She's the witch."
        - id: ch01-b135
          speaker: nurse
          text: "There is no time to waste."
        - id: ch01-b136
          speaker: edred
          text: "I have to get even with old Parados first."
        - id: ch01-b137
          speaker: narrator
          text: >-
            And so he did. It took exactly twenty minutes. I shall tell you what happened afterward.
        - id: ch01-b138
          speaker: narrator
          text: >-
            Once Edred had paid Mr. Parados back, the old nurse sent Richard to bed. Elfrida hurried to explain her difficulty.
        - id: ch01-b139
          speaker: elfrida
          text: >-
            I did write some poetry to summon the Mouldiwarp, but it's all about the Tower, and we aren't there anymore. There's no point saying, “Oh, Mouldiwarp, you have the power to get us out of this beastly Tower,” when we aren't in the Tower. And I can't think of anything else, and—
        - id: ch01-b140
          speaker: nurse
          text: >-
            Never mind the poetry. Poetry is well enough for children, but I know a trick worth two of that.
        - id: ch01-b141
          speaker: narrator
          text: >-
            She took them into the dining room. The sideboard there was covered in silver. She set down her candle, lifted a great salver engraved with the Arden arms, and placed it on the table. Then she breathed over the silver and drew triangles and a circle in the mist. Her breath faded, the surface shone clear again, and suddenly the living white Mouldiwarp of Arden sat in the middle of the salver, looking extremely cross.
        - id: ch01-b142
          speaker: mouldiwarp
          text: >-
            You have no manners! You drag me here in that rude, offhand way without saying “with your leave” or “by your leave.” Elfrida could easily have made a poem. You know those triangles and things actually hurt me. Poetry is so simple.
          emotion: angry
        - id: ch01-b143
          speaker: nurse
          text: >-
            Poetry is too slow for tonight's business. Come, take the children away. I have finished with the matter.
        - id: ch01-b144
          speaker: mouldiwarp
          text: >-
            You make everything difficult. That is always the trouble with people who know a little, pretend it is a lot, and think they know everything. If I had come by the easy poetry method, I could have carried them back just as easily. But now... well, nothing can be done about it. I shall take them, of course, but they won't enjoy the way. They must climb to the roof and jump off.
          emotion: angry
        - id: ch01-b145
          speaker: nurse
          text: "I do not believe that is necessary."
        - id: ch01-b146
          speaker: mouldiwarp
          text: "Very well. Take them back yourself, then."
        - id: ch01-b147
          speaker: narrator
          text: >-
            The Mouldiwarp actually began to disappear.
        - id: ch01-b148
          speaker: elfrida
          text: "No, no! We'll do anything you tell us."
        - id: ch01-b149
          speaker: nurse
          text: "There is a foot of snow on the roof."
        - id: ch01-b150
          speaker: mouldiwarp
          text: "So much the better. So much the better. You ought to know that."
        - id: ch01-b151
          speaker: nurse
          text: "You think you're very clever."
        - id: ch01-b152
          speaker: mouldiwarp
          text: "Not half as clever as I am."
        - id: ch01-b153
          speaker: narrator
          text: >-
            Elfrida thought this rather unreasonable. Then a tremendous pounding at the front door broke the night's silence.
        - id: ch01-b154
          speaker: mouldiwarp
          text: >-
            There! Run to the roof for your lives! And I am not at all certain you still have time.
        - id: ch01-b155
          speaker: narrator
          text: >-
            Outside the dining room, the pounding at the front door grew louder and louder with every blow.
