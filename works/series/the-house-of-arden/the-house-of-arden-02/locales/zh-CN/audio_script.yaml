audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 亲切从容，带一点温和的幽默
        timbre: 温暖清亮
        pace: 舒缓而有变化
        pitch: 中等
    edred:
      display_name: 埃德雷德
      tts:
        delivery: 聪明好胜，认真里带着孩子气
        timbre: 清脆明亮的男孩声
        pace: 自然偏快
        pitch: 中高
    elfrida:
      display_name: 埃尔弗丽达
      tts:
        delivery: 直率活泼，敏锐又有主意
        timbre: 清亮的女孩声
        pace: 轻快
        pitch: 高
    aunt_edith:
      display_name: 伊迪丝姑妈
      tts:
        delivery: 温柔能干，疲惫时仍带着幽默
        timbre: 柔和温暖
        pace: 从容
        pitch: 中等
    mole:
      display_name: 鼹鼠精
      tts:
        delivery: 脾气暴躁，古怪又爱挖苦人
        timbre: 尖细干涩
        pace: 偏快，抱怨时一气呵成
        pitch: 偏高
    mrs_honeysett:
      display_name: 霍尼塞特太太
      tts:
        delivery: 慈爱爽利，带着老式管家的礼数
        timbre: 柔和饱满
        pace: 从容
        pitch: 中等
    old_lady:
      display_name: 老太太
      tts:
        delivery: 严厉刻板，时刻端着长辈的威严
        timbre: 干净偏硬的老年女声
        pace: 缓慢分明
        pitch: 中低
    old_gentleman:
      display_name: 老先生
      tts:
        delivery: 庄重古板，训话时不容置疑
        timbre: 浑厚平直的老年男声
        pace: 稳缓
        pitch: 低
  chapters:
    - id: ch01
      title: 鼹鼠精
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 可不是吗。眼前的小家伙，就是白皮书封面上那只像小猪的动物。它原先浑身金灿灿的，印在方格盾徽上。如今它来到小丘的百里香草地上，还在发着金光。孩子们站着一动不动，生怕把它吓跑。这个金色的小活物就在他们脚边走来走去，小鼻子焦躁地一会儿转向左，一会儿转向右。
        - id: ch01-b02
          speaker: elfrida
          text: 真的是它。
        - id: ch01-b03
          speaker: narrator
          text: 埃尔弗丽达声音轻极了，怕惊动它。
        - id: ch01-b04
          speaker: edred
          text: 你说是什么？
        - id: ch01-b05
          speaker: narrator
          text: 其实他心里明白得很。
        - id: ch01-b06
          speaker: elfrida
          text: 就是白皮书上的那只呀。我们就是在那本书里找到咒语的。
        - id: ch01-b07
          speaker: edred
          text: 那是我们的族徽，放在纹章顶上的。曾祖父的旧鼻烟盒上也有。
        - id: ch01-b08
          speaker: elfrida
          text: 那就对了。是我们家的族徽活过来了。
        - id: ch01-b09
          speaker: edred
          text: 别自作聪明。咒语说的是“家徽”，我可不信家徽就是族徽。家徽应该是韭葱、玫瑰、蓟花那一类，能戴在帽子上。这个嘛，我才不戴。
        - id: ch01-b10
          speaker: narrator
          text: 金色的小东西仍在他们脚边小心移动。
        - id: ch01-b11
          speaker: edred
          text: 嗨，这不就是一只普普通通的老鼹鼠吗？
        - id: ch01-b12
          speaker: elfrida
          text: 才不是。这是我们自家的族徽，调羹上也有它。阿登家的古老鼹鼠族徽，怎么会是普通鼹鼠？你看，它全身都是金色的。
        - id: ch01-b13
          speaker: narrator
          text: 可话还没说完，最后一点太阳就沉到了丘陵肩头后面。金光跟着消失了。灰蒙蒙的暮色里，那只鼹鼠分明是白色的，谁都看得出来。
        - id: ch01-b14
          speaker: elfrida
          text: 啊！那不是更能证明它不是真鼹鼠吗？真鼹鼠都是黑的。
          emotion: surprised
        - id: ch01-b15
          speaker: edred
          text: 好吧，它倒是一点也不怕人。这一点我承认。那么……
        - id: ch01-b16
          speaker: mole
          text: 那么？
        - id: ch01-b17
          speaker: narrator
          text: 四下顿时没了声音。过了一会儿，埃尔弗丽达才开口。
        - id: ch01-b18
          speaker: elfrida
          text: 刚才是你在说话吗？
          emotion: surprised
        - id: ch01-b19
          speaker: edred
          text: 不是我。是你说的。
        - id: ch01-b20
          speaker: mole
          text: 别在那儿嘀嘀咕咕的。这可不算懂规矩，俺告诉恁。
        - id: ch01-b21
          speaker: narrator
          text: 两个孩子一起跪下来，一人守在白鼹鼠一边。
        - id: ch01-b22
          speaker: edred
          text: 我说！
          emotion: surprised
        - id: ch01-b23
          speaker: mole
          text: 得了吧。别装不知道。鼹鼠精嘴里也有舌头，跟恁们一样。
        - id: ch01-b24
          speaker: elfrida
          text: 可是，光有舌头也不能说话吧？
        - id: ch01-b25
          speaker: narrator
          text: 鼹鼠精的毛都微微竖了起来。
        - id: ch01-b26
          speaker: mole
          text: 少来教俺。没人给恁们讲过童话吗？俺们走兽都有舌头，到了那地方，自然就能说话。
        - id: ch01-b27
          speaker: edred
          text: 到了什么地方？
        - id: ch01-b28
          speaker: narrator
          text: 埃德雷德一向不大喜欢童话。现在他竟然非得相信童话不可，心里很不痛快。
        - id: ch01-b29
          speaker: mole
          text: 当然是童话里。不然恁以为自己在世上什么地方？
        - id: ch01-b30
          speaker: edred
          text: 我们就在这里，在阿登丘上。
        - id: ch01-b31
          speaker: narrator
          text: 他踢了踢地面，好叫脚下显得更实在，自己心里也更踏实。
        - id: ch01-b32
          speaker: mole
          text: 阿登丘就不在童话里吗？恁说得倒轻巧。是恁们叫俺来的，俺也来了。到底想要什么？
        - id: ch01-b33
          speaker: elfrida
          text: 你是不是……阿登家徽？
        - id: ch01-b34
          speaker: narrator
          text: 惊奇、害怕、欢喜、希望、诧异，还有好几样连她自己也说不清的感受，一起涌上了埃尔弗丽达的心头。这么多感觉全凑在一起，通常就叫百感交集。
        - id: ch01-b35
          speaker: mole
          text: 俺当然是。至少是家徽剩下的这么一点儿。俺做梦也想不到，有一天会被阿登家的少爷小姐叫出来，偏偏他们连自己想要什么都弄不明白。快说吧，恁们要什么？
        - id: ch01-b36
          speaker: elfrida
          text: 咒语里不是已经告诉你了吗？
        - id: ch01-b37
          speaker: mole
          text: 哦，就那些？没别的了？俺得叫他变得又勇敢又聪明，还得领他去看宝藏。软蛋！
          emotion: angry
        - id: ch01-b38
          speaker: narrator
          text: 最后两个字来得又猛又凶，简直像一口啐在埃德雷德脸上。他的脸顿时红得像火鸡。
        - id: ch01-b39
          speaker: edred
          text: 我才不是软蛋。不管怎么说，进屋的人是我，找到咒语的人也是我。
          emotion: angry
        - id: ch01-b40
          speaker: mole
          text: 是啊，可从头到尾一直在找的是谁？是她。老天，俺当时就在那儿，什么都知道。要是领她去看宝藏，倒还说得过去。
        - id: ch01-b41
          speaker: elfrida
          text: 我觉得你这样太不公平了。他要是本来就又勇敢又聪明，我们干吗还要请你帮他变成那样？
        - id: ch01-b42
          speaker: mole
          text: 没恁什么事。
        - id: ch01-b43
          speaker: edred
          text: 当然有她的事。我得到的东西，都要跟她一人一半。你要真能让我变聪明，我也会把学到的全教给她。不过我不信你做得到。就是不信。
        - id: ch01-b44
          speaker: mole
          text: 那恁信俺会说话吗？
        - id: ch01-b45
          speaker: edred
          text: 不信。你只是个梦，是我做梦梦见的。
        - id: ch01-b46
          speaker: mole
          text: 那恁怎么想？
        - id: ch01-b47
          speaker: narrator
          text: 鼹鼠精转向埃尔弗丽达。她迟疑了一会儿。
        - id: ch01-b48
          speaker: elfrida
          text: 我想，天越来越黑了，伊迪丝姑妈会担心我们。你能不能改天再来？今晚已经来不及把我们变得勇敢又聪明了。
        - id: ch01-b49
          speaker: mole
          text: 那是肯定来不及。
        - id: ch01-b50
          speaker: edred
          text: 那你可以先告诉我们，宝藏在哪儿。
        - id: ch01-b51
          speaker: mole
          text: 那个得留到最后，贪心鬼。俺先得把恁变得善良又聪明。照眼下这样看，俺可有得忙了。晚安。
        - id: ch01-b52
          speaker: narrator
          text: 它开始往远处走。
        - id: ch01-b53
          speaker: elfrida
          text: 啊，别走！你走了，我们再也找不到你了。这可太糟了！
          emotion: sad
        - id: ch01-b54
          speaker: narrator
          text: 鼹鼠停了下来。
        - id: ch01-b55
          speaker: mole
          text: 俺非得让恁们再找到俺不可。别这么难过。要找俺，就到小丘上来，念首诗叫俺，俺自然会来。
        - id: ch01-b56
          speaker: edred
          text: 那要念什么诗？
        - id: ch01-b57
          speaker: mole
          text: 什么都成，随恁们挑。不过，不是恁们自己编的可没用。
        - id: ch01-b58
          speakers: [edred, elfrida]
          ensemble: duo
          text: 啊！
          emotion: sad
        - id: ch01-b59
          speaker: mole
          text: 而且诗里得客客气气地请俺来。快回家吧。
        - id: ch01-b60
          speaker: elfrida
          text: 那你去哪儿？
        - id: ch01-b61
          speaker: mole
          text: 当然也回家。
        - id: ch01-b62
          speaker: narrator
          text: 这一回，它真的走了。两个孩子一言不发，转身朝阿登赫斯特车站的灯光走去。一直到草地尽头，脚下出现大路，埃德雷德才带着敬畏开了口。
        - id: ch01-b63
          speaker: edred
          text: 我说！
        - id: ch01-b64
          speaker: elfrida
          text: 是啊……可不是吗？
        - id: ch01-b65
          speaker: narrator
          text: 他们又沉默下来，一直走到车站。站里有灯光，有脚夫和乘客的说话声，信号索哗啦啦地响，火车信号铃也叮叮作响。这些寻常声音产生了一种奇特的作用，仿佛一个早就起床的人，拿一块湿海绵在熟睡者脸上抹了一把。他们一下从梦里醒了。幸好火车很快进站，两人一上车就说个不停，一路说到悬崖门车站。下车以后，他们又一路说回了家。
        - id: ch01-b66
          speaker: narrator
          text: 到了那栋有绿色阳台、黄铜门环已经擦得平滑浅淡又锃亮的房子前，他们终于作出了决定，还是什么都别告诉别人。孩子们遇上魔法历险以后，几乎总会这么决定。正如我一再说过的，真正奇妙的事就有这个麻烦。想把亲身经历讲给那些既不愿相信、又根本不能相信的人听，实在太难了。
        - id: ch01-b67
          speaker: narrator
          text: 伊迪丝姑妈还没回来。孩子们正在洗手洗脸，准备吃晚饭，她便到家了，还带回了埃德雷德的生日礼物。这些礼物比他三年来收到的任何礼物都好，数量也更多。有一盒种类多得惊人的巧克力、一箱工具、一根漂亮极了的板球棒、一个板球和一副三柱门，还有一盒像甲虫背一样发亮的颜料。每种颜色都是完整的一块，不像平常收到的礼物颜料，里面总只有半块。盒里还有几支漂亮画笔，两支是驼毛笔，一支是紫貂毛笔。那支紫貂毛笔的尖儿细得不能再细。
        - id: ch01-b68
          speaker: edred
          text: 姑妈，你真好！
          emotion: happy
        - id: ch01-b69
          speaker: narrator
          text: 他紧紧抱住姑妈的腰。因为实在太快活了，他比平日也慷慨了些。
        - id: ch01-b70
          speaker: edred
          text: 你真的太好了。我不用颜料盒的时候，埃尔弗丽达随时都可以用，也可以用驼毛笔。不过紫貂毛笔当然不行。
        - id: ch01-b71
          speaker: elfrida
          text: 哦，埃德雷德，你可真够朋友！
          emotion: happy
        - id: ch01-b72
          speaker: aunt_edith
          text: 我也给埃尔弗丽达带了东西。啊，在这儿！
        - id: ch01-b73
          speaker: narrator
          text: 伊迪丝姑妈在一大堆沙沙作响的牛皮纸、薄纸、细绳、硬纸板和刨花里摸索起来。这些全是埃德雷德的礼物拆下来的外壳。她终于摸出一本红书，书脊和封面上都印着金色图画，书名叫《护身符》。这回轮到埃尔弗丽达搂住姑妈的腰，告诉她，她有多么好。
        - id: ch01-b74
          speaker: aunt_edith
          text: 现在吃晚饭吧。有烤鸡、醋栗派，还有奶油。
        - id: ch01-b75
          speaker: narrator
          text: 孩子们早已习惯晚饭吃温吞又乏味的面包牛奶。这一顿饭，简直成了当天所有奇迹的顶峰。那又是怎样的一天啊！他们吃着焦黄的烤鸡，配着面包酱、肉汁和填馅，后面还有醋栗派和奶油。吃饭时，伊迪丝姑妈讲起了自己这一天的经历。
        - id: ch01-b76
          speaker: aunt_edith
          text: 那真的就是一艘船。它带来的最好消息是，从今以后，我们再也不用出租房间了。
        - id: ch01-b77
          speakers: [edred, elfrida]
          ensemble: duo
          text: 好哇！
          emotion: happy
        - id: ch01-b78
          speaker: aunt_edith
          text: 往后我们手头会宽裕一些，日子也能过得舒服些。你们还能去一所真正的好学校。猜猜看，我们要搬到哪儿去住？
        - id: ch01-b79
          speaker: elfrida
          text: 不会是……不会是城堡吧？
        - id: ch01-b80
          speaker: aunt_edith
          text: 咦，你怎么猜到的？
          emotion: surprised
        - id: ch01-b81
          speaker: narrator
          text: 埃尔弗丽达看了看埃德雷德。他赶紧咽下一大口鸡肉。
        - id: ch01-b82
          speaker: edred
          text: 姑妈，你可别生气。我们今天去阿登了。你说过，今年我们可以去的。
        - id: ch01-b83
          speaker: narrator
          text: 于是，整个故事都说了出来，完完整整，一直讲到他们念出咒语。
        - id: ch01-b84
          speaker: aunt_edith
          text: 后来有事情发生吗？
        - id: ch01-b85
          speaker: narrator
          text: 孩子们听出她只是感兴趣，并没有因为他们做的事生气，都松了口气。
        - id: ch01-b86
          speaker: elfrida
          text: 嗯……我们看见了一只鼹鼠……
        - id: ch01-b87
          speaker: narrator
          text: 伊迪丝姑妈笑了起来。埃德雷德赶紧截住妹妹的话。
        - id: ch01-b88
          speaker: edred
          text: 故事就讲到这里，姑妈。我真的是阿登勋爵，对不对？
        - id: ch01-b89
          speaker: aunt_edith
          text: 对。你就是阿登勋爵。
        - id: ch01-b90
          speaker: edred
          text: 啊，太棒了！
          emotion: happy
        - id: ch01-b91
          speaker: narrator
          text: 埃德雷德满脸喜气。姑妈只好把自己在火车上准备的那篇小训词先收起来。那篇话讲的是英国贵族应负的责任，不过她想，以后总有机会再说。接着，她转向正急着等答案的埃尔弗丽达，回答了她的问题。
        - id: ch01-b92
          speaker: aunt_edith
          text: 不，宝贝儿。
        - id: ch01-b93
          speaker: elfrida
          text: 他是勋爵，那我就应该是贵夫人才对。这不公平。
        - id: ch01-b94
          speaker: edred
          text: 别在意，老妹。只要你愿意，我随时都叫你阿登夫人。
        - id: ch01-b95
          speaker: aunt_edith
          text: 那么，你们愿意现在就搬去城堡住吗？
        - id: ch01-b96
          speakers: [edred, elfrida]
          ensemble: duo
          text: 今晚吗？
          emotion: surprised
        - id: ch01-b97
          speaker: aunt_edith
          text: 不，不，是下星期。我还得设法把这栋房子租出去，会忙得很。以前替你们远房舅公管家的霍尼塞特太太写信给律师，问我们愿不愿意雇她。我小时候就认识她。她人很好，还会唱许多老歌。我留在这里收尾、打发房客，你们愿意先跟她住在城堡里吗？哦，那只铃又响了！我看，我们在城堡里一只铃也别装，好不好？
        - id: ch01-b98
          speaker: narrator
          text: 事情就这么定了。姑妈留在有凸肚窗的房子里，安置要随房出租的新家具，还要把真正属于阿登家的漂亮旧物件一件件装箱。两个孩子坐上运货人的马车，把衣服和玩具带去城堡，足足装满了两个黑箱子。他们心里也装着整整一个世界的快乐期盼。
        - id: ch01-b99
          speaker: narrator
          text: 霍尼塞特太太行了个漂亮的老式屈膝礼，接着顺势把两个孩子一起搂进怀里。
        - id: ch01-b100
          speaker: mrs_honeysett
          text: 欢迎回到自己家，我的领主。也欢迎你，小姐，我的宝贝。谁都看得出来，你们俩都是阿登家的人。阿登家一向是一男一女，一个男孩，一个女孩。
        - id: ch01-b101
          speaker: narrator
          text: 她一条胳膊搂着一个孩子。她有一张温柔耐心的脸，那双淡蓝色的大眼睛一笑就闪闪发亮。而她只要看见两个孩子，几乎总是在微笑。
        - id: ch01-b102
          speaker: narrator
          text: 亲手打开自己的箱子，感觉实在太好了。他们把衣裳一件件放进长长的雪松木抽屉。抽屉面是弯曲光亮的桃花心木。他们拉开整洁的细棉布帘，窗上镶着一格格菱形小玻璃，这些窗子历来都属于阿登家。向外望去，眼前能看到的土地从前也全属于他们家，不知已经有多少阿登家的人站在这里这样眺望过。如今土地虽然早已换了主人，可对十岁和十二岁孩子心里的浪漫念头，几乎没有半点妨碍。
        - id: ch01-b103
          speaker: narrator
          text: 接着，他们走下属于自家的平缓楼梯。楼梯擦得光亮，墙上挂着阿登家先人的画像。他们来到属于自家的护墙板客厅，看见桌上已经摆好两个人的餐具，正等着他们吃午饭。霍尼塞特太太给他们盛好面糊烤香肠，便留下他们自己吃。她刚一出去，埃德雷德就说了下面这句话。我觉得他这样做很可爱。
        - id: ch01-b104
          speaker: edred
          text: 阿登夫人，要我递些土豆给你吗？
        - id: ch01-b105
          speaker: narrator
          text: 埃尔弗丽达听见这声称呼，快活地咯咯笑起来。客厅里摆着的，正是他们熟悉又喜欢的那一类老式家具。矮矮的长窗外面，有一座窄窄的长花园。四周墙壁都镶着木板，仔细擦亮以后，显出棕中带灰的颜色。
        - id: ch01-b106
          speaker: elfrida
          text: 啊，这里一定有暗门。
        - id: ch01-b107
          speaker: edred
          text: 暗门个鬼！
        - id: ch01-b108
          speaker: narrator
          text: 嘴上虽然这么说，他心里却觉得妹妹说得对。
        - id: ch01-b109
          speaker: elfrida
          text: 我们可以到处探险吗？
        - id: ch01-b110
          speaker: narrator
          text: 午饭后，她向霍尼塞特太太提出这个问题。霍尼塞特太太是女人当中最讨人喜欢的一位，没有拿规矩和危险来吓唬他们，立刻爽快地答应了。
        - id: ch01-b111
          speaker: mrs_honeysett
          text: 为什么不可以？这里全是他的呀，愿上帝保佑他那颗亲爱的心。
        - id: ch01-b112
          speaker: narrator
          text: 于是，两个孩子开始探险。这所房子比他们第一次扮成小偷、在这里度过那个奇妙日子时看到的大得多。他们走着走着，来到一扇蒙着褪色绿呢的门前。霍尼塞特太太特意把它指给他们看。
        - id: ch01-b113
          speaker: mrs_honeysett
          text: 别以为房子只有这些。门后面还有另一半呢。
        - id: ch01-b114
          speaker: narrator
          text: 门后果真还有另一所房子。他们见过的这一半整齐有序，按霍尼塞特太太的说法，处处都用蜂蜡仔细打过。每一件家具都亮得像镜子，也像一个珍藏在心的美好愿望。可绿呢门后面，只有阴影和灰尘。蛛网笼住了窗户，褪色的破窗帘从帘杆上低垂下来，像大教堂里慢慢腐朽的古老战旗。空气里明明没有风，窗帘却还在轻轻摆动。也许，是“声名”那支看不见的号角吹出了旧日的盛景和荣光，那一点气息又拂动了它们。
        - id: ch01-b115
          speaker: narrator
          text: 地毯碎成一片片铺在地板上，家具、走廊和楼梯板上全积着厚厚的灰。卧房里的四柱床，帷幔沾满尘土和锈色，床罩露出飞蛾和老鼠咬出的破洞。一间屋里还放着一只橡木雕花摇篮，破烂的丝绸小被从上面一直拖垂下来。大厨房的炉膛已经很久很久没有生火了，可上一炉留下的灰还躺在那里，灰白一片。炉里袭来一股寒气，四周闻着潮湿，感觉又……
        - id: ch01-b116
          speaker: elfrida
          text: 你觉得这里闹鬼吗？
        - id: ch01-b117
          speaker: edred
          text: 胡扯！
        - id: ch01-b118
          speaker: narrator
          text: 两人继续往前。他们走过一条又一条狭长的走廊。黑框旧版画在墙上挂得歪歪斜斜，蛛网从画上垂下来，像给它们披了一层灰色丧纱。他们又看过许多房间，脚下铺着灰暗不平的老橡木板，壁炉炉架里还留着陈年烟灰，还有很久以前孵出过椋鸟的破巢。
        - id: ch01-b119
          speaker: narrator
          text: 埃德雷德拿出那条一向什么脏活都干过的破手帕，在一扇蒙尘的窗上擦出一小块干净地方。他们挤在一起，隔着那里望向外面起伏的丘陵。这样一看就很明显了，这半边房子其实并不在城堡内部。
        - id: ch01-b120
          speaker: narrator
          text: 等每一扇门都开过，每一间衰败而华丽的屋子都看过，他们走到外面，绕去屋后。这才发现，原来这半边屋子是从城堡伸出来的一侧厢房。一扇扇方形窗户上方，都有雕着花纹的滴水石。所有玻璃都像羊皮纸一样发黄，时间和蜘蛛又替它们蒙上了一层内帘。常春藤密密围住窗户，其中几扇已经几乎完全被遮住了。
        - id: ch01-b121
          speaker: elfrida
          text: 啊，好得简直不像真的。我不敢相信！
          emotion: surprised
        - id: ch01-b122
          speaker: narrator
          text: 她喊了一声，整个人扑倒在草地上。埃德雷德也跟着趴了下来。
        - id: ch01-b123
          speaker: edred
          text: 我不敢相信的，是那只了不得的鼹鼠。
        - id: ch01-b124
          speaker: elfrida
          text: 可我们亲眼看见它了。亲眼看见的事，怎么可能不信？
        - id: ch01-b125
          speaker: edred
          text: 我就能不信。还记得《赫里沃德》里的红伞菌吧？说不定那些薄荷奶油糖中了魔法，让我们做了一场梦。
        - id: ch01-b126
          speaker: elfrida
          text: 那些糖倒真好吃。对了！
        - id: ch01-b127
          speaker: edred
          text: 什么？
        - id: ch01-b128
          speaker: elfrida
          text: 你把叫鼹鼠来的诗编好了吗？
        - id: ch01-b129
          speaker: edred
          text: 你呢？
        - id: ch01-b130
          speaker: elfrida
          text: 还没有，不过我试过了。
        - id: ch01-b131
          speaker: edred
          text: 我也试过。而且已经编好了。
        - id: ch01-b132
          speaker: elfrida
          text: 哦，埃德雷德，你真聪明。快念呀！
          emotion: happy
        - id: ch01-b133
          speaker: edred
          text: 我念了以后，你觉得鼹鼠真会来吗？
        - id: ch01-b134
          speaker: elfrida
          text: 当然会。
        - id: ch01-b135
          speaker: edred
          text: 好吧。我当然想找到宝藏什么的，可我还是不相信它。这件事根本不大可能，我就是这么想的。你说，可能吗？
        - id: ch01-b136
          speaker: elfrida
          text: 《护身符》里还发生过更不可能的事呢。
        - id: ch01-b137
          speaker: edred
          text: 啊，可那是故事。
        - id: ch01-b138
          speaker: elfrida
          text: 鼹鼠说，我们就在故事里。快念你那首诗吧。
        - id: ch01-b139
          speaker: narrator
          text: 埃德雷德慢吞吞地念了起来。
        - id: ch01-b140
          speaker: edred
          text: 鼹鼠，鼹鼠，快出洞口。我知道你眼瞎，可我一点不怕。
        - id: ch01-b141
          speaker: narrator
          text: 埃尔弗丽达急切地四处张望。短短的草皮铺在眼前，爬满常春藤的灰色城墙高高耸立。鸽子在头顶盘旋，又停在窗洞拱顶和屋顶上。有的梳理闪亮的羽毛，有的彼此说着“咕，咕，咕噜咕”，至于这话是什么意思，谁也不知道。可是鼹鼠没有出现，连鼹鼠的影子、梦儿、念头都没有。
        - id: ch01-b142
          speaker: elfrida
          text: 埃德雷德。
        - id: ch01-b143
          speaker: edred
          text: 怎么？
        - id: ch01-b144
          speaker: elfrida
          text: 这真是你自己编的吗？你别生气，可我总觉得从前听过差不多的。
        - id: ch01-b145
          speaker: edred
          text: 我……我是改编的。
        - id: ch01-b146
          speaker: elfrida
          text: 什么？
          emotion: surprised
        - id: ch01-b147
          speaker: edred
          text: 你没在书上看过“改编自法文”吗？我也把它改过了。
        - id: ch01-b148
          speaker: elfrida
          text: 我觉得这样不行。你改了多少？原来的诗是什么样？
        - id: ch01-b149
          speaker: edred
          text: 鼹鼠，鼹鼠，住在洞口。鼹鼠眼睛瞎，我可不在乎。你跟哈里森太太去姑妈那儿的那天，姑妈念给我听的。
        - id: ch01-b150
          speaker: narrator
          text: 他念得闷闷不乐。
        - id: ch01-b151
          speaker: elfrida
          text: 我敢肯定，每一个字都得是你自己编的。你瞧，鼹鼠根本没来。
        - id: ch01-b152
          speaker: edred
          text: 根本就没有什么鼹鼠。
        - id: ch01-b153
          speaker: elfrida
          text: 咱们两个一起使劲想吧。我肯定自己能编诗，只要知道怎么开头。
        - id: ch01-b154
          speaker: edred
          text: 真要有人编，也该是我。你又不是阿登勋爵。
        - id: ch01-b155
          speaker: elfrida
          text: 你太不厚道了。
          emotion: sad
        - id: ch01-b156
          speaker: narrator
          text: 埃德雷德自己也知道她说得对。
        - id: ch01-b157
          speaker: edred
          text: 我倒不介意试试。你来编诗，我来念。
        - id: ch01-b158
          speaker: narrator
          text: 他的口气还带着几分居高临下。埃尔弗丽达趴在草地上，把头埋进双手，苦苦思索。她想了很久，久得额头胀得像一只大甜菜。血液在里头一跳一跳，听起来仿佛教堂大钟在滴答作响。她觉得自己真的就要把诗想出来了。
        - id: ch01-b159
          speaker: edred
          text: 想出来没有？
        - id: ch01-b160
          speaker: narrator
          text: 他偏偏在她觉得自己就要想出来时发问。
        - id: ch01-b161
          speaker: elfrida
          text: 别吵！
          emotion: angry
        - id: ch01-b162
          speaker: narrator
          text: 接着只剩下一片安静。能听见的，只有鸽子和云雀的叫声，还有远处那座红顶农庄传来的母牛哞叫。终于，埃尔弗丽达从双手间抬起头，又把胳膊肘抬离草地。她趴得太久，草茎已经在肘部压出深深的凹痕和一道道细印。
        - id: ch01-b163
          speaker: elfrida
          text: 这样行不行？我念给你听？
        - id: ch01-b164
          speaker: edred
          text: 快吐出来。
        - id: ch01-b165
          speaker: elfrida
          text: “哦，鼹鼠精”……我觉得，比起“鼹鼠”，它大概更愿意听人家这么叫，对不对？然后是，“哦，鼹鼠精，请你快出来，告诉我们怎么开始找起来。”我是说找宝藏。希望它听得懂。
        - id: ch01-b166
          speaker: edred
          text: 这不算诗。
        - id: ch01-b167
          speaker: elfrida
          text: 算的，只要连起来念。哦，鼹鼠精，请你快出来，告诉我们怎么开始找起来。
        - id: ch01-b168
          speaker: edred
          text: 还应该再添几句。
        - id: ch01-b169
          speaker: narrator
          text: 其实，他已经有些佩服了。
        - id: ch01-b170
          speaker: elfrida
          text: 还有……哦，等一等，我马上能想出来。就是怎样找到宝藏，再让埃德雷德变得勇敢、聪明又善良。
        - id: ch01-b171
          speaker: edred
          text: 真要说起来，我已经够善良了。
        - id: ch01-b172
          speaker: elfrida
          text: 哦，我知道你善良。可诗非得押韵，这是规矩。我猜诗人为了押韵，常常只能说些自己不当真的话。
        - id: ch01-b173
          speaker: edred
          text: 好吧，从头到尾念一遍。
        - id: ch01-b174
          speaker: elfrida
          text: 哦，鼹鼠精，请你快出来，告诉我们怎么开始找起来。我是说宝藏怎样才能找到，也让埃德雷德勇敢、聪明、心眼好。
        - id: ch01-b175
          speaker: edred
          text: 你要是有铅笔，我就把它写下来。
        - id: ch01-b176
          speaker: narrator
          text: 埃德雷德掏出一截粉红色粉笔，可两人都没有纸。埃尔弗丽达只好把白衬裙拉开展平，在裙边压上一块大石头，再用双手把布面绷得紧紧的，让埃德雷德照着她口授的词句，一句句写在裙子上。
        - id: ch01-b177
          speaker: narrator
          text: 埃德雷德一遍又一遍地背那几句诗，专心的样子跟平常背《伊夫里战役》时一样。终于，他站了起来。
        - id: ch01-b178
          speaker: edred
          text: 哦，鼹鼠精，请你快出来，告诉我该怎么开始找起来。我是说宝藏怎样才能找到，也让我勇敢又聪明……如果你不介意的话。
        - id: ch01-b179
          speaker: narrator
          text: 话音刚落，白鼹鼠立刻出现了。
        - id: ch01-b180
          speaker: mole
          text: 这回又想干什么？这也叫诗？
          emotion: angry
        - id: ch01-b181
          speaker: elfrida
          text: 这是我一生头一回作诗。也许下一回会好些。
        - id: ch01-b182
          speaker: narrator
          text: 她的两只耳朵烫得通红。
        - id: ch01-b183
          speaker: edred
          text: 我们要你照咒语里说的做。
        - id: ch01-b184
          speaker: mole
          text: 让恁变得勇敢又聪明？这可不是一下子能办成的。那是个长活儿，长得很哪。
          emotion: angry
        - id: ch01-b185
          speaker: elfrida
          text: 别这么凶，亲爱的。既然要花很久，你不是更该早点开始吗？
        - id: ch01-b186
          speaker: mole
          text: 俺可不肯多干一点不该俺干的活。恁先说想要什么，俺兴许会替恁办。
        - id: ch01-b187
          speaker: narrator
          text: 它嘴上仍在抱怨，不过也许是那声“亲爱的”起了作用，它的口气似乎稍微软了一点。
        - id: ch01-b188
          speaker: edred
          text: 我知道自己想要什么，可不知道你办不办得到。
        - id: ch01-b189
          speaker: mole
          text: 哈！
        - id: ch01-b190
          speaker: edred
          text: 我是从埃尔弗丽达送我的生日礼物书里看到的。书里的孩子去了过去。我也想去过去，顺便找到那份宝藏！
        - id: ch01-b191
          speaker: mole
          text: 挑个时代吧。
        - id: ch01-b192
          speaker: narrator
          text: 它慢慢说出这几个字时，那声音听起来已经疲倦得不得了。
        - id: ch01-b193
          speaker: edred
          text: 挑什么？
        - id: ch01-b194
          speaker: mole
          text: 时代。恁想回到什么时候。俺数到十以前还挑不出来，就全都作罢。一、二、三、四……
        - id: ch01-b195
          speaker: narrator
          text: 它一个数接一个数，一路数到了十。两个孩子脑子里空空的，只顾着茫然沉默，始终没能挑出一个时代。
        - id: ch01-b196
          speaker: mole
          text: 九、十。哦，那好吧，恁们只能碰运气了。
        - id: ch01-b197
          speaker: edred
          text: 讨厌！我脑子里一下冒出英国历代国王的所有年份，除了这些，什么也想不起来。
          emotion: angry
        - id: ch01-b198
          speaker: mole
          text: 恁要是真的知道，也算走运。
        - id: ch01-b199
          speaker: narrator
          text: 它显然根本不信。埃德雷德只好低声背起来。
        - id: ch01-b200
          speaker: edred
          text: 征服者威廉，一〇六六。威廉二世，一〇八七。亨利一世，一一〇〇。
        - id: ch01-b201
          speaker: narrator
          text: 鼹鼠听着这些年份，竟然张嘴打了个哈欠。这种时候打哈欠，当然非常无礼。
        - id: ch01-b202
          speaker: elfrida
          text: 别生气，亲爱的。就照你自己的办法帮我们吧。
        - id: ch01-b203
          speaker: mole
          text: 这话才像样。好吧，俺给恁们一条忠告。一整天都不许彼此使坏，然后……
        - id: ch01-b204
          speaker: edred
          text: 你倒好意思说。
        - id: ch01-b205
          speaker: narrator
          text: 埃德雷德仍旧压低声音嘀咕，以为它听不见。可鼹鼠的耳朵比眼睛灵得多，一个字也没漏掉。
        - id: ch01-b206
          speaker: mole
          text: 那好，俺不说了。
        - id: ch01-b207
          speaker: elfrida
          text: 哦，别呀！等我们一整天都对彼此很好，接下来到底要做什么？
        - id: ch01-b208
          speaker: mole
          text: 好吧，等恁们做到了，就去找那扇门。
        - id: ch01-b209
          speaker: elfrida
          text: 哪扇门？
        - id: ch01-b210
          speaker: mole
          text: 就是那扇门。
        - id: ch01-b211
          speaker: edred
          text: 可它在哪儿？
        - id: ch01-b212
          speaker: mole
          text: 当然在屋里。不然还能在什么鬼地方？
        - id: ch01-b213
          speaker: narrator
          text: 它像老鼠一样飞快跑过草地，钻进一个看着像兔子洞的洞口，不见了。
        - id: ch01-b214
          speaker: elfrida
          text: 现在你非得相信鼹鼠了。
        - id: ch01-b215
          speaker: edred
          text: 是啊。你也非得整整一天都对我好，不然我相信它也没用。
        - id: ch01-b216
          speaker: elfrida
          text: 我平常对你不好吗？
          emotion: sad
        - id: ch01-b217
          speaker: narrator
          text: 她可怜巴巴地问，嘴唇也颤抖起来。
        - id: ch01-b218
          speaker: edred
          text: 好，你平常很好，阿登夫人。现在我也会对你好。那么，我们去哪儿找那扇门？
        - id: ch01-b219
          speaker: narrator
          text: 这个问题一直让他们忙到下午茶。茶后，两人决定用新颜料和新画笔画画。埃尔弗丽达想给《护身符》里米勒先生的插图上色，埃德雷德也想做同一件事。只要见过那本书，你就知道，他们不可能同时上色。埃德雷德说颜料是他的，埃尔弗丽达提醒他书是她的。一场激烈的争吵就这样爆发，又突然结束，叫人几乎喘不过气。
        - id: ch01-b220
          speaker: edred
          text: 反正我才不会做一头自私的猪。
        - id: ch01-b221
          speaker: elfrida
          text: 我也不会。哦，埃德雷德，我们刚才那样，能算是连续二十四小时对彼此好吗？
        - id: ch01-b222
          speaker: edred
          text: 哦……是啊……嗯……好吧。算了，明天重新开始。
        - id: ch01-b223
          speaker: narrator
          text: 要整整一天真心实意地对自己的兄弟姐妹好，可比你想的难多了。阿登家的两个孩子足足花了三天，才办成这件看起来很简单的事。那几天一点也不乏味，里面有攀爬，也有发现，还有带插图的书。他们还找到一张藏着暗屉的写字桌。暗屉里除了一枚四分之一便士和一截红带子，什么都没有。暗屉里从来都没什么好东西，可不管怎么说，它还是一个很不错的暗屉。
        - id: ch01-b224
          speaker: narrator
          text: 最后，终于有一天，两个人都给自己的脾气狠狠勒上了嚼子。起初，他们对彼此客气得不得了，每句话出口前都先想一想。慢慢地，这件事倒变成了一场游戏，他们也找到了更容易坚持的办法。
        - id: ch01-b225
          speaker: elfrida
          text: 咱们一直管对方叫阿登勋爵和阿登夫人，假装彼此不是亲戚吧。
        - id: ch01-b226
          speaker: narrator
          text: 这一招确实很有用。人对外人总能比对自己的亲戚更客气，这一点真叫人吃惊。可说到底，亲戚偏偏才是我们真正爱的人。
        - id: ch01-b227
          speaker: narrator
          text: 时间一点点过去，他们也越来越谨慎，简直像在搭纸牌屋。每多添一个小时无可指摘的礼貌，他们就更紧张一分，几乎连气都不敢喘。要是坚持了这么久，最后却让一件难免惹人心烦的小事毁掉一切，那可怎么办？他们可不愿从头再来。
        - id: ch01-b228
          speaker: edred
          text: 真希望你别突然做出什么讨厌的事。
        - id: ch01-b229
          speaker: elfrida
          text: 天哪，我也真希望自己不会。
        - id: ch01-b230
          speaker: narrator
          text: 这两句话，实在最像他们各自会说的话。喝过下午茶，他们决定安安静静看书，这样失败的机会能少一些。可是，两人偏偏都想看同一本书，那本书就是《金银岛》。他们好不容易坚持下来的友好，一下悬在了天平上。
        - id: ch01-b231
          speakers: [edred, elfrida]
          ensemble: duo
          text: 不，你看吧！
        - id: ch01-b232
          speaker: narrator
          text: 结果，两个人各自拿了一本自己并不十分想看的书。到了睡觉的时候，埃德雷德替埃尔弗丽达点亮蜡烛。他不小心把火柴掉在地上，埃尔弗丽达便替他捡了起来。
        - id: ch01-b233
          speaker: mrs_honeysett
          text: 愿上帝保佑这两个小宝贝。
        - id: ch01-b234
          speaker: narrator
          text: 霍尼塞特太太在走廊里说。分别时，两个孩子都发自内心地开口。
        - id: ch01-b235
          speakers: [edred, elfrida]
          ensemble: duo
          text: 这一回，我们做到了。
          emotion: happy
        - id: ch01-b236
          speaker: narrator
          text: 当然，在先前那三个没能一直友好的日子里，他们已经找过那扇门。可鼹鼠没说门在哪里，也没说门是什么样，寻找自然没有结果。大多数房间都有好几扇门，房间又那么多，连橱门算进去，一共是五十七扇。没有哪一扇比别的门更有资格叫“那扇门”。旧屋那边倒有许多门看着很像，可正因为这样的门太多，谁也拿不准究竟是哪一扇。
        - id: ch01-b237
          speaker: edred
          text: 我们要怎么认出它？
        - id: ch01-b238
          speaker: narrator
          text: 第二天早晨，埃德雷德一边吃鸡蛋和烤面包，一边问。
        - id: ch01-b239
          speaker: elfrida
          text: 我想，大概跟人家坠入爱河一样。你看见那扇门，马上就会知道，它是这世上唯一属于你的公主……我是说，唯一属于你的门。
        - id: ch01-b240
          speaker: narrator
          text: 吃过早饭，两个人一起站起来，面对面看了看。
        - id: ch01-b241
          speakers: [edred, elfrida]
          ensemble: duo
          text: 现在开始。
        - id: ch01-b242
          speaker: elfrida
          text: 咱们把每一扇门都看一遍。说不定过了一夜，那扇门上像长蘑菇一样，冒出了魔法文字。
        - id: ch01-b243
          speaker: edred
          text: 我看，更可能是那只鼹鼠在拿我们寻开心。
        - id: ch01-b244
          speaker: elfrida
          text: 哦，才不会。而且每扇门的两面都得看。真不知道门后有什么，你不好奇吗？
        - id: ch01-b245
          speaker: edred
          text: 说不定是蓝胡子的妻子们。她们的脑袋……
        - id: ch01-b246
          speaker: elfrida
          text: 你再不住口，我就根本不去找门了。我不是故意要惹你生气，可是求你别说了。你知道我最讨厌这个。
        - id: ch01-b247
          speaker: edred
          text: 走吧，别犯傻，老伙计。
        - id: ch01-b248
          speaker: narrator
          text: 哥哥肯叫她一声“老伙计”，总能让埃尔弗丽达得意极了。在她一生中，再没有什么时刻比这更叫她觉得光荣。
        - id: ch01-b249
          speaker: narrator
          text: 他们把五十七扇门一扇接一扇全看了，里外两面都没有漏。有的刷了漆，有的画着木纹。有的带雕花，有的朴素无饰。有的有镶板，有的没有。可它们全都只是门，再没有别的。没有哪一扇有半点资格叫“那扇门”。五十七扇看完后，除了再看一遍，也没有别的办法。他们只好更仔细地重新查看，想找出先前碰巧漏掉的魔法文字，可什么也没有。接着，他们又敲遍墙壁，想发现一扇装着暗簧的门，还是没有用。
        - id: ch01-b250
          speaker: edred
          text: 根本就没有什么破门。我早告诉你了，那只鼹鼠在耍我们。
        - id: ch01-b251
          speaker: elfrida
          text: 我敢肯定门一定存在。你听我说，咱们像玩意念游戏那样试试。我蒙上眼睛，你拉着我的手，再用意念叫我找到那扇门。
        - id: ch01-b252
          speaker: narrator
          text: 她因为找了太久，也焦虑了太久，说着轻轻吸了吸鼻子。
        - id: ch01-b253
          speaker: edred
          text: 我才不信什么意念游戏。
        - id: ch01-b254
          speaker: elfrida
          text: 我也不信，可我们总得做点什么。光坐下来说没有门，一点用也没有。
        - id: ch01-b255
          speaker: edred
          text: 反正就是没有。好吧，来就来。
        - id: ch01-b256
          speaker: narrator
          text: 埃尔弗丽达拿自己最好的蓝丝巾蒙住眼睛。那条丝巾的两端抽纱缝了边。埃德雷德握住她的双手。这时，他们正在发现咒语的那间书房里。埃尔弗丽达立刻稳稳地迈开步子，仿佛一心知道自己要去哪里。她穿过门厅，从绿呢门进了另一半屋子，沿走廊往前，再顺着积满灰尘的楼梯向上。向上，又向上。
        - id: ch01-b257
          speaker: edred
          text: 这里每一个地方，我们都已经看过了。
        - id: ch01-b258
          speaker: narrator
          text: 埃尔弗丽达没有停下。
        - id: ch01-b259
          speaker: elfrida
          text: 我知道自己正直直走向它。啊，你也试着相信一点吧，不然我们永远什么都找不到。
        - id: ch01-b260
          speaker: narrator
          text: 她继续沿着走廊往前走。这里的蜘蛛，已经给一只只画框蒙上了灰色丧纱般的帘子。走廊两旁有许多扇门，每一扇他们都检查过。可埃尔弗丽达忽然停了下来，正站在其中一扇门前。那扇门看上去跟别的门毫无两样。
        - id: ch01-b261
          speaker: elfrida
          text: 就是这扇。这就是那扇门。
        - id: ch01-b262
          speaker: narrator
          text: 她伸出一只手，掌心按在门板上，五根手指全都摊开，看上去像一只粉红色海星。接着，她摸到门把手，轻轻转了一下。蓝丝巾还蒙着眼睛，她手上仍拉着埃德雷德，就这样走进门去。埃德雷德也跟了进去。
        - id: ch01-b263
          speaker: edred
          text: 我说！
          emotion: surprised
        - id: ch01-b264
          speaker: narrator
          text: 埃尔弗丽达这才一把扯下蒙眼的蓝丝巾。就在这时，身后的门极轻地自行关上了。
        - id: ch01-b265
          speaker: narrator
          text: 他们站在一间紧贴屋顶的狭长阁楼里。先前四处探险时，他们肯定没发现过这里。屋里没有窗户，屋顶两边一路斜下来，几乎贴到地板。这里也没有天花板。古老的椽木已经被虫蛀坏，椽木之间直接露出瓦片。横梁一道道跨在头顶，抬头看去，就像一架横档隔得很远的大梯子。
        - id: ch01-b266
          speaker: narrator
          text: 一束束带着灰尘的金色光线从瓦缝间漏进来。屋外传来鸽子走动时嗒嗒的脚步声、羽毛的窸窣声，还有咕噜咕的低鸣。长屋里几乎空无一物，只有两边贴着低矮屋檐，各摆着一排箱子。这些箱子没有两只是一样的。
        - id: ch01-b267
          speaker: edred
          text: 啊，我现在已经善良又聪明了。我在心里感觉得到。所以我们已经得到宝藏啦！我们要把城堡重新盖起来。
          emotion: happy
        - id: ch01-b268
          speaker: narrator
          text: 他走到最近的箱子前，使劲推箱盖。可盖子实在太重，埃尔弗丽达也过来帮忙，两人才把它掀开。唉，里面根本没有宝藏，只有一叠叠收好的衣裳。于是，他们又去开下一只箱子。里面还是衣裳。再下一只也一样。所有箱子里都没有半点宝藏，只有衣裳，衣裳，还是衣裳。
        - id: ch01-b269
          speaker: elfrida
          text: 好吧，没关系。这些衣服拿来扮装，一定棒极了。
        - id: ch01-b270
          speaker: narrator
          text: 她努力把语气放轻，说得像是在安慰人。
        - id: ch01-b271
          speaker: edred
          text: 你当然说得轻巧，可我要的是宝藏。
        - id: ch01-b272
          speaker: elfrida
          text: 也许……也许你还没有变得善良又聪明。我是说，还没有完全变成。我们把衣服都拿出来看看吧，说不定宝藏藏在衣袋里。
        - id: ch01-b273
          speaker: narrator
          text: 可是衣袋里也没有，一丁点儿也没有，连一枚三便士硬币都找不到。第一只箱子里装着宽大的骑马斗篷和长靴、高腰身的长裙和绣花围巾，还有紧身马裤和钉着亮纽扣的外套。里面那些旧式背心也很有趣，一顶顶帽子的形状更是千奇百怪，两个孩子从没戴过这样的东西。
        - id: ch01-b274
          speaker: narrator
          text: 其中有一顶绿色小帽，看起来正合埃德雷德的头。他拿起来试了试，果然戴得上。就在同一刻，埃尔弗丽达也从箱子里翻出一顶系着蓝丝带的小草帽。
        - id: ch01-b275
          speaker: elfrida
          text: 这里也有一顶适合我的。
        - id: ch01-b276
          speaker: narrator
          text: 她说着，也把帽子戴上了。接着，鸽子的咕咕声和振翅声仿佛穿过屋顶，挤到他们身边，变成一团叫人眼花的鸽声云雾。声音越来越近，箱里的衣服一件件被拿出来，穿到了孩子们身上。他们不知道这是怎么办到的，正如你也不会知道，只觉得那些鸽声不知怎么变成了一双双帮忙的手。
        - id: ch01-b277
          speaker: narrator
          text: 没过多久，两人就站在那里，穿上了从未穿过的服装。埃尔弗丽达身上是一条印着绿色小枝的棉布裙，腰身高高的，裙摆又长又窄。原来的方头棕皮鞋不见了，脚上换成一双轻薄凉鞋。她露着两条胳膊，胸前交叠着一方细棉布巾。埃德雷德穿着雪白长裤，裤腰一直提到胳肢窝下面。上身是一件钉着黄铜纽扣的蓝外套，脖子周围还围着荷叶边一样的领饰。
        - id: ch01-b278
          speaker: narrator
          text: 等鸽声终于散去，两个人站在空荡荡的长屋中央，穿着这一身奇怪的旧衣服，面面相觑。
        - id: ch01-b279
          speakers: [edred, elfrida]
          ensemble: duo
          text: 我说！
          emotion: surprised
        - id: ch01-b280
          speaker: edred
          text: 刚才可真够怪的。咱们下楼去，也给霍尼塞特太太看看这一身。
        - id: ch01-b281
          speaker: narrator
          text: 可是，他们一走出那扇门，就看出霍尼塞特太太，或者别的什么人，趁他们待在门后时已经忙活了好一阵。长廊地板不但打扫干净，还擦得发亮。中央铺着一条虽旧却干净的长地毯。那些原本歪斜的版画，如今端端正正挂在洁白的石灰墙上，四下连一根蛛丝也看不见。
        - id: ch01-b282
          speaker: narrator
          text: 孩子们沿路推开长廊上的一扇扇门。每个房间都整洁干净，没有灰尘，也没有破窗帘，只有一尘不染的陈设和一种稍显简朴的舒适。哪一间屋里都没有霍尼塞特太太，附近也看不到工人。那扇绿呢门不见了，原来的地方换成一扇年久失修、歪歪扭扭的旧木门。
        - id: ch01-b283
          speaker: narrator
          text: 他们沿走廊跑到客厅，猛地推开房门，想找到霍尼塞特太太。屋里却坐着一位腰板挺得笔直的老太太，还有一位同样笔直的老先生。他们身上穿的不是如今的人会穿的衣服，倒跟两个孩子此刻的装束一样。老太太正在给一道精细的白色褶边缝边，老先生手里读着一张看起来很像报纸的纸。
        - id: ch01-b284
          speaker: old_lady
          text: 哎哟哟，我看，我们是把规矩忘了。小姐，行屈膝礼。
          emotion: angry
        - id: ch01-b285
          speaker: narrator
          text: 埃尔弗丽达只好照她的话做，尽自己所能，行了一个屈膝礼。
        - id: ch01-b286
          speaker: old_gentleman
          text: 为了教会你尊敬长辈，你最好把瓦茨博士的一首《神圣与道德歌曲》背下来。夫人，这件事就交给你了。
        - id: ch01-b287
          speaker: narrator
          text: 他放下报纸，挺着笔直的腰板，神情威严地走了出去。不知不觉间，孩子们已经坐到了两只小凳上。这个房间既是，又不是他们吃过那顿满怀希望的鸡蛋早餐的客厅。两人手里各捧着一本大理石纹封面的《瓦茨博士赞美诗集》，望着里面灰暗的小字。
        - id: ch01-b288
          speaker: old_lady
          text: 从下面两句开头的那一首背起，整篇都要背熟。“幸福的孩子，在最幼小的年华，便受到了良好的教化。”另外，你们两个人午饭都不许吃布丁。
        - id: ch01-b289
          speaker: edred
          text: 我说！
        - id: ch01-b290
          speaker: narrator
          text: 埃德雷德坐在小凳上，压低声音嘟囔了一句。
        - id: ch01-b291
          speaker: elfrida
          text: 哦，嘘！
        - id: ch01-b292
          speaker: narrator
          text: 老太太拿着那道细麻布褶边，走到窗边的座位上，继续做手里的针线活。
        - id: ch01-b293
          speaker: edred
          text: 我才不受这个气。我要告诉伊迪丝姑妈。再说，她到底是谁？
          emotion: angry
        - id: ch01-b294
          speaker: narrator
          text: 他隔着那张一尘不染的地毯，生气地瞪着窗边的老太太。
        - id: ch01-b295
          speaker: elfrida
          text: 哦，你还不明白吗？我们变成别人了，她是我们的祖母。
        - id: ch01-b296
          speaker: narrator
          text: 我不知道为什么埃尔弗丽达看出来了，埃德雷德却没有。也许因为她是女孩，也许因为她比他大两岁。他们无望地望望窗外明亮的阳光，又低头看看大理石纹封面书里那些灰暗细小的铅字。
        - id: ch01-b297
          speaker: old_lady
          text: 埃德雷德，把报纸拿给我。
        - id: ch01-b298
          speaker: narrator
          text: 她指了指光亮桌面上的那张纸。埃德雷德只得站起来，把报纸送过去。走到半路，他低头瞥了一眼。最上面写着《泰晤士报》，下面清清楚楚印着日期，一八〇七年六月十六日。
        - id: ch01-b299
          speaker: narrator
          text: 看到这个日期以后，他也和埃尔弗丽达一样，确切无疑地知道了自己身在何处，又身在哪一个时代。没有什么可以再怀疑了，他们已经到了过去。
