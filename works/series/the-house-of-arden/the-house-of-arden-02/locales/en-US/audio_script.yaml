  chapters:
    - id: ch01
      title: "CHAPTER II. THE MOULDIWARP"
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            There it was. The little creature on the knoll was the living image of the pig-like animal stamped in gold above the checkered shield on the white book that held the spell. On the yellow-white vellum cover it had shone gold, and here among the thyme it shone gold again. Edred and Elfrida stood perfectly still, afraid that one movement might frighten it away. It was alive, and its restless nose kept turning from side to side at their feet.
        - id: ch01-b02
          speaker: elfrida
          text: "It really is."
        - id: ch01-b03
          speaker: narrator
          text: >-
            Elfrida spoke very softly so she would not scare it.
        - id: ch01-b04
          speaker: edred
          text: "What is?"
        - id: ch01-b05
          speaker: narrator
          text: >-
            He knew perfectly well.
        - id: ch01-b06
          speaker: elfrida
          text: "It's the creature from the book where we found the spell."
        - id: ch01-b07
          speaker: edred
          text: >-
            That was our crest, above our coat of arms. It's on Great-grandpapa's old snuffbox too.
        - id: ch01-b08
          speaker: elfrida
          text: "Then our crest has come alive. That's all."
        - id: ch01-b09
          speaker: edred
          text: >-
            Don't be too clever. The spell said badge, and a badge isn't the same as a crest. Badges are things like leeks or roses or thistles. You can wear them in your cap. I wouldn't want to wear that in mine.
        - id: ch01-b10
          speaker: narrator
          text: >-
            The golden creature went on moving cautiously at their feet.
        - id: ch01-b11
          speaker: edred
          text: "Why, it's only an ordinary old mole."
        - id: ch01-b12
          speaker: elfrida
          text: >-
            It isn't ordinary. It's our own crest, the one on the spoons and everything. It's our old family mole. How could it be an ordinary mole when it's golden?
        - id: ch01-b13
          speaker: narrator
          text: >-
            As she spoke, it stopped being golden. The last edge of sun slipped behind the downs. In the gray twilight the mole was plainly white.
        - id: ch01-b14
          speaker: elfrida
          text: >-
            Oh! Well, that proves it isn't a real mole. Real moles are black.
        - id: ch01-b15
          speaker: edred
          text: "It's certainly very tame. I'll admit that. Well—"
        - id: ch01-b16
          speaker: mouldiwarp
          text: "Well?"
          emotion: surprised
        - id: ch01-b17
          speaker: narrator
          text: >-
            Silence fell.
        - id: ch01-b18
          speaker: elfrida
          text: "Was that you?"
          emotion: surprised
        - id: ch01-b19
          speaker: edred
          text: "No. You said it."
        - id: ch01-b20
          speaker: mouldiwarp
          text: "Now, don't whisper. 'Tain't pretty manners, so I tells 'ee."
        - id: ch01-b21
          speaker: narrator
          text: >-
            Both children dropped to their knees, one on either side of the white mole.
        - id: ch01-b22
          speaker: edred
          text: "I say!"
          emotion: surprised
        - id: ch01-b23
          speaker: mouldiwarp
          text: >-
            Now, don't. Don't pretend you don't know Mouldiwarps have tongues in their heads, same as you.
        - id: ch01-b24
          speaker: narrator
          text: >-
            Its nose pointed at Edred as scornfully as a person's finger.
        - id: ch01-b25
          speaker: elfrida
          text: "But you can't talk with them, can you?"
        - id: ch01-b26
          speaker: mouldiwarp
          text: >-
            Don't you tell me. Hasn't anyone ever told you a fairy tale? All us beasts have tongues, and when we're there, we uses them.
        - id: ch01-b27
          speaker: narrator
          text: >-
            The Mouldiwarp bristled a little.
        - id: ch01-b28
          speaker: edred
          text: "When you're where?"
        - id: ch01-b29
          speaker: narrator
          text: >-
            Edred had never cared for fairy tales, and being forced to believe one annoyed him.
        - id: ch01-b30
          speaker: mouldiwarp
          text: >-
            In a fairy tale, of course. Where else on earth do you think you are?
        - id: ch01-b31
          speaker: edred
          text: "We're here, on Arden Knoll."
        - id: ch01-b32
          speaker: narrator
          text: >-
            He kicked the ground, trying to make it feel solid and himself feel certain.
        - id: ch01-b33
          speaker: mouldiwarp
          text: >-
            And isn't Arden Knoll in a fairy tale? You talk so free. You called me, and here I be. What do you want?
        - id: ch01-b34
          speaker: narrator
          text: >-
            Elfrida was full of surprise and fear, pleasure and hope, wonder and several other feelings. All together, people call them a thousand conflicting emotions.
        - id: ch01-b35
          speaker: elfrida
          text: "Are you the badge of Arden's house?"
        - id: ch01-b36
          speaker: mouldiwarp
          text: >-
            Course I be, what's left of it. Never thought I'd be called by an Arden boy and girl who didn't know their own silly minds. What do you want, eh?
        - id: ch01-b37
          speaker: elfrida
          text: "We said what we wanted in the spell."
        - id: ch01-b38
          speaker: mouldiwarp
          text: >-
            Oh, be that all? Nothing else? I'm to make him brave and wise and show him the treasure. Milksop!
          emotion: angry
        - id: ch01-b39
          speaker: narrator
          text: >-
            The last word came so suddenly and fiercely that it seemed almost spat into Edred's face. He turned turkey-red.
        - id: ch01-b40
          speaker: edred
          text: "I'm not a milksop. I got into the house and found the spell."
          emotion: angry
        - id: ch01-b41
          speaker: mouldiwarp
          text: >-
            Yes, and who did all the looking? She did. Bless you, I was there. I know. If I were showing her the treasure, there might be some sense in it.
        - id: ch01-b42
          speaker: elfrida
          text: >-
            That's very unfair. If Edred were brave and wise already, we wouldn't need you to make him so.
        - id: ch01-b43
          speaker: narrator
          text: >-
            She spoke as earnestly as if the mole were a grown-up human being.
        - id: ch01-b44
          speaker: mouldiwarp
          text: "You ain't got nothing to do with it."
          emotion: angry
        - id: ch01-b45
          speaker: edred
          text: >-
            Yes, she has. Whatever I get, I'll share it equally with her. If you could make me wise, I'd teach her everything you taught me. But I don't believe you can. So there!
        - id: ch01-b46
          speaker: mouldiwarp
          text: "Do you believe I can talk?"
        - id: ch01-b47
          speaker: edred
          text: >-
            No, I don't. You're only a dream, and I'm dreaming you.
        - id: ch01-b48
          speaker: narrator
          text: >-
            The answer came with surprising certainty.
        - id: ch01-b49
          speaker: mouldiwarp
          text: "And what do you think?"
        - id: ch01-b50
          speaker: narrator
          text: >-
            Elfrida hesitated.
        - id: ch01-b51
          speaker: elfrida
          text: >-
            I think it's getting very dark, and Aunt Edith will worry about us. Could you meet us another day? There isn't time to make us brave and wise tonight.
        - id: ch01-b52
          speaker: mouldiwarp
          text: "That there ain't, for sure."
        - id: ch01-b53
          speaker: edred
          text: "You could still tell us where the treasure is."
        - id: ch01-b54
          speaker: mouldiwarp
          text: >-
            The treasure comes last, greedy. First I've got to make you kind and wise, and I can see I've got my work cut out. Good night.
        - id: ch01-b55
          speaker: narrator
          text: >-
            The mole began to move away.
        - id: ch01-b56
          speaker: elfrida
          text: >-
            Oh, don't go! We'll never find you again. Please don't! This is dreadful!
          emotion: fearful
        - id: ch01-b57
          speaker: narrator
          text: >-
            The mole stopped.
        - id: ch01-b58
          speaker: mouldiwarp
          text: >-
            I've got to let you find me again. Don't upset yourself. When you wants me, come to the knoll and say a piece of poetry to call me. Then I'll come.
        - id: ch01-b59
          speaker: narrator
          text: >-
            It started off once more.
        - id: ch01-b60
          speaker: edred
          text: "What poetry?"
        - id: ch01-b61
          speaker: mouldiwarp
          text: "Anything. Pick and choose."
        - id: ch01-b62
          speaker: narrator
          text: >-
            Edred thought of The Lays of Ancient Rome.
        - id: ch01-b63
          speaker: mouldiwarp
          text: >-
            Only it ain't no good unless you make it up yourselves.
        - id: ch01-b64
          speakers: [edred, elfrida]
          ensemble: duo
          text: "Oh!"
        - id: ch01-b65
          speaker: narrator
          text: >-
            They were badly discouraged.
        - id: ch01-b66
          speaker: mouldiwarp
          text: >-
            And course it must ask me kindly to come to you. Get along home.
        - id: ch01-b67
          speaker: elfrida
          text: "Where are you going?"
        - id: ch01-b68
          speaker: mouldiwarp
          text: "Home too, of course."
        - id: ch01-b69
          speaker: narrator
          text: >-
            This time it truly went.
        - id: ch01-b70
          speaker: narrator
          text: >-
            The children turned toward the lights of Ardenhurst Station without a word. Only when the turf ended and the road began did Edred speak, and his voice was full of awe.
        - id: ch01-b71
          speaker: edred
          text: "I say!"
        - id: ch01-b72
          speaker: elfrida
          text: "Yes. Isn't it?"
        - id: ch01-b73
          speaker: narrator
          text: >-
            They walked silently on to the station. There, bright lights and ordinary human voices surrounded them. Porters and passengers called out, signal wires rattled, and train signals went ping, ping. It had the same effect as a wet sponge wiped across a sleeping person's face by somebody who was already up. The children seemed to wake from a dream. Luckily, their train arrived soon. The moment they climbed aboard, both began talking. They talked without stopping until Cliffville Station, and they kept talking through every step of the walk home. By the time they reached the house with green balconies and its smooth pale door knocker, they had agreed to tell no one about the magic. That is what children nearly always decide after a magical adventure. It is terribly hard to describe such things to people who not only will not believe you, but cannot believe you. That is one of the drawbacks of truly wonderful happenings.
        - id: ch01-b74
          speaker: narrator
          text: >-
            Aunt Edith was still away when they arrived. She came home while they were washing their hands and faces for supper, carrying Edred's birthday presents. They were finer and more plentiful than any he had received for three whole years. There was a box of chocolates in a wonderful variety, and another box filled with tools. There was a very beautiful cricket bat, a cricket ball, and a complete set of stumps. Best of all was a beetle-backed paint box. Every color inside it was a whole pan instead of the half pans usually found in boxes that people give as presents. The brushes were beautiful too. Two were made of camel hair, and the sable brush had a point so fine that it could hardly have been finer.
        - id: ch01-b75
          speaker: edred
          text: >-
            You are a dear, Auntie. You really are. Elfrida may use the paint box whenever I'm out, and she may use the camel-hair brushes. Not the sable one, of course.
        - id: ch01-b76
          speaker: narrator
          text: >-
            He hugged Aunt Edith tightly. Happiness had made him more generous than usual.
        - id: ch01-b77
          speaker: elfrida
          text: "Oh, Edred, that's awfully nice of you!"
          emotion: happy
        - id: ch01-b78
          speaker: aunt_edith
          text: "I have something for Elfrida too. Ah, here it is!"
        - id: ch01-b79
          speaker: narrator
          text: >-
            She searched through the rustling heap of brown paper, tissue, string, cardboard, and shavings left from Edred's gifts. Then she found a red book with gold pictures on its cover and spine. It was called The Amulet. Now Elfrida hugged her aunt around the waist and told her how dear she was.
        - id: ch01-b80
          speaker: aunt_edith
          text: "And now for supper. Roast chicken, gooseberry pie, and cream."
        - id: ch01-b81
          speaker: narrator
          text: >-
            The children were accustomed to bread and milk for supper, a meal so mild and uninteresting that roast chicken, pie, and cream seemed like the last and greatest wonder of the day. And what a day it had been! They ate the browned chicken with bread sauce, rich gravy, and stuffing. Then came gooseberry pie covered with cream. While they enjoyed it all, Aunt Edith told them what had happened during her day in London.
        - id: ch01-b82
          speaker: aunt_edith
          text: >-
            It truly is a ship, and the best thing it brings is that we won't have to take lodgers anymore.
        - id: ch01-b83
          speakers: [edred, elfrida]
          ensemble: duo
          text: "Hurrah!"
          emotion: happy
        - id: ch01-b84
          speaker: aunt_edith
          text: >-
            We'll have more money and live more comfortably. You can attend a really good school. And where do you think we're going to live?
        - id: ch01-b85
          speaker: elfrida
          text: "Not at the castle?"
          emotion: surprised
        - id: ch01-b86
          speaker: aunt_edith
          text: "Why, how did you guess?"
        - id: ch01-b87
          speaker: narrator
          text: >-
            Elfrida looked at her brother. Edred hurriedly swallowed a large mouthful of chicken.
        - id: ch01-b88
          speaker: edred
          text: >-
            Auntie, I hope you won't mind. We went to Arden today. You said we could go this year.
        - id: ch01-b89
          speaker: narrator
          text: >-
            Then they told her everything, right up to the moment when they said the spell.
        - id: ch01-b90
          speaker: aunt_edith
          text: "Did anything happen after that?"
        - id: ch01-b91
          speaker: narrator
          text: >-
            The children were relieved. She sounded interested, not angry.
        - id: ch01-b92
          speaker: elfrida
          text: "Well, we saw a mole—"
        - id: ch01-b93
          speaker: narrator
          text: >-
            Aunt Edith laughed, and Edred cut in quickly.
        - id: ch01-b94
          speaker: edred
          text: "That's the whole story, Auntie. And I really am Lord Arden, aren't I?"
        - id: ch01-b95
          speaker: aunt_edith
          text: "Yes. You are Lord Arden."
        - id: ch01-b96
          speaker: edred
          text: "Oh, ripping!"
          emotion: happy
        - id: ch01-b97
          speaker: narrator
          text: >-
            His face was so joyful that Aunt Edith put aside the little lecture about the duties of the English aristocracy that she had prepared on the train. It could wait. Elfrida had an eager question of her own.
        - id: ch01-b98
          speaker: elfrida
          text: "Then I'm Lady Arden, aren't I?"
        - id: ch01-b99
          speaker: aunt_edith
          text: "No, dear."
        - id: ch01-b100
          speaker: elfrida
          text: "If he's a lord, I should be a lady. It isn't fair."
        - id: ch01-b101
          speaker: edred
          text: "Never mind, old girl. I'll call you Lady Arden whenever you want."
        - id: ch01-b102
          speaker: aunt_edith
          text: "How would you like to go and live at the castle now?"
        - id: ch01-b103
          speaker: edred
          text: "Tonight?"
          emotion: surprised
        - id: ch01-b104
          speaker: aunt_edith
          text: >-
            No, no. Next week. I must find tenants for this house, so I'll be very busy. Mrs. Honeysett used to keep house for your great-uncle, and she has written to the lawyers asking to work for us. I knew her when I was a girl. She's a dear and knows heaps of old songs. Would you like to stay there with her while I finish here and get rid of the lodgers? Oh, that bell again! We won't have bells at the castle, will we?
        - id: ch01-b105
          speaker: narrator
          text: >-
            And so it was settled. Aunt Edith stayed behind at the house with bow windows. Because the place would be rented fully furnished, she had to arrange all the newer furniture for the next family. She also had to pack every beautiful old possession that was a true Arden thing and belonged with them at the castle. Edred and Elfrida rode away in the carrier's cart. Their clothes and toys traveled beside them in two black boxes. Within their hearts, they carried a whole world of joyful expectations.
        - id: ch01-b106
          speaker: narrator
          text: >-
            Mrs. Honeysett welcomed them with a pretty, old-fashioned curtsy that turned into an embrace.
        - id: ch01-b107
          speaker: mrs_honeysett
          text: >-
            Welcome home, my lord, and you too, miss, my dear. Anyone can see you're both Ardens. There was always a boy and a girl. A boy and a girl.
        - id: ch01-b108
          speaker: narrator
          text: >-
            She had a sweet, patient face and large pale-blue eyes. They twinkled when she smiled, and she nearly always smiled at the children.
        - id: ch01-b109
          speaker: narrator
          text: >-
            Oh, how fine it was to unpack their very own boxes in that house. They laid their clothes in long drawers made of sweet-smelling cedar, with curved fronts of polished mahogany. They drew back neat muslin blinds from little lattice-paned windows. Those windows had always been Arden windows, and generations of Ardens must have looked through them before. The children gazed out over all the land their eyes could reach. In old days, every bit of it had belonged to their family. It belonged to strangers now, but that fact hardly touched the romance felt by hearts only ten and twelve years old.
        - id: ch01-b110
          speaker: narrator
          text: >-
            Then came the pleasure of walking down their own shallow, polished staircase. Portraits of long-dead Ardens watched from the wall as the newest Ardens passed. In their own wood-paneled parlor, the white dinner cloth had been laid for exactly two people. Mrs. Honeysett helped both children to toad-in-the-hole, then left them to eat by themselves. The moment the door closed behind her, Edred spoke.
        - id: ch01-b111
          speaker: edred
          text: "May I give you some potatoes, Lady Arden?"
        - id: ch01-b112
          speaker: narrator
          text: >-
            Elfrida giggled happily.
        - id: ch01-b113
          speaker: narrator
          text: >-
            The parlor held the old kind of furniture they knew and loved. Through a long low window they could see the long narrow garden. Polished wooden panels covered the walls in shades of brown and gray.
        - id: ch01-b114
          speaker: elfrida
          text: "There must be secret panels in here."
        - id: ch01-b115
          speaker: edred
          text: "Secret fiddlesticks!"
        - id: ch01-b116
          speaker: narrator
          text: >-
            In his heart, though, Edred thought she was right.
        - id: ch01-b117
          speaker: elfrida
          text: "May we explore after dinner?"
        - id: ch01-b118
          speaker: mrs_honeysett
          text: "Why not? It all belongs to him, bless his dear heart."
        - id: ch01-b119
          speaker: narrator
          text: >-
            So they explored. The house was far larger than it had seemed on the wonderful day when they pretended to be burglars. Mrs. Honeysett showed them a door covered in faded green baize.
        - id: ch01-b120
          speaker: mrs_honeysett
          text: "Don't think this is all. There's another house beyond."
        - id: ch01-b121
          speaker: narrator
          text: >-
            Beyond that door there truly was another house. The rooms they already knew were neat and orderly. Mrs. Honeysett called them bees-whacked, and every piece of furniture shone like a mirror or a fond hope. Past the baize door, everything changed. Shadows filled the rooms, and dust lay everywhere. Cobwebs hung like veils across the windows. In front of them, curtains had faded and torn until they barely held together. They drooped from their poles like ancient banners slowly rotting high in a great cathedral. Such banners sometimes sway when no wind can be felt, as if the invisible trumpet of Fame were breathing over them and playing an air about old splendor and glory.
        - id: ch01-b122
          speaker: narrator
          text: >-
            The carpets had fallen into rags upon the floors. Dust lay thick on the furniture, on the bare boards of the corridors, and all along the staircases. In the bedrooms, four-poster beds still carried their old hangings, but the cloth was dusty and rusty with age. Moths and mice had bitten holes through the quilts. In one room stood a cradle carved from oak, with the remains of a silk coverlet trailing from it in tatters. The great kitchen hearth had held no fire for a very long time. Even so, the gray and white ashes of its final fire were still there. A chill breathed from the empty hearth. The old wing smelled damp, and it felt—
        - id: ch01-b123
          speaker: elfrida
          text: "Do you think it's haunted?"
        - id: ch01-b124
          speaker: edred
          text: "Rot!"
        - id: ch01-b125
          speaker: narrator
          text: >-
            They went on. Long narrow corridors stretched ahead of them, with old prints hanging crookedly in black frames. Cobwebs drooped from the frames like gray mourning cloth. They entered rooms whose floors were made of old, uneven oak. In the cold fireplaces lay ancient soot and broken starling nests whose chicks had hatched and flown away years and years before. Edred took out his handkerchief. It was always made to serve every possible purpose, and now he rubbed a clear patch in one of the dirty windows. Through it they looked across the swelling downs. From that view, one thing was plain. This part of the house had not been built inside the castle walls.
        - id: ch01-b126
          speaker: narrator
          text: >-
            At last they had opened every door and peered into every room filled with decaying splendor. They went outside and walked around the building to understand what they had seen. The old house was a wing built straight out from the castle itself. Its windows were nearly square, and carved dripstones projected above them. Every pane had turned as yellow as old parchment. Time had laid one veil over the glass, and spiders had laid another from within. Ivy climbed thickly around the windows, almost hiding some of them altogether.
        - id: ch01-b127
          speaker: elfrida
          text: "It's too wonderful to be true. I can't believe it."
          emotion: surprised
        - id: ch01-b128
          speaker: narrator
          text: >-
            She threw herself down on the grass. Edred dropped beside her.
        - id: ch01-b129
          speaker: edred
          text: "What I can't believe is that precious mole."
        - id: ch01-b130
          speaker: elfrida
          text: "But we saw it. Once you've seen something, you have to believe it."
        - id: ch01-b131
          speaker: edred
          text: >-
            I don't. Remember the scarlet toadstools in Hereward? Perhaps those peppermint creams were enchanted and made us dream it all.
        - id: ch01-b132
          speaker: elfrida
          text: "They were good. I say!"
        - id: ch01-b133
          speaker: edred
          text: "What?"
        - id: ch01-b134
          speaker: elfrida
          text: "Have you made any poetry to call the mole?"
        - id: ch01-b135
          speaker: edred
          text: "Have you?"
        - id: ch01-b136
          speaker: elfrida
          text: "No, but I've tried."
        - id: ch01-b137
          speaker: edred
          text: "I've tried too, and I've done it."
        - id: ch01-b138
          speaker: elfrida
          text: "Oh, Edred, you are clever! Say it."
        - id: ch01-b139
          speaker: edred
          text: "If I do, do you think the mole will come?"
        - id: ch01-b140
          speaker: elfrida
          text: "Of course it will."
        - id: ch01-b141
          speaker: edred
          text: >-
            I want to find the treasure and everything. But I don't believe in it. It isn't likely, is it?
        - id: ch01-b142
          speaker: elfrida
          text: "Much less likely things happened in The Amulet."
        - id: ch01-b143
          speaker: edred
          text: "That's only a story."
        - id: ch01-b144
          speaker: elfrida
          text: "The mole said we're in a story. Please say your poetry."
        - id: ch01-b145
          speaker: narrator
          text: >-
            Slowly, Edred recited it.
        - id: ch01-b146
          speaker: edred
          text: >-
            Mole, mole, come out of your hole. I know you're blind, but I don't mind.
        - id: ch01-b147
          speaker: narrator
          text: >-
            Elfrida looked eagerly all around. Short turf spread beneath her, while the gray, ivy-covered walls of the castle rose high above. Pigeons wheeled overhead. Others perched in the window arches and along the roof, where they preened their bright feathers and told one another, coo, coo, cooroo, cooroo. Whatever those pigeon words may mean, they did not summon a mole. There was not a mole anywhere, nor the faintest hint, dream, or idea of one.
        - id: ch01-b148
          speaker: elfrida
          text: >-
            Edred, did you truly make that up? Don't be cross, but I think I've heard something like it.
        - id: ch01-b149
          speaker: edred
          text: "I adopted it."
        - id: ch01-b150
          speaker: narrator
          text: >-
            Elfrida's face was one great question.
        - id: ch01-b151
          speaker: edred
          text: >-
            You've seen books say, adopted from the French, haven't you? I changed it.
        - id: ch01-b152
          speaker: elfrida
          text: "I don't think that counts. How much did you change? What were the real words?"
        - id: ch01-b153
          speaker: edred
          text: >-
            The mole, the mole, he lives in a hole. The mole is blind. I don't mind. Auntie told it to me when you went to her with Mrs. Harrison.
        - id: ch01-b154
          speaker: narrator
          text: >-
            He said it sulkily.
        - id: ch01-b155
          speaker: elfrida
          text: >-
            You should make all of it up yourself. See? The mole isn't coming. Let's both think hard. I could make poetry if I knew how to start.
        - id: ch01-b156
          speaker: edred
          text: "If anyone makes it, I should. You're not Lord Arden."
        - id: ch01-b157
          speaker: elfrida
          text: "That's very unkind."
          emotion: sad
        - id: ch01-b158
          speaker: narrator
          text: >-
            Edred knew she was right.
        - id: ch01-b159
          speaker: edred
          text: "I don't mind trying this. You make it, and I'll say it."
        - id: ch01-b160
          speaker: narrator
          text: >-
            Elfrida buried her face in her hands and thought until her forehead felt as large as a mangel-wurzel and the blood throbbed there like a ticking church clock.
        - id: ch01-b161
          speaker: edred
          text: "Have you got it?"
        - id: ch01-b162
          speaker: narrator
          text: >-
            He asked just as the words were coming to her.
        - id: ch01-b163
          speaker: elfrida
          text: "Don't!"
          emotion: angry
        - id: ch01-b164
          speaker: narrator
          text: >-
            Then all was quiet except for pigeons, skylarks, and a cow mooing at a distant red-roofed farm. At last Elfrida raised her head. Grass stalks had pressed deep marks into her elbows.
        - id: ch01-b165
          speaker: elfrida
          text: >-
            Will this do? Oh, Mouldiwarp—I'd rather call it that than mole, wouldn't you? Oh, Mouldiwarp, do please come out and show us how to set about it. I mean the treasure. I hope it understands.
        - id: ch01-b166
          speaker: edred
          text: "That isn't poetry."
        - id: ch01-b167
          speaker: elfrida
          text: >-
            It is if you say it properly. Oh, Mouldiwarp, do please come out and show us how to set about it.
        - id: ch01-b168
          speaker: edred
          text: "It needs more."
        - id: ch01-b169
          speaker: narrator
          text: >-
            He was rather impressed all the same.
        - id: ch01-b170
          speaker: elfrida
          text: >-
            There is more. Wait, I'll remember. I mean how to find the treasure and make Edred brave and wise and kind.
        - id: ch01-b171
          speaker: edred
          text: "I'm kind enough already."
        - id: ch01-b172
          speaker: elfrida
          text: >-
            Oh, I know you're kind. But poetry has to rhyme, doesn't it? I expect poets often have to say something they don't quite mean because the rhyme makes them.
        - id: ch01-b173
          speaker: edred
          text: "Then say the whole thing."
        - id: ch01-b174
          speaker: elfrida
          text: >-
            Oh, Mouldiwarp, do please come out and show us how to set about it. What I mean is how to find the treasure, and make Edred brave and wise and kind. I'll write it down if you have a pencil.
        - id: ch01-b175
          speaker: narrator
          text: >-
            Edred produced a piece of pink chalk, but he had no paper at all. Elfrida had to spread out her white petticoat instead. She laid a large stone on the hem and pulled the cloth tight with both hands while Edred wrote at her dictation. Afterward, he studied the words. He repeated the lines again and again, just as he was used to repeating The Battle of Ivry for lessons. At last he knew them well enough to stand and recite.
        - id: ch01-b176
          speaker: edred
          text: >-
            Oh, Mouldiwarp, do please come out and show me how to set about it. What I mean is how to find the treasure, and make me brave and wise, if you don't mind.
        - id: ch01-b177
          speaker: narrator
          text: >-
            Instantly, the white mole appeared.
        - id: ch01-b178
          speaker: mouldiwarp
          text: "What do you want now? And you call that poetry?"
          emotion: angry
        - id: ch01-b179
          speaker: elfrida
          text: "It's the first poem I've ever made. Perhaps the next one will be better."
        - id: ch01-b180
          speaker: narrator
          text: >-
            Her ears burned.
        - id: ch01-b181
          speaker: edred
          text: "We want you to do what the spell says."
        - id: ch01-b182
          speaker: mouldiwarp
          text: >-
            Make you brave and wise? That can't be done in a minute. That's a long job.
        - id: ch01-b183
          speaker: elfrida
          text: "Don't be cross, dear. If it takes so long, hadn't you better start?"
        - id: ch01-b184
          speaker: mouldiwarp
          text: >-
            I ain't doing more than my share. Tell me what you want, and perhaps I'll do it.
        - id: ch01-b185
          speaker: narrator
          text: >-
            Perhaps being called dear had softened it a little.
        - id: ch01-b186
          speaker: edred
          text: "I know what I want, but I don't know if you can do it."
        - id: ch01-b187
          speaker: narrator
          text: >-
            The mole gave a contemptuous laugh.
        - id: ch01-b188
          speaker: edred
          text: >-
            I read about it in the book Elfrida got for my birthday. The children went into the past. I'd like to go into the past and find the treasure.
        - id: ch01-b189
          speaker: mouldiwarp
          text: "Choose your period."
        - id: ch01-b190
          speaker: edred
          text: "Choose my—"
        - id: ch01-b191
          speaker: mouldiwarp
          text: >-
            Your period. Pick the time you want to visit. If you haven't chosen before I count ten, it's all off. One, two, three, four—nine, ten. Very well, then. You'll have to take your luck.
        - id: ch01-b192
          speaker: narrator
          text: >-
            The children had answered with blank silence.
        - id: ch01-b193
          speaker: edred
          text: >-
            Bother! I couldn't think of anything except every date of every English king, all at once.
        - id: ch01-b194
          speaker: mouldiwarp
          text: "Lucky if you know them."
        - id: ch01-b195
          speaker: narrator
          text: >-
            The mole plainly doubted him. Under his breath, Edred began proving that he did.
        - id: ch01-b196
          speaker: edred
          text: >-
            William the First, 1066. William the Second, 1087. Henry the First, 1100.
        - id: ch01-b197
          speaker: narrator
          text: >-
            The mole yawned, which was very rude.
        - id: ch01-b198
          speaker: elfrida
          text: "Don't be cross, dear. Help us in your own way."
        - id: ch01-b199
          speaker: mouldiwarp
          text: >-
            Now you're talking. I'll give you some advice. Don't be nasty to each other for one whole day, and then—
        - id: ch01-b200
          speaker: edred
          text: "You needn't talk."
        - id: ch01-b201
          speaker: narrator
          text: >-
            He muttered it, but the mole's ears were better than its eyes.
        - id: ch01-b202
          speaker: mouldiwarp
          text: "Very well. I won't."
        - id: ch01-b203
          speaker: elfrida
          text: "Oh, don't stop! What do we do after we've been nice for a whole day?"
        - id: ch01-b204
          speaker: mouldiwarp
          text: "When you've done that, look for the door."
        - id: ch01-b205
          speaker: elfrida
          text: "What door?"
        - id: ch01-b206
          speaker: mouldiwarp
          text: "The door."
        - id: ch01-b207
          speaker: edred
          text: "Where is it?"
        - id: ch01-b208
          speaker: mouldiwarp
          text: "In the house, of course. Where else should it be?"
        - id: ch01-b209
          speaker: narrator
          text: >-
            It raced across the grass as quickly as a mouse and vanished into what looked like a rabbit hole.
        - id: ch01-b210
          speaker: elfrida
          text: "Now you have to believe in the mole."
        - id: ch01-b211
          speaker: edred
          text: >-
            Yes, and you have to be nice to me for a whole day, or believing won't do any good.
        - id: ch01-b212
          speaker: elfrida
          text: "Aren't I usually nice?"
          emotion: sad
        - id: ch01-b213
          speaker: narrator
          text: >-
            Her lips trembled.
        - id: ch01-b214
          speaker: edred
          text: >-
            Yes, you are, Lady Arden. And now I'll be nice too. Where should we look for the door?
        - id: ch01-b215
          speaker: narrator
          text: >-
            That question kept them busy until tea. Afterward, they decided to paint with the new paints and beautiful brushes. Elfrida wanted to color Mr. Millar's pictures in The Amulet. Edred wanted to color them too. If you know the book, you will understand why they could not both do it. Edred said the paints belonged to him, while Elfrida pointed out that the book was hers. Their argument grew hot, then stopped with a sudden gasp.
        - id: ch01-b216
          speaker: edred
          text: "Well, I wouldn't be a selfish pig."
        - id: ch01-b217
          speaker: elfrida
          text: "Neither would I. Oh, Edred, are we being nice to each other?"
          emotion: surprised
        - id: ch01-b218
          speaker: edred
          text: "Oh. Yes. Well, never mind. We'll start again tomorrow."
        - id: ch01-b219
          speaker: narrator
          text: >-
            Being truly nice to your brother or sister for a whole day is much harder than you might think. The two Ardens needed three days before they managed this apparently simple thing. Those three days were not dull at all. Many beautiful things happened in them, though there is no time to tell every one. There were climbs and discoveries. There were books full of pictures. Best of all, they found a bureau with a secret drawer. The drawer held nothing but one farthing and a scrap of red tape. Secret drawers almost never contain anything better. Even so, it was a very satisfying secret drawer.
        - id: ch01-b220
          speaker: narrator
          text: >-
            At last there came a day when each child held tightly to a strong bit and kept a firm rein on every impatient word. They began by treating each other with elaborate politeness. Before long, their good behavior stopped feeling like a burden and began to feel like a game.
        - id: ch01-b221
          speaker: elfrida
          text: >-
            Let's call each other Lord Arden and Lady Arden all day. We can pretend we aren't related.
        - id: ch01-b222
          speaker: narrator
          text: >-
            That helped enormously. It is astonishing how much more politely we treat outsiders than our own relations, though our relations are the people we truly love.
        - id: ch01-b223
          speaker: narrator
          text: >-
            Hour after hour, they grew more careful. Their day of perfect manners was like a house of cards rising higher and higher. They could hardly breathe for fear that one ordinary annoyance might knock it down.
        - id: ch01-b224
          speaker: edred
          text: "I hope you won't do anything tiresome before tea."
        - id: ch01-b225
          speaker: elfrida
          text: "Oh, dear, I hope I won't."
        - id: ch01-b226
          speaker: narrator
          text: >-
            That was exactly like both of them.
        - id: ch01-b227
          speaker: narrator
          text: >-
            After tea, they chose to read because it seemed safer. Both reached for Treasure Island. For one moment, their whole day hung in the balance.
        - id: ch01-b228
          speakers: [edred, elfrida]
          ensemble: duo
          text: "No, you take it!"
        - id: ch01-b229
          speaker: narrator
          text: >-
            In the end, neither took Treasure Island. Each chose a completely different book that neither particularly wanted to read. At bedtime, Edred carefully lit Elfrida's candle for her. When he dropped the matches, Elfrida bent down and picked them up for him. Their careful day of kindness had lasted to its very end.
        - id: ch01-b230
          speaker: mrs_honeysett
          text: "Bless their hearts."
        - id: ch01-b231
          speaker: narrator
          text: >-
            She had heard them from the passage. The children parted with one heartfelt declaration.
        - id: ch01-b232
          speakers: [edred, elfrida]
          ensemble: duo
          text: "We've done it this time."
        - id: ch01-b233
          speaker: narrator
          text: >-
            During the three days when they failed to be nice, they had already begun looking for the door. The mole had never said where it stood, or what sort of door it might be. Most rooms had several doors, and the house contained a great many rooms. When cupboard doors were included, the children counted fifty-seven. Not one seemed important enough to stand above all the others and be called the door. Many doors in the ruined half of the house looked mysterious enough to be the right one. The trouble was that so many looked possible that the children had no way to choose among them.
        - id: ch01-b234
          speaker: edred
          text: "How will we know it?"
        - id: ch01-b235
          speaker: elfrida
          text: >-
            Perhaps it's like falling in love. You see the door, and at once you know it's the only princess in the world for you. The only door, I mean.
        - id: ch01-b236
          speaker: narrator
          text: >-
            The next morning, after egg and toast, they stood and looked at each other.
        - id: ch01-b237
          speakers: [edred, elfrida]
          ensemble: duo
          text: "Now."
        - id: ch01-b238
          speaker: elfrida
          text: >-
            We'll inspect every door. Perhaps magic writing grew on the right one overnight, like mushrooms.
        - id: ch01-b239
          speaker: edred
          text: "It's more likely that mole was fooling us."
        - id: ch01-b240
          speaker: elfrida
          text: >-
            Oh, no! We must look at both sides of every door. I wonder what's behind the door, don't you?
        - id: ch01-b241
          speaker: edred
          text: "Probably Bluebeard's wives, with their heads—"
        - id: ch01-b242
          speaker: elfrida
          text: >-
            Stop, or I won't look at all. I'm not trying to annoy you, but please don't. You know I hate that.
          emotion: fearful
        - id: ch01-b243
          speaker: narrator
          text: >-
            She put her fingers in her ears.
        - id: ch01-b244
          speaker: edred
          text: "Come on, old chap. Don't be a duffer."
        - id: ch01-b245
          speaker: narrator
          text: >-
            Elfrida's proudest moments were the ones when her brother called her old chap.
        - id: ch01-b246
          speaker: narrator
          text: >-
            They inspected all fifty-seven doors, one after another, looking at both sides of every one. Some were painted and some were grained to look like natural wood. Some had carvings, while others were plain. Some were divided into panels, and others had no panels at all. Yet every single one was only a door, and nothing more. None had any right to be spoken of as the door. With nothing else to try, they began the whole search again. This time they examined each surface very carefully for magic writing they might somehow have missed. They found none. Next they tapped their way along the walls, hoping to discover a hidden door opened by a secret spring. That did no good either.
        - id: ch01-b247
          speaker: edred
          text: "There isn't any door. I told you the mole was pulling our leg."
        - id: ch01-b248
          speaker: elfrida
          text: >-
            I'm sure there is. Let's try it like the willing game. Blindfold me, hold my hand, and will me to find the door.
        - id: ch01-b249
          speaker: narrator
          text: >-
            Long worry had made her sniff a little.
        - id: ch01-b250
          speaker: edred
          text: "I don't believe in the willing game."
        - id: ch01-b251
          speaker: elfrida
          text: >-
            Neither do I, but we must do something. Sitting down and saying there is no door won't help.
        - id: ch01-b252
          speaker: edred
          text: "There isn't one, but very well. Come on."
        - id: ch01-b253
          speaker: narrator
          text: >-
            In the library where they had found the spell, Edred tied Elfrida's best blue silk scarf over her eyes and took her hands. At once she walked with a steady purpose. She crossed the hall, passed through the green baize door, followed the dusty corridor, and climbed the stairs, up and up.
        - id: ch01-b254
          speaker: edred
          text: "We've searched everywhere up here."
        - id: ch01-b255
          speaker: elfrida
          text: >-
            I know I'm going straight to it. Please try to believe a little, or we'll never find anything.
        - id: ch01-b256
          speaker: narrator
          text: >-
            She continued along the corridor where spiders had hung gray curtains over the picture frames. There were many doors, but Elfrida stopped suddenly at one that looked just like all the rest.
        - id: ch01-b257
          speaker: elfrida
          text: "This is the door."
        - id: ch01-b258
          speaker: narrator
          text: >-
            Her outstretched hand rested on its panel like a pink starfish. She found the handle, turned it, and walked in, still blindfolded and still pulling Edred by the hand. He followed.
        - id: ch01-b259
          speaker: edred
          text: "I say!"
          emotion: surprised
        - id: ch01-b260
          speaker: narrator
          text: >-
            Elfrida tore off the scarf. Behind them, the door closed very softly by itself.
        - id: ch01-b261
          speaker: narrator
          text: >-
            They stood in a long attic tucked close beneath the roof. In all their exploring, they had certainly never found this room before. It had no windows at all. On both sides, the roof sloped downward until it almost touched the floor. There was no ceiling to hide its structure. Old worm-eaten beams showed above them, with the undersides of the roof tiles visible between. Other great beams crossed the room from side to side. When the children stared upward, the wood looked like an enormous ladder with its rungs set very far apart. Here and there, dusty golden light filtered through narrow cracks in the tiles. Outside came the tick, tick of walking pigeon feet, the soft rustle of feathers, and the cooroo-coo of pigeon voices. The long attic was almost bare. Only rows of chests stood along both sides where the roof was lowest, and no two chests were alike.
        - id: ch01-b262
          speaker: edred
          text: >-
            Oh! I'm kind and wise now. I can feel it inside. That means we've found the treasure, and we can rebuild the castle.
        - id: ch01-b263
          speaker: narrator
          text: >-
            He rushed to the nearest chest and pushed at its lid. Elfrida had to help before the heavy lid rose. Alas, there was no treasure inside. It held only folded clothes.
        - id: ch01-b264
          speaker: narrator
          text: >-
            They tried the next chest and then all the others. None held treasure. There were only clothes, clothes, and more clothes.
        - id: ch01-b265
          speaker: elfrida
          text: "Never mind. They'll be splendid for dressing up."
        - id: ch01-b266
          speaker: narrator
          text: >-
            She tried to sound comforting.
        - id: ch01-b267
          speaker: edred
          text: "That's all very well, but I want the treasure."
        - id: ch01-b268
          speaker: elfrida
          text: >-
            Perhaps you aren't good and wise yet. Not quite, I mean. Let's take everything out. The treasure might be in a pocket.
        - id: ch01-b269
          speaker: narrator
          text: >-
            It was not. There was no treasure in any pocket, not even a single threepenny coin. The clothes from the first chest were strange and fascinating. There were wide riding cloaks and long boots, dresses with very short waists, and scarves covered in embroidery. There were tight breeches, coats with rows of bright buttons, wonderfully curious waistcoats, and hats shaped unlike the ones people wore now. One little green hat looked as though it had been made to fit Edred. He tried it on. At that very moment, Elfrida reached into the chest and lifted out a small straw bonnet trimmed with blue ribbons.
        - id: ch01-b270
          speaker: elfrida
          text: "Here's one for me."
        - id: ch01-b271
          speaker: narrator
          text: >-
            She put it on. Then the pigeons' cooing and rustling seemed to come straight through the roof. The sounds crowded around the children in a dazzling cloud of pigeon noises. They pressed closer and closer, and garments came out of the chest and settled onto Edred and Elfrida. The children did not know how any of it was done, any more than you know now. Somehow those pigeon sounds had become like invisible hands. They chose the clothes, lifted them, and helped the children put them on.
        - id: ch01-b272
          speaker: narrator
          text: >-
            Soon the two children stood dressed in clothes unlike anything they had ever worn. Elfrida's cotton dress was patterned with little green sprigs. Its waist ended high, while its narrow skirt fell a long way toward the floor. Her square-toed brown shoes had disappeared, and flimsy sandals covered her feet. Her arms were bare, and a muslin handkerchief had been folded neatly across her chest. Edred wore brilliant white trousers that rose so high they seemed to come right up beneath his arms. Over them was a blue coat with shining brass buttons. Around his neck sat something like a frilly tucker.
        - id: ch01-b273
          speakers: [edred, elfrida]
          ensemble: duo
          text: "I say!"
          emotion: surprised
        - id: ch01-b274
          speaker: narrator
          text: >-
            The pigeon sounds faded away, leaving the children facing each other in the long bare room.
        - id: ch01-b275
          speaker: edred
          text: "That was funny. Let's go downstairs and show Mrs. Honeysett."
        - id: ch01-b276
          speaker: narrator
          text: >-
            They stepped through the door and saw that Mrs. Honeysett, or someone else, must have worked at an astonishing speed while they were inside. The gallery floor, dusty only moments before, had been swept and polished. A strip of carpet ran along it. The carpet was worn, but perfectly clean. Every print that had hung crooked now sat straight and square against clean whitewashed walls. Not one gray thread of cobweb remained anywhere.
        - id: ch01-b277
          speaker: narrator
          text: >-
            As they passed along the gallery, they opened every door. Each room was neat and clean. The dust, the cobwebs, and the torn curtains had vanished. Everything showed perfect order and a plain, rather bare sort of comfort. Mrs. Honeysett was nowhere to be found, and no workmen were there to explain the change. The green baize door had vanished too. In the same opening stood a crooked, shaky door made from very old wood.
        - id: ch01-b278
          speaker: narrator
          text: >-
            The children raced down the passage and burst open the parlor door, expecting to find Mrs. Honeysett. Instead, an old lady and an old gentleman sat inside. Both sat extremely upright, and neither wore the sort of clothes people wore in the children's own time. Their clothes belonged to the same period as the garments now covering Edred and Elfrida. The old lady was carefully hemming a fine white frill. The old gentleman held and read a printed sheet that looked like one loose page from a newspaper.
        - id: ch01-b279
          speaker: old_lady
          text: >-
            Hoity-toity! I think we have forgotten our manners. Make your curtsy, miss.
          emotion: angry
        - id: ch01-b280
          speaker: narrator
          text: >-
            Elfrida curtsied as well as she could.
        - id: ch01-b281
          speaker: old_gentleman
          text: >-
            To teach you respect for your elders, you had better learn one of Dr. Watts's Divine and Moral Songs by heart. I leave that to you, my lady.
        - id: ch01-b282
          speaker: narrator
          text: >-
            He put down the page and marched out, straight-backed and dignified. Somehow, the children now sat on two little stools in a room that both was and was not the parlor where they had eaten their hopeful egg-and-toast breakfast. Each held a marbled copy of Dr. Watts's Hymns.
        - id: ch01-b283
          speaker: old_lady
          text: >-
            You will learn the whole song that begins, Happy the child whose youngest years receive instruction well. And you will have no pudding with your dinners.
        - id: ch01-b284
          speaker: edred
          text: "I say!"
        - id: ch01-b285
          speaker: elfrida
          text: "Oh, hush!"
        - id: ch01-b286
          speaker: narrator
          text: >-
            The old lady carried her cambric frills to the window seat.
        - id: ch01-b287
          speaker: edred
          text: >-
            I won't stand it. I'll tell Aunt Edith. Who is she, anyway?
          emotion: angry
        - id: ch01-b288
          speaker: narrator
          text: >-
            He whispered and glared across the spotless carpet.
        - id: ch01-b289
          speaker: elfrida
          text: >-
            Don't you understand? We've been turned into somebody else, and she's our grandmamma.
        - id: ch01-b290
          speaker: narrator
          text: >-
            I cannot tell you why Elfrida understood before Edred. Perhaps it was because she was a girl, or because she was two years older. They looked hopelessly from the bright sunshine outside to the dull little print in the marbled book.
        - id: ch01-b291
          speaker: old_lady
          text: "Edred, bring me the paper."
        - id: ch01-b292
          speaker: narrator
          text: >-
            She pointed to the sheet on the brightly polished table. Edred carried it over, glancing down as he went. At the top he read, The Times, June 16, 1807.
        - id: ch01-b293
          speaker: narrator
          text: >-
            Then he knew exactly where he was, and when.
