  chapters:
    - id: ch01
      title: 第五章　拦路强盗和——
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 两个孩子发誓以后什么事也不做，说得倒是真心。可这样的誓当然是胡说，人总得做点什么，哪怕只是算一道减法，或者吃一盘水波蛋配香肠。他们真正想说的是，以后绝不再做任何让霍尼塞特太太担心的事。要做到这一点，眼下第一件要紧事，自然就是弄明白怎样把钟拨回去。埃尔弗丽达慢慢嚼着香肠。每逢吃得慢，她都觉得自己做了一件非常高尚的事，应该得到奖品或一枚勋章。她请脑子行行好，在早餐结束前想出几句诗。脑子似乎躲到自家隐秘的后院里忙了一阵，还真给她准备了一点。与此同时，在那个相当于脑子前花园的地方，她只顾盼着自己天生就是个诗人。
        - id: ch01-b02
          speaker: elfrida
          text: 就像那位诗人，他写过宠爱的小金鱼淹死在一缸猫里。
        - id: ch01-b03
          speaker: edred
          text: 是啊，就算像莎士比亚也好。可惜他写的东西总那么长。
        - id: ch01-b04
          speaker: elfrida
          text: 可我们该拨回去的那座钟，到底在哪儿呢？
        - id: ch01-b05
          speaker: edred
          text: 白鼹鼠精肯定会告诉我们。
        - id: ch01-b06
          speaker: narrator
          text: 然而，白鼹鼠精并没有告诉他们。早餐以后，他们来到城堡废墟围着的草地。灰色残墙高高立着，显得庄严肃穆，墙缝间开着桂竹香和柳穿鱼。两个孩子坐进圆脸白褶边的雏菊丛里，谈起上次回到人人害怕波尼的年代时，各自想过些什么。至少，是他们以为自己想过些什么。草坪绿得可爱，雏菊白得耀眼，太阳把一切都照得金灿灿的，气派极了。
        - id: ch01-b07
          speaker: narrator
          text: 埃尔弗丽达坐在那里，忽然觉得阿登真是个好地方，他们能住在这里，实在幸运。她不用回到那条铺着红色人行道的街上，不用再看那扇装着光滑黄铜门环的大门，也不用听房客没完没了地拉铃。她本来没打算开口，几句诗却自己跑了出来。
        - id: ch01-b08
          speaker: elfrida
          text: 阿登，阿登，阿登，草坪、城堡和花园。雏菊、青草、金桂竹，白鼹鼠精快出土。
        - id: ch01-b09
          speaker: mouldiwarp
          text: 这才像诗哩，比你从前念的都像，真个是。好啦，这么好的天儿，你们又找我做啥？
        - id: ch01-b10
          speaker: narrator
          text: 白鼹鼠精已经坐在他们中间，心情似乎很不错。埃尔弗丽达便问起一件早想问的事。
        - id: ch01-b11
          speaker: elfrida
          text: 你说话为什么总像乡下人呢？
        - id: ch01-b12
          speaker: mouldiwarp
          text: 我生在萨塞克斯，也长在萨塞克斯。人家说萨塞克斯土话带着泥土气，那就是我住的地方那股土味儿。不过别种话我也会。小菲茨少爷，从前我还能说一大串法国话呢。
        - id: ch01-b13
          speaker: edred
          text: 那你一定知道特别多的事。
        - id: ch01-b14
          speaker: mouldiwarp
          text: 那可不。
        - id: ch01-b15
          speaker: edred
          text: 你到底多大了？
        - id: ch01-b16
          speaker: narrator
          text: 埃尔弗丽达赶紧提醒他，这样问很没礼貌，可已经来不及了。
        - id: ch01-b17
          speaker: mouldiwarp
          text: 跟我舌头一样老，比我牙齿还老一点点。
        - id: ch01-b18
          speaker: narrator
          text: 它还特意把牙齿露给他们看。
        - id: ch01-b19
          speaker: elfrida
          text: 别生气嘛。今天天气这么好，我们正想请你教教我们，怎样才能把钟拨回去。
        - id: ch01-b20
          speaker: mouldiwarp
          text: 那可不是小事。不过你们已经三天没吵架了，想去哪儿便去哪儿，想做啥便做啥。只是要让钟停下，就不能待在这里。上门楼朝外看，等大钟面一出现，立刻下来，坐到秒针上。真有法子叫它停，也只有这个法子。
        - id: ch01-b21
          speaker: narrator
          text: 孩子们从透着凉风的拱门向外望。常春藤在身边摇摆，鸽子的翅膀沙沙响。眼前的景象古怪极了。草地的绿色和雏菊的白色一起荡漾起来。草坪原本高低不平，因为它不是园丁拿着水平仪和滚筒铺成的，而是大自然亲手长出来，只为了盖住碎陶片、石头、废鸟巢和各种零碎垃圾。现在，它像一张活地毯，慢慢伸展，越拉越直，最后绷得平平整整。有些地方越来越绿，另一些地方却聚起又密又白的斑点。
        - id: ch01-b22
          speaker: edred
          text: 快看！雏菊在走路！
          emotion: surprised
        - id: ch01-b23
          speaker: narrator
          text: 雏菊真的走了起来。它们像训练有素的小兵，身子挺得笔直，先排成两列，再排成四列，接着分成一队又一队。从门楼上看，就像成千上万颗白珠子，自己从绿珠子中间分了出来。
        - id: ch01-b24
          speaker: edred
          text: 它们这是要干什么？
        - id: ch01-b25
          speaker: narrator
          text: 埃尔弗丽达当然回答不了。那些小雏菊稳稳向前，好像每一个都清楚自己的任务。它们聚成一团团、一营营、一军军。有几队走到指定的位置，就停住不动。
        - id: ch01-b26
          speaker: edred
          text: 它们在排图案。你看，外面出现了一个大圆圈，真的是图案！
        - id: ch01-b27
          speaker: elfrida
          text: 对呀！快看，那是一座钟！
          emotion: surprised
        - id: ch01-b28
          speaker: narrator
          text: 一点不错。纯绿的草坪成了钟面，密密挨着的白雏菊排成粗线，在外面围出硕大的圆。圆里是钟面上的数字，十二个一个不少，时针和分针也全由白雏菊排成。在罗马数字六和钟心之间，还有一个较小的白色雏菊圆盘。一根秒针正在上面转动，组成那根白秒针的雏菊转得无比精准。哪怕全国最高傲的将军看见，也会因为纯粹的赞叹而掉下眼泪。
        - id: ch01-b29
          speaker: narrator
          text: 两个孩子不约而同地冲下门楼。那楼梯幽暗积尘，挂满蛛网，还弯弯绕绕。他们一路跌跌撞撞，又飞快跑过草坪。白鼹鼠精正坐在钟面最中央，神情有几分自觉，也有几分得意。
        - id: ch01-b30
          speaker: elfrida
          text: 你究竟是怎么做到的？
        - id: ch01-b31
          speaker: mouldiwarp
          text: 是雏菊做的。可怜的小东西，它们自己想不出主意，可照着别人的主意办事，倒办得挺漂亮。当然啦，凡是白色的东西都得听我的。
        - id: ch01-b32
          speaker: elfrida
          text: 这就是那座大钟吗？
        - id: ch01-b33
          speaker: narrator
          text: 白鼹鼠精咯咯笑了。
        - id: ch01-b34
          speaker: mouldiwarp
          text: 我的孩子，那座钟可大得很，你永远没法一眼看全。太阳才是它的中心。这一座不过拿来装装样子，可也尽够咱们办事了，不然我才不叫它们排呢。坐到秒针上，不会伤着雏菊。数到一百。对，就是这样。
        - id: ch01-b35
          speaker: narrator
          text: 他们坐上那道密密的白色雏菊线，认认真真数到一百。
        - id: ch01-b36
          speaker: mouldiwarp
          text: 现在的时刻，跟你们刚开始数时一模一样。这下懂了吧？
        - id: ch01-b37
          speaker: narrator
          text: 他们说懂了。我真心希望，你也懂了。
        - id: ch01-b38
          speaker: elfrida
          text: 可我们要是一直坐在这里，还怎么去别的地方？
        - id: ch01-b39
          speaker: mouldiwarp
          text: 去不了。所以得留下一个，另一个去。
        - id: ch01-b40
          speaker: edred
          text: 你去吧，埃尔菲。我在这里等你回来。
        - id: ch01-b41
          speaker: elfrida
          text: 你真好，可我更想跟你一起去。你就不能想个办法吗？
        - id: ch01-b42
          speaker: mouldiwarp
          text: 我当然想得出。可是……他不敢把你留下，自己去。
        - id: ch01-b43
          speaker: elfrida
          text: 他才不会不敢。再说，他本来就比我小两岁。
          emotion: angry
        - id: ch01-b44
          speaker: mouldiwarp
          text: 那你就留下他，自己去。你该明白呀，他把钟停住以后，你去了也等于没去，在这里也等于不在这里。而且……我的意思是，你犯不着这么恼火。他不会知道你走过，也不会相信你已经回来。快走吧，我的姑娘。
        - id: ch01-b45
          speaker: narrator
          text: 埃尔弗丽达犹豫了一下，接着忽然开口。
        - id: ch01-b46
          speaker: elfrida
          text: 哦，埃德雷德，我经历了一件特别了不得的事！你觉得我去了很久吗？我知道不该待那么久，可那边实在太有趣，我没办法早点回来。
        - id: ch01-b47
          speaker: edred
          text: 胡说。好吧，你想去就去，我才不在乎。
        - id: ch01-b48
          speaker: elfrida
          text: 我都告诉你了，我已经去过啦。
        - id: ch01-b49
          speaker: narrator
          text: 她说着，把埃德雷德从秒针上拖下来。雏菊小兵立刻又绕着圈走起来。
        - id: ch01-b50
          speaker: mouldiwarp
          text: 这下明白了吧。下回再想让钟停住，咱们拿独轮车压住它就成。现在玩儿去吧。这个礼拜四，你们遇见的阿登魔法已经够多啦。愿老天保佑你们的小心肝儿。
        - id: ch01-b51
          speaker: narrator
          text: 于是，他们走了。在埃德雷德眼里，这场名叫“拦路强盗和——”的历险就是这样。不过先别急着往下猜，因为埃尔弗丽达经历的事完全不同。
        - id: ch01-b52
          speaker: narrator
          text: 白鼹鼠精说完“我的姑娘”，埃尔弗丽达迟疑了一会儿，才慢慢走向城堡。红屋顶从爬满常春藤的古老灰扶壁间露出来。她回头望去，埃德雷德和白鼹鼠精紧挨着坐在绿白相间的神奇大钟上，一动不动。她终于下定决心，冲进屋里，跑上楼，立刻找到了那扇门。她关上门，打开右边第二只箱子。
        - id: ch01-b53
          speaker: elfrida
          text: 换一身衣裳，时代也换装。要做的事情，就是变个样。咕噜噜，咕噜噜，咕噜噜，咕噜噜。
        - id: ch01-b54
          speaker: narrator
          text: 这声音可能来自鸽子，也可能来自寂静，也可能就是埃尔弗丽达自己。
        - id: ch01-b55
          speaker: elfrida
          text: 不知道莎士比亚刚开始当诗人时，是不是也这样。明明不想写诗，脑子里却忽然冒出几句怪话。
        - id: ch01-b56
          speaker: narrator
          text: 她一边说，一边套上一条绿色的绗缝缎衬裙，上面绣着粉红玫瑰花蕾。然后，她又穿上粉白相间的锦缎裙。她满脑子都在想“我国伟大诗人埃尔弗丽达·阿登小姐”，还有“当今女弥尔顿，阿登小姐”。接着，她戴好柔软的白帽子，在下巴底下系上粉红缎带，跑去开门。
        - id: ch01-b57
          speaker: narrator
          text: 她一点也不怕，觉得自己不过是走进一场梦，梦里的一切都不会是真的。可她刚跑过阁楼门，袖口的花边就被一枚生锈的大钉子勾住，刺啦一声撕破了。她顿时心疼起来。虽然这一切也许只是梦，那块花边摸起来却真得很，而且美极了。可是，她连半个念头的一半都来不及分给花边。
        - id: ch01-b58
          speaker: narrator
          text: 她还没来得及多想，便发现门外不再是阿登城堡那条挂满古老版画的安静走廊，而是一间完全陌生的护墙板房间。屋里乱糟糟塞满了羽毛、裙子、斗篷、帽盒、大小包裹、布卷、花边、围巾、帽子、手套和各式各样的华丽饰物。屋里的人也不少。女仆们忙来忙去，一位穿膝裤的先生正托着漆盘，展示精美的瓷器。房间正中央坐着一个非常漂亮、神情慵懒的年轻小姐，埃尔弗丽达一眼就喜欢上了她。所有女人都穿着大得吓人的裙撑，也就是箍裙。
        - id: ch01-b59
          speaker: bette
          text: 咦，表妹，你一直躲在柜子里吗？真是个鬼灵精！快来看看，这条新围巾配不配你的贝特，是不是时髦极了？
        - id: ch01-b60
          speaker: elfrida
          text: 是的。
        - id: ch01-b61
          speaker: narrator
          text: 她实在不知道还能说什么。周围的一切先颤了颤，又扭了一扭，就像万花筒里的玻璃碎片快要落定、还没拼成图案时的样子。接着，那些玻璃片似的东西果然各就各位了。埃尔弗丽达不再觉得自己只是在看一幅画，她已经活在一群活生生的人中间。
        - id: ch01-b62
          speaker: narrator
          text: 不知发生过什么奇异的巧合，埃尔弗丽达牢牢记得安妮女王在一七〇二年即位。这样的巧合究竟是怎么回事，谁也说不清，不过有时候的确会发生。她还知道，安妮女王时代的女人穿箍裙。上一次，他们回到波尼的年代，时间向后退了一百年。那么这一次，也许足足退了两百年。如果真是这样……
        - id: ch01-b63
          speaker: elfrida
          text: 请问，现在是一七〇七年吗？安妮女王已经死了吗？
        - id: ch01-b64
          speakers: [bette, maid_1, maid_2, maid_3]
          ensemble: chorus
          text: 上帝保佑，可千万别这样！
          emotion: surprised
        - id: ch01-b65
          speaker: bette
          text: 哎呀，孩子，别拿这种胡话耽误时间。马车十点就来，今晚我们还得赶到坦布里奇住下呢。
        - id: ch01-b66
          speaker: narrator
          text: 埃尔弗丽达把眼睛睁得大大的，耳朵也竖起来。她挤到帽盒和一卷绣着粉红花朵的厚绸之间，躲在角落里看着、听着。渐渐地，她弄明白了。贝特是她的表姐，也姓阿登。她要和贝特、女仆们，还有多得叫她数不清的一队男护卫一起回阿登。之所以带那么多男人，是因为阿登家的珠宝刚按最新式样重新镶过，贝特还带着阿登叔叔送的珍珠项圈和别的礼物。最近拦路强盗胆大包天，听说大白天都敢在圣保罗教堂院里袭击马车。
        - id: ch01-b67
          speaker: narrator
          text: 贝特答应替阿登附近所有的女友们捎东西，却把大半都拖到最后一刻才买。她在伦敦时一直小心花自己的零用钱，这会儿花起朋友们的钱来，倒又快又痛快。商人们把房间挤得满满的，男人女人甚至互相推搡，都想凑到这位有钱可花的小姐身边。一个女人提着一篮瓷器，提出用它们换旧衣服和旧鞋子，简直和后来那些从后门上门换东西的老太太一模一样。贝特的一个女仆觉得自己占了天大的便宜。她拿一件穿旧的蓝色罗缎裙，再加一条紫罗兰色的绗缝缎箍裙，换回一把瓷茶壶和两只盘子。
        - id: ch01-b68
          speaker: narrator
          text: 大家匆匆吃了糕饼，喝了热巧克力。埃尔弗丽达被长下摆的外套和一条条围巾裹得快受不了时，马车总算到了。所有人好不容易才挤进车厢，里面闷得透不过气。马车虽大，东西却更多。贝特和她的大箍裙、女仆们、帽盒，还有大小形状都不一样的包裹，全塞在一起。那条讨厌的宠物小狗也来了。它又叫又咬，从男仆到埃尔弗丽达，谁靠近都不放过。六月的烈日晒着狭窄肮脏的街道，空气难闻极了。
        - id: ch01-b69
          speaker: narrator
          text: 车厢里又热又闷，还颠得无法想象，简直比货车横穿刚犁过的麦田更颠。埃尔弗丽达头疼起来，那感觉就像坐着小船出海，旁人却硬说一点风浪也没有。到了刘易舍姆，她全身骨头都像挨过一顿打。车子根本没有弹簧，倒像海边的更衣车被拖回来，正经过铺满卵石的那段路。人在里面东倒西歪，衣服没法继续穿，所有东西也都从座位上滑下来。
        - id: ch01-b70
          speaker: narrator
          text: 女仆们个个满脸不高兴。贝特说自己前一晚跳舞跳到快半夜，今天却跟云雀一样早起，说完就缩在角落里睡着了，睡着的脸比女仆们还不高兴。埃尔弗丽达渐渐生出一种空落落、什么都没意思的感觉，真希望自己根本没来。马车在青翠的乡野间一路猛冲乱响，车轮不断跳进最可怕的深辙。有几次轮子陷得太深，所有男人一齐动手，费了好大力气才把它抬出来。
        - id: ch01-b71
          speaker: bette
          text: 真是烦死人了。
          emotion: angry
        - id: ch01-b72
          speaker: narrator
          text: 她说完立刻又睡着了。除了那条叫阿穆尔的小狗，埃尔弗丽达是车里个头最小的，老是不由自主地被颠到别人腿上，她和被撞的人都觉得恼火。这是她坐过最难受、最不舒服的一趟车。她想起火车平稳又飞快地奔驰。和眼前这辆马车相比，就连运货人的马车也算得上享受。
        - id: ch01-b73
          speaker: elfrida
          text: 这些路哪像路，简直是犁过的田，里面还挖满了种芹菜的沟。
        - id: ch01-b74
          speaker: narrator
          text: 她有一个种菜的朋友，所以很清楚。马车还远远没有停到坦布里奇的“公牛”旅店门前，她已经觉得，只要手边有几句诗，自己准会马上念出来，请白鼹鼠精送她回到自己的时代。那里至少有装着弹簧的马车，也有真正像路的路。等马车终于停下，她全身都僵硬了，几乎没法站起来。
        - id: ch01-b75
          speaker: innkeeper
          text: 快进来吧，我的小宝贝儿。不是我夸口，这里已经备好一顿上好的晚餐，还有一张又柔软又干净的床。整个肯特郡都找不到比它更好的，这话你尽管信我。
        - id: ch01-b76
          speaker: narrator
          text: 马夫和马厩伙计大声呼喊，到处乱成一片。旅客还没完全下车，马匹已经卸了。晚餐摆在楼上一间宽大低矮的房里，擦亮的家具闪闪发光。房间两头都有窗户，一头对着大路，“公牛”的招牌在那里吱呀摇晃，另一头望向整洁的绿花园，里面有修剪齐整的黄杨树篱和紫杉凉亭。要把所有行李搬进来，看样子还得忙很久。埃尔弗丽达看出没人会留意自己，便悄悄溜下那道拐角不断、曲曲折折的后楼梯，穿过后厨，来到花园。总算能伸伸腿，不再受挤、受撞、受颠了，实在舒服。只是她沿着草径走得很端庄，因为身子确实太僵。
        - id: ch01-b77
          speaker: narrator
          text: 她在紫杉凉亭里遇见了平生见过最气派、最英俊的先生。他戴着扑满香粉的白色假发，两边蓬松又饱满。身上是深蓝色丝绸大摆外套，里面的长背心绣着最漂亮的玫瑰和勿忘我，一束束花还用金色缎带系在一起。他的袖口装饰着花边，胸前别着宝石饰针，更有一双全世界最快活的蓝眼睛。那双快活的眼睛正十分亲切地望着埃尔弗丽达。
        - id: ch01-b78
          speaker: gentleman
          text: 我敢说，来的是一位贵族小姐，还带着整队随从出门。
        - id: ch01-b79
          speaker: elfrida
          text: 我是阿登的阿登小姐。
        - id: ch01-b80
          speaker: gentleman
          text: 愿意为您效劳，小姐。
        - id: ch01-b81
          speaker: narrator
          text: 他立刻站起来，挥动帽子，潇洒地深深鞠躬。埃尔弗丽达回了个不大合规矩的屈膝礼，眼下也只能这样了。
        - id: ch01-b82
          speaker: gentleman
          text: 我怎样做，才能让阿登的阿登小姐高兴？您愿意骑骑我的黑牝马吗？
        - id: ch01-b83
          speaker: elfrida
          text: 哦，不用了，谢谢您。
        - id: ch01-b84
          speaker: gentleman
          text: 看着你这双眼睛，我可没想到胆怯会住在里面。
        - id: ch01-b85
          speaker: elfrida
          text: 我根本不害怕。我只是坐那辆可怕的马车赶了一整天路，再也不想骑任何东西了。
        - id: ch01-b86
          speaker: narrator
          text: 他又笑起来。
        - id: ch01-b87
          speaker: gentleman
          text: 好吧，好吧。过来坐在我旁边，跟我讲讲城里的新鲜事。
        - id: ch01-b88
          speaker: narrator
          text: 埃尔弗丽达想到自己能告诉他的那些新闻，忍不住先笑了，接着又皱紧眉头，拼命找一件听起来不像胡话的。她把自己知道的贝特表姐和这趟旅程的事全讲了。那位先生很有礼貌，显得听得津津有味。她还把贝特买的东西一件件说出来，有珍珠项圈、嵌着珊瑚的金香丸盒、小金表，还有重新镶过的传家珠宝。
        - id: ch01-b89
          speaker: gentleman
          text: 这么说，今晚你们能好好歇一夜，不必再坐那辆残酷的马车了？
        - id: ch01-b90
          speaker: elfrida
          text: 是呀，明天吃过早餐才继续走。真没意思，又慢得要命！要是有辆马车，由一匹会喷火的铁马拉着，一小时跑六十英里，您难道不想坐吗？
        - id: ch01-b91
          speaker: gentleman
          text: 你的脑子这样机灵，我真希望我的妻子也一样聪明。等你长大了，愿意嫁给我吗？
        - id: ch01-b92
          speaker: elfrida
          text: 不愿意。您会太老的。就算能一直活到我长大，那时也老得过头了。
        - id: ch01-b93
          speaker: gentleman
          text: 那你猜猜，等你十七岁时，我会有多大？
        - id: ch01-b94
          speaker: elfrida
          text: 我得算算。
        - id: ch01-b95
          speaker: narrator
          text: 她还挺会做这种算术题。她从醋栗丛上折下一根细枝，在泥地上划了起来。最后，她涨红着脸抬起头，又用红鞋跟把地上的算式踩掉。
        - id: ch01-b96
          speaker: elfrida
          text: 我不知道。不过我想，您大概会有二百三十岁。
        - id: ch01-b97
          speaker: narrator
          text: 他笑得更厉害了，坚持说她正是自己中意的小姐。
        - id: ch01-b98
          speaker: gentleman
          text: 按照你的算法，我的收入能翻十番，然后再加一倍。
        - id: ch01-b99
          speaker: narrator
          text: 那位漂亮先生实在亲切极了，先请她尝一尝自己喝的酒，可她一点也不喜欢。接着，他又请她吃放在红蓝花盘里的小蛋糕，这个她倒很喜欢。
        - id: ch01-b100
          speaker: elfrida
          text: 那您叫什么名字？
        - id: ch01-b101
          speaker: gentleman
          text: 我的名字是个秘密。你守得住秘密吗？
        - id: ch01-b102
          speaker: elfrida
          text: 守得住。
        - id: ch01-b103
          speaker: gentleman
          text: 我也守得住。
        - id: ch01-b104
          speaker: narrator
          text: 就在这时，一个气冲冲的女仆甩着裙摆，从黄杨树篱间猛冲出来，一把拖走埃尔弗丽达。她连规规矩矩行个礼，再说一句“谢谢您待我这么亲切”，都来不及。
        - id: ch01-b105
          speaker: gentleman
          text: 再会。我们一定还会见面。下次我就把你掳走，关进高塔两百年。等你长到十七岁，也学会算术，我再放你出来。
        - id: ch01-b106
          speaker: narrator
          text: 女仆打了埃尔弗丽达一巴掌，她气得几乎喘不上气。接着，女仆把她按到楼上的大房间里吃晚餐，还愤愤地讲起自己在哪里发现了埃尔弗丽达，又怎样看见她和一个陌生男人说话。贝特听完事情的来龙去脉，埃尔弗丽达便把自己的故事讲给她。
        - id: ch01-b107
          speaker: elfrida
          text: 他真是个特别好的人。
        - id: ch01-b108
          speaker: bette
          text: 一个什么？
        - id: ch01-b109
          speaker: elfrida
          text: 一个非常漂亮的先生。真希望您当时也在那里，贝特表姐。您肯定也会喜欢他。
        - id: ch01-b110
          speaker: narrator
          text: 于是，贝特表姐也打了她一巴掌。埃尔弗丽达挨了这一下，比刚才更加盼望自己早已替白鼹鼠精准备好了几句诗，好让她马上离开这里。
        - id: ch01-b111
          speaker: narrator
          text: 第二天还是一路颠簸。埃尔弗丽达已经受够了这一切。
        - id: ch01-b112
          speaker: elfrida
          text: 哦，真希望能发生点什么！
        - id: ch01-b113
          speaker: narrator
          text: 这一天的路比前一天还长。暮色降下来时，他们仍没到达。太阳红彤彤地沉到黑树后面，四周褐色的昏暗越来越浓。马车来到一个十字路口，忽然有个披斗篷、戴面具的男人骑着高大的黑马，从树篱后猛然跃出。他在马鞍上俯下身，拉开车门，一把抓住埃尔弗丽达宽大旅行外套上的褶裥。那人力气一定大得吓人，那些衣褶也一定结实得吓人。他把她稳稳当当又舒舒服服地放到自己身前的马鞍上。
        - id: ch01-b114
          speaker: gentleman
          text: 把值钱的东西交出来，不然我就开枪打马。你们也把手枪放低。瞄准我，会打中孩子。打中我的马，孩子就会跟我一起摔下去。
        - id: ch01-b115
          speaker: narrator
          text: 他隔着黑面具说着这些话，同时已经调转马头，用自己的身体严严实实挡在埃尔弗丽达和男仆们举起的手枪之间。
        - id: ch01-b116
          speaker: bette
          text: 你到底想要什么？我们哪有什么值钱东西，不过是回自家农庄的普通乡下人！
          emotion: fearful
        - id: ch01-b117
          speaker: gentleman
          text: 我要珍珠项圈、香丸盒、小金表，还有重新镶过的那些珠宝。
        - id: ch01-b118
          speaker: narrator
          text: 埃尔弗丽达这才明白他是谁。
        - id: ch01-b119
          speaker: elfrida
          text: 哦，你真卑鄙！
          emotion: angry
        - id: ch01-b120
          speaker: gentleman
          text: 买卖就是买卖。好了，美丽的小姐……
        - id: ch01-b121
          speaker: narrator
          text: 可他圈着她的手臂又温柔又亲切。男仆们迟疑着，手指还在拨弄手枪。马匹被这场突然的拦截吓坏了，在路上跳来跳去。女仆们高声说，他讲得没错，孩子就在他手上。宁可丢掉几件珠宝，也不能让大家丢了性命。贝特坐在昏暗的车厢里，一会儿抽泣，一会儿哀号。最后，珠宝还是一件件交了出去，交得又慢又不情愿，事情就这样结束了。贝特后来还说，暮色中伸手接珠宝的那只手白得出奇。
        - id: ch01-b122
          speaker: narrator
          text: 埃尔弗丽达一动不动，仍被拦路强盗的手臂圈着。忽然，他低下头，在她耳边轻声问。
        - id: ch01-b123
          speaker: gentleman
          text: 你怕我会伤害你吗？
        - id: ch01-b124
          speaker: elfrida
          text: 不怕。
        - id: ch01-b125
          speaker: narrator
          text: 直到今天，她也不知道自己为什么不怕。
        - id: ch01-b126
          speaker: gentleman
          text: 那么……哦，多勇敢的小小姐。
        - id: ch01-b127
          speaker: narrator
          text: 话还没说完，他猛踢马刺，跃过低矮的树篱，随即又一下勒住缰绳。
        - id: ch01-b128
          speaker: gentleman
          text: 回家去吧，好汉们！今晚的事谁都不许多嘴。我会赶在你们前面到阿登。
        - id: ch01-b129
          speakers: [maid_1, maid_2, maid_3, bette]
          ensemble: chorus
          text: 孩子！哦，孩子！
          emotion: fearful
        - id: ch01-b130
          speaker: gentleman
          text: 要不要我先到阿登，替你们吩咐晚餐？
        - id: ch01-b131
          speaker: narrator
          text: 他嘲弄地回喊一声，便带着埃尔弗丽达越野飞奔。她吓得喘不过气，却很清楚自己十分勇敢，整个身子向后靠在他的肩头。高大强壮的黑马载着她，穿过完全陌生的乡野，奔向越来越深的夜色。一条可以信赖的手臂紧紧圈着她，马儿巨大肩膀上的肌肉在她无力垂下的双腿间一起一伏。那感觉奇妙极了。她不再想白鼹鼠精，也不再试着当诗人。
        - id: ch01-b132
          speaker: narrator
          text: 没过多久，他们已经来到高高的阿登山顶。从山顶向下望去，阿登城堡的灯火正在下面的夜色里一盏接一盏地闪烁。
        - id: ch01-b133
          speaker: gentleman
          text: 好了，小甜心。我把你放在能看见大门的地方，等门打开再走。发生的事，你都可以告诉他们，只有我接下来讲的不能说。你还会见到我，别人认不出我，你却认得出。替我保密到明天。我发誓，阿登小姐会拿回所有珠宝。你也会得到一只金挂盒，等你十七岁、我二百三十岁时，可以在里面放你心上人的头发。记住，客厅窗户要留一条缝。我敲窗，你就过来。说定了？
        - id: ch01-b134
          speaker: elfrida
          text: 这么说，你并不是真正的拦路强盗？
        - id: ch01-b135
          speaker: gentleman
          text: 要是我告诉你，我是詹姆斯三世，是英格兰合法的国王，回来拿回自己的王位，你会怎么说？
        - id: ch01-b136
          speaker: elfrida
          text: 哦！
          emotion: surprised
        - id: ch01-b137
          speaker: narrator
          text: 他把她放到地上。她独自走到城堡的大门前，用拳头砰砰地敲门。她先把自己的遭遇告诉仆人，后来又给贝特和女仆们从头讲了一遍。大家哀叹够了，也惊讶够了，渐渐开始觉得饿。总之，仆人们全去了厨房，催着快些把晚餐端上桌。客厅里只留下贝特和埃尔弗丽达两个人。埃尔弗丽达照着那位先生的吩咐，尽职地把窗户留了一道缝。
        - id: ch01-b138
          speaker: narrator
          text: 月桂树爬满客厅外面的那一侧墙，被微风吹动，枝叶轻轻敲打窗子。埃尔弗丽达走到窗边的座位前。没有人，只是月桂树。可就在下一刻，真的有一只手敲了敲窗，那是一只戴着戒指的手。窗前还露出一块白色的小方片，是一封信。
        - id: ch01-b139
          speaker: gentleman
          text: 交给贝蒂·阿登小姐。
        - id: ch01-b140
          speaker: narrator
          text: 埃尔弗丽达把信拿到表姐身边，放在她绣花丝裙的膝头。
        - id: ch01-b141
          speaker: bette
          text: 给我的，孩子？你从哪儿拿来的？
        - id: ch01-b142
          speaker: elfrida
          text: 读吧，是一位先生送来的。
        - id: ch01-b143
          speaker: bette
          text: 天哪，今天到底是什么日子！先遇到拦路强盗，丢了珠宝，现在又送来一封情书。
          emotion: surprised
        - id: ch01-b144
          speaker: narrator
          text: 她拆开信，读了一遍，又读了一遍。然后，她无力地伸出手，把在指间颤抖的信纸递给埃尔弗丽达。埃尔弗丽达干脆利落地接过来，自己读了。信上的字迹清楚又漂亮。信里写着，圣乔治骑士因为紧急国事，正在秘密巡视自己的王国，恳请忠诚的阿登家准许他在府中栖身藏匿。
        - id: ch01-b145
          speaker: elfrida
          text: 你先别尖叫。圣乔治骑士是谁？
        - id: ch01-b146
          speaker: bette
          text: 是我们的国王，流亡在外的国王詹姆斯三世。哦，叔叔怎么偏偏不在家？要是被人发现，他们会杀死国王的。我该怎么办？我到底该怎么办？
          emotion: fearful
        - id: ch01-b147
          speaker: elfrida
          text: 什么怎么办？别犯傻，你就该答应呀。这是多光荣的机会！以后每个人都会说你有多勇敢。他是美王子查理吗？将来会当国王吗？
        - id: ch01-b148
          speaker: bette
          text: 不，不是查理，是詹姆斯。叔叔希望他当国王。
        - id: ch01-b149
          speaker: narrator
          text: 埃尔弗丽达的历史课每逢来了新同学，就要从一〇六六年重新讲起，所以她只学到爱德华四世。至于查理王子，她也只在歌谣和故事书里听说过。
        - id: ch01-b150
          speaker: elfrida
          text: 那我们就帮他。说不定他能登上王位，全是你的功劳呢。等他当了国王，就会封你做某个地方的公爵遗孀，还会送你一幅镶满钻石的本人画像。现在别叫，他就在外面。我去请他进来。我们能把他藏在哪儿？
