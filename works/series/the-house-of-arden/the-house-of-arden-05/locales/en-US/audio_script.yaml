  chapters:
    - id: ch01
      title: "CHAPTER V. THE HIGHWAYMAN AND THE ----"
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            They both meant their promise. Of course, nobody can promise never to do anything again. You must do something, even if it is only subtraction or eating poached eggs and sausages. What they meant was that they would never again give Mrs. Honeysett a moment of worry. To manage that, they first had to learn how to turn back the clock.
        - id: ch01-b02
          speaker: narrator
          text: >-
            Elfrida slowly munched her sausage. Eating slowly always made her feel wonderfully virtuous, as if she deserved a prize or a medal. Meanwhile, she asked her mind to have some poetry ready by the end of breakfast. Her mind worked on it in its own secret backyard, while the front part of her mind wished she had been born a poet.
        - id: ch01-b03
          speaker: elfrida
          text: >-
            Like the poet who wrote about the favorite goldfish that drowned in a tub of cats.
        - id: ch01-b04
          speaker: edred
          text: >-
            Yes, or even Shakespeare. Though he always goes on so long.
        - id: ch01-b05
          speaker: elfrida
          text: "I wonder where the clock is, the one we have to turn back."
        - id: ch01-b06
          speaker: edred
          text: "Oh, the Mouldiwarp will tell us."
        - id: ch01-b07
          speaker: narrator
          text: >-
            But the Mouldiwarp did not. After breakfast, the children went out to the grass inside the castle ruins. Gray, stately walls rose around them, with wallflowers and toadflax growing from the stones. They sat among the white, round-faced daisies and compared what they had thought, or believed they had thought, when they were back in the days when everyone feared Boney.
        - id: ch01-b08
          speaker: narrator
          text: >-
            The grass was very green, the daisies very white, and the sun made everything look grand and golden. As Elfrida sat there, she suddenly felt how good Arden was and how lucky they were to call it home. It was far better than the house on the red-paved street, with its pale brass knocker and lodgers forever ringing their bells. Before she knew she meant to speak, the words came.
        - id: ch01-b09
          speaker: elfrida
          text: >-
            Arden, Arden, Arden, lawn and castle and garden. Daisies and grass and wallflowers gold, Mouldiwarp, come out of the mould.
        - id: ch01-b10
          speaker: mouldiwarp
          text: >-
            Now that sounds more like poetry. Better than anything I've heard you say yet. So then, what do you want on this fine day?
        - id: ch01-b11
          speaker: narrator
          text: >-
            The white mole was sitting on the grass between them, and it seemed in such a good temper that Elfrida finally asked the question that had been waiting inside her.
        - id: ch01-b12
          speaker: elfrida
          text: "Why do you talk the way the country people do?"
        - id: ch01-b13
          speaker: mouldiwarp
          text: >-
            Sussex born and bred. They call Sussex speech racy of the soil. Means it smells of the earth where I live. But I know every sort of talk. Once upon a time I could spit French, young Fitz-le-seigneur.
        - id: ch01-b14
          speaker: edred
          text: "You must know ever so much."
        - id: ch01-b15
          speaker: mouldiwarp
          text: "I do."
        - id: ch01-b16
          speaker: narrator
          text: >-
            Elfrida warned Edred not to be rude, but he asked anyway.
        - id: ch01-b17
          speaker: edred
          text: "How old are you?"
        - id: ch01-b18
          speaker: mouldiwarp
          text: >-
            As old as my tongue, and a little older than my teeth.
        - id: ch01-b19
          speaker: narrator
          text: "The mole showed them its teeth."
        - id: ch01-b20
          speaker: elfrida
          text: >-
            Oh, don't be cross. It is such a beautiful day, and we wanted you to show us how to put the clock back.
        - id: ch01-b21
          speaker: mouldiwarp
          text: >-
            That's quite a deed. But you haven't quarreled for three days, so you may go where you please and do what you will. If you want to stop the clock, though, you're in the way down here. Climb the gate tower and look out. The moment you see the great clock face, come straight down and sit on the second hand. If anything can stop it, that will.
        - id: ch01-b22
          speaker: narrator
          text: >-
            The children looked through the breezy arch of the gate tower. Ivy ends swung around them, and pigeon wings rustled and whirred. Below, something very strange was happening.
        - id: ch01-b23
          speaker: narrator
          text: >-
            The green grass and white daisies seemed to swim before their eyes. The lawn inside the castle walls had always been uneven. No careful gardeners had laid it with levels and rollers because they wanted a proper lawn. Nature herself had only wanted to cover the broken crockery, stones, old birds' nests, and all the other odd rubbish. Now the lawn stretched like a living carpet. It pulled itself straight and tight until it lay perfectly flat. Some parts grew greener, while other patches of white became thicker and purer.
        - id: ch01-b24
          speaker: edred
          text: "Look! The daisies are walking!"
          emotion: surprised
        - id: ch01-b25
          speaker: narrator
          text: >-
            They were. The daisies moved stiffly and steadily, like tiny soldiers under perfect drill. They formed pairs, then fours, then companies. From the tower window, it looked as though thousands of little white beads were sorting themselves out from the green ones.
        - id: ch01-b26
          speaker: edred
          text: "What are they going to do?"
        - id: ch01-b27
          speaker: narrator
          text: >-
            Elfrida could not answer. The daisies marched on as if they knew their work exactly. They gathered into regiments and armies, and certain companies stopped at certain places on the smooth grass.
        - id: ch01-b28
          speaker: edred
          text: "They're making a pattern. Look, there's a huge ring around it all."
        - id: ch01-b29
          speaker: elfrida
          text: "Of course they are! Look, Edred. It's the clock!"
          emotion: surprised
        - id: ch01-b30
          speaker: narrator
          text: >-
            And it was. A vast circle of packed white daisies lay on the pure green lawn. Inside were all twelve numbers of a clock face. White daisies made the hour hand and minute hand. Between the six and the center was a smaller white circle, and around it moved a daisy second hand. It wheeled so precisely that the proudest general in the country might have wept with admiration.
        - id: ch01-b31
          speaker: narrator
          text: >-
            Together, the children stumbled down the dark, dusty, cobwebbed, twisting stairs and raced across the lawn. The Mouldiwarp sat in the very center of the clock face, looking rather pleased with itself.
        - id: ch01-b32
          speaker: elfrida
          text: "How did you ever do it?"
          emotion: surprised
        - id: ch01-b33
          speaker: mouldiwarp
          text: >-
            The daisies did it. Poor little things can't invent anything, but they carry out somebody else's ideas nicely enough. All white things have to obey me, of course.
        - id: ch01-b34
          speaker: elfrida
          text: "And is this the Clock?"
        - id: ch01-b35
          speaker: narrator
          text: "The Mouldiwarp giggled."
        - id: ch01-b36
          speaker: mouldiwarp
          text: >-
            My child, what an idea! The real clock is far too big for you ever to see all at once. The sun is its center. This one is only a make-believe clock. It will do what we need, or I wouldn't have ordered it for you. Sit on the second hand. No, you won't hurt the daisies. Now count to a hundred.
        - id: ch01-b37
          speaker: narrator
          text: >-
            They sat on the close white line of daisies and counted with great care.
        - id: ch01-b38
          speaker: mouldiwarp
          text: >-
            There. It is exactly the same time as when you began. Now you understand.
        - id: ch01-b39
          speaker: narrator
          text: >-
            They said they did, and I very much hope you do too.
        - id: ch01-b40
          speaker: elfrida
          text: "But if we sit here, how can we ever go anywhere else?"
        - id: ch01-b41
          speaker: mouldiwarp
          text: "You can't. One of you must stay while the other goes."
        - id: ch01-b42
          speaker: edred
          text: "You go, Elfie. I'll wait here until you come back."
        - id: ch01-b43
          speaker: elfrida
          text: >-
            That's very dear of you, but I'd rather have us go together. Can't you arrange that?
        - id: ch01-b44
          speaker: mouldiwarp
          text: >-
            I could, of course. But he's afraid to go without you.
        - id: ch01-b45
          speaker: elfrida
          text: "He is not! And he's two years younger than I am, anyway."
          emotion: angry
        - id: ch01-b46
          speaker: mouldiwarp
          text: >-
            Then go without him. You understand, don't you? While he stops the clock, your going and not going are the same thing. Your being here and not being here are the same, and— What I mean is, don't get so terribly upset. He won't know you've gone, and he won't believe you've come back. Off you go, my girl.
        - id: ch01-b47
          speaker: narrator
          text: "Elfrida hesitated. Then she spoke to Edred as if she had already returned."
        - id: ch01-b48
          speaker: elfrida
          text: >-
            Oh, Edred, I've had such an adventure! Did it feel very long? I know it was horrid of me, but it was so interesting that I couldn't come back any sooner.
        - id: ch01-b49
          speaker: edred
          text: "Nonsense. Go if you want to. I don't mind."
        - id: ch01-b50
          speaker: elfrida
          text: "I'm telling you, I've already been!"
        - id: ch01-b51
          speaker: narrator
          text: >-
            She pulled him off the second hand, and the daisy soldiers instantly began wheeling around again.
        - id: ch01-b52
          speaker: mouldiwarp
          text: >-
            There, now you see. Next time you want to stop the clock, we'll wheel the barrow onto it. Off you go and play. You've had enough Arden magic for this Thursday, bless your hearts.
        - id: ch01-b53
          speaker: narrator
          text: >-
            And they went. That was how Edred experienced the adventure of “The Highwayman and the—” But we must not get ahead of the story. To Elfrida, the adventure seemed quite different.
        - id: ch01-b54
          speaker: narrator
          text: >-
            After the Mouldiwarp called her “my girl,” Elfrida slowly crossed toward the castle. The red roof of the house showed between old gray buttresses covered in ivy. She looked back. Edred and the Mouldiwarp were close together on the wonderful green-and-white clock, perfectly still. Then she made up her mind. She ran inside, hurried upstairs to the Door, found it at once, shut it behind her, and opened the second chest on the right.
        - id: ch01-b55
          speaker: elfrida
          text: >-
            You change your clothes and the times change too. Change is what you've got to do. Coo-roo, coo-roo, coo-roo, coo-roo.
        - id: ch01-b56
          speaker: narrator
          text: >-
            Perhaps the pigeons said it. Perhaps the silence did. Or perhaps it was Elfrida herself. She slipped on a green satin petticoat, quilted and embroidered with pink rosebuds.
        - id: ch01-b57
          speaker: elfrida
          text: >-
            I wonder if Shakespeare became a poet this way, with odd little lines coming into his head when he didn't mean them to.
        - id: ch01-b58
          speaker: narrator
          text: >-
            As she put on a pink-and-white brocade dress, her mind filled with phrases like “Our great poet, Miss Elfrida Arden,” and “Miss Arden, the female Milton of modern times.” She tied a soft white cap beneath her chin with pink ribbons and ran to open the door.
        - id: ch01-b59
          speaker: narrator
          text: >-
            She was not afraid at all. It felt like stepping into a dream, where nothing would be real. Then her sleeve caught on a large rusty nail as she ran through the attic doorway. The beautiful lace tore with a harsh hiss, and Elfrida felt truly sorry. For something inside a dream, that lace felt very real.
        - id: ch01-b60
          speaker: narrator
          text: >-
            She barely had time for half a thought about it. The door had not opened onto Arden Castle's quiet hallway with its old prints. It opened into an unfamiliar paneled room in extraordinary disorder. Everywhere lay feathers, dresses, cloaks, bonnet boxes, parcels, rolls, packets, lace, scarves, hats, gloves, and finery of every sort.
        - id: ch01-b61
          speaker: narrator
          text: >-
            The room was crowded. There were serving maids, a gentleman in knee breeches displaying fine china on a lacquered tray, and, at the center, a very pretty young lady with a languishing look. Elfrida loved her at once. Every woman wore an enormous hooped skirt.
        - id: ch01-b62
          speaker: bet
          text: >-
            What, cousin? Have you been hiding in the closet all this time? You sly little creature! Come and see how my new scarf suits your Bet. Isn't it wonderfully fashionable?
        - id: ch01-b63
          speaker: elfrida
          text: "Yes, it is wonderfully fashionable."
        - id: ch01-b64
          speaker: narrator
          text: >-
            She had no idea what else to say. Everything trembled and twisted, like colored glass in a kaleidoscope just before it settles into a pattern. Then the pieces seemed to fall into place. Elfrida no longer felt as though she were looking at a picture. She was alive among living people.
        - id: ch01-b65
          speaker: narrator
          text: >-
            By some strange accident, Elfrida remembered that Queen Anne began her reign in 1702. Such accidents do happen. She also knew that ladies wore hoops in Queen Anne's time. Their first adventure had carried them back a hundred years, to Boney's day. Perhaps this second one had taken her back two hundred years. If that was so—
        - id: ch01-b66
          speaker: elfrida
          text: "Please, is this the year 1707? And is Queen Anne dead?"
        - id: ch01-b67
          speakers: [room_woman_1, room_woman_2, bet]
          ensemble: chorus
          text: "Heaven forbid!"
          emotion: surprised
        - id: ch01-b68
          speaker: bet
          text: >-
            La, child, don't hold us up with your chatter. The coach comes at ten, and we must spend tonight at Tonbridge.
        - id: ch01-b69
          speaker: narrator
          text: >-
            Elfrida squeezed into a corner between a bandbox and a roll of thick pink-flowered silk. There she watched and listened with all her might.
        - id: ch01-b70
          speaker: narrator
          text: >-
            The young lady was Cousin Bet, another Arden. Elfrida learned that she, Bet, the maids, and an escort of several men were all traveling down to Arden. She could not quite discover how many men there were. They needed an escort because they carried the Arden jewels, newly reset in the latest fashion, along with a pearl collar and other gifts from Uncle Arden to Bet. Highwaymen had grown so bold that they would attack a coach in St. Paul's Churchyard in broad daylight.
        - id: ch01-b71
          speaker: narrator
          text: >-
            Bet had promised to shop for all her young friends near Arden, then left most of it until the last moment. She had spent her own allowance carefully during her stay in town, and now she was racing to spend theirs. Tradesmen and women crowded the room and actually pushed one another to reach the lady who had money to spend. One woman carried a basket of china and offered its contents in exchange for old clothes or shoes, much as such women still did at back doors. Bet's maid thought she had made an excellent bargain. She traded away a worn blue silk dress and a violet quilted hooped petticoat and received a china teapot and two dishes.
        - id: ch01-b72
          speaker: narrator
          text: >-
            After a hurried meal of cakes and hot chocolate, Elfrida was wrapped in a long-skirted coat and so many scarves she could hardly bear it. Then the coach arrived. Packing everyone inside was a tight fit, though the carriage was large. It had to hold Bet and her huge hoops, the maids, bandboxes, and parcels of every size and shape. There was also a horrid little pet dog called Amour. The dog yapped, snarled, and tried to bite everybody from the footmen to Elfrida. Outside, the narrow streets were filthy and smelled dreadful in the hot June sun.
        - id: ch01-b73
          speaker: narrator
          text: >-
            Inside the carriage it was hot, airless, and unbelievably bumpy. It jolted worse than a wagon crossing a plowed field. Elfrida began to feel headachy, the way you do in a small boat while everyone insists the water is not rough. By Lewisham, every bone in her body hurt, as if she had been beaten.
        - id: ch01-b74
          speaker: narrator
          text: >-
            The carriage had no springs. It reminded her of a bathing machine bumping over the shingle as it is hauled up the beach. Inside, you tumble helplessly, cannot go on dressing, and watch all your things slide off the seats. The maids looked as cross as they felt. Bet said she had danced nearly until midnight and risen with the lark that morning. As soon as she had said it, she fell asleep in a corner and looked even crosser than the maids.
        - id: ch01-b75
          speaker: narrator
          text: >-
            Elfrida began to feel empty and uninterested and wished she had never come. The carriage plunged and rattled through the green countryside. Its wheels bounced in and out of terrible ruts. More than once, a wheel sank so deep that every man had to help heave it free. Each time, Bet woke long enough to declare it dreadfully annoying, then went straight back to sleep.
        - id: ch01-b76
          speaker: narrator
          text: >-
            Elfrida was the smallest person in the carriage except Amour, so every jolt threw her into somebody's lap. Neither Elfrida nor the person beneath her enjoyed it. This was the most uncomfortable ride she had ever known. She thought longingly of the train's smooth, swift rush. Even the carrier's cart seemed luxurious beside this coach.
        - id: ch01-b77
          speaker: elfrida
          text: >-
            These roads aren't roads at all. They're plowed fields with celery trenches in them.
        - id: ch01-b78
          speaker: narrator
          text: >-
            She knew about celery trenches because one of her friends was a market gardener. Long before they reached the Bull at Tonbridge, Elfrida wished she had a poem ready. She would have called the Mouldiwarp and begged to return to her own time, where carriages had springs and roads truly were roads. When the coach finally stopped, she was so stiff she could hardly stand.
        - id: ch01-b79
          speaker: innkeeper
          text: >-
            Come inside, my poppet. There's a fine supper waiting, though I say it myself, and you won't find a softer, cleaner bed anywhere in Kent. You can count on that.
        - id: ch01-b80
          speaker: narrator
          text: >-
            The pleasant, stout woman wore a frilled cap. Around her came a great bustle of shouting ostlers and stablemen. The horses were taken out before the travelers could even escape the carriage.
        - id: ch01-b81
          speaker: narrator
          text: >-
            Supper waited in a wide, low room upstairs, with shining furniture and windows at both ends. One side looked toward the road, where the Bull's sign creaked and swung. The other looked over a very tidy green garden, with clipped box hedges and shaded yew arbors. Bringing every piece of luggage into the inn looked likely to take a long time. Elfrida saw that nobody would miss her, so she slipped down the twisting, many-cornered back stairs, passed through the back kitchen, and went into the garden.
        - id: ch01-b82
          speaker: narrator
          text: >-
            It felt wonderful to stretch her legs after being cramped, battered, and shaken. Still, she walked quite solemnly down the grass path, because she was terribly stiff.
        - id: ch01-b83
          speaker: narrator
          text: >-
            In a yew arbor, she suddenly came upon the grandest, handsomest gentleman she had ever seen. A full white wig, dusted with powder and thick at the sides, framed his head. He wore a wide-skirted coat of dark blue silk. Beneath it was a long silk waistcoat embroidered with lovely roses and forget-me-nots, tied in little bunches with golden ribbons. Lace ruffles showed at his wrists, and a jeweled brooch shone on his clothes. Best of all, he had the merriest blue eyes in the world, and those eyes looked very kindly at Elfrida.
        - id: ch01-b84
          speaker: gentleman
          text: "A lady of quality, unless I am mistaken, traveling with her household."
        - id: ch01-b85
          speaker: elfrida
          text: "I am Miss Arden of Arden."
        - id: ch01-b86
          speaker: narrator
          text: "He sprang up and swept off his hat in a magnificent bow."
        - id: ch01-b87
          speaker: gentleman
          text: "Your servant, madam."
        - id: ch01-b88
          speaker: narrator
          text: >-
            Elfrida's little curtsy was not the proper sort, but it had to serve.
        - id: ch01-b89
          speaker: gentleman
          text: >-
            How may I please Miss Arden of Arden? Would you care to ride my black mare?
        - id: ch01-b90
          speaker: elfrida
          text: "Oh, no, thank you!"
        - id: ch01-b91
          speaker: narrator
          text: "She answered so earnestly that he laughed."
        - id: ch01-b92
          speaker: gentleman
          text: "I would never have guessed those eyes could hold any fear."
        - id: ch01-b93
          speaker: elfrida
          text: >-
            I'm not afraid. I've been trapped in a horrible carriage all day, and now I never want to ride anything again.
        - id: ch01-b94
          speaker: narrator
          text: "The gentleman laughed once more."
        - id: ch01-b95
          speaker: gentleman
          text: "Very well. Sit beside me instead, and tell me all the news from town."
        - id: ch01-b96
          speaker: narrator
          text: >-
            Elfrida smiled when she thought of all the news from her own time that she could tell him. Then she frowned, trying to find something that would not sound like nonsense. At last, she told him everything she knew about Cousin Bet and their journey. He listened with perfect politeness. She described Bet's purchases one by one: the pearl collar, the gold pomander set with coral, the little gold watch, and the family jewels in their new settings.
        - id: ch01-b97
          speaker: gentleman
          text: "And you may rest all night after suffering through that cruel coach?"
        - id: ch01-b98
          speaker: elfrida
          text: >-
            Yes. We don't leave again until after breakfast. Traveling this way is so dull and so slow! Wouldn't you like a carriage pulled by a fiery iron horse that could race sixty miles in an hour?
        - id: ch01-b99
          speaker: gentleman
          text: >-
            What an inventive wit you have. I should admire such cleverness in my wife. Will you marry me when you are grown into a young lady?
        - id: ch01-b100
          speaker: elfrida
          text: >-
            No. You would be much too old. Even if you managed to stay alive until I grew up, you would still be far too old.
        - id: ch01-b101
          speaker: gentleman
          text: "And how old do you think I shall be when you are seventeen?"
        - id: ch01-b102
          speaker: elfrida
          text: "I'll have to work it out."
        - id: ch01-b103
          speaker: narrator
          text: >-
            Elfrida was rather good at sums. She broke a twig from a currant bush and scratched her figures in the dirt. At last she looked up, flushed, then rubbed out the calculation with her little red-heeled shoes.
        - id: ch01-b104
          speaker: elfrida
          text: "I'm not certain, but I think you'll be two hundred and thirty."
        - id: ch01-b105
          speaker: narrator
          text: "He laughed harder than ever and swore she was exactly the lady for him."
        - id: ch01-b106
          speaker: gentleman
          text: "With arithmetic like yours, my income would grow twenty times over."
        - id: ch01-b107
          speaker: narrator
          text: >-
            He was very kind. He offered her his wine, which she did not like, and the little cakes from a red-and-blue plate, which she did.
        - id: ch01-b108
          speaker: elfrida
          text: "What is your name?"
        - id: ch01-b109
          speaker: gentleman
          text: "My name is a secret. Can you keep a secret?"
        - id: ch01-b110
          speaker: elfrida
          text: "Yes, I can keep one."
        - id: ch01-b111
          speaker: gentleman
          text: "So can I."
        - id: ch01-b112
          speaker: narrator
          text: >-
            Just then, an angry maid came sweeping between the box hedges. She seized Elfrida and dragged her away before the child could curtsy properly or thank the gentleman for his kindness.
        - id: ch01-b113
          speaker: gentleman
          text: >-
            Farewell! We shall certainly meet again. Next time, I shall carry you away and lock you in a tower for two hundred years, until you are seventeen and have learned arithmetic.
        - id: ch01-b114
          speaker: narrator
          text: >-
            The maid slapped Elfrida, and fury nearly choked her. Then she was placed at the supper table in the large upstairs room. The maid indignantly reported finding her “talking with a strange gentleman.” When Bet had heard the whole complaint, Elfrida told her own story.
        - id: ch01-b115
          speaker: elfrida
          text: "And he was such a dear."
        - id: ch01-b116
          speaker: bet
          text: "A what?"
          emotion: surprised
        - id: ch01-b117
          speaker: elfrida
          text: >-
            A very handsome gentleman. I wish you'd been there, Cousin Bet. You would have liked him too.
        - id: ch01-b118
          speaker: narrator
          text: >-
            Then Bet slapped her as well. More than ever, Elfrida wished she had a poem ready for the Mouldiwarp.
        - id: ch01-b119
          speaker: narrator
          text: >-
            The next day's journey was just as bumpy, and Elfrida grew thoroughly tired of it all.
        - id: ch01-b120
          speaker: elfrida
          text: "Oh, I wish something would happen!"
        - id: ch01-b121
          speaker: narrator
          text: >-
            It was a much longer day. They were still on the road when dusk came. The sun had gone down red behind black trees, and brown twilight was thickening all around them. At a crossroads, a masked man in a cloak burst suddenly from the hedge on a great black horse. He bent low from the saddle, opened the carriage door, and caught Elfrida by the gathers of her full traveling coat. He must have been amazingly strong, and so must those gathers. With one hand, he lifted her clear of the coach and placed her neatly and quite comfortably on the saddle before him.
        - id: ch01-b122
          speaker: gentleman
          text: >-
            Give me your valuables, please, or I shoot the horses. Keep your pistols down. If you aim at me, you hit the child. If you shoot my horse, she and I fall together.
        - id: ch01-b123
          speaker: narrator
          text: >-
            Even while he spoke behind the black mask, he turned his horse so that his own body shielded Elfrida from the serving men's pistols.
        - id: ch01-b124
          speaker: bet
          text: >-
            What do you want? We have nothing valuable. We're only country people going home to our farm.
          emotion: fearful
        - id: ch01-b125
          speaker: gentleman
          text: >-
            I want the pearl collar, the pomander, the little gold watch, and the family jewels in their new settings.
        - id: ch01-b126
          speaker: narrator
          text: "Then Elfrida knew who he was."
        - id: ch01-b127
          speaker: elfrida
          text: "Oh, you are mean!"
          emotion: angry
        - id: ch01-b128
          speaker: gentleman
          text: "Business is business. Now, my fair madam—"
        - id: ch01-b129
          speaker: narrator
          text: >-
            Yet his arm held Elfrida gently and kindly. The men hesitated, touching their pistols but not daring to raise them. Frightened by the sudden halt, the carriage horses danced and pranced all across the road. The maids shouted that the highwayman truly had the child. Better to lose a few jewels, they cried, than for every one of them to lose a life. Inside the dark coach, Bet sobbed and wailed.
        - id: ch01-b130
          speaker: narrator
          text: >-
            So the jewels were handed out. That was how it ended. They came slowly and grudgingly through the dusk, received by a hand that Bet later remembered as very white.
        - id: ch01-b131
          speaker: narrator
          text: >-
            Elfrida stayed perfectly still beneath the highwayman's arm. Suddenly, he bent and whispered in her ear.
        - id: ch01-b132
          speaker: gentleman
          text: "Are you afraid I might hurt you?"
        - id: ch01-b133
          speaker: elfrida
          text: "No."
        - id: ch01-b134
          speaker: narrator
          text: >-
            To this day, she does not know why she felt no fear.
        - id: ch01-b135
          speaker: gentleman
          text: "Then— Oh, you brave little lady!"
        - id: ch01-b136
          speaker: narrator
          text: >-
            Without warning, he spurred the horse, cleared the low hedge, and pulled up sharply on the other side.
        - id: ch01-b137
          speaker: gentleman
          text: >-
            Go home, my brave fellows, and say nothing about tonight's work. I shall reach Arden before you do!
        - id: ch01-b138
          speakers: [bet_maid, second_maid]
          ensemble: duo
          text: "He has the child! Oh, he has the child!"
          emotion: fearful
        - id: ch01-b139
          speaker: narrator
          text: "Even Bet broke off her now tremendous hysterics."
        - id: ch01-b140
          speaker: bet
          text: "He has the child!"
          emotion: fearful
        - id: ch01-b141
          speaker: gentleman
          text: "Shall I order your supper at Arden?"
        - id: ch01-b142
          speaker: narrator
          text: >-
            He called back mockingly and galloped across the fields with Elfrida. She was breathlessly frightened and knew she was being brave. She leaned back against his shoulder, held securely by an arm she trusted. They rode through a strange countryside as the night deepened around them. Beneath Elfrida's helplessly dangling legs, the great dark horse's shoulder muscles rose and rolled with every stride. It was a wonderful feeling to be carried that way on such a strong horse. Elfrida forgot all about Mouldiwarps and stopped trying to be a poet.
        - id: ch01-b143
          speaker: narrator
          text: >-
            Soon they reached the top of Arden Hill. Below, the castle lights gleamed and blinked.
        - id: ch01-b144
          speaker: gentleman
          text: >-
            Now, sweetheart, I shall put you down where I can see the door, and wait until someone opens it. Tell them everything that happened except what I tell you now. You will see me again. They won't know me, but you will. Say nothing until tomorrow, and I swear Miss Arden will get every jewel back. You shall have a gold locket for your true love's hair when you are seventeen and I am two hundred and thirty. Leave the parlor window open. When I tap, come to it. Do we have a bargain?
        - id: ch01-b145
          speaker: elfrida
          text: "Then you aren't truly a highwayman?"
        - id: ch01-b146
          speaker: gentleman
          text: >-
            What would you say if I told you I was James the Third, England's rightful king, come to claim what is mine?
        - id: ch01-b147
          speaker: elfrida
          text: "Oh! You really are James the Third?"
          emotion: surprised
        - id: ch01-b148
          speaker: narrator
          text: >-
            He set her down. Elfrida walked to the castle door and pounded on it with both fists.
        - id: ch01-b149
          speaker: narrator
          text: >-
            She told her story first to the castle servants, then all over again when Bet and the maids arrived. At last, the chorus of sorrow and amazement began to settle into a wish for something to eat. The servants went off to the kitchen to hurry supper along. Bet and Elfrida remained alone in the parlor, where Elfrida had obediently left the window slightly open.
        - id: ch01-b150
          speaker: narrator
          text: >-
            A laurel grew across that side of the house. The breeze stirred its leaves, and a branch tapped the window. Elfrida crossed to the window seat. No, it was only the laurel. Then a hand tapped. Rings flashed on its fingers, and a white square appeared at the window. It was a letter.
        - id: ch01-b151
          speaker: gentleman
          text: "For Miss Betty Arden."
        - id: ch01-b152
          speaker: narrator
          text: >-
            The voice was only a whisper. Elfrida carried the letter to her cousin and laid it on the flowered silk across Bet's lap.
        - id: ch01-b153
          speaker: bet
          text: "For me, child? Where did this come from?"
        - id: ch01-b154
          speaker: elfrida
          text: "Read it. A gentleman sent it."
        - id: ch01-b155
          speaker: bet
          text: >-
            Lud, what a day! First a highwayman and all the jewels gone, and now a love letter.
        - id: ch01-b156
          speaker: narrator
          text: >-
            Bet opened the letter and read it. Then she read it all over again. At last, her hand drifted helplessly toward Elfrida with the page still between her fingers. Elfrida, brisk and businesslike, took the letter and read the clear, beautiful writing for herself.
        - id: ch01-b157
          speaker: narrator
          text: >-
            The Chevalier St. George, secretly visiting his kingdom on urgent affairs of state, requested shelter and concealment beneath the roof of the loyal Ardens.
        - id: ch01-b158
          speaker: elfrida
          text: "Don't scream. Who is the Chevalier St. George?"
        - id: ch01-b159
          speaker: bet
          text: >-
            Our King. Our King across the water, King James the Third. Oh, why is my uncle away? They'll kill the King if they find him. What am I going to do?
          emotion: fearful
        - id: ch01-b160
          speaker: elfrida
          text: >-
            Do? Don't be silly. Doing something is exactly the point. This is a glorious chance! Think how everyone will praise your courage. Is he Bonnie Prince Charlie? Will he become King one day?
        - id: ch01-b161
          speaker: bet
          text: "Not Charles. James. My uncle wants James to be King."
        - id: ch01-b162
          speaker: elfrida
          text: >-
            Then let's help him. Perhaps he'll become King because of you.
        - id: ch01-b163
          speaker: narrator
          text: >-
            Elfrida's history lessons had never carried her past Edward the Fourth. Whenever new girls joined the class, everyone had to begin again at 1066. She knew Prince Charlie only from ballads and storybooks.
        - id: ch01-b164
          speaker: elfrida
          text: >-
            When he's King, he'll make you the dowager duchess of somewhere and give you his portrait surrounded by diamonds. Now, don't scream. He's waiting outside. I'll bring him in. Where can we hide him?
