audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 亲切从容，带一点温和的幽默
        timbre: 温暖清亮
        pace: 舒缓而有变化
        pitch: 中等
    edred:
      display_name: 埃德雷德
      tts:
        delivery: 聪明好胜，认真里带着孩子气
        timbre: 清脆明亮的男孩声
        pace: 自然偏快
        pitch: 中高
    elfrida:
      display_name: 埃尔弗丽达
      tts:
        delivery: 直率活泼，敏锐又有主意
        timbre: 清亮的女孩声
        pace: 轻快
        pitch: 高
    mouldiwarp:
      display_name: 白鼹鼠精
      tts:
        delivery: 古怪倦怠，乡音浓重又爱挖苦人
        timbre: 沙哑细小的老者声
        pace: 忽快忽慢
        pitch: 中高
    richard:
      display_name: 表兄理查德
      tts:
        delivery: 机敏爽朗，警觉时果断认真
        timbre: 明亮的少年声
        pace: 自然偏快
        pitch: 中高
    king:
      display_name: 国王
      tts:
        delivery: 豪爽威严，兴致高昂
        timbre: 洪亮厚实的成年男声
        pace: 从容有力
        pitch: 中低
    queen:
      display_name: 王后
      tts:
        delivery: 高贵坚定，温柔中带着骄傲
        timbre: 明澈沉静的成年女声
        pace: 从容
        pitch: 中等
    courtier:
      display_name: 长袍侍臣
      tts:
        delivery: 恭谨正式，措辞讲究
        timbre: 清瘦的成年男声
        pace: 稳健
        pitch: 中等
    betty_lovell:
      display_name: 贝蒂·洛弗尔
      tts:
        delivery: 神秘机敏，急切时干脆利落
        timbre: 苍老而有韧劲的女声
        pace: 自然偏快
        pitch: 中高
    noble_child:
      display_name: 贵族孩子
      tts:
        delivery: 欢快守礼，歌声清楚
        timbre: 明亮的童声
        pace: 轻快
        pitch: 高
  chapters:
    - id: ch01
      title: 第十三章　五月花与珍珠
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 国王骑着一匹高大的黑马，在绿树间缓缓走来。他穿着白绿两色的衣裳，像五月开花的树枝。身旁那位高贵夫人也穿着同样的颜色，骑着一匹白马。马尾长得几乎扫到地上，长鬃迎风飘着，像一面裂成条缕的旗。那位夫人生得很美，脸上含着骄傲的笑。她勇敢的眼睛一遇上国王的目光，连孩子们也立刻看懂了。至少在这一刻，他们彼此就是对方的整个世界。环形舞不停旋转，孩子们的视线恰好转向国王和王后前来的方向，于是望见了这一幕。
        - id: ch01-b02
          speaker: elfrida
          text: 真希望我没读过那么多历史。想到她的脑袋以后会……实在太可怕了。
          emotion: sad
        - id: ch01-b03
          speaker: narrator
          text: 理查德用力扯了一下她的手，截住了后面的话。
        - id: ch01-b04
          speaker: richard
          text: 别说了！我不能去想那些事。再说，我听人讲过，历史全是谎话。也许他们会永远这么幸福。想享受过去，就别去想它的未来。我是说，过去的未来。还有一件事，我待会儿得跟你们说。
        - id: ch01-b05
          speaker: narrator
          text: 他最后那句话说得相当严厉。舞圈这时散开，变成了一套复杂的花样。五月柱立在中央，孩子们抓住柱上垂下来的彩带，穿进穿出，彼此交接，让彩带一条叠着一条，交错着缠上柱身。这舞步实在复杂。脑子既猜不出下一步，也记不起前一步，两只脚却仿佛早就学会了，全都知道该往哪里去。这感觉真叫人痛快。
        - id: ch01-b06
          speaker: narrator
          text: 五月柱四周有两层舞圈。埃德雷德和埃尔弗丽达站在内圈，身边是衣饰华美的贵族孩子。村里的孩子围成外圈，衣服虽没那么华贵，却同样好看。高台上坐着乐师，台边装饰着五月花枝和摇摇摆摆的黄花九轮草花球。音乐领着所有人的脚步向前。国王和王后勒住马，高高兴兴地望着他们。
        - id: ch01-b07
          speaker: narrator
          text: 舞蹈忽然结束。孩子们迅速排成一列，向两位王室观众行礼。
        - id: ch01-b08
          speaker: king
          text: 跳得真漂亮，脚步也利落！来，我快活的小伙子们，先站着歇一歇，把气喘匀了，再为五月女王和我亲爱的夫人唱一支歌。
          emotion: happy
        - id: ch01-b09
          speaker: narrator
          text: 孩子们低声商议了一阵。理查德·阿登从那群绿衣贵族孩子当中走了出来。
        - id: ch01-b10
          speaker: richard
          text: 陛下，我们十分乐意。不过请让我们先唱一支赞颂国王陛下的歌。
        - id: ch01-b11
          speakers: [edred, elfrida, richard, noble_child]
          ensemble: chorus
          text: 打猎啦，打猎啦，天色就要亮。哈里国王出门去围猎，要把那雄鹿赶进罗网。
          emotion: happy
        - id: ch01-b12
          speaker: narrator
          text: 曲调雄壮又振奋。一直到事情过去以后，埃德雷德和埃尔弗丽达才觉得惊奇，原来当时的自己竟把它唱得那么熟。可就在歌声里，埃尔弗丽达仍反复想着那个老问题。他们在过去所做的事，到底能不能对过去产生影响？要说一点影响也没有，她怎么也不相信。要是能单独对白马上那位幸福而庄严的夫人说句话，要是能警告她，再设法帮她一把，那该多好。
        - id: ch01-b13
          speaker: narrator
          text: 光秃秃的断头台和黑色刑墩突然闯进她心里，清楚得吓人。她几乎看见它们阴沉沉地立在绿林深处。四周枝叶被风吹得摇摆，阳光透过树冠，碎成斑点落在地上。正在这时，有人扯了扯她的绿裙子。她回头看见一个老妇人，头上戴着紧紧的帽子，把所有头发都遮住了。老妇人一边催她快去，一边把她向前推。另一个人又将一大束野花塞进她手里，也从后面推了她一把。
        - id: ch01-b14
          speaker: betty_lovell
          text: 到她面前去！快去！
        - id: ch01-b15
          speaker: narrator
          text: 埃尔弗丽达只得独自捧着花，穿过那片空旷的草地。周围足有几百个人，他们全都穿着最体面的衣裳，也全都一声不响地看着她。几百双眼睛落在她一个人身上。她一直走到国王与王后所在的地方，才停下脚步，向两人各行了一个屈膝礼。她本来没想说话，可一开口，那些句子就自己从嘴里跑了出来。
        - id: ch01-b16
          speaker: elfrida
          text: 五月天，五月天，今天是欢乐的游玩天！林中处处百花鲜，老爷太太来游玩！老爷太太，贫穷富贵，都到野林敞开的门前！佃农乡民，王后国王，一起来把春天颂扬，加入我们欢乐的游宴。
          emotion: happy
        - id: ch01-b17
          speaker: narrator
          text: 诗念完了，她又规规矩矩地行了两个屈膝礼，把花献给王后。
        - id: ch01-b18
          speaker: courtier
          text: 要是臣下早知道两位陛下有意驾临，一定会另作安排，绝不会只用这样粗朴的仪式迎接陛下。
        - id: ch01-b19
          speaker: king
          text: 我们就是想让你们吃一惊。你说，阿登伯爵不在这里？
        - id: ch01-b20
          speaker: courtier
          text: 他的儿女正在这里，向陛下致敬。
        - id: ch01-b21
          speaker: narrator
          text: 埃尔弗丽达这才发现，埃德雷德已经来到她身边。国王伸下手，一把握住男孩的手，让他踩着自己的靴子，随即把他提到马鞍上，坐在自己身前。另一边，王后招手叫埃尔弗丽达过去，又从白马背上深深俯下身，问她的名字。她盼望的机会终于来了。要警告王后，就得趁现在。
        - id: ch01-b22
          speaker: king
          text: 过来，孩子。把脚踩在我的靴子上。对，就是这样！
        - id: ch01-b23
          speaker: elfrida
          text: 我叫埃尔弗丽达·阿登。陛下，我能告诉您一件事吗？
        - id: ch01-b24
          speaker: queen
          text: 说吧。
        - id: ch01-b25
          speaker: narrator
          text: 王后扬起秀丽的眉毛，脸上仍带着笑。
        - id: ch01-b26
          speaker: elfrida
          text: 我想再靠近一点，悄悄跟您说。
        - id: ch01-b27
          speaker: queen
          text: 你这个姑娘，胆子倒不小。
        - id: ch01-b28
          speaker: narrator
          text: 王后说归说，还是把身子压得更低了。
        - id: ch01-b29
          speaker: elfrida
          text: 我得警告您。请您不要因为我年纪小，就不理会我的话。我是真的知道。您也许以为我不懂，可我懂。我要警告您……
        - id: ch01-b30
          speaker: queen
          text: 今天早晨已经有人警告过我一次。五月节里，怎么到处都是这样不吉利的声音？
        - id: ch01-b31
          speaker: elfrida
          text: 是谁警告您的，陛下？
        - id: ch01-b32
          speaker: queen
          text: 一个老婆子。我的侍女们拦不住她，她径直闯进了寝室。她说自己有一道五月符咒，能让我留住容貌，也留住我夫君的爱。
        - id: ch01-b33
          speaker: elfrida
          text: 那是什么符咒？
        - id: ch01-b34
          speaker: narrator
          text: 她问得太急，又忘了称王后为陛下。
        - id: ch01-b35
          speaker: queen
          text: 很简单。只要我永远不让手帕掉在地上，容貌和爱情就都不会离开我。可要是手帕落了地，我失去的可不只是这两样。她说，从手帕掉下去的那一天起，再过若干日子，我连脑袋也会丢掉。就是你现在看着的这颗脑袋。
        - id: ch01-b36
          speaker: narrator
          text: 王后低低笑了一声，说到最后，又笑了起来。
        - id: ch01-b37
          speaker: elfrida
          text: 别笑，求您别笑！十九天，这才是警告里的日子。真希望它能救到您。我很喜欢您，亲爱的王后。您那么坚强，那么了不起。等我长大，也想成为您这样的人。
          emotion: fearful
        - id: ch01-b38
          speaker: narrator
          text: 王后美丽的脸上终于露出忧色。她伏得更低。埃尔弗丽达踮起脚尖，王后轻轻吻了她。
        - id: ch01-b39
          speaker: queen
          text: 愿上天保佑你，让你将来比我更好。
        - id: ch01-b40
          speaker: elfrida
          text: 请您一定当心。您这颗亲爱的脑袋！
          emotion: fearful
        - id: ch01-b41
          speaker: narrator
          text: 王后听完，又亲了她一下。就在这时，一阵很像风笛的乐声突然尖锐地冲了出来。众人纷纷朝后退开，给乡下姑娘和小伙子腾出一片空地，让他们跳起乡间舞。其他乐器也一个接一个跟着响了。国王一听，立刻邀请王后一起下场。两人从马背上下来，亲自领头踏起乡间舞步。他们一边跳，一边笑得那么快活，简直和任何一对乡下青年男女没有两样。
        - id: ch01-b42
          speaker: king
          text: 这支曲子真快活，听得脚都动起来了。来吧，亲爱的，我们也跟大家跳一曲！
          emotion: happy
        - id: ch01-b43
          speaker: narrator
          text: 埃尔弗丽达看着这一切，几乎想哭。今天大家看上去都这么善良，这么幸福。可惜人不能永远如此。国王下马时，抱着埃德雷德跳到地上。姐弟俩退回表兄理查德身旁。
        - id: ch01-b44
          speaker: edred
          text: 这里的一切真漂亮。我真想永远留下来。
          emotion: happy
        - id: ch01-b45
          speaker: richard
          text: 换成我，一小时也不肯留在这里。
        - id: ch01-b46
          speaker: edred
          text: 为什么？这里有危险？他们会砍我们的头吗？
        - id: ch01-b47
          speaker: richard
          text: 我没听说他们会那么做。我也不是在操心你们的脑袋。世上比你们的脑袋重要的东西多着呢。
        - id: ch01-b48
          speaker: elfrida
          text: 对别人也许是这样，对我们自己可没有重要那么多。你到底在生什么气？
        - id: ch01-b49
          speaker: richard
          text: 我还以为你们会明白……
        - id: ch01-b50
          speaker: narrator
          text: 理查德的话才起了头，刚才推埃尔弗丽达上前献花的老妇人便悄悄挨了过来。
        - id: ch01-b51
          speaker: betty_lovell
          text: 孩子们，快进树林。王后马上要哭了。谁的警告惹得他心爱的王后落泪，国王绝不会对那个人客气。
        - id: ch01-b52
          speaker: narrator
          text: 四个人一步步退进灌木，绿色叶片随即在他们身后合拢，把人影全遮住了。女巫催他们跟紧，领着众人在树林里急急穿行。他们从橡树和紫杉下走过，又挤过茂密的榛树与栗树丛，终于找到一条小路。接着她喊了一声跑，自己先飞快地领起路来。她年纪虽大，脚下可一点不慢。他们一路跑到林木渐渐稀疏的地方，然后冲出树林，登上开阔的丘陵。从那里望下去，阿登城堡、环绕城堡的护城河，还有远处的大海，全都清楚可见。
        - id: ch01-b53
          speaker: betty_lovell
          text: 快看清楚，记住护城河的水是从哪里冒出来的。贝蒂·洛弗尔预言法国人会登陆时，走私者洞穴就在那个地方。
        - id: ch01-b54
          speakers: [edred, elfrida]
          ensemble: duo
          text: 原来您又是那个女巫！您就是贝蒂·洛弗尔！
          emotion: surprised
        - id: ch01-b55
          speaker: betty_lovell
          text: 除了我还能是谁？快把白鼹鼠精叫来，赶回你们的时代。一个孩子惹哭了国王的心上人，国王会发动全郡来抓她。王后什么也不会瞒着他。她会把事情都告诉他，可是……也许……
        - id: ch01-b56
          speaker: elfrida
          text: 她不会把手帕的事也告诉国王吧？
        - id: ch01-b57
          speaker: betty_lovell
          text: 她会说。等到格林尼治的另一个五月节，她真的把手帕掉在地上，国王就会记起今天的话。快叫白鼹鼠精，赶紧离开。
        - id: ch01-b58
          speaker: edred
          text: 我们明明才来。还有，埃尔弗丽达刚才究竟做了什么？
        - id: ch01-b59
          speaker: elfrida
          text: 真烦人！我只想知道，理查德为什么说我们的脑袋不重要。
        - id: ch01-b60
          speaker: betty_lovell
          text: 再耽搁一会儿，你们的脑袋就要变得要紧极了！快说，是我叫白鼹鼠精，还是你们自己叫？
        - id: ch01-b61
          speaker: elfrida
          text: 您来叫吧。迪基，你刚才到底想说什么？求求你，告诉我们。
        - id: ch01-b62
          speaker: narrator
          text: 贝蒂正一块块掀开短草皮，再把下面的白垩土扒出来。她喊大家帮忙，说再不快些就赶不上了。于是三个人一齐动手。
        - id: ch01-b63
          speaker: elfrida
          text: 既然我们一定得走，迪克不能和我们一起去吗？
        - id: ch01-b64
          speaker: richard
          text: 不能。我不去，说不去就是不去！
        - id: ch01-b65
          speaker: narrator
          text: 埃尔弗丽达正扳着一大块白垩，听见这话，吃惊得直喘气。
        - id: ch01-b66
          speaker: elfrida
          text: 为什么？那你至少赶在白鼹鼠精来以前，把刚才的意思讲清楚。
        - id: ch01-b67
          speaker: mouldiwarp
          text: 已经来不及啦，因为俺这就到了。
        - id: ch01-b68
          speaker: narrator
          text: 大家坐回脚后跟上，看着白鼹鼠精从两块白垩之间挤出地面，钻进阳光。
        - id: ch01-b69
          speaker: elfrida
          text: 可我还没念诗呢。
          emotion: surprised
        - id: ch01-b70
          speaker: betty_lovell
          text: 我也没来得及画三角形和拱门。这事我可从没见过！
          emotion: surprised
        - id: ch01-b71
          speaker: mouldiwarp
          text: 俺一直就在这里。俺偶尔自己想去哪儿就去哪儿，难道不成？凭啥每次非得等你们来使唤俺，嗯？
        - id: ch01-b72
          speaker: narrator
          text: 它四下看了看，脸上竟带着几分得意的笑，只是语气还有点不高兴。
        - id: ch01-b73
          speaker: elfrida
          text: 当然可以。现在，亲爱的、最亲爱的白鼹鼠精，请快带我们走吧。
        - id: ch01-b74
          speaker: narrator
          text: 远处传来混乱的喊声，还夹着狗叫。声音越来越近，催得埃尔弗丽达不由得加快了语速。
        - id: ch01-b75
          speaker: betty_lovell
          text: 猎队已经出发了。
        - id: ch01-b76
          speaker: mouldiwarp
          text: 俺不赞成打猎，也不赞成狗。俺从来受不了那些狗。讨厌的东西，又吵闹，嘴里又全是牙！来，快进里边。
        - id: ch01-b77
          speaker: edred
          text: 进到哪里？
        - id: ch01-b78
          speaker: mouldiwarp
          text: 进俺家里。
        - id: ch01-b79
          speaker: narrator
          text: 谁也说不清，是他们一下子全都变小了，还是白垩上的那道裂缝突然变大了。总之，他们发现自己真的能走进去，于是大家排成一列，一个跟着一个，沿着裂缝向里走。埃尔弗丽达一把抓住理查德的手，紧紧攥着，怎么也不肯松开。他一路又扭又挣，想把手抽回去，还是没能挣脱。
        - id: ch01-b80
          speaker: richard
          text: 我不会回你们那个时代。我要走我自己的路。
        - id: ch01-b81
          speaker: elfrida
          text: 那你要去哪里？
        - id: ch01-b82
          speaker: richard
          text: 我愿意去哪儿，就去哪儿！
          emotion: angry
        - id: ch01-b83
          speaker: narrator
          text: 理查德狠狠夺回自己的手。可是太迟了，白垩已经在所有人身后合拢。裂缝封得严严实实，不留一点空隙，连半丝阳光也进不来。你可能以为，他们在这里呼吸到的空气一定又闷又浊，那可就猜错了。从五月的日光里走进白鼹鼠精的家，感觉就像从人类紧闭的屋子里走出来，一脚踏进五月清新的夜色。只是这个地方比世上任何一个黑夜都要黑。
        - id: ch01-b84
          speaker: narrator
          text: 埃尔弗丽达摸索着握住埃德雷德，又握住理查德。别人叮嘱她的事，她向来会努力记住。白鼹鼠精说过，只要附近有魔法，大家就一定得拉着手。理查德让她握着，却郑重地再次说明自己的打算。
        - id: ch01-b85
          speaker: richard
          text: 你们可听清楚了，我说到做到。我绝不会跟他们回去。
        - id: ch01-b86
          speaker: elfrida
          text: 詹姆斯一世那时候，你明明比现在可爱得多。
        - id: ch01-b87
          speaker: narrator
          text: 头顶猛地传来雷鸣般的声音，大地也随之震动。巨响几乎震聋了他们，大家浑身一颤，把彼此的手攥得更紧。
        - id: ch01-b88
          speaker: mouldiwarp
          text: 没啥大不了的，不过是国王的马和国王的人追上来了。俺去给你们造一只回家的白时钟。你们老实坐着，啥都别碰，一直等到俺回来。
          emotion: happy
        - id: ch01-b89
          speaker: narrator
          text: 白鼹鼠精离开了。他们坐在清新而深沉的黑暗里，埃尔弗丽达的问题却没有停。
        - id: ch01-b90
          speaker: elfrida
          text: 你为什么这么不愿意跟我们回去？
        - id: ch01-b91
          speaker: richard
          text: 我恨你们的时代。那里又丑恶，又残酷。
          emotion: angry
        - id: ch01-b92
          speaker: edred
          text: 可我们的时代至少不会无缘无故砍掉你的脑袋，也不会把你关进伦敦塔。
        - id: ch01-b93
          speaker: richard
          text: 他们做的事比那更坏。我亲眼知道。人们一天干十四个小时，每星期才拿九先令，永远吃不饱，也穿不暖，连睡觉和快活的时间都没有。没人肯给他们吃的穿的，也不让他们靠做工挣到这些东西。可他们为了活命，拿了一点需要的东西，就会被扔进监狱。
          emotion: angry
        - id: ch01-b94
          speaker: richard
          text: 他们为了制出某一种瓷器，眼看着工人染上可怕的病，直到下巴烂掉。女人不能留在家里照看婴儿，只能出去干活。小姑娘替她看孩子，一失手把婴儿摔下去，孩子就残废一辈子。啊，我全都知道。我不会跟你们回去。说不定你们会把我永远困在那里。
          emotion: fearful
        - id: ch01-b95
          speaker: narrator
          text: 说到最后，理查德打了个寒战。
        - id: ch01-b96
          speaker: edred
          text: 我不会把你困在那里。可人们怎样做工，钱够不够用，这些事我也管不了。
        - id: ch01-b97
          speaker: richard
          text: 如果我是阿登勋爵，我一定会发誓，而且一定守住誓言。只要那些坏事还没停止，我就一天也不休息，一件自己喜欢的事也不做。可在你们的时代，谁都不在乎。
          emotion: angry
        - id: ch01-b98
          speaker: elfrida
          text: 不是这样的。只要我们知道发生了什么，我们也会在乎。可是我们什么都做不了。
        - id: ch01-b99
          speaker: edred
          text: 我就是阿登勋爵。等我长大，我会照你说的去做。我想自己以后会进入上议院。我在那里开口，他们当然得听。我会记住你说的每一件事，再把这些事全告诉他们。
        - id: ch01-b100
          speaker: richard
          text: 你还没有长大，而且你父亲才是阿登勋爵。你不是。
        - id: ch01-b101
          speaker: elfrida
          text: 我们的父亲已经去世了。你知道的。
          emotion: sad
        - id: ch01-b102
          speaker: richard
          text: 你们怎么知道？
        - id: ch01-b103
          speaker: elfrida
          text: 我们收到过一封信……
          emotion: sad
        - id: ch01-b104
          speaker: richard
          text: 一封信，我才不会信！除非亲眼看见我爹爹死在那里，否则谁也别想让我相信。我要回到他死的那一天，亲眼弄明白他怎样死、死在哪里，再向杀死他的人报仇。
          emotion: angry
        - id: ch01-b105
          speaker: edred
          text: 可我们的父亲不是让人杀死的。
        - id: ch01-b106
          speaker: richard
          text: 你们凭什么知道？你们忙着寻找那讨厌的宝藏，却从没试过回到父亲还活着的时候。那不过是不久以前。你们为什么不去查清楚，他究竟遇到了什么？
        - id: ch01-b107
          speaker: elfrida
          text: 我不知道我们还能去那个时候。就算真能去，也不该那么做吧？伊迪丝姑妈说，父亲在天堂。那里不是我们能去的地方。这和历史不同，完全不一样。
          emotion: sad
        - id: ch01-b108
          speaker: richard
          text: 那好吧，只能由我来告诉你们。火药阴谋那次见面以后，我觉得你们两个小家伙还不错。你们走了，我便问贝蒂·洛弗尔你们是谁。她说，你们是阿登勋爵。所以下一次，我想从……从我待的那个地方离开时，就命令白时钟带我去见阿登勋爵。结果它把我带到……
        - id: ch01-b109
          speaker: mouldiwarp
          text: 快过来吧，亲爱的。时钟已经造好了。
        - id: ch01-b110
          speaker: narrator
          text: 一片柔光贴上他们的眼睛，越来越亮，也把四周越照越清楚。大家终于看见，自己正站在一座巨大的白垩洞穴里。埃德雷德几乎敢断定，这就是他们一直在找的走私者洞穴。洞底是一片平滑的沙地，正中央躺着一面巨大的钟盘，数字、分针、时针，全都齐备。钟盘用象牙制成，上面镶满柔柔发光的珍珠。光亮仿佛从珍珠和象牙之间流出来，照上雪白的白垩洞壁，又被墙壁反射回钟面。孩子们一生中从没见过这么美的珠宝工艺。我猜，世上任何人也没见过更美的东西。
        - id: ch01-b111
          speaker: mouldiwarp
          text: 坐到分针上，你们就能回家。
        - id: ch01-b112
          speaker: edred
          text: 我现在不能走。理查德还没有说完。
        - id: ch01-b113
          speaker: betty_lovell
          text: 那么国王和他的士兵会把你抓住。
        - id: ch01-b114
          speaker: edred
          text: 我必须冒这个险。理查德不把话说明白，我就不会靠近白时钟。
          emotion: calm
        - id: ch01-b115
          speaker: mouldiwarp
          text: 俺给他一分钟，绝不能再多。俺对这些事真是烦透啦。
          emotion: angry
        - id: ch01-b116
          speaker: elfrida
          text: 别生气呀。
        - id: ch01-b117
          speaker: mouldiwarp
          text: 俺没生气，皮毛底下一点气都没有。就是你们一会儿改这个，一会儿换那个，一会儿说愿意，一会儿又说不肯，才害得俺这么暴躁。
        - id: ch01-b118
          speaker: edred
          text: 理查德，再告诉我一次。你刚才说我父亲，到底是什么意思？
        - id: ch01-b119
          speaker: richard
          text: 我本来要找你，就命令白时钟带我去找阿登勋爵。可我见到的人不是你，是你的父亲。那就是你们生活的时代，一九〇八年七月。
        - id: ch01-b120
          speakers: [edred, elfrida]
          ensemble: duo
          text: 你说什么！
          emotion: surprised
        - id: ch01-b121
          speaker: richard
          text: 你们的父亲还活着！你们怎么还没听懂？你们只顾着为宝藏操心，根本没有去找他。
        - id: ch01-b122
          speaker: elfrida
          text: 爹爹还活着！不该把他卷进魔法和这些怪事里。你太残忍了，我恨你！我明明知道，自己永远也见不到爹爹了。
          emotion: sad
        - id: ch01-b123
          speaker: narrator
          text: 她紧紧抱住了弟弟。
        - id: ch01-b124
          speaker: richard
          text: 只要你们不是小胆小鬼，也不是小笨蛋，就一定能见到他。去把他找出来，这才是你们该做的。再会！
        - id: ch01-b125
          speaker: narrator
          text: 话一说完，不等白鼹鼠精或者老保姆动手阻拦，理查德已经纵身跳上珍珠和象牙做成的长分针，大声吩咐它带自己回家。那口气，就像一位公爵夫人吩咐自己的马车夫。当然，别的人吩咐马车夫或者听差时，也会用同样的口气。
        - id: ch01-b126
          speaker: narrator
          text: 谁也没来得及采取行动，钟针已经自己转了起来。起初还慢，接着越来越快，最后快得完全看不见了。只有象牙和珍珠做成的钟面数字，依然清清楚楚地留在洞穴的沙地上。
        - id: ch01-b127
          speaker: narrator
          text: 埃德雷德和埃尔弗丽达还抱在一起，用恳求的眼神望着白鼹鼠精。他们以为它准会大发脾气，没想到它竟像是在笑。你见过白鼹鼠微笑吗？大概没有。不过，你也许根本没见过白鼹鼠。没有看见笑的人，当然也看不见是谁在笑。柴郡猫却是例外。
        - id: ch01-b128
          speaker: betty_lovell
          text: 他是个大胆的男孩，也是个勇敢的男孩。
        - id: ch01-b129
          speaker: mouldiwarp
          text: 可不是嘛，他还真有点像阿登家的人。
        - id: ch01-b130
          speaker: narrator
          text: 埃德雷德这才放开姐姐，挺直了身子。他默默下定决心，一定要让白鼹鼠精亲眼看看，自己也有阿登家人的胆量，并不像它刚才匆匆认定的那样，配不上这个姓氏。
        - id: ch01-b131
          speaker: elfrida
          text: 我们回不了家了吗？您不能再造一只白时钟，或者想想别的办法？
          emotion: fearful
        - id: ch01-b132
          speaker: mouldiwarp
          text: 不糟蹋，才不缺。买新钟以前，总得先把旧钟用坏。等那孩子从指针上下来，时钟自然会停。到时你们再坐上去，就能安全回家。
        - id: ch01-b133
          speaker: elfrida
          text: 可要是国王先找到我们呢？
          emotion: fearful
        - id: ch01-b134
          speaker: betty_lovell
          text: 他找不到。鼹宝贝，打开白垩门。我去稳住国王，等年轻人平安回家。
        - id: ch01-b135
          speaker: mouldiwarp
          text: 他们会把你当女巫，扔进池塘。
        - id: ch01-b136
          speaker: narrator
          text: 贝蒂那样亲昵地称呼它，白鼹鼠精听了倒毫不介意。
        - id: ch01-b137
          speaker: betty_lovell
          text: 今天挺暖和。等他们把我拖到池塘，你们早就安全离开了。池水正好凉快。
        - id: ch01-b138
          speakers: [edred, elfrida]
          ensemble: duo
          text: 不行！您会淹死的！
          emotion: fearful
        - id: ch01-b139
          speaker: edred
          text: 我不能准许您这样做。
        - id: ch01-b140
          speaker: mouldiwarp
          text: 愿上天保佑你们这两颗傻乎乎的小心肝。她不会淹死，不过是从后门回家。每一座池塘底下都有一道门，只看你找不找得到。
        - id: ch01-b141
          speaker: narrator
          text: 于是，贝蒂·洛弗尔穿过白垩，独自出去迎接国王的怒火。她离开洞穴时，两边脸颊上各带着孩子们的一个吻。过了一会儿，那面珍珠象牙时钟忽然又完整地出现在沙地上。分针回来了，时针也回来了，连秒针都没有少。
        - id: ch01-b142
          speaker: narrator
          text: 埃德雷德和埃尔弗丽达坐上分针。白鼹鼠精刚张开狭长的嘴，还没来得及说出一个字，埃德雷德便坚定地喊出了新的命令。他已经从理查德那里学会，原来白时钟也能听人号令。
        - id: ch01-b143
          speaker: edred
          text: 带我们到爹爹所在的地方去！
        - id: ch01-b144
          speaker: narrator
          text: 珍珠象牙分针动了起来，越转越快，越转越快。到最后，即使有人留在旁边盯着，也再看不清它。可那里已经没有人看了。就在最后一刻，白鼹鼠精也跳上时针，正用四只爪子牢牢挂在那里。
