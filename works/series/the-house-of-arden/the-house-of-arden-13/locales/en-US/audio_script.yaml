  chapters:
    - id: ch01
      title: "CHAPTER XIII. MAY-BLOSSOM AND PEARLS"
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            The King rode slowly between the green trees on a great black horse. He wore white and green, like the May bushes. Beside him came a gracious lady on a white horse. Its long tail almost brushed the ground, and its mane streamed in the breeze like a ragged banner.
        - id: ch01-b02
          speaker: narrator
          text: >-
            The lady's proud, smiling face was beautiful. When her brave eyes met the King's, even the children could tell that, just then, those two were all the world to each other. Edred and Elfrida saw it only for a moment. The dance whirled them in a ring, and their faces happened to turn toward the path where the King and Queen were riding.
        - id: ch01-b03
          speaker: elfrida
          text: >-
            I wish I didn't know so much history. It's dreadful to know what will happen to her in the end.
          emotion: sad
        - id: ch01-b04
          speaker: narrator
          text: >-
            Elfrida was breathless from the quick dance. Richard gave her hand a sharp tug, and she stopped.
        - id: ch01-b05
          speaker: richard
          text: >-
            Don't. I mustn't think about it. Besides, I've heard that history is all lies. Perhaps they'll stay happy forever, just as they are now. You can't enjoy the past if you keep thinking about its future. And I have something else to tell you later.
        - id: ch01-b06
          speaker: narrator
          text: >-
            He said the last words rather sternly. Then the ring of dancers opened into a new and difficult figure. Colored ribbons hung from the Maypole at the center. The children took them, wove in and out, crossed them, and passed the streamers to other small, skillful hands. In and out they went through the complicated pattern. Their feet somehow knew every step, though their minds could never have worked out what came next or remembered what had come before.
        - id: ch01-b07
          speaker: narrator
          text: >-
            Two rings moved around the pole. Edred and Elfrida danced in the inner ring with noble children in very fine clothes. Village children made the outer ring. Their clothes were not so rich, but they were every bit as pretty. A whole band played from a raised platform decorated with May branches, and round balls of cowslips swung above the musicians. The King and Queen pulled up their horses and watched the dancing with great pleasure.
        - id: ch01-b08
          speaker: narrator
          text: >-
            Suddenly the dance was over. The children formed a line and saluted their royal visitors.
        - id: ch01-b09
          speaker: king_henry
          text: >-
            A fine dance, and finely stepped! Now catch your breath, my merry friends, and sing for our May Queen and my dear lady here.
          emotion: happy
        - id: ch01-b10
          speaker: narrator
          text: >-
            The children whispered together. Then Richard Arden stepped out from among the noble children in green.
        - id: ch01-b11
          speaker: richard
          text: >-
            Gladly, my liege. But first, we will sing in honor of the King's good Majesty.
        - id: ch01-b12
          speakers: [richard, edred, elfrida, village_child]
          ensemble: chorus
          text: >-
            The hunt is up, the hunt is up, and it is well-nigh day. And Harry our King is gone a-hunting, to bring his deer to bay.
        - id: ch01-b13
          speaker: narrator
          text: >-
            It was a stirring song. Only later did Edred and Elfrida wonder how they had known it so well.
        - id: ch01-b14
          speaker: narrator
          text: >-
            Even as she sang, Elfrida worried at the old question. Could anything they did change the past? It seemed impossible that their actions could have no effect at all. If only she could get the happy, stately lady on the white horse alone for one moment. Perhaps she could warn her. Perhaps she could help. Elfrida thought of the bare scaffold and the black block so strongly that they almost seemed to darken the moving, sun-dappled leaves of the greenwood.
        - id: ch01-b15
          speaker: narrator
          text: >-
            Someone tugged at her green skirt. It was an old woman in a close cap that hid every strand of hair.
        - id: ch01-b16
          speaker: nurse
          text: "Go to her. Go!"
        - id: ch01-b17
          speaker: narrator
          text: >-
            The old woman pushed her forward. Someone else put a large bunch of wildflowers into Elfrida's hand, and that person pushed her too. She had no choice but to go on. Quite alone, with the nosegay in her hand, she crossed the open stretch of green grass. Several hundred people stood there in their best clothes, and every one of them was watching her.
        - id: ch01-b18
          speaker: narrator
          text: >-
            When she reached the King and Queen, she stopped and curtsied to each of them. Then, without planning it at all, she began to speak.
        - id: ch01-b19
          speaker: elfrida
          text: >-
            May Day! May Day! This is the happy play day! All the woods with flowers are gay. Lords and ladies, come and play! Lords and ladies, rich and poor, come to the wild woods' open door! Hinds and yeomen, Queen and King, come do honor to the spring, and join us in our merrymaking!
        - id: ch01-b20
          speaker: narrator
          text: >-
            She made two more neat curtsies and offered the flowers to the Queen.
        - id: ch01-b21
          speaker: court_official
          text: >-
            If we had known of Your Majesties' visit, we would have prepared a finer welcome than this country ceremony.
        - id: ch01-b22
          speaker: narrator
          text: >-
            The speaker was a tall, thin-faced man in a long gown.
        - id: ch01-b23
          speaker: king_henry
          text: >-
            But we meant to surprise you. Is the Earl of Arden away?
        - id: ch01-b24
          speaker: court_official
          text: >-
            His son and daughter are here to pay their respects to Your Highness.
        - id: ch01-b25
          speaker: narrator
          text: >-
            Then Elfrida noticed Edred beside her.
        - id: ch01-b26
          speaker: king_henry
          text: >-
            Come here, lad. Put your foot on mine. There!
        - id: ch01-b27
          speaker: narrator
          text: >-
            The King caught Edred's hand and swung him up to sit before him in the saddle. The Queen beckoned Elfrida toward the white horse and leaned down to ask her name. This was the chance Elfrida had wanted. If she could ever warn the Queen, it must be now.
        - id: ch01-b28
          speaker: elfrida
          text: >-
            My name is Elfrida Arden. Your Majesty, may I tell you something?
        - id: ch01-b29
          speaker: queen_anne
          text: "You may."
        - id: ch01-b30
          speaker: narrator
          text: >-
            The Queen lifted her fine eyebrows, but she smiled.
        - id: ch01-b31
          speaker: elfrida
          text: >-
            I'd like to come very close and whisper it.
        - id: ch01-b32
          speaker: queen_anne
          text: >-
            You are a bold girl.
        - id: ch01-b33
          speaker: narrator
          text: >-
            Still, the Queen bent lower.
        - id: ch01-b34
          speaker: elfrida
          text: >-
            I want to warn you. Please don't ignore me because I'm only a little girl. I really do know what will happen, and you must let me warn you.
        - id: ch01-b35
          speaker: queen_anne
          text: >-
            Someone has warned me already this morning. Such gloomy voices for May Day!
        - id: ch01-b36
          speaker: elfrida
          text: "Who warned you, Your Majesty?"
        - id: ch01-b37
          speaker: queen_anne
          text: >-
            An old woman forced her way into my room past my maids. She said she had a May charm that would keep my beauty and my lord's love.
        - id: ch01-b38
          speaker: elfrida
          text: "What was the charm?"
        - id: ch01-b39
          speaker: narrator
          text: >-
            In her eagerness, Elfrida forgot to say “Your Majesty.”
        - id: ch01-b40
          speaker: queen_anne
          text: >-
            It was very simple. I would keep my beauty and my love as long as I never dropped a handkerchief. But if I dropped one, I would lose more than those. She said that, within a certain number of days, I would lose this very head you see before you.
        - id: ch01-b41
          speaker: narrator
          text: >-
            The Queen laughed softly, and then laughed again.
        - id: ch01-b42
          speaker: elfrida
          text: >-
            Oh, please don't! Nineteen days. That's the warning. I do hope it helps. I like you so much, dear Queen. You're so strong and splendid. I wish I could be like you when I grow up.
          emotion: sad
        - id: ch01-b43
          speaker: narrator
          text: >-
            Trouble came into the Queen's beautiful face.
        - id: ch01-b44
          speaker: queen_anne
          text: >-
            May Heaven grant that you will be better than I am.
          emotion: sad
        - id: ch01-b45
          speaker: narrator
          text: >-
            The Queen leaned farther from her saddle, and Elfrida rose on tiptoe to kiss her.
        - id: ch01-b46
          speaker: elfrida
          text: >-
            Oh, please be careful. Your dear head!
          emotion: sad
        - id: ch01-b47
          speaker: narrator
          text: >-
            The Queen kissed her once more. Then a shrill sound, rather like bagpipes, burst out without warning. Everyone drew aside and made room for the country girls and boys to step into their dance. One instrument after another joined the music until it filled the clearing.
        - id: ch01-b48
          speaker: king_henry
          text: >-
            That merry tune sets my feet moving! Come, sweetheart. Shall we dance with the rest?
          emotion: happy
        - id: ch01-b49
          speaker: narrator
          text: >-
            The King and Queen came down from their horses and led the country dance themselves. They laughed and danced as gaily as any country boy and girl. Elfrida could almost have cried as she watched them. It seemed terribly sad that everyone could not always be good and happy, just as every face in the greenwood looked good and happy that day.
        - id: ch01-b50
          speaker: narrator
          text: >-
            The King had jumped down with Edred in his arms. Now Edred and Elfrida drew back toward Cousin Richard.
        - id: ch01-b51
          speaker: edred
          text: >-
            It's all so pretty. I'd like to stay here forever.
          emotion: happy
        - id: ch01-b52
          speaker: richard
          text: >-
            If I were you, I wouldn't stay another hour.
        - id: ch01-b53
          speaker: narrator
          text: >-
            He sounded extremely disagreeable.
        - id: ch01-b54
          speaker: edred
          text: >-
            Why? Is there danger? Are they going to cut off our heads?
        - id: ch01-b55
          speaker: richard
          text: >-
            Not as far as I know. I wasn't thinking about your heads. There are more important things in the world than those.
        - id: ch01-b56
          speaker: elfrida
          text: >-
            Not many things are more important to us. Why are you being so cross?
        - id: ch01-b57
          speaker: richard
          text: "I should have thought you would understand."
        - id: ch01-b58
          speaker: narrator
          text: >-
            Before Richard could finish, the old woman who had sent Elfrida forward came sidling up to them.
        - id: ch01-b59
          speaker: nurse
          text: >-
            Into the woods, children. Quickly. The Queen will soon burst into tears, and the King won't be kind to anyone whose warnings made his Queen cry.
        - id: ch01-b60
          speaker: narrator
          text: >-
            The four of them backed into the bushes, and the green leaves closed behind them.
        - id: ch01-b61
          speaker: nurse
          text: "Quickly! This way."
        - id: ch01-b62
          speaker: narrator
          text: >-
            They followed her deep into the wood. They passed beneath oaks and yew trees, then pushed through tangles of hazel and chestnut until they found a path.
        - id: ch01-b63
          speaker: nurse
          text: "Run now!"
        - id: ch01-b64
          speaker: narrator
          text: >-
            The old woman led them at a wonderfully nimble pace for someone so ancient. They ran until the trees began to thin around them, then burst out of the wood and onto the open downs. From there they could see Arden Castle, the water of its moat, and the sea beyond.
        - id: ch01-b65
          speaker: nurse
          text: >-
            Look carefully at the place where the moat stream begins. That is where the smugglers' cave stood when Betty Lovell foretold the French landing.
        - id: ch01-b66
          speakers: [edred, elfrida]
          ensemble: duo
          text: >-
            Why, you're the witch again! You're Betty Lovell!
          emotion: surprised
        - id: ch01-b67
          speaker: nurse
          text: >-
            Who else would I be? Now call the Mouldiwarp and hurry back to your own time. The King will raise the whole countryside against the child who made his sweetheart cry. And she will tell him. She hides nothing from him, though something still makes me hesitate.
        - id: ch01-b68
          speaker: elfrida
          text: >-
            She won't tell him about the handkerchief, will she?
        - id: ch01-b69
          speaker: nurse
          text: >-
            She will. And when she drops it on that other May Day at Greenwich, he will remember. Come now. Call your Mouldiwarp and get away.
        - id: ch01-b70
          speaker: edred
          text: >-
            But we only just arrived. And what has Elfrida been doing?
        - id: ch01-b71
          speaker: elfrida
          text: >-
            Oh, bother that! I want to know what Richard meant when he said our heads weren't important.
        - id: ch01-b72
          speaker: nurse
          text: >-
            Your heads will be very important if you stay much longer. Shall I call the Mouldiwarp, or will you?
        - id: ch01-b73
          speaker: elfrida
          text: >-
            You call it. Dicky, what did you mean? Please tell us. There's a dear.
        - id: ch01-b74
          speaker: narrator
          text: >-
            Betty Lovell tore patches from the short grass and pulled out the chalk beneath it.
        - id: ch01-b75
          speaker: nurse
          text: >-
            Help me, or I won't finish in time!
        - id: ch01-b76
          speaker: narrator
          text: >-
            They all began to help.
        - id: ch01-b77
          speaker: elfrida
          text: >-
            If we really have to go, couldn't Dick come with us?
        - id: ch01-b78
          speaker: richard
          text: >-
            No. I'm not going, and that's that.
        - id: ch01-b79
          speaker: narrator
          text: >-
            Elfrida struggled with a large piece of chalk.
        - id: ch01-b80
          speaker: elfrida
          text: "Why not?"
        - id: ch01-b81
          speaker: richard
          text: "Because I won't."
        - id: ch01-b82
          speaker: elfrida
          text: >-
            Then tell us what you meant before the Mouldiwarp comes.
        - id: ch01-b83
          speaker: mouldiwarp
          text: >-
            You can't, because it's here already.
        - id: ch01-b84
          speaker: narrator
          text: >-
            Everyone sat back on their heels and stared at the opening in the ground. Between two blocks of chalk, the white Mouldiwarp squeezed itself up out of the earth and into the bright sunlight.
        - id: ch01-b85
          speaker: elfrida
          text: >-
            But I didn't say any poetry.
        - id: ch01-b86
          speaker: nurse
          text: >-
            And I didn't make the triangle and the arch. Well, I never!
        - id: ch01-b87
          speaker: mouldiwarp
          text: >-
            I've been here all along. Why shouldn't I go where I please now and then? Why must I always wait for you to call me, eh?
        - id: ch01-b88
          speaker: narrator
          text: >-
            The Mouldiwarp looked around with something very like a triumphant smile, though it sounded a little offended.
        - id: ch01-b89
          speaker: elfrida
          text: >-
            There's no reason at all. And now, dear, dear Mouldiwarp, please take us away.
        - id: ch01-b90
          speaker: narrator
          text: >-
            Shouts and barking dogs sounded in the distance, and made her speak faster.
        - id: ch01-b91
          speaker: nurse
          text: "The hunt is up."
        - id: ch01-b92
          speaker: mouldiwarp
          text: >-
            I don't approve of hunting, and I certainly don't approve of dogs. I never could stand those nasty, noisy creatures with all those teeth. Come inside, quickly.
          emotion: fearful
        - id: ch01-b93
          speaker: edred
          text: "Inside where?"
        - id: ch01-b94
          speaker: mouldiwarp
          text: "Inside my house."
        - id: ch01-b95
          speaker: narrator
          text: >-
            They never discovered whether they all grew smaller or the crack in the chalk grew larger. Somehow they found themselves walking into that narrow crack, one behind another. Elfrida caught Richard's hand before he could escape and held it tightly, though he wriggled and twisted and tried his hardest to pull free.
        - id: ch01-b96
          speaker: richard
          text: >-
            I'm not going back to your time with you. I'll choose my own way.
          emotion: angry
        - id: ch01-b97
          speaker: elfrida
          text: "Where will you go?"
        - id: ch01-b98
          speaker: richard
          text: "Wherever I please."
          emotion: angry
        - id: ch01-b99
          speaker: narrator
          text: >-
            Richard snatched his hand away, but it was too late. The chalk had closed over all of them.
        - id: ch01-b100
          speaker: narrator
          text: >-
            The chalk closed so completely that not one glimmer of daylight remained. You might expect the air inside to have been close and stale, but it was nothing of the sort. After the warm May sunshine, entering the Mouldiwarp's house felt like leaving an ordinary human house and stepping outdoors into the freshness of a May night. Yet it was darker there than any night that had ever been.
        - id: ch01-b101
          speaker: narrator
          text: >-
            Elfrida found Edred's hand, then Richard's. She always tried to remember what she had been told, and the Mouldiwarp had once warned them to hold hands whenever magic was near.
        - id: ch01-b102
          speaker: richard
          text: >-
            You do understand me, don't you? I mean it. I won't go back to their time with them.
        - id: ch01-b103
          speaker: elfrida
          text: >-
            You were much nicer when we met in King James the First's time.
        - id: ch01-b104
          speaker: narrator
          text: >-
            Then a noise like thunder rolled through the earth above their heads. It shook the ground and was so loud that it almost deafened them. The sound ran through all three children and made them clutch one another very tightly.
        - id: ch01-b105
          speaker: mouldiwarp
          text: >-
            That's only the King's horses and the King's men chasing you. I'll make a white clock to take you home. Sit where you are, and don't touch anything until I come back.
        - id: ch01-b106
          speaker: narrator
          text: >-
            The Mouldiwarp went away. In the fresh, deep darkness, Elfrida kept questioning Richard.
        - id: ch01-b107
          speaker: elfrida
          text: >-
            Why don't you want to come to our time?
        - id: ch01-b108
          speaker: richard
          text: >-
            I hate your time. It's ugly and cruel.
          emotion: angry
        - id: ch01-b109
          speaker: edred
          text: >-
            At least we don't cut off people's heads for nothing, or lock them in the Tower.
        - id: ch01-b110
          speaker: richard
          text: >-
            You do worse things. I know you do. People work fourteen hours a day for only nine shillings a week. They never have enough to eat or wear, and they have no time left to sleep properly or be happy. People won't give them food or clothes, and sometimes won't even allow them to work for those things. But if they take enough to keep themselves alive, they're put in prison.
          emotion: angry
        - id: ch01-b111
          speaker: richard
          text: >-
            People are allowed to catch terrible diseases that make their jaws fall away, all so someone can have one special kind of china. Mothers have to leave home and work instead of looking after their babies. A little girl is put in charge, and when she drops the baby, the poor child is crippled for life. Oh, I know what your time is like. I won't go back with you. You might keep me there forever.
          emotion: angry
        - id: ch01-b112
          speaker: narrator
          text: >-
            Richard shuddered.
        - id: ch01-b113
          speaker: edred
          text: >-
            I wouldn't keep you there. And I can't help the workers or their low pay.
        - id: ch01-b114
          speaker: richard
          text: >-
            If I were Lord Arden, I'd make a vow and keep it. I wouldn't take one holiday or do one thing I enjoyed until all that had been stopped. But no one in your time cares.
          emotion: angry
        - id: ch01-b115
          speaker: elfrida
          text: >-
            That isn't true. We care when we know. We just can't do anything.
        - id: ch01-b116
          speaker: edred
          text: >-
            I am Lord Arden. When I grow up, I'll do what you said. I think I'll be in the House of Lords, and surely they'll have to listen when I speak. I'll remember all of this and tell them.
        - id: ch01-b117
          speaker: richard
          text: >-
            You aren't grown up yet. And your father is Lord Arden, not you.
        - id: ch01-b118
          speaker: elfrida
          text: >-
            Father is dead, you know.
          emotion: sad
        - id: ch01-b119
          speaker: narrator
          text: >-
            Her voice fell to a hush.
        - id: ch01-b120
          speaker: richard
          text: "How do you know?"
        - id: ch01-b121
          speaker: elfrida
          text: "We learned it from a letter."
          emotion: sad
        - id: ch01-b122
          speaker: richard
          text: >-
            Do you think I'd trust a letter? If I had not seen my own father lying dead, I would never believe he was gone. I would go back myself. I would find out exactly where he died and what happened to him. And if some man had killed him, I would take vengeance on that man.
          emotion: angry
        - id: ch01-b123
          speaker: elfrida
          text: "But Father wasn't killed."
        - id: ch01-b124
          speaker: richard
          text: >-
            How can you know? You've been chasing that wretched treasure, but you've never tried to return to the very recent time when he was alive and learn what truly happened.
          emotion: angry
        - id: ch01-b125
          speaker: elfrida
          text: >-
            I didn't know we could. And even if we can, would it be right? Aunt Edith said he was in heaven. We can't go there. This isn't like history. It's different.
          emotion: sad
        - id: ch01-b126
          speaker: richard
          text: >-
            Then I'll have to explain. I became rather fond of you two during the Gunpowder Plot. After you went back to your time, I asked Betty Lovell who you were. She said you were Lord Arden. So the next time I wanted to escape from where I was, I ordered the magic to take me to Lord Arden. That journey took me somewhere unexpected.
        - id: ch01-b127
          speaker: mouldiwarp
          text: >-
            Come along, dear. The clock is ready.
        - id: ch01-b128
          speaker: narrator
          text: >-
            A soft light pressed against their eyes and grew brighter and brighter. At last they saw that they were standing in a huge chalk cavern. Edred felt almost sure it was the smugglers' cave. The floor beneath them was smooth sand. In its center lay a great clock face, complete with numbers and hands, all made from softly shining pearls set in ivory. Light seemed to pour from the clock and shine back from every white chalk wall. It was the most beautiful piece of jewelry the children had ever seen. I imagine it may have been the most beautiful anyone had ever seen.
        - id: ch01-b129
          speaker: mouldiwarp
          text: >-
            Sit on the minute hand, and home you go.
        - id: ch01-b130
          speaker: edred
          text: >-
            I won't go until Richard finishes what he was saying.
        - id: ch01-b131
          speaker: narrator
          text: >-
            Edred spoke grimly.
        - id: ch01-b132
          speaker: nurse
          text: >-
            Then the King and his soldiers will catch you.
        - id: ch01-b133
          speaker: edred
          text: >-
            I'll take that risk. I won't go near the white clock until Richard tells me what he means.
          emotion: calm
        - id: ch01-b134
          speaker: narrator
          text: >-
            His voice was completely quiet.
        - id: ch01-b135
          speaker: mouldiwarp
          text: >-
            He gets one minute, and no more. I'm sick to death of all this.
          emotion: angry
        - id: ch01-b136
          speaker: elfrida
          text: "Oh, don't be cross."
        - id: ch01-b137
          speaker: mouldiwarp
          text: >-
            I bain't cross underneath my fur. All this chopping and changing, this “I will” and “I won't,” makes me so worritable.
        - id: ch01-b138
          speaker: edred
          text: >-
            Tell me what you meant about my father.
        - id: ch01-b139
          speaker: richard
          text: >-
            I tried to find you. I asked to be taken to Lord Arden. But I didn't find you. I found your father, in your own time, in July of 1908.
        - id: ch01-b140
          speakers: [edred, elfrida]
          ensemble: duo
          text: "What?"
          emotion: surprised
        - id: ch01-b141
          speaker: richard
          text: >-
            Your father is alive. Don't you understand? All this time you've worried about finding the treasure instead of finding him.
        - id: ch01-b142
          speaker: elfrida
          text: >-
            Daddy is alive! Oh, it isn't right to mix him up with magic. You're cruel. I hate you! I know I'll never see my daddy again.
          emotion: sad
        - id: ch01-b143
          speaker: narrator
          text: >-
            Elfrida clung to Edred.
        - id: ch01-b144
          speaker: richard
          text: >-
            You will see him if you stop being cowards and duffers. Go and find him. That's what you must do. Goodbye!
        - id: ch01-b145
          speaker: narrator
          text: >-
            Before the Mouldiwarp or the nurse could stop him, Richard jumped onto the long pearl-and-ivory minute hand.
        - id: ch01-b146
          speaker: richard
          text: "Home!"
        - id: ch01-b147
          speaker: narrator
          text: >-
            He ordered the clock in just the way duchesses, and other people, order their coachmen or footmen about. Before anyone could interfere, the clock hands began to turn. At first they moved slowly. Then they went faster and faster, until at last they spun too quickly to be seen. Only the ivory and pearl numbers of the clock face remained visible on the cave's sandy floor.
        - id: ch01-b148
          speaker: narrator
          text: >-
            Still holding each other, Edred and Elfrida looked pleadingly at the Mouldiwarp. They expected great anger, but it seemed to be smiling. Perhaps you have never seen a white mole smile. Then again, perhaps you have never seen a white mole. You cannot see a smile without seeing its owner, except when the owner happens to be a Cheshire cat.
        - id: ch01-b149
          speaker: nurse
          text: >-
            He is a bold boy and a brave one.
        - id: ch01-b150
          speaker: mouldiwarp
          text: >-
            Ah, he be something like an Arden, he be.
          emotion: happy
        - id: ch01-b151
          speaker: narrator
          text: >-
            Edred let go of Elfrida and stood straighter. He meant to prove that the Mouldiwarp had been too quick to think he was not much like an Arden himself.
        - id: ch01-b152
          speaker: elfrida
          text: >-
            Can't we get home? Couldn't you make another white clock for us?
        - id: ch01-b153
          speaker: mouldiwarp
          text: >-
            Waste not, want not. Wear out your old clocks before you buy new ones. Once he steps off the hand, this clock will stop. Then you can get on and travel safely home.
        - id: ch01-b154
          speaker: elfrida
          text: >-
            But what if the King finds us?
        - id: ch01-b155
          speaker: nurse
          text: >-
            He won't. Open the chalk door, Mouldy, my dear. I'll keep the King busy until the young people are safely away.
        - id: ch01-b156
          speaker: mouldiwarp
          text: >-
            They'll duck you as a witch.
        - id: ch01-b157
          speaker: narrator
          text: >-
            The Mouldiwarp did not seem to mind Betty's familiar name for it.
        - id: ch01-b158
          speaker: nurse
          text: >-
            It's a warm day. You'll be safely gone by the time they reach the pond, and the water will be pleasantly cool.
        - id: ch01-b159
          speakers: [edred, elfrida]
          ensemble: duo
          text: >-
            Oh, no! You'll drown!
          emotion: fearful
        - id: ch01-b160
          speaker: edred
          text: >-
            I can't allow that.
        - id: ch01-b161
          speaker: mouldiwarp
          text: >-
            Bless your silly little hearts. She won't drown. She'll only go home by the back door. Every pond has a door at the bottom, if you know how to find it.
        - id: ch01-b162
          speaker: narrator
          text: >-
            Edred and Elfrida each kissed one of Betty Lovell's cheeks. Carrying those two kisses with her, she went out through the chalk to meet the anger of the King.
        - id: ch01-b163
          speaker: narrator
          text: >-
            Suddenly the whole pearl-and-ivory clock appeared again, complete with its hour, minute, and second hands. Edred and Elfrida sat on the minute hand. Before the Mouldiwarp could open its long, narrow mouth, Edred spoke in a firm voice. Richard had taught him that white clocks could be given orders.
        - id: ch01-b164
          speaker: edred
          text: >-
            Take us to where Daddy is.
        - id: ch01-b165
          speaker: narrator
          text: >-
            The pearl-and-ivory minute hand began to move, faster and faster and faster, until no watcher could have seen it.
        - id: ch01-b166
          speaker: narrator
          text: >-
            But no one was left to watch. At the last moment, the Mouldiwarp had jumped onto the hour hand and was hanging there by every one of its claws.
