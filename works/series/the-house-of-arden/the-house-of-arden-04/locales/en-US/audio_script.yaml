  chapters:
    - id: ch01
      title: "CHAPTER IV. THE LANDING OF THE FRENCH"
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            Then came dinner. Edred and Elfrida had to sit very straight and eat very slowly. Their glasses held beer instead of water. Whenever they asked for water, Lady Arden wanted to know how often she must tell them it was unhealthy. Lord Arden said little. At the start of the meal, he had told his wife about the wise woman, the French landing, and the three signs.
        - id: ch01-b02
          speaker: lady_arden
          text: "Mercy on us, my lord. You don't mean it?"
          emotion: surprised
        - id: ch01-b03
          speaker: narrator
          text: >-
            Then she calmly went on cutting her meat. After the cloth was taken away, wine decanters appeared beside dishes of dried plums and preserved pears. Lord Arden struck the table with his fist.
        - id: ch01-b04
          speaker: lord_arden
          text: >-
            Only three glasses for me today, my lady. You know I am not superstitious, but facts are facts. Where is that white Mouldiwarp now?
        - id: ch01-b05
          speaker: narrator
          text: >-
            Elfrida timidly explained that she had put it in the bottom drawer of the tall chest in her room. The cook had shown her which room was hers.
        - id: ch01-b06
          speaker: lady_arden
          text: >-
            I believe it was sent as a direct warning. Perhaps it came in return for the tea and sugar.
        - id: ch01-b07
          speaker: narrator
          text: >-
            Lady Arden had a charming habit of discovering her husband's opinion and making it her own.
        - id: ch01-b08
          speaker: lord_arden
          text: >-
            Ah! Warning or no warning, every man in the village will be armed and paraded today. I will not have the French stroll ashore without so much as asking leave, and then hear someone say, "Well, Arden, you were warned, but you thought you knew best."
        - id: ch01-b09
          speaker: lady_arden
          text: "No. That really would be unpleasant."
        - id: ch01-b10
          speaker: narrator
          text: >-
            A man on a steaming horse arrived just then and made Lord Arden even more determined.
        - id: ch01-b11
          speaker: messenger
          text: "The French are coming!"
          emotion: fearful
        - id: ch01-b12
          speaker: narrator
          text: >-
            The messenger was quite out of breath, but he could not explain how he knew.
        - id: ch01-b13
          speaker: messenger
          text: >-
            Everyone says so, my lord. They sent me to tell you. What are we supposed to do?
          emotion: fearful
        - id: ch01-b14
          speaker: narrator
          text: >-
            We live so safely now that it is hard to understand the terror of those days. Wars happen far from our own country. Police deal with burglars, and lightning rods even take care of thunder. But then every man, woman, and child lived in fear that the French would come, led by Boney. To us, Boney is Napoleon Buonaparte, a small figure in a cocked hat from a history book. To people in England while he lived, he was a terror in the night. Children feared bedtime because of him. Strong men slept in their boots, with a sword and pistol close enough for a waking hand to reach.
        - id: ch01-b15
          speaker: narrator
          text: >-
            Edred and Elfrida began to understand a little of that fear. The wise woman's prophecy had started it. Then rumors scurried through every village house like rats, making the warning seem more certain and driving everyone into wild activity. Lord Arden was busy giving orders. Lady Arden was just as busy talking every order over with the maids. No one had time to watch the children. They were free to use their eyes and ears, so they went down into the village to see what was happening.
        - id: ch01-b16
          speaker: narrator
          text: >-
            Men sharpened old swords at the grindstone. Men without swords honed billhooks, hatchets, scythes, and kitchen choppers. Others boarded their windows or dug holes in their gardens to bury money and teaspoons. Nobody knew where the rumor had begun. By now, everybody believed it.
        - id: ch01-b17
          speaker: narrator
          text: >-
            The children wandered freely through the cottages. Everyone seemed to recognize them and was vaguely glad to see them, but nobody had time to talk. Soon Edred and Elfrida stopped worrying that someone might discover they were not the children people thought they were. Women brushed and mended old scarlet coats and tight white trousers. Along the hollow of the cliff, men with spyglasses watched the sea. Other men struggled uphill beneath bundles of brown brushwood and dried furze. They stacked it all into tall beacons, ready for the moment when the French invasion became certain.
        - id: ch01-b18
          speaker: narrator
          text: >-
            Elfrida wished she had learned the later chapters in her history book. Had Boney landed in England on June seventeenth, 1807? She could not remember. The book said something about a French invasion, but not what had been invaded or when. She and Edred knew no more about what would happen than anyone else.
        - id: ch01-b19
          speaker: narrator
          text: >-
            Before dinner, the Mouldiwarp had promised to come when Elfrida called.
        - id: ch01-b20
          speaker: mouldiwarp
          text: "As long as you use poetry, of course."
        - id: ch01-b21
          speaker: narrator
          text: >-
            It had curled into the corner of the drawer, and that promise comforted her when she later found the drawer empty. So only half her mind followed the excitement around her. The other half was trying to make up some poetry, in case trouble came and found her powerless because she had no verse ready.
        - id: ch01-b22
          speaker: narrator
          text: >-
            For once, Edred noticed more than she did. The men had built one bonfire far from the convenient place Lord Arden had chosen. Edred wondered why. When a man passed the very spot Lord Arden had pointed out, Edred asked him. The man surprised him by jabbing a hard finger into his ribs.
        - id: ch01-b23
          speaker: villager
          text: >-
            Ah, you little rascal! Still, you're a young gentleman, and the little lady is one too, bless her. You found out plenty before, but you never betrayed us to the Preventive officers.
        - id: ch01-b24
          speaker: elfrida
          text: "Of course. We would never betray anyone."
        - id: ch01-b25
          speaker: villager
          text: "Would you like to come down with me now?"
        - id: ch01-b26
          speaker: narrator
          text: >-
            He was a sturdy, brown-faced man who looked like a sailor. A short pigtail stuck from the back of his head like the china handle on a Japanese teapot.
        - id: ch01-b27
          speaker: elfrida
          text: "Oh, yes!"
          emotion: happy
        - id: ch01-b28
          speaker: narrator
          text: >-
            Edred did not say no.
        - id: ch01-b29
          speaker: villager
          text: >-
            Wait until you can't see me. Then follow the way I go. Wander about as if you're chasing butterflies, first this way and then that. Understand?
        - id: ch01-b30
          speaker: narrator
          text: >-
            They obeyed, drifting a little one way and then another until the man was out of sight. Very few children in our duller times have ever entered a smuggler's cave. For Edred and Elfrida, it was a completely new adventure, just as it would be for you or me. When they caught up with the brown-faced man, he was crouching in the middle of a patch of furze.
        - id: ch01-b31
          speaker: villager
          text: "Jump over the outside bushes."
        - id: ch01-b32
          speaker: narrator
          text: >-
            They jumped and twisted between the furze bushes along narrow rabbit tracks until they reached him. He lifted a great mound of furze and bramble. It looked as though it had grown and died on that exact spot. Underneath was a hole, with steps leading down.
        - id: ch01-b33
          speaker: narrator
          text: >-
            Darkness waited below. Elfrida went first without hesitation, as she had been told. If Edred paused, it was only for a moment. The children descended about six steps. The man followed, pulled the furze back into place, and lit a lantern. Its tallow candle smelled dreadful. But what does even hot tallow and hot iron matter when you are exploring a smuggler's cave? It was everything they had imagined, and more.
        - id: ch01-b34
          speaker: narrator
          text: >-
            They went slowly downward. The yellow lantern flame cast golden light and black shadows over smooth white chalk walls. Beyond more steps stood a heavy, roughly made door. A huge lock held it shut, and the key looked as large as a church key. The door creaked open onto a vast cave. Its roof was lost in darkness. Water fell from an opening high in the chalk, slipped into a smooth channel through the cave, then ran down a steep slope like a tiny railway cutting and vanished beneath a low arch.
        - id: ch01-b35
          speaker: edred
          text: "If anyone had to defend this place, there would always be water."
        - id: ch01-b36
          speaker: narrator
          text: >-
            On both sides of the great cave, barrels and bales stood in heaps on the sanded floor. A table and benches had been cut from solid chalk. At one end, a ragged opening was partly blocked by a great mass of fallen cliff. Through the gap, they could see the mysterious sea in the twilight, with stars beginning to appear above it.
        - id: ch01-b37
          speaker: narrator
          text: >-
            Then the wind struck them. It leaned against them like a wrestler trying to throw them down, whistled in their ears, and drove them breathless into the main cave.
        - id: ch01-b38
          speaker: villager
          text: "We'll have half a gale tonight."
        - id: ch01-b39
          speaker: narrator
          text: >-
            He was plainly a smuggler.
        - id: ch01-b40
          speaker: edred
          text: "Do you think the French will really land in Lymchurch Bay tomorrow?"
        - id: ch01-b41
          speaker: narrator
          text: >-
            In the lantern light, the smuggler gave them a solemn wink.
        - id: ch01-b42
          speaker: villager
          text: >-
            I know you two can keep a secret. The French aren't landing. We are. We'll come ashore here, not in the bay, and we'll bring some of the real drink, with a few yards of silk or lace perhaps. I don't know who spread the tale about the French coming, but you can be sure they are no friends of the Revenue officers.
        - id: ch01-b43
          speaker: elfrida
          text: "Oh, I understand. And did—"
        - id: ch01-b44
          speaker: villager
          text: >-
            The extra watchers will be the worst trouble. Luckily, all the men who volunteered for that duty are our men, and we know who our friends are.
        - id: ch01-b45
          speaker: edred
          text: "But how can you be friends with Frenchmen while our countries are at war?"
        - id: ch01-b46
          speaker: narrator
          text: >-
            The smuggler sat on the end of a keg that stood ready to serve as a seat.
        - id: ch01-b47
          speaker: villager
          text: >-
            Listen, young sir. We have no quarrel with free traders, whether they live here or over there. A man has to earn his bread, doesn't he? His trade comes first. The fellows who meet us halfway across the Channel and pass us the goods are traders before they are Frenchmen, just as we're merchants before anything else. We aren't fighting them. We're at war with French soldiers, not honest French traders who are in the very same boat as we are.
        - id: ch01-b48
          speaker: edred
          text: >-
            Then someone invented the story about Boney so everyone would watch the bay while you brought your goods in here?
        - id: ch01-b49
          speaker: villager
          text: >-
            I wouldn't say quite that, sir. But if events happened to fall that way, it would be a special blessing for free traders who earn their living by honest work and honest danger. That's all I'll say. From what happened before, I know you two can guard a secret as safely as any old sailor afloat.
        - id: ch01-b50
          speaker: narrator
          text: >-
            The children would have given a great deal to learn what had happened before and why the smuggler trusted them so completely. But they never found out. Even now, they sometimes wonder what the Edred and Elfrida of those old days had done to earn the confidence of this bold, swaggering man. They both believe, and I expect they are right, that it must have been something rather fine.
        - id: ch01-b51
          speaker: narrator
          text: >-
            The children had followed all the cave's twists and turns and had now seen every passage and corner. They were glad to return to Arden Castle. Darkness had fallen, their proper bedtime was long past, and the day had been tiring.
        - id: ch01-b52
          speaker: narrator
          text: >-
            Lady Arden's own maid put them to bed rather sternly. They had never met her before and had no wish to meet her again, because she was so shriveled, dry, and harsh. Once she had gone, they slept as happily as spinning tops. The rough homespun sheets smelled of lavender grown in the castle garden. Those sheets covered soft, plump beds, as round as pincushions, stuffed with feathers from geese that had been eaten at the castle table.
        - id: ch01-b53
          speaker: narrator
          text: >-
            Elfrida woke only once. Red light filled the room. Through the window, she saw that one beacon fire was burning. Flames and smoke streamed across the dark summer sky. The wind yelled, shook the windows, and by now seemed at least three quarters of a gale. The beacon was alight, so the French were coming. Elfrida yawned and went back to bed. She was too sleepy to believe in Boney.
        - id: ch01-b54
          speaker: narrator
          text: >-
            Yet at that time, a hundred years ago, hundreds of children trembled and cried in their beds. They were sure every dreadful warning from their mothers and nurses was finally coming true. Boney was no small figure in a book to them. He was a mysterious, unknown horror, and now they believed he had really come at last to get them.
        - id: ch01-b55
          speaker: narrator
          text: >-
            Morning was gray when the wind lost patience with the leaded window. It tore the window from its hinges, flung it across the frame, and rushed into the room. The bedclothes flapped like wet sails. Edred and Elfrida were now far too awake to hope for one more doze.
        - id: ch01-b56
          speaker: narrator
          text: >-
            They got up, dressed, and went through the silent house. Nobody was about, though the front door stood open. On that sheltered side of the castle, the air was quite still. The moment they stepped beyond the castle wall, the wind caught them. It struck, slapped, shoved, worried, and battered them. They could hardly stand upright, and making any progress toward the cliff was slow and difficult.
        - id: ch01-b57
          speaker: narrator
          text: >-
            Somehow they reached the cliff. In the gray dawn, a thick, dark crowd stood there. Up close, it was not dark at all. It shone red, white, and blue like the Union Jack. These were the armed men in their makeshift uniforms, drilled and paraded by old Lord Arden the evening before. Every face turned toward the sea.
        - id: ch01-b58
          speaker: narrator
          text: >-
            The sea looked like the inside of an oyster shell, crossed from end to end by ridges of cold silver. Above it, the sky was gray as a gull's wing. Between the sea and sky, a ship was being driven straight toward the rocks that waited a hundred feet below the watching crowd.
        - id: ch01-b59
          speaker: cliff_watcher_one
          text: "By the look of her rigging, she's French."
        - id: ch01-b60
          speaker: cliff_watcher_two
          text: >-
            She's the first scout of the fleet. Heaven has sent this storm to destroy them, just as it destroyed the cursed Armada in Queen Elizabeth's day.
        - id: ch01-b61
          speaker: narrator
          text: >-
            Still the ship came closer.
        - id: ch01-b62
          speaker: villager
          text: >-
            It's the Bonne Esperance. Old Betty spoke true. The French will come ashore today, but only as dead bodies. And our little cargo! They missed our boat in the gale. Now every bit of it will smash before our eyes. It's a sorry business being an honest merchant.
          emotion: sad
        - id: ch01-b63
          speaker: narrator
          text: >-
            The men huddled closer in their strange uniforms, gripping their strange weapons. They had gathered to fight an invasion, but now they could only watch. Nobody looked away as the helpless ship drove on and on toward the rocks.
        - id: ch01-b64
          speaker: elfrida
          text: "Is there any chance it won't be wrecked?"
          emotion: fearful
        - id: ch01-b65
          speaker: narrator
          text: >-
            She whispered the question and clutched old Lord Arden's hand.
        - id: ch01-b66
          speaker: lord_arden
          text: "There is no hope, my child. Go home to bed."
          emotion: sad
        - id: ch01-b67
          speaker: narrator
          text: >-
            It made no difference that this had all happened a hundred years before. Far beneath the cliff, the cold, furious sea lashed the rocks. Elfrida could not stay and watch the ship break apart as her carved workbox had broken when she dropped it on the kitchen bricks. She could not even bear the thought of seeing it. Making poetry was difficult, but watching a ship full of men go down was harder.
        - id: ch01-b68
          speaker: elfrida
          text: >-
            Oh, Mouldiwarp, please come to me. I cannot bear this, don't you see?
          emotion: fearful
        - id: ch01-b69
          speaker: narrator
          text: >-
            It might not have been fine poetry, but it said exactly what she felt, and it did its work. The white mole brushed against her ankles as she spoke. She picked it up.
        - id: ch01-b70
          speaker: elfrida
          text: "Oh, what can we do?"
          emotion: fearful
        - id: ch01-b71
          speaker: mouldiwarp
          text: "Go back to the castle. You'll find the door now."
        - id: ch01-b72
          speaker: narrator
          text: >-
            They turned away from the sea. As they did, a grinding crunch came from behind them. It mixed with the roar of wind and waves and rose enormously louder. It sounded like a dog eating the bones from your dinner and crushing all the chicken ribs in its mouth at once. The crowd that had waited there all night for the French to land gave a long, sighing moan. Then Lord Arden's voice rose above it.
        - id: ch01-b73
          speaker: lord_arden
          text: >-
            The French have landed. She told the truth. The French have landed. Heaven help them!
          emotion: fearful
        - id: ch01-b74
          speaker: narrator
          text: >-
            As the children ran toward the castle, they knew what would happen next. Every man in that crowd would be ready to risk his own life to rescue the Frenchmen from the sea. Yet those same men had stayed awake all night, waiting for the French to land so they could kill them with swords, scythes, billhooks, and meat choppers. Human beings are strange creatures.
        - id: ch01-b75
          speaker: narrator
          text: >-
            Elfrida wanted only to escape and return to a safe, quiet life without shipwrecks or witches. She held the mole in one hand and pulled Edred with the other. They raced through the open castle door, up the stairs, and straight to another door. Elfrida knew it would be the right one. It was.
        - id: ch01-b76
          speaker: narrator
          text: >-
            Beyond it lay the large attic, crossed with beams, with its long and marvelous row of chests beneath the sloping roof. The door closed. At once, the raging wind stopped, as suddenly as the hiss of gas when you turn it off. Golden light once again slipped between the roof tiles. Outside came the tick-tick of pigeons walking, the rustle of their feathers, and the soft cooing of their voices.
        - id: ch01-b77
          speaker: narrator
          text: >-
            Their own clothes lay on the floor.
        - id: ch01-b78
          speaker: mouldiwarp
          text: "Change your clothes."
        - id: ch01-b79
          speaker: narrator
          text: >-
            The mole was a little breathless after Elfrida had gripped it so tightly and carried it so fast. The children began dressing. The pigeon sounds seemed to come nearer and nearer, somehow helping them out of the scratchy clothes of 1807 and into the comfortable sailor suits of 1907.
        - id: ch01-b80
          speaker: mouldiwarp
          text: "Did you find the treasure?"
        - id: ch01-b81
          speakers: [edred, elfrida]
          ensemble: duo
          text: "Why, no. We never even thought about it."
        - id: ch01-b82
          speaker: mouldiwarp
          text: "It doesn't matter. The treasure wasn't there."
        - id: ch01-b83
          speaker: elfrida
          text: >-
            There? Then we're here? I mean, we're back in now, and not still then?
        - id: ch01-b84
          speaker: mouldiwarp
          text: >-
            You're in your own time, sure enough, and won't you be in trouble! Dame Honeysett has been stirring up the whole countryside to look for you. Next time you go wandering through ancient days, you'd better put the clock back. Young people don't know everything. Go downstairs and take your scolding. What must be, must be. If you can't have the crumb, you must make do with the crust. Goodbye.
        - id: ch01-b85
          speaker: narrator
          text: >-
            The mole darted under a chest. Edred and Elfrida stood facing each other in the attic, between the rows of chests.
        - id: ch01-b86
          speaker: edred
          text: "Do you like having adventures?"
        - id: ch01-b87
          speaker: narrator
          text: >-
            He asked it slowly.
        - id: ch01-b88
          speaker: elfrida
          text: "Yes. And you do too. Come on, let's go downstairs."
