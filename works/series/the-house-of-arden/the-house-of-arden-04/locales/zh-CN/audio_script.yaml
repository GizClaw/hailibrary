audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 亲切从容，带一点温和的幽默
        timbre: 温暖清亮
        pace: 舒缓而有变化
        pitch: 中等
    edred:
      display_name: 埃德雷德
      tts:
        delivery: 聪明好胜，认真里带着孩子气
        timbre: 清脆明亮的男孩声
        pace: 自然偏快
        pitch: 中高
    elfrida:
      display_name: 埃尔弗丽达
      tts:
        delivery: 直率活泼，敏锐又有主意
        timbre: 清亮的女孩声
        pace: 轻快
        pitch: 高
    lord_arden:
      display_name: 阿登勋爵
      tts:
        delivery: 威严守旧，笑起来又有几分豪爽
        timbre: 苍老浑厚
        pace: 稳健
        pitch: 低
    lady_arden:
      display_name: 阿登夫人
      tts:
        delivery: 温顺端庄，语气平稳而随和
        timbre: 柔和成熟
        pace: 从容
        pitch: 中等
    messenger:
      display_name: 报信人
      tts:
        delivery: 慌张急切，气息短促
        timbre: 粗哑
        pace: 急促
        pitch: 中等
    smuggler:
      display_name: 走私客
      tts:
        delivery: 豪爽机警，带浓重的水手口吻
        timbre: 粗实低沉
        pace: 自然偏快
        pitch: 中低
    villager_1:
      display_name: 村民甲
      tts:
        delivery: 紧张警觉，话语简短
        timbre: 结实明亮
        pace: 自然
        pitch: 中等
    villager_2:
      display_name: 村民乙
      tts:
        delivery: 激动而笃定，带敬畏之意
        timbre: 浑厚
        pace: 稍快
        pitch: 中低
    mouldiwarp:
      display_name: 白鼹鼠精
      tts:
        delivery: 神秘机灵，带古朴滑稽的乡间口吻
        timbre: 细小而略带沙哑
        pace: 轻快
        pitch: 中高
  chapters:
    - id: ch01
      title: 第四章　法国人登陆
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 接下来是午饭。两个孩子得把腰挺得笔直，一口一口慢慢吃。杯里装的是啤酒，他们想喝水，阿登夫人便问，到底还要讲多少遍，他们才肯记住水喝了有害。阿登勋爵倒一直很安静。开饭不久，他已经把智慧女人的预言、法国人登陆和三个征兆，全讲给妻子听了。
        - id: ch01-b02
          speaker: lady_arden
          text: 哎呀，上帝保佑，老爷，真有这回事？
          emotion: surprised
        - id: ch01-b03
          speaker: narrator
          text: 她说完，仍旧安安稳稳地切肉。后来桌布撤了，酒瓶摆上桌，四周还有西梅干和糖渍梨。阿登勋爵忽然一拳捶下去。
        - id: ch01-b04
          speaker: lord_arden
          text: 夫人，我今天最多喝三杯。你知道我不信迷信，可事实总是事实。那只白鼹鼠精，你们放到哪里去了？
        - id: ch01-b05
          speaker: narrator
          text: 埃尔弗丽达有点胆怯。厨娘告诉过她哪个房间属于她，她已经把鼹鼠藏进房里高脚五斗柜最下面的抽屉。现在，她只好照实说出来。
        - id: ch01-b06
          speaker: lady_arden
          text: 我看，这是老天直接给我们的警告。也许是为了报答那包茶叶和糖呢。
        - id: ch01-b07
          speaker: narrator
          text: 阿登夫人很会看出丈夫相信什么，再把那份相信变成自己的。这个脾气实在讨人喜欢。
        - id: ch01-b08
          speaker: lord_arden
          text: 不管是不是，今天村里的男人都得拿起武器，列队受检。谁敢不来，我一定问个明白。法国人休想若无其事地走上岸，连句“借过”都不说。要不事后准有人告诉我，人家明明警告过我，只怪阿登老爷总以为自己最明白。
        - id: ch01-b09
          speaker: lady_arden
          text: 是啊，那可真难堪。
        - id: ch01-b10
          speaker: narrator
          text: 就在这时，一个男人骑着匹跑得滚烫的马赶到，让阿登勋爵更加认定这番安排十分必要。那人喘得几乎说不出话。
        - id: ch01-b11
          speaker: messenger
          text: 法国人要来了！大家全这么说。他们叫我来禀告老爷。我们该怎么办？
          emotion: fearful
        - id: ch01-b12
          speaker: narrator
          text: 至于消息从哪儿来，他一个字也讲不清。我们如今过得太安稳了，很难懂得当时的人有多害怕。就算发生战争，战火也烧不到自己的家园。窃贼有警察对付，连打雷闪电也有避雷针照管。可在那个年代，日子完全不同。男人、女人和孩子一天接着一天地担惊受怕，个个吓得连鞋子都在发抖，只怕波尼领着法国人打来。
        - id: ch01-b13
          speaker: narrator
          text: 对我们来说，波尼不过是历史书里的拿破仑·波拿巴，是个戴双角帽的小个子。可对当年活着的英国人，他是夜间行走的恐怖。孩子听见这个名字便不敢睡觉，壮汉也穿着靴子上床，把剑和手枪放在枕边，刚一惊醒就能伸手抓住。
        - id: ch01-b14
          speaker: narrator
          text: 智慧女人才作出预言，谣言又像老鼠一样钻遍村里的房屋，所有人立刻疯狂地忙碌起来。看到这一切，埃德雷德和埃尔弗丽达总算稍稍明白了。
        - id: ch01-b15
          speaker: narrator
          text: 阿登勋爵不停下令，夫人忙着把命令一条条告诉女仆。没人顾得上管孩子，他们便溜进村子，尽管睁眼看、竖耳听。有人磨着陈旧的剑，没有剑的人就磨钩镰、斧头、长柄镰，甚至厨房里的切肉刀。还有人封死窗户，在花园挖坑，把钱币和茶匙埋进去。谣言起于何处，谁也不知道，如今却人人都信。
        - id: ch01-b16
          speaker: narrator
          text: 两个孩子随意走进一间间农舍。村民都像是认识他们，见到他们也有点心不在焉的高兴，却没有一个人有空细谈。他们原先还怕身份被识破，怕别人发现眼前的孩子并不是大家以为的那两个人。现在，这份担心很快消失了。屋里的女人正在刷洗、缝补旧红上衣和紧身白裤。悬崖凹坡上站满拿望远镜的人，个个盯着海面。还有人背着大捆的褐色柴枝和干荆豆，吃力地爬上斜坡，把烽火堆得高高的。一旦证实法国人来了，火就会立刻燃起。
        - id: ch01-b17
          speaker: narrator
          text: 埃尔弗丽达真希望自己读过历史书后面的章节。一八〇七年六月十七日，波尼到底有没有在英国登陆？她记得书上写过法国入侵，却不记得入侵哪里，更不知道是哪一年。因此，接下来会发生什么，她和所有人一样茫然。
        - id: ch01-b18
          speaker: narrator
          text: 午饭前，她曾匆匆见过白鼹鼠精。它缩在抽屉一角，答应只要听见召唤便会赶来，临了还特意补充，召唤当然得用诗。后来埃尔弗丽达上楼拿帽子，发现最下面的抽屉已经空了。不过想起那句承诺，她心里仍然安定许多。眼前的忙乱固然让她和埃德雷德一样兴致勃勃，她却只分得出一半心思去看。另一半一直忙着编出一首诗，免得危难突然出现，她却偏偏没有诗，什么办法也使不出来。
        - id: ch01-b19
          speaker: narrator
          text: 这一次，埃德雷德看得反而更仔细。他发现村民没有把烽火堆在阿登勋爵指定的方便地点，正想知道原因，恰好有人从那里经过。他上前一问，那人竟用一根硬邦邦的手指捅了捅他的肋骨。
        - id: ch01-b20
          speaker: smuggler
          text: 哈，你这个小机灵鬼！不过，你是位小绅士，小小姐也一样，上帝保佑她。你们发现了咱们的事，却从没向缉私官告密。
        - id: ch01-b21
          speaker: elfrida
          text: 那当然，我们绝不会告发别人。
        - id: ch01-b22
          speaker: narrator
          text: 埃尔弗丽达答得很谨慎。男人随即问，他们想不想跟他下去。他脸色黝黑，身体结实，活像个水手。脑后还伸着一根短辫子，像日本瓷茶壶的壶柄。
        - id: ch01-b23
          speaker: elfrida
          text: 当然想。
        - id: ch01-b24
          speaker: narrator
          text: 埃德雷德并没有说不想。
        - id: ch01-b25
          speaker: smuggler
          text: 等我走得看不见了，你们再顺着我去的方向下来。别走直线，装成在追蝴蝶，一会儿往这边，一会儿往那边。懂了吧？
        - id: ch01-b26
          speaker: narrator
          text: 孩子们照办了。唉，在我们这个乏味的年代，很少有孩子进过走私客的洞窟。对他们来说，这件事和对你我一样新鲜。他们赶上那个男人时，他正蹲在一片荆豆丛中央。
        - id: ch01-b27
          speaker: smuggler
          text: 从外面那几丛上跳过来。
        - id: ch01-b28
          speaker: narrator
          text: 他们跳过荆豆，沿着窄窄的兔径绕到他身旁。男人掀起一大堆荆豆枝和黑莓藤。那堆枝藤仿佛生在这里，也死在这里，底下却藏着一个洞口，台阶一直通向深处。
        - id: ch01-b29
          speaker: narrator
          text: 下面很黑。埃尔弗丽达听见吩咐，毫不迟疑地向前走。埃德雷德就算犹豫，也只停了一小会儿。孩子们下了大约六级台阶，男人跟着钻进来，把荆豆拖回洞口，又点亮一盏牛脂蜡烛灯。那气味难闻极了。可是，比起探索真正的走私洞窟，热牛脂和热铁的臭味又算得了什么？这里装着他们梦见过的一切，还要更多。
        - id: ch01-b30
          speaker: narrator
          text: 他们沿着斜坡慢慢向下走。灯笼里的黄色火焰照着光滑洁白的白垩岩壁，一边洒下金光，一边投出墨黑的影子。走着走着，前方又出现了台阶。台阶尽头是一扇粗糙厚重的门，门上挂着一把大锁，还得用一把像教堂钥匙那么大的钥匙才能开启。门吱呀一声打开，真正的大洞窟终于出现在眼前。那里高得看不见洞顶，抬起头来，只望得到一片黑暗。
        - id: ch01-b31
          speaker: narrator
          text: 洞窟上端的岩壁开着一个口子。水从那里落下，沿中央平滑的水槽流去，再冲下一条像小铁路路堑的陡坡，最后钻进低矮的拱洞，消失不见。
        - id: ch01-b32
          speaker: edred
          text: 就算有人围困这里，里面也永远不会断水。
        - id: ch01-b33
          speaker: narrator
          text: 洞窟两侧堆满木桶和货包，脚下铺着沙土。桌子和长凳都从整块白垩岩里凿出来。另一边有道形状不齐的裂口，崩塌的悬崖堵住一半。透过缺口，可以望见暮色中的神秘大海，还有海面上方刚亮起的星星。
        - id: ch01-b34
          speaker: narrator
          text: 你还在看，狂风已经猛扑过来，像摔跤手一样用全身压住你，想把你掀倒。它在耳边尖啸，硬把人逼回大洞窟，只剩下气喘吁吁的份儿。
        - id: ch01-b35
          speaker: smuggler
          text: 今晚要刮半场大风暴。
        - id: ch01-b36
          speaker: narrator
          text: 到了这时，他当然已经明明白白是个走私客了。
        - id: ch01-b37
          speaker: edred
          text: 你真觉得法国人明天会在利姆彻奇湾登陆？
        - id: ch01-b38
          speaker: narrator
          text: 走私客借着灯光，郑重其事地眨了眨眼。
        - id: ch01-b39
          speaker: smuggler
          text: 我知道你们两个守得住秘密。法国兵不会登陆，登陆的是咱们。咱们不走海湾，就在这里上岸。卸下来的嘛，是几口真正的好酒，也许还有几码绸子和花边。谁散布了法国人要来的消息，我可不知道，不过那人准不是税务署的朋友。
        - id: ch01-b40
          speaker: elfrida
          text: 哦，我明白了。那么，是不是——
        - id: ch01-b41
          speaker: smuggler
          text: 最糟的是，他们一定会盯紧海面。好在自愿守望的全是咱们自己人。哪些人靠得住，咱们清楚。
        - id: ch01-b42
          speaker: edred
          text: 可我们正在和法国人打仗，你怎么还能跟法国人交朋友？
        - id: ch01-b43
          speaker: narrator
          text: 走私客在一个桶底朝上的木桶上坐下，那木桶摆得正好，简直就是张凳子。
        - id: ch01-b44
          speaker: smuggler
          text: 小伙子，是这么回事。海峡这边也好，那边也好，咱们和自由商人没有仇。人总得谋生，对吧？所以，一个人靠什么吃饭，那份营生就得摆在前头。那些在海峡中间和咱们碰头、把货交过来的人，先是自由商人，随后才是法国人。咱们也一样，先是做买卖的人。我们要打的是法国兵，不是老老实实做生意的法国商人。他们跟咱们自己，本来就在同一条船上。
        - id: ch01-b45
          speaker: edred
          text: 所以，有人编出波尼要来的消息，让大家都守在海湾，你们正好在这里走私？
        - id: ch01-b46
          speaker: smuggler
          text: 先生，我可没把话说得那么绝。不过事情要是真这么巧，那就是上天格外照顾我们这些自由商人。咱们靠老实活计吃饭，冒的也是老实风险，我只说这么多。你们从前做过什么，我心里有数。你们两个跟任何久经风浪的老水手一样可靠。
        - id: ch01-b47
          speaker: narrator
          text: 两个孩子真愿意付出不小的代价，弄清自己“从前做过”的究竟是什么。可不管多想知道，他们始终没有得到答案。甚至到了现在，他们偶尔还会想起这桩谜。那个年代的埃德雷德和埃尔弗丽达到底做了什么，才让这位神气十足、走路都带着威风的走私客这样信任？两个人都猜，那准是一件相当了不起的事。我敢说，他们多半猜对了。
        - id: ch01-b48
          speaker: narrator
          text: 等他们把洞窟内外全看遍，天已经黑了，早过了睡觉时间。这一天也实在累人，所以两个孩子并不反对回阿登城堡。
        - id: ch01-b49
          speaker: narrator
          text: 阿登夫人的贴身女仆亲自来管他们上床，态度相当严厉。他们以前没见过这个女人，以后也不想再见。她整个人又干瘪、又枯瘦、又刻薄。床上的亚麻布是粗粗的本色布料，闻起来却有城堡花园里种出的薰衣草香。床垫又软又厚，像鼓鼓囊囊的针垫，里面填着鹅毛。那些鹅从前都曾被端上城堡的餐桌。孩子们躺进这样的被窝，很快便像两只快乐的小陀螺，睡得又香又沉。
        - id: ch01-b50
          speaker: narrator
          text: 只有埃尔弗丽达醒过一次。屋里全是红光，一座烽火已经燃起，火焰和浓烟被风卷过黑暗的夏夜。外面怒吼不断，窗子也震个不停。照她看来，这阵风至少已经有四分之三场风暴那么大。烽火既然点着，法国人一定要来了。她打个呵欠，又睡了。她困得实在没法相信波尼。
        - id: ch01-b51
          speaker: narrator
          text: 可在一百年前那个夜里，却有成百上千的孩子缩在床上发抖、哭泣。他们相信母亲和保姆说过的可怕预言终于要应验了。那个神秘又恐怖的波尼，这一回真的会来抓走他们。
        - id: ch01-b52
          speaker: narrator
          text: 清晨灰蒙蒙的。狂风大概厌烦了镶铅窗那点可笑的抵抗，突然发力，把窗子从铰链上扯下，砸过窗框，冲进房间。被褥像湿船帆一样啪啪翻飞，两个孩子彻底醒了，再也别想多打一个盹。他们起床穿衣。屋里一个人都没有，前门却开着。
        - id: ch01-b53
          speaker: narrator
          text: 城堡墙后还很平静，他们一走出墙壁的遮挡，风便一把抓住他们，又撞又扇，又推又缠，又捶又打。光是站直就很艰难，想向前挪动，更得一点一点使劲。可他们还是想办法走到了悬崖边。那里挤着黑压压的一大群人。等孩子们走近，在灰色晨光里看清楚，才发现这群人其实一点也不黑。他们身上的红、白、蓝三色鲜艳得像一面英国国旗。这些正是前一晚受老阿登勋爵操练、列队检阅的武装村民，穿的全是临时拼凑出的制服。此刻，每一双眼睛都越过悬崖，死死望着大海。
        - id: ch01-b54
          speaker: narrator
          text: 海水像牡蛎壳的内壁，横着一道道冰冷的银纹。天空灰得如同海鸥翅膀。海天之间，一艘船正笔直冲向悬崖下方百英尺处的礁石。
        - id: ch01-b55
          speaker: villager_1
          text: 看它的帆装，是一艘法国船。
        - id: ch01-b56
          speaker: villager_2
          text: 这是舰队最前头的侦察船。上天送来风暴，要毁了他们，就像伊丽莎白女王时代毁掉那支该死的无敌舰队。
        - id: ch01-b57
          speaker: narrator
          text: 船还在向前，越来越近。走私客朋友凑到埃尔弗丽达耳边，压低声音。风暴不停尖啸，她几乎听不清他说什么。
        - id: ch01-b58
          speaker: smuggler
          text: 那是“美好希望号”。老贝蒂说中了，法国人今天真的会在这里登陆，不过上岸的全是尸体。咱们那一小船货也完了。他们在风暴里没碰上咱们的船，如今那些货要当着咱们的面撞个粉碎。唉，做个老实商人，日子可真难过。
          emotion: sad
        - id: ch01-b59
          speaker: narrator
          text: 男人们穿着古怪制服，拿着古怪武器，彼此挤得更紧。那艘船仍旧越来越近，所有人都一动不动地紧盯着它。
        - id: ch01-b60
          speaker: elfrida
          text: 它真的一定会撞沉吗？
          emotion: fearful
        - id: ch01-b61
          speaker: narrator
          text: 埃尔弗丽达紧紧抓住老阿登勋爵的手。
        - id: ch01-b62
          speaker: lord_arden
          text: 没有希望了，孩子。你回家睡觉去吧。
          emotion: sad
        - id: ch01-b63
          speaker: narrator
          text: 就算这一幕发生在一百年前，也没有任何分别。冰冷狂暴的大海就在下面鞭打礁石。埃尔弗丽达曾把雕花针线盒掉在厨房砖地上，看着它摔碎。她无法留在这里，看那艘船也这样撞得粉碎，甚至不敢想象那个场面。编诗很难，可留在这里看一艘载着人的船沉没，还要难得多。
        - id: ch01-b64
          speaker: elfrida
          text: 白鼹鼠精，快来我身旁。你看，我实在不忍心望。
        - id: ch01-b65
          speaker: narrator
          text: 这两句不算好诗，却正好说出了她的心情，也确实起了作用。她刚念完，白鼹鼠便蹭到了脚边。埃尔弗丽达连忙把它抱起来。
        - id: ch01-b66
          speaker: elfrida
          text: 我们该怎么办？
        - id: ch01-b67
          speaker: mouldiwarp
          text: 回家，回城堡去。现在你们能找到那扇门了。
        - id: ch01-b68
          speaker: narrator
          text: 两个孩子转身离开。就在那一刻，他们听见碾磨般的碎裂巨响。声音混在风吼浪啸中，比风浪还响，却又很像一条狗啃着晚饭剩下的鸡骨头，忽然把整排鸡肋骨一起咬进嘴里。接着，悬崖上的人群发出一阵叹息般的呻吟。他们已经守了一整夜，就等法国人登陆。阿登勋爵的声音随即响起。
        - id: ch01-b69
          speaker: lord_arden
          text: 法国人登陆了。她说的是真话。法国人登陆了。愿上天救救他们！
          emotion: surprised
        - id: ch01-b70
          speaker: narrator
          text: 孩子们拔腿朝城堡跑。跑动中，他们已经明白接下来会发生什么。悬崖上的村民熬了一整夜，本来是等法国人上岸，好拿剑、长柄镰、钩镰和切肉刀杀死他们。可是现在，船上的法国人落进了狂暴的大海。为了把同样这些法国人救上岸，那群村民中的每一个都会毫不犹豫地拿自己的性命去冒险。人这种生灵，可真奇怪！
        - id: ch01-b71
          speaker: narrator
          text: 埃尔弗丽达眼下只有一个念头，就是尽快离开这里，回到那种安全又安静、既没有海难也没有女巫的生活。她一手紧紧抱着白鼹鼠精，另一只手拉住埃德雷德，带着他冲回城堡。他们从敞开的前门跑进去，一口气奔上楼，径直来到一扇门前。埃尔弗丽达知道，这回一定就是正确的门。她没有猜错。
        - id: ch01-b72
          speaker: narrator
          text: 门后正是架着横梁的大阁楼。斜屋顶下，那一长排奇妙的箱子还在那里。门刚关好，狂风的怒吼便消失了，就像有人关掉煤气，火焰的呼呼声立刻停住。金色阳光重新穿过瓦片缝隙。外面是鸽子嗒嗒的脚步、羽毛摩擦的窸窣，还有咕噜噜的低鸣。
        - id: ch01-b73
          speaker: narrator
          text: 他们自己的衣服躺在地上。白鼹鼠精一路被抱得太紧，又跑得太快，这会儿还有点喘。
        - id: ch01-b74
          speaker: mouldiwarp
          text: 换衣服。
        - id: ch01-b75
          speaker: narrator
          text: 两个孩子开始换衣服，鸽子的声音便越来越近，还像是在暗中帮忙。他们终于脱下一八〇七年那身扎人的衣裳，重新穿上一九〇七年舒服的水手服。
        - id: ch01-b76
          speaker: mouldiwarp
          text: 找到宝藏了吗？
        - id: ch01-b77
          speakers: [edred, elfrida]
          ensemble: duo
          text: 没有，我们压根儿没想起来。
        - id: ch01-b78
          speaker: mouldiwarp
          text: 那也不打紧。宝藏本来就不在那里。
        - id: ch01-b79
          speaker: elfrida
          text: 不在那里？这么说，我们已经回到这里了？我是说，现在是“现在”，不是还在“那时”？
        - id: ch01-b80
          speaker: mouldiwarp
          text: 哦，准准地是在“现在”，也准准地要挨骂！霍尼塞特太太为了找你们，差点叫动四乡八里。下回再跑到古时候闲逛，最好先把钟拨回去。年轻人可不是什么都懂。快下楼听训吧。该怎样，就怎样。没有面包心，只好啃面包帮。再见。
        - id: ch01-b81
          speaker: narrator
          text: 白鼹鼠精说完再见，便钻进一只箱子底下。阁楼里只剩埃德雷德和埃尔弗丽达，站在两排箱子之间，彼此望着。过了一会儿，埃德雷德才慢慢开口。
        - id: ch01-b82
          speaker: edred
          text: 你喜欢历险吗？
        - id: ch01-b83
          speaker: elfrida
          text: 喜欢。你也喜欢。走吧，下楼去。
