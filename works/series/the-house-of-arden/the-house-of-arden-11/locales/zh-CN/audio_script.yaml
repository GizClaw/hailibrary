audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 亲切从容，带一点温和的幽默
        timbre: 温暖清亮
        pace: 舒缓而有变化
        pitch: 中等
    edred:
      display_name: 埃德雷德
      tts:
        delivery: 聪明好胜，认真里带着孩子气
        timbre: 清脆明亮的男孩声
        pace: 自然偏快
        pitch: 中高
    elfrida:
      display_name: 埃尔弗丽达
      tts:
        delivery: 直率活泼，敏锐又有主意
        timbre: 清亮的女孩声
        pace: 轻快
        pitch: 高
    mrs_honeysett:
      display_name: 霍尼塞特太太
      tts:
        delivery: 热心爽快，乡下口吻朴实幽默
        timbre: 温厚略粗的成年女声
        pace: 自然偏快
        pitch: 中等
    old_man:
      display_name: 比尔老头
      tts:
        delivery: 慈祥健谈，带着古朴的乡下口吻
        timbre: 苍老浑厚
        pace: 从容缓慢
        pitch: 低
    aunt_edith:
      display_name: 伊迪丝姑妈
      tts:
        delivery: 温柔能干，亲昵中带一点克制
        timbre: 温暖沉稳的成年女声
        pace: 自然舒缓
        pitch: 中等
  chapters:
    - id: ch01
      title: 第十一章　事态的发展
      blocks:
        - id: ch01-b01
          speaker: edred
          text: 来，你量好海波，再摆出四只馅饼盘。我去提水。
        - id: ch01-b02
          speaker: narrator
          text: 霍尼塞特太太帮着埃德雷德提来了两大桶水，桶里装得满满的。
        - id: ch01-b03
          speaker: edred
          text: 霍尼塞特太太，您不会再进来了吧？门只要开一点点，照片就全完了。
        - id: ch01-b04
          speaker: mrs_honeysett
          text: 哎哟，我的小祖宗！我才不进去呢，里面又没有我要办的事。
        - id: ch01-b05
          speaker: narrator
          text: 她说话时，两只胖手还扶着胖胖的腰。等她出去，埃德雷德立刻插上那根粗大的木门闩。
        - id: ch01-b06
          speaker: edred
          text: 还是闩上保险，免得她忽然想起什么。这下总算全黑了。
        - id: ch01-b07
          speaker: narrator
          text: 才没有呢。房间最会捉弄人。平常看着黑洞洞的，等你真需要黑暗，它偏不肯给你。这间屋子一开始连装黑都懒得装。百叶窗上方有两个心形小洞，亮光直往里射。埃德雷德只好再开门找报纸，爬上窗座，把揉皱的纸紧紧塞进洞里，又拉又拍，直到一丝光也透不进来。
        - id: ch01-b08
          speaker: edred
          text: 好了，这一次准黑了。
        - id: ch01-b09
          speaker: narrator
          text: 还是不黑。百叶窗铰链旁边的细缝里，钻进来一道道落满灰尘的长光，报纸可堵不住。埃德雷德第三次打开门，去找霍尼塞特太太。她坐在后门的小矮椅上，正给一只白鸡拔毛。柔软的白羽毛四处飘着，让他想起不少奇妙的事，不过他什么也没提。
        - id: ch01-b10
          speaker: edred
          text: 您有旧窗帘吗？厚的最好。薄的也能用，只要是红色。
        - id: ch01-b11
          speaker: narrator
          text: 霍尼塞特太太把鸡放进白羽毛堆里，从厨房的五斗橱中拿出两幅红天鹅绒旧窗帘。埃德雷德抱走窗帘，很快又回来了。
        - id: ch01-b12
          speaker: edred
          text: 您这里大概没有锤子吧？
        - id: ch01-b13
          speaker: narrator
          text: 餐具柜的抽屉里偏偏有一把。他拿走锤子，转眼又跑回来。
        - id: ch01-b14
          speaker: edred
          text: 图钉总不会也有吧？
        - id: ch01-b15
          speaker: mrs_honeysett
          text: 我倒不明白，从里面锁门有什么用。老往屋里闯的不是我，老往外跑的可是你。
        - id: ch01-b16
          speaker: narrator
          text: 她笑着递给他一包裹在潮纸里的生锈图钉。埃德雷德用锤子敲中了许多次手指，却只敲中图钉几次。最后，图钉总算肯挂住窗帘，或者说，窗帘终于肯让图钉挂住了。
        - id: ch01-b17
          speaker: edred
          text: 现在真的已经黑了吧……
        - id: ch01-b18
          speaker: narrator
          text: 他想说黑了，可当然没有。门底还有一道大缝，照埃尔弗丽达的说法，宽得几乎能让人爬过。那就只好再去找霍尼塞特太太，再讨一幅窗帘。这一回，她叫埃德雷德快走，别再缠着她惹人烦，还朝他扔了一把柔软蓬松的白羽毛。不过她自己也笑了，而且还是给了他窗帘。屋里终于真正黑下来，两个孩子却又要打开门闩，因为埃尔弗丽达忘了自己把火柴放在哪里。
        - id: ch01-b19
          speaker: narrator
          text: 这样来回折腾以后，他们仅剩的一点耐心也快用光了，觉得什么都慢。罩着红灯罩的灯总算烧亮，四只馅饼盘盛上清水，在怪异的红光中变成粉红色。
        - id: ch01-b20
          speaker: edred
          text: 至少有一件好事，海波已经全化开了。
        - id: ch01-b21
          speaker: narrator
          text: 他们仔细剪开胶卷，长长的黑纸条卷在脚边，谁也顾不上管。
        - id: ch01-b22
          speaker: edred
          text: 要是我们生下来就会照相就好了，像海滩上给伊迪丝姑妈、你和那头驴拍照的人一样。
        - id: ch01-b23
          speaker: narrator
          text: 埃德雷德紧张地把胶卷放进第一只盘子，在水里来回拉动。
        - id: ch01-b24
          speaker: elfrida
          text: 千万别留下气泡！也让我做一点吧。
        - id: ch01-b25
          speaker: edred
          text: 下一卷就让你来。
        - id: ch01-b26
          speaker: narrator
          text: 他几乎屏住了呼吸。亲爱的听众，你有没有经历过这样的时刻？胶卷过了海波，举到灯前，却一点影子也不出现。你忍不住怀疑，是不是忘了拨快门，或者误拿了一卷没有曝光的胶卷。呼吸不顺，手指也忽然变笨，胶卷还滑得要命。你只好装出绝望中的镇定，再把它浸回海波溶液，一遍遍拉过去。
        - id: ch01-b27
          speaker: narrator
          text: 你会说，我看它根本显不出来。可下一次把胶卷举到红光前，光荣的时刻突然来了。你欣喜得只能低声念一句，啊，开始出现了。
        - id: ch01-b28
          speaker: narrator
          text: 请把那一刻的所有激动都想起来，最好是你刚拿到相机不久时的那一种。再把它乘上七百万，加上一个未知数 x。那个 x，代表一种你从未尝过的感情。这样，你才能稍稍明白，胶卷上浮出第一片淡灰色模糊影子时，两个孩子心里有多激动。
        - id: ch01-b29
          speaker: narrator
          text: 可就算你把整张乘法表里的数全乘完，再把买得起的 x 一个个加上去，也想象不到六张小照片完全显出来时，他们有多快活。那些照片真的完美无缺。它们拍下了阿登城堡，也拍下了城堡自身完美无缺的年代。没有坍塌的拱门，没有剥落的墙壁。每一处都整整齐齐，轮廓分明，跟他们回到三百年前时亲眼看见的一模一样。
        - id: ch01-b30
          speaker: narrator
          text: 第二卷胶卷也同样幸运，又显出六张毫无瑕疵的古城堡照片。第三卷显影得一样漂亮。只是，就在应该把它从海波溶液中取出来、开始清洗的前一刻，一根小白羽毛从埃德雷德头上落进盘里。那根羽毛实在太小，红光又太暗，他一点也没有发现。羽毛没有粘在胶卷上，也没有闹出你看见它落下时可能担心的任何乱子。后来那件怪事也许是它引起的，我可不知道。我只能把事情怎样发生，便怎样讲给你听。
        - id: ch01-b31
          speaker: narrator
          text: 你当然知道，胶卷要钉起来晾干。第一卷钉在门右边的木板上，第二卷钉在门左边。等轮到第三卷，也就是那根小白羽毛曾落在旁边的一卷时，门上已经没有木头可钉了。屋子的墙全用石头砌成，剩下唯一能钉针的木头，只有窗上的百叶。他们只好把第三卷胶卷横过来，钉在百叶窗上。
        - id: ch01-b32
          speaker: edred
          text: 没事，等它干了，我们才会打开百叶窗。
        - id: ch01-b33
          speaker: narrator
          text: 他在胶卷四角分别钉好一根针，回过身，打算先吹灭红灯，再打开门闩。可事实上，门根本没有闩上。他刚才拿着抹布回来时，把闩门这件事忘得一干二净，所以现在当然也没有门闩可开。不过，罩着红灯罩的灯总还是可以吹灭的。埃德雷德便把它吹灭了。
        - id: ch01-b34
          speaker: narrator
          text: 奇迹就在这时发生。屋里本来应该一片漆黑。为了让它黑下来，两个孩子明明费了那么多工夫，可它偏偏不黑。装百叶窗的那扇窗，钉着胶卷的那扇百叶窗，落过白羽毛的那卷胶卷，还有霍尼塞特太太坐在后门拔鸡毛时飘到埃德雷德头上的那根白羽毛，这一长串事情的尽头，竟亮起一大片宽阔的长方形光亮。光里有微弱的闪烁不停游动，仿佛电影还没开始，放映机的光已经落到银幕上，正在那里轻轻颤动。
        - id: ch01-b35
          speaker: narrator
          text: 埃尔弗丽达惊呼着去抓弟弟的手，却先抓住了他的头发。她沿着他的胳膊摸下去，终于握到那只手，紧紧不放。
        - id: ch01-b36
          speaker: edred
          text: 又是魔法。我就知道又会这样。
        - id: ch01-b37
          speaker: elfrida
          text: 嘘！快看，快看呀！
        - id: ch01-b38
          speaker: narrator
          text: 那片宽阔的长方形光亮忽然不再只是一片光。里面先出现人影，接着人影活动起来。那是一幅活的画面，有点像电影，却更像另外一种东西，更像生活本身。孩子们觉得窗户仿佛真的打开了。他们可以从这边直接望进另一个世界。那里有光，有灿烂的太阳，有蓝天，也是一个处处都在发生事情的世界。
        - id: ch01-b39
          speaker: narrator
          text: 城堡出现在眼前。男人们背着麻袋，一个接一个走过吊桥。一个颈上挂银链、手里执着高杖的人站在高大的门洞下面，指挥他们把麻袋送去哪里。一辆载满大木桶的马车驶来，木桶被卸下车，滚过吊桥，又滚进门楼的高拱门。画面忽然闪了一下，景象转到室内。那是一间长长的屋子，一边挂满画像，另一边排满窗户。一位女士戴着宽大的白领，垂着美丽的长卷发，模样很像伊迪丝姑妈。她正把一套套精美衣裙叠进箱子。另一位留着长发的绅士，领口和袖口都缀满花边。他把金壶、银壶，还有金银盘子装进另一只箱子。仆人一趟趟走来，送进更多金光闪闪的华贵物件，东西越来越多，仿佛怎么也搬不完。
        - id: ch01-b40
          speaker: narrator
          text: 姐弟俩激动得说不出话，可心里同时叫道，那就是宝藏！他们也想到同一件事。只要画面继续到宝藏藏好，就能看清藏处，再亲手把它找出来。
        - id: ch01-b41
          speaker: narrator
          text: 我自己猜，白鼹鼠精大概也很想帮一点忙。也许整场演出都是它安排的，好叫孩子们知道宝藏大致藏在哪里，从此不要一天到晚、不分昼夜，用那些连一只鼹鼠也听得出不怎么高明的诗来召唤它。无论真相是不是这样，这场演出都妙极了。不知为什么，隔着这扇通向过去的窗去看，竟比他们真正置身过去、亲自卷进当时发生的事情时看得更清楚。
        - id: ch01-b42
          speaker: narrator
          text: 眼前这些东西毫无疑问就是宝藏，而且不但数量惊人，样样还都漂亮得很。贵重华美的东西越装越快。装进去的越多，女士的脸色越苍白，绅士也显得越来越焦急。女侍把围裙兜起来，里面盛满一只只小盒子和一个个包裹。女士跪在箱前，从她手里逐件接过。眼看箱子就要装满，长廊尽头的门忽然开了。
        - id: ch01-b43
          speaker: narrator
          text: 黑暗中的两个孩子竟看见了自己。他们沿着画像长廊走来，走向那一群箱子、宝物和忙乱不安的人。一个穿着蓝绸和花边，一个穿着黑天鹅绒。他们也看清自己脸上的神情，那里有害怕，有爱，还有不知道下一刻会发生什么的惊奇。两个大人迎上来，把他们搂进怀里，那分明就是爸爸和妈妈。孩子们开口说了什么，两个大人也认真回答。嘴唇都在动，可蒸馏室里的他们还是一个字也听不见。
        - id: ch01-b44
          speaker: edred
          text: 只要能听见他们的话，我愿意把整整一年的零用钱都交出来。
        - id: ch01-b45
          speaker: elfrida
          text: 那个爸爸跟我的爸爸一模一样，也跟伦敦塔里那个像极了我爸爸的人一样。
        - id: ch01-b46
          speaker: narrator
          text: 画面里的姐弟跪下，爸爸把双手放在他们头顶。蒸馏室里的两个孩子也跟着低头，因为他们明白那是在做什么。埃尔弗丽达甚至半伸出双臂，可她碰不到画面里的人。
        - id: ch01-b47
          speaker: narrator
          text: 画面又换了。四个男人正抬着一只箱子。箱子沉得厉害，他们绷紧身子，脚下踉踉跄跄。绳子从箱底穿过，两头压在他们肩上。每走一阵，他们就把箱子放下，伸直腰身，再擦掉脸上的汗。画面不停变化，两个孩子仿佛也跟着他们往前走。先走下一段楼梯，来到宽敞的大厅。大厅里挤满男人，大家都在交谈，也都忙着收拾铠甲和高筒靴。接着，他们又横穿庭院。这里的人更多，也更忙。有人把斧头擦亮，有人擦着长矛似的武器，有人清理火枪，给手枪装上新燧石，还有人把长剑压在一块大磨石上磨得锋利。埃德雷德真想停下来，看他们把这些事情一件件做完。可那些人和他们手上的活计很快就过去了，抬箱子的四个人已经走进另一道拱门。其中一个又想休息，另外三个却告诉他，没必要再停，他们几乎已经到了。虽然画面没有一点声音，他们说的意思却清清楚楚。
        - id: ch01-b48
          speaker: narrator
          text: 埃德雷德在心里说，这回我们真的会知道了。埃尔弗丽达用力捏了一下他的手。她心里想的，也正是这一句话。男人们终于停在一扇门前。他们敲了一次，又敲一次，接着敲了第三次。奇怪得很，先前的画面一直没有半点声音，这三下敲门声，却让蒸馏室里的孩子听得清清楚楚。
        - id: ch01-b49
          speaker: narrator
          text: 男人们放下箱子，隔着它互相望了望。一个人把肩膀抵到门上，用力撞去。只听嘎吱一声，画面突然消失，整片光也熄灭了。眼前重新出现钉着胶卷的百叶窗。它后面的房门已经敞开，霍尼塞特太太正站在那里。她告诉两个孩子，晚饭有烤兔肉和一只煮猪肘，要是还不快点出来，饭菜可全要凉了。
        - id: ch01-b50
          speaker: elfrida
          text: 霍尼塞特太太，您太坏了，真的太坏了！
          emotion: angry
        - id: ch01-b51
          speaker: mrs_honeysett
          text: 但愿没把照片弄坏。我敲了三次门，你们安静得一点声音也没有。我还以为出了事，你们一不小心把自己毒死了，或者差不多。
        - id: ch01-b52
          speaker: edred
          text: 这实在太过分了。我不想吃晚饭，什么也不想要。所有事情全毁了。
          emotion: angry
        - id: ch01-b53
          speaker: mrs_honeysett
          text: 我本来也许能多敲一会儿，可你们一开始老在闩门，我还以为门锁着呢。我试着一拧把手，它就在我手里开了。走吧，宝贝儿，别记我的仇。我不是有意的。坏了什么，我给你们再弄。明天还能重新拍照呀。
        - id: ch01-b54
          speakers: [edred, elfrida]
          ensemble: duo
          text: 您应该知道我们没事。坏掉的不是照片。
        - id: ch01-b55
          speaker: narrator
          text: 两个孩子都觉得应该把这一点讲清楚，结果恰好同时说了出来。
        - id: ch01-b56
          speaker: mrs_honeysett
          text: 那到底是什么？看在老天分上，先出来趁热吃饭吧。
        - id: ch01-b57
          speaker: elfrida
          text: 是另一种画面。偏偏被打断，实在太可惜了。
          emotion: sad
        - id: ch01-b58
          speaker: mrs_honeysett
          text: 别难过，宝贝儿。一会儿还有好惊喜，专门等着乖姑娘和乖小子。再不快来，兔肉就硬得像石头啦。不过我来叫你们时，已经把它放回烤箱。你们摆弄了盘子里的毒东西，手准脏得不像样。我要是你们姑妈，非得禁止不可。现在快洗手去，不许再胡闹。听见了吗？
        - id: ch01-b59
          speaker: narrator
          text: 霍尼塞特太太像祖母一样慈爱，一个人能得到的赞美，恐怕没有比这更高的了。可你大概也听出来了，她说这番话时，开头还又温柔又会哄人，到末尾却真生起气来。她不是一开始就在生气，而是一路说着说着，亲手把自己说恼了。这其实很容易。我敢说，你也不止一次这样做过。
        - id: ch01-b60
          speaker: narrator
          text: 这是两个孩子来到阿登城堡以后，第一次默默吃完一顿饭。埃德雷德难受得觉得兔肉会卡在喉咙里，还真心实意地拒绝了第二份醋栗馅饼。只要知道这一点，你就明白他失望到了什么地步。埃尔弗丽达也吃得比平时少。他们本来离答案那么近，几乎已经看见宝藏要藏在哪里，却只因为最后一次回来时忘了闩门，让所有努力都白费了。霍尼塞特太太只当他们在为一件傻乎乎的小事赌气。看到埃德雷德连馅饼也不要，她差一点就把这话讲出来。
        - id: ch01-b61
          speaker: narrator
          text: 晚饭结束以后，埃尔弗丽达从椅子上下来，这才真正看清霍尼塞特太太的脸。那张脸跟平日总是带着慈爱的模样很不一样。她很慢很慢地走过去，到了跟前，却又很快很快地伸出双臂，一把抱住霍尼塞特太太，还亲了她一下。
        - id: ch01-b62
          speaker: elfrida
          text: 对不起，我们刚才太讨厌了。您不够聪明，弄不懂那些画面和别的事，这又不是您的错，对吧？
        - id: ch01-b63
          speaker: narrator
          text: 要不是霍尼塞特太太真是一个可爱到极点的人，这样的道歉还不如一句也不说。幸好她偏偏就是这样的人。她听完笑了起来，把埃尔弗丽达紧紧抱住。不知怎么，站在旁边的埃德雷德也被卷进了这个拥抱，又跟着她们一起笑。三个人就这样重新成了朋友。外面的天空恢复了蔚蓝，太阳也从云后露出脸来。
        - id: ch01-b64
          speaker: narrator
          text: 随后，两个孩子下山去找比尔老头。他的花园里已经开出玫瑰。砖砌小路两旁，还有白色鸢尾、羽扇豆和一株株高高的毛地黄。比尔老头坐在前门边的阳光下，用埃德雷德的话说，是坐在一把棕色温莎椅上。他头顶挂着一只柳条笼，一只寒鸦正待在里面。埃尔弗丽达起先很不赞成，后来发现笼门开着，寒鸦坐在那里只是因为喜欢，并不是非待不可，这才放下心。你还记得，她自己曾在伦敦塔里坐过牢。坐过牢的人，绝不会愿意看见活物被关在笼中。
        - id: ch01-b65
          speaker: narrator
          text: 木门槛上坐着一只方墩墩的猫，身上既有狸纹，又有白斑。说来奇怪，乡下农舍里的猫怎么总是这种花色，又总长得方墩墩的呢？水桶投下的一小片阴影里，还趴着一只棕色长耳猎犬。它用羽毛似的尾巴，懒洋洋地扫着石板。眼前就是一幅乡野安宁图，比尔老头在正中央睡得香甜。我很高兴地告诉你，阿登勋爵和他的姐姐非常有礼貌。他们没有像某些孩子那样大喊一声喂，也没把花园门上光滑的棕色铁门闩摇得乱响，只在大门对面干燥的草坡坐下，隔着灰绿色栅栏看蓝蝴蝶和白蝴蝶，看花朵，也看绿油油的马铃薯叶。
        - id: ch01-b66
          speaker: narrator
          text: 埃尔弗丽达忽然想到一个又快又妙的主意，身子猛地跳了一下。她没有开口，埃德雷德还以为她被蚂蚁咬了。
        - id: ch01-b67
          speaker: edred
          text: 使劲掐一下被咬的地方。蚂蚁要是没跑，说不定能把它掐死。
        - id: ch01-b68
          speaker: narrator
          text: 等他们看够蝴蝶、红玫瑰和生长的绿叶，就目不转睛地看着比尔老头。只要被人这样看得够久，谁都会醒。他果然颤巍巍地站起来，把手举到额前。
        - id: ch01-b69
          speaker: old_man
          text: 勋爵大人，您来了。
        - id: ch01-b70
          speaker: elfrida
          text: 您好吗？我们还没有找到宝藏。
        - id: ch01-b71
          speaker: old_man
          text: 会找到的，一定会。进屋坐坐吧。或者去凉亭那边喝杯牛奶？
        - id: ch01-b72
          speaker: edred
          text: 我们待在这里就好。霍尼塞特太太说，所有老故事您都知道。
        - id: ch01-b73
          speaker: narrator
          text: 他们已经进了园门。埃德雷德跟棕色长耳猎犬一起坐在石板上，亲热地拍着它。埃尔弗丽达在旁边抚摸那只方墩墩的猫。
        - id: ch01-b74
          speaker: old_man
          text: 啊，霍尼塞特太太是个好姑娘。她父亲有座塞林农场。只要新娘不说气话，那里的小仙子就会替她搅黄油。那些仙子呀，向来没多少活可干。
        - id: ch01-b75
          speaker: narrator
          text: 比尔老头咯咯笑了几声，又叹了一口气。
        - id: ch01-b76
          speaker: old_man
          text: 我知道的故事可多了，谁来问，我总知道他想听哪一个。你们是来问东宅的故事吧？怎么样，老头子的脑筋还灵不灵？
        - id: ch01-b77
          speaker: edred
          text: 我们想知道，城堡那一边为什么一直关着，满是蛛网、灰尘、锈迹和霉味。要是我们找到宝藏，有钱换窗帘、地毯和别的东西，为什么不能把那里打扫干净，重新收拾好呢？
        - id: ch01-b78
          speaker: old_man
          text: 那是个伤心故事，是讲给老人，或者中年人听的，不是给孩子听的。就算我讲了，你们大概也听不懂。
        - id: ch01-b79
          speaker: elfrida
          text: 我们就喜欢听大人的故事。
        - id: ch01-b80
          speaker: edred
          text: 只要讲明白，大人懂的东西，我们全能懂。我懂万有引力，也懂为什么地球绕着太阳转。伊迪丝姑妈一讲，我马上就懂了。我还知道恒星、分光镜、微生物，知道赤道不是真的东西，还懂好多呢。
        - id: ch01-b81
          speaker: old_man
          text: 啊，我敢说，你还没到二十一岁，肚子就要被书里的学问撑破了。但愿至少一半是真的，别是有人欺负你这个轻信人的无辜孩子。我从来不信太阳不动。一个星期哪一天都行，你用自己的眼睛就能看见它在动。
        - id: ch01-b82
          speaker: elfrida
          text: 您才不会骗人呢。求您讲给我们听吧。
        - id: ch01-b83
          speaker: narrator
          text: 于是，比尔老头讲起了东宅的往事。
        - id: ch01-b84
          speaker: old_man
          text: 那是很久以前，连我都还没有出生。不过也不算早得太离谱，因为我还记得父亲讲起它。事情发生时，他在城堡当马车夫，所以该知道的全知道。我母亲又是管家，陪着这家人从头到尾经历了整件事。那时也有一位埃尔弗丽达小姐，跟现在一样，只是比您年长些。四面八方的年轻绅士都来追求她。她是个出色的姑娘，真是个大美人。头发黑得像煤，眼睛像暴风雨前的大海。那时海浪正在涌起，白色浪尖却还没有赶来。这些都是父亲说的，我自己可没见过。她总把漂亮的头高高昂着，那么多人追求，谁也不肯多看一眼。老勋爵又太疼爱她，想着女儿还年轻，不忍违背她的意愿去逼她。于是她一直没有嫁人，只是天天望着海。
        - id: ch01-b85
          speaker: edred
          text: 她为什么总看海？
        - id: ch01-b86
          speaker: old_man
          text: 她在等心上人的船，想看看那条船会不会回家。她早就有了爱人，只是别人全不知道。那是她表兄迪克。要说没出息的浪荡子，他可算得上一个。后来人们才发现，他俩掰开一枚六便士，各拿一半，还发誓一辈子不变心。迪克出了海，要去闯一番前程。于是她每天照常守着海，而他每天照常不回来。另一个年轻人倒是每天都骑马来。他是一位体面的年轻绅士，家里也很富裕。他的性子跟迪克少爷差不多，只是有一大笔财产撑着，身上的野性便没机会像迪克那里一样长得那么厉害。
        - id: ch01-b87
          speaker: elfrida
          text: 可怜的迪克！
        - id: ch01-b88
          speaker: old_man
          text: 先别急着可怜他，小姐。后来，父亲母亲劝她，亲爱的，就嫁给这个守在身边、又真心爱你的人吧。老话不就是这样说的吗？那位年轻人姓弗鲁因，教名阿诺德。她说不，父母却不停劝她答应，弗鲁因也一直求她嫁给他。他们说迪克准已经淹死了，还说了许多别的话，一点点磨掉她的心劲。最后，她只好说，好吧，那我嫁。可你得受得了娶这样一个姑娘。她已经许给了一个死去的年轻人，整颗心也都跟着那个人留在海里。婚礼定在圣诞节。埃尔弗丽达小姐住在东宅那间朝阿登丘的房里，仆人住在阁楼，两位老人住在宅子的另一边。
        - id: ch01-b89
          speaker: old_man
          text: 那天夜里，所有人都睡着后，她大概听见窗上嗒、嗒地响。起初她以为是常春藤，可声音不是藤条弄出来的。她鼓足勇气走到窗边，看见外面有张脸。那人顺着常春藤爬了上来，正是别人说已经淹死的真正爱人。
        - id: ch01-b90
          speaker: edred
          text: 这可太棒了！
        - id: ch01-b91
          speaker: elfrida
          text: 可弗鲁因先生怎么办？他太可怜了。
          emotion: sad
        - id: ch01-b92
          speaker: old_man
          text: 小姐，她想到的也正是弗鲁因先生，所以不敢面对这件事。可她最后还是穿上骑马外套，跟迪克一起爬出窗口，再顺着常春藤落到地面，两个人连夜逃去了伦敦。第二天早晨，教堂的钟已经为婚礼敲响，新郎也来到城堡，却没有新娘等着他。埃尔弗丽达小姐只留下一封信，说自己非常抱歉，可事情只能这样。于是，家里从此封住了东宅。
        - id: ch01-b93
          speaker: elfrida
          text: 原来这就是整个故事。
        - id: ch01-b94
          speaker: old_man
          text: 才一半呢，小姐。
        - id: ch01-b95
          speaker: narrator
          text: 他拿出黑陶烟斗和一纸卷烟草，慢慢装好，仔细点着，这才接着说。
        - id: ch01-b96
          speaker: old_man
          text: 东宅封了，可她从前住过的房间仍然有人扫地除尘。两位老人伤透了心，因为女儿始终没有半点消息。要是我还懂一点做父母的心情，他们准会常常彼此念叨，她本该信任我们。她也该知道，不管要什么，我们绝不会拒绝。后来有一晚，大门被人敲响。门外站着从前的埃尔弗丽达小姐，如今的迪克太太，怀里还抱着一个婴儿。迪克先生出了意外，突然死了，她只好回家投奔父母。老人们疼她和孩子怎么也疼不够。她住回旧房间，日子慢慢快活了一些。她把孩子当成宝贝，老人们又把女儿和孩子一起当成宝贝。可后来又有一夜，有个人像迪克少爷从前那样顺常春藤爬上来。这一次，他带走的不是她，而是她的孩子。
        - id: ch01-b97
          speaker: elfrida
          text: 太可怕了！后来找到孩子了吗？
          emotion: fearful
        - id: ch01-b98
          speaker: old_man
          text: 再也没有。谁带走了孩子，为什么带走，又带去了哪里，始终一点消息也没查到。只知道过了一两个星期，弗鲁因先生在猎场出了事故。人们把他扶起来时，他只来得及说，埃尔弗丽达，告诉埃尔弗丽达……他正想讲清楚要告诉她什么，却断了气。有些人说，是他偷走了婴儿，为的是报复她当年抛弃自己。也有人说，他原想假装把孩子找回来，让她因为感激而嫁给他。可真相是什么，谁也永远不会知道。孩子的母亲一天比一天消瘦，后来只剩一道影子，不久也死了。东宅从此彻底封住，任它腐烂坍坏，成了今天的模样。别哭，小姐。我早知道您不会喜欢这个故事，可是您一定要听。不过真的别哭。那都是很久以前的事。她、她的孩子，还有她年轻的丈夫，如今一定早已在天堂团聚，快快乐乐地过了许多年。
        - id: ch01-b99
          speaker: elfrida
          text: 我喜欢这个故事，可它真的太伤心了，是不是？
          emotion: sad
        - id: ch01-b100
          speaker: edred
          text: 谢谢您把故事讲给我们听。不过这些事已经过去了那么久，所有事情也都彻底结束了。现在再为了它们难过，我觉得其实没有什么用。
        - id: ch01-b101
          speaker: elfrida
          text: 真希望我们能回到过去，替她找回那个孩子。
        - id: ch01-b102
          speaker: edred
          text: 我们要找的是宝藏。比尔先生，对不起，我们说了悄悄话。谢谢您的故事。对了，这附近从前属于阿登家的土地，现在归谁？
        - id: ch01-b103
          speaker: old_man
          text: 归那个杰克逊。他靠熬肥皂发了财，人称油脂大王。如今他有钱得看不上自己的房子，在约克郡买了更大的庄园。那里从前属于桑德斯特德公爵。听说阿登家的土地明年就要卖了。
        - id: ch01-b104
          speaker: edred
          text: 要是我们能找到宝藏，就能把那些土地全买回来了！我们可没忘记第一次说过的话。只要找到宝藏，就要让所有农舍都变得舒舒服服，还要给每一间屋子换上崭新的茅草屋顶。
        - id: ch01-b105
          speaker: old_man
          text: 好孩子，那就赶快去把宝藏找出来吧。就算最后找不到，也千万别难过。世上有许多帮助别人的办法，并不是非得先找到宝藏。勋爵大人，以后再来看看老比尔。下回您走到这边时，说不定我已经给您准备好一只白兔子了。
        - id: ch01-b106
          speaker: elfrida
          text: 他真是个可爱的老头儿。我想，等我们回到家，那些胶卷应该已经干了。不过也许还是等明天早晨，再开始印照片比较好。
        - id: ch01-b107
          speaker: edred
          text: 今天的光线很足呀。
        - id: ch01-b108
          speaker: elfrida
          text: 我说，你有没有留意画面里收藏宝藏时，我们身上穿的衣服？
        - id: ch01-b109
          speaker: edred
          text: 啊，别提了！霍尼塞特太太要是没有偏在那时开门，我们已经知道宝藏的准确位置。那些人把它抬进西塔楼了，对吧？
          emotion: angry
        - id: ch01-b110
          speaker: elfrida
          text: 我不敢肯定。
        - id: ch01-b111
          speaker: edred
          text: 画面要是继续，我们就会看见他们出来，那时一定能肯定。
        - id: ch01-b112
          speaker: elfrida
          text: 对。还有一件事。假如我们去阁楼的箱子里找，一定能找到画面里那种衣服。只要穿上它们，我们就会回到那里，亲自生活在那个年代。到时便能亲眼看着宝藏被人藏起来。这样一来，我们就真的会知道它在哪里了。
        - id: ch01-b113
          speaker: edred
          text: 顶呱呱，一等一，好极了！来，看谁先跑到大门！
          emotion: happy
        - id: ch01-b114
          speaker: narrator
          text: 他真的跟姐姐赛跑，还领先了足足三十只白鼹鼠精那么长的一段距离。
        - id: ch01-b115
          speaker: narrator
          text: 两个人已经很久没有吵过架了。当然，你得把火药阴谋冒险里的那些日子也算作时间。既然他们没有闹别扭，阁楼也就很容易找到了。他们再次站到一只只箱子中间。屋顶蒙着灰，一束束从缝里落下的阳光也像蒙着灰。头顶传来鸽爪走动的嗒嗒声，还有鸽子轻柔的咕咕低语。
        - id: ch01-b116
          speaker: elfrida
          text: 快来，我一看就能认出那套衣服。我的是斜肩蓝绸裙，你的是黑天鹅绒衣服，还有范戴克式衣领。
          emotion: happy
        - id: ch01-b117
          speaker: narrator
          text: 两个人一起掀开一只从没打开过的箱子。里面的衣服比先前见过的任何一件都要华贵。紧身上衣、斗篷和女式紧身胸衣上缀满金线刺绣与珠宝，摸起来硬挺挺的。可他们翻来翻去，也没找到斜肩蓝绸裙，更没有那套带范戴克式衣领的黑天鹅绒衣服。
        - id: ch01-b118
          speaker: edred
          text: 没关系。帮我把这些衣服压平，让箱盖好好关上。然后再试下一只。
        - id: ch01-b119
          speaker: narrator
          text: 埃德雷德伸出两条胳膊，一抱一抱地把华服塞回箱子，又请姐姐帮忙把衣服压平。可箱盖怎样也合不上。埃尔弗丽达只好把所有东西重新拿出来，再一件件仔细叠整齐。这一回，盖子轻轻松松便关好了。他们这才走到下一只箱子前。
        - id: ch01-b120
          speaker: elfrida
          text: 我心里有一种魔法感觉，衣服一定在这一只里。
          emotion: happy
        - id: ch01-b121
          speaker: narrator
          text: 那两套衣服也许真的就在里面，可两个孩子永远不会知道了，因为这只箱子偏偏上了锁。他们各自伸出两条胳膊，四条小胳膊一起使尽力气，又拉又抬，却没让箱盖挪动一根头发丝那么宽。
        - id: ch01-b122
          speaker: edred
          text: 真讨厌！再试下一只。
        - id: ch01-b123
          speaker: narrator
          text: 下一只也锁着。再下一只、后面一只、更后面一只，还是锁着。他们一路试下去。唉，事情的真相是，每一只箱子都已经锁住了。两个孩子站在一排紧闭的箱盖中间，彼此望着，脸上的神情简直跟绝望差不多。
        - id: ch01-b124
          speaker: edred
          text: 我现在活像一个束手无策的窃贼。
        - id: ch01-b125
          speaker: elfrida
          text: 我倒觉得快要想明白了。等一下，主意来了。我想，魔法只许我们去他们穿那些华丽金衣服的地方，所以装金衣服的箱子才打开，其他箱子全锁住。你明白吗？
        - id: ch01-b126
          speaker: edred
          text: 那就穿上金衣服出发。
        - id: ch01-b127
          speaker: elfrida
          text: 我不太想再遇上另一次伦敦塔。
        - id: ch01-b128
          speaker: edred
          text: 去哪里都不要紧。我已经发现，不管遇见什么，最后我们总能平安回来。而且沃尔特·雷利爵士说过，英国绅士除了上帝和自己的良心，什么也不该害怕。
        - id: ch01-b129
          speaker: elfrida
          text: 好吧。你也来帮忙开箱子。
        - id: ch01-b130
          speaker: narrator
          text: 埃德雷德当然伸手帮了。他把双手按在箱子上，用力往上拉。埃尔弗丽达也跟他一起拉。可刚才还敞开着、装满金色华服的箱子，如今跟其他所有箱子一样，盖得牢牢的，怎样也打不开。
        - id: ch01-b131
          speaker: edred
          text: 我们叫它耍啦！
        - id: ch01-b132
          speaker: narrator
          text: 这话非常粗俗，我可不知道他是从哪儿学来的。
        - id: ch01-b133
          speaker: elfrida
          text: 有机会时偏不要，想要时便得不到——哟。
        - id: ch01-b134
          speaker: narrator
          text: 这一句的来处，我倒知道。霍尼塞特太太给炉子擦黑时，常常唱这首老歌。
        - id: ch01-b135
          speaker: edred
          text: 今天只能放弃了。走吧，我们去印照片。
        - id: ch01-b136
          speaker: narrator
          text: 他把所有箱子重新试了一遍，直到手指都弄疼了，可每只箱盖依旧封得像蜡一样紧。胶卷也没有干透。你刚开始指望胶卷已经干透的时候，它们从来不会真的干透。于是孩子们只好从外面锁上蒸馏室，把钥匙挂到厨房烟囱高处的一颗钉子上。那一刻，霍尼塞特太太还不在厨房，可下一刻，她便匆匆走了进来。
        - id: ch01-b137
          speaker: mrs_honeysett
          text: 原来你们在这儿，我的小羊羔。回来得正好，惊喜就快到了。
        - id: ch01-b138
          speaker: elfrida
          text: 我差点忘了。现在应该有两个惊喜了吧？快告诉我们是什么。您要是知道今天发生的事，就明白我们多需要一个好惊喜了。
        - id: ch01-b139
          speaker: mrs_honeysett
          text: 你是说我打开那扇门吧。不错，真有两个。第一个是烤鸡，而且是晚餐吃的烤鸡。
        - id: ch01-b140
          speaker: edred
          text: 那么另一个我猜到了。伊迪丝姑妈要来。
        - id: ch01-b141
          speaker: narrator
          text: 她果然来了。就在埃德雷德说出这句话时，两个孩子从窗口望出去，看见伊迪丝姑妈的蓝裙子正越过山丘。姐弟俩立刻欢呼起来，转身冲出屋子，跑去迎接她。
        - id: ch01-b142
          speaker: narrator
          text: 大家吃完那只烤鸡以后，天色已经快黑了，睡觉时间也快到了。就在这时，伊迪丝姑妈忽然开了口。
        - id: ch01-b143
          speaker: aunt_edith
          text: 孩子们，我一直想告诉你们一件事。我犹豫了很久，可我们彼此之间不应该有秘密。
        - id: ch01-b144
          speaker: narrator
          text: 埃德雷德和埃尔弗丽达心虚地对看一眼。
        - id: ch01-b145
          speaker: edred
          text: 真正的秘密当然不行。不过魔法秘密可以保留吧？您不会介意吧？
        - id: ch01-b146
          speaker: aunt_edith
          text: 当然不介意。至于我要告诉你们的事，如果它是真的，那也有一点像魔法。可我现在还不知道，它究竟是不是真的。
        - id: ch01-b147
          speaker: narrator
          text: 姐弟俩并肩坐在宽窗座上。伊迪丝姑妈一边搂住一个，像是咽下了喉咙里的什么东西，又吸了吸鼻子。
        - id: ch01-b148
          speaker: elfrida
          text: 不会是坏消息吧？亲爱的姑妈，您别难过。千万别说有人发现阿登不是我们的，或者埃德雷德其实不是阿登勋爵，或者出了差不多的事。
          emotion: fearful
        - id: ch01-b149
          speaker: aunt_edith
          text: 埃德雷德，如果你不再是阿登勋爵，你真的会很在意吗？我这样问，是有原因的……
