  chapters:
    - id: ch01
      title: "CHAPTER XI. DEVELOPMENTS"
      blocks:
        - id: ch01-b01
          speaker: edred
          text: >-
            Come on. You measure the hypo and set out the four pie dishes. I'll fetch the water.
        - id: ch01-b02
          speaker: narrator
          text: >-
            With Mrs. Honeysett's help, Edred brought back two pails filled to the brim.
        - id: ch01-b03
          speaker: edred
          text: >-
            You won't come in for anything, will you, Mrs. Honeysett? If the door opens even a crack, every photograph will be ruined.
        - id: ch01-b04
          speaker: mrs_honeysett
          text: >-
            Law, love a duck! I won't come in. I've got no reason to come in for anything.
        - id: ch01-b05
          speaker: narrator
          text: >-
            Mrs. Honeysett held her broad waist in both hands as she said it. Once she had gone, Edred pushed the great wooden bolt home.
        - id: ch01-b06
          speaker: edred
          text: >-
            We'll bolt it anyway, in case she suddenly thinks of something. There. Now it'll be properly dark.
        - id: ch01-b07
          speaker: narrator
          text: >-
            Of course, it was not. Rooms have an aggravating habit of seeming dark until you need real darkness. Then they refuse. This room did not even try. Two heart-shaped holes high in the shutters let in dazzling light. Edred climbed onto the window seat, but first he had to unbolt the door and find some newspaper. He crushed it into the holes, pulled it, patted it, and packed it tight.
        - id: ch01-b08
          speaker: edred
          text: "There. Now it really will be dark."
        - id: ch01-b09
          speaker: narrator
          text: >-
            It still was not. Long dusty beams shone through cracks beside the shutter hinges, and newspaper could not stop them. Once again Edred opened the door and went in search of Mrs. Honeysett. He found her sitting on a low chair by the back door, plucking a white chicken. Soft white feathers floated around her, and their sight brought wonderful memories to Edred. He did not mention those memories.
        - id: ch01-b10
          speaker: edred
          text: >-
            I say, have you any old curtains? Thick ones would be best, but thin ones might do if they were red.
        - id: ch01-b11
          speaker: narrator
          text: >-
            Mrs. Honeysett put the chicken down among its feathers and opened a kitchen chest of drawers.
        - id: ch01-b12
          speaker: mrs_honeysett
          text: "Here you are."
        - id: ch01-b13
          speaker: narrator
          text: >-
            She gave him two old red velvet curtains. Off he went, and back he came almost at once.
        - id: ch01-b14
          speaker: edred
          text: "You haven't got a hammer, have you?"
        - id: ch01-b15
          speaker: narrator
          text: >-
            A dresser drawer supplied a hammer. Edred carried it away and returned almost immediately.
        - id: ch01-b16
          speaker: edred
          text: "I don't suppose you've any tacks?"
        - id: ch01-b17
          speaker: mrs_honeysett
          text: >-
            Seems to me there's not much sense in locking that still-room door from inside. It isn't me forever popping in. It's you forever popping out.
        - id: ch01-b18
          speaker: narrator
          text: >-
            She laughed, but handed him some rusty tacks twisted into damp paper. Edred hammered his fingers a great deal and the tacks only a little. At last, the tacks agreed to hold the curtain, or perhaps the curtain agreed to be held.
        - id: ch01-b19
          speaker: edred
          text: "And now it really is dark."
        - id: ch01-b20
          speaker: narrator
          text: >-
            He meant dark. It was not. A strip of light showed beneath the door through a gap so wide that Elfrida said you could almost crawl under it. That called for yet another curtain from Mrs. Honeysett. This time she told Edred to be off with his worrying and threw a handful of soft white feathers at him. Still laughing, she gave him the curtain. At last the room truly was dark. Then they opened the door again because Elfrida had forgotten where she put the matches.
        - id: ch01-b21
          speaker: narrator
          text: >-
            After so much preparation, the children had reached the very end of their patience. Everything seemed painfully slow. At last the lamp behind its red shade burned steadily, and the water in the four pie dishes looked pink beneath its strange glow.
        - id: ch01-b22
          speaker: edred
          text: "At least the hypo has had plenty of time to dissolve."
        - id: ch01-b23
          speaker: narrator
          text: >-
            They snipped with great care. Long curls of black paper gathered unnoticed around their legs.
        - id: ch01-b24
          speaker: edred
          text: >-
            I wish we had been born knowing photography, like the man who photographed you and Aunt Edith on the beach with the donkey.
        - id: ch01-b25
          speaker: narrator
          text: >-
            He spoke nervously as he drew the first film back and forth through the water in the first pie dish.
        - id: ch01-b26
          speaker: elfrida
          text: >-
            Mind there aren't any air bubbles! You might let me do part of it.
        - id: ch01-b27
          speaker: edred
          text: "You can do the next film."
        - id: ch01-b28
          speaker: narrator
          text: >-
            Edred could hardly breathe. Perhaps you know that dreadful moment when you lift a film from the hypo and nothing appears. You stare at the blank strip and begin to wonder. Did you forget to set the shutter? Did you somehow pick up a film that was never exposed? Your breath sticks in your throat. Your fingers turn clumsy, while the wet film feels more slippery than any film has a right to feel. There is nothing to do but lower it into the hypo once more. You draw it slowly through the bath again and again, wearing the outward calm of someone who has almost given up hope.
        - id: ch01-b29
          speaker: narrator
          text: >-
            Then you raise it to the red light once more, and at last you see something beginning to appear. Take every feeling from such a moment, multiply it by seven million, and add an unknown feeling unlike anything you have ever known. That may give you a faint idea of how Edred and Elfrida felt when pale gray patches began to form on the film.
        - id: ch01-b30
          speaker: narrator
          text: >-
            Yet no amount of multiplying could measure their delight when six perfect little pictures came clear. They showed Arden Castle three hundred years earlier, when the castle itself was perfect. Every wall and arch stood neat and sharp, without one broken arch or crumbling stone, exactly as the children had seen it in the past.
        - id: ch01-b31
          speaker: narrator
          text: >-
            The second film gave them six more flawless views of the old castle. The third developed just as well. But shortly before it was time to take that film from the hypo and wash it, a tiny white feather slipped from Edred's hair and fell into the dish. In the dim red light, he never saw it. It did not cling to the film or cause any of the ordinary trouble you might fear. Perhaps the feather caused what followed. I cannot say. I can only tell you what happened.
        - id: ch01-b32
          speaker: narrator
          text: >-
            The films had to be pinned up to dry. They fixed the first to the right panel of the door and the second to the left. Stone walls left no wooden place for the third film, the one beside which the feather had fallen. Only the shutters remained, so they pinned the film across them.
        - id: ch01-b33
          speaker: edred
          text: >-
            That won't matter. We needn't open the shutters before the film is dry.
        - id: ch01-b34
          speaker: narrator
          text: >-
            He fastened its four corners, then turned to put out the lamp and unbolt the door. In fact, he had forgotten to bolt the door after fetching the last curtain, so there was nothing to unbolt. But he could blow out the red lamp, and he did.
        - id: ch01-b35
          speaker: narrator
          text: >-
            Then the wonderful thing happened. After all their work, the room ought to have been black. Instead, the shuttered window showed as a broad shape of light. Remember, this was the window crossed by the film, the film beside which the white feather had fallen, and the feather had rested in Edred's hair while Mrs. Honeysett plucked her chicken. Now a faint sparkle moved within that light, like the flicker on a cinematograph screen just before the pictures begin.
        - id: ch01-b36
          speaker: elfrida
          text: "Oh, look at that!"
          emotion: surprised
        - id: ch01-b37
          speaker: narrator
          text: >-
            Elfrida reached for Edred's hand and caught his hair instead. She felt down his arm until she found the hand she wanted, then gripped it tightly.
        - id: ch01-b38
          speaker: edred
          text: "It's more magic. I do wish it wasn't."
        - id: ch01-b39
          speaker: elfrida
          text: "Hush! Look. Oh, look!"
          emotion: surprised
        - id: ch01-b40
          speaker: narrator
          text: >-
            The bright oblong changed. First came shapes, then figures, then movement. It had become a living picture. You might have compared it to a cinematograph, but it was much more like life itself. The shutters no longer seemed to be there. It was as if someone had opened the window and the children could look straight through it. Beyond lay a world of light, warm sunshine, blue sky, and all the movement of a place where things were truly happening.
        - id: ch01-b41
          speaker: narrator
          text: >-
            Arden Castle stood before them. Men carrying sacks crossed the drawbridge while a man under the great gateway directed them with his tall staff. A silver chain hung around his neck. Then a cart arrived loaded with casks. The men rolled them over the bridge and beneath the gate tower's high arch.
        - id: ch01-b42
          speaker: narrator
          text: >-
            The picture blinked and changed to a long indoor gallery. Pictures lined one wall and windows lined the other. A lady with long curls and a broad white collar, very like Aunt Edith, placed beautiful dresses in a chest. A long-haired gentleman, with lace at his collar and cuffs, packed gold and silver plates and jugs into another. Servants kept bringing them more splendid things.
        - id: ch01-b43
          speaker: narrator
          text: >-
            Edred and Elfrida did not say one word. They could not. What they saw was far too thrilling for speech. Yet the same words sounded silently in both their hearts. That was the treasure. At the same instant, the same hope came to both their minds. If only the living picture continued until the people finished hiding those chests, the children would see exactly where they went. Then they could visit the place for themselves and find the treasure at last.
        - id: ch01-b44
          speaker: narrator
          text: >-
            I suspect the white Mouldiwarp wanted to help. Perhaps it arranged the whole show so the children would learn where the treasure lay and stop calling it at every hour with poetry that even a mole could tell was not very good. Whatever the reason, the show was marvelous. Looking through a window into the past, you somehow noticed more than when you stood inside the past and had to take part in everything.
        - id: ch01-b45
          speaker: narrator
          text: >-
            There could be no doubt that this was the treasure. It was both plentiful and magnificent. The servants packed faster and faster. The lady grew paler, and the gentleman looked more anxious. A waiting woman emptied little boxes and bundles from her apron into the lady's nearly full chest.
        - id: ch01-b46
          speaker: narrator
          text: >-
            Suddenly the gallery door opened. Edred and Elfrida saw themselves walking toward the treasure and the hurried grown-ups. Their other selves wore blue silk and lace and black velvet. Fear, love, and wonder showed in their faces. The lady and gentleman were plainly their father and mother. They embraced the children, and though the watchers saw everyone speaking, they heard no sound.
        - id: ch01-b47
          speaker: narrator
          text: >-
            Edred would have given a whole year's pocket money to hear those words. Elfrida thought the father looked exactly like her own father, and like the father in the Tower who had reminded her of him.
        - id: ch01-b48
          speaker: narrator
          text: >-
            The children in the picture knelt. Their father placed his hands on their heads. In the dark still-room, Edred and Elfrida bowed their own heads because they understood. Elfrida even reached out halfway with her arms, but she could not touch them.
        - id: ch01-b49
          speaker: narrator
          text: >-
            The scene changed again. Four men carried one of the chests through a vaulted passage. They had passed ropes beneath it and looped them over their shoulders, but the weight still made them strain and stumble. Every so often, all four lowered the chest to the floor. They straightened their aching backs, stretched, and wiped the sweat from their faces before lifting it once more. The picture kept changing around them, so that the watching children seemed to travel beside the bearers. Together they went down a flight of stairs and entered a great, open hall. It was full of men, all talking at once and all busily working on pieces of armor and on great heavy boots.
        - id: ch01-b50
          speaker: narrator
          text: >-
            Next came a courtyard crowded with busy men. Some polished axes and weapons like spears. Others cleaned muskets, fitted fresh flints to pistols, or sharpened swords on a large grindstone. Edred would gladly have stayed to watch, but the scene hurried on. The bearers carried the chest beneath an arch. One wanted another rest. The others clearly answered that they were almost there, though the children could hear no words.
        - id: ch01-b51
          speaker: narrator
          text: >-
            Edred thought that now they would truly learn the hiding place. Elfrida squeezed his hand because she was thinking the same thing. The men stopped before a door. They knocked once, twice, and then a third time. Strangely, the children heard those knocks clearly, though the whole vision had been silent until then.
        - id: ch01-b52
          speaker: narrator
          text: >-
            The bearers set down the chest and looked at one another. One man drove his shoulder against the door. There came a crunch. The whole picture vanished. In its place were the shutters and the film stretched across them. Behind those stood the open door, and Mrs. Honeysett was saying that dinner, roast rabbit and a boiled hand of pork, would be cold unless they came at once.
        - id: ch01-b53
          speaker: elfrida
          text: "Oh, Mrs. Honeysett, that was too bad of you. It really was!"
          emotion: angry
        - id: ch01-b54
          speaker: mrs_honeysett
          text: >-
            I hope I haven't ruined the photographs. I knocked three times, but you were so quiet that I feared something had happened. I thought you might have poisoned yourselves without meaning to.
        - id: ch01-b55
          speaker: edred
          text: >-
            It is too bad. Much too bad. I don't want dinner. I don't want anything. Now everything is spoiled.
          emotion: angry
        - id: ch01-b56
          speaker: mrs_honeysett
          text: >-
            Maybe I should have knocked longer. Only I thought the door was bolted, after all the bolting you did at first. I tried the handle, and the door simply opened in my hand. Come along, lovey. Don't stay angry. I never meant any harm. I'll replace whatever was spoiled, and tomorrow you can take more pictures.
        - id: ch01-b57
          speaker: edred
          text: "You might have known we were perfectly all right."
          emotion: angry
        - id: ch01-b58
          speakers: [edred, elfrida]
          ensemble: duo
          text: "It wasn't the photographs that were spoiled."
        - id: ch01-b59
          speaker: mrs_honeysett
          text: >-
            Then what was it? And do come eat your dinner while it's hot, for goodness' sake.
        - id: ch01-b60
          speaker: elfrida
          text: >-
            It was another kind of picture, and it was such a pity.
          emotion: sad
        - id: ch01-b61
          speaker: mrs_honeysett
          text: >-
            Never mind, love. There's a lovely surprise coming later for good little girls and boys. And the rabbit would be stone cold if I hadn't put it in the oven when I came to fetch you. I knew what your hands would be like after all that messing with poison in dishes. If I were your aunt, I'd forbid it altogether. Now come wash your hands, and let's hear no more nonsense. Do you hear me?
        - id: ch01-b62
          speaker: narrator
          text: >-
            Mrs. Honeysett began that speech sweet and coaxing and ended it quite cross. She had talked herself into a temper. It is easily done. You may have done it yourself.
        - id: ch01-b63
          speaker: narrator
          text: >-
            Dinner was silent, the first silent meal since the children had come to Arden Castle. That alone will tell you how miserable they were. Edred felt as if every mouthful of rabbit might choke him. When he was offered a second helping of gooseberry pie, he refused it with complete and heartfelt sincerity. That tells you even more. Elfrida ate much less than usual too. Their disappointment was bitter. A few moments more might have shown them the hiding place they had searched for so long. They had come almost close enough to touch the answer, and then everything failed because they had forgotten to bolt the door that last time. Mrs. Honeysett could not know any of this. She thought they were sulking over some silly little matter, and when Edred refused the pie, the words nearly came out of her mouth.
        - id: ch01-b64
          speaker: narrator
          text: >-
            As Elfrida climbed down from her chair at the end of dinner, she noticed how unlike herself Mrs. Honeysett looked. She walked over very slowly. Then, all at once, she flung her arms around Mrs. Honeysett and kissed her.
        - id: ch01-b65
          speaker: elfrida
          text: >-
            I'm sorry we've been so piggy. It isn't your fault you're not clever enough to understand pictures and things, is it?
        - id: ch01-b66
          speaker: narrator
          text: >-
            From anyone else, that apology might have made matters worse. But Mrs. Honeysett was a perfect dear. She laughed and hugged Elfrida. Somehow Edred was swept into the hug and the laughter too, and all three were friends again. Outside, the sky was blue and the sun began to shine.
        - id: ch01-b67
          speaker: narrator
          text: >-
            Then the children walked down to old Beale's cottage. Summer had filled his garden since their last visit. Roses were blooming now, and white English flags, lupins, and tall foxgloves crowded the edges of the little brick path. Old Beale sat in the sun by his front door on what Edred carefully described as a brown Windsor chair. A wicker cage hung above his head, with a jackdaw sitting inside. At first Elfrida strongly disapproved. Then she saw that the little cage door stood wide open. The jackdaw stayed inside because it liked its seat, not because anyone forced it to remain. That made all the difference to Elfrida. Remember, she had once been shut inside the Tower of London. People who have known what prison feels like never enjoy seeing any living creature behind bars.
        - id: ch01-b68
          speaker: narrator
          text: >-
            A square-shaped tabby and white cat sat on the wooden doorstep. Country cottage cats do so often seem to be tabby, white, and square. Nearby, the feathery tail of a brown spaniel lazily brushed the paving stones in the water butt's patch of shade. It was a scene of perfect country peace, with old Beale asleep at its center.
        - id: ch01-b69
          speaker: narrator
          text: >-
            Lord Arden and his sister politely waited for him to wake by himself. They did not shout or rattle the smooth iron gate latch. They sat on the dry grassy bank opposite his garden and watched blue and white butterflies, flowers, and green potato leaves through the gray-green fence.
        - id: ch01-b70
          speaker: narrator
          text: >-
            As they waited, Elfrida had a sudden idea so good that she jumped. She said nothing about it.
        - id: ch01-b71
          speaker: edred
          text: >-
            Pinch the place hard. If the ant is still there, perhaps you'll kill it.
        - id: ch01-b72
          speaker: narrator
          text: >-
            Edred naturally thought an ant had bitten her. After watching the butterflies, the red roses, and all the growing green things, both children fixed their eyes on old Beale. As people generally do when someone watches them long and steadily enough, he woke. Trembling a little, he rose and touched his forehead.
        - id: ch01-b73
          speaker: old_man
          text: "My lord, you have come back."
        - id: ch01-b74
          speaker: elfrida
          text: >-
            How are you? We still haven't found the treasure.
        - id: ch01-b75
          speaker: old_man
          text: >-
            But you will. You will. Come inside now, unless you'd rather go round to the arbor and have some milk.
        - id: ch01-b76
          speaker: edred
          text: >-
            We'd just as soon stay here. Mrs. Honeysett says you know every story.
        - id: ch01-b77
          speaker: narrator
          text: >-
            They had come through the gate. Edred patted the brown spaniel while Elfrida stroked the square cat.
        - id: ch01-b78
          speaker: old_man
          text: >-
            Ah, Mrs. Honeysett is a fine girl. Her father had Sellinge Farm, where the fairies churn butter for a bride as long as nobody speaks a cross word. Those fairies can't often be overworked.
        - id: ch01-b79
          speaker: narrator
          text: >-
            Old Beale chuckled, then sighed.
        - id: ch01-b80
          speaker: old_man
          text: >-
            I know a powerful lot of tales, and I always know which one people have come to hear. You want the story of the East House, don't you? Has the old man guessed right, or are his wits failing?
        - id: ch01-b81
          speaker: edred
          text: >-
            We want to know why that part of the castle is shut up and left cobwebby, dusty, rusty, and musty. Is there any reason we couldn't clean it and make it pleasant again, if we found the treasure and could afford new carpets and curtains and things?
        - id: ch01-b82
          speaker: narrator
          text: >-
            Edred had settled companionably onto the paving stone beside the spaniel with the feathery tail.
        - id: ch01-b83
          speaker: old_man
          text: >-
            It's a sad story. It's meant for old folk, or middle-aged folk at least, not children. If I told you, likely as not you wouldn't understand.
        - id: ch01-b84
          speaker: elfrida
          text: "We like stories for grown-ups."
        - id: ch01-b85
          speaker: edred
          text: >-
            We can understand anything grown-ups understand if someone explains it properly. I understand gravity, and why the earth goes around the sun instead of the other way about. Aunt Edith explained it once, and I understood at once. I understand fixed stars, spectroscopes, microbes, and how the Equator isn't a real line. I understand heaps of things.
        - id: ch01-b86
          speaker: old_man
          text: >-
            Ah, you'll be bursting with book learning before you're twenty-one. I only hope half of it is true and those scholars aren't deceiving an innocent, trusting boy. I've never believed that tale about the sun standing still. You can see it moving with your own naked eyes any day of the week.
        - id: ch01-b87
          speaker: elfrida
          text: "You wouldn't deceive anyone. Please tell us the story."
        - id: ch01-b88
          speaker: narrator
          text: >-
            So old Beale began.
        - id: ch01-b89
          speaker: old_man
          text: >-
            It happened a long time ago, before even I was born, though not so long before that. I remember my father talking about it. He drove the castle coach when it all happened, and my mother kept house for the family and went through the whole business with them. So he knew everything there was to know.
        - id: ch01-b90
          speaker: old_man
          text: >-
            There was a Miss Elfrida then, just as there is now, only she was older than you are, missy. Young gentlemen came riding from near and far to court her. She was a true beauty, or so my father always said. Her hair was as black as coal. Her eyes were like the sea when a storm is gathering, just before the waves grow their white horses. I never saw her with my own eyes, mind you. She held her pretty head high and would not turn it one way or the other for any of those gentlemen. The old lord loved his daughter too dearly to push her into a marriage she did not want, especially while she was so young. So Miss Elfrida remained unmarried, and day after day she watched the sea.
        - id: ch01-b91
          speaker: edred
          text: "Why did she watch the sea?"
        - id: ch01-b92
          speaker: old_man
          text: >-
            She watched for her sweetheart's ship to come home. She had a sweetheart, right enough, though none of the family knew. He was her cousin Dick, and he was a proper good-for-nothing if ever there was one. The truth came out afterward. Dick and Elfrida had broken a sixpence between them, each keeping one half, and they had sworn always to be true. Then he sailed overseas to make his fortune. Miss Elfrida went to watch the sea every single day. And every single day passed without his ship coming home.
        - id: ch01-b93
          speaker: old_man
          text: >-
            Another young man rode over each day. He was handsome and rich, but much the same sort as Master Dick. His fortune merely kept his wild habits from showing as clearly as Dick's did.
        - id: ch01-b94
          speaker: elfrida
          text: "Poor Dick!"
          emotion: sad
        - id: ch01-b95
          speaker: old_man
          text: >-
            Not so fast, missy. Her mother and father told her she ought to marry the man who was there beside her and loved her. He was a Frewin, and his Christian name was Arnold. Miss Elfrida said no. But her parents kept saying yes, while Arnold kept begging her to agree. Little by little they wore her down. They told her Dick had surely drowned at sea, and said everything else they could think of to make her give up waiting.
        - id: ch01-b96
          speaker: old_man
          text: >-
            At last she agreed to marry Arnold, if he could bear marrying a girl whose whole heart was out at sea with the dead young man she had promised herself to. They planned the wedding for Christmas. Miss Elfrida slept in the East House room that faced Arden Knoll. The servants slept above in the attics, while her parents stayed in the other part of the house.
        - id: ch01-b97
          speaker: old_man
          text: >-
            One night, when everyone slept, she heard a tap against her window. At first she thought it was the ivy. Then it came again. She gathered her courage and went to look. A face waited outside. Someone had climbed the ivy, and it was her own true love, the man they had told her was drowned.
        - id: ch01-b98
          speaker: edred
          text: "How splendid!"
          emotion: happy
        - id: ch01-b99
          speaker: elfrida
          text: "But how dreadful for Mr. Frewin!"
        - id: ch01-b100
          speaker: old_man
          text: >-
            That's what she thought, miss. She could not face him. She put on her riding coat, climbed through the window, and went down the ivy with Dick. Then they fled to London. In the morning, the wedding bells rang and the bridegroom came, but there was no bride. She left a letter saying she was very sorry, but she had no other choice. After that, they shut the East House.
        - id: ch01-b101
          speaker: elfrida
          text: "So that's the story."
        - id: ch01-b102
          speaker: old_man
          text: "Only half of it, miss."
        - id: ch01-b103
          speaker: narrator
          text: >-
            Old Beale took out a black clay pipe and a twist of tobacco. He filled the pipe slowly and carefully, lit it, and then went on.
        - id: ch01-b104
          speaker: old_man
          text: >-
            They shut the East House where she had slept, though servants still went in to sweep it and keep away the dust. Her mother and father were brokenhearted. No letter came from Miss Elfrida. There was never a word to tell them where she had gone or whether she was well. If I understand a parent's heart at all, they must often have turned to one another and said that she might have trusted them. Their girl should have known that, in the end, they could never have denied her anything she truly wanted.
        - id: ch01-b105
          speaker: old_man
          text: >-
            Then, one night, someone knocked at the door. There stood the old Miss Elfrida, Mrs. Dick by then, with her baby in her arms. Mr. Dick had died suddenly in an accident, and she had come home to her mother and father. They could not do enough for the poor young widow and her baby. She moved back into her old rooms and slowly grew happier. She worshiped the baby, and her parents worshiped both of them.
        - id: ch01-b106
          speaker: old_man
          text: >-
            Then one night, someone climbed the ivy, just as Master Dick had once done. This time, the person did not take her. He took the baby.
        - id: ch01-b107
          speaker: elfrida
          text: "How dreadful! Did they ever get the baby back?"
          emotion: fearful
        - id: ch01-b108
          speaker: old_man
          text: >-
            Never. They did not find the baby, and no word ever came to explain who had taken the child. They never learned why it was done or where the baby had been carried. Then, only a week or two later, Mr. Frewin was killed out in the hunting field. As the others lifted him from the ground, he managed to say, “Elfrida. Tell Elfrida...” He struggled to finish. He was trying to tell them what message to carry to her, but death came before the rest of the words.
        - id: ch01-b109
          speaker: old_man
          text: >-
            Some people believe Mr. Frewin stole the baby to punish Elfrida for leaving him on their wedding day. Others think he meant to hide the child for a while, then pretend to find it. Perhaps he hoped her gratitude would make her marry him at last. But no one ever knew, and no one ever will. The baby's mother faded little by little until she was hardly more than a shadow. Then she died too. After that, the family shut the East House for good. No one lived there, no one kept it bright, and it slowly fell into the rot and ruin you see today.
        - id: ch01-b110
          speaker: old_man
          text: >-
            Don't cry, missy. I knew you wouldn't care for such a tale, though you insisted on hearing it. It all happened long ago. She, her baby, and her young husband have been happy together in heaven for many a year now, I reckon.
        - id: ch01-b111
          speaker: elfrida
          text: "I do like the story. But it is terribly sad, isn't it?"
          emotion: sad
        - id: ch01-b112
          speaker: edred
          text: >-
            Thank you for telling us. Still, I don't think it helps to be unhappy about things that happened so long ago and are completely over.
        - id: ch01-b113
          speaker: elfrida
          text: "I wish we could go into the past and find her baby."
          emotion: sad
        - id: ch01-b114
          speaker: edred
          text: >-
            We have to find the treasure. Excuse us for whispering, Mr. Beale. Thank you for the story. Oh, I meant to ask who owns the land around here now, the land that once belonged to the Ardens.
        - id: ch01-b115
          speaker: old_man
          text: >-
            That Jackson fellow owns it, the man who made his fortune boiling soap. They call him the Tallow King. But he's grown too rich for this house. He bought a larger place in Yorkshire that once belonged to the Duke of Sanderstead. I hear the Arden lands will be sold next year.
        - id: ch01-b116
          speaker: edred
          text: >-
            Oh, if only we could find the treasure and buy back the land! We haven't forgotten our first promise. If we found it, we'd make every cottage comfortable and put fresh thatch on every roof.
        - id: ch01-b117
          speaker: old_man
          text: >-
            That's a good lad. Make haste and find your treasure. But if you don't find it, don't fret. There are ways to help other folk without treasure. Come visit old Beale again, my lord. I shouldn't wonder if I had a white rabbit for you next time.
        - id: ch01-b118
          speaker: elfrida
          text: >-
            He is a dear old man. I think the films will be dry when we get home, but perhaps we shouldn't print them until tomorrow morning.
        - id: ch01-b119
          speaker: edred
          text: "There's plenty of light today."
        - id: ch01-b120
          speaker: elfrida
          text: "May I say something?"
        - id: ch01-b121
          speaker: edred
          text: "Well, what is it?"
        - id: ch01-b122
          speaker: elfrida
          text: >-
            Did you notice the clothes we were wearing in those pictures, when they were packing the treasure away?
        - id: ch01-b123
          speaker: edred
          text: >-
            Oh! If Mrs. Honeysett hadn't opened the door at that exact moment, we'd know where the treasure was. They were taking it to the West Tower, weren't they?
        - id: ch01-b124
          speaker: elfrida
          text: "I'm not certain."
        - id: ch01-b125
          speaker: edred
          text: >-
            If the picture had lasted, we would be certain. We'd have watched the men come out again.
        - id: ch01-b126
          speaker: elfrida
          text: "Yes. May I say something else?"
        - id: ch01-b127
          speaker: edred
          text: "Well, what is it?"
        - id: ch01-b128
          speaker: elfrida
          text: >-
            Suppose we search the chests until we find clothes like the ones we wore. Then we'd go back and live in that time. We could watch them hide the treasure ourselves, and this time we'd truly know the place.
        - id: ch01-b129
          speaker: edred
          text: "A1! First class! Absolutely ripping! Come on, I'll race you to the gate."
          emotion: happy
        - id: ch01-b130
          speaker: narrator
          text: >-
            Edred raced her and won by about thirty white Mouldiwarps' lengths. The two children had gone a surprisingly long time without a quarrel, if you count the days they spent inside the Gunpowder Plot adventure as ordinary time. That meant the hidden attic was easy to find. Soon they stood once more among the old chests. Dust covered the sloping roof. Dust floated in the shafts of sunlight. Above their heads came the little clitter of pigeon feet and the pigeons' soft, comfortable noises.
        - id: ch01-b131
          speaker: elfrida
          text: >-
            Come on! I'll know my dress as soon as I see it. Mine was blue silk with sloping shoulders. Yours was black velvet with a Vandyke collar.
          emotion: happy
        - id: ch01-b132
          speaker: narrator
          text: >-
            Together they threw open the lid of a chest they had never searched. Inside lay clothes far richer than anything they had found before. Doublets, cloaks, and bodices were so thickly worked with golden embroidery and gems that the cloth had grown almost stiff. They searched through all that splendor. Yet nowhere was there a blue silk dress with sloping shoulders. Nor could they find a black velvet suit with the wide white points of a Vandyke collar.
        - id: ch01-b133
          speaker: edred
          text: >-
            Never mind. Help me press these things down so we can close the lid. Then we'll try the next chest.
        - id: ch01-b134
          speaker: narrator
          text: >-
            Edred pushed the magnificent clothes back by the armful, but the lid refused to close. Elfrida had to take everything out and fold each piece properly. Then it shut with ease. They moved on.
        - id: ch01-b135
          speaker: elfrida
          text: "I've a magic feeling inside that our clothes are in this one."
          emotion: happy
        - id: ch01-b136
          speaker: narrator
          text: >-
            They may have been. The children never found out, because that chest was locked. Four small arms pulled with all their strength and could not lift the lid even the width of a hair.
        - id: ch01-b137
          speaker: edred
          text: "Oh, bother. We'll try another."
        - id: ch01-b138
          speaker: narrator
          text: >-
            The next chest was locked too. So was the one beside it. They moved from chest to chest, pulling at every lid they could reach. The next was locked, and the next, and the one beyond that. At last they had tried them all. Every single chest was fastened tight, and the children could only stand among them and stare at each other in something very like despair.
        - id: ch01-b139
          speaker: edred
          text: "I feel like a burglar who's been thoroughly beaten."
        - id: ch01-b140
          speaker: elfrida
          text: >-
            I feel as though I'm just about to understand something. Wait. It's coming. I think it means we have to go wherever we wore those grand, stiff, golden clothes. That's why their chest opened and all the others locked. Don't you see?
        - id: ch01-b141
          speaker: edred
          text: "Then let's put the clothes on and go."
        - id: ch01-b142
          speaker: elfrida
          text: "I'm not sure I want another visit to the Tower of London."
        - id: ch01-b143
          speaker: edred
          text: >-
            I don't care where we go. I've learned one thing. Whatever happens, we always come safely out of it. Besides, an English gentleman must fear nothing except God and his own conscience.
        - id: ch01-b144
          speaker: narrator
          text: >-
            His many talks with his good friend Sir Walter Raleigh had brought that last thought to mind.
        - id: ch01-b145
          speaker: elfrida
          text: "All right. You might help me lift the lid."
        - id: ch01-b146
          speaker: narrator
          text: >-
            Edred tried. He took hold of the chest, Elfrida pulled with him, and neither could move the lid. The one chest that had opened before was now as firmly shut as all the rest.
        - id: ch01-b147
          speaker: edred
          text: "Done in the eye!"
        - id: ch01-b148
          speaker: narrator
          text: >-
            It was a very vulgar expression, and I cannot imagine where Edred learned it.
        - id: ch01-b149
          speaker: elfrida
          text: >-
            He that will not when he may, he shall not when he would.
        - id: ch01-b150
          speaker: narrator
          text: >-
            I do know where Elfrida learned that. It came from an old song Mrs. Honeysett sang while she blacked the stoves.
        - id: ch01-b151
          speaker: edred
          text: >-
            I suppose we'll have to give it up for today. Come on. We'll print the photographs.
        - id: ch01-b152
          speaker: narrator
          text: >-
            Edred had tried every chest again until his fingers hurt. Not one would open. And the films were not dry enough to print. Films never are when you expect them to be. So the children locked the still-room from the outside and hung its key from a nail high inside the kitchen chimney. Mrs. Honeysett was away from the kitchen just then, but she hurried in a moment later.
        - id: ch01-b153
          speaker: mrs_honeysett
          text: "Here you are, my lambs, and just in time for the surprise."
          emotion: happy
        - id: ch01-b154
          speaker: elfrida
          text: >-
            Oh, I'd forgotten the surprise. That makes two things forgotten today, doesn't it? Please tell us what it is. If you only knew, we need a lovely surprise after everything that's happened.
        - id: ch01-b155
          speaker: mrs_honeysett
          text: >-
            Ah, you mean because I opened that door. Well, there are two surprises. One is roast chicken for supper.
        - id: ch01-b156
          speaker: edred
          text: "Then I know the other one. Aunt Edith is coming!"
        - id: ch01-b157
          speaker: narrator
          text: >-
            He was right. Aunt Edith truly was coming. At that very moment, as the children looked through the window, a spot of blue appeared over the hill. It was Aunt Edith's dress. The moment they recognized her, they rushed from the kitchen and tore joyfully up the path to meet her.
        - id: ch01-b158
          speaker: narrator
          text: >-
            After the roast chicken, when darkness was near and bedtime was not far away, Aunt Edith suddenly spoke.
        - id: ch01-b159
          speaker: aunt_edith
          text: >-
            Children, there's something I need to tell you. I've hesitated for a long time, but I don't think we should keep secrets from one another.
        - id: ch01-b160
          speaker: narrator
          text: >-
            Edred and Elfrida exchanged guilty looks.
        - id: ch01-b161
          speaker: edred
          text: >-
            Not real secrets, of course. But you don't mind us having magical secrets, do you?
        - id: ch01-b162
          speaker: aunt_edith
          text: >-
            Of course I don't. What I have to tell you is a little like magic too, if it's true. I don't know yet whether it is.
        - id: ch01-b163
          speaker: narrator
          text: >-
            The children sat beside her on the broad window seat. Aunt Edith put one arm around each of them. Then she swallowed hard and sniffed.
        - id: ch01-b164
          speaker: elfrida
          text: >-
            Oh, it isn't bad news, is it? Darling Auntie, please don't be miserable. Don't tell us someone has discovered Arden isn't ours, or that Edred isn't truly Lord Arden, or anything like that.
          emotion: fearful
        - id: ch01-b165
          speaker: aunt_edith
          text: >-
            Would it trouble you very much if you weren't Lord Arden, Edred? I have a reason for asking.
