  chapters:
    - id: ch01
      title: "CHAPTER VI. THE SECRET PANEL"
      blocks:
        - id: ch01-b01
          speaker: elfrida
          text: "Where can we hide him?"
        - id: ch01-b02
          speaker: narrator
          text: >-
            Elfrida could hardly wait for an answer. Her excitement caught Cousin Bet too. Bet sprang up and felt among the carved flowers over the fireplace.
        - id: ch01-b03
          speaker: cousin_bet
          text: >-
            We'll use the secret room. First slide the bolt and lock the door.
        - id: ch01-b04
          speaker: narrator
          text: >-
            Elfrida obeyed. When she turned around, the carved mantelpiece was opening like a cupboard door. She ran to the window and flung the casement wide. The beautiful gentleman climbed in, tall and handsome, and bowed to Miss Betty. She dropped to her knees and kissed the white, jeweled hand he offered her.
        - id: ch01-b05
          speaker: elfrida
          text: "Quick, get into that opening!"
        - id: ch01-b06
          speaker: cousin_bet
          text: "There are steps inside."
        - id: ch01-b07
          speaker: narrator
          text: >-
            Betty snatched up a candle in its silver holder and raised it over her head. The Chevalier St. George sprang onto a chair, braced one knee against the mantelpiece, and slipped through the opening. He looked just like Alice going through the looking-glass in Mr. Tenniel's picture. Betty held up the candle, and his white hand reached down to take it. Then Elfrida leaped onto the chair and pulled the panel shut. She jumped down, hurried across the room, and unlocked the door. She opened it at the very moment the maid reached the other side with the supper tray.
        - id: ch01-b08
          speaker: narrator
          text: >-
            Once the cousins were alone, Bet threw her arms around Elfrida.
        - id: ch01-b09
          speaker: cousin_bet
          text: >-
            Don't be frightened, little cousin. I shall protect you from any harm that comes of this adventure.
          emotion: calm
        - id: ch01-b10
          speaker: elfrida
          text: >-
            Really! I was the one who let him in, and you would have screamed the whole house awake if I hadn't stopped you.
        - id: ch01-b11
          speaker: cousin_bet
          text: >-
            Hush your chatter, child. I must work out how best to serve my King.
        - id: ch01-b12
          speaker: narrator
          text: >-
            Bet drew a troubled hand across her pretty forehead.
        - id: ch01-b13
          speaker: elfrida
          text: >-
            If it were me, I'd give him some supper and make sure his bed was aired. But I suppose that's much too ordinary for you.
        - id: ch01-b14
          speaker: narrator
          text: >-
            The cousins stared at each other over their untouched meal.
        - id: ch01-b15
          speaker: cousin_bet
          text: "You impertinent little chit!"
          emotion: angry
        - id: ch01-b16
          speaker: elfrida
          text: "You're a chit yourself."
        - id: ch01-b17
          speaker: narrator
          text: "Then Elfrida laughed."
        - id: ch01-b18
          speaker: elfrida
          text: >-
            Come on, Cousin Bet. Your uncle is away, and you're the grown-up. Be wise and splendid. Then they'll put your portrait in the illustrated Christmas papers, all white satin and anxious looks. Underneath they'll print, “The savior of her King.”
        - id: ch01-b19
          speaker: cousin_bet
          text: >-
            Do not ramble, child. I have worries enough already. If you mean to beg my pardon, then do it.
        - id: ch01-b20
          speaker: narrator
          text: "Bet pressed one hand to her forehead."
        - id: ch01-b21
          speaker: elfrida
          text: >-
            Oh, very well. I beg your pardon. There! Now will you please feed your King?
        - id: ch01-b22
          speaker: cousin_bet
          text: >-
            Carry a tray through that hole? What if a servant walks in? What could I possibly tell them?
        - id: ch01-b23
          speaker: elfrida
          text: "Fine. I'll take it myself."
        - id: ch01-b24
          speaker: narrator
          text: >-
            Elfrida was delighted to have the chance. Bet pressed the hidden spring. Elfrida climbed easily into the dark opening, and Bet passed her the supper tray.
        - id: ch01-b25
          speaker: elfrida
          text: >-
            Oh, bother. This is too heavy. He'll have to come down for it. Give me a candle, close the panel, and tell me where to go.
        - id: ch01-b26
          speaker: narrator
          text: "She promptly put the tray down at her feet."
        - id: ch01-b27
          speaker: cousin_bet
          text: >-
            Turn right and climb the steps. And remember, kneel and kiss his hand before you speak.
        - id: ch01-b28
          speaker: narrator
          text: >-
            Elfrida reached down for the candle in its silver holder. The panel closed behind her with a click. She stood among the cobwebby shadows of the secret passage, holding the small light in one hand, while the heavy supper tray waited at her feet.
        - id: ch01-b29
          speaker: elfrida
          text: "It's only a Mouldiwarp magic adventure."
        - id: ch01-b30
          speaker: narrator
          text: >-
            She said that to give herself courage. Then she turned right and climbed the steep, narrow stairs. At the top, a thin line of light showed around a door left slightly open. Knocking did not seem wise, so she put her lips near the light and spoke softly.
        - id: ch01-b31
          speaker: elfrida
          text: "It's me."
        - id: ch01-b32
          speaker: narrator
          text: >-
            The door opened at once, and the beautiful gentleman stood before her. The secret room held a couch, a table, and several chairs. They were all old-fashioned, but even by the light of two candles their shapes were beautiful.
        - id: ch01-b33
          speaker: elfrida
          text: >-
            Your supper is at the foot of the stairs. I couldn't carry the tray. Would you fetch it?
        - id: ch01-b34
          speaker: edward_talbot
          text: "I will, if you light the way."
        - id: ch01-b35
          speaker: narrator
          text: >-
            He brought the tray up, and Elfrida guided him back. When he had placed it on the table, he turned to her.
        - id: ch01-b36
          speaker: edward_talbot
          text: "Will you stay and share my supper?"
        - id: ch01-b37
          speaker: elfrida
          text: >-
            I mustn't. Cousin Bet is such a muff. If the servants come, she won't know what to say about where I am. Oh! I forgot. She told me to kneel and kiss your hand before mentioning supper. I'll do it now.
        - id: ch01-b38
          speaker: edward_talbot
          text: >-
            No, little lady. I shall kiss your cheek and drink to the man who may kiss your lips when you are seventeen and I am... what was it? Five hundred?
        - id: ch01-b39
          speaker: elfrida
          text: >-
            Two hundred and thirty. You really are nice. I wish you were real. I should go back to Bet now.
        - id: ch01-b40
          speaker: narrator
          text: "She returned his kiss in the friendliest way."
        - id: ch01-b41
          speaker: edward_talbot
          text: "You wish I were real?"
          emotion: surprised
        - id: ch01-b42
          speaker: elfrida
          text: "Oh, I'm talking nonsense. I'll go."
        - id: ch01-b43
          speaker: edward_talbot
          text: >-
            An empty place at the table will betray you. I'll put the food and wine here, then carry the tray down. You have a conspirator's courage, but not all her cunning.
        - id: ch01-b44
          speaker: narrator
          text: "He began unloading the tray."
        - id: ch01-b45
          speaker: elfrida
          text: >-
            How long will you stay? I suppose you're running away from someone, the way people do in history.
        - id: ch01-b46
          speaker: edward_talbot
          text: >-
            Not long. But if anyone asked whether you had seen the King, what answer would you give?
        - id: ch01-b47
          speaker: elfrida
          text: >-
            I'd say no. I can't truly know you're the King. You've only told me you are. Perhaps you aren't one after all.
        - id: ch01-b48
          speaker: edward_talbot
          text: "Wonderful! Then you don't believe me?"
        - id: ch01-b49
          speaker: elfrida
          text: "Oh, I do believe you. I just don't have to."
        - id: ch01-b50
          speaker: edward_talbot
          text: >-
            By my life! I wish I were. Someone would earn a coronet.
        - id: ch01-b51
          speaker: elfrida
          text: "You wish you were what?"
        - id: ch01-b52
          speaker: edward_talbot
          text: >-
            Safely away, little lady. As for coronets, the jewels are safe. Look, I put them in that corner cupboard.
        - id: ch01-b53
          speaker: narrator
          text: >-
            And there they were, safely hidden in the corner cupboard. He carried the tray downstairs. Elfrida, who was very hungry by now, tried to persuade Bet to eat with her. At any moment, she said, some brave and dangerous deed might be required. Bet would need to keep up her strength.
        - id: ch01-b54
          speaker: cousin_bet
          text: >-
            I cannot swallow one bite. And I will not go to bed. I know my duty to my King. If I must, I shall defend my Sovereign with my life!
        - id: ch01-b55
          speaker: narrator
          text: >-
            A tremendous knocking at the castle door shattered the quiet night. Then a man's heavy voice rang through the house.
        - id: ch01-b56
          speaker: fitzgerald
          text: "Open the door in the Queen's name!"
        - id: ch01-b57
          speaker: cousin_bet
          text: >-
            They've found him! Everything is lost! Someone has betrayed us! What can we do?
          emotion: fearful
        - id: ch01-b58
          speaker: elfrida
          text: "Eat. Eat as if your life depended on it."
        - id: ch01-b59
          speaker: narrator
          text: >-
            Elfrida pushed Bet into a chair, set a plate before her, and dropped a piece of meat pie onto it. She put another piece on her own plate.
        - id: ch01-b60
          speaker: elfrida
          text: >-
            Fill your mouth so you can't answer. That will give you time to think.
        - id: ch01-b61
          speaker: narrator
          text: >-
            Elfrida filled her own mouth as she whispered. The door opened, and gentlemen in riding clothes poured into the room. Every one of them wore a stern face and carried a sword. Bet's mouth was full, and she was trying desperately not to glance at the panel. Elfrida's mouth was just as full. She looked straight at the gentleman who seemed to lead the others.
        - id: ch01-b62
          speaker: elfrida
          text: "This is a fine hour to come banging on people's doors!"
        - id: ch01-b63
          speaker: fitzgerald
          text: >-
            A loyal subject cares nothing for the hour. Is anyone strange staying beneath your roof tonight?
        - id: ch01-b64
          speaker: narrator
          text: >-
            He was a round, stout gentleman in green, with blue eyes.
        - id: ch01-b65
          speaker: cousin_bet
          text: "Oh, everything is lost!"
          emotion: fearful
        - id: ch01-b66
          speaker: narrator
          text: >-
            The gentlemen looked at one another and closed in around her.
        - id: ch01-b67
          speakers: [fitzgerald, plum_gentleman, gentleman_one, gentleman_two]
          ensemble: chorus
          text: >-
            Then you do have a stranger here! Where is he? You cannot refuse to surrender him.
        - id: ch01-b68
          speaker: cousin_bet
          text: >-
            I knew it in my heart. I knew he was the man you wanted.
        - id: ch01-b69
          speaker: narrator
          text: >-
            With that, Bet fainted gracefully into the arms of the nearest gentleman. He wore plum-colored clothes and seemed to be wrestling with an urge to laugh.
        - id: ch01-b70
          speaker: fitzgerald
          text: "Question the child. Children and fools tell the truth."
        - id: ch01-b71
          speaker: narrator
          text: >-
            Someone lifted Elfrida onto the table. From there she could see over the ring of gentlemen. Bet lay on the sofa, while servants crowded into the open doorway, watching and listening.
        - id: ch01-b72
          speakers: [fitzgerald, plum_gentleman, gentleman_one, gentleman_two]
          ensemble: chorus
          text: "Now tell us the truth, little miss."
        - id: ch01-b73
          speaker: elfrida
          text: >-
            What exactly do you want to know? I won't tell you anything unless you send the servants away.
        - id: ch01-b74
          speaker: narrator
          text: >-
            She lowered her voice for the second sentence. The gentlemen had the servants sent away, and the crowded doorway emptied. Once the door was firmly closed, they turned back to the child on the table and demanded the truth again.
        - id: ch01-b75
          speaker: elfrida
          text: "Then please tell me what you want to know."
        - id: ch01-b76
          speaker: fitzgerald
          text: "Is any stranger spending the night here?"
        - id: ch01-b77
          speaker: elfrida
          text: "No, there isn't."
        - id: ch01-b78
          speaker: narrator
          text: >-
            She knew the beautiful gentleman was sitting at his supper, not lying down.
        - id: ch01-b79
          speaker: plum_gentleman
          text: >-
            But Miss Arden cried that all was lost. She said she knew he was the man we sought.
        - id: ch01-b80
          speaker: elfrida
          text: >-
            Well, this is what happened. A highwayman robbed us today, and I think the shock upset my cousin. She is rather easy to upset.
        - id: ch01-b81
          speakers: [fitzgerald, plum_gentleman, gentleman_one]
          ensemble: chorus
          text: "Very easy indeed."
        - id: ch01-b82
          speaker: narrator
          text: "Someone called the whole affair harebrained."
        - id: ch01-b83
          speaker: plum_gentleman
          text: "Let us take the shortest path. Is Sir Edward Talbot here?"
        - id: ch01-b84
          speaker: elfrida
          text: >-
            No, he isn't. And you have no right to burst into people's homes and frighten them into fainting. I'll tell Lord Arden when he returns. So there.
        - id: ch01-b85
          speaker: gentleman_one
          text: >-
            Zounds, this child has spirit! And she is right, too, strike me if she isn't.
        - id: ch01-b86
          speaker: gentleman_two
          text: >-
            But we are only guarding Lord Arden's house while he is away!
        - id: ch01-b87
          speaker: elfrida
          text: >-
            If you think this Talbot is hiding here, and if he has done something wrong, you may search for him. But Lord Arden won't like it. And now I'd like to get down, please.
        - id: ch01-b88
          speaker: narrator
          text: >-
            I cannot say whether Elfrida would have dared to speak so boldly if she had not remembered that this was history-time, not now-time. Whatever gave her courage, the gentlemen seemed delighted with it. They lifted her carefully from the table and set her on the floor. After offering the ladies many apologies for causing them trouble, they filed out of the room and left the castle. Elfrida stood listening at the window. She heard their laughing voices, the scrape and clatter as they mounted, and the stamp of their horses' hooves before they rode away. Every one of them seemed to be laughing. She felt as though she were moving through the middle of a mystery.
        - id: ch01-b89
          speaker: narrator
          text: >-
            She could not go back to her own time before learning how the adventure ended. That night she shared a great four-poster bed with Cousin Bet. Bet's faint lasted precisely as long as the strangers remained in the house, and not a moment longer. That was very convenient.
        - id: ch01-b90
          speaker: narrator
          text: >-
            Elfrida woke extremely early and crept down to the parlor. She had planned to visit the King, see how he was, and ask whether he wanted hot water for shaving first thing in the morning. Her father had always wanted his. Still, this was very, very early. Perhaps the King was asleep. Elfrida knew from experience that sleepy people did not always feel grateful when someone appeared too soon with their shaving water.
        - id: ch01-b91
          speaker: narrator
          text: >-
            So she went out into the fields instead. Gray dew lay over the grass as she climbed Arden Knoll. She stood there listening to the skylarks and looking back at the castle. Around the part where people still lived, the mortar looked surprisingly new. After a while, she spotted two figures coming across the fields. Behind them, the spire of Arden Church rose from treetops as round and green as the finest double-curled parsley. One gentleman wore a green coat. The other wore a purple one. Elfrida thought how convenient it was that, in those days, the color of a person's clothes could tell you who he was from half a mile away.
        - id: ch01-b92
          speaker: narrator
          text: >-
            The men were plainly heading for the castle, so she walked down and met them at the gate.
        - id: ch01-b93
          speaker: elfrida
          text: "Good morning."
        - id: ch01-b94
          speaker: fitzgerald
          text: >-
            At least you are no sleepyhead. And no stranger lay at Arden last night, you say?
        - id: ch01-b95
          speaker: narrator
          text: >-
            That was harder to answer. The King had surely lain in the secret chamber and might be lying there still. Yet he was the King, so how could he be a stranger?
        - id: ch01-b96
          speaker: elfrida
          text: "No, there wasn't."
        - id: ch01-b97
          speaker: narrator
          text: >-
            Just then, a riding boot came through the open parlor window. A second boot followed, and then the whole beautiful gentleman dropped out in front of them.
        - id: ch01-b98
          speaker: edward_talbot
          text: "So-ho! Keep your voices down. The servants aren't awake yet."
        - id: ch01-b99
          speaker: elfrida
          text: >-
            They are awake, but they're at the back. Stay close to the wall and you can get away unseen.
        - id: ch01-b100
          speaker: edward_talbot
          text: >-
            Such excellent advice again! Come with us, little maid. I keep no secrets from you.
        - id: ch01-b101
          speaker: narrator
          text: >-
            With a graceful bow, he led them creeping beside the castle wall. They stopped at the corner where the sea appeared between two broad shoulders of downland.
        - id: ch01-b102
          speaker: edward_talbot
          text: >-
            The wager is mine, though you did your best to spoil it. Our bargain said nothing about you storming Arden at nine at night and hunting me out like a pack of hounds after a fox, Fitzgerald.
        - id: ch01-b103
          speaker: fitzgerald
          text: >-
            Nothing in the wager forbade it. We tried to stop you on the road, but you arrived an hour too soon.
        - id: ch01-b104
          speaker: edward_talbot
          text: >-
            Ah, setting clocks back is simple. And the stableman at the Bull loves a handsome wager almost as much as he loves a guinea.
        - id: ch01-b105
          speaker: elfrida
          text: "I wish somebody would explain!"
        - id: ch01-b106
          speaker: narrator
          text: "She almost stamped with impatience."
        - id: ch01-b107
          speaker: edward_talbot
          text: "And I shall, my pretty one."
        - id: ch01-b108
          speaker: narrator
          text: "He laughed."
        - id: ch01-b109
          speaker: elfrida
          text: "But aren't you the King? You told me you were."
        - id: ch01-b110
          speaker: edward_talbot
          text: >-
            Not quite so fast. I asked what you would say if I told you I was King James.
        - id: ch01-b111
          speaker: elfrida
          text: "Then who are you?"
        - id: ch01-b112
          speaker: edward_talbot
          text: "Plain Sir Edward Talbot, Baronet, at your ladyship's service."
        - id: ch01-b113
          speaker: narrator
          text: "He gave her another magnificent bow."
        - id: ch01-b114
          speaker: elfrida
          text: >-
            I still don't understand. Please tell me everything from the beginning.
        - id: ch01-b115
          speaker: narrator
          text: >-
            So Talbot explained while the other gentlemen stood laughing nearby.
        - id: ch01-b116
          speaker: edward_talbot
          text: >-
            The other night, I was dining with Mr. Fitzgerald here. Our talk wandered to highway robbery, Arden Castle, and several other matters. These gentlemen and some other friends offered me a wager of five hundred guineas. They said I would not dare to rob a coach, and I accepted their challenge. Then I added a wager of my own. I promised that the coach I robbed would be carrying the Arden jewels. I would take those jewels, spend a night here at Arden, and never let anyone in the house discover my name. Well, I robbed the coach, took the jewels, and passed the night beneath this roof without being recognized. I have fulfilled all three parts, and the wager is mine. I only recently returned from foreign lands, so your cousin had never seen my face. But zounds, child, if not for you, I would have lost! I had counted on Miss Arden's help. Instead, I found a pale-faced fine lady who fainted and was no use at all. You are a girl in a thousand. Next time I go to London, I shall find the finest fairing there and buy it for you. We are all friends. Tell your pretty cousin to hold her tongue, and none of us will let the story go any further.
        - id: ch01-b117
          speaker: elfrida
          text: >-
            But all these gentlemen came last night. The servants know about that.
        - id: ch01-b118
          speaker: edward_talbot
          text: >-
            Why, they came to protect Miss Arden, in case the dreadful highwayman had hidden behind her curtains. What a wise child you are! You find every crack in our armor.
        - id: ch01-b119
          speaker: narrator
          text: >-
            Talbot told his friends the whole adventure. Though they had lost their wager, they laughed merrily. Then they went across the dewy fields to breakfast.
        - id: ch01-b120
          speaker: elfrida
          text: >-
            It was nice of him to call me brave. But I do wish he had truly been the King.
        - id: ch01-b121
          speaker: narrator
          text: >-
            Elfrida went back and told Betty everything that had happened. As soon as the story was over, the whole adventure seemed to have lost its shine. She no longer cared to remain in that part of the past. She raced upstairs, crossed the attic among the noises of the pigeons, and came out again in her own time. Edred was exactly where she had left him, perched on the second hand of the daisy clock. He refused to believe she had gone anywhere. To him, all the time she had spent on horseback, at supper, in bed, and out on the knoll had been no time at all, because he had spent it sitting on the hand that counted the seconds.
        - id: ch01-b122
          speaker: narrator
          text: >-
            When the Mouldiwarp ordered the children to go along in, they did the opposite. They went outside and around the castle wall to the corner overlooking the sea. They stretched out on the warm grass, and Elfrida told Edred everything. At first he believed none of it.
        - id: ch01-b123
          speaker: elfrida
          text: >-
            It is true! Do you really think I could invent a whole story like that?
        - id: ch01-b124
          speaker: edred
          text: >-
            No, of course not. You aren't clever enough. But perhaps you read it in a book.
        - id: ch01-b125
          speaker: elfrida
          text: "Well, I didn't. So there!"
        - id: ch01-b126
          speaker: edred
          text: >-
            If it truly happened, you should have come back for me. You know I've always wanted to meet a highwayman.
        - id: ch01-b127
          speaker: elfrida
          text: >-
            How could I? Was I supposed to jump off the horse, run home through the chests and the pigeon noises, come out here, and take you back? Talbot would have disappeared before we returned.
        - id: ch01-b128
          speaker: edred
          text: >-
            No, he wouldn't. I was stopping the clock by sitting on it. No time passed while you were gone, if you really were gone.
        - id: ch01-b129
          speaker: elfrida
          text: "Time passed for me. Don't you see?"
        - id: ch01-b130
          speaker: edred
          text: >-
            It wouldn't have passed if you had come back to where I was.
        - id: ch01-b131
          speaker: elfrida
          text: >-
            How can you be so irritating? You cannot truly be that stupid.
          emotion: angry
        - id: ch01-b132
          speaker: narrator
          text: "Elfrida felt her temper slipping away."
        - id: ch01-b133
          speaker: edred
          text: >-
            Can't I? I can be much stupider if I choose. Just wait.
        - id: ch01-b134
          speaker: elfrida
          text: "Edred, sometimes I feel I have to shake you."
          emotion: angry
        - id: ch01-b135
          speaker: edred
          text: "You wouldn't dare."
        - id: ch01-b136
          speaker: elfrida
          text: "Are you daring me?"
        - id: ch01-b137
          speaker: edred
          text: "Yes, I dare you!"
          emotion: angry
        - id: ch01-b138
          speaker: narrator
          text: >-
            Of course, you understand that after a dare like that, every law of family life required Elfrida to shake him. So she did. Then she burst into tears. Edred looked at her for a moment, and then... but no. Tears are not considered manly, and I would never betray such a weakness in my hero. Let us draw a veil over what followed. Better still, let us take a turn around the castle and come back when the worst is over.
        - id: ch01-b139
          speaker: narrator
          text: >-
            We left at the right moment, because the scene was most unpleasant. When we return, the crying has not quite stopped. Elfrida is apologizing and hunting for her handkerchief so she can lend it to Edred, whose own has somehow gone missing.
        - id: ch01-b140
          speaker: edred
          text: >-
            Oh, all right. I'm sorry too. But saying sorry doesn't undo a quarrel. That's the awful part. Now we won't find the Door for three days. I wish we hadn't fought. It is sickening.
          emotion: sad
        - id: ch01-b141
          speaker: elfrida
          text: >-
            Never mind. It wasn't a real “I'll never speak to you again” sort of quarrel, was it?
        - id: ch01-b142
          speaker: edred
          text: >-
            I don't suppose the kind of quarrel matters. Look, tell me the story once more, and I'll honestly try to believe you. I give you my word as an Arden.
        - id: ch01-b143
          speaker: narrator
          text: "So Elfrida told him the whole story again."
        - id: ch01-b144
          speaker: edred
          text: "And where did you put the jewels?"
        - id: ch01-b145
          speaker: elfrida
          text: >-
            I didn't. He put them in the corner cupboard inside the secret room.
        - id: ch01-b146
          speaker: edred
          text: >-
            If you had brought me instead of rushing away... No, I'm not starting another quarrel. I'm reasoning, the way Aunt Edith does. If I had been there, I would have buried the jewels, come back for myself, and then we'd dig them up. We would be rich beyond the dreams of... what is it people say?
        - id: ch01-b147
          speaker: elfrida
          text: >-
            But I never told Betty where the jewels were. They might still be there. Let's look!
        - id: ch01-b148
          speaker: edred
          text: >-
            If they are, I'll believe your whole story without even trying.
        - id: ch01-b149
          speaker: elfrida
          text: "If the secret room exists, you'll have to believe me, won't you?"
        - id: ch01-b150
          speaker: edred
          text: >-
            Maybe. Let's find out. I expect I'll have a headache soon. You shouldn't have shaken me. Mrs. Honeysett says shaking mixes people's brains up inside their heads. Then their heads ache, and they turn stupid. That must be why you called me stupid.
        - id: ch01-b151
          speaker: elfrida
          text: >-
            Oh, dear! I called you stupid before I shook you, and I already said I was sorry.
        - id: ch01-b152
          speaker: edred
          text: >-
            I know, but it's the same thing. Come on. Let's take a peek at this secret room of yours.
        - id: ch01-b153
          speaker: narrator
          text: >-
            Unfortunately, it was now dinner time. If you know that a carved panel hides a staircase, you do not give away the secret lightly. You do not mention it like the day of the week, the date of the Battle of Waterloo, or the answer to nine times seven. You would not mention it even to a grown-up as fairly and properly liked as Mrs. Honeysett. And there was another difficulty. Hot beefsteak pudding and greens simply do not go with romances from long ago. Searching the carving for a secret spring while that dinner smoked on the table would have been as improper as trying on a new gold crown while your hair was still tied up in curling papers. Elfrida felt that strongly. Edred only half believed in the secret room anyway, and besides, he was very hungry.
        - id: ch01-b154
          speakers: [edred, elfrida]
          ensemble: duo
          text: "We'll wait until after dinner."
        - id: ch01-b155
          speaker: narrator
          text: >-
            They whispered it to each other while Mrs. Honeysett changed their plates.
        - id: ch01-b156
          speaker: edred
          text: >-
            You really do cook beautifully.
        - id: ch01-b157
          speaker: narrator
          text: >-
            Mrs. Honeysett cut into the gooseberry pie, showing its green, jewel-colored filling.
        - id: ch01-b158
          speaker: mrs_honeysett
          text: >-
            Then you do the eating beautifully, and be quick. You two haven't been getting into mischief this morning, have you? Butter wouldn't melt in either of your mouths. With most children, that always means something is going on.
        - id: ch01-b159
          speaker: elfrida
          text: >-
            Indeed we haven't, and we don't mean to. We only look like that because we brushed our hair with wet brushes. I've often noticed that it makes people look good.
        - id: ch01-b160
          speaker: mrs_honeysett
          text: >-
            I've rushed about all morning so I can visit my sister this afternoon. The poor old dear is unwell again, and I may be late. My niece Emily will come and take charge. She's a nice, lively girl. She'll make your tea and look after you properly. Now don't do anything you wouldn't do with me standing behind you, my dears.
        - id: ch01-b161
          speaker: narrator
          text: >-
            Nothing could have suited the children better. A young girl like Emily ought to be easier to manage than Mrs. Honeysett. As soon as they were alone, they discussed it and settled on a plan. They would ask Emily to walk to the station and see whether a parcel had arrived for Master Arden or Miss Arden.
        - id: ch01-b162
          speaker: elfrida
          text: >-
            And if there isn't one, we'll tell her to wait for it. We'll fetch her as soon as we've explored the secret chamber.
        - id: ch01-b163
          speaker: narrator
          text: "Elfrida giggled. Edred became thoughtful."
        - id: ch01-b164
          speaker: edred
          text: >-
            We haven't paid much attention to finding the treasure, have we? Wasn't that why we meant to go into history?
        - id: ch01-b165
          speaker: elfrida
          text: >-
            Now, Edred, you know perfectly well we didn't enter history on purpose.
        - id: ch01-b166
          speaker: edred
          text: >-
            No, but we should have. Suppose those jewels are the treasure. We could sell them and rebuild Arden Castle exactly as it used to be.
        - id: ch01-b167
          speaker: elfrida
          text: >-
            We should give Aunt Edith some jewels too. She is such a dear.
        - id: ch01-b168
          speaker: edred
          text: >-
            Yes, she gets first choice. I think we're right on the edge of it. I feel as if something real is about to happen, not back in history, but here at Arden now.
        - id: ch01-b169
          speaker: elfrida
          text: >-
            Oh, I hope we find them! And I hope we can manage that lively young girl.
        - id: ch01-b170
          speaker: narrator
          text: >-
            Mrs. Honeysett's best dress was a cheerful, brilliant red, exactly the sort of color anyone could see from far away. The children watched that patch of red moving farther and farther across the landscape. Only when it vanished around a shoulder of the downs did they turn to the task of managing Emily.
        - id: ch01-b171
          speaker: narrator
          text: >-
            The lively young girl proved very easy to manage. Naturally, popping on her hat and running down to the station sounded much pleasanter than washing every plate used for the beefsteak pudding and gooseberry pie. After that, Mrs. Honeysett had meant her to scrub the kitchen thoroughly. Emily had worn her best skirt over her printed work dress so she would look smart while walking up through the village. The skirt was a vivid violet, another excellent color for watching someone at a distance. Edred and Elfrida kept their eyes on it until the last flash of violet dipped out of sight into the lane.
        - id: ch01-b172
          speaker: elfrida
          text: >-
            Now we're alone. We can explore the great secret!
        - id: ch01-b173
          speaker: edred
          text: >-
            But what if someone comes in, interrupts us, discovers everything, and steals the jewels? There are tramps about, and gypsy women carrying baskets.
        - id: ch01-b174
          speaker: elfrida
          text: >-
            Yes, they might ask for water or want to know the time. We'll lock both doors, front and back.
        - id: ch01-b175
          speaker: narrator
          text: "They did, but cautious Edred still was not satisfied."
        - id: ch01-b176
          speaker: edred
          text: "Lock the parlor door as well."
        - id: ch01-b177
          speaker: narrator
          text: >-
            They locked that one too. Elfrida removed the key and hid it in what she considered a safe place. She explained that this was “in case of accidents.” I do not know what sort of accident she had in mind. When she thought about it afterward, Elfrida did not know either. Still, at that moment, hiding the key appeared entirely sensible.
        - id: ch01-b178
          speaker: narrator
          text: >-
            The children had brought a candle and a box of matches. Now the decisive moment had arrived, as people say of battles. Elfrida felt over the carving for the hidden spring.
        - id: ch01-b179
          speaker: edred
          text: "How do you make it open?"
        - id: ch01-b180
          speaker: elfrida
          text: "I'll show you in a moment."
        - id: ch01-b181
          speaker: narrator
          text: >-
            She could not show him yet because, in truth, she did not know how it opened. She knew only that a secret spring was hidden somewhere among the carving. The room's tallest chair was barely high enough to help. Elfrida climbed up and balanced with one foot on each of its arms. From there she could reach around the panel, and she ran both hands over the wreaths of carved leaves and flowers. Without warning, something clicked beneath her fingers. The secret door sprang toward her. She had only just enough time to leap to the floor before it knocked her from the chair.
        - id: ch01-b182
          speaker: narrator
          text: >-
            She climbed onto the chair again and crawled into the opening. Edred passed her the candle.
        - id: ch01-b183
          speaker: elfrida
          text: "Where are the matches?"
        - id: ch01-b184
          speaker: edred
          text: >-
            In my pocket. I'm not letting you rush away without me again.
        - id: ch01-b185
          speaker: elfrida
          text: "Well, come along then."
        - id: ch01-b186
          speaker: narrator
          text: "She ignored how unfair his remark was."
        - id: ch01-b187
          speaker: edred
          text: "All right. How does the door open?"
        - id: ch01-b188
          speaker: narrator
          text: >-
            Edred climbed onto the chair. He had pushed the door halfway closed, and now he felt among the carved leaves as he had seen Elfrida do.
        - id: ch01-b189
          speaker: elfrida
          text: "Oh, come on! Oh, look out!"
          emotion: fearful
        - id: ch01-b190
          speaker: narrator
          text: >-
            She had good reason to warn her careless brother. As Edred stretched up toward the carving, the chair tipped under him. He was thrown forward. He snatched at the carved leaves to save himself, but his fingers missed them. Instead, he fell with all his weight against the half-open secret door. It slammed shut with a tremendous bang. A second, echoing crash rolled through the quiet house as Edred and the enormous chair fell onto the floor together, tangled in what looked almost like an embrace.
        - id: ch01-b191
          speaker: narrator
          text: >-
            For one dreadful moment, everything was still. Then Elfrida hammered on the other side of the panel with both fists.
        - id: ch01-b192
          speaker: elfrida
          text: "Open the door! You aren't hurt, are you?"
          emotion: fearful
        - id: ch01-b193
          speaker: edred
          text: >-
            Yes, very badly. My leg is twisted inside my knickerbockers, there's an enormous bump on my head, and I think I'm going to be terribly ill.
        - id: ch01-b194
          speaker: narrator
          text: "His voice came from the hearthrug outside the secret door."
        - id: ch01-b195
          speaker: elfrida
          text: "Open the panel first."
        - id: ch01-b196
          speaker: narrator
          text: >-
            That was not very sympathetic, but Elfrida was alone in the darkness behind the panel.
        - id: ch01-b197
          speaker: edred
          text: "I don't know how."
        - id: ch01-b198
          speaker: narrator
          text: >-
            Elfrida heard him struggling to his feet among the overturned furniture.
        - id: ch01-b199
          speaker: elfrida
          text: >-
            Feel among the leaves the way I did. It's easy. You'll find the spring soon.
        - id: ch01-b200
          speaker: narrator
          text: "No answer came."
