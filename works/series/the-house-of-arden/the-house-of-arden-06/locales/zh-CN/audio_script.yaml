audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 亲切从容，带一点温和的幽默
        timbre: 温暖清亮
        pace: 舒缓而有变化
        pitch: 中等
    edred:
      display_name: 埃德雷德
      tts:
        delivery: 聪明好胜，认真里带着孩子气
        timbre: 清脆明亮的男孩声
        pace: 自然偏快
        pitch: 中高
    elfrida:
      display_name: 埃尔弗丽达
      tts:
        delivery: 直率活泼，敏锐又有主意
        timbre: 清亮的女孩声
        pace: 轻快
        pitch: 高
    mrs_honeysett:
      display_name: 霍尼塞特太太
      tts:
        delivery: 慈爱爽利，带着老式管家的礼数
        timbre: 柔和饱满
        pace: 从容
        pitch: 中等
    betty:
      display_name: 贝特
      tts:
        delivery: 娇贵多情，遇事慌张却爱摆出庄重姿态
        timbre: 柔美明亮的年轻女声
        pace: 略慢，激动时加快
        pitch: 中高
    talbot:
      display_name: 爱德华·塔尔博特爵士
      tts:
        delivery: 风趣潇洒，礼数周全又带着戏谑
        timbre: 清朗醇厚
        pace: 从容自信
        pitch: 中低
    fitzgerald:
      display_name: 菲茨杰拉德先生
      tts:
        delivery: 爽快机敏，说话直截了当
        timbre: 饱满明亮
        pace: 自然
        pitch: 中等
    plum_gentleman:
      display_name: 李子色衣服的先生
      tts:
        delivery: 克制诙谐，严肃里藏着笑意
        timbre: 清晰温厚
        pace: 稳健
        pitch: 中低
    gentleman_1:
      display_name: 骑装先生甲
      tts:
        delivery: 严厉急切，带着旧式绅士的腔调
        timbre: 洪亮结实
        pace: 稍快
        pitch: 中低
    gentleman_2:
      display_name: 骑装先生乙
      tts:
        delivery: 正直爽朗，情绪来得直快
        timbre: 明亮粗实
        pace: 自然偏快
        pitch: 中等
    gentleman_3:
      display_name: 骑装先生丙
      tts:
        delivery: 认真拘谨，答话干脆
        timbre: 稳重清晰
        pace: 自然
        pitch: 中低
    gentleman_4:
      display_name: 骑装先生丁
      tts:
        delivery: 好奇热切，容易跟着众人起哄
        timbre: 清亮
        pace: 稍快
        pitch: 中等
  chapters:
    - id: ch01
      title: 第六章　秘密嵌板
      blocks:
        - id: ch01-b01
          speaker: elfrida
          text: 到底把他藏在哪儿？
        - id: ch01-b02
          speaker: narrator
          text: 埃尔弗丽达急得不耐烦。她那股热心也烧到了贝特身上。贝特一下站起来，伸手去摸壁炉上方的雕花。
        - id: ch01-b03
          speaker: betty
          text: 藏进秘密房间。先插好门闩，把门锁上。
        - id: ch01-b04
          speaker: narrator
          text: 埃尔弗丽达锁好房门，一转身，雕花壁炉架已经像柜门一样打开了。她赶紧奔到窗边，把窗扇推得大大的。那位漂亮先生从窗外爬进来，高高地站在屋里，依旧英俊极了。他先向贝蒂小姐深深鞠了一躬。贝蒂跪到他面前，吻了吻他伸来的手。那只手雪白雪白，还戴着闪亮的宝石戒指。
        - id: ch01-b05
          speaker: elfrida
          text: 快，钻进洞里去！
        - id: ch01-b06
          speaker: betty
          text: 里面还有楼梯。
        - id: ch01-b07
          speaker: narrator
          text: 贝蒂抓起银烛台，高高举着。圣乔治骑士跳上椅子，先把一条腿跪到壁炉架上，再钻进黑洞。他的样子很像坦尼尔先生画的爱丽丝穿过镜子。贝蒂把蜡烛举过去，他从上面伸下一只白手接走了。埃尔弗丽达马上跳上椅子，合好嵌板，再跃回地面。女仆端着晚餐托盘走到门的另一边时，她恰好把房门打开。
        - id: ch01-b08
          speaker: narrator
          text: 女仆离开后，贝特一把搂住表妹。
        - id: ch01-b09
          speaker: betty
          text: 小表妹，别怕。贝特表姐一定护着你，绝不让这场冒险伤到你。
        - id: ch01-b10
          speaker: elfrida
          text: 瞧你说的！是我放他进来的。刚才要不是我拦着，你早就叫得整座宅子都听见了。
        - id: ch01-b11
          speaker: betty
          text: 别叽叽喳喳，孩子。让我静下心来想想，该怎么为我的国王效劳。
        - id: ch01-b12
          speaker: elfrida
          text: 换成我，就先给他送吃的，再摸摸床铺晒过没有。不过你大概嫌这些事太俗气、太平常。
        - id: ch01-b13
          speaker: narrator
          text: 两个人隔着一桌没动过的晚餐对瞪起来。
        - id: ch01-b14
          speaker: betty
          text: 没规矩的小丫头！
          emotion: angry
        - id: ch01-b15
          speaker: elfrida
          text: 你自己才是小丫头。
        - id: ch01-b16
          speaker: narrator
          text: 埃尔弗丽达说完却笑了。
        - id: ch01-b17
          speaker: elfrida
          text: 好啦，贝特表姐。叔叔不在，你又是大人。你只要表现得又聪明又了不起，将来的圣诞画报上就会有你的肖像。你穿着白缎衣裳，一脸忧虑，下面写着：“拯救国王的女子。”
        - id: ch01-b18
          speaker: betty
          text: 孩子，别越扯越远。我已经够心烦了。你要是想赔罪，现在就说。
        - id: ch01-b19
          speaker: elfrida
          text: 好吧，对不起，这总行了吧？现在能给你的国王送点吃的了吗？
        - id: ch01-b20
          speaker: betty
          text: 让我端着托盘爬进洞里？仆人随时会来。真被他们撞见，你怎么解释？
        - id: ch01-b21
          speaker: elfrida
          text: 那就让我去。
        - id: ch01-b22
          speaker: narrator
          text: 这个机会正合她的心意。贝特按开暗簧，等她钻进黑洞，又把晚餐托盘递进去。埃尔弗丽达马上把托盘放到脚边。
        - id: ch01-b23
          speaker: elfrida
          text: 真麻烦，太重了。我拿不上去，得让他自己来取。给我蜡烛，关好嵌板，再告诉我往哪里走。
        - id: ch01-b24
          speaker: betty
          text: 向右转，再上台阶。开口以前，一定先跪下吻他的手。
        - id: ch01-b25
          speaker: narrator
          text: 她探手接过银烛台，身后的嵌板咔嗒一声合上。埃尔弗丽达就这样独自站在秘密通道里，手里举着一小团烛光，脚边放着沉重的晚餐托盘，四周全是挂着蛛网的阴影。
        - id: ch01-b26
          speaker: elfrida
          text: 这只是白鼹鼠精变出来的一场冒险。
        - id: ch01-b27
          speaker: narrator
          text: 她给自己壮了胆，向右转去，爬上又陡又窄的楼梯。顶上有扇门没有关严，露出一道长长的亮线。敲门似乎不妥，她把嘴贴近那道光，轻声开口。
        - id: ch01-b28
          speaker: elfrida
          text: 是我。
        - id: ch01-b29
          speaker: narrator
          text: 门立刻开了，漂亮先生站在她面前。秘密房间里只有卧榻、桌椅几样老式家具。在两支蜡烛的暗光下，它们仍显得十分优美。
        - id: ch01-b30
          speaker: elfrida
          text: 您的晚餐在楼梯下面。托盘对我来说太重了，能请您自己拿上来吗？
        - id: ch01-b31
          speaker: talbot
          text: 只要你替我照亮。
        - id: ch01-b32
          speaker: narrator
          text: 他下去拿了托盘。埃尔弗丽达举灯把他领回来，他把饭菜摆上桌。
        - id: ch01-b33
          speaker: talbot
          text: 留下陪我吃一点，好吗？
        - id: ch01-b34
          speaker: elfrida
          text: 不行。贝特表姐太笨，仆人若进来，她连我去了哪里都编不出来。糟了，我忘了一件事！她让我提晚餐以前先跪下吻您的手。我现在补上。
        - id: ch01-b35
          speaker: talbot
          text: 不必。让我吻吻你的脸吧，小淑女。我还要举杯祝福将来得到你双唇的人。等你十七岁时，我已经多大来着，五百岁？
        - id: ch01-b36
          speaker: elfrida
          text: 是二百三十岁。您真的很好。我真希望您是个真人。现在我该回贝特那里了。
        - id: ch01-b37
          speaker: talbot
          text: 真人？
        - id: ch01-b38
          speaker: elfrida
          text: 我知道自己在胡说。我走啦。
        - id: ch01-b39
          speaker: talbot
          text: 要是托盘一直不见，仆人一眼就会看出问题。等我把食物和酒摆到桌上，再把空托盘送回去。小姑娘，你有密谋者的全部胆量，只是还少了那么一点儿机巧。
        - id: ch01-b40
          speaker: elfrida
          text: 您准备在这里待多久？您是在躲什么人，或是躲什么事吗？就像历史故事里那样？
        - id: ch01-b41
          speaker: talbot
          text: 我不会久留。若有人问你见没见过国王，你怎么回答？
        - id: ch01-b42
          speaker: elfrida
          text: 我就说没见过。我根本没法知道您真是国王，只是您自己这样说。也许您其实不是呢。
        - id: ch01-b43
          speaker: talbot
          text: 妙极了！这么说，你不信我？
        - id: ch01-b44
          speaker: elfrida
          text: 我当然信。可是，我也可以不信呀。
        - id: ch01-b45
          speaker: talbot
          text: 凭我的命！我倒希望自己是。那样，有个人便能得到一顶冠冕了。
        - id: ch01-b46
          speaker: elfrida
          text: 您希望自己是……
        - id: ch01-b47
          speaker: talbot
          text: 我希望自己平安脱身，小淑女。至于冠冕，珠宝很安全，我已经放进墙角的柜子了。
        - id: ch01-b48
          speaker: narrator
          text: 珠宝果真安安稳稳地放在墙角柜子里。塔尔博特取出食物和酒，把空托盘送了下去。埃尔弗丽达已经饿得厉害，自己很想吃，也劝贝特多少吃一点。谁知道什么时候又得做一件英勇的大事，总要先留足力气。贝特却说，哪怕最小的一口也会把她噎死。她连床也不肯上，还再三保证，自己最明白对国王应尽的本分。只要需要，她愿意用生命保护君主。她正说得忠心耿耿、热烈万分，寂静的夜忽然被猛烈的敲门声打破了。城堡门外，一个男人用粗重的嗓门大喊。
        - id: ch01-b49
          speaker: gentleman_1
          text: 奉女王之名，开门！
        - id: ch01-b50
          speaker: betty
          text: 他们来抓他了！全完了！有人出卖了我们！这可怎么办？
          emotion: fearful
        - id: ch01-b51
          speaker: elfrida
          text: 吃！快拼命吃。
        - id: ch01-b52
          speaker: narrator
          text: 她把贝特按进椅子，往她盘里塞了一大块肉馅饼，自己也拿了一块。
        - id: ch01-b53
          speaker: elfrida
          text: 把嘴塞得满满的，满到没法说话。这样你才有工夫想办法。
        - id: ch01-b54
          speaker: narrator
          text: 门开了。转眼之间，屋里挤满了穿骑装的先生。他们一个个神情严厉，腰间还都佩着剑。贝蒂嘴里塞满食物，竭力控制自己的眼睛，不肯朝秘密嵌板那边看。埃尔弗丽达的嘴也塞得一样满。她鼓着腮帮子，仔细打量那个似乎领头的绿衣先生。
        - id: ch01-b55
          speaker: elfrida
          text: 深更半夜把人敲起来，你们可真会挑时候！
        - id: ch01-b56
          speaker: fitzgerald
          text: 忠诚的臣民不管什么时辰。今晚府上有没有陌生人留宿？
        - id: ch01-b57
          speaker: betty
          text: 啊，全完了！
          emotion: fearful
        - id: ch01-b58
          speaker: narrator
          text: 先生们互相递了个眼色，呼啦一下全围到贝特身边。埃尔弗丽达却只在心里耸了耸肩，假如一颗心也有肩膀的话。她告诉自己，不管眼前出了什么事，都没什么要紧。历史一定知道怎样安排才最好。这里的一切看起来正在发生，可它们原本就只是历史。
        - id: ch01-b59
          speakers: [fitzgerald, plum_gentleman, gentleman_2, gentleman_3]
          ensemble: chorus
          text: 果真有陌生人在这里？他在哪儿？你们不能不把人交出来。
        - id: ch01-b60
          speaker: betty
          text: 我的心早就告诉我了。我就知道你们要找的是他！
        - id: ch01-b61
          speaker: narrator
          text: 她姿态优美地昏进最近那位先生怀里。那人穿着李子色衣服，仿佛正压住某种情绪，看起来活像忍着不笑。
        - id: ch01-b62
          speaker: fitzgerald
          text: 问孩子吧。孩子和傻瓜都会讲真话。
        - id: ch01-b63
          speaker: narrator
          text: 埃尔弗丽达忽然被抱到桌上。她越过围在四周的头顶，看见贝特斜躺在长沙发上。门还开着，仆人都挤在那里，恨不得多长几只眼睛和耳朵。
        - id: ch01-b64
          speakers: [fitzgerald, plum_gentleman, gentleman_2, gentleman_3]
          ensemble: chorus
          text: 现在说真话吧，小小姐。
        - id: ch01-b65
          speaker: elfrida
          text: 你们到底想问什么？不先叫仆人出去，我一个字也不说。
        - id: ch01-b66
          speaker: narrator
          text: 房门关上了。众人再次要她说实话，她仍旧要他们先把问题讲清楚。
        - id: ch01-b67
          speaker: gentleman_2
          text: 今晚有没有陌生人睡在这里？
        - id: ch01-b68
          speaker: elfrida
          text: 没有。
        - id: ch01-b69
          speaker: narrator
          text: 这个回答完全是真的。她很清楚，秘密房间里的漂亮先生并没有躺下睡觉。他正好端端坐在桌边，吃着刚刚送进去的晚餐。这个说法恰好救了她。
        - id: ch01-b70
          speaker: gentleman_3
          text: 可阿登小姐刚才说全完了，还说她知道我们找的是谁。
        - id: ch01-b71
          speaker: elfrida
          text: 事情是这样。今天我们被拦路强盗抢了，表姐大概受了惊。恐怕她平常就很容易受惊。
        - id: ch01-b72
          speakers: [fitzgerald, plum_gentleman, gentleman_2, gentleman_3]
          ensemble: chorus
          text: 她的确太容易受惊了。
        - id: ch01-b73
          speaker: gentleman_4
          text: 今天这事真是荒唐透顶。
        - id: ch01-b74
          speaker: plum_gentleman
          text: 还是直截了当地问吧。爱德华·塔尔博特爵士在这里吗？
        - id: ch01-b75
          speaker: elfrida
          text: 不在。再说，你们凭什么闯进别人家，把人吓得昏过去？等阿登勋爵回来，我一定告诉他。现在你们听明白了吧。
        - id: ch01-b76
          speaker: gentleman_2
          text: 天哪，这孩子真有胆量。她说得也一点不错！
          emotion: surprised
        - id: ch01-b77
          speaker: gentleman_3
          text: 见鬼，我们只是在阿登勋爵不在时，替他保护宅子！
        - id: ch01-b78
          speaker: elfrida
          text: 要是你们觉得塔尔博特在这里玩捉迷藏，他又真的做了坏事，那就随便找吧。不过阿登勋爵一定不会高兴。我说完了。现在请把我放回地板上！
        - id: ch01-b79
          speaker: narrator
          text: 如果没有记着自己身在历史时代，不是在现在时代，埃尔弗丽达也许没有勇气把这些话一口气说完。那些先生却显得十分欣赏她的胆量。他们轻轻把她从桌上抱回地板，又为打扰两位女士再三赔罪，这才走出房间，离开城堡。隔着窗户，埃尔弗丽达听见他们笑着说话，听见众人翻身上马时，马蹄在地上碰撞、踩踏。那些人好像全在笑。她却觉得，自己正走在一层又一层谜团当中。
        - id: ch01-b80
          speaker: narrator
          text: 埃尔弗丽达实在舍不得就这样回到自己的时代。她非得亲眼看看这场冒险怎样收尾不可。那一夜，她跟贝特表姐一起睡在一张巨大的四柱床上。至于贝特那场昏厥，时间掌握得再巧不过。陌生先生们在屋里待了多久，她便昏了多久。他们一走，她也就不再昏了，实在方便得很。
        - id: ch01-b81
          speaker: narrator
          text: 第二天一大早，埃尔弗丽达就起床下楼，来到起居室。她本想先去看看国王怎么样，再问他要不要一早就用刮脸水。她爸爸从前便是这样。可是时候早得过分，她想，还是稍微等一等更好。国王也许还困着。她很清楚，一个困得睁不开眼的人，未必会感激别人天没亮就送来刮脸水。
        - id: ch01-b82
          speaker: narrator
          text: 她走进田野，灰蒙蒙的露水铺在草上，又一路登上阿登丘。站在那里，她听见云雀在天上唱，也望见了整座城堡。有人居住的房屋周围，石缝里的灰浆看起来还是那么新。过了一会儿，两个人从远处穿过田野。那边，阿登教堂的尖顶正从树梢间升起来。树冠又圆又绿，很像最好的双卷叶欧芹。一位先生穿绿外套，另一位穿紫外套。埃尔弗丽达心想，隔着半英里就能凭衣服的颜色认出人，实在太方便了。
        - id: ch01-b83
          speaker: narrator
          text: 两人显然要去城堡。埃尔弗丽达也下了山，在大门口客客气气地向他们问早。
        - id: ch01-b84
          speaker: fitzgerald
          text: 至少你不是个贪睡虫。那么，昨晚阿登没有陌生人留宿，是吗？
        - id: ch01-b85
          speaker: narrator
          text: 这个问题实在不好回答。国王昨晚无疑睡在秘密房间里，这么早的时候，多半还躺在那里。可是，一个国王能算阿登的陌生人吗？埃尔弗丽达认真想了想，当然不能算。
        - id: ch01-b86
          speaker: elfrida
          text: 没有。
        - id: ch01-b87
          speaker: narrator
          text: 忽然，起居室敞开的窗户里伸出一条穿马靴的腿，接着又伸出一条。那位漂亮先生整个儿跳到他们面前。
        - id: ch01-b88
          speaker: talbot
          text: 哈！都小声些，仆人还没起来走动呢。
        - id: ch01-b89
          speaker: elfrida
          text: 他们早起来了，只是都在后面。贴着墙根溜过去，他们就看不见您。
        - id: ch01-b90
          speaker: talbot
          text: 你永远是位了不起的军师。跟我们来吧，小姑娘，我对你没有秘密。
        - id: ch01-b91
          speaker: narrator
          text: 于是，一行人全都弯下身子，紧贴着城堡墙根往前溜。他们一直来到一处墙角才停下。从那里望出去，视线正好穿过两道丘陵隆起的坡肩，远远看见大海。
        - id: ch01-b92
          speaker: talbot
          text: 赌注归我了。你们想坏我的事，也没能成功。菲茨杰拉德，赌约可没说你能在夜里九点闯进阿登，像一群猎犬追狐狸雷纳德那样把我搜出来。
        - id: ch01-b93
          speaker: fitzgerald
          text: 赌约也没禁止我们这样做。我们本想在路上截住你，可你早到了一个钟头。
        - id: ch01-b94
          speaker: talbot
          text: 把钟往回拨容易得很。“公牛”旅店的马夫爱丰厚的赌注，也爱一枚金币。
        - id: ch01-b95
          speaker: elfrida
          text: 我真希望你们快点解释清楚！
        - id: ch01-b96
          speaker: talbot
          text: 好，这就给你解释，小美人。
        - id: ch01-b97
          speaker: elfrida
          text: 您不是国王吗？您明明说自己是。
        - id: ch01-b98
          speaker: talbot
          text: 别急。我只问过你，假如我告诉你自己是詹姆斯国王，你会怎么说。
        - id: ch01-b99
          speaker: elfrida
          text: 那您到底是谁？
        - id: ch01-b100
          speaker: talbot
          text: 我不过是爱德华·塔尔博特，一个从男爵，愿为小姐效劳。
        - id: ch01-b101
          speaker: elfrida
          text: 我还是不明白。请您从头到尾全讲一遍。
        - id: ch01-b102
          speaker: narrator
          text: 埃尔弗丽达催着他从头讲起。塔尔博特答应了，另外两位先生站在一旁，望着这一大一小两个人，不住地笑。于是，这位被她当成国王的漂亮先生，终于讲起了事情真正的来龙去脉。
        - id: ch01-b103
          speaker: talbot
          text: 前几天晚上，我在这位菲茨杰拉德先生家吃饭。大家先谈起拦路抢劫，又谈到阿登城堡，还有别的几件事。席间这些先生和另外几个人跟我打赌，赌注足有五百枚金币。他们认定我不敢去抢一辆马车，我偏偏接下了。我还另外加上一赌，要抢的正是载着阿登家珠宝的马车。不仅如此，我还要在阿登住上一夜，又不让这里任何人知道我的姓名。如今三件事都做成了，这场赌自然归我。
        - id: ch01-b104
          speaker: talbot
          text: 我才从国外回来，你表姐当然没见过我的脸。可是孩子，要不是你，我这场赌准会输。我原本还指望阿登小姐帮忙，没想到她只是个脸色苍白、动不动就昏倒、半点用处也没有的漂亮小姐。可你不一样，你是一千个女孩里才找得到一个的。下次去伦敦，我一定给你挑最好的集市礼物。我们这些人本来就是朋友。回去告诉那位漂亮小姐，让她把自己的舌头管好，这件事绝不会从我们嘴里传出去。
        - id: ch01-b105
          speaker: elfrida
          text: 可这些先生昨晚都来了，所有仆人也知道。
        - id: ch01-b106
          speaker: talbot
          text: 昨晚那些先生当然只是去保护阿登小姐。万一那个恶毒的拦路强盗躲在窗帘后面，总得有人照应她。你可真是个聪明孩子！我们这副铠甲上每一个薄弱的地方，你都替我们想到了。
        - id: ch01-b107
          speaker: narrator
          text: 于是，塔尔博特又把整场冒险从头讲给朋友们听。那些人虽然输掉了赌注，还是听得哈哈大笑。他们笑得痛快极了，随后一起走过带露水的田野，各自回家吃早饭。埃尔弗丽达心里却想，他把我说得那么勇敢，那么了不起，当然很叫人高兴。可是，我真希望他当真是国王。
        - id: ch01-b108
          speaker: narrator
          text: 她把事情经过全告诉贝蒂以后，忽然觉得周围的一切都不值得留恋了。她再也不想待在过去的这个年代，便跑上楼，穿过阁楼和咕咕作响的鸽声，从那扇门回到自己的时代。等她下楼，埃德雷德还坐在雏菊钟的秒针上。他怎么也不信姐姐真的离开过。因为那根秒针一直被他压着，姐姐离开的全部时间，对他来说连一瞬也没有发生。
        - id: ch01-b109
          speaker: narrator
          text: 白鼹鼠精叫他们进屋去，他们答应着走了，走的方向却不是屋里。他们出了门，绕过城堡墙脚，又来到那个能看见大海的墙角。两个人并排躺在晒得暖暖的草地上，埃尔弗丽达从头到尾，把自己的经历细细讲了一遍。可是刚听完时，埃德雷德一个字也不相信。
        - id: ch01-b110
          speaker: elfrida
          text: 这全是真的。我哪有本事编出这么长的故事？
        - id: ch01-b111
          speaker: edred
          text: 对，你当然没那么聪明。不过你也许从哪本书里读到过。
        - id: ch01-b112
          speaker: elfrida
          text: 我根本没读过，就是没有！
        - id: ch01-b113
          speaker: edred
          text: 真有这回事，你就该回来带我一起去。你明知道我一直想见见拦路强盗。
        - id: ch01-b114
          speaker: elfrida
          text: 我怎么回来？从马上跳下来，跑进宅子，钻过那些箱子和鸽声，再从这里出来接你吗？等我们赶回去，拦路强盗，我是说塔尔博特，早就走远了。
        - id: ch01-b115
          speaker: edred
          text: 他不会走。我坐在钟上，钟已经停了。你离开时根本没有时间过去。假如你真的离开过。
        - id: ch01-b116
          speaker: elfrida
          text: 可我那边有时间呀。你难道还不懂……
        - id: ch01-b117
          speaker: edred
          text: 你若回到我这里，就不会有时间。
        - id: ch01-b118
          speaker: elfrida
          text: 你怎么这么气人？你不可能真有这么笨。
          emotion: angry
        - id: ch01-b119
          speaker: edred
          text: 怎么不可能？只要我愿意，还能比这笨得多。你等着。
        - id: ch01-b120
          speaker: elfrida
          text: 埃德雷德，有时候我真觉得非摇你几下不可。
        - id: ch01-b121
          speaker: edred
          text: 你不敢！
        - id: ch01-b122
          speaker: elfrida
          text: 你敢激我吗？
        - id: ch01-b123
          speaker: edred
          text: 我敢！
          emotion: angry
        - id: ch01-b124
          speaker: narrator
          text: 你当然知道，按照天下所有家庭的规矩，事情到了这一步，埃尔弗丽达已经非摇他不可。于是她真的摇了几下，自己却突然放声大哭。埃德雷德望着她看了一会儿，接着……不，不行，流眼泪有损男子气概，我不能把主人公的软弱泄露给你。让我们先拉起一道帷幕吧。或者绕着城堡散散步，过一会儿再回来看看他们。
        - id: ch01-b125
          speaker: narrator
          text: 幸亏我们刚才及时走开，背过身去，没有继续看那场非常不愉快的闹剧。现在绕过城堡回来，哭声还没有完全停下。埃尔弗丽达正一遍遍说自己非常抱歉，还在口袋里翻找手帕，想借给埃德雷德擦眼睛。说来也怪，他自己的手帕偏偏在这时候不见了。
        - id: ch01-b126
          speaker: edred
          text: 好吧，我也对不起。可两个人都道歉，也不能把这场架变成没吵过。最糟的就是这个。三天以内，我们都找不到那扇门了。真希望刚才没吵，太讨厌了。
          emotion: sad
        - id: ch01-b127
          speaker: elfrida
          text: 别在意。我们又没吵到“我再也不跟你说话了，你等着瞧”那种地步，对吧？
        - id: ch01-b128
          speaker: edred
          text: 我看吵成什么样都一样。这样吧，你再给我讲一遍，我会努力相信。真的，我以阿登家族的荣誉发誓。
        - id: ch01-b129
          speaker: narrator
          text: 于是，埃尔弗丽达只好从见到贝特开始，把马车、拦路强盗、秘密房间和赌约，全都重新讲了一遍。埃德雷德这次认真听到了最后。姐姐刚刚停下来，他便问起一件自己认为最要紧的事。
        - id: ch01-b130
          speaker: edred
          text: 那些珠宝放到哪里去了？
        - id: ch01-b131
          speaker: elfrida
          text: 我……他们……是塔尔博特把珠宝放进秘密房间墙角的柜子里了。
        - id: ch01-b132
          speaker: edred
          text: 你要是带上我，又没那么着急……我不是吵架，只是像伊迪丝姑妈那样讲道理。要是我也在，就会先把珠宝埋起来，再回来接你。我们一起把它挖出来，就会富得超过……那句话里到底是谁的梦想来着？
        - id: ch01-b133
          speaker: elfrida
          text: 我一直没告诉贝蒂珠宝在哪儿。说不定还留在那里。我们去看看吧。
        - id: ch01-b134
          speaker: edred
          text: 真在那里，你刚才讲的每句话，我不用费劲就全信了。
        - id: ch01-b135
          speaker: elfrida
          text: 要是秘密房间真的存在，你就必须相信了，对不对？
        - id: ch01-b136
          speaker: edred
          text: 也许吧，先去看看。我过一会儿准会头疼。你不该摇我。霍尼塞特太太说，摇人会把脑袋里的脑子搅乱，脑子乱了，人就头疼，还会变笨。我看你说我笨，就是因为这个。
        - id: ch01-b137
          speaker: elfrida
          text: 你明知道我是摇你以前说的，而且我已经道歉了。
        - id: ch01-b138
          speaker: edred
          text: 我知道，可结果都一样。走吧，瞧瞧你那个老秘密房间。
        - id: ch01-b139
          speaker: narrator
          text: 偏偏这时，午饭开了。若你知道一块雕花嵌板后面藏着楼梯，当然不会把这样的秘密随口告诉别人，好像只是在说今天星期几、滑铁卢战役是哪一年，或者九乘七等于多少。哪怕对方是大家真心喜欢的霍尼塞特太太，也不能轻易开口。况且，热腾腾的牛排布丁配青菜，跟古老年代的传奇实在不相称。桌上的饭菜还冒着热气，就丢下它去找嵌板暗簧，好比头上还裹着卷发纸，却试戴一顶崭新的金王冠，怎么想都不得体。埃尔弗丽达正是这样觉得。埃德雷德对秘密只信了一半，而且他已经饿坏了。
        - id: ch01-b140
          speakers: [elfrida, edred]
          ensemble: duo
          text: 等吃完再去。
        - id: ch01-b141
          speaker: narrator
          text: 霍尼塞特太太在桌边替他们换盘子时，两个人凑在一起，压低声音作出这个决定。随后，醋栗馅饼被切开了，饼皮下面露出一片晶莹的绿色，颜色就像一块碧绿的玉髓。
        - id: ch01-b142
          speaker: edred
          text: 您做的饭可真好吃。
        - id: ch01-b143
          speaker: mrs_honeysett
          text: 那你就好好吃，还得快点。你们上午没闯祸吧？瞧这副老实样，嘴里的黄油都像不会化。孩子只要这样，多半就是有事瞒着。
        - id: ch01-b144
          speaker: elfrida
          text: 我们真的没闯祸，也没打算闯。大概是因为我们用湿刷子梳过头吧。不知怎么，那样梳完，人就显得特别乖。我早就发现了。
        - id: ch01-b145
          speaker: mrs_honeysett
          text: 我一早忙得脚不沾地，就是想把活儿提前做完，下午好去妹妹那儿待一会儿。可怜的老姐姐又不舒服了，我也许会在那里耽搁到很晚。我的侄女艾米莉会来照看家里。她是个年轻又活泼的好姑娘，会给你们预备茶点，也会把你们照顾得妥妥帖帖。你们可别趁我不在，就做什么我站在身后时不敢做的事。答应我，好孩子。
        - id: ch01-b146
          speaker: narrator
          text: 事情简直顺利得不能再顺利。两个孩子都觉得，艾米莉只是个年轻姑娘，肯定比霍尼塞特太太容易对付。屋里只剩下他们以后，两个人安安心心商量起来。他们决定，最好的办法就是请艾米莉下山去车站，替他们看看有没有一个包裹，收件人写的是阿登少爷或阿登小姐。
        - id: ch01-b147
          speaker: elfrida
          text: 要是没有，就叫她留在那里等。我们探索完秘密房间，再跑下去接她。
        - id: ch01-b148
          speaker: edred
          text: 我们好像一直没认真找宝藏。我还以为，走进历史就是为了这件事。
        - id: ch01-b149
          speaker: elfrida
          text: 你明明知道，我们不是故意走进历史的。
        - id: ch01-b150
          speaker: edred
          text: 不是，可我们本来应该故意进去。假如宝藏就是那些珠宝呢？把它们卖掉，我们就能照从前的样子重建阿登城堡。
        - id: ch01-b151
          speaker: elfrida
          text: 还该送几件给伊迪丝姑妈。她那么好，对不对？
        - id: ch01-b152
          speaker: edred
          text: 对，让她先挑。我真觉得，我们已经走到一件大事的边上了。要发生的不是历史里的事，而是现在阿登的事。
        - id: ch01-b153
          speaker: elfrida
          text: 我真希望能找到珠宝，也希望我们能顺利对付那位活泼的年轻姑娘。
        - id: ch01-b154
          speaker: narrator
          text: 霍尼塞特太太最好的衣裳，是一种鲜亮悦目的红色，隔得很远也看得见。孩子们目送那一团红越走越远，直到它消失在丘陵的一道坡肩后面，这才转过身，开始执行对付艾米莉的计划。
        - id: ch01-b155
          speaker: narrator
          text: 艾米莉果然很容易对付。赶紧戴上帽子，痛痛快快跑一趟车站，当然比留在家里洗盘子有趣。那些盘子才装过牛排布丁和醋栗馅饼，洗完以后，还得把整个厨房彻底刷一遍。可怜的艾米莉原本要用这一整套活计打发下午，因为霍尼塞特太太就是这样安排的。
        - id: ch01-b156
          speaker: narrator
          text: 艾米莉也穿了自己最好的衣裳。她进村时想显得漂亮些，便把那条裙子直接套在印花布衣裳外面。裙子是明艳的紫罗兰色，同样隔着老远就看得见。两个孩子一直望着那片紫色，直到它一点点沉进下面的小路，再也瞧不见。
        - id: ch01-b157
          speaker: elfrida
          text: 现在只剩我们了，可以去探索那个大秘密啦！
          emotion: happy
        - id: ch01-b158
          speaker: edred
          text: 要是有人来打断我们，发现秘密，抢走珠宝呢？可能会有流浪汉，也可能有提篮子的吉卜赛女人。
        - id: ch01-b159
          speaker: elfrida
          text: 也许有人来讨水喝，或者问时间。我们把前门后门全锁上。
        - id: ch01-b160
          speaker: narrator
          text: 他们说做就做，把宅子的前门和后门一一锁好。可是这还不够。刚才还急着寻宝的埃德雷德，眼下忽然变得谨慎万分，站在屋里想了又想，仍旧觉得不能放心。
        - id: ch01-b161
          speaker: edred
          text: 起居室的门也要锁。
        - id: ch01-b162
          speaker: narrator
          text: 两人把起居室的门也锁好了。埃尔弗丽达又把钥匙放到一个她认为安全的地方，还说这是为了免得出意外。她说的究竟是哪一种意外，我一点儿也不知道。后来她自己认真想过，同样没有想明白。不过在那一刻，这句话听起来十分妥当。
        - id: ch01-b163
          speaker: narrator
          text: 两个孩子早就准备妥当，手边有一盒火柴，还有一支可以照亮秘密通道的蜡烛。现在，用那些讲述大战的人常说的话来讲，决定性的时刻终于到了。埃尔弗丽达走到雕花嵌板前，伸手摸索隐藏的暗簧。
        - id: ch01-b164
          speaker: edred
          text: 它到底怎么开？
        - id: ch01-b165
          speaker: elfrida
          text: 等会儿就给你看。
        - id: ch01-b166
          speaker: narrator
          text: 其实她没法马上给他看，因为说到底，她自己也不知道暗簧在哪儿。她只知道嵌板上一定有那么个机关。于是，她站到屋里最高的椅子上，一只脚踩住一边扶手，伸出双手，在雕刻的花环之间来回摸索。只有这把椅子够高，能让她摸遍嵌板四周。突然，什么东西咔嗒响了一声，秘密门猛地弹开。她刚好来得及跳回地板，不然准会被门迎面撞倒。
        - id: ch01-b167
          speaker: narrator
          text: 她重新爬上去，钻进洞里。埃德雷德把蜡烛递给她。
        - id: ch01-b168
          speaker: elfrida
          text: 火柴呢？
        - id: ch01-b169
          speaker: edred
          text: 在我口袋里。我不会再让你丢下我，一个人跑掉。
        - id: ch01-b170
          speaker: elfrida
          text: 那就快来。
        - id: ch01-b171
          speaker: narrator
          text: 她没理会这话有多不公平。埃德雷德爬上椅子。
        - id: ch01-b172
          speaker: edred
          text: 到底怎么开呀？
        - id: ch01-b173
          speaker: narrator
          text: 他把秘密门合上一半，照姐姐刚才的样子，在雕花叶片间摸索。
        - id: ch01-b174
          speaker: elfrida
          text: 快进来。哎，小心！
          emotion: fearful
        - id: ch01-b175
          speaker: narrator
          text: 她叫粗心的弟弟小心，实在再及时不过。埃德雷德伸手去摸雕花，脚下的椅子突然歪向一边，他整个人猛地被甩向前方。他本能地去抓雕花，想稳住身体，却什么也没抓到。于是，他带着全身的分量重重撞上半开的秘密门。门砰的一声严严实实合拢。紧接着，又一声震耳欲聋的巨响传遍寂静的屋子。埃德雷德和那把大椅子像互相搂抱着一样，一起摔到了地板上。
        - id: ch01-b176
          speaker: narrator
          text: 四周静了一下，静得叫人害怕。嵌板另一边，埃尔弗丽达用拳头拼命捶门。
        - id: ch01-b177
          speaker: elfrida
          text: 快开门！你没受伤吧？
          emotion: fearful
        - id: ch01-b178
          speaker: edred
          text: 受伤了，而且伤得非常重。我的腿在灯笼裤那一截整个扭坏了，脑袋上还撞出一个特别大的包。我躺在壁炉前面的地毯上，觉得自己马上就要病得很厉害了。
        - id: ch01-b179
          speaker: elfrida
          text: 那也先把嵌板打开。
        - id: ch01-b180
          speaker: narrator
          text: 她说得不大有同情心。可她正独自关在嵌板后面的黑暗里。
        - id: ch01-b181
          speaker: edred
          text: 我不知道怎么开。
        - id: ch01-b182
          speaker: narrator
          text: 埃尔弗丽达隔着厚厚的秘密门，听见外面传来桌椅碰撞和衣服摩擦的声音。显然，埃德雷德正在那堆被撞得乱七八糟的家具中间，慢慢把自己撑起来。
        - id: ch01-b183
          speaker: elfrida
          text: 照我刚才那样摸那些叶子。很容易，你马上就能找到。
        - id: ch01-b184
          speaker: narrator
          text: 没有回答。四周只剩下一片寂静。
