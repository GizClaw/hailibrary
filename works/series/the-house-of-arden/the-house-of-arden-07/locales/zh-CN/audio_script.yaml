audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 亲切从容，带一点温和的幽默
        timbre: 温暖清亮
        pace: 舒缓而有变化
        pitch: 中等
    edred:
      display_name: 埃德雷德
      tts:
        delivery: 聪明好胜，认真里带着孩子气
        timbre: 清脆明亮的男孩声
        pace: 自然偏快
        pitch: 中高
    elfrida:
      display_name: 埃尔弗丽达
      tts:
        delivery: 直率活泼，敏锐又有主意
        timbre: 清亮的女孩声
        pace: 轻快
        pitch: 高
    mole:
      display_name: 鼹鼠精
      tts:
        delivery: 脾气暴躁，古怪又爱挖苦人
        timbre: 尖细干涩
        pace: 偏快，抱怨时一气呵成
        pitch: 偏高
    aunt_edith:
      display_name: 伊迪丝姑妈
      tts:
        delivery: 温柔能干，疲惫时仍带着幽默
        timbre: 柔和温暖
        pace: 从容
        pitch: 中等
    witch:
      display_name: 女巫
      tts:
        delivery: 古怪自信，直率中带着神秘
        timbre: 沙哑而有力的老妇人声
        pace: 从容，兴起时稍快
        pitch: 中低
  chapters:
    - id: ch01
      title: 第七章　起居室的钥匙
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 秘密嵌板随着弹簧一响，在埃尔弗丽达身后合上了。她原本到这里来，是想寻找爱德华·塔尔博特爵士两百年前假扮圣乔治骑士时藏下的珠宝。可嵌板关得太快，她连找都还没来得及找，就独自困进了尘封的黑暗。那扇门把她和明亮的起居室分在两边，弟弟也留在外面。现在，珠宝一下子变得一点也不重要了。真正要紧得可怕的，是眼前这块关得严严实实的嵌板。埃德雷德刚才试着把它打开，却从椅子上摔了下去。这么久过去，他总该已经爬起来了吧。
        - id: ch01-b02
          speaker: elfrida
          text: 你怎么还不开门？
        - id: ch01-b03
          speaker: narrator
          text: 没有回答。隔着嵌板，那片寂静重得出奇。四下又黑得什么也看不见，火柴偏偏还在埃德雷德口袋里。
        - id: ch01-b04
          speaker: elfrida
          text: 埃德雷德！埃德雷德！你为什么不开门？
        - id: ch01-b05
          speaker: edred
          text: 因为我够不着。
        - id: ch01-b06
          speaker: narrator
          text: 故事讲到这儿，本来很适合停下来，让你一直猜她要怎么出去。照现在的样子，她似乎得困上很久，谁也不会喜欢那么久。可那样这一章就太短了，而且还有别的理由。所以我还是告诉你吧。埃尔弗丽达把手伸进口袋，摸到一样又硬又沉的东西。她这才想起来，起居室的钥匙正放在里面。口袋原本是个又好又安全、绝不会把钥匙弄丢的地方。她发出了一声空洞的呻吟。
        - id: ch01-b07
          speaker: edred
          text: 哈，这下你明白了吧？现在你知道我也不算太笨了吧？
        - id: ch01-b08
          speaker: narrator
          text: 埃尔弗丽达顾不上回嘴，她在想办法。
        - id: ch01-b09
          speaker: elfrida
          text: 喂，我站在这儿也没用。我准备摸到楼上的秘密房间去，但愿那里真有窗户。换成你，我就找本书看，等着发生点什么。霍尼塞特太太总会回来的。
        - id: ch01-b10
          speaker: edred
          text: 我一半都听不见。你说话总是含含糊糊的。
        - id: ch01-b11
          speaker: elfrida
          text: 找一本书！看书！霍尼塞特太太总会回来的！
        - id: ch01-b12
          speaker: narrator
          text: 埃德雷德拿下一本《红棉睡帽国》。他觉得好像挺有意思，不过我劝你别试。嵌板里面，埃尔弗丽达伸着双手，沿通道摸向楼梯，心沉沉地跳着。
        - id: ch01-b13
          speaker: elfrida
          text: 说起来容易。嵌板还在，和我去过去时一样。可楼梯要是没了呢？也许它根本就没真正存在过。要是我撞上墙，或者别的什么呢？也许前面不是墙，是一口井。
          emotion: fearful
        - id: ch01-b14
          speaker: narrator
          text: 这个念头把她吓了一跳。此后每迈一步，她都先用一只脚仔细探过，才敢踩下去。脚下的木板软绵绵的，像铺着天鹅绒。楼梯也是这样，因为楼梯确实还在。她慢慢向上走，小心得不能再小心，两只手一直伸在前面。终于，她摸到一样像门的东西。她用手轻轻摸遍门面，寻找门闩，很快就摸到了。可这扇门已经太久太久没打开，现在一点也不情愿让路。埃尔弗丽达只好拿肩膀顶，用膝盖撞，把全身的力气都使出来。门总算开了。我想，它多半只是出于礼貌，因为她的肩膀、膝盖和力气都小得很。
        - id: ch01-b15
          speaker: narrator
          text: 她走进从前见过的房间。那一次，圣乔治骑士曾站在这里，借着银烛台上一支蜡烛的光，微笑着向她鞠躬。现在，房间里只剩她一个人。壁炉上方有一扇小窗，窗外垂着厚厚的常春藤，像一幅帘子。叶子间透进来的光，像一片绿色的暮色。若是刚从太阳底下进来，她准会把这里叫作绿色的黑暗。可她已经在漆黑里待了太久，这点朦胧的光在她眼里简直亮堂极了。
        - id: ch01-b16
          speaker: narrator
          text: 她关上门，拖一把椅子到壁炉前，爬上去开窗。窗扇也不愿动，最后却同样很有礼貌地松开了。她把常春藤叶一片片揪下来，全扔在炉石上，没有丢到窗外。屋里渐渐亮了。
        - id: ch01-b17
          speaker: elfrida
          text: 不能让外面的人发现阿登家的秘密藏身处。幸好我想到了。我确实很像书里的侦探。
        - id: ch01-b18
          speaker: narrator
          text: 方方正正的窗口上，绿叶全没了，只剩棕色藤枝。她转身细看房间。每件家具都盖着厚厚的尘土，刚才脚下会那么松软，原来是因为地板上铺着一层厚厚的灰尘地毯。塔尔博特爵士放过托盘的桌子还在，椅子也一把不少。墙角那个装过珠宝的柜子果然也在。埃尔弗丽达心里又藏着希望，又有些害怕。她拉开柜门，看见里面有三层搁板。第一层没有珠宝，第二层没有，第三层也没有。柜子从上到下全是空的。
        - id: ch01-b19
          speaker: narrator
          text: 她扶着敞开的柜门，手掌忽然碰到一处粗糙的地方。她凑过去看，那里刻着一个名字。她把柜门完全推开，让窗外的光正落在上面，这才认出那几个字母，E. Talbot。现在她知道了，从前在这间屋里见到的一切，一定真的发生在两百年前。那不是白鼹鼠精随手变出来的一段魔法。
        - id: ch01-b20
          speaker: narrator
          text: 她重新爬上那把椅子，从小窗探头向外望。城堡的围墙一点儿也看不见，只能看见远处丘陵起伏的肩头，还有一条横切过山坡、一直通往车站的小路。她多么希望有一个穿红衣或紫衣的人正沿路走来，可她看了又看，整条路上还是一个人也没有。
        - id: ch01-b21
          speaker: narrator
          text: 要是你被关在秘密房间里，好几个钟头都看不到出去的希望，你通常会做什么？至于我，我总会背诗给自己听。这正是诗的一种用处。碰上这种为难的处境，可以背诗。在火车站不得不等很久，也可以背诗。到了夜里怎么都睡不着，还是可以背诗。你会发现，诗在这些时候非常有用。所以应该多学一些，而且一定得学最好的诗。最好的诗不但最有用，也最让人愉快。
        - id: ch01-b22
          speaker: narrator
          text: 埃尔弗丽达先背起“毁灭攫住你吧，无情的国王！”可她最喜欢的几段非得有人在场才有意思。她换成很长的《贺拉斯守桥》，又背起那只淹死在金鱼缸里的《爱猫》。背到半截，她忽然想起了白鼹鼠精。
        - id: ch01-b23
          speaker: elfrida
          text: 我们不算真吵架，至少不算真真正正的吵架。不管怎样，我可以试试。
        - id: ch01-b24
          speaker: narrator
          text: 她开始编诗，想把白鼹鼠精召来。过了很久，第一首终于编好了。
        - id: ch01-b25
          speaker: elfrida
          text: 阿登的白鼹鼠精，对着九位神明起誓。阿登家的埃尔弗丽达，从此不再遭囚禁。它对九位神明这样起誓，还约好一个方便的时辰，想必如此。它命令使者们骑马出发，奔向东西南北四方，好放埃尔弗丽达出去。
        - id: ch01-b26
          speaker: narrator
          text: 她念完了，什么也没发生。
        - id: ch01-b27
          speaker: elfrida
          text: 到底是因为我们吵过架，还是因为诗里只说它放我出去，却没请它来？也许是为了押韵，非得把“埃——尔弗丽达”念得怪里怪气。又或许这首诗实在太胡说八道了。我再试一次。
        - id: ch01-b28
          speaker: narrator
          text: 第二首诗编成了。
        - id: ch01-b29
          speaker: elfrida
          text: 秘密嵌板藏身后，沉思的埃——尔弗丽达躺了好久，只盼着能够回家。当然，我本来就在家，可事情越来越糟啦。亲爱的鼹鼠，快来，来，来，来！
        - id: ch01-b30
          speaker: narrator
          text: 最后几个字刚出口，白鼹鼠精就坐在她脚边，眨着眼仰头看她。
        - id: ch01-b31
          speaker: elfrida
          text: 你肯来，真是太好了。
        - id: ch01-b32
          speaker: mole
          text: 好吧，这回你又想要什么？
        - id: ch01-b33
          speaker: elfrida
          text: 我该先说，我本不该求你做事。可那要真算吵架，你大概根本不会来。那只是一点点小争执，而且我们马上都后悔了。
        - id: ch01-b34
          speaker: mole
          text: 你这孩子倒很直爽。好啦，好啦，我不得不承认，你给自己找的这个洞真不错！
        - id: ch01-b35
          speaker: elfrida
          text: 只要嵌板开着，这里确实很好。那样的话，待多久我都不在乎。是不是很好笑？
        - id: ch01-b36
          speaker: mole
          text: 是啊。你们要是没吵架，我可以把你送到另一个时候，送到嵌板开着的时候。你只要走出去就行。你们真不该吵架。吵架会把一切弄乱，还会把灰尘撒进机器，让钟表的轮子停住。
        - id: ch01-b37
          speaker: elfrida
          text: 钟！难道不能让钟倒着走吗？
        - id: ch01-b38
          speaker: mole
          text: 我不明白你在说什么。
        - id: ch01-b39
          speaker: elfrida
          text: 我自己也没完全弄明白。可不是还有雏菊钟吗？你坐在秒针上，那儿就没有时间，你没坐的地方却有许许多多时间。我要是能坐上雏菊钟，等别人来放我以前，时间就什么也不是了。不过，就算你造一座，我也到不了雏菊钟那儿。这个办法还是不成。
        - id: ch01-b40
          speaker: mole
          text: 你真是个非常聪明的小姑娘。不过，世上的钟不全是雏菊做的。把桌椅搬回墙边，我们来想想能怎么办。
        - id: ch01-b41
          speaker: narrator
          text: 埃尔弗丽达照着它的话，把桌子和椅子一件件搬回墙边。白鼹鼠精用后腿站了起来，用一种她完全听不懂的语言轻声呼唤。看来别的东西能听懂。一只白鸽扑棱棱飞进窗来，接着又是一只，然后是第三只。白鸽越来越多，很快，整个房间里都是盘旋的翅膀和温柔的咕咕声。柔软的白羽毛纷纷飘下来，像下了一场雪。
        - id: ch01-b42
          speaker: narrator
          text: 随后，鼹鼠不再出声。刚才挤满房间的白鸽又一只接一只穿过小窗口，展开翅膀滑翔出去，回到外面那个蓝色和金色的世界。
        - id: ch01-b43
          speaker: mole
          text: 爬到椅子上去，别挡着。
        - id: ch01-b44
          speaker: narrator
          text: 埃尔弗丽达听话地爬上椅子。一阵轻风吹进了小房间。那阵风仿佛来自围墙环绕的花园，在明亮的夏日清晨轻轻吐息，把玫瑰花瓣一片片摇落。地板上的白羽毛被这阵甜美的风吹动，先聚成一小堆一小堆，又排成一道道直线和弧线。等它们停下来，一座完整的钟面已经铺在满是灰尘的地板上。钟面的数字、长针、短针和秒针，样样都不少。白鼹鼠精正站在最中央。
        - id: ch01-b45
          speaker: mole
          text: 所有白色的东西都听我号令。来，坐到分针上。你一眨眼就能到那儿。
        - id: ch01-b46
          speaker: elfrida
          text: 到哪儿？
        - id: ch01-b47
          speaker: mole
          text: 当然是到他们打开嵌板的时候。先让我离开钟面。还有，把起居室钥匙给我。这样反而省时间。
        - id: ch01-b48
          speaker: narrator
          text: 埃尔弗丽达坐上分针。分针立刻转起来，快得简直没法想象。可坐在上面却柔软极了，像坐在一朵云上，假如自然法则曾经准许你坐在云上的话。指针不停飞转，她却觉得根本没过多久。下一刻，她已经坐在地板上。耳边传来了说话声，她也立刻知道，秘密嵌板已经打开了。
        - id: ch01-b49
          speaker: elfrida
          text: 我明白了。它真的能倒着走，对不对？
        - id: ch01-b50
          speaker: narrator
          text: 没有人回答。白鼹鼠精已经不见了。地上还留着白鸽羽毛，可那座钟面消失了。
        - id: ch01-b51
          speaker: narrator
          text: 嵌板另一边，埃德雷德很快就看厌了《红棉睡帽国》。那本书远没有书名听起来有趣，哪怕对大人也是这样。他又从书架上取了好几本，挨着试过去。可不知为什么，现在看什么书都不好玩了。屋子里安静得太过分，外面的钟又滴答得响过了头。埃尔弗丽达被关在嵌板后面，窗上装着铁栏，起居室的门又上了锁。他来来回回地走，又轮流坐遍每一把椅子。没有一把椅子坐着舒服，他脑子里冒出来的每个念头也同样不舒服。
        - id: ch01-b52
          speaker: narrator
          text: 万一永远没人来呢？万一他年复一年做着囚徒，最后成了白发老人，像巴士底狱里的人，或是那个戴着铁面具的人呢？一想到这里，他眼里就涌出了泪水。幸好他没想到另一件事。要是没人很快赶来，他多半根本活不到白发苍苍，因为人不能一直不吃东西。要是连这一点也想到了，他会比现在更加难过，而他已经难过得十分够了。
        - id: ch01-b53
          speaker: narrator
          text: 后来，他又怕埃尔弗丽达出了什么事。嵌板里面安静得吓人，一点声音也没有。他真希望没有跟她吵架，现在一切都悲惨极了。他学着姐姐走到窗前，想找找有没有红色或紫色的人影正在翻过山丘。可外面什么也没有。时间越拖越长，像一条油灰捏成的蛇，在温暖的手掌里越搓越细，越拉越长。最后，他又难过，又哭了好一阵。喝下午茶的时间早已过去，他终于倒在窗边的座位上睡着了。
        - id: ch01-b54
          speaker: narrator
          text: 一只手忽然落在他肩上，一个熟悉的声音喊着他的名字，把他从睡梦里唤醒。他睁开眼睛，下一刻就扑进伊迪丝姑妈怀里，隔着窗栏能扑进去多少，就扑进去多少。
        - id: ch01-b55
          speaker: narrator
          text: 他费了好一会儿，才说明埃尔弗丽达被困在哪里，房门钥匙又在哪里。说完，他又哭了，因为他还是不明白自己怎么才能出去。
        - id: ch01-b56
          speaker: aunt_edith
          text: 好啦，别做可爱的小傻瓜。实在没办法，我就去找锁匠。不过，你先瞧瞧，我从车站走来的路上捡到了什么。
        - id: ch01-b57
          speaker: narrator
          text: 她拿出一把钥匙，上面系着象牙牌，写着“阿登城堡起居室门”。
        - id: ch01-b58
          speaker: aunt_edith
          text: 你试试看吧。
        - id: ch01-b59
          speaker: narrator
          text: 钥匙果然正合适。埃德雷德开了起居室门，又打开前门让姑妈进来。他们从厨房搬来踏梯，找到秘密弹簧，推开嵌板，把满身灰尘的埃尔弗丽达救了出来。
        - id: ch01-b60
          speaker: narrator
          text: 伊迪丝姑妈在厨房生起炉火，又烧开了水。大家都迫切需要一顿下午茶，于是坐下来痛痛快快吃了一顿。姑妈还带来几块茶点小蛋糕。蛋糕上面涂着粉红色的糖霜，里面软绵绵的，还夹着杏子酱。吃着这些东西，两个孩子终于觉得一切又正常了。姑妈告诉他们，她准备留下来，一直住到星期天以后。
        - id: ch01-b61
          speaker: narrator
          text: 发现那块秘密嵌板，让伊迪丝姑妈和两个孩子一样兴奋。喝过茶以后，埃德雷德先去把埃米莉叫了回来。她还留在车站寻找根本找不到的包裹，这下总算结束了那场徒劳的追寻。随后，姑妈带着侄女和侄子钻进嵌板，把秘密楼梯和秘密房间从头到尾、彻彻底底探查了一遍。
        - id: ch01-b62
          speaker: aunt_edith
          text: 这么多鸽子羽毛，真了不得！一定是一年又一年积下来的。
        - id: ch01-b63
          speaker: edred
          text: 幸亏你捡到了钥匙。也不知道是谁掉的。埃尔芙，另一把在哪儿？
        - id: ch01-b64
          speaker: elfrida
          text: 我不知道。反正现在不在我口袋里了。
        - id: ch01-b65
          speaker: narrator
          text: 埃德雷德和姑妈搜遍了秘密藏身处的每个角落，却怎么也找不到另一把钥匙。只有埃尔弗丽达知道，那把钥匙已经交给了白鼹鼠精。霍尼塞特太太又一口咬定，她在城堡当家的这些年，起居室的钥匙从来没有系过任何牌子。因此，路上的钥匙和那块写得清清楚楚的象牙牌，更显得奇怪了。
        - id: ch01-b66
          speaker: narrator
          text: 看来事情只能是这样。鼹鼠把埃尔弗丽达的钥匙放到小路上，让伊迪丝姑妈捡到，还怕她弄错，特地系了标签。标签从哪儿来，那又是另一个问题。不过，给钥匙找标签实在简单，我自己就办到过。拿白鸽羽毛拼成钟面就难多了，我从没成功。至于叫时间照那座钟的意思，想快就快，想慢就慢，好吧，我看连你也办不到。
        - id: ch01-b67
          speaker: narrator
          text: 回到普通世界，埃尔弗丽达反而松了口气。这里不会有施魔法的鼹鼠把钟表搅乱。只要有一位好心的姑妈，还有那些能让普通人着迷的古老游戏，日子就可以过得很快活。他们玩“寻找顶针”，玩“我想的东西像什么”，也玩“谚语”。三个人一起过了一个愉快的周末。伊迪丝姑妈还把房客和海边小屋的事情全都讲给他们听。那些事明明发生在不久以前，现在听来却已经又远又久了。
        - id: ch01-b68
          speaker: narrator
          text: 星期天傍晚，他们从阿登教堂往家走。做礼拜时，他们努力专心听讲，尽量不去看圣坛周围那些坟墓和纪念碑。长眠在那里的人，全是早已死去的阿登家族成员。回去的路上，三个人在阿登丘上坐下来。伊迪丝姑妈开始解释遗嘱、受托人和收入，讲得远远超过孩子们能够听懂的程度。可是，她肯告诉他们这些大人的事，好像相信他们真的可以听明白。这让两个孩子非常高兴，也觉得自己受到了尊重。
        - id: ch01-b69
          speaker: narrator
          text: 等这番谈话结束，有一件事留在他们心里，像一艘船被涨起的潮水冲上了岸。阿登城堡虽然属于他们，用来维持城堡的钱却少得可怜。所以人人都得非常节省，谁也不能有半点挥霍。星期一清早，伊迪丝姑妈就要离开，回到那个满是律师、遗嘱和受托人的世界。她不在的时候，两个孩子必须做两个非常乖的孩子，不给霍尼塞特太太添麻烦。还有，他们绝对、绝对不能再把自己反锁起来，又把钥匙藏进什么自以为安全的地方。
        - id: ch01-b70
          speaker: narrator
          text: 暮色在丘陵上轻轻淡去。愉快的谈话结束后，这些话久久留了下来。
        - id: ch01-b71
          speaker: narrator
          text: 还有一件事也留了下来。两个孩子送伊迪丝姑妈上了火车，挥手道别。回家的路上，埃德雷德终于把它说了出来。
        - id: ch01-b72
          speaker: edred
          text: 我们非找到宝藏不可，这件事实在非常要紧。有了宝藏，维持城堡就不费事了。当然，得先把城堡重新修建好，然后才能维持。这一回，我们不要什么旧钟，也别再让我们俩的时间对不上。等吵架满了三天，我们马上一起去阁楼，请白鼹鼠精把我们送到一个时代，让我们能亲眼看见宝藏到底藏在什么地方。我觉得这个主意真的很不错，你说呢？
        - id: ch01-b73
          speaker: narrator
          text: 他问得谦逊，却又忍不住有点得意。
        - id: ch01-b74
          speaker: elfrida
          text: 非常不错。还有，埃德雷德，只要我忍得住，以后再也不想吵架了。吵架太浪费时间，还会把一切耽搁得厉害。玩“谚语”时不是说过吗，拖延是危险的。要是宝藏就在眼前，我们却因为吵架得等三天，那可怎么办？不过我发现，就算稍微吵过，也能叫鼹鼠来帮忙。因为我已经叫来过一次。
        - id: ch01-b75
          speaker: narrator
          text: 她把秘密房间里的经过讲给了弟弟。
        - id: ch01-b76
          speaker: elfrida
          text: 不过我猜，只有我陷进最可怕的困境，对人能给的帮助全都绝望了，它才肯来。
        - id: ch01-b77
          speaker: edred
          text: 好吧，我们现在还没到那种地步。谢天谢地，远远没到。
        - id: ch01-b78
          speaker: narrator
          text: 他说着，用手杖敲掉一朵罂粟花的脑袋。
        - id: ch01-b79
          speaker: elfrida
          text: 不知道女巫住过的茅屋，如今是谁住着。我清清楚楚记得那地方。不过，屋子多半已经拆了。我们从那边绕回去吧，总算有件事可做。
        - id: ch01-b80
          speaker: narrator
          text: 那条路很好找。可到了波尼时代那间破茅屋所在的地方，他们只看见一座蓝灰石板屋顶的小房子。它的墙是黄砖砌的，上面贴着一张蓝色告示，说这里出售某某人的一级姜汁汽水和最新式矿泉水。新房子看起来十分无趣。两个孩子身上碰巧又没有闲钱，买不了姜汁汽水，只好转身准备回家。
        - id: ch01-b81
          speaker: narrator
          text: 就在这时，他们忽然发现一个女人站在面前。她身上穿着红黑格子的上衣，还有一条从店里买来的黑色成衣裙，头上却戴着一顶男人的鸭舌帽。如今乡下女人都爱戴这种帽子，再也不戴我小时候常见的那种漂亮遮阳软帽了。
        - id: ch01-b82
          speaker: witch
          text: 原来他们把老茅屋拆了。这座新房子一定又干又舒服。旧屋顶总漏雨，躺在里面简直和露天躺在草地上一样。
        - id: ch01-b83
          speaker: narrator
          text: 两个孩子客客气气地听她说话，心里却都在猜，自己从前究竟在哪里见过这个女人。她的脸让人觉得异样地熟悉，可他们偏偏又像根本不认识她。
        - id: ch01-b84
          speaker: witch
          text: 附近大多数茅屋还是和从前一样糟。等阿登家拿到宝藏，他会让穷人住得又暖又干，对不对？
        - id: ch01-b85
          speaker: narrator
          text: 两个孩子一下子认出了她，她也知道他们认出来了。
        - id: ch01-b86
          speaker: edred
          text: 啊，我知道了。你就是我们见过的那个人！
        - id: ch01-b87
          speaker: witch
          text: 不错，我就是古时候那个女巫。你们既然能往回走，我当然也能往前来。只要知道怎么造钟，过去和现在就是一回事。
        - id: ch01-b88
          speaker: elfrida
          text: 你会造钟？我还以为只有白鼹鼠精会呢。
        - id: ch01-b89
          speaker: witch
          text: 就是它。我不会造，可我认识会造的。我来找你们，是因为你们送过我茶叶和糖。我有一双智慧眼，向前向后都看得见。我向前看见你们，向后看见你们要找的东西。我知道宝藏在哪儿，还能带你们去找。
        - id: ch01-b90
          speaker: edred
          text: 可你这身衣服是从哪儿弄来的？
        - id: ch01-b91
          speaker: narrator
          text: 后来，他会有充分的理由后悔问了这句话。
        - id: ch01-b92
          speaker: witch
          text: 哎呀，衣服最好弄了。要是只管衣服，我现在就能变成头戴王冠的女王。
        - id: ch01-b93
          speaker: narrator
          text: 孩子们眼前一晃，马铃薯地一道道篱笆前，仿佛真的站着一位贵妇。她身披深红色的袍子，围着白鼬皮，头上还戴着金冠。他们吃惊地眨了眨眼。再看时，那些深红和金色全都不见了。马铃薯地前依旧只有那个女巫，穿着暗淡的衣裳，戴着男人的鸭舌帽。
        - id: ch01-b94
          speaker: edred
          text: 那你是怎么到这儿来的？
        - id: ch01-b95
          speaker: witch
          text: 我的花母鸡正伏在钟面上。我从它的嘴尖画出一条粉笔线，一直通到奇妙世界，这才把它安定住。它要是醒过来，我就得回到那边，以后再也来不了这儿，一次也不成。亲爱的孩子们，所以你们得赶快跟我到城堡去。我太姥姥还是小姑娘时，亲眼看见他们把宝藏藏在哪儿。现在我就带你们去看。
        - id: ch01-b96
          speaker: narrator
          text: 三个人沿着两边陡峭的乡间小路匆匆向下走。
        - id: ch01-b97
          speaker: witch
          text: 我姥姥不知指给我看过多少次。宝藏就紧挨着一个地方。
        - id: ch01-b98
          speaker: narrator
          text: 她的话还没有说完，整个人突然就不见了。刚才还有三个人匆匆赶路，现在乡间小路上只剩下埃德雷德和埃尔弗丽达。事情一定是这样，那只花母鸡不知什么时候摆脱了“安定”，已经从钟面上站起来了。
        - id: ch01-b99
          speaker: edred
          text: 她真的走了。这下我们永远也不会知道宝藏在哪儿了。偏偏就在她马上要说出位置的时候！这件事真是蠢得不能再蠢。
          emotion: angry
        - id: ch01-b100
          speaker: elfrida
          text: 蠢得不能再蠢的人是你！你干吗非要问她那身蠢衣服？就是你问的那个问题坏了事。要不是你把时间白白浪费在衣服上，她早就把宝藏藏在哪里告诉我们了。衣服到底有什么要紧？我真希望你偶尔也能表现得像个有脑子的人！
          emotion: angry
        - id: ch01-b101
          speaker: edred
          text: 继续说啊！好像事情还不够讨厌似的。现在又要等三天，就因为你没完没了地数落我。女孩子总是这样，一点儿没错！
          emotion: angry
        - id: ch01-b102
          speaker: elfrida
          text: 我……我很抱歉。我们做一件好事补回来吧。我把那本配着铅芯珍珠母笔的笔记本送给你。然后，我们再挨家挨户去看看，找出哪些茅屋还在漏雨。等我们找到宝藏，就能马上把那些屋子全都修好。
        - id: ch01-b103
          speaker: edred
          text: 我不想做好事。我可没有先吵架，把一切又往后推迟三天。可是我现在偏要吵！我就是不明白，凭什么一切都已经毁了，我却连一句自己想说的话都不能说？
          emotion: angry
        - id: ch01-b104
          speaker: elfrida
          text: 别这样！不想吵却吵起来已经够糟了，故意找架吵怎么行？别这样！
        - id: ch01-b105
          speaker: narrator
          text: 埃德雷德没有再说一句话，只顾用靴子踢着路上的尘土。埃尔弗丽达也沉默下来。两个人一路闷声不响，心里都阴郁极了，就这样慢慢走回城堡。
        - id: ch01-b106
          speaker: narrator
          text: 到了大门口，埃德雷德停下来。
        - id: ch01-b107
          speaker: edred
          text: 你要是愿意，我们现在就和好。我刚想到，也许三天是从吵架结束以后才开始算。
        - id: ch01-b108
          speaker: elfrida
          text: 我懂了。我们拖得越久，三天就开始得越晚。
        - id: ch01-b109
          speaker: edred
          text: 对。所以讲和吧，别再浪费时间了。
