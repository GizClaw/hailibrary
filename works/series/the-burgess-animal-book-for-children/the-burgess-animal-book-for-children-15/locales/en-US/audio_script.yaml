  chapters:
    - id: ch01
      title: Whitefoot Gets a Message
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Whitefoot the Wood Mouse was one of the smallest little people in the Green Forest, and one of the most timid. Hungry enemies watched for him by day and by night. Whenever he was out where they might see him, he never forgot those sharp eyes for a single instant. One careless minute might be the end of little Whitefoot and a fine dinner for someone who liked tender Mouse.
        - id: ch01-b02
          speaker: narrator
          text: He seldom went more than a few feet from a safe hiding place. The smallest sound made him start nervously and often sent him darting back under cover before he knew whether danger was really there. Waiting to make sure might mean waiting too long, so Whitefoot thought it better to be safe than sorry. If you and I had as many real alarms in a year as Whitefoot had in one day, without even counting the false ones, we might lose our minds. We certainly would be the unhappiest people in the Great World.
        - id: ch01-b03
          speaker: narrator
          text: But Whitefoot was not unhappy at all. He was a very cheerful little fellow. His pretty little head held plenty of wisdom and more good sense than some much larger heads. When neighbors teased him for being so very timid, he did not pretend to be brave or lose his temper. He simply told them what he thought.
        - id: ch01-b04
          speaker: whitefoot_the_wood_mouse
          text: "Of course I'm timid. I'm afraid of almost everything, and I'd be foolish if I weren't. Fear is why I'm alive and happy now. I hope I never become less careful. Sooner or later, I might not run soon enough, and then I'd be eaten. Being timid isn't cowardly when danger is everywhere. Taking a foolish risk isn't bravery, either. That's why I stay near home. Going far isn't safe for me, and I know it."
        - id: ch01-b05
          speaker: narrator
          text: You can guess, then, how Whitefoot felt when Chatterer the Red Squirrel spotted him and called out with a message from Old Mother Nature.
        - id: ch01-b06
          speaker: chatterer_the_red_squirrel
          text: "Hello there, Mr. Fraidy! I saw you duck under that log. Come out. I've got a message for you!"
        - id: ch01-b07
          speaker: narrator
          text: Whitefoot slowly and carefully poked his head from beneath the old log. He looked up at Chatterer with suspicion.
        - id: ch01-b08
          speaker: whitefoot_the_wood_mouse
          text: "What sort of message is it?"
        - id: ch01-b09
          speaker: chatterer_the_red_squirrel
          text: "One you had better listen to. It comes from Old Mother Nature."
        - id: ch01-b10
          speaker: whitefoot_the_wood_mouse
          text: "Old Mother Nature sent a message for me?"
          emotion: surprised
        - id: ch01-b11
          speaker: narrator
          text: Whitefoot crept a little farther from under the log.
        - id: ch01-b12
          speaker: chatterer_the_red_squirrel
          text: "That's what I told you. Take my advice and pay attention. She wants you at school with the rest of us tomorrow morning when the sun comes up."
        - id: ch01-b13
          speaker: narrator
          text: Chatterer explained all about the school. He told Whitefoot where everyone met each morning and how much he and his friends had already learned. Whitefoot listened with something very close to dismay in his heart. The school seemed very far away to a little Mouse, though Peter Rabbit or Jumper the Hare would not have thought much of the distance. Whitefoot would have to leave every one of his familiar hiding places behind. The very thought made him shiver.
        - id: ch01-b14
          speaker: narrator
          text: Still, Old Mother Nature had called for him, and he never once considered disobeying her.
        - id: ch01-b15
          speaker: whitefoot_the_wood_mouse
          text: "You said school starts at sunrise, didn't you?"
        - id: ch01-b16
          speaker: narrator
          text: Chatterer nodded, and Whitefoot gave a relieved sigh.
        - id: ch01-b17
          speaker: whitefoot_the_wood_mouse
          text: "Good. I can make the trip at night, when it's much safer. I'll be there, unless something catches me along the way."
    - id: ch02
      title: Danny Starts Early
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: Meanwhile, Peter Rabbit was searching the Green Meadows for Danny Meadow Mouse. Danny lived near the dear Old Briar-patch, and the two were very good friends. Peter knew where to look and soon found him.
        - id: ch02-b02
          speaker: danny_meadow_mouse
          text: "Hello, Peter! You look as though you've got something important to say."
        - id: ch02-b03
          speaker: peter_rabbit
          text: "I have. Old Mother Nature sent you a message. She wants you at school in the Green Forest tomorrow at sunrise. You'll be there, of course."
        - id: ch02-b04
          speaker: danny_meadow_mouse
          text: "Of course I will. If Old Mother Nature truly sent for me, then..."
        - id: ch02-b05
          speaker: peter_rabbit
          text: "She certainly did."
        - id: ch02-b06
          speaker: danny_meadow_mouse
          text: "Then I must obey."
        - id: ch02-b07
          speaker: narrator
          text: Danny's face grew very serious.
        - id: ch02-b08
          speaker: danny_meadow_mouse
          text: "That's a long journey for me, Peter. I wouldn't travel so far for anyone else. Old Mother Nature understands, and she must believe I can reach the school safely. What time must I arrive?"
        - id: ch02-b09
          speaker: peter_rabbit
          text: "At sunrise. Would you like me to stop for you on my way?"
        - id: ch02-b10
          speaker: narrator
          text: Danny shook his head and began to laugh. Peter could not see what was funny.
        - id: ch02-b11
          speaker: peter_rabbit
          text: "What are you laughing about?"
        - id: ch02-b12
          speaker: danny_meadow_mouse
          text: "Just imagine my short legs trying to keep up with yours! But please sit up and look all around. Make sure Old Man Coyote, Reddy Fox, Redtail the Hawk, and Black Pussy, that troublesome cat from Farmer Brown's, are nowhere nearby."
        - id: ch02-b13
          speaker: narrator
          text: Peter willingly sat up. He looked one way, then another, then turned to search the other way too. Old Man Coyote was not there. Neither were Reddy Fox, Redtail the Hawk, or Black Pussy. Peter saw no one that either he or Danny needed to fear, and he said so.
        - id: ch02-b14
          speaker: peter_rabbit
          text: "Why did you need to know?"
        - id: ch02-b15
          speaker: danny_meadow_mouse
          text: "Because I'm leaving right now."
        - id: ch02-b16
          speaker: peter_rabbit
          text: "Leaving for where?"
        - id: ch02-b17
          speaker: narrator
          text: Peter looked completely puzzled.
        - id: ch02-b18
          speaker: danny_meadow_mouse
          text: "For school, of course."
        - id: ch02-b19
          speaker: peter_rabbit
          text: "But school doesn't start until tomorrow morning!"
        - id: ch02-b20
          speaker: danny_meadow_mouse
          text: "That's exactly why I'm starting now. If I put off leaving until the last moment, I may never get there at all. I'd have to rush, and it is difficult to hurry while keeping a proper watch for danger. I've noticed that people who wait until the last minute and then rush are very likely to run straight into trouble. The way is clear now, so I'm going. I can take my time and keep a careful lookout. I'll meet you there in the morning, Peter."
        - id: ch02-b21
          speaker: narrator
          text: Danny turned into one of his own little paths through the tall grass and disappeared. Peter saw that he was heading toward the Green Forest.
    - id: ch03
      title: Whitefoot at School
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: When Peter and the others reached school the next morning, Whitefoot and Danny were already there with Old Mother Nature. Both little Mice were usually very timid, but while they were safely beside her, much of that fear seemed to have left them. Whitefoot sat on the end of a log, and Danny waited on the ground just below him.
        - id: ch03-b02
          speaker: old_mother_nature
          text: "Take a good look at these two little cousins. They will show you how different cousins can be. Whitefoot is also called Deer Mouse, and he is one of the prettiest members of the Mouse family. He may have gotten that name because the top of his coat is a lovely fawn color. The top of his long, slender tail matches it. Underneath, the tail is white, just like the whole lower part of his body. His delicate feet are white too, and that is why we call him Whitefoot. Look at those large, soft black eyes and those fine ears, which are quite a good size."
        - id: ch03-b03
          speaker: old_mother_nature
          text: "Short, fine hair covers his tail. It is not bare like the tail of Nibbler the House Mouse, whom I will tell you about later. Whitefoot loves the Green Forest. Far out in parts of the West, though, there is no Green Forest. There he makes his home on open plains covered with brush. He climbs well and feels perfectly at home among the branches. Up in a tree, he seems almost like a tiny Squirrel. Whitefoot, tell us where you make your home and what you eat."
        - id: ch03-b04
          speaker: whitefoot_the_wood_mouse
          text: "Right now, my home is in a hollow inside a dead branch of a certain tree. I think someone in the Woodpecker family made it, but no one was living there when I found it. Mrs. Whitefoot and I built a soft, warm nest inside. It suits both of us perfectly, and we wouldn't trade it for any other home. We have also lived in a hollow log on the ground, an old stump, a hole we dug beneath a rock, and an old bird's nest in a tall bush. We put a roof over that nest and made a small round doorway underneath. Once, we raised a family in a box in a dark corner of Farmer Brown's sugar camp."
        - id: ch03-b05
          speaker: whitefoot_the_wood_mouse
          text: "I eat many different things. I like seeds, nuts, insects, and meat whenever I can find it. I also save food for winter, as every sensible, hardworking person should."
        - id: ch03-b06
          speaker: peter_rabbit
          text: "Then you don't sleep all winter the way Johnny Chuck does, do you?"
        - id: ch03-b07
          speaker: whitefoot_the_wood_mouse
          text: "Certainly not! I enjoy winter. Running over the snow is great fun. Haven't you ever noticed my tracks, Peter?"
        - id: ch03-b08
          speaker: jumper_the_hare
          text: "I've seen plenty of them. I've also watched you hopping around after dark. I suppose you don't like daylight very much."
        - id: ch03-b09
          speaker: whitefoot_the_wood_mouse
          text: "I don't. I sleep through most of the day, then work and play at night because I feel safer. I often come out on cloudy days, though. What I really dislike is bright sunlight. That's one reason I stay in the Green Forest. I don't know how Cousin Danny can bear living out on the Green Meadows. I think it's his turn now."
    - id: ch04
      title: Danny's Meadow Life
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: Everyone turned to Danny Meadow Mouse. He looked as different from Whitefoot as two Mice could look while both still looked like Mice. There was nothing pretty or graceful about Danny, and he was not dainty at all. His body was rather stout, and his long fur made him appear even stouter. He had a blunt head and seemed to have no neck, though of course he did. His small eyes looked like tiny black beads. His ears nearly vanished in his fur. His legs were short, and his tail was so short that it looked as if it had stopped growing halfway.
        - id: ch04-b02
          speaker: narrator
          text: No, those two cousins did not look alike at all. Danny became more and more uncomfortable while everyone looked from him to handsome Whitefoot and compared them. Danny already knew he was homely, but he had never felt it quite so sharply before that morning. Old Mother Nature saw his discomfort and understood exactly how he felt.
        - id: ch04-b03
          speaker: old_mother_nature
          text: "What matters is not how we look. What matters is who we are, what we do, and how well we fit our own place in life. Danny may be homely, but he and I both know that he is made just right for his way of living. Being exactly as he is helps him live that life successfully."
        - id: ch04-b04
          speaker: old_mother_nature
          text: "Danny loves the fields and meadows, where grass is almost the only cover. Everything about him suits that home. Isn't that right, Danny?"
        - id: ch04-b05
          speaker: danny_meadow_mouse
          text: "Yes, ma'am, I suppose it is. Sometimes I do think my tail is much too short to look nice."
        - id: ch04-b06
          speaker: narrator
          text: Everyone laughed, and even Danny joined them. Then he remembered the time Reddy Fox had come so close to catching him. One of Reddy's black paws had touched the very tip of Danny's tail. If that tail had been any longer, Reddy would have caught him by it. Danny's troubled face cleared at once.
        - id: ch04-b07
          speaker: danny_meadow_mouse
          text: "On second thought, my tail is exactly right for me."
          emotion: happy
        - id: ch04-b08
          speaker: old_mother_nature
          text: "That is wisely said, Danny. Now tell us how you live, what you eat, and anything else worth knowing about you."
        - id: ch04-b09
          speaker: danny_meadow_mouse
          text: "I don't think there's much worth telling. I'm only one of the plain, ordinary little folks. Everyone probably knows me so well already that I have nothing to add."
        - id: ch04-b10
          speaker: jumper_the_hare
          text: "Some may know everything about you, but I don't. I never visit the Green Meadows where you live. How can you travel through all that tall grass?"
        - id: ch04-b11
          speaker: danny_meadow_mouse
          text: "Oh, that's simple. I cut little paths running in every direction."
        - id: ch04-b12
          speaker: peter_rabbit
          text: "That's just what I do in the dear Old Briar-patch."
        - id: ch04-b13
          speaker: danny_meadow_mouse
          text: "I keep every one of those paths clean and open. That way, nothing can trip me when I have to run for safety. Once the grass grows tall, the paths become almost like little tunnels. The time I dread most comes when Farmer Brown cuts the grass for hay. First I must watch out for that terrible mowing machine. Then, after he carries the hay away, the remaining grass is so short that keeping myself out of sight becomes very hard work."
        - id: ch04-b14
          speaker: danny_meadow_mouse
          text: "Sometimes I dig a short burrow and build a comfortable nest of dry grass at the far end. In summer, Mrs. Danny and I may put our nest right on top of the ground. We choose a hollow or a clump of tall grass, especially where the land is low and wet. We raise several good-sized families every year. All Meadow Mice believe in having large families. That is probably why there are more Meadow Mice than any other kind of Mouse in the country. I forgot to mention that people also call me Field Mouse."
        - id: ch04-b15
          speaker: old_mother_nature
          text: "And because there are so many Meadow Mice, and because they all need so much to eat, they do a great deal of damage to grass and other crops. Danny eats grass, clover, bulbs, roots, seeds, and vegetables from gardens. He eats some insects too. Sometimes he puts away a few seeds for winter, but he mostly depends on finding enough to eat from day to day. He stays active through the whole winter and tunnels beneath the snow while he searches for food."
        - id: ch04-b16
          speaker: old_mother_nature
          text: "When other food becomes scarce, Danny eats bark. That can cause great damage in young orchards. He gnaws the bark from young fruit trees in a complete ring, as high as he can reach, and that kills the trees. He does even more damage than Peter Rabbit."
        - id: ch04-b17
          speaker: old_mother_nature
          text: "Danny also forgot to say that he is a good swimmer and not at all afraid of the water. No one has more enemies than he does. The reason he is still alive and sitting here at school this morning is that he never stops watching for danger. That will do for today. Tomorrow, we will take up other members of the Mouse family."
