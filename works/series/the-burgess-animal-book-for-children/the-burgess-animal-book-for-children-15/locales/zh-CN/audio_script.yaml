audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 亲切生动，带着温和的幽默感
        timbre: 温暖清亮
        pace: 舒缓而富有变化
        pitch: 中等
    peter_rabbit:
      display_name: 彼得兔
      tts:
        delivery: 好奇直率，情绪来得快也去得快
        timbre: 清脆稚气
        pace: 轻快
        pitch: 中高
    mother_nature:
      display_name: 老大自然妈妈
      tts:
        delivery: 慈爱睿智，说话从容而坦率
        timbre: 温厚柔和
        pace: 从容
        pitch: 中低
    jumper_hare:
      display_name: 长耳野兔跳跳
      tts:
        delivery: 朴实腼腆，认真时透着好奇
        timbre: 清朗柔和
        pace: 稍缓
        pitch: 中等
    chatterer:
      display_name: 红松鼠喋喋
      tts:
        delivery: 伶牙俐齿，争强好胜又活泼
        timbre: 尖细清亮
        pace: 明快
        pitch: 高
    whitefoot:
      display_name: 林鼠白足
      tts:
        delivery: 谨慎机敏，胆怯中透着清醒和坦然
        timbre: 轻柔清澈
        pace: 稍快而小心
        pitch: 中高
    danny_meadow_mouse:
      display_name: 草地田鼠丹尼
      tts:
        delivery: 朴实谦逊，遇事谨慎又很有主见
        timbre: 温和结实
        pace: 稳健
        pitch: 中等
  chapters:
    - id: ch01
      title: 第十五章　两个截然不同的小表亲
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 林鼠白足是绿森林里个头最小的居民之一。也正因为身子这么小，他格外胆怯。不论白天还是黑夜，总有饥饿敌人的利眼盯着他，白足自己也知道。只要待在可能被发现的外面，他就一刻也不敢忘记。哪怕疏忽一小会儿，小白足可能就从此没了，某个爱吃鲜嫩鼠肉的家伙却正好饱餐一顿。
        - id: ch01-b02
          speaker: narrator
          text: 所以，白足很少走到离藏身处几英尺以外的地方。哪怕只有一点儿响动，他也会紧张地跳起来，常常来不及确认危险，便躲了回去。真等到看清楚，也许就太晚了。小心些，总比事后后悔强。你我一年里若受上他一天那么多次真正的惊吓，再加上那些虚惊，恐怕早就发疯了。即便没有发疯，也会成了大千世界里最不快活的人。
        - id: ch01-b03
          speaker: narrator
          text: 白足却一点儿也不苦恼，恰恰相反，他是个非常快活的小家伙。那颗漂亮的小脑袋里装着不少智慧，比某些硕大的脑袋更明白事理。邻居笑他胆子实在太小，他既不装出不害怕的样子，也不会生气，只会坦坦荡荡地回答。
        - id: ch01-b04
          speaker: whitefoot
          text: “我当然胆小，而且几乎什么都怕。要是不怕，那才傻呢。正因为害怕，我现在才能活得好好的，还这么快活。我希望自己永远这样小心。胆子一大，迟早会有一次逃得不够快，叫人一口吞掉。”
        - id: ch01-b05
          speaker: whitefoot
          text: “四周到处有危险，胆小不等于懦弱，冒愚蠢又没必要的险也不是勇敢。所以我很少走远。离家太远不安全，这一点我清楚得很。”
        - id: ch01-b06
          speaker: narrator
          text: 知道了白足的想法，你就能猜到，红松鼠喋喋发现他，要传达老大自然妈妈的口信时，他会有什么反应了。白足一看见喋喋，立刻钻到一根圆木底下。
        - id: ch01-b07
          speaker: chatterer
          text: “喂，胆小鬼先生！先别躲，我有口信给你！”
        - id: ch01-b08
          speaker: narrator
          text: 白足慢慢从老圆木下面探出脑袋，谨慎地抬眼看着喋喋。
        - id: ch01-b09
          speaker: whitefoot
          text: “是什么口信？”
        - id: ch01-b10
          speaker: chatterer
          text: “是老大自然妈妈捎来的。你最好认真听，也照着去办。”
        - id: ch01-b11
          speaker: narrator
          text: 一听见老大自然妈妈，白足又往外探出一点身子。
        - id: ch01-b12
          speaker: whitefoot
          text: “老大自然妈妈捎口信给我？”
          emotion: surprised
        - id: ch01-b13
          speaker: chatterer
          text: “我说的就是她。她要你明天太阳升起时，和我们大家一起去上课。你要听我的劝，就别把这话当耳边风。”
        - id: ch01-b14
          speaker: narrator
          text: 喋喋接着讲起那所学校，告诉白足每天早晨在哪里开课，自己和朋友们已经学到了多少东西。白足越听越不安。上课的地方对彼得兔和跳跳不算远，对他却是一段长路。要走到那里，他就得离开一个又一个熟悉的藏身处。只要想到自己会暴露在外，他就忍不住打哆嗦。
        - id: ch01-b15
          speaker: narrator
          text: 可口信既然来自老大自然妈妈，他根本没想过违抗，只问清是不是太阳一升起就开课。看见喋喋点头，白足终于松了一口气。
        - id: ch01-b16
          speaker: whitefoot
          text: “那就好。我可以趁夜赶路，安全得多。我一定去。只要……只要没在路上被捉住。”
        - id: ch01-b17
          speaker: narrator
          text: 与此同时，在绿草原上，彼得兔正在寻找草地田鼠丹尼。丹尼的家离亲爱的老荆棘丛不远，他和彼得过去是、现在也仍是很要好的朋友。彼得大致知道该去哪里找，没花多少时间就看见了他。
        - id: ch01-b18
          speaker: danny_meadow_mouse
          text: “你好啊，彼得！你跑得这么急，心里一定装着什么要紧事吧？”
        - id: ch01-b19
          speaker: peter_rabbit
          text: “没错，我有口信给你。老大自然妈妈要你明天太阳升起时，准时到绿森林去上课。你当然会去吧？”
        - id: ch01-b20
          speaker: danny_meadow_mouse
          text: “当然会去。要真是老大自然妈妈叫我——”
        - id: ch01-b21
          speaker: peter_rabbit
          text: “真的是她。”
        - id: ch01-b22
          speaker: danny_meadow_mouse
          text: “那我就只能听话了。不过，彼得，这段路对我可不近。换了别的事情，或者换成别的任何人来叫，我都绝不会走这么远。老大自然妈妈心里有数。她既然叫我去，一定相信我能平平安安赶到。你说我得什么时候到？”
        - id: ch01-b23
          speaker: narrator
          text: 说到路远时，丹尼的神情变得十分严肃。
        - id: ch01-b24
          speaker: peter_rabbit
          text: “太阳升起时。要不要我明天路过这里，再来叫你？”
        - id: ch01-b25
          speaker: narrator
          text: 丹尼摇摇头，忽然笑了起来。彼得不明白他在笑什么。
        - id: ch01-b26
          speaker: danny_meadow_mouse
          text: “我在笑自己这双小短腿，怎么可能跟得上你。你帮我立起身子，仔细朝四面看看吧。老郊狼、狐狸雷迪、红尾鹰，还有布朗农夫家那只讨厌的黑猫，都不在附近吗？”
        - id: ch01-b27
          speaker: narrator
          text: 彼得很乐意帮忙。他朝这边看看，又朝那边看看，再换个方向看了看。那些让他和丹尼害怕的家伙，一个也没有出现。彼得说四周安全，又问丹尼为什么要打听。
        - id: ch01-b28
          speaker: danny_meadow_mouse
          text: “因为我要马上出发。”
        - id: ch01-b29
          speaker: peter_rabbit
          text: “出发去哪里？”
        - id: ch01-b30
          speaker: danny_meadow_mouse
          text: “当然是去学校。”
        - id: ch01-b31
          speaker: peter_rabbit
          text: “可学校要到明天太阳升起时才开课呀！”
        - id: ch01-b32
          speaker: danny_meadow_mouse
          text: “正因为这样，我才现在走。拖到最后再出发，我可能根本赶不到。到时候非得匆匆忙忙，可一边赶路，一边提防危险，实在很难。我见过不少人把事情拖到最后，接着慌忙去做，结果一头撞进麻烦里。”
        - id: ch01-b33
          speaker: danny_meadow_mouse
          text: “眼下道路安全，我正好动身。这样可以慢慢走，也能仔细留意危险。彼得，明早咱们在学校见。”
        - id: ch01-b34
          speaker: narrator
          text: 丹尼转过身，顺着高草里一条自用的小径消失了。彼得看得很清楚，他正朝绿森林走去。
        - id: ch01-b35
          speaker: narrator
          text: 第二天早晨，彼得和伙伴们到了学校，只见白足和丹尼已经跟老大自然妈妈等在那里。有她保护，两个小家伙平日的胆怯仿佛消失了大半。白足坐在一根圆木末端，丹尼就在他下方的地面上。
        - id: ch01-b36
          speaker: mother_nature
          text: “大家仔细看看这两个小表亲，就知道表亲之间也能有多么不同。白足既常叫林鼠，也常叫鹿鼠，是整个鼠科里最漂亮的成员之一。我想，人们叫他鹿鼠，大概是因为他上半身的外套呈漂亮的浅黄褐色，很像小鹿身上的颜色。”
        - id: ch01-b37
          speaker: mother_nature
          text: “他的长尾巴又细又秀气，上面也是浅黄褐色，下面却是白的。整个下半身和四只精巧的小脚同样洁白，所以才得名白足。再看看他那双又大又柔和的黑眼睛，还有那对纤巧的耳朵。和他的脑袋相比，那双耳朵可不算小。”
        - id: ch01-b38
          speaker: mother_nature
          text: “白足的尾巴覆着细密短毛，不像家鼠啃啃的尾巴那样光秃秃。啃啃的事，我以后再讲。白足喜欢绿森林，不过在遥远西部没有森林的地方，他也会住在灌木丛生的平原。他很会爬树，待在枝头就像一只小松鼠。白足，说说你住在哪里，又吃些什么吧。”
        - id: ch01-b39
          speaker: whitefoot
          text: “我现在住在某一棵树的某一根枯枝里，那里有个很合适的树洞。我猜是啄木鸟家族的某位成员凿出来的，不过我发现时没有谁住。白足太太和我在里面铺了一个温暖柔软的窝。无论拿谁的家来换，我们都不肯。”
        - id: ch01-b40
          speaker: whitefoot
          text: “从前，我们也住过地上的空心圆木，住过老树桩，还住过自己在岩石下面挖出的洞。我们甚至住进过一只鸟儿留下的旧巢。那个鸟巢搭在高高的灌木丛里，我们给它加上顶，又在下面开了一扇圆圆的小门。有一次，我们还在布朗农夫制糖棚一个阴暗角落的箱子里养大了一窝孩子。”
        - id: ch01-b41
          speaker: whitefoot
          text: “种子、坚果、昆虫，我什么都吃，弄得到肉的时候也会吃。我还会把食物一点点储存起来，留着过冬。所有明智又勤俭的人都会这么做。”
        - id: ch01-b42
          speaker: peter_rabbit
          text: “这么说，你冬天不会像土拨鼠约翰尼那样睡觉吧？”
        - id: ch01-b43
          speaker: whitefoot
          text: “当然不睡！我喜欢冬天，在雪地上奔跑可好玩了。彼得，你难道没见过我的脚印吗？”
        - id: ch01-b44
          speaker: jumper_hare
          text: “我见过好多次，还见过你天黑以后在外面蹦蹦跳跳。看来你不大喜欢阳光。”
        - id: ch01-b45
          speaker: whitefoot
          text: “是不喜欢。白天我大多睡觉，夜里才干活、玩耍，那时更安全。天气阴沉时，我白天也会出来。我真正讨厌的是明亮的阳光，这也是我留在绿森林的一个原因。真不知道丹尼表弟怎么受得了绿草原上的太阳。好了，现在该轮到他了。”
        - id: ch01-b46
          speaker: narrator
          text: 大家一齐看向丹尼。只要还像一只鼠，他的模样就不可能和白足相差更多了。丹尼既不漂亮，也不优雅，浑身没有半点精巧的样子。他的身体颇为粗壮，因为毛很长，看着比实际更粗。脑袋圆钝钝的，脖子仿佛完全没有，虽然他当然还是有脖子的。
        - id: ch01-b47
          speaker: narrator
          text: 他的眼睛很小，像两颗小黑珠，耳朵几乎藏进了长毛里。四条腿很短，尾巴也短得像长到一半便被截断。没错，这两个表亲一点儿也不像。伙伴们把他和漂亮的白足放在一起比较，弄得他很不自在。他一直知道自己不好看，却从没像此刻这样深深感受到这一点。老大自然妈妈看见了，也明白他的心情。
        - id: ch01-b48
          speaker: mother_nature
          text: “真正要紧的不是模样，而是我们的本性、做过的事情，以及能不能在生活中找到适合自己的位置。丹尼虽说不好看，可我知道，他自己也明白，这副模样正好适合他的生活。正因为生得如此，他才能把日子过好。”
        - id: ch01-b49
          speaker: mother_nature
          text: “丹尼喜欢田野和草原，那里除了可以藏身的青草，几乎没有别的遮挡。可是，他身上的每一个地方，都恰好适合在那里生活。对不对，丹尼？”
        - id: ch01-b50
          speaker: danny_meadow_mouse
          text: “是的，夫人，我想是吧。可有时候，我还是觉得自己的尾巴短得太难看了。”
        - id: ch01-b51
          speaker: narrator
          text: 所有伙伴都笑了，连丹尼也笑了。接着，他想起狐狸雷迪有一回差点捉住自己。雷迪的一只黑爪已经碰到他的尾巴尖。那条尾巴若再长一点，就准会被抓住。想到这里，丹尼脸上的阴云散了。
        - id: ch01-b52
          speaker: danny_meadow_mouse
          text: “仔细想想，我的尾巴现在这样，正适合我。”
        - id: ch01-b53
          speaker: mother_nature
          text: “说得明智，丹尼。现在轮到你了。告诉大家，你怎样生活，吃些什么，再说说其他有趣的事吧。”
        - id: ch01-b54
          speaker: danny_meadow_mouse
          text: “我想，我身上没多少有趣的事。我只是个普普通通的小居民。大家对我都太熟悉了，实在没什么可讲的。”
        - id: ch01-b55
          speaker: jumper_hare
          text: “也许他们很了解你，我可不了解。我从不到你住的绿草原上去。草长得那么高，你怎么在里面来来往往呢？”
        - id: ch01-b56
          speaker: danny_meadow_mouse
          text: “那很容易。我朝四面八方开出一条条小路。”
        - id: ch01-b57
          speaker: peter_rabbit
          text: “就跟我在亲爱的老荆棘丛里做的一样。”
        - id: ch01-b58
          speaker: danny_meadow_mouse
          text: “我总把那些小路清理得干干净净。这样，真需要逃命的时候，路上绝不会有什么东西把我绊倒。草一长高，这些路几乎就成了一条条小隧道。我最害怕布朗农夫割草做干草的时节。那时我不但要躲开那台可怕的割草机，等干草全被运走以后，剩下的草又短得很，我想不让敌人看见就难了。”
        - id: ch01-b59
          speaker: danny_meadow_mouse
          text: “有时我会挖一条短地道，在尽头用干草铺个舒服的窝。到了夏天，丹尼太太和我也可能直接在地面筑窝。我们会选一处凹地，或者一丛高高的草，尤其是在地势低洼又潮湿的时候。我们一年养好几窝孩子，而且每一窝都有不少。”
        - id: ch01-b60
          speaker: danny_meadow_mouse
          text: “草地田鼠都喜欢大家庭，所以乡间的草地田鼠大概比其他任何鼠类都多。对了，我忘记说，人们也叫我田鼠。”
        - id: ch01-b61
          speaker: mother_nature
          text: “正因为你们家族成员这么多，每个成员又要吃掉不少食物，才会给青草和其他庄稼造成很大的损害。丹尼吃青草、苜蓿、球茎、草根、种子，还有菜园里的蔬菜。他也会吃一些昆虫。”
        - id: ch01-b62
          speaker: mother_nature
          text: “他偶尔储存一点种子过冬，不过主要还是靠四处找到足够的食物，因为整个冬天他都很活跃。他会在积雪下面挖出一条条通道，到处寻找吃的。别的食物难找时，他就改吃树皮，这样一来，有时会给新栽的果园造成很大的损害。”
        - id: ch01-b63
          speaker: mother_nature
          text: “他会围着小果树啃树皮，沿着树干能啃多高，就一直啃到多高。整整一圈树皮没了，果树当然也就死了。论起这件事造成的危害，他可比彼得兔还要糟糕。”
        - id: ch01-b64
          speaker: mother_nature
          text: “丹尼还有件事没说。他很会游泳，一点儿也不怕水。没有谁的敌人比他更多。他今天早晨还能活生生站在这里，平安来到学校和我们见面，全靠自己日复一日、时时刻刻仔细留神，一刻也不肯放松警觉。今天就讲到这里吧。明天，我们再来认识鼠科里的其他成员。”
