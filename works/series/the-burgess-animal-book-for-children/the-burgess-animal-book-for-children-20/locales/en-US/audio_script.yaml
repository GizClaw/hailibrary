  chapters:
    - id: ch01
      title: Four Busy Little Miners
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Peter Rabbit was scampering along to school. He was thinking of all sorts of things, but watching his steps seemed far too dull to bother with. Then he stubbed his toes. Yes, Peter really did. He gave an impatient little cry, stopped, and turned around to see what had tripped him. It was a low ridge where the surface of the ground had been pushed up just a little. Peter knew it was new because he had passed that same spot the day before.
        - id: ch01-b02
          speaker: narrator
          text: Peter chuckled. He was all alone, so he asked himself the question.
        - id: ch01-b03
          speaker: peter_rabbit
          text: "Well, isn't that funny? It surely is. I'm going to learn about Miner the Mole, and I stumble over one of those strange little ridges he keeps making. This wasn't here yesterday, so he must be working close by right now. Aha! Just as I thought!"
        - id: ch01-b04
          speaker: narrator
          text: Peter followed the little ridge with his eyes and saw that it ended only a short way from him. Then he looked again. The flat ground at the end began to rise as though something underneath were pushing it up, and the ridge grew longer before his eyes. Peter understood perfectly. Miner the Mole was down there, hidden beneath the surface and hard at work. He was boring a tunnel so close to the top of the ground that he could simply push the loose soil upward as he went. The roof of that new tunnel was the very ridge that had tripped Peter.
        - id: ch01-b05
          speaker: narrator
          text: Peter stayed and watched for a few minutes. Then he turned and raced away, lipperty-lipperty-lip, toward the Green Forest. By the time he reached school, he was quite out of breath, and everyone else had already arrived. Old Mother Nature was about to scold him for coming late. But one look at Peter's excitement made her change her mind.
        - id: ch01-b06
          speaker: old_mother_nature
          text: "What is it this time, Peter? Did you almost get caught on your way here?"
        - id: ch01-b07
          speaker: narrator
          text: Peter shook his head.
        - id: ch01-b08
          speaker: peter_rabbit
          text: "No, nothing like that. But I found something!"
        - id: ch01-b09
          speaker: narrator
          text: Happy Jack Squirrel snickered.
        - id: ch01-b10
          speaker: happy_jack_squirrel
          text: "Peter is forever finding something. What a great little discoverer! I suppose he has finally learned that if you want to arrive on time, you have to leave early enough."
        - id: ch01-b11
          speaker: peter_rabbit
          text: "That's not true!"
          emotion: angry
        - id: ch01-b12
          speaker: old_mother_nature
          text: "Don't mind him, Peter. Tell us what you found."
          emotion: calm
        - id: ch01-b13
          speaker: peter_rabbit
          text: "The very animal we're studying is close by right now! Miner the Mole is digging in the Green Meadow, near the edge of the Green Forest. I thought you might want to hold our lesson there."
        - id: ch01-b14
          speaker: old_mother_nature
          text: "That's exactly what we'll do. We can see his work there, even if we can't see him. It's an excellent idea, Peter. We'll go now. Seeing a thing is always better than only hearing about it."
        - id: ch01-b15
          speaker: narrator
          text: Peter led everyone back to the spot where he had stumbled. The little ridge was already longer than it had been when he left. As the others crowded close to see it, the soil lifted once more, and the ridge stretched farther still. Old Mother Nature stooped over it and carefully made a small opening. Then she brought her lips close to the hole and told Miner to come out. Her voice was soft and pleasant, but there could be no doubt that she expected him to obey.
        - id: ch01-b16
          speaker: narrator
          text: He did. A strange, long, pointed nose soon poked through the hole. Then a squeaky voice spoke in a fretful tone.
        - id: ch01-b17
          speaker: miner_the_mole
          text: "Must I come all the way out?"
        - id: ch01-b18
          speaker: old_mother_nature
          text: "Yes, you must. Your friends and neighbors need a proper look at you, and one sharp nose is not enough. Come out now. No one will harm you. I'll keep you for only a few minutes, and then you may return to all that digging. Out you come!"
        - id: ch01-b19
          speaker: narrator
          text: The others gathered in a tight circle around the opening. Then one of the strangest little fellows in all the Great World scrambled into view. Only a few of them had ever seen him closely before. Miner was a stout little creature, about six inches from nose to tail. He wore the softest, thickest gray coat they could imagine. Behind him was a funny short tail, naked and pinkish white, which made Peter think at once of an Angleworm.
        - id: ch01-b20
          speaker: narrator
          text: Miner's head seemed to sit directly on his shoulders. There was hardly any neck to speak of. His nose was long and sharp, and it projected far past his mouth. The young students searched his furry head, but they could not see any eyes. They could not see his ears either.
        - id: ch01-b21
          speaker: narrator
          text: Striped Chipmunk immediately wanted to know how Miner could see.
        - id: ch01-b22
          speaker: striped_chipmunk
          text: "How can he see without any eyes?"
        - id: ch01-b23
          speaker: old_mother_nature
          text: "He doesn't see the way you do. His eyes are tiny things hidden beneath his fur. You might find them if you parted the hair around them, but they tell him only whether it is light or dark. Miner has no idea what any of you look like. He spends his whole life underground, where ordinary eyes would be of no use. Larger eyes would only trouble him. Unless they were protected as his are, dirt would be getting into them all the time."
        - id: ch01-b24
          speaker: old_mother_nature
          text: "If you felt his nose, you would find it hard because he bores through earth with it. And now look at those hands."
        - id: ch01-b25
          speaker: narrator
          text: Every eye turned toward Miner's hands. Not one of them had seen hands like those before. His arms were short, but they looked remarkably strong. His hands were short as well, yet what they lacked in length they made up in width. Long, sturdy claws armed every one. The strangest thing was the way Miner held those broad hands, with both of them turned outward. His hind feet were much less unusual and looked rather like the hind feet of the Mouse family.
        - id: ch01-b26
          speaker: narrator
          text: All this attention made Miner plainly uncomfortable. He wriggled and shifted about. Everyone could see that he had appeared only because Old Mother Nature had ordered him to, and that he longed to get back into his beloved earth. Old Mother Nature noticed his uneasiness and took pity on him. She picked him up gently and set him down where there was no tunnel opening close by.
        - id: ch01-b27
          speaker: old_mother_nature
          text: "Your neighbors have seen you now, Miner, and I know how uncomfortable this is. I have just one more request. Show us how you dig. Johnny Chuck thinks he is quite a digger, so let him see what you can do."
        - id: ch01-b28
          speaker: narrator
          text: Miner did not wait to be told twice. The instant Old Mother Nature stopped speaking, he pushed and bored into the ground with his sharp nose. One broad, spadelike hand slid forward beside his face. Its claws bit into the earth next to his nose, and then the hand swept backward, carrying the loosened soil with it. His other hand repeated the motion. Now everyone understood exactly why his hands turned outward. There was nothing slow about that boring nose or those shoveling hands. Peter had time for scarcely six long breaths before Miner the Mole had disappeared completely.
        - id: ch01-b29
          speaker: peter_rabbit
          text: "Now that is digging!"
          emotion: surprised
        - id: ch01-b30
          speaker: johnny_chuck
          text: "I'll never brag about my own digging again!"
        - id: ch01-b31
          speaker: narrator
          text: Johnny spoke with real admiration. Meanwhile, the ground began to lift where Miner had gone down, and another little ridge appeared. Everyone watched it lengthen with astonishing speed. Beneath the sod, the busy worker was driving his new tunnel toward his old passages. Miner was clearly in a great hurry to get back to the tunnels where he could work in peace.
        - id: ch01-b32
          speaker: happy_jack_squirrel
          text: "What a strange way to live! He can't have much fun. Staying in the dark all the time sounds awful to me."
        - id: ch01-b33
          speaker: old_mother_nature
          text: "Remember, he cannot see the way you can, so he likes the darkness. And he finds his fun in working. We call him Miner because he lives in the earth and is always making tunnels."
        - id: ch01-b34
          speaker: jumper_the_hare
          text: "What does he eat? Plant roots?"
        - id: ch01-b35
          speaker: narrator
          text: Old Mother Nature shook her head.
        - id: ch01-b36
          speaker: old_mother_nature
          text: "Many people believe that. They blame Miner for ruining crops and eating seed corn because his tunnels follow the rows of plants. But he is only searching around the roots for worms and grubs. He never touches the plants. Danny Meadow Mouse, or perhaps one of his cousins, might know who really ate the corn and the young plants. They rather enjoy using Miner's tunnels while he is away."
        - id: ch01-b37
          speaker: narrator
          text: Danny lowered his head and looked guilty, but he said nothing.
        - id: ch01-b38
          speaker: old_mother_nature
          text: "About the only harm Miner does comes when he tunnels too close to garden plants. Air can enter around the tender roots, and then the roots dry out. His own food is made up almost entirely of worms, grubs, and insects. He must eat a great many of them to stay alive, which is why he is always so active. His tunnels may seem to wander without any plan, but he makes them while searching for food. Of all that food, he is especially fond of Angleworms."
        - id: ch01-b39
          speaker: old_mother_nature
          text: "In fact, Miner is a useful little fellow. He becomes a nuisance to people mainly when his ridges cross their smooth lawns. Even then, he pays for the trouble by destroying the grubs among the grass roots. Those same grubs would destroy the grass if he left them there. When you see Miner's ridges, you know his food is close to the surface. In dry weather or cold weather, the worms travel deeper into the ground. Miner follows them down, so no trace of those deeper tunnels appears above."
        - id: ch01-b40
          speaker: old_mother_nature
          text: "Day and night make no difference to him. He works or sleeps whenever he wishes. During winter, he digs below the frozen ground. His fur is so thick that sand cannot work down into it. His home is a snug nest of grass or leaves inside an underground chamber. Several tunnels lead away from it, giving him quick ways out when danger comes."
        - id: ch01-b41
          speaker: peter_rabbit
          text: "Does Miner have any close relatives?"
        - id: ch01-b42
          speaker: old_mother_nature
          text: "He has several, and their habits are much alike. A little farther north lives Brewer's Mole, also called the Hairytailed Mole. His tail is a bit longer than Miner's and covered with fine hair."
        - id: ch01-b43
          speaker: old_mother_nature
          text: "The Oregon Mole of the Northwest is the family's largest and handsomest member. His coat is very dark, with extremely fine fur. He lives much as Miner does. But when he digs deep, he pushes earth up to the surface as Grubby Gopher does, and farmers find his mounds troublesome. When he tunnels near the surface, he leaves ridges just like his eastern cousin's."
        - id: ch01-b44
          speaker: old_mother_nature
          text: "The strangest relative is the Star-nosed Mole. Except for his nose and tail, he resembles Miner. Twenty-two small, fleshy points fringe his nose and make it look like a star. That is how he got his name. His hairy tail is a little longer than Miner's, and it becomes much larger in late fall and winter."
        - id: ch01-b45
          speaker: old_mother_nature
          text: "This odd little mole with the star-shaped nose prefers wet country. He lives in swamps, damp meadows, and along stream banks. Water does not frighten him, and he swims well. Sometimes people see him swimming beneath winter ice. You seldom find him in dry earth. In fact, none of the Mole family lives where long dry spells bake the ground hard."
        - id: ch01-b46
          speaker: old_mother_nature
          text: "The fur of Miner and his cousins can lie smoothly in either direction. It stays neat whether they move forward or backward. Without that useful coat, their fur would usually be a terrible mess. These underground workers are fascinating once you know them, though few people ever get that chance."
        - id: ch01-b47
          speaker: old_mother_nature
          text: "Now remember this. Shrews and Moles make up the two families in the order called Insectivora, which means insect eaters. Never look down on either family. They do a great deal of good in the Great World, more than certain people here whom I could name but won't. School is dismissed."
