audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 亲切生动，带着温和的幽默感
        timbre: 温暖清亮
        pace: 舒缓而富有变化
        pitch: 中等
    peter_rabbit:
      display_name: 彼得兔
      tts:
        delivery: 好奇直率，情绪来得快也去得快
        timbre: 清脆稚气
        pace: 轻快
        pitch: 中高
    mother_nature:
      display_name: 老大自然妈妈
      tts:
        delivery: 慈爱睿智，说话从容而坦率
        timbre: 温厚柔和
        pace: 从容
        pitch: 中低
    striped_chipmunk:
      display_name: 花栗鼠条纹
      tts:
        delivery: 开朗谦和，机灵中带着几分自信
        timbre: 清亮柔和
        pace: 轻快
        pitch: 中高
    happy_jack:
      display_name: 灰松鼠快乐杰克
      tts:
        delivery: 自信好胜，受窘时有些急躁
        timbre: 明亮爽脆
        pace: 轻快
        pitch: 中高
    jumper_hare:
      display_name: 长耳野兔跳跳
      tts:
        delivery: 朴实腼腆，认真时透着好奇
        timbre: 清朗柔和
        pace: 稍缓
        pitch: 中等
    miner_mole:
      display_name: 鼹鼠矿工
      tts:
        delivery: 不爱露面，受到打扰时显得急躁
        timbre: 尖细而略带鼻音
        pace: 稍快
        pitch: 中高
    johnny_chuck:
      display_name: 土拨鼠约翰尼
      tts:
        delivery: 老实爽朗，佩服别人时毫不掩饰
        timbre: 厚实明亮
        pace: 中等
        pitch: 中低
  chapters:
    - id: ch01
      title: 土脊下面的动静
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 彼得兔蹦蹦跳跳地去上课，觉得低头看路实在没意思。结果，他一脚踢在什么东西上，脚趾顿时疼了起来。没错，彼得竟然绊着了。他不耐烦地低叫一声，回头一看，地面上多出了一道浅浅的小土脊。昨天经过这里时，地面明明还是平的。
        - id: ch01-b02
          speaker: narrator
          text: 彼得忍不住咯咯笑了。四周一个人也没有，他还是大声问了一句，这事是不是挺有意思。没人回答，他便干脆自己接着说了下去。
        - id: ch01-b03
          speaker: peter_rabbit
          text: “当然有意思！我正要去学鼹鼠矿工的事，就被他拱出的怪土脊绊了一下。昨天还没有这东西，看来矿工就在附近干活。哈，果然叫我猜中了！”
        - id: ch01-b04
          speaker: narrator
          text: 那道土脊在不远处断了。彼得盯着尽头，只见原本平坦的地面像被什么从下面顶住，慢慢鼓起来，土脊也跟着伸长了一截。他立刻明白，矿工正在看不见的地底下干活。他挖的是一条隧道，而土脊正是隧道的顶。隧道离地面很近，矿工一边向前钻，一边把松土向上推，头顶便拱出了一道土脊。
        - id: ch01-b05
          speaker: narrator
          text: 彼得站在那里看了好几分钟，才转身一蹦一跳地奔向绿森林。他赶到课堂时累得上气不接下气，也是所有学生里最后一个到的。老大自然妈妈本想说说这个迟到的学生，可一见他满脸兴奋，便改变主意，没有责备他。
        - id: ch01-b06
          speaker: mother_nature
          text: “彼得，这回怎么啦？你在路上险些遇到危险了吗？”
        - id: ch01-b07
          speaker: peter_rabbit
          text: “没有，我没遇到危险。不过，我发现了一件事。”
        - id: ch01-b08
          speaker: narrator
          text: 快乐杰克嗤嗤笑起来。
        - id: ch01-b09
          speaker: happy_jack
          text: “彼得哪天没有新发现？他这个小发现家，大概刚刚弄明白，要想准时到达，就得早点儿出发。”
        - id: ch01-b10
          speaker: peter_rabbit
          text: “根本不是！你——”
          emotion: angry
        - id: ch01-b11
          speaker: mother_nature
          text: “别理他，彼得。告诉我，你发现了什么？”
          emotion: calm
        - id: ch01-b12
          speaker: peter_rabbit
          text: “今天要认识的那一位就在附近！鼹鼠矿工正在绿草地上挖土，离绿森林边上很近。我想，您也许愿意——”
        - id: ch01-b13
          speaker: mother_nature
          text: “愿意把今天的课搬到那里去。见不到矿工本人，至少也能看看他的工程。好主意，彼得，我们马上出发。亲眼看见，总比只听别人说强。”
    - id: ch02
      title: 地下的小矿工
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 彼得把大家领回那道绊过他的小土脊旁。它已经比他离开时长了。众人刚围上来，泥土又被顶起，土脊继续向前伸。老大自然妈妈俯下身，在上面挖了一个小洞，又把嘴凑近洞口，吩咐矿工出来。她说得轻柔亲切，口气却不容违抗，谁都听得出她一定要矿工照办。
        - id: ch02-b02
          speaker: narrator
          text: 洞里很快探出一只又长又尖的怪鼻子，一个尖细的声音烦躁地问了起来。
        - id: ch02-b03
          speaker: miner_mole
          text: “我非得把整个身子都露出来吗？”
        - id: ch02-b04
          speaker: mother_nature
          text: “当然得出来。你的朋友和邻居想看清你，只露一只尖鼻子怎么够？快爬出来，没人会伤害你。我只留你几分钟，然后你就能回去继续挖个没完。出来吧！”
        - id: ch02-b05
          speaker: narrator
          text: 大家紧挨着洞口围成一圈，矿工爬到了众人眼前。他实在是大千世界里一个顶古怪的小家伙，在场很少有人这样近地看过他。矿工身材粗壮，披着一件能想象到的最柔软、最厚实的灰色外套，身长大约六英寸。那条滑稽的短尾巴光秃秃的，颜色粉白，彼得一看就想到了蚯蚓。
        - id: ch02-b06
          speaker: narrator
          text: 矿工的脑袋仿佛直接长在肩膀上，几乎没有脖子。尖鼻子长长地伸到嘴巴前面，耳朵和眼睛全都藏得看不见。花栗鼠条纹一看就急着问，既然找不到眼睛，矿工究竟怎么观察四周。
        - id: ch02-b07
          speaker: mother_nature
          text: “他可不像你们这样看东西。拨开眼睛周围的毛，也许能找到那双极小的眼睛，可它们只能分辨光明和黑暗。你们一个个长什么样，他一点儿也不知道。他终生住在地下，好眼睛在那里根本没有用处。眼睛若是再大些，又没有毛这样严密地护着，泥土总会往里面掉，反而成了累赘。再摸摸他的鼻子，你会发现它很硬，因为他就靠这只鼻子在泥土中钻行。现在，再仔细看看他的手。”
        - id: ch02-b08
          speaker: narrator
          text: 一双双眼睛立刻转向矿工的手。谁也没见过这样的手。那两条胳膊很短，看上去却十分有力。手掌同样不长，可少掉的长度仿佛全补到了宽度上，显得宽大无比，上面还生着粗长的爪子。最怪的是他握着手的姿势，两只手全都朝外翻。只有后脚看起来并不特别，和鼠科成员的后脚差不多。
        - id: ch02-b09
          speaker: narrator
          text: 矿工不安地扭动着。他留在这里，只因老大自然妈妈叫他留下，他一心只想钻回心爱的泥土。老大自然妈妈看懂了，也有些不忍，便把他抱起来，放到一片附近没有洞口的地面上。
        - id: ch02-b10
          speaker: mother_nature
          text: “矿工，大家已经看清你了，我也知道你很不自在。再帮我们一个忙吧，让大家瞧瞧你怎么挖土。土拨鼠约翰尼觉得自己挺会挖洞，你就露一手给他看看。”
        - id: ch02-b11
          speaker: narrator
          text: 老大自然妈妈的话音刚落，矿工立刻把尖鼻子抵住地面，又推又钻。他不用别人再催第二遍。一只铲子般的大手从脸旁伸过去，爪子插进鼻子边的泥土，再用力向后一扒，把松开的土一并扫走。另一只手也照样忙碌起来。大家这才明白，他为什么把手朝外翻。钻土的鼻子不停向前，两只铲土的手轮流后扫，动作没有一点儿迟缓。彼得连六个长气都没喘完，矿工已经完全消失在土里。
        - id: ch02-b12
          speaker: peter_rabbit
          text: “这才叫会挖洞！”
          emotion: surprised
        - id: ch02-b13
          speaker: johnny_chuck
          text: “只要我还活着，就再也不夸自己会挖了。”
        - id: ch02-b14
          speaker: narrator
          text: 约翰尼说得满心佩服。矿工钻下去的地方又鼓起一道土脊，众人看着它以惊人的速度不断伸长。草皮下的小工人一边挖，一边把隧道推向自己原来的那些地道。他显然急着回到熟悉的地下，好在那里安安静静地工作。
    - id: ch03
      title: 隧道与食物
      blocks:
        - id: ch03-b01
          speaker: happy_jack
          text: “这种生活可真够奇怪的。他一定没有多少乐趣。要我这样一直住在黑暗里，非难受坏了不可。”
        - id: ch03-b02
          speaker: mother_nature
          text: “你忘了，矿工并不能像你那样看东西，所以他更喜欢黑暗。至于乐趣，他当然也有，只不过他的乐趣来自工作。他住在泥土里，总是忙着挖出一条又一条隧道，这正是大家叫他矿工的原因。”
        - id: ch03-b03
          speaker: jumper_hare
          text: “那他吃什么？植物的根吗？”
        - id: ch03-b04
          speaker: mother_nature
          text: “许多人都这样误会。他们看见隧道沿着作物伸展，就说矿工毁了庄稼，还吃了留种的玉米。其实，他只是在根边找蛴螬和蠕虫，根本没有碰植物。至于是谁吃了玉米和幼苗，草地田鼠丹尼或他的表亲也许说得明白。矿工不在时，他们很爱借用这些隧道。”
        - id: ch03-b05
          speaker: narrator
          text: 丹尼低下头，神色很心虚，却没有开口。
        - id: ch03-b06
          speaker: mother_nature
          text: “矿工只有一种做法偶尔会伤到植物。他若把隧道挖得离园中植物太近，空气就会钻进娇嫩的根须周围，让根干掉。除此以外，他并不伤害作物。他吃的几乎全是蠕虫、蛴螬和昆虫，而且必须吃下许许多多才能活下去，所以总在忙。那些看起来毫无计划、东一道西一道的隧道，其实都是他追着食物留下的。他尤其爱吃蚯蚓。”
        - id: ch03-b07
          speaker: mother_nature
          text: “说到底，他是个很有用的小家伙。只有土脊横穿平整的草坪时，他才会给人添些麻烦。可就算这时候，他也在吃草根里的蛴螬，算是补偿了造成的麻烦。不然，那些蛴螬反过来会把草毁掉。地面出现土脊，说明矿工的食物就在浅处。天气干燥或寒冷时，蠕虫钻进深土，矿工也一路跟下去，地面便不留隧道的痕迹了。”
        - id: ch03-b08
          speaker: mother_nature
          text: “白天黑夜对他没有分别。他想干活就干活，想睡就睡。冬天，他在冻土层下面挖隧道。你们刚才都看见了，他的毛十分浓密，这样沙土就钻不进去。他把家安在地底的一个小洞室里，用青草或树叶铺成安适的窝。好几条隧道通向那里，危险突然来临时，他可以轻易从别的方向逃走。”
    - id: ch04
      title: 矿工的两位表亲
      blocks:
        - id: ch04-b01
          speaker: peter_rabbit
          text: “矿工还有近亲吗？”
        - id: ch04-b02
          speaker: mother_nature
          text: “有好几位，他们的生活习性都和矿工很相像。住在稍北一些地方的那一位叫布鲁尔鼹鼠，也叫毛尾鼹鼠。他的尾巴比矿工的稍长一些，而且不像矿工那样光秃秃的，上面覆盖着一层细毛。”
        - id: ch04-b03
          speaker: mother_nature
          text: “鼹鼠家族里个头最大、模样最俊的是西北部的俄勒冈鼹鼠。他的外套颜色很深，毛极其细软。生活方式大体和你们刚见过的矿工相同。不过，在地下深处挖隧道时，他会照着囊地鼠格拉比的办法，把泥土一路推到地面上，堆成一座座让农夫头疼的小土丘。贴近地面挖时，他留下的土脊又和东部表亲的一模一样。”
        - id: ch04-b04
          speaker: mother_nature
          text: “不过，家族里最古怪的还要数星鼻鼹鼠。除了鼻子和尾巴，他身上别的地方都和矿工很像。鼻子边缘围着一圈肉质的小突起，一共二十二个，看起来像一颗长着许多尖角的星星，他的名字就是这样来的。他的尾巴比矿工的稍长，上面也长着毛，到了深秋和冬天，这条尾巴还会粗大许多。”
        - id: ch04-b05
          speaker: mother_nature
          text: “这个长着星星鼻子的小家伙特别喜欢湿润的地方，比如沼泽、潮湿的草地，还有溪流岸边。他一点儿也不怕水，还是个游泳好手，冬天有时甚至能看见他从冰层下面游过。土地干燥的地方很少见到他。说起来，只要一个地区长期没有雨，泥土被晒得又干又硬，整个鼹鼠家族的成员都不会在那里生活。”
    - id: ch05
      title: 地下工人的秘密
      blocks:
        - id: ch05-b01
          speaker: mother_nature
          text: “矿工和表亲们的毛，无论朝哪个方向都能伏倒。不管主人向前钻还是向后退，外套总能保持平顺。要不是这样，他们的毛大概多半时候都会乱成一团。只要真正认识这些地下小工人，就会发现他们个个都很有趣。可惜，很少有人得到这样的机会。”
        - id: ch05-b02
          speaker: mother_nature
          text: “最后要牢牢记住，鼩鼱和鼹鼠都属于食虫目，这个名字的意思就是吃昆虫的动物。整个食虫目里只有两个科，一个是鼩鼱科，另一个是鼹鼠科。两科中的任何一科都别小看，他们为大千世界做了许多好事，比眼下在座的某些人做得还要多。至于我说的是谁，就不点名了。好了，放学。”
