audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm, observant storytelling
        timbre: clear and gentle
        pace: measured
        pitch: medium
    old_mother_nature:
      display_name: Old Mother Nature
      tts:
        delivery: kindly, assured, and practical
        timbre: warm and full
        pace: unhurried
        pitch: medium-low
  chapters:
    - id: ch01
      title: Spite the Marten and Pekan the Fisher
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: The morning after the visit to the Smiling Pool, Old Mother Nature opened school at the old meeting place in the Green Forest. She began with the last two members of the Weasel family.
        - id: ch01-b02
          speaker: old_mother_nature
          text: "None of you has ever seen these two. They live far away in the deep forests of the North. If you lived there, though, you would know them well, and you would seldom stop fearing them. One is Spite the Marten. The other is Pekan the Fisher."
        - id: ch01-b03
          speaker: old_mother_nature
          text: "Spite is also known as the Pine Marten and the American Sable. He is one of the handsomest members of the Weasel family. Shadow the Weasel can climb, but he stays on the ground most of the time. Jimmy Skunk and Digger the Badger cannot climb at all, while Little Joe Otter spends most of his time in the water. Spite is different from all of them. He loves the treetops and is as much at home there as Chatterer the Red Squirrel."
        - id: ch01-b04
          speaker: old_mother_nature
          text: "Up in the trees, Spite looks like an enormous Squirrel. On the ground, you might mistake him for a young Fox. His coat is a rich, dark yellowish brown, and it grows almost black on his legs and tail. His throat is usually yellow, though it can be nearly white. The sides of his face are grayish, and the insides of his fairly large ears are grayish white. Long hair covers his tail, which is about half as long as his body, but it is not bushy like a Squirrel's tail. His general shape is like Shadow the Weasel's, only his body is much heavier for his size."
        - id: ch01-b05
          speaker: old_mother_nature
          text: "Chatterer, you and your cousin Happy Jack should be very thankful that Spite does not live around here. He is especially fond of Squirrels, and he takes great pleasure in hunting them. He can leap from one tree to another as easily as either of you. Once he begins a chase, a Squirrel has only one possible escape. It must find a hole too small for Spite to enter. No Squirrel moves through the trees more gracefully than he does."
        - id: ch01-b06
          speaker: old_mother_nature
          text: "But Spite does not remain in the trees. He is just as comfortable on the ground, where he moves with much of Shadow the Weasel's quickness. He loves to hunt Rabbits. He also travels tremendous distances, even farther than Billy Mink. Spite does not kill merely because he enjoys killing. He kills for food. When he catches more than he can eat at one meal, he buries what is left and comes back when he is hungry again."
        - id: ch01-b07
          speaker: old_mother_nature
          text: "Like every other member of his family, Spite is a great hunter of Mice. He catches many birds too, especially birds that build their nests on the ground. His meals may also include eggs, Frogs, Toads, certain insects, and fish. Yet he does not eat flesh alone as his smaller cousins do. He also eats some nuts, berries, and honey."
        - id: ch01-b08
          speaker: old_mother_nature
          text: "Spite wants nothing to do with others of his own kind. He prefers to live alone, and if he meets another Marten, he is always ready to fight. Because he wanders so widely, he keeps several dens. Mrs. Spite usually builds a nest of grass and moss inside a hollow tree, though now and then she uses a hole in the ground. In spring she has between one and five babies. Spite is not a good father. He takes no part in caring for his family."
        - id: ch01-b09
          speaker: old_mother_nature
          text: "As I told you at the start, Spite lives only in the great northern forests. The deeper and darker the forest, the better he likes it. He has little reason to fear any natural enemy except his cousin Pekan the Fisher and Tufty the Lynx. His greatest enemy is man. Spite's coat is among the most valuable of all furs, so hunters and trappers pursue him constantly. To a fur trapper, that coat is one of the finest prizes."
        - id: ch01-b10
          speaker: old_mother_nature
          text: "Pekan the Fisher lives in those same deep, dark forests all across the northern part of the country. He is also called the Pennant Marten and Blackcat. Pekan is larger and heavier than Spite. His coat is brownish black, with lighter sides and a browner color underneath. His nose, ears, feet, and tail are black. He is called Blackcat because he resembles a Cat with a bushy tail, though when he is on the ground, he looks more like a black Fox."
        - id: ch01-b11
          speaker: old_mother_nature
          text: "Like Spite, Pekan lives among pine and spruce trees, and he likes to stay near swamps. He is a splendid climber, but he spends just as much time on the ground. Even so, he is livelier in the trees than Spite. Spite can catch a Squirrel in the treetops, but Pekan can catch Spite, and he often does. Pekan will leap from high in a tree all the way to the ground without fear. When he climbs down, he often goes headfirst."
        - id: ch01-b12
          speaker: old_mother_nature
          text: "Pekan is very fond of hunting Jumper the Hare's cousins. He never seems to tire, so he can keep chasing them until he runs them down. He is clever too. Like his cousin Glutton the Wolverine, he causes endless trouble for trappers by stealing the bait from their traps."
        - id: ch01-b13
          speaker: old_mother_nature
          text: "You all remember how frightened Prickly Porky became when I merely spoke Pekan's name. Pekan is almost the only animal Prickly Porky has good reason to fear. A hungry Pekan will not hesitate to eat a Porcupine. He has learned to turn one onto its back. As you already know, a Porcupine has no protection underneath."
        - id: ch01-b14
          speaker: old_mother_nature
          text: "I do not know why anyone began calling Pekan a Fisher. It is true that he eats fish when he can get them. Still, he is not a water animal, and he does not fish the way Billy Mink and Little Joe Otter do. He eats much the same food as Spite, and he is especially fond of Rabbits and Hares. Pekan is so strong and fierce that he can kill a Fox, and often does. Bobby Coon is a good fighter. He is also much larger and heavier than Pekan. Even so, Bobby is no match for him."
        - id: ch01-b15
          speaker: old_mother_nature
          text: "By now, you have probably guessed that Pekan is a true Marten and that fur trappers prize his coat highly. He hates having people near him, and he has very good reason for that hatred."
        - id: ch01-b16
          speaker: old_mother_nature
          text: "That brings us to the end of the Weasel family. But remember, it is only one family in the order called Carnivora, the flesh eaters. There is another family that all of you know very well, so we will study that one next. Reddy Fox and Old Man Coyote belong to it. It is called the Dog family."
        - id: ch01-b17
          speaker: old_mother_nature
          text: "When you arrive tomorrow morning, I may have a surprise waiting for you."
