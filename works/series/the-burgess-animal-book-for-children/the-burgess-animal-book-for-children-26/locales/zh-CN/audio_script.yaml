audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 亲切生动，带着温和的幽默感
        timbre: 温暖清亮
        pace: 舒缓而富有变化
        pitch: 中等
    mother_nature:
      display_name: 老大自然妈妈
      tts:
        delivery: 慈爱睿智，说话从容而坦率
        timbre: 温厚柔和
        pace: 从容
        pitch: 中低
  chapters:
    - id: ch01
      title: 第二十六章　貂狠心和渔貂佩坎
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 游览微笑池塘后的第二天早晨，大家又回到绿森林里那处老地方上课。老大自然妈妈开始讲鼬科最后两位成员。
        - id: ch01-b02
          speaker: mother_nature
          text: “这两位，你们谁也没有见过。他们住在遥远北方的密林深处。要是你们也住在那里，不但会认识他们，还会时常提防他们。一个叫貂狠心，另一个就是渔貂佩坎。”
        - id: ch01-b03
          speaker: mother_nature
          text: “貂狠心也叫松貂和美洲紫貂，是鼬科最漂亮的成员之一。黄鼠狼影子虽然会爬树，大部分时间却在地上活动。臭鼬吉米和獾挖挖根本不会爬树，水獭小乔又多半待在水里。狠心可不同，他最爱树梢，在高高的枝头来来去去，和红松鼠喋喋一样自在。”
        - id: ch01-b04
          speaker: mother_nature
          text: “狠心在树间穿行时，很像一只格外大的松鼠。到了地上，又可能被当成一只小狐狸。他的外衣是浓郁的深黄褐色，尾巴和四条腿近乎黑色。喉部通常是黄色，有时却几乎雪白。两边脸颊微微发灰，耳朵里面是灰白色。那条覆着长毛的尾巴，差不多有身体的一半长，却不像松鼠尾巴那样蓬松。他的身形和黄鼠狼影子相仿，身子却沉重得多。”
        - id: ch01-b05
          speaker: mother_nature
          text: “喋喋，你和快乐杰克真该庆幸，狠心没有住在这一带。他最喜欢追捕松鼠，也非常爱吃松鼠。从一棵树跳到另一棵树，对他来说和对你们一样轻松。一只松鼠要是被他追上，唯一的逃生办法，就是钻进一个小得让他进不去的洞。论起在树上的轻盈灵巧，没有哪只松鼠能胜过狠心。”
        - id: ch01-b06
          speaker: mother_nature
          text: “他可不只在树上活动。到了地面，他也一样自在，行动起来差不多和黄鼠狼影子同样迅疾。他爱猎兔，又能走过很远的路，比水貂比利还要四处奔波。狠心杀死猎物只是为了食物，不是为了享受杀生。一顿吃不完，他就把剩下的埋好，等饿了再回来取。他和家族里的其他成员一样，也是捕鼠能手。他还会捉鸟，尤其爱找那些在地上筑巢的鸟。鸟、鸟蛋、青蛙、蟾蜍、某些昆虫和鱼，都能给他换换口味。他也不像那些个头较小的表亲只吃肉，还会吃某些坚果、浆果和蜂蜜。”
        - id: ch01-b07
          speaker: mother_nature
          text: “狠心不爱和同类来往，宁愿独自生活。遇到另一只松貂，他随时会打起来。因为常常远行，他有好几个住处。狠心太太通常用青草和苔藓在树洞里筑巢，偶尔也住进地洞。到了春天，她会生下一到五个宝宝。狠心可不是好父亲，他从来不照管自己的家人。”
        - id: ch01-b08
          speaker: mother_nature
          text: “我一开始就说过，狠心只住在北方的大森林里。森林越幽暗、越茂密，他越喜欢。能让他十分害怕的天敌，大概只有表亲渔貂佩坎和猞猁蓬蓬。他最大的敌人却是人类。狠心的外衣是最受珍视的毛皮之一，所以人类不断追捕他，还设下陷阱捉他。对那些捕兽取皮的猎人来说，他这一身毛皮正是最值钱的收获之一。”
        - id: ch01-b09
          speaker: mother_nature
          text: “同一片横贯国土北部的幽深密林里，还住着渔貂佩坎。他也叫大松貂和黑猫。佩坎比狠心更大、更重，外衣呈棕黑色，两侧颜色浅些，腹部也更偏棕色。鼻子、耳朵、四脚和尾巴都是黑的。他像一只拖着蓬松尾巴的猫，因此有了‘黑猫’这个名字。不过他到了地上，看起来倒更像一只黑狐狸。”
        - id: ch01-b10
          speaker: mother_nature
          text: “佩坎和狠心一样，住在松林和云杉林里，喜欢靠近沼泽。他很会爬树，不过待在地上的时间也一样多。真到了树上，他甚至比狠心还敏捷。狠心能在树梢捉住松鼠，佩坎却能在那里捉住狠心，而且常常得手。他敢从高高的树上一直跃到地面，沿树干下来时，也常常头朝下爬。”
        - id: ch01-b11
          speaker: mother_nature
          text: “佩坎爱追捕跳跳的那些表亲。他有使不完的力气，会一直追到它们再也跑不动。他还非常聪明，和表亲狼獾贪吃鬼一样，常从陷阱里偷走诱饵，给设阱猎人惹出没完没了的麻烦。”
        - id: ch01-b12
          speaker: mother_nature
          text: “还记得吗？我只是提到佩坎的名字，豪猪刺刺就吓坏了。因为刺刺几乎只需要害怕他一个。佩坎要是饿了，绝不会犹豫要不要拿豪猪当晚餐。他已经学会怎样把豪猪掀翻，让它仰面朝天。你们早就发现了，豪猪的身体下方没有硬刺保护。”
        - id: ch01-b13
          speaker: mother_nature
          text: “至于佩坎为什么叫‘渔貂’，我可不知道。他弄得到鱼时的确会吃，却不是水生动物，也不会像水貂比利和水獭小乔那样捕鱼。他的食物和狠心差不多，尤其爱吃兔子和野兔。他力气大，性情又凶猛，连狐狸都能杀死，而且常常真的这样做。浣熊博比很会打架，个头和分量也比佩坎大得多，可他根本不是佩坎的对手。”
        - id: ch01-b14
          speaker: mother_nature
          text: “你们大概已经猜到了。佩坎是真正的貂，他的外衣自然也深受毛皮猎人珍视。他憎恨人类出现，而且完全有理由憎恨他们。”
        - id: ch01-b15
          speaker: mother_nature
          text: “鼬科讲到这里就结束了。不过，鼬科只是食肉目，也就是以肉为食的动物当中的一个家族。还有一个家族，你们全都熟悉得很，下一课我们就来讲他们吧。红狐雷迪和老郊狼都属于那个家族，它叫犬科。”
        - id: ch01-b16
          speaker: mother_nature
          text: “明天早晨，你们来到这里时，我也许会给大家一个惊喜。”
