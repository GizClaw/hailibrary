  chapters:
    - id: ch01
      title: Striped Chipmunk and His Cousins
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: News of the school spread quickly through the Green Forest and across the Green Meadows. The little people who lived there loved to gossip, so of course Striped Chipmunk soon heard all about Old Mother Nature's lessons. The very next morning, just as class began, he hurried up quite out of breath.
        - id: ch01-b02
          speaker: old_mother_nature
          text: "Well, well! Look who's here. What brings you to us, Striped Chipmunk?"
        - id: ch01-b03
          speaker: striped_chipmunk
          text: "I came because I want to learn. May I stay, Mother Nature?"
        - id: ch01-b04
          speaker: old_mother_nature
          text: "Of course you may. I'm especially glad you came today, because our lesson is about you and your cousins. Peter Rabbit, how is Striped Chipmunk different from the Tree Squirrels?"
        - id: ch01-b05
          speaker: narrator
          text: Peter studied Striped Chipmunk as though he had never really looked at him before.
        - id: ch01-b06
          speaker: peter_rabbit
          text: "He's smaller than they are. In fact, he's the smallest Squirrel I know."
        - id: ch01-b07
          speaker: narrator
          text: Peter stopped there, but Old Mother Nature nodded for him to continue.
        - id: ch01-b08
          speaker: old_mother_nature
          text: "Go on, Peter."
        - id: ch01-b09
          speaker: peter_rabbit
          text: "His coat has black and yellowish-white stripes running along his sides, with a black stripe down the middle of his back. The rest is reddish-brown above and light underneath. His tail is rather thin and flat. I never see him in the trees, so I suppose he can't climb."
        - id: ch01-b10
          speaker: striped_chipmunk
          text: "Oh, yes, I can! I climb sometimes when I want to. I simply like the ground better."
        - id: ch01-b11
          speaker: old_mother_nature
          text: "Please continue, Peter."
        - id: ch01-b12
          speaker: peter_rabbit
          text: "He seems happiest around old stone walls and piles of rock. And he's one of the brightest, liveliest, merriest, most lovable friends I have."
        - id: ch01-b13
          speaker: striped_chipmunk
          text: "Thank you, Peter."
        - id: ch01-b14
          speaker: peter_rabbit
          text: "I've never managed to find his home. He keeps that secret very well, though I do know it's underground. I think that's everything. The biggest difference is that Striped Chipmunk stays on the ground, while the Tree Squirrels spend much of their time in trees."
        - id: ch01-b15
          speaker: old_mother_nature
          text: "Very good, Peter. But you missed two important differences. Striped Chipmunk has a large pocket inside each cheek. His cousins in the trees have no pockets at all."
        - id: ch01-b16
          speaker: peter_rabbit
          text: "Of course! How could I forget? I've often laughed when he packed those pockets with nuts or seeds until his head looked three times its usual size. Those pockets must be useful."
        - id: ch01-b17
          speaker: striped_chipmunk
          text: "They certainly are. I couldn't manage without them. They save me ever so many trips back and forth."
        - id: ch01-b18
          speaker: old_mother_nature
          text: "The other great difference is that Striped Chipmunk sleeps through nearly all of winter. Now and then, on a bright day, he wakes and pokes out his head to see what the weather is like. Many people call him a Ground Squirrel. But Rock Squirrel is the better name, because stony places are the places he likes best. Now, Striped Chipmunk, suppose you tell us exactly where you make your home and how you build it."
        - id: ch01-b19
          speaker: striped_chipmunk
          text: "My home is underground. I dig a tunnel just wide enough to run through comfortably. Far below Jack Frost's reach, I make a snug bedroom with a bed of grass and leaves. I dig another room to store seeds and nuts, and sometimes I make more than one storeroom. I also add a few small side tunnels."
        - id: ch01-b20
          speaker: peter_rabbit
          text: "Then why have I never found the entrance?"
        - id: ch01-b21
          speaker: narrator
          text: Peter was as curious as ever.
        - id: ch01-b22
          speaker: striped_chipmunk
          text: "Because I hid it beneath the stone wall at the edge of the Old Orchard."
        - id: ch01-b23
          speaker: peter_rabbit
          text: "But what about all the sand you dug out? Surely that would reveal your secret."
        - id: ch01-b24
          speaker: narrator
          text: Striped Chipmunk gave a happy little chuckle deep in his throat. It was a pleasant sound.
        - id: ch01-b25
          speaker: striped_chipmunk
          text: "I took care of that. There isn't one grain of sand near my doorway. I carried it out through another hole some distance away. That was a sort of back door, and afterward I sealed it tight. But if I'm not a Ground Squirrel, Mother Nature, who is?"
        - id: ch01-b26
          speaker: old_mother_nature
          text: "Your cousin Seek Seek the Spermophile is a true Ground Squirrel. Some people call him a Gopher Squirrel. He lives out on the open plains of the West, where there are no rocks or stones, and flat, open country suits him best. The name Spermophile means seed-eater. Seeds make up most of his food, and he is especially fond of grain. Because he eats so much of it, he can do a great deal of damage, and the farmers dislike him very much."
        - id: ch01-b27
          speaker: old_mother_nature
          text: "Seek Seek's whole family are the true Ground Squirrels. But please remember this. They are not Gophers, and no one should call them Gophers. One of the smallest members of the family is about your size, Striped Chipmunk. He wears stripes too, only he has more stripes than you do, and his stripes are broken into rows of tiny dots. That is the Thirteen-lined Spermophile."
        - id: ch01-b28
          speaker: old_mother_nature
          text: "He has pockets in his cheeks just as you do, and his home beneath the ground is very much like yours. Every member of the family makes an underground home, and every one of them sleeps through the winter. Though they are great seed-eaters, they also eat many insects and worms. Some are even guilty of killing and eating the babies of birds that nest on the ground. They will eat young mice too."
        - id: ch01-b29
          speaker: old_mother_nature
          text: "Some members of this family are almost as large as Happy Jack the Gray Squirrel, and their coats are gray as well. People call them Gray Ground Squirrels, though you may also hear the mistaken name Gray Gophers. One of the largest members is the California Ground Squirrel. His tail is big and bushy, so it looks very much like Happy Jack's tail."
        - id: ch01-b30
          speaker: old_mother_nature
          text: "The California Ground Squirrel gets into so much mischief in grain fields and orchards that people dislike him just as much as they dislike Jack Rabbit. This particular member of the family is as comfortable among rocks and tree roots as he is in open country. He will climb low trees when he wants fruit or nuts, but he still prefers staying on the ground. So keep the difference clear. Chipmunks are Rock Squirrels, while their Spermophile cousins are the true Ground Squirrels."
        - id: ch01-b31
          speaker: old_mother_nature
          text: "Now, has anyone seen Timmy the Flying Squirrel lately?"
        - id: ch01-b32
          speaker: peter_rabbit
          text: "I haven't."
        - id: ch01-b33
          speaker: striped_chipmunk
          text: "I haven't."
        - id: ch01-b34
          speaker: happy_jack
          text: "I haven't."
        - id: ch01-b35
          speaker: chatterer
          text: "I haven't."
        - id: ch01-b36
          speaker: jumper_the_hare
          text: "I have. I saw him last evening, just after round red Mr. Sun went to bed behind the Purple Hills and the Black Shadows began creeping through the Green Forest. My, how I wish I could fly the way he can!"
        - id: ch01-b37
          speaker: narrator
          text: Old Mother Nature shook her head in disapproval.
        - id: ch01-b38
          speaker: old_mother_nature
          text: "Jumper, what is wrong with your eyes? When have you ever seen Timmy fly?"
        - id: ch01-b39
          speaker: jumper_the_hare
          text: "I saw him fly last night."
        - id: ch01-b40
          speaker: narrator
          text: Jumper would not give up his claim.
        - id: ch01-b41
          speaker: old_mother_nature
          text: "No, you didn't see him fly. There is a very good reason for that. Timmy cannot fly any more than you can. What you saw was simply a jump. The only animals in this great land that truly fly are the Bats. Timmy leaps from the top of one tree, then slides downward on the air until he reaches the foot of another tree."
        - id: ch01-b42
          speaker: old_mother_nature
          text: "If you had used your eyes carefully, you would have noticed something. While Timmy is in the air, he never moves his legs or arms. He is always coming down and never going up, except for a small rise at the very end of his jump. That little rise can happen during an ordinary jump. If Timmy could truly fly, he would be able to climb through the air. And he has no wings at all."
        - id: ch01-b43
          speaker: jumper_the_hare
          text: "When he's flying—when he's jumping, then—he looks as though he has wings."
        - id: ch01-b44
          speaker: narrator
          text: Jumper still spoke stubbornly.
        - id: ch01-b45
          speaker: old_mother_nature
          text: "That is because he has a fold of skin on each side between his front and hind legs. When he jumps, he spreads his legs out flat. The folds stretch wide until they look almost like wings, and they let him sail a long way from a high place."
        - id: ch01-b46
          speaker: old_mother_nature
          text: "You have seen a bird flap its wings to get started, then sail along with those wings stretched out and perfectly still. Timmy does much the same thing, except that he gets started by jumping. You may have noticed that he usually climbs all the way to the top of a tree before he leaps. From such a high place, he can sail downward for a wonderfully long distance. His tail helps him keep his balance. If something stands in his path, he can even steer himself around it."
        - id: ch01-b47
          speaker: old_mother_nature
          text: "As he reaches the tree he aimed for, he shoots upward a little and lands on the trunk close to the ground. Then he scampers to the top of that tree and does it all again."
        - id: ch01-b48
          speaker: striped_chipmunk
          text: "Then why do we never see him?"
        - id: ch01-b49
          speaker: old_mother_nature
          text: "Because Timmy keeps hours that are quite different from yours. When the rest of you squirrels are out and busy, he is curled into a little ball in his nest and fast asleep. Timmy likes the night, especially the early evening. The bright light of day does not suit him at all."
        - id: ch01-b50
          speaker: happy_jack
          text: "How big is he?"
        - id: ch01-b51
          speaker: narrator
          text: Happy Jack looked rather sheepish. He seemed a little ashamed that he did not know one of his own cousins.
        - id: ch01-b52
          speaker: old_mother_nature
          text: "If anything, he is a little smaller than Striped Chipmunk, though far out in the West he grows somewhat larger. His upper coat is soft yellowish-brown, and underneath he is entirely white. All his fur is wonderfully soft. His eyes are very large, dark, and gentle, just right for seeing at night. He is lively, loves to play, and is gentle and lovable by nature."
        - id: ch01-b53
          speaker: peter_rabbit
          text: "Does he eat nuts like the other Squirrels?"
        - id: ch01-b54
          speaker: old_mother_nature
          text: "He certainly does. He also eats grubs and insects, and he dearly loves a fat beetle. When he can get meat, he likes that too."
        - id: ch01-b55
          speaker: peter_rabbit
          text: "Where does he live?"
        - id: ch01-b56
          speaker: old_mother_nature
          text: "Usually he lives in a hole in a tree, and an old home left by a Woodpecker is one of his favorite places. Inside the hole, he makes a comfortable nest from strips of bark, grass, moss, or any other soft material he can find. Once in a while, he builds a nest outside instead. He places it high up in the fork between two branches. Timmy is also very fond of getting into old buildings."
        - id: ch01-b57
          speaker: happy_jack
          text: "Does he have many enemies?"
        - id: ch01-b58
          speaker: old_mother_nature
          text: "He has the same enemies the rest of you have. The one he fears most is Hooty the Owl. Hooty is the enemy you have the least reason to fear, because he seldom hunts during the day."
        - id: ch01-b59
          speaker: striped_chipmunk
          text: "Does Timmy sleep all winter?"
        - id: ch01-b60
          speaker: old_mother_nature
          text: "Not the way you do. He sleeps during very cold weather. But when he lives where winters are not very cold, he stays active all year. I think that is enough about the Squirrel family for now."
        - id: ch01-b61
          speaker: peter_rabbit
          text: "You forgot Johnny Chuck!"
        - id: ch01-b62
          speaker: narrator
          text: Old Mother Nature laughed.
        - id: ch01-b63
          speaker: old_mother_nature
          text: "Why, so I did! That will never do. Johnny and his Marmot relatives certainly must not be overlooked. They will be our lesson tomorrow. Peter, please tell Johnny Chuck to come here tomorrow morning."
