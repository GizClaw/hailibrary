audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 亲切生动，带着温和的幽默感
        timbre: 温暖清亮
        pace: 舒缓而富有变化
        pitch: 中等
    peter_rabbit:
      display_name: 彼得兔
      tts:
        delivery: 好奇直率，情绪来得快也去得快
        timbre: 清脆稚气
        pace: 轻快
        pitch: 中高
    jumper_hare:
      display_name: 长耳野兔跳跳
      tts:
        delivery: 朴实腼腆，认真时透着好奇
        timbre: 清朗柔和
        pace: 稍缓
        pitch: 中等
    mother_nature:
      display_name: 老大自然妈妈
      tts:
        delivery: 慈爱睿智，说话从容而坦率
        timbre: 温厚柔和
        pace: 从容
        pitch: 中低
    happy_jack:
      display_name: 灰松鼠快乐杰克
      tts:
        delivery: 自信好胜，受窘时有些急躁
        timbre: 明亮爽脆
        pace: 轻快
        pitch: 中高
    chatterer:
      display_name: 红松鼠喋喋
      tts:
        delivery: 伶牙俐齿，争强好胜又活泼
        timbre: 尖细清亮
        pace: 明快
        pitch: 高
    striped_chipmunk:
      display_name: 花栗鼠条纹
      tts:
        delivery: 开朗谦和，机灵中带着几分自信
        timbre: 清亮柔和
        pace: 轻快
        pitch: 中高
  chapters:
    - id: ch01
      title: 第六章　花栗鼠条纹和他的表亲们
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 绿森林里有了学校，这件新鲜事当然瞒不住，很快就传遍了绿森林和绿草原。住在那里的小家伙们个个爱说新鲜事，消息总是跑得飞快。花栗鼠条纹听说老大自然妈妈的学校，一点儿也不奇怪。第二天早晨，每日一课刚要开始，他便匆匆赶来，累得直喘气。
        - id: ch01-b02
          speaker: mother_nature
          text: “哟，瞧瞧是谁来了！条纹，你今天怎么也到这里来了？”
        - id: ch01-b03
          speaker: striped_chipmunk
          text: “我是来学习的。大自然妈妈，我可以留下来吗？”
        - id: ch01-b04
          speaker: mother_nature
          text: “当然可以。你能来，我很高兴。今天来得尤其巧，因为这堂课正要讲你和你的表亲。彼得兔，你先说说，条纹和树松鼠有哪些不同？”
        - id: ch01-b05
          speaker: narrator
          text: 彼得从头到脚仔细打量着条纹，好像头一回真正看清这位朋友。想了一会儿，他才开口。
        - id: ch01-b06
          speaker: peter_rabbit
          text: “他比树松鼠小。其实，他是我认识的松鼠里个头最小的。”
        - id: ch01-b07
          speaker: narrator
          text: 彼得停了下来。老大自然妈妈鼓励地点点头。
        - id: ch01-b08
          speaker: mother_nature
          text: “很好，接着说。”
        - id: ch01-b09
          speaker: peter_rabbit
          text: “他穿着条纹外套。身体两边有黑色和黄白色的条纹，背脊正中还有一道黑纹。其余的地方，上面红褐，下面颜色较浅。他的尾巴又薄又扁。我从没见他上树，所以猜他不会爬。”
        - id: ch01-b10
          speaker: striped_chipmunk
          text: “我当然会爬树！只要我想爬，就能爬上去，有时候我也会爬。不过，我还是更喜欢待在地上。”
        - id: ch01-b11
          speaker: mother_nature
          text: “彼得，你继续。”
        - id: ch01-b12
          speaker: peter_rabbit
          text: “条纹喜欢旧石墙和乱石堆。他还是我所有朋友里最机灵、最活泼、最快活，也最可爱的一个。”
        - id: ch01-b13
          speaker: striped_chipmunk
          text: “谢谢你，彼得。”
        - id: ch01-b14
          speaker: peter_rabbit
          text: “我一直没找到他的家，那是他的秘密。不过我知道，他住在地下。我想到的只有这些。要说最大的不同，就是条纹一直在地面生活，树松鼠却大多住在树上。”
        - id: ch01-b15
          speaker: mother_nature
          text: “说得不错。不过你漏了两个很重要的地方。条纹两边脸颊的内侧，各有一个大口袋，住在树上的表亲却没有。”
        - id: ch01-b16
          speaker: peter_rabbit
          text: “对呀，我怎么会把这件事忘了！他把那两个口袋塞满坚果和种子时，脑袋看起来会胀成现在三倍大。我见过好多次，每回都忍不住笑。能一次带走这么多东西，那两个口袋一定特别方便。”
        - id: ch01-b17
          speaker: striped_chipmunk
          text: “确实方便。没有它们，我可过不下去。带东西时少跑好多趟，全靠这两个口袋。”
        - id: ch01-b18
          speaker: mother_nature
          text: “还有一个大区别。条纹差不多会睡过整个冬天，只偶尔在晴朗的日子醒来，探出脑袋看看外面的天气。很多人把条纹叫作地松鼠，其实岩松鼠这个称呼更合适，因为他最喜欢多石的地方。条纹，你给大家讲讲自己的家造在哪里，又是怎么造的吧。”
        - id: ch01-b19
          speaker: striped_chipmunk
          text: “我住在地下。先挖一条地道，大小刚好能让我舒舒服服地跑过。一直挖到霜杰克碰不着的深处，我就造一间舒服的小卧室，用草和树叶铺床。然后再造一间小屋当储藏室，专门存放种子和坚果。有时我会造不止一间储藏室，旁边还会挖几条短短的岔道。”
        - id: ch01-b20
          speaker: peter_rabbit
          text: “那我为什么一直找不到你家地道的入口？”
        - id: ch01-b21
          speaker: narrator
          text: 彼得还是老样子，什么都想问个明白。
        - id: ch01-b22
          speaker: striped_chipmunk
          text: “因为我把入口藏在老果园边的石墙底下了。”
        - id: ch01-b23
          speaker: peter_rabbit
          text: “就算入口藏住了，挖出来的沙土也会暴露秘密吧？”
        - id: ch01-b24
          speaker: narrator
          text: 条纹开心地咯咯笑了起来。笑声从喉咙里滚出来，听着很悦耳。
        - id: ch01-b25
          speaker: striped_chipmunk
          text: “这事我早想到了。我家门前连一粒那样的沙土也没有。我从远处的另一个洞口把沙土运出去，那算是一扇后门。等全运完，我又把后门封得严严实实。大自然妈妈，如果我不算地松鼠，谁才算呢？”
        - id: ch01-b26
          speaker: mother_nature
          text: “你的表亲黄鼠西克西克才是。他有时也被叫作囊地鼠松鼠，住在西部没有岩石和石块的开阔平原上，最喜欢平坦空旷的地方。黄鼠这个名字有‘吃种子的动物’之意。他的食物主要就是种子，尤其爱吃谷物，常给农场造成很大损失，所以农场主们十分讨厌他。”
        - id: ch01-b27
          speaker: mother_nature
          text: “西克西克这一家才是真正的地松鼠，可千万别把他们叫作囊地鼠。他们和囊地鼠根本不是同一个家族。地松鼠里个头最小的成员之一，和条纹差不多大，也穿条纹外套。不过他的条纹更多，而且断成了一个个小斑点，因此得名十三纹黄鼠。”
        - id: ch01-b28
          speaker: mother_nature
          text: “十三纹黄鼠和条纹一样，脸颊里长着口袋，地下的家也和条纹家很相似。整个家族都这样住在地下，也都睡过整个冬天。他们虽然最爱种子，却也吃大量昆虫和虫子。有些地松鼠甚至会杀死在地面筑巢的鸟儿的幼雏，把它们吃掉，也会捕食小老鼠。”
        - id: ch01-b29
          speaker: mother_nature
          text: “这个家族还有些成员，几乎和快乐杰克一样大，身上披着灰外套。人们叫他们灰地松鼠，有时也叫灰囊地鼠。其中个头最大的一种，是加利福尼亚地松鼠。他的尾巴又大又蓬松，简直和快乐杰克的尾巴一样。”
        - id: ch01-b30
          speaker: mother_nature
          text: “加利福尼亚地松鼠在谷田和果园里闯的祸太多了，人们讨厌他，一点儿也不亚于讨厌长耳大野兔杰克。他住在岩石和树根间，就和住在开阔地面上一样自在。他会爬上矮树找水果和坚果，但更喜欢待在地上。你们一定要记住，花栗鼠是岩松鼠，他们的表亲黄鼠才是地松鼠。对了，你们最近有谁见过飞鼠蒂米？”
        - id: ch01-b31
          speaker: peter_rabbit
          text: “我没见过。”
        - id: ch01-b32
          speaker: striped_chipmunk
          text: “我也没见过。”
        - id: ch01-b33
          speaker: happy_jack
          text: “我也没有。”
        - id: ch01-b34
          speaker: chatterer
          text: “我也没有。”
        - id: ch01-b35
          speaker: jumper_hare
          text: “我见过！就在昨天傍晚，圆滚滚的红太阳公公刚到紫山后面睡觉，黑影也开始爬进绿森林。我那时看见了蒂米。哎呀，要是我也能像他那样飞就好了！”
        - id: ch01-b36
          speaker: narrator
          text: 老大自然妈妈听完，不赞成地摇了摇头。
        - id: ch01-b37
          speaker: mother_nature
          text: “跳跳，你的眼睛怎么了？你什么时候见过蒂米飞？”
        - id: ch01-b38
          speaker: jumper_hare
          text: “就是昨天晚上。我真的看见了。”
        - id: ch01-b39
          speaker: mother_nature
          text: “不，你看到的不是飞。蒂米和你一样不会飞，他只是在跳。在这片辽阔的土地上，真正会飞的动物只有蝙蝠。蒂米只是从一棵树顶跳出去，借着空气一路向下滑，最后落到另一棵树的底部。”
        - id: ch01-b40
          speaker: mother_nature
          text: “你要是仔细看，就会发现他在空中从不挥动腿脚。他一直往下落，从来不会越飞越高，只有快结束这一跳时才向上蹿一点儿。要是真会飞，绝不会总是这样往下落。再说，他连翅膀也没有。”
        - id: ch01-b41
          speaker: jumper_hare
          text: “可他飞起来……我是说跳起来的时候，看着就像有翅膀。”
        - id: ch01-b42
          speaker: mother_nature
          text: “那是因为他的身体两侧，各有一片皮膜，从前腿一直连到后腿。他跳出去时，把四条腿平平伸开，两片皮膜也跟着绷展开，看起来几乎就像一对翅膀。所以他从高处跳下时，才能乘着空气滑翔那么远。”
        - id: ch01-b43
          speaker: mother_nature
          text: “你们都见过鸟儿先拍动翅膀飞起来，然后把双翼展开，一动不动地向前滑翔。蒂米做的事很像，只不过他不是拍动翅膀，而是靠跳跃出发。他通常先爬到树顶再跳，这样向下滑翔的距离会长得惊人。他用尾巴保持平衡，前面遇到障碍，还能控制方向绕过去。”
        - id: ch01-b44
          speaker: mother_nature
          text: “到了目标那棵树前，他会向上蹿一点儿，落在离地面不远的树干上。然后，他飞快爬到那棵树的树顶，再照样跳一次。”
        - id: ch01-b45
          speaker: striped_chipmunk
          text: “那我们为什么一直看不到他？”
        - id: ch01-b46
          speaker: mother_nature
          text: “因为你们这些松鼠在外面四处活动时，蒂米正蜷成一个小圆球，躺在自己的窝里熟睡。他喜欢夜晚，尤其喜欢刚刚入夜的时候，却一点儿也不喜欢白天的亮光。”
        - id: ch01-b47
          speaker: happy_jack
          text: “蒂米有多大？”
        - id: ch01-b48
          speaker: narrator
          text: 快乐杰克有些难为情。他大概觉得，自己竟然不认识这位表亲，实在有点儿惭愧。
        - id: ch01-b49
          speaker: mother_nature
          text: “要说大小，他比条纹还小一点儿，不过住在遥远西部的飞鼠会长得稍大。他上身披着柔软的黄褐色外套，腹部通体雪白，那身毛柔软得出奇。他还有一双很大、颜色很深的温柔眼睛，尤其适合在夜里看东西。他非常活泼，最爱玩耍，天性又温顺可爱。”
        - id: ch01-b50
          speaker: peter_rabbit
          text: “他和其他表亲一样，也吃坚果吗？”
        - id: ch01-b51
          speaker: mother_nature
          text: “当然。他也吃蛴螬和昆虫，最爱肥肥的甲虫。有肉可吃时，他也喜欢吃肉。”
        - id: ch01-b52
          speaker: peter_rabbit
          text: “那他住在哪里？”
        - id: ch01-b53
          speaker: mother_nature
          text: “通常住在树洞里，尤其喜欢啄木鸟留下的旧家。他会找来树皮内层、青草、苔藓，还有别的任何柔软材料，给自己造一只舒服的窝。有时候，他也会在高高的树杈间搭一只露天窝。除此以外，他还很喜欢钻进老房子里住。”
        - id: ch01-b54
          speaker: happy_jack
          text: “他的敌人多不多？”
        - id: ch01-b55
          speaker: mother_nature
          text: “你们这些松鼠有的敌人，他也都有。不过，他最有理由害怕的是猫头鹰胡迪。你们反而最不必担心胡迪，因为胡迪很少在白天出来捕猎，而那时候正是你们四处活动的时间。”
        - id: ch01-b56
          speaker: striped_chipmunk
          text: “蒂米也会睡过整个冬天吗？”
        - id: ch01-b57
          speaker: mother_nature
          text: “不像你那样一睡就是整个冬天。天气非常冷时，他会睡觉。可要是碰巧住在气候不太冷的地方，他一年到头都会在外活动。好了，我想关于松鼠家族，我们已经讲得够多了。”
        - id: ch01-b58
          speaker: peter_rabbit
          text: “您把土拨鼠约翰尼忘了！”
        - id: ch01-b59
          speaker: narrator
          text: 老大自然妈妈笑了起来。
        - id: ch01-b60
          speaker: mother_nature
          text: “我还真把他忘了。这可不行，绝对不行。约翰尼和他的亲戚旱獭当然不能漏掉。我们明天的课就专门讲他们。彼得，你去告诉土拨鼠约翰尼，让他明天早晨一定到这里来上课。”
