audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 亲切生动，带着温和的幽默感
        timbre: 温暖清亮
        pace: 舒缓而富有变化
        pitch: 中等
    peter_rabbit:
      display_name: 彼得兔
      tts:
        delivery: 好奇直率，情绪来得快也去得快
        timbre: 清脆稚气
        pace: 轻快
        pitch: 中高
    mother_nature:
      display_name: 老大自然妈妈
      tts:
        delivery: 慈爱睿智，说话从容而坦率
        timbre: 温厚柔和
        pace: 从容
        pitch: 中低
    happy_jack:
      display_name: 灰松鼠快乐杰克
      tts:
        delivery: 自信好胜，受窘时有些急躁
        timbre: 明亮爽脆
        pace: 轻快
        pitch: 中高
    jumper_hare:
      display_name: 长耳野兔跳跳
      tts:
        delivery: 朴实腼腆，认真时透着好奇
        timbre: 清朗柔和
        pace: 稍缓
        pitch: 中等
    striped_chipmunk:
      display_name: 花栗鼠条纹
      tts:
        delivery: 开朗谦和，机灵中带着几分自信
        timbre: 清亮柔和
        pace: 轻快
        pitch: 中高
    chatterer:
      display_name: 红松鼠喋喋
      tts:
        delivery: 伶牙俐齿，争强好胜又活泼
        timbre: 尖细清亮
        pace: 明快
        pitch: 高
    johnny_chuck:
      display_name: 土拨鼠约翰尼
      tts:
        delivery: 直率倔强，懒洋洋中带着粗朴的自信
        timbre: 浑厚结实
        pace: 稍缓
        pitch: 中低
  chapters:
    - id: ch01
      title: 第十四章　爱交易的家伙与漂亮的小伙子
      blocks:
        - id: ch01-b01
          speaker: mother_nature
          text: “在遥远的南方暖乡，住着鼠科的一位成员。他没有强盗那么坏，可也绝不算好，所以谁都不喜欢他。他叫棉鼠小强盗，个头只比花栗鼠条纹大一点，却活脱脱是个小野蛮汉。瞧他腿短身粗，就像一只长得过大的草地田鼠，还拖着一条长尾巴。”
        - id: ch01-b02
          speaker: mother_nature
          text: “他的尾巴不像强盗的尾巴那样光秃秃，上面有一层又短又稀的毛。他背上是黄褐色，腹部发白。身上的毛比本地其他鼠类更长，也更粗硬。”
        - id: ch01-b03
          speaker: mother_nature
          text: “小强盗住在荒废的田野、沟渠边、树篱下，以及其他遮蔽物多的地方，好躲开敌人。他在地下打洞，通常把干草窝安在洞里，不过到了夏天，也常把窝造在地面上。他不像褐鼠那样住在人类房屋附近，却会偷吃田里成捆堆放的谷物，造成很大损失。”
        - id: ch01-b04
          speaker: mother_nature
          text: “各种谷物和种子他都吃，弄得到肉时也吃。他还会毁掉在地面筑巢的鸟儿所生的蛋和幼鸟。他脾气很坏，打起架来凶狠极了。棉鼠夫妇一年养好几窝孩子，每窝都有不少。狐狸、猫头鹰和鹰是他们主要的敌人。”
        - id: ch01-b05
          speaker: mother_nature
          text: “鼠科还有一些成员有趣得多，很值得认识。比如林鼠交易员。在遥远西部，有些地方叫他驮鼠，山区又叫他山鼠。不管住在哪里，他的习性都差不多。也正因为这些习性，他成了披毛小居民中最有趣的几位之一。”
        - id: ch01-b06
          speaker: mother_nature
          text: “在本国土生土长的鼠类中，交易员的个头仅次于麝鼠杰里，大约有褐鼠强盗三分之二那么大。他的体形轮廓与强盗相似，让人一眼就知道他们是亲戚，可其他地方完全不同。他的毛浓密柔软，几乎像松鼠的毛。他那条颇长的尾巴也覆着毛，这一支家族中有些成员的尾巴甚至像松鼠尾巴一样蓬松。”
        - id: ch01-b07
          speaker: mother_nature
          text: “他的外套从上面看，是柔和的灰色和黄褐色。腹部是纯白或浅黄褐色，四只脚也是白的。他有一对圆耳朵，一双乌黑的大眼睛。强盗眼里总带着丑恶的神气，他的眼睛里却半点也没有。还有，他的胡须又多又长。”
        - id: ch01-b08
          speaker: peter_rabbit
          text: “可他为什么叫交易员呢？”
        - id: ch01-b09
          speaker: narrator
          text: 彼得等得有点不耐烦了。老大自然妈妈轻轻责备了他一句。
        - id: ch01-b10
          speaker: mother_nature
          text: “耐心点，彼得，我这就讲到了。天底下最让他快活的事就是交换东西。他天生就会做交易，不像家族中的其他成员那样只知道偷。无论拿走什么，他都会放下一样东西作为交换。”
        - id: ch01-b11
          speaker: mother_nature
          text: “他留下的可能是一截小树枝、一块木片、一颗小石子，也可能是手边别的东西。总之，他一定要补上自己拿走的那件。你们看，他很诚实。发现别人有自己想要的东西，他虽然会拿走，却总想付出点代价。”
        - id: ch01-b12
          speaker: mother_nature
          text: “除了交易，他最喜欢的就是收藏。他的家简直是一座博物馆，凡是闪闪发亮的东西，他都喜欢。只要钻进人类的营地，他搬得动什么就拿走什么，不过总会尽量留下点东西作为回报。”
        - id: ch01-b13
          speaker: mother_nature
          text: “他的家里什么古怪玩意儿都有。有从马鞍上割下来的扣环，有勺子、刀子和叉子，甚至还有从熟睡的露营者衣袋里拿走的钱币。营地里一丢小东西，人们总会先去交易员的家里找。在山区，他有时还把小石子堆成一堆，只为了享受收藏的乐趣。”
        - id: ch01-b14
          speaker: mother_nature
          text: “西部各地都有他，从高山到沙漠，从茂密的森林到遍地沙土的荒原，都能找到他的踪影。东部某些地方和南方暖乡也有他。他很会攀爬，无论在树上还是岩石间，都像在自己家里一样自在。他吃种子、谷物、许多种坚果，也吃叶子和植物的其他部分。住在寒冷地区时，他还会储存食物过冬。”
        - id: ch01-b15
          speaker: happy_jack
          text: “他的家是什么样的？”
        - id: ch01-b16
          speaker: mother_nature
          text: “交易员的家通常很不寻常，究竟是什么样，要看他住在哪里。住在岩石多的地方，他就在岩石缝隙之间安家。有些地方，他会在地下打洞。不过更多时候，他的家就在地面上，是一大堆树枝和荆棘。温暖柔软的窝藏在正中央，外面的树枝和荆棘可以保护它，挡住来犯的敌人。”
        - id: ch01-b17
          speaker: mother_nature
          text: “要是住在长有仙人掌的地方，他就用这种浑身带着长刺的古怪植物造房子。没有几个敌人敢为了捉他，硬把这样的房子拆开。”
        - id: ch01-b18
          speaker: mother_nature
          text: “受了惊吓或打扰时，他还有个有趣的习惯。他会用后脚飞快地擂地，和彼得、跳跳跺脚很像，只是快得多。有时他把家造在树上。一发现林中小屋，他就马上占为己有，再搬进去一大堆树枝和杂物。”
        - id: ch01-b19
          speaker: mother_nature
          text: “他主要在夜间活动，是个一刻不得闲的家伙，整夜忙着交易和收藏。他半点也没有褐鼠强盗那种卑劣脾气。交易员太太每胎生两到五个宝宝，一年还要养好几窝。我已经说过，交易员是我认识的最有趣的小居民之一，而他做的事常常滑稽极了。”
        - id: ch01-b20
          speaker: mother_nature
          text: “接下来，是这个家族中最漂亮的成员，袋鼠鼠长脚。他的后腿和尾巴很长，又会直起身子坐着、跳着走，所以才得了这个名字。严格说来，他不属于鼠科里的真鼠一支，而是囊鼠的近亲。你们瞧，他的面颊上也有口袋。”
        - id: ch01-b21
          speaker: striped_chipmunk
          text: “和我的一样吗？”
        - id: ch01-b22
          speaker: mother_nature
          text: “不一样。他的颊囊长在脸颊外面，你的却长在里面。”
        - id: ch01-b23
          speaker: striped_chipmunk
          text: “那我觉得，还是我的方便得多。”
        - id: ch01-b24
          speaker: narrator
          text: 条纹一边说，一边十分肯定地点着头。
        - id: ch01-b25
          speaker: mother_nature
          text: “长脚倒觉得自己的颊囊很好用。他确实漂亮，却一点也不自负，性情还很温顺。就算被人捉住，托在手掌里，他也从来不咬人。”
        - id: ch01-b26
          speaker: peter_rabbit
          text: “可是，你还没说他有多大，也没说他长什么样呢。”
        - id: ch01-b27
          speaker: narrator
          text: 没耐心的彼得又抗议起来。
        - id: ch01-b28
          speaker: mother_nature
          text: “他直起身子坐着或跳跃时，就像一只小小的袋鼠。可你们从没见过袋鼠，这么说也不能让你们看清他的模样。先说个头吧，他的身体大约和花栗鼠条纹一样大，尾巴却比头和身体加起来还长。”
        - id: ch01-b29
          speaker: peter_rabbit
          text: “哎呀，那可真是一条了不得的尾巴！”
          emotion: surprised
        - id: ch01-b30
          speaker: narrator
          text: 彼得满口赞叹，老大自然妈妈听得笑了。
        - id: ch01-b31
          speaker: mother_nature
          text: “的确了不得。彼得，你一定会喜欢那条尾巴。他的前腿短，前脚小，后腿却很长，后脚也很大。你当然见过跳鼠飞毛腿吧？”
        - id: ch01-b32
          speaker: narrator
          text: 彼得点了点头。
        - id: ch01-b33
          speaker: peter_rabbit
          text: “当然见过。哎呀，那家伙可真能跳！”
        - id: ch01-b34
          speaker: mother_nature
          text: “长脚的身体和飞毛腿是按同一种样式长成的，用处也一样。他就是个跳跃能手。”
        - id: ch01-b35
          speaker: peter_rabbit
          text: “那我知道长尾巴有什么用了！他腾在空中时，尾巴能帮他保持平衡，让他笔直地跳过去。”
        - id: ch01-b36
          speaker: mother_nature
          text: “又答对了，彼得。那条尾巴正是做这个用的。要是没有它，他跳起来以后就不知道会落到哪里。长脚是个漂亮的小伙子，身上的毛柔软得像丝。背部是好看的黄褐色，腹部是纯白的。”
        - id: ch01-b37
          speaker: mother_nature
          text: “他的脸颊是棕色，耳朵周围一圈白。臀部横着一道白纹，又顺着尾巴两侧一直延伸下去。尾巴上面和下面有的几乎全黑，有的黑得彻底，尾巴尖却长着一簇纯白的长毛。他的脚也是白的。与身体相比，他的脑袋显得颇大，也很长，鼻子同样长长的。他有不少表亲，有些比他小得多，不过模样都和他很相像。”
        - id: ch01-b38
          speaker: johnny_chuck
          text: “他们住在哪里？”
        - id: ch01-b39
          speaker: narrator
          text: 这话是土拨鼠约翰尼问的。他实在忍不住，没法再缺一天课了。
        - id: ch01-b40
          speaker: mother_nature
          text: “他们住在西南部干燥的沙地。那些地方很少下雨，一处水源到另一处水源又相隔很远。”
        - id: ch01-b41
          speaker: chatterer
          text: “那么，长脚从哪里弄水喝呢？”
        - id: ch01-b42
          speaker: mother_nature
          text: “他不用喝水也能过日子。身体需要的那点水分，他全能从食物里得到。他吃种子、某些植物的叶子，还有刚刚冒出地面的鲜嫩幼苗。他会在地下打洞，把大量泥土推到地面上，堆成一座座大土丘。”
        - id: ch01-b43
          speaker: mother_nature
          text: “土丘有好几个入口。其中一个是正门，白天常用泥土封住。土丘下面，小地道伸向四面八方，还有舒适的卧室和储藏食物的库房。他非常勤劳，最喜欢挖洞。”
        - id: ch01-b44
          speaker: mother_nature
          text: “长脚有时喜欢去拜访自己的亲戚。附近要是住着好几户袋鼠鼠，一条条窄窄的小路就会从一座土丘通向另一座。他多半夜里出来，大概觉得那时更安全。而且，在那种炎热的地方，夜里也比白天凉快。傍晚暮色刚刚落下，是他最爱玩耍的时候。”
        - id: ch01-b45
          speaker: mother_nature
          text: “长脚要是和亲戚起了争执，双方就会打起来。他们围着对方蹦来跳去，等着猛然跃起的机会，再用又长又有力的后脚踢上一记。有时，长脚也会像林鼠交易员那样，用后脚擂地。”
        - id: ch01-b46
          speaker: mother_nature
          text: “好了，今天早晨就讲到这里。你们谁要是碰见林鼠白足，就请他明天早晨来上课。还有，要是你们这些小家伙还想继续上课，也去告诉草地田鼠丹尼。”
        - id: ch01-b47
          speakers: [peter_rabbit, jumper_hare, happy_jack, chatterer, striped_chipmunk, johnny_chuck]
          ensemble: chorus
          text: “我们想！”
