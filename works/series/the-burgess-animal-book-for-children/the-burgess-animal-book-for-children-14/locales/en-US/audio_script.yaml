  chapters:
    - id: ch01
      title: A Trader and a Handsome Fellow
      blocks:
        - id: ch01-b01
          speaker: old_mother_nature
          text: "Far down in the Sunny South lives another member of the Rat family. He isn't nearly as bad as Robber, but Little Robber the Cotton Rat is no favorite. He is only a little larger than Striped Chipmunk, yet he looks as fierce as he is. His legs are short, his body is thick, and he resembles an overgrown Meadow Mouse with a long tail. That tail isn't bare like Robber's. It has a thin covering of very short hair. Little Robber is yellowish brown above and whitish below, and his fur is longer and coarser than the fur of our other native Rats."
        - id: ch01-b02
          speaker: old_mother_nature
          text: "He makes his home in old fields, beside ditches and hedges, and anywhere else that gives him plenty of cover from his enemies. He digs burrows and usually builds a dry-grass nest underground, though in summer he often nests on the surface. Unlike the Brown Rat, he stays away from people's homes. Even so, he does great harm by stealing grain from the shocks in the fields. He eats every kind of grain, many seeds, and meat whenever he finds it. He also destroys the eggs and young of birds that nest on the ground."
        - id: ch01-b03
          speaker: old_mother_nature
          text: "Little Robber has a bad temper and fights fiercely. Mr. and Mrs. Cotton Rat raise several large families each year. Their chief enemies are Foxes, Owls, and Hawks."
        - id: ch01-b04
          speaker: old_mother_nature
          text: "But some members of the Rat family are much more interesting and well worth knowing. One is Trader the Wood Rat. In parts of the Far West he is called the Pack Rat, while people in the mountains call him the Mountain Rat. Wherever he lives, his habits are much the same. They make him one of the most interesting little people who wear fur."
        - id: ch01-b05
          speaker: old_mother_nature
          text: "Of all the native Rats, only Jerry Muskrat is larger. Trader is about two thirds the size of Robber the Brown Rat. His general shape shows at once that they are related, but in every other way he is quite unlike that outcast. Trader's fur is thick and almost as soft as a Squirrel's. His fairly long tail is hairy, and some members of his branch have tails nearly as bushy as a Squirrel's."
        - id: ch01-b06
          speaker: old_mother_nature
          text: "His coat is soft gray mixed with yellowish brown above. Underneath, it is pure white or light buff, and his feet are white too. He has round ears, long thick whiskers, and big black eyes. You never see in those eyes the ugliness you see in Robber's."
        - id: ch01-b07
          speaker: peter_rabbit
          text: "But why do they call him Trader?"
        - id: ch01-b08
          speaker: narrator
          text: Peter asked the question a little impatiently.
        - id: ch01-b09
          speaker: old_mother_nature
          text: "Patience, Peter. I was just coming to that. He is called Trader because nothing pleases him more than trading. He was born to trade. Other members of his family steal, but Trader leaves something in place of whatever he takes. It might be a little stick, a chip, a pebble, or anything else close at hand. Still, he always leaves something. You see, he means to be honest. If he finds someone else's possession and wants it, he takes it, but he tries to pay for it."
        - id: ch01-b10
          speaker: old_mother_nature
          text: "Collecting comes next among his favorite pleasures. His home is a regular museum, and bright, shiny things delight him. If he gets into a camp, he carries off anything he can move. Since he wants to be honest, he leaves something behind in exchange."
        - id: ch01-b11
          speaker: old_mother_nature
          text: "You can find the strangest things in Trader's home. There may be buckles cut from saddles, spoons, knives, forks, and even money taken from the pockets of sleeping campers. Whenever some little object disappears from camp, people look first in Trader's home. Up in the mountains, he sometimes piles up small pebbles simply because he enjoys collecting them."
        - id: ch01-b12
          speaker: old_mother_nature
          text: "Trader lives throughout the West, from mountains to deserts, in dense forests and on sandy wastes. He also lives in parts of the East and the Sunny South. He is an excellent climber, equally comfortable in trees and among rocks. His food includes seeds, grain, many kinds of nuts, leaves, and other plant parts. Where winters are cold, he stores food for the season."
        - id: ch01-b13
          speaker: happy_jack_squirrel
          text: "What sort of home does Trader build?"
        - id: ch01-b14
          speaker: old_mother_nature
          text: "His home is usually a remarkable sight, though its form depends on where he lives. In rocky country, he builds among the rocks. In some places he digs a burrow. Most often, however, his house stands on the ground. It is a huge heap of sticks and thorns with his snug, soft nest right in the center. The sticks and thorns guard him from enemies."
        - id: ch01-b15
          speaker: old_mother_nature
          text: "In places where cactus grows, Trader uses those strange plants with their long, sharp spines. Very few enemies are willing to tear apart a house like that to reach him."
        - id: ch01-b16
          speaker: old_mother_nature
          text: "When something alarms or bothers him, Trader drums rapidly on the ground with his hind feet. It is much like the thumping Peter Rabbit and Jumper the Hare do, only much faster. Sometimes he puts his house in a tree. If he discovers a cabin in the woods, he moves in at once and carries inside a great heap of sticks and rubbish."
        - id: ch01-b17
          speaker: old_mother_nature
          text: "Trader is busiest at night. He spends those hours collecting and making his trades. He has none of Robber the Brown Rat's mean disposition. Mrs. Trader has from two to five babies at a time and raises several families a year. As I said, Trader is one of the most interesting little people I know, and some of the things he does are very, very funny."
        - id: ch01-b18
          speaker: old_mother_nature
          text: "Now we come to the handsomest member of the family, Longfoot the Kangaroo Rat. He gets that name from his long hind legs, his long tail, and the way he sits upright and jumps. To be exact, he does not belong to the Rat branch of the family. He is a close relative of the Pocket Mice. Like them, he has pockets in his cheeks."
        - id: ch01-b19
          speaker: striped_chipmunk
          text: "Are they like my cheek pockets?"
        - id: ch01-b20
          speaker: old_mother_nature
          text: "No. Longfoot's pockets are on the outside of his cheeks. Yours are inside."
        - id: ch01-b21
          speaker: striped_chipmunk
          text: "Then I think mine must be much handier."
        - id: ch01-b22
          speaker: narrator
          text: Striped Chipmunk gave his head a very decided nod.
        - id: ch01-b23
          speaker: old_mother_nature
          text: "Longfoot seems quite satisfied with his own. He truly is handsome, but he isn't vain at all, and he is very gentle. Even when someone catches him and holds him in a hand, Longfoot never tries to bite."
        - id: ch01-b24
          speaker: peter_rabbit
          text: "But you still haven't told us how big he is or what he looks like!"
        - id: ch01-b25
          speaker: narrator
          text: Peter's patience had run out again.
        - id: ch01-b26
          speaker: old_mother_nature
          text: "When Longfoot sits up or leaps, he looks like a tiny Kangaroo. That comparison won't help you, though, because none of you has ever seen a Kangaroo. Let me begin with his size. Longfoot's body is about as big as Striped Chipmunk's, but his tail is longer than his head and body put together."
        - id: ch01-b27
          speaker: peter_rabbit
          text: "My, what a tail that must be!"
        - id: ch01-b28
          speaker: narrator
          text: Peter sounded full of admiration, and Old Mother Nature smiled.
        - id: ch01-b29
          speaker: old_mother_nature
          text: "It certainly is. You would like that tail, Peter. Longfoot has short front legs and small front feet. His hind legs are long, and his hind feet are big. Peter, of course you have seen Nimbleheels the Jumping Mouse."
        - id: ch01-b30
          speaker: narrator
          text: Peter nodded.
        - id: ch01-b31
          speaker: peter_rabbit
          text: "Of course I have. My, how Nimbleheels can jump!"
        - id: ch01-b32
          speaker: old_mother_nature
          text: "Longfoot is built on the same plan as Nimbleheels, and for the same reason. He is a jumper too."
        - id: ch01-b33
          speaker: peter_rabbit
          text: "Then I know why he needs that long tail! It balances him while he is in the air, so he can jump straight."
        - id: ch01-b34
          speaker: old_mother_nature
          text: "Right again, Peter. That is exactly what the tail does. Without it, Longfoot would never know where he might land after a jump."
        - id: ch01-b35
          speaker: narrator
          text: Old Mother Nature laughed, then went on with her description.
        - id: ch01-b36
          speaker: old_mother_nature
          text: "As I told you, he is a handsome little fellow. His fur feels wonderfully soft and silky. It is a pretty yellowish brown on top and pure white underneath. His cheeks are brown, while the fur around his ears is white. A white stripe crosses his hips and continues along each side of his tail."
        - id: ch01-b37
          speaker: old_mother_nature
          text: "The top and bottom of that tail are nearly black, or sometimes entirely black. At its tip is a tuft of long, pure-white hair. His feet are white as well. Longfoot has a rather large, long head and a long nose. He has several cousins, some much smaller than he is, but all of them look very much alike."
        - id: ch01-b38
          speaker: johnny_chuck
          text: "Where do Longfoot and his cousins live?"
        - id: ch01-b39
          speaker: narrator
          text: Johnny Chuck had asked the question. He had not been able to keep away from school for one more day.
        - id: ch01-b40
          speaker: old_mother_nature
          text: "They live in the dry, sandy country of the Southwest. Rain seldom falls there, and one place with water may be a long way from the next."
        - id: ch01-b41
          speaker: chatterer_the_red_squirrel
          text: "Then where does Longfoot find water to drink?"
        - id: ch01-b42
          speaker: old_mother_nature
          text: "He manages without drinking any. His food gives him all the moisture he needs. He eats seeds, the leaves of certain plants, and tender young plants that are just coming up."
        - id: ch01-b43
          speaker: old_mother_nature
          text: "Longfoot burrows underground and throws up large mounds of earth. Each mound has several entrances. One is the main entrance, and during the day he often closes it with earth. Beneath the mound, small tunnels lead in every direction. There he has a snug bedroom and storerooms for food. He works hard and dearly loves to dig."
        - id: ch01-b44
          speaker: old_mother_nature
          text: "Longfoot sometimes visits his relatives. When several families live near one another, little paths run from mound to mound. He usually comes outside at night, probably because he feels safer then. Nights are also cooler in that hot country. His favorite time for play is the dusk of early evening."
        - id: ch01-b45
          speaker: old_mother_nature
          text: "If Longfoot quarrels with a relative, the two fight by hopping around each other. Each watches for a chance to leap and kick with those long, strong hind feet. Longfoot also drums with his hind feet sometimes, much as Trader the Wood Rat does."
        - id: ch01-b46
          speaker: old_mother_nature
          text: "I think that is enough for this morning. If any of you meet Whitefoot the Wood Mouse, please tell him to come to school tomorrow morning. You might invite Danny Meadow Mouse too, if you little folks want school to go on."
        - id: ch01-b47
          speakers: [peter_rabbit, jumper_the_hare, happy_jack_squirrel, chatterer_the_red_squirrel, striped_chipmunk, johnny_chuck]
          ensemble: chorus
          text: "We do!"
