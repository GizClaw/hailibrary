audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 亲切生动，带着温和的幽默感
        timbre: 温暖清亮
        pace: 舒缓而富有变化
        pitch: 中等
    peter_rabbit:
      display_name: 彼得兔
      tts:
        delivery: 好奇直率，情绪来得快也去得快
        timbre: 清脆稚气
        pace: 轻快
        pitch: 中高
    mother_nature:
      display_name: 老大自然妈妈
      tts:
        delivery: 慈爱睿智，说话从容而坦率
        timbre: 温厚柔和
        pace: 从容
        pitch: 中低
    jumper_hare:
      display_name: 长耳野兔跳跳
      tts:
        delivery: 朴实腼腆，认真时透着好奇
        timbre: 清朗柔和
        pace: 稍缓
        pitch: 中等
    chatterer_red_squirrel:
      display_name: 红松鼠喋喋
      tts:
        delivery: 机敏活泼，开口干脆利落
        timbre: 明亮轻巧
        pace: 轻快
        pitch: 中高
    flitter_red_bat:
      display_name: 红蝙蝠飞飞
      tts:
        delivery: 独立爽快，略带尖细的得意口吻
        timbre: 纤细明亮
        pace: 稍快
        pitch: 高
  chapters:
    - id: ch01
      title: 暮色中的警告
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 傍晚的暮色渐渐浓了。彼得兔坐在那里犹豫不决。今晚是留在亲爱的老荆棘丛里，陪着胆小的彼得太太，还是去绿森林找点新鲜事呢？正想着，头顶忽然落下一个又细又尖的声音，把他吓了一跳。
        - id: ch01-b02
          speaker: flitter_red_bat
          text: “彼得兔，今晚别出门了。还是好好待在家吧！”
        - id: ch01-b03
          speaker: narrator
          text: 彼得抬头一看，一个小黑影正在空中飞窜。它忽左忽右，一会儿贴着他的脑袋掠过，一会儿又蹿到高处，几乎看不见了。
        - id: ch01-b04
          speaker: peter_rabbit
          text: “你好啊，飞飞！为什么不让我出门？”
        - id: ch01-b05
          speaker: flitter_red_bat
          text: “老郊狼正沿着绿森林边上偷偷走，狐狸雷迪在绿草地找猎物，猫头鹰胡笛也守着老果园。你要怎么办，本来不关我的事。不过换成我，今晚一定留在家里。幸好我想去哪儿就去哪儿，想什么时候去都行！彼得，你真该学会飞。飞起来的滋味，什么也比不了。”
        - id: ch01-b06
          speaker: peter_rabbit
          text: “我要是也会飞就好了。”
          emotion: sad
        - id: ch01-b07
          speaker: flitter_red_bat
          text: “那好吧，反正我已经提醒过你啦！”
        - id: ch01-b08
          speaker: narrator
          text: 飞飞吱吱叫完，便朝布朗农夫家的方向飞远了。彼得想起外面那三个猎手，明智地留在老荆棘丛里。彼得太太见他不走，高兴极了。那一夜，彼得吃一阵，睡一阵，心里一直在想，要是能像飞飞那样飞上天空，该是什么感觉。
        - id: ch01-b09
          speaker: narrator
          text: 第二天去上课的路上，彼得还在想着飞飞。等他赶到课堂，肚子里已经装满了问题，急得一刻也坐不住。老大自然妈妈马上看出了他的心思。
        - id: ch01-b10
          speaker: mother_nature
          text: “彼得，你又在琢磨什么呢？”
        - id: ch01-b11
          speaker: peter_rabbit
          text: “您说过，这个国家的食虫目只有鼩鼱和鼹鼠两个家族，对不对？”
        - id: ch01-b12
          speaker: mother_nature
          text: “对，我确实说过。”
        - id: ch01-b13
          speaker: peter_rabbit
          text: “可蝙蝠飞飞不是也吃昆虫吗？”
        - id: ch01-b14
          speaker: narrator
          text: 老大自然妈妈点了点头。
        - id: ch01-b15
          speaker: mother_nature
          text: “没错，而且他只吃昆虫。”
        - id: ch01-b16
          speaker: peter_rabbit
          text: “那他怎么不算食虫目的一员？”
        - id: ch01-b17
          speaker: narrator
          text: 老大自然妈妈很高兴，因为彼得想到了一个好问题。
        - id: ch01-b18
          speaker: mother_nature
          text: “问得好。飞飞和他的亲戚同别的动物太不一样，所以自成一目，叫翼手目。这个名字的意思，就是‘长着翅膀的手’。你们谁认识蝙蝠飞飞？”
        - id: ch01-b19
          speaker: jumper_hare
          text: “我经常看见他。”
        - id: ch01-b20
          speaker: chatterer_red_squirrel
          text: “我也见过。”
        - id: ch01-b21
          speaker: narrator
          text: 其他学生也都说自己见过。傍晚刚暗下来，或清晨黑影开始退去时，谁没看过飞飞在空中飞来飞去呢？大伙儿还都羡慕过他。老大自然妈妈听了，只是笑。
        - id: ch01-b22
          speaker: mother_nature
          text: “见过可不等于认识。除了知道飞飞夜里出来，在空中捉虫子，你们还知道他什么？”
        - id: ch01-b23
          speaker: narrator
          text: 她等了一会儿，谁也答不上来。他们确实不了解飞飞。
        - id: ch01-b24
          speaker: mother_nature
          text: “人们常常天天见到邻居，却一点儿也不了解他们，这事真奇怪。不过你们不认识飞飞，也不能全怪你们。你们大概只见过他在天上飞。他的动作太快，根本不给人仔细打量的机会。今天正好，我们就在这里真正认识一下红蝙蝠飞飞。”
    - id: ch02
      title: 枝头上的红蝙蝠
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 老大自然妈妈走到一丛灌木旁，轻轻拨开叶子。细枝上挂着一样红褐色的东西，皱巴巴的，乍看就像一片枯叶。她伸手轻轻一碰，那片“枯叶”立刻动起来，还气恼地吱吱问，找他干什么。
        - id: ch02-b02
          speaker: mother_nature
          text: “有几位朋友来看你，他们想好好认识你。醒来陪大家一会儿吧。”
        - id: ch02-b03
          speaker: narrator
          text: 那果然是飞飞。他睡眼蒙眬地打了两个哈欠，又抖抖身子。朋友们挤在下方，仰头惊奇地望着他。飞飞朝大家咧嘴一笑。
        - id: ch02-b04
          speaker: flitter_red_bat
          text: “大家好啊。”
        - id: ch02-b05
          speaker: narrator
          text: 阳光直照在飞飞身上，他不但不怕，还很喜欢那股暖意。他用脚趾抓着树枝，头朝下挂着，两边翅膀都收了起来。飞飞身长大约四英寸，身体很像老鼠，身上的细毛又厚又密，是漂亮的橙红色。两只耳朵按身形来说相当大。他没有鼠科动物那种长脑袋和尖鼻子，头比较圆，鼻吻也是钝钝的。彼得很快又有了一个发现。飞飞长着一双亮晶晶的小眼睛，目光十分灵活。日光这样明亮，他照样睁着眼，丝毫没有觉得难受。
        - id: ch02-b06
          speaker: peter_rabbit
          text: “人们为什么会说‘像蝙蝠一样瞎’呢？”
        - id: ch02-b07
          speaker: narrator
          text: 老大自然妈妈笑了起来。
        - id: ch02-b08
          speaker: mother_nature
          text: “这话从哪儿来的，我也不知道。飞飞根本不瞎。他白天睡觉，黄昏或清晨才捕食，可要是白天受了惊，不得不飞走，他看东西也毫无困难。飞飞，展开一边翅膀，让大家看清楚。”
        - id: ch02-b09
          speaker: narrator
          text: 飞飞听话地伸开翅膀。大家一看，全都惊得吸了口气。他们从来没在这么近的地方见过蝙蝠翅膀。飞飞的胳膊很长，从肘部到手掌的部分尤其长。更奇妙的是那三根手指，每一根看起来都和整条胳膊差不多长。薄薄的翼膜模样像橡胶，从肩膀绷到长长的指尖，再连向同侧后脚的脚踝，一直延伸到尾巴尖。翅膀边缘还露着一根短拇指，上面有一枚长而弯的爪子。
        - id: ch02-b10
          speaker: mother_nature
          text: “现在明白了吧？这就是大家叫他们翼手目的原因。”
        - id: ch02-b11
          speaker: narrator
          text: 飞飞收起翅膀，马上开始梳洗。那副样子实在好笑，大家都笑出了声。他先把翼膜含在嘴里，像拉橡胶一样又拉又抻，再用小舌头一点一点舔洗。洗完这边翅膀，他又清理身上的毛。飞飞其实爱干净得很。他还用拇指的小爪子挠挠头，把头上的毛梳整齐。忙了这么久，他始终头朝下倒挂在枝头，脚趾一刻也没松开。
        - id: ch02-b12
          speaker: mother_nature
          text: “飞飞太太去哪儿了？”
        - id: ch02-b13
          speaker: flitter_red_bat
          text: “不知道。她自己照顾自己完全没问题，用不着我担心。”
        - id: ch02-b14
          speaker: mother_nature
          text: “连孩子你也不管吗？飞飞，你这个父亲当得太差劲了，真叫人害臊。你不知道家人在哪儿，那就由我带大家去看。”
          emotion: angry
        - id: ch02-b15
          speaker: narrator
          text: 她走到旁边那棵树前，拨开叶子。飞飞太太果然挂在那里，睡得正熟。三个小宝宝紧紧攀在她身上，模样滑稽极了，整个大千世界也难找到几个比他们更有趣的宝宝。他们都睡着，老大自然妈妈没有惊醒他们。飞飞呢，连看也不多看一眼，仍旧忙着梳洗。
    - id: ch03
      title: 飞行高手的生活
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 大家让飞飞继续打盹，老大自然妈妈一边带他们离开，一边讲起红蝙蝠的生活。
        - id: ch03-b02
          speaker: mother_nature
          text: “红蝙蝠是这个国家最为人熟悉的蝙蝠之一。从东部到遥远的西部，从一个海岸到另一个海岸，到处都有他的踪影。天气变冷时，他像鸟一样迁徙，到初夏才回来。平常他和其他蝙蝠一样，白天一直睡觉。不过你们刚刚亲眼见过，他并不怕太阳。遇上阴沉昏暗的天气，他有时下午就出来，不等天黑。傍晚，他常常比别的蝙蝠更早露面，天色还亮着，大家就能看清他的红外套。蝙蝠家族里，只有他穿这个颜色。”
        - id: ch03-b03
          speaker: mother_nature
          text: “有人管他叫树蝙蝠。刚才看过他挂在枝头，你们一定猜得到原因。大多数蝙蝠白天睡在洞穴里，飞飞却很少进洞。他喜欢用脚趾钩住树木或灌木的细枝，有时挂得离地面很近，就像刚才那样。这样的地方，就是他白天睡觉的卧室。”
        - id: ch03-b04
          speaker: mother_nature
          text: “你们都看过飞飞飞行，知道他速度很快。因为他的翅膀又长又窄，生来就适合快速飞行。蝙蝠是我这些小居民里最奇妙的一群。他们能在空中猛然转向，一会儿向上，一会儿向下，灵活得几乎没有哪种鸟比得过。他们是真正的飞行大师，而且飞过身边时，翅膀一点声音也没有。鸟类当中，只有猫头鹰也能做到这一点。”
        - id: ch03-b05
          speaker: mother_nature
          text: “你们还看见飞飞太太身上攀着三个宝宝。多数蝙蝠每次生两个孩子，偶尔只有一个。红蝙蝠和体形更大的表亲霜蝙蝠，却会生三个或四个。孩子还不太大时，飞飞太太不管飞到哪里，都让他们紧紧抓在自己身上。等宝宝们长得太大、实在带不动了，她出去寻找自己的食物，就把他们留在树枝上挂着。”
    - id: ch04
      title: 各有模样的表亲
      blocks:
        - id: ch04-b01
          speaker: mother_nature
          text: “飞飞还有不少表亲。小棕蝠就是其中一个，也是家族里个头最小的成员之一，全国各地都找得到。他全身都是棕色，又叫洞蝠。只要附近有洞穴，他就进去睡觉。有些大洞穴里，会有多得数不清的小棕蝠紧紧挤在一起。附近没有洞穴，他们便拿谷仓或空心树当住处。还有一些会钻到房屋紧闭的百叶窗后面，藏在那里睡上一整天。”
        - id: ch04-b02
          speaker: mother_nature
          text: “大棕蝠的颜色和小棕蝠很像。他又叫屋蝠或卡罗来纳蝠，尤其爱住在人类的房屋里。大棕蝠比红蝙蝠稍微大些。红蝙蝠傍晚很早就出现，他却和这位表亲正相反，要等到天色完全黑透才出门，算是最晚露面的蝙蝠之一。从东到西，全国各地同样都有他的踪影。”
        - id: ch04-b03
          speaker: mother_nature
          text: “银毛蝠的大小也差不多，许多地方数他最常见。他的毛是深棕色或黑色，毛尖发白，年幼时尤其明显，所以才有了这个名字。霜蝙蝠则是家族里体形最大、模样最漂亮的表亲之一，也是最少见的一种。他身上的深棕色和浅棕色混在一起，毛尖带白，十分俊美。那双又长又窄的翅膀，让他成了最出色的飞行高手之一。霜蝙蝠喜欢绿森林，总在树梢上方高高地捕猎，等到夜色很深才出现。他也像红蝙蝠一样，白天挂在树上。”
        - id: ch04-b04
          speaker: mother_nature
          text: “东南部还有一种大耳蝠，名字当然来自他那双大耳朵。他是个小不点儿，比小棕蝠还小，可耳朵的长度足有头和身体加起来的一半。你们想想，这双耳朵该有多显眼！按身体大小来说，整个国家再没有哪种动物的耳朵比他更大。西南部也有一种大耳蝠，是他的亲戚。”
    - id: ch05
      title: 蝙蝠是人类的朋友
      blocks:
        - id: ch05-b01
          speaker: mother_nature
          text: “蝙蝠家族的成员都爱喝水。黄昏一出门，他们通常先去找水。所有蝙蝠只以昆虫为食，所以他们是人类最好的朋友之一。他们能吃掉大批蚊子，也从不伤害任何东西。这一点，你们其他小家伙当中有些可比不上。好了，下一回我们认识谁呢？”
