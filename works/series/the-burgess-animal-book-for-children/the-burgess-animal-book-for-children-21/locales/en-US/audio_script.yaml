  chapters:
    - id: ch01
      title: Flitter the Bat and His Family
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: "One evening at dusk, Peter Rabbit sat wondering what to do. Should he spend the night at home in the dear Old Briar-patch with timid little Mrs. Peter, or go looking for adventure in the Green Forest? Then a very fine, squeaky voice came out of the air above him and gave him a start."
        - id: ch01-b02
          speaker: flitter_the_red_bat
          text: "You'd better stay home tonight, Peter Rabbit. Stay home!"
        - id: ch01-b03
          speaker: narrator
          text: "Peter looked up. A small dark shape darted one way, twisted another, swept close to his head, and then flew so high that Peter could barely see it."
        - id: ch01-b04
          speaker: peter_rabbit
          text: "Hello, Flitter! Why should I stay home?"
        - id: ch01-b05
          speaker: flitter_the_red_bat
          text: "Old Man Coyote is sneaking along the edge of the Green Forest. Reddy Fox is hunting on the Green Meadows, and Hooty the Owl is watching from the Old Orchard. What you do is your own business, Peter Rabbit, but if I were you, I'd certainly stay home. Gracious, I'm glad I can go wherever I please, whenever I please! You should try flying, Peter. Nothing else is like it."
        - id: ch01-b06
          speaker: peter_rabbit
          text: "I wish I could."
          emotion: sad
        - id: ch01-b07
          speaker: flitter_the_red_bat
          text: "Well, remember that I warned you!"
        - id: ch01-b08
          speaker: narrator
          text: "Flitter squeaked those words and darted off toward Farmer Brown's house. Peter thought about the three hunters Flitter had seen and wisely chose the dear Old Briar-patch for that night. Timid little Mrs. Peter was delighted to have him stay. So Peter spent the night safely at home. He ate for a while, dozed for a while, and kept wondering how it would feel to rise into the air and fly as Flitter did."
        - id: ch01-b09
          speaker: narrator
          text: "Flitter was still on Peter's mind the next morning. By the time Peter reached school, questions were bubbling up inside him. He could hardly wait for the lesson to begin, and Old Mother Nature noticed him fidgeting."
        - id: ch01-b10
          speaker: old_mother_nature
          text: "What are you thinking about, Peter?"
        - id: ch01-b11
          speaker: peter_rabbit
          text: "Didn't you say the Shrew family and the Mole family are the only insect-eater families in this country?"
        - id: ch01-b12
          speaker: old_mother_nature
          text: "Yes, I did."
        - id: ch01-b13
          speaker: peter_rabbit
          text: "But doesn't Flitter the Bat eat insects?"
        - id: ch01-b14
          speaker: old_mother_nature
          text: "He does. In fact, he eats nothing else."
        - id: ch01-b15
          speaker: peter_rabbit
          text: "Then why doesn't he belong to that order?"
        - id: ch01-b16
          speaker: narrator
          text: "Old Mother Nature smiled. She was pleased that Peter had thought of the question."
        - id: ch01-b17
          speaker: old_mother_nature
          text: "That's a very good question, Peter. Flitter and his relatives are so different from other animals that they have an order of their own. It is called Chiroptera, which means wing-handed. Now, how many of you know Flitter the Bat?"
        - id: ch01-b18
          speaker: jumper_the_hare
          text: "I've seen him many times."
        - id: ch01-b19
          speaker: chatterer_the_red_squirrel
          text: "So have I."
        - id: ch01-b20
          speakers: [happy_jack_squirrel, striped_chipmunk, johnny_chuck, peter_rabbit]
          ensemble: chorus
          text: "So have we!"
        - id: ch01-b21
          speaker: narrator
          text: "One after another, the others said they had seen him too. Every one of them had watched Flitter and wished they could fly as he did. They had seen him darting and turning through the air at evening dusk. Sometimes they saw him early in the morning, while the Black Shadows were slipping away. But none of them had ever watched him anywhere except high above the ground. Old Mother Nature smiled at their answers."
        - id: ch01-b22
          speaker: old_mother_nature
          text: "Seeing Flitter isn't the same as knowing him. Besides knowing that he flies at night and catches insects in the air, who can tell me anything about him or the way he lives?"
        - id: ch01-b23
          speaker: narrator
          text: "She waited, but no one answered. Not one of them truly knew anything about Flitter."
        - id: ch01-b24
          speaker: old_mother_nature
          text: "It is strange how little people may know about neighbors they see every day. Still, I can understand it this time. You have probably seen Flitter only while he was flying. He moves so fast that you cannot get a good look at him. This is the perfect time for you to meet Flitter the Red Bat properly."
        - id: ch01-b25
          speaker: narrator
          text: "She walked to a bush and spread its leaves apart. Something hung from a twig that looked at first like a crumpled, reddish-brown dead leaf. Old Mother Nature touched it gently. At once it stirred uneasily, and a thin, squeaky voice crossly asked what anyone wanted."
        - id: ch01-b26
          speaker: old_mother_nature
          text: "Some friends have come to see you, Flitter. They want to know you better, so please wake up for a few minutes."
        - id: ch01-b27
          speaker: narrator
          text: "The little shape was Flitter himself. He gave one or two sleepy yawns, shook himself, and grinned down at the wondering faces gathered below."
        - id: ch01-b28
          speaker: flitter_the_red_bat
          text: "Hello, everyone."
        - id: ch01-b29
          speaker: narrator
          text: "Sunlight shone straight onto Flitter, but it did not bother him in the least. In fact, he seemed to enjoy its warmth. He hung by his toes with his head pointing down and his wings folded close around him. From head to body, he was about four inches long, and his body was shaped rather like a Mouse's. Fine, thick fur covered him, and it was a beautiful orange-red. His ears looked large for such a small fellow. But he did not have the long head and pointed nose of the Mouse family. His head was fairly round, and his nose was blunt. Peter quickly noticed another difference. Flitter had a pair of bright little eyes that seemed to snap with life, and the strong daylight did not bother them at all."
        - id: ch01-b30
          speaker: peter_rabbit
          text: "Then why do people say 'blind as a Bat'?"
        - id: ch01-b31
          speaker: narrator
          text: "Old Mother Nature laughed."
        - id: ch01-b32
          speaker: old_mother_nature
          text: "Goodness knows! Flitter is not blind at all. He sleeps in the daytime and hunts around dusk or early morning. But if something disturbs him and he must fly by day, he can see perfectly well. Flitter, open one wing so everyone can look at it."
        - id: ch01-b33
          speaker: narrator
          text: "Flitter obediently stretched one wing wide. Everyone gasped. They had often seen those wings beating through the air, but none of them had ever been close enough to understand how one was made. Flitter's arm was long, especially the part from his elbow to his hand. The real surprise was the length of his three fingers. Each finger seemed almost as long as the whole arm. A thin skin that looked and stretched like rubber ran from his shoulder to the ends of those long fingers. From there it continued across to the ankle of his hind foot, and then all the way to the tip of his tail. A short little thumb stood free at the edge of the wing, and from that thumb grew a long, curved claw."
        - id: ch01-b34
          speaker: old_mother_nature
          text: "Now you can see why his order is called wing-handed."
        - id: ch01-b35
          speaker: narrator
          text: "Flitter folded his wing and soon began cleaning it. Everyone laughed at the funny sight. He caught the wing skin in his mouth, then pulled and stretched it as if it were rubber. He washed it with his tiny tongue and washed his fur next. Flitter was very neat. He scratched his head and combed his hair with the small claw on his thumb. Through it all, he stayed upside down, gripping the twig with his toes."
        - id: ch01-b36
          speaker: old_mother_nature
          text: "Where is Mrs. Flitter?"
        - id: ch01-b37
          speaker: flitter_the_red_bat
          text: "I don't know. She can take care of herself, so I don't worry about her."
        - id: ch01-b38
          speaker: old_mother_nature
          text: "And you don't worry about your babies either! Flitter, you ought to be ashamed. You are a very poor father. Since you don't know where your family is, I will show you."
          emotion: angry
        - id: ch01-b39
          speaker: narrator
          text: "Old Mother Nature went to the very next tree and parted the leaves. There hung Mrs. Flitter, sound asleep. Clinging tightly to her were three of the funniest babies in all the Great World. They were asleep too, so Old Mother Nature did not wake them. The others looked from the mother and babies back toward Flitter. He showed not the slightest interest in his family. While everyone else stared at them, he simply went on cleaning his other wing."
        - id: ch01-b40
          speaker: old_mother_nature
          text: "Flitter the Red Bat is one of the best-known Bats in this country. He lives from the East to the Far West, all the way from one ocean to the other. Like the birds, he travels away when cold weather comes and returns in early summer. Most Bats sleep all day, but Flitter does not mind sunlight, as you have just seen. On dull, dark days he sometimes flies in the afternoon instead of waiting for evening. He is usually the first Bat to come out at dusk. Often there is still enough light to see his red coat, and no other Bat in his family wears that color."
        - id: ch01-b41
          speaker: old_mother_nature
          text: "Some people call him the Tree Bat. After seeing where he is sleeping, you can guess why. Most of his relatives spend the day in caves, but Flitter rarely does. He hangs by his toes from a twig in a tree or bush, often quite close to the ground, just as he is doing now."
        - id: ch01-b42
          speaker: old_mother_nature
          text: "All of you who have watched Flitter know how swiftly he flies. His long, narrow wings are shaped for speed. I want you to understand that Bats are among the most wonderful of all my little people. Few birds, if any, can equal them in the air. A Bat can twist and turn with amazing quickness and complete control. Bats are true masters of flying. And their wings make no sound as they go. Among birds, only the Owls can claim that same silent flight."
        - id: ch01-b43
          speaker: old_mother_nature
          text: "You also saw those three babies clinging to Mrs. Flitter. Most Bats have two babies at a time, and now and then only one. But the Red Bat and his larger cousin, the Hoary Bat, have three or four. Mrs. Flitter carries her babies until they grow quite large. Once they are too big to carry, she leaves them hanging in a tree while she hunts for food."
        - id: ch01-b44
          speaker: old_mother_nature
          text: "Flitter has many cousins. One is the Little Brown Bat, among the smallest Bats and found all across the country. He is brown from head to foot. People sometimes call him the Cave Bat because he sleeps in caves whenever he can find one. Great crowds of these little Bats may pack together inside a large cave. If there is no cave nearby, he uses a barn or a hollow tree. He will even slip behind the closed shutters of a house to sleep through the day."
        - id: ch01-b45
          speaker: old_mother_nature
          text: "His cousin the Big Brown Bat looks much like him in color. This cousin is also called the House Bat or the Carolina Bat, and he is especially fond of people's homes. He is a little larger than the Red Bat. Flitter is one of the first Bats out in the evening, but the Big Brown Bat is one of the last. He waits until the night is quite dark. He too lives all over the country."
        - id: ch01-b46
          speaker: old_mother_nature
          text: "The Silvery Bat is nearly the same size. In many places, he is the most common Bat of all. His fur is dark brown or black with white tips, especially when he is young. Those white tips give him his name."
        - id: ch01-b47
          speaker: old_mother_nature
          text: "The Hoary Bat is one of the largest and handsomest cousins, and also one of the rarest. Dark and light brown mix in his fur, and the hairs have white tips. His wings are very long and narrow, making him one of the finest fliers. He loves the Green Forest and hunts high above the treetops. He comes out late in the evening and, like the Red Bat, spends the daylight hours hanging in a tree."
        - id: ch01-b48
          speaker: old_mother_nature
          text: "Down in the Southeast lives a smaller cousin called the Big-eared Bat. He is even smaller than the Little Brown Bat, but his ears are half as long as his head and body together. Imagine that! For his size, he has the largest ears of any animal in this whole country. A relative in the Southwest is also called the Big-eared Bat."
        - id: ch01-b49
          speaker: old_mother_nature
          text: "Every Bat drinks water. Usually, the first thing a Bat does at dusk is go and find some. Every one of them lives entirely on insects, so Bats are among the very best friends people have. They eat enormous numbers of Mosquitoes and do no harm at all. I cannot say that about every one of you little folks. Now, who shall we learn about next?"
