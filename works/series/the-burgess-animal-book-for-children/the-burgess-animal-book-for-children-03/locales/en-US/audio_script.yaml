  chapters:
    - id: ch01
      title: More of Peter's Long-Legged Cousins
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: At sun-up the next morning, Peter Rabbit and Jumper the Hare arrived promptly for their next lesson. Old Mother Nature smiled when she saw how eager and curious they were. She began before either of them could ask a question.
        - id: ch01-b02
          speaker: old_mother_nature
          text: "Yesterday I told you about your water-loving cousin, the Marsh Rabbit. Down in the Sunny South, you have another relative who likes the water nearly as much. Some call him the Swamp Rabbit, and others call him the Swamp Hare. Swamp Hare is the better name because he is a true Hare. He lives in swamps rather than marshes, but he swims beautifully and enjoys the water. When an enemy chases him, he heads for the nearest pond or stream."
        - id: ch01-b03
          speaker: jumper_the_hare
          text: "How large is he?"
        - id: ch01-b04
          speaker: old_mother_nature
          text: "He's about your size, Jumper, and perhaps a little heavier. Still, you might look bigger if you sat beside him because his fur lies much smoother than yours. Like the Marsh Rabbit, he has thin hair on his feet. His toes are rather long, and he can spread them wide to help him swim. He doesn't have to escape into the water as often as his smaller cousin because he runs very well. But when someone chases him, swimming is the easiest way to get rid of that enemy. The Marsh Rabbit and the Swamp Hare are the only members of your family anywhere in the Great World who truly enjoy the water and feel at home in it. Now, whom would you like to hear about?"
        - id: ch01-b05
          speakers: [peter_rabbit, jumper_the_hare]
          ensemble: duo
          text: "Tell us about our biggest cousins!"
        - id: ch01-b06
          speaker: peter_rabbit
          text: "Yesterday you said some of them are bigger than Jumper. I can hardly believe any could be much bigger than he is."
        - id: ch01-b07
          speaker: narrator
          text: Old Mother Nature's eyes twinkled.
        - id: ch01-b08
          speaker: old_mother_nature
          text: "Things you know nothing about are often hard to believe. Beside these other relatives, Jumper isn't really big at all. He seems big to you, Peter. But if he met his cousin Snow White the Arctic Hare, who lives far up in the Frozen North, I'm sure Jumper would feel small. Snow White looks much like Jumper in his winter coat. He is white all over except for the black tips of his ears."
        - id: ch01-b09
          speaker: peter_rabbit
          text: "Does he keep his white coat all year?"
        - id: ch01-b10
          speaker: old_mother_nature
          text: "He does when he lives so far north that snow and ice cover the land through most of the year. But some Arctic Hares live a little farther south. There, the snow disappears for a short while in summer, and they trade their white coats for gray ones."
        - id: ch01-b11
          speaker: narrator
          text: Peter looked deeply puzzled.
        - id: ch01-b12
          speaker: peter_rabbit
          text: "But how can he live where the snow and ice almost never melt? What does he find to eat?"
        - id: ch01-b13
          speaker: old_mother_nature
          text: "Moss grows beneath the snow even there, and other plants appear during the short summer. Through the long winter, Snow White digs into the snow to reach them. He also eats bark and twigs from the little stunted trees. Yet big as Snow White is, you have another cousin who is bigger still. He is the largest member of the whole family."
        - id: ch01-b14
          speakers: [jumper_the_hare, peter_rabbit]
          ensemble: duo
          text: "Who is he?"
        - id: ch01-b15
          speaker: old_mother_nature
          text: "His name is White-tailed Jack. He lives mostly on the great plains of the Northwest, though you may sometimes find him in the mountains and forests. Some call him the Prairie Hare. His coat is white in winter and light brown in summer, but his tail stays white in every season. In that way he's rather like you, Peter, and that white tail gave him his name."
        - id: ch01-b16
          speaker: peter_rabbit
          text: "Is his tail as short as mine?"
        - id: ch01-b17
          speaker: narrator
          text: Old Mother Nature laughed aloud.
        - id: ch01-b18
          speaker: old_mother_nature
          text: "No, Peter. Other animals wouldn't call it long, but for your family it truly is. When White-tailed Jack runs, he swings it from side to side. His hind legs are long and powerful. Without half trying, he can cover twenty feet in one jump. Even Old Man Coyote can't catch him in a straight race. You think Jumper's ears are long, but White-tailed Jack's are much longer and very large. When he crouches in his resting place and lays them back, they reach well over his shoulders. Like the other Hares, he never shelters in a hole in the ground or a hollow log. He trusts those long legs and his marvelous speed to carry him away from danger. His enemies include Howler the Wolf, Old Man Coyote, Eagles, Hawks, and Owls. And he is so large that it would take five or six Rabbits your size to equal him."
        - id: ch01-b19
          speaker: narrator
          text: Peter drew a long breath.
        - id: ch01-b20
          speaker: peter_rabbit
          text: "It's terribly hard to believe I have a cousin that big. But if you say it's true, then of course it is. Do I have any other cousins nearly that large?"
        - id: ch01-b21
          speaker: narrator
          text: Old Mother Nature nodded.
        - id: ch01-b22
          speaker: old_mother_nature
          text: "There are others much like White-tailed Jack, though they aren't quite so big. They have the same long hind legs and enormous ears, but their coats are different. These cousins live out on the great plains, farther south than White-tailed Jack. Some make their homes so far south that the weather stays warm all year. One of those warm-country cousins is Antelope Jack, who lives in the Southwest."
        - id: ch01-b23
          speaker: peter_rabbit
          text: "Please tell us about him."
        - id: ch01-b24
          speaker: old_mother_nature
          text: "First, Antelope Jack belongs to the big Jack Rabbit, or Jack Hare, branch of your family. None of that branch should really be called a Rabbit. They are all first cousins to Jumper, which means they are true Hares. Every one of them has great ears, a long, fairly slender neck, and long legs. Even the front legs are long compared with those of most members of your family. Antelope Jack is probably the next largest after White-tailed Jack."
        - id: ch01-b25
          speaker: old_mother_nature
          text: "Now here is something strange. Although his home is warm through most of the year, much of his coat is white. His back and throat are yellowish brown, while his sides are white. More surprising still, he can make himself look almost entirely white. Special little muscles let him spread out the white hair on his sides until the white nearly meets across his back. In sunlight, this creates white flashes that can be seen from far away. Antelope Jack and his friends use those flashes to keep track of one another across great distances. Only one other animal can signal that way. That is the Antelope, and I'll tell you about him another time. Those flashing signals are why this Hare is called Antelope Jack."
        - id: ch01-b26
          speaker: old_mother_nature
          text: "In all his other habits, he is much like the rest of his family. When danger comes, he relies on his long legs and his wonderful power of jumping to get away. But Antelope Jack isn't as well known as his more common cousin, the plain Jack Rabbit. Everybody knows Jack Rabbit."
        - id: ch01-b27
          speaker: narrator
          text: Peter shook his head.
        - id: ch01-b28
          speaker: peter_rabbit
          text: "I don't."
        - id: ch01-b29
          speaker: old_mother_nature
          text: "Then it's time you learned. If you had ever visited the Far West, you would know him. Everyone out there does. He isn't quite as large as Antelope Jack, but he is still a very big fellow. He wears a brownish coat that looks much like Jumper's. The tips of his long ears are black. His tail is longer than Jumper's, and instead of lifting it as he races along, he carries it down."
        - id: ch01-b30
          speaker: peter_rabbit
          text: "I don't hold my tail down."
        - id: ch01-b31
          speaker: narrator
          text: Old Mother Nature laughed again.
        - id: ch01-b32
          speaker: old_mother_nature
          text: "That's quite true, Peter. You couldn't hold yours down even if you wanted to. It's too short to go any way but up. Jack has more tail than you, just as he has longer legs. And my, how he can run! He crosses the ground in tremendous bounds. About every tenth bound, he leaps much higher than the others so he can get a good look around and watch for enemies."
        - id: ch01-b33
          speaker: peter_rabbit
          text: "Who are his enemies?"
        - id: ch01-b34
          speaker: old_mother_nature
          text: "Foxes, Coyotes, Hawks, Eagles, Owls, Weasels, and men. In fact, he has almost as many enemies as you do."
        - id: ch01-b35
          speaker: peter_rabbit
          text: "When you say men, I suppose you mean hunters."
        - id: ch01-b36
          speaker: narrator
          text: Old Mother Nature nodded.
        - id: ch01-b37
          speaker: old_mother_nature
          text: "Yes. Some hunt him for sport, and others hunt because they want to be rid of him."
        - id: ch01-b38
          speaker: narrator
          text: Peter's ears stood straight up.
        - id: ch01-b39
          speaker: peter_rabbit
          text: "Why would anyone want to get rid of him? What harm does he do?"
        - id: ch01-b40
          speaker: old_mother_nature
          text: "When he stays far from people's homes, he does no harm. But near their homes, he gets into mischief, just as you do when you visit Farmer Brown's garden."
        - id: ch01-b41
          speaker: narrator
          text: Old Mother Nature gave Peter a very stern look, and he hung his head.
        - id: ch01-b42
          speaker: peter_rabbit
          text: "I know I should stay out of that garden. But you can't imagine how tempting it is. Everything growing there tastes so good."
        - id: ch01-b43
          speaker: narrator
          text: Old Mother Nature turned away to hide the twinkle in her eyes. By the time she faced Peter again, she looked stern once more.
        - id: ch01-b44
          speaker: old_mother_nature
          text: "That is no excuse, Peter Rabbit. You should have enough strength of mind to resist temptation. Giving in to temptation causes most of the trouble in this world, and it has made men the enemies of Jack Rabbit. Jack simply can't stay away from the crops people plant. His family is very large indeed, too. A great many Jack Rabbits may gather in one place. They enter fields of clover or young wheat, and they visit young orchards where the bark is still tender and sweet. Together they can do so much damage that you can hardly blame the owner for becoming angry and trying to kill them. I'm sorry to say that Jack Rabbit becomes a dreadful nuisance when he goes where he has no business."
        - id: ch01-b45
          speaker: old_mother_nature
          text: "I think you've learned enough about your long-legged cousins for now. I have a great deal of work to do, so both of you run along home."
        - id: ch01-b46
          speaker: peter_rabbit
          text: "If you please, Mother Nature, may we come back tomorrow?"
        - id: ch01-b47
          speaker: old_mother_nature
          text: "What for? Haven't you learned enough about your family?"
        - id: ch01-b48
          speaker: peter_rabbit
          text: "Yes, but there are so many things I'd like to know about everyone else. If you please, I want to come to your school every day. The more I learn about my neighbors, the better I'll be able to take care of myself."
        - id: ch01-b49
          speaker: old_mother_nature
          text: "All right, Mr. Curiosity. Come again tomorrow morning. I would never turn away anyone who truly wants to learn."
        - id: ch01-b50
          speaker: narrator
          text: So Peter and Jumper politely said good-bye and started for home.
