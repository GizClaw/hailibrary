audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm, observant storytelling
        timbre: clear and gentle
        pace: measured
        pitch: medium
    peter_rabbit:
      display_name: Peter Rabbit
      tts:
        delivery: curious, quick, and expressive
        timbre: bright and youthful
        pace: lively
        pitch: medium-high
    jumper_the_hare:
      display_name: Jumper the Hare
      tts:
        delivery: attentive, direct, and eager
        timbre: clear and sturdy
        pace: moderately lively
        pitch: medium
