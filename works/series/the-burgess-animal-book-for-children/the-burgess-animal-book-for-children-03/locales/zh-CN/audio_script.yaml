audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 亲切生动，带着温和的幽默感
        timbre: 温暖清亮
        pace: 舒缓而富有变化
        pitch: 中等
    peter_rabbit:
      display_name: 彼得兔
      tts:
        delivery: 好奇直率，情绪来得快也去得快
        timbre: 清脆稚气
        pace: 轻快
        pitch: 中高
    jumper_hare:
      display_name: 长耳野兔跳跳
      tts:
        delivery: 朴实腼腆，认真时透着好奇
        timbre: 清朗柔和
        pace: 稍缓
        pitch: 中等
    mother_nature:
      display_name: 老大自然妈妈
      tts:
        delivery: 慈爱睿智，说话从容而坦率
        timbre: 温厚柔和
        pace: 从容
        pitch: 中低
  chapters:
    - id: ch01
      title: 第三章　彼得的长腿表亲们（续）
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 第二天太阳刚升起来，彼得兔和长耳野兔跳跳就准时赶来上课。老大自然妈妈瞧见他们眼里亮闪闪的，满是好奇，便笑了。她没等两个学生发问，自己先讲了起来。
        - id: ch01-b02
          speaker: mother_nature
          text: “昨天，我讲了那位爱水的表亲沼泽兔。你们在阳光灿烂的南方还有一个亲戚，差不多也这么喜欢水。有人叫他湿地兔，也有人叫他湿地野兔。其实后一个名字更准确，因为他是真正的野兔。他不住沼泽，住的是湿地，不过游泳游得很好，也很喜欢水。敌人追来时，他会直奔最近的池塘或溪流。”
        - id: ch01-b03
          speaker: jumper_hare
          text: “他有多大？”
        - id: ch01-b04
          speaker: mother_nature
          text: “差不多和你一样大，跳跳，兴许还重一点儿。他的毛比你的服帖，所以你们并排坐着，看起来倒可能是你更大。他跟沼泽兔一样，脚上的毛很稀。脚趾又长，还能张得很开，游水时可帮了大忙。”
        - id: ch01-b05
          speaker: mother_nature
          text: “这位湿地野兔跑得很快，并不像那位小表亲一样非下水不可。只是想甩掉追兵时，从水里走最容易。整个大千世界里，你们家只有他和沼泽兔喜欢水，也只有他们能在水里自在生活。现在还想听谁？”
        - id: ch01-b06
          speakers: [peter_rabbit, jumper_hare]
          ensemble: duo
          text: “我们那些个头最大的表亲！”
        - id: ch01-b07
          speaker: peter_rabbit
          text: “您昨天说，他们比跳跳还大。跳跳已经这么大了，真难相信还有谁能比他大许多。”
        - id: ch01-b08
          speaker: narrator
          text: 老大自然妈妈眼里闪过笑意。
        - id: ch01-b09
          speaker: mother_nature
          text: “自己一无所知的事，常常很难叫人相信。可跟另外那几位亲戚相比，跳跳一点儿也不算大。彼得，你觉得他是个大家伙。等他见到住在遥远冰雪北方的表亲，北极野兔白雪，恐怕也会觉得自己很小。白雪穿冬衣时很像跳跳，全身都是白的，只有两只耳朵尖是黑的。”
        - id: ch01-b10
          speaker: peter_rabbit
          text: “白雪一年到头都穿白衣服吗？”
        - id: ch01-b11
          speaker: mother_nature
          text: “如果他住得非常靠北，一年大半时候都有冰雪，就一直穿白衣。要是住得稍微靠南，夏天的雪会消失一小段时间，他便会脱下白衣，换上一身灰衣。”
        - id: ch01-b12
          speaker: peter_rabbit
          text: “可是，那里的冰雪几乎不化，他怎么活呢？又能吃到什么？”
        - id: ch01-b13
          speaker: narrator
          text: 彼得一脸不解。
        - id: ch01-b14
          speaker: mother_nature
          text: “那么靠北的地方，雪底下照样长着苔藓。短短的夏天里，也会长出别的植物。到了漫长的冬天，白雪就一层层挖开积雪，找到它们来吃。他还会啃那些怎么也长不高的小树，吃树皮，也吃细枝。可就算白雪这么大，你们仍有一位更大的表亲。他才是全家族最大的。”
        - id: ch01-b15
          speakers: [jumper_hare, peter_rabbit]
          ensemble: duo
          text: “他是谁？”
        - id: ch01-b16
          speaker: mother_nature
          text: “他叫白尾杰克，主要住在西北部辽阔的大平原，山里和森林里偶尔也能见到他。有人叫他草原野兔。冬天，他穿白衣。夏天，他换上浅棕色的衣服。只有尾巴一年四季都是白的，跟你很像，彼得。所以大家才叫他白尾杰克。”
        - id: ch01-b17
          speaker: peter_rabbit
          text: “他的尾巴也像我的这么短吗？”
        - id: ch01-b18
          speaker: narrator
          text: 老大自然妈妈听了，放声笑起来。
        - id: ch01-b19
          speaker: mother_nature
          text: “不，彼得。别的动物不会说他的尾巴长，可在你们家里，那的确算长尾巴了。他奔跑时还会把尾巴甩来甩去。他的后腿又长又有力，根本不用使出一半力气，一跳就有二十英尺远。就算老郊狼跟他沿着笔直的路赛跑，也休想追上他。”
        - id: ch01-b20
          speaker: mother_nature
          text: “你觉得跳跳的耳朵很长，可跟白尾杰克相比就短了。他的耳朵又长又大。等他蹲进自己的浅窝，把耳朵向背后一贴，耳尖能远远伸过肩头。他跟野兔家族的其他成员一样，不躲地洞，也不钻空心木头。他只相信自己的长腿，靠惊人的速度从敌人面前逃走。”
        - id: ch01-b21
          speaker: mother_nature
          text: “嚎叫狼、老郊狼、鹰、隼和猫头鹰，都是他的敌人。他大得能抵上五六个你呢，彼得。”
        - id: ch01-b22
          speaker: narrator
          text: 彼得深深吸了一口气，惊叹过后，又赶忙补充起来。
        - id: ch01-b23
          speaker: peter_rabbit
          text: “我竟有这么大的表亲，真叫人不敢相信。不过，您说是真的，那就一定是真的。我还有别的表亲，也差不多这么大吗？”
        - id: ch01-b24
          speaker: narrator
          text: 老大自然妈妈点点头。
        - id: ch01-b25
          speaker: mother_nature
          text: “还有几位很像白尾杰克，只是没有他那么大。他们也有同样长的后腿和同样大的耳朵，不过毛色不同，住在更靠南的大平原。有些住得非常靠南，那里一年四季都暖和。家在西南部的羚羊杰克，就是其中一个。”
        - id: ch01-b26
          speaker: peter_rabbit
          text: “快给我们讲讲他吧。”
        - id: ch01-b27
          speaker: mother_nature
          text: “先说清楚，他属于你们家族里大杰克兔，也就是杰克野兔这一支。这一支其实谁也不该叫兔子。他们都是跳跳的嫡亲表兄弟，个个都是真正的野兔。他们全都长着大耳朵，脖子又长又细，腿也很长。就连他们的前腿，跟别的动物相比也不算短。”
        - id: ch01-b28
          speaker: mother_nature
          text: “羚羊杰克的个头，大概仅次于白尾杰克。他住的地方一年大半时候都很暖，可奇怪的是，他身上的毛大多是白的。背部和喉咙是黄棕色，两侧却是白色。更奇妙的是，他能让自己看上去几乎通身雪白。”
        - id: ch01-b29
          speaker: mother_nature
          text: “我给了他一些特别的小肌肉。他只要愿意，就能把白毛向外铺开，两侧的白色看起来几乎会在背上相接。阳光一照，那些白毛会闪出远远就能看见的亮光。羚羊杰克和朋友们隔得很远时，就是这样彼此照应的。”
        - id: ch01-b30
          speaker: mother_nature
          text: “只有另一种动物也能这样闪光传信，那就是羚羊，它的故事以后再讲。羚羊杰克正因为会发出这样的信号，才有了这个名字。除此以外，他的习性跟家里的同类差不多，也是靠长腿和出色的跳跃本领让自己远离危险。”
        - id: ch01-b31
          speaker: mother_nature
          text: “羚羊杰克没有那位更常见的表亲出名。那位表亲就是普普通通的杰克兔，几乎人人都认识他。”
        - id: ch01-b32
          speaker: narrator
          text: 彼得摇了摇头，很不好意思地小声开口。
        - id: ch01-b33
          speaker: peter_rabbit
          text: “我就不认识。”
        - id: ch01-b34
          speaker: mother_nature
          text: “那你该认识认识他了。要是去过遥远的大西部，你一定知道他，那里人人都认识他。他虽然没有羚羊杰克那么大，却也是个大家伙。他穿着一身棕色外衣，样子很像跳跳，两只长耳朵的尖端是黑的。他的尾巴比跳跳长，奔跑时不会翘起来，而是一直垂向下方。”
        - id: ch01-b35
          speaker: peter_rabbit
          text: “我的尾巴可不往下垂。”
        - id: ch01-b36
          speaker: narrator
          text: 老大自然妈妈又笑出了声。
        - id: ch01-b37
          speaker: mother_nature
          text: “没错，彼得，一点儿不错。你就算想让尾巴垂下去也办不到。它太短了，除了向上翘，根本没有别的方向可去。杰克的尾巴比你的长，腿也比你的长。他跑得可快啦！一步接一步，跨着大步往前冲。大约每跑十步，他还会高高跳起一次，好看清四周有没有敌人。”
        - id: ch01-b38
          speaker: peter_rabbit
          text: “谁是他的敌人？”
        - id: ch01-b39
          speaker: mother_nature
          text: “狐狸、郊狼、隼、鹰、猫头鹰、鼬，还有人。其实，他的敌人跟你的差不多一样多。”
        - id: ch01-b40
          speaker: peter_rabbit
          text: “您说的人，就是猎人吧？”
        - id: ch01-b41
          speaker: narrator
          text: 老大自然妈妈点了点头。
        - id: ch01-b42
          speaker: mother_nature
          text: “对。有些人为了取乐去猎杀他，还有些人是想把他除掉。”
        - id: ch01-b43
          speaker: narrator
          text: 彼得一听，立刻竖起耳朵。
        - id: ch01-b44
          speaker: peter_rabbit
          text: “他们为什么想除掉他？他做了什么坏事？”
        - id: ch01-b45
          speaker: mother_nature
          text: “他住得离人很远时，并不会做坏事。可一旦住到人家附近，他就会闯祸，跟你跑进布朗农夫的菜园时一个样。”
        - id: ch01-b46
          speaker: narrator
          text: 老大自然妈妈说这话时神情十分严厉，彼得惭愧地低下了头。
        - id: ch01-b47
          speaker: peter_rabbit
          text: “我知道自己不该去那个菜园，可您不知道，那里的东西有多诱人。吃起来实在太香了。”
        - id: ch01-b48
          speaker: narrator
          text: 老大自然妈妈把脸转到一边，免得彼得看见她眼里的笑意。等她再转回来，脸上已经恢复了严肃。
        - id: ch01-b49
          speaker: mother_nature
          text: “这不是借口，彼得兔。你得有足够的定力，不能向诱惑低头。世上大多数麻烦，都是抵挡不住诱惑惹来的。人类会成为杰克兔的敌人，也是这个缘故。他就是没办法离开人们种下的庄稼。”
        - id: ch01-b50
          speaker: mother_nature
          text: “杰克兔的家族很大。要是一大群聚在苜蓿地里，钻进刚长出幼苗的麦田，或是闯进新果园去啃又嫩又甜的树皮，他们会造成很大的损失。田地和果园的主人因此发火，想办法杀掉他们，也不能全怪主人。说来实在遗憾，杰克兔跑到不该去的地方，真会变成一场大祸害。”
        - id: ch01-b51
          speaker: mother_nature
          text: “好了，你们的长腿表亲已经讲得够多了。我还有许多事情要忙，你们两个赶紧蹦回家吧。”
        - id: ch01-b52
          speaker: peter_rabbit
          text: “老大自然妈妈，我们明天还可以来吗？”
        - id: ch01-b53
          speaker: mother_nature
          text: “来做什么？自己家族的事，你们还没听够吗？”
        - id: ch01-b54
          speaker: peter_rabbit
          text: “家族的事已经够了，可我还想知道其他动物的许多许多事情。要是您答应，我想每天都来跟您上课。您看，我越了解自己的邻居，就越知道该怎样照顾好自己。”
        - id: ch01-b55
          speaker: mother_nature
          text: “好吧，好奇先生，明天早晨再来。我怎么也不会拒绝一个真心想求知的人。”
        - id: ch01-b56
          speaker: narrator
          text: 于是，彼得和跳跳彬彬有礼地向老大自然妈妈告别，各自回家去了。
