audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 亲切生动，带着温和的幽默感
        timbre: 温暖清亮
        pace: 舒缓而富有变化
        pitch: 中等
    peter_rabbit:
      display_name: 彼得兔
      tts:
        delivery: 好奇直率，情绪来得快也去得快
        timbre: 清脆稚气
        pace: 轻快
        pitch: 中高
    jumper_hare:
      display_name: 长耳野兔跳跳
      tts:
        delivery: 朴实腼腆，认真时透着好奇
        timbre: 清朗柔和
        pace: 稍缓
        pitch: 中等
    mother_nature:
      display_name: 老大自然妈妈
      tts:
        delivery: 慈爱睿智，说话从容而坦率
        timbre: 温厚柔和
        pace: 从容
        pitch: 中低
    happy_jack:
      display_name: 灰松鼠快乐杰克
      tts:
        delivery: 自信好胜，受窘时有些急躁
        timbre: 明亮爽脆
        pace: 轻快
        pitch: 中高
    chatterer:
      display_name: 红松鼠喋喋
      tts:
        delivery: 伶牙俐齿，争强好胜又活泼
        timbre: 尖细清亮
        pace: 明快
        pitch: 高
    striped_chipmunk:
      display_name: 花栗鼠条纹
      tts:
        delivery: 开朗谦和，机灵中带着几分自信
        timbre: 清亮柔和
        pace: 轻快
        pitch: 中高
    johnny_chuck:
      display_name: 土拨鼠约翰尼
      tts:
        delivery: 直率倔强，懒洋洋中带着粗朴的自信
        timbre: 浑厚结实
        pace: 稍缓
        pitch: 中低
  chapters:
    - id: ch01
      title: 第七章　土拨鼠约翰尼来上课
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 彼得兔把老大自然妈妈的话带给了土拨鼠约翰尼。约翰尼很不高兴，一个人嘟嘟囔囔。他不想上课，也不想知道亲戚们的事，觉得现在的生活已经再好不过。其实，他的日子过得太舒服，身子已经渐渐发胖，而他生来又懒。在家门口附近就能找到许多吃的，他当然很少走远。彼得离开时，约翰尼还在发牢骚。彼得一路偷笑着回到亲爱的老荆棘丛，因为他知道，约翰尼绝不敢违抗老大自然妈妈。
        - id: ch01-b02
          speaker: narrator
          text: 果然，第二天早晨，老大自然妈妈正要开课，约翰尼便摇摇摆摆地穿过绿森林来了。他满脸不高兴，其他伙伴向他问好，他一声也不应。可是老大自然妈妈一开口，他马上变得很有礼貌。
        - id: ch01-b03
          speaker: mother_nature
          text: “早上好，约翰尼。”
        - id: ch01-b04
          speaker: narrator
          text: 约翰尼点了点头。
        - id: ch01-b05
          speaker: johnny_chuck
          text: “早上好。”
        - id: ch01-b06
          speaker: mother_nature
          text: “我听说，你根本不想了解自己的亲戚。谁不愿意学习，我都替他惋惜。一个人知道得越多，就越有本事照顾自己，也越能在大千世界的种种事务中尽好自己的一份责任。不过，我今天叫你来，并不是为了让你自己得益，而是为了你的朋友和邻居。来，坐直一点儿，让大家都能把你看清楚。”
        - id: ch01-b07
          speaker: narrator
          text: 约翰尼听话地坐直了身子。其他伙伴自然全都盯着他看，弄得他浑身不自在。
        - id: ch01-b08
          speaker: mother_nature
          text: “你们还记得吧？我说约翰尼属于松鼠家族时，你们都吓了一跳。快乐杰克，你坐到他身边去。其他人仔细看看，他们有没有一家人的相貌。”
        - id: ch01-b09
          speaker: narrator
          text: 快乐杰克和约翰尼肩并肩坐直了身子。彼得仔细一看，马上发现他们的模样真有些相似，身上确实带着一家人的样子。
        - id: ch01-b10
          speaker: peter_rabbit
          text: “咦，真的呀！约翰尼看起来还真像松鼠！”
          emotion: surprised
        - id: ch01-b11
          speaker: mother_nature
          text: “他当然像松鼠，因为他本来就是。约翰尼个头大得多，身子又粗又胖，所以没有真正的树松鼠那么轻盈。不过，你们会发现，他的脑袋和快乐杰克的形状很像。仔细看，那分明是一张松鼠脸。土拨鼠有时也叫地猪，可为什么会有人这样叫他们，我实在想不通。他们属于松鼠家族的旱獭一支，无论生活在哪里，模样都很相似。”
        - id: ch01-b12
          speaker: mother_nature
          text: “你们再看他的颜色。约翰尼的外套是黄褐色，脚是很深的褐色，几乎发黑。脑袋深褐，两颊浅灰，喉咙和身子下面则是橙红色。他的尾巴在松鼠家族里算短的，虽然毛茸茸，却不大。胡须倒有不少，根根都是黑的。有些土拨鼠身上相当灰，偶尔也有几乎全黑，甚至通身乌黑的，就像灰松鼠中也会有黑色的一样。”
        - id: ch01-b13
          speaker: mother_nature
          text: “我们眼前这位约翰尼不爱绿森林，更喜欢老果园和绿草原。不过在这个国家的有些地方，他的族亲偏偏喜欢住在绿森林边缘。你们再看看他的爪子，长得十分粗壮。这些爪子能帮他挖土，因为旱獭一家个个都是挖洞能手。约翰尼，你的爪子还有别的用处吗？”
        - id: ch01-b14
          speaker: johnny_chuck
          text: “有啊，它们还能帮我爬树。”
        - id: ch01-b15
          speaker: peter_rabbit
          text: “爬树？谁听说过土拨鼠会爬树？”
          emotion: surprised
        - id: ch01-b16
          speaker: johnny_chuck
          text: “有必要时我当然能爬！灌木和矮树，我爬过好多次。只要先跑起来，树干笔直也没关系，只要树皮够粗糙，我能一直爬到最低的树枝，当然，那根树枝不能太高。你去问狐狸雷迪，他最清楚我会不会爬！”
          emotion: angry
        - id: ch01-b17
          speaker: mother_nature
          text: “这话没错。你确实能爬一点儿，不过还算不上真正的爬树能手。挖洞才是你的长处。”
        - id: ch01-b18
          speaker: peter_rabbit
          text: “他挖洞的本领当然没话说！哎呀，沙土能让他刨得四处乱飞。要说挖洞，约翰尼真是再自在不过了。”
        - id: ch01-b19
          speaker: mother_nature
          text: “你应该庆幸他这么会挖，因为他挖出的洞不止一次救过你的命。对了，彼得，既然你对那些洞这么熟悉，就给大家讲讲约翰尼住着什么样的家吧。”
        - id: ch01-b20
          speaker: narrator
          text: 彼得正想显显自己的见识，听见这话高兴极了，马上把自己知道的情形讲了起来。
        - id: ch01-b21
          speaker: peter_rabbit
          text: “我上次去的那个家，入口很大，门前堆着一大堆沙土。里面是一条长长的地道，先斜着向下伸出很远，然后才变平。往下走一小段，地道会窄下来，后面一路都是同样的宽窄。最深处有一间舒服的小卧室，里面铺着草，旁边还有一两间小屋。另有两条岔道向上通到地面，成了侧门或后门。”
        - id: ch01-b22
          speaker: peter_rabbit
          text: “那两扇门外一点儿沙土也没有，还被垂下来的长草遮得严严实实。我一直想不通，约翰尼挖出那两条地道、打开两扇门时，怎么能不在门口留下哪怕一点儿沙土。”
        - id: ch01-b23
          speaker: johnny_chuck
          text: “哼，那还不简单！我把挖出的沙土全从正门推出去了。这样，谁从那些后门附近经过，也不会发现有什么东西值得注意。碰上危险，那些后门可管用得很。”
        - id: ch01-b24
          speaker: happy_jack
          text: “你家每次都有三扇门吗？”
        - id: ch01-b25
          speaker: johnny_chuck
          text: “不一定。有时两扇，偶尔只有一扇。不过只有一扇门不安全，我总想至少留两扇。”
        - id: ch01-b26
          speaker: striped_chipmunk
          text: “你每年都住同一所房子吗？”
        - id: ch01-b27
          speaker: narrator
          text: 约翰尼摇了摇头。
        - id: ch01-b28
          speaker: johnny_chuck
          text: “不住。每年春天，我都要挖一个新洞。土拨鼠太太和我喜欢换换景致。因为我不爱旅行，新家通常离旧家不远。不过，有时候附近实在找不到正合心意的地方，我们也会走出很远。”
        - id: ch01-b29
          speaker: jumper_hare
          text: “你们的宝宝就出生在地下那间小卧室里吗？”
        - id: ch01-b30
          speaker: johnny_chuck
          text: “当然。不在那里，还能在哪里？”
        - id: ch01-b31
          speaker: jumper_hare
          text: “我只是不知道，土拨鼠太太会不会也在地面筑巢，就像彼得太太和跳跳太太那样。”
        - id: ch01-b32
          speaker: narrator
          text: 跳跳说得有些怯生生的。
        - id: ch01-b33
          speaker: johnny_chuck
          text: “才不会呢！我们的宝宝全都出生在地下那间小卧室里。他们会一直留在地下，等长到能自己出去寻找食物，才会离开那里。”
        - id: ch01-b34
          speaker: chatterer
          text: “你们通常会生几个宝宝？”
        - id: ch01-b35
          speaker: johnny_chuck
          text: “六个或八个。土拨鼠太太和我喜欢孩子多的大家庭。”
        - id: ch01-b36
          speaker: striped_chipmunk
          text: “你也像家族里的其他成员一样吃坚果吗？”
        - id: ch01-b37
          speaker: johnny_chuck
          text: “不吃，我什么时候都只爱青嫩的食物。没有什么比鲜嫩香甜的苜蓿和嫩草更好吃了。不过，农夫布朗菜园里种出的那些上好蔬菜，也一样美味。”
        - id: ch01-b38
          speaker: narrator
          text: 彼得使劲点头，显然非常赞同。
        - id: ch01-b39
          speaker: happy_jack
          text: “那么，你就是人们说的素食者了？”
        - id: ch01-b40
          speaker: johnny_chuck
          text: “我想应该是吧。”
        - id: ch01-b41
          speaker: happy_jack
          text: “所以你才会睡上一整个冬天，对不对？”
        - id: ch01-b42
          speaker: johnny_chuck
          text: “不睡的话，我就会饿死。霜杰克快来时，我会把最后那些美味的青嫩食物吃了又吃，塞了又塞，一直吃到胖得几乎走不动。然后我钻进卧室，蜷起身子睡大觉。外面天气寒冷也好，满地冰雪也好，我一点儿都不用担心。”
        - id: ch01-b43
          speaker: striped_chipmunk
          text: “我明白，我自己也会睡过大半个冬天。不过我在家里存了许多食物，偶尔会醒来吃一点儿。约翰尼，你冬天会醒吗？”
        - id: ch01-b44
          speaker: johnny_chuck
          text: “不会，谢天谢地，我会一觉睡过整个冬天。有时春天刚到，地上的雪还没有完全融化，我就醒了，比我希望的还早。这时，身上的脂肪就派上用场了。它能让我保持暖和，也能让我一直活到第一批绿色植物长出来。”
        - id: ch01-b45
          speaker: johnny_chuck
          text: “你们也许发现了，早春时的我有多瘦，秋天时的我就有多胖。这是因为我等着最早的绿色食物冒出来时，已经把身上的脂肪一点点用光了。”
        - id: ch01-b46
          speaker: peter_rabbit
          text: “你的敌人多吗？”
        - id: ch01-b47
          speaker: narrator
          text: 彼得自己的敌人太多了，所以总会想到这件事。
        - id: ch01-b48
          speaker: johnny_chuck
          text: “不算多，可也够受的。最坏的是狐狸雷迪、老郊狼、人和狗。当然，我还小的时候，总得时刻提防老鹰。至于黄鼠狼黑影，我们这些小家伙谁不怕他？我自然也怕。”
        - id: ch01-b49
          speaker: johnny_chuck
          text: “狐狸雷迪不止一次想把洞挖开，抓我出去，可他挖得没我快。他要是真把我逼到无路可退，就会知道我也会打架。有一次，我还没来得及逃回洞里，一条小狗突然扑了过来。我想，那条狗以后再也不敢招惹另一只土拨鼠了。”
        - id: ch01-b50
          speaker: mother_nature
          text: “下课时间到了。约翰尼在大西部的山里有一位大个子表亲，名叫吹口哨。在大西部的草原上，他还有一位小个子表亲，名叫吠吠。他们都是旱獭家族很重要的成员。你们要是愿意听，明天我就给你们讲讲他们。”
        - id: ch01-b51
          speaker: mother_nature
          text: “约翰尼，你明天不用来，除非你自己愿意。”
        - id: ch01-b52
          speaker: narrator
          text: 约翰尼垂下了头。他想起自己早晨那么不情愿来上课，心里不免有些惭愧。
        - id: ch01-b53
          speaker: johnny_chuck
          text: “大自然妈妈，如果您不介意，我想我明天会来的。我以前不知道自己还有这么亲近的亲戚，现在我想了解他们。”
        - id: ch01-b54
          speaker: narrator
          text: 大家就这样约好了，也一致答应，第二天早晨太阳一升起，他们就全都准时来到这里，一个也不会少。随后，伙伴们纷纷踏上回家的路，一路慢慢回想着今天学到的种种知识。
