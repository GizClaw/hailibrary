  chapters:
    - id: ch01
      title: Johnny Chuck Joins the Class
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Peter Rabbit carried Mother Nature's message to Johnny Chuck, but Johnny was not pleased at all. He grumbled and growled to himself. He had no wish to attend school. He did not want to learn anything about his relatives, either. Things suited him perfectly just as they were. The truth was that Johnny had already begun to grow fat from good eating, and he was lazy by nature. He could usually find all the food he needed very close to home, so he rarely traveled far beyond his own doorstep. Peter left him there grumbling and growling. Then he chuckled to himself all the way back to the dear Old Briar-patch, because he knew Johnny would never dare disobey Old Mother Nature.
        - id: ch01-b02
          speaker: narrator
          text: Sure enough, Johnny came waddling through the Green Forest the next morning just as Old Mother Nature was ready to begin school. He did not look happy at all. When the others greeted him, he gave them no answer. Yet the moment Old Mother Nature spoke to him, Johnny became very polite.
        - id: ch01-b03
          speaker: old_mother_nature
          text: "Good morning, Johnny Chuck."
        - id: ch01-b04
          speaker: narrator
          text: Johnny dipped his head.
        - id: ch01-b05
          speaker: johnny_chuck
          text: "Good morning."
        - id: ch01-b06
          speaker: old_mother_nature
          text: "I hear you have no interest in learning about your relatives. I feel sorry for anyone who does not want to learn. The more you know, the better you can look after yourself and do your share in the Great World. Still, I did not send for you this morning for your own sake. I sent for you so your friends and neighbors could learn. Now sit up and let everyone have a good look at you."
        - id: ch01-b07
          speaker: narrator
          text: Johnny obeyed and sat up. All the others stared, and he felt very uncomfortable.
        - id: ch01-b08
          speaker: old_mother_nature
          text: "You little folks were very surprised when I told you Johnny Chuck belongs to the Squirrel family. Happy Jack, sit beside him. Everyone else, look closely at the two of them and see whether you can spot the family resemblance."
        - id: ch01-b09
          speaker: narrator
          text: Happy Jack and Johnny Chuck sat upright side by side. Peter saw the likeness at once. There really was a family look about them.
        - id: ch01-b10
          speaker: peter_rabbit
          text: "Why, Johnny Chuck really does look like a Squirrel!"
          emotion: surprised
        - id: ch01-b11
          speaker: old_mother_nature
          text: "Naturally he looks like a Squirrel, because he is one. Johnny is much larger than the true Squirrels. His body is so stout that he has none of their graceful shape. But look closely at his head. It is shaped much like Happy Jack's, and then you can see that Johnny really has a Squirrel face. Woodchucks are sometimes called Ground Hogs, though why anyone would call them that is more than I can understand. They belong to the Marmot branch of the Squirrel family. Wherever Woodchucks are found, they look very much alike."
        - id: ch01-b12
          speaker: old_mother_nature
          text: "As you can see, Johnny's coat is yellowish brown. His feet are such a deep brown that they are almost black. His head is dark brown, with light gray on his cheeks. His throat and the rest of his underside are reddish orange. His tail is short for a member of the Squirrel family. Though it is bushy, it is not very large. He also has a number of whiskers, and every one is black. Not all Woodchucks have exactly Johnny's colors. Some are quite gray. Now and then, one is nearly black or entirely black, just as some Gray Squirrels are black."
        - id: ch01-b13
          speaker: old_mother_nature
          text: "Johnny does not care much for the Green Forest. He loves the Old Orchard and the Green Meadows instead. In some parts of the country, though, members of his family prefer to live right along the forest's edge. Now look at Johnny's strong claws. They help him dig, because every member of the Marmot family is a fine digger. Johnny, what else do you use those claws for?"
        - id: ch01-b14
          speaker: johnny_chuck
          text: "They help me climb."
        - id: ch01-b15
          speaker: peter_rabbit
          text: "Climb? Whoever heard of a Woodchuck climbing?"
          emotion: surprised
        - id: ch01-b16
          speaker: johnny_chuck
          text: "I can climb when I need to. I've gone up bushes and low trees plenty of times. If I get a good running start, I can even climb the straight trunk of a tree with rough bark. I can make it up to the first branches, as long as they aren't too far above the ground. Ask Reddy Fox whether I can climb. He knows."
          emotion: angry
        - id: ch01-b17
          speaker: old_mother_nature
          text: "That is true, Johnny. You can climb a little, though you are not much of a climber. Digging is what you do best."
        - id: ch01-b18
          speaker: peter_rabbit
          text: "He certainly can dig! You should see the sand fly when Johnny gets to work. Digging is where he feels right at home."
        - id: ch01-b19
          speaker: old_mother_nature
          text: "You should be grateful for that. The holes Johnny has dug have saved your life more than once. Since you know those holes so well, Peter, tell us what kind of home he has."
        - id: ch01-b20
          speaker: narrator
          text: Peter was delighted to show what he knew.
        - id: ch01-b21
          speaker: peter_rabbit
          text: "The last home of his I visited began with a long tunnel. It sloped downward for quite a distance and then leveled off. The entrance was large, with a great heap of sand piled in front of it. A little way down, the tunnel became smaller. After that, it stayed the same size all the way to the end. Far down at that end was a comfortable little bedroom with grass inside it. There were one or two other small rooms, too. Two branching tunnels led upward to the surface and made side or rear doorways. Neither of those doors had any sand around it. Long grass hung over them, so both were well hidden. I still don't understand how Johnny made those doors without leaving a bit of sand on either doorstep."
        - id: ch01-b22
          speaker: johnny_chuck
          text: "Huh! That was simple enough. I pushed every bit of sand out through the main entrance. I made sure there was nothing near the back doors that might catch the eye of anyone passing by. Those hidden doors are very useful when danger comes."
        - id: ch01-b23
          speaker: happy_jack
          text: "Do you always make three doors?"
        - id: ch01-b24
          speaker: johnny_chuck
          text: "No. Sometimes there are only two, and once in a while just one. One isn't truly safe, though, so I always mean to have at least two."
        - id: ch01-b25
          speaker: striped_chipmunk
          text: "Do you live in the same house every year?"
        - id: ch01-b26
          speaker: narrator
          text: Johnny shook his head.
        - id: ch01-b27
          speaker: johnny_chuck
          text: "No. I dig a fresh hole every spring. Mrs. Chuck and I enjoy a change of scene. Since I am not fond of traveling, our new home is usually not very far from the old one. Sometimes we search nearby and cannot find any place that suits us just right. When that happens, we may travel quite a distance before we settle down."
        - id: ch01-b28
          speaker: jumper_the_hare
          text: "Are your babies born in that little underground bedroom?"
        - id: ch01-b29
          speaker: johnny_chuck
          text: "Of course they are. Where else would they be born?"
        - id: ch01-b30
          speaker: jumper_the_hare
          text: "I wondered if Mrs. Chuck might build a nest on the ground, the way Mrs. Peter and Mrs. Jumper do."
        - id: ch01-b31
          speaker: narrator
          text: Jumper answered meekly.
        - id: ch01-b32
          speaker: johnny_chuck
          text: "No, indeed! Our babies are born in that little bedroom below ground. They remain safely down in the ground while they are small. They do not come out until they are big enough to go looking for food on their own."
        - id: ch01-b33
          speaker: chatterer_the_red_squirrel
          text: "How many babies do you usually have?"
        - id: ch01-b34
          speaker: johnny_chuck
          text: "Six or eight. Mrs. Chuck and I believe in having a large family."
        - id: ch01-b35
          speaker: striped_chipmunk
          text: "Do you eat nuts like the rest of our family?"
        - id: ch01-b36
          speaker: johnny_chuck
          text: "No. I'll choose green food every time. Nothing tastes better than tender, sweet clover and young grass, except perhaps those excellent vegetables Farmer Brown grows in his garden."
        - id: ch01-b37
          speaker: narrator
          text: Peter Rabbit nodded very firmly, as though he fully agreed.
        - id: ch01-b38
          speaker: happy_jack
          text: "Then I suppose you're what people call a vegetarian."
        - id: ch01-b39
          speaker: johnny_chuck
          text: "I suppose I am."
        - id: ch01-b40
          speaker: happy_jack
          text: "And is that why you sleep all winter?"
        - id: ch01-b41
          speaker: johnny_chuck
          text: "If I stayed awake through winter, I would starve. When it is nearly time for Jack Frost to arrive, I eat and eat and eat the last of the good green things. I keep stuffing myself until I am so fat that I can hardly waddle. Then I go down into my underground bedroom, curl myself up, and fall asleep. After that, cold weather, snow, and ice don't trouble me one bit."
        - id: ch01-b42
          speaker: striped_chipmunk
          text: "I understand. I sleep through most of the winter myself. But I store plenty of food in my house, and now and then I wake up for a bite. Do you ever wake during the winter, Johnny?"
        - id: ch01-b43
          speaker: johnny_chuck
          text: "No, thank goodness. I sleep straight through the winter. Sometimes I wake very early in spring, before all the snow has melted. That is earlier than I would like to wake, and that is when my fat is useful. It keeps me warm, and it keeps me alive until I can find the first green plants. Perhaps you have noticed how thin I am early in spring compared with how fat I was in fall. By then, I've used up all that fat while waiting for the first green things to appear."
        - id: ch01-b44
          speaker: peter_rabbit
          text: "Do you have many enemies?"
        - id: ch01-b45
          speaker: narrator
          text: Peter had so many enemies of his own that they were always on his mind.
        - id: ch01-b46
          speaker: johnny_chuck
          text: "Not many, but enough. Reddy Fox, Old Man Coyote, men, and Dogs are the worst. When I was small, I always had to keep watch for Hawks. And like all of us little folks, I'm afraid of Shadow the Weasel. Reddy Fox has tried more than once to dig me out, but I can dig faster than he can. If he ever traps me in a corner, he'll discover that I can fight. A small Dog once surprised me before I could reach my hole. I don't believe that Dog will ever attack another Woodchuck."
        - id: ch01-b47
          speaker: old_mother_nature
          text: "Our time is up. Johnny has a large cousin named Whistler who lives out in the mountains of the Great West. He also has a smaller cousin named Yap Yap who makes his home on the prairies of the Great West. Both of those cousins are important members of the Marmot family. Tomorrow, if all of you want me to, I will tell you about Whistler and Yap Yap. Johnny, you need not come tomorrow unless you want to."
        - id: ch01-b48
          speaker: narrator
          text: Johnny hung his head. He felt a little ashamed that he had been so unwilling to come that morning.
        - id: ch01-b49
          speaker: johnny_chuck
          text: "If you please, Mother Nature, I think I will come. I never knew I had any close relatives, and now I want to learn about them."
        - id: ch01-b50
          speaker: narrator
          text: They agreed to meet again at sun-up the next morning. Then everyone started home, thinking about all they had learned.
