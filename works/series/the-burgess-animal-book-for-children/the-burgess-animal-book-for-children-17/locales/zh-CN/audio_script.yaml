audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 亲切生动，带着温和的幽默感
        timbre: 温暖清亮
        pace: 舒缓而富有变化
        pitch: 中等
    peter_rabbit:
      display_name: 彼得兔
      tts:
        delivery: 好奇直率，情绪来得快也去得快
        timbre: 清脆稚气
        pace: 轻快
        pitch: 中高
    mother_nature:
      display_name: 老大自然妈妈
      tts:
        delivery: 慈爱睿智，说话从容而坦率
        timbre: 温厚柔和
        pace: 从容
        pitch: 中低
    striped_chipmunk:
      display_name: 花栗鼠条纹
      tts:
        delivery: 开朗谦和，机灵中带着几分自信
        timbre: 清亮柔和
        pace: 轻快
        pitch: 中高
    johnny_chuck:
      display_name: 土拨鼠约翰尼
      tts:
        delivery: 直率倔强，懒洋洋中带着粗朴的自信
        timbre: 浑厚结实
        pace: 稍缓
        pitch: 中低
    danny_meadow_mouse:
      display_name: 草地田鼠丹尼
      tts:
        delivery: 朴实谦逊，遇事谨慎又很有主见
        timbre: 温和结实
        pace: 稳健
        pitch: 中等
    whitefoot:
      display_name: 林鼠白足
      tts:
        delivery: 谨慎机敏，胆怯中透着清醒和坦然
        timbre: 轻柔清澈
        pace: 稍快而小心
        pitch: 中高
    happy_jack:
      display_name: 灰松鼠快乐杰克
      tts:
        delivery: 自信好胜，受窘时有些急躁
        timbre: 明亮爽脆
        pace: 轻快
        pitch: 中高
    chatterer:
      display_name: 红松鼠喋喋
      tts:
        delivery: 伶牙俐齿，争强好胜又活泼
        timbre: 尖细清亮
        pace: 明快
        pitch: 高
    piney_the_pine_mouse:
      display_name: 松田鼠松松
      tts:
        delivery: 腼腆老实，谈起自己的生活时认真坦率
        timbre: 轻柔朴实
        pace: 稍缓
        pitch: 中高
  chapters:
    - id: ch01
      title: 松松来到课堂
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 白足、丹尼和飞毛腿都来上课，鼠科已经有了好几位代表。飞毛腿突然现身、把大家吓了一跳的第二天早晨，课堂里又多了一位鼠科成员。他叫松松，是一只松田鼠。白足认识他，特意把他找来，一同参加这堂课。
        - id: ch01-b02
          speaker: whitefoot
          text: “我把松松带来了，你不会介意吧？”
        - id: ch01-b03
          speaker: mother_nature
          text: “我正欢迎他呢。亲眼看一看，总比光听别人讲清楚。现在，你们可以当面比较丹尼和松松这两位近亲了。快乐杰克，你先说说，他们哪里不一样？”
        - id: ch01-b04
          speaker: happy_jack
          text: “松松的身形跟丹尼差不多，不过个头要小一点儿。”
        - id: ch01-b05
          speaker: mother_nature
          text: “说得对。条纹，你还看出了什么？”
        - id: ch01-b06
          speaker: striped_chipmunk
          text: “松松的毛更短、更细，看着也更亮。他的外套是红褐色，比丹尼的颜色更红些。”
        - id: ch01-b07
          speaker: mother_nature
          text: “彼得，你的看法呢？”
        - id: ch01-b08
          speaker: peter_rabbit
          text: “松松的尾巴更短！”
        - id: ch01-b09
          speaker: narrator
          text: 彼得话一出口，大家全都笑了。
        - id: ch01-b10
          speaker: mother_nature
          text: “我就知道，你准会先看他的尾巴。从外表说，主要差别就是这些。他们的习性也不完全一样，不过相差不算太远。丹尼会在草丛里踩出小路，松松却会像鼹鼠矿工那样，紧贴地面下方挖出一条条小隧道。”
        - id: ch01-b11
          speaker: mother_nature
          text: “丹尼爱开阔的绿草原，也喜欢潮湿的地方。松松却愿意住在绿森林边缘，或是灌木长得很密的地方。要是果园疏于照料，遍地杂草，他在那里也很自在。不过，幼树园可经不起他折腾。他会咬断小树的根，还会剥掉自己够得着的树皮，害处不小。松松，你亲自告诉大家，你住在哪里，又怎样安排自己的家吧。”
        - id: ch01-b12
          speaker: narrator
          text: 松松生性害羞。他迟疑了一会儿，终于开了口。
        - id: ch01-b13
          speaker: piney_the_pine_mouse
          text: “我的家在地下。我先挖一间舒服的小卧室，让好几条隧道都通到那里，再用柔软的青草铺好窝。旁边还要挖一间或几间储藏室，通常比卧室还大。等哪间屋子装满了食物，我就搬来泥土，把入口封住。”
        - id: ch01-b14
          speaker: peter_rabbit
          text: “你会在里面存些什么？”
        - id: ch01-b15
          speaker: piney_the_pine_mouse
          text: “我存切成短段的青草，还有各种根。我最喜欢嫩根，也很爱树木和灌木的皮。”
        - id: ch01-b16
          speaker: mother_nature
          text: “松松还很喜欢钻进菜园，顺着一排马铃薯或别的根茎作物一路挖过去。这样的生活习惯会带来不少损害，所以人类很不喜欢他。条纹刚才说，他的外套带着红褐色。鼠科还有一位表亲，外套红得更加显眼，人们就叫他红背田鼠。他和丹尼差不多大，耳朵比丹尼大，尾巴也更长。”
        - id: ch01-b17
          speaker: mother_nature
          text: “红背田鼠爱住在绿森林里，无论白天还是夜晚，都很活跃。他长得很好看，尤其是坐起来进食的时候。他会像快乐杰克一样，用两只前爪捧住食物。他在地下打洞，入口藏在老树桩、石头或树根下面，再用柔软的青草或苔藓铺窝。有时候，他省去地下的卧室，直接住进空心圆木或空树桩。”
        - id: ch01-b18
          speaker: mother_nature
          text: “他很懂得为日后打算。地下的屋子、空心圆木和其他合适的地方，都会成为他的粮仓。他吃种子、小浆果、植物的根和其他植物。绿森林才是他最喜欢的家，而且他通常住得离人类的房屋很远。正因为这样，他很少造成真正的损害。”
    - id: ch02
      title: 住在大树上的红褐
      blocks:
        - id: ch02-b01
          speaker: mother_nature
          text: “鼠科还有一位穿红外套的小家伙，更加特别。他和丹尼是亲戚，却几乎一生都住在树上。他叫红褐树鼠，名字正是从那件红褐色外套来的。他的家在遥远西部的大森林。那里的树又粗又高，你们见过的最大一棵树，放在它们旁边也会显得很小。红褐就在那些巨树上生活。”
        - id: ch02-b02
          speaker: mother_nature
          text: “他原本属于鼠科的地鼠一支，谁也说不清他为什么偏偏搬上了树。不过，他确实在那里安了家，而且在树枝间来去自如，熟练得不输给任何一只松鼠。”
        - id: ch02-b03
          speaker: narrator
          text: 红松鼠喋喋一听，马上来了精神。
        - id: ch02-b04
          speaker: chatterer
          text: “那他也和松鼠一样，会在树上筑窝吗？”
        - id: ch02-b05
          speaker: mother_nature
          text: “当然会，而且有些窝相当惊人。有的地方，红褐只在大树上造窝，离地能有一百英尺高。有的地方，他也选小树，窝离地不过几英尺。高处的窝常是松鼠丢下的旧窝，红褐会把它扩建一番。有些窝造得非常大，一用就是许多年。每到新的一年，他还会接着往上添东西。”
        - id: ch02-b06
          speaker: mother_nature
          text: “一座大窝里可能有好几间卧室，还有许多小通道在里面穿来穿去。红褐太太通常独自住在大窝里，红褐则在外面一根树枝上另造一座小窝。那座大窝紧靠树干，坐落在好几根树枝汇合的地方。”
        - id: ch02-b07
          speaker: happy_jack
          text: “红褐会在不同的树之间来回走吗？还是只守着一棵树过日子？”
        - id: ch02-b08
          speaker: mother_nature
          text: “只要两棵树的枝条碰在一起，他想过去就能过去。茂密的森林里，这样的地方多得很。不过，那些树本身就大得惊人，我猜他平时多半只在自己的家树上活动。若有敌人爬上来，他就从这棵树跳到另一棵树逃走，办法跟你一样。”
        - id: ch02-b09
          speaker: danny_meadow_mouse
          text: “可他一直待在树上，吃的东西又从哪里来呢？我最想知道这个。”
        - id: ch02-b10
          speaker: narrator
          text: 老大自然妈妈听了，微微一笑。
        - id: ch02-b11
          speaker: mother_nature
          text: “当然就在他住的地方找呀。红褐四周都是食物，根本不用发愁。照人们目前所知道的，他吃冷杉和云杉针叶上较厚的部分。针叶也就是这些树的叶子。他还会吃幼嫩枝条上的树皮。”
        - id: ch02-b12
          speaker: mother_nature
          text: “这么看来，红褐比任何松鼠都更离不开树。他的体形大致和丹尼及其亲戚一样，只是尾巴相当长。好了，丹尼那些关系最近的亲戚，我们就说到这里。”
    - id: ch03
      title: 白足也有近亲
      blocks:
        - id: ch03-b01
          speaker: whitefoot
          text: “丹尼的亲戚真多。当然，多少算起来，他们也都是我的表亲。可我真希望自己也有几位关系更近的亲戚。”
        - id: ch03-b02
          speaker: mother_nature
          text: “你当然有。”
        - id: ch03-b03
          speaker: narrator
          text: 白足的大耳朵一听，立刻竖得笔直。
        - id: ch03-b04
          speaker: mother_nature
          text: “其中一位叫岩鼠大耳，住在遥远西部的山里。红褐最爱大树，大耳则最爱岩石。他偶尔也住在柴堆里，或住在灌木茂密的地方，可他最中意的始终是石头。岩鼠这个名字，就是这样来的。”
        - id: ch03-b05
          speaker: mother_nature
          text: “大耳是个漂亮的小家伙，个头也许比你略大一点儿。他穿得跟你很像，外套是黄褐色，身前还有一件白背心。他的长尾巴也和你的一样，从头到尾都长着毛。可是，他那对耳朵才真正叫人吃惊。整个鼠科里，没有谁的耳朵比他的更大，所以大家叫他大耳。”
        - id: ch03-b06
          speaker: mother_nature
          text: “他最喜欢夜里出来活动，不过天气阴沉时，白天也常露面。他吃种子和小坚果，尤其爱杜松子。每到冬天以前，他一定会存好充足的粮食。人们常常在很高的山上发现他。”
        - id: ch03-b07
          speaker: mother_nature
          text: “白足，你在东部海岸也有一位表亲。他住在阳光灿烂的南方，名叫海滩鼠。总的看，他的身形、长尾巴和大耳朵都跟你相像，只是身体略小，而且外套会随着住处改变颜色。如果住在远离海岸、土壤颜色较深的田野里，他背上的毛就是暗灰褐色。”
        - id: ch03-b08
          speaker: mother_nature
          text: “要是搬到海边的白沙上，他的毛色便会变得很浅。这位海滩鼠也住在地下，家就是一条又浅又短的洞穴。好了，小家伙们，鼠科的故事听到这里，难道还不够多吗？”
        - id: ch03-b09
          speaker: peter_rabbit
          text: “还不够！家鼠啃啃的事，你一个字也没讲。你答应过我们的。”
        - id: ch03-b10
          speaker: johnny_chuck
          text: “以前讲长脚袋鼠鼠时，你还说他跟囊鼠的关系最近。那囊鼠呢？”
        - id: ch03-b11
          speaker: narrator
          text: 老大自然妈妈忍不住笑了。
        - id: ch03-b12
          speaker: mother_nature
          text: “我明白了，你们非把所有事情都弄清楚不可。明天早晨准时到。到时候，我们应该能讲完鼠科，也能讲完你们大家所属的啮齿目。”
