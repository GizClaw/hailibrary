  chapters:
    - id: ch01
      title: Piney Comes to School
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Whitefoot the Wood Mouse, Danny Meadow Mouse, and Nimbleheels the Jumping Mouse already gave the Mouse family a strong showing at school. Yet when the class met the morning after Nimbleheels had appeared so suddenly, one more Mouse was there. It was Piney the Pine Mouse. Whitefoot knew him and had gone to find him.
        - id: ch01-b02
          speaker: whitefoot_the_wood_mouse
          text: "I hoped you wouldn't mind me bringing Piney along."
        - id: ch01-b03
          speaker: old_mother_nature
          text: "I'm very glad you did. Seeing something for yourself is much better than only hearing about it. Now everyone can compare two very close cousins, Danny Meadow Mouse and Piney the Pine Mouse. Happy Jack, what difference do you notice?"
        - id: ch01-b04
          speaker: happy_jack
          text: "Piney is shaped a lot like Danny, but he's a little smaller."
        - id: ch01-b05
          speaker: old_mother_nature
          text: "That's right. Striped Chipmunk, what do you see?"
        - id: ch01-b06
          speaker: striped_chipmunk
          text: "Piney's fur is shorter and finer, and it shines more. His coat is more reddish-brown than Danny's, too."
        - id: ch01-b07
          speaker: old_mother_nature
          text: "And what have you noticed, Peter Rabbit?"
        - id: ch01-b08
          speaker: peter_rabbit
          text: "Piney's tail is shorter."
        - id: ch01-b09
          speaker: narrator
          text: Everyone laughed.
        - id: ch01-b10
          speaker: old_mother_nature
          text: "Of course you looked at his tail first. Those are the main differences in their looks. Their habits are about as different. You all know that Danny cuts little paths through the grass. Piney doesn't. He makes shallow tunnels beneath the ground, much as Miner the Mole does."
        - id: ch01-b11
          speaker: old_mother_nature
          text: "Danny likes the open Green Meadows and damp places, but Piney prefers the edge of the Green Forest and places thick with brush. He feels at home in an orchard where weeds have been left to grow. In a young orchard, he can do great harm. He cuts the roots of young trees and strips away all the bark he can reach. Piney, tell us where you live and how you make your home."
        - id: ch01-b12
          speaker: narrator
          text: Piney was bashful, so he waited a moment before answering.
        - id: ch01-b13
          speaker: piney_the_pine_mouse
          text: "My home is underground. I dig a cozy little bedroom, with several entrances leading in from my tunnels, and fill it with a soft grass nest. Nearby, I dig one or more rooms for storing food. They're usually bigger than my bedroom. When one is full, I pack earth into its entrance and close it up."
        - id: ch01-b14
          speaker: peter_rabbit
          text: "What kind of food do you keep in those rooms?"
        - id: ch01-b15
          speaker: piney_the_pine_mouse
          text: "Short bits of grass and pieces of different roots. I especially like tender roots and the bark from trees and bushes."
        - id: ch01-b16
          speaker: old_mother_nature
          text: "And Piney loves finding a garden where he can tunnel beside a row of potatoes or other root crops. Those habits make him very destructive, so people dislike him. Striped Chipmunk pointed out Piney's reddish-brown coat. Another cousin has such a red coat that people call him the Red-backed Mouse. He is about Danny's size, but his ears are larger and his tail is longer."
    - id: ch02
      title: Another Little Redcoat
      blocks:
        - id: ch02-b01
          speaker: old_mother_nature
          text: "The Red-backed Mouse loves the Green Forest, and he is just as active in daylight as he is at night. He is a pretty little fellow, especially when he sits up to eat and holds his food in his paws the way Happy Jack does."
        - id: ch02-b02
          speaker: old_mother_nature
          text: "He usually makes a burrow with its entrance hidden beneath an old stump, a rock, or a tree root. Inside, he builds a nest of soft grass or moss. Sometimes he chooses a hollow log or stump for his nest instead of digging an underground bedroom."
        - id: ch02-b03
          speaker: old_mother_nature
          text: "He is thrifty, too. He saves food in underground rooms, hollow logs, and places like those. He eats seeds, small fruits, roots, and many kinds of plants. Because he prefers the Green Forest and usually stays far from people's homes, he causes very little real harm."
        - id: ch02-b04
          speaker: old_mother_nature
          text: "There is one more little Redcoat in the family. He is especially interesting because he is related to Danny Meadow Mouse, yet spends almost his whole life in trees. His name is the Rufous Tree Mouse. Rufous means reddish-brown, which is the color of his coat."
        - id: ch02-b05
          speaker: old_mother_nature
          text: "Rufous lives in the great forests of the Far West. The trees there are so tall and huge that even the biggest tree you have ever seen would seem small beside them. Those great trees are Rufous's home."
        - id: ch02-b06
          speaker: old_mother_nature
          text: "No one knows why he began living in trees, because he belongs to the part of the family called the Ground Mice. But he truly does live there, and he is every bit as comfortable in a tree as any Squirrel."
        - id: ch02-b07
          speaker: narrator
          text: Chatterer the Red Squirrel became interested at once.
        - id: ch02-b08
          speaker: chatterer_the_red_squirrel
          text: "Does he make a nest up in a tree the way a Squirrel does?"
        - id: ch02-b09
          speaker: old_mother_nature
          text: "He does, and it can be a remarkable nest. In some places, Rufous puts it only in large trees, sometimes a hundred feet above the ground. In other places, he uses small trees and builds only a few feet up."
        - id: ch02-b10
          speaker: old_mother_nature
          text: "The high nests are often old Squirrel nests that have been abandoned, enlarged, and rebuilt. Some grow very large because they are used year after year and more is added each time."
    - id: ch03
      title: Life High in the Trees
      blocks:
        - id: ch03-b01
          speaker: old_mother_nature
          text: "One of those big nests may have several bedrooms, with little passages running everywhere inside. Mrs. Rufous usually keeps a large nest to herself. Rufous has a smaller one of his own, farther out on a branch. Her big nest rests against the tree trunk where several branches come together."
        - id: ch03-b02
          speaker: happy_jack
          text: "Does Rufous move between different trees, or does he stay in just one?"
        - id: ch03-b03
          speaker: old_mother_nature
          text: "Whenever the branches of two trees touch, he can travel freely from one to the other whenever he wishes. That happens often in a thick forest, so he can roam through the treetops. Still, those trees are so enormous that I suspect he spends most of his time in the one that holds his home."
        - id: ch03-b04
          speaker: old_mother_nature
          text: "If an enemy comes into his home tree, though, Rufous escapes by jumping into another tree, just as you would."
        - id: ch03-b05
          speaker: danny_meadow_mouse
          text: "What I want to know is this. If Rufous is always in the trees, where does he find anything to eat?"
        - id: ch03-b06
          speaker: narrator
          text: Old Mother Nature smiled.
        - id: ch03-b07
          speaker: old_mother_nature
          text: "Why, he finds food right where he lives. Rufous never needs to worry about it because food surrounds him. As far as anyone knows, he eats only the thick parts of fir and spruce needles, which are their leaves, and the bark on tender twigs."
        - id: ch03-b08
          speaker: old_mother_nature
          text: "That makes Rufous more completely a tree dweller than anyone in the Squirrel family. His body has the same general shape as Danny and Danny's relatives, but Rufous has a rather long tail. I think that is enough about Danny Meadow Mouse's closest relatives."
        - id: ch03-b09
          speaker: whitefoot_the_wood_mouse
          text: "He certainly has plenty of them. I suppose they're all my cousins in a way, but I wish I had a few cousins who were closer to me."
        - id: ch03-b10
          speaker: narrator
          text: Whitefoot sounded a little wistful.
        - id: ch03-b11
          speaker: old_mother_nature
          text: "You do have closer cousins."
        - id: ch03-b12
          speaker: narrator
          text: Whitefoot's big ears pricked up.
    - id: ch04
      title: Whitefoot's Cousins
      blocks:
        - id: ch04-b01
          speaker: old_mother_nature
          text: "One is Bigear the Rock Mouse, who lives in the mountains of the Far West. He loves rocks as much as Rufous loves trees. He sometimes makes his home in brush heaps or brushy country, but rocks are his favorite places. That is why he is called the Rock Mouse."
        - id: ch04-b02
          speaker: old_mother_nature
          text: "Bigear is a pretty little fellow and perhaps a bit larger than you, Whitefoot. He even dresses much like you, in a yellowish-brown coat with a white waistcoat. His long tail is covered with hair from end to end, just as yours is."
        - id: ch04-b03
          speaker: old_mother_nature
          text: "But you should see his ears. No one else in the whole family has ears as large as his, and that is how he got the name Bigear. He prefers coming out at night, though you may see him on a cloudy day."
        - id: ch04-b04
          speaker: old_mother_nature
          text: "He eats seeds and small nuts and especially enjoys juniper seeds. He always gathers and stores a supply of food for the winter. Sometimes you can find him living very high up in the mountains."
        - id: ch04-b05
          speaker: old_mother_nature
          text: "Another of your cousins lives by the eastern seashore, down in the Sunny South. He is called the Beach Mouse. He has your general shape, your long tail, and your big ears, but he is a little smaller. The color of his coat depends on where he lives."
        - id: ch04-b06
          speaker: old_mother_nature
          text: "A Beach Mouse living inland, where the soil is dark, has a dark grayish-brown upper coat. One living on the white sand beside the sea has a very pale coat. Beach Mice make their homes in short burrows in the ground."
    - id: ch05
      title: More Mice for Tomorrow
      blocks:
        - id: ch05-b01
          speaker: old_mother_nature
          text: "Now, don't you little folks think you have learned enough about the Mouse family?"
        - id: ch05-b02
          speaker: peter_rabbit
          text: "Not yet! You haven't told us about Nibbler the House Mouse, and you promised you would."
        - id: ch05-b03
          speaker: johnny_chuck
          text: "And when we studied Longfoot the Kangaroo Rat, you said his closest relatives were the Pocket Mice. What can you tell us about them?"
        - id: ch05-b04
          speaker: narrator
          text: Old Mother Nature laughed.
        - id: ch05-b05
          speaker: old_mother_nature
          text: "I understand. You want to know everything there is to know. Come back tomorrow morning. I think we can finish the Mouse family then, and that will also finish the Rodent order that all of you belong to."
