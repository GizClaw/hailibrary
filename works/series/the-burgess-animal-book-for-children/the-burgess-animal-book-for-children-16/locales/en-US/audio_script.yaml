  chapters:
    - id: ch01
      title: Danny's Northern Cousins
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Whitefoot the Wood Mouse and Danny Meadow Mouse had become so interested in school that they would not miss the next lesson. Neither one wanted to make the long trip home and then travel all the way back. Whitefoot found a hole in a nearby stump and decided to camp there for a few days. Danny chose a comfortable place under a brush pile not far away and did the same. Both were ready when school opened the next morning.
        - id: ch01-b02
          speaker: old_mother_nature
          text: "Yesterday I promised to tell you about some of Danny's cousins. Far up in the North live two that are more closely related to him than to any other member of the Mouse family. Oddly enough, they aren't called Mice. They're called Lemmings, though they do belong to the Mouse family."
        - id: ch01-b03
          speaker: narrator
          text: Chatterer the Red Squirrel hurried up late and out of breath as Old Mother Nature began.
        - id: ch01-b04
          speaker: old_mother_nature
          text: "Bandy the Banded Lemming is especially interesting. He is the only member of the whole family that changes the color of his coat. In summer, his coat is a beautiful mix of reddish brown and gray. In winter, it turns completely white. He is also known as the Hudson Bay Lemming."
        - id: ch01-b05
          speaker: old_mother_nature
          text: "Danny may think his own tail is short, but Bandy's is so short that it barely shows beyond his long fur. Bandy is about Danny's size, only a little heavier and more thickset. All that long fur makes him look thicker still. His legs are very short. His ears are so tiny and so well hidden in the fur that he seems to have no ears at all."
        - id: ch01-b06
          speaker: old_mother_nature
          text: "The same northern country is home to his close relative, the Brown Lemming. He looks much like Bandy, but he stays brown all year. The two have much the same habits, and those habits are a lot like Danny's. They dig short underground burrows that lead to snug, warm nests made of grass and moss. In winter, their little tunnels branch out in every direction beneath the snow, with an opening to the surface here and there."
        - id: ch01-b07
          speaker: old_mother_nature
          text: "Brown Lemmings are far more numerous than Banded Lemmings. Their little paths run everywhere through the grass and moss. There is a great deal of moss in that country, and it covers the ground just as grass covers it here. But the most interesting thing about Lemmings is the way they migrate. To migrate means to move from one part of the country to another. You already know that most birds migrate. They fly to the Sunny South each fall and come back each spring."
        - id: ch01-b08
          speaker: old_mother_nature
          text: "Sometimes food grows very scarce where the Lemmings live. Then great numbers gather, much as migrating birds gather in flocks, and begin a long search for a place with plenty to eat. They form a great army and keep pushing forward, no matter what lies in the way. They swim across wide rivers and even lakes that block their path. And of course, they eat whatever food they find along the way."
        - id: ch01-b09
          speaker: danny_meadow_mouse
          text: "My goodness! I'm glad I don't live where I might have to travel that far. I don't envy those northern cousins one bit. The Green Meadows suit me perfectly."
        - id: ch01-b10
          speaker: old_mother_nature
          text: "That shows good common sense. Danny, you know Nimbleheels the Jumping Mouse, don't you? He likes the Green Meadows too. I should have asked him to come this morning."
    - id: ch02
      title: A Startling Arrival
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: Old Mother Nature had barely finished speaking when something dropped into the leaves almost at her feet, right in the middle of the school.
        - id: ch02-b02
          speaker: narrator
          text: Everyone moved at once. Danny Meadow Mouse raced beneath a heap of dead leaves. Whitefoot darted into a knothole in the log where he had been sitting. Jumper the Hare dodged behind a small hemlock. Peter Rabbit bolted toward a hollow log. Striped Chipmunk disappeared into a hole under an old stump. Johnny Chuck backed against a tree trunk and prepared to fight whatever had landed there.
        - id: ch02-b03
          speaker: narrator
          text: Only Happy Jack the Gray Squirrel, Chatterer the Red Squirrel, and Prickly Porky the Porcupine stayed where they were. All three were sitting in trees, and they felt quite safe up there. Once the others had reached shelter, they cautiously peeped out to see what had frightened them so badly.
        - id: ch02-b04
          speaker: narrator
          text: How foolish they felt then! Old Mother Nature was smiling at a little fellow about Whitefoot's size, but with a much longer tail. Their terrifying visitor was Nimbleheels the Jumping Mouse.
        - id: ch02-b05
          speaker: old_mother_nature
          text: "Well, well, well! I was just talking about you and wishing you were here. What brought you today? And why did you scare my pupils half out of their wits?"
        - id: ch02-b06
          speaker: narrator
          text: Her eyes twinkled. Nimbleheels could tell that she was only pretending to be stern.
        - id: ch02-b07
          speaker: narrator
          text: Before he could answer, Johnny Chuck began to chuckle. Soon he was laughing so hard that he had to hold his sides. Laughter spreads quickly, and before long everyone was laughing, though only Johnny knew why. At last Peter Rabbit caught his breath long enough to ask him.
        - id: ch02-b08
          speaker: peter_rabbit
          text: "Johnny, what is so funny?"
        - id: ch02-b09
          speaker: johnny_chuck
          text: "That tiny scrap of a fellow scared every one of us!"
          emotion: happy
        - id: ch02-b10
          speaker: narrator
          text: That made everyone laugh all over again. When the laughter finally ended, Nimbleheels answered Old Mother Nature's questions. He had heard about her school, just as nearly everyone in the Green Forest and on the Green Meadows had by then. By chance, he learned that Danny Meadow Mouse was attending. If school was good for Danny, he thought it should be good for him too. That was why he had come.
        - id: ch02-b11
          speaker: nimbleheels_the_jumping_mouse
          text: "Just before I got here, I heard a twig break behind me. At least, I thought I did. I jumped this way so I could reach safety. I never imagined anyone would be frightened by someone as little as me."
        - id: ch02-b12
          speaker: jumper_the_hare
          text: "What a jump! You sailed straight over my head, even though I was sitting upright!"
        - id: ch02-b13
          speaker: nimbleheels_the_jumping_mouse
          text: "Going over your head isn't much of a jump for me. You should see what I can do when I really try. I wasn't even trying half my hardest when I landed here. Still, I'm sorry I scared everybody. It feels strange to think I could frighten anyone. Mother Nature, have I arrived in time for today's lesson?"
        - id: ch02-b14
          speaker: old_mother_nature
          text: "You've missed some of it, but you're just in time for the part where I need you. Hop onto that log beside your cousin Whitefoot so everyone can see you."
    - id: ch03
      title: Built for Jumping
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: Nimbleheels hopped onto the log beside Whitefoot. Sitting side by side, the two little cousins looked much alike in their general shape, though Whitefoot was the prettier one. Nimbleheels wore a dull yellowish coat. It was darker across his back than along his sides, and he was white underneath just as Whitefoot was. His ears were much smaller than Whitefoot's. Still, the greatest differences between the cousins were in their hind legs and tails.
        - id: ch03-b02
          speaker: narrator
          text: Nimbleheels had long hind legs and feet, built on the same plan as Peter Rabbit's. One look at them was enough to show that he had been born to jump, and to jump well. Whitefoot had a long tail, but Nimbleheels had a much longer one. It was slim and tapered to the end.
        - id: ch03-b03
          speaker: old_mother_nature
          text: "There you see the greatest jumper for his size in this whole country. I mean the greatest jumper on the ground. Timmy the Flying Squirrel can travel farther in a leap, but first he must climb high and then coast down through the air."
        - id: ch03-b04
          speaker: old_mother_nature
          text: "You remember the wonderful leaps Jack Rabbit can make. But if Jack could leap as high and as far for his size as Nimbleheels can for his, Jack's longest jump would seem like no more than a hop. Both Nimbleheels and Whitefoot also have small pockets in their cheeks. Now, Nimbleheels, tell us where you live."
        - id: ch03-b05
          speaker: nimbleheels_the_jumping_mouse
          text: "I live among the weeds at the edge of the Green Meadows. Sometimes I wander far out onto the Meadows, but I like the weeds best. They're tall enough to hide me, and they give me plenty of food. I eat mostly seeds, though I enjoy berries and small nuts too, especially beechnuts."
        - id: ch03-b06
          speaker: nimbleheels_the_jumping_mouse
          text: "Some of my family would rather live in the Green Forest, especially where there's a Laughing Brook or a pond. As for me, I prefer the edge of the Green Meadows."
        - id: ch03-b07
          speaker: striped_chipmunk
          text: "Is your home underground?"
        - id: ch03-b08
          speaker: nimbleheels_the_jumping_mouse
          text: "My winter home is. In summer, I may put my nest only a few inches below the ground. Often I tuck it under a piece of bark or into a thick clump of grass, much as Danny Meadow Mouse does."
        - id: ch03-b09
          speaker: nimbleheels_the_jumping_mouse
          text: "When fall comes, I dig a deep burrow beyond Jack Frost's reach. Down there, in a cozy little bedroom, I sleep all winter. I make small storerooms too and fill them with seeds, berries, and nuts. Whenever I wake, there is plenty to eat."
        - id: ch03-b10
          speaker: old_mother_nature
          text: "I can add a little more. When Nimbleheels goes to sleep for the winter, he curls into a ball and wraps his long tail around himself. He sleeps very soundly in a bed of soft grass. And like Johnny Chuck, he grows very fat before his long sleep. Now, Nimbleheels, show us how you jump."
    - id: ch04
      title: Nimbleheels Shows His Skill
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: Nimbleheels hopped down from the log where he had been sitting. At once he shot high into the air in a long, beautiful leap, and everyone cried out in wonder. He bounded one way and then another, crossing the ground in great leaps. The class watched him go, and it truly was a marvelous sight.
        - id: ch04-b02
          speaker: old_mother_nature
          text: "His long tail keeps him balanced. Without it, he would tumble over and over and never know where or how he might land. He jumps like that only when danger threatens. When he isn't alarmed, he runs along the ground like the other members of the Mouse family."
        - id: ch04-b03
          speaker: old_mother_nature
          text: "That is all for today. Tomorrow I'll tell you more about the Mouse family."
