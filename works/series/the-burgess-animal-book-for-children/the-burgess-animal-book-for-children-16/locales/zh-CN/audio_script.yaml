audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 亲切生动，带着温和的幽默感
        timbre: 温暖清亮
        pace: 舒缓而富有变化
        pitch: 中等
    peter_rabbit:
      display_name: 彼得兔
      tts:
        delivery: 好奇直率，情绪来得快也去得快
        timbre: 清脆稚气
        pace: 轻快
        pitch: 中高
    mother_nature:
      display_name: 老大自然妈妈
      tts:
        delivery: 慈爱睿智，说话从容而坦率
        timbre: 温厚柔和
        pace: 从容
        pitch: 中低
    jumper_hare:
      display_name: 长耳野兔跳跳
      tts:
        delivery: 朴实腼腆，认真时透着好奇
        timbre: 清朗柔和
        pace: 稍缓
        pitch: 中等
    striped_chipmunk:
      display_name: 花栗鼠条纹
      tts:
        delivery: 开朗谦和，机灵中带着几分自信
        timbre: 清亮柔和
        pace: 轻快
        pitch: 中高
    johnny_chuck:
      display_name: 土拨鼠约翰尼
      tts:
        delivery: 直率倔强，懒洋洋中带着粗朴的自信
        timbre: 浑厚结实
        pace: 稍缓
        pitch: 中低
    danny_meadow_mouse:
      display_name: 草地田鼠丹尼
      tts:
        delivery: 朴实谦逊，遇事谨慎又很有主见
        timbre: 温和结实
        pace: 稳健
        pitch: 中等
    nimbleheels:
      display_name: 跳鼠飞毛腿
      tts:
        delivery: 谦和机敏，谈到跳跃时流露轻快自信
        timbre: 轻盈清澈
        pace: 明快
        pitch: 中高
  chapters:
    - id: ch01
      title: 第十六章　丹尼的北方表亲与飞毛腿
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 白足和丹尼听课听出了兴致，觉得下一课无论如何也不能错过。可他们又不想走那么远的路，先回家再赶来。白足便在附近一个树桩里找到洞，准备露营几天。丹尼也在不远处的灌木枝条下面找到一块舒服的地方，照样安顿下来。第二天早晨，学校一开课，他们两个都已经到了。
        - id: ch01-b02
          speaker: mother_nature
          text: “昨天我答应过，要讲讲丹尼的几位表亲。大北方住着两种旅鼠，他们跟丹尼的亲缘，比跟鼠科其他成员都近。名字虽然不叫鼠，却实实在在属于鼠科。”
        - id: ch01-b03
          speaker: narrator
          text: 老大自然妈妈刚开口，迟到的红松鼠喋喋才气喘吁吁地赶到。
        - id: ch01-b04
          speaker: mother_nature
          text: “第一位是斑纹旅鼠斑斑。他最特别，因为整个鼠科里，只有他会改变外套的颜色。夏天，他穿红褐与灰色相间的漂亮外套。冬天一到，外套便会通身雪白。他还有一个名字，叫哈得孙湾旅鼠。”
        - id: ch01-b05
          speaker: mother_nature
          text: “丹尼总嫌自己的尾巴短，可斑斑的尾巴更短，几乎伸不出长毛。斑斑跟丹尼差不多大，身体更粗壮，长毛又让他显得格外肥厚。他腿短，耳朵小，耳朵还全藏在毛里，看上去简直像没有耳朵。”
        - id: ch01-b06
          speaker: mother_nature
          text: “同一片遥远的北方还住着褐旅鼠。他跟斑斑很像，只是全身褐色，冬天也不换外套。他们两个的生活习性大致相同，也都和丹尼相近。他们会在地里挖出短短的洞道，通向用青草和苔藓铺成的温暖小窝。冬天，他们在积雪下面朝各个方向挖出小隧道，每隔一段还会留一个通往雪面的出口。”
        - id: ch01-b07
          speaker: mother_nature
          text: “褐旅鼠的数量多得多。他们的小径穿过青草与苔藓，遍地都是。大北方的苔藓很多，就像这里的青草一样铺满地面。不过，旅鼠最有意思的地方是迁徙，也就是从一片地方搬到另一片地方。大多数鸟儿每到秋天便飞往南方，春天再回来，这也是迁徙。”
        - id: ch01-b08
          speaker: mother_nature
          text: “有些时候，旅鼠住的地方会变得非常缺少食物。大批旅鼠便聚到一起，像迁徙的鸟群那样排成浩浩荡荡的队伍，出发寻找食物充足的地方。他们组成一支大军，一路向前，什么也拦不住。遇上宽阔的河流，甚至遇上湖泊，他们也会游过去。至于沿途能吃的东西，自然全都吃光了。”
        - id: ch01-b09
          speaker: danny_meadow_mouse
          text: “哎呀，幸好我不用住在那里，也不必走那么远的路！北方那些表亲，我一点儿也不羡慕。能住在绿草原上，我就心满意足了。”
        - id: ch01-b10
          speaker: mother_nature
          text: “这说明你很有见识。对了，丹尼，你认识跳鼠飞毛腿吧？他也很喜欢绿草原。我今天早晨真该捎信请他来。”
        - id: ch01-b11
          speaker: narrator
          text: 话音刚落，一个东西突然落进老大自然妈妈脚边的树叶里，正好掉在学校中间。丹尼立刻钻进一堆枯叶，白足窜进自己方才所坐圆木上的节孔，跳跳躲到小铁杉后面，彼得冲向一根空心圆木，条纹消失在老树桩下的洞里。约翰尼倒退到树干边，摆好了迎战的架势。只有快乐杰克、喋喋和刺刺留在原处。那三个伙伴本来就坐在树上，自然觉得自己安全得很。
        - id: ch01-b12
          speaker: narrator
          text: 等逃走的伙伴全躲到安全地方，一个个又探出头，想瞧瞧究竟是什么把自己吓成这样。他们这才看清，老大自然妈妈正低头笑着，望向一个小家伙。他跟小白足差不多大，尾巴却长得多。把大家吓得四散奔逃的，原来就是跳鼠飞毛腿。你说，他们该觉得多么、多么傻呀！
        - id: ch01-b13
          speaker: mother_nature
          text: “好呀，我刚才还在说你，希望你也来呢。你怎么赶来了？还有，你为什么把我的学生们吓得魂都快没了？”
        - id: ch01-b14
          speaker: narrator
          text: 老大自然妈妈眼里闪着笑意。飞毛腿一看就明白，她只是假装严厉。可他还没来得及回答，土拨鼠约翰尼已经咯咯笑了起来。笑声越来越响，最后约翰尼笑得连腰都直不起来，只好用手按住两肋。你知道，笑声是会传染的。不消一两分钟，所有伙伴都在笑，可除了约翰尼，谁也不知道笑话究竟在哪里。彼得好不容易忍住笑，开口追问。
        - id: ch01-b15
          speaker: peter_rabbit
          text: “约翰尼，你到底在笑什么呀？”
        - id: ch01-b16
          speaker: johnny_chuck
          text: “这么一丁点儿大的小东西，居然把咱们全吓坏了！我笑的就是这个。”
        - id: ch01-b17
          speaker: narrator
          text: 大家听完，又一起笑了好一阵。等笑声终于平息，飞毛腿才回答老大自然妈妈的问题。到了这时，学校的消息早已传遍绿森林和绿草原，几乎谁都听说了。他碰巧得知草地田鼠丹尼也来上课，心想这件事既然对丹尼有益，对自己也一定有益，于是便亲自赶来了。
        - id: ch01-b18
          speaker: nimbleheels
          text: “刚才快到这里时，我听见身后好像有根细枝断了。也许是我听错了，可我还是赶紧一跳，落到这里才安全。我真没想到，自己这么小也能吓着谁。”
        - id: ch01-b19
          speaker: jumper_hare
          text: “你那一跳真了不起！我当时直着身子坐呢，你一下就从我头顶飞过去了！”
        - id: ch01-b20
          speaker: nimbleheels
          text: “越过你的头顶可算不上多远。等我认真跳起来，你再看吧。刚才我连一半力气都没使。对不起，把大家吓成这样。一想到自己也能吓着别人，我心里就怪怪的。大自然妈妈，我还赶得上今天的课吗？”
        - id: ch01-b21
          speaker: mother_nature
          text: “前面的内容错过了，不过我正要讲到需要你在场的部分。你来得正好。跳上那根圆木，坐在表亲白足旁边，让大家看看。”
        - id: ch01-b22
          speaker: narrator
          text: 飞毛腿跳上圆木，坐到白足身边。两个小表亲并排坐着，粗看起来确实颇为相像，不过白足要漂亮些。飞毛腿的外套是暗淡的淡黄色，背部颜色比身体两侧更深。和白足一样，他身子下面也是白色的。他的耳朵却比白足小得多。不过，两位表亲之间最明显的差别，还在后腿和尾巴上。
        - id: ch01-b23
          speaker: narrator
          text: 飞毛腿的后腿与后脚都很长，生得跟彼得兔是同一个样子。无论谁只要看上一眼，都会知道他生来就是跳跃好手，而且跳得一定不差。白足本来已经有一条长尾巴，可飞毛腿的尾巴还要长得多。那条尾巴又细又尖，越到末端越窄。
        - id: ch01-b24
          speaker: mother_nature
          text: “若按身体大小来算，飞毛腿是这个广大国度里所有动物中跳得最远的。我说的是从地面起跳。飞鼠蒂米虽然能去得更远，却必须先爬到高处，再借着空气一路滑翔下来。这和飞毛腿的跳跃可不是一回事。”
        - id: ch01-b25
          speaker: mother_nature
          text: “我以前告诉过你们，长耳大野兔杰克一跃能跳得多么惊人。可要是他也能像飞毛腿这样，按自己的个头跳得又高又远，那么杰克生平最远的一跃，看起来也只算轻轻一蹦。顺便说一句，飞毛腿和白足的两颊里都有小小的颊囊。现在，飞毛腿，给大家讲讲你的住处吧。”
        - id: ch01-b26
          speaker: nimbleheels
          text: “我住在绿草原边缘的杂草丛里，不过有时候，也会一路跑到绿草原深处。我最喜欢的还是杂草丛。那里的草长得高，能把我严严实实地藏起来，还能给我许多东西吃。你们看，我主要靠种子过活，不过浆果和小坚果也很喜欢，尤其爱吃山毛榉果。”
        - id: ch01-b27
          speaker: nimbleheels
          text: “我们家族有些成员更喜欢绿森林，特别是林中有欢笑溪或者池塘的地方。可要问我喜欢哪里，我还是刚才那个答案，绿草原边缘最好。”
        - id: ch01-b28
          speaker: striped_chipmunk
          text: “你的家也造在地下吗？”
        - id: ch01-b29
          speaker: nimbleheels
          text: “过冬的家是在地下。夏天，我有时把窝安在地面以下几英寸的地方，也常把它藏在一块树皮下面，或是一丛茂密的青草里，就像草地田鼠丹尼常做的那样。秋天到了，我会挖一条很深的洞道，深到霜杰克也够不着，再在下面一间舒服的小卧室里睡过整个冬天。”
        - id: ch01-b30
          speaker: nimbleheels
          text: “地下还有几间小储藏室。我把种子、浆果和坚果放进去，偶尔睡醒时，就有足够的食物了。”
        - id: ch01-b31
          speaker: mother_nature
          text: “飞毛腿睡下过冬时，会蜷成一个小圆球，再用长尾巴裹住自己。他躺在柔软的草窝里，睡得可香了。和土拨鼠约翰尼一样，入睡以前，他也会把自己吃得胖胖的。好了，飞毛腿，让大家见识一下你的跳跃吧。”
        - id: ch01-b32
          speaker: narrator
          text: 飞毛腿从方才坐着的圆木上跳下来，立刻猛地腾空而起。这一跃又高又远，姿态还那么漂亮，叫所有伙伴全都一起惊叹出声。接着，他一下跳向这边，一下又跳向那边，每一跃都跨出好远。那一连串的跳跃，实在精彩极了。
        - id: ch01-b33
          speaker: mother_nature
          text: “那条长尾巴能替他保持平衡。要是没了尾巴，他只会在空中不停翻滚，既不知道会落在哪里，也不知道会怎样落地。不过，他只有遇到危险才这样跳。平安无事时，他也和鼠科其他成员一样，在地面上到处奔跑。今天的课就到这里。明天，我们再认识几位鼠科成员。”
