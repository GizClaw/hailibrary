audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 亲切生动，带着温和的幽默感
        timbre: 温暖清亮
        pace: 舒缓而富有变化
        pitch: 中等
    mother_nature:
      display_name: 老大自然妈妈
      tts:
        delivery: 慈爱睿智，说话从容而坦率
        timbre: 温厚柔和
        pace: 从容
        pitch: 中低
    peter_rabbit:
      display_name: 彼得兔
      tts:
        delivery: 好奇直率，情绪来得快也去得快
        timbre: 清脆稚气
        pace: 轻快
        pitch: 中高
    danny_meadow_mouse:
      display_name: 草地田鼠丹尼
      tts:
        delivery: 朴实谦逊，遇事谨慎又很有主见
        timbre: 温和结实
        pace: 稳健
        pitch: 中等
    striped_chipmunk:
      display_name: 花栗鼠条纹
      tts:
        delivery: 机灵活泼，紧张时说话有些结巴
        timbre: 轻细清亮
        pace: 轻快
        pitch: 高
  chapters:
    - id: ch01
      title: 獾挖挖和他的表亲贪吃鬼
      blocks:
        - id: ch01-b01
          speaker: mother_nature
          text: “彼得，你昨天去拜访獾挖挖了吗？”
        - id: ch01-b02
          speaker: peter_rabbit
          text: “去了，妈妈，可我没问出多少事。他是个十足的老怪脾气，待人一点儿也不友好。他的洞多得数不清，我找了半天，也弄不明白哪个才是他的家。”
        - id: ch01-b03
          speaker: peter_rabbit
          text: “好不容易找到他，他又把我吓坏了。他平平地伏在草里，扁得叫人根本看不见。我一直走到快踩着他才发现。要不是我立刻跳开，今天早晨恐怕就来不了啦。”
        - id: ch01-b04
          speaker: peter_rabbit
          text: “我说想把他的一切都弄明白，问他平时怎么生活、每天做些什么。他却告诉我，那些全都不关我的事，此外一句也不肯多说。我在旁边坐了一阵，看他只顾晒太阳，别的什么也不做。”
        - id: ch01-b05
          speaker: peter_rabbit
          text: “他身为鼬科的一员，模样实在太奇怪了。我怎么看，也看不出他像黄鼠狼。他趴平以后，两边的长毛铺开，身子看上去几乎和长度一样宽。”
        - id: ch01-b06
          speaker: peter_rabbit
          text: “不过仔细看看，他的外套还真漂亮。那身毛银灰柔亮，像是沿着背脊正中分向两边。尾巴不长，却又粗又多毛，脑袋和脸也长得好看。脸颊和下巴都是白的，还有一道宽白纹，从鼻尖一直越过头顶。每边脸上各有一道黑纹，耳朵后面和四只脚也是黑的。”
        - id: ch01-b07
          speaker: peter_rabbit
          text: “他的鼻子尖尖的。走起路来，活像一头身子扁扁、四条腿短短的小熊。还有那双前脚上的爪子，可真是又大又有力！个头和他差不多的家伙，谁也没有这样的爪子。准是因为他特别会挖洞。”
        - id: ch01-b08
          speaker: mother_nature
          text: “你猜得很好，彼得。这里有谁见过他挖洞？”
        - id: ch01-b09
          speaker: peter_rabbit
          text: “我见过一次。那天我在他家附近，布朗农夫家的男孩忽然走来，正好撞见挖挖离自己的洞很远。挖挖没往任何一个洞里逃，当场就挖了起来。我的天，沙土一下子飞得到处都是！那个男孩还没赶到，挖挖已经钻进地下，不见了。”
        - id: ch01-b10
          speaker: peter_rabbit
          text: “土拨鼠约翰尼也很会挖，可和挖挖根本没法比。我认识的家伙里，没有第二个比得上他，也许只有鼹鼠矿工可以。我还知道挖挖很能打。有一次，他打败了一条几乎比自己大一倍的狗。那一阵嘶叫、咆哮和怒吼，听着可怕极了！可他就是不肯告诉我自己怎么生活。”
        - id: ch01-b11
          speaker: mother_nature
          text: “很好，彼得。你能知道这些，已经和我料想的一样多了。挖挖确实古怪。他住在大平原，也住在中西部和远西部那些平坦开阔的地方。那里有囊地鼠、地松鼠和草原犬鼠，他们就是挖挖最主要的食物。”
        - id: ch01-b12
          speaker: mother_nature
          text: “这些穴居动物都很会挖洞，可挖挖只要动手追着掘，他们就逃不掉了。白天，挖挖差不多一直待在地下，最多出来晒晒太阳。等圆滚滚、红彤彤的太阳先生上床了，他才现身，到处找晚餐。”
        - id: ch01-b13
          speaker: mother_nature
          text: “挖挖腿短，身子又粗又重，走得慢，还有点儿笨。不过他挖洞的本事正好补上这个短处。他不会指望在地面追到谁，除非有只草地田鼠恰巧来到他一扑就够得着的地方。”
        - id: ch01-b14
          speaker: mother_nature
          text: “他会去找地松鼠和其他穴居动物的洞，找到以后马上开挖。捉来的小动物之外，他也吃蚱蜢、甲虫和小蛇。彼得，你刚才说自己及时跳开了，这可真走运。我看，挖挖很可能正想吃一顿兔肉大餐呢。”
        - id: ch01-b15
          speaker: mother_nature
          text: “人们不大了解挖挖的家庭生活，只知道他是个好丈夫。冬天，他会像土拨鼠约翰尼那样睡觉。等到春天积雪一化，他很快就出来了。我的小居民里，没有谁比他更勇敢。只要被逼进绝境，哪怕只剩一口气，他也会战斗到底。”
        - id: ch01-b16
          speaker: mother_nature
          text: “他的皮很坚韧，长毛又替他添了一层保护。牙齿既尖又有力，打起架来从不会让自己吃亏。和他个头差不多的对手，他谁也不怕。”
        - id: ch01-b17
          speaker: mother_nature
          text: “人类为了毛皮捕捉挖挖，可这正显出人有时多么愚蠢。挖挖会消灭许多危害庄稼的啮齿动物，所以活着比死去有价值得多。人们真能怪他的，也不过是他挖的洞太多。”
        - id: ch01-b18
          speaker: mother_nature
          text: “暮春或初夏，挖挖夫妇会有两到五个宝宝。宝宝全都生在地下一个铺着草的窝里。看挖挖的模样，你们也知道他力气有多大。他只要把身子牢牢扎进土里，哪怕一个壮汉揪着他的尾巴使劲拉，也别想让他挪动半点儿。”
        - id: ch01-b19
          speaker: mother_nature
          text: “彼得说得没错，挖挖确实不合群。挖挖夫妇只愿独自过日子，谁也别来打扰。白天，人们很少看到他，可他出来的次数可能比大家以为的多。彼得不是差点儿踩到他，才发现他吗？”
        - id: ch01-b20
          speaker: mother_nature
          text: “只要不确定自己已经被发现，挖挖就会聪明地趴着不动。人们常常从他身边经过，根本没看到他。有时就算看到了，也只当那是一块石头。”
        - id: ch01-b21
          speaker: mother_nature
          text: “獾挖挖喜欢开阔原野，根本不爱绿森林。不过，他有个表亲只住在绿森林，而且常常藏得很深。他就是狼獾贪吃鬼，家族里个头最大、样子也最丑的成员。”
        - id: ch01-b22
          speaker: mother_nature
          text: “你们都没见过贪吃鬼，因为他差不多一直住在北方的大森林里。据我所知，他没有一个朋友，可他压根儿不在乎。”
        - id: ch01-b23
          speaker: mother_nature
          text: “贪吃鬼还有别的名字。遥远北方的人叫他‘卡卡朱’，远西部的人常叫他‘臭鼬熊’。这个名字大概是因为他的体形和颜色，看上去像是半只臭鼬加半头熊。”
        - id: ch01-b24
          speaker: mother_nature
          text: “他身长大约三英尺，尾巴还有六英寸。身子又粗又沉，短腿十分结实。全身连尾巴都长着蓬乱的长毛，大多是黑褐色，头顶和两颊上方泛灰，四只脚却是黑的。他和熊一样，走路时整个脚掌都会贴到地面。”
        - id: ch01-b25
          speaker: mother_nature
          text: “这么短的腿配上那么重的身子，贪吃鬼当然走不快。可是，他有的是力气和心眼，足够补上速度的不足。你们以为红狐雷迪和老郊狼很聪明吧？他们和狼獾贪吃鬼一比，差得远了。”
        - id: ch01-b26
          speaker: mother_nature
          text: “贪吃鬼会走很远的路。遥远的北方是世上大部分毛皮靠陷阱捕获的地方，而他正是那些设阱猎人最头疼的祸害。他能跟着一个猎人走上一整天，却始终不让对方看见。无论猎人多么仔细地藏好陷阱，他也能找出来，偷走诱饵又不被捉住。”
        - id: ch01-b27
          speaker: mother_nature
          text: “有时候，他还会把陷阱从地里扯出来，拖进树林藏好。要是陷阱已经捉到别的动物，他就把那动物吃掉。他的力气大得惊人。猎人不在时，他甚至能硬闯进他们的小木屋，把里面所有食物吃掉或毁掉。”
        - id: ch01-b28
          speaker: mother_nature
          text: “他胃口大得吓人，所以才叫贪吃鬼。吃不完也带不走的东西，他便用污秽弄脏，让别的动物也不能碰。他脾气凶恶，不论动物还是人都讨厌他。他的毛皮虽然相当值钱，人们捕捉他却更多是为了摆脱这个祸害。有时陷阱已经夹住他，他还能连陷阱一起提走，一走就是好几英里。”
        - id: ch01-b29
          speaker: mother_nature
          text: “到了春天，贪吃鬼太太会生两三个宝宝。有天然洞穴可找，他们就住进洞穴。要是找不到，她便亲自在地下挖出一个家。那个家通常藏得十分隐蔽，人类很少能够找到。”
        - id: ch01-b30
          speaker: mother_nature
          text: “贪吃鬼什么肉都吃。刚刚捕杀的也好，放得太久、已经腐烂的也好，他全不在意。猎人想要保护自己的补给，唯一的办法就是把粗大的原木压在食物上。可即使这样，贪吃鬼也常能把原木拉开，取到下面的东西。他狡猾到了这个地步，印第安人便以为他身上附着邪恶的精灵。”
        - id: ch01-b31
          speaker: mother_nature
          text: “今天就讲到这儿吧。明天，我们再来认识这个家族的另一个分支。那一支里有些成员，你们大家都见过。我在想，要是把黄鼠狼影子请来，会不会很好呢？”
        - id: ch01-b32
          speaker: narrator
          text: 除了臭鼬吉米和豪猪刺刺，所有小居民的脸上顿时都露出了惊慌的神色。
        - id: ch01-b33
          speaker: danny_meadow_mouse
          text: “要——要——要是您不介意，我想明天早晨还是不来了。”
          emotion: fearful
        - id: ch01-b34
          speaker: striped_chipmunk
          text: “我——我——我想，明天家里一定会很忙，这堂课我只好不来啦。”
          emotion: fearful
        - id: ch01-b35
          speaker: narrator
          text: 老大自然妈妈看着他们，笑了。
        - id: ch01-b36
          speaker: mother_nature
          text: “别担心，小家伙们。你们应该知道，即使我把影子请来，也绝不会让他伤害你们。可是他若真的来了，你们恐怕谁也听不进我的话。所以我答应你们，影子一定不会在附近出现。”
          emotion: calm
