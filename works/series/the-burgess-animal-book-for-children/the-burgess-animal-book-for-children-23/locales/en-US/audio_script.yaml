  chapters:
    - id: ch01
      title: Digger and His Cousin Glutton
      blocks:
        - id: ch01-b01
          speaker: old_mother_nature
          text: "Well, Peter, did you go to see Digger the Badger yesterday?"
        - id: ch01-b02
          speaker: peter_rabbit
          text: "Yes'm, I found him, but I didn't learn much. He's a regular old grouch, and he isn't neighborly at all. It took me ages to find him. He has more holes than anyone I know, so I couldn't tell which one was his home."
        - id: ch01-b03
          speaker: peter_rabbit
          text: "Then, when I finally did find him, he gave me a terrible scare. He was lying so flat in the grass that I didn't see him until I was almost on top of him. If I hadn't jumped away quickly, I don't think I'd be here this morning."
        - id: ch01-b04
          speaker: peter_rabbit
          text: "I told him I wanted to learn about him and the way he lives. He said how he lived and what he did were none of my business. That was all I could get from him."
        - id: ch01-b05
          speaker: peter_rabbit
          text: "I stayed and watched for a while, but all he did was sun himself. He certainly looks strange for someone in the Weasel family. I couldn't see anything weasel-like about him. He isn't really as wide as he is long, of course. But when he lies flat and his long hair spreads out on both sides, he almost looks that way."
        - id: ch01-b06
          speaker: peter_rabbit
          text: "Once you look closely, his coat is handsome. It's silky-looking and silvery gray, with a part straight down the middle of his back. His tail is rather short, but it's stout and hairy. His head and face are handsome too. His cheeks and chin are white, and a wide white stripe runs from his nose over his head. He has a black bar on each cheek. The backs of his ears and all four feet are black."
        - id: ch01-b07
          speaker: peter_rabbit
          text: "His nose is rather sharp. When he walks, he reminds me of a small, flattened Bear on very short legs. And you should see the claws on his front feet! I don't know anyone his size with claws so big and strong. I suppose that's because he does so much digging."
        - id: ch01-b08
          speaker: old_mother_nature
          text: "That's a very good guess, Peter. Has anyone here ever watched him dig?"
        - id: ch01-b09
          speaker: peter_rabbit
          text: "I did once. I was near his home when Farmer Brown's boy came along and caught Digger far from one of his holes. Digger didn't even try to reach a hole. He just started digging. My gracious, how that sand flew! Before Farmer Brown's boy could reach him, Digger had vanished into the ground."
        - id: ch01-b10
          speaker: peter_rabbit
          text: "Johnny Chuck is a good digger, but he isn't in Digger's class. No one I know is, except perhaps Miner the Mole. That's about all I know, except that Digger is a great fighter. I once saw him beat a dog almost twice his size. You should have heard the hissing, snarling, and growling! But he wouldn't tell me a thing about how he lives."
        - id: ch01-b11
          speaker: old_mother_nature
          text: "Very good, Peter. That's about as much as I expected you could discover. Digger is a queer fellow. He makes his home on the great plains and across the flat, open country of the Middle West and Far West. Gophers, Ground Squirrels, and Prairie Dogs live there too, and they make up most of his food. They are all good diggers, but once Digger starts digging after them, they have no chance."
        - id: ch01-b12
          speaker: old_mother_nature
          text: "Digger spends most daylight hours underground. He seldom comes out then, except to sun himself. But when jolly, round, red Mr. Sun goes to bed, Digger comes out and travels in search of dinner. His short legs and heavy, stout body make him slow and rather clumsy. He cannot chase his dinner over the ground, but his remarkable digging makes up for that."
        - id: ch01-b13
          speaker: old_mother_nature
          text: "He doesn't expect to catch anyone aboveground unless a Meadow Mouse happens to be within jumping distance. Instead, he hunts for the holes of Ground Squirrels and other burrowing animals. As soon as he finds one, he digs. He also eats Grasshoppers, Beetles, and small Snakes. Peter, it was lucky that you jumped when you did. I suspect Digger would have enjoyed a Rabbit dinner."
        - id: ch01-b14
          speaker: old_mother_nature
          text: "We know very little about Digger's family life, though he is a good husband. In winter he sleeps the way Johnny Chuck does, and he comes out soon after the spring snow is gone. None of my little people has more courage. Corner him, and he will fight as long as he has any breath left."
        - id: ch01-b15
          speaker: old_mother_nature
          text: "His skin is very tough, and his long hair gives him even more protection. His teeth are sharp and strong. With those teeth, that tough hide, and all his courage, he can always give a good account of himself in a fight. He fears no one his own size."
        - id: ch01-b16
          speaker: old_mother_nature
          text: "People hunt Digger for his fur, but that shows how foolish people can be about such things. Digger is worth far more alive than dead because he kills a great number of destructive Rodents. The only complaint against him is that he digs so many holes."
        - id: ch01-b17
          speaker: old_mother_nature
          text: "Mr. and Mrs. Digger have between two and five babies in late spring or early summer. The babies are born underground in a grass nest. As you can guess by looking at Digger, he is very strong. Once he gets a firm hold in the earth, even a strong man pulling his tail cannot move him."
        - id: ch01-b18
          speaker: old_mother_nature
          text: "Peter was right about Digger not being sociable. Mr. and Mrs. Digger are content to live by themselves and be left alone. He is rarely seen by day, though he is probably out more often than people think. Remember how Peter nearly stepped on him before noticing him? Digger wisely lies perfectly still until he knows he has been seen. People often pass without noticing him at all. Even when they do see him, they may mistake him for a stone."
        - id: ch01-b19
          speaker: old_mother_nature
          text: "Digger the Badger loves the open country and wants nothing to do with the Green Forest. But he has a cousin who lives only in the Green Forest, usually far inside it. That cousin is Glutton the Wolverine, the largest and ugliest member of the family. None of you has seen him because he lives mostly in the great northern forests. I don't know of a single friend he has, but that doesn't bother him at all."
        - id: ch01-b20
          speaker: old_mother_nature
          text: "Glutton has several names. In the Far North he is called Carcajou, while people in the Far West often call him Skunkbear. He may have gotten that name because his shape and color make him look like a mixture of Skunk and Bear."
        - id: ch01-b21
          speaker: old_mother_nature
          text: "He is about three feet long, with another six inches of tail. He is thickset and heavy, and his short legs are very stout. Long, shaggy hair covers his body and tail. Most of it is blackish brown, though it turns grayish over the top of his head and across his cheeks. His feet are black. Like a Bear, he puts each foot flat on the ground when he walks."
        - id: ch01-b22
          speaker: old_mother_nature
          text: "With such short legs and a heavy body, Glutton moves slowly. But what he lacks in speed, he makes up for with strength and cunning. You may think Reddy Fox and Old Man Coyote are clever, but neither one even begins to be as clever as Glutton the Wolverine."
        - id: ch01-b23
          speaker: old_mother_nature
          text: "Glutton travels great distances. In the Far North, where much of the world's fur is trapped, he is a terrible pest to trappers. He may trail a trapper all day while staying just out of sight. No matter how carefully the trapper hides a trap, Glutton finds it and steals the bait without being caught. Sometimes he tears traps out, carries them away, and hides them in the woods. If another animal is caught in a trap, Glutton eats it."
        - id: ch01-b24
          speaker: old_mother_nature
          text: "He is strong enough to tear into hunters' cabins while they are away. Once inside, he eats or destroys all their food. His enormous appetite is why he is called Glutton. Anything he cannot eat or carry off, he fouls so no other animal will touch it. He has an ugly temper, and both animals and people hate him. His fur is valuable, but most people hunt him simply to be rid of him. Even when a trap catches him, he sometimes picks it up and carries it for miles."
        - id: ch01-b25
          speaker: old_mother_nature
          text: "Mrs. Glutton has two or three babies in spring. They live in a cave when she can find one. If she cannot, she digs a hole in the ground. Their home is usually well hidden, and people seldom find it."
        - id: ch01-b26
          speaker: old_mother_nature
          text: "Glutton eats any kind of flesh. It makes no difference to him whether it was freshly killed or has begun to decay. Hunters can protect their supplies only by covering them with great logs. Even then, Glutton often pulls the logs apart and reaches the food. His cunning is so great that the Indians believe an evil spirit lives in him."
        - id: ch01-b27
          speaker: old_mother_nature
          text: "That will be enough for today. Tomorrow we'll begin another branch of the family, one that includes animals you all know. I wonder if it might be a good idea to invite Shadow the Weasel."
        - id: ch01-b28
          speaker: narrator
          text: Everyone looked dismayed except Jimmy Skunk and Prickly Porky.
        - id: ch01-b29
          speaker: danny_meadow_mouse
          text: "If you please, I don't think I'll come tomorrow morning."
          emotion: fearful
        - id: ch01-b30
          speaker: striped_chipmunk
          text: "I think I'll be much too busy at home. I'll have to miss that lesson."
          emotion: fearful
        - id: ch01-b31
          speaker: narrator
          text: Old Mother Nature smiled at them.
        - id: ch01-b32
          speaker: old_mother_nature
          text: "Don't worry, little folks. You know I wouldn't let Shadow hurt any of you if I brought him here. But I'm afraid you wouldn't listen to me with him nearby, so I promise that Shadow won't be anywhere near us."
          emotion: calm
