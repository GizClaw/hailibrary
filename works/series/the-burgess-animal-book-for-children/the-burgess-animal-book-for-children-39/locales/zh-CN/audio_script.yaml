audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 亲切生动，带着温和的幽默感
        timbre: 温暖清亮
        pace: 舒缓而富有变化
        pitch: 中等
    mother_nature:
      display_name: 老大自然妈妈
      tts:
        delivery: 慈爱睿智，说话从容而坦率
        timbre: 温厚柔和
        pace: 从容
        pitch: 中低
    peter_rabbit:
      display_name: 彼得兔
      tts:
        delivery: 好奇直率，情绪来得快也去得快
        timbre: 清脆稚气
        pace: 轻快
        pitch: 中高
    jumper:
      display_name: 长耳野兔跳跳
      tts:
        delivery: 机敏肯定，说话直接利落
        timbre: 清朗轻快
        pace: 明快
        pitch: 中等
    chatterer:
      display_name: 红松鼠喋喋
      tts:
        delivery: 伶牙俐齿，争强好胜又活泼
        timbre: 尖细清亮
        pace: 明快
        pitch: 高
    happy_jack:
      display_name: 灰松鼠快乐杰克
      tts:
        delivery: 自信好胜，受窘时有些急躁
        timbre: 明亮爽脆
        pace: 轻快
        pitch: 中高
  chapters:
    - id: ch01
      title: 喋喋猜中了
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 第二天一早，彼得兔走在上学路上，满脑子都在猜今天要认识谁。他不停地对自己说，老大自然妈妈提过，那位动物跟布朗农夫家畜棚里的一个成员有亲缘。可那个成员究竟是谁呢？彼得想了一路，还是毫无头绪，只好问问长耳野兔跳跳。
        - id: ch01-b02
          speaker: jumper
          text: “我哪儿猜得出来。我很少离开绿森林，这辈子都没去过那座家畜棚，连里面住着谁也不知道。”
        - id: ch01-b03
          speaker: narrator
          text: 草原田鼠丹尼、林鼠白足和土拨鼠约翰尼也都猜不到。红松鼠喋喋却一副早有答案的样子。他常去布朗农夫家，从玉米仓里偷玉米，对家畜棚里的成员熟得很。彼得他们围着他追问，他偏不肯透露。
        - id: ch01-b04
          speaker: narrator
          text: 到了课堂上，老大自然妈妈问起答案，只有喋喋开了口。
        - id: ch01-b05
          speaker: chatterer
          text: “您说的准是那头猪。他总在家畜棚里用鼻子拱地，还不停地哼哼。”
        - id: ch01-b06
          speaker: narrator
          text: 老大自然妈妈笑着看了看这个穿红外衣的小淘气。
        - id: ch01-b07
          speaker: mother_nature
          text: “你猜对了。今天要讲的正是那头猪的一位亲戚。他不住家畜棚，住在森林里，过得跟你们一样自由自在。他叫佩卡里猪小猪，正式名称是领西貒。人们还叫他野猪、麝猪、得克萨斯西貒和标枪猪。”
        - id: ch01-b08
          speaker: mother_nature
          text: “小猪是真正的猪。单看身形，他很像布朗农夫家那个又懒又胖的家伙小时候。你们见到他，一眼就能认出这是一头猪。不过，除了同样会拿鼻子拱地，他跟那家伙处处不同。他的腿虽然短，却更纤细，跑得也快。小猪整天动个不停，身上没有一根懒骨头，所以怎么也胖不起来。”
        - id: ch01-b09
          speaker: mother_nature
          text: “他的头大，鼻子长，尾巴却只剩一个圆圆的小疙瘩，简直像是让谁剪掉了。他全身的毛又粗又硬，这种毛叫鬃毛。后脑到脊背上的鬃毛特别长，末端又是黑色，看起来就像长了一条黑背。小猪一发怒，长鬃毛便根根竖起，模样十分凶猛。”
        - id: ch01-b10
          speaker: mother_nature
          text: “他的毛色灰得发黑，从远处看几乎就是黑的，身上许多地方也确实是黑的。脖子后面有一道发白的毛带，横过两肩，像是戴着项圈，所以人们叫他领西貒。他上下两边的颌骨各有两颗又大又尖的獠牙。上面的两颗长得露出了嘴唇。这就是小猪厉害的武器。”
    - id: ch02
      title: 什么都吃的小猪
      blocks:
        - id: ch02-b01
          speaker: mother_nature
          text: “小猪住在这个国家炎热的西南部。那里还有猫科中带着美丽斑纹的美洲虎和豹猫，他们都是小猪的敌人。小猪从来不愿独处，总跟一群伙伴生活在一起，大家结伴四处游荡。平原、低矮的丘陵、沼泽、密林，还有干旱地区长满仙人掌和带刺植物的灌丛，都有他的踪影。他最在乎的，就是食物够不够多，有没有地方能躲开烈日。”
        - id: ch02-b02
          speaker: peter_rabbit
          text: “那他都吃些什么？”
        - id: ch02-b03
          speaker: narrator
          text: 老大自然妈妈笑了起来。
        - id: ch02-b04
          speaker: mother_nature
          text: “彼得，要说小猪不吃什么，反倒容易。只要能吃，他差不多什么都吃。坚果、水果、种子、树根和各种植物，他都喜欢。昆虫、青蛙、蜥蜴、蛇，还有捉得到的小动物，他也不放过。有时候，他会把人类种下的花园和庄稼糟蹋得很厉害。他尤其喜欢拿鼻子拱土，常常为了寻找好吃的根，把一大片地全翻过来。”
        - id: ch02-b05
          speaker: mother_nature
          text: “小猪的后腰上还有一个小香囊，会发出麝香般的气味，所以才有麝猪这个名字。遇到危险，他通常会明智地赶快逃走。不过，他可不是胆小鬼。要是被逼得无路可退，他就会凶猛反击。伙伴们也会立刻冲来帮忙，把敌人团团围住。那些獠牙咬得咯咯响，敌人见了，多半巴不得爬到树上躲起来。”
        - id: ch02-b06
          speaker: mother_nature
          text: “有人说小猪生来凶暴，谁都没有招惹他，他也会扑上去。这话并不是真的。能逃的时候，他一定会逃。佩卡里猪夫妇每次会有两个宝宝。”
        - id: ch02-b07
          speaker: mother_nature
          text: “小猪是最后一种要讲的有蹄动物。这个伟大国家的陆地动物，也只剩下一种了，所以我们的课程快要结束啦。最后这位也许是所有动物里最古怪的。他叫犰狳硬壳，属于贫齿目。贫齿目的意思，就是没有牙齿。”
        - id: ch02-b08
          speaker: happy_jack
          text: “真有动物一颗牙齿也不长吗？”
        - id: ch02-b09
          speaker: narrator
          text: 快乐杰克满脸不敢相信，老大自然妈妈却点了点头。
        - id: ch02-b10
          speaker: mother_nature
          text: “真的有，不过这个国家里没有。有些动物一颗牙也不长，还有些只长着少得可怜的几颗牙，所以也和完全没牙的动物归在同一个目里。犰狳硬壳就是后一种。他嘴巴前面没有牙，剩下的几颗也没多大用处。”
    - id: ch03
      title: 一件硬壳外衣
      blocks:
        - id: ch03-b01
          speaker: peter_rabbit
          text: “可您为什么要叫他硬壳呢？”
        - id: ch03-b02
          speaker: mother_nature
          text: “因为别的动物披毛皮，他穿的却是一件硬壳外衣。”
        - id: ch03-b03
          speaker: narrator
          text: 老大自然妈妈看见面前一张张滑稽的脸，忍不住笑出了声。彼得和伙伴们怎么也不敢相信她是认真的，都觉得她在拿大家开心。
        - id: ch03-b04
          speaker: peter_rabbit
          text: “您……您是说，他也像斑点龟一样，背着一座房子到处走吗？”
        - id: ch03-b05
          speaker: mother_nature
          text: “硬壳是有一件，可跟斑点龟的不同。斑点龟的壳是一整块，犰狳的壳却分成一片片能活动的甲片，所以硬壳能把自己蜷成圆球。还有，斑点龟属于爬行动物，不是哺乳动物。你们和我们学过的那些动物都是哺乳动物，犰狳硬壳也是。”
        - id: ch03-b06
          speaker: peter_rabbit
          text: “那他的模样准是古怪极了。”
        - id: ch03-b07
          speaker: mother_nature
          text: “的确很古怪。他跟负鼠比利大叔差不多大。你们先想象一头这么大的猪，再给他添上四条很短的腿和一条细长的尖尾巴。他的脚上有脚趾，趾端长着长爪。整个身子、脸的前半部，连尾巴都盖在硬壳底下。这就很接近硬壳的模样了。”
        - id: ch03-b08
          speaker: mother_nature
          text: “他也住在炎热的西南部，跟佩卡里猪小猪是邻居。他的硬壳泛着黄色，身体中间分成九条窄窄的活动甲带，所以叫九带犰狳。这个国家再往南，他还有长着三条甲带的表亲和长着六条甲带的表亲。”
        - id: ch03-b09
          speaker: mother_nature
          text: “硬壳的脑袋很长，总是尖尖地垂向地面。两只小眼睛长在很靠后的位置，头顶却竖着一对挺大的耳朵。他尾巴上的壳分成许多活动的圆环，所以尾巴想怎么摆就怎么摆。”
    - id: ch04
      title: 陆地动物的最后一课
      blocks:
        - id: ch04-b01
          speaker: mother_nature
          text: “硬壳的舌头又长又黏，能从嘴里伸出很远，把蚂蚁和其他昆虫一下扫进口中。他主要就靠这些东西生活。他的眼力和听力都不太好，那件沉重僵硬的外衣又让他跑不快。不过，他可是挖洞能手，家自然也安在地下。受了惊，他会直奔自己的洞穴。”
        - id: ch04-b02
          speaker: mother_nature
          text: “要是敌人追上来，硬壳就蜷成一个圆球。除非敌人的牙齿又大又有力，能咬破甲片连接的地方，否则谁也伤不了他。他也吃一点儿植物，据说还会吃在地面筑巢的鸟蛋，也可能吃偶然找到的腐肉。不过，他最常吃的还是蚂蚁、各种昆虫和蚯蚓。”
        - id: ch04-b03
          speaker: mother_nature
          text: “硬壳是个无害的小家伙，只因模样特别古怪，才那么有趣。有时人会杀来吃，据说他的肉味道很好。早春时，他会有四到八个宝宝。刚出生的犰狳宝宝还没有甲壳，身上只有一层柔韧结实的皮。等宝宝一天天长大，这层皮也慢慢变硬，成年时就成了真正的壳。”
        - id: ch04-b04
          speaker: mother_nature
          text: “好了，陆地动物，也就是陆生哺乳动物的课，今天全部讲完了。还有一些哺乳动物住在大海里。大海就是环绕陆地的咸水，我猜，你们谁也没亲眼见过。有些海洋哺乳动物会来到岸上，有些一辈子也不上岸。”
        - id: ch04-b05
          speaker: mother_nature
          text: “明天，我可以给你们讲一点儿海里的哺乳动物。这样一来，这个叫北美洲的伟大国家里，各种动物你们就都能了解一些了。当然，要看你们还愿不愿意听。”
        - id: ch04-b06
          speaker: peter_rabbit
          text: “愿意！我们当然愿意！”
        - id: ch04-b07
          speaker: narrator
          text: 彼得兔响亮地喊出了这句话，也替所有伙伴说出了心声。
