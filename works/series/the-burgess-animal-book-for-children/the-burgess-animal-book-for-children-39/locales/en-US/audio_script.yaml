  chapters:
    - id: ch01
      title: Piggy and Hardshell
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: "All the way to school the next morning, Peter Rabbit tried to guess which animal they would learn about. Old Mother Nature had said he was related to someone in Farmer Brown's barnyard. But who could it be? Peter thought and thought, yet no answer came. At last, he asked Jumper the Hare if he had guessed. Jumper shook his head."
        - id: ch01-b02
          speaker: jumper
          text: "I don't have the slightest idea. I hardly ever leave the Green Forest, and I've never once visited that barnyard. How could I know who lives there?"
        - id: ch01-b03
          speaker: narrator
          text: "Danny Meadow Mouse, Whitefoot the Wood Mouse, and Johnny Chuck had no answer either. Chatterer the Red Squirrel was different. He plainly felt sure he knew. Chatterer had often gone to Farmer Brown's corn crib to steal corn, so he knew the barnyard and everyone in it. Peter and the others begged him to share his guess, but he refused."
        - id: ch01-b04
          speaker: narrator
          text: "When Old Mother Nature asked who had guessed the animal she meant, only Chatterer answered."
        - id: ch01-b05
          speaker: chatterer
          text: "You must mean the Pig who's always rooting around and grunting in the barnyard."
        - id: ch01-b06
          speaker: old_mother_nature
          text: "That's right, Chatterer. This morning, I'll tell you about one of his relatives. This one doesn't live in a barnyard. He lives free in the forest, just as you do. He is Piggy the Peccary. His proper name is the Collared Peccary, though people also call him Wild Pig, Muskhog, Texas Peccary, and Javelina."
        - id: ch01-b07
          speaker: old_mother_nature
          text: "Piggy is a true Pig. His shape is much like that lazy, fat fellow in Farmer Brown's barnyard when that fellow was little. If you saw Piggy, you would know at once that he was a Pig. But apart from rooting in the ground with his nose, he is very different. His legs are short but more slender, and he can run fast. He is far too active to become fat, and there isn't a lazy bone in him."
        - id: ch01-b08
          speaker: old_mother_nature
          text: "He has a large head, a long nose, and almost no tail. What he does have is a little rounded knob, as though his tail had been cut off. Coarse, stiff hair called bristles covers him. The bristles from the back of his head along his back are especially long and strong. Their tips are black, making his back look black. When Piggy grows angry, those long bristles rise straight up and make him look very fierce."
        - id: ch01-b09
          speaker: old_mother_nature
          text: "His gray coat is so dark that he looks black from a distance, and many parts of him really are black. A whitish band crosses his shoulders just behind his neck. It looks like a collar, which is why he is called the Collared Peccary. Each jaw holds two large, pointed teeth called tusks. The upper pair is long enough to stick out beyond his lips. Those tusks are excellent weapons."
        - id: ch01-b10
          speaker: old_mother_nature
          text: "Piggy lives in the hot Southwest, the same region as Jaguar and Ocelot, those beautiful spotted members of the Cat family. Both are his enemies. Piggy dislikes being alone. He travels with a band of friends, and they roam together. You may find him on plains, among low hills, in swamps and thick forests, or in patches of cactus and other thorny plants that grow in dry country. What matters most to him is plenty of food and shelter from the hot sun."
        - id: ch01-b11
          speaker: peter_rabbit
          text: "What does Piggy eat?"
        - id: ch01-b12
          speaker: narrator
          text: "Old Mother Nature laughed."
        - id: ch01-b13
          speaker: old_mother_nature
          text: "Peter, it would be easier to tell you what he doesn't eat. Piggy eats nearly anything edible. He eats nuts, fruit, seeds, roots, and many kinds of plants. He also eats insects, Frogs, Lizards, Snakes, and any small animal he can catch. Sometimes he badly damages gardens and crops planted by people. He loves pushing his nose through the soil, and he may turn over a great deal of ground while hunting for tasty roots."
        - id: ch01-b14
          speaker: old_mother_nature
          text: "On the lower part of his back, Piggy carries a small pouch that gives off a musky scent. That is how he got the name Muskhog. He usually has the good sense to run from danger, but he is no coward. If he is cornered, he fights fiercely. His friends hurry to help and close in around the enemy. The enemy is generally glad to escape up a tree and get away from all those snapping tusks. Still, Piggy is not the savage creature some reports make him out to be. He does not attack without cause, and he runs away whenever he can. Mr. and Mrs. Peccary have two babies at a time."
        - id: ch01-b15
          speaker: old_mother_nature
          text: "Piggy is the last of the hoofed animals and almost the last land animal of this great country that we will study. Our school is nearly over. The one land animal still to come may be the strangest of them all. His name is Hardshell the Armadillo. He belongs to the order Edentata, a name that means toothless."
        - id: ch01-b16
          speaker: happy_jack
          text: "Do you mean some animals truly have no teeth at all?"
          emotion: surprised
        - id: ch01-b17
          speaker: narrator
          text: "Happy Jack Squirrel looked as if he could hardly believe it. Old Mother Nature nodded."
        - id: ch01-b18
          speaker: old_mother_nature
          text: "That is exactly what I mean. Some animals have no teeth, though none of those live in this country. Other animals have so few teeth that they are placed in the same order as the completely toothless ones. Hardshell is one of those. The front of his mouth has no teeth at all, and the few teeth he does have are not good for much."
        - id: ch01-b19
          speaker: peter_rabbit
          text: "Then why do you call him Hardshell?"
        - id: ch01-b20
          speaker: old_mother_nature
          text: "Because he wears a shell instead of a fur coat."
        - id: ch01-b21
          speaker: narrator
          text: "Old Mother Nature laughed aloud at the funny looks before her. Peter and his friends were having a hard time believing she was serious. They thought she might be teasing them."
        - id: ch01-b22
          speaker: peter_rabbit
          text: "Do you mean he lives inside a sort of house and carries it around, like Spotty the Turtle?"
        - id: ch01-b23
          speaker: old_mother_nature
          text: "He does have a shell, but it isn't like Spotty's. Spotty's shell is one solid piece. An Armadillo's shell has joints, so he can curl himself into a ball. And Spotty is a reptile, not a mammal like you and all the animals we've been studying. Hardshell the Armadillo is a true mammal."
        - id: ch01-b24
          speaker: peter_rabbit
          text: "Well, he certainly must be a very strange-looking fellow."
        - id: ch01-b25
          speaker: old_mother_nature
          text: "He is. Hardshell is about the size of Unc' Billy Possum. Picture a pig about that size, with very short legs and a long tail that tapers to a point. Give him feet with toes and long claws. Then cover his whole body with a shell, including the front of his face and even his tail. That will give you some idea of his appearance."
        - id: ch01-b26
          speaker: old_mother_nature
          text: "He lives in the hot Southwest, where Piggy the Peccary lives. His shell is yellowish, with nine narrow bands or joints around the middle of his body. That is why he is called the Nine-banded Armadillo. Farther south, he has one cousin with three bands and another with six."
        - id: ch01-b27
          speaker: old_mother_nature
          text: "Hardshell's head is very long, and he points it straight down. His small eyes sit far back. Rather large, upright ears rise from the top of his head. The shell over his tail is formed of many jointed rings, which let him move his tail as he wishes."
        - id: ch01-b28
          speaker: old_mother_nature
          text: "His tongue is long and sticky. He can reach it quite far out and sweep up the Ants and other insects that make up most of his food. His sight and hearing are not very good. That heavy, stiff coat makes him a poor runner, but he can dig well. Naturally, he makes his home in a hole in the ground. When something frightens him, he heads for that hole. If an enemy catches him first, he rolls into a ball. Then he is safe unless the enemy has teeth big and strong enough to break through the joints in his shell."
        - id: ch01-b29
          speaker: old_mother_nature
          text: "Hardshell eats some plant matter. He is also accused of eating the eggs of birds that nest on the ground, as well as any dead, decaying flesh he finds. But most of his food is made up of Ants, other insects, and worms. He is a harmless little fellow, and his odd appearance makes him interesting. People sometimes kill and eat him, and they consider his flesh very good."
        - id: ch01-b30
          speaker: old_mother_nature
          text: "In early spring, Hardshell has from four to eight babies. A baby Armadillo has tough, soft skin instead of a shell. As the little one grows, that skin slowly hardens. By the time the Armadillo is fully grown, it has become a shell."
        - id: ch01-b31
          speaker: old_mother_nature
          text: "And that finishes our lessons about the land mammals. Other mammals live in the ocean, the salt water that surrounds the land. I don't suppose any of you have ever seen it. Some of those mammals come ashore, while others never do. Tomorrow, I'll tell you a little about them. Then you will know something about all the animals in this great country called North America. That is, I'll tell you if you want me to."
        - id: ch01-b32
          speaker: peter_rabbit
          text: "We do! Of course we do!"
          emotion: happy
        - id: ch01-b33
          speaker: narrator
          text: "Peter Rabbit had answered for them all."
