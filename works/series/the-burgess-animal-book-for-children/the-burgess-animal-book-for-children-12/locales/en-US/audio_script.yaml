  chapters:
    - id: ch01
      title: Morning School at Paddy's Pond
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: At sunrise the next morning, nearly everyone had gathered beside Paddy the Beaver's pond, deep in the Green Forest. Johnny Chuck and Striped Chipmunk were the only ones missing. They were afraid to travel so far from home. To everyone's surprise, Prickly Porky had come.
        - id: ch01-b02
          speaker: peter_rabbit
          text: "He is such a slowpoke, he must have been traveling all night to get here."
        - id: ch01-b03
          speaker: narrator
          text: Peter said this to his cousin Jumper the Hare, and he was probably close to the truth. Prickly Porky was a very slow traveler. However he had managed to reach the pond, there he was. An old log lay with one end in the water, and Prickly Porky stood on it, reaching out for lily pads. He looked perfectly content with life. After all, a good meal of the things you like best can make everything seem just as it should.
        - id: ch01-b04
          speaker: narrator
          text: Old Mother Nature sat down at one end of Paddy's dam and called the school to order. At that moment, a brown head popped out of the water nearby. Two anxious eyes looked up at her.
        - id: ch01-b05
          speaker: old_mother_nature
          text: "It's all right, Paddy. These little folks want to learn more about themselves and their neighbors. We're having the lesson here this morning because the lesson is about you."
          emotion: calm
        - id: ch01-b06
          speaker: narrator
          text: The anxious look left Paddy's face, and his eyes began to sparkle.
        - id: ch01-b07
          speaker: paddy_the_beaver
          text: "May I stay? If I can learn something, I don't want to miss it."
        - id: ch01-b08
          speaker: peter_rabbit
          text: "But we're learning about you and your family. Do you really expect to learn something about yourself?"
        - id: ch01-b09
          speaker: narrator
          text: Peter chuckled as though he had made a wonderful joke.
        - id: ch01-b10
          speaker: old_mother_nature
          text: "I seem to remember someone named Peter learning a great deal about his own family when he first came to my school."
        - id: ch01-b11
          speaker: narrator
          text: Peter had enough good sense to lower his head and look ashamed.
        - id: ch01-b12
          speaker: old_mother_nature
          text: "You may stay, Paddy. In fact, I want you here. I'll need you to explain a few things. That's why we're holding school at your pond. Come up on the dam so everyone can see you clearly."
        - id: ch01-b13
          speaker: narrator
          text: Paddy climbed onto the dam. Happy Jack Squirrel had never seen him out of the water before, and the sight made him gasp.
        - id: ch01-b14
          speaker: happy_jack
          text: "I never knew he was so big!"
          emotion: surprised
        - id: ch01-b15
          speaker: old_mother_nature
          text: "Paddy is the largest Rodent in this country and one of the largest in the whole Great World. He is also the smartest member of the order."
        - id: ch01-b16
          speaker: chatterer
          text: "Well, he doesn't look very smart."
        - id: ch01-b17
          speaker: narrator
          text: Chatterer gave his tail a saucy jerk.
        - id: ch01-b18
          speaker: old_mother_nature
          text: "I suppose that means you have no doubt that you're just as smart as Paddy. You are clever, Chatterer, but you often use your cleverness the wrong way. Paddy uses his in the best way. He is a lumberman, a builder, and an engineer. Many of my little people work hard, but their work destroys things. The more they do, the more they destroy. Paddy is a constructive worker. He builds instead."
        - id: ch01-b19
          speaker: narrator
          text: Chatterer looked guilty and a little ashamed when Old Mother Nature caught him boasting. Still, he was not ready to give in. As he answered her, his tail jerked with every word, almost as if his tail and tongue were tied together.
        - id: ch01-b20
          speaker: chatterer
          text: "What about all the trees he cuts down? If that isn't destroying, what is?"
        - id: ch01-b21
          speaker: old_mother_nature
          text: "It is. But think how many trees you destroy yourself."
        - id: ch01-b22
          speaker: chatterer
          text: "I've never destroyed a tree in my life!"
          emotion: angry
        - id: ch01-b23
          speaker: old_mother_nature
          text: "Yes, you have."
        - id: ch01-b24
          speaker: chatterer
          text: "No, I haven't!"
          emotion: angry
        - id: ch01-b25
          speaker: narrator
          text: Chatterer had forgotten whom he was arguing with, but Old Mother Nature let that pass.
        - id: ch01-b26
          speaker: old_mother_nature
          text: "I suppose you've never eaten a chestnut, a plump hickory nut, or a sweet beechnut."
        - id: ch01-b27
          speaker: chatterer
          text: "Of course I have. I've eaten ever so many. What does that have to do with it?"
        - id: ch01-b28
          speaker: old_mother_nature
          text: "Each of those nuts held a little tree inside. If you hadn't eaten them, many would have sprouted and someday grown into large trees. For every tree Paddy cuts, you may destroy a hundred. You eat nuts so you can live. Paddy cuts trees so he can live, because he eats their bark. Like Prickly Porky, he lives mostly on bark. But Paddy never takes a tree only for its bark. He wastes nothing. He uses every part, and he gives something back to the Green Forest for every tree he takes."
    - id: ch02
      title: The Handiest Tail in the Green Forest
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: No one quite understood what Old Mother Nature meant about giving something back to the Green Forest. Chatterer stared at Happy Jack and blinked in confusion. Happy Jack turned to Peter Rabbit and blinked. Peter looked at Jumper the Hare and blinked, and Jumper looked at Prickly Porky and did the same. At last they all stared at Paddy the Beaver. Then they turned to Old Mother Nature, blinking harder than ever. Old Mother Nature could not help chuckling at them.
        - id: ch02-b02
          speaker: old_mother_nature
          text: "Doesn't this little pond make the Green Forest more beautiful?"
        - id: ch02-b03
          speaker: narrator
          text: Everyone nodded.
        - id: ch02-b04
          speaker: old_mother_nature
          text: "And this pond wouldn't be here without Paddy and the trees he cut. He took those trees to make the pond. That is why I call him a constructive worker. Now look closely at Paddy. Then he'll show us how he cuts trees as a lumberman, builds houses and dams as a builder, and digs canals as an engineer."
        - id: ch02-b05
          speaker: narrator
          text: Everyone studied Paddy as he sat on top of his dam. At first glance, he looked a little like a giant member of the Rat family, though the shape of his head was closer to a Squirrel's. His body was unusually thick and heavy. His fur was dark brown across his back and lighter underneath. As he squatted there, his broad back curved into a rounded hump. Put all those things together, and Paddy was a very clumsy-looking fellow.
        - id: ch02-b06
          speaker: narrator
          text: Peter Rabbit cared about only one thing just then. He could not take his eyes off Paddy's tail, and Old Mother Nature noticed.
        - id: ch02-b07
          speaker: old_mother_nature
          text: "Well, Peter, what are you thinking about now?"
        - id: ch02-b08
          speaker: peter_rabbit
          text: "That tail. It's the strangest tail I've ever seen. It must be heavy, and I should think it gets terribly in the way."
        - id: ch02-b09
          speaker: narrator
          text: Old Mother Nature laughed.
        - id: ch02-b10
          speaker: old_mother_nature
          text: "Ask Paddy, and he'll tell you he has the handiest tail in the Green Forest. There isn't another tail like it in the whole Great World. Be patient, and you'll see how useful it is."
        - id: ch02-b11
          speaker: narrator
          text: It certainly was an odd tail. It was broad, thick, and flat, shaped like an oval, with scales instead of hair. Then Jumper the Hare spotted something else.
        - id: ch02-b12
          speaker: jumper_the_hare
          text: "Why, Paddy has feet like Honker the Goose!"
          emotion: surprised
        - id: ch02-b13
          speaker: paddy_the_beaver
          text: "Only my hind feet. The toes are joined by webs, just like Honker's, and those webs help me swim. My front fingers aren't webbed."
        - id: ch02-b14
          speaker: narrator
          text: Paddy held up one hand for them to see. Sure enough, every finger was free.
        - id: ch02-b15
          speaker: old_mother_nature
          text: "Now that everyone has seen you, swim over to the place where you've been cutting trees. We'll meet you there, and you can show us how you work."
        - id: ch02-b16
          speaker: narrator
          text: Paddy slipped into the pond and floated for a second or two with only his head above the surface. Without warning, he lifted his broad, heavy tail high and brought it down hard upon the water. The slap sounded like the crack of a terrible gun. It was so sudden and so loud that everyone jumped except Old Mother Nature and Prickly Porky. Peter happened to be standing at the very edge of the dam. He sprang before he had time to think, and that jump carried him straight into the pond with a splash.
        - id: ch02-b17
          speaker: narrator
          text: Peter hated water. He scrambled out as fast as he could while all the others laughed at him.
        - id: ch02-b18
          speaker: peter_rabbit
          text: "Why did he do that?"
          emotion: angry
        - id: ch02-b19
          speaker: old_mother_nature
          text: "He was showing you one use for that handy tail. When Paddy sees danger, he slaps the water to warn his friends. And did you see how his tail helped him swim? He turns it almost on its edge and steers with it like a rudder. His big webbed hind feet work as paddles and drive him through the water. He can stay underwater for as long as five minutes. Look, he has come up now."
        - id: ch02-b20
          speaker: narrator
          text: Paddy's head had appeared far across the pond, close to the opposite shore. He was swimming on the surface again. Old Mother Nature led everyone around the water to a little grove of poplars set back from the bank. Paddy was already waiting there.
        - id: ch02-b21
          speaker: old_mother_nature
          text: "Now show us what kind of lumberman you are."
    - id: ch03
      title: Lumberman and Canal Builder
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: Paddy looked over the grove and chose a small tree. He sat upright in much the same way Happy Jack Squirrel does, but he planted his wide, flat tail firmly on the ground to brace himself. Then he wrapped both hands around the trunk and sank his great orange cutting teeth into the wood. One large chip fell, then another, and another. Bite by bite, Paddy worked all the way around the tree. Before long, the trunk began to sway, and everyone could hear it cracking.
        - id: ch03-b02
          speaker: narrator
          text: Paddy took two or three more bites. Then he slapped the ground with his tail as a warning and scampered out of the way. He had no intention of letting the tree fall on him.
        - id: ch03-b03
          speaker: narrator
          text: Down came the tree. Paddy went straight back to work. He snipped off each small branch with one bite at its base. The thicker branches took several bites. Then he began cutting the trunk into short logs, until Old Mother Nature stopped him.
        - id: ch03-b04
          speaker: old_mother_nature
          text: "Show us what you do with those logs."
        - id: ch03-b05
          speaker: narrator
          text: Paddy moved around behind one of the short logs. He leaned against it and pushed, rolling it slowly ahead of him. He kept at it until the log reached a narrow ditch, or canal, that began near the poplar grove and ran all the way to the pond. The log dropped into the canal with a splash. Paddy followed it into the water, got behind it once more, and began pushing it along toward the pond.
        - id: ch03-b06
          speaker: old_mother_nature
          text: "That's enough. Come back and show us how you carry the branches."
        - id: ch03-b07
          speaker: narrator
          text: Paddy obeyed. He climbed out, returned to the fallen tree, and took a long branch in his mouth near its thick end. He swung it over his shoulder and dragged it to the canal. Then he waded in and swam on, still pulling the branch behind him. Old Mother Nature called him back once more.
        - id: ch03-b08
          speaker: old_mother_nature
          text: "You've shown us how you cut trees and move the wood. Now I'd like you to answer a few questions."
        - id: ch03-b09
          speaker: narrator
          text: Paddy climbed onto the bank and squatted down.
        - id: ch03-b10
          speaker: old_mother_nature
          text: "How did this canal come to be right where you needed it?"
        - id: ch03-b11
          speaker: paddy_the_beaver
          text: "Why, I dug it myself. I'm slow and clumsy on land, and I don't like being far from water. Those trees stand well back from the pond, so I brought the water close to them with this canal. If Old Man Coyote, Buster Bear, or Yowler the Bobcat comes looking for a Beaver dinner, I can reach safety quickly. The canal also makes it much easier to move my logs and branches to the pond."
          emotion: surprised
        - id: ch03-b12
          speaker: narrator
          text: Old Mother Nature nodded.
        - id: ch03-b13
          speaker: old_mother_nature
          text: "Exactly. Notice how carefully Paddy dug it. At the pond end, the canal continues across the shallow bottom so there is deeper water for him to use. Now you can see why I called him an engineer. Paddy, what happens to the logs and branches after that?"
        - id: ch03-b14
          speaker: paddy_the_beaver
          text: "I put them in my food pile, out in the deep water near my house. I eat the bark, then use the bare sticks to repair my dam and house. Late in the fall, I cut enough trees to feed me all winter. When ice covers the pond, my food is waiting safely underneath it. Whenever I'm hungry, I swim under the ice, take a stick from the pile, and bring it into my house. After I eat the bark, I carry the bare stick outside until I need it for repairs."
        - id: ch03-b15
          speaker: old_mother_nature
          text: "And how did you come to make such a fine pond?"
        - id: ch03-b16
          speaker: paddy_the_beaver
          text: "I was exploring up the Laughing Brook when I found plenty of food and a good place for a pond. I decided I would like to live here. The brook was shallow where my dam stands, and that was just the place to build one."
    - id: ch04
      title: How Paddy Made the Pond
      blocks:
        - id: ch04-b01
          speaker: old_mother_nature
          text: "Tell us why you needed a pond and how you built the dam."
        - id: ch04-b02
          speaker: paddy_the_beaver
          text: "I had to have a pond if I wanted to stay here. The Laughing Brook wasn't large or deep enough for me to live safely. If it had been, I could have made my home in the bank and saved myself the trouble of building a house and dam. But it wasn't, so I had to make a pond. It took a great deal of work, but it was worth every bit of it."
        - id: ch04-b03
          speaker: paddy_the_beaver
          text: "First I cut plenty of brush and young trees. I carried them to that shallow place and laid them across the Laughing Brook with their thick ends pointing upstream. To keep the current from moving them, I piled mud and stones on top. Then I brought more sticks, more brush, and more mud, and kept building up the pile. The brook did some of the work too. It carried down leaves and all kinds of floating things. They caught among the branches and helped fill the dam."
        - id: ch04-b04
          speaker: paddy_the_beaver
          text: "I also dug mud from the brook in front of the dam and packed it between the sticks. Digging there made the water deeper, while the mud kept water from leaking through. As the water backed up, a pond formed. I kept making the dam longer and higher, and the pond grew along with it. When it was large enough and deep enough for me, I stopped working on the dam and built my house out there."
        - id: ch04-b05
          speaker: narrator
          text: Everyone turned toward Paddy's house. Its roof rose high above the water, a short distance from the dam.
        - id: ch04-b06
          speaker: old_mother_nature
          text: "Tell us how you built your house."
        - id: ch04-b07
          speaker: paddy_the_beaver
          text: "I began with a large platform of sticks and mud. I put it where the pond was deep enough that even the coldest weather could never freeze the water all the way to the bottom. I built the platform above the surface, then added walls and a roof of sticks and mud, just as you see them now."
        - id: ch04-b08
          speaker: paddy_the_beaver
          text: "Inside, I have one fine large room and a comfortable bed made of shredded wood. There are two openings in the floor. From each one, a long passage goes down through the whole foundation and opens beneath the water at the bottom of the pond. Naturally, both passages stay full of water. Some Beaver houses have only one underwater passage, but I like having two. Those passages are the only entrances to my house. There is no doorway above the water."
        - id: ch04-b09
          speaker: paddy_the_beaver
          text: "Every fall I repair the walls and roof with more sticks, mud, and turf, so they have become very thick. Sometimes, late in the fall, I coat the outside with mud. It freezes solid. Then an enemy that walks over the ice to my house can't tear it open. I think that covers everything."
        - id: ch04-b10
          speaker: narrator
          text: Peter Rabbit let out a long breath.
        - id: ch04-b11
          speaker: peter_rabbit
          text: "What an awful amount of work! Do you work every minute?"
        - id: ch04-b12
          speaker: narrator
          text: Paddy chuckled.
        - id: ch04-b13
          speaker: paddy_the_beaver
          text: "No, Peter."
        - id: ch04-b14
          speaker: narrator
          text: Old Mother Nature nodded her approval.
        - id: ch04-b15
          speaker: old_mother_nature
          text: "That's the right answer. Does anyone have another question?"
    - id: ch05
      title: Paddy's Food
      blocks:
        - id: ch05-b01
          speaker: happy_jack
          text: "Is bark the only thing you eat?"
        - id: ch05-b02
          speaker: paddy_the_beaver
          text: "Oh, no. In summer I eat berries, mushrooms, grass, and the leaves and stems of several plants. In winter I add lily roots and the roots of alder and willow to my meals. But bark is still my main food."
        - id: ch05-b03
          speaker: narrator
          text: Old Mother Nature waited for a few moments. No one else had a question, so she ended the lesson.
        - id: ch05-b04
          speaker: old_mother_nature
          text: "Now I hope you understand why I'm so proud of Paddy the Beaver, and why I told you he is a lumberman, a builder, and an engineer. At our next lesson, we'll begin learning about the Rat family."
