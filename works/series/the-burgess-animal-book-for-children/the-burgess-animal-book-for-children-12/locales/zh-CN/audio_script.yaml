audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 亲切生动，带着温和的幽默感
        timbre: 温暖清亮
        pace: 舒缓而富有变化
        pitch: 中等
    peter_rabbit:
      display_name: 彼得兔
      tts:
        delivery: 好奇直率，情绪来得快也去得快
        timbre: 清脆稚气
        pace: 轻快
        pitch: 中高
    mother_nature:
      display_name: 老大自然妈妈
      tts:
        delivery: 慈爱睿智，说话从容而坦率
        timbre: 温厚柔和
        pace: 从容
        pitch: 中低
    happy_jack:
      display_name: 灰松鼠快乐杰克
      tts:
        delivery: 自信好胜，受窘时有些急躁
        timbre: 明亮爽脆
        pace: 轻快
        pitch: 中高
    prickly_porky:
      display_name: 豪猪刺刺
      tts:
        delivery: 脾气暴躁，爱抱怨，说话总带着不耐烦
        timbre: 粗哑厚重
        pace: 缓慢
        pitch: 低
    chatterer:
      display_name: 红松鼠喋喋
      tts:
        delivery: 伶牙俐齿，争强好胜又活泼
        timbre: 尖细清亮
        pace: 明快
        pitch: 高
    jumper_hare:
      display_name: 长耳野兔跳跳
      tts:
        delivery: 朴实腼腆，认真时透着好奇
        timbre: 清朗柔和
        pace: 稍缓
        pitch: 中等
    paddy_beaver:
      display_name: 海狸帕迪
      tts:
        delivery: 勤恳实在，讲起自己的手艺时坦率又自信
        timbre: 沉稳温厚
        pace: 稍缓
        pitch: 中低
  chapters:
    - id: ch01
      title: 第十二章　伐木工与工程师
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 第二天太阳刚升起来，大家就到了绿森林深处海狸帕迪的池塘边。只有土拨鼠约翰尼和花栗鼠条纹没来。他们不敢离家这么远。让所有伙伴意外的是，豪猪刺刺竟然早已在场。
        - id: ch01-b02
          speaker: peter_rabbit
          text: “刺刺走得那么慢，准是赶了一整夜的路，才来到这里。”
        - id: ch01-b03
          speaker: narrator
          text: 彼得对表兄跳跳说得还真不算离谱。不管刺刺究竟怎么赶来的，反正他已经到了。眼下，他正趴在一根半浸水的老圆木上，伸长脖子去够睡莲叶，看起来对日子满意极了。吃上一顿自己最喜欢的美餐，的确会让世上的一切都显得恰如其分。
        - id: ch01-b04
          speaker: narrator
          text: 老大自然妈妈在帕迪水坝的一头坐下，刚刚宣布上课。就在这时，旁边水里冒出一颗棕色脑袋，一双忧心忡忡的眼睛仰望着她。
        - id: ch01-b05
          speaker: mother_nature
          text: “别担心，帕迪。小伙伴们想多了解自己，也多了解别人。今天早晨这一课讲的就是你，所以我们才把课堂搬到你的池塘边。”
          emotion: calm
        - id: ch01-b06
          speaker: narrator
          text: 海狸帕迪脸上的不安立刻消失了，眼睛里也闪起了亮光。
        - id: ch01-b07
          speaker: paddy_beaver
          text: “我能留下听课吗？只要能学到东西，我就不想错过。”
        - id: ch01-b08
          speaker: peter_rabbit
          text: “可这堂课讲的是你和你的家族。难道你还真指望学到关于自己的新事情吗？”
        - id: ch01-b09
          speaker: narrator
          text: 彼得说完咯咯直笑，仿佛自己讲了一个天大的笑话。
        - id: ch01-b10
          speaker: mother_nature
          text: “我记得，有个叫彼得的学生第一次来我这里上课时，也从自己家族的故事里学到了不少东西。”
        - id: ch01-b11
          speaker: narrator
          text: 彼得羞得低下了头。
        - id: ch01-b12
          speaker: mother_nature
          text: “帕迪，你当然可以留下。其实，我正想请你解释几件事。我们今天早晨把课堂搬到这里，就是为了这个。来，爬上你的水坝，待在大家都能把你看清楚的地方。”
        - id: ch01-b13
          speaker: narrator
          text: 海狸帕迪爬上了水坝。灰松鼠快乐杰克从没见过他离开水的模样，不由得惊讶地轻呼了一声。
        - id: ch01-b14
          speaker: happy_jack
          text: “原来他这么大呀！”
          emotion: surprised
        - id: ch01-b15
          speaker: mother_nature
          text: “他是这个国家所有啮齿目动物中最大的，也是整个大千世界里最大的几种啮齿目动物之一。而且，他还是这一目中最聪明的成员。”
        - id: ch01-b16
          speaker: narrator
          text: 喋喋淘气地甩了一下尾巴。
        - id: ch01-b17
          speaker: chatterer
          text: “我可看不出来。”
        - id: ch01-b18
          speaker: mother_nature
          text: “这么说，你觉得自己肯定和他一样聪明了。”
        - id: ch01-b19
          speaker: narrator
          text: 喋喋听了，脸上既有做了亏心事的神色，又显得有点难为情。
        - id: ch01-b20
          speaker: mother_nature
          text: “我承认你聪明，喋喋，可你常把聪明用错地方。帕迪的聪明却用得再好不过。他是伐木工，是建筑师，也是工程师。我的许多小居民都会干活，可他们干的是破坏的活儿。干得越起劲，毁掉的东西就越多。帕迪不同。他一边干活，一边创造。他是建设者，不是破坏者。”
        - id: ch01-b21
          speaker: chatterer
          text: “可他砍倒了那么多树！这还不算破坏，什么才算？”
        - id: ch01-b22
          speaker: narrator
          text: 喋喋每说出一个词，尾巴就跟着猛甩一下，仿佛他的尾巴不知怎么和舌头连在了一起。
        - id: ch01-b23
          speaker: mother_nature
          text: “当然算。不过，你也想想自己毁掉了多少棵树。”
        - id: ch01-b24
          speaker: chatterer
          text: “我一辈子也没毁过一棵树！”
          emotion: angry
        - id: ch01-b25
          speaker: mother_nature
          text: “你毁过。”
        - id: ch01-b26
          speaker: chatterer
          text: “我才没有！”
          emotion: angry
        - id: ch01-b27
          speaker: narrator
          text: 喋喋只顾着反驳，早把自己是在跟谁说话忘得一干二净。老大自然妈妈倒没有同他计较。
        - id: ch01-b28
          speaker: mother_nature
          text: “难道你从没吃过栗子、饱满的山核桃，或是香甜的山毛榉果？”
        - id: ch01-b29
          speaker: chatterer
          text: “我当然吃过。我吃过好多好多，多得简直数也数不清。那又怎么样？”
        - id: ch01-b30
          speaker: mother_nature
          text: “每一颗果实的心里，都藏着一棵小树。要不是被你吃掉，其中许多早就破土而出，有朝一日会长成大树。这样看来，帕迪每毁掉一棵树，你大概已经毁掉一百棵了。”
        - id: ch01-b31
          speaker: mother_nature
          text: “你吃坚果，是为了活下去。帕迪砍树也是为了活下去，因为树皮就是他的食物。他跟刺刺一样，主要吃树皮。可他不像刺刺那样只取树皮，让整棵树白白死掉。他什么都不浪费，一棵树的每一部分都能派上用场。他从绿森林取走树木，也会回报绿森林。”
        - id: ch01-b32
          speaker: narrator
          text: 喋喋困惑地看看快乐杰克，眨了眨眼。快乐杰克又看看彼得，也眨了眨眼。彼得看向跳跳，跳跳再看向刺刺，一个接一个都在眨眼。最后，大家一齐看看帕迪，再看看老大自然妈妈，又全都眨起眼来。老大自然妈妈忍不住笑了。
        - id: ch01-b33
          speaker: mother_nature
          text: “你们不觉得，有了眼前这片小池塘，绿森林显得更加美丽了吗？”
        - id: ch01-b34
          speaker: narrator
          text: 伙伴们听了，全都点了点头。
        - id: ch01-b35
          speaker: mother_nature
          text: “可要是没有帕迪，没有他砍下的那些树，这里根本不会有这片小池塘。他砍树，正是为了造出池塘。这就是我说他会一边干活、一边创造的意思。”
        - id: ch01-b36
          speaker: mother_nature
          text: “现在，你们都来仔细看看帕迪。接着，他会亲自给我们演示，自己这个伐木工怎样砍树，建筑师怎样盖房子、筑水坝，工程师又怎样开凿运河。”
        - id: ch01-b37
          speaker: narrator
          text: 帕迪坐在水坝上，身形很像鼠类家族里一个巨大的成员，脑袋却更像松鼠，不大像老鼠。他的身体又粗又重，毛色深棕，腹部比背部浅一些。他蹲在那里，后背拱得圆圆的。总的看起来，这家伙的模样十分笨重。
        - id: ch01-b38
          speaker: narrator
          text: 彼得似乎只对一样东西感兴趣，那就是帕迪的尾巴。他盯着那条尾巴，怎么也移不开眼睛。老大自然妈妈很快就留意到了。
        - id: ch01-b39
          speaker: mother_nature
          text: “彼得，这回你又在想什么？”
        - id: ch01-b40
          speaker: peter_rabbit
          text: “我在看那条尾巴。我从没见过这么古怪的尾巴。它一定沉得要命，做什么都碍手碍脚。”
        - id: ch01-b41
          speaker: narrator
          text: 老大自然妈妈笑了。
        - id: ch01-b42
          speaker: mother_nature
          text: “你去问帕迪，他准会说，那是绿森林里最有用的尾巴。整个大千世界再也找不出第二条。只要耐心等一等，你很快就知道它有多少用处了。”
        - id: ch01-b43
          speaker: narrator
          text: 那条尾巴的模样确实古怪。它又宽又厚，扁扁的，呈椭圆形，上面覆盖的不是毛，而是一片片鳞片。这时，长耳野兔跳跳忽然有了新发现。
        - id: ch01-b44
          speaker: jumper_hare
          text: “咦！帕迪的脚跟大雁洪克的一样！”
          emotion: surprised
        - id: ch01-b45
          speaker: paddy_beaver
          text: “只有后脚一样。我的后脚趾之间有蹼，就跟洪克的一样，那是游泳用的。可我的手指之间没有蹼。你们看。”
        - id: ch01-b46
          speaker: narrator
          text: 帕迪举起一只手，让所有伙伴都看清楚。果然，那几根手指彼此分开，都能自由活动。
        - id: ch01-b47
          speaker: mother_nature
          text: “现在大家都已经把你看清楚了。帕迪，请你游到最近砍树的地方去吧。我们也到那里跟你会合，然后你再让大家看看自己究竟是怎么干活的。”
        - id: ch01-b48
          speaker: narrator
          text: 帕迪滑进池塘，先只露着脑袋，在水面漂了一两秒。接着，他突然扬起宽大沉重的尾巴，啪地拍在水上。那声音又响又突然，简直像一门可怕的大炮开了火。
        - id: ch01-b49
          speaker: narrator
          text: 除了老大自然妈妈和刺刺，所有人都吓得跳了起来。彼得恰好站在水坝边，还没来得及想，身体已经先跳了出去，扑通落进水里。你们知道，彼得最不喜欢水。他立刻手忙脚乱，以最快的速度爬上岸。其他伙伴看着他，笑得可真厉害。
        - id: ch01-b50
          speaker: peter_rabbit
          text: “他干吗突然拍水？”
          emotion: angry
        - id: ch01-b51
          speaker: mother_nature
          text: “这是让你看看那条好尾巴的一种用处。他一发现危险，就是这样警告朋友的。你们有没有看到，他游泳时也用尾巴帮忙？他把尾巴转得几乎侧立起来，当成船舵。那双带蹼的大后脚则像船桨一样，推着他在水里前进。”
        - id: ch01-b52
          speaker: mother_nature
          text: “帕迪能在水下待很长时间，最长足有五分钟。瞧，他潜过了整个池塘，现在才浮上来。”
        - id: ch01-b53
          speaker: narrator
          text: 果然，帕迪的脑袋已经在池塘另一头冒了出来，离对岸很近了。他正贴着水面向前游。老大自然妈妈立刻领大家绕过池塘，来到一小片白杨林。树林离水边还有一段距离，帕迪却已经先到了。
        - id: ch01-b54
          speaker: mother_nature
          text: “好了，帕迪，现在让我们看看，你究竟是个怎样的伐木工。”
        - id: ch01-b55
          speaker: narrator
          text: 帕迪挑了一棵小树，像灰松鼠快乐杰克那样坐起来，又把宽大的扁尾巴撑在地上稳住身体。他用两只手抱住树干，亮出橙黄色的大门牙，啃下一大块木屑。接着又是一块，再一块。他就这样一点点绕着树干啃了一圈。
        - id: ch01-b56
          speaker: narrator
          text: 过了一会儿，小树开始摇晃，发出断裂的喀嚓声。帕迪又咬下两三块木屑，突然用尾巴拍打地面，发出警告，然后赶快退到安全的地方。他可不会冒险留在树下，让倒下来的树压住自己。
        - id: ch01-b57
          speaker: narrator
          text: 小树倒了，帕迪马上回来继续干活。细枝只要咬住根部，一口就能截断。较粗的树枝，则要接连咬上好几口。随后，他又开始把树干截成一段段短圆木。干到这里，老大自然妈妈叫住了他。
        - id: ch01-b58
          speaker: mother_nature
          text: “现在给我们看看，你会怎样搬这些圆木。”
        - id: ch01-b59
          speaker: narrator
          text: 帕迪立刻绕到一段圆木后面，从后面推着它，一路向前滚。最后，圆木扑通一声落进一条水沟。这条水沟其实是一条运河，从那片树林附近一直通向池塘。帕迪也跟着进入水中，开始推着圆木朝池塘前进。
        - id: ch01-b60
          speaker: mother_nature
          text: “这样就够了。你从水里出来，再给大家看看长树枝是怎么搬的。”
        - id: ch01-b61
          speaker: narrator
          text: 帕迪听话地爬上岸，回到倒下的树旁。他用嘴衔起一根长树枝，咬住靠近粗端的地方，把树枝扭到肩膀上，拖着走向运河。到了水边，他进入水中，仍旧用同样的姿势拖着树枝向前游。
        - id: ch01-b62
          speaker: mother_nature
          text: “砍树和搬运，你都演示过了。现在我想问你几个问题。”
        - id: ch01-b63
          speaker: narrator
          text: 帕迪从运河里爬上岸，在水边蹲了下来。
        - id: ch01-b64
          speaker: mother_nature
          text: “这条运河怎么会正好挖在这里？”
        - id: ch01-b65
          speaker: paddy_beaver
          text: “当然是我挖的呀。我在陆地上行动又慢又笨，也不喜欢离水太远。那些树离池塘颇有一段路，所以我挖了这条运河，把水一直引到树林附近。”
          emotion: surprised
        - id: ch01-b66
          speaker: paddy_beaver
          text: “要是老郊狼、熊巴斯特或短尾猫尤勒碰巧想找一顿海狸大餐，我离水近些就安全多了。而且，有这条运河，把圆木和树枝送到池塘也轻松得多。”
        - id: ch01-b67
          speaker: narrator
          text: 老大自然妈妈听完，赞同地点了点头。
        - id: ch01-b68
          speaker: mother_nature
          text: “正是这样。你们都仔细看看，这条运河挖得多么讲究。到了另一头，它沿着池塘底部较浅的地方继续向前，让那里的水变得更深。现在你们该明白了吧？这就是我称帕迪为工程师的原因。”
        - id: ch01-b69
          speaker: mother_nature
          text: “帕迪，那些圆木和树枝要放在哪里？”
        - id: ch01-b70
          speaker: paddy_beaver
          text: “我把它们放进食物堆，就堆在屋子附近水深的地方。树皮归我吃，剥光的枝条则留下来，用于修补房子和水坝。”
        - id: ch01-b71
          speaker: paddy_beaver
          text: “到了深秋，我会砍下足够多的树，备好整个冬天的食物。池塘结冰也不要紧，我的食物都藏在冰下。我饿了，就从冰下游出去拿一根树枝，带回屋里啃掉树皮。剩下的光枝再送到外面，等房子或水坝需要修补时使用。”
        - id: ch01-b72
          speaker: mother_nature
          text: “这片漂亮的池塘是怎么来的？”
        - id: ch01-b73
          speaker: paddy_beaver
          text: “我只是偶然沿着欢笑溪一路探寻，来到这里以后，发现附近食物充足，也很适合造一座池塘。我想，住在这里一定不错。水坝所在的地方原本很浅，正是筑坝的好地点。”
        - id: ch01-b74
          speaker: mother_nature
          text: “那你为什么非要池塘不可？水坝又是怎样筑起来的？”
        - id: ch01-b75
          speaker: paddy_beaver
          text: “我要留在这里，当然非有一片池塘不可。欢笑溪不够深，也不够宽，我住在这里并不安全。要是溪水够深够宽，我会在岸边挖洞安家，根本不用费心盖房子、筑水坝。可它偏偏不合适，我只好造一片池塘。这花了我不少力气，不过再辛苦也值得。”
        - id: ch01-b76
          speaker: paddy_beaver
          text: “一开始，我砍来许多灌木和小树，把它们放进欢笑溪那段浅水里，让粗端朝着上游。我在上面堆起泥土和石块，把它们固定好。接着，我不断往上添加枝条、灌木和泥巴。溪水冲来树叶和各种漂浮物，全挂在坝上，也帮着填补了不少空隙。”
        - id: ch01-b77
          speaker: paddy_beaver
          text: “我又从水坝前面挖来许多泥巴，塞进枝条之间的空当。这样既把坝前的水挖深了，也堵住了渗水的缝隙。水被拦住，自然就慢慢积成一片池塘。”
        - id: ch01-b78
          speaker: paddy_beaver
          text: “我不停地把水坝加长、加高。水坝越长越高，池塘也就越变越大。等它大到、深到让我满意，我才停下水坝上的活儿，在池塘里盖起这座房子。”
        - id: ch01-b79
          speaker: narrator
          text: 大家一齐转头看向帕迪的房子。它离水坝不远，屋顶高高露出水面，一眼便能看见。
        - id: ch01-b80
          speaker: mother_nature
          text: “这座房子又是怎么盖的？”
        - id: ch01-b81
          speaker: paddy_beaver
          text: “我先在池塘里用枝条和泥巴搭了一个大平台。那里的水足够深，就算天气冷到极点，也不会一直冻到底。我把平台越搭越高，直到露出水面。然后，再用枝条和泥巴砌起墙壁、盖上屋顶，就是你们现在看到的样子。”
        - id: ch01-b82
          speaker: paddy_beaver
          text: “里面有一间宽敞舒适的屋子，还铺着撕碎的木丝，睡起来很舒服。地板上有两个洞，每个洞都连着一条长通道。通道穿过地基，一路向下，出口开在池塘底部，里面当然全是水。有些房子只有一条通道，不过我喜欢两条。它们是进入我家的唯一通道。”
        - id: ch01-b83
          speaker: paddy_beaver
          text: “每年秋天，我都会用枝条、泥巴和草皮修补墙壁与屋顶，所以现在它们已经很厚了。到了深秋，我有时还会在房子外面抹一层泥。泥巴冻硬以后，就算有敌人踩着冰面来到屋边，也休想把房子扒开。我想，该说的都说完了。”
        - id: ch01-b84
          speaker: narrator
          text: 彼得长长地吸了一口气。
        - id: ch01-b85
          speaker: peter_rabbit
          text: “这得干多少活儿呀！你是不是一天到晚都在工作？”
        - id: ch01-b86
          speaker: narrator
          text: 帕迪笑了起来。
        - id: ch01-b87
          speaker: paddy_beaver
          text: “当然不是，彼得。”
        - id: ch01-b88
          speaker: narrator
          text: 老大自然妈妈赞许地点了点头。
        - id: ch01-b89
          speaker: mother_nature
          text: “答得对，一点儿不错。还有别的问题吗？”
        - id: ch01-b90
          speaker: happy_jack
          text: “你是不是只吃树皮？”
        - id: ch01-b91
          speaker: paddy_beaver
          text: “当然不是。夏天，我吃浆果、蘑菇、青草，还吃好几种植物的叶子和茎。冬天，我也会换换口味，吃睡莲的根，还有桤木和柳树的根。不过，我吃得最多的还是树皮。”
        - id: ch01-b92
          speaker: narrator
          text: 老大自然妈妈等了几分钟。她见再没有人提出问题，便又补充了几句话，为今天的课作结。
        - id: ch01-b93
          speaker: mother_nature
          text: “现在，你们该明白我为什么这样为海狸帕迪骄傲，也该明白我为什么告诉你们，他既是伐木工、建筑师，又是工程师了。下一课，我们要讲鼠类家族。”
