audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm, observant storytelling
        timbre: clear and gentle
        pace: measured
        pitch: medium
    old_mother_nature:
      display_name: Old Mother Nature
      tts:
        delivery: kindly, assured, and practical
        timbre: warm and full
        pace: unhurried
        pitch: medium-low
  chapters:
    - id: ch01
      title: Buster Bear's Big Cousins
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: "Buster Bear had been right about Farmer Brown. Only a few minutes after Buster disappeared, Farmer Brown's footsteps sounded along the Lone Little Path. That ended school for the morning, of course. But everyone came back at sunup the next day. They all wanted to hear about Buster Bear's big cousins."
        - id: ch01-b02
          speaker: old_mother_nature
          text: "Far away in the mountains of the West, where Whistler the Marmot and Little Chief the Pika live, you can find a big cousin of Buster Bear. His name is Silvertip the Grizzly Bear. There was a time when people feared him more than any other animal in this country. Times have changed. People have hunted Silvertip so much with their terrible guns that now he fears them just as much as Buster does."
        - id: ch01-b03
          speaker: old_mother_nature
          text: "Silvertip is larger than Buster and tremendously strong. His coat isn't black. It may be yellowish brown, or it may be nearly black. The ends of the hairs are usually pale, which makes his fur look frosted. That is how he got the name Silvertip. His claws are longer and more curved than Buster's. They are so large that they look frightening. Those long claws keep him from climbing trees, but they make wonderful tools for digging out Marmots and ground Squirrels. Even Whistler isn't safe when he builds his home among the rocks. Silvertip is strong enough to pull great rocks over and roll them aside."
        - id: ch01-b04
          speaker: old_mother_nature
          text: "Silvertip travels far and wide while he looks for food. Sometimes he wanders onto the Cattle ranges and kills Cattle. He is strong enough to kill a Cow easily. He may look clumsy, but he can run very fast. Only a fast Horse can outrun him. Like Buster, he eats anything he can find that is fit to eat. So much hunting has made him very clever. No one in those great mountains has quicker wits."
        - id: ch01-b05
          speaker: old_mother_nature
          text: "At certain times of year, great numbers of Salmon swim up the rivers in Silvertip's country. Then he has all the food he could want. He waits beside a pool until a Salmon comes within reach, and one quick sweep of his paw sends it onto the bank. Sometimes he chooses a shallow place where the fish have trouble getting through. There he catches them as they struggle upstream. When winter comes, Silvertip sleeps just as Buster does, usually inside a cave that is well hidden."
        - id: ch01-b06
          speaker: old_mother_nature
          text: "Mrs. Silvertip is a splendid mother. She usually has two cubs, and they stay with her until they are a year old. Buster and Silvertip share a curious habit. Each one will stand against a tree and bite the trunk as high as he can reach. The next Bear to pass that way sees the mark and leaves one of his own on the same tree. Silvertip knows every inch of his home country. He always chooses the best route from place to place. He is one of the finest animals in this country, and it is sad to think that his magnificent family may soon disappear unless people make laws to protect him from hunters. He has already vanished from many places where he once lived."
        - id: ch01-b07
          speaker: old_mother_nature
          text: "Silvertip isn't as good-natured as Buster, but he asks only to be left alone. When one of them begins killing Cattle, of course, he is making the worst kind of trouble. You cannot blame people for hunting that Bear. But only an occasional member of Silvertip's family becomes a Cattle killer. The rest do no harm."
        - id: ch01-b08
          speaker: old_mother_nature
          text: "Yesterday I told you that Buster has a cousin who would make him look small. That cousin is Bigfoot, the Alaska Bear, also called the Great Brown Bear. He lives in the far northwestern part of this continent. Even Silvertip would seem small next to him. Bigfoot is a giant, and he is the largest flesh-eating animal in the whole world. His coat is dark brown. When he rises onto his hind legs, he stands almost half again as tall as a tall man. His shoulders are very high, and his head is enormous."
        - id: ch01-b09
          speaker: old_mother_nature
          text: "Like all the Bears, Bigfoot eats many different things. He hunts Mice and other small animals. He digs up roots, fills himself with berries, and sometimes grazes on a kind of wild grass as Cattle do. He eats plenty of fish because the streams in his country are full of them. In spite of his size, Bigfoot has learned to fear people just as Silvertip has. If he is taken by surprise, he may attack and kill a person. Usually, though, the first sign of someone coming sends him away."
        - id: ch01-b10
          speaker: old_mother_nature
          text: "The last Bear cousin is Snow King the Polar Bear. He is king of the Frozen North, where the land is covered with snow and ice, and his coat is entirely white. Snow King is another big Bear, though his shape is somewhat different from his cousins. His body and neck are longer, and so is his head. His ears are rather small and lie close to his head. He spends the whole year in a place where it seems no animal could survive, yet he lives very well. His home is in the coldest part of the Great World, and the cold doesn't trouble him at all."
        - id: ch01-b11
          speaker: old_mother_nature
          text: "Snow King eats flesh more than any other Bear. That is because plants grow only in certain places in his country, and only for a few weeks in midsummer. He is an excellent fisherman, so fish provide much of his food. Many ocean animals live in the far North too. They come ashore to rest, lie in the sun, and have their babies. They are Seals, Sea Lions, and Walruses. I will tell you about them another time. Snow King depends on them for much of what he eats. He is a wonderful swimmer himself and often goes far out into the icy water."
        - id: ch01-b12
          speaker: old_mother_nature
          text: "Great fields of ice float in those northern waters. Snow King swims from one to the next while searching for Seals, because Seals climb onto the floating ice just as they climb onto shore. Mrs. Bear sometimes takes her cubs on long swims. When the little ones grow tired, one climbs onto her back while the other catches hold of her tail. She carries one cub and tows the other."
        - id: ch01-b13
          speaker: old_mother_nature
          text: "Snow King's babies are born inside a house made of snow. Early in winter, Mrs. Bear chooses a sheltered spot where the drifting snow will cover her. She goes to sleep there, and the snow keeps drifting over her until she lies deep beneath it. You might expect her to be cold, but she isn't. The snow keeps her warm. Her breath melts a small opening through the snow, so she always has air."
        - id: ch01-b14
          speaker: old_mother_nature
          text: "The babies are born in that snowy home. They stay there, just as Buster Bear's babies stay in their home, until they are large enough to follow their mother. In spring she breaks out through the snow and leads her cubs away. Then she teaches them to care for themselves. Snow King doesn't sleep through the winter. He keeps roaming just as he does in summer."
        - id: ch01-b15
          speaker: old_mother_nature
          text: "Snow King is fearless. He has not learned to dread people as his cousins have. He may attack a person without hesitation, and meeting him at close range is terrible. Since he lives in that distant, frozen country, people don't hunt him as much as they hunt the other Bears. Besides Seals and fish, he sometimes catches an Arctic Hare. In summer, great numbers of Ducks and other seabirds nest in the far North. Their eggs and their young become part of Snow King's food. His white coat matches the world around him, which helps him greatly when he hunts. It is a beautiful coat, and it makes Snow King the most beautiful member of the Bear family."
        - id: ch01-b16
          speaker: old_mother_nature
          text: "That finishes our lesson about the Bears. It also finishes the order of flesh eaters, the Carnivora. Next, I think we will learn about a certain little friend of yours. He eats flesh, but he doesn't belong to the flesh-eating order at all. In fact, he belongs to an order with no other member in this country. I will let you guess who he is."
