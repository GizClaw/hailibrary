audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 亲切生动，带着温和的幽默感
        timbre: 温暖清亮
        pace: 舒缓而富有变化
        pitch: 中等
    mother_nature:
      display_name: 老大自然妈妈
      tts:
        delivery: 慈爱睿智，说话从容而坦率
        timbre: 温厚柔和
        pace: 从容
        pitch: 中低
  chapters:
    - id: ch01
      title: 银尖灰熊
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 熊巴斯特说布朗农夫要来了，果然一点儿也没错。他刚消失几分钟，孤独小径上就响起了布朗农夫的脚步声。那天早晨的课只好结束。第二天太阳一升起来，大家又全都赶到学校，谁也不愿错过巴斯特那些大表亲的故事。
        - id: ch01-b02
          speaker: mother_nature
          text: “在遥远的大西部山区，住着旱獭吹口哨和小酋长鼠兔，也住着巴斯特的一位大表亲。他叫银尖，是一头灰熊。从前，这个辽阔国家里的人，最怕的动物就是他。后来，人类拿着可怕的枪不断追杀灰熊。银尖渐渐学会了躲避人类，如今他和巴斯特一样怕人。”
        - id: ch01-b03
          speaker: mother_nature
          text: “银尖比巴斯特更高大，也更有力气。他的外衣有时是黄褐色，有时深得接近黑色。毛尖通常比较浅，远远望去像结了一层白霜，他也因此得名。那双爪子比巴斯特的更长、更弯，大得很吓人。爪子太长，害得他爬不了树，却正适合挖旱獭和地松鼠。就算吹口哨把家藏进岩石丛，也未必安全。银尖能掀动巨石，把石头一块块推开。”
        - id: ch01-b04
          speaker: mother_nature
          text: “为了觅食，银尖会走遍很大一片地方。他偶尔闯进牧牛场咬死牛只，凭那身力气，杀死一头母牛也不费事。他看着笨重，奔跑却快得惊人，只有快马才能逃过他的追赶。银尖和巴斯特一样，什么能吃就吃。人类追捕了他太久，他变得又机警又聪明，在那片群山里，谁的脑筋也没有他转得快。”
        - id: ch01-b05
          speaker: mother_nature
          text: “每年到了特定的季节，大批鲑鱼会沿当地的河流逆流而上。银尖这时可要享福了。他守在水潭旁，等鱼游到近处，就迅速挥出一掌，把鱼捞上岸。他也会找一处很浅的水道。鲑鱼在那里很难通过，银尖就趁它们奋力往上游时一把抓住。冬天来临，他便像巴斯特那样睡觉，通常会挑一座藏得很好的洞穴。”
    - id: ch02
      title: 群山里的熊与西北方的巨人
      blocks:
        - id: ch02-b01
          speaker: mother_nature
          text: “银尖太太很会照料孩子。她通常有两只宝宝，会把他们带在身边，直到满一岁才让他们离开。银尖和巴斯特还有同一个怪习惯。他们靠着树站起来，尽量往自己能够着的最高处咬。下一头沿路经过的熊看到咬痕，也会在同一棵树上咬出自己的印记。银尖熟悉地盘上的每一寸土地，从这里去那里，他总能找出最好走的路。”
        - id: ch02-b02
          speaker: mother_nature
          text: “银尖是这个国家最出色的动物之一。可惜，要是人类不立法保护灰熊，任由猎人捕杀，这个了不起的种族很快就会消失。很多从前有灰熊出没的地方，如今已经见不到他们了。银尖不如巴斯特温和，可他只希望别人别打扰自己。有的灰熊会专门咬牛，那确实闯了大祸，不能责怪人类去追捕。可是这样做的只是极少数，其余灰熊并不会伤害什么。”
        - id: ch02-b03
          speaker: mother_nature
          text: “还记得我昨天的话吗？巴斯特有位表亲，站在他旁边，能把他衬成小个子。那就是大脚，也叫阿拉斯加棕熊或大棕熊，住在这片大陆的西北尽头。银尖到了他身旁，也会显得矮小。大脚是个真正的巨人，是大千世界上最大的食肉动物。他披着深棕色的外衣，肩膀高高隆起，脑袋十分巨大。等他用后腿站起来，差不多比一个高个子男人还要高出一半。”
        - id: ch02-b04
          speaker: mother_nature
          text: “大脚和熊家族的其他成员一样，吃的东西很多。他捕捉老鼠和别的小动物，也挖植物的根，吃许多浆果。有时候，他甚至像牛一样低头吃野草。当地河流里鱼很多，所以他也特别爱吃鱼。这么庞大的动物，同样学会了害怕人类。受惊时，大脚偶尔会扑向人，甚至把人杀死。不过多数时候，只要察觉有人靠近，他马上就跑了。”
    - id: ch03
      title: 冰封北国的雪王
      blocks:
        - id: ch03-b01
          speaker: mother_nature
          text: “熊家族还有最后一位表亲，他就是北极熊雪王。雪王统治着冰封的北国，住在冰天雪地里，外衣也是一片雪白。他同样高大，身形却与其他熊不大一样。身子更长，脖子长得多，头也是长长的。两只小耳朵紧贴着脑袋。那里冷得仿佛不可能有动物生存，雪王却一年四季都住在那里，日子过得很好。大千世界最严寒的天气，他根本不放在心上。”
        - id: ch03-b02
          speaker: mother_nature
          text: “雪王吃的肉比熊家族中任何成员都多。北国只有少数地方长植物，而且一年中也只有仲夏那几个星期能见到。好在雪王很会捕鱼，鱼是他的重要食物。那片海洋里还生活着大批动物。他们会爬上岸休息、晒太阳，也在那里生下宝宝。这些动物就是海豹、海狮和海象，以后我再讲他们。雪王常靠他们填饱肚子。他自己也极会游泳，经常游到冰冷的海水深处。”
        - id: ch03-b03
          speaker: mother_nature
          text: “北方海上漂着一片又一片巨大的冰原。海豹常常爬上浮冰，就像他们爬上陆地一样。雪王为了寻找海豹，会从一片冰原游到下一片。有时熊太太也会带着两只宝宝长途游泳。小熊游累了，一只爬上妈妈的背，另一只咬住她的尾巴。熊太太就这样驮一个、拖一个，带着他们继续前进。”
        - id: ch03-b04
          speaker: mother_nature
          text: “雪王的宝宝出生在雪屋里。初冬时，熊太太会找到一处避风的地方，让积雪盖住自己。她睡着以后，雪越积越厚，最后把她深深埋在下面。你们也许会担心她冷，其实积雪正好能为她保暖。她呼出的热气会在雪中融出一个小孔，空气可以从那里进来。”
        - id: ch03-b05
          speaker: mother_nature
          text: “熊宝宝就在雪下出生。他们会留在那座雪屋里，像巴斯特的宝宝留在自己家中一样，一直长到能跟妈妈四处走动。春天来了，熊太太冲破积雪，领着宝宝走到外面，教他们照顾自己。雪王可不睡过整个冬天。无论冬夏，他都会到处游荡。”
    - id: ch04
      title: 熊家族的最后一课
      blocks:
        - id: ch04-b01
          speaker: mother_nature
          text: “雪王无所畏惧，还没像表亲们那样学会害怕人类。他会毫不迟疑地袭击人，近处遇见他非常可怕。不过，他生活的土地遥远又寒冷，所以不像其他熊那样经常遭到猎捕。除了海豹和鱼，他偶尔也捉北极野兔。”
        - id: ch04-b02
          speaker: mother_nature
          text: “夏天一到，成群的鸭子和别的海鸟会飞到遥远的北方筑巢。鸟蛋和幼鸟也会成为雪王的食物。他的白外衣和周围的冰雪融在一起，捕猎时给了他很大的帮助。那身毛皮又美丽极了，使雪王成了熊家族中最漂亮的成员。”
        - id: ch04-b03
          speaker: mother_nature
          text: “好了，熊的故事讲完了，整个食肉目的故事也到这里结束。下一回，我们去认识你们的一位小朋友。他也吃肉，却根本不属于食肉目。他属于另外一个目，而在这个国家里，那一目只有他一个成员。至于他是谁，我先留给你们猜一猜。”
