audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 亲切生动，带着温和的幽默感
        timbre: 温暖清亮
        pace: 舒缓而富有变化
        pitch: 中等
    peter_rabbit:
      display_name: 彼得兔
      tts:
        delivery: 好奇直率，情绪来得快也去得快
        timbre: 清脆稚气
        pace: 轻快
        pitch: 中高
    jumper_hare:
      display_name: 长耳野兔跳跳
      tts:
        delivery: 朴实腼腆，认真时透着好奇
        timbre: 清朗柔和
        pace: 稍缓
        pitch: 中等
    mother_nature:
      display_name: 老大自然妈妈
      tts:
        delivery: 慈爱睿智，说话从容而坦率
        timbre: 温厚柔和
        pace: 从容
        pitch: 中低
    happy_jack:
      display_name: 灰松鼠快乐杰克
      tts:
        delivery: 自信好胜，受窘时有些急躁
        timbre: 明亮爽脆
        pace: 轻快
        pitch: 中高
    chatterer:
      display_name: 红松鼠喋喋
      tts:
        delivery: 伶牙俐齿，争强好胜又活泼
        timbre: 尖细清亮
        pace: 明快
        pitch: 高
    striped_chipmunk:
      display_name: 花栗鼠条纹
      tts:
        delivery: 开朗谦和，机灵中带着几分自信
        timbre: 清亮柔和
        pace: 轻快
        pitch: 中高
    johnny_chuck:
      display_name: 土拨鼠约翰尼
      tts:
        delivery: 直率倔强，懒洋洋中带着粗朴的自信
        timbre: 浑厚结实
        pace: 稍缓
        pitch: 中低
  chapters:
    - id: ch01
      title: 第九章　两位古怪的小小割草人
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 懂得一点儿，人就会想懂得更多。约翰尼本来只是听了老大自然妈妈的传话，才肯来上课。可他知道自己还有一位高大漂亮的表亲吹口哨，住在遥远西部的山区以后，心里就装满了问题。他觉得，那实在不像自己家族成员会住的地方，越想越想弄个明白。第二天早晨，老大自然妈妈刚叫大家坐好上课，约翰尼的问题早已准备好了。
        - id: ch01-b02
          speaker: johnny_chuck
          text: “请问，大自然妈妈，吹口哨住的那些岩石中间，也有邻居吗？”
        - id: ch01-b03
          speaker: mother_nature
          text: “当然有。他有一位近邻，是啮齿目大家族里最奇特、最有意思的小成员之一。对了，你们都属于哪一目？”
        - id: ch01-b04
          speaker: peter_rabbit
          text: “啮齿目！”
        - id: ch01-b05
          speaker: narrator
          text: 彼得答得又快又准，老大自然妈妈笑着看了看他。
        - id: ch01-b06
          speaker: mother_nature
          text: “答对了。我只是想看看你们有没有真的学会，免得我在你们这些小家伙身上白费工夫。吹口哨的那位小邻居，叫小酋长鼠兔。”
        - id: ch01-b07
          speaker: narrator
          text: 彼得和跳跳一听，立刻把长耳朵竖得高高的。
        - id: ch01-b08
          speaker: jumper_hare
          text: “我还以为您把我们家族全讲完了呢。可您从没提过小酋长呀。”
        - id: ch01-b09
          speaker: mother_nature
          text: “因为他不是你们家族的一员。别看人们叫他小酋长兔，他其实不是野兔。他长得倒像一只小兔子，可后腿很短，耳朵也是圆的。他自己另成一家，正确的名字是鼠兔。有些人确实这样叫他，不过叫他岩兔的人更多，也有人叫他哭兔，因为他特别爱出声。野兔家族可没有谁像他这样。”
        - id: ch01-b10
          speaker: mother_nature
          text: “他的个头只和彼得家长到一半的宝宝差不多，真是个小不点儿。外套是灰褐色的，眼睛小而明亮。耳朵大小合适，却圆圆的，并不长。四条腿都短，后腿只比前腿长一点点。就连脚底也和野兔家族的成员一样，覆着一层毛。”
        - id: ch01-b11
          speaker: peter_rabbit
          text: “那他的尾巴呢？”
        - id: ch01-b12
          speaker: narrator
          text: 彼得一向最关心尾巴。老大自然妈妈听了，忍不住笑起来。
        - id: ch01-b13
          speaker: mother_nature
          text: “说到尾巴，他比你还吃亏。他根本没有，至少没有一条能让人看见的尾巴。他住在大山高处的岩石间，那里已经高过树木能够生长的地方。他和吹口哨常常住得很近，彼此是邻居。”
        - id: ch01-b14
          speaker: johnny_chuck
          text: “那他一定也像吹口哨一样，把家安在岩石下面。”
        - id: ch01-b15
          speaker: mother_nature
          text: “没错。他那么小，再窄的石缝也钻得进去，所以家和粮仓都藏在岩石深处。”
        - id: ch01-b16
          speaker: happy_jack
          text: “粮仓？他怎么会有粮仓？您说的到底是什么呀？”
          emotion: surprised
        - id: ch01-b17
          speaker: narrator
          text: 老大自然妈妈笑了。
        - id: ch01-b18
          speaker: mother_nature
          text: “那是我给它们起的名字。小酋长把干草存在那里，就像农夫布朗把干草放进谷仓。要是换成你们来起名字，大概会管那些地方叫储藏室。”
        - id: ch01-b19
          speaker: narrator
          text: 一听见干草，彼得猛地坐直身子，惊讶得两眼大睁。
        - id: ch01-b20
          speaker: peter_rabbit
          text: “您真说的是干草？那么高的山上，他从哪儿弄来干草？又要干草做什么？”
          emotion: surprised
        - id: ch01-b21
          speaker: mother_nature
          text: “他制作干草的办法，和农夫布朗每年夏天用的一样。到了冬天，或是遇上坏天气，他就靠这些干草生活。说起怎么把干草做好，小酋长懂得一点儿也不比农夫布朗少。就算在高高的岩石间，也有地方长着青草、豌豆藤和别的绿色植物。夏天，他就吃这些。”
        - id: ch01-b22
          speaker: mother_nature
          text: “小酋长又聪明又勤俭，这一点很像松鼠，却不像野兔。他等植物长到适合收割时，就把它们咬断，再摊到岩石上，让太阳一点点晒干。新鲜的绿草要是马上搬进粮仓，就会发酸腐坏，他知道得很清楚，所以从不急着收藏。青草还没开始枯死就割下来，彻底晒透以后，这才成了干草。”
        - id: ch01-b23
          speaker: mother_nature
          text: “等干草晒得恰到好处，他才一趟趟搬进粮仓。那些粮仓其实就是岩石深处的小洞穴。到了冬天，外面再也找不到绿色食物，他还可以待在岩石底下，吃自己早早备好的干草。”
        - id: ch01-b24
          speaker: mother_nature
          text: “小酋长的颜色和岩石非常接近。他一动不动时，非得有一双锐利的眼睛才能发现。他有一种尖细又古怪的吱吱声，而且一天到晚叫个不停。更奇怪的是，这声音像是从什么地方都没有传来，叫人怎么也找不准。有时，他藏在岩石底下的家里，外面照样能听见他吱吱叫。”
        - id: ch01-b25
          speaker: mother_nature
          text: “他和约翰尼一样，喜欢夜里睡觉，白天到外面活动。因为个头太小，他必须时时留意敌人。只要察觉到一丁点儿危险，他就飞奔到岩石间安全的地方，再躲在里面痛骂那个吓着他的家伙。在我的整个大家族里，再也没有谁比这位大西部山中的小小割草人更讨人喜欢了。”
        - id: ch01-b26
          speaker: narrator
          text: 彼得用长长的后脚挠着一只长耳朵，若有所思。
        - id: ch01-b27
          speaker: peter_rabbit
          text: “小酋长晒干草的主意真不错。我都想亲自试试了。”
        - id: ch01-b28
          speaker: narrator
          text: 大家一下全笑出了声。谁不知道彼得平日最会随遇而安，又最不会为将来打算呢？大家一想到他也要学小酋长晒草，就觉得实在好笑。连彼得自己也忍不住咧嘴笑了。
        - id: ch01-b29
          speaker: mother_nature
          text: “那倒真是个好主意。对了，遥远西部的那些大山里，还有一位割草人。”
        - id: ch01-b30
          speakers: [peter_rabbit, johnny_chuck, happy_jack]
          ensemble: chorus
          text: “是谁？”
        - id: ch01-b31
          speaker: peter_rabbit
          text: “一定是山河狸短尾巴。他准是河狸帕迪的表亲。”
        - id: ch01-b32
          speaker: narrator
          text: 老大自然妈妈摇了摇头。
        - id: ch01-b33
          speaker: mother_nature
          text: “不对。短尾巴和帕迪的亲缘，并不比你们中随便哪两个更近。他根本不是河狸，真正的名字叫塞维尔鼠。有人管他叫肖特尔，有人叫他轰隆，也有人叫他切哈利斯，不过大多数人还是把他叫作山河狸。”
        - id: ch01-b34
          speaker: striped_chipmunk
          text: “人们这样叫他，是因为他长得像帕迪吗？”
        - id: ch01-b35
          speaker: mother_nature
          text: “不是因为帕迪。他不像帕迪，倒更像麝鼠杰里。个头也和杰里差不多大。你只要想一想杰里没了尾巴会是什么模样，就知道短尾巴看起来像谁了。”
        - id: ch01-b36
          speaker: peter_rabbit
          text: “难道他一点儿尾巴也没有？”
        - id: ch01-b37
          speaker: mother_nature
          text: “有是有，却只有短短一小截，小得让人看着他会以为根本没有尾巴。他也住在遥远西部的山区，和吹口哨、小酋长在同一片大山里。不过，他不住高处的岩石间，而把家安在谷地。那里的泥土松软，树木长得密密的。”
        - id: ch01-b38
          speaker: mother_nature
          text: “短尾巴一点儿也不喜欢岩石。他要的是松软潮湿的地，好让自己痛痛快快地挖个不停。有一点，他很像草原犬鼠吠吠。”
        - id: ch01-b39
          speaker: johnny_chuck
          text: “哪一点？”
        - id: ch01-b40
          speaker: narrator
          text: 约翰尼一听见吠吠的名字，立刻来了精神，赶紧追问。因为吠吠正是他的表亲。
        - id: ch01-b41
          speaker: mother_nature
          text: “他们都喜欢群居。短尾巴不爱一个人生活，总想和同类作伴。所以，只要发现一只短尾巴，附近多半还住着许多他的族亲。他们喜欢你来我往地串门，便在各家之间和茂密的蕨丛中踩出一条条小路。他们还会把路面清理干净，好轻轻松松地来回跑。”
        - id: ch01-b42
          speaker: mother_nature
          text: “有些小路会一直通进长长的地道。那些地道是他们为了躲避危险挖出来的。谷地里的泥土通常湿漉漉的，所以这些小地道的底部常常会有水流过。”
        - id: ch01-b43
          speaker: johnny_chuck
          text: “短尾巴的房子是什么样的？”
        - id: ch01-b44
          speaker: mother_nature
          text: “当然是地洞。家要挖在比那些通道干燥的地方。短尾巴太太会用晒干的蕨叶做一个窝。就在窝的旁边，夫妻俩还要修上两三间储藏室。他们可都是勤俭过日子的好手。”
        - id: ch01-b45
          speaker: happy_jack
          text: “您说他也是割草人，那些储藏室里一定装满了干草吧？”
        - id: ch01-b46
          speaker: narrator
          text: 只要听见储藏室，快乐杰克总是格外有兴趣。
        - id: ch01-b47
          speaker: mother_nature
          text: “不错。他割下青草、蕨草、豌豆藤和别的绿色植物，再扎成一小捆一小捆，搬到地道入口。他先把这些草堆在树枝上，不让它们碰到潮湿的地面，也让四周的空气帮着吹干。等到全干了，他才把干草搬进洞里储存起来。”
        - id: ch01-b48
          speaker: mother_nature
          text: “他还会收藏别的食物。他喜欢蕨根，也会从灌木上咬下鲜嫩的小枝，把一部分存起来。他还喜欢吃树皮。到了冬天，他仍旧和夏天一样活跃，会在雪层下面到处打洞。有时，他还会染上彼得的坏习惯，把自己够得到的树皮绕着树干啃上一整圈，活活害死一棵树。”
        - id: ch01-b49
          speaker: chatterer
          text: “他会爬树吗？”
        - id: ch01-b50
          speaker: mother_nature
          text: “爬树的本领大概和约翰尼差不多。他偶尔会爬上低矮的灌木，或是枝条长得很低的小树，咬下一些鲜嫩的枝芽。不过，这种事他做得并不多。地面才是他的天地。”
        - id: ch01-b51
          speaker: mother_nature
          text: “他在夜里最活跃，可只要没人打扰，白天也会出来。他要咬嫩枝时，会像松鼠一样直起身子，用两只手捧住枝条，再拿锋利的牙齿咬断。”
        - id: ch01-b52
          speaker: peter_rabbit
          text: “您还没说他的外套是什么颜色呢。”
        - id: ch01-b53
          speaker: mother_nature
          text: “我说过，他很像麝鼠杰里。他的外套也是褐色，和杰里的颜色差不多，只是毛远没有杰里的那么柔软细密。”
        - id: ch01-b54
          speaker: peter_rabbit
          text: “我猜，他也和我们一样，有不少敌人吧？”
        - id: ch01-b55
          speaker: mother_nature
          text: “当然。所有小动物都有敌人，说起来，大动物多半也不例外。鹰王是一个，短尾猫嚎叫也是一个。他们总在盯着短尾巴，等机会捉住他。正因为这样，短尾巴才挖出那么多地道。有了地道，他就能藏到地下，从地底安全来往。”
        - id: ch01-b56
          speaker: mother_nature
          text: “天哪，时间过得真快！你们都赶紧跑回家吧。我还有太多事情要忙，今天不能再讲了。”
