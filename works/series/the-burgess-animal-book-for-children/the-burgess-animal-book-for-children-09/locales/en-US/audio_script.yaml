  chapters:
    - id: ch01
      title: Little Chief of the Mountains
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: A little knowledge often makes you hungry for more. Johnny Chuck had gone to school only because Old Mother Nature sent for him. Now he was every bit as curious as Peter Rabbit. He had just discovered that a big, handsome cousin named Whistler the Marmot lived among the rocks in the mountains of the Far West. That seemed like a very strange home for one of Johnny's relatives, and he wanted to hear more. So when Old Mother Nature called the school to order the next morning, Johnny had his question ready.
        - id: ch01-b02
          speaker: johnny_chuck
          text: "Please, Mother Nature, does my cousin Whistler have any neighbors up there among those rocks?"
        - id: ch01-b03
          speaker: old_mother_nature
          text: "He certainly does. One of his nearest neighbors is among the oddest and most interesting little members of the great order that all of you belong to. Now, what is that order?"
        - id: ch01-b04
          speaker: peter_rabbit
          text: "The order of Rodents."
        - id: ch01-b05
          speaker: old_mother_nature
          text: "Right, Peter. I asked to find out whether you truly are learning. I wanted to be sure I wasn't wasting my time with you little folks. Whistler's small neighbor is called Little Chief Hare."
        - id: ch01-b06
          speaker: narrator
          text: Peter Rabbit and Jumper the Hare pricked up their long ears at once. If they could possibly have become more interested, they did.
        - id: ch01-b07
          speaker: jumper_the_hare
          text: "I thought you had already told us about everyone in our family. You never said anything about Little Chief."
        - id: ch01-b08
          speaker: old_mother_nature
          text: "No, because Little Chief isn't one of your relatives. People call him Little Chief Hare, but he isn't a Hare at all. He does look rather like a small Rabbit, except that his hind legs are short and his ears are round. He has a family all his own, and his proper name is Pika. Some people use that name. More people call him a Cony, and others call him the Crying Hare because he uses his voice so often. No true member of the Hare family does that."
        - id: ch01-b09
          speaker: old_mother_nature
          text: "Little Chief is only about the size of one of your half-grown babies, Peter, so he truly is a very little fellow. His coat is grayish brown, and his small eyes are bright. His ears are a good size, but they are rounded instead of long. All four legs are short, with the hind legs only a little longer than the front ones. Like the Hare family, he has hair on the soles of his feet."
        - id: ch01-b10
          speaker: peter_rabbit
          text: "And what kind of tail does he have?"
        - id: ch01-b11
          speaker: narrator
          text: Peter, as you know, always took a special interest in tails. Old Mother Nature smiled.
        - id: ch01-b12
          speaker: old_mother_nature
          text: "He's even worse off than you are, Peter. He has no tail that anyone can see. Little Chief lives high among the rocks of the great mountains, above the place where trees can grow. He is often a very close neighbor of Whistler."
        - id: ch01-b13
          speaker: johnny_chuck
          text: "Then I suppose he makes his home underneath the rocks, the way Whistler does."
        - id: ch01-b14
          speaker: old_mother_nature
          text: "That's right. Little Chief is so small that he can squeeze through very narrow spaces. His home and his barns lie far down among the rocks."
        - id: ch01-b15
          speaker: happy_jack
          text: "Barns? What in the world do you mean by barns?"
          emotion: surprised
        - id: ch01-b16
          speaker: narrator
          text: Old Mother Nature laughed.
        - id: ch01-b17
          speaker: old_mother_nature
          text: "I call them barns because Little Chief stores his hay there, just as Farmer Brown keeps hay in a barn. You would probably call them storehouses."
        - id: ch01-b18
          speaker: narrator
          text: At the word hay, Peter sat straight up. His eyes opened wide with astonishment.
        - id: ch01-b19
          speaker: peter_rabbit
          text: "Did you say hay? Where could he possibly find hay so high in the mountains? And why would he want it?"
          emotion: surprised
    - id: ch02
      title: A Tiny Haymaker at Work
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: Old Mother Nature had a twinkle in her eyes when she answered Peter.
        - id: ch02-b02
          speaker: old_mother_nature
          text: "Little Chief makes hay in much the same way you see Farmer Brown make it every summer. He eats that hay during the winter and whenever the weather is bad. In fact, Little Chief knows the proper way to make hay just as well as Farmer Brown does."
        - id: ch02-b03
          speaker: old_mother_nature
          text: "Even among those high rocks, there are patches where grass, pea vines, and other green plants grow. Little Chief eats them fresh through the summer. But he is as wise and thrifty as any Squirrel, and that is another way he differs from the Hare family. When the plants are ready, he cuts them and spreads them across the rocks to dry in the sun."
        - id: ch02-b04
          speaker: old_mother_nature
          text: "He knows that fresh green plants would turn sour and spoil if he carried them straight into his barns. He waits until they are completely dry before storing them. By then they are hay, because hay is simply grass cut before it starts to die and dried in the sun. When his hay is exactly dry enough, Little Chief carries it down into the little caves among the rocks that serve as his barns. There it waits for winter, when no green food can be found."
        - id: ch02-b05
          speaker: old_mother_nature
          text: "Little Chief is almost the same color as the rocks. You need sharp eyes to notice him when he sits still. He has a funny little squeaking voice and uses it a great deal. The sound is hard to place. It seems to come from nowhere at all. Sometimes you can hear him squeaking far down inside his home under the rocks."
        - id: ch02-b06
          speaker: old_mother_nature
          text: "Like Johnny Chuck, Little Chief sleeps at night and goes out by day. Because he is so small, he must watch constantly for enemies. At the first sign of danger, he races to safety among the rocks. Then he scolds whatever frightened him. In all my great family, you won't find a more lovable little person than this small haymaker of the mountains in the Great West."
        - id: ch02-b07
          speaker: peter_rabbit
          text: "Making hay sounds like a very good idea. I think I may try it myself."
        - id: ch02-b08
          speaker: narrator
          text: Peter scratched one long ear with a long hind foot as he spoke. Everyone burst out laughing. They all knew how easygoing Peter was. He never planned ahead, and no one could imagine him working hard to store food for winter. Peter knew exactly why they were laughing, and he could not help grinning too.
        - id: ch02-b09
          speaker: old_mother_nature
          text: "It would be a very good idea, Peter. And speaking of haymakers, there is another one in those same great mountains of the Far West."
        - id: ch02-b10
          speakers: [peter_rabbit, johnny_chuck, happy_jack]
          ensemble: chorus
          text: "Who is it?"
    - id: ch03
      title: Stubtail the Mountain Beaver
      blocks:
        - id: ch03-b01
          speaker: peter_rabbit
          text: "It must be Stubtail the Mountain Beaver. I suppose he's a cousin of Paddy the Beaver."
        - id: ch03-b02
          speaker: narrator
          text: Old Mother Nature shook her head.
        - id: ch03-b03
          speaker: old_mother_nature
          text: "No, Peter. Stubtail is no more closely related to Paddy than he is to any of you. He isn't a Beaver at all. His proper name is Sewellel. Some people call him Showt'l, others call him the Boomer or the Chehalis, but most know him as the Mountain Beaver."
        - id: ch03-b04
          speaker: striped_chipmunk
          text: "Do they call him that because he looks like Paddy?"
        - id: ch03-b05
          speaker: old_mother_nature
          text: "No. He looks much more like Jerry Muskrat. Stubtail is about Jerry's size, and you can imagine his appearance if you picture Jerry without a tail."
        - id: ch03-b06
          speaker: peter_rabbit
          text: "Doesn't Stubtail have any tail at all?"
        - id: ch03-b07
          speaker: old_mother_nature
          text: "He does have one, but it is only a tiny stub. You would think he had no tail when you looked at him. Stubtail lives in the same western mountains as Whistler and Little Chief. But he doesn't make his home high among the rocks. He lives down in the valleys, where the soil is soft and the trees grow thick."
        - id: ch03-b08
          speaker: old_mother_nature
          text: "Stubtail has no use for rocks. He wants soft, wet earth where he can dig tunnels to his heart's content. In one way, he is very much like Yap Yap the Prairie Dog."
        - id: ch03-b09
          speaker: johnny_chuck
          text: "What way is that?"
        - id: ch03-b10
          speaker: narrator
          text: Johnny asked quickly, because Yap Yap was one of his cousins.
        - id: ch03-b11
          speaker: old_mother_nature
          text: "They are alike in their social habits. Stubtail doesn't enjoy living alone. He wants neighbors of his own kind. So when you find one Stubtail, you will probably find many members of his family nearby. They enjoy visiting one another."
        - id: ch03-b12
          speaker: old_mother_nature
          text: "They make little paths between their homes and through the thick ferns. They keep each path open and clear so they can run along it easily. Some paths enter long tunnels that give them a safe way to travel. The ground is usually so wet that water runs along the bottoms of these small tunnels."
    - id: ch04
      title: Stubtail's Home and Storehouses
      blocks:
        - id: ch04-b01
          speaker: johnny_chuck
          text: "What sort of house does Stubtail live in?"
        - id: ch04-b02
          speaker: narrator
          text: Johnny was deeply interested now.
        - id: ch04-b03
          speaker: old_mother_nature
          text: "Why, a hole in the ground, of course. He digs his home where the earth is drier than it is along the runways. Mrs. Stubtail makes their nest from dried ferns. Close beside it, the two of them build two or three storehouses. Stubtail and Mrs. Stubtail are thrifty people."
        - id: ch04-b04
          speaker: happy_jack
          text: "Then I suppose he fills those storehouses with hay, since you called him a haymaker."
        - id: ch04-b05
          speaker: narrator
          text: Storehouses always caught Happy Jack's interest.
        - id: ch04-b06
          speaker: old_mother_nature
          text: "Yes, hay is one thing he puts in them. He cuts grass, ferns, pea vines, and other green plants. Then he carries them in small bundles to the entrance of his tunnel. He piles the plants on sticks to lift them above the wet ground and let the air dry them. Once they are dry, he takes them inside and stores them away."
        - id: ch04-b07
          speaker: old_mother_nature
          text: "Stubtail saves other foods as well. He likes fern roots. He cuts young, tender twigs from bushes and stores some of those, and he is fond of bark. He stays just as active in winter as in summer, tunneling beneath the snow. At times he shares Peter Rabbit's bad habit. He gnaws the bark from a tree all the way around, as high as he can reach, and that kills the tree."
        - id: ch04-b08
          speaker: chatterer
          text: "Can Stubtail climb trees?"
        - id: ch04-b09
          speaker: old_mother_nature
          text: "About as well as Johnny Chuck can. Now and then Stubtail climbs into a low bush or a small tree with low branches to cut tender shoots. He doesn't do that very often. His true home is on the ground."
        - id: ch04-b10
          speaker: old_mother_nature
          text: "Stubtail is busiest at night, though he may come out during the day when no one disturbs him. To cut a twig, he sits upright like a Squirrel. He holds the twig in his hands and bites it off with his sharp teeth."
        - id: ch04-b11
          speaker: peter_rabbit
          text: "You haven't told us the color of his coat."
        - id: ch04-b12
          speaker: old_mother_nature
          text: "Remember, I said he looks a great deal like Jerry Muskrat. His coat is brown, much like Jerry's, though Stubtail's fur is not nearly as soft or fine."
        - id: ch04-b13
          speaker: peter_rabbit
          text: "I suppose he has enemies, just as all the rest of us little people do."
        - id: ch04-b14
          speaker: old_mother_nature
          text: "Of course he does. Every little person has enemies, and most big people do as well. King Eagle is one of Stubtail's enemies, and Yowler the Bob Cat is another. Both are always watching for him. That is why Stubtail digs so many tunnels. Down there, he can travel safely under the ground."
        - id: ch04-b15
          speaker: old_mother_nature
          text: "My goodness, look how the time has flown! Scamper home now, all of you. I have far too much to do to talk any longer today."
