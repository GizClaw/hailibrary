  chapters:
    - id: ch01
      title: Teeny Weeny and His Cousin
      blocks:
        - id: ch01-b01
          speaker: happy_jack_squirrel
          text: "Of course Old Mother Nature knows. Still, I can hardly believe Teeny Weeny belongs to any family but the Mice. I've never had a really good look at him, but I've caught sight of him many times. I always took him for a little Mouse with a short tail. It's hard to think I was wrong."
        - id: ch01-b02
          speaker: narrator
          text: Happy Jack Squirrel was talking to Peter Rabbit as they scampered toward school.
        - id: ch01-b03
          speaker: peter_rabbit
          text: "I hope Old Mother Nature puts him where we can see him well. Maybe once you get a proper look, he won't seem so much like a Mouse."
        - id: ch01-b04
          speaker: narrator
          text: As soon as everyone arrived, Old Mother Nature began the morning lesson.
        - id: ch01-b05
          speaker: old_mother_nature
          text: "You have learned about all the families in the order called Rodents. Now we will begin another order, a much smaller one called Insectivora. Can any of you guess what that name means?"
        - id: ch01-b06
          speaker: peter_rabbit
          text: "It sounds as though it must be connected with insects."
        - id: ch01-b07
          speaker: narrator
          text: Old Mother Nature smiled at Peter.
        - id: ch01-b08
          speaker: old_mother_nature
          text: "That is a very good guess. It does concern insects. The animals in this order live mostly on insects and worms, and Insectivora means insect-eating. The order has two families, the Shrews and the Moles."
        - id: ch01-b09
          speaker: peter_rabbit
          text: "Then Teeny Weeny and Miner the Mole are relatives!"
        - id: ch01-b10
          speaker: old_mother_nature
          text: "Right again, Peter. Shrews and Moles are related in the same way that you and Happy Jack Squirrel are related."
        - id: ch01-b11
          speaker: happy_jack_squirrel
          text: "So Teeny Weeny the Shrew isn't related to the Mice at all?"
        - id: ch01-b12
          speaker: old_mother_nature
          text: "Not at all. Many people believe he is, and they often call him a Shrew Mouse. But that is a serious mistake, caused by not knowing the facts. I find it strange that people so often know so little about the neighbors living close to them."
        - id: ch01-b13
          speaker: narrator
          text: As she spoke, Old Mother Nature looked at Happy Jack. He looked sheepish, and that was exactly how he felt. Meanwhile, everyone kept searching in every direction for Teeny Weeny. Old Mother Nature had promised to try to bring him that morning, but he was nowhere in sight. Now and then, a leaf near her feet shifted. The Merry Little Breezes were always stirring fallen leaves, though, so no one noticed.
        - id: ch01-b14
          speaker: narrator
          text: Old Mother Nature saw the disappointment on every face, and her eyes began to twinkle.
        - id: ch01-b15
          speaker: old_mother_nature
          text: "Yesterday, I told you I would try to have Teeny Weeny here."
        - id: ch01-b16
          speaker: narrator
          text: A leaf moved. Old Mother Nature bent down quickly and picked it up.
        - id: ch01-b17
          speaker: old_mother_nature
          text: "And here he is."
        - id: ch01-b18
          speaker: narrator
          text: Sure enough, a tiny fellow stood where the dead brown leaf had been. He was so small that the leaf had hidden him completely, and it was not a large leaf. This was Teeny Weeny the Shrew, also known as the Common Shrew, the Long-tailed Shrew, and the Shrew Mouse. He was one of the smallest animals in the Great World. He tried to dart beneath another leaf, but Old Mother Nature stopped him.
        - id: ch01-b19
          speaker: old_mother_nature
          text: "Sit still. You have nothing to fear. I want everyone to see you properly. It is time these neighbors of yours knew you. I understand how nervous and uncomfortable you feel, and I will keep you for only a few minutes. Now, everyone, take a good look at Teeny Weeny."
        - id: ch01-b20
          speaker: narrator
          text: She hardly needed to tell them. Everyone was already staring as hard as possible. Teeny Weeny measured less than four inches from the end of his nose to the end of his tail, and his tail made up almost half that length. His body was slender. His legs were short, and his feet looked like a Mouse's. Fine, soft fur covered him, brownish above and grayish underneath.
        - id: ch01-b21
          speaker: narrator
          text: His head was the strangest part. It was long and pointed, ending in a long nose unlike any Mouse's. The rims of his ears showed above his fur. His eyes were so tiny that Peter thought he had none at all, and Peter said so.
        - id: ch01-b22
          speaker: old_mother_nature
          text: "Oh, he does have eyes, Peter. Look closely and you will find them. They are not much use, though. They do little more than tell daylight from darkness. Teeny Weeny relies mostly on his nose. It is a marvelous little nose, flexible and very sensitive. With such poor sight, he naturally prefers the dark, when fewer enemies are out."
        - id: ch01-b23
          speaker: narrator
          text: All the while, Teeny Weeny grew more and more uneasy. Old Mother Nature noticed and understood. At last, she told him he could go. Before she had quite finished speaking, he vanished beneath the dead leaves. Hidden under them, he hurried to an old log and was not seen again.
        - id: ch01-b24
          speaker: striped_chipmunk
          text: "Does he live on nothing except insects and worms?"
        - id: ch01-b25
          speaker: old_mother_nature
          text: "No. He likes flesh very much. If he finds the body of a bird or another animal that has been killed, he tears it apart. Like every member of his family, he has a very hot temper. He will even attack a Mouse much larger than he is."
        - id: ch01-b26
          speaker: old_mother_nature
          text: "Because he is so small and active, he needs a great amount of food. He probably eats his own weight each day. That means he must spend a great deal of time hunting, and he does."
        - id: ch01-b27
          speaker: old_mother_nature
          text: "Under fallen leaves, he makes tiny paths. In swampy ground, he makes little tunnels through the moss. He especially likes old rotting stumps, logs, and brush piles. Those places hold grubs and insects, and they hide him at the same time."
        - id: ch01-b28
          speaker: old_mother_nature
          text: "He is active both day and night, though by day he takes care to stay out of the light. He would rather live in a damp place than a dry one. In winter, he tunnels beneath the snow. In summer, whenever he can, he uses the tunnels and runways made by Meadow Mice and other animals. When he cannot find insects or flesh, he eats seeds and other plant food."
        - id: ch01-b29
          speaker: chatterer_the_red_squirrel
          text: "What enemies does he have?"
        - id: ch01-b30
          speaker: old_mother_nature
          text: "Plenty of them. Still, he is not hunted as much as the Mice are. He has a strong, unpleasant scent, so any hunter that cares about the taste of its food finds him a poor meal. Some Hawks and Owls do not seem to mind, and they are his worst enemies."
        - id: ch01-b31
          speaker: jumper_the_hare
          text: "Does he have any close relatives?"
        - id: ch01-b32
          speaker: old_mother_nature
          text: "Several. The best-known is Blarina the Short-tailed Shrew, who is also called the Mole Shrew. You can find him almost anywhere, in forests, old pastures, and along grassy banks. But he rarely goes far from water because he likes moist ground."
        - id: ch01-b33
          speaker: old_mother_nature
          text: "Blarina is much larger and thicker than Teeny Weeny, and his tail is shorter. People often mistake him for Miner the Mole. His thick, fine fur looks much like Miner's, and he tunnels just below the surface. But one look at his front feet would show the difference. Blarina's are small, like the feet of a Mouse. They are nothing like Miner's great shovels. Blarina is smaller than Miner too, and his tunnels usually run just under leaves and grass instead of through the earth."
        - id: ch01-b34
          speaker: old_mother_nature
          text: "He eats much the same things as Teeny Weeny. He takes worms and insects, flesh when he can get it, and seeds. He is especially fond of beechnuts. He can kill a Mouse as large as himself or even larger, and he will do it whenever he has the chance."
        - id: ch01-b35
          speaker: old_mother_nature
          text: "Blarina builds a soft, comfortable nest under a log, inside a stump, or underground. He has four to six babies at a time. Teeny Weeny sometimes has as many as ten. Blarina's hearing and sense of smell are very keen, making up for his poor sight. Like the eyes of other Shrews, his probably do little beyond telling light from darkness. His coat is a dark brownish gray."
        - id: ch01-b36
          speaker: old_mother_nature
          text: "The Marsh Shrew is another member of the family. He is also called the Water Shrew and the Black-and-white Shrew. He is longer than either of the others, and as you may have guessed, he loves the water. He swims well and finds much of his food there. He catches water Beetles and grubs, and perhaps Tadpoles and Minnows too. Now, which of you knows Miner the Mole?"
        - id: ch01-b37
          speaker: peter_rabbit
          text: "I do. Well, I have seen him."
        - id: ch01-b38
          speaker: old_mother_nature
          text: "Very well, Peter. Tomorrow morning, we will find out how much you know about Miner."
