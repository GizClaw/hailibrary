audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 亲切生动，带着温和的幽默感
        timbre: 温暖清亮
        pace: 舒缓而富有变化
        pitch: 中等
    peter_rabbit:
      display_name: 彼得兔
      tts:
        delivery: 好奇直率，情绪来得快也去得快
        timbre: 清脆稚气
        pace: 轻快
        pitch: 中高
    mother_nature:
      display_name: 老大自然妈妈
      tts:
        delivery: 慈爱睿智，说话从容而坦率
        timbre: 温厚柔和
        pace: 从容
        pitch: 中低
    striped_chipmunk:
      display_name: 花栗鼠条纹
      tts:
        delivery: 开朗谦和，机灵中带着几分自信
        timbre: 清亮柔和
        pace: 轻快
        pitch: 中高
    happy_jack:
      display_name: 灰松鼠快乐杰克
      tts:
        delivery: 自信好胜，受窘时有些急躁
        timbre: 明亮爽脆
        pace: 轻快
        pitch: 中高
    chatterer:
      display_name: 红松鼠喋喋
      tts:
        delivery: 伶牙俐齿，争强好胜又活泼
        timbre: 尖细清亮
        pace: 明快
        pitch: 高
    jumper_hare:
      display_name: 长耳野兔跳跳
      tts:
        delivery: 朴实腼腆，认真时透着好奇
        timbre: 清朗柔和
        pace: 稍缓
        pitch: 中等
  chapters:
    - id: ch01
      title: 小小到底是不是老鼠
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 灰松鼠快乐杰克和彼得兔蹦蹦跳跳地赶去上课。一路上，快乐杰克还在琢磨鼩鼱小小的身份。
        - id: ch01-b02
          speaker: happy_jack
          text: “老大自然妈妈当然不会说错。可我见过小小好多次，虽然一次也没看清，总觉得他就是一只短尾巴的小老鼠。要说他不是鼠科成员，我真不容易相信。”
        - id: ch01-b03
          speaker: peter_rabbit
          text: “希望老大自然妈妈能让我们仔细看看他。等你真正看清楚，也许就不觉得他那么像老鼠了。”
        - id: ch01-b04
          speaker: narrator
          text: 大家到齐以后，老大自然妈妈马上开始了早晨的课。
        - id: ch01-b05
          speaker: mother_nature
          text: “啮齿目里的各个科，我们已经讲完了。现在来认识另一个小得多的目，叫食虫目。你们谁能猜到这个名字是什么意思？”
        - id: ch01-b06
          speaker: peter_rabbit
          text: “听起来，它一定和昆虫有关。”
        - id: ch01-b07
          speaker: narrator
          text: 老大自然妈妈微笑着点了点头。
        - id: ch01-b08
          speaker: mother_nature
          text: “猜得很好，彼得。食虫目的确和昆虫有关。这一目的成员大多靠昆虫和蠕虫生活，这个名字说的正是吃昆虫。食虫目里有两个科，一个是鼩鼱科，另一个是鼹鼠科。”
        - id: ch01-b09
          speaker: peter_rabbit
          text: “这么说，小小和鼹鼠矿工是亲戚！”
        - id: ch01-b10
          speaker: mother_nature
          text: “又答对了。鼩鼱和鼹鼠之间的亲缘，就像你和快乐杰克之间的亲缘一样。”
        - id: ch01-b11
          speaker: happy_jack
          text: “那小小和老鼠真的一点儿亲缘也没有？”
        - id: ch01-b12
          speaker: mother_nature
          text: “一点儿也没有。许多人弄错了，还常把他叫作鼩鼠，那是因为不了解他。人们对近在身边的邻居，常常知道得少得出奇。”
        - id: ch01-b13
          speaker: narrator
          text: 老大自然妈妈说着，看了快乐杰克一眼。快乐杰克满脸羞惭，心里也正是这个滋味。老大自然妈妈昨天答应过，要尽量把小小请到今天的课堂上。大家一直东张西望，到处寻找，却怎么也找不到他。她脚边的落叶偶尔动一下，可快乐的小微风总在拨弄枯叶，谁也没有留意。
    - id: ch02
      title: 一片叶子下面
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 老大自然妈妈看出了大家的失望，眼睛里闪起笑意。
        - id: ch02-b02
          speaker: mother_nature
          text: “昨天我说过，今天会尽量把小小请来。”
        - id: ch02-b03
          speaker: narrator
          text: 一片叶子动了。她飞快地弯下腰，把叶子捡了起来。
        - id: ch02-b04
          speaker: mother_nature
          text: “瞧，他就在这里。”
        - id: ch02-b05
          speaker: narrator
          text: 刚才那片褐色枯叶下面，果然站着一个极小的小家伙。叶子并不算大，却把他遮得严严实实。他就是鼩鼱小小，也叫普通鼩鼱、长尾鼩鼱和鼩鼠，是大千世界里最小的动物之一。小小刚要飞快钻进另一片叶子底下，便被老大自然妈妈拦住了。
        - id: ch02-b06
          speaker: mother_nature
          text: “先别动。你不用害怕，我只想让这些邻居好好看看你。他们早该认识你了。我知道你又紧张又不自在，只留你几分钟。大家仔细看看小小吧。”
        - id: ch02-b07
          speaker: narrator
          text: 其实，她根本不必吩咐，大家早已使劲盯着小小，目不转睛。从鼻尖到尾巴尖，他还不到四英寸长，单是尾巴就占了将近一半。他身体纤细，腿很短，四只脚很像老鼠。背上的外套略带褐色，腹部是灰色，毛发又细又软。
        - id: ch02-b08
          speaker: narrator
          text: 小小身上最奇特的，是那颗又长又尖的脑袋，末端还连着一只长鼻子。没有哪一种老鼠长着这样的头。他的耳朵边缘能从毛上面看见，眼睛却小得可怜。彼得看了半天，以为小小根本没有眼睛，还当场把自己的想法说了出来。
        - id: ch02-b09
          speaker: narrator
          text: 老大自然妈妈笑了。
        - id: ch02-b10
          speaker: mother_nature
          text: “小小当然有眼睛。你仔细看就能瞧见，只是那双眼睛用处不大，顶多能分清白天和黑夜。他主要依靠鼻子。那只小鼻子非常灵活，也非常敏锐。眼睛这样差，他自然更喜欢黑暗，因为夜里出来活动的敌人少一些。”
        - id: ch02-b11
          speaker: narrator
          text: 大家观察的时候，小小变得越来越不安。老大自然妈妈看在眼里，也明白他的感受，便告诉他可以走了。她的话音还没落，小小已经飞快钻进几片枯叶下面，一眨眼便不见了。他借着落叶藏住身体，一路跑到一根老木头旁，此后再也没人看见他。
    - id: ch03
      title: 忙个不停的小猎手
      blocks:
        - id: ch03-b01
          speaker: striped_chipmunk
          text: “难道他只吃昆虫和蠕虫吗？”
        - id: ch03-b02
          speaker: mother_nature
          text: “当然不是。他很爱吃肉。要是发现一只被杀死的鸟或其他动物，他会把尸体撕成碎块。他和全家族一样脾气暴躁，遇见比自己大得多的老鼠，也会毫不犹豫地扑上去。”
        - id: ch03-b03
          speaker: mother_nature
          text: “小小个头很小，却一刻不停地活动，所以要吃许多东西。他每天吃掉的食物，大概和自己一样重。这么大的食量，自然得靠不停地捕猎才能填饱。”
        - id: ch03-b04
          speaker: mother_nature
          text: “他在落叶下面踩出细细的小路，也会在沼泽地的苔藓中钻出小隧道。他最喜欢腐烂的老树桩、倒木和柴堆。那些地方既能找到蛴螬和昆虫，又能让他把自己藏得很好。”
        - id: ch03-b05
          speaker: mother_nature
          text: “他白天黑夜都很活跃，白天却会格外小心，总是避开亮处。他喜欢潮湿的地方，不喜欢干燥之地。冬天，他在积雪下面钻来钻去。到了夏天，只要能找到草地田鼠或别的动物留下的地道和跑道，他就拿来使用。实在找不到昆虫和肉时，他也会吃种子和其他植物性食物。”
        - id: ch03-b06
          speaker: chatterer
          text: “那么，哪些动物是他的敌人？”
        - id: ch03-b07
          speaker: mother_nature
          text: “他的敌人不少，不过，他不像鼠科成员那样常遭到追捕。小小身上带着一股浓烈难闻的气味，凡是对食物稍微挑剔一点儿的，都不愿拿他当饭吃。有些鹰和猫头鹰似乎不介意这股气味，他们就是小小最可怕的敌人。”
    - id: ch04
      title: 小小的短尾表亲
      blocks:
        - id: ch04-b01
          speaker: jumper_hare
          text: “小小还有近亲吗？”
        - id: ch04-b02
          speaker: mother_nature
          text: “有好几位。最为人熟知的是短尾鼩鼱布拉里纳，也叫鼩鼹。森林、荒废的老牧场和长满青草的河岸，到处都能找到他。不过，他很少离开水边，最喜欢潮湿的地面。”
        - id: ch04-b03
          speaker: mother_nature
          text: “布拉里纳比小小大得多，也粗壮得多，尾巴却比较短。他的毛厚实细密，很像鼹鼠矿工的毛，又爱在贴近地面的地方钻隧道，所以常被误认成矿工。”
        - id: ch04-b04
          speaker: mother_nature
          text: “只要看看前脚，就不会认错。布拉里纳的前脚很小，像鼠科成员的脚，和矿工那对大铲子完全不同。他的个头也比矿工小，隧道很少挖进泥土，通常只藏在落叶和青草下面。”
        - id: ch04-b05
          speaker: mother_nature
          text: “他吃的东西和小小差不多，有蠕虫、昆虫、能找到的肉和种子。他尤其喜欢山毛榉坚果。碰上机会，他敢杀死和自己一样大、甚至更大的老鼠。”
        - id: ch04-b06
          speaker: mother_nature
          text: “他会在倒木下面、树桩里或泥土中做一个柔软舒服的窝，一胎生四到六个宝宝。小小有时一胎能生十个。他的嗅觉和听觉都十分敏锐，正好弥补视力的不足。他的眼睛和其他鼩鼱的一样，大概只能分辨光明和黑暗。他的外套是深棕灰色的。”
    - id: ch05
      title: 爱游水的鼩鼱
      blocks:
        - id: ch05-b01
          speaker: mother_nature
          text: “鼩鼱家族里还有沼泽鼩鼱，也叫水鼩鼱和黑白鼩鼱。他比前面两位都长。你们大概已经猜到了，他最喜欢水。”
        - id: ch05-b02
          speaker: mother_nature
          text: “他是个游泳好手，许多食物都是从水里找来的，比如水生甲虫和蛴螬，也可能有蝌蚪和小鱼。现在，你们当中有谁认识鼹鼠矿工？”
        - id: ch05-b03
          speaker: peter_rabbit
          text: “我认识。嗯，准确地说，我见过他。”
        - id: ch05-b04
          speaker: mother_nature
          text: “很好，彼得。明天早晨，我们就来看看你对矿工到底知道多少。”
