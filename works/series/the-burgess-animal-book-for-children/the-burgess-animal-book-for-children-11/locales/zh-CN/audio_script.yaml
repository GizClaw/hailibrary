audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 亲切生动，带着温和的幽默感
        timbre: 温暖清亮
        pace: 舒缓而富有变化
        pitch: 中等
    peter_rabbit:
      display_name: 彼得兔
      tts:
        delivery: 好奇直率，情绪来得快也去得快
        timbre: 清脆稚气
        pace: 轻快
        pitch: 中高
    mother_nature:
      display_name: 老大自然妈妈
      tts:
        delivery: 慈爱睿智，说话从容而坦率
        timbre: 温厚柔和
        pace: 从容
        pitch: 中低
    happy_jack:
      display_name: 灰松鼠快乐杰克
      tts:
        delivery: 自信好胜，受窘时有些急躁
        timbre: 明亮爽脆
        pace: 轻快
        pitch: 中高
    striped_chipmunk:
      display_name: 花栗鼠条纹
      tts:
        delivery: 开朗谦和，机灵中带着几分自信
        timbre: 清亮柔和
        pace: 轻快
        pitch: 中高
    prickly_porky:
      display_name: 豪猪刺刺
      tts:
        delivery: 脾气暴躁，爱抱怨，说话总带着不耐烦
        timbre: 粗哑厚重
        pace: 缓慢
        pitch: 低
    chatterer:
      display_name: 红松鼠喋喋
      tts:
        delivery: 伶牙俐齿，争强好胜又活泼
        timbre: 尖细清亮
        pace: 明快
        pitch: 高
    johnny_chuck:
      display_name: 土拨鼠约翰尼
      tts:
        delivery: 直率倔强，懒洋洋中带着粗朴的自信
        timbre: 浑厚结实
        pace: 稍缓
        pitch: 中低
    jumper_hare:
      display_name: 长耳野兔跳跳
      tts:
        delivery: 朴实腼腆，认真时透着好奇
        timbre: 清朗柔和
        pace: 稍缓
        pitch: 中等
  chapters:
    - id: ch01
      title: 第十一章　身披千根尖矛的家伙
      blocks:
        - id: ch01-b01
          speaker: mother_nature
          text: “你们瞧刺刺。他在你们这一目里，个头排在第二位。你们是哪一目呀？”
        - id: ch01-b02
          speaker: striped_chipmunk
          text: “我们属于啮齿目！”
        - id: ch01-b03
          speaker: mother_nature
          text: “他不光个头排第二，人们还说他是这一目里最笨的。不过依我看，他并不总像表面上那么笨。至少，他总能吃饱，也能躲开敌人。有些号称脑筋灵活的家伙，还不一定做得到呢。”
        - id: ch01-b04
          speaker: narrator
          text: 喋喋凑近表兄快乐杰克，压低声音说起了悄悄话。
        - id: ch01-b05
          speaker: chatterer
          text: “他能逃过敌人，有什么了不起？敌人见了他，都巴不得绕着走。他根本谁也不用怕。”
        - id: ch01-b06
          speaker: narrator
          text: 可老大自然妈妈耳朵灵得很，这话被她听得清清楚楚。
        - id: ch01-b07
          speaker: mother_nature
          text: “你真的肯定吗？比如说，渔貂佩坎——”
        - id: ch01-b08
          speaker: narrator
          text: 她的话还没说完，老树桩上突然响起一阵猛烈的沙沙声。大家回头一看，刺刺正在拼命往下倒退。他已经用上最快的速度了，可还是慢得出奇。身上那上千根小尖矛，倒是随着他的动作响个不停。
        - id: ch01-b09
          speaker: narrator
          text: 那场面实在太好笑了。谁都看得出刺刺急得要命，可他的每一下动作依旧又慢又笨。伙伴们全笑了，就连老大自然妈妈也笑出了声。
        - id: ch01-b10
          speaker: mother_nature
          text: “刺刺，你这是怎么啦？要到哪里去？”
        - id: ch01-b11
          speaker: narrator
          text: 刺刺转过那双无神的眼睛。此刻，他眼里满是焦虑，连声音都微微发颤。
        - id: ch01-b12
          speaker: prickly_porky
          text: “渔貂佩坎在哪儿？”
          emotion: fearful
        - id: ch01-b13
          speaker: narrator
          text: 老大自然妈妈一下就明白了。她才说到渔貂佩坎的名字，刺刺就没敢再听下去，还以为佩坎正躲在附近。
        - id: ch01-b14
          speaker: mother_nature
          text: “没事，刺刺。佩坎根本不在这一带。你爬回树桩上去，不用担心。要是肯等我把话说完，你也不会白白受这一场惊吓。”
          emotion: calm
        - id: ch01-b15
          speaker: mother_nature
          text: “喋喋刚才说，你谁也不用怕。我正想告诉他，这话说错了。即使你身上有上千根小尖矛，渔貂佩坎还是值得你害怕。”
        - id: ch01-b16
          speaker: narrator
          text: 刺刺打了个寒战，外套里的小尖矛立刻沙沙直响。刺刺居然真的会害怕，伙伴们看得几乎不敢相信自己的眼睛。
        - id: ch01-b17
          speaker: prickly_porky
          text: “您真的肯定，佩坎不在附近吗？”
          emotion: fearful
        - id: ch01-b18
          speaker: mother_nature
          text: “我非常肯定。即便他在，我也不会让他伤到你。这一点你应该明白。现在坐好，让大家仔细看看你。”
          emotion: calm
        - id: ch01-b19
          speaker: narrator
          text: 刺刺坐直了身子，伙伴们围到树桩下面，从各个方向打量他。
        - id: ch01-b20
          speaker: happy_jack
          text: “他长得可真不好看。”
        - id: ch01-b21
          speaker: narrator
          text: 快乐杰克一点儿也没说错。刺刺不但不漂亮，还是整座绿森林里最难看、最显笨拙的家伙。他比浣熊博比稍大一点儿，身子又粗又壮，看上去沉甸甸的，背脊像拱桥一样高高隆起。
        - id: ch01-b22
          speaker: narrator
          text: 他的脑袋和身体相比很小，又短又圆，脖子比脑袋还短。两只眼睛小而无神，远处的东西看不见，近处的也得凑到眼前才能看清。小耳朵几乎全埋在毛里。
        - id: ch01-b23
          speaker: narrator
          text: 他那对用来啃东西的门牙又大又亮，颜色橙黄，一眼就能看出他是啮齿目动物。四条腿短而粗壮，每只前脚有四根脚趾，后脚则各有五根。每根脚趾上，都带着颇长又结实的爪子。
        - id: ch01-b24
          speaker: narrator
          text: 不过，刺刺最古怪、最有意思的地方，还是他的外套。绿森林里没有谁穿着跟他一样的外套。其他小伙伴大多有一层柔软的短绒毛，外面再长着一层较长、较粗的毛，把绒毛遮住。
        - id: ch01-b25
          speaker: narrator
          text: 刺刺也长着粗硬的长毛，背上的尤其长。从毛根直到接近末端，都是棕黑色，只有毛尖发白。长毛底下，也藏着一点儿柔软的绒毛。可它们遮得最多的，是一排排吓人的硬刺，也就是那些小尖矛。
        - id: ch01-b26
          speaker: narrator
          text: 硬刺大部分是白色，末端颜色很深，尖得吓人。刺的两侧，还有几乎看不见的细小倒钩。头上的刺大约一英寸长，背上的能长到四英寸。越靠近尾巴，硬刺就越短。他的尾巴不长，却很粗，上面也布满短刺。
        - id: ch01-b27
          speaker: narrator
          text: 刺刺坐在树桩上，几根小尖矛从背上的长毛间探了出来，看上去倒不怎么危险。彼得突然发现了一件事。
        - id: ch01-b28
          speaker: peter_rabbit
          text: “咦！他的肚子底下没有小尖矛！”
          emotion: surprised
        - id: ch01-b29
          speaker: mother_nature
          text: “我正等着看谁会第一个发现呢。没错，刺刺的身体下面没有小尖矛。渔貂佩坎已经知道了这个秘密。只要把刺刺掀翻，让他肚皮朝上，佩坎就能避开那些尖刺，不冒多大危险便杀死他。而且，佩坎已经学会了怎么把他掀翻。”
        - id: ch01-b30
          speaker: mother_nature
          text: “所以，刺刺才会这么怕他。好了，刺刺，从树桩上下来，给伙伴们看看敌人靠近时，你会怎么办。”
        - id: ch01-b31
          speaker: narrator
          text: 刺刺一面嘟囔，一面低吼，慢吞吞爬到地上。他把脑袋缩进两只前爪中间。转眼间，上千根小尖矛全竖了起来，朝四面八方伸出去。他看起来就像一颗巨大的栗子刺球。接着，那条粗尾巴开始左右猛扫。
        - id: ch01-b32
          speaker: johnny_chuck
          text: “他干吗这样甩尾巴？”
        - id: ch01-b33
          speaker: narrator
          text: 约翰尼满脸不解。老大自然妈妈却冷冷地回答他。
        - id: ch01-b34
          speaker: mother_nature
          text: “你再靠近一点儿，让尾巴抽中一次，不就明白了吗？那条尾巴是他唯一的武器。谁挨上一下，身上便会扎满小尖矛，以后再也不敢接近刺刺。”
        - id: ch01-b35
          speaker: mother_nature
          text: “小尖矛一旦进了皮肉，就会越钻越深。已经不止一个敌人因此丧了命。刺上的倒钩太小，拔起来却非常困难，而且会疼得厉害。你们谁想知道是什么滋味，尽管试一根。”
        - id: ch01-b36
          speaker: narrator
          text: 可谁也不想试。老大自然妈妈只等了一小会儿，便继续讲下去。
        - id: ch01-b37
          speaker: mother_nature
          text: “你们看，他甩尾巴的速度很快。这是他身上唯一灵活的地方。遇到危险时，只要来得及，他更愿意把脑袋伸到圆木或石头下面，不会像现在这样夹在两爪之间。接着，他用四只脚牢牢撑住地面，只等机会挥动尾巴。”
        - id: ch01-b38
          speaker: peter_rabbit
          text: “听说他能把小尖矛射向别人，这是真的吗？”
        - id: ch01-b39
          speaker: narrator
          text: 老大自然妈妈摇了摇头。
        - id: ch01-b40
          speaker: mother_nature
          text: “这话一点儿也不是真的。大概有谁挨过他的尾巴，却没看清尾巴动得有多快，就以为那些小尖矛是射过来的。这个传言多半就是这么来的。”
        - id: ch01-b41
          speaker: jumper_hare
          text: “可是，他怎么能让那么多小尖矛一起竖起来呢？”
        - id: ch01-b42
          speaker: mother_nature
          text: “他有一组特别的肌肉，专门用来竖起硬刺。”
        - id: ch01-b43
          speaker: striped_chipmunk
          text: “硬刺扎进别人身上，就得从刺刺自己的皮肤里拔出来。那不会把他弄疼吗？”
        - id: ch01-b44
          speaker: mother_nature
          text: “完全不会。那些硬刺在他的皮肤里长得很松，轻轻一扯就掉了。掉下多少，之后就会长出多少新刺补上。”
        - id: ch01-b45
          speaker: mother_nature
          text: “再看看他的脚。刺刺走路时，会把整个脚掌平放在地上。熊巴斯特和浣熊博比也是这样，那些名叫人类的两脚生物同样如此。很少有动物这么走路，我们把它们叫作跖行动物。”
        - id: ch01-b46
          speaker: mother_nature
          text: “好了，刺刺。你再告诉大家，自己吃什么，又住在什么地方，今天的课就可以结束了。”
        - id: ch01-b47
          speaker: prickly_porky
          text: “我主要吃树皮、嫩枝和叶子。我最喜欢铁杉，不过也吃白杨、松树和别的树，偶尔换换口味。有时我会在一棵树上待好几天，直到树皮和叶子全被吃光。我可不觉得四处走动有什么意思，能不动就不动。”
        - id: ch01-b48
          speaker: peter_rabbit
          text: “可那棵树会死的！”
          emotion: surprised
        - id: ch01-b49
          speaker: prickly_porky
          text: “死了又怎么样？树多得很。夏天我也喜欢睡莲叶，只要找得到，我就一定吃。”
          emotion: angry
        - id: ch01-b50
          speaker: peter_rabbit
          text: “你还会游泳吗？”
        - id: ch01-b51
          speaker: prickly_porky
          text: “当然会。”
        - id: ch01-b52
          speaker: peter_rabbit
          text: “可是我从没在绿草地上见过你。”
        - id: ch01-b53
          speaker: prickly_porky
          text: “你以后也不会见到。我只喜欢绿森林。夏天也好，冬天也好，我都待在那里。”
        - id: ch01-b54
          speaker: johnny_chuck
          text: “寒冷的冬天里，你不像熊巴斯特和我一样，一直睡觉吗？”
        - id: ch01-b55
          speaker: prickly_porky
          text: “我为什么要睡？冷天又不妨碍我，我还挺喜欢呢。那时候，整座绿森林差不多都归我一个。我就喜欢独处。只要树还在，吃的就多得很。白天我常睡觉，那是因为我更喜欢夜里活动。”
        - id: ch01-b56
          speaker: happy_jack
          text: “那你住的家呢？”
        - id: ch01-b57
          speaker: prickly_porky
          text: “大多数时候，我走到哪里，哪里就是家。不过，刺刺太太有自己的住所。那可能是一段中空的圆木，也可能是洞穴，或者一棵树的根底下。小宝宝会在那里出生。我想，我没别的可说了。”
        - id: ch01-b58
          speaker: mother_nature
          text: “你还漏了几件事。那些宝宝跟母亲的身形相比，生下来就很大，而且刚出生时，身上的硬刺已经一根不少。你也没说自己有多么爱吃盐，更没说这个嗜好常常让你在人类的营地附近惹上麻烦。”
        - id: ch01-b59
          speaker: mother_nature
          text: “至于你有多怕渔貂佩坎，我们刚才全看见了。美洲狮彪马有时也得提防。熊巴斯特饿极了，也会冒险把你掀翻。”
        - id: ch01-b60
          speaker: mother_nature
          text: “还有，你们谁也别把刺刺叫成刺猬。他根本不是刺猬。有人叫他刺毛猪，不过最合适的名字还是豪猪。他没有关系亲近的同类。”
        - id: ch01-b61
          speaker: mother_nature
          text: “明天早晨，我们不在这里见了。学校要搬到海狸帕迪筑起的池塘岸边。今天放学。”
