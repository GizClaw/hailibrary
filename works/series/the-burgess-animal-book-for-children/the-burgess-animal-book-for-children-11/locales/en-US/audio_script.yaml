  chapters:
    - id: ch01
      title: A Fellow With a Thousand Spears
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Old Mother Nature pointed to Prickly Porky the Porcupine.
        - id: ch01-b02
          speaker: old_mother_nature
          text: "There stands the next-to-largest member of your order. And what order is that?"
        - id: ch01-b03
          speaker: striped_chipmunk
          text: "The order of Rodents!"
        - id: ch01-b04
          speaker: old_mother_nature
          text: "He is not only next to the largest. He is also supposed to be the stupidest. At least, that is what people say. I don't believe he is quite as stupid as he may look. After all, he finds plenty to eat and manages to escape his enemies. Some animals that are supposed to have much quicker wits cannot do as well."
        - id: ch01-b05
          speaker: chatterer_the_red_squirrel
          text: "Keeping away from enemies is easy for him. They're happy to stay out of his way. He doesn't need to be afraid of anyone."
        - id: ch01-b06
          speaker: narrator
          text: Chatterer had spoken quietly to his cousin Happy Jack, but Old Mother Nature's sharp ears caught every word.
        - id: ch01-b07
          speaker: old_mother_nature
          text: "Are you certain of that? Think about Pekan the Fisher—"
        - id: ch01-b08
          speaker: narrator
          text: Before she could finish, a loud rattling came from the old stump and everyone turned to look. Prickly Porky was backing down as fast as he could go. That was not fast at all. His thousand little spears rattled with every slow, clumsy movement. He was plainly in a great hurry, but his body would not hurry with him. The sight was so funny that everyone laughed. Even Old Mother Nature joined in.
        - id: ch01-b09
          speaker: old_mother_nature
          text: "Prickly Porky, what are you doing? Where are you going?"
        - id: ch01-b10
          speaker: narrator
          text: Prickly Porky turned his dull-looking eyes toward her. They were full of worry.
        - id: ch01-b11
          speaker: prickly_porky
          text: "Where is Pekan the Fisher?"
          emotion: fearful
        - id: ch01-b12
          speaker: narrator
          text: His voice trembled. Old Mother Nature understood at once. He had heard Pekan's name and had not waited for the rest. He thought Pekan must be somewhere nearby.
        - id: ch01-b13
          speaker: old_mother_nature
          text: "You're safe, Prickly Porky. Pekan is nowhere around. Climb back onto the stump and stop worrying. If you had let me finish, you wouldn't have frightened yourself. Chatterer said you had no one to fear. I was about to tell him that even with your thousand little spears, you have good reason to fear Pekan."
          emotion: calm
        - id: ch01-b14
          speaker: narrator
          text: Prickly Porky shivered, and all those little spears rattled. The others could hardly believe their eyes. They had never expected to see him afraid.
        - id: ch01-b15
          speaker: prickly_porky
          text: "Are you completely sure Pekan isn't nearby?"
          emotion: fearful
        - id: ch01-b16
          speaker: old_mother_nature
          text: "Completely sure. If he were here, I would never let him hurt you. You should know that. Now sit up and let everyone look at you."
          emotion: calm
        - id: ch01-b17
          speaker: narrator
          text: Prickly Porky sat up. The others gathered at the foot of the stump and studied him.
        - id: ch01-b18
          speaker: happy_jack_squirrel
          text: "Well, he certainly isn't handsome."
        - id: ch01-b19
          speaker: narrator
          text: Happy Jack was right. Prickly Porky was far from handsome. In fact, he was the homeliest, clumsiest-looking fellow in the whole Green Forest. He was a little bigger than Bobby Coon, with a thick, heavy-looking body. His back curved upward like an arch. His head was short and fairly round, and it seemed small beside the rest of him. His neck was shorter still. His little eyes looked dull. He could not see far, and even nearby things were unclear unless he brought them close. His ears were small too, and nearly hidden in his hair.
        - id: ch01-b20
          speaker: narrator
          text: His front teeth were very large and bright orange. Those were the gnawing teeth that showed he belonged among the Rodents. His legs were short and stout. Each front foot had four toes, while each hind foot had five. Every foot was armed with rather long, strong claws.
        - id: ch01-b21
          speaker: narrator
          text: But his coat was the strangest and most interesting thing about him. No other little person in the Green Forest had anything like it. Most of them wear soft, short fur underneath a layer of longer, coarser hair. That outer layer gives the soft fur some protection and partly hides it. Prickly Porky had coarse outer hair too. Across his back it grew very long. It was brownish black all the way to the ends, where each hair turned white. Some soft, woolly fur lay beneath. But what the long hair mainly hid was a whole array of fierce-looking little spears called quills.
        - id: ch01-b22
          speaker: narrator
          text: Each quill was white until its dark, needle-sharp tip. Tiny barbs ran all down its sides. They were so small that you could hardly see them, but they were there just the same. The quills on his head measured about an inch. Those on his back reached four inches, then grew shorter and shorter toward his tail. The tail itself was short and stout, and it was covered with short quills of its own.
        - id: ch01-b23
          speaker: narrator
          text: As Prickly Porky sat on the stump, a few quills peeked through the long hair on his back. They did not look especially dangerous. Then Peter Rabbit noticed something.
        - id: ch01-b24
          speaker: peter_rabbit
          text: "Why, there aren't any little spears underneath him!"
          emotion: surprised
        - id: ch01-b25
          speaker: old_mother_nature
          text: "I was wondering who would see that first. No, he has no little spears underneath, and Pekan has discovered that weak spot. Pekan knows that if he can turn Prickly Porky onto his back, he can kill him without much danger from the quills. He has even learned how to turn him over. That is why Prickly Porky fears him. Now climb down from the stump, Prickly Porky, and show everyone what you do when an enemy comes near."
        - id: ch01-b26
          speaker: narrator
          text: Prickly Porky grumbled and growled as he climbed down from the stump and reached the ground. He tucked his head between his front paws. At once, his thousand little spears rose all over him and pointed in every direction. With every quill standing out, he looked like a giant chestnut burr. Then he began to thrash his tail from side to side.
        - id: ch01-b27
          speaker: johnny_chuck
          text: "Why is he swinging his tail like that?"
        - id: ch01-b28
          speaker: narrator
          text: Johnny looked puzzled.
        - id: ch01-b29
          speaker: old_mother_nature
          text: "Go close enough for that tail to hit you, and you'll soon understand. It is his one weapon. Anyone struck by that tail will be filled with quills and will take care never to approach Prickly Porky again. Once those quills enter the skin, they keep working deeper and deeper. More than one of his enemies has died because of them. The tiny barbs make the quills very hard to pull out, and pulling them out hurts dreadfully. You could try one and find out for yourself."
        - id: ch01-b30
          speaker: narrator
          text: No one wanted to try. Old Mother Nature waited only a moment before she went on.
        - id: ch01-b31
          speaker: old_mother_nature
          text: "Watch how quickly he can move that tail. It is the only quick thing about him. When danger comes and he has enough time, he prefers to get his head safely beneath a log or a rock. He would rather do that than tuck it between his paws as he is doing now. Then he plants all four feet firmly on the ground and waits for his chance to use that tail."
        - id: ch01-b32
          speaker: peter_rabbit
          text: "Can he really throw those little spears at people?"
        - id: ch01-b33
          speaker: narrator
          text: Old Mother Nature shook her head.
        - id: ch01-b34
          speaker: old_mother_nature
          text: "Not at all. That tale probably began when someone was struck by his tail. The blow came so quickly that the victim never saw the tail move and imagined the quills had been thrown."
        - id: ch01-b35
          speaker: jumper_the_hare
          text: "How does he raise all those little spears?"
        - id: ch01-b36
          speaker: old_mother_nature
          text: "He has a special set of muscles that does it."
        - id: ch01-b37
          speaker: striped_chipmunk
          text: "When the quills stick into someone, they must pull loose from Prickly Porky's skin. Wouldn't that hurt him?"
        - id: ch01-b38
          speaker: old_mother_nature
          text: "It doesn't hurt him at all. The quills are held very loosely in his skin and come free with the slightest pull. Whenever he loses some, new quills grow to replace them. Now take a look at his feet. He puts each whole foot flat on the ground. Buster Bear and Bobby Coon walk the same way, and so do those two-legged creatures called human beings. Very few animals place their feet like that. Animals that do are called plantigrade."
        - id: ch01-b39
          speaker: old_mother_nature
          text: "Prickly Porky, tell everyone what you eat and where you live. Then we will end today's lesson."
        - id: ch01-b40
          speaker: prickly_porky
          text: "I mostly eat bark, twigs, and leaves. Hemlock is my favorite, though I eat poplar, pine, and other trees for a change. Sometimes I stay in one tree for days, until every bit of bark and every leaf is gone. I see no reason to move more than I have to."
        - id: ch01-b41
          speaker: peter_rabbit
          text: "But wouldn't that kill the tree?"
          emotion: surprised
        - id: ch01-b42
          speaker: prickly_porky
          text: "So what if it does? There are plenty of trees. In summer I like lily pads, and I get them whenever I can."
          emotion: angry
        - id: ch01-b43
          speaker: peter_rabbit
          text: "You can swim?"
        - id: ch01-b44
          speaker: prickly_porky
          text: "Of course I can."
        - id: ch01-b45
          speaker: peter_rabbit
          text: "I've never seen you on the Green Meadows."
        - id: ch01-b46
          speaker: prickly_porky
          text: "And you never will. I'll take the Green Forest every time. I live there in summer and winter."
        - id: ch01-b47
          speaker: johnny_chuck
          text: "Don't you sleep through the cold season the way Buster Bear and I do?"
        - id: ch01-b48
          speaker: prickly_porky
          text: "Why would I sleep through it? Cold weather doesn't trouble me. I like it. Then I have most of the Green Forest to myself. I would rather be alone, and while trees are standing, food is everywhere. I sleep a lot during the day because nighttime suits me best."
        - id: ch01-b49
          speaker: happy_jack_squirrel
          text: "Where is your home?"
        - id: ch01-b50
          speaker: prickly_porky
          text: "Most of the time, home is wherever I happen to be. But Mrs. Porky keeps a home in a hollow log, in a cave, or beneath a tree's roots. That is where the babies are born. I think that's all I have to say."
        - id: ch01-b51
          speaker: old_mother_nature
          text: "You could add that those babies are large compared with the size of their mother. They are born with a full supply of quills too. And you forgot to mention how fond you are of salt. That fondness often gets you into trouble around the camps of human beings. We all saw your fear of Pekan the Fisher. I might add that Puma the Panther can be dangerous to you at times. Even Buster Bear may take the chance of turning you onto your back when he is very hungry."
        - id: ch01-b52
          speaker: old_mother_nature
          text: "And by the way, none of you should ever call Prickly Porky a Hedgehog. He is nothing of the sort. Some people call him a Quill Pig, but his real name, Porcupine, is the best one. He has no close relatives. Tomorrow morning, instead of meeting here, we will hold school on the shore of the pond Paddy the Beaver made. That is where you should come. For today, school is dismissed."
