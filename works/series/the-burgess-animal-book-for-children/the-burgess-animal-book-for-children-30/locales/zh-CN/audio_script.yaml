audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 亲切生动，带着温和的幽默感
        timbre: 温暖清亮
        pace: 舒缓而富有变化
        pitch: 中等
    mother_nature:
      display_name: 老大自然妈妈
      tts:
        delivery: 慈爱睿智，说话从容而坦率
        timbre: 温厚柔和
        pace: 从容
        pitch: 中低
  chapters:
    - id: ch01
      title: 第三十章　大大小小的猫科表亲
      blocks:
        - id: ch01-b01
          speaker: mother_nature
          text: “美洲狮大山猫，是这片国土上最大的猫科成员。只有西南尽头的一种猫比他更大。人们也叫他山狮、库狮和画家猫。你们想想黑猫咪的模样。假如她能长到八英尺多长，换上一件黄褐色、肚皮发白的外衣，看起来就很像美洲狮了。嚎嚎和蓬蓬的尾巴都很短，美洲狮却拖着一条长长的圆尾巴，跟黑猫咪的一样。他身躯庞大，力气也大，动作还是那么优雅敏捷，处处都像一只真正的猫。以前，美洲狮住在东部。这片国土上只要有森林，几乎都能找到他。后来人类到各处定居，把他赶走了。如今，他主要生活在遥远西部的大山里。”
        - id: ch01-b02
          speaker: mother_nature
          text: “这么大的猫，需要的食物当然不少。小动物和鸟儿可填不饱他，他捕猎的是大动物。美洲狮又大又强，杀死白尾鹿轻蹄并不费力，轻蹄最怕的就是他。他还特别爱吃马肉。有些地方放牧着成群的马，美洲狮杀了许多小马，人类从此恨透了他。”
        - id: ch01-b03
          speaker: mother_nature
          text: “别看美洲狮个头大，他其实很胆小，狗一叫就能把他吓跑。他饿得实在受不了时，也曾袭击人，可这样的事非常少。他怕人，一有人走近，马上会偷偷溜开。他的脚步像别的猫一样轻柔，身躯那么大，走起来却一点儿声音也没有。他住在高山的岩架间，通常夜里出去捕猎，白天出动的时候很少。有时，他会卧在高高的岩架上晒太阳。他很会爬树，却从不大大方方地露面，只会悄悄穿过森林和岩石，因此又有了鬼祟猫这个名字。他有时一点点逼近猎物，到了能扑中的地方才猛然跃起。有时，他守在动物常走的小路旁边。他能跃出很远，扑落时再借上全身的重量，就连比他大得多的动物，也几乎一定会被撞倒。”
        - id: ch01-b04
          speaker: mother_nature
          text: “人们猎杀美洲狮时会带上狗。狗一叫，他便转身逃跑，而且通常跑不了多远就爬到树上。猎人追到那里，再开枪打死他。要不是能用狗追他，美洲狮根本不用怎么怕人。他看得清，听得远，行动又快又安静，人很难趁他不留神时靠近。有时，他会像猞猁蓬蓬一样跟着一个人走，通常也只是因为好奇。美洲狮虽然鬼鬼祟祟又胆小，样子却高大凶猛，大多数人见了都会害怕。只有真正了解他的人才不怕。”
        - id: ch01-b05
          speaker: mother_nature
          text: “在这片国土上，比美洲狮更大的猫科成员只有美洲豹，人们也叫他埃尔蒂格雷。他只住在西南尽头的一小片地方，真正的家园还在更南面的炎热国度。他不但是这里最大的猫，也是最漂亮的猫。那身深黄色外衣上，铺满黑色斑点和玫瑰花纹。肚皮是白色的，带着大块黑斑，尾巴也相当长。他没有美洲狮那么修长，身躯却更加粗壮沉重。马、骡子和牛都能被他轻易杀死，不过他吃得最多的还是野生动物。美洲豹看起来十分凶猛，谁见了都会害怕。他跟别的猫一样捕猎，大多在夜里出动。美洲狮偶尔尖叫，美洲豹发出的却是吼声。那吼声太吓人，附近的小居民全会发抖，就连大居民多半也不例外。他的脑袋很大，双颚的力气惊人。偶尔还能见到通体乌黑的美洲豹，不是平常那种带着斑点的黄色。”
        - id: ch01-b06
          speaker: mother_nature
          text: “西南地区还住着一位小些的表亲，叫豹猫，也常被称作虎猫。他只比黑猫咪大一点，身形跟她很像，外衣也很漂亮。不过，他身上不是美洲豹那种浓郁的深黄色，而是浅浅的黄色，上面密布黑斑。面颊和后颈有黑线，尾巴上绕着黑色圆环。他最喜欢又密又多刺的灌木丛。在那里捕猎，不容易被人发现。他个头小，主要吃小动物、鸟和爬行动物，有时连大蛇也能杀死吃掉。要是住在人类附近，他会跟嚎嚎一样跑去鸡舍偷鸡。他做什么都像别的猫科成员。”
        - id: ch01-b07
          speaker: mother_nature
          text: “同一片地方还有一位邻居，模样在猫科家族里最古怪。他叫细腰猫，也叫埃拉。有的细腰猫穿着暗灰色外衣，有的却是铁锈红。他的身子不像别的猫，反倒更像小水獭乔。腿很短，尾巴很长，个头比小乔稍大。脑袋小小的，还有些扁，不像大多数猫那样圆。细腰猫喜欢待在水边，游泳也很拿手。人类对他的生活习惯知道得不多。不过他确实是猫，而猫的习性总有许多相似的地方。”
