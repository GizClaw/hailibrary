audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm, observant storytelling
        timbre: clear and gentle
        pace: measured
        pitch: medium
    old_mother_nature:
      display_name: Old Mother Nature
      tts:
        delivery: kindly, assured, and practical
        timbre: warm and full
        pace: unhurried
        pitch: medium-low
  chapters:
    - id: ch01
      title: Some Big and Little Cat Cousins
      blocks:
        - id: ch01-b01
          speaker: old_mother_nature
          text: "Puma the Panther is the largest member of the Cat family in this country, except for one Cat found only in the far Southwest. Puma is also known as the Mountain Lion, the Cougar, and the Painter. You all know what Black Pussy looks like. Now imagine her more than eight feet long, with a yellowish-brown coat that is whitish underneath. She would look very much like Puma. Yowler the Bob Cat and Tufty the Lynx have short tails, but Puma has a long, round tail like Black Pussy's. His great size makes him very strong, yet he still moves with all the grace and quickness of a true Cat. As I told you yesterday, Puma once lived in the East. In fact, he could be found in almost every forested part of this great country. Then people settled more and more of the land and drove him away. Now he lives mostly among the great mountains of the Far West."
        - id: ch01-b02
          speaker: old_mother_nature
          text: "A Cat as big as Puma needs a great deal of food. Small animals and birds aren't enough for him, so he hunts large animals. He is big and strong enough to kill Lightfoot the Deer easily, and Lightfoot fears no one more. Puma especially likes Horse flesh. In some places where people pasture herds of Horses, he has killed so many young ones that people have come to hate him forever."
        - id: ch01-b03
          speaker: old_mother_nature
          text: "For all his size, Puma is a coward. The barking of a Dog will send him running. A Puma desperate with hunger has sometimes attacked a person, but that has happened very, very rarely. The truth is that he fears people and slips away when one approaches. Like any true Cat, he has wonderfully soft feet. Even with that huge body, he can move without a sound. He makes his home among rocky ledges high in the mountains and usually goes out to hunt at night. Once in a while he hunts by day, and sometimes he lies high on a ledge to bask in the sun. Like most Cats, he climbs well. He never comes boldly into view. Instead, he steals through the forest and among the rocks so quietly that people call him Sneak Cat. He may creep close enough to spring on his prey, or wait beside a path that other animals often use. He can leap a long way. When he lands on an animal, his heavy body and the force of the jump will almost surely knock it down, even if it is much bigger than he is."
        - id: ch01-b04
          speaker: old_mother_nature
          text: "People hunt Puma with Dogs because, as I said, a barking Dog makes him run. He usually doesn't go far before climbing a tree. Then the hunters catch up and shoot him there. If Dogs couldn't hunt him this way, Puma would have little to fear from people. His sight and hearing are so keen, and he moves so swiftly and quietly, that a person rarely takes him by surprise. Sometimes Puma follows a person, just as Tufty the Lynx does, and usually for the same reason. He is curious. Still, he looks so big and fierce that most people fear him, even though he is sneaky and cowardly. Only those who truly know Puma are not afraid of him."
        - id: ch01-b05
          speaker: old_mother_nature
          text: "Only one member of the Cat family in this whole country is larger than Puma. That is Jaguar, who is also called El Tigre. He lives in just a small part of the far Southwest because his real home is in the hot country farther south. Jaguar is not only the largest Cat here, but the handsomest. His beautiful coat is deep yellow and covered with black spots and rosettes. Underneath, he is white with large black spots, and his tail is fairly long. He isn't as long as Puma, but his body is thicker, heavier, and more solid. He can easily kill Horses, Mules, and Cattle, though wild animals make up most of his food. Jaguar looks so savage that the very sight of him brings fear. He hunts much as other Cats do, mostly at night. Puma sometimes screams, but Jaguar roars. That roar is terrifying. Every little creature, and most of the big ones, shivers when it sounds nearby. Jaguar has a large head and tremendously powerful jaws. Now and then, a Jaguar is black instead of yellow and spotted."
        - id: ch01-b06
          speaker: old_mother_nature
          text: "A smaller cousin named Ocelot lives in this same part of the great Southwest. He is often called Tiger Cat. Ocelot is only a little bigger than Black Pussy, and his shape is much like hers. He has a lovely coat too. It is a pale yellow rather than Jaguar's deep, rich yellow, and it is thickly covered with black spots. Black lines mark his cheeks and the back of his neck, while black rings circle his tail. He likes places where the brush grows thick and thorny. There he can hunt safely, with little danger of being hunted by people. Since he is smaller, he lives mainly on small animals, birds, and reptiles. Sometimes he even kills and eats large Snakes. If he lives near people, he raids their Hen roosts just as Yowler does. In every way, he behaves like the other Cats."
        - id: ch01-b07
          speaker: old_mother_nature
          text: "Another neighbor in that same country is the strangest-looking member of the Cat family. He is called the Jaguarundi Cat, or Eyra. His coat may be dull gray or rusty red. His body looks more like Little Joe Otter's than like any Cat's. He has short legs and a long tail, and he is a little larger than Little Joe. His head is rather small and somewhat flat, not round like the heads of most Cats. He likes to stay near water and swims well. People don't know very much about his habits. But he is a true Cat, and Cats all have much the same ways."
