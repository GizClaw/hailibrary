audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 亲切生动，带着温和的幽默感
        timbre: 温暖清亮
        pace: 舒缓而富有变化
        pitch: 中等
    peter_rabbit:
      display_name: 彼得兔
      tts:
        delivery: 好奇直率，情绪来得快也去得快
        timbre: 清脆稚气
        pace: 轻快
        pitch: 中高
    jumper_hare:
      display_name: 长耳野兔跳跳
      tts:
        delivery: 朴实腼腆，认真时透着好奇
        timbre: 清朗柔和
        pace: 稍缓
        pitch: 中等
    mother_nature:
      display_name: 老大自然妈妈
      tts:
        delivery: 慈爱睿智，说话从容而坦率
        timbre: 温厚柔和
        pace: 从容
        pitch: 中低
    reddy_fox:
      display_name: 雷迪狐狸
      tts:
        delivery: 狡猾强硬，话里带着威吓
        timbre: 略粗而尖
        pace: 稍慢
        pitch: 中低
  chapters:
    - id: ch01
      title: 第二章　彼得和跳跳去上学
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 快活、滚圆、红彤彤的太阳先生才掀开玫瑰色的被子，开始往湛蓝的天空上爬，彼得兔和表哥跳跳就赶到了绿森林。头一天，彼得正是在这里找到老大自然妈妈的。她早已等在那里，准备给他们上第一课。
        - id: ch01-b02
          speaker: mother_nature
          text: “你们来得这么准时，我很高兴。生活中，守时可是最要紧的事情之一。你们知道，这些天我忙得很，所以我们马上开课。先别急着问我，我要先问你们几个问题。彼得，你长什么样？住在哪里？平常吃些什么？我要看看，你对自己究竟知道多少。”
        - id: ch01-b03
          speaker: narrator
          text: 彼得抬起长长的后腿挠了挠耳朵，迟迟不知该从哪里讲起。老大自然妈妈耐心地等着。过了一会儿，彼得才怯生生地开口。
        - id: ch01-b04
          speaker: peter_rabbit
          text: “我从来没见过自己，只能看看家里其他成员，猜一猜自己的模样。我想，我跟兔子家族的其他成员应该差不多。我的后腿长，前腿短。大概是为了赶时间的时候能一跳跳得更远吧。”
        - id: ch01-b05
          speaker: narrator
          text: 老大自然妈妈点点头。彼得见了，胆子也大了些。
        - id: ch01-b06
          speaker: peter_rabbit
          text: “我的后腿又粗又有力，前腿却比较弱。除了跑步，我不太用得上前腿，大概就是这个缘故。我的毛皮棕一块、灰一块，夏天棕色多，冬天灰色多。照我的个头来说，耳朵比大多数动物的长，不过还是远远比不上跳跳表哥。我的尾巴短得几乎不配叫尾巴，只能直直翘着。它白得像一小团棉花，所以大家叫我棉尾兔。也有人叫我灰兔或灌木兔。灌木兔这个名字，可能是因为我爱住在灌木丛生的地方。”
        - id: ch01-b07
          speaker: peter_rabbit
          text: “我的家就在亲爱的老荆棘丛里，我可喜欢那里了。里面满是灌木和缠在一起的荆棘，是我知道的最安全的地方。我开出了许多条小路，刚好只够彼得太太和我通过。除了影子鼬和水貂比利，谁也进不来抓我们。那里还有一个浅浅的兔窝。我不出去跑的时候，就常坐在里面。”
        - id: ch01-b08
          speaker: peter_rabbit
          text: “夏天，我吃苜蓿、青草，还有各种绿油油的植物。我也特别喜欢溜进布朗农夫的菜园。冬天只能找到什么吃什么，大多是小树皮、嫩芽、灌木的细枝，还有雪底下的绿色植物。我能飞快地跑一小段，却跑不远，所以最喜欢浓密的灌木和乱荆棘。到了那里，我就能左躲右闪。论闪避，我还没见过谁能赢我。”
        - id: ch01-b09
          speaker: peter_rabbit
          text: “要是我离开老荆棘丛，又突然碰上雷迪狐狸或猎犬鲍泽，就赶紧钻进最近的空心木头或地洞。夏天我偶尔也会挖洞，不过用别人挖好的更省事。想给朋友传信，我就用后脚跺地，跳跳也一样。对了，我不喜欢水。”
        - id: ch01-b10
          speaker: mother_nature
          text: “你是想起那位住在遥远的温暖南方的表亲了吧？就是沼泽兔。”
        - id: ch01-b11
          speaker: narrator
          text: 彼得有些难为情，只好承认说中了。跳跳却立刻来了兴致，因为他从没听说过这位表亲。
        - id: ch01-b12
          speaker: mother_nature
          text: “彼得，你把自己的情况讲得很好。现在仔细看看跳跳，再告诉我，他跟你有什么不同。”
        - id: ch01-b13
          speaker: narrator
          text: 彼得把跳跳从头到脚看了半天，又抬起后腿挠了挠耳朵。
        - id: ch01-b14
          speaker: peter_rabbit
          text: “首先，跳跳比我大得多。他的后腿很长，耳朵也很长。夏天，他穿棕色外衣。到了冬天，全身都变白了，只有长耳朵的尖儿还是黑的。因为毛色会变，大家叫他变色野兔。他喜欢树木密集的绿森林，尤其爱待在幼树多的地方。他是我们家族里个头最大的。我知道的就这些。”
        - id: ch01-b15
          speaker: mother_nature
          text: “说到这里都很好，彼得。你只错了一件事。跳跳不是他那个家族里个头最大的。”
        - id: ch01-b16
          speaker: narrator
          text: 彼得和跳跳惊讶得眼睛都睁圆了。
        - id: ch01-b17
          speaker: mother_nature
          text: “还有一件事你忘了。跳跳从不像你那样钻进空心木头或地洞。跳跳，你为什么不进去躲呢？”
        - id: ch01-b18
          speaker: jumper_hare
          text: “我待在里面反而不安心。我得靠两条长腿逃命，还得绕着树木和灌木躲闪。雷迪狐狸在空地上也许能追上我，可到了能绕树打转的地方，他就抓不到我了。所以我总留在绿森林里。老大自然妈妈，那位喜欢游泳的表亲到底是怎么回事？”
        - id: ch01-b19
          speaker: narrator
          text: 老大自然妈妈眼里闪着笑意。
        - id: ch01-b20
          speaker: mother_nature
          text: “以后再讲这件事。现在，你们各自举起一只后脚，看看彼此有什么不同。”
        - id: ch01-b21
          speaker: narrator
          text: 两个人都举起一只后脚，先瞧自己的，再瞧对方的。
        - id: ch01-b22
          speaker: peter_rabbit
          text: “我看着很像呀，只是跳跳的脚比我的长得多，也大得多。”
        - id: ch01-b23
          speaker: narrator
          text: 跳跳点点头，也觉得彼得说得没错。
        - id: ch01-b24
          speaker: mother_nature
          text: “你们的眼睛怎么啦？彼得，难道你没看见，跳跳的脚比你的宽得多吗？他的脚趾分得很开，你的脚趾却紧紧挨着。”
        - id: ch01-b25
          speaker: narrator
          text: 彼得和跳跳都不好意思了。老大自然妈妈说得一点没错。跳跳的脚的确不一样，彼得的脚窄得多，也瘦得多。
        - id: ch01-b26
          speaker: mother_nature
          text: “这个区别非常重要。跳跳，你猜得出我为什么给你一双大脚吗？”
        - id: ch01-b27
          speaker: narrator
          text: 跳跳慢慢摇了摇头。
        - id: ch01-b28
          speaker: jumper_hare
          text: “难道只是为了让我跟别人长得不一样？除此以外，我猜不出来。”
        - id: ch01-b29
          speaker: mother_nature
          text: “这可真让我吃惊。你早该明白，我给任何人的任何东西都有用处。告诉我，冬天来了以后，你这双大脚会怎样？”
        - id: ch01-b30
          speaker: jumper_hare
          text: “我没发现有什么变化，只是脚趾之间的毛会长得很长。”
        - id: ch01-b31
          speaker: mother_nature
          text: “正是这样。脚趾间长出长毛以后，你就能踩着松软的雪跑，不会陷下去，简直像穿了雪鞋。所以人们也常叫你雪鞋兔。我给你大脚，每年冬天又让趾间长出长毛，是因为你得靠双腿甩开敌人。积雪再深，你也能跑过去，追你的敌人却会陷进雪里。”
        - id: ch01-b32
          speaker: mother_nature
          text: “彼得虽然比你小，也比你轻，却走不了你能走的雪地。不过他不必事事都靠两条腿保命。你们再看看自己的脚底，都长着不少短毛。温暖南方那位表亲的脚上只有几根毛，这样更方便游泳。”
        - id: ch01-b33
          speaker: peter_rabbit
          text: “老大自然妈妈，那位表亲为什么那么喜欢水呢？”
        - id: ch01-b34
          speaker: mother_nature
          text: “因为他住的地方到处是沼泽和水。他的个头差不多跟你一样大，模样也很像你。只是腿短一些，耳朵小一些，尾巴是棕色的，不像你的尾巴那么白。他跑得不好，遇到危险就逃进水里。”
        - id: ch01-b35
          speaker: mother_nature
          text: “其实，就算没有危险，他也喜欢下水游着玩。南方的水暖和，他最爱在里面划来划去。狐狸来追，他只要一头扎进水里，藏到水草之间，只把眼睛和鼻子露在水面上。”
        - id: ch01-b36
          speaker: peter_rabbit
          text: “他也跟麝鼠杰里一样，把家安在水里吗？”
        - id: ch01-b37
          speaker: narrator
          text: 彼得问得十分天真。老大自然妈妈笑着摇了摇头。
        - id: ch01-b38
          speaker: mother_nature
          text: “当然不是。他的家在地面上。他的孩子也出生在窝里。彼得太太怎样给你们的孩子做窝，跳跳太太怎样给跳跳的孩子做窝，他家的窝也怎样做。先用草搭好，再铺上兔太太从自己胸口拔下的软毛，还要藏得严严实实。说到这里，彼得，你的孩子跟跳跳表哥的孩子有什么不同？”
        - id: ch01-b39
          speaker: narrator
          text: 彼得摇了摇头。
        - id: ch01-b40
          speaker: peter_rabbit
          text: “我不知道。我的孩子刚出生时睁不开眼睛，身上也没有毛。”
        - id: ch01-b41
          speaker: narrator
          text: 跳跳一下竖起了两只长耳朵。
        - id: ch01-b42
          speaker: jumper_hare
          text: “什么？我的孩子一出生就睁着眼睛，还穿着最可爱的小毛衣呢！”
          emotion: surprised
        - id: ch01-b43
          speaker: narrator
          text: 老大自然妈妈听了，轻声笑起来。
        - id: ch01-b44
          speaker: mother_nature
          text: “这就是区别。看来你们俩今天都学到了新东西。”
        - id: ch01-b45
          speaker: peter_rabbit
          text: “您刚才说，跳跳不是我们家族里个头最大的。那么，最大的是谁呢？”
        - id: ch01-b46
          speaker: mother_nature
          text: “有好几位都比跳跳大呢。”
        - id: ch01-b47
          speaker: narrator
          text: 彼得和跳跳满脸惊奇，那副模样十分滑稽。老大自然妈妈看着他们，不禁笑了。
        - id: ch01-b48
          speaker: mother_nature
          text: “遥远的冰雪北方有一位，遥远的大西部还有两位表亲。他们比跳跳大出的分量，就像跳跳比你大出的分量一样，彼得。可我现在没空讲了。真想知道的话，明天早晨日出时准时来。”
        - id: ch01-b49
          speaker: mother_nature
          text: “哎呀，雷迪狐狸来了！看他的样子，要是有一顿丰盛的早餐送到嘴边，他一定很乐意。现在让我瞧瞧，你们学会了多少保护自己的本领。”
        - id: ch01-b50
          speaker: narrator
          text: 彼得和跳跳朝她指的方向看了一眼，顿时吓了一跳。来的果然是雷迪狐狸。不远处恰好有一根空心木头，彼得一点时间也没浪费，转身就钻了进去。他跑得太急，连向老大自然妈妈道别都忘了。
        - id: ch01-b51
          speaker: narrator
          text: 老大自然妈妈一点也不介意。她很明白彼得的心情。看着那条滑稽的小白尾巴消失在空心木头里，她忍不住笑了。跳跳呢，立刻撒开长腿，一蹦老远，转眼便没了踪影。雷迪狐狸就在后面紧追不舍。
