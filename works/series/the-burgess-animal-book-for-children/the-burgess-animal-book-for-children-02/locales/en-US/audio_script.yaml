  chapters:
    - id: ch01
      title: Peter and Jumper go to School
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Jolly, round, red Mr. Sun had barely thrown off his rosy blankets and begun his daily climb up the blue, blue sky when Peter Rabbit and his cousin, Jumper the Hare, reached the Green Forest. They had come to the very place where Peter had found Old Mother Nature the day before. She was already waiting for them, ready to begin their first lesson.
        - id: ch01-b02
          speaker: old_mother_nature
          text: "I'm glad you came promptly. Being on time is one of life's most important habits. I'm very, very busy these days, so we'll start school now. Before you ask me anything, I have questions for you. Peter, what do you look like? Where do you live? What do you eat? Let's find out how much you truly know about yourself."
        - id: ch01-b03
          speaker: narrator
          text: Peter scratched one ear with a long hind foot. He wasn't sure where to start, and Old Mother Nature waited patiently. At last, Peter answered in a timid voice.
        - id: ch01-b04
          speaker: peter_rabbit
          text: "I've never seen myself, so I only know how I look by watching the rest of my family. I suppose I'm shaped like other Rabbits. My hind legs are long and my front legs are short. That must help me take long jumps when I'm in a hurry."
        - id: ch01-b05
          speaker: narrator
          text: Old Mother Nature nodded. That gave Peter courage to go on.
        - id: ch01-b06
          speaker: peter_rabbit
          text: "My hind legs are stout and strong, but my front legs are rather weak. I suppose that's because I don't have much use for them except when I run. My coat is a mixture of brown and gray. It has more brown in summer and more gray in winter. My ears are longer for my size than most animals' ears, though they really aren't very long. Cousin Jumper's ears are much longer for his size than mine are for my size."
        - id: ch01-b07
          speaker: peter_rabbit
          text: "My tail is so short it hardly seems worth calling it a tail, and I carry it straight up. It's white and looks like a little bunch of cotton. I suppose that's why I'm called a Cottontail Rabbit. Some folks call me a Gray Rabbit, and others call me a Bush Rabbit. Maybe that's because I like living in bushy places."
        - id: ch01-b08
          speaker: peter_rabbit
          text: "I live in the dear Old Briar-patch, and I love it there. It's one great mass of bushes and tangled brambles, and it's the safest place I know. I've cut little paths all through it that are just wide enough for Mrs. Peter and me. None of our enemies can reach us there except Shadow the Weasel or Billy Mink. I also have a kind of nest where I spend my time when I'm not out running around. It's called a form, and I sit in it a great deal."
        - id: ch01-b09
          speaker: peter_rabbit
          text: "In summer I eat clover, grass, and other green plants. I especially love getting over into Farmer Brown's garden. Winter is different. Then I have to take whatever I can find. Most of the time that means bark from young trees, buds and tender twigs from the bushes, and any green plants I can uncover beneath the snow."
        - id: ch01-b10
          speaker: peter_rabbit
          text: "I can run fast for a short distance, but only for a short distance. That's why I like thick brush and bramble tangles. I can dodge there, and I don't know anyone who can beat me at dodging. If Reddy Fox or Bowser the Hound surprises me when I'm away from the Old Briar-patch, I race for the nearest hollow log or hole in the ground. Sometimes I dig a hole for myself in summer, but I don't do it often. Using a hole that somebody else dug is much easier."
        - id: ch01-b11
          speaker: peter_rabbit
          text: "When I need to warn my friends, I thump the ground with my hind feet. Jumper does that, too. Oh, and I forgot one thing. I don't like water."
        - id: ch01-b12
          speaker: narrator
          text: Old Mother Nature smiled.
        - id: ch01-b13
          speaker: old_mother_nature
          text: "You're thinking about your cousin the Marsh Rabbit, who lives far down in the Sunny South."
        - id: ch01-b14
          speaker: narrator
          text: Peter looked a little foolish and admitted that she was right. Jumper suddenly became very interested. He had never heard about this cousin.
        - id: ch01-b15
          speaker: old_mother_nature
          text: "That was a good account of yourself, Peter. Now study Cousin Jumper and tell me how he's different from you."
        - id: ch01-b16
          speaker: narrator
          text: Peter looked Jumper over carefully. Then he scratched one ear with a long hind foot again.
        - id: ch01-b17
          speaker: peter_rabbit
          text: "First, Jumper is quite a bit bigger than I am. His hind legs are very long, and so are his ears. He wears a brown coat in summer. In winter he turns white all over except for the tips of those long ears, which stay black. Because his coat changes that way, he's called the Varying Hare. He likes parts of the Green Forest where the trees stand close together, especially places with a great many young trees. He's the biggest member of our family. I think that's everything I know about Cousin Jumper."
        - id: ch01-b18
          speaker: old_mother_nature
          text: "That's good as far as it goes, Peter, but you made one mistake. Jumper isn't the biggest member of his family."
        - id: ch01-b19
          speaker: narrator
          text: Peter and Jumper both opened their eyes very wide in surprise.
        - id: ch01-b20
          speaker: old_mother_nature
          text: "You also forgot that Jumper never hides in hollow logs or holes the way you do. Why don't you, Jumper?"
        - id: ch01-b21
          speaker: jumper_hare
          text: "I wouldn't feel safe in one. I trust my long legs and my skill at dodging around trees and bushes. Reddy Fox might be fast enough to catch me out in the open, but he can't catch me among the trees and bushes. That's why I stay in the Green Forest. But please, Mother Nature, who is this cousin that likes to swim?"
        - id: ch01-b22
          speaker: narrator
          text: Old Mother Nature's eyes twinkled.
        - id: ch01-b23
          speaker: old_mother_nature
          text: "We'll come to him later. For now, each of you hold up one hind foot. Tell me what difference you see."
        - id: ch01-b24
          speaker: narrator
          text: Peter and Jumper each raised a hind foot. Each looked at his own foot and then at the other's.
        - id: ch01-b25
          speaker: peter_rabbit
          text: "They look almost the same to me. Jumper's foot is only much longer and bigger than mine."
        - id: ch01-b26
          speaker: narrator
          text: Jumper nodded in agreement.
        - id: ch01-b27
          speaker: old_mother_nature
          text: "What's wrong with your eyes? Jumper's foot is much broader than yours, Peter. His toes spread apart, while yours stay close together. Can't you see that?"
        - id: ch01-b28
          speaker: narrator
          text: Peter and Jumper looked sheepish, because the difference was exactly as Old Mother Nature had said. Jumper's foot really was quite unlike Peter's. It was broad, with the toes spread apart, while Peter's foot was narrow and slim.
        - id: ch01-b29
          speaker: old_mother_nature
          text: "That difference is very important. Jumper, can you guess why I gave you such big feet?"
        - id: ch01-b30
          speaker: narrator
          text: Jumper slowly shook his head.
        - id: ch01-b31
          speaker: jumper_hare
          text: "No, unless you wanted to make me different."
        - id: ch01-b32
          speaker: old_mother_nature
          text: "I'm surprised, Jumper. You should know by now that I never give anyone anything without a reason. What happens to those big feet in winter?"
          emotion: surprised
        - id: ch01-b33
          speaker: jumper_hare
          text: "Nothing that I know about, except that long hair grows between my toes."
        - id: ch01-b34
          speaker: old_mother_nature
          text: "Exactly. When that hair grows long, you can cross light snow without sinking into it. It's just as if you were wearing snowshoes, which is why people often call you a Snowshoe Rabbit. I gave you those big feet, and I make the hair grow between your toes every winter, because I know you rely on your legs to escape your enemies. You can run across deep snow where they break through. Peter is smaller and lighter than you, but even he can't travel where you can. Then again, Peter doesn't always need to depend on his legs to save his life."
        - id: ch01-b35
          speaker: old_mother_nature
          text: "There's one more thing for both of you to notice. The soles of your feet are covered with plenty of short hairs. Your cousin in the Sunny South has very few hairs on his feet. That helps him swim."
        - id: ch01-b36
          speaker: peter_rabbit
          text: "Please, Mother Nature, why does our cousin like the water so much?"
        - id: ch01-b37
          speaker: old_mother_nature
          text: "He lives in marshy country where water is everywhere. He's nearly your size, Peter, and looks a great deal like you. But his legs are a little shorter, his ears are a little smaller, and his tail is brownish instead of white. He can't run well, so when danger comes, he takes to the water."
        - id: ch01-b38
          speaker: old_mother_nature
          text: "He also swims for pleasure. The water is warm there, and he loves paddling around in it. When a Fox chases him, he simply dives in and hides among the water plants, leaving only his eyes and nose above the surface."
        - id: ch01-b39
          speaker: peter_rabbit
          text: "Does he live in the water the way Jerry Muskrat does?"
        - id: ch01-b40
          speaker: narrator
          text: Peter asked the question quite innocently. Old Mother Nature smiled and shook her head.
        - id: ch01-b41
          speaker: old_mother_nature
          text: "Certainly not. He lives on the ground. His babies are born in the same kind of nest Mrs. Peter makes for your babies and Mrs. Jumper makes for Jumper's. The nest is made of grass and lined with soft fur that Mrs. Rabbit pulls from her own breast. She hides it very carefully. By the way, Peter, how are your babies different from Jumper's babies?"
        - id: ch01-b42
          speaker: narrator
          text: Peter shook his head.
        - id: ch01-b43
          speaker: peter_rabbit
          text: "I don't know. When my babies are born, their eyes are closed and they don't have any hair."
        - id: ch01-b44
          speaker: narrator
          text: Jumper pricked up his long ears.
        - id: ch01-b45
          speaker: jumper_hare
          text: "What did you say? My babies are born with their eyes open, and they have the dearest little coats of fur!"
          emotion: surprised
        - id: ch01-b46
          speaker: narrator
          text: Old Mother Nature chuckled.
        - id: ch01-b47
          speaker: old_mother_nature
          text: "That's the difference. I believe both of you have learned something today."
        - id: ch01-b48
          speaker: peter_rabbit
          text: "A little while ago, you said Jumper wasn't the biggest in our family. Who is bigger than he is?"
        - id: ch01-b49
          speaker: old_mother_nature
          text: "Several relatives are bigger than Jumper. One lives far up in the Frozen North, and two cousins live far out in the Great West. Compared with Jumper, they're as much bigger as Jumper is compared with you, Peter."
        - id: ch01-b50
          speaker: narrator
          text: Old Mother Nature smiled when she saw the funny look of surprise spread across both Peter's face and Jumper's.
        - id: ch01-b51
          speaker: old_mother_nature
          text: "I don't have time to tell you about them now. If you truly want to learn, come back promptly at sun-up tomorrow morning. Why, hello! Here comes Reddy Fox, and he looks ready for a good breakfast. Let's see what you've learned about keeping yourselves safe."
        - id: ch01-b52
          speaker: narrator
          text: Peter and Jumper gave one startled look where Old Mother Nature was pointing. Sure enough, Reddy Fox was coming.
        - id: ch01-b53
          speaker: narrator
          text: A hollow log lay nearby, and Peter wasted no time in racing straight to it. He left in such a hurry that he forgot to say good-bye to Old Mother Nature. She didn't mind, because she understood exactly how Peter felt. She laughed when she saw his funny little white tail vanish inside the hollow log.
        - id: ch01-b54
          speaker: narrator
          text: Jumper trusted his long legs. He bounded away at once, with Reddy Fox racing after him.
