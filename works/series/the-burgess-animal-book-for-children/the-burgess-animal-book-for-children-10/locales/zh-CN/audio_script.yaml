audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 亲切生动，带着温和的幽默感
        timbre: 温暖清亮
        pace: 舒缓而富有变化
        pitch: 中等
    peter_rabbit:
      display_name: 彼得兔
      tts:
        delivery: 好奇直率，情绪来得快也去得快
        timbre: 清脆稚气
        pace: 轻快
        pitch: 中高
    mother_nature:
      display_name: 老大自然妈妈
      tts:
        delivery: 慈爱睿智，说话从容而坦率
        timbre: 温厚柔和
        pace: 从容
        pitch: 中低
    happy_jack:
      display_name: 灰松鼠快乐杰克
      tts:
        delivery: 自信好胜，受窘时有些急躁
        timbre: 明亮爽脆
        pace: 轻快
        pitch: 中高
    striped_chipmunk:
      display_name: 花栗鼠条纹
      tts:
        delivery: 开朗谦和，机灵中带着几分自信
        timbre: 清亮柔和
        pace: 轻快
        pitch: 中高
    prickly_porky:
      display_name: 豪猪刺刺
      tts:
        delivery: 脾气暴躁，爱抱怨，说话总带着不耐烦
        timbre: 粗哑厚重
        pace: 缓慢
        pitch: 低
  chapters:
    - id: ch01
      title: 第十章　豪猪刺刺和囊地鼠刨刨
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 第二天早晨，彼得一路去学校，一路猜着今天会认识谁。他想得太入神，连脚下也顾不上了。彼得有时就是这么粗心。他刚从绿森林边缘的一丛荆棘里跳出来，差一点儿就落进比世上最扎人的荆棘更可怕的东西里。幸好他猛地向旁边一跃，才救了自己，没一头撞进刺刺那上千根小尖矛中间。
        - id: ch01-b02
          speaker: peter_rabbit
          text: “哎呀！”
          emotion: surprised
        - id: ch01-b03
          speaker: prickly_porky
          text: “你走路就不能看着点儿吗？这会儿要是已经扎上几根刺，那也不能怪我。你是自找的。”
          emotion: angry
        - id: ch01-b04
          speaker: narrator
          text: 刺刺显然心情不好。他摇摇摆摆地走了几步，又哼哼着抱怨起来。
        - id: ch01-b05
          speaker: prickly_porky
          text: “真不明白，老大自然妈妈今天为什么非要叫我来。我最烦走这么远的路。”
          emotion: angry
        - id: ch01-b06
          speaker: narrator
          text: 彼得一听，长耳朵立刻竖了起来。
        - id: ch01-b07
          speaker: peter_rabbit
          text: “我知道了！你要去上学，刺刺。你也是啮齿目动物，今天早晨大家要学的就是你。”
        - id: ch01-b08
          speaker: prickly_porky
          text: “我不是啮齿目动物。我是豪猪！”
          emotion: angry
        - id: ch01-b09
          speaker: peter_rabbit
          text: “可你照样属于啮齿目。你有啃东西的大牙，只要长着这种牙，就是啮齿目动物。”
        - id: ch01-b10
          speaker: narrator
          text: 彼得忽然想到一件事，脸上的神情变得怪怪的。
        - id: ch01-b11
          speaker: peter_rabbit
          text: “这么一说，你和我也算亲戚呀。”
        - id: ch01-b12
          speaker: narrator
          text: 刺刺仍旧拖着脚步往前挪。
        - id: ch01-b13
          speaker: prickly_porky
          text: “我不信。才不信呢。我可不想跟你这么粗心的家伙做亲戚。学校到底有什么用？我不想去。我该知道的早就全知道了。怎么找到吃的，怎么叫大家给我让开，不来打扰我。知道这些还不够吗？”
          emotion: angry
        - id: ch01-b14
          speaker: narrator
          text: 他抖动藏在外套里的上千根小尖矛，发出一阵难听的沙沙声。彼得听得浑身一颤。
        - id: ch01-b15
          speaker: peter_rabbit
          text: “哼，有些家伙偏偏就喜欢当笨蛋。”
          emotion: angry
        - id: ch01-b16
          speaker: narrator
          text: 彼得啪嗒啪嗒地赶到前面去了。刺刺却还在后面慢慢挪着，尖刺一路作响。
        - id: ch01-b17
          speaker: narrator
          text: 彼得到学校时，其他伙伴已经全到了，刺刺却连影子也没有。老大自然妈妈从不浪费时间，她要忙的事实在太多了。于是，她立刻叫大家坐好上课。
        - id: ch01-b18
          speaker: mother_nature
          text: “昨天，我给你们讲了遥远西部高山上的两位小小割草人。彼得，他们是谁？”
        - id: ch01-b19
          speaker: peter_rabbit
          text: “小酋长鼠兔，人们也叫他鼠兔或岩兔。还有山河狸短尾巴，也就是塞维尔鼠。”
        - id: ch01-b20
          speaker: mother_nature
          text: “答对了。今天要讲的是我的一位小小耕田人。他也住在遥远西部，不过比起高山，他更喜欢辽阔的平原，虽然偶尔也能在山里找到他。他叫囊地鼠刨刨，和你们大家属于同一目，却出自一个只属于自己的家族。”
        - id: ch01-b21
          speaker: mother_nature
          text: “他的正式名称是囊地鼠。在遥远的东南方也能找到他，那边的人还叫他蝾螈鼠。至于为什么，我可一点儿也不知道。”
        - id: ch01-b22
          speaker: striped_chipmunk
          text: “他的脸颊里也有和我一样的口袋吗？”
        - id: ch01-b23
          speaker: mother_nature
          text: “他的脸颊确实有口袋，所以才叫囊地鼠。不过，他的口袋和你的不一样，条纹。你的在脸颊里面，他的却在外面。”
        - id: ch01-b24
          speaker: striped_chipmunk
          text: “这可真有意思！”
          emotion: surprised
        - id: ch01-b25
          speaker: mother_nature
          text: “跟刨刨的口袋相比，你的可小多了。他的一只口袋几乎盖满整个头侧，一直伸到短脖子旁边，里面还长着毛。这样的口袋，他一共有两只。”
        - id: ch01-b26
          speaker: mother_nature
          text: “刨刨只用这些口袋搬食物，从来不用它们搬走挖地道时刨出的泥土，只是有些人误以为他会这样做。他用两只前脚把食物塞得满满的。需要倒出来时，他再用脚从口袋后面往前挤。”
        - id: ch01-b27
          speaker: mother_nature
          text: “囊地鼠家族很大。家族成员个头不一，小的只有草地鼠丹尼那么大，大的却能赶上大老鼠强盗，而且那些大个子比强盗更粗壮、更沉。有些囊地鼠穿着红褐色的外套，有些则是灰色。可是无论个头多大，也无论住在哪里，刨刨的生活习惯总是一样。”
        - id: ch01-b28
          speaker: narrator
          text: 彼得一直动来动去，显然有话憋在心里。老大自然妈妈刚停下来，他便急忙抓住机会。
        - id: ch01-b29
          speaker: peter_rabbit
          text: “请问，您为什么叫他耕田人？”
        - id: ch01-b30
          speaker: mother_nature
          text: “别着急，该讲到的时候自然会讲到。刨刨大半辈子都住在地下，很像你们全都认识的鼹鼠矿工，挖地道也差不多一样快。他的腿很短，前腿和前脚却又粗又有力，还长着又长又结实的爪子。他挖土时，既用这些爪子，也让那对大门牙来帮忙。”
        - id: ch01-b31
          speaker: mother_nature
          text: “他先把泥土刨到身子下面，再用后脚踢到背后。等土堆得够多，他就转过身，用前脚和脑袋推着土，先送进一条小岔道，再推到地面。土全推出去后，他会堵上出口，回来继续挖。松土在地面堆成小土丘，每隔几英尺就有一座。”
        - id: ch01-b32
          speaker: mother_nature
          text: “刨刨是个干活的好手，勤快得很。反正住在地下，对他来说，白天还是黑夜没有多大分别。到了夏天，一天中最热的那段时间，他才会停下来休息。他很少来到地面，就算出来，也通常选在黄昏，所以那双又小又弱的眼睛几乎派不上用场。”
        - id: ch01-b33
          speaker: mother_nature
          text: “他还有一条光秃秃的小尾巴，感觉非常灵敏。沿着地道倒退时，尾巴就替他探路，而且他退得相当快。他前脚的长爪子也很特别，走路或奔跑时，他会把爪子折到脚底下。对了，你们知道农夫布朗为什么要犁菜园吗？”
        - id: ch01-b34
          speaker: narrator
          text: 老大自然妈妈挨个看过去，大家一个接一个地摇了摇头。
        - id: ch01-b35
          speaker: mother_nature
          text: “农夫犁地，是为了把枯死的植物彻底翻进泥土。这样，庄稼的根就容易得到它们带来的养分。刨刨朝各个方向打洞，又把深处的泥土推上地面，做的其实也是这件事。”
        - id: ch01-b36
          speaker: mother_nature
          text: “所以，我才叫他小小耕田人。他翻松坚硬板结的土，再把植物残留下来的东西混进去。这样一来，种子容易发芽，植物也容易生长。”
        - id: ch01-b37
          speaker: happy_jack
          text: “那他一定是农夫最好的朋友之一吧？”
        - id: ch01-b38
          speaker: narrator
          text: 老大自然妈妈摇了摇头。
        - id: ch01-b39
          speaker: mother_nature
          text: “过去的确是。他曾经帮了大忙，让许多土地变得适合耕种。可是很遗憾，人们一旦开始种庄稼，他就会变成可怕的祸害。农夫想种出来的作物会被他吃掉，他不断推出的新土丘还会埋住许多幼苗。草地上有了这些土丘，农夫用割草机收割干草也会十分困难。”
        - id: ch01-b40
          speaker: mother_nature
          text: “他还会钻进新栽的果园，把幼树所有的嫩根咬断，树也就死了。他喜欢嫩根、种子、草茎和谷物。要是找到一片马铃薯田，他别提有多高兴了。”
        - id: ch01-b41
          speaker: mother_nature
          text: “刨刨这么能干活，吃得当然也多。他还要存下大批食物过冬，因为他不像约翰尼那样冬眠。冬天，他甚至会在雪底下打洞。有时，他把地下挖出的土塞进雪下的通道。等雪融了，地面便留下一道道奇怪的土垄，正好标出原先的通道。”
        - id: ch01-b42
          speaker: mother_nature
          text: “刨刨的生活习惯很讲究整洁，总把自己和家里收拾得干干净净。白天，他会暂时打开一座土丘的出口，让新鲜空气透进来，但只敢开一小会儿，很快就再次封上。他怕黄鼠狼影子，或是那种叫囊地鼠蛇的大蛇发现洞口，钻进地道追捕他。”
        - id: ch01-b43
          speaker: mother_nature
          text: “他的敌人里，只有獾挖挖能挖得够快，把他从地下刨出来。夜里，刨刨喜欢到地面上透透气，或是割些谷物和青草，这时候必须时时留神猫头鹰呼呼。到了白天，老郊狼和鹰族的成员也总在四处寻找他。你们看，他和你们大家一样，身边的敌人真不少。”
        - id: ch01-b44
          speaker: mother_nature
          text: “囊地鼠的英文名字‘戈弗’，来自一个表示蜂巢的词。刨刨的地道通向四面八方，最后会让整片土地变得像蜂巢。他不爱跟同类来往，脾气也很坏，随时都准备打架。”
        - id: ch01-b45
          speaker: mother_nature
          text: “我刚才说过，在平原上，他能让土壤变得细软肥沃。可到了山坡上，他就会惹出大麻烦。水沿着他的地道往下流，会把泥土冲走。再加上他会糟蹋庄稼，人类便成了他最大的敌人。”
        - id: ch01-b46
          speaker: mother_nature
          text: “不过，人类也给他带来了许多容易找到的新鲜美食。所以，尽管人们摆下捕兽夹，又用上毒药，刨刨一家的数量还是比从前增长得更快。嘿，看看是谁来了！来得正是时候。”
        - id: ch01-b47
          speaker: narrator
          text: 一阵拖沓的脚步声、尖刺的沙沙声和哼哼声响了起来。刺刺爬上一截老树桩，满脸不耐烦，心情坏透了。他根本不想来上学，是老大不情愿才来的。
