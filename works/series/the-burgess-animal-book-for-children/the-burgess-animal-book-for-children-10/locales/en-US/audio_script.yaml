  chapters:
    - id: ch01
      title: Prickly Porky and Grubby Gopher
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: The next morning, Peter Rabbit wondered all the way to school which animal they would study that day. He was so busy wondering that he paid no attention to where he was going. Peter can be careless that way. As he hopped out of a tangle of brambles just inside the edge of the Green Forest, he nearly came down on something worse than the worst brambles that ever grew. Only a wild jump to the side saved him from landing among the thousand little spears of Prickly Porky the Porcupine.
        - id: ch01-b02
          speaker: peter_rabbit
          text: "Good gracious!"
          emotion: surprised
        - id: ch01-b03
          speaker: prickly_porky
          text: "Why don't you watch where you're going? If you had some of my little spears sticking in you right now, it wouldn't be my fault. You'd deserve it."
          emotion: angry
        - id: ch01-b04
          speaker: narrator
          text: Prickly Porky was plainly in a bad temper. He waddled a few steps, then began grumbling again.
        - id: ch01-b05
          speaker: prickly_porky
          text: "I don't know why Old Mother Nature sent for me this morning. I hate walking such a long way."
          emotion: angry
        - id: ch01-b06
          speaker: narrator
          text: Peter's long ears stood up at once.
        - id: ch01-b07
          speaker: peter_rabbit
          text: "I know why! You're going to school, Prickly Porky. You're a Rodent, and we're going to learn about you this morning."
        - id: ch01-b08
          speaker: prickly_porky
          text: "I'm not a Rodent. I'm a Porcupine."
          emotion: angry
        - id: ch01-b09
          speaker: peter_rabbit
          text: "You're still a Rodent. You have big teeth for gnawing, and anyone with teeth like those is a Rodent. Why, that means you and I are related in a way!"
        - id: ch01-b10
          speaker: narrator
          text: A funny look had crossed Peter's face at the thought, but Prickly Porky only kept shuffling along.
        - id: ch01-b11
          speaker: prickly_porky
          text: "I don't believe it, and I don't want to be related to anyone as careless as you. What is this school, anyway? I don't want to go. I already know how to find all the food I need. I know how to make everyone move aside and leave me alone. That's enough for me."
          emotion: angry
        - id: ch01-b12
          speaker: narrator
          text: He rattled the thousand little spears hidden in his coat. Peter shivered. It was a most unpleasant sound.
        - id: ch01-b13
          speaker: peter_rabbit
          text: "Well, some people enjoy being stupid."
          emotion: angry
        - id: ch01-b14
          speaker: narrator
          text: Peter hurried away, lipperty-lipperty-lip. Behind him, Prickly Porky shuffled slowly on, rattling as he went.
        - id: ch01-b15
          speaker: narrator
          text: Everyone else had arrived by the time Peter reached school, and Prickly Porky was nowhere in sight. Old Mother Nature had far too much to do to waste time, so she called the class to order at once.
        - id: ch01-b16
          speaker: old_mother_nature
          text: "Yesterday I told you about two little haymakers from the high mountains of the Far West. Who were they, Peter Rabbit?"
        - id: ch01-b17
          speaker: peter_rabbit
          text: "Little Chief Hare, who is called the Pika or Cony, and Stubtail the Mountain Beaver, who is also called the Sewellel."
        - id: ch01-b18
          speaker: narrator
          text: Peter answered without a moment's delay.
        - id: ch01-b19
          speaker: old_mother_nature
          text: "Right. Now I'll tell you about one of my little plowmen. He lives in the Far West too, but he prefers the great plains to the high mountains, though he can sometimes be found in the mountains. His name is Grubby the Gopher. He belongs to the same order as the rest of you, but his family is entirely his own. His proper name is Pocket Gopher. Far down in the Southeast, where he also lives, people call him a Salamander. I haven't the least idea why."
        - id: ch01-b20
          speaker: striped_chipmunk
          text: "Does he have pockets in his cheeks like mine?"
        - id: ch01-b21
          speaker: old_mother_nature
          text: "He does have cheek pockets, and that is why he is called the Pocket Gopher. But they aren't like yours, Striped Chipmunk. Your pockets are inside your cheeks. His are outside."
        - id: ch01-b22
          speaker: striped_chipmunk
          text: "How funny!"
          emotion: surprised
        - id: ch01-b23
          speaker: old_mother_nature
          text: "Your pockets are small beside Grubby's. Each one covers almost a whole side of his head, all the way back to his short neck, and each is lined with fur. Remember, he has two. He carries food in them, but he never carries out dirt in them when he digs a tunnel, no matter what some people think. He uses his front feet to stuff the pockets. To empty one, he presses it forward from behind with a foot."
        - id: ch01-b24
          speaker: old_mother_nature
          text: "The Gopher family is quite large. Its members come in very different sizes. The smallest are about the size of Danny Meadow Mouse. The biggest are as large as Robber the Rat, but those larger Gophers are stouter and heavier than Robber. Some have reddish-brown coats and some have gray ones. Yet Grubby has the same habits wherever he lives and whatever his size."
        - id: ch01-b25
          speaker: narrator
          text: Peter had been fidgeting the whole time. Anyone could see that he had a question waiting. As soon as Old Mother Nature paused, he seized his chance.
        - id: ch01-b26
          speaker: peter_rabbit
          text: "If you please, why did you call him a plowman?"
        - id: ch01-b27
          speaker: old_mother_nature
          text: "I'll come to that soon enough. Grubby spends most of his life underground, much as Miner the Mole does. He can dig tunnels almost as quickly. His legs are short, and his front legs and feet are thick and powerful. Long, strong claws arm those feet. He digs with them and with his big cutting teeth."
        - id: ch01-b28
          speaker: old_mother_nature
          text: "First he throws the dirt beneath himself. Then his hind feet kick it behind him. When a good-sized pile has gathered there, he turns around. With his head and front feet, he pushes it into a small side tunnel and up to the surface. Once all the dirt is outside, he closes the opening and goes back to work. The loose dirt makes a little mound, and he leaves another mound every few feet."
        - id: ch01-b29
          speaker: old_mother_nature
          text: "Grubby is a tireless worker. Down underground, day and night make little difference to him. In summer he rests through the hottest hours. His eyes are small and weak because he hardly uses them. He seldom comes aboveground, and when he does, it is usually at dusk."
        - id: ch01-b30
          speaker: old_mother_nature
          text: "His funny little tail has no hair. It is very sensitive, so it guides him when he runs backward through a tunnel. He can move backward quite fast. And here is another odd thing. When he walks or runs, he folds those long front claws underneath. Now, does anyone know why Farmer Brown plows his garden?"
        - id: ch01-b31
          speaker: narrator
          text: Old Mother Nature looked from one pupil to the next. Each one shook his head.
        - id: ch01-b32
          speaker: old_mother_nature
          text: "Farmer Brown plows to mix dead plant matter well into the earth, where the roots of growing plants can reach it. Grubby does the same kind of work. His tunnels run in every direction, bringing deep earth to the surface. That is why I call him my little plowman. He loosens hard, packed ground and mixes plant matter through it. Then seeds can sprout and plants can grow more easily."
        - id: ch01-b33
          speaker: happy_jack_squirrel
          text: "Then he must be one of a farmer's best friends!"
        - id: ch01-b34
          speaker: narrator
          text: Old Mother Nature shook her head.
        - id: ch01-b35
          speaker: old_mother_nature
          text: "He used to be. He did wonderful work helping to make the land ready for farming. But once people begin farming that land, I am sorry to say he becomes a dreadful pest. He eats the crops they are trying to grow. His fresh mounds keep burying young plants, and in meadows those mounds make it very hard to cut hay with a mowing machine."
        - id: ch01-b36
          speaker: old_mother_nature
          text: "Grubby also goes into young orchards and cuts off the tender roots of young trees, which kills them. Tender roots are among his favorite foods. So are seeds and the stems of grass and grain. Nothing pleases him more than finding a field of potatoes."
        - id: ch01-b37
          speaker: old_mother_nature
          text: "All that work means he needs a great deal to eat. He also stores away a great deal of food for winter, because he doesn't sleep through winter as Johnny Chuck does. He even digs tunnels under the snow. Sometimes he fills those little snow tunnels with earth he has brought up from below. When the snow melts, strange little ridges of dirt remain and show exactly where the tunnels ran."
        - id: ch01-b38
          speaker: old_mother_nature
          text: "Grubby keeps both himself and his home very clean. During the day, he sometimes leaves one mound open for a little while so fresh air can enter. He soon closes it again. He cannot risk leaving it open long, or Shadow the Weasel might find the entrance. So might a big snake called the Gopher Snake. Either one would go down after him."
        - id: ch01-b39
          speaker: old_mother_nature
          text: "Digger the Badger is the only enemy who can dig fast enough to dig Grubby out. At night, Grubby likes to come aboveground for a little air or to cut grass and grain. Then he must watch for Hooty the Owl. In daylight, Old Man Coyote and the members of the Hawk family are always looking for him. You see, he has plenty of enemies, just as the rest of you do."
        - id: ch01-b40
          speaker: old_mother_nature
          text: "The name Gopher comes from a word that means honeycomb. Grubby's tunnels spread in every direction until the ground is like a honeycomb. He isn't sociable at all. He has a rather mean temper and is always ready to fight."
        - id: ch01-b41
          speaker: old_mother_nature
          text: "As I told you, Grubby has done a great deal to make the soil of the plains fine and rich. On hillsides, though, he does great harm. Water runs through his tunnels and washes the soil away. Because of that and the damage he does to crops, people are his greatest enemies. Yet people have also given him splendid new foods that are easy to find. So even with traps and poison, the Gopher family grows faster than it once did."
        - id: ch01-b42
          speaker: old_mother_nature
          text: "Well, look who is finally here! It's about time."
        - id: ch01-b43
          speaker: narrator
          text: Shuffling, rattling, and grunting, Prickly Porky climbed onto an old stump. He looked peevish and thoroughly out of sorts. He had come to school very much against his will.
