  chapters:
    - id: ch01
      title: The Mice with Pockets
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: The next morning, as soon as everyone had arrived, Old Mother Nature began the lesson.
        - id: ch01-b02
          speaker: old_mother_nature
          text: "Pockets are very useful for small, thrifty folk who live mostly on tiny seeds. Without pockets to carry those seeds, some might never store enough food for the winter."
        - id: ch01-b03
          speaker: striped_chipmunk
          text: "I wouldn't give up my pockets for anything."
        - id: ch01-b04
          speaker: narrator
          text: Old Mother Nature smiled at him.
        - id: ch01-b05
          speaker: old_mother_nature
          text: "You certainly put yours to good use. But some animals need pockets even more. The Pocket Mice are among them, and those pockets are how they got their name. These pretty little mice live in the dry country of the Far West and Southwest, in the same region as Longfoot the Kangaroo Rat. They are his close neighbors and relatives."
        - id: ch01-b06
          speaker: old_mother_nature
          text: "Midget the Silky Pocket Mouse is one of the smallest animals in the Great World. Beside him, Whitefoot the Wood Mouse looks like a giant. Midget weighs less than an ounce, and he is a dear little fellow. His back and sides are yellow, while his underside is white. His long hind legs and long tail show at once that he is a jumper."
        - id: ch01-b07
          speaker: old_mother_nature
          text: "A pocket opens on the outside of each cheek, and both pockets are lined with hair. His coat is so fine and soft that he is called the Silky Pocket Mouse. Some of his cousins are larger. One is a little bigger than Nibbler the House Mouse. The Spiny Pocket Mice are also close neighbors and relatives."
        - id: ch01-b08
          speaker: peter_rabbit
          text: "Do they have spines like Prickly Porky?"
        - id: ch01-b09
          speaker: narrator
          text: Old Mother Nature laughed.
        - id: ch01-b10
          speaker: old_mother_nature
          text: "I can understand why you asked, Peter. I think Spiny Pocket Mouse is a silly name, because they have no spines at all. Their fur isn't as fine as Midget's. Long, coarse hairs grow through it, almost like bristles, and those hairs gave them their name."
        - id: ch01-b11
          speaker: old_mother_nature
          text: "The smallest Spiny Pocket Mouse is about as big as Nibbler, and the largest is twice that size. They are slimmer than their Silky cousins. Their tails are longer for their size and end in little tufts of hair. And of course, they have pockets in their cheeks."
        - id: ch01-b12
          speaker: old_mother_nature
          text: "All the Pocket Mice live in much the same way. They dig burrows in the ground and often throw up a little mound. Several entrances lead to a central passage, which connects to a bedroom and storerooms. During the day, the mice close the entrances from inside with earth. They come out only at night."
        - id: ch01-b13
          speaker: old_mother_nature
          text: "Some burrows are hidden beneath bushes, while others lie right out in the open. Pocket Mice live in hot, dry country, and they have learned to manage without drinking water. They feed mainly on many kinds of small seeds."
    - id: ch02
      title: The Grasshopper Mouse
      blocks:
        - id: ch02-b01
          speaker: old_mother_nature
          text: "Another western Mouse looks enough like Whitefoot to belong to his branch of the family. He wears a lovely yellowish-brown coat and a white waistcoat, and his feet are white too. But his tail is shorter than Whitefoot's. It is also quite thick instead of slim, and his fur feels like velvet. He is the Grasshopper Mouse."
        - id: ch02-b02
          speaker: peter_rabbit
          text: "Is he called that because he eats Grasshoppers?"
        - id: ch02-b03
          speaker: narrator
          text: Old Mother Nature laughed again.
        - id: ch02-b04
          speaker: old_mother_nature
          text: "That is exactly right. He is especially fond of Grasshoppers and Crickets. He also eats many other insects, including Moths, Flies, Cutworms, and Beetles. Lizards, Frogs, and Scorpions are on his menu as well. In some places, his taste for Scorpions has earned him the name Scorpion Mouse."
        - id: ch02-b05
          speaker: old_mother_nature
          text: "He likes meat whenever he can get it, though he eats many kinds of seeds too. You can find him throughout the West, from far up north to the hot, dry Southwest. If he cannot find a handy burrow that another animal has abandoned, he digs a home of his own. There he raises several families each year. Early in the evening, he often makes a thin, shrill whistle."
    - id: ch03
      title: The Harvest Mouse's Neat Home
      blocks:
        - id: ch03-b01
          speaker: old_mother_nature
          text: "The Harvest Mouse is another small member of the Mouse family, and he lives clear across the country. He is never larger than Nibbler the House Mouse and is often much smaller. In fact, he is one of the smallest Mice of all. He looks a good deal like Nibbler, but his coat is browner and fine hairs grow on his tail. He likes grassy, weedy, or brushy places."
        - id: ch03-b02
          speaker: old_mother_nature
          text: "Usually, he does people very little harm. Most of his food is made up of weed seeds, small wild fruits, and parts of wild plants that people do not value. Once in a while, there are so many Harvest Mice that they damage grain fields, but that seldom happens. The most interesting thing about this little Mouse is the way he makes his home."
        - id: ch03-b03
          speaker: old_mother_nature
          text: "Sometimes he settles in a hole in a tree or fence post. Sometimes he uses an old bird's nest. Most often, though, he builds his own nest. It is a small, round ball woven from grass and other plant material. He may place it among thick grass or weeds near the ground, or several feet up in a bush or low tree."
        - id: ch03-b04
          speaker: old_mother_nature
          text: "These little houses are well made. When one is in a bush or tree, it has one or more tiny doorways underneath. Inside is a warm, soft bed of milkweed or cattail down, just the sort of bed a baby Mouse could want. No one keeps a neater home than the Harvest Mouse."
        - id: ch03-b05
          speaker: old_mother_nature
          text: "He is as comfortable in bushes and low trees as Happy Jack Squirrel is in taller trees. His long tail is very useful there. He often curls it around a twig to give himself a safer foothold."
    - id: ch04
      title: Nibbler the House Mouse
      blocks:
        - id: ch04-b01
          speaker: old_mother_nature
          text: "And that is all about the native Mice, and... What is it, Peter?"
        - id: ch04-b02
          speaker: peter_rabbit
          text: "You forgot Nibbler the House Mouse."
        - id: ch04-b03
          speaker: old_mother_nature
          text: "Some little folk are terribly impatient. They worry that their curiosity will never be satisfied. As I was saying, that is all about our native Mice, the Mice that belong to this country. Now we come to Nibbler. Like Robber the Brown Rat, he has no business being here. But he followed people around the world, and like Robber, he became a pest to them."
        - id: ch04-b04
          speaker: narrator
          text: Peter looked rather ashamed when he realized that Old Mother Nature had not forgotten. He decided that next time he would keep quiet.
        - id: ch04-b05
          speaker: old_mother_nature
          text: "Have any of you ever seen Nibbler?"
        - id: ch04-b06
          speaker: danny_meadow_mouse
          text: "I have. Once, a shock of corn carried me to Farmer Brown's barn, and I found Nibbler living there."
        - id: ch04-b07
          speaker: old_mother_nature
          text: "I am surprised he wasn't living in Farmer Brown's house. Other members of his family probably were. Nibbler feels at home in any building people put up, just as Robber the Rat does. Because Nibbler is so small, he can squeeze into places Robber cannot reach. He loves to race through the spaces between walls."
        - id: ch04-b08
          speaker: old_mother_nature
          text: "Like every true Rodent, he is always gnawing. He chews holes in the corners of rooms and through to pantry shelves so he can steal food. He will eat almost anything. Yet he spoils more food by running over it than he actually eats. In barns and henhouses, he gets into the grain bins and steals a great deal of grain."
        - id: ch04-b09
          speaker: old_mother_nature
          text: "Robber and Nibbler are the main reason people keep those Cats you all dislike so much. A Cat is Nibbler's worst enemy. Nibbler is slim and graceful, with a long, hairless tail and fairly large ears. He is very timid. At the smallest sound, he is ready to dart into his hole."
        - id: ch04-b10
          speaker: old_mother_nature
          text: "Nibbler and his mate may have four to nine babies at once, and they raise several families in a year. When they live in a house, they make their nest from scraps of paper, cloth, wool, and other soft things stolen from the people there. They often cause a great deal of damage while gathering it. In a barn, they use hay and any other soft material they can find."
        - id: ch04-b11
          speaker: old_mother_nature
          text: "Nibbler would rather live in or near people's homes, but sometimes he is driven outside. Then he moves into the fields, especially in summer. Almost any hiding place will suit him, as long as it seems safe and food is close by."
        - id: ch04-b12
          speaker: old_mother_nature
          text: "I am sorry Nibbler ever came to this country. People brought him here, and now he is here to stay. He is just as much at home as if he belonged here with the rest of you."
    - id: ch05
      title: Beyond the Rodents
      blocks:
        - id: ch05-b01
          speaker: old_mother_nature
          text: "That brings our lessons about the Rodents to an end. All the animals in that order are related because they have teeth made for gnawing. I suppose they are the only animals that interest you. Perhaps you will not want to come to school anymore. Am I right?"
        - id: ch05-b02
          speaker: narrator
          text: Happy Jack the Gray Squirrel had once laughed at Peter Rabbit for wanting to attend school. This time, Happy Jack was the one who answered.
        - id: ch05-b03
          speaker: happy_jack
          text: "No, ma'am. There are many other folk in the Green Forest and on the Green Meadows that we want to know better. Isn't that right?"
        - id: ch05-b04
          speaker: narrator
          text: Happy Jack turned toward the others. Every one of them nodded, even Prickly Porky.
        - id: ch05-b05
          speaker: happy_jack
          text: "There is one little fellow who lives close by. He looks as though he belongs to the Mouse family, but he isn't like any Mouse you have told us about. He is so tiny that he can hide beneath a leaf. I feel sure he must be a Mouse."
        - id: ch05-b06
          speaker: narrator
          text: Old Mother Nature smiled at Happy Jack.
        - id: ch05-b07
          speaker: old_mother_nature
          text: "You mean Teeny Weeny the Shrew. He is not a Mouse, and he is not even a Rodent. I will try to bring him here tomorrow morning. Then we can learn about him and his relatives."
