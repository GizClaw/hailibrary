audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 亲切生动，带着温和的幽默感
        timbre: 温暖清亮
        pace: 舒缓而富有变化
        pitch: 中等
    peter_rabbit:
      display_name: 彼得兔
      tts:
        delivery: 好奇直率，情绪来得快也去得快
        timbre: 清脆稚气
        pace: 轻快
        pitch: 中高
    mother_nature:
      display_name: 老大自然妈妈
      tts:
        delivery: 慈爱睿智，说话从容而坦率
        timbre: 温厚柔和
        pace: 从容
        pitch: 中低
    striped_chipmunk:
      display_name: 花栗鼠条纹
      tts:
        delivery: 开朗谦和，机灵中带着几分自信
        timbre: 清亮柔和
        pace: 轻快
        pitch: 中高
    danny_meadow_mouse:
      display_name: 草地田鼠丹尼
      tts:
        delivery: 朴实谦逊，遇事谨慎又很有主见
        timbre: 温和结实
        pace: 稳健
        pitch: 中等
    happy_jack:
      display_name: 灰松鼠快乐杰克
      tts:
        delivery: 自信好胜，受窘时有些急躁
        timbre: 明亮爽脆
        pace: 轻快
        pitch: 中高
  chapters:
    - id: ch01
      title: 囊鼠的口袋
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 第二天早晨，大家一到齐，老大自然妈妈便讲起了口袋。小动物若是勤俭度日，又主要吃小种子，身上有口袋可就方便了。没有口袋把种子运回去，有些小家伙恐怕存不够过冬的粮食。
        - id: ch01-b02
          speaker: striped_chipmunk
          text: “反正我可离不开自己的口袋。”
        - id: ch01-b03
          speaker: narrator
          text: 老大自然妈妈笑了。
        - id: ch01-b04
          speaker: mother_nature
          text: “你的口袋确实派了不少用场。可还有些小家伙比你更需要口袋，囊鼠就是其中之一。他们的名字也是从口袋来的。这些漂亮的小家伙全住在遥远西部和西南部的干旱地区，和袋鼠鼠长脚生活在同一带，既是他的近邻，也是他的近亲。”
        - id: ch01-b05
          speaker: mother_nature
          text: “丝毛囊鼠小不点儿，是整个大千世界里最小的动物之一。白足站在他旁边，简直像个巨人。他还不到一盎司重，是个很可爱的小家伙。背部和两侧是黄色，腹部是白色。长长的后腿和尾巴一看就适合跳跃。两边面颊各有一个从外面开口、内壁长毛的口袋。”
        - id: ch01-b06
          speaker: mother_nature
          text: “小不点儿的外套又细又软，所以才叫丝毛囊鼠。他有几位个头更大的表亲，其中一位只比家鼠啃啃稍大。住在附近的刺毛囊鼠也是他们的近亲。”
        - id: ch01-b07
          speaker: peter_rabbit
          text: “刺毛囊鼠？他们也像刺刺那样，浑身长满硬刺吗？”
        - id: ch01-b08
          speaker: narrator
          text: 老大自然妈妈忍不住笑了。
        - id: ch01-b09
          speaker: mother_nature
          text: “难怪你会这样想。我也觉得这个名字有点儿傻，因为他们根本没有刺。他们的毛不如小不点儿的细软，里面却夹着许多长粗毛，几乎和硬鬃一样。刺毛囊鼠就是因此得名的。”
        - id: ch01-b10
          speaker: mother_nature
          text: “最小的刺毛囊鼠和啃啃差不多大，最大的足有他两个大。他们的身体比丝毛表亲修长。若和身体相比，他们的尾巴也显得更长，尾巴末端还带着一小簇毛。当然，面颊上的口袋一样不少。”
        - id: ch01-b11
          speaker: mother_nature
          text: “各种囊鼠的日子过得差不多。他们在地下挖洞，推出的土常堆成小丘。几个入口通进中央过道，过道再连着卧室和储藏室。白天，他们从里面用土封住入口，到了夜里才出来活动。”
        - id: ch01-b12
          speaker: mother_nature
          text: “有些洞藏在灌木下面，有些就在空地上。他们住惯了又热又干的地方，不喝水也能生活，平日主要吃各种小种子。”
    - id: ch02
      title: 吃蝗虫的老鼠
      blocks:
        - id: ch02-b01
          speaker: mother_nature
          text: “西部还有一种老鼠，模样和白足像极了，看起来简直应该算进白足那一支家族。他穿着漂亮的黄褐色外套和白背心，四只脚也是白的。可他的尾巴比白足的短，而且一点儿也不细，反倒粗得多。身上的毛像天鹅绒一样柔软。大家叫他蝗鼠。”
        - id: ch02-b02
          speaker: peter_rabbit
          text: “这名字是不是说，他爱吃蝗虫？”
        - id: ch02-b03
          speaker: mother_nature
          text: “正是。他特别、特别爱吃蝗虫和蟋蟀，还会捕食许多虫子，包括蛾、苍蝇、地老虎和甲虫。他连蜥蜴、青蛙和蝎子也吃。有些地方的人见他这样喜欢蝎子，干脆叫他蝎鼠。只要找得到肉，他总是很喜欢，当然，各种种子他也吃。”
        - id: ch02-b04
          speaker: mother_nature
          text: “从北方很远的地方，一直到西南部炎热干旱的地区，整个西部都有蝗鼠。若能找到别的动物丢下的合适洞穴，他便住进去。实在找不到，他就自己挖一个家，每年在那里养好几窝宝宝。傍晚刚来，他常会发出尖细清亮、像口哨一样的叫声。”
    - id: ch03
      title: 收获鼠的小圆屋
      blocks:
        - id: ch03-b01
          speaker: mother_nature
          text: “还有一种收获鼠，从这个国家的一头到另一头都能找到。他绝不会比啃啃更大，而且常常小得多，是整个鼠科里最小的成员之一。他看起来很像啃啃，不过外套更褐，尾巴上还长着细毛。他最爱青草、杂草和灌木茂密的地方。”
        - id: ch03-b02
          speaker: mother_nature
          text: “收获鼠主要吃杂草种子、小野果，还有人类用不着的野生植物，所以平时很少给人添麻烦。偶尔，他们的家族繁衍得实在太大，便会到谷田里造成一些损失，不过这种事并不常见。”
        - id: ch03-b03
          speaker: mother_nature
          text: “最有趣的是他造家的办法。有时他住在树洞或柱子的窟窿里，有时借用鸟儿废弃的旧巢。可他最常做的，是用青草和别的植物材料编成一个小圆球，把它安在贴近地面的浓草和杂草间，或是离地几英尺高的灌木和矮树上。”
        - id: ch03-b04
          speaker: mother_nature
          text: “那些小房子造得很结实。要是位于灌木或树上，底下会开一扇或几扇小门。里面铺着马利筋或香蒲的绒毛，又暖又软，正是最适合小宝宝的床。没有谁的家能比收获鼠的更整洁。”
        - id: ch03-b05
          speaker: mother_nature
          text: “他在灌木和矮树上活动，就像快乐杰克待在大树上一样自在。爬到枝头时，那条长尾巴特别有用。他把尾巴绕住细枝，脚下便站得更稳。”
    - id: ch04
      title: 家鼠啃啃
      blocks:
        - id: ch04-b01
          speaker: mother_nature
          text: “好了，本地土生土长的鼠类已经全讲完了，而且——彼得，你又怎么啦？”
        - id: ch04-b02
          speaker: peter_rabbit
          text: “你忘了家鼠啃啃！”
        - id: ch04-b03
          speaker: mother_nature
          text: “有些小家伙真着急，总怕自己的好奇心得不到满足。我说讲完的是本地鼠类，也就是原本属于这个国家的鼠类。现在才轮到啃啃。他和褐鼠强盗一样，本来不该在这里，却跟着人类走遍世界，也和强盗一样成了祸害。”
        - id: ch04-b04
          speaker: narrator
          text: 彼得这才发现，老大自然妈妈根本没忘。他有些难为情，暗暗决定以后要管好自己的舌头。
        - id: ch04-b05
          speaker: mother_nature
          text: “你们有谁见过啃啃吗？”
        - id: ch04-b06
          speaker: danny_meadow_mouse
          text: “我见过。有一次，我躲在一捆玉米秆里，被带进农夫布朗的谷仓。啃啃就住在那里。”
        - id: ch04-b07
          speaker: mother_nature
          text: “他竟然没住进农夫布朗的屋子，倒叫人意外。他家里别的成员多半住在里面。无论人类盖起什么房屋，他都能像大老鼠强盗一样住得自在。因为身体小，强盗钻不进的地方，他也能进去。他最爱在墙壁之间跑来跑去。”
        - id: ch04-b08
          speaker: mother_nature
          text: “啃啃是地地道道的啮齿目动物，总在不停地啃。他会咬穿房间的墙角，再啃出通往食品储藏室架子的入口，好进去偷吃。他什么都吃，却在食物上到处乱跑，糟蹋掉的比吃下的更多。在谷仓和鸡舍里，他还会钻进粮箱，偷走大量谷物。”
        - id: ch04-b09
          speaker: mother_nature
          text: “人类养那些你们都讨厌的猫，多半就是为了对付强盗和啃啃。猫是啃啃最可怕的敌人。啃啃身形纤细灵巧，长尾巴上没有毛，耳朵却不小。他胆子很小，听见一点儿声音就往洞里逃。他每胎生四到九个宝宝，一年能生好几窝。”
        - id: ch04-b10
          speaker: mother_nature
          text: “啃啃先生和太太要是住在人类的屋子里，就用纸片、布头、羊毛和其他柔软的东西筑窝。这些东西全是从屋里的人那里偷来的。为了搜集材料，他们常会造成很大破坏。若是住在谷仓里，他们便用干草和能找到的各种软材料造窝。”
        - id: ch04-b11
          speaker: mother_nature
          text: “啃啃最喜欢住在人类的房屋里，或是待在房屋附近。可有时他也会被赶出去，只好搬到田野上，夏天尤其如此。到了野外，他会利用各式各样的藏身处，根本不挑那是什么地方。只要住着安全，附近又找得到食物，他就心满意足了。”
        - id: ch04-b12
          speaker: mother_nature
          text: “我真遗憾啃啃来到了这个国家。人类把他带来，如今他再也不会离开了。他住得舒舒服服，就像你们这些原本属于这里的小家伙一样。”
    - id: ch05
      title: 下一堂课
      blocks:
        - id: ch05-b01
          speaker: mother_nature
          text: “啮齿目的课就到这里。这一目的动物都长着专门用来啃咬的牙齿，所以彼此有关联。我猜，你们只对这些动物有兴趣，以后不想再来上课了。对不对？”
        - id: ch05-b02
          speaker: happy_jack
          text: “不对，夫人。绿森林和绿草原还有那么多伙伴，我们想知道的事多着呢。大家说，是不是？”
        - id: ch05-b03
          speaker: narrator
          text: 这话是灰松鼠快乐杰克说的。你们还记得，他以前还笑话彼得兔想来上学呢。他转头望着伙伴们，大家全都点了头，连豪猪刺刺也点了。
        - id: ch05-b04
          speaker: happy_jack
          text: “附近就住着一个小家伙。我看他准是鼠科成员，可他跟你讲过的老鼠都不一样。他小得能躲在一片叶子下面。我敢肯定，他一定是老鼠。”
        - id: ch05-b05
          speaker: mother_nature
          text: “你说的是鼩鼱小小。他可不是老鼠，甚至连啮齿目动物也不是。明天早晨，我尽量请他过来。到时候，我们一起看看他和他的亲戚究竟是些什么样的小家伙。”
