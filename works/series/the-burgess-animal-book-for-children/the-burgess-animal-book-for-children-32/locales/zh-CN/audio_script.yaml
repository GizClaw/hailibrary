audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 亲切生动，带着温和的幽默感
        timbre: 温暖清亮
        pace: 舒缓而富有变化
        pitch: 中等
    mother_nature:
      display_name: 老大自然妈妈
      tts:
        delivery: 慈爱睿智，说话从容而坦率
        timbre: 温厚柔和
        pace: 从容
        pitch: 中低
    peter_rabbit:
      display_name: 彼得兔
      tts:
        delivery: 好奇直率，情绪来得快也去得快
        timbre: 清脆稚气
        pace: 轻快
        pitch: 中高
    johnny_chuck:
      display_name: 土拨鼠约翰尼
      tts:
        delivery: 直率倔强，懒洋洋中带着粗朴的自信
        timbre: 浑厚结实
        pace: 稍缓
        pitch: 中低
    buster_bear:
      display_name: 熊巴斯特
      tts:
        delivery: 豪爽风趣，低沉的话音里常带着顽皮笑意
        timbre: 深厚粗犷
        pace: 稍缓
        pitch: 低
    whitefoot:
      display_name: 白足林鼠
      tts:
        delivery: 胆小机敏，说话干脆而警觉
        timbre: 纤细清亮
        pace: 稍快
        pitch: 高
    chatterer:
      display_name: 红松鼠喋喋
      tts:
        delivery: 活泼好辩，话音利落而自信
        timbre: 明亮尖细
        pace: 快
        pitch: 中高
    prickly_porky:
      display_name: 豪猪刺刺
      tts:
        delivery: 老实迟缓，语气朴拙而认真
        timbre: 粗哑厚实
        pace: 缓慢
        pitch: 中低
    jumper_hare:
      display_name: 野兔跳跳
      tts:
        delivery: 爽快自信，说话直来直去
        timbre: 清朗
        pace: 轻快
        pitch: 中等
  chapters:
    - id: ch01
      title: 第三十二章　熊巴斯特差点搅散课堂
      blocks:
        - id: ch01-b01
          speaker: mother_nature
          text: “熊巴斯特有尾巴吗？”
        - id: ch01-b02
          speaker: narrator
          text: 老大自然妈妈问这句话时，眼睛里闪着笑意。
        - id: ch01-b03
          speaker: whitefoot
          text: “我说没有，巴斯特没有尾巴。”
        - id: ch01-b04
          speaker: chatterer
          text: “有，他明明有尾巴。”
        - id: ch01-b05
          speaker: mother_nature
          text: “豪猪刺刺，你怎么说？”
        - id: ch01-b06
          speaker: prickly_porky
          text: “我觉得他没有。就算有，我也从没见过。”
        - id: ch01-b07
          speaker: jumper_hare
          text: “那是你眼神不好。他当然有尾巴，只是小了点儿。我亲眼见过好多回，错不了。”
        - id: ch01-b08
          speaker: buster_bear
          text: “呜夫，呜夫！这里在做什么？你们说谁没有尾巴呀？”
        - id: ch01-b09
          speaker: narrator
          text: 一个低沉、轰隆隆又闷声闷气的嗓音突然传来。有那么几分钟，课堂眼看就要散了。小家伙们没命似的四下奔逃，就像狐狸雷迪意外出现的那个早晨。不过，两次逃跑也有不同。雷迪出现时，大多数伙伴都钻进了安全的藏身处。这一回，他们只跑到安全的距离，便停下脚步，满怀敬畏地回头张望。那个嗓音的主人，正是高大魁梧的熊巴斯特。
        - id: ch01-b10
          speaker: narrator
          text: 巴斯特像人一样用后腿站起来。他那双与庞大身躯很不相称的小眼睛含着笑，望向围在四周的伙伴。
        - id: ch01-b11
          speaker: buster_bear
          text: “别因为我耽误上课。我听说了这所学校，就想来友好地拜访一下。你们不必害怕，我才吃过早饭，现在连一口也吃不下。就算是白足林鼠这样鲜嫩的小点心，我也吃不下啦。”
        - id: ch01-b12
          speaker: narrator
          text: 白足赶紧又退远一点儿。巴斯特从喉咙深处笑了几声，转头看向老大自然妈妈。
        - id: ch01-b13
          speaker: buster_bear
          text: “您快告诉他们，我是整个大千世界里脾气最好、最不会伤人的家伙。”
        - id: ch01-b14
          speaker: mother_nature
          text: “那得看你的肚子有多饱。要是真像你说的那样，我相信你不会对我撒谎，那么连胆小的白足也不用怕你。”
        - id: ch01-b15
          speaker: narrator
          text: 老大自然妈妈叫所有小家伙放下恐惧，重新回来。可几个胆子最小的伙伴仍旧害怕，不敢靠近。巴斯特见了，便往后退了一小段路，用后腿坐了下来。
        - id: ch01-b16
          speaker: buster_bear
          text: “我刚才走过来时，听见你们在谈尾巴。究竟是怎么回事？”
        - id: ch01-b17
          speaker: mother_nature
          text: “大家在争论你有没有尾巴。有人说有，有人说没有。白足就认为你没有。”
        - id: ch01-b18
          speaker: narrator
          text: 巴斯特又低声笑起来。
        - id: ch01-b19
          speaker: buster_bear
          text: “白足从来不敢盯着我看，哪里知道我有没有尾巴？直到今天，每回我见到他，他都在前面拼命逃，我就在后面追。他连头也不回，怎么看得见我的尾巴？”
        - id: ch01-b20
          speaker: peter_rabbit
          text: “那你到底有没有？”
        - id: ch01-b21
          speaker: buster_bear
          text: “你觉得呢？”
        - id: ch01-b22
          speaker: peter_rabbit
          text: “我觉得有。可你现在正坐在上面，我根本看不见。反正肯定大不到哪儿去。”
        - id: ch01-b23
          speaker: buster_bear
          text: “说得对，彼得，一点儿不错。我的确有尾巴，只是小得几乎不能算尾巴。”
        - id: ch01-b24
          speaker: narrator
          text: 巴斯特安安稳稳坐在那里，大家终于有了一个绝好的机会，可以仔细看看他的模样。他的外衣通身乌黑。其实，除了鼻子是棕色的，他从头到脚全是黑的。长长的皮毛有些蓬乱，耳朵圆圆的。两只大脚掌上，还长着强壮而吓人的利爪。
        - id: ch01-b25
          speaker: mother_nature
          text: “你们都看到巴斯特的外衣有多黑了。可有件事也许会让你们吃惊。红狐当中有黑色的，黑熊当中也有棕色的。”
        - id: ch01-b26
          speaker: buster_bear
          text: “您说什么？”
          emotion: surprised
        - id: ch01-b27
          speaker: narrator
          text: 巴斯特哼了一声，脸上的惊讶神情滑稽极了。
        - id: ch01-b28
          speaker: mother_nature
          text: “这是真的。你们家族有许多成员住在大西部的山区，那里常有通身棕色的黑熊。人们过去以为他们是另一种熊，便叫他们肉桂熊。过了很久才弄明白，这些棕熊其实也是黑熊。”
        - id: ch01-b29
          speaker: mother_nature
          text: “有时，一对双胞胎熊宝宝，一个通身乌黑，另一个却浑身棕色。有些黑熊胸前还会长出一块白斑。巴斯特这一支几乎遍布全国所有有树林的地方。在阳光灿烂的南方，他们住在沼泽里。不过，那里的黑熊长得不如北方的同类高大。”
        - id: ch01-b30
          speaker: mother_nature
          text: “巴斯特，那边有块松软的地面。请你从上面走过去，让大家看看你的脚印。”
        - id: ch01-b31
          speaker: narrator
          text: 巴斯特好脾气地落下两条前腿，四脚着地，从那块软土上走了过去。大家马上明白老大自然妈妈为什么要他这样做。他后脚留下的印迹，很像布朗农夫家的男孩赤脚踩出的脚印，只是当然要大得多。不光脚掌，就连脚后跟也清清楚楚。
        - id: ch01-b32
          speaker: mother_nature
          text: “巴斯特走路时，整个脚掌都会落在地上。狗科和猫科的成员却全都踮着脚趾走。像巴斯特这样，把整个脚掌踩在地上的动物，叫作跖行动物。你们猜，他刚出生时有多大？”
        - id: ch01-b33
          speaker: chatterer
          text: “我只能猜猜。他现在这么大，刚出生时准是个又壮又大的胖娃娃。”
        - id: ch01-b34
          speaker: mother_nature
          text: “难怪你会这样想。可事实正好相反。巴斯特刚出生时又小又娇弱，差不多只有刺刺的一个小宝宝那么大，也不过一只大老鼠的大小。他生在隆冬，四十天以后才睁开眼睛。足足过了两个月，他才第一次从出生的洞穴里探出头，想看看外面的大千世界是什么模样。”
        - id: ch01-b35
          speaker: mother_nature
          text: “那时，他还没有彼得兔大多少。他和孪生妹妹是一对活泼的小家伙，也是一对十足的淘气包。绿森林里从没见过比他们更能闯祸的小熊。巴斯特，现在请你告诉大家，你平常靠什么过活。”
        - id: ch01-b36
          speaker: buster_bear
          text: “凡是能吃的，我都吃，而我差不多什么都能吃。许多人以为，我专靠吃住在附近的小家伙过活，那可错了。不过，要是运气好，碰见老鼠躲在我挖得到的地方，我的确会捉来吃。老鼠的味道真不错。”
        - id: ch01-b37
          speaker: narrator
          text: 白足林鼠和草原鼠丹尼一听，赶紧又逃远了。巴斯特眼里闪着顽皮的光。
        - id: ch01-b38
          speaker: buster_bear
          text: “要是运气好，能捉到兔子，我也不会嫌弃。”
        - id: ch01-b39
          speaker: narrator
          text: 彼得兔立刻往后退了几步。
        - id: ch01-b40
          speaker: buster_bear
          text: “其实什么肉我都喜欢，可我吃的大部分东西根本不是肉。春天里，我会挖出各种草根，吃鲜嫩的草芽，也啃幼树的树皮和嫩枝。昆虫一出现，可就帮了大忙。我最爱蚂蚁。找到朽木，我就把它翻过来。找到老树桩，我就把它撕开。里面差不多总有蚂蚁和蚂蚁卵，我会舔得干干净净。”
        - id: ch01-b41
          speaker: buster_bear
          text: “不管什么昆虫，只要数量够多，吃起来都香。我还特别爱找那些把家安在地下的黄蜂，再把黄蜂窝挖开。当然，你们大概都知道，世上最合我心意的还是蜂蜜。只要找到一个蜂巢，我便快活极了。为了吃到里面的蜂蜜，蜜蜂怎么蜇我，我都甘愿忍着。”
        - id: ch01-b42
          speaker: buster_bear
          text: “我喜欢鱼，也爱捉青蛙。浆果成熟时，我能大吃一通，那段日子简直像在享用一场盛宴。到了秋天，我靠山毛榉果和橡子把自己吃得肥肥的。说真的，我不爱吃的东西没有几样。”
        - id: ch01-b43
          speaker: johnny_chuck
          text: “我听说你整个冬天都在睡觉。”
        - id: ch01-b44
          speaker: buster_bear
          text: “那得看这个冬天是什么样。不到非睡不可时，我不会睡。只要还能找到足够的食物，我便会醒着。要是冬天来得早，坏天气也跟着来了，我就找个洞穴，或者钻到一大堆倒木下面。要是能找到一根足够容下我的空心木头，也可以住进去。我会先铺一张舒服的树叶床，再睡过余下的整个冬天。”
        - id: ch01-b45
          speaker: buster_bear
          text: “可要是冬季温和，土地没有封冻，还有机会找到食物，我就只在天气实在恶劣时睡觉。”
        - id: ch01-b46
          speaker: johnny_chuck
          text: “你睡觉以前，也会像我一样，设法把自己吃胖吗？”
        - id: ch01-b47
          speaker: narrator
          text: 巴斯特咧嘴笑了。
        - id: ch01-b48
          speaker: buster_bear
          text: “会呀，约翰尼，而且通常都能成功。我得靠这一身脂肪保暖，春天里也得靠它活下去，和你完全一样。”
        - id: ch01-b49
          speaker: johnny_chuck
          text: “我还听说你会爬树。可我不住在绿森林，从没亲眼见过。像你这么大的家伙，爬起树来一定慢吞吞的吧。”
        - id: ch01-b50
          speaker: narrator
          text: 巴斯特抬头看看快乐杰克松鼠，还朝他眨了眨眼。接着，他走到快乐杰克坐着的树下，直起身子，猛然手脚并用地爬了上去。巴斯特上树的速度快得很，哪里有半点儿慢吞吞的样子。快乐杰克突然吓得尖叫起来，使出自己最拿手的本领，飞快地冲向树顶，又纵身一跃，跳到旁边那棵树上。
        - id: ch01-b51
          speaker: narrator
          text: 巴斯特爬到一半停下来，尾巴朝下往回退。离地面还有十英尺时，他干脆松开四肢，直接落到地上。
        - id: ch01-b52
          speaker: buster_bear
          text: “我这样做，是想让你们看看，我真正赶时间时怎样下树。如今，除非是为了蜂蜜，我不大爬树了。可我小时候最喜欢爬树。”
        - id: ch01-b53
          speaker: narrator
          text: 巴斯特忽然坐得笔直，把鼻子抬到风中，脸上渐渐露出不安。他竖起耳朵，用尽全力听了一会儿，随后落下前腿，四脚着地。
        - id: ch01-b54
          speaker: buster_bear
          text: “失陪了，我想我最好该走了。布朗农夫正沿着孤独小径往这边来。”
        - id: ch01-b55
          speaker: narrator
          text: 巴斯特转过身，一眨眼就不见了。像他这样看起来笨手笨脚的大家伙，居然能跑得那么快，实在叫人吃惊。老大自然妈妈笑了。
        - id: ch01-b56
          speaker: mother_nature
          text: “巴斯特的眼睛不大好，可鼻子和耳朵一点儿毛病也没有。他说布朗农夫正沿孤独小径走来，就绝不会错，哪怕布朗农夫现在还在相当远的地方。巴斯特很聪明，早就明白自己完全有理由害怕人类。所以，只要有一点儿迹象说明附近有人，他便马上躲开。”
        - id: ch01-b57
          speaker: mother_nature
          text: “有趣的是，大多数人也像巴斯特怕他们那样害怕巴斯特，其实他们根本不用怕。说到面对人类，你们这些小家伙里，没有谁比巴斯特更胆小。哪怕只闻到一点儿人的气味，他也会立刻转身逃跑。”
        - id: ch01-b58
          speaker: mother_nature
          text: “只有受了伤，或者被逼到无路可退时，巴斯特才会搏斗。熊太太为了保护自己的宝宝，也会奋起反击。只有在这两种情形下，黑熊才会正面迎战人类。”
        - id: ch01-b59
          speaker: mother_nature
          text: “你们觉得巴斯特很大，他的确很大。可他的亲戚当中，还有比他大得多的。其中有一位要是站在他身边，会衬得巴斯特简直像个小个子。接下来，我就给你们讲讲巴斯特的这些表亲。”
