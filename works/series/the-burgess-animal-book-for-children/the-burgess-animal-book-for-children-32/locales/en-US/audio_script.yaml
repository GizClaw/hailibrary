  chapters:
    - id: ch01
      title: Buster Bear Nearly Breaks Up School
      blocks:
        - id: ch01-b01
          speaker: old_mother_nature
          text: "Does Buster Bear have a tail?"
        - id: ch01-b02
          speaker: narrator
          text: Old Mother Nature's eyes twinkled as she asked the question.
        - id: ch01-b03
          speaker: whitefoot
          text: "No, he doesn't."
        - id: ch01-b04
          speaker: chatterer
          text: "Yes, he does."
        - id: ch01-b05
          speaker: old_mother_nature
          text: "What do you think, Prickly Porky?"
        - id: ch01-b06
          speaker: prickly_porky
          text: "I don't think he has one. If he does, I've never seen it."
        - id: ch01-b07
          speaker: jumper
          text: "That's because your eyes aren't very good. He certainly has a tail. It isn't much of one, but I've seen it many times."
        - id: ch01-b08
          speaker: buster
          text: "Woof, woof! What's happening here? Who hasn't got a tail?"
        - id: ch01-b09
          speaker: narrator
          text: That deep, rumbly, grumbly voice nearly broke up school for the day. Everyone scrambled madly to get away, just as they had when Reddy Fox appeared unexpectedly one morning. There was one difference. When Reddy came, most of the little people found safe hiding places. Now they merely ran to a safe distance. From there they turned and stared with awe and enormous respect. The owner of that voice was great, big Buster Bear himself.
        - id: ch01-b10
          speaker: narrator
          text: Buster rose onto his hind legs and stood like a man. His eyes were small, at least for an animal of his great size. They shone with fun as he looked all around the circle of little people who still stared at him in awe.
        - id: ch01-b11
          speaker: buster
          text: "Please don't let me interrupt. I heard about this school, so I thought I'd make a friendly visit. You have nothing to fear. I've just eaten breakfast, and I couldn't manage another bite even if I had to. Not even a tender little mouthful like Whitefoot the Wood Mouse."
        - id: ch01-b12
          speaker: narrator
          text: Whitefoot hurried a little farther away, and Buster chuckled. Then Buster turned to Old Mother Nature.
        - id: ch01-b13
          speaker: buster
          text: "Won't you tell them I'm the most harmless, good-natured fellow in the whole Great World?"
        - id: ch01-b14
          speaker: old_mother_nature
          text: "That depends on how full your stomach is. If it's as full as you say, and I know you wouldn't lie to me, then even timid Whitefoot is safe with you."
        - id: ch01-b15
          speaker: narrator
          text: Old Mother Nature told everyone to set aside their fear and come back. Some of the most timid still held back, so Buster moved away a short distance and sat on his haunches.
        - id: ch01-b16
          speaker: buster
          text: "What was that I heard about a tail as I came up?"
        - id: ch01-b17
          speaker: old_mother_nature
          text: "We were discussing whether you have a tail. Some say you do, and some say you don't. Whitefoot thinks you haven't got one."
        - id: ch01-b18
          speaker: narrator
          text: Buster chuckled again, deep in his throat.
        - id: ch01-b19
          speaker: buster
          text: "Whitefoot has never looked at me long enough to find out. Until today, every time I've seen him, he was running away as fast as his legs could carry him. I was always behind him, so how could he see whether I had a tail?"
        - id: ch01-b20
          speaker: peter
          text: "Well, do you have one?"
        - id: ch01-b21
          speaker: buster
          text: "What do you think?"
        - id: ch01-b22
          speaker: peter
          text: "I think you do. But you're sitting on it, so I can't tell. It can't be much of a tail, anyway."
        - id: ch01-b23
          speaker: narrator
          text: Buster chuckled once more.
        - id: ch01-b24
          speaker: buster
          text: "You're exactly right, Peter. I have a tail, but there's hardly enough of it to call a tail at all."
        - id: ch01-b25
          speaker: narrator
          text: While Buster sat there, everyone had a fine chance to study exactly what he looked like. His coat was black. In fact, he was black all over except for his brown nose. Long, rather shaggy fur covered him. His ears were round. His paws were huge, and each one carried strong claws that looked quite wicked.
        - id: ch01-b26
          speaker: old_mother_nature
          text: "You can all see Buster's black coat. Now here's something that may surprise you. Just as some Red Foxes are black, some Black Bears are brown."
        - id: ch01-b27
          speaker: buster
          text: "What's that?"
          emotion: surprised
        - id: ch01-b28
          speaker: old_mother_nature
          text: "It's a fact, Buster. A great many members of your family live among the mountains of the Far West. Quite often, one of those bears is brown all over. People used to believe these brown bears were a different kind of bear, so they called them Cinnamon Bears. A long, long time passed before people learned that the brown ones were really Black Bears."
        - id: ch01-b29
          speaker: old_mother_nature
          text: "Sometimes a pair of twin cubs will have different colors. One baby will be entirely black, while the other will be entirely brown. Some members of Buster's family also have a white patch on the breast. His branch of the family lives in nearly every wooded part of the whole country. Down in the Sunny South, they make their homes in the swamps, and they do not grow as large there as they do in the North."
        - id: ch01-b30
          speaker: old_mother_nature
          text: "Buster, please walk across that soft patch of ground. I want everyone to see your footprints."
        - id: ch01-b31
          speaker: narrator
          text: Good-natured Buster dropped onto all fours and walked across the soft ground. At once, everyone understood why Old Mother Nature had asked him to do it. The prints of his hind feet looked very much like the prints Farmer Brown's boy left when he went barefoot. Of course, Buster's prints were much larger. They showed his heel along with the rest of his foot.
        - id: ch01-b32
          speaker: old_mother_nature
          text: "Buster places his whole foot on the ground. Members of the Dog and Cat families walk entirely on their toes. An animal that sets down its whole foot is called plantigrade. Now, how large do you suppose Buster was when he was born?"
        - id: ch01-b33
          speaker: chatterer
          text: "I'm only guessing, but he's such a big fellow that he must have been a great big baby."
        - id: ch01-b34
          speaker: old_mother_nature
          text: "I understand why you'd think that. But Buster was tiny and helpless. He was about the size of one of Prickly Porky's babies, no larger than a Rat. He was born in midwinter, and his eyes stayed closed for forty days."
        - id: ch01-b35
          speaker: old_mother_nature
          text: "Two whole months passed before he poked his head outside the den where he had been born. That was his first look at what the Great World was like. Even then, he was hardly bigger than Peter Rabbit. He and his twin sister were a wonderfully lively pair of youngsters. They were as full of mischief as any young bears the Green Forest had ever known. Buster, perhaps you can tell us what you eat."
        - id: ch01-b36
          speaker: narrator
          text: Buster's eyes flashed.
        - id: ch01-b37
          speaker: buster
          text: "I live on anything I can eat, and I can eat almost everything. I suppose plenty of people believe I live almost entirely on the little people who are my neighbors. That isn't true. I do catch Mice when I'm lucky enough to find them in a place where I can dig them out. And yes, they certainly make good eating."
        - id: ch01-b38
          speaker: narrator
          text: Whitefoot and Danny Meadow Mouse quickly scurried farther away. Mischief twinkled in Buster's eyes.
        - id: ch01-b39
          speaker: buster
          text: "I don't object to a Rabbit, either, if I'm lucky enough to catch one."
        - id: ch01-b40
          speaker: narrator
          text: Peter Rabbit backed away a few steps.
        - id: ch01-b41
          speaker: buster
          text: "In fact, I enjoy meat of any kind. But the greater part of my food isn't meat at all. In spring, I dig up many different kinds of roots. I eat the tender new shoots of grass. I also take some bark and twigs from young trees. Then the insects begin to appear, and they help fill out my meals wonderfully."
        - id: ch01-b42
          speaker: buster
          text: "I'm especially fond of Ants. I turn over every old log I can and tear apart every old stump I find. There are almost always Ants and their eggs inside, and I lick them right up. Almost any kind of insect tastes good to me when there are enough of them. I also love finding the nests of Wasps that make their homes underground and digging those nests open."
        - id: ch01-b43
          speaker: buster
          text: "And of course you must all know that there is nothing in the world I like better than honey. Finding a Bee nest makes me perfectly happy. I'll willingly stand there and take every sting the Bees can give me, all for the honey. I like fish, and I love hunting Frogs. When berry season begins, I simply feast. Then in fall I grow fat on beechnuts and acorns. The truth is, there really isn't much I don't like."
        - id: ch01-b44
          speaker: johnny
          text: "I've heard that you sleep through the whole winter."
        - id: ch01-b45
          speaker: buster
          text: "That depends on what kind of winter it is. I don't go to sleep until I have to, and I don't have to as long as I can find enough food. If winter starts early and the weather turns bad, I make myself a comfortable bed of leaves. I may put it in a cave, beneath a great pile of fallen trees, or even inside a hollow log if I can find one big enough. Then I settle down and sleep through the rest of winter."
        - id: ch01-b46
          speaker: buster
          text: "But when winter stays mild and open, and there may still be food to find, I sleep only during the truly bad weather."
        - id: ch01-b47
          speaker: johnny
          text: "Do you try to get fat before you sleep, the way I do?"
        - id: ch01-b48
          speaker: narrator
          text: Buster grinned.
        - id: ch01-b49
          speaker: buster
          text: "Yes, Johnny, I do, and I usually manage it. I need that fat to keep me warm and to live on in spring, just as you do."
        - id: ch01-b50
          speaker: johnny
          text: "People say you can climb. I don't live in the Green Forest, so I've never watched you. For a fellow as big as you, climbing a tree must be slow work."
        - id: ch01-b51
          speaker: narrator
          text: Buster looked up at Happy Jack Squirrel and winked. Then he went to the tree where Happy Jack sat. Buster stood and suddenly scrambled up the trunk. There was nothing slow about him.
        - id: ch01-b52
          speaker: narrator
          text: Happy Jack squealed with sudden fright and raced for the treetop as only Happy Jack could climb. Then he made a flying leap into the next tree. Buster stopped halfway up the first tree. He turned and started down again, coming tail first. When he was still ten feet above the ground, he simply let go and dropped the rest of the way.
        - id: ch01-b53
          speaker: buster
          text: "I did that to show you how I leave a tree when I'm in a real hurry. These days I don't climb much unless I'm after honey. When I was little, though, I loved climbing trees."
        - id: ch01-b54
          speaker: narrator
          text: Suddenly Buster sat up very straight and pointed his nose into the wind. An anxious look slowly crept over his face. He cocked his ears as though he were listening with all his might. That was exactly what he was doing. After a moment, he dropped onto all fours.
        - id: ch01-b55
          speaker: buster
          text: "Excuse me, but I'd better go. Farmer Brown is coming down the Lone Little Path."
        - id: ch01-b56
          speaker: narrator
          text: Buster turned and vanished with astonishing speed for someone who looked so clumsy. Old Mother Nature laughed.
        - id: ch01-b57
          speaker: old_mother_nature
          text: "Buster's eyesight isn't very good, but there is nothing wrong with either his nose or his ears. If he says Farmer Brown is coming along the Lone Little Path, then Farmer Brown is surely there, though he may still be some distance away. Buster has been wise enough to learn that he has every reason to fear people. At the very first hint that anyone is near, he promptly gets out of the way."
        - id: ch01-b58
          speaker: old_mother_nature
          text: "The funny thing is that most men fear Buster just as much as he fears them, though they have no need to be afraid. When people are involved, not one of you little folk is more timid than Buster Bear. The faintest human scent is enough to make him run. If he were wounded or cornered, then he would fight. Mrs. Bear would also fight to defend her babies. Those are the only conditions under which a Black Bear will face a person."
        - id: ch01-b59
          speaker: old_mother_nature
          text: "You think Buster is large, and he is. But some of his relatives are much larger. Beside one of them, Buster would actually look small. I'll tell you a little about those cousins of his."
