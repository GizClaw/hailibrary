audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 亲切生动，带着温和的幽默感
        timbre: 温暖清亮
        pace: 舒缓而富有变化
        pitch: 中等
    mother_nature:
      display_name: 老大自然妈妈
      tts:
        delivery: 慈爱睿智，说话从容而坦率
        timbre: 温厚柔和
        pace: 从容
        pitch: 中低
    peter_rabbit:
      display_name: 彼得兔
      tts:
        delivery: 好奇直率，情绪来得快也去得快
        timbre: 清脆稚气
        pace: 轻快
        pitch: 中高
    jumper_hare:
      display_name: 长耳野兔跳跳
      tts:
        delivery: 朴实腼腆，认真时透着好奇
        timbre: 清朗柔和
        pace: 稍缓
        pitch: 中等
    chatterer:
      display_name: 红松鼠喋喋
      tts:
        delivery: 伶牙俐齿，争强好胜又活泼
        timbre: 尖细清亮
        pace: 明快
        pitch: 高
    striped_chipmunk:
      display_name: 花栗鼠条纹
      tts:
        delivery: 开朗谦和，机灵中带着几分自信
        timbre: 清亮柔和
        pace: 轻快
        pitch: 中高
    jimmy_skunk:
      display_name: 臭鼬吉米
      tts:
        delivery: 慢条斯理，和气自信，偶尔带点机智的反驳
        timbre: 圆润沉稳
        pace: 舒缓
        pitch: 中低
    whitefoot:
      display_name: 林鼠白足
      tts:
        delivery: 谨慎机敏，胆怯中透着清醒和坦然
        timbre: 轻柔清澈
        pace: 稍快而小心
        pitch: 中高
  chapters:
    - id: ch01
      title: 第二十四章　影子和他的家族
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 第二天早晨一开课，小居民们一个不缺，全都到齐了。除了臭鼬吉米和豪猪刺刺，大家听见影子鼬的名字就害怕。可越是害怕，越得把他的事弄明白，所以谁也不肯缺席。说不定哪天撞见影子追来，今天学到的知识就能救命。
        - id: ch01-b02
          speaker: mother_nature
          text: “条纹，你对影子鼬有些了解。说给大家听听吧。”
        - id: ch01-b03
          speaker: striped_chipmunk
          text: “我只知道，我恨他！”
          emotion: angry
        - id: ch01-b04
          speaker: narrator
          text: 伙伴们听了，一齐点头。
        - id: ch01-b05
          speaker: striped_chipmunk
          text: “他的好处，我一件也不知道，坏处倒能说出一大堆。我最怕的就是他。我能走的路，他都能走。我钻得进的洞，他也钻得进。这辈子我只见过他两次，但愿以后一次也别再见！”
        - id: ch01-b06
          speaker: mother_nature
          text: “影子长什么模样？”
        - id: ch01-b07
          speaker: striped_chipmunk
          text: “就像一条长了腿的蛇！他身子细长，扭转起来特别灵活。论长度，他和喋喋差不多，可他的身子和脖子都那么细长，瞧着就长多了。背上是棕色，肚皮是白色。前脚雪白，后脚只是有些发白。那条又短又圆的尾巴，尖端却是黑的。”
        - id: ch01-b08
          speaker: striped_chipmunk
          text: “他脑袋小小的，脸尖尖的，怎么看都叫我想起蛇。呃，我一点儿也不愿意再想他！”
          emotion: disgusted
        - id: ch01-b09
          speaker: jumper_hare
          text: “我见过的影子根本不是棕色。除了尾巴尖，条纹全说错啦。他从头到脚都是白的，只有尾巴尖是黑色。”
        - id: ch01-b10
          speaker: mother_nature
          text: “你们两个都没说错。条纹在夏天见到他，跳跳在冬天见到他。跳跳，影子和你一样，会随着季节换外衣。到了冬天，人们为了毛皮捕捉他，也不再叫他黄鼠狼，而叫他白鼬。”
        - id: ch01-b11
          speaker: jumper_hare
          text: “噢，原来是这样。”
        - id: ch01-b12
          speaker: narrator
          text: 跳跳看上去有一点儿难为情。
        - id: ch01-b13
          speaker: mother_nature
          text: “条纹，你见到影子时，他在做什么？”
        - id: ch01-b14
          speaker: striped_chipmunk
          text: “他在打猎，在追我！”
          emotion: fearful
        - id: ch01-b15
          speaker: narrator
          text: 条纹说着，浑身打了个寒战。
        - id: ch01-b16
          speaker: striped_chipmunk
          text: “我捡山毛榉果时留下了脚印，他找到以后，就把鼻子贴着地面一路追踪，跟猎犬鲍泽追狐狸雷迪一模一样。我一看见他，差点儿活活吓死。”
          emotion: fearful
        - id: ch01-b17
          speaker: chatterer
          text: “你居然逃掉了，真是命大。”
        - id: ch01-b18
          speaker: striped_chipmunk
          text: “我知道，我当然知道。”
        - id: ch01-b19
          speaker: narrator
          text: 条纹又打了个寒战。
        - id: ch01-b20
          speaker: striped_chipmunk
          text: “当时狐狸雷迪恰好经过，把影子吓走了，要不然我哪还能坐在这里。从那以后，我倒觉得雷迪比从前亲切了一些。”
        - id: ch01-b21
          speaker: jumper_hare
          text: “我碰见影子那次，跑得比一生中哪次都快。他也是鼻子贴着雪地追我，我怎么转弯，他就怎么追。幸亏他的尾巴尖是黑的，我才及时看见他。再晚一点儿，我就逃不掉了。”
        - id: ch01-b22
          speaker: jimmy_skunk
          text: “呸！你这么大，竟然会被我那个小小的表亲追得逃命！”
        - id: ch01-b23
          speaker: jumper_hare
          text: “逃跑有什么丢脸？我个头再大，也快不过他，跟他交手一点儿胜算都没有。只要觉得影子在附近，我就去别的地方，能走多远便走多远。我要是会像喋喋那样爬树，那才不一样。”
        - id: ch01-b24
          speaker: chatterer
          text: “一样，一样！影子爬树几乎和我一样好。有一回，我从一棵树远远跳到另一棵，他跳不过去，我才保住了命。他找到我住的树洞，幸好他登门时我不在家。等我刚回来，他猛地从洞里蹿出来，吓得我只能拼命逃！”
          emotion: fearful
        - id: ch01-b25
          speaker: whitefoot
          text: “影子是整个大千世界里最可怕的家伙。”
        - id: ch01-b26
          speaker: narrator
          text: 臭鼬吉米忍不住笑出了声。
        - id: ch01-b27
          speaker: jimmy_skunk
          text: “你才见过多少大千世界呀？今天你离家的距离，已经是这辈子最远的一回，可我几分钟就能走到你家。凭什么说影子是世上最可怕的家伙？”
        - id: ch01-b28
          speaker: whitefoot
          text: “我就是知道！”
        - id: ch01-b29
          speaker: narrator
          text: 白足的嗓音虽然尖细，口气却十分肯定。
        - id: ch01-b30
          speaker: whitefoot
          text: “影子杀生，只因为他喜欢杀。不管个头多大的家伙，也做不出更可怕的事。我有很多敌人，有时简直觉得每个邻居都想吃老鼠大餐。可除了影子，他们都是饿了、需要食物时才来捉我。这个我能原谅，谁都得吃东西才能活着。”
        - id: ch01-b31
          speaker: whitefoot
          text: “影子就不同了。哪怕肚子已经撑得什么也吃不下，他还是会追杀我。他就是爱杀生，还觉得这样很快活。这才叫人害怕。”
        - id: ch01-b32
          speaker: mother_nature
          text: “白足说得对。要是影子长得和熊巴斯特、美洲狮，甚至猞猁蓬蓬一样大，他那股可怕的杀戮欲，会让他成为整个大千世界里最恐怖的生灵。”
          emotion: sad
        - id: ch01-b33
          speaker: mother_nature
          text: “他的性情暴烈，脾气急，什么都不怕。哪怕被强大得多的敌人堵住，明知没有胜算，他也会战到最后一口气。可惜，除了自己的家人，他对谁都没有善意，也没有温情。世上没有一个朋友属于他，一个也没有。”
          emotion: sad
        - id: ch01-b34
          speaker: peter_rabbit
          text: “难道他连一个敌人也没有吗？”
        - id: ch01-b35
          speaker: mother_nature
          text: “当然有。影子得提防狐狸雷迪、老郊狼、猫头鹰胡迪和鹰族的好些成员，不过这些敌人不太能难住他。他动作快得惊人，一闪就没了踪影。想捉住他，自己非得快到极点不可。再说，他几乎总守在方便躲藏的地方附近。”
        - id: ch01-b36
          speaker: mother_nature
          text: “影子喜欢老石墙、乱石堆、长满灌木的篱笆、垃圾堆、谷仓和破旧房屋。这些地方也是老鼠最爱去的，到处都能找到洞。危险一来，他只消往洞里一钻，立刻就安全了。”
        - id: ch01-b37
          speaker: mother_nature
          text: “他只要来了兴致便出去打猎，不论白天还是黑夜，一次常常能跑过相当远的路。当然，这点路比不上他那位个头大、毛色棕、爱玩水的表亲水貂比利。影子能在眨眼间消失，所以大家才叫他影子。”
        - id: ch01-b38
          speaker: mother_nature
          text: “影子的名字可不少。普通黄鼠狼、短尾黄鼠狼、棕黄鼠狼、波拿巴黄鼠狼和白鼬，说的都是他。这个国家北部凡是有森林的地方，都能找到影子。东部稍微靠南些，住着一位很像他的纽约黄鼠狼。西部大平原上还有个更大、尾巴更长的表亲，叫长尾黄鼠狼，也叫大白鼬或黄腹黄鼠狼。”
        - id: ch01-b39
          speaker: mother_nature
          text: “最小的表亲叫伶鼬，身子比一只老鼠长不了多少。冬天，伶鼬全身都是白的，连尾巴尖也不例外。到了夏天，他肚皮上的白毛也比那些个头较大的表亲更加纯净。所有黄鼠狼的生活习性都很相近，跑起来会在地面上一蹦一蹦，很像彼得兔。”
        - id: ch01-b40
          speaker: mother_nature
          text: “草原犬鼠吠吠住在西部一些地方，那里还有影子的亲戚黑足雪貂。他像一只大黄鼠狼，个头和水貂比利差不多。比利的外衣是浓浓的深棕色，他却穿着乳黄色的外衣。四只脚和尾巴尖都是黑的，白脸上还有一道深色条纹横过眼睛。”
        - id: ch01-b41
          speaker: mother_nature
          text: “黑足雪貂最常出现在草原犬鼠的村镇，主要靠吠吠和他的伙伴过活。他的习性跟影子和那些黄鼠狼表亲一样。吠吠最害怕的家伙，谁也比不过他。”
        - id: ch01-b42
          speaker: mother_nature
          text: “影子倒也做过一件好事。每次遇见大老鼠强盗，他都会把强盗杀死。你们知道，强盗又大又凶，被逼进死角时，随时准备狠狠干上一架。可是影子一出现，他的斗志就全没了。也许他明白，反抗根本没有希望。”
        - id: ch01-b43
          speaker: mother_nature
          text: “要是发现一座谷仓挤满大老鼠，影子有时会留下来，直到把最后一只杀掉或赶走。可紧接着，他也许又在一个夜里咬死十几只鸡，把自己做的这件好事全糟蹋了。”
        - id: ch01-b44
          speaker: mother_nature
          text: “说起谁来，竟然一句好话也找不到，实在让人难过。可影子鼬和大老鼠强盗一样，是他自己的生活方式和所作所为，让绿森林和绿草地的所有小居民，还有人类，全都恨透了他。没有谁愿意替他说一句好话。”
          emotion: sad
        - id: ch01-b45
          speaker: mother_nature
          text: “今天就到这里。明天我们不在这里上课，改到微笑池塘岸边见。”
