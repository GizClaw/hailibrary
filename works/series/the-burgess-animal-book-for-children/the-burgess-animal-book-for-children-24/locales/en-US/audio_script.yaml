  chapters:
    - id: ch01
      title: Shadow and His Family
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Everyone came to school the next morning. Just hearing the name Shadow the Weasel had frightened all of them except Jimmy Skunk and Prickly Porky. Still, they wanted to learn everything they could about the enemy they feared. If they ever found Shadow hunting them, what they learned might help them escape.
        - id: ch01-b02
          speaker: old_mother_nature
          text: "Striped Chipmunk, you know something about Shadow the Weasel. Tell us what you know."
        - id: ch01-b03
          speaker: striped_chipmunk
          text: "I know I hate him!"
          emotion: angry
        - id: ch01-b04
          speaker: narrator
          text: All the others nodded in agreement.
        - id: ch01-b05
          speaker: striped_chipmunk
          text: "I can't think of one good thing about him, but I know plenty of bad things. I fear him more than any other enemy because he can follow me anywhere. If I can fit into a hole, he can fit into it too. I've seen him only twice, and I hope I never see him again."
          emotion: fearful
        - id: ch01-b06
          speaker: old_mother_nature
          text: "What did he look like?"
        - id: ch01-b07
          speaker: striped_chipmunk
          text: "He looked like a snake with legs. His body was so long and slim, and he could twist and turn so easily. He was about as long as Chatterer the Red Squirrel, though his thin body and long neck made him seem longer. He was brown on top and white underneath. His front feet were white, and his back feet were almost white. His short, round tail had a black tip. That little head and sharp face made me think of a Snake. Ugh! I don't even like thinking about him!"
          emotion: disgusted
        - id: ch01-b08
          speaker: jumper_hare
          text: "I saw him once, and he wasn't brown at all. Striped Chipmunk has it wrong, except about the end of the tail. The Weasel I saw was white all over, with just that black tip on his tail."
        - id: ch01-b09
          speaker: old_mother_nature
          text: "Striped Chipmunk is right, and so are you. He saw Shadow in summer, while you saw him in winter. Shadow changes his coat with the seasons, just as you do, Jumper. People trap him for his winter fur, and then they don't call him Weasel at all. They call him Ermine."
        - id: ch01-b10
          speaker: jumper_hare
          text: "Oh, now I understand."
        - id: ch01-b11
          speaker: narrator
          text: Jumper looked a little foolish.
        - id: ch01-b12
          speaker: old_mother_nature
          text: "What was Shadow doing when you saw him?"
        - id: ch01-b13
          speaker: narrator
          text: Old Mother Nature turned to Striped Chipmunk.
        - id: ch01-b14
          speaker: striped_chipmunk
          text: "He was hunting me. He found the tracks I'd left while gathering beechnuts, then followed them with his nose, just as Bowser the Hound follows Reddy Fox. When I saw him, I nearly died of fright."
          emotion: fearful
        - id: ch01-b15
          speaker: narrator
          text: Striped Chipmunk shivered.
        - id: ch01-b16
          speaker: chatterer_red_squirrel
          text: "You're lucky you're still alive."
        - id: ch01-b17
          speaker: striped_chipmunk
          text: "I know. I don't think I would be alive if Reddy Fox hadn't come along just then and scared Shadow away. I've felt a little kinder toward Reddy ever since."
        - id: ch01-b18
          speaker: narrator
          text: Striped Chipmunk shivered again.
        - id: ch01-b19
          speaker: jumper_hare
          text: "I've never run harder than I did when I saw Shadow. He was hunting me the same way, nose down in the snow as he followed every turn I'd made. If his tail hadn't had that black tip, I wouldn't have spotted him until it was too late."
          emotion: fearful
        - id: ch01-b20
          speaker: jimmy_skunk
          text: "Pooh! Imagine a big fellow like you running away from a little fellow like my cousin Shadow!"
        - id: ch01-b21
          speaker: jumper_hare
          text: "I'm not ashamed that I ran. I may be much bigger, but he's so quick that I wouldn't have a chance against him. Whenever I think Shadow is nearby, I leave for somewhere else, as far away as I can get. It would be different if I could climb trees like Chatterer."
        - id: ch01-b22
          speaker: chatterer_red_squirrel
          text: "No, it wouldn't! Shadow can climb nearly as well as I can. Once, he found the hole in a tree where I lived. I was lucky to be away when he came calling. I was just coming home when he popped out, and I ran for my life. The only thing that saved me was jumping from one tree to another. He couldn't make the long jump."
          emotion: fearful
        - id: ch01-b23
          speaker: whitefoot_wood_mouse
          text: "He's the most dreadful creature in the whole Great World."
        - id: ch01-b24
          speaker: narrator
          text: Jimmy Skunk chuckled aloud.
        - id: ch01-b25
          speaker: jimmy_skunk
          text: "What do you know about the Great World? This is the farthest you've ever been from home, and I could walk back there in a few minutes. How could you know that Shadow is the most dreadful creature anywhere?"
        - id: ch01-b26
          speaker: whitefoot_wood_mouse
          text: "I simply know it. Shadow hunts and kills because he enjoys it, and nothing could be more dreadful than that. I have plenty of enemies. Sometimes it feels as though nearly every neighbor I have wants a Mouse dinner. But except for Shadow, they hunt me because they're hungry and need food. I can forgive that. Everyone has to eat to live. Shadow keeps hunting even when his stomach is too full for one more bite. He loves killing and takes pleasure in it. That's what makes him so awful."
        - id: ch01-b27
          speaker: narrator
          text: Old Mother Nature answered sadly.
        - id: ch01-b28
          speaker: old_mother_nature
          text: "Whitefoot is right. If Shadow were as large as Buster Bear, Puma the Panther, or even Tufty the Lynx, that terrible desire to kill would make him the most frightening creature in the Great World. He is hot-blooded, quick-tempered, and fearless. Even when an enemy has him cornered and he has no hope of winning, he fights to his last breath. I'm sorry to say he shows no kindness or gentleness to anyone outside his own family. He hasn't one friend in the world."
          emotion: sad
        - id: ch01-b29
          speaker: peter_rabbit
          text: "Doesn't he have any enemies?"
        - id: ch01-b30
          speaker: old_mother_nature
          text: "Oh, yes. He must watch out for Reddy Fox, Old Man Coyote, Hooty the Owl, and several members of the Hawk family. Still, they don't trouble him much. Shadow moves so fast and dodges out of sight in a flash that anything trying to catch him must be very quick indeed. He also keeps close to places that offer good cover."
        - id: ch01-b31
          speaker: old_mother_nature
          text: "He loves old stone walls, piles of stone or rubbish, brush-covered fences, barns, and old buildings. Those are the very places where Mice delight in living. They also offer plenty of holes where Shadow can dart away when danger comes. He hunts whenever he chooses, by day or by night, and often travels quite a distance. But he doesn't cover nearly as much ground as Billy Mink, his big brown cousin who loves the water. Shadow can vanish in an instant, and that's how he got his name."
        - id: ch01-b32
          speaker: old_mother_nature
          text: "People know Shadow by many names. They call him the Common Weasel, the Short-tailed Weasel, the Brown Weasel, the Bonaparte Weasel, and the Ermine. He lives throughout the forested northern part of the country. Farther south in the East lives a cousin much like him, called the New York Weasel."
        - id: ch01-b33
          speaker: old_mother_nature
          text: "Out on the Great Plains of the West, another cousin is larger and has a longer tail. He is called the Long-tailed Weasel, the Large Ermine, or the Yellow-bellied Weasel. The Least Weasel is the smallest cousin. He isn't much longer than a Mouse. In winter, he turns completely white, even at the tip of his tail. In summer, the fur beneath him is a cleaner white than it is on his larger cousins."
        - id: ch01-b34
          speaker: old_mother_nature
          text: "No matter which cousin you meet, all the Weasels have the same habits. When they run, they don't move with a steady little trot. They bound over the ground, rather like Peter Rabbit does."
        - id: ch01-b35
          speaker: old_mother_nature
          text: "In the western country where Yap Yap the Prairie Dog lives, there is another relative called the Black-footed Ferret. He looks like a large Weasel and is about the size of Billy Mink. But Billy's coat is rich dark brown, while the Ferret's is creamy yellow. His feet and the tip of his tail are black. His face is whitish, with a dark band crossing his eyes."
        - id: ch01-b36
          speaker: old_mother_nature
          text: "You will find him most often in Prairie Dog towns, where he lives mainly on Yap Yap and his friends. His ways are much like those of Shadow and Shadow's cousins. Yap Yap fears no one more."
        - id: ch01-b37
          speaker: old_mother_nature
          text: "There is one good thing Shadow does. Whenever he meets Robber the Rat, he kills him. You know that Robber is big, savage, and always ready to fight when he is trapped. But when Shadow appears, all the fight leaves him. Perhaps Robber knows he has no hope."
        - id: ch01-b38
          speaker: old_mother_nature
          text: "Sometimes Shadow finds a barn overrun with Rats and stays until he has killed or chased away every one. Then he may spoil that good deed by killing a dozen Chickens in a single night."
        - id: ch01-b39
          speaker: old_mother_nature
          text: "It is sad when no one can say anything good about a creature. But Shadow the Weasel, like Robber the Rat, has made all the little people of the Green Forest and Green Meadows hate him. People hate him too. Not one of them has a good word to say for him."
          emotion: sad
        - id: ch01-b40
          speaker: old_mother_nature
          text: "Tomorrow, instead of meeting here, we will meet on the bank of the Smiling Pool."
