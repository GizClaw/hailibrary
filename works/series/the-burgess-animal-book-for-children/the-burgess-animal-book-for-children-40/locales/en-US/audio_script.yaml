audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm, observant storytelling
        timbre: clear and gentle
        pace: measured
        pitch: medium
    old_mother_nature:
      display_name: Old Mother Nature
      tts:
        delivery: kindly, assured, and practical
        timbre: warm and full
        pace: unhurried
        pitch: medium-low
    peter_rabbit:
      display_name: Peter Rabbit
      tts:
        delivery: curious, eager, and expressive
        timbre: youthful and warm
        pace: lively
        pitch: medium-high
  chapters:
    - id: ch01
      title: The Mammals of the Sea
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: "The last day of Old Mother Nature's school had come to the Green Forest. By the time jolly, round, bright Mr. Sun had climbed high enough in the blue sky to look down through the trees, every little pupil was there. They had learned so much about themselves, their relatives and neighbors, and animals all across this great country. Not one of them would have missed the final lesson for anything in the world."
        - id: ch01-b02
          speaker: old_mother_nature
          text: "Yesterday I told you that salt water surrounds the land. We call it the ocean, or the sea. The largest animals in the whole Great World live there, along with many others. Some of them sometimes come onto land. Others never come onto land at all. One that does is a first cousin of Little Joe Otter. His name is the Sea Otter."
        - id: ch01-b03
          speaker: old_mother_nature
          text: "He lives in the cold northern waters of the western ocean. He looks a great deal like Little Joe, whom you all know, but his fur is finer and more beautiful. People hunted him for that handsome fur until he became one of the shyest and rarest animals of all. Now he spends nearly his whole life in the water and seldom visits land."
        - id: ch01-b04
          speaker: old_mother_nature
          text: "The Sea Otter lies on his back while he gathers food from the sea bottom, mostly clams and other shellfish. He rests on floating beds of sea plants. He loves to play, tossing bits of seaweed from paw to paw as he floats on his back. And of course he is a marvelous swimmer and diver. He could not live in the sea otherwise."
        - id: ch01-b05
          speaker: old_mother_nature
          text: "Another animal that comes ashore, though he never goes far from the water, is the Walrus. He belongs to the order Finnipedia, a name that means fin-footed. Its members do not have ordinary legs and feet for walking. Their limbs are made for swimming and look more like fins or paddles. We call them flippers."
        - id: ch01-b06
          speaker: old_mother_nature
          text: "The Walrus is so enormous that it is hard to tell you just how big he is. He can weigh two thousand pounds. He is a huge mass of living flesh under rough, very thick skin with no hair. Two immense ivory tusks hang straight down from his upper jaw. He uses them to dig shellfish from the sea bottom."
        - id: ch01-b07
          speaker: old_mother_nature
          text: "Moving on shore takes such a terrible effort that he stays within a few feet of the water. Like the Sea Otter, he lives among the floating ice of the cold Far North. He often climbs onto the ice and lies there for hours. His voice is a deep grunt or a bellowing roar. His young are born on land, close beside the water."
        - id: ch01-b08
          speaker: old_mother_nature
          text: "Sea Lions belong to that same fin-footed order. The best-known kinds are the California Sea Lion and the Fur Seal, though the Fur Seal is not a true Seal. The California Sea Lion is the most familiar member of the family. People also call him the Barking Sea Lion because he has a habit of barking. You can often see these Sea Lions on rocks along the shore or on islands off the western coast."
        - id: ch01-b09
          speaker: old_mother_nature
          text: "They are sleek animals and wonderfully graceful in the water. Their necks are long, and they hold their heads high. Short, coarse hair covers them, and they have small ears with sharp points. Their front flippers have no hair or claws, while the hind flippers have webbed toes. Even without regular legs and feet, they move surprisingly well on land and scramble quickly over rocks. In the water, they are splendid swimmers."
        - id: ch01-b10
          speaker: old_mother_nature
          text: "The biggest member of this family is the Steller Sea Lion. He may grow almost as large as a Walrus. He is not sleek and graceful like his smaller cousin. His neck is tremendously thick, and his shoulders are heavy. Instead of barking, he roars. An old Sea Lion's head looks so much like a real Lion's that the whole family came to be called Sea Lions."
        - id: ch01-b11
          speaker: old_mother_nature
          text: "To people, the most valuable member of the family is the Fur Seal, also known as the Sea Bear. He is nearly the same size and shape as the California Sea Lion. His coarse outer hair is gray, but underneath it lies wonderfully soft, fine brown fur. People hunted him so relentlessly for that fur that there was real danger they would kill the very last one."
        - id: ch01-b12
          speaker: old_mother_nature
          text: "Today, wise and much-needed laws protect Fur Seals on the northern islands where they breed. The young of every Sea Lion are born on shore, though they soon enter the water. Fur Seals migrate as birds do, and each one always returns to the place where it was born. People and Polar Bears are their enemies on land and ice. In the water, the Killer Whale is their enemy."
        - id: ch01-b13
          speaker: old_mother_nature
          text: "A male Fur Seal has many wives. The same is true of the other Sea Lions and of the Walrus. The males grow three or four times as large as the females, and they fight fiercely among themselves."
        - id: ch01-b14
          speaker: old_mother_nature
          text: "True Seals have short necks, thick bodies, and rather round heads without any ears that you can see. Walruses and Sea Lions can turn their hind flippers forward and use them as feet on land. True Seals cannot, so they are much clumsier out of the water. Their front flippers are covered with hair."
        - id: ch01-b15
          speaker: old_mother_nature
          text: "The best-known true Seal is the Harbor Seal, or Leopard Seal. You can find him along both coasts, and he sometimes swims far up the big rivers. He is one of the smallest Seals. Some are yellowish gray with black spots. Others are dark brown with light spots."
        - id: ch01-b16
          speaker: old_mother_nature
          text: "The Ringed Seal is about the same size, or a little smaller, and lives as far north as he can find breathing holes in the ice. Remember, all these animals breathe air just as land animals do. The Ringed Seal looks much like the Harbor Seal, but his body is a little more slender."
        - id: ch01-b17
          speaker: old_mother_nature
          text: "Then there is the Harp Seal, which is also called the Saddle-back or Greenland Seal. He is larger than those first two. The male has a black head and a gray body, with a large black ring across his back. The female is less handsome and is simply spotted."
        - id: ch01-b18
          speaker: old_mother_nature
          text: "The handsomest of all is the Ribbon Seal, another Seal about the size of the Harbor Seal. He is also called the Harlequin Seal. His coat may be blackish brown or yellowish gray, but the male always wears striking yellowish-white bands. One broad band runs from his throat over the top of his head. Another begins on his chest, crosses his shoulder, curves downward, and circles his body not far above the hind flippers. The female does not have these markings. Ribbon Seals are rather rare, and like most of the others, they live in the cold waters of the Far North."
        - id: ch01-b19
          speaker: old_mother_nature
          text: "The largest true Seal is the Elephant Seal. Once there were many of them, but people killed so many that very few remain in this branch of the family. He is tremendous, with a movable nose that hangs several inches below his mouth."
        - id: ch01-b20
          speaker: old_mother_nature
          text: "The oddest-looking member of the family is the Hooded Seal. The male is rather large, and he carries a great bag of skin on top of his nose. He can fill it with air until he looks as though he has put on a strange hood or bonnet."
        - id: ch01-b21
          speaker: old_mother_nature
          text: "That finishes the list of animals that live mostly in the water but sometimes come out on land or ice. Now I want to tell you about a true mammal that is warm-blooded, as you are, and breathes air, yet never comes onto land. This is the Manatee, or Sea Cow."
        - id: ch01-b22
          speaker: old_mother_nature
          text: "The Manatee lives in the warm waters of the Sunny South and travels from the sea into the big rivers. It is a very large animal and sometimes grows as big as a medium-sized Walrus. Its head is round and looks somewhat like a Seal's. The lips are large and thick, and the upper lip is split down the middle. Its eyes are small."
        - id: ch01-b23
          speaker: old_mother_nature
          text: "It has only two flippers, both set at the shoulders. Instead of the hind flippers found on Seals and Sea Lions, it has a broad, flat, rounded tail. That tail drives it through the water just as a fish's tail does. Its neck is short and thick. In the water, a Manatee looks black, and its skin is almost bare of hair."
        - id: ch01-b24
          speaker: old_mother_nature
          text: "This curious creature eats water plants. Sometimes it comes close to a riverbank, raises its head and shoulders out of the water, and feeds on grasses hanging down from the bank. Since the Manatee never goes ashore, its babies are born in the water. And now I think that ends today's lesson, and our school as well."
        - id: ch01-b25
          speaker: narrator
          text: "Peter Rabbit sprang up in excitement."
        - id: ch01-b26
          speaker: peter_rabbit
          text: "But you said the biggest animals in the world live in the sea, and you still haven't told us what they are!"
        - id: ch01-b27
          speaker: narrator
          text: "Old Mother Nature answered him pleasantly."
        - id: ch01-b28
          speaker: old_mother_nature
          text: "That is true, Peter. The largest living animal is a Whale. A Whale is a real mammal, not a fish, though some people seem to think it is. There are several kinds of Whales. Some are fairly small, while others are the largest animals in the world. They are so huge that I cannot make you understand their size. Even the greatest Walrus would look like a baby beside one. But Whales do not belong only to this country, so I think we will leave them out."
        - id: ch01-b29
          speaker: old_mother_nature
          text: "Now our school will close. I hope you have enjoyed learning as much as I have enjoyed teaching you. I also hope that what you learned will help you for as long as you live. The more knowledge you have, the better prepared you will be to do your part in the work of the Great World. Never forget that, and never let a chance to learn pass you by."
        - id: ch01-b30
          speaker: narrator
          text: "And so Old Mother Nature's school in the Green Forest came to an end. One by one, her little pupils thanked her for everything she had taught them and started home. Peter Rabbit stayed until everyone else had gone."
        - id: ch01-b31
          speaker: peter_rabbit
          text: "I know ever and ever so much more than I did when I first came to you. But after all, I guess I know very little of everything there is to know."
        - id: ch01-b32
          speaker: narrator
          text: "Peter said it shyly, and that showed he really had learned a great deal. Then he set off for the dear Old Briar-patch, lipperty-lipperty-lip."
