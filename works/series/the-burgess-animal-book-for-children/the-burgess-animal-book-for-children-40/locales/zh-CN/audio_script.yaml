audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 亲切生动，带着温和的幽默感
        timbre: 温暖清亮
        pace: 舒缓而富有变化
        pitch: 中等
    mother_nature:
      display_name: 老大自然妈妈
      tts:
        delivery: 慈爱睿智，说话从容而坦率
        timbre: 温厚柔和
        pace: 从容
        pitch: 中低
    peter_rabbit:
      display_name: 彼得兔
      tts:
        delivery: 好奇直率，情绪来得快也去得快
        timbre: 清脆稚气
        pace: 轻快
        pitch: 中高
  chapters:
    - id: ch01
      title: 最后一课
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 这一天，是老大自然妈妈在绿森林里上课的最后一天。快活的太阳先生圆滚滚、亮堂堂的。他爬上蓝蓝的天空，从树梢间探头一瞧，发现小居民们一个也没缺席。大家在这里认识了自己，也认识了亲戚、邻居和这个伟大国家里的许多动物。无论拿什么来换，谁都不肯错过最后一课。
        - id: ch01-b02
          speaker: mother_nature
          text: “昨天我说过，陆地四周全是咸水。人们有时叫它海洋，有时叫它大海。伟大世界里最大的动物就住在那里，还有许多别的动物。有些偶尔会上岸，有些却从来不离开水。”
        - id: ch01-b03
          speaker: mother_nature
          text: “先说海獭吧。他是水獭小乔的嫡亲表兄，住在遥远北方西部海洋的冷水里。他长得很像你们都认识的小乔，不过皮毛更细密、更漂亮。正因为这身皮毛，人类一直捕杀他，直到今天。如今，海獭成了动物中最胆小、最稀少的成员之一，几乎总待在水里，很少上岸。”
        - id: ch01-b04
          speaker: mother_nature
          text: “海獭会仰面浮在水上，再从海底取得食物。他主要吃蛤蜊和其他贝类。累了，他就躺在成片漂浮的海草上休息。他还很贪玩，仰面漂着的时候，喜欢把一片片海草从一只爪子抛到另一只爪子。当然，他游泳、潜水都厉害极了，要不然怎么能住在海里呢？”
        - id: ch01-b05
          speaker: mother_nature
          text: “再说海象。他也会上岸，却不肯离水太远。海象属于鳍足目，也就是脚像鳍一样的动物。他们的四肢不是用来走路的，更像游水用的鳍或船桨，所以叫鳍肢。”
        - id: ch01-b06
          speaker: mother_nature
          text: “海象大得难以想象，足有两千磅重。他像一大团活生生的肉，外面包着粗糙的厚皮，连一根毛也没有。两根巨大的象牙从上颌直垂下来，他就用象牙挖海底的贝类。”
        - id: ch01-b07
          speaker: mother_nature
          text: “他在岸上挪动实在太费劲，只肯待在水边几英尺以内。海象也住在遥远北方的寒冷海域，常爬到浮冰上，一躺就是几个钟头。他会低声哼哼，也会轰隆隆地吼叫。海象宝宝则出生在水边的陆地上。”
    - id: ch02
      title: 海狮和海豹
      blocks:
        - id: ch02-b01
          speaker: mother_nature
          text: “海狮也属于鳍足目。大家最熟悉的是加利福尼亚海狮和海狗，不过海狗并不是真海豹。加利福尼亚海狮常常吠叫，所以又叫吠海狮。西部海岸的礁石上，还有近海岛屿上，经常能看见他们。”
        - id: ch02-b02
          speaker: mother_nature
          text: “海狮身形光滑，在水里游得非常优美。他们脖子长，头总是高高昂着，身上长着短而粗的毛，还有一对尖尖的小耳朵。前鳍肢没有毛和爪，后鳍肢却有带蹼的脚趾。别看他们没有普通的腿脚，在陆地上照样行动自如，能很快爬上礁石、翻过礁石，游水更不用说了。”
        - id: ch02-b03
          speaker: mother_nature
          text: “海狮家族里，北海狮最大，有时几乎和海象一样大。他不像小表亲那样光滑优美，脖子粗得惊人，肩膀也很厚重。他不吠叫，只会吼。老雄海狮的头很像真正的狮子，海狮这个名字就是这样来的。”
        - id: ch02-b04
          speaker: mother_nature
          text: “对人类来说，最有价值的是海狗，也叫海熊。他和加利福尼亚海狮的大小、体形都很接近。不过，灰色粗毛下面还藏着一层棕色绒毛，又软又细。人类为了这身毛皮不停捕杀海狗，眼看连最后一只也要保不住了。”
        - id: ch02-b05
          speaker: mother_nature
          text: “现在有了明智而必要的法律，遥远北方那些繁殖岛上的海狗才受到保护。海狮家族所有成员的宝宝都在岸上出生，不过很快便会下水。海狗像鸟儿一样迁徙，却无论走多远，总会回到自己的出生地。在陆地和冰面上，他要提防人类与北极熊，到了水里，又要躲开虎鲸。”
        - id: ch02-b06
          speaker: mother_nature
          text: “一只雄海狗会有许多妻子，其他海狮和海象也是这样。雄性通常比雌性大三四倍，而且雄性之间打起架来非常凶猛。”
        - id: ch02-b07
          speaker: mother_nature
          text: “真正的海豹脖子短，身子粗壮，脑袋圆圆的，耳朵藏得看不见。海象和海狮能把后鳍肢转到前面，当成脚来用，真海豹却做不到，所以一离开水就更笨拙。不过，他们的前鳍肢上长着毛。”
        - id: ch02-b08
          speaker: mother_nature
          text: “最常见的真海豹是港海豹，也叫斑海豹。这个国家两边的海岸都有他，他还常常会沿着大河，游到离海很远的上游。他是家族里个头最小的成员之一。有的身子淡黄灰色，带着黑斑，有的身子深棕，带着浅色斑点。”
        - id: ch02-b09
          speaker: mother_nature
          text: “环斑海豹和港海豹差不多大，有时还小一点儿。只要冰上还能找到透气孔，他就一直往北住。别忘了，这些动物跟陆地动物一样，也得呼吸空气。环斑海豹看着很像港海豹，只是稍微纤细些。”
        - id: ch02-b10
          speaker: mother_nature
          text: “还有竖琴海豹，也叫鞍纹海豹或格陵兰海豹。他比前两种都大，头是黑的，身子是灰色的，背上还有一道大黑环。雌海豹没那么漂亮，身上只长着斑点。”
        - id: ch02-b11
          speaker: mother_nature
          text: “最漂亮的是带纹海豹，也叫丑角海豹。他跟表亲港海豹差不多大，皮毛有时黑褐，有时淡黄灰，不过总有两道像宽丝带一样的黄白色花纹。第一道从喉咙向上，绕过头顶。第二道从胸前出发，越过肩膀，再弯向下方，最后绕过全身，停在后鳍肢上面不远的地方。”
        - id: ch02-b12
          speaker: mother_nature
          text: “只有雄海豹才有这种花纹。带纹海豹不常见，也生活在遥远北方的冷水里。最大的海豹是象海豹。过去他们数量很多，后来被人类捕杀，如今已经所剩无几。他是个庞然大物，嘴上方垂着一只会动的鼻子，足有几英寸长。”
        - id: ch02-b13
          speaker: mother_nature
          text: “模样最古怪的则是冠海豹。这一支的雄海豹个头相当大，鼻子顶上还带着一个大大的皮囊。他能不断往皮囊里灌进空气，直到自己看起来像戴上了一顶古怪的风帽。”
    - id: ch03
      title: 永不上岸的海牛
      blocks:
        - id: ch03-b01
          speaker: mother_nature
          text: “海豹说完，那些平时住在水里、偶尔又会爬上陆地或冰面的动物，就全都讲过了。接下来这位是真正的哺乳动物，跟你们一样身上温暖，也要呼吸空气，却一辈子也不上岸。他就是海牛，也叫美洲海牛。”
        - id: ch03-b02
          speaker: mother_nature
          text: “海牛住在阳光灿烂的南方暖水里，会从海中游进一条条大河。他是一种非常庞大的动物，有时能长到一头中等大小的海象那么大。脑袋圆圆的，有点像海豹。嘴唇又宽又厚，上唇从正中间分开，两只眼睛却很小。”
        - id: ch03-b03
          speaker: mother_nature
          text: “海牛只有两只鳍肢，都长在肩部。他没有海豹和海狮那样的后鳍肢，身后是一条宽阔、扁平又浑圆的尾巴。那条尾巴就像推进器。游水时，他像鱼一样摆动尾巴，推动身体向前。海牛的脖子又短又粗，皮肤几乎没有毛，整个身子在水里看着一片漆黑。”
        - id: ch03-b04
          speaker: mother_nature
          text: “他吃水生植物。有时，海牛会靠近河岸，把头和肩膀伸出水面，吃垂在岸边的青草。他永远不上岸，宝宝自然也在水里出生。好了，我想今天的课该结束了，学校也该结课了。”
        - id: ch03-b05
          speaker: narrator
          text: 彼得兔一听，激动得跳了起来。
        - id: ch03-b06
          speaker: peter_rabbit
          text: “可是，您说世界上最大的动物住在海里，还没告诉我们他是谁呢！”
        - id: ch03-b07
          speaker: narrator
          text: 老大自然妈妈和颜悦色地回答了他。
        - id: ch03-b08
          speaker: mother_nature
          text: “你说得对，彼得。现在还活着的动物中，最大的是鲸。鲸是真正的哺乳动物，根本不是鱼，只是有些人好像弄错了。鲸有好几种，有些比较小，有些却大得叫我没法让你们想象。”
        - id: ch03-b09
          speaker: mother_nature
          text: “哪怕最大的海象站在那种鲸旁边，看起来也只是个宝宝。不过，鲸不只属于这个国家，我们就不把他们算进来了。”
    - id: ch04
      title: 绿森林里的学校结课了
      blocks:
        - id: ch04-b01
          speaker: mother_nature
          text: “好了，现在真的要结课了。希望你们喜欢这段学习的日子，就像我一直喜欢教你们一样。我也希望，你们在这里学到的每一份知识，一辈子都能派上用场。懂得越多，你们就越有本领在伟大世界里做好自己那份工作。千万记住这一点，永远别错过任何学习的机会。”
        - id: ch04-b02
          speaker: narrator
          text: 就这样，老大自然妈妈在绿森林里的学校结束了。小学生们一个接一个地走上前，向她道谢，感谢她教给自己的一切。随后，他们才各自踏上回家的路。彼得兔是最后一个留下来的学生。
        - id: ch04-b03
          speaker: peter_rabbit
          text: “跟第一次来找您的时候相比，我懂的事情已经多得多啦。可我想，世上有那么多事情可以知道，我终究只懂了很少一点儿。”
        - id: ch04-b04
          speaker: narrator
          text: 彼得说这话时有点儿腼腆。这也说明，他确实学到了许多。说完，他便朝亲爱的老荆棘丛出发，一蹦一跳，一蹦一跳。
