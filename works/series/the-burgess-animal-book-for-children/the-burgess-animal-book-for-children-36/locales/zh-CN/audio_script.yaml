audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 亲切生动，带着温和的幽默感
        timbre: 温暖清亮
        pace: 舒缓而富有变化
        pitch: 中等
    mother_nature:
      display_name: 老大自然妈妈
      tts:
        delivery: 慈爱睿智，说话从容而坦率
        timbre: 温厚柔和
        pace: 从容
        pitch: 中低
    lightfoot:
      display_name: 白尾鹿轻脚
      tts:
        delivery: 彬彬有礼，优雅而从容自信
        timbre: 平滑醇厚
        pace: 舒缓
        pitch: 中低
  chapters:
    - id: ch01
      title: 大山里的号手
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 第二天早晨，白尾鹿轻脚第一个来到课堂。太阳还没有升起，他就已经卧在附近的小灌木丛里，舒舒服服地等着开课。今天要讲那些大个子表亲，他无论如何也不愿错过。其他朋友来到时，就在那儿找到了他。
        - id: ch01-b02
          speaker: mother_nature
          text: “鹿家族分成两支，一支长圆角，一支长扁角。圆角鹿差不多都讲过了，只剩最高大、最威风的麋鹿号手。人们常叫他麋鹿，不过他真正的名字是美洲赤鹿。如今只有遥远西部的大山里还能找到号手。从前，可怕的猎枪还没有出现，除了最南端和最北端，这个国家几乎处处都有麋鹿，就连大平原上也有。现在，他们只能住在大山的森林里了。”
        - id: ch01-b03
          speaker: lightfoot
          text: “号手有多大？”
        - id: ch01-b04
          speaker: mother_nature
          text: “大得让你站在旁边显得很小。你见过布朗农夫家的马吗？”
        - id: ch01-b05
          speaker: narrator
          text: 轻脚点了点头。
        - id: ch01-b06
          speaker: mother_nature
          text: “号手站起来，跟那匹马一样高。不过他身形不同，没有马那么粗壮，所以体重也比不上马。就算这样，他也有三个你那么重。夏天，他穿着浅黄褐色的外衣，颈部和腹面的颜色很深，四条腿则是深褐色。颈上的毛又长又粗。尾巴很小，四周却围着一大片几乎雪白的浅色毛。冬天一到，整身皮毛就变成深灰色。”
        - id: ch01-b07
          speaker: mother_nature
          text: “号手最神气的是那副鹿角。它们又大又宽，向后、向上伸展开来。长长的角叉从前侧往上弯，和轻脚长在后侧的角叉正好不同。两只眼睛上方，还各有一根又长又尖的角叉。那副角实在太大，号手看着简直像头顶一棵光秃秃的小树。”
        - id: ch01-b08
          speaker: mother_nature
          text: “这么大的鹿角，只要几个月就能长成。号手也和小个子表亲一样，每年冬末脱掉旧角，再长出新角。新角生长的时候，他会躲到高山上最荒僻的地方。号手太太则带着宝宝住在山谷里。她通常只生一个，有时也会生一对双胞胎。她没有鹿角。”
        - id: ch01-b09
          speaker: mother_nature
          text: “秋天，鹿角长硬了，号手就下山与家人会合。他越强壮，家族也越大，因为他有好几位妻子。大家组成一个鹿群，由号手当家。谁来争夺首领的位置，他都愿意为家族迎战，于是常常爆发可怕的恶斗。这个季节里，他还会伸长脖子，发出传得很远的号角声。‘号手’这个名字就是这么来的。那声音也在警告对手，他已经准备好战斗了。”
        - id: ch01-b10
          speaker: mother_nature
          text: “冬雪落下来，许多家族便聚成浩浩荡荡的大群。他们走下山，一边寻找食物，一边寻找能躲避风雪的地方。冬天特别严酷时，不少麋鹿会饿死。原先供他们过冬的土地，本来有充足的食物，如今许多却被人用篱笆圈起来，开垦成了农场。”
    - id: ch02
      title: 鹿家族中最大的扁角
      blocks:
        - id: ch02-b01
          speaker: mother_nature
          text: “号手已经够大了，可还有一位表亲比他更大，那就是鹿家族中最大的驼鹿扁角。听名字就知道，他属于长扁角的那一支。他的鹿角宽宽地向两边展开，中间不是圆的，而是扁平的，边缘又伸出许多尖利的角叉。”
        - id: ch02-b02
          speaker: mother_nature
          text: “头戴宽大的鹿角冠冕时，扁角凭着高大的身形，看起来非常威武。可一旦脱了角，他就显得相貌平平。不长鹿角的扁角太太，模样更不好看。扁角和布朗农夫家的马一样大，肩头还高出不少。那双肩膀远远高过背线，隆起一道明显的峰。脖子又短又粗，脑袋也不像别的鹿。别的鹿脸庞狭长，前端尖尖的，他却有一张又宽又长的马脸。靠近鼻子的地方高高隆起，肥厚的上唇盖过下唇。鼻头很宽，耳朵很大，两只眼睛跟他的身形一比却很小。”
        - id: ch02-b03
          speaker: mother_nature
          text: “他喉咙下面垂着一片长毛的皮，叫作‘铃铛’。尾巴短得几乎看不见。四条腿又长又粗，蹄子又大又圆，比轻脚的鹿蹄更像母牛大妞的牛蹄。在树林里隔一段距离看，他简直通身乌黑。其实，他大部分皮毛都是深褐色，腿的内侧才是灰色。”
        - id: ch02-b04
          speaker: mother_nature
          text: “扁角住在横贯全国的北方大森林里，最喜欢沼泽地。他爱水，也很会游泳。夏天，他常常蹚进水里，去吃睡莲的叶片、茎和根。那双长腿能让他蹚得更远，把这些水生植物够到嘴边。平日的食物主要是幼树的叶子和嫩枝，有条纹枫、白杨、桦树、铁杉、赤杨和柳树。个子高，上方的枝条也够得着。树实在太高，他就跨在树干上，把它压弯或折断，再吃顶端的枝叶。他的门牙又大又宽，边缘锋利，正好用来剥较粗枝条上的树皮。青草和苔藓他也吃。要吃地上的东西时，因为腿长、脖子短，他跪下来反而最方便。”
        - id: ch02-b05
          speaker: mother_nature
          text: “别看扁角个头大，他能穿过茂密的草木，一点儿声音也不发出来。他不像其他鹿那样跳，而是迈着看似笨拙的小跑步，速度却很快。冬天雪深了，驼鹿一家也像轻脚一家那样住进鹿场。”
        - id: ch02-b06
          speaker: mother_nature
          text: “猎人是扁角最大的敌人。长年被追猎，使他学会好好利用耳朵、眼睛和鼻子。他聪明又机警，很难被人突然袭击。受了伤，他有时会攻击人，偶尔没有受伤也会这样。他会用边缘锋利的前蹄踢打，那是非常可怕的武器。扁角是一种了不起的动物。人类只为取下他那颗非凡的头颅，便一味追猎他，实在叫人难过。”
    - id: ch03
      title: 穿行沼泽的漫蹄
      blocks:
        - id: ch03-b01
          speaker: mother_nature
          text: “同一片北方大森林里，有些地方还住着另一位大个子成员，他就是林地驯鹿漫蹄。漫蹄比轻脚大，又比号手小，样子有些笨拙。四条腿又长又壮，脖子却比较短。轻脚总爱骄傲地昂起头，他却把脑袋朝前伸着，或是低低垂下来。脖子下面还长着长毛。”
        - id: ch03-b02
          speaker: mother_nature
          text: “漫蹄的外衣是褐色的，颈部浅得多，差不多是灰色。外衣下面还有一层厚厚的绒毛，像羊毛一样。到了冬天，全身皮毛都会泛灰，脖子变成白色。每只蹄子上方围着一圈白毛，短短的尾巴底面也是白的。他的鹿角很奇妙，不但长，还又圆又扁。有些地方是圆柱形，有些地方却是扁平的，角叉比任何别的鹿都多。”
        - id: ch03-b03
          speaker: mother_nature
          text: “他的蹄子很大，中间裂得很深，形状像杯子。走起路来，会发出噼啪或咔嗒声。这双大脚可有重要的用处。漫蹄喜欢泥泞的沼泽，落脚时蹄子会张开，所以能稳稳走过那些会让别的动物陷下去的地方。在雪地上，大蹄子又成了一双雪鞋。积雪再深，他也不用像轻脚和扁角那样守在鹿场里，仍旧想去哪里就去哪里。”
        - id: ch03-b04
          speaker: mother_nature
          text: “漫蹄很爱水，喜欢在水里踩踏嬉游，也是一位游泳好手。他的皮毛能托着身体浮起来，所以游泳时，露出水面的部分比家族中任何成员都多。冬天，他住在森林最茂密的地方，四周是铁杉和云杉，吃树上生长的苔藓和地衣。夏天，他迁到浅湖周围开阔的沼泽地，吃铺满地面的苔藓。”
        - id: ch03-b05
          speaker: mother_nature
          text: “他总爱四处漫游，‘漫蹄’的名字就是这么来的。驯鹿太太也长鹿角，这一点和轻脚太太、扁角太太、号手太太都不一样。漫蹄喜欢有同伴在身边，通常和许多同类待在一起。每逢往返于夏日家园和冬日家园，他们常常结成非常庞大的队伍。”
    - id: ch04
      title: 更遥远的北方
      blocks:
        - id: ch04-b01
          speaker: mother_nature
          text: “越过大森林，在更遥远的北方，漫蹄还有一位长得很像他的表亲，叫荒原驯鹿。那里太靠北，除了苔藓几乎什么也不长，驯鹿也就靠苔藓生活，‘荒原’这个名字正是由此而来。夏天，他们几乎一直走到北冰洋岸边。寒冷的天气快到了，又会汇成巨大的鹿群，向南方迁移。如今没有别的动物能聚集成这么庞大的队伍。在最北端，还生活着全身雪白的皮里驯鹿。北美驯鹿和家养驯鹿是近亲，模样也很相像。”
        - id: ch04-b02
          speaker: mother_nature
          text: “小型鹿的雄性叫雄鹿，雌性叫雌鹿，幼崽叫小鹿。麋鹿号手、驼鹿扁角和驯鹿漫蹄这些大型鹿，雄性叫公鹿，雌性叫母鹿，幼崽叫鹿犊。鹿家族都喜爱森林，只有荒原驯鹿例外。所以离开森林的庇护太远，通常就见不到他们了。”
        - id: ch04-b03
          speaker: mother_nature
          text: “关于鹿家族，我想这些已经够了。明天，我要给你们讲野牛雷蹄、羚羊疾足，还有麝牛长毛。”
