audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm, observant storytelling
        timbre: clear and gentle
        pace: measured
        pitch: medium
    old_mother_nature:
      display_name: Old Mother Nature
      tts:
        delivery: kindly, assured, and practical
        timbre: warm and full
        pace: unhurried
        pitch: medium-low
    lightfoot:
      display_name: Lightfoot
      tts:
        delivery: attentive and plainly curious
        timbre: gentle and youthful
        pace: moderate
        pitch: medium
  chapters:
    - id: ch01
      title: Bugler, Flathorns and Wanderhoof
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: "Lightfoot the Deer was the first to arrive the next morning. He was there before sunrise. He settled comfortably in a little thicket nearby and waited for school to begin. Nothing could have made him miss a lesson about his big cousins. That was where the others found him when they came."
        - id: ch01-b02
          speaker: old_mother_nature
          text: "The Deer family has two branches. One has round antlers, and the other has flat antlers. You have already heard about the round-antlered Deer, except for the largest and noblest of them all. That is Bugler the Elk. Most people call him Elk, but his proper name is Wapiti. Today Bugler lives only among the great mountains of the Far West. Long ago, before hunters came with their terrible guns, Elk lived in nearly every part of this country except the Far South and Far North. They even roamed the great plains. Now they remain only in the forests of the great mountains."
        - id: ch01-b03
          speaker: lightfoot
          text: "How large is Bugler?"
        - id: ch01-b04
          speaker: old_mother_nature
          text: "He is so large that you would look very small beside him. Have you seen Farmer Brown's Horse?"
        - id: ch01-b05
          speaker: narrator
          text: "Lightfoot nodded."
        - id: ch01-b06
          speaker: old_mother_nature
          text: "Bugler stands as tall as that Horse. His body has a different shape and is not so thick, so he does not weigh as much as the Horse. Even so, he weighs three times as much as you. In summer his coat is pale yellowish brown, with very dark hair on his neck and underneath. His legs are dark brown, and the hair on his neck is long and coarse. His tail is tiny. Around it lies a large patch so pale that it is almost white. By winter, his coat has turned dark gray."
        - id: ch01-b07
          speaker: old_mother_nature
          text: "Bugler's greatest glory is his antlers. They are huge and spread wide as they sweep back and upward. Their long points curve up from the front, unlike the points on Lightfoot's antlers, which rise from the back. A long, sharp point stands above each eye. Those antlers are so enormous that Bugler almost looks as though he is carrying a small bare tree on his head."
        - id: ch01-b08
          speaker: old_mother_nature
          text: "Yet he grows those great antlers in only a few months. Like his smaller cousins, he drops them at the end of every winter and must grow a new pair. While they grow, he hides in the wildest places he can find, high in the mountains. Mrs. Bugler stays down in a valley then with her baby, or sometimes her babies. She usually has one, though now and then she has twins. She has no antlers."
        - id: ch01-b09
          speaker: old_mother_nature
          text: "In fall, once his antlers are hard, Bugler comes down to join his family. The larger and stronger he is, the larger that family will be. He has several wives, and all of them live in one herd with Bugler as their master. He is eager to defend them. If another Elk challenges his leadership, the two may fight a terrible battle. At this time of year, Bugler stretches out his neck and sends a trumpetlike call carrying far across the land. That call gives him his name, and it warns every rival that he is ready to fight."
        - id: ch01-b10
          speaker: old_mother_nature
          text: "When winter snows arrive, many families gather into great bands. They travel down from the mountains to look for food and shelter. In a very hard winter, many die of hunger. People have fenced off and turned into farms much of the land where Elk once found plenty of winter food."
        - id: ch01-b11
          speaker: old_mother_nature
          text: "Large as Bugler is, one cousin is larger. He is the biggest member of the whole Deer family, Flathorns the Moose. His name tells you that he belongs to the flat-antlered branch. His antlers spread far apart, and broad sections of them are flat instead of round. Many sharp points grow from the edges of those flat parts."
        - id: ch01-b12
          speaker: old_mother_nature
          text: "With that great spreading crown on his head, Flathorns looks noble because he is so big. Once his antlers fall, though, he looks rather homely. Mrs. Flathorns has no antlers, and she is very homely too. Flathorns is as big as Farmer Brown's Horse, and he stands much taller at the shoulders. His shoulders rise well above the line of his back, making a clear hump. His neck is short, thick, and heavy. His head is quite unlike the head of any other Deer. Other Deer have narrow, pointed faces. Flathorns has a long, broad face, more like a Horse's. It rises in a bump near the nose, and his thick upper lip hangs over the lower one. His nose is very broad, his ears are large, and his eyes look small for an animal his size."
        - id: ch01-b13
          speaker: old_mother_nature
          text: "A hairy fold of skin called a bell hangs from his throat. His tail is so short that you can hardly see it. His legs are very long and fairly thick. His large, rounded hoofs look more like Bossy the Cow's hoofs than Lightfoot's. From a little way off in the woods, Flathorns seems almost black. Most of his coat is really dark brown, while the inner sides of his legs are gray."
        - id: ch01-b14
          speaker: old_mother_nature
          text: "Flathorns lives all across the great northern forests, and he especially likes swampy country. He loves the water and swims well. In summer he wades out to eat the pads, stems, and roots of water lilies. His long legs help him reach them. Most of his food is made up of leaves and tender twigs from young trees. He eats striped maple, aspen, birch, hemlock, alder, and willow. Because he is so tall, he can reach high branches. If a young tree is still too tall, he stands over it and bends or breaks it down so he can reach the top. His front teeth are large, broad, and sharp along the edges. He uses them to strip bark from bigger branches. He eats grass and moss as well. When he feeds on the ground, his long legs and short neck make kneeling the easiest way to reach his meal."
        - id: ch01-b15
          speaker: old_mother_nature
          text: "For such a huge animal, Flathorns can slip through thick growth without a sound. He does not bound along as other Deer do. He moves at an awkward-looking trot, but it carries him over the ground very quickly. When deep winter snow comes, the Moose family stays in a yard like the one I told you Lightfoot makes."
        - id: ch01-b16
          speaker: old_mother_nature
          text: "The hunter is Flathorns's greatest enemy. Being hunted so often has taught him to use his ears, eyes, and nose as well as he can. He is clever and hard to surprise. If he is wounded, he will sometimes attack a person. Once in a while, he may attack even when he is not wounded. Then he strikes with the sharp edges of his front hoofs, which are terrible weapons. Flathorns is a wonderful animal. It is sad that people keep hunting him merely to claim his magnificent head."
        - id: ch01-b17
          speaker: old_mother_nature
          text: "Another large member of the Deer family lives in parts of those same northern forests. This is Wanderhoof the Woodland Caribou. He is larger than Lightfoot but smaller than Bugler, and he looks rather awkward. His legs are long and sturdy, and his neck is fairly short. Lightfoot carries his head proudly, but Wanderhoof holds his head out in front of him or lets it hang low. Long hair grows beneath his neck."
        - id: ch01-b18
          speaker: old_mother_nature
          text: "Wanderhoof's coat is brown, while his neck is much paler and almost gray. Beneath that coat is another one, very thick and woolly. In winter, all his outer fur becomes grayish and his neck turns white. A white band circles each leg just above the hoof. His tail is very short and white underneath. His antlers are remarkable. They are very long, with some parts round and other parts flattened, and they carry more points than the antlers of any other Deer."
        - id: ch01-b19
          speaker: old_mother_nature
          text: "His hoofs are huge, deeply split, and shaped like cups. They snap or click as he walks. Those great feet have an important use. Wanderhoof likes boggy ground. When he steps, his hoofs spread, allowing him to cross places where other animals would sink. In snow, those same feet work like snowshoes. So when the snow grows deep, he does not have to stay in a yard as Lightfoot and Flathorns do. He can go wherever he likes."
        - id: ch01-b20
          speaker: old_mother_nature
          text: "Wanderhoof also loves the water. He delights in splashing through it, and he is a splendid swimmer. His hair helps him float, so he rides higher in the water than any other member of the Deer family. In winter he stays in the thickest forest among hemlocks and spruces. There he eats the mosses and lichens growing on the trees. In summer he travels to open, boggy land around shallow lakes. Moss covers the ground there, and that becomes his food."
        - id: ch01-b21
          speaker: old_mother_nature
          text: "He wanders so widely that he has earned the name Wanderhoof. Mrs. Caribou has antlers. That makes her different from Mrs. Lightfoot, Mrs. Flathorns, and Mrs. Bugler. Wanderhoof likes company and is usually found with many other Caribou. When they travel between their summer and winter homes, they often move in very large bands."
        - id: ch01-b22
          speaker: old_mother_nature
          text: "Beyond the great forests in the Far North, Wanderhoof has a cousin who looks much like him. This is the Barren Ground Caribou. He gets that name because very little but moss grows in his far northern home, and moss is what he eats. In summer he travels almost as far as the Arctic Ocean. When cold weather approaches, enormous herds move south. No other animals living today gather in such great numbers. Farther north still lives Peary's Caribou, whose coat is entirely white. All Caribou are close cousins of the Reindeer and look much like them."
        - id: ch01-b23
          speaker: old_mother_nature
          text: "Among the smaller Deer, the males are called bucks, the females are does, and the young are fawns. Among large Deer such as Bugler the Elk, Flathorns the Moose, and Wanderhoof the Caribou, the males are bulls. The females are cows, and their young are calves. Every member of the Deer family loves the forest and is rarely found far from sheltering woods, with one exception. That is the Barren Ground Caribou."
        - id: ch01-b24
          speaker: old_mother_nature
          text: "I think that is enough about the Deer family. Tomorrow I will tell you about Thunderfoot the Bison, Fleetfoot the Antelope, and Longcoat the Musk Ox."
