audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 亲切生动，带着温和的幽默感
        timbre: 温暖清亮
        pace: 舒缓而富有变化
        pitch: 中等
    mother_nature:
      display_name: 老大自然妈妈
      tts:
        delivery: 慈爱睿智，说话从容而坦率
        timbre: 温厚柔和
        pace: 从容
        pitch: 中低
    peter_rabbit:
      display_name: 彼得兔
      tts:
        delivery: 好奇直率，情绪来得快也去得快
        timbre: 清脆稚气
        pace: 轻快
        pitch: 中高
  chapters:
    - id: ch01
      title: 云端的盘角
      blocks:
        - id: ch01-b01
          speaker: mother_nature
          text: “彼得，你常去老牧场，一定见过那里的绵羊，对吧？”
        - id: ch01-b02
          speaker: narrator
          text: 老大自然妈妈说着，转身看向彼得兔。
        - id: ch01-b03
          speaker: peter_rabbit
          text: “当然见过。他们好像挺笨的，至少看起来就是这样。”
        - id: ch01-b04
          speaker: mother_nature
          text: “那么，羊群里那只有弯角的大公羊，你也认识了？”
        - id: ch01-b05
          speaker: narrator
          text: 彼得点了点头，老大自然妈妈便请他在脑中换一换那只公羊的模样。
        - id: ch01-b06
          speaker: mother_nature
          text: “先把白色羊毛换成光滑的灰褐色短毛，再让那对弯角大上许多倍，盘成两只巨角。尾巴得变得很短，四周还要添上一大片发白或淡黄得近乎发白的毛。这样，你想出来的就是我答应要讲的登山高手，也是大千世界最出色的登山高手之一，大角羊盘角。人们也叫他落基山大角羊或落基山盘羊。”
        - id: ch01-b07
          speaker: mother_nature
          text: “盘角是真正的羊，住在遥远西部最高的群山里。他和有蹄目的其他成员一样，脚上长着蹄子，可他的蹄子从不打滑。他最喜欢沿着悬崖边跳跃，还能在峭壁上来回攀登。那种地方，连红松鼠喋喋都像是找不到落脚点，更别说盘角这么大的家伙了，可他偏偏照样过得去。”
        - id: ch01-b08
          speaker: mother_nature
          text: “那里的山峰高进云层，到了夏天，许多峰顶仍然盖着雪。盘角就在树木无法生长的雪线以上过夏天。只有积雪深得再也刨不到底下的食物，他才会走下山，来到较低的丘陵。站在高高的瞭望地上，他能看清下方的敌人。谁想从那个方向悄悄靠近，都很难瞒过他的眼睛。”
        - id: ch01-b09
          speaker: mother_nature
          text: “盘角一受惊，四条腿就像装了强劲的弹簧，轻轻一跃便飞奔出去。那对盘曲的巨角压在头上，他却像什么也没扛。岩坡陡得踏错一步就会跌下几百英尺，他仍能像轻脚穿过树林那样飞快跃下，从一小块突出的岩石跳到下一块，每次都稳稳落住。人类到了那里，只能手脚并用地攀爬，有些地方只好放弃，盘角却能轻松通过。”
        - id: ch01-b10
          speaker: mother_nature
          text: “盘角太太长的是两只短而尖的角，像锥子，不像盘角的巨角。她会寻找最高、最难抵达的地方，在那里生下宝宝。住在这样的地方，小羊羔几乎不用怕任何敌人，只有鹰王除外，因为只有长着翅膀的敌人才到得了那里。成年的盘角夫妇个头很大，不怕这些巨鸟，可无力保护自己的小羊羔，却一直有危险，随时可能成为鹰王最喜欢的晚餐。”
        - id: ch01-b11
          speaker: mother_nature
          text: “只有暴风和大雪把盘角赶下山，他才要害怕四条腿的敌人。到了山坡上，他得留心美洲狮大山猫。再往低处，还有灰狼嚎叫。不过，他最怕的仍是许多动物共同的敌人，也就是拿着可怕猎枪的猎人。人爬不上去的地方，子弹却到得了。为了盘角的头和那对巨角，猎人一直在追杀他。”
        - id: ch01-b12
          speaker: mother_nature
          text: “有人说，盘角会从悬崖跳下，用那对巨角接住自己的身体。千万别信，这根本不是真的。无论从哪里跳下，他都是四只稳当的脚先落地，绝不会拿脑袋去撞地面。”
        - id: ch01-b13
          speaker: mother_nature
          text: “这个国家西北尽头的阿拉斯加，住着他的近亲达尔大角羊。达尔全身雪白，角是黄色的，比盘角的角细，也张得更开。往南一些，却还没有盘角的家园那么靠南，住着斯通大角羊。他的毛色深得厉害，所以也有人叫他黑大角羊。达尔和斯通之间的群山里，还有白头黑身的范宁大角羊。这几位表亲关系很近，过日子的方式也差不多。其中最有名的，还是落基山大角羊盘角。”
    - id: ch02
      title: 岩石间的比利
      blocks:
        - id: ch02-b01
          speaker: peter_rabbit
          text: “住在那么高的山上，我看盘角一定很寂寞。”
        - id: ch02-b02
          speaker: narrator
          text: 老大自然妈妈听了笑起来。
        - id: ch02-b03
          speaker: mother_nature
          text: “彼得，盘角可没有你那么在意邻居。再说，云间的岩石上真有一位邻居。他的脚步和盘角同样稳，不论冬天还是夏天都守在山顶。他就是落基山雪羊比利。”
        - id: ch02-b04
          speaker: mother_nature
          text: “盘角走动时有多优雅，比利走起来看着就有多笨拙。不过，就连盘角也会犹豫着不敢跟去的地方，他仍能继续往前。比利的蹄子很小，生得格外合适，能让他安全踩过光滑的石面和结冰的岩架。他和白尾鹿轻脚差不多重，模样却完全不同。”
        - id: ch02-b05
          speaker: mother_nature
          text: “比利的肩头也有一座高峰，很像野牛雷蹄和麝牛长毛，所以他的脑袋总是垂得很低。他的脸很长，下巴下面挂着白胡须。额头上竖着两只细细的黑角，角不算长，尖端稍稍往后弯。他的外衣通身雪白，长毛又直又长，下面还藏着一层浓密的黄白色短绒毛，摸起来就像羊毛。天气冷到极点，那层绒毛也能护住他。”
        - id: ch02-b06
          speaker: mother_nature
          text: “哪怕赶上冬天最恶劣的天气，比利也不像盘角那样偶尔下山。他会在岩石之间找到遮蔽，始终留在自己心爱的山顶。这样一来，除了人类，他实际上没有什么敌人需要害怕。”
    - id: ch03
      title: 雪地里的白外衣
      blocks:
        - id: ch03-b01
          speaker: mother_nature
          text: “比利常常就在终年积雪不化的地方过夏天。那身白外衣连最锐利的眼睛也能骗过。他只要站在岩石间一动不动，从远处看过去，谁都会把他当成岩石上的一片积雪。”
        - id: ch03-b02
          speaker: mother_nature
          text: “比利没有漂亮的脑袋，也没有盘角那样非凡的巨角，所以人类猎杀他，没有猎杀盘角那么厉害。他也因此少了几分警觉。想靠近比利或盘角，从上方都比从下方容易。他们没想到危险会从头顶出现，便不会始终把那个方向盯得那么紧。”
        - id: ch03-b03
          speaker: mother_nature
          text: “鹰王有时会捉走比利的宝宝。除此之外，雪羊一家几乎不用害怕敌人。当然，手里拿着可怕猎枪的猎人永远是个例外，绝不能算在‘不用害怕’之内。”
    - id: ch04
      title: 彼得的新问题
      blocks:
        - id: ch04-b01
          speaker: mother_nature
          text: “牛羊家族的成员，他们的模样、住处和生活，我已经全讲完了。有蹄目还剩下一位成员。他跟布朗农夫畜棚里的另一位成员，也有些亲缘。先让你们猜猜那是谁。彼得，你怎么想？”
        - id: ch04-b02
          speaker: peter_rabbit
          text: “请问，比利住的那些山，究竟在遥远西部的什么地方？”
        - id: ch04-b03
          speaker: mother_nature
          text: “主要在北部。西北一带的群山紧靠大海，海上的雾滚进山里，比利一点儿也不在乎。他似乎还很喜欢带着咸味的海风，有时甚至会下到离海岸很近的地方。还有问题吗？”
        - id: ch04-b04
          speaker: narrator
          text: 没有人再开口，这一天的课就结束了。彼得却没有直接回家。他跑上老牧场，又去看那只老公羊，想从他的模样猜出盘角该是什么样子。彼得看得最仔细的，是老公羊的蹄子。
        - id: ch04-b05
          speaker: peter_rabbit
          text: “这样的脚踩上老大自然妈妈说的湿滑岩石，怎么会那么稳呢？反正我觉得太奇怪了。不过，她说能站稳，那就一定能站稳。哎呀，哎呀，哎呀，这个世界上的古怪家伙可真多，要学的事情也真多！”
