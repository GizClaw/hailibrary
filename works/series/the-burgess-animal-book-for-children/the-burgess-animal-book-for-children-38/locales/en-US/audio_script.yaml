audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm, observant storytelling
        timbre: clear and gentle
        pace: measured
        pitch: medium
    old_mother_nature:
      display_name: Old Mother Nature
      tts:
        delivery: kindly, assured, and practical
        timbre: warm and full
        pace: unhurried
        pitch: medium-low
    peter:
      display_name: Peter Rabbit
      tts:
        delivery: curious, candid, and bold
        timbre: youthful and clear
        pace: lively
        pitch: medium-high
  chapters:
    - id: ch01
      title: Two Wonderful Mountain Climbers
      blocks:
        - id: ch01-b01
          speaker: old_mother_nature
          text: "Peter, you've been up in the Old Pasture many times. You must have seen the Sheep there."
        - id: ch01-b02
          speaker: narrator
          text: Old Mother Nature turned toward Peter Rabbit as she spoke.
        - id: ch01-b03
          speaker: peter
          text: "Why, yes. Of course I have. They seem rather stupid to me. At least, they certainly look stupid."
        - id: ch01-b04
          speaker: old_mother_nature
          text: "Then you know the leader of the flock, that big ram with the curling horns."
        - id: ch01-b05
          speaker: narrator
          text: Peter nodded, and Old Mother Nature continued the lesson.
        - id: ch01-b06
          speaker: old_mother_nature
          text: "Picture that ram with a smooth grayish-brown coat instead of a white woolly one. Make his curling horns enormous, many times larger than the ram's horns. Around his very short tail, give him a large patch of whitish or very pale yellow hair. Now you have a good idea of one of the mountain climbers I promised to tell you about. He is one of the finest climbers in the Great World. His name is Bighorn the Mountain Sheep. He is also called the Rocky Mountain Bighorn or the Rocky Mountain Sheep."
        - id: ch01-b07
          speaker: old_mother_nature
          text: "Bighorn is a true Sheep. He lives high among the rocks on the tallest mountains of the Far West. Like every member of his order, he has hoofed feet. But his hoofs never slip. He loves bounding along the edges of great cliffs. He travels up and down places where even Chatterer the Red Squirrel could hardly find a foothold, though Bighorn is such a large fellow."
        - id: ch01-b08
          speaker: old_mother_nature
          text: "His mountain home rises so high that many of the peaks reach into the clouds and stay covered with snow even in summer. Bighorn spends the summer above the place where trees stop growing. He comes down to the lower hills only when the snow is too deep for him to paw through and reach his food. His eyesight is wonderful. From a lookout high above, he watches for enemies below, and they have very little chance of creeping up on him from that direction."
        - id: ch01-b09
          speaker: old_mother_nature
          text: "When danger frightens him, he bounds away as gracefully as if powerful springs were hidden in his legs. He carries those great curled horns as easily as though they weighed nothing. He races down rocky slopes where one wrong step would send him falling hundreds of feet. He springs from one tiny point of rock to the next and lands as safely as if the ground were level. He moves as swiftly and easily as Lightfoot the Deer running through the woods. Bighorn can climb places where a man would have to crawl and cling with his fingers and toes, or else give up completely."
        - id: ch01-b10
          speaker: old_mother_nature
          text: "Mrs. Bighorn has no great curling horns. Her horns are short and pointed, like sharp spikes. She gives birth to her young in the highest, hardest-to-reach place she can find. Up there, the little ones have only one enemy to fear. That is King Eagle. An enemy with wings is the only kind that can reach them. Bighorn and Mrs. Bighorn are too large to fear those great birds, but helpless little lambs are always in danger of becoming the dinner King Eagle prizes."
        - id: ch01-b11
          speaker: old_mother_nature
          text: "Bighorn needs to fear four-footed enemies only when storms and snow drive him down to the lower slopes and hills. There he must watch for Puma the Panther, and still farther down, for Howler the Wolf. Yet the enemy he fears most is the one that has brought sorrow to so many others. It is the hunter with his terrible gun. That gun can kill Bighorn in places where a man could never climb. Hunters have kept after him because they want his head and his wonderful horns."
        - id: ch01-b12
          speaker: old_mother_nature
          text: "Some people think Bighorn leaps from cliffs and lands on those huge horns. That isn't true. Whenever he jumps, he lands on his sure feet. He never lands on his head."
        - id: ch01-b13
          speaker: old_mother_nature
          text: "Far away in Alaska, at the very northwest corner of this country, Bighorn has a close cousin. This cousin has an all-white coat. His yellow horns are slimmer than Bighorn's and spread farther apart. He is called the Dall Mountain Sheep. Another cousin lives farther south, though not as far south as Bighorn. His coat is so dark that people sometimes call him the Black Mountain Sheep. His proper name is Stone's Mountain Sheep."
        - id: ch01-b14
          speaker: old_mother_nature
          text: "In the mountains between those two lives one more cousin, Fannin's Sheep. He has a white head and a dark body. All of these cousins are closely related, and their habits are much the same. Bighorn the Rocky Mountain Sheep is the best known of them all."
        - id: ch01-b15
          speaker: peter
          text: "I should think Bighorn would be terribly lonely, living way up there on those high mountains."
        - id: ch01-b16
          speaker: narrator
          text: Old Mother Nature laughed.
        - id: ch01-b17
          speaker: old_mother_nature
          text: "Bighorn doesn't care about having neighbors the way you do, Peter. But he does have one, even in those high rocky places among the clouds. His neighbor is every bit as sure-footed as Bighorn, and he stays on the mountaintops in winter as well as summer. He is Billy the Rocky Mountain Goat."
        - id: ch01-b18
          speaker: old_mother_nature
          text: "Billy looks as awkward when he moves as Bighorn looks graceful. Even so, Billy will go into places where Bighorn might hesitate to follow. His hoofs are small and specially shaped to carry him safely over smooth rock and ledges covered with ice. He weighs about as much as Lightfoot the Deer, but he doesn't look anything like him."
        - id: ch01-b19
          speaker: old_mother_nature
          text: "To begin with, Billy has a hump on his shoulders, much like the humps on Thunderfoot the Bison and Longcoat the Musk Ox. Because of that hump, he carries his head low. His face is very long, and a white beard hangs beneath his chin. Two rather short, slim, black horns rise from his forehead and curve back a little. His outer coat is white, with long, straight hair. Beneath it is another coat of short, thick, woolly fur. That undercoat is yellowish white, and it keeps him warm through the coldest weather."
        - id: ch01-b20
          speaker: old_mother_nature
          text: "Bighorn sometimes comes down from the heights, but Billy rarely leaves the mountaintops he loves, even during the worst winter storms. He shelters among the rocks instead. Because he stays there, he has almost no enemy to fear except man."
        - id: ch01-b21
          speaker: old_mother_nature
          text: "Billy often spends the summer where snow lies on the ground all year. His white coat keeps even the sharpest eyes from seeing him. When he stands still at a distance, he looks exactly like a patch of snow resting on the rocks."
        - id: ch01-b22
          speaker: old_mother_nature
          text: "Billy has neither a handsome head nor magnificent horns, so men have not hunted him as much as they have hunted Bighorn. That is why Billy is less watchful and cautious. Both animals are easier to approach from above than from below. They don't expect danger from higher up, so they watch that direction less carefully. King Eagle sometimes carries off their young. Other than that, Billy Goat's family has little to fear from enemies, except always the hunter with his terrible gun."
        - id: ch01-b23
          speaker: old_mother_nature
          text: "Now I have told you about the members of the cattle and Sheep family. You know what they look like, where they live, and how they live. There is still one member of the order Ungulata left to meet. In a way, this animal is related to another resident of Farmer Brown's barnyard. I'll let you guess which one. What do you think it is, Peter?"
        - id: ch01-b24
          speaker: peter
          text: "If you please, exactly where in the Far West are the mountains where Billy Goat lives?"
        - id: ch01-b25
          speaker: old_mother_nature
          text: "Most of them are in the northern part. In the Northwest, those mountains come very close to the ocean. Billy doesn't seem to mind the fog rolling in at all, and he appears to enjoy the salty air. Sometimes he comes almost all the way down to the shore. Does anyone have another question?"
        - id: ch01-b26
          speaker: narrator
          text: No one did, so school ended for the day. Peter did not go straight home. He went up to the Old Pasture instead, hoping for one more look at the old ram. As he studied the animal, he tried to imagine exactly what Bighorn must look like. Most of all, he watched the old ram's hoofs.
        - id: ch01-b27
          speaker: peter
          text: "It's strange that feet like those can be so safe on the slippery rocks Old Mother Nature told us about. It certainly seems strange to me. Still, it must be true if she says it is. My, my, my! What a lot of strange people there are in this world, and what a lot there is to learn!"
