audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 亲切生动，带着温和的幽默感
        timbre: 温暖清亮
        pace: 舒缓而富有变化
        pitch: 中等
    mother_nature:
      display_name: 老大自然妈妈
      tts:
        delivery: 慈爱睿智，说话从容而坦率
        timbre: 温厚柔和
        pace: 从容
        pitch: 中低
    lightfoot:
      display_name: 白尾鹿轻脚
      tts:
        delivery: 彬彬有礼，优雅而从容自信
        timbre: 平滑醇厚
        pace: 舒缓
        pitch: 中低
    peter_rabbit:
      display_name: 彼得兔
      tts:
        delivery: 好奇直率，情绪来得快也去得快
        timbre: 清脆稚气
        pace: 轻快
        pitch: 中高
    chatterer:
      display_name: 红松鼠喋喋
      tts:
        delivery: 伶牙俐齿，争强好胜又活泼
        timbre: 尖细清亮
        pace: 明快
        pitch: 高
    johnny_chuck:
      display_name: 土拨鼠约翰尼
      tts:
        delivery: 直率倔强，懒洋洋中带着粗朴的自信
        timbre: 浑厚结实
        pace: 稍缓
        pitch: 中低
    whitefoot:
      display_name: 白足林鼠
      tts:
        delivery: 小心而认真，疑问里带着好奇
        timbre: 轻柔清细
        pace: 稍快
        pitch: 高
    danny_meadow_mouse:
      display_name: 草地鼠丹尼
      tts:
        delivery: 朴实认真，遇到不懂的事一定追问到底
        timbre: 细小温和
        pace: 平稳
        pitch: 中高
    jumper:
      display_name: 大野兔跳跳
      tts:
        delivery: 机敏肯定，说话直接利落
        timbre: 清朗轻快
        pace: 明快
        pitch: 中等
    happy_jack:
      display_name: 灰松鼠快乐杰克
      tts:
        delivery: 自信好胜，受窘时有些急躁
        timbre: 明亮爽脆
        pace: 轻快
        pitch: 中高
  chapters:
    - id: ch01
      title: 轻脚来到课堂
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 绿森林里，没有谁比白尾鹿轻脚更受大家仰慕。早课刚要开始，他竟亲自从灌木丛中走了出来。轻脚步子优雅，来到老大自然妈妈面前，彬彬有礼地鞠了一躬。大家一见到他，别提多高兴了。
        - id: ch01-b02
          speaker: lightfoot
          text: “我听说，小朋友们今早要学习我们鹿家族的事。我也想来一起听听，希望您不会介意。”
        - id: ch01-b03
          speaker: peter_rabbit
          text: “当然不介意！”
          emotion: happy
        - id: ch01-b04
          speaker: narrator
          text: 彼得太认真，也太兴奋，竟忘了轻脚问的是老大自然妈妈。大家都笑了起来，连老大自然妈妈也笑了。
        - id: ch01-b05
          speaker: mother_nature
          text: “彼得替我们大家答过了。轻脚，我们都非常欢迎你。我原本还想派人请你来，后来倒忘了。你能来，我真高兴，其他朋友也一定一样。躺下来大概会舒服些，不过先到那块人人都看得见的小空地上站一会儿，让朋友们仔细看看你吧。”
        - id: ch01-b06
          speaker: narrator
          text: 轻脚走进洒满阳光的空地。他站在那里，优雅又美丽。他知道自己生得好看，却并不自负，那份坦然的骄傲反而让他显得高贵庄严。小邻居们望着他，接连发出赞叹的轻呼。
        - id: ch01-b07
          speaker: mother_nature
          text: “你们眼前这位，是我所有孩子中最美丽的一位。他知道自己的美，却没有因此变坏。轻脚属于鹿科，鹿科又属于有蹄目，也就是长着蹄子的动物。”
        - id: ch01-b08
          speaker: narrator
          text: 彼得猛地坐直，两只耳朵竖起来，像两个惊叹号。
        - id: ch01-b09
          speaker: peter_rabbit
          text: “布朗农夫家的牛也长着蹄子。它们跟轻脚是亲戚吗？”
        - id: ch01-b10
          speaker: mother_nature
          text: “牛属于另一个科，不过也在有蹄目里，算是轻脚的远房亲戚。”
        - id: ch01-b11
          speaker: chatterer
          text: “那布朗农夫家的猪呢？”
        - id: ch01-b12
          speaker: mother_nature
          text: “猪也属于有蹄目，所以同样是他的亲戚。”
        - id: ch01-b13
          speaker: chatterer
          text: “哼！我要是轻脚，才不肯认那种又丑又笨的家伙做亲戚呢，永远也不认！”
        - id: ch01-b14
          speaker: mother_nature
          text: “喋喋，你可别忘了。豪猪刺猬波奇和大老鼠强盗，也跟你属于同一个目。”
        - id: ch01-b15
          speaker: narrator
          text: 老大自然妈妈轻声一说，喋喋便羞得垂下了头。
    - id: ch02
      title: 白尾与茸角
      blocks:
        - id: ch02-b01
          speaker: mother_nature
          text: “轻脚是白尾鹿，也叫弗吉尼亚鹿。从某些方面看，他是鹿科中最美丽的一种。你们看那双修长的腿，一眼就知道是为飞奔生的。他跑得很快，只是不能一口气跑很远。他更像彼得，是跳跃的好手，并不真正擅长长跑。平时，他会贴着地面一跃一跃地赶路，受惊时才突然高高跃起。”
        - id: ch02-b02
          speaker: mother_nature
          text: “轻脚能跳得又高又远，所以喜欢住在绿森林。那里有倒下的树，也有纠缠成堆的朽木。危险一来，他一下就能跃过去，敌人却得从下面钻、从上面爬，或是绕道。布朗农夫围田的普通篱笆也难不住他。他越过篱笆，就跟彼得跳过身边那根小木头一样容易。”
        - id: ch02-b03
          speaker: mother_nature
          text: “现在是夏天，轻脚穿着漂亮的红褐色外衣。到了冬天，他可完全是另一副模样。”
        - id: ch02-b04
          speaker: chatterer
          text: “我知道！冬天他的毛是灰色的。我见过好多次，那时他身上一根红毛也没有。”
        - id: ch02-b05
          speaker: mother_nature
          text: “说得对，红色外衣只在夏天穿。再看他的鼻尖，是黑色的，下巴底下也有一块黑斑。鼻梁上的横纹、耳朵内侧和眼睛周围的一圈都泛着白。喉咙和腹面也是白的。彼得，你最留心尾巴了。别回头看，告诉我轻脚的尾巴是什么颜色。”
        - id: ch02-b06
          speaker: peter_rabbit
          text: “白的，雪一样白！所以他才叫白尾鹿，对吧？”
        - id: ch02-b07
          speaker: johnny_chuck
          text: “哼，我可不说它是白的。边缘确实白，可大部分明明跟他的皮毛一个颜色。”
        - id: ch02-b08
          speaker: narrator
          text: 约翰尼正好坐在轻脚身后。刚才轻脚一直垂着尾巴，看起来的确像约翰尼说的那样。可这句话一出口，他的尾巴忽然高高翘起，只露出底面，活像一面尖尖的白旗。从后面看，谁都会以为整条尾巴全是白的。
        - id: ch02-b09
          speaker: mother_nature
          text: “你们注意看，尾巴上的毛很长，也很蓬松。轻脚太太也有一条一模一样的尾巴。这样一来，就算四周一片漆黑，她的宝宝也很容易跟着妈妈。平常吃东西，或者只是四处走动时，轻脚会把尾巴垂下来。可他一受惊，跳着逃走，那面白旗马上就会竖起来。”
        - id: ch02-b10
          speaker: mother_nature
          text: “现在再看看他的角。大家常叫它们角，其实它们是鹿角。牛角那种真正的角里面是空的，鹿角却是实心的。这个分别一定要记住。鹿科动物头上长的都是鹿角。轻脚的鹿角向前弯，分出的角叉长在后面。”
        - id: ch02-b11
          speaker: narrator
          text: 轻脚神气地昂着头，大家都仔细端详他头顶的冠冕。
        - id: ch02-b12
          speaker: whitefoot
          text: “那些鹿角怎么了？上面好像长着毛。我还以为鹿角应该像骨头一样硬呢。”
        - id: ch02-b13
          speaker: mother_nature
          text: “再过一个月，它们就会像骨头一样硬了。现在这层带毛的皮会脱落。轻脚会拿鹿角在树上反复磨，直到整副角变得光滑，一点儿茸皮也不剩。你们眼前看到的这一副，正是他今年夏天刚长出来的新鹿角。”
        - id: ch02-b14
          speaker: danny_meadow_mouse
          text: “整副鹿角都是今年长的？那他以前没有鹿角吗？这么大的东西，究竟怎么长出来呀？”
        - id: ch02-b15
          speaker: jumper
          text: “你不知道他每年都会脱掉鹿角吗？去年冬末，旧鹿角就掉了。没过多久我见过他。他好像有点难为情，头也不像现在昂得这么神气。那时他很像轻脚太太，因为她从来不长鹿角。”
        - id: ch02-b16
          speaker: danny_meadow_mouse
          text: “可又硬又像骨头的鹿角，到底是怎么长出来的呢？”
        - id: ch02-b17
          speaker: mother_nature
          text: “鹿角生长时并不硬，也不像骨头。旧鹿角刚一掉，新的就开始从头顶冒出来，就像植物从土里发芽。那时它们柔软又娇嫩，里面充满血液，跟身体的其他部位一样。最初只有两个圆圆的小包。它们一点点向外伸展，越长越大。接着，主干上又冒出一个个小包，也慢慢长大，最后才变成现在这些分枝。”
        - id: ch02-b18
          speaker: mother_nature
          text: “生长的时候，鹿角一直裹着一层带细毛的皮，受到它的保护。这层皮看起来很像人们所说的天鹅绒，所以鹿角裹着它的时候，人们便说鹿角处在茸角期。等鹿角长到足够大，就会开始收缩、变硬。现在已经相当硬了，那层茸皮也很快就要脱落。”
        - id: ch02-b19
          speaker: mother_nature
          text: “新鹿角太娇嫩，轻脚怕碰伤它们。那段日子里，他不必要就不走动，总是独自待着。等到天气转凉，鹿角完全长好，谁要挡他的路，他就能用锋利的角尖来对付谁了。”
    - id: ch03
      title: 林中的生活
      blocks:
        - id: ch03-b01
          speaker: mother_nature
          text: “轻脚太太不长鹿角。除此之外，她和轻脚很像，只是个头稍小。你们见过她的宝宝吗？”
        - id: ch03-b02
          speaker: jumper
          text: “我见过。他们真是最可爱的小家伙，模样像妈妈，只是穿着特别漂亮的斑点外衣。”
        - id: ch03-b03
          speaker: mother_nature
          text: “那些斑点能帮宝宝躲过敌人的眼睛。阳光穿过树叶，在地上洒出点点亮斑。他们躺在那样的地方，身上的斑点便和周围融在一起。只要自己不动，就连最锐利的眼睛从很近的地方经过，也常常看不见他们。他们会把脑袋和小脖子贴着地面伸平，连一根毛也不动。宝宝们通常很听话，因为妈妈离开他们时，最先教的就是千万别动。”
        - id: ch03-b04
          speaker: mother_nature
          text: “几个月以后，他们能稍稍照顾自己，身上的斑点就会消失。轻脚太太通常每年春天生两个宝宝，偶尔也会生三个，不过两个才是常有的数目。她是个好妈妈，时时留意周围可能出现的危险。孩子还很小时，她会把他们藏在最深、最不容易被发现的灌木丛里。”
        - id: ch03-b05
          speaker: mother_nature
          text: “对了，你们知道轻脚和轻脚太太都很会游泳吗？”
        - id: ch03-b06
          speaker: narrator
          text: 快乐杰克脸上的惊讶一点儿也藏不住。
        - id: ch03-b07
          speaker: happy_jack
          text: “长着那样的小蹄子，怎么可能游泳呢？”
          emotion: surprised
        - id: ch03-b08
          speaker: mother_nature
          text: “可轻脚就是游得很好，而且喜欢水。游泳也是他逃命的办法。狼或狗追得太紧，他就奔向最近的水面，一头跳进去。要他横渡一条河，甚至游过一座小湖，他也不会迟疑。”
        - id: ch03-b09
          speaker: mother_nature
          text: “轻脚喜欢灌木稠密、又散落着空地的森林。他也爱待在森林边缘。那里离保护他的树木和灌丛不远，走几步却能来到开阔的田野。他需要喝很多水，所以住处附近往往有小溪、池塘或河流。他还会选定一个自己最喜欢的饮水地点，每天清早和黄昏时分都到那里喝水。”
        - id: ch03-b10
          speaker: mother_nature
          text: “白天，他通常藏在灌木丛里，或躲到被风刮倒的树木下面睡觉，直到下午很晚才出来。傍晚刚开始，是他进食最多的时候。他吃青草和其他植物，也吃山毛榉果、橡子，还有一些树的叶子和嫩枝，夏天连睡莲叶也吃。不过我很遗憾，他也特别爱钻进布朗农夫的菜园，那里几乎每一样绿色的东西都让他嘴馋。”
        - id: ch03-b11
          speaker: mother_nature
          text: “冬天对轻脚也很难熬，积雪很深的时候尤其如此。那时，他会和轻脚太太、孩子们一起住进所谓的鹿场。那可不是真正的院子，更不是布朗农夫家那种院子。它只是一个既有遮蔽又有食物的地方。一家人反复踩着相同的路线，把雪踏成一条条纵横交错的小径，靠常青树的嫩枝和叶子充饥。雪越积越深，他们便被困在鹿场里，成了囚徒，只能等春天把雪融化，重新放他们自由。”
        - id: ch03-b12
          speaker: mother_nature
          text: “轻脚保全自己，主要靠鼻子和耳朵，而不是眼睛。他的嗅觉灵敏极了。四处走动时，他通常迎着风去，也就是朝风吹来的方向走。前面若有敌人，风就会把对方的气味送到他的鼻子里。他又聪明又机警。躺下休息前，他常常先折回一小段路，找个能看见自己足迹的地方。谁要循着足迹追来，他就能提前发现，及时躲开。”
        - id: ch03-b13
          speaker: mother_nature
          text: “轻脚最可怕的敌人，是拿着可怕猎枪的猎人。我实在不明白，怎么会有人望进他那双温柔的大眼睛，随后竟还能想到要杀死他。轻脚住在人类家园附近时，狗是仅次于猎人的凶恶敌人。若住在有狼、美洲狮和熊出没的地方，他就得时刻提防它们。猞猁簇耳也一直守候着机会，想捉走轻脚的宝宝。”
    - id: ch04
      title: 黑尾与叉角
      blocks:
        - id: ch04-b01
          speaker: mother_nature
          text: “白尾鹿在整个鹿科中分布最广。从阳光灿烂的南方，一直到北方的大片森林，过去到处都能找到他们。只有这个广大国家中部的辽阔平原是例外。不过，那说的是从前。许多地方的白尾鹿遭到人类过度猎杀，如今已经消失了。生活在温暖南方的白尾鹿，也永远长不到北方同类那么高大。”
        - id: ch04-b02
          speaker: mother_nature
          text: “遥远西部的大山里，住着轻脚的两个表亲。一个是黑尾，也叫哥伦比亚黑尾鹿。另一个是骡鹿叉角。黑尾差不多和轻脚一样大，却没有他那么优雅。黑尾的耳朵更大，很像与他关系密切的叉角。他尾巴的上表面全是黑色，名字就是这么来的。”
        - id: ch04-b03
          speaker: mother_nature
          text: “黑尾的鹿角并不总是一个模样，有时很像轻脚的，有时又很像叉角的。他最喜欢住在茂密的森林里，分布的地方并不多。说到设法迷惑猎人、从猎人手里逃脱，他可远没有轻脚那么聪明。”
        - id: ch04-b04
          speaker: mother_nature
          text: “叉角也叫骡鹿，有时还叫跳鹿。他比轻脚高大，身体也粗壮得多。那双大耳朵很像骡子的耳朵，骡鹿这个名字便是这样来的。他的脸是暗白色，额头上有黑斑，下巴底下有一道黑纹。尾巴比较短，根部也不宽，颜色是白的，尖端却是黑的。”
        - id: ch04-b05
          speaker: mother_nature
          text: “正因为尾巴尖是黑的，有人也把叉角叫作黑尾鹿。这个叫法可不对，因为那名字属于他的表亲，真正的黑尾。”
        - id: ch04-b06
          speaker: mother_nature
          text: “叉角最神气的就是鹿角，比轻脚的还漂亮。轻脚的角叉排成一列，叉角的却两两分开，像字母 Y。通常每支鹿角上有两对。叉角喜欢崎岖的地方。他跳跃的本领很强，穿过那些地方轻轻松松，敌人却很难跟上。可他和黑尾一样，没有白尾鹿轻脚那么聪明，所以更容易被猎人杀死。”
        - id: ch04-b07
          speaker: mother_nature
          text: “轻脚、黑尾和叉角这些鹿科成员，都属于长圆角的一支。他们的体形比长扁角的那些鹿小得多。不过，扁角鹿里有一位，个头大得能让其他鹿全显得很小。那就是麋鹿号手，也叫美洲赤鹿。明天，我再给你们讲他的故事。”
