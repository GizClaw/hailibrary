  chapters:
    - id: ch01
      title: Lightfoot, Blacktail and Forkhorn
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: "No one in the Green Forest was admired more than Lightfoot the Deer. So everyone was delighted when, just as the morning lesson was about to start, Lightfoot stepped gracefully from a thicket and bowed to Old Mother Nature."
        - id: ch01-b02
          speaker: lightfoot
          text: "I heard that my little friends were going to learn about my family this morning. I hoped you wouldn't mind if I joined them."
        - id: ch01-b03
          speaker: peter_rabbit
          text: "Of course we don't mind!"
          emotion: happy
        - id: ch01-b04
          speaker: narrator
          text: "Peter had forgotten that Lightfoot was speaking to Old Mother Nature. Everyone laughed, even Old Mother Nature herself. Peter was so earnest and so excited that they could not help it."
        - id: ch01-b05
          speaker: old_mother_nature
          text: "Peter has answered for all of us. You are very welcome, Lightfoot. I meant to send for you, but it slipped my mind. We are all delighted that you came. You will probably be most comfortable lying down, but first, please stand in that open place for a few minutes. I want everyone to get a good look at you."
        - id: ch01-b06
          speaker: narrator
          text: "Lightfoot crossed to the little clearing and stood in the full sunlight. He was a picture of grace and beauty. He knew he was handsome, but his honest pride only gave him a noble dignity. More than one of his little neighbors gasped with admiration."
        - id: ch01-b07
          speaker: old_mother_nature
          text: "Here is one of the most beautiful of all my children, and knowing that has not spoiled him. As you know, Lightfoot belongs to the Deer family. That family is part of the order called Ungulata, which means animals with hoofs."
        - id: ch01-b08
          speaker: narrator
          text: "Peter sat up sharply. His ears stood as straight as exclamation points."
        - id: ch01-b09
          speaker: peter_rabbit
          text: "Farmer Brown's cows have those funny feet called hoofs. Does that make them relatives of Lightfoot?"
        - id: ch01-b10
          speaker: old_mother_nature
          text: "They belong to a different family in the same order, so they are distant cousins of his."
        - id: ch01-b11
          speaker: chatterer
          text: "Then what about Farmer Brown's Pigs?"
        - id: ch01-b12
          speaker: old_mother_nature
          text: "They belong to that order too, so they are related as well."
        - id: ch01-b13
          speaker: chatterer
          text: "Huh! If I were Lightfoot, I would never admit that such ugly, stupid creatures were my relatives."
        - id: ch01-b14
          speaker: old_mother_nature
          text: "Remember, Chatterer, Prickly Porky the Porcupine and Robber the Rat belong to the same order that you do."
        - id: ch01-b15
          speaker: narrator
          text: "Old Mother Nature spoke softly, and Chatterer hung his head."
        - id: ch01-b16
          speaker: old_mother_nature
          text: "Lightfoot is the White-tailed Deer, also called the Virginia Deer. In some ways he is the loveliest member of the Deer family. One look at those slim legs tells you they were made for speed. He can move very fast, though he cannot keep it up for a long distance without stopping to rest. Like Peter, he is a jumper more than a true runner. Most of the time he travels in low bounds. When something alarms him, he throws in a high bound now and then."
        - id: ch01-b17
          speaker: old_mother_nature
          text: "Lightfoot can jump both far and high. That is one reason he likes the Green Forest, with its fallen trees and tangles of old logs. When danger comes, he sails over them. His enemies have to crawl underneath, climb across, or go around. Farmer Brown's ordinary fences do not trouble him at all. He clears them as easily as Peter jumps over the little log beside him."
        - id: ch01-b18
          speaker: old_mother_nature
          text: "Because it is summer, Lightfoot is wearing a handsome reddish coat. In winter he looks completely different."
        - id: ch01-b19
          speaker: chatterer
          text: "I know what he looks like then. His coat is gray. I've seen him many times in winter, and there isn't one red hair on him."
        - id: ch01-b20
          speaker: old_mother_nature
          text: "That is right. He wears red only in summer. Now notice the black tip of his nose and the black spot beneath his chin. A pale band crosses his nose. The inside of each ear and the ring around each eye are pale too. His throat and all his underparts are white. Peter, since tails interest you so much, tell me what color Lightfoot's tail is without looking."
        - id: ch01-b21
          speaker: peter_rabbit
          text: "White. Snowy white! I suppose that is why people call him the White-tailed Deer."
        - id: ch01-b22
          speaker: johnny_chuck
          text: "Huh! I wouldn't call it white. It has a white edge, but most of it matches his coat."
        - id: ch01-b23
          speaker: narrator
          text: "Johnny was sitting a little behind Lightfoot. Until then, Lightfoot's tail had hung down, and it looked just as Johnny said. At Johnny's words, the tail flew up. Only the underside showed now, like a pointed white flag. Anyone behind him might have thought the whole tail was white."
        - id: ch01-b24
          speaker: old_mother_nature
          text: "See how long and fluffy the hair is. Mrs. Lightfoot has a tail just like it, so her babies can follow her easily in the dark. Lightfoot keeps his tail down while he feeds or walks. When he is frightened and bounds away, up goes the white flag."
        - id: ch01-b25
          speaker: old_mother_nature
          text: "Now look at what people often call his horns. They are really antlers. True horns, like the horns of Farmer Brown's cows, are hollow. Antlers are solid. Every member of the Deer family has antlers rather than horns. Lightfoot's antlers curve forward, and their branches, or tines, grow from the back."
        - id: ch01-b26
          speaker: narrator
          text: "Everyone studied Lightfoot's crown while he held his head proudly."
        - id: ch01-b27
          speaker: whitefoot
          text: "What is wrong with them? They look as though they are covered with fur. I thought antlers were hard like bone."
        - id: ch01-b28
          speaker: old_mother_nature
          text: "They will be hard a month from now. That furry covering will come off. Lightfoot will rub it against the trees until his antlers are smooth and not a trace remains. This is the new set he grew during the summer."
        - id: ch01-b29
          speaker: danny_meadow_mouse
          text: "Do you mean he grew those whole antlers this summer? Didn't he have any before? How can anything like that grow?"
        - id: ch01-b30
          speaker: jumper
          text: "Don't you know that he loses his antlers every year? I thought everybody knew that. The old pair fell off late last winter. I saw him soon afterward. He looked almost ashamed and didn't hold his head nearly as proudly as he does now. Without antlers, he looked a lot like Mrs. Lightfoot. She never has any."
        - id: ch01-b31
          speaker: danny_meadow_mouse
          text: "But how can hard, bony antlers grow in the first place?"
        - id: ch01-b32
          speaker: old_mother_nature
          text: "They were not hard or bony while they were growing. As soon as the old antlers dropped, new ones began to sprout from Lightfoot's head, much as plants sprout from the ground. At that stage they were soft, very tender, and full of blood, just like every other living part of his body. First there were only two round knobs. Those knobs pushed outward and grew longer and longer. Then little knobs sprang from the main stems. They grew too, until they became all the branches you can see now."
        - id: ch01-b33
          speaker: old_mother_nature
          text: "A furry skin protected them all that time. It looks much like the cloth people call velvet, so antlers with that covering are said to be in the velvet. Once the antlers reached their full size, they began to shrink and harden. They are quite hard now, and soon the velvet will come away."
        - id: ch01-b34
          speaker: old_mother_nature
          text: "While they were growing, they were so tender that Lightfoot moved only when he had to and kept to himself. He was afraid of hurting them. By the time cool weather arrives, he will be ready to use those sharp points against anyone who gets in his way."
        - id: ch01-b35
          speaker: old_mother_nature
          text: "As Jumper told you, Mrs. Lightfoot has no antlers. Apart from being a little smaller, she looks much like Lightfoot. Has anyone seen her babies?"
        - id: ch01-b36
          speaker: jumper
          text: "I have. They are dear little things. They look like their mother, except that their coats are covered with beautiful spots."
        - id: ch01-b37
          speaker: old_mother_nature
          text: "Those spots help the babies stay hidden from their enemies. Sunlight breaks through the leaves and scatters bright patches over the ground. When the little Deer lie among those patches, the spots on their coats blend with the light around them. Unless the babies move, even the sharpest eyes may pass close by without finding them. They stretch their little necks and heads flat against the ground and do not move so much as one hair. Most of them are very obedient. The first thing their mother teaches them is to stay perfectly still whenever she leaves them."
        - id: ch01-b38
          speaker: old_mother_nature
          text: "The spots vanish when the young Deer are a few months old and can take a little care of themselves. Mrs. Lightfoot usually has two babies in the spring. Once in a while she has three, but two is the usual number. She is a good mother and always watches for danger. While the babies are tiny, she hides them in the deepest thickets."
        - id: ch01-b39
          speaker: old_mother_nature
          text: "By the way, did you know that Lightfoot and Mrs. Lightfoot are excellent swimmers?"
        - id: ch01-b40
          speaker: narrator
          text: "Happy Jack Squirrel looked every bit as surprised as he felt."
        - id: ch01-b41
          speaker: happy_jack
          text: "How can anyone swim with little hoofed feet like Lightfoot's?"
          emotion: surprised
        - id: ch01-b42
          speaker: old_mother_nature
          text: "He does it very well, and he likes the water. Swimming is one way he escapes his enemies. If Wolves or Dogs press him hard, he runs to the nearest water and plunges in. He will swim across a river or even a small lake without hesitation."
        - id: ch01-b43
          speaker: old_mother_nature
          text: "Lightfoot prefers a forest with close thickets and open spaces here and there. He especially likes the edge of the Green Forest. There he can step into the open fields while staying only a short distance from the shelter of trees and bushes. He needs plenty of water, so you will usually find him near a brook, pond, or river. He chooses a favorite drinking place and returns to it early in the morning and just as dusk comes."
        - id: ch01-b44
          speaker: old_mother_nature
          text: "During the day, he usually sleeps out of sight in a thicket or beneath a fallen tree. He comes out late in the afternoon and does most of his feeding early in the evening. He eats grass and other plants, beechnuts and acorns, and the leaves and twigs of certain trees. In summer he eats lily pads. I am sorry to say that he also loves Farmer Brown's garden, where nearly every green plant tempts him."
        - id: ch01-b45
          speaker: old_mother_nature
          text: "Like so many other animals, Lightfoot has a hard time in winter, especially when the snow lies deep. Then he, Mrs. Lightfoot, and their children live in a place called a yard. It is not a fenced yard like Farmer Brown's. It is simply a sheltered place where they can find food. They walk the same routes until the snow is packed down into paths that cross one another again and again. Their food there is mostly twigs and leaves from evergreen trees. As the snow gets deeper, they become prisoners inside that little network. Only when spring melts the snow can they wander freely again."
        - id: ch01-b46
          speaker: old_mother_nature
          text: "For safety, Lightfoot trusts his nose and ears more than his eyes. His sense of smell is wonderful. When he moves about, he generally travels upwind. That means he goes toward the place the wind is blowing from. Any enemy ahead of him sends its scent down the wind to his nose. Lightfoot is clever and cunning too. Before settling down to rest, he often goes back a short distance to a place where he can watch the trail he just made. If anyone begins following that trail, Lightfoot sees the danger in time."
        - id: ch01-b47
          speaker: old_mother_nature
          text: "His worst enemy is the hunter with a terrible gun. I cannot understand how anyone can look into Lightfoot's great soft eyes and think of killing him. Near people's homes, Dogs are his next worst enemies. In country where Wolves, Panthers, and Bears live, he must watch for them constantly. Tufty the Lynx is always hunting for Lightfoot's babies."
        - id: ch01-b48
          speaker: old_mother_nature
          text: "The White-tailed Deer is spread more widely than any other member of the Deer family. He lives all the way from the Sunny South to the great forests of the North. The one part of this country where he was not found was the vast open plain across the middle. That is how things used to be, at least. People have hunted White-tails so heavily that they have disappeared from many places where they once lived. Those in the Sunny South never grow as large as the ones in the North."
        - id: ch01-b49
          speaker: old_mother_nature
          text: "Two of Lightfoot's cousins live in the great mountains of the Far West. One is Blacktail, the Columbian Black-tailed Deer. The other is Forkhorn the Mule Deer, who is closely related to Blacktail. Blacktail is almost as large as Lightfoot, though not quite as graceful. His ears are bigger and look much like Forkhorn's. The entire upper side of his tail is black, which gives him his name."
        - id: ch01-b50
          speaker: old_mother_nature
          text: "Blacktail's antlers vary. Sometimes they resemble Lightfoot's, and sometimes they resemble Forkhorn's. He loves dense forests and does not live over a very wide area. He is not nearly as clever as Lightfoot at fooling hunters."
        - id: ch01-b51
          speaker: old_mother_nature
          text: "Forkhorn is also called the Mule Deer or the Jumping Deer. He is larger and much more heavily built than Lightfoot. His great ears look so much like a Mule's that they gave him his name. His face is dull white, with a black patch on the forehead and a black band beneath the chin. His tail is rather short and narrow at the base. It is white with a black tip. This sometimes makes people call him a Black-tailed Deer, but that name belongs to his cousin, the true Blacktail."
        - id: ch01-b52
          speaker: old_mother_nature
          text: "Forkhorn's antlers are his glory, even finer than Lightfoot's. Instead of standing in a row, the tines grow in pairs shaped like the letter Y. Usually each antler has two such pairs. Forkhorn prefers rough country. His jumping power lets him cross it easily, while his enemies struggle to follow. But like Blacktail, he is far less clever than the White-tail, so hunters kill him more easily."
        - id: ch01-b53
          speaker: old_mother_nature
          text: "Lightfoot, Blacktail, and Forkhorn all belong to the round-antlered branch of the Deer family. They are much smaller than the Deer with flat antlers. Yet one member of that larger branch makes all the others seem small indeed. He is Bugler the Elk, also called Wapiti, and I shall tell you about him tomorrow."
