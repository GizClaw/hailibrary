  chapters:
    - id: ch01
      title: Old Man Coyote and Howler the Wolf
      blocks:
        - id: ch01-b01
          speaker: old_mother_nature
          text: "Of course you all know which branch of the Dog family Old Man Coyote belongs to."
        - id: ch01-b02
          speaker: narrator
          text: Old Mother Nature looked around the circle of little folks, expecting an answer. No one spoke.
        - id: ch01-b03
          speaker: old_mother_nature
          text: "Well, well! I truly am surprised. I thought every one of you knew that Old Man Coyote belongs to the Wolf branch of the family."
          emotion: surprised
        - id: ch01-b04
          speaker: striped_chipmunk
          text: "Do you mean he's a real Wolf?"
          emotion: fearful
        - id: ch01-b05
          speaker: narrator
          text: Striped Chipmunk asked the question timidly.
        - id: ch01-b06
          speaker: old_mother_nature
          text: "Certainly. He is entirely Wolf. He is called the Prairie Wolf because he loves the wide-open plains, not the deep forests where his big cousin Howler the Timber Wolf lives. Reddy Fox is clever, but sometimes I think Old Man Coyote is even cleverer. If you want to get ahead of him, you must get up very early indeed."
        - id: ch01-b07
          speaker: old_mother_nature
          text: "Old Man Coyote's size varies a great deal. Some are only a little bigger than Reddy Fox, while others grow almost as large as Howler. His color varies too. His coat may be brownish-gray or yellowish-brown, with whitish fur underneath. His face is longer than Reddy's. His tail is bushy, though not as thick as a Fox's brush."
        - id: ch01-b08
          speaker: old_mother_nature
          text: "He lives much as Reddy does. But because he is bigger and stronger, he can kill bigger animals. People hate him for taking young Pigs, Lambs, newborn Calves, and poultry, so they are always hunting and trapping him. The more they hunt him, the smarter he becomes. Like Reddy, he knows how to take care of himself, and he is one of the fastest runners of all."
        - id: ch01-b09
          speaker: old_mother_nature
          text: "Some people call him a coward because he runs at the slightest hint of danger. He isn't cowardly. He is simply too smart to take a needless risk. Old Man Coyote believes in safety first, and that is a wise rule for anyone. He never merely assumes something is safe. He makes sure. That makes him very hard to trap. However hungry he is, he will turn away from bait in a trap, even when the trap is hidden too well for him to see it."
        - id: ch01-b10
          speaker: old_mother_nature
          text: "Old Man Coyote is a good husband and father, and he provides well for his family. He and Mrs. Coyote raise a large family each year, sometimes as many as ten babies. Their underground home is much like Reddy Fox's. They eat almost anything they can eat. That includes animals and birds they catch, Frogs, Toads, Snakes, insects, dead animals they find, and even some kinds of fruit."
        - id: ch01-b11
          speaker: old_mother_nature
          text: "Mr. and Mrs. Coyote often hunt as a pair. Once their children are grown, the whole family sometimes hunts together. Working together, they can pull down Lightfoot the Deer."
        - id: ch01-b12
          speaker: old_mother_nature
          text: "Old Man Coyote has one of the strangest voices you will ever hear, and he loves to use it, especially at night. It sounds like many voices all shouting together. The first time you hear it, you can hardly believe so much sound comes from a single throat."
        - id: ch01-b13
          speaker: old_mother_nature
          text: "His big cousin is Howler the Gray Wolf, who is also called the Timber Wolf. Today you find Howler only in the forests of the North and the mountains of the Great West. Long ago, though, Wolves wandered across the greater part of this broad country. He is at least as clever as Reddy Fox and Old Man Coyote, and perhaps cleverer. He also has tremendous strength and courage. That makes him one of the most feared creatures in the Green Forest."
        - id: ch01-b14
          speaker: old_mother_nature
          text: "In summer, when food is plentiful, Howler and Mrs. Wolf are busy raising their family. They take care not to be too bold. In winter, Howler joins his friends and they hunt in packs. Their marvelous noses let them follow Lightfoot the Deer until they run him down. They also kill Sheep and young Cattle."
        - id: ch01-b15
          speaker: old_mother_nature
          text: "The harder the winter becomes, the bolder the Wolves become. They have even attacked people. Wolves in the Far North grow especially large. Winter food is scarce there, so they become terribly fierce. They can go an amazingly long time without anything to eat. Even after such a long fast, they still keep their strength. But hunger leaves them without mercy. They won't attack one another while all are well. Yet if a Wolf in the pack is injured, the others turn on him at once, kill him, and eat him."
        - id: ch01-b16
          speaker: old_mother_nature
          text: "Howler and Mrs. Wolf stay together for life, and each is always loyal to the other. They are excellent parents. They carefully teach their young everything a Wolf needs to know. People have always been their enemies, and that has sharpened the Wolves' wits and cunning in a remarkable way."
        - id: ch01-b17
          speaker: old_mother_nature
          text: "People trying to destroy Wolves have hidden poison inside pieces of meat and left them where Howler and his friends would find them. Howler soon learned that meat lying around might be dangerous. Now poison seldom harms anyone in his family. He is just as clever at finding traps, even when one is buried in his own trail. Sometimes he digs a trap up and springs it without being caught."
        - id: ch01-b18
          speaker: old_mother_nature
          text: "A pack of hunting Wolves has a leader, usually the strongest or cleverest among them. The whole pack obeys that leader. No sound in all the great forests is more dreadful than a Wolf pack howling. Something in that cry strikes terror into the heart of everyone who hears it."
        - id: ch01-b19
          speaker: old_mother_nature
          text: "Howler's coat is usually brownish-gray, which is why he is called the Gray Wolf. Sometimes it is nearly black, and in the Far North it may be snowy white. Howler is closely related to the Dogs people keep as pets. They are really first cousins. Very few Dogs dare face him in a fight."
        - id: ch01-b20
          speaker: peter_rabbit
          text: "My! I'm glad Howler doesn't live near us."
        - id: ch01-b21
          speaker: old_mother_nature
          text: "You should be glad, Peter. He could eat you in about one bite."
        - id: ch01-b22
          speaker: narrator
          text: Peter shivered.
        - id: ch01-b23
          speaker: peter_rabbit
          text: "Are Old Man Coyote and Howler friends?"
        - id: ch01-b24
          speaker: old_mother_nature
          text: "I wouldn't exactly call them friends. Old Man Coyote carefully stays out of Howler's way. But he is smart enough to know that Howler may leave something behind after making a good kill and filling his stomach. So when Howler hunts near Old Man Coyote's neighborhood, Old Man Coyote keeps his eyes and ears open."
        - id: ch01-b25
          speaker: old_mother_nature
          text: "Long ago, when Thunderfoot the Bison ruled the prairies, Howler's family lived on the plains as well as in the forests. Now Howler keeps mostly to forests and mountains. He leaves the prairies and brushy plains to Old Man Coyote."
        - id: ch01-b26
          speaker: old_mother_nature
          text: "Every branch of the Dog family walks on its toes. They never set the whole foot flat on the ground as Buster Bear does. And as you have already learned, all the branches of the Dog family are very smart and intelligent."
        - id: ch01-b27
          speaker: old_mother_nature
          text: "Why, here comes Black Pussy, the cat from Farmer Brown's, down the Lone Little Path. I think some of you smaller ones had better hide before she arrives. She doesn't belong here in the Green Forest, but she has a cousin who does. His name is Yowler the Bob Cat. Would you like to hear about Yowler and his cousins tomorrow?"
        - id: ch01-b28
          speaker: happy_jack
          text: "We'd love that!"
          emotion: happy
        - id: ch01-b29
          speaker: narrator
          text: Happy Jack answered for everyone. Then Black Pussy drew near, and the little folks separated and went their different ways.
