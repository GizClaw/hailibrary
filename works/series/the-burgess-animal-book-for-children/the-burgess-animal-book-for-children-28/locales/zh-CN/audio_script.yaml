audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 亲切生动，带着温和的幽默感
        timbre: 温暖清亮
        pace: 舒缓而富有变化
        pitch: 中等
    mother_nature:
      display_name: 老大自然妈妈
      tts:
        delivery: 慈爱睿智，说话从容而坦率
        timbre: 温厚柔和
        pace: 从容
        pitch: 中低
    peter_rabbit:
      display_name: 彼得兔
      tts:
        delivery: 好奇直率，情绪来得快也去得快
        timbre: 清脆稚气
        pace: 轻快
        pitch: 中高
    striped_chipmunk:
      display_name: 花栗鼠条纹
      tts:
        delivery: 谨慎好奇，开口时略带羞怯
        timbre: 细亮稚嫩
        pace: 稍慢
        pitch: 中高
    happy_jack:
      display_name: 灰松鼠快乐杰克
      tts:
        delivery: 活泼爽快，常替伙伴们热情开口
        timbre: 明亮轻快
        pace: 明快
        pitch: 中高
  chapters:
    - id: ch01
      title: 第二十八章　老郊狼与嚎叫狼
      blocks:
        - id: ch01-b01
          speaker: mother_nature
          text: “你们当然知道老郊狼属于犬科哪一支，对吧？”
        - id: ch01-b02
          speaker: narrator
          text: 老大自然妈妈满怀期待地望着围在身边的小居民，可谁也没有回答。
        - id: ch01-b03
          speaker: mother_nature
          text: “哎呀，这可真让我意外。我还以为你们都知道，老郊狼是狼这一支的成员呢。”
          emotion: surprised
        - id: ch01-b04
          speaker: striped_chipmunk
          text: “您是说，他真的是一头地地道道的狼吗？”
        - id: ch01-b05
          speaker: narrator
          text: 花栗鼠条纹问得怯生生的。
        - id: ch01-b06
          speaker: mother_nature
          text: “当然。他从头到脚都是狼，半点儿不假。他就是草原狼。这个名字，是因为他喜欢辽阔的大平原，不像那位高大的表亲森林狼嚎叫，专爱幽深的森林。红狐雷迪已经很聪明了，可有时候，我觉得老郊狼还要更胜一筹。你若想抢在他前面，可真得起个大早才行。”
        - id: ch01-b07
          speaker: mother_nature
          text: “老郊狼的个头大小不一。小的只比雷迪大一点儿，大的几乎赶得上嚎叫。毛色也不一样，有的是棕灰色，有的是黄褐色，身体下面发白。他的脸比雷迪稍长，尾巴也很蓬松，只是没有雷迪的那么浓密。”
        - id: ch01-b08
          speaker: mother_nature
          text: “他的生活习惯和雷迪很像。不过，他个头更大，力气更强，能捕杀较大的动物。他会咬死小猪、羔羊、刚出生的牛犊和家禽，所以招来人类的憎恨。人们过去一直追捕他、设阱捉他，到现在也没停过。可是他和雷迪一样，越受追捕，头脑越灵，完全照顾得了自己。他还是跑得最快的动物之一。”
        - id: ch01-b09
          speaker: mother_nature
          text: “老郊狼只要发现一点儿危险，随时会转身逃走，因此许多人说他胆小。其实他一点儿也不胆小，只是聪明得不肯白白冒险。他认定凡事都该把安全放在第一位，这条规矩谁遵守都不会错。所以，他从不只凭猜测就认定一样东西没有危险，总要亲自弄明白。想用陷阱捉他可难了。不管饿得多厉害，只要察觉诱饵下面有陷阱，他都会掉头离开。哪怕陷阱藏得巧极了，根本看不见，也骗不了他。”
        - id: ch01-b10
          speaker: mother_nature
          text: “老郊狼是好父亲、好伴侣，也很会养活全家。他和郊狼太太每年都有一大群宝宝，有时多达十个。他们住在地下，家和雷迪的很相似。能吃的东西，他们差不多都吃。抓得到的动物和鸟、青蛙、蟾蜍、蛇、昆虫，偶然找到的动物尸体，甚至一些水果，都在他们的食谱上。”
        - id: ch01-b11
          speaker: mother_nature
          text: “郊狼先生和郊狼太太常常一起捕猎。等孩子全长大，有时一家子会结伴出动。这样合力捕猎，连白尾鹿轻蹄也会被他们放倒。”
        - id: ch01-b12
          speaker: mother_nature
          text: “老郊狼的叫声，是天底下最古怪的声音之一。他偏偏很爱叫，尤其喜欢在夜里放开嗓门。那声音听着像许多嗓门一齐高喊。第一次听见的人怎么也不会相信，这么大一片声响，竟然只来自一副喉咙。”
        - id: ch01-b13
          speaker: mother_nature
          text: “再说他的高大表亲灰狼嚎叫。嚎叫也叫森林狼，如今只能在北方的森林和大西部的群山里找到。从前，这片辽阔国土的大部分地方都有他的足迹。他的脑筋不比雷迪和老郊狼慢，或许还更快，而且力气大、胆量足，是绿森林里最叫人害怕的居民之一。”
        - id: ch01-b14
          speaker: mother_nature
          text: “夏天食物充足，嚎叫和狼太太一心抚养孩子，行动十分小心，不肯过分大胆。冬天一到，嚎叫就会和伙伴们集合，成群捕猎。他们的鼻子非常灵，能够循着气味追赶白尾鹿轻蹄，直到把他追倒。他们也咬死绵羊和小牛。冬天越严酷，他们越大胆，甚至有过袭击人类的事。”
        - id: ch01-b15
          speaker: mother_nature
          text: “遥远北方的狼长得格外高大。那里冬天缺少食物，狼也变得异常凶猛。他们能熬过长得惊人的日子不吃东西，力气却还在。可饥饿会让他们残酷无情。平时他们不会互相攻击，但狼群里只要有一头受伤，其余的狼立刻会扑上去，把他咬死吃掉。”
        - id: ch01-b16
          speaker: mother_nature
          text: “嚎叫和狼太太会相伴一生，永远忠于对方。他们也是最称职的父母，会仔细教会小狼一头狼该懂的所有本领。人类一直与狼为敌，这反而把他们的急智和机警磨炼得非同寻常。”
        - id: ch01-b17
          speaker: mother_nature
          text: “人们为了消灭狼，曾把毒药藏在肉块里，再把肉丢到嚎叫和伙伴们找得到的地方。嚎叫很快发现，随处留下的肉块不对劲。现在，他的家族很少再这样遇害。发现陷阱时，他也一样机警。即使陷阱埋在他常走的小道上，也很难瞒过他。有时，他还会把陷阱刨出来，叫它空夹一下，自己却不会被捉住。”
        - id: ch01-b18
          speaker: mother_nature
          text: “狼群出猎时会有一个首领，通常是最强壮或最聪明的那头狼，大家全听他的号令。在所有大森林里，再没有什么比一群狼齐声长嚎更可怕。那嚎声一钻进耳朵，任谁心里都会生出恐惧。”
        - id: ch01-b19
          speaker: mother_nature
          text: “嚎叫的外衣通常是棕灰色，所以才叫灰狼。有时，他的毛几乎全黑。到了遥远北方，又会变得像雪一样白。他和人类养在身边的狗亲缘很近，彼此是近亲。几乎没有哪条狗敢和嚎叫正面交战。”
        - id: ch01-b20
          speaker: peter_rabbit
          text: “哎呀，幸好嚎叫不住在我们附近！”
        - id: ch01-b21
          speaker: mother_nature
          text: “你当然该觉得庆幸，彼得。他差不多一口就能把你吞下去。”
        - id: ch01-b22
          speaker: narrator
          text: 彼得听了，浑身打了个寒战。
        - id: ch01-b23
          speaker: peter_rabbit
          text: “那老郊狼和嚎叫是朋友吗？”
        - id: ch01-b24
          speaker: mother_nature
          text: “也不能说他们是朋友。老郊狼总会小心躲着嚎叫。不过他知道，嚎叫捕到一顿丰盛的猎物，自己填饱肚子以后，或许还会留下些东西。只要嚎叫来到他的地盘捕猎，他就会睁大眼睛、竖起耳朵，时刻留意那边的动静。”
        - id: ch01-b25
          speaker: mother_nature
          text: “在很久以前，野牛雷蹄还是大草原的主人。那时，嚎叫一家不但住在森林，也生活在草原。如今，嚎叫大多留在森林和群山，把草原和长满灌木的平地让给了老郊狼。”
        - id: ch01-b26
          speaker: mother_nature
          text: “犬科的每一支都有一个共同点。他们走路时全都踮着脚趾，不会像黑熊巴斯特那样，把整个脚掌平放到地上。你们也已经发现，犬科各支都非常聪明，很有头脑。”
        - id: ch01-b27
          speaker: mother_nature
          text: “瞧，布朗农夫家的黑猫咪正沿着孤独小径走来！你们当中个头最小的几位，最好在她赶到以前藏起来。她不属于绿森林，可她有一位表亲住在这儿，就是短尾猫嚎嚎。明天想不想听我讲嚎嚎和他的表亲？”
        - id: ch01-b28
          speaker: happy_jack
          text: “我们太想听啦！”
          emotion: happy
        - id: ch01-b29
          speaker: narrator
          text: 快乐杰克替大家喊出了回答。黑猫咪越走越近，小居民们便四散开来，各自回家去了。
