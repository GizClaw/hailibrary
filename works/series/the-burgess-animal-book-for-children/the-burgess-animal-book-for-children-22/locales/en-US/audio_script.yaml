audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm, observant storytelling
        timbre: clear and gentle
        pace: measured
        pitch: medium
    old_mother_nature:
      display_name: Old Mother Nature
      tts:
        delivery: kindly, assured, and practical
        timbre: warm and full
        pace: unhurried
        pitch: medium-low
    peter_rabbit:
      display_name: Peter Rabbit
      tts:
        delivery: curious, quick, and expressive
        timbre: bright and youthful
        pace: lively
        pitch: medium-high
    happy_jack:
      display_name: Happy Jack
      tts:
        delivery: confident, friendly, and direct
        timbre: bright and full
        pace: lively
        pitch: medium
    danny_meadow_mouse:
      display_name: Danny Meadow Mouse
      tts:
        delivery: modest, sensible, and matter-of-fact
        timbre: small and earthy
        pace: steady
        pitch: medium-high
    jimmy_skunk:
      display_name: Jimmy Skunk
      tts:
        delivery: easygoing, good-natured, and quietly confident
        timbre: mellow and rounded
        pace: leisurely
        pitch: medium-low
    chatterer:
      display_name: Chatterer the Red Squirrel
      tts:
        delivery: excitable, sharp, and teasing
        timbre: bright and wiry
        pace: quick
        pitch: high
  chapters:
    - id: ch01
      title: An Independent Family
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Old Mother Nature had just asked whom they should learn about next when Happy Jack Squirrel noticed someone coming down the Lone Little Path.
        - id: ch01-b02
          speaker: happy_jack
          text: "Look who's coming!"
        - id: ch01-b03
          speaker: narrator
          text: Everyone turned and looked down the Lone Little Path. There came a certain small person, dressed from head to foot in black and white. He ambled along in the most matter-of-fact way, without a worry in the world.
        - id: ch01-b04
          speaker: chatterer
          text: "Hello, Jimmy Skunk! What brings you over to the Green Forest?"
        - id: ch01-b05
          speaker: narrator
          text: Jimmy looked up with a slow, good-natured grin.
        - id: ch01-b06
          speaker: jimmy_skunk
          text: "Hello, everybody. I thought I'd wander over and see your school. I suppose you're all getting so wise that soon you'll think you know everything. Have you seen any fat Beetles around here?"
        - id: ch01-b07
          speaker: narrator
          text: Then Jimmy noticed Old Mother Nature and quickly bowed his head in his funny way.
        - id: ch01-b08
          speaker: jimmy_skunk
          text: "Please excuse me, Mother Nature. I thought school was finished. I don't mean to interrupt."
        - id: ch01-b09
          speaker: narrator
          text: Old Mother Nature smiled. She was rather fond of Jimmy Skunk.
        - id: ch01-b10
          speaker: old_mother_nature
          text: "You aren't interrupting at all. We just finished our lesson about Flitter the Bat and his relatives. In fact, we were trying to decide whom we should study next. I think you've come at exactly the right time. You belong to a large and important order, and all these little folks ought to know something about it. Tell me, Jimmy, how many cousins do you have?"
        - id: ch01-b11
          speaker: narrator
          text: The question surprised Jimmy. He scratched his head and thought about it.
        - id: ch01-b12
          speaker: jimmy_skunk
          text: "Let's see. I have several close cousins in the Skunk branch. But I suppose you mean the cousins outside that branch. There's Shadow the Weasel, Billy Mink, and Little Joe Otter. Those are all I can think of."
        - id: ch01-b13
          speaker: old_mother_nature
          text: "What about Digger the Badger?"
        - id: ch01-b14
          speaker: narrator
          text: Surprise swept across Jimmy's face.
        - id: ch01-b15
          speaker: jimmy_skunk
          text: "Digger the Badger? He isn't my cousin!"
          emotion: surprised
        - id: ch01-b16
          speaker: old_mother_nature
          text: "Tut, tut, tut, Jimmy Skunk! It is certainly time you came to school. Digger the Badger is every bit as much your cousin as Shadow the Weasel. All of you belong to one rather large order. It is called the Carnivora, and that name means flesh-eating."
        - id: ch01-b17
          speaker: old_mother_nature
          text: "You are a member of the Marten or Weasel family, which is called the Mustelidae. Digger belongs to that very same family, so the two of you are cousins. You, Digger, and Glutton the Wolverine make up the stout-bodied branch. Billy Mink, Little Joe Otter, Shadow the Weasel, Pekan the Fisher, and Spite the Marten belong to the slim-bodied branch. You may look very different, but you're all members of one family. That makes all of you cousins. Now that you're here, Jimmy, let's see exactly how much these little folks know about you."
        - id: ch01-b18
          speaker: old_mother_nature
          text: "Peter Rabbit, tell us what you know about Jimmy Skunk."
        - id: ch01-b19
          speaker: peter_rabbit
          text: "I know he's the most independent fellow in the world. He isn't afraid of anyone. Why, the other day I saw Buster Bear step aside for him."
        - id: ch01-b20
          speaker: narrator
          text: Jimmy grinned.
        - id: ch01-b21
          speaker: jimmy_skunk
          text: "Buster always treats me very politely."
        - id: ch01-b22
          speaker: happy_jack
          text: "Everyone does. I've even seen Farmer Brown's boy treat you that way."
        - id: ch01-b23
          speaker: chatterer
          text: "It's easy to be independent when everyone is afraid of you."
        - id: ch01-b24
          speaker: old_mother_nature
          text: "And why is everyone afraid of Jimmy Skunk?"
        - id: ch01-b25
          speaker: peter_rabbit
          text: "Because of the little scent gun he carries. I wish I had one like it."
        - id: ch01-b26
          speaker: narrator
          text: Old Mother Nature shook her head.
        - id: ch01-b27
          speaker: old_mother_nature
          text: "It would never do to trust you with a scent gun like Jimmy's, Peter. You're much too heedless and careless. If you carried one, I'm afraid there would be trouble in the Green Forest and on the Green Meadows all the time. I rather suspect you'd drive everyone else away."
        - id: ch01-b28
          speaker: old_mother_nature
          text: "Jimmy is never heedless or careless. He doesn't use that little scent gun unless he is truly in danger, or at least thinks he is. Most of the time, he makes very sure before he uses it. I'll venture to say that not one of you has ever actually seen Jimmy fire that scent gun."
        - id: ch01-b29
          speaker: narrator
          text: Peter looked at Jumper the Hare. Jumper looked at Chatterer, and Chatterer looked at Happy Jack. Happy Jack looked at Danny Meadow Mouse, who looked at Striped Chipmunk. Striped looked at Johnny Chuck, and Johnny looked at Whitefoot the Wood Mouse. At last they all turned to Old Mother Nature and shook their heads.
        - id: ch01-b30
          speaker: old_mother_nature
          text: "That's just what I thought. Jimmy is wonderfully well armed, but his weapon is only for defense. He never makes the mistake of using that scent gun badly. Everybody knows he has it, and that is why nobody interferes with him. Now, Peter, what more do you know about Jimmy?"
        - id: ch01-b31
          speaker: peter_rabbit
          text: "He's lazy."
        - id: ch01-b32
          speaker: jimmy_skunk
          text: "I'm not lazy! I'm no lazier than you are. You only say that because I don't hurry. I never have to hurry, and I see no sense in rushing when there's no need."
          emotion: angry
        - id: ch01-b33
          speaker: old_mother_nature
          text: "That will do. Go on, Peter. What else do you know about Jimmy?"
        - id: ch01-b34
          speaker: narrator
          text: Peter grinned at Jimmy.
        - id: ch01-b35
          speaker: peter_rabbit
          text: "He's good-natured."
        - id: ch01-b36
          speaker: narrator
          text: Jimmy grinned back.
        - id: ch01-b37
          speaker: jimmy_skunk
          text: "Thank you, Peter."
        - id: ch01-b38
          speaker: peter_rabbit
          text: "He's one of the best-natured people I know. I suppose it's lucky for the rest of us that he is. I've noticed that fat people are usually good-natured, and Jimmy is nearly always fat. In fact, I don't believe I've ever seen him what you'd call really thin, except very early in spring."
        - id: ch01-b39
          speaker: peter_rabbit
          text: "He eats Beetles, grubs, Grasshoppers, Crickets, and every sort of insect. I've also heard that he steals eggs whenever he finds them."
        - id: ch01-b40
          speaker: danny_meadow_mouse
          text: "And he catches members of my family when he can. I never feel safe when Jimmy Skunk is close by."
        - id: ch01-b41
          speaker: narrator
          text: Jimmy did not seem troubled by that at all.
        - id: ch01-b42
          speaker: jimmy_skunk
          text: "I may as well admit that I rather like tender Mouse. I also enjoy a Frog now and then, or a Lizard, or a fish."
        - id: ch01-b43
          speaker: chatterer
          text: "You might also admit that you'll eat young birds when you can get them."
        - id: ch01-b44
          speaker: narrator
          text: Chatterer spoke maliciously, but Jimmy simply looked up at him.
        - id: ch01-b45
          speaker: jimmy_skunk
          text: "That's the pot calling the kettle black."
        - id: ch01-b46
          speaker: narrator
          text: Chatterer made a face but said no more. Everyone knew Jimmy was right. Chatterer had robbed many nests of young birds.
        - id: ch01-b47
          speaker: old_mother_nature
          text: "Is that everything you know about Jimmy, Peter?"
        - id: ch01-b48
          speaker: peter_rabbit
          text: "I think so. Except that he lives in a hole in the ground, and I hardly ever see him during winter. I suppose he sleeps all winter, just like Johnny Chuck."
        - id: ch01-b49
          speaker: jimmy_skunk
          text: "Then you'd better think again, Peter. I do sleep a great deal during winter, but I don't go into my winter quarters until well after the snow arrives. Even then, I don't sleep the way Johnny Chuck does. Sometimes I come out in the middle of winter and hunt around for a while."
        - id: ch01-b50
          speaker: old_mother_nature
          text: "Do you dig your own house?"
        - id: ch01-b51
          speaker: narrator
          text: Jimmy shook his head.
        - id: ch01-b52
          speaker: jimmy_skunk
          text: "Not if I can avoid it. Digging is too much work. I'll do it if I must, but I'd much rather move into one of Johnny Chuck's old houses. They suit me very well."
        - id: ch01-b53
          speaker: old_mother_nature
          text: "Now I want you all to look at Jimmy very closely. He's about the same size as Black Pussy, the Cat from Farmer Brown's. His coat is black with broad white stripes. But you mustn't think all Skunks have exactly the same markings. I dare say that no two of Jimmy's children would look exactly alike. One or more of them might even be entirely black, with only a little patch of white on the tail."
        - id: ch01-b54
          speaker: old_mother_nature
          text: "Next, look at the long, sharp claws on his front feet. He uses them to dig grubs and other insects out of the ground. He also pulls over sticks and stones with those claws while searching for Beetles. And watch the way he sets his feet on the ground. He walks very much as Buster Bear does."
        - id: ch01-b55
          speaker: old_mother_nature
          text: "That big, bushy tail has a special purpose. Jimmy uses it to warn other people. He never fires his scent gun without giving a warning first. So when you see that tail begin to rise into the air, be wise and watch out."
        - id: ch01-b56
          speaker: old_mother_nature
          text: "A great many people make the mistake of thinking that Jimmy and his family cause a great deal of harm. The truth is quite the opposite. They do a great deal of good for people. Once in a while, they may make the mistake of stealing Chickens or eggs, but that happens only now and then. They more than make up for anything they take by destroying so many pests."
        - id: ch01-b57
          speaker: old_mother_nature
          text: "Jimmy and Mrs. Skunk have a large family every year, usually somewhere between six and ten babies. Mrs. Skunk generally lives by herself when those babies are born. But as soon as the little ones are big enough to walk, their father joins the family again. On almost any pleasant evening, you may see all of them setting out together to hunt Grasshoppers, Beetles, and other things to eat. Often the whole family stays together through the winter and does not break up until spring."
        - id: ch01-b58
          speaker: old_mother_nature
          text: "Jimmy is one of the neatest of all my little people. He takes the very best care of that handsome coat. He isn't afraid of water, either, and he can swim whenever he needs to. Most of his hunting is done at night, while he sleeps during the day. Jimmy is one of the few little wild people who haven't been driven away by humans. In fact, he often chooses to make his home quite close to a human home."
        - id: ch01-b59
          speaker: old_mother_nature
          text: "Jimmy has Skunk cousins of his own in nearly every part of this great country. Way down in the Southwest lives the Hog-nosed Skunk. He is one of the largest members of the Skunk family. He gets that name from the shape of his nose and from the way he roots around in the ground, very much as a hog does."
        - id: ch01-b60
          speaker: old_mother_nature
          text: "He has another name too. People call him the Badger Skunk because of the great claws on his front feet and because he is such a strong digger. His fur isn't as fine as Jimmy's. It is rather coarse and harsh. And even though Jimmy eats many insects, the Hog-nosed Skunk eats still more of them."
        - id: ch01-b61
          speaker: old_mother_nature
          text: "Jimmy's smallest close cousin is the Little Spotted Skunk. He is only about half Jimmy's size. Instead of the white stripes Jimmy wears, this little cousin's coat is covered with uneven white lines and spots, and they make him look very handsome. He lives throughout the southern half of the country. His habits are much like Jimmy's, though he is far livelier. Once in a while, he even climbs into low trees."
        - id: ch01-b62
          speaker: old_mother_nature
          text: "Like Jimmy, the Little Spotted Skunk eats almost anything he can find. And it goes without saying that he carries a little scent gun just as Jimmy does. That reminds me, Jimmy. What do you do when you become angry? Show us, please."
        - id: ch01-b63
          speaker: narrator
          text: Jimmy gave a strange little growl and stamped the ground with his front feet. Old Mother Nature laughed.
        - id: ch01-b64
          speaker: old_mother_nature
          text: "If you ever see Jimmy do that, pretend you haven't noticed him and stay out of his way."
        - id: ch01-b65
          speaker: peter_rabbit
          text: "Doesn't Jimmy have any enemies at all?"
        - id: ch01-b66
          speaker: old_mother_nature
          text: "That depends on just how hungry some animals become. Hooty the Owl doesn't seem to mind Jimmy's little scent gun, and he is the only one I can think of who doesn't. Some of the bigger animals might try to catch Jimmy if they were starving. Even then, I think they would stop and think twice before doing it. Now, who knows where Digger the Badger is living?"
        - id: ch01-b67
          speaker: peter_rabbit
          text: "I do. He lives on the Green Meadows, near the Old Pasture."
        - id: ch01-b68
          speaker: old_mother_nature
          text: "Very well, Peter. Run over and visit him. Tomorrow morning, you can tell us all about it."
