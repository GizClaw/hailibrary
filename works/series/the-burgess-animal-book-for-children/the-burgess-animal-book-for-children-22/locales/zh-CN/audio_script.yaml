audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 亲切生动，带着温和的幽默感
        timbre: 温暖清亮
        pace: 舒缓而富有变化
        pitch: 中等
    mother_nature:
      display_name: 老大自然妈妈
      tts:
        delivery: 慈爱睿智，说话从容而坦率
        timbre: 温厚柔和
        pace: 从容
        pitch: 中低
    peter_rabbit:
      display_name: 彼得兔
      tts:
        delivery: 好奇直率，情绪来得快也去得快
        timbre: 清脆稚气
        pace: 轻快
        pitch: 中高
    happy_jack:
      display_name: 灰松鼠快乐杰克
      tts:
        delivery: 自信好胜，受窘时有些急躁
        timbre: 明亮爽脆
        pace: 轻快
        pitch: 中高
    chatterer:
      display_name: 红松鼠喋喋
      tts:
        delivery: 伶牙俐齿，争强好胜又活泼
        timbre: 尖细清亮
        pace: 明快
        pitch: 高
    jimmy_skunk:
      display_name: 臭鼬吉米
      tts:
        delivery: 慢条斯理，和气自信，偶尔带点机智的反驳
        timbre: 圆润沉稳
        pace: 舒缓
        pitch: 中低
    danny_meadow_mouse:
      display_name: 草地田鼠丹尼
      tts:
        delivery: 朴实谦逊，遇事谨慎又很有主见
        timbre: 温和结实
        pace: 稳健
        pitch: 中等
  chapters:
    - id: ch01
      title: 吉米来上课
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 老大自然妈妈刚问下一课该认识谁，灰松鼠快乐杰克便看见孤零零小径上有人走来。
        - id: ch01-b02
          speaker: happy_jack
          text: “快看，谁来了！”
        - id: ch01-b03
          speaker: narrator
          text: 大家一齐转头，顺着孤零零小径望过去。一个浑身黑白相间的小家伙正慢悠悠地走来。他的步子不紧不慢，那副若无其事、什么也不担心的样子，再自然不过了。他正是臭鼬吉米。
        - id: ch01-b04
          speaker: chatterer
          text: “你好啊，吉米！你怎么跑到绿森林这边来了？”
        - id: ch01-b05
          speaker: narrator
          text: 吉米抬起头，慢吞吞地咧嘴一笑，样子很和气。
        - id: ch01-b06
          speaker: jimmy_skunk
          text: “大家好。我过来看看你们的学校。你们一定学得越来越聪明，过不了多久，恐怕要以为什么都懂了。对了，你们在附近见过肥甲虫吗？”
        - id: ch01-b07
          speaker: narrator
          text: 说到这里，吉米才发现老大自然妈妈也在。他赶紧滑稽地低头行了一礼。
        - id: ch01-b08
          speaker: jimmy_skunk
          text: “请您原谅，大自然妈妈。我以为已经放学了，可不想打断你们上课。”
        - id: ch01-b09
          speaker: narrator
          text: 老大自然妈妈笑了。其实，她相当喜欢吉米。
        - id: ch01-b10
          speaker: mother_nature
          text: “你没有打扰。我们刚讲完蝙蝠飞飞和他的亲戚，正愁下一课不知道选谁。你来得正好。你所属的那个目又大又重要，这些小家伙都该认识。吉米，你有多少位表亲？”
        - id: ch01-b11
          speaker: narrator
          text: 吉米有些意外。他挠着头，认真想了一会儿。
        - id: ch01-b12
          speaker: jimmy_skunk
          text: “臭鼬这一支里，我有好几位近亲。不过您问的，大概是别的表亲吧？我想得到的有黄鼠狼影子、水貂比利和水獭小乔。眼下就这些。”
        - id: ch01-b13
          speaker: mother_nature
          text: “那獾挖挖呢？”
        - id: ch01-b14
          speaker: jimmy_skunk
          text: “獾挖挖？他可不是我的表亲！”
          emotion: surprised
        - id: ch01-b15
          speaker: mother_nature
          text: “啧，啧，吉米，你早该来上课了。挖挖和你的亲缘，同黄鼠狼影子和你的亲缘完全一样。你们同属一个相当庞大的目，名叫食肉目，意思就是‘以肉为食’。你们也都属于鼬科，所以当然是表亲。你、挖挖和狼獾贪吃鬼，是这个家族里身材粗壮的一支。水貂比利、水獭小乔、黄鼠狼影子、渔貂佩坎和貂狠心，则是身材细长的一支。别看你们模样不同，大家还是一家人。既然你来了，我们正好看看这些学生对你了解多少。”
    - id: ch02
      title: 谁也不敢招惹他
      blocks:
        - id: ch02-b01
          speaker: mother_nature
          text: “彼得，先由你来说说臭鼬吉米。”
        - id: ch02-b02
          speaker: peter_rabbit
          text: “我知道，他是世上最独立自主的家伙。他谁也不怕。前几天，我还亲眼看到熊巴斯特给他让路呢。”
        - id: ch02-b03
          speaker: narrator
          text: 吉米听了，咧嘴笑起来。
        - id: ch02-b04
          speaker: jimmy_skunk
          text: “巴斯特一直待我很有礼貌。”
        - id: ch02-b05
          speaker: happy_jack
          text: “我也发现了。谁见到你都很客气，连布朗农夫家的男孩也是这样。”
        - id: ch02-b06
          speaker: chatterer
          text: “大家全都怕你，你当然想怎么走就怎么走！”
          emotion: angry
        - id: ch02-b07
          speaker: mother_nature
          text: “大家为什么怕吉米？”
        - id: ch02-b08
          speaker: peter_rabbit
          text: “因为他身上有一把小臭气枪。我要是也有一把就好了。”
        - id: ch02-b09
          speaker: narrator
          text: 老大自然妈妈摇了摇头。
        - id: ch02-b10
          speaker: mother_nature
          text: “把吉米那样的枪交给你可不行。你做事太莽撞，也太粗心。要是你也有一把，绿森林和绿草原准会天天出乱子，最后大家说不定全被你赶跑。吉米从不莽撞，也不粗心。只有真正遇到危险，或是以为危险就在眼前，他才会使用这件武器。通常，他要到十分确定时才会动用它。我敢说，你们谁也没见过他真的开动那把小臭气枪。”
        - id: ch02-b11
          speaker: narrator
          text: 彼得看看长耳野兔跳跳，跳跳看看喋喋。喋喋又看向快乐杰克，快乐杰克看向草地田鼠丹尼。接着，丹尼看花栗鼠条纹，条纹看土拨鼠约翰尼，约翰尼再看林鼠白足。最后，他们一起望着老大自然妈妈，个个摇头。
        - id: ch02-b12
          speaker: mother_nature
          text: “我就知道。吉米身上的武器厉害得很，却只用来保护自己，从来不会犯下误用它的错误。可是大家都知道他有这件武器，所以谁也不敢妨碍他。彼得，你还知道吉米的什么事？”
        - id: ch02-b13
          speaker: peter_rabbit
          text: “他很懒。”
        - id: ch02-b14
          speaker: jimmy_skunk
          text: “我才不懒！我只是不慌不忙。既然不用赶，我为什么非要着急？没必要的时候匆匆忙忙，我看不出有什么好处。”
          emotion: angry
        - id: ch02-b15
          speaker: mother_nature
          text: “好了。彼得，接着说。”
        - id: ch02-b16
          speaker: peter_rabbit
          text: “吉米的脾气很好。”
        - id: ch02-b17
          speaker: narrator
          text: 彼得笑着看他，吉米也笑了。
        - id: ch02-b18
          speaker: jimmy_skunk
          text: “谢谢你，彼得。”
        - id: ch02-b19
          speaker: peter_rabbit
          text: “他是我认识的家伙里脾气最好的一个。这对我们其余的人来说，实在很幸运。我发现胖家伙似乎多半脾气不错，而吉米几乎一直胖乎乎的。除了早春那一阵子，我从没见过他真正瘦下来的样子。他吃甲虫、蛴螬、蚱蜢、蟋蟀，还有各种各样的昆虫。听说只要找到鸟蛋，他也会偷来吃。”
        - id: ch02-b20
          speaker: danny_meadow_mouse
          text: “只要捉得到，他还会吃我们家的成员。吉米靠得太近，我就没法安心。”
        - id: ch02-b21
          speaker: narrator
          text: 吉米一点儿也没生气。
        - id: ch02-b22
          speaker: jimmy_skunk
          text: “我承认，鲜嫩的老鼠肉很合我的口味。偶尔来一只青蛙、一条蜥蜴或一条鱼，我也爱吃。”
        - id: ch02-b23
          speaker: chatterer
          text: “还少说了一样。只要抓得到，雏鸟你也吃得很香。”
        - id: ch02-b24
          speaker: jimmy_skunk
          text: “喋喋，你这可是乌鸦笑猪黑。”
        - id: ch02-b25
          speaker: narrator
          text: 喋喋冲他做了个鬼脸，却没有再争。大家都知道吉米说得对，喋喋自己也掏过许多鸟窝，吃过里面的雏鸟。
    - id: ch03
      title: 吉米怎样生活
      blocks:
        - id: ch03-b01
          speaker: mother_nature
          text: “彼得，你对吉米的了解就这些吗？”
        - id: ch03-b02
          speaker: peter_rabbit
          text: “差不多了。我还知道他住在地洞里，冬天很少出来。我想，他会像土拨鼠约翰尼那样睡过整个冬天。”
        - id: ch03-b03
          speaker: jimmy_skunk
          text: “这回你又猜错了，彼得。我冬天确实睡得很多，可雪落下来好一阵子以后，我才会躲起来过冬。我睡觉的样子也和土拨鼠约翰尼不同，不会整个冬天一直沉睡。有时候，我还会在冬天出门，在四周走走，找一点儿吃的。”
        - id: ch03-b04
          speaker: mother_nature
          text: “你住的地洞，是自己挖的吗？”
        - id: ch03-b05
          speaker: narrator
          text: 吉米摇了摇头。
        - id: ch03-b06
          speaker: jimmy_skunk
          text: “能不挖就不挖，挖洞太费力。非挖不可时，我当然也会动手，不过我更喜欢约翰尼留下的旧房子。他的房子住起来正合适。”
        - id: ch03-b07
          speaker: mother_nature
          text: “大家仔细看看吉米。他的个头和布朗农夫家的黑猫差不多，黑色外套上有宽宽的白条纹。不过，并非所有臭鼬身上的花纹都一样。我敢说，就连吉米的孩子里，也不会有两个长得完全相同。有一个或几个宝宝可能全身都是黑的，只在尾巴上带着一点儿白。”
        - id: ch03-b08
          speaker: mother_nature
          text: “再看他的前脚。那些又长又尖的爪子，可以挖出土里的蛴螬和昆虫，也能翻开木棍和石头，寻找躲在下面的甲虫。还要看看他把脚放到地上的姿势，和熊巴斯特很相像。那条又大又蓬松的尾巴，则是专门用来向别人发出警告的。吉米从不会一声不响就动用臭气枪。他的尾巴只要开始向空中竖起，聪明人就知道该当心了。”
        - id: ch03-b09
          speaker: mother_nature
          text: “许多人都弄错了，以为臭鼬吉米一家会造成很大的危害。其实，他们给人类带来的好处多得很。偶尔，他们的确会犯错，偷走小鸡或鸡蛋，可这种事只是偶尔发生。他们消灭了那么多害虫，足以补偿用这种方式拿走的一切。”
        - id: ch03-b10
          speaker: mother_nature
          text: “吉米和吉米太太每年都会养育一大家子孩子，通常有六到十个。宝宝刚出生时，吉米太太往往独自生活。等他们长大一些，已经能够走路了，父亲才重新回到家里。天气晴好的傍晚，你们常能看见全家一起出发，去寻找蚱蜢、甲虫和其他食物。他们常常整个冬天都住在一起，直到春天才分开。”
        - id: ch03-b11
          speaker: mother_nature
          text: “吉米还是我这些小居民中最爱整洁的一个，总把那件漂亮外套照料得很好。他不怕水，需要时也会游泳。他大多在夜里捕食，白天睡觉。人类赶走了许多野生小居民，吉米却是没有被赶走的少数几个之一。他常常把家安在人类的住处附近。”
    - id: ch04
      title: 臭鼬家族的表亲
      blocks:
        - id: ch04-b01
          speaker: mother_nature
          text: “这个广大国度的许多地方，都住着吉米那一支的表亲。在遥远的西南部，有一种叫作猪鼻臭鼬的动物。他是臭鼬家族里个头最大的成员之一。因为鼻子的形状很特别，又会像猪一样在地里拱来拱去，所以人们才这样称呼他。”
        - id: ch04-b02
          speaker: mother_nature
          text: “猪鼻臭鼬又叫獾臭鼬，因为他的前脚长着大爪子，而且是个了不起的挖洞好手。他的毛不像臭鼬吉米的毛那么细软，摸上去相当粗糙硬挺。他比吉米更爱吃昆虫，吃掉的虫子还要多。”
        - id: ch04-b03
          speaker: mother_nature
          text: “吉米这一支里，个头最小的表亲是小斑臭鼬。他只有吉米一半大，外套上没有吉米那样的白条纹，而是布满不规则的白线和白斑，看起来漂亮得很。他住在这个国家的南半部，生活习性和吉米很像，性子却活泼得多。有时候，他还会爬上不太高的树。”
        - id: ch04-b04
          speaker: mother_nature
          text: “小斑臭鼬和吉米一样，凡是能找到的食物，他几乎什么都吃。不用说，他也和吉米一样，随身带着一把小臭气枪。对了，吉米，你发怒的时候会怎样？现在就给我们演一演吧。”
        - id: ch04-b05
          speaker: narrator
          text: 吉米立刻发出一阵声音古怪的低吼，同时用两只前脚在地上不停地用力跺起来。老大自然妈妈看见他这副警告别人的模样，笑出了声。
        - id: ch04-b06
          speaker: mother_nature
          text: “如果你们看见吉米这样做，最好装作没看见，赶快躲得远远的。”
    - id: ch05
      title: 下一课去拜访獾
      blocks:
        - id: ch05-b01
          speaker: peter_rabbit
          text: “难道吉米一个敌人也没有吗？”
        - id: ch05-b02
          speaker: mother_nature
          text: “那要看有些家伙究竟饿到了什么地步。猫头鹰胡迪似乎一点儿也不在乎吉米的小臭气枪，我能想到的不怕它的也只有胡迪。某些大动物要是快饿死了，也许会捉吉米来吃。不过就算到了那种地步，我想他们动手以前也要再三考虑。你们谁知道獾挖挖住在哪里？”
        - id: ch05-b03
          speaker: peter_rabbit
          text: “我知道。他住在绿草原上，离老牧场不远。”
        - id: ch05-b04
          speaker: mother_nature
          text: “那好，彼得。你就跑到那边去拜访他一趟。等到明天早晨上课时，再把这次拜访的见闻讲给我们听。”
