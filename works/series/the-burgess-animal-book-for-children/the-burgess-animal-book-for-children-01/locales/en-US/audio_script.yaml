audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm, observant storytelling
        timbre: clear and gentle
        pace: measured
        pitch: medium
    reddy_fox:
      display_name: Reddy Fox
      tts:
        delivery: sly and threatening
        timbre: lean and sharp
        pace: deliberate
        pitch: medium-low
    peter_rabbit:
      display_name: Peter Rabbit
      tts:
        delivery: curious, quick, and expressive
        timbre: bright and youthful
        pace: lively
        pitch: medium-high
    jenny_wren:
      display_name: Jenny Wren
      tts:
        delivery: brisk, knowing, and spirited
        timbre: small and crisp
        pace: quick
        pitch: high
    old_mother_nature:
      display_name: Old Mother Nature
      tts:
        delivery: kindly, assured, and practical
        timbre: warm and full
        pace: unhurried
        pitch: medium-low
  chapters:
    - id: ch01
      title: Jenny Wren Gives Peter Rabbit an Idea
      blocks:
        - id: ch01-b01
          speaker: reddy_fox
          text: "You may be safe now, Peter Rabbit, but one day I'll catch you. You were lucky you weren't one jump farther from this hole."
          emotion: angry
        - id: ch01-b02
          speaker: narrator
          text: Reddy Fox poked his black nose into a hole between the roots of the Big Hickory-tree, which grew close to the Smiling Pool. Peter was safely inside that hole. He had nothing at all to say to Reddy. And if he did have something to say, he certainly didn't have enough breath left to say it.
        - id: ch01-b03
          speaker: narrator
          text: Reddy was right about that last jump. If Peter had been one jump farther away, Reddy would have caught him. As it was, the hairs of Peter's funny white tail had actually tickled Reddy's back as Peter threw himself through the root-bound opening. It was Peter's closest escape in a long, long time.
        - id: ch01-b04
          speaker: narrator
          text: Reddy had surprised Peter while he was nibbling sweet clover on the bank of the Smiling Pond. Peter was lucky that this old hole was right where he needed it. Johnny Chuck's grandfather had dug it long ago. Old Mr. Chuck had also been wise enough to place the entrance between those roots. However hard an enemy might try, the opening could not be dug any larger.
        - id: ch01-b05
          speaker: narrator
          text: Reddy was too clever to waste time trying to dig. He knew there wasn't room for him between those roots. But before he left, he did his best to make Peter uncomfortable. He described all the dreadful things he meant to do once he finally caught him. Then Reddy trotted off across the Green Meadows.
        - id: ch01-b06
          speaker: narrator
          text: Peter stayed exactly where he was for a long, long while. He waited until he felt quite certain that Reddy had gone and it was safe to move. Only then did he creep outside. He hurried, lipperty-lipperty-lip, all the way to the Old Orchard. Peter believed that was the safest place to go, because the old stone wall along its edge held ever so many hiding places.
        - id: ch01-b07
          speaker: narrator
          text: When Peter reached the orchard, there was Jenny Wren. She had returned from the Sunny South that very morning, after spending the winter there.
        - id: ch01-b08
          speaker: jenny_wren
          text: "Tut, tut, tut! Well, if it isn't Peter Rabbit himself! How did you stay out of Reddy Fox's paws all winter?"
        - id: ch01-b09
          speaker: narrator
          text: Peter chuckled. Reddy had not caused him much trouble during the winter, but this morning had been very different.
        - id: ch01-b10
          speaker: peter_rabbit
          text: "Reddy didn't trouble me much during the winter. But this morning he came so close to catching me, I'm surprised fright didn't turn every hair on me snow-white."
        - id: ch01-b11
          speaker: narrator
          text: Then Peter told Jenny exactly how Reddy had surprised him, how he had raced for the hole, and how narrowly he had escaped.
        - id: ch01-b12
          speaker: peter_rabbit
          text: "If Grandfather Chuck's hole hadn't been right there, I never could have gotten away."
        - id: ch01-b13
          speaker: narrator
          text: Jenny tipped her pert little head to one side, and her sharp eyes flashed.
        - id: ch01-b14
          speaker: jenny_wren
          text: "Then why don't you learn to swim like your cousin in the Sunny South? He would have jumped straight into the Smiling Pool and laughed at Reddy Fox."
        - id: ch01-b15
          speaker: narrator
          text: Peter sat bolt upright. His eyes opened very wide, and a strange look of surprise came over his face as he stared up at Jenny Wren.
        - id: ch01-b16
          speaker: peter_rabbit
          text: "What can you mean, Jenny Wren? Rabbits don't swim unless they have to cross the Laughing Brook and can't get around it, or unless an enemy drives them into the water and leaves them no other way out. I can swim a little when I must, but I stay on land whenever I can. Every other Rabbit does the same."
          emotion: surprised
        - id: ch01-b17
          speaker: jenny_wren
          text: "Tut, tut, Peter! You have spent so much time learning about your feathered neighbors, yet you hardly know your own family. I'd learn about my relatives first if I were you. Tell me, how many relatives do you have?"
        - id: ch01-b18
          speaker: peter_rabbit
          text: "One. My big cousin, Jumper the Hare."
        - id: ch01-b19
          speaker: narrator
          text: Jenny tossed back her head and laughed. She laughed and laughed and laughed. It was the most irritating, provoking laugh Peter could imagine. At last, he began to lose his patience.
        - id: ch01-b20
          speaker: peter_rabbit
          text: "Why are you laughing at me? You know Jumper the Hare is my only cousin."
          emotion: angry
        - id: ch01-b21
          speaker: narrator
          text: Jenny only laughed harder. At last she managed to catch her breath.
        - id: ch01-b22
          speaker: jenny_wren
          text: "Oh, Peter, you'll be the death of me! Down in the Sunny South, where I spent the winter, you have a cousin who's more closely related to you than Jumper is. And he enjoys the water almost as much as Jerry Muskrat does. They call him the Marsh Rabbit, or the Marsh Hare. I've watched him swim around for hours."
        - id: ch01-b23
          speaker: peter_rabbit
          text: "I don't believe one word of that! You're only trying to fool me, Jenny Wren. There never has been a Rabbit who swam for fun, and there never will be. I belong to the Cottontail branch of the Hare family, and it's a fine family, if I do say so myself. Jumper is a true Hare. The only differences are that he's bigger, his legs and ears are longer, his coat changes color in winter, and he hardly ever goes into a hole in the ground. Imagine telling me that I don't know my own relatives!"
          emotion: angry
        - id: ch01-b24
          speaker: narrator
          text: Jenny Wren stopped laughing and became quite serious.
        - id: ch01-b25
          speaker: jenny_wren
          text: "Peter, take my advice and go to school to Old Mother Nature for a while. Every word I've told you is true. You really do have a cousin in the Sunny South who spends half his time in the water. And I suspect that you and Jumper have other relatives you've never even heard of. Not knowing would be funny if it weren't so sad. That's what comes of never traveling. Go learn from Old Mother Nature, Peter. It will be worth your time."
        - id: ch01-b26
          speaker: narrator
          text: With that, Jenny flew off to find Mr. Wren so they could choose a place for their summer home.
        - id: ch01-b27
          speaker: narrator
          text: Peter tried his best to believe that Jenny had made up the whole story. No matter how hard he tried, though, he could not shake a tiny doubt. He tried to take an interest in what the other little people of the Old Orchard were doing. It was no use. That little doubt kept growing and growing.
        - id: ch01-b28
          speaker: narrator
          text: What if Jenny had told the truth? What if Peter didn't even know which relatives he had, or anything about them? Old Mother Nature would know. And Peter could trust whatever she told him.
        - id: ch01-b29
          speaker: narrator
          text: At last, that growing doubt joined forces with Peter's curiosity. That curiosity had already led poor Peter to do many queer things, and now it was too strong to resist. He set off for the Green Forest to look for Old Mother Nature.
        - id: ch01-b30
          speaker: narrator
          text: It did not take Peter long to find her. Old Mother Nature was very busy. Of all the seasons in the year, none gave her quite so much to do as spring did.
        - id: ch01-b31
          speaker: peter_rabbit
          text: "If you please, Old Mother Nature, I have some questions I'd like to ask."
        - id: ch01-b32
          speaker: narrator
          text: Old Mother Nature's eyes twinkled kindly.
        - id: ch01-b33
          speaker: old_mother_nature
          text: "All right, Peter. I can work and talk at the same time. What would you like to know?"
        - id: ch01-b34
          speaker: peter_rabbit
          text: "Are there really any other Rabbits and Hares besides my big cousin Jumper, who lives here in the Green Forest, and me?"
        - id: ch01-b35
          speaker: narrator
          text: Old Mother Nature's eyes twinkled even more.
        - id: ch01-b36
          speaker: old_mother_nature
          text: "Of course there are, Peter. There are several others, and you really should know that. I suppose you don't because you've never traveled. Some people know surprisingly little about the very things they should know best."
        - id: ch01-b37
          speaker: narrator
          text: Peter looked very humble. He felt a little foolish, too. When he tried to ask his next question, the words came out in a stammer.
        - id: ch01-b38
          speaker: peter_rabbit
          text: "Is it really true that I have a cousin far down in the Sunny South who loves being in the water?"
        - id: ch01-b39
          speaker: old_mother_nature
          text: "Yes, Peter, it is. He's called the Marsh Rabbit. Of all your cousins, he's closest to your size and looks the most like you."
        - id: ch01-b40
          speaker: narrator
          text: Peter gulped as though he had swallowed something difficult.
        - id: ch01-b41
          speaker: peter_rabbit
          text: "That's exactly what Jenny Wren told me, but I wouldn't believe her. She said she had often watched him swimming around just like Jerry Muskrat."
        - id: ch01-b42
          speaker: narrator
          text: Old Mother Nature nodded.
        - id: ch01-b43
          speaker: old_mother_nature
          text: "She told you the truth. Your Marsh Rabbit cousin is just as comfortable in the water as he is on land, and perhaps even more so. He's the member of the family who takes to the water, and he truly loves it. Is there anything else you want to ask?"
        - id: ch01-b44
          speaker: narrator
          text: Peter shifted about uneasily. There was something more he wanted, but he hesitated to ask for it.
        - id: ch01-b45
          speaker: old_mother_nature
          text: "What is it, Peter? Nothing in the Great World is equal to knowledge. If I can help you know more, I'll be glad to do it."
        - id: ch01-b46
          speaker: narrator
          text: Old Mother Nature's kindness gave Peter the courage he needed.
        - id: ch01-b47
          speaker: peter_rabbit
          text: "If you please, Mother Nature, I'd like to learn all about my family. May I come to school with you every day?"
        - id: ch01-b48
          speaker: narrator
          text: Old Mother Nature laughed aloud.
        - id: ch01-b49
          speaker: old_mother_nature
          text: "Of course you may, Mr. Curiosity. That's a very good idea. I'm busy, as you can see, but I'm never too busy to teach someone who truly wants to learn. We'll meet here every morning at sun-up for a lesson. It's late now, so I can't spare any more time today. Run home to the dear Old Briar-patch and think of some questions for tomorrow. And remember, Peter, I'll have questions for you, too. I'll ask you to tell me everything you know about your own family. Now scamper home, and be back tomorrow at sun-up."
        - id: ch01-b50
          speaker: peter_rabbit
          text: "May I bring my cousin Jumper the Hare if he'd like to come?"
        - id: ch01-b51
          speaker: old_mother_nature
          text: "Bring Jumper, and anyone else who wants to learn."
        - id: ch01-b52
          speaker: narrator
          text: Peter prepared to obey. He gave Old Mother Nature his politest good-bye. Then he scampered away as fast as he could go, lipperty-lipperty-lip, all the way home to the dear Old Briar-patch.
        - id: ch01-b53
          speaker: narrator
          text: He spent the rest of the day thinking of questions and trying to discover how much he really knew about his own family.
