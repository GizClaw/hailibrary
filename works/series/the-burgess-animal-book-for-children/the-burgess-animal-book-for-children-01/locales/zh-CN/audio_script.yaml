audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 亲切生动，带着温和的幽默感
        timbre: 温暖清亮
        pace: 舒缓而富有变化
        pitch: 中等
    peter_rabbit:
      display_name: 彼得兔
      tts:
        delivery: 好奇直率，情绪来得快也去得快
        timbre: 清脆稚气
        pace: 轻快
        pitch: 中高
    reddy_fox:
      display_name: 雷迪狐狸
      tts:
        delivery: 狡猾强硬，话里带着威吓
        timbre: 略粗而尖
        pace: 稍慢
        pitch: 中低
    jenny_wren:
      display_name: 珍妮鹪鹩
      tts:
        delivery: 机灵爽利，责备时尖锐却不失热心
        timbre: 清亮纤细
        pace: 明快
        pitch: 高
    mother_nature:
      display_name: 老大自然妈妈
      tts:
        delivery: 慈爱睿智，说话从容而坦率
        timbre: 温厚柔和
        pace: 从容
        pitch: 中低
  chapters:
    - id: ch01
      title: 第一章　珍妮鹪鹩给彼得兔出了个主意
      blocks:
        - id: ch01-b01
          speaker: reddy_fox
          text: “彼得兔，只要你还活着，我迟早会逮住你！算你运气好。刚才你要是离这个洞再远一步，这会儿早就落到我手里了。”
          emotion: angry
        - id: ch01-b02
          speaker: narrator
          text: 雷迪狐狸一边咆哮，一边把黑鼻子探进大山核桃树根间的洞口。那棵树就长在微笑池塘旁边。彼得躲在洞里，总算安全了。他一句话也没说。就算想说，也早已累得上气不接下气，根本开不了口。雷迪说得没错。刚才彼得只要离洞口再远一步，就准会被捉住。他慌忙钻过盘根错节的洞口时，那条滑稽的白尾巴险得从雷迪背上扫过，毛尖还挠得雷迪痒痒的。这是他很久以来最惊险的一次逃生。
        - id: ch01-b03
          speaker: narrator
          text: 原来，彼得正在微笑池塘岸上吃香甜的苜蓿，冷不防被雷迪撞见。幸亏约翰尼土拨鼠的爷爷多年前挖的洞恰好就在近旁。对彼得来说，那个洞的位置真是再好不过。更幸运的是，老土拨鼠先生把洞口开在树根之间，任谁也没法再把它挖大。
        - id: ch01-b04
          speaker: narrator
          text: 雷迪很精明，知道自己挤不过那些树根，才不肯白费工夫。他只管吓唬彼得，说等逮住彼得以后要怎样收拾他。直到把彼得弄得浑身不自在，他才小跑着穿过绿草原走了。彼得又等了很久，确信外面安全，才悄悄爬出来，蹦哒蹦哒地赶往老果园。他觉得那里最安全，因为果园边的老石墙里到处都能藏身。
        - id: ch01-b05
          speaker: narrator
          text: 彼得到了老果园，正好碰见珍妮鹪鹩。珍妮在温暖的南方过完冬，那天早晨才刚回来。她一见彼得就叫了起来。
        - id: ch01-b06
          speaker: jenny_wren
          text: “啧啧啧啧啧！这不是彼得兔吗！这么长一个冬天，你究竟是怎么逃过雷迪狐狸的爪子的？”
          emotion: surprised
        - id: ch01-b07
          speaker: narrator
          text: 彼得咯咯一笑。
        - id: ch01-b08
          speaker: peter_rabbit
          text: “冬天里，雷迪没怎么找我的麻烦。可就在今天早晨，他差一点儿逮住我。真怪，我居然没吓得一身毛全变成雪白！”
        - id: ch01-b09
          speaker: narrator
          text: 接着，彼得把刚才死里逃生的经过全告诉了珍妮。
        - id: ch01-b10
          speaker: peter_rabbit
          text: “要不是土拨鼠爷爷的洞恰好在旁边，我怎么也逃不掉。”
        - id: ch01-b11
          speaker: narrator
          text: 珍妮把俏生生的小脑袋偏向一边，两只锐利的小眼睛闪闪发亮。
        - id: ch01-b12
          speaker: jenny_wren
          text: “彼得，你怎么不学游泳呢？你住在温暖南方的那位表亲就会呀。换作是他，只要一头扎进微笑池塘，再回头笑话雷迪狐狸就行了。”
        - id: ch01-b13
          speaker: narrator
          text: 彼得猛地坐直，眼睛瞪得溜圆。他满脸惊奇地仰头盯着珍妮。
        - id: ch01-b14
          speaker: peter_rabbit
          text: “珍妮鹪鹩，你在说什么呀？难道你不知道，我们兔子一家从来不游泳吗？除非非过欢笑溪不可，又没有别的路能到对岸。或者被敌人逼进水里，实在无路可逃。我不得不游的时候也能游一点儿，可只要能留在陆地上，谁也别想让我下水。我们家的其他成员也绝不会做这种事。”
          emotion: surprised
        - id: ch01-b15
          speaker: jenny_wren
          text: “啧啧啧啧，彼得！你总爱打听长羽毛的邻居们怎么生活，对自己家里的事却知道得少得可怜。要是我呀，准会先弄清自家的亲戚，再去好奇邻居。彼得，你到底有多少亲戚？”
        - id: ch01-b16
          speaker: peter_rabbit
          text: “一个。就是我的大表哥，长耳野兔跳跳。”
        - id: ch01-b17
          speaker: narrator
          text: 珍妮仰起脑袋，笑呀，笑呀，怎么也笑不够。那笑声实在叫人又气恼又难堪。彼得终于失去了耐心。
        - id: ch01-b18
          speaker: peter_rabbit
          text: “你笑什么？你明明知道，长耳野兔跳跳是我唯一的表亲。”
          emotion: angry
        - id: ch01-b19
          speaker: narrator
          text: 珍妮笑得更厉害了，笑得连气都快喘不上来。
        - id: ch01-b20
          speaker: jenny_wren
          text: “彼得呀，你真要把我笑死了！我过冬的温暖南方也住着你的一位表亲。他跟你的亲缘比跳跳还近，而且差不多和麝鼠杰里一样爱水。大家叫他沼泽兔，也叫沼泽野兔。我见过他好多回，他一下水就游上好几个钟头。”
          emotion: happy
        - id: ch01-b21
          speaker: peter_rabbit
          text: “我不信！一个字也不信。珍妮，你就是想捉弄我。从来没有兔子为了好玩去游泳，以后也不会有。我属于野兔家族里的棉尾兔一支，这可是个了不起的家族。表哥跳跳是真正的野兔。我们只是有些地方不一样。他个头更大，腿和耳朵更长，冬天会换毛色，而且很少钻进地下的洞里，也许根本就不钻。你居然说我连自家的亲戚都不认识！”
          emotion: angry
        - id: ch01-b22
          speaker: narrator
          text: 珍妮忽然不笑了，神情变得十分严肃。
        - id: ch01-b23
          speaker: jenny_wren
          text: “彼得，听我一句劝，去老大自然妈妈那里上些日子的学吧。我告诉你的话句句都是真的。温暖的南方确实有你的一位表亲，他一半的时间都在水里。我猜，你和跳跳还有些从没听说过的亲戚呢。你这样什么都不知道，本来很好笑，却更叫人可怜。这就是从不出远门的结果。去找老大自然妈妈学习吧，你一定会有收获。”
        - id: ch01-b24
          speaker: narrator
          text: 说完，珍妮飞去找鹪鹩先生，好商量今年夏天把家安在哪里。彼得很想相信她说的只是个故事，可不管怎样努力，心里那一点疑虑怎么也赶不走。他试着去留意老果园里其他小居民在做什么，也全然没用。那点疑虑反倒越长越大。珍妮说的会不会是真的？难道他真的不知道自己有哪些亲戚，也不知道他们是什么样？老大自然妈妈当然能告诉他想知道的一切。而且不论她说什么，一定都是真的。
        - id: ch01-b25
          speaker: narrator
          text: 那疑虑越长越大，再加上彼得天生的好奇心，终于叫他坐不住了。正是这份好奇心，已经让可怜的彼得做过不少古怪事。他动身去绿森林寻找老大自然妈妈，很快就找到了她。她忙得不可开交，因为一年之中，春天正是她事情最多的时候。
        - id: ch01-b26
          speaker: peter_rabbit
          text: “老大自然妈妈，我想请教您几个问题，可以吗？”
        - id: ch01-b27
          speaker: narrator
          text: 彼得有点儿胆怯，可态度十分有礼貌。老大自然妈妈的眼里闪着慈爱的笑意。
        - id: ch01-b28
          speaker: mother_nature
          text: “可以呀，彼得。我手里的活不用停，也能跟你聊。说吧，你想问什么？”
        - id: ch01-b29
          speaker: peter_rabbit
          text: “兔子和野兔家族里，除了住在绿森林的大表哥跳跳和我，还有别的成员吗？”
        - id: ch01-b30
          speaker: narrator
          text: 老大自然妈妈眼里的笑意更浓了。
        - id: ch01-b31
          speaker: mother_nature
          text: “当然有呀，彼得，还有好几位呢。你本来应该知道这件事。不过你从来没出过远门，难怪会不知道。有些人对自己最该明白的事情，偏偏知道得那么少，真叫人吃惊。”
        - id: ch01-b32
          speaker: narrator
          text: 彼得显得很惭愧，仿佛也觉得自己有点儿傻。他结结巴巴地问了起来。
        - id: ch01-b33
          speaker: peter_rabbit
          text: “那……那么……在很远很远的温暖南方，我真的有一位喜欢整天泡在水里的表亲吗？”
        - id: ch01-b34
          speaker: mother_nature
          text: “是真的，彼得。大家都叫他沼泽兔。在你的表亲当中，他的个头跟你最接近，长得也最像你。”
        - id: ch01-b35
          speaker: narrator
          text: 彼得咽了一下，好像有什么难以下咽的东西卡在喉咙里。
        - id: ch01-b36
          speaker: peter_rabbit
          text: “珍妮鹪鹩也这么告诉我，可当时我不信。她说，她常看见他像麝鼠杰里那样在水里游。”
        - id: ch01-b37
          speaker: narrator
          text: 老大自然妈妈点了点头。
        - id: ch01-b38
          speaker: mother_nature
          text: “她说得对，一点也没说错。他待在水里跟待在陆地上一样自在，没准儿还更自在呢。你们家族里就数他爱下水，而且他是真的喜欢水。彼得，你还想问什么吗？”
        - id: ch01-b39
          speaker: narrator
          text: 彼得不安地挪了挪身子，迟迟没有开口。
        - id: ch01-b40
          speaker: mother_nature
          text: “怎么不说话了，彼得？在这广阔的世界上，知识比什么都宝贵。只要能让你多学到一些，我很乐意帮忙。”
        - id: ch01-b41
          speaker: narrator
          text: 彼得鼓起勇气。
        - id: ch01-b42
          speaker: peter_rabbit
          text: “老……老大自然妈妈，我想把自己整个家族的事都弄明白。您能不能让我每天都来上课？”
        - id: ch01-b43
          speaker: narrator
          text: 老大自然妈妈放声笑了。
        - id: ch01-b44
          speaker: mother_nature
          text: “当然可以来我这里上学，好奇先生。这是个好主意，非常好的主意。你也看见了，我很忙，可不论多忙，我总有时间教那些真心想学习的人。以后每天早晨太阳一升起来，我们就在这里上课。今天已经很晚，我不能再让别的事打扰我啦。快回你亲爱的老荆棘丛去，想想明天早晨要问我什么。对了，我也会问你几个问题。第一个问题，就是请你把自己知道的家族情况全讲给我听。好啦，快跑吧，明天日出时准时来。”
        - id: ch01-b45
          speaker: peter_rabbit
          text: “我的表哥长耳野兔跳跳要是也想学，我能带他一起来吗？”
        - id: ch01-b46
          speaker: mother_nature
          text: “当然可以。跳跳可以来，别的人只要想学，也都带来吧。”
        - id: ch01-b47
          speaker: narrator
          text: 彼得用最有礼貌的方式向她道别，接着便蹦哒蹦哒，用最快的速度跑回亲爱的老荆棘丛。那天余下的时间里，他一直在琢磨要问些什么，也努力想弄明白，自己对家里的亲戚到底知道多少。
