  chapters:
    - id: ch01
      title: Jerry Muskrat, a True Rat
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Old Mother Nature called the class to order at the old meeting place. This time, she was ready to begin with the largest family in the Rodent order.
        - id: ch01-b02
          speaker: old_mother_nature
          text: "That family is the Rat family, and of course it includes the Mice. Its largest member should remind you of the animal we learned about yesterday."
        - id: ch01-b03
          speaker: peter_rabbit
          text: "I know! You mean Jerry Muskrat."
        - id: ch01-b04
          speaker: narrator
          text: Old Mother Nature smiled at Peter's quick answer.
        - id: ch01-b05
          speaker: old_mother_nature
          text: "Exactly, Peter. You may go to the head of the class. Jerry is the largest member of the Rat family. People sometimes call him a little cousin of Paddy the Beaver. I suppose that is because he looks like a small Beaver, builds a house in the water as Paddy does, and lives in much the same way. But Jerry is no more closely related to Paddy than he is to any of you. He is a true Rat."
        - id: ch01-b06
          speaker: old_mother_nature
          text: "The name Muskrat comes from a scent called musk, which Jerry carries with him. It isn't an unpleasant scent like Jimmy Skunk's, and Jerry doesn't use it for the same reason. He leaves a little at each place he visits, so his friends can tell where he has been. Some people call him Musquash, but Muskrat is a better name."
        - id: ch01-b07
          speaker: old_mother_nature
          text: "You will hardly ever find Jerry far from water unless he is searching for a new home. On land he is slow and awkward. In water he is right at home, as anyone who visits the Smiling Pool knows. He can dive and swim a long way underwater, though not as far as Paddy."
        - id: ch01-b08
          speaker: jumper_the_hare
          text: "Are his hind feet webbed like Paddy's?"
        - id: ch01-b09
          speaker: old_mother_nature
          text: "Partly. Jerry's feet aren't fully webbed, but a little webbing between some of his toes helps him swim. His tail helps even more than Paddy's does. It is bare and scaly. Instead of being flattened from top to bottom, it is flattened from side to side. Jerry moves it rapidly back and forth to drive himself through the water."
    - id: ch02
      title: The Worker of the Smiling Pool
      blocks:
        - id: ch02-b01
          speaker: old_mother_nature
          text: "Like Paddy, Jerry wears a dark brown outer coat that is lighter underneath. He also has a warm, soft undercoat that water cannot pass through. It keeps him comfortable even in very cold water. You have all seen his house in the Smiling Pool. He builds it much as Paddy builds his, but Jerry cuts rushes instead of using sticks. His house is much smaller because he is smaller. Inside is a comfortable bedroom, with one or more passages leading down to deep water."
        - id: ch02-b02
          speaker: old_mother_nature
          text: "Jerry spends much of the winter in that house and comes out mainly to find food. He digs up lily roots and the roots of other water plants, then carries them home to eat. When the ice is clear, you may see him swimming underneath it."
        - id: ch02-b03
          speaker: peter_rabbit
          text: "I have seen him! Once, while I was crossing the ice on the Smiling Pool, Jerry swam right below me."
        - id: ch02-b04
          speaker: old_mother_nature
          text: "Jerry never builds dams, but where the water is too shallow, he sometimes digs little canals along the bottom. In winter, he and Mrs. Jerry may share their house with two or three friends. If there is a good bank nearby, Jerry will usually make another home inside it. He puts the entrance underwater, then tunnels back and upward until he reaches dry ground just below the surface. That is where he makes a snug little bedroom."
        - id: ch02-b05
          speaker: old_mother_nature
          text: "More than one tunnel usually leads to the room. Sometimes there is an opening from above as well. Jerry hides it under sticks and grass, and it lets fresh air into his home."
        - id: ch02-b06
          speaker: old_mother_nature
          text: "Jerry eats mostly roots and plants. He also enjoys mussels, freshwater clams, fish, and some insects. And I am sorry to say that he will eat young birds if he can catch them. Jerry could tell us where some of Mr. and Mrs. Quack's ducklings have gone. Paddy the Beaver never eats flesh at all."
        - id: ch02-b07
          speaker: old_mother_nature
          text: "Jerry and Mrs. Jerry raise several families each year. Jerry is a good father and does his share of caring for the babies. The two of them are sociable and like visiting other Muskrats. Their voices sound like squeaks. In the early evening, their favorite time of day, you can often hear them talking among the rushes. They will come out by day too, when no one disturbs them."
        - id: ch02-b08
          speaker: old_mother_nature
          text: "Man is their greatest enemy because he hunts and traps them for their warm coats. At night, they must watch for Hooty the Owl. On land, they must watch for Reddy Fox and Old Man Coyote. Billy Mink is also an enemy, and perhaps the one Jerry should fear most, because Billy can follow him anywhere."
        - id: ch02-b09
          speaker: old_mother_nature
          text: "Along the shore, Jerry makes little landings from mud and rushes. He loves to sit on them while he eats. Apples and vegetables are favorites, and he will sometimes travel quite far to get them. Late in summer, if he needs a new house, he begins building it for winter. Jerry is a fine worker. There isn't a lazy bone in him. When you consider everything, he is a credit to the Rat family."
    - id: ch03
      title: Robber the Brown Rat
      blocks:
        - id: ch03-b01
          speaker: old_mother_nature
          text: "But one member of the Rat family is no credit to it at all. Who can name him?"
        - id: ch03-b02
          speaker: happy_jack
          text: "Robber the Brown Rat. I have seen him many times around Farmer Brown's barn. Ugh! He certainly looks ugly."
          emotion: disgusted
        - id: ch03-b03
          speaker: old_mother_nature
          text: "And he is every bit as ugly as he looks. I cannot say one good thing about him. He didn't belong in this country to begin with. Man brought him here, and now he is everywhere. You may hear him called the Norway Rat, the Wharf Rat, or the House Rat. Animals and people all hate him. He is the next largest Rat after Jerry Muskrat. He has a savage temper, causes more destruction than any animal I know, and has filthy habits. He is an outcast, and he doesn't seem to mind."
        - id: ch03-b04
          speaker: old_mother_nature
          text: "Robber lives mostly near people's homes, and he steals all his food. That is how he earned his name. He will eat anything he can find, clean or dirty. He gnaws his way into grain bins and takes the grain. He breaks into henhouses, sucks the eggs, and kills young chickens. Peter, he would be delighted to find a nest full of your babies."
        - id: ch03-b05
          speaker: narrator
          text: Peter shivered.
        - id: ch03-b06
          speaker: peter_rabbit
          text: "Then I am glad he stays close to people's homes."
        - id: ch03-b07
          speaker: old_mother_nature
          text: "He doesn't always stay there. In summer he often moves into the fields and digs burrows. He ruins crops and kills any furry or feathered folk he can catch for food. But he dislikes daylight. His wicked work is done in darkness, and dark places suit him best."
        - id: ch03-b08
          speaker: old_mother_nature
          text: "Robber raises very large families, sometimes ten or more babies at once, and there may be several families in a single year. That is how Brown Rats have spread across the Great World and how they cause so much damage. Yet the damage from their teeth isn't the worst of it. They carry terrible diseases to people and spread them. Those diseases can kill great numbers of people."
    - id: ch04
      title: An Enemy and No Friends
      blocks:
        - id: ch04-b01
          speaker: peter_rabbit
          text: "Isn't there anyone Robber is afraid of?"
        - id: ch04-b02
          speaker: old_mother_nature
          text: "There certainly is. Robber is terribly afraid of someone all of you fear too: Shadow the Weasel. I can say this much for Shadow. He never lets a chance to kill a Rat pass by. Shadow can go anywhere a Rat can go. Once he finds a colony, he keeps hunting until he has killed the Rats or driven them all away."
        - id: ch04-b03
          speaker: old_mother_nature
          text: "When food grows scarce, Robber and his family leave in search of a place where there is more. Large numbers of them often make long journeys together. If a stream lies across their path, they swim over it without hesitation."
        - id: ch04-b04
          speaker: peter_rabbit
          text: "I have never seen Robber. What sort of tail does he have?"
        - id: ch04-b05
          speaker: narrator
          text: Old Mother Nature laughed at Peter's familiar question about tails.
        - id: ch04-b06
          speaker: old_mother_nature
          text: "I should have known you would ask about his tail. It is long, slender, and hairless. His brown-and-gray fur is very coarse and harsh. Robber has a close relative called the Black Rat. The Black Rat is smaller, and his bigger cousin has driven most of his kind out of the country. That is enough about Robber. He is bad through and through, without one friend in all the Great World."
        - id: ch04-b07
          speaker: happy_jack
          text: "How dreadful it must be to have no friends at all."
          emotion: sad
        - id: ch04-b08
          speaker: old_mother_nature
          text: "It is dreadful, very dreadful. But Robber has only himself to blame. That is what comes from becoming dishonest and bad at heart. Worst of all, he doesn't care. Tomorrow I will tell you about some of his cousins who aren't bad."
