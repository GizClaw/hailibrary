audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 亲切生动，带着温和的幽默感
        timbre: 温暖清亮
        pace: 舒缓而富有变化
        pitch: 中等
    peter_rabbit:
      display_name: 彼得兔
      tts:
        delivery: 好奇直率，情绪来得快也去得快
        timbre: 清脆稚气
        pace: 轻快
        pitch: 中高
    mother_nature:
      display_name: 老大自然妈妈
      tts:
        delivery: 慈爱睿智，说话从容而坦率
        timbre: 温厚柔和
        pace: 从容
        pitch: 中低
    happy_jack:
      display_name: 灰松鼠快乐杰克
      tts:
        delivery: 自信好胜，受窘时有些急躁
        timbre: 明亮爽脆
        pace: 轻快
        pitch: 中高
    jumper_hare:
      display_name: 长耳野兔跳跳
      tts:
        delivery: 朴实腼腆，认真时透着好奇
        timbre: 清朗柔和
        pace: 稍缓
        pitch: 中等
  chapters:
    - id: ch01
      title: 第十三章　勤劳者与强盗
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 大家又在老地方坐好以后，老大自然妈妈宣布上课。这一天，他们要认识啮齿目里最大的家族，也就是包括各种小鼠在内的鼠科。老大自然妈妈说，这个家族中个头最大的成员，很像昨天才认识的那一位。
        - id: ch01-b02
          speaker: peter_rabbit
          text: “我知道！你说的是麝鼠杰里。”
          emotion: happy
        - id: ch01-b03
          speaker: mother_nature
          text: “答得好，彼得，你该坐到全班最前面去。正是杰里，他是鼠科里个头最大的成员。有人把他叫作海狸帕迪的小表亲，大概因为他像一只小海狸，也像帕迪那样在水里盖房子，过着相似的生活。其实，他和帕迪的亲缘并不比和你们更近，他是真正的鼠类。”
        - id: ch01-b04
          speaker: mother_nature
          text: “大家叫他麝鼠，是因为他带着一种名叫麝香的气味。这气味不像臭鼬吉米的那么难闻，用处也不同。杰里每到一处，都会留下少许气味，好让朋友知道他去过哪里。也有人叫他麝香鼠，不过，还是麝鼠这个名字更合适。”
        - id: ch01-b05
          speaker: mother_nature
          text: “杰里只有寻找新家时才会远离水边。他在陆地上又慢又笨，可一进水里就自在了。去过微笑池塘的伙伴都知道，他能潜到水下，游出很远，只是比不上海狸帕迪。”
        - id: ch01-b06
          speaker: jumper_hare
          text: “他的后脚也像帕迪那样有蹼吗？”
        - id: ch01-b07
          speaker: mother_nature
          text: “算有，也不算全有。他的脚趾没有像帕迪那样全连起来，只有几根脚趾之间带着一点蹼，可游泳时已经很管用了。他的尾巴没有毛，长着鳞片，两侧扁平。杰里让尾巴飞快地左右摆动，像螺旋桨一样推着自己前进。这条尾巴游起泳来，比帕迪的尾巴还管用。”
        - id: ch01-b08
          speaker: mother_nature
          text: “杰里和帕迪一样，外层的毛是深棕色，腹部比背部和身体两侧浅一些，贴身还有一层又暖又软的绒毛。水透不过这层绒毛，所以水再冷，他也能舒舒服服的。你们都见过他在微笑池塘里的家。他盖房的方法和帕迪差不多，只是不用树枝，而是把灯心草割下来当材料。杰里个头小，房子自然也小得多。”
        - id: ch01-b09
          speaker: mother_nature
          text: “他的房里有一间舒适的卧室，还有一条或几条过道，一直通到深水里。冬天，他大多待在家中，只在寻找食物时才出去。那时，他主要吃睡莲和其他水生植物的根。他把这些根从泥里挖出来，带回房里再吃。冰面清澈时，你们偶尔能看见他从冰下游过。”
        - id: ch01-b10
          speaker: peter_rabbit
          text: “这个我见过。有一次我从微笑池塘的冰面上走过去，杰里就在我脚底下游呢。”
        - id: ch01-b11
          speaker: mother_nature
          text: “杰里不筑水坝。不过，水太浅、不合心意时，他偶尔会沿着水底挖出小运河。冬天，他和杰里太太有时还会请两三个朋友一起住。要是岸边有合适的土坡，他通常会在那里再安一个家。”
        - id: ch01-b12
          speaker: mother_nature
          text: “这个家的入口藏在水下。杰里从入口往里挖出一段路，再斜着向上挖，最后在紧靠地面的干燥处造一间舒适的小卧室。通往卧室的地道通常不止一条，有时上方也有一个洞口。他用树枝和青草遮住洞口，既把它藏好，又能让新鲜空气进来。”
        - id: ch01-b13
          speaker: mother_nature
          text: “杰里主要吃植物和根，也爱吃贻贝、淡水蛤、鱼和某些昆虫。可惜，只要捉得到，他连雏鸟也吃。鸭子呱呱先生和呱呱太太有些宝宝不见了，杰里或许知道是怎么回事。海狸帕迪却一点荤腥也不吃。”
        - id: ch01-b14
          speaker: mother_nature
          text: “杰里和杰里太太一年会养好几窝宝宝。杰里是个称职的父亲，会尽自己的一份力，和太太一起照料孩子。夫妻俩都喜欢与同类来往，也爱去拜访邻居。他们说起话来像在吱吱轻叫。傍晚刚来时，你们常能听到他们在灯心草丛里交谈。他们最喜欢这段时间，不过没人打扰时，白天也会出来。”
        - id: ch01-b15
          speaker: mother_nature
          text: “人为了他们温暖的毛皮追捕他们，还设下陷阱，是他们最大的敌人。夜里，他们要躲着猫头鹰胡迪；只要一到岸上，还得提防狐狸雷迪和老郊狼。有时水貂比利也会与他们为敌。比利或许最叫他们害怕，因为杰里无论逃到哪里，他都追得过去。”
        - id: ch01-b16
          speaker: mother_nature
          text: “杰里沿着岸边用泥巴和灯心草搭起一座座小平台，喜欢坐在那里吃饭。他爱吃苹果和蔬菜，有时为了一口好吃的，要走出相当远。夏末时，如果准备另造一座新房，他便开始动工，为冬天作准备。他真是个勤劳的好工人，全身找不出一根懒骨头。方方面面看来，杰里都为自己的家族争了光。”
        - id: ch01-b17
          speaker: mother_nature
          text: “可这个家族里，还有一个专门给大家丢脸的成员。他是谁，有人知道吗？”
        - id: ch01-b18
          speaker: happy_jack
          text: “是大老鼠强盗。我常在农夫布朗的谷仓旁边看见他。呃，那家伙长得可真难看！”
          emotion: disgusted
        - id: ch01-b19
          speaker: mother_nature
          text: “他的心眼和模样一样难看，我连他的一点好处也说不出来。他原本根本不属于这个国家，是人把他带来的，如今却到处都有他的踪影。他又叫挪威鼠、码头鼠或家鼠。所有动物都恨他，人也恨他。他的块头在鼠科里仅次于麝鼠杰里，脾气凶恶，破坏力比我所知道的任何动物都强，生活习惯还肮脏不堪。他是个被大家赶走的流浪汉，自己却好像毫不在乎。”
        - id: ch01-b20
          speaker: mother_nature
          text: “他主要住在人类的房屋附近，吃的东西全都靠偷，所以才叫强盗。他找到什么就吃什么，既不挑是什么，也根本不管干不干净。他会啃穿装粮食的仓房，偷吃里面的谷物；还会钻进鸡舍，吸食鸡蛋，咬死小鸡。彼得，要是发现一窝你的宝宝，他准会高兴极了。”
        - id: ch01-b21
          speaker: narrator
          text: 彼得听得打了个寒战。
        - id: ch01-b22
          speaker: peter_rabbit
          text: “幸好他只待在人住的地方。”
        - id: ch01-b23
          speaker: mother_nature
          text: “他可不只待在那里。夏天，他常搬到田野里，在地下挖洞，糟蹋许多庄稼。凡是能捉到的有毛或有羽毛的小居民，他也会杀死吃掉。他不喜欢白昼的光亮，尽干见不得光的坏事，也总挑阴暗的地方待着。”
        - id: ch01-b24
          speaker: mother_nature
          text: “他每一窝都有许多宝宝，有时一次就生十个甚至更多，一年还要生上好几窝。正因为这样，他们才能遍布大千世界，也才会造成那么大的破坏。可比牙齿造成的损失更可怕的是，他们会携带骇人的疾病，再把疾病四处传播给人类，害得许多人因此丧命。”
        - id: ch01-b25
          speaker: peter_rabbit
          text: “难道强盗谁也不怕吗？”
        - id: ch01-b26
          speaker: mother_nature
          text: “当然有。他最怕影子鼬，而你们也个个怕影子。影子有一点值得称赞，只要碰上大老鼠，他就绝不会放过。大老鼠钻得到的地方，他也钻得到。只要找到一群，他就会一直捕猎，直到把他们全杀死或赶走。”
        - id: ch01-b27
          speaker: mother_nature
          text: “食物不够时，强盗会带着全家搬到食物更充足的地方。他们常常许多只一起出发，成群结队，走上很远的路。途中就算横着一条溪流，他们也毫不犹豫，照样游过去。”
        - id: ch01-b28
          speaker: peter_rabbit
          text: “我从没见过强盗。他的尾巴是什么样的？”
        - id: ch01-b29
          speaker: mother_nature
          text: “我早该想到你会问尾巴。他的尾巴又细又长，一根毛也没有。他的毛棕灰相间，又粗又硬。他还有一位近亲叫黑鼠，个头比他小，如今几乎已经被这个大表亲赶出了这个国家。”
        - id: ch01-b30
          speaker: mother_nature
          text: “强盗的事就讲到这里吧。他从头坏到脚，在整个大千世界里，连一个朋友也没有。”
        - id: ch01-b31
          speaker: happy_jack
          text: “一个朋友也没有，那可真是太可怕了。”
          emotion: sad
        - id: ch01-b32
          speaker: mother_nature
          text: “是很可怕，非常可怕。不过，这完全是他自己的过错。一个人若变得不诚实，心也坏了，从强盗身上就能看出会有什么下场。最糟的是，他一点也不在乎。明天，我再给你们讲他的几位表亲，他们可不坏。”
