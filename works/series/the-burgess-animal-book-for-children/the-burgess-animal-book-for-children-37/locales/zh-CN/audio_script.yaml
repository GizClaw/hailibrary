audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 亲切生动，带着温和的幽默感
        timbre: 温暖清亮
        pace: 舒缓而富有变化
        pitch: 中等
    mother_nature:
      display_name: 老大自然妈妈
      tts:
        delivery: 慈爱睿智，说话从容而坦率
        timbre: 温厚柔和
        pace: 从容
        pitch: 中低
    peter_rabbit:
      display_name: 彼得兔
      tts:
        delivery: 好奇直率，情绪来得快也去得快
        timbre: 清脆稚气
        pace: 轻快
        pitch: 中高
    chatterer:
      display_name: 红松鼠喋喋
      tts:
        delivery: 伶牙俐齿，争强好胜又活泼
        timbre: 尖细清亮
        pace: 明快
        pitch: 高
    jumper:
      display_name: 大野兔跳跳
      tts:
        delivery: 机敏肯定，说话直接利落
        timbre: 清朗轻快
        pace: 明快
        pitch: 中等
    happy_jack:
      display_name: 灰松鼠快乐杰克
      tts:
        delivery: 自信好胜，受窘时有些急躁
        timbre: 明亮爽脆
        pace: 轻快
        pitch: 中高
  chapters:
    - id: ch01
      title: 大草原之王雷蹄
      blocks:
        - id: ch01-b01
          speaker: mother_nature
          text: “谁还记得，鹿家族所有成员属于哪个目？”
        - id: ch01-b02
          speaker: happy_jack
          text: “名字我忘了，可我记得它的意思，就是长蹄子的动物。”
        - id: ch01-b03
          speaker: peter_rabbit
          text: “它叫有……有蹄……我只想得到这里了。”
        - id: ch01-b04
          speaker: narrator
          text: 彼得兔怎么也想不起后半截，只好停了下来。
        - id: ch01-b05
          speaker: mother_nature
          text: “叫有蹄目。快乐杰克说得对，所有长蹄子的动物都属于这个目。它下面分成好几个科，你们已经学过鹿科了。现在该认识牛科，也就是牛羊这一家。家族里最大、最重要的是野牛雷蹄，人们也常叫他水牛。”
        - id: ch01-b06
          speaker: mother_nature
          text: “雷蹄跟布朗农夫家的母牛大妞，比跟鹿家族更亲近。他长的是真角，不是鹿角。真角里面是空的，不会像鹿角那样年年脱落，而是要戴上一辈子，雷蹄太太也有。它们从前额两边长出来，先向外伸，再向上又向内弯。角的表面光滑，尖端锐利，而且从不生出角叉。”
        - id: ch01-b07
          speaker: mother_nature
          text: “雷蹄又高大又沉重，跟布朗农夫家的公牛一般大。肩头隆起一座高峰，脑袋总是低垂着，喉咙下面还挂着一大把胡须。他的头本来就大，再让浓密的卷毛一盖，看起来比实际还大得多。尾巴比较短，末端缀着一簇毛。身上和后半部的毛短而浅褐，肩颈和两条前腿一直到膝盖，披的却是又长又蓬乱的毛，上面深褐，下面几乎全黑。”
        - id: ch01-b08
          speaker: chatterer
          text: “这家伙的模样一定很怪吧？”
        - id: ch01-b09
          speaker: mother_nature
          text: “是很怪。他的前半身比后半身大出那么多，简直像是把两个不相配的半截拼到了一起。”
        - id: ch01-b10
          speaker: jumper
          text: “那他吃什么？”
        - id: ch01-b11
          speaker: mother_nature
          text: “吃青草，和大妞一样低头啃食。天气热起来，他那身厚外衣哪怕已经脱掉不少，还是闷得难受，苍蝇也会来不停叮扰。这时候，他最喜欢滚进泥里翻来滚去，一直滚到从头到脚都糊满泥巴。”
        - id: ch01-b12
          speaker: mother_nature
          text: “许多年前，这个国家几乎到处都有野牛，数量超过任何别的大型动物。有些住在树林里，人们叫他们森林野牛。不过，绝大多数都生活在青草丰盛的大平原和大草原上。我讲过荒原驯鹿组成的大群，可跟当年那些横越草原、随季节南北迁徙的野牛群相比，那还算不了什么。每到秋天，他们向南迁；春天新草一长，又一路跟着向北走。他们奔跑起来，千万只蹄子响得如同雷鸣。”
        - id: ch01-b13
          speaker: mother_nature
          text: “后来，猎人带着可怕的枪来了。为了取得牛皮，他们大肆屠杀野牛，一杀就是几十万头。短短几年，那些大牛群就只剩下回忆。雷蹄原是大草原之王，却被赶出了自己的整个辽阔王国。野牛原本是所有大型动物里数量最多的，到今天却只剩区区几百头，而且大多被人养在公园里。幸好人类赶在最后关头立法保护雷蹄。要是没有这些法律，今天世上连一头野牛也见不到了。”
    - id: ch02
      title: 跑得最快的疾足
      blocks:
        - id: ch02-b01
          speaker: mother_nature
          text: “雷蹄统治大草原的年代，近旁还住着羚羊疾足。他只有一头小鹿那么大，姿态轻盈优美，很像轻脚。他也有匀称的身躯，还有一双修长纤细的腿。那副身体一看就是为飞奔而生的。就像谁看见跳跳，都知道他能纵身跳出很远，谁看见疾足，也会马上认出这是一位赛跑能手。在这个国家里，我所有的孩子当中，他跑得最快。真要比赛，谁也休想跟上他。”
        - id: ch02-b02
          speaker: mother_nature
          text: “疾足背上是浅黄褐色，腹面雪白。褐色的前额两旁，是白色的脸颊。喉部和颈下也白，中间横着两道褐纹。他的蹄子、双角和眼睛都是黑的。两只耳朵下面各有一块黑斑，鼻尖附近也黑。后颈从上到下还有一道黑线，那里的毛又长又硬。短尾巴四周，围着一大片白毛。你们还记得西南部那只大长耳野兔羚羊杰克吗？”
        - id: ch02-b03
          speakers: [peter_rabbit, jumper]
          ensemble: duo
          text: “我们都记得！”
        - id: ch02-b04
          speaker: mother_nature
          text: “跳跳，我当时说了什么？”
        - id: ch02-b05
          speaker: jumper
          text: “您说，他能把身体两边的白毛张开，看起来像是越变越宽，几乎全身都白了。他就是这样给朋友发信号的。”
        - id: ch02-b06
          speaker: mother_nature
          text: “一点儿不错，你记得这么清楚，我很高兴。疾足也能把尾巴周围的长白毛向四周张开，让那片白斑一下子变大。他跑起来，白斑在阳光下不断闪动。哪怕他已经跑得很远，身上别的地方全看不见了，那片闪动的白光还是看得清清楚楚。疾足的眼睛格外锐利，所以他和伙伴相隔很远，也能用这些白斑彼此传信。”
        - id: ch02-b07
          speaker: mother_nature
          text: “疾足长的是真角，可这副角跟其他真角都不一样，偏偏会像鹿角一样，每年脱落。两只角就在眼睛正上方笔直长起，不算太长，却各分成两叉。一叉短得多，另一叉较长，顶端翻转过来，弯得像钩子。因为这副特别的角，他又叫叉角羚。”
        - id: ch02-b08
          speaker: mother_nature
          text: “为了逃开危险，疾足会垂着头，一跃就是老远。没有受惊时，他会骄傲地昂起头，轻快小跑。他最喜欢平坦开阔的地方。在西部辽阔的大平原上，没有什么景象比疾足和一群伙伴更加美丽。他生性爱交际，总愿意和自己的同类待在一起。”
        - id: ch02-b09
          speaker: mother_nature
          text: “从前，这些美丽的动物几乎和野牛一样多。可是，他们也像野牛那样遭到不停的屠杀，如今已经真的面临灭绝的危险。要是人类还不肯比现在更用心地保护他们，总有一天，最后一只羚羊也会死在枪下。到那时，我所有孩子当中最美丽、最有趣的一员，就只能活在人们的回忆里了。”
          emotion: sad
        - id: ch02-b10
          speaker: narrator
          text: 老大自然妈妈说到这里，声音里满是悲伤。好几分钟，没有谁开口。大家都在想着这件可怕的事。野牛和羚羊本是这片辽阔土地上最出色的两种动物，曾经拥有数也数不清的庞大族群，却都在人类手中遭了这样的厄运。每个朋友心里都泛起苦涩，因为在场没有谁不曾因人类而害怕。
    - id: ch03
      title: 冰雪之地的长毛
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 最后，老大自然妈妈打破了沉默。
        - id: ch03-b02
          speaker: mother_nature
          text: “现在来认识牛羊家族里模样最奇特的一员，麝牛长毛。他看着既不完全像牛，也不完全像羊，倒把两边连了起来。他有几分像一头小野牛，身上又有些地方很像绵羊。”
        - id: ch03-b03
          speaker: mother_nature
          text: “长毛住在极北的冰雪世界。人们甚至在很靠近北冰洋的地方见过他。熟悉那片冰雪土地的人也想不通，漫长的冬天里，他怎么找得到足够的食物。他的身躯粗壮浑圆，四条腿又短又结实。高耸的双肩隆起成峰，脑袋垂得很低，脸孔像羊。两只沉重的角，根部又平又宽，在前额正中相接。角贴着脑袋两边向下伸，再翻转向上，收成尖利的末端。尾巴短得完全藏进了覆盖全身的长毛里。”
        - id: ch03-b04
          speaker: mother_nature
          text: “他的毛一直垂向身体两边，常常碰到雪地，连四条腿都快遮到脚边了。毛色深褐，几乎发黑。身体两侧的毛直直垂下，肩头的毛却是卷的。背部中央还有一块较短的暗灰色毛。”
        - id: ch03-b05
          speaker: mother_nature
          text: “这层长毛下面，还有一层细软的浅褐色绒毛。它密得连寒气和雨水都钻不进去。正靠着这件温暖的内衣，长毛才能住在那么冷的地方。他约有一头大鹿的两倍重。有时候，身上还会散出麝香味，所以人们叫他麝牛。”
        - id: ch03-b06
          speaker: mother_nature
          text: “长毛很少单独行动，身边通常有一群伙伴。这也是为了防备最凶恶的敌人，也就是狼。狼群一出现，他们就围成一圈，所有脑袋都朝外。除非饿得连命也不要了，否则没有哪只狼敢硬闯那一圈尖角。”
    - id: ch04
      title: 稳稳走过北方
      blocks:
        - id: ch04-b01
          speaker: mother_nature
          text: “在崎岖多石的地方，长毛和绵羊一样站得稳、走得牢。北方的夏天很短，那时他还能找到充足的食物。冬天一来，他就得用蹄子刨开积雪，寻找埋在下面的苔藓和其他植物。住在那么遥远的北方，差不多所有动物都会换上白外衣，只有长毛一年到头都穿着那身深色皮毛。”
        - id: ch04-b02
          speaker: mother_nature
          text: “哎呀，时间过得真快！今天就讲到这里。明天，我再给你们讲两位了不起的登山高手。他们能轻轻松松走过的地方，就连人类也跟不上。”
