  chapters:
    - id: ch01
      title: Thunderfoot, Fleetfoot and Longcoat
      blocks:
        - id: ch01-b01
          speaker: old_mother_nature
          text: "Who remembers the name of the order that includes every member of the Deer family?"
        - id: ch01-b02
          speaker: happy_jack
          text: "I remember what the name means, but I can't remember the name itself. It means animals with hoofs."
        - id: ch01-b03
          speaker: peter_rabbit
          text: "It's Un... Un... Ungu..."
        - id: ch01-b04
          speaker: narrator
          text: "Peter stopped. No matter how hard he tried, the rest of the word would not come to him."
        - id: ch01-b05
          speaker: old_mother_nature
          text: "Ungulata. And Happy Jack remembered the meaning correctly. Ungulata is the order for all animals with hoofs. It contains several families. You already know the Deer family. Now we come to the Cattle and Sheep family, called Bovidae. Its biggest and most important member is Thunderfoot the Bison, though people commonly call him Buffalo."
        - id: ch01-b06
          speaker: old_mother_nature
          text: "Thunderfoot is more closely related to Bossy, Farmer Brown's Cow, than any Deer is. He has true horns instead of antlers. His horns are hollow, and he keeps them throughout his life instead of dropping them each year. Mrs. Thunderfoot has horns too. They grow from the sides of the forehead, curve upward and inward, and end in smooth, sharp points. They never branch."
        - id: ch01-b07
          speaker: old_mother_nature
          text: "Thunderfoot is a great, heavy animal, as big as Farmer Brown's Ox. A huge hump rises over his shoulders. He holds his head low, and a long beard hangs from his throat. Thick, curly hair covers his large head and makes it look even larger. His tail is rather short, with a tassel of hair at the end. The hair across his body and hindquarters is short and light brown. Over his shoulders and neck, and down his front legs to the knees, it grows long and shaggy. That long hair is dark brown above and almost black below."
        - id: ch01-b08
          speaker: chatterer
          text: "He must look very strange."
        - id: ch01-b09
          speaker: old_mother_nature
          text: "He does. His front half looks so much larger than his back half that the two parts almost seem to belong to different animals."
        - id: ch01-b10
          speaker: jumper
          text: "What does Thunderfoot eat?"
        - id: ch01-b11
          speaker: old_mother_nature
          text: "Grass. He grazes just as Bossy does. In hot weather, his thick coat becomes very uncomfortable, even after he has shed much of it. Flies torment him too. That is when he loves to roll in the mud until it covers him from his head to his feet."
        - id: ch01-b12
          speaker: old_mother_nature
          text: "Many years ago, there were more Bison than any other large animal in this country. They lived in nearly every part of it. Some stayed in the woods and were known as Wood Buffaloes. Far greater numbers lived on the broad plains and prairies, where grass was plentiful. I told you about the great herd of Barren Ground Caribou, but even that was small beside the Bison herds that once crossed the prairies. They traveled south in autumn and north in spring, following the new grass as it appeared. When those herds galloped, their pounding feet sounded like thunder."
        - id: ch01-b13
          speaker: old_mother_nature
          text: "Then hunters came with terrible guns. They killed Bison for their skins by the hundreds of thousands. In only a few years, the enormous herds were nothing but a memory. Thunderfoot had once been Lord of the Prairies. Now he was driven from his whole great kingdom. The Bison went from being the most numerous large animal to numbering only a few hundred, and people kept most of those in parks. Human beings made laws to protect Thunderfoot barely in time. Without that protection, no Bison would be alive today."
        - id: ch01-b14
          speaker: old_mother_nature
          text: "Back when Thunderfoot ruled the prairies, Fleetfoot the Antelope lived nearby. Fleetfoot is about the size of a small Deer. His graceful shape may remind you of Lightfoot, because he has the same trim body and long, slender legs. Everything about him says that he was made to run. One look at Fleetfoot tells you he is a runner, just as one look at Jumper the Hare tells you that he travels in great bounds. In fact, Fleetfoot is the fastest of all my children in this country. No other animal here can keep pace with him in a race."
        - id: ch01-b15
          speaker: old_mother_nature
          text: "Fleetfoot wears light yellowish-brown across his back and white underneath. His forehead is brown, while the sides of his face are white. His throat and the underside of his neck are white too, with two brown bands crossing them. His hoofs, horns, and eyes are black. There is a black spot below each ear, more black near the end of his nose, and a line of longer, stiff black hair down the back of his neck. A large white patch circles his short tail. Now, who remembers what I told you about Antelope Jack, the big Jack Hare of the Southwest?"
        - id: ch01-b16
          speakers: [peter_rabbit, jumper]
          ensemble: duo
          text: "I remember!"
        - id: ch01-b17
          speaker: old_mother_nature
          text: "Then tell us, Jumper. What did I say?"
        - id: ch01-b18
          speaker: jumper
          text: "You said he can make the white on his sides seem to spread until he looks almost white all over. That's how he sends signals to his friends."
        - id: ch01-b19
          speaker: old_mother_nature
          text: "Exactly. I am glad you remembered it so clearly. Fleetfoot can do the same thing with the white patch around his tail. Those hairs are quite long, and he can spread them until the patch looks much larger. When he runs, the white flashes in the sunlight. You can still see it after he has gone so far away that the rest of him has disappeared. Fleetfoot's eyes are wonderfully sharp, so he and his friends use those white patches to signal across great distances."
        - id: ch01-b20
          speaker: old_mother_nature
          text: "Fleetfoot has true horns, but they are different from every other kind of horn. He sheds them each year, just as the Deer family sheds its antlers. His horns rise straight above his eyes. They are fairly short, and each one forks. One branch is much shorter than the other. The longer branch bends over at the tip like a hook. Those pronged horns give Fleetfoot another name, Pronghorn."
        - id: ch01-b21
          speaker: old_mother_nature
          text: "When danger sends him running, Fleetfoot lowers his head and takes long leaps. When he is not afraid, he trots with his head held high and proud. He likes flat, open land. Across all the wide western plains, there is no finer sight than a band of Fleetfoot and his companions. He is a social animal and enjoys being with others of his kind."
        - id: ch01-b22
          speaker: old_mother_nature
          text: "Once, these beautiful creatures were almost as plentiful as the Bison. But people killed them too. Now there is a real danger that, unless human beings protect them better, the last Antelope will someday be killed. Then one of my most beautiful and interesting children will live only in memory."
          emotion: sad
        - id: ch01-b23
          speaker: narrator
          text: "Great sadness filled Old Mother Nature's voice. For several minutes, no one said a word. They were all thinking about what human beings had done to the vast herds of two of the finest animals in the land, the Bison and the Antelope. Bitterness filled every heart. Each one of them had a reason to fear people."
        - id: ch01-b24
          speaker: old_mother_nature
          text: "Now I will tell you about the strangest member of the Cattle and Sheep family. His name is Longcoat the Musk Ox. He does not seem to belong entirely to the Cattle branch or entirely to the Sheep branch. In his appearance, he connects the two. He looks a little like a small Bison, but some of his features are much like a Sheep's."
        - id: ch01-b25
          speaker: old_mother_nature
          text: "Longcoat lives in the Farthest North, in the country of snow and ice. Musk Oxen have been found very near the Arctic Ocean. Anyone who knows that snow-covered country wonders how they can find enough food through the long winter. Longcoat has a heavy, rounded body and short, sturdy legs. His shoulders rise so high that they make a hump. He carries his head low, and his face looks like a Sheep's. His heavy horns are broad and flat where they meet in the middle of his forehead. From there, they sweep down each side of his head, then turn upward to sharp points. His tail is so short that the long hair covering him hides it."
        - id: ch01-b26
          speaker: old_mother_nature
          text: "That outer hair hangs so far down each side that it often touches the snow and hides almost all of his legs. It is very dark brown, nearly black. The hair along his sides is straight, but it curls over his shoulders. A patch of shorter, dull-gray hair lies in the middle of his back."
        - id: ch01-b27
          speaker: old_mother_nature
          text: "Beneath the long hair is another coat. This inner layer is made of fine, woolly, light-brown hair packed so closely that cold and rain cannot pass through it. That warm coat allows Longcoat to survive in such a bitterly cold place. He weighs about twice as much as a large Deer. At times, he gives off a musky smell. That is why he is called the Musk Ox."
        - id: ch01-b28
          speaker: old_mother_nature
          text: "Longcoat is rarely alone. He usually stays in a band with others of his kind, partly to protect themselves from their worst enemies, the Wolves. When Wolves appear, the Musk Oxen stand in a circle with their heads facing outward. Only a desperately hungry Wolf would dare to break through that wall of sharp horns."
        - id: ch01-b29
          speaker: old_mother_nature
          text: "Longcoat is as sure-footed as a Sheep over rough, rocky ground. During the short northern summer, he finds plenty of food. In winter, he must scrape away the snow to reach moss and other plants buried below. Almost every other animal that lives so far north wears a white coat, but Longcoat keeps his dark one throughout the year."
        - id: ch01-b30
          speaker: old_mother_nature
          text: "My, how quickly the time has gone! That is enough for today. Tomorrow, I will tell you about two wonderful mountain climbers. They can travel easily in places where even a person cannot follow."
