cover_prompt: |-
  A wordless cover scene in a New England forest clearing in the early twentieth century shows a small brown-and-gray cottontail rabbit attending an outdoor lesson about North American mammals. A kindly woman in a simple moss-green dress kneels beside him while a red squirrel, a striped chipmunk, a sturdy woodchuck, a black-and-white skunk, and a young white-tailed deer gather naturally among ferns and fallen logs. The woman opens one hand toward a broad beaver pond beyond the clearing as a beaver swims past its lodge, making the shared moment of discovery the focal action. Use a wide child-height view with the rabbit and teacher in the lower center, the varied animals arranged in clear overlapping depth, and woodland, meadow, and pond habitats receding behind them. Leave calm open morning sky and softly lit treetops across the top, and keep every animal anatomically believable, gentle, and non-frightening. Ground the setting, clothing, plants, and landscape in northeastern North America around 1920, independent of any film or animation design. No readable text, letters, numbers, labels, logos, captions, speech bubbles, signatures, or watermarks.

