audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 亲切生动，带着温和的幽默感
        timbre: 温暖清亮
        pace: 舒缓而富有变化
        pitch: 中等
    peter_rabbit:
      display_name: 彼得兔
      tts:
        delivery: 好奇直率，情绪来得快也去得快
        timbre: 清脆稚气
        pace: 轻快
        pitch: 中高
    jumper_hare:
      display_name: 长耳野兔跳跳
      tts:
        delivery: 朴实腼腆，认真时透着好奇
        timbre: 清朗柔和
        pace: 稍缓
        pitch: 中等
    mother_nature:
      display_name: 老大自然妈妈
      tts:
        delivery: 慈爱睿智，说话从容而坦率
        timbre: 温厚柔和
        pace: 从容
        pitch: 中低
    happy_jack:
      display_name: 灰松鼠快乐杰克
      tts:
        delivery: 自信好胜，受窘时有些急躁
        timbre: 明亮爽脆
        pace: 轻快
        pitch: 中高
    chatterer:
      display_name: 红松鼠喋喋
      tts:
        delivery: 伶牙俐齿，争强好胜又活泼
        timbre: 尖细清亮
        pace: 明快
        pitch: 高
  chapters:
    - id: ch01
      title: 第四章　喋喋和快乐杰克也来上课
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 彼得兔去老大自然妈妈那里上课，一路都在想，今天该请她先讲哪位邻居。自家家族已经给了他那么多惊喜，邻居们身上一定也藏着不少稀奇事。可是邻居太多，他怎么也选不出第一个该问谁。
        - id: ch01-b02
          speaker: narrator
          text: 没想到，这个难题很快用一种有趣的方式解决了。彼得刚走到绿森林边上，就听见一个尖厉的声音朝他喊。
        - id: ch01-b03
          speaker: happy_jack
          text: “你好呀，彼得兔！这么早，你要上哪儿去？你不是该回家，回你那亲爱的老荆棘丛吗？”
        - id: ch01-b04
          speaker: narrator
          text: 彼得马上听出来，那是灰松鼠快乐杰克。他正坐在一截老树桩顶上吃坚果。彼得摆出一副郑重的样子回答。
        - id: ch01-b05
          speaker: peter_rabbit
          text: “我要去上课。”
        - id: ch01-b06
          speaker: happy_jack
          text: “上课！哈，哈，哈！你居然要去上课！快告诉我，你跟谁上课，又去学什么呀？”
        - id: ch01-b07
          speaker: peter_rabbit
          text: “我去跟老大自然妈妈上课。我已经去了好几天，表亲长耳野兔跳跳也去了。我们学到了很多自家家族的事，现在还要认识绿森林和绿草地上的其他小居民。”
        - id: ch01-b08
          speaker: happy_jack
          text: “呸！我对自己的家族什么都知道。邻居那些事嘛，只要值得知道，就没有几件能瞒得过我。”
        - id: ch01-b09
          speaker: peter_rabbit
          text: “是吗，万事通先生？我看你连自己的表亲都没认全。我以前也以为一个都不少，后来才知道自己错了。”
        - id: ch01-b10
          speaker: narrator
          text: 这时，头顶又响起一个尖尖的、像在训人的声音。红松鼠喋喋从一棵树跳上另一棵树，落在彼得上方。
        - id: ch01-b11
          speaker: chatterer
          text: “你们俩在说什么？”
        - id: ch01-b12
          speaker: happy_jack
          text: “彼得非说我对咱们自家家族知道得不够多。他要去找老大自然妈妈上课，还劝我也去。你说好不好笑？”
        - id: ch01-b13
          speaker: narrator
          text: 快乐杰克气呼呼的。喋喋跟这个表亲向来不大和睦，立刻顶了回去。
        - id: ch01-b14
          speaker: chatterer
          text: “好不好笑，可不一定。我要是还没你了解松鼠家族，就罚我一辈子再也找不到坚果！不过，我也不敢说自己已经什么都懂了。去上几天课，应该挺有意思。彼得，我跟你一起去，怎么样？”
        - id: ch01-b15
          speaker: narrator
          text: 彼得说，这主意好极了，喋喋一定不会后悔。喋喋朝快乐杰克眨眨眼，就跟彼得上路了。当然，彼得走地面，喋喋走树上。快乐杰克迟疑了一会儿，最后还是压不住好奇心，匆匆追了上去。
        - id: ch01-b16
          speaker: mother_nature
          text: “你们好啊！你们这些闲不住的小家伙，跑到这里来做什么？”
        - id: ch01-b17
          speaker: narrator
          text: 老大自然妈妈看见快乐杰克和喋喋跟着彼得一起来，很是惊讶。两个平时嘴快的小家伙，这会儿竟像丢了舌头。尤其是喋喋，安静成这样可太少见了。其实，他们一站到老大自然妈妈面前，就都害羞起来，只好由彼得替他们回答。
        - id: ch01-b18
          speaker: peter_rabbit
          text: “他们也决定来上课。快乐杰克说，他对自己的家族什么都知道。不过他还是来了，想看看自己是不是真的全都知道。”
        - id: ch01-b19
          speaker: mother_nature
          text: “这倒很快就能弄清楚。快乐杰克，你有几个表亲？”
        - id: ch01-b20
          speaker: narrator
          text: 老大自然妈妈轻声问着，眼睛里闪着笑意。快乐杰克想了想，答得一点儿也不肯定。
        - id: ch01-b21
          speaker: happy_jack
          text: “三个。”
        - id: ch01-b22
          speaker: narrator
          text: 彼得偷偷笑了。他知道，快乐杰克已经开始怀疑自己的答案。
        - id: ch01-b23
          speaker: mother_nature
          text: “那就说说他们的名字。”
        - id: ch01-b24
          speaker: happy_jack
          text: “红松鼠喋喋、飞鼠蒂米，还有花栗鼠条纹。”
        - id: ch01-b25
          speaker: chatterer
          text: “他把狐松鼠锈锈忘啦！”
          emotion: happy
        - id: ch01-b26
          speaker: narrator
          text: 喋喋高兴得跳来跳去。快乐杰克一下子泄了气，恼火地瞪了他一眼。
        - id: ch01-b27
          speaker: mother_nature
          text: “说得对，喋喋。锈锈是松鼠家族里很重要的一员。现在，你来把其他成员说出来吧。”
        - id: ch01-b28
          speaker: chatterer
          text: “其——其——其他谁？我不知道还有别人呀。”
        - id: ch01-b29
          speaker: narrator
          text: 彼得看着快乐杰克和喋喋的脸，乐得抱紧了自己。他凑到跳跳的一只长耳朵边，小声说。
        - id: ch01-b30
          speaker: peter_rabbit
          text: “他们对自家家族知道的，也没比我们当初多呀。”
        - id: ch01-b31
          speaker: narrator
          text: 老大自然妈妈只是宽容地笑了。
        - id: ch01-b32
          speaker: mother_nature
          text: “你们两个快戴上思考帽，好好想想。你们说出来的还不到一半。这也不能全怪你们，有些成员，你们从来没有见过。可是其中有一位，你们俩都非常熟，却谁也没有提到。再认真想一想。”
        - id: ch01-b33
          speaker: narrator
          text: 喋喋看看快乐杰克，快乐杰克也看看喋喋，两个人都挠起脑袋。他们谁也不服谁，都想抢先说出那位表亲。可他们挠了又挠，还是猜不到那位表亲到底是谁。老大自然妈妈耐心等了几分钟，见他们不是想不起来，就是根本不知道，这才揭开答案。
        - id: ch01-b34
          speaker: mother_nature
          text: “你们漏掉了土拨鼠约翰尼。”
        - id: ch01-b35
          speakers: [chatterer, happy_jack]
          ensemble: duo
          text: “土拨鼠约翰尼！”
          emotion: surprised
        - id: ch01-b36
          speaker: narrator
          text: 喋喋和快乐杰克脸上的惊讶模样，实在好笑。其实，彼得兔和长耳野兔跳跳脸上的表情也一样滑稽。老大自然妈妈看着他们，点了点头。
        - id: ch01-b37
          speaker: mother_nature
          text: “对，土拨鼠约翰尼。他是松鼠家族的一员，属于旱獭这一支。可不管怎么看，他都是松鼠，也是你们的表亲。”
        - id: ch01-b38
          speaker: chatterer
          text: “这只松鼠长得也太怪了。”
        - id: ch01-b39
          speaker: narrator
          text: 喋喋说着，还用他特有的方式猛甩了一下尾巴。老大自然妈妈的口气严厉起来。
        - id: ch01-b40
          speaker: mother_nature
          text: “这只能说明你见识少，喋喋。你们两个这么无知，真叫我吃惊。你们早该跟我上几天课了，要学的事情还多着呢。彼得和跳跳也一样。现在，谁能告诉我，你们大家属于哪一个目？”
        - id: ch01-b41
          speaker: narrator
          text: 快乐杰克看喋喋，喋喋看彼得，彼得又看跳跳。他们一个个困惑得可笑，老大自然妈妈差点笑出了声。最后，彼得总算开口了。
        - id: ch01-b42
          speaker: peter_rabbit
          text: “请问，我们好像连您说的‘目’是什么意思都不知道。”
        - id: ch01-b43
          speaker: mother_nature
          text: “我就知道，我就知道。大千世界里的动物，先要分成一个个大类，也就是大的类别。大类里面再分成小一些的类别，然后还会继续往下分。快乐杰克和喋喋属于松鼠科，彼得和跳跳属于兔科。这两个科和另外几个科，又同属一个更大的类别，叫作‘目’。你们所在的这一目就是啮齿目，也就是会啃咬的动物。”
        - id: ch01-b44
          speaker: narrator
          text: 彼得兴奋得一下跳到半空。
        - id: ch01-b45
          speaker: peter_rabbit
          text: “这么说，跳跳和我也跟快乐杰克、喋喋是亲戚！”
          emotion: surprised
        - id: ch01-b46
          speaker: mother_nature
          text: “从某种意义上说，是的。虽然亲缘不算很近，可你们确实有亲戚关系，因为你们全都是啮齿动物。鼠科、河狸科、豪猪科、囊地鼠科、鼠兔科和山河狸科的所有成员，也全都是啮齿动物。”
        - id: ch01-b47
          speaker: narrator
          text: 听到这里，彼得把眼睛瞪得都快从脑袋里掉出来了。
        - id: ch01-b48
          speaker: peter_rabbit
          text: “有好几个家族，我还是第一次听说。我们要学的东西真多呀！这些家族都有能啃东西的牙齿，所以彼此才算亲戚，对不对？”
        - id: ch01-b49
          speaker: narrator
          text: 老大自然妈妈满意地看着彼得。
        - id: ch01-b50
          speaker: mother_nature
          text: “彼得，我看你该坐到全班最前面了。你说得一点儿不错。我刚才提到的所有家族，全都属于同一个目，也就是啮齿目。它们的成员都长着大而锋利、能够切咬的门牙。没有这样的牙齿，动物就没法啃咬东西。”
        - id: ch01-b51
          speaker: mother_nature
          text: “你和跳跳已经学过自己家族的事，现在该轮到快乐杰克和喋喋了。松鼠家族很大，又分成三类。第一类是真松鼠，快乐杰克和喋喋都在里面。第二类是旱獭，土拨鼠约翰尼属于这一类。第三类只有飞鼠蒂米一个。”
        - id: ch01-b52
          speaker: chatterer
          text: “花栗鼠条纹在哪一类？”
        - id: ch01-b53
          speaker: mother_nature
          text: “我正要说。真松鼠还分成树松鼠、岩松鼠和地松鼠。喋喋和快乐杰克当然是树松鼠。”
        - id: ch01-b54
          speaker: peter_rabbit
          text: “那花栗鼠条纹就是地松鼠。”
        - id: ch01-b55
          speaker: narrator
          text: 彼得抢着回答，一脸得意扬扬，显然觉得自己聪明极了。老大自然妈妈却轻轻摇了摇头。
        - id: ch01-b56
          speaker: mother_nature
          text: “这次你答错了，彼得。”
        - id: ch01-b57
          speaker: narrator
          text: 彼得心里有多窘，脸上的模样就有多傻。
        - id: ch01-b58
          speaker: mother_nature
          text: “花栗鼠条纹是岩松鼠。住在西部平原的黄鼠西克西克，才是真正的地松鼠，大家常常把他叫作囊地鼠松鼠。今天早晨，我不能再陪你们这些小家伙了，因为还有太多事情要做。明天早上再来上课时，喋喋要把快乐杰克的事全讲给我听，快乐杰克也要把喋喋的事全讲给我听。现在都快跑吧，再好好想一想今天早晨学到的东西。”
        - id: ch01-b59
          speaker: narrator
          text: 彼得、跳跳、喋喋和快乐杰克谢过老大自然妈妈，感谢她告诉他们这些事，然后一起飞快地离开了。彼得径直奔向老果园最远的角落。他很确定土拨鼠约翰尼就在那里，恨不得立刻赶到，好抢在所有人前面告诉约翰尼，他原来是一只松鼠。你瞧，彼得可不相信约翰尼自己知道这件事。
