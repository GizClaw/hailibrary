  chapters:
    - id: ch01
      title: Chatterer and Happy Jack Join
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: On his way to Old Mother Nature's school, Peter Rabbit tried to decide which neighbor he should ask to come along. The lessons about his own family had taught him one thing very clearly. If his own relatives held so many surprises, then his neighbors and their families probably held just as many. But Peter had neighbors everywhere in the Green Forest and the Green Meadows. He could not decide which one to ask about first.
        - id: ch01-b02
          speaker: narrator
          text: The choice was soon made for him, and in a funny way. Peter had barely reached the edge of the Green Forest when a sharp voice called down to him.
        - id: ch01-b03
          speaker: happy_jack
          text: "Hello, Peter Rabbit! Where are you going so early? You should be headed home to the dear Old Briar-patch."
        - id: ch01-b04
          speaker: narrator
          text: Peter knew the voice at once. Happy Jack the Gray Squirrel sat on an old stump, eating a nut. Peter answered with great dignity.
        - id: ch01-b05
          speaker: peter_rabbit
          text: "I'm going to school."
        - id: ch01-b06
          speaker: happy_jack
          text: "School? Ho, ho, ho! Who is teaching you, and what in the world are you studying?"
        - id: ch01-b07
          speaker: peter_rabbit
          text: "Old Mother Nature is teaching me. My cousin Jumper the Hare and I have gone for several days. We've learned a great deal about our own family, and now we'll learn about the other little people of the Green Forest and the Green Meadows."
        - id: ch01-b08
          speaker: happy_jack
          text: "Pooh! I already know everything about my family. And I doubt there's much worth knowing about my neighbors that I haven't learned."
        - id: ch01-b09
          speaker: peter_rabbit
          text: "Oh, do you, Mr. Know-it-all? I don't believe you even know all your cousins. I thought I knew mine, and I was wrong."
        - id: ch01-b10
          speaker: narrator
          text: A second voice broke in, sharp and scolding. Chatterer the Red Squirrel leaped from one tree to another just above Peter's head.
        - id: ch01-b11
          speaker: chatterer
          text: "What are you two talking about?"
        - id: ch01-b12
          speaker: happy_jack
          text: "Peter says I may not know enough about our own family. He's going to Old Mother Nature's school, and he thinks I should go with him. What a joke!"
          emotion: angry
        - id: ch01-b13
          speaker: chatterer
          text: "It may be a joke, and it may not. If I don't know as much about the Squirrel family as you do, I hope I never find another nut. Still, I may not know everything. School might be fun for a while. Peter, may I come with you?"
        - id: ch01-b14
          speaker: narrator
          text: Peter said that would be splendid, and that Chatterer would never regret coming. Chatterer gave his cousin Happy Jack a wink and set off with Peter. Of course, Peter traveled on the ground while Chatterer followed from tree to tree above him. Happy Jack stayed behind for a minute, trying to make up his mind. But he was far too curious to let the others go without him. Soon he was hurrying after them.
        - id: ch01-b15
          speaker: old_mother_nature
          text: "Hello! What brings you lively fellows over here?"
        - id: ch01-b16
          speaker: narrator
          text: Happy Jack and Chatterer had arrived with Peter Rabbit, but now neither of them could find a word to say. Losing their tongues was most unusual for either squirrel, and especially for Chatterer. Yet standing in front of Old Mother Nature made them both feel bashful. They only looked at her, so Peter had to answer for them.
        - id: ch01-b17
          speaker: peter_rabbit
          text: "They've decided to come to school, too. Happy Jack says he knows everything about his own family, but he came to find out if that's true."
        - id: ch01-b18
          speaker: old_mother_nature
          text: "We can settle that quickly. Happy Jack, how many cousins do you have?"
        - id: ch01-b19
          speaker: narrator
          text: Her voice was soft, and her eyes twinkled with amusement. Happy Jack stopped to think.
        - id: ch01-b20
          speaker: happy_jack
          text: "Three."
        - id: ch01-b21
          speaker: narrator
          text: He did not sound very certain. Peter chuckled to himself. Doubt was already creeping into Happy Jack's mind.
        - id: ch01-b22
          speaker: old_mother_nature
          text: "Then name them."
        - id: ch01-b23
          speaker: happy_jack
          text: "Chatterer the Red Squirrel, Timmy the Flying Squirrel, and Striped Chipmunk."
        - id: ch01-b24
          speaker: chatterer
          text: "You forgot Rusty the Fox Squirrel!"
          emotion: happy
        - id: ch01-b25
          speaker: narrator
          text: Chatterer danced about with delight. Happy Jack's face fell, and he shot Chatterer an angry look.
        - id: ch01-b26
          speaker: old_mother_nature
          text: "That's right, Chatterer. Rusty is an important member of the Squirrel family. Now you may name the rest."
        - id: ch01-b27
          speaker: chatterer
          text: "The—the rest? What rest? I don't know any more."
          emotion: surprised
        - id: ch01-b28
          speaker: narrator
          text: Peter hugged himself with glee as he watched Happy Jack and Chatterer. Then he whispered into one of Jumper the Hare's long ears.
        - id: ch01-b29
          speaker: peter_rabbit
          text: "They don't know any more about their family than we knew about ours."
        - id: ch01-b30
          speaker: narrator
          text: Old Mother Nature smiled patiently.
        - id: ch01-b31
          speaker: old_mother_nature
          text: "Put on your thinking-caps, both of you. You haven't named even half the members of your family. Some of them live in places you've never visited, so you aren't entirely to blame for missing those. But there is one member of the Squirrel family you both know very well. Neither of you has named him. Put on those thinking-caps and try again."
        - id: ch01-b32
          speaker: narrator
          text: Chatterer looked at Happy Jack, and Happy Jack looked back at Chatterer. Then both of them began scratching their heads. Each wanted to be the first to think of the missing cousin, because neither liked being beaten by the other. They scratched and scratched, but no name came to either one. Old Mother Nature gave them several minutes. When she saw that they either could not remember or had never known, she finally told them.
        - id: ch01-b33
          speaker: old_mother_nature
          text: "Neither of you mentioned Johnny Chuck."
        - id: ch01-b34
          speakers: [chatterer, happy_jack]
          ensemble: duo
          text: "Johnny Chuck!"
          emotion: surprised
        - id: ch01-b35
          speaker: narrator
          text: The surprise on Happy Jack's and Chatterer's faces was funny to see. Neither one had ever imagined Johnny Chuck could be a Squirrel. For that matter, Peter Rabbit and Jumper the Hare wore equally funny looks. The answer had astonished all four of them. Old Mother Nature nodded and repeated the name so there could be no mistake.
        - id: ch01-b36
          speaker: old_mother_nature
          text: "Yes, Johnny Chuck. He is part of the Squirrel family. He belongs to the Marmot branch, but that still makes him a Squirrel and your cousin."
        - id: ch01-b37
          speaker: chatterer
          text: "Well, he's a very funny-looking Squirrel."
        - id: ch01-b38
          speaker: narrator
          text: Chatterer gave his tail the quick jerk that only he could give it.
        - id: ch01-b39
          speaker: old_mother_nature
          text: "That only shows how little you know, Chatterer. I must say, I'm surprised at both of you. It is high time you came to my school for a while. You have a great deal to learn, and so do Peter and Jumper. Let us begin with something bigger than a family. Can any one of you tell me which order all four of you belong to?"
          emotion: angry
        - id: ch01-b40
          speaker: narrator
          text: Happy Jack looked at Chatterer. Chatterer looked at Peter, and Peter looked at Jumper. Every face wore such a puzzled expression that Old Mother Nature nearly laughed aloud. At last Peter found his voice.
        - id: ch01-b41
          speaker: peter_rabbit
          text: "If you please, I don't think we know what you mean by an order."
        - id: ch01-b42
          speaker: old_mother_nature
          text: "That's what I thought. First, the animals of the Great World are divided into large groups. Each large group is divided into smaller groups, and those are divided into groups smaller still. Happy Jack and Chatterer belong to one of the smaller groups called the Squirrel family. Peter and Jumper belong to another called the Hare family. The Squirrel family, the Hare family, and several other families all fit inside a bigger group. We call that bigger group an order. The order you belong to is the order of Gnawers, or Rodents."
        - id: ch01-b43
          speaker: narrator
          text: Peter was so excited that he jumped straight into the air.
        - id: ch01-b44
          speaker: peter_rabbit
          text: "Then Jumper and I are related to Happy Jack and Chatterer!"
          emotion: surprised
        - id: ch01-b45
          speaker: old_mother_nature
          text: "You are, in a way. The relationship isn't close, but all of you are Rodents. So are the Rat and Mouse family, the Beaver family, the Porcupine family, the Pocket Gopher family, the Pika family, and the Sewellel family."
        - id: ch01-b46
          speaker: narrator
          text: By now Peter's eyes seemed ready to pop from his head.
        - id: ch01-b47
          speaker: peter_rabbit
          text: "I've never even heard of some of those families. My, we have so much to learn! Are they related because every one of them has teeth made for gnawing?"
        - id: ch01-b48
          speaker: narrator
          text: Old Mother Nature looked pleased.
        - id: ch01-b49
          speaker: old_mother_nature
          text: "Peter, you should go straight to the head of the class. That's exactly why they are related. Every family I just named belongs to the same order, the Rodents. Every member has large front teeth with sharp cutting edges. An animal without teeth like those cannot gnaw. Now, you and Jumper have already learned about the Hare family. It is time for Happy Jack and Chatterer to learn about the Squirrel family. Theirs is a rather large family, and it divides into three groups. The first group is made up of the true Squirrels, including Happy Jack and Chatterer. The second group is the Marmots, and Johnny Chuck belongs there. Timmy the Flying Squirrel has the whole third group to himself."
        - id: ch01-b50
          speaker: chatterer
          text: "What about Striped Chipmunk? Which group is his?"
        - id: ch01-b51
          speaker: old_mother_nature
          text: "I was coming to him. The true Squirrels are divided again. There are Tree Squirrels, Rock Squirrels, and Ground Squirrels. Chatterer and Happy Jack are Tree Squirrels, of course."
        - id: ch01-b52
          speaker: peter_rabbit
          text: "And Striped Chipmunk must be a Ground Squirrel."
        - id: ch01-b53
          speaker: narrator
          text: Peter looked very pleased with his clever answer, but Old Mother Nature shook her head.
        - id: ch01-b54
          speaker: old_mother_nature
          text: "You're wrong this time, Peter. Striped Chipmunk is a Rock Squirrel. The true Ground Squirrel is Seek Seek the Spermophile. He lives out on the plains of the West, where he is often called Gopher Squirrel. Now I can't spend any more time with you little folks this morning. I have far too much work to do. Tomorrow morning, I expect Chatterer to tell me everything he knows about Happy Jack. Happy Jack must tell me everything he knows about Chatterer. Off you go now. Scamper along, all of you, and think over what you learned this morning."
        - id: ch01-b55
          speaker: narrator
          text: Peter and Jumper and Chatterer and Happy Jack thanked Old Mother Nature for the lesson. Then all four scampered away. Peter headed straight for the far corner of the Old Orchard, because he felt sure Johnny Chuck would be there. He could not reach it quickly enough. Peter wanted to be the very first to tell Johnny Chuck that he was a Squirrel. You see, Peter did not believe Johnny knew it himself.
