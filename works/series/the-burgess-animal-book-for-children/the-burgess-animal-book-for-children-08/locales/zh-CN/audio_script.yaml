audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 亲切生动，带着温和的幽默感
        timbre: 温暖清亮
        pace: 舒缓而富有变化
        pitch: 中等
    peter_rabbit:
      display_name: 彼得兔
      tts:
        delivery: 好奇直率，情绪来得快也去得快
        timbre: 清脆稚气
        pace: 轻快
        pitch: 中高
    jumper_hare:
      display_name: 长耳野兔跳跳
      tts:
        delivery: 朴实腼腆，认真时透着好奇
        timbre: 清朗柔和
        pace: 稍缓
        pitch: 中等
    mother_nature:
      display_name: 老大自然妈妈
      tts:
        delivery: 慈爱睿智，说话从容而坦率
        timbre: 温厚柔和
        pace: 从容
        pitch: 中低
    happy_jack:
      display_name: 灰松鼠快乐杰克
      tts:
        delivery: 自信好胜，受窘时有些急躁
        timbre: 明亮爽脆
        pace: 轻快
        pitch: 中高
    chatterer:
      display_name: 红松鼠喋喋
      tts:
        delivery: 伶牙俐齿，争强好胜又活泼
        timbre: 尖细清亮
        pace: 明快
        pitch: 高
    striped_chipmunk:
      display_name: 花栗鼠条纹
      tts:
        delivery: 开朗谦和，机灵中带着几分自信
        timbre: 清亮柔和
        pace: 轻快
        pitch: 中高
    johnny_chuck:
      display_name: 土拨鼠约翰尼
      tts:
        delivery: 直率倔强，懒洋洋中带着粗朴的自信
        timbre: 浑厚结实
        pace: 稍缓
        pitch: 中低
  chapters:
    - id: ch01
      title: 第八章　吹口哨和吠吠
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 第二天早晨，第一个赶来的就是土拨鼠约翰尼。知道自己还有近亲，他兴奋极了。过去，他一直以为土拨鼠自成一家，跟别的动物都没有亲缘。现在呢，他的好奇心简直不输给彼得兔。老大自然妈妈刚准备好，要开始上课，他的问题也已经准备好了。
        - id: ch01-b02
          speaker: johnny_chuck
          text: “请问，我最亲近的亲戚是谁？”
        - id: ch01-b03
          speaker: mother_nature
          text: “是大西部的旱獭。你自己就是旱獭，那边的表亲大体上都和你很像。最大、最漂亮的一个叫吹口哨，住在西北部的山区。说起个头来，他可是整个旱獭家族里最大的。”
        - id: ch01-b04
          speaker: peter_rabbit
          text: “他比约翰尼大很多吗？”
        - id: ch01-b05
          speaker: narrator
          text: 老大自然妈妈点了点头。
        - id: ch01-b06
          speaker: mother_nature
          text: “大得多，体重大概有约翰尼的两倍。”
        - id: ch01-b07
          speaker: narrator
          text: 约翰尼一下睁圆了眼睛。
        - id: ch01-b08
          speaker: johnny_chuck
          text: “哎呀，我真想见见他！他长得像我吗？”
          emotion: surprised
        - id: ch01-b09
          speaker: mother_nature
          text: “身形很像，可他的外套漂亮得多。深褐色的毛和白毛混在一起，看上去灰蒙蒙的。头顶、脚、爪子和耳朵都是黑色，每只耳朵后面还有一道黑纹，一直通到颈部。下巴雪白，鼻子上也有白斑，身子下面则是浅浅的锈红色。”
        - id: ch01-b10
          speaker: mother_nature
          text: “他的毛比你的厚，也比你的柔软，因为他住的地方更冷。尾巴也更大、更蓬松一些，颜色是近乎黑色的深褐。”
        - id: ch01-b11
          speaker: johnny_chuck
          text: “那他为什么叫吹口哨呢？”
        - id: ch01-b12
          speaker: mother_nature
          text: “因为他能吹出又尖又亮的哨声，隔着很远很远都听得见。他也会像你一样直起身子坐着。只要看见危险靠近，他就吹响口哨，提醒所有听得见的族亲。”
        - id: ch01-b13
          speaker: peter_rabbit
          text: “我是不是不该问，他也像约翰尼一样住在地洞里吗？”
        - id: ch01-b14
          speaker: mother_nature
          text: “他的确住在地洞里。所有旱獭都住在地下，不过吹口哨生活的地方完全不同。他住在高高的山坡上，那里常常高得连树都长不了，地上尽是岩石。他就在岩石缝里向下挖洞。”
        - id: ch01-b15
          speaker: peter_rabbit
          text: “那一定是个又舒服又安全的洞。他总不用担心狐狸雷迪把洞挖开吧。”
        - id: ch01-b16
          speaker: narrator
          text: 老大自然妈妈笑了。
        - id: ch01-b17
          speaker: mother_nature
          text: “这回你猜对了。可是，吹口哨仍有被挖出来的危险。他住的地方还有巴斯特熊的大表亲灰熊。只要能捉到旱獭，灰熊很乐意拿它当一顿美餐。它个头大，力气强，还有一双巨爪，能把岩石一块块扒开，再把吹口哨从洞里挖出来。”
        - id: ch01-b18
          speaker: mother_nature
          text: “对了，吹口哨也叫灰旱獭或白霜旱獭。他吃青草和别的绿色植物。到了秋天，他会像约翰尼一样把自己吃得胖乎乎的，再睡过整个冬天。大西部还有一两种旱獭住得更靠南，不过习性和吹口哨、约翰尼差不多。”
        - id: ch01-b19
          speaker: mother_nature
          text: “旱獭都不爱成群结伴，两座旱獭的家绝不会紧紧挨在一起。这和约翰尼那位小表亲正好相反。他就是草原犬鼠吠吠。身边没有同类做邻居，吠吠可快活不起来。在我的小动物中，他算得上最爱热闹的一个。”
        - id: ch01-b20
          speaker: narrator
          text: 约翰尼天生慢吞吞的，还没来得及开口，快乐杰克已经抢先央求起来。
        - id: ch01-b21
          speaker: happy_jack
          text: “快给我们讲讲他吧！”
        - id: ch01-b22
          speaker: mother_nature
          text: “吠吠是旱獭家族里最小的一个。从某方面说，他跟地松鼠的亲缘，同他跟旱獭的亲缘差不多近。约翰尼每只前脚只有四根爪子，吠吠却像地松鼠一样有五根。他很像一只小小的土拨鼠，身上披着浅黄褐色的外套。尾巴大部分也和外套同色，只有末端是黑的。不过，这个家族中有一种的尾尖是白色。”
        - id: ch01-b23
          speaker: mother_nature
          text: “他的两边脸颊里各有一个小囊，就像随身带着两个小口袋。这也是一个证明，能看出他和黄鼠家族的亲缘有多近。”
        - id: ch01-b24
          speaker: mother_nature
          text: “吠吠天生喜欢结伴。他住在西部和西南部辽阔的大平原上，那些地方常常干得很，很少有雨落下来。只要找到一座吠吠的家，近旁一定还有许多草原犬鼠的家。有时，成百上千座家聚在一起，简直成了一座真正的城镇。因为草原犬鼠最喜欢和同类待在一起。”
        - id: ch01-b25
          speaker: johnny_chuck
          text: “吠吠挖的洞和我的一样吗？”
        - id: ch01-b26
          speaker: mother_nature
          text: “有些地方像，有些地方不一样。首先，他的地道几乎笔直向下，要伸出很长一段。其次，门前没有沙土堆，因为门就开在土堆正中央。”
        - id: ch01-b27
          speaker: mother_nature
          text: “吠吠住的地方平时少雨，可雨一下起来就很大，地面会暂时积水。那里又很平坦。要是他不想办法挡住，许多水就会灌进家里，让他难受极了。所以，他把沙土运出来，沿着洞口四周堆好，再用鼻子压结实。这样，他就筑起了一座牢固的土丘。土丘有两个用处，一个是挡住雨水，不让水流进洞里，另一个是当作瞭望塔。他会坐在土丘顶上察看敌人。至于那种白尾巴的表亲，挖出的洞倒更像你的。”
        - id: ch01-b28
          speaker: mother_nature
          text: “吠吠爱到邻居家串门，也爱让邻居来拜访。他们都是活泼的小家伙，彼此总有说不完的话。只要有一个看见敌人，就会马上发出警报。于是，每只草原犬鼠都飞快地奔回自己的洞，头朝下一头扎进去。可几乎就在下一刻，他又把脑袋探出来，看看危险究竟是什么。”
        - id: ch01-b29
          speaker: peter_rabbit
          text: “他不用跑到洞底，怎么转得过身来？”
        - id: ch01-b30
          speaker: narrator
          text: 老大自然妈妈轻轻笑了起来。
        - id: ch01-b31
          speaker: mother_nature
          text: “我刚才还在想，你们会不会有人问这个呢。吠吠会在洞口下方不远的地方，从地道一侧挖出一间小屋。他只要赶紧钻进那间小屋，在里面转过身，就能立刻把脑袋重新探出洞口。我刚才说过，他的地道先向下挖得很深，再拐个弯，在地下横着伸出几乎同样远。那里有一间舒服的小卧室，有时还不止一间。”
        - id: ch01-b32
          speaker: happy_jack
          text: “那里那么干，他从哪儿找水喝？”
        - id: ch01-b33
          speaker: mother_nature
          text: “他不用喝水。有人以为他会一直往下挖，直到找到藏在很深很深的地下水，其实不是这样。他根本不需要另外喝水，吃下的绿色植物，已经给了他需要的全部水分。”
        - id: ch01-b34
          speaker: peter_rabbit
          text: “我猜，他也和我们一样，有许多敌人吧？”
        - id: ch01-b35
          speaker: narrator
          text: 老大自然妈妈点了点头。
        - id: ch01-b36
          speaker: mother_nature
          text: “当然。老郊狼和狐狸雷迪都爱吃草原犬鼠，鹰家族的成员也一样。有些地方还住着黄鼠狼黑影的一位表亲，叫黑足雪貂。在所有敌人中，吠吠最该怕的就是他，因为他能跟在吠吠身后，一直追进地洞里。”
        - id: ch01-b37
          speaker: mother_nature
          text: “猫头鹰胡迪也有一位表亲，名叫穴鸮。他把家筑在地洞里，所以才得了这个名字。你要是来到草原犬鼠的村镇，很可能会发现许多穴鸮住在那里，也很可能遇见响尾蛇嗡嗡尾。”
        - id: ch01-b38
          speaker: mother_nature
          text: “许多人以为，吠吠、嗡嗡尾和小穴鸮是最要好的朋友，还常常同住一个洞。事实完全不是这样。嗡嗡尾爱吃草原犬鼠的幼崽，穴鸮也爱吃。穴鸮有时懒得自己挖洞，就会占下吠吠废弃的旧洞。要是他弄错了，钻进一座吠吠还住着的洞，吠吠多半会杀死他，因为吠吠知道穴鸮是敌人。”
        - id: ch01-b39
          speaker: mother_nature
          text: “响尾蛇嗡嗡尾也会利用草原犬鼠的洞。可是，只要洞里有草原犬鼠宝宝，他们就再也不可能活着看看外面的世界。所以，嗡嗡尾和穴鸮其实都是吠吠的敌人，绝不是他的朋友。”
        - id: ch01-b40
          speaker: peter_rabbit
          text: “为什么要叫他犬鼠呢？”
        - id: ch01-b41
          speaker: narrator
          text: 老大自然妈妈放声笑了起来。
        - id: ch01-b42
          speaker: mother_nature
          text: “天知道！他长得不像狗，做起事来也不像狗。我可不知道人们为什么叫他犬鼠。也许只是因为他有吠叫的习惯吧。可是，就连他的叫声也一点儿不像狗叫，还远不如狐狸雷迪的叫声像狗呢。”
        - id: ch01-b43
          speaker: mother_nature
          text: “好了，今天就讲到这里吧。你们这些小家伙还没上够课吗？”
        - id: ch01-b44
          speaker: narrator
          text: 彼得兔、长耳野兔跳跳、快乐杰克、红松鼠喋喋、花栗鼠条纹和土拨鼠约翰尼一齐喊了出来。
        - id: ch01-b45
          speakers: [peter_rabbit, jumper_hare, happy_jack, johnny_chuck]
          ensemble: chorus
          text: “没有，我们还没上够呢！”
        - id: ch01-b46
          speaker: peter_rabbit
          text: “我们还想听听啮齿目，也就是咬啮类中其他成员的事。从某方面说，他们也算是我们的亲戚，我们想了解他们。”
        - id: ch01-b47
          speaker: narrator
          text: 老大自然妈妈和蔼地笑了。
        - id: ch01-b48
          speaker: mother_nature
          text: “好吧，明天早晨再来，我们看看还能学到些什么。”
