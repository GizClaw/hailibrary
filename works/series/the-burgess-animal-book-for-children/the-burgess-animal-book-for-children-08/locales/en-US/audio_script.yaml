  chapters:
    - id: ch01
      title: Whistler and Yap Yap
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Johnny Chuck was the first pupil to arrive the next morning. He was excited because he had just learned that Woodchucks had close relatives. He had always thought they were a family all by themselves. Now he was as curious as Peter Rabbit had ever been. The moment Old Mother Nature was ready, Johnny had his question waiting.
        - id: ch01-b02
          speaker: johnny_chuck
          text: "If you please, which animals are my closest relatives?"
        - id: ch01-b03
          speaker: old_mother_nature
          text: "The Marmots of the Far West. Remember, Johnny, you are a Marmot too. Those western cousins are a good deal like you in their general shape. The largest and finest of them is Whistler. He lives in the mountains of the Northwest, and he is the biggest member of the whole Marmot family."
        - id: ch01-b04
          speaker: peter_rabbit
          text: "Is Whistler a lot bigger than Johnny?"
        - id: ch01-b05
          speaker: narrator
          text: Old Mother Nature nodded.
        - id: ch01-b06
          speaker: old_mother_nature
          text: "Yes, a great deal bigger. I believe he weighs twice as much as Johnny does."
        - id: ch01-b07
          speaker: narrator
          text: Johnny's eyes opened very wide.
        - id: ch01-b08
          speaker: johnny_chuck
          text: "My! I'd certainly like to see him. Does he look like me?"
          emotion: surprised
        - id: ch01-b09
          speaker: old_mother_nature
          text: "His shape is like yours, but his coat is much handsomer. Dark brown and white hairs mix together and make him look gray. The top of his head is black. So are his feet, claws, and ears. A black band runs from behind each ear to his neck. His chin is pure white, and he has white on his nose. Underneath, his fur is a pale rusty color. Because his home is colder than yours, his coat is thicker and softer. His tail is larger and a little bushier, with blackish-brown fur."
        - id: ch01-b10
          speaker: johnny_chuck
          text: "Please tell me why everyone calls him Whistler."
        - id: ch01-b11
          speaker: old_mother_nature
          text: "He can give a sharp, clear whistle that carries a very long way. He sits upright just as you do. When he sees danger coming, he whistles to warn every relative who can hear him."
        - id: ch01-b12
          speaker: peter_rabbit
          text: "I suppose it's silly to ask whether he lives in a hole like Johnny's."
        - id: ch01-b13
          speaker: old_mother_nature
          text: "He does. All Marmots make their homes in holes in the ground. But Whistler's country is quite different from Johnny's. He lives on mountain slopes, sometimes above the place where trees can grow. The ground there is rocky, so he digs his home down among the rocks."
        - id: ch01-b14
          speaker: peter_rabbit
          text: "That sounds like a safe home. I don't suppose Reddy Fox could dig him out of it."
        - id: ch01-b15
          speaker: narrator
          text: Old Mother Nature laughed.
        - id: ch01-b16
          speaker: old_mother_nature
          text: "You're right about Reddy Fox, but Whistler still has good reason to fear being dug out. Grizzly, the great cousin of Buster Bear, lives in that mountain country too. He is very fond of a Marmot dinner whenever he can get one. Grizzly is huge and tremendously strong. With his great claws, he can pull the rocks apart, dig down between them, and drag Whistler from his home."
        - id: ch01-b17
          speaker: old_mother_nature
          text: "By the way, Whistler is also known as the Gray Marmot and the Hoary Marmot. He eats grass and other green plants. Like Johnny, he grows very fat in autumn and then sleeps through the whole winter. One or two other kinds of Marmot live farther south in the Far West. Their habits are much like Whistler's and Johnny's. But none of these Marmots is sociable. By that I mean they do not want their homes close together. You never find two Marmot homes very near each other."
        - id: ch01-b18
          speaker: old_mother_nature
          text: "That is very different from Johnny's smaller cousin, Yap Yap the Prairie Dog. Yap Yap would be miserable without neighbors of his own kind nearby. Few of my little people are more sociable than he is."
        - id: ch01-b19
          speaker: narrator
          text: Johnny was slow by nature, and before he could ask for more, Happy Jack Squirrel spoke up.
        - id: ch01-b20
          speaker: happy_jack_squirrel
          text: "Please tell us more about Yap Yap!"
        - id: ch01-b21
          speaker: old_mother_nature
          text: "Yap Yap is the smallest member of the Marmot family. In some ways, he is as closely related to the Ground Squirrels as he is to the Marmots. Johnny has only four claws on each front foot. Yap Yap has five, just like the Ground Squirrels. He looks very much like a little Woodchuck dressed in a light yellowish-brown coat. Most of his tail is the same color as his coat, but the end is black. One member of the Prairie Dog family has a white-tipped tail instead."
        - id: ch01-b22
          speaker: old_mother_nature
          text: "He also has a small pouch, or pocket, inside each cheek. That is another sign of how closely he is related to the Spermophiles. And, as I said, he dearly loves company. He lives on the wide, open plains of the West and Southwest, often in places where the land is very dry and rain hardly ever falls. If you find one Prairie Dog home, you can be certain that many more are close at hand. Sometimes hundreds and hundreds of homes stand together, making a regular Prairie Dog town. They build that way because they dearly love the company of their own kind."
        - id: ch01-b23
          speaker: johnny_chuck
          text: "Does Yap Yap dig a home like mine?"
        - id: ch01-b24
          speaker: old_mother_nature
          text: "It is like yours in some ways, but there are important differences. First, his tunnel drops almost straight down for a long distance. Second, you won't see a heap of sand in front of his doorway. The doorway sits right in the middle of the mound."
        - id: ch01-b25
          speaker: old_mother_nature
          text: "There is a good reason for that. Rain is rare in Yap Yap's country, but when it comes, it pours. Water may cover the flat ground for a little while. Since the land is so level, plenty of that water would run down his tunnel and make him very uncomfortable if he did nothing to stop it. So Yap Yap carries out sand, piles it all the way around his doorway, and presses it down firmly with his nose. That solid mound serves two purposes. It keeps water from running into the hole, and it gives him a watchtower. He sits on top and looks for enemies. The cousin with the white-tipped tail digs a hole more like yours."
        - id: ch01-b26
          speaker: old_mother_nature
          text: "Yap Yap loves visiting his neighbors, and he likes them to visit him. Prairie Dogs are lively little creatures with plenty to say to one another. The instant one sees an enemy, he gives the alarm. Every Prairie Dog races to his own hole and dives in headfirst. Almost at once, he sticks his head out again to find out what the danger is."
        - id: ch01-b27
          speaker: peter_rabbit
          text: "But how can he turn around without going all the way to the bottom?"
        - id: ch01-b28
          speaker: narrator
          text: Old Mother Nature chuckled.
        - id: ch01-b29
          speaker: old_mother_nature
          text: "I wondered whether any of you would think to ask that. Just a little way below the entrance, Yap Yap digs a small room off to one side of the tunnel. He only has to scramble into that room, turn around, and pop his head back outside. His main tunnel runs very deep before it turns. Then it travels almost as far beneath the ground. Down there, Yap Yap has a snug little bedroom. Sometimes he digs more than one bedroom."
        - id: ch01-b30
          speaker: happy_jack_squirrel
          text: "If his country is so dry, where does he find water to drink?"
        - id: ch01-b31
          speaker: old_mother_nature
          text: "He doesn't need to drink. Some people believe he digs deep enough to reach water underground, but that isn't true. The green plants he eats give him all the moisture he needs."
        - id: ch01-b32
          speaker: peter_rabbit
          text: "I suppose he has lots of enemies, just like the rest of us."
        - id: ch01-b33
          speaker: narrator
          text: Old Mother Nature nodded.
        - id: ch01-b34
          speaker: old_mother_nature
          text: "Of course he does. Old Man Coyote and Reddy Fox are very fond of Prairie Dog dinners. So are members of the Hawk family. In some places, a cousin of Shadow the Weasel lives nearby. He is called the Black-footed Ferret, and Yap Yap fears him most of all because he can follow a Prairie Dog right down into its hole."
        - id: ch01-b35
          speaker: old_mother_nature
          text: "Another neighbor is a cousin of Hooty the Owl called the Burrowing Owl. He gets that name because he makes his home in a hole in the ground. Many Burrowing Owls may live in a Prairie Dog village. You may also find Buzztail the Rattlesnake there."
        - id: ch01-b36
          speaker: old_mother_nature
          text: "A great many people think Yap Yap, Buzztail, and the little Burrowing Owl are close friends who sometimes share one hole. Nothing could be further from the truth. Both Buzztail and the Burrowing Owl like to eat young Prairie Dogs."
        - id: ch01-b37
          speaker: old_mother_nature
          text: "Instead of digging his own home, the Owl sometimes moves into an empty Prairie Dog hole. If he chooses badly and finds Yap Yap still living there, Yap Yap will probably kill him. He knows that Owl is his enemy. Buzztail uses Prairie Dog holes too. If Prairie Dog babies are inside, you can be sure they will never grow old enough to see the world above ground. Buzztail and the Burrowing Owl are Yap Yap's enemies, not his friends."
        - id: ch01-b38
          speaker: peter_rabbit
          text: "Then why do people call Yap Yap a Dog?"
        - id: ch01-b39
          speaker: narrator
          text: Old Mother Nature laughed aloud.
        - id: ch01-b40
          speaker: old_mother_nature
          text: "Goodness knows! He doesn't look like a Dog, and he certainly doesn't behave like one. I can't imagine why people gave him that name, unless it was because he has a habit of barking. Even then, his bark sounds very little like a Dog's. Reddy Fox has a much more doglike bark. I think that is enough for today. Haven't you little folks had all the school you want?"
        - id: ch01-b41
          speakers: [peter_rabbit, jumper_the_hare, happy_jack_squirrel, chatterer_the_red_squirrel]
          ensemble: chorus
          text: "No!"
        - id: ch01-b42
          speaker: narrator
          text: Peter Rabbit, Jumper the Hare, Happy Jack, Chatterer the Red Squirrel, Striped Chipmunk, and Johnny Chuck all cried out together.
        - id: ch01-b43
          speaker: peter_rabbit
          text: "We want to hear about the other members of the Rodent family, the Gnawers. They're related to us in a way, and we want to learn about them."
        - id: ch01-b44
          speaker: narrator
          text: Old Mother Nature laughed good-naturedly.
        - id: ch01-b45
          speaker: old_mother_nature
          text: "All right. Come back tomorrow morning, and we'll see what else we can learn."
