  chapters:
    - id: ch01
      title: Unc' Billy and Old Mrs. Possum
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: "All the way home from school, Peter Rabbit tried his hardest to guess who ate flesh without belonging to the order of flesh eaters. Every few hops he stopped and thought about it again. But all that stopping and thinking did no good. When he set out for school the next morning, he was just as puzzled as before. His path took him through the Green Forest and past a certain tree. He had gone only a step beyond it when a familiar voice called down to him."
        - id: ch01-b02
          speaker: unc_billy
          text: "Morning, Bre'r Rabbit. Where are you rushing off to?"
        - id: ch01-b03
          speaker: narrator
          text: "Peter stopped short and looked up. From a hole high in the trunk, a sharp whitish-gray face peered down at him. Two black eyes twinkled in that face."
        - id: ch01-b04
          speaker: peter_rabbit
          text: "Hello, Unc' Billy! How are you and Ol' Mrs. Possum?"
        - id: ch01-b05
          speaker: unc_billy
          text: "Po'ly, Peter, po'ly. We-uns haven't had breakfast, so we're feeling mighty po'ly."
        - id: ch01-b06
          speaker: narrator
          text: "Unc' Billy grinned. Then a thought popped into Peter's head."
        - id: ch01-b07
          speaker: peter_rabbit
          text: "Unc' Billy, are you a Carnivora?"
        - id: ch01-b08
          speaker: narrator
          text: "Unc' Billy leaned farther out and cupped a hand behind his ear, as though he could not quite hear."
        - id: ch01-b09
          speaker: unc_billy
          text: "What's that, Bre'r Rabbit? Am Ah a what?"
        - id: ch01-b10
          speaker: peter_rabbit
          text: "Are you a Carnivora?"
        - id: ch01-b11
          speaker: unc_billy
          text: "Ah reckon Ah might be, if Ah knew what that was. Since Ah don't, Ah reckon Ah ain't. Ah'm just a plain Possum. When Ah want to sound real uppity, Ah add an ‘o’ and become Mister Opossum."
        - id: ch01-b12
          speaker: narrator
          text: "But Peter was no longer listening. The thought in his head had sent him racing toward school, lipperty-lipperty-lip. He even forgot to say good-by. By the time he arrived, he was quite out of breath."
        - id: ch01-b13
          speaker: peter_rabbit
          text: "I know! I know!"
        - id: ch01-b14
          speaker: old_mother_nature
          text: "What is it you know, Peter?"
        - id: ch01-b15
          speaker: peter_rabbit
          text: "I know who eats flesh but doesn't belong to the order of flesh eaters. It's Unc' Billy Possum!"
        - id: ch01-b16
          speaker: old_mother_nature
          text: "That's right. How in the world did you find out?"
        - id: ch01-b17
          speaker: peter_rabbit
          text: "I didn't exactly find out. I guessed. I saw Unc' Billy on my way here. We haven't learned about him yet, so it struck me that he must be the one. But if he eats flesh, why isn't he in the order of flesh eaters?"
        - id: ch01-b18
          speaker: old_mother_nature
          text: "Because he belongs to a group with something that makes its members entirely different from all other animals. That difference is so important that the group has been given an order of its own. They belong to the order called Marsupials, which means pouched animals. The mothers have large pockets where they carry their babies, and Old Mrs. Possum has just such a pocket."
        - id: ch01-b19
          speaker: peter_rabbit
          text: "Of course! I've seen the babies poking their heads out of her pocket. They look so funny!"
        - id: ch01-b20
          speaker: old_mother_nature
          text: "The Opossums are the only Marsupials in this country. Is it clear now why Unc' Billy and Ol' Mrs. Possum eat flesh but don't belong to the same great order as Buster Bear and the other flesh eaters?"
        - id: ch01-b21
          speaker: narrator
          text: "Everyone nodded. Just then, Chatterer the Red Squirrel shouted."
        - id: ch01-b22
          speaker: chatterer
          text: "Here come Unc' Billy, Ol' Mrs. Possum, and all the little Possums!"
        - id: ch01-b23
          speaker: narrator
          text: "Sure enough, the whole Possum family came down the Lone Little Path, and they made a very funny sight. Unc' Billy was whitish-gray, with a face even whiter than the rest of him. His hair pointed every which way. He looked as though he had just climbed out of bed and forgotten to brush it. His legs were dark, his feet were black, and his toes were white. His ears had no hair at all. The lower halves were black, while the rest was white. Behind him stretched a long whitish tail, also without a hair on it. Put that naked tail together with his sharp face, and Unc' Billy looked a great deal like a giant Rat."
        - id: ch01-b24
          speaker: narrator
          text: "But if Unc' Billy looked funny, Ol' Mrs. Possum looked funnier still. Heads and tails seemed to cover her everywhere. She had brought the whole family, and she was one of those mothers who believed in having a large one. There were twelve youngsters. Every one looked exactly like its parents, only small. Some clung across her back, while others hung along her sides. Two were tucked into the big pocket where they had spent their babyhood."
        - id: ch01-b25
          speaker: unc_billy
          text: "We-all thought we'd come along to school."
        - id: ch01-b26
          speaker: old_mother_nature
          text: "I'm glad you did. Your friends here are rather curious about the Possum family."
        - id: ch01-b27
          speaker: narrator
          text: "While they talked, Ol' Mrs. Possum began climbing a tree. She found a comfortable fork and settled there. Then the little Possums climbed off her and started playing around in the tree. That was when everyone saw what useful things those small naked tails were. The youngsters would crawl outward until the branches beneath them grew thin. Then they simply wrapped their tails around nearby twigs and held on, keeping themselves from falling."
        - id: ch01-b28
          speaker: peter_rabbit
          text: "My! Those tails certainly are useful."
        - id: ch01-b29
          speaker: unc_billy
          text: "Handiest tails there ever were. Ah don't know what Ah'd do without mine."
        - id: ch01-b30
          speaker: old_mother_nature
          text: "Climb a tree for us, Unc' Billy. Show your friends how you reach eggs in a nest when you can't crawl along the branch that holds it."
        - id: ch01-b31
          speaker: narrator
          text: "Unc' Billy grinned and good-naturedly started up a tree. He chose a branch that hung over another branch and began creeping outward. Farther and farther he went, until the wood beneath him was quite small. Then he wrapped the very end of his tail around that branch and swung his body off. He kept his grip with only his tail and one hind foot. Hanging that way, he stretched himself down to his full length. His front paws could just reach the branch below."
        - id: ch01-b32
          speaker: unc_billy
          text: "See there? If a nest was on this lower branch, Ah could get the eggs easy. Ah wish there was one. Just talking about eggs makes mah mouth water."
        - id: ch01-b33
          speaker: narrator
          text: "He grinned again, then pulled himself back onto the upper branch. Old Mother Nature shook her head at him."
        - id: ch01-b34
          speaker: old_mother_nature
          text: "Unc' Billy, you are a bad old rascal for stealing eggs. And you care just as little whether a nest holds eggs or young birds. Between you and Chatterer the Red Squirrel, it's a wonder any birds around here manage to raise families. Have you been to Farmer Brown's henhouse lately?"
        - id: ch01-b35
          speaker: narrator
          text: "Unc' Billy shook his head."
        - id: ch01-b36
          speaker: unc_billy
          text: "Not lately. Ah got a dreadful scare the last time Ah went up there. Ah reckon Ah'll keep away for a while."
        - id: ch01-b37
          speaker: old_mother_nature
          text: "What else do you eat?"
        - id: ch01-b38
          speaker: unc_billy
          text: "Anything. Ah reckon Ah'm not particular in any way. Ah eat insects and roots, Frogs and Toads, small Snakes and Lizards. Berries, fruit, and nuts suit me too. So do young Rats and Mice, corn, or any old meat somebody has left lying around. Ah reckon Ah can find myself a meal most anywhere and at most any time."
        - id: ch01-b39
          speaker: peter_rabbit
          text: "Is your family always as big as this one?"
        - id: ch01-b40
          speaker: unc_billy
          text: "Not always. But sometimes Mrs. Possum has to tote around a family even bigger than this one. We believe in children, and plenty of them. We reckon on having two or three big families every year."
        - id: ch01-b41
          speaker: johnny_chuck
          text: "Where is your home?"
        - id: ch01-b42
          speaker: peter_rabbit
          text: "I know. It's inside a big hollow tree."
        - id: ch01-b43
          speaker: narrator
          text: "Unc' Billy looked down at Peter."
        - id: ch01-b44
          speaker: unc_billy
          text: "There's no need to tell anybody where that hollow tree is, Bre'r Rabbit."
        - id: ch01-b45
          speaker: happy_jack
          text: "Do Possums live anywhere besides this part of the country?"
        - id: ch01-b46
          speaker: old_mother_nature
          text: "Yes, indeed. Possums are found all the way down through the Sunny South, and they also live in the warmer parts of the Middle West. Unc' Billy and his relatives are not fond of cold weather at all. They would much rather live where they can stay reasonably warm throughout the year."
        - id: ch01-b47
          speaker: old_mother_nature
          text: "Some people think Unc' Billy isn't very smart. Those people simply don't know him. He learned a long time ago that there are other animals he cannot outrun. Since speed will not always save him, he has learned to depend on his wits whenever danger comes. Can any of you guess what he does?"
        - id: ch01-b48
          speaker: peter_rabbit
          text: "I know! I once saw Farmer Brown's boy surprise him. Unc' Billy simply fell over dead."
        - id: ch01-b49
          speaker: happy_jack
          text: "Pooh! That can't be true, Peter Rabbit. If Unc' Billy fell over dead, how can he be alive in that tree right now?"
        - id: ch01-b50
          speaker: peter_rabbit
          text: "I didn't mean he truly died. He only looked dead. But he was the deadest-looking thing I've ever seen, and at first I thought he really was gone. I was hiding in a bramble tangle and watching the whole time. It seemed as if the fright had scared every bit of life right out of Unc' Billy. Farmer Brown's boy must have believed it too. He picked Unc' Billy up by the tail, turned him about, and looked him all over. Then he said, ‘You poor little thing. I didn't mean to hurt you.’ Through all of that, Unc' Billy never so much as blinked one eye."
        - id: ch01-b51
          speaker: peter_rabbit
          text: "Farmer Brown's boy went on up the path, carrying Unc' Billy by the tail. After a while, he laid him down on an old stump. The boy had spotted one of Blacky the Crow's nests and went away to examine it. The moment his back was turned, Unc' Billy came to life and hurried off. I've never seen him move as fast as he did then. When Farmer Brown's boy returned, the stump was empty. Unc' Billy had come alive just as suddenly as he had fallen dead."
        - id: ch01-b52
          speaker: old_mother_nature
          text: "Very good, Peter. A few other clever little animals sometimes try that same trick when danger finds them, but none can do it as well as Unc' Billy Possum. Pretending to be dead in order to remain alive is the cleverest thing Unc' Billy does. Now, how would you all like Lightfoot the Deer for our next lesson?"
        - id: ch01-b53
          speakers: [peter_rabbit, chatterer, johnny_chuck, happy_jack]
          ensemble: chorus
          text: "Splendid!"
        - id: ch01-b54
          speaker: narrator
          text: "They all got ready to go home."
