audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm, observant storytelling
        timbre: clear and gentle
        pace: measured
        pitch: medium
    old_mother_nature:
      display_name: Old Mother Nature
      tts:
        delivery: kindly, assured, and practical
        timbre: warm and full
        pace: unhurried
        pitch: medium-low
    jumper_hare:
      display_name: Jumper the Hare
      tts:
        delivery: earnest, alert, and plainspoken
        timbre: light and open
        pace: moderately quick
        pitch: medium-high
  chapters:
    - id: ch01
      title: Yowler and His Cousin Tufty
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Jumper the Hare hurried into school a little late and quite out of breath. His big, soft eyes shone with excitement.
        - id: ch01-b02
          speaker: old_mother_nature
          text: "Jumper, you look as if you've had an adventure."
        - id: ch01-b03
          speaker: jumper_hare
          text: "I certainly have. It's a wonder I got here at all. I came so close to becoming Yowler the Bob Cat's breakfast that I shiver whenever I think about it. If I hadn't already been watching for him, I believe he would have caught me."
          emotion: fearful
        - id: ch01-b04
          speaker: old_mother_nature
          text: "Then tell us everything that happened."
        - id: ch01-b05
          speaker: jumper_hare
          text: "After I saw Black Pussy here yesterday and learned that today's lesson would be about Yowler, I couldn't stop thinking about cats. Black Pussy doesn't trouble me. But if there is anyone I truly fear, it is Yowler the Bob Cat. Even thinking of him makes me uneasy. The harder I tried to put him out of my mind, the more I thought of him, and the more frightened I became."
          emotion: fearful
        - id: ch01-b06
          speaker: jumper_hare
          text: "Just before dark, I came across tracks in the mud beside the Laughing Brook. They were almost round, so I knew at once who had left them. They belonged to Yowler, and they were fresh. After that, every moving leaf made me jump inside. My heart seemed to stay in my throat. I could feel that Yowler was somewhere nearby."
          emotion: fearful
        - id: ch01-b07
          speaker: jumper_hare
          text: "I hate that Cat, and I hate the way he hunts! Sometimes he slips around without a sound. Other times he waits in hiding, ready to leap on whoever comes along. With Yowler, you never know where the danger will come from."
          emotion: angry
        - id: ch01-b08
          speaker: jumper_hare
          text: "I spent nearly the whole night beneath a little hemlock tree whose branches grew close to the ground. I didn't dare go anywhere else. If I stayed there, I felt fairly safe. Yowler would have to find me, and he would have to cross an open space where I could see him. If I wandered around, I might walk straight into his claws."
        - id: ch01-b09
          speaker: jumper_hare
          text: "Staying there was the wisest thing I could have done. The moon was very bright last night, and the open ground before me looked almost as light as day. Once, I shut my eyes for only a moment. When I opened them, Yowler was creeping across that bright space. I don't know where he came from. He made no sound at all. Not one leaf stirred beneath those big feet."
        - id: ch01-b10
          speaker: jumper_hare
          text: "He stopped right in the middle, where the moonlight was brightest, and listened. I hardly dared to breathe."
          emotion: fearful
        - id: ch01-b11
          speaker: old_mother_nature
          text: "What did he look like?"
        - id: ch01-b12
          speaker: jumper_hare
          text: "He looked exactly like what he is, a big Cat with a short tail. One glance would tell you he is Black Pussy's cousin. His head was round, his legs were rather long, and he was about twice her size. Even for such a big Cat, his feet looked enormous. A few long black hairs rose from the tips of his ears."
        - id: ch01-b13
          speaker: jumper_hare
          text: "His coat was somewhere between yellowish and reddish brown, with dark spots scattered over it. His chin and throat were white. Underneath, he was white with black spots, and spots ran all the way down his legs. That stubby thing behind him hardly deserved to be called a tail. It was whitish below and striped with black above. He kept twitching it, just as Black Pussy twitches hers when she hunts."
        - id: ch01-b14
          speaker: jumper_hare
          text: "Without warning, he opened his mouth and let out such a yell that I nearly jumped out of my skin. I was so frightened I couldn't have moved even if I'd tried, and that was lucky for me. As soon as he yelled, he tilted his head and listened. The cry must have startled some sleeper into moving, because Yowler suddenly turned and slipped away, fast and silent."
          emotion: fearful
        - id: ch01-b15
          speaker: jumper_hare
          text: "A moment later, I heard a leap and then the flutter of wings. I think he caught someone from the Grouse family."
        - id: ch01-b16
          speaker: old_mother_nature
          text: "That yell is one of Yowler's hunting tricks. He uses it for the same reason Hooty the Owl hoots. He hopes to frighten a sleeping creature into moving. If anything stirs, his sharp ears will hear it. Was that the end of your adventure?"
        - id: ch01-b17
          speaker: jumper_hare
          text: "No. I stayed under that hemlock for the rest of the night. When daylight began to creep into the Green Forest, I decided it was safe to leave and come here. Halfway to school, I paused in a thick patch of ferns. I was about to move on when I noticed something stirring behind an old stump. It was Yowler's silly-looking tail. If he'd held it still, I never would have seen him, but he kept flicking it back and forth."
        - id: ch01-b18
          speaker: jumper_hare
          text: "Yowler crouched close to the ground with all four feet tucked beneath him. He stayed there, and I stayed among the ferns, for what felt like forever. Neither of us moved except for that foolish tail. I was starting to think I might be trapped there all day. Then Yowler sprang as quick as a flash."
        - id: ch01-b19
          speaker: jumper_hare
          text: "I heard a tiny squeak. Then Yowler trotted off with a Mouse in his mouth. I suppose he'd watched the Mouse enter a hole and knew it would come out if he waited long enough. The moment Yowler vanished, I hurried here. That's the whole story."
        - id: ch01-b20
          speaker: old_mother_nature
          text: "You gave us an excellent picture of Yowler and the way he hunts. That is how he usually does it. He creeps about, hoping to surprise a Rabbit, Bird, or Mouse. Or he waits patiently beside a hole where he knows someone is hiding. In the Green Forest, he hunts just as Black Pussy, Farmer Brown's Cat, hunts Mice in the barn and Birds in the Old Orchard."
        - id: ch01-b21
          speaker: old_mother_nature
          text: "In spring, Yowler destroys many eggs and young birds. He takes them from nests on the ground and from nests in trees, because he is an excellent climber."
        - id: ch01-b22
          speaker: old_mother_nature
          text: "Yowler lives in nearly every swampy, brushy, and wooded part of the whole country. Only the great forests of the Far North are different. His cousin Tufty the Lynx lives there. Yowler is a Lynx too. He is the Bay Lynx. In some places, people simply call him the Wild Cat. In others, they call him the Catamount."
        - id: ch01-b23
          speaker: old_mother_nature
          text: "Yowler does not care as much for thick forest as he does for swamps, brushy hillsides, old pastures, and great tangles of briars. Rocky ledges suit him too, as long as they offer caves for hiding and plenty of brush. He is a coward and would rather run than fight. He will flee from a little Dog half his size and climb a tree to escape. But if he is cornered, he will defend himself."
        - id: ch01-b24
          speaker: old_mother_nature
          text: "Yowler is fairly common in the South. There he often steals Chickens and Turkeys, and even young Pigs. He likes to hunt at night, though now and then he appears in broad daylight. Mrs. Yowler has her kittens in a cave or a hollow tree. Yowler may be an expert climber, but he spends most of his time down on the ground. He is one of the worst enemies the Rabbits, Mice, Squirrels, and ground Birds have. Whenever he hunts among them, they all have good reason to fear him."
        - id: ch01-b25
          speaker: old_mother_nature
          text: "Now let us go north, into the great forests where Yowler's cousin lives. Tufty is the Canada Lynx. He is also called Loup Cervier and Lucivee, and he is nearly one-third larger than Yowler. Long tufts of black hair rise from the tips of his ears. A ruff of long hair grows along each side of his face. That ruff is white with a black border."
        - id: ch01-b26
          speaker: old_mother_nature
          text: "Tufty's tail is even shorter than Yowler's, and its tip is always completely black. His coat is generally gray, mottled with brown. Yowler has large feet, but Tufty's feet are immense for an animal his size. There is a reason for that. Snow lies deep where Tufty lives and stays there for many months. His wide feet carry him over it without breaking through. He can travel easily where Reddy Fox, though not half as big or heavy, would sink at every step."
        - id: ch01-b27
          speaker: old_mother_nature
          text: "Tufty lives deep in the woods, but otherwise he behaves much like Yowler. He will eat anything he can catch, though the Northern Hare is his main food. His coat blends so well with the dim forest that he seems like a living shadow."
        - id: ch01-b28
          speaker: old_mother_nature
          text: "Food is plentiful in summer, and Tufty eats well. Winter is different. Then he must work hard to find enough, and a full stomach is rare. Like Howler, he can go an astonishingly long time without food and still keep his strength. In that season, Tufty travels great distances because he must keep moving to survive."
        - id: ch01-b29
          speaker: old_mother_nature
          text: "No animal in the Green Forest looks fiercer than Tufty the Lynx. Yet those fierce looks are misleading. Like most Cats, he is cowardly. He will fight only when he has been cornered and cannot get away. He is also very curious. Sometimes he secretly follows a hunter or trapper for miles."
        - id: ch01-b30
          speaker: old_mother_nature
          text: "Tufty's fur is long and handsome, so people hunt and trap him for it. Because he lives mostly far from human homes, he causes people less trouble than Yowler does. He must find all his food among the little people of the Green Forest. Sometimes he attacks a Fox. And whenever he finds one of Lightfoot the Deer's pretty spotted babies, that little one may become his victim."
        - id: ch01-b31
          speaker: old_mother_nature
          text: "The darker and deeper the Green Forest, the better Tufty likes it. He makes his den beneath great piles of fallen trees or in places much like them. Mr. and Mrs. Tufty often hunt side by side. In early winter, the entire family will sometimes hunt together."
        - id: ch01-b32
          speaker: old_mother_nature
          text: "Yowler and Tufty are the only members of the Cat family still living in the eastern part of the country. Their large cousin Puma the Panther once lived in the East too. But people hunted him so heavily that he is now found only in the mountains of the Far West and in a few of the wildest places in the South. Tomorrow, I will tell you about him."
