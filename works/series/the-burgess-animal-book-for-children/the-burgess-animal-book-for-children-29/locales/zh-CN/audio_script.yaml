audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 亲切生动，带着温和的幽默感
        timbre: 温暖清亮
        pace: 舒缓而富有变化
        pitch: 中等
    jumper_hare:
      display_name: 长耳野兔跳跳
      tts:
        delivery: 朴实腼腆，认真时透着好奇
        timbre: 清朗柔和
        pace: 稍缓
        pitch: 中等
    mother_nature:
      display_name: 老大自然妈妈
      tts:
        delivery: 慈爱睿智，说话从容而坦率
        timbre: 温厚柔和
        pace: 从容
        pitch: 中低
  chapters:
    - id: ch01
      title: 第二十九章　嚎嚎和他的表亲蓬蓬
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 长耳野兔跳跳来上课时晚了一小会儿。他一路飞奔，累得上气不接下气，一双柔和的大眼睛却兴奋得直发亮。
        - id: ch01-b02
          speaker: mother_nature
          text: “跳跳，看你这个样子，刚才是不是遇上什么险事了？”
        - id: ch01-b03
          speaker: jumper_hare
          text: “是啊，我能赶到这里已经算是个奇迹了。刚才我差点儿就成了短尾猫嚎嚎的早餐，现在想起来还会发抖。幸亏我一直惦记着他，要不然准被他捉走了。”
          emotion: fearful
        - id: ch01-b04
          speaker: mother_nature
          text: “那就快把整件事讲给我们听吧。”
        - id: ch01-b05
          speaker: jumper_hare
          text: “昨天黑猫咪来过这里，今天这一课又正好要讲嚎嚎，害得我一整天都在想猫。黑猫咪不会让我害怕，可世上要真有谁能吓住我，那就是嚎嚎。只要想到他，我心里就发紧。我越不想想，他越在脑子里转。我越想他，也就越紧张。”
        - id: ch01-b06
          speaker: jumper_hare
          text: “天快黑时，我走到欢笑溪岸边，在泥里发现了一串脚印。脚印差不多是圆的，我一看就知道是谁留下的。那是嚎嚎的脚印，而且还很新鲜。”
        - id: ch01-b07
          speaker: jumper_hare
          text: “这下我更紧张了。叶子每动一下，我心里都要跟着猛跳一下，大半时候，整颗心都像堵在嗓子眼。我总觉得嚎嚎离我不远。我恨那只猫，更恨他捕猎的法子。他要么一声不响地到处潜行，要么悄悄埋伏，等谁一经过就突然扑上去。想提防他，都不知道该盯住哪边。”
          emotion: fearful
        - id: ch01-b08
          speaker: jumper_hare
          text: “那一夜，我几乎都坐在一棵小铁杉底下。那棵树的枝条很低，贴着地面。我不敢做别的，只能待在那里。守着这处藏身地，我还觉得比较安全。嚎嚎要捉我，得先找到我。他若来找，就非穿过前面那片空地不可，我可以先看见他。可我要是在外面乱走，说不定会自己撞进他的爪子里。”
        - id: ch01-b09
          speaker: jumper_hare
          text: “幸亏我够明白，没有离开。昨晚月亮特别亮，把我面前的空地照得跟白天差不多。有一次，我刚闭了一小会儿眼睛，再睁开时，嚎嚎已经无声无息地走进了空地。我根本不知道他从哪里冒出来的。他那双大脚踩过地面，竟然连一片叶子也没弄响。”
        - id: ch01-b10
          speaker: jumper_hare
          text: “他走到月光最亮的空地中央，忽然停下，竖起耳朵仔细听。我躲在那里，连气都不敢喘。”
          emotion: fearful
        - id: ch01-b11
          speaker: mother_nature
          text: “跳跳，他长什么样子？”
        - id: ch01-b12
          speaker: jumper_hare
          text: “一眼就能看出，他是只长着短尾巴的大猫，也是黑猫咪的嫡亲表兄。他的脑袋圆圆的，四条腿挺长，个头大约有黑猫咪的两倍。那双脚配在他身上都显得很大，耳朵尖还各自竖着几根长长的黑毛。”
        - id: ch01-b13
          speaker: jumper_hare
          text: “他的外衣有些发黄，又带着红棕色，上面散着深色斑点。下巴和喉咙是白的，肚皮也白，却带着黑斑。四条腿上全是斑点。那条尾巴短得都不大能算尾巴，下面发白，上面有黑色条纹。他还老让它一抽一抽的，就像黑猫咪出去捕猎时一样。”
        - id: ch01-b14
          speaker: jumper_hare
          text: “他忽然张开嘴，发出一声吓人的嚎叫。我没从自己的皮里跳出去，简直是个奇迹。那声音把我吓得浑身不能动，可这反倒救了我。他刚叫完就把脑袋歪到一边，认真听起来。”
          emotion: fearful
        - id: ch01-b15
          speaker: jumper_hare
          text: “准是有谁被他的叫声惊醒，不小心动了一下。嚎嚎听见了动静，立刻转过身，飞快地爬出了我的视线，依旧一点儿声音也没有。过了一会儿，我先听见一声扑跃，接着又听到翅膀扑腾。我想，他大概捉住了松鸡一家中的一位。”
        - id: ch01-b16
          speaker: mother_nature
          text: “突然嚎上一嗓子，正是嚎嚎常用的花招。猫头鹰胡迪发出‘呼——呼——’的叫声，也是同一个用意。他想把熟睡的居民惊得动一下。只要对方一动，他那双灵敏的耳朵一定听得见。跳跳，你的险事就这些吗？”
        - id: ch01-b17
          speaker: jumper_hare
          text: “还没完。剩下那一夜，我都留在原处。直到天光开始透进绿森林，我才觉得可以安全地离开藏身处，赶来这里。”
        - id: ch01-b18
          speaker: jumper_hare
          text: “走到半路，我钻进一丛浓密的蕨草，歇了几分钟。正要继续走，忽然看见一截老树桩后面有东西在动。那是嚎嚎那条傻里傻气的短尾巴。他要是让尾巴安静待着，我根本不会发现他，可那条尾巴偏偏一直左右抽动。”
        - id: ch01-b19
          speaker: jumper_hare
          text: “他紧贴地面蹲着，四只脚都紧紧收拢在身下。他蹲在那里，我坐在蕨草里，谁也不肯动。只有他那条可笑的尾巴还在摇。我们就这样僵持了好久。我正觉得自己可能要在那里耗上一整天，嚎嚎突然像闪电一样扑了出去。”
        - id: ch01-b20
          speaker: jumper_hare
          text: “我听见一声细小的尖叫，随后就看见嚎嚎叼着一只老鼠跑走了。他一定早就看见老鼠钻进洞里，知道耐心等着，老鼠总会再出来。嚎嚎一消失，我马上奔到学校来了。这回真的讲完了。”
        - id: ch01-b21
          speaker: mother_nature
          text: “跳跳，你把嚎嚎和他捕猎的办法讲得好极了。他大多就是这么捕猎。有时，他悄无声息地四处走，想趁兔子、鸟或老鼠不留神时抓住他们。有时，他知道谁躲进了洞里，就守在洞口耐心等候。”
        - id: ch01-b22
          speaker: mother_nature
          text: “他在绿森林里的做法，和布朗农夫的黑猫咪没有两样。黑猫咪在谷仓捉老鼠，也去老果园捉鸟。春天，嚎嚎会毁掉许多鸟蛋，捉走许多雏鸟。地面鸟巢里的会遭殃，树上鸟巢里的也逃不过。他爬树的本领非常高。”
        - id: ch01-b23
          speaker: mother_nature
          text: “除了遥远北方的大森林，整个国家各地的沼泽、灌木地和林地，差不多都有嚎嚎。北方那片大森林属于他的表亲猞猁蓬蓬。嚎嚎自己也是猞猁，是棕色猞猁。有些地方只叫他野猫，有些地方叫他山猫。”
        - id: ch01-b24
          speaker: mother_nature
          text: “嚎嚎不大喜欢密林，倒更爱沼泽、灌木丛生的山坡、荒废的牧场，还有大片荆棘。他也喜欢岩石峭壁，只要那里有洞穴藏身，周围又有许多灌木。他虽然胆小，被逼到无路可退时还是会战斗。可一只还没有他一半大的小狗，就能把他吓跑，逼得他爬到树上躲起来。”
        - id: ch01-b25
          speaker: mother_nature
          text: “嚎嚎在南方很常见，常去偷鸡和火鸡，连小猪也会偷。他喜欢夜里捕猎，不过大白天偶尔也能看见他。嚎嚎太太在洞穴或空心树里生下小猫。别看嚎嚎很会爬树，他大部分时间都在地面活动。兔子、老鼠、松鼠和地栖鸟类，都把他当作最凶恶的敌人之一。”
        - id: ch01-b26
          speaker: mother_nature
          text: “现在再说住在遥远北方大森林里的加拿大猞猁蓬蓬。人们也叫他鹿狼或卢西维。他比嚎嚎大了将近三分之一。每只耳朵尖都竖着一簇黑色长毛，脸颊两旁围着长长的毛。尾巴比嚎嚎的还短，尾巴尖总是全黑的。”
        - id: ch01-b27
          speaker: mother_nature
          text: “蓬蓬全身大致是灰色，上面夹着棕色斑纹。脸旁那圈长毛是白的，四周镶着黑边。嚎嚎的脚已经够大了，蓬蓬的脚更是大得惊人。因为他住的地方一年有好几个月都积着很深的雪，那双宽阔的大脚能托住他，让他走在雪面上，不会陷进去。”
        - id: ch01-b28
          speaker: mother_nature
          text: “红狐雷迪的个头和体重还不到蓬蓬的一半，在那种雪地里每走一步都会陷下去，蓬蓬却走得很轻松。他的生活习惯和嚎嚎差不多，只是更喜欢森林深处。凡是能捉到的东西，他都吃，不过他主要捕食北方野兔。”
        - id: ch01-b29
          speaker: mother_nature
          text: “蓬蓬外衣的颜色和树影混在一起，叫他看上去也像一道活的影子。夏天食物很多，他吃得好，日子也相当好过。冬天要找到足够的食物可就难了，那时他很少能尝到真正吃饱的滋味。”
        - id: ch01-b30
          speaker: mother_nature
          text: “他和嚎叫狼一样，可以熬过长得惊人的日子不吃东西，力气却依然不会消失。到了冬天，他会成为一位走遍远方的旅行家。为了活下去，他非这么做不可。”
        - id: ch01-b31
          speaker: mother_nature
          text: “整个绿森林里，再没有哪一种动物比猞猁蓬蓬看起来更加凶猛。可他和大多数猫科成员一样，其实很胆小，只有被逼得无处可逃才会还击。他的好奇心很强，常常会悄悄跟在猎人或设阱猎人后面，一跟就是好几英里。”
        - id: ch01-b32
          speaker: mother_nature
          text: “蓬蓬身上的毛很长，也很漂亮，人们正是为了这身毛皮捕猎他、设阱捉他。他大多住在远离人类住处的地方，所以不像表亲嚎嚎那样常给人类带来损失。他的食物全得从绿森林的小居民中寻找。有时他会袭击狐狸，要是找到白尾鹿轻蹄那些漂亮的斑点宝宝，他也绝不会放过。”
        - id: ch01-b33
          speaker: mother_nature
          text: “森林越幽暗、越茂密，蓬蓬住得越自在。他会把巢穴安在纠缠成堆的倒木下面，或是相似的隐蔽地方。蓬蓬先生和蓬蓬太太常常一起捕猎。到了初冬，全家还会时常结伴出动。”
        - id: ch01-b34
          speaker: mother_nature
          text: “如今，这片国土东部的猫科成员只剩下嚎嚎和蓬蓬。从前，他们那位高大的表亲美洲狮大山猫也住在东部。可是人类不断猎杀他，现在只有遥远西部的群山，还有南方少数最荒僻的地方能找到他。明天，我再给你们讲大山猫的故事。”
