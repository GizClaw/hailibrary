audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 亲切生动，带着温和的幽默感
        timbre: 温暖清亮
        pace: 舒缓而富有变化
        pitch: 中等
    mother_nature:
      display_name: 老大自然妈妈
      tts:
        delivery: 慈爱睿智，说话从容而坦率
        timbre: 温厚柔和
        pace: 从容
        pitch: 中低
    peter_rabbit:
      display_name: 彼得兔
      tts:
        delivery: 好奇直率，情绪来得快也去得快
        timbre: 清脆稚气
        pace: 轻快
        pitch: 中高
    bobby_coon:
      display_name: 浣熊博比
      tts:
        delivery: 慢悠悠又有些狡黠，谈到美食便兴致勃勃
        timbre: 圆润微哑
        pace: 稍缓
        pitch: 中等
    johnny_chuck:
      display_name: 土拨鼠约翰尼
      tts:
        delivery: 直率倔强，懒洋洋中带着粗朴的自信
        timbre: 浑厚结实
        pace: 稍缓
        pitch: 中低
  chapters:
    - id: ch01
      title: 第三十一章　浣熊博比来了
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 老大自然妈妈正要宣布上课，孤独小径上忽然有了轻微的响动。大家一齐望过去，只见一个古怪的家伙正拖着脚步走来。那张又尖又滑稽、黑白相间的脸，谁看一眼都认得出来。
        - id: ch01-b02
          speaker: peter_rabbit
          text: “浣熊博比！你也是来上学的吗？”
        - id: ch01-b03
          speaker: narrator
          text: 博比又往前挪了几步，直起身子坐下来，困倦地眨着眼睛。看那样子，他准是在外面忙了一整夜。他揉揉眼，又打了个大哈欠。
        - id: ch01-b04
          speaker: bobby_coon
          text: “大家好。你们一个个这么精神，真希望我也能这样。我倒想来上课，可就怕听到一半睡着了。我一个钟头前便该回家，只好请假啦。”
        - id: ch01-b05
          speaker: narrator
          text: 老大自然妈妈伸出一根手指，责备地指着博比。
        - id: ch01-b06
          speaker: mother_nature
          text: “博比，你准是又去淘气了。老实说，你是不是偷吃了布朗农夫地里那些又甜又多汁的玉米？”
        - id: ch01-b07
          speaker: narrator
          text: 博比低下了头，说起话来结结巴巴。
        - id: ch01-b08
          speaker: bobby_coon
          text: “我……我不觉得那是偷。玉米自己会长出来，为什么不能分我一点儿？别的东西我都能自己拿来吃，玉米怎么就不行？”
        - id: ch01-b09
          speaker: mother_nature
          text: “因为玉米是布朗农夫亲手种下的，也是他一直照料大的。他要是不曾播种，那里根本不会有一株玉米，所以那些玉米属于他。要是玉米生在野外，你当然有十足的权利去吃。可地里的玉米，你一点儿权利也没有。听我的话，离那片玉米地远些，不然早晚要惹麻烦。哪天夜里，猎犬鲍泽会在那里发现你，到时候你只能拼命逃跑。别再往诱惑跟前凑了。”
        - id: ch01-b10
          speaker: bobby_coon
          text: “可那些玉米实在太好吃了。”
          emotion: sad
        - id: ch01-b11
          speaker: narrator
          text: 博比叹着气，还忍不住咂了咂嘴。
        - id: ch01-b12
          speaker: bobby_coon
          text: “我最爱这种又甜又多汁的玉米。野外又不长，除了布朗农夫的地里，再没有别处能找到。他不会发觉我只吃了那么一点儿。”
        - id: ch01-b13
          speaker: narrator
          text: 老大自然妈妈摇摇头，神情变得十分严肃。
        - id: ch01-b14
          speaker: mother_nature
          text: “这根本算不上理由。记住我的话，你要是再不收手，一定会惹麻烦。每次只拿一两穗，布朗农夫也许不会在意。可你明明知道，自己糟蹋掉的玉米比吃进肚子的多出好多倍。你先尝一穗，又觉得下一穗也许更好、更甜，于是再去尝一穗。等你终于停下来，已经毁掉一大堆，真正吃下的却没多少。”
        - id: ch01-b15
          speaker: mother_nature
          text: “我看，也该把你留在这里罚一会儿。要是怕自己睡着，就去挨着豪猪刺刺坐。他会让你一直醒着。”
        - id: ch01-b16
          speaker: bobby_coon
          text: “我……我想我能醒着。”
        - id: ch01-b17
          speaker: narrator
          text: 博比把眼睛睁得溜圆，仿佛要把眼皮撑住，再也不让它们合上。
        - id: ch01-b18
          speaker: mother_nature
          text: “那我问你几个问题，帮你醒醒神。人们有时说，你是哪一位的小表亲？”
        - id: ch01-b19
          speaker: narrator
          text: 博比咧嘴笑了。
        - id: ch01-b20
          speaker: bobby_coon
          text: “熊巴斯特。”
        - id: ch01-b21
          speaker: mother_nature
          text: “答对了。你是浣熊，不是熊，可你跟熊科确实有亲缘。大家看看博比留在那边的脚印。他的后脚掌会完整地印在地上，脚跟和脚趾都看得见，简直就是缩小了的巴斯特脚印。他走路拖拖沓沓，也很像巴斯特。”
        - id: ch01-b22
          speaker: mother_nature
          text: “谁也不会把博比认错。那条大而蓬松的尾巴上，绕着宽宽的黑灰条纹，只要他还拖着这条尾巴，就没人会认错他。这片辽阔国土上，只有另一种动物也长着这样的环纹尾巴。那是博比的一位亲戚，我过一会儿再告诉你们。博比这张两边脸颊乌黑的面孔，也是独一无二的。”
        - id: ch01-b23
          speaker: mother_nature
          text: “再看看他的身形。肩膀附近相当瘦小，臀部却又宽又沉，所以显得很笨拙。其实，他一点儿也不笨。腿虽然不长，却是个很好的跑手。只不过，不到非跑不可的时候，他才懒得跑。博比，你去布朗农夫的玉米地以前，待在什么地方？”
        - id: ch01-b24
          speaker: narrator
          text: 博比又低下了头，显然不愿回答。可老大自然妈妈非要他说，他只好脱口而出。
        - id: ch01-b25
          speaker: bobby_coon
          text: “我去了布朗农夫的鸡舍。”
        - id: ch01-b26
          speaker: mother_nature
          text: “去做什么？”
        - id: ch01-b27
          speaker: bobby_coon
          text: “没什么，只是随便看看。”
        - id: ch01-b28
          speaker: mother_nature
          text: “看什么呢？”
        - id: ch01-b29
          speaker: bobby_coon
          text: “我想，也许有只母鸡会落下一只她并不怎么在意的鸡蛋。”
        - id: ch01-b30
          speaker: mother_nature
          text: “博比，你为什么不肯承认自己是去偷鸡蛋的？还是说，你想捉一只鲜嫩的小鸡？前天夜里，你又去了哪里？”
          emotion: angry
        - id: ch01-b31
          speaker: narrator
          text: 话题终于换了，博比立刻松快起来。
        - id: ch01-b32
          speaker: bobby_coon
          text: “去了欢笑溪和微笑池塘。”
        - id: ch01-b33
          speaker: mother_nature
          text: “那儿总没有甜玉米、鸡蛋或小鸡吧？”
        - id: ch01-b34
          speaker: bobby_coon
          text: “没有。不过，我在欢笑溪的一汪小水潭里捉到三条小鱼，味道甜美极了。我还从泥里扒出几只蛤蜊，撬开了壳。那是我吃过最鲜嫩的蛤蜊。”
        - id: ch01-b35
          speaker: narrator
          text: 博比说着又咂了咂嘴。
        - id: ch01-b36
          speaker: bobby_coon
          text: “到了微笑池塘，我还痛痛快快地捉了好些小青蛙。我真爱吃青蛙。捉起来有趣，吃起来又香。”
        - id: ch01-b37
          speaker: mother_nature
          text: “我猜你早就盯上山毛榉和野葡萄藤了吧？”
        - id: ch01-b38
          speaker: narrator
          text: 老大自然妈妈带着几分打趣。博比的脸顿时亮了起来。
        - id: ch01-b39
          speaker: bobby_coon
          text: “那当然。今年秋天，山毛榉果和葡萄都会大丰收。哎呀，到时候一定好吃极了！”
          emotion: happy
        - id: ch01-b40
          speaker: narrator
          text: 老大自然妈妈笑了。
        - id: ch01-b41
          speaker: mother_nature
          text: “你可不大可能挨饿。连你都找不到足够的食物，日子一定艰难到了极点。其他伙伴也该知道，除了刚才说的东西，你还吃各种水果，其中也包括浆果。你也吃各式各样的昆虫、能够捉到的鸟儿、老鼠和乌龟。说到底，差不多凡是能吃的，你全吃，对食物从来不挑剔。”
        - id: ch01-b42
          speaker: mother_nature
          text: “不过，你吃东西时有个好习惯，其他伙伴也该学一学。你知道是什么吗？”
        - id: ch01-b43
          speaker: bobby_coon
          text: “不知道。除非您说的是洗食物。只要附近有水，我总会把吃的拿过去洗一洗。不知怎么，洗过以后就是更好吃。”
        - id: ch01-b44
          speaker: mother_nature
          text: “说的就是这个。我不止一次在月光下看见你蹲在欢笑溪边，把要吃的东西拿到水里洗。每回看见，我都很高兴，因为没有什么比干净整洁更好的了。博比，你今年养育孩子了吗？”
        - id: ch01-b45
          speaker: bobby_coon
          text: “孩子是浣熊太太养大的。我们有四个顶呱呱的小家伙，住在某一棵大空心树里。你们从没见过比他们更棒的孩子。如今，他们已经长大了不少，又活泼得很，每天夜里都会跟着母亲出去。”
        - id: ch01-b46
          speaker: bobby_coon
          text: “真希望今年秋天，猎人们能放过他们。只要想到孩子可能会遭遇不测，我心里就难受。要是他们能平安度过狩猎季节，我冬眠时会睡得更安心，浣熊太太也一样。”
          emotion: sad
        - id: ch01-b47
          speaker: narrator
          text: 听到这里，土拨鼠约翰尼一下竖起了耳朵。
        - id: ch01-b48
          speaker: johnny_chuck
          text: “博比，你会睡上一整个冬天吗？”
        - id: ch01-b49
          speaker: bobby_coon
          text: “不会睡完整个冬天，不过也会睡上很长一段。天气没有变得相当寒冷，食物也没有变得难找以前，我不会钻进窝里。可第一场雪一落下，我通常就准备睡觉了。我会在一棵大空心树里，把身子蜷在温暖的树叶床上。外面再冷，风雪再大，我都不在乎。”
        - id: ch01-b50
          speaker: bobby_coon
          text: “天气暖和时，我偶尔会醒来一两次，出去走一小圈，活动活动。不过我不会走远，很快就回来继续睡。”
        - id: ch01-b51
          speaker: peter_rabbit
          text: “猎犬鲍泽追你时，你怎么办？”
        - id: ch01-b52
          speaker: bobby_coon
          text: “先一直跑，跑到喘不过气。到了那时，要是我还没能骗过他，让他跟丢我的踪迹，我就爬到树上。谢天谢地，鲍泽不会爬树。有时几棵树靠得够近，我能从一棵树的树梢爬到另一棵，再爬到第三棵，甚至第四棵。猎人要是跟着鲍泽一路追来，这样也会被我骗过去。”
        - id: ch01-b53
          speaker: mother_nature
          text: “博比，你还有亲戚吗？”
        - id: ch01-b54
          speaker: bobby_coon
          text: “您刚才说起那个也长着环纹尾巴的家伙以前，我还不知道自己有亲戚。我从没听说谁的尾巴跟我的一样，真想知道他是什么样。”
        - id: ch01-b55
          speaker: mother_nature
          text: “严格说来，他不算浣熊，可论亲缘，谁也没有他和你这样亲近。那条同样带着环纹的尾巴就是证明。可除了尾巴，他没有一点儿像你。他叫环尾猫，模样却既不像猫，也不像你，而且和整个猫科都毫无亲缘。”
        - id: ch01-b56
          speaker: mother_nature
          text: “他有好几个名字，人们叫他蓬尾浣熊、灵猫、环尾猫、浣熊猫，还叫卡科米斯尔。他不像眼前的博比这样粗壮，看起来有些笨重，而是身形修长，相当纤细。他的外衣呈黄褐色，背上略带灰色，身体底下泛白。脑袋比较小，狭长而俊秀，耳朵大小适中，也长得很漂亮。有些地方，他看起来很像狐狸雷迪。”
        - id: ch01-b57
          speaker: mother_nature
          text: “不过，他身上真正漂亮的还是尾巴。那条尾巴差不多跟身体一样长，粗粗的，上面一圈圈黑白条纹又整齐又醒目。他动作迅速又优雅，和博比一样，更喜欢夜里出门活动。他也和博比一样，差不多什么都吃。肉食、爬行动物、水果、坚果和昆虫，找得到什么就吃什么。”
        - id: ch01-b58
          speaker: mother_nature
          text: “环尾猫生活在遥远的西南地区，也住在大西部的一些山区。人们为什么把他叫作灵猫，我实在猜不透，因为他既不是灵猫，也不是猫。他捕捉老鼠的本领很高，有时还会被人当作宠物养在家里，专门替他们捕鼠，就像布朗农夫养黑猫咪一样。”
        - id: ch01-b59
          speaker: mother_nature
          text: “好了，博比，你现在可以一路小跑着回家啦。只希望你吃下那么多青玉米以后，可别闹起肚子来。明天，我们再看看能从熊巴斯特身上学到些什么。”
