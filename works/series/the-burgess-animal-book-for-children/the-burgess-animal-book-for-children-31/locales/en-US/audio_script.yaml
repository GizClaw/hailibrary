audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm, observant storytelling
        timbre: clear and gentle
        pace: measured
        pitch: medium
    old_mother_nature:
      display_name: Old Mother Nature
      tts:
        delivery: kindly, assured, and practical
        timbre: warm and full
        pace: unhurried
        pitch: medium-low
    peter_rabbit:
      display_name: Peter Rabbit
      tts:
        delivery: curious and quick-spoken
        timbre: bright and youthful
        pace: lively
        pitch: medium-high
    bobby_coon:
      display_name: Bobby Coon
      tts:
        delivery: easygoing, candid, and slightly drowsy
        timbre: mellow and rounded
        pace: relaxed
        pitch: medium-low
    johnny_chuck:
      display_name: Johnny Chuck
      tts:
        delivery: earnest and inquisitive
        timbre: sturdy and youthful
        pace: moderate
        pitch: medium
  chapters:
    - id: ch01
      title: Bobby Coon Arrives
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Old Mother Nature was just about to begin school when a faint sound came from the Lone Little Path. Every eye turned that way. A strange-looking fellow was shuffling toward them, but one glance at his funny, sharp black-and-white face told everyone who he was.
        - id: ch01-b02
          speaker: peter_rabbit
          text: "Bobby Coon! Have you come to join our school?"
        - id: ch01-b03
          speaker: narrator
          text: Bobby came a little closer, sat up, and blinked sleepily. No one needed to be told that he had been out all night. He rubbed his eyes and gave a great yawn.
        - id: ch01-b04
          speaker: bobby_coon
          text: "Hello, everyone. I wish I felt as lively as you all look. I'd like to stay for school, but I'd probably fall asleep halfway through the lesson. I should have been home an hour ago, so you'll have to excuse me."
        - id: ch01-b05
          speaker: narrator
          text: Old Mother Nature pointed an accusing finger at him.
        - id: ch01-b06
          speaker: old_mother_nature
          text: "Bobby, you've been up to mischief. Admit it. You've been taking sweet, milky corn from Farmer Brown's field."
        - id: ch01-b07
          speaker: narrator
          text: Bobby dropped his head.
        - id: ch01-b08
          speaker: bobby_coon
          text: "I—I don't think that's stealing. The corn grows there, and why shouldn't I have some? I help myself to other food. Why not corn too?"
        - id: ch01-b09
          speaker: old_mother_nature
          text: "Because Farmer Brown planted that corn and cared for it. Without his planting, there would be no corn in that field, so it belongs to him. If it grew wild, you would have every right to eat it. This corn does not, so you have no right to take it. Stay away from that field, Bobby. Otherwise, one night Bowser the Hound will find you there, and you'll have to run for your life. Keep away from temptation."
        - id: ch01-b10
          speaker: bobby_coon
          text: "But it tastes so good. Nothing is better than sweet, milky corn, and Farmer Brown's field is the only place I can find it. He'll never notice the little bit I take."
        - id: ch01-b11
          speaker: narrator
          text: Bobby sighed and smacked his lips. Old Mother Nature shook her head and looked very grave.
        - id: ch01-b12
          speaker: old_mother_nature
          text: "That is no excuse at all. Listen carefully, Bobby. If you keep this up, you will certainly get into trouble. Farmer Brown might not care if you took only one or two ears, but you know you ruin far more corn than you eat. You sample one ear, decide the next may be better and sweeter, and try that one too. By the time you finish, you've spoiled a great deal and eaten very little. I think I'll punish you by keeping you here awhile. If you cannot stay awake, go sit beside Prickly Porky. He'll make sure you do."
        - id: ch01-b13
          speaker: bobby_coon
          text: "I—I think I can stay awake."
        - id: ch01-b14
          speaker: narrator
          text: Bobby opened his eyes as wide as he could, as though stretching his eyelids and holding them there might keep them open.
    - id: ch02
      title: A Little Cousin of Buster Bear
      blocks:
        - id: ch02-b01
          speaker: old_mother_nature
          text: "I'll help you stay awake with a few questions. People sometimes call you the little cousin of whom?"
        - id: ch02-b02
          speaker: narrator
          text: Bobby grinned.
        - id: ch02-b03
          speaker: bobby_coon
          text: "People call me the little cousin of Buster Bear."
        - id: ch02-b04
          speaker: old_mother_nature
          text: "Correct. A Raccoon is not a Bear, but you are related to the Bear family. Everyone, look at Bobby's tracks over there. His hind footprint shows the entire foot, from heel to toes. It looks much like Buster Bear's print made smaller. Bobby also shuffles along in nearly the same way that Buster walks."
        - id: ch02-b05
          speaker: old_mother_nature
          text: "No one could mistake Bobby for anybody else. As long as he carries that large, bushy tail with its broad rings of black and gray, there is no danger of that. Only one other animal in this whole country has a tail marked that way, and he is one of Bobby's relatives. I'll tell you about him later. No other animal has a face quite like Bobby's either, with those black cheeks."
        - id: ch02-b06
          speaker: old_mother_nature
          text: "Notice his shape too. He is rather narrow at the shoulders but large and heavy around the hips. That shape gives him a clumsy appearance, but appearances can fool you. Bobby is anything but clumsy. Even though his legs are not very long, he can run very well. He simply avoids running unless he must. Bobby, where were you before you visited Farmer Brown's cornfield?"
        - id: ch02-b07
          speaker: narrator
          text: Bobby hung his head again. It was quite clear that he did not want to answer this question. Old Mother Nature insisted, though, and would not let the matter go. At last, Bobby blurted out the truth.
        - id: ch02-b08
          speaker: bobby_coon
          text: "I was at Farmer Brown's henhouse."
        - id: ch02-b09
          speaker: old_mother_nature
          text: "What were you doing there?"
        - id: ch02-b10
          speaker: bobby_coon
          text: "Oh, I was only looking around."
        - id: ch02-b11
          speaker: old_mother_nature
          text: "Looking for what?"
        - id: ch02-b12
          speaker: bobby_coon
          text: "Well, I thought one of the Hens might have dropped an egg she didn't want."
        - id: ch02-b13
          speaker: old_mother_nature
          text: "Bobby, be honest. You went there hoping to steal eggs. Or were you hoping to catch a tender young Chicken? Where did you go the night before last?"
        - id: ch02-b14
          speaker: narrator
          text: Bobby answered at once, plainly glad to leave the henhouse behind.
        - id: ch02-b15
          speaker: bobby_coon
          text: "I went to the Laughing Brook and the Smiling Pool."
        - id: ch02-b16
          speaker: old_mother_nature
          text: "There was no sweet corn there, and no eggs or Chickens. What did you find?"
    - id: ch03
      title: Bobby's Many Meals
      blocks:
        - id: ch03-b01
          speaker: bobby_coon
          text: "I caught three wonderfully tasty little fish in a small pool in the Laughing Brook. I also found some of the most tender Clams I've ever eaten. I raked them out of the mud and opened them myself. Then I went down to the Smiling Pool and had great fun catching young Frogs. I surely like Frogs. Catching them is fine sport, and they make a fine meal too."
        - id: ch03-b02
          speaker: narrator
          text: Bobby smacked his lips again.
        - id: ch03-b03
          speaker: old_mother_nature
          text: "I suppose you've been watching the beech trees and the wild grapevines too."
        - id: ch03-b04
          speaker: narrator
          text: Bobby's face brightened.
        - id: ch03-b05
          speaker: bobby_coon
          text: "I certainly have! There will be plenty of beechnuts and grapes this fall. Just think how good they'll taste!"
          emotion: happy
        - id: ch03-b06
          speaker: narrator
          text: Old Mother Nature laughed.
        - id: ch03-b07
          speaker: old_mother_nature
          text: "There is very little danger of your going hungry. Times must be very hard indeed before you cannot find enough food. Besides everything we've named, you eat other fruits, including berries. You eat many kinds of insects, birds when you can catch them, Mice, Turtles, and almost anything else that can be eaten. You are certainly not fussy about your food."
        - id: ch03-b08
          speaker: old_mother_nature
          text: "Still, you have one good habit that some of these other little people ought to follow. Do you know which habit I mean?"
        - id: ch03-b09
          speaker: narrator
          text: Bobby shook his head.
        - id: ch03-b10
          speaker: bobby_coon
          text: "No. Unless you mean washing my food. If water is nearby, I like to carry my meal over and wash it. Somehow, it tastes better that way."
        - id: ch03-b11
          speaker: old_mother_nature
          text: "Exactly. More than once, I've watched you beside the Laughing Brook in the moonlight. You carry your food to the water and wash it before you eat. Seeing that has always pleased me, because there is nothing quite like cleanliness and neatness. Did you raise a family this year, Bobby?"
        - id: ch03-b12
          speaker: bobby_coon
          text: "Mrs. Coon raised them. We had four of the finest youngsters you could ever see, in a certain large hollow tree. They're growing big and lively now, and every night they go out with their mother. I truly hope the hunters leave them alone this fall. I hate thinking that something might happen to any of them. If they can only make it safely through hunting season, I'll enjoy my winter sleep much more, and I know Mrs. Coon will too."
          emotion: fearful
    - id: ch04
      title: Winter Sleep and a Quick Escape
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: Johnny Chuck's ears pricked up.
        - id: ch04-b02
          speaker: johnny_chuck
          text: "Do you sleep through the whole winter, Bobby?"
        - id: ch04-b03
          speaker: bobby_coon
          text: "Not the whole winter, but much of it. I don't settle down until the weather turns quite cold and food becomes hard to find. After the first snow, I'm usually ready for bed. I curl up in a warm nest of leaves inside a certain large hollow tree. Once I'm there, I don't care how cold or stormy the weather becomes."
        - id: ch04-b04
          speaker: bobby_coon
          text: "Sometimes mild weather wakes me once or twice. I take a short walk for exercise, but I never go far. Before long, I'm back asleep."
        - id: ch04-b05
          speaker: peter_rabbit
          text: "What do you do when Bowser the Hound chases you?"
        - id: ch04-b06
          speaker: bobby_coon
          text: "First, I run until I'm out of breath. By then, I may have tricked him so completely that he loses my trail. If I haven't, I climb a tree. Thank goodness Bowser cannot climb after me."
        - id: ch04-b07
          speaker: bobby_coon
          text: "When the branches are close enough, I sometimes climb from the top of one tree into the top of another. I may keep going into a third tree and then a fourth. That confuses the hunters if they're following Bowser on my trail."
        - id: ch04-b08
          speaker: old_mother_nature
          text: "Do you have any relatives, Bobby?"
        - id: ch04-b09
          speaker: bobby_coon
          text: "I didn't think I did until you mentioned that other fellow with a ringed tail. I never knew anyone else had a tail like mine. I'd like to hear about him."
    - id: ch05
      title: The Ring-tailed Cat
      blocks:
        - id: ch05-b01
          speaker: old_mother_nature
          text: "He is not exactly a Raccoon, but he is more closely related to you than any other animal. His tail shows the connection. Apart from that, he is nothing like you. He is called the Ring-tailed Cat, though he looks no more like a Cat than he looks like you. In fact, he does not belong to the Cat family at all."
        - id: ch05-b02
          speaker: old_mother_nature
          text: "He has several names. People call him the Bassaris, the Civet Cat, the Ring-tailed Cat, the Coon Cat, and the Cacomixtle. Instead of being thick and clumsy-looking like Bobby, this animal has a long, rather slender body. His coat is yellowish brown. The fur looks somewhat gray along his back and turns whitish underneath."
        - id: ch05-b03
          speaker: old_mother_nature
          text: "His head is rather small, long, and beautifully formed, and his good-sized ears are very pretty. In some ways, he resembles Reddy Fox. But his tail is the truly beautiful part. It is nearly as long as his whole body. It is thick, and it carries striking bands of black and white from end to end."
        - id: ch05-b04
          speaker: old_mother_nature
          text: "He is quick and graceful whenever he moves. Like Bobby, he prefers to be out at night. Also like Bobby, he eats nearly anything he can find. His food includes flesh, reptiles, fruit, nuts, and insects. He makes his home in the Far Southwest and in some of the mountains of the Far West."
        - id: ch05-b05
          speaker: old_mother_nature
          text: "Why anyone calls him a Civet Cat, I cannot imagine. He is neither a Civet nor a Cat. He is very clever at catching Mice. Sometimes people even keep him as a pet. He catches the Mice around their homes, just as Farmer Brown keeps Black Pussy to catch Mice around his home."
        - id: ch05-b06
          speaker: old_mother_nature
          text: "Now, Bobby, you may trot home. I hope all that green corn you ate does not give you a stomachache. Tomorrow, we will learn what we can about Buster Bear."
