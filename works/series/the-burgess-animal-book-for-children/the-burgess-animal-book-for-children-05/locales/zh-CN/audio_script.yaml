audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 亲切生动，带着温和的幽默感
        timbre: 温暖清亮
        pace: 舒缓而富有变化
        pitch: 中等
    peter_rabbit:
      display_name: 彼得兔
      tts:
        delivery: 好奇直率，情绪来得快也去得快
        timbre: 清脆稚气
        pace: 轻快
        pitch: 中高
    jumper_hare:
      display_name: 长耳野兔跳跳
      tts:
        delivery: 朴实腼腆，认真时透着好奇
        timbre: 清朗柔和
        pace: 稍缓
        pitch: 中等
    mother_nature:
      display_name: 老大自然妈妈
      tts:
        delivery: 慈爱睿智，说话从容而坦率
        timbre: 温厚柔和
        pace: 从容
        pitch: 中低
    happy_jack:
      display_name: 灰松鼠快乐杰克
      tts:
        delivery: 自信好胜，受窘时有些急躁
        timbre: 明亮爽脆
        pace: 轻快
        pitch: 中高
    chatterer:
      display_name: 红松鼠喋喋
      tts:
        delivery: 伶牙俐齿，争强好胜又活泼
        timbre: 尖细清亮
        pace: 明快
        pitch: 高
    johnny_chuck:
      display_name: 土拨鼠约翰尼
      tts:
        delivery: 慢吞吞又有些懒散，遇到怪事时直来直去
        timbre: 浑厚朴实
        pace: 稍缓
        pitch: 中低
  chapters:
    - id: ch01
      title: 第五章　树松鼠
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 彼得兔一路匆匆赶来，已经喘得上气不接下气。他看见土拨鼠约翰尼坐在自家门口，正舒舒服服地晒太阳，便急着问他。
        - id: ch01-b02
          speaker: peter_rabbit
          text: “约翰尼，你知道吗？你原来是一只松鼠！”
        - id: ch01-b03
          speaker: narrator
          text: 约翰尼慢慢转过头，盯着彼得看了半天，仿佛彼得忽然发了疯。
        - id: ch01-b04
          speaker: johnny_chuck
          text: “彼得兔，你在说什么呀？我不是松鼠，我明明是土拨鼠。”
        - id: ch01-b05
          speaker: peter_rabbit
          text: “可土拨鼠就在松鼠家族里，所以你还是松鼠。老大自然妈妈亲口说的，她说是，就一定不会错。你也来上课吧，好好认识一下自己的亲戚。”
        - id: ch01-b06
          speaker: narrator
          text: 约翰尼眨巴着眼睛，一两分钟都说不出话。要是彼得真没听错，自己当然就是松鼠家族的一员，可这也太叫人难以相信了。过了好一会儿，他才问。
        - id: ch01-b07
          speaker: johnny_chuck
          text: “你说的到底是什么课？”
        - id: ch01-b08
          speaker: narrator
          text: 彼得赶紧把事情讲给他听。他把自己和跳跳学到的家族知识全说了一遍，也把老大自然妈妈讲过的那些松鼠家族的稀奇事告诉了约翰尼。讲到最后，他又一次劝约翰尼加入，还答应第二天早晨来叫他。
        - id: ch01-b09
          speaker: narrator
          text: 可约翰尼很懒，也不喜欢走得离家太远。第二天彼得来叫他，费尽口舌也没能让他动身。彼得怕自己迟到，漏听什么新鲜事，没有浪费时间继续争。他赶到绿森林时，跳跳、喋喋和快乐杰克早已等在那里。彼得一到，老大自然妈妈就开始上课。
        - id: ch01-b10
          speaker: mother_nature
          text: “快乐杰克，今天先由你来说。你对表亲喋喋知道多少，全都讲给大家听听。”
        - id: ch01-b11
          speaker: happy_jack
          text: “先说个头吧。喋喋是树松鼠里最小的，比花栗鼠条纹大不了多少，连我的一半大都不到。他穿红外套、白背心，尾巴只有身体的三分之二长。那条尾巴扁倒是扁，可一点儿也不宽。依我看，实在算不得什么好尾巴。”
        - id: ch01-b12
          speaker: narrator
          text: 喋喋的急脾气一下就蹿了起来，张嘴便骂。老大自然妈妈让他安静，示意快乐杰克接着说。
        - id: ch01-b13
          speaker: happy_jack
          text: “他待在树上的时间比我长，尤其喜欢松树和其他结球果的树。他也比我更喜欢绿森林深处。不过到了森林边上，他照样自在，尤其是附近有农场、能让他偷到玉米的时候。”
        - id: ch01-b14
          speaker: narrator
          text: 喋喋又想开骂，又被老大自然妈妈制止了。快乐杰克倒像从来没被打断一样，继续往下讲。
        - id: ch01-b15
          speaker: happy_jack
          text: “有一点我得承认，喋喋很会储存食物。他爱吃球果树木的种子，总在球果快熟时把它们咬下来。球果落到地上，成熟后自己张开，他就很容易拿到种子。他常有好几个储藏室，球果种子、橡子、坚果和玉米，只要能弄到，他都往里存。”
        - id: ch01-b16
          speaker: happy_jack
          text: “他用树叶和一条条树皮筑窝，有时住树洞，有时把窝搭在常青树高高的枝丫间。他很会从一棵树跳到另一棵树。不过他还爱管闲事，哪儿不该去，他偏要把鼻子伸进去。我的储藏室只要被他找到，他就来偷。”
        - id: ch01-b17
          speaker: chatterer
          text: “你逮到机会也会偷我的！只不过你很少逮得到罢了。”
          emotion: angry
        - id: ch01-b18
          speaker: narrator
          text: 快乐杰克干脆转过身，背对着喋喋，继续数落他。
        - id: ch01-b19
          speaker: happy_jack
          text: “只要太阳还照着，他根本不在乎天气有多冷。冬天最冷的日子里，也能听见他吵吵嚷嚷。他是绿森林里最无礼、最放肆的家伙，就爱给别人找麻烦。见了谁都挖苦，见了谁都骂，一张嘴还要甩尾巴。他就是喜欢争吵。”
        - id: ch01-b20
          speaker: happy_jack
          text: “这还不是最坏的。春天鸟儿筑巢时，他会变成强盗，到处寻找鸟巢。他偷鸟蛋，甚至咬死雏鸟吃掉。鸟儿们全都恨他，我一点儿也不怪它们。”
        - id: ch01-b21
          speaker: narrator
          text: 喋喋再也忍不住了。他那张嘴快得像要飞起来，尾巴也甩得又猛又急，彼得差点以为那条尾巴会被他生生甩断。喋喋把能想到的所有难听称呼全扔给快乐杰克，自己也越骂越气。老大自然妈妈费了好一阵子，才把他安抚下来。
        - id: ch01-b22
          speaker: narrator
          text: 最后，喋喋喘不过气，只好住嘴。老大自然妈妈的声音严厉极了。
        - id: ch01-b23
          speaker: mother_nature
          text: “喋喋，我真替你害臊。可惜，快乐杰克说的都是真的。你的许多做法让绿森林蒙羞。可话说回来，要是没有你，我还真不知道绿森林该怎么办。快乐杰克没有说，你有时也吃昆虫，还会在地下设一个储藏室。现在轮到你了，把你知道的快乐杰克讲出来。”
        - id: ch01-b24
          speaker: narrator
          text: 喋喋闷闷不乐地待了几分钟。他不敢违抗老大自然妈妈，只好小声嘟囔。
        - id: ch01-b25
          speaker: chatterer
          text: “反正我不知道他有什么好事。”
        - id: ch01-b26
          speaker: happy_jack
          text: “那你也找不出我有多少坏事！”
          emotion: angry
        - id: ch01-b27
          speaker: narrator
          text: 老大自然妈妈抬起一只手，警告他们别再吵。
        - id: ch01-b28
          speaker: mother_nature
          text: “够了。喋喋，你接着说。”
        - id: ch01-b29
          speaker: narrator
          text: 喋喋狠狠瞪了快乐杰克一眼，这才开口。
        - id: ch01-b30
          speaker: chatterer
          text: “快乐杰克比我大两倍还不止，可我才不怕他。他除了肚子下面是白的，浑身都是灰的。他那条尾巴大得吓人，自己还宝贝得不得了，逮着机会就显摆。他坐起来时，总把两只手叠在胸前。也许天冷时这样能给手取暖，要不然我真想不出他为什么这么做。”
        - id: ch01-b31
          speaker: chatterer
          text: “他筑的窝和我的很像，有时放在树洞里，也常常搭在树枝间。他很会在树梢来往，不过也常到地面上活动。他最爱开阔的林地，那里要是长着很多坚果树，就更合他的心意。”
        - id: ch01-b32
          speaker: chatterer
          text: “他有储藏室，里面存着过冬的坚果，可他埋在地下和落叶下面的更多。冬天饿了，他就去把它们找出来。哪怕盖着雪，也不知道他怎么总能找到。说到偷东西，他不比我好。我看见过他偷鸟蛋。我的储藏室要是没人看着，绝不能让他靠近。”
        - id: ch01-b33
          speaker: narrator
          text: 这回轮到快乐杰克生气了。
        - id: ch01-b34
          speaker: happy_jack
          text: “我偶然碰见鸟蛋时，也许拿过几颗。可我从来不专门去找，除非饿得厉害，又实在找不到别的东西，我才会拿。我不像你，把抢鸟儿当成天天要干的事，这一点你心里明白。”
        - id: ch01-b35
          speaker: happy_jack
          text: “就算我从你的储藏室拿东西，也只是取回被你偷走的那一份。大家都喜欢我，你可不敢这么说自己。”
        - id: ch01-b36
          speaker: mother_nature
          text: “到此为止！”
          emotion: angry
        - id: ch01-b37
          speaker: narrator
          text: 老大自然妈妈的声音尖厉起来。
        - id: ch01-b38
          speaker: mother_nature
          text: “你们两个表亲从来合不来，恐怕以后也不会。只要还做邻居，大概就会一直争吵。喋喋，快乐杰克的事，你都说完了吗？”
        - id: ch01-b39
          speaker: narrator
          text: 喋喋点点头，却还在气呼呼地低声咕哝，连一句像样的回答都不肯说，实在很没礼貌。老大自然妈妈没有理会他的态度。
        - id: ch01-b40
          speaker: mother_nature
          text: “你刚才说到的那些都没有错。你说快乐杰克只有肚子下面是白的，其他地方全是灰色。灰松鼠通常确实如此，可有些灰松鼠一点儿也不灰，反倒浑身都是黑色。”
        - id: ch01-b41
          speaker: narrator
          text: 彼得听到这件怪事，惊得两只耳朵笔直竖了起来，马上追问老大自然妈妈。
        - id: ch01-b42
          speaker: peter_rabbit
          text: “灰松鼠怎么可能是黑色的？”
          emotion: surprised
        - id: ch01-b43
          speaker: mother_nature
          text: “问得好，彼得。灰松鼠只是快乐杰克这个家族的名字。有些宝宝出生时穿着黑外套，不是灰外套。它们当然还是同一种松鼠，只是模样不同。这个国家有些地方住着许多黑色的灰松鼠，很多人把它们当成另一种松鼠。记住，它们并不是，只是快乐杰克家族里穿黑外套的成员。”
        - id: ch01-b44
          speaker: mother_nature
          text: “狐松鼠锈锈的家族也一样。有的是锈红色，有的红灰相间，还有的像快乐杰克那么灰。在阳光灿烂的南方，狐松鼠的鼻子和耳朵总是白色，可在北方，从来不会这样。”
        - id: ch01-b45
          speaker: mother_nature
          text: “锈锈只比快乐杰克大一点儿，也有同样漂亮的尾巴。他是树松鼠里最强壮、最沉重的，动作远没有快乐杰克那么迅捷优美。有时候，他会在同一棵树上筑两个窝。坏天气时住树洞里的窝，好天气时住在外面树枝间用细枝和树叶搭成的窝。”
        - id: ch01-b46
          speaker: mother_nature
          text: “锈锈的习性和快乐杰克差不多，喜欢的环境也一样。他们两位都帮了我很大的忙。”
        - id: ch01-b47
          speaker: narrator
          text: 大家都露出惊讶的神情，老大自然妈妈便把缘故告诉他们。
        - id: ch01-b48
          speaker: mother_nature
          text: “快乐杰克和锈锈埋下的坚果，比他们自己需要的多得多。没被挖出来的坚果，到了春天就会发芽长大。他们根本不知道，自己已经种下了许许多多的树。”
        - id: ch01-b49
          speaker: mother_nature
          text: “喋喋，下次你想和快乐杰克吵架，可别忘了这件事。你吃到的那些最肥美、最好吃的山核桃，说不定就来自快乐杰克那位老老老老祖父种下的树呢。”
        - id: ch01-b50
          speaker: mother_nature
          text: “西部遥远的群山里，你还有一位表亲，叫道格拉斯松鼠。他是真正的红松鼠，习性和你很像，也有人叫他松林松鼠。对了，快乐杰克还漏了一件事。喋喋，你很会游泳，也许他压根不知道。”
        - id: ch01-b51
          speaker: narrator
          text: 看快乐杰克脸上的表情就知道，他确实毫不知情。
        - id: ch01-b52
          speaker: chatterer
          text: “我当然会游泳！我一点儿也不怕水。真有必要，我能一口气游很远。”
        - id: ch01-b53
          speaker: narrator
          text: 彼得听说喋喋会游泳，和当初得知自己的某位表亲是游泳好手时一样惊讶。这份惊讶慢慢变成了一种新的感觉，他心里甚至开始有点佩服喋喋了。
        - id: ch01-b54
          speaker: jumper_hare
          text: “还有别的树松鼠吗？”
        - id: ch01-b55
          speaker: mother_nature
          text: “还有两种，也是整个家族里最漂亮的。它们住在遥远的西南部，那里有一处叫大峡谷的地方，是这片辽阔土地上最奇妙的地方之一。一种叫艾伯特松鼠，另一种叫凯巴布松鼠。”
        - id: ch01-b56
          speaker: mother_nature
          text: “它们和快乐杰克、锈锈差不多大，尾巴却更宽、更漂亮，耳朵上还长着一簇簇长毛。艾伯特松鼠耳朵乌黑，背部棕褐，两侧灰色，腹部白色。凯巴布松鼠耳朵棕褐，耳尖黑色，尾巴大部分是白色。它们都漂亮极了，可家族成员不多，所以很少有人认识。”
        - id: ch01-b57
          speaker: narrator
          text: 这堂课讲到这里，老大自然妈妈便宣布当天放学。
