  chapters:
    - id: ch01
      title: The Squirrels of the Trees
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Peter Rabbit hurried up to Johnny Chuck's doorstep and found Johnny sitting there in the sun. Peter was so out of breath he could hardly get the words out.
        - id: ch01-b02
          speaker: peter_rabbit
          text: "Johnny Chuck, did you know you're a Squirrel?"
        - id: ch01-b03
          speaker: narrator
          text: Johnny slowly turned his head. He stared at Peter as if Peter had suddenly lost his senses.
        - id: ch01-b04
          speaker: johnny_chuck
          text: "What in the world are you talking about? I'm no Squirrel. I'm a Woodchuck."
        - id: ch01-b05
          speaker: peter_rabbit
          text: "That doesn't change it. Woodchucks are part of the Squirrel family. Old Mother Nature told us, so it has to be true. You ought to come to our school and learn something about your own relations."
        - id: ch01-b06
          speaker: narrator
          text: Johnny blinked. For a minute or two, he couldn't think of a single word. If Peter truly had heard this from Old Mother Nature, then Johnny must belong to the Squirrel family. Still, it was very hard to believe.
        - id: ch01-b07
          speaker: johnny_chuck
          text: "What school do you mean?"
        - id: ch01-b08
          speaker: narrator
          text: Peter quickly explained what the school was. He told Johnny all that he and Jumper the Hare had learned about Rabbits and Hares. Then he repeated the surprising things Old Mother Nature had already taught them about the Squirrel family. When he finished, Peter again urged Johnny to join the school. He promised to stop for him the next morning so they could go together.
        - id: ch01-b09
          speaker: narrator
          text: But Johnny was lazy and disliked going far from his doorstep. When Peter came for him the next day, Johnny refused to go, no matter what Peter said. Peter did not spend long arguing. He was afraid of arriving late and missing something.
        - id: ch01-b10
          speaker: narrator
          text: At the Green Forest, Peter found Jumper the Hare, Chatterer the Red Squirrel, and Happy Jack the Gray Squirrel already waiting. Old Mother Nature began the lesson as soon as he arrived.
        - id: ch01-b11
          speaker: old_mother_nature
          text: "Happy Jack, tell us everything you know about your cousin Chatterer."
        - id: ch01-b12
          speaker: happy_jack_gray_squirrel
          text: "First of all, he's the smallest Tree Squirrel. He's not much bigger than Striped Chipmunk, so he isn't even half my size. His coat is red, and his waistcoat is white. His flat tail is about two-thirds as long as his body, but it isn't very wide. If you ask me, it isn't much of a tail."
        - id: ch01-b13
          speaker: narrator
          text: Chatterer's quick temper flared at once, and he began to scold. Old Mother Nature quieted him and told Happy Jack to continue.
        - id: ch01-b14
          speaker: happy_jack_gray_squirrel
          text: "Chatterer spends more time in trees than I do. He especially likes pines and other trees that grow cones. He prefers the deeper Green Forest, though he's also at home along its edge. That's especially true near a farm where he can steal corn."
        - id: ch01-b15
          speaker: narrator
          text: Chatterer tried to scold again. Once more, Old Mother Nature stopped him. Happy Jack went right on as though nothing had happened.
        - id: ch01-b16
          speaker: happy_jack_gray_squirrel
          text: "I will admit that Chatterer saves food carefully. He loves seeds from cone-bearing trees. Just before the cones ripen, he cuts them down. The cones lie on the ground until they ripen and open, and then he can reach the seeds easily. He often has several storehouses, where he saves cone seeds, acorns, nuts, and any corn he can get. His nest is made from leaves and strips of bark. Sometimes he puts it inside a hollow tree. Sometimes he builds it high in the branches of an evergreen. He's a fine jumper and can leap from one tree to another. But he's also a busybody. He is always poking his nose where it doesn't belong, and he steals from my stores whenever he can find them."
        - id: ch01-b17
          speaker: chatterer_red_squirrel
          text: "You steal from me whenever you get the chance! That doesn't happen often."
          emotion: angry
        - id: ch01-b18
          speaker: narrator
          text: Happy Jack turned his back on Chatterer and kept talking.
        - id: ch01-b19
          speaker: happy_jack_gray_squirrel
          text: "Cold weather doesn't seem to bother him if the sun is out. You can hear that noisy tongue even on the coldest winter days. He's the sauciest, most impudent fellow in the Green Forest. Nothing pleases him more than making trouble. He scolds everyone he meets, and his tail jerks whenever his mouth opens. He'll quarrel with anybody. Then spring comes, the birds begin nesting, and he becomes a robber. He hunts for nests, steals the eggs, and even kills and eats the baby birds. Every bird hates him. I can't blame them."
        - id: ch01-b20
          speaker: narrator
          text: Chatterer could stand no more. His tongue flew faster and faster, and his tail jerked so hard that Peter almost expected it to break right off. Chatterer called Happy Jack every bad name he could think of, then searched for more. He worked himself into such a terrible rage that Old Mother Nature needed a long time to quiet him.
        - id: ch01-b21
          speaker: narrator
          text: At last Chatterer ran out of breath and stopped. Old Mother Nature spoke in a very severe voice.
        - id: ch01-b22
          speaker: old_mother_nature
          text: "Chatterer, I am ashamed of you. I'm sorry to say that Happy Jack told the truth. In many ways, you are a disgrace to the Green Forest. Even so, I don't know how the forest could manage without you. Happy Jack left out two things. You sometimes eat insects, and you sometimes keep a storehouse underground. Now tell us what you know about Happy Jack."
          emotion: angry
        - id: ch01-b23
          speaker: narrator
          text: Chatterer sulked for a few minutes, but he did not dare disobey Old Mother Nature.
        - id: ch01-b24
          speaker: chatterer_red_squirrel
          text: "I can't think of much that's good about him."
        - id: ch01-b25
          speaker: happy_jack_gray_squirrel
          text: "And you can't think of much that's bad about me, either."
          emotion: angry
        - id: ch01-b26
          speaker: narrator
          text: Old Mother Nature raised a warning hand.
        - id: ch01-b27
          speaker: old_mother_nature
          text: "That is enough. Go on, Chatterer."
        - id: ch01-b28
          speaker: chatterer_red_squirrel
          text: "Happy Jack is more than twice my size, but I'm not afraid of him. He's gray except for the white fur underneath. His tail is enormous, and he's so proud of it that he shows it off every chance he gets. When he sits up, he folds his hands over his breast. Maybe he does it to keep them warm when the weather is cold. His nest is much like mine. He may build it in a hollow tree or out among the branches. He travels well through the treetops, though he also spends plenty of time on the ground. He likes open woods best, especially where nut trees grow."
        - id: ch01-b29
          speaker: chatterer_red_squirrel
          text: "He keeps a supply of nuts in a storehouse for winter. But he buries even more of them in the ground and under fallen leaves. When winter comes and he gets hungry, he goes looking for the buried nuts. Somehow, he manages to find them even when snow covers the ground. And when it comes to stealing, he is no better than I am. I've seen him take birds' eggs, and I wouldn't trust him alone for a moment near one of my storehouses."
        - id: ch01-b30
          speaker: narrator
          text: Now it was Happy Jack's turn to be indignant.
        - id: ch01-b31
          speaker: happy_jack_gray_squirrel
          text: "Perhaps I've taken a few eggs when I happened to find them. I don't hunt for eggs, though, and I only take one if I'm very hungry and can't find other food. I don't make a habit of robbing birds the way you do. You know that. If I find one of your storehouses and take something, I'm only taking back what you stole from me. Everybody loves me. You certainly can't say that."
          emotion: angry
        - id: ch01-b32
          speaker: old_mother_nature
          text: "Enough! You two cousins have never agreed, and I'm afraid you never will. As long as you live near each other, I expect you'll quarrel. Chatterer, have you told us everything you know about Happy Jack?"
          emotion: angry
        - id: ch01-b33
          speaker: narrator
          text: Chatterer nodded. He was still muttering angrily and was not polite enough to answer. Old Mother Nature ignored his bad manners.
        - id: ch01-b34
          speaker: old_mother_nature
          text: "What you've told us is good as far as it goes. You said Happy Jack is gray except underneath. Most Gray Squirrels do look just as you described. But sometimes a Gray Squirrel isn't gray at all. Sometimes one is completely black."
        - id: ch01-b35
          speaker: narrator
          text: Peter's ears stood straight up in astonishment.
        - id: ch01-b36
          speaker: peter_rabbit
          text: "How could a Gray Squirrel possibly be black?"
          emotion: surprised
        - id: ch01-b37
          speaker: narrator
          text: Old Mother Nature smiled.
        - id: ch01-b38
          speaker: old_mother_nature
          text: "That's a fair question, Peter. Gray Squirrel is simply the name of Happy Jack's family. Some babies in that family are born with black coats instead of gray ones. They are still the same kind of Squirrel. They only look different. In some parts of the country, many Gray Squirrels have black coats, so people often think they belong to another kind. They don't. They are black-coated members of Happy Jack's own family."
        - id: ch01-b39
          speaker: old_mother_nature
          text: "The same thing happens in Rusty the Fox Squirrel's family. Some members are rusty red. Some have both red and gray fur. Others are as gray as Happy Jack himself. Far down in the Sunny South, Fox Squirrels always have white noses and white ears. In the North, their noses and ears are never white. Rusty is a little bigger than Happy Jack and has a tail just as handsome. He is the strongest and heaviest of all the Tree Squirrels, though he is not nearly so quick or graceful as Happy Jack."
        - id: ch01-b40
          speaker: old_mother_nature
          text: "Sometimes Rusty keeps two different nests in the same tree. One is tucked inside a hollow, where he can use it during bad weather. The other is built outside among the branches. It is made of sticks and leaves, and he uses that one when the weather is fine. Rusty's habits are much like Happy Jack's, so he chooses the same sort of surroundings. Like his cousin Happy Jack, Rusty is a great help to me."
        - id: ch01-b41
          speaker: narrator
          text: Everyone looked surprised, so Old Mother Nature explained what she meant.
        - id: ch01-b42
          speaker: old_mother_nature
          text: "Happy Jack and Rusty bury far more nuts than they could ever need for food. They never return to dig up all of them. When spring comes, the nuts left behind sprout, and in time they grow into trees. That is how these Squirrels plant a great many trees without even knowing it. Remember that the next time you feel like quarreling with Happy Jack, Chatterer. The very tree where you find your finest, fattest hickory nuts may have been planted long ago by one of Happy Jack's ever-so-great grandfathers."
        - id: ch01-b43
          speaker: old_mother_nature
          text: "You also have a cousin far away in the western mountains. He's called the Douglas Squirrel, though some people call him the Pine Squirrel. He is a true Red Squirrel, and his habits are much like yours. Oh, and Happy Jack forgot to tell us that you're a good swimmer. Perhaps he didn't know."
        - id: ch01-b44
          speaker: narrator
          text: The look on Happy Jack's face made it clear that he had not known.
        - id: ch01-b45
          speaker: chatterer_red_squirrel
          text: "Of course I can swim. Water doesn't bother me at all. If I need to, I can swim a long way."
        - id: ch01-b46
          speaker: narrator
          text: Peter was as surprised by this as he had been when he learned that one of his own cousins could swim well. He began to feel something very much like respect for Chatterer.
        - id: ch01-b47
          speaker: jumper_hare
          text: "Are there any more Tree Squirrels?"
        - id: ch01-b48
          speaker: old_mother_nature
          text: "Yes. There are two more, and they are the handsomest Squirrels in the whole family. They live far away in the Southwest, in one of the most wonderful places in this entire land. That place is called the Grand Canyon. One is the Abert Squirrel, and the other is the Kaibab Squirrel. They are about the same size as Happy Jack and Rusty. But their tails are broader and even handsomer, and long tufts of hair rise from their ears."
        - id: ch01-b49
          speaker: old_mother_nature
          text: "The Abert Squirrel has black ears, a brown back, gray sides, and white fur underneath. Kaibab has brown ears with black tips, and his tail is mostly white. Both are beautiful, but their families are small, so few people know them."
        - id: ch01-b50
          speaker: narrator
          text: With that, Old Mother Nature dismissed school for the day.
