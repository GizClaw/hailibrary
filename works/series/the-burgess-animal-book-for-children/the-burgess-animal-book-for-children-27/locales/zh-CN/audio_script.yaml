audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 亲切生动，带着温和的幽默感
        timbre: 温暖清亮
        pace: 舒缓而富有变化
        pitch: 中等
    mother_nature:
      display_name: 老大自然妈妈
      tts:
        delivery: 慈爱睿智，说话从容而坦率
        timbre: 温厚柔和
        pace: 从容
        pitch: 中低
    peter_rabbit:
      display_name: 彼得兔
      tts:
        delivery: 好奇直率，情绪来得快也去得快
        timbre: 清脆稚气
        pace: 轻快
        pitch: 中高
    reddy_fox:
      display_name: 雷迪狐狸
      tts:
        delivery: 狡猾强硬，话里带着威吓
        timbre: 略粗而尖
        pace: 稍慢
        pitch: 中低
    chatterer:
      display_name: 红松鼠喋喋
      tts:
        delivery: 伶牙俐齿，争强好胜又活泼
        timbre: 尖细清亮
        pace: 明快
        pitch: 高
  chapters:
    - id: ch01
      title: 第二十七章　红狐雷迪来上学
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 第二天早晨，老大自然妈妈宣布上课，一个学生也没有缺席。除了臭鼬吉米和豪猪刺刺，大家过日子时都得时时想着红狐雷迪。就连住在树上的灰松鼠快乐杰克和红松鼠喋喋，也有好多次差点儿成了他的晚餐。约翰尼、彼得、跳跳、条纹、丹尼和白足更是如此。不论白天还是夜里，几乎每个钟头都得提防他，因为只要忘记雷迪几分钟，就可能丢掉性命。
        - id: ch01-b02
          speaker: narrator
          text: 大家刚刚坐舒服，准备听早晨的课，红狐雷迪忽然从一棵树后走了出来。可想而知，小居民们全吓坏了。从来没有哪所学校散得这样快，只一眨眼，老大自然妈妈身边便空了。地上只剩下雷迪和吉米，树上还留着刺刺、快乐杰克和喋喋。雷迪看起来很不自在。
        - id: ch01-b03
          speaker: reddy_fox
          text: “我可不是故意来搅散课堂的。要不是您叫我，我根本想不到要来。”
        - id: ch01-b04
          speaker: mother_nature
          text: “我没告诉大家要请你来，雷迪。消息要是提前传出去，今天早晨恐怕一个学生也不会出现。我只答应给他们一个惊喜，看来谁也没猜中。你先坐到孤独小径旁边那截老树桩那里去。”
        - id: ch01-b05
          speaker: narrator
          text: 老大自然妈妈叫出每一个逃走的小居民，命令他们马上回来。她说得严厉极了，谁也不敢违抗。大家从各式各样的藏身处一个接一个慢慢露面，一边往回走，一边害怕地瞟着雷迪。最后，他们尽可能紧紧挤到老大自然妈妈身边。这时，她的声音才重新柔和下来。
        - id: ch01-b06
          speaker: mother_nature
          text: “你们真叫我失望。难道你们以为，我会眼看着谁受到伤害吗？雷迪是我请来的。我不准他离开，他就会老老实实坐在那里，绝不会伤害任何一个。我们先说几件关于他的事，再看看你们自己学到了多少。”
        - id: ch01-b07
          speaker: mother_nature
          text: “雷迪和猎犬鲍泽看着不像亲戚，其实都属于犬科，而且亲缘很近。嚎叫狼和老郊狼也在这个家族里，所以他们全是表亲。你们现在就仔细看看雷迪，从脑袋看到尾巴。他就像一条小狗，披着漂亮的红外套，穿着白背心和黑鞋子，还拖着蓬松的大尾巴。彼得，在场的人里，你对雷迪的了解大概不比谁少，至少理该如此。你为了不落进他的爪子，究竟摸清了些什么？讲来听听吧。”
        - id: ch01-b08
          speaker: narrator
          text: 彼得挠挠一只长耳朵，斜眼看了看雷迪，开始讲起自己的老对头。
        - id: ch01-b09
          speaker: peter_rabbit
          text: “我当然该知道一点儿。妈妈最早叫我提防的就是雷迪。她说，他特别爱吃小兔子，又是我那些敌人里最狡猾、最聪明、最可怕的一个。后来我才知道，妈妈说得一点儿不错。”
        - id: ch01-b10
          speaker: narrator
          text: 约翰尼、丹尼和白足听得连连点头。彼得又说了下去。
        - id: ch01-b11
          speaker: peter_rabbit
          text: “雷迪主要靠捕猎过活，可他自己也受人捕猎，所以脑筋非快不可。他不追我，就去追丹尼、白足、条纹、松鸡太太或山齿鹑鲍勃。有时，他想偷布朗农夫家的鸡。有时，他在微笑池塘边捉青蛙，或者到绿草原上捉蚱蜢。只要能抓到，差不多什么都能给他当食物。我想，除了这些会跑会跳的东西，他大概什么也不吃吧。”
        - id: ch01-b12
          speaker: reddy_fox
          text: “这回你猜错了，彼得。有几种水果我也很喜欢。你不知道吧？”
        - id: ch01-b13
          speaker: peter_rabbit
          text: “我的确不知道，知道以后倒很高兴。要是只能靠杀死别人过日子，那也太可怕了。”
        - id: ch01-b14
          speaker: reddy_fox
          text: “别忘了，我偶尔也吃鱼，鸡蛋更是随时欢迎。反正只要能填饱肚子，我不挑。”
        - id: ch01-b15
          speaker: peter_rabbit
          text: “雷迪捕猎时，耳朵、眼睛和鼻子全都用得上。我好多次见他侧耳听丹尼的吱吱声，也见过他盯着草叶，只等草叶一动，便找出丹尼藏在哪里。他那只了不起的鼻子也有好多次嗅出我的气味，然后一路跟来，就像鲍泽追踪他一样。周围不管发生什么，很少能瞒过他的眼睛、耳朵和鼻子。”
        - id: ch01-b16
          speaker: peter_rabbit
          text: “可我们最怕的还是他的急智，因为谁也猜不到他下一回又会耍什么新花招。有些敌人很好骗，雷迪可不在其中。有时我觉得，他对我的了解比我自己还深。他用了那么多聪明花招，到现在还没抓住我，我看纯粹只是运气站在我这边。”
        - id: ch01-b17
          speaker: peter_rabbit
          text: “雷迪白天夜里都会捕猎，我看他更爱在夜里出动，不过这也要看他究竟有多饿。我不止一次见过他叼着鸡回家。听说他聪明得从不偷住处附近的鸡，总要跑远一点儿再下手，也不会连续两个晚上去同一个鸡舍。他好像什么都不怕，只有拿着可怕猎枪的猎人能吓住他。至于鲍泽追赶，他压根儿不在乎。”
        - id: ch01-b18
          speaker: reddy_fox
          text: “我的确不在乎，还觉得那是活动筋骨的好机会。我只要把足迹截断，让鲍泽再也找不回来，就能甩掉他。哪天连他也骗不过，我被捉住也是活该。其实，拿枪的猎人我也没有多么害怕。我通常能猜到猎人会怎么做，比他猜我的下一步准得多。”
        - id: ch01-b19
          speaker: narrator
          text: 老大自然妈妈点了点头。
        - id: ch01-b20
          speaker: mother_nature
          text: “这话听着像吹牛，其实不是。雷迪是少数能在人类追捕下守住自己生活的动物之一，靠的就是聪明才智。和他一样大的动物里，没有哪一种能像他这样，住在人类家园附近还生活得很好。人类的住处明明离他很近，他却一次次躲过危险。他能成功，无非是因为把我给他的种种感官都用到了极致。”
        - id: ch01-b21
          speaker: mother_nature
          text: “我给他的眼睛、耳朵和鼻子，他时时刻刻都会使用，也知道怎样看懂它们送来的消息，再把每一点消息派上用场。人类一直捕猎他，恰恰让他的头脑越来越敏锐，同一个错误很少犯第二遍。你们全都怕雷迪，有些大概还恨他。不过要记住，他绝不会因为喜欢杀生而杀生，只会为了食物这样做。绿森林和绿草原要是没有了他，便像少了很要紧的一样东西。”
        - id: ch01-b22
          speaker: mother_nature
          text: “雷迪，现在说说你和雷迪太太吧。你们住在哪里？又怎样养育宝宝？”
        - id: ch01-b23
          speaker: reddy_fox
          text: “今年我们住在老牧场，大岩石底下有一座很好的地洞。那里只有一个入口，因为谁也不可能从那块岩石下面把我们挖出来，用不着别的门。去年，我们住在绿草原，那个家有三扇门。再前一年，我们把家挖在绿森林边缘内侧的一片砾石坡上。宝宝都出生在地下深处的舒适卧房里。有时，卧房旁边还有一间储藏室，把一顿吃不完的食物放进去。”
        - id: ch01-b24
          speaker: reddy_fox
          text: “春天，宝宝刚出生，雷迪太太不能离开他们，我就带食物给她。等小家伙们长大一点儿，会用尖尖的小牙了，我们再轮流给他们捕猎。有时分头行动，有时一起去，因为两只狐狸常能办成一只办不到的事。家里有宝宝时，鲍泽要是发现雷迪太太的足迹，她就把他远远引开。我再赶过去接替她，让她悄悄脱身，回到宝宝身边。鲍泽从来不知道追的狐狸已经换了。”
        - id: ch01-b25
          speaker: reddy_fox
          text: “不是我自夸，我们的孩子个个都受过很好的训练。我们教他们怎样追踪和捕猎，也教他们怎样骗过敌人。雷迪太太和我自己学会的每一个花招，都会一点不少地传给他们。论起从父母那里学到的本领，小狐狸不会输给谁。”
        - id: ch01-b26
          speaker: mother_nature
          text: “我来出个谜。红狐什么时候不是红狐？”
        - id: ch01-b27
          speaker: narrator
          text: 大家眨着眼睛，都以为老大自然妈妈在开玩笑。喋喋的脑筋转得快，忽然记起灰松鼠当中也有黑色的。
        - id: ch01-b28
          speaker: chatterer
          text: “当然是他变成别的颜色时！”
        - id: ch01-b29
          speaker: mother_nature
          text: “答对了。一对红狐偶尔会生出一个没有半根红毛的宝宝。他可能浑身漆黑，只有尾巴尖是白的。也可能全身黑毛，每根毛的尖端却是白色。这样的狐狸叫黑狐或银狐。他仍是红狐，身上却一点儿也不红。有时，毛皮只有一部分带黑色，人们便叫他十字狐。许多人以为黑狐、银狐和十字狐各是不同的种类，其实都只是换了外衣的红狐。”
        - id: ch01-b30
          speaker: mother_nature
          text: “人类把银狐皮看成所有毛皮中最上等的几种之一，肯出高得吓人的价钱。这当然意味着，一只穿黑外套的小狐狸若想一直活到老，就得比别的狐狸更加聪明。人类只要见过他一次，便会紧追不放，没完没了地捕猎下去。”
        - id: ch01-b31
          speaker: narrator
          text: 雷迪一直聚精会神地听着，没有漏掉一句。等老大自然妈妈讲完黑狐的危险，她忽然发现，雷迪那张脸上已经露出了忧虑的神色，便问他究竟为什么这样不安。
        - id: ch01-b32
          speaker: reddy_fox
          text: “我当然不安。您刚才说的话叫我担心，因为我家有一个宝宝浑身漆黑。现在知道他的毛皮那么值钱，雷迪太太和我得格外用心，把自己懂得的一切全教给他。”
          emotion: fearful
        - id: ch01-b33
          speaker: mother_nature
          text: “还有一件很要紧的事，你们都该知道。雷迪和雷迪太太一旦结为伴侣，便会相伴一生。雷迪会照料宝宝，也会帮助雷迪太太。他既是最好的父亲，也是最好的伴侣。”
        - id: ch01-b34
          speaker: peter_rabbit
          text: “雷迪有样东西真叫我羡慕，就是那条漂亮的大尾巴。我要是也有一条就好啦。”
        - id: ch01-b35
          speaker: narrator
          text: 大家想象着彼得拖着雷迪那样的大尾巴，全都笑了起来。
        - id: ch01-b36
          speaker: mother_nature
          text: “彼得，真叫你拖着那条尾巴，恐怕走不了多远。潮湿天气里，雷迪的尾巴吸满了水，会变得沉甸甸的，连他也觉得是个累赘。所以碰上下雨，或者冬日的积雪又湿又软，他很少出门。这个国家的北半部，从这一头到另一头，到处都是红狐的家。不管住在哪里，他都是你们十分熟悉的那个狡猾又聪明的雷迪。”
        - id: ch01-b37
          speaker: mother_nature
          text: “南方，还有东部和西部的一些地方，住着雷迪的一位表亲，个头和他相近，名叫灰狐。灰狐的外衣是灰色的，脖子两侧、两只耳朵和胸口横着一片红色。身体下方也泛着红，只有喉咙和胸口正中是白的。”
        - id: ch01-b38
          speaker: mother_nature
          text: “灰狐喜欢绿森林，不爱开阔地，因为他的脑筋没有表兄雷迪转得快。要只比奔跑，他或许更胜一筹，可他的急智不够，也不那么善于在人类面前保护自己，不能像雷迪那样稳稳守住生活。他不在地里挖洞，通常把家安在空心树干或空心圆木里，宝宝就出生在树洞底部用树叶铺成的窝中。西部有些地方叫他树狐，因为他常爬上不高的树。”
        - id: ch01-b39
          speaker: mother_nature
          text: “南方的灰狐还不是雷迪唯一的表亲。大西部一些地方的平原上，住着雷迪最小的表亲之一，叫小狐，也叫敏狐。他还没有布朗农夫家的黑猫大，因为跑得特别快，才得了敏狐这个名字。他是草原动物，和大多数草原动物一样，住在地下洞穴中。背部灰色，两侧黄红，腹部雪白。尾巴上方黄灰，下方泛黄，尖端是黑的。他看起来更像灰狐，脑筋也比雷迪慢，很容易落进陷阱。”
        - id: ch01-b40
          speaker: mother_nature
          text: “西南方炎热干燥的地方，袋鼠鼠和囊鼠生活的那片土地上，还住着小狐的近亲沙漠狐。沙漠里的小居民大多不在白天露面，他也一样。他跑得飞快，挖的地洞有好几个入口，主要捕捉囊鼠、袋鼠鼠、地松鼠和当地其他小动物。他和小狐一样，都不算特别机敏。他们的毛皮又不太值钱，所以人类不像捕捉雷迪，以及大北方的北极狐和蓝狐那样常常追捕和设阱捉他们。”
        - id: ch01-b41
          speaker: mother_nature
          text: “北极狐也叫白狐，住在遥远北方的冰雪世界里。他是个非常漂亮的小家伙，比小狐大，却只有雷迪三分之二那么大。住在极北之地的北极狐，一年四季都披着雪白的外衣，那身毛又长、又厚、又柔软，还有一条格外漂亮的大尾巴。住得稍微靠南一些，夏天便会换上蓝褐色的外衣，冬天一临近，马上又变回白色。”
        - id: ch01-b42
          speaker: mother_nature
          text: “父母住得够靠南，地上没有积雪时，他们便在地下洞穴里生宝宝。到了极北之地，家只能安在雪堆中的洞穴里，宝宝也在那里出生。北极狐生活在白茫茫的世界中，一身白毛使他们几乎融进四周的景色，很难被发现。不论是悄悄捕猎，还是逃避敌人，这身外衣都能帮上大忙。”
        - id: ch01-b43
          speaker: mother_nature
          text: “夏天，北极狐主要吃鸭子和其他野禽，这些鸟会一大群一大群地来到遥远北方筑巢，数量多得很。冬天，他们捕捉旅鼠、北极野兔和松鸡太太住在当地的表亲雷鸟，也啃北极熊与狼吃剩的骨头。冬日里要找到足够的食物很难，所以北极狐成了四处远行的旅行家。”
        - id: ch01-b44
          speaker: mother_nature
          text: “蓝狐只是换了颜色的白狐，就像黑狐只是黑色的红狐，他的生活习性自然和白狐完全相同。遥远北方有一群岛屿，名叫普里比洛夫群岛，那里住着许多蓝狐。白狐和蓝狐的外衣确实十分美丽，人类也把那些毛皮看得很贵重，因此一直大肆捕猎他们。他们虽然都是聪明的猎手，急智却根本比不上雷迪，所以比雷迪更容易落进陷阱。”
        - id: ch01-b45
          speaker: mother_nature
          text: “雷迪和亲戚们的故事就讲到这里。雷迪会留在我身边，等你们其余的人都有机会安全回到家，他才能离开。再往后，你们仍得像平时那样自己当心。千万记住，雷迪正是因为一次次受人追捕，头脑才变得这么快。你们若同样聪明，就该懂得，他越常追捕你们，你们也会变得越机敏。明天，我们来认识他那些高大的表亲——狼。”
