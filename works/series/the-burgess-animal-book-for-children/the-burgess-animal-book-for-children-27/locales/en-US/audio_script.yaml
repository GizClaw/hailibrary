  chapters:
    - id: ch01
      title: Reddy Fox Joins the School
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: The next morning, every pupil was there when school began. All but Jimmy Skunk and Prickly Porky had good reason to think about Reddy Fox, because he played an important part in their lives. Even Happy Jack and Chatterer had narrowly escaped becoming his dinner many times, though they were tree folk. Johnny Chuck, Peter Rabbit, Jumper the Hare, Striped Chipmunk, Danny Meadow Mouse, and Whitefoot the Wood Mouse thought of him during almost every hour of the day and night. Forgetting Reddy, even for a few minutes, could mean the end of them.
        - id: ch01-b02
          speaker: narrator
          text: So imagine how they felt when they had just settled comfortably into their places and Reddy himself walked out from behind a tree. No school had ever broken up so quickly. In the blink of an eye, Old Mother Nature was left with Reddy and Jimmy Skunk. Prickly Porky, Happy Jack, and Chatterer remained above them in the trees.
        - id: ch01-b03
          speaker: narrator
          text: Reddy looked uncomfortable.
        - id: ch01-b04
          speaker: reddy_fox
          text: "I didn't come here to send everyone running. I never would have come at all if you hadn't asked me."
        - id: ch01-b05
          speaker: narrator
          text: Old Mother Nature smiled.
        - id: ch01-b06
          speaker: old_mother_nature
          text: "I kept my invitation secret, Reddy. If the others had known, I was afraid none of them would come. I promised a surprise, and clearly no one guessed what it was. Go sit beside that old stump near the Lone Little Path."
        - id: ch01-b07
          speaker: narrator
          text: Then she called every pupil by name and ordered each one to return at once. Her voice was stern, very stern indeed. One after another, they appeared from all kinds of hiding places. They kept glancing fearfully toward Reddy, but none dared disobey Old Mother Nature.
        - id: ch01-b08
          speaker: narrator
          text: At last they crowded as close to her as they could. This time, her voice was soft.
        - id: ch01-b09
          speaker: old_mother_nature
          text: "I truly am ashamed of you. How could you believe I would let anyone hurt you? Reddy is here because I sent for him. He will stay exactly where he is until I release him, and he will not harm one of you. First I'll tell you a few things about Reddy. Then we'll see what you have learned about him yourselves."
          emotion: calm
        - id: ch01-b10
          speaker: old_mother_nature
          text: "It may sound strange to you, but Reddy belongs to the very same family as Bowser the Hound. They are both members of the Dog family, so they are quite closely related. Howler the Wolf and Old Man Coyote belong to that family too, which makes all four of them cousins. Look closely at Reddy and you will see the likeness at once. He resembles a small Dog in a fine red coat, with a white waistcoat, black feet, and a beautiful bushy tail. Peter, you probably know nearly as much about Reddy as anyone here. At least you should. Tell us what you have learned while trying to keep out of his clutches."
        - id: ch01-b11
          speaker: narrator
          text: Peter thoughtfully scratched one long ear and glanced sideways at Reddy.
        - id: ch01-b12
          speaker: peter_rabbit
          text: "I certainly should know something about him. Reddy was the first person Mother warned me about. She said he loved young Rabbits, and that no enemy was slyer, smarter, or more dangerous. Since then, I've learned she was exactly right."
        - id: ch01-b13
          speaker: narrator
          text: Johnny Chuck, Danny Meadow Mouse, and Whitefoot nodded in complete agreement. Peter went on.
        - id: ch01-b14
          speaker: peter_rabbit
          text: "Reddy mostly lives by hunting, and other people hunt him in turn, so his wits must stay sharp. If he isn't after me, he may be hunting Danny Meadow Mouse, Whitefoot, Striped Chipmunk, Mrs. Grouse, or Bob White. He may be trying to steal one of Farmer Brown's Chickens. At other times, he catches Frogs along the edge of the Smiling Pool or grasshoppers out in the Green Meadows. As far as I can tell, anything Reddy manages to catch becomes food for him. I suppose he eats nothing except creatures like these."
        - id: ch01-b15
          speaker: narrator
          text: Reddy had been listening with a crafty grin.
        - id: ch01-b16
          speaker: reddy_fox
          text: "Then you suppose wrong, Peter. I enjoy certain fruits too. You didn't know that, did you?"
        - id: ch01-b17
          speaker: peter_rabbit
          text: "No, I didn't. I'm glad you told me. Living only by killing others sounds dreadful."
        - id: ch01-b18
          speaker: reddy_fox
          text: "You can add fish now and then, and eggs whenever I can get them. I don't fuss over my food as long as it fills my stomach."
        - id: ch01-b19
          speaker: peter_rabbit
          text: "Reddy hunts with his ears, eyes, and nose. Many times I've watched him listen for the faint squeak of Danny Meadow Mouse. I've also seen him stare at the grass and wait for it to move, because that would show exactly where Danny was hiding. More than once, Reddy's wonderful nose has picked up my scent, and he has followed my trail just as Bowser follows his. I don't believe much can happen nearby without Reddy's eyes, ears, or nose telling him about it."
        - id: ch01-b20
          speaker: peter_rabbit
          text: "But his quick wits frighten us most. We never know what trick he'll try next. Plenty of enemies are easy to fool, but not Reddy. Sometimes I think he knows me better than I know myself. It must be pure luck that none of his clever tricks has caught me yet."
        - id: ch01-b21
          speaker: peter_rabbit
          text: "Reddy hunts by day and by night, though I think he likes nighttime better. Perhaps it depends on how hungry he is. I've seen him carry a Chicken home more than once. But people tell me he never steals Chickens anywhere near his home. He always travels some distance to get them, and he is too clever to visit the same Chicken yard on two nights in a row. As far as I know, only a hunter carrying a terrible gun frightens him. He certainly doesn't seem to mind when Bowser the Hound chases him."
        - id: ch01-b22
          speaker: reddy_fox
          text: "No, I rather enjoy being chased by Bowser. It gives me good exercise. If I can't fool him by breaking my trail so that he loses it and cannot pick it up again, then I deserve to be caught. Even a hunter carrying a gun doesn't frighten me terribly. You see, I can usually guess what that hunter will do before he can guess what I will do."
        - id: ch01-b23
          speaker: narrator
          text: Old Mother Nature nodded.
        - id: ch01-b24
          speaker: old_mother_nature
          text: "That may sound like a boast, but it is true. Reddy is one of the few animals who has managed to hold his own against man. No other animal his size has lived so successfully close to people's homes. He has done it by making full use of the senses I gave him. He keeps his eyes, ears, and nose working at all times. More important, he understands the news they bring and makes the most of it."
        - id: ch01-b25
          speaker: old_mother_nature
          text: "Man has always hunted him, and that very danger has sharpened his wits. Reddy seldom makes the same mistake twice. You little people fear him, and I suspect some of you even hate him. But always remember that he never kills for the love of killing. He kills only when he needs food. If there were no Reddy Fox, something would be sadly missing from the Green Forest and the Green Meadows."
        - id: ch01-b26
          speaker: old_mother_nature
          text: "Reddy, where do you and Mrs. Reddy live, and how do you raise your babies?"
        - id: ch01-b27
          speaker: reddy_fox
          text: "This year we live up in the Old Pasture. We dug the nicest kind of house under a great rock. It has only one entrance, but that is because we have no need for another one. No one could possibly dig us out from beneath that rock. Last year we lived in the Green Meadows, and that house had three separate doorways. The year before, we dug our home into a gravelly bank just inside the edge of the Green Forest."
        - id: ch01-b28
          speaker: reddy_fox
          text: "Our babies are born in a comfortable bedroom deep underground. Sometimes our house has a storeroom too. Mrs. Reddy and I use it to keep any food we cannot finish at one meal. When the babies are first born in spring, she cannot leave them, so I carry food home to her. Once the youngsters are big enough to use their sharp little teeth, we take turns hunting for them. We usually hunt separately, though sometimes we work together. Two can often manage what one cannot."
        - id: ch01-b29
          speaker: reddy_fox
          text: "If Bowser finds Mrs. Reddy's trail while the babies are at home, she leads him far away. Then I join her and take her place. She slips off to the babies, and Bowser never notices the change."
        - id: ch01-b30
          speaker: reddy_fox
          text: "And our children are well trained, if I may say so. We teach them to hunt, to fool their enemies, and to use every trick we have learned. No youngster gets better training than a young Fox."
        - id: ch01-b31
          speaker: old_mother_nature
          text: "Here is a riddle for you. When is a Red Fox not a red fox?"
        - id: ch01-b32
          speaker: narrator
          text: Everyone blinked. Most thought Old Mother Nature must be joking. Then quick-witted Chatterer remembered that she had once told them about black Gray Squirrels.
        - id: ch01-b33
          speaker: chatterer_red_squirrel
          text: "When he's some other color!"
          emotion: surprised
        - id: ch01-b34
          speaker: old_mother_nature
          text: "That is it. Once in a while, two Red Foxes have a baby without a single red hair. He may be completely black except for a white tip on his tail, or his black fur may be tipped all over with white. Then people call him a Black Fox or Silver Fox. He is still a Red Fox, though nothing about him looks red. If black marks cover only part of his fur, he is called a Cross Fox."
        - id: ch01-b35
          speaker: old_mother_nature
          text: "Many people have believed that Black or Silver Foxes and Cross Foxes were separate kinds of Fox. They are not. They are simply Red Foxes wearing different-colored coats. Man considers Silver Fox fur one of the choicest furs of all, and people pay enormous prices for it. That means a black-coated young Fox must be very clever indeed if he hopes to grow old. Once a man sees him, hunters will follow him without rest."
        - id: ch01-b36
          speaker: narrator
          text: Reddy listened closely. Old Mother Nature saw worry come over his face.
        - id: ch01-b37
          speaker: old_mother_nature
          text: "What is wrong, Reddy? You look anxious."
        - id: ch01-b38
          speaker: reddy_fox
          text: "I am anxious. What you said worries me because one of my cubs is completely black. Now that I know how valuable his fur is, Mrs. Reddy and I must take special care to teach him everything we know."
          emotion: fearful
        - id: ch01-b39
          speaker: old_mother_nature
          text: "I want all of you to know that Reddy and Mrs. Reddy mate for life. Reddy is a devoted father and a devoted mate."
        - id: ch01-b40
          speaker: peter_rabbit
          text: "I do envy one thing about Reddy. That great tail is wonderful. I wish I had one like it."
        - id: ch01-b41
          speaker: narrator
          text: Everyone laughed as they imagined Peter Rabbit carrying a tail as big as Reddy's.
        - id: ch01-b42
          speaker: old_mother_nature
          text: "I doubt you would travel very far if you had to carry that tail around. Even Reddy finds his own tail a burden in wet weather, when it grows heavy with water. That is one reason you do not see him outside very much while rain is falling, or in winter when the snow is soft and wet. Reddy makes himself at home throughout the northern half of this country. Wherever you meet him, he is the same sly, clever fellow you all know so well."
        - id: ch01-b43
          speaker: old_mother_nature
          text: "In the South, and in some parts of the East and West, Reddy has a cousin about his own size called the Gray Fox. His coat is gray, with red showing along both sides of his neck, on his ears, and across his breast. The lower part of his body is reddish too. His throat and the very middle of his breast are white."
        - id: ch01-b44
          speaker: old_mother_nature
          text: "The Gray Fox prefers the Green Forest to open country. He may be an even better runner than Reddy, but he thinks more slowly and has not held his own against man nearly as well. Instead of making a home in a hole in the ground, he usually chooses a hollow tree trunk or a hollow log. His babies are born on a nest of leaves at the bottom of that hollow. In some western places, people call him the Tree Fox because he often climbs into low trees."
        - id: ch01-b45
          speaker: old_mother_nature
          text: "The Gray Fox is not Reddy's only cousin. Out on the plains in certain parts of the Great West lives one of the smallest. He is called the Kit Fox, or Swift. He is no bigger than Farmer Brown's Cat, Black Pussy, and his great running speed gave him the name Swift. Like most prairie animals, he lives in a burrow."
        - id: ch01-b46
          speaker: old_mother_nature
          text: "The Kit Fox has a grayish back and yellowish-red sides, while the whole underside of his body is white. The upper side of his tail is yellowish gray, the lower side is yellowish, and its very tip is black. In his general appearance, he looks much more like the Gray Fox than he does Reddy. He also lacks Reddy's quick mind, and that makes him easy to catch in a trap."
        - id: ch01-b47
          speaker: old_mother_nature
          text: "Another cousin, closely related to the Kit Fox, lives in the hot, dry Southwest among the Kangaroo Rats and Pocket Mice. He is the Desert Fox. Like most of the little animals who live in the desert, he is seldom seen during the day. He is very swift on his feet. He digs a burrow with several different entrances. Most of his meals are Pocket Mice, Kangaroo Rats, Ground Squirrels, and whatever other small animals live in that part of the country."
        - id: ch01-b48
          speaker: old_mother_nature
          text: "Like the Kit Fox, the Desert Fox is not especially quick-witted. People do not think the coats of either Fox are very valuable. Because of that, they are not hunted and trapped as heavily as Reddy and his two cousins from the Great North, the Arctic Fox and the Blue Fox."
        - id: ch01-b49
          speaker: old_mother_nature
          text: "The Arctic Fox, also called the White Fox, lives far north in the land of snow and ice. He is a little fellow, larger than the Kit Fox but only about two thirds Reddy's size, and he is very beautiful. In the highest parts of the North, every bit of his coat stays snowy white throughout the year. That white fur is long, very thick, and soft. He also has a remarkably large and handsome tail."
        - id: ch01-b50
          speaker: old_mother_nature
          text: "When an Arctic Fox lives a little farther south, his summer coat turns bluish brown. As soon as winter comes near, he puts on his white coat again. If the parents live far enough south for the ground to be free of snow, their young are born in a burrow in the earth. In the Far North, their home is a burrow dug into a snowbank, and that is where the babies are born."
        - id: ch01-b51
          speaker: old_mother_nature
          text: "An Arctic Fox lives in a world of white. His white coat helps him both when he hunts and when he tries to escape from enemies, because he is very hard to see against his white surroundings. During summer, much of his food comes from ducks and other wild birds that nest in huge numbers across the Far North. In winter, he hunts Lemmings, Arctic Hares, and the Ptarmigan, a northern cousin of Mrs. Grouse. He also picks the bones left behind by Polar Bears and Wolves. Making a living through the northern winter is never easy, so the Arctic Fox becomes a great traveler."
        - id: ch01-b52
          speaker: old_mother_nature
          text: "A Blue Fox is really only a White Fox of another color, just as a Black Fox is a Red Fox of another color. Everything he does and the way he lives are the same as the habits of the White Fox. Far to the north lies a group of islands called the Pribilof Islands, and many Blue Foxes make their homes there."
        - id: ch01-b53
          speaker: old_mother_nature
          text: "People hunt both White and Blue Foxes heavily because their coats are considered so valuable. They certainly are beautiful. These northern cousins of Reddy are clever hunters, but they do not begin to think as quickly as he does. That is why traps catch them much more easily."
        - id: ch01-b54
          speaker: old_mother_nature
          text: "That is enough about Reddy and his relatives for today. Reddy will remain here with me until everyone else has had time to reach home. After that, you must watch out for yourselves as usual."
        - id: ch01-b55
          speaker: old_mother_nature
          text: "Remember, being hunted so often is what made Reddy quick-witted. If you can be as smart as he is, you will understand that the more he hunts you, the quicker your own wits will grow. Tomorrow we will learn about Reddy's big cousins, the Wolves."
