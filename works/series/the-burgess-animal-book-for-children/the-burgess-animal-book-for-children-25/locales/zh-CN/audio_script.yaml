audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 亲切生动，带着温和的幽默感
        timbre: 温暖清亮
        pace: 舒缓而富有变化
        pitch: 中等
    mother_nature:
      display_name: 老大自然妈妈
      tts:
        delivery: 慈爱睿智，说话从容而坦率
        timbre: 温厚柔和
        pace: 从容
        pitch: 中低
    peter_rabbit:
      display_name: 彼得兔
      tts:
        delivery: 好奇直率，情绪来得快也去得快
        timbre: 清脆稚气
        pace: 轻快
        pitch: 中高
    happy_jack:
      display_name: 灰松鼠快乐杰克
      tts:
        delivery: 自信好胜，受窘时有些急躁
        timbre: 明亮爽脆
        pace: 轻快
        pitch: 中高
    jerry_muskrat:
      display_name: 麝鼠杰里
      tts:
        delivery: 随和健谈，熟悉水边生活，说话朴实
        timbre: 温和浑厚
        pace: 从容
        pitch: 中低
    billy_mink:
      display_name: 水貂比利
      tts:
        delivery: 机灵活跃，带着淘气和几分狡黠
        timbre: 清亮灵活
        pace: 明快
        pitch: 中等
    little_joe_otter:
      display_name: 水獭小乔
      tts:
        delivery: 爽朗自信，谈起游泳和家人时自然亲切
        timbre: 饱满明亮
        pace: 轻快
        pitch: 中等
  chapters:
    - id: ch01
      title: 第二十五章　两位游泳名将
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 太阳才升起来，微笑池塘岸边已经成了最好的课堂。能赶来的小居民全到了，还有几位从没上过课的新同学。青蛙爷爷坐在自己那片宽大的绿睡莲叶上。麝鼠杰里的家就在池塘里，他当然也在。斑点龟来了，苍鹭长腿也没有缺席。说起来，不是他们跑来上学，而是学校搬到了他们身边。这里本来就是他们的家，或是他们一天里最常待的地方。
        - id: ch01-b02
          speaker: mother_nature
          text: “早上好，杰里。你见到水貂比利或水獭小乔了吗？”
        - id: ch01-b03
          speaker: narrator
          text: 杰里棕色的脑袋刚从池水里露出来。
        - id: ch01-b04
          speaker: jerry_muskrat
          text: “小乔昨晚去大河了，随时都可能回来。比利昨晚还在这儿，说要沿欢笑溪往上游捕鱼。他也说不准什么时候就会冒出来。那家伙一天到晚来来去去，我看他五分钟都闲不住。”
        - id: ch01-b05
          speaker: billy_mink
          text: “谁五分钟都闲不住？”
        - id: ch01-b06
          speaker: narrator
          text: 说话的正是比利。他刚好爬上大岩石。
        - id: ch01-b07
          speaker: mother_nature
          text: “杰里说的是你。你正好证明给他看，他说错了。先在这里待一会儿，就待在大岩石上。我还有问题要问你。”
        - id: ch01-b08
          speaker: narrator
          text: 可老大自然妈妈话音刚落，比利就一头扎进了微笑池塘。只过了一秒，他那颗棕色的脑袋又钻出水面，嘴里还牢牢叼着一条肥鱼。比利手脚并用地爬回大岩石，把鱼放在面前。这时候，他才有些害怕地抬起眼睛，望向老大自然妈妈。
        - id: ch01-b09
          speaker: billy_mink
          text: “我……我不是故意不听话。我一看见那条鱼，还没想就扑下去了。大自然妈妈，请您原谅我吧。我保证不再这样。”
          emotion: fearful
        - id: ch01-b10
          speaker: mother_nature
          text: “没想清楚就行动，有时会惹麻烦。不过这次我原谅你。你刚才倒给朋友们做了一个很好的示范。先吃鱼吧，吃完准备回答问题。”
        - id: ch01-b11
          speaker: narrator
          text: 比利坐在大岩石上吃鱼，大家正好把他看个仔细。只要一眼，就能认出他是黄鼠狼影子的表亲。比利也有又细又长的身子，只是个头比影子大得多。他的外衣是漂亮的深棕色，越到背部颜色越深，下巴却是白的。圆圆的尾巴覆着颇长的毛，颜色深得几乎发黑。他的脸也像影子，四条腿相当短。比利坐着吃鱼时，整个背脊都高高弓了起来。
        - id: ch01-b12
          speaker: mother_nature
          text: “好了，比利。你更喜欢白天，还是夜晚？”
        - id: ch01-b13
          speaker: billy_mink
          text: “都差不多。想睡了，我才不管白天黑夜。等我睡醒，就出去打猎，全看那时候的兴致。”
        - id: ch01-b14
          speaker: mother_nature
          text: “你都猎些什么？”
        - id: ch01-b15
          speaker: narrator
          text: 比利咧嘴一笑。
        - id: ch01-b16
          speaker: billy_mink
          text: “只要能让我美餐一顿，什么都行。我不怎么挑食。肥老鼠、嫩兔子、花栗鼠、青蛙、蝌蚪、鸡、鸡蛋、鸟，还有鱼，碰巧哪样最容易捉，我就吃哪样。我很喜欢鱼，这也是我住在欢笑溪和微笑池塘附近的一个原因。不过，我也爱换换口味，所以常去绿森林打猎。有时，我还会跑到农夫布朗家捉一只鸡。春天，我会找那些筑在地上的鸟巢。到了冬天，要是我正饿着肚子，彼得又恰好从这里经过，我也许真会忍不住尝尝他的滋味。”
        - id: ch01-b17
          speaker: narrator
          text: 比利坏坏地眨了眨亮眼睛，彼得听得打了个寒战。
        - id: ch01-b18
          speaker: billy_mink
          text: “杰里要不是我的朋友，我恐怕也想尝尝他。”
        - id: ch01-b19
          speaker: peter_rabbit
          text: “呸！你才不敢找杰里的麻烦！”
        - id: ch01-b20
          speaker: billy_mink
          text: “我不敢？那你问问杰里呀。”
        - id: ch01-b21
          speaker: narrator
          text: 大家看看杰里的脸，马上明白了。杰里个头不小，却真的怕比利。
        - id: ch01-b22
          speaker: mother_nature
          text: “你在陆地上怎么打猎？”
        - id: ch01-b23
          speaker: billy_mink
          text: “当然要靠眼睛、鼻子和耳朵，这才是好猎手的办法。谁的耳朵比我灵，我可不知道。我的鼻子，拿谁的来换都不肯。眼睛嘛，也完全够用了。”
        - id: ch01-b24
          speaker: mother_nature
          text: “也就是说，你和表亲影子的打猎办法很像。”
        - id: ch01-b25
          speaker: billy_mink
          text: “大概是吧。不过有件事，影子会做，我却不会。他打猎，有时仅仅是因为自己喜欢杀生。偶尔，我杀掉的猎物也会多得吃不完，可那不是我的本意。我出门打猎是为了找到食物、填饱肚子。影子却不一样，他会只为了享受杀生而打猎。”
        - id: ch01-b26
          speaker: mother_nature
          text: “大家已经看过你怎么捕鱼了。现在游到对岸去，再让我们看看你怎么跑。”
        - id: ch01-b27
          speaker: narrator
          text: 比利听话地滑进水里，一头潜了下去。他在水下游出一段，才把脑袋露出水面。到了对岸，比利爬上岸，沿着岸边跑起来。他一跃接一跃地向前，每两次跳跃之间，背脊都会高高弓起。忽然，他就在大家眼前消失了，接着又像刚才消失时一样突然现身。比利的动作实在太快，观看的小居民没有谁能一直盯住他。有时候，他简直像凭空不见了。当然，比利没有真的消失。他只是很会借着每一根小树枝、每一块石头和每一丛灌木，把自己藏起来。
        - id: ch01-b28
          speaker: mother_nature
          text: “比利是一位了不起的旅行家。他很喜欢沿欢笑溪上下往来，就算要走很远也不在乎。凡是堆着许多漂流木和杂物的地方，他都像回到家一样自在。比利的身子那么细，什么缝隙都能钻，什么洞都进得去。他在陆地上动作很快，可还不如表亲影子快。他游泳很好，却又不及个头更大的表亲小乔。不过，比利在陆地上和水里都同样自在，这便是他胜过两位表亲的地方。”
        - id: ch01-b29
          speaker: mother_nature
          text: “人们为了毛皮常常追捕比利，被追得多了，他也变得特别机警。比利太太会把家安在岸边的洞里、老树桩底下，或是一堆漂流木下面。你们放心，那座巢一定藏得严严实实。宝宝们在那里出生，整个夏天都跟着母亲。顺便告诉你们，比利还很会爬树。这片辽阔国土上到处都有他的踪影。住在遥远北方的比利，身上的毛会比住在南方时更加细密，也更加厚实。”
        - id: ch01-b30
          speaker: mother_nature
          text: “真希望小乔也在这里。我原本盼着他会来呢。”
        - id: ch01-b31
          speaker: jerry_muskrat
          text: “瞧，他这不就来了！我就觉得他会回来。”
        - id: ch01-b32
          speaker: narrator
          text: 杰里指向欢笑溪流出微笑池塘、一路奔往大河的地方。一颗棕色脑袋正飞快朝大家游来。那颗脑袋绝不会认错，只能是水獭小乔。他一路径直游到大岩石旁，爬了上去。小乔块头很大，身长超过三英尺，是家族里体形最大的成员之一。不过，谁看见他也不会怀疑他属于鼬科。他的身体很长，四条腿短得出奇，尾巴颇长，也很宽。全身的外衣都是浓郁的棕色，只是腹部比背上稍浅一点儿。
        - id: ch01-b33
          speaker: little_joe_otter
          text: “这里在做什么呀？”
        - id: ch01-b34
          speaker: narrator
          text: 小乔好奇得两眼发亮。
        - id: ch01-b35
          speaker: mother_nature
          text: “我们今天在这里上课，刚才还盼着你出现。小乔，抬起一只脚，把脚趾张开。”
        - id: ch01-b36
          speaker: narrator
          text: 小乔虽然满脸困惑，还是照办了。
        - id: ch01-b37
          speaker: peter_rabbit
          text: “哎呀！他的脚趾间有蹼，跟海狸帕迪一样！”
          emotion: surprised
        - id: ch01-b38
          speaker: little_joe_otter
          text: “当然有蹼。要不然，我怎么能游得这样好？”
        - id: ch01-b39
          speaker: peter_rabbit
          text: “你游得比帕迪还好吗？”
        - id: ch01-b40
          speaker: little_joe_otter
          text: “当然比他好。我要是游不过帕迪，恐怕常常得饿肚子。”
        - id: ch01-b41
          speaker: peter_rabbit
          text: “为什么会饿？帕迪就不会呀。”
        - id: ch01-b42
          speaker: little_joe_otter
          text: “帕迪不靠鱼过活，我却靠鱼过活。就算只跟鱼赛最后一小段，我也能追上它。这可不是谁都做得到的。”
        - id: ch01-b43
          speaker: mother_nature
          text: “那就让大家看看你游得有多好吧。”
        - id: ch01-b44
          speaker: narrator
          text: 小乔滑进水里。微笑池塘平静极了，坐在岸边的小居民低头望去，几乎能一直看见水底。他们清楚看见小乔入水，接着却只见一道棕影掠过。一秒以后，他的脑袋已经从池塘另一边冒出来。
        - id: ch01-b45
          speaker: peter_rabbit
          text: “呼！幸亏我不是鱼！”
        - id: ch01-b46
          speaker: narrator
          text: 大家全笑了。
        - id: ch01-b47
          speaker: mother_nature
          text: “你确实应该庆幸。有小乔在附近，一条鱼也没有多少逃脱的机会。他和比利一样，是一位了不起的旅行家，尤其喜欢沿欢笑溪和大河上下往来。有时他也从陆地上走，可他的身体太重，四条腿又太短，在陆地上赶路实在很慢。所以，小乔从一条溪流或一片池塘赶往另一处水域时，总会挑最平坦、最好走的路。”
        - id: ch01-b48
          speaker: mother_nature
          text: “到了冬天，他有时会走上相当远的路。路上遇见一面平滑的山坡，他不会一步一步往下走，而是把身子往下一伏，趴在肚皮上，一路滑到坡底。小乔，说起来，你在这附近是不是也有一条滑道？”
        - id: ch01-b49
          speaker: little_joe_otter
          text: “有啊，就在欢笑溪下游一处很陡的岸坡上。水獭太太、孩子们和我每天都去滑。”
        - id: ch01-b50
          speaker: happy_jack
          text: “什么叫滑道？”
        - id: ch01-b51
          speaker: narrator
          text: 快乐杰克正坐在池塘岸边的大山核桃树上。老大自然妈妈听见问题，微微一笑。
        - id: ch01-b52
          speaker: mother_nature
          text: “小乔一家和我的其他孩子一样爱玩，也很懂得从生活里找乐趣。他们的一种玩法，就是在岸坡陡峭、水又很深的地方做一条滑道。冬天，滑道铺在雪上。夏天，他们就用泥做。他们从岸上一路滑下来，扑通一声落进水里，再爬上岸，从头滑一遍。到了冬天，他们会找水面不结冰的地方做滑道。天气虽冷，一家人玩得和夏天一样开心。”
        - id: ch01-b53
          speaker: peter_rabbit
          text: “这么说，小乔不会像土拨鼠约翰尼那样冬眠。”
        - id: ch01-b54
          speaker: little_joe_otter
          text: “我当然不冬眠！我也很喜欢冬天。我的外衣暖和极了，不管天气多冷，我都不会觉得冷。水面也不会处处结冰，总能找到下水的地方。我可以在冰层底下游出很远，所以就算到了冬天，也总能找到足够的食物。”
        - id: ch01-b55
          speaker: peter_rabbit
          text: “你除了鱼，还吃别的吗？”
        - id: ch01-b56
          speaker: little_joe_otter
          text: “噢，偶尔也会吃别的。我有时想换换口味，就吃一点新鲜的肉。要是碰上鱼很少的时候，我也会捉青蛙充饥。不过说到底，我最喜欢的还是鱼，尤其是鲑鱼和鳟鱼。”
        - id: ch01-b57
          speaker: happy_jack
          text: “你们一回生几个宝宝？”
        - id: ch01-b58
          speaker: little_joe_otter
          text: “通常一到三个，而且我们一年只养一窝。宝宝们出生在我的家里，那是一处挖在岸边的洞穴，住起来很舒服。水獭太太会在洞里收集许多树叶和青草，给孩子们铺成一个又大又柔软的窝。现在，要是你们不介意，我得继续沿欢笑溪往上游走了。水獭太太正在上游等我呢。”
        - id: ch01-b59
          speaker: narrator
          text: 老大自然妈妈让小乔尽管去。望着他消失，她叹了一口气。
        - id: ch01-b60
          speaker: mother_nature
          text: “我很喜欢小乔，可人类这样追捕他，实在让我难过。他那身毛皮很值钱，人们便没完没了地为了毛皮猎杀他。从前，这片辽阔国土上到处都有水獭，数量非常多，如今却已经很少见了。我真担心，那一天并不遥远。到了那时，世上也许就再也没有水獭小乔了。”
          emotion: sad
        - id: ch01-b61
          speaker: mother_nature
          text: “今天的课就到这里。鼬科还有另外两位成员，他们也像小乔和比利一样，因为毛皮不断遭到捕猎。明天我再讲给你们听。”
