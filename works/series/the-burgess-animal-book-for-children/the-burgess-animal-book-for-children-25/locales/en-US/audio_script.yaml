  chapters:
    - id: ch01
      title: Two Famous Swimmers
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Just after sunrise, the bank of the Smiling Pool made a lovely place for school. Everyone who could get there was on hand, including several pupils who had never attended before. Grandfather Frog sat on his big green lily pad. Jerry Muskrat was there, close to his house out in the pool. Spotty the Turtle had joined them too, and so had Longlegs the Heron. These neighbors had not really come to school. Instead, school had come to them, right where they lived or spent most of their time.
        - id: ch01-b02
          speaker: old_mother_nature
          text: "Good morning, Jerry Muskrat. Have you seen Billy Mink or Little Joe Otter?"
        - id: ch01-b03
          speaker: narrator
          text: Jerry's brown head had just appeared above the surface of the Smiling Pool when she greeted him pleasantly.
        - id: ch01-b04
          speaker: jerry_muskrat
          text: "Little Joe went down to the Big River last night. I don't know when he'll return, but he could show up any minute. Billy was here last evening. He said he was going fishing up the Laughing Brook, so he may be back soon too. You never know with Billy. He's always coming or going. I don't think he could sit still for five minutes."
        - id: ch01-b05
          speaker: billy_mink
          text: "Who can't sit still for five minutes?"
        - id: ch01-b06
          speaker: narrator
          text: The new voice belonged to Billy Mink. He was climbing onto the Big Rock.
        - id: ch01-b07
          speaker: old_mother_nature
          text: "Jerry was talking about you. Here is your chance to prove him wrong. Stay with us for a while, Billy, and remain right there on the Big Rock. I may have some questions for you."
        - id: ch01-b08
          speaker: narrator
          text: At that very moment, Billy dived into the Smiling Pool. A second later his brown head popped up, with a fat fish in his mouth. He scrambled onto the rock again and set down the fish. Then he looked at Old Mother Nature with a frightened expression.
        - id: ch01-b09
          speaker: billy_mink
          text: "I—I wasn't trying to disobey. I saw that fish and dived before I stopped to think. Please forgive me, Mother Nature. I won't do it again."
          emotion: fearful
        - id: ch01-b10
          speaker: old_mother_nature
          text: "Acting before you think can get you into trouble. Still, I'll forgive you this time. You have just shown your friends something useful. Eat your fish, and then be ready for my questions."
        - id: ch01-b11
          speaker: narrator
          text: While Billy sat on the Big Rock, everyone had a good look at him. One glance showed that he was a cousin of Shadow the Weasel. Billy was much larger, but he had the same general shape. His body was long and slender. His beautiful coat was dark brown and darkest along his back, while his chin was white. His round tail was covered with fairly long hair so dark that it looked almost black. His face resembled Shadow's, and his legs were rather short. As he sat eating the fish, he held his back in an arch.
        - id: ch01-b12
          speaker: narrator
          text: Old Mother Nature waited until Billy finished his meal.
        - id: ch01-b13
          speaker: old_mother_nature
          text: "Now, Billy, I have a few questions. Which do you prefer, night or day?"
        - id: ch01-b14
          speaker: billy_mink
          text: "Either one suits me. I sleep whenever I feel sleepy, night or day. When I wake up, I can hunt. It all depends on my mood."
        - id: ch01-b15
          speaker: old_mother_nature
          text: "And what do you hunt?"
        - id: ch01-b16
          speaker: narrator
          text: Billy grinned.
        - id: ch01-b17
          speaker: billy_mink
          text: "Anything that looks like a good meal. I'm not fussy at all. A fat Mouse, a tender young Rabbit, a Chipmunk, a Frog, Tadpoles, Chickens, eggs, birds, or fish will do. Whatever is easiest to catch suits me. I am especially fond of fish. That's one reason I live along the Laughing Brook and around the Smiling Pool. But I like some variety in my meals, so I often go hunting in the Green Forest. Sometimes I travel up to Farmer Brown's place for a Chicken. In spring, I search for birds' nests on the ground. And in winter, if Peter Rabbit happened to pass while I was hungry, I might be tempted to taste Peter."
        - id: ch01-b18
          speaker: narrator
          text: Billy gave Peter a wicked snap of his bright eyes. Peter shivered.
        - id: ch01-b19
          speaker: billy_mink
          text: "If Jerry Muskrat weren't my friend, I might be tempted to taste him too."
        - id: ch01-b20
          speaker: peter_rabbit
          text: "Pooh! You wouldn't dare take on Jerry Muskrat."
        - id: ch01-b21
          speaker: billy_mink
          text: "Wouldn't I? Ask Jerry what he thinks."
        - id: ch01-b22
          speaker: narrator
          text: Everyone looked at Jerry's face. Jerry was big, but that look made it plain that he feared Billy Mink.
        - id: ch01-b23
          speaker: old_mother_nature
          text: "How do you hunt when you're on land?"
        - id: ch01-b24
          speaker: billy_mink
          text: "The way any good hunter should, with my eyes, nose, and ears. Someone may have better ears, but I don't know who. I wouldn't trade noses with anyone. And my eyes are plenty good enough for me."
        - id: ch01-b25
          speaker: old_mother_nature
          text: "So you hunt much as your cousin Shadow the Weasel does."
        - id: ch01-b26
          speaker: narrator
          text: Billy nodded.
        - id: ch01-b27
          speaker: billy_mink
          text: "I suppose I do. But Shadow kills because he enjoys killing, and I don't. Once in a while I may catch more than I can eat, but I never mean to. I hunt because I need food."
        - id: ch01-b28
          speaker: old_mother_nature
          text: "You all saw Billy catch a fish. Now swim to the opposite bank, Billy, and show us how you run."
        - id: ch01-b29
          speaker: narrator
          text: Billy obeyed at once. He slipped into the pool, dived, and swam underwater for some distance. Then he came to the surface and continued with only his head showing. At the far bank he climbed out and started along the shore. He ran in a series of bounds, arching his back sharply between every leap. Then he vanished before their eyes and appeared again just as suddenly. He moved so quickly that none of the little watchers could keep their eyes on him. At moments, it seemed as if he had disappeared into the air. Of course, he had not. Billy was showing how cleverly he could use every small stick, stone, and bush for cover.
        - id: ch01-b30
          speaker: old_mother_nature
          text: "Billy is a great traveler. He truly loves going up and down the Laughing Brook, even when the journey is a long one. He feels quite at home wherever driftwood and rubbish have piled up. Because his body is so slender, he can slip beneath all sorts of things and squeeze into many kinds of holes. He is quick on land, though not quite as quick as Cousin Shadow. He is a good swimmer too, though not as good as his larger cousin, Little Joe Otter. But Billy has an advantage over both cousins. He is equally at home on land and in water."
        - id: ch01-b31
          speaker: old_mother_nature
          text: "People hunt Billy a great deal for his fur, and being hunted so often has made him very clever. Mrs. Billy hides her home nest well. She may put it in a hole in the bank, beneath an old stump, or under a heap of driftwood. Her babies are born in that nest, and they remain with their mother all summer. I should also mention that Billy can climb easily. You can find his kind all across this great country. When Billy lives in the Far North, his fur grows finer and thicker than it does in the South. I do wish Little Joe Otter were here. I had hoped he would come."
        - id: ch01-b32
          speaker: jerry_muskrat
          text: "Here he comes now! I rather thought he'd be back."
        - id: ch01-b33
          speaker: narrator
          text: Jerry pointed toward the place where the Laughing Brook flowed out of the Smiling Pool on its way to the Big River. A brown head was speeding toward them. No one could mistake it. That head belonged to Little Joe Otter. He came straight to the Big Rock and climbed up.
        - id: ch01-b34
          speaker: narrator
          text: Little Joe was a big fellow, one of the largest members of his family. He measured more than three feet from end to end. But no one looking at him could mistake him for anything but a member of the Weasel family. His legs were short, very short beside the length of his body. His tail was fairly long and broad. A rich brown coat covered him all over, though it was a little lighter underneath than it was along his back.
        - id: ch01-b35
          speaker: little_joe_otter
          text: "What's happening here?"
        - id: ch01-b36
          speaker: narrator
          text: Little Joe's eyes shone with interest.
        - id: ch01-b37
          speaker: old_mother_nature
          text: "We're having school beside the pool today, and we were hoping you'd appear. Little Joe, hold up one foot and spread your toes."
        - id: ch01-b38
          speaker: narrator
          text: Little Joe obeyed, though he looked puzzled. Peter stared at the foot.
        - id: ch01-b39
          speaker: peter_rabbit
          text: "Why, his toes have webs between them, just like Paddy the Beaver's!"
          emotion: surprised
        - id: ch01-b40
          speaker: little_joe_otter
          text: "Of course they do. Without webbed toes, I could never swim the way I do."
        - id: ch01-b41
          speaker: peter_rabbit
          text: "Can you swim faster than Paddy?"
        - id: ch01-b42
          speaker: little_joe_otter
          text: "I certainly can. If I couldn't, I'd probably go hungry most of the time."
        - id: ch01-b43
          speaker: peter_rabbit
          text: "Why would you be hungry? Paddy isn't."
        - id: ch01-b44
          speaker: little_joe_otter
          text: "Paddy doesn't eat fish, but I do. That's the difference. I can catch a fish even in a final dash for safety, and that takes speed."
        - id: ch01-b45
          speaker: old_mother_nature
          text: "Perhaps you could show us how you swim."
        - id: ch01-b46
          speaker: narrator
          text: Little Joe slid into the water. The Smiling Pool lay so still that everyone on the bank could see almost to the bottom. They watched him enter, and then he became little more than a brown streak. A second later, his head popped up across the pool.
        - id: ch01-b47
          speaker: peter_rabbit
          text: "Whew! I'm glad I'm not a fish!"
        - id: ch01-b48
          speaker: narrator
          text: Everyone laughed.
        - id: ch01-b49
          speaker: old_mother_nature
          text: "You have good reason to be glad. A fish would have very little chance with Little Joe nearby. Like Billy Mink, Little Joe is a great traveler. He especially likes going up and down the Laughing Brook and the Big River. Sometimes he travels over land. But his body is heavy and his legs are so short that walking on land is slow work for him. Whenever he crosses from one stream or pond to another, he chooses the smoothest path he can find."
        - id: ch01-b50
          speaker: old_mother_nature
          text: "He may travel quite far in winter. When he reaches a smooth hill, he slides down on his stomach. That reminds me, Little Joe. Don't you have a slippery slide somewhere near here?"
        - id: ch01-b51
          speaker: narrator
          text: Little Joe nodded.
        - id: ch01-b52
          speaker: little_joe_otter
          text: "Mine is down the Laughing Brook where the bank is steep. Mrs. Otter, our children, and I slide there every day."
        - id: ch01-b53
          speaker: happy_jack_squirrel
          text: "What is a slippery slide?"
        - id: ch01-b54
          speaker: narrator
          text: Happy Jack Squirrel was sitting in the Big Hickory-tree beside the pool. Old Mother Nature smiled at his question.
        - id: ch01-b55
          speaker: old_mother_nature
          text: "Little Joe and his family love to play as much as any of my children do. They get plenty of fun from life. One of their favorite games is making a slippery slide where the bank is steep and the water below is deep. In winter, they make the slide from snow. In summer, they use mud. They slide all the way down the bank, splash into the water, climb back to the top, and do it over and over. During winter, they build the slide beside a place where the water doesn't freeze. They have just as much fun sliding in winter as they do in summer."
        - id: ch01-b56
          speaker: peter_rabbit
          text: "Then Little Joe doesn't sleep all winter the way Johnny Chuck does."
        - id: ch01-b57
          speaker: little_joe_otter
          text: "Certainly not! I like winter too. My coat is so warm that I never get cold. There are always places where the water doesn't freeze. I can swim for long distances beneath the ice, and that means I can still find plenty of food."
        - id: ch01-b58
          speaker: peter_rabbit
          text: "Do you eat anything besides fish?"
        - id: ch01-b59
          speaker: little_joe_otter
          text: "Oh, sometimes. Once in a while I enjoy a little fresh meat, just for a change from my usual meals. When fish become scarce, I may eat Frogs instead. But I would rather have fish than anything else, especially Salmon and Trout."
        - id: ch01-b60
          speaker: happy_jack_squirrel
          text: "How many babies do you have at once?"
        - id: ch01-b61
          speaker: little_joe_otter
          text: "Usually one, two, or three, and we have only one family each year. The babies are born inside our comfortable house. It's a burrow that runs into the bank. Mrs. Otter makes a large, soft nest of leaves and grass in there, so everything is ready for them. Now, if no one minds, I think I'll be going farther up the Laughing Brook. Mrs. Otter is waiting for me there."
        - id: ch01-b62
          speaker: narrator
          text: Old Mother Nature told Little Joe he could go. When he had disappeared, she sighed.
        - id: ch01-b63
          speaker: old_mother_nature
          text: "I'm very fond of Little Joe Otter, and it troubles me deeply that people hunt him so much. His fur coat is valuable, and people are forever chasing him because they want it. Otters once lived in great numbers all over this wide country. Now they have become very scarce. I'm afraid the day may not be far away when there will be no Little Joe Otter at all."
          emotion: sad
        - id: ch01-b64
          speaker: old_mother_nature
          text: "I think that will be enough for today. There are two other members of the Weasel family we haven't discussed yet. Like Little Joe and Billy Mink, those two are continually hunted because of their fur coats. Tomorrow, I'll tell you all about them."
