audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: Light, observant, and gently suspenseful
        timbre: Warm and clear
        pace: Moderate
        pitch: Mid
    grandpa:
      display_name: Grandpa
      tts:
        delivery: Stubborn and comic, with warmth beneath the bluster
        timbre: Older and textured
        pace: Brisk with emphatic pauses
        pitch: Low to mid
    granddaughter:
      display_name: Maya
      tts:
        delivery: Calm, precise, and quietly amused
        timbre: Young and clear
        pace: Measured
        pitch: Mid to high
    neighbor:
      display_name: Mrs. Alvarez
      tts:
        delivery: Warm, direct, and dryly playful
        timbre: Mature and bright
        pace: Natural
        pitch: Mid
  chapters:
    - id: ch01
      title: The Missing Tomato
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Grandpa was salting a bowl of cold noodles when he noticed the empty stem. His hand stopped. The salt did not.
        - id: ch01-b02
          speaker: grandpa
          text: Another one,
        - id: ch01-b03
          speaker: narrator
          text: |2-
             he said.
            Maya looked through the kitchen window. Heat pressed the leaves flat against their stakes. Yesterday, four tomatoes had hung from the lowest cluster. Now there were three, and the torn stem still looked damp.
            Grandpa set down the salt. 
        - id: ch01-b04
          speaker: grandpa
          text: Mittens.
        - id: ch01-b05
          speaker: narrator
          text: Mittens belonged to Mrs. Alvarez next door. He was a white cat with two black ears and the steady, offended gaze of a judge. At that moment he lay on the garden wall washing one paw.
        - id: ch01-b06
          speaker: granddaughter
          text: Do cats like tomatoes?
        - id: ch01-b07
          speaker: narrator
          text: " Maya asked."
        - id: ch01-b08
          speaker: grandpa
          text: Thieves don’t fill out menus.
        - id: ch01-b09
          speaker: narrator
          text: |-
            She tasted the noodles and reached for a glass of water. Grandpa tasted them too, then silently added half a cucumber and another handful of noodles to the bowl.
            One tomato had vanished Monday. Grandpa thought he had counted wrong. A second disappeared Wednesday, and he found white hairs under the fence. Mrs. Alvarez had brushed Mittens in her yard that afternoon; loose fur had sailed everywhere. Grandpa had kept that part to himself.
            Now he fetched two old washbasins and propped them on sticks beside the tomato plants. String ran from each stick to the kitchen window.
        - id: ch01-b10
          speaker: grandpa
          text: When Mittens touches a tomato, I pull.
        - id: ch01-b11
          speaker: narrator
          text: " He demonstrated. Both basins crashed down and captured his own hat."
        - id: ch01-b12
          speaker: granddaughter
          text: Then what?
        - id: ch01-b13
          speaker: narrator
          text: " Maya asked."
        - id: ch01-b14
          speaker: grandpa
          text: Caught red-pawed.
        - id: ch01-b15
          speaker: granddaughter
          text: His paws are white.
        - id: ch01-b16
          speaker: grandpa
          text: Get the camera.
    - id: ch02
      title: The Falling Basin
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: |-
            They watched all afternoon. The kitchen felt like a shut oven because Grandpa refused to run the fan. Maya made three columns in her notebook: time, sighting, trace. A sparrow landed at 4:13. The mail carrier passed at 4:37. At 5:02, Mittens appeared on the wall.
            Grandpa gripped the strings.
            The cat took two steps and froze. He was not watching the tomatoes. He stared at an overturned wooden crate near the drainpipe. Something rustled behind it.
            Grandpa’s fingers twitched.
            Clang!
            Mittens flew over the wall. Mrs. Alvarez’s head appeared above it. 
        - id: ch02-b02
          speaker: neighbor
          text: What happened?
        - id: ch02-b03
          speaker: granddaughter
          text: A basin fell,
        - id: ch02-b04
          speaker: narrator
          text: |2-
             Maya said before Grandpa could answer.
            Beside the empty trap, Grandpa found a perfect paw print in damp soil. He pointed as if he had discovered buried treasure.
            Maya measured it. She found more prints by the wall, leading from Mrs. Alvarez’s yard to the crate. None reached the tomato bed.
        - id: ch02-b05
          speaker: granddaughter
          text: This proves he visited,
        - id: ch02-b06
          speaker: narrator
          text: " she said."
        - id: ch02-b07
          speaker: grandpa
          text: A thief has to visit.
        - id: ch02-b08
          speaker: granddaughter
          text: The mail carrier visited.
        - id: ch02-b09
          speaker: grandpa
          text: You think Mr. Lee stole my tomatoes?
        - id: ch02-b10
          speaker: granddaughter
          text: No. That’s the point.
        - id: ch02-b11
          speaker: narrator
          text: "Grandpa tucked a basin under each arm. "
        - id: ch02-b12
          speaker: grandpa
          text: Tomorrow we use a trap that doesn’t faint before the criminal arrives.
        - id: ch02-b13
          speaker: narrator
          text: His second plan involved flour. He swept the path smooth, then poured a pale ring around the plants.
        - id: ch02-b14
          speaker: granddaughter
          text: Does Grandma know?
        - id: ch02-b15
          speaker: narrator
          text: " Maya asked."
        - id: ch02-b16
          speaker: grandpa
          text: It’s old flour.
        - id: ch02-b17
          speaker: granddaughter
          text: The date says next month.
        - id: ch02-b18
          speaker: grandpa
          text: It aged quickly.
        - id: ch02-b19
          speaker: narrator
          text: Rain came at midnight. By morning, the flour had become paste. No tomato was missing, but two snails were stranded in it. Grandpa carried them to the hedge on leaves, muttering that the method had only been a trial.
    - id: ch03
      title: Tracks Under the Squash
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: |-
            For the third watch, he put one soft tomato under a tilted basket and covered the path with dry bean pods. He and Maya hid in the tool shed with two stools and a flashlight.
            After dark, the garden’s daytime noise folded away. Crickets worked in the corners. Damp soil smelled cool through the door crack. Grandpa shifted his stiff knee every few minutes, and a peppermint clicked against his teeth.
        - id: ch03-b02
          speaker: granddaughter
          text: Your mouth is louder than the bean pods,
        - id: ch03-b03
          speaker: narrator
          text: |2-
             Maya whispered.
            He moved the candy into his cheek.
            A white shape crossed the wall. Mittens dropped into the garden and went straight to the crate. His nose nearly touched the ground. Something gray-brown flashed behind the wood and vanished under the broad squash leaves.
            Mittens pounced. Bean pods snapped and rattled.
            Grandpa burst from the shed, struck his knee on the frame, and made a sound that was not quite a word. The cat shot up the wall. The gray-brown animal disappeared.
            The bait tomato was gone.
        - id: ch03-b04
          speaker: grandpa
          text: There!
        - id: ch03-b05
          speaker: narrator
          text: " Grandpa rubbed his knee with one hand and pointed with the other. "
        - id: ch03-b06
          speaker: grandpa
          text: What did I say?
        - id: ch03-b07
          speaker: narrator
          text: Maya crouched beside the basket. A drag mark ran from the tomato to the squash. The cat tracks crossed it sideways. Under a leaf she found two slender prints with long little toes.
        - id: ch03-b08
          speaker: granddaughter
          text: Don’t step here.
    - id: ch04
      title: Not Hiring a Thief
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: |-
            The next day, Maya showed the photographs to her science teacher. Instead of naming the animal, Ms. Green asked what lived nearby, came out at night, could hold food in its front paws, and could fit through the broken drain cover.
            After school, Maya spread fine sand by the crate. She added no bait. The ripening tomatoes went into mesh bags.
            Grandpa frowned at the bags. 
        - id: ch04-b02
          speaker: grandpa
          text: How will we catch it if it can’t steal anything?
        - id: ch04-b03
          speaker: granddaughter
          text: We’re trying to see it, not hire it.
        - id: ch04-b04
          speaker: narrator
          text: "Mrs. Alvarez was hanging a sheet on the other side of the wall. Grandpa lowered his voice. "
        - id: ch04-b05
          speaker: grandpa
          text: That cat was still in the garden.
        - id: ch04-b06
          speaker: granddaughter
          text: Chasing something.
        - id: ch04-b07
          speaker: grandpa
          text: Could be partners.
        - id: ch04-b08
          speaker: narrator
          text: Maya looked at him. He laughed once, then disguised it as a cough.
    - id: ch05
      title: The Visitor by the Drain
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: |-
            Moonlight filled the tool shed that night. Mittens did not come. Near nine, a pointed nose appeared beside the crate. Round ears followed, then dark eyes set in a pale mask. A raccoon stepped out, smaller and thinner than the ones Maya had seen near trash cans.
            It ignored the covered tomatoes. Under the vines it found half a split fruit and held it between its front paws. After several bites, it carried the rest toward the drain.
            Thin squeaks answered from inside.
        - id: ch05-b02
          speaker: grandpa
          text: Babies?
        - id: ch05-b03
          speaker: narrator
          text: |2-
             Grandpa said, much too loudly.
            The raccoon dropped the tomato. The shed hinge squealed as he leaned forward. In a blink she was back behind the crate.
            Maya switched on the flashlight but did not approach. The broken drain opening hid under ivy. Something small moved inside. Grandpa knelt for a long moment, keeping the beam on the ground outside the hole.
        - id: ch05-b04
          speaker: grandpa
          text: Not Mittens,
        - id: ch05-b05
          speaker: narrator
          text: " he said."
        - id: ch05-b06
          speaker: grandpa
          text: No.I never accused him to his face.
        - id: ch05-b07
          speaker: granddaughter
          text: You accused him under Mrs. Alvarez’s window.
        - id: ch05-b08
          speaker: narrator
          text: "Grandpa handed her the flashlight and stood. "
        - id: ch05-b09
          speaker: grandpa
          text: Pick six tomatoes in the morning. The best ones.
    - id: ch06
      title: Things Said Without Proof
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: At Mrs. Alvarez’s door, however, he hid the basket behind his leg. Mittens sat in her arms.
        - id: ch06-b02
          speaker: grandpa
          text: We had a visitor,
        - id: ch06-b03
          speaker: narrator
          text: " Grandpa began. "
        - id: ch06-b04
          speaker: grandpa
          text: A raccoon with kits. I mistook the tracks. Also, one of my basins made a great deal of noise and frightened your cat.
        - id: ch06-b05
          speaker: narrator
          text: "Mrs. Alvarez did not reach for the tomatoes. "
        - id: ch06-b06
          speaker: neighbor
          text: I thought the basin fell by itself.
        - id: ch06-b07
          speaker: narrator
          text: Grandpa’s ears turned pink. Maya studied an ant crossing the step.
        - id: ch06-b08
          speaker: grandpa
          text: I pulled early,
        - id: ch06-b09
          speaker: narrator
          text: " he said. "
        - id: ch06-b10
          speaker: grandpa
          text: And I said things where you could hear them. Things I couldn’t prove. I’m sorry.
        - id: ch06-b11
          speaker: narrator
          text: |-
            Mrs. Alvarez accepted the basket. She held a tomato under Mittens’s nose. He recoiled so dramatically that all three people laughed.
            A wildlife officer inspected the drain. The mother and kits needed time to leave, she said. The neighbors removed the crate, secured their trash, and installed a motion light away from the den. Nobody fed the raccoons or blocked the exit while the young were inside. Weeks later, when the family had moved on, the officer covered the broken opening.
            Grandpa found two dried tomato stems beneath the crate. He dropped them into one of Maya’s evidence envelopes.
            No more tomatoes vanished. Grandpa hung a small wooden sign beside the vines. On it he painted a tomato and a question mark.
        - id: ch06-b12
          speaker: neighbor
          text: Is that to scare thieves?
        - id: ch06-b13
          speaker: narrator
          text: " Mrs. Alvarez asked over the wall."
        - id: ch06-b14
          speaker: grandpa
          text: It’s to slow down the detective.
        - id: ch06-b15
          speaker: narrator
          text: |-
            Mittens leaped into the garden and sniffed the sign. Then he raised one back leg.
            Grandpa rushed forward. 
        - id: ch06-b16
          speaker: grandpa
          text: That evidence is not required!
        - id: ch06-b17
          speaker: narrator
          text: Maya laughed so hard that her notebook slipped out of her hands and landed open in the grass.
