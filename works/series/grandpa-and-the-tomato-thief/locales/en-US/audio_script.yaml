audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm, observant, and lightly amused
        timbre: clear and natural
        pace: measured
        pitch: medium
    grandpa:
      display_name: Grandpa
      tts:
        delivery: gruffly practical, warm underneath, candid when conceding
        timbre: low and weathered
        pace: unhurried
        pitch: low
    granddaughter:
      display_name: Maya
      tts:
        delivery: curious, steady, and direct
        timbre: bright and clear
        pace: natural and lightly brisk
        pitch: medium-high
    neighbor:
      display_name: Mrs. Alvarez
      tts:
        delivery: plainspoken, perceptive, and not unkind
        timbre: warm and firm
        pace: natural
        pitch: medium
  chapters:
    - id: ch01
      title: The Empty Stem
      blocks:
        - speaker: narrator
          text: Grandpa was salting a bowl of cold noodles when he noticed the empty stem. His hand stopped. The salt did not.
          id: ch01-b01
        - speaker: grandpa
          text: Another one,
          id: ch01-b02
        - speaker: narrator
          text: |2-
             he said.
            Maya looked through the kitchen window. Heat pressed the leaves flat against their stakes. Yesterday, four tomatoes had hung from the lowest cluster. Now there were three, and the torn stem still looked damp.
            Grandpa set down the salt. 
          id: ch01-b03
        - speaker: grandpa
          text: Mittens.
          id: ch01-b04
        - speaker: narrator
          text: Mittens belonged to Mrs. Alvarez next door. He was a white cat with two black ears and the steady, offended gaze of a judge. At that moment he lay on the garden wall washing one paw.
          id: ch01-b05
        - speaker: granddaughter
          text: Do cats like tomatoes?
          id: ch01-b06
        - speaker: narrator
          text: " Maya asked."
          id: ch01-b07
        - speaker: grandpa
          text: Thieves don’t fill out menus.
          id: ch01-b08
        - speaker: narrator
          text: |-
            She tasted the noodles and reached for a glass of water. Grandpa tasted them too, then silently added half a cucumber and another handful of noodles to the bowl.
            A paper calendar hung on the refrigerator. Grandpa had drawn a red circle around Saturday. Three men from the railroad crew he had worked with long ago were coming to lunch. All summer he had pinched side shoots from the tomato vines, tied the heavy branches, and carried water to the roots in the evening. He claimed store tomatoes were perfectly good. Still, he counted his own every morning.
            He had promised his friends tomato noodles and two ripe fruits apiece to take home. At their last lunch, one man had brought homemade pickles and another had brought peach jam. Grandpa, fresh from treatment for his knee, had arrived empty-handed. He never mentioned that part. The next morning, however, he had limped into the shed and brought out his seed box.
          id: ch01-b09
        - speaker: grandpa
          text: At this rate,
          id: ch01-b10
        - speaker: narrator
          text: " he said, looking at the bare stem, "
          id: ch01-b11
        - speaker: grandpa
          text: each guest can smell a leaf.
          id: ch01-b12
        - speaker: narrator
          text: "Maya turned her half-finished comic to a clean page. "
          id: ch01-b13
        - speaker: granddaughter
          text: Did you see Mittens take one?
          id: ch01-b14
        - speaker: grandpa
          text: A thief does not wait for an audience.
          id: ch01-b15
        - speaker: granddaughter
          text: Then I’m writing ‘tomato missing,’ not ‘cat stole tomato.’
          id: ch01-b16
        - speaker: narrator
          text: "Grandpa turned her pencil around and tapped the eraser on the page. "
          id: ch01-b17
        - speaker: grandpa
          text: You write. I catch.
          id: ch01-b18
        - speaker: narrator
          text: One tomato had vanished Monday. Grandpa thought he had counted wrong. A second disappeared Wednesday, and he found white hairs under the fence. Mrs. Alvarez had brushed Mittens in her yard that afternoon; loose fur had sailed everywhere. Grandpa had kept that part to himself.
          id: ch01-b19
    - id: ch02
      title: The Washbasins
      blocks:
        - speaker: narrator
          text: Now he fetched two old washbasins and propped them on sticks beside the tomato plants. String ran from each stick to the kitchen window.
          id: ch02-b01
        - speaker: grandpa
          text: When Mittens touches a tomato, I pull.
          id: ch02-b02
        - speaker: narrator
          text: " He demonstrated. Both basins crashed down and captured his own hat."
          id: ch02-b03
        - speaker: granddaughter
          text: Then what?
          id: ch02-b04
        - speaker: narrator
          text: " Maya asked."
          id: ch02-b05
        - speaker: grandpa
          text: Caught red-pawed.
          id: ch02-b06
        - speaker: granddaughter
          text: His paws are white.
          id: ch02-b07
        - speaker: grandpa
          text: Get the camera.
          id: ch02-b08
        - speaker: narrator
          text: |-
            They watched all afternoon. The kitchen felt like a shut oven because Grandpa refused to run the fan. Maya made three columns in her notebook: time, sighting, trace. A sparrow landed at 4:13. The mail carrier passed at 4:37. At 5:02, Mittens appeared on the wall.
            Grandpa gripped the strings.
            The cat took two steps and froze. He was not watching the tomatoes. He stared at an overturned wooden crate near the drainpipe. Something rustled behind it.
            Grandpa’s fingers twitched.
            Clang!
            Mittens flew over the wall. Mrs. Alvarez’s head appeared above it. 
          id: ch02-b09
        - speaker: neighbor
          text: What happened?
          id: ch02-b10
        - speaker: granddaughter
          text: A basin fell,
          id: ch02-b11
        - speaker: narrator
          text: |2-
             Maya said before Grandpa could answer.
            Beside the empty trap, Grandpa found a perfect paw print in damp soil. He pointed as if he had discovered buried treasure.
            Maya measured it. She found more prints by the wall, leading from Mrs. Alvarez’s yard to the crate. None reached the tomato bed.
          id: ch02-b12
        - speaker: grandpa
          text: This proves he visited,
          id: ch02-b13
        - speaker: narrator
          text: " she said."
          id: ch02-b14
        - speaker: grandpa
          text: A thief has to visit.
          id: ch02-b15
        - speaker: granddaughter
          text: The mail carrier visited.
          id: ch02-b16
        - speaker: grandpa
          text: You think Mr. Lee stole my tomatoes?
          id: ch02-b17
        - speaker: granddaughter
          text: No. That’s the point.
          id: ch02-b18
        - speaker: narrator
          text: "Grandpa tucked a basin under each arm. "
          id: ch02-b19
        - speaker: grandpa
          text: Tomorrow we use a trap that doesn’t faint before the criminal arrives.
          id: ch02-b20
        - speaker: narrator
          text: |-
            At dinner, Mrs. Alvarez passed a plate of corn fritters over the wall. Grandpa thanked her loudly, then shut the shed door on the washbasins. When she admired his tomatoes, he answered without offering her one, as he usually did.
            Maya pushed the plate toward him. 
          id: ch02-b21
        - speaker: granddaughter
          text: If you already know who did it, why are we watching?
          id: ch02-b22
        - speaker: narrator
          text: "Grandpa broke a crisp edge from a fritter. "
          id: ch02-b23
        - speaker: grandpa
          text: So the thief can’t argue.
          id: ch02-b24
        - speaker: granddaughter
          text: The cat can’t argue now.
          id: ch02-b25
        - speaker: grandpa
          text: So the cat’s owner can’t.
          id: ch02-b26
        - speaker: narrator
          text: |-
            The fritter in Maya’s hand stopped tasting as good. Until then, the case had felt like a summer game. Now she hoped they would catch nothing at all.
            His second plan involved flour. He swept the path smooth, then poured a pale ring around the plants.
          id: ch02-b27
        - speaker: granddaughter
          text: Does Grandma know?
          id: ch02-b28
        - speaker: narrator
          text: " Maya asked."
          id: ch02-b29
        - speaker: grandpa
          text: It’s old flour.
          id: ch02-b30
        - speaker: granddaughter
          text: The date says next month.
          id: ch02-b31
        - speaker: grandpa
          text: It aged quickly.
          id: ch02-b32
        - speaker: narrator
          text: |-
            Rain came at midnight. By morning, the flour had become paste. No tomato was missing, but two snails were stranded in it. Grandpa carried them to the hedge on leaves, muttering that the method had only been a trial.
            Maya recorded the result: rain, tracks ruined, no tomato missing. Grandpa scrubbed the path harder when he saw the word ruined.
            That afternoon he called her to the loose gap under the fence. The white hairs still clung to one brick. He blocked the gap with a board and set three pebbles in front of it. By evening, the pebbles had not moved. Yet half a green tomato lay below the vines, its torn flesh marked by tiny teeth.
            Grandpa began to say that the thief must already be inside the yard. Then he stopped. If Mittens had not crossed the blocked gap, the white hairs could not explain the new bite.
          id: ch02-b33
        - speaker: granddaughter
          text: Should I cross his name off?
          id: ch02-b34
        - speaker: narrator
          text: " Maya asked."
          id: ch02-b35
        - speaker: grandpa
          text: Use a dotted line,
          id: ch02-b36
        - speaker: narrator
          text: |2-
             Grandpa said.
            It was the first time he had allowed his answer to grow faint. Maya let him keep the dotted line.
          id: ch02-b37
    - id: ch03
      title: The Bean-Pod Alarm
      blocks:
        - speaker: narrator
          text: |-
            For the third watch, he spread dry bean pods along the paths between the wall, the crate, and the vines. They would make a harmless crackle if anything passed. He and Maya hid in the tool shed with two stools and a flashlight.
            After dark, the garden’s daytime noise folded away. Crickets worked in the corners. Damp soil smelled cool through the door crack. Grandpa shifted his stiff knee every few minutes, and a peppermint clicked against his teeth.
          id: ch03-b01
        - speaker: granddaughter
          text: Your mouth is louder than the bean pods,
          id: ch03-b02
        - speaker: narrator
          text: |2-
             Maya whispered.
            He moved the candy into his cheek.
            A white shape crossed the wall. Mittens dropped into the garden and went straight to the crate. His nose nearly touched the ground. Something gray-brown flashed behind the wood and vanished under the broad squash leaves.
            Mittens froze with his ears pointed toward the leaves. Behind the crate, bean pods snapped and rattled.
            Grandpa jumped up, struck his knee on the frame, and made a sound that was not quite a word. He stopped inside the doorway. The cat shot up the wall. The gray-brown animal disappeared.
            Several bean pods lay crushed.
          id: ch03-b03
        - speaker: grandpa
          text: There!
          id: ch03-b04
        - speaker: narrator
          text: " Grandpa rubbed his knee with one hand and pointed with the other. "
          id: ch03-b05
        - speaker: grandpa
          text: What did I say?
          id: ch03-b06
        - speaker: narrator
          text: Maya crouched beside the broken pods. The cat tracks crossed the path sideways and stopped short of the leaves. Under a leaf she found two slender prints with long little toes, heading toward the squash.
          id: ch03-b07
        - speaker: granddaughter
          text: Don’t step here.
          id: ch03-b08
        - speaker: narrator
          text: |-
            Grandpa’s sandal hung above the print. He wobbled on one leg, then stepped back. Retreating those six inches seemed harder for him than saying a whole sentence.
            Outside the shed, Grandpa picked up a broken bean pod and glanced at the wall. Mittens sat there washing his chest, as if someone else had just fled in panic.
          id: ch03-b09
        - speaker: grandpa
          text: He was there,
          id: ch03-b10
        - speaker: narrator
          text: " Grandpa said."
          id: ch03-b11
        - speaker: granddaughter
          text: Yes.
          id: ch03-b12
        - speaker: grandpa
          text: And something else crossed the pods.
          id: ch03-b13
        - speaker: granddaughter
          text: Yes.
          id: ch03-b14
        - speaker: grandpa
          text: But we still didn’t see what the other animal was.
          id: ch03-b15
        - speaker: narrator
          text: |-
            Maya wrote his words down without polishing them into a grand conclusion.
            The next day, Maya showed the photographs to her science teacher. Instead of naming the animal, Ms. Green asked what lived nearby, came out at night, could hold food in its front paws, and could fit through the broken drain cover.
            After school, Maya spread fine sand by the crate. She added no bait. The ripening tomatoes went into mesh bags.
            Grandpa frowned at the bags. 
          id: ch03-b16
        - speaker: grandpa
          text: How will we catch it if it can’t steal anything?
          id: ch03-b17
        - speaker: granddaughter
          text: We’re trying to see it, not hire it.
          id: ch03-b18
        - speaker: narrator
          text: "Mrs. Alvarez was hanging a sheet on the other side of the wall. Grandpa lowered his voice. "
          id: ch03-b19
        - speaker: grandpa
          text: That cat was still in the garden.
          id: ch03-b20
        - speaker: granddaughter
          text: Watching something.
          id: ch03-b21
        - speaker: grandpa
          text: Could be partners.
          id: ch03-b22
        - speaker: narrator
          text: |-
            Maya looked at him. He laughed once, then disguised it as a cough.
            Before the next watch, they oiled the shed hinge. Grandpa tested it three times, but the door still gave one short squeak at the final inch. He glared at the hinge. Maya wrote, door makes noise.
          id: ch03-b23
        - speaker: grandpa
          text: That counts as evidence?
          id: ch03-b24
        - speaker: granddaughter
          text: If we hear a squeak tonight, we’ll know an animal may not have made it.
          id: ch03-b25
        - speaker: narrator
          text: Grandpa studied the notebook, borrowed her pencil, and added, peppermint also makes noise. His letters leaned like the snails escaping his flour.
          id: ch03-b26
    - id: ch04
      title: The Face in the Moonlight
      blocks:
        - speaker: narrator
          text: |-
            Moonlight filled the tool shed that night. Mittens did not come. Near nine, a pointed nose appeared beside the crate. Round ears followed, then dark eyes set in a pale mask. A small Asian palm civet stepped out, gray-brown and cautious.
            It ignored the covered tomatoes. Under the vines it found half a split fruit and held it between its front paws. After several bites, it carried the rest toward the drain.
            Thin squeaks answered from inside.
          id: ch04-b01
        - speaker: grandpa
          text: Babies?
          id: ch04-b02
        - speaker: narrator
          text: |2-
             Grandpa said, much too loudly.
            The civet dropped the tomato. The shed hinge squealed as he leaned forward. In a blink she was back behind the crate.
            Maya switched on the flashlight but did not approach. The broken drain opening hid under ivy. Something small moved inside. Grandpa knelt for a long moment, keeping the beam on the ground outside the hole.
          id: ch04-b03
        - speaker: grandpa
          text: Not Mittens,
          id: ch04-b04
        - speaker: narrator
          text: " he said."
          id: ch04-b05
        - speaker: granddaughter
          text: No.
          id: ch04-b06
        - speaker: grandpa
          text: I never accused him to his face.
          id: ch04-b07
        - speaker: granddaughter
          text: You accused him under Mrs. Alvarez’s window.
          id: ch04-b08
        - speaker: narrator
          text: "Grandpa handed her the flashlight and stood. "
          id: ch04-b09
        - speaker: grandpa
          text: Pick six tomatoes in the morning. The best ones.
          id: ch04-b10
        - speaker: narrator
          text: |-
            He did not go straight to bed. When Maya came for water, she found him at the kitchen table choosing a basket. The large one looked showy, he said. The small one looked cheap. He repaired the loose handle of the middle basket with a strip of cane.
            Her notebook lay open beside him. Paw print, drag mark, and long-toed tracks faced one another across the pages. Under suspect: Mittens, Grandpa drew two heavy lines. Then he covered the words with a square of paper.
          id: ch04-b11
        - speaker: granddaughter
          text: Covering it doesn’t mean you never wrote it,
          id: ch04-b12
        - speaker: narrator
          text: " Maya said."
          id: ch04-b13
        - speaker: grandpa
          text: I know.
          id: ch04-b14
        - speaker: narrator
          text: " He tightened the cane around the handle. "
          id: ch04-b15
        - speaker: grandpa
          text: That’s why I still have to go tomorrow.
          id: ch04-b16
    - id: ch05
      title: Six Tomatoes
      blocks:
        - speaker: narrator
          text: At Mrs. Alvarez’s door, however, he hid the basket behind his leg. Mittens sat in her arms.
          id: ch05-b01
        - speaker: grandpa
          text: We had a visitor,
          id: ch05-b02
        - speaker: narrator
          text: " Grandpa began. "
          id: ch05-b03
        - speaker: grandpa
          text: An Asian palm civet with kits. I mistook the tracks. Also, one of my basins made a great deal of noise and frightened your cat.
          id: ch05-b04
        - speaker: narrator
          text: "Mrs. Alvarez did not reach for the tomatoes. "
          id: ch05-b05
        - speaker: neighbor
          text: I thought the basin fell by itself.
          id: ch05-b06
        - speaker: narrator
          text: Grandpa’s ears turned pink. Maya studied an ant crossing the step.
          id: ch05-b07
        - speaker: grandpa
          text: I pulled early,
          id: ch05-b08
        - speaker: narrator
          text: " he said. "
          id: ch05-b09
        - speaker: grandpa
          text: And I said things where you could hear them. Things I couldn’t prove. I’m sorry.
          id: ch05-b10
        - speaker: narrator
          text: |-
            Mrs. Alvarez accepted the basket. She held a tomato under Mittens’s nose. He recoiled so dramatically that all three people laughed.
            When the laughter ended, Mrs. Alvarez set the basket by her door. 
          id: ch05-b11
        - speaker: neighbor
          text: Those things you said made me angry. But I heard what you said today, too.
          id: ch05-b12
        - speaker: narrator
          text: |-
            Grandpa nodded. He did not explain the lunch or how much the first crop mattered. On the short walk home, his hand reached twice for the basket handle that was no longer there.
            His old friends still ate tomato noodles on Saturday. After the six-tomato apology, the bowl did not look very red, so Grandpa sliced the cucumbers thin and placed the last two tomatoes on top. One friend asked about the harvest.
          id: ch05-b13
        - speaker: grandpa
          text: I opened a case,
          id: ch05-b14
        - speaker: narrator
          text: " Grandpa said. "
          id: ch05-b15
        - speaker: grandpa
          text: The fee was six tomatoes.
          id: ch05-b16
        - speaker: narrator
          text: |-
            Maya nudged his ankle under the table.
            He looked at her and tried again. 
          id: ch05-b17
        - speaker: grandpa
          text: I paid them to the neighbor I blamed.
          id: ch05-b18
        - speaker: narrator
          text: |-
            No one teased him. Instead, the men competed over stories of accusing the wrong dog, carrying off the wrong umbrella, and blaming rain for a leaking roof. By the end, not even the noodle broth remained.
            A wildlife officer inspected the drain. The mother and kits needed time to leave, she said. The neighbors removed the crate, secured their trash, and installed a motion light away from the den. Nobody fed the civets or blocked the exit while the young were inside. Weeks later, when the family had moved on, the officer covered the broken opening.
            Grandpa found two dried tomato stems beneath the crate. He dropped them into one of Maya’s evidence envelopes.
            No more tomatoes vanished. Grandpa hung a small wooden sign beside the vines. On it he painted a tomato and a question mark.
          id: ch05-b19
        - speaker: neighbor
          text: Is that to scare thieves?
          id: ch05-b20
        - speaker: narrator
          text: " Mrs. Alvarez asked over the wall."
          id: ch05-b21
        - speaker: grandpa
          text: It’s to slow down the detective.
          id: ch05-b22
        - speaker: narrator
          text: |-
            Mittens leaped into the garden and sniffed the sign. Then he raised one back leg.
            Grandpa rushed forward. 
          id: ch05-b23
        - speaker: grandpa
          text: That evidence is not required!
          id: ch05-b24
        - speaker: narrator
          text: Maya laughed so hard that her notebook slipped out of her hands and landed open in the grass.
          id: ch05-b25
