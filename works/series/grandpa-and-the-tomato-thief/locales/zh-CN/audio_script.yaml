audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖、机敏、带克制幽默
        timbre: 清澈自然
        pace: 从容
        pitch: 中
    grandpa:
      display_name: 爷爷
      tts:
        delivery: 固执中带暖意，认错时坦率
        timbre: 低沉略沙
        pace: 稍慢
        pitch: 低
    granddaughter:
      display_name: 小满
      tts:
        delivery: 冷静好奇，追问直接
        timbre: 明亮清晰
        pace: 自然稍快
        pitch: 中高
    neighbor:
      display_name: 陈姨
      tts:
        delivery: 直爽敏锐但不刻薄
        timbre: 温暖结实
        pace: 自然
        pitch: 中
  chapters:
    - id: ch01
      title: 少掉的红果子
      blocks:
        - speaker: narrator
          text: 爷爷发现第三个番茄不见的时候，正举着盐罐往凉面里撒盐。他手停在半空，盐却还在往下落。
          id: ch01-b01
        - speaker: grandpa
          text: 又少一个。
          id: ch01-b02
        - speaker: narrator
          text: |-
            他说。
            小满从面盆里抬起头。窗外的菜园被午后的太阳晒得发白，竹架上几片叶子垂着，像热得懒得翻身。昨天傍晚，最下面那串番茄还有四个，今天只剩三个。断口湿润，旁边的土里留着一道弯弯的印子。
            爷爷把盐罐重重一放。
          id: ch01-b03
        - speaker: grandpa
          text: 黑耳朵。
          id: ch01-b04
        - speaker: narrator
          text: 黑耳朵是隔壁陈姨家的猫，通身雪白，只有两只耳朵黑得像蘸过墨。它这时正卧在墙头舔爪子，听见自己的名字，抬眼看了爷爷一下。
          id: ch01-b05
        - speaker: granddaughter
          text: 猫吃番茄吗？
          id: ch01-b06
        - speaker: narrator
          text: 小满问。
          id: ch01-b07
        - speaker: grandpa
          text: 它偷鱼以前也没先来问我。
          id: ch01-b08
        - speaker: narrator
          text: |-
            小满夹了一根面尝尝，咸得缩起肩膀。爷爷也吃了一口，默默往盆里添了半碗凉水。
            冰箱门上贴着一张旧挂历，星期六那格被爷爷画了个红圈。那天，他年轻时一起修铁路的三个老伙伴要来吃饭。入夏以来，他每天早晨给番茄打杈、绑枝，傍晚端一瓢水在根边慢慢浇，嘴上总说市场里的也一样，眼睛却天天数那几串果子。他答应做一盆只在夏天吃得到的番茄拌面，还打算让每个老伙伴带两个回家。
          id: ch01-b09
        - speaker: grandpa
          text: 照现在这个少法，
          id: ch01-b10
        - speaker: narrator
          text: 他盯着空梗，
          id: ch01-b11
        - speaker: grandpa
          text: 星期六只能让他们一人闻一下叶子。
          id: ch01-b12
        - speaker: narrator
          text: |-
            小满知道他心疼的不只是番茄。去年聚会时，赵爷爷带了自己酿的米酒，刘爷爷提来一罐腌豆角，只有爷爷因为膝盖刚做完治疗，空着手去。他回来后没说什么，第二天便翻出种子盒。如今第一批红透的番茄，像是他憋了大半年的一句话。
            小满把画了一半的连环画翻到空白页。
          id: ch01-b13
        - speaker: granddaughter
          text: 你到底看见黑耳朵摘了吗？
          id: ch01-b14
        - speaker: grandpa
          text: 没有。小偷还会等人看？
          id: ch01-b15
        - speaker: granddaughter
          text: 那我们先写‘番茄少了’，别写‘猫偷了’。
          id: ch01-b16
        - speaker: narrator
          text: 爷爷把她的铅笔转了个头，在纸上重重一点：
          id: ch01-b17
        - speaker: grandpa
          text: 你负责写。我负责抓。
          id: ch01-b18
        - speaker: narrator
          text: 第一个番茄是在星期一少的。爷爷以为自己记错了。第二个是在星期三，他绕着竹架走了三圈，在篱笆下发现几根白毛。陈姨那天正给黑耳朵梳毛，风一吹，白毛满院子飞。爷爷没提。如今第三个也没了，他觉得证据已经多得能装一簸箕。
          id: ch01-b19
    - id: ch02
      title: 两只搪瓷盆
      blocks:
        - speaker: narrator
          text: 他从工具棚里找出两个搪瓷盆，用木棍斜支在番茄架旁。木棍上系一根细绳，绳子一直牵到厨房窗下。
          id: ch02-b01
        - speaker: grandpa
          text: 猫一碰番茄，我就拉绳。
          id: ch02-b02
        - speaker: narrator
          text: 爷爷钻进屋，试着一拽。两只盆哐当扣下，把自己的草帽罩在里面。
          id: ch02-b03
        - speaker: granddaughter
          text: 然后呢？
          id: ch02-b04
        - speaker: narrator
          text: 小满问。
          id: ch02-b05
        - speaker: grandpa
          text: 然后人赃俱获。
          id: ch02-b06
        - speaker: granddaughter
          text: 哪个是赃？
          id: ch02-b07
        - speaker: narrator
          text: 爷爷把草帽救出来，拍掉上面的土。
          id: ch02-b08
        - speaker: grandpa
          text: 少抬杠。去拿相机。
          id: ch02-b09
        - speaker: narrator
          text: |-
            他们从下午等到日影爬上东墙。厨房里闷得像扣着锅盖，爷爷不许开电扇，怕听不见动静。小满在本子上画了三栏：时间、看见的东西、留下的痕迹。四点十三分，一只麻雀落在竹架上。四点四十，送水的大叔从巷口经过。五点零二，黑耳朵跳上墙，尾巴竖得笔直。
            爷爷抓紧细绳。
            黑耳朵沿墙头走了两步，忽然停下。它盯着菜园，不往番茄架看，倒盯着墙根那只倒扣的旧木箱。箱后传来窸窣一声。爷爷手一抖，盆先落了。
            哐！
            黑耳朵蹿得比影子还快。陈姨从隔壁探出头：
          id: ch02-b10
        - speaker: neighbor
          text: 怎么了？
          id: ch02-b11
        - speaker: granddaughter
          text: 盆掉了。
          id: ch02-b12
        - speaker: narrator
          text: |-
            小满抢在爷爷前面说。
            爷爷蹲在空盆旁，脸色和半熟的番茄差不多。他没抓到猫，却在盆边找到一枚清清楚楚的梅花脚印。
          id: ch02-b13
        - speaker: grandpa
          text: 看见没有？
          id: ch02-b14
        - speaker: narrator
          text: |-
            他压低声音。
            小满量了量。脚印只有拇指肚大，印在一小块刚浇过水的湿土上。她又去墙边看，那里也有一串猫爪印，却从陈姨家通向木箱，离番茄架还有半张桌子远。
          id: ch02-b15
        - speaker: granddaughter
          text: 只能证明它来过。
          id: ch02-b16
        - speaker: narrator
          text: 她说。
          id: ch02-b17
        - speaker: grandpa
          text: 小偷当然来过。
          id: ch02-b18
        - speaker: granddaughter
          text: 送水大叔也来过。
          id: ch02-b19
        - speaker: grandpa
          text: 你总不能说他偷番茄。
          id: ch02-b20
        - speaker: granddaughter
          text: 所以来过不等于偷了。
          id: ch02-b21
        - speaker: narrator
          text: 爷爷把盆夹在腋下往回走。
          id: ch02-b22
        - speaker: grandpa
          text: 明天换个不会自己响的。
          id: ch02-b23
        - speaker: narrator
          text: 吃晚饭时，陈姨隔着院墙送来一碟刚炸的藕盒。爷爷接得很快，谢得也响亮，偏偏把装盆的工具棚门关得严严实实。陈姨朝菜架看了一眼，说今年番茄结得真好。爷爷含糊地
          id: ch02-b24
        - speaker: grandpa
          text: 嗯
          id: ch02-b25
        - speaker: narrator
          text: |-
            了一声，没像往常那样摘一个让她尝。
            小满把藕盒往他那边推。
          id: ch02-b26
        - speaker: granddaughter
          text: 你要是已经认定了，还蹲守干什么？
          id: ch02-b27
        - speaker: narrator
          text: 爷爷咬开酥脆的边，过了一会儿才说：
          id: ch02-b28
        - speaker: grandpa
          text: 让它没话讲。
          id: ch02-b29
        - speaker: granddaughter
          text: 猫本来也不会讲话。
          id: ch02-b30
        - speaker: grandpa
          text: 让养猫的人没话讲。
          id: ch02-b31
        - speaker: narrator
          text: |-
            这句话说完，藕盒忽然没有刚才香了。小满合上本子。她本来觉得这是一桩暑假里的好玩案子，此刻却第一次希望爷爷什么也抓不到。
            第二天，他把菜园小路扫得干干净净，又在番茄周围薄薄撒了一圈面粉。小满看着白圈，问：
          id: ch02-b32
        - speaker: granddaughter
          text: 奶奶知道吗？
          id: ch02-b33
        - speaker: grandpa
          text: 过期的。
          id: ch02-b34
        - speaker: granddaughter
          text: 袋子上写着下个月才到期。
          id: ch02-b35
        - speaker: narrator
          text: 爷爷把袋口折起来：
          id: ch02-b36
        - speaker: grandpa
          text: 天气潮，提前过期了。
          id: ch02-b37
        - speaker: narrator
          text: |-
            夜里下了一阵小雨。清早，面粉变成了黏糊糊的白浆，番茄一个没少，倒有两只蜗牛在里面艰难跋涉。爷爷拿树叶把蜗牛送到墙外，嘴里说这办法本来就是试试看。
            小满把面粉圈也记进本子：雨，脚印无效，番茄未少。爷爷看见
            无效
            两个字，拿毛巾擦地的力气更大了。
            午后，他忽然叫小满去量墙洞。篱笆下那处松动的砖缝只有手掌宽，白毛就挂在砖角。爷爷用一块旧木板堵上，又特意在板前放了三颗小石子。
            傍晚，三颗石子都没动，菜架下却多了半个被咬开的青番茄。断面上留着细小的牙印。爷爷先说这说明小偷在院里，随后又沉默了——黑耳朵若一直没从砖缝进来，他最得意的白毛便不能说明今晚的事。
          id: ch02-b38
        - speaker: granddaughter
          text: 要不要把猫从名单上划掉？
          id: ch02-b39
        - speaker: narrator
          text: 小满问。
          id: ch02-b40
        - speaker: grandpa
          text: 先画一条虚线。
          id: ch02-b41
        - speaker: narrator
          text: |-
            爷爷说。
            这是他第一次肯让自己的结论变淡一点。小满便也退一步，没有追问虚线究竟要多虚。
          id: ch02-b42
    - id: ch03
      title: 豆荚报警器
      blocks:
        - speaker: narrator
          text: |-
            第三次蹲守前，爷爷没有再摆吃的，也没有支起竹筛。他只在矮墙、木箱和菜架之间的几条小路上铺了干豆荚；只要有东西经过，豆荚就会发出无害的脆响。他和小满搬两把小凳，藏进工具棚。门只开一指宽，正好看见番茄架。
            天黑后，菜园换了一副声音。白天叫个不停的蝉歇了，墙角却响起细碎的虫鸣。爷爷的膝盖不舒服，隔一会儿便悄悄换条腿。小满闻见泥土返潮的气味，也闻见爷爷口袋里薄荷糖的甜味。
          id: ch03-b01
        - speaker: granddaughter
          text: 你吃东西也有声音。
          id: ch03-b02
        - speaker: narrator
          text: |-
            她小声说。
            爷爷把糖含到腮帮另一边。
            墙头一白。黑耳朵来了。
            它跳进园里，先绕过竹筛，走向旧木箱。鼻子贴着箱底嗅了嗅，忽然伏下身。箱后有什么灰褐色的东西一闪，钻进南瓜叶底下。黑耳朵停住了，竖着耳朵望向叶子。木箱后面，豆荚被踩得一阵乱响。
            爷爷猛地站起来，膝盖撞到门框，疼得倒吸一口气。他停在门里。黑耳朵受惊跃上矮墙，那团灰褐色的东西也没了。
          id: ch03-b03
        - speaker: grandpa
          text: 我说吧！
          id: ch03-b04
        - speaker: narrator
          text: |-
            爷爷一手揉膝盖，一手指着地上。几片豆荚被踩碎了。
            小满蹲到碎豆荚旁。猫的脚印横着穿过小路，没有靠近南瓜叶。
            她掀起叶子，在湿土上找到两个窄长的小脚印。每个脚印前面有细细的趾痕，既不像猫，也不像鸟。
          id: ch03-b05
        - speaker: granddaughter
          text: 先别踩。
          id: ch03-b06
        - speaker: narrator
          text: |-
            她伸手拦住爷爷。
            爷爷的草鞋已经悬在脚印上方。他单脚站着，身子晃了两下，终于退回去。那动作比承认一句话费劲多了。
            工具棚外，爷爷捡起一截被踩碎的豆荚，又看了一眼墙头。黑耳朵蹲在那里舔胸口，仿佛刚才狼狈逃走的是别人。
          id: ch03-b07
        - speaker: grandpa
          text: 它确实在园里。
          id: ch03-b08
        - speaker: narrator
          text: 爷爷说。
          id: ch03-b09
        - speaker: granddaughter
          text: 对。
          id: ch03-b10
        - speaker: grandpa
          text: 还有别的东西踩过豆荚。
          id: ch03-b11
        - speaker: granddaughter
          text: 对。
          id: ch03-b12
        - speaker: grandpa
          text: 可我们还是没看清另一个是什么。
          id: ch03-b13
        - speaker: narrator
          text: |-
            小满把那句话写进本子，没有替他改得更像结论。
            第二天，小满把脚印照拿给自然课的老师看。老师没有直接告诉她，只叫她想想附近有哪些动物会在夜里出来，能用前爪拿东西，又能钻进很小的缝。放学后，她去旧木箱旁撒了一小片细沙，没有放诱饵，只把爷爷快摘的番茄用网袋套好。
            爷爷很不满意。
          id: ch03-b14
        - speaker: grandpa
          text: 套起来，它不来怎么办？
          id: ch03-b15
        - speaker: granddaughter
          text: 我们不是要请它来吃。
          id: ch03-b16
        - speaker: narrator
          text: 陈姨正在墙那边晒被单。爷爷瞥了一眼，声音放轻：
          id: ch03-b17
        - speaker: grandpa
          text: 那只猫昨晚明明就在园里。
          id: ch03-b18
        - speaker: granddaughter
          text: 它在看别的东西。
          id: ch03-b19
        - speaker: grandpa
          text: 也可能是同伙。
          id: ch03-b20
        - speaker: narrator
          text: |-
            小满看着他。爷爷自己先笑了半声，又赶紧咳嗽遮过去。
            为了不惊动未知的访客，他们把工具棚门轴抹了油。爷爷试着推了三次，门还是在最后一寸发出短短的
            吱
            。他恼火地盯着合页，小满却把这也记下来：门会响。
          id: ch03-b21
        - speaker: grandpa
          text: 这个也算证据？
          id: ch03-b22
        - speaker: granddaughter
          text: 等会儿要是有声音，我们就知道不一定是动物弄的。
          id: ch03-b23
        - speaker: narrator
          text: 爷爷看了本子半天，拿走她的铅笔，在下面补了一行：薄荷糖也会响。字写得歪，像几只刚从面粉里逃出来的蜗牛。
          id: ch03-b24
    - id: ch04
      title: 月光下的真相
      blocks:
        - speaker: narrator
          text: |-
            那晚月亮很亮，工具棚里不用开灯。黑耳朵没有出现。九点多，旧木箱后面伸出一个尖尖的鼻子。接着是圆耳朵，一双在月光下发亮的眼睛。那只黄鼠狼似的小兽小心地钻出来，却比黄鼠狼胖，尾巴蓬松，眼睛周围像戴着一副浅色小面具。
            它不是来碰网袋的。它在架下找了一圈，从草里翻出半个裂开的番茄，抱在前爪间啃。吃了几口，它叼起剩下的，钻回木箱后面。里面立刻响起几声细细的吱叫。
            爷爷忘了压低嗓门：
          id: ch04-b01
        - speaker: grandpa
          text: 还有小的？
          id: ch04-b02
        - speaker: narrator
          text: |-
            那只动物一惊，番茄落地。工具棚的门轴也在这时吱呀一响。它掉头钻回缝里，只留下沙上两行脚印。
            小满开了手电，没有追。木箱后是废弃的排水沟，洞口藏在常春藤下。沟里有幼兽的动静。爷爷蹲了很久，手电光始终照在洞口外面。
          id: ch04-b03
        - speaker: grandpa
          text: 不是黑耳朵。
          id: ch04-b04
        - speaker: narrator
          text: 他说。
          id: ch04-b05
        - speaker: grandpa
          text: |-
            嗯。
            我也没当着陈姨的面说它偷。
          id: ch04-b06
        - speaker: granddaughter
          text: 你在墙下说得很大声。
          id: ch04-b07
        - speaker: narrator
          text: 爷爷把手电递给她，自己站起来。
          id: ch04-b08
        - speaker: grandpa
          text: 明早摘一篮番茄。
          id: ch04-b09
        - speaker: narrator
          text: |-
            回屋以后，他没有立刻睡。小满喝水时，看见他坐在厨房里挑篮子：大的嫌太张扬，小的又像敷衍；竹篮提手松了，他便找细藤重新缠紧。桌上放着那本证据册，猫爪印、拖痕和长趾脚印排在一起。爷爷翻到第一页，在
            嫌疑：黑耳朵
            下面画了两道横线，最后索性用一张纸把那几个字贴住。
          id: ch04-b10
        - speaker: granddaughter
          text: 贴住不算没写过。
          id: ch04-b11
        - speaker: narrator
          text: 小满说。
          id: ch04-b12
        - speaker: grandpa
          text: 我知道。
          id: ch04-b13
        - speaker: narrator
          text: 爷爷没有抬头，
          id: ch04-b14
        - speaker: grandpa
          text: 所以明天还得去。
          id: ch04-b15
    - id: ch05
      title: 六个番茄
      blocks:
        - speaker: narrator
          text: 第二天，爷爷挑了最大最红的六个。到陈姨门口，他把篮子往身后藏了藏，先喊：
          id: ch05-b01
        - speaker: grandpa
          text: 在家吗？
          id: ch05-b02
        - speaker: narrator
          text: 陈姨抱着黑耳朵出来。黑耳朵一见爷爷就把脸转开。
          id: ch05-b03
        - speaker: grandpa
          text: 我家菜园来了个带孩子的野客。
          id: ch05-b04
        - speaker: narrator
          text: 爷爷说，
          id: ch05-b05
        - speaker: grandpa
          text: 前几天我……认错了脚印。盆也响得大了点，吓着你家猫。
          id: ch05-b06
        - speaker: narrator
          text: 陈姨没接篮子。
          id: ch05-b07
        - speaker: neighbor
          text: 你不是说盆自己掉的吗？
          id: ch05-b08
        - speaker: narrator
          text: 爷爷的耳朵慢慢红了。小满站在旁边，数墙缝里的蚂蚁。
          id: ch05-b09
        - speaker: grandpa
          text: 是我拉早了。
          id: ch05-b10
        - speaker: narrator
          text: 爷爷说，
          id: ch05-b11
        - speaker: grandpa
          text: 也在墙下说了几句没根据的话。对不住。
          id: ch05-b12
        - speaker: narrator
          text: |-
            陈姨这才接过番茄，拿起一个在黑耳朵鼻子前晃了晃。猫嫌弃地往后缩，三个人都笑起来。
            笑完以后，陈姨把篮子放到门边。
          id: ch05-b13
        - speaker: neighbor
          text: 你那几句话，我听见是会生气的。可你今天肯来，我也听见了。
          id: ch05-b14
        - speaker: narrator
          text: |-
            爷爷点点头。他没有解释自己多爱那几棵番茄，也没有提星期六的客人。回家走过短短一段墙根时，他的手几次去摸已经空了的篮把。
            星期六，老伙伴们还是吃到了番茄拌面。六个送给陈姨以后，盆里的红色少得可怜，爷爷便把黄瓜切得格外薄，还把最后两个番茄摆在最上面。赵爷爷问他今年收成怎样，他说：
          id: ch05-b15
        - speaker: grandpa
          text: 先办了一桩案子，交了六个番茄的学费。
          id: ch05-b16
        - speaker: narrator
          text: 小满在桌下踢了他一下。爷爷看她一眼，又补充：
          id: ch05-b17
        - speaker: grandpa
          text: 学费交给了被我冤枉的人。
          id: ch05-b18
        - speaker: narrator
          text: |-
            几个老人没有笑他，倒争着讲自己认错人、拿错伞、怪错天气的旧事。那盆面最后连汤都没剩。
            社区救助站的人来看过排水沟，说住客是一只带幼崽的果子狸。菜园边不能再留容易钻进去的木箱，也不要喂它，更不能堵住里面有幼崽的洞。他们在远离洞口的地方装了感应灯，等母兽带幼崽离开后再封排水沟的破口。
            爷爷把旧木箱搬走时，在底下找到两颗干瘪的番茄蒂。他捏着看了看，放进小满的证据袋。
            后来番茄没再少。爷爷在竹架边挂了块小木牌，上面只画了一只番茄和一个问号。陈姨路过时问：
          id: ch05-b19
        - speaker: neighbor
          text: 这是防贼的？
          id: ch05-b20
        - speaker: grandpa
          text: 提醒我自己的。
          id: ch05-b21
        - speaker: narrator
          text: |-
            爷爷说。
            黑耳朵从墙头跳下来，径直穿过菜园。它在木牌下闻了闻，抬起后腿，爷爷连忙冲过去：
          id: ch05-b22
        - speaker: grandpa
          text: 这个证据不许留！
          id: ch05-b23
        - speaker: narrator
          text: 小满笑得蹲在地上，手里的本子掉进了草里。
          id: ch05-b24
