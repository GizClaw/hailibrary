schema_version: 1
id: grandpa-and-the-tomato-thief
category: fiction
genre: everyday-life
style: wax-crayon
labels: {topics: [everyday-life, animals, food], themes: [problem-solving, fairness, sharing], moods: [playful, warm]}
research: none
premise: >
  爷爷的番茄接连少了几个，他认定是邻居家的猫干的，还设了好几个可笑的“陷阱”。
  孙女陪他一起蹲守、找证据，每次都推翻一个猜测，最后发现真相出人意料，
  爷爷也为冤枉了别人主动去道歉。靠幽默和证据推进，不靠说教。
characters:
  - {id: grandpa, description: 固执又好面子的爷爷}
  - {id: granddaughter, description: 冷静、爱找证据的孙女}
  - {id: neighbor, description: 养猫的邻居}
locales:
