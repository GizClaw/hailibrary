schema_version: 1
id: grandpa-and-the-tomato-thief
category: fiction
genre: everyday-life
style: wax-crayon
labels:
  topics: [everyday-life, animals, food, mystery]
  themes: [problem-solving, fairness, responsibility]
  moods: [playful, warm]
research: required
premise: >
  爷爷为给老友聚餐准备亲手种的番茄，番茄却接连失踪。他认定隔壁的猫是小偷，
  用几种可笑的陷阱试图证明自己。孙女小满坚持记录所见、区分痕迹与结论，陪他
  一次次蹲守并推翻猜测。他们最终发现一只带幼崽的果子狸借废弃排水沟藏身；
  爷爷既妥善处理野生访客，也带着最好的番茄向邻居为无凭据的指责道歉。
characters:
  - id: grandpa
    description: 固执好面子、手巧爱菜园，愿意在事实面前承担错误的爷爷
  - id: granddaughter
    description: 爱画画也爱记录、耐心追问证据的孙女小满
  - id: neighbor
    description: 直爽敏锐、养着白猫黑耳朵的邻居陈姨
  - id: cat
    description: 通身雪白、双耳乌黑、神情庄严的邻猫黑耳朵
  - id: civet
    description: 借排水沟藏身、夜间为幼崽觅食的果子狸母兽
locales:
  zh-CN:
    writer: 江笑
    working_title: 爷爷的番茄疑案
    length: 3000-4500 字
  en-US:
    writer: river-wink
    working_title: The Tomato Thief on Trial
    length: 2000-3000 words
picture_books:
  - {level: e, volumes: 2}
  - {level: m, volumes: 2}
cover_prompt: >-
  A humorous summer garden mystery with Grandpa crouching behind a tomato trellis and gripping a string attached to two harmless upside-down enamel washbasins, while his observant granddaughter kneels beside him with a small blank notebook and camera. Beyond them, a dignified white cat with two black ears watches from a low brick wall, and a subtle gray-brown masked face peeks from behind an overturned wooden crate near ivy without revealing the full answer. Grandpa is a lean Chinese man in his late sixties with warm tan skin, short silver hair, thick gray eyebrows, a pale blue short-sleeve shirt, olive trousers, brown sandals, and a battered straw hat. The granddaughter is a ten-year-old Chinese girl with warm light skin, straight black hair in a low ponytail tied with a yellow band, a sunflower-yellow T-shirt, denim shorts, and red canvas shoes. Lush green vines hold bright red tomatoes in the foreground; late-afternoon sunlight makes the scene playful, suspenseful, and warm. Wide 3:2 composition, clear silhouettes, no traps that could injure an animal, no visible text, letters, numbers, symbols, logos, captions, speech bubbles, signatures, or watermark.
