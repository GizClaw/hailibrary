schema_version: 1
required: true
sources:
  - url: "https://animaldiversity.org/accounts/Paradoxurus_hermaphroditus/"
    authority: Animal Diversity Web, University of Michigan Museum of Zoology
    claims:
      - Asian palm civets are nocturnal and are active at night.
      - Asian palm civets eat fruit and can hold food with their forepaws.
      - Females care for dependent young in sheltered den sites.
  - url: "https://www.nps.gov/samo/learn/management/deterring-wildlife.htm"
    authority: U.S. National Park Service, Santa Monica Mountains National Recreation Area
    claims:
      - People should not intentionally feed yard wildlife.
      - Outdoor food attractants and unsecured trash should be removed or secured.
      - An occupied access point must not be sealed until the animal and any young are out.
  - url: "https://www.maine.gov/ifw/fish-wildlife/wildlife/living-with-wildlife/avoid-resolve-conflict/evicting-animals.html"
    authority: Maine Department of Inland Fisheries and Wildlife
    claims:
      - A den entrance must not be sealed while dependent young remain inside.
      - Departure should be verified before the final opening is closed.
      - Experienced wildlife professionals should handle removal when ordinary exclusion is insufficient.
notes:
  - The garden mystery, characters, dialogue, and exact incident are fictional.
  - The civet is depicted only at a distance; the family is neither chased nor fed.
  - General humane-exclusion guidance supports the story's sequence of waiting for the family to leave, removing attractants, and closing the empty opening.
