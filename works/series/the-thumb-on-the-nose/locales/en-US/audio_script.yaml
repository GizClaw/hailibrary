audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts: {delivery: observant and conversational with restrained wonder, timbre: warm clear adult voice, pace: measured, pitch: medium}
    emile:
      display_name: Émile
      tts: {delivery: "earnest and alert, tightening when uncertain", timbre: clear young adult voice, pace: medium with quicker discoveries, pitch: medium-high}
    depauw:
      display_name: Louis De Pauw
      tts: {delivery: practical and direct with dry humor, timbre: sturdy weathered middle-aged voice, pace: steady, pitch: medium-low}
    dollo:
      display_name: Louis Dollo
      tts: {delivery: precise and quietly decisive, timbre: controlled young adult voice, pace: medium-slow, pitch: medium}
    miner:
      display_name: Jules
      tts: {delivery: watchful and plainspoken, timbre: rough working voice, pace: brisk, pitch: medium-low}
    visitor:
      display_name: Visitor
      tts: {delivery: curious and confidently mistaken, timbre: ordinary adult voice, pace: medium, pitch: medium}
    boy:
      display_name: Boy
      tts: {delivery: playful at first and then thoughtful, timbre: bright child voice, pace: quick, pitch: high}
  chapters:
    - id: ch01
      title: A Telegram in the Rain
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: |-
            Rain had polished the stones outside the Royal Museum of Natural History in Brussels. Inside, nineteen-year-old Émile was numbering the toe bones of a cave bear when boots came pounding up the stairs.

            Louis De Pauw walked in and pressed a telegram flat on the table. One wet corner stuck to his sleeve.
        - id: ch01-b02
          speaker: depauw
          text: Bernissart coal mine. Bones in a fault, three hundred twenty-two meters down. Pyrite's already damaging them. They want someone from the museum tomorrow.
        - id: ch01-b03
          speaker: narrator
          text: |-
            Émile looked across the room at a cast of an Iguanodon tooth. Its edge was worn like a tough leaf.

            More than fifty years earlier, the English doctor and geologist Gideon Mantell had studied teeth like that one, along with a few scattered bones. In 1825, he'd used them to describe Iguanodon—a name that meant “iguana tooth.” A famous reconstruction nearby showed the animal crouched like an enormous rhinoceros, with a pointed horn on its nose.

            Émile had copied that picture when he first came to the museum. He'd made every line dark and certain. His instructor said it looked as though he'd seen the animal alive.
        - id: ch01-b04
          speaker: emile
          text: Take me with you.
        - id: ch01-b05
          speaker: narrator
          text: De Pauw glanced at Émile's spotless cuffs.
        - id: ch01-b06
          speaker: depauw
          text: A mine isn't a drawing room.
        - id: ch01-b07
          speaker: emile
          text: That's why I should see it.
        - id: ch01-b08
          speaker: narrator
          text: |-
            De Pauw didn't answer. He just pushed the cave bear toe back across the table.

            But before dawn the next morning, Émile found a miner's lamp waiting for him beside the plaster, boards, and rolls of cloth.

            The lift cage dropped into darkness. Water flashed on the shaft walls, layer after layer. The white opening above them shrank to a coin, then closed. Coal grit worked into Émile's teeth, and the timber supports groaned somewhere below.

            A miner named Jules led them into a pocket of clay. His lamp picked out a row of brown joints.
        - id: ch01-b09
          speaker: miner
          text: These were the first ones we saw. Not one bone, and not a heap. Look at them. It's like they fell together.
        - id: ch01-b10
          speaker: narrator
          text: |-
            De Pauw crouched without touching a thing. He moved the light over ribs, vertebrae, a pelvis, and a folded hind limb. Much of the skeleton was still in place.

            A loose bone could belong to all kinds of imagined bodies. But when the bones still kept one another company, most of those guesses had nowhere to stand.

            Émile sketched the forelimb, tore out the page, and began again. The first time, without even noticing, he'd left room by the skull for the horn. Jules spotted the crumpled sheet.
        - id: ch01-b11
          speaker: miner
          text: Are you drawing what's down here, or what's waiting in your cabinet?
        - id: ch01-b12
          speaker: narrator
          text: Émile rubbed out a dark curve.
        - id: ch01-b13
          speaker: emile
          text: What's down here.
    - id: ch02
      title: The Bone Beside the Hand
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: |-
            There was no way to haul an Iguanodon out in one piece. De Pauw marked sections around each group of bones. The workers cut through the clay, wrapped each block in damp paper, cloth, and plaster, then packed it in wood.

            Tiny grains of pyrite glittered in the fossils. They looked beautiful in the lamplight, but air and moisture could make them split the bones. Every newly opened surface started a race: record it before it began to fall apart.

            Late one shift, grit pattered from the roof. Jules snuffed a nearby flame and sent everyone behind a support. Once the dust settled, De Pauw refused to go on until the passage had been braced. Émile stared at a set of half-exposed finger bones. Waiting felt dangerous too.
        - id: ch02-b02
          speaker: emile
          text: Another day could cost us that surface.
          emotion: fearful
        - id: ch02-b03
          speaker: depauw
          text: Another step could bury a worker. Those bones waited more than a hundred million years. They don't need you proving your devotion with a funeral.
        - id: ch02-b04
          speaker: narrator
          text: |-
            They went back only after the timbers were secure. Beside the wrist lay a thick, pointed bone. Émile's heart jumped. It looked remarkably like the horn in Mantell's old reconstruction.

            But it was lying by the hand.

            Before anyone lifted it, Émile drew its position. He measured its narrow end, its broad base, and the distance to the bones around it. Then another pointed piece appeared near the wrist on the other side of the same skeleton.
        - id: ch02-b05
          speaker: miner
          text: Two horns?
        - id: ch02-b06
          speaker: emile
          text: Or no horns.
          emotion: fearful
        - id: ch02-b07
          speaker: narrator
          text: |-
            That answer frightened him more than the mine had. The horn was in books. It was carved in stone. It had even been praised in the first drawing Émile ever displayed. His new evidence was only a graphite mark in a field notebook.

            Still, he darkened the outline.

            The crates took several seasons to travel from Bernissart to Brussels. Soon the museum workroom was packed with numbered boxes, and every coat smelled of damp clay, glue, and plaster. Émile matched each block to the sketches from underground. Copy one number wrong, and bones that belonged together might stay separated forever.

            He pinned his drawing of the pointed bone to the wall. Beside it, he put the old picture of the horned Iguanodon. The two sheets didn't look like answers anymore. They looked like questions staring at each other.

            One day, a visitor stopped beside the old model.
        - id: ch02-b08
          speaker: visitor
          text: This new mine will prove the horn was real, won't it?
        - id: ch02-b09
          speaker: narrator
          text: Émile opened his mouth, then chose his words.
        - id: ch02-b10
          speaker: emile
          text: We're still cleaning the bones.
        - id: ch02-b11
          speaker: visitor
          text: But Mantell put it there.
        - id: ch02-b12
          speaker: emile
          text: Mantell proposed that place.
        - id: ch02-b13
          speaker: narrator
          text: Émile heard the change as he said it—not proved, but proposed. The two words weren't far apart in length. In weight, they couldn't have been more different.
    - id: ch03
      title: What Mantell Could See
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: |-
            That evening, Émile opened Mantell's papers and plates. The great discovery of 1825 had started with teeth. Their shape pointed to something astonishing: a giant reptile that ate plants. As more bones appeared, Mantell kept changing the body he imagined.

            But that pointed bone hadn't come out of the ground with a label. Putting it on the nose was one way to read the little evidence they had. It wasn't something anyone had seen on a living animal.

            Émile wrote in the ledger, “Pointed bone—position unresolved.” The words looked too confident in capital letters, so he drew a thin line under “unresolved.”

            More crates didn't make the uncertainty disappear. They made it more exact. There was nowhere convincing for the spike to join the first skull. Or the second. But pointed bones kept turning up beside forelimbs, sometimes in pairs.

            Émile laid out three hands just as the records described them. Each had three stout middle fingers and one long, narrow outer finger. The pointed bone filled the one place left.

            He didn't press it in. A familiar shape could tempt anyone to make a bone fit the picture they wanted. The joining surfaces had to decide.
        - id: ch03-b02
          speaker: emile
          text: Please ask Mr. De Pauw to come.
        - id: ch03-b03
          speaker: narrator
          text: Émile sent a porter with the message. De Pauw arrived with plaster in his beard. He looked at the arranged hands, then at Émile—not at the bone.
        - id: ch03-b04
          speaker: depauw
          text: What have you changed?
        - id: ch03-b05
          speaker: emile
          text: Nothing yet.
        - id: ch03-b06
          speaker: depauw
          text: Good. Now show me why you want to.
        - id: ch03-b07
          speaker: narrator
          text: |-
            Émile started with the field drawings. The spike lay beside the wrist in the clay. A matching one appeared on the other side. Neither skull had a place for it.

            De Pauw turned the broad base toward the first digit, but he didn't join them.
        - id: ch03-b08
          speaker: depauw
          text: Write all of that down. Especially the part that disappoints the picture.
    - id: ch04
      title: A Skeleton That Would Not Hold Still
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: |-
            By 1882, the most complete specimens were ready to be mounted. They were too large for an ordinary room, so the work moved into the high former Saint George chapel.

            Wooden scaffolding climbed toward the vaulted ceiling. Ropes hung from the beams, with fossil bones suspended in rows. They looked like an orchestra waiting for someone to choose the tempo.

            A young scientist named Louis Dollo came to study the Bernissart animals. He'd separate neighboring bones and bring them together again from different angles. If a fit looked easy, he'd check it twice.

            De Pauw worried about how each fragile fossil could carry weight. Dollo asked how all the parts explained the animal's body. Between them, Émile passed tools, drew joining surfaces, and answered to his name from both sides of the scaffold.

            The old reconstruction showed a heavy Iguanodon on four straight legs. But the pelvis, spine, and uneven limbs from Bernissart told them to think again. At the time, Dollo argued for a mostly two-legged stance and compared the bones with those of large flightless birds.

            Later scientists would revise that steep, tail-dragging pose too. But in that chapel in 1882, the team could only answer as far as their evidence reached.

            The hand was still the hardest question. One afternoon, Émile brought the base of the spike toward the first digit. The curves met and settled together, like a swollen door finally slipping into its frame. De Pauw held the wrist steady.
        - id: ch04-b02
          speaker: depauw
          text: Don't press.
        - id: ch04-b03
          speaker: emile
          text: I'm not pressing.
        - id: ch04-b04
          speaker: depauw
          text: You're pressing with your breath.
        - id: ch04-b05
          speaker: narrator
          text: |-
            Dollo climbed down from the other platform. He compared the second hand, then asked for the record of another skeleton.

            This wasn't one lucky fit. The spikes came in pairs. The skulls had no sockets for them. And the bones kept appearing at the first digit. Three separate clues locked together. The old nose horn had nowhere left to stand.

            But Émile didn't feel triumphant. Across the chapel hung the copy he'd kept since his apprenticeship. Its lines were still dark, steady, and beautifully controlled. Move the spike to the hand, and his picture became publicly wrong. Everyone who had admired it would see.
        - id: ch04-b06
          speaker: emile
          text: We could mount the other parts first.
        - id: ch04-b07
          speaker: narrator
          text: De Pauw studied him for a moment.
        - id: ch04-b08
          speaker: depauw
          text: The bones can wait. Your ledger can wait. Neither one will write the conclusion for you.
    - id: ch05
      title: Four Drawings
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: |-
            That night, one work lamp burned under the chapel vault. Émile spread the old reconstruction on a table and held an eraser at the animal's nose.

            He remembered the vertebrae lying in order down in the mine. He remembered the empty space he'd left near the skull in his first sketch. You didn't have to be dishonest to be wrong. Sometimes an error grew beside one lonely piece of evidence, and a beautiful drawing kept feeding it.

            He didn't destroy the old sheet. He laid clean paper beside it instead.

            The first new drawing showed the spike by itself, with no position assigned. The second showed it beside the hands of several skeletons. The third compared the left and right hands and the surfaces that joined. Only the fourth offered a new reconstruction: the spike was the first digit, a modified thumb.

            The next morning, Émile handed all four drawings to Dollo.
        - id: ch05-b02
          speaker: emile
          text: Before, I drew the answer ahead of the evidence.
        - id: ch05-b03
          speaker: narrator
          text: Dollo turned back to the old horned animal.
        - id: ch05-b04
          speaker: dollo
          text: Don't erase this one.
        - id: ch05-b05
          speaker: emile
          text: Keep the mistake?
        - id: ch05-b06
          speaker: dollo
          text: Keep the reason it was possible, and the reason we changed it. Otherwise, people will think the right answer was sitting on the table all along.
        - id: ch05-b07
          speaker: narrator
          text: |-
            De Pauw brought over a plaster cradle holding the second hand. Together, they placed the matching bones. A spike pointed out from each thumb position. The nasal bones had no seat for either one.

            What were the spikes for? Defense? Fighting? Handling plants? Their shape alone couldn't settle it. Émile wrote “purpose uncertain” on the draft label. This time, he refused to give the story a more exciting ending than the evidence allowed.

            Then, before the public mounting, a knot on a support rope slipped. The wrist cradle tipped sideways. Émile reached for the fossil, but De Pauw caught the tray with his shoulder.
        - id: ch05-b08
          speaker: depauw
          text: Wedge!
          emotion: fearful
        - id: ch05-b09
          speaker: narrator
          text: |-
            Émile didn't grab the bone. He drove a wooden block under the platform, steadied the plaster base, and called for Dollo to shorten the upper rope. Between the three men, the thumb spike swung once, then stopped.

            When Émile stepped back, his palms were wet with sweat. De Pauw was breathing hard.
        - id: ch05-b10
          speaker: depauw
          text: This time, you saved the position before trying to be a hero.
        - id: ch05-b11
          speaker: emile
          text: You said the bones could wait.
        - id: ch05-b12
          speaker: depauw
          text: I said people shouldn't be buried. After four years, you've understood half the lesson.
    - id: ch06
      title: The Empty Place
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: |-
            When the mount was finished, an enormous Iguanodon rose inside the chapel. Its posture was still only the most likely one—not an answer locked in iron forever.

            Visitors tipped their heads back to see it. Some went straight to the hand, looking for the bone that used to sit on the animal's nose.

            One boy laughed at Émile's old drawing.
        - id: ch06-b02
          speaker: boy
          text: How could they put a thumb on its face?
          emotion: happy
        - id: ch06-b03
          speaker: narrator
          text: Émile almost answered, “Because they only had fragments.” Instead, he led the boy to the first of the four new drawings and covered the others with a folder.
        - id: ch06-b04
          speaker: emile
          text: If this were the only bone you'd found, where would you put it?
        - id: ch06-b05
          speaker: narrator
          text: The boy touched his forehead, then turned over his own hand.
        - id: ch06-b06
          speaker: boy
          text: I don't know.
        - id: ch06-b07
          speaker: emile
          text: That's what they were missing. Not intelligence. More bones.
        - id: ch06-b08
          speaker: narrator
          text: |-
            The boy walked slowly along the four drawings. At the last one, he raised his own thumb and turned it beneath the fossil spike. He didn't laugh again.

            After closing time, late sunlight came through the high windows and picked out the pale marks left by the scaffold. Émile filed away the horned drawing. Beside the new reconstruction, he left the eraser, worn down by years of corrections.

            It hadn't erased the past. It had only made a small empty place at the edge of the page, ready for whatever evidence came next.
