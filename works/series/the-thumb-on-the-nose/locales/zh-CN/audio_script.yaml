audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 冷静而有画面感，克制地保留疑问
        timbre: 温暖清晰的成年声音
        pace: 舒缓而有张力
        pitch: 中
    emile:
      display_name: 埃米尔
      tts:
        delivery: 认真、敏感，犹豫时略收紧
        timbre: 清亮的青年声音
        pace: 中等，发现线索时稍快
        pitch: 中高
    depauw:
      display_name: 德波
      tts:
        delivery: 务实直接，偶有干燥幽默
        timbre: 厚实略沙的中年声音
        pace: 稳健
        pitch: 中低
    dollo:
      display_name: 多洛
      tts:
        delivery: 专注、精确，不夸张
        timbre: 清楚克制的青年声音
        pace: 中等偏慢
        pitch: 中
    miner:
      display_name: 矿工朱尔
      tts:
        delivery: 警醒而坦率
        timbre: 粗粝有力
        pace: 简短利落
        pitch: 中低
    visitor:
      display_name: 参观者
      tts:
        delivery: 好奇且笃定
        timbre: 普通成年声音
        pace: 中等
        pitch: 中
    instructor:
      display_name: 老师
      tts:
        delivery: 简短赞许
        timbre: 柔和成年声音
        pace: 中等
        pitch: 中
    boy:
      display_name: 男孩
      tts:
        delivery: 先轻率后认真
        timbre: 明亮童声
        pace: 稍快
        pitch: 高
  chapters:
    - id: ch01
      title: 电报
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: |+
            1878年4月，布鲁塞尔的雨把皇家自然史博物馆门前的石路洗得发亮。十九岁的埃米尔正给一只洞熊的脚趾编号，楼梯上忽然响起急促的靴声。德波先生把一张电报按在桌上，纸角还沾着雨。

        - id: ch01-b02
          speaker: depauw
          text: 贝尼沙尔煤矿，三百二十二米深。发现大批骨头。
        - id: ch01-b03
          speaker: narrator
          text: 他把每个词都念得很慢，像怕其中一个会逃走，
        - id: ch01-b04
          speaker: depauw
          text: 矿里有黄铁矿，骨头一见空气就可能坏。我要去现场。
        - id: ch01-b05
          speaker: narrator
          text: |-
            

            埃米尔看向陈列柜。柜里有一颗禽龙牙的模型，边缘像被磨钝的叶片。五十多年前，英国医生兼地质学家吉迪恩·曼特尔从这类牙齿和少量骨头出发，在1825年发表了禽龙。名字的意思是鬣蜥的牙。旁边那幅流传很广的复原图里，禽龙粗壮得像一头巨大的犀牛，鼻端长着一枚尖角。

            那幅图是埃米尔进博物馆后临摹的第一件作品。他把线描得又黑又稳，老师还夸他
        - id: ch01-b06
          speaker: instructor
          text: 像亲眼见过
        - id: ch01-b07
          speaker: narrator
          text: |+
            。

        - id: ch01-b08
          speaker: emile
          text: 我也去。
        - id: ch01-b09
          speaker: narrator
          text: |-
            埃米尔说。

            德波扫了一眼他干净的袖口。
        - id: ch01-b10
          speaker: depauw
          text: 矿井不是画室。
        - id: ch01-b11
          speaker: emile
          text: 所以才该去。
        - id: ch01-b12
          speaker: narrator
          text: |-
            

            德波没有答应，只把桌上的洞熊趾骨推回他面前。第二天清晨，运送石膏、木板和麻布的车旁，却多放了一盏给埃米尔的矿灯。
    - id: ch02
      title: 地下的队伍
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: |-
            升降笼落入黑暗时，埃米尔第一次知道三百多米有多深。井壁的水一层层闪过去，头顶的白昼缩成硬币，最后连硬币也合上了。煤尘钻进牙缝，木梁在远处发出湿冷的呻吟。

            引路的矿工叫朱尔。他的灯照出黏土里一排暗褐色的骨节。
        - id: ch02-b02
          speaker: miner
          text: 先看见的是这些。不是一根，也不是一堆。它们像倒下以后还排着队。
        - id: ch02-b03
          speaker: narrator
          text: |+
            

            德波蹲下，不碰骨头，只沿着轮廓移动灯光。肋骨、椎骨、骨盆、后肢，许多部分仍保持着彼此的位置。零散的骨头允许人想出很多种动物；一具没有散开的骨架，却会让某些想法无处可站。

            埃米尔想起鼻角，心里像塞进一小块煤。他在速写本上画出黏土中的前肢，又画了一遍，因为第一次画时，他不由自主地给鼻端留了位置。

        - id: ch02-b04
          speaker: miner
          text: 你画的是眼前的东西，还是柜子里的东西？
        - id: ch02-b05
          speaker: narrator
          text: |-
            朱尔问。

            埃米尔把橡皮按在纸上。
        - id: ch02-b06
          speaker: emile
          text: 眼前的。
        - id: ch02-b07
          speaker: narrator
          text: |+
            

            矿下不能把巨骨整件拖走。德波让人沿骨架分出一块块黏土，用湿纸、麻布和石膏把每块包住，再装进木箱。黄铁矿在骨中闪着细小的金光，却会在空气和潮气中带来裂损。每打开一处，他们都得赶在变化之前留下位置和方向。

            一天傍晚，顶板落下一阵碎屑。朱尔扑灭旁边一盏灯，叫所有人退到木梁后。尘土停下后，德波坚持先加固通道。埃米尔盯着半露的手骨，急得手心发痒。

        - id: ch02-b08
          speaker: emile
          text: 再等一天，它也许会裂。
        - id: ch02-b09
          speaker: narrator
          text: |+
            他说。

        - id: ch02-b10
          speaker: depauw
          text: 再抢一步，人会被埋。
        - id: ch02-b11
          speaker: narrator
          text: 德波说，
        - id: ch02-b12
          speaker: depauw
          text: 骨头已经等了一亿多年。它不需要你拿命证明勤快。
        - id: ch02-b13
          speaker: narrator
          text: |-
            

            第二天，支撑加好，他们才继续。那只手旁边露出一枚粗大的尖骨。埃米尔的心猛地一跳：它和旧图上的鼻角太像了。

            可它躺在腕骨前面。
    - id: ch03
      title: 两张图
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: |-
            化石从矿下运到布鲁塞尔，花了整整几季。博物馆的工作间堆满编号木箱，湿黏土、胶和石膏混成一种永远洗不掉的气味。埃米尔负责把矿下速写同每块标本对上。只要一个编号抄错，原本相邻的骨头就可能在楼上永远分开。

            有一次，他在两只箱盖上发现同一个号码。搬运工催他先选一只，免得堵住过道。埃米尔却把两箱都留在原地，翻了半天矿下的方格图，最后从一处被煤水晕开的铅笔线认出差别：一箱来自左前肢，另一箱来自右前肢。德波没有夸他，只让他把所有备用标签也查一遍。那天晚上，埃米尔抄到手腕发僵，却第一次明白，谨慎并不总像发现那样耀眼。它常常只是让一件本来可能发生的错事没有发生。

            他把尖骨的图钉在墙上，旁边钉着旧式禽龙的鼻角图。两张图越看越不像答案，倒像两个互相盯着的问号。

            有参观者经过工作间，看见旧模型便问：
        - id: ch03-b02
          speaker: visitor
          text: 新发现会证明它真有这只角吧？
        - id: ch03-b03
          speaker: narrator
          text: |-
            

            埃米尔张了张嘴。
        - id: ch03-b04
          speaker: emile
          text: 我们还在清理。
        - id: ch03-b05
          speaker: visitor
          text: 可曼特尔已经画出来了。
        - id: ch03-b06
          speaker: emile
          text: 曼特尔提出过这种解释。
        - id: ch03-b07
          speaker: narrator
          text: |+
            埃米尔听见自己把证明换成了提出。这两个词只差一点声音，落在心里却很不一样。

            他查阅曼特尔留下的论文和图版。1825年的重要判断来自牙齿：这是一种巨大的植食性爬行动物。后来得到更多骨头，曼特尔不断改变自己想象中的身形。可那枚孤零零的尖骨没有带着说明书出土。把它放在鼻上，是有限材料支持的一种猜法，并不是亲眼看见。

            埃米尔在工作簿上写：尖骨——位置未定。他写得很小，随后又重描一遍。

            更多箱子打开后，问题反而变得具体。第一具骨架的头骨附近没有合适的连接面；第二具也没有。尖骨总在前肢附近出现，有时左右各一枚。埃米尔把三只手的骨头按发现位置摆在软垫上，中间三指粗壮，最外一指细长，而那枚尖骨恰好占住剩下的位置。

            他没有把它按下去。相似的形状能诱使人把骨头放进想要的位置；连接面才会告诉人它是否真的合适。

        - id: ch03-b08
          speaker: emile
          text: 叫德波先生来。
        - id: ch03-b09
          speaker: narrator
          text: 他说。
    - id: ch04
      title: 不肯站稳的骨架
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: |-
            到1882年，最完整的标本要开始装架了。普通房间容不下它，工作搬进了高大的圣乔治礼拜堂。木脚手架升向拱顶，绳索从梁上垂下，一节节骨头悬在半空，像一支尚未决定姿势的队伍。

            年轻的路易·多洛来到博物馆研究这些骨架。他常把相邻的骨头分开，再从不同角度合拢；如果一次拼合太顺，他反而会再检查一遍。德波关心每块脆弱化石怎样安全承重，多洛关心整副身体怎样彼此解释。埃米尔在两人之间递工具、画连接面，也忍受他们从两个方向同时喊他的名字。

            礼拜堂外仍有人等一个威风凛凛的新怪兽，报纸也更喜欢巨兽复活这样的说法。礼拜堂内却满是慢事：量一处关节，退三步看重心，再把绳子缩短半指。埃米尔渐渐发现，真正改变一幅复原图的时刻，往往没有号角，只有木架轻响和某个人说再比一具。

            旧复原把禽龙画成四脚着地的沉重大兽。贝尼沙尔骨架的后肢、骨盆和脊柱却要求重新考虑姿势。多洛当时主张让它主要以后肢站立，并拿大型走禽的骨架作比较。后来的人还会继续修正这种直立姿势，但在1882年的礼拜堂里，他们只能回答眼前的证据允许回答的问题。

            最麻烦的仍是手。一个下午，埃米尔将尖骨的底面贴近第一指的位置。两处表面顺着彼此的弧度合上，像一扇久未关严的门终于进了门框。

            德波托住腕部。
        - id: ch04-b02
          speaker: depauw
          text: 别用力。
        - id: ch04-b03
          speaker: emile
          text: 我没用力。
        - id: ch04-b04
          speaker: depauw
          text: 你连呼吸都在用力。
        - id: ch04-b05
          speaker: narrator
          text: |+
            

            多洛从脚手架另一侧下来。他比较另一只手，又让埃米尔拿出第二具标本的记录。不是一个偶然位置，而是左右成对；不是头骨上的接点，而是手部重复出现的第一指。三条线索扣在一起，旧鼻角失去了位置。

            埃米尔却没有立刻高兴。他望见墙边那幅自己保存多年的临摹。墨线依旧又黑又稳。若把尖骨移到手上，那张图就错了；夸奖过它的人也会看见。

        - id: ch04-b06
          speaker: emile
          text: 我们可以先装别的部分。
        - id: ch04-b07
          speaker: narrator
          text: |-
            他低声说。

            德波看了他一眼。
        - id: ch04-b08
          speaker: depauw
          text: 骨头会等。你的记录也会等。但它们不会替你写结论。
    - id: ch05
      title: 擦掉鼻角
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: |-
            那晚，礼拜堂只剩一盏工作灯。埃米尔把旧图铺在桌上，橡皮停在禽龙鼻端。他忽然想起矿下那排没有散开的椎骨，想起自己第一次画前肢时偷偷留出的空白。错误并不是从恶意里长出来的。有时它从一块太孤单的证据旁边长出来，又被一条漂亮的墨线养大。

            他没有毁掉旧图，而是在旁边铺开新纸。第一幅画尖骨孤立出现，下面不安排位置；第二幅画它在三具骨架中都靠近手；第三幅画左右手的对应关系和连接面。最后一幅才是新的复原：尖骨成为第一指，也就是拇指。

            第二天，他把四幅图交给多洛。
        - id: ch05-b02
          speaker: emile
          text: 我以前把答案画在证据前面了。
        - id: ch05-b03
          speaker: narrator
          text: |-
            

            多洛翻到旧图。
        - id: ch05-b04
          speaker: dollo
          text: 别擦。留下它。
        - id: ch05-b05
          speaker: emile
          text: 留下错误？
        - id: ch05-b06
          speaker: dollo
          text: 留下我们为什么会错，以及后来为什么改。
        - id: ch05-b07
          speaker: narrator
          text: 多洛把旧图和新图并排放好，
        - id: ch05-b08
          speaker: dollo
          text: 不然别人只会以为正确答案从来就摆在桌上。
        - id: ch05-b09
          speaker: narrator
          text: |+
            

            德波拿来另一只手的石膏托。他们把对应骨头逐一放妥。尖刺从两只手的拇指位置向外伸出，鼻骨上没有它的座位。至于它曾用来抵御捕食者、争斗，还是处理植物，仅凭形状仍不能定案。埃米尔在说明稿上写下用途尚不确定，没有添一个更勇猛、更好听的结局。

            公开装架前，一只托架的绳结忽然松滑。腕骨向旁边倾去，埃米尔本能地伸手，德波却先用肩膀顶住托板。

        - id: ch05-b10
          speaker: depauw
          text: 垫块！
        - id: ch05-b11
          speaker: narrator
          text: |-
            德波喊。

            埃米尔没有去抓化石。他踢紧木楔，托住石膏底座，多洛收短上方绳索。尖骨在三个人之间轻轻晃了一下，终于停稳。

            埃米尔退后时才发现掌心全是汗。德波喘着气说：
        - id: ch05-b12
          speaker: depauw
          text: 这回你先救了位置，没逞英雄。
        - id: ch05-b13
          speaker: emile
          text: 是你说的。骨头等得起。
        - id: ch05-b14
          speaker: depauw
          text: 我说的是人别被埋，可你总算听懂了一半。
    - id: ch06
      title: 手上的空位
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: |-
            装架完成后，巨大的禽龙立在礼拜堂里。它的姿势仍是最可能的姿势，不是从此封死的答案。参观者仰头看骨架，也有人走到手边，寻找那枚曾经长在鼻尖上的骨头。

            一个男孩对着埃米尔的旧图笑出了声。
        - id: ch06-b02
          speaker: boy
          text: 他们怎么会把拇指装到鼻子上？
        - id: ch06-b03
          speaker: narrator
          text: |+
            

            埃米尔本想说因为他们只有零散化石，话到嘴边却停住。他把男孩带到第一张新图前，让他先看那枚孤立的尖骨。

        - id: ch06-b04
          speaker: emile
          text: 如果你只找到这一块，你会放在哪里？
        - id: ch06-b05
          speaker: narrator
          text: |-
            

            男孩比了比自己的额头，又比了比手。
        - id: ch06-b06
          speaker: boy
          text: 我不知道。
        - id: ch06-b07
          speaker: emile
          text: 这就是当时最缺的东西。
        - id: ch06-b08
          speaker: narrator
          text: 埃米尔说，
        - id: ch06-b09
          speaker: emile
          text: 不是聪明，而是别的骨头。
        - id: ch06-b10
          speaker: narrator
          text: |-
            

            男孩沿着四幅图慢慢走，最后举起自己的拇指，对着禽龙手上的尖刺转了转。他没有再笑。

            闭馆后，夕光从高窗落下来，照亮脚手架留下的浅痕。埃米尔收拾桌面，把旧鼻角图放回文件夹，却把那块用过很多次的橡皮留在新图旁边。它没有擦掉过去。它只在纸边磨出一个空位，等下一件证据来。
