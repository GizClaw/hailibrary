audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts: {delivery: 冷静而有画面感，克制地保留疑问, timbre: 温暖清晰的成年声音, pace: 舒缓而有张力, pitch: 中}
    emile:
      display_name: 埃米尔
      tts: {delivery: 认真、敏感，犹豫时略收紧, timbre: 清亮的青年声音, pace: 中等，发现线索时稍快, pitch: 中高}
    depauw:
      display_name: 德波
      tts: {delivery: 务实直接，偶有干燥幽默, timbre: 厚实略沙的中年声音, pace: 稳健, pitch: 中低}
    dollo:
      display_name: 多洛
      tts: {delivery: 专注、精确，不夸张, timbre: 清楚克制的青年声音, pace: 中等偏慢, pitch: 中}
    miner:
      display_name: 矿工朱尔
      tts: {delivery: 警醒而坦率, timbre: 粗粝有力, pace: 简短利落, pitch: 中低}
    visitor:
      display_name: 参观者
      tts: {delivery: 好奇且笃定, timbre: 普通成年声音, pace: 中等, pitch: 中}
    instructor:
      display_name: 老师
      tts: {delivery: 简短赞许, timbre: 柔和成年声音, pace: 中等, pitch: 中}
    boy:
      display_name: 男孩
      tts: {delivery: 先轻率后认真, timbre: 明亮童声, pace: 稍快, pitch: 高}
  chapters:
    - id: ch01
      title: 电报
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: |-
            1878年4月，布鲁塞尔下着雨。皇家自然史博物馆门口的石板路，被冲得亮闪闪的。

            十九岁的埃米尔正给一只洞熊的脚趾编号。忽然，楼梯上传来一阵急促的靴子声。德波先生走进来，把一张电报往桌上一按，纸角还沾着雨水。
        - id: ch01-b02
          speaker: depauw
          text: 贝尼沙尔煤矿。地下三百二十二米。发现了大批骨头。
        - id: ch01-b03
          speaker: narrator
          text: 这几句话，德波念得特别慢，好像一快，哪个词就会跑掉。
        - id: ch01-b04
          speaker: depauw
          text: 矿里有黄铁矿。骨头一碰到空气，可能就坏了。我得去现场。
        - id: ch01-b05
          speaker: narrator
          text: |-
            埃米尔回头看向陈列柜。里头摆着一颗禽龙牙的模型，边缘像片磨钝了的叶子。

            五十多年前，英国有位医生兼地质学家，叫吉迪恩·曼特尔。他手里也只有这类牙齿和少量骨头。就凭这些，他在1825年发表了禽龙。这个名字，说白了就是“鬣蜥的牙”。

            模型旁边，还挂着一幅很有名的复原图。图里的禽龙又粗又壮，活像一头巨大的犀牛，鼻尖上还顶着一枚尖角。

            埃米尔刚进博物馆时，临摹的第一件作品就是它。每根线都描得又黑又稳。老师看了，还夸了一句：
        - id: ch01-b06
          speaker: instructor
          text: 画得跟你亲眼见过似的。
          emotion: happy
        - id: ch01-b07
          speaker: narrator
          text: 这时候，埃米尔马上接了一句：
        - id: ch01-b08
          speaker: emile
          text: 我也要去。
        - id: ch01-b09
          speaker: narrator
          text: 德波没急着回答，只扫了一眼他那对干干净净的袖口。
        - id: ch01-b10
          speaker: depauw
          text: 矿井可不是画室。
        - id: ch01-b11
          speaker: emile
          text: 那我才更该去。
        - id: ch01-b12
          speaker: narrator
          text: |-
            德波还是没说行，只把洞熊趾骨推回埃米尔面前。

            可第二天一早，装石膏、木板和麻布的车旁边，还是多出了一盏矿灯。那是给埃米尔的。
    - id: ch02
      title: 地下的队伍
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: |-
            升降笼一路往下，四周越来越黑。埃米尔这才真的明白，地下三百多米，到底有多深。

            井壁上的水光，一层层从眼前闪过去。头顶的亮光越缩越小，先是缩成一枚硬币，最后连硬币也合上了。煤尘直往牙缝里钻，远处的木梁还传来一阵湿冷的呻吟。

            给他们带路的矿工叫朱尔。他把灯往前一举，黏土里顿时亮出一排暗褐色的骨节。
        - id: ch02-b02
          speaker: miner
          text: 我们先看见的就是这些。不是一根，也不是乱成一堆。它们倒下以后，好像还排着队呢。
        - id: ch02-b03
          speaker: narrator
          text: |-
            德波蹲了下来。他没碰骨头，只让灯光贴着轮廓，一点点往前走。肋骨、椎骨、骨盆、后肢，好多地方还在原来的位置上。

            要是手里只有几块散骨头，拼成什么动物好像都有可能。可眼前这副骨架没有散开，有些原来的想法，一到它面前，就站不住了。

            埃米尔一下想起那枚鼻角，心里像塞进一小块煤。他在速写本上画出黏土里的前肢，看完又重画了一遍。第一遍下笔时，他还是不知不觉给鼻尖上的角留了位置。
        - id: ch02-b04
          speaker: miner
          text: 你画的到底是眼前这些，还是柜子里那些？
        - id: ch02-b05
          speaker: narrator
          text: 埃米尔听完，把橡皮按在了纸上。
        - id: ch02-b06
          speaker: emile
          text: 眼前这些。
        - id: ch02-b07
          speaker: narrator
          text: |-
            这么大的骨头，没法整件从矿底下拖出去。德波让大家顺着骨架，把黏土分成一块一块。每块都先拿湿纸、麻布和石膏包好，再装进木箱。

            骨头里的黄铁矿，会闪出细细的金光。可它一碰上空气和潮气，就可能把骨头弄裂。所以每清出一块，他们都得抢在骨头起变化前，记清位置和方向。

            一天傍晚，头顶忽然掉下一阵碎屑。朱尔一把扑灭旁边的灯，叫大家全退到木梁后头。等尘土落下去，德波说什么也不肯开工，一定要先加固通道。埃米尔盯着那只才露出一半的手骨，急得手心直发痒。
        - id: ch02-b08
          speaker: emile
          text: 再等一天，它没准就裂了。
          emotion: fearful
        - id: ch02-b09
          speaker: depauw
          text: 再抢一步，人没准就埋了。骨头已经等了一亿多年，不差这一天。你用不着拿命证明自己勤快。
        - id: ch02-b10
          speaker: narrator
          text: |-
            第二天，支撑总算加好了，他们这才接着清理。结果，就在那只手旁边，一枚粗大的尖骨露了出来。

            埃米尔心里猛地一跳。这东西，简直和旧图上的鼻角一模一样。

            可问题是，它偏偏躺在腕骨前面。
    - id: ch03
      title: 两张图
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: |-
            那么多化石，要从矿底下运回布鲁塞尔，可不是一天两天的事，前后足足忙了好几季。博物馆的工作间里，到处都是编号木箱。湿黏土、胶和石膏的味道混在一起，沾上了就洗不掉。

            埃米尔要做的，就是把矿下的速写跟每块标本一一对上。一个编号都不能错。要不然，本来挨在一起的骨头，到了楼上，可能就再也找不到彼此了。

            有一回，他发现两只箱盖上竟然写着同一个号码。搬运工催他赶紧选一只，别堵着过道。可埃米尔把两只箱子都留在原地，翻了半天矿下的方格图。最后，他从一条被煤水晕开的铅笔线里看出了差别：一箱是左前肢，另一箱是右前肢。

            德波也没夸他，只叫他把备用标签全都再查一遍。那天晚上，埃米尔一直抄到手腕都僵了。

            到这时候，埃米尔才明白：谨慎这件事，看着没新发现那么亮眼。可它真正管用的地方，往往就是把一个差点犯下的错拦住。

            埃米尔把尖骨的图钉到墙上，旁边就是那幅老式的禽龙鼻角图。两张图摆在一起，越看越不像答案，倒像是两个问号，你看着我，我看着你。

            这天，有个参观者经过工作间。他看见旧模型，就问埃米尔：
        - id: ch03-b02
          speaker: visitor
          text: 那这回的新发现，会证明它真的有这只角吧？
        - id: ch03-b03
          speaker: narrator
          text: 埃米尔张了张嘴，停了一下才说：
        - id: ch03-b04
          speaker: emile
          text: 还不能这么说，我们还在清理呢。
        - id: ch03-b05
          speaker: visitor
          text: 可曼特尔不是早就画出来了吗？
        - id: ch03-b06
          speaker: emile
          text: 曼特尔只是提出过这种解释。
        - id: ch03-b07
          speaker: narrator
          text: |-
            埃米尔自己也听见了：他没有说“证明”，说的是“提出”。听着只差一点，意思可完全不一样。

            他又找出曼特尔留下的论文和图版，从头查了一遍。1825年，曼特尔根据牙齿作出判断：这是一种巨大的、吃植物的爬行动物。后来骨头多了，他也一次次改过自己心里的禽龙模样。

            可那枚孤零零的尖骨，挖出来时又没带着说明书。大家手里的材料就那么一点。把它安到鼻子上，只能算一种猜法，没人真的亲眼见过。

            埃米尔在工作簿上写了几个字：“尖骨，位置还没定。”刚开始，他写得很小，随后又重重描了一遍。

            后来，箱子越开越多，事情反倒越来越清楚。第一具骨架的头骨附近，没有能接上尖骨的地方。第二具也没有。可尖骨呢？总在前肢附近出现，有时左边一枚，右边还有一枚。

            埃米尔把三只手的骨头，全按出土时的位置摆在软垫上。中间三根手指又粗又壮，最外边那根细细长长。剩下的位置，不多不少，正好轮到这枚尖骨。

            可埃米尔没把它按下去。两块骨头长得像，不等于真该接在一起。人很容易把骨头摆到自己希望的位置。到底对不对，还得看连接面合不合。
        - id: ch03-b08
          speaker: emile
          text: 去叫德波先生来看看。
    - id: ch04
      title: 不肯站稳的骨架
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: |-
            一晃到了1882年，最完整的那具标本总算要装架了。它太大，普通房间根本放不下，大家只好把活儿搬到高大的圣乔治礼拜堂里。

            木脚手架一直搭到拱顶，绳子从房梁上垂下来。骨头一节接一节，全吊在半空，像一支还没想好该怎么站的队伍。

            这时候，年轻的路易·多洛来到博物馆研究这些骨架。他常把相邻的骨头拆开，换个角度再合回去。哪次要是拼得太顺，他反而会多查一遍。

            德波操心的是：这些化石这么脆，怎么才能安全撑住重量？多洛琢磨的是：整副身体到底怎样才说得通？埃米尔夹在两人中间，一会儿递工具，一会儿画连接面，还得听着他们从两头一起喊自己的名字。

            礼拜堂外头，大家都等着看一头威风凛凛的新怪兽。报纸嘛，也更爱写“巨兽复活”。可礼拜堂里呢？全是慢工细活。先量一个关节，退后三步看重心，再把绳子收短半个指头。

            埃米尔渐渐看明白了：复原图真的被改掉时，哪有什么号角声。可能只是木架轻轻响了一下，也可能只是有人说：“再拿一具来比比。”

            老图里的禽龙，是一头四脚着地的沉重大兽。可贝尼沙尔的骨架呢？后肢、骨盆和脊柱都在提醒他们：原来的站法，恐怕得重新想想了。

            那时候，多洛觉得禽龙应该主要靠后肢站立，还拿大型走禽的骨架来比较。后来的人还会接着修改这种姿势。可在1882年的礼拜堂里，他们手里有多少证据，就只能把答案说到哪儿。

            不过，最让人头疼的，还是那只手。

            一天下午，埃米尔把尖骨的底面，慢慢贴近第一指的位置。两个表面顺着弧度一点点合了起来，就像一扇很久没关严的门，这回终于进了门框。德波在旁边托住腕部。
        - id: ch04-b02
          speaker: depauw
          text: 慢点，别使劲。
        - id: ch04-b03
          speaker: emile
          text: 我没使劲啊。
        - id: ch04-b04
          speaker: depauw
          text: 你连喘气都在使劲。
        - id: ch04-b05
          speaker: narrator
          text: |-
            多洛从脚手架另一头下来。他先拿另一只手来比，又让埃米尔找出第二具标本的记录。

            这下，那个位置就不能说是碰巧了。左右两边的骨头能配成一对；尖骨接不到头骨上，却总是出现在手的第一指。三条线索全对上了，旧图里的鼻角终于没了位置。

            可埃米尔没有马上高兴。他看见墙边那幅保存了好多年的临摹，上面的墨线还是那么黑，那么稳。

            要把尖骨移到手上，就得承认那幅画错了。当初夸过它的人，也都会看见这个错误。埃米尔开口时，声音压得很低：
        - id: ch04-b06
          speaker: emile
          text: 要不，我们先装别的地方吧。
        - id: ch04-b07
          speaker: narrator
          text: 德波抬眼看了看他。
        - id: ch04-b08
          speaker: depauw
          text: 骨头可以等，你的记录也可以等。可它们不会替你把结论写出来。
    - id: ch05
      title: 擦掉鼻角
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: |-
            那天晚上，礼拜堂里只剩一盏工作灯亮着。

            埃米尔把旧图铺到桌上，橡皮停在禽龙的鼻尖。他忽然想起矿下那排没有散开的椎骨，又想起自己第一次画前肢时，偷偷留下的空白。

            其实，人犯错，不一定是存心的。有时候证据太少，错误就从那块孤零零的证据旁边冒了出来。然后再添上一条漂亮的墨线，它就被一点点养大了。

            埃米尔没有把旧图毁掉。他只是在旁边铺开了一张新纸。

            第一幅图，他只画那枚孤零零的尖骨，不替它找位置。第二幅，画三具骨架里的尖骨都靠近手。第三幅，再画左右手怎么对应，连接面怎么合上。最后一幅才出现新的禽龙：尖骨不在鼻子上，而是第一指，也就是拇指。

            第二天，埃米尔拿着这四幅图，去找多洛。
        - id: ch05-b02
          speaker: emile
          text: 我以前啊，把答案画到证据前头去了。
        - id: ch05-b03
          speaker: narrator
          text: 多洛翻到那幅旧图。
        - id: ch05-b04
          speaker: dollo
          text: 别擦，留着吧。
        - id: ch05-b05
          speaker: emile
          text: 把这个错误也留着？
        - id: ch05-b06
          speaker: dollo
          text: 让人看看，我们当初为什么会错，后来又为什么要改。
        - id: ch05-b07
          speaker: narrator
          text: 多洛说着，把旧图和新图并排放在了一起。
        - id: ch05-b08
          speaker: dollo
          text: 要不然，别人还以为正确答案一开始就摆在桌上呢。
        - id: ch05-b09
          speaker: narrator
          text: |-
            德波拿来另一只手的石膏托。大家把能对上的骨头，一块块放好。两只手的拇指上，都有一根尖刺朝外伸着。鼻骨呢？那上头根本没有它的位置。

            可这根尖刺到底是干什么用的？是挡住捕食者，是打架，还是处理植物？光看形状，谁也说不准。所以埃米尔在说明稿上写：“用途还不能确定。”这一次，他没再替它编个更威风、更好听的故事。

            就在公开装架前，一只托架的绳结突然滑松。腕骨眼看往旁边一歪，埃米尔本能地伸手。可德波更快，先用肩膀顶住了托板。
        - id: ch05-b10
          speaker: depauw
          text: 快，垫块！
          emotion: fearful
        - id: ch05-b11
          speaker: narrator
          text: |-
            埃米尔这回没去抓化石。他一脚把木楔踢紧，托住石膏底座。多洛也赶紧把上头的绳子收短。

            那枚尖骨，就在三个人中间轻轻晃了一下。然后，总算稳住了。

            埃米尔退了一步，这才发现手心里全是汗。德波还在旁边喘着气。
        - id: ch05-b12
          speaker: depauw
          text: 这回你先顾着托稳位置，没急着逞英雄。
        - id: ch05-b13
          speaker: emile
          text: 这不是你说的吗？骨头等得起。
        - id: ch05-b14
          speaker: depauw
          text: 我说的是，别让人埋在矿下。可你总算听懂一半了。
    - id: ch06
      title: 手上的空位
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: |-
            装架终于完成了。巨大的禽龙，就这样站在礼拜堂里。不过，这个姿势只是当时最说得通的一种，可不是什么永远不能改的标准答案。

            参观的人仰头看骨架，也有人特意走到它手边，找那枚从鼻尖上搬过来的骨头。

            有个男孩看着埃米尔的旧图，忽然笑出了声：
        - id: ch06-b02
          speaker: boy
          text: 他们怎么会把拇指装到鼻子上去啊？
          emotion: happy
        - id: ch06-b03
          speaker: narrator
          text: |-
            埃米尔本想告诉他：那是因为当时的人，手里只有几块零散的化石。可话到嘴边，他又停了。

            他把男孩领到第一张新图前，先让他看看那枚孤零零的尖骨。
        - id: ch06-b04
          speaker: emile
          text: 要是你只找到这么一块，你觉得，该把它放在哪儿？
        - id: ch06-b05
          speaker: narrator
          text: 男孩先比了比自己的额头，又比了比自己的手。
        - id: ch06-b06
          speaker: boy
          text: 我不知道。
        - id: ch06-b07
          speaker: emile
          text: 这就是当时最缺的。缺的不是聪明，是别的骨头。
        - id: ch06-b08
          speaker: narrator
          text: |-
            男孩顺着四幅图，一张张慢慢看过去。最后，他举起自己的拇指，对着禽龙手上的尖刺转了转。这一回，他没再笑。

            闭馆以后，夕阳从高高的窗子照进来，把脚手架留在地上的浅痕照亮了。

            埃米尔收拾好桌面，把旧鼻角图放回文件夹。可那块用了好多次的橡皮，他没有收走，而是留在新图旁边。

            这块橡皮，没有擦掉过去。它只是在纸边磨出了一个空位，等着下一件证据来。
