schema_version: 1
id: the-thumb-on-the-nose
type: historical-fiction
category: fiction
genre: history
style: epic-fantasy-illumination
labels: {topics: [history, science], themes: [curiosity, discovery, responsibility], moods: [mysterious, reflective, hopeful]}
research: required
premise: >
  1878 年，布鲁塞尔皇家自然史博物馆的虚构年轻助手埃米尔参与接收和整理贝尼沙尔煤矿出土的禽龙化石。
  他曾把前人依据零散材料提出的鼻角复原当成定论，却在清理多具近乎完整的骨架、比较左右手之后，亲眼看见尖骨属于拇指。
  故事尊重曼特尔、矿工、德波与多洛的真实贡献，以助手的选择表现证据不足时的推测和新证据出现后的修正。
characters:
  - {id: emile, description: 虚构的比利时年轻博物馆助手，起初害怕公开承认自己相信的复原可能错了。}
  - {id: depauw, description: 真实人物路易·弗朗索瓦·德波，负责贝尼沙尔化石的发掘、清理与装架。}
  - {id: dollo, description: 真实人物路易·多洛，1882 年起研究并主持禽龙骨架复原。}
  - {id: miner, description: 代表发现和保护化石的贝尼沙尔矿工的合成人物，不冒用具体发现者身份。}
locales:
  zh-CN: {writer: 砚舟, working_title: 鼻尖上的拇指, length: 3000-4500 字}
  en-US: {writer: inkstone-observer, working_title: The Thumb on the Nose, length: 2000-3000 words}
picture_book: {level: n}
cover_prompt: >-
  A dramatic wordless historical scene inside the vast former Saint George chapel in Brussels in 1882: a nearly complete Iguanodon skeleton hangs from ropes and wooden scaffolding while a small sharp fossil bone is poised visually between an outdated squat reconstruction with the spike on its nose in the dim left background and the correctly assembled hand in the bright right foreground. The correct hand must show five anatomically distinct digits: exactly one conical spike at the first digit or thumb, three central blunt weight-bearing hoof-like digits with no sharp claws, and one slender flexible fifth digit; never show several spikes or a row of raptor-like claws. Emile, a slim Belgian museum assistant age twenty-three with wavy chestnut hair, gray-blue eyes, rolled white sleeves, a moss-green waistcoat, brown trousers, and a leather apron, stands at the center holding the fossil with both hands; Louis De Pauw, a sturdy middle-aged Belgian preparator with a full dark beard, charcoal work coat, and ochre apron, watches beside a plaster cradle; Louis Dollo, a slender young Belgian scientist with neatly parted dark hair, a short mustache, dark navy frock coat, and copper waistcoat, studies the matching hand bones. Monumental vertical depth, historically plausible tools, warm human focus, clear contrast between guess and evidence, no labels or legible paper, no visible text, letters, numbers, logos, captions, signatures, or watermarks.
