audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖从容，带一点一本正经的幽默
        timbre: 清晰醇厚
        pace: 舒缓，遇到惊奇处略微加快
        pitch: 中
    pinocchio:
      display_name: 匹诺曹
      tts:
        delivery: 任性直率，嘴硬而孩子气，危急时急促慌张
        timbre: 清亮，带木偶般的脆响
        pace: 偏快，争辩时更急
        pitch: 中高
    geppetto:
      display_name: 杰佩托
      tts:
        delivery: 活泼直率，发怒时火爆而有喜剧感
        timbre: 苍老而响亮
        pace: 中等，争吵时急促
        pitch: 中高
  chapters:
    - id: ch01
      title: 黑暗尽头的老人
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            匹诺曹告别金枪鱼，便在大鲨鱼肚子里摸索着往前走。他一步一步走向远处那点微弱的光。越往前，光就越亮。他一直走到跟前，终于看清了。
        - id: ch01-b02
          speaker: narrator
          text: >-
            你们猜，他看见了什么？猜一千次也未必猜得中。那里有一张小桌子。桌上放着绿色玻璃瓶，瓶口插着一支点亮的蜡烛。一个瘦小的老人坐在桌边吃活鱼。那些鱼还鲜活得很，有时竟从老人嘴里跳出来。
        - id: ch01-b03
          speaker: narrator
          text: >-
            匹诺曹看清老人是谁，一阵从没料到的狂喜冲上心头，他激动得几乎失去了理智。他想笑，又想哭，还有千言万语要说，可所有的话全挤在一起，出口只剩下颠三倒四、断断续续的几个词。最后，他总算欢呼一声，张开双臂，紧紧搂住老人的脖子。
        - id: ch01-b04
          speaker: pinocchio
          text: >-
            爸爸，我亲爱的爸爸！我总算找到您了！我再也不离开您，再也不，再也不！
          emotion: happy
        - id: ch01-b05
          speaker: geppetto
          text: >-
            我的眼睛没有骗我吗？你真的是匹诺曹，是我的孩子？
          emotion: surprised
        - id: ch01-b06
          speaker: narrator
          text: >-
            小老人一面问，一面使劲揉着眼睛。
        - id: ch01-b07
          speaker: pinocchio
          text: >-
            是我，真的是我！您已经原谅我了，对不对？爸爸，您对我这么好，可我却做了那么多糊涂事。要是您知道，这一路有多少灾祸落在我头上！
          emotion: happy
        - id: ch01-b08
          speaker: pinocchio
          text: >-
            那天，您卖掉外套，给我买了识字课本，让我去上学。我却溜去看木偶戏。戏班班主要把我扔进火里，好烤熟他的羊肉。后来给我五枚金币，让我带回家交给您的，也是那位班主。我遇见狐狸和猫。他们带我到红虾旅店，吃得像两头饿狼。我半夜一个人上路，又碰到了强盗。
        - id: ch01-b09
          speaker: pinocchio
          text: >-
            他们追，我就跑。我一直跑，他们一直追，最后把我吊在大橡树上。蓝头发的美丽小姑娘派马车接走我。医生们见了我，马上说，要是他没死，那就证明他还活着。后来我撒了谎，鼻子越长越长，连房门都出不去了。
        - id: ch01-b10
          speaker: pinocchio
          text: >-
            接着，我又和狐狸、猫去埋剩下的四枚金币。还有一枚，已经在旅店花掉了。鹦鹉见了我就哈哈大笑。别说两千枚金币，我连自己的四枚也一枚不剩。法官听说我被抢，为了让强盗称心，反倒立刻把我关进监狱。
        - id: ch01-b11
          speaker: pinocchio
          text: >-
            我从监狱出来，看见田里有一串漂亮葡萄，结果踩进捕兽夹。那个农夫做得也有道理。他给我套上狗项圈，让我替他守着鸡舍。后来知道我是清白的，才肯放我走。那条尾巴冒烟的大蛇看见我，又笑个不停，最后竟笑得胸口血管爆裂。
        - id: ch01-b12
          speaker: pinocchio
          text: >-
            我回到美丽小姑娘的家，她却已经死了。鸽子看见我哭，就告诉我，他见过您。您正在造一条小船，要出海找我。我说，要是我也有翅膀就好了。鸽子问我想不想去找爸爸，我说当然想，可是谁能带我去呢？他说他来带我。我又问该怎么去，他就让我爬到他的背上。
        - id: ch01-b13
          speaker: pinocchio
          text: >-
            我们就这样飞了一整夜。第二天早晨，所有望着海面的渔夫都告诉我，海上有个可怜人坐在小船里，眼看就要淹死了。离得那么远，我还是马上认出了您。我的心告诉我，那就是爸爸。我不停地向您打手势，想叫您赶快回到岸上去。
    - id: ch02
      title: 杰佩托的两年
      blocks:
        - id: ch02-b01
          speaker: geppetto
          text: >-
            我也认出你了，也想回到岸边。可我能怎么办呢？海上风浪那么大，一个巨浪掀翻了小船。附近那条可怕的大鲨鱼看见我落水，就游过来，伸出舌头卷住我，像吞一只小苹果馅饼那样，把我咽进肚子。
        - id: ch02-b02
          speaker: pinocchio
          text: >-
            您在这里关了多久？
        - id: ch02-b03
          speaker: geppetto
          text: >-
            从那一天起，差不多快两年了。两年啊，匹诺曹，在我看来简直像两个世纪那么长！
          emotion: sad
        - id: ch02-b04
          speaker: pinocchio
          text: >-
            那您靠什么活下来？这支蜡烛是哪里来的？点火的火柴呢？谁给您的？
        - id: ch02-b05
          speaker: geppetto
          text: >-
            别急，听我慢慢说。掀翻我小船的那场暴风雨里，还有一艘商船沉了。水手都得救了，船却沉到海底。那天，大鲨鱼胃口好得不得了。他吞完我，又把那艘船也吞了。
        - id: ch02-b06
          speaker: pinocchio
          text: >-
            一艘船？他怎么吞得下去？
          emotion: surprised
        - id: ch02-b07
          speaker: geppetto
          text: >-
            他一口就吞下去了，只把主桅吐了出来。那根桅杆像鱼刺一样，卡进了他的牙缝。幸好那艘船满载着罐头肉、饼干、一瓶瓶葡萄酒、葡萄干、奶酪、咖啡、糖、蜡烛，还有一盒盒蜡火柴。全靠这批天赐的东西，我才在大鲨鱼肚子里撑过两年。
        - id: ch02-b08
          speaker: geppetto
          text: >-
            可现在，所有储备都吃光了。食品间里一样东西也没剩。你看见的这支蜡烛，就是最后一支。
        - id: ch02-b09
          speaker: pinocchio
          text: >-
            等它烧完呢？
        - id: ch02-b10
          speaker: geppetto
          text: >-
            烧完以后，我们两个就只能留在黑暗里了。
        - id: ch02-b11
          speaker: pinocchio
          text: >-
            爸爸，那就一刻也不能耽搁。我们得想办法逃出去。
        - id: ch02-b12
          speaker: geppetto
          text: >-
            逃？我们怎么逃？
        - id: ch02-b13
          speaker: pinocchio
          text: >-
            从大鲨鱼嘴里逃。我们跳进海里，再游到岸上。
        - id: ch02-b14
          speaker: geppetto
          text: >-
            你说得容易，可我不会游泳呀。
        - id: ch02-b15
          speaker: pinocchio
          text: >-
            那怕什么？我会游。您骑到我肩膀上，我一定能把您平安送到岸边。
        - id: ch02-b16
          speaker: geppetto
          text: >-
            别做梦了，孩子！你这个小木偶还不到一码高，哪有力气驮着我游过大海？
          emotion: sad
        - id: ch02-b17
          speaker: narrator
          text: >-
            杰佩托摇着头，露出一丝苦笑。
        - id: ch02-b18
          speaker: pinocchio
          text: >-
            您试一试就知道了！
    - id: ch03
      title: 走向大鲨鱼的嘴
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            匹诺曹不再多说。他拿起蜡烛，在前面照着路。
        - id: ch03-b02
          speaker: pinocchio
          text: >-
            爸爸，跟我来。您别害怕。
        - id: ch03-b03
          speaker: narrator
          text: >-
            父子俩走了好一阵，穿过大鲨鱼的身体，又走过他的胃。来到那条大喉咙的入口，他们觉得最好先停下来。得把四周看个清楚，再挑一个最合适的时机逃出去。
        - id: ch03-b04
          speaker: narrator
          text: >-
            这条大鲨鱼已经很老了，又有气喘和心悸，睡觉时只好一直张着嘴。匹诺曹走近喉咙口，抬头向上望。越过怪物张开的大嘴，他竟看见一大片星空，还有美丽的月光。
        - id: ch03-b05
          speaker: pinocchio
          text: >-
            就是现在！大鲨鱼睡得像只冬眠鼠，海面没有风浪，月光照得跟白天一样亮。跟我来吧，爸爸。很快，我们就安全了。
        - id: ch03-b06
          speaker: narrator
          text: >-
            匹诺曹压低声音说完，便带着爸爸爬上海怪的喉咙。他们来到那张大嘴里，踮起脚尖，一步一步沿着舌头往前走。
    - id: ch04
      title: 月光下纵身一跃
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            就在最后一跳以前，匹诺曹停下来，对爸爸说。
        - id: ch04-b02
          speaker: pinocchio
          text: >-
            骑到我肩膀上，胳膊紧紧搂着我的脖子。剩下的都交给我。
        - id: ch04-b03
          speaker: narrator
          text: >-
            杰佩托在儿子肩头坐稳了。匹诺曹心里有了把握，便纵身跳进海中，奋力向前游去。
        - id: ch04-b04
          speaker: narrator
          text: >-
            海面平得像一层油，明亮的月光照在水上。大鲨鱼依然睡得昏沉。就算大炮在他耳边齐声轰鸣，也休想把他吵醒。
