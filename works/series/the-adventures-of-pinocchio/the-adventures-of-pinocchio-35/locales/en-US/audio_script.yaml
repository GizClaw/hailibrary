audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm and story-rich
        timbre: clear and rounded
        pace: measured
        pitch: medium
    pinocchio:
      display_name: Pinocchio
      tts:
        delivery: impulsive and defiant
        timbre: bright and wooden
        pace: quick
        pitch: medium-high
    geppetto:
      display_name: Geppetto
      tts:
        delivery: plainspoken and caring
        timbre: warm and weathered
        pace: unhurried
        pitch: low
  chapters:
    - id: ch01
      title: A Happy Surprise for Pinocchio
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            After saying goodbye to his friend the Tunny, Pinocchio felt his way through the darkness inside the Dog-Fish. He could barely see where he was going, so he moved one careful step at a time toward the faint light far ahead. The farther he walked, the brighter it became. He kept going until at last, he reached it.
        - id: ch01-b02
          speaker: narrator
          text: >-
            And what do you think he found when he got there? You could guess a thousand times. There stood a little table, all set out, with a candle burning in a green glass bottle. A little old man sat at the table, eating live fish. Those fish were so lively that while he ate them, every now and then, one jumped right out of his mouth.
        - id: ch01-b03
          speaker: narrator
          text: >-
            The sight filled Pinocchio with such great, unexpected joy that he almost lost his senses. He wanted to laugh. He wanted to cry. He wanted to say a thousand things all at once. Instead, he could only stammer a few confused, broken words. At last, he let out a joyful cry, opened his arms, flung them around the old man's neck, and held him tight.
        - id: ch01-b04
          speaker: pinocchio
          text: >-
            Oh, Papa! My dear Papa! I finally found you! I'll never leave you again. Never, never!
          emotion: happy
        - id: ch01-b05
          speaker: geppetto
          text: >-
            Are my eyes really telling me the truth? Is that truly you, my dear Pinocchio?
          emotion: surprised
        - id: ch01-b06
          speaker: narrator
          text: >-
            The little old man rubbed his eyes as he spoke.
        - id: ch01-b07
          speaker: pinocchio
          text: >-
            Yes, yes! It's really me! You have forgiven me, haven't you? Oh, Papa, you're so good. And I was so different! If only you knew all the terrible things that happened to me!
          emotion: happy
        - id: ch01-b08
          speaker: pinocchio
          text: >-
            Just think of it. The day you sold your coat to buy me a spelling book so I could go to school, I ran off to see the puppet show instead. The showman wanted to throw me on his fire and use me to roast his mutton. Then he changed his mind and gave me five gold pieces to bring home to you.
        - id: ch01-b09
          speaker: pinocchio
          text: >-
            Then I met the Fox and the Cat. They took me to the Red Craw-Fish Inn, where they ate like wolves. I left by myself in the middle of the night, and assassins came after me. I ran, and they followed. I ran again, and they were still behind me. I kept running until they caught me and hung me from a branch of the Big Oak.
        - id: ch01-b10
          speaker: pinocchio
          text: >-
            The beautiful Child with blue hair sent a little carriage to bring me to her. The doctors looked me over and said right away, "If he isn't dead, that proves he's still alive." Then I happened to tell a lie. My nose started growing and didn't stop until it was so long that I couldn't get through the door of the room.
        - id: ch01-b11
          speaker: pinocchio
          text: >-
            After that, I went with the Fox and the Cat to bury the four gold pieces I still had. I'd spent the fifth one at the inn. The Parrot laughed at me, and instead of finding the two thousand gold pieces I'd expected, I found nothing at all. I went to the judge and told him I'd been robbed. He heard the whole story, then put me in prison right away just to please the robbers.
        - id: ch01-b12
          speaker: pinocchio
          text: >-
            When I got out of prison, I saw a lovely bunch of grapes in a field and stepped into a trap. The farmer put a dog collar around my neck and made me guard his chicken yard, and he was quite right to do it. Once he knew I was innocent, he let me go. Later, a Serpent with a smoking tail began to laugh at me. He laughed so hard that a blood vessel burst in his chest.
        - id: ch01-b13
          speaker: pinocchio
          text: >-
            I went back to the beautiful Child's house, but she was dead. A Pigeon saw me crying and told me he'd seen my father building a little boat to go search for me. I said, "If only I had wings, too!" He asked if I wanted to go to my father. I told him I certainly did, but who would take me? "I will," he said. When I asked how, he told me to climb onto his back. So I did, and we flew all night.
        - id: ch01-b14
          speaker: pinocchio
          text: >-
            The next morning, fishermen looking out to sea saw a poor man in a boat about to drown. I knew it was you, even from far away. My heart told me. I waved and tried to make you turn back toward shore.
        - id: ch01-b15
          speaker: geppetto
          text: >-
            I recognized you, too, and I would gladly have gone back. But what could I do? The sea was wild, and a huge wave overturned my boat. This horrible Dog-Fish was nearby. The moment he saw me in the water, he came straight at me, caught me with his tongue, and swallowed me as easily as a little apple tart.
        - id: ch01-b16
          speaker: pinocchio
          text: >-
            How long have you been trapped in here?
        - id: ch01-b17
          speaker: geppetto
          text: >-
            Ever since that day. It must be almost two years now. Two years, my dear Pinocchio, and they felt like two centuries.
        - id: ch01-b18
          speaker: pinocchio
          text: >-
            But how did you stay alive? Where did the candle come from? And the matches? Who gave them to you?
        - id: ch01-b19
          speaker: geppetto
          text: >-
            Slow down, and I'll explain it all. The same storm that overturned my boat sank a merchant ship. Every sailor was saved, but the ship went to the bottom. That day, the Dog-Fish had a tremendous appetite. After swallowing me, he swallowed the ship, too.
        - id: ch01-b20
          speaker: pinocchio
          text: >-
            He did what?
        - id: ch01-b21
          speaker: geppetto
          text: >-
            He gulped it down in one mouthful. The only thing he spat out was the mainmast, because it caught between his teeth like a fish bone.
        - id: ch01-b22
          speaker: geppetto
          text: >-
            Luckily for me, the ship carried canned meat, biscuits, wine, dried raisins, cheese, coffee, sugar, candles, and boxes of wax matches. That wonderful supply kept me alive for two years. But now I've used it all. The pantry is empty, and the candle you see is the very last one.
        - id: ch01-b23
          speaker: pinocchio
          text: >-
            What happens when it burns out?
        - id: ch01-b24
          speaker: geppetto
          text: >-
            Then, my dear boy, the two of us will be left in the dark.
        - id: ch01-b25
          speaker: pinocchio
          text: >-
            Then we can't waste a moment, Papa. We have to find a way out.
        - id: ch01-b26
          speaker: geppetto
          text: >-
            A way out? How?
        - id: ch01-b27
          speaker: pinocchio
          text: >-
            We'll go out through the Dog-Fish's mouth. Then we'll jump into the sea and swim away.
        - id: ch01-b28
          speaker: geppetto
          text: >-
            That's easy to say, dear Pinocchio, but I don't know how to swim.
        - id: ch01-b29
          speaker: pinocchio
          text: >-
            That doesn't matter! I'm a strong swimmer. Climb onto my shoulders, and I'll carry you safely to shore.
        - id: ch01-b30
          speaker: geppetto
          text: >-
            That's only a dream, my boy. You're a puppet, and you're hardly three feet tall. How could you possibly swim with me on your shoulders?
          emotion: sad
        - id: ch01-b31
          speaker: narrator
          text: >-
            Geppetto shook his head and gave him a sad little smile.
        - id: ch01-b32
          speaker: pinocchio
          text: >-
            Just try it. You'll see!
        - id: ch01-b33
          speaker: narrator
          text: >-
            Pinocchio said no more. He picked up the candle and went first, holding the light before him.
        - id: ch01-b34
          speaker: pinocchio
          text: >-
            Follow me, Papa. Don't be afraid.
        - id: ch01-b35
          speaker: narrator
          text: >-
            They walked for quite a while, making their way through the body and then the stomach of the Dog-Fish. When they reached the place where the monster's enormous throat began, they decided to stop. They needed a good look around before moving on, so they waited there and chose the best moment to escape.
        - id: ch01-b36
          speaker: narrator
          text: >-
            Now, the Dog-Fish was very old. He suffered from asthma and a pounding heart, so whenever he slept, he had to keep his mouth open. Pinocchio crept close to the entrance of the throat and looked up. Beyond that enormous, gaping mouth, he could see a wide patch of starry sky and beautiful moonlight.
        - id: ch01-b37
          speaker: pinocchio
          text: >-
            Now's our chance. The Dog-Fish is sleeping like a dormouse. The sea is calm, and the moon makes it almost as bright as day. Stay close to me, Papa. We'll be safe very soon.
        - id: ch01-b38
          speaker: narrator
          text: >-
            Pinocchio whispered those words to his father. Then they climbed straight up the sea monster's throat. When they reached his gigantic mouth, they began to tiptoe along his tongue.
        - id: ch01-b39
          speaker: narrator
          text: >-
            Just before the final leap, Pinocchio turned to his father.
        - id: ch01-b40
          speaker: pinocchio
          text: >-
            Get on my shoulders and wrap your arms tightly around my neck. I'll handle everything else.
        - id: ch01-b41
          speaker: narrator
          text: >-
            As soon as Geppetto was settled firmly on his son's shoulders, Pinocchio gathered his courage. He leaped into the water and began to swim. The sea was as smooth as oil, and the moon shone brilliantly overhead. Behind them, the Dog-Fish slept so deeply that even cannon fire could not have awakened him.
