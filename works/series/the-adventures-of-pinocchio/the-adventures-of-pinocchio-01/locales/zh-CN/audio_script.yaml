audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖从容，带一点一本正经的幽默
        timbre: 清晰醇厚
        pace: 舒缓，遇到惊奇处略微加快
        pitch: 中
    master_cherry:
      display_name: 樱桃师傅
      tts:
        delivery: 老实直率，受惊时慌乱结巴
        timbre: 粗哑而亲切
        pace: 中等，紧张时急促
        pitch: 中低
    piece_of_wood:
      display_name: 木头里的细小声音
      tts:
        delivery: 像孩子一样清脆灵动，疼痛时委屈
        timbre: 细小明亮
        pace: 稍快
        pitch: 高
  chapters:
    - id: ch01
      title: 樱桃师傅发现一块木头
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 从前，老木匠安东尼奥师傅的铺子里放着一块木头。大家平常不叫他的本名，都管他叫樱桃师傅。为什么呢？因为他的鼻尖老是红通通、亮闪闪的，像一颗熟透的樱桃。
        - id: ch01-b02
          speaker: narrator
          text: 樱桃师傅一看见这块木头，脸上立刻有了光彩，心里别提多高兴了。他满意地搓着双手，小声盘算起来。
        - id: ch01-b03
          speaker: master_cherry
          text: 这木头来得真巧，正好能做一条小桌腿。
        - id: ch01-b04
          speaker: narrator
          text: 他马上拿来一把快斧头，想先砍去树皮，再把毛糙的地方削平。第一斧才刚举起来，一个极细的声音忽然开口求他。
        - id: ch01-b05
          speaker: piece_of_wood
          text: 求求你，别砍得那么重！
    - id: ch02
      title: 木头喊疼了
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 樱桃师傅吓坏了，惊恐地转着眼珠，把屋里每个角落都找了一遍。工作台底下没有人，常年关着的柜子里没有人，装刨花和锯末的篮子里也没有人。他甚至打开铺门，朝街上探头张望，可外面仍旧不见人影。那声音究竟是谁发出来的？
        - id: ch02-b02
          speaker: narrator
          text: 他挠了挠假发，笑着给自己找了个解释。
        - id: ch02-b03
          speaker: master_cherry
          text: 我知道了，刚才根本没人说话，是我自己胡思乱想。接着干活吧。
        - id: ch02-b04
          speaker: narrator
          text: 樱桃师傅抄起斧头，照着木头猛劈下去。那个细小的声音立刻凄凄惨惨地叫了起来。
        - id: ch02-b05
          speaker: piece_of_wood
          text: 哎哟！哎哟！你弄疼我了！
          emotion: sad
        - id: ch02-b06
          speaker: narrator
          text: 这下，樱桃师傅彻底僵住了。两只眼睛吓得快要跳出来，嘴巴张得老大，舌头差点垂到下巴尖上，就像喷水池上的怪脸雕饰。好不容易能出声了，他还是浑身打战，话也说不利索。
        - id: ch02-b07
          speaker: master_cherry
          text: 可、可是，那声“哎哟”到底从哪儿来的？一块木头，难道也会像孩子一样哭？我不信。它和别的劈柴没有两样，扔进火里，也就够烧开一锅豆子。莫非有人躲在里面？真有人藏着，那是他自己倒霉。我马上就收拾他！
          emotion: fearful
        - id: ch02-b08
          speaker: narrator
          text: 他抓起那块可怜的木头，朝铺子的墙上一通狠摔，半点儿也没留情。
    - id: ch03
      title: 刨子挠痒了木头
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 摔完以后，樱桃师傅停下来仔细听，想知道还有没有细声在哀叫。两分钟过去了，没有声音。五分钟过去了，还是没有。等到十分钟，四周依然静悄悄的。
        - id: ch03-b02
          speaker: narrator
          text: 他把假发往上推了推，又勉强笑起来。
        - id: ch03-b03
          speaker: master_cherry
          text: 瞧吧，我就知道。那几声“哎哟”全是我想出来的。还是继续做事吧。
        - id: ch03-b04
          speaker: narrator
          text: 这回，他放下斧头，换了一把刨子，要把木头刨得平平整整，再磨得光光的。刨子才在木头上来回推了几趟，那个细声又响了，还带着笑意。
        - id: ch03-b05
          speaker: piece_of_wood
          text: 快停下！你把我全身都挠痒了！
          emotion: happy
        - id: ch03-b06
          speaker: narrator
          text: 可怜的樱桃师傅像挨了一记雷劈，当场倒了下去。过了好一会儿，他才睁开眼睛，发现自己已经坐在地板上。
        - id: ch03-b07
          speaker: narrator
          text: 他的脸全变了颜色。就连那只平时总是鲜红的鼻尖，也已经吓得发青了。
