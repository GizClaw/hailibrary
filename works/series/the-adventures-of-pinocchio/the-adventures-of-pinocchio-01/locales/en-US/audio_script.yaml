audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm and story-rich
        timbre: clear and rounded
        pace: measured
        pitch: medium
    master_cherry:
      display_name: Master Cherry
      tts:
        delivery: kindly and expressive
        timbre: warm and slightly raspy
        pace: unhurried
        pitch: medium-low
    wood_voice:
      display_name: Little Voice
      tts:
        delivery: childlike and lively
        timbre: small and bright
        pace: natural
        pitch: high
  chapters:
    - id: ch01
      title: The Piece of Wood That Laughed and Cried Like a Child
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Once upon a time, a piece of wood lay in the shop of an old carpenter named Master Antonio. Everyone called him Master Cherry because the tip of his nose was always red and shiny, just like a ripe cherry.
        - id: ch01-b02
          speaker: narrator
          text: The moment Master Cherry saw that wood, his face lit up with delight. He rubbed his hands together, pleased with his good luck, and spoke softly to himself.
        - id: ch01-b03
          speaker: master_cherry
          text: This came along at just the right time. It'll make a fine leg for a little table.
        - id: ch01-b04
          speaker: narrator
          text: He picked up a sharp axe right away to cut away the bark and smooth off the rough wood. But just as he raised it for the first blow, a tiny voice begged him to stop.
        - id: ch01-b05
          speaker: wood_voice
          text: Please don't hit me so hard!
          emotion: fearful
        - id: ch01-b06
          speaker: narrator
          text: Master Cherry stared all around the shop in terror, trying to find where that little voice could possibly have come from. He checked under the workbench. No one. He peered into a cupboard that was always shut. No one. He searched a basket full of shavings and sawdust. Still no one. At last, he opened the shop door and looked out into the street. There was nobody there, either. So who in the world had spoken?
        - id: ch01-b07
          speaker: master_cherry
          text: Ah, now I understand. There wasn't any little voice at all. It was only my imagination. Well, back to work.
        - id: ch01-b08
          speaker: narrator
          text: He gave a nervous laugh, scratched his wig, lifted the axe, and brought it down on the wood with a tremendous blow.
        - id: ch01-b09
          speaker: wood_voice
          text: Oh! Oh! That hurt me!
          emotion: sad
        - id: ch01-b10
          speaker: narrator
          text: This time Master Cherry stood petrified. His eyes nearly popped out of his head. His mouth stayed wide open, and his tongue hung almost to his chin, like a face carved on a fountain. At last, he found his voice again. He stammered and shook with fear.
        - id: ch01-b11
          speaker: master_cherry
          text: But where in the world did that voice come from? It cried, “Oh! Oh!” Could this piece of wood really cry and moan like a child? No, I can't believe that. It's only a log, just like any other. If I tossed it in the fire, it would barely boil a pot of beans. So how could it speak? Maybe someone is hiding inside. Well, if there is, he's in for trouble. I'll take care of him right now!
          emotion: fearful
        - id: ch01-b12
          speaker: narrator
          text: With that, he grabbed the poor piece of wood and beat it against the walls without mercy.
        - id: ch01-b13
          speaker: narrator
          text: Then he stopped and listened to see whether the little voice would cry out or complain again. He waited two minutes. Nothing. Five minutes. Nothing. Ten minutes. Still nothing at all.
        - id: ch01-b14
          speaker: master_cherry
          text: There, you see? I must have imagined those cries. Now, back to work.
        - id: ch01-b15
          speaker: narrator
          text: He forced out a laugh and pushed his wig back into place. This time, he set down the axe and picked up his plane. He ran it back and forth to smooth and polish the wood. Then the little voice returned, laughing as it spoke.
        - id: ch01-b16
          speaker: wood_voice
          text: Stop! You're tickling me all over!
          emotion: happy
        - id: ch01-b17
          speaker: narrator
          text: Poor Master Cherry dropped as if lightning had struck him. When he finally opened his eyes, he was sitting on the floor. His whole face looked different. Even the tip of his nose, which was almost always bright red, had turned blue with fright.
