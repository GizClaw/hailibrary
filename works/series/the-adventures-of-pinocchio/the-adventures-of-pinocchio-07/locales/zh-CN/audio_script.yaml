audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖从容，带一点一本正经的幽默
        timbre: 清晰醇厚
        pace: 舒缓，遇到惊奇处略微加快
        pitch: 中
    pinocchio:
      display_name: 匹诺曹
      tts:
        delivery: 任性直率，嘴硬而孩子气，发怒时冲动急躁
        timbre: 清亮，带木偶般的脆响
        pace: 偏快，争辩时更急
        pitch: 中高
    geppetto:
      display_name: 杰佩托
      tts:
        delivery: 活泼直率，发怒时火爆而有喜剧感
        timbre: 苍老而响亮
        pace: 中等，争吵时急促
        pitch: 中高
  chapters:
    - id: ch01
      title: 不见了的双脚
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 可怜的匹诺曹刚从梦里醒来，眼睛还睁不开呢，哪里知道自己的双脚早已烧没了。他听见父亲在门外，赶紧从凳子上下来，想跑过去开门。谁知才走两三步，他便接连踉跄，最后整个人直挺挺地扑倒在地板上。
        - id: ch01-b02
          speaker: narrator
          text: 那动静可真不小，听起来就像一麻袋木勺从五楼砸了下来。
        - id: ch01-b03
          speaker: geppetto
          text: 快开门！
          emotion: angry
        - id: ch01-b04
          speaker: narrator
          text: 杰佩托站在街上大声催他。匹诺曹却躺在地上滚来滚去，哭个不停。
        - id: ch01-b05
          speaker: pinocchio
          text: 爸爸，我没法给您开门呀。
          emotion: sad
        - id: ch01-b06
          speaker: geppetto
          text: 你为什么开不了？
        - id: ch01-b07
          speaker: pinocchio
          text: 我的脚叫人吃掉了。
        - id: ch01-b08
          speaker: geppetto
          text: 谁会吃你的脚？
        - id: ch01-b09
          speaker: pinocchio
          text: 是猫吃的。
        - id: ch01-b10
          speaker: narrator
          text: 匹诺曹正好看见那只猫。它用两只前爪拨来拨去，让地上的木屑跳着舞。
        - id: ch01-b11
          speaker: geppetto
          text: 我再说一遍，开门！等我进了屋，你还不开，我可要让你知道猫是什么滋味！
          emotion: angry
        - id: ch01-b12
          speaker: pinocchio
          text: 您就相信我吧，我真的站不起来。哎呀，我太可怜了！难道我以后只能跪着走一辈子吗？
          emotion: sad
        - id: ch01-b13
          speaker: narrator
          text: 杰佩托还当这是木偶新想出来的把戏，便决定马上结束这场闹剧。他爬上墙，从窗口翻进屋里。刚进去时，他气得不停责骂。可等他看清匹诺曹躺在地上，两只脚真的不见了，心一下就软了。
        - id: ch01-b14
          speaker: narrator
          text: 他抱起匹诺曹，亲了又亲，摸了又摸，嘴里尽是疼爱孩子的话。大颗的眼泪从脸上滚下来，他哭着问道。
        - id: ch01-b15
          speaker: geppetto
          text: 我的小匹诺曹，你到底怎么把两只脚烧没的？
          emotion: sad
    - id: ch02
      title: 颠三倒四的一夜
      blocks:
        - id: ch02-b01
          speaker: pinocchio
          text: 我也不知道呀，爸爸。昨晚可怕极了，我一辈子都忘不掉。外面又打雷又闪电，我的肚子还饿得不得了。
          emotion: sad
        - id: ch02-b02
          speaker: pinocchio
          text: 后来，会说话的蟋蟀对我说，我这是活该，因为我干了坏事，应该受罚。我叫他当心一点，他却说我是木偶，连脑袋也是木头的。我一生气，就把锤子柄扔了过去，结果他死了。
        - id: ch02-b03
          speaker: pinocchio
          text: 可这要怪他，不怪我，因为我根本不想杀他。我能证明！我把一只陶碟放到烧着炭的火盆上，没想到里面飞出来一只小鸡。它还跟我告别，让我替它向家里人问好。
        - id: ch02-b04
          speaker: pinocchio
          text: 这么一折腾，我就更饿了。那个戴睡帽的小老头打开窗户，叫我站到下面，把帽子伸出去。可他竟然把满满一盆水都浇到了我的头上！向人讨一点面包又不是什么丢脸的事，对不对？
        - id: ch02-b05
          speaker: pinocchio
          text: 我马上跑回家，可肚子一直饿得难受。我把脚放到火盆上，想烘干它们。后来您回来了，我才发现两只脚已经烧没了。我现在还是那么饿，却连脚都没有啦！呜！呜！呜！呜！
          emotion: sad
        - id: ch02-b06
          speaker: narrator
          text: 匹诺曹越哭声音越大，足足传到了五英里外。杰佩托听了这番乱糟糟的话，别的几乎全没听明白。他只明白了一件事，那就是这个木偶快饿死了。于是，他从口袋里拿出三只梨，递到匹诺曹面前。
    - id: ch03
      title: 三只梨
      blocks:
        - id: ch03-b01
          speaker: geppetto
          text: 这三只梨是我给自己准备的早饭。现在都给你吧，我心甘情愿。快吃，希望你的肚子能舒服一点。
        - id: ch03-b02
          speaker: pinocchio
          text: 您想让我吃的话，就请先替我把皮削掉吧。
        - id: ch03-b03
          speaker: geppetto
          text: 还要削皮？孩子，我真没想到你会这么挑嘴，这么难伺候。这样可不好！人从小就得学会什么东西都肯吃，因为谁知道以后会遇上什么日子呢？世上的变故多着呢！
          emotion: surprised
        - id: ch03-b04
          speaker: pinocchio
          text: 您说得当然有道理。可水果要是不削皮，我绝不会碰。我一吃果皮就受不了。
        - id: ch03-b05
          speaker: narrator
          text: 善良的杰佩托只得把三只梨都削好，将削下来的皮放到桌角。匹诺曹拿起第一只梨，两口就吞进肚里。他正想把梨核扔掉，杰佩托赶紧抓住他的手臂。
        - id: ch03-b06
          speaker: geppetto
          text: 先别扔！什么东西都有可能派上用场。
        - id: ch03-b07
          speaker: pinocchio
          text: 别的都好说，可我说什么也不会吃梨核！
          emotion: angry
        - id: ch03-b08
          speaker: narrator
          text: 木偶猛地转过身，像一条要扑上去咬人的毒蛇。杰佩托一点也不发火，只把刚才那句话又说了一次。
        - id: ch03-b09
          speaker: geppetto
          text: 那可不一定。世上的变故多着呢！
        - id: ch03-b10
          speaker: narrator
          text: 就这样，三只梨核没有被扔出窗外，全跟梨皮一起留在了桌角。匹诺曹把三只梨吃完了，说是吃，其实更像一口口吞下去。随后，他打了个大得吓人的哈欠，烦躁地开了口。
        - id: ch03-b11
          speaker: pinocchio
          text: 怎么吃完了，我还是这么饿！
    - id: ch04
      title: 梨皮和梨核
      blocks:
        - id: ch04-b01
          speaker: geppetto
          text: 可是孩子，我已经没有别的东西能给你吃了。
        - id: ch04-b02
          speaker: pinocchio
          text: 一点都没有了吗？真的什么也没剩？
        - id: ch04-b03
          speaker: geppetto
          text: 只剩下那三只梨的皮，还有三只梨核。
        - id: ch04-b04
          speaker: pinocchio
          text: 那也只好忍一忍了。既然再没有别的，我就先吃一块梨皮吧。
        - id: ch04-b05
          speaker: narrator
          text: 匹诺曹拿起梨皮嚼了起来。刚开始，他皱着脸，一副怎么也咽不下去的模样。可很快，他便一块接一块，把所有梨皮都吃光了。梨皮吃完以后，他又拿起梨核，连那些也全吞进了肚子。
        - id: ch04-b06
          speaker: narrator
          text: 等桌角什么都没剩下，匹诺曹心满意足地拍了拍肚皮，快活地说。
        - id: ch04-b07
          speaker: pinocchio
          text: 啊，这一下我总算舒服了！
          emotion: happy
        - id: ch04-b08
          speaker: geppetto
          text: 你现在明白了吧？我说人不能把嘴养得太刁，不能总是挑三拣四，一点也没说错。亲爱的孩子，我们谁也不知道以后会碰上什么。世上的变故多着呢！
