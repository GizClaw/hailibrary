audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm and story-rich
        timbre: clear and rounded
        pace: measured
        pitch: medium
    pinocchio:
      display_name: Pinocchio
      tts:
        delivery: impulsive and defiant
        timbre: bright and wooden
        pace: quick
        pitch: medium-high
    geppetto:
      display_name: Geppetto
      tts:
        delivery: plainspoken and caring
        timbre: warm and weathered
        pace: unhurried
        pitch: low
  chapters:
    - id: ch01
      title: Geppetto Gives His Own Breakfast to Pinocchio
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Poor Pinocchio was still half asleep. He had not yet noticed that his feet were gone. As soon as he heard his father's voice, he slid off the stool and tried to run to the door. He stumbled two or three times, then fell flat on the floor.
        - id: ch01-b02
          speaker: narrator
          text: The crash sounded like someone had dropped a sack of wooden ladles from the fifth floor.
        - id: ch01-b03
          speaker: geppetto
          text: Open the door!
          emotion: angry
        - id: ch01-b04
          speaker: narrator
          text: Geppetto shouted from the street. Pinocchio rolled around on the floor, crying.
        - id: ch01-b05
          speaker: pinocchio
          text: Dear Papa, I can't!
          emotion: sad
        - id: ch01-b06
          speaker: geppetto
          text: Why can't you?
        - id: ch01-b07
          speaker: pinocchio
          text: Because my feet have been eaten!
        - id: ch01-b08
          speaker: geppetto
          text: Who ate your feet?
        - id: ch01-b09
          speaker: narrator
          text: Pinocchio saw the cat batting some wood shavings around with her front paws.
        - id: ch01-b10
          speaker: pinocchio
          text: The cat did.
        - id: ch01-b11
          speaker: geppetto
          text: I said open this door! If you don't, just wait until I get inside. I'll give you the cat!
          emotion: angry
        - id: ch01-b12
          speaker: pinocchio
          text: I really can't stand up. Oh, poor me! I'll have to walk on my knees for the rest of my life!
          emotion: sad
        - id: ch01-b13
          speaker: narrator
          text: Geppetto thought all that wailing was just another one of the puppet's tricks. He decided to put an end to it. He climbed up the wall and came in through the window.
        - id: ch01-b14
          speaker: narrator
          text: At first, he was so angry that all he did was scold. Then he saw Pinocchio lying there on the floor. The puppet truly had no feet. Geppetto's anger melted away. He lifted Pinocchio into his arms and held him close. He kissed him, stroked him, and called him every tender name he could think of. Big tears rolled down his cheeks as he sobbed.
        - id: ch01-b15
          speaker: geppetto
          text: My little Pinocchio! How did you burn your feet?
          emotion: sad
        - id: ch01-b16
          speaker: pinocchio
          text: I don't know, Papa. It was such a terrible night that I'll remember it as long as I live! There was thunder and lightning, and I was starving. Then the Talking Cricket told me it served me right because I'd been bad. I warned him to be careful, but he said I was a puppet with a wooden head. So I threw a hammer handle at him, and he died. But it was his fault! I didn't mean to kill him.
          emotion: sad
        - id: ch01-b17
          speaker: pinocchio
          text: You can tell I didn't mean it, because I put a little clay dish over some burning coals. But a chicken flew out and said goodbye until we met again, and sent his best to everyone at home. That only made me hungrier.
        - id: ch01-b18
          speaker: pinocchio
          text: Then a little old man in a nightcap opened his window. He told me to stand underneath and hold out my hat, and he dumped a whole basin of water over my head. There's nothing wrong with asking for a little bread, is there?
        - id: ch01-b19
          speaker: pinocchio
          text: I came straight home. I was still so hungry, and I put my feet on the hot coals to dry them. Then you came back, and I found out they'd burned away. I'm still hungry, and now I don't have any feet! Oh! Oh! Oh! Oh!
          emotion: sad
        - id: ch01-b20
          speaker: narrator
          text: Poor Pinocchio burst out crying. He roared so loudly that he could be heard five miles away.
        - id: ch01-b21
          speaker: narrator
          text: Geppetto could make only one thing out of that tangled story. The puppet was starving. Whatever else had happened during the night, Pinocchio needed food now. Geppetto reached into his pocket, took out three pears, and handed them to him.
        - id: ch01-b22
          speaker: geppetto
          text: These three pears were supposed to be my breakfast, but I'm happy to give them to you. Eat them. I hope they make you feel better.
        - id: ch01-b23
          speaker: pinocchio
          text: If you want me to eat them, would you please peel them first?
        - id: ch01-b24
          speaker: geppetto
          text: Peel them? My boy, I never knew you were so fussy. That's a bad habit. We need to learn from childhood to eat all kinds of food. We never know what might happen or what we may have to live on.
          emotion: surprised
        - id: ch01-b25
          speaker: pinocchio
          text: I'm sure you're right, but I won't eat fruit with the peel on it. I can't stand the skin.
        - id: ch01-b26
          speaker: narrator
          text: Kind Geppetto did as Pinocchio asked. He carefully peeled all three pears and set every strip of peel in one corner of the table.
        - id: ch01-b27
          speaker: narrator
          text: Pinocchio ate the first pear in only two bites. Then he reached out to toss away the core, but Geppetto caught him by the arm before he could do it.
        - id: ch01-b28
          speaker: geppetto
          text: Don't throw that away. Anything can turn out to be useful in this world.
        - id: ch01-b29
          speaker: narrator
          text: Pinocchio turned on him like a viper and shouted.
        - id: ch01-b30
          speaker: pinocchio
          text: I will not eat the core!
          emotion: angry
        - id: ch01-b31
          speaker: geppetto
          text: Who knows? So many things can happen.
        - id: ch01-b32
          speaker: narrator
          text: Geppetto never lost his temper, and he did not argue. He placed all three cores in the corner with the three peels instead of throwing them out the window.
        - id: ch01-b33
          speaker: narrator
          text: Pinocchio ate the three pears. In fact, he devoured them. Then he gave a tremendous yawn and spoke in a cranky voice.
        - id: ch01-b34
          speaker: pinocchio
          text: I'm just as hungry as I was before!
        - id: ch01-b35
          speaker: geppetto
          text: But my boy, I don't have anything else to give you.
        - id: ch01-b36
          speaker: pinocchio
          text: Nothing? Really nothing?
        - id: ch01-b37
          speaker: geppetto
          text: Only the peels and the cores from those three pears.
        - id: ch01-b38
          speaker: pinocchio
          text: Well, I'll have to be patient. If there's nothing else, I'll eat a peel.
        - id: ch01-b39
          speaker: narrator
          text: He began to chew on one of the peels. At first he made a sour face. Before long, though, he was eating one peel after another as fast as he could. When the peels were gone, he ate the cores too. After he had finished every last bit, he clapped his hands against his sides with satisfaction.
        - id: ch01-b40
          speaker: pinocchio
          text: Ah! Now I feel comfortable!
          emotion: happy
        - id: ch01-b41
          speaker: geppetto
          text: Now you see I was right. We shouldn't get used to being too fussy about food. My dear boy, we never know what may happen to us. So many things can happen.
