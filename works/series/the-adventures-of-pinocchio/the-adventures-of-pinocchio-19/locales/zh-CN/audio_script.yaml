audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖从容，带一点一本正经的幽默
        timbre: 清晰醇厚
        pace: 舒缓，遇到惊奇处略微加快
        pitch: 中
    pinocchio:
      display_name: 匹诺曹
      tts:
        delivery: 任性直率，嘴硬而孩子气，发怒时冲动急躁
        timbre: 清亮，带木偶般的脆响
        pace: 偏快，争辩时更急
        pitch: 中高
    parrot:
      display_name: 鹦鹉
      tts:
        delivery: 直率清醒，嘲笑中带着过来人的讥诮
        timbre: 明亮略尖
        pace: 从容，点破真相时干脆利落
        pitch: 中高
    judge:
      display_name: 法官
      tts:
        delivery: 表面慈和庄重，宣判时冷漠荒唐
        timbre: 低沉厚重
        pace: 缓慢郑重
        pitch: 低
    jailor:
      display_name: 狱卒
      tts:
        delivery: 刻板认真，对荒唐规矩深信不疑
        timbre: 粗哑结实
        pace: 不紧不慢
        pitch: 中低
  chapters:
    - id: ch01
      title: 金币树在哪里
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 匹诺曹回到城里，一分钟一分钟地数着。觉得时间差不多了，他便赶往奇迹田。一路上，他走得飞快，心口也嘀嗒、嘀嗒地猛跳，简直像一座走得正欢的客厅座钟。木偶越走，脑子里的美梦越大。
        - id: ch01-b02
          speaker: pinocchio
          text: 要是树上结出来的不是一千枚，而是两千枚金币呢？说不定会有五千枚，甚至十万枚！那我就成了气派的大老爷。我要住进漂亮的宫殿，养一千匹小木马，给它们盖一千座马厩。我还要把地窖装满醋栗酒和甜糖浆，再让图书室里堆满糖果、馅饼、李子蛋糕、杏仁小饼和奶油饼干！
          emotion: happy
        - id: ch01-b03
          speaker: narrator
          text: 他一路做着白日梦，已经走到田地附近。匹诺曹停下来四处张望，想找那棵挂满金钱的树，可什么也没看见。他再走一百步，还是没有。他走进田里，来到埋金币的小坑前，依旧什么也没有。这回，木偶真的犯起了愁。他连社交礼节和斯文举止也顾不上了，把双手从口袋里抽出来，对着脑袋搔了又搔。
        - id: ch01-b04
          speaker: narrator
          text: 近旁突然爆出一阵大笑。匹诺曹抬头一看，一只大鹦鹉正停在树上，仔细梳理着身上所剩无几的几根羽毛。
        - id: ch01-b05
          speaker: pinocchio
          text: 你在笑什么？
          emotion: angry
        - id: ch01-b06
          speaker: parrot
          text: 我刚才梳羽毛，碰巧挠到翅膀底下，痒得笑出了声。
        - id: ch01-b07
          speaker: narrator
          text: 木偶没理他。他来到水渠旁，还是拿那只旧鞋装水，又把埋金币的泥土浇了一遍。寂静的田野里，很快又响起一阵笑声。这一回，笑得比先前还放肆。
        - id: ch01-b08
          speaker: pinocchio
          text: 你这个没教养的鹦鹉！这一次，你非得告诉我，你究竟在笑什么！
          emotion: angry
        - id: ch01-b09
          speaker: parrot
          text: 我笑的是那些傻瓜。别人说什么蠢话，他们都肯信。碰上比自己狡猾的人，他们还会乖乖钻进圈套。
        - id: ch01-b10
          speaker: pinocchio
          text: 你说的，难道是我？
    - id: ch02
      title: 鹦鹉说出真相
      blocks:
        - id: ch02-b01
          speaker: parrot
          text: 不错，就是你，可怜的匹诺曹。你竟然相信金币也能像豆子和南瓜一样，埋进田里，再从地里收回来。我以前也信过，所以如今还在吃苦。直到今天我才懂，可惜已经太迟了。要想正正当当地攒下几文钱，只能靠双手干活，或者靠脑筋谋生。
        - id: ch02-b02
          speaker: narrator
          text: 匹诺曹听着这些话，已经害怕得发起抖来。
        - id: ch02-b03
          speaker: pinocchio
          text: 我听不懂你在说什么。
          emotion: fearful
        - id: ch02-b04
          speaker: parrot
          text: 别急，我给你说清楚。你进城以后，狐狸和猫又回到了这里。他们挖出你埋的钱，随后像风一样逃了。现在谁要能抓住他们，谁才真叫有本事。
        - id: ch02-b05
          speaker: narrator
          text: 匹诺曹张着嘴，愣在原地，却还是不肯相信。他立刻用手和指甲刨开刚浇湿的泥土。他不停地刨呀，刨呀，挖出的坑越来越深，连一大垛麦秸都能直立在里面。可是那些金币，真的不见了。
        - id: ch02-b06
          speaker: narrator
          text: 木偶绝望地冲回城里，径直闯进法院。他要告发狐狸和猫，请法官惩办这两个抢走他金币的恶棍。
    - id: ch03
      title: 荒唐的判决
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 法官是一只高大的大猩猩。他上了年纪，留着白胡子，看起来很有威望。最显眼的，是鼻梁上那副没有镜片的金丝眼镜。他被眼疾折磨了许多年，所以一直得戴着它。
        - id: ch03-b02
          speaker: narrator
          text: 匹诺曹站在法官面前，把自己怎样掉进那场无耻骗局的经过一五一十地讲了。他说出两个坏蛋的名和姓，又交代了所有细节，最后请求法官替他主持公道。法官一直和颜悦色地听着，显得很感兴趣。他又同情，又感动。等木偶再也没有什么可说，法官伸手摇响了铃铛。
        - id: ch03-b03
          speaker: narrator
          text: 两只扮成宪兵的獒犬立刻走进来。法官抬起手，指向匹诺曹。
        - id: ch03-b04
          speaker: judge
          text: 这个可怜虫被人抢走了四枚金币。把他带走，马上关进监狱。
        - id: ch03-b05
          speaker: narrator
          text: 匹诺曹万万没有料到会听见这样的判决，整个人顿时僵得像石头。他刚要抗议，两名宪兵却不肯耽误时间。他们堵住木偶的嘴，把他押进了牢房。
    - id: ch04
      title: 一个罪犯获释
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 匹诺曹在牢里关了四个月，漫长的整整四个月。要不是后来碰上好运，他还不知要关多久。那时，统治“傻瓜陷阱”城的年轻皇帝刚刚大败敌军，便下令让全城举行盛大的庆祝。城里张灯结彩，燃放焰火，还举办赛马和脚踏车比赛。为了让胜利更显得喜庆，皇帝又命人打开监狱，把所有囚犯全都放出去。
        - id: ch04-b02
          speaker: pinocchio
          text: 别人都能出狱，那我也要走。
        - id: ch04-b03
          speaker: jailor
          text: 不行，你不能走。你不属于那一类幸运的人。
        - id: ch04-b04
          speaker: pinocchio
          text: 你可得弄清楚，我也是个罪犯。
        - id: ch04-b05
          speaker: jailor
          text: 既然这样，那你说得完全正确。
        - id: ch04-b06
          speaker: narrator
          text: 狱卒摘下帽子，恭恭敬敬地向匹诺曹鞠了一躬。接着，他打开牢门，放木偶逃了出去。
