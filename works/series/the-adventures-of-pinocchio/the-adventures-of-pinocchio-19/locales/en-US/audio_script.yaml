audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm and story-rich
        timbre: clear and rounded
        pace: measured
        pitch: medium
    pinocchio:
      display_name: Pinocchio
      tts:
        delivery: impulsive and defiant
        timbre: bright and wooden
        pace: quick
        pitch: medium-high
    parrot:
      display_name: Parrot
      tts:
        delivery: blunt and knowing
        timbre: bright and scratchy
        pace: brisk
        pitch: high
    judge:
      display_name: Judge
      tts:
        delivery: solemn and falsely sympathetic
        timbre: deep and gravelly
        pace: slow
        pitch: low
    jailor:
      display_name: Jailor
      tts:
        delivery: officious and literal-minded
        timbre: firm and dry
        pace: measured
        pitch: medium-low
  chapters:
    - id: ch01
      title: Pinocchio Is Robbed of His Money
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Pinocchio went back to town and counted off every minute. As soon as he thought enough time had passed, he hurried down the road to the Field of Miracles. His heart beat fast as he walked. Tic, tac, tic, tac. It sounded just like a parlor clock running perfectly. All the while, his thoughts raced ahead of him.
        - id: ch01-b02
          speaker: pinocchio
          text: What if the tree has two thousand gold pieces instead of one thousand? Or five thousand instead of two? What if it has a hundred thousand? Oh, then I'd be a grand gentleman! I'd own a beautiful palace, with a thousand little wooden horses and a thousand stables to play in. My cellar would be full of currant wine and sweet syrups. And my library would be packed with candy, tarts, plum cakes, macaroons, and cream-filled cookies!
          emotion: happy
        - id: ch01-b03
          speaker: narrator
          text: With all those castles in the air filling his head, Pinocchio reached the field. He stopped and searched for a tree whose branches were heavy with money. There was no tree. He went another hundred steps. Still nothing. Then he entered the field and hurried straight to the little hole where he had buried his gold pieces. Nothing was there. Pinocchio fell deep in thought. He forgot all about good manners, pulled his hands from his pockets, and gave his head a long scratch.
        - id: ch01-b04
          speaker: narrator
          text: Just then, loud laughter burst out nearby. Pinocchio looked up. A large Parrot sat on a tree, carefully trimming the few feathers he had left.
        - id: ch01-b05
          speaker: pinocchio
          text: What are you laughing at?
          emotion: angry
        - id: ch01-b06
          speaker: parrot
          text: I'm laughing because I tickled myself under the wings while I was fixing my feathers.
        - id: ch01-b07
          speaker: narrator
          text: Pinocchio said nothing. He went to the canal, filled that same old shoe with water, and watered the ground over his gold pieces once more.
        - id: ch01-b08
          speaker: narrator
          text: While he worked, another laugh rang through the lonely field. This one sounded even more insulting than the first.
        - id: ch01-b09
          speaker: pinocchio
          text: Tell me right now, you rude Parrot! What are you laughing at?
          emotion: angry
        - id: ch01-b10
          speaker: parrot
          text: I'm laughing at fools who believe every silly thing they're told and let someone more cunning trap them.
        - id: ch01-b11
          speaker: pinocchio
          text: Do you mean me?
        - id: ch01-b12
          speaker: parrot
          text: Yes, poor Pinocchio, I mean you. You were foolish enough to believe you could plant money in a field and harvest it like beans or gourds. I believed that once, too, and I'm paying for it today. Now I know the truth, but I learned it too late. If you want to put aside even a few pennies honestly, you have to earn them. You must work with your hands or use your own good sense.
        - id: ch01-b13
          speaker: narrator
          text: Pinocchio had begun to tremble with fear.
        - id: ch01-b14
          speaker: pinocchio
          text: I don't understand what you're saying.
          emotion: fearful
        - id: ch01-b15
          speaker: parrot
          text: Be patient, and I'll make it clear. While you were in town, the Fox and the Cat came back to the field. They dug up your money and ran away like the wind. Anyone who manages to catch them will have to be very clever.
        - id: ch01-b16
          speaker: narrator
          text: Pinocchio stood with his mouth hanging open. He refused to believe the Parrot. With both hands and all his nails, he began tearing into the wet earth. He dug and dug and kept on digging. At last, the hole was so deep that a whole stack of straw could have stood upright inside it. But the money was gone.
        - id: ch01-b17
          speaker: narrator
          text: Desperate, Pinocchio rushed back to town. He went straight to the Courts of Justice to report the two thieves and ask the judge for help.
        - id: ch01-b18
          speaker: narrator
          text: The judge was a large old ape from the gorilla family. His age and white beard made him look respectable. Most impressive of all were the gold spectacles he wore, though they had no lenses. He had suffered from sore eyes for many years, and for that reason he was always forced to wear them.
        - id: ch01-b19
          speaker: narrator
          text: Standing before the judge, Pinocchio explained every part of the shameful fraud and how he had become its victim. He gave the two rascals' first names, their last names, and one detail after another. When he had told the judge everything, he demanded justice.
        - id: ch01-b20
          speaker: narrator
          text: The judge listened very kindly. He seemed deeply interested in the story and terribly moved by it. Once Pinocchio had nothing more to say, the judge reached out and rang a bell. Two mastiffs appeared at once, dressed as police officers. The judge pointed at Pinocchio.
        - id: ch01-b21
          speaker: judge
          text: This poor fellow has been robbed of four gold pieces. Take him away and put him in prison immediately.
        - id: ch01-b22
          speaker: narrator
          text: That unexpected sentence turned Pinocchio to stone. He tried to protest, but the mastiffs did not want to waste time. They covered his mouth and carried him off to jail.
        - id: ch01-b23
          speaker: narrator
          text: Pinocchio stayed there for four months. Four long months. He would have remained even longer if a lucky chance had not set him free. The young Emperor who ruled Trap for Blockheads had won a splendid victory over his enemies. To celebrate, he ordered great public festivities. The town glowed with lights and fireworks. There were horse races and races on those two-wheeled machines called velocipedes. As one more sign of victory, the Emperor commanded that the prisons be opened and every prisoner released.
        - id: ch01-b24
          speaker: pinocchio
          text: If all the other prisoners are being set free, then I'm leaving, too.
        - id: ch01-b25
          speaker: jailor
          text: No, you're not. You don't belong to the lucky kind of prisoner.
        - id: ch01-b26
          speaker: pinocchio
          text: Excuse me, but I am a criminal, too.
        - id: ch01-b27
          speaker: jailor
          text: In that case, you're absolutely right.
        - id: ch01-b28
          speaker: narrator
          text: The jailor removed his hat and gave Pinocchio a respectful bow. Then he opened the prison doors and let him escape.
