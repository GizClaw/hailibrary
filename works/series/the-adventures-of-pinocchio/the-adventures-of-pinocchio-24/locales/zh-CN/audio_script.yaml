audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖从容，带一点一本正经的幽默
        timbre: 清晰醇厚
        pace: 舒缓，遇到惊奇处略微加快
        pitch: 中
    pinocchio:
      display_name: 匹诺曹
      tts:
        delivery: 任性直率，嘴硬而孩子气，发怒时冲动急躁
        timbre: 清亮，带木偶般的脆响
        pace: 偏快，争辩时更急
        pitch: 中高
    dolphin:
      display_name: 海豚
      tts:
        delivery: 彬彬有礼，回答问题时坦率沉着
        timbre: 明朗圆润
        pace: 中等
        pitch: 中
    charcoal_man:
      display_name: 运炭人
      tts:
        delivery: 劳累却爽直，讥讽懒惰时干脆有力
        timbre: 粗厚
        pace: 中等
        pitch: 中低
    mason:
      display_name: 泥瓦匠
      tts:
        delivery: 务实利落，回话时带朴素的挖苦
        timbre: 结实明亮
        pace: 中等
        pitch: 中
    passersby:
      display_name: 过路人
      tts:
        delivery: 直截了当，众人语气一致而不冷酷
        timbre: 混合清晰
        pace: 中等
        pitch: 中
    fairy:
      display_name: 蓝发仙女
      tts:
        delivery: 温柔亲切，话语简洁而沉静
        timbre: 柔和清澈
        pace: 舒缓
        pitch: 中高
  chapters:
    - id: ch01
      title: 暴风雨后的岛屿
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 匹诺曹一心盼着能及时赶去救爸爸，在海里游了整整一夜。那一夜可怕极了。大雨倾盆而下，冰雹劈头盖脸地砸来，雷声震耳欲聋，一道道闪电划破黑暗，把四周照得如同白昼。
        - id: ch01-b02
          speaker: narrator
          text: 快到清晨，他终于看见不远处有一长条陆地。那是茫茫大海中的一座岛。他使出所有力气往岸边游，却怎么也靠不过去。海浪一个追着一个，翻滚着扑上来，把他像木棍、像一把稻草似的抛来甩去。好在最后，一道来势凶猛的巨浪把他高高托起，远远抛上了沙滩。
        - id: ch01-b03
          speaker: narrator
          text: 匹诺曹重重摔在地上，肋骨和所有关节都咔咔直响。他却这样安慰自己。
        - id: ch01-b04
          speaker: pinocchio
          text: 这一回，我又奇迹般地逃出来了！
        - id: ch01-b05
          speaker: narrator
          text: 天空慢慢放晴，太阳灿烂地照起来，海面也变得安静而平滑，简直像一层油。木偶把衣服摊在阳光下晾晒，又朝四面八方张望。他盼着能在辽阔的海面上找到爸爸的小船，找到船里那个小小的人。可他望了又望，只看见天空、大海，还有某条船上的一叶帆。那帆远得只有苍蝇那么大。
        - id: ch01-b06
          speaker: pinocchio
          text: 要是知道这座岛叫什么就好了。岛上住的是文明人吗？我的意思是，他们不会动不动就把孩子吊到树上吧？可这儿一个人也没有，我能去问谁呢？
        - id: ch01-b07
          speaker: narrator
          text: 想到自己孤零零的，独自困在这片广阔无人的土地上，他难过得正要哭。就在这时，一条大鱼从离岸不远的地方游过。它把头露在水面上，不慌不忙地赶着自己的路。匹诺曹不知道它叫什么，只好扯开嗓门，朝它大喊。
        - id: ch01-b08
          speaker: pinocchio
          text: 喂，鱼先生！能耽误您一句话吗？
        - id: ch01-b09
          speaker: dolphin
          text: 你想说两句也可以。
        - id: ch01-b10
          speaker: narrator
          text: 那条鱼马上答应了。原来它是一只海豚，而且客气得实在少见。就算走遍天底下所有海洋，恐怕也找不出几只像它这么有礼貌的同类。
    - id: ch02
      title: 海豚的消息
      blocks:
        - id: ch02-b01
          speaker: pinocchio
          text: 请问岛上有村子吗？我想找点东西吃，可不想反过来叫别人吃掉。
        - id: ch02-b02
          speaker: dolphin
          text: 当然有。离这儿不远的地方就有一个小村子。
        - id: ch02-b03
          speaker: pinocchio
          text: 我该走哪条路过去？
        - id: ch02-b04
          speaker: dolphin
          text: 走左边那条小路，鼻子朝前一直走，绝不会走错。
        - id: ch02-b05
          speaker: pinocchio
          text: 还想请教您一件事。您白天黑夜都在海里游，有没有看见一条小船？我爸爸就在船上。
        - id: ch02-b06
          speaker: dolphin
          text: 你爸爸是谁？
        - id: ch02-b07
          speaker: pinocchio
          text: 他是全世界最好的爸爸。至于我，恐怕再也找不到比我更坏的儿子了。
        - id: ch02-b08
          speaker: dolphin
          text: 昨夜的风暴太凶，那条小船多半已经沉进海底了。
        - id: ch02-b09
          speaker: pinocchio
          text: 那我爸爸呢？
          emotion: fearful
        - id: ch02-b10
          speaker: dolphin
          text: 他恐怕叫那条可怕的大鲨鱼吞了。那家伙这几天一直在这片海里横冲直撞，到处破坏，把水里的居民害得不得安宁。
        - id: ch02-b11
          speaker: narrator
          text: 匹诺曹听得浑身发抖，还是忍不住问那条鲨鱼有多大。
        - id: ch02-b12
          speaker: dolphin
          text: 有多大？它比五层楼还高。那张嘴又大又深，就算一列火车连着冒烟的火车头开进去，也能直接穿过它的喉咙。
        - id: ch02-b13
          speaker: pinocchio
          text: 老天保佑啊！
          emotion: fearful
        - id: ch02-b14
          speaker: narrator
          text: 木偶吓坏了，以最快的速度把晾干的衣服穿好，赶紧向海豚告辞。
        - id: ch02-b15
          speaker: pinocchio
          text: 再见，鱼先生！麻烦您了，多谢您这么客气。
        - id: ch02-b16
          speaker: narrator
          text: 他踏上海豚指给他的那条路，快步往前走，越走越快，最后几乎跑了起来。只要身后传来一点儿响动，他就立刻回头张望，生怕那条可怕的大鲨鱼正含着一整列火车追赶自己。
    - id: ch03
      title: 勤劳蜜蜂村
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 半个钟头后，他走进一个名叫“勤劳蜜蜂村”的小村庄。街上的人来来往往，各自忙着自己的事。这里人人在干活，个个都有事情做。你就是打着灯笼，把全村找上一遍，也休想找到一个懒汉或流浪汉。
        - id: ch03-b02
          speaker: pinocchio
          text: 啊，这村子肯定不适合我！我天生就不是干活的料！
        - id: ch03-b03
          speaker: narrator
          text: 可这个懒惰的木偶已经二十四小时没吃东西了，连一颗野豌豆也没吃过，饥饿正狠狠折磨着他。现在该怎么办？要想弄到食物，只有两条路。要么求人给他一点活干，要么伸手讨一个小铜板，或是一口面包。
        - id: ch03-b04
          speaker: narrator
          text: 他又不好意思讨饭。爸爸总教导他，除了老人和病人，谁也没有理由伸手乞讨。世上真正贫苦、值得同情和帮助的，是那些年老体衰或身患疾病，再也不能靠双手劳动来挣面包的人。其他人都有责任工作。要是他们自己不肯干活，那么挨饿也只能怪自己。
        - id: ch03-b05
          speaker: narrator
          text: 就在这时，一个男人从路上走来。他已经累得气喘吁吁，还在独自费力地拖着两辆装满木炭的小车。匹诺曹看看他的脸，觉得他像个好心人，便难为情地低下眼睛，凑了过去。
        - id: ch03-b06
          speaker: pinocchio
          text: 行行好，给我一个小铜板吧。我就要饿死了。
        - id: ch03-b07
          speaker: charcoal_man
          text: 你帮我把这两车木炭拖回家，我不只给你一个，给你五个小铜板。
        - id: ch03-b08
          speaker: pinocchio
          text: 您怎么能这样说！我可没干过驴子的活，从来没有拉过车！
          emotion: angry
        - id: ch03-b09
          speaker: charcoal_man
          text: 那你运气真好。孩子，你要是快饿死了，就切两大片自己的傲气吃吧，可别撑坏肚子。
        - id: ch03-b10
          speaker: narrator
          text: 几分钟后，一个泥瓦匠扛着一筐石灰经过。
        - id: ch03-b11
          speaker: pinocchio
          text: 好心人，给这个饿得直打哈欠的孩子一个小铜板吧。
        - id: ch03-b12
          speaker: mason
          text: 可以。你替我扛石灰，我就给你五个小铜板。
        - id: ch03-b13
          speaker: pinocchio
          text: 可石灰太重了，我不想累着自己。
        - id: ch03-b14
          speaker: mason
          text: 既然不想受累，你就继续打哈欠玩吧。祝你打得痛快。
        - id: ch03-b15
          speaker: narrator
          text: 不到半个钟头，又有二十个人从路上经过。匹诺曹一个也没放过，挨个向他们开口讨钱。可每个人给他的回答都一模一样。
        - id: ch03-b16
          speaker: passersby
          text: 伸手讨钱不害臊吗？别在路上闲逛了。去找点活干，学着自己挣面包！
    - id: ch04
      title: 一罐水换来的饭
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 最后，一位模样和善的小个子女人走来，手里提着两罐水。匹诺曹渴得嗓子都快冒烟了，连忙问她，能不能让自己喝一点罐里的水。
        - id: ch04-b02
          speaker: fairy
          text: 想喝就喝吧，孩子。
        - id: ch04-b03
          speaker: narrator
          text: 女人放下水罐。匹诺曹像鱼一样喝了个够，擦着嘴小声嘟囔。
        - id: ch04-b04
          speaker: pinocchio
          text: 现在不渴了。要是肚子也能吃饱，那该多好。
        - id: ch04-b05
          speaker: fairy
          text: 你帮我把这两罐水提回家，我就给你一大块面包。
        - id: ch04-b06
          speaker: narrator
          text: 匹诺曹看看水罐，不说行，也不说不行。
        - id: ch04-b07
          speaker: fairy
          text: 除了面包，还有一盘拌了油和醋的花椰菜。
        - id: ch04-b08
          speaker: narrator
          text: 匹诺曹又看一眼水罐，还是不开口。
        - id: ch04-b09
          speaker: fairy
          text: 吃完花椰菜，我再给你一颗灌满糖浆的漂亮糖果。
        - id: ch04-b10
          speaker: narrator
          text: 最后这份甜食实在太诱人了，匹诺曹怎么也抵挡不住。犹豫了这么久，他终于摆出下定决心的样子。
        - id: ch04-b11
          speaker: pinocchio
          text: 我只好忍一忍啦！我替您把水罐提回家。
        - id: ch04-b12
          speaker: narrator
          text: 水罐沉甸甸的。木偶力气不够，没法用手提，只得认命地把它顶在头上。到了家，女人让他坐到一张已经摆好餐具的小桌边，又把面包、拌了油醋的花椰菜，还有那颗灌满糖浆的糖果，一样一样放到他面前。
        - id: ch04-b13
          speaker: narrator
          text: 匹诺曹哪里是在吃，简直是在狼吞虎咽。他的肚子就像一间空了整整五个月、始终没人住的屋子。
    - id: ch05
      title: 蓝发仙女
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 等那阵凶猛的饥饿稍稍平息，他抬起头来，想向这位恩人道谢。可他刚看清女人的脸，就惊讶地拖长声音叫了一声“哦——！”随后，他睁大双眼，一动不动地盯着她。叉子还举在半空，嘴里塞满面包和花椰菜，整个人活像中了魔法。
        - id: ch05-b02
          speaker: fairy
          text: 什么事让你这么吃惊？
        - id: ch05-b03
          speaker: narrator
          text: 女人笑着问他。匹诺曹结结巴巴，好半天才把话说出来。
        - id: ch05-b04
          speaker: pinocchio
          text: 是……是因为您长得太像她了。一样的声音，一样的眼睛，一样的头发。对，对，您的头发也是蓝色的，和她一模一样！
          emotion: surprised
        - id: ch05-b05
          speaker: pinocchio
          text: 啊，小仙女！快告诉我，真的是你！别再让我哭了。你不知道，我哭了多久，又受了多少苦！
          emotion: sad
        - id: ch05-b06
          speaker: narrator
          text: 匹诺曹扑倒在她脚边，紧紧抱住这位神秘女人的双膝，伤心地大哭起来。
