  chapters:
    - id: ch01
      title: Pinocchio Finds the Fairy Again
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Pinocchio hoped he could still reach his father in time, so he swam all night long. It was a dreadful night. Rain poured down, hail struck the sea, and thunder crashed overhead. Every flash of lightning turned the darkness bright as day.
        - id: ch01-b02
          speaker: narrator
          text: Near morning, he spotted a long stretch of land close by. It was an island in the middle of the sea. He fought as hard as he could to reach it, but the waves kept racing over one another and tossing him around like a stick or a wisp of straw. At last, one furious wave lifted him high and hurled him far up onto the sand.
        - id: ch01-b03
          speaker: narrator
          text: He hit the ground with such force that his ribs and every joint in his body seemed to crack. After being battered by the sea all night, he had finally reached land. That was enough to comfort him.
        - id: ch01-b04
          speaker: pinocchio
          text: Well, I've had another wonderful escape!
        - id: ch01-b05
          speaker: narrator
          text: Little by little, the sky cleared. The sun came out in all its brightness, and the sea grew smooth and quiet as oil. Pinocchio spread his clothes in the sun to dry. Then he searched the wide water for a little boat with a little man inside. He looked and looked, but saw only sky, sea, and the sail of a ship so far away that it seemed no bigger than a fly.
        - id: ch01-b06
          speaker: pinocchio
          text: If only I knew the name of this island. And are there civilized people here? I mean people who don't hang boys from tree branches. But who can I ask when there's nobody around?
        - id: ch01-b07
          speaker: narrator
          text: The thought that he might be alone, completely alone, in that great empty country made him so miserable that he was about to cry. There was no one nearby to answer him or even tell him where he was. Just then, he noticed a large fish swimming a short distance from shore. It was quietly minding its own business with its head above the water. Pinocchio did not know what kind of fish it was, so he shouted as loudly as he could to make sure it heard him.
        - id: ch01-b08
          speaker: pinocchio
          text: Excuse me, Sir Fish! May I ask you something?
        - id: ch01-b09
          speaker: dolphin
          text: You may ask me two things, if you like.
        - id: ch01-b10
          speaker: narrator
          text: The fish was a Dolphin, and he was as polite as any Dolphin in the whole sea.
        - id: ch01-b11
          speaker: pinocchio
          text: Are there any villages on this island where I could get something to eat without being eaten myself?
        - id: ch01-b12
          speaker: dolphin
          text: Of course. There's a village not far from here.
        - id: ch01-b13
          speaker: pinocchio
          text: Which way should I go?
        - id: ch01-b14
          speaker: dolphin
          text: Take the path on your left and keep straight ahead. You can't miss it.
        - id: ch01-b15
          speaker: pinocchio
          text: Could I ask one more thing? You swim through the sea day and night. Did you happen to see a little boat with my papa in it?
        - id: ch01-b16
          speaker: dolphin
          text: Who is your papa?
        - id: ch01-b17
          speaker: pinocchio
          text: He's the best papa in the world, and I'm about the worst son anyone could find.
        - id: ch01-b18
          speaker: dolphin
          text: In last night's terrible storm, that little boat must have sunk.
        - id: ch01-b19
          speaker: pinocchio
          text: What happened to my papa?
        - id: ch01-b20
          speaker: dolphin
          text: The terrible Dog-Fish must have swallowed him. For the past several days, that monster has brought ruin and destruction to these waters.
        - id: ch01-b21
          speaker: pinocchio
          text: Is this Dog-Fish very big?
          emotion: fearful
        - id: ch01-b22
          speaker: narrator
          text: Pinocchio was already beginning to tremble.
        - id: ch01-b23
          speaker: dolphin
          text: Big? He's larger than a five-story house. His mouth is so enormous and deep that a whole train, smoking engine and all, could go straight down his throat.
        - id: ch01-b24
          speaker: pinocchio
          text: Mercy! Goodbye, Sir Fish. I'm sorry to trouble you, and thank you for being so kind.
          emotion: fearful
        - id: ch01-b25
          speaker: narrator
          text: Pinocchio pulled on his clothes as fast as he could and hurried onto the path the Dolphin had shown him. He did not waste another moment beside the water. Soon he was walking so fast that he was almost running. At every little sound, he turned and looked over his shoulder. He feared that the terrible Dog-Fish might be following him, with a railway train in its enormous mouth.
        - id: ch01-b26
          speaker: narrator
          text: After half an hour, he reached a small place called the Village of the Industrious Bees. Its road was alive with people hurrying this way and that to take care of their business. Everyone was working, and everyone had something useful to do. You could have searched the whole village with a lighted lamp and still not found one idler or vagabond.
        - id: ch01-b27
          speaker: pinocchio
          text: Oh, this village will never suit me. I wasn't born to work!
        - id: ch01-b28
          speaker: narrator
          text: Lazy Pinocchio was in terrible pain from hunger. He had eaten nothing for twenty-four hours, not even a single piece of vetch. He had to find food somehow. There were only two ways to get it. He could ask someone for a little work and earn a meal, or he could beg for a nickel or a bite of bread.
        - id: ch01-b29
          speaker: narrator
          text: He felt ashamed to beg. His father had always taught him that only the old and the sick had a right to ask for charity. People who could no longer earn their own bread because of age or illness truly deserved help and compassion. Everyone else had a duty to work with their own hands. If able people refused to work and then suffered from hunger, that was their own doing.
        - id: ch01-b30
          speaker: narrator
          text: At that moment, a man came down the road, tired and gasping for breath. He was all alone, dragging two carts loaded with charcoal. Every step cost him a great effort. The man's face looked kind, so Pinocchio gathered his courage and approached him. The puppet lowered his eyes in shame and spoke in a quiet voice.
        - id: ch01-b31
          speaker: pinocchio
          text: Would you please give me a nickel? I'm starving.
        - id: ch01-b32
          speaker: charcoal_man
          text: I'll give you more than a nickel. I'll give you a quarter if you help me pull these two carts of charcoal home.
        - id: ch01-b33
          speaker: pinocchio
          text: I can't believe you'd ask me that! I'm not used to doing a donkey's work. I've never pulled a cart in my life!
          emotion: angry
        - id: ch01-b34
          speaker: charcoal_man
          text: Good for you. But if you're truly starving, my boy, swallow two big slices of your pride. Just take care they don't give you indigestion.
        - id: ch01-b35
          speaker: narrator
          text: A few minutes later, a mason came along with a basket of lime on his shoulders.
        - id: ch01-b36
          speaker: pinocchio
          text: Please, good sir, could you spare a nickel for a poor boy who's yawning with hunger?
        - id: ch01-b37
          speaker: mason
          text: Gladly. Come carry this lime for me, and I'll pay you a quarter instead.
        - id: ch01-b38
          speaker: pinocchio
          text: But that lime is heavy, and I don't want to wear myself out.
        - id: ch01-b39
          speaker: mason
          text: Then don't wear yourself out, my boy. Stay here and enjoy your yawning. I hope it does you plenty of good.
        - id: ch01-b40
          speaker: narrator
          text: In less than half an hour, twenty more people passed along the busy road. Pinocchio asked every one of them for charity. Not one offered him money or bread. They all answered him in much the same way.
        - id: ch01-b41
          speakers: [worker_1, worker_2, worker_3]
          ensemble: chorus
          text: Aren't you ashamed to beg? Stop loafing on the road. Find some work and earn your bread.
        - id: ch01-b42
          speaker: narrator
          text: At last, a pleasant little woman came by carrying two cans of water.
        - id: ch01-b43
          speaker: pinocchio
          text: Could I please have a little water from your can? I'm burning with thirst.
        - id: ch01-b44
          speaker: little_woman
          text: Of course, my boy. Drink as much as you need.
        - id: ch01-b45
          speaker: narrator
          text: The little woman set both cans down. Pinocchio drank like a fish. Then he wiped his mouth and muttered to himself.
        - id: ch01-b46
          speaker: pinocchio
          text: My thirst is gone. Now if only I could do something about my hunger.
        - id: ch01-b47
          speaker: little_woman
          text: Help me carry these two cans home, and I'll give you a fine piece of bread.
        - id: ch01-b48
          speaker: narrator
          text: Pinocchio looked at one of the cans. He did not say yes, and he did not say no.
        - id: ch01-b49
          speaker: little_woman
          text: Along with the bread, you can have a nice dish of cauliflower with oil and vinegar.
        - id: ch01-b50
          speaker: narrator
          text: Pinocchio looked at the can again. He still said neither yes nor no.
        - id: ch01-b51
          speaker: little_woman
          text: And after the cauliflower, I'll give you a beautiful syrup-filled candy.
        - id: ch01-b52
          speaker: narrator
          text: That last treat was too tempting. Pinocchio could hold out no longer. He made up his mind.
        - id: ch01-b53
          speaker: pinocchio
          text: All right, I'll be patient. I'll carry one of the cans to your house.
        - id: ch01-b54
          speaker: narrator
          text: The water can was heavy. Pinocchio tried, but he was not strong enough to carry it in his hand. In the end, he had to accept the trouble of balancing it on top of his head all the way to the woman's house.
        - id: ch01-b55
          speaker: narrator
          text: When they reached the house, the kind little woman seated Pinocchio at a small table that was already set. She put the bread, the cauliflower, and the candy in front of him.
        - id: ch01-b56
          speaker: narrator
          text: Pinocchio did not eat the food. He devoured it. His stomach was like an apartment that had stood empty for five whole months.
        - id: ch01-b57
          speaker: narrator
          text: Once his fierce hunger had eased a little, he raised his head to thank the woman who had helped him. But the moment he truly looked at her, a long cry of amazement escaped him. He could not stop staring. His eyes opened wide, his fork hung motionless in the air, and his mouth was still full of bread and cauliflower. He looked as though someone had cast a spell on him.
        - id: ch01-b58
          speaker: little_woman
          text: What has astonished you so much?
        - id: ch01-b59
          speaker: narrator
          text: The good woman laughed as she asked him.
        - id: ch01-b60
          speaker: pinocchio
          text: It's... it's because you look like... you remind me of her. Yes, yes! The same voice, the same eyes, the same hair. Your hair is blue too, just like hers was. Oh, little Fairy! Tell me it's really you! Please don't make me cry anymore. If you only knew how much I've cried and how much I've suffered!
          emotion: surprised
        - id: ch01-b61
          speaker: narrator
          text: With that, Pinocchio threw himself onto the floor at her feet. He wrapped both arms around the knees of the mysterious little woman and held on. Then he began to weep bitterly.
