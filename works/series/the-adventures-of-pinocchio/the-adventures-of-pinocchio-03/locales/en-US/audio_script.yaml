  chapters:
    - id: ch01
      title: Geppetto Names His Puppet Pinocchio
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Geppetto lived in a little room on the ground floor. The only light came in from the staircase. His furniture was as simple as it could be. There was one shaky chair, a miserable bed, and a worn-out table. A fire seemed to glow at the far end of the room, with a saucepan bubbling merrily above it. Smoke curled up from the pot and looked perfectly real. But the fire, the saucepan, and even the smoke were all painted on the wall.
        - id: ch01-b02
          speaker: narrator
          text: As soon as Geppetto got home, he brought out his tools and began cutting and shaping his puppet.
        - id: ch01-b03
          speaker: geppetto
          text: Now, what should I name him? Pinocchio. Yes, I'll call him Pinocchio. That name ought to bring him luck. I once knew a whole family of Pinocchios. The father was Pinocchio, the mother was Pinocchia, and the children were Pinocchi. They all did very well. Why, the richest one was a beggar.
        - id: ch01-b04
          speaker: narrator
          text: With the name settled, Geppetto got down to serious work. First he made the hair, then the forehead, and then the eyes. The instant those eyes were finished, they moved. They fixed themselves on Geppetto and stared.
        - id: ch01-b05
          speaker: narrator
          text: Geppetto stared back at the two wooden eyes. He could hardly believe what he was seeing, and it made him angry.
        - id: ch01-b06
          speaker: geppetto
          text: You wicked wooden eyes! What are you staring at?
          emotion: angry
        - id: ch01-b07
          speaker: narrator
          text: There was no answer. Geppetto went on to carve the nose. The moment he made it, it began to grow. It grew and grew and kept on growing. In just a few minutes, it had turned into an enormous nose that seemed as if it would never end.
        - id: ch01-b08
          speaker: narrator
          text: Poor Geppetto cut it shorter and shorter until he wore himself out. It did no good. The more he trimmed that rude nose, the longer it became.
        - id: ch01-b09
          speaker: narrator
          text: He had not even finished the mouth when it began laughing at him and making fun of him.
        - id: ch01-b10
          speaker: geppetto
          text: Stop that laughing!
          emotion: angry
        - id: ch01-b11
          speaker: narrator
          text: He might as well have been talking to the wall. The mouth went right on laughing. Geppetto's temper rose, and this time he roared at it.
        - id: ch01-b12
          speaker: geppetto
          text: I said stop laughing!
          emotion: angry
        - id: ch01-b13
          speaker: narrator
          text: At last the mouth stopped. Then it stuck its tongue out as far as it could. Geppetto did not want to ruin his work, so he pretended not to notice. He kept carving. After the mouth came the chin, the throat, the shoulders, the stomach, the arms, and finally the hands.
        - id: ch01-b14
          speaker: narrator
          text: The hands were barely finished when Geppetto felt his wig pulled right off his head. He spun around. There stood the puppet, holding the yellow wig in one wooden hand.
        - id: ch01-b15
          speaker: geppetto
          text: Pinocchio! Give me my wig back this instant!
          emotion: angry
        - id: ch01-b16
          speaker: narrator
          text: Pinocchio did not give it back. He put the wig on his own head instead, and it nearly swallowed him up.
        - id: ch01-b17
          speaker: narrator
          text: That rude little joke made Geppetto sadder than he had ever felt in his life. He turned to Pinocchio with a heavy heart.
        - id: ch01-b18
          speaker: geppetto
          text: You little rascal! I haven't even finished making you, and already you're treating your father with no respect. That's bad, my boy. Very bad.
          emotion: sad
        - id: ch01-b19
          speaker: narrator
          text: Geppetto wiped away a tear. Only the legs and feet were left to make. As soon as he finished the feet, one of them kicked him square on the tip of his nose.
        - id: ch01-b20
          speaker: geppetto
          text: I had that coming. I should have thought about this sooner. Now it's too late.
        - id: ch01-b21
          speaker: narrator
          text: Geppetto lifted the puppet under the arms and set him on the floor. It was time to teach him to walk. At first Pinocchio's legs were so stiff that he could not move at all. Geppetto held his hand and showed him how to place one foot in front of the other.
        - id: ch01-b22
          speaker: narrator
          text: Before long, Pinocchio's legs loosened up. He began walking on his own. Then he ran around the room. He reached the open door, sprang outside, and escaped into the street.
        - id: ch01-b23
          speaker: narrator
          text: Poor Geppetto raced after him, but he could not catch him. Pinocchio bounded ahead like a hare. His wooden feet struck the pavement with as much clatter as twenty pairs of farmers' wooden shoes.
        - id: ch01-b24
          speaker: geppetto
          text: Stop him! Somebody stop him!
        - id: ch01-b25
          speaker: narrator
          text: People in the street saw a wooden puppet racing past like a horse. They stopped in amazement, then laughed and laughed as they watched him go.
        - id: ch01-b26
          speaker: narrator
          text: At last, a soldier came along. He heard all the noise and thought someone's young horse must have broken loose. He planted himself in the middle of the road with his legs wide apart. He was determined to stop the runaway before anything worse happened.
        - id: ch01-b27
          speaker: narrator
          text: Pinocchio saw the soldier blocking the whole street. He tried to catch him by surprise and dart between his legs. It did not work. Without moving from his spot, the soldier reached out, caught Pinocchio neatly by the nose, and handed him over to Geppetto.
        - id: ch01-b28
          speaker: narrator
          text: Geppetto meant to punish Pinocchio by pulling his ears. But when he reached for them, he could not find them anywhere. In his hurry to finish the puppet, he had forgotten to make any ears at all.
        - id: ch01-b29
          speaker: narrator
          text: So Geppetto took Pinocchio by the collar and started leading him away. He shook his head and warned him as they went.
        - id: ch01-b30
          speaker: geppetto
          text: We're going straight home. Once we get there, you can be sure you and I are going to settle this.
          emotion: angry
        - id: ch01-b31
          speaker: narrator
          text: The moment Pinocchio heard that, he threw himself on the ground and refused to take one more step. Curious people with nothing better to do began gathering around them. Soon there was a whole ring of onlookers, and everyone had something to say.
        - id: ch01-b32
          speakers: [bystander_1, bystander_2]
          ensemble: duo
          text: Poor little puppet! No wonder he won't go home. Who knows how badly that wicked old Geppetto will beat him?
        - id: ch01-b33
          speaker: narrator
          text: Others in the crowd were even more spiteful.
        - id: ch01-b34
          speakers: [bystander_3, bystander_4]
          ensemble: duo
          text: Geppetto may look like a good man, but he's a terrible tyrant with boys. If you leave that poor puppet with him, he'll probably tear him to pieces!
        - id: ch01-b35
          speaker: narrator
          text: The crowd went on talking and making such a commotion that the soldier finally let Pinocchio go free and took Geppetto to prison instead. Poor Geppetto could not find the words to defend himself. He cried like a calf as the soldier led him away, and between his sobs he called back to Pinocchio.
        - id: ch01-b36
          speaker: geppetto
          text: You miserable boy! I worked so hard to make you a well-behaved puppet. But this is what I deserve. I should have thought of it sooner!
          emotion: sad
