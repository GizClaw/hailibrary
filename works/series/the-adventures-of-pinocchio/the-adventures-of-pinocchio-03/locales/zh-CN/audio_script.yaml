audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖从容，带一点一本正经的幽默
        timbre: 清晰醇厚
        pace: 舒缓，遇到惊奇处略微加快
        pitch: 中
    geppetto:
      display_name: 杰佩托
      tts:
        delivery: 活泼直率，发怒时火爆而有喜剧感
        timbre: 苍老而响亮
        pace: 中等，争吵时急促
        pitch: 中高
    onlookers:
      display_name: 围观的人们
      tts:
        delivery: 七嘴八舌，自以为是，带着看热闹的兴奋
        timbre: 混杂而清楚
        pace: 稍快
        pitch: 中
  chapters:
    - id: ch01
      title: 木偶有了名字
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 杰佩托住在底层的一间小屋里，只有楼梯口能透进一点光。屋里的家具少得可怜，只有一把摇摇晃晃的椅子、一张破床和一张快散架的桌子。屋子尽头倒有一座燃着火的壁炉。可你仔细看，那火是画出来的。火边还有一口画出来的锅，正欢快地咕嘟冒泡，吐出的烟却像真的一样。
        - id: ch01-b02
          speaker: narrator
          text: 杰佩托回到家，马上拿出工具，动手雕木偶。他一边琢磨，一边给木偶想名字。
        - id: ch01-b03
          speaker: geppetto
          text: 给他取个什么名字呢？就叫匹诺曹吧，这名字一定能带来好运。我以前认识一家人，父亲叫匹诺曹，母亲叫匹诺佳，孩子们叫匹诺奇。他们个个过得不错，最有钱的那个还是个讨饭的呢。
        - id: ch01-b04
          speaker: narrator
          text: 名字定下来，杰佩托便认真雕起来。他先刻出头发，再刻额头，然后是眼睛。那双眼睛才做好，立刻转动起来，直勾勾地盯住了他。杰佩托又吃惊又恼火。
        - id: ch01-b05
          speaker: geppetto
          text: 你们这双坏透了的木头眼睛，为什么一直盯着我？
          emotion: angry
        - id: ch01-b06
          speaker: narrator
          text: 没有谁回答。杰佩托只好继续刻鼻子。鼻子刚成形就往长里长，越长越长，没过几分钟，已经大得吓人，好像永远也长不到头。可怜的杰佩托拼命去削，累得筋疲力尽。谁知他越削，那只放肆的鼻子反而越长。
        - id: ch01-b07
          speaker: narrator
          text: 嘴巴还没刻好，又开始冲他发笑。
        - id: ch01-b08
          speaker: geppetto
          text: 不许笑！
          emotion: angry
        - id: ch01-b09
          speaker: narrator
          text: 这句话像是说给墙听的，那张嘴根本不理他。杰佩托只得提高嗓门，吓唬起来。
        - id: ch01-b10
          speaker: geppetto
          text: 听见没有？我叫你不许笑！
          emotion: angry
        - id: ch01-b11
          speaker: narrator
          text: 那张嘴终于不笑了，却把舌头伸得老长。杰佩托舍不得毁掉自己的心血，便装作没看见，接着刻下巴、喉咙、肩膀、肚子、胳膊和双手。
    - id: ch02
      title: 还没做完的小坏蛋
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 双手刚刻好，杰佩托头上的假发就被一把揪走了。他转过身，只见自己的黄假发已经抓在木偶手里。
        - id: ch02-b02
          speaker: geppetto
          text: 匹诺曹！快把我的假发还来！
          emotion: angry
        - id: ch02-b03
          speaker: narrator
          text: 匹诺曹不肯还，反而把假发扣到自己头上，差点把自己闷死。木偶这样蛮横，还故意戏弄人，杰佩托心里难过极了。他这一辈子都没有这么伤心过。
        - id: ch02-b04
          speaker: geppetto
          text: 你这个小坏蛋！身子还没做完，就敢不把父亲放在眼里了。这样很不好，孩子，实在太不好了！
          emotion: sad
        - id: ch02-b05
          speaker: narrator
          text: 杰佩托擦掉一滴眼泪，又去做剩下的双腿和双脚。脚刚做好，他的鼻尖就挨了狠狠一脚。
        - id: ch02-b06
          speaker: geppetto
          text: 这是我活该！我早就该想到的。现在后悔也来不及了！
        - id: ch02-b07
          speaker: narrator
          text: 他抱着匹诺曹的腋下，把木偶放在地板上，开始教他走路。起初，匹诺曹的腿直挺挺的，怎么也动不了。杰佩托牵着他的手，教他把两只脚一前一后地迈出去。等双腿活动开了，匹诺曹便自己走了起来，还满屋子乱跑。
        - id: ch02-b08
          speaker: narrator
          text: 跑着跑着，他冲出家门，一下跳到街上，逃走了。杰佩托赶忙追出去，可哪里追得上！匹诺曹像只野兔，在前面一蹦一跳。两只木脚敲着石板路，噼啪乱响，那声音简直比二十双农夫的木鞋还吵。
        - id: ch02-b09
          speaker: geppetto
          text: 拦住他！快替我拦住他！
        - id: ch02-b10
          speaker: narrator
          text: 街上的人看见一个木偶跑得像匹赛马，都惊得停下脚步。他们站在那里看，还笑个不停。
    - id: ch03
      title: 杰佩托反被押走
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 幸好，一名士兵赶来了。他听见这阵喧闹，以为是谁家的小马驹挣脱了主人。士兵勇敢地站到路中央，两腿岔开。他下定决心，一定要把逃跑的家伙拦住，免得再闹出乱子。
        - id: ch03-b02
          speaker: narrator
          text: 匹诺曹远远看见士兵挡住整条街，便想趁他没防备，从他两腿之间钻过去。这个主意彻底失败了。士兵站着一动没动，伸手便揪住匹诺曹的鼻子，把他交回杰佩托手里。
        - id: ch03-b03
          speaker: narrator
          text: 杰佩托想马上揪住木偶的耳朵，好好罚他。可是找来找去，哪里都没有耳朵。你知道为什么吗？他急着把木偶做完，竟忘记刻耳朵了。
        - id: ch03-b04
          speaker: narrator
          text: 杰佩托只好揪住匹诺曹的衣领，带着他往回走。他一边走，一边威吓地摇头。
        - id: ch03-b05
          speaker: geppetto
          text: 现在马上回家。等进了门，我们就把这笔账好好算一算，你等着吧！
          emotion: angry
        - id: ch03-b06
          speaker: narrator
          text: 匹诺曹听完，索性躺到地上，再也不肯走一步。没过多久，一群闲着没事又爱看热闹的人围了上来。他们站成一圈，七嘴八舌，什么话都说。
        - id: ch03-b07
          speaker: onlookers
          text: 这个木偶真可怜！他不肯回家就对了。杰佩托那个坏老头，还不知道会怎么打他呢！
        - id: ch03-b08
          speaker: narrator
          text: 另一些人更坏，故意在旁边添油加醋。
        - id: ch03-b09
          speaker: onlookers
          text: 杰佩托表面上像个好人，对孩子却是个十足的暴君！把这可怜的木偶交给他，他没准会把木偶撕成碎片！
        - id: ch03-b10
          speaker: narrator
          text: 人们越说越来劲，事情也越闹越大。最后，士兵居然放走匹诺曹，反而把杰佩托押进监狱。可怜的老人嘴笨，想不出话替自己辩解，只能像小牛一样放声大哭。被押走的时候，他抽抽噎噎地说出了心里的委屈。
        - id: ch03-b11
          speaker: geppetto
          text: 这个害人精！我费了那么大的力气，只想把他做成一个懂规矩的木偶！可这也是我活该，我早该想到会这样的！
          emotion: sad
