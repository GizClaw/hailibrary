audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖从容，带一点一本正经的幽默
        timbre: 清晰醇厚
        pace: 舒缓，遇到惊奇处略微加快
        pitch: 中
    pinocchio:
      display_name: 匹诺曹
      tts:
        delivery: 任性直率，嘴硬而孩子气，发怒时冲动急躁
        timbre: 清亮，带木偶般的脆响
        pace: 偏快，争辩时更急
        pitch: 中高
    schoolboy_1:
      display_name: 同学甲
      tts:
        delivery: 顽皮大胆，带头起哄时满是恶作剧般的得意
        timbre: 明亮稚嫩，声音清脆
        pace: 快而利落
        pitch: 高
    schoolboy_2:
      display_name: 同学乙
      tts:
        delivery: 爱逞强，挨了疼也要抢着反驳
        timbre: 稚嫩略沙，带一点倔强
        pace: 偏快，重话咬字清楚
        pitch: 中高
    schoolboy_3:
      display_name: 同学丙
      tts:
        delivery: 油嘴滑舌，怂恿伙伴时轻佻又自信
        timbre: 清亮偏薄，带少年人的笑意
        pace: 轻快，劝诱时连贯紧凑
        pitch: 中
    fairy:
      display_name: 蓝发仙女
      tts:
        delivery: 温柔亲切，话语简洁而沉静
        timbre: 柔和清澈
        pace: 舒缓
        pitch: 中高
  chapters:
    - id: ch01
      title: 木偶进了学校
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 第二天，匹诺曹走进了公立学校。孩子们一看，教室里居然来了个木偶，全都乐坏了。他们笑个不停，还轮番捉弄他。有人抢帽子，有人从背后扯外套。一个孩子想用墨水给他画上两撇胡子，另一个还想用绳子拴住他的手脚，让他跳舞。
        - id: ch01-b02
          speaker: narrator
          text: 匹诺曹起先装作没事，能忍就忍。可那几个孩子越闹越凶，拿他当笑话看。到最后，他再也忍不住了，气冲冲地转过身。
        - id: ch01-b03
          speaker: pinocchio
          text: 你们可小心点儿！我来学校不是给你们当小丑的。我尊重别人，你们也得尊重我。
          emotion: angry
        - id: ch01-b04
          speakers: [schoolboy_1, schoolboy_2, schoolboy_3]
          ensemble: chorus
          text: 说得可真漂亮啊，大话精！你简直像一本会说话的书！
        - id: ch01-b05
          speaker: narrator
          text: 小坏蛋们笑得直不起腰，还扯着嗓子起哄。其中最放肆的一个伸出手，想揪住匹诺曹的鼻尖。可他的手还没碰到，匹诺曹已经从桌子底下伸出腿，狠狠踢中了他的小腿骨。
        - id: ch01-b06
          speaker: schoolboy_1
          text: 哎哟！他的脚怎么这么硬？
        - id: ch01-b07
          speaker: narrator
          text: 挨踢的孩子大叫着，赶紧去揉那块淤青。另一个刚才也在胡闹，肚子上已经吃过匹诺曹一肘子。
        - id: ch01-b08
          speaker: schoolboy_2
          text: 他的胳膊肘更硬，比脚还要硬！
        - id: ch01-b09
          speaker: narrator
          text: 奇怪的是，这一脚加上一肘子，反倒让匹诺曹赢得了全校孩子的好感和敬意。大家都愿意跟他交朋友，也真心喜欢起他来。
    - id: ch02
      title: 太多坏朋友
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 老师也很欣赏匹诺曹。他听课专心，肯下功夫，脑子又灵。每天，他第一个来到学校，放学后又最后一个离开。
        - id: ch02-b02
          speaker: narrator
          text: 可匹诺曹有个毛病，他结交的朋友实在太多了。其中几个小坏蛋出了名地不爱学习，只爱惹祸。
        - id: ch02-b03
          speaker: narrator
          text: 老师每天都提醒他，一天也没有落下。善良的仙女也一次又一次地劝他。
        - id: ch02-b04
          speaker: fairy
          text: 匹诺曹，你可得当心！再这样跟坏同学混下去，你迟早会不想读书。他们说不定还会给你惹来一场大祸。
        - id: ch02-b05
          speaker: pinocchio
          text: 才不会呢！
        - id: ch02-b06
          speaker: narrator
          text: 木偶耸耸肩，又拿手点了点额头。那副模样像是在说，他脑袋里的智慧多着呢。
    - id: ch03
      title: 海边的天大消息
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 一个晴朗的日子，匹诺曹正走在上学路上，几个平常总跟他一起玩的伙伴围了过来。
        - id: ch03-b02
          speaker: schoolboy_1
          text: 你听说那个天大的消息了吗？
        - id: ch03-b03
          speaker: pinocchio
          text: 我还没听说。
        - id: ch03-b04
          speaker: schoolboy_2
          text: 附近海里来了一条大鲨鱼，足足有一座山那么大！
        - id: ch03-b05
          speaker: pinocchio
          text: 真的吗？会不会就是我爸爸遇难时，待在那片海里的大鲨鱼？
        - id: ch03-b06
          speaker: schoolboy_3
          text: 我们正要去海边看它。你也跟我们去吧？
        - id: ch03-b07
          speaker: pinocchio
          text: 我不去，我还要上学。
        - id: ch03-b08
          speaker: schoolboy_1
          text: 上学有什么要紧？明天再去不就行了。多上一堂课，少上一堂课，反正我们还是一样的蠢驴。
        - id: ch03-b09
          speaker: pinocchio
          text: 可是老师会怎么说？
        - id: ch03-b10
          speaker: schoolboy_2
          text: 老师爱说什么就说什么。他领了薪水，本来就是要整天数落人的。
        - id: ch03-b11
          speaker: pinocchio
          text: 那我妈妈会怎么说？
        - id: ch03-b12
          speakers: [schoolboy_1, schoolboy_2, schoolboy_3]
          ensemble: chorus
          text: 当妈妈的什么也不懂。
        - id: ch03-b13
          speaker: pinocchio
          text: 那我告诉你们我的打算吧。我确实有理由去看那条大鲨鱼，不过我要等放学以后再去。
        - id: ch03-b14
          speaker: schoolboy_3
          text: 你这个可怜的蠢驴！那么大的鱼难道会等你有空吗？它在这儿待腻了，就会游去别的地方。到那时，你想看也来不及了。
        - id: ch03-b15
          speaker: pinocchio
          text: 从这里走到海边，要用多长时间？
        - id: ch03-b16
          speaker: schoolboy_1
          text: 一个钟头就能来回一趟。
    - id: ch04
      title: 朝海边飞奔
      blocks:
        - id: ch04-b01
          speaker: pinocchio
          text: 那就出发！谁跑得最快，谁就是最棒的！
        - id: ch04-b02
          speaker: narrator
          text: 匹诺曹一声喊，孩子们把课本和练习簿夹在胳膊底下，拔腿冲过田野。匹诺曹一直跑在最前面，两只脚就像长了翅膀。
        - id: ch04-b03
          speaker: narrator
          text: 他不时回头取笑那些落在远处的伙伴。孩子们个个跑得气喘吁吁，满身尘土，舌头都伸到了嘴外。匹诺曹看见他们那副模样，只顾放声大笑。
        - id: ch04-b04
          speaker: narrator
          text: 这个不幸的孩子一点也不知道，前面正有多少恐惧和可怕的灾祸等着他！
