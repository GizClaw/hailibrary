  chapters:
    - id: ch01
      title: The "Land of Boobies"
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: As you might expect, Pinocchio asked the Fairy if he could go around town and invite his friends.
        - id: ch01-b02
          speaker: fairy
          text: You may go and invite them to breakfast tomorrow. Just remember, you must be home before dark. Do you understand?
        - id: ch01-b03
          speaker: pinocchio
          text: I promise I'll be back in an hour.
        - id: ch01-b04
          speaker: fairy
          text: Be careful, Pinocchio. Boys are quick to make promises, but they don't often keep them.
        - id: ch01-b05
          speaker: pinocchio
          text: I'm not like other boys. If I say I'll do something, I do it.
        - id: ch01-b06
          speaker: fairy
          text: We'll see. If you disobey me, you'll be the one who suffers.
        - id: ch01-b07
          speaker: pinocchio
          text: Why would I suffer?
        - id: ch01-b08
          speaker: fairy
          text: Because boys who won't listen to people who know better always run into trouble.
        - id: ch01-b09
          speaker: pinocchio
          text: I've learned that for myself. I won't make that mistake again.
        - id: ch01-b10
          speaker: fairy
          text: We'll see if you mean it.
        - id: ch01-b11
          speaker: narrator
          text: The Fairy said no more. Pinocchio said goodbye to her. She was good to him, just like a mother. Then he went out of the house, singing and dancing as he went.
        - id: ch01-b12
          speaker: narrator
          text: In less than an hour, he had invited every one of his friends. Some accepted at once and meant it. Others had to be coaxed. But then they heard about the rolls that would come with the coffee. Those rolls would be buttered on both sides. After that, the last of them agreed.
        - id: ch01-b13
          speakers: [schoolmate_1, schoolmate_2, schoolmate_3]
          ensemble: chorus
          text: All right, we'll come too, just to make you happy!
        - id: ch01-b14
          speaker: narrator
          text: Pinocchio had many friends and schoolmates, but there was one he liked much more than the others. He was very fond of that boy. His real name was Romeo, though everyone called him Candlewick. The nickname fit him. He was thin, straight, and bright, like the new wick in a little night-light.
        - id: ch01-b15
          speaker: narrator
          text: Candlewick was the laziest and naughtiest boy in the whole school. Even so, Pinocchio was devoted to him. He had gone straight to Candlewick's house to invite him to breakfast, but his friend wasn't there. Pinocchio came back a second time and still missed him. He tried a third time, but that was no use either. Where could Candlewick be? Pinocchio looked here, there, and everywhere. At last, he spotted the boy hiding on the porch of a farmer's cottage.
        - id: ch01-b16
          speaker: pinocchio
          text: What are you doing out here?
        - id: ch01-b17
          speaker: candlewick
          text: Waiting for midnight. Then I'm leaving.
        - id: ch01-b18
          speaker: pinocchio
          text: Where are you going?
        - id: ch01-b19
          speaker: candlewick
          text: To the most wonderful country in the world. It's a real land of candy!
        - id: ch01-b20
          speaker: pinocchio
          text: What's it called?
        - id: ch01-b21
          speaker: candlewick
          text: The Land of Boobies. Why don't you come with me?
        - id: ch01-b22
          speaker: pinocchio
          text: Me? Never!
        - id: ch01-b23
          speaker: candlewick
          text: That's a mistake, Pinocchio. You'll be sorry if you stay behind. Where else could boys like us find a better place? There are no schools, teachers, or books. Nobody studies there. There's never school on Saturday, and every week has six Saturdays and one Sunday. Just think! Autumn vacation starts on January first and ends on December thirty-first. That's the place for me. Every civilized country ought to be like it!
        - id: ch01-b24
          speaker: pinocchio
          text: So what do people do all day in the Land of Boobies?
        - id: ch01-b25
          speaker: candlewick
          text: We spend the whole day playing and having fun, from morning until night. When night comes, we go to bed. In the morning, we get up and start the same life all over again. Well, what do you think of that?
        - id: ch01-b26
          speaker: pinocchio
          text: Hmm...
        - id: ch01-b27
          speaker: narrator
          text: Pinocchio made a thoughtful little sound and gave his head a slight shake. He didn't say it aloud, but his face seemed to say that he would gladly live that way too.
        - id: ch01-b28
          speaker: candlewick
          text: Well? Are you coming or not? Make up your mind.
        - id: ch01-b29
          speaker: pinocchio
          text: No, no, no, and no again! I promised my good Fairy I'd behave, and I mean to keep my word. The sun is going down, so I have to run. Goodbye, and have a good trip.
        - id: ch01-b30
          speaker: candlewick
          text: Why are you rushing away?
        - id: ch01-b31
          speaker: pinocchio
          text: I'm going home. The Fairy told me to be back before dark.
        - id: ch01-b32
          speaker: candlewick
          text: Stay two more minutes.
        - id: ch01-b33
          speaker: pinocchio
          text: Then I'll be late.
        - id: ch01-b34
          speaker: candlewick
          text: Just two minutes.
        - id: ch01-b35
          speaker: pinocchio
          text: What if the Fairy scolds me?
        - id: ch01-b36
          speaker: candlewick
          text: Let her. Once she's had a good scold, she'll stop talking.
        - id: ch01-b37
          speaker: narrator
          text: That was Candlewick for you. He really was a rascal.
        - id: ch01-b38
          speaker: pinocchio
          text: Are you going by yourself, or are other boys coming?
        - id: ch01-b39
          speaker: candlewick
          text: By myself? Of course not! There'll be more than a hundred boys.
        - id: ch01-b40
          speaker: pinocchio
          text: Are you all walking there?
        - id: ch01-b41
          speaker: candlewick
          text: A coach will be here soon. It's taking me to that happy country.
        - id: ch01-b42
          speaker: pinocchio
          text: I wish the coach would come right now!
        - id: ch01-b43
          speaker: candlewick
          text: Why?
        - id: ch01-b44
          speaker: pinocchio
          text: So I could watch all of you leave together.
        - id: ch01-b45
          speaker: candlewick
          text: Stay a little longer, and you will.
        - id: ch01-b46
          speaker: pinocchio
          text: No, I have to go home.
        - id: ch01-b47
          speaker: candlewick
          text: Two more minutes.
        - id: ch01-b48
          speaker: pinocchio
          text: I've waited too long already. The Fairy will be worried about me.
        - id: ch01-b49
          speaker: candlewick
          text: Poor Fairy! Does she think the bats will eat you?
        - id: ch01-b50
          speaker: pinocchio
          text: But tell me, are you completely sure there aren't any schools there?
        - id: ch01-b51
          speaker: candlewick
          text: Not even the shadow of a school.
        - id: ch01-b52
          speaker: pinocchio
          text: And there aren't any teachers?
        - id: ch01-b53
          speaker: candlewick
          text: Not one.
        - id: ch01-b54
          speaker: pinocchio
          text: And nobody ever has to study?
        - id: ch01-b55
          speaker: candlewick
          text: Never, never, never!
        - id: ch01-b56
          speaker: pinocchio
          text: What a wonderful country! I've never been there, but I can picture it perfectly.
        - id: ch01-b57
          speaker: narrator
          text: His mouth watered as he thought about such a place. He had never seen the Land of Boobies, yet he could already imagine it.
        - id: ch01-b58
          speaker: candlewick
          text: Then why won't you come?
        - id: ch01-b59
          speaker: pinocchio
          text: Don't bother trying to tempt me. I promised the Fairy I'd be sensible, and I won't break my word.
        - id: ch01-b60
          speaker: candlewick
          text: Fine, goodbye. If you see the boys from school, tell them I said hello.
        - id: ch01-b61
          speaker: pinocchio
          text: Goodbye, Candlewick. Have a good trip, enjoy yourself, and remember your friends now and then.
        - id: ch01-b62
          speaker: narrator
          text: With that, Pinocchio started to leave. He took one step, then another. But after only those two steps, he stopped. He turned around to face his friend and asked one more question.
        - id: ch01-b63
          speaker: pinocchio
          text: You're absolutely sure every week there has six Saturdays and one Sunday?
        - id: ch01-b64
          speaker: candlewick
          text: Absolutely.
        - id: ch01-b65
          speaker: pinocchio
          text: And you know for certain that vacation starts on January first and lasts through December thirty-first?
        - id: ch01-b66
          speaker: candlewick
          text: I certainly do.
        - id: ch01-b67
          speaker: pinocchio
          text: What a wonderful country!
          emotion: happy
        - id: ch01-b68
          speaker: narrator
          text: Pinocchio looked completely enchanted. Still, he put on a determined face and hurried through his next words.
        - id: ch01-b69
          speaker: pinocchio
          text: This time I really am leaving. Goodbye, and have a good trip!
        - id: ch01-b70
          speaker: candlewick
          text: Goodbye.
        - id: ch01-b71
          speaker: pinocchio
          text: When do you leave?
        - id: ch01-b72
          speaker: candlewick
          text: Soon.
        - id: ch01-b73
          speaker: pinocchio
          text: What a shame! If you were leaving in an hour, I might almost stay and wait.
        - id: ch01-b74
          speaker: candlewick
          text: What about the Fairy?
        - id: ch01-b75
          speaker: pinocchio
          text: It's already late. Another hour won't make any difference now.
        - id: ch01-b76
          speaker: candlewick
          text: Poor Pinocchio! What if the Fairy scolds you?
        - id: ch01-b77
          speaker: pinocchio
          text: I'll just have to put up with it. Once she's had a good scold, she'll stop talking.
        - id: ch01-b78
          speaker: narrator
          text: While they were talking, night came on. Soon it was completely dark. Then, all at once, they noticed a tiny light moving in the distance. Voices carried toward them through the darkness. Along with the voices came the sound of a trumpet. It was so small and faint that it seemed more like the hum of a mosquito.
        - id: ch01-b79
          speaker: candlewick
          text: There it is!
          emotion: happy
        - id: ch01-b80
          speaker: narrator
          text: Candlewick leaped to his feet.
        - id: ch01-b81
          speaker: pinocchio
          text: What is it?
        - id: ch01-b82
          speaker: narrator
          text: Pinocchio spoke in a whisper.
        - id: ch01-b83
          speaker: candlewick
          text: It's the coach coming to get me. So, are you coming or not?
        - id: ch01-b84
          speaker: pinocchio
          text: But is it really true that boys never have to study there?
        - id: ch01-b85
          speaker: candlewick
          text: Never, never, never!
        - id: ch01-b86
          speaker: pinocchio
          text: What a wonderful country! What a wonderful country! What a wonderful country!
          emotion: happy
