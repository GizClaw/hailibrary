audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖从容，带一点一本正经的幽默
        timbre: 清晰醇厚
        pace: 舒缓，遇到惊奇处略微加快
        pitch: 中
    pinocchio:
      display_name: 匹诺曹
      tts:
        delivery: 任性直率，嘴硬而孩子气，危急时急促慌张
        timbre: 清亮，带木偶般的脆响
        pace: 偏快，争辩时更急
        pitch: 中高
    fairy:
      display_name: 仙女
      tts:
        delivery: 温柔庄重，宽容中带着明确的告诫
        timbre: 清澈柔和
        pace: 从容
        pitch: 中高
    schoolmate_1:
      display_name: 同学甲
      tts:
        delivery: 爽快外向，带着嘴馋后改口的顽皮
        timbre: 清亮有活力的少年声音
        pace: 明快利落
        pitch: 偏高
    schoolmate_2:
      display_name: 同学乙
      tts:
        delivery: 随性俏皮，故意装出勉强答应的口气
        timbre: 略带鼻音的少年声音
        pace: 轻快，句尾稍稍拖长
        pitch: 中高
    candlewick:
      display_name: 灯芯
      tts:
        delivery: 懒散顽皮，怂恿朋友时又热切又狡黠
        timbre: 单薄明亮的少年声音
        pace: 轻快，得意时稍慢
        pitch: 中高
  chapters:
    - id: ch01
      title: 明天的早餐会
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 匹诺曹要到城里去送请帖，自然得先问过仙女。
        - id: ch01-b02
          speaker: fairy
          text: 你想去就去吧，也请伙伴们明天来吃早餐。不过你要记住，天黑以前必须回家。听清楚了吗？
        - id: ch01-b03
          speaker: pinocchio
          text: 我保证一个钟头就回来。
        - id: ch01-b04
          speaker: fairy
          text: 你可要当心，匹诺曹。孩子们答应得总是很痛快，守起信用来却没那么痛快。
        - id: ch01-b05
          speaker: pinocchio
          text: 我跟别的孩子不一样。我说到就能做到。
        - id: ch01-b06
          speaker: fairy
          text: 那就等着看吧。你要是不听话，吃亏的可是你自己。
        - id: ch01-b07
          speaker: pinocchio
          text: 为什么吃亏的是我？
        - id: ch01-b08
          speaker: fairy
          text: 因为孩子不听比自己懂得多的人的劝告，早晚会碰上祸事。
        - id: ch01-b09
          speaker: pinocchio
          text: 这苦头我已经吃过了。同样的错，我以后绝不会再犯。
        - id: ch01-b10
          speaker: fairy
          text: 好吧，那就看看你这回是不是真能做到。
        - id: ch01-b11
          speaker: narrator
          text: 匹诺曹没再多说，告别了待他像母亲一样的仙女，唱着歌，跳着舞，出了门。还不到一个钟头，他就请遍了所有朋友。有些孩子马上痛快地答应，有些起先不肯，还要他再三央求。可大家一听说，配咖啡的小面包两面都抹着黄油，便全都改了口。
        - id: ch01-b12
          speakers: [schoolmate_1, schoolmate_2]
          ensemble: duo
          text: 那我们也来吧，就当是给你面子。
    - id: ch02
      title: 灯芯说起玩儿国
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 匹诺曹的朋友和同学里，有一个是他最喜欢的伙伴。那孩子本名罗密欧，大家却叫他灯芯。因为他又瘦又直，脸上还亮堂堂的，正像小夜灯上一根新灯芯。灯芯是全校最懒、最淘气的学生，匹诺曹偏偏跟他最好。
        - id: ch02-b02
          speaker: narrator
          text: 匹诺曹去灯芯家请了三次，三次都没见着人。他还能去哪里找呢？他东瞧瞧，西望望，到处寻找，最后才发现灯芯躲在一户农家的门廊下面。
        - id: ch02-b03
          speaker: pinocchio
          text: 你躲在这里干什么？
        - id: ch02-b04
          speaker: candlewick
          text: 我在等半夜。时间一到，我就要出发。
        - id: ch02-b05
          speaker: pinocchio
          text: 你打算去哪里？
        - id: ch02-b06
          speaker: candlewick
          text: 我要搬到一个地方去住。那是世上最快活的地方，简直就是糖果做成的国家！
        - id: ch02-b07
          speaker: pinocchio
          text: 那个地方叫什么？
        - id: ch02-b08
          speaker: candlewick
          text: 它叫玩儿国。你也跟我走吧？
        - id: ch02-b09
          speaker: pinocchio
          text: 我才不去，绝对不去！
        - id: ch02-b10
          speaker: candlewick
          text: 你不去准会后悔。对咱们孩子来说，哪儿还能比那里更好？那里没有学校，没有老师，也没有课本，谁都不用念书。星期六从来不上课，一个星期有六个星期六，外加一个星期天。秋季假期更是从一月一日放到十二月最后一天。那样的国家才适合我，所有文明国家都该学它！
        - id: ch02-b11
          speaker: pinocchio
          text: 那么，你们在玩儿国里每天都做些什么？
        - id: ch02-b12
          speaker: candlewick
          text: 从早玩到晚，只管找乐子。晚上睡一觉，第二天起来接着玩。你说这样的日子好不好？
        - id: ch02-b13
          speaker: narrator
          text: 匹诺曹轻轻摇着头，嘴里嗯了一声。可他那副神情分明是在说，这种日子，他也很愿意过。
        - id: ch02-b14
          speaker: candlewick
          text: 你到底跟不跟我走？去还是不去？快点拿主意。
        - id: ch02-b15
          speaker: pinocchio
          text: 不去，不去，说多少次我也不去。我答应过仙女，要做个规矩的孩子，当然得守信用。太阳快下山了，我现在就得回去。再见，祝你一路顺风。
        - id: ch02-b16
          speaker: candlewick
          text: 你这么着急，要跑到哪里去？
        - id: ch02-b17
          speaker: pinocchio
          text: 我要回家。仙女让我在天黑以前赶回去。
        - id: ch02-b18
          speaker: candlewick
          text: 再等两分钟嘛。
        - id: ch02-b19
          speaker: pinocchio
          text: 再等下去，我就迟到了。
        - id: ch02-b20
          speaker: candlewick
          text: 我只留你两分钟。
        - id: ch02-b21
          speaker: pinocchio
          text: 可仙女要是骂我呢？
        - id: ch02-b22
          speaker: candlewick
          text: 那就让她骂吧。她骂够了，自然会闭嘴。
        - id: ch02-b23
          speaker: narrator
          text: 这个小坏蛋说得满不在乎。匹诺曹却还想知道，灯芯是不是独自上路。
        - id: ch02-b24
          speaker: pinocchio
          text: 你一个人去吗，还是有别人跟你一起？
        - id: ch02-b25
          speaker: candlewick
          text: 我怎么会一个人去？同行的孩子有一百多个呢。
        - id: ch02-b26
          speaker: pinocchio
          text: 你们要一路走过去吗？
        - id: ch02-b27
          speaker: candlewick
          text: 一会儿有辆马车经过，它会接我到那个快活地方去。
        - id: ch02-b28
          speaker: pinocchio
          text: 我真希望那辆马车现在就来！
        - id: ch02-b29
          speaker: candlewick
          text: 你为什么盼着它来？
        - id: ch02-b30
          speaker: pinocchio
          text: 因为我想看看你们一起出发。
        - id: ch02-b31
          speaker: candlewick
          text: 那你再留一会儿，自然就看见了。
        - id: ch02-b32
          speaker: pinocchio
          text: 不行，我还是得回家。
        - id: ch02-b33
          speaker: candlewick
          text: 你再等两分钟就好。
        - id: ch02-b34
          speaker: pinocchio
          text: 我已经耽搁得太久了。仙女一定会担心我。
        - id: ch02-b35
          speaker: candlewick
          text: 可怜的仙女！难道她怕蝙蝠把你吃掉？
        - id: ch02-b36
          speaker: pinocchio
          text: 先告诉我，你真能肯定，那里连一所学校也没有？
        - id: ch02-b37
          speaker: candlewick
          text: 那里连学校的影子都找不到。
        - id: ch02-b38
          speaker: pinocchio
          text: 那里也没有老师吗？
        - id: ch02-b39
          speaker: candlewick
          text: 那里一个老师也没有。
        - id: ch02-b40
          speaker: pinocchio
          text: 也从来没人逼你们读书？
        - id: ch02-b41
          speaker: candlewick
          text: 从来没有，绝对没有，一次也没有！
        - id: ch02-b42
          speaker: pinocchio
          text: 那真是个快活的国家！光听你说，我都馋得要流口水了。我虽然没去过，可我已经想得出那里有多好。
          emotion: happy
        - id: ch02-b43
          speaker: candlewick
          text: 那你为什么还是不跟我一起走？
        - id: ch02-b44
          speaker: pinocchio
          text: 你别再引诱我了。我答应过仙女，要做个懂事的孩子，我不能失信。
        - id: ch02-b45
          speaker: candlewick
          text: 那就再见吧。你要是在街上碰到学校里的孩子，替我问候他们。
        - id: ch02-b46
          speaker: pinocchio
          text: 再见，灯芯。祝你一路顺风，也祝你玩得开心。以后别忘了偶尔想想朋友。
    - id: ch03
      title: 马车就要来了
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 匹诺曹刚往前走了两步，又停了下来。他转过身，还是忍不住问灯芯。
        - id: ch03-b02
          speaker: pinocchio
          text: 你真的肯定，那里每个星期都有六个星期六，再加一个星期天？
        - id: ch03-b03
          speaker: candlewick
          text: 我当然肯定。
        - id: ch03-b04
          speaker: pinocchio
          text: 你也确定，假期从一月一日开始，一直放到十二月最后一天？
        - id: ch03-b05
          speaker: candlewick
          text: 这还用问吗？
        - id: ch03-b06
          speaker: narrator
          text: 匹诺曹又赞叹那是个快活的国家，脸上满是向往。可他马上摆出坚决的神气，匆匆开口。
        - id: ch03-b07
          speaker: pinocchio
          text: 这一回我真的要走了。再见，祝你一路顺风。
        - id: ch03-b08
          speaker: candlewick
          text: 好吧，再见。
        - id: ch03-b09
          speaker: pinocchio
          text: 你到底什么时候出发？
        - id: ch03-b10
          speaker: candlewick
          text: 用不了多久，我就出发。
        - id: ch03-b11
          speaker: pinocchio
          text: 真可惜！要是再等一个钟头你就能走，我差不多愿意留下来等。
        - id: ch03-b12
          speaker: candlewick
          text: 你不管仙女了吗？
        - id: ch03-b13
          speaker: pinocchio
          text: 反正已经晚了。早一个钟头回去，还是晚一个钟头回去，又有什么分别？
        - id: ch03-b14
          speaker: candlewick
          text: 可怜的匹诺曹！仙女要是骂你，你怎么办？
        - id: ch03-b15
          speaker: pinocchio
          text: 我只好忍着。让她骂吧，等她骂够了，自然就会闭嘴。
        - id: ch03-b16
          speaker: narrator
          text: 就在他们说话的时候，夜幕已经降临，四周一片漆黑。远处忽然出现一点移动的微光。接着，他们听见人声，还听见一支小喇叭在吹。那声音细得很，简直像蚊子在嗡嗡叫。
        - id: ch03-b17
          speaker: candlewick
          text: 马车来啦！
          emotion: happy
        - id: ch03-b18
          speaker: narrator
          text: 灯芯一下跳了起来。匹诺曹却压低了声音。
        - id: ch03-b19
          speaker: pinocchio
          text: 到底是什么来了？
        - id: ch03-b20
          speaker: candlewick
          text: 接我走的马车来了。现在你到底去不去？
        - id: ch03-b21
          speaker: pinocchio
          text: 可我还得问清楚。那个国家真的从来不逼孩子念书吗？
        - id: ch03-b22
          speaker: candlewick
          text: 从来没有，绝对没有，一次也没有！
        - id: ch03-b23
          speaker: pinocchio
          text: 多快活的国家呀！多快活的国家！多快活的国家！
          emotion: happy
