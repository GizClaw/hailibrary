audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖从容，带一点一本正经的幽默
        timbre: 清晰醇厚
        pace: 舒缓，遇到惊奇处略微加快
        pitch: 中
    pinocchio:
      display_name: 匹诺曹
      tts:
        delivery: 任性直率，嘴硬而孩子气，发怒时冲动急躁
        timbre: 清亮，带木偶般的脆响
        pace: 偏快，争辩时更急
        pitch: 中高
    harlequin:
      display_name: 哈尔勒昆
      tts:
        delivery: 热情夸张，带着舞台演员的抑扬顿挫
        timbre: 明亮灵活
        pace: 偏快
        pitch: 中高
    showman:
      display_name: 班主
      tts:
        delivery: 凶狠威严，话音粗重而压迫感十足
        timbre: 沙哑低沉，带浓重鼻音
        pace: 缓慢有力
        pitch: 低
  chapters:
    - id: ch01
      title: 一个喷嚏的秘密
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 班主名叫吞火人。单看模样，他简直就是个恶人，尤其吓人的是那把黑胡子。胡子从胸口一直盖到腿上，像在身前系了一条围裙。可说到底，他的心其实没有那么坏。
        - id: ch01-b02
          speaker: narrator
          text: 可怜的匹诺曹被带到他面前，一边拼命挣扎，一边大喊：“我不想死，我不想死！”吞火人看在眼里，既心软，又替他难过。他本想狠下心来，可没撑多久，就猛地打了个大喷嚏。哈尔勒昆刚才还悲痛得弯下身子，像一棵哭泣的柳树。这时，他一下高兴起来，凑近匹诺曹，小声告诉他。
        - id: ch01-b03
          speaker: harlequin
          text: 兄弟，这是好消息！班主一打喷嚏，就说明他在可怜你。你不会死了。
          emotion: happy
        - id: ch01-b04
          speaker: narrator
          text: 别人同情谁，多半会掉眼泪，至少也要装着擦擦眼角。吞火人却不一样。他只要真的动了恻隐之心，就会打喷嚏。
        - id: ch01-b05
          speaker: narrator
          text: 喷嚏打完了，班主还要装得凶巴巴的。他冲着匹诺曹吼了起来。
        - id: ch01-b06
          speaker: showman
          text: 不许再哭！你号得我肚子都疼了，里面一抽一抽，眼看就要……阿嚏！阿嚏！
        - id: ch01-b07
          speaker: narrator
          text: 这一次，他接连打了两个喷嚏。
        - id: ch01-b08
          speaker: pinocchio
          text: 愿上天保佑您！
        - id: ch01-b09
          speaker: showman
          text: 谢谢。你爸爸妈妈都还活着吗？
        - id: ch01-b10
          speaker: pinocchio
          text: 爸爸还在。妈妈……我从来没有见过。
        - id: ch01-b11
          speaker: showman
          text: 要是我叫人把你扔进烧红的炭里，你那可怜的老父亲该多伤心啊！可怜的老人家，我真同情他！阿嚏！阿嚏！阿嚏！
        - id: ch01-b12
          speaker: narrator
          text: 吞火人说着，又一连打了三个喷嚏。
        - id: ch01-b13
          speaker: pinocchio
          text: 愿上天保佑您！
        - id: ch01-b14
          speaker: showman
          text: 谢谢。不过你也该可怜可怜我。木柴用完了，这只羊还没烤熟。老实说，在这个节骨眼上，你本来能给我帮个大忙！可我既然可怜你，就只能忍着。我不用你了，换剧团里的另一个木偶，把他塞到烤叉底下去。宪兵，过来！
    - id: ch02
      title: 哈尔勒昆遇险
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 班主一声召唤，两个木头宪兵马上现身。他们身材又高又瘦，头上戴着两角帽，手里都握着出鞘的长剑。班主用沙哑的嗓音下了命令。
        - id: ch02-b02
          speaker: showman
          text: 抓住哈尔勒昆，把他捆紧了扔进火里。我今天非把这只羊烤熟不可。
        - id: ch02-b03
          speaker: narrator
          text: 可怜的哈尔勒昆吓得腿都软了，脸朝下摔在地上。眼前这一幕太叫人难受了。匹诺曹放声大哭，扑到班主脚边，眼泪把那把长胡子都浸湿了。他苦苦央求起来。
        - id: ch02-b04
          speaker: pinocchio
          text: 吞火人大人，求求您发发慈悲吧！
          emotion: fearful
        - id: ch02-b05
          speaker: showman
          text: 我这里没有什么大人。
        - id: ch02-b06
          speaker: pinocchio
          text: 那么，骑士老爷，求您发发慈悲吧！
          emotion: fearful
        - id: ch02-b07
          speaker: showman
          text: 我这里也没有什么骑士老爷！
        - id: ch02-b08
          speaker: pinocchio
          text: 司令官，求求您发发慈悲吧！
          emotion: fearful
        - id: ch02-b09
          speaker: showman
          text: 这里更没有什么司令官！
        - id: ch02-b10
          speaker: pinocchio
          text: 阁下，求求您发发慈悲吧！
          emotion: fearful
        - id: ch02-b11
          speaker: narrator
          text: 这一声“阁下”，倒叫班主笑了。他立刻就变得和气了不少，也没那么难说话了，便转过身来问匹诺曹。
        - id: ch02-b12
          speaker: showman
          text: 好吧，你到底想求我什么？
        - id: ch02-b13
          speaker: pinocchio
          text: 求您饶了可怜的哈尔勒昆。
        - id: ch02-b14
          speaker: showman
          text: 他不能饶。我已经放了你，就只能烧他。今天这只羊，我一定得烤熟。
    - id: ch03
      title: 匹诺曹的选择
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 匹诺曹一下站直了，还把面包心做的帽子扔到一旁。他抬高声音，骄傲地喊道。
        - id: ch03-b02
          speaker: pinocchio
          text: 那我知道该怎么办了。来吧，宪兵！把我捆起来，扔进火里！哈尔勒昆是我真正的朋友，我绝不能让他替我去死！
        - id: ch03-b03
          speaker: narrator
          text: 这番话又响亮又英勇，在场的木偶全哭了。就连那两个木头宪兵，也像刚出生的小羊羔一样直掉眼泪。
        - id: ch03-b04
          speaker: narrator
          text: 吞火人起初还是冷得像冰，一点也不动心。可过了一会儿，那颗心渐渐融化，喷嚏也来了。他一口气打了四五个，这才亲热地张开双臂。
        - id: ch03-b05
          speaker: showman
          text: 你真是个善良又勇敢的孩子！快过来，让我亲一下。
          emotion: happy
        - id: ch03-b06
          speaker: narrator
          text: 匹诺曹马上跑过去，像松鼠一样顺着班主的胡子往上爬，最后在他的鼻尖上响亮地亲了一口。
        - id: ch03-b07
          speaker: harlequin
          text: 那么……您肯饶我了吗？
          emotion: fearful
        - id: ch03-b08
          speaker: narrator
          text: 哈尔勒昆的声音弱极了，几乎听不见。
        - id: ch03-b09
          speaker: showman
          text: 饶你了！唉，我只能忍着。今晚这只羊，只好吃个半生不熟。可下一次，谁再惹我不高兴，谁就等着瞧吧！
        - id: ch03-b10
          speaker: narrator
          text: 吞火人叹着气，摇了摇头。木偶们一听哈尔勒昆获救，全都跑上舞台，点亮灯盏和枝形吊灯，仿佛要举行一场盛大的演出。他们高高兴兴地蹦啊，跳啊，一直跳到天亮还没有停。
