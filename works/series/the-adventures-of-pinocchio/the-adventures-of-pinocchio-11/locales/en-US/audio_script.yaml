audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm and story-rich
        timbre: clear and rounded
        pace: measured
        pitch: medium
    pinocchio:
      display_name: Pinocchio
      tts:
        delivery: impulsive and defiant
        timbre: bright and wooden
        pace: quick
        pitch: medium-high
    harlequin:
      display_name: Harlequin
      tts:
        delivery: theatrical and warmhearted
        timbre: nimble and resonant
        pace: lively
        pitch: medium-high
    showman:
      display_name: The Showman
      tts:
        delivery: harsh and commanding
        timbre: deep and gravelly
        pace: deliberate
        pitch: low
  chapters:
    - id: ch01
      title: Fire-Eater Sneezes and Pardons Pinocchio
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: The showman's name was Fire-Eater. With a black beard hanging over his chest and legs like an apron, he looked like a wicked man. But deep down, his heart was not bad. Poor Pinocchio was brought before him, struggling and screaming that he would not die. Fire-Eater was deeply moved and felt very sorry for him. He tried to hold firm. Soon he could not stand it any longer, and he let out a tremendous sneeze.
        - id: ch01-b02
          speaker: narrator
          text: Until then, Harlequin had been bent over in misery like a weeping willow. The instant he heard that sneeze, he brightened. He leaned close to Pinocchio and whispered.
        - id: ch01-b03
          speaker: harlequin
          text: That's good news, brother. When the showman sneezes, it means he feels sorry for you. You're going to be saved.
          emotion: happy
        - id: ch01-b04
          speaker: narrator
          text: Most people cry when compassion overcomes them. At the very least, they pretend to wipe their eyes. Fire-Eater was different. Whenever he was truly overcome with pity, he had a habit of sneezing.
        - id: ch01-b05
          speaker: narrator
          text: After that first sneeze, the showman still tried to behave like a ruffian. He shouted at Pinocchio.
        - id: ch01-b06
          speaker: showman
          text: Stop that crying! All your wailing has given me a pain in my stomach. I'm getting a spasm that almost... Achoo! Achoo!
        - id: ch01-b07
          speaker: narrator
          text: He sneezed two more times.
        - id: ch01-b08
          speaker: pinocchio
          text: Bless you!
        - id: ch01-b09
          speaker: showman
          text: Thank you. Now, are your papa and mamma still alive?
        - id: ch01-b10
          speaker: pinocchio
          text: My papa is. I never knew my mamma.
        - id: ch01-b11
          speaker: showman
          text: Think how your poor old father would suffer if I had you tossed onto those burning coals. Poor old man. I feel sorry for him. Achoo! Achoo! Achoo!
        - id: ch01-b12
          speaker: narrator
          text: This time Fire-Eater sneezed three times.
        - id: ch01-b13
          speaker: pinocchio
          text: Bless you!
        - id: ch01-b14
          speaker: showman
          text: Thank you. But I deserve a little sympathy too. I've run out of wood, so I can't finish roasting my mutton. To tell the truth, you would have been very useful. Still, I've spared you, and I'll have to make the best of it. I'll burn one of my other puppets under the spit instead. Gendarmes!
        - id: ch01-b15
          speaker: narrator
          text: Two wooden gendarmes appeared at once. They were both very tall and very thin. Each wore a cocked hat and carried an unsheathed sword. Fire-Eater gave them an order in his rough, hoarse voice.
        - id: ch01-b16
          speaker: showman
          text: Take Harlequin. Tie him up tight and throw him into the fire. I mean to have my mutton properly roasted.
        - id: ch01-b17
          speaker: narrator
          text: Just imagine poor Harlequin. He was so terrified that his legs folded beneath him, and he fell facedown on the floor.
        - id: ch01-b18
          speaker: narrator
          text: Pinocchio could not bear that terrible sight. He burst into bitter tears and threw himself at Fire-Eater's feet. As he pleaded for mercy, his tears ran all through the showman's long beard.
        - id: ch01-b19
          speaker: pinocchio
          text: Please have mercy, Sir Fire-Eater!
          emotion: sad
        - id: ch01-b20
          speaker: showman
          text: There are no sirs here.
        - id: ch01-b21
          speaker: pinocchio
          text: Then please have mercy, Sir Knight!
          emotion: sad
        - id: ch01-b22
          speaker: showman
          text: There are no knights here.
        - id: ch01-b23
          speaker: pinocchio
          text: Please, Commander, have mercy!
          emotion: sad
        - id: ch01-b24
          speaker: showman
          text: There are no commanders here.
        - id: ch01-b25
          speaker: pinocchio
          text: Please have mercy, Your Excellence!
          emotion: sad
        - id: ch01-b26
          speaker: narrator
          text: The words "Your Excellence" made Fire-Eater smile. At once, he softened and became easier to talk to. He turned toward Pinocchio.
        - id: ch01-b27
          speaker: showman
          text: Well? What do you want from me?
        - id: ch01-b28
          speaker: pinocchio
          text: I'm begging you to spare poor Harlequin.
        - id: ch01-b29
          speaker: showman
          text: I won't spare him. I let you go, so he has to feed the fire. I am going to have my mutton properly roasted.
        - id: ch01-b30
          speaker: narrator
          text: Pinocchio sprang to his feet and flung away his cap made of bread crumbs. His voice rang out, proud and brave.
        - id: ch01-b31
          speaker: pinocchio
          text: Then I know what I have to do. Come on, gendarmes! Tie me up and throw me into the flames. It isn't right for poor Harlequin, my true friend, to die in my place!
        - id: ch01-b32
          speaker: narrator
          text: Pinocchio spoke those heroic words in a loud, ringing voice. Every puppet who heard him began to cry. Even the two wooden gendarmes wept like newborn lambs.
        - id: ch01-b33
          speaker: narrator
          text: At first, Fire-Eater stayed as cold and hard as ice. Then, little by little, he began to melt. He sneezed four or five times, opened his arms warmly, and spoke to Pinocchio.
        - id: ch01-b34
          speaker: showman
          text: You're a good, brave boy. Come here and give me a kiss.
        - id: ch01-b35
          speaker: narrator
          text: Pinocchio ran to him at once and eagerly scrambled up the showman's beard like a squirrel. Then he planted a hearty kiss right on the end of Fire-Eater's nose.
        - id: ch01-b36
          speaker: harlequin
          text: Does that mean I'm pardoned?
          emotion: fearful
        - id: ch01-b37
          speaker: narrator
          text: Harlequin's voice was so faint that they could barely hear him.
        - id: ch01-b38
          speaker: showman
          text: You're pardoned! I suppose I'll have to put up with it. Tonight, I'll eat my mutton half raw. But next time, watch out if anyone displeases me!
        - id: ch01-b39
          speaker: narrator
          text: The moment they heard the pardon, all the puppets rushed onto the stage. They lit the lamps and chandeliers as though a grand performance were about to begin. Then they leaped and danced for joy. When dawn came, they were still dancing.
