audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖从容，带一点一本正经的幽默
        timbre: 清晰醇厚
        pace: 舒缓，遇到惊奇处略微加快
        pitch: 中
    pinocchio:
      display_name: 匹诺曹
      tts:
        delivery: 任性直率，嘴硬而孩子气，发怒时冲动急躁
        timbre: 清亮，带木偶般的脆响
        pace: 偏快，争辩时更急
        pitch: 中高
    showman:
      display_name: 班主
      tts:
        delivery: 凶狠威严，话音粗重而压迫感十足
        timbre: 沙哑低沉，带浓重鼻音
        pace: 缓慢有力
        pitch: 低
    fox:
      display_name: 狐狸
      tts:
        delivery: 客气圆滑，劝诱时显得格外诚恳
        timbre: 细长而略带沙哑
        pace: 从容，编造谎话时流畅笃定
        pitch: 中
    cat:
      display_name: 猫
      tts:
        delivery: 冷淡狡猾，惯于附和狐狸的话
        timbre: 轻细干涩
        pace: 缓慢，重复时短促有力
        pitch: 中高
    blackbird:
      display_name: 白乌鸫
      tts:
        delivery: 正直警醒，像唱歌一样发出告诫
        timbre: 清脆明亮
        pace: 轻快而清楚
        pitch: 高
  chapters:
    - id: ch01
      title: 吞火人的礼物
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 第二天，吞火人把匹诺曹叫到一边，问起了他的爸爸。
        - id: ch01-b02
          speaker: showman
          text: 你爸爸叫什么名字？
        - id: ch01-b03
          speaker: pinocchio
          text: 他叫杰佩托。
        - id: ch01-b04
          speaker: showman
          text: 他靠什么过日子？
        - id: ch01-b05
          speaker: pinocchio
          text: 他是个乞丐。
        - id: ch01-b06
          speaker: showman
          text: 那他能赚到很多钱吗？
        - id: ch01-b07
          speaker: pinocchio
          text: 赚很多钱？他口袋里从来连一个铜子儿都没有！为了给我买识字课本，让我去上学，他连身上唯一的外套都卖了。那件外套补了又补，早就破得不能见人啦。
        - id: ch01-b08
          speaker: showman
          text: 可怜的家伙，连我都快要同情他了！这里有五枚金币，你马上拿给他，也替我问候他。
        - id: ch01-b09
          speaker: narrator
          text: 匹诺曹喜出望外，对班主谢了千遍万遍。他把剧团里的木偶一个接一个全抱了一遍，连那两个宪兵也没有落下，这才动身回家。
    - id: ch02
      title: 路上的狐狸和猫
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 他还没走多远，就遇见一只瘸了一条腿的狐狸和一只双眼失明的猫。他们像两个同病相怜的好伙伴，一路相互帮衬。瘸腿的狐狸倚着猫走，瞎眼的猫又由狐狸领路。
        - id: ch02-b02
          speaker: fox
          text: 你好啊，匹诺曹。
        - id: ch02-b03
          speaker: narrator
          text: 狐狸的招呼打得彬彬有礼，匹诺曹却觉得奇怪。
        - id: ch02-b04
          speaker: pinocchio
          text: 你怎么会知道我的名字？
        - id: ch02-b05
          speaker: fox
          text: 我跟你爸爸很熟。
        - id: ch02-b06
          speaker: pinocchio
          text: 你在哪里见过他？
        - id: ch02-b07
          speaker: fox
          text: 昨天，我在他家门口见到了他。
        - id: ch02-b08
          speaker: pinocchio
          text: 那时候他在干什么？
        - id: ch02-b09
          speaker: fox
          text: 他只穿着一件衬衫，冷得不停发抖。
        - id: ch02-b10
          speaker: pinocchio
          text: 可怜的爸爸！不过以后不会这样了，他再也不用挨冻啦！
        - id: ch02-b11
          speaker: fox
          text: 这是为什么？
        - id: ch02-b12
          speaker: pinocchio
          text: 因为我现在已经是个绅士了。
        - id: ch02-b13
          speaker: fox
          text: 就凭你，也能当绅士？
        - id: ch02-b14
          speaker: narrator
          text: 狐狸粗声大笑，笑里全是轻蔑。猫也笑了起来，却赶紧用前爪梳着胡须，想把笑容遮住。
        - id: ch02-b15
          speaker: pinocchio
          text: 这有什么好笑的！真对不住，恐怕要叫你们眼馋了。你们要是识货，就看清楚了，这可是五枚金币！
          emotion: angry
        - id: ch02-b16
          speaker: narrator
          text: 匹诺曹掏出了吞火人给他的金币。钱一响，狐狸不由得伸出那只看似瘸了的爪子。猫也睁开两只眼睛，亮得像两盏绿灯笼。可她马上又闭上了，快得没让匹诺曹看见。
        - id: ch02-b17
          speaker: fox
          text: 你准备拿这些钱做什么？
        - id: ch02-b18
          speaker: pinocchio
          text: 我先给爸爸买件新外套，要用金线银线来做，还要钉上钻石纽扣。然后，我给自己买一本识字课本。
        - id: ch02-b19
          speaker: fox
          text: 你要给自己买课本？
        - id: ch02-b20
          speaker: pinocchio
          text: 当然，我要去上学，这次一定好好读书。
        - id: ch02-b21
          speaker: fox
          text: 你仔细看看我！我就是一门心思想读书，结果白白丢掉了一条腿。
        - id: ch02-b22
          speaker: cat
          text: 你再仔细看看我！我也是一门心思想读书，结果把两只眼睛全都读瞎了。
        - id: ch02-b23
          speaker: narrator
          text: 路边的树篱上停着一只白乌鸫。听见这番话，它唱起平日的调子，提醒匹诺曹。
        - id: ch02-b24
          speaker: blackbird
          text: 匹诺曹，千万别听坏伙伴的劝告，不然你一定会后悔！
        - id: ch02-b25
          speaker: narrator
          text: 可怜的乌鸫，它要是没开口该多好！猫猛地一跃，朝它扑过去，连一声“哎哟”都没容它喊出来，就把它连毛带羽一口吞了。吃完以后，猫擦了擦嘴，又闭上双眼，装出先前那副瞎眼的模样。
        - id: ch02-b26
          speaker: pinocchio
          text: 可怜的乌鸫！你为什么要这样对待它？
        - id: ch02-b27
          speaker: cat
          text: 我只是给它一个教训。下次它就会懂了，别人谈话的时候，不该插嘴。
    - id: ch03
      title: 奇迹田的秘密
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 他们差不多走到半路时，狐狸忽然停了下来。
        - id: ch03-b02
          speaker: fox
          text: 你想让手里的钱翻一番吗？
        - id: ch03-b03
          speaker: pinocchio
          text: 要怎么才能翻一番？
        - id: ch03-b04
          speaker: fox
          text: 你想不想把这区区五枚金币，变成一百枚、一千枚，甚至两千枚？
        - id: ch03-b05
          speaker: pinocchio
          text: 我当然想！可到底要怎么做？
        - id: ch03-b06
          speaker: fox
          text: 这很容易。你不要回家，跟着我们走就行了。
        - id: ch03-b07
          speaker: pinocchio
          text: 你们要带我去哪里？
        - id: ch03-b08
          speaker: fox
          text: 我们要去猫头鹰国。
        - id: ch03-b09
          speaker: narrator
          text: 匹诺曹站在那里想了一会儿，随后斩钉截铁地下定了决心。
        - id: ch03-b10
          speaker: pinocchio
          text: 不，我不能去。我已经快到家了，爸爸还等着我呢。昨天我一直没有回去，谁知道那个可怜的老人叹了多少次气！我确实不是个好儿子。会说话的蟋蟀说得没错，不听话的孩子，在这世上绝不会有好下场。我已经遭了那么多祸，知道这话是真的。昨天在吞火人那里，我还差点儿……哎呀，光是想起来，我就浑身发抖！
          emotion: fearful
        - id: ch03-b11
          speaker: fox
          text: 那好吧。你既然一定要回家，就回去好了。以后吃亏的是你自己。
        - id: ch03-b12
          speaker: cat
          text: 到时候，吃亏的是你自己！
        - id: ch03-b13
          speaker: fox
          text: 你可要想清楚，匹诺曹。你这是把送上门的好运一脚踢开。
        - id: ch03-b14
          speaker: cat
          text: 你要一脚踢开好运！
        - id: ch03-b15
          speaker: fox
          text: 只要过一夜，你的五枚金币就能变成两千枚。
        - id: ch03-b16
          speaker: cat
          text: 它们会变成两千枚！
        - id: ch03-b17
          speaker: pinocchio
          text: 可五枚金币怎么会一下子变出那么多？
        - id: ch03-b18
          speaker: narrator
          text: 匹诺曹惊讶得张大了嘴。狐狸马上向他解释起来。
        - id: ch03-b19
          speaker: fox
          text: 猫头鹰国有一块神圣的田，人人都叫它奇迹田。你在那里挖个小坑，先放进一枚金币，再盖上一点土。接着，从泉里提两桶水浇上去，再撒两撮盐。等夜里一到，你只管安心上床睡觉。就在那一夜，金币会在地里生根、开花。第二天早上，你起床回到田里。你猜会找到什么？你会看见一棵漂亮的大树，枝头挂满金币，多得就像六月里一穗麦子上的麦粒。
    - id: ch04
      title: 被遗忘的好决心
      blocks:
        - id: ch04-b01
          speaker: pinocchio
          text: 那么，我要是把五枚金币都埋进去，第二天早上能得到多少枚？
        - id: ch04-b02
          speaker: fox
          text: 这笔账再简单不过了，连你自己掰着手指都能算出来。每一枚金币会给你带来五百枚。把五百乘以五，等到第二天早上，你的口袋里就会装着两千五百枚亮闪闪的金币。
        - id: ch04-b03
          speaker: pinocchio
          text: 哎呀，那太妙啦！金币一到手，我自己留下两千枚，再把另外五百枚送给你们俩。
          emotion: happy
        - id: ch04-b04
          speaker: narrator
          text: 匹诺曹一边欢呼，一边高兴得跳起舞来。狐狸听见他要送礼，立刻气愤地叫起来，脸上摆出一副受尽侮辱的样子。
        - id: ch04-b05
          speaker: fox
          text: 你竟然要送给我们？你在胡思乱想些什么？
        - id: ch04-b06
          speaker: cat
          text: 你到底在胡思乱想些什么？
        - id: ch04-b07
          speaker: fox
          text: 我们做事从来不求报酬，只想让别人发财。
        - id: ch04-b08
          speaker: cat
          text: 我们只想让别人发财！
        - id: ch04-b09
          speaker: narrator
          text: 匹诺曹心想，他们真是善良的人！就在那一刻，他把爸爸、新外套、识字课本，还有自己立下的所有好决心，全都忘得一干二净。他转向狐狸和猫，对他们说。
        - id: ch04-b10
          speaker: pinocchio
          text: 那就马上出发吧，我跟你们去。
