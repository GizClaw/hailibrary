audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm and story-rich
        timbre: clear and rounded
        pace: measured
        pitch: medium
    pinocchio:
      display_name: Pinocchio
      tts:
        delivery: impulsive and defiant
        timbre: bright and wooden
        pace: quick
        pitch: medium-high
    showman:
      display_name: The Showman
      tts:
        delivery: harsh and commanding
        timbre: deep and gravelly
        pace: deliberate
        pitch: low
    fox:
      display_name: The Fox
      tts:
        delivery: smooth and calculating
        timbre: lean and sly
        pace: measured
        pitch: medium
    cat:
      display_name: The Cat
      tts:
        delivery: dry and imitative
        timbre: soft and raspy
        pace: clipped
        pitch: medium-high
    blackbird:
      display_name: The Blackbird
      tts:
        delivery: clear and cautionary
        timbre: light and ringing
        pace: brisk
        pitch: high
  chapters:
    - id: ch01
      title: Five Gold Pieces
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: The next day, Fire-Eater drew Pinocchio aside and questioned him.
        - id: ch01-b02
          speaker: showman
          text: What is your father's name?
        - id: ch01-b03
          speaker: pinocchio
          text: Geppetto.
        - id: ch01-b04
          speaker: showman
          text: What kind of work does he do?
        - id: ch01-b05
          speaker: pinocchio
          text: He begs for a living.
        - id: ch01-b06
          speaker: showman
          text: Does he earn much?
        - id: ch01-b07
          speaker: pinocchio
          text: Earn much? He never has a penny in his pocket. Just think of it. He wanted me to have a spelling book so I could go to school, but the only way he could buy one was by selling the one coat he had to wear. And that coat was already so full of patches and darns that it was hardly fit to be seen.
        - id: ch01-b08
          speaker: showman
          text: Poor fellow. I almost feel sorry for him. Here, take these five gold pieces. Go straight home and give them to him, with my compliments.
        - id: ch01-b09
          speaker: narrator
          text: Pinocchio was wild with joy. He thanked the showman over and over, as if a thousand thanks could never be enough. Then he went through the whole company and hugged every puppet, one after another. He even embraced the gendarmes. At last, with the five gold pieces, he set off for home.
    - id: ch02
      title: The Fox and the Cat
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: He had not gone far when he met a Fox who was lame in one foot and a Cat who was blind in both eyes. They helped each other along like two good companions in misfortune. The Fox leaned on the Cat, while the Cat let the Fox guide her.
        - id: ch02-b02
          speaker: fox
          text: Good day, Pinocchio.
        - id: ch02-b03
          speaker: narrator
          text: The Fox greeted him very politely.
        - id: ch02-b04
          speaker: pinocchio
          text: How do you know my name?
        - id: ch02-b05
          speaker: fox
          text: I know your father very well.
        - id: ch02-b06
          speaker: pinocchio
          text: Where did you see him?
        - id: ch02-b07
          speaker: fox
          text: Yesterday, right outside his house.
        - id: ch02-b08
          speaker: pinocchio
          text: What was he doing?
        - id: ch02-b09
          speaker: fox
          text: He was standing there in his shirtsleeves, shivering from the cold.
        - id: ch02-b10
          speaker: pinocchio
          text: Poor Papa! But that's all over now. He'll never have to shiver again!
        - id: ch02-b11
          speaker: fox
          text: Why not?
        - id: ch02-b12
          speaker: pinocchio
          text: Because I'm a gentleman now.
        - id: ch02-b13
          speaker: fox
          text: You? A gentleman?
        - id: ch02-b14
          speaker: narrator
          text: At the thought of Pinocchio as a gentleman, the Fox broke into a rude, scornful laugh. The Cat started laughing too. She did not want Pinocchio to see, so she lifted her front paws and pretended to be busy combing her whiskers.
        - id: ch02-b15
          speaker: pinocchio
          text: There's nothing funny about it! I'm sorry if the sight makes your mouth water, but if you know anything about money, take a look. These are five gold pieces.
          emotion: angry
        - id: ch02-b16
          speaker: narrator
          text: Pinocchio pulled out the money Fire-Eater had given him. The moment the coins jingled, the Fox made a sudden movement he could not control. He reached out with the paw that was supposed to be lame. At the same sound, the Cat opened both of her supposedly blind eyes. They shone like two green lanterns. But she snapped them shut again so quickly that Pinocchio noticed nothing.
        - id: ch02-b17
          speaker: fox
          text: So, what will you do with all that money?
        - id: ch02-b18
          speaker: pinocchio
          text: First, I'll buy Papa a new coat made of gold and silver, with diamond buttons. Then I'll buy myself a spelling book.
        - id: ch02-b19
          speaker: fox
          text: A spelling book for you?
        - id: ch02-b20
          speaker: pinocchio
          text: Of course. I want to go to school and truly study.
        - id: ch02-b21
          speaker: fox
          text: Just look at me. I was so foolish about studying that it cost me a leg.
        - id: ch02-b22
          speaker: cat
          text: And look at me. I cared so much about studying that I lost the sight in both eyes.
    - id: ch03
      title: The Blackbird's Warning
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: Just then, a white Blackbird perched on the roadside hedge began his usual song.
        - id: ch03-b02
          speaker: blackbird
          text: Pinocchio, don't take advice from bad companions. If you do, you'll be sorry!
        - id: ch03-b03
          speaker: narrator
          text: Poor Blackbird! If only he had kept quiet. The Cat sprang at him in one great leap. She did not even give him time to cry, "Oh!" before she swallowed him in a single mouthful, feathers and all. Once she had eaten him, she carefully cleaned her mouth. Then she closed her eyes and went right back to pretending she was blind.
        - id: ch03-b04
          speaker: pinocchio
          text: Poor Blackbird! Why did you do such a terrible thing to him?
        - id: ch03-b05
          speaker: cat
          text: I was teaching him a lesson. Next time, he'll know better than to interrupt someone else's conversation.
        - id: ch03-b06
          speaker: narrator
          text: They traveled on until they were nearly halfway home. Then the Fox stopped short and turned to Pinocchio.
        - id: ch03-b07
          speaker: fox
          text: Would you like to double your money?
        - id: ch03-b08
          speaker: pinocchio
          text: How could I do that?
        - id: ch03-b09
          speaker: fox
          text: What if those five miserable gold pieces could become a hundred, or a thousand, or even two thousand?
        - id: ch03-b10
          speaker: pinocchio
          text: I'd certainly like that! But how?
        - id: ch03-b11
          speaker: fox
          text: It's very easy. Instead of going home, come with us.
        - id: ch03-b12
          speaker: pinocchio
          text: Where would you take me?
        - id: ch03-b13
          speaker: fox
          text: To the Land of the Owls.
        - id: ch03-b14
          speaker: narrator
          text: Pinocchio thought for a moment. Then he gave a firm answer.
        - id: ch03-b15
          speaker: pinocchio
          text: No, I won't go. I'm already close to the house, and I'm going home to Papa. He's waiting for me. Who knows how many times that poor old man must have sighed yesterday when I never came back? I've truly been a bad son. The Talking Cricket was right when he told me that disobedient boys never come to any good in this world. I've found that out for myself, because one misfortune after another has happened to me. Why, just yesterday at Fire-Eater's place, I was in terrible danger. I almost... Oh, I shudder just thinking about it!
        - id: ch03-b16
          speaker: fox
          text: Well, if you've decided to go home, then go. It will be your loss.
        - id: ch03-b17
          speaker: cat
          text: Your loss!
        - id: ch03-b18
          speaker: fox
          text: Think carefully, Pinocchio. You're kicking good fortune away.
        - id: ch03-b19
          speaker: cat
          text: Good fortune!
        - id: ch03-b20
          speaker: fox
          text: By tomorrow, your five gold pieces could turn into two thousand.
        - id: ch03-b21
          speaker: cat
          text: Two thousand!
    - id: ch04
      title: The Field of Miracles
      blocks:
        - id: ch04-b01
          speaker: pinocchio
          text: But how could five coins ever become so many?
        - id: ch04-b02
          speaker: narrator
          text: Pinocchio stood with his mouth open in amazement.
        - id: ch04-b03
          speaker: fox
          text: I'll explain. In the Land of the Owls, there is a sacred place that everyone calls the Field of Miracles. You dig a small hole there and put one gold piece inside. Then you cover it with a little earth, pour on two pails of water from the fountain, and scatter two pinches of salt over it. When night comes, you can go peacefully to bed. While you sleep, the gold piece grows and blossoms. The next morning, you return to the field and find a beautiful tree. It will be loaded with as many gold pieces as an ear of corn has kernels in June.
        - id: ch04-b04
          speaker: pinocchio
          text: Then if I buried all five gold pieces, how many would I find the next morning?
        - id: ch04-b05
          speaker: fox
          text: That's a very easy calculation. You can count it on your fingers. Each gold piece will give you five hundred more. Five times five hundred means that tomorrow morning, you'll have two thousand five hundred shining gold pieces in your pocket.
        - id: ch04-b06
          speaker: pinocchio
          text: Oh, that would be wonderful! Once I have all those gold pieces, I'll keep two thousand and give the other five hundred to you both.
          emotion: happy
        - id: ch04-b07
          speaker: narrator
          text: Pinocchio danced with joy. But the Fox acted deeply offended.
        - id: ch04-b08
          speaker: fox
          text: Give us a reward? What can you be thinking?
          emotion: angry
        - id: ch04-b09
          speaker: cat
          text: What can you be thinking?
        - id: ch04-b10
          speaker: fox
          text: We don't help people for our own profit. We work only to make others rich.
        - id: ch04-b11
          speaker: cat
          text: Others!
        - id: ch04-b12
          speaker: narrator
          text: Pinocchio listened and thought to himself that they must be wonderfully good people. And right there on the road, he forgot everything else. He forgot his papa waiting at home, the new coat he meant to buy, his spelling book, and every good promise he had made. He turned to the Fox and the Cat.
        - id: ch04-b13
          speaker: pinocchio
          text: Let's go right now. I'm coming with you.
