  chapters:
    - id: ch01
      title: Pinocchio at Last Ceases to Be a Puppet and Becomes a Boy
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            Pinocchio swam hard toward shore with Geppetto on his shoulders. His father's legs trailed in the water, and the poor old man was trembling as if he had a fever. Maybe it was the cold. Maybe it was fear. It was probably some of each. Pinocchio thought fear was the trouble, so he tried to comfort him.
        - id: ch01-b02
          speaker: pinocchio
          text: >-
            Be brave, Papa! We'll be safe on shore in just a few minutes.
        - id: ch01-b03
          speaker: geppetto
          text: >-
            But where is this wonderful shore? I've looked everywhere, and all I can see is sky and sea.
          emotion: fearful
        - id: ch01-b04
          speaker: narrator
          text: >-
            The frightened little old man squeezed his eyes nearly shut, like a tailor trying to thread a needle.
        - id: ch01-b05
          speaker: pinocchio
          text: >-
            Well, I can see it. I'm like a cat. I see better at night than I do in the daytime.
        - id: ch01-b06
          speaker: narrator
          text: >-
            Pinocchio only pretended to be cheerful. He was losing heart. His strength was giving out, and every breath came in a gasp. He could not keep going much longer, but the shore was still far away. At last, he ran out of breath. He turned his head toward Geppetto and forced out a few broken words.
        - id: ch01-b07
          speaker: pinocchio
          text: >-
            Papa, help me. I'm dying!
          emotion: fearful
        - id: ch01-b08
          speaker: narrator
          text: >-
            Father and son were just about to drown when they heard a voice that sounded like an out-of-tune guitar.
        - id: ch01-b09
          speaker: tunny
          text: >-
            Who says he's dying?
        - id: ch01-b10
          speaker: pinocchio
          text: >-
            I am, and my poor father is, too!
        - id: ch01-b11
          speaker: tunny
          text: >-
            I know that voice. You're Pinocchio!
        - id: ch01-b12
          speaker: pinocchio
          text: >-
            That's right! Who are you?
        - id: ch01-b13
          speaker: tunny
          text: >-
            I'm the Tunny. We were prisoners together inside the Dog-Fish.
        - id: ch01-b14
          speaker: pinocchio
          text: >-
            How did you get out?
        - id: ch01-b15
          speaker: tunny
          text: >-
            I did what you did. You showed me the way, and I escaped right after you.
        - id: ch01-b16
          speaker: pinocchio
          text: >-
            You came just in time! Please help us, Tunny, or we're lost!
          emotion: fearful
        - id: ch01-b17
          speaker: tunny
          text: >-
            Gladly, and with all my heart. Both of you, take hold of my tail and let me lead you. I'll have you on shore in four minutes.
        - id: ch01-b18
          speaker: narrator
          text: >-
            Of course Geppetto and Pinocchio accepted at once. But instead of holding the Tunny's tail, they decided it would be more comfortable to ride on his back. The great fish carried them through the water and brought them safely to land. Pinocchio jumped onto the shore first so he could help his exhausted father climb out after him. Then he turned back to the Tunny, his voice full of feeling.
        - id: ch01-b19
          speaker: pinocchio
          text: >-
            My friend, you saved my papa's life. I don't have words big enough to thank you. At least let me give you a kiss, so you'll always know how grateful I am.
        - id: ch01-b20
          speaker: narrator
          text: >-
            The Tunny lifted his head above the water. Pinocchio knelt and kissed him tenderly on the mouth. No one had ever shown the poor fish such warm affection. He was so touched that he nearly cried like a child, and he felt ashamed to let them see. He dove beneath the water and disappeared.
        - id: ch01-b21
          speaker: narrator
          text: >-
            Dawn had come by then. Geppetto hardly had enough strength to stand, so Pinocchio offered him an arm.
        - id: ch01-b22
          speaker: pinocchio
          text: >-
            Lean on me, dear Papa, and let's go. We'll walk as slowly as ants. Whenever we get tired, we'll rest beside the road.
        - id: ch01-b23
          speaker: geppetto
          text: >-
            Where will we go?
        - id: ch01-b24
          speaker: pinocchio
          text: >-
            We'll look for a house or a cottage. Maybe someone will give us a little bread and some straw for a bed.
        - id: ch01-b25
          speaker: narrator
          text: >-
            Before they had walked a hundred yards, they saw two wicked-looking beggars beside the road. They were the Cat and the Fox, though they were almost impossible to recognize. The Cat had pretended to be blind for so long that now she truly was blind. The Fox had grown old and mangy, and one whole side of his body was paralyzed. Even his tail was gone. The sneaking thief had fallen into such misery that one day he had sold his beautiful tail to a traveling peddler, who used it to swat flies.
        - id: ch01-b26
          speaker: fox
          text: >-
            Oh, Pinocchio! Please spare a little charity for two poor, sick creatures.
        - id: ch01-b27
          speaker: cat
          text: >-
            Poor, sick creatures.
        - id: ch01-b28
          speaker: pinocchio
          text: >-
            Get away from me, you cheats! You fooled me once, but you won't ever fool me again.
          emotion: angry
        - id: ch01-b29
          speaker: fox
          text: >-
            Believe us, Pinocchio. We really are poor and miserable now!
        - id: ch01-b30
          speaker: pinocchio
          text: >-
            If you're poor, you earned it. Remember the saying: stolen money never bears fruit. Now go away, you cheats!
        - id: ch01-b31
          speaker: narrator
          text: >-
            Pinocchio and Geppetto left them behind and continued peacefully down the road. After another hundred yards, they came to a path through the fields. At the far end stood a pleasant little straw hut with a roof of tiles and bricks.
        - id: ch01-b32
          speaker: pinocchio
          text: >-
            Someone must live in that hut. Let's knock on the door.
        - id: ch01-b33
          speaker: narrator
          text: >-
            They went up to the hut and knocked.
        - id: ch01-b34
          speaker: pinocchio
          text: >-
            We're a poor father and son. We have no bread and nowhere to sleep.
        - id: ch01-b35
          speaker: talking_cricket
          text: >-
            Turn the key. The door will open.
        - id: ch01-b36
          speaker: narrator
          text: >-
            Pinocchio turned the key, and the door opened. He and Geppetto stepped inside and searched all around, but they could not find anyone.
        - id: ch01-b37
          speaker: pinocchio
          text: >-
            Where is the owner of this house?
        - id: ch01-b38
          speaker: talking_cricket
          text: >-
            Here I am. Look up!
        - id: ch01-b39
          speaker: narrator
          text: >-
            Father and son looked toward the ceiling. There, perched on a beam, was the Talking Cricket.
        - id: ch01-b40
          speaker: pinocchio
          text: >-
            Oh, my dear little Cricket!
        - id: ch01-b41
          speaker: narrator
          text: >-
            Pinocchio gave him a polite bow.
        - id: ch01-b42
          speaker: talking_cricket
          text: >-
            Ah, now I'm your dear little Cricket. Do you remember throwing a hammer handle at me because you wanted me out of your house?
        - id: ch01-b43
          speaker: pinocchio
          text: >-
            You're right, Cricket. Send me away if you want. Throw a hammer handle at me, too. Just please have mercy on my poor papa.
        - id: ch01-b44
          speaker: talking_cricket
          text: >-
            I'll help both of you. But I wanted you to remember how badly you treated me. When we can, we should be courteous to everyone. Then others may be courteous to us when we need them.
        - id: ch01-b45
          speaker: pinocchio
          text: >-
            You're right, Cricket, and I won't forget that lesson. But how did you get this beautiful hut?
        - id: ch01-b46
          speaker: talking_cricket
          text: >-
            A goat with beautiful blue wool gave it to me yesterday.
        - id: ch01-b47
          speaker: pinocchio
          text: >-
            Where did the goat go?
        - id: ch01-b48
          speaker: talking_cricket
          text: >-
            I don't know.
        - id: ch01-b49
          speaker: pinocchio
          text: >-
            When will she come back?
        - id: ch01-b50
          speaker: talking_cricket
          text: >-
            She'll never come back. She left yesterday in terrible grief. As she went, her bleating seemed to say, "Poor Pinocchio! I'll never see him again. By now, the Dog-Fish must have eaten him!"
        - id: ch01-b51
          speaker: pinocchio
          text: >-
            Did she really say that? Then it was her! It was my dear little Fairy!
          emotion: sad
        - id: ch01-b52
          speaker: narrator
          text: >-
            Pinocchio broke into sobs. He cried for a long while over the Fairy who had gone away believing him dead. At last, he dried his eyes. Geppetto still had almost no strength, so Pinocchio gathered the straw inside the hut and made him a comfortable bed. Once his father was lying down, Pinocchio turned to the Cricket again.
        - id: ch01-b53
          speaker: pinocchio
          text: >-
            Little Cricket, where can I get a glass of milk for my poor papa?
        - id: ch01-b54
          speaker: talking_cricket
          text: >-
            A gardener named Giangio lives three fields from here. He keeps cows. Go to him, and you'll find the milk you need.
        - id: ch01-b55
          speaker: narrator
          text: >-
            Pinocchio ran all the way to Giangio's house. When he got there, the gardener asked him what he wanted.
        - id: ch01-b56
          speaker: giangio
          text: >-
            How much milk do you need?
        - id: ch01-b57
          speaker: pinocchio
          text: >-
            One glassful.
        - id: ch01-b58
          speaker: giangio
          text: >-
            A glass of milk costs five cents. Give me the money first.
        - id: ch01-b59
          speaker: pinocchio
          text: >-
            I don't have a single cent.
          emotion: sad
        - id: ch01-b60
          speaker: narrator
          text: >-
            Pinocchio felt both hurt and ashamed.
        - id: ch01-b61
          speaker: giangio
          text: >-
            That's too bad, puppet. If you don't have one cent, I don't have one drop of milk.
        - id: ch01-b62
          speaker: pinocchio
          text: >-
            Then I'll have to do without it.
        - id: ch01-b63
          speaker: narrator
          text: >-
            He turned to leave, but Giangio stopped him.
        - id: ch01-b64
          speaker: giangio
          text: >-
            Wait. Maybe we can make a bargain. Will you work the water pump?
        - id: ch01-b65
          speaker: pinocchio
          text: >-
            What's a water pump?
        - id: ch01-b66
          speaker: giangio
          text: >-
            It's a wooden pole that draws water from the cistern so I can water the vegetables.
        - id: ch01-b67
          speaker: pinocchio
          text: >-
            Let me try.
        - id: ch01-b68
          speaker: giangio
          text: >-
            All right. Draw up a hundred buckets, and I'll pay you with one glass of milk.
        - id: ch01-b69
          speaker: pinocchio
          text: >-
            It's a deal.
        - id: ch01-b70
          speaker: narrator
          text: >-
            Giangio took him into the kitchen garden and showed him how to turn the pump. Pinocchio went straight to work. Again and again he worked the wooden pole, pulling water from the cistern and filling one bucket after another for the vegetables. Before he reached one hundred buckets, sweat was pouring from his head to his feet. Never before had he known such exhausting work, but he kept going until he earned the milk.
        - id: ch01-b71
          speaker: giangio
          text: >-
            My little donkey used to turn this pump. The poor animal is dying now.
        - id: ch01-b72
          speaker: pinocchio
          text: >-
            Will you take me to see him?
        - id: ch01-b73
          speaker: giangio
          text: >-
            Certainly.
        - id: ch01-b74
          speaker: narrator
          text: >-
            Inside the stable, Pinocchio saw a beautiful little donkey stretched out on the straw, worn down by hunger and too much work. He studied the animal's face, and a troubled thought came to him.
        - id: ch01-b75
          speaker: pinocchio
          text: >-
            I'm sure I know this donkey. I've seen that face before.
        - id: ch01-b76
          speaker: narrator
          text: >-
            He bent close and spoke in the language of donkeys.
        - id: ch01-b77
          speaker: pinocchio
          text: >-
            Who are you?
        - id: ch01-b78
          speaker: narrator
          text: >-
            The little donkey opened his dying eyes. In a broken voice, and in that same donkey language, he answered one last time.
        - id: ch01-b79
          speaker: candlewick
          text: >-
            I am... Can... dle... wick.
          emotion: sad
        - id: ch01-b80
          speaker: narrator
          text: >-
            Candlewick closed his eyes again and died.
        - id: ch01-b81
          speaker: pinocchio
          text: >-
            Oh, poor Candlewick.
          emotion: sad
        - id: ch01-b82
          speaker: narrator
          text: >-
            Pinocchio picked up a handful of straw and wiped away a tear that rolled down his face.
        - id: ch01-b83
          speaker: giangio
          text: >-
            Why mourn over a donkey that cost you nothing? Think how I feel. I paid good money for him.
        - id: ch01-b84
          speaker: pinocchio
          text: >-
            But he was my friend!
        - id: ch01-b85
          speaker: giangio
          text: >-
            Your friend?
        - id: ch01-b86
          speaker: pinocchio
          text: >-
            He went to school with me.
        - id: ch01-b87
          speaker: giangio
          text: >-
            What? You had donkeys for schoolmates? I can just imagine what marvelous things you studied!
        - id: ch01-b88
          speaker: narrator
          text: >-
            Giangio laughed loudly. His words embarrassed Pinocchio, but the puppet said nothing. He took the glass of warm milk he had earned and returned to the hut.
        - id: ch01-b89
          speaker: narrator
          text: >-
            From that day on, Pinocchio rose at dawn every morning and crossed the three fields to work the pump. The glass of milk he earned each day did his father great good. He kept this up for more than five months. And that was not all. In every spare hour, he learned to weave baskets and hampers from rushes. He sold them and carefully stretched the money far enough to pay all their daily expenses. He even built a fine little wheelchair for Geppetto. On pleasant days, he could roll his father outside to breathe the fresh air.
        - id: ch01-b90
          speaker: narrator
          text: >-
            Pinocchio worked hard, found clever ways past every difficulty, and kept his father comfortable while Geppetto remained weak. He also managed to save five dollars for a new coat.
        - id: ch01-b91
          speaker: pinocchio
          text: >-
            Papa, I'm going to the market nearby. I'm going to buy a jacket, a cap, and a pair of shoes. When I come home, I'll be dressed so well that you'll think I'm a fine gentleman!
          emotion: happy
        - id: ch01-b92
          speaker: narrator
          text: >-
            Pinocchio laughed, left the house, and ran happily along. Then someone called his name. He turned and saw a big Snail crawling out of the hedge.
        - id: ch01-b93
          speaker: snail
          text: >-
            Don't you know me?
        - id: ch01-b94
          speaker: pinocchio
          text: >-
            You look familiar, but I'm not quite sure.
        - id: ch01-b95
          speaker: snail
          text: >-
            Don't you remember the Snail who waited on the Fairy with blue hair? I came downstairs to let you in once, and found your foot stuck right through the front door.
        - id: ch01-b96
          speaker: pinocchio
          text: >-
            I remember everything! Please tell me quickly, my lovely little Snail. Where is my good Fairy? What is she doing? Has she forgiven me? Does she remember me and still care about me? Is she far away? Can I visit her?
        - id: ch01-b97
          speaker: narrator
          text: >-
            Pinocchio poured out every question without taking a breath. The Snail answered in her usual slow, unhurried way.
        - id: ch01-b98
          speaker: snail
          text: >-
            My dear Pinocchio, the poor Fairy is in a hospital bed.
        - id: ch01-b99
          speaker: pinocchio
          text: >-
            In the hospital?
          emotion: surprised
        - id: ch01-b100
          speaker: snail
          text: >-
            I'm afraid it's true. A thousand troubles have made her very ill, and she doesn't even have enough money for a bite of bread.
        - id: ch01-b101
          speaker: pinocchio
          text: >-
            Is that really true? Oh, what terrible news! My poor Fairy! If I had a million dollars, I'd run straight to her with it. But I only have five. Here, take it. I was going to buy a new coat, but you must bring the money to my good Fairy right now.
          emotion: sad
        - id: ch01-b102
          speaker: snail
          text: >-
            What about your new coat?
        - id: ch01-b103
          speaker: pinocchio
          text: >-
            What does a new coat matter now? I'd sell even the rags on my back if it would help her. Please take the five dollars to her, and hurry. Come back to this same spot in two days. I hope I'll have more money ready for you then. Until today, I've worked to care for Papa. From now on, I'll work five extra hours so I can care for my good mamma, too. Goodbye, Snail! I'll be waiting here for you in two days.
        - id: ch01-b104
          speaker: narrator
          text: >-
            The Snail did something quite unlike her usual self. She took off as fast as a lizard on a hot August day.
        - id: ch01-b105
          speaker: narrator
          text: >-
            That evening, Pinocchio did not go to bed at ten. He stayed up until midnight. Instead of weaving eight rush baskets, he made sixteen. Then he went to bed and fell asleep.
        - id: ch01-b106
          speaker: narrator
          text: >-
            As he slept, he dreamed of the Fairy. She was beautiful and smiling. She kissed him, then spoke.
        - id: ch01-b107
          speaker: fairy
          text: >-
            Well done, Pinocchio! You have a good heart, so I forgive everything you did before. Children who lovingly care for their parents through sickness and hardship deserve great praise and affection, even when they have not always been obedient or well behaved. Keep trying to do better, and you will be happy.
        - id: ch01-b108
          speaker: narrator
          text: >-
            At that moment, the dream ended. Pinocchio opened his eyes and woke up.
        - id: ch01-b109
          speaker: narrator
          text: >-
            Imagine his astonishment when he realized what had happened. He was no longer a wooden puppet. His stiff wooden body was gone, and he had become a boy like any other boy. He looked around in wonder. The straw walls of the poor hut had vanished, too. Now he was in a pretty little room. Its furniture was simple, yet everything was arranged with such care that it seemed almost elegant. Pinocchio jumped out of bed. A new suit of clothes, a new cap, and a new pair of boots were waiting for him. He put them on, and every piece fit beautifully.
        - id: ch01-b110
          speaker: narrator
          text: >-
            As soon as he was dressed, Pinocchio slipped his hands into his pockets. He pulled out a small ivory purse. Written on it were the words, "The Fairy with blue hair returns five dollars to her dear Pinocchio and thanks him for his good heart." He opened the purse, expecting to find the money he had given away. Instead of five dollars, he found fifty bright gold pieces, shining as if they had just come from the mint.
        - id: ch01-b111
          speaker: narrator
          text: >-
            Next, he went to the mirror and stared at his reflection. For a moment, he thought he was looking at someone else. The familiar wooden puppet was nowhere to be seen. Looking back at him was a bright, intelligent boy with chestnut hair and blue eyes. His face was as happy and joyful as if it were Easter vacation.
        - id: ch01-b112
          speaker: narrator
          text: >-
            One wonder followed another until Pinocchio felt completely bewildered. He could not tell whether he was truly awake or dreaming with his eyes open.
        - id: ch01-b113
          speaker: pinocchio
          text: >-
            Where can Papa be?
          emotion: surprised
        - id: ch01-b114
          speaker: narrator
          text: >-
            He hurried into the next room. There stood old Geppetto, healthy, lively, and cheerful, just as he used to be. He had already returned to carving wood. Before him was a rich, beautiful design for a frame, covered with leaves, flowers, and animal heads.
        - id: ch01-b115
          speaker: pinocchio
          text: >-
            Dear Papa, please tell me. How did everything change so suddenly?
        - id: ch01-b116
          speaker: narrator
          text: >-
            Pinocchio threw his arms around Geppetto's neck and covered him with kisses.
        - id: ch01-b117
          speaker: geppetto
          text: >-
            You are the reason our home changed.
        - id: ch01-b118
          speaker: pinocchio
          text: >-
            Me? How did I do it?
        - id: ch01-b119
          speaker: geppetto
          text: >-
            When children who once behaved badly turn themselves around and become good, they can bring happiness and contentment to their whole family.
        - id: ch01-b120
          speaker: pinocchio
          text: >-
            Then where did the old wooden Pinocchio go?
        - id: ch01-b121
          speaker: geppetto
          text: >-
            There he is.
        - id: ch01-b122
          speaker: narrator
          text: >-
            Geppetto pointed toward a large puppet leaning against a chair. Its head sagged to one side, its arms dangled loose, and its legs were crossed and bent so awkwardly that it seemed like a miracle the thing remained standing.
        - id: ch01-b123
          speaker: narrator
          text: >-
            Pinocchio turned and looked at it for a while. Then, feeling very pleased with himself, he thought about the puppet he had been.
        - id: ch01-b124
          speaker: pinocchio
          text: >-
            How ridiculous I was when I was a puppet! And how glad I am to be a well-behaved little boy!
          emotion: happy
