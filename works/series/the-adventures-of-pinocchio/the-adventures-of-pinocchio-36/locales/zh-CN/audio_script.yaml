audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖从容，带一点一本正经的幽默
        timbre: 清晰醇厚
        pace: 舒缓，遇到惊奇处略微加快
        pitch: 中
    pinocchio:
      display_name: 匹诺曹
      tts:
        delivery: 任性直率，嘴硬而孩子气，危急时急促慌张
        timbre: 清亮，带木偶般的脆响
        pace: 偏快，争辩时更急
        pitch: 中高
    geppetto:
      display_name: 杰佩托
      tts:
        delivery: 活泼直率，发怒时火爆而有喜剧感
        timbre: 苍老而响亮
        pace: 中等，争吵时急促
        pitch: 中高
    tunny:
      display_name: 金枪鱼
      tts:
        delivery: 沉着认命，严肃中透着一本正经的滑稽
        timbre: 低沉粗哑，像走调的弦乐声
        pace: 缓慢
        pitch: 低
    fox:
      display_name: 狐狸
      tts:
        delivery: 客气圆滑，劝诱时显得格外诚恳
        timbre: 细长而略带沙哑
        pace: 从容，编造谎话时流畅笃定
        pitch: 中
    cat:
      display_name: 猫
      tts:
        delivery: 冷淡狡猾，惯于附和狐狸的话
        timbre: 轻细干涩
        pace: 缓慢，重复时短促有力
        pitch: 中高
    talking_cricket:
      display_name: 会说话的蟋蟀
      tts:
        delivery: 耐心清醒，劝诫时严肃却不盛气凌人
        timbre: 细而清晰，带一点年长者的沉稳
        pace: 从容
        pitch: 高
    giangio:
      display_name: 詹焦
      tts:
        delivery: 务实直爽，说笑时带着乡下人的粗朴
        timbre: 结实粗亮的成年男声
        pace: 中等
        pitch: 中低
    candlewick:
      display_name: 灯芯
      tts:
        delivery: 懒散顽皮，怂恿朋友时又热切又狡黠
        timbre: 单薄明亮的少年声音
        pace: 轻快，得意时稍慢
        pitch: 中高
    snail:
      display_name: 蜗牛
      tts:
        delivery: 不慌不忙，一本正经，始终慢条斯理
        timbre: 柔和圆润
        pace: 很慢
        pitch: 中
    fairy:
      display_name: 仙女
      tts:
        delivery: 温柔庄重，宽容中带着明确的告诫
        timbre: 清澈柔和
        pace: 从容
        pitch: 中高
  chapters:
    - id: ch01
      title: 海上的救星
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            匹诺曹背着爸爸，飞快地朝岸边游。他忽然觉得杰佩托抖得厉害。老人两条腿泡在海里，浑身直打哆嗦，简直像发起了寒热病。也许他又冷又怕，可匹诺曹只当爸爸在害怕，便赶紧给他打气。
        - id: ch01-b02
          speaker: pinocchio
          text: >-
            爸爸，振作一点！再过几分钟，我们就能安全上岸了。
        - id: ch01-b03
          speaker: geppetto
          text: >-
            可岸到底在哪儿啊？我到处都看过了，眼前除了天就是海，哪儿有岸呢？
          emotion: fearful
        - id: ch01-b04
          speaker: narrator
          text: >-
            小老头越说越害怕，把眼睛眯得细细的，就像裁缝正对准针眼穿线。
        - id: ch01-b05
          speaker: pinocchio
          text: >-
            我连岸都看见了。您不知道吧，我跟猫一样，到了夜里反而看得更清楚。
        - id: ch01-b06
          speaker: narrator
          text: >-
            匹诺曹嘴上装得轻松，心里却越来越泄气。他的力气一点一点耗尽，只能张着嘴又急又重地喘气。可岸还远着呢，他已经游不动了。他拼命又游了一阵，直到再也喘不上气，才回过头去看杰佩托。
        - id: ch01-b07
          speaker: pinocchio
          text: >-
            爸爸，快救救我……我要死了！
        - id: ch01-b08
          speaker: narrator
          text: >-
            父子俩眼看就要沉下去，海面上忽然响起一个声音，听着像一把走了调的吉他。
        - id: ch01-b09
          speaker: tunny
          text: >-
            是谁快要死了？
        - id: ch01-b10
          speaker: pinocchio
          text: >-
            是我，还有我可怜的爸爸！
        - id: ch01-b11
          speaker: tunny
          text: >-
            这个声音我认得。你是匹诺曹！
        - id: ch01-b12
          speaker: pinocchio
          text: >-
            正是我。你又是谁？
        - id: ch01-b13
          speaker: tunny
          text: >-
            我是金枪鱼。咱们一起在大鲨鱼肚子里坐过牢呀。
        - id: ch01-b14
          speaker: pinocchio
          text: >-
            你怎么也逃出来了？
        - id: ch01-b15
          speaker: tunny
          text: >-
            我照你做的办法，也沿着你指的路逃了出来。
        - id: ch01-b16
          speaker: pinocchio
          text: >-
            你来得太及时了！求你救救我们，不然我们俩都活不成。
        - id: ch01-b17
          speaker: tunny
          text: >-
            我打心眼里愿意帮忙。你们两个抓紧我的尾巴，让我来带路。用不了四分钟，我就送你们上岸。
        - id: ch01-b18
          speaker: narrator
          text: >-
            杰佩托和匹诺曹当然立刻答应了。不过他们想，抓着尾巴不如骑在背上舒服，于是双双爬上了金枪鱼的背。
    - id: ch02
      title: 岸边的告别
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            金枪鱼把他们送到岸边。匹诺曹先跳上去，再把爸爸拉上陆地。随后，他回头望着救命恩人，声音里满是激动。
        - id: ch02-b02
          speaker: pinocchio
          text: >-
            我的朋友，你救了我爸爸一命！我真不知道该怎么谢你。至少让我亲你一下，让你知道我永远不会忘记这份恩情！
        - id: ch02-b03
          speaker: narrator
          text: >-
            金枪鱼把头伸出海面。匹诺曹跪在岸边，亲热地吻了吻他的嘴。这一吻来得那么自然，又充满了真心。金枪鱼从来没有受过这样的亲吻，一下子感动得眼泪都出来了。他又不好意思让别人看见自己哭得像个孩子，赶紧钻进水里，从他们眼前消失了。
        - id: ch02-b04
          speaker: narrator
          text: >-
            天已经亮了。杰佩托累得几乎站不住，匹诺曹便把自己的胳膊递过去。
        - id: ch02-b05
          speaker: pinocchio
          text: >-
            爸爸，扶着我走吧。咱们走得慢一点，像蚂蚁那么慢。累了，就在路边歇一歇。
        - id: ch02-b06
          speaker: geppetto
          text: >-
            咱们这是要去哪儿？
        - id: ch02-b07
          speaker: pinocchio
          text: >-
            去找一户人家，请他们行行好，给咱们一口面包，再给点干草当床铺。
        - id: ch02-b08
          speaker: narrator
          text: >-
            他们还没走出一百码，就看见两个凶相十足的家伙在路边讨钱。那是猫和狐狸，可如今几乎认不出他们了。你们想想看，猫装瞎装了太久，竟然真的成了瞎子。狐狸已经又老又秃，半边身子也瘫了，甚至连尾巴都没有了。这个鬼鬼祟祟的小偷穷得走投无路，有一天只好把那条漂亮尾巴卖给流动小贩，让小贩拿去赶苍蝇。
        - id: ch02-b09
          speaker: fox
          text: >-
            匹诺曹，行行好吧！给我们两个又穷又残疾的可怜人一点东西。
        - id: ch02-b10
          speaker: cat
          text: >-
            两个残疾的可怜人。
        - id: ch02-b11
          speaker: pinocchio
          text: >-
            滚开，你们这两个骗子！你们从前骗过我一次，这回休想再得手。
        - id: ch02-b12
          speaker: fox
          text: >-
            你要相信我呀。我们现在真的又穷又倒霉！
        - id: ch02-b13
          speaker: pinocchio
          text: >-
            你们会穷成这样，完全是自作自受。老话说得好，偷来的钱结不出果子。滚开吧，骗子！
        - id: ch02-b14
          speaker: narrator
          text: >-
            匹诺曹和杰佩托撇下他们，安安稳稳地继续走。又过了一百码，父子俩看见田野里的小路尽头有一间漂亮草屋，屋顶盖着砖瓦。
    - id: ch03
      title: 会说话的蟋蟀
      blocks:
        - id: ch03-b01
          speaker: pinocchio
          text: >-
            屋里一定有人。咱们过去敲门吧。
        - id: ch03-b02
          speaker: narrator
          text: >-
            父子俩到了门前，敲了敲门。匹诺曹便朝门里说明了来意。
        - id: ch03-b03
          speaker: pinocchio
          text: >-
            我们是一对可怜的父子，没有饭吃，也没有地方住。
        - id: ch03-b04
          speaker: talking_cricket
          text: >-
            转一下钥匙，门自然会开。
        - id: ch03-b05
          speaker: narrator
          text: >-
            匹诺曹照着做了。门一开，他们走进屋里，左看右看，却找不到半个人影。
        - id: ch03-b06
          speaker: pinocchio
          text: >-
            真奇怪，这家的主人躲在哪儿呢？
          emotion: surprised
        - id: ch03-b07
          speaker: talking_cricket
          text: >-
            我就在这里，在你们头顶上！
        - id: ch03-b08
          speaker: narrator
          text: >-
            两人马上抬起头，这才看见会说话的蟋蟀站在屋梁上。匹诺曹恭恭敬敬地朝他鞠了一躬。
        - id: ch03-b09
          speaker: pinocchio
          text: >-
            原来是你呀，我亲爱的小蟋蟀！
        - id: ch03-b10
          speaker: talking_cricket
          text: >-
            现在倒叫得亲热了。你还记得吗？从前你为了赶我出门，拿起木槌柄就朝我扔过来。
        - id: ch03-b11
          speaker: pinocchio
          text: >-
            你说得没错。你也把我赶出去吧，拿木槌柄扔我也行，只求你可怜我那苦命的爸爸！
        - id: ch03-b12
          speaker: talking_cricket
          text: >-
            你们父子俩，我都会照顾。我提起以前受的气，是想让你明白一个道理。平日能对别人客气，就该对每个人都客气。等自己落难时，才会有人也这样待你。
        - id: ch03-b13
          speaker: pinocchio
          text: >-
            你教训得对，我会记住的。可是，这间漂亮小屋是怎么买来的？
        - id: ch03-b14
          speaker: talking_cricket
          text: >-
            昨天，一只浑身长着漂亮蓝毛的山羊把它送给了我。
        - id: ch03-b15
          speaker: pinocchio
          text: >-
            那只山羊去了哪儿？她什么时候回来？
        - id: ch03-b16
          speaker: talking_cricket
          text: >-
            我不知道她去了哪儿，只知道她不会回来了。昨天她伤心得很，临走时不停地叫。听起来，她像是在说，可怜的匹诺曹一定已经让大鲨鱼吃掉了，她再也见不到他了。
        - id: ch03-b17
          speaker: pinocchio
          text: >-
            她真这么说吗？那一定是她，是我亲爱的小仙女！
          emotion: sad
        - id: ch03-b18
          speaker: narrator
          text: >-
            匹诺曹一边抽噎，一边哭了好久，才终于擦干眼泪。他找来干草，仔细替杰佩托铺成一张舒服的床，让爸爸躺下休息。等一切都安顿好了，他又向蟋蟀打听，附近哪里能找到一杯牛奶，好给可怜的爸爸喝。
        - id: ch03-b19
          speaker: talking_cricket
          text: >-
            走过三块田，有个名叫詹焦的园丁。他养着奶牛，你需要的牛奶可以去找他。
    - id: ch04
      title: 一杯牛奶
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            匹诺曹一路跑到詹焦家。园丁见了他，先问他想要多少牛奶。
        - id: ch04-b02
          speaker: pinocchio
          text: >-
            我想要满满一杯。
        - id: ch04-b03
          speaker: giangio
          text: >-
            一杯要五分钱。先把钱交给我吧。
        - id: ch04-b04
          speaker: pinocchio
          text: >-
            可我身上一分钱也没有。
          emotion: sad
        - id: ch04-b05
          speaker: giangio
          text: >-
            那可难办了，木偶。你拿不出一分钱，我也拿不出一滴牛奶。
        - id: ch04-b06
          speaker: pinocchio
          text: >-
            没办法，我只好忍一忍了。
        - id: ch04-b07
          speaker: narrator
          text: >-
            匹诺曹转身要走，詹焦又叫住了他。
        - id: ch04-b08
          speaker: giangio
          text: >-
            先等等，咱们可以谈个条件。你愿不愿意替我转抽水机？
        - id: ch04-b09
          speaker: pinocchio
          text: >-
            抽水机是什么东西？
        - id: ch04-b10
          speaker: giangio
          text: >-
            是一根木杆。转动它，就能从蓄水池里把水打上来浇菜。
        - id: ch04-b11
          speaker: pinocchio
          text: >-
            那就让我试一试。
        - id: ch04-b12
          speaker: giangio
          text: >-
            好。你打满一百桶水，我就拿一杯牛奶当工钱。
        - id: ch04-b13
          speaker: pinocchio
          text: >-
            就这么说定了。
        - id: ch04-b14
          speaker: narrator
          text: >-
            詹焦把他带进菜园，教会他怎样转动木杆。匹诺曹马上干起活来。一百桶水还没打完，他的汗已经从头流到了脚。这辈子，他还从没吃过这样的苦。
        - id: ch04-b15
          speaker: giangio
          text: >-
            以前这活儿是我的小毛驴干的。可怜的小家伙眼看就要死了。
        - id: ch04-b16
          speaker: pinocchio
          text: >-
            您能让我去看看他吗？
        - id: ch04-b17
          speaker: giangio
          text: >-
            当然可以，我带你过去。
        - id: ch04-b18
          speaker: narrator
          text: >-
            马厩里，一头漂亮的小毛驴直挺挺躺在干草上。他挨了太多饿，又干了太多活，浑身的力气都耗光了，眼看就要死去。匹诺曹站在那里，仔仔细细看了他好一会儿，心里越来越不安。这头毛驴，他肯定认识。这张脸，他以前一定见过。
        - id: ch04-b19
          speaker: narrator
          text: >-
            他俯下身，凑近小毛驴，用驴子的语言问道。
        - id: ch04-b20
          speaker: pinocchio
          text: >-
            你到底是谁？
        - id: ch04-b21
          speaker: candlewick
          text: >-
            我是灯芯。
        - id: ch04-b22
          speaker: narrator
          text: >-
            小毛驴睁开将死的眼睛，也用驴子的语言断断续续说出了这个名字。话一说完，他又闭上眼睛，咽了气。匹诺曹低声叫着可怜的灯芯，抓起一把干草，擦掉脸上的泪。
        - id: ch04-b23
          speaker: giangio
          text: >-
            这头驴又没花你一分钱，你伤心什么？我可是拿现钱买下他的，我才该心疼呢。
        - id: ch04-b24
          speaker: pinocchio
          text: >-
            您不知道，他是我的朋友！
        - id: ch04-b25
          speaker: giangio
          text: >-
            你的朋友？
        - id: ch04-b26
          speaker: pinocchio
          text: >-
            他是我从前的一个同学！
        - id: ch04-b27
          speaker: giangio
          text: >-
            什么？你上学的时候，连同学都是驴？那你们学的功课一定很了不起！
        - id: ch04-b28
          speaker: narrator
          text: >-
            詹焦说完放声大笑。匹诺曹羞得说不出话，只拿起那杯热牛奶，回到了小屋。
    - id: ch05
      title: 五个月的辛劳
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: >-
            从此以后，匹诺曹每天一到黎明就起床，跑去替詹焦转抽水机。这样一天也不间断，一连过了五个多月。他每天都能靠自己的力气挣回一杯牛奶，给身体一直不好的爸爸补养。可他并不觉得这样就够了。剩下的时间也没闲着。他学会用灯心草编篮子和大筐，再把编好的东西拿去卖，挣来的钱精打细算，用来应付一家人每天的开销。
        - id: ch05-b02
          speaker: narrator
          text: >-
            匹诺曹还亲手做了一辆漂亮的小轮椅。天气好的时候，他就推着爸爸出去透透气。靠着勤劳和聪明，也靠着一股不肯向困难低头的劲儿，他不但把爸爸照顾得舒舒服服，还攒下五块钱，打算给自己添一件外套。
        - id: ch05-b03
          speaker: pinocchio
          text: >-
            爸爸，我今天要去附近的集市，给自己买件短上衣，再买帽子和鞋。等我回来，穿得那么神气，您准会把我当成一位小绅士！
          emotion: happy
        - id: ch05-b04
          speaker: narrator
          text: >-
            匹诺曹笑着出了门，一路欢欢喜喜地跑。忽然有人在背后叫他的名字。他回头一看，一只大蜗牛正从树篱里往外爬。
        - id: ch05-b05
          speaker: snail
          text: >-
            你已经不认识我了吗？
        - id: ch05-b06
          speaker: pinocchio
          text: >-
            我看着有点眼熟，可又不太敢认。
        - id: ch05-b07
          speaker: snail
          text: >-
            我给蓝头发仙女做过女仆呀。有一次，你把脚插进大门，结果卡在里面，还是我下楼给你开的门。现在想起来了吗？
        - id: ch05-b08
          speaker: pinocchio
          text: >-
            我全想起来了！快告诉我，我美丽的小蜗牛，你把好仙女留在哪儿了？她在做什么？她原谅我了吗？她还记得我，还疼我吗？她离这儿远不远？我能去看她吗？
        - id: ch05-b09
          speaker: narrator
          text: >-
            匹诺曹的问题一个追着一个，快得几乎来不及喘气。蜗牛却还是老样子，慢悠悠地开了口。
        - id: ch05-b10
          speaker: snail
          text: >-
            我亲爱的匹诺曹，可怜的仙女现在躺在医院里。
        - id: ch05-b11
          speaker: pinocchio
          text: >-
            她住进医院了？
        - id: ch05-b12
          speaker: snail
          text: >-
            这是真的。她遭了无数灾祸，病得很重，现在连买一口面包的钱都没有。
        - id: ch05-b13
          speaker: pinocchio
          text: >-
            真的有这样的事？这消息太叫人难过了！可怜的仙女！我要是有一百万，马上全给她送去。可我只有五块钱，本来要拿去买外套。钱都在这里，你快替我带给她吧。
          emotion: sad
        - id: ch05-b14
          speaker: snail
          text: >-
            那你不买新外套了吗？
        - id: ch05-b15
          speaker: pinocchio
          text: >-
            外套哪有她要紧！只要能帮她，我连身上这套破衣服也可以卖。你快去吧，千万别耽搁。两天以后还到这里来，我希望那时能再交给你一些钱。到今天为止，我干活是为了养爸爸。从今天开始，我每天要多干五个小时，也要养我的好妈妈。再见了，蜗牛，两天以后，我就在这里等你。
        - id: ch05-b16
          speaker: narrator
          text: >-
            蜗牛一反慢吞吞的老习惯，跑得像八月烈日下的蜥蜴。那天夜里，匹诺曹没有十点钟上床，一直干到午夜。他平常只能编八只篮子，这一次却编出了十六只。
    - id: ch06
      title: 仙女的奖赏
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: >-
            匹诺曹终于上床睡了。梦里，他看见仙女正微笑着望着自己。她还是那么美丽。仙女俯身吻了他，然后温柔地说道。
        - id: ch06-b02
          speaker: fairy
          text: >-
            做得好，匹诺曹。你有一颗善良的心，我就把你过去做的一切都原谅了。一个孩子就算还算不上听话懂事，只要肯用心照料父母，在他们贫苦、生病的时候尽力帮助，就值得人们赞美和疼爱。往后继续好好做，你会幸福的。
          emotion: happy
        - id: ch06-b03
          speaker: narrator
          text: >-
            仙女说完，梦也结束了。匹诺曹睁开眼睛，醒了过来。可这一醒，真把他惊呆了。他不再是个木偶，而是变成了一个真正的男孩子。
        - id: ch06-b04
          speaker: narrator
          text: >-
            他赶紧朝四周看了看，草屋的墙已经完全不见了，自己正躺在一间漂亮的小屋里。屋里的家具和摆设虽然简单，却收拾得十分雅致。匹诺曹跳下床，又发现一套新衣服、一顶新帽子和一双新靴子早已替他准备好了。穿到身上，每一件都合适得不能再合适。
        - id: ch06-b05
          speaker: narrator
          text: >-
            他才穿好衣服，手一伸进口袋，摸出了一只象牙小钱袋。钱袋上写着，蓝头发仙女把五块钱还给亲爱的匹诺曹，并感谢他的好心。他打开一看，里面不是五块钱，而是五十枚新铸的金币，每一枚都闪闪发亮。
        - id: ch06-b06
          speaker: narrator
          text: >-
            匹诺曹又走到镜子前，朝里面看了一眼，差点以为对面站着另一个人。过去每天都能看见的木偶影子消失了。镜中迎面望着他的，是个聪明伶俐的男孩。他有栗色头发和蓝眼睛，脸上那么欢喜，那么快活，仿佛正在过复活节假期。
        - id: ch06-b07
          speaker: narrator
          text: >-
            奇事一件接一件，匹诺曹彻底糊涂了。他甚至说不准，自己究竟醒着，还是睁着眼睛做梦。
    - id: ch07
      title: 真正的男孩子
      blocks:
        - id: ch07-b01
          speaker: pinocchio
          text: >-
            我的爸爸到哪儿去了？
        - id: ch07-b02
          speaker: narrator
          text: >-
            匹诺曹忽然叫了一声，立刻跑进隔壁房间。老杰佩托果然就在那里。他的身体已经完全恢复了健康，又精神，又快活，跟从前一模一样。他也重新做起了木雕匠，正拿着工具设计一只华丽的镜框。镜框上有叶子，有花朵，还有一颗颗动物的脑袋。
        - id: ch07-b03
          speaker: narrator
          text: >-
            匹诺曹扑过去搂住爸爸的脖子，接连亲了好多下。
        - id: ch07-b04
          speaker: pinocchio
          text: >-
            爸爸，快给我解解这个谜吧。咱们家为什么一下子全变了样？
        - id: ch07-b05
          speaker: geppetto
          text: >-
            家里会有这些变化，全都是你的功劳。
        - id: ch07-b06
          speaker: pinocchio
          text: >-
            怎么会是我的功劳呢？
        - id: ch07-b07
          speaker: geppetto
          text: >-
            做过坏事的孩子只要肯改过，真正变好，就能把安宁和幸福带给全家。
        - id: ch07-b08
          speaker: pinocchio
          text: >-
            那么，从前那个木头匹诺曹藏到哪里去了？
        - id: ch07-b09
          speaker: geppetto
          text: >-
            他就在那儿。
        - id: ch07-b10
          speaker: narrator
          text: >-
            杰佩托指向椅子旁边。那里倚着一个大木偶，脑袋歪向一边，两条胳膊垂着，两条腿交叉着弯成一团。那样还能站住，简直算得上奇迹。
        - id: ch07-b11
          speaker: narrator
          text: >-
            匹诺曹转身望着木偶，看了好一会儿。最后，他心满意足地对自己说。
        - id: ch07-b12
          speaker: pinocchio
          text: >-
            我做木偶的时候，样子多可笑啊！现在我成了一个规规矩矩的男孩子，真是太好了！
          emotion: happy
