audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖从容，带一点一本正经的幽默
        timbre: 清晰醇厚
        pace: 舒缓，遇到惊奇处略微加快
        pitch: 中
    pinocchio:
      display_name: 匹诺曹
      tts:
        delivery: 任性直率，嘴硬而孩子气，发怒时冲动急躁
        timbre: 清亮，带木偶般的脆响
        pace: 偏快，争辩时更急
        pitch: 中高
  chapters:
    - id: ch01
      title: 重获自由
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 匹诺曹发现自己终于自由了，欢喜得不得了。他顾不上歇一口气，马上离开城里，沿着通往仙女家的路跑去。雨把整条路泡成了泥沼，他每走一步，腿都要陷到膝盖。可木偶一点儿也不肯停。他急着再见爸爸，也急着再见那位蓝发小妹妹，于是像灵缇犬一样飞奔。一路上，泥浆溅得到处都是，把他从头糊到了脚。匹诺曹边跑边数落起自己来。
        - id: ch01-b02
          speaker: pinocchio
          text: 我怎么碰上了这么多倒霉事！可这都是我自找的。谁叫我是个又固执又急躁的木偶，总要照自己的意思来，从来不听真心为我好的人。他们比我明白一千倍呢！从现在起，我一定改。我会守规矩，也会听话。现在我总算知道了，不听话的孩子不会有好下场，到头来什么也得不到。
        - id: ch01-b03
          speaker: pinocchio
          text: 爸爸一直在等我吗？我能在仙女家找到他吗？可怜的爸爸，我这么久没见他，真想马上抱住他，使劲亲他！仙女肯原谅我吗？她对我那么好，又那么细心地照料我。要不是她，我早就没命了！世上还有比我更忘恩负义、更没良心的孩子吗？
    - id: ch02
      title: 横在路上的巨蛇
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 话刚说到这里，匹诺曹突然停下，吓得一连后退了四步。他看见了什么？一条大得吓人的巨蛇，正横卧在路中央。蛇身碧绿，眼睛通红，尖尾巴还在冒烟，活像一根烟囱。匹诺曹怕极了。他远远退到安全的地方，坐在一堆石头上，打算等巨蛇办完自己的事，把路让出来。
        - id: ch02-b02
          speaker: narrator
          text: 一个钟头过去了，两个钟头过去了，三个钟头也过去了。巨蛇还是横在那里。隔着老远，匹诺曹照样看得见它那双火红的眼睛，也看得见蛇尾尖上升起的一股烟柱。最后，木偶硬是给自己壮了壮胆。他走到离巨蛇只有几步的地方，把声音放得又轻又讨好。
        - id: ch02-b03
          speaker: pinocchio
          text: 对不起，蛇先生。能请您往旁边挪一点儿吗？只要给我留条路，让我过去就行。
        - id: ch02-b04
          speaker: narrator
          text: 巨蛇纹丝不动。匹诺曹这番话，就像是说给墙听的。他只好再试一次，声音还是那么柔和。
        - id: ch02-b05
          speaker: pinocchio
          text: 蛇先生，我正要回家，爸爸还在那里等我。我已经好久没见到他了。您能不能行个方便，让我接着赶路？
    - id: ch03
      title: 巨蛇笑死了
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 匹诺曹等着答复，可巨蛇一点动静也没有。它刚才明明还精神十足，这会儿身子却不动了，几乎僵成了一根棍。它闭起眼睛，尾巴也不冒烟了。匹诺曹高兴地搓了搓手。
        - id: ch03-b02
          speaker: pinocchio
          text: 它真的死了吗？
          emotion: happy
        - id: ch03-b03
          speaker: narrator
          text: 木偶想从蛇身上跳过去，落到路的另一边。可他刚要起跳，巨蛇猛地竖起身子，简直像一根突然弹开的弹簧。匹诺曹吓得往后一缩，两只脚却绊到了一起，扑通一声摔在地上。这一跤摔得太不是地方了。他的脑袋扎进泥里，两条腿反倒翘到了半空，还在那儿拼命乱蹬。
        - id: ch03-b04
          speaker: narrator
          text: 巨蛇看见这个模样，笑得全身直抽。它笑啊，笑啊，最后竟把胸口的一根血管笑破了，当场送了命。这一次，它是真的死了。
    - id: ch04
      title: 葡萄园里的陷阱
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 匹诺曹重新拔腿飞奔，一心想在天黑前赶到仙女家。可是没跑多久，他就饿得再也受不住了。路旁正好有一块田，里面长着葡萄。他跳了进去，想摘几串麝香葡萄填肚子。唉，他真不该进去！
        - id: ch04-b02
          speaker: narrator
          text: 匹诺曹刚来到葡萄藤边，只听咔嚓一响，两条腿已经被两片锋利的铁夹死死咬住。疼痛让他一阵眩晕，眼前立刻飞舞起五颜六色的星星。
        - id: ch04-b03
          speaker: narrator
          text: 可怜的木偶中了捕兽夹。附近有几只大臭鼬，老是跑去祸害鸡舍，当地人设下这个夹子，本来正是要捉它们。
