audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm and story-rich
        timbre: clear and rounded
        pace: measured
        pitch: medium
    pinocchio:
      display_name: Pinocchio
      tts:
        delivery: impulsive and defiant
        timbre: bright and wooden
        pace: quick
        pitch: medium-high
  chapters:
    - id: ch01
      title: Pinocchio Starts Back to the Fairy's House
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Imagine how happy Pinocchio was when he found himself free. He did not even stop to catch his breath. He left town at once and hurried down the road to the Fairy's house.
        - id: ch01-b02
          speaker: narrator
          text: The rain had turned the road into a marsh, and Pinocchio sank into the mud up to his knees. Still, he would not give up. He longed to see his father and his little sister with the blue hair again. So he raced along like a greyhound, splashing mud all over himself from head to foot. As he ran, he spoke to himself.
        - id: ch01-b03
          speaker: pinocchio
          text: So many terrible things have happened to me, and I deserved every one of them. I'm stubborn and hotheaded. I always insist on doing things my own way. I never listen to people who care about me, even though they have a thousand times more sense than I do. But from now on, I'm going to change. I'll behave, and I'll do what I'm told. At last I understand that disobedient boys get nowhere and gain nothing. Has Papa waited for me? Will I find him at the Fairy's house? I haven't seen the poor man for so long. I can't wait to hug him and cover him with kisses! And will the Fairy forgive the way I treated her? She gave me so much kindness and loving care. If I'm alive now, it's because of her! Could there be any boy more ungrateful or more heartless than me?
        - id: ch01-b04
          speaker: narrator
          text: In the middle of saying this, Pinocchio stopped dead. Terrified, he took four steps backward.
        - id: ch01-b05
          speaker: narrator
          text: What had he seen? An enormous Serpent lay stretched across the road. It had green skin, red eyes, and a pointed tail that smoked like a chimney.
        - id: ch01-b06
          speaker: narrator
          text: Pinocchio was so frightened that he backed away to a safe distance. Then he sat on a pile of stones and waited for the Serpent to finish its business and clear the road.
        - id: ch01-b07
          speaker: narrator
          text: One hour passed. Then two. Then three. The Serpent did not move away. Even from where Pinocchio sat, he could see the fiery red glow of its eyes and the column of smoke rising from its tail.
        - id: ch01-b08
          speaker: narrator
          text: At last, Pinocchio tried to gather his courage. He crept to within a few steps of the Serpent and spoke in a small, gentle, coaxing voice.
        - id: ch01-b09
          speaker: pinocchio
          text: Excuse me, Sir Serpent. Would you please move just a little to one side, so I can get past?
          emotion: fearful
        - id: ch01-b10
          speaker: narrator
          text: He might as well have been talking to a wall. The Serpent did not stir.
        - id: ch01-b11
          speaker: pinocchio
          text: You see, Sir Serpent, I'm going home. My father is waiting for me, and I haven't seen him in such a long time. So please, will you let me go on my way?
          emotion: fearful
        - id: ch01-b12
          speaker: narrator
          text: Pinocchio waited for some kind of answer, but none came. In fact, the Serpent had been lively and full of life before, and now it went stiff and still. Its eyes closed, and its tail stopped smoking.
        - id: ch01-b13
          speaker: pinocchio
          text: Could it really be dead?
          emotion: happy
        - id: ch01-b14
          speaker: narrator
          text: Pinocchio rubbed his hands with delight. He decided to leap over the Serpent and land on the other side of the road. But just as he was about to jump, the Serpent suddenly sprang upright like a released spring. Pinocchio jerked backward in terror, tangled his feet, and fell.
        - id: ch01-b15
          speaker: narrator
          text: He landed so badly that his head sank into the mud while his legs stuck straight up in the air.
        - id: ch01-b16
          speaker: narrator
          text: The Serpent saw Pinocchio kicking wildly with his head buried in the mud. It went into convulsions of laughter and laughed so hard that a blood vessel burst in its chest. The Serpent died. This time, it really was dead.
        - id: ch01-b17
          speaker: narrator
          text: Pinocchio started running again, hoping to reach the Fairy's house before dark. Before long, though, he grew so terribly hungry that he could hardly stand it. He jumped into a field beside the road to pick some bunches of Muscatel grapes. Oh, if only he had never done it!
        - id: ch01-b18
          speaker: narrator
          text: He had barely reached the vines when—crack! Two sharp iron bars snapped around his legs. The pain made him so dizzy that stars of every color danced before his eyes.
        - id: ch01-b19
          speaker: narrator
          text: Poor Pinocchio had stepped into a trap. It had been set for the big polecats that were plaguing the neighborhood poultry yards.
