audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm and story-rich
        timbre: clear and rounded
        pace: measured
        pitch: medium
    pinocchio:
      display_name: Pinocchio
      tts:
        delivery: impulsive and defiant
        timbre: bright and wooden
        pace: quick
        pitch: medium-high
    candlewick:
      display_name: Candlewick
      tts:
        delivery: sly and carefree
        timbre: lean and youthful
        pace: lively
        pitch: medium-high
    coachman:
      display_name: Coachman
      tts:
        delivery: sugary and coaxing
        timbre: soft and oily
        pace: unhurried
        pitch: medium
    marmot:
      display_name: Marmot
      tts:
        delivery: earnest and sympathetic
        timbre: gentle and clear
        pace: measured
        pitch: medium-high
  chapters:
    - id: ch01
      title: The Donkey Fever
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: When Pinocchio woke up, he reached up and scratched his head. His fingers brushed against something that had never been there before. He felt again, and to his great surprise, he discovered that his ears had grown longer than his hand.
        - id: ch01-b02
          speaker: narrator
          text: Ever since he was made, the puppet's ears had been so tiny that no one could see them. Just imagine how he felt now. During the night, they had stretched until they looked like two brooms.
        - id: ch01-b03
          speaker: narrator
          text: He searched at once for a mirror. There wasn't one, so he filled the washbasin with water and leaned over it. The reflection showed him the last thing he wanted to see. On top of his head stood a magnificent pair of donkey's ears.
        - id: ch01-b04
          speaker: narrator
          text: Think of poor Pinocchio's sorrow, shame, and despair. He began to cry and roar, and he beat his head against the wall. None of it helped. The more he cried, the longer his ears grew. They grew and grew until their pointed ends were covered with hair.
        - id: ch01-b05
          speaker: narrator
          text: A beautiful little Marmot lived on the first floor. She heard his loud cries and came into the room. When she saw how miserable he was, she asked him what had happened.
        - id: ch01-b06
          speaker: marmot
          text: What's wrong, my dear neighbor?
        - id: ch01-b07
          speaker: pinocchio
          text: I'm sick, little Marmot. Very sick. And this illness scares me. Do you know how to take a pulse?
          emotion: fearful
        - id: ch01-b08
          speaker: marmot
          text: A little.
        - id: ch01-b09
          speaker: pinocchio
          text: Then feel mine and tell me if I have a fever.
        - id: ch01-b10
          speaker: narrator
          text: The Marmot lifted her right front paw and felt Pinocchio's pulse. Then she sighed.
        - id: ch01-b11
          speaker: marmot
          text: My friend, I'm sorry, but I have bad news for you.
          emotion: sad
        - id: ch01-b12
          speaker: pinocchio
          text: What is it?
        - id: ch01-b13
          speaker: marmot
          text: You have a terrible fever.
        - id: ch01-b14
          speaker: pinocchio
          text: What kind?
        - id: ch01-b15
          speaker: marmot
          text: Donkey fever.
        - id: ch01-b16
          speaker: narrator
          text: Pinocchio claimed he didn't know what that meant. In truth, he understood all too well.
        - id: ch01-b17
          speaker: marmot
          text: Then I'll explain. In two or three hours, you won't be a puppet anymore. You won't be a boy, either.
        - id: ch01-b18
          speaker: pinocchio
          text: Then what will I be?
          emotion: fearful
        - id: ch01-b19
          speaker: marmot
          text: You'll become a real little donkey, like the ones that pull carts and carry cabbages and lettuce to market.
        - id: ch01-b20
          speaker: pinocchio
          text: Oh, what will become of me? What will become of me?
          emotion: fearful
        - id: ch01-b21
          speaker: narrator
          text: He grabbed both ears and yanked at them furiously, as though they belonged to someone else.
        - id: ch01-b22
          speaker: marmot
          text: My dear boy, nothing can stop it now. This is your fate. Wisdom has decreed that lazy boys who come to hate books, school, and teachers, and who spend all their time on games and amusements, must sooner or later be changed into little donkeys. That is what is happening to you.
        - id: ch01-b23
          speaker: pinocchio
          text: Is that really true?
          emotion: sad
        - id: ch01-b24
          speaker: marmot
          text: It is only too true. And your tears can't help you now. You should have thought about what might happen before you ran away to play.
        - id: ch01-b25
          speaker: pinocchio
          text: But it wasn't my fault! Believe me, little Marmot. It was all Candlewick's fault!
        - id: ch01-b26
          speaker: marmot
          text: Who is Candlewick?
        - id: ch01-b27
          speaker: pinocchio
          text: One of my schoolmates. I wanted to go home and obey. I wanted to study. But Candlewick told me there was no reason to bother with school. He said I should go with them to the Land of Boobies, where nobody had to learn and everyone could have fun from morning till night.
        - id: ch01-b28
          speaker: marmot
          text: Then why did you listen to such a false friend and bad companion?
        - id: ch01-b29
          speaker: pinocchio
          text: Why did I listen? Because I'm a senseless puppet with no heart. If I'd had even the smallest bit of heart, I never would have left the good Fairy. She loved me like a mother, and she had done so much for me. If I had stayed, I wouldn't be a puppet now. I would have become a real boy, just like other boys. But if I find Candlewick, he'd better watch out. He'll hear exactly what I think of him!
          emotion: angry
    - id: ch02
      title: A Cap Pulled Low
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: Pinocchio turned toward the door. Then he remembered his donkey ears. He was too ashamed to let anyone see them, so he put on a big cotton cap and pulled it down over the tip of his nose.
        - id: ch02-b02
          speaker: narrator
          text: He went out and searched everywhere for Candlewick. He looked along the streets and across the squares. He searched the little theaters and every other place he could think of. He stopped everyone he met and asked whether they had seen Candlewick, but no one had.
        - id: ch02-b03
          speaker: narrator
          text: At last, Pinocchio went to Candlewick's house and knocked on the door.
        - id: ch02-b04
          speaker: candlewick
          text: Who's there?
        - id: ch02-b05
          speaker: pinocchio
          text: It's me!
        - id: ch02-b06
          speaker: candlewick
          text: Wait a minute. I'll let you in.
        - id: ch02-b07
          speaker: narrator
          text: Pinocchio waited outside. A full half hour passed before the door finally opened. When he stepped into the room, he could hardly believe what he saw. Candlewick was wearing a big cotton cap too, and it was pulled all the way down over his nose, exactly like Pinocchio's.
        - id: ch02-b08
          speaker: narrator
          text: The sight almost comforted Pinocchio. Could Candlewick have the same illness? Could he have donkey fever too? Pinocchio pretended not to notice the cap and smiled.
        - id: ch02-b09
          speaker: pinocchio
          text: How are you, my dear Candlewick?
        - id: ch02-b10
          speaker: candlewick
          text: Wonderful! I'm as happy as a mouse in a wheel of Parmesan.
        - id: ch02-b11
          speaker: pinocchio
          text: Do you really mean that?
        - id: ch02-b12
          speaker: candlewick
          text: Why would I lie to you?
        - id: ch02-b13
          speaker: pinocchio
          text: Then excuse me for asking, but why are you wearing a cotton cap over your ears?
        - id: ch02-b14
          speaker: candlewick
          text: The doctor told me to wear it because I hurt my knee. What about you? Why is your cap pulled down over your nose?
        - id: ch02-b15
          speaker: pinocchio
          text: The doctor prescribed mine because I scraped my foot.
        - id: ch02-b16
          speaker: candlewick
          text: Oh, poor Pinocchio!
        - id: ch02-b17
          speaker: pinocchio
          text: Oh, poor Candlewick!
        - id: ch02-b18
          speaker: narrator
          text: Neither one spoke for a long time. They only stood there, trading mocking looks.
    - id: ch03
      title: The Caps Come Off
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: At last, Pinocchio spoke softly to his friend.
        - id: ch03-b02
          speaker: pinocchio
          text: Candlewick, tell me something. Have you ever had trouble with your ears?
        - id: ch03-b03
          speaker: candlewick
          text: Never. Have you?
        - id: ch03-b04
          speaker: pinocchio
          text: Never before. But one of my ears started aching this morning.
        - id: ch03-b05
          speaker: candlewick
          text: Mine hurts too.
        - id: ch03-b06
          speaker: pinocchio
          text: Yours does? Which ear?
        - id: ch03-b07
          speaker: candlewick
          text: Both of them. What about yours?
        - id: ch03-b08
          speaker: pinocchio
          text: Both. Do you think we caught the same illness?
        - id: ch03-b09
          speaker: candlewick
          text: I'm afraid we did.
        - id: ch03-b10
          speaker: pinocchio
          text: Will you do me a favor, Candlewick?
        - id: ch03-b11
          speaker: candlewick
          text: Gladly. Anything you want.
        - id: ch03-b12
          speaker: pinocchio
          text: Let me see your ears.
        - id: ch03-b13
          speaker: candlewick
          text: All right, but I want to see yours first.
        - id: ch03-b14
          speaker: pinocchio
          text: No, you go first.
        - id: ch03-b15
          speaker: candlewick
          text: No, my dear friend. You first, then me.
        - id: ch03-b16
          speaker: pinocchio
          text: Then let's make a deal like good friends.
        - id: ch03-b17
          speaker: candlewick
          text: Let's hear it.
        - id: ch03-b18
          speaker: pinocchio
          text: We'll take our caps off at exactly the same time. Do you agree?
        - id: ch03-b19
          speaker: candlewick
          text: I agree.
        - id: ch03-b20
          speaker: pinocchio
          text: Get ready. One, two, three!
        - id: ch03-b21
          speaker: narrator
          text: On three, both boys tore off their caps and tossed them into the air.
        - id: ch03-b22
          speaker: narrator
          text: What happened next would be hard to believe if it weren't true. Pinocchio and Candlewick stared at each other and saw that the very same misfortune had struck them both. Yet neither boy acted ashamed or miserable. They poked and pinched each other's long, awkward ears. They jumped about the room and made one ridiculous face after another. At last, they both burst out laughing.
        - id: ch03-b23
          speaker: narrator
          text: They laughed and laughed and laughed. Soon they were laughing so hard that each had to hold on to the other. Then, right in the middle of all that merriment, Candlewick suddenly stopped. He staggered across the room, and all the color drained from his face.
        - id: ch03-b24
          speaker: candlewick
          text: Help me, Pinocchio! Help!
          emotion: fearful
        - id: ch03-b25
          speaker: pinocchio
          text: What's happening to you?
        - id: ch03-b26
          speaker: candlewick
          text: I can't stand up anymore!
          emotion: fearful
        - id: ch03-b27
          speaker: pinocchio
          text: Neither can I!
          emotion: fearful
        - id: ch03-b28
          speaker: narrator
          text: Pinocchio began to cry as he swayed on his feet.
    - id: ch04
      title: Two Little Donkeys
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: While the boys were still talking, their bodies doubled over. They dropped onto their hands and feet and began running around the room on all fours. As they ran, their hands changed shape and hardened into hoofs. Their faces pushed forward and lengthened into muzzles. Then a coat of light gray hair, sprinkled with black, spread across their backs.
        - id: ch04-b02
          speaker: narrator
          text: Do you know the worst moment for those two wretched boys? The most humiliating moment of all came when tails began to grow behind them. That was more than they could bear. Shame and sorrow overcame them, and they wept and wailed over their fate.
        - id: ch04-b03
          speaker: narrator
          text: If only they had been wiser. But now, when they tried to sigh and cry, no human sounds came out. They could only bray like donkeys.
        - id: ch04-b04
          speakers: [pinocchio, candlewick]
          ensemble: duo
          text: Hee-haw! Hee-haw!
          emotion: sad
        - id: ch04-b05
          speaker: narrator
          text: In the middle of all this, someone knocked at the door. A voice called from outside.
        - id: ch04-b06
          speaker: coachman
          text: Open the door! It's the little man, the coachman who brought you here. Open it now, or things will go badly for you!
