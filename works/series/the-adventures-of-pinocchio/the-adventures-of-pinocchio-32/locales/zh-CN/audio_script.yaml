audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖从容，带一点一本正经的幽默
        timbre: 清晰醇厚
        pace: 舒缓，遇到惊奇处略微加快
        pitch: 中
    pinocchio:
      display_name: 匹诺曹
      tts:
        delivery: 任性直率，嘴硬而孩子气，危急时急促慌张
        timbre: 清亮，带木偶般的脆响
        pace: 偏快，争辩时更急
        pitch: 中高
    candlewick:
      display_name: 灯芯
      tts:
        delivery: 懒散顽皮，怂恿朋友时又热切又狡黠
        timbre: 单薄明亮的少年声音
        pace: 轻快，得意时稍慢
        pitch: 中高
    coachman:
      display_name: 车夫
      tts:
        delivery: 笑眯眯地哄人，甜腻亲热中藏着冷酷
        timbre: 柔软油滑的成年男声
        pace: 从容
        pitch: 中高
    marmot:
      display_name: 小土拨鼠
      tts:
        delivery: 关切认真，说明病情时温和而郑重
        timbre: 柔和清亮的成年女声
        pace: 平稳
        pitch: 中高
  chapters:
    - id: ch01
      title: 可怕的驴子热
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            匹诺曹醒来以后，伸手挠了挠头。可这一挠，他猛然发现，自己的耳朵竟长了一大截，足足超过一拃。这个木偶从出生起，耳朵一直小得肉眼都看不见。如今一夜过去，两只耳朵却长得像两把扫帚。你们想想，他会是什么滋味。
        - id: ch01-b02
          speaker: narrator
          text: >-
            他赶紧去找镜子，想看看自己究竟成了什么样。镜子没找到，他只好往盥洗架的脸盆里装满水，再朝水面望去。这一望，他看见了这辈子最不愿看见的东西。自己的脑袋两边，堂堂正正竖着一双漂亮极了的驴耳朵。
        - id: ch01-b03
          speaker: narrator
          text: >-
            可怜的匹诺曹又伤心，又羞耻，简直绝望透了。他放声大哭，又扯着嗓子喊，还拿脑袋去撞墙。可是哭得越凶，耳朵长得越长。它们不停地长啊长，最后连耳朵尖上都冒出了毛。
        - id: ch01-b04
          speaker: narrator
          text: >-
            一楼住着一只漂亮的小土拨鼠。她听见这阵哭喊，跑进房来，一看木偶如此难过，便关切地问他。
        - id: ch01-b05
          speaker: marmot
          text: >-
            亲爱的邻居，你出了什么事？
        - id: ch01-b06
          speaker: pinocchio
          text: >-
            我病了，小土拨鼠，病得很重。这病真把我吓坏了。你会不会摸脉？
          emotion: fearful
        - id: ch01-b07
          speaker: marmot
          text: >-
            我会一点儿。
        - id: ch01-b08
          speaker: pinocchio
          text: >-
            那你快摸摸，我是不是发烧了。
        - id: ch01-b09
          speaker: narrator
          text: >-
            小土拨鼠抬起右前爪，摸了摸他的脉搏，随后叹了口气。
        - id: ch01-b10
          speaker: marmot
          text: >-
            朋友，我真不愿告诉你这个坏消息，可你发了一场很厉害的烧。
          emotion: sad
        - id: ch01-b11
          speaker: pinocchio
          text: >-
            是什么烧？
        - id: ch01-b12
          speaker: marmot
          text: >-
            你发的是驴子热。
        - id: ch01-b13
          speaker: pinocchio
          text: >-
            我可不明白什么叫驴子热。
        - id: ch01-b14
          speaker: narrator
          text: >-
            木偶嘴上说不明白，其实心里早就明白了。
        - id: ch01-b15
          speaker: marmot
          text: >-
            那我说给你听。再过两三个钟头，你就不再是木偶，也不再是男孩子了。
        - id: ch01-b16
          speaker: pinocchio
          text: >-
            那我会变成什么？
        - id: ch01-b17
          speaker: marmot
          text: >-
            你会变成一头真正的小驴，跟那些拉车、驮着卷心菜和生菜去市场的驴完全一样。
        - id: ch01-b18
          speaker: narrator
          text: >-
            匹诺曹一听就叫苦不迭。他用两只手抓住耳朵，发疯似的又扯又拽，好像那不是长在自己头上，而是别人的耳朵。
        - id: ch01-b19
          speaker: pinocchio
          text: >-
            我怎么这么倒霉！我怎么这么倒霉啊！
          emotion: sad
        - id: ch01-b20
          speaker: marmot
          text: >-
            亲爱的孩子，你已经没有办法了。这是命里注定的。智慧的法令早就写得明明白白。凡是懒惰的孩子，凡是讨厌课本、学校和老师，把日子全花在消遣、游戏和玩乐上的孩子，迟早都会变成一头头小驴。
        - id: ch01-b21
          speaker: pinocchio
          text: >-
            这是真的吗？
          emotion: sad
        - id: ch01-b22
          speaker: marmot
          text: >-
            千真万确。现在哭也没用了，你早就该想到会有今天。
        - id: ch01-b23
          speaker: pinocchio
          text: >-
            可这不是我的错。你相信我，都是灯芯害的！
        - id: ch01-b24
          speaker: marmot
          text: >-
            灯芯是谁？
        - id: ch01-b25
          speaker: pinocchio
          text: >-
            他是我的同学。本来我想回家，想听话，也想好好读书。可灯芯说，读书干吗，去学校又干吗，不如跟他们到玩儿国去。那里谁也不用学习，可以从早玩到晚，天天都快活。
        - id: ch01-b26
          speaker: marmot
          text: >-
            那你为什么偏要听这个假朋友、坏伙伴的话？
        - id: ch01-b27
          speaker: pinocchio
          text: >-
            因为我是个没头脑、没心肝的木偶！我要是有一点点心，就不会离开那位善良的仙女。她像妈妈一样爱我，还为我做了那么多事。那样的话，我现在早就和别的孩子一样，变成真正的男孩子了。要是让我碰见灯芯，他就等着吧！我非把心里话全说给他听不可！
    - id: ch02
      title: 两顶棉布帽
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            匹诺曹转身要走。到了门口，他才想起自己的驴耳朵。顶着这副模样到外面见人，他实在害臊。你们猜他想了什么办法？他找来一顶棉布大帽子扣在头上，一直拉到快遮住鼻尖。
        - id: ch02-b02
          speaker: narrator
          text: >-
            他出了门，到处寻找灯芯。大街上、广场上、小戏院里，只要有可能找到人的地方，他全都找遍了，可哪里都没有灯芯的影子。他还向每一个遇见的人打听，也没人见过那个男孩。
        - id: ch02-b03
          speaker: narrator
          text: >-
            最后，他来到灯芯家门前，抬手敲门。
        - id: ch02-b04
          speaker: candlewick
          text: >-
            谁呀？
        - id: ch02-b05
          speaker: pinocchio
          text: >-
            是我！
        - id: ch02-b06
          speaker: candlewick
          text: >-
            等一等，我这就开门。
        - id: ch02-b07
          speaker: narrator
          text: >-
            可这一等，足足等了半个钟头。门终于开了。匹诺曹走进屋里，看见朋友灯芯头上也扣着一顶棉布大帽子，帽檐同样一直盖到鼻尖。你们想想，他当时会是什么心情。
        - id: ch02-b08
          speaker: narrator
          text: >-
            看到那顶帽子，匹诺曹心里几乎轻松了一点。他暗暗猜想，难道灯芯得了同一种病，也在发驴子热？他装作什么都没发现，笑着开口。
        - id: ch02-b09
          speaker: pinocchio
          text: >-
            亲爱的灯芯，你过得怎么样？
        - id: ch02-b10
          speaker: candlewick
          text: >-
            好得不得了，像掉进帕尔马干酪里的老鼠一样快活。
        - id: ch02-b11
          speaker: pinocchio
          text: >-
            你说的是真的？
        - id: ch02-b12
          speaker: candlewick
          text: >-
            我骗你干什么？
        - id: ch02-b13
          speaker: pinocchio
          text: >-
            那我问一句，你干吗戴着这顶棉布帽，把耳朵遮得严严实实？
        - id: ch02-b14
          speaker: candlewick
          text: >-
            我膝盖受了伤，大夫叫我戴的。可你呢，亲爱的木偶？你的帽子怎么也拉到了鼻尖？
        - id: ch02-b15
          speaker: pinocchio
          text: >-
            我擦伤了脚，大夫给我的药方就是戴帽子。
        - id: ch02-b16
          speaker: candlewick
          text: >-
            哎呀，可怜的匹诺曹！
        - id: ch02-b17
          speaker: pinocchio
          text: >-
            哎呀，可怜的灯芯！
        - id: ch02-b18
          speaker: narrator
          text: >-
            说完，两个人沉默了很久，只是你看我，我看你，眼神里都带着嘲弄。最后，匹诺曹压低声音，先开了口。
        - id: ch02-b19
          speaker: pinocchio
          text: >-
            灯芯，我实在好奇。你以前得过耳朵上的病吗？
        - id: ch02-b20
          speaker: candlewick
          text: >-
            从来没有。你呢？
        - id: ch02-b21
          speaker: pinocchio
          text: >-
            我也没有。可从今天早晨起，我有一只耳朵一直疼。
        - id: ch02-b22
          speaker: candlewick
          text: >-
            我的耳朵也疼。
        - id: ch02-b23
          speaker: pinocchio
          text: >-
            你的哪一只疼？
        - id: ch02-b24
          speaker: candlewick
          text: >-
            两只都疼。你呢？
        - id: ch02-b25
          speaker: pinocchio
          text: >-
            我也是两只。难道咱们得的是同一种病？
        - id: ch02-b26
          speaker: candlewick
          text: >-
            恐怕就是。
        - id: ch02-b27
          speaker: pinocchio
          text: >-
            那你帮我一个忙，好不好？让我看看你的耳朵。
        - id: ch02-b28
          speaker: candlewick
          text: >-
            当然行，我一百个愿意。不过，亲爱的匹诺曹，我得先看看你的。
        - id: ch02-b29
          speaker: pinocchio
          text: >-
            不行，你得先来。
        - id: ch02-b30
          speaker: candlewick
          text: >-
            不，先看你的，然后再看我的。
        - id: ch02-b31
          speaker: pinocchio
          text: >-
            好吧，咱们是好朋友，就想个公平的办法。
        - id: ch02-b32
          speaker: candlewick
          text: >-
            什么办法？
        - id: ch02-b33
          speaker: pinocchio
          text: >-
            咱们一起摘帽子。你同不同意？
        - id: ch02-b34
          speaker: candlewick
          text: >-
            同意。
        - id: ch02-b35
          speaker: pinocchio
          text: >-
            那就听好了！
    - id: ch03
      title: 帽子飞上了天
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            匹诺曹开始大声数数。
        - id: ch03-b02
          speaker: pinocchio
          text: >-
            一，二，三！
        - id: ch03-b03
          speaker: narrator
          text: >-
            数到三，两个孩子同时摘下帽子，把它们抛向空中。接下来发生的事，要不是真有其事，谁也不会相信。
        - id: ch03-b04
          speaker: narrator
          text: >-
            匹诺曹和灯芯发现，原来两个人遭遇了同样的不幸。可他们非但没有羞愧，也没有难过，反倒揪起对方那双难看的长耳朵，又蹦又扭，做出数不清的怪模样，最后一起哈哈大笑。
        - id: ch03-b05
          speaker: narrator
          text: >-
            他们笑啊，笑啊，笑得越来越厉害，怎么也停不下来。两个人只好各自伸出双手，紧紧捂住自己的肚子。就在他们闹得最起劲的时候，灯芯突然收住笑声，身体晃了几下，脸色也变了。
        - id: ch03-b06
          speaker: candlewick
          text: >-
            快救我，匹诺曹，快救救我！
          emotion: fearful
        - id: ch03-b07
          speaker: pinocchio
          text: >-
            你怎么了？
        - id: ch03-b08
          speaker: candlewick
          text: >-
            糟了，我已经站不直了。
          emotion: fearful
        - id: ch03-b09
          speaker: narrator
          text: >-
            匹诺曹也摇摇晃晃，哭了起来。
        - id: ch03-b10
          speaker: pinocchio
          text: >-
            我也一样，我也站不住了！
          emotion: fearful
    - id: ch04
      title: 变成驴子
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            说话间，两个人一起弯下身子，手脚着地，绕着房间一圈圈跑起来。跑着跑着，他们的双手变成了蹄子，脸越拉越长，成了驴子的嘴脸。背上也渐渐冒出一层浅灰色的毛，上面还散着一块块黑色斑点。
        - id: ch04-b02
          speaker: narrator
          text: >-
            可你们知道，这两个可怜的孩子什么时候最难受吗？最难熬、最叫他们受辱的一刻，是尾巴从身后长出来的时候。他们又羞又悲，再也忍不住，只能哭泣，哀叹自己的命运。
        - id: ch04-b03
          speaker: narrator
          text: >-
            唉，他们当初要是聪明一点就好了！可到了现在，他们连叹气和哭喊都做不到。两个人张开嘴，只能像驴子那样放声嘶鸣。他们一齐扯着嗓子，叫出同一个声音：“咿——啊！”
        - id: ch04-b04
          speaker: narrator
          text: >-
            正在这时，门外响起了敲门声，接着传来一个人的声音。
        - id: ch04-b05
          speaker: coachman
          text: >-
            开门！我是那个小个子，就是把你们带到这个国家来的车夫。马上把门打开，不然有你们好受的！
          emotion: angry
