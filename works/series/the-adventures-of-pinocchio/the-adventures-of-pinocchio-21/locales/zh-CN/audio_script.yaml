audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖从容，带一点一本正经的幽默
        timbre: 清晰醇厚
        pace: 舒缓，遇到惊奇处略微加快
        pitch: 中
    pinocchio:
      display_name: 匹诺曹
      tts:
        delivery: 任性直率，嘴硬而孩子气，发怒时冲动急躁
        timbre: 清亮，带木偶般的脆响
        pace: 偏快，争辩时更急
        pitch: 中高
    firefly:
      display_name: 萤火虫
      tts:
        delivery: 温和清醒，劝诫时亲切而认真
        timbre: 轻柔明亮
        pace: 从容
        pitch: 中高
    farmer:
      display_name: 农夫
      tts:
        delivery: 粗声直气，恼怒时严厉强硬
        timbre: 低沉粗粝
        pace: 稍慢，斥责时干脆有力
        pitch: 低
  chapters:
    - id: ch01
      title: 黑夜里的萤火虫
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 匹诺曹又是哭，又是喊，可不管流多少眼泪、发出多少哀叫，都没有用。四周看不见一所房子，路上也没有半个人经过。天终于黑了。
        - id: ch01-b02
          speaker: narrator
          text: 捕兽夹咬着他的腿，疼得厉害。田野里黑沉沉的，他又孤零零一个人，越想越害怕，眼看就要昏过去。就在这时，一只萤火虫从他头顶轻轻飞过。匹诺曹赶紧叫住它。
        - id: ch01-b03
          speaker: pinocchio
          text: 好心的小萤火虫，求你可怜可怜我，把我从这个铁夹里救出去吧！
          emotion: fearful
        - id: ch01-b04
          speaker: narrator
          text: 萤火虫停了下来，同情地看着他。
        - id: ch01-b05
          speaker: firefly
          text: 可怜的孩子，你的腿怎么会被这么尖的铁夹夹住呢？
        - id: ch01-b06
          speaker: pinocchio
          text: 我跑进田里，只是想摘两串麝香葡萄。
        - id: ch01-b07
          speaker: firefly
          text: 那葡萄是你的吗？
        - id: ch01-b08
          speaker: pinocchio
          text: 那些葡萄不是我的。
        - id: ch01-b09
          speaker: firefly
          text: 那是谁教你拿别人东西的？
        - id: ch01-b10
          speaker: pinocchio
          text: 我饿得实在受不了了。
        - id: ch01-b11
          speaker: firefly
          text: 孩子，就算肚子再饿，也不能拿不属于自己的东西。
        - id: ch01-b12
          speaker: pinocchio
          text: 你说得对，真的对！我以后再也不这么做了。
          emotion: sad
    - id: ch02
      title: 田主人来了
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 忽然，一阵很轻的脚步声打断了他们。田主人正踮着脚走来，想看看夹子有没有捉到那些夜里偷吃他家鸡的大臭鼬。他从外衣底下拿出提灯，往地上一照，这才发现夹住的不是臭鼬，而是一个孩子。他吃惊极了。
        - id: ch02-b02
          speaker: farmer
          text: 啊哈，小贼！原来我家的鸡都是你偷的！
          emotion: angry
        - id: ch02-b03
          speaker: pinocchio
          text: 不是我，真的不是！我只进田里摘了两串葡萄！
          emotion: fearful
        - id: ch02-b04
          speaker: farmer
          text: 能偷葡萄，当然也能偷鸡。等着瞧吧，我要给你一个教训，让你好些日子都忘不了。
          emotion: angry
        - id: ch02-b05
          speaker: narrator
          text: 农夫打开夹子，揪住匹诺曹的衣领，像拎小羊羔一样把他带回了家。走进屋前的院子，他粗暴地把木偶摔到地上，又用一只脚踩住他的脖子。
        - id: ch02-b06
          speaker: farmer
          text: 已经很晚了，我得睡觉。咱们明天再算账。替我守夜的狗今天死了，你现在就顶它的缺，给我当看家狗。
    - id: ch03
      title: 戴上狗项圈
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 农夫找来一个钉满黄铜圆钉的大项圈，紧紧扣在匹诺曹脖子上，让他的脑袋怎么也挣不出去。项圈连着一条沉重的铁链，另一头牢牢拴在墙上。
        - id: ch03-b02
          speaker: farmer
          text: 今晚要是下雨，你就到狗窝里躺着。那里面还有稻草，我那条可怜的狗在上面睡了四年。要是强盗来了，记得把耳朵竖起来，大声叫。
        - id: ch03-b03
          speaker: narrator
          text: 说完这些话，农夫走进屋里，关上门，又把门链挂好。
    - id: ch04
      title: 我活该
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 可怜的匹诺曹还躺在地上。寒冷、饥饿和恐惧折磨着他，他只剩下半口气了。他隔一会儿就恼火地扯扯勒住喉咙的项圈，哭着责怪自己。
        - id: ch04-b02
          speaker: pinocchio
          text: 我活该！没错，我就是活该！我偏要到处乱跑，做个没出息的坏家伙，还总听那些坏伙伴的话，难怪灾祸一次又一次找上我。要是我也像别的孩子那样乖乖听话，要是我一直留在家里陪着可怜的爸爸，现在就不会一个人困在田野里，更不会被迫给农夫看家。
          emotion: sad
        - id: ch04-b03
          speaker: pinocchio
          text: 唉，要是能重新活一次该多好！可现在已经太迟了，我只能忍下去。
          emotion: sad
        - id: ch04-b04
          speaker: narrator
          text: 这些话都是从匹诺曹心底涌出来的。说完以后，他心里轻松了一点，便钻进狗窝，睡着了。
