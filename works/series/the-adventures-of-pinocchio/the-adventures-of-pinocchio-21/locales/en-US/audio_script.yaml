audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm and story-rich
        timbre: clear and rounded
        pace: measured
        pitch: medium
    pinocchio:
      display_name: Pinocchio
      tts:
        delivery: impulsive and defiant
        timbre: bright and wooden
        pace: quick
        pitch: medium-high
    firefly:
      display_name: Firefly
      tts:
        delivery: gentle and quietly instructive
        timbre: light and luminous
        pace: unhurried
        pitch: high
    peasant:
      display_name: Peasant
      tts:
        delivery: stern and rough-spoken
        timbre: coarse and earthy
        pace: deliberate
        pitch: low
  chapters:
    - id: ch01
      title: Pinocchio Acts as Watch-Dog
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Pinocchio cried and screamed, but his tears and groans did no good at all. There was not a house anywhere in sight, and not one living soul came along the road. He stayed trapped there until night finally fell.
        - id: ch01-b02
          speaker: narrator
          text: The sharp trap kept cutting into his legs. On top of that, he was alone in the dark, out in the middle of the fields. Between the pain and his fear, Pinocchio was just about to faint. Then he saw a Firefly fluttering over his head and called out to it.
        - id: ch01-b03
          speaker: pinocchio
          text: Oh, little Firefly, please have pity on me! Get me out of this awful trap!
        - id: ch01-b04
          speaker: narrator
          text: The Firefly stopped and looked down at him with compassion.
        - id: ch01-b05
          speaker: firefly
          text: You poor boy. But how did those sharp iron jaws catch your legs?
        - id: ch01-b06
          speaker: pinocchio
          text: I came into the field to pick two bunches of Muscatel grapes, and...
        - id: ch01-b07
          speaker: firefly
          text: Did those grapes belong to you?
        - id: ch01-b08
          speaker: pinocchio
          text: No.
        - id: ch01-b09
          speaker: firefly
          text: Then who taught you to take things that belong to somebody else?
        - id: ch01-b10
          speaker: pinocchio
          text: I was so hungry.
        - id: ch01-b11
          speaker: firefly
          text: Being hungry is no excuse for taking what isn't yours, my boy.
        - id: ch01-b12
          speaker: narrator
          text: Pinocchio began to cry again.
        - id: ch01-b13
          speaker: pinocchio
          text: You're right. You're right! I'll never do it again!
          emotion: sad
        - id: ch01-b14
          speaker: narrator
          text: Just then, a faint sound of approaching footsteps cut their conversation short. The owner of the field was coming toward the trap on tiptoe. He wanted to see whether he had caught one of the polecats that came during the night to eat his chickens.
        - id: ch01-b15
          speaker: narrator
          text: The man pulled a lantern from beneath his coat. When its light showed him a boy instead of a polecat, he stared in astonishment.
        - id: ch01-b16
          speaker: peasant
          text: Ah, you little thief! So you're the one stealing my chickens!
          emotion: angry
        - id: ch01-b17
          speaker: pinocchio
          text: No, I'm not! I swear I'm not! I only came into the field for two bunches of grapes!
          emotion: fearful
        - id: ch01-b18
          speaker: peasant
          text: If you'll steal grapes, you'll steal chickens too. I'll teach you a lesson you won't forget anytime soon.
          emotion: angry
        - id: ch01-b19
          speaker: narrator
          text: The peasant opened the trap, grabbed Pinocchio by the collar, and carried him home like a young lamb. In the yard, he threw the puppet roughly to the ground and planted a foot on his neck.
        - id: ch01-b20
          speaker: peasant
          text: It's late, and I want to go to bed. We'll settle this tomorrow. My watchdog died today, so you'll take his place right now. From now on, you're guarding my house.
        - id: ch01-b21
          speaker: narrator
          text: He fastened a huge collar around Pinocchio's throat. It was covered with brass knobs and strapped on so tightly that Pinocchio could not pull his head free. A heavy chain ran from the collar to the wall.
        - id: ch01-b22
          speaker: peasant
          text: If it rains tonight, you can sleep in the kennel. The straw my poor dog slept on for four years is still inside. And if any robbers come, keep your ears up and bark.
        - id: ch01-b23
          speaker: narrator
          text: With that last order, the peasant went indoors, shut the door, and put up the chain.
        - id: ch01-b24
          speaker: narrator
          text: Poor Pinocchio lay on the ground, almost dead from cold, hunger, and fear. Every so often, he angrily tugged at the collar squeezing his throat. Through his tears, he spoke to himself.
        - id: ch01-b25
          speaker: pinocchio
          text: This is exactly what I deserve! I was determined to run wild and be good for nothing. I wouldn't listen to anyone except bad companions, and that's why one disaster after another keeps finding me. If I'd behaved like so many other good boys, if I'd stayed home with my poor papa, I wouldn't be out here in the middle of the fields, chained up as a peasant's watchdog. Oh, if only I could be born again and start over! But it's too late now. I'll just have to be patient.
          emotion: sad
        - id: ch01-b26
          speaker: narrator
          text: That little outburst came straight from his heart, and he felt better after saying it. Then he crawled into the doghouse and fell asleep.
