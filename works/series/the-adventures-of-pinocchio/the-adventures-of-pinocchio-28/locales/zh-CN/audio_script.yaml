audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖从容，带一点一本正经的幽默
        timbre: 清晰醇厚
        pace: 舒缓，遇到惊奇处略微加快
        pitch: 中
    pinocchio:
      display_name: 匹诺曹
      tts:
        delivery: 任性直率，嘴硬而孩子气，危急时急促慌张
        timbre: 清亮，带木偶般的脆响
        pace: 偏快，争辩时更急
        pitch: 中高
    alidoro:
      display_name: 阿利多罗
      tts:
        delivery: 忠厚直率，遇险时惊慌，感激时诚恳
        timbre: 粗厚有力，带大型犬的低沉气息
        pace: 中等，慌乱时急促
        pitch: 中低
    green_fisherman:
      display_name: 绿渔夫
      tts:
        delivery: 怪诞贪吃，自鸣得意，说残酷的话也若无其事
        timbre: 粗哑黏滞
        pace: 偏慢
        pitch: 低
  chapters:
    - id: ch01
      title: 海里的救命之恩
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 这场拼命的追逐，到了最可怕的一刻。匹诺曹以为自己逃不掉了。阿利多罗跑得太快，眼看就要扑到他身上。
        - id: ch01-b02
          speaker: narrator
          text: 木偶听见獒犬就在背后呼哧喘气。中间连一巴掌宽都不到，狗嘴里喷出的热气，他都能感觉到。
        - id: ch01-b03
          speaker: narrator
          text: 幸好海岸已经到了，海水就在几步之外。匹诺曹一踩上沙滩，立刻纵身一跃。那一下跳得真漂亮，连青蛙也未必比得过。他扑通一声扎进了海里。阿利多罗也想停住脚，可它一路狂奔，哪里还刹得住。
        - id: ch01-b04
          speaker: narrator
          text: 阿利多罗想停下，可狂奔的冲势收不住，它也栽进了水里。这条可怜的狗不会游泳，只会乱划爪子。它越挣扎，脑袋沉得越深，身子直往水底坠。
        - id: ch01-b05
          speaker: narrator
          text: 它好不容易冒出水面，两眼吓得乱转，连声大叫。
        - id: ch01-b06
          speaker: alidoro
          text: 我要淹死了！我要淹死了！
          emotion: fearful
        - id: ch01-b07
          speaker: narrator
          text: 匹诺曹已经游到远处，知道自己安全了，便冲它喊了一句。
        - id: ch01-b08
          speaker: pinocchio
          text: 那你就淹死吧！
          emotion: angry
        - id: ch01-b09
          speaker: alidoro
          text: 匹诺曹，求你救救我！别让我死！
          emotion: fearful
        - id: ch01-b10
          speaker: narrator
          text: 这声绝望的哀求让木偶心软了。说到底，他原本就有一副好心肠。他转过身来问狗。
        - id: ch01-b11
          speaker: pinocchio
          text: 我要是救你，你得答应我，以后再也不找我的麻烦，也不追我。你能答应吗？
        - id: ch01-b12
          speaker: alidoro
          text: 我答应，我答应！求你快点儿，再过半分钟，我就没命了！
          emotion: fearful
        - id: ch01-b13
          speaker: narrator
          text: 匹诺曹先是犹豫了一下。可他又想起，爸爸常常告诉他，做过的好事绝不会白费。于是他掉头游到阿利多罗身边，双手紧紧抓住狗尾巴，一路把它拖回岸边，让它安安全全躺在干沙上。
        - id: ch01-b14
          speaker: narrator
          text: 阿利多罗灌了一肚子海水，鼓得像个大气球，连站都站不起来。匹诺曹还是不敢太相信它，又跳回海里。游出一段，他才向这个刚救下的朋友告别。
        - id: ch01-b15
          speaker: pinocchio
          text: 再见，阿利多罗！祝你一路顺风，替我向你家里人问好。
        - id: ch01-b16
          speaker: alidoro
          text: 再见，匹诺曹。谢谢你救我，真是千恩万谢。你帮了我这么大的忙，我不会忘记。世上的事有来有往，以后要是有机会，我一定报答你。
    - id: ch02
      title: 落进渔网
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 匹诺曹贴着海岸继续游。过了一阵，他觉得这里总算安全了。礁石中间有个洞穴，一团烟正从里面往上冒。
        - id: ch02-b02
          speaker: pinocchio
          text: 洞里一定生着火，正好让我烤干身子，暖和暖和。往后怎么办？到时候再说吧。
        - id: ch02-b03
          speaker: narrator
          text: 他拿定主意，游向礁石。可刚要往上爬，他就觉得水底有个东西在动。那东西越升越高，托着他离开水面，一直把他举到了半空。匹诺曹赶紧想逃，可哪里还来得及。
        - id: ch02-b04
          speaker: narrator
          text: 匹诺曹这才发现，自己困进了一张大网。身边挤满各种鱼，大的小的，什么模样都有。它们噼啪乱拍，拼命挣扎，个个都像走投无路了。
        - id: ch02-b05
          speaker: narrator
          text: 一个渔夫从洞里走出来。他难看得吓人，简直就是海怪。头上长着浓密的绿草，皮肤和眼睛全是绿的，垂到地面的长胡子也是绿的。他活像一只用后腿站着的巨型蜥蜴。
        - id: ch02-b06
          speaker: narrator
          text: 渔夫把大网拖出海面，满意得不得了。
        - id: ch02-b07
          speaker: green_fisherman
          text: 谢天谢地！今天又能痛痛快快吃一顿好鱼了！
          emotion: happy
        - id: ch02-b08
          speaker: pinocchio
          text: 幸好我不是鱼！
        - id: ch02-b09
          speaker: narrator
          text: 匹诺曹想到这里，又有了几分胆量。整整一网鱼被拖进了洞里。里面又黑又呛，中央架着一口装满油的大煎锅。锅里的油滋滋地翻滚，还散出一股浓重的蘑菇味，熏得人几乎喘不过气来。
        - id: ch02-b10
          speaker: green_fisherman
          text: 来看看吧，今天都捞上了什么鱼！
        - id: ch02-b11
          speaker: narrator
          text: 绿渔夫把手伸进网里。那只手大得离谱，跟他的身子一点儿也不相称，简直像面包师傅用的木铲。他一把抓出许多鱼，先翻来覆去看了又看，再得意地凑近鼻子闻个够，最后把鱼扔进一口没有水的锅里。
        - id: ch02-b12
          speaker: narrator
          text: 他一把又一把地抓，馋得直流口水，嘴里还咯咯笑着数起来。
        - id: ch02-b13
          speaker: green_fisherman
          text: 多好的鳕鱼！沙丁鱼也鲜美极了！鳎鱼真香，螃蟹也棒。再瞧瞧这些惹人爱的小鳀鱼！
    - id: ch03
      title: 一条木偶鱼
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 网里只剩下匹诺曹了。渔夫一把将他抓出来，惊讶地瞪圆了绿色的大眼睛，神情里甚至还有点害怕。
        - id: ch03-b02
          speaker: green_fisherman
          text: 这是什么鱼？我可不记得吃过这样的鱼。
          emotion: surprised
        - id: ch03-b03
          speaker: narrator
          text: 他又把匹诺曹举到眼前，左看右看，从头一直看到脚，把木偶全身仔仔细细检查了一遍，终于下了结论。
        - id: ch03-b04
          speaker: green_fisherman
          text: 我明白了，这准是一只大螯虾。
        - id: ch03-b05
          speaker: narrator
          text: 匹诺曹被当成大螯虾，觉得受了天大的侮辱，气冲冲地嚷起来。
        - id: ch03-b06
          speaker: pinocchio
          text: 什么大螯虾！你怎么能把我当成大螯虾？哪有这样对待人的！我明明是个木偶。
          emotion: angry
        - id: ch03-b07
          speaker: green_fisherman
          text: 木偶？老实说，这种鱼我还是头一回见。那就更好了，我吃起来一定更加开心！
        - id: ch03-b08
          speaker: pinocchio
          text: 你要吃我？我不是鱼！你听不出来吗？我跟你一样，会说话，也会讲道理。
        - id: ch03-b09
          speaker: green_fisherman
          text: 这倒是真的。既然你这条鱼有本事像我一样说话讲理，我就该给你特别的优待。
        - id: ch03-b10
          speaker: pinocchio
          text: 什么优待？
        - id: ch03-b11
          speaker: green_fisherman
          text: 为了表示我很看重你，我让你自己挑。你想下油锅炸，还是想用番茄酱炖？
        - id: ch03-b12
          speaker: pinocchio
          text: 既然能挑，那我想请你放了我，让我回家。
        - id: ch03-b13
          speaker: green_fisherman
          text: 别开玩笑！这么少见的鱼，我怎么舍得不尝？这片海里可不是天天都能捞到木偶鱼。你就跟别的鱼一起下锅吧，保准满意。大家一起被炸，心里总会好受一点儿。
    - id: ch04
      title: 浑身裹满面粉
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 不幸的匹诺曹听完，马上又哭又叫，苦苦求渔夫饶命。
        - id: ch04-b02
          speaker: pinocchio
          text: 我要是去了学校该多好！我偏听伙伴们的话，现在终于遭报应了！
          emotion: sad
        - id: ch04-b03
          speaker: narrator
          text: 他像鳗鱼一样扭个不停，使出全身力气，想从绿渔夫的手掌里滑出去。可无论他怎样挣扎，全都没有一点儿用。渔夫拿来一根长长的灯心草，把他的手脚牢牢捆住，捆得活像一根香肠，再把他扔进那口装着其他鱼的锅里。
        - id: ch04-b04
          speaker: narrator
          text: 接着，渔夫端来一木碗面粉，把鱼一条条裹好。裹完一条，他就把它扔进煎锅。
        - id: ch04-b05
          speaker: narrator
          text: 可怜的鳕鱼最先在滚油里跳舞。后面跟着螃蟹、沙丁鱼、鳎鱼和鳀鱼。最后，终于轮到匹诺曹了。
        - id: ch04-b06
          speaker: narrator
          text: 死亡就在眼前，还是这样可怕的死法。匹诺曹吓得浑身猛颤。他说不出话，也喘不过气，连求饶都做不到了。
        - id: ch04-b07
          speaker: narrator
          text: 可这个可怜的孩子还在不停地用眼睛苦苦哀求。绿渔夫却连看也不看，根本不理。他把匹诺曹按进面粉，翻来滚去，足足滚了五六遍。木偶从头到脚变得雪白，活像用石膏做成的。
