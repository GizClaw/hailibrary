audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm and story-rich
        timbre: clear and rounded
        pace: measured
        pitch: medium
    pinocchio:
      display_name: Pinocchio
      tts:
        delivery: impulsive and defiant
        timbre: bright and wooden
        pace: quick
        pitch: medium-high
    alidoro:
      display_name: Alidoro
      tts:
        delivery: earnest and forceful
        timbre: deep and canine
        pace: brisk
        pitch: medium-low
    fisherman:
      display_name: Green Fisherman
      tts:
        delivery: greedy and matter-of-fact
        timbre: coarse and rumbling
        pace: deliberate
        pitch: low
  chapters:
    - id: ch01
      title: The Dog in the Sea
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: The desperate race reached a terrible moment. Pinocchio was sure he was lost. Alidoro had run so fast that he was almost upon him. The puppet heard the mastiff panting just behind him. There was hardly a hand's width between them, and the dog's hot breath touched him.
        - id: ch01-b02
          speaker: narrator
          text: Luckily, the shore was close, and the sea lay only a few steps away. Pinocchio reached the sand, sprang through the air as neatly as any frog, and plunged into the water.
        - id: ch01-b03
          speaker: narrator
          text: Alidoro tried to stop, but the speed of the chase carried him straight into the sea. The poor dog could not swim. He beat the water with his paws and fought to keep himself afloat. It only made matters worse. The harder he struggled, the farther he sank, until his head slipped beneath the water.
        - id: ch01-b04
          speaker: narrator
          text: When Alidoro came up again, his eyes rolled with terror.
        - id: ch01-b05
          speaker: alidoro
          text: I'm drowning! I'm drowning!
          emotion: fearful
        - id: ch01-b06
          speaker: narrator
          text: Pinocchio had put some distance between them and knew he was safe.
        - id: ch01-b07
          speaker: pinocchio
          text: Then drown!
          emotion: angry
        - id: ch01-b08
          speaker: alidoro
          text: Please help me, Pinocchio! Don't let me die!
          emotion: fearful
        - id: ch01-b09
          speaker: narrator
          text: That desperate cry touched Pinocchio. For all his faults, he had an excellent heart. He turned back toward the dog.
        - id: ch01-b10
          speaker: pinocchio
          text: If I save you, will you promise to leave me alone and never chase me again?
        - id: ch01-b11
          speaker: alidoro
          text: I promise! I promise! Please hurry. If you wait another half minute, I'll be dead!
          emotion: fearful
        - id: ch01-b12
          speaker: narrator
          text: "Pinocchio hesitated. Then he remembered what his father often told him: a good action is never lost. He swam to Alidoro, grabbed the dog's tail with both hands, and pulled him safely onto the dry sand."
        - id: ch01-b13
          speaker: narrator
          text: The poor dog could not even stand. He had swallowed so much salt water that he looked like a balloon. Pinocchio still did not trust him enough to stay close, so he jumped back into the sea. Once he had swum away from shore, he called to the friend he had just rescued.
        - id: ch01-b14
          speaker: pinocchio
          text: Goodbye, Alidoro! Have a good trip, and give my regards to everyone at home.
        - id: ch01-b15
          speaker: alidoro
          text: Goodbye, Pinocchio. Thank you a thousand times for saving my life. You've done me a great kindness, and what we give in this world comes back to us. If I get the chance, I won't forget what you did.
        - id: ch01-b16
          speaker: narrator
          text: Pinocchio swam on, always staying close to land.
    - id: ch02
      title: Caught in the Net
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: At last, Pinocchio thought he had found a safe place. He looked along the shore and saw a cave among the rocks. A cloud of smoke rose from its entrance.
        - id: ch02-b02
          speaker: pinocchio
          text: There must be a fire in that cave. Good! I can dry myself and get warm. After that... well, I'll decide then.
        - id: ch02-b03
          speaker: narrator
          text: With his mind made up, he moved toward the rocks. Just as he was about to climb out, he felt something beneath the water. It rose higher and higher, carrying him right up into the air. Pinocchio twisted and tried to get free, but he had noticed the danger too late.
        - id: ch02-b04
          speaker: narrator
          text: To his amazement, Pinocchio was trapped inside a huge net. Fish of every size and shape crowded around him, flapping and twisting as desperately as he was.
        - id: ch02-b05
          speaker: narrator
          text: At that moment, a fisherman came out of the cave. He was ugly beyond belief and looked more like a sea monster than a man. Thick green grass grew all over his head instead of hair. His skin was green, and so were his eyes. Even the long beard that hung all the way to the ground was green. He looked like an enormous lizard standing on its hind legs.
        - id: ch02-b06
          speaker: narrator
          text: The fisherman hauled the net from the sea and cried out with delight.
        - id: ch02-b07
          speaker: fisherman
          text: Thank Heaven! I'll have another splendid feast of fish today!
          emotion: happy
        - id: ch02-b08
          speaker: pinocchio
          text: Thank goodness I'm not a fish!
        - id: ch02-b09
          speaker: narrator
          text: The thought gave Pinocchio a little courage. Then the fisherman carried the netful of fish into the cave. It was dark and smoky inside. In the middle stood a large frying pan filled with sizzling oil, and the heavy smell of mushrooms was almost choking.
        - id: ch02-b10
          speaker: fisherman
          text: Now, let's see what I've caught!
    - id: ch03
      title: A Very Rare Fish
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: The green fisherman thrust one enormous hand into the net. The hand was so huge compared with the rest of him that it looked like a baker's shovel. He pulled out a whole handful of fish, looked them over, and sniffed them with great pleasure.
        - id: ch03-b02
          speaker: fisherman
          text: These are good fish!
        - id: ch03-b03
          speaker: narrator
          text: Then he tossed them into a dry pan. Again and again he reached into the net. His mouth watered each time he brought out another kind.
        - id: ch03-b04
          speaker: fisherman
          text: Fine whiting! Wonderful sardines! These soles will be delicious. The crabs are excellent, and look at those dear little anchovies!
          emotion: happy
        - id: ch03-b05
          speaker: narrator
          text: Pinocchio was the last one left. The fisherman pulled him out, opened his large green eyes in astonishment, and stared at him with a touch of fear.
        - id: ch03-b06
          speaker: fisherman
          text: What kind of fish is this? I don't remember ever eating one like it.
          emotion: surprised
        - id: ch03-b07
          speaker: narrator
          text: He looked Pinocchio over carefully from top to bottom. At last, he made up his mind.
        - id: ch03-b08
          speaker: fisherman
          text: I know what he is. He must be a crawfish.
        - id: ch03-b09
          speaker: narrator
          text: Pinocchio was offended at being mistaken for a crawfish.
        - id: ch03-b10
          speaker: pinocchio
          text: A crawfish? Is that what you think I am? What a way to treat me! I'm a puppet, I'll have you know!
          emotion: angry
        - id: ch03-b11
          speaker: fisherman
          text: A puppet? Well, that's a new kind of fish to me. Even better. I'll enjoy eating you all the more.
        - id: ch03-b12
          speaker: pinocchio
          text: Eat me? Can't you understand that I'm not a fish? You can hear me talking and thinking just as you do!
        - id: ch03-b13
          speaker: fisherman
          text: That's true. Since you're a fish who can talk and think like me, I'll give you all the special attention you deserve.
        - id: ch03-b14
          speaker: pinocchio
          text: What kind of attention?
        - id: ch03-b15
          speaker: fisherman
          text: As a sign of my friendship, you may choose how I cook you. Would you rather be fried in the pan, or stewed in tomato sauce?
        - id: ch03-b16
          speaker: pinocchio
          text: If I really get to choose, I'd rather you set me free and let me go home.
        - id: ch03-b17
          speaker: fisherman
          text: You must be joking! Do you think I'd miss my chance to taste such a rare fish? I can promise you, these waters don't give me a puppet fish every day. I'll fry you with the others, and you'll be perfectly satisfied. If you have to be fried, it's always some comfort to have company.
    - id: ch04
      title: White with Flour
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: At that, poor Pinocchio began to cry, scream, and beg for mercy. Between sobs, he spoke.
        - id: ch04-b02
          speaker: pinocchio
          text: I should have gone to school! I should have listened to my schoolmates. And now I'm paying for it!
          emotion: sad
        - id: ch04-b03
          speaker: narrator
          text: Pinocchio twisted like an eel. He pulled and wriggled with all his strength, trying every way he could to slip out of the green fisherman's hands. It was useless. The fisherman took a long strip of rush and bound the puppet's hands and feet as if he were a sausage. Then he threw him into the pan with all the other fish.
        - id: ch04-b04
          speaker: narrator
          text: Next, the fisherman brought over a wooden bowl filled with flour. He took the fish one at a time and rolled each one through the flour. As soon as a fish was fully coated, he dropped it straight into the frying pan.
        - id: ch04-b05
          speaker: narrator
          text: First the poor whiting danced in the boiling oil. The crabs followed, then the sardines, the soles, and the anchovies. At last, Pinocchio's turn came.
        - id: ch04-b06
          speaker: narrator
          text: He was so close to such a horrible death that terror shook him from head to foot. He had no voice or breath left to beg again.
        - id: ch04-b07
          speaker: narrator
          text: The poor boy had no words left, but his eyes still begged for mercy. The green fisherman did not care in the least. He plunged Pinocchio into the flour five or six times and covered every part of him. Soon the puppet was white from head to foot. He looked as if he had been made entirely of plaster.
