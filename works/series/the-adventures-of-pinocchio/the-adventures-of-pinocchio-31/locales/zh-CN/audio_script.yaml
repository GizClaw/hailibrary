audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖从容，带一点一本正经的幽默
        timbre: 清晰醇厚
        pace: 舒缓，遇到惊奇处略微加快
        pitch: 中
    pinocchio:
      display_name: 匹诺曹
      tts:
        delivery: 任性直率，嘴硬而孩子气，危急时急促慌张
        timbre: 清亮，带木偶般的脆响
        pace: 偏快，争辩时更急
        pitch: 中高
    candlewick:
      display_name: 灯芯
      tts:
        delivery: 懒散顽皮，怂恿朋友时又热切又狡黠
        timbre: 单薄明亮的少年声音
        pace: 轻快，得意时稍慢
        pitch: 中高
    schoolmate_1:
      display_name: 孩子甲
      tts:
        delivery: 热情领头，喊话时充满贪玩的兴奋
        timbre: 清亮扎实的少年声音
        pace: 较快
        pitch: 中高
    schoolmate_2:
      display_name: 孩子乙
      tts:
        delivery: 活泼跳脱，起哄时带着得意的笑意
        timbre: 轻薄透亮的少年声音
        pace: 明快
        pitch: 高
    schoolmate_3:
      display_name: 孩子丙
      tts:
        delivery: 顽皮直率，跟着同伴大声叫喊
        timbre: 略带沙感的少年声音
        pace: 轻快
        pitch: 中
    schoolmate_4:
      display_name: 孩子丁
      tts:
        delivery: 快活外放，喝彩时声音高扬
        timbre: 圆润明亮的少年声音
        pace: 稍快
        pitch: 中高
    coachman:
      display_name: 车夫
      tts:
        delivery: 笑眯眯地哄人，甜腻亲热中藏着冷酷
        timbre: 柔软油滑的成年男声
        pace: 从容
        pitch: 中高
    donkey:
      display_name: 驴子
      tts:
        delivery: 压低声音苦苦告诫，悲伤而急切
        timbre: 沙哑微弱，隐约像男孩子
        pace: 缓慢
        pitch: 中
  chapters:
    - id: ch01
      title: 无声驶来的马车
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            马车终于到了，车轮上缠满麻絮和破布，所以一路过来，竟没发出半点声响。拉车的是十二对驴子，也就是整整二十四头。它们个头一般大小，颜色却没有两头完全相同。有灰的，有白的，有像胡椒拌盐那样黑白斑驳的，还有披着黄蓝宽条纹的。
        - id: ch01-b02
          speaker: narrator
          text: >-
            更怪的是，这二十四头驴子都没像别的牲口那样钉蹄铁。它们的四只脚上，穿的竟是男人才穿的白色小山羊皮靴。至于赶车人，那是个横着比竖着还宽的小个子。他一身松软油腻，像块黄油，圆脸像橙子，小嘴总在笑。说话又软又甜，像只千方百计讨女主人欢心的猫。
        - id: ch01-b03
          speaker: narrator
          text: >-
            孩子们争着往车里挤，都盼着让他送去玩儿国。车上早已装满八岁到十四岁的男孩子，一个压着一个，像桶里挤成团的鲱鱼。他们窝得浑身难受，挤得几乎喘不过气，却没人喊一声疼，也没有一个人抱怨。只要想到几个钟头后，便再也见不到课本、学校和老师，他们就什么苦都甘愿忍了。他们不觉得累，也不觉得难受，连饥饿、口渴和困倦都忘得干干净净。
        - id: ch01-b04
          speaker: narrator
          text: >-
            车一停，小个子便转向灯芯，脸上堆着媚笑，还不停地挤眉弄眼。
        - id: ch01-b05
          speaker: coachman
          text: >-
            漂亮孩子，你也想去那个有福气的地方吗？
        - id: ch01-b06
          speaker: candlewick
          text: >-
            我当然想去。
        - id: ch01-b07
          speaker: coachman
          text: >-
            可我得先提醒你，亲爱的孩子，车里一个座位都没剩。你也看见了，里面已经挤得满满的。
        - id: ch01-b08
          speaker: candlewick
          text: >-
            没事。车里坐不下，我就骑在车底的弹簧上。
        - id: ch01-b09
          speaker: narrator
          text: >-
            灯芯一跃而起，跨坐到了弹簧上。小个子又满脸讨好地看向匹诺曹。
        - id: ch01-b10
          speaker: coachman
          text: >-
            那么你呢，我的小宝贝？你是跟我们走，还是打算留下？
        - id: ch01-b11
          speaker: pinocchio
          text: >-
            我留下。我要回家，也要好好读书。规规矩矩的孩子，本来就应该这样。
        - id: ch01-b12
          speaker: coachman
          text: >-
            好啊，那就祝你读得快活！
        - id: ch01-b13
          speaker: candlewick
          text: >-
            匹诺曹，听我的吧！跟我们一起走，保证玩得痛快！
        - id: ch01-b14
          speaker: pinocchio
          text: >-
            不去，不去，我就是不去！
        - id: ch01-b15
          speakers: [schoolmate_1, schoolmate_2, schoolmate_3, schoolmate_4]
          ensemble: chorus
          text: >-
            跟我们来吧！大家一起玩才叫痛快！
        - id: ch01-b16
          speaker: narrator
          text: >-
            车里上百个声音一起呼喊。匹诺曹听着听着，刚才那份坚决已经松动，心思渐渐活了。
        - id: ch01-b17
          speaker: pinocchio
          text: >-
            可我要是真跟你们去了，善良的仙女会怎么说？
        - id: ch01-b18
          speaker: coachman
          text: >-
            别想这些扫兴的事。想想玩儿国吧，从早到晚，你爱怎么闹就怎么闹。
        - id: ch01-b19
          speaker: narrator
          text: >-
            匹诺曹不说话，只叹气。第一声，第二声，等到第三声叹完，他终于拿定了主意。
        - id: ch01-b20
          speaker: pinocchio
          text: >-
            给我腾一点地方吧，我也要去。
        - id: ch01-b21
          speaker: coachman
          text: >-
            车上实在没地方了。不过我很欢迎你，就把我的车夫座让给你吧。
        - id: ch01-b22
          speaker: pinocchio
          text: >-
            可你怎么办？
        - id: ch01-b23
          speaker: coachman
          text: >-
            我走着去就行了。
        - id: ch01-b24
          speaker: pinocchio
          text: >-
            那怎么行！我不能让你走路。我骑一头驴好了。
    - id: ch02
      title: 会哭的驴子
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            匹诺曹走到头一对驴子右边那头跟前，刚要往上爬，驴子猛地转身，一蹄重重踢中他的肚子，把他踢得滚倒在地，四脚朝天。孩子们全都看见了，顿时放声大笑，笑得又放肆又没完没了。
        - id: ch02-b02
          speaker: narrator
          text: >-
            小个子却没笑。他走近那头反抗的驴子，装作要亲它，忽然张嘴咬掉了它半只耳朵。匹诺曹已经气冲冲地从地上爬起来。他猛地一跳，稳稳落在可怜的驴背上。这一跳实在漂亮，孩子们马上不笑了，全都拍起手来，大声为他喝彩。
        - id: ch02-b03
          speakers: [schoolmate_1, schoolmate_2, schoolmate_3, schoolmate_4]
          ensemble: chorus
          text: >-
            匹诺曹万岁！好样的，匹诺曹！
          emotion: happy
        - id: ch02-b04
          speaker: narrator
          text: >-
            欢呼声仿佛永远不会停。匹诺曹坐稳后，马车便上路了。驴子飞奔起来，车轮在大路的石块上咯噔作响。就在这时，他仿佛听到一个低得几乎听不见的声音。
        - id: ch02-b05
          speaker: donkey
          text: >-
            可怜的傻瓜！你偏要照自己的意思来，以后一定会后悔！
          emotion: sad
        - id: ch02-b06
          speaker: narrator
          text: >-
            匹诺曹有些害怕，忙着四下张望，却连一个人影都没找到。驴群继续飞奔，马车继续颠簸。车里的孩子都睡着了，灯芯睡得像只睡鼠，鼾声呼呼直响。小个子坐在车夫座上，从牙缝里轻轻哼着歌。
        - id: ch02-b07
          speaker: coachman
          text: >-
            夜里人人沉沉睡，唯独我呀不入眠。
        - id: ch02-b08
          speaker: narrator
          text: >-
            又走过一英里，那道细小的声音再次钻进匹诺曹耳中。
        - id: ch02-b09
          speaker: donkey
          text: >-
            傻小子，记住我的话！不肯读书，扔下课本、学校和老师，只顾着玩乐的孩子，早晚不会有好下场。我亲自尝过这种苦，所以才来告诉你。总有一天，你会跟我现在一样哭，可那时候就太迟了！
          emotion: sad
        - id: ch02-b10
          speaker: narrator
          text: >-
            这几句话轻得像耳语。匹诺曹越听越害怕，马上跳下驴背，一把捉住驴子的嘴。他这才发现，原来那头驴正在流泪，哭起来竟跟孩子一模一样。
        - id: ch02-b11
          speaker: pinocchio
          text: >-
            喂，车夫先生，你快看！这事太怪了，这头驴居然在哭！
          emotion: surprised
        - id: ch02-b12
          speaker: coachman
          text: >-
            随它哭吧。等到它当新郎那天，自然就会笑了。
        - id: ch02-b13
          speaker: pinocchio
          text: >-
            它会说话，难道也是你教的？
        - id: ch02-b14
          speaker: coachman
          text: >-
            不是。它跟一群有学问的狗混了三年，这才会含含糊糊地念叨几句。
        - id: ch02-b15
          speaker: pinocchio
          text: >-
            这头牲口真可怜！
          emotion: sad
        - id: ch02-b16
          speaker: coachman
          text: >-
            行了，行了。看一头驴哭，有什么可耽搁的？快骑回去，咱们接着赶路。夜里这么冷，前面的路还长着呢。
        - id: ch02-b17
          speaker: narrator
          text: >-
            匹诺曹没再说话，乖乖骑了上去。第二天清晨，天刚蒙蒙亮，他们平安到达了玩儿国。
    - id: ch03
      title: 玩儿国的日子
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            世上再没有一个国家像这里。全国的居民全是男孩子，最大的十四岁，最小的连八岁都不到。街上尽是笑声、喧闹声和叫喊声，吵得人脑袋发晕。无论走到哪里，都能看见一群又一群的孩子在玩。
        - id: ch03-b02
          speaker: narrator
          text: >-
            有人玩核桃，有人打板羽球，也有人拍皮球。有人骑脚踏车，有人骑木马。那边在捉迷藏，这边正互相追赶。还有人背诵、唱歌、蹦跳，或是倒立着走路，把双脚高高翘在空中。
        - id: ch03-b03
          speaker: narrator
          text: >-
            另一些孩子滚着铁环，还有人戴着树叶头盔，扮成威风的将军，指挥一队硬纸板士兵。满街的人都在笑，在嚷，在高声叫喊。他们拍手，吹口哨，还有人学刚下完蛋的母鸡，咯咯叫个不停。
        - id: ch03-b04
          speaker: narrator
          text: >-
            每座广场上都搭起了帆布戏棚，从早到晚挤满孩子。墙上用木炭写着好多标语，说什么玩具万岁，再也不要学校，还要打倒算术。这样漂亮的话到处都是，只可惜每一句都错字连篇。
        - id: ch03-b05
          speaker: narrator
          text: >-
            匹诺曹、灯芯和同车的孩子刚踏进城，就冲进了这片喧闹里。没过几分钟，他们已经跟所有人混熟。哪儿还能找到比他们更开心、更满足的孩子呢？
        - id: ch03-b06
          speaker: narrator
          text: >-
            游戏一个接着一个，各种消遣的花样怎么也玩不完。孩子们从早到晚只管玩耍。在这样的日子里，一个个钟头过去了，一天天过去了，连一个个星期也像闪电一样飞了过去。
    - id: ch04
      title: 五个月的快乐
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            匹诺曹偶然碰见灯芯，总忍不住夸赞眼前的生活。
        - id: ch04-b02
          speaker: pinocchio
          text: >-
            啊，这种日子过得真痛快！
          emotion: happy
        - id: ch04-b03
          speaker: candlewick
          text: >-
            现在知道我没说错了吧？你起先还死活不肯来，一门心思想回仙女身边，把时间都浪费在读书上。如今你不用再受课本和学校的烦扰，这可全靠我的主意，也是我一次次把你劝来的。只有真正的朋友，才会替你帮这么大的忙。
        - id: ch04-b04
          speaker: pinocchio
          text: >-
            你说得对，灯芯！我现在这么快活，的确全是你的功劳。可你知道老师以前提起你时，总跟我说什么吗？他说，千万别跟那个小无赖灯芯来往。他不是好伙伴，只会把你带坏！
        - id: ch04-b05
          speaker: narrator
          text: >-
            灯芯听完，摇了摇头。
        - id: ch04-b06
          speaker: candlewick
          text: >-
            可怜的老师！我早就知道他不喜欢我，还总拿诽谤我取乐。不过我这个人心胸宽大，就原谅他吧！
        - id: ch04-b07
          speaker: pinocchio
          text: >-
            你真有一颗高尚的心！
        - id: ch04-b08
          speaker: narrator
          text: >-
            匹诺曹亲热地抱住朋友，还在他两眼之间亲了一口。这样的快乐生活整整过了五个月。他们天天只顾玩乐，课本和学校早被抛到了脑后。直到一天早晨，匹诺曹从睡梦中醒来，碰上一件极不愉快的怪事，顿时气坏了。
