  chapters:
    - id: ch01
      title: Pinocchio Enjoys Five Months of Happiness
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: At last the coach came. It made no sound at all because flax and rags were wrapped around its wheels. Twelve pairs of donkeys pulled it. They were all the same size, though some were gray, some white, some speckled like salt and pepper, and others had broad yellow and blue stripes. Stranger still, those twenty-four donkeys wore men's white kid boots instead of horseshoes.
        - id: ch01-b02
          speaker: narrator
          text: And the coachman? He was a little man, wider than he was tall, soft and greasy as a lump of butter. His round face looked like an orange. His tiny mouth never stopped smiling, and his voice was as gentle and coaxing as a cat trying to win over the lady of the house.
        - id: ch01-b03
          speaker: narrator
          text: Every boy tried to beat the others to a place in the coach bound for the Land of Boobies. It was already packed with boys from eight to fourteen, piled together like herrings in a barrel. They were uncomfortable and squeezed so tightly that they could barely breathe. Still, no one cried out or complained. In only a few hours, they would reach a land with no books, schools, or teachers. That happy thought made them forget every discomfort. They felt neither tired nor cramped, neither hungry nor thirsty, and they didn't even miss their sleep.
        - id: ch01-b04
          speaker: narrator
          text: The moment the coach stopped, the little man turned to Candlewick. He smiled, smirked, and made one flattering face after another.
        - id: ch01-b05
          speaker: coachman
          text: Well, my fine boy, would you like to go to that wonderful country too?
        - id: ch01-b06
          speaker: candlewick
          text: Of course I would.
        - id: ch01-b07
          speaker: coachman
          text: I should warn you, my dear boy, there isn't one seat left. You can see how full the coach is.
        - id: ch01-b08
          speaker: candlewick
          text: That doesn't matter. If I can't sit inside, I'll ride on the springs.
        - id: ch01-b09
          speaker: narrator
          text: With one jump, Candlewick landed astride the springs.
        - id: ch01-b10
          speaker: coachman
          text: And what about you, my dear? Will you come with us, or stay here?
        - id: ch01-b11
          speaker: pinocchio
          text: I'm staying. I'm going home to study, the way a well-behaved boy should.
        - id: ch01-b12
          speaker: coachman
          text: Well, I hope that does you plenty of good!
        - id: ch01-b13
          speaker: candlewick
          text: Pinocchio, listen! Come with us. We'll have so much fun!
        - id: ch01-b14
          speaker: pinocchio
          text: No, no, no!
        - id: ch01-b15
          speakers: [schoolmate_1, schoolmate_2, schoolmate_3]
          ensemble: chorus
          text: Come with us! We'll have so much fun!
        - id: ch01-b16
          speaker: pinocchio
          text: But if I go, what will my good Fairy say?
        - id: ch01-b17
          speaker: narrator
          text: Pinocchio was beginning to give in.
        - id: ch01-b18
          speaker: candlewick
          text: Don't fill your head with gloomy thoughts. Just remember where we're going. We can do whatever we want from morning to night!
        - id: ch01-b19
          speaker: narrator
          text: Pinocchio said nothing. He sighed once, then twice, then a third time. At last, he made up his mind.
        - id: ch01-b20
          speaker: pinocchio
          text: Make a little room. I'm coming too.
        - id: ch01-b21
          speaker: coachman
          text: Every place is taken. But to show you how welcome you are, you may sit in my seat up front.
        - id: ch01-b22
          speaker: pinocchio
          text: Then where will you sit?
        - id: ch01-b23
          speaker: coachman
          text: Oh, I'll walk.
        - id: ch01-b24
          speaker: pinocchio
          text: No, I couldn't let you do that. I'd rather ride one of the donkeys.
        - id: ch01-b25
          speaker: narrator
          text: Pinocchio walked up to the donkey on the right side of the first pair and tried to climb onto its back. The animal turned on him at once. With one tremendous blow to the stomach, it sent Pinocchio rolling over with both legs in the air. You can imagine the rude, wild laughter that broke out among all the boys who had watched it happen.
        - id: ch01-b26
          speaker: narrator
          text: The little man didn't laugh. He walked over to the stubborn donkey and acted as if he meant to kiss it. Instead, he bit off half its ear.
        - id: ch01-b27
          speaker: narrator
          text: Meanwhile, Pinocchio picked himself up from the road in a fury. He took a running spring and landed on the poor animal's back. This time he did it so well that the boys stopped laughing. Now they began shouting his name. They clapped their hands and applauded as though they would never stop.
        - id: ch01-b28
          speakers: [schoolmate_1, schoolmate_2, schoolmate_3]
          ensemble: chorus
          text: Hooray for Pinocchio!
          emotion: happy
        - id: ch01-b29
          speaker: narrator
          text: Once Pinocchio was mounted, the coach set off. The donkeys galloped, and the coach rattled over the stones of the highway. Then Pinocchio thought he heard a low voice, so faint he could hardly make out the words.
        - id: ch01-b30
          speaker: donkey
          text: Poor fool! You insist on doing things your own way, but you'll be sorry.
          emotion: sad
        - id: ch01-b31
          speaker: narrator
          text: Pinocchio felt a shiver of fear. He looked to one side and then the other, trying to discover where the words had come from, but he saw no one. The donkeys kept galloping. The coach rattled over the road. Inside, all the boys were asleep, and Candlewick snored like a dormouse. Up on the box, the little man sang quietly between his teeth.
        - id: ch01-b32
          speaker: coachman
          text: Everyone sleeps through the night, but I never sleep.
        - id: ch01-b33
          speaker: narrator
          text: They traveled another mile. Then that same small voice spoke to Pinocchio again.
        - id: ch01-b34
          speaker: donkey
          text: Remember this, you simpleton. Boys who won't study, who turn away from books, school, and teachers just to play all day, come to a bad end sooner or later. I know from my own experience. Someday you'll cry the way I'm crying now, but by then it will be too late.
          emotion: sad
        - id: ch01-b35
          speaker: narrator
          text: The softly whispered warning frightened Pinocchio more than ever. He sprang down from the donkey's back and hurried to take hold of its mouth. Then came a surprise he never expected. Tears were running from the donkey's eyes. The animal was crying just like a boy.
        - id: ch01-b36
          speaker: pinocchio
          text: Coachman! Something very strange is happening. This donkey is crying!
          emotion: surprised
        - id: ch01-b37
          speaker: coachman
          text: Let him cry. He'll laugh when he's a bridegroom.
        - id: ch01-b38
          speaker: pinocchio
          text: Did you teach him how to talk?
        - id: ch01-b39
          speaker: coachman
          text: No. He spent three years with a troupe of educated dogs, so he picked up a few muttered words.
        - id: ch01-b40
          speaker: pinocchio
          text: Poor animal!
          emotion: sad
        - id: ch01-b41
          speaker: coachman
          text: Come now, we can't waste our time watching a donkey cry. Get back on him and let's go. The night is cold, and we have a long road ahead.
        - id: ch01-b42
          speaker: narrator
          text: Pinocchio obeyed without another word. Around daybreak, they reached the Land of Boobies safely.
        - id: ch01-b43
          speaker: narrator
          text: It was a country unlike any other place in the world. Its whole population was made up of boys. The oldest were fourteen years old, and the youngest were barely eight. Everywhere Pinocchio looked, there were groups of them filling the streets. Their laughter, shouting, and noise were enough to make anyone's head spin.
        - id: ch01-b44
          speaker: narrator
          text: Boys were everywhere. Some played with nuts, battledores, or balls. Some rode bicycles, while others bounced along on wooden horses. One group played hide-and-seek, and another raced after one another through the streets. There were boys reciting, boys singing, and boys leaping. Some walked on their hands with both feet waving in the air. Others rolled hoops or strutted around dressed as generals, wearing helmets made of leaves and giving orders to whole squadrons of cardboard soldiers.
        - id: ch01-b45
          speaker: narrator
          text: Some boys laughed, some yelled, and some called out to one another. Others clapped their hands or whistled. A few even clucked like hens that had just laid eggs. Canvas theaters had been put up in every square, and they stayed crowded with boys from morning until evening. The walls of the houses were covered with sayings written in charcoal. They cheered for toys, declared that there would be no more schools, and demanded an end to arithmetic. All those fine messages were badly spelled.
        - id: ch01-b46
          speaker: narrator
          text: Pinocchio, Candlewick, and all the other boys who had traveled with the little man had hardly set foot in town before they plunged straight into the noise and excitement. Within a few minutes, they had made friends with everybody around them. Where in the world could anyone have found boys who seemed happier or more content?
        - id: ch01-b47
          speaker: narrator
          text: With games and amusements going on all the time, the fun never paused. Hours, days, and weeks flashed past like lightning. Whenever Pinocchio happened to meet Candlewick, he always said the same thing.
        - id: ch01-b48
          speaker: pinocchio
          text: Oh, what a wonderful life!
          emotion: happy
        - id: ch01-b49
          speaker: candlewick
          text: See? I told you I was right. And you almost stayed behind! You were going home to your Fairy to waste your time studying. You're free of books and school now, and you owe that to me, my advice, and all my convincing. Only a real friend would do you such a great favor.
        - id: ch01-b50
          speaker: pinocchio
          text: It's true, Candlewick. I'm happy now because of you. But do you know what my teacher used to say about you? He told me not to spend time with that rascal Candlewick. He said you were bad company and would only get me into trouble.
        - id: ch01-b51
          speaker: candlewick
          text: Poor teacher! I know he never liked me, and he enjoyed saying nasty things about me. But I'm generous, so I forgive him.
        - id: ch01-b52
          speaker: pinocchio
          text: What a noble soul!
        - id: ch01-b53
          speaker: narrator
          text: Pinocchio hugged his friend warmly and kissed him between the eyes.
        - id: ch01-b54
          speaker: narrator
          text: That delightful life went on for five whole months. From morning until night, every day was given over to games and amusement. Not once did Pinocchio stop to think about books or school. Then, one morning, he woke up and found a most unpleasant surprise waiting for him. It put him in a very bad temper.
