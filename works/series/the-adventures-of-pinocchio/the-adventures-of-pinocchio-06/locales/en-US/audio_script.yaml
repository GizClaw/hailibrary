audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm and story-rich
        timbre: clear and rounded
        pace: measured
        pitch: medium
    pinocchio:
      display_name: Pinocchio
      tts:
        delivery: impulsive and defiant
        timbre: bright and wooden
        pace: quick
        pitch: medium-high
    old_man:
      display_name: Little Old Man
      tts:
        delivery: gruff and suspicious
        timbre: thin and raspy
        pace: brisk
        pitch: medium-high
    geppetto:
      display_name: Geppetto
      tts:
        delivery: plainspoken and caring
        timbre: warm and weathered
        pace: unhurried
        pitch: low
  chapters:
    - id: ch01
      title: Into the Storm
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: It was a wild, stormy night. Thunder crashed overhead, and the lightning was so bright that the whole sky seemed to be on fire.
        - id: ch01-b02
          speaker: narrator
          text: Pinocchio was terribly afraid of thunder. But he was even more afraid of going hungry. He shut the door and raced toward the village. A hundred bounds brought him there, with his tongue hanging out as he panted like a hunting dog.
        - id: ch01-b03
          speaker: narrator
          text: The village was dark and empty. Every shop was closed, every window was shut, and not even a dog was out in the street. The place seemed as still as the land of the dead.
    - id: ch02
      title: The Old Man at the Window
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: Hunger had made Pinocchio desperate. He grabbed the bell at one house and rang it as hard as he could. As he pulled, he told himself that someone would have to come.
        - id: ch02-b02
          speaker: narrator
          text: Someone did. A little old man in a nightcap looked down from a window. He was angry at being disturbed.
        - id: ch02-b03
          speaker: old_man
          text: What do you want this late at night?
          emotion: angry
        - id: ch02-b04
          speaker: pinocchio
          text: Could you please give me a little bread?
        - id: ch02-b05
          speaker: old_man
          text: Stay right there. I'll be back in a moment.
        - id: ch02-b06
          speaker: narrator
          text: The old man thought Pinocchio was one of those naughty boys who rang doorbells at night just to wake decent people from a sound sleep.
        - id: ch02-b07
          speaker: narrator
          text: Half a minute later, the window opened again. The old man's voice called down to him.
        - id: ch02-b08
          speaker: old_man
          text: Stand under the window and hold out your cap.
        - id: ch02-b09
          speaker: narrator
          text: Pinocchio took off his cap and held it up. At that very moment, an enormous basin of water came pouring down. It soaked him from head to toe, as though he were a pot of dried-up geraniums.
    - id: ch03
      title: Feet of Cinders
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: Pinocchio went home looking like a wet chicken. He was worn out from the run and weak with hunger. He could no longer stand, so he sat down and rested his damp, muddy feet on a brazier filled with glowing embers.
        - id: ch03-b02
          speaker: narrator
          text: Then he fell asleep. While he slept, his wooden feet caught fire. Little by little, they burned away until nothing remained but cinders.
        - id: ch03-b03
          speaker: narrator
          text: Pinocchio slept on, snoring as if those feet belonged to someone else. Around daybreak, a knock at the door finally woke him.
        - id: ch03-b04
          speaker: pinocchio
          text: Who's there?
        - id: ch03-b05
          speaker: narrator
          text: He yawned and rubbed his eyes as he asked.
        - id: ch03-b06
          speaker: geppetto
          text: It's me!
        - id: ch03-b07
          speaker: narrator
          text: Pinocchio knew that voice. It was Geppetto.
