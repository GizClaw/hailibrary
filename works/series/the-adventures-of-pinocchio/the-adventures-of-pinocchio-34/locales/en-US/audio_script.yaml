audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm and story-rich
        timbre: clear and rounded
        pace: measured
        pitch: medium
    pinocchio:
      display_name: Pinocchio
      tts:
        delivery: impulsive and defiant
        timbre: bright and wooden
        pace: quick
        pitch: medium-high
    buyer:
      display_name: Buyer
      tts:
        delivery: cold and matter-of-fact
        timbre: rough and dry
        pace: measured
        pitch: low
    blue_goat:
      display_name: Blue-Haired Goat
      tts:
        delivery: tender and urgent
        timbre: light and clear
        pace: quick
        pitch: high
    tunny:
      display_name: Tunny
      tts:
        delivery: gloomy and philosophical
        timbre: resonant and rasping
        pace: unhurried
        pitch: low
  chapters:
    - id: ch01
      title: Pinocchio Is Swallowed by the Dog-Fish
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            Pinocchio had been underwater for fifty minutes when his buyer spoke to himself.
        - id: ch01-b02
          speaker: buyer
          text: >-
            That poor lame donkey must be drowned by now. I'll pull him up and make a fine drum from his skin.
        - id: ch01-b03
          speaker: narrator
          text: >-
            He began hauling in the rope he'd tied around the donkey's leg. He pulled, and pulled, and pulled. At last, something appeared above the water. And what do you think it was? Not a dead little donkey at all. There on the rope was a live wooden puppet, wriggling like an eel.
        - id: ch01-b04
          speaker: narrator
          text: >-
            The poor man stared at the wooden puppet and thought he must be dreaming. Astonishment struck him speechless. He stood there with his mouth hanging open and his eyes nearly starting out of his head. After a while, he recovered enough to speak, though his voice still shook.
        - id: ch01-b05
          speaker: buyer
          text: >-
            Where's the little donkey I threw into the sea? What happened to him?
        - id: ch01-b06
          speaker: pinocchio
          text: >-
            I'm the little donkey!
          emotion: happy
        - id: ch01-b07
          speaker: buyer
          text: >-
            You?
          emotion: surprised
        - id: ch01-b08
          speaker: pinocchio
          text: >-
            Me.
        - id: ch01-b09
          speaker: buyer
          text: >-
            You little scoundrel! Are you making fun of me?
          emotion: angry
        - id: ch01-b10
          speaker: pinocchio
          text: >-
            Not at all, master. I'm telling you the truth.
        - id: ch01-b11
          speaker: buyer
          text: >-
            A moment ago you were a donkey. How could soaking in the sea turn you into a wooden puppet?
        - id: ch01-b12
          speaker: pinocchio
          text: >-
            Maybe seawater did it. The sea can make amazing changes.
        - id: ch01-b13
          speaker: buyer
          text: >-
            Watch yourself, puppet. Don't think you can have a laugh at my expense. You'll be sorry if I lose my temper!
          emotion: angry
        - id: ch01-b14
          speaker: pinocchio
          text: >-
            Would you like the real story? Untie my leg, and I'll tell you.
        - id: ch01-b15
          speaker: narrator
          text: >-
            The man was curious now. He wanted very much to hear the real story, so he immediately untied the knot that held Pinocchio. The moment the puppet felt as free as a bird in the air, he began his tale.
        - id: ch01-b16
          speaker: pinocchio
          text: >-
            You should know that I started out as a puppet, just as you see me now. I was almost ready to become a boy like all the other boys in the world. But instead, I hated studying, took advice from bad companions, and ran away from home. Then one fine morning I woke up with long ears and a long tail. I'd become a donkey. What a disgrace that was! Dear master, I wouldn't wish such a disgrace even on your worst enemy.
        - id: ch01-b17
          speaker: pinocchio
          text: >-
            They took me to market to be sold, and the director of a circus company bought me. He got the idea that he'd turn me into a famous dancer and a famous jumper through hoops. But one night, right in the middle of a performance, I had a terrible fall and went lame in both legs. The director didn't know what to do with a lame donkey, so he sent me off to be sold again. And that's when you became my buyer.
        - id: ch01-b18
          speaker: buyer
          text: >-
            That's true enough. I paid two dollars for you. Who's going to give me my money back now?
        - id: ch01-b19
          speaker: pinocchio
          text: >-
            Why did you buy me in the first place? You wanted my skin for a drum!
        - id: ch01-b20
          speaker: buyer
          text: >-
            That's true, too. But where am I supposed to get another skin?
        - id: ch01-b21
          speaker: pinocchio
          text: >-
            Don't worry, master. The world has plenty of little donkeys.
        - id: ch01-b22
          speaker: buyer
          text: >-
            Listen, you cheeky rascal. Is that the end of your story?
        - id: ch01-b23
          speaker: pinocchio
          text: >-
            No, but I only have a little more to say. After you bought me, you brought me here to kill me. Then you felt sorry for me. Rather than kill me yourself, you tied a stone around my neck and threw me into the sea. That tender feeling does you great honor, and I'll always be grateful for it. But even so, dear master, you made your plans without reckoning with the Fairy!
        - id: ch01-b24
          speaker: buyer
          text: >-
            Who's the Fairy?
        - id: ch01-b25
          speaker: pinocchio
          text: >-
            She's my mamma. She's like all good mammas who take care of their children. She never loses sight of me, and she always helps me with love. She even helps when I've been so foolish and behaved so badly that I deserve to be abandoned and left to look after myself.
        - id: ch01-b26
          speaker: pinocchio
          text: >-
            Well, the moment the good Fairy saw that I was in danger of drowning, she sent an enormous school of fish. They believed I really was a little dead donkey, so they began to eat me. And what mouthfuls they took! I never would have guessed that fish could be greedier than boys. Some ate my ears, and some ate my muzzle. Others ate my neck and mane, the skin from my legs, and the coat from my back. One especially polite little fish even lowered himself enough to eat my tail.
        - id: ch01-b27
          speaker: buyer
          text: >-
            From now on, I swear I'll never touch fish again! Imagine cutting open a mullet or a fried whiting and finding a donkey's tail inside!
          emotion: disgusted
        - id: ch01-b28
          speaker: pinocchio
          text: >-
            I agree. Anyway, once they had eaten the donkey hide that covered me from head to foot, they reached the bone. Or rather, they reached the wood. As you can see, I'm made of the hardest kind.
        - id: ch01-b29
          speaker: pinocchio
          text: >-
            They gave me a few bites, but they soon discovered I was no morsel for their teeth. The thought of such indigestible food disgusted them. Off they went, some one way and some another, without so much as a thank-you. And now you know the whole story. That's why, when you pulled up your rope, you found a live puppet instead of a dead donkey.
        - id: ch01-b30
          speaker: buyer
          text: >-
            I don't believe a word of that story! I spent two dollars on you, and I mean to get my money back. I'll take you to market and sell you by weight as dry wood for starting fires.
          emotion: angry
        - id: ch01-b31
          speaker: pinocchio
          text: >-
            Sell me if you like. That's fine with me.
        - id: ch01-b32
          speaker: narrator
          text: >-
            The instant he said it, Pinocchio sprang into the water. He swam cheerfully away from shore and called back to his poor owner.
        - id: ch01-b33
          speaker: pinocchio
          text: >-
            Good-bye, master! If you ever need a skin for a drum, remember me!
          emotion: happy
        - id: ch01-b34
          speaker: narrator
          text: >-
            He laughed and kept swimming. A little later he turned and shouted even louder.
        - id: ch01-b35
          speaker: pinocchio
          text: >-
            Good-bye, master! If you ever need some well-seasoned firewood, remember me!
          emotion: happy
        - id: ch01-b36
          speaker: narrator
          text: >-
            In the blink of an eye, he had swum so far away that he was barely visible. All the man could see was one tiny black speck on the surface of the sea. From time to time, that speck kicked its legs out of the water, leaping and capering like a dolphin enjoying itself.
        - id: ch01-b37
          speaker: narrator
          text: >-
            Pinocchio swam on and on without knowing where he was headed. Then, in the middle of the sea, he saw a rock that seemed to be made of white marble. A beautiful little goat stood on its highest point. She bleated lovingly to him and made signs for him to come closer.
        - id: ch01-b38
          speaker: narrator
          text: >-
            And here was the strangest thing. The goat's hair wasn't white or black or spotted like other goats. It was a brilliant blue, just like the hair of the beautiful Child.
        - id: ch01-b39
          speaker: narrator
          text: >-
            You can imagine how hard poor Pinocchio's heart began to beat. He doubled his strength and drove himself toward the white rock. He had already covered half the distance when the horrible head of a sea monster rose from the water and came to meet him. Its mouth was as wide and hollow as a cavern, and inside stood three rows of enormous teeth. It would have been terrifying even in a picture.
        - id: ch01-b40
          speaker: narrator
          text: >-
            And do you know what that sea monster was? It was none other than the gigantic Dog-Fish mentioned so many times in this story. Because it slaughtered so many creatures and could never satisfy its hunger, people had named it the Attila of Fish and Fishermen.
        - id: ch01-b41
          speaker: narrator
          text: >-
            Think of poor Pinocchio's terror when he saw the monster. He tried to avoid it by turning one way, then another. He struggled to escape, but that enormous open mouth kept coming toward him with the speed of an arrow.
        - id: ch01-b42
          speaker: blue_goat
          text: >-
            Hurry, Pinocchio! Please, hurry!
          emotion: fearful
        - id: ch01-b43
          speaker: narrator
          text: >-
            Pinocchio drove himself forward with his arms, his chest, his legs, and his feet.
        - id: ch01-b44
          speaker: blue_goat
          text: >-
            Faster, Pinocchio! The monster is right behind you!
          emotion: fearful
        - id: ch01-b45
          speaker: narrator
          text: >-
            Pinocchio swam faster than ever. He flew through the water with the speed of a ball fired from a gun. He was almost at the rock now. The beautiful little goat leaned far out over the sea and stretched both front legs toward him, ready to help him from the water.
        - id: ch01-b46
          speaker: narrator
          text: >-
            But it was too late. The monster had overtaken him. It drew in one tremendous breath and sucked up the poor puppet as easily as it might suck down a hen's egg. It swallowed him with such force and greed that Pinocchio slammed into the Dog-Fish's stomach. The blow left him unconscious for a full quarter of an hour.
        - id: ch01-b47
          speaker: narrator
          text: >-
            When Pinocchio finally came to after that shock, he couldn't begin to imagine what world he was in. Everything around him was completely dark. The blackness was so deep and so absolute that he felt as if he'd fallen headfirst into an inkwell filled to the top with ink.
        - id: ch01-b48
          speaker: narrator
          text: >-
            He listened closely, but he couldn't hear a sound. Only from time to time did a powerful gust of wind blow into his face. At first he couldn't understand where it came from. At last he realized it was rushing out of the monster's lungs. You see, the Dog-Fish suffered terribly from asthma. Whenever it took a breath, the air blew like a north wind.
        - id: ch01-b49
          speaker: narrator
          text: >-
            At first, Pinocchio tried his best to keep up his courage. But proof followed proof, until he could no longer deny that he was truly shut inside the body of this terrible sea monster. Then his courage failed. He began to cry, scream, and sob into the darkness.
        - id: ch01-b50
          speaker: pinocchio
          text: >-
            Help! Help! Oh, what will happen to me? Won't anyone come and save me?
          emotion: fearful
        - id: ch01-b51
          speaker: tunny
          text: >-
            And who do you think could save you, you poor unhappy creature?
        - id: ch01-b52
          speaker: narrator
          text: >-
            The voice came out of the darkness and sounded like a guitar badly out of tune. Pinocchio froze with fear.
        - id: ch01-b53
          speaker: pinocchio
          text: >-
            Who said that?
          emotion: fearful
        - id: ch01-b54
          speaker: tunny
          text: >-
            I did. I'm a poor Tunny. The Dog-Fish swallowed me at the same time it swallowed you. What kind of fish are you?
        - id: ch01-b55
          speaker: pinocchio
          text: >-
            I'm not a fish at all. I'm a puppet.
        - id: ch01-b56
          speaker: tunny
          text: >-
            If you're not a fish, why did you let the monster swallow you?
        - id: ch01-b57
          speaker: pinocchio
          text: >-
            I didn't let it! The monster swallowed me. What are we supposed to do here in the dark?
        - id: ch01-b58
          speaker: tunny
          text: >-
            Accept our fate and wait for the Dog-Fish to digest us both.
        - id: ch01-b59
          speaker: pinocchio
          text: >-
            But I don't want to be digested!
          emotion: fearful
        - id: ch01-b60
          speaker: tunny
          text: >-
            Neither do I. But I'm enough of a philosopher to find some comfort in this. When you're born a Tunny, it's more dignified to die in water than in oil.
        - id: ch01-b61
          speaker: pinocchio
          text: >-
            That's nonsense!
          emotion: angry
        - id: ch01-b62
          speaker: tunny
          text: >-
            It's my opinion. And according to the political Tunnies, opinions deserve respect.
        - id: ch01-b63
          speaker: pinocchio
          text: >-
            All I know is that I want out. I'm going to escape.
        - id: ch01-b64
          speaker: tunny
          text: >-
            Escape if you can.
        - id: ch01-b65
          speaker: pinocchio
          text: >-
            Is the Dog-Fish that swallowed us very big?
        - id: ch01-b66
          speaker: tunny
          text: >-
            Big? Just imagine this. His body is two miles long, and that doesn't even include his tail.
        - id: ch01-b67
          speaker: narrator
          text: >-
            While Pinocchio and the Tunny were talking there in the dark, Pinocchio peered into the distance. Far away, he thought he could make out a tiny point of light.
        - id: ch01-b68
          speaker: pinocchio
          text: >-
            What's that tiny light in the distance?
        - id: ch01-b69
          speaker: tunny
          text: >-
            Probably another unfortunate creature waiting to be digested, just like us.
        - id: ch01-b70
          speaker: pinocchio
          text: >-
            I'm going to find whoever it is. Maybe it's an old fish who knows a way out of here.
        - id: ch01-b71
          speaker: tunny
          text: >-
            I truly hope so, dear puppet.
        - id: ch01-b72
          speaker: pinocchio
          text: >-
            Good-bye, Tunny.
        - id: ch01-b73
          speaker: tunny
          text: >-
            Good-bye, puppet. Good luck to you.
        - id: ch01-b74
          speaker: pinocchio
          text: >-
            Where will we meet again?
        - id: ch01-b75
          speaker: tunny
          text: >-
            Who can say? It's better not to think about it.
