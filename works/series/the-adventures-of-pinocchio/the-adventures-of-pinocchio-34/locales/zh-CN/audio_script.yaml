audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖从容，带一点一本正经的幽默
        timbre: 清晰醇厚
        pace: 舒缓，遇到惊奇处略微加快
        pitch: 中
    pinocchio:
      display_name: 匹诺曹
      tts:
        delivery: 任性直率，嘴硬而孩子气，危急时急促慌张
        timbre: 清亮，带木偶般的脆响
        pace: 偏快，争辩时更急
        pitch: 中高
    purchaser:
      display_name: 买主
      tts:
        delivery: 冷淡精明，谈价时毫无怜悯
        timbre: 干涩的成年男声
        pace: 不紧不慢
        pitch: 中低
    goat:
      display_name: 蓝色小山羊
      tts:
        delivery: 亲切焦急，呼喊中满是关怀
        timbre: 清柔明亮的女声，略带羊鸣般的颤音
        pace: 急促
        pitch: 高
    tunny:
      display_name: 金枪鱼
      tts:
        delivery: 沉着认命，严肃中透着一本正经的滑稽
        timbre: 低沉粗哑，像走调的弦乐声
        pace: 缓慢
        pitch: 低
  chapters:
    - id: ch01
      title: 绳子拉上来的活木偶
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            匹诺曹已经沉在水底五十分钟了。守在岸上的买主算算时候，便对自己说道。
        - id: ch01-b02
          speaker: purchaser
          text: >-
            我那头可怜的瘸腿小驴，准已经淹死了。该把他拉上来啦。剥下那张皮，正好做一面漂亮的鼓。
        - id: ch01-b03
          speaker: narrator
          text: >-
            买主抓住绑在驴腿上的绳子，拉一下，又拉一下，再使劲拉一下。绳子终于到了水面。可冒出来的是什么？哪里有什么死驴，分明是一个活木偶，正像鳗鱼一样扭个不停。
        - id: ch01-b04
          speaker: narrator
          text: >-
            买主盯着眼前的木偶，以为自己在做梦。他嘴巴大张，两眼几乎瞪出眼眶，惊得半天说不出话。好不容易缓过神，他才哆哆嗦嗦地问。
        - id: ch01-b05
          speaker: purchaser
          text: >-
            我扔进海里的小驴呢？他哪儿去了？
        - id: ch01-b06
          speaker: pinocchio
          text: >-
            我就是那头小驴呀！
          emotion: happy
        - id: ch01-b07
          speaker: purchaser
          text: >-
            你？
        - id: ch01-b08
          speaker: pinocchio
          text: >-
            对，就是我。
        - id: ch01-b09
          speaker: purchaser
          text: >-
            好个小无赖！你居然敢拿我寻开心？
          emotion: angry
        - id: ch01-b10
          speaker: pinocchio
          text: >-
            我哪敢拿您寻开心，亲爱的主人？我说的句句都是真的。
        - id: ch01-b11
          speaker: purchaser
          text: >-
            你刚才明明是一头小驴，怎么在水里泡一会儿，就成了木偶？
        - id: ch01-b12
          speaker: pinocchio
          text: >-
            大概是海水变的吧。海水什么稀奇事都做得出来。
        - id: ch01-b13
          speaker: purchaser
          text: >-
            木偶，你可小心了！别以为能把我当傻子耍。真把我惹急了，有你好受的！
          emotion: angry
        - id: ch01-b14
          speaker: pinocchio
          text: >-
            主人，您想听真话吗？那就先把我腿上的绳子解开，我把事情全告诉您。
        - id: ch01-b15
          speaker: narrator
          text: >-
            买主实在好奇，立刻解开绳结。匹诺曹一下子自由了，快活得像只飞上天空的小鸟。他站稳以后，从头讲起。
    - id: ch02
      title: 驴皮是怎样消失的
      blocks:
        - id: ch02-b01
          speaker: pinocchio
          text: >-
            我原来就是个木偶，跟现在一模一样。我本来都快变成真正的男孩了，可我不肯读书，又听了坏朋友的话，从家里逃了出去。一天早晨，我醒来一看，自己竟长出了长耳朵和长尾巴，变成了驴！那份羞耻，就算您最狠的仇人，也不忍心叫您受一回。
        - id: ch02-b02
          speaker: pinocchio
          text: >-
            后来我被带到市场，一个马戏团班主买了我。他非要把我训练成有名的舞蹈家和跳圈高手。有一晚演出，我重重摔了一跤，两条腿都瘸了。班主留着瘸驴没用，就把我送去卖。接下来的事，您都知道，是您买下了我。
        - id: ch02-b03
          speaker: purchaser
          text: >-
            这倒一点不假。我花了整整两块钱！如今谁来赔我的钱？
        - id: ch02-b04
          speaker: pinocchio
          text: >-
            可您为什么买我呢？还不是想剥下我的皮做鼓？
        - id: ch02-b05
          speaker: purchaser
          text: >-
            没错！可现在我上哪儿再找一张驴皮？
        - id: ch02-b06
          speaker: pinocchio
          text: >-
            别灰心呀，主人。世上的小驴多着呢！
        - id: ch02-b07
          speaker: purchaser
          text: >-
            你这没规矩的小混蛋！故事到底讲完了没有？
          emotion: angry
        - id: ch02-b08
          speaker: pinocchio
          text: >-
            还差两句。您买下我，把我带到海边，原是要亲手杀掉我的。后来您起了怜悯之心，改成在我脖子上绑一块石头，把我扔进海里。您这份仁慈真给自己增光，我一辈子都会感激。可是亲爱的主人，这回您什么都算到了，就是漏算了仙女！
        - id: ch02-b09
          speaker: purchaser
          text: >-
            仙女又是谁？
        - id: ch02-b10
          speaker: pinocchio
          text: >-
            她是我的妈妈。她像所有疼爱孩子的好妈妈一样，永远惦记着自己的孩子，也一直看顾着我。哪怕我又糊涂又淘气，已经活该叫人丢下不管，她还是会来救我。
        - id: ch02-b11
          speaker: pinocchio
          text: >-
            好仙女发现我快淹死了，就叫来一大群鱼。那些鱼把我当成死驴，张嘴就啃。我以前可不知道，鱼比孩子还贪吃！有的咬耳朵，有的啃嘴巴，有的吃脖子和鬃毛，还有的撕腿上的皮和全身的毛。甚至有一条格外有礼貌的小鱼，肯屈尊把我的尾巴也吃了。
        - id: ch02-b12
          speaker: purchaser
          text: >-
            我听着都害怕！从今往后，我发誓再也不碰鱼。要是剖开一条鲻鱼，或者切开一条煎鳕鱼，里面竟掉出一截驴尾巴，那还得了！
          emotion: fearful
        - id: ch02-b13
          speaker: pinocchio
          text: >-
            我也觉得吓人。那些鱼吃光了我从头到脚的驴皮，接着就碰到了骨头。不对，应该说碰到了木头。您瞧，我全身都是最硬的木头。它们才咬几口，就发现这东西根本不是自己的牙齿吃得动的。
        - id: ch02-b14
          speaker: pinocchio
          text: >-
            鱼儿嫌这顿饭实在不好消化，马上散开了。有的朝这边，有的朝那边，各自游走，谁也没对我说一声“谢谢”。这就是事情的全部经过。现在您收回绳子，拉上来的当然是一个活木偶，不是一头死驴。
        - id: ch02-b15
          speaker: purchaser
          text: >-
            我才不信你的鬼话！我只认一件事。我花两块钱买了你，这钱必须回来。我要把你带回市场，按斤两卖掉，让人拿你这块干木头去生火！
          emotion: angry
        - id: ch02-b16
          speaker: pinocchio
          text: >-
            您想卖就卖吧，我完全乐意。
        - id: ch02-b17
          speaker: narrator
          text: >-
            话音还没落，匹诺曹猛地一跳，又扑通钻进海里。他欢欢喜喜地离开岸边，游出去一段，还不忘回头招呼那位可怜的主人。
        - id: ch02-b18
          speaker: pinocchio
          text: >-
            再见啦，主人！哪天想找驴皮做鼓，记得来找我！
          emotion: happy
        - id: ch02-b19
          speaker: narrator
          text: >-
            他笑着继续游。过了一会儿，又转回来，把声音放得更响。
        - id: ch02-b20
          speaker: pinocchio
          text: >-
            再见啦，主人！哪天缺一小块干透的木柴生火，也记得来找我！
          emotion: happy
        - id: ch02-b21
          speaker: narrator
          text: >-
            一转眼，匹诺曹已经游得只剩一个小黑点。那黑点浮在海面上，偶尔扬起两条腿，蹦一蹦，跳一跳，活像一只玩得正开心的海豚。
    - id: ch03
      title: 白色礁石与蓝色小山羊
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            匹诺曹也不知道要去哪里，只管往前游。忽然，他看见海中央立着一块白色礁石，远远望去，像是大理石雕成的。礁石顶上有一只漂亮的小山羊。她亲热地咩咩叫，不住招手，要他快游过去。
        - id: ch03-b02
          speaker: narrator
          text: >-
            更奇怪的是，小山羊的毛不是白的，不是黑的，也不是寻常的黑白杂色。那身毛蓝得明亮极了，简直和美丽小姑娘的头发一模一样。你们不难想象，匹诺曹看见这片熟悉的蓝色，心会跳得有多快。他使出双倍力气，拼命朝白色礁石游去。
        - id: ch03-b03
          speaker: narrator
          text: >-
            游到半路，水面突然升起一颗可怕的海怪脑袋，直冲他而来。怪物把嘴张得像个山洞，嘴里排着三层大牙。那副模样，就算只画在纸上，也能吓坏看画的人。
        - id: ch03-b04
          speaker: narrator
          text: >-
            这海怪是谁？正是故事里提过好几回的巨型大鲨鱼。他残杀生灵，又永远吃不饱，所以大家管他叫“鱼类和渔夫的阿提拉”。
        - id: ch03-b05
          speaker: narrator
          text: >-
            匹诺曹吓坏了。他想躲开，想转向，想从旁边逃走。可怪物那张大得仿佛没有边的巨口已经对准了他，像离弦的箭一样逼近。
        - id: ch03-b06
          speaker: goat
          text: >-
            快呀，匹诺曹！看在老天的分上，快一点！
          emotion: fearful
        - id: ch03-b07
          speaker: narrator
          text: >-
            匹诺曹用胳膊使劲划，用胸膛往前顶，两条腿和两只脚一刻不停地蹬。他拼上了所有力气。
        - id: ch03-b08
          speaker: goat
          text: >-
            再快一点，匹诺曹！怪物就追在你身后！
          emotion: fearful
        - id: ch03-b09
          speaker: narrator
          text: >-
            匹诺曹游得比刚才更快，像炮弹刚从炮口射出去一样，直奔礁石。他离礁石只差一点了。小山羊伏低身子，把两条前腿伸向海面，就要将他拉上去。
        - id: ch03-b10
          speaker: narrator
          text: >-
            可是，太迟了。大鲨鱼已经追到身后。他猛吸一口气，像吸鸡蛋似的，把可怜的木偶吸进嘴里，又凶又急地吞了下去。匹诺曹一路掉进怪物肚子，狠狠撞了一下，随即失去知觉，整整一刻钟没有醒来。
    - id: ch04
      title: 大鲨鱼的肚子里
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            匹诺曹终于醒了，却不知道自己究竟掉进了什么地方。周围黑得看不见一丁点东西，那黑暗又浓又深，简直像有人把他头朝下塞进了装满墨水的墨水瓶。
        - id: ch04-b02
          speaker: narrator
          text: >-
            他侧耳听了又听，四周一点声音也没有。只有一阵阵大风，隔一会儿就迎面吹来。起初，他怎么也猜不出风从哪儿来。后来才明白，那是从怪物的肺里吹出来的。原来这条大鲨鱼气喘得很厉害，每呼吸一次，就像刮过一阵北风。
        - id: ch04-b03
          speaker: narrator
          text: >-
            匹诺曹刚开始还想给自己壮胆。可眼前一件又一件事都在告诉他，他真的被关在海怪身体里了。想到这里，他再也撑不住，哭着喊着，抽抽噎噎地求救。
        - id: ch04-b04
          speaker: pinocchio
          text: >-
            救命啊！快救救我！我怎么这么倒霉！难道真的没有人来救我吗？
          emotion: fearful
        - id: ch04-b05
          speaker: tunny
          text: >-
            你这个可怜虫，还指望谁来救你呢？
        - id: ch04-b06
          speaker: narrator
          text: >-
            黑暗里传来的声音，像一把走了调的吉他。匹诺曹听得浑身发冷。
        - id: ch04-b07
          speaker: pinocchio
          text: >-
            是谁？谁在那儿说话？
          emotion: fearful
        - id: ch04-b08
          speaker: tunny
          text: >-
            是我。我是一条倒霉的金枪鱼，和你同时被大鲨鱼吞进来的。你是哪一种鱼？
        - id: ch04-b09
          speaker: pinocchio
          text: >-
            我可不是鱼，跟鱼一点关系都没有。我是一个木偶。
        - id: ch04-b10
          speaker: tunny
          text: >-
            既然不是鱼，你干吗还让怪物吞掉？
        - id: ch04-b11
          speaker: pinocchio
          text: >-
            不是我让他吞，是他硬把我吞下来的！现在困在这么黑的地方，我们该怎么办？
        - id: ch04-b12
          speaker: tunny
          text: >-
            认命吧。除了等着大鲨鱼把我们两个都消化掉，还能怎么办？
        - id: ch04-b13
          speaker: pinocchio
          text: >-
            可我不想被消化！
          emotion: fearful
        - id: ch04-b14
          speaker: narrator
          text: >-
            匹诺曹又号啕大哭起来。金枪鱼听见哭声，继续慢吞吞地说。
        - id: ch04-b15
          speaker: tunny
          text: >-
            我当然也不想被消化。不过我还算有点哲学家的气度。既然生来是一条金枪鱼，那么死在水里，总比死在油锅里体面。这样一想，我也就不那么难受了。
        - id: ch04-b16
          speaker: pinocchio
          text: >-
            这根本就是胡说八道！
          emotion: angry
        - id: ch04-b17
          speaker: tunny
          text: >-
            这是我的看法。那些从政的金枪鱼都说了，别人的看法应该受到尊重。
        - id: ch04-b18
          speaker: pinocchio
          text: >-
            不管怎么说，我一定要离开这儿。我要逃出去。
        - id: ch04-b19
          speaker: tunny
          text: >-
            你有这个本事，那就逃吧！
    - id: ch05
      title: 黑暗中的一点亮光
      blocks:
        - id: ch05-b01
          speaker: pinocchio
          text: >-
            吞掉我们的大鲨鱼，到底有多大？
        - id: ch05-b02
          speaker: tunny
          text: >-
            有多大？单是身子就足足两英里长，这还不算尾巴呢！
        - id: ch05-b03
          speaker: narrator
          text: >-
            他们在黑暗里说着话，匹诺曹忽然发现，远处好像有一点光。
        - id: ch05-b04
          speaker: pinocchio
          text: >-
            你看见了吗？远处那一点亮光是什么？
        - id: ch05-b05
          speaker: tunny
          text: >-
            大概是另一个倒霉的同伴吧。他也和我们一样，正等着被消化。
        - id: ch05-b06
          speaker: pinocchio
          text: >-
            我要过去找他。说不定那是一条年纪很大的老鱼，还能教我们怎么逃出去。你觉得有没有可能？
        - id: ch05-b07
          speaker: tunny
          text: >-
            亲爱的木偶，我真心盼着你猜对。
        - id: ch05-b08
          speaker: pinocchio
          text: >-
            再见了，金枪鱼。
        - id: ch05-b09
          speaker: tunny
          text: >-
            再见，木偶。祝你好运。
        - id: ch05-b10
          speaker: pinocchio
          text: >-
            那我们以后到哪里再见？
        - id: ch05-b11
          speaker: tunny
          text: >-
            谁知道呢？这件事啊，最好连想也别想！
