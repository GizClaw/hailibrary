audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖从容，带一点一本正经的幽默
        timbre: 清晰醇厚
        pace: 舒缓，遇到惊奇处略微加快
        pitch: 中
    pinocchio:
      display_name: 匹诺曹
      tts:
        delivery: 任性直率，嘴硬而孩子气，发怒时冲动急躁
        timbre: 清亮，带木偶般的脆响
        pace: 偏快，争辩时更急
        pitch: 中高
    schoolboys:
      display_name: 同学们
      tts:
        delivery: 顽皮吵闹，起哄时满是恶作剧般的得意
        timbre: 明亮稚嫩，带少年人的喧闹感
        pace: 偏快
        pitch: 中高
    crab:
      display_name: 大螃蟹
      tts:
        delivery: 严厉正直，劝告时又急又重
        timbre: 沙哑浑厚，像患了伤风的喇叭
        pace: 缓慢
        pitch: 低
    eugene:
      display_name: 欧仁
      tts:
        delivery: 稚嫩急促，受伤时虚弱惊恐
        timbre: 单薄清亮
        pace: 偏慢
        pitch: 中高
    gendarmes:
      display_name: 宪兵
      tts:
        delivery: 严肃强硬，问话简短，不容争辩
        timbre: 冷峻有力
        pace: 稳健
        pitch: 中低
  chapters:
    - id: ch01
      title: 根本没有大鲨鱼
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 匹诺曹到了海边，马上朝海上望去。哪里有什么大鲨鱼？大海静静的，平得像一面巨大的水晶镜子。
        - id: ch01-b02
          speaker: pinocchio
          text: 大鲨鱼呢？它在哪儿？
        - id: ch01-b03
          speaker: schoolboys
          text: 它八成吃早饭去了。
        - id: ch01-b04
          speaker: narrator
          text: 一个孩子笑出了声。另一个笑得更响，也跟着胡说起来。
        - id: ch01-b05
          speaker: schoolboys
          text: 说不定它回床上睡小觉去了！
        - id: ch01-b06
          speaker: narrator
          text: 这些荒唐话一出口，再听听那阵傻笑，匹诺曹全明白了。伙伴们编了一通谎话，把他当傻瓜骗到了这里。他越想越气，立刻质问他们。
        - id: ch01-b07
          speaker: pinocchio
          text: 你们用大鲨鱼的故事把我骗来，到底觉得哪里好玩？
          emotion: angry
        - id: ch01-b08
          speaker: schoolboys
          text: 哪儿都好玩，简直好玩极了！
        - id: ch01-b09
          speaker: pinocchio
          text: 那你们倒说说，究竟有什么好玩的？
        - id: ch01-b10
          speaker: schoolboys
          text: 我们让你没上成学，还把你骗来一起玩，这还不好玩吗？你每天准时到校，功课也总那么用心，难道不嫌丢脸？读书那么拼命，你也不害臊！
        - id: ch01-b11
          speaker: pinocchio
          text: 我爱用功，跟你们有什么关系？
        - id: ch01-b12
          speaker: schoolboys
          text: 关系可大了！你这么一用功，老师看我们就更不顺眼。
        - id: ch01-b13
          speaker: pinocchio
          text: 这是为什么？
        - id: ch01-b14
          speaker: schoolboys
          text: 因为有你这种爱学习的孩子在旁边一比，我们这些不想学的人就显得更差了。凭什么呀？我们也要面子的！
        - id: ch01-b15
          speaker: pinocchio
          text: 那我要怎么做，你们才满意？
        - id: ch01-b16
          speaker: schoolboys
          text: 跟我们学。学校、功课、老师，这三个最大的仇敌，你都得讨厌。
        - id: ch01-b17
          speaker: pinocchio
          text: 可我要是还想念书呢？
        - id: ch01-b18
          speaker: schoolboys
          text: 那就别再跟我们来往。只要逮到机会，我们还要让你吃苦头。
        - id: ch01-b19
          speaker: narrator
          text: 木偶摇摇头，实在觉得他们可笑。
        - id: ch01-b20
          speaker: pinocchio
          text: 说真的，你们都快把我逗笑了。
        - id: ch01-b21
          speaker: narrator
          text: 个头最大的孩子走上前，迎面逼住了他。
        - id: ch01-b22
          speaker: schoolboys
          text: 匹诺曹，少摆出那副了不起的样子！别跑来跟我们逞威风。你不怕我们，我们也不怕你。记住，你只有一个，我们却有七个！
          emotion: angry
        - id: ch01-b23
          speaker: pinocchio
          text: 七个？正好凑齐七宗罪！
        - id: ch01-b24
          speaker: narrator
          text: 匹诺曹说完，放声大笑。孩子们可笑不出来了。
        - id: ch01-b25
          speaker: schoolboys
          text: 听见没有？他把我们全骂成七宗罪了！先赏你一拳，留着晚上当饭吃！
          emotion: angry
    - id: ch02
      title: 书本飞进大海
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 一个孩子说着，一拳打中了匹诺曹的脑袋。木偶当然马上还了一拳。就这样，你打我，我打你，转眼间，八个孩子全都扭在一起，打得不可开交。
        - id: ch02-b02
          speaker: narrator
          text: 匹诺曹只有一个人，却抵挡得像个英雄。他的木脚硬得出奇，踢到哪儿，哪儿就留下一块淤青。谁吃过它的苦头，都不敢再随便靠近。
        - id: ch02-b03
          speaker: narrator
          text: 那些孩子近不了木偶的身，气得发狂，只好换武器。他们打开书包，把语法书、字典、拼写课本、地理书，还有别的课本，一本接一本扔向匹诺曹。
        - id: ch02-b04
          speaker: narrator
          text: 可木偶眼睛尖，动作又快。每逢课本飞来，他就及时把头一低。所有的书都越过他的脑袋，扑通扑通掉进了海里。
        - id: ch02-b05
          speaker: narrator
          text: 海里的鱼可吃惊了。它们还以为天上掉下了食物，成群游过来，尝尝这一页，再咬咬那张扉页。谁知刚入口，它们就全吐了出来，还皱起脸，仿佛在抱怨，这根本不是鱼吃的东西，它们平常的食物可好得多。
        - id: ch02-b06
          speaker: narrator
          text: 岸上的架越打越凶。这时，一只大螃蟹从水里出来，慢慢爬上岸。它一开口，那沙哑的嗓音，就像一把害了重伤风的喇叭。
        - id: ch02-b07
          speaker: crab
          text: 住手，你们这些小无赖！你们可不就是小无赖吗？孩子们这样拳脚相加，从来很少有好下场。非出事不可！
          emotion: angry
        - id: ch02-b08
          speaker: narrator
          text: 可怜的螃蟹等于在劝风停下来，谁也不听。连匹诺曹这个小坏蛋都回过头，嘲笑似的看着它，说话也很无礼。
        - id: ch02-b09
          speaker: pinocchio
          text: 你这只烦人的螃蟹，别出声了！快含几颗甘草糖，把你那伤风的嗓子治好吧。
        - id: ch02-b10
          speaker: narrator
          text: 孩子们已经扔光了自己的课本。他们一眼看见不远处的书包属于匹诺曹，立刻冲过去抢到手里。
        - id: ch02-b11
          speaker: narrator
          text: 书包里有一本算术课本。封面是结实的硬纸板，书脊和书角还包着羊皮。一个孩子抓起它，瞄准匹诺曹的头，用尽力气扔了出去。
        - id: ch02-b12
          speaker: narrator
          text: 这本书没碰到木偶，却正中另一个孩子的太阳穴。那孩子的脸一下白得像纸。
        - id: ch02-b13
          speaker: eugene
          text: 妈妈！快救我，我要死了！
          emotion: fearful
        - id: ch02-b14
          speaker: narrator
          text: 他只说出这一句话，就直挺挺倒在沙滩上。伙伴们以为他死了，吓得拼命逃跑。几分钟以后，一个人影也看不见了。
    - id: ch03
      title: 欧仁倒在沙滩上
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 只有匹诺曹留在原地。他又怕又难过，自己也像快要死了，可还是跑到海边浸湿手帕，给受伤的同学敷太阳穴。他哭得伤心极了，不住地喊着欧仁。
        - id: ch03-b02
          speaker: pinocchio
          text: 欧仁，可怜的欧仁，你睁开眼睛看看我！为什么不回答？不是我干的，真的不是我伤了你，你一定要相信我！睁眼吧，欧仁。你再不睁眼，我也活不下去了。
          emotion: fearful
        - id: ch03-b03
          speaker: pinocchio
          text: 我现在该怎么办？我怎么回家，还有什么脸去见善良的妈妈？以后我会怎样？又能逃到哪里？早知道我就去学校了，那该好上一千倍！我为什么要听这些伙伴的话？他们把我害惨了。老师提醒过我，妈妈也总说，要小心坏伙伴。
          emotion: sad
        - id: ch03-b04
          speaker: pinocchio
          text: 唉，我怎么办？怎么办？到底该怎么办？
          emotion: sad
        - id: ch03-b05
          speaker: narrator
          text: 匹诺曹一边抽噎，一边用拳头捶自己的脑袋，嘴里还叫着欧仁的名字。忽然，有脚步声朝他走来。他回头一看，是两名宪兵。
        - id: ch03-b06
          speaker: gendarmes
          text: 你趴在地上干什么？
        - id: ch03-b07
          speaker: pinocchio
          text: 我在救我的同学。
        - id: ch03-b08
          speaker: gendarmes
          text: 他受伤了？
        - id: ch03-b09
          speaker: pinocchio
          text: 看上去像是受伤了。
        - id: ch03-b10
          speaker: narrator
          text: 一名宪兵弯下腰，把欧仁仔细看了看。
        - id: ch03-b11
          speaker: gendarmes
          text: 不是看上去，他确实受伤了，伤在太阳穴。是谁打的？
        - id: ch03-b12
          speaker: narrator
          text: 匹诺曹喘不上气，话也说不利索。
        - id: ch03-b13
          speaker: pinocchio
          text: 不，不是我。
          emotion: fearful
        - id: ch03-b14
          speaker: gendarmes
          text: 不是你，那是谁？
        - id: ch03-b15
          speaker: pinocchio
          text: 真的不是我。
        - id: ch03-b16
          speaker: gendarmes
          text: 他被什么打伤了？
        - id: ch03-b17
          speaker: narrator
          text: 木偶从地上捡起那本算术课本。它有硬纸板封面，书脊和书角包着羊皮。他把书递给宪兵。
        - id: ch03-b18
          speaker: pinocchio
          text: 就是这本书。
        - id: ch03-b19
          speaker: gendarmes
          text: 书是谁的？
        - id: ch03-b20
          speaker: pinocchio
          text: 是我的。
        - id: ch03-b21
          speaker: gendarmes
          text: 够了，别的不用说。站起来，立刻跟我们走。
        - id: ch03-b22
          speaker: pinocchio
          text: 可是我……
        - id: ch03-b23
          speaker: gendarmes
          text: 跟我们走！
        - id: ch03-b24
          speaker: pinocchio
          text: 我是无辜的！
        - id: ch03-b25
          speaker: gendarmes
          text: 马上跟我们走！
    - id: ch04
      title: 獒犬追来了
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 临走前，宪兵看见几个渔夫正好坐船经过岸边，便叫住了他们。
        - id: ch04-b02
          speaker: gendarmes
          text: 这个孩子头上受了伤，现在交给你们。把他带回家照料好，我们明天会去看他。
        - id: ch04-b03
          speaker: narrator
          text: 随后，两个宪兵把匹诺曹夹在中间，命令他赶快上路。
        - id: ch04-b04
          speaker: gendarmes
          text: 往前走，快一点！不然你可要吃苦头。
        - id: ch04-b05
          speaker: narrator
          text: 匹诺曹不等他们再催，就沿着通往村庄的路走了起来。可这个可怜的小家伙已经晕头转向。他觉得眼前的一切像一场梦，一场可怕透顶的噩梦。
        - id: ch04-b06
          speaker: narrator
          text: 他心里乱成一团，眼前的东西全有两重影子。腿在发抖，舌头粘住上腭，连一个字都说不出。可在这一片惊恐和麻木中，有个念头像尖刺一样扎着他的心。
        - id: ch04-b07
          speaker: narrator
          text: 两名宪兵会押着他，从善良的仙女家窗下经过。匹诺曹一想到这件事，宁可马上死掉。
        - id: ch04-b08
          speaker: narrator
          text: 他们进了村庄。一阵风突然刮来，把匹诺曹的帽子掀走，足足吹到了十码之外。
        - id: ch04-b09
          speaker: pinocchio
          text: 请问，我能去把帽子捡回来吗？
        - id: ch04-b10
          speaker: gendarmes
          text: 去吧，动作要快。
        - id: ch04-b11
          speaker: narrator
          text: 木偶跑过去捡起帽子，却不往头上戴。他把帽子叼在嘴里，转身就朝海边拼命飞奔。
        - id: ch04-b12
          speaker: narrator
          text: 宪兵觉得自己追不上他，便放出一条大獒犬。那条狗参加过所有赛狗比赛，每次都拿第一。匹诺曹跑得快，獒犬却跑得更快。
        - id: ch04-b13
          speaker: narrator
          text: 大家都急着想知道这场拼命的追逐会有什么结果。人们挤到窗口，又涌上街头，眼巴巴地等着看最后的结局。
