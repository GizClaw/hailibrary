  chapters:
    - id: ch01
      title: Pinocchio Is Arrested by the Gendarmes
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Pinocchio reached the shore and searched the sea. There was no Dog-Fish anywhere. The water lay smooth as a huge crystal mirror.
        - id: ch01-b02
          speaker: pinocchio
          text: Where is the Dog-Fish?
        - id: ch01-b03
          speaker: narrator
          text: He turned to the boys who had brought him there.
        - id: ch01-b04
          speaker: schoolboy_1
          text: Maybe he went off to eat breakfast!
        - id: ch01-b05
          speaker: narrator
          text: The boy laughed.
        - id: ch01-b06
          speaker: schoolboy_2
          text: Or maybe he's in bed taking a little nap!
        - id: ch01-b07
          speaker: narrator
          text: That brought even louder laughter. Their foolish answers told Pinocchio everything. They had invented the whole story just to make a fool of him. He took it badly and turned on them.
        - id: ch01-b08
          speaker: pinocchio
          text: So tell me, what was so funny about tricking me with that story about the Dog-Fish?
          emotion: angry
        - id: ch01-b09
          speakers: [schoolboy_1, schoolboy_2, schoolboy_3, schoolboy_4]
          ensemble: chorus
          text: It was great fun!
        - id: ch01-b10
          speaker: pinocchio
          text: What part of it was fun?
        - id: ch01-b11
          speaker: schoolboy_3
          text: We got you to miss school and come with us. Aren't you ashamed of always being on time, doing every lesson, and studying so hard?
        - id: ch01-b12
          speaker: pinocchio
          text: If I study hard, why should you care?
        - id: ch01-b13
          speaker: schoolboy_4
          text: Because you make the rest of us look bad to the schoolmaster. Some of us don't want to learn, and then a boy like you comes along and makes us look even worse. We have our pride too, you know!
        - id: ch01-b14
          speaker: pinocchio
          text: Then what do you want me to do?
        - id: ch01-b15
          speaker: schoolboy_1
          text: Be like us. Hate school, hate lessons, and hate the schoolmaster. They're our three worst enemies.
        - id: ch01-b16
          speaker: pinocchio
          text: And what if I want to keep studying?
        - id: ch01-b17
          speaker: schoolboy_2
          text: Then we're done with you. And the first chance we get, we'll make you sorry.
        - id: ch01-b18
          speaker: narrator
          text: Pinocchio shook his head.
        - id: ch01-b19
          speaker: pinocchio
          text: You boys really make me laugh.
        - id: ch01-b20
          speaker: narrator
          text: The biggest boy stepped right up to him.
        - id: ch01-b21
          speaker: schoolboy_1
          text: Hey, Pinocchio! Stop acting better than us. Don't come crowing around here. You may not be afraid of us, but we're not afraid of you either. There are seven of us, and only one of you.
          emotion: angry
        - id: ch01-b22
          speaker: pinocchio
          text: Seven of you, just like the seven deadly sins!
        - id: ch01-b23
          speaker: narrator
          text: Pinocchio burst out laughing.
        - id: ch01-b24
          speaker: schoolboy_3
          text: Did you hear that? He insulted every one of us! He called us the seven deadly sins!
          emotion: angry
        - id: ch01-b25
          speaker: schoolboy_4
          text: Here, take this now. You can save it for supper!
          emotion: angry
        - id: ch01-b26
          speaker: narrator
          text: The boy punched Pinocchio on the head. Pinocchio gave as good as he got and struck back at once. In a moment all seven boys were fighting him, and the struggle became wild and desperate.
        - id: ch01-b27
          speaker: narrator
          text: Pinocchio stood alone against all seven, but he fought like a hero. He kicked and defended himself with his feet, which were made of the hardest wood. He used them so well that the boys had to keep a respectful distance. Whenever one of those wooden feet landed, it left a bruise behind as a reminder.
        - id: ch01-b28
          speaker: narrator
          text: The boys grew furious because they could not get close enough to beat him with their fists. So they opened their satchels and began hurling schoolbooks. Grammars, dictionaries, spelling books, geography books, and every other kind flew through the air. But Pinocchio had quick eyes. Each time a book came at him, he ducked, and it sailed over his head into the sea.
        - id: ch01-b29
          speaker: narrator
          text: Just imagine how astonished the fish were! They came rushing in great schools because they thought the books must be food. First they tasted a page or two. Some even tried the pictures at the front. Then they spat everything out at once. They pulled such sour faces that they seemed to be saying, “This isn't food for us. We're used to much better things than this!”
        - id: ch01-b30
          speaker: narrator
          text: The fight only grew fiercer. Then a large crab climbed slowly out of the water and onto the shore. His hoarse voice sounded like a trumpet with a terrible cold.
        - id: ch01-b31
          speaker: crab
          text: Stop that, you young ruffians! That's exactly what you are. Fights like this between boys hardly ever end well. Something terrible is bound to happen!
        - id: ch01-b32
          speaker: narrator
          text: The poor crab might as well have warned the wind. Even Pinocchio turned and mocked him rudely.
        - id: ch01-b33
          speaker: pinocchio
          text: Oh, be quiet, you tiresome crab! Go suck on a licorice drop for that cold in your throat.
        - id: ch01-b34
          speaker: narrator
          text: By then the boys had thrown every one of their own books. They spotted Pinocchio's satchel lying a short distance away, rushed over, and took possession of it. Inside was a Treatise on Arithmetic, a heavy book with a strong cardboard cover and parchment along its spine and corners.
        - id: ch01-b35
          speaker: narrator
          text: One boy snatched it up, aimed at Pinocchio's head, and threw it with all his strength. The book missed the puppet. It struck Eugene, one of the other boys, squarely on the temple. Eugene turned white as a sheet.
        - id: ch01-b36
          speaker: eugene
          text: Oh, Mother! Help me! I'm dying!
          emotion: fearful
        - id: ch01-b37
          speaker: narrator
          text: He fell full length on the sand. The other boys thought he was dead. Terrified, they ran at once, as fast as their legs could carry them, and within minutes they had disappeared.
        - id: ch01-b38
          speaker: narrator
          text: Pinocchio was the only one who stayed. He was so full of grief and fear that he felt more dead than alive. Even so, he ran to the water, soaked his handkerchief in the sea, and began bathing poor Eugene's temples. He cried bitterly and called his schoolmate by name.
        - id: ch01-b39
          speaker: pinocchio
          text: Eugene! Poor Eugene! Open your eyes. Look at me! Why won't you answer? I didn't do this. I truly didn't hurt you. Please believe me! Open your eyes, Eugene. If you keep them shut, I'll die too. Oh, what am I going to do? How can I ever go home? How can I face my good mamma? What will happen to me? Where can I run? I should have gone to school. A thousand times better to go to school than listen to those boys! They've ruined me. The schoolmaster warned me, and my mamma kept warning me too. She said, “Be careful of bad companions!” Oh, dear! What will happen to me? What will happen to me? What will happen to me?
          emotion: fearful
        - id: ch01-b40
          speaker: narrator
          text: Pinocchio sobbed, struck his own head with his fists, and kept calling Eugene's name. Then he heard footsteps coming closer. He looked up and saw two soldiers.
        - id: ch01-b41
          speaker: soldier_1
          text: What are you doing there beside that boy on the ground?
        - id: ch01-b42
          speaker: pinocchio
          text: I'm trying to help my schoolmate.
        - id: ch01-b43
          speaker: soldier_2
          text: Is he hurt?
        - id: ch01-b44
          speaker: pinocchio
          text: It looks that way.
        - id: ch01-b45
          speaker: narrator
          text: One soldier bent down and looked closely at Eugene.
        - id: ch01-b46
          speaker: soldier_1
          text: Hurt? He certainly is. This boy has a wound on his temple. Who did it?
        - id: ch01-b47
          speaker: pinocchio
          text: N-not me.
          emotion: fearful
        - id: ch01-b48
          speaker: soldier_2
          text: If you didn't do it, then who did?
        - id: ch01-b49
          speaker: pinocchio
          text: It wasn't me!
          emotion: fearful
        - id: ch01-b50
          speaker: soldier_1
          text: What was he hit with?
        - id: ch01-b51
          speaker: pinocchio
          text: This book.
        - id: ch01-b52
          speaker: narrator
          text: Pinocchio picked up the Treatise on Arithmetic and showed them its cardboard-and-parchment cover.
        - id: ch01-b53
          speaker: soldier_2
          text: Who owns it?
        - id: ch01-b54
          speaker: pinocchio
          text: I do.
        - id: ch01-b55
          speaker: soldier_1
          text: That's enough. We don't need to hear anything more. Get up and come with us, now.
        - id: ch01-b56
          speaker: pinocchio
          text: But I—
        - id: ch01-b57
          speaker: soldier_2
          text: Come with us!
        - id: ch01-b58
          speaker: pinocchio
          text: But I'm innocent!
        - id: ch01-b59
          speaker: soldier_1
          text: Come along!
        - id: ch01-b60
          speaker: narrator
          text: Before leaving, the soldiers called to some fishermen who happened to be passing close to shore in their boat at that very moment.
        - id: ch01-b61
          speaker: soldier_2
          text: We're leaving this wounded boy in your care. Take him home and look after him. We'll come to see him tomorrow.
        - id: ch01-b62
          speaker: narrator
          text: Then the soldiers put Pinocchio between them and gave him an order.
        - id: ch01-b63
          speaker: soldier_1
          text: Forward! Walk quickly, or things will be worse for you.
        - id: ch01-b64
          speaker: narrator
          text: Pinocchio did not need to be told twice. He started down the road toward the village, though the poor puppet hardly knew where he was or what was happening around him. It all felt like a terrible dream, and he could not think straight. He saw two of everything. His legs trembled beneath him, and his tongue stuck to the roof of his mouth so tightly that he could not say a word.
        - id: ch01-b65
          speaker: narrator
          text: Yet one cruel thought pierced through all that numbness like a thorn. He would have to pass the good Fairy's house with a soldier on either side of him. She would see him being marched beneath her windows. The thought hurt so much that Pinocchio would rather have died.
        - id: ch01-b66
          speaker: narrator
          text: They had reached the village when a gust of wind tore Pinocchio's cap from his head and carried it about ten yards away.
        - id: ch01-b67
          speaker: pinocchio
          text: May I go get my cap?
        - id: ch01-b68
          speaker: soldier_2
          text: Go on, then. But be quick.
        - id: ch01-b69
          speaker: narrator
          text: Pinocchio went over and picked up the cap, but he did not put it back on his head. Instead, he caught it firmly between his teeth and suddenly ran toward the seashore with all his might.
        - id: ch01-b70
          speaker: narrator
          text: The soldiers knew they would have trouble catching him, so they sent a great mastiff racing after him. This dog had won first prize in every dog race. Pinocchio ran with all his strength, but the mastiff ran faster. People leaned eagerly from their windows. Others crowded into the street, all desperate to see how that wild race would end.
