audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖从容，带一点一本正经的幽默
        timbre: 清晰醇厚
        pace: 舒缓，遇到惊奇处略微加快
        pitch: 中
    master_cherry:
      display_name: 樱桃师傅
      tts:
        delivery: 老实直率，受惊时慌乱结巴
        timbre: 粗哑而亲切
        pace: 中等，紧张时急促
        pitch: 中低
    piece_of_wood:
      display_name: 木头里的细小声音
      tts:
        delivery: 像孩子一样清脆灵动，疼痛时委屈
        timbre: 细小明亮
        pace: 稍快
        pitch: 高
    geppetto:
      display_name: 杰佩托
      tts:
        delivery: 活泼直率，发怒时火爆而有喜剧感
        timbre: 苍老而响亮
        pace: 中等，争吵时急促
        pitch: 中高
  chapters:
    - id: ch01
      title: 杰佩托登门
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 就在这时候，有人敲了敲铺门。木匠瘫在地上，连站起来的力气都没恢复，只能有气无力地应了一声。
        - id: ch01-b02
          speaker: master_cherry
          text: 请进吧。
        - id: ch01-b03
          speaker: narrator
          text: 走进来的是个活泼的小老头，名叫杰佩托。附近的孩子想把他惹火，就喊他“玉米糊”。谁叫他那顶黄假发，看着实在像玉米面做的糊糕呢。杰佩托偏偏又是个火爆脾气。谁敢这样叫他，他准会暴跳如雷，谁拦都没用。
        - id: ch01-b04
          speaker: geppetto
          text: 您好，安东尼奥师傅。您怎么坐到地上去了？
        - id: ch01-b05
          speaker: master_cherry
          text: 我正教蚂蚁认字母呢。
        - id: ch01-b06
          speaker: geppetto
          text: 那您可有得忙了。
        - id: ch01-b07
          speaker: master_cherry
          text: 杰佩托邻居，今天什么风把您吹来了？
        - id: ch01-b08
          speaker: geppetto
          text: 是我的两条腿把我带来的。说正经的，安东尼奥师傅，我想求您帮个忙。
        - id: ch01-b09
          speaker: narrator
          text: 木匠嘴上说着乐意效劳，身子却只勉强跪了起来。
        - id: ch01-b10
          speaker: master_cherry
          text: 您尽管说，我能帮的一定帮。
        - id: ch01-b11
          speaker: geppetto
          text: 今天一早，我忽然有了个主意。
        - id: ch01-b12
          speaker: master_cherry
          text: 那就说来听听吧。
        - id: ch01-b13
          speaker: geppetto
          text: 我想做个漂亮的木偶。他要会跳舞，会击剑，还能像杂技演员一样翻腾跳跃。以后我带着他走遍世界，挣到一块面包，再挣到一杯酒。您说这主意怎么样？
        - id: ch01-b14
          speaker: narrator
          text: 那个细小的声音又冒了出来，谁也听不出它究竟藏在哪儿。
        - id: ch01-b15
          speaker: piece_of_wood
          text: 这主意真棒，玉米糊！
    - id: ch02
      title: 两顶假发换了主人
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 杰佩托听见自己的外号，气得整张脸都红了，活像一只火鸡。他猛地转向木匠，冲着他发起火来。
        - id: ch02-b02
          speaker: geppetto
          text: 您干吗这样侮辱我？
          emotion: angry
        - id: ch02-b03
          speaker: master_cherry
          text: 我什么时候侮辱您了？
        - id: ch02-b04
          speaker: geppetto
          text: 刚才就是您叫我玉米糊！
          emotion: angry
        - id: ch02-b05
          speaker: master_cherry
          text: 那句话不是我说的！
        - id: ch02-b06
          speaker: geppetto
          text: 难道我会拿这个外号叫自己吗？明明就是您！
          emotion: angry
        - id: ch02-b07
          speaker: master_cherry
          text: 我说了，不是我！
        - id: ch02-b08
          speaker: geppetto
          text: 我说就是您！
        - id: ch02-b09
          speaker: master_cherry
          text: 绝对不是我！
        - id: ch02-b10
          speaker: geppetto
          text: 绝对就是您！
        - id: ch02-b11
          speaker: narrator
          text: 两个老头越吵火气越大，嘴上的争斗很快变成了拳脚。他们扑向对方，又咬又打，又抓又挠。等这一架打完，杰佩托的黄假发已经落在安东尼奥师傅手里，木匠的灰假发却咬在了杰佩托的牙齿中间。
        - id: ch02-b12
          speaker: master_cherry
          text: 快把我的假发还给我！
          emotion: angry
        - id: ch02-b13
          speaker: geppetto
          text: 您也把我的还来，咱们再做朋友吧。
        - id: ch02-b14
          speaker: narrator
          text: 两个人各自戴回自己的假发，握手言和，还发誓这辈子到死都要做朋友。木匠为了表明这场架真的过去了，又问起杰佩托的来意。
        - id: ch02-b15
          speaker: master_cherry
          text: 好了，杰佩托邻居，您到底想让我帮什么忙？
        - id: ch02-b16
          speaker: geppetto
          text: 我想拿一小块木头做木偶。您能送我一块吗？
    - id: ch03
      title: 木头惹起第二场大战
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 安东尼奥师傅一听，别提多高兴了。他赶紧走到工作台边，把那块吓坏过他的木头拿来，准备交给朋友。谁知木头忽然一抖，猛地从他手中扭了出去，狠狠撞上杰佩托干瘦的小腿。
        - id: ch03-b02
          speaker: geppetto
          text: 哎哟！安东尼奥师傅，您就是这么客气地送礼吗？我的腿差点儿让您打瘸了！
          emotion: angry
        - id: ch03-b03
          speaker: master_cherry
          text: 我对您发誓，这可不是我干的！
        - id: ch03-b04
          speaker: geppetto
          text: 这么说，还是我自己打了自己？
        - id: ch03-b05
          speaker: master_cherry
          text: 要怪就怪这块木头！
        - id: ch03-b06
          speaker: geppetto
          text: 我知道撞我的是木头，可拿木头打我腿的人是您！
        - id: ch03-b07
          speaker: master_cherry
          text: 我根本没拿它打您！
        - id: ch03-b08
          speaker: geppetto
          text: 您就是个骗子！
        - id: ch03-b09
          speaker: master_cherry
          text: 杰佩托，您再骂我，我可要叫您玉米糊了！
        - id: ch03-b10
          speaker: geppetto
          text: 您这个无赖！
        - id: ch03-b11
          speaker: master_cherry
          text: 您才是玉米糊！
        - id: ch03-b12
          speaker: geppetto
          text: 您这头蠢驴！
        - id: ch03-b13
          speaker: master_cherry
          text: 您就是玉米糊！
        - id: ch03-b14
          speaker: geppetto
          text: 您这只狒狒！
        - id: ch03-b15
          speaker: master_cherry
          text: 您还是玉米糊！
        - id: ch03-b16
          speaker: narrator
          text: 第三次听见这个外号，杰佩托气得发了狂，一头扑向木匠。两个人又拼命厮打起来。大战结束时，安东尼奥师傅鼻子上添了两道抓痕，对手的背心也掉了两颗纽扣。这下双方算是扯平了。他们握握手，又发誓往后余生都要做彼此的好朋友。
        - id: ch03-b17
          speaker: narrator
          text: 杰佩托抱起那块上好的木头，向安东尼奥师傅道了谢，然后一瘸一拐地回家去了。
