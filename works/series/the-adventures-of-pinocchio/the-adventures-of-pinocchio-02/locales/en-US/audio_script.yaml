audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm and story-rich
        timbre: clear and rounded
        pace: measured
        pitch: medium
    master_cherry:
      display_name: Master Cherry
      tts:
        delivery: kindly and expressive
        timbre: warm and slightly raspy
        pace: unhurried
        pitch: medium-low
    wood_voice:
      display_name: Little Voice
      tts:
        delivery: childlike and lively
        timbre: small and bright
        pace: natural
        pitch: high
    geppetto:
      display_name: Geppetto
      tts:
        delivery: lively and quick-tempered
        timbre: thin and weathered
        pace: brisk
        pitch: medium-high
  chapters:
    - id: ch01
      title: Master Cherry Gives the Wood Away
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Just then, someone knocked at the shop door.
        - id: ch01-b02
          speaker: master_cherry
          text: Come in.
        - id: ch01-b03
          speaker: narrator
          text: Master Cherry still did not have the strength to get up from the floor. A lively little old man came straight into the shop. His name was Geppetto. But the neighborhood boys had another name for him when they wanted to make him angry. They called him Pudding because his yellow wig looked so much like a pudding made from Indian corn.
        - id: ch01-b04
          speaker: narrator
          text: Geppetto had a fiery temper. Anyone who called him Pudding had better watch out. He would fly into such a rage that no one could stop him.
        - id: ch01-b05
          speaker: geppetto
          text: Good day, Master Antonio. What are you doing down there on the floor?
        - id: ch01-b06
          speaker: master_cherry
          text: I'm teaching the ants their alphabet.
        - id: ch01-b07
          speaker: geppetto
          text: Well, I hope they learn something.
        - id: ch01-b08
          speaker: master_cherry
          text: What brings you here, neighbor Geppetto?
        - id: ch01-b09
          speaker: geppetto
          text: My legs brought me. But honestly, Master Antonio, I came to ask you for a favor.
        - id: ch01-b10
          speaker: narrator
          text: The carpenter managed to rise onto his knees before he answered.
        - id: ch01-b11
          speaker: master_cherry
          text: Here I am. Whatever you need.
        - id: ch01-b12
          speaker: geppetto
          text: I had an idea this morning.
        - id: ch01-b13
          speaker: master_cherry
          text: Let's hear it.
        - id: ch01-b14
          speaker: geppetto
          text: I'm going to make a beautiful wooden puppet. He'll dance, fence, and leap like an acrobat. Then I'll travel around the world with him and earn enough for a piece of bread and a glass of wine. What do you think?
        - id: ch01-b15
          speaker: wood_voice
          text: Bravo, Pudding!
        - id: ch01-b16
          speaker: narrator
          text: It was the same little voice, though no one could tell where it came from. The moment Geppetto heard that hated name, his face turned as red as a turkey's head. He whirled toward the carpenter in a fury.
        - id: ch01-b17
          speaker: geppetto
          text: Why are you insulting me?
          emotion: angry
        - id: ch01-b18
          speaker: master_cherry
          text: Who's insulting you?
        - id: ch01-b19
          speaker: geppetto
          text: You called me Pudding!
          emotion: angry
        - id: ch01-b20
          speaker: master_cherry
          text: I did not!
        - id: ch01-b21
          speaker: geppetto
          text: Do you think I called myself that? You said it!
          emotion: angry
        - id: ch01-b22
          speaker: master_cherry
          text: No!
          emotion: angry
        - id: ch01-b23
          speaker: geppetto
          text: Yes!
          emotion: angry
        - id: ch01-b24
          speaker: master_cherry
          text: No!
          emotion: angry
        - id: ch01-b25
          speaker: geppetto
          text: Yes!
          emotion: angry
        - id: ch01-b26
          speaker: narrator
          text: Each word made them angrier. Soon they stopped arguing and started fighting. They rushed at each other, biting, scratching, and striking one another.
        - id: ch01-b27
          speaker: narrator
          text: When the fight ended, Master Cherry was holding Geppetto's yellow wig. Geppetto, meanwhile, discovered that the carpenter's gray wig was caught between his teeth.
        - id: ch01-b28
          speaker: master_cherry
          text: Give me back my wig!
          emotion: angry
        - id: ch01-b29
          speaker: geppetto
          text: Give me mine, and then we can be friends again.
        - id: ch01-b30
          speaker: narrator
          text: The two old men traded wigs and put them back on. Then they shook hands and swore they would be friends for the rest of their lives.
        - id: ch01-b31
          speaker: narrator
          text: To show that peace had truly been made, the carpenter returned to Geppetto's request.
        - id: ch01-b32
          speaker: master_cherry
          text: All right, neighbor Geppetto. What favor did you want from me?
        - id: ch01-b33
          speaker: geppetto
          text: I need a small piece of wood for my puppet. Will you give me one?
        - id: ch01-b34
          speaker: narrator
          text: Master Cherry was delighted. He hurried to the workbench and picked up the very piece of wood that had frightened him so badly. But as he held it out to his friend, the wood began to shake. It twisted violently out of his hands and struck poor Geppetto's thin, dry shins with all its force.
        - id: ch01-b35
          speaker: geppetto
          text: Ow! Is that how you give someone a present, Master Antonio? You've nearly crippled me!
          emotion: angry
        - id: ch01-b36
          speaker: master_cherry
          text: I swear, I didn't do it!
        - id: ch01-b37
          speaker: geppetto
          text: Then are you saying I did it?
        - id: ch01-b38
          speaker: master_cherry
          text: The wood did it all by itself!
        - id: ch01-b39
          speaker: geppetto
          text: I know the wood hit me. But you were the one holding it!
          emotion: angry
        - id: ch01-b40
          speaker: master_cherry
          text: I never hit you!
        - id: ch01-b41
          speaker: geppetto
          text: Liar!
          emotion: angry
        - id: ch01-b42
          speaker: master_cherry
          text: Don't insult me, Geppetto, or I'll call you Pudding!
          emotion: angry
        - id: ch01-b43
          speaker: geppetto
          text: You scoundrel!
          emotion: angry
        - id: ch01-b44
          speaker: master_cherry
          text: Pudding!
          emotion: angry
        - id: ch01-b45
          speaker: geppetto
          text: Donkey!
          emotion: angry
        - id: ch01-b46
          speaker: master_cherry
          text: Pudding!
          emotion: angry
        - id: ch01-b47
          speaker: geppetto
          text: Baboon!
          emotion: angry
        - id: ch01-b48
          speaker: master_cherry
          text: Pudding!
          emotion: angry
        - id: ch01-b49
          speaker: narrator
          text: That was the third time Master Cherry had called him Pudding. Geppetto went mad with rage and threw himself at the carpenter. Once again, the two old men fought desperately.
        - id: ch01-b50
          speaker: narrator
          text: By the time this battle ended, Master Cherry had two fresh scratches on his nose, and Geppetto had lost two buttons from his vest. Now that they were even, they shook hands once more and swore to be good friends for the rest of their lives.
        - id: ch01-b51
          speaker: narrator
          text: Geppetto took the fine piece of wood, thanked Master Cherry, and limped home.
