audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖从容，带一点一本正经的幽默
        timbre: 清晰醇厚
        pace: 舒缓，遇到惊奇处略微加快
        pitch: 中
    pinocchio:
      display_name: 匹诺曹
      tts:
        delivery: 任性直率，嘴硬而孩子气，发怒时冲动急躁
        timbre: 清亮，带木偶般的脆响
        pace: 偏快，争辩时更急
        pitch: 中高
    blue_haired_child:
      display_name: 蓝发女孩
      tts:
        delivery: 空灵冷寂，像从另一个世界传来的声音
        timbre: 轻柔清冷
        pace: 缓慢平直
        pitch: 中高
    black_rabbits:
      display_name: 黑兔子
      tts:
        delivery: 阴沉认真，说起生死来冷冰冰的
        timbre: 低沉干涩
        pace: 缓慢
        pitch: 低
  chapters:
    - id: ch01
      title: 苦药和糖
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 三位医生刚离开，仙女就走到匹诺曹床边，摸摸他的额头。木偶正在发高烧。她把白色药粉化在半杯水里，递了过去。
        - id: ch01-b02
          speaker: blue_haired_child
          text: 喝了吧。过几天，你的病就会好。
        - id: ch01-b03
          speaker: narrator
          text: 匹诺曹盯着杯子，整张脸都苦了下来，声音也变得可怜巴巴的。
        - id: ch01-b04
          speaker: pinocchio
          text: 这药是甜的，还是苦的？
        - id: ch01-b05
          speaker: blue_haired_child
          text: 味道是苦，不过能治好你的病。
        - id: ch01-b06
          speaker: pinocchio
          text: 苦的我可不喝。
        - id: ch01-b07
          speaker: blue_haired_child
          text: 听话，把它喝下去。
        - id: ch01-b08
          speaker: pinocchio
          text: 只要是苦东西，我都不喜欢。
        - id: ch01-b09
          speaker: blue_haired_child
          text: 你先喝药。喝完了，我给你一块糖压压苦味。
        - id: ch01-b10
          speaker: pinocchio
          text: 糖呢？在哪儿？
        - id: ch01-b11
          speaker: narrator
          text: 仙女从金糖罐里拿出一块糖，给他看。
        - id: ch01-b12
          speaker: blue_haired_child
          text: 瞧，就在这里。
        - id: ch01-b13
          speaker: pinocchio
          text: 那先把糖给我。吃过糖，我再喝那杯又苦又难喝的水。
        - id: ch01-b14
          speaker: blue_haired_child
          text: 你能说到做到吗？
        - id: ch01-b15
          speaker: pinocchio
          text: 能！
        - id: ch01-b16
          speaker: narrator
          text: 仙女把糖给了他。匹诺曹咔嚓几下，转眼就吞了下去，还意犹未尽地舔着嘴唇。
        - id: ch01-b17
          speaker: pinocchio
          text: 要是糖也算药，那该多好！我保证每天都吃。
        - id: ch01-b18
          speaker: blue_haired_child
          text: 现在该兑现答应我的事了。把这几口药水喝掉，你就能恢复健康。
        - id: ch01-b19
          speaker: narrator
          text: 匹诺曹不大情愿地接过杯子。他先把鼻尖凑上去，再把杯沿送到嘴边，又缩回来闻了一遍，最后还是不肯喝。
        - id: ch01-b20
          speaker: pinocchio
          text: 太苦啦！苦得我根本喝不下！
        - id: ch01-b21
          speaker: blue_haired_child
          text: 你一口都没尝，怎么就知道它苦？
        - id: ch01-b22
          speaker: pinocchio
          text: 我猜得到，光闻气味就明白了！再给我一块糖，我一定喝。
        - id: ch01-b23
          speaker: narrator
          text: 仙女拿出了做母亲的耐心，又把一块糖放进他嘴里，然后再次递上杯子。可木偶挤眉弄眼，做尽了怪相。
        - id: ch01-b24
          speaker: pinocchio
          text: 这样不行，我还是没法喝。
        - id: ch01-b25
          speaker: blue_haired_child
          text: 又是为什么？
        - id: ch01-b26
          speaker: pinocchio
          text: 我脚底下那个枕头一直碍着我。
        - id: ch01-b27
          speaker: narrator
          text: 仙女挪走枕头，可他仍旧摇头。
        - id: ch01-b28
          speaker: pinocchio
          text: 还是不行，我照样喝不了。
        - id: ch01-b29
          speaker: blue_haired_child
          text: 现在还有什么事？
        - id: ch01-b30
          speaker: pinocchio
          text: 房门开着一半，也让我不舒服。
        - id: ch01-b31
          speaker: narrator
          text: 仙女走过去关上门。这下再没有借口了，匹诺曹却干脆哭闹起来。
        - id: ch01-b32
          speaker: pinocchio
          text: 反正那杯苦水我绝不喝！不喝，不喝，就是不喝！
          emotion: angry
    - id: ch02
      title: 四只黑兔子
      blocks:
        - id: ch02-b01
          speaker: blue_haired_child
          text: 孩子，你会为这件事后悔的。
        - id: ch02-b02
          speaker: pinocchio
          text: 我才不管。
        - id: ch02-b03
          speaker: blue_haired_child
          text: 你的病可不轻。
        - id: ch02-b04
          speaker: pinocchio
          text: 我不在乎。
        - id: ch02-b05
          speaker: blue_haired_child
          text: 用不了几个钟头，高烧就会送你去另一个世界。
        - id: ch02-b06
          speaker: pinocchio
          text: 随它去吧。
        - id: ch02-b07
          speaker: blue_haired_child
          text: 你难道一点也不怕死？
        - id: ch02-b08
          speaker: pinocchio
          text: 我半点儿都不怕！我宁愿死，也不要喝那服苦药。
        - id: ch02-b09
          speaker: narrator
          text: 他话音刚落，房门忽然大开。四只黑得像墨的兔子走了进来，肩上还抬着一副小灵床。匹诺曹吓得猛然坐起。
        - id: ch02-b10
          speaker: pinocchio
          text: 你们来找我做什么？
          emotion: fearful
        - id: ch02-b11
          speaker: black_rabbits
          text: 我们是来抬你走的。
        - id: ch02-b12
          speaker: narrator
          text: 说话的是个头最大的那只兔子。
        - id: ch02-b13
          speaker: pinocchio
          text: 抬我走？可我明明还活着！
          emotion: fearful
        - id: ch02-b14
          speaker: black_rabbits
          text: 眼下还活着。不过你拒绝了能治高烧的药，现在只剩几分钟了。
        - id: ch02-b15
          speaker: pinocchio
          text: 仙女，仙女！快把杯子给我！求求你快一点儿，我不想死！不，我绝不要死！
          emotion: fearful
        - id: ch02-b16
          speaker: narrator
          text: 匹诺曹两手捧住杯子，仰头一口喝光。
        - id: ch02-b17
          speaker: black_rabbits
          text: 唉，只好耐心一点儿啦！我们这一趟算是白跑了。
        - id: ch02-b18
          speaker: narrator
          text: 四只兔子重新把小灵床扛到肩上，一路抱怨，嘴里还含含糊糊地嘟囔着，就这样离开了房间。几分钟以后，匹诺曹便跳下床，病已经全好了。木偶很少生病，就算偶尔病了，也会好得飞快，这正是它们才有的福气。
    - id: ch03
      title: 痊愈后的故事
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 仙女看着匹诺曹满屋奔跑。他又活泼又快活，简直像只小公鸡。
        - id: ch03-b02
          speaker: blue_haired_child
          text: 看来我的药确实管用，对吗？
        - id: ch03-b03
          speaker: pinocchio
          text: 何止管用！这药简直把我从死里救活了！
        - id: ch03-b04
          speaker: blue_haired_child
          text: 那你刚才为什么非要别人再三劝说，才肯喝下去？
        - id: ch03-b05
          speaker: pinocchio
          text: 我们男孩子就是这样嘛！怕吃药，比怕生病还厉害。
        - id: ch03-b06
          speaker: blue_haired_child
          text: 真不像话！孩子应该知道，好药只要及时吃，就能免去一场大病，甚至可能保住性命。
        - id: ch03-b07
          speaker: pinocchio
          text: 下次可不用费劲劝我了！只要想到四只黑兔子抬着灵床，我就会马上抓起杯子，把药一口灌下去。
        - id: ch03-b08
          speaker: blue_haired_child
          text: 现在过来告诉我，你怎么会落进那两个强盗手里？
        - id: ch03-b09
          speaker: pinocchio
          text: 是这样的。吞火人班主给了我几枚金币，还叮嘱我拿回去交给爸爸。可我在路上遇见了狐狸和猫。他们问我，想不想让几枚金币变成一两千枚，还说只要跟着他们，他们就会带我去奇迹田。我说，那就走吧。他们又提议，大家先到红虾客店歇脚。谁知过了半夜，他们却走了。我醒来才发现他们早已不见，只好独自摸黑上路。那天夜里有多黑，你根本想不到！后来，两个套着炭袋的强盗拦住我，大声逼我把钱交出来。我说自己一分钱也没有，其实四枚金币都藏在我的嘴里。其中一个伸手来掏，我一口咬断他的手，再往地上一吐，竟然是只猫爪。强盗们在后面追，我就在前面拼命跑，一直跑，一直跑，可最后还是被他们抓住了。他们拿绳子套住我的脖子，把我吊在这片树林的一棵树上。他们说，等明天再来，我就已经死了，嘴巴也会张开，他们正好拿走我藏在舌头底下的金币。
    - id: ch04
      title: 会长鼻子的谎话
      blocks:
        - id: ch04-b01
          speaker: blue_haired_child
          text: 那么，那四枚金币现在放在哪里？
        - id: ch04-b02
          speaker: pinocchio
          text: 我把它们弄丢了！
        - id: ch04-b03
          speaker: narrator
          text: 这是假话，金币分明还在他的口袋里。话刚出口，他本来就长的鼻子又长了两英寸。
        - id: ch04-b04
          speaker: blue_haired_child
          text: 你是在哪儿弄丢的？
        - id: ch04-b05
          speaker: pinocchio
          text: 就在这附近的树林里。
        - id: ch04-b06
          speaker: narrator
          text: 第二个谎话一出口，他的鼻子还在往前长。
        - id: ch04-b07
          speaker: blue_haired_child
          text: 既然丢在附近，我们一起去找，一定能找到。这片树林有个特点，凡是在这里丢掉的东西，最后总会找回来。
        - id: ch04-b08
          speaker: pinocchio
          text: 啊，我全想起来了！四枚金币其实没有丢。我喝药的时候，不小心把它们咽下去了。
        - id: ch04-b09
          speaker: narrator
          text: 匹诺曹越说越慌。这第三个谎话，让他的鼻子长到了吓人的地步。他再也不能随便动弹。转向这边，鼻子就撞上床或者窗玻璃。转向那边，又会碰到墙壁或者房门。要是稍微抬头，还可能戳到仙女的眼睛。仙女看着他，忍不住笑了。
        - id: ch04-b10
          speaker: pinocchio
          text: 你为什么笑我？
        - id: ch04-b11
          speaker: narrator
          text: 木偶见鼻子长得这么厉害，心里既窘迫又不安。
        - id: ch04-b12
          speaker: blue_haired_child
          text: 因为你刚才撒了谎。
        - id: ch04-b13
          speaker: pinocchio
          text: 可你怎么知道那是假话？
        - id: ch04-b14
          speaker: blue_haired_child
          text: 孩子，谎话马上就会露馅，因为它们分成两种。有些谎话腿很短，有些谎话鼻子很长。你刚说的，正好就是长鼻子的那一种。
        - id: ch04-b15
          speaker: narrator
          text: 匹诺曹羞得无处可藏，转身就想逃出房间。可他的鼻子实在太长，已经过不了那扇门了。
