audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm and story-rich
        timbre: clear and rounded
        pace: measured
        pitch: medium
    pinocchio:
      display_name: Pinocchio
      tts:
        delivery: impulsive and defiant
        timbre: bright and wooden
        pace: quick
        pitch: medium-high
    blue_haired_child:
      display_name: The Blue-Haired Child
      tts:
        delivery: distant and unearthly
        timbre: pale and delicate
        pace: slow
        pitch: medium-high
    rabbit_1:
      display_name: First Black Rabbit
      tts:
        delivery: grave and matter-of-fact
        timbre: dark and velvety
        pace: measured
        pitch: low
    rabbit_2:
      display_name: Second Black Rabbit
      tts:
        delivery: somber and businesslike
        timbre: soft and dusky
        pace: measured
        pitch: medium-low
    rabbit_3:
      display_name: Third Black Rabbit
      tts:
        delivery: solemn and restrained
        timbre: dry and muted
        pace: unhurried
        pitch: medium
    rabbit_4:
      display_name: Fourth Black Rabbit
      tts:
        delivery: mournful and reserved
        timbre: thin and shadowy
        pace: unhurried
        pitch: medium-high
  chapters:
    - id: ch01
      title: Pinocchio Will Not Take His Medicine
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: As soon as the three doctors were gone, the Fairy came over to Pinocchio. She touched his forehead and found that his fever was very high. So she stirred some white powder into half a glass of water and offered it to him with loving care.
        - id: ch01-b02
          speaker: blue_haired_child
          text: Drink this, and you'll be well again in a few days.
        - id: ch01-b03
          speaker: narrator
          text: Pinocchio eyed the glass and twisted his face into a grimace. Then he asked in a pitiful little voice.
        - id: ch01-b04
          speaker: pinocchio
          text: Does it taste sweet, or is it bitter?
        - id: ch01-b05
          speaker: blue_haired_child
          text: It's bitter, but it will make you better.
        - id: ch01-b06
          speaker: pinocchio
          text: Then I'm not drinking it.
        - id: ch01-b07
          speaker: blue_haired_child
          text: Listen to me. Take your medicine.
        - id: ch01-b08
          speaker: pinocchio
          text: I hate bitter things.
        - id: ch01-b09
          speaker: blue_haired_child
          text: Once you drink it, I'll give you a lump of sugar to clear away the taste.
        - id: ch01-b10
          speaker: pinocchio
          text: Where's the sugar?
        - id: ch01-b11
          speaker: narrator
          text: The Fairy took a piece from a golden sugar bowl and held it up.
        - id: ch01-b12
          speaker: blue_haired_child
          text: Right here.
        - id: ch01-b13
          speaker: pinocchio
          text: Give me the sugar first. Then I'll drink that nasty, bitter water.
        - id: ch01-b14
          speaker: blue_haired_child
          text: Do you promise?
        - id: ch01-b15
          speaker: pinocchio
          text: I promise.
        - id: ch01-b16
          speaker: narrator
          text: The Fairy gave him the sugar. Pinocchio crunched it up and swallowed it in a second. He licked his lips.
        - id: ch01-b17
          speaker: pinocchio
          text: If sugar were medicine, that would be wonderful! I'd take it every single day.
        - id: ch01-b18
          speaker: blue_haired_child
          text: Now keep your promise. Drink this little bit of water, and it will make you healthy again.
        - id: ch01-b19
          speaker: narrator
          text: Pinocchio reluctantly took the glass. He touched the rim with the tip of his nose, moved it toward his lips, then pulled it back and sniffed it once more.
        - id: ch01-b20
          speaker: pinocchio
          text: It's much too bitter! I can't drink it!
        - id: ch01-b21
          speaker: blue_haired_child
          text: How would you know? You haven't even tasted it.
        - id: ch01-b22
          speaker: pinocchio
          text: I can tell. The smell gives it away. Give me one more lump of sugar first, and then I'll drink it.
        - id: ch01-b23
          speaker: narrator
          text: With all the patience of a good mother, the Fairy put another lump of sugar into his mouth. Then she offered him the glass again. Pinocchio made face after face.
        - id: ch01-b24
          speaker: pinocchio
          text: I can't drink it like this!
        - id: ch01-b25
          speaker: blue_haired_child
          text: Why not?
        - id: ch01-b26
          speaker: pinocchio
          text: That pillow down by my feet is bothering me.
        - id: ch01-b27
          speaker: narrator
          text: The Fairy moved the pillow away.
        - id: ch01-b28
          speaker: pinocchio
          text: It's no use. I still can't drink it.
        - id: ch01-b29
          speaker: blue_haired_child
          text: What's wrong this time?
        - id: ch01-b30
          speaker: pinocchio
          text: The bedroom door is halfway open. That's bothering me now.
        - id: ch01-b31
          speaker: narrator
          text: The Fairy went over and shut the door. Pinocchio burst into tears.
        - id: ch01-b32
          speaker: pinocchio
          text: That's enough! I won't drink that bitter water. No, no, no!
          emotion: sad
        - id: ch01-b33
          speaker: blue_haired_child
          text: My boy, you'll be sorry.
        - id: ch01-b34
          speaker: pinocchio
          text: I don't care.
        - id: ch01-b35
          speaker: blue_haired_child
          text: You're seriously ill.
        - id: ch01-b36
          speaker: pinocchio
          text: I still don't care.
        - id: ch01-b37
          speaker: blue_haired_child
          text: In just a few hours, that fever will send you out of this world.
        - id: ch01-b38
          speaker: pinocchio
          text: I don't care about that either.
        - id: ch01-b39
          speaker: blue_haired_child
          text: Aren't you afraid to die?
        - id: ch01-b40
          speaker: pinocchio
          text: Not one bit! I'd rather die than swallow that bitter medicine.
        - id: ch01-b41
          speaker: narrator
          text: At that very moment, the bedroom door flew open. Four rabbits, all as black as ink, marched in with a little funeral bed balanced on their shoulders. Pinocchio sat straight up, terrified.
        - id: ch01-b42
          speaker: pinocchio
          text: What do you want with me?
          emotion: fearful
        - id: ch01-b43
          speaker: rabbit_1
          text: We've come to carry you away.
        - id: ch01-b44
          speaker: pinocchio
          text: Carry me away? But I'm not dead yet!
          emotion: fearful
        - id: ch01-b45
          speaker: rabbit_1
          text: Not yet. But you only have a few minutes left. You refused the medicine that would have cured your fever.
        - id: ch01-b46
          speaker: narrator
          text: Pinocchio began to scream for the Fairy.
        - id: ch01-b47
          speaker: pinocchio
          text: Fairy! Fairy! Give me the glass right now! Please, hurry! I don't want to die. I won't die!
          emotion: fearful
        - id: ch01-b48
          speaker: narrator
          text: He grabbed the glass with both hands and drained it in one gulp.
        - id: ch01-b49
          speakers: [rabbit_1, rabbit_2, rabbit_3, rabbit_4]
          ensemble: chorus
          text: Well, we must be patient. We've made this trip for nothing.
        - id: ch01-b50
          speaker: narrator
          text: The rabbits lifted the little funeral bed onto their shoulders again. Grumbling under their breath, they left the room.
        - id: ch01-b51
          speaker: narrator
          text: A few minutes later, Pinocchio was completely well. He jumped out of bed and raced around the room, as cheerful and lively as a young rooster. Wooden puppets do not get sick very often, and when they do, they recover very quickly. The Fairy watched him rushing about.
        - id: ch01-b52
          speaker: blue_haired_child
          text: So, did my medicine help you after all?
        - id: ch01-b53
          speaker: pinocchio
          text: Help me? Of course it did! It brought me back to life!
        - id: ch01-b54
          speaker: blue_haired_child
          text: Then why did I have to work so hard to get you to take it?
        - id: ch01-b55
          speaker: pinocchio
          text: Because that's how boys are! Medicine scares us more than being sick does.
        - id: ch01-b56
          speaker: blue_haired_child
          text: That's disgraceful. Boys should know that taking the right remedy in time can save them from a serious illness, and perhaps even save their lives.
        - id: ch01-b57
          speaker: pinocchio
          text: Oh, next time you won't have to persuade me so much. I'll remember those black rabbits carrying that little funeral bed. Then I'll grab the glass and swallow everything at once!
        - id: ch01-b58
          speaker: blue_haired_child
          text: Come here now. Tell me how those assassins managed to catch you.
        - id: ch01-b59
          speaker: pinocchio
          text: Well, Fire-Eater, the showman, gave me some gold coins and told me to take them to my father. But then I met a Fox and a Cat on the road. They asked, "Would you like those coins to become one or two thousand?" They offered to lead me to the Field of Miracles, and I said, "Let's go." After that, they suggested we stop at the Red Craw-Fish Inn. Sometime after midnight they slipped away, and when I woke up, they were nowhere to be found.
        - id: ch01-b60
          speaker: pinocchio
          text: So I started walking through the night, and you can't imagine how dark it was. Along the road, I ran into two assassins covered in charcoal sacks. They shouted for me to hand over my money. I told them I had none because the four coins were hidden inside my mouth. One assassin tried to put his hand between my teeth, so I bit it off and spat it out. But when it landed, I saw it wasn't a hand at all. It was a cat's paw.
        - id: ch01-b61
          speaker: pinocchio
          text: Then the assassins came after me. I ran and ran, but at last they caught me. They tied me by the neck to a tree in this forest. Before they left, they said they'd return tomorrow. They expected to find me dead with my mouth hanging open. Then they could carry off the gold pieces hidden under my tongue.
        - id: ch01-b62
          speaker: blue_haired_child
          text: And where are those four gold coins now?
        - id: ch01-b63
          speaker: pinocchio
          text: I lost them.
        - id: ch01-b64
          speaker: narrator
          text: That was a lie. The coins were in his pocket. The instant he said it, his already long nose grew another two inches.
        - id: ch01-b65
          speaker: blue_haired_child
          text: Where did you lose them?
        - id: ch01-b66
          speaker: pinocchio
          text: In the woods, close to here.
        - id: ch01-b67
          speaker: narrator
          text: With that second lie, his nose grew longer again.
        - id: ch01-b68
          speaker: blue_haired_child
          text: If they're lost nearby, we'll go look for them and find them. Anything lost in this forest always turns up again.
        - id: ch01-b69
          speaker: pinocchio
          text: Oh! Now I remember what happened. I didn't lose the four coins. I swallowed them while I was drinking your medicine.
        - id: ch01-b70
          speaker: narrator
          text: At this lie, his nose shot out to such an amazing length that poor Pinocchio could not turn in any direction. When he twisted toward one side, his nose struck the bed or the windowpanes. When he turned the other way, it hit the wall or the door. He could not even lift his head a little without risking a poke straight into one of the Fairy's eyes. The Fairy stood looking at him, and then she laughed.
        - id: ch01-b71
          speaker: pinocchio
          text: Why are you laughing?
        - id: ch01-b72
          speaker: narrator
          text: He was terribly confused, and the sight of his enormous, growing nose made him anxious.
        - id: ch01-b73
          speaker: blue_haired_child
          text: Because of the lie you just told me.
        - id: ch01-b74
          speaker: pinocchio
          text: But how could you possibly know I was lying?
        - id: ch01-b75
          speaker: blue_haired_child
          text: My dear boy, a lie is found out right away. Lies come in two kinds. Some have short legs, and some have long noses. Yours happens to have a very long nose.
        - id: ch01-b76
          speaker: narrator
          text: Pinocchio was so ashamed that he did not know where to hide himself. He tried to run out of the room and escape, but he could not do it. His nose had grown so long that it would no longer pass through the doorway.
