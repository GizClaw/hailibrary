audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖从容，带一点一本正经的幽默
        timbre: 清晰醇厚
        pace: 舒缓，遇到惊奇处略微加快
        pitch: 中
    pinocchio:
      display_name: 匹诺曹
      tts:
        delivery: 任性直率，嘴硬而孩子气，发怒时冲动急躁
        timbre: 清亮，带木偶般的脆响
        pace: 偏快，争辩时更急
        pitch: 中高
    local_boy:
      display_name: 小男孩
      tts:
        delivery: 机灵爽快，带着直截了当的揶揄
        timbre: 清脆明亮
        pace: 偏快
        pitch: 中高
    old_clothes_dealer:
      display_name: 旧衣贩子
      tts:
        delivery: 精明利落，招揽生意时嗓门响亮
        timbre: 略显粗哑
        pace: 中等
        pitch: 中低
  chapters:
    - id: ch01
      title: 上学路上的美梦
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 雪刚停，匹诺曹就把漂亮的识字课本夹在胳膊底下，出门上学去了。一路上，他那颗小脑袋忙个不停，一个美梦接着一个美梦，后一个总比前一个更好。
        - id: ch01-b02
          speaker: narrator
          text: 他一边走，一边自言自语。
        - id: ch01-b03
          speaker: pinocchio
          text: 我今天一到学校，马上就学会读书。明天学写字，后天学算术。等我有了学问，就能赚好多钱。拿到第一笔钱，我先给爸爸买件漂亮的新呢子外套。不，不够好！我要买一件金银做的外套，再钉上钻石纽扣。爸爸值得穿这样的衣裳。他为了给我买书，让我上学，把自己的外套都卖了。这么冷的天，他却只穿一件衬衫！也只有爸爸才肯这样牺牲自己！
        - id: ch01-b04
          speaker: narrator
          text: 匹诺曹越说越激动。就在这时，他好像听见远处传来了音乐。有横笛的声音，还有大鼓在响。嘀哩嘀，嘀嘀嘀。咚，咚，咚。
        - id: ch01-b05
          speaker: narrator
          text: 他停下来仔细听。乐声从一条横街尽头飘来，那条街一直通往海边的小村庄。
        - id: ch01-b06
          speaker: pinocchio
          text: 那边是什么音乐？可惜我非得去上学，要不然……
        - id: ch01-b07
          speaker: narrator
          text: 他站着不动，怎么也拿不定主意。可总得选一个呀，是去学校，还是追着笛声跑？
        - id: ch01-b08
          speaker: pinocchio
          text: 今天先去听笛子，明天再去上学。
        - id: ch01-b09
          speaker: narrator
          text: 这个小淘气耸了耸肩，主意就这么定了。他越跑，笛声和鼓声越近。嘀嘀嘀。咚，咚，咚，咚。
    - id: ch02
      title: 木偶大剧院
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 最后，匹诺曹跑进一个广场。广场上全是人，大家挤在一座木头和帆布搭成的房子四周。那座房子涂得五颜六色，十分鲜艳。
        - id: ch02-b02
          speaker: pinocchio
          text: 那是什么房子？
        - id: ch02-b03
          speaker: narrator
          text: 他问的是一个本地的小男孩。
        - id: ch02-b04
          speaker: local_boy
          text: 告示上都写着呢。你自己看看，不就知道了？
        - id: ch02-b05
          speaker: pinocchio
          text: 我当然想看，可我今天偏偏还不识字。
        - id: ch02-b06
          speaker: local_boy
          text: 真行啊，你这个木头脑袋！我来念给你听。告示上那几个火红的大字是“木偶大剧院”。
        - id: ch02-b07
          speaker: pinocchio
          text: 戏已经演很久了吗？
        - id: ch02-b08
          speaker: local_boy
          text: 马上就开演。
        - id: ch02-b09
          speaker: pinocchio
          text: 进去看要花多少钱？
        - id: ch02-b10
          speaker: local_boy
          text: 进去要十个子儿。
    - id: ch03
      title: 十个子儿
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 匹诺曹好奇得浑身发热，再也管不住自己。他连难为情都顾不上了，张口就向那个小男孩借钱。
        - id: ch03-b02
          speaker: pinocchio
          text: 你借我十个子儿行吗？我明天还你。
        - id: ch03-b03
          speaker: local_boy
          text: 我倒很想借给你，可我今天偏偏不能给你。
        - id: ch03-b04
          speaker: pinocchio
          text: 那我把外套卖给你，十个子儿就行。
        - id: ch03-b05
          speaker: local_boy
          text: 印花纸做的外套，我买来有什么用？一下雨，它湿透了粘在背上，想脱都脱不下来。
        - id: ch03-b06
          speaker: pinocchio
          text: 那你买我的鞋吧？
        - id: ch03-b07
          speaker: local_boy
          text: 那双鞋除了点火，什么用也没有。
        - id: ch03-b08
          speaker: pinocchio
          text: 那我的帽子呢？你肯出多少？
        - id: ch03-b09
          speaker: local_boy
          text: 这可真是了不起的宝贝！面包瓤做的帽子！戴在头上，说不定老鼠会直接跑来把它吃了。
    - id: ch04
      title: 卖掉识字课本
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 匹诺曹急得像坐在针毡上。他还想拿别的东西来换钱，却怎么也开不了口。他迟疑了半天，又觉得后悔，最后才问了一句。
        - id: ch04-b02
          speaker: pinocchio
          text: 这本新识字课本，你愿意出十个子儿买吗？
        - id: ch04-b03
          speaker: local_boy
          text: 我也是个孩子，可不跟别的孩子买东西。
        - id: ch04-b04
          speaker: narrator
          text: 这个小男孩可比匹诺曹懂事多了。不过，两人的话全让旁边一个旧衣贩子听见了。
        - id: ch04-b05
          speaker: old_clothes_dealer
          text: 那本识字课本，我出十个子儿买！
        - id: ch04-b06
          speaker: narrator
          text: 就这样，那本书当场卖掉了。可怜的杰佩托为了让儿子有书可读，自己只穿着衬衫留在家里，冷得浑身发抖。可匹诺曹却把那本识字课本卖了。
