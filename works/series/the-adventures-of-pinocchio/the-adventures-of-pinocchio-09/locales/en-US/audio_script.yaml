audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm and story-rich
        timbre: clear and rounded
        pace: measured
        pitch: medium
    pinocchio:
      display_name: Pinocchio
      tts:
        delivery: impulsive and defiant
        timbre: bright and wooden
        pace: quick
        pitch: medium-high
    local_boy:
      display_name: Local Boy
      tts:
        delivery: matter-of-fact and teasing
        timbre: youthful and clear
        pace: lively
        pitch: medium-high
    clothes_hawker:
      display_name: Old-Clothes Hawker
      tts:
        delivery: brisk and opportunistic
        timbre: rough and carrying
        pace: quick
        pitch: medium
  chapters:
    - id: ch01
      title: Castles in the Air
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: The snow stopped, and Pinocchio headed off to school with his fine new spelling book tucked under his arm. As he walked, his little mind raced ahead of him. He imagined a thousand wonderful futures and built a thousand castles in the air. Each one seemed more beautiful than the last.
        - id: ch01-b02
          speaker: pinocchio
          text: Today I'll learn to read right away. Tomorrow I'll start writing, and the next day I'll learn arithmetic. Once I know all that, I'll earn piles of money. With the very first coins in my pocket, I'll buy Papa a beautiful new cloth coat. No, wait. Not cloth! His coat will be made of gold and silver, with diamond buttons. He deserves it. He gave up his own coat so I could have books and an education, and now he's home in his shirtsleeves in this bitter cold. Only a father would make a sacrifice like that!
          emotion: happy
        - id: ch01-b03
          speaker: narrator
          text: Pinocchio was saying all this with deep feeling when he caught the sound of music far away. There were shrill fifes and the thump of a great drum. Fi-fie-fi, fi-fi-fi. Zum, zum, zum.
    - id: ch02
      title: The Music Down the Cross Street
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: He stopped to listen. The music came from the far end of a cross street, the road that led to a little village by the sea.
        - id: ch02-b02
          speaker: pinocchio
          text: What could that music be? If only I didn't have to go to school. Then I could...
        - id: ch02-b03
          speaker: narrator
          text: He stood there, completely undecided. School lay one way, and the fifes called from the other. Which should he choose? He knew he could not keep standing there forever.
        - id: ch02-b04
          speaker: pinocchio
          text: I'll listen to the fifes today. I can go to school tomorrow.
        - id: ch02-b05
          speaker: narrator
          text: The young rascal shrugged and set off at a run. With every step, the fifes grew sharper and the big drum beat louder. Fi-fi-fi. Zum, zum, zum, zum.
    - id: ch03
      title: The Great Puppet Theater
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: At last, Pinocchio reached a square packed with people. Everyone had gathered around a building made of wood and canvas, painted in every color imaginable. He turned to a boy who lived nearby.
        - id: ch03-b02
          speaker: pinocchio
          text: What kind of building is that?
        - id: ch03-b03
          speaker: local_boy
          text: Read the sign. It's all written there, so you'll find out.
        - id: ch03-b04
          speaker: pinocchio
          text: I'd be glad to read it, but I don't know how. Not yet, anyway.
        - id: ch03-b05
          speaker: local_boy
          text: Well done, blockhead! I'll read it for you. Those fiery red letters say, "The Great Puppet Theater."
        - id: ch03-b06
          speaker: pinocchio
          text: Did the show start a long time ago?
        - id: ch03-b07
          speaker: local_boy
          text: No, it's starting right now.
        - id: ch03-b08
          speaker: pinocchio
          text: How much is a ticket?
        - id: ch03-b09
          speaker: local_boy
          text: One dime.
        - id: ch03-b10
          speaker: narrator
          text: Curiosity burned through Pinocchio like a fever. He forgot all restraint. Without the least embarrassment, he asked the boy for help.
        - id: ch03-b11
          speaker: pinocchio
          text: Could you lend me a dime? I'll pay you back tomorrow.
        - id: ch03-b12
          speaker: local_boy
          text: I would if I could, but I can't give you one today.
    - id: ch04
      title: The Price of a Ticket
      blocks:
        - id: ch04-b01
          speaker: pinocchio
          text: Then buy my jacket for a dime.
        - id: ch04-b02
          speaker: local_boy
          text: What would I do with a jacket made of flowered paper? If it rained and got wet, I'd never get it off my back.
        - id: ch04-b03
          speaker: pinocchio
          text: What about my shoes? Will you buy those?
        - id: ch04-b04
          speaker: local_boy
          text: Those shoes are only good for starting a fire.
        - id: ch04-b05
          speaker: pinocchio
          text: How much would you give me for my cap?
        - id: ch04-b06
          speaker: local_boy
          text: Oh, what a treasure that would be! A cap made of bread crumbs! Mice might climb onto my head and eat it while I was wearing it.
        - id: ch04-b07
          speaker: narrator
          text: Pinocchio felt as if he were sitting on thorns. Another offer came to mind, but he could not bring himself to say it. He wavered. He knew it was wrong, and for a moment, he was sorry. At last, he spoke.
        - id: ch04-b08
          speaker: pinocchio
          text: Will you give me a dime for this brand-new spelling book?
        - id: ch04-b09
          speaker: local_boy
          text: I'm a boy too. I don't buy things from other boys.
        - id: ch04-b10
          speaker: narrator
          text: The local boy had far more sense than Pinocchio. But an old-clothes hawker had overheard the whole conversation.
        - id: ch04-b11
          speaker: clothes_hawker
          text: I'll give you a dime for that spelling book.
        - id: ch04-b12
          speaker: narrator
          text: And just like that, the book was sold. Poor Geppetto had stayed home shivering in his shirtsleeves so his son could own that spelling book.
