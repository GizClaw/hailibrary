  chapters:
    - id: ch01
      title: Pinocchio Flies to the Seashore
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Once the heavy, humiliating dog collar was off his neck, Pinocchio raced across the fields. He never stopped until he reached the main road to the Fairy's house. Through the trees, he could see the top of the Big Oak where he had been hanged. He looked in every direction, but he could not find the little house of the beautiful Child with the blue hair anywhere.
        - id: ch01-b02
          speaker: narrator
          text: A sad feeling warned him that something was wrong. He ran with all the strength he had left and, within a few minutes, reached the field where the little white house had stood. The house was gone. In its place was a marble stone. The words carved into it said that the Child with the Blue Hair lay there. She had died from sorrow because her little brother Pinocchio had abandoned her.
        - id: ch01-b03
          speaker: narrator
          text: It took Pinocchio some time to spell out the words. When he finally understood them, he fell facedown on the ground. He covered the tombstone with kiss after kiss and broke down in an agony of tears. He cried through the whole night. Morning came, and he was still crying, though he had no tears left. His sobs and cries were so sharp and heartbreaking that they woke echoes in all the hills around him.
        - id: ch01-b04
          speaker: pinocchio
          text: Oh, little Fairy, why did you die? Why wasn't it me? I'm so wicked, and you were so good! And where is Papa? Please tell me where to find him. I want to stay with him forever and never leave him again. Never! Little Fairy, tell me it isn't true. Tell me you're not dead! If you really love your little brother, please come back to life. Doesn't it hurt you to see me all alone, with everyone gone? If the assassins come, they'll hang me from a tree again, and this time I'll truly die. What am I supposed to do all alone in the world? Now that I've lost you and Papa, who will feed me? Where will I sleep at night? Who will make me a new jacket? It would be a hundred times better if I died too! Yes, I want to die! Oh! Oh! Oh!
          emotion: sad
        - id: ch01-b05
          speaker: narrator
          text: In his despair, Pinocchio tried to tear out his hair. But his hair was made of wood, so he could not even get his fingers into it.
        - id: ch01-b06
          speaker: narrator
          text: Just then, a large Pigeon flew over his head. The bird stopped high above him with his wings spread wide and called down.
        - id: ch01-b07
          speaker: pigeon
          text: Tell me, child. What are you doing down there?
        - id: ch01-b08
          speaker: pinocchio
          text: Can't you see? I'm crying!
          emotion: sad
        - id: ch01-b09
          speaker: narrator
          text: Pinocchio raised his head toward the voice and wiped his eyes on his jacket. The Pigeon went on.
        - id: ch01-b10
          speaker: pigeon
          text: Do you happen to know a puppet named Pinocchio?
        - id: ch01-b11
          speaker: pinocchio
          text: Pinocchio? Did you say Pinocchio? That's me! I'm Pinocchio!
          emotion: surprised
        - id: ch01-b12
          speaker: narrator
          text: Pinocchio sprang quickly to his feet. The Pigeon swooped down to the ground as fast as he could. Standing beside Pinocchio, he was bigger than a turkey.
        - id: ch01-b13
          speaker: pigeon
          text: Then do you know Geppetto too?
        - id: ch01-b14
          speaker: pinocchio
          text: Know him? He's my poor papa! Did he talk to you about me? Can you take me to him? Is he still alive? Please, please answer me. Is he alive?
        - id: ch01-b15
          speaker: pigeon
          text: He was alive when I left him three days ago. He was at the seashore.
        - id: ch01-b16
          speaker: pinocchio
          text: What was he doing there?
        - id: ch01-b17
          speaker: pigeon
          text: He was building himself a small boat so he could cross the ocean. That poor man has spent more than three months traveling all over the world to find you. He couldn't find you anywhere, so now he's decided to search the faraway countries of the New World.
        - id: ch01-b18
          speaker: pinocchio
          text: How far is the seashore from here?
        - id: ch01-b19
          speaker: pigeon
          text: More than six hundred miles.
        - id: ch01-b20
          speaker: pinocchio
          text: Six hundred miles! Oh, beautiful Pigeon, how I wish I had wings like yours!
        - id: ch01-b21
          speaker: pigeon
          text: If you want to go, I'll carry you there.
        - id: ch01-b22
          speaker: pinocchio
          text: How can you do that?
        - id: ch01-b23
          speaker: pigeon
          text: Ride on my back. Are you very heavy?
        - id: ch01-b24
          speaker: pinocchio
          text: I hardly weigh anything. I'm light as a feather!
        - id: ch01-b25
          speaker: narrator
          text: Without waiting for another word, Pinocchio jumped onto the Pigeon's back. He put one leg on each side, just as a man sits on a horse, and cried out joyfully.
        - id: ch01-b26
          speaker: pinocchio
          text: Gallop, gallop, my little horse! I can't wait to get there!
          emotion: happy
        - id: ch01-b27
          speaker: narrator
          text: The Pigeon took off. In only a few minutes, they had climbed so high that they nearly touched the clouds. From that enormous height, Pinocchio grew curious and turned to look down. At once, his head began to spin. He was so frightened of falling that he wrapped both arms tightly around the neck of his feathered steed.
        - id: ch01-b28
          speaker: narrator
          text: They flew all day. As evening came, the Pigeon spoke.
        - id: ch01-b29
          speaker: pigeon
          text: I'm terribly thirsty.
        - id: ch01-b30
          speaker: pinocchio
          text: And I'm terribly hungry!
        - id: ch01-b31
          speaker: pigeon
          text: Let's stop at that dovecote for a few minutes. Then we'll keep going and reach the seashore by dawn tomorrow.
        - id: ch01-b32
          speaker: narrator
          text: They entered a deserted dovecote. There was nothing inside except a basin full of water and a basket full of vetch. Pinocchio had never been able to eat vetch in his life. He always said it made him sick. But that evening, he ate until he was completely full. When he had nearly emptied the basket, he turned to the Pigeon.
        - id: ch01-b33
          speaker: pinocchio
          text: I never thought vetch could taste this good!
          emotion: surprised
        - id: ch01-b34
          speaker: pigeon
          text: Believe me, my boy, when you're truly hungry and there's nothing else to eat, even vetch tastes delicious. Real hunger isn't picky or greedy.
        - id: ch01-b35
          speaker: narrator
          text: They quickly finished their small meal and started their journey again. The following morning, they reached the seashore. The Pigeon set Pinocchio on the ground. He did not want to be troubled with thanks for doing a good deed, so he flew away at once and disappeared.
        - id: ch01-b36
          speaker: narrator
          text: The shore was crowded with people. They stared out at the sea, shouting and waving their arms. Pinocchio asked an old woman what had happened.
        - id: ch01-b37
          speaker: old_woman
          text: A poor father lost his son. He went out in a boat to search for the boy across the water. But the sea is wild today, and his little boat may sink.
        - id: ch01-b38
          speaker: pinocchio
          text: Where is his boat?
        - id: ch01-b39
          speaker: old_woman
          text: Look where I'm pointing. It's out there.
        - id: ch01-b40
          speaker: narrator
          text: Following the old woman's finger, Pinocchio saw a tiny boat far out on the water. From that distance, it looked like a nutshell with one very small man inside. He fixed his eyes on it and studied it closely. Then he let out a piercing cry.
        - id: ch01-b41
          speaker: pinocchio
          text: It's my papa! It's my papa!
          emotion: surprised
        - id: ch01-b42
          speaker: narrator
          text: The furious waves battered the boat. One moment it vanished in a hollow between the waves, and the next it rose into sight again. Pinocchio stood on top of a high rock, calling his father's name. He waved his hands, his handkerchief, and his cap, trying every signal he could.
        - id: ch01-b43
          speaker: narrator
          text: Though Geppetto was far from shore, he seemed to recognize his son. He took off his cap and waved it too. With his hands, he tried to show that he would have returned if he could. But the sea was so stormy that he could not use his oars or bring the boat any closer to shore.
        - id: ch01-b44
          speaker: narrator
          text: Suddenly, a tremendous wave rose up, and the boat disappeared. Everyone waited there, hoping it would come back to the surface. It never did.
        - id: ch01-b45
          speakers: [fisherman_1, fisherman_2, fisherman_3]
          ensemble: chorus
          text: Poor man!
          emotion: sad
        - id: ch01-b46
          speaker: narrator
          text: The fishermen on the shore murmured a prayer and turned toward home. Just then, they heard a desperate cry. They looked back and saw a little boy leap from the rock into the sea.
        - id: ch01-b47
          speaker: pinocchio
          text: I'll save my papa!
        - id: ch01-b48
          speaker: narrator
          text: Because Pinocchio was made of wood, he floated easily and swam like a fish. One moment the raging waves dragged him underwater. The next, he came up again, fighting with one arm or one leg. At last, the people lost sight of him. Pinocchio was seen no more.
