audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖从容，带一点一本正经的幽默
        timbre: 清晰醇厚
        pace: 舒缓，遇到惊奇处略微加快
        pitch: 中
    pinocchio:
      display_name: 匹诺曹
      tts:
        delivery: 任性直率，嘴硬而孩子气，发怒时冲动急躁
        timbre: 清亮，带木偶般的脆响
        pace: 偏快，争辩时更急
        pitch: 中高
    talking_cricket:
      display_name: 会说话的蟋蟀
      tts:
        delivery: 耐心清醒，劝诫时严肃却不盛气凌人
        timbre: 细而清晰，带一点年长者的沉稳
        pace: 从容
        pitch: 高
  chapters:
    - id: ch01
      title: 空屋里的声音
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 可怜的杰佩托无缘无故被押去坐牢了。那个小坏蛋匹诺曹呢，一挣脱士兵的手，就拼命往家跑。为了快一点，他抄近路穿过田野。高田埂也好，带刺的篱笆也好，积着水的沟也好，他一路跳了过去。
        - id: ch01-b02
          speaker: narrator
          text: 跑到家门口，匹诺曹发现临街的门没有关严。他推门进去，扣上门闩，往地板上一躺，舒舒服服地长出了一口气。
        - id: ch01-b03
          speaker: narrator
          text: 没过多久，屋里忽然传来一个声音，叫着“唧唧唧”。
        - id: ch01-b04
          speaker: pinocchio
          text: 谁在叫我？
          emotion: fearful
        - id: ch01-b05
          speaker: talking_cricket
          text: 是我在叫你！
        - id: ch01-b06
          speaker: narrator
          text: 匹诺曹回过头，只见一只大蟋蟀贴着墙，慢慢往上爬。
        - id: ch01-b07
          speaker: pinocchio
          text: 蟋蟀，你到底是谁？
        - id: ch01-b08
          speaker: talking_cricket
          text: 我是会说话的蟋蟀。我在这间屋子里住了一百年，也许还不止一百年。
        - id: ch01-b09
          speaker: pinocchio
          text: 可这屋子如今是我的了。你要肯赏我这个脸，就立刻出去，走了以后别回头。
        - id: ch01-b10
          speaker: talking_cricket
          text: 我得先告诉你一个天大的道理，说完才走。
        - id: ch01-b11
          speaker: pinocchio
          text: 那你快说，别磨蹭。
    - id: ch02
      title: 蟋蟀的劝告
      blocks:
        - id: ch02-b01
          speaker: talking_cricket
          text: 孩子不听父母的话，还从家里逃走，那可要倒霉了。他们在世上不会有好下场，早晚要后悔得不得了。
        - id: ch02-b02
          speaker: pinocchio
          text: 你接着唱吧，爱唱什么就唱什么，爱唱多久都行。我已经想好了，明天天一亮就逃走。只要留下，我就会跟别的孩子一样，被送去上学。不管我愿不愿意，都有人逼我读书。偷偷告诉你，我一点也不想学。追蝴蝶、爬大树、到鸟窝里掏小鸟，这些才有意思呢。
        - id: ch02-b03
          speaker: talking_cricket
          text: 你这个可怜的小傻瓜！这样混下去，长大以后，你就会变成一头十足的蠢驴，人人都要拿你取笑。你难道还不明白吗？
        - id: ch02-b04
          speaker: pinocchio
          text: 闭嘴！你这只恶毒又晦气的乌鸦嘴！
          emotion: angry
        - id: ch02-b05
          speaker: narrator
          text: 匹诺曹扯着嗓子大喊。可那只蟋蟀很有耐心，也很懂道理。听了这种无礼的话，它没有动怒，口气还是跟刚才一样。
        - id: ch02-b06
          speaker: talking_cricket
          text: 你不肯上学，那至少学一门手艺吧。凭自己的本事老实挣钱，总能挣到一块面包吃。
        - id: ch02-b07
          speaker: narrator
          text: 匹诺曹越来越不耐烦，没好气地回答它。
        - id: ch02-b08
          speaker: pinocchio
          text: 你真想听吗？世上那么多行当，只有一种能让我喜欢。
        - id: ch02-b09
          speaker: talking_cricket
          text: 你喜欢的是什么行当？
    - id: ch03
      title: 木头脑袋
      blocks:
        - id: ch03-b01
          speaker: pinocchio
          text: 我喜欢的行当，就是吃吃喝喝，睡觉玩耍，从早到晚到处闲逛，想去哪儿就去哪儿。
        - id: ch03-b02
          speaker: talking_cricket
          text: 一般说来，专干这种行当的人，到头来不是进医院，就是进监狱。
        - id: ch03-b03
          speaker: pinocchio
          text: 你给我小心点！你这只恶毒又晦气的乌鸦嘴！我真发起火来，你可要倒霉了！
        - id: ch03-b04
          speaker: talking_cricket
          text: 可怜的匹诺曹，我实在替你难过。
        - id: ch03-b05
          speaker: pinocchio
          text: 你有什么好替我难过的？
        - id: ch03-b06
          speaker: talking_cricket
          text: 因为你只是一个木偶。更糟的是，你长着一颗木头脑袋。
        - id: ch03-b07
          speaker: narrator
          text: 这最后一句话把匹诺曹彻底惹火了。他猛地跳起来，从工作台上抓起一柄木锤，朝会说话的蟋蟀扔过去。
        - id: ch03-b08
          speaker: narrator
          text: 也许匹诺曹并不真想打中它。偏偏木锤正砸在蟋蟀的脑袋上。可怜的蟋蟀只来得及勉强叫出一声“唧唧唧”，便又干又扁地贴在墙上，再也不动了。
