audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm and story-rich
        timbre: clear and rounded
        pace: measured
        pitch: medium
    pinocchio:
      display_name: Pinocchio
      tts:
        delivery: impulsive and defiant
        timbre: bright and wooden
        pace: quick
        pitch: medium-high
    talking_cricket:
      display_name: Talking Cricket
      tts:
        delivery: patient and plainspoken
        timbre: small and dry
        pace: unhurried
        pitch: high
  chapters:
    - id: ch01
      title: A Voice in the Room
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Poor Geppetto was being taken to prison, though he had done nothing wrong. Meanwhile, that little rascal Pinocchio had slipped free of the soldier. He ran as fast as his legs could carry him. To get home sooner, he raced across the fields, leaping over high banks, thorny hedges, and ditches full of water.
        - id: ch01-b02
          speaker: narrator
          text: When he reached the house, he found the street door partly open. He pushed his way inside, fastened the latch, and dropped onto the floor with one enormous sigh of relief.
        - id: ch01-b03
          speaker: narrator
          text: Then a sound came from somewhere in the room.
        - id: ch01-b04
          speaker: talking_cricket
          text: Cri-cri-cri!
        - id: ch01-b05
          speaker: pinocchio
          text: Who's calling me?
          emotion: fearful
        - id: ch01-b06
          speaker: talking_cricket
          text: I am.
        - id: ch01-b07
          speaker: narrator
          text: Pinocchio turned around. A large cricket was creeping slowly up the wall.
        - id: ch01-b08
          speaker: pinocchio
          text: Who are you, Cricket?
        - id: ch01-b09
          speaker: talking_cricket
          text: I'm the Talking Cricket. I've lived in this room for a hundred years, maybe longer.
        - id: ch01-b10
          speaker: pinocchio
          text: Well, the room belongs to me now. So do me a favor. Leave at once, and don't even look back.
        - id: ch01-b11
          speaker: talking_cricket
          text: I won't leave until I've told you one important truth.
        - id: ch01-b12
          speaker: pinocchio
          text: Then say it, and make it quick.
    - id: ch02
      title: The Cricket's Warning
      blocks:
        - id: ch02-b01
          speaker: talking_cricket
          text: Boys who turn against their parents and run away from home are asking for trouble. Nothing good will come of it. Sooner or later, they'll be bitterly sorry.
        - id: ch02-b02
          speaker: pinocchio
          text: Chirp away, Cricket. Keep going as long as you like. I've already decided to run away tomorrow at daybreak. If I stay here, I'll end up like every other boy. They'll send me to school and make me study, whether I want to or not. And just between us, I don't want to learn. Chasing butterflies is much more fun. So is climbing trees and taking baby birds from their nests.
        - id: ch02-b03
          speaker: talking_cricket
          text: You poor little goose! Don't you understand? If you live that way, you'll grow into a complete donkey, and everyone will laugh at you.
        - id: ch02-b04
          speaker: pinocchio
          text: Be quiet, you nasty little bringer of bad luck!
          emotion: angry
        - id: ch02-b05
          speaker: narrator
          text: The Cricket was patient and thoughtful. Pinocchio's rude words did not make him angry. He kept speaking in the same steady voice.
        - id: ch02-b06
          speaker: talking_cricket
          text: If you refuse to go to school, then at least learn a trade. You could earn an honest piece of bread for yourself.
        - id: ch02-b07
          speaker: pinocchio
          text: Want to know what I think? Out of every trade in the world, there's only one I really like.
        - id: ch02-b08
          speaker: narrator
          text: Pinocchio was beginning to lose his patience.
        - id: ch02-b09
          speaker: talking_cricket
          text: And what trade would that be?
    - id: ch03
      title: The Wooden Hammer
      blocks:
        - id: ch03-b01
          speaker: pinocchio
          text: Eating, drinking, sleeping, and having fun. I want to wander around all day, from morning until night.
        - id: ch03-b02
          speaker: talking_cricket
          text: People who choose that trade nearly always finish in one of two places. A hospital or a prison.
        - id: ch03-b03
          speaker: pinocchio
          text: You'd better watch out, you wicked little croaker! You'll be sorry if I lose my temper!
          emotion: angry
        - id: ch03-b04
          speaker: talking_cricket
          text: Poor Pinocchio. I truly feel sorry for you.
        - id: ch03-b05
          speaker: pinocchio
          text: Why should you feel sorry for me?
        - id: ch03-b06
          speaker: talking_cricket
          text: Because you're a puppet. Worse than that, your head is made of wood.
        - id: ch03-b07
          speaker: narrator
          text: Those words sent Pinocchio into a rage. He sprang up, grabbed a wooden hammer from the bench, and hurled it at the Talking Cricket.
        - id: ch03-b08
          speaker: narrator
          text: Perhaps Pinocchio had not meant to hit him. But the hammer struck the Cricket squarely on the head. The poor creature barely had enough breath left for one last cry.
        - id: ch03-b09
          speaker: talking_cricket
          text: Cri-cri-cri!
        - id: ch03-b10
          speaker: narrator
          text: Then he stayed there against the wall, dried up and flattened.
