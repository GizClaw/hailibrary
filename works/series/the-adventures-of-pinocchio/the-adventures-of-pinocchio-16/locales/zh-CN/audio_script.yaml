audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖从容，带一点一本正经的幽默
        timbre: 清晰醇厚
        pace: 舒缓，遇到惊奇处略微加快
        pitch: 中
    pinocchio:
      display_name: 匹诺曹
      tts:
        delivery: 任性直率，嘴硬而孩子气，发怒时冲动急躁
        timbre: 清亮，带木偶般的脆响
        pace: 偏快，争辩时更急
        pitch: 中高
    blue_haired_child:
      display_name: 蓝发女孩
      tts:
        delivery: 空灵冷寂，像从另一个世界传来的声音
        timbre: 轻柔清冷
        pace: 缓慢平直
        pitch: 中高
    falcon:
      display_name: 猎鹰
      tts:
        delivery: 恭敬利落，答话干脆
        timbre: 明亮有力
        pace: 适中
        pitch: 中
    medoro:
      display_name: 梅多罗
      tts:
        delivery: 忠诚机敏，行动时精神十足
        timbre: 温厚结实
        pace: 偏快
        pitch: 中低
    crow:
      display_name: 乌鸦医生
      tts:
        delivery: 郑重其事，荒唐结论也说得煞有介事
        timbre: 粗粝低哑
        pace: 缓慢
        pitch: 低
    owl:
      display_name: 猫头鹰医生
      tts:
        delivery: 客气庄重，反驳时一本正经
        timbre: 浑圆沉稳
        pace: 舒缓
        pitch: 中低
    talking_cricket:
      display_name: 会说话的蟋蟀
      tts:
        delivery: 耐心清醒，劝诫时严肃却不盛气凌人
        timbre: 细而清晰，带一点年长者的沉稳
        pace: 从容
        pitch: 高
  chapters:
    - id: ch01
      title: 猎鹰解开绳结
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 可怜的匹诺曹还挂在大橡树上，眼看只剩下一口气。那位美丽的蓝发女孩又走到窗前。她看见木偶被勒住脖子，随着一阵阵北风上下摇晃，心里很是不忍，便轻轻拍了三下手。
        - id: ch01-b02
          speaker: narrator
          text: 翅膀扇动的声音立刻从空中传来。一只大猎鹰飞得飞快，落在了窗台上。
        - id: ch01-b03
          speaker: falcon
          text: 仁慈的仙女，请问您有什么吩咐？
        - id: ch01-b04
          speaker: narrator
          text: 猎鹰低下尖嘴，向她恭敬地行了一礼。
        - id: ch01-b05
          speaker: blue_haired_child
          text: 大橡树的枝头吊着一个木偶，你看见了吗？
        - id: ch01-b06
          speaker: falcon
          text: 我看见了。
        - id: ch01-b07
          speaker: blue_haired_child
          text: 那就马上飞过去。用你的尖嘴啄断绳结，再把他轻轻放在树下的草地上。
        - id: ch01-b08
          speaker: narrator
          text: 猎鹰飞走了。只过了两分钟，它就回来复命。
        - id: ch01-b09
          speaker: falcon
          text: 您交代的事，我已经办好了。
        - id: ch01-b10
          speaker: blue_haired_child
          text: 你看到他时，他怎么样？
        - id: ch01-b11
          speaker: falcon
          text: 他看起来像是死了，可又没有真的死透。我刚解开勒住他脖子的活结，他就叹了口气，还小声嘟囔了一句。
        - id: ch01-b12
          speaker: pinocchio
          text: 这下我好受多了！
    - id: ch02
      title: 梅多罗的奇妙马车
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 仙女又拍了两下手。一只威风十足的贵宾犬应声出现，用两条后腿直立行走，跟人一模一样。
        - id: ch02-b02
          speaker: narrator
          text: 它穿着马车夫出门时最体面的制服。三角帽滚着金边，雪白的鬈发垂到肩上。巧克力色的背心镶着钻石纽扣，还缝了两个大口袋，正好装女主人晚餐时赏给它的骨头。它身上还有深红色天鹅绒短裤、丝袜和浅口鞋。身后更奇妙，挂着一个蓝缎子做的尾套，像个伞套，下雨时就把尾巴藏在里面。
        - id: ch02-b03
          speaker: blue_haired_child
          text: 梅多罗，快去吧，做一只听话的好狗！把车房里最漂亮的马车套好，沿着路赶进树林。到了大橡树，你会看到一个半死不活的木偶躺在草地上。轻轻抱起他，让他平躺在软垫上，再把他带回来见我。都听明白了吗？
        - id: ch02-b04
          speaker: narrator
          text: 梅多罗没有开口。它把蓝缎尾套摇了三四下，表示自己全听懂了，接着像赛马一样飞奔而去。
        - id: ch02-b05
          speaker: narrator
          text: 没过多久，一辆漂亮的小马车驶出了车房。车上的软垫塞满金丝雀的羽毛，车厢里面铺的竟是打发的奶油、蛋奶糊和香草威化饼。整整一百对白老鼠拉着车。梅多罗坐在车夫座上，鞭子左右甩得啪啪响，活像一个怕误了时辰的车夫。
        - id: ch02-b06
          speaker: narrator
          text: 一刻钟还没到，马车就回来了。仙女早已等在门口。她抱起可怜的匹诺曹，走进一间小屋。那屋子的护墙板全是珍珠母做的。她随即派人去请附近最有名望的医生。
    - id: ch03
      title: 三位医生来诊病
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 医生们一个接一个，马上赶来。第一位是乌鸦，第二位是猫头鹰，第三位是会说话的蟋蟀。
        - id: ch03-b02
          speaker: blue_haired_child
          text: 各位先生，请你们替我看看。这个不幸的木偶，到底还活着，还是已经死了？
        - id: ch03-b03
          speaker: narrator
          text: 乌鸦先走上前。它摸摸匹诺曹的脉搏，又摸摸他的鼻子，最后连他脚上的小脚趾也摸了摸。仔细检查过一遍，它才郑重地开了口。
        - id: ch03-b04
          speaker: crow
          text: 依我看，这个木偶已经死得一干二净。不过，要是他不幸没有死，那就证明他还活着！
        - id: ch03-b05
          speaker: owl
          text: 真遗憾，我不得不反对乌鸦。它是我杰出的朋友，也是我的同僚。依我看，这个木偶还活着。不过，要是他不幸没有活着，那就证明他确实死了！
        - id: ch03-b06
          speaker: blue_haired_child
          text: 那么你呢？难道没有什么要说的吗？
        - id: ch03-b07
          speaker: narrator
          text: 仙女这句话，是问会说话的蟋蟀。
        - id: ch03-b08
          speaker: talking_cricket
          text: 一个谨慎的医生，要是连自己在说什么都不知道，最好还是闭嘴。至于床上这个木偶，我看着可不陌生。我认识他已经有一阵子了！
    - id: ch04
      title: 匹诺曹哭了
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 匹诺曹原先一动不动，真像一块木头。听到这里，他忽然浑身猛颤，连床也跟着摇了起来。
        - id: ch04-b02
          speaker: talking_cricket
          text: 这个木偶啊，是个恶习难改的坏家伙。
        - id: ch04-b03
          speaker: narrator
          text: 匹诺曹把眼睛睁开一条缝，随即又赶紧闭紧。
        - id: ch04-b04
          speaker: talking_cricket
          text: 他是个小无赖，是个懒骨头，还是个到处乱跑的流浪汉。
        - id: ch04-b05
          speaker: narrator
          text: 匹诺曹听不下去了，把整张脸都藏进被子里。
        - id: ch04-b06
          speaker: talking_cricket
          text: 这个木偶还是个不听话的儿子。这样下去，他会让可怜的爸爸伤透心，活活送命！
        - id: ch04-b07
          speaker: narrator
          text: 就在这时，屋里响起压低了的呜咽声，还有哭声。大家掀起一点床单，这才发现，哭的人竟是匹诺曹。你们想想，他们该多吃惊！
        - id: ch04-b08
          speaker: crow
          text: 一个死人会哭，说明他的病快要好了。
        - id: ch04-b09
          speaker: narrator
          text: 乌鸦说得无比郑重。猫头鹰又接过了话。
        - id: ch04-b10
          speaker: owl
          text: 真遗憾，我又得反对我这位杰出的朋友和同僚。依我看，一个死人会哭，只能说明他舍不得死。
