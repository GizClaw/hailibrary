  chapters:
    - id: ch01
      title: The Falcon's Rescue
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Poor Pinocchio still hung from a branch of the Big Oak, looking more dead than alive. The beautiful Child with blue hair came back to the window. She saw the unhappy puppet dangling by his throat and bouncing in the gusts of the north wind. The sight filled her with pity, so she brought her hands together and clapped three times.
        - id: ch01-b02
          speaker: narrator
          text: At that signal came the sound of wings sweeping quickly through the air. A large Falcon flew straight to the window and landed on the sill. He lowered his beak in a respectful bow.
        - id: ch01-b03
          speaker: falcon
          text: What would you like me to do, gracious Fairy?
        - id: ch01-b04
          speaker: blue_haired_child
          text: Do you see that puppet hanging from a branch of the Big Oak?
        - id: ch01-b05
          speaker: falcon
          text: Yes, I see him.
        - id: ch01-b06
          speaker: blue_haired_child
          text: Then fly to him at once. Use your strong beak to break the knot holding him in the air. After that, place him gently on the grass beneath the tree.
        - id: ch01-b07
          speaker: narrator
          text: The Falcon flew off. Two minutes later, he was back at the window.
        - id: ch01-b08
          speaker: falcon
          text: I did exactly as you asked.
        - id: ch01-b09
          speaker: blue_haired_child
          text: What condition was he in?
        - id: ch01-b10
          speaker: falcon
          text: He looked dead, but I don't believe he truly is. The moment I loosened the noose around his throat, he sighed. Then, in a very faint voice, he muttered, "Now I feel better!"
    - id: ch02
      title: Medoro and the Little Carriage
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: The Fairy clapped her hands twice. At once, a magnificent Poodle appeared. He walked upright on his hind legs just like a man.
        - id: ch02-b02
          speaker: narrator
          text: He wore the finest coachman's uniform. A three-cornered cap trimmed in gold sat on his head, and a curly white wig fell to his shoulders. His chocolate-colored waistcoat had diamond buttons and two large pockets for the bones his mistress gave him at dinner. He also wore short crimson velvet breeches, silk stockings, and low-cut shoes. Behind him hung a blue satin case where he could tuck his tail whenever it rained.
        - id: ch02-b03
          speaker: blue_haired_child
          text: Hurry, Medoro, and be a good dog. Harness the loveliest carriage in my coach house and take the road into the woods. At the Big Oak, you'll find a poor puppet lying on the grass, half dead. Lift him carefully, lay him flat on the carriage cushions, and bring him here to me. Do you understand?
        - id: ch02-b04
          speaker: narrator
          text: Medoro did not answer in words. To show that he understood, he shook the blue satin case behind him three or four times. Then he raced away like a racehorse.
        - id: ch02-b05
          speaker: narrator
          text: Soon, a beautiful little carriage rolled out of the coach house. Its cushions were stuffed with canary feathers. Inside, it was lined with whipped cream, custard, and vanilla wafers. One hundred pairs of white mice pulled it along. Medoro sat high on the driver's seat, cracking his whip from side to side like a coachman afraid of being late.
        - id: ch02-b06
          speaker: narrator
          text: Less than a quarter of an hour later, the carriage returned. The Fairy was waiting at the door. She gathered the poor puppet into her arms and carried him to a small room paneled with mother-of-pearl. Then she immediately sent for the most famous doctors in the neighborhood.
    - id: ch03
      title: The Doctors Examine Pinocchio
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: The doctors answered the summons immediately. They arrived one after another. First came a Crow, then an Owl, and finally a Talking Cricket.
        - id: ch03-b02
          speaker: blue_haired_child
          text: Gentlemen, I want you to tell me whether this unfortunate puppet is alive or dead.
        - id: ch03-b03
          speaker: narrator
          text: The Crow stepped forward first. He checked Pinocchio's pulse, then his nose, and finally the little toe of his foot. After examining each one with great care, he gave his solemn opinion.
        - id: ch03-b04
          speaker: crow
          text: I believe the puppet is already completely dead. But if, unfortunately, he isn't dead, that would mean he's still alive.
        - id: ch03-b05
          speaker: owl
          text: I am sorry to disagree with my distinguished friend and colleague, the Crow. In my opinion, the puppet is still alive. But if, unfortunately, he isn't alive, that would mean he is truly dead.
        - id: ch03-b06
          speaker: blue_haired_child
          text: And you? Don't you have anything to say?
        - id: ch03-b07
          speaker: narrator
          text: The Fairy had turned to the Talking Cricket.
        - id: ch03-b08
          speaker: talking_cricket
          text: When a careful doctor doesn't know what he's talking about, the wisest thing he can do is keep quiet. As for that puppet, his face is familiar to me. I've known him for quite a while.
    - id: ch04
      title: The Talking Cricket Knows the Patient
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: Until then, Pinocchio had lain perfectly still, like a real piece of wood. Now a violent trembling seized him and shook the whole bed.
        - id: ch04-b02
          speaker: talking_cricket
          text: That puppet is a hopeless rascal.
        - id: ch04-b03
          speaker: narrator
          text: Pinocchio opened his eyes, then quickly shut them again.
        - id: ch04-b04
          speaker: talking_cricket
          text: He's a scoundrel, a lazy good-for-nothing, and a wanderer.
        - id: ch04-b05
          speaker: narrator
          text: Pinocchio pulled the bedclothes over his face.
        - id: ch04-b06
          speaker: talking_cricket
          text: And he's a disobedient son who will break his poor father's heart and send him to his grave.
        - id: ch04-b07
          speaker: narrator
          text: At that moment, a choked sound of sobbing and crying came from somewhere in the room. Everyone was astonished. When they raised the sheets a little, they discovered that every sound was coming from Pinocchio.
        - id: ch04-b08
          speaker: crow
          text: When a dead person cries, it means he's starting to recover.
        - id: ch04-b09
          speaker: owl
          text: I am sorry to disagree with my distinguished friend and colleague. To me, when a dead person cries, it means he is sorry to die.
