audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm and story-rich
        timbre: clear and rounded
        pace: measured
        pitch: medium
    pinocchio:
      display_name: Pinocchio
      tts:
        delivery: impulsive and defiant
        timbre: bright and wooden
        pace: quick
        pitch: medium-high
    blue_haired_child:
      display_name: The Blue-Haired Child
      tts:
        delivery: distant and unearthly
        timbre: pale and delicate
        pace: slow
        pitch: medium-high
    fox:
      display_name: The Fox
      tts:
        delivery: smooth and calculating
        timbre: lean and sly
        pace: measured
        pitch: medium
    cat:
      display_name: The Cat
      tts:
        delivery: dry and imitative
        timbre: soft and raspy
        pace: clipped
        pitch: medium-high
  chapters:
    - id: ch01
      title: The Fairy Makes His Nose Small Again
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: The Fairy let Pinocchio cry for a good half-hour. His nose had grown so long that it could no longer fit through the door. She meant to teach him a hard lesson and cure him of telling lies, the most shameful fault a boy can have. But soon his whole face looked twisted and strange, and his eyes were swollen from all that crying. The Fairy's heart filled with pity. She clapped her hands. At once, a thousand big birds called woodpeckers flew in through the window. They landed all along Pinocchio's nose and pecked at it with such energy that, within a few minutes, the enormous, ridiculous nose had shrunk back to its usual size.
        - id: ch01-b02
          speaker: pinocchio
          text: What a wonderful Fairy you are! I love you so much!
        - id: ch01-b03
          speaker: narrator
          text: Pinocchio wiped his eyes.
        - id: ch01-b04
          speaker: blue_haired_child
          text: I love you, too. Stay here with me. You can be my little brother, and I'll be your good little sister.
        - id: ch01-b05
          speaker: pinocchio
          text: I would gladly stay, but what about my poor papa?
        - id: ch01-b06
          speaker: blue_haired_child
          text: I've taken care of that. I already sent word to your father. He'll be here tonight.
        - id: ch01-b07
          speaker: pinocchio
          text: Really? Then please let me go meet him! I can't wait to kiss that poor old man. He has suffered so much because of me. I'm counting every minute until he comes!
          emotion: happy
        - id: ch01-b08
          speaker: narrator
          text: Pinocchio jumped for joy.
        - id: ch01-b09
          speaker: blue_haired_child
          text: Go, then, but take care not to get lost. Follow the road through the woods, and I'm sure you'll meet him.
        - id: ch01-b10
          speaker: narrator
          text: Pinocchio set off to meet his father. The moment he reached the woods, he began racing down the road like a young goat.
    - id: ch02
      title: Old Companions by the Big Oak
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: When he reached a spot almost in front of the Big Oak, Pinocchio stopped. He thought he heard people moving among the bushes. Sure enough, two travelers stepped out onto the road. Can you guess who they were? The Fox and the Cat, the same companions who had eaten supper with him at the Red Craw-Fish Inn.
        - id: ch02-b02
          speaker: fox
          text: Why, it's our dear Pinocchio! What brings you here?
        - id: ch02-b03
          speaker: narrator
          text: The Fox kissed him and threw his arms around him.
        - id: ch02-b04
          speaker: cat
          text: Yes, what brings you here?
        - id: ch02-b05
          speaker: pinocchio
          text: It's a long story. I'll tell you when I have time. But after you left me alone at the inn the other night, I met some assassins on the road!
        - id: ch02-b06
          speaker: fox
          text: Assassins? Oh, you poor thing! What were they after?
        - id: ch02-b07
          speaker: pinocchio
          text: They wanted to steal my gold pieces.
        - id: ch02-b08
          speaker: fox
          text: What villains!
        - id: ch02-b09
          speaker: cat
          text: Shameful villains!
        - id: ch02-b10
          speaker: pinocchio
          text: I ran, but they chased me. They caught me in the end and hung me from a branch of that oak.
        - id: ch02-b11
          speaker: narrator
          text: Pinocchio pointed to the Big Oak, only a few steps away.
        - id: ch02-b12
          speaker: fox
          text: Can you imagine anything more dreadful? What a world we're forced to live in! Tell me, where can respectable people like us ever find a safe place?
        - id: ch02-b13
          speaker: narrator
          text: As they talked, Pinocchio noticed that the Cat was limping on her right front leg. Her paw and all its claws were gone.
        - id: ch02-b14
          speaker: pinocchio
          text: What happened to your paw?
        - id: ch02-b15
          speaker: narrator
          text: The Cat tried to answer, but she got confused. The Fox quickly spoke for her.
        - id: ch02-b16
          speaker: fox
          text: My friend is far too modest to tell you, so I'll answer for her. Just an hour ago, we met an old wolf on the road. He was nearly fainting from hunger, and he begged us for something to eat. We didn't have so much as a fish bone to give him. So what did my friend do? She has the heart of a great ruler, you know. She bit off one of her own front paws and tossed it to that poor beast so he could satisfy his hunger.
        - id: ch02-b17
          speaker: narrator
          text: As the Fox finished his tale, he wiped away a tear. Pinocchio was touched, too. He leaned close to the Cat and whispered in her ear.
        - id: ch02-b18
          speaker: pinocchio
          text: If every cat were like you, the mice would be so lucky!
    - id: ch03
      title: The Fox Makes Another Promise
      blocks:
        - id: ch03-b01
          speaker: fox
          text: So, what are you doing out here?
        - id: ch03-b02
          speaker: pinocchio
          text: I'm waiting for my papa. He should arrive any minute.
        - id: ch03-b03
          speaker: fox
          text: And what about your gold pieces?
        - id: ch03-b04
          speaker: pinocchio
          text: They're still in my pocket, except for the one I spent at the Red Craw-Fish Inn.
        - id: ch03-b05
          speaker: fox
          text: Just think. By tomorrow, those four coins could turn into one or even two thousand! Why won't you take my advice and bury them in the Field of Miracles?
        - id: ch03-b06
          speaker: pinocchio
          text: I can't today. I'll go some other day.
        - id: ch03-b07
          speaker: fox
          text: Then you'll be too late!
        - id: ch03-b08
          speaker: pinocchio
          text: Why?
        - id: ch03-b09
          speaker: fox
          text: A gentleman has bought the field. After tomorrow, nobody else will be allowed to bury money there.
        - id: ch03-b10
          speaker: pinocchio
          text: How far away is it?
        - id: ch03-b11
          speaker: fox
          text: It isn't even two miles away. Come with us. In half an hour, you'll be there. You can bury your money right away, and only a few minutes later, you'll gather two thousand coins. This evening, you'll be back home with your pockets full. So, will you come with us?
        - id: ch03-b12
          speaker: narrator
          text: Pinocchio remembered the good Fairy. He thought of old Geppetto, too, and all the warnings the Talking Cricket had given him. For a little while, he could not decide what to say. In the end, though, he behaved like a boy without a grain of sense or any heart. He gave his head a little shake.
        - id: ch03-b13
          speaker: pinocchio
          text: All right. I'll come with you.
        - id: ch03-b14
          speaker: narrator
          text: And off they went.
    - id: ch04
      title: The Field of Miracles
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: They walked for half the day before reaching a town called Trap for Blockheads. As soon as Pinocchio entered, he saw that its streets were packed with miserable creatures. Dogs stood yawning with hunger. Sheep that had been shorn trembled from the cold. Roosters without combs begged for a single grain of corn. Large butterflies had sold their beautiful colored wings and could no longer fly. Peacocks had no tails and were ashamed to be seen. Pheasants scratched quietly at the ground, mourning the brilliant gold and silver feathers they had lost forever.
        - id: ch04-b02
          speaker: narrator
          text: In the middle of that crowd of beggars and ashamed creatures, a grand carriage rolled past from time to time. Inside sat some lordly Fox, some thieving Magpie, or another greedy bird of prey.
        - id: ch04-b03
          speaker: pinocchio
          text: Where is the Field of Miracles?
        - id: ch04-b04
          speaker: fox
          text: Right here. It's only a few steps away.
        - id: ch04-b05
          speaker: narrator
          text: They crossed the town, passed beyond its walls, and came to a lonely field. There was no one else in sight.
        - id: ch04-b06
          speaker: fox
          text: This is the place. Bend down, dig a small hole with your hands, and put your gold pieces inside.
        - id: ch04-b07
          speaker: narrator
          text: Pinocchio did exactly as he was told. He dug a hole, dropped in his four remaining gold pieces, and covered them with a little dirt.
        - id: ch04-b08
          speaker: fox
          text: Now go to that canal, bring back a can of water, and water the spot where you planted them.
        - id: ch04-b09
          speaker: narrator
          text: Pinocchio went over to the canal, but he had no can to carry the water. So he pulled off one of his old shoes, filled it at the canal, and poured the water onto the patch of earth above the buried coins.
        - id: ch04-b10
          speaker: pinocchio
          text: Is there anything else I need to do?
        - id: ch04-b11
          speaker: fox
          text: That's all. We'll leave now. Come back in about twenty minutes. You'll find a little tree growing here, with every branch loaded with money.
        - id: ch04-b12
          speaker: narrator
          text: The poor puppet was beside himself with joy. He thanked the Fox and the Cat not once, but a thousand times, and promised to give them a beautiful present.
        - id: ch04-b13
          speakers: [fox, cat]
          ensemble: duo
          text: We don't want any presents. We're happy just knowing we taught you how to grow rich without working for it. We feel as cheerful as people on a holiday!
        - id: ch04-b14
          speaker: narrator
          text: With that, the two rascals took their leave. They wished Pinocchio a fine harvest, then went away to take care of their own business.
