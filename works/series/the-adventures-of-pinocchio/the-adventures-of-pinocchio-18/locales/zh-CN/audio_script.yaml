audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖从容，带一点一本正经的幽默
        timbre: 清晰醇厚
        pace: 舒缓，遇到惊奇处略微加快
        pitch: 中
    pinocchio:
      display_name: 匹诺曹
      tts:
        delivery: 任性直率，嘴硬而孩子气，发怒时冲动急躁
        timbre: 清亮，带木偶般的脆响
        pace: 偏快，争辩时更急
        pitch: 中高
    blue_haired_child:
      display_name: 蓝发女孩
      tts:
        delivery: 空灵冷寂，像从另一个世界传来的声音
        timbre: 轻柔清冷
        pace: 缓慢平直
        pitch: 中高
    fox:
      display_name: 狐狸
      tts:
        delivery: 客气圆滑，劝诱时显得格外诚恳
        timbre: 细长而略带沙哑
        pace: 从容，编造谎话时流畅笃定
        pitch: 中
    cat:
      display_name: 猫
      tts:
        delivery: 冷淡狡猾，惯于附和狐狸的话
        timbre: 轻细干涩
        pace: 缓慢，重复时短促有力
        pitch: 中高
    fox_and_cat:
      display_name: 狐狸和猫
      tts:
        delivery: 两个骗子异口同声，客气中藏着得意
        timbre: 一细长沙哑，一轻细干涩
        pace: 从容整齐
        pitch: 中
  chapters:
    - id: ch01
      title: 鼻子恢复原样
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 仙女让匹诺曹哭了足足半个钟头。那根鼻子太长，木偶已经连房门都过不去了。她就是要重重地教训他，好叫他改掉撒谎这个最可耻的毛病。一个男孩子身上，再没有比这更丢脸的毛病了。可等木偶哭得脸都变了形，两眼肿得几乎要从眼眶里鼓出来，她又忍不住心软了。仙女拍了拍手，一千只叫作啄木鸟的大鸟立刻从窗口飞进来，一只接一只落到匹诺曹的鼻子上，使足力气啄个不停。没过几分钟，那根又大又可笑的鼻子便缩回了原样。
        - id: ch01-b02
          speaker: pinocchio
          text: 仙女，你真好！我可太爱你了！
          emotion: happy
        - id: ch01-b03
          speaker: blue_haired_child
          text: 我也爱你。你要肯留在这里，就做我的小弟弟，我来做你的好姐姐。
        - id: ch01-b04
          speaker: pinocchio
          text: 要不是放不下我可怜的爸爸，我一定愿意留下来。
        - id: ch01-b05
          speaker: blue_haired_child
          text: 这些我早就想到了。我已经通知你爸爸，他今晚就会过来。
        - id: ch01-b06
          speaker: narrator
          text: 匹诺曹高兴得跳了起来。
        - id: ch01-b07
          speaker: pinocchio
          text: 真的吗？小仙女，你要是答应，我想去迎接他。爸爸为我受了那么多苦，我只想赶快亲他一下，一分钟也等不及了！
          emotion: happy
        - id: ch01-b08
          speaker: blue_haired_child
          text: 那就去吧。可别迷路。沿着林间那条路走，你一定能碰见他。
        - id: ch01-b09
          speaker: narrator
          text: 匹诺曹出了门，一进树林便像小山羊一样飞跑。快到那棵大橡树时，他忽然听见灌木丛里有人说话，马上停了下来。果然，两个人从树丛里钻出，走上了大路。你猜是谁？正是狐狸和猫，也就是在红螯虾客栈同他吃过饭的那两个旅伴。
    - id: ch02
      title: 狐狸和猫的谎话
      blocks:
        - id: ch02-b01
          speaker: fox
          text: 哎呀，亲爱的匹诺曹！怎么会在这里遇见你？
        - id: ch02-b02
          speaker: narrator
          text: 狐狸一边叫，一边亲热地又亲又抱。
        - id: ch02-b03
          speaker: cat
          text: 怎么会在这里遇见你？
        - id: ch02-b04
          speaker: pinocchio
          text: 这事说来可长了，等有空我再告诉你们。你们走后，那天夜里我一个人离开客栈，竟在路上遇到了强盗！
        - id: ch02-b05
          speaker: fox
          text: 强盗？可怜的匹诺曹！他们想对你做什么？
        - id: ch02-b06
          speaker: pinocchio
          text: 他们要抢我的金币。
        - id: ch02-b07
          speaker: fox
          text: 他们真是恶棍！
        - id: ch02-b08
          speaker: cat
          text: 他们真是无耻的恶棍！
        - id: ch02-b09
          speaker: pinocchio
          text: 我逃了，他们就一路追。最后还是抓住我，把我吊在那棵橡树的树枝上。
        - id: ch02-b10
          speaker: narrator
          text: 匹诺曹说到这里，伸手指向那棵大橡树。它就在三个人身旁，离他们不过两步远。
        - id: ch02-b11
          speaker: fox
          text: 还有比这更吓人的事吗？我们偏偏要活在这种世道里！像我们这样的正派人，到底上哪儿才能平平安安地待着？
        - id: ch02-b12
          speaker: narrator
          text: 三个人继续说话时，匹诺曹发现猫的右前腿瘸了。仔细一看，她的整只爪子，连上面的爪尖都不见了。
        - id: ch02-b13
          speaker: pinocchio
          text: 你的爪子到哪里去了？
        - id: ch02-b14
          speaker: narrator
          text: 猫刚想开口，却支支吾吾答不上来。狐狸马上替她接了话。
        - id: ch02-b15
          speaker: fox
          text: 我这位朋友太谦虚，不好意思自己说。一个钟头前，我们碰见一只快饿昏的老狼。他向我们讨吃的，可我们连根鱼刺也没有。我朋友有一颗恺撒般伟大的心。她咬下自己的前爪，扔给那只可怜的狼填肚子。
        - id: ch02-b16
          speaker: narrator
          text: 狐狸把故事讲完，还抬手擦掉了一滴眼泪。匹诺曹也被感动了。他走到猫身边，把嘴凑近她的耳朵，悄悄说了一句话。
        - id: ch02-b17
          speaker: pinocchio
          text: 要是所有的猫都像你，老鼠们可就太有福气了！
        - id: ch02-b18
          speaker: fox
          text: 对了，你在这儿做什么？
        - id: ch02-b19
          speaker: pinocchio
          text: 我在等爸爸，他随时都会来。
        - id: ch02-b20
          speaker: fox
          text: 那些金币呢？
        - id: ch02-b21
          speaker: pinocchio
          text: 还装在口袋里。只少了在红螯虾客栈花掉的那一枚。
    - id: ch03
      title: 再去奇迹田
      blocks:
        - id: ch03-b01
          speaker: fox
          text: 可到了明天，这四枚本来能变成一千枚，甚至两千枚！你怎么就是不听劝，不肯把钱埋进奇迹田呢？
        - id: ch03-b02
          speaker: pinocchio
          text: 今天实在不行，我改天再去。
        - id: ch03-b03
          speaker: fox
          text: 改天可就晚啦！
        - id: ch03-b04
          speaker: pinocchio
          text: 为什么会晚？
        - id: ch03-b05
          speaker: fox
          text: 一位绅士已经买下那块田了。过了明天，谁也不准再往里面埋钱。
        - id: ch03-b06
          speaker: pinocchio
          text: 那里离这儿有多远？
        - id: ch03-b07
          speaker: fox
          text: 还不到两英里。跟我们走吧，半个钟头就到。你马上埋钱，几分钟后就能收两千枚。今晚回来时，两只口袋都会装得满满的。怎么样，去不去？
        - id: ch03-b08
          speaker: narrator
          text: 匹诺曹想到了善良的仙女，又想到了老杰佩托，还想起会说话的蟋蟀一次次给过的劝告。他一时拿不定主意，迟疑了一会儿。可最后，他还是像所有没半点头脑、没一点良心的孩子那样，轻轻摇了摇头。
        - id: ch03-b09
          speaker: pinocchio
          text: 走吧，我跟你们去。
        - id: ch03-b10
          speaker: narrator
          text: 三个人又上路了。走了半天，他们来到一座名叫“傻瓜陷阱”的城。匹诺曹刚一进城，就看见街道上挤满了古怪又可怜的动物。狗饿得不停打哈欠，绵羊被剪光了毛，冷得浑身发抖。没有鸡冠的公鸡到处求人给一粒玉米。大蝴蝶卖掉漂亮的彩翅，从此再也飞不起来。没了尾巴的孔雀羞得不敢见人，野鸡垂头丧气地刨着地，哀悼永远失去的金银羽毛。
        - id: ch03-b11
          speaker: narrator
          text: 这群乞丐和满面羞惭的动物中间，不时有一辆气派的马车驶过。车上坐着的，不是狐狸和偷东西的喜鹊，就是别的贪婪猛禽。
        - id: ch03-b12
          speaker: pinocchio
          text: 奇迹田到底在哪儿？
        - id: ch03-b13
          speaker: fox
          text: 就在这儿，离我们只有两步。
        - id: ch03-b14
          speaker: narrator
          text: 他们一起穿过整座城镇。走出城墙以后，三个人来到一片空荡荡的田野，四周一个人影也没有。
    - id: ch04
      title: 播种金币
      blocks:
        - id: ch04-b01
          speaker: fox
          text: 到了。弯下腰，用手挖个小坑，把金币全放进去。
        - id: ch04-b02
          speaker: narrator
          text: 匹诺曹马上照做。他弯下身，用两只手在泥土里挖好一个坑，把剩下的四枚金币全放进去，然后又盖上一层薄薄的土。
        - id: ch04-b03
          speaker: fox
          text: 现在去旁边的水渠，打一罐水来，浇在你播下金币的地方。
        - id: ch04-b04
          speaker: narrator
          text: 匹诺曹来到旁边的水渠，却发现手里根本没有水罐。他只好脱下一只脚上的旧鞋，用鞋装满水，再小心地拿回来，把水一点点浇在埋着金币的泥土上。
        - id: ch04-b05
          speaker: pinocchio
          text: 还有什么要做的吗？
        - id: ch04-b06
          speaker: fox
          text: 没有别的事了，我们现在可以离开。你过二十分钟左右再回来，就会看见一株灌木已经从泥土里冒出来，每一根枝条上都沉甸甸地挂满了钱。
        - id: ch04-b07
          speaker: narrator
          text: 可怜的木偶一听，欢喜得忘乎所以。他向狐狸和猫谢了一遍又一遍，足足谢了千遍万遍，还许诺一定送他们一份漂亮的礼物。
        - id: ch04-b08
          speaker: fox_and_cat
          text: 我们什么礼物也不要。能教会你不费力气就发大财，我们已经快活得像出来过节一样了。
        - id: ch04-b09
          speaker: narrator
          text: 两个无赖说完便向匹诺曹告别，祝他有个好收成，然后去办自己的事了。
