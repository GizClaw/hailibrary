  chapters:
    - id: ch01
      title: Sold at the Marketplace
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            The door stayed shut, so the little Coachman smashed it open with one hard kick. He stepped into the room and gave Pinocchio and Candlewick that same small laugh of his.
        - id: ch01-b02
          speaker: coachman
          text: >-
            Well done, boys! I heard that fine braying and knew your voices at once. That's why I've come.
        - id: ch01-b03
          speaker: narrator
          text: >-
            The two little donkeys were too stunned to move. They stood with their heads hanging down, their ears lowered, and their tails tucked between their legs. The Coachman took his time petting and stroking them both. Then he brought out a currycomb and groomed every part of their coats until they shone like two mirrors. Once they were polished to his liking, he slipped halters around their necks and led them away to the marketplace. He went there hoping to sell them for a handsome profit.
        - id: ch01-b04
          speaker: narrator
          text: >-
            Buyers came soon enough. A farmer whose donkey had died the day before bought Candlewick. Pinocchio was sold to the director of a circus company filled with clowns, tightrope dancers, and performing animals. The director planned to teach his new donkey to leap and dance beside the others.
        - id: ch01-b05
          speaker: narrator
          text: >-
            By now, you can see how the Coachman made his living. That wicked little creature traveled the world in his coach, though his face looked as sweet as milk and honey. Wherever he went, he used promises and flattery to gather idle boys who had come to hate books and school. Once his coach was full, he carried them to the Land of Boobies. There they spent every day playing, shouting, and amusing themselves.
        - id: ch01-b06
          speaker: narrator
          text: >-
            Day after day, those poor, fooled boys did nothing but play and never opened a book. In time, every one of them turned into a little donkey. That was exactly what the Coachman had been waiting for. He took possession of them with great delight, loaded them up, and carried them off to fairs and markets to be sold. He kept making those trips and selling those donkeys. In only a few years, the trade piled up so much money for him that he became a millionaire.
        - id: ch01-b07
          speaker: narrator
          text: >-
            I can't tell you what became of Candlewick. But I can tell you that Pinocchio's hard and miserable life began on his very first day.
    - id: ch02
      title: Hunger and Hard Lessons
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            The director put Pinocchio in a stall and filled the manger with straw. Pinocchio tried one mouthful, then spat it right back out. His master grumbled and replaced the straw with hay. Pinocchio didn't like that either.
        - id: ch02-b02
          speaker: circus_director
          text: >-
            So hay isn't good enough for you? All right, my fussy little donkey. I'll cure you of these whims!
          emotion: angry
        - id: ch02-b03
          speaker: narrator
          text: >-
            To correct him, the director whipped him across the legs. Pinocchio cried out in pain and began to bray.
        - id: ch02-b04
          speaker: pinocchio
          text: >-
            Hee-haw! My stomach can't digest straw!
        - id: ch02-b05
          speaker: circus_director
          text: >-
            Then eat the hay!
        - id: ch02-b06
          speaker: narrator
          text: >-
            The director understood donkey language perfectly.
        - id: ch02-b07
          speaker: pinocchio
          text: >-
            Hee-haw! Hay makes my stomach hurt!
        - id: ch02-b08
          speaker: circus_director
          text: >-
            What do you expect me to feed a little donkey like you? Chicken breasts and capon in jelly?
          emotion: angry
        - id: ch02-b09
          speaker: narrator
          text: >-
            His master grew angrier and whipped him again. This time Pinocchio wisely kept quiet. The stable door was shut, and he was left there alone.
        - id: ch02-b10
          speaker: narrator
          text: >-
            He hadn't eaten for many hours, and the empty feeling kept growing. Before long, hunger made him yawn again and again. Each time, he opened a mouth that seemed as wide as an oven. He searched the manger, but there was nothing to eat except the hay he had refused. At last, he gave in. He took a little, chewed it very carefully, then closed his eyes and forced himself to swallow.
        - id: ch02-b11
          speaker: pinocchio
          text: >-
            This hay isn't so bad. But if I'd kept studying, I could be eating fresh bread and a thick slice of sausage instead. Oh well. I'll have to be patient.
        - id: ch02-b12
          speaker: narrator
          text: >-
            When Pinocchio woke the next morning, he searched the manger for more hay. There wasn't any. He had eaten every last bit during the night. So he took a mouthful of chopped straw. As he chewed, he had to admit that it tasted nothing like a savory plate of macaroni or a pie.
        - id: ch02-b13
          speaker: pinocchio
          text: >-
            I have to be patient. Maybe what happened to me will at least warn other disobedient boys who refuse to study. Patience!
        - id: ch02-b14
          speaker: circus_director
          text: >-
            Patience? Is that what you said? You don't think I bought you just to keep you fed and watered, do you? I bought you to work and make money for me. Get up, right now! You're coming to the circus. I'll teach you to jump through hoops and dive headfirst through paper frames. You'll dance waltzes and polkas, and you'll stand upright on your hind legs.
        - id: ch02-b15
          speaker: narrator
          text: >-
            Whether he wanted to or not, poor Pinocchio had to learn every one of those tricks. It took him three months. During that time, he was whipped again and again, so badly that the blows nearly stripped the skin from his back.
    - id: ch03
      title: The Star of the Dance
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            At last, the director decided Pinocchio was ready for a truly extraordinary performance. Bright posters appeared on street corners all over town. They promised a grand full-dress show that very night, with the usual amazing feats by every performer and every horse in the company.
        - id: ch03-b02
          speaker: narrator
          text: >-
            But the posters saved their biggest announcement for the end. The famous little donkey Pinocchio, known as the Star of the Dance, would make his very first appearance. The theater, they added, would be brilliantly lit.
        - id: ch03-b03
          speaker: narrator
          text: >-
            That evening, a full hour before the show began, the theater was already packed from top to bottom. Every place in the pit was taken. So were all the seats in the stalls and every box. Even if someone had offered a seat's weight in gold, there was no room left to buy. Children and boys of every age crowded together on the benches around the circus ring. They were wild with impatience to see the famous little donkey Pinocchio dance.
        - id: ch03-b04
          speaker: narrator
          text: >-
            After the first part of the show, the director stepped before the audience. He wore a black coat, white breeches, and great leather boots that rose above his knees. He bowed deeply, then began a ridiculous speech in the most solemn voice he could manage.
        - id: ch03-b05
          speaker: circus_director
          text: >-
            Most respected ladies and gentlemen! Though I am only a humble visitor to this splendid city, I have given myself the honor, and even the pleasure, of presenting a celebrated little donkey to this intelligent and distinguished audience. This remarkable animal has already danced before His Majesty the Emperor and all the leading royal courts of Europe. Thank you for your inspiring presence. Please be kind to us!
        - id: ch03-b06
          speaker: narrator
          text: >-
            The crowd answered with laughter and applause. But when Pinocchio entered the center of the ring, the clapping doubled and swelled into a roar.
        - id: ch03-b07
          speaker: narrator
          text: >-
            He had been dressed for his debut. A new polished-leather bridle covered his head, gleaming with brass buckles and studs. Two white camellias stood in his ears. His mane had been curled, and every curl was tied with a bright ribbon. Gold and silver circled his body, while amaranth and blue velvet ribbons were braided through his tail. He was a little donkey anyone might have fallen in love with.
        - id: ch03-b08
          speaker: narrator
          text: >-
            The director held out a hand toward him and continued.
        - id: ch03-b09
          speaker: circus_director
          text: >-
            My respected audience, I won't bore you with the enormous trouble I faced while studying and conquering this wild mammal. I found him roaming free among mountains in the plains of the hottest part of the world. Just look at those savage, rolling eyes! I tried everything to tame him and teach him the ways of a respectable household animal. At times, I had no choice but to use the convincing argument of my whip. Yet all my kindness only made him more vicious.
        - id: ch03-b10
          speaker: circus_director
          text: >-
            Then I followed the system of Gall and examined his skull. There I discovered a piece of bony cartilage. The Medical Faculty of Paris itself recognizes this cartilage as the bulb that restores both hair and dancing. That is why I've taught him not only to dance, but also to jump through hoops and paper-covered frames. Watch him, and judge for yourselves!
        - id: ch03-b11
          speaker: circus_director
          text: >-
            Before I leave you, ladies and gentlemen, let me invite you to our next performance tomorrow evening. If rain threatens, we will postpone it until tomorrow morning at eleven, before noon after noon.
        - id: ch03-b12
          speaker: narrator
          text: >-
            With that nonsense finished, the director bowed deeply again. Then he turned to Pinocchio.
        - id: ch03-b13
          speaker: circus_director
          text: >-
            Courage, Pinocchio! Before your tricks begin, bow to this distinguished audience of ladies, gentlemen, and children.
        - id: ch03-b14
          speaker: narrator
          text: >-
            Pinocchio obeyed. He bent both knees to the ground and stayed there until the director cracked his whip.
        - id: ch03-b15
          speaker: circus_director
          text: >-
            Walk!
        - id: ch03-b16
          speaker: narrator
          text: >-
            Pinocchio rose onto all four legs and walked around the ring at an easy pace.
        - id: ch03-b17
          speaker: circus_director
          text: >-
            Trot!
        - id: ch03-b18
          speaker: narrator
          text: >-
            Pinocchio quickened his steps and began to trot.
        - id: ch03-b19
          speaker: circus_director
          text: >-
            Gallop!
        - id: ch03-b20
          speaker: narrator
          text: >-
            He broke into a gallop.
        - id: ch03-b21
          speaker: circus_director
          text: >-
            Full gallop!
        - id: ch03-b22
          speaker: narrator
          text: >-
            Pinocchio raced at full speed like a racehorse. The director raised one arm and fired a pistol. At the shot, the little donkey pretended he had been wounded. He dropped full-length in the ring and lay there as if he were truly dying.
    - id: ch04
      title: The Empty Box
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            Pinocchio rose while applause, shouts, and clapping burst all around him. As he stood, he naturally lifted his head and looked up. In one of the boxes sat a beautiful lady. Around her neck was a heavy gold chain, and from it hung a medallion painted with the portrait of a puppet.
        - id: ch04-b02
          speaker: pinocchio
          text: >-
            That's my picture! That lady is the Fairy!
        - id: ch04-b03
          speaker: narrator
          text: >-
            He knew her at once. Delight swept over him, and he tried to call to her.
        - id: ch04-b04
          speaker: pinocchio
          text: >-
            Oh, my little Fairy! My little Fairy!
          emotion: happy
        - id: ch04-b05
          speaker: narrator
          text: >-
            But those words never came. What burst from his throat was one long, ringing bray. Everyone in the theater laughed, especially the children.
        - id: ch04-b06
          speaker: narrator
          text: >-
            The director decided to teach him that braying before an audience was bad manners. He struck Pinocchio on the nose with the handle of his whip. The poor donkey stuck out his tongue and licked his aching nose for at least five minutes, perhaps hoping it would ease the pain.
        - id: ch04-b07
          speaker: narrator
          text: >-
            Then Pinocchio looked up again. To his despair, the box was empty. The Fairy had vanished.
        - id: ch04-b08
          speaker: narrator
          text: >-
            He felt as if he might die. Tears filled his eyes, and he began to weep. No one noticed. The director noticed least of all. He cracked his whip and called out.
        - id: ch04-b09
          speaker: circus_director
          text: >-
            Courage, Pinocchio! Show everyone how gracefully you can jump through the hoops.
        - id: ch04-b10
          speaker: narrator
          text: >-
            Pinocchio tried two or three times. Whenever he reached the hoop, he found it easier to duck underneath than to leap through. Finally, he jumped. His body passed through, but his right leg caught in the hoop. He tumbled down on the far side, folded into a heap.
        - id: ch04-b11
          speaker: narrator
          text: >-
            When he struggled to his feet, he was lame. He could barely make his way back to the stable.
        - id: ch04-b12
          speakers: [audience_boy_1, audience_boy_2, audience_boy_3]
          ensemble: chorus
          text: >-
            Bring out Pinocchio! We want the little donkey! Bring him back!
        - id: ch04-b13
          speaker: narrator
          text: >-
            The boys in the audience called for him because the accident had touched them and made them sorry. But the little donkey did not appear again that night.
    - id: ch05
      title: The Buyer at the Market
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: >-
            The next morning, an animal doctor examined Pinocchio. His judgment was final. The donkey would be lame for the rest of his life.
        - id: ch05-b02
          speaker: circus_director
          text: >-
            What am I supposed to do with a lame donkey? He'll eat without earning a thing. Take him to the market and sell him.
        - id: ch05-b03
          speaker: narrator
          text: >-
            The stable boy led Pinocchio to the marketplace. A buyer came along almost at once.
        - id: ch05-b04
          speaker: buyer
          text: >-
            How much are you asking for that lame donkey?
        - id: ch05-b05
          speaker: stable_boy
          text: >-
            Twenty dollars.
        - id: ch05-b06
          speaker: buyer
          text: >-
            I'll pay two. I'm not buying him to work. I only want his hide. It looks very tough, and I mean to turn it into a drum for my village band.
        - id: ch05-b07
          speaker: narrator
          text: >-
            Imagine what poor Pinocchio felt when he heard that he was going to be made into a drum.
        - id: ch05-b08
          speaker: narrator
          text: >-
            The buyer paid his two dollars and led the little donkey to the seashore. He tied a stone around Pinocchio's neck. Then he fastened a rope around one of the donkey's legs and held tight to the other end. With one sudden shove, he threw Pinocchio into the water.
        - id: ch05-b09
          speaker: narrator
          text: >-
            The stone dragged Pinocchio straight to the bottom. Still gripping the rope, his new owner sat quietly on a rock. He meant to wait until the little donkey drowned, and then skin him.
