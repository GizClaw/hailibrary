audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖从容，带一点一本正经的幽默
        timbre: 清晰醇厚
        pace: 舒缓，遇到惊奇处略微加快
        pitch: 中
    pinocchio:
      display_name: 匹诺曹
      tts:
        delivery: 任性直率，嘴硬而孩子气，危急时急促慌张
        timbre: 清亮，带木偶般的脆响
        pace: 偏快，争辩时更急
        pitch: 中高
    coachman:
      display_name: 车夫
      tts:
        delivery: 笑眯眯地哄人，甜腻亲热中藏着冷酷
        timbre: 柔软油滑的成年男声
        pace: 从容
        pitch: 中高
    director:
      display_name: 马戏团班主
      tts:
        delivery: 对动物粗暴专横，对观众则夸张卖弄
        timbre: 洪亮粗硬的成年男声
        pace: 发号施令时短促，演说时故作庄严
        pitch: 中低
    child_1:
      display_name: 孩子甲
      tts:
        delivery: 急切直率，喊声里带着明显的同情
        timbre: 清亮稚嫩的男童声
        pace: 急促
        pitch: 高
    child_2:
      display_name: 孩子乙
      tts:
        delivery: 热切外放，替受伤的小驴焦急呼喊
        timbre: 明亮轻细的女童声
        pace: 偏快
        pitch: 中高
    child_3:
      display_name: 孩子丙
      tts:
        delivery: 真诚恳切，难过中仍带着孩子气的冲动
        timbre: 略带沙哑的少年声
        pace: 中快
        pitch: 中
    stable_boy:
      display_name: 马夫
      tts:
        delivery: 朴实直接，买卖时干脆利落
        timbre: 年轻结实的男声
        pace: 中等
        pitch: 中
    purchaser:
      display_name: 买主
      tts:
        delivery: 冷淡精明，谈价时毫无怜悯
        timbre: 干涩的成年男声
        pace: 不紧不慢
        pitch: 中低
  chapters:
    - id: ch01
      title: 两头小驴被卖掉了
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            门一直不开，小个子猛踹一脚，把门踹开了。他走进屋里，还是那副笑嘻嘻的模样，对匹诺曹和灯芯开了口。
        - id: ch01-b02
          speaker: coachman
          text: >-
            好样的，小伙子们！你们刚才叫得真不错。我一听声音就认出是你们，所以马上赶来了。
        - id: ch01-b03
          speaker: narrator
          text: >-
            两头小驴一下子呆住了。他们低着头，耳朵耷拉下来，尾巴紧紧夹在两腿中间。小个子先摸摸这个，又拍拍那个，装出疼爱他们的样子。随后，他拿出刮毛梳，仔仔细细替他们梳毛。等两头驴都变得油光锃亮，像两面镜子一样，他就给他们套上笼头，牵到市场去，一心想卖个好价钱，大赚一笔。
        - id: ch01-b04
          speaker: narrator
          text: >-
            买主果然不缺。灯芯被一个农夫买走，因为那人的驴头一天刚死。匹诺曹则卖给了一个马戏团班主。那人手下有一班滑稽演员和走绳艺人，还养着其他登台表演的动物。他买匹诺曹，就是为了教他和那些动物一起跳跃、跳舞。
        - id: ch01-b05
          speaker: narrator
          text: >-
            小读者们，现在你们总该看清小个子做的好买卖了吧。这个邪恶的小怪物总是满脸和气，嘴巴甜得像蜜。他驾着马车四处游荡，用好听的许诺和奉承话，把那些讨厌课本和学校的懒孩子骗上车。车一坐满，他就把孩子们送进玩儿国，让他们天天玩闹取乐，半点书也不读。
        - id: ch01-b06
          speaker: narrator
          text: >-
            那些受骗的可怜孩子不停地玩，从来不肯学习，后来全变成了小驴。小个子就欢欢喜喜把他们占为己有，再运到大大小小的集市和市场出售。只过了几年，他便靠这门生意赚下成堆的钱，成了百万富翁。灯芯后来落得什么下场，我不知道。我只知道，匹诺曹从被卖掉的第一天起，就过上了又苦又累的日子。
    - id: ch02
      title: 驴栏里的滋味
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            班主把匹诺曹关进驴栏，在食槽里放满稻草。匹诺曹尝了一口，马上吐了出来。主人一边抱怨，一边换上干草，可他还是不肯吃。
        - id: ch02-b02
          speaker: director
          text: >-
            怎么，连干草也不合你的口味？好哇，你这头讲究的小驴！既然你这么挑剔，我就来治治你！
          emotion: angry
        - id: ch02-b03
          speaker: narrator
          text: >-
            说完，班主挥起鞭子，狠狠抽在他的腿上。匹诺曹疼得又哭又叫，嘴里还夹着驴鸣。
        - id: ch02-b04
          speaker: pinocchio
          text: >-
            咿——啊！我吃了稻草，根本消化不了！
        - id: ch02-b05
          speaker: director
          text: >-
            那你就给我吃干草！
        - id: ch02-b06
          speaker: narrator
          text: >-
            原来班主完全听得懂驴话。
        - id: ch02-b07
          speaker: pinocchio
          text: >-
            咿——啊！可干草会让我肚子疼。
        - id: ch02-b08
          speaker: director
          text: >-
            难道养你这头小驴，还得天天喂鸡胸肉和肉冻阉鸡吗？
          emotion: angry
        - id: ch02-b09
          speaker: narrator
          text: >-
            班主越说越火，又抽了他一鞭。匹诺曹这回学聪明了，立刻闭嘴。驴栏的门随后锁上，只剩他独自在里面。他已经饿了好几个钟头，哈欠一个接一个，每次张嘴，都像张开了一座烤炉。
        - id: ch02-b10
          speaker: narrator
          text: >-
            食槽里实在没有别的东西，他只好嚼一点干草。细细嚼烂以后，他闭上眼睛咽了下去。
        - id: ch02-b11
          speaker: pinocchio
          text: >-
            这干草其实不算坏。可我要是继续读书，现在吃的就该是一大块新鲜面包，还有香喷喷的香肠，不会是干草了。唉，我只能忍耐！
        - id: ch02-b12
          speaker: narrator
          text: >-
            第二天早晨，他一醒来，就赶紧到食槽里找干草。可是食槽空空的，原来夜里已经被他吃得一根不剩。他只得含一口切碎的稻草，继续慢慢嚼。嚼着嚼着，他不得不承认，这种滋味跟一盘喷香的通心粉或一块好吃的馅饼，实在没有半点相像。
        - id: ch02-b13
          speaker: pinocchio
          text: >-
            我得忍耐！但愿我的下场，至少能提醒那些不听话、不肯读书的孩子。忍耐吧！
        - id: ch02-b14
          speaker: director
          text: >-
            还忍耐呢！你以为我把你买回来，只为了供你吃喝吗？我要你干活，替我挣钱。马上起来，跟我进马戏团！我要教你跳铁环，一头穿过纸框，还要跳华尔兹、波尔卡舞，用两条后腿站起来！
          emotion: angry
        - id: ch02-b15
          speaker: narrator
          text: >-
            可怜的匹诺曹愿意也得学，不愿意也得学。跳铁环、撞破纸框、跳华尔兹和波尔卡，再靠两条后腿直立，这些漂亮本领足足练了三个月，他才总算全部掌握。训练的时候，他不知挨过多少鞭子，身上的皮都险些被活活抽掉。
    - id: ch03
      title: 舞坛之星登台
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            终于有一天，班主认为匹诺曹已经可以登台，便宣布要举行一场非同凡响的盛大演出。街角贴满五颜六色的海报。海报上说，今晚全体艺人和戏班所有马匹都会献上惯常绝技与惊奇表演。除此以外，大名鼎鼎的小驴匹诺曹，人称“舞坛之星”，也会首次公开亮相。整座剧场还将点亮灿烂的灯火。
        - id: ch03-b02
          speaker: narrator
          text: >-
            到了晚上，离开演还有整整一个钟头，剧场已经挤得水泄不通。无论池座、正厅座位还是包厢，全都塞得满满当当，就算拿等重的黄金来换，也找不到一个空位。马戏场四周的长凳上坐满各个年纪的孩子。人人都急得发热，一刻也等不下去，只想快点看到著名的小驴匹诺曹跳舞。
        - id: ch03-b03
          speaker: narrator
          text: >-
            前半场结束后，班主穿着黑上衣、白马裤和高过膝盖的大皮靴，走到观众面前。他深深鞠了一躬，装出无比庄严的样子，开始发表一通荒唐的演说。
        - id: ch03-b04
          speaker: director
          text: >-
            尊贵的观众，各位女士，各位先生！鄙人途经这座显赫的城市，特来争取一份荣幸，更可以说是一份愉悦，把这头声名远扬的小驴呈献给睿智高贵的诸位。他早已有幸在欧洲各大宫廷的至尊皇帝陛下面前跳过舞。感谢诸位光临鼓舞我们，也请诸位多多包涵！
        - id: ch03-b05
          speaker: narrator
          text: >-
            观众听了又笑又鼓掌。等匹诺曹来到场中央，掌声顿时响得更加厉害。他头戴崭新的亮皮辔头，上面全是黄铜扣和铜钉，耳朵里各插一朵白山茶花。鬃毛一绺绺卷好，系着彩色缎带结。腰间围着金银肚带，尾巴编成长辫，又缠着苋红色和蓝色的天鹅绒缎带。这样的小驴，简直叫人一见就喜欢。
        - id: ch03-b06
          speaker: narrator
          text: >-
            班主介绍完匹诺曹，又对观众讲了下去。
        - id: ch03-b07
          speaker: director
          text: >-
            尊贵的听众！鄙人不愿编造谎言，说自己历尽艰险，才在热带的山野和平原间弄懂并制服这头自由吃草的哺乳动物。请看他那双野性十足、滴溜乱转的眼睛。为了把他驯成家养的四足兽，我试遍所有办法，全都没用，只好常常请出鞭子，用这番无可辩驳的道理说服他。可我的一片好心非但没换来他的感情，反而让他更加顽劣。
        - id: ch03-b08
          speaker: director
          text: >-
            后来，我依照加尔氏的学说，在他的头盖骨里发现了一块软骨。巴黎医学院也认定，那是让毛发和舞蹈才能重新生长的球茎。所以我不但教会他跳舞，还教会他跳铁环、穿纸框。请诸位欣赏以后，再来评判！另外，明晚仍有每日例行演出。要是天像要下雨，演出就改在明天上午十一点，午后以前的午后举行！
        - id: ch03-b09
          speaker: narrator
          text: >-
            班主又深深鞠了一躬，这才转向匹诺曹。
        - id: ch03-b10
          speaker: director
          text: >-
            勇敢一点，匹诺曹！表演以前，先向尊贵的女士、先生和孩子们鞠躬！
        - id: ch03-b11
          speaker: narrator
          text: >-
            匹诺曹把两条前腿弯到膝盖着地，一直跪着。班主啪地甩响鞭子，发出口令。
        - id: ch03-b12
          speaker: director
          text: >-
            慢步走！
        - id: ch03-b13
          speaker: narrator
          text: >-
            小驴四脚站起来，慢慢绕场行走。过了一会儿，下一道命令来了。
        - id: ch03-b14
          speaker: director
          text: >-
            小跑！
        - id: ch03-b15
          speaker: narrator
          text: >-
            匹诺曹马上小跑起来。
        - id: ch03-b16
          speaker: director
          text: >-
            飞跑！
        - id: ch03-b17
          speaker: narrator
          text: >-
            匹诺曹立刻飞跑。
        - id: ch03-b18
          speaker: director
          text: >-
            全速飞跑！
        - id: ch03-b19
          speaker: narrator
          text: >-
            匹诺曹像赛马一样全速狂奔。班主忽然抬起一只胳膊，开了一枪。听到枪声，小驴假装中弹，直挺挺倒在地上，仿佛真的快死了。
    - id: ch04
      title: 包厢里的仙女
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            喝彩声、欢呼声和拍手声一起爆发。匹诺曹就在这一片喧闹里从地上爬起来。他自然而然抬头一望，看见一位美丽的太太坐在一间包厢里。她脖子上戴着一条粗粗的金链，链子垂下的圆形吊坠上，清清楚楚画着一个木偶的肖像。
        - id: ch04-b02
          speaker: pinocchio
          text: >-
            那是我的画像！那位太太就是仙女！
          emotion: happy
        - id: ch04-b03
          speaker: narrator
          text: >-
            匹诺曹一眼认出了她，高兴得什么也顾不上，只想放声呼喊。
        - id: ch04-b04
          speaker: pinocchio
          text: >-
            啊，我的小仙女！啊，我的小仙女！
          emotion: happy
        - id: ch04-b05
          speaker: narrator
          text: >-
            可他喉咙里冲出来的不是这些话，而是一声又响亮又悠长的驴叫。全场观众顿时笑成一片，剧场里的孩子们笑得尤其厉害。班主想给他一个教训，好让他明白在观众面前嘶叫实在没规矩，便用鞭子柄重重敲了匹诺曹的鼻子。可怜的小驴疼得把舌头伸出足足一寸，接连舔了五分钟鼻子，大概以为这样能让疼痛轻一点。
        - id: ch04-b06
          speaker: narrator
          text: >-
            等他第二次抬起头，刚才那间包厢已经空空荡荡，仙女也消失得无影无踪。匹诺曹一下陷入绝望，觉得自己就快要死了。眼泪涌满他的双眼，他忍不住哭了起来。可四周没有一个人注意到，班主当然更没有。他只是啪地甩响鞭子，继续大声催促。
        - id: ch04-b07
          speaker: director
          text: >-
            勇敢一点，匹诺曹！现在让观众瞧瞧，你跳过铁环的姿势有多漂亮！
        - id: ch04-b08
          speaker: narrator
          text: >-
            匹诺曹接连试了两三次。可每次跑到铁环前，他都觉得从下面钻过去容易得多，怎么也不肯从中间跳。最后，他总算鼓起劲纵身一跃，穿过了铁环。偏偏右腿不巧被环绊住，害得他在另一边蜷成一团，重重摔在地上。
        - id: ch04-b09
          speaker: narrator
          text: >-
            匹诺曹再爬起来，已经成了一头瘸驴。他费了好大的劲，才一步步挪回驴栏。剧场里的孩子看见这场不幸，都替他难过，齐声喊了起来。
        - id: ch04-b10
          speakers: [child_1, child_2, child_3]
          ensemble: chorus
          text: >-
            让匹诺曹出来！我们要看小驴！让小驴出来！
          emotion: sad
        - id: ch04-b11
          speaker: narrator
          text: >-
            可那天晚上，小驴再也没有露面。
    - id: ch05
      title: 两块钱买下的驴皮
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: >-
            第二天早晨，给动物看病的兽医来检查匹诺曹。他断定，这头小驴一辈子都会瘸下去。班主听完，马上吩咐马夫。
        - id: ch05-b02
          speaker: director
          text: >-
            一头瘸驴，我留着能做什么？他只会吃饲料，又不能替我赚钱。把他牵到市场卖掉。
        - id: ch05-b03
          speaker: narrator
          text: >-
            到了市场，立刻有一个买主走过来问价。
        - id: ch05-b04
          speaker: purchaser
          text: >-
            这头瘸驴，你们要多少钱？
        - id: ch05-b05
          speaker: stable_boy
          text: >-
            二十块钱。
        - id: ch05-b06
          speaker: purchaser
          text: >-
            我只出两块。别以为我会让他干活，我买他只为了这张皮。他的皮够硬，正好做一面鼓，给我们村的乐队用。
        - id: ch05-b07
          speaker: narrator
          text: >-
            可怜的匹诺曹听见自己要被做成一面鼓，心里是什么滋味，你们想想吧。
        - id: ch05-b08
          speaker: narrator
          text: >-
            买主付过两块钱，马上把小驴牵到了海边。他先在匹诺曹脖子上牢牢系住一块石头，又拿来一根绳子，把一头绑在他的腿上，自己紧紧攥着另一头。做好这一切，那人突然猛推一把，把匹诺曹扔进水里。
        - id: ch05-b09
          speaker: narrator
          text: >-
            沉重的石头坠着匹诺曹，他立刻沉到了海底。新主人始终紧紧抓住绳子，安安稳稳坐在一块礁石上等候。他打算等小驴彻底淹死，再把尸体拉上来，剥下那张皮。
