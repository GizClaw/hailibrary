audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖从容，带一点一本正经的幽默
        timbre: 清晰醇厚
        pace: 舒缓，遇到惊奇处略微加快
        pitch: 中
    pinocchio:
      display_name: 匹诺曹
      tts:
        delivery: 任性直率，嘴硬而孩子气，发怒时冲动急躁
        timbre: 清亮，带木偶般的脆响
        pace: 偏快，争辩时更急
        pitch: 中高
    fairy:
      display_name: 蓝发仙女
      tts:
        delivery: 温柔亲切，话语简洁而沉静
        timbre: 柔和清澈
        pace: 舒缓
        pitch: 中高
  chapters:
    - id: ch01
      title: 小仙女成了妈妈
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 起初，那位善良的小个子女人怎么也不承认自己就是蓝发仙女。可身份已经叫匹诺曹看穿了，这出戏再演下去也没什么意思。她终于说出了实话。
        - id: ch01-b02
          speaker: fairy
          text: 你这个小淘气！你究竟是怎么认出我的？
        - id: ch01-b03
          speaker: pinocchio
          text: 我太爱您了，是我的心告诉我的。
        - id: ch01-b04
          speaker: fairy
          text: 你还记得吗？分别的时候，我还是个小姑娘。现在你再见到我，我已经长大了，年纪大得差不多能做你的妈妈啦。
        - id: ch01-b05
          speaker: pinocchio
          text: 那可太好啦！以后我不叫您小姐姐了，就叫您妈妈。我早就想像别的孩子一样，也有一位妈妈。可您怎么长得这么快呀？
          emotion: happy
        - id: ch01-b06
          speaker: fairy
          text: 这是个秘密。
        - id: ch01-b07
          speaker: pinocchio
          text: 那您教教我吧，我也想长大。您看，我一直只有这么点儿高，像九柱戏里的木瓶一样。
        - id: ch01-b08
          speaker: fairy
          text: 可你是长不大的。
        - id: ch01-b09
          speaker: pinocchio
          text: 我为什么长不大？
        - id: ch01-b10
          speaker: fairy
          text: 因为木偶不会长大。生下来是木偶，活着是木偶，死的时候也还是木偶。
        - id: ch01-b11
          speaker: narrator
          text: 匹诺曹抬手拍了自己一巴掌，大声叫了起来。
        - id: ch01-b12
          speaker: pinocchio
          text: 唉，我受够当木偶了！我该变成一个真正的人了。
          emotion: angry
        - id: ch01-b13
          speaker: fairy
          text: 只要你能让自己配得上，就会变成人。
        - id: ch01-b14
          speaker: pinocchio
          text: 真的吗？我要怎么做才配得上呢？
          emotion: surprised
        - id: ch01-b15
          speaker: fairy
          text: 很简单，你要学着做个好孩子。
    - id: ch02
      title: 做个好孩子的约定
      blocks:
        - id: ch02-b01
          speaker: pinocchio
          text: 难道您觉得我不是好孩子？
        - id: ch02-b02
          speaker: fairy
          text: 你正好相反。好孩子肯听话，可你呢？
        - id: ch02-b03
          speaker: pinocchio
          text: 我从来都不听话。
        - id: ch02-b04
          speaker: fairy
          text: 好孩子愿意学习，也肯干活，可你呢？
        - id: ch02-b05
          speaker: pinocchio
          text: 我却整年闲逛，到处流浪。
        - id: ch02-b06
          speaker: fairy
          text: 好孩子总是说真话。
        - id: ch02-b07
          speaker: pinocchio
          text: 我却老是撒谎。
        - id: ch02-b08
          speaker: fairy
          text: 好孩子都愿意去上学。
        - id: ch02-b09
          speaker: pinocchio
          text: 可我一上学就浑身难受。不过从今天开始，我一定改！
        - id: ch02-b10
          speaker: fairy
          text: 你真的答应我？
        - id: ch02-b11
          speaker: pinocchio
          text: 我答应您！我要变成好孩子，让爸爸因为我得到安慰。可我那可怜的爸爸，现在到底在哪里？
        - id: ch02-b12
          speaker: fairy
          text: 这个我不知道。
        - id: ch02-b13
          speaker: pinocchio
          text: 那我以后还能见到他，还能亲亲他吗？
        - id: ch02-b14
          speaker: fairy
          text: 我想能。不，我敢肯定，你一定能。
        - id: ch02-b15
          speaker: narrator
          text: 匹诺曹听了，高兴得简直忘了自己是谁。他捧住仙女的双手，一个劲儿地亲。随后，他抬起脸，满怀深情地望着她。
        - id: ch02-b16
          speaker: pinocchio
          text: 小妈妈，您告诉我，这么说，您并没有死，对吗？
        - id: ch02-b17
          speaker: fairy
          text: 看来我并没有死。
        - id: ch02-b18
          speaker: narrator
          text: 仙女微笑着回答。匹诺曹想起过去，心里又难过起来。
        - id: ch02-b19
          speaker: pinocchio
          text: 您不知道我有多伤心！我看到“这里安息着”那几个字，喉咙马上就堵住了……
          emotion: sad
        - id: ch02-b20
          speaker: fairy
          text: 我知道，所以我已经原谅你了。你的悲伤是真心的，我也看见了你善良的心。孩子只要心地善良，就算淘气，就算有坏习惯，也还是有希望改好。正因为这样，我才来这里找你。以后，我来做你的妈妈。
        - id: ch02-b21
          speaker: narrator
          text: 匹诺曹欢呼着跳了起来。
        - id: ch02-b22
          speaker: pinocchio
          text: 啊，这真是太好啦！
          emotion: happy
        - id: ch02-b23
          speaker: fairy
          text: 不过你得听我的。我叫你做什么，你就要做什么。
        - id: ch02-b24
          speaker: pinocchio
          text: 我一定听，一定听，一定听！
    - id: ch03
      title: 上学和做工
      blocks:
        - id: ch03-b01
          speaker: fairy
          text: 那么从明天开始，你就去上学。
        - id: ch03-b02
          speaker: narrator
          text: 匹诺曹一听，刚才的欢喜立刻少了一点儿。
        - id: ch03-b03
          speaker: fairy
          text: 往后，你还得选一门自己喜欢的手艺，或者学一种行当。
        - id: ch03-b04
          speaker: narrator
          text: 这一下，匹诺曹的脸变得非常严肃。他低着头，嘴里小声嘀咕起来。仙女听了，语气也严厉了。
        - id: ch03-b05
          speaker: fairy
          text: 你在那里嘀咕什么？
          emotion: angry
        - id: ch03-b06
          speaker: pinocchio
          text: 我只是觉得，现在才开始上学，好像已经太晚了。
          emotion: sad
        - id: ch03-b07
          speaker: fairy
          text: 一点也不晚，小先生。你要记住，不管什么时候开始学习、增长见识，都不会太迟。
        - id: ch03-b08
          speaker: pinocchio
          text: 可我不想学手艺，也不愿学什么行当。
        - id: ch03-b09
          speaker: fairy
          text: 这是为什么？
        - id: ch03-b10
          speaker: pinocchio
          text: 因为干活会把我累坏。
        - id: ch03-b11
          speaker: fairy
          text: 孩子，说这种话的人，到头来差不多总会进监狱，或者进医院。一个人不管生来富有还是贫穷，在这个世界上都得做点事情，都得忙起来、干起活来。懒惰的人会倒霉的！懒惰是一种可怕的病，必须从小赶快治。要是小时候不治，等老了就再也治不好了。
    - id: ch04
      title: 能不能做到，全看自己
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 仙女的话深深触动了匹诺曹。他猛地抬起头，认真地望着她。
        - id: ch04-b02
          speaker: pinocchio
          text: 我会学习，也会劳动。您叫我做什么，我全都照办！我真的已经受够当木偶了。不管要付出什么代价，我都想变成一个真正的孩子。您答应过我的，对不对？
        - id: ch04-b03
          speaker: fairy
          text: 我确实答应过你。现在能不能做到，就全看你自己了。
