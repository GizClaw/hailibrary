audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm and story-rich
        timbre: clear and rounded
        pace: measured
        pitch: medium
    pinocchio:
      display_name: Pinocchio
      tts:
        delivery: impulsive and defiant
        timbre: bright and wooden
        pace: quick
        pitch: medium-high
    little_woman:
      display_name: Little Woman
      tts:
        delivery: kind and gently playful
        timbre: soft and luminous
        pace: unhurried
        pitch: medium-high
  chapters:
    - id: ch01
      title: Pinocchio Promises the Fairy to Be Good
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: At first, the good little woman insisted that she was not the little Fairy with blue hair. But Pinocchio had seen through her disguise. She did not want to keep up the game any longer, so at last she told him who she really was.
        - id: ch01-b02
          speaker: little_woman
          text: You little rascal! How in the world did you recognize me?
        - id: ch01-b03
          speaker: pinocchio
          text: I love you so much that my heart knew it was you.
        - id: ch01-b04
          speaker: little_woman
          text: Do you remember how I looked when you left me? I was a child then. Now you've found me as a grown woman, nearly old enough to be your mother.
        - id: ch01-b05
          speaker: pinocchio
          text: That makes me so happy! I won't call you my little sister anymore. I'll call you Mamma. I've wanted a mother like other boys have for such a long time. But how did you grow up so quickly?
        - id: ch01-b06
          speaker: little_woman
          text: That's my secret.
        - id: ch01-b07
          speaker: pinocchio
          text: Then tell me the secret! I want to grow too. Look at me. I never get any taller than a ninepin.
        - id: ch01-b08
          speaker: little_woman
          text: You can't grow, Pinocchio.
        - id: ch01-b09
          speaker: pinocchio
          text: Why not?
        - id: ch01-b10
          speaker: little_woman
          text: Because puppets never grow. They're puppets when they're born, puppets all their lives, and puppets when they die.
        - id: ch01-b11
          speaker: pinocchio
          text: Oh, I'm tired of being a puppet! It's time for me to become a real person.
          emotion: angry
        - id: ch01-b12
          speaker: narrator
          text: He cried out and slapped himself in frustration.
        - id: ch01-b13
          speaker: little_woman
          text: You will become one, if you can prove that you deserve it.
        - id: ch01-b14
          speaker: pinocchio
          text: Really? What do I have to do?
        - id: ch01-b15
          speaker: little_woman
          text: It's very simple. Learn to be a good boy.
        - id: ch01-b16
          speaker: pinocchio
          text: Don't you think I'm good already?
        - id: ch01-b17
          speaker: little_woman
          text: You're just the opposite. Good boys obey, but you...
        - id: ch01-b18
          speaker: pinocchio
          text: I never obey anyone.
        - id: ch01-b19
          speaker: little_woman
          text: Good boys are glad to learn and work, but you...
        - id: ch01-b20
          speaker: pinocchio
          text: I spend the whole year wandering around and doing nothing.
        - id: ch01-b21
          speaker: little_woman
          text: Good boys always tell the truth.
        - id: ch01-b22
          speaker: pinocchio
          text: And I always tell lies.
        - id: ch01-b23
          speaker: little_woman
          text: Good boys go to school willingly.
        - id: ch01-b24
          speaker: pinocchio
          text: School makes my whole body ache. But starting today, I'm going to change the way I live.
        - id: ch01-b25
          speaker: little_woman
          text: Do you promise?
        - id: ch01-b26
          speaker: pinocchio
          text: I promise. I'll be a good little boy, and I'll make Papa proud and happy. But where is my poor papa now?
        - id: ch01-b27
          speaker: little_woman
          text: I don't know.
        - id: ch01-b28
          speaker: pinocchio
          text: Will I ever be lucky enough to see him again and kiss him?
        - id: ch01-b29
          speaker: little_woman
          text: I believe you will. In fact, I'm certain of it.
        - id: ch01-b30
          speaker: narrator
          text: Pinocchio was overjoyed. He caught the Fairy's hands and kissed them again and again, as if he could hardly contain himself. Then he lifted his face and gazed at her lovingly.
        - id: ch01-b31
          speaker: pinocchio
          text: Tell me, little Mamma. Does this mean it wasn't true that you had died?
        - id: ch01-b32
          speaker: little_woman
          text: It seems it wasn't.
        - id: ch01-b33
          speaker: narrator
          text: The Fairy smiled as she answered.
        - id: ch01-b34
          speaker: pinocchio
          text: If you knew how much I hurt! My throat tightened when I read those words, “Here lies...”
          emotion: sad
        - id: ch01-b35
          speaker: little_woman
          text: I do know. That's why I've forgiven you. Your grief was sincere, and it showed me that you have a good heart. When boys have good hearts, there's still hope for them, even if they're little scamps with bad habits. They can still change their ways. That's why I came here to find you. From now on, I'll be your mother.
        - id: ch01-b36
          speaker: pinocchio
          text: Oh, how wonderful!
          emotion: happy
        - id: ch01-b37
          speaker: narrator
          text: Pinocchio shouted and jumped for joy.
        - id: ch01-b38
          speaker: little_woman
          text: Then you must obey me and do everything I tell you.
        - id: ch01-b39
          speaker: pinocchio
          text: Gladly! Gladly! Gladly!
          emotion: happy
        - id: ch01-b40
          speaker: little_woman
          text: Tomorrow you'll start going to school.
        - id: ch01-b41
          speaker: narrator
          text: At once, Pinocchio's joy faded a little.
        - id: ch01-b42
          speaker: little_woman
          text: After that, you'll choose a craft or a trade, whichever you prefer.
        - id: ch01-b43
          speaker: narrator
          text: Pinocchio suddenly looked very serious and began muttering under his breath.
        - id: ch01-b44
          speaker: little_woman
          text: What are you mumbling about?
          emotion: angry
        - id: ch01-b45
          speaker: pinocchio
          text: I was only saying that it feels a little late for me to start school now.
        - id: ch01-b46
          speaker: narrator
          text: The puppet moaned the words in a low voice.
        - id: ch01-b47
          speaker: little_woman
          text: No, young man. Remember this. It's never too late for us to learn and educate ourselves.
        - id: ch01-b48
          speaker: pinocchio
          text: But I don't want to learn a craft or take up a trade.
        - id: ch01-b49
          speaker: little_woman
          text: Why don't you?
        - id: ch01-b50
          speaker: pinocchio
          text: Because working makes me tired.
        - id: ch01-b51
          speaker: little_woman
          text: My boy, people who talk that way almost always end up in prison or in the hospital. Every person in this world, rich or poor, has to do something useful. Everyone has to keep busy and work. A lazy life is a terrible illness, and it must be cured while you're still young. If you wait until you're old, it can never be cured.
        - id: ch01-b52
          speaker: narrator
          text: Her words touched Pinocchio. He quickly raised his head and looked at the Fairy.
        - id: ch01-b53
          speaker: pinocchio
          text: I'll study. I'll work. I'll do everything you tell me. I truly am tired of being a puppet, and I want to become a boy more than anything. You did promise that I would become one, didn't you?
        - id: ch01-b54
          speaker: little_woman
          text: I did promise. Now it all depends on you.
