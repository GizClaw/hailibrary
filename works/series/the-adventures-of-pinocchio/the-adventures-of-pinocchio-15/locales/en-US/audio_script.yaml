audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm and story-rich
        timbre: clear and rounded
        pace: measured
        pitch: medium
    pinocchio:
      display_name: Pinocchio
      tts:
        delivery: impulsive and defiant
        timbre: bright and wooden
        pace: quick
        pitch: medium-high
    tall_assassin:
      display_name: The Tall Assassin
      tts:
        delivery: cold and threatening
        timbre: deep and hollow
        pace: slow
        pitch: low
    short_assassin:
      display_name: The Short Assassin
      tts:
        delivery: harsh and menacing
        timbre: rough and hollow
        pace: clipped
        pitch: medium-low
    blue_haired_child:
      display_name: The Blue-Haired Child
      tts:
        delivery: distant and unearthly
        timbre: pale and delicate
        pace: slow
        pitch: medium-high
  chapters:
    - id: ch01
      title: The Assassins Hang Pinocchio to the Big Oak
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: At the sight of the assassins still behind him, Pinocchio lost his courage. He almost threw himself down and gave up. Then he looked all around and spotted a little house in the distance, as white as snow.
        - id: ch01-b02
          speaker: pinocchio
          text: If I have enough breath to reach that house, maybe I'll be saved.
        - id: ch01-b03
          speaker: narrator
          text: He did not waste another second. He raced through the woods for his life, with the assassins chasing him. The desperate run lasted nearly two hours. At last, completely out of breath, Pinocchio reached the house and knocked on the door.
        - id: ch01-b04
          speaker: narrator
          text: No one answered.
        - id: ch01-b05
          speaker: narrator
          text: He knocked again, much harder. Behind him, he could hear approaching footsteps and the heavy panting of his pursuers. Still, the house was silent.
        - id: ch01-b06
          speaker: narrator
          text: Knocking was no use. In desperation, Pinocchio kicked the door and pounded it with all his strength. Then a window opened. A beautiful child stood there. Her hair was blue, and her face was as white as wax. Her eyes were closed, and her hands were folded across her chest. Her lips did not move at all, but a voice came from her that seemed to belong to another world.
        - id: ch01-b07
          speaker: blue_haired_child
          text: There is no one in this house. Everyone here is dead.
        - id: ch01-b08
          speaker: narrator
          text: Pinocchio shouted up at her, crying and begging.
        - id: ch01-b09
          speaker: pinocchio
          text: Then please open the door for me yourself!
          emotion: fearful
        - id: ch01-b10
          speaker: blue_haired_child
          text: I am dead too.
        - id: ch01-b11
          speaker: pinocchio
          text: Dead? Then why are you standing at the window?
          emotion: surprised
        - id: ch01-b12
          speaker: blue_haired_child
          text: I am waiting for the funeral bier to carry me away.
        - id: ch01-b13
          speaker: narrator
          text: As soon as she had spoken, she vanished. The window closed again without making the slightest sound.
        - id: ch01-b14
          speaker: pinocchio
          text: Oh, beautiful child with blue hair, please open the door! Have mercy on a poor boy being chased by assas—
          emotion: fearful
        - id: ch01-b15
          speaker: narrator
          text: He never finished the word. Someone seized him by the collar, and the same two dreadful voices threatened him together.
        - id: ch01-b16
          speakers: [tall_assassin, short_assassin]
          ensemble: duo
          text: You won't get away from us this time!
        - id: ch01-b17
          speaker: narrator
          text: With death staring him in the face, Pinocchio began to tremble so hard that the joints in his wooden legs creaked. The gold coins beneath his tongue clinked against one another.
        - id: ch01-b18
          speaker: tall_assassin
          text: Well? Are you going to open your mouth or not?
        - id: ch01-b19
          speaker: short_assassin
          text: Still no answer? Fine. We'll force your mouth open this time!
          emotion: angry
        - id: ch01-b20
          speaker: narrator
          text: They pulled out two long, horrible knives, each one sharp as a razor. Clash! They stabbed at him twice. But luckily for Pinocchio, he was made of very hard wood. Both blades shattered into a thousand pieces. The assassins stood holding only the handles and stared at each other.
        - id: ch01-b21
          speaker: tall_assassin
          text: I know what we have to do. We have to hang him!
        - id: ch01-b22
          speaker: short_assassin
          text: Yes, hang him!
        - id: ch01-b23
          speaker: narrator
          text: They acted at once. They tied Pinocchio's arms behind his back, slipped a running noose around his neck, and hung him from a branch of the tree called the Big Oak.
        - id: ch01-b24
          speaker: narrator
          text: Then they sat on the grass and waited for his final struggle. Three hours passed. Pinocchio's eyes were still open, his mouth was still shut, and he was kicking harder than ever.
        - id: ch01-b25
          speaker: narrator
          text: At last, the assassins lost their patience. They called up to him in mocking voices.
        - id: ch01-b26
          speakers: [tall_assassin, short_assassin]
          ensemble: duo
          text: Goodbye until tomorrow. When we come back, please be polite enough to be completely dead, with your mouth wide open for us!
        - id: ch01-b27
          speaker: narrator
          text: With that, they walked away.
        - id: ch01-b28
          speaker: narrator
          text: Meanwhile, a wild north wind began to blow. It roared angrily and battered the poor puppet from side to side. Pinocchio swung violently, clattering like a bell ringing for a wedding. Each swing brought terrible spasms, and the noose pulled tighter around his throat until he could hardly breathe.
        - id: ch01-b29
          speaker: narrator
          text: Little by little, his eyes grew dim. He felt death coming near, but he still hoped some kind person would arrive in time to help him. He waited and waited. No one came. Not a single person.
        - id: ch01-b30
          speaker: narrator
          text: Then Pinocchio remembered his poor father. Believing he was about to die, he managed to stammer a few words.
        - id: ch01-b31
          speaker: pinocchio
          text: Oh, Papa! Papa! If only you were here!
          emotion: sad
        - id: ch01-b32
          speaker: narrator
          text: His breath gave out, and he could say no more.
        - id: ch01-b33
          speaker: narrator
          text: Pinocchio closed his eyes, opened his mouth, and stretched out his legs. One long shudder passed through him. Then he hung there, stiff and unconscious.
