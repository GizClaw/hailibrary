audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖从容，带一点一本正经的幽默
        timbre: 清晰醇厚
        pace: 舒缓，遇到惊奇处略微加快
        pitch: 中
    pinocchio:
      display_name: 匹诺曹
      tts:
        delivery: 任性直率，嘴硬而孩子气，发怒时冲动急躁
        timbre: 清亮，带木偶般的脆响
        pace: 偏快，争辩时更急
        pitch: 中高
    masked_assassin_1:
      display_name: 蒙面凶徒甲
      tts:
        delivery: 阴森凶恶，逼迫威吓时冷酷果断
        timbre: 粗哑低沉，带干涩的摩擦感
        pace: 短促急迫
        pitch: 低
    masked_assassin_2:
      display_name: 蒙面凶徒乙
      tts:
        delivery: 凶狠躁厉，附和同伴时带着残忍的兴奋
        timbre: 沙哑阴冷，声音比同伴稍尖
        pace: 急促有力
        pitch: 中低
    blue_haired_child:
      display_name: 蓝发女孩
      tts:
        delivery: 空灵冷寂，像从另一个世界传来的声音
        timbre: 轻柔清冷
        pace: 缓慢平直
        pitch: 中高
  chapters:
    - id: ch01
      title: 雪白的小屋
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 看到那副情景，匹诺曹的勇气全没了。他差点倒在地上，觉得自己再也逃不掉了。可他朝四周一望，远处竟有一座雪白的小屋。
        - id: ch01-b02
          speaker: pinocchio
          text: 只要我能撑着跑到那里，说不定还有救。
        - id: ch01-b03
          speaker: narrator
          text: 他不敢耽搁，转身又在树林里拼命奔跑。两个凶徒仍在后面追。差不多两个小时过去，匹诺曹终于冲到小屋门前。他已经喘不过气了，还是抬起手，使劲敲门。
        - id: ch01-b04
          speaker: narrator
          text: 屋里没有回应。
        - id: ch01-b05
          speaker: narrator
          text: 匹诺曹听见脚步越来越近，还听见追赶他的人呼哧呼哧地喘气，便用尽力气再次敲门。里面依旧静悄悄的。
        - id: ch01-b06
          speaker: narrator
          text: 敲门没有用，他急得又踢又捶，恨不得把门砸开。就在这时，窗子打开了。窗前站着一个美丽的小女孩。她有一头蓝发，脸白得像蜡，眼睛闭着，双手交叉放在胸口。她的嘴唇明明没有动，匹诺曹却听见一个仿佛从另一个世界飘来的声音。
        - id: ch01-b07
          speaker: blue_haired_child
          text: 这座屋子里没人了。他们都死了。
        - id: ch01-b08
          speaker: pinocchio
          text: 那你给我开开门吧，求求你了！
          emotion: fearful
        - id: ch01-b09
          speaker: blue_haired_child
          text: 我也已经死了。
        - id: ch01-b10
          speaker: pinocchio
          text: 你死了？那为什么还站在窗前？
        - id: ch01-b11
          speaker: blue_haired_child
          text: 我在等灵柩来接我走。
        - id: ch01-b12
          speaker: narrator
          text: 说完，女孩立刻不见了。窗子轻轻合上，一点声音也没有。
    - id: ch02
      title: 凶徒追到门前
      blocks:
        - id: ch02-b01
          speaker: pinocchio
          text: 蓝头发的美丽女孩，求你把门打开吧！可怜可怜我，我正被杀人凶……
          emotion: fearful
        - id: ch02-b02
          speaker: narrator
          text: 匹诺曹连最后一个字都没说完，衣领就被人揪住了。那两个阴森的声音又贴着他响了起来。
        - id: ch02-b03
          speakers: [masked_assassin_1, masked_assassin_2]
          ensemble: duo
          text: 这一次，你再也逃不掉了！
          emotion: angry
        - id: ch02-b04
          speaker: narrator
          text: 死亡就在眼前，匹诺曹抖得厉害。两条木腿的关节咯吱咯吱响，藏在舌头下面的金币也叮当作响。
        - id: ch02-b05
          speakers: [masked_assassin_1, masked_assassin_2]
          ensemble: duo
          text: 怎么样？你到底肯不肯张嘴？还不说话？好，那就由我们亲手把你的嘴打开！
          emotion: angry
        - id: ch02-b06
          speaker: narrator
          text: 两个凶徒拔出长长的尖刀。刀刃锋利得像剃刀。咔嚓！咔嚓！他们对准匹诺曹刺了两下。
        - id: ch02-b07
          speaker: narrator
          text: 可匹诺曹是用硬木头做的。两把刀一下碎成无数片，凶徒们手里只剩下刀柄。他们愣愣地看着对方。
        - id: ch02-b08
          speaker: masked_assassin_1
          text: 有办法了。把他吊起来！吊死他！
        - id: ch02-b09
          speaker: narrator
          text: 另一个凶徒马上跟着喊，也要把他吊死。
        - id: ch02-b10
          speaker: masked_assassin_2
          text: 对，把他吊死！
    - id: ch03
      title: 大橡树
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 两个凶徒不再耽搁。他们把匹诺曹的双手反绑到背后，在他的脖子上套了个活结，又把他吊到一棵树的枝头。那棵树名叫“大橡树”。
        - id: ch03-b02
          speaker: narrator
          text: 接着，他们坐在草地上，等着看木偶咽气。可整整三个小时过去了，匹诺曹还睁着眼睛，嘴也闭得紧紧的，两条腿甚至踢得比先前更厉害。
        - id: ch03-b03
          speaker: narrator
          text: 两个凶徒等得不耐烦了，便抬头嘲笑他。
        - id: ch03-b04
          speakers: [masked_assassin_1, masked_assassin_2]
          ensemble: duo
          text: 再见啦，明天见。等我们回来，你可要懂点礼貌，乖乖死透，把嘴张得大大的，让我们一眼就能看见。
        - id: ch03-b05
          speaker: narrator
          text: 他们说完就走了。
    - id: ch04
      title: 爸爸，你要是在这里
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 这时，狂暴的北风刮了起来。风愤怒地吼着，把可怜的木偶从这边吹到那边。他在树枝下剧烈摇摆，像婚礼上敲得震天响的钟。每荡一下，他的身体就疼得抽搐。脖子上的活结越勒越紧，他已经喘不上气了。
        - id: ch04-b02
          speaker: narrator
          text: 匹诺曹的眼前一点点暗下去。他知道死神就在附近，可还是盼着能有一个好心人赶来救他。只是他等了又等，谁也没有来。真的，一个人也没有。
        - id: ch04-b03
          speaker: narrator
          text: 这时候，匹诺曹想起了可怜的爸爸。他觉得自己就要死了，只能断断续续地喊出声。
        - id: ch04-b04
          speaker: pinocchio
          text: 爸爸！爸爸！你要是在这里该多好！
          emotion: sad
        - id: ch04-b05
          speaker: narrator
          text: 他再也接不上气，一个字也说不出来了。他闭上眼睛，张开嘴巴，两条腿直直伸开，浑身长长地颤了一下。最后，他僵硬地吊在那里，失去了知觉。
