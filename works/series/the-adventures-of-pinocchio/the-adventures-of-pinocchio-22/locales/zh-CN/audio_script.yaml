audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖从容，带一点一本正经的幽默
        timbre: 清晰醇厚
        pace: 舒缓，遇到惊奇处略微加快
        pitch: 中
    pinocchio:
      display_name: 匹诺曹
      tts:
        delivery: 任性直率，嘴硬而孩子气，发怒时冲动急躁
        timbre: 清亮，带木偶般的脆响
        pace: 偏快，争辩时更急
        pitch: 中高
    farmer:
      display_name: 农夫
      tts:
        delivery: 粗声直气，恼怒时严厉强硬
        timbre: 低沉粗粝
        pace: 稍慢，斥责时干脆有力
        pitch: 低
    polecat:
      display_name: 臭鼬
      tts:
        delivery: 鬼鬼祟祟，亲热里藏着狡猾
        timbre: 细窄而略带沙哑
        pace: 轻快，谈条件时慢条斯理
        pitch: 中高
  chapters:
    - id: ch01
      title: 半夜里的密谈
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 匹诺曹沉沉睡了大约两个钟头。快到半夜时，院子里传来几道陌生的低语，把他吵醒了。他把鼻尖探出狗窝，看见四只黑毛小兽围在一起商量。它们模样像猫，其实是最贪吃鸡蛋和小鸡的臭鼬。有一只离开同伴，悄悄走到狗窝口。
        - id: ch01-b02
          speaker: polecat
          text: 晚上好啊，梅兰波。
        - id: ch01-b03
          speaker: pinocchio
          text: 你认错了，我不叫梅兰波。
        - id: ch01-b04
          speaker: polecat
          text: 咦，那你是谁？你待在这里干什么？
        - id: ch01-b05
          speaker: pinocchio
          text: 我是匹诺曹，现在替人看家。
        - id: ch01-b06
          speaker: polecat
          text: 那梅兰波去哪儿了？就是原来住在这个狗窝里的老狗。
        - id: ch01-b07
          speaker: pinocchio
          text: 它今天早晨死了。
        - id: ch01-b08
          speaker: polecat
          text: 它死了？真可怜！它从前对我们可好啦。不过看你的脸，你大概也是条好狗。
        - id: ch01-b09
          speaker: pinocchio
          text: 请你听清楚，我可不是狗。
        - id: ch01-b10
          speaker: polecat
          text: 不是狗？那你究竟是什么？怎么还在这里替人看家？
        - id: ch01-b11
          speaker: pinocchio
          text: 我是个木偶。替人看家是对我的惩罚，我也没办法。
        - id: ch01-b12
          speaker: polecat
          text: 那正好。我们以前跟梅兰波谈妥了一桩交易，现在也照样跟你做。你听了一定满意。
        - id: ch01-b13
          speaker: pinocchio
          text: 什么交易？
        - id: ch01-b14
          speaker: polecat
          text: 每星期有一个晚上，你放我们进鸡舍，拿走八只鸡。我们吃七只，剩下一只送给你。你只要装睡，别出声，也别把农夫吵醒。
        - id: ch01-b15
          speaker: pinocchio
          text: 梅兰波以前真是这么做的？
        - id: ch01-b16
          speaker: polecat
          text: 当然，我们一直相处得很好。你安安心心睡吧。等我们走的时候，会在狗窝旁留一只拔好毛的肥鸡，正好给你明早吃。这样够明白了吧？
        - id: ch01-b17
          speaker: pinocchio
          text: 明白，明白得不能再明白了！
        - id: ch01-b18
          speaker: narrator
          text: 匹诺曹嘴上答应着，脑袋却狠狠摇了摇。那神情仿佛在说，你们马上就知道我的意思了。
    - id: ch02
      title: 鸡舍里的强盗
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 四只臭鼬以为事情办妥了，便溜到紧挨狗窝的鸡舍旁。它们拿牙咬，用爪子抓，终于弄开木门，一个接一个钻进去。最后一只才刚进门，身后就传来“砰”的一声，木门重重关上了。
        - id: ch02-b02
          speaker: narrator
          text: 原来是匹诺曹关了门。他怕门再被推开，又搬来一块大石头牢牢抵住。接着，他学起真正的看家狗，放声大叫。
        - id: ch02-b03
          speaker: pinocchio
          text: 汪！汪！汪！汪！
        - id: ch02-b04
          speaker: narrator
          text: 农夫听见叫声，马上跳下床，抓起枪跑到窗口。
        - id: ch02-b05
          speaker: farmer
          text: 出什么事了？
        - id: ch02-b06
          speaker: pinocchio
          text: 有强盗闯进来了！
        - id: ch02-b07
          speaker: farmer
          text: 强盗在哪儿？
        - id: ch02-b08
          speaker: pinocchio
          text: 就在鸡舍里。
        - id: ch02-b09
          speaker: farmer
          text: 我这就下来。
    - id: ch03
      title: 农夫捉住了贼
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 农夫说到就到，快得连一声“阿门”都来不及念完。他冲进鸡舍，捉住四只臭鼬，全塞进一只口袋里。看着终于到手的贼，他别提多得意了。
        - id: ch03-b02
          speaker: farmer
          text: 哈，你们总算落进我手里了！我当然可以狠狠收拾你们，可我这个人没那么残忍。明天早晨，我只把你们送给邻村的客店老板。他会剥掉你们的皮，把你们当成野兔，配上糖醋汁烧了吃。这种体面本来轮不到你们，不过我这么宽宏大量，哪会计较这点小事！
        - id: ch03-b03
          speaker: narrator
          text: 农夫走到匹诺曹身边，亲热地摸了摸他，还问起他立功的经过。
        - id: ch03-b04
          speaker: farmer
          text: 你是怎么发现这四个贼的？我那条忠心的梅兰波啊，可从来没看出半点不对劲！
    - id: ch04
      title: 匹诺曹获得自由
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 匹诺曹本来可以把真相全说出来，揭穿梅兰波和臭鼬之间那桩可耻的交易。可他一想到那条狗已经死了，就把话留在了心里。
        - id: ch04-b02
          speaker: pinocchio
          text: 何必再去指责一个死去的呢？死者已经死了，还是让它安安静静地长眠吧！
        - id: ch04-b03
          speaker: narrator
          text: 农夫并不知道他心里在想什么，又接着问了下去。
        - id: ch04-b04
          speaker: farmer
          text: 那些贼进院子的时候，你到底醒着，还是睡着了？
        - id: ch04-b05
          speaker: pinocchio
          text: 我本来睡着了，是它们说话把我吵醒的。有一只还走到狗窝前，说只要我不叫，也不惊醒主人，它们就送我一只拔好毛的肥鸡。它们胆子可真大，居然敢跟我谈这种条件！我虽然是木偶，身上的毛病也许多得数不清，可我绝不会跟不诚实的家伙做交易，更不会跟它们一起分赃！
        - id: ch04-b06
          speaker: farmer
          text: 说得好，孩子！这番话真给你争光。为了谢谢你，我现在就放你走，你可以回家了。
          emotion: happy
        - id: ch04-b07
          speaker: narrator
          text: 农夫伸手拍了拍匹诺曹的肩膀，随即取下了他脖子上的狗项圈。
