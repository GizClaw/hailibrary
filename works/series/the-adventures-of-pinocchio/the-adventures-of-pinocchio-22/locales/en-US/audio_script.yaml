        pitch: low
  chapters:
    - id: ch01
      title: Pinocchio Discovers the Robbers
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Pinocchio had been fast asleep for about two hours when strange whispers woke him near midnight. The voices seemed to be coming from the courtyard. He poked the tip of his nose out of the kennel and saw four small, dark-furred animals huddled together. At first they looked like cats. But they were polecats, meat-eating little creatures with a special hunger for eggs and young chickens.
        - id: ch01-b02
          speaker: narrator
          text: One polecat left the others, crept over to the kennel, and spoke in a low voice.
        - id: ch01-b03
          speaker: polecat
          text: Good evening, Melampo.
        - id: ch01-b04
          speaker: pinocchio
          text: My name isn't Melampo.
        - id: ch01-b05
          speaker: polecat
          text: Oh! Then who are you?
        - id: ch01-b06
          speaker: pinocchio
          text: I'm Pinocchio.
        - id: ch01-b07
          speaker: polecat
          text: What are you doing in his kennel?
        - id: ch01-b08
          speaker: pinocchio
          text: I'm serving as the watchdog.
        - id: ch01-b09
          speaker: polecat
          text: Then where is Melampo, the old dog who used to live here?
        - id: ch01-b10
          speaker: pinocchio
          text: He died this morning.
        - id: ch01-b11
          speaker: polecat
          text: Dead? Poor creature! He was such a good fellow. And from the look of you, I'd say you're a good dog too.
        - id: ch01-b12
          speaker: pinocchio
          text: Excuse me, but I'm not a dog.
        - id: ch01-b13
          speaker: polecat
          text: You're not? What are you, then?
        - id: ch01-b14
          speaker: pinocchio
          text: I'm a puppet.
        - id: ch01-b15
          speaker: polecat
          text: And you're working as a watchdog?
        - id: ch01-b16
          speaker: pinocchio
          text: I'm afraid so. It's my punishment.
        - id: ch01-b17
          speaker: polecat
          text: In that case, I'll offer you the same arrangement we had with poor Melampo. I'm sure you'll be pleased with it.
        - id: ch01-b18
          speaker: pinocchio
          text: What kind of arrangement?
        - id: ch01-b19
          speaker: polecat
          text: One night every week, you let us visit the chicken yard, just as we've always done. We'll carry away eight chickens. We eat seven, and you get the eighth one for yourself. There's just one firm condition. You must pretend to be asleep. Don't even think about barking or waking the peasant.
        - id: ch01-b20
          speaker: pinocchio
          text: Melampo really did that?
        - id: ch01-b21
          speaker: polecat
          text: Of course. We always got along wonderfully. Go back to sleep and don't worry. Before we leave, we'll put a fine plucked chicken beside the kennel for your breakfast tomorrow. Is our agreement perfectly clear?
        - id: ch01-b22
          speaker: pinocchio
          text: Perfectly clear.
        - id: ch01-b23
          speaker: narrator
          text: Pinocchio answered with a threatening shake of his head. He didn't say the thought aloud, but his look made it plain. These polecats were going to hear more from him very soon.
        - id: ch01-b24
          speaker: narrator
          text: The four polecats believed they were perfectly safe. They hurried to the chicken yard, which stood close beside the kennel. Using their teeth and claws, they worked open its wooden gate. Then they slipped inside one after another. The last polecat had barely crossed the opening when the gate slammed violently shut behind them.
        - id: ch01-b25
          speaker: narrator
          text: Pinocchio had closed it. To make sure it stayed closed, he braced a large stone against it. Then he began barking exactly like a watchdog.
        - id: ch01-b26
          speaker: pinocchio
          text: Bow-wow! Bow-wow!
        - id: ch01-b27
          speaker: narrator
          text: The barking made the peasant leap out of bed. He grabbed his gun, came to the window, and called down.
        - id: ch01-b28
          speaker: peasant
          text: What's going on?
        - id: ch01-b29
          speaker: pinocchio
          text: Robbers!
        - id: ch01-b30
          speaker: peasant
          text: Where are they?
        - id: ch01-b31
          speaker: pinocchio
          text: In the chicken yard!
        - id: ch01-b32
          speaker: peasant
          text: I'm coming right down.
        - id: ch01-b33
          speaker: narrator
          text: And down he came, faster than anyone could say “Amen!” He rushed into the chicken yard, caught all four polecats, and stuffed them into a sack. Then he spoke to them with great satisfaction.
        - id: ch01-b34
          speaker: peasant
          text: At last I've caught you! I could give you the punishment you deserve, but I'm not that cruel. I'll settle for taking you to the innkeeper in the next village tomorrow morning. He can skin you, cook you as if you were hares, and serve you in sweet-and-sour sauce. That's an honor you certainly don't deserve. Still, generous people like me don't worry about little things like that!
        - id: ch01-b35
          speaker: narrator
          text: Then the peasant went over to Pinocchio and petted him. He had one question in particular.
        - id: ch01-b36
          speaker: peasant
          text: How did you find those four thieves? Just think! My faithful Melampo never discovered a thing!
        - id: ch01-b37
          speaker: narrator
          text: Pinocchio could have told the whole story right then. He could have exposed every shameful condition Melampo had agreed to with the polecats. But he remembered that the old dog was dead, and another thought came to him.
        - id: ch01-b38
          speaker: pinocchio
          text: What good would it do to accuse the dead? The dead are gone. It's best to leave them in peace.
        - id: ch01-b39
          speaker: narrator
          text: The peasant kept questioning him.
        - id: ch01-b40
          speaker: peasant
          text: When the thieves entered the yard, were you asleep or awake?
        - id: ch01-b41
          speaker: pinocchio
          text: I was asleep. The polecats woke me with their whispering, and one of them came right up to the kennel. He said they'd give me a fine chicken, already plucked, if I promised not to bark and not to wake you. Imagine having the nerve to make me an offer like that! I may be a puppet with nearly every fault in the world, but there's one fault I'll never have. I won't make deals with dishonest people, and I won't take a share of what they steal!
        - id: ch01-b42
          speaker: peasant
          text: Well said, my boy! That kind of honesty does you credit. To show you how grateful I am, I'll set you free right now, and you can go home.
          emotion: happy
        - id: ch01-b43
          speaker: narrator
          text: And with that, the peasant removed the dog collar.
