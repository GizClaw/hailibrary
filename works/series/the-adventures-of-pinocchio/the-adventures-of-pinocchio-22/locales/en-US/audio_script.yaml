audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm and story-rich
        timbre: clear and rounded
        pace: measured
        pitch: medium
    pinocchio:
      display_name: Pinocchio
      tts:
        delivery: impulsive and defiant
        timbre: bright and wooden
        pace: quick
        pitch: medium-high
    polecat:
      display_name: Polecat
      tts:
        delivery: sly and coaxing
        timbre: small and raspy
        pace: quick
        pitch: medium-high
    peasant:
      display_name: Peasant
      tts:
        delivery: stern and rough-spoken
        timbre: coarse and earthy
