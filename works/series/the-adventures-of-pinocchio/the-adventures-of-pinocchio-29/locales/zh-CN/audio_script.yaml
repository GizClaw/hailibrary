audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖从容，带一点一本正经的幽默
        timbre: 清晰醇厚
        pace: 舒缓，遇到惊奇处略微加快
        pitch: 中
    pinocchio:
      display_name: 匹诺曹
      tts:
        delivery: 任性直率，嘴硬而孩子气，危急时急促慌张
        timbre: 清亮，带木偶般的脆响
        pace: 偏快，争辩时更急
        pitch: 中高
    alidoro:
      display_name: 阿利多罗
      tts:
        delivery: 忠厚直率，遇险时惊慌，感激时诚恳
        timbre: 粗厚有力，带大型犬的低沉气息
        pace: 中等，慌乱时急促
        pitch: 中低
    green_fisherman:
      display_name: 绿渔夫
      tts:
        delivery: 怪诞贪吃，自鸣得意，说残酷的话也若无其事
        timbre: 粗哑黏滞
        pace: 偏慢
        pitch: 低
    old_man:
      display_name: 小老头
      tts:
        delivery: 朴实坦率，问话时带着温和的好奇
        timbre: 苍老而清楚
        pace: 中等偏慢
        pitch: 中低
    snail:
      display_name: 蜗牛
      tts:
        delivery: 不慌不忙，一本正经，始终慢条斯理
        timbre: 柔和圆润
        pace: 很慢
        pitch: 中
    fairy:
      display_name: 仙女
      tts:
        delivery: 温柔庄重，宽容中带着明确的告诫
        timbre: 清澈柔和
        pace: 从容
        pitch: 中高
  chapters:
    - id: ch01
      title: 阿利多罗来相救
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 渔夫眼看就要把匹诺曹扔进煎锅，一条大狗忽然钻进洞里。煎鱼的香味又浓又鲜，是它一路闻着找来的。
        - id: ch01-b02
          speaker: green_fisherman
          text: 滚出去！
          emotion: angry
        - id: ch01-b03
          speaker: narrator
          text: 渔夫一边吼，一边把裹满面粉的木偶抓在手里，摆出一副吓人的样子。可这条可怜的狗饿得像头狼，只管呜呜叫，还不停摇尾巴。它那个样子，就像是在求渔夫。
        - id: ch01-b04
          speaker: alidoro
          text: 给我一口鱼吃吧。吃到了，我马上就走，再也不烦你。
        - id: ch01-b05
          speaker: green_fisherman
          text: 我叫你滚出去！
          emotion: angry
        - id: ch01-b06
          speaker: narrator
          text: 渔夫抬腿要踢。狗已经饿到极处，可不肯再受戏弄。它猛地掉过头，低声咆哮，露出一排吓人的尖牙。就在这时，洞里传来一个微弱的声音。
        - id: ch01-b07
          speaker: pinocchio
          text: 阿利多罗，救救我！你要是不救我，我就要被炸熟啦！
          emotion: fearful
        - id: ch01-b08
          speaker: narrator
          text: 阿利多罗认出了匹诺曹的声音，惊讶得不得了。更怪的是，那声音竟从渔夫手里的面粉团里传出来。你猜它怎么做？它纵身一跃，一口叼住那团东西，小心衔在牙齿中间，飞快冲出洞去，像一道闪电，眨眼就没了踪影。
        - id: ch01-b09
          speaker: narrator
          text: 渔夫眼看自己一心想吃的鱼被狗抢走，气得发疯，拔腿就在后面追。可他才跑出几步便突然咳个不停，只好放弃。阿利多罗一直跑到通往村庄的小路上，才停下来，把朋友匹诺曹轻轻放在地上。
        - id: ch01-b10
          speaker: pinocchio
          text: 你救了我的命，我真不知道该怎么谢你！
          emotion: happy
        - id: ch01-b11
          speaker: alidoro
          text: 不用谢。你救过我，现在我也救了你。我们活在世上，本来就该互相帮助。
        - id: ch01-b12
          speaker: pinocchio
          text: 可你怎么会跑到那个洞里？
        - id: ch01-b13
          speaker: alidoro
          text: 我躺在岸边，只剩半条命了。风送来了煎鱼的香味，勾得我馋虫大动，我就顺着味道找过去了。我要是再迟到一秒钟……
        - id: ch01-b14
          speaker: narrator
          text: 匹诺曹还在害怕，浑身直抖。他呻吟着打断了阿利多罗。
        - id: ch01-b15
          speaker: pinocchio
          text: 别说啦，千万别说啦！你要是再迟一秒钟，我现在早就被炸熟、吃掉，还消化完了。呃……想一想我都打哆嗦！
          emotion: fearful
        - id: ch01-b16
          speaker: narrator
          text: 阿利多罗笑了，向木偶伸出右前爪。匹诺曹热情地握了握，用这个动作表示两人已经有了深厚的友谊。随后，他们便各自上路，分手了。
    - id: ch02
      title: 鼻子说出了真话
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 阿利多罗踏上回家的路。匹诺曹独自来到附近一间小屋前，看见一个小老头正坐在太阳底下取暖。
        - id: ch02-b02
          speaker: pinocchio
          text: 老伯，您知不知道有个叫尤金的可怜孩子？他的脑袋受伤了。
        - id: ch02-b03
          speaker: old_man
          text: 几个渔夫把他送到了这间屋里。现在他……
        - id: ch02-b04
          speaker: pinocchio
          text: 他现在已经死了！
          emotion: sad
        - id: ch02-b05
          speaker: old_man
          text: 没有，他还活着，已经回家去了。
        - id: ch02-b06
          speaker: narrator
          text: 匹诺曹高兴得跳起舞来。
        - id: ch02-b07
          speaker: pinocchio
          text: 真的？真的是这样？那他的伤不重吗？
          emotion: happy
        - id: ch02-b08
          speaker: old_man
          text: 伤势本来可能很严重，连命都可能保不住。因为有人用一本硬纸板封面的厚书，砸中了他的脑袋。
        - id: ch02-b09
          speaker: pinocchio
          text: 是谁扔的？
        - id: ch02-b10
          speaker: old_man
          text: 他的一个同学。那家伙叫匹诺曹。
        - id: ch02-b11
          speaker: narrator
          text: 木偶故意装作不认识。
        - id: ch02-b12
          speaker: pinocchio
          text: 匹诺曹是谁呀？
        - id: ch02-b13
          speaker: old_man
          text: 听说是个坏孩子，到处游荡，一点儿用处也没有。
        - id: ch02-b14
          speaker: pinocchio
          text: 胡说！全是胡说！
          emotion: angry
        - id: ch02-b15
          speaker: old_man
          text: 你认识他？
        - id: ch02-b16
          speaker: pinocchio
          text: 见过几面！
        - id: ch02-b17
          speaker: old_man
          text: 那你觉得他怎么样？
        - id: ch02-b18
          speaker: pinocchio
          text: 我觉得他是个特别好的孩子。他爱学习，也听话，还很爱爸爸和家里人。
        - id: ch02-b19
          speaker: narrator
          text: 匹诺曹嘴里噼里啪啦，一口气撒出这么多谎。他伸手摸摸鼻子，发现鼻子已经长出去一巴掌还多，顿时吓坏了，赶紧大叫起来。
        - id: ch02-b20
          speaker: pinocchio
          text: 老伯，别信我刚才的话！我很了解匹诺曹。他是个坏透了的孩子，又懒又不听话。他不好好上学，只会跟伙伴们跑出去玩。
          emotion: fearful
        - id: ch02-b21
          speaker: narrator
          text: 他才说完，鼻子就缩了回去，恢复成原来的大小。
        - id: ch02-b22
          speaker: old_man
          text: 你身上怎么全是白的？
        - id: ch02-b23
          speaker: pinocchio
          text: 我一不留神，在一堵刚刷过白灰的墙上蹭了一下。
        - id: ch02-b24
          speaker: narrator
          text: 匹诺曹可不好意思承认，自己刚才像一条等着下锅的鱼，被人裹了一身面粉。
        - id: ch02-b25
          speaker: old_man
          text: 那你的外套、裤子和帽子呢？
        - id: ch02-b26
          speaker: pinocchio
          text: 我碰上了强盗，都被他们抢走了。好心的老伯，您能给我一件衣服，让我穿着回家吗？
        - id: ch02-b27
          speaker: old_man
          text: 孩子，我没有衣服，只有一个装豆子的小麻袋。你不嫌弃就拿去吧。
        - id: ch02-b28
          speaker: narrator
          text: 匹诺曹根本不用老人再说第二遍，立刻拿起麻袋，用剪刀在底下和两边各剪一个洞，像衬衫一样套在身上。就这样，他穿着这么一件单薄的衣服，动身朝村庄走去。
    - id: ch03
      title: 暴雨中的漫长等待
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 匹诺曹一路都觉得很不自在，心里怎么也安定不下来。他每往前走一步，几乎就要往后退一步，还一边走一边自言自语。
        - id: ch03-b02
          speaker: pinocchio
          text: 我还有什么脸去见善良的小仙女？她看见我会怎么说？我第二次偷偷跑掉，她还会原谅我吗？肯定不会！这也是我活该。我就是个无赖，总说要改，却从来不守信用！
          emotion: sad
        - id: ch03-b03
          speaker: narrator
          text: 他走到村庄时，已经是深夜了，四周漆黑一片。暴风雨来了，大雨倾盆而下。匹诺曹直奔仙女家，下定决心一定要去敲门。可真到了门口，他的勇气一下子全没了。不但没有敲门，反而转身逃出二十来步。
        - id: ch03-b04
          speaker: narrator
          text: 他第二次回到门前，握住门环，哆哆嗦嗦地轻轻敲了一下。等了又等，过了足足半个钟头，四层楼高的房子顶上才打开一扇窗。窗口探出一只大蜗牛，头顶还点着一支蜡烛。
        - id: ch03-b05
          speaker: snail
          text: 这么晚了，谁在外面？
        - id: ch03-b06
          speaker: pinocchio
          text: 仙女在家吗？
        - id: ch03-b07
          speaker: snail
          text: 仙女睡着了，不能吵醒她。可你是谁？
        - id: ch03-b08
          speaker: pinocchio
          text: 是我。
        - id: ch03-b09
          speaker: snail
          text: “我”是谁？
        - id: ch03-b10
          speaker: pinocchio
          text: 匹诺曹。
        - id: ch03-b11
          speaker: snail
          text: 匹诺曹又是谁？
        - id: ch03-b12
          speaker: pinocchio
          text: 就是住在仙女家里的那个木偶。
        - id: ch03-b13
          speaker: snail
          text: 啊，我明白了。你在那里等着，我马上下楼开门。
        - id: ch03-b14
          speaker: pinocchio
          text: 求求你快一点儿，我快冻死了！
          emotion: fearful
        - id: ch03-b15
          speaker: snail
          text: 孩子，我是一只蜗牛。蜗牛做事，从来不着急。
        - id: ch03-b16
          speaker: narrator
          text: 一个钟头过去了，两个钟头也过去了，门还是没开。匹诺曹浑身湿透，又冷又怕，抖个不停。最后，他鼓起勇气又敲了一次，这回敲得更响。楼下一扇窗打开了，还是那只蜗牛。
        - id: ch03-b17
          speaker: pinocchio
          text: 漂亮的小蜗牛，我已经等了两个钟头！这么糟糕的夜晚，两个钟头比两年还长。求求你快一点儿吧！
        - id: ch03-b18
          speaker: snail
          text: 孩子，我是一只蜗牛。蜗牛做事，从来不着急。
        - id: ch03-b19
          speaker: narrator
          text: 窗户又关上了。没多久，钟敲了十二下。接着一点钟过去，两点钟也过去，门依旧紧闭。匹诺曹终于失去了耐心。他怒气冲冲抓住门环，想狠狠敲一下，让整座房子都听见。
        - id: ch03-b20
          speaker: narrator
          text: 谁知那只铁门环忽然变成一条鳗鱼，从他手里滑脱出去，钻进街道中央不断奔流的雨水里，一下子不见了。
        - id: ch03-b21
          speaker: pinocchio
          text: 啊，原来你们要这样捉弄我！门环没了，我就使出全身力气用脚踢！
          emotion: angry
        - id: ch03-b22
          speaker: narrator
          text: 匹诺曹后退几步，一脚猛踹在大门上。这一脚太重，竟穿过木板，卡在门里。他拼命往外拔，可一点儿用也没有。那只脚就像被锤进木头的钉子，牢牢钉住了。
        - id: ch03-b23
          speaker: narrator
          text: 想想可怜的匹诺曹吧！余下的整整一夜，他只能一只脚踩在地上，另一只脚悬在半空。
    - id: ch04
      title: 蜗牛送来的早饭
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 第二天清晨，天才刚亮，门总算开了。聪明的小蜗牛从四楼走到大门口，只花了九个钟头。看得出来，为了走下这几层楼，她一定费了好大的劲儿。
        - id: ch04-b02
          speaker: snail
          text: 你的脚怎么卡在门里了？
        - id: ch04-b03
          speaker: pinocchio
          text: 这是个意外。漂亮的小蜗牛，求你想想办法，让我别再受这个罪了。
        - id: ch04-b04
          speaker: snail
          text: 孩子，这得让木匠来做，可我从来没当过木匠。
        - id: ch04-b05
          speaker: pinocchio
          text: 那你替我去求求仙女吧！
        - id: ch04-b06
          speaker: snail
          text: 仙女睡着了，不能吵醒她。
        - id: ch04-b07
          speaker: pinocchio
          text: 可我整天钉在门上，还能干什么呀？
        - id: ch04-b08
          speaker: snail
          text: 你可以数数街上走过的蚂蚁，给自己解解闷。
        - id: ch04-b09
          speaker: pinocchio
          text: 那至少拿点吃的给我吧，我一点儿力气都没有了。
        - id: ch04-b10
          speaker: snail
          text: 马上就来。
        - id: ch04-b11
          speaker: narrator
          text: 果然，三个半钟头以后，蜗牛回来了，头上顶着一只银托盘。盘里有一条面包、一只烤鸡，还有四个熟透的杏子。
        - id: ch04-b12
          speaker: snail
          text: 这是仙女送给你的早饭。
        - id: ch04-b13
          speaker: narrator
          text: 匹诺曹看见这些好吃的东西，立刻觉得安慰，精神也振作了不少。可他刚动口去吃，马上恶心得要命。原来面包是石膏做的，烤鸡是硬纸板做的，四个杏子则是涂过颜色的雪花石膏。
        - id: ch04-b14
          speaker: narrator
          text: 他真想放声大哭。绝望中，他要把托盘和里面的东西全扔掉。可也不知是太伤心，还是累到了极点，他反而昏了过去。
    - id: ch05
      title: 明天就会变成男孩
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 匹诺曹醒来时，发现自己躺在一张长沙发上，仙女就在旁边。
        - id: ch05-b02
          speaker: fairy
          text: 我再原谅你一次。可你要是第三次还不学好，那就有你好受的了！
        - id: ch05-b03
          speaker: narrator
          text: 匹诺曹又答应又发誓，说自己一定努力学习，从今以后永远规规矩矩。这一次，在这一年剩下的日子里，他真的信守了承诺，没有再食言。
        - id: ch05-b04
          speaker: narrator
          text: 假期前考试时，他还得了全校第一名。平日里的表现也一直让人十分满意，值得称赞。仙女看在眼里，高兴极了。
        - id: ch05-b05
          speaker: fairy
          text: 明天，你的愿望就要实现了。
          emotion: happy
        - id: ch05-b06
          speaker: pinocchio
          text: 什么愿望？
        - id: ch05-b07
          speaker: fairy
          text: 明天，你就不再是木头做的木偶了。你会变成一个真正的男孩。
          emotion: happy
        - id: ch05-b08
          speaker: narrator
          text: 没有亲眼见过的人，绝对想象不出匹诺曹有多欢喜。这件盼了那么久的好事，终于快要成真了。第二天，他所有的同学都会来到仙女家，参加一场丰盛的早餐，一同庆祝。
        - id: ch05-b09
          speaker: narrator
          text: 仙女准备了两百杯牛奶咖啡，还准备了四百个小面包。每个面包都从中间切开，两面抹好黄油。这一天眼看会无比快活，也会叫人高兴得不得了。可是……
        - id: ch05-b10
          speaker: narrator
          text: 说来也不幸，木偶的一生里总有一个“可是”，专门把一切好事搅黄。
