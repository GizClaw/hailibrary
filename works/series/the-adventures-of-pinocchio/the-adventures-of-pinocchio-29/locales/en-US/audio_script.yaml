audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm and story-rich
        timbre: clear and rounded
        pace: measured
        pitch: medium
    pinocchio:
      display_name: Pinocchio
      tts:
        delivery: impulsive and defiant
        timbre: bright and wooden
        pace: quick
        pitch: medium-high
    alidoro:
      display_name: Alidoro
      tts:
        delivery: earnest and forceful
        timbre: deep and canine
        pace: brisk
        pitch: medium-low
    fisherman:
      display_name: Green Fisherman
      tts:
        delivery: greedy and matter-of-fact
        timbre: coarse and rumbling
        pace: deliberate
        pitch: low
    old_man:
      display_name: Old Man
      tts:
        delivery: plainspoken and mildly curious
        timbre: dry and gentle
        pace: unhurried
        pitch: medium-low
    snail:
      display_name: Snail
      tts:
        delivery: patient and serenely literal
        timbre: soft and mellow
        pace: very slow
        pitch: medium
    fairy:
      display_name: Fairy
      tts:
        delivery: kind but firm
        timbre: luminous and clear
        pace: measured
        pitch: medium-high
  chapters:
    - id: ch01
      title: Alidoro Returns the Favor
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: The fisherman was just about to drop Pinocchio into the frying pan when a large dog came into the cave. The rich smell of fried fish had drawn him there.
        - id: ch01-b02
          speaker: fisherman
          text: Get out of here!
          emotion: angry
        - id: ch01-b03
          speaker: narrator
          text: The fisherman threatened the dog while holding the flour-covered puppet in one hand. But the poor animal was hungry as a wolf. He whined and wagged his tail again and again. It was as if he were saying that one bite of fish would satisfy him, and then he would leave the fisherman alone.
        - id: ch01-b04
          speaker: fisherman
          text: I said get out!
          emotion: angry
        - id: ch01-b05
          speaker: narrator
          text: He stretched out his leg to kick the dog. The dog might have tolerated a joke at another time, but not when he was truly hungry. He turned on the fisherman, growling and showing his terrible tusks. At that very moment, a faint little voice begged for help from somewhere inside the cave.
        - id: ch01-b06
          speaker: pinocchio
          text: Alidoro, save me! If you don't, he's going to fry me!
          emotion: fearful
        - id: ch01-b07
          speaker: narrator
          text: Alidoro knew Pinocchio's voice. To his amazement, it was coming from the floury bundle in the fisherman's hand. The dog sprang up, caught the bundle in his mouth, and held it gently between his teeth. Then he raced out of the cave and vanished like a flash of lightning.
        - id: ch01-b08
          speaker: narrator
          text: The fisherman was furious to see the fish he wanted for dinner snatched away. He chased the dog out of the cave, but he had gone only a few steps when a coughing fit seized him. He could run no farther and had to give up the chase.
        - id: ch01-b09
          speaker: narrator
          text: When Alidoro reached the path to the village, he stopped and carefully set his friend on the ground.
        - id: ch01-b10
          speaker: pinocchio
          text: I can't thank you enough!
        - id: ch01-b11
          speaker: alidoro
          text: You don't need to. You saved me, and now I've returned the favor. We all have to help one another in this world.
        - id: ch01-b12
          speaker: pinocchio
          text: But what brought you to that cave?
        - id: ch01-b13
          speaker: alidoro
          text: I was lying on the shore, more dead than alive. Then the wind carried the smell of fried fish to me. It made me hungry, so I followed it. If I'd arrived one second later...
        - id: ch01-b14
          speaker: pinocchio
          text: Don't say it!
          emotion: fearful
        - id: ch01-b15
          speaker: narrator
          text: Pinocchio was still shaking with fright.
        - id: ch01-b16
          speaker: pinocchio
          text: If you'd come one second later, I'd be fried, eaten, and digested by now. Brrr! Just thinking about it makes me shiver!
          emotion: fearful
        - id: ch01-b17
          speaker: narrator
          text: Alidoro laughed and held out his right paw. Pinocchio shook it warmly as a sign of their great friendship. Then they parted. Alidoro took the road home. Pinocchio, now alone, noticed a cottage nearby and went over to it.
    - id: ch02
      title: The Old Man and the Long Nose
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: An old man sat outside the cottage, warming himself in the sun. Pinocchio went up to him.
        - id: ch02-b02
          speaker: pinocchio
          text: Excuse me, sir. Have you heard anything about a poor boy named Eugene who was hurt in the head?
        - id: ch02-b03
          speaker: old_man
          text: Some fishermen brought the boy here, and now...
        - id: ch02-b04
          speaker: pinocchio
          text: Now he's dead!
          emotion: sad
        - id: ch02-b05
          speaker: old_man
          text: No, he's alive. He's already gone home.
        - id: ch02-b06
          speaker: pinocchio
          text: Really? Truly?
          emotion: surprised
        - id: ch02-b07
          speaker: narrator
          text: Pinocchio danced with joy.
        - id: ch02-b08
          speaker: pinocchio
          text: So the wound wasn't serious?
        - id: ch02-b09
          speaker: old_man
          text: It could have been very serious, even deadly. Someone threw a thick cardboard-bound book at his head.
        - id: ch02-b10
          speaker: pinocchio
          text: Who threw it?
        - id: ch02-b11
          speaker: old_man
          text: One of his schoolmates. A boy named Pinocchio.
        - id: ch02-b12
          speaker: pinocchio
          text: And who is this Pinocchio?
        - id: ch02-b13
          speaker: narrator
          text: The puppet asked the question as if the name meant nothing to him.
        - id: ch02-b14
          speaker: old_man
          text: People say he's a bad boy. A wandering, good-for-nothing rascal.
        - id: ch02-b15
          speaker: pinocchio
          text: That's slander! Every word of it!
          emotion: angry
        - id: ch02-b16
          speaker: old_man
          text: Do you know him?
        - id: ch02-b17
          speaker: pinocchio
          text: I've seen him around.
        - id: ch02-b18
          speaker: old_man
          text: Then what do you think of him?
        - id: ch02-b19
          speaker: pinocchio
          text: He seems like a very good boy. He wants to learn, does what he's told, and loves his father and his family.
        - id: ch02-b20
          speaker: narrator
          text: Pinocchio fired off one lie after another. Then he touched his nose and felt that it had grown more than a hand's length. The change frightened him badly, and he cried out to the old man.
        - id: ch02-b21
          speaker: pinocchio
          text: Don't believe what I just told you! I know Pinocchio very well. He's a bad boy. He's lazy and disobedient, and instead of going to school, he runs off to have fun with his friends.
          emotion: fearful
        - id: ch02-b22
          speaker: narrator
          text: He had barely finished telling the truth when his nose shortened and returned to its usual size.
        - id: ch02-b23
          speaker: old_man
          text: Why are you covered in white?
        - id: ch02-b24
          speaker: pinocchio
          text: I wasn't paying attention, and I rubbed against a wall that had just been whitewashed.
        - id: ch02-b25
          speaker: narrator
          text: He was ashamed to admit that he had been floured like a fish ready for the frying pan.
        - id: ch02-b26
          speaker: old_man
          text: And where are your jacket, pants, and cap?
        - id: ch02-b27
          speaker: pinocchio
          text: Robbers took them. Do you have any clothes I could wear home?
        - id: ch02-b28
          speaker: old_man
          text: I don't have any clothes for you. All I can offer is the little sack where I keep my beans. You can take it if you want.
        - id: ch02-b29
          speaker: narrator
          text: Pinocchio didn't wait for the old man to offer again. He took the bean sack at once. With a pair of scissors, he cut an opening in the bottom and another on each side, then pulled it over himself like a shirt. That flimsy sack was all he had to wear when he started toward the village.
    - id: ch03
      title: A Long Night in the Rain
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: As he walked, Pinocchio felt so uneasy that he could hardly make himself go on. He would take one step toward the village, then another step back. All the while, he talked to himself about what waited at the Fairy's house.
        - id: ch03-b02
          speaker: pinocchio
          text: How can I face my dear Fairy? What will she say when she sees me? Will she forgive me for running away again? No, I'm sure she won't, and I deserve it. I'm a rascal. I keep promising to change, but I never keep my word!
          emotion: sad
        - id: ch03-b03
          speaker: narrator
          text: By the time he reached the village, night had fallen, and the streets were very dark. A storm had blown in, and the rain came down in torrents. Pinocchio went straight to the Fairy's house. In spite of everything he feared, he had decided that he would knock at her door.
        - id: ch03-b04
          speaker: narrator
          text: But the moment he reached the door, all his courage disappeared. Instead of knocking, he ran about twenty paces away. Then he forced himself to return. Trembling, he reached for the knocker and tapped the door very softly.
        - id: ch03-b05
          speaker: narrator
          text: He waited and waited. Half an hour later, a window opened on the top floor of the four-story house. A large Snail looked out with a lighted candle on her head.
        - id: ch03-b06
          speaker: snail
          text: Who's there at this hour?
        - id: ch03-b07
          speaker: pinocchio
          text: Is the Fairy home?
        - id: ch03-b08
          speaker: snail
          text: She's asleep and mustn't be woken. But who are you?
        - id: ch03-b09
          speaker: pinocchio
          text: It's me.
        - id: ch03-b10
          speaker: snail
          text: Who is "me"?
        - id: ch03-b11
          speaker: pinocchio
          text: Pinocchio.
        - id: ch03-b12
          speaker: snail
          text: And who is Pinocchio?
        - id: ch03-b13
          speaker: pinocchio
          text: The puppet who lives in the Fairy's house.
        - id: ch03-b14
          speaker: snail
          text: Ah, now I understand. Wait there. I'll come down and open the door right away.
        - id: ch03-b15
          speaker: pinocchio
          text: Please hurry! I'm freezing to death!
          emotion: fearful
        - id: ch03-b16
          speaker: snail
          text: My boy, I'm a snail. Snails are never in a hurry.
          emotion: calm
        - id: ch03-b17
          speaker: narrator
          text: One hour passed, then another, but the door stayed shut. The rain had soaked Pinocchio through and through. He trembled from both cold and fear. At last, he gathered enough courage to try again and struck the door more loudly.
        - id: ch03-b18
          speaker: narrator
          text: A window on a lower floor opened. The same Snail appeared.
        - id: ch03-b19
          speaker: pinocchio
          text: Dear little Snail, I've been waiting two hours! On a night like this, two hours feel longer than two years. Please, please hurry!
        - id: ch03-b20
          speaker: snail
          text: My boy, I'm a snail. Snails are never in a hurry.
          emotion: calm
        - id: ch03-b21
          speaker: narrator
          text: The window closed again. Before long, the clock struck midnight. Then it struck one, then two, and still the door did not open.
        - id: ch03-b22
          speaker: narrator
          text: Pinocchio finally lost all patience. Blind with rage, he seized the knocker and meant to strike a blow that would ring through the whole house. But before he could do it, the iron knocker changed into an eel. It wriggled out of his hands, dropped into the stream of rainwater in the middle of the street, and disappeared.
        - id: ch03-b23
          speaker: pinocchio
          text: So that's how it is! If the knocker's gone, I'll kick the door with all my strength!
          emotion: angry
        - id: ch03-b24
          speaker: narrator
          text: He stepped back and kicked the door with tremendous force. His foot broke through the wood and stuck there. He pulled and pulled, but it was useless. His foot held fast like a hammered nail.
        - id: ch03-b25
          speaker: narrator
          text: Poor Pinocchio had to spend the rest of the night with one foot on the ground and the other in the air.
    - id: ch04
      title: The Fairy's Breakfast
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: At daybreak, the door finally opened. The clever little Snail had taken only nine hours to travel from the fourth floor to the front door. Clearly, she had made a tremendous effort to get there so quickly.
        - id: ch04-b02
          speaker: snail
          text: Why is your foot stuck in the door?
        - id: ch04-b03
          speaker: pinocchio
          text: It was an accident. Please, dear little Snail, get me out of this awful position.
        - id: ch04-b04
          speaker: snail
          text: My boy, that's a carpenter's job, and I've never been a carpenter.
        - id: ch04-b05
          speaker: pinocchio
          text: Then ask the Fairy to help me!
        - id: ch04-b06
          speaker: snail
          text: The Fairy is asleep and mustn't be woken.
        - id: ch04-b07
          speaker: pinocchio
          text: What am I supposed to do, nailed to this door all day?
        - id: ch04-b08
          speaker: snail
          text: Count the ants going down the street. That will keep you busy.
        - id: ch04-b09
          speaker: pinocchio
          text: At least bring me something to eat. I'm completely worn out.
        - id: ch04-b10
          speaker: snail
          text: Right away.
        - id: ch04-b11
          speaker: narrator
          text: Three and a half hours later, the Snail came back with a silver tray balanced on her head. It held a loaf of bread, a roast chicken, and four ripe apricots.
        - id: ch04-b12
          speaker: snail
          text: Here's the breakfast the Fairy sent you.
        - id: ch04-b13
          speaker: narrator
          text: The sight of all that food cheered Pinocchio at once. He thought that at long last he could satisfy his terrible hunger. But the moment he tried to eat, he made a horrible discovery. The bread was plaster. The chicken was cardboard. The four apricots were painted alabaster.
        - id: ch04-b14
          speaker: narrator
          text: Pinocchio wanted to cry. Desperate and disappointed, he tried to throw away the tray and everything on it. But he had no strength left. Whether grief or exhaustion overcame him, he fainted before he could do it.
    - id: ch05
      title: Tomorrow You Shall Be a Boy
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: When Pinocchio opened his eyes, he was lying on a sofa. The Fairy stood beside him.
        - id: ch05-b02
          speaker: fairy
          text: I'll forgive you one more time. But if you behave badly a third time, beware!
        - id: ch05-b03
          speaker: narrator
          text: Pinocchio promised and swore that he would study and behave well from then on.
        - id: ch05-b04
          speaker: narrator
          text: For the rest of the year, he kept his word. When the examinations came before the holidays, he took first place in the school. His conduct was so good that the Fairy was delighted with him.
        - id: ch05-b05
          speaker: fairy
          text: Tomorrow, you'll finally get your wish.
          emotion: happy
        - id: ch05-b06
          speaker: pinocchio
          text: What wish?
        - id: ch05-b07
          speaker: fairy
          text: Tomorrow you'll stop being a wooden puppet. You'll become a boy.
        - id: ch05-b08
          speaker: narrator
          text: No one who wasn't there could imagine Pinocchio's joy. This was the wonderful change he had wished for and waited for so long. All his schoolmates would be invited to a grand breakfast at the Fairy's house the next day so they could celebrate together. The Fairy had prepared two hundred cups of coffee and milk, along with four hundred rolls, cut open and buttered on both sides.
        - id: ch05-b09
          speaker: narrator
          text: It promised to be the happiest, most wonderful day. But...
        - id: ch05-b10
          speaker: narrator
          text: Unfortunately, in the life of a puppet, there is always a "but" that spoils everything.
