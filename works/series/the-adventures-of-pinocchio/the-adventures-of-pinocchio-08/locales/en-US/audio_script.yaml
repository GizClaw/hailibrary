audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm and story-rich
        timbre: clear and rounded
        pace: measured
        pitch: medium
    pinocchio:
      display_name: Pinocchio
      tts:
        delivery: impulsive and defiant
        timbre: bright and wooden
        pace: quick
        pitch: medium-high
    geppetto:
      display_name: Geppetto
      tts:
        delivery: plainspoken and caring
        timbre: warm and weathered
        pace: unhurried
        pitch: low
  chapters:
    - id: ch01
      title: Geppetto Makes Pinocchio New Feet
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: As soon as Pinocchio had eaten enough, he began to cry and complain. Now he wanted a new pair of feet.
        - id: ch01-b02
          speaker: narrator
          text: Geppetto meant to punish him for being so naughty. He let the puppet cry, grumble, and despair for half the day before he finally spoke.
        - id: ch01-b03
          speaker: geppetto
          text: Why should I give you new feet? So you can run away from home again?
        - id: ch01-b04
          speaker: pinocchio
          text: I promise I'll be good from now on, Papa.
          emotion: sad
        - id: ch01-b05
          speaker: narrator
          text: Pinocchio was still sobbing, but Geppetto was not convinced.
        - id: ch01-b06
          speaker: geppetto
          text: Every boy says that when he wants something badly enough.
        - id: ch01-b07
          speaker: pinocchio
          text: I promise I'll go to school. I'll study hard and bring home a good report.
        - id: ch01-b08
          speaker: geppetto
          text: That's the same old promise every boy makes when he wants his way.
        - id: ch01-b09
          speaker: pinocchio
          text: But I'm not like the other boys! I'm better than all of them, and I always tell the truth. Papa, I promise I'll learn a trade. When you're old, I'll be your comfort and your support.
        - id: ch01-b10
          speaker: narrator
          text: Tears filled Geppetto's eyes. His heart ached when he saw poor Pinocchio in such a miserable state. Without another word, he picked up his tools and two small pieces of well-seasoned wood. Then he went carefully to work.
        - id: ch01-b11
          speaker: narrator
          text: Before an hour had passed, the feet were done. They were two quick, sturdy little feet, full of life. They looked as if a great artist had shaped them.
        - id: ch01-b12
          speaker: geppetto
          text: Close your eyes and go to sleep.
        - id: ch01-b13
          speaker: narrator
          text: Pinocchio shut his eyes and pretended to sleep. While he lay there, Geppetto melted a little glue in an eggshell and fixed the feet in place. He did the job so neatly that there was no sign of where the new feet joined the puppet's legs.
        - id: ch01-b14
          speaker: narrator
          text: The moment Pinocchio realized he had feet again, he jumped down from the table where he had been lying. Then he began to leap, spring, and cut capers all around the room. He seemed almost mad with the size of his delight.
        - id: ch01-b15
          speaker: pinocchio
          text: To repay you for everything you've done, Papa, I'm going to school right away.
        - id: ch01-b16
          speaker: geppetto
          text: That's my good boy.
        - id: ch01-b17
          speaker: pinocchio
          text: But if I'm going to school, I'll need some clothes.
        - id: ch01-b18
          speaker: narrator
          text: Geppetto was so poor that he did not have a single penny in his pocket. Still, he made Pinocchio a little suit from flowered paper. He made shoes from tree bark and a cap from the crumb of bread.
        - id: ch01-b19
          speaker: narrator
          text: Pinocchio hurried over to a bowl of water to see his reflection. He liked his new look so much that he strutted around the room like a peacock.
        - id: ch01-b20
          speaker: pinocchio
          text: Why, I look just like a gentleman!
          emotion: happy
        - id: ch01-b21
          speaker: geppetto
          text: You certainly do. But remember, fine clothes don't make a gentleman. Clean clothes do.
        - id: ch01-b22
          speaker: pinocchio
          text: Oh, I almost forgot. I'm still missing the best and most important thing I need for school.
        - id: ch01-b23
          speaker: geppetto
          text: What's that?
        - id: ch01-b24
          speaker: pinocchio
          text: I don't have a spelling book.
        - id: ch01-b25
          speaker: geppetto
          text: You're right. But how are we going to get one?
        - id: ch01-b26
          speaker: pinocchio
          text: That's easy. We just go to the bookseller and buy it.
        - id: ch01-b27
          speaker: geppetto
          text: And where will the money come from?
        - id: ch01-b28
          speaker: pinocchio
          text: I don't have any.
        - id: ch01-b29
          speaker: geppetto
          text: Neither do I.
          emotion: sad
        - id: ch01-b30
          speaker: narrator
          text: The good old man spoke very sadly. Pinocchio was usually a cheerful boy, but now he grew sad too. Anyone can understand real poverty, even a boy.
        - id: ch01-b31
          speaker: geppetto
          text: Well, we'll just have to manage somehow!
        - id: ch01-b32
          speaker: narrator
          text: Geppetto jumped to his feet and put on his old corduroy coat. It was covered with patches and careful mending. Then he hurried out of the house.
        - id: ch01-b33
          speaker: narrator
          text: He soon came back with a spelling book for Pinocchio. But his old coat was gone. The poor man stood there in his shirtsleeves, though snow was falling outside.
        - id: ch01-b34
          speaker: pinocchio
          text: Papa, where's your coat?
        - id: ch01-b35
          speaker: geppetto
          text: I sold it.
        - id: ch01-b36
          speaker: pinocchio
          text: Why did you sell it?
        - id: ch01-b37
          speaker: geppetto
          text: It was much too warm for me.
        - id: ch01-b38
          speaker: narrator
          text: Pinocchio understood at once. His good heart would not let him hold back. He sprang up, wrapped his arms around Geppetto's neck, and kissed him again and again.
