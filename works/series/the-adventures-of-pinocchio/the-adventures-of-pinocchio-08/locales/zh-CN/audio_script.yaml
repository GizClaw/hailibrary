audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖从容，带一点一本正经的幽默
        timbre: 清晰醇厚
        pace: 舒缓，遇到惊奇处略微加快
        pitch: 中
    pinocchio:
      display_name: 匹诺曹
      tts:
        delivery: 任性直率，嘴硬而孩子气，发怒时冲动急躁
        timbre: 清亮，带木偶般的脆响
        pace: 偏快，争辩时更急
        pitch: 中高
    geppetto:
      display_name: 杰佩托
      tts:
        delivery: 活泼直率，发怒时火爆而有喜剧感
        timbre: 苍老而响亮
        pace: 中等，争吵时急促
        pitch: 中高
  chapters:
    - id: ch01
      title: 一双新脚
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 木偶才填饱肚子，又哭又抱怨，非要一双新脚不可。杰佩托偏要罚他不听话，任他哭闹，几乎绝望了大半天，才终于开口。
        - id: ch01-b02
          speaker: geppetto
          text: 我干吗还给你做脚？好让你再逃出家门吗？
        - id: ch01-b03
          speaker: pinocchio
          text: 我保证，以后一定做个好孩子。
          emotion: sad
        - id: ch01-b04
          speaker: geppetto
          text: 孩子想要什么东西时，个个都会这么说。
        - id: ch01-b05
          speaker: pinocchio
          text: 我会去上学，好好念书，还会带着优良的成绩回家。
        - id: ch01-b06
          speaker: geppetto
          text: 孩子一心想拿到什么，讲来讲去总是这一套。
        - id: ch01-b07
          speaker: pinocchio
          text: 可我不是别的孩子！我比他们都好，从来不说假话。爸爸，我保证学一门手艺。等您老了，我会让您安心，也会做您的依靠。
        - id: ch01-b08
          speaker: narrator
          text: 杰佩托看着自己的可怜孩子，见匹诺曹落到这般凄惨的境地，眼里慢慢盈满泪水，心里也十分难受。他一句话都没再说，拿起工具，又找来两小块干透的木头，认认真真地忙活起来。
        - id: ch01-b09
          speaker: narrator
          text: 不到一个钟头，两只小脚就做好了。它们小巧、轻快、结实而有力，仿佛是由一位天才艺术家亲手塑造出来的。
        - id: ch01-b10
          speaker: geppetto
          text: 把眼睛闭上，睡觉吧！
        - id: ch01-b11
          speaker: narrator
          text: 匹诺曹闭起眼睛，装出已经睡着的模样。他还在那里装睡时，杰佩托把一点胶放在蛋壳里熬化，再将两只脚接回原处。接得可真漂亮，连一丝接缝都找不到。
    - id: ch02
      title: 纸衣服和面包帽
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 匹诺曹一发现自己又有脚了，立刻从刚才躺着的桌上跳下来。他在屋里蹦啊，翻啊，一口气做出一千个怪样子，高兴得简直像发了疯。
        - id: ch02-b02
          speaker: pinocchio
          text: 您为我做了这么多，我要报答您。我现在就去上学！
          emotion: happy
        - id: ch02-b03
          speaker: geppetto
          text: 这才是好孩子。
        - id: ch02-b04
          speaker: pinocchio
          text: 不过要去上学，我得有衣服穿呀。
        - id: ch02-b05
          speaker: narrator
          text: 杰佩托实在太穷，口袋里连一个子儿也没有。他只好拿印花纸做了件小衣裳，拿树皮做了双鞋，再用面包瓤做了顶帽子。
        - id: ch02-b06
          speaker: narrator
          text: 匹诺曹马上跑到一只盛水的瓦罐前，对着水面照自己。他越看越满意，学着孔雀的样子昂着头走来走去。
        - id: ch02-b07
          speaker: pinocchio
          text: 瞧我这模样，活像一位体面的绅士！
          emotion: happy
        - id: ch02-b08
          speaker: geppetto
          text: 可不是嘛。不过你得记住，使人成为绅士的不是华丽衣裳，而是干干净净的衣裳。
    - id: ch03
      title: 最要紧的东西
      blocks:
        - id: ch03-b01
          speaker: pinocchio
          text: 对了，要上学，我还少一样东西。偏偏少的是最好、也最要紧的那样东西。
        - id: ch03-b02
          speaker: geppetto
          text: 你少什么？
        - id: ch03-b03
          speaker: pinocchio
          text: 我没有识字课本。
        - id: ch03-b04
          speaker: geppetto
          text: 你说得没错。可我们上哪儿弄一本呢？
        - id: ch03-b05
          speaker: pinocchio
          text: 很容易呀，到书店买一本就行。
        - id: ch03-b06
          speaker: geppetto
          text: 可钱从哪儿来？
        - id: ch03-b07
          speaker: pinocchio
          text: 我没钱。
        - id: ch03-b08
          speaker: geppetto
          text: 我也没有钱。
          emotion: sad
        - id: ch03-b09
          speaker: narrator
          text: 善良的老人说得十分伤心。匹诺曹本来是个极快活的孩子，这时也难过起来。因为真正的贫穷是什么滋味，人人都懂，连孩子也不例外。
    - id: ch04
      title: 雪地里的外套
      blocks:
        - id: ch04-b01
          speaker: geppetto
          text: 好吧，你耐心等着！
        - id: ch04-b02
          speaker: narrator
          text: 杰佩托忽然站起来，披上那件补丁摞补丁的旧灯芯绒外套，飞快地跑出门去。没过多久，他就回来了，手里拿着一本给匹诺曹的识字课本，那件旧外套却没了。
        - id: ch04-b03
          speaker: narrator
          text: 可怜的老人只穿着衬衫，屋外这时还正下着雪。
        - id: ch04-b04
          speaker: pinocchio
          text: 爸爸，您的外套去哪儿了？
        - id: ch04-b05
          speaker: geppetto
          text: 我把它卖了。
        - id: ch04-b06
          speaker: pinocchio
          text: 您为什么要卖掉它？
        - id: ch04-b07
          speaker: geppetto
          text: 因为我穿着觉得太热。
        - id: ch04-b08
          speaker: narrator
          text: 匹诺曹立刻听懂了这句回答。他那颗善良的心再也按捺不住，纵身扑过去，双臂紧紧搂住杰佩托的脖子，一遍又一遍地亲吻他。
