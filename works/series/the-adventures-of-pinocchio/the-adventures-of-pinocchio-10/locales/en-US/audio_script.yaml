      display_name: Miss Rose
      tts:
        delivery: bright and animated
        timbre: light and ringing
        pace: quick
        pitch: high
    puppet_actor:
      display_name: Puppet Actor
      tts:
        delivery: jubilant and theatrical
        timbre: crisp and youthful
        pace: lively
        pitch: medium-high
