audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖从容，带一点一本正经的幽默
        timbre: 清晰醇厚
        pace: 舒缓，遇到惊奇处略微加快
        pitch: 中
    pinocchio:
      display_name: 匹诺曹
      tts:
        delivery: 任性直率，嘴硬而孩子气，发怒时冲动急躁
        timbre: 清亮，带木偶般的脆响
        pace: 偏快，争辩时更急
        pitch: 中高
    harlequin:
      display_name: 哈尔勒昆
      tts:
        delivery: 热情夸张，带着舞台演员的抑扬顿挫
        timbre: 明亮灵活
        pace: 偏快
        pitch: 中高
    punch:
      display_name: 潘趣
      tts:
        delivery: 爽直响亮，情绪来得快
        timbre: 结实洪亮
        pace: 中等偏快
        pitch: 中
    miss_rose:
      display_name: 罗丝小姐
      tts:
        delivery: 活泼热切，惊喜时声音高扬
        timbre: 清脆明亮
        pace: 偏快
        pitch: 高
    puppet_1:
      display_name: 木偶甲
      tts:
        delivery: 欢腾热烈，招呼人时格外亲切
        timbre: 清亮轻快
        pace: 偏快
        pitch: 高
    puppet_2:
      display_name: 木偶乙
      tts:
        delivery: 爽朗兴奋，欢呼时干脆有力
        timbre: 明亮结实
        pace: 快
        pitch: 中
    puppet_3:
      display_name: 木偶丙
      tts:
        delivery: 热情活泼，语气亲昵而富有舞台感
        timbre: 柔和灵动
        pace: 中等偏快
        pitch: 中高
    audience_1:
      display_name: 观众甲
      tts:
        delivery: 不耐烦，催促时直截了当
        timbre: 粗亮有力
        pace: 中等偏快
        pitch: 中
    audience_2:
      display_name: 观众乙
      tts:
        delivery: 急躁强硬，喊话时短促响亮
        timbre: 尖亮紧绷
        pace: 快
        pitch: 中高
    audience_3:
      display_name: 观众丙
      tts:
        delivery: 恼火急切，催促时重音鲜明
        timbre: 低厚洪亮
        pace: 中等
        pitch: 低
    showman:
      display_name: 班主
      tts:
        delivery: 凶狠威严，话音粗重而压迫感十足
        timbre: 沙哑低沉，带浓重鼻音
        pace: 缓慢有力
        pitch: 低
  chapters:
    - id: ch01
      title: 木头兄弟重逢
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 匹诺曹刚走进小小的木偶剧院，一件几乎要引起革命的大事就发生了。幕布早已升起，台上的戏正在演。哈尔勒昆和潘趣照例吵得不可开交，眼看就要打起来。
        - id: ch01-b02
          speaker: narrator
          text: 哈尔勒昆突然停住，转向观众。他伸手指着池座后面，拿出十足的戏腔喊了起来。
        - id: ch01-b03
          speaker: harlequin
          text: 天上的诸神啊！我这是在做梦，还是醒着？那边的人分明就是匹诺曹！
          emotion: surprised
        - id: ch01-b04
          speaker: punch
          text: 没错，真是匹诺曹！
          emotion: surprised
        - id: ch01-b05
          speaker: narrator
          text: 罗丝小姐也从后台探出了头。
        - id: ch01-b06
          speaker: miss_rose
          text: 是他，就是他！
          emotion: surprised
        - id: ch01-b07
          speaker: narrator
          text: 木偶们从四面八方跳上舞台，一齐欢呼。
        - id: ch01-b08
          speakers: [puppet_1, puppet_2, puppet_3]
          ensemble: chorus
          text: 匹诺曹来了！我们的兄弟匹诺曹来了！匹诺曹万岁！
          emotion: happy
        - id: ch01-b09
          speaker: harlequin
          text: 匹诺曹，快上来！让我们这些木头兄弟好好抱抱你！
          emotion: happy
        - id: ch01-b10
          speaker: narrator
          text: 匹诺曹听见这番亲热的招呼，立刻从池座尽头一跃而起，先跳进前排雅座，又落到乐队指挥的头顶，最后再纵身一蹦，这才上了舞台。
        - id: ch01-b11
          speaker: narrator
          text: 剧团里的男女木偶全激动极了。他们围住匹诺曹，又是拥抱，又是亲热地捏他，用数不清的方式表达兄弟般的情谊。那份热情，实在没法形容。
        - id: ch01-b12
          speaker: narrator
          text: 这一幕当然很动人，可池座里的观众见戏停了，渐渐等得不耐烦，纷纷扯开嗓子催促。
        - id: ch01-b13
          speakers: [audience_1, audience_2, audience_3]
          ensemble: chorus
          text: 我们要看戏！快接着演！
          emotion: angry
        - id: ch01-b14
          speaker: narrator
          text: 观众算是白费了嗓子。木偶们不但没有接着演戏，反倒喊得更响，闹得更凶。他们把匹诺曹扛在肩上，像迎接英雄一样，把他抬到了台口灯前。
    - id: ch02
      title: 可怕的班主
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 就在这时，班主走了出来。他又高又大，也丑得吓人。那把黑墨似的胡子从下巴拖到地上。要说它有多长，只要看班主走路时会踩住自己的胡子就知道了。他的嘴像一座烤炉，双眼像两盏点着火的红玻璃灯笼。手里那根大鞭子用蛇和狐狸尾巴绞成，不住地甩出啪啪声。
        - id: ch02-b02
          speaker: narrator
          text: 班主来得太突然，剧院里一下子静透了。没人敢喘气，连苍蝇飞过的声音都能听见。可怜的男女木偶个个抖得像树叶。
        - id: ch02-b03
          speaker: narrator
          text: 班主用粗哑的嗓子质问匹诺曹。那声音听着就像一个患了重伤风、鼻子堵死的妖怪。
        - id: ch02-b04
          speaker: showman
          text: 你跑进我的剧院，为什么要在这里捣乱？
          emotion: angry
        - id: ch02-b05
          speaker: pinocchio
          text: 尊敬的先生，请您相信我，这件事真的不能怪我！
          emotion: fearful
        - id: ch02-b06
          speaker: showman
          text: 不用再说了！等到今晚，我再跟你算账。
          emotion: angry
    - id: ch03
      title: 厨房里的险境
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 戏散以后，班主走进厨房。一只肥羊在火前的烤叉上慢慢转着，那是他的晚饭。可木柴已经不够了，羊还没烤熟，也没烤出焦黄的颜色。于是，他把哈尔勒昆和潘趣叫到面前。
        - id: ch03-b02
          speaker: showman
          text: 去把那个木偶带来，他正挂在钉子上。我看他的木头干得很，扔进火里准能烧得旺旺的，正好把羊烤熟。
        - id: ch03-b03
          speaker: narrator
          text: 哈尔勒昆和潘趣起初有些迟疑。班主狠狠瞪了他们一眼，两人吓坏了，只能照办。没过多久，他们便抬着可怜的匹诺曹回到厨房。
        - id: ch03-b04
          speaker: narrator
          text: 匹诺曹像刚离开水的鳗鱼一样拼命扭动，绝望地尖叫起来。
        - id: ch03-b05
          speaker: pinocchio
          text: 爸爸！爸爸！快来救我！我不想死，我不想死！
          emotion: fearful
