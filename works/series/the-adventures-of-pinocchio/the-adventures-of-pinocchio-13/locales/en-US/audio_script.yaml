audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm and story-rich
        timbre: clear and rounded
        pace: measured
        pitch: medium
    pinocchio:
      display_name: Pinocchio
      tts:
        delivery: impulsive and defiant
        timbre: bright and wooden
        pace: quick
        pitch: medium-high
    fox:
      display_name: The Fox
      tts:
        delivery: smooth and calculating
        timbre: lean and sly
        pace: measured
        pitch: medium
    cat:
      display_name: The Cat
      tts:
        delivery: dry and imitative
        timbre: soft and raspy
        pace: clipped
        pitch: medium-high
    innkeeper:
      display_name: The Innkeeper
      tts:
        delivery: polite and knowing
        timbre: full and earthy
        pace: steady
        pitch: medium-low
    talking_cricket:
      display_name: The Talking Cricket's Ghost
      tts:
        delivery: gentle and cautionary
        timbre: faint and airy
        pace: slow
        pitch: high
  chapters:
    - id: ch01
      title: Supper at the Red Craw-Fish
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: They walked on and on. Toward evening, all three were completely worn out when at last they reached the inn of the Red Craw-Fish.
        - id: ch01-b02
          speaker: fox
          text: Let's stop here for a while. We can eat and rest for an hour or two. Then we'll leave again at midnight and reach the Field of Miracles by dawn.
        - id: ch01-b03
          speaker: narrator
          text: They went inside and sat down together, though none of them claimed to have much appetite. The Cat was suffering from indigestion and felt seriously ill. All she could manage was thirty-five fish in tomato sauce and four servings of tripe with Parmesan cheese. The tripe seemed underseasoned to her, so three times she called for more butter and grated cheese.
        - id: ch01-b04
          speaker: narrator
          text: The Fox would gladly have nibbled a little too, but his doctor had ordered a strict diet. He had to make do with a hare in sweet-and-sour sauce, lightly surrounded by fat chickens and young hens. After the hare, he ordered a mixed dish of partridges, rabbits, frogs, lizards, and other treats. Then he could eat no more. As he explained, he cared so little about food that he simply couldn't put another thing to his lips.
        - id: ch01-b05
          speaker: narrator
          text: Pinocchio ate least of all. He ordered some walnuts and a hunk of bread, but he did not touch either one. He left everything on his plate. All through supper, the poor boy's thoughts stayed fixed on the Field of Miracles.
    - id: ch02
      title: A Dream of Gold
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: When supper was over, the Fox spoke to the innkeeper.
        - id: ch02-b02
          speaker: fox
          text: Please give us two good rooms. One is for Mr. Pinocchio, and the other is for my companion and me. We'll get a little sleep before we go. Be sure to wake us at midnight so we can continue our journey.
        - id: ch02-b03
          speaker: innkeeper
          text: Yes, gentlemen.
        - id: ch02-b04
          speaker: narrator
          text: The innkeeper winked at the Fox and the Cat. His look plainly said, "I know what you're up to." The two animals understood him perfectly.
        - id: ch02-b05
          speaker: narrator
          text: The moment Pinocchio climbed into bed, he fell asleep. Soon he dreamed he was standing in the middle of a field. All around him, shrubs were covered in clusters of gold coins. They swung in the wind, ringing, "Zin, zin, zin," as if they were saying, "Anyone who wants us can come and take us."
        - id: ch02-b06
          speaker: narrator
          text: Pinocchio stretched out his hand. He was about to gather up great handfuls of those beautiful gold coins and put them in his pocket when three hard knocks struck his door and woke him.
        - id: ch02-b07
          speaker: narrator
          text: The innkeeper had come to tell him it was midnight.
        - id: ch02-b08
          speaker: pinocchio
          text: Are my friends ready?
        - id: ch02-b09
          speaker: innkeeper
          text: Ready? They left two hours ago.
        - id: ch02-b10
          speaker: pinocchio
          text: Why did they rush off like that?
        - id: ch02-b11
          speaker: innkeeper
          text: The Cat got a message. Her oldest kitten has chilblains on his feet, and they say he may die.
        - id: ch02-b12
          speaker: pinocchio
          text: Did they pay for supper?
        - id: ch02-b13
          speaker: innkeeper
          text: Of course not! They are far too well mannered to insult a gentleman like you by offering to pay.
        - id: ch02-b14
          speaker: pinocchio
          text: What a shame. That's one insult I would've been delighted to receive!
        - id: ch02-b15
          speaker: narrator
          text: Pinocchio scratched his head, then asked one more question.
        - id: ch02-b16
          speaker: pinocchio
          text: Where did my good friends say they'd meet me?
        - id: ch02-b17
          speaker: innkeeper
          text: At the Field of Miracles, tomorrow at daybreak.
        - id: ch02-b18
          speaker: narrator
          text: Pinocchio paid one gold piece for his own supper and theirs. Then he left the inn.
    - id: ch03
      title: Alone in the Dark
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: Outside, the night was pitch-black. Pinocchio could not see even a hand's breadth in front of him, so he had to feel his way along the road.
        - id: ch03-b02
          speaker: narrator
          text: Night birds flew across the road from one hedge to the other. They passed so close that their wings brushed Pinocchio's nose. He was terrified. He sprang backward and cried out.
        - id: ch03-b03
          speaker: pinocchio
          text: Who's there?
          emotion: fearful
        - id: ch03-b04
          speaker: narrator
          text: From the hills around him, the echo answered far away, "Who's there? Who's there?"
        - id: ch03-b05
          speaker: narrator
          text: As Pinocchio went on, he noticed a tiny insect glowing faintly on a tree trunk. It looked like a night-light inside a lamp of clear china.
        - id: ch03-b06
          speaker: pinocchio
          text: Who are you?
        - id: ch03-b07
          speaker: talking_cricket
          text: I am the ghost of the Talking Cricket.
        - id: ch03-b08
          speaker: narrator
          text: The insect's voice was so low and faint that it seemed to come from another world.
        - id: ch03-b09
          speaker: pinocchio
          text: What do you want from me?
    - id: ch04
      title: The Cricket's Warning
      blocks:
        - id: ch04-b01
          speaker: talking_cricket
          text: I want to give you some advice. Turn back and take your four remaining gold pieces to your poor father. He is crying and has lost hope because you haven't come home.
        - id: ch04-b02
          speaker: pinocchio
          text: By tomorrow, Papa will be a gentleman. These four gold pieces will have turned into two thousand!
        - id: ch04-b03
          speaker: talking_cricket
          text: Don't believe people who promise to make you rich in a single day. They are usually either fools or crooks. Listen to me, my boy. Go back.
        - id: ch04-b04
          speaker: pinocchio
          text: No. I've made up my mind to keep going.
        - id: ch04-b05
          speaker: talking_cricket
          text: It's late.
        - id: ch04-b06
          speaker: pinocchio
          text: I'm going on.
        - id: ch04-b07
          speaker: talking_cricket
          text: The night is dark.
        - id: ch04-b08
          speaker: pinocchio
          text: I'm going on.
        - id: ch04-b09
          speaker: talking_cricket
          text: The road is dangerous.
        - id: ch04-b10
          speaker: pinocchio
          text: I'm going on.
        - id: ch04-b11
          speaker: talking_cricket
          text: Remember this. Boys who insist on chasing every whim and always getting their own way will regret it sooner or later.
        - id: ch04-b12
          speaker: pinocchio
          text: It's always the same old lecture. Good night, Cricket.
        - id: ch04-b13
          speaker: talking_cricket
          text: Good night, Pinocchio. May Heaven protect you from danger and from assassins.
        - id: ch04-b14
          speaker: narrator
          text: As soon as the Talking Cricket finished speaking, he vanished like a light blown out. The road was darker than ever.
