audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖从容，带一点一本正经的幽默
        timbre: 清晰醇厚
        pace: 舒缓，遇到惊奇处略微加快
        pitch: 中
    pinocchio:
      display_name: 匹诺曹
      tts:
        delivery: 任性直率，嘴硬而孩子气，发怒时冲动急躁
        timbre: 清亮，带木偶般的脆响
        pace: 偏快，争辩时更急
        pitch: 中高
    fox:
      display_name: 狐狸
      tts:
        delivery: 客气圆滑，劝诱时显得格外诚恳
        timbre: 细长而略带沙哑
        pace: 从容，编造谎话时流畅笃定
        pitch: 中
    cat:
      display_name: 猫
      tts:
        delivery: 冷淡狡猾，惯于附和狐狸的话
        timbre: 轻细干涩
        pace: 缓慢，重复时短促有力
        pitch: 中高
    innkeeper:
      display_name: 店主
      tts:
        delivery: 表面殷勤，暗地里精明世故
        timbre: 圆润略显油滑
        pace: 不紧不慢
        pitch: 中低
    talking_cricket:
      display_name: 会说话的蟋蟀
      tts:
        delivery: 耐心清醒，劝诫时严肃却不盛气凌人
        timbre: 细而清晰，带一点年长者的沉稳
        pace: 从容
        pitch: 高
  chapters:
    - id: ch01
      title: 没有胃口的晚餐
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 他们走啊走啊，一直走到傍晚，才拖着筋疲力尽的身子来到红螯虾客栈。
        - id: ch01-b02
          speaker: fox
          text: 咱们就在这里歇歇吧。吃点东西，再睡上一两个钟头。半夜重新出发，明天拂晓正好赶到奇迹田。
        - id: ch01-b03
          speaker: narrator
          text: 三个伙伴进了客栈，一起坐到桌边，却谁也没有胃口。猫正闹消化不良，身子很不舒服，只吃了三十五条浇番茄酱的鱼，还有四份撒帕尔马干酪的牛肚。她还嫌牛肚味道太淡，一连三次叫人送来黄油和干酪碎。
        - id: ch01-b04
          speaker: narrator
          text: 狐狸倒想随便吃上几口，可医生叫他严格节食，他只好拿一只酸甜酱汁烹制的野兔将就一下，旁边不过配了几只肥鸡和刚长成的小母鸡。吃完以后，他又要了一道杂烩，里面有山鹑、家兔、青蛙、蜥蜴和别的美味。别的东西，他可再也碰不得了。照他的说法，他对吃饭毫无兴趣，简直一口也咽不下去。
        - id: ch01-b05
          speaker: narrator
          text: 匹诺曹吃得最少。他只要了几颗核桃和一小块面包，端来的东西全剩在盘子里。这个可怜的孩子，心早就飞到奇迹田去了。
        - id: ch01-b06
          speaker: narrator
          text: 晚饭吃完，狐狸转身吩咐店主。
        - id: ch01-b07
          speaker: fox
          text: 请给我们两间好房。一间让匹诺曹先生住，另一间给我和我的伙伴。我们动身以前想抓紧睡一会儿。您可别忘了，半夜一定要叫醒我们，我们还得继续赶路。
        - id: ch01-b08
          speaker: innkeeper
          text: 好的，几位先生。
        - id: ch01-b09
          speaker: narrator
          text: 店主回答着，还朝狐狸和猫挤了挤眼。那眼神明明在说，你们打的什么算盘，我全知道。咱们彼此心照不宣。
    - id: ch02
      title: 午夜的敲门声
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 匹诺曹刚钻进被窝，立刻就睡着了。他梦见自己站在田野中央，身边长满了灌木，每一丛都结着成串的金币。风一吹，金币摇来摆去，叮、叮、叮地响，像在招呼他，谁想要就来拿吧。匹诺曹伸出手，正要大把大把地摘下金币，往口袋里装，房门上忽然传来三下重重的敲击，把他从梦里惊醒。
        - id: ch02-b02
          speaker: narrator
          text: 来敲门的是店主。他告诉匹诺曹，已经到半夜了。
        - id: ch02-b03
          speaker: pinocchio
          text: 我的伙伴都准备好了吗？
        - id: ch02-b04
          speaker: innkeeper
          text: 准备好？他们早在两个钟头以前就走啦。
        - id: ch02-b05
          speaker: pinocchio
          text: 他们为什么那么着急？
        - id: ch02-b06
          speaker: innkeeper
          text: 猫收到消息，说她的大儿子脚上长了冻疮，眼看就要没命了。
        - id: ch02-b07
          speaker: pinocchio
          text: 那么，他们把晚饭钱付了吗？
        - id: ch02-b08
          speaker: innkeeper
          text: 您怎么会这么想？他们那么有教养，绝不会拿付钱这种事来侮辱您这样一位绅士。
        - id: ch02-b09
          speaker: pinocchio
          text: 真可惜！这种侮辱，我倒很乐意受一回！
        - id: ch02-b10
          speaker: narrator
          text: 匹诺曹一面说，一面挠着脑袋，随后又问起那两个好朋友的去向。
        - id: ch02-b11
          speaker: pinocchio
          text: 他们说要在哪里等我？
        - id: ch02-b12
          speaker: innkeeper
          text: 明天清早太阳一出来，他们就在奇迹田等您。
        - id: ch02-b13
          speaker: narrator
          text: 匹诺曹只好拿出一枚金币，把三个人的晚饭钱都结了，这才离开客栈。
    - id: ch03
      title: 漆黑的路
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 外面黑得伸手不见五指。匹诺曹看不清脚下，只能一路摸索着走。几只夜鸟从路这边的树篱飞向另一边，翅膀擦过了他的鼻尖。匹诺曹吓得往后一跳，放声大喊。
        - id: ch03-b02
          speaker: pinocchio
          text: 谁在那里？
          emotion: fearful
        - id: ch03-b03
          speaker: narrator
          text: 四周的山岗把他的喊声远远送了回来。回声一遍又一遍地问，谁在那里？谁在那里？
        - id: ch03-b04
          speaker: narrator
          text: 匹诺曹继续往前走。走着走着，他看见树干上伏着一只小虫，发出一点微弱的亮光，就像一盏罩在透明瓷罩里的小夜灯。
        - id: ch03-b05
          speaker: pinocchio
          text: 你是谁？
        - id: ch03-b06
          speaker: talking_cricket
          text: 我是会说话的蟋蟀的鬼魂。
        - id: ch03-b07
          speaker: narrator
          text: 那声音很低，又轻又弱，仿佛真是从另一个世界飘来的。
        - id: ch03-b08
          speaker: pinocchio
          text: 你来找我做什么？
        - id: ch03-b09
          speaker: talking_cricket
          text: 我是来劝你的。回去吧，把剩下的四枚金币交给你可怜的爸爸。你一直没有回家，他正在绝望地哭泣。
        - id: ch03-b10
          speaker: pinocchio
          text: 等到明天，我爸爸就会成为一位绅士。这四枚金币到时候已经变成两千枚啦。
    - id: ch04
      title: 蟋蟀最后的劝告
      blocks:
        - id: ch04-b01
          speaker: talking_cricket
          text: 别信那些说一天就能让你发财的人。说这种话的，不是疯子，通常就是骗子！听我劝吧，孩子，快回去。
        - id: ch04-b02
          speaker: pinocchio
          text: 我偏要继续往前走。
        - id: ch04-b03
          speaker: talking_cricket
          text: 现在已经很晚了！
        - id: ch04-b04
          speaker: pinocchio
          text: 我还是要往前走。
        - id: ch04-b05
          speaker: talking_cricket
          text: 可夜里这么黑！
        - id: ch04-b06
          speaker: pinocchio
          text: 我说了，我就是要往前走。
        - id: ch04-b07
          speaker: talking_cricket
          text: 前面的路很危险！
        - id: ch04-b08
          speaker: pinocchio
          text: 不管怎样，我都要走下去。
        - id: ch04-b09
          speaker: talking_cricket
          text: 你记住，一心任性，什么都非要照自己的意思来，像这样的孩子，迟早会后悔的。
        - id: ch04-b10
          speaker: pinocchio
          text: 又是这一套老话。晚安吧，蟋蟀。
        - id: ch04-b11
          speaker: talking_cricket
          text: 晚安，匹诺曹。愿上天保佑你躲开危险，也躲开杀人凶徒。
        - id: ch04-b12
          speaker: narrator
          text: 蟋蟀的话刚说完，身影就突然消失了，像一盏被吹灭的灯。四周的路，比刚才更加黑暗。
