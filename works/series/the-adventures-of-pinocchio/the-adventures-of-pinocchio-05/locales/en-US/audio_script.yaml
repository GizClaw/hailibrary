audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm and story-rich
        timbre: clear and rounded
        pace: measured
        pitch: medium
    pinocchio:
      display_name: Pinocchio
      tts:
        delivery: impulsive and defiant
        timbre: bright and wooden
        pace: quick
        pitch: medium-high
    chick:
      display_name: Little Chick
      tts:
        delivery: cheerful and exceedingly polite
        timbre: tiny and clear
        pace: lively
        pitch: high
  chapters:
    - id: ch01
      title: Nothing to Eat
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Night was coming, and Pinocchio remembered that he had eaten nothing all day. A gnawing feeling began in his stomach. It felt very much like an appetite.
        - id: ch01-b02
          speaker: narrator
          text: A few minutes later, that appetite had turned into hunger. Before long, he was ravenous.
        - id: ch01-b03
          speaker: narrator
          text: Poor Pinocchio rushed to the fireplace. A saucepan seemed to be boiling there, and he reached for the lid to see what was inside. But there was no real saucepan at all. It was only painted on the wall. Just imagine how he felt. His already long nose grew at least three inches longer.
        - id: ch01-b04
          speaker: narrator
          text: Then he raced around the room, pulling open drawers and searching everywhere he could think of. He hoped for one little bite of bread. Dry bread, a crust, a bone a dog had left behind, a scrap of moldy corn pudding, a fish bone, even a cherry pit. Anything he could chew would do. But he found nothing. Not one thing.
        - id: ch01-b05
          speaker: narrator
          text: All the while, his hunger kept growing. The only relief he had was to yawn. Those yawns were so enormous that his mouth nearly reached his ears. After each one, he sputtered and felt ready to faint.
        - id: ch01-b06
          speaker: narrator
          text: At last, he began to cry desperately.
        - id: ch01-b07
          speaker: pinocchio
          text: The Talking Cricket was right. I shouldn't have turned against Papa and run away. If Papa were here, I wouldn't be dying from all this yawning. Oh, hunger is a terrible illness!
          emotion: sad
    - id: ch02
      title: The Egg in the Dust
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: Just then, something caught his eye in the dust heap. It was round and white, like a hen's egg. In a flash, he sprang forward and grabbed it. It really was an egg.
        - id: ch02-b02
          speaker: narrator
          text: Pinocchio could hardly contain his joy. He almost thought he must be dreaming. He turned the egg over and over in his hands, felt it, and kissed it.
        - id: ch02-b03
          speaker: pinocchio
          text: Now, how should I cook you? An omelet? No, cooking you in a saucer would be better. Or maybe you'd taste nicer fried in a pan. What if I just boil you? No, the saucer will be quickest, and I can't wait to eat!
          emotion: happy
        - id: ch02-b04
          speaker: narrator
          text: He wasted no time. He set an earthenware saucer over a brazier filled with red-hot embers. Instead of oil or butter, he poured a little water into the saucer. As soon as the water began to smoke, crack! He broke the shell over it and dropped in what was inside.
        - id: ch02-b05
          speaker: narrator
          text: But no egg white or yolk came out. A little chicken popped free instead, looking cheerful and very polite. The chick gave Pinocchio a beautiful curtsy.
        - id: ch02-b06
          speaker: chick
          text: A thousand thanks, Master Pinocchio! You saved me the trouble of breaking the shell myself. Goodbye until we meet again. Keep well, and give my best to everyone at home!
          emotion: happy
        - id: ch02-b07
          speaker: narrator
          text: With that, the chick spread its wings, shot through the open window, and flew away until Pinocchio could no longer see it.
    - id: ch03
      title: Hungrier Than Ever
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: The poor puppet stood there as if he were under a spell. His eyes stared straight ahead, his mouth hung open, and he still held the empty shell in his hand.
        - id: ch03-b02
          speaker: narrator
          text: When his surprise finally passed, he began to cry and scream. He stamped his feet on the floor in despair. Between sobs, he spoke.
        - id: ch03-b03
          speaker: pinocchio
          text: The Talking Cricket really was right! If I hadn't run away, and if Papa were here, I wouldn't be starving now. Oh, hunger is a terrible illness!
          emotion: sad
        - id: ch03-b04
          speaker: narrator
          text: His stomach cried out louder than ever, and he had no idea how to quiet it.
        - id: ch03-b05
          speaker: narrator
          text: So Pinocchio decided to leave the house and search the neighborhood. He hoped to find some kind person who would give him a piece of bread.
