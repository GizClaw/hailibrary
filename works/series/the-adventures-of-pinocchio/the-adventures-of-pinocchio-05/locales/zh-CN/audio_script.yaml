audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖从容，带一点一本正经的幽默
        timbre: 清晰醇厚
        pace: 舒缓，遇到惊奇处略微加快
        pitch: 中
    pinocchio:
      display_name: 匹诺曹
      tts:
        delivery: 任性直率，嘴硬而孩子气，发怒时冲动急躁
        timbre: 清亮，带木偶般的脆响
        pace: 偏快，争辩时更急
        pitch: 中高
    chick:
      display_name: 小鸡
      tts:
        delivery: 快活有礼，郑重其事中透着俏皮
        timbre: 稚嫩明亮
        pace: 轻快
        pitch: 高
  chapters:
    - id: ch01
      title: 越来越饿
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 天快黑了。匹诺曹这才想起来，自己一整天都没吃东西。肚子里一阵阵发空，好像有个叫“胃口”的家伙正在里面咬他。
        - id: ch01-b02
          speaker: narrator
          text: 才过了几分钟，那点胃口就变成了饥饿。再一转眼，他已经饿得发慌。
        - id: ch01-b03
          speaker: narrator
          text: 可怜的匹诺曹赶紧跑向壁炉。墙边有一只平底锅，锅里仿佛正咕嘟咕嘟煮着东西。他伸手想揭锅盖，看看能不能吃上一口，这才发现锅是画在墙上的。你想想，他该多失望啊！就连本来已经很长的鼻子，也一下又长了至少三英寸。
        - id: ch01-b04
          speaker: narrator
          text: 他不死心，又在屋子里到处翻。抽屉拉开了，所有能藏东西的地方也全找过了。他只想找到一点吃的，干面包也行，硬面包皮也行。狗啃剩的骨头、发霉的玉米糊、鱼刺、樱桃核，哪怕只有一样能嚼一嚼，他都愿意。可是没有。什么都没有，真是半点儿也没有。
        - id: ch01-b05
          speaker: narrator
          text: 饥饿还在一阵阵加重。匹诺曹一点办法也没有，只能不停打哈欠。每个哈欠都大得吓人，嘴巴差点咧到耳朵边。哈欠一停，他就呼哧乱喘，觉得自己快要昏倒了。
    - id: ch02
      title: 垃圾堆里的鸡蛋
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 到后来，匹诺曹绝望得哭了起来。
        - id: ch02-b02
          speaker: pinocchio
          text: 会说话的蟋蟀说得没错。我不该跟爸爸作对，也不该逃出家门。要是爸爸在，我哪会打哈欠打得快死了！唉，挨饿真是种可怕的病！
          emotion: sad
        - id: ch02-b03
          speaker: narrator
          text: 正哭着，他忽然瞧见垃圾堆里有个东西，圆圆的，白白的，看起来就像鸡蛋。他猛地一扑，伸手抓住了它。这一下快得只用了一眨眼。拿起来一看，果然是只鸡蛋。
        - id: ch02-b04
          speaker: narrator
          text: 匹诺曹高兴得不得了，几乎疑心自己是在做梦。他把鸡蛋托在手里，翻过来看看，转过去摸摸，还亲了又亲。亲着亲着，他开始盘算起来。
        - id: ch02-b05
          speaker: pinocchio
          text: 该怎么弄熟呢？摊成鸡蛋饼？不，还是放进小碟子里煮吧！可用煎锅煎，会不会更香？要不就整个煮熟？不行不行，还是用小碟子最快。我急着吃，实在等不了啦！
          emotion: happy
    - id: ch03
      title: 会飞的鸡蛋
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 匹诺曹马上把一只陶制小碟架在火盆上，下面全是烧得通红的炭。他没有油，也没有黄油，只往碟里倒了一点水。水刚开始冒热气，他就啪地磕开蛋壳，把里面的东西倒了进去。
        - id: ch03-b02
          speaker: narrator
          text: 可落下来的不是蛋白，也不是蛋黄。竟然有一只小鸡从蛋壳里蹦了出来！它看上去又快活又懂礼貌，还漂漂亮亮地行了个屈膝礼。
        - id: ch03-b03
          speaker: chick
          text: 万分感谢您，匹诺曹先生！多亏了您，我不用自己费劲啄开蛋壳了。那就再会吧，下次见！祝您身体安好，也请替我问候家里各位！
          emotion: happy
        - id: ch03-b04
          speaker: narrator
          text: 话一说完，小鸡就展开翅膀，从开着的窗户猛地飞了出去。转眼间，它便飞得没影了。
    - id: ch04
      title: 出门找面包
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 可怜的木偶站在原地，像中了魔法。他两眼直直地盯着前方，嘴巴还张得大大的，手里只剩下蛋壳。
        - id: ch04-b02
          speaker: narrator
          text: 好不容易回过神来，他又哭又叫，急得直跺脚。抽抽噎噎间，他又想起了蟋蟀的话。
        - id: ch04-b03
          speaker: pinocchio
          text: 唉，会说话的蟋蟀果然说对了！我要是没逃走，爸爸要是在这里，我现在怎么会饿得快死了！挨饿真是种可怕的病！
          emotion: sad
        - id: ch04-b04
          speaker: narrator
          text: 可他的肚子叫得比刚才还要响，他又不知道怎样才能让它停下来。最后，匹诺曹决定走出屋子，到附近去转一转。他盼着能遇上一位好心人，给他一块面包。
