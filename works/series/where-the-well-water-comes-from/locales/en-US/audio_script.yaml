audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: observant and composed
        timbre: warm and clear
        pace: measured
        pitch: medium
    child:
      display_name: Nora
      tts:
        delivery: curious, candid, and intent on evidence
        timbre: clear youthful
        pace: natural and lively
        pitch: medium-high
    well-keeper:
      display_name: Mr. Vale
      tts:
        delivery: patient, practical, and honest about uncertainty
        timbre: low and weathered
        pace: unhurried
        pitch: low
    repair-worker:
      display_name: Repair worker
      tts:
        delivery: defensive and impatient
        timbre: work-worn
        pace: brisk
        pitch: medium-low
    shop-owner:
      display_name: Mr. Rusk
      tts:
        delivery: guarded at first, then practical
        timbre: sturdy and slightly rough
        pace: steady
        pitch: medium-low
    hardware-driver:
      display_name: Hardware driver
      tts:
        delivery: brief and matter-of-fact
        timbre: clear adult
        pace: even
        pitch: medium
    hydrologist:
      display_name: Hydrologist
      tts:
        delivery: precise without sounding formal
        timbre: calm and clear
        pace: measured
        pitch: medium
    mother:
      display_name: Nora's mother
      tts:
        delivery: tired, direct, and caring
        timbre: warm adult
        pace: deliberate
        pitch: medium
  chapters:
    - id: ch01
      title: The Short Chain
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: |+
            Nora knew the well was in trouble when Mr. Vale brought out the short chain.

            All summer, the village buckets had gone down on the long chain, splashed, and come up sweating cold drops. On the first Monday in August, Mr. Vale unhooked six links so the bucket would not strike bottom. Even then, when Nora tipped it into her two cans, rusty sand swirled in the water.

        - id: ch01-b02
          speaker: child
          text: Where did the rest go?
        - id: ch01-b03
          speaker: narrator
          text: |2+
             she asked.

        - id: ch01-b04
          speaker: well-keeper
          text: Out through our taps, mostly.
        - id: ch01-b05
          speaker: narrator
          text: " Mr. Vale flexed his stiff fingers. He had repaired pumps and stone wells for longer than Nora had been alive. "
        - id: ch01-b06
          speaker: well-keeper
          text: The harder question is why it isn't coming back as fast.
        - id: ch01-b07
          speaker: narrator
          text: |+
            

            That was not the answer she wanted. At home, her mother measured water into the bean pot with a cup instead of pouring it. Nora could hear every unused cup.

            The next morning she found Mr. Vale lowering a weighted tape through the inspection opening. When the buzzer touched water, he read the mark and wrote it in a grease-stained notebook.

        - id: ch01-b08
          speaker: child
          text: Can I see?
        - id: ch01-b09
          speaker: narrator
          text: |-
            

            He showed her a column of dates and depths. The water surface had dropped a little almost every day.

            Nora pictured a stone room under the village, drained cup by cup. 
        - id: ch01-b10
          speaker: child
          text: So we need to find the underground lake.
        - id: ch01-b11
          speaker: narrator
          text: |-
            

            Mr. Vale shut the well cap. 
        - id: ch01-b12
          speaker: well-keeper
          text: Pack lunch. We'll go look for the lake that probably isn't there.
    - id: ch02
      title: Clues on the Hill
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: |+
            

            They followed the dry creek toward Juniper Hill. Cicadas buzzed in the sycamores. The creek bed was pale except for black mud under one fallen log. Mr. Vale pushed aside the leaves there, and clear water slowly gathered in his thumbprint.

        - id: ch02-b02
          speaker: child
          text: A spring?
        - id: ch02-b03
          speaker: narrator
          text: |2+
             Nora asked.

        - id: ch02-b04
          speaker: well-keeper
          text: A seep. It tells us water is moving through this bank.
        - id: ch02-b05
          speaker: narrator
          text: |+
            

            He filled three cracked flowerpots with gravel, sand, and clay. Nora poured the same amount of water into each. Water rattled through the gravel, dripped through the sand, and sat shining on the clay.

        - id: ch02-b06
          speaker: child
          text: |+
            Those are aquifers?

        - id: ch02-b07
          speaker: well-keeper
          text: Those are flowerpots.
        - id: ch02-b08
          speaker: narrator
          text: " He gave her the cup again. "
        - id: ch02-b09
          speaker: well-keeper
          text: An aquifer is rock or sediment that can store and carry groundwater. Underground layers aren't arranged as neatly as my pots.
        - id: ch02-b10
          speaker: narrator
          text: |+
            

            Nora squeezed the wet sand. It held water although no stream ran through her palm.

            They climbed. The morning's heat rose off the bare slope. In a road cut, pebbles lay over a hard band of reddish clay. Farther up, rain had carved finger-shaped channels beside an abandoned vehicle shed.

        - id: ch02-b11
          speaker: child
          text: Rain falls here,
        - id: ch02-b12
          speaker: narrator
          text: " Nora said. "
        - id: ch02-b13
          speaker: child
          text: |+
            Some soaks through the gravel. The clay slows it, so it moves sideways and comes out at the creek.

        - id: ch02-b14
          speaker: well-keeper
          text: |+
            That could be part of it.

        - id: ch02-b15
          speaker: child
          text: And then it goes to our well.
        - id: ch02-b16
          speaker: narrator
          text: |-
            

            Mr. Vale sat on a boulder and unwrapped his sandwich. 
        - id: ch02-b17
          speaker: well-keeper
          text: |+
            Could. I haven't mapped the layers. I don't know the travel time. Groundwater doesn't promise to follow the arrows we draw.

        - id: ch02-b18
          speaker: child
          text: |+
            But you fix wells.

        - id: ch02-b19
          speaker: well-keeper
          text: Fixing a pump and knowing every crack under a hill are different jobs.
        - id: ch02-b20
          speaker: narrator
          text: |-
            

            Nora had never heard him say I don't know. She had expected the words to close a door. Instead, Mr. Vale handed her the notebook and asked her to sketch the road cut.
    - id: ch03
      title: The Oily Streak
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: |+
            

            Beyond the shed, a sharp oily smell replaced the scent of hot weeds. Two dented drums lay on their sides. A dark streak ran from them into the same gravel Nora had just drawn. A man from the repair shop was carrying out a basin of gray wash water.

        - id: ch03-b02
          speaker: well-keeper
          text: Please don't dump that,
        - id: ch03-b03
          speaker: narrator
          text: |2-
             Mr. Vale called.

            The man stopped. 
        - id: ch03-b04
          speaker: repair-worker
          text: |+
            Since when do you own this hill?

        - id: ch03-b05
          speaker: well-keeper
          text: |+
            I don't.

        - id: ch03-b06
          speaker: repair-worker
          text: Then don't tell me where to wash a wrench.
        - id: ch03-b07
          speaker: narrator
          text: |-
            

            Mr. Vale crouched beside the dark streak and rubbed gravel between two fingers. 
        - id: ch03-b08
          speaker: well-keeper
          text: |+
            This may be land where water enters the shallow aquifer. If it is, spilled oil can travel with that water.

        - id: ch03-b09
          speaker: child
          text: |+
            May be?

        - id: ch03-b10
          speaker: well-keeper
          text: May be. We need a proper survey and water tests.
        - id: ch03-b11
          speaker: narrator
          text: |-
            

            The man snorted. 
        - id: ch03-b12
          speaker: repair-worker
          text: So you don't know.
          emotion: disgusted
        - id: ch03-b13
          speaker: narrator
          text: |-
            

            Nora waited for Mr. Vale to sharpen his voice. He only stood and said, 
        - id: ch03-b14
          speaker: well-keeper
          text: I know I won't gamble the village well to save one trip to the collection station.
        - id: ch03-b15
          speaker: narrator
          text: |-
            

            The basin trembled in the man's hands. Finally, he carried it back inside.
    - id: ch04
      title: Possible Paths
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: |+
            

            By noon, everyone in the village had an opinion. Closing the wash area would hurt the repair shop. Hauling oily waste would cost money. The drought, some people said, had nothing to do with a few old drums.

            Nora made a poster from a flattened grocery box. She drew rain entering gravel, water collecting above clay, and a well reaching into the wet layer. Mr. Vale made her add dotted lines and the words POSSIBLE PATHS.

            At the meeting, Mr. Vale proposed covered containers and a shared monthly trip to the county waste station. The shop owner, Mr. Rusk, folded his arms.

        - id: ch04-b02
          speaker: shop-owner
          text: You want me to lose a day's work.
          emotion: angry
        - id: ch04-b03
          speaker: narrator
          text: |-
            

            Nora had prepared a speech about protecting the future. Looking at the cracks in Mr. Rusk's hands, she abandoned it. 
        - id: ch04-b04
          speaker: child
          text: Could the hardware truck take the containers when it goes to the county? It comes back empty on Thursdays.
        - id: ch04-b05
          speaker: narrator
          text: |-
            

            The hardware driver considered this. 
        - id: ch04-b06
          speaker: hardware-driver
          text: If they're sealed and somebody helps load.
        - id: ch04-b07
          speaker: narrator
          text: |-
            

            Mr. Rusk looked at Nora's dotted lines. 
        - id: ch04-b08
          speaker: shop-owner
          text: |+
            And if the tests show the water goes somewhere else?

        - id: ch04-b09
          speaker: well-keeper
          text: Then we'll know more than we know now,
        - id: ch04-b10
          speaker: narrator
          text: |2-
             Mr. Vale said.

            They agreed to move the leaking drums that afternoon. It was unpleasant work. Adults handled the stained ground while Nora and three friends cleared clean trash from the upper slope and dug shallow, grass-lined dips to slow rainwater rushing off the bare track. Nobody cut a ribbon. One drum split when they lifted it, and they had to find a second tray before they could continue.
    - id: ch05
      title: The Patient Column
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: |+
            

            A county hydrologist arrived two days later. She measured water levels, studied the slope, and took samples from the seep and the well. Nora followed with her poster tucked under one arm.

        - id: ch05-b02
          speaker: child
          text: Did I draw it right?
        - id: ch05-b03
          speaker: narrator
          text: |2+
             Nora asked.

        - id: ch05-b04
          speaker: hydrologist
          text: You drew one reasonable idea,
        - id: ch05-b05
          speaker: narrator
          text: " the hydrologist said. "
        - id: ch05-b06
          speaker: hydrologist
          text: Real groundwater can move through a patchwork of pores and fractures. We need measurements before we know which ground supplies this well.
        - id: ch05-b07
          speaker: narrator
          text: |+
            

            She explained that rain entering the soil was called recharge. Some rainfall ran to the creek, some returned to the air or was used by plants, and some might move down to groundwater. A storm tonight could take time to affect the well—or might scarcely affect it at all.

            That evening the wind changed. The leaves turned their pale undersides toward the road. Nora smelled rain before she felt it.

            The storm broke after midnight. Water drummed on the roof and raced along the gutters. Nora pulled on boots and found Mr. Vale at the well under a yellow raincoat. Together they walked up the road, keeping clear of the flooded ditch. At the old shed, the new containers stood closed beneath a metal roof. Rainwater spread through the grass-lined dips instead of cutting one muddy channel toward the gravel.

            Back at the well, Nora reached for the measuring tape.

        - id: ch05-b08
          speaker: child
          text: |+
            Will it be full?

        - id: ch05-b09
          speaker: well-keeper
          text: No promises,
        - id: ch05-b10
          speaker: narrator
          text: |2-
             Mr. Vale said.

            She lowered the probe. Rain tapped her hood, ran down her wrists, and darkened the stone rim. Deep below, the buzzer sounded. Mr. Vale held the flashlight while Nora found the mark and wrote it beside the night's date.

            The number was almost the same as yesterday's.

            Nora looked at the rain pouring over the village, then at the patient column in the notebook. She turned to a clean page and ruled a place for tomorrow.
    - id: ch06
      title: Room for Another Reading
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: |-
            

            The number stayed nearly unchanged the next morning. A few people sighed as if the storm had broken a promise. Nora closed the notebook before anyone could turn one measurement into an answer.

            At home, the drought kept its own records. Her mother saved water from rinsing beans for the tomatoes. When Nora called their careful measuring a challenge, her mother set down the cup. 
        - id: ch06-b02
          speaker: mother
          text: A challenge ends when somebody wins. This is work, and it is costing us.
        - id: ch06-b03
          speaker: narrator
          text: |-
            

            The family sold pickled beans at the Saturday market. With less water, they filled fewer jars. That week Mrs. Bell needed half a can for her baby goats, and Nora's mother gave it to her. Later, Nora found her staring at six empty jars on the pantry shelf. The well level was no longer a satisfying column of figures. It had entered the kitchen and the ledger.

            Mr. Rusk's shop kept records too. Until covered containers arrived, he stopped washing engine parts. Two customers took their pumps to the county. When he met Nora beside the well, he tapped her diagram. 
        - id: ch06-b04
          speaker: shop-owner
          text: Will those dotted lines pay for the work I lost?
          emotion: angry
        - id: ch06-b05
          speaker: narrator
          text: |-
            

            Nora glanced toward Mr. Vale. He was kneeling over the well cap and did not rescue her. 
        - id: ch06-b06
          speaker: child
          text: |+
            No. The hardware truck comes back empty on Thursday. I can ask which neighbors will help load.

        - id: ch06-b07
          speaker: shop-owner
          text: |+
            And who finds containers before Thursday?

        - id: ch06-b08
          speaker: child
          text: I can ask the school custodian. I can't handle the wash water.
        - id: ch06-b09
          speaker: narrator
          text: |-
            

            Nora visited seven houses that afternoon. Two adults offered strong backs. The custodian found sound drums with fitted lids and called the county station. Nora's mother left heavy gloves by the door with a note that only adults were to use them. On Thursday, Mr. Rusk rolled the sealed containers up the truck's ramp himself. Nothing dripped onto the gravel.

            The hydrologist returned with preliminary sample results. The samples did not show that oil from the shed had reached the well. One round of samples could not prove the well would always be safe, and the hill's contribution to the aquifer was still uncertain. More measurements were needed.

            Relief moved through the meeting room. Someone asked whether the old drums could go back outside.

            Mr. Rusk answered first. 
        - id: ch06-b10
          speaker: shop-owner
          text: Why wait until oil comes out of the village tap?
        - id: ch06-b11
          speaker: narrator
          text: " He pulled off his gloves. "
        - id: ch06-b12
          speaker: shop-owner
          text: The new containers stay under the roof. I'll pay half the hauling cost. Anyone who adds waste pays part of the rest.
        - id: ch06-b13
          speaker: narrator
          text: |+
            

            The village did not fence the whole hill. The hydrologist warned them against inventing a boundary before they understood the ground. They began with actions that made sense under several possible maps: removing leaking drums, keeping oily water in covered containers, moving waste away from the well, and repairing the eroded track. On clean bare soil, they planted local grass to slow muddy runoff. Adults handled stained soil. Children collected only clean litter.

            Nora had wanted one finished map. Her notebook now held several kinds of lines. Solid lines recorded water levels. Dashes marked possible underground paths. Curves followed storm water across the slope. The more honest the map became, the less it looked like a single answer.

            For ten days, she and Mr. Vale measured at the same hour. On the eleventh day, the water stood a little higher. Mr. Vale measured again, then handed Nora the tape. Their readings matched.

        - id: ch06-b14
          speaker: child
          text: |+
            Was it our storm?

        - id: ch06-b15
          speaker: well-keeper
          text: Maybe some of it. Maybe older water arriving by a slower route. One rise can't tell us.
        - id: ch06-b16
          speaker: narrator
          text: |+
            

            Nora wrote the number without drawing an arrow from the rain date.

            Two gentler storms came before autumn. Grass bent under the drops and stood again. Much of the creek remained white stone, but the seep below the log widened by Nora's thumb. She returned with Mr. Vale and Mr. Rusk, who carried sample bottles in the bag that usually held wrenches.

        - id: ch06-b17
          speaker: shop-owner
          text: If you hadn't walked by that day,
        - id: ch06-b18
          speaker: narrator
          text: " Mr. Rusk said, "
        - id: ch06-b19
          speaker: shop-owner
          text: |+
            I would have thrown out the basin.

        - id: ch06-b20
          speaker: well-keeper
          text: If we'd claimed we knew the whole hill,
        - id: ch06-b21
          speaker: narrator
          text: " Mr. Vale said, "
        - id: ch06-b22
          speaker: well-keeper
          text: |+
            you wouldn't have believed us.

        - id: ch06-b23
          speaker: shop-owner
          text: I still don't believe every dashed line.
        - id: ch06-b24
          speaker: narrator
          text: |-
            

            Nora gave him a bottle. 
        - id: ch06-b25
          speaker: child
          text: Then help us measure.
        - id: ch06-b26
          speaker: narrator
          text: |+
            

            Water did not pour from a hidden tunnel. First one grain of sand darkened, then another. A thin shine joined the spaces between pebbles. Only after that did water gather high enough to enter the bottle.

            Nora remembered the bucket striking bottom. She had imagined a buried room and wanted to catch whoever had emptied it. The well had offered no secret river. It offered smaller evidence: wet sand, a clay layer, a series of depths, a delayed rise, and water quietly appearing between stones.

            Before winter, the hydrologist combined the slope survey, water levels, and information about local sediments. She outlined an area for priority protection and further study. The boundary crossed one corner behind the repair shop. Mr. Rusk moved his cleaning bench onto a roofed pad where spills could be captured. Nora could not lift it, so she gathered loose nuts and washers into a tin.

            The village continued monthly measurements. Water limits stayed until wetter weather made it reasonable to ease them. Sometimes Nora forgot her pencil. Once she copied the wrong date. Mr. Vale made her cross it out instead of repairing the record from memory.

            He kept his errors too. After one storm, he guessed the seep would rise before the well. The well moved first. He circled his prediction and wrote WRONG—KEEP IT.

        - id: ch06-b27
          speaker: child
          text: Why keep a wrong guess?
        - id: ch06-b28
          speaker: narrator
          text: |2+
             Nora asked.

        - id: ch06-b29
          speaker: well-keeper
          text: So the next idea has to answer it.
        - id: ch06-b30
          speaker: narrator
          text: |-
            

            By spring, the notebook would no longer close flat. Receipts, sample labels, rainfall dates, and three maps bulged between its pages. The first map showed one bold arrow. The latest showed several faint possibilities and many solid observations.

            After the first spring rain, Nora went to the well alone. She could lower the tape without knocking it against the stones. Across the creek, rain from Mr. Rusk's roof entered the grassy dips. New roots held the soil beside the repaired track. Under the fallen log, the seep stained the sand dark brown.

            Far below, the buzzer sounded.

            Nora pinched the tape, read the mark, and opened the red notebook. She wrote the depth beside the date. Then, before guessing where that water had traveled, she left half the page blank.
