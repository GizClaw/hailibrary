  "chapters":
    - "id": "ch01"
      "title": "The Short Chain"
      "blocks":
        - "id": "ch01-b01"
          "speaker": "narrator"
          "text": "Nora knew the well was in trouble when Mr. Vale brought out the short chain.\nAll summer, the village buckets had gone down on the long chain, splashed, and come up sweating cold drops. On the first Monday in August, Mr. Vale unhooked six links so the bucket would not strike bottom. Even then, when Nora tipped it into her two cans, rusty sand swirled in the water."
        - "id": "ch01-b02"
          "speaker": "child"
          "text": "Where did the rest go?"
        - "id": "ch01-b03"
          "speaker": "narrator"
          "text": " she asked."
        - "id": "ch01-b04"
          "speaker": "well-keeper"
          "text": "Out through our taps, mostly."
        - "id": "ch01-b05"
          "speaker": "narrator"
          "text": " Mr. Vale flexed his stiff fingers. He had repaired pumps and stone wells for longer than Nora had been alive. "
        - "id": "ch01-b06"
          "speaker": "well-keeper"
          "text": "The harder question is why it isn't coming back as fast."
        - "id": "ch01-b07"
          "speaker": "narrator"
          "text": "That was not the answer she wanted. At home, her mother measured water into the bean pot with a cup instead of pouring it. Nora could hear every unused cup."
    - "id": "ch02"
      "title": "Reading the Ground"
      "blocks":
        - "id": "ch02-b01"
          "speaker": "narrator"
          "text": "The next morning she found Mr. Vale lowering a weighted tape through the inspection opening. When the buzzer touched water, he read the mark and wrote it in a grease-stained notebook."
        - "id": "ch02-b02"
          "speaker": "child"
          "text": "Can I see?"
        - "id": "ch02-b03"
          "speaker": "narrator"
          "text": "He showed her a column of dates and depths. The water surface had dropped a little almost every day.\nNora pictured a stone room under the village, drained cup by cup. "
        - "id": "ch02-b04"
          "speaker": "child"
          "text": "So we need to find the underground lake."
        - "id": "ch02-b05"
          "speaker": "narrator"
          "text": "Mr. Vale shut the well cap. "
        - "id": "ch02-b06"
          "speaker": "well-keeper"
          "text": "Pack lunch. We'll go look for the lake that probably isn't there."
        - "id": "ch02-b07"
          "speaker": "narrator"
          "text": "They followed the dry creek toward Juniper Hill. Cicadas buzzed in the sycamores. The creek bed was pale except for black mud under one fallen log. Mr. Vale pushed aside the leaves there, and clear water slowly gathered in his thumbprint."
        - "id": "ch02-b08"
          "speaker": "child"
          "text": "A spring?"
        - "id": "ch02-b09"
          "speaker": "narrator"
          "text": " Nora asked."
        - "id": "ch02-b10"
          "speaker": "well-keeper"
          "text": "A seep. It tells us water is moving through this bank."
        - "id": "ch02-b11"
          "speaker": "narrator"
          "text": "He filled three cracked flowerpots with gravel, sand, and clay. Nora poured the same amount of water into each. Water rattled through the gravel, dripped through the sand, and sat shining on the clay."
        - "id": "ch02-b12"
          "speaker": "child"
          "text": "Those are aquifers?"
        - "id": "ch02-b13"
          "speaker": "well-keeper"
          "text": "Those are flowerpots."
        - "id": "ch02-b14"
          "speaker": "narrator"
          "text": " He gave her the cup again. "
        - "id": "ch02-b15"
          "speaker": "well-keeper"
          "text": "An aquifer is rock or sediment that can store and carry groundwater. Underground layers aren't arranged as neatly as my pots."
        - "id": "ch02-b16"
          "speaker": "narrator"
          "text": "Nora squeezed the wet sand. It held water although no stream ran through her palm.\nThey climbed. The morning's heat rose off the bare slope. In a road cut, pebbles lay over a hard band of reddish clay. Farther up, rain had carved finger-shaped channels beside an abandoned vehicle shed."
        - "id": "ch02-b17"
          "speaker": "child"
          "text": "Rain falls here,"
        - "id": "ch02-b18"
          "speaker": "narrator"
          "text": " Nora said. "
        - "id": "ch02-b19"
          "speaker": "child"
          "text": "Some soaks through the gravel. The clay slows it, so it moves sideways and comes out at the creek."
        - "id": "ch02-b20"
          "speaker": "well-keeper"
          "text": "That could be part of it."
        - "id": "ch02-b21"
          "speaker": "child"
          "text": "And then it goes to our well."
        - "id": "ch02-b22"
          "speaker": "narrator"
          "text": "Mr. Vale sat on a boulder and unwrapped his sandwich. "
        - "id": "ch02-b23"
          "speaker": "well-keeper"
          "text": "Could. I haven't mapped the layers. I don't know the travel time. Groundwater doesn't promise to follow the arrows we draw."
        - "id": "ch02-b24"
          "speaker": "child"
          "text": "But you fix wells."
        - "id": "ch02-b25"
          "speaker": "well-keeper"
          "text": "Fixing a pump and knowing every crack under a hill are different jobs."
        - "id": "ch02-b26"
          "speaker": "narrator"
          "text": "Nora had never heard him say I don't know. She had expected the words to close a door. Instead, Mr. Vale handed her the notebook and asked her to sketch the road cut."
    - "id": "ch03"
      "title": "Possible Paths"
      "blocks":
        - "id": "ch03-b01"
          "speaker": "narrator"
          "text": "Beyond the shed, a sharp oily smell replaced the scent of hot weeds. Two dented drums lay on their sides. A dark streak ran from them into the same gravel Nora had just drawn. A man from the repair shop was carrying out a basin of gray wash water."
        - "id": "ch03-b02"
          "speaker": "well-keeper"
          "text": "Please don't dump that,"
        - "id": "ch03-b03"
          "speaker": "narrator"
          "text": " Mr. Vale called.\nThe man stopped. "
        - "id": "ch03-b04"
          "speaker": "repair-worker"
          "text": "Since when do you own this hill?"
        - "id": "ch03-b05"
          "speaker": "well-keeper"
          "text": "I don't."
        - "id": "ch03-b06"
          "speaker": "repair-worker"
          "text": "Then don't tell me where to wash a wrench."
        - "id": "ch03-b07"
          "speaker": "narrator"
          "text": "Mr. Vale crouched beside the dark streak and rubbed gravel between two fingers. "
        - "id": "ch03-b08"
          "speaker": "well-keeper"
          "text": "This may be land where water enters the shallow aquifer. If it is, spilled oil can travel with that water."
        - "id": "ch03-b09"
          "speaker": "child"
          "text": "May be?"
        - "id": "ch03-b10"
          "speaker": "well-keeper"
          "text": "May be. We need a proper survey and water tests."
        - "id": "ch03-b11"
          "speaker": "narrator"
          "text": "The man snorted. "
        - "id": "ch03-b12"
          "speaker": "repair-worker"
          "text": "So you don't know."
        - "id": "ch03-b13"
          "speaker": "narrator"
          "text": "Nora waited for Mr. Vale to sharpen his voice. He only stood and said, "
        - "id": "ch03-b14"
          "speaker": "well-keeper"
          "text": "I know I won't gamble the village well to save one trip to the collection station."
        - "id": "ch03-b15"
          "speaker": "narrator"
          "text": "The basin trembled in the man's hands. Finally, he carried it back inside."
    - "id": "ch04"
      "title": "A Plan Under Question"
      "blocks":
        - "id": "ch04-b01"
          "speaker": "narrator"
          "text": "By noon, everyone in the village had an opinion. Closing the wash area would hurt the repair shop. Hauling oily waste would cost money. The drought, some people said, had nothing to do with a few old drums.\nNora made a poster from a flattened grocery box. She drew rain entering gravel, water collecting above clay, and a well reaching into the wet layer. Mr. Vale made her add dotted lines and the words POSSIBLE PATHS.\nAt the meeting, Mr. Vale proposed covered containers and a shared monthly trip to the county waste station. The shop owner, Mr. Rusk, folded his arms."
        - "id": "ch04-b02"
          "speaker": "shop-owner"
          "text": "You want me to lose a day's work."
        - "id": "ch04-b03"
          "speaker": "narrator"
          "text": "Nora had prepared a speech about protecting the future. Looking at the cracks in Mr. Rusk's hands, she abandoned it. "
        - "id": "ch04-b04"
          "speaker": "child"
          "text": "Could the hardware truck take the containers when it goes to the county? It comes back empty on Thursdays."
        - "id": "ch04-b05"
          "speaker": "narrator"
          "text": "The hardware driver considered this. "
        - "id": "ch04-b06"
          "speaker": "hardware-driver"
          "text": "If they're sealed and somebody helps load."
        - "id": "ch04-b07"
          "speaker": "narrator"
          "text": "Mr. Rusk looked at Nora's dotted lines. "
        - "id": "ch04-b08"
          "speaker": "shop-owner"
          "text": "And if the tests show the water goes somewhere else?"
        - "id": "ch04-b09"
          "speaker": "well-keeper"
          "text": "Then we'll know more than we know now,"
        - "id": "ch04-b10"
          "speaker": "narrator"
          "text": " Mr. Vale said.\nThey agreed to move the leaking drums that afternoon. It was unpleasant work. Adults handled the stained ground while Nora and three friends cleared clean trash from the upper slope and dug shallow, grass-lined dips to slow rainwater rushing off the bare track. Nobody cut a ribbon. One drum split when they lifted it, and they had to find a second tray before they could continue."
    - "id": "ch05"
      "title": "The Patient Column"
      "blocks":
        - "id": "ch05-b01"
          "speaker": "narrator"
          "text": "A county hydrologist arrived two days later. She measured water levels, studied the slope, and took samples from the seep and the well. Nora followed with her poster tucked under one arm."
        - "id": "ch05-b02"
          "speaker": "child"
          "text": "Did I draw it right?"
        - "id": "ch05-b03"
          "speaker": "narrator"
          "text": " Nora asked."
        - "id": "ch05-b04"
          "speaker": "hydrologist"
          "text": "You drew one reasonable idea,"
        - "id": "ch05-b05"
          "speaker": "narrator"
          "text": " the hydrologist said. "
        - "id": "ch05-b06"
          "speaker": "hydrologist"
          "text": "Real groundwater can move through a patchwork of pores and fractures. We need measurements before we know which ground supplies this well."
        - "id": "ch05-b07"
          "speaker": "narrator"
          "text": "She explained that rain entering the soil was called recharge. Some rainfall ran to the creek, some returned to the air or was used by plants, and some might move down to groundwater. A storm tonight could take time to affect the well—or might scarcely affect it at all.\nThat evening the wind changed. The leaves turned their pale undersides toward the road. Nora smelled rain before she felt it.\nThe storm broke after midnight. Water drummed on the roof and raced along the gutters. Nora pulled on boots and found Mr. Vale at the well under a yellow raincoat. Together they walked up the road, keeping clear of the flooded ditch. At the old shed, the new containers stood closed beneath a metal roof. Rainwater spread through the grass-lined dips instead of cutting one muddy channel toward the gravel.\nBack at the well, Nora reached for the measuring tape."
        - "id": "ch05-b08"
          "speaker": "child"
          "text": "Will it be full?"
        - "id": "ch05-b09"
          "speaker": "well-keeper"
          "text": "No promises,"
        - "id": "ch05-b10"
          "speaker": "narrator"
          "text": " Mr. Vale said.\nShe lowered the probe. Rain tapped her hood, ran down her wrists, and darkened the stone rim. Deep below, the buzzer sounded. Mr. Vale held the flashlight while Nora found the mark and wrote it beside the night's date.\nThe number was almost the same as yesterday's.\nNora looked at the rain pouring over the village, then at the patient column in the notebook. She turned to a clean page and ruled a place for tomorrow."
