audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 沉静而有观察力
        timbre: 温暖清晰
        pace: 舒缓
        pitch: 中
    child:
      display_name: 阿满
      tts:
        delivery: 好奇、认真，遇到压力时仍坦率
        timbre: 清亮的少年声
        pace: 自然稍快
        pitch: 中高
    well-keeper:
      display_name: 石伯
      tts:
        delivery: 耐心、直接，不掩饰不确定
        timbre: 低沉而略带风霜
        pace: 从容
        pitch: 低
    worker:
      display_name: 村民
      tts:
        delivery: 现实、急切
        timbre: 朴实有力
        pace: 自然
        pitch: 中
    shop-owner:
      display_name: 周叔
      tts:
        delivery: 起初防备，后来务实合作
        timbre: 厚实略粗粝
        pace: 稳健
        pitch: 中低
  chapters:
    - id: ch01
      title: 空桶的闷响
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: |+
            井桶落到底，发出的不是扑通，而是咚的一声。

            阿满攥着辘轳把手，肩膀还保持着往后拉的姿势。麻绳在木轴上抖了抖，井口浮起一股凉气，却没有水声。排在后面的铁桶、塑料壶和搪瓷盆都安静下来。

        - id: ch01-b02
          speaker: worker
          text: 再放一点。
        - id: ch01-b03
          speaker: narrator
          text: |+
            有人说。

            阿满松开半圈。井桶在下面擦着石壁，又是咚。

            守井的石伯从人群后面挤进来。他把草帽推到脑后，接过绳子，慢慢提。桶上来时只盛了浅浅一层浑水，水里转着一片枯叶。

        - id: ch01-b04
          speaker: well-keeper
          text: 今天每家少打半桶。
        - id: ch01-b05
          speaker: narrator
          text: |-
            石伯说。

            阿满盯着那片叶子：
        - id: ch01-b06
          speaker: child
          text: |+
            它怎么跑到井底去了？

        - id: ch01-b07
          speaker: well-keeper
          text: |+
            从井口掉的。

        - id: ch01-b08
          speaker: child
          text: 水呢？
        - id: ch01-b09
          speaker: narrator
          text: |-
            

            石伯用手背抹掉桶沿的泥。
        - id: ch01-b10
          speaker: well-keeper
          text: 这个问题大。先让后面的人打水。
        - id: ch01-b11
          speaker: narrator
          text: |+
            

            阿满没有走。他原本答应母亲打满两桶，午后还要用水泡豆子。可第二桶只装到一半。回家路上，扁担一头轻一头重，水在木桶里晃得很响，像故意提醒他少了多少。

            第二天黎明，石伯来敲窗。阿满跳下床，以为井里涨了水，却看见老人肩上扛着铁钎，腰间挂着卷尺和一只凹了口的白瓷缸。

        - id: ch01-b12
          speaker: well-keeper
          text: 不是想找水吗？
        - id: ch01-b13
          speaker: narrator
          text: 石伯问，
        - id: ch01-b14
          speaker: well-keeper
          text: 鞋穿牢。
        - id: ch01-b15
          speaker: narrator
          text: |+
            

            他们先去了井边。石伯把系着铁坠的细绳放下，听见坠子触水，便在井沿掐住绳子。阿满拉直卷尺，读出刻度。石伯把数写在烟盒背面，又翻出前几天的数。那一排数字像下坡的脚印，一天比一天深。

        - id: ch01-b16
          speaker: child
          text: 井是个大缸吗？
        - id: ch01-b17
          speaker: narrator
          text: 阿满趴在青石上往下看，
        - id: ch01-b18
          speaker: child
          text: |+
            我们把它喝空了？

        - id: ch01-b19
          speaker: well-keeper
          text: 要真是缸，早喝空了。
        - id: ch01-b20
          speaker: narrator
          text: 石伯把井盖合上，
        - id: ch01-b21
          speaker: well-keeper
          text: 井只是伸到地下水里的一个口。地下什么样，我也没长透视眼。走，先看地面。
    - id: ch02
      title: 沿河找水
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: |+
            

            村东的河已经瘦成一条断断续续的亮线。旧石桥下，淤泥裂开，裂缝里卡着白色螺壳。阿满在干河床上走得飞快，忽然脚下一凉，鞋帮渗进水来。几丛芦苇后面，湿沙不断冒出细小的亮点。

            石伯用瓷缸舀开浮泥。清水一点点聚回来。

        - id: ch02-b02
          speaker: child
          text: |+
            泉眼？

        - id: ch02-b03
          speaker: well-keeper
          text: 算一处渗水。
        - id: ch02-b04
          speaker: narrator
          text: 石伯用铁钎探进沙里，
        - id: ch02-b05
          speaker: well-keeper
          text: 地下的水碰到不容易透过的土和石头，就可能沿着上面的缝往旁边走，在低处露出来。可别把它想成地底藏着一条大河。
        - id: ch02-b06
          speaker: narrator
          text: |-
            

            阿满不服：
        - id: ch02-b07
          speaker: child
          text: 水不成河，怎么走？
          emotion: angry
        - id: ch02-b08
          speaker: narrator
          text: |+
            

            石伯从岸上装来一缸粗沙，又挖了一块黄褐色黏土。他让阿满同时往上面倒水。沙里的水很快从缸底滴下来，黏土上的水却摊成一汪，晒得发亮。

            阿满把湿沙攥在手里。指缝没有水流，掌心却凉透了。

        - id: ch02-b09
          speaker: well-keeper
          text: 石头和沙的空隙里能存水，也能让水慢慢过去，
        - id: ch02-b10
          speaker: narrator
          text: 石伯说，
        - id: ch02-b11
          speaker: well-keeper
          text: 像这缸沙只是帮你看个大概。地下有多少层、往哪边斜，得打孔、量水位，有时还得请懂地质的人来。光拿眼睛猜，不够。
        - id: ch02-b12
          speaker: narrator
          text: |+
            

            他们沿河往上游走。太阳升高后，石头烫脚，蝉声像从树皮里钻出来。阿满原先以为会找到一个黑洞，水从里面轰隆隆流向老井。走了半天，他只看见不同的土：松软的砂砾，发红的坡土，雨后曾冲出细沟的田埂，还有山脚岩石上一道渗着青苔的裂缝。

        - id: ch02-b13
          speaker: child
          text: 去年的雨都在下面？
        - id: ch02-b14
          speaker: narrator
          text: |+
            他问。

        - id: ch02-b15
          speaker: well-keeper
          text: 有些流进河，有些被树和庄稼用了，有些晒回天上，有些才往下渗。
        - id: ch02-b16
          speaker: narrator
          text: 石伯停下来喘气，
        - id: ch02-b17
          speaker: well-keeper
          text: |+
            渗下去也不一定到咱们井里。地下水走得慢，路还绕。

        - id: ch02-b18
          speaker: child
          text: |+
            那下一场雨，井就能满？

        - id: ch02-b19
          speaker: well-keeper
          text: 我不敢答应。
        - id: ch02-b20
          speaker: narrator
          text: |-
            

            这是石伯那天说得最干脆的一句话。阿满原以为修了三十年井的人什么都知道，听见不敢答应，反倒更认真看他在烟盒上画的线：山坡、砂砾层、难透水的黏土，还有一口只画到湿层里的井。线歪歪扭扭，但雨从坡上落下以后，有了几条不同的去路。
    - id: ch03
      title: 看不见的风险
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: |-
            

            回村时，他们在废弃砖窑旁闻到一股刺鼻的柴油味。坡脚有块低洼地，几只破桶倒在杂草里，黑油顺着一场旧雨冲出的沟痕，停在砂砾地边缘。两个修农机的人正要把一盆灰水泼下去。

            石伯快走几步：
        - id: ch03-b02
          speaker: well-keeper
          text: 别往这儿倒。
        - id: ch03-b03
          speaker: narrator
          text: |-
            

            端盆的人皱眉：
        - id: ch03-b04
          speaker: worker
          text: |+
            这离井远着呢。

        - id: ch03-b05
          speaker: well-keeper
          text: |+
            地面远，不等于地下不通。

        - id: ch03-b06
          speaker: worker
          text: 你看见通了？
        - id: ch03-b07
          speaker: narrator
          text: |-
            

            石伯没有像平时那样立刻顶回去。他蹲下抓了一把砂砾，油味粘在指头上。
        - id: ch03-b08
          speaker: well-keeper
          text: 没看见。所以更不能拿全村的水试。得请人查。今天先把这盆留住。
        - id: ch03-b09
          speaker: narrator
          text: |-
            

            那人看了看太阳，又看了看满盆脏水，嘴里嘟囔，却还是把盆端回棚里。阿满看着石伯沾油的手。老人刚才明明说了不知道，脚却没有往后退。
    - id: ch04
      title: 把可能写下来
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: |+
            

            午后，阿满把烟盒上的图重画在一块旧木板上。他画得很大，拿到井边给排队的人看。有人说砖窑用了几十年也没出事，有人说干旱才是眼前的麻烦，先别添事。修农机的周叔抱着胳膊站在人群外，脸色最难看。

        - id: ch04-b02
          speaker: shop-owner
          text: 不让我们洗零件，活怎么干？
        - id: ch04-b03
          speaker: narrator
          text: |-
            周叔问。

            阿满昨晚想过一串漂亮的话，此刻一句也说不出。他看见周叔指甲缝里的黑油，也看见他家门口同样摆着两个空水桶。

            石伯说：
        - id: ch04-b04
          speaker: well-keeper
          text: |+
            不是不让干。把洗油水接住，送到镇上的回收点。坡上那几只漏桶先挪走。我们出车，你们出手，行不行？

        - id: ch04-b05
          speaker: worker
          text: 车钱谁出？
        - id: ch04-b06
          speaker: narrator
          text: |-
            

            人群又吵起来。最后卖豆腐的婶婶把账本拿来，每户按能出的数凑一点；周叔负责找有盖的大桶；阿满和几个孩子只许在没有油污的上坡捡塑料和碎砖，不许碰黑泥。事情既不像胜利，也不像庆典。太阳很晒，破桶很重，还有一只桶底一抬就漏，弄得大家重新找盆接住。

            三天后，镇里的技术员来看了地形，量了几处水位，又取走水样。他说这里可能是浅层地下水接受雨水的一片地方，但地下结构还要继续查，不能凭一张图定论。石伯当着所有人的面点头，把阿满那块木板翻过去，在背面写下可能两个字。
    - id: ch05
      title: 雨夜的刻度
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: |+
            

            雨在第七天夜里来了。

            第一滴砸在瓦上时，阿满从床上坐起。很快，屋檐连成水帘，干土气味从院子里涌进来。他冲到门口，看见雨水沿石板向巷口跑，也看见坡上新挖的浅草沟把一部分急水拦住。水在草根间慢下来，浑黄渐渐沉下去。

            他撑伞跑到井边，石伯已经在那里，拿着手电照井绳。

        - id: ch05-b02
          speaker: child
          text: 现在量吗？
        - id: ch05-b03
          speaker: narrator
          text: |+
            阿满喊。

        - id: ch05-b04
          speaker: well-keeper
          text: 现在量，也不会立刻变成满井。
        - id: ch05-b05
          speaker: narrator
          text: 石伯的声音被雨打碎，
        - id: ch05-b06
          speaker: well-keeper
          text: 记下今天，往后接着量。
        - id: ch05-b07
          speaker: narrator
          text: |-
            

            他们把铁坠放下。细绳越过湿漉漉的井沿，一寸一寸沉进黑暗。过了很久，下面传来很轻的一声——不是空桶撞石头的咚，只是一粒水碰到另一片水。

            石伯掐住绳子。阿满举起手电，让他能看清卷尺上的刻度。
    - id: ch06
      title: 给明天留白
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: |+
            

            第二天早上，那格数字仍没有明显变化。井边有人叹气，也有人说昨夜的雨白下了。阿满把红皮本合上，没有争辩。石伯让他摸井沿外侧：石头已经晒热，缝里却还留着一点潮气。

        - id: ch06-b02
          speaker: child
          text: 水没白下，
        - id: ch06-b03
          speaker: narrator
          text: 阿满说，
        - id: ch06-b04
          speaker: child
          text: 只是没按我们的钟走。
        - id: ch06-b05
          speaker: narrator
          text: |-
            

            石伯看他一眼：
        - id: ch06-b06
          speaker: well-keeper
          text: 这句可以记。别写成保证。
        - id: ch06-b07
          speaker: narrator
          text: |-
            

            接下来的十天，阿满每天同一时辰来量。母亲把家里用水的数也交给他记：洗豆子的水留下冲院角，淘米水浇门外那棵蔫掉的石榴；可她不许阿满把省水说成游戏，因为每少做一锅豆腐，家里就少一笔收入。第五天，卖豆腐的婶婶来借水，母亲把半桶推过去，晚上却对着没泡完的豆子发愁。阿满第一次明白，井里的刻度不是一道题，它会走进每家的锅和账本。

            周叔的修理棚也安静了两日。没有合适的收集桶，他不敢再洗零件，两个等修水泵的人转去了镇上。他在井边碰见阿满，冷着脸问：
        - id: ch06-b08
          speaker: shop-owner
          text: 你那张图替我赔钱吗？
          emotion: angry
        - id: ch06-b09
          speaker: narrator
          text: |-
            

            阿满想躲到石伯身后，石伯却正弯腰检查井盖，像没听见。阿满只好说：
        - id: ch06-b10
          speaker: child
          text: |+
            不能。那辆五金车周四才来。我去问学校能不能先借有盖的桶。

        - id: ch06-b11
          speaker: shop-owner
          text: |+
            借来谁洗？

        - id: ch06-b12
          speaker: child
          text: 我不能碰油。可我能把车来的时间挨家告诉。
        - id: ch06-b13
          speaker: narrator
          text: |+
            

            周叔哼了一声，没说行，也没说不行。下午，阿满跑了七户人家。有人嫌他多事，有人答应帮抬桶；母亲听说后，把一双厚手套放到门边，只说成年人用。周四，五金车空着半边车厢回来。周叔自己把封好的废液桶推上跳板，石伯和司机在两侧扶稳。桶底没有再滴下一道黑线。

            技术员第二次来时，带来水样的初步结果。她说目前没有证据证明油污已经进了井，但一次取样也不能说明永远安全；坡地是不是主要补给区，还要结合更多水位和地层资料判断。有人松了口气，立刻问能不能把旧桶搬回去。

        - id: ch06-b14
          speaker: shop-owner
          text: 为什么非得等看见油？
        - id: ch06-b15
          speaker: narrator
          text: 周叔先开口。他把手套脱下来，掌心捂得发白，
        - id: ch06-b16
          speaker: shop-owner
          text: 新桶摆棚里，旧桶送走。车费我出一半，剩下一半按谁装了东西来分。
        - id: ch06-b17
          speaker: narrator
          text: |+
            

            村里没有把整座山围起来。技术员说，没查清水从哪里来以前，不能凭想象划一条神奇的边界。大家先清走坡上的漏桶，把洗油水装进有盖容器，不在井边倒污水；又修好通往砖窑的排水沟，在没有污染的裸地补种本地草，让暴雨少卷走泥土。孩子们只捡干净垃圾，沾油的土由戴防护用具的成年人处理。

            阿满原本最想要一张答案图。现在，他的红皮本里多了几种不同的线：实线记量过的水位，虚线表示还要查的地下路径，弯线记雨从坡上跑过的地方。线越多，他反而越不急着把其中一条涂黑。

            第十一天，井水面比雨夜抬高了一点。石伯重新量了一遍，又让阿满量一遍。两次数一样，他们才把数字写下。没人说这是那场雨直接送来的水，也没人说井从此不会再低。母亲看过数字，只把第二天泡豆子的水多加了一瓢。

            入秋前，又来了两场不急不猛的雨。坡上的草先是伏倒，后来在沟边立起来。干河床仍有大片白石，倒木下的渗水却宽了一掌。阿满和石伯沿旧路复查，周叔也跟来，背着取样瓶和午饭。

        - id: ch06-b18
          speaker: shop-owner
          text: 你们那天要是没来，
        - id: ch06-b19
          speaker: narrator
          text: 周叔说，
        - id: ch06-b20
          speaker: shop-owner
          text: 我大概已经把那盆水泼了。
        - id: ch06-b21
          speaker: narrator
          text: |-
            

            石伯说：
        - id: ch06-b22
          speaker: well-keeper
          text: |+
            我们要是装作全知道，你也不会信。

        - id: ch06-b23
          speaker: shop-owner
          text: |+
            我现在也没全信。

        - id: ch06-b24
          speaker: child
          text: 那就接着量。
        - id: ch06-b25
          speaker: narrator
          text: |-
            阿满把空瓶递给他。

            水不是从一个洞里涌出来的。它先让几粒沙变深，又在细石之间连成薄薄一片，最后才积进瓶口。阿满想起旱天早晨那只触底的空桶。那时他把井想成一只藏在地下的缸，急着找出谁把它喝空；现在井仍然没有交出一条清楚的地下河，只交出许多慢小的证据。

            冬天以前，技术员根据几处水位、地形和地层资料，在木板上圈出一片需要优先保护和继续调查的坡地。圈线穿过周叔棚后的一角。周叔把清洗台移到有硬底、有遮棚、能接住废水的位置。搬台子那天，阿满帮不上重活，就把散落的螺帽一颗颗拾进盒里。

            井边仍按月测水位。夏天留下的配水规矩没有立刻取消，后来雨多了才慢慢放宽。阿满有时把日期写错；石伯让他划掉重写，不许凭记忆补数。石伯也会猜错。一次他猜渗水先涨，结果老井先动了。他把猜测圈起来，旁边写：猜错，留着。

            来年第一场春雨后，阿满独自走到井边。他已经能稳稳放下测绳。铁坠穿过井口的凉气，细线在指间一寸寸轻下去。远处，周叔棚顶的雨水落进草沟；坡上的新草压住了泥；桥下那处渗水把一小片沙染成深褐色。

            下面传来轻轻一响。

            阿满掐住线，在红皮本上写下刻度。他没有急着画箭头，只在日期后留了半页空白。
