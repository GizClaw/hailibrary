audio_script:
  language: zh-CN
  cast:
    narrator: {display_name: 旁白, tts: {delivery: 像在身边讲故事，沉静而有观察力, timbre: 温暖清晰, pace: 舒缓自然, pitch: 中}}
    child: {display_name: 阿满, tts: {delivery: 好奇认真，遇事会紧张但不躲闪, timbre: 清亮的少年声, pace: 自然稍快, pitch: 中高}}
    well-keeper: {display_name: 石伯, tts: {delivery: 实在耐心，说话直接，也坦然承认不知道, timbre: 低沉略带风霜, pace: 从容, pitch: 低}}
    worker: {display_name: 修农机的人, tts: {delivery: 劳作后的急躁和戒备, timbre: 朴实略粗, pace: 偏快, pitch: 中}}
    shop-owner: {display_name: 周叔, tts: {delivery: 起初冷硬防备，后来务实坦率, timbre: 厚实粗粝, pace: 稳健, pitch: 中低}}
  chapters:
    - id: ch01
      title: 空桶的闷响
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: |-
            井桶落到底，听见的不是“扑通”，而是“咚”的一声。

            阿满还攥着辘轳把手。麻绳在木轴上抖了抖，井口冒着凉气，下面却一点水声也没有。后头排着的铁桶、塑料壶、搪瓷盆，一下全安静了。
        - {id: ch01-b02, speaker: worker, text: 再放一点。}
        - id: ch01-b03
          speaker: narrator
          text: |-
            阿满又松了半圈。井桶擦过石壁，还是“咚”。石伯从人群后头挤过来，把草帽推到脑后，接过绳子慢慢提。桶里只有浅浅一层浑水，一片枯叶在水面打转。
        - {id: ch01-b04, speaker: well-keeper, text: 今天每家少打半桶。}
        - {id: ch01-b05, speaker: child, text: 那片叶子怎么跑到井底去了？}
        - {id: ch01-b06, speaker: well-keeper, text: 从井口掉下去的。}
        - {id: ch01-b07, speaker: child, text: 那水呢？}
        - {id: ch01-b08, speaker: narrator, text: 石伯用手背抹掉桶沿的泥。}
        - {id: ch01-b09, speaker: well-keeper, text: 这个问题大。先让后面的人打水。}
        - id: ch01-b10
          speaker: narrator
          text: |-
            可阿满没走。他答应母亲打满两桶，午后还要泡豆子，现在第二桶才装了一半。回家时，扁担一头轻、一头重，桶里的水晃得特别响，像一路都在提醒他：还差多少。

            第二天刚亮，石伯来敲窗。阿满还以为井里涨水了，结果老人肩上扛着铁钎，腰间挂着卷尺和一只豁口白瓷缸。
        - {id: ch01-b11, speaker: well-keeper, text: 不是想找水吗？鞋穿牢。}
        - id: ch01-b12
          speaker: narrator
          text: |-
            他们先到井边。石伯放下一根系着铁坠的细绳。听见铁坠碰到水，他就在井沿掐住绳子。阿满拉直卷尺，读出刻度。石伯把数写在烟盒背面，又翻出前几天的记录。那一排数字像往下走的脚印，一天比一天深。
        - {id: ch01-b13, speaker: child, text: 井是不是个大缸？让我们给喝空了？}
        - {id: ch01-b14, speaker: narrator, text: 阿满趴在青石井沿上，往黑洞洞的下面看。}
        - {id: ch01-b15, speaker: well-keeper, text: 要真是口缸，早喝空了。井只是伸进地下水里的一个口。地下什么样，我也没长透视眼。走，先看地面。}
    - id: ch02
      title: 水怎么走
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: |-
            村东的河瘦成了一条断断续续的亮线。旧石桥下，淤泥裂开，缝里卡着白色螺壳。阿满在干河床上走得飞快，忽然脚下一凉，水渗进了鞋帮。芦苇后头，湿沙不停冒出细小的亮点。

            石伯用瓷缸舀开浮泥，清水又一点点聚了回来。
        - {id: ch02-b02, speaker: child, text: 泉眼？}
        - {id: ch02-b03, speaker: well-keeper, text: 算是一处渗水。地下水碰到不容易穿过去的土和石头，可能就顺着上面的缝往旁边走，再从低处露出来。不过，别把它想成地底下藏着一条大河。}
        - {id: ch02-b04, speaker: narrator, text: 石伯一边说，一边把铁钎探进沙里。阿满还是不服气。}
        - {id: ch02-b05, speaker: child, text: 水都不成河，那它怎么走？}
        - id: ch02-b06
          speaker: narrator
          text: |-
            石伯装来一缸粗沙，又挖了一块黄褐色黏土，让阿满同时往上倒水。沙里的水很快从缸底滴下来，黏土上的水却摊成一汪，在太阳下发亮。

            阿满抓起湿沙。指缝里没有水流，掌心倒是凉透了。
        - {id: ch02-b07, speaker: well-keeper, text: 石头和沙的空隙能存水，也能让水慢慢过去。这缸沙只能看个大概。地下有几层、往哪边斜，得打孔、量水位，有时还得请懂地质的人来。只靠眼睛猜，不够。}
        - id: ch02-b08
          speaker: narrator
          text: |-
            他们沿河往上游走。太阳越升越高，石头烫脚，蝉声像从树皮里钻出来。阿满本以为会找到一个黑洞，水从里头轰隆隆流向老井。可走了半天，只看到松软的砂砾、发红的坡土、雨后冲出细沟的田埂，还有山脚那道长着青苔、往外渗水的岩缝。
        - {id: ch02-b09, speaker: child, text: 去年的雨，都在下面吗？}
        - {id: ch02-b10, speaker: well-keeper, text: 有些进了河，有些让树和庄稼用了，有些晒回天上，只有一部分往下渗。渗下去也不一定到咱们井里。地下水走得慢，路还绕。}
        - {id: ch02-b11, speaker: narrator, text: 石伯停下来喘了口气。}
        - {id: ch02-b12, speaker: child, text: 那下一场雨，井就能满了？}
        - {id: ch02-b13, speaker: well-keeper, text: 我不敢答应。}
        - id: ch02-b14
          speaker: narrator
          text: |-
            这是石伯那天说得最干脆的一句话。阿满原以为，修了三十年井的人什么都知道。听见这句“不敢答应”，他反而更认真地看起烟盒上的线：山坡、砂砾层、不容易透水的黏土，还有一口只伸到湿层里的井。线画得歪歪扭扭，可雨落到坡上以后，确实有了好几条不同的去路。
    - id: ch03
      title: 不拿井水冒险
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: |-
            回村时，他们在废砖窑旁闻到一股刺鼻的柴油味。坡脚洼地里，几只破桶倒在杂草中。黑油顺着旧雨冲出的沟痕，一直流到砂砾地边上。两个修农机的人，正准备把一盆灰水泼下去。石伯紧走几步。
        - {id: ch03-b02, speaker: well-keeper, text: 别往这儿倒。}
        - {id: ch03-b03, speaker: worker, text: 这离井远着呢。, emotion: angry}
        - {id: ch03-b04, speaker: well-keeper, text: 地面上远，不等于地下不通。}
        - {id: ch03-b05, speaker: worker, text: 你看见它通了？}
        - {id: ch03-b06, speaker: narrator, text: 石伯没像平常那样马上顶回去。他蹲下来，抓起一把砂砾。油味粘在了手指上。}
        - {id: ch03-b07, speaker: well-keeper, text: 没看见。所以更不能拿全村的水来试。得请人查。今天先把这盆留下。}
        - id: ch03-b08
          speaker: narrator
          text: |-
            那人看看太阳，又看看满满一盆脏水，嘴里嘟囔了几句，还是把盆端回棚里。阿满盯着石伯沾油的手。老人明明承认不知道，可他的脚一步也没往后退。
    - id: ch04
      title: 把“可能”写下来
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: |-
            午后，阿满把烟盒上的图重新画到一块旧木板上，拿去井边给大家看。有人说砖窑用了几十年也没出事；也有人说眼下最要紧的是旱，别再添麻烦。修农机的周叔抱着胳膊站在人群外，脸色最难看。
        - {id: ch04-b02, speaker: shop-owner, text: 不让我们洗零件，这活还怎么干？, emotion: angry}
        - id: ch04-b03
          speaker: narrator
          text: 阿满昨晚想了一串漂亮话，可现在一句也说不出来。他看见周叔指甲缝里的黑油，也看见周叔家门口同样摆着两个空水桶。
        - {id: ch04-b04, speaker: well-keeper, text: 不是不让干。洗油水接起来，送到镇上的回收点。坡上漏桶先挪走。我们出车，你们出手，行不行？}
        - {id: ch04-b05, speaker: worker, text: 车钱谁出？}
        - id: ch04-b06
          speaker: narrator
          text: |-
            人群又吵起来。最后，卖豆腐的婶婶拿来账本，每户按自己能出的数凑一点。周叔找带盖的大桶。阿满和几个孩子，只能在没有油污的上坡捡塑料和碎砖，谁也不许碰黑泥。

            这事不像胜利，也不像庆典。太阳晒得厉害，破桶又沉。有只桶刚一抬，桶底就漏了，大家只好重新找盆接住。

            三天后，镇里的技术员来了。他看地形，量水位，又取走水样。他说，这里可能是浅层地下水接受雨水的一片地方。不过地下结构还得继续查，不能凭一张图下结论。石伯当着大家的面点点头，把木板翻过来，在背面写下两个字：可能。
    - id: ch05
      title: 雨没有按人的钟走
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: |-
            第七天夜里，雨终于来了。第一滴雨砸上屋瓦，阿满就从床上坐起来。转眼间，屋檐连成水帘，院子里涌起干土遇水的气味。他冲到门口，看见雨水顺着石板往巷口跑。坡上的浅草沟拦住一部分急水，水在草根间慢下来，里头的泥也一点点沉下去。

            阿满撑伞跑到井边。石伯早就在那儿，正拿手电照着井绳。
        - {id: ch05-b02, speaker: child, text: 现在量吗？}
        - {id: ch05-b03, speaker: well-keeper, text: 现在量，也不会马上变成满井。把今天记下来，以后接着量。}
        - id: ch05-b04
          speaker: narrator
          text: |-
            石伯的声音被大雨打得断断续续。他们把铁坠放下去。细绳越过湿淋淋的井沿，一寸一寸沉进黑暗。过了很久，下面才传来轻轻一声。那不是空桶撞石头的“咚”，只像一粒水碰到了另一片水。

            石伯掐住绳子。阿满举起手电，让他看清卷尺上的刻度，再把这一格数字记下来。

            第二天早上，数字还是没什么变化。有人叹气，有人说昨晚的雨白下了。阿满合上红皮本，没有争。石伯让他摸井沿外侧。石头已经晒热，石缝里却还留着一点潮气。
        - {id: ch05-b05, speaker: child, text: 水没白下。它只是没按我们的钟走。}
        - {id: ch05-b06, speaker: well-keeper, text: 这句可以记。可别把它写成保证。}
        - id: ch05-b07
          speaker: narrator
          text: |-
            接下来十天，阿满每天同一时辰来量。母亲也把家里用水的数交给他记：洗豆子的水留着冲院角，淘米水浇门外那棵蔫石榴。

            可母亲不准他说“省水是个游戏”。少做一锅豆腐，家里就少一笔收入。第五天，卖豆腐的婶婶来借水，母亲推给她半桶，晚上却看着没泡完的豆子发愁。阿满这才懂：井里的刻度不是一道题，它会走进每家的锅，也会走进账本。

            周叔的棚子也安静了两天。没有合适的收集桶，他不敢再洗零件。两个等着修水泵的人转去了镇上。后来他在井边碰见阿满，冷着脸点了点那张图。
        - {id: ch05-b08, speaker: shop-owner, text: 你这张图，能替我赔钱吗？, emotion: angry}
        - {id: ch05-b09, speaker: narrator, text: 阿满想往石伯身后躲。可石伯正低头检查井盖，像没听见。阿满只能自己回答。}
        - {id: ch05-b10, speaker: child, text: 不能。五金车周四才来。我去问学校，看能不能先借几个有盖的桶。, emotion: fearful}
        - {id: ch05-b11, speaker: shop-owner, text: 借来了，谁洗？}
        - {id: ch05-b12, speaker: child, text: 我不能碰油。不过，我能挨家告诉大家车什么时候来。}
        - id: ch05-b13
          speaker: narrator
          text: |-
            周叔哼了一声，没说行，也没说不行。阿满下午跑了七户人家。有人嫌他多事，也有人答应抬桶。母亲把一双厚手套放在门边，只说：成年人用。

            周四，五金车空着半边车厢回来。周叔亲手把封好的废液桶推上跳板，石伯和司机一边一个扶稳。这一回，桶底没再滴出黑线。
    - id: ch06
      title: 给下一次测量留白
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: |-
            技术员第二次来，带回水样的初步结果。眼下没有证据说明油污进了井。可只取一次样，也不能保证以后永远安全。那片坡地是不是主要补给区，还得结合更多水位和地层资料判断。

            有人松了口气，马上问旧桶能不能搬回去。周叔先开了口。他脱下手套，掌心已经捂得发白。
        - {id: ch06-b02, speaker: shop-owner, text: 为什么非得等到看见油？新桶留在棚里，旧桶送走。车费我出一半，剩下一半，谁装了东西谁来分。}
        - id: ch06-b03
          speaker: narrator
          text: |-
            村里没有把整座山围起来。技术员说，水从哪里来还没查清，不能凭想象画一道神奇的边界。大家先清走漏桶，把洗油水装进带盖容器，不在井边倒污水；再修好通往砖窑的排水沟，在干净的裸地种本地草，让暴雨少带走些泥。孩子只捡干净垃圾，沾油的土留给戴防护用具的成年人。

            阿满原来最想要一张答案图。现在，红皮本里有了好几种线：实线记水位，虚线画还要调查的地下路径，弯线记雨水在坡上怎么跑。线越多，他反而越不急着把哪一条涂黑。

            第十一天，井水比雨夜高了一点。石伯量一遍，又让阿满量一遍。两次数一样，他们才记下来。没人说这一定是那场雨直接送来的水，也没人保证井以后不会再低。母亲看过数字，只给第二天泡豆子的水多添了一瓢。

            入秋前，又下了两场不急不猛的雨。草先被压倒，后来又在沟边站起来。干河床还是大片白石，可倒木下的渗水宽了一掌。阿满和石伯沿老路复查，周叔也跟着，背了取样瓶和午饭。
        - {id: ch06-b04, speaker: shop-owner, text: 那天你们要是没来，我大概已经把那盆水泼了。}
        - {id: ch06-b05, speaker: well-keeper, text: 我们要是装得什么都知道，你也不会信。}
        - {id: ch06-b06, speaker: shop-owner, text: 我现在也没全信。}
        - {id: ch06-b07, speaker: child, text: 那就接着量。}
        - id: ch06-b08
          speaker: narrator
          text: |-
            阿满把空瓶递给周叔。

            水不是从一个洞里猛地涌出来的。它先让几粒沙颜色变深，再在小石子之间连成薄薄一片，最后才一点点积进瓶口。阿满想起旱天早晨那只触底的空桶。那时，他把井想成藏在地下的一口缸，急着找出是谁把水喝空了。现在，井还是没有交出一条清楚的地下河。它交出来的，是许多又慢又小的证据。

            冬天前，技术员把水位、地形和地层资料放在一起，圈出一片需要优先保护、继续调查的坡地。圈线穿过周叔棚后的一角。周叔把清洗台搬到有硬底、有棚顶、能接住废水的地方。阿满搬不动台子，就把散落的螺帽一颗颗捡进盒里。

            井边还是每月量水位。夏天的配水规矩没有马上取消，直到雨多了才慢慢放宽。阿满有时写错日期，石伯让他划掉重写，不准凭记忆补数。石伯也会猜错。有一回，他猜渗水先涨，结果老井先动。他把猜测圈起来，旁边写着：猜错，留着。

            来年第一场春雨后，阿满一个人来到井边。他已经能稳稳放下测绳。铁坠穿过井口的凉气，细线在手里一寸一寸往下滑。远处，周叔棚顶的雨水落进草沟；坡上的新草压住了泥；桥下那片渗水，把一小片沙染成深褐色。

            井底传来轻轻一响。

            阿满掐住细线，在红皮本上记下刻度。他没急着画箭头，只在日期后面，留了半页空白。
