schema_version: 1
id: where-the-well-water-comes-from
category: fiction
genre: narrative-science
style: watercolor-gouache
labels: {topics: [science, nature, everyday-life], themes: [curiosity, discovery, responsibility], moods: [adventurous, hopeful]}
research: required
premise: >
  干旱的夏天，村里老井的水位下降。一个孩子想知道井水到底从哪里来，
  跟着一位修井的长辈观察雨水渗入土层、泉眼、河床和岩缝，
  逐步弄明白地下水（含水层）是怎样慢慢补充和流动的。
  最后大家为保护补给区做了一件具体的事。所有科学内容必须准确、可查。
characters:
  - {id: child, description: 爱追问的孩子，主角}
  - {id: well-keeper, description: 修井多年的长辈，说话实在，也会承认不知道}
locales:
  zh-CN: {writer: 铜罗盘, working_title: 井水从哪里来, length: 3000-4500 字}
  en-US: {writer: brass-compass, working_title: Where the Well Water Comes From, length: 2000-3000 words}
picture_books:
  - {level: f, volumes: 2}
  - {level: k, volumes: 2}
cover_prompt: >-
  A wordless wide scene at an old stone village well during a dry summer dawn. A curious ten-year-old Chinese child named Aman, with short black hair, a faded teal shirt, rust-red shorts, canvas shoes, and a small red field notebook, leans over the circular gray-stone well while elderly well repairer Uncle Shi, lean with a weathered face, gray cropped hair, straw hat, indigo work shirt, brown trousers, and a coiled measuring tape, lowers a weighted line into the cool darkness. Villagers with buckets wait in soft focus; beyond them a dry creek, a gravelly hill, and one green seep connect the landscape. The line and the child's intent gaze are the focal action. No cutaway diagram and no visible writing, text, letters, numbers, signs, logos, captions, speech bubbles, signature, or watermark.
