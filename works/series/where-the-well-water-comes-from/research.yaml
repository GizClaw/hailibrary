schema_version: 1
required: true
sources:
  - url: https://www.usgs.gov/faqs/what-determines-if-a-well-will-go-dry
    authority: U.S. Geological Survey
    claims:
      - A well can stop yielding water when the groundwater level falls below its intake.
      - Water level depends on well depth, aquifer type, pumping, and recharge; shallow water-table wells respond more directly to lack of rain.
  - url: https://pubs.usgs.gov/gip/gw/how_b.html
    authority: U.S. Geological Survey
    claims:
      - Groundwater is stored and transmitted through connected pore spaces and fractures rather than necessarily in underground rivers.
      - Sand, gravel, and fractured consolidated rock can yield water when openings are sufficiently connected.
  - url: https://www.epa.gov/sourcewaterprotection/source-water-protection-practices
    authority: U.S. Environmental Protection Agency
    claims:
      - Protecting drinking-water sources includes preventing contamination and using site-specific assessment and management practices.
  - url: https://www.usgs.gov/special-topic/water-science-school/science/groundwater-discharge-and-water-cycle
    authority: U.S. Geological Survey Water Science School
    claims:
      - Some precipitation infiltrates the ground and becomes groundwater when it reaches the saturated zone.
      - Groundwater moves through pores and fractures under gravity and pressure, generally much more like water through a sponge than an underground river.
      - Less-permeable rock or soil can redirect groundwater sideways toward springs, streams, or deeper ground.
  - url: https://www.usgs.gov/water-science-school/science/water-science-glossary
    authority: U.S. Geological Survey Water Science School
    claims:
      - Recharge is water added to an aquifer, including rainfall that seeps into the ground.
      - A water well is an excavation made to reach underground water supplies.
  - url: https://pubs.usgs.gov/circ/2002/circ1224/html/understanding.html
    authority: U.S. Geological Survey
    claims:
      - Recharge enters an unconfined aquifer at the water table and can move through the groundwater system toward discharge areas such as streams.
      - Surface contamination in a recharge area can be carried along groundwater flow paths toward wells.
notes: >
  The village, drought, old well, characters, spring, clay test, and cleanup conflict are fictional.
  The story uses a simplified shallow unconfined aquifer model and does not claim that every well has
  the same source, travel time, geology, or response to one storm. The late rain is not presented as an
  immediate refill of the well; recharge can be slow and locally variable. The specific abandoned wash
  area is fictional, but keeping pollutants away from a contributing recharge area reflects the cited risk.
