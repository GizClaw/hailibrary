audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 叙述者
      tts:
        delivery: 温柔亲切，带着轻盈的童谣感
        timbre: 清澈温暖
        pace: 舒缓
        pitch: 中音
    phillis:
      display_name: 小菲利丝
      tts:
        delivery: 天真爽快，像年幼的孩子认真招待客人
        timbre: 稚嫩明亮
        pace: 轻快
        pitch: 高音
  chapters:
    - id: ch01
      title: 我的名字
      blocks:
        - id: ch01-b01
          speaker: phillis
          text: 我年纪还很小，大概刚刚两岁。你想知道我叫什么吗？那我就告诉你吧。
        - id: ch01-b02
          speaker: phillis
          text: 人人都喊我“小宝宝”，其实我叫菲利丝。这个名字可不是谁送给我的。我猜呀，它自己就这么来了。
    - id: ch02
      title: 郁金香和小猫
      blocks:
        - id: ch02-b01
          speaker: phillis
          text: 我的小花坛里开着一朵郁金香，可漂亮了。你要是喜欢，我就把它送给你。它是黄色的，上面还有一道道红条纹。
        - id: ch02-b02
          speaker: phillis
          text: 不过，我那只小猫可不能送给你。它最爱跟我一起玩，只是今天已经睡着了。
    - id: ch03
      title: 我的新娃娃
      blocks:
        - id: ch03-b01
          speaker: phillis
          text: 我还有一个漂亮的新娃娃。要不要我抱出来给你看看？她穿着一双特别好看的鞋，小帽子上还饰着蓝色花边。
        - id: ch03-b02
          speaker: phillis
          text: 你想把她带回家吗？那可不行，她不能跟你走。再见啦，我要跑起来了！谁叫你走得这么慢。
