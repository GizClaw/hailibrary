audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm and gently observant
        timbre: clear and tender
        pace: unhurried
        pitch: medium
    phillis:
      display_name: Phillis
      tts:
        delivery: bright, direct, and proudly conversational
        timbre: small and youthful
        pace: lively
        pitch: high
  chapters:
    - id: ch01
      title: My Name Is Phillis
      blocks:
        - id: ch01-b01
          speaker: phillis
          text: I'm a very little girl. I think I'm two now. Would you like to know my name? I'll tell you. Everyone calls me Baby, but my name is Phillis. No, nobody gave me that name. I think it just came!
    - id: ch02
      title: My Tulip and Kitten
      blocks:
        - id: ch02-b01
          speaker: phillis
          text: There's a pretty tulip in my little flower bed. It's yellow with red stripes. Would you like it? I'll give it to you. I have a little kitten, too, but I can't give her away. She loves playing with me so much. Today she's gone to sleep.
    - id: ch03
      title: My New Dolly
      blocks:
        - id: ch03-b01
          speaker: phillis
          text: And I have a lovely new dolly. Shall I bring her out for you? Her shoes are so pretty, and her bonnet has blue trim. Would you like to take her home with you? Oh, no! She can't go. Goodbye! I want to run now. You walk so slowly.
