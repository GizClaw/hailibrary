audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 叙述者
      tts:
        delivery: 天真轻柔，带着童谣般的遐想
        timbre: 清澈温暖
        pace: 舒缓
        pitch: 中音
  chapters:
    - id: ch01
      title: 要是我们换一换
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 要是你成了小男孩，我成了小姑娘，你会慢慢长出小胡子，我的头发呢，也会卷成波浪。
    - id: ch02
      title: 胡子换卷发
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 要是我也能长出小胡子，我就把自己的卷发送给你。
    - id: ch03
      title: 心愿只是心愿
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 可光是这样许愿，又有什么用呢？男孩终究变不成女孩。
