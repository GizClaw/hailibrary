audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm and gently ceremonial
        timbre: clear and tender
        pace: unhurried
        pitch: medium
    first_child:
      display_name: First Child
      tts:
        delivery: playful and full of wonder
        timbre: clear and youthful
        pace: lightly animated
        pitch: medium-high
    second_child:
      display_name: Second Child
      tts:
        delivery: thoughtful with a teasing warmth
        timbre: soft and youthful
        pace: easy
        pitch: medium
  chapters:
    - id: ch01
      title: Wishes
      blocks:
        - id: ch01-b01
          speaker: first_child
          text: Oh, what if you were a little boy, and I were a little girl? Then you'd grow whiskers, and my hair would curl.
        - id: ch01-b02
          speaker: second_child
          text: Ah, if only I could grow whiskers! I'd give you my curls. But wishing won't change it. Boys can never be girls.
