audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm and gently observant
        timbre: clear and tender
        pace: unhurried
        pitch: medium
    king:
      display_name: King
      tts:
        delivery: friendly and matter-of-fact
        timbre: rich and clear
        pace: measured
        pitch: medium-low
    queen:
      display_name: Queen
      tts:
        delivery: gracious and conversational
        timbre: bright and smooth
        pace: measured
        pitch: medium
  chapters:
    - id: ch01
      title: A Summer Ride
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: One summer day, the King and Queen went riding together. A Blackbird flew above them, listening to their talk.
    - id: ch02
      title: Apples and Pears
      blocks:
        - id: ch02-b01
          speaker: king
          text: I like apples.
        - id: ch02-b02
          speaker: queen
          text: I like pears.
    - id: ch03
      title: The Listening Blackbird
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: But what should they do about the Blackbird, who listened without their knowing?
