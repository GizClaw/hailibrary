audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 叙述者
      tts:
        delivery: 温柔而郑重，像在亲手题赠一本书
        timbre: 清澈温暖
        pace: 舒缓
        pitch: 中音
  chapters:
    - id: ch01
      title: 惊奇的眼睛
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 小男孩，你惊奇的眼睛，目光多么温柔。
    - id: ch02
      title: 高贵的名字
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 两个高贵的名字，让我心怀敬意。
    - id: ch03
      title: 赠给你的书
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 我把这本书当作礼物送给你。
