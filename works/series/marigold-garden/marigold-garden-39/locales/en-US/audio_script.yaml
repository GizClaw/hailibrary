audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm and gently observant
        timbre: clear and tender
        pace: unhurried
        pitch: medium
    jumping_girl_1:
      display_name: First Jumping Girl
      tts:
        delivery: bright and playfully adventurous
        timbre: clear and youthful
        pace: lively
        pitch: medium-high
    jumping_girl_2:
      display_name: Second Jumping Girl
      tts:
        delivery: eager and spirited
        timbre: light and youthful
        pace: lively
        pitch: high
    jumping_girl_3:
      display_name: Third Jumping Girl
      tts:
        delivery: cheerful and boldly imaginative
        timbre: warm and youthful
        pace: lively
        pitch: medium-high
  chapters:
    - id: ch01
      title: Away We Go
      blocks:
        - id: ch01-b01
          speakers: [jumping_girl_1, jumping_girl_2, jumping_girl_3]
          ensemble: chorus
          text: Jump, jump, jump! Let's leave this town and jump into the next one today.
        - id: ch01-b02
          speakers: [jumping_girl_1, jumping_girl_2, jumping_girl_3]
          ensemble: chorus
          text: Jump, jump, jump! Let's leap over the moon and keep going all morning and all afternoon.
    - id: ch02
      title: All Night and Over the Sea
      blocks:
        - id: ch02-b01
          speakers: [jumping_girl_1, jumping_girl_2, jumping_girl_3]
          ensemble: chorus
          text: Jump, jump, jump! We'll go all night. Won't our mothers be frightened?
        - id: ch02-b02
          speakers: [jumping_girl_1, jumping_girl_2, jumping_girl_3]
          ensemble: chorus
          text: Jump, jump, jump! Let's cross the sea. What wonderful wonders we'll see!
    - id: ch03
      title: Home Some Other Day
      blocks:
        - id: ch03-b01
          speakers: [jumping_girl_1, jumping_girl_2, jumping_girl_3]
          ensemble: chorus
          text: Jump, jump, jump! Let's go far away and leave every evil thing behind.
        - id: ch03-b02
          speakers: [jumping_girl_1, jumping_girl_2, jumping_girl_3]
          ensemble: chorus
          text: Jump, jump, jump! We'll all come home some other day.
