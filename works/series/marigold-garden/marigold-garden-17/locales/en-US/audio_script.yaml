  chapters:
    - id: ch01
      title: In an Apple Tree
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: It was September, and the apples were red. I asked Belinda, "Would you rather go away to Heaven, or stay here in this orchard full of trees for the rest of your life?"
        - id: ch01-b02
          speaker: belinda
          text: "If you please, I'll stay here, where I know the place and the flowers grow."
