audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 叙述者
      tts:
        delivery: 温柔又若有所思，带着轻盈的童谣韵律
        timbre: 清澈柔和
        pace: 舒缓
        pitch: 中音
    belinda:
      display_name: 贝琳达
      tts:
        delivery: 温和笃定，带着孩子般的坦然
        timbre: 轻柔清亮
        pace: 从容
        pitch: 中高音
  chapters:
    - id: ch01
      title: 苹果树上
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 九月到了，树上的苹果都红了。我问贝琳达：“你愿意离开这儿，到天堂去吗？还是愿意一辈子留在这座长满树木的果园里？”
        - id: ch01-b02
          speaker: belinda
          text: “要是可以，我就留在这儿。这地方我熟悉，花儿也在这儿长。”
