audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm and gently observant
        timbre: clear and tender
        pace: unhurried
        pitch: medium
    cowslip:
      display_name: Cowslip
      tts:
        delivery: light and wondering
        timbre: soft and delicate
        pace: relaxed
        pitch: medium-high
    butterfly:
      display_name: Butterfly
      tts:
        delivery: bright and delighted
        timbre: airy and clear
        pace: easy
        pitch: high
  chapters:
    - id: ch01
      title: Maytime in the Meadow
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Flowers grow in May, and little girls go through the meadows. Little lambs frisk with delight, then sleep in the green grass at night.
    - id: ch02
      title: Bright Days and Starry Nights
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: Little birds sing happily all day long. The sun shines bright all day, and little stars shine all night.
    - id: ch03
      title: Flower Town
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: The Cowslip says to the Primrose,
        - id: ch03-b02
          speaker: cowslip
          text: How softly the little spring wind blows!
        - id: ch03-b03
          speaker: narrator
          text: Daisy and Buttercup sing each time they look up. Beneath the sweet blue sky, they see a pretty Butterfly. When he looks down, he says,
        - id: ch03-b04
          speaker: butterfly
          text: What a pretty Flower Town!
