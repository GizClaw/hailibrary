audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 叙述者
      tts:
        delivery: 温柔活泼，带着惊奇和童谣般的起伏
        timbre: 清澈柔和
        pace: 轻快
        pitch: 中音
    cat_1:
      display_name: 猫儿甲
      tts:
        delivery: 礼貌又兴奋，叫声轻巧
        timbre: 明亮清脆
        pace: 轻快
        pitch: 中高音
    cat_2:
      display_name: 猫儿乙
      tts:
        delivery: 热情亲切，带着俏皮的猫叫腔调
        timbre: 柔软圆润
        pace: 轻快
        pitch: 中音
    cat_3:
      display_name: 猫儿丙
      tts:
        delivery: 欢快有礼，语气天真
        timbre: 细亮轻盈
        pace: 轻快
        pitch: 高音
  chapters:
    - id: ch01
      title: 猫儿们来了
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 她靠着树，究竟瞧见了什么？哎呀，原来所有的猫儿都来喝茶啦！
        - id: ch01-b02
          speaker: narrator
          text: 这场面可真热闹。附近家家户户都让猫儿出了门。它们从四面八方奔过来，又跑又叫。
    - id: ch02
      title: 喵喵问好
      blocks:
        - id: ch02-b01
          speakers: [cat_1, cat_2, cat_3]
          ensemble: chorus
          text: 喵——喵——喵！愿您今天过得好！
        - id: ch02-b02
          speaker: narrator
          text: 猫儿们只会这样向她问好。这下她该怎么办呢？这么多猫儿，会喝掉多少牛奶呀！可它们已经全来了，还在一个劲儿地喵喵叫。
    - id: ch03
      title: 茶点怎么办
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 她拿不准，猫儿们爱不爱吃抹了黄油的面包。说不定，它们想吃的是小老鼠呢。哎哟，哎哟，哎哟！
        - id: ch03-b02
          speaker: narrator
          text: 我的天哪，真叫人没办法。猫儿们全都来喝茶啦！
