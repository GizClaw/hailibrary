audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm and gently observant
        timbre: clear and tender
        pace: unhurried
        pitch: medium
  chapters:
    - id: ch01
      title: A Child from Wonder World
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: I think you must have come from Wonder World, because you carry its wonder in your eyes. The stars are Heaven's windows, and sometimes I imagine you peeking through them.
    - id: ch02
      title: Secrets We Cannot Hear
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: Oh, little girl, tell us. When the Flowers find you all alone, do they share their secrets with you? Do the Birds and Butterflies whisper about things that we don't know?
    - id: ch03
      title: What You Hear and Feel
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: Or do angels speak to you in voices so soft that we hear only a little wind sighing? Does Heaven's peaceful dew fall over you while we see nothing but a white cloud passing by?
