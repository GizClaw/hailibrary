audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 叙述者
      tts:
        delivery: 温柔而充满遐想，像轻声问一个来自奇妙世界的孩子
        timbre: 清澈柔和
        pace: 舒缓
        pitch: 中音
  chapters:
    - id: ch01
      title: 眼中的奇妙世界
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 小姑娘，我常想，你来自奇妙世界。你眼里的光，仿佛也带来了那里的奇妙。星星像天国的一扇扇窗。有时我猜，你正从窗口里偷偷望着我们。
    - id: ch02
      title: 花鸟的秘密
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 当你独自一人时，花儿会不会悄悄把秘密告诉你？鸟儿和蝴蝶会不会低声说起那些我们从不知道的事？
    - id: ch03
      title: 天国的低语
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 也许，天使正轻轻对你说话，我们听见的却只有小风叹息。也许，天国宁静的露珠正落在你身上，我们看见的却只是一朵白云缓缓飘过。
