audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 叙述者
      tts:
        delivery: 亲切轻快，带着童谣般自然的问答节奏
        timbre: 清亮温暖
        pace: 舒缓
        pitch: 中音
  chapters:
    - id: ch01
      title: 问候苏珊
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 苏珊·布卢，你好吗？我能和你一起散步吗？
    - id: ch02
      title: 去哪儿呢
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 去哪儿呢？啊，我知道啦！
    - id: ch03
      title: 草甸上的花
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 去草甸吧，那里开着黄花九轮草！
