audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 叙述者
      tts:
        delivery: 温柔而充满遐想，结尾带一点怅然
        timbre: 清澈温暖
        pace: 舒缓
        pitch: 中音
  chapters:
    - id: ch01
      title: 遥望太阳
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 清晨，孩子们看着太阳升起。夜里，又看着它落下。他们多想走近瞧瞧。唉，要是真能去，该多好啊。
    - id: ch02
      title: 白云来接
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 柔柔的小白云听见了，便从蓝天里飘出来。每朵云接上一个孩子，轻轻托在盛着露珠的胸前。
    - id: ch03
      title: 圆圆的金门
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 白云托着他们越升越高。后来，孩子们什么也不知道了。等他们回过神来，已经站在圆圆的金门前等着。
    - id: ch04
      title: 门没有开
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 他们敲门、呼唤，恳求里面不管是谁都放他们进去。可是全没用，门里始终没人理会，也没人肯开门。
