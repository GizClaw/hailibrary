audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm and gently ceremonial
        timbre: clear and tender
        pace: unhurried
        pitch: medium
  chapters:
    - id: ch01
      title: Watching the Sun
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Each morning, the children watched the sun rise. Each night, they watched it set. Oh, how they longed to go and see it, if only they could!
    - id: ch02
      title: The Soft White Clouds
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: The soft white clouds heard their wish and stepped out of the blue. Each one gently laid a child upon its dewy breast.
    - id: ch03
      title: The Round Gold Door
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: Up and up the clouds carried them. The children knew nothing more until they stood waiting before a round gold door.
    - id: ch04
      title: Waiting Outside
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: They knocked. They called out. They begged whoever might be inside to answer. But it was no use. No one listened, and no one let them in.
