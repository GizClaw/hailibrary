audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 叙述者
      tts:
        delivery: 温柔亲切，带着好奇与童谣般的韵律
        timbre: 清澈柔和
        pace: 舒缓
        pitch: 中音
  chapters:
    - id: ch01
      title: 遥望天空
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 小姑娘，告诉我。你蓝眼睛里若有所盼，看见了什么？为什么总爱站得那么高，望着远方的天空？
    - id: ch02
      title: 蓝天与月亮
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 小仙子是不是正在美丽的蓝天里轻轻飞过？还是你盼着金黄的月亮快快升起？
    - id: ch03
      title: 等候小鸟
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 也许真像我听说的，你在等一只小鸟。等它飞上枝头，唱过整个夏夜。你等的是它吗？
