audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm and gently observant
        timbre: clear and tender
        pace: unhurried
        pitch: medium
  chapters:
    - id: ch01
      title: My Little Girlie
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Little girlie, tell me. What do your wistful blue eyes see? Why do you stand so high, gazing into the far-off sky?
        - id: ch01-b02
          speaker: narrator
          text: Is there a tiny fairy flitting through all that pretty blue? Or are you hoping the yellow moon will rise soon?
        - id: ch01-b03
          speaker: narrator
          text: Or could it be what I think I've heard? Are you watching for a little bird to perch upon a branch and sing all through the summer night?
