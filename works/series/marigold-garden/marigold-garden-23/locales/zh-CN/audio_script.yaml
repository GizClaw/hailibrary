audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 叙述者
      tts:
        delivery: 亲切明快，带着轻盈的童谣感
        timbre: 清澈柔和
        pace: 舒缓
        pitch: 中音
    girl_1:
      display_name: 女孩甲
      tts:
        delivery: 天真爽朗，话里带着期待
        timbre: 清亮稚嫩
        pace: 轻快
        pitch: 中高音
    girl_2:
      display_name: 女孩乙
      tts:
        delivery: 活泼热情，越说越兴奋
        timbre: 明亮甜润
        pace: 轻快
        pitch: 中高音
  chapters:
    - id: ch01
      title: 下星期的生日会
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 两个女孩说起了下星期的生日会。
        - id: ch01-b02
          speaker: girl_1
          text: 你下星期会去看菲莉丝和菲比吗？星期一，菲莉丝正好满十四岁。她说大家要在花园里喝茶，喝完了还可以到草地上好好玩游戏。
        - id: ch01-b03
          speaker: girl_1
          text: 我本来想要一条新裙子，可妈妈不肯，所以只好穿原来那条。不过白裙子也挺漂亮的，玛蒂尔达姨妈还特意寄给我一串漂亮的项链呢。
    - id: ch02
      title: 新裙子和鲜花
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 另一个女孩马上接过了话。
        - id: ch02-b02
          speaker: girl_2
          text: 我当然会去，佩吉也去。妈妈正在给我们做新裙子。到时候，我要系上红腰带，再戴那顶有粉红缎带的帽子。去参加生日会的姑娘们，肯定都会打扮得漂漂亮亮。
        - id: ch02-b03
          speaker: girl_2
          text: 我们还说好了，每个人都带一大束花，花束越大越好。那些芬芳的花会替我们告诉菲莉丝，朋友们都爱她，也都盼着她在生日这天快快乐乐。
    - id: ch03
      title: 苹果树下的茶会
      blocks:
        - id: ch03-b01
          speaker: girl_2
          text: 那天阳光灿烂，一定美极了。大苹果树下摆好茶桌，亲爱的菲莉丝一边给大家倒茶，一边笑着望向每一个人。你想想，那该有多好呀！
