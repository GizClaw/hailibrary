audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm and gently observant
        timbre: clear and tender
        pace: unhurried
        pitch: medium
    girl_1:
      display_name: First Girl
      tts:
        delivery: bright and conversational
        timbre: clear and youthful
        pace: lively
        pitch: medium-high
    girl_2:
      display_name: Second Girl
      tts:
        delivery: cheerful and animated
        timbre: light and youthful
        pace: lively
        pitch: medium-high
  chapters:
    - id: ch01
      title: The Birthday Invitation
      blocks:
        - id: ch01-b01
          speaker: girl_1
          text: Are you going to see Phillis and Phoebe next week? Phillis turns fourteen on Monday. She says we'll all have tea in the garden, then play some good games on the green.
        - id: ch01-b02
          speaker: girl_1
          text: I wanted a new dress, but Mother said no, so I'll have to wear my old white one. Still, white is so pretty. And kind Aunt Matilda sent me a beautiful necklace.
    - id: ch02
      title: Dresses and Flowers
      blocks:
        - id: ch02-b01
          speaker: girl_2
          text: Oh, yes, I'm going, and Peggy is too. Mother is making new dresses for both of us to wear to the party. I'll wear my red sash and my hat with the pink ribbons. I'm sure all the girls there will look their best.
        - id: ch02-b02
          speaker: girl_2
          text: We're each bringing Phillis a bouquet, too, and the bigger, the better. The sweet flowers will tell her that all her friends love her and want her birthday to be happy.
    - id: ch03
      title: Tea Under the Apple Tree
      blocks:
        - id: ch03-b01
          speaker: girl_2
          text: Won't it be lovely in the bright sunshine? The table will be set beneath the great apple tree, and dear little Phillis will smile at everyone as she pours the tea.
