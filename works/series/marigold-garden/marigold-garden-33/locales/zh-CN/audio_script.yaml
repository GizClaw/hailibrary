audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 叙述者
      tts:
        delivery: 温柔明快，带着游行歌谣般的轻盈起伏
        timbre: 清澈柔和
        pace: 舒缓
        pitch: 中音
  chapters:
    - id: ch01
      title: 从不弄脏的孩子
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 孩子们有的淘气，有的听话。可是这户有教养的人家呀，孩子们无论做什么，都不会忘了规矩。
        - id: ch01-b02
          speaker: narrator
          text: 他们出门会戴好手套，也绝不沿街奔跑。就算是下雨天，也没有谁把双脚弄得满是泥巴。
    - id: ch02
      title: 礼貌又用功
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 他们待人总是客客气气，道谢也从不忘记。玩过的玩具不会到处乱丢，因为那是淘气孩子才干的事。
        - id: ch02-b02
          speaker: narrator
          text: 该上课时，他们就认真学功课。吃面包呢，连皮也一点不剩。瞧，他们多么听话！
    - id: ch03
      title: 永远体面
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 他们的衣裙看不见破口，胸前的小领巾干干净净，头发也总是梳得整整齐齐。什么时候见到他们，都是一副体面的模样。
        - id: ch03-b02
          speaker: narrator
          text: 跟着妈妈去拜访别人时，他们个个整洁又漂亮。要是在街上遇见你，还知道怎样好好鞠躬行礼。
    - id: ch04
      title: 你和我的榜样
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 总之，好孩子该有的样子，他们全都有。如今这有教养的一家，正好可以给小小的你，还有我，做个榜样。
