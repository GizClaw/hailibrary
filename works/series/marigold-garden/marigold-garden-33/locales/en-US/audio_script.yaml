audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm and gently observant
        timbre: clear and tender
        pace: unhurried
        pitch: medium
  chapters:
    - id: ch01
      title: The Genteel Family Goes Out
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Some children are naughty, and some are very good. The Genteel Family always did just what it should.
        - id: ch01-b02
          speaker: narrator
          text: They wore gloves whenever they went out and never ran in the street. Even on wet days, none of them had muddy feet.
    - id: ch02
      title: Polite and Dutiful
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: They were always polite and always thanked you. They didn't toss their toys around the way naughty children do.
        - id: ch02-b02
          speaker: narrator
          text: At lesson time, they always studied as they should. They even liked eating all their crusts. They were so very good.
    - id: ch03
      title: Neat from Head to Toe
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: Their dresses were never torn, and their collars were always clean. Their hair stayed so tidy that they were always ready to be seen.
        - id: ch03-b02
          speaker: narrator
          text: They went visiting with their mamma, looking perfectly neat. And whenever they met you in the street, they knew just how to make a proper bow.
    - id: ch04
      title: An Example for Us
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: Truly, they were everything children were supposed to be.
        - id: ch04-b02
          speaker: narrator
          text: So perhaps the Genteel Family can still be an example for little you and me.
