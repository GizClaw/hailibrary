audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 叙述者
      tts:
        delivery: 温柔神秘，带着轻盈的童谣韵律
        timbre: 清澈柔和
        pace: 舒缓
        pitch: 中音
  chapters:
    - id: ch01
      title: 海中央的绿塔
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 大海中央立着一座鲜绿的高塔，四位公主住在里面。可她们究竟是谁？谁也猜不出来。
        - id: ch01-b02
          speaker: narrator
          text: 一位朝北，一位朝南，另两位分别望着东和西。四个人都那么美，怎么也分不出谁最美丽。
    - id: ch02
      title: 歌声与白鸟
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 她们金发卷卷，眼睛湛蓝，声音甜得像银铃。四只白鸟绕着她们飞，可鸟儿从哪里来？谁也说不清。
        - id: ch02-b02
          speaker: narrator
          text: 没人知道公主的来历，也没听见她们说过一个字。只听见歌声，仿佛教堂钟声。她们渐渐远去，那甜美的声音仍从海上飘来。
    - id: ch03
      title: 仍是一个谜
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 阳光下，星光下，四位公主常在遥远的海上航行。后来，她们又回到绿塔和玫瑰花亭里住下。她们是谁？仍是一个谜。
