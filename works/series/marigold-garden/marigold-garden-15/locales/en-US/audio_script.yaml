audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm and gently observant
        timbre: clear and tender
        pace: unhurried
        pitch: medium
  chapters:
    - id: ch01
      title: The Green Tower
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Four princesses lived in a bright green tower in the middle of the sea. And no one could imagine, no, no one at all, who those four princesses might be.
    - id: ch02
      title: Four Ways to Look
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: One princess faced north, one faced south, another faced east, and the last faced west. Each one was so lovely that no one could say which of the four was the prettiest.
    - id: ch03
      title: Golden Curls and White Birds
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: All four had golden curls and blue eyes, and voices as sweet as silvery bells. Four white birds flew around them. But where had the birds come from? Who could possibly tell?
    - id: ch04
      title: Their Mysterious Song
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: Who could tell, when no one knew? The princesses never spoke a single word that anyone could hear. Yet as they passed by, their song drifted sweetly over the sea, like church bells ringing.
    - id: ch05
      title: A Mystery
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: They often sailed far across the sea, beneath the sun and beneath the stars. Then they returned to live in their green tower, among the roses. And still, the four princesses remained a mystery.
