audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm and gently observant
        timbre: clear and tender
        pace: unhurried
        pitch: medium
  chapters:
    - id: ch01
      title: At the Little Pond
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Sweet Miss Molly, you are so fond of the little fish in their pond. Perhaps they are glad to see you watching them there with your bright eyes.
    - id: ch02
      title: Little White Crumbs
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: Then your fingers and thumbs slowly drop small white crumbs for them. I hope the fish are happy.
    - id: ch03
      title: Back to the River
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: Just remember this, sweet Miss Molly. When you have watched long enough, be a truly generous young giver and return those little fish to their own river.
