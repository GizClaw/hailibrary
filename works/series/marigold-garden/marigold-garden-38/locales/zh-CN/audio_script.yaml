audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 叙述者
      tts:
        delivery: 温柔亲切，劝告时含着善意
        timbre: 清澈柔和
        pace: 舒缓
        pitch: 中音
  chapters:
    - id: ch01
      title: 小池塘边
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 甜美的莫莉小姐可喜欢小池塘里的鱼儿了。她睁着一双明亮的眼睛，一直望着池中的它们。说不定，小鱼儿让她这么看着，也觉得很欢喜。
    - id: ch02
      title: 白面包屑
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 接着，她的手指和拇指轻轻一松，一小块一小块的白面包屑便慢慢落下去。我只盼着，池里的鱼儿都快快乐乐。
    - id: ch03
      title: 回到河流
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 不过，甜美的莫莉小姐，等你看够了，可要做个最仁慈的小小施予者，把鱼儿送回它们故乡的河流。
