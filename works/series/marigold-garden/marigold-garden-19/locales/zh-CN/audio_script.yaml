audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 叙述者
      tts:
        delivery: 天真明朗，带着轻快自然的童谣感
        timbre: 清澈柔和
        pace: 舒缓
        pitch: 中音
  chapters:
    - id: ch01
      title: 乡间的小绿屋
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 太阳火辣辣地从天上照下来，我却舒舒服服地住在小绿屋里，心里欢喜极了。我就是爱乡间，爱这美丽的乡间。有了这样的地方，谁还愿意住在伦敦的街上呢？
        - id: ch01-b02
          speaker: narrator
          text: 可我偏偏住在伦敦街上，于是天天盼呀盼，真想从早到晚都待在芬芳的花丛里。我不想抬头只看见高高的烟囱。我想看鸟儿飞过，也想看蜻蜓从眼前掠过去。
    - id: ch02
      title: 夜莺的歌声
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 在伦敦的家里，我躺上床也睡不着。车轮碾过硬邦邦的街面，一直吵个不停。到了乡间，四周静悄悄的，我闭上眼睛，只听见夜莺在唱歌。
    - id: ch03
      title: 留在乡间
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 鸡儿和鹅儿在我眼前走来走去，小猪和鸭子咕咕哝哝，像是在说话。红牛和花斑牛睁大眼睛盯着我瞧，好像怎么也猜不出我是谁。
        - id: ch03-b02
          speaker: narrator
          text: 小羊羔也跟着羊妈妈出来了。那些雪白的小家伙，就像一群漂亮的小弟弟、小妹妹。我要留在乡间，编一串雏菊花环，再也不回伦敦去了！
