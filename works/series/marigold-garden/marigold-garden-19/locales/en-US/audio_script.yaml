audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm and gently observant
        timbre: clear and tender
        pace: unhurried
        pitch: medium
  chapters:
    - id: ch01
      title: My Little Green House
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: I'm perfectly happy in my little green house, even when the hot sun is pouring down. Oh, how I love the beautiful country! Why would anyone choose a London street when they could be here?
    - id: ch02
      title: Longing for the Country
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: When I'm back on my London street, I long to spend the whole day among the sweet flowers. I'd rather watch birds and dragonflies pass by than look up at tall chimney pots against the sky.
    - id: ch03
      title: Night Sounds
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: At home, I lie awake in bed while cart wheels rattle over the hard street. But here, my eyes close. The only sound I hear is the nightingales singing.
    - id: ch04
      title: The Farmyard
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: I watch the chickens and geese walking around, and I hear the pigs and ducks talking away. The red cows and the spotted cows stare at me as if they're wondering, “Who in the world can she be?”
    - id: ch05
      title: Never Going Back
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: Then I see the little lambs beside their mothers, such pretty young white sisters and brothers. Oh, I'll stay here in the country and make a daisy chain. I'll never go back to London again.
