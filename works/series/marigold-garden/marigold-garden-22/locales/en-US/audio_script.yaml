audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm and gently observant
        timbre: clear and tender
        pace: unhurried
        pitch: medium
  chapters:
    - id: ch01
      title: Five Girls at School
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Five little girls sit on a bench. They have lessons to learn, but when it's time to recite, I'm afraid they won't remember a bit.
    - id: ch02
      title: Wandering Eyes
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: Their little eyes were made for looking, but they look anywhere except at their books.
    - id: ch03
      title: Far Away
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: And those little thoughts were made to wander. Off they go, anywhere at all, ever so far away.
