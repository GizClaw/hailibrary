audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 叙述者
      tts:
        delivery: 亲切活泼，带着温和调侃的童谣感
        timbre: 清澈柔和
        pace: 舒缓
        pitch: 中音
  chapters:
    - id: ch01
      title: 五个小姑娘
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 教室里，五个小姑娘并排坐在长凳上。五个小姑娘都有功课要学，还得把功课牢牢记好。
    - id: ch02
      title: 轮到背诵
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 可到了背诵的时候，恐怕她们一点儿也想不起来，一个字都答不上。
    - id: ch03
      title: 心思跑远了
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 谁叫那一双双小眼睛总爱往别处瞧，偏偏不肯看书呢？小小的心思也总爱溜走，越跑越远，不知道游荡到什么地方去了。
