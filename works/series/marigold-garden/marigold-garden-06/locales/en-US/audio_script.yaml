audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm and gently ceremonial
        timbre: clear and tender
        pace: unhurried
        pitch: medium
  chapters:
    - id: ch01
      title: Miss Molly's Flowers
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Fine Miss Molly, you're carrying so many daisies home today.
    - id: ch02
      title: What Will They Say?
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: What will the daisies say when so many of their little friends are gone?
    - id: ch03
      title: Who Came Home?
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: Perhaps you picked a sister or a brother, or two little daisies who were fond of each other.
