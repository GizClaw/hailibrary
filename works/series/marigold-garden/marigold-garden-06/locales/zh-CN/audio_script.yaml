audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 叙述者
      tts:
        delivery: 温柔而充满遐想，结尾带一点怅然
        timbre: 清澈温暖
        pace: 舒缓
        pitch: 中音
  chapters:
    - id: ch01
      title: 莫莉小姐
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 莫莉小姐真漂亮，今天还摘了好多小雏菊。
    - id: ch02
      title: 雏菊会怎么说
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 这么多小伙伴要被带回家，雏菊们会怎么说呢？
    - id: ch03
      title: 被摘走的小伙伴
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 她也许摘走了谁的妹妹或哥哥，又或是两朵最要好的小雏菊。
