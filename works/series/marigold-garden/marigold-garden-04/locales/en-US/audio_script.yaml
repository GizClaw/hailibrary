  chapters:
    - id: ch01
      title: Street Show
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Puff, puff, puff! Hear those trumpets blow. Come on, little boys and girls. Come see the show! One, two, three! The Cat runs up the tree. But the little Bird flies away.
        - id: ch01-b02
          speaker: bird
          text: She didn't catch me!
          emotion: happy
