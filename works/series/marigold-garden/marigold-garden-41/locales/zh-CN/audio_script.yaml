audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 叙述者
      tts:
        delivery: 天真好奇，像一个孩子倚在桥边轻声遐想
        timbre: 清澈温暖
        pace: 舒缓
        pitch: 中高音
  chapters:
    - id: ch01
      title: 想看一尾小鱼
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 我现在最盼望的，就是看见一尾小鱼。真想瞧瞧它圆圆的大眼睛，总是睁着，像是什么都让它惊奇。
    - id: ch02
      title: 水边的访客
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 要是有只水鼠慢慢游过水面，游到对岸，那该多好。也许还有只会跳舞的蜘蛛，在黄色鸢尾花上歇一会儿。
    - id: ch03
      title: 石子和花儿船
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 我可以捡几颗石子投进水里，看漂亮的圆圈一层层漾开。要不，我们放一只花儿船，望着它慢慢地、慢慢地漂走。
    - id: ch04
      title: 漂向大海
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 花儿船最有意思的地方，就是没人知道它究竟想去多远。等明天到了，说不定它早已离开这里，漂进那片宽广的大海啦。
