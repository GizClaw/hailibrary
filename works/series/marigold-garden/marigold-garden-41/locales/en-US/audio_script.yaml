audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm and gently observant
        timbre: clear and tender
        pace: unhurried
        pitch: medium
  chapters:
    - id: ch01
      title: Watching the Water
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: If only I could see a little fish right now. That's just what I wish. I'd look at his great round eyes, always wide with surprise.
        - id: ch01-b02
          speaker: narrator
          text: Maybe a water rat will glide slowly across. Or perhaps a dancing spider will rest for a while on the yellow flags.
    - id: ch02
      title: Stones or a Flower-Boat
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: I could find some stones to toss in and watch the pretty circles spread. Or should we sail a flower-boat and watch it float away, slowly, slowly?
    - id: ch03
      title: Where the Flower-Boat Goes
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: That's the lovely part. You never know how far the flower-boat plans to go. By tomorrow, it might have reached the great wide sea.
