audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 叙述者
      tts:
        delivery: 温柔明快，带着游行歌谣般的轻盈起伏
        timbre: 清澈柔和
        pace: 舒缓
        pitch: 中音
  chapters:
    - id: ch01
      title: 通往玫瑰城
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 穿过玫瑰拱廊，就能走到山顶的玫瑰城。夏风吹着，乐声一路飘来，小提琴的声音又尖又清。
    - id: ch02
      title: 为女王编花环
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 把玫瑰和百合盘起来，绕起来，再添上青青的小叶，这才配得上女王。玫瑰和百合，继续盘呀，继续绕呀。
    - id: ch03
      title: 玫瑰庆典
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 玫瑰会铺成她的花毯，也会变成明艳的帘幕。她头戴玫瑰花冠，长长的金发远远垂落身后。
        - id: ch03-b02
          speaker: narrator
          text: 再把玫瑰和百合盘起来，绕起来。所有的钟儿一齐鸣响，所有的人们一齐歌唱。玫瑰和百合，盘呀，绕呀。
