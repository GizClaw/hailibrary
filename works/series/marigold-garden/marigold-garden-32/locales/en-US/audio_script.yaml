audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm and gently observant
        timbre: clear and tender
        pace: unhurried
        pitch: medium
  chapters:
    - id: ch01
      title: The Road to Rose Town
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Under rose arches, the road climbs to Rose Town on top of the hill. The summer wind blows, music carries, and the violins sound bright and high.
    - id: ch02
      title: Flowers for a Queen
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: Twist and twine roses and lilies, adding little green leaves fit for a queen. Twist and twine the roses and lilies.
    - id: ch03
      title: The Rose Celebration
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: Roses will carpet her way, and fair rose curtains will hang around her. She'll wear a rosy crown, while her long golden hair floats far down.
        - id: ch03-b02
          speaker: narrator
          text: Twist and twine roses and lilies. All the bells ring, and all the people sing. Twist and twine roses and lilies.
