audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm and gently observant
        timbre: clear and tender
        pace: unhurried
        pitch: medium
  chapters:
    - id: ch01
      title: Over the Trees and Flowers
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Baby mine, you're over the trees. Baby mine, you're over the flowers.
    - id: ch02
      title: Sunshine and Showers
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: Baby mine, beyond the sunshine. Baby mine, beyond the showers.
    - id: ch03
      title: Land and Water
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: Baby mine, you're over the land and over the water.
        - id: ch03-b02
          speaker: narrator
          text: Oh, has any mother ever had such a sweet, such a sweet little daughter?
