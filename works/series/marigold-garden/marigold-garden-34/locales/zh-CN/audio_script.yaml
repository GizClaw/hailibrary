audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 叙述者
      tts:
        delivery: 温柔明快，带着游行歌谣般的轻盈起伏
        timbre: 清澈柔和
        pace: 舒缓
        pitch: 中音
  chapters:
    - id: ch01
      title: 树梢与花丛
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 我的宝贝呀，你越过树梢，也越过花丛。你越过阳光，也越过一场场阵雨。
    - id: ch02
      title: 大地与水面
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 我的宝贝呀，你越过了大地，又越过了水面。
    - id: ch03
      title: 母亲的宝贝
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 啊，从前有哪位母亲，曾有过这样甜、这样甜的小女儿呢？
