audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 叙述者
      tts:
        delivery: 欢快明朗，带着轻盈的童谣韵律
        timbre: 清澈柔和
        pace: 舒缓
        pitch: 中音
  chapters:
    - id: ch01
      title: 婚礼钟声
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 到了星期一，婚礼的钟声响起来了。小淑女们个个清新又欢喜，全都来到婚礼上了。
        - id: ch01-b02
          speaker: narrator
          text: 她们一级一级走上台阶，要去看美丽的婚礼。玫瑰全献给新娘。她真美呀，真美！
