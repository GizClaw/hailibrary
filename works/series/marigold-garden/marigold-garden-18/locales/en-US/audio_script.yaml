audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm and gently observant
        timbre: clear and tender
        pace: unhurried
        pitch: medium
  chapters:
    - id: ch01
      title: The Wedding Day
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: The wedding bells were ringing, and Monday was the wedding day. All the little ladies were there, looking fresh and gay.
    - id: ch02
      title: Up the Steps
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: Up, up, up the steps they went to see the fine wedding.
    - id: ch03
      title: Roses for the Bride
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: All the Roses were for the Bride. She was so pretty, so very pretty.
