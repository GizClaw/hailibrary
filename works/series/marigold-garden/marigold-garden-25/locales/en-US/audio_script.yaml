audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm and gently observant
        timbre: clear and tender
        pace: unhurried
        pitch: medium
    child_1:
      display_name: First Child
      tts:
        delivery: bright and eagerly welcoming
        timbre: clear and youthful
        pace: lively
        pitch: medium-high
    child_2:
      display_name: Second Child
      tts:
        delivery: cheerful and warmly excited
        timbre: light and youthful
        pace: lively
        pitch: medium-high
    child_3:
      display_name: Third Child
      tts:
        delivery: joyful and spirited
        timbre: fresh and youthful
        pace: lively
        pitch: medium
  chapters:
    - id: ch01
      title: On the Wall Top
      blocks:
        - id: ch01-b01
          speakers: [child_1, child_2, child_3]
          ensemble: chorus
          text: We dance and prance toward town, along the top of the town wall. Should we talk to the stars, or maybe to the moon? Or should we run home to eat our dinner so soon?
