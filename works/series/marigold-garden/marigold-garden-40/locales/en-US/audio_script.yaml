audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm and gently observant
        timbre: clear and tender
        pace: unhurried
        pitch: medium
    first_boy:
      display_name: First Boy
      tts:
        delivery: cheerful and playful
        timbre: bright and youthful
        pace: lively
        pitch: medium-high
    second_boy:
      display_name: Second Boy
      tts:
        delivery: merry and energetic
        timbre: clear and youthful
        pace: lively
        pitch: medium-high
    first_girl:
      display_name: First Girl
      tts:
        delivery: lighthearted and spirited
        timbre: light and youthful
        pace: lively
        pitch: high
    second_girl:
      display_name: Second Girl
      tts:
        delivery: teasing and quick
        timbre: warm and youthful
        pace: lively
        pitch: high
  chapters:
    - id: ch01
      title: Ring-a-Ring
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Little boys make a ring. Girls make a ring, too. Around and around they go, twisting and twirling.
        - id: ch01-b02
          speaker: narrator
          text: You children look so merry.
        - id: ch01-b03
          speakers: [first_boy, second_boy, first_girl, second_girl]
          ensemble: chorus
          text: We are!
          emotion: happy
        - id: ch01-b04
          speaker: narrator
          text: Where have you all come from?
        - id: ch01-b05
          speakers: [first_boy, second_boy, first_girl, second_girl]
          ensemble: chorus
          text: Oh, not very far away.
        - id: ch01-b06
          speaker: first_boy
          text: I live up in the mountain.
        - id: ch01-b07
          speaker: first_girl
          text: And I live in the tree.
        - id: ch01-b08
          speaker: second_boy
          text: I live down in the riverbed.
        - id: ch01-b09
          speaker: second_girl
          text: And you'll never catch me!
