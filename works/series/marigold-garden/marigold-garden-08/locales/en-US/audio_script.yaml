audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm and gently ceremonial
        timbre: clear and tender
        pace: unhurried
        pitch: medium
    damon:
      display_name: Damon
      tts:
        delivery: bright and politely eager
        timbre: clear and youthful
        pace: lively
        pitch: medium-high
  chapters:
    - id: ch01
      title: Off to Grandmamma's
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Little Molly and Damon are walking such a long way to visit their kind Grandmamma.
    - id: ch02
      title: Cake, Currants, and Fun
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: They know she'll take some very nice cake from her cupboard. Then they can run into her garden, pick some red currants, and have lots and lots of fun.
    - id: ch03
      title: May Doggie Come Too?
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: As they go, Damon speaks to doggie.
        - id: ch03-b02
          speaker: damon
          text: How do you do, doggie?
        - id: ch03-b03
          speaker: narrator
          text: Then he asks his mamma if doggie may come too.
