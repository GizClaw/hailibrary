audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 叙述者
      tts:
        delivery: 温柔明快，带着讲童谣般的轻盈节奏
        timbre: 清澈温暖
        pace: 舒缓
        pitch: 中音
    damon:
      display_name: 戴蒙
      tts:
        delivery: 天真有礼，话里透着期待
        timbre: 清亮稚嫩
        pace: 轻快
        pitch: 中高音
  chapters:
    - id: ch01
      title: 去看奶奶
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 小莫莉和戴蒙要去看慈祥的奶奶。他们一路走啊走，已经走了好远。
    - id: ch02
      title: 蛋糕、红醋栗和玩耍
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 他们知道，到了奶奶家，奶奶会打开食橱，拿出可口的蛋糕。他们还可以跑进花园，摘些红醋栗，痛痛快快地玩。
    - id: ch03
      title: 小狗也能去吗
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 走着走着，戴蒙跟小狗打了声招呼。
        - id: ch03-b02
          speaker: damon
          text: 小狗，你好呀？
        - id: ch03-b03
          speaker: narrator
          text: 接着，他又问妈妈，能不能让小狗也一道去。
