audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 叙述者
      tts:
        delivery: 温柔明快，带着夏日童谣般的轻盈起伏
        timbre: 清澈柔和
        pace: 舒缓
        pitch: 中音
    hostess:
      display_name: 女主人
      tts:
        delivery: 热情亲切，招呼客人时自然轻快
        timbre: 明亮柔润
        pace: 轻快
        pitch: 中高音
  chapters:
    - id: ch01
      title: 花园里的茶桌
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 青翠可爱的花园里，我们坐下来，一起喝茶。
    - id: ch02
      title: 糖和牛奶
      blocks:
        - id: ch02-b01
          speaker: hostess
          text: 你要加糖吗？牛奶呢，要不要？
        - id: ch02-b02
          speaker: narrator
          text: 她那天穿了件新的丝绸衣裳，看起来漂亮又神气。
    - id: ch03
      title: 明亮的夏日
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 那是个阳光明亮的夏日。她请我们来喝茶，我们每个人都快活极了，再没有比这更开心的了。
