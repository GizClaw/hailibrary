audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm and gently observant
        timbre: clear and tender
        pace: unhurried
        pitch: medium
    hostess:
      display_name: Hostess
      tts:
        delivery: gracious and cheerfully attentive
        timbre: light and polished
        pace: relaxed
        pitch: medium-high
  chapters:
    - id: ch01
      title: The Tea Party
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: On a bright summer day, we sat down to tea in the lovely green garden.
        - id: ch01-b02
          speaker: hostess
          text: Would you like sugar? How about some milk?
        - id: ch01-b03
          speaker: narrator
          text: She was wearing a new gown, a smart silk one. We were all as happy as could be that day, when she invited us to tea.
