audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm and gently observant
        timbre: clear and tender
        pace: unhurried
        pitch: medium
  chapters:
    - id: ch01
      title: When We Grow Up
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: When you and I grow up, Polly... well, I mean you and me.
    - id: ch02
      title: Across the Sea
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: We'll sail in a great big ship, all the way across the sea.
    - id: ch03
      title: When We're Older
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: But we'll wait until we're older. If we went today, we might get lost, you know, and never find the way.
