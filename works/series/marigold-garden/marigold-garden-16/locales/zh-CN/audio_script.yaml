audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 叙述者
      tts:
        delivery: 温柔神秘，带着轻盈的童谣韵律
        timbre: 清澈柔和
        pace: 舒缓
        pitch: 中音
  chapters:
    - id: ch01
      title: 等咱俩长大
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 波莉，等咱俩长大了——对，我说的就是你和我——
    - id: ch02
      title: 坐大船去远航
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 我们就坐上一艘大船，出海远航，一直漂过整片大海。
    - id: ch03
      title: 再等一等
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 不过，我们得等到年纪再大些。今天就出发的话，说不定会迷路，再也找不到回去的方向。
