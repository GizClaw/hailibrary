audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm and gently ceremonial
        timbre: clear and tender
        pace: unhurried
        pitch: medium
  chapters:
    - id: ch01
      title: Up Toward the Sky
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Oh dear, how will this end? Peggy and Susie, you are being so naughty. You have no idea where you are going.
        - id: ch01-b02
          speaker: narrator
          text: You keep climbing farther and higher, until you are nearly up in the sky.
    - id: ch02
      title: Who Lives There?
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: Maybe a giant lives up there. Or perhaps there is a lovely princess. But you know perfectly well that you have no business going there. You will get yourselves into trouble.
    - id: ch03
      title: Come Back Home
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: Oh dear, I know it is true. Why should any of this matter to you? You know it is naughty to pry into other people's affairs, or to enter someone else's house when you have not been invited.
        - id: ch03-b02
          speaker: narrator
          text: So you had better turn back while there is still time.
        - id: ch03-b03
          speaker: narrator
          text: Go home, and never be so naughty again.
