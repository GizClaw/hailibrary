audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 叙述者
      tts:
        delivery: 温和郑重，带着童谣般的担忧和劝诫
        timbre: 清澈温暖
        pace: 舒缓
        pitch: 中音
  chapters:
    - id: ch01
      title: 快碰到天了
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 哎呀，这事最后会闹成什么样？佩吉、苏茜，你们两个可真淘气，连自己到了哪儿都不知道。
        - id: ch01-b02
          speaker: narrator
          text: 你们还越走越远，越爬越高，眼看就快碰到天了。
    - id: ch02
      title: 谁住在上面
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 谁住在那么高的地方呢？也许是个巨人，也许是一位美丽的公主。
        - id: ch02-b02
          speaker: narrator
          text: 可你们明明知道，自己根本不该跑到那里去。再往前走，准会惹出一团麻烦。
    - id: ch03
      title: 快回家去
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 哎呀，我看这话一点不假。天底下这些事，究竟跟你们有什么关系？
        - id: ch03-b02
          speaker: narrator
          text: 明知道不该打听别人的私事，还要往人家屋里闯。人家可没有请你们进去。
        - id: ch03-b03
          speaker: narrator
          text: 所以啊，趁现在还来得及，快点回头吧。
        - id: ch03-b04
          speaker: narrator
          text: 回家去，以后再也别这样淘气了。
