audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 叙述者
      tts:
        delivery: 温柔而充满遐想，结尾带一点怅然
        timbre: 清澈温暖
        pace: 舒缓
        pitch: 中音
  chapters:
    - id: ch01
      title: 一家人跳个不停
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 来认识一下这爱跳舞的一家吧。从早晨到午后，再从午后跳到夜晚，他们快活极了，跳个没完。
    - id: ch02
      title: 屋里屋外都是舞步
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 他们一圈一圈地转，还把脚尖朝向外边。人们听见那阵响声，都猜是什么事。其实，他们从大清早一直跳到深更半夜，屋里屋外都跳遍了，而且越跳越欢喜。
    - id: ch03
      title: 停下，又从头跳起
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 不管是哪一个遥远国家的舞，他们全都知道，难怪一整天都停不下来。晴天也跳，下雨也跳，就这么跳呀，跳呀，跳呀。等全家终于停住，你以为舞跳完了吗？才没有，他们马上又从头跳起来了！
