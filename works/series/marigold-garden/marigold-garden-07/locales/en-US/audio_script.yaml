  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm and gently ceremonial
        timbre: clear and tender
        pace: unhurried
        pitch: medium
  chapters:
    - id: ch01
      title: Meet the Dancing Family
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Come meet this little dancing family. Morning, afternoon, and night, they danced as happy as could be. Round and round they twirled, turning their toes out. Everyone nearby heard the noise and wondered what it was all about.
    - id: ch02
      title: Dancing All Day
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: They started early in the morning and kept going until very late at night. They danced indoors and outdoors, and loved every minute of it. They knew every kind of dance, even dances from countries far away. No wonder they kept dancing all day long.
    - id: ch03
      title: Begin Again
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: So they danced and danced and danced, whether the sun shone or the rain came down. And whenever they finally stopped, why, they all began again.
