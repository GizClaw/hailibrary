audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 叙述者
      tts:
        delivery: 天真明朗，带着轻快自然的童谣感
        timbre: 清澈柔和
        pace: 舒缓
        pitch: 中音
  chapters:
    - id: ch01
      title: 宝宝今天看什么
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 宝宝呀，这双蓝眼睛今天会看见什么呢？是漂亮的嘎嘎鸭，还是紫杉树上的孔雀？要不，就去看那些正在玩耍的小白羊？宝宝，你说说看。
    - id: ch02
      title: 小小乖宝贝
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 宝宝还是个小小的乖宝贝，也是个甜甜的小心肝。
    - id: ch03
      title: 快满一岁啦
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 可如今呀，宝宝也算老大不小了。你瞧，她眼看就要满一岁啦！
