audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm and gently observant
        timbre: clear and tender
        pace: unhurried
        pitch: medium
  chapters:
    - id: ch01
      title: What Shall Baby See?
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Oh, what will my blue eyes see today? Pretty Quack-Quack? The peacock in the yew tree? Or the dear little white lambs at play? Tell me, Baby.
    - id: ch02
      title: Sweet Baby
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: Baby is such a young little petsy, and such a sweet dear.
    - id: ch03
      title: Almost One
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: And now Baby is growing quite old. She's nearly a whole year old!
