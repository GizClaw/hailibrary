audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 叙述者
      tts:
        delivery: 亲切轻快，带着童谣般自然的问答节奏
        timbre: 清亮温暖
        pace: 舒缓
        pitch: 中音
  chapters:
    - id: ch01
      title: 别走太远
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 小蓝鞋还小，不能独自走太远。她会摔倒，也可能迷路。
    - id: ch02
      title: 姐姐牵着走
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 真出了事，妈妈会怎么说？把小手交给懂事的姐姐，让姐姐带她走吧。
    - id: ch03
      title: 等她长大
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 等小蓝鞋再长大些，就可以独自出门了。
