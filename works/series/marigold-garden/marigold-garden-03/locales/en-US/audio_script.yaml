  chapters:
    - id: ch01
      title: Blue Shoes
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Little Blue Shoes mustn't wander very far all by herself, you know. She might fall down, or she could lose her way. Just imagine. What would Mama say? She'd better let her wise sister hold her little hand.
        - id: ch01-b02
          speaker: narrator
          text: When Blue Shoes is older, she can go by herself.
