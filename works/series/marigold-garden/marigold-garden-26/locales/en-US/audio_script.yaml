audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm and gently observant
        timbre: clear and tender
        pace: unhurried
        pitch: medium
    child_1:
      display_name: First Child
      tts:
        delivery: bright and eagerly welcoming
        timbre: clear and youthful
        pace: lively
        pitch: medium-high
    child_2:
      display_name: Second Child
      tts:
        delivery: cheerful and warmly excited
        timbre: light and youthful
        pace: lively
        pitch: medium-high
    child_3:
      display_name: Third Child
      tts:
        delivery: joyful and spirited
        timbre: fresh and youthful
        pace: lively
        pitch: medium
  chapters:
    - id: ch01
      title: On the Wall Top
      blocks:
        - id: ch01-b01
          speakers: [child_1, child_2, child_3]
          ensemble: chorus
          text: Why, up here, so high on the wall, we run closer to the sky and closer to the sun. Give me one penny, and I'll give you two. That's what good neighbors do.
