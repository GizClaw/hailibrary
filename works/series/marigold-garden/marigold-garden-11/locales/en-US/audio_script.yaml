audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm and gently ceremonial
        timbre: clear and tender
        pace: unhurried
        pitch: medium
    grandmamma:
      display_name: Grandmamma
      tts:
        delivery: proper and firmly instructive
        timbre: refined and mature
        pace: measured
        pitch: medium-low
  chapters:
    - id: ch01
      title: Down the Street
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Mamma sent us out with Grandmamma for a treat. Oh dear, how stiffly we had to walk down the street!
        - id: ch01-b02
          speaker: narrator
          text: We went one on each side. No laughing or lounging. I carried Prim, her spaniel, while Tom carried her parasol.
        - id: ch01-b03
          speaker: narrator
          text: If I glanced right, or Tom looked left, Grandmamma noticed.
        - id: ch01-b04
          speaker: grandmamma
          text: Tom! Susan! I am ashamed of you. Even Prim must be shocked to hear such naughty behavior mentioned.
    - id: ch02
      title: When Grandmamma Was Young
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: If we talked or sang, Grandmamma said we had no manners.
        - id: ch02-b02
          speaker: grandmamma
          text: You should have seen how I walked when I was young.
        - id: ch02-b03
          speaker: narrator
          text: She told us again and again about those good old days. Back then, she said, well-behaved girls and boys never made any noise.
        - id: ch02-b04
          speaker: narrator
          text: Children did not even want to play, according to Grandmamma. They learned sewing and needlework instead, or settled down to write and read.
        - id: ch02-b05
          speaker: grandmamma
          text: My mother never allowed me to say one word at the table.
    - id: ch03
      title: Tongues with Wheels
      blocks:
        - id: ch03-b01
          speaker: grandmamma
          text: But children today seem to have wheels on their tongues. They race along, clack, clack, clack, clack!
        - id: ch03-b02
          speaker: grandmamma
          text: Now listen carefully, both of you. I want to see you improve after everything I have told you today.
