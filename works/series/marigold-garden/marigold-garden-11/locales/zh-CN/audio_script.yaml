audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 叙述者
      tts:
        delivery: 天真机灵，带着克制的调皮和童谣节奏
        timbre: 清澈温暖
        pace: 舒缓
        pitch: 中音
    grandmamma:
      display_name: 奶奶
      tts:
        delivery: 讲究规矩，严肃训诫中带着老派的自信
        timbre: 端庄成熟
        pace: 从容
        pitch: 中低音
  chapters:
    - id: ch01
      title: 走过大街
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 妈妈说，跟奶奶出门算是带我们散心。可我们走在大街上时，哪儿像散心呀，浑身都得绷得紧紧的。
        - id: ch01-b02
          speaker: narrator
          text: 我和汤姆一边一个，紧挨着奶奶走。大笑不行，走得懒洋洋也不行。我抱着她的西班牙小狗普里姆，汤姆替她提着阳伞。
        - id: ch01-b03
          speaker: narrator
          text: 我只要朝右边瞧一眼，或者汤姆往左边看一下，奶奶马上就会开口。
        - id: ch01-b04
          speaker: grandmamma
          text: 汤姆，苏珊，你们这样真叫我害臊！连“淘气”这个字，小普里姆听见了都会吓一跳。
    - id: ch02
      title: 奶奶小时候
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 要是我们说句话，或者唱上一声，奶奶便说我们不懂规矩。
        - id: ch02-b02
          speaker: grandmamma
          text: 你们真该看看，我小时候走路是什么样子。
        - id: ch02-b03
          speaker: narrator
          text: 这件事，奶奶不知道说过多少遍了。她说，在她年幼的好日子里，小姑娘和小男孩从来不发出半点声音。
        - id: ch02-b04
          speaker: narrator
          text: 奶奶还说，那时的孩子根本不想玩。真的，他们一点儿也不想。他们只学缝衣裳、做针线，不然就写字、读书。
        - id: ch02-b05
          speaker: grandmamma
          text: 我吃饭的时候，母亲连一个字也不许我说。
    - id: ch03
      title: 舌头上的轮子
      blocks:
        - id: ch03-b01
          speaker: grandmamma
          text: 可现在的孩子呢？舌头简直都装上了轮子，转得飞快，咔嗒、咔嗒、咔嗒、咔嗒。
        - id: ch03-b02
          speaker: grandmamma
          text: 现在你们俩给我仔细听好。今天我说了这么多，接下来就看你们有没有长进了。
