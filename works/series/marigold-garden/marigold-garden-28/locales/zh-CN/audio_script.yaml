audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 叙述者
      tts:
        delivery: 轻巧自然，带着童谣般的亲切感
        timbre: 清澈柔和
        pace: 舒缓
        pitch: 中音
    mrs_lemon:
      display_name: 莱蒙太太
      tts:
        delivery: 得意又疼爱，像在谈论心爱的娃娃
        timbre: 明亮温柔
        pace: 轻快
        pitch: 中高音
    mrs_cowslip:
      display_name: 考斯莉普太太
      tts:
        delivery: 热情大方，问话时带一点好奇
        timbre: 清脆亲和
        pace: 适中
        pitch: 中高音
    mrs_primrose:
      display_name: 普里姆罗丝太太
      tts:
        delivery: 客气体面，谈起孩子时关切而认真
        timbre: 柔和圆润
        pace: 适中
        pitch: 中音
  chapters:
    - id: ch01
      title: 乖巧的娃娃
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 妈妈们说起了各自的娃娃。
        - id: ch01-b02
          speaker: mrs_lemon
          text: 我家波莉可乖了，贝琳达也从来不闹。我的宝宝还常常自己睡着呢。您瞧，她已经把眼睛闭上啦。
        - id: ch01-b03
          speaker: mrs_cowslip
          text: 莱蒙太太，贝琳达什么时候去学堂？她晚上又是几点睡觉呀？
        - id: ch01-b04
          speaker: mrs_lemon
          text: 按规矩，八点就该上床。不过偶尔也能晚睡一小会儿，算是奖励她。您摇什么头呀？换作您，难道不会这样吗？快看看，宝宝笑得多甜！
    - id: ch02
      title: 下星期来喝茶
      blocks:
        - id: ch02-b01
          speaker: mrs_cowslip
          text: 普里姆罗丝太太，下星期挑一天来喝茶吧。别忘了带上罗莎琳达，还有那个惹人疼的小宝贝罗莎莉。
        - id: ch02-b02
          speaker: mrs_primrose
          text: 考斯莉普太太，您真是太好了！我家孩子们听见准会高兴。宝贝们，你们快告诉考斯莉普太太，大家都很想去做客。
    - id: ch03
      title: 叫人担心的事
      blocks:
        - id: ch03-b01
          speaker: mrs_primrose
          text: 对了，这件事您也许还没听说。她前些时候吓得不轻。黛西出了麻疹，我每天夜里都得守着她。
        - id: ch03-b02
          speaker: mrs_primrose
          text: 后来又出了件叫我发愁的事。克拉丽莎突然抽搐起来，连医生也一点都说不出是什么缘故。
