  chapters:
    - id: ch01
      title: Mammas and Babies
      blocks:
        - id: ch01-b01
          speaker: mrs_cowslip
          text: My Polly is so good. Belinda never cries, and my baby often drifts right off to sleep. Just look. Her eyes are closing now.
        - id: ch01-b02
          speaker: mrs_cowslip
          text: Mrs. Lemon, when does Belinda go to school? And what time do you put her to bed?
        - id: ch01-b03
          speaker: mrs_lemon
          text: Eight o'clock is our rule. But once in a while, as a special treat, I let her stay up a little later. You're shaking your head. Wouldn't you do the same? Just look at my baby's smile!
        - id: ch01-b04
          speaker: mrs_cowslip
          text: Mrs. Primrose, would you come to tea one day next week? Please bring Rosalinda, of course, and darling little Rosalie too.
        - id: ch01-b05
          speaker: mrs_primrose
          text: Why, Mrs. Cowslip, that's so kind of you. I know my little ones will be delighted to come. Dears, tell Mrs. Cowslip how pleased you are.
        - id: ch01-b06
          speaker: mrs_primrose
          text: Oh, perhaps you haven't heard. We had a terrible scare. My Daisy came down with measles, and I was up with her every night.
          emotion: fearful
        - id: ch01-b07
          speaker: mrs_primrose
          text: Then I had Clarissa to worry about. She had a fit, and the doctor said he couldn't explain it at all.
