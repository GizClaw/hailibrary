audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 叙述者
      tts:
        delivery: 天真轻快，带着孩子抛接皮球时的节拍感
        timbre: 清澈温暖
        pace: 轻快
        pitch: 中高音
  chapters:
    - id: ch01
      title: 抛皮球
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 一、二，这球归你。一、二、三，这球归我。要抛就快点抛，不然就别抛。可千万别让球掉下去。
    - id: ch02
      title: 低头望着
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 蓝眼睛仙子、棕眼睛仙子，还有可爱的小金卷发，都在低头看着。
    - id: ch03
      title: 等到再相见
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 我说声再见，心里并不难过。等到某个快乐的日子，我们还会再见的。
