audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm and gently observant
        timbre: clear and tender
        pace: unhurried
        pitch: medium
  chapters:
    - id: ch01
      title: The Ball Game
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: One, two. That's one for you. One, two, three. That's one for me. Throw the ball fast, or don't throw it at all. And mind you don't let it fall.
    - id: ch02
      title: Looking Down
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: Fairy Blue Eyes and Fairy Brown, and dear little Golden Curls, look down.
    - id: ch03
      title: Until We Meet Again
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: I say goodbye without any pain. We'll meet again some happy day.
