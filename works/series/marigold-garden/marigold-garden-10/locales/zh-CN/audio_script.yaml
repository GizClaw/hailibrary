audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 叙述者
      tts:
        delivery: 天真轻柔，带着童谣般的遐想
        timbre: 清澈温暖
        pace: 舒缓
        pitch: 中音
  chapters:
    - id: ch01
      title: 等待伙伴
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 聚会就要开始啦。最先到的小客人排成一行，坐在那里等着。等其他伙伴全都来了，大家就能一起玩，一起笑了。
        - id: ch01-b02
          speaker: narrator
          text: 听，门铃响得又清又亮！更多小伙伴来了。先到的客人再也不孤单，渐渐觉得这儿就像家一样。
    - id: ch02
      title: 早到总比迟到好
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 早早等着确实有点难熬，可总比迟到好。要是孤零零地赶来，发现茶和蛋糕早就吃光了，那才叫沮丧呢。
    - id: ch03
      title: 茶点与游戏
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 茶点会有什么呢？但愿有草莓果酱。大家会跳什么舞，又会玩什么游戏？这些小客人真高兴自己来了。
        - id: ch03-b02
          speaker: narrator
          text: 愿你也快快乐乐，好好享用你的茶点。
