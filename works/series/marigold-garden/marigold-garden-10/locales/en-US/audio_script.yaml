audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm and gently ceremonial
        timbre: clear and tender
        pace: unhurried
        pitch: medium
  chapters:
    - id: ch01
      title: First Arrivals
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: It's a party. The first little guests sit in a row, waiting for everyone else to arrive so the fun can begin.
        - id: ch01-b02
          speaker: narrator
          text: Listen! The bell rings sharp and clear. More little friends come in. The early guests aren't alone now, and begin to feel at home.
        - id: ch01-b03
          speaker: narrator
          text: Being early may be hard, but it's better than coming late. Imagine arriving sadly after the tea and cake are gone!
        - id: ch01-b04
          speaker: narrator
          text: What will they have for tea? They hope the jam is strawberry. What dance and game will there be? They're so glad they came.
        - id: ch01-b05
          speaker: narrator
          text: May you be very happy, and may you enjoy your tea.
