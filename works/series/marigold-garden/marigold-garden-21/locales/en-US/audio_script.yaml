audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm and gently observant
        timbre: clear and tender
        pace: unhurried
        pitch: medium
    willy:
      display_name: Willy
      tts:
        delivery: eager and earnest
        timbre: bright and youthful
        pace: lively
        pitch: medium-high
    sister:
      display_name: Sister
      tts:
        delivery: kind and matter-of-fact
        timbre: gentle and clear
        pace: measured
        pitch: medium
  chapters:
    - id: ch01
      title: May I Come?
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Willy asked his sister if he could come along with her.
        - id: ch01-b02
          speaker: willy
          text: Please, may I go with you?
        - id: ch01-b03
          speaker: sister
          text: You may, but only if you behave very nicely.
        - id: ch01-b04
          speaker: willy
          text: Then will you take me to see the mill?
        - id: ch01-b05
          speaker: sister
          text: Yes, I will. You've been so very good.
    - id: ch02
      title: Inside the Mill
      blocks:
        - id: ch02-b01
          speaker: willy
          text: The miller is so kind, and he's white all over from the flour they grind.
        - id: ch02-b02
          speaker: willy
          text: There are great heaps of corn lying on the floor. I'm sure he'll let me play with them.
    - id: ch03
      title: Round and Round
      blocks:
        - id: ch03-b01
          speaker: willy
          text: I love hearing the wheel rush along, and watching the pretty water go round and round and round.
        - id: ch03-b02
          speaker: willy
          text: So please take me to the mill. Then you'll see what a very, very good boy I truly mean to be.
