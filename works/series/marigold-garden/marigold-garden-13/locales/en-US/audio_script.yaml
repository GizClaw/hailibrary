audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm and gently ceremonial
        timbre: clear and tender
        pace: unhurried
        pitch: medium
    market_child_1:
      display_name: Market Child One
      tts:
        delivery: bright and welcoming
        timbre: light and clear
        pace: lively
        pitch: medium-high
    market_child_2:
      display_name: Market Child Two
      tts:
        delivery: cheerful and open
        timbre: warm and youthful
        pace: lively
        pitch: medium
    market_child_3:
      display_name: Market Child Three
      tts:
        delivery: eager and friendly
        timbre: soft and youthful
        pace: lively
        pitch: medium-high
  chapters:
    - id: ch01
      title: From Market
      blocks:
        - id: ch01-b01
          speakers: [market_child_1, market_child_2, market_child_3]
          ensemble: chorus
          text: Who will give us posies and garlands of roses to weave around our heads today? Here we come, bringing you many good wishes. From market, from market, from market! We have all come up from market.
