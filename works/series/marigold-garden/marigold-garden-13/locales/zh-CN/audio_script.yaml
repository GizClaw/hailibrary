audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 叙述者
      tts:
        delivery: 欢快亲切，带着童谣般的邀请感
        timbre: 清澈明亮
        pace: 轻快
        pitch: 中高音
  chapters:
    - id: ch01
      title: 鲜花与花环
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 谁愿意送给我们一束束鲜花，再送上一个用玫瑰编成的花环？我们想把花环绕在头上，戴得又喜气又欢畅。
    - id: ch02
      title: 今日的祝愿
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 今天，我们一路来到你们面前，也给你们带来了许许多多美好的祝愿。
    - id: ch03
      title: 从集市回来
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 我们从集市回来，从集市回来，从集市回来！我们大家，全都是从集市回来的。
