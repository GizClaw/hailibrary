audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 叙述者
      tts:
        delivery: 温暖明快，带着迎候庆典的期待
        timbre: 清澈柔和
        pace: 舒展
        pitch: 中音
    child_1:
      display_name: 孩子甲
      tts:
        delivery: 欢欣热切，像在人群中高声招呼伙伴
        timbre: 清亮稚嫩
        pace: 轻快
        pitch: 中高音
    child_2:
      display_name: 孩子乙
      tts:
        delivery: 兴奋爽朗，带着节日般的雀跃
        timbre: 明亮甜润
        pace: 轻快
        pitch: 中高音
    child_3:
      display_name: 孩子丙
      tts:
        delivery: 真挚喜悦，声音里满是盼望
        timbre: 轻盈清脆
        pace: 轻快
        pitch: 高音
  chapters:
    - id: ch01
      title: 鲜花迎候
      blocks:
        - id: ch01-b01
          speakers: [child_1, child_2, child_3]
          ensemble: chorus
          text: 带上红红的玫瑰吧，把玫瑰花瓣撒向她。还有雪白的百合，也要铺在她脚下。
        - id: ch01-b02
          speaker: narrator
          text: 小女王快到了。人们纷纷跑来，都赶着去迎候她，也想亲眼见见她，向她问好。
    - id: ch02
      title: 钟声欢迎
      blocks:
        - id: ch02-b01
          speakers: [child_1, child_2, child_3]
          ensemble: chorus
          text: 让钟声一齐响起来，为她奏响欢迎的乐声，送给她一场骄傲又甜美的欢迎。
    - id: ch03
      title: 歌声响彻街巷
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 等歌声一路传遍街巷，她的蓝眼睛会亮起来，金色的卷发也会闪闪发光。
