audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm and gently observant
        timbre: clear and tender
        pace: unhurried
        pitch: medium
    child_1:
      display_name: First Child
      tts:
        delivery: bright and eagerly welcoming
        timbre: clear and youthful
        pace: lively
        pitch: medium-high
    child_2:
      display_name: Second Child
      tts:
        delivery: cheerful and warmly excited
        timbre: light and youthful
        pace: lively
        pitch: medium-high
    child_3:
      display_name: Third Child
      tts:
        delivery: joyful and spirited
        timbre: fresh and youthful
        pace: lively
        pitch: medium
  chapters:
    - id: ch01
      title: Roses and Lilies
      blocks:
        - id: ch01-b01
          speakers: [child_1, child_2, child_3]
          ensemble: chorus
          text: We'll shower her with roses, bright red roses! And we'll scatter white lilies at her feet.
        - id: ch01-b02
          speaker: narrator
          text: The little Queen is coming. People are hurrying from everywhere to meet her and welcome her.
    - id: ch02
      title: A Proud Welcome
      blocks:
        - id: ch02-b01
          speakers: [child_1, child_2, child_3]
          ensemble: chorus
          text: Let the bells ring out! Let them all sound together and give her a proud, sweet welcome.
    - id: ch03
      title: Singing in the Street
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: Her blue eyes will shine, and her golden curls will gleam, when she hears their singing ring all the way down the street.
