cover_prompt: |-
  A wordless cover gathers children from the verses in a late-Victorian English garden on a mild summer afternoon. Three young children in simple 1880s smocks, pinafores, straw hats, stockings, and buttoned shoes make a daisy chain beneath tall marigolds while two others roll a hoop along a path. A small white dog watches beside a low brick wall, with clipped hedges, fruit trees, and a distant red-roofed cottage setting the period. One child lifts the completed flower chain toward a younger companion, making friendship the focal action. Use a gentle eye-level composition with garden paths guiding inward and generous pale sky above the trees. Keep faces, clothing, and playthings original and historically grounded rather than reproducing any existing illustrations. No readable text, letters, numbers, labels, logos, captions, speech bubbles, signatures, or watermarks.
