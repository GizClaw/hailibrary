audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 叙述者
      tts:
        delivery: 轻盈俏皮，带着童谣般的神秘转折
        timbre: 清澈柔和
        pace: 轻快
        pitch: 中高音
  chapters:
    - id: ch01
      title: 踮脚进城
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 瞧，她们踮脚往前走。一、二、三，是克洛伊、普鲁，还有我。我们上上下下，走进城里。
    - id: ch02
      title: 叮铃歌声
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 城里有位爵爷，还有一位美丽的夫人。他们唱什么？哦，是“叮铃叮铃响”。
    - id: ch03
      title: 乌鸦与戒指
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 黑乌鸦飞走了，还带走了夫人的戒指。
