  chapters:
    - id: ch01
      title: Tip-a-Toe
      blocks:
        - id: ch01-b01
          speaker: child_3
          text: Tip-a-toe, see them go. One, two, three—Chloe, Prue, and me. Up and down, we go to town. A lord is there with a fair lady. What do they sing? Oh, ring-a-ding-ding! Then the black crow flies off with the lady's ring.
