audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖从容，带着含蓄的幽默和讲故事的亲近感
        timbre: 清润沉稳
        pace: 中等偏慢
        pitch: 中
    mole:
      display_name: 鼹鼠
      tts:
        delivery: 真诚热心，偶尔带一点天真的兴奋
        timbre: 温软明亮
        pace: 中等
        pitch: 中高
    rat:
      display_name: 河鼠
      tts:
        delivery: 爽快机敏，朋友间说话自然亲切
        timbre: 清朗温暖
        pace: 中等偏快
        pitch: 中
    badger:
      display_name: 獾
      tts:
        delivery: 威严稳重，说话直截了当而有分量
        timbre: 低沉厚实
        pace: 稍慢
        pitch: 低
    toad:
      display_name: 蟾蜍
      tts:
        delivery: 浮夸善变，自信时神气十足，装可怜时戏剧感强
        timbre: 饱满响亮
        pace: 中等偏快
        pitch: 中高
    chairman:
      display_name: 治安法庭庭长
      tts:
        delivery: 一本正经又兴致勃勃，带着荒唐的权威感
        timbre: 洪亮圆润
        pace: 中等
        pitch: 中低
    clerk:
      display_name: 法庭书记员
      tts:
        delivery: 慢条斯理，像在核算一件再平常不过的事
        timbre: 干涩清楚
        pace: 稍慢
        pitch: 中
    sergeant:
      display_name: 警察中士
      tts:
        delivery: 粗声粗气，故作古老而庄严的腔调
        timbre: 粗厚有力
        pace: 中等
        pitch: 低
  chapters:
    - id: ch01
      title: 蟾蜍的时辰
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 初夏的早晨亮堂堂的。河水退回了平日的河岸，也恢复了平常的流速。火热的太阳像是给所有青绿、蓬松、带刺的植物系上细线，正把它们从土里往上拉。鼹鼠和河鼠天不亮就起床，为泛舟季开张忙个不停。他们给船刷油漆、涂清漆，修补船桨和坐垫，还到处找不见了的篙钩。两位忙过一阵，回到小客厅吃早饭。饭快吃完时，他们还兴冲冲地商量当天的安排，门上忽然传来一阵沉重的敲门声。
        - id: ch01-b02
          speaker: rat
          text: 真扫兴！鼹鼠，你已经吃完了，劳驾去看看是谁。
        - id: ch01-b03
          speaker: narrator
          text: 鼹鼠跑去应门，河鼠随即听见一声惊叫。客厅门猛地打开，鼹鼠郑重其事地宣布来客。
        - id: ch01-b04
          speaker: mole
          text: 獾先生来了！
          emotion: surprised
        - id: ch01-b05
          speaker: narrator
          text: 这可是稀奇事。獾几乎从不正式登门拜访谁。真有急事找他，要么趁清晨或傍晚，在树篱边截住悄悄赶路的他，要么深入野树林，到他家里去找。后一个办法可一点也不轻松。獾迈着沉重的步子进了房间，严肃地打量两个朋友。河鼠惊得把蛋勺掉在桌布上，张着嘴愣住了。
        - id: ch01-b06
          speaker: badger
          text: 时辰到了！
        - id: ch01-b07
          speaker: rat
          text: 什么时辰？
        - id: ch01-b08
          speaker: narrator
          text: 河鼠不安地瞟了一眼壁炉台上的钟。
        - id: ch01-b09
          speaker: badger
          text: 你该问是谁的时辰。自然是蟾蜍的！我说过，冬天一过去就要亲自管他。今天正是时候。
        - id: ch01-b10
          speaker: mole
          text: 对呀，是蟾蜍的时辰！好哇，我想起来了！咱们一定要教他变得通情达理。
          emotion: happy
        - id: ch01-b11
          speaker: narrator
          text: 獾坐进扶手椅，把昨晚得到的可靠消息告诉他们。今天早上，又有一辆崭新而且格外强劲的汽车要送到蟾宫，让蟾蜍先试一试。不合心意，还可以退回。说不定就在此刻，蟾蜍正在精心穿戴那套丑得出奇、自己却爱得要命的行头。原本还算漂亮的一只蟾蜍，只要那身东西一上身，就会变成一个可怕的怪物。任何心智正常的动物迎面撞见，恐怕都要当场猛烈抽搐起来。
        - id: ch01-b12
          speaker: badger
          text: 咱们得立刻行动，晚了就来不及。你们两个马上跟我去蟾宫，把他救回来。
        - id: ch01-b13
          speaker: rat
          text: 没问题！咱们去救这个可怜的家伙，好好感化他。等事情办完，他准是世上悔改得最彻底的蟾蜍！
        - id: ch01-b14
          speaker: narrator
          text: 三位踏上了这场仁慈的使命，獾领头，大家规规矩矩排成一列。动物结伴走路本来就该这样，既端正，又明白事理。要是横七竖八地占满道路，忽然遇上麻烦或危险，彼此一点忙也帮不上。他们来到蟾宫的车道，果然看见一辆硕大的新汽车停在屋前。车身闪闪发亮，还漆成了蟾蜍最喜欢的鲜红色。看来獾昨晚得到的消息一点没错。
        - id: ch01-b15
          speaker: narrator
          text: 大门突然打开。蟾蜍先生戴着风镜和帽子，扎着绑腿，裹着一件大得吓人的外套。他一边套上长手套，一边神气活现地走下台阶。一看见朋友，他立刻热情招呼。
        - id: ch01-b16
          speaker: toad
          text: 嘿，伙计们，快来！你们正好赶上，跟我一起痛痛快快地……一起去痛快……去……呃……
        - id: ch01-b17
          speaker: narrator
          text: 三位朋友一言不发，脸上的神情冷峻又坚定，丝毫没有让步的意思。蟾蜍那原本热烈响亮的嗓门越来越小，那句邀请最终卡在了半空，再也说不下去。獾大步走上台阶，叫河鼠和鼹鼠把他带进屋。蟾蜍一路挣扎抗议，还是被推进了门。獾转身告诉看守汽车的司机，蟾蜍先生改变了主意，今天不用车了，而且这件事已经定了，司机不必留下来等候。随后他也进屋，关紧大门。
        - id: ch01-b18
          speaker: badger
          text: 好了，第一件事，把你身上这些可笑的东西脱掉。
        - id: ch01-b19
          speaker: toad
          text: 我不脱！你们这样蛮横地欺负我，到底是什么意思？马上给我解释清楚！
          emotion: angry
        - id: ch01-b20
          speaker: badger
          text: 既然他不肯，你们两个替他脱。
        - id: ch01-b21
          speaker: narrator
          text: 真要动手，他们只能先把又踢又骂的蟾蜍按倒在地。他什么难听的话都喊出来了。只有这样，两个朋友才能真正动手。河鼠牢牢坐在他身上，鼹鼠一件接一件，慢慢脱掉他的风镜、帽子、绑腿和那件大外套。等整套汽车行头都被剥掉，他们才把蟾蜍重新扶起来站好。威风凛凛的盔甲一离身，他的嚣张气焰也跟着散了大半。现在，他不再是那个令人害怕的“公路煞星”，不过是一只普通蟾蜍。他有气无力地傻笑，挨个讨好地望着朋友，显然已经完全明白自己的处境。
        - id: ch01-b22
          speaker: badger
          text: 蟾蜍，你早知道迟早会有今天。大家警告过你多少次，你一句也不听。你不停挥霍父亲留下的钱，又疯狂开车，又撞车，还跟警察争吵，害得这一带的动物都跟着丢脸。独立自主没有错，可朋友出丑也得有个限度。你已经越过那条线了。你有不少好处，我不想对你太狠，所以再给你一次清醒的机会。跟我进吸烟室，听几句关于你自己的实话。出来以后，大家再看看你还是不是原来的蟾蜍。
        - id: ch01-b23
          speaker: narrator
          text: 獾牢牢抓住蟾蜍的胳膊，把他领进吸烟室，随手关上了门。接下来这场谈话，显然只准他们两个参加。
        - id: ch01-b24
          speaker: rat
          text: 这办法不会管用。跟蟾蜍讲道理治不好他，他什么话都肯说。
        - id: ch01-b25
          speaker: narrator
          text: 河鼠和鼹鼠舒舒服服地坐进扶手椅，耐心等着。紧闭的门那边传来獾低沉而连绵的说话声。他一刻不停地讲，声音时而高昂，时而低沉，像一阵又一阵浪。没过多久，这篇长长的训话中开始夹进拖得长长的哭声，而且隔一会儿就响一次。那当然是从蟾蜍胸膛里冒出来的。他本来就心软又重感情，别人只要说得动听些，不论什么道理，都能让他暂时信服。不过，也仅仅是暂时而已。
        - id: ch01-b26
          speaker: narrator
          text: 三刻钟以后，房门终于打开。獾神情庄重，牵着蟾蜍的一只爪子，把他带了出来。这只蟾蜍已经软绵绵的，垂头丧气。全身的皮都松垮下来，两条腿摇摇晃晃，脸颊上还留着一道道泪痕，那都是獾感人至深的训话催出来的。獾和气地让他坐下，又高兴地向朋友宣布，蟾蜍终于看清了自己的错误。他真心悔恨过去那些误入歧途的行为，也郑重答应从今往后彻底戒掉汽车，永远不再碰它。
        - id: ch01-b27
          speaker: mole
          text: 这真是个好消息。
        - id: ch01-b28
          speaker: rat
          text: 的确是大好消息。只要……只要……
        - id: ch01-b29
          speaker: narrator
          text: 河鼠紧盯着蟾蜍。他怀疑那双仍旧悲伤的眼睛里，正闪过一点难以察觉的亮光。獾却很满意，只想让蟾蜍当着朋友的面，把刚才承认的话再郑重说一遍。
        - id: ch01-b30
          speaker: badger
          text: 先说第一件。你后悔自己的所作所为，也看清那些事情有多愚蠢了，是不是？
        - id: ch01-b31
          speaker: narrator
          text: 屋里久久没有声音。蟾蜍绝望地朝这边看看，又朝那边看看，像是在寻找一条能逃出去的路。其他动物谁也没有催促，只是神情严肃地坐在那里，安静等着他的回答。最后，蟾蜍终于开口了。声音虽然有一点闷闷不乐，态度却十分坚定。
        - id: ch01-b32
          speaker: toad
          text: 不！我一点也不后悔，而且那些事根本不蠢。那简直棒极了！
        - id: ch01-b33
          speaker: badger
          text: 什么？你这个反复无常的家伙！刚才在里面，你明明亲口告诉我——
          emotion: angry
        - id: ch01-b34
          speaker: toad
          text: 对，对，在里面我当然那样说。只要待在那间屋里，我什么都会答应。亲爱的獾，你实在太能说了，句句动人，句句有道理，每一点都讲得好得吓人。你明知道，在那里你想把我说成什么样都行。可出来以后，我认真问了问自己，又把事情重想一遍。我其实一点也不难过，根本没有悔改。既然这样，嘴上硬说后悔又有什么用？
        - id: ch01-b35
          speaker: badger
          text: 所以，你不肯保证永远不再碰汽车？
        - id: ch01-b36
          speaker: toad
          text: 当然不肯！正相反，我郑重保证，下一次见到汽车，我马上“叭叭”两声，跳上去就开！
        - id: ch01-b37
          speaker: rat
          text: 我不是早告诉过你吗？
        - id: ch01-b38
          speaker: badger
          text: 那好。好言相劝既然不管用，咱们就试试强硬的办法。我一直怕事情会走到这一步。蟾蜍，你常请我们来这座美丽的大宅住些日子，现在我们就住下来。等你真正醒悟，我们才离开。你们两个把他带上楼，锁进卧室。咱们再商量后面的事。
    - id: ch02
      title: 看守与骗局
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 蟾蜍一路踢打挣扎，两个忠实的朋友还是把他拖上了楼。
        - id: ch02-b02
          speaker: rat
          text: 小蟾，这全是为你好。等你熬过这场病，咱们又能像从前那样快快活活地玩了。
          emotion: calm
        - id: ch02-b03
          speaker: mole
          text: 你没好起来以前，家里的事都交给我们。你的钱也会看好，再不让你白白糟蹋。
        - id: ch02-b04
          speaker: rat
          text: 以后也不会再跟警察闹出乱子了。
        - id: ch02-b05
          speaker: mole
          text: 更不用住上几个星期的医院，天天听女护士吩咐你。
        - id: ch02-b06
          speaker: narrator
          text: 他们把蟾蜍推进卧室，转动钥匙锁上门。三位走下楼梯时，蟾蜍还对着钥匙孔破口大骂。朋友们聚在一起，认真商量眼下的局面。獾叹着气说，这会是一件乏味又费时的工作。他从没见过蟾蜍这样固执，可大家既然开始了，就只能坚持到底。蟾蜍一刻也不能离开看守。他们必须轮流陪着他，一直等到汽车的毒瘾从他身体里彻底散去。
        - id: ch02-b07
          speaker: narrator
          text: 于是他们排好班次。夜里轮流睡在蟾蜍房里，白天也分段值守。最初，蟾蜍把几位看守折腾得够呛。病瘾一发作，他便把椅子排成一辆粗陋的汽车，缩在最前一张椅子上，身子前倾，死死望着前方，嘴里发出粗野又吓人的怪声。闹到最厉害时，他会翻一个完整的筋斗，仰面倒在散架的椅子中间。这样一来，他才暂时心满意足。
        - id: ch02-b08
          speaker: narrator
          text: 日子一天天过去，这些痛苦的发作渐渐没那么频繁。朋友们也想尽办法，要把他的心思引到别处，让他重新对新鲜事情产生兴趣。可蟾蜍对什么都提不起精神，看起来越来越疲倦，也越来越消沉。一个晴朗的早晨，轮到河鼠值班。他上楼接替獾，发现獾已经急着出门。他想在自己的树林里痛痛快快走上一大圈，再钻下去看看那些熟悉的地洞和穴窟，舒展舒展身体。
        - id: ch02-b09
          speaker: badger
          text: 蟾蜍还躺在床上。问什么都不肯好好答，只说别管他，他什么也不要，也许过一阵就会好，叫大家不必担心。你可得留神。蟾蜍越安静、越顺从，越装得像主日学校奖品故事里的好孩子，就越是诡计多端。准有事情要发生。我了解他。好了，我得走了。
        - id: ch02-b10
          speaker: rat
          text: 老伙计，今天感觉怎么样？
        - id: ch02-b11
          speaker: narrator
          text: 河鼠走到床边，却等了好几分钟，才听见一个虚弱的声音。
        - id: ch02-b12
          speaker: toad
          text: 真谢谢你，亲爱的河鼠。你特地来问，太好了。不过先说说你吧，你好吗？那位出色的鼹鼠又好吗？
        - id: ch02-b13
          speaker: rat
          text: 我们都好得很。鼹鼠要跟獾出去走走，午饭才回来。今天上午就剩咱们两个，我会想办法逗你开心。快起来吧，天气这么好，别躺在这里发闷。
        - id: ch02-b14
          speaker: toad
          text: 亲爱又善良的河鼠，你根本不知道我的情形。我离“起来”已经太远了，这辈子恐怕也起不来了。别为我费心，我最不愿拖累朋友，而且，我想自己也拖累不了多久了。说实话，我几乎希望这一天快点来。
          emotion: sad
        - id: ch02-b15
          speaker: rat
          text: 我也这么希望。你这些日子给大家添了许多麻烦，听说快结束了，我当然高兴。天气这么好，泛舟季又刚开始，你偏叫我们错过这么多乐趣。我们不怕照料你，可这实在太可惜了。
        - id: ch02-b16
          speaker: toad
          text: 我怕你们讨厌的正是照料我的麻烦。这很自然，我完全明白。你们已经厌烦我了，我不该再求人做事。我知道自己是个累赘。
        - id: ch02-b17
          speaker: rat
          text: 你的确是。不过，只要你肯做个明白事理的动物，不管多麻烦，我都愿意帮你。
        - id: ch02-b18
          speaker: toad
          text: 河鼠，要是我能相信这句话，就想最后求你一次。请你赶快去村里请医生，虽然现在也许已经太晚了。不过，还是别去了。那只会给你添麻烦，不如由着事情自己发展。
        - id: ch02-b19
          speaker: rat
          text: 你为什么需要医生？
        - id: ch02-b20
          speaker: narrator
          text: 河鼠走得更近，低头仔细打量蟾蜍。床上的家伙的确平平地躺在那里，一动也不动。他说话的声音比平时微弱得多，神态也和平日那个趾高气扬的蟾蜍完全不同。河鼠望着这副模样，心里渐渐有些不安了。
        - id: ch02-b21
          speaker: toad
          text: 最近的变化，你一定已经发现了……不过，你为什么会留意呢？留心也是麻烦。也许明天你会想，要是早点发现就好了，要是及时做点什么就好了。算了，别管这些，就当我没开口。
        - id: ch02-b22
          speaker: rat
          text: 老兄，你真觉得需要医生，我当然去请。可你的病还不至于那么严重吧。咱们说点别的。
        - id: ch02-b23
          speaker: toad
          text: 亲爱的朋友，到我这一步，说话恐怕已经没有用，医生大概也一样。可病人总要抓住最后一根稻草。对了，你出门正好会经过律师家。我实在不愿再添麻烦，可你能不能顺道请他也来？有那么一个时刻，不论人已经多虚弱，都得勉强处理几件不愉快的事情。
          emotion: sad
        - id: ch02-b24
          speaker: narrator
          text: 河鼠吓坏了。蟾蜍居然要找律师，看来病得真不轻。他匆匆走出房间，却没忘记小心锁好身后的门。到了外面，他又停下来想了想。獾和鼹鼠已经走远，身边没有谁可以商量。他知道蟾蜍从前也常毫无缘由地觉得自己病得要命，却从没听这家伙提出要找律师。为了稳妥，还是走一趟好。就算蟾蜍根本没病，医生也会骂他是个老傻瓜，叫他振作起来。那总算也有一点收获。这趟差事又花不了多久，于是河鼠决定顺着他，朝村子跑去。
        - id: ch02-b25
          speaker: narrator
          text: 钥匙刚在锁孔里转过，蟾蜍就轻快地跳下床。他急切地趴在窗口，盯着河鼠一路走出车道，直到再也看不见。随后他放声大笑，飞快穿上手边能找到的最漂亮的一套衣服，又拉开梳妆台的小抽屉，取出里面的现金，把自己的衣袋塞得满满的。接下来，他把床单一条条打结，做成一根绳子，一头牢牢系在都铎式窗户中央的竖框上。那扇漂亮的窗户原本就是卧室里最引人注目的装饰。蟾蜍从窗口爬出去，顺着绳子轻轻滑到地面，然后朝河鼠相反的方向大步走了，一路还吹着欢快的小调。
        - id: ch02-b26
          speaker: narrator
          text: 獾和鼹鼠终于回来吃午饭时，河鼠只好面对一顿愁云惨淡的饭。他坐在餐桌前，把自己那套可怜又无法叫人信服的经过从头讲了一遍。獾说了许多尖刻得近乎无情的话。那些话大概不难想象，所以这里就不必重复了。最叫河鼠难受的是，就连一直竭力站在他这一边、想替他开脱的鼹鼠，到最后也忍不住责备起来。
        - id: ch02-b27
          speaker: mole
          text: 河鼠，你这回真有点犯傻。骗你的偏偏还是蟾蜍！
        - id: ch02-b28
          speaker: rat
          text: 可他演得实在太像了。
          emotion: sad
        - id: ch02-b29
          speaker: badger
          text: 他把你骗得才叫厉害！再说也没用了，他肯定已经逃远。最糟的是，他会为自己那点所谓的聪明得意忘形，什么蠢事都可能做。好在咱们自由了，不必再浪费时间站岗。不过最近还得住在蟾宫。说不定哪一刻，蟾蜍就会被送回来，不是躺在担架上，就是夹在两个警察中间。
          emotion: angry
        - id: ch02-b30
          speaker: narrator
          text: 獾说这番话时，还不知道未来会发生什么，也不知道要有多少浑水流过桥下，蟾蜍才能再次安稳地坐进祖传的蟾宫。
    - id: ch03
      title: 公路煞星
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 与此同时，那个快活又毫无责任心的逃犯正在几英里外的大路上轻快前进。起先，蟾蜍怕有人追赶，专挑偏僻小路，穿过一片又一片田野，还故意几次改变方向。走到这里，他觉得再也不会被抓回去了。阳光笑吟吟地照着他，大自然里的一切仿佛也加入了赞美的合唱，同他心里那首自吹自擂的歌彼此应和。他心满意足，又满心自负，走着走着，几乎要在路上跳起舞来。
        - id: ch03-b02
          speaker: toad
          text: 这一手真漂亮！脑筋对蛮力，当然是脑筋赢，事情本来就该如此。可怜的河鼠！獾回去以后，他可要倒霉了。河鼠人不错，也有不少优点，可惜脑子太少，又完全没受过教育。改天我得亲自教导他，看看能不能把他培养成才。
          emotion: happy
        - id: ch03-b03
          speaker: narrator
          text: 蟾蜍昂首阔步，满脑子都是这种洋洋得意的念头。他一路走进一座小镇。走到大街一半时，看见“红狮客栈”的招牌横在路上方，正迎风摇摆。这块招牌提醒了他，自己今天根本没有吃早饭。走了这么远，他早已饿得厉害。于是蟾蜍大模大样地走进客栈，吩咐店里的人在这么短的时间里尽力做出一顿最好的午餐，然后坐进咖啡厅，舒舒服服吃起来。
        - id: ch03-b04
          speaker: narrator
          text: 饭吃到一半，街上传来一个熟悉得不能再熟悉的声音。蟾蜍猛地一颤，全身都发起抖来。“叭叭”声越来越近，他听见汽车转进客栈后院，随后停住了。蟾蜍只好紧紧抓住桌腿，才能藏住那股压倒一切的激动。不久，车上的旅客走进咖啡厅。他们个个饥肠辘辘，却又谈笑风生，兴高采烈。大家滔滔不绝地讲着上午的经历，也不停夸奖那辆汽车，说它一路把他们载得又快又顺。蟾蜍坐在一旁全神贯注地听着，浑身上下仿佛只剩下两只耳朵。
        - id: ch03-b05
          speaker: narrator
          text: 蟾蜍竖起耳朵听了半天，终于再也忍不住。他悄悄溜出房间，到柜台结清账，若无其事地绕进客栈后院。
        - id: ch03-b06
          speaker: toad
          text: 我只是看一眼而已。看看总不会有害处。
        - id: ch03-b07
          speaker: narrator
          text: 汽车停在院子正中央，身边一个看守的人也没有。整个院子静悄悄的。马厩里的小工和那些平时在院中闲逛的人，这会儿全都去吃午饭了。蟾蜍慢慢绕着汽车走了一圈又一圈。他先从头到尾仔细查看，又摆出懂行的样子评点挑剔，随后停下来，对着这辆车陷入深深的沉思。
        - id: ch03-b08
          speaker: toad
          text: 真不知道……这种汽车是不是很容易发动？
        - id: ch03-b09
          speaker: narrator
          text: 下一刻，他几乎不知道发生了什么，只发现手里已经握住摇柄，正在用力转动。熟悉的声响一传来，旧日狂热便攫住了他，把他的身体和灵魂全都征服。他像在梦里一样坐进驾驶座，又像在梦里拉动操纵杆，让车在院内掉头，冲出拱门。那一刻，他分辨不出是非，也忘掉了必然后果。
        - id: ch03-b10
          speaker: narrator
          text: 蟾蜍不断加速。汽车一口吞掉小镇的街道，又从街道上猛然跃出，冲上通往开阔乡野的大路。他只知道，自己又成了蟾蜍，最神气、最了不起的蟾蜍。那个叫人胆寒的蟾蜍，那个喝退所有车辆的蟾蜍，那个独占荒野大道的蟾蜍大王，全都回来了。挡在面前的一切，要么乖乖让路，要么就会被撞成碎片，永远坠进黑夜。他一路飞驰，一路高声吟唱，汽车用洪亮的轰鸣回应。路程飞快消失在车轮下面。他不知道自己要去哪里，只顾服从本能，尽情享受属于自己的时刻，完全不管最后会落得怎样的下场。
    - id: ch04
      title: 二十年
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 等我们再见到蟾蜍时，他已经缩在治安法庭的被告席里。庭长显得十分愉快，仿佛眼前这个案子清楚得不能再清楚。
        - id: ch04-b02
          speaker: chairman
          text: 依我看，本案只有一个难题。我们怎样才能让眼前这个积习不改的恶棍、铁石心肠的暴徒，受到足够严厉的惩罚？证据明白无误，他有三项罪名。第一，偷窃一辆贵重汽车。第二，危险驾驶，危害公众。第三，对乡村警察极端无礼。书记员先生，请告诉我们，这三项罪各自能判多重？当然，不能替犯人保留任何疑点，因为这里根本没有疑点。
        - id: ch04-b03
          speaker: narrator
          text: 书记员拿笔挠了挠鼻子，慢条斯理地算起来。
        - id: ch04-b04
          speaker: clerk
          text: 有人会说，偷汽车最严重，事实也确实如此。不过，顶撞警察的刑罚毫无疑问最重，本来也应该这样。偷车判十二个月，这很轻。疯狂驾驶判三年，这很宽大。至于顶嘴，就判十五年吧。按照证人席上的说法，那些话实在恶劣。哪怕只信十分之一也够了，反正我自己从不多信。只要加法没错，一共是十九年。
        - id: ch04-b05
          speaker: chairman
          text: 好极了！
        - id: ch04-b06
          speaker: clerk
          text: 所以，为稳妥起见，最好凑成整数，判二十年。
        - id: ch04-b07
          speaker: chairman
          text: 非常出色的建议！犯人，振作一点，尽量站直。这一次判你二十年。记住，如果你以后又因任何罪名来到我们面前，我们就不得不严肃处置你了！
        - id: ch04-b08
          speaker: narrator
          text: 法律手下那些凶蛮的爪牙立刻扑上来，给不幸的蟾蜍套上沉重锁链。他们把他拖出法院，任凭他一路尖叫、哀求、抗议。穿过集市广场时，看热闹的人向他发起一阵袭击。他们送来的是嘲笑、胡萝卜，还有当时最流行的口号。罪犯一旦被抓住，这些人总是铁面无情。可罪犯仅仅还在“通缉中”时，他们倒常常满怀同情，也很愿意伸手相助。
        - id: ch04-b09
          speaker: narrator
          text: 一群学童也朝他大声起哄。孩子们天真无邪的脸上满是快乐，因为看见一位绅士陷入困境，总能叫他们由衷高兴。一行人继续前进，踏过脚下发出空洞咚咚声的吊桥，从尖刺密布的铁闸下面走过，又穿过一座神色阴沉的森严拱门，终于进了那座可怕的古堡。古老的高塔从他们头顶一直耸向天空。
        - id: ch04-b10
          speaker: narrator
          text: 他们经过警卫室，许多不当班的士兵挤在里面，冲着蟾蜍咧嘴发笑。再往前，一个个站岗的哨兵发出可怕又讥讽的咳嗽声。哨兵不能擅离岗位，也不敢随便说话，所以若想表达对罪行的鄙夷和憎恶，最多只能做到这一步。接着，他们爬上年深日久、已经磨损的盘旋楼梯。路旁站着头戴钢盔、身穿钢甲的武士，一个个隔着面甲，朝蟾蜍投来威吓的目光。
        - id: ch04-b11
          speaker: narrator
          text: 他们又穿过一座座庭院。凶猛的獒犬挣紧锁链，两只前爪抓向半空，一心想扑到蟾蜍身上。再往前，是几个年迈的狱卒。长戟斜倚在墙边，老狱卒们却守着馅饼和一大杯棕色麦酒，昏昏欲睡。一行人仍然向前，走过刑架室，又走过拇指夹刑室，还经过了通往私人绞刑台的岔路。最后，他们终于抵达城堡最内层主楼的中心。
        - id: ch04-b12
          speaker: narrator
          text: 城堡最内层的中心，藏着全堡最阴森、最偏远的地牢。他们终于在牢门前停下。一个年老的狱卒坐在那里，枯瘦的手指漫不经心地拨弄着一大串硕大的钥匙。一路押送蟾蜍来到这里，连警察中士也累得够呛。他摘下头盔，抬手擦了擦额头，然后对着昏昏沉沉的老狱卒高声喊道。
        - id: ch04-b13
          speaker: sergeant
          text: 老天在上！醒醒，你这个老糊涂，把这只卑劣的蟾蜍接过去！他罪恶滔天，又狡猾透顶，什么手段都会使。拿出全部本事，白天黑夜都看牢他。老灰胡子，你听清楚。要是出了任何差错，你的脑袋就得替他的脑袋负责。愿瘟疫把你们两个一起带走！
        - id: ch04-b14
          speaker: narrator
          text: 老狱卒阴沉地点点头，把枯瘦的手放到可怜的蟾蜍肩上。生锈的钥匙在锁孔里吱嘎转动，沉重的大门在他们身后轰然关闭。就这样，蟾蜍成了一个无助的囚徒。英格兰这片欢乐国土上，有一座最坚固的城堡。城堡里有一座守卫最森严的内堡，内堡最深处藏着一间最偏远的地牢，而蟾蜍就被牢牢锁在其中。
