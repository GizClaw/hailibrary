  chapters:
    - id: ch01
      title: The Hour of Toad
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: It was a bright morning at the beginning of summer. The river was back inside its usual banks and moving at its usual pace. Under the hot sun, every green, bushy, prickly thing seemed to be pulled straight up from the earth by invisible strings. Mole and Water Rat had been awake since dawn, getting ready for boating season. They painted and varnished, fixed paddles and cushions, and searched for missing boat hooks. Now they were finishing breakfast in their little parlor and eagerly planning the day when a heavy knock struck the door.
        - id: ch01-b02
          speaker: water_rat
          text: Oh, bother! Mole, old fellow, would you see who that is? You've finished eating, and I'm covered in egg.
        - id: ch01-b03
          speaker: narrator
          text: Mole went to answer. Rat heard a startled cry from the hall. Then Mole threw open the parlor door and made a grand announcement.
        - id: ch01-b04
          speaker: mole
          text: Mr. Badger!
          emotion: surprised
        - id: ch01-b05
          speaker: narrator
          text: A formal visit from Badger was remarkable. In fact, any visit from Badger was remarkable. If you needed him, you generally had to catch him slipping beside a hedge early in the morning or late at night. Otherwise, you had to hunt for his house in the middle of the Wild Wood, and that was a serious undertaking. Badger came heavily into the room and studied the two animals with a deeply serious face. Rat dropped his egg spoon onto the tablecloth and stared with his mouth open.
        - id: ch01-b06
          speaker: badger
          text: The hour has come!
        - id: ch01-b07
          speaker: water_rat
          text: What hour?
        - id: ch01-b08
          speaker: narrator
          text: Rat glanced uneasily at the clock on the mantel.
        - id: ch01-b09
          speaker: badger
          text: You should ask whose hour. It is Toad's hour! I said I would deal with him once winter was properly over, and today I mean to do it.
        - id: ch01-b10
          speaker: mole
          text: Toad's hour! Of course! Hooray! We'll finally teach him to be sensible.
          emotion: happy
        - id: ch01-b11
          speaker: narrator
          text: Badger settled into an armchair and told them what he had learned from a reliable source the night before. Another new motorcar, unusually powerful, was coming to Toad Hall that morning for Toad to try and either buy or return. At that very moment, Badger said, Toad might be dressing himself in the hideous clothes he loved so much. Those clothes could turn a fairly good-looking Toad into such a dreadful object that any decent animal who met him would be thrown into fits.
        - id: ch01-b12
          speaker: badger
          text: We have to act before it is too late. You two are coming with me to Toad Hall at once. Today, we rescue him.
        - id: ch01-b13
          speaker: water_rat
          text: Right! We'll save the poor fellow. We'll reform him so completely, no Toad was ever more reformed.
        - id: ch01-b14
          speaker: narrator
          text: They set out on their mission of mercy with Badger in front. When animals travel together, they walk properly in single file. They do not spread across the whole road, where they would be no help to one another if trouble suddenly appeared. At the drive to Toad Hall, they found exactly what Badger expected. A huge, gleaming new motorcar stood before the house, painted bright red, Toad's favorite color. As they came close, the front door flew open. Toad swaggered down the steps in goggles, cap, gaiters, and an enormous overcoat. As he came, he was pulling on his heavy driving gloves.
        - id: ch01-b15
          speaker: toad
          text: Hello, fellows! Come along! You're just in time to join me for a wonderful... for a wonderful... well, for a...
        - id: ch01-b16
          speaker: narrator
          text: His cheerful voice stumbled, grew weaker, and finally disappeared. His three friends had not answered a word. They only stood there with stern, unbending looks on their faces. Under those looks, Toad's invitation was left hanging unfinished in the air. Badger marched straight up the steps.
        - id: ch01-b17
          speaker: badger
          text: Take him inside.
        - id: ch01-b18
          speaker: narrator
          text: Rat and Mole hustled Toad through the door while he kicked and protested. Badger turned to the chauffeur who had brought the motorcar.
        - id: ch01-b19
          speaker: badger
          text: I'm afraid we won't need you today. Mr. Toad has changed his mind and will not be taking the car. That decision is final, so there is no reason to wait.
        - id: ch01-b20
          speaker: narrator
          text: The chauffeur was sent away. Badger went inside and shut the door. When all four animals stood together in the hall, he pointed at Toad's motoring outfit.
        - id: ch01-b21
          speaker: badger
          text: First, take off those ridiculous things.
        - id: ch01-b22
          speaker: toad
          text: I will not! What is the meaning of this outrageous treatment? I demand an explanation this instant!
          emotion: angry
        - id: ch01-b23
          speaker: badger
          text: Then you two will have to take them off for him.
        - id: ch01-b24
          speaker: narrator
          text: They stretched Toad out on the floor. He kicked and called them every name he could think of, but Rat sat on him while Mole removed the motor clothes one piece at a time. When they stood him upright again, much of his bluster seemed to have disappeared with his splendid armor. He was only Toad now, no longer the Terror of the Highway. He gave a weak giggle and looked from friend to friend for sympathy. He seemed to understand exactly what was happening.
        - id: ch01-b25
          speaker: badger
          text: You knew this had to happen sooner or later, Toad. You ignored every warning we gave you. You've wasted the money your father left, and your wild driving, your crashes, and your quarrels with the police are giving all of us animals a bad name. Independence is fine, but we do not stand by forever while a friend makes a fool of himself. You have reached the limit. You have plenty of good in you, and I don't want to be too harsh. So I am making one last effort to bring you to your senses. Come with me into the smoking room. There, you will hear a few facts about yourself. Then we'll see whether the same Toad comes out who went in.
        - id: ch01-b26
          speaker: narrator
          text: Badger gripped Toad firmly by the arm, led him into the smoking room, and closed the door behind them.
        - id: ch01-b27
          speaker: water_rat
          text: That will never work. You can't cure Toad by talking. He'll agree to anything while Badger has him in there.
        - id: ch01-b28
          speaker: narrator
          text: Rat and Mole made themselves comfortable in armchairs and waited. Through the closed door came the long, steady hum of Badger's voice, rising and falling in great waves. Before long, drawn-out sobs began to break through his sermon. They clearly came from Toad, who was affectionate and tenderhearted, and could easily be converted to any opinion for a little while.
    - id: ch02
      title: A Promise That Would Not Last
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: About three quarters of an hour later, the door opened. Badger came out solemnly, leading a limp and miserable Toad by the paw. Toad's skin hung loosely around him. His legs shook so badly that he could hardly stand, and the flood of tears brought on by Badger's moving speech had cut deep tracks down both cheeks.
        - id: ch02-b02
          speaker: badger
          text: Sit here, Toad. My friends, I am glad to tell you that Toad finally understands how wrong he has been. He truly regrets his foolish behavior, and he has agreed to give up motorcars completely and forever. He has given me his solemn promise.
        - id: ch02-b03
          speaker: mole
          text: That is very good news.
        - id: ch02-b04
          speaker: water_rat
          text: Very good news indeed. If only... well, if only...
        - id: ch02-b05
          speaker: narrator
          text: Rat kept a sharp eye on Toad. In that sorrowful face, he thought he saw the faintest twinkle.
        - id: ch02-b06
          speaker: badger
          text: There is just one more thing. Toad, repeat in front of your friends what you admitted to me a moment ago. First, you regret what you did, and you understand how foolish it all was. Is that right?
        - id: ch02-b07
          speaker: narrator
          text: A long silence followed. Toad looked desperately from side to side. The others waited without a word. At last, he answered.
        - id: ch02-b08
          speaker: toad
          text: No. I don't regret it. And it wasn't foolish. It was glorious!
        - id: ch02-b09
          speaker: badger
          text: What? You faithless animal! Didn't you tell me, right there in that room—
          emotion: surprised
        - id: ch02-b10
          speaker: toad
          text: Oh, yes, in there. I would have told you anything in there. You speak so beautifully, dear Badger. You're so touching and convincing, and you make every point so terribly well. In that room, you can do anything you like with me, and you know it. But since I came out, I've searched my feelings and gone over the whole matter. The truth is, I'm not sorry at all. I don't really repent, so what good would it do to claim that I do?
        - id: ch02-b11
          speaker: badger
          text: Then you refuse to promise that you will never touch a motorcar again?
        - id: ch02-b12
          speaker: toad
          text: Of course I refuse! In fact, I solemnly promise that the first motorcar I see, it's poop-poop and away I go!
        - id: ch02-b13
          speaker: water_rat
          text: Just what I told you, Mole.
        - id: ch02-b14
          speaker: badger
          text: Very well. If persuasion won't move you, we will see what force can do. I was afraid it would end this way. You have often invited the three of us to stay in this fine house, Toad. Now we accept. We will remain until you have learned some sense, and not leave a moment sooner. Take him upstairs, both of you. Lock him in his bedroom while we decide how to manage things.
        - id: ch02-b15
          speaker: narrator
          text: Rat and Mole dragged their struggling, kicking friend up the stairs.
        - id: ch02-b16
          speaker: water_rat
          text: This is for your own good, Toady. Once this painful attack has passed, think how much fun we'll have together, just like we used to.
        - id: ch02-b17
          speaker: mole
          text: We'll look after everything until you're better. And we won't let you throw away any more of your money.
        - id: ch02-b18
          speaker: narrator
          text: At the bedroom door, Rat gave him one final comfort.
        - id: ch02-b19
          speaker: water_rat
          text: There will be no more unfortunate trouble with the police, either.
        - id: ch02-b20
          speaker: mole
          text: And no more weeks in the hospital with nurses ordering you around.
        - id: ch02-b21
          speaker: narrator
          text: They pushed Toad inside, turned the key, and went downstairs while he shouted insults through the keyhole. Then the three friends held a conference.
        - id: ch02-b22
          speaker: badger
          text: This will be a tiresome business. I have never seen him so stubborn, but we must see it through. He cannot be left alone for an instant. One of us must stay with him until this poison has worked its way out of him.
        - id: ch02-b23
          speaker: narrator
          text: They divided the watches. At night, they took turns sleeping in Toad's room. They split the daylight hours among themselves, too. At first, Toad was extremely difficult for his careful guards. Whenever the fever for driving seized him, he arranged the bedroom chairs into the rough shape of a motorcar. He crouched over the front chair, bent forward with his eyes fixed fiercely on the road he imagined ahead. Then he filled the room with horrible engine noises. At the grand finish, he turned a complete somersault and landed flat among the wrecked chairs. For the moment, that seemed to satisfy him completely. As the days passed, these wild attacks slowly came less often. His friends worked hard to turn his mind toward fresh interests. But his old curiosity about other things did not return. He only seemed to grow weaker and more gloomy.
    - id: ch03
      title: Toad's Escape
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: One fine morning, Rat went upstairs to begin his watch. Badger was waiting outside the bedroom door, restless to get away. He wanted a long walk through his woods, down among his tunnels and burrows.
        - id: ch03-b02
          speaker: badger
          text: Toad is still in bed. All he'll say is, “Please leave him alone. He wants nothing. Perhaps he'll improve later. It may pass with time. Don't be too worried.” That sort of thing. Watch him carefully, Rat. When Toad turns quiet and obedient and acts like the perfect child in a Sunday-school story, he is at his most cunning. Something is certainly going on. I know him. Now I must be off.
        - id: ch03-b03
          speaker: narrator
          text: Rat went in and walked cheerfully toward the bed.
        - id: ch03-b04
          speaker: water_rat
          text: How are you feeling today, old fellow?
        - id: ch03-b05
          speaker: narrator
          text: Several minutes passed before Toad answered. At last, a weak little voice came from the bed.
        - id: ch03-b06
          speaker: toad
          text: Thank you so much, dear Ratty. How kind of you to ask. But first, tell me how you are, and how our excellent Mole is doing.
        - id: ch03-b07
          speaker: water_rat
          text: Oh, we're perfectly well. Mole has gone out for a walk with Badger. They won't be back until lunch, so you and I can have a pleasant morning together. I'll do everything I can to entertain you. Now be a good fellow and get up. Don't lie there moping on a beautiful morning.
        - id: ch03-b08
          speaker: toad
          text: Dear, kind Rat. You have no idea how serious my condition is, or how impossible it would be for me to get up now. Perhaps I never will. But don't worry about me. I hate to burden my friends, and I don't think I will burden them much longer. To tell the truth, I almost hope I won't.
          emotion: sad
        - id: ch03-b09
          speaker: water_rat
          text: I hope it stops soon, too! You've been a terrible bother all this time. And now the weather is fine and boating season has begun. It isn't the work we mind, Toad. It's all the wonderful things you're making us miss.
        - id: ch03-b10
          speaker: toad
          text: I'm afraid it is the work you mind. I understand completely. Of course you've grown tired of looking after me. I must not ask you to do anything more. I know what a nuisance I am.
        - id: ch03-b11
          speaker: water_rat
          text: You certainly are. But I would go to any amount of trouble for you if you would only behave sensibly.
        - id: ch03-b12
          speaker: toad
          text: If I could believe that, Ratty, then I might ask one last favor. Please hurry to the village and bring the doctor. Though even now, perhaps, it is already too late. No, don't bother. It will only cause trouble. Maybe we should simply let matters run their course.
          emotion: sad
        - id: ch03-b13
          speaker: water_rat
          text: Why do you need a doctor?
        - id: ch03-b14
          speaker: narrator
          text: Rat came closer and examined him. Toad truly was lying very flat and still. His voice sounded weaker, and his whole manner had changed.
        - id: ch03-b15
          speaker: toad
          text: Surely you have noticed what has been happening lately... But why should you notice? Paying attention is such a bother. Tomorrow, perhaps, you'll say, “If only I had seen it sooner! If only I had done something!” Still, never mind. Forget that I mentioned it.
        - id: ch03-b16
          speaker: water_rat
          text: Listen, old man. If you honestly believe you need a doctor, then of course I'll get one. But you can hardly be that ill yet. Let's talk about something else.
        - id: ch03-b17
          speaker: toad
          text: Dear friend, I fear talk cannot help a case like mine. Perhaps doctors cannot help, either. Still, a person must grasp at the smallest hope. Oh, and since you'll pass his door anyway, would you ask the lawyer to come up as well? I hate to give you more trouble. But there comes a moment when one must face unpleasant duties, no matter how little strength remains.
          emotion: sad
        - id: ch03-b18
          speaker: narrator
          text: Rat was frightened. A lawyer! Toad must really be ill. He hurried from the room, though he did remember to lock the door carefully behind him. Outside, he stopped and thought. Badger and Mole were far away, and there was no one to advise him.
        - id: ch03-b19
          speaker: water_rat
          text: Better to be safe. Toad has imagined himself terribly sick before when nothing was wrong, but he has never asked for a lawyer. If he isn't really ill, the doctor will call him an old fool and cheer him up. At least that will help. I had better humor him and go. It won't take long.
        - id: ch03-b20
          speaker: narrator
          text: Rat ran toward the village on his errand of mercy. The instant Toad heard the key turn in the lock, he sprang lightly from bed. He hurried to the window and watched eagerly until Rat disappeared at the far end of the drive. Then he burst into happy laughter. He dressed as fast as he could in the finest suit he could find at that moment. From a small drawer in the dressing table, he took enough money to fill his pockets. Next, he knotted his bedsheets together into a rope. He tied one end firmly around the center post of the handsome old Tudor window that was such a grand feature of his bedroom. He scrambled outside, slid lightly to the ground, and headed in the direction opposite from Rat. Off he marched with a light heart, whistling a cheerful tune.
        - id: ch03-b21
          speaker: narrator
          text: Lunch was a gloomy meal for Rat. When Badger and Mole finally returned, he had to sit at the table and tell them his weak and unconvincing story. Badger answered with remarks so sharp, and even brutal, that they are better left to the imagination. What hurt Rat most was that even loyal Mole could not fully defend him. Mole took his side wherever he could, then had to admit the truth.
        - id: ch03-b22
          speaker: mole
          text: You were a bit of a fool this time, Ratty. And with Toad, of all animals!
        - id: ch03-b23
          speaker: water_rat
          text: He acted it extremely well.
        - id: ch03-b24
          speaker: badger
          text: He fooled you extremely well! But talk won't repair this. He has escaped for now, and that's certain. Worse, he'll be so proud of his own cleverness that he may do anything foolish. At least we are free. We no longer have to waste our time standing guard. Still, we should sleep at Toad Hall a little longer. Any moment, they may bring him home on a stretcher or between two policemen.
          emotion: angry
        - id: ch03-b25
          speaker: narrator
          text: Badger said this without knowing what the future held. He could not guess how much dark and troubled water would flow under the bridges before Toad sat peacefully in his family home again.
    - id: ch04
      title: Poop-Poop on the Open Road
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: Meanwhile, the cheerful and irresponsible Toad was striding down the main road, already miles from home. At first he had kept to small paths, crossed field after field, and changed direction several times in case anyone followed him. By now, he felt sure he was safe from capture. The bright sun seemed to smile directly at him. To Toad, every part of nature joined in a great approving chorus, singing along with the song of self-praise inside his heart. He almost danced down the road, bursting with satisfaction and pride in his own cleverness.
        - id: ch04-b02
          speaker: toad
          text: That was a brilliant piece of work! It was brains against brute strength, and naturally brains won. Poor old Ratty! Just imagine what Badger will say when he comes back. Rat is a worthy fellow with many fine qualities, but he has almost no intelligence and absolutely no education. One day, I must take charge of him and see whether I can improve him.
        - id: ch04-b03
          speaker: narrator
          text: With his head high and his thoughts full of his own cleverness, Toad walked on until he reached a little town. Halfway down the main street, a sign swung across the road. It read “The Red Lion.” The sight reminded Toad that he had eaten no breakfast that day. After walking so many miles, he was now extremely hungry. He marched into the inn, ordered the best lunch they could prepare on short notice, and sat down in the coffee room to eat it.
        - id: ch04-b04
          speaker: narrator
          text: He was halfway through the meal when a sound he knew far too well came up the street. Toad started and began to tremble all over. Poop-poop! It came closer. Then he heard the motorcar turn into the inn yard and stop. His feelings were so powerful that he had to grip the table leg to hide them. Soon, the travelers entered the coffee room. They were hungry, cheerful, and full of talk about their morning adventures and the splendid machine that had carried them so well.
        - id: ch04-b05
          speaker: narrator
          text: Toad sat with every bit of his attention fixed on their conversation. At last, he could bear no more. He slipped quietly out of the room and paid his bill at the bar. Once outside, he wandered as casually as he could into the inn yard.
        - id: ch04-b06
          speaker: toad
          text: Surely there can be no harm in simply looking at it.
        - id: ch04-b07
          speaker: narrator
          text: The motorcar stood alone in the middle of the yard. The stable workers and everyone else nearby were indoors eating. Toad moved slowly around the car. He inspected it, judged it, and thought deeply.
        - id: ch04-b08
          speaker: toad
          text: I wonder... does this kind of car start easily?
        - id: ch04-b09
          speaker: narrator
          text: In the next moment, though he hardly knew how it happened, his hand was on the starting handle and turning it. The familiar engine sound burst out. At once, Toad's old passion seized him and ruled him completely, body and soul. It was like a dream. Somehow, he was sitting in the driver's seat. Still dreaming, he pulled the lever, swung the motorcar around the yard, and drove straight through the archway.
        - id: ch04-b10
          speaker: narrator
          text: For that moment, every sense of right and wrong vanished. So did every fear of the plain consequences. Toad drove faster. The car swallowed the town street and sprang onto the highway through the open country. He knew only that he was Toad again. He was Toad at his greatest, Toad the terror, master of the traffic and lord of the lonely road. Everyone must move aside or be crushed into nothing and endless night.
        - id: ch04-b11
          speaker: narrator
          text: Toad chanted as he flew, and the motor answered with its deep, ringing drone. Mile after mile disappeared beneath him. He had no idea where he was going. He was following his deepest desire, living his great hour, and caring nothing for whatever might come next.
    - id: ch05
      title: Twenty Years
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: The next voice Toad heard belonged to the cheerful Chairman of the Bench of Magistrates.
        - id: ch05-b02
          speaker: chairman
          text: There is only one difficulty in this otherwise perfectly clear case. How can we make the punishment hot enough for the hopeless rogue and hardened ruffian now cowering in the dock? Let me review the charges. The evidence proves, first, that he stole a valuable motorcar. Second, that he drove in a way that endangered the public. And third, that he was shockingly rude to the country police. Mr. Clerk, please tell us the very heaviest sentence allowed for each offense. Naturally, we will not give the prisoner the benefit of any doubt, because no doubt exists.
        - id: ch05-b03
          speaker: narrator
          text: The Clerk scratched his nose with his pen before answering.
        - id: ch05-b04
          speaker: clerk
          text: Some people might say that stealing the motorcar was the worst offense, and indeed it was. But insulting the police carries the hardest punishment, as it certainly should. We might give him twelve months for the theft, which is mild. Then three years for the furious driving, which is lenient. Finally, fifteen years for his rude behavior. From what the witnesses told us, it was remarkably bad behavior, even if we believe only one tenth of their evidence. I never believe more than that myself. If I have added correctly, those sentences make nineteen years.
        - id: ch05-b05
          speaker: chairman
          text: Excellent!
          emotion: happy
        - id: ch05-b06
          speaker: clerk
          text: So it would be safer to make the total a round twenty years.
        - id: ch05-b07
          speaker: chairman
          text: An admirable suggestion! Prisoner, pull yourself together and try to stand straight. This time, you are going to prison for twenty years. And remember, if you ever appear before us again on any charge at all, we shall be forced to treat you seriously.
        - id: ch05-b08
          speaker: narrator
          text: Then the brutal servants of the law fell upon the miserable Toad. They loaded him down with chains and dragged him from the courthouse. Toad shrieked, begged, and protested every step of the way, but no one listened. Across the busy marketplace they hauled him, while the playful crowd showered him with jeers, carrots, and whatever popular insults came to mind. These people were always terribly hard on a criminal once he was caught, though they were wonderfully sympathetic and helpful while he was merely wanted by the police.
        - id: ch05-b09
          speaker: narrator
          text: They passed rows of schoolchildren who hooted at him as he went by. The children's innocent faces shone with the special pleasure they always found in seeing a gentleman in trouble. On went Toad across a drawbridge that rang hollow under every footstep. They pulled him beneath a sharp, spiked portcullis and through the frowning arch of a grim old castle. Its ancient towers rose high above his head.
        - id: ch05-b10
          speaker: narrator
          text: They dragged him past guardrooms filled with grinning soldiers who were off duty. The sentries at their posts could not openly mock him, so they gave horrible, sarcastic coughs to show what they thought of crime. Up worn, winding stairs went the procession. They passed men-at-arms dressed in steel helmets and breastplates, who shot threatening looks through their visors.
        - id: ch05-b11
          speaker: narrator
          text: They crossed one courtyard after another. Great dogs strained at their leashes and pawed the air, eager to reach him. They went by ancient guards who had leaned their long weapons against the wall and fallen asleep over meat pies and mugs of brown ale. Still the chains rattled on. The procession passed the torture room with its rack, then the room with the thumbscrews. They went by the turning that led to the private scaffold. At last, in the very heart of the innermost keep, they reached the door of the grimmest dungeon in the castle. Only then did they stop. Beside the door sat an ancient jailer, slowly fingering a bunch of enormous keys.
        - id: ch05-b12
          speaker: police_sergeant
          text: Oddsbodikins! Wake up, you old fool, and take this vile Toad from us. He is a criminal of the deepest guilt, and no one can match his tricks or clever escapes. Guard him with all your skill, graybeard. If anything goes wrong, your old head will answer for his. And may a plague fall on both of you!
        - id: ch05-b13
          speaker: narrator
          text: The jailer nodded grimly and laid one withered hand on the wretched Toad's shoulder. A rusty key creaked in the lock. The great door clanged shut behind them.
        - id: ch05-b14
          speaker: narrator
          text: Toad was helpless now, imprisoned in the most distant dungeon of the best-guarded keep in the strongest castle in all Merry England.
