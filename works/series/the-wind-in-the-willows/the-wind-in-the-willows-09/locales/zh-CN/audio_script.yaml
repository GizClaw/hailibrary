audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖从容，带着含蓄的幽默和讲故事的亲近感
        timbre: 清润沉稳
        pace: 中等偏慢
        pitch: 中
    rat:
      display_name: 河鼠
      tts:
        delivery: 热情敏感，平日爽朗笃定，受诱惑时渐显恍惚急切
        timbre: 清亮温厚
        pace: 中等
        pitch: 中
    field_mouse_1:
      display_name: 田鼠甲
      tts:
        delivery: 忙碌务实，答话时略带难为情
        timbre: 轻巧朴实
        pace: 中等偏快
        pitch: 中高
    field_mouse_2:
      display_name: 田鼠乙
      tts:
        delivery: 直率利落，忙乱时有些生硬
        timbre: 明快清脆
        pace: 中等偏快
        pitch: 中高
    field_mouse_3:
      display_name: 田鼠丙
      tts:
        delivery: 勤快随和，说话带着乡野生活的朴素劲头
        timbre: 柔和轻快
        pace: 中等
        pitch: 中高
    swallow_1:
      display_name: 燕子甲
      tts:
        delivery: 轻盈开朗，谈起迁徙时兴致盎然
        timbre: 清脆明亮
        pace: 中等偏快
        pitch: 高
    swallow_2:
      display_name: 燕子乙
      tts:
        delivery: 梦幻而热烈，回忆远方时充满向往
        timbre: 轻柔悦耳
        pace: 中等
        pitch: 高
    swallow_3:
      display_name: 燕子丙
      tts:
        delivery: 亲切坦率，讲述亲历时生动坚定
        timbre: 清亮灵动
        pace: 中等
        pitch: 中高
    sea_rat:
      display_name: 海鼠
      tts:
        delivery: 老练潇洒，叙述航海见闻时迷人而富有感染力
        timbre: 略带风霜的醇厚嗓音
        pace: 中等偏慢
        pitch: 中低
    mole:
      display_name: 鼹鼠
      tts:
        delivery: 朴实真诚，对朋友关切时温柔而坚定
        timbre: 温厚柔和
        pace: 中等
        pitch: 中低
  chapters:
    - id: ch01
      title: 空气里的离别
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 盛夏还没有过去，河鼠却无端地心神不宁。田野由青变黄，花楸果泛了红，林间也添上几片浓重的黄褐色。太阳依旧温暖，四处还是一片斑斓，看不出半点寒意。可是，果园和树篱间那场唱了一整天的大合唱已经散了，只剩几个不知疲倦的歌手，在黄昏里随意唱几声。知更鸟又响亮起来，空气里也隐约有了变化和离别的气息。
        - id: ch01-b02
          speaker: narrator
          text: 杜鹃早已不再啼叫，许多长着羽毛的朋友也不见了。它们曾经是这里熟悉的一分子，如今却一天比一天少。河鼠一向留意空中的动静，他看出鸟儿正渐渐转向南方。夜里躺在床上，他甚至觉得，黑暗的高空里有一双双急切的翅膀在颤动，都在听从那道无法抗拒的召唤。
        - id: ch01-b03
          speaker: narrator
          text: 大自然也像一座豪华旅馆，有热闹的旺季，也有客人离去的时候。客人们一个个收拾行李，结清账目，动身上路。每吃一顿公共晚餐，桌边就少几个熟悉的身影。一间间客房关了门，地毯卷起来，侍者也被遣散。那些包下食宿、打算留下来等候明年重新开张的住客，眼看朋友们忙着告别，热烈谈论计划、路线和新的住处，心里哪能毫无波动？每天相伴的朋友越来越少，他们自然会烦躁，会沮丧，也会忍不住抱怨：这里明明这么好，为什么非走不可？你们没见过淡季的旅馆，哪知道留下来的伙伴自己能有多少乐趣？
        - id: ch01-b04
          speaker: narrator
          text: 要走的客人总会笑着回答，他们也羡慕留下来的伙伴，也许明年就留下吧。可眼下约会已经定好，车也等在门口，他们该出发了。说完，他们便点头离开，只留下朋友一边想念，一边生气。河鼠向来扎根在这片土地上，不管谁离开，他都守着自己的河。可这一次，空气里的气息还是钻进了他的骨头。
        - id: ch01-b05
          speaker: narrator
          text: 四周都在忙着搬迁，他怎么也静不下心。于是，他离开水位渐低的河边，穿过几片干燥焦黄的牧场，走进一望无际的麦田。金黄的麦浪轻轻起伏，麦穗在头顶托起一片不断舞动、闪烁、低语的天空。风一来，它们猛烈摇摆。风一过，又笑嘻嘻地挺直身子。
        - id: ch01-b06
          speaker: narrator
          text: 河鼠在麦田里有不少朋友。田鼠和巢鼠平日再忙，也会停下来聊几句。今天，他们虽然还算客气，心思却全在别处。有的正挖隧道，有的围着小套间的平面图商量。那些住处又紧凑又舒服，离储藏室也近。积灰的箱子和衣篮都拖了出来，到处堆着准备运走的小麦、燕麦、大麦、山毛榉果和坚果。
        - id: ch01-b07
          speakers: [field_mouse_1, field_mouse_2, field_mouse_3]
          ensemble: chorus
          text: 老河鼠来了！快来帮把手，别光站着呀！
        - id: ch01-b08
          speaker: rat
          text: 你们这是闹什么呢？现在就张罗冬天的住处，也太早了吧！
        - id: ch01-b09
          speaker: field_mouse_1
          text: 我们知道早了点。可早点准备总没坏处，对不对？趁那些讨厌的机器还没在田里咔嗒乱响，我们得把家具、行李和存粮都搬走。好套间一下就会被挑光，去晚了只能住破地方，搬进去以前还得费力修整。我们不过刚开了个头。
        - id: ch01-b10
          speaker: rat
          text: 去他的开头！天气这么好，咱们去划船，沿着树篱散步，或者到树林里野餐。干什么不比现在搬家强？
        - id: ch01-b11
          speaker: field_mouse_1
          text: 今天恐怕不行，多谢你啦。改天吧，等我们腾出空再说。
        - id: ch01-b12
          speaker: narrator
          text: 河鼠轻蔑地哼了一声，转身要走，却绊上一只帽盒，结结实实摔在地上，嘴里还冒出几句很不体面的话。
        - id: ch01-b13
          speaker: field_mouse_2
          text: 有些人走路要是肯看着脚下，就不会摔疼自己，也不会说失礼的话。河鼠，小心那只旅行袋！你还是找地方坐会儿吧。再过一两个钟头，我们也许能来招呼你。
        - id: ch01-b14
          speaker: rat
          text: 照我看，圣诞节以前都别指望你们能腾出空来！
          emotion: angry
        - id: ch01-b15
          speaker: narrator
          text: 他没好气地绕过满地杂物，走出了麦田，又闷闷不乐地回到河边。那条忠实的老河从不打包行李，从不搬家，也从不迁进什么冬日套间。
    - id: ch02
      title: 南方的召唤
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 岸边的柳丛里停着一只燕子。很快，第二只来了，接着又飞来第三只。三只鸟在枝头不安地挪动，压低声音，认真商量着什么。
        - id: ch02-b02
          speaker: rat
          text: 怎么，已经开始啦？急成这样干什么？真是荒唐。
        - id: ch02-b03
          speaker: swallow_1
          text: 你要是说动身，那还没有呢。我们只是在做计划，商量今年走哪条路，中途在哪儿停。光是商量这些，就有一半的乐趣了！
          emotion: happy
        - id: ch02-b04
          speaker: rat
          text: 这也叫乐趣？你们非得离开这么舒服的地方，丢下想念你们的朋友和刚安顿好的暖窝，我已经想不明白了。真到了时候，你们勇敢上路，忍受麻烦、不便和陌生，还装得不太难过，那也就算了。可现在还没到非走不可的时候，为什么急着说，急着想呢？
        - id: ch02-b05
          speaker: swallow_2
          text: 你当然不会明白。最初，心里会悄悄生出一种甜甜的不安。接着，往事就像一只只归巢的鸽子，慢慢飞回来。夜里，它们在梦里拍翅膀。白天，我们在空中盘旋，它们也一路跟着。那些快忘掉的地方，那里的气味、声音和名字，又一个个回来招手。我们总想互相问问，听同伴再说一遍，好确定那一切真的发生过。
        - id: ch02-b06
          speaker: rat
          text: 今年就留下来一次，不行吗？我们一定让你们过得舒舒服服。你们去了远方，根本想不到这里的日子有多快活。
          emotion: sad
        - id: ch02-b07
          speaker: swallow_3
          text: 我真试过一次。我太喜欢这里，迟迟不肯走，就让同伴先动身了。头几个星期还不错，可后来的夜晚长得叫人受不了。白天见不到太阳，身上冷得直抖，空气又湿又寒，找遍整整一英亩也没有一只虫子！我实在撑不住了。一个刮着暴风雨的冷夜里，我终于振翅起飞。
        - id: ch02-b08
          speaker: swallow_3
          text: 东风太猛，我只得远远绕进内陆。飞过大山隘口时，迎面全是大雪，我费尽力气才闯过去。可后来，我飞向脚下那片安静的蓝湖，滚烫的阳光重新照在背上，又吃到了第一只肥虫子。那种幸福，我永远忘不了！过去像一场噩梦，前面却全是快乐的假日。我一星期接一星期往南飞，飞得轻松，也飞得从容。一路总要逗留到不能再拖，却从来没有忘记那声召唤。受过那次教训以后，我再也没想过违抗它。
        - id: ch02-b09
          speakers: [swallow_1, swallow_2]
          ensemble: duo
          text: 对，南方的召唤！那里的歌，那里的颜色，还有灿烂的空气！你还记不记得……
          emotion: happy
        - id: ch02-b10
          speaker: narrator
          text: 两只燕子像在梦里一样啁啾，把河鼠忘在了一边。河鼠却听得出了神，心里像烧起一团火。他身体深处有一根从未察觉的弦，沉睡了那么久，此刻终于颤动起来。燕子说的不过是远方留下的淡淡回声，却唤醒了某种狂野又陌生的感觉，叫他浑身战栗。要是亲自感受一刻呢？要是南方的太阳真的照到身上，南方的气息真的迎面吹来呢？
        - id: ch02-b11
          speaker: narrator
          text: 他闭上眼睛，任自己做了一会儿梦。再睁开时，河水仿佛冷得像钢，绿色田野也失去了光彩。紧接着，他那颗忠于故土的心又高声责骂起来，说他软弱，说他背叛了自己的家。
        - id: ch02-b12
          speaker: rat
          text: 既然南方那么好，你们为什么还回来？这个灰扑扑的小地方，到底哪里值得你们留恋？
          emotion: angry
        - id: ch02-b13
          speaker: swallow_1
          text: 难道你以为，到了回来的季节，我们听不见另一种召唤吗？青翠的牧草、雨水湿润的果园、暖和又飞满小虫的池塘、低头吃草的牛群，还有收割干草的时候，都在叫我们回来。农舍围着那栋大宅，大宅有那么完美的屋檐。它们也全在呼唤。
        - id: ch02-b14
          speaker: swallow_2
          text: 难道天地间只有你会盼着再听一声杜鹃叫吗？
        - id: ch02-b15
          speaker: swallow_3
          text: 时候到了，我们也会想家，也会想念英国河面上轻轻摇动的睡莲。可在今天，那些东西显得又淡又远。此刻，我们的血正跟着另一种乐声起舞。
        - id: ch02-b16
          speaker: narrator
          text: 三只燕子又彼此啁啾起来。这一回，它们说起紫罗兰色的大海、黄褐色的沙滩，还有爬着蜥蜴的墙。河鼠再也坐不住了，独自爬上北岸的缓坡，躺在那里望向南方挡住视线的群山。从前，那道山脊就是他的地平线，是世界尽头的月亮山。他从没想过山后是什么，也无意知道。
        - id: ch02-b17
          speaker: narrator
          text: 今天却不同。河鼠向南凝望，新生的渴望在心里不停涌动。山脊上方的晴空像在一下一下跳动，许诺着什么。看不见的地方忽然成了一切，未知的世界才像真正的生活。山的这一边仿佛空空荡荡，另一边却铺开了一幅拥挤又绚丽的景象，他用心就能看得清清楚楚。他看见山后碧绿翻涌、白浪戴冠的大海，看见阳光下的海岸和橄榄林间闪亮的白色别墅，也看见安静港湾里挤满漂亮的船。那些船要驶向出产美酒和香料的紫色岛屿，岛屿正低低躺在慵懒的海水里。
        - id: ch02-b18
          speaker: narrator
          text: 河鼠起身走向河边，又忽然改了主意。他来到尘土飞扬的大路旁，半藏进树篱下清凉浓密的枝叶里，盯着碎石路，想着它通向怎样奇妙的世界。多少旅人曾从这里走过，出门寻找命运和历险？又有多少人并没有寻找，却在外面、在远方、更远的远方，偶然撞见了它们？
    - id: ch03
      title: 大路上的海鼠
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 一阵脚步声传来，一个走得很疲惫的身影渐渐靠近。那也是一只鼠，满身都是尘土，还带着几分异国气息。他礼貌地向河鼠致意，迟疑片刻，便愉快地笑了笑，离开大路，在河鼠身边清凉的草地上坐下。他累坏了。河鼠没有问话，只让他安静休息。他明白，疲惫的肌肉慢慢松开、脑中的念头暂时停下时，静静陪伴是多么可贵。
        - id: ch03-b02
          speaker: narrator
          text: 这位旅人身材清瘦，脸庞尖削，肩膀微微佝偻。细长的爪子，带皱纹的眼角，还有一对匀称的耳朵。耳朵上戴着小金环。他穿一件褪色的蓝针织衫，短裤打着补丁，沾满污迹，原本也是蓝色的。随身那一点行李包在蓝棉布手帕里。
        - id: ch03-b03
          speaker: narrator
          text: 歇了一阵，陌生人叹口气，嗅了嗅空气，又向四周看去。
        - id: ch03-b04
          speaker: sea_rat
          text: 风里的暖香来自三叶草。身后有牛群在嚼草，吃几口就轻轻喷一声鼻息。远处是收割人的声音，林子前面，那些村舍正升起一线蓝烟。河就在附近，我听见黑水鸡叫了。再看你的体格，你准是位淡水船员。这里万物都像睡着了，却一刻也没停。朋友，你过的是好日子。只要定得下心守住它，这无疑是世上最好的生活。
        - id: ch03-b05
          speaker: rat
          text: 是啊，这才是生活，是唯一值得过的生活。
        - id: ch03-b06
          speaker: narrator
          text: 河鼠说得像在梦里，语气里已经没有从前那份全心全意的笃定。
        - id: ch03-b07
          speaker: sea_rat
          text: 我倒不敢说得那么绝对，不过它肯定是最好的。我亲自试过。正因为刚过了六个月这样的日子，知道它有多好，我才会在今天忍着脚疼和饥饿离开，一路向南。我得追随那道古老的召唤，回到从前的生活。那才是我的生活，它从来不肯放过我。
        - id: ch03-b08
          speaker: narrator
          text: 河鼠心想，怎么又来了一个？他几乎不敢问旅人要到哪里去，因为那个答案，他觉得自己早就知道。
        - id: ch03-b09
          speaker: rat
          text: 你刚从什么地方来？
        - id: ch03-b10
          speaker: sea_rat
          text: 北边一个很不错的小农场。别提它了。一个动物这辈子有权盼望的东西，那里样样都有，而且还不止这些。可我还是走到了这里！我真高兴，一路又多走了这么些英里，离心里的愿望又近了这么多个钟头！
          emotion: happy
        - id: ch03-b11
          speaker: narrator
          text: 海鼠闪亮的眼睛盯着地平线，仿佛在听一种声音。周围的牧场和农院满是快活的声响，偏偏就没有他等的那一种。
        - id: ch03-b12
          speaker: rat
          text: 你不是我们这一类，也不像种田的。我看，你甚至不是这个国家的动物。
        - id: ch03-b13
          speaker: sea_rat
          text: 说得对。我是海鼠，靠海过日子。要说最初的故乡港口，那是君士坦丁堡，不过在那里，我也只算半个异乡客。你听说过那座又古老、又辉煌的秀美城市吧？也许还听说过挪威国王西居尔。他带着六十艘船来到那里，和部下骑马穿城。街道上方张着紫金色的华盖，皇帝和皇后还亲自到他的船上设宴。
        - id: ch03-b14
          speaker: sea_rat
          text: 西居尔回国时，许多北方人留下来，加入了皇帝的卫队。我那位挪威出生的祖先也留下了，负责看守西居尔赠给皇帝的船。我们家世世代代都航海，这一点也不奇怪。对我来说，出生的城市并不比君士坦丁堡到伦敦河之间的任何好港口更像家乡。每一座港口我都熟，它们也认得我。随便把我放在哪处码头或滩岸，我就又到家了。
        - id: ch03-b15
          speaker: rat
          text: 那你一定常常远航吧？一连几个月看不到陆地，粮食快没了，淡水也得按份发。你独自面对浩瀚大海，心里和它默默交谈，还有那一类的事？
        - id: ch03-b16
          speaker: sea_rat
          text: 完全不是。我可过不惯那样的日子。我走的是沿岸航线，很少看不见陆地。岸上的快乐时光，和航海本身一样吸引我。那些南方港口啊！那里的气味，夜里的锚灯，还有迷人的光彩！
        - id: ch03-b17
          speaker: rat
          text: 那也许才是更好的路。要是你愿意，跟我讲讲沿岸航行吧。一个有胆识的动物会遇上什么？等他老了，坐在炉边，又能拿哪些英勇往事温暖自己？我得承认，今天我忽然觉得自己的生活很窄，到处都受拘束。
        - id: ch03-b18
          speaker: sea_rat
          text: 那就说说最近这次航行。它最后把我送到这个国家，让我满怀希望地住进内陆农场。这一趟正好能代表我那绚丽的一生。事情还是从一场家庭争执开始。家里的风暴警报刚挂起来，我就搭上一艘小商船，离开君士坦丁堡，穿过那些古老的海域，驶向希腊群岛和黎凡特。那里的每一道海浪，都带着不朽的回忆。
        - id: ch03-b19
          speaker: sea_rat
          text: 那些白天金光灿烂，夜晚温暖芬芳。我们的船进了这个港，又离开那个港，到处都有老朋友。白天最热的时候，我们就在清凉的神庙或废弃的蓄水池里睡觉。太阳一下山，大家便在铺满巨星的天鹅绒夜空下吃喝唱歌。后来，我们调转船头，沿着亚得里亚海岸向北。海岸浮在琥珀色、玫瑰色和海蓝宝石色的霞光里。我们停进宽阔而被陆地围住的港湾，也漫游了一座又一座古老高贵的城市。
        - id: ch03-b20
          speaker: sea_rat
          text: 终于有一天早晨，太阳在身后堂皇升起，我们沿着一条金光大道驶进威尼斯。那座城真是妙极了，一只鼠尽可以慢慢闲逛，痛快游玩。走累了，晚上就坐在大运河边，和朋友们一起吃喝。空气里全是音乐，天上全是星星。贡多拉在河面上摇来摇去，挤得满满的，灯光落在锃亮的钢制船首上，密得简直能让你踩着它们走过运河。还有那些吃的！你喜欢贝类吗？算了，眼下先不细讲。
        - id: ch03-b21
          speaker: narrator
          text: 海鼠安静下来。河鼠也没有出声。他已经听得神魂颠倒，仿佛正漂在梦中的运河上，听那虚幻的歌声高高回荡在雾灰色的墙壁之间，墙脚还有水波轻轻拍打。
    - id: ch04
      title: 沿岸的航程
      blocks:
        - id: ch04-b01
          speaker: sea_rat
          text: 后来，我们终于又向南航行，沿着意大利海岸一直来到巴勒莫。我在那里下船，在岸上快活地住了很久。我从不在同一条船上待太久，那会让人眼界变窄，满脑子偏见。西西里也是我最爱的地方之一。那里人人都认识我，他们的日子也很合我的性情。我在乡间朋友家住了许多快乐的星期。等我又闲不住时，正好有船去撒丁岛和科西嘉做生意，我便跟着去了。海风和浪花重新扑到脸上，真叫人痛快！
        - id: ch04-b02
          speaker: rat
          text: 可待在下面那个……你们是不是叫货舱？那里不会又闷又热吗？
        - id: ch04-b03
          speaker: narrator
          text: 海鼠看着他，眼睛像是偷偷眨了一下。
        - id: ch04-b04
          speaker: sea_rat
          text: 我是个老手。船长室很适合我。
        - id: ch04-b05
          speaker: rat
          text: 我听人说，那种日子可不好过。
        - id: ch04-b06
          speaker: sea_rat
          text: 对船员来说，的确如此。
        - id: ch04-b07
          speaker: narrator
          text: 海鼠一本正经地回答，眼里却又闪过一点笑意。
        - id: ch04-b08
          speaker: sea_rat
          text: 离开科西嘉以后，我搭上一条运葡萄酒去大陆的船。傍晚到了阿拉西奥。船停稳，我们把酒桶提上来，扔进海里，再拿一根长绳把它们一只只拴好。船员坐进小艇，唱着歌划向岸边，身后拖着一长列上下颠簸的酒桶，像一群足有一英里长的海豚。
        - id: ch04-b09
          speaker: sea_rat
          text: 沙滩上早有马匹等着。它们拖起酒桶，冲上小镇陡峭的街道。一路轰响，一路碰撞，大家争着往前，好不热闹。最后一只酒桶安顿好，我们便去吃喝休息，陪朋友们一直畅饮到深夜。第二天一早，我钻进大片橄榄林，好好睡了一觉。
        - id: ch04-b10
          speaker: sea_rat
          text: 那阵子我暂时厌倦了岛屿，而那一带又有许多港口和船。我便在农人中间闲住，躺着看他们干活。有时舒展身子，卧在高高的山坡上，看蓝色地中海远远铺在脚下。后来，我不紧不慢地赶去马赛，一段步行，一段坐船。在那里，我重逢老船友，参观那些马上要远渡重洋的大船，当然也少不了宴饮。说起贝类！我有时梦见马赛的贝类，醒来竟会哭出来！
        - id: ch04-b11
          speaker: rat
          text: 这倒提醒我了。你刚才说肚子饿，我早该请你吃饭。你愿意留下来跟我吃午饭吗？我的洞就在附近。午时已经过了很久，家里不管有什么，都欢迎你来吃。
        - id: ch04-b12
          speaker: sea_rat
          text: 这才叫亲切，才叫兄弟情分！我坐下时确实很饿，刚才一提贝类，就饿得更厉害了。不过，你能把午饭拿到这里来吗？不到万不得已，我不喜欢钻到甲板下面。咱们还能边吃边谈，我再多讲些航行见闻，还有我过的快乐日子。至少对我来说，那些日子很快乐。看你听得这么入神，我想你也很向往。要是进了屋，我多半马上就会睡着。
        - id: ch04-b13
          speaker: rat
          text: 这主意妙极了！
          emotion: happy
        - id: ch04-b14
          speaker: narrator
          text: 河鼠匆匆跑回家，拿出午餐篮，装上一顿简单的饭。他想着陌生人的来处和口味，特意放了一根足有一码长的法式面包，一截仿佛唱着大蒜之歌的香肠，一块像在默默哭泣的奶酪，还有一瓶用麦秸包着、瓶颈细长的酒。瓶子里盛的仿佛是遥远南方山坡上洒落又收集起来的阳光。
        - id: ch04-b15
          speaker: narrator
          text: 他飞快赶回路边。老水手一个劲儿夸他的品位和眼光，河鼠高兴得脸都红了。两人打开篮子，把食物一样样摆在草地上。海鼠填了填肚子，又接着讲最近那次航行。
        - id: ch04-b16
          speaker: narrator
          text: 他领着天真的听众，从西班牙的一个港口走到另一个港口，又先后在里斯本、波尔图和波尔多登陆。接着，他们看遍康沃尔和德文郡那些宜人的海港，再沿英吉利海峡来到最后一座码头。一路逆风不肯停，船被暴风追赶，吃尽苦头才终于靠岸。就在那里，海鼠发现了另一个春天最早、最奇妙的信号。热望重新点燃，他便徒步深入内陆，走了很远，急着试试安静农场里的日子，也想远远躲开大海永不休止的拍击。
        - id: ch04-b17
          speaker: narrator
          text: 河鼠像中了魔，兴奋得不停发抖。他跟着这位冒险家走完一程又一程，越过被风暴撕扯的海湾，穿过挤满船只的锚地，又乘着奔流的潮水冲过港口沙洲，驶进弯弯曲曲的河道。忙碌的小镇藏在一个个急弯后面，总会突然跳到眼前。最后，海鼠把他留在那座沉闷的内陆农场。河鼠失望地叹了口气，对农场里的事再也不想听了。
        - id: ch04-b18
          speaker: narrator
          text: 午饭已经吃完。海鼠饱餐以后精神更足，声音也更有力量。他把南方出产的红酒倒进杯中，俯身靠近河鼠，牢牢抓住了他的目光，也抓住了他的身心。那双眼睛像北方奔腾的大海，灰绿的光不断变幻，里面缀着一道道白沫。杯中的酒却像一块滚烫的红宝石，仿佛南方的心脏，只为敢于回应它的人跳动。变幻的灰光和坚定的红光一起制伏了河鼠。四周宁静的世界退得越来越远，最后完全消失。
        - id: ch04-b19
          speaker: narrator
          text: 海鼠的奇妙讲述还在继续。可那还是话语吗？有时，它仿佛变成了歌。水手们绞起滴水的铁锚，唱着有力的号子。猛烈的东北风里，桅索发出低沉的嗡鸣。杏黄色晚霞前，渔人一边收网，一边唱歌。贡多拉和土耳其小船上，吉他与曼陀林的和弦轻轻荡开。
        - id: ch04-b20
          speaker: narrator
          text: 有时，那声音又变成风的呼号。起初，它低声哀诉。风越来越强，声音便化为愤怒的尖啸，升成一声仿佛能撕开万物的长哨。最后，它又低落下去，只剩鼓满的帆边漏出一缕乐音。河鼠还听见海鸥饥饿的哭叫，碎浪低沉柔和的雷声，以及卵石滩在浪下发出的阵阵抗议。
        - id: ch04-b21
          speaker: narrator
          text: 接着，一切又成了话语。河鼠心跳如鼓，跟着海鼠经历十几个港口里的冒险。有搏斗，有脱险和反击，也有友情与英勇的壮举。他们到岛上寻宝，在安静的潟湖垂钓，整天躺在温暖的白沙上打盹。他听见深海捕鱼的故事，一英里长的渔网拉起大片银光闪闪的鱼。也听见突然而来的危险。没有月亮的夜里，暗礁上传来破浪声。浓雾中，巨轮高高的船首忽然在头顶出现。
        - id: ch04-b22
          speaker: narrator
          text: 还有欢喜的归航。船绕过岬角，港灯一盏接一盏展开。码头上的人群慢慢看得见了，亲切的招呼从岸边传来，缆绳扑通一声落进水里。归来的人走上陡峭的小街，前方一扇扇红窗帘后面，温暖的灯光正在等候。
        - id: ch04-b23
          speaker: narrator
          text: 最后，在这场睁着眼睛做的梦里，河鼠仿佛看见海鼠站了起来。他仍在说话，那双海灰色的眼睛依然牢牢控制着河鼠。
        - id: ch04-b24
          speaker: sea_rat
          text: 现在，我又要踏上大路，一直往西南走。经过许多个尘土飞扬的长日子，我会到达那座熟悉的灰色海边小镇。它贴在港湾一侧的陡坡上。从一道道幽暗门洞望下去，能看见一段段石阶。大片粉红色缬草从上面垂下来，石阶尽头闪着一小片蓝水。旧海墙的铁环和系缆柱上，拴着颜色鲜亮的小船，跟我小时候爬进爬出的那些一模一样。
        - id: ch04-b25
          speaker: sea_rat
          text: 涨潮时，鲑鱼会跃出水面。成群的鲭鱼闪着亮光，在码头和滩岸边游来游去。大船昼夜不停地从窗前滑过，有的驶向泊位，有的奔向大海。所有航海国家的船，迟早都会来到那里。我选中的那一条，也会在命定的时刻抛锚。我不着急。我会耐心等到合适的船停在中流，等着我去。它吃水很深，船首斜桅直指港口出口。我会坐小艇过去，也可能沿着缆绳爬上船。
        - id: ch04-b26
          speaker: sea_rat
          text: 某个早晨，我会在水手们的歌声和脚步声中醒来。绞盘叮叮当当地转，锚链欢快地哗啦啦收起。我们升起船首三角帆和前桅帆。船渐渐听从舵的指挥，港边的白房子从眼前慢慢滑过，航程就开始了！船驶向岬角，边走边披满白帆。等出了港，它会迎风倾斜，直指南方，碧绿的巨浪在船边响亮地拍击！
          emotion: happy
        - id: ch04-b27
          speaker: sea_rat
          text: 你也会来的，年轻的兄弟。时光一直流逝，永远不会回头，南方却还在等你。趁那个无法挽回的时刻还没过去，去冒险吧，听从召唤吧！砰的一声关上身后的门，再快活地向前迈一步，你就走出了旧生活，走进了新生活。
        - id: ch04-b28
          speaker: sea_rat
          text: 等很久很久以后，有一天，你喝完杯里的酒，也演完了这场戏，到那时再回来也不迟。你可以重新坐在安静的河边，让美好的回忆陪着你。你很容易在路上追上我。你还年轻，我却老了，脚步已经慢了。我会一路停下来，回头望一望。最后，我一定会看见你兴冲冲地赶来，脚步轻快，脸上全是南方的光！
          emotion: happy
        - id: ch04-b29
          speaker: narrator
          text: 海鼠的声音越来越轻，像昆虫细小的号声，很快沉进寂静，终于彻底消失。河鼠僵在那里，瞪着眼睛。等他回过神来，白色大路的远处只剩一个小黑点。
    - id: ch05
      title: 回到河边
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 河鼠木然站起身，仔仔细细、不慌不忙地收好午餐篮，又木然回到家。他拿出几件出门必需的东西，还有自己格外珍爱的宝物，一样样装进挎包。动作迟缓而谨慎，像在梦游。他的嘴唇一直微微张着，仿佛还在倾听。接着，他把挎包甩上肩，认真挑了一根结实的手杖，跨过门槛。脚步并不急，却没有半点迟疑。就在这时，鼹鼠走到了门前。
        - id: ch05-b02
          speaker: mole
          text: 咦，河鼠，你这是要去哪儿？
          emotion: surprised
        - id: ch05-b03
          speaker: narrator
          text: 鼹鼠吃了一惊，一把抓住他的胳膊。
        - id: ch05-b04
          speaker: rat
          text: 跟大家一样，往南方去。先到海边，再登上船，一直去那些正在呼唤我的海岸。
        - id: ch05-b05
          speaker: narrator
          text: 河鼠梦游似的低声说着，始终没有看鼹鼠。他坚定地往前走，还是不急不忙，意志却固执得吓人。鼹鼠彻底慌了，挡到他面前，直盯着他的双眼。那双眼睛呆滞而凝固，已经变成斑驳流动的灰色。那不是他朋友的眼睛，简直属于另一只动物。
        - id: ch05-b06
          speaker: narrator
          text: 鼹鼠使出全身力气抱住河鼠，把他拖回屋里，掀倒在地，牢牢按住。河鼠拼命挣扎了一阵，力气忽然全被抽走。他闭上眼睛，筋疲力尽地躺着，浑身发抖。过了一会儿，鼹鼠扶他起来，让他坐进椅子。河鼠软塌塌地缩成一团，身体抖得厉害，后来又开始一阵阵抽泣，像歇斯底里一般，却流不出眼泪。
        - id: ch05-b07
          speaker: narrator
          text: 鼹鼠闩上大门，把挎包扔进抽屉锁好，然后安静地坐在朋友身边的桌沿上，等这场怪病过去。河鼠渐渐坠进不安的昏睡，不时惊跳一下，嘴里含混地念着陌生、狂野、来自异邦的事物。鼹鼠一句也听不懂。再后来，河鼠终于沉沉睡去。
        - id: ch05-b08
          speaker: narrator
          text: 鼹鼠满心担忧，暂时离开去料理家务。天渐渐暗了，他回到客厅，发现河鼠还坐在原来的地方。河鼠已经完全清醒，却没精打采，沉默又消沉。鼹鼠匆匆看了一眼他的眼睛，欣喜地发现，那双眼睛又像从前一样清澈，是黝黑的棕色。他坐下来，努力让朋友振作，也帮河鼠把今天的遭遇一点点说出来。
        - id: ch05-b09
          speaker: narrator
          text: 可怜的河鼠尽力解释，可那些感受大多来自暗示，怎么能变成冷冰冰的话？曾经围着他歌唱的大海之声，又怎么能为了另一位听众重新响起？海鼠上百段回忆里的魔力，也没法借第二张嘴再次出现。如今魔咒已经破了，迷雾也散了，就连河鼠自己都说不清，为什么几个钟头前，离开竟像是非做不可的事，像是唯一的一条路。难怪他说了半天，鼹鼠还是没能明白这一天到底发生了什么。
        - id: ch05-b10
          speaker: narrator
          text: 不过，在鼹鼠看来，至少有一点很清楚。那阵狂热或怪病已经过去，河鼠恢复了神志，只是事后的冲击仍让他发抖、沮丧。眼下，他对日常生活里的一切都没了兴趣。季节更替会带来新的日子和新的活动，那些原本叫人快活的期待，也没法打动他。
        - id: ch05-b11
          speaker: narrator
          text: 于是，鼹鼠装作随口闲谈，说起正在收割的庄稼，说起装满谷物、高高堆起的马车，还有那些使劲拉车的牲口。他说起越堆越高的草垛，也说起一轮大月亮从收割后的空旷田野上升起，照着地上一捆捆庄稼。
        - id: ch05-b12
          speaker: narrator
          text: 他又说起渐渐变红的苹果和一天天变褐的坚果，说起果酱、蜜饯和蒸馏出来的甜酒。沿着这些轻松的话题，他慢慢讲到了隆冬。那时会有热闹快活的趣事，也会有温暖舒适的居家日子。说到后来，他简直像唱诗一样抒情。
        - id: ch05-b13
          speaker: narrator
          text: 河鼠渐渐坐直了，也加入谈话。他黯淡的眼睛重新亮起来，那种侧耳倾听远方的神情也淡了许多。过了一会儿，体贴的鼹鼠悄悄离开。回来时，他手里拿着一支铅笔和几张裁成一半的纸。他把东西放在河鼠肘边的桌上。
        - id: ch05-b14
          speaker: mole
          text: 你好久没写诗了。今晚试试看吧，别再……嗯，别再只顾着闷头想那些事。我觉得，只要往纸上写点什么，哪怕只有几个韵脚，你也会好受一些。
        - id: ch05-b15
          speaker: narrator
          text: 河鼠疲倦地把纸推开。善解人意的鼹鼠却找了个理由，离开房间。过了一阵，他再探头进来，只见河鼠已经全神贯注，对外面的动静什么也听不见。他一会儿奋笔疾书，一会儿把铅笔含在嘴里。说实话，他含铅笔的时间比写字长得多。可鼹鼠知道，朋友至少已经开始痊愈，心里高兴极了。
