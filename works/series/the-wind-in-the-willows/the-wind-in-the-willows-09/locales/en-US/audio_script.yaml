  chapters:
    - id: ch01
      title: A Restless Season
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            The Water Rat had grown restless, though he could not have said why. Summer still seemed to be at its height. The cultivated fields had turned from green to gold, rowan berries were reddening, and flashes of fierce tawny color showed here and there in the woods. Yet the days had lost none of their light, warmth, or color. The air carried no chill warning that the year was passing. To anyone looking around, summer still appeared to be displaying all its splendor.
        - id: ch01-b02
          speaker: narrator
          text: >-
            Still, the great chorus in orchard and hedge had faded. Now it was only an occasional evening song from a few tireless performers. The robin was beginning to make himself heard again. The cuckoo, of course, had long been silent. Many other feathered friends were missing too, though for months they had belonged to the familiar landscape and its little society. Their numbers seemed to thin day after day. Rat watched every movement of wings, and each day more of them appeared to be heading south. Even at night, lying awake in bed, he thought he could hear them passing through the darkness overhead. He imagined the beat and tremble of impatient wings, all answering a command they could not refuse.
        - id: ch01-b03
          speaker: narrator
          text: >-
            Nature's Grand Hotel had its season, like any other. One guest after another packed up, paid, and left. There were fewer places at the long table after every departure. Whole sets of rooms were shut, carpets rolled away, and servants dismissed. Those staying until next year's grand reopening could not help feeling unsettled. Everywhere they heard farewells, eager plans, arguments about routes, and descriptions of new quarters. Each day, the stream of friendship grew thinner. The animals who remained became gloomy and irritable. Why did everyone crave a change? Why couldn't they stay and enjoy the quiet season together? The travelers always agreed that it sounded delightful. They almost envied the ones who stayed. Perhaps they would try it another year, they said, but just now they had engagements. The bus was already waiting, and their time had come. Then off they went with a smile and a wave, leaving the others to miss them and feel a little resentful.
        - id: ch01-b04
          speaker: narrator
          text: >-
            Rat belonged to the land. Whoever else went away, he stayed. But even he felt the change in the air, right down in his bones. With so much coming and going, he could not settle to anything. He left the river, where tall rushes crowded the low, slow water, crossed dry-looking pasture, and entered a great sea of wheat.
        - id: ch01-b05
          speaker: narrator
          text: >-
            The yellow wheat rolled and whispered around him, full of quiet motion and countless small sounds. Its stiff, strong stalks made a golden sky above his head. That sky danced, shimmered, and talked softly. When the wind passed, it bent in a powerful sweep, then tossed itself upright with a laugh. Rat loved wandering there among his small friends. Their little society was complete in itself, and every member led a full and busy life. Even so, they usually found time for news and gossip with a visitor. Today they were polite enough, but far too occupied to talk. Field mice and harvest mice dug tunnels. Small groups bent over plans for neat, compact apartments conveniently close to the Stores. Some dragged out dusty trunks and clothes baskets, while others were already elbow-deep in packing. Wheat, oats, barley, nuts, and beech mast stood everywhere in piles and bundles ready to move.
        - id: ch01-b06
          speakers: [field_mouse_1, field_mouse_2, field_mouse_3]
          ensemble: chorus
          text: "Look, it's old Ratty! Come give us a hand, Rat. Don't just stand there!"
        - id: ch01-b07
          speaker: water_rat
          text: "What are you all doing? Winter quarters are still ages away."
        - id: ch01-b08
          speaker: field_mouse_1
          text: >-
            Oh, we know. But it pays to start early, doesn't it? We have to move the furniture, luggage, and food before those horrible machines begin clattering through the fields. And the best apartments go so quickly now. If you're late, you have to take whatever is left, and it needs so much work before anyone can live there. Yes, we're early. We're only getting started.
        - id: ch01-b09
          speaker: water_rat
          text: "Oh, bother getting started! It's a beautiful day. Come rowing, or walk along the hedges, or have a picnic in the woods. Anything!"
        - id: ch01-b10
          speaker: field_mouse_1
          text: "Not today, thanks. Maybe another day, when we have more time."
        - id: ch01-b11
          speaker: narrator
          text: >-
            Rat snorted and turned away. At once he tripped over a hatbox and fell, muttering things that did him no credit.
        - id: ch01-b12
          speaker: field_mouse_1
          text: >-
            If people watched where they were going, they wouldn't hurt themselves and forget their manners. Careful of that travel bag, Rat! You'd better sit down somewhere. We may have time for you in an hour or two.
        - id: ch01-b13
          speaker: water_rat
          text: "At this rate, you won't have time for anybody before Christmas."
        - id: ch01-b14
          speaker: narrator
          text: >-
            Grumbling, Rat picked his way out of the field. He returned unhappily to his faithful old river. The river never packed its bags, moved away, or shut itself up for winter.
    - id: ch02
      title: The Call of the South
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            In the willow thicket along the bank, Rat noticed a swallow perched on a branch. Soon a second joined it, then a third. The birds shifted restlessly and spoke together in low, serious voices.
        - id: ch02-b02
          speaker: water_rat
          text: "Already? What's the rush? The whole thing is ridiculous."
        - id: ch02-b03
          speaker: swallow_1
          text: >-
            We're not leaving yet, if that's what you mean. We're making plans. We have to decide which route to take this year and where we'll stop along the way. Talking it over is half the fun!
        - id: ch02-b04
          speaker: water_rat
          text: >-
            Fun? That's the part I don't understand. You have to leave this lovely place, your friends who'll miss you, and the snug homes you just finished settling into. When the hour comes, I know you'll be brave. You'll face all the trouble and discomfort and strange new things, and pretend you aren't miserable. But why talk about it, or even think about it, before you must?
        - id: ch02-b05
          speaker: swallow_2
          text: >-
            Of course you don't understand. First we feel a sweet restlessness waking inside us. Then the memories come home one by one, like pigeons. They flutter through our dreams at night and fly beside us when we wheel through the day. We have to ask one another about them. We compare what we remember and make sure it was all true. Slowly, the scents and sounds and names of forgotten places return, and they call us back.
        - id: ch02-b06
          speaker: water_rat
          text: >-
            Couldn't you stay just this once? We'd all try our best to make you happy here. You don't know what wonderful times we have while you're away.
        - id: ch02-b07
          speaker: swallow_3
          text: >-
            I did stay once. I loved this place so much that when the others left, I held back and let them go without me. For a few weeks, everything was fine. Then came those endless nights, those shivering days without sun. The air was wet and cold, and there wasn't one insect to be found across a whole acre.
        - id: ch02-b08
          speaker: swallow_3
          text: >-
            I couldn't bear it. One cold, stormy night I took off. Strong winds from the east forced me far inland. Snow beat against me as I fought through the high mountain passes. It was a hard journey, but I'll never forget the warm sun touching my back again as I flew down toward the calm blue lakes, or the taste of my first fat insect. Everything behind me became a bad dream. Ahead lay one long, happy holiday. Week after week I drifted south, slowly and easily, lingering wherever I dared, but always obeying the call. I learned my lesson. I never tried to resist it again.
          emotion: fearful
        - id: ch02-b09
          speakers: [swallow_1, swallow_2]
          ensemble: duo
          text: "Yes, the South! Its songs, its colors, its shining air! Do you remember...?"
        - id: ch02-b10
          speaker: narrator
          text: >-
            The two birds forgot Rat and lost themselves in passionate memories. He listened, spellbound, while his heart burned. Something in him, a chord he had never known was there, began to tremble at last. These birds had brought back only faint, secondhand scraps of the South, yet their talk filled him with a wild new longing that thrilled through his whole body. What would one moment of the real thing do to him? What if the true southern sun touched him, or one breath carried its unmistakable scent? He closed his eyes and gave himself completely to the dream. When he opened them, his river looked cold as steel. The green fields had turned gray and empty, and all their light seemed gone. Then his loyal heart cried out against his weaker self for betraying everything he loved.
        - id: ch02-b11
          speaker: water_rat
          text: "Then why do you ever come back? What could draw you to this poor, dull little country?"
        - id: ch02-b12
          speaker: swallow_1
          text: >-
            Do you think the other call doesn't reach us when its season comes? We remember thick meadow grass, wet orchards, warm ponds humming with insects, cattle grazing, haymaking, and the farm buildings gathered around the House of the Perfect Eaves.
        - id: ch02-b13
          speaker: swallow_2
          text: "Do you imagine you're the only creature who aches to hear the cuckoo again?"
        - id: ch02-b14
          speaker: swallow_3
          text: >-
            When the time is right, we'll long again for quiet water lilies moving on an English stream. Today that life seems pale and far away. Right now, our blood is dancing to different music.
        - id: ch02-b15
          speaker: narrator
          text: >-
            The swallows began twittering together again, filling the air with talk of violet seas, tawny sand, and old walls alive with lizards. Restless, Rat wandered away once more. He climbed the gentle slope above the north bank and looked toward the long ring of Downs in the south. Until that day, those hills had been the edge of his world, his own distant mountains and simple horizon. They marked the limit beyond which there had never been anything he cared to see or know.
        - id: ch02-b16
          speaker: narrator
          text: >-
            Now a new need stirred in his heart, and the clear sky above the long, low hills seemed to pulse with promise. The unseen world was everything. The unknown felt like the only real fact in life. This side of the hills had become the blank place. Beyond them, his mind saw a crowded blaze of color. Green seas leaped, their crests bright in the sun. Along warm coasts, white villas glittered against olive woods. Proud ships filled quiet harbors, preparing to sail toward purple islands of wine and spice. Those islands lay low in still, dreamy water, and he could almost believe he saw them.
        - id: ch02-b17
          speaker: narrator
          text: >-
            Rat went down toward the river, changed his mind, and made for the dusty road. He lay half hidden in the cool tangle beneath the hedge and stared at the hard road and the marvelous world it led to. He thought of all the travelers who had walked that way, and of the adventures they had gone to seek, or found without seeking, somewhere beyond.
        - id: ch02-b18
          speaker: narrator
          text: >-
            Footsteps approached. A tired-looking Rat came into view, covered in dust. When he reached the hedge, he gave a courteous greeting with a foreign air about it. After a moment's hesitation, he smiled, stepped off the road, and sat beside Water Rat in the cool grass. The traveler was weary, and Rat asked no questions. He understood the comfort of silent company while tired muscles relaxed and the mind stood still.
    - id: ch03
      title: The Rat from the Sea
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            The traveler was lean and sharp-faced, and his shoulders bent forward a little from years of travel. His paws were thin and long. Many small wrinkles spread from the corners of his eyes, as though he had spent a lifetime staring into sun and wind. Small gold rings hung from his neat, well-shaped ears. His knitted shirt was faded blue. His patched and stained breeches had begun as blue too, though hard use had nearly hidden the color. The few belongings he carried were tied inside a blue cotton handkerchief.
        - id: ch03-b02
          speaker: narrator
          text: >-
            After resting for a while, the stranger sighed, sniffed the air, and looked around.
        - id: ch03-b03
          speaker: sea_rat
          text: >-
            That warm scent on the breeze is clover. Those are cows behind us, cropping grass and breathing between mouthfuls. I can hear reapers far away, and there's a blue thread of cottage smoke rising against the woods. A river must run close by. I hear a moorhen, and from the look of you, I'd say you're a freshwater sailor. Everything here seems asleep, though it never stops moving. You lead a fine life, friend. Maybe the finest in the world, if you're strong enough to keep living it.
        - id: ch03-b04
          speaker: water_rat
          text: "It is the life. It's the only life worth living."
        - id: ch03-b05
          speaker: narrator
          text: >-
            Rat's answer was dreamy and lacked his usual certainty.
        - id: ch03-b06
          speaker: sea_rat
          text: >-
            I didn't quite say that, though it may be the best. I've tried it, so I know. In fact, I've just spent six months living that very life. And now here I am, hungry and footsore, walking away from it. I'm heading south, answering the old call and returning to the life that belongs to me, the life that refuses to let me go.
        - id: ch03-b07
          speaker: narrator
          text: >-
            Rat wondered if this was yet another traveler answering the same call.
        - id: ch03-b08
          speaker: water_rat
          text: "Where have you come from?"
        - id: ch03-b09
          speaker: narrator
          text: >-
            He hardly dared ask where the stranger was going. He felt he already knew.
        - id: ch03-b10
          speaker: sea_rat
          text: >-
            A pleasant little farm, up that way to the north. Never mind the place. I had everything I needed, everything I had any right to ask from life, and more. Yet here I am. And I'm glad, too. Every mile puts me farther down the road and every hour brings me nearer what my heart wants.
          emotion: happy
        - id: ch03-b11
          speaker: narrator
          text: >-
            The traveler's bright eyes stayed fixed on the horizon. He seemed to be listening for one missing sound among all the cheerful noises of field and farmyard.
        - id: ch03-b12
          speaker: water_rat
          text: "You're not a river animal like us, and you're certainly no farmer. I don't think you even belong to this country."
        - id: ch03-b13
          speaker: sea_rat
          text: >-
            Right on every count. I'm a sea rat. Constantinople is the port I first came from, though even there I'm something of a foreigner. You know Constantinople, don't you? It's a beautiful, ancient, glorious city. Perhaps you've heard of Sigurd, King of Norway. He sailed there with sixty ships, and he and his men rode through streets canopied in purple and gold. The Emperor and Empress came aboard his ship and feasted with him.
        - id: ch03-b14
          speaker: sea_rat
          text: >-
            When Sigurd sailed home, many Northmen stayed to join the Emperor's guard. My Norwegian ancestor stayed too, with the ships Sigurd had given the Emperor. My family has always gone to sea, so it's no wonder I do the same. The city where I was born is no more my home than any friendly port between there and the London River. I know every one of them, and they know me. Put me down on any quay or shore, and I'm home.
        - id: ch03-b15
          speaker: water_rat
          text: >-
            Then you must make enormous voyages. Months without seeing land, food running low, everyone rationing water, while you sit thinking deep thoughts with the mighty ocean all around you. That sort of thing?
        - id: ch03-b16
          speaker: sea_rat
          text: >-
            Not at all. I wouldn't enjoy that life. I sail along the coast and hardly ever lose sight of land. The good times ashore matter as much to me as the sailing. Ah, those southern ports! Their smell, their lights on the water at night, the wonder of them!
        - id: ch03-b17
          speaker: water_rat
          text: >-
            Maybe you've chosen the better way. Tell me about your coastal voyages, if you feel like it. What memories might a spirited animal gather there, to warm him by the fire when he's old? Today, I have to admit, my own life feels rather small and hemmed in.
        - id: ch03-b18
          speaker: sea_rat
          text: >-
            My last voyage is a good example. It ended by bringing me to this country, full of hopes for a quiet farm, and it held all the color of my life. Family trouble started it, as usual. A storm was brewing at home, so I joined a little trading ship out of Constantinople. We sailed through the old seas, where every wave seems to carry an ancient memory, toward the Greek islands and the Levant.
        - id: ch03-b19
          speaker: sea_rat
          text: >-
            The days were golden and the nights soft and warm. We were always entering one harbor or leaving another, and I had old friends everywhere we stopped. During the hottest hours I slept in a cool temple or an ancient ruined cistern. After sunset came feasting and songs beneath great stars set in a velvet sky. Then we turned and followed the Adriatic coast. Amber, rose, and blue-green light seemed to fill the air around its shores. We rested in broad harbors, safely enclosed by land, then went roaming through cities that were both ancient and noble. At last, one morning, the sun rose behind us like a king, laying brightness across the water. Our ship rode straight into Venice along a path of gold.
        - id: ch03-b20
          speaker: sea_rat
          text: >-
            Venice is a splendid place for a rat. You can wander wherever you please. When you're tired, sit beside the Grand Canal at night and feast with your friends. Music fills the air, stars fill the sky, and lights flash on the polished steel prows of the rocking gondolas. They crowd the canal so thickly you could almost cross it by stepping from boat to boat. And the food! Do you like shellfish? Well, we had better not dwell on that now.
        - id: ch03-b21
          speaker: narrator
          text: >-
            Sea Rat fell silent. Water Rat said nothing either. He drifted through dream canals while an imagined song rang between gray walls washed by phantom waves.
    - id: ch04
      title: Ports and Open Water
      blocks:
        - id: ch04-b01
          speaker: sea_rat
          text: >-
            At last we sailed south again along the Italian coast until we reached Palermo. I left the ship there and spent a long, happy stretch ashore. I never stay with one vessel too long. It makes a fellow narrow-minded and full of opinions. Besides, Sicily is one of my favorite places. I know everyone, and their way of life suits me. For weeks I stayed with friends inland. When restlessness returned, I found a ship trading to Sardinia and Corsica. It felt wonderful to have fresh wind and sea spray on my face again.
        - id: ch04-b02
          speaker: water_rat
          text: "But doesn't it get terribly hot and stuffy down in the hold? I think that's what you call it."
        - id: ch04-b03
          speaker: narrator
          text: >-
            The seafarer looked at him with the hint of a wink.
        - id: ch04-b04
          speaker: sea_rat
          text: "I've been doing this a long time. The captain's cabin suits me perfectly well."
        - id: ch04-b05
          speaker: water_rat
          text: "Everyone says it's a hard life."
        - id: ch04-b06
          speaker: sea_rat
          text: "For the crew, it certainly is."
        - id: ch04-b07
          speaker: narrator
          text: >-
            Again, there was almost a wink.
        - id: ch04-b08
          speaker: sea_rat
          text: >-
            From Corsica I joined a ship carrying wine to the mainland. We reached Alassio in the evening and stopped offshore. The crew brought up the wine barrels, threw them overboard, and tied them into one long line. Then they rowed toward land, singing as they pulled that bobbing train behind them. It looked like a mile of porpoises. Horses waited on the sand and dragged the barrels up the town's steep street in a grand rush of hooves, clatter, and scrambling feet.
        - id: ch04-b09
          speaker: sea_rat
          text: >-
            Once the last barrel was safely in, we ate, rested, and drank with our friends until late in the night. Next morning I went into the great olive woods for a quieter spell. I had finished with islands for a while, and the mainland offered plenty of ports and shipping whenever I wanted them. So I lived lazily among the peasants. Sometimes I lay nearby and watched them work. Sometimes I stretched out high on a hillside, with the blue Mediterranean spread far below me. I moved on only when I felt like it. By easy stages, partly walking and partly sailing, I finally reached Marseilles. Old shipmates were waiting there. I visited the great vessels preparing to cross the ocean, and soon we were feasting again. Shellfish! Sometimes I dream of the shellfish in Marseilles and wake up crying.
        - id: ch04-b10
          speaker: water_rat
          text: >-
            Speaking of hunger, you mentioned you were hungry when you arrived, and I should have answered sooner. Please have lunch with me. My home is close, it's well past noon, and you're welcome to everything I have.
        - id: ch04-b11
          speaker: sea_rat
          text: >-
            That's truly kind of you, brother. I was hungry when I sat down, and ever since I accidentally mentioned shellfish, it's become much worse. Could you bring the meal out here? I don't care for going below deck unless I must. We can eat while I tell you more about my travels and the pleasant life I lead. It pleases me, at least, and judging by the way you're listening, it pleases you too. If we go inside, I'll probably fall asleep.
        - id: ch04-b12
          speaker: water_rat
          text: "That's an excellent idea."
        - id: ch04-b13
          speaker: narrator
          text: >-
            Rat hurried home, found his lunch basket, and packed a simple meal. Remembering his guest's homeland and tastes, he added a yard of long French bread, a sausage loud with garlic, a cheese strong enough to lie down and cry, and a tall bottle wrapped in straw. Inside it was southern sunshine, gathered on distant slopes. He rushed back. Sea Rat praised his good taste, and Water Rat blushed with pleasure as they spread the food on the roadside grass.
        - id: ch04-b14
          speaker: narrator
          text: >-
            As soon as his hunger eased, Sea Rat continued the story of his latest journey. Port by port, he carried his trusting listener around the coast of Spain. They landed at Lisbon, Oporto, and Bordeaux. Then he introduced Water Rat to the friendly harbors of Cornwall and Devon and took him up the Channel. For a long while the winds fought them. Storms drove the ship and weather beat against it. At last they reached the final quay, where Sea Rat stepped ashore and caught the first magical hints that spring was coming. After so much salt water and weary pounding sea, those first signs of the new season fired him with a different hunger. He set off on a long walk inland, eager to test the quiet life of some faraway farm.
        - id: ch04-b15
          speaker: narrator
          text: >-
            Trembling with excitement, Water Rat followed the adventurer mile after mile. They crossed stormy bays and busy anchorages, raced over harbor bars with the tide, and wound up rivers whose little towns appeared suddenly around a bend. When Sea Rat arrived at his dull inland farm, Water Rat sighed. He had no wish to hear about that part.
        - id: ch04-b16
          speaker: narrator
          text: >-
            Their meal was finished now. Food had restored Sea Rat's strength, and his voice had grown richer and more alive. In his eyes burned a brightness that might have come from some faraway beacon at sea. He filled his glass with deep red southern wine, leaned toward Water Rat, and caught his gaze. His eyes held the shifting gray-green of northern seas, restless and streaked with foam. In the glass, the wine shone hot and ruby red. It seemed like the very heart of the South, beating for anyone brave enough to answer. Those two lights, one shifting gray and one steady red, mastered Water Rat completely. They held his body and mind. Everything in the quiet world beyond them drew farther away until it no longer seemed to exist.
        - id: ch04-b17
          speaker: narrator
          text: >-
            The marvelous talk flowed on. Sometimes it hardly seemed like speech at all. It became a chant sung by sailors as they hauled a dripping anchor from the sea. It became the deep, ringing hum of rigging stretched tight in a hard northeast wind. Then came a fisherman's ballad as he pulled in his nets at sunset beneath an apricot-colored sky. Chords from guitar and mandolin drifted across the water from a gondola or a caique. The music changed again and became the wind itself. At first it sounded lonely and pleading. As it grew stronger, it rose to an angry, tearing scream. Then it sank away into a narrow musical stream of air slipping from the edge of a full, curved sail.
        - id: ch04-b18
          speaker: narrator
          text: >-
            Water Rat seemed to hear gulls and sea birds crying with hunger. Waves broke with soft thunder, and the shingle protested as the water dragged it back. Then those sounds became words once more. With a pounding heart, he followed adventures through a dozen seaports. There were fights and narrow escapes, moments when friends rallied around one another, loyal comradeships, and brave undertakings. In his mind he searched islands for treasure, fished in still lagoons, and slept all day on warm white sand. He heard of fishing far out at sea, and of mile-long nets coming up with mighty gatherings of silver fish. Danger arrived without warning. Breakers roared nearby on a moonless night. Through thick fog, the tall bow of a great ocean liner suddenly took shape above them.
        - id: ch04-b19
          speaker: narrator
          text: >-
            And he knew the joy of coming home. The ship rounded the headland, harbor lights opened ahead, and shadowy friends waited on the quay. A greeting rang out. A rope splashed into the water. Then came the climb up the steep little street toward the welcoming glow behind red curtains.
    - id: ch05
      title: The Road South
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: >-
            At last, inside Water Rat's waking dream, the adventurer seemed to rise. Still he spoke, and still those sea-gray eyes held Rat fast.
        - id: ch05-b02
          speaker: sea_rat
          text: >-
            Now I take the road again and keep southwest through many long, dusty days. At last I'll reach the little gray sea town I know so well, clinging to one steep side of its harbor. Through dark doorways, you can look down long flights of stone steps. Great pink clumps of valerian hang above them, and at the bottom shines a patch of blue water. Little boats lie tied to iron rings and posts in the old sea wall. They are painted as brightly as the boats I climbed in and out of when I was a child. Salmon leap on the flood tide. Schools of mackerel flash and play beside the quays and along the shore. And right past the windows, great vessels glide day and night. Some come slowly to their moorings. Others move out toward the open sea.
        - id: ch05-b03
          speaker: sea_rat
          text: >-
            Sooner or later, ships from every seafaring nation come there. At the appointed hour, the ship meant for me will drop anchor. I won't hurry. I'll wait until the right vessel lies in midstream, loaded deep, her bowsprit pointing down the harbor. I'll get aboard by boat or climb along a rope. Then one morning I'll wake to sailors singing and stamping above me, the capstan clinking, and the anchor chain rattling cheerfully in.
        - id: ch05-b04
          speaker: sea_rat
          text: >-
            We'll raise the jib and foresail. As the ship gathers speed enough to steer, the white houses along the harbor will slide slowly past. The voyage will have begun. Heading toward the point, she'll dress herself in canvas. Once we're outside, great green seas will slap against her hull as she leans into the wind and points south.
        - id: ch05-b05
          speaker: sea_rat
          text: >-
            And you must come too, young brother. The days pass and never return, and the South is still waiting. Choose adventure. Answer the call before the moment is gone forever. You only have to shut the door behind you and step lightly ahead. Then the old life is over and the new one has begun.
        - id: ch05-b06
          speaker: sea_rat
          text: >-
            Someday, a long time from now, you can wander home again if you wish. When you've emptied the cup and the play is done, sit beside your quiet river with a store of fine memories for company. You'll catch me easily on the road. You're young, while I'm growing old and travel slowly. I'll linger and look back. At last I'll see you coming, eager and lighthearted, with all the South in your face.
        - id: ch05-b07
          speaker: narrator
          text: >-
            The voice faded like the tiny trumpet of an insect dwindling swiftly into silence. Water Rat stared, unable to move or look away. At last he saw only a distant speck very far down the white road.
        - id: ch05-b08
          speaker: narrator
          text: >-
            He rose without thinking and slowly repacked the lunch basket. Back home, he gathered a few necessities and the small treasures he loved, and placed them in a satchel. He moved carefully, like a sleepwalker, always listening with parted lips. He put the satchel over his shoulder, chose a strong walking stick, and stepped across the threshold. There was no hurry in him, but no hesitation either. At that moment, Mole appeared in the doorway.
        - id: ch05-b09
          speaker: mole
          text: "Ratty! Where are you going?"
          emotion: surprised
        - id: ch05-b10
          speaker: narrator
          text: >-
            Mole caught him by the arm in astonishment.
        - id: ch05-b11
          speaker: water_rat
          text: "South, with all the others. First to the sea, then onto a ship, and away to the shores that are calling me."
        - id: ch05-b12
          speaker: narrator
          text: >-
            Rat spoke in a dreamy, flat voice and never looked at him. He pushed steadily ahead, fixed on his purpose. Thoroughly alarmed, Mole stepped in front of him and looked into his eyes. They were glazed and fixed, streaked with shifting gray. They were not his friend's eyes at all. Mole seized him, dragged him inside, threw him down, and held him there.
        - id: ch05-b13
          speaker: narrator
          text: >-
            Rat fought desperately for a few moments, using all his strength to break free. Then the strength suddenly left him. He lay still with his eyes closed, exhausted and trembling. Mole helped him to his feet and settled him in a chair. Rat collapsed in on himself, looking small and shrunken. A violent shiver ran through his body again and again. In time, the shaking turned into a fit of dry, helpless sobs. Mole fastened the door so Rat could not leave. He threw the satchel into a drawer and locked it away. Then he sat quietly on the table beside his friend and waited, giving the strange attack time to pass.
        - id: ch05-b14
          speaker: narrator
          text: >-
            Slowly, Rat slipped into a troubled doze. He started and muttered confusedly about wild, foreign things that Mole could not understand. At last, he fell into a deep sleep.
        - id: ch05-b15
          speaker: narrator
          text: >-
            Mole was deeply worried. He left Rat for a while and kept himself busy around the house. Darkness was falling when he returned to the parlor. Rat still sat where Mole had left him, wide awake now, but silent, listless, and miserable. Mole glanced quickly at his eyes. To his great relief, they were clear, dark, and brown again. Then he sat down, tried to cheer Rat, and helped him tell what had happened.
        - id: ch05-b16
          speaker: narrator
          text: >-
            Poor Ratty tried his best, explaining a little at a time. But most of what had happened had been suggestion and enchantment, not anything he could simply report. How could he put those haunting sea voices into cold words for someone else? How could he recreate the magic in the seafarer's hundred memories when he had heard them only secondhand? Now that the spell was broken and all its glamour gone, even Rat could barely account for what had happened. Only a few hours before, leaving had seemed inevitable. It had seemed like the one possible thing in the world. So it was no wonder that he failed to give Mole any clear idea of what he had endured that day.
        - id: ch05-b17
          speaker: narrator
          text: >-
            Mole understood enough. The attack was over, and Rat was himself again, though badly shaken and low in spirits. For now, he had lost all interest in his everyday life. Even the familiar pleasures that came with the changing season meant nothing to him.
        - id: ch05-b18
          speaker: narrator
          text: >-
            Pretending the subject hardly mattered, Mole began to talk about the harvest being gathered in. He described wagons piled so high they seemed to tower over the road, and teams of animals straining as they pulled them home. The great stacks were growing day by day. A huge moon rose over bare fields dotted with bundled sheaves. Then he spoke of apples reddening all around them and nuts turning brown. Soon he was talking about pots of jam, jars of preserves, and cordials being distilled for cold weather. By these easy steps, he carried the season toward midwinter. He lingered over its hearty pleasures, its warmth, and its snug life at home until his words became almost a song of praise.
        - id: ch05-b19
          speaker: narrator
          text: >-
            Little by little, Rat sat straighter and began to join in. His dull eyes brightened. He no longer seemed to be listening for some faraway voice.
        - id: ch05-b20
          speaker: narrator
          text: >-
            At the right moment, tactful Mole slipped out. He returned with a pencil and several half-sheets of paper and set them beside his friend's elbow.
        - id: ch05-b21
          speaker: mole
          text: >-
            You haven't written any poetry for quite a while. Why not try some tonight, instead of sitting here thinking too much? I believe you'll feel better once you've put something on paper, even if you only find a few rhymes.
        - id: ch05-b22
          speaker: narrator
          text: >-
            Rat wearily pushed the paper aside. Mole wisely found a reason to leave the room. When he peeked in much later, Rat was lost to the world. One moment he scribbled, and the next he sucked the end of his pencil. He sucked the pencil far more than he wrote, it was true.
        - id: ch05-b23
          speaker: narrator
          text: "But Mole was delighted. At least the cure had begun."
