audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm, observant storytelling with gentle humor
        timbre: clear and mellow
        pace: measured
        pitch: medium
    mole:
      display_name: Mole
      tts:
        delivery: earnest, curious, and quick to wonder
        timbre: soft and youthful
        pace: lively
        pitch: medium-high
    water_rat:
      display_name: Water Rat
      tts:
        delivery: friendly, assured, and dryly amused
        timbre: warm and smooth
        pace: easygoing
        pitch: medium
    badger:
      display_name: Badger
      tts:
        delivery: grave, authoritative, and firmly affectionate
        timbre: deep and rugged
        pace: deliberate
        pitch: low
    toad:
      display_name: Toad
      tts:
        delivery: theatrical, boastful, and quick to change moods
        timbre: rich and buoyant
        pace: animated
        pitch: medium
    gate_ferret:
      display_name: Ferret Sentry
      tts:
        delivery: sharp, suspicious, and military
        timbre: thin and hard
        pace: brisk
        pitch: medium-high
    bridge_stoat_one:
      display_name: First Bridge Sentry
      tts:
        delivery: taunting and gleefully cruel
        timbre: narrow and wiry
        pace: quick
        pitch: high
    bridge_stoat_two:
      display_name: Second Bridge Sentry
      tts:
        delivery: sneering and excited
        timbre: scratchy and light
        pace: quick
        pitch: medium-high
  chapters:
    - id: ch01
      title: Toad Comes Back
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: The Rat reached out one neat brown paw, caught Toad firmly by the back of the neck, and hauled with all his might. Slowly, the waterlogged Toad rose over the edge of the hole. At last he stood safely in the hall, dripping water, mud, and weeds. Yet his old high spirits came rushing back. He was in a friend's house again. There would be no more dodging, no more running, and no more trying to behave like the washerwoman he had pretended to be.
        - id: ch01-b02
          speaker: toad
          text: Oh, Ratty! You can't imagine what I've been through since I saw you. Such trials! Such suffering, all borne magnificently! And the escapes, the disguises, the clever tricks! I was sent to prison, and naturally I escaped. I was thrown into a canal, and I swam out. I stole a horse and sold it for a fortune. I fooled everyone and made them do exactly what I wanted. I really am an amazingly clever Toad! And wait till you hear what I did last—
        - id: ch01-b03
          speaker: water_rat
          text: Toad, go upstairs this minute. Take off that old cotton rag that looks as if it once belonged to a washerwoman. Wash yourself properly, put on some of my clothes, and try to come down looking like a gentleman. I've never seen anything as shabby, soaked, and disgraceful as you are now. Stop showing off. Don't argue. Go! I'll speak to you later.
        - id: ch01-b04
          speaker: narrator
          text: At first Toad meant to answer back. He had been ordered around quite enough in prison, and now a Rat was starting it all over again. Then he spotted himself in the mirror above the hat stand. The rusty black bonnet sat crooked over one eye. Toad changed his mind. He hurried upstairs as meekly as he could, washed and brushed himself thoroughly, and put on the Rat's clothes. For a long time he admired himself in the dressing-room mirror and wondered how anyone could ever have mistaken such an impressive animal for a washerwoman.
        - id: ch01-b05
          speaker: narrator
          text: Lunch was waiting when he came down. Toad was delighted, for he had traveled hard since the fine breakfast the gypsy had given him. As they ate, he told the Rat every adventure. He made his own quick thinking, clever plans, and narrow escapes the heart of the tale, until it sounded as if the whole journey had been one bright holiday. The more Toad bragged, the quieter and more serious the Rat became.
        - id: ch01-b06
          speaker: narrator
          text: At last even Toad ran out of things to say. After a short silence, the Rat spoke.
        - id: ch01-b07
          speaker: water_rat
          text: Toady, I don't want to hurt you after all you've suffered, but can't you see what a terrible fool you've made of yourself? By your own story, you were handcuffed, locked up, starved, chased, frightened half to death, mocked, insulted, and finally tossed into the water by a woman. Where was the fun in any of that? It all happened because you had to steal a motorcar. Cars have brought you nothing but trouble from the first moment you saw one. If you insist on getting mixed up with them, why steal them? If excitement is what you want, you might as well break your bones or lose all your money. Why choose to become a convict? When will you think sensibly, remember your friends, and give us some reason to be proud of you? Do you suppose I enjoy hearing everyone say that I keep company with jailbirds?
        - id: ch01-b08
          speaker: narrator
          text: Toad had one very comforting quality. He was good-hearted, and he never resented a scolding from a true friend for long. Even when his mind seemed firmly set, he could still see the other side. So he listened while Rat spoke with such seriousness. Inside, though, a rebellious little voice insisted that it had been fun, wonderful fun. Toad struggled to keep quiet. Now and then a muffled k-i-ck-ck-ck or poop-p-p escaped him, like a tiny motor snort or the cork popping from a soda bottle. But he let Rat finish. Then he drew a deep breath and answered in his nicest, humblest manner.
        - id: ch01-b09
          speaker: toad
          text: You're absolutely right, Ratty. You always make such good sense. I can see that I've been a vain old fool, but from now on I'll be a good Toad. I won't do it again. And honestly, motorcars haven't interested me nearly as much since my last soaking in your river. While I was hanging from the edge of your hole and catching my breath, I did have one sudden, brilliant idea about motorboats—there, there! Don't stamp and knock things over. It was only an idea. We'll say no more about it. Let's have coffee and a smoke and a quiet talk. Then I'll stroll down to Toad Hall, put on my own clothes, and set everything back on its proper course. I've had enough adventures. From now on I'll live quietly and respectably. I'll look after my estate, improve it, perhaps do a little gardening. My friends will always find dinner waiting when they visit, and I'll keep a pony cart for gentle drives through the country, just as I did before I grew restless and decided I had to do things.
        - id: ch01-b10
          speaker: water_rat
          text: Stroll down to Toad Hall? What are you talking about? You mean you haven't heard?
          emotion: surprised
        - id: ch01-b11
          speaker: toad
          text: Heard what? Ratty, tell me. Quickly! Don't try to spare me. What haven't I heard?
          emotion: fearful
        - id: ch01-b12
          speaker: water_rat
          text: Are you telling me you know nothing about the stoats and the weasels?
        - id: ch01-b13
          speaker: toad
          text: The Wild Wood animals? Not one word! What have they done?
          emotion: fearful
        - id: ch01-b14
          speaker: water_rat
          text: They've taken Toad Hall.
        - id: ch01-b15
          speaker: narrator
          text: Toad put his elbows on the table and lowered his chin onto his paws. A large tear gathered in each eye, spilled over, and struck the tabletop. Plop. Plop.
        - id: ch01-b16
          speaker: toad
          text: Go on, Ratty. Tell me everything. The worst shock is past. I'm myself again. I can bear it.
          emotion: sad
    - id: ch02
      title: The Fall of Toad Hall
      blocks:
        - id: ch02-b01
          speaker: water_rat
          text: When you got into that trouble of yours—when you vanished from society for a while over that little misunderstanding about a machine—
        - id: ch02-b02
          speaker: narrator
          text: Toad only nodded.
        - id: ch02-b03
          speaker: water_rat
          text: Naturally, everyone here talked about it. The news spread along the river and into the Wild Wood. As usual, the animals took sides. The River Bank animals defended you. They said you'd been treated shamefully and that nobody could expect justice anymore. But the Wild Wood crowd said you deserved it and that your behavior should have been stopped long ago. They grew very bold. They went around saying you were finished at last and would never, ever come back.
        - id: ch02-b04
          speaker: narrator
          text: Toad nodded again without speaking.
        - id: ch02-b05
          speaker: water_rat
          text: That's the sort of nasty little creatures they are. Mole and Badger stood by you through everything. They insisted you'd return somehow, and soon. They couldn't say how, but they were certain you would.
        - id: ch02-b06
          speaker: narrator
          text: Toad sat a little straighter and allowed himself a small, pleased smile.
        - id: ch02-b07
          speaker: water_rat
          text: They based their opinion on history. No law, they said, had ever managed to defeat your nerve and your talent for making things sound believable, especially when you had plenty of money behind you. So they carried their own things into Toad Hall and began sleeping there. They kept the rooms aired and everything in order, ready for the day you appeared. They didn't know exactly what would happen, though they had their suspicions about the Wild Wood animals. Now I come to the painful and tragic part. One night, a terribly dark night with hard wind and rain pouring down, a band of weasels armed to the teeth crept silently up the carriage drive toward the front entrance. At that very moment, a fierce force of ferrets advanced through the kitchen garden. They captured the backyard and all the service rooms. Meanwhile, a company of stoats who would stop at nothing occupied the conservatory and billiard room. They controlled every French window that opened onto the lawn.
        - id: ch02-b08
          speaker: water_rat
          text: Mole and Badger sat beside the smoking-room fire, telling stories and suspecting nothing. The storm made them feel safe, because it was not a night when any animal should have been outdoors. Then those fierce villains broke down the doors. They poured into the room from every side before Mole and Badger could prepare. Your friends fought as well as they could, but they had no weapons and had been taken completely by surprise. What chance did two animals have against hundreds? The invaders seized them and beat those two loyal creatures severely with sticks. Then they forced Mole and Badger out of the Hall and into the wet, bitter night. As they drove them away, the Wild Wooders added insult after insult, none of it called for.
        - id: ch02-b09
          speaker: narrator
          text: Toad let out a snicker. He quickly pulled himself together and arranged his face into a solemn expression.
        - id: ch02-b10
          speaker: water_rat
          text: The Wild Wooders have lived in Toad Hall ever since, behaving however they please. They stay in bed for half the day and demand breakfast at every possible hour. The whole house is in such a dreadful mess that, according to what I've heard, it isn't fit for anyone to see. They eat your food and drink your drinks. They make bad jokes about you and sing vulgar songs about prisons, judges, and policemen. Those songs are horribly personal, and there isn't the smallest bit of real humor in them. Now they've told the tradespeople and everybody else in the neighborhood that they've moved in for good and never intend to leave.
        - id: ch02-b11
          speaker: toad
          text: Oh, are they? I'll put a stop to that right now!
          emotion: angry
        - id: ch02-b12
          speaker: narrator
          text: Toad jumped up and grabbed a stick.
        - id: ch02-b13
          speaker: water_rat
          text: It's no use, Toad! Come back and sit down. You'll only land in more trouble.
        - id: ch02-b14
          speaker: narrator
          text: There was no stopping him. Toad marched quickly down the road with the stick over his shoulder, muttering and boiling with anger. As he neared his own front gate, a long yellow ferret sprang up behind the fence. He carried a gun.
        - id: ch02-b15
          speaker: gate_ferret
          text: Who goes there?
        - id: ch02-b16
          speaker: toad
          text: What ridiculous nonsense! How dare you speak to me like that? Come out at once, or I'll—
          emotion: angry
        - id: ch02-b17
          speaker: narrator
          text: The ferret did not answer. He raised the gun to his shoulder. Toad wisely dropped flat in the road. Bang! A bullet whistled above his head. Toad scrambled up and raced away as fast as he could. Behind him, the ferret laughed. Other nasty, thin little laughs joined in and carried the sound after him.
        - id: ch02-b18
          speaker: narrator
          text: Toad returned with his pride badly crushed and told the Water Rat what had happened.
        - id: ch02-b19
          speaker: water_rat
          text: Didn't I warn you? It's hopeless. They've posted armed guards everywhere. You'll have to wait.
        - id: ch02-b20
          speaker: narrator
          text: Toad still refused to give up. He took out the Rat's boat and rowed upstream toward the garden side of Toad Hall.
        - id: ch02-b21
          speaker: narrator
          text: When his old home came into view, he rested on the oars and studied the grounds carefully. Nothing moved. Toad Hall glowed in the evening sun, peaceful and seemingly deserted. Pigeons came down in twos and threes and settled along the straight roofline. The garden was bright with masses of flowers. Below it, the creek ran toward the boathouse, and the little wooden bridge crossed the water. The whole place looked calm, empty, and almost as if it had been waiting for Toad to return. He decided the boathouse would be the safest place to try first. Taking short, cautious strokes, he paddled toward the mouth of the creek. He was just passing beneath the bridge when a sudden crash split the quiet.
        - id: ch02-b22
          speaker: narrator
          text: A huge stone dropped from above and smashed through the bottom of the boat. Water rushed in. The boat sank, leaving Toad struggling in deep water. He looked up and saw two stoats leaning over the bridge, watching with delight.
        - id: ch02-b23
          speakers: [bridge_stoat_one, bridge_stoat_two]
          ensemble: duo
          text: Next time it'll be your head, Toady!
        - id: ch02-b24
          speaker: narrator
          text: Furious, Toad swam to shore. The stoats clung to each other and laughed until each of them nearly had a fit.
        - id: ch02-b25
          speaker: narrator
          text: Toad made the long, tired walk back and once more told the Rat about his failed attack.
        - id: ch02-b26
          speaker: water_rat
          text: What did I tell you? And look at what you've done now! You've lost my boat, the one I loved so much. You've completely ruined the nice suit I lent you, too. Honestly, Toad, you can be the most exhausting animal alive. I'm amazed you have any friends left.
          emotion: angry
        - id: ch02-b27
          speaker: narrator
          text: Toad immediately understood how foolish and wrong he had been. Rat had warned him twice, yet Toad had ignored him twice. Now Rat's beloved boat lay at the bottom of the creek, and Rat's good suit was soaked and spoiled. Toad admitted every error without trying to excuse himself. He made a full apology for both the boat and the clothes. Then he ended with the open, wholehearted surrender that always disarmed his friends, softened their anger, and brought them back to his side.
        - id: ch02-b28
          speaker: toad
          text: Ratty, I see now that I've been stubborn and reckless. From this moment on, I promise to be humble and obedient. I won't do anything without your wise advice and complete approval.
        - id: ch02-b29
          speaker: water_rat
          text: If you truly mean that, then here's my advice. It's late. Sit down and eat your supper, which will be ready in a minute, and be patient. We can't do anything until we've met with Mole and Badger, heard their latest news, and asked what they think we should do.
        - id: ch02-b30
          speaker: toad
          text: Oh, yes. Mole and Badger, of course. Where are the dear fellows? I'd forgotten all about them.
    - id: ch03
      title: Friends in the Night
      blocks:
        - id: ch03-b01
          speaker: water_rat
          text: You have some nerve asking that. While you raced around the country in costly cars, galloped proudly on fine horses, and ate the best food wherever you went, those two loyal animals have been living outdoors in every kind of weather. They've had rough days and hard nights. All this time, they've watched your house, patrolled your land, kept an eye on the stoats and weasels, and worked out plans to win your property back. You don't deserve friends as true as Mole and Badger. Someday, when it's too late, you'll regret that you didn't value them while you had them.
        - id: ch03-b02
          speaker: toad
          text: I know I'm an ungrateful beast! Let me go find them in the cold, dark night. I'll share their hardships and prove that I—wait! Was that the sound of dishes on a tray? Supper at last! Hooray! Come on, Ratty!
        - id: ch03-b03
          speaker: narrator
          text: Rat remembered that Toad had eaten prison food for a very long time. That explained a great deal, and some allowance had to be made for him. So Rat followed him to the supper table. Like a generous host, he kept the dishes coming and encouraged Toad as he bravely tried to make up for all those weeks of poor meals.
        - id: ch03-b04
          speaker: narrator
          text: They had just finished eating and settled into their armchairs when a heavy knock sounded at the door. Toad grew nervous. The Rat gave him a knowing nod, opened the door, and Mr. Badger walked in.
        - id: ch03-b05
          speaker: narrator
          text: Badger looked like an animal who had spent several nights away from all the small comforts of home. His shoes were thick with mud. His fur was rough and tangled, and his whole appearance showed days of hard outdoor living. Of course, Badger had never been a particularly polished animal, even in easier times. He came solemnly across the room, stopped in front of Toad, and took his paw.
        - id: ch03-b06
          speaker: badger
          text: Welcome home, Toad! But listen to me, calling this a homecoming. What a miserable return it is. Poor, unhappy Toad!
        - id: ch03-b07
          speaker: narrator
          text: Then Badger turned his back, sat at the table, pulled in his chair, and cut himself a large slice of cold pie. His grave welcome alarmed Toad, but the Rat whispered to him.
        - id: ch03-b08
          speaker: water_rat
          text: Don't worry about it. Pay no attention, and don't say anything to him yet. Badger always becomes gloomy when he needs a meal. Give him half an hour and he'll be a different animal.
        - id: ch03-b09
          speaker: narrator
          text: They waited quietly. Soon a second, lighter knock came at the door. The Rat nodded to Toad again and brought in Mole, who was shabby and unwashed, with pieces of hay and straw caught in his fur.
        - id: ch03-b10
          speaker: mole
          text: Hooray, it's dear old Toad! You're really back! We never thought you'd return this soon. You must have escaped somehow, you clever, inventive, brilliant Toad!
          emotion: happy
        - id: ch03-b11
          speaker: narrator
          text: Mole's face shone as he danced around Toad. Rat knew at once what that praise would do. He caught Mole by the elbow and tried to stop him, but the warning came too late. Toad's chest was already rising. He seemed to grow larger with every flattering word.
        - id: ch03-b12
          speaker: toad
          text: Clever? Oh, no. My friends don't consider me clever. I merely escaped from the strongest prison in England. Then I took control of a train and got away on it. Then I wore a disguise and fooled everyone across the countryside. That's all. I'm a complete idiot, obviously! Let me tell you one or two little stories, Mole. You can decide for yourself.
        - id: ch03-b13
          speaker: mole
          text: All right, but tell them while I eat. I haven't had one bite since breakfast. Oh, my!
        - id: ch03-b14
          speaker: narrator
          text: Mole moved to the supper table, sat down, and helped himself generously to cold beef and pickles. Toad planted himself on the rug before the fire. He pushed one paw into his pocket and brought out a handful of silver.
        - id: ch03-b15
          speaker: toad
          text: Look at this! Not bad for a few minutes of work, is it? Can you guess how I earned it, Mole? Trading horses. That's how!
        - id: ch03-b16
          speaker: mole
          text: Keep going, Toad. I want to hear all about it.
        - id: ch03-b17
          speaker: water_rat
          text: Please be quiet, Toad. And Mole, stop encouraging him when you know how he gets. Tell us the situation as soon as you can. Toad is finally back, so what should we do now?
        - id: ch03-b18
          speaker: mole
          text: The situation couldn't be much worse, and I have no idea what we can do. Badger and I have circled the house again and again, day and night. It's always the same. Guards everywhere. Guns pointed at us. Stones thrown at us. There's always someone watching, and the moment they spot us, they laugh. That's the worst part. Their laughing makes me furious.
        - id: ch03-b19
          speaker: water_rat
          text: This is certainly difficult. Still, I think I can see, deep in my mind, what Toad ought to do. He should—
        - id: ch03-b20
          speaker: mole
          text: No, he shouldn't! You don't understand at all. What he needs to do is—
        - id: ch03-b21
          speaker: toad
          text: Well, whatever it is, I refuse! I won't be ordered around by all of you. We're discussing my house. I know exactly what must be done, and I'll tell you. I'm going to—
        - id: ch03-b22
          speaker: narrator
          text: Rat tried to finish his advice. Mole shouted over him with a different plan. Toad shouted over both of them, refusing every order before he had even heard it. Soon all three were talking at once at the very tops of their voices. Nobody listened, everybody insisted, and the noise became deafening. Then a thin, dry voice somehow carried through the uproar.
        - id: ch03-b23
          speaker: badger
          text: Every one of you, be quiet at once!
          emotion: angry
        - id: ch03-b24
          speaker: narrator
          text: Silence fell instantly. Badger had finished his pie and now sat turned toward them, fixing all three with a severe stare. They stopped where they were and waited for him to address them. But once Badger knew he had their attention, he quietly turned back to the table and reached for the cheese. No one dared interrupt. His solid character commanded that much respect. The room remained silent while he ate every bite he wanted and finally brushed the crumbs from his knees. Toad twisted and fidgeted through the long wait, but Rat kept a firm hold on him.
        - id: ch03-b25
          speaker: narrator
          text: At last Badger rose and stood before the fireplace, thinking. Then he spoke.
        - id: ch03-b26
          speaker: badger
          text: Toad! You wretched, troublesome little animal. Aren't you ashamed? Your father was my old friend. What do you think he would say if he were here tonight and knew everything you've done?
          emotion: angry
        - id: ch03-b27
          speaker: narrator
          text: By then Toad lay on the sofa with his feet up. He rolled onto his face, shaking with sorry sobs.
        - id: ch03-b28
          speaker: badger
          text: There, there. Never mind. Stop crying. We'll leave the past behind and help you begin again. But Mole is right. Stoats guard every approach, and no creature makes a better sentry. We can't attack the house. They're much too strong for us.
          emotion: calm
        - id: ch03-b29
          speaker: toad
          text: Then everything is lost! I'll join the army and go away. I'll never see my beloved Toad Hall again!
          emotion: sad
        - id: ch03-b30
          speaker: badger
          text: Come now, Toady. Take heart. A place can be won back in more ways than one. I haven't finished. I'm about to tell you a great secret.
          emotion: calm
        - id: ch03-b31
          speaker: narrator
          text: Toad slowly sat up and wiped his eyes. The word “secret” always pulled him closer. Secrets had a powerful attraction for him, largely because he could never keep them. He loved that strange, forbidden thrill of hurrying off to tell another animal, especially after he had faithfully promised to say nothing at all.
    - id: ch04
      title: The Secret Passage
      blocks:
        - id: ch04-b01
          speaker: badger
          text: There is an underground passage. It begins on the riverbank near this house and runs straight into the middle of Toad Hall.
        - id: ch04-b02
          speaker: toad
          text: Oh, nonsense, Badger. You've been listening to stories from the local taverns. I know every inch of Toad Hall, inside and outside. I promise you there's no passage.
        - id: ch04-b03
          speaker: badger
          text: My young friend, your father was a worthy animal and much worthier than certain others I know. He was also a close friend of mine, and he told me many things he would never have told you. He discovered the passage. He didn't build it, of course. It had been there for hundreds of years before he came to the Hall. But he repaired it and cleaned it out in case it might be useful during danger or trouble. Then he showed it to me.
        - id: ch04-b04
          speaker: badger
          text: Your father told me not to let you know. He said you were a good boy, but far too flighty, and that you simply couldn't keep your mouth shut. If you ever fell into real trouble and the tunnel could help you, I was allowed to reveal it. Not before.
        - id: ch04-b05
          speaker: narrator
          text: The other animals looked closely at Toad. They wanted to see how he would take his father's judgment. At first his mouth tightened, and he seemed ready to sulk at being called flighty and unable to hold his tongue. But the mood did not last. Toad was a good fellow underneath his vanity, and almost immediately his face brightened again.
        - id: ch04-b06
          speaker: toad
          text: Well, perhaps I do talk a little. That's what happens to a popular fellow. Friends gather around me, we tease one another, I shine, I tell witty stories, and somehow my tongue starts moving. Conversation is one of my gifts. People say I should have a salon, though I've no idea what that is. Never mind. Go on, Badger. How can your passage help us?
        - id: ch04-b07
          speaker: badger
          text: I've learned a few things lately. I had Otter dress as a chimney sweep and go to the back door with brushes over his shoulder, asking for work. Tomorrow night, the Wild Wooders are holding a great banquet. I believe it's the Chief Weasel's birthday. Every weasel will gather in the dining hall to eat, drink, laugh, and carry on. They won't bring guns, swords, sticks, or any other weapon.
        - id: ch04-b08
          speaker: water_rat
          text: But the sentries will still be at their posts.
        - id: ch04-b09
          speaker: badger
          text: Exactly. That's the point. The weasels will rely completely on those excellent guards. And that is why the passage matters. The tunnel comes up directly beneath the butler's pantry, right beside the dining hall.
        - id: ch04-b10
          speaker: toad
          text: Ah! So that's why the floorboard squeaks in the butler's pantry. Now it makes sense!
          emotion: surprised
        - id: ch04-b11
          speaker: mole
          text: We'll slip quietly into the pantry—
        - id: ch04-b12
          speaker: water_rat
          text: Carrying our pistols, swords, and sticks—
        - id: ch04-b13
          speaker: badger
          text: Then we'll rush into the dining hall.
        - id: ch04-b14
          speaker: toad
          text: And we'll whack them, and whack them, and whack them!
          emotion: happy
        - id: ch04-b15
          speaker: narrator
          text: Toad ran in circles around the room and leaped over the chairs in delight.
        - id: ch04-b16
          speaker: badger
          text: Very well. The plan is settled, and there's nothing left to quarrel over. It's late, so all of you go straight to bed. Tomorrow morning we'll make every necessary arrangement.
        - id: ch04-b17
          speaker: narrator
          text: Toad went obediently to bed with the others. Badger's tone made it clear that refusal would be unwise. Toad felt much too excited to sleep, or so he believed. But the day behind him had been very long and packed with one event after another. Besides, sheets and blankets felt like dear friends after a drafty prison cell, where he had slept on a stone floor with only a little plain straw beneath him. Within seconds of putting his head on the pillow, Toad was snoring happily.
        - id: ch04-b18
          speaker: narrator
          text: Naturally, Toad dreamed a great deal. Roads waited until he needed them and then ran away. Canals turned around, chased him, and caught him. While he hosted an elegant dinner, a barge sailed straight into the banquet hall with all his washing for the week. Next he found himself alone in the secret passage, struggling onward through the dark. The tunnel twisted around him, turned back on itself, shook like an animal, and finally sat upright on one end. Yet the dream worked out beautifully in the end. Toad stood once more inside his own Hall, safe and triumphant. Every friend he had gathered around him and assured him with complete seriousness that he really was an extraordinarily clever Toad.
    - id: ch05
      title: Getting Ready
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: Toad slept until late the next morning. By the time he came downstairs, the other animals had finished breakfast and moved on with their day. Mole had slipped away somewhere alone without telling anyone where he was going. Badger sat deep in an armchair with the newspaper open before him. If he felt any concern about the dangerous work planned for that evening, he showed none at all. Rat made up for Badger's calm. He bustled around the room with both arms full of weapons, laying each one into one of four small piles on the floor. Every trip added something new. As he hurried back and forth, he chanted excitedly under his breath in a regular rhythm.
        - id: ch05-b02
          speaker: water_rat
          text: A sword for Rat, a sword for Mole, a sword for Toad, a sword for Badger! A pistol for Rat, a pistol for Mole, a pistol for Toad, a pistol for Badger!
        - id: ch05-b03
          speaker: narrator
          text: He kept up the steady rhythm, and all four piles grew higher and higher.
        - id: ch05-b04
          speaker: badger
          text: That's all perfectly fine, Rat. I'm not criticizing you. But once we're safely past those stoats and their hateful guns, we won't need swords or pistols. Put the four of us inside the dining hall with our sticks, and we'll clear out every one of them in five minutes. I could manage it alone. I only decided not to rob you fellows of the fun.
        - id: ch05-b05
          speaker: water_rat
          text: Better to be safe.
        - id: ch05-b06
          speaker: narrator
          text: Rat answered while polishing a pistol barrel against his sleeve. He lifted it, closed one eye, and looked carefully along its length. Toad, meanwhile, finished the breakfast that had been kept for him. Then he selected a stout stick, planted his feet, and swung it with great force. Again and again he struck at imaginary stoats and weasels crowding around him.
        - id: ch05-b07
          speaker: toad
          text: I'll learn them to steal my house! I'll learn them. Just wait, I'll learn them!
          emotion: angry
        - id: ch05-b08
          speaker: water_rat
          text: Don't say “learn them,” Toad. That's not proper English.
        - id: ch05-b09
          speaker: badger
          text: Why must you always pick at Toad? What's wrong with his English? I use the same English myself. If it's good enough for me, it should be good enough for you.
        - id: ch05-b10
          speaker: water_rat
          text: I'm very sorry. I only think the right word is “teach,” not “learn.”
        - id: ch05-b11
          speaker: badger
          text: But we have no wish to teach them. We want to learn them. Learn them, learn them! And that's exactly what we're going to do.
        - id: ch05-b12
          speaker: water_rat
          text: Oh, fine. Have it your way.
        - id: ch05-b13
          speaker: narrator
          text: Rat had started the discussion with confidence, but Badger's argument left him thoroughly confused. He gave up and moved into a corner by himself. There, in a low voice, he tested the two words again and again, trying to decide which one sounded right.
        - id: ch05-b14
          speaker: water_rat
          text: Learn them, teach them. Teach them, learn them.
        - id: ch05-b15
          speaker: narrator
          text: Badger finally told him, rather sharply, to stop.
    - id: ch06
      title: Mole's Clever Trick
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: Before long, Mole tumbled into the room looking tremendously pleased with himself.
        - id: ch06-b02
          speaker: mole
          text: I've had such fun! I made those stoats jump, I can tell you.
          emotion: happy
        - id: ch06-b03
          speaker: water_rat
          text: You were careful, weren't you, Mole?
        - id: ch06-b04
          speaker: mole
          text: Of course I was. I got the idea when I went to the kitchen to make sure Toad's breakfast stayed warm. His old washerwoman's dress was hanging on a wooden rack in front of the fire, along with the bonnet and shawl he wore home yesterday. I put on the dress, tied on the bonnet, wrapped myself in the shawl, and walked boldly up to Toad Hall. The sentries were alert at their posts. They pointed their guns, demanded to know who was coming, and carried on with all their other military nonsense. I kept my head down and acted as respectful as any washerwoman. I wished the gentlemen a good morning and asked whether they wanted any washing done that day.
        - id: ch06-b05
          speaker: mole
          text: They looked down their noses at me and said they didn't do laundry while on duty. So I asked whether they ever did any at all. Ho, ho! Wasn't that funny, Toad?
        - id: ch06-b06
          speaker: toad
          text: What a poor, silly creature you are.
        - id: ch06-b07
          speaker: narrator
          text: Toad spoke in his grandest, most superior voice. In truth, he was painfully jealous. Dressing as a washerwoman, walking boldly up to the enemy, and making jokes at the sentries was exactly the kind of adventure Toad would have loved. He wished he had thought of it himself. Even worse, Mole had managed it only because Toad had stayed in bed and overslept.
        - id: ch06-b08
          speaker: mole
          text: Some of the stoats turned pink. Their sergeant told me to run along and stop keeping his men from their duty. “Run along?” I said. “Very soon, I won't be the one running!”
        - id: ch06-b09
          speaker: water_rat
          text: Oh, Moly. How could you?
        - id: ch06-b10
          speaker: narrator
          text: Badger lowered his newspaper.
        - id: ch06-b11
          speaker: mole
          text: I saw all their ears prick up at once. They stared from one face to another, but the sergeant told them not to pay attention because I didn't know what I was talking about. So I asked whether he was quite sure of that. Then I told him my own daughter did Mr. Badger's laundry. That proved I knew things the stoats did not, and they would learn the truth soon enough. Tonight, I warned them, a hundred bloodthirsty badgers carrying rifles would attack Toad Hall across the paddock. Six full boatloads of rats, armed with pistols and cutlasses, would sail up the river and land in the garden. At the same time, a special army of toads called the Die-Hards, or the Death-or-Glory Toads, would storm through the orchard. They would sweep away every defender while roaring for revenge. I finished by saying there wouldn't be enough left of the stoats to wash unless they escaped while they still had the chance.
        - id: ch06-b12
          speaker: mole
          text: Then I ran off. Once they couldn't see me, I hid, crept back through the ditch, and watched through the hedge. They were as frightened and confused as could be. They ran in every direction, crashed into one another, and all gave orders while none of them listened. The sergeant kept sending groups to far corners of the grounds, then sending more stoats to call them back. I heard the guards complaining that the weasels would sit comfortably in the banquet hall with food, toasts, songs, and all the fun. Meanwhile, the stoats had to shiver outside in the cold and dark, only to be chopped apart by bloodthirsty badgers at the end.
        - id: ch06-b13
          speaker: toad
          text: Mole, you complete fool! You've ruined the entire plan!
          emotion: angry
        - id: ch06-b14
          speaker: badger
          text: Mole, I see that you have more sense in one little finger than certain animals have in their whole fat bodies. You handled that beautifully. I'm beginning to expect great things from you. Well done, Mole. Clever Mole.
        - id: ch06-b15
          speaker: narrator
          text: Badger's praise drove Toad nearly wild with jealousy. He could not understand why Mole's foolish visit had been clever, and he certainly could not see what Mole had done to deserve such admiration. Toad's temper rose. He was just about to show it and expose himself to one of Badger's dry, cutting replies when the lunch bell rang. The interruption arrived just in time to save him.
        - id: ch06-b16
          speaker: narrator
          text: Lunch was plain but filling, with bacon, broad beans, and macaroni pudding. When the meal ended, Badger settled into an armchair.
        - id: ch06-b17
          speaker: badger
          text: We have a great deal to do tonight, and we may be busy until very late. I'm going to sleep for a little while, now that I have the chance.
        - id: ch06-b18
          speaker: narrator
          text: Badger spread a handkerchief over his face and soon began to snore. The anxious, hardworking Rat returned to his preparations at once. Once again he hurried among the four piles, naming every new piece of equipment as he set it down.
        - id: ch06-b19
          speaker: water_rat
          text: A belt for Rat, a belt for Mole, a belt for Toad, a belt for Badger!
        - id: ch06-b20
          speaker: narrator
          text: With every trip, Rat produced another strap, belt, or piece of equipment. There seemed to be no end to it. Mole finally linked his arm through Toad's and led him out into the open air. He settled Toad into a wicker chair and asked him to tell every adventure from the beginning. Toad was only too delighted to oblige. Mole was a patient, interested listener. No Rat stood nearby to correct the details, and no Badger interrupted with an unfriendly question. With nothing holding him back, Toad let himself go, and the tale grew richer and more heroic as he spoke.
        - id: ch06-b21
          speaker: narrator
          text: "A good deal of what Toad described had never quite happened. Those parts belonged to another category altogether: what might have happened if only he had thought of it at the right moment, instead of thinking of it ten minutes afterward. Adventures of that kind are nearly always the finest, funniest, and most exciting. And after all, why shouldn't they be truly ours, just as much as the smaller and rather disappointing events that actually take place?"
