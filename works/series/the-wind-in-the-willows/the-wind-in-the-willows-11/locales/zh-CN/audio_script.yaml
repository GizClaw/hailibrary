audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 温暖从容，带着含蓄的幽默
        timbre: 清澈醇厚
        pace: 舒缓而富于变化
        pitch: 中低
    toad:
      display_name: 蟾蜍
      tts:
        delivery: 自信外放，兴奋时滔滔不绝
        timbre: 饱满洪亮
        pace: 明快多变
        pitch: 中低
    rat:
      display_name: 河鼠
      tts:
        delivery: 热心机敏，认真时坚定直接
        timbre: 清亮温暖
        pace: 中等偏快
        pitch: 中
    mole:
      display_name: 鼹鼠
      tts:
        delivery: 诚恳活泼，得意时兴致勃勃
        timbre: 柔和朴实
        pace: 中等
        pitch: 中
    badger:
      display_name: 獾
      tts:
        delivery: 沉稳威严，话少而有分量
        timbre: 低沉厚实
        pace: 舒缓
        pitch: 低
    ferret:
      display_name: 雪貂岗哨
      tts:
        delivery: 警觉生硬，带着敌意
        timbre: 尖利干脆
        pace: 中等偏快
        pitch: 中高
    stoat_1:
      display_name: 第一只白鼬
      tts:
        delivery: 刻薄得意，专爱奚落人
        timbre: 尖细轻薄
        pace: 快
        pitch: 高
    stoat_2:
      display_name: 第二只白鼬
      tts:
        delivery: 刻薄得意，随声附和
        timbre: 尖细轻薄
        pace: 快
        pitch: 高
  chapters:
    - id: ch01
      title: 回到朋友家
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 河鼠伸出灵巧的棕色小爪子，牢牢揪住蟾蜍的后颈，使劲一提一拉。浑身湿透的蟾蜍缓慢却稳稳地越过洞口边缘，终于平安站进门厅。他满身泥浆和水草，水还一股股往下淌，模样实在谈不上体面。可这些全不妨事。他发现自己已经回到朋友家，再不用躲躲藏藏，也不用想尽办法避开追捕。更叫他轻松的是，他终于能脱掉那身有失身份、扮起来又格外费劲的衣裳。转眼之间，他又成了从前那个兴高采烈的蟾蜍。
        - id: ch01-b02
          speaker: toad
          text: 河鼠啊，我们分别以后，我吃过多少苦，你根本想不到！那些考验和折磨，我全都高尚地忍下来了。还有逃亡、伪装和计谋，样样都安排得聪明，做得漂亮！我进了监狱，当然又逃了出来。有人把我扔进运河，我游上了岸。我偷来一匹马，又卖了一大笔钱。所有人都叫我耍得团团转，只能照我的意思办。我这只蟾蜍真是聪明透顶！你猜我最后又干了什么？等着，我这就告诉你！
          emotion: happy
        - id: ch01-b03
          speaker: rat
          text: 蟾蜍，立刻上楼去。把那块破棉布脱下来，看样子从前是哪个洗衣妇穿过的。你好好洗干净，再换上我的衣服。要是办得到，下楼时尽量像个体面人。我一辈子都没见过像你这么寒酸、狼狈又不成样子的东西！别吹牛，别争辩，快去。待会儿我还有话要说。
        - id: ch01-b04
          speaker: narrator
          text: 蟾蜍本想留下来顶几句嘴。在监狱里，他早受够了别人发号施令。如今这一套又来了，而且命令他的还是一只河鼠！偏偏他看见了帽架上方的镜子。镜中那顶褪色黑帽歪戴在他头上，还很神气地遮着一只眼睛。蟾蜍马上改了主意，迅速又谦卑地上楼，走进河鼠的更衣室。他从头到脚洗刷干净，认真梳理一番，再换好衣服。随后，他站在镜前欣赏了许久，越看越得意，也越发满意。他心想，那些曾有哪怕一刻把他认成洗衣妇的人，必定全是十足的傻瓜。
        - id: ch01-b05
          speaker: narrator
          text: 等他重新下楼，午餐已经摆好。自从吃过吉卜赛人那顿丰盛早餐，他又经历了不少折腾，也做了许多辛苦的运动，此刻看见桌上的饭菜，自然打心眼里欢喜。吃饭时，他把一路历险全讲给河鼠听。他说到每一个险境，都尤其爱强调自己多么聪明，遇到危险多么镇定，落进困境又怎样靠狡猾机敏找出退路。那些真正叫他吃足苦头的经历，从他嘴里出来以后，仿佛不再是受难，而是一场热闹非凡、色彩绚丽的游乐。蟾蜍越说越来劲，越吹越得意，河鼠的神情却越来越严肃，话也越来越少，最后只剩下一片沉默。
        - id: ch01-b06
          speaker: rat
          text: 蟾蜍老弟，你已经吃了这么多苦，我不想再叫你难受。可你认真想想，难道还看不出自己闹了多大的笑话？照你说的，你戴过手铐，坐过监牢，挨过饿，也叫人追得到处逃。你吓得魂都没了，受尽侮辱和嘲笑，最后还让一个女人丢进水里。这到底哪里好玩？所有麻烦都因为你非要偷汽车。从你第一次看见汽车起，它们带给你的只有灾祸。你偏要碰汽车也就算了，可为什么还非偷不可？你若觉得刺激，撞成残废随你。你要换个花样，弄到破产也随你。可你为什么偏要做囚犯？你什么时候才能懂点事，替朋友想想，也做点叫朋友脸上有光的事？我走在外面，听见动物们说我专同牢犯交朋友，你以为我会很光彩吗？
        - id: ch01-b07
          speaker: narrator
          text: 蟾蜍身上有一点很叫朋友宽慰。他是个心地极好的动物，真正的朋友训他，他从来不记恨。哪怕他一门心思认准了什么，也总还有本事转到另一边，看看别人说的是不是也有道理。河鼠认真训话时，他虽然不服气地暗暗反驳，反复告诉自己，那一路明明好玩，而且好玩极了，肚子里还憋出咯咔咔、噗噗之类的怪响。这些声音有时像忍住的哼哼，有时又像汽水瓶的塞子刚给拔开。可等河鼠把话全说完，他还是深深叹了口气，也真的准备认错了。
        - id: ch01-b08
          speaker: toad
          text: 你说得对，河鼠。你想事情永远这么稳妥。我确实一直是个自高自大的老傻瓜，现在已经看清楚了。往后我要做一只好蟾蜍，再不胡来了。至于汽车，上回掉进你这条河以后，我已经没那么喜欢了。其实刚才我攀着洞口喘气时，倒冒出一个了不起的新念头，是关于汽艇的——好啦，老伙计，别跺脚，也别碰翻东西！那只是一个念头，我们不谈了。喝杯咖啡，抽袋烟，再安静聊会儿，我就悠闲地走回蛤蟆庄园，换上自己的衣服，让日子回到老样子。我受够冒险了。以后我要安稳体面地生活，照管产业，偶尔整理花园。朋友来时总有饭吃。我还要备一辆小马车，像从前一样在乡间慢慢走。那些好日子里，我还没变得心浮气躁，总觉得非得干点大事。
        - id: ch01-b09
          speaker: rat
          text: 悠闲地走回蛤蟆庄园？你在说什么？难道你还没听说？
          emotion: surprised
        - id: ch01-b10
          speaker: toad
          text: 听说什么？快告诉我，河鼠！别耽搁，也别怕我受不了。我到底不知道什么？
        - id: ch01-b11
          speaker: rat
          text: 你一点也没听说白鼬和黄鼠狼的事？
        - id: ch01-b12
          speaker: toad
          text: 野林里的那些家伙？我一个字也没听到！他们干了什么？
          emotion: fearful
        - id: ch01-b13
          speaker: rat
          text: 他们已经占了蛤蟆庄园。
        - id: ch01-b14
          speaker: narrator
          text: 蟾蜍把两肘撑在桌上，双爪托住下巴。两只眼里各涌出一大颗泪珠，满得溢出来，啪嗒、啪嗒，落在桌面上。
        - id: ch01-b15
          speaker: toad
          text: 继续说吧，河鼠。把一切都告诉我。最难挨的那一下已经过去了。我又活过来了，撑得住。
          emotion: sad
        - id: ch01-b16
          speaker: rat
          text: 你惹上那桩麻烦以后……我是说，因为那场关于一部机器的误会，你暂时离开了大家的生活……这件事自然很快传遍了河岸，连野林也在议论。动物们分成了两派。河岸居民替你说话，说你受到了卑劣的对待，如今天底下根本没有公道。野林里的动物却说你罪有应得，这种胡闹早该制止。他们越来越神气，到处说你这回彻底完了，再也回不来，永远也回不来了。
        - id: ch01-b17
          speaker: narrator
          text: 蟾蜍默默点头。
        - id: ch01-b18
          speaker: rat
          text: 他们就是这样一群小坏蛋。可鼹鼠和獾始终站在你这边。不管别人说什么，他们都坚持说，你一定很快就会回来。至于用什么办法，他们自己也说不清，可他们确信你总有办法！他们还拿过去发生的事作依据，说历史已经证明，从来没有哪条刑法制服得了你这样的厚脸皮和花言巧语，何况这些本事背后，还有一个装满钱的大口袋替你撑腰。
        - id: ch01-b19
          speaker: narrator
          text: 蟾蜍慢慢坐直了，嘴角又露出一点得意的笑。
        - id: ch01-b20
          speaker: rat
          text: 所以，他们把自己的东西搬进蛤蟆庄园，睡在那里，天天替你开窗通风，也照看宅子。他们想着，等你重新出现，一切都已经收拾妥当。对于野林里的动物，他们并非毫无怀疑，可还是没料到后来会发生什么。现在，最痛苦也最悲惨的一段来了。一个黑得吓人的夜晚，狂风大作，雨像从天上整桶倒下来。一群武装到牙齿的黄鼠狼沿马车道无声地摸到正门。一队穷凶极恶的雪貂穿过厨房菜园，占了后院和所有附属房屋。另一队什么都敢干的白鼬夺下暖房和台球室，还控制了通往草坪的落地窗。几路敌人就在同一时刻发动了进攻。
        - id: ch01-b21
          speaker: rat
          text: 鼹鼠和獾正坐在吸烟室的炉边讲故事，根本没有防备。那种天气，本来不该有动物出门。谁知那些恶棍撞破门，从四面八方冲进来。他们俩拼命抵抗，可手里没有武器，又被打得措手不及。两只动物怎么敌得过几百个？那些家伙用棍子狠打这两个忠心的朋友，又把他们赶进寒风冷雨里，还骂了许多毫无道理的难听话！
        - id: ch01-b22
          speaker: narrator
          text: 没心没肺的蟾蜍竟噗嗤一笑，随即赶紧收住，努力摆出庄重的神情。
        - id: ch01-b23
          speaker: rat
          text: 从那以后，野林里的家伙就一直住在蛤蟆庄园，想怎么胡来就怎么胡来。他们每天躺在床上，等大半天都过去了才肯起来，早餐也没有固定时候，想几点吃就几点吃。听说屋里已经乱得不成样子，简直不能让人看。他们吃光你的食物，喝掉你的酒，拿你的遭遇编成低劣的笑话，还唱关于监狱、法官和警察的粗俗歌曲。那些歌句句冲着你来，专门糟践你，又恶毒又没有半点幽默。他们还告诉商家和所有遇见的人，自己已经在这里安了家，打算永远住下去。
        - id: ch01-b24
          speaker: toad
          text: 哦，是吗！我马上就去看看他们有多大本事！
          emotion: angry
        - id: ch01-b25
          speaker: rat
          text: 没用的，蟾蜍！回来坐下，你只会再惹麻烦！
    - id: ch02
      title: 两次冒进
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 蟾蜍已经冲出门去，谁也拦不住。他扛着手杖，怒气冲冲地沿路疾走。快到自家大门时，栅栏后突然跳出一只细长的黄色雪貂，手里端着枪。
        - id: ch02-b02
          speaker: ferret
          text: 什么人？
        - id: ch02-b03
          speaker: toad
          text: 胡说八道！你竟敢这样同我讲话？立刻给我出来，不然有你好看！
          emotion: angry
        - id: ch02-b04
          speaker: narrator
          text: 雪貂不回答，只把枪托抵上肩头。蟾蜍很识时务，立刻趴倒。砰的一声，子弹嗖地飞过头顶。他吓得跳起来，沿路拼命逃走。身后先响起雪貂的笑，接着又有几声尖细可恶的笑加入，一路追着他传开。
        - id: ch02-b05
          speaker: narrator
          text: 蟾蜍垂头丧气地回到河鼠家，把事情讲了一遍。
        - id: ch02-b06
          speaker: rat
          text: 我刚才怎么告诉你的？这样不行。他们布了岗哨，而且人人有武器。你只能等。
        - id: ch02-b07
          speaker: narrator
          text: 蟾蜍还是不肯马上认输。他拖出小船，坐进去划动双桨，沿河向上游出发，直奔蛤蟆庄园临水的花园。等旧宅进入视野，他把桨停在水中，小心观察岸上的每一处动静。眼前似乎平和、空旷又安静。庄园的整个正面沐浴在落日里，鸽子两三只一群，沿着笔直的屋脊落下。花园开得繁花似锦。一道小湾通往船屋，一座小木桥横在水上。四周宁静无人，仿佛整座宅子都在等待主人归来。蟾蜍决定先试试船屋，于是格外谨慎地划向小湾入口。船身轻轻前进，刚要从桥下过去，上面忽然轰隆一响。
        - id: ch02-b08
          speaker: narrator
          text: 一块巨石从桥上直落下来，当场砸穿了船底。河水一下子涌进船舱，小船迅速灌满水，转眼便沉了下去。蟾蜍跌进深水，只能挥动四肢拼命挣扎。他好不容易浮到水面，抬头一看，两只白鼬正趴在桥栏上，满脸喜色地俯视着他，显然对这一击得意极了。
        - id: ch02-b09
          speakers: [stoat_1, stoat_2]
          ensemble: duo
          text: 下回砸的就是你的脑袋，蟾蜍！
        - id: ch02-b10
          speaker: narrator
          text: 蟾蜍满腔愤怒地游向岸边。桥上的两只白鼬却笑个不停。他们先是各自弯下腰，后来干脆互相扶着，免得笑倒在地。笑了一阵，他们停下来喘口气，随即看见水里的蟾蜍，又从头大笑起来。到最后，他们几乎一人笑得发了一回病。当然，总共是两回，一人一回。
        - id: ch02-b11
          speaker: narrator
          text: 蟾蜍从水里爬上岸，只能拖着疲惫的脚步，沿来路徒步走回去。小船没有了，河鼠借给他的好衣服也湿透又破损。他终于回到朋友家，再把这段处处失败、叫人失望的经历从头讲了一遍。
        - id: ch02-b12
          speaker: rat
          text: 我到底是怎么告诉你的？现在看看你干的好事！我那么心爱的船，叫你弄没了。我借你的好衣服，也让你彻底毁了。蟾蜍，世上再没有比你更叫人头疼的动物。你居然还能留得住朋友，真叫我想不明白！
          emotion: angry
        - id: ch02-b13
          speaker: narrator
          text: 蟾蜍马上看出自己的做法既错误又愚蠢。他承认自己犯了错，也承认自己刚愎自用，根本听不进正确的劝告。他为弄丢河鼠心爱的小船郑重道歉，也为彻底毁坏那套借来的好衣服赔了不是。最后，他又使出那种毫不遮掩、坦率认输的态度。这一招总能让朋友们放下责备，不知不觉重新站回他那一边。
        - id: ch02-b14
          speaker: toad
          text: 河鼠，我明白自己一直任性又固执！从今以后，我一定谦虚顺从。没有你亲切的指点和完全的赞同，我绝不会再采取任何行动！
        - id: ch02-b15
          speaker: rat
          text: 你若真能做到，我就劝你看看现在的时辰，坐下来耐心等晚饭。饭马上就来。在见到鼹鼠和獾，听完他们的最新消息，再一起商量这件难事以前，我们什么也做不了。
        - id: ch02-b16
          speaker: toad
          text: 哦，对，当然，鼹鼠和獾。那两个亲爱的家伙怎么样了？我把他们忘得一干二净。
        - id: ch02-b17
          speaker: rat
          text: 你还好意思问！你坐昂贵的汽车兜风，骑名种马奔驰，又吃着世上最肥美的早餐时，那两个忠心的动物一直露宿野外，什么天气都熬过来了。他们白天受苦，夜里睡硬地，替你看守宅子，巡查地界，不断监视敌人，还千方百计替你筹划怎么夺回产业。你根本配不上这样的朋友。总有一天，一切已经太迟，你会后悔当初没有好好珍惜他们！
        - id: ch02-b18
          speaker: toad
          text: 我知道自己是个忘恩负义的畜生。让我走进寒冷漆黑的夜里找他们吧。我要和他们一起吃苦，再努力用——等等！我听见托盘里的碗碟响了。晚餐终于来了，万岁！快来，河鼠！
        - id: ch02-b19
          speaker: narrator
          text: 河鼠想起可怜的蟾蜍吃了很长一段时间的牢饭，觉得无论怎样，都应该多多体谅。他便陪蟾蜍来到桌边，以主人的热情殷勤招待，还不断鼓励朋友勇敢努力，尽量多吃一点，把过去受苦时亏欠的那些美食统统补回来。
    - id: ch03
      title: 獾带来的秘密
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 两人刚吃完饭，重新坐进各自的扶手椅，门上便响起一阵沉重的敲击声。蟾蜍听得有些紧张，河鼠却像早已知道来者是谁，神秘地朝他点点头，径直过去开门。獾先生走了进来。他那副模样，一看就知道好几夜没有回家，也没享用过家中那些细小却舒服方便的东西。鞋上全是泥，毛和衣服都粗糙凌乱。不过话说回来，即使在最好的时候，獾也从来不是个衣着漂亮的家伙。他庄严地走向蟾蜍，伸出爪子同他相握。
        - id: ch03-b02
          speaker: badger
          text: 欢迎回家，蟾蜍！唉，我在说什么？哪里还有家！你这次回来，实在凄凉。可怜的蟾蜍！
          emotion: sad
        - id: ch03-b03
          speaker: narrator
          text: 獾背过身，在桌边坐下，拉近椅子，给自己切了一大块冷馅饼。这种严肃又不祥的问候，把蟾蜍吓得不轻。
        - id: ch03-b04
          speaker: rat
          text: 别担心，暂时别理他，也别同他说话。他饿肚子时总格外消沉。再过半个钟头，他就会变成另一只动物。
        - id: ch03-b05
          speaker: narrator
          text: 于是，大家默默等着獾吃饭，谁也没有打扰他。不久，门上又响起一下较轻的敲击声。河鼠先朝蟾蜍点点头，这才走过去开门，把鼹鼠迎进屋。鼹鼠显然也在外面吃了不少苦。他衣衫破旧，浑身没有洗过，毛发里还到处粘着干草和稻草。
        - id: ch03-b06
          speaker: mole
          text: 万岁！老蟾蜍回来了！真没想到又能见到你。我们做梦也没想到你会这么快出现。你一定设法逃出来了。你这只聪明、机灵、才智过人的蟾蜍！
          emotion: happy
        - id: ch03-b07
          speaker: narrator
          text: 鼹鼠高兴得围着蟾蜍跳舞。河鼠吓了一跳，赶紧扯他的胳膊，可惜太晚了。蟾蜍已经膨胀起来。
        - id: ch03-b08
          speaker: toad
          text: 聪明？才不是！照朋友们的说法，我一点也不聪明。我不过从全英格兰守卫最森严的监狱逃了出来。我不过夺下一列火车，坐着它逃走。我还乔装改扮，走遍乡间，把所有人耍得晕头转向。除此以外什么也没做！我就是个蠢驴！鼹鼠，我讲一两段小历险，你自己判断吧。
        - id: ch03-b09
          speaker: mole
          text: 好，好。你说，我吃。从早饭以后，我连一口也没吃，真要命！
        - id: ch03-b10
          speaker: narrator
          text: 鼹鼠坐到桌边，大吃冷牛肉和腌菜。蟾蜍叉开两腿站在炉前地毯上，从裤兜里掏出一把银币，得意地展示给他看。
        - id: ch03-b11
          speaker: toad
          text: 看看这个！只花几分钟就挣来这些，不坏吧？你猜我怎么办到的？买马卖马，就是这么办到的！
        - id: ch03-b12
          speaker: mole
          text: 继续说，蟾蜍！
        - id: ch03-b13
          speaker: rat
          text: 蟾蜍，请安静一会儿。鼹鼠，你明知他是什么德行，也别撺掇了。现在快告诉我们，究竟是什么局面。既然蟾蜍回来了，我们最好怎么办？
        - id: ch03-b14
          speaker: mole
          text: 局面坏得不能更坏。至于怎么办，我根本不知道！我和獾日夜绕着庄园转了不知多少遍，次次都一样。到处有岗哨，有枪口对着我们，还有石头扔过来。永远有人放哨。他们一看见我们，就笑得要命。最气人的就是这个！
        - id: ch03-b15
          speaker: rat
          text: 这局面确实棘手。不过我已经想明白了，蟾蜍真正应该照我的办法去做。
        - id: ch03-b16
          speaker: mole
          text: 不，他不应该照你的办法做！根本不是那回事。你不明白，他应该听我的！
        - id: ch03-b17
          speaker: toad
          text: 反正你们说的，我一件也不做！别想对我发号施令。我们说的是我的宅子，我很清楚怎么办。你们全该听我的！
        - id: ch03-b18
          speaker: narrator
          text: 三个家伙全扯开嗓门，同时说了起来，吵得人什么也听不见。忽然，一个尖细干涩的声音穿过喧闹。
        - id: ch03-b19
          speaker: badger
          text: 你们几个，立刻安静！
          emotion: angry
        - id: ch03-b20
          speaker: narrator
          text: 大家顿时鸦雀无声。说话的正是獾。他已经吃完馅饼，转过身坐在椅子里，严厉地看着三个吵闹的家伙。见大家都注意到自己，显然也在等他开口，他却又转回桌边，伸手去拿奶酪。这只可敬的动物沉稳踏实，身上的长处足以让所有朋友心服口服。因此，直到他彻底吃完这顿饭，又慢慢掸掉膝上的碎屑，谁也没敢再说一个字。蟾蜍焦躁地扭来扭去，河鼠却一直牢牢把他按住。獾终于从椅子上起身，站到壁炉前，沉思了很久才准备说话。
        - id: ch03-b21
          speaker: badger
          text: 蟾蜍！你这只又坏又会惹麻烦的小动物。你不为自己害臊吗？你父亲是我的老朋友。假如今晚他在这里，也知道你干过的所有荒唐事，你说他会怎么看你？
        - id: ch03-b22
          speaker: narrator
          text: 蟾蜍这时已经躺上沙发，两条腿高高翘起。听獾提到自己的父亲，又问起父亲会怎样看待这一切，他再也摆不出满不在乎的模样。蟾蜍翻身把脸深深埋进沙发，悔恨的抽泣震得全身发颤。
        - id: ch03-b23
          speaker: badger
          text: 好啦，别哭。过去的事就让它过去，我们会重新开始。不过鼹鼠说得对。白鼬守着每一处要地，又是世上最出色的岗哨。强攻庄园根本没用，他们的力量比我们强得多。
        - id: ch03-b24
          speaker: toad
          text: 那一切都完了。我要去参军，从此再也见不到亲爱的蛤蟆庄园！
          emotion: sad
        - id: ch03-b25
          speaker: badger
          text: 振作点，蟾蜍老弟。夺回一个地方，不只有强攻这一条路。我的话还没说完。现在，我要告诉你一个天大的秘密。
        - id: ch03-b26
          speaker: narrator
          text: 蟾蜍慢慢坐起来，擦干眼泪。秘密对他有无法抵挡的吸引力，因为他从来守不住秘密。每次郑重答应绝不泄露，又转身告诉另一只动物，那种不大正当的兴奋总叫他十分享受。
        - id: ch03-b27
          speaker: badger
          text: 有一条地下通道，从离这里不远的河岸，一直通到蛤蟆庄园正中央。
        - id: ch03-b28
          speaker: toad
          text: 得了吧，獾！你准是信了附近酒馆里的胡编乱造。庄园里里外外，每一寸我都熟悉。我向你保证，根本没有这条通道！
        - id: ch03-b29
          speaker: badger
          text: 年轻的朋友，你父亲是个值得尊敬的动物，比我认识的某些动物可尊敬得多。他同我交情很深，告诉过我许多他做梦也不会告诉你的事。那条通道正是他发现的，当然不是他亲手挖的。早在他搬进蛤蟆庄园几百年前，它就已经存在。他发现以后，把坏掉的地方修好，又把整条通道清理干净，觉得将来遇到麻烦或危险时，也许能派上用场。他还亲自带我进去看过。他嘱咐我不要让你知道，说你虽然心地不错，性情却太轻浮，做事没有长性，又根本管不住自己的嘴。只有等你真的遇上难关，而且这条秘密通道确实能帮到你时，我才可以把它告诉你。在那以前，一个字也不能提。
        - id: ch03-b30
          speaker: narrator
          text: 其他动物全都盯着蟾蜍，想看看他听到父亲这番评价以后会有什么反应。蟾蜍起初确实有些闷闷不乐，脸上也露出了不高兴的神气。可他到底是个心地不错的家伙，从来不会长久生朋友的气。转眼之间，他又振作起来，脸上重新有了光彩。
        - id: ch03-b31
          speaker: toad
          text: 好吧，也许我是有点爱讲话。像我这样受欢迎的家伙，朋友总围着我。我们打趣，妙语连珠，还讲机智的故事，不知不觉，我的舌头就动个没完。我天生有谈话的才能。还有人说我该办个“沙龙”，尽管我不知道那是什么。算了，继续说。通道怎么帮我们？
        - id: ch03-b32
          speaker: badger
          text: 最近我还打听到了一些重要消息。我让水獭乔装成扫烟囱的人，把一大捆刷子扛在肩上，到庄园后门去问有没有活儿可做。明天夜里，那里会举行一场盛大的宴会。好像是某个人的生日，我想就是黄鼠狼头领。到时候，所有黄鼠狼都会聚在餐厅里，大吃大喝，放声欢笑，尽情胡闹。他们只顾庆祝，绝不会想到有人来袭。更要紧的是，他们不会带枪，不会带剑，也不会带棍棒，身边什么武器都没有。
        - id: ch03-b33
          speaker: rat
          text: 可岗哨还会照常布置。
        - id: ch03-b34
          speaker: badger
          text: 正是，这就是关键。黄鼠狼会把安全全交给岗哨。那条地道正好通到男管家的餐具室下面，而餐具室就在餐厅隔壁。
        - id: ch03-b35
          speaker: toad
          text: 啊哈！原来餐具室里那块嘎吱响的地板是这么回事！我明白了！
        - id: ch03-b36
          speaker: mole
          text: 我们可以从地道悄悄钻进餐具室！
        - id: ch03-b37
          speaker: rat
          text: 我们还要带上手枪、宝剑和棍棒！
        - id: ch03-b38
          speaker: badger
          text: 然后猛冲进去。
        - id: ch03-b39
          speaker: toad
          text: 狠狠揍他们，狠狠揍，狠狠揍！
          emotion: happy
        - id: ch03-b40
          speaker: narrator
          text: 蟾蜍欣喜若狂，绕屋奔跑，还不停跳过椅子。
        - id: ch03-b41
          speaker: badger
          text: 很好，计划已经定下。你们不用再争吵。天很晚了，全都立刻上床。明天上午，我们把必要的事情安排好。
        - id: ch03-b42
          speaker: narrator
          text: 蟾蜍自然乖乖同大家去睡觉。他知道自己最好别拒绝，虽然心里兴奋得根本睡不着。这一天实在太长，太多事情全都挤在了一起。何况他在漏风的牢房里睡惯了石板地，身下只有一点薄得可怜的稻草，如今床单和毯子显得格外亲切，也格外舒服。他的头碰到枕头没几秒，便快活地打起鼾来。他当然做了许多梦。他梦见道路偏在自己需要时掉头逃走，运河却从后面追来，还把他牢牢捉住。他举办宴会时，一艘驳船载着整星期的待洗衣物，径直驶进了宴会厅。他又梦见自己独自在秘密通道里向前，可通道不停扭动，忽左忽右，还抖抖身子，竖起一头坐了下来。不过梦到最后，他还是平安又胜利地回到蛤蟆庄园。所有朋友都聚在身边，郑重保证，他的确是一只聪明的蟾蜍。
    - id: ch04
      title: 战前的白天
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 第二天早晨，蟾蜍一直睡到很晚。等他终于下楼，其他动物早已吃完早餐。鼹鼠独自溜去了什么地方，没有告诉任何人自己的去向。獾坐在扶手椅里看报，仿佛当天晚上根本没有一场大事等着他们。河鼠却完全相反。他忙个不停，抱着各式各样的武器绕屋奔跑，再把它们分成四小堆，整整齐齐放在地板上。他每跑一趟，就兴奋地低声念叨一遍各件武器的主人。
        - id: ch04-b02
          speaker: rat
          text: 这是河鼠的剑，这是鼹鼠的剑，这是蟾蜍的剑，这是獾的剑！这是河鼠的手枪，这是鼹鼠的手枪，这是蟾蜍的手枪，这是獾的手枪！
        - id: ch04-b03
          speaker: narrator
          text: 他有规律地反复念着，四堆武器越长越高。獾从报纸上方望着他。
        - id: ch04-b04
          speaker: badger
          text: 这样当然也好，我不怪你。不过只要避开白鼬和他们讨厌的枪，我保证，宝剑和手枪一样也用不上。我们四个带着棍子进了餐厅，不出五分钟就能把那帮家伙清出去。其实我独自也办得到，只是不想剥夺你们的乐趣！
        - id: ch04-b05
          speaker: rat
          text: 还是稳妥些好。
        - id: ch04-b06
          speaker: narrator
          text: 河鼠用袖子擦亮枪管，再举起来顺着它瞄了瞄。蟾蜍吃完早餐，也拿起一根粗棍使劲挥舞，痛打想象中的敌人。
        - id: ch04-b07
          speaker: toad
          text: 我非叫他们知道偷我宅子的下场！叫他们知道，叫他们知道！
        - id: ch04-b08
          speaker: rat
          text: 别这么说，蟾蜍。这话不合语法。
        - id: ch04-b09
          speaker: badger
          text: 你为什么总挑他的毛病？他说的话有什么问题？我自己也这么讲。既然我讲得，他就讲得，你也该听得！
        - id: ch04-b10
          speaker: rat
          text: 实在对不起。我只是觉得，应该说“教训他们”，不能说“叫他们知道”。
        - id: ch04-b11
          speaker: badger
          text: 可我们不想教他们。我们就是要叫他们知道，叫他们知道！而且真会让他们知道！
        - id: ch04-b12
          speaker: rat
          text: 好吧，随你怎么说。
        - id: ch04-b13
          speaker: narrator
          text: 河鼠只好随他们去，可他自己也越想越糊涂。他退到墙角，一个人反复嘀咕“叫他们知道，教训他们，教训他们，叫他们知道”。两种说法在他嘴里来回颠倒，怎么也分不清了，直到獾很不客气地叫他住嘴。不久，鼹鼠跌跌撞撞冲进屋里。他满脸得意，一看就对自己刚刚做成的事十分满意。
        - id: ch04-b14
          speaker: mole
          text: 我刚才玩得太痛快了！我把那群白鼬逗得全慌了神！
          emotion: happy
        - id: ch04-b15
          speaker: rat
          text: 但愿你一直很小心？
        - id: ch04-b16
          speaker: mole
          text: 当然！我去厨房看蟾蜍的早餐有没有保温，发现他昨天穿回来的洗衣妇衣裙挂在炉边。于是我穿上衣裙，又戴帽子、披围巾，大模大样去了庄园。岗哨端着枪，喊着“什么人”，摆足那套无聊架势。我恭敬地说：“先生们早安，今天有衣服要洗吗？”他们神气又傲慢地叫我走开，说值勤时不洗衣服。我问：“那么不值勤时也不洗？”哈，哈！蟾蜍，我是不是很有趣？
        - id: ch04-b17
          speaker: toad
          text: 可怜的轻浮家伙！
        - id: ch04-b18
          speaker: narrator
          text: 其实蟾蜍嫉妒得要命。鼹鼠做的正是他最想做的事，只怪他没先想到，还睡过了头。
        - id: ch04-b19
          speaker: mole
          text: 有几只白鼬的脸都红了。领头的军士叫我快走，别让他的手下在岗上闲聊。我说：“用不了多久，要逃跑的可不是我！”
        - id: ch04-b20
          speaker: rat
          text: 哦，鼹鼠，你怎么能这样！
          emotion: fearful
        - id: ch04-b21
          speaker: narrator
          text: 獾放下报纸。鼹鼠继续讲了起来。
        - id: ch04-b22
          speaker: mole
          text: 他们全竖起耳朵，互相看来看去。军士叫大家别理我，说我不知道自己在讲什么。我就告诉他们，我女儿替獾先生洗衣服，当然知道消息。今天夜里，一百只嗜血的獾会带步枪，从牧场进攻庄园。六船河鼠会拿着手枪和弯刀，从河上来花园登陆。还有一支精挑细选的蟾蜍部队，叫死战到底队，也叫不胜则死队，会猛攻果园，扫平一切，一路高喊报仇。等他们动完手，白鼬们就算想洗，也剩不下多少东西了。我劝他们趁早逃走，说完便跑。
        - id: ch04-b23
          speaker: mole
          text: 离开他们的视线以后，我躲了起来。过了一会儿，我沿水沟爬回去，从树篱缝里偷看。他们紧张又慌乱，四处奔跑，互相绊倒。每个都向别人下命令，却谁也不肯听。军士不断派一队队白鼬去庄园远处，又马上派人把他们叫回来。我还听见他们抱怨，说黄鼠狼舒舒服服留在宴会厅，吃喝庆祝，举杯唱歌，他们却得守在寒冷漆黑的外面，最后还要让嗜血的獾剁成碎片！
        - id: ch04-b24
          speaker: toad
          text: 哦，你这只蠢驴！你把一切全毁了！
          emotion: angry
        - id: ch04-b25
          speaker: badger
          text: 鼹鼠，依我看，你一根小指头里的见识，已经胜过某些动物整副肥胖身体里的全部见识。你办得很漂亮。我开始对你寄予很大的希望了。好鼹鼠！聪明的鼹鼠！
        - id: ch04-b26
          speaker: narrator
          text: 蟾蜍嫉妒得几乎发狂。尤其叫他难受的是，他无论怎么想，也看不出鼹鼠刚才究竟做了什么，竟值得獾这样夸奖。幸好，还没等他发起脾气，或者露出破绽，给獾抓住机会狠狠嘲讽，午餐铃就响了。这顿饭很简单，只有熏肉、蚕豆和通心粉布丁，却十分顶饱。大家把盘里的食物吃得干干净净。吃完以后，獾在扶手椅里舒舒服服地安顿下来。
        - id: ch04-b27
          speaker: badger
          text: 今晚有不少工作，全部办完大概已经很迟。趁现在有空，我要打个小盹。
        - id: ch04-b28
          speaker: narrator
          text: 獾说完便把一块手帕盖在脸上，安安稳稳靠进椅背，没过多久就响亮地打起鼾来。又操心又勤劳的河鼠却一分钟也不肯休息。他立刻继续先前的准备工作，在地板上的四堆装备之间来回奔跑。
        - id: ch04-b29
          speaker: rat
          text: 这是河鼠的腰带，这是鼹鼠的腰带，这是蟾蜍的腰带，这是獾的腰带！
        - id: ch04-b30
          speaker: narrator
          text: 每拿出一件新装备，河鼠都照样念一遍，而那些东西仿佛永远没有尽头。鼹鼠便挽住蟾蜍的胳膊，把他领到屋外，按进一张藤椅，请他从头到尾讲完所有历险。蟾蜍当然求之不得，马上兴致勃勃地讲了起来。鼹鼠是个很好的听众，又没有谁在旁边约束蟾蜍的说法，或带着不友好的态度批评他，蟾蜍便越说越放纵，也越来越不受事实拘束。他讲的许多事情，其实更该归进“要是当时就想到，而不是十分钟以后才想到，本来可能发生的事”这一类。这类历险永远最精彩，也最有滋味。同真正发生的那些不大尽如人意的事情相比，它们凭什么不能同样算作我们自己的经历呢？
