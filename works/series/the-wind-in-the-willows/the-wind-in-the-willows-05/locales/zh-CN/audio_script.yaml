audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 温暖从容，带着含蓄的幽默
        timbre: 清澈醇厚
        pace: 舒缓而富于变化
        pitch: 中低
    mole:
      display_name: 鼹鼠
      tts:
        delivery: 诚恳好奇，兴奋时有些冒失
        timbre: 柔和明亮
        pace: 中等偏快
        pitch: 中高
    rat:
      display_name: 河鼠
      tts:
        delivery: 热情老练，随和中带着笃定
        timbre: 温暖清亮
        pace: 从容
        pitch: 中
    field_mouse_leader:
      display_name: 田鼠领队
      tts:
        delivery: 恭敬认真，唱歌时清脆热诚
        timbre: 细亮稚嫩
        pace: 中等
        pitch: 高
    field_mouse_tommy:
      display_name: 汤米
      tts:
        delivery: 害羞乖巧，唱歌时清亮专注
        timbre: 轻细明快
        pace: 中等偏快
        pitch: 高
    field_mouse_bill:
      display_name: 小比尔
      tts:
        delivery: 活泼稚气，唱歌时兴奋投入
        timbre: 清脆幼嫩
        pace: 明快
        pitch: 高
    field_mouse_actor:
      display_name: 小演员
      tts:
        delivery: 腼腆拘谨，受到鼓励时仍有些慌张
        timbre: 柔细稚嫩
        pace: 稍慢
        pitch: 中高
  chapters:
    - id: ch01
      title: 冬夜村庄
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 羊群挤在栅栏边，细鼻孔呼着气，纤巧的前蹄不停跺地，脑袋都向后仰着。拥挤的羊圈上方飘起一层白雾，融进冰冷的空气。鼹鼠和河鼠却兴高采烈，一路说笑着从旁走过。他们同水獭在外玩了一整天，曾到辽阔的高地打猎探险。自家那条河的几股支流，最初就是从那里冒出来的。现在冬日的暮色已经合拢，可回家还要走上一大程。
        - id: ch01-b02
          speaker: narrator
          text: 两位原本在犁过的田地上随意跋涉，听见羊叫才找了过来。羊圈旁恰好有一条踩实的小径，走起来轻松多了。每个动物心里都有一点爱探问的念头，这条路仿佛正对它说，对了，一点也不错，沿着这里就能回家。于是他们放心地跟着它。小径渐渐变成乡间小道，乡间小道又把他们带上一条铺得平整的公路。
        - id: ch01-b03
          speaker: mole
          text: 看样子，咱们要走进一座村子了。
        - id: ch01-b04
          speaker: narrator
          text: 鼹鼠有些迟疑，脚步也慢下来。动物们不大喜欢村庄。他们自己的大道虽然一样繁忙，却只管走自己的路，从不迁就教堂、邮局和小酒馆。
        - id: ch01-b05
          speaker: rat
          text: 没事！这个时节，村里人早就回屋围着火坐好了。男人、女人、孩子，还有狗和猫，一个也不会在外面。咱们悄悄走过去，不会碰上麻烦。你要想看，还可以从窗外瞧瞧他们在干什么。
        - id: ch01-b06
          speaker: narrator
          text: 十二月中旬的天黑得飞快。他们踩着初落的一层松软薄雪，悄无声息地走进村里，黑夜已经把四周围住。街道两边看不见别的，只有一方方暗橙红色的光。每间小屋的炉火或灯火透过窗格，流进外面的黑暗世界。低矮的格子窗多半没有窗帘。屋里的人围着茶桌，有的专心做手工，有的边说边笑，还不时打着手势。他们不知道窗外有人看着，所以神态格外自然幸福。再高明的演员，也演不出这种毫无觉察的自在。
        - id: ch01-b07
          speaker: narrator
          text: 两位离家很远的观众，从一扇窗走到下一扇窗，仿佛正从一座小戏台走向另一座，眼里渐渐有了向往。他们看见猫儿安静地让人抚摸，看见困倦的孩子给抱起来，裹好以后送去睡觉，也看见疲惫的男人伸过懒腰，把烟斗磕在一截还带火星的木头上。每一幅景象，都让他们想起自己还在远方的家。
        - id: ch01-b08
          speaker: narrator
          text: 最让他们感到家的，却是一扇垂着白帘的小窗。夜色里，那帘子只是一片空白的亮光，却把墙内的小世界遮得严严实实。外面广阔又辛苦的大自然，已经被关在门外，忘得干干净净。一只鸟笼紧贴窗帘悬在那里，每一根笼丝、每一根栖木，还有昨天剩下的那块边缘发暗的糖，全都映得清清楚楚。笼里的小鸟停在中间的栖木上，把头埋进蓬松的羽毛，看起来近得伸手就能碰到。连他鼓起的细细羽尖，也分明映在帘子上。
        - id: ch01-b09
          speaker: narrator
          text: 两位正看着，小鸟忽然不安地动了动。他醒过来，抖抖身子，抬起头，张开小嘴打了一个无聊的呵欠。四下看看以后，他又把脑袋藏回背上的羽毛。先前弄乱的绒羽一点点伏下，终于完全不动了。就在这时，一阵刺骨的冷风直扑鼹鼠和河鼠的后颈，几点冻雨像针尖一样扎上皮肤，把他们从梦里叫醒。他们这才觉得脚趾已经冰冷，双腿也疲乏，而自己的家还在遥远难走的前方。
        - id: ch01-b10
          speaker: narrator
          text: 村庄一过，小屋突然到了尽头。黑暗里，公路两旁又传来田野亲切的气息。他们打起精神，走上最后那段漫长的归途。这是回家的最后一程。你知道它再长也一定会结束，总会走到门闩咔嗒响起的那一刻。炉火突然照亮眼前，熟悉的一切都会迎接你，像迎接一个远渡重洋、久别归来的旅人。
        - id: ch01-b11
          speaker: narrator
          text: 两位不再说话，只顾稳稳往前走，各自想着自己的心事。鼹鼠一路想得最多的是晚饭。四周已经黑得看不清，脚下又是完全陌生的地方，他便放心跟着河鼠，把认路的事全交给朋友。河鼠照例走在前面一小段，弓着肩膀，眼睛只看着笔直伸向前方的灰色公路。于是，那声召唤突然传来，像一道电流击中鼹鼠时，他丝毫没有发现。
    - id: ch02
      title: 旧家的召唤
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 我们早已失去许多细微的身体知觉，连合适的词也找不到，不知道该怎样说动物和周围的一切互通消息。不论对方有生命还是没有生命，动物都能收到它的讯息。我们只说那是气味，可动物鼻子里日夜掠过的细小震颤，远不止气味。它们会召唤，会警告，会催促，也会拒绝。此刻，虚空里的一道神秘呼唤从黑暗中飘来。鼹鼠觉得熟悉极了，浑身都颤动起来，一时却想不起它是什么。
        - id: ch02-b02
          speaker: narrator
          text: 他猛然停住，用鼻子到处探寻，想重新捉住那根细细的游丝，重新接上那股强烈触动他的电流。片刻以后，他又找到了，记忆也跟着漫天涌来。是家！空气里的每一下轻抚，每一只看不见的小手，全在把他拉向同一个方向。那座旧家一定就在附近，就在此时此地。初次发现河流的那天，他匆匆离开了它，此后再没回去。如今，家派出斥候和信使来捉住他，要把他带回去。
        - id: ch02-b03
          speaker: narrator
          text: 那个明亮的早晨离开以后，新生活里有太多欢乐、惊奇和新鲜经历，鼹鼠几乎把旧家忘了。可这一刻，旧日记忆猛然涌回，那里又清楚地立在黑暗中。房子确实寒酸，地方也小，陈设更是简陋，却是他亲手安下的家。每天做完事情，他都曾欢欢喜喜地回去。如今，那个家也在想他。它借着他的鼻子伤心地责备，却不怨恨，也不生气，只一遍遍告诉他，它还在那里，还盼他回来。
        - id: ch02-b04
          speaker: narrator
          text: 召唤已经再明白不过。鼹鼠觉得自己必须马上回去。
        - id: ch02-b05
          speaker: mole
          text: 河鼠！等等，回来！我有事找你，快回来！
          emotion: happy
        - id: ch02-b06
          speaker: rat
          text: 快跟上吧，鼹鼠！
        - id: ch02-b07
          speaker: mole
          text: 求你停一停！你还不明白，是我的家，是我从前的家！我刚闻到它了，就在附近，真的很近。我非去不可，我一定得去！河鼠，求求你回来！
          emotion: sad
        - id: ch02-b08
          speaker: narrator
          text: 这时河鼠已经走出很远，远得听不清鼹鼠到底在喊什么，更没听见那声音里又尖又痛的哀求。河鼠自己也从空气中闻到了什么。那股气息十分可疑，分明像是大雪又要来了。他的心思全放在天气上，也就没有回头细看朋友。
        - id: ch02-b09
          speaker: rat
          text: 咱们真不能停。不管你发现了什么，明天再来找。天已经晚了，雪又要下，我连路也拿不准。还得靠你的鼻子呢。快走吧，老弟！
        - id: ch02-b10
          speaker: narrator
          text: 河鼠没有等他回答，只管继续赶路。鼹鼠独自站在公路上，心仿佛撕成了两半。胸口深处积着一声大哭，还在不断涨大。他知道，它随时都会冲到嘴边。可他再难过，对朋友的忠诚也没有动摇。他甚至一刻也没想过把河鼠独自丢下。旧家的气息还在央求，在耳边低语，像施咒一样催促，最后又像命令一样要把他拉回去。他不敢继续留在这圈魔法里，只好硬生生扯断心弦，转身追随河鼠。那些淡淡的气息一路追着他的鼻子，责备他有了新朋友，便无情地忘记旧家。
        - id: ch02-b11
          speaker: narrator
          text: 鼹鼠费了好大力气才赶上去。毫不知情的河鼠还在快活地谈论回家以后的安排。他说起客厅里熊熊燃烧的木柴，想象那炉火会有多么舒服，又盘算自己要吃上一顿怎样丰盛的晚饭。他完全没有发现同伴一直沉默，心里正受着煎熬。又走出很远，他们到了公路边一片小树林。河鼠看见鼹鼠的脚拖得像铅块，终于在几只树桩旁停下来。
        - id: ch02-b12
          speaker: rat
          text: 老弟，你看起来累坏了，一句话也说不出来。咱们坐下歇一会儿吧。雪还没落，最难走的一段也过去了。
        - id: ch02-b13
          speaker: narrator
          text: 鼹鼠凄凄凉凉地坐上树桩，竭力想控制自己，因为他已经感觉那一刻就要来了。他同那声哭泣斗了许久，可它怎么也不肯认输，一路向上，终于冲出口来。紧接着又是一声，一声连着一声，越来越急。他再也撑不住，只能毫无掩饰、无依无助地放声大哭。他知道事情已经结束了。那个几乎还没重新找到的地方，已经被他失去了。
        - id: ch02-b14
          speaker: narrator
          text: 河鼠又惊又慌，一时不敢说话。过了片刻，他才轻轻拍着鼹鼠的肩膀，温和地开口。
        - id: ch02-b15
          speaker: rat
          text: 老朋友，究竟怎么了？把难处告诉我，让我想想能帮你做些什么。
          emotion: calm
        - id: ch02-b16
          speaker: narrator
          text: 鼹鼠的胸膛一次次剧烈起伏，话刚上来就被噎住。好不容易，他才断断续续地说出心事。
        - id: ch02-b17
          speaker: mole
          text: 我知道那里又小又暗，也很寒酸。它比不上你的住处，比不上漂亮的蟾宫，更比不上獾的大宅。可那是我自己的家，我一直很喜欢它。我离开后，竟然把它全忘了。刚才我在路上闻到了它，一切一下子全回来了。我真的好想回去！我一路都还闻得到它，却只能离开，心都快碎了。我们本来只要去看一眼，只看一眼就好。可你不肯回头，河鼠，你就是不肯回头！
          emotion: sad
        - id: ch02-b18
          speaker: narrator
          text: 回忆又掀起一阵悲伤，鼹鼠重新哭得说不出话。河鼠直望着前面，只是轻轻拍他的肩膀。
        - id: ch02-b19
          speaker: rat
          text: 现在我全明白了！我真是一头猪。没错，说的就是我，一头彻头彻尾的猪！
          emotion: sad
        - id: ch02-b20
          speaker: narrator
          text: 河鼠一直等到哭声平缓下来，只剩下鼹鼠频频抽鼻子，偶尔呜咽一声。他这才站起来，故意装出随便的口气。
        - id: ch02-b21
          speaker: rat
          text: 好啦，老弟，咱们现在真的该上路了。
        - id: ch02-b22
          speaker: narrator
          text: 说完，他沿着刚才辛苦走过的公路往回去了。鼹鼠含着泪，惊慌地抬起头。
        - id: ch02-b23
          speaker: mole
          text: 河鼠，你……嗝……这是要去……嗝……哪里？
          emotion: surprised
        - id: ch02-b24
          speaker: rat
          text: 去找你的家呀，老朋友。快跟上来吧。那地方恐怕不好找，咱们需要你的鼻子。
        - id: ch02-b25
          speaker: mole
          text: 河鼠，求你回来吧！这样不行，天太晚，也太黑了，那地方还远，雪也快来了。我不是故意让你知道我有多难过，那只是意外，是个误会。你还得回河岸吃晚饭呢！
        - id: ch02-b26
          speaker: rat
          text: 河岸和晚饭都见鬼去吧！我今晚非找到你的家不可，哪怕要在外面待上一整夜。打起精神，挽住我的胳膊。咱们很快就能回去。
        - id: ch02-b27
          speaker: narrator
          text: 鼹鼠还在抽鼻子，一路央求，也不愿朋友为自己受苦，却拗不过这位不由分说的同伴，只能让河鼠拖着往回走。河鼠一路说着快活的话，又讲起一件件趣事，想把他的精神哄回来，也想让这段累人的路显得短一些。最后，河鼠估摸他们一定快到鼹鼠先前被气味拦住的地方了，神情忽然认真起来。
        - id: ch02-b28
          speaker: rat
          text: 现在别讲话，办正事。用你的鼻子，把心思全放在上面。
    - id: ch03
      title: 重返鼹鼠居
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 他们默默走了一段。河鼠忽然从两条挽在一起的胳膊上感觉到一丝微弱电流，正沿着鼹鼠的身体传过来。他马上松开朋友，退后一步，屏住气息，全神贯注地等待。信号传来了。鼹鼠僵直地站着，扬起鼻子，让它在空气里轻轻颤动。此刻，所有事情都交给了那只灵敏的鼻子。
        - id: ch03-b02
          speaker: narrator
          text: 他先向前急跑几步，发觉走错了，便停下往回试探。接着，他缓慢、稳定又自信地走起来。河鼠兴奋地跟在脚后。鼹鼠仿佛正在梦游。他跨过干沟，钻过树篱，又循着气息穿过一片没有道路的光秃田野。微弱的星光照着他们。
        - id: ch03-b03
          speaker: narrator
          text: 鼹鼠突然一头钻进地下，连声招呼也没打。河鼠始终警醒着，立刻跟进那条被可靠的鼻子找到的地道。里面狭窄沉闷，几乎不透气，泥土气息也很浓。河鼠觉得走了很久，通道才终于到头。他总算能直起身体，伸伸腰，又抖了抖毛。鼹鼠擦亮火柴，眼前是一处宽敞的地方，脚下扫得很干净，还铺着细沙。正对面便是他的小前门，门边垂着铃绳，上方用哥特体写着“鼹鼠居”。
        - id: ch03-b04
          speaker: narrator
          text: 鼹鼠从墙上的钉子取下提灯，点亮前院。门边一边是花园长椅，另一边是碾地滚筒。他在家时很爱整洁，最受不了别的动物把地面踩成一道道小路，再在路尽头堆起一座座土堆。所以这片地面一直让他碾得平整，连边角也收拾得很妥帖。墙上挂着种有蕨类的铁丝篮，篮子之间隔着一只只托架，上面摆着加里波第、幼年撒母耳、维多利亚女王，还有现代意大利其他英雄的石膏像。
        - id: ch03-b05
          speaker: narrator
          text: 院子一侧还有一条九柱戏球道，长长伸向里头，旁边摆着供客人休息的长凳和小木桌。桌上的一圈圈印子，一看就是从前放过的啤酒杯留下的。院子中央有座小圆池，金鱼在水里游动，池边整整齐齐镶着一圈鸟蛤壳。池子正中立着一件奇巧的装饰，外面也贴满贝壳，顶端是一只很大的镀银玻璃球。球面把映进去的所有东西都照得变了形，看着倒十分有趣，鼹鼠也一向很喜欢它。
        - id: ch03-b06
          speaker: narrator
          text: 见到这些心爱的东西，鼹鼠的脸亮了起来。他急忙把河鼠领进屋，在门厅点灯，又朝旧家看了一眼。所有东西上都落满灰尘。久无人住的房子又冷清又荒凉，房间狭窄，家具破旧。鼹鼠的精神一下又垮了。他瘫坐在椅子上，把鼻子埋进爪子。
        - id: ch03-b07
          speaker: mole
          text: 河鼠，我为什么要带你回来？这样的夜晚，你本来早该坐在河岸的熊熊炉火前，暖着双脚，身边全是自己喜欢的东西。我怎么偏把你带到这个又穷又冷的小地方来了？
          emotion: sad
        - id: ch03-b08
          speaker: narrator
          text: 河鼠根本不理会这些自责。他跑来跑去，打开门，检查房间和橱柜，又把灯和蜡烛点亮，到处安放。
        - id: ch03-b09
          speaker: rat
          text: 这座小屋真不错！地方紧凑，安排得也周到。该有的全有，还都放在该放的位置。今晚咱们就在这里好好过。先得生一炉旺火，这事交给我。那么，这里是客厅？真漂亮！墙上的小卧铺是你自己想出来的？妙极了。我去搬柴和煤。你到厨房桌子的抽屉里找块抹布，把屋子收拾起来。快动手吧，老弟！
        - id: ch03-b10
          speaker: narrator
          text: 河鼠的劲头感染了鼹鼠。他振作起来，用心掸灰擦洗。他把积了许久的灰一点点掸掉，又把旧家具擦出原来的光泽。河鼠抱着一捆捆燃料来回跑，很快让炉火在烟囱里呼呼燃烧。他喊鼹鼠来暖和一下，可鼹鼠一想到客人的晚饭，又一次泄了气。他绝望地倒在长沙发上，把脸埋进抹布。
        - id: ch03-b11
          speaker: mole
          text: 可你的晚饭怎么办？你又冷、又饿、又累，我却什么也拿不出来，连一小块面包屑也没有！
          emotion: sad
        - id: ch03-b12
          speaker: rat
          text: 你怎么动不动就泄气？我刚才明明看见厨房碗柜上有一把罐头起子。既然有起子，附近一定藏着沙丁鱼罐头。打起精神，跟我一起找！
        - id: ch03-b13
          speaker: narrator
          text: 于是两位真的出发搜寻。他们翻遍每一个橱柜，拉开每一只抽屉，绝不放过可能藏着食物的角落。最后的收获其实不算太坏，只是再多一点当然更好。他们找到一听沙丁鱼、一盒几乎没动过的船长饼干，还有一根裹着银纸的德国香肠。河鼠把这些东西一样样拿出来，郑重其事地摆上桌。
        - id: ch03-b14
          speaker: rat
          text: 瞧，这就是一桌宴席！有些动物哪怕舍掉耳朵，也想坐下来跟咱们一起吃呢。
        - id: ch03-b15
          speaker: mole
          text: 可是没有面包，没有黄油，也没有——
        - id: ch03-b16
          speaker: rat
          text: 还没有鹅肝酱和香槟！说到这个，走廊尽头那扇小门是什么？当然是地窖。你家真是什么享受都不缺。等我一会儿。
        - id: ch03-b17
          speaker: narrator
          text: 河鼠钻进地窖，回来时身上沾了灰。两只爪子各握一瓶啤酒，两边胳膊下面还各夹一瓶。
        - id: ch03-b18
          speaker: rat
          text: 你可真会享受，一点也不肯亏待自己。这是我见过最惬意的小屋。墙上那些版画从哪儿来的？挂上它们，这里一下就像个家。怪不得你舍不得。来，把这些东西的来历全讲给我听。
        - id: ch03-b19
          speaker: narrator
          text: 河鼠去拿盘子、刀叉，又在蛋杯里调好芥末。鼹鼠的胸口还在微微起伏。他起初说得害羞，后来越讲越自在。这一处是怎样设计的，那一处是怎么想出来的。有件东西来自姨妈留下的一笔钱，有件是意外找到的便宜货，还有一样，是他一点点积蓄，又忍住许多想买的东西，才终于置办下来。
        - id: ch03-b20
          speaker: narrator
          text: 鼹鼠彻底恢复了精神。他走过去摸摸自己的家当，又提着灯，逐样向河鼠展示，讲起每件东西的妙处，竟把两位急需的晚饭忘了。他说起有些东西时，还要反复解释一番。河鼠已经饿得厉害，却竭力不肯显出来。每当鼹鼠把灯凑近某件宝贝，他就郑重地点头，皱起眉头仔细查看。只要有机会插话，便夸一句了不起，或者实在非同寻常，绝不催促主人去开那听沙丁鱼。
    - id: ch04
      title: 门外的颂歌
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 河鼠总算把鼹鼠哄回桌边，刚拿起罐头起子认真开罐，前院便响起许多小脚拖过沙砾的声音。细小的嗓音乱纷纷传进来。有人叫大家站成一排，有人叫汤米把灯举高一点。领头的又提醒大家先清嗓子，等他数完一二三，可不许再咳嗽。还有谁在问，小比尔到哪儿去了，大家可都在等他。
        - id: ch04-b02
          speaker: rat
          text: 外面怎么回事？
        - id: ch04-b03
          speaker: mole
          text: 一定是田鼠。他们每年这个时候都要挨家唱圣诞颂歌，这是附近的老规矩。他们从来不会漏掉我，还总把鼹鼠居留到最后。从前我会请他们喝点热的，手头宽裕时，也请他们吃晚饭。又能听见他们唱歌，真像回到了过去。
        - id: ch04-b04
          speaker: rat
          text: 那咱们快去看看！
        - id: ch04-b05
          speaker: narrator
          text: 两位推开门，眼前的景象美丽极了，也正合这个季节。昏暗的角灯下面，八九只小田鼠站成半圆。他们脖子上围着红毛线围巾，前爪深深插进衣袋，两只脚不断跳着取暖。一双双珠子般明亮的眼睛害羞地互相偷看。他们轻声窃笑，吸着鼻子，还一次又一次拿外套袖子去擦。这时，年纪稍大的田鼠提着灯，正好开始数数。
        - id: ch04-b06
          speaker: field_mouse_leader
          text: 预备，一、二、三！
        - id: ch04-b07
          speaker: narrator
          text: 尖细的小嗓音一齐升上天空。他们唱的是一首古老颂歌。田鼠的祖先曾在冻硬的休耕田里写下它，也曾在大雪封路时，缩在烟囱的角落里编出其中的句子。后来，这首歌一代代传下来。每到圣诞时节，田鼠们都站在泥泞的街上，对着一扇扇灯火通明的窗子唱起它。
        - id: ch04-b08
          speakers: [field_mouse_leader, field_mouse_tommy, field_mouse_bill, field_mouse_actor]
          ensemble: chorus
          text: 乡亲们哪，严冬已来到，快把你家大门敞开好。任风跟进来，任雪也飘，请留我们在炉边歇歇脚。愿你清晨满是欢笑！我们站在冻雨寒风里，搓着手指，跺着双脚，远道赶来，只为问候你。你守炉火，我们守街道，愿你清晨满是欢笑！
        - id: ch04-b09
          speakers: [field_mouse_leader, field_mouse_tommy, field_mouse_bill, field_mouse_actor]
          ensemble: chorus
          text: 黑夜还没有过去一半，忽然有颗星把我们引导。它把幸福与祝福洒遍，明日有福，往后福更多，愿每个清晨满是欢笑！好人约瑟冒雪赶路，望见星光照着低矮马槽。玛利亚再也走不动一步，茅草屋顶、干草铺，欢迎来到！清晨她心中满是欢笑！
        - id: ch04-b10
          speakers: [field_mouse_leader, field_mouse_tommy, field_mouse_bill, field_mouse_actor]
          ensemble: chorus
          text: 后来他们听见天使宣告，是谁最先把圣诞佳音报？原来是那些动物，恰好全都住在那座马厩一道。愿它们清晨满是欢笑！
        - id: ch04-b11
          speaker: narrator
          text: 歌声停了。小歌者们害羞地微笑，斜眼看看彼此。前院静了下来，却只安静了一刻。高高的远处忽然传来悦耳的嗡鸣，沿着他们刚刚走过的长长地道，一直落到耳边。那是遥远的钟声。钟声一记追着一记，既欢腾又响亮，仿佛也在回应田鼠们送来的圣诞祝福。
        - id: ch04-b12
          speaker: rat
          text: 唱得真好，小伙子们！现在都进来，到火边暖一暖，再喝点热东西！
          emotion: happy
        - id: ch04-b13
          speaker: mole
          text: 对，全都进来！真像从前一样。最后一个记得关门。把高背长椅拉到炉火边。你们等一会儿，让我们……
          emotion: happy
        - id: ch04-b14
          speaker: narrator
          text: 鼹鼠话说到一半，忽然想起空空的食柜，绝望地坐倒，眼泪又快掉下来。
        - id: ch04-b15
          speaker: mole
          text: 河鼠，我们这是在做什么呀？家里什么都没有，拿什么给他们吃？
          emotion: sad
        - id: ch04-b16
          speaker: rat
          text: 全交给我。提灯的那位，请过来一下。告诉我，这么晚还有店铺开门吗？
        - id: ch04-b17
          speaker: field_mouse_leader
          text: 当然有，先生。每年到了这个时候，我们这儿的店铺开到多晚都有。
        - id: ch04-b18
          speaker: rat
          text: 那你马上带着灯出发，替我买几样东西。
        - id: ch04-b19
          speaker: narrator
          text: 接着，河鼠压低声音交代起来。鼹鼠只断续听见几句。买来的东西一定要新鲜，那一种有一磅就够。另一种必须是巴金斯家的，别家的河鼠可不要，而且只要最好的。那家没有，就去别处找。能买自家做的就别拿罐头，实在买不到，再尽力而为。最后，几枚硬币叮当一响，从一只爪子交到另一只爪子。田鼠领队拿上一只足够装东西的大篮子，提着灯匆匆去了。
        - id: ch04-b20
          speaker: narrator
          text: 其余田鼠排排坐在高背长椅上，小腿悬在半空来回晃着。他们一心享受炉火，把冻疮烤得又痒又疼，却觉得舒服极了。鼹鼠想让大家随意聊聊，可小客人们太拘谨，怎么也放不开。他只好一头问进各家的家谱，让每只田鼠把许多兄弟的名字都背一遍。那些小弟弟年纪还小，今年没得到父母准许，不能出来唱歌，可他们全都盼着很快也能加入。
        - id: ch04-b21
          speaker: narrator
          text: 河鼠拿起一瓶啤酒，仔细看了看标签。
        - id: ch04-b22
          speaker: rat
          text: 原来是陈年伯顿啤酒。鼹鼠真有眼光，这东西正合适。咱们可以煮热啤酒了。你去备东西，我来拔瓶塞。
        - id: ch04-b23
          speaker: narrator
          text: 调这壶酒并没有花多少时间。他们把锡罐深深放进炉火最红的地方。没过多久，每只田鼠都捧着热酒小口喝起来。他们一会儿咳嗽，一会儿呛气，因为只要一点热啤酒，便足够小田鼠受用好一阵。大家又擦眼睛，又哈哈大笑，很快就忘了自己这辈子还曾经受过冻。
        - id: ch04-b24
          speaker: mole
          text: 这些小伙子还会演戏。他们自己编，编好了自己演，演得真不错。去年那出戏讲一只田鼠在海上被巴巴里海盗捉走，押去桨帆船上划桨。他逃出来回到家，心爱的姑娘却已经进了修道院。喂，我记得你演过。站起来，给我们念一段吧。
        - id: ch04-b25
          speaker: narrator
          text: 被点到的小演员用两条腿站起来，害羞地笑了笑，又环顾整间屋子，可一个字也挤不出来。同伴们大声给他打气，鼹鼠又哄又劝，河鼠甚至走过去抓住他的肩膀摇了摇，依然治不好他的怯场。大家围着他忙个不停，简直像一群水手照着皇家救生协会的规矩，正在抢救一个沉进水里、泡了很久才捞上来的人。
        - id: ch04-b26
          speaker: narrator
          text: 就在这时，门闩响了。田鼠领队重新出现，沉重的篮子压得他东倒西歪。篮里的东西一倒上桌，再也没人提演戏了。
    - id: ch05
      title: 幸福的归来
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 河鼠立刻安排起来。每个动物都有事做，不是动手准备，就是跑去取东西。没过几分钟，晚饭便好了。鼹鼠像在梦里一样坐到桌首。他望着那张桌子，方才上面还空空荡荡，如今却密密摆满喷香又实在的食物。小朋友们一刻也不等，马上吃起来，一张张脸都亮了。鼹鼠自己也早已饿坏。他终于放开肚子，扑向这桌奇迹般出现的好东西，心想，这一趟回家终究变得多么幸福。
        - id: ch05-b02
          speaker: narrator
          text: 席间，他们说起旧日时光。田鼠们把附近最新的消息一件件讲给鼹鼠听，也尽力回答他接连问出的一百个问题。鼹鼠一边吃，一边听，一边不停追问，仿佛要把离家以后错过的日子全补回来。河鼠却很少开口。他只留心让每位客人都有自己想吃的东西，而且一定吃得足够。他也把每件事情照料妥当，不让鼹鼠担心，不让鼹鼠操劳。
        - id: ch05-b03
          speaker: narrator
          text: 最后，田鼠们热热闹闹地告辞。他们满怀感激，一再道谢，又把许多节日祝福送给两位主人。每只田鼠的外套口袋里还塞满了临别礼物，要带回家分给那些年幼、不能出来唱歌的弟弟妹妹。最后一位客人终于跨出门槛，门扇在他身后轻轻关上。远处的灯笼碰响了几声，声音越来越小，最后完全听不见了。
        - id: ch05-b04
          speaker: narrator
          text: 鼹鼠和河鼠拨旺炉火，把椅子拉近，又给自己煮了睡前最后一杯热啤酒。他们慢慢聊着这漫长一天里发生的事。过了一会儿，河鼠打了一个惊天动地的呵欠。
        - id: ch05-b05
          speaker: rat
          text: 鼹鼠老弟，我真要倒下了。光说一句困，根本不够。那边是你的卧铺吧？好，那我睡这一边。这屋子真棒，什么东西都伸手可取！
        - id: ch05-b06
          speaker: narrator
          text: 河鼠爬进自己的卧铺，把身体舒舒服服地安顿好，再用毯子严严实实裹住自己。他才刚刚躺稳，睡意便立刻把他收拢进去，就像收割机伸出宽大的双臂，把一捆大麦整个抱进怀里。
        - id: ch05-b07
          speaker: narrator
          text: 疲惫的鼹鼠也很高兴立刻上床。他满怀喜悦和满足，把脑袋放上枕头。合眼以前，他让目光在自己的旧房间里慢慢转了一圈。温暖柔和的炉光时而跳动，时而安静地停在那些熟悉亲切的东西上。它们早已在不知不觉间成为他的一部分。如今，它们含着笑迎他回来，没有怨恨，也没有半点埋怨。
        - id: ch05-b08
          speaker: narrator
          text: 体贴的河鼠一路不声不响，却正是他悄悄做的一切，终于把鼹鼠带到了这份心境。鼹鼠看得很明白，这个家朴素、简单，甚至有些狭窄，许多东西也并不漂亮。可他也同样明白，这里对自己有多重要。生命里能有这样一处停靠的地方，能有一个牢靠的锚点，自有一种别处替代不了的价值。
        - id: ch05-b09
          speaker: narrator
          text: 鼹鼠并不想舍弃刚得到的新生活和那片壮阔的天地。他不想转过身去，离开阳光、空气和它们带来的一切，再钻回家里，从此躲着不出去。地上的世界依然有着太强的力量。即使身在地下，他也听得到它的召唤。他喜欢那里，也知道自己一定还会回去，重新登上那个更宽广的舞台。
        - id: ch05-b10
          speaker: narrator
          text: 可一想到自己还有这里可以回来，鼹鼠便觉得无比安心。这地方完完全全属于他，这里的每一样东西也都是他的老朋友。它们高兴同他重逢，往后也永远可以信赖。无论鼹鼠在外面走了多远，又经历了什么，只要重新回到这里，它们都会给他同样简单、朴素而亲切的欢迎。
