  chapters:
    - id: ch01
      title: A Call in the Winter Dark
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: The sheep crowded together against their hurdles as Rat and Mole hurried past, talking and laughing in high spirits. The sheep blew through their narrow nostrils and stamped their delicate front feet. Their heads tipped back, and a light mist rose from the packed pen into the frosty air. Rat and Mole had spent the whole day with Otter, hunting and exploring the wide high country where the streams that fed their own River first began. Now the short winter afternoon was fading around them, and home was still a long way off. They had been trudging wherever chance took them across a plowed field when they heard the sheep and went to investigate. Beyond the pen they found a beaten track. It was easier on their feet, and it answered a small questioning feeling that every animal carries inside. That feeling seemed to say, “Yes, this is right. This way leads home.”
        - id: ch01-b02
          speaker: mole
          text: Ratty, I think we're coming to a village.
        - id: ch01-b03
          speaker: narrator
          text: Mole slowed down uneasily. The track had become a path, then a lane, and now it joined a well-made road. Neither animal cared much for villages. The paths they used every day went their own way without bothering about churches, post offices, or inns.
        - id: ch01-b04
          speaker: water_rat
          text: Oh, don't worry. At this time of year, everyone will be safely indoors around the fire. The people, the children, the dogs, the cats, all of them. We can slip through without any trouble. We might even look in the windows and see what they're doing.
        - id: ch01-b05
          speaker: narrator
          text: Night came quickly in the middle of December. By the time they reached the village on quiet feet, it had closed all around them, and a first thin layer of powdery snow lay on the ground. Almost all they could see were dim orange-red squares along both sides of the street. Firelight and lamplight spilled through cottage windows into the dark world outside. Most of those low windows had no blinds. Inside, families gathered around tea tables, bent over handiwork, or talked with laughter and lively gestures. Because they had no idea anyone was watching, every movement had a happy, easy grace that even the finest actor could never quite capture. Rat and Mole wandered wherever they pleased from one bright window to the next, like two people moving between little theaters. They were far from their own homes, and longing crept into their eyes. They watched someone stroke a cat, a sleepy child being gathered up and carried off to bed, and a tired man stretching before he knocked out his pipe on the end of a smoldering log.
        - id: ch01-b06
          speaker: narrator
          text: One small window touched them most of all, though its blind was down. It was only a pale glowing square in the night, yet it seemed full of the feeling of home. Inside those walls was a snug little world behind curtains, with the cold and troublesome world of nature shut outside and forgotten. A birdcage hung close to the white blind, so every wire and perch showed clearly. Even yesterday's worn lump of sugar could be seen. A fluffy little bird slept on the middle perch with his head tucked into his feathers. He looked near enough to stroke. Then he stirred, woke, shook himself, and yawned with his tiny beak. After one look around, he tucked his head back again, and his ruffled feathers slowly grew still.
        - id: ch01-b07
          speaker: narrator
          text: A bitter gust struck Rat and Mole on the backs of their necks. Frozen sleet stung their skin and woke them as if from a dream. Their toes were cold, their legs were tired, and their own homes seemed terribly far away.
        - id: ch01-b08
          speaker: narrator
          text: The cottages ended all at once. Beyond the village, the friendly smell of fields met them in the dark. They gathered themselves for the last long stretch. It was the home stretch, the part that had to end at last with a rattling door latch, a sudden glow of fire, and familiar things welcoming them like travelers home from across the sea. They walked steadily without speaking, each busy with his own thoughts.
        - id: ch01-b09
          speaker: narrator
          text: Mole thought mostly about supper. It was pitch-dark, and the country was strange to him, so he followed Rat and trusted him to find the way. Rat walked a little ahead, as usual, with his shoulders hunched and his eyes fixed on the gray road. That was why he did not notice when a sudden summons struck Mole like an electric shock.
        - id: ch01-b10
          speaker: narrator
          text: People have lost many of the delicate senses that animals use to understand everything around them, whether it is alive or not. We do not even have the right words for those senses anymore. We say “smell,” but for an animal that one word covers a whole range of faint thrills that whisper in the nose all day and night. They may summon, warn, urge forward, or drive away. One of those mysterious, almost fairy-like calls reached Mole out of the empty darkness. Its touch was so deeply familiar that he tingled from nose to toes, though at first he could not clearly remember what it meant. He stopped dead in the road. His searching nose moved this way and that as he tried to catch the fine thread again, like a tiny message traveling over a wire. For one moment it was gone. Then he caught it once more, and this time memory came flooding back in full.
        - id: ch01-b11
          speaker: narrator
          text: Home. That was what those gentle appeals and soft touches in the air meant. They were like invisible little hands, all pulling and tugging in one direction. His old home must be close beside him at that very moment, the home he had rushed away from on the bright morning when he first found the River. He had never tried to return. His new life had been so full of pleasures, surprises, and fresh, wonderful experiences that he had hardly spared the place a thought. But now old memories rushed back, and he saw it clearly in the dark. It was shabby, small, and poorly furnished, but it was his. He had made it for himself, and after every day's work he had been happy to return. His home seemed to have been happy with him, too. Now it missed him and was sending out scouts and messengers to bring him back. It called without anger or bitterness. It only reminded him sadly that it was still there, that it remembered him, and that it wanted him.
        - id: ch01-b12
          speaker: narrator
          text: The call could not have been clearer. Mole felt he had to answer it at once.
        - id: ch01-b13
          speaker: mole
          text: Ratty! Wait! Come back. I need you, quickly!
          emotion: happy
        - id: ch01-b14
          speaker: water_rat
          text: Oh, come on, Mole! Keep moving!
        - id: ch01-b15
          speaker: narrator
          text: Rat kept walking cheerfully ahead.
        - id: ch01-b16
          speaker: mole
          text: Please stop, Ratty! You don't understand. It's my old home. I just caught its scent, and it must be very close. I have to go there. I have to! Please come back, Ratty. Please!
          emotion: sad
        - id: ch01-b17
          speaker: narrator
          text: Rat was already too far away to hear Mole clearly or catch the pain in his voice. He was thinking hard about the weather. Rat had caught a scent, too, and it smelled very much like more snow.
        - id: ch01-b18
          speaker: water_rat
          text: We really can't stop now, Mole! Whatever you found, we'll come back for it tomorrow. It's late, snow is coming, and I'm not certain of the road. I need your nose, so hurry up, there's a good fellow!
        - id: ch01-b19
          speaker: narrator
          text: Without waiting for an answer, Rat pressed on. Mole stood alone in the road. His heart felt torn in two, and a great sob was gathering deep inside him. Still, he never once thought of leaving his friend. The messages from home whispered and pleaded until they seemed to command him. He could not stay inside their magic circle any longer. It felt as if he were tearing his own heart loose, but he turned away and followed Rat. Even as he went, faint little scents followed his nose, reproaching him for forgetting his home and choosing his new friendship.
        - id: ch01-b20
          speaker: narrator
          text: With an effort, Mole caught up to his unsuspecting friend. Rat chatted brightly about everything they would do when they got back. He pictured the jolly log fire blazing in the parlor and talked about the enormous supper he meant to eat. Mole said nothing. He simply dragged himself onward, and Rat did not notice his silence or the misery on his face. They covered a considerable distance that way. At last they came to some tree stumps beside a small wood that bordered the road, and Rat finally looked closely at his companion and stopped.
        - id: ch01-b21
          speaker: water_rat
          text: Mole, old fellow, you look completely worn out. You haven't said a word, and your feet are dragging like lead. Let's sit here and rest for a minute. The snow is holding off, and most of the journey is behind us.
        - id: ch01-b22
          speaker: narrator
          text: Mole sank onto a stump and tried to hold himself together. But the sob he had fought for so long would not stay down. It pushed its way out, then another came, and then another. At last Mole stopped struggling. He cried freely and helplessly, because now he knew it was over. He had lost the home he had barely found again.
    - id: ch02
      title: Back Along the Road
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: Rat was shocked by the force of Mole's grief. For a while, he did not dare speak. Then his voice came very soft and kind.
        - id: ch02-b02
          speaker: water_rat
          text: What is it, old fellow? What's wrong? Tell me all about it, and let me see if I can help.
          emotion: calm
        - id: ch02-b03
          speaker: narrator
          text: Mole could hardly force out the words. One sob after another shook his chest and choked his voice.
        - id: ch02-b04
          speaker: mole
          text: I know it's only a shabby, gloomy little place. It isn't cozy like your house, or beautiful like Toad Hall, or grand like Badger's home. But it was mine, Ratty. I loved it. Then I went away and forgot it. Tonight I caught its scent on the road, and everything came rushing back. I wanted it so much! I called, but you didn't hear me. You wouldn't turn back, and I had to leave while I could still smell it. I thought my heart would break. We could have gone for just one look. It was so close, Ratty, but you wouldn't come back!
          emotion: sad
        - id: ch02-b05
          speaker: narrator
          text: Remembering it brought a fresh wave of sorrow. Mole could say no more. Rat stared straight ahead and gently patted his shoulder.
        - id: ch02-b06
          speaker: water_rat
          text: Now I understand. What a pig I've been! That's exactly what I am. A plain, ordinary pig.
          emotion: sad
        - id: ch02-b07
          speaker: narrator
          text: Rat waited as Mole's sobs slowly became quieter. Soon there were more sniffs than sobs. Then Rat stood and spoke as casually as he could.
        - id: ch02-b08
          speaker: water_rat
          text: Well, we'd better get moving, old chap.
        - id: ch02-b09
          speaker: narrator
          text: He started back up the hard road they had just traveled.
        - id: ch02-b10
          speaker: mole
          text: Where are you going, Ratty?
          emotion: surprised
        - id: ch02-b11
          speaker: narrator
          text: Mole looked up in alarm, with tears still on his face.
        - id: ch02-b12
          speaker: water_rat
          text: We're going to find your home. Come along. It may take some searching, and we'll need that nose of yours.
        - id: ch02-b13
          speaker: mole
          text: Oh, Ratty, come back! It's no use. It's too late and too dark, and the place is too far away. The snow is coming, too. I never meant for you to know I felt like this. It all came out by accident. Think of River Bank. Think of your supper!
        - id: ch02-b14
          speaker: water_rat
          text: Forget River Bank, and forget supper! I'm finding your home tonight, even if it takes until morning. So cheer up, take my arm, and we'll soon be there again.
        - id: ch02-b15
          speaker: narrator
          text: Mole was still sniffling and protesting, but he let his determined friend pull him back along the road. Rat kept up a stream of cheerful stories to lift Mole's spirits and make the tired walk feel shorter. At last, Rat thought they must be close to the spot where the call had stopped Mole.
        - id: ch02-b16
          speaker: water_rat
          text: No more talking now. Time for business. Use your nose and give it all your attention.
        - id: ch02-b17
          speaker: narrator
          text: They went on quietly. Soon Rat felt a faint electric tremble pass through Mole's body and into the arm linked with his. Rat let go at once, stepped back, and waited with all his attention fixed on Mole.
        - id: ch02-b18
          speaker: narrator
          text: The signals were coming through.
        - id: ch02-b19
          speaker: narrator
          text: Mole stood stiff and still, his nose raised and lightly quivering as it tested the air. Then came a short, quick run forward. He took a wrong turn, stopped, and doubled back to try again. This time he found the trail. After that he moved ahead slowly, steadily, and with growing confidence.
        - id: ch02-b20
          speaker: narrator
          text: Rat followed at Mole's heels, full of excitement but careful not to interfere. Mole seemed almost to be walking in his sleep. He crossed a dry ditch, scrambled through a hedge, and followed his nose over an open, bare field with no track across it. The stars gave only a faint light, but Mole never hesitated. Then, without the slightest warning, he dived into the ground. Rat had stayed alert for exactly such a move. He followed at once into the tunnel that Mole's faithful nose had found.
        - id: ch02-b21
          speaker: narrator
          text: The tunnel was close and airless, and the smell of earth was strong. To Rat, it seemed a very long time before the passage ended and he could stand upright, stretch, and shake himself. Mole struck a match. Its light showed a neat open space, swept clean and covered with sand. Directly in front of them stood Mole's little front door. Beside it was a bellpull, and above that, painted in Gothic letters, were the words “Mole End.”
        - id: ch02-b22
          speaker: narrator
          text: Mole took a lantern from a nail and lit it. Rat saw that they stood in a small front courtyard. A garden seat rested on one side of the door and a roller on the other. Mole liked things tidy when he was at home, and he hated the little tracks and heaps that visitors kicked up in the ground. Wire baskets of ferns hung on the walls between shelves of plaster statues. There were Garibaldi, the infant Samuel, Queen Victoria, and other heroes of modern Italy.
        - id: ch02-b23
          speaker: narrator
          text: Along one side of the courtyard ran a skittle alley, with benches and small wooden tables marked by the rings of old beer mugs. In the center was a round pond with goldfish and a border of cockle shells. A fanciful tower rose from the water, also covered with shells. On top stood a large silvered glass ball. It reflected everything in quite the wrong shape, which made it especially pleasing.
    - id: ch03
      title: The Little House Wakes Up
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: Mole's face shone when he saw all the things he loved. He hurried Rat through the front door, lit the hall lamp, and looked around his old home. Dust lay thick on everything. The neglected rooms looked cold and deserted. Now he saw how narrow they were and how worn and shabby everything seemed. Mole dropped onto a hall chair and covered his nose with his paws.
        - id: ch03-b02
          speaker: mole
          text: Oh, Ratty, why did I bring you here? It's such a poor, cold little place. On a night like this, you could have been home at River Bank, warming your toes by a blazing fire with all your lovely things around you!
          emotion: sad
        - id: ch03-b03
          speaker: narrator
          text: Rat ignored Mole's gloomy complaints. He raced from room to room, opening doors, peering into cupboards, and lighting lamps and candles wherever he went.
        - id: ch03-b04
          speaker: water_rat
          text: What a splendid little house! It's so compact, and everything has been planned beautifully. Every single thing has its proper place. We'll have a wonderful night here. First we need a good fire, and I'll take care of that. I always know where to find things. Is this the parlor? Excellent! Did you design those little bunks in the wall yourself? Brilliant. I'll fetch wood and coal. You find a duster in the kitchen table drawer and freshen things up. Come on, old chap. Get busy!
        - id: ch03-b05
          speaker: narrator
          text: Rat's energy encouraged Mole. He began dusting and polishing with all his strength, while Rat ran back and forth with armfuls of fuel. Soon a cheerful fire roared in the chimney. Rat called Mole over to warm himself, but Mole looked miserable again. He fell onto the couch and buried his face in the duster.
        - id: ch03-b06
          speaker: mole
          text: Rat, what will you do for supper? You're cold and hungry and tired, and I don't have one thing to feed you. Not even a crumb!
          emotion: sad
        - id: ch03-b07
          speaker: water_rat
          text: You do give up easily! I distinctly saw a sardine opener on the kitchen dresser. Everyone knows that if there's a sardine opener, sardines must be hiding somewhere nearby. Pull yourself together and come help me hunt for food.
        - id: ch03-b08
          speaker: narrator
          text: So they searched. They opened every cupboard and emptied every drawer. What they found was not nearly as bad as Mole had feared, though it could certainly have been better. There was one tin of sardines, a nearly full box of hard captain's biscuits, and a German sausage wrapped in silver paper.
        - id: ch03-b09
          speaker: water_rat
          text: Now that's a feast! I know animals who would give their ears to sit down to this supper tonight.
        - id: ch03-b10
          speaker: narrator
          text: Rat began setting the table.
        - id: ch03-b11
          speaker: mole
          text: But there's no bread. No butter. No—
        - id: ch03-b12
          speaker: water_rat
          text: No goose-liver pâté, no champagne! And speaking of luxuries, what's behind that little door at the end of the passage? Your cellar, of course. This house has everything. Wait right here.
        - id: ch03-b13
          speaker: narrator
          text: Rat disappeared through the cellar door. He soon came back rather dusty, carrying a bottle of beer in each paw and one tucked under each arm.
        - id: ch03-b14
          speaker: water_rat
          text: You certainly know how to spoil yourself, Mole. You deny yourself nothing! This may be the jolliest little house I've ever visited. And where did you find those prints? They make the room feel wonderfully homey. No wonder you love this place. Tell me all about it. How did you make it what it is?
        - id: ch03-b15
          speaker: narrator
          text: Rat kept busy fetching plates, knives, and forks. He even mixed mustard in an egg cup. Meanwhile, Mole began explaining how everything in his home had come to be. His chest still rose and fell from the strain of his recent tears, and at first he spoke shyly. But each memory led to another, and he grew freer and more confident as he warmed to his favorite subject.
        - id: ch03-b16
          speaker: mole
          text: I planned this part myself, and I worked out that corner afterward. That piece came from some money my aunt left me. This one was an amazing bargain, and I found that other thing by pure luck. But I saved and went without things for a long time to buy this.
        - id: ch03-b17
          speaker: narrator
          text: Soon Mole's good spirits had completely returned. It was no longer enough to tell Rat about his possessions. Mole had to go over and touch them, then carry the lamp from one treasure to the next so he could point out every special feature. He talked eagerly and forgot all about the supper they both badly needed. Rat was desperately hungry, but he worked hard to hide it. He followed along, nodded gravely, and examined each object with a puckered brow. Whenever Mole finally gave him a chance to speak, Rat said, “Wonderful,” or, “Most remarkable,” with perfect seriousness.
        - id: ch03-b18
          speaker: narrator
          text: At last Rat managed to guide Mole back to the table. He had just begun serious work with the sardine opener when they heard noises in the courtyard. Small feet shuffled over the gravel, and several tiny voices murmured outside.
        - id: ch03-b19
          speaker: field_mouse_leader
          text: Everyone in a line now. Tommy, hold that lantern higher. Clear your throats before we begin, and no coughing after I count one, two, three. Where's young Bill?
        - id: ch03-b20
          speaker: field_mouse_bill
          text: I'm here! Come on, everyone's waiting!
        - id: ch03-b21
          speaker: water_rat
          text: What's going on out there?
        - id: ch03-b22
          speaker: mole
          text: I think those are the field mice. They always go caroling at this time of year. Around here, it's a real tradition. They never leave me out, either. Mole End is their final stop. I used to give them hot drinks, and sometimes supper when I could afford it. Hearing them again will feel just like old times.
        - id: ch03-b23
          speaker: water_rat
          text: Then let's go see them!
        - id: ch03-b24
          speaker: narrator
          text: Rat jumped up and ran to the door.
    - id: ch04
      title: Carolers at Mole End
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: When they opened the door, a perfect winter sight was waiting. Eight or ten little field mice stood in a half circle in the courtyard, lit by the dim glow of a horn lantern. Red knitted scarves wrapped their necks. Their front paws were pushed deep into their pockets, and their feet danced in place to keep warm. They peeked shyly at one another with bright black eyes, giggled, sniffed, and often wiped their noses on their coat sleeves. The oldest mouse held the lantern. Just as the door opened, he gave the signal.
        - id: ch04-b02
          speaker: field_mouse_leader
          text: Ready now. One, two, three!
        - id: ch04-b03
          speakers: [field_mouse_leader, field_mouse_tommy, field_mouse_bill, field_mouse_singer]
          ensemble: chorus
          text: |-
            Villagers all, this frosty tide,
            Let your doors swing open wide.
            Though wind may follow, and snow beside,
            Yet draw us in by your fire to bide.
            Joy shall be yours in the morning!

            Here we stand in the cold and the sleet,
            Blowing fingers and stamping feet.
            Come from far away you to greet,
            You by the fire and we in the street,
            Bidding you joy in the morning!

            Before half of the night was gone,
            Suddenly a star led us on,
            Raining blessings as it shone,
            Bliss tomorrow and more beyond,
            Joy for every morning!

            Goodman Joseph came through the snow,
            Saw the star over a stable low.
            Mary could not farther go.
            Welcome, thatch and straw below!
            Joy was hers in the morning!

            Then they heard the angels tell,
            “Who were the first to cry Nowell?”
            All the animals, as it befell,
            In the stable where they dwell!
            Joy shall be theirs in the morning!
        - id: ch04-b04
          speaker: narrator
          text: The field mice sang in the same high little voices their ancestors had used long ago. Those old mice had made the carol in frozen, empty fields or beside chimneys blocked by snow. Since then, each generation had passed it down to the next, to be sung in muddy streets outside bright windows at Christmastime. When the song ended, the singers smiled shyly and looked sideways at one another. For one quiet moment, no one spoke. Then a faint musical humming came from high above and far away. Down the long tunnel floated the joyful clanging of distant bells.
        - id: ch04-b05
          speaker: water_rat
          text: Well done, boys! That was beautifully sung. Now every one of you come inside. Warm yourselves by the fire, and we'll find you something hot.
          emotion: happy
        - id: ch04-b06
          speaker: mole
          text: Yes, come in, field mice! This really is like old times. Shut the door behind you and pull that bench close to the fire. Just wait a moment while we—oh, Ratty! What are we thinking? We have nothing to give them!
        - id: ch04-b07
          speaker: narrator
          text: Mole dropped onto a chair with tears nearly starting again.
        - id: ch04-b08
          speaker: water_rat
          text: Leave that part to me. You there with the lantern, come over here. I need a word with you. Are any shops still open this late?
        - id: ch04-b09
          speaker: field_mouse_leader
          text: Certainly, sir. At this season, our shops stay open until all sorts of hours.
        - id: ch04-b10
          speaker: water_rat
          text: Good. Then take your lantern and go at once. I need you to buy a few things.
        - id: ch04-b11
          speaker: narrator
          text: Rat lowered his voice, and a long whispered discussion followed. Mole caught only pieces of it.
        - id: ch04-b12
          speaker: water_rat
          text: Make sure it's fresh. One pound of that should be enough. Get Buggins's brand, because I won't take another. Only the best. If that shop is out, try somewhere else. And it must be homemade, nothing from a tin. If you truly can't find it, do the best you can.
        - id: ch04-b13
          speaker: narrator
          text: Coins clinked from paw to paw. Rat found the field mouse a large basket for the shopping, and the little fellow hurried away carrying both basket and lantern.
        - id: ch04-b14
          speaker: narrator
          text: The other mice sat in a row on the bench, swinging their short legs. They gave themselves completely to the pleasure of the fire and toasted their sore, frozen toes until they tingled. Mole tried to begin an easy conversation, but it did not work. So he asked about their families instead. One by one, he made them list all their many brothers. Those younger brothers were not yet allowed to go caroling, but they hoped their parents would agree very soon.
        - id: ch04-b15
          speaker: narrator
          text: Rat studied the label on one of Mole's beer bottles and nodded with approval.
        - id: ch04-b16
          speaker: water_rat
          text: This is Old Burton. A very sensible choice, Mole. It's exactly what we need for hot spiced ale. Get everything ready while I open the bottles.
        - id: ch04-b17
          speaker: narrator
          text: Soon the drink was mixed, and its tin heater stood deep in the glowing center of the fire. Before long, every field mouse was sipping, coughing, and choking, because even a little hot ale goes a long way with a field mouse. They wiped their eyes, laughed, and forgot they had ever been cold.
        - id: ch04-b18
          speaker: mole
          text: These fellows put on plays, too. They write the plays themselves and act them afterward, and they do it very well. Last year they performed a wonderful one about a field mouse captured at sea by a Barbary pirate. He was forced to row in a galley. When he finally escaped and came home, the girl he loved had gone into a convent. You there, I remember you were in it. Stand up and give us a bit of your part.
        - id: ch04-b19
          speaker: narrator
          text: Tommy stood, giggled shyly, and looked around the room. Then not one word would come out. His friends cheered him on. Mole coaxed and encouraged him. Rat even took him by the shoulders and shook him, but nothing cured his stage fright. Soon everyone was working over the speechless actor as hard as rescuers trying to revive someone pulled from deep water.
        - id: ch04-b20
          speaker: narrator
          text: Then the latch clicked. The door opened, and the field mouse with the lantern returned, staggering beneath his heavy basket.
    - id: ch05
      title: A Happy Homecoming
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: The moment the real, solid, delicious contents of the basket tumbled onto the table, everyone forgot about acting. Rat took command of the whole operation. Every animal was given something to prepare or sent running to fetch what another cook needed. Within minutes, supper was ready. Mole sat at the head of his own table as if he were dreaming. A little while ago the table had been bare. Now it was crowded from end to end with savory, comforting food. His little friends saw the feast, and their faces brightened and beamed. They wasted no time before beginning.
        - id: ch05-b02
          speaker: narrator
          text: Mole was truly famished, so he threw himself into the food with all his heart. What a happy homecoming this had become after all. As they ate, they remembered old times together. The field mice told him all the latest neighborhood gossip and did their best to answer the hundred questions that came tumbling from him. Rat said little or nothing. He watched the table instead, quietly making sure each guest had whatever he wanted and plenty of it. Most of all, he made sure Mole never had to trouble himself or feel anxious about a single thing.
        - id: ch05-b03
          speakers: [field_mouse_leader, field_mouse_tommy, field_mouse_bill, field_mouse_singer]
          ensemble: chorus
          text: Thank you, Mr. Mole! Thank you, Mr. Rat! Merry Christmas, and joy to you both!
          emotion: happy
        - id: ch05-b04
          speaker: narrator
          text: At last the field mice clattered away, full of gratitude and calling out wishes for the season. Their coat pockets bulged with treats for the little brothers and sisters waiting at home. The door closed behind the final guest, and the faint clink of lanterns slowly disappeared into the distance.
        - id: ch05-b05
          speaker: narrator
          text: Mole and Rat stirred the fire into a brighter blaze and pulled their chairs close. They made one last cup of hot spiced ale and talked over everything that had happened during the long day. After a while, Rat gave an enormous yawn.
        - id: ch05-b06
          speaker: water_rat
          text: Mole, old chap, I can hardly keep my eyes open. Calling me sleepy doesn't begin to cover it. Is that your own bunk on the far side? Good. Then I'll take this one. What a wonderful little house this is. Everything is right where you need it.
        - id: ch05-b07
          speaker: narrator
          text: Rat climbed into his bunk and rolled himself snugly in the blankets. Sleep took him at once, as neatly as a bundle of barley folded into the arms of a reaping machine.
        - id: ch05-b08
          speaker: narrator
          text: Tired Mole was just as glad to go to bed. Soon his head rested on the pillow, and he felt joyful and content. Before closing his eyes, he looked around the old room. Firelight warmed the familiar things that had been part of him for so long. They seemed to welcome him back without the least resentment.
        - id: ch05-b09
          speaker: narrator
          text: Mole now felt exactly as thoughtful Rat had quietly worked to make him feel. He could see how plain and simple his home was, and even how narrow. But he also understood how much it meant to him. A place of one's own could be an anchor in life. Mole did not want to give up his new life, with all its splendid spaces, sunlight, fresh air, and everything they offered. He did not mean to turn his back on the world above, creep home, and stay hidden forever. That larger world was too powerful. It still called to him, even this far underground, and he knew he would go back to its wider stage.
        - id: ch05-b10
          speaker: narrator
          text: But it was good to know that he had this place to come back to. It belonged entirely to him, and everything in it had grown into part of his life without his even noticing. These familiar things seemed glad to see him again, with no anger that he had stayed away so long. Whenever he returned from the larger world, he knew he could count on them to offer exactly the same simple welcome.
