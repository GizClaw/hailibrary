audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 温暖从容，带着含蓄的幽默
        timbre: 清澈醇厚
        pace: 舒缓而富于变化
        pitch: 中低
    mole:
      display_name: 鼹鼠
      tts:
        delivery: 诚恳好奇，兴奋时有些冒失
        timbre: 柔和明亮
        pace: 中等偏快
        pitch: 中高
    rat:
      display_name: 河鼠
      tts:
        delivery: 热情老练，随和中带着笃定
        timbre: 温暖清亮
        pace: 从容
        pitch: 中
    elderly_rabbit:
      display_name: 老兔子
      tts:
        delivery: 一本正经，略显傲慢
        timbre: 干瘦清晰
        pace: 中等
        pitch: 中高
    rabbit_1:
      display_name: 兔子甲
      tts:
        delivery: 气急败坏，爱埋怨同伴
        timbre: 尖细
        pace: 偏快
        pitch: 高
    rabbit_2:
      display_name: 兔子乙
      tts:
        delivery: 不服气，急着推卸责任
        timbre: 清脆
        pace: 偏快
        pitch: 中高
    rabbit_3:
      display_name: 兔子丙
      tts:
        delivery: 懊恼而挑剔
        timbre: 轻薄
        pace: 中等
        pitch: 高
    otter:
      display_name: 水獭
      tts:
        delivery: 爽朗机敏，玩笑脱口而出
        timbre: 洪亮圆润
        pace: 轻快
        pitch: 中低
    badger:
      display_name: 獾
      tts:
        delivery: 寡言直接，不爱应酬
        timbre: 低沉粗厚
        pace: 缓慢
        pitch: 低
  chapters:
    - id: ch01
      title: 第一章 河岸
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 鼹鼠忙了整整一上午，给自己的小屋做春季大扫除。他先拿扫帚扫，再用抹布擦，然后爬上梯子、踏凳和椅子，提着刷子和一桶石灰水，到处粉刷。忙到后来，他眼里嗓子里全是灰，黑毛上溅满白点，腰酸背痛，两条胳膊也累得发沉。可春意正在头顶的空气里涌动，也在脚下和四周的泥土里萌发。它甚至钻进那间低矮阴暗的小屋，叫鼹鼠心神不宁，渴望起外面的天地。他忽然扔下刷子，连外套都顾不得穿，就冲出家门，奔向那条通往地面的陡峭隧道。别的动物若住得离阳光近些，门外会有一条铺碎石的车道。鼹鼠只有这条隧道。
        - id: ch01-b02
          speaker: mole
          text: 真烦！去它的！春季大扫除见鬼去吧！往上走！再往上走！
        - id: ch01-b03
          speaker: narrator
          text: 他用小爪子刨了又挠，扒了又挤，挤完再扒，扒完再挠，一刻也不停。终于，“噗”的一下，鼻尖钻进阳光，整只鼹鼠也翻出来，滚进温暖的大草地。阳光热乎乎地烘着他的毛，柔风抚过发烫的额头。他在地下住得太久，耳朵都快听钝了。此刻，鸟儿的欢唱落进耳中，简直像一片响亮的欢呼。他只因活着就满心欢喜，更何况春天里再不用打扫屋子，快活得四条腿同时跳离地面。他一路蹦过草地，直到远处的树篱。
        - id: ch01-b04
          speaker: mole
          text: 这才叫快活！可比刷石灰强多了！
          emotion: happy
        - id: ch01-b05
          speaker: elderly_rabbit
          text: 站住！这是私人道路，要走过去，先交六便士！
        - id: ch01-b06
          speaker: narrator
          text: 鼹鼠正急着往前走，根本没把老兔子放在眼里，一下便将他撞得四脚朝天。随后，鼹鼠沿着树篱轻快地往前跑。别的兔子听见外面的动静，纷纷慌忙从洞口探出脑袋，想瞧瞧究竟出了什么乱子。鼹鼠一路拿他们取笑，还没等他们想出一句像样的回话，便早已跑得不见踪影。
        - id: ch01-b07
          speaker: mole
          text: 把你们都做成洋葱酱！
        - id: ch01-b08
          speaker: narrator
          text: 鼹鼠早跑远了，兔子们还没想好怎么回嘴，只好彼此埋怨。
        - id: ch01-b09
          speaker: rabbit_1
          text: 你真笨！刚才怎么不告诉他该守规矩？
        - id: ch01-b10
          speaker: rabbit_2
          text: 那你自己怎么没把他叫住？
        - id: ch01-b11
          speaker: rabbit_3
          text: 你们明明都可以提醒他交钱！
        - id: ch01-b12
          speaker: narrator
          text: 可这时说什么都晚了，事情总是这样。鼹鼠继续兴冲冲地在草地上东游西逛。他沿着树篱走，又穿过一片片小树林。鸟儿在筑巢，花儿正含苞，嫩叶一个劲儿往外钻。放眼望去，人人都欢欢喜喜，都在向前生长，也都忙着自己的事情。可鼹鼠心底再也没有声音拿“刷石灰”来责备他。自己成了这群忙碌居民中唯一闲着的家伙，他反而觉得妙不可言。休假的最大乐趣，也许不全在于自己能够休息，而在于能看着别人忙个不停。
        - id: ch01-b13
          speaker: narrator
          text: 走着走着，他忽然来到一条水量丰沛的河边，这才觉得自己的快乐已经圆满。鼹鼠一辈子从没见过河。眼前这个光滑、蜿蜒、丰盈饱满的活物，一路追逐，一路咯咯发笑。它咕噜一声抓住什么，又笑着把手松开，马上扑向新的玩伴。玩伴挣脱了，它便再次追上去，把对方紧紧抱住。河面上的一切都在颤动、闪烁。亮光、波光和火花跳个不停，沙沙声、旋涡声、絮语声和冒泡声响成一片。鼹鼠像中了魔，完全看入了迷。他沿着河岸小跑，仿佛一个小不点儿跟在大人身边，被那人讲的惊险故事牢牢吸引。他跑了很久，终于累得坐下来。河流仍在身旁滔滔不绝，把世上最精彩的故事一个个讲给他听。这些故事从大地深处送来，最后还要讲给永不满足的大海。
        - id: ch01-b14
          speaker: narrator
          text: 鼹鼠坐在草地上望向对岸，水边上方有个黑洞，引起了他的注意。他迷迷糊糊地想着，要是哪只动物所求不多，又喜欢小巧精致的河景住宅，那里一定能收拾成舒适的家。它高过洪水线，也远离尘土和喧闹。洞穴深处忽然闪出一点亮光，消失以后，又像小星星那样亮起来。可星星不会待在这种地方，萤火虫也没有这么小、这么亮。那亮点朝他眨了一下，原来是一只眼睛。眼睛四周，一张小脸慢慢显出来，就像画有了画框。那是张长着胡须的棕色圆脸，神情严肃，眼睛里仍有亮光。小耳朵整整齐齐，毛发浓密柔滑。那是河鼠。两只动物隔着水，小心地互相打量。
        - id: ch01-b15
          speaker: rat
          text: 你好啊，鼹鼠！
        - id: ch01-b16
          speaker: mole
          text: 你好啊，河鼠！
        - id: ch01-b17
          speaker: rat
          text: 想不想到我这边来？
        - id: ch01-b18
          speaker: mole
          text: 说起来当然容易。
        - id: ch01-b19
          speaker: narrator
          text: 鼹鼠从没来过河边，更不懂河上的门道。他只看见宽宽的水横在两人之间，所以口气不免有些烦躁。河鼠一句也没有争辩。他俯下身，解开一根绳子，用力将它拉过来，随后轻巧地跨进一条小船。鼹鼠刚才完全没发现它。船外漆成蓝色，里面是白色，大小正好坐下两只动物。鼹鼠虽然还不懂船究竟怎么用，心却一下子被它迷住了。河鼠利落地划过河面，把船系稳，又向正小心翼翼往下迈的鼹鼠伸出前爪。
        - id: ch01-b20
          speaker: rat
          text: 扶住我的爪子。来，快迈一步！
        - id: ch01-b21
          speaker: narrator
          text: 鼹鼠又惊又喜，自己竟真的坐在一条船的船尾。河鼠推船离岸，拿起双桨。
        - id: ch01-b22
          speaker: mole
          text: 今天真是奇妙。我这一辈子还从来没坐过船呢。
        - id: ch01-b23
          speaker: rat
          text: 什么？你从没坐过船？从来没有？那你以前到底在干什么呀？
          emotion: surprised
        - id: ch01-b24
          speaker: mole
          text: 坐船真的有那么好吗？
        - id: ch01-b25
          speaker: narrator
          text: 他嘴上问得腼腆，心里却早已准备相信河鼠的话。鼹鼠往后靠在座位上，认真打量着身边的一切。柔软的坐垫、整齐的船桨、固定船桨的桨架，还有那些他叫不出名字的精巧装置，每一样都叫他着迷。与此同时，小船还在身下轻轻摇动，那感觉既新鲜又美妙。
        - id: ch01-b26
          speaker: rat
          text: 好？这是世上唯一值得做的事。相信我，年轻的朋友，什么事都比不上坐着船随意闲逛。就是闲逛，坐着船，慢慢闲逛……
        - id: ch01-b27
          speaker: mole
          text: 河鼠，看前面！
          emotion: fearful
        - id: ch01-b28
          speaker: narrator
          text: 来不及了。船迎头撞上河岸，方才还神游天外的桨手仰躺在船底，两脚翘向天空。
        - id: ch01-b29
          speaker: rat
          text: 坐着船闲逛也好，陪着船闲逛也好，都一样。待在船里还是掉到船外，也没什么要紧，这正是它的妙处。你可以动身，也可以不动身。可以去到想去的地方，也可以跑到别处，甚至哪里也到不了。你一直有事忙，又好像什么正经事都没做。做完一件，还有下一件。你愿意就做，不过不做往往更好。对啦，要是你今天上午没别的事，我们何不顺流而下，玩上一整天？
        - id: ch01-b30
          speaker: narrator
          text: 河鼠一边开心地笑，一边若无其事地从船底爬起来。鼹鼠听见这份邀请，单是因为快乐就忍不住晃起脚趾。他挺起胸膛，发出一声心满意足的叹息，又把全身舒舒服服地靠进柔软的坐垫里。
        - id: ch01-b31
          speaker: mole
          text: 我今天过得可真了不起！我们马上出发吧！
          emotion: happy
        - id: ch01-b32
          speaker: rat
          text: 先等我一小会儿！
        - id: ch01-b33
          speaker: narrator
          text: 河鼠把船系到码头，爬进自己的洞。不久，他提着一只塞得鼓鼓的柳条篮，摇摇晃晃地回来了。
        - id: ch01-b34
          speaker: rat
          text: 把篮子放在你脚下。
        - id: ch01-b35
          speaker: mole
          text: 里面都装了什么？
        - id: ch01-b36
          speaker: rat
          text: 有冷鸡肉、冷牛舌、冷火腿、冷烤牛肉、腌小黄瓜、沙拉、法式小面包、水田芥三明治、肉酱、姜汁啤酒、柠檬汽水、苏打水……
        - id: ch01-b37
          speaker: mole
          text: 快停下，快停下！这也太丰盛了！
          emotion: happy
        - id: ch01-b38
          speaker: rat
          text: 真有那么多吗？我每次出来一小趟，也就带这些。别的动物还嫌我小气，说我准备得太省呢。
        - id: ch01-b39
          speaker: narrator
          text: 鼹鼠已经一个字也听不见了。他全心沉进刚刚开始的新生活。闪亮的水光、细碎的波纹、四周的气味和声音，还有满眼的阳光，把他灌得醉醺醺的。他把一只爪子伸到船外，让它拖在凉凉的河水里，自己睁着眼，久久做着白日梦。河鼠是个体贴的好家伙，只管一下又一下稳稳地划船，并不去惊动朋友。就这样过了大约半小时，河鼠才再次开口。
        - id: ch01-b40
          speaker: rat
          text: 老兄，我真喜欢你这身衣裳。等我攒够钱，也要做一套黑天鹅绒便服。
        - id: ch01-b41
          speaker: mole
          text: 对不起，我刚才太失礼了。可这些东西对我来说，全都是第一次见。所以，这就是一条河！
        - id: ch01-b42
          speaker: rat
          text: 是这条河。
        - id: ch01-b43
          speaker: mole
          text: 你真的住在河边？这样的日子一定快活极了！
        - id: ch01-b44
          speaker: rat
          text: 我住在它旁边，陪着它，待在它上面，也泡在它里面。它既像我的兄弟姐妹，也像姑姨亲眷。它是伙伴，是食物，是饮水，当然还是洗澡的地方。它就是我的整个世界，我不想要别的。它没有的东西，不值得要。它不知道的事，也不值得知道。天哪，我们一起经历过多少好时光！不管冬夏春秋，它总有乐子，总有新鲜事。二月发洪水时，我的地窖和地下室里全是不能喝的水，褐色河水会从我最好的卧室窗外滚过去。等河水退下去，河床露出一块块泥地，那气味像李子蛋糕。灯心草和水草堵住河道，我却能穿着干鞋，在大半个河床上慢慢转悠，找新鲜吃食，还能捡到粗心的人从船上掉下来的种种东西。
        - id: ch01-b45
          speaker: mole
          text: 可有时候不会很闷吗？这里只有你和河，连个说话的人也没有。
        - id: ch01-b46
          speaker: rat
          text: 连个说话的人也没有？算了，你刚来，我不能怪你。现在河岸挤得很，不少居民都搬走了，早已不是从前的样子。水獭、翠鸟、小䴙䴘、黑水鸡，整天都在附近，还总想叫你陪他们做点什么，好像别人自己没有正事似的！
        - id: ch01-b47
          speaker: mole
          text: 那边是什么地方？
        - id: ch01-b48
          speaker: rat
          text: 那只是野林。我们住在河岸的动物不大去那里。
        - id: ch01-b49
          speaker: mole
          text: 里面的动物，是不是不太友善？
        - id: ch01-b50
          speaker: rat
          text: 这个嘛，松鼠都还不错。有些兔子也行，不过兔子里什么样的都有。当然还有獾。他住在野林最深处，给钱请他搬家，他也不肯。亲爱的老獾！没人敢招惹他，最好也别去。
        - id: ch01-b51
          speaker: mole
          text: 谁会去招惹他呢？
        - id: ch01-b52
          speaker: rat
          text: 当然，那里也有别的家伙。黄鼠狼、白鼬、狐狸，还有那一类动物。我跟他们相处得还不错，见面会打招呼，也会闲聊。可他们有时会闹起来。真到那时候，你不能信任他们。事实就是这样。
        - id: ch01-b53
          speaker: narrator
          text: 鼹鼠知道，按照动物间的礼数，不该絮叨将来可能发生的麻烦，最好提都别提，于是换了话题。
        - id: ch01-b54
          speaker: mole
          text: 野林再过去呢？远处蓝蒙蒙的，看着像山，又说不定不是。那边像有城镇的烟，也许只是飘过去的云？
        - id: ch01-b55
          speaker: rat
          text: 野林外面就是大世界。那地方跟你我都没关系。我从没去过，以后也绝不会去。你只要有点头脑，也不会去。请别再提了。瞧，我们的回水湾到了，就在这里吃午饭。
        - id: ch01-b56
          speaker: narrator
          text: 他们离开主河道，划进一片乍看像被陆地围住的小湖。绿色草坡一直斜到两边水沿，蛇一样的褐色树根在平静的水下泛着亮光。前方的堰坝像一片银色肩膀，白色浪花从上面滚落。旁边紧挨着一架停不下来的磨坊水车，水滴从轮上不断落下。水车又托着一座灰山墙的磨坊。低沉朦胧的水声充满四周，听来让人安心。那片轰鸣里，还不时跳出几个清亮的小声音，快活地说上几句。眼前美得叫鼹鼠举起两只前爪，只顾惊叹。
        - id: ch01-b57
          speaker: mole
          text: 哎呀，这里可真美！我都不知道该说什么好了！
          emotion: surprised
        - id: ch01-b58
          speaker: narrator
          text: 河鼠把船靠岸系好，扶着仍有点笨手笨脚的鼹鼠安全上岸，又把午餐篮甩到草地上。鼹鼠央求河鼠，让他独自把所有东西拿出来。河鼠乐得成全，便舒舒服服地摊开四肢躺下休息。鼹鼠抖开餐布，仔细铺平，又把那些神秘的纸包一个个取出，按顺序摆好。每揭开一件新东西，他都要再惊叹一回。等一切准备妥当，河鼠招呼他开吃。鼹鼠从清早开始大扫除，到现在一口没吃，一滴没喝，又经历了那么多事，当然乐得服从。那个早晨仿佛已经过去许多天了。
        - id: ch01-b59
          speaker: rat
          text: 你在看什么？
        - id: ch01-b60
          speaker: mole
          text: 水面上有一串气泡，正一路往前游。我觉得挺有意思。
        - id: ch01-b61
          speaker: rat
          text: 气泡？哦嗬！
        - id: ch01-b62
          speaker: narrator
          text: 河鼠快活地啾了一声，像在招呼谁。果然，一张宽阔油亮的嘴脸从岸边冒出来。水獭爬上草地，抖掉满身河水，直奔食物。
        - id: ch01-b63
          speaker: otter
          text: 两个贪吃鬼！河鼠，你怎么没叫我？
        - id: ch01-b64
          speaker: rat
          text: 这顿午饭也是临时起意，并没有事先安排。对了，正好给你们介绍一下，这位是我的朋友鼹鼠先生。
        - id: ch01-b65
          speaker: otter
          text: 幸会，幸会！今天哪儿都闹哄哄的，仿佛全世界都跑到河上来了。我钻进这条回水湾，本想躲个清静，结果又碰见你们！不过，对不起，我不是嫌你们吵。
        - id: ch01-b66
          speaker: narrator
          text: 鼹鼠和水獭立刻成了朋友。这时，身后的树篱沙沙作响。去年的枯叶间探出一颗带条纹的脑袋，后面耸着高高的肩膀。
        - id: ch01-b67
          speaker: rat
          text: 过来呀，老獾！
        - id: ch01-b68
          speaker: badger
          text: 唔！有客人。
        - id: ch01-b69
          speaker: narrator
          text: 獾才往前走了两步，就掉头不见了。
        - id: ch01-b70
          speaker: rat
          text: 他就是这种脾气，最讨厌应酬。今天准不会再露面了。水獭，快说说，河上都有谁？
        - id: ch01-b71
          speaker: otter
          text: 别的不说，蟾蜍就在河上。划着崭新的赛艇，衣服是新的，什么都是新的！
        - id: ch01-b72
          speaker: narrator
          text: 河鼠和水獭对望一眼，都笑了。
        - id: ch01-b73
          speaker: rat
          text: 他有一阵满脑子只有帆船，玩腻以后又改玩撑篙船，天天撑，结果弄得一团糟。去年他又迷上住家船，非要大家陪他住，还得假装很喜欢。他当时说，要在那条船上过一辈子。可他不管迷上什么，很快都会厌烦，再换一样新玩意儿。
        - id: ch01-b74
          speaker: otter
          text: 他其实是个好家伙，就是太不稳当，尤其在船上！
        - id: ch01-b75
          speaker: narrator
          text: 他们坐的地方与主河道之间隔着一座小岛。越过小岛，刚好能够看见主河道的一小段。就在这时，一条赛艇飞快地闪入视野。划船的是个又矮又胖的身影，正是蟾蜍。他的桨打得水花四溅，身子也左右摇得厉害，可他还是用尽全力往前划。河鼠站起身，高声向他打招呼。蟾蜍却摇摇头，神情严肃得很，接着又埋头苦干。
        - id: ch01-b76
          speaker: rat
          text: 他再这样摇下去，转眼就会掉进水里。
        - id: ch01-b77
          speaker: otter
          text: 那还用说。我讲过蟾蜍和船闸管理员的笑话吗？事情是这样的。蟾蜍他……
        - id: ch01-b78
          speaker: narrator
          text: 一只走错路的蜉蝣歪歪斜斜地飞过水面。那些初见世面的年轻蜉蝣常常这样，醉醺醺的，不知天高地厚。水里忽然卷起一个旋涡，只听“咕噜”一声，蜉蝣没了。水獭也没了。鼹鼠低头看去。水獭讲故事的声音仿佛还在耳边，刚才摊着一只水獭的草地却明明空了。他一直望到遥远的天边，远近都没有半只水獭。可河面上，又出现了一串气泡。河鼠若无其事地哼起小调，鼹鼠也想起了动物间的礼数。不管朋友出于什么原因突然消失，哪怕根本没有原因，都不该多嘴评论。
        - id: ch01-b79
          speaker: rat
          text: 好吧，我们也该走了。不知道咱们两个谁收拾午餐篮更合适？
        - id: ch01-b80
          speaker: mole
          text: 请让我来吧。
        - id: ch01-b81
          speaker: narrator
          text: 收拾篮子当然不如打开篮子好玩，从来都是这样。可鼹鼠已经决定，今天遇上的每一件事都要好好享受。他刚把篮子装好，带子也扎得紧紧的，就看见草地上有只盘子正瞪着自己。鼹鼠只好重新再来一遍。等第二次收好，河鼠又指出一把叉子，那叉子显眼得任谁都不该漏掉。到了最后，瞧啊，居然还有一罐芥末酱。鼹鼠先前一直坐在上面，自己毫无察觉。尽管如此，这活儿总算完成了，谁也没有发多大的脾气。
        - id: ch01-b82
          speaker: narrator
          text: 午后的太阳渐渐西沉。河鼠带着梦游般的神情，轻轻划船回家，嘴里喃喃念着一些像诗的句子，也没怎么留意鼹鼠。鼹鼠午饭吃得饱饱的，心里既满足又得意。他觉得自己已经完全习惯坐船，简直像回到家里一样。可他又渐渐坐不住了，望着河鼠手中的双桨，终于忍不住开口。
        - id: ch01-b83
          speaker: mole
          text: 河鼠，求你啦，我现在想划船！
        - id: ch01-b84
          speaker: rat
          text: 还不到时候，年轻的朋友。等你上过几堂课再说。划船没有看起来那么容易。
        - id: ch01-b85
          speaker: narrator
          text: 鼹鼠安静了一两分钟。可他看着河鼠划得那么有力，又那么轻松，心里越来越眼红。骄傲也在耳边悄悄告诉他，这事根本不难，他肯定半点不比河鼠差。鼹鼠猛地跳起来，一把抢过双桨。河鼠正望着水面，嘴里还念着那些像诗的句子，完全没有防备。他向后跌下座位，这已经是今天第二次仰面躺进船底，两条腿翘在半空了。鼹鼠得意扬扬地抢到他的位置上，信心十足地抓牢双桨。
        - id: ch01-b86
          speaker: rat
          text: 住手，你这个大傻瓜！你根本不会划，会把船弄翻的！
          emotion: fearful
        - id: ch01-b87
          speaker: narrator
          text: 鼹鼠神气十足地把双桨往后一扬，做出漂亮的架势，再使足力气往水里一插。可桨连水面都没有碰到。他自己的两条腿倒先飞过头顶，整只鼹鼠仰面摔在躺着的河鼠身上。这下他真的慌了，连忙伸爪去抓船帮。就在下一刻，只听“扑通”一声，小船整个翻了过来。鼹鼠落进河里，发现自己只能手忙脚乱地拼命挣扎。
        - id: ch01-b88
          speaker: narrator
          text: 河水冷得刺骨，湿透的滋味难受极了。鼹鼠不断下沉，水声在耳边轰鸣。等他咳着、呛着浮上来，太阳显得那么明亮可亲。可他很快又往下沉，绝望也像黑暗一样罩过来。忽然，一只结实的爪子抓住他的后颈。是河鼠，而且河鼠分明在笑。鼹鼠甚至能感觉到笑意沿着他的胳膊和爪子，一直传进自己脖子里。
        - id: ch01-b89
          speaker: narrator
          text: 河鼠抓住一支船桨，塞到鼹鼠一边胳膊下面，又用另一支桨托住他另一边。随后，河鼠跟在后面游，把这个一点办法也没有的家伙推向岸边。他把鼹鼠拖出水，安置在草地上。此刻的鼹鼠湿软瘫塌，简直成了一团满心悲惨的东西。河鼠先替他擦了一阵，又从湿透的毛里拧出不少河水。
        - id: ch01-b90
          speaker: rat
          text: 好啦，老兄！沿纤道使劲来回跑，跑到身上暖和、毛也干了。我去捞午餐篮。
        - id: ch01-b91
          speaker: narrator
          text: 可怜的鼹鼠外面湿透，心里惭愧，只好沿着岸边来回跑，直到身上差不多干了。河鼠则再次跳进水中。他先找到漂走的小船，把船翻正，拖回岸边系好。接着，他一次又一次游出去，把水面上漂着的家当逐件带回来。到了最后，河鼠又潜入水底，终于摸到那只午餐篮，费了很大力气才将它拖上岸。一切重新收拾妥当，可以再次出发了。浑身无力、垂头丧气的鼹鼠坐回船尾。船刚离岸，他就低声开口，声音因为激动而断断续续。
        - id: ch01-b92
          speaker: mole
          text: 河鼠，我慷慨的朋友！我刚才又愚蠢，又不知道感恩，实在对不起。想到差点丢掉那只漂亮的午餐篮，我心里就难受。我确实是个十足的傻瓜。请你饶我这一次，原谅我，让我们还像刚才那样，好吗？
          emotion: sad
        - id: ch01-b93
          speaker: rat
          text: 没事啦！河鼠还怕沾一点水吗？我平常待在水里的时候，比在岸上还多。别再想这件事了。对了，你最好到我家住上一阵。我家很朴素，也有点粗陋，比不了蟾蜍的大宅子，不过你还没见过那里。我会让你住得舒服，还会教你划船和游泳。用不了多久，你在水上就会跟我们一样自在。
        - id: ch01-b94
          speaker: narrator
          text: 河鼠说得那么亲切，鼹鼠感动得一句话也答不上来，只能悄悄用爪背擦掉一两滴眼泪。河鼠很体贴，故意把头转向别处，仿佛什么也没看见。又过了一会儿，鼹鼠的精神渐渐恢复。他们经过两只黑水鸡时，那两个家伙凑在一起，偷偷笑他浑身湿透、毛发凌乱的样子。鼹鼠这时已经有力气了，马上干脆利落地回敬了几句。
        - id: ch01-b95
          speaker: narrator
          text: 回到家，河鼠在起居室生起一炉明亮的火。他又上楼取来睡袍和拖鞋，让鼹鼠换上，再把朋友安置在炉前的扶手椅里。鼹鼠裹着温暖的睡袍，慢慢烤干剩下的潮气。河鼠则坐在一旁，一直讲河上的故事，直到晚饭时间。对一只住惯泥土、今天才第一次见到河的鼹鼠来说，那些故事真是惊心动魄。他听见堰坝和突如其来的洪水，听见梭子鱼猛然跃出水面，也听见从汽船上飞出的硬瓶子。至少，瓶子确实是从汽船上扔下来的，那么想必就是汽船扔的。他还听见苍鹭有多么挑剔自己的谈话对象，听见顺着排水沟去探险，跟水獭一起在夜里捕鱼，还有陪獾去很远的地方旅行。晚饭是一顿无比快活的饭。可吃完没多久，鼹鼠就困得连眼睛也睁不开了。体贴的主人只好陪他上楼，把他安顿在家里最好的卧室。鼹鼠平静又满足地躺下，很快把头放到枕头上。他知道，自己新认识的朋友河流，正在窗外轻轻拍着窗台。
        - id: ch01-b96
          speaker: narrator
          text: 对重获自由的鼹鼠来说，这一天不过是许多相似日子中的第一天。往后的许多天里，他也会像这天一样，在河边遇见数不尽的趣事。随着夏天一点点成熟，白昼变得越来越长。一个又一个日子接连到来，每一天都比前一天更长，也都装满了值得留心的新鲜趣事。鼹鼠学会了游泳，也学会了划船，终于亲身领略到流水带来的欢欣。有时候，他会把耳朵贴在细细的芦苇秆上。风儿日日夜夜都在苇丛间低声诉说，而他偶尔已经能听懂其中的一点了。
