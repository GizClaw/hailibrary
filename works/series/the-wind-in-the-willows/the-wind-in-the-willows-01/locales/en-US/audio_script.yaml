  chapters:
    - id: ch01
      title: The River Bank
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: All morning, Mole had been working terribly hard at spring-cleaning his little home. First he attacked it with brooms, and then with dusters. Next he climbed ladders, steps, and chairs with a brush and a pail of whitewash. Before long, dust filled his throat and stung his eyes. White splashes covered his black fur, his back ached, and his arms felt worn out. But spring was stirring in the air above him and in the earth below and around him. Even in that small, dark, low-ceilinged house, it brought a restless longing for something else.
        - id: ch01-b02
          speaker: mole
          text: Bother! Oh, forget it! I am done with spring-cleaning!
          emotion: angry
        - id: ch01-b03
          speaker: narrator
          text: He threw his brush onto the floor and rushed from the house without even waiting to put on his coat. Something overhead seemed to be calling him, and the call would not be ignored. Mole hurried into the steep little tunnel that served as his driveway, the way a fine gravel drive served the animals who lived nearer to the sun and open air. He scraped and scratched, scrabbled and squeezed, then squeezed and scrabbled and scratched some more, working upward with his small paws and muttering as he went.
        - id: ch01-b04
          speaker: mole
          text: Up we go! Up we go!
          emotion: happy
        - id: ch01-b05
          speaker: narrator
          text: At last, pop! His nose broke into the sunlight, and he rolled out onto the warm grass of a wide meadow.
        - id: ch01-b06
          speaker: mole
          text: Now this is wonderful! Much better than whitewashing!
          emotion: happy
        - id: ch01-b07
          speaker: narrator
          text: Hot sunshine fell across his fur, and a soft breeze cooled his warm forehead. After living so long in the quiet rooms belowground, the songs of the happy birds struck his ears almost as loudly as a shout. Mole jumped with all four feet at once, simply for the joy of being alive. Free of both his house and its spring-cleaning, he bounded across the meadow until he reached the hedge on the far side.
        - id: ch01-b08
          speaker: elderly_rabbit
          text: Stop right there! It costs sixpence to use this private road!
        - id: ch01-b09
          speaker: narrator
          text: Mole impatiently bowled him over and trotted beside the hedge. Other rabbits popped out of their holes to see what all the noise was about, and Mole called after them as he passed.
        - id: ch01-b10
          speaker: mole
          text: Onion sauce! Onion sauce!
        - id: ch01-b11
          speaker: narrator
          text: He was gone before the rabbits could think of a good answer. Then they turned on one another instead.
        - id: ch01-b12
          speaker: rabbit_one
          text: Oh, you are hopeless! Why didn't you tell him—
          emotion: angry
        - id: ch01-b13
          speaker: rabbit_two
          text: Well, why didn't you say—
          emotion: angry
        - id: ch01-b14
          speaker: rabbit_three
          text: One of you could have reminded him—
          emotion: angry
        - id: ch01-b15
          speaker: narrator
          text: They went on grumbling at one another in the usual way, but by then it was much too late. Mole wandered wherever he pleased, back and forth through meadows, along hedges, and across little woods. Everywhere he looked, birds were building nests, flowers were opening, and new leaves were pushing out. Everything around him was happy, making progress, and busy with its own work. His conscience did not trouble him or whisper a word about the whitewash waiting at home. He only enjoyed being the one idle fellow among all those hardworking neighbors. Sometimes the finest thing about a holiday is not the rest itself. It is watching everybody else at work while you are free.
        - id: ch01-b16
          speaker: narrator
          text: Just when Mole thought he could not be any happier, he wandered to the edge of a broad, well-fed river. He had never seen one before. It seemed like a sleek, full-bodied animal twisting through the land, chasing along with a chuckle. It caught things with a gurgle, let them go with a laugh, then rushed off to seize new playmates. They shook themselves free, only to be caught and held again. The whole river trembled and shivered with light. Glints, gleams, and sparkles danced across it while the water rustled, swirled, chattered, and bubbled.
        - id: ch01-b17
          speaker: narrator
          text: Mole was enchanted. He fell completely under the River's spell. He trotted beside it like a very small child following a grown-up who knows one exciting story after another. At last, when he grew tired, he sat down on the bank. Still the River talked to him. Its endless babble seemed to carry the best stories in the world from the heart of the earth, all the way toward the sea that could never hear enough.
        - id: ch01-b18
          speaker: narrator
          text: As Mole sat looking across the water, he noticed a dark hole in the opposite bank, just above the River's edge. Dreamily, he decided it would make a snug little home for an animal with simple needs. It stood above the floods and far from noise and dust. Deep inside, something small and bright twinkled, vanished, and twinkled again like a tiny star. But a star would never be hiding in such a place, and the light was too small and sharp for a glowworm. Then it winked at him. It was an eye. Slowly, a face seemed to grow around it like a frame around a picture.
        - id: ch01-b19
          speaker: narrator
          text: A small brown face with whiskers. A serious round face, with laughter still shining in that eye. Neat little ears and thick, silky hair. It was the Water Rat.
        - id: ch01-b20
          speaker: narrator
          text: The two animals stood looking carefully at each other.
        - id: ch01-b21
          speaker: water_rat
          text: Hello there, Mole!
        - id: ch01-b22
          speaker: mole
          text: Hello, Rat!
        - id: ch01-b23
          speaker: water_rat
          text: Would you like to come across?
        - id: ch01-b24
          speaker: mole
          text: Easy for you to say!
        - id: ch01-b25
          speaker: narrator
          text: Mole sounded a little cross, but only because rivers and their ways were new to him. Rat did not answer. He bent down, untied a rope, and pulled. Then he stepped into a little boat Mole had not noticed. Blue on the outside and white within, it was exactly the right size for two animals. Mole loved it at once, though he did not yet understand what one did with it.
        - id: ch01-b26
          speaker: narrator
          text: Rat rowed neatly across and tied up at Mole's bank. As Mole edged down with great care, Rat held out a paw.
        - id: ch01-b27
          speaker: water_rat
          text: Put your weight on my paw. There you go. Quick step now!
        - id: ch01-b28
          speaker: narrator
          text: To his amazement and delight, Mole found himself sitting in the stern of a real boat. Rat pushed away from the bank and took up the oars again.
        - id: ch01-b29
          speaker: mole
          text: What an incredible day! You know, I have never been in a boat in my whole life.
          emotion: happy
        - id: ch01-b30
          speaker: water_rat
          text: What? Never? You've never been in a boat? Then what have you been doing all this time?
          emotion: surprised
        - id: ch01-b31
          speaker: mole
          text: Is it really as wonderful as that?
        - id: ch01-b32
          speaker: narrator
          text: Mole was ready to believe it. He leaned back, admiring the cushions, oars, oarlocks, and every other fascinating fitting while the boat rocked gently beneath him.
        - id: ch01-b33
          speaker: water_rat
          text: Wonderful? It is the only thing. Believe me, my friend, nothing else is half as worthwhile as simply messing around in boats. Just messing... around... in boats. Messing—
        - id: ch01-b34
          speaker: mole
          text: Look where you're going, Rat!
          emotion: fearful
        - id: ch01-b35
          speaker: narrator
          text: Too late. The boat struck the bank head-on. Rat landed on his back in the bottom with his heels in the air. He got up with a cheerful laugh.
        - id: ch01-b36
          speaker: water_rat
          text: As I was saying, messing around in boats, or with boats. In them or out of them, it makes no difference. Nothing really matters, and that's the beauty of it. Maybe you manage to set out, and maybe you don't. Maybe you reach the place you meant to go, or some other place entirely, or nowhere at all. You stay busy the whole time without ever doing anything in particular. And when you're finished, there is always something else waiting to be done. You can do it if you like, though you're usually much better off leaving it alone. Say, if you truly have no other plans this morning, why don't we go down the River together and make a long day of it?
        - id: ch01-b37
          speaker: narrator
          text: Mole wiggled his toes with happiness. He filled his chest with one long, satisfied breath and sank into the soft cushions.
        - id: ch01-b38
          speaker: mole
          text: What a day this is! Let's go right now!
          emotion: happy
        - id: ch01-b39
          speaker: water_rat
          text: Give me one minute first!
        - id: ch01-b40
          speaker: narrator
          text: Rat tied the boat to a ring at his landing, climbed into his home, and soon came back staggering beneath a large wicker picnic basket. He passed it down to Mole.
        - id: ch01-b41
          speaker: water_rat
          text: Tuck that under your feet.
        - id: ch01-b42
          speaker: narrator
          text: Then he untied the rope and began rowing again.
        - id: ch01-b43
          speaker: mole
          text: What's in the basket?
        - id: ch01-b44
          speaker: narrator
          text: Mole could hardly sit still for wondering.
        - id: ch01-b45
          speaker: water_rat
          text: Cold chicken. And cold tongue, cold ham, cold beef, pickled gherkins, salad, French rolls, cress sandwiches, potted meat, ginger beer, lemonade, soda water—
        - id: ch01-b46
          speaker: mole
          text: Oh, stop! Please stop! It's all too much!
          emotion: happy
        - id: ch01-b47
          speaker: water_rat
          text: You really think so? That's only what I bring on a short outing. The other animals always say I'm stingy and barely pack enough!
        - id: ch01-b48
          speaker: narrator
          text: Mole did not hear another word. The new life opening before him had taken over every thought. He was dizzy with the sparkle and ripple of the water, the fresh smells, the changing sounds, and the warm sunlight. With one paw trailing in the River, he drifted through long waking dreams. Rat was a good friend and understood exactly how he felt. He kept the boat moving with one steady stroke after another and took care not to disturb him.
        - id: ch01-b49
          speaker: water_rat
          text: I really like your clothes, old fellow. Someday, when I can afford it, I'll get myself a black velvet smoking suit.
        - id: ch01-b50
          speaker: narrator
          text: Nearly half an hour had passed. Mole pulled his thoughts back with an effort.
        - id: ch01-b51
          speaker: mole
          text: I'm sorry. You must think I'm terribly rude. Everything is so new to me. So... this is a river!
        - id: ch01-b52
          speaker: water_rat
          text: The River.
        - id: ch01-b53
          speaker: mole
          text: And you really live beside it? What a marvelous life!
          emotion: happy
        - id: ch01-b54
          speaker: water_rat
          text: Beside it, with it, on it, and in it. It's my brother and sister, all my aunts, and all the company I need. It gives me food and drink, and of course it gives me somewhere to wash. The River is my whole world, and I don't want another one. If it hasn't got something, that thing isn't worth having. If the River doesn't know it, it isn't worth knowing. Oh, the times we've had together! Winter, summer, spring, or fall, there is always some new fun or excitement.
        - id: ch01-b55
          speaker: water_rat
          text: In February, floods fill my cellar and basement with more water than I could ever use, and the brown current runs past my best bedroom window. Later, the water drops and leaves muddy patches that smell like plum cake. Rushes and weeds block the channels. Then I can wander over most of the riverbed without wetting my feet, finding fresh things to eat and whatever careless people have dropped from their boats.
        - id: ch01-b56
          speaker: mole
          text: But don't you ever get lonely? Just you and the River, with no one else to talk to?
        - id: ch01-b57
          speaker: water_rat
          text: No one else? Well, I shouldn't blame you. You're new here, so naturally you don't know. These days the bank is so crowded that plenty of animals are moving away. It isn't what it used to be. Otters, kingfishers, dabchicks, moorhens—they're around all day, and they always want you to do something. You'd think a fellow had no work of his own!
        - id: ch01-b58
          speaker: mole
          text: What's over there?
        - id: ch01-b59
          speaker: narrator
          text: Mole pointed toward the dark line of trees beyond the water meadows on one side of the river.
        - id: ch01-b60
          speaker: water_rat
          text: That? Just the Wild Wood. We River Bank animals don't go there much.
        - id: ch01-b61
          speaker: mole
          text: Are the animals there... not very nice?
          emotion: fearful
        - id: ch01-b62
          speaker: water_rat
          text: Well, let's see. The squirrels are all right. Some of the rabbits are, too, but rabbits are a mixed bunch. And then there's Badger. He lives right in the middle of the wood and wouldn't move anywhere else for any amount of money. Dear old Badger! Nobody bothers him. They know better.
        - id: ch01-b63
          speaker: mole
          text: Who would even try to bother him?
        - id: ch01-b64
          speaker: water_rat
          text: There are... others, of course. Weasels, stoats, foxes, and that sort. They're all right in their way. I'm friendly with them. We say hello when we meet. But sometimes they get out of hand. You can't truly trust them. That's the plain truth.
        - id: ch01-b65
          speaker: narrator
          text: Mole knew it was bad animal manners to talk about possible trouble before it arrived, so he changed the subject.
        - id: ch01-b66
          speaker: mole
          text: And what comes after the Wild Wood? Out where everything looks blue and hazy? Those might be hills, or maybe they aren't. And is that smoke from a town, or only drifting clouds?
        - id: ch01-b67
          speaker: water_rat
          text: After the Wild Wood comes the Wide World. It has nothing to do with either of us. I've never been there, and I'm never going. Neither will you, if you have any sense. Please don't mention it again. Now, here's the backwater where we'll have lunch.
        - id: ch01-b68
          speaker: narrator
          text: They left the main stream and entered what first looked like a small lake closed in by land. Green grass sloped down to the water on both sides. Under the quiet surface, smooth brown tree roots twisted like snakes. Ahead of them, silver water curled over a weir and tumbled into white foam. Beside it, a restless mill wheel dripped and turned. The wheel seemed to hold up a gray-gabled mill house above it. A low, muffled murmur filled the air, soft and soothing, and every so often a small clear note spoke cheerfully through it. The place was so beautiful that Mole could only lift both front paws and gasp.
        - id: ch01-b69
          speaker: mole
          text: Oh my! Oh my! Oh my!
          emotion: surprised
        - id: ch01-b70
          speaker: narrator
          text: Rat brought the boat alongside the bank and tied it. He helped the still-unsteady Mole ashore, then swung out the basket. Mole begged to unpack it himself. Rat gladly stretched full-length on the grass while his excited friend shook out the tablecloth. Mole opened every mysterious package and arranged the food, greeting each new discovery with another delighted cry.
        - id: ch01-b71
          speaker: water_rat
          text: All right, old fellow. Dig in!
        - id: ch01-b72
          speaker: narrator
          text: Mole needed no encouragement. He had started cleaning very early without stopping to eat or drink, and that morning now felt several days away. After they had quieted their hunger, Mole finally looked beyond the tablecloth. Rat noticed.
        - id: ch01-b73
          speaker: water_rat
          text: What are you watching?
        - id: ch01-b74
          speaker: mole
          text: There's a trail of bubbles moving across the water. It looks rather funny.
        - id: ch01-b75
          speaker: water_rat
          text: Bubbles? Well, well!
        - id: ch01-b76
          speaker: narrator
          text: Rat gave a bright, inviting chirrup. A wide, shining muzzle rose above the bank. Otter pulled himself out and shook the water from his coat.
        - id: ch01-b77
          speaker: otter
          text: You greedy rascals! Why didn't you invite me, Ratty?
        - id: ch01-b78
          speaker: narrator
          text: He headed straight for the food.
        - id: ch01-b79
          speaker: water_rat
          text: We didn't plan this. Oh, and meet my friend, Mr. Mole.
        - id: ch01-b80
          speaker: otter
          text: Very glad to meet you.
        - id: ch01-b81
          speaker: narrator
          text: At once, Mole and Otter were friends.
        - id: ch01-b82
          speaker: otter
          text: What a commotion everywhere! The whole world seems to be on the river today. I came up this backwater hoping for one quiet minute, and then I ran into you two! I mean—sorry. That didn't come out quite right.
        - id: ch01-b83
          speaker: narrator
          text: Behind them came a rustle from a hedge still thick with last year's leaves. A striped head appeared, with a pair of high shoulders behind it.
        - id: ch01-b84
          speaker: water_rat
          text: Come join us, old Badger!
        - id: ch01-b85
          speaker: narrator
          text: Badger came forward a step or two.
        - id: ch01-b86
          speaker: badger
          text: Hmm. Company.
        - id: ch01-b87
          speaker: narrator
          text: He turned around and vanished.
        - id: ch01-b88
          speaker: water_rat
          text: That's Badger for you! He simply can't stand company. We won't see him again today. So, Otter, who else is out on the river?
        - id: ch01-b89
          speaker: otter
          text: Toad, for one. He's in a brand-new racing boat, wearing brand-new clothes. Everything is new!
        - id: ch01-b90
          speaker: narrator
          text: Rat and Otter looked at each other and laughed.
        - id: ch01-b91
          speaker: water_rat
          text: First he cared about nothing but sailing. Then he got tired of that and started punting. He had to punt all day, every day, though he made a complete mess of it. Last year it was houseboats. He made us all stay aboard and pretend we enjoyed ourselves. He swore he'd live on a houseboat forever. Whatever he takes up, it's always the same. He loses interest and rushes after something new.
        - id: ch01-b92
          speaker: otter
          text: He's a good fellow, too. He just can't stay steady—especially when he's in a boat!
        - id: ch01-b93
          speaker: narrator
          text: Across the island, they could see a strip of the main river. A racing boat flashed past. The rower was short and stout, splashing wildly and rocking from side to side, though he worked as hard as he could. It was Toad. Rat stood and called to him, but Toad only shook his head and bent sternly to the oars.
        - id: ch01-b94
          speaker: water_rat
          text: If he keeps rocking like that, he'll be in the river in another minute.
        - id: ch01-b95
          speaker: otter
          text: Of course he will! Did I ever tell you the one about Toad and the lockkeeper? Here is what happened. Toad—
        - id: ch01-b96
          speaker: narrator
          text: A young mayfly wobbled across the current in the reckless way of a mayfly out seeing the world. The water swirled. Cloop! The mayfly disappeared.
        - id: ch01-b97
          speaker: narrator
          text: So did Otter. His voice still seemed to hang in the air, but the patch of grass where he had been lying was empty. No Otter could be seen anywhere. Only a new trail of bubbles crossed the river.
        - id: ch01-b98
          speaker: narrator
          text: Rat hummed to himself. Mole remembered that animal manners did not allow anyone to mention the sudden disappearance of a friend, no matter when it happened or why.
        - id: ch01-b99
          speaker: water_rat
          text: Well, I suppose we should be going. Now, which one of us ought to pack the picnic basket?
        - id: ch01-b100
          speaker: narrator
          text: Rat did not sound eager for the honor.
        - id: ch01-b101
          speaker: mole
          text: Oh, please let me do it!
        - id: ch01-b102
          speaker: narrator
          text: So of course Rat let him. Packing a picnic basket was not nearly as pleasant as unpacking one. It never is. Still, Mole was determined to enjoy every part of the day. He fitted everything inside, closed the basket, and pulled the straps tight. Then he saw a plate staring up at him from the grass. He opened the basket and did the whole job again. This time Rat pointed out a fork lying where anybody should have seen it. Mole unpacked and repacked everything once more. Last came the mustard pot. Mole had been sitting on it the entire time without knowing it. Somehow, and with only a little loss of patience, the basket was finally ready.
        - id: ch01-b103
          speaker: narrator
          text: The afternoon sun was sinking low as Rat gently rowed them homeward. He had fallen into a dreamy mood. He murmured bits of poetry to himself and paid very little attention to Mole. Mole, meanwhile, was full of lunch, pride, and satisfaction. In his own mind, he was already completely at home in a boat. That confidence, along with having nothing to do, soon made him restless.
        - id: ch01-b104
          speaker: mole
          text: Ratty, please! I want to row now!
        - id: ch01-b105
          speaker: narrator
          text: Rat smiled and shook his head.
        - id: ch01-b106
          speaker: water_rat
          text: Not yet, my friend. Wait until you've had a few lessons. It isn't as easy as it looks.
        - id: ch01-b107
          speaker: narrator
          text: Mole sat quietly for a minute or two. But the longer he watched Rat pull the oars with such easy strength, the more jealous he became. His pride told him he could row just as well. Suddenly, Mole jumped up and grabbed the oars. Rat had been gazing across the water and murmuring more poetry. The surprise knocked him backward from his seat, legs in the air for the second time that day. Mole took his place in triumph and gripped the oars with perfect confidence.
        - id: ch01-b108
          speaker: water_rat
          text: Stop that, you silly fool! You don't know how! You'll tip us over!
          emotion: fearful
        - id: ch01-b109
          speaker: narrator
          text: Mole swept the oars backward with a flourish and dug for the water. He missed it completely. His legs flew over his head, and he landed on top of Rat. Frightened now, Mole grabbed for the side of the boat. The very next moment—sploosh!
        - id: ch01-b110
          speaker: narrator
          text: The boat rolled over, and Mole was fighting in the river. The water was shockingly cold and felt more terribly wet than Mole had ever imagined water could feel. It sang and roared in his ears as he sank down, down, down. Then he struggled back to the surface, coughing and sputtering. The sun above him had never looked so bright or so welcome. But almost at once he felt himself sinking again, and everything seemed black with despair.
        - id: ch01-b111
          speaker: narrator
          text: A firm paw caught the back of his neck. It was Rat, and Rat was laughing. Mole could feel the laughter run along Rat's arm, through his paw, and straight into Mole's neck.
        - id: ch01-b112
          speaker: narrator
          text: Rat found one of the oars and slid it under one of Mole's arms. Then he found the other oar and wedged it beneath Mole's other arm, so his friend could stay afloat. Rat swam behind him and pushed the helpless creature all the way to shore. Once they reached the bank, Rat hauled Mole out of the water and set him down on the grass. Mole sat there like a soft, soggy, shapeless heap of misery.
        - id: ch01-b113
          speaker: narrator
          text: Rat rubbed him down and squeezed out some of the water.
        - id: ch01-b114
          speaker: water_rat
          text: All right, old fellow. Run up and down the towpath as fast as you can until you're warm and dry. I'll dive for the picnic basket.
        - id: ch01-b115
          speaker: narrator
          text: Poor Mole was soaked on the outside and burning with shame within. He trotted hard up and down the path until he was nearly dry. All the while, Rat worked in the River. He plunged back in, recovered the overturned boat, turned it upright, and tied it safely to the bank. Then, little by little, he gathered every piece of their property that was still floating and brought it ashore. Finally, he took a deep dive, found the picnic basket on the bottom, and struggled back to land with it.
        - id: ch01-b116
          speaker: narrator
          text: When everything was ready, Mole climbed limply into the stern. The boat moved off, and he spoke in a low voice that kept breaking with emotion.
        - id: ch01-b117
          speaker: mole
          text: Ratty, you've been so generous to me. I'm truly sorry for acting like such an ungrateful fool. I can hardly bear to think that I might have lost that beautiful picnic basket. I behaved like a complete idiot, and I know it. Could you forgive me just this once? Could we go on the way we were before?
          emotion: sad
        - id: ch01-b118
          speaker: water_rat
          text: Of course we can! A little water never hurt a Water Rat. Most days, I'm in the river more than I'm out of it. Forget all about it. And listen, I think you should stay with me for a while. My place is plain and a bit rough, nothing like Toad's house, though you haven't seen that yet. But I can make you comfortable. I'll teach you to row and swim, and soon you'll handle yourself on the water as well as any of us.
          emotion: calm
        - id: ch01-b119
          speaker: narrator
          text: Rat spoke with such kindness that Mole was too deeply touched to answer. He had to brush away a tear or two with the back of his paw. Rat kindly pretended not to notice and looked off in another direction. Before long, Mole's spirits began to rise again. By the time they passed two moorhens who were quietly snickering at his wet, bedraggled appearance, he had recovered enough to give them a sharp answer.
        - id: ch01-b120
          speaker: narrator
          text: When they reached Rat's home, he built a bright fire in the parlor and settled Mole into an armchair right in front of it. He brought down a robe and slippers to keep his guest warm. Then, until supper was ready, Rat told one river story after another. To an animal who had spent his life beneath the earth, every one of them was thrilling. There were stories about weirs, sudden floods, and great pike leaping from the water. There were steamers that threw hard bottles at small animals. At any rate, the bottles certainly came from steamers, so the steamers were probably to blame.
        - id: ch01-b121
          speaker: narrator
          text: Rat also told him about herons and how carefully they chose whom to speak to. There were adventures in drains, nights spent fishing with Otter, and long trips across the fields with Badger. Supper was wonderfully cheerful. Soon afterward, Mole became so terribly sleepy that his thoughtful host had to lead him upstairs.
        - id: ch01-b122
          speaker: narrator
          text: Rat escorted his terribly sleepy guest upstairs to the best bedroom. There, Mole laid his head on the pillow in perfect peace and contentment. As he settled down to sleep, he knew that outside the window, his new friend the River was lapping softly against the sill.
        - id: ch01-b123
          speaker: narrator
          text: That day was only the first of many like it for the newly freed Mole. As summer ripened and moved onward, each new day seemed longer and packed with interest. Mole learned to swim, and he learned to row. He came to understand the joy of water that was always running onward. Sometimes he pressed an ear against the tall reed stems and caught, for a moment, a little of what the wind was always whispering among them.
