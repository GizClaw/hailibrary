audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm, observant storytelling with gentle humor
        timbre: clear and mellow
        pace: measured
        pitch: medium
    mole:
      display_name: Mole
      tts:
        delivery: earnest, curious, and quick to wonder
        timbre: soft and youthful
        pace: lively
        pitch: medium-high
    water_rat:
      display_name: Water Rat
      tts:
        delivery: friendly, assured, and dryly amused
        timbre: warm and smooth
        pace: easygoing
        pitch: medium
  chapters:
    - id: ch01
      title: The Piper at the Gates of Dawn
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            Hidden in the dark edge of the riverbank, a Willow-Wren twittered his thin little song. It was after ten at night, but the sky still held a few fading traces of daylight. The fierce heat of the cloudless afternoon was breaking apart at last beneath the cool touch of the short midsummer night.
        - id: ch01-b02
          speaker: narrator
          text: >-
            Mole lay stretched out on the bank, still panting after the long, hot day, and waited for his friend. He had spent the day on the river with some companions while Water Rat kept an old engagement with Otter. When Mole came home, the house was dark and empty. Rat was clearly still out with his old friend. It was much too hot indoors, so Mole settled onto some cool dock leaves and thought about the day and how good every part of it had been.
        - id: ch01-b03
          speaker: narrator
          text: >-
            Before long, Rat's light footsteps came over the dry grass. He sat down and looked thoughtfully into the river. He seemed far away in his thoughts.
        - id: ch01-b04
          speaker: water_rat
          text: >-
            Oh, this cool air is wonderful.
        - id: ch01-b05
          speaker: mole
          text: >-
            You stayed for supper, didn't you?
        - id: ch01-b06
          speaker: water_rat
          text: >-
            I had to. They wouldn't let me leave before supper. You know how kind they are. They did everything they could to keep things cheerful until the moment I left. But I felt awful the whole time. They were very unhappy, though they tried not to show it. Mole, I think they're in real trouble. Little Portly has disappeared again. His father cares so much about him, even if he doesn't say much.
        - id: ch01-b07
          speaker: mole
          text: >-
            Portly? Why worry? He's always wandering off, getting lost, and then turning up again. He loves an adventure, but nothing bad ever happens to him. Every animal around here knows him and likes him, just as they like old Otter. Someone is sure to find him and bring him home. Why, we've found him ourselves, miles away, perfectly calm and cheerful.
        - id: ch01-b08
          speaker: water_rat
          text: >-
            This time is worse. He's been gone for several days. The Otters have searched everywhere and found no sign of him. They've asked every animal for miles around, and nobody knows a thing. Otter is far more worried than he'll admit. Portly still isn't a strong swimmer, and I can tell Otter keeps thinking about the weir. There's a lot of water coming down for this time of year, and Portly has always been drawn to that place. Then there are traps and other dangers. You know what I mean. Otter wouldn't worry too soon about any son of his. But now he is worried.
        - id: ch01-b09
          speaker: water_rat
          text: >-
            When I left, he walked out with me. He said he needed air and wanted to stretch his legs, but I knew that wasn't the reason. I kept asking until he finally told me. He means to spend the whole night watching beside the ford. You know the spot where the old ford used to be, before they built the bridge?
        - id: ch01-b10
          speaker: mole
          text: >-
            I know it well. But why would he wait there?
        - id: ch01-b11
          speaker: water_rat
          text: >-
            That's where Otter gave Portly his first swimming lesson, on the shallow gravel near the bank. He taught him to fish there too, and Portly caught his very first fish there. He was so proud of it. The little fellow loved that place. Otter thinks that if Portly is wandering back from wherever he is, if the poor child is still anywhere at all, he might head for the ford. Or he might come upon it, remember it, and stop to play. So Otter goes there every night and watches. It's only a chance, you understand. Just a chance.
        - id: ch01-b12
          speaker: narrator
          text: >-
            For a while, neither friend spoke. Both pictured the same thing: lonely, heartsick Otter crouched beside the ford, watching and waiting through the long night, all for that one chance.
        - id: ch01-b13
          speaker: water_rat
          text: >-
            Well, I suppose we ought to turn in.
        - id: ch01-b14
          speaker: narrator
          text: >-
            But Rat made no move to get up.
        - id: ch01-b15
          speaker: mole
          text: >-
            Rat, I can't go inside and sleep while we do nothing. Maybe there isn't much we can do, but let's take the boat upstream. The moon will rise in an hour or so, and then we can search as well as we can. Anything is better than going to bed and doing nothing.
        - id: ch01-b16
          speaker: water_rat
          text: >-
            That's exactly what I was thinking. It isn't a night for bed anyway. Dawn isn't far off, and once it comes, we may hear something from the early risers along the river.
        - id: ch01-b17
          speaker: narrator
          text: >-
            They brought out the boat, and Rat took the oars. He paddled carefully. A narrow strip in midstream faintly reflected the sky, but the shadows cast by every bank, bush, and tree looked as solid as the banks themselves. Mole had to steer with great care.
        - id: ch01-b18
          speaker: narrator
          text: >-
            The river looked dark and deserted, yet the night was full of tiny sounds. There were songs, calls, whispers, and rustles from the busy little creatures still awake and busy at their trades. They would keep working through the night until sunlight sent them away to their well-earned rest. The water had a voice of its own, much easier to hear now than by day. Its gurgles and sudden plops came unexpectedly and seemed close enough to touch. Again and again the friends started at some sharp sound that seemed to be a clear voice calling actual words to them.
        - id: ch01-b19
          speaker: narrator
          text: >-
            The horizon made a hard, clear line against the sky. In one place it stood black before a silvery glow that slowly climbed higher. At last the moon rose over the edge of the waiting earth. It lifted with quiet majesty, swung free of the horizon, and sailed on above them.
        - id: ch01-b20
          speaker: narrator
          text: >-
            Now they could see solid shapes and open spaces again. Broad meadows spread away from them. Gardens lay quiet, and the river showed itself from bank to bank. Moonlight softly revealed them all. The fear and mystery had been washed clean away. Everything shone almost as it did by day, yet the difference was tremendous. Their familiar places seemed to have slipped away, dressed themselves in pure new clothes, and returned with shy smiles. They waited quietly to see whether the friends would recognize them under that silver clothing.
        - id: ch01-b21
          speaker: narrator
          text: >-
            They tied the boat to a willow and stepped into that silent silver kingdom. Patiently they searched the hedges and hollow trees. They looked through the little streams and the pipes that carried them, then checked the ditches and dry channels. They returned to the boat, crossed the river, and began again on the other side. In this way they worked steadily upstream. High in the cloudless sky, the calm, distant moon gave them all the help she could. At last her own hour was over. She seemed reluctant to leave, but she sank toward the earth, and mystery took possession of field and river once more.
        - id: ch01-b22
          speaker: narrator
          text: >-
            Slowly, things began to change. The horizon grew clearer. Fields and trees came back into view, but with a new look, and the night's mystery started to fall away. A bird suddenly piped one note and went quiet. A light breeze rose and stirred the reeds and bulrushes.
        - id: ch01-b23
          speaker: narrator
          text: >-
            Rat sat in the stern while Mole rowed. All at once Rat straightened and listened with fierce attention. Mole kept the boat moving with gentle strokes while he searched the banks, and he glanced at his friend in surprise.
        - id: ch01-b24
          speaker: water_rat
          text: >-
            It's gone. It was so beautiful, so strange, so new. If it had to end that quickly, I almost wish I'd never heard it. Now it has left an ache in me. Nothing seems worth doing except hearing that sound once more and listening forever. No! There it is again!
        - id: ch01-b25
          speaker: narrator
          text: >-
            Rat leaned forward, alert again. For a long while he said nothing. He sat caught by the sound, as if under a spell.
        - id: ch01-b26
          speaker: water_rat
          text: >-
            Now it's moving away. I'm starting to lose it. Oh, Mole, it's beautiful! There's a bubbling joy in it, and a thin, clear, happy call in that far-off piping. I never imagined music like this. And the call inside it is even stronger than the music is sweet. Row, Mole, row! That music is calling us.
        - id: ch01-b27
          speaker: narrator
          text: >-
            Mole obeyed, though he was completely puzzled.
        - id: ch01-b28
          speaker: mole
          text: >-
            I don't hear anything except the wind moving through the reeds, rushes, and willows.
        - id: ch01-b29
          speaker: narrator
          text: >-
            Rat did not answer. Perhaps he never heard. He was trembling, carried away by this new and wonderful thing. It held every one of his senses. His helpless soul seemed like a happy child, lifted and rocked in strong, safe arms.
        - id: ch01-b30
          speaker: narrator
          text: >-
            Mole rowed steadily on. Soon the river divided, and a long backwater opened to one side. Rat had let the rudder lines fall. With one small movement of his head, he showed Mole which way to go. The tide of morning light kept rising, until they could make out the colors of the flowers along the water's edge.
        - id: ch01-b31
          speaker: water_rat
          text: >-
            It's clearer now, and closer! You must hear it this time. Ah, yes. At last. I can see that you do!
          emotion: happy
        - id: ch01-b32
          speaker: narrator
          text: >-
            Mole stopped rowing. The flowing notes of the joyful pipes broke over him like a wave. They swept him up and filled him completely. He saw tears on Rat's cheeks, bowed his head, and understood.
        - id: ch01-b33
          speaker: narrator
          text: >-
            For a little while the boat hung beside the bank, brushing against purple loosestrife. Then the clear command within the dazzling music took hold of Mole. Without thinking, he bent to the oars again. The light grew stronger and stronger, but no birds sang their usual dawn songs. Apart from that heavenly music, the whole world was wonderfully still.
        - id: ch01-b34
          speaker: narrator
          text: >-
            As they glided on, the rich meadow grass on both sides looked greener and fresher than anything they had ever seen. They had passed this way before, yet they had never noticed the roses shining with such vivid color. The willowherb had never grown so wildly, and the sweet scent of meadowsweet had never filled the air like this. Then the murmur of the weir ahead began to take hold of every part of the morning. Both friends felt that they were drawing close to the end of their journey, whatever that end might be. Something was surely waiting for them there.
        - id: ch01-b35
          speaker: narrator
          text: >-
            The great weir stretched across the backwater in a wide half circle. Foam, flashes of light, and green shoulders of water rolled over it. Swirling currents and long streaks of foam disturbed the quiet surface, and the weir's deep, soothing rumble covered every other sound.
        - id: ch01-b36
          speaker: narrator
          text: >-
            In the middle of the stream, held within the shining curve of the weir, lay a small island. Willow, silver birch, and alder crowded its edge. The island seemed shy and private, yet full of meaning. It kept whatever it held behind a leafy curtain until the right hour came, and with it, those who had been called.
        - id: ch01-b37
          speaker: narrator
          text: >-
            The two animals moved through the broken, churning water. They went slowly, but neither doubted nor hesitated. A solemn hope had settled over them. They tied the boat at the island's flowery edge, stepped ashore without speaking, and pushed through blossoms, sweet-smelling plants, and thick undergrowth.
        - id: ch01-b38
          speaker: narrator
          text: >-
            At last they reached a small lawn of marvelous green. Around it grew a wild orchard of crab apple, cherry, and blackthorn trees.
        - id: ch01-b39
          speaker: water_rat
          text: >-
            This is the place from my dream of music. This is the place the song showed me. Here, in this holy place, if anywhere, we will surely find Him.
        - id: ch01-b40
          speaker: narrator
          text: >-
            Rat spoke in a whisper, as though he were dreaming. Then a great awe fell upon Mole. His muscles turned weak. His head bowed, and his feet seemed rooted to the earth. It was not panicked fear. He felt wonderfully peaceful and happy. Yet the awe struck him and held him fast. Without seeing anything, he knew that a mighty Presence was very near.
        - id: ch01-b41
          speaker: narrator
          text: >-
            With an effort, Mole turned toward his friend. Rat stood beside him, overcome and shaking hard. The branches all around them were usually alive with birds, but now not one made a sound. Still the light grew.
        - id: ch01-b42
          speaker: narrator
          text: >-
            Mole might never have dared to look up. The piping had stopped, but its command still ruled him. He could not refuse it, even if Death waited to strike the instant his mortal eyes saw what should remain hidden. Trembling, he obeyed. He lifted his humble head.
        - id: ch01-b43
          speaker: narrator
          text: >-
            Dawn was almost there, and the air had grown perfectly clear. Nature glowed with unbelievable color and seemed to hold her breath. Mole looked straight into the eyes of the Friend and Helper.
        - id: ch01-b44
          speaker: narrator
          text: >-
            He saw curved horns sweeping backward and shining in the growing daylight. Beneath them was a stern, hooked nose, and on either side were kind eyes looking down at them with humor. A half smile touched the corners of a bearded mouth. He saw muscles ripple along the arm that rested across a broad chest. A long, graceful hand still held the panpipes, only just lowered from the parted lips that had played them.
        - id: ch01-b45
          speaker: narrator
          text: >-
            He saw the splendid curves of shaggy limbs resting at ease upon the grass. Then, last of all, he saw a small, round child nestled between those very hooves. Baby Portly was sleeping soundly, completely safe and content.
        - id: ch01-b46
          speaker: narrator
          text: >-
            Mole saw it all for one breathless moment, sharp against the morning sky. He looked, and still he lived. He lived, and still he wondered.
        - id: ch01-b47
          speaker: mole
          text: >-
            Rat, are you afraid?
          emotion: fearful
        - id: ch01-b48
          speaker: water_rat
          text: >-
            Afraid? Afraid of Him? Oh, never. Never! And yet... and yet... oh, Mole, I am afraid!
          emotion: fearful
        - id: ch01-b49
          speaker: narrator
          text: >-
            The two animals crouched to the earth, bowed their heads, and worshiped.
        - id: ch01-b50
          speaker: narrator
          text: >-
            Suddenly the broad golden sun rose before them in magnificence. Its first rays shot across the level water meadows and struck them full in the eyes. They were dazzled. When they could look again, the Vision was gone. The air rang with birds singing their welcome to the dawn.
        - id: ch01-b51
          speaker: narrator
          text: >-
            Rat and Mole stared blankly ahead. They could not speak. Their misery deepened as they slowly understood the wonder they had seen and the loss that had followed it. Then a playful little breeze danced up from the surface of the water. It tossed the aspen leaves and made them tremble. It shook the dew-covered roses, then blew lightly across the friends' faces and touched them as gently as a caress. With that soft touch came instant and complete forgetfulness.
        - id: ch01-b52
          speaker: narrator
          text: >-
            This was the last and best gift of the kindly demigod. He gave it to those who saw him while he was helping them. Otherwise, the terrible wonder of the memory might grow until it darkened every ordinary happiness. It might haunt the little animals he had saved and spoil all their later lives. So he let them forget, and they could be happy and lighthearted again.
        - id: ch01-b53
          speaker: narrator
          text: >-
            Mole rubbed his eyes and stared at Rat. Rat was looking around in confusion.
        - id: ch01-b54
          speaker: mole
          text: >-
            I'm sorry, Rat. What did you say?
        - id: ch01-b55
          speaker: water_rat
          text: >-
            I think I was saying that this is exactly the kind of place where we might find him. And look! There he is! The little fellow!
          emotion: happy
        - id: ch01-b56
          speaker: narrator
          text: >-
            Rat cried out with delight and ran toward the sleeping Portly.
        - id: ch01-b57
          speaker: narrator
          text: >-
            Mole stayed where he was for another moment, lost in thought. He felt like someone waking suddenly from a beautiful dream and struggling to remember it. Only a dim sense of its beauty remained. Then even that faded, and Mole sadly accepted the cold, hard world of waking. He shook his head and followed Rat.
        - id: ch01-b58
          speaker: narrator
          text: >-
            Portly woke with a joyful squeak. He wriggled with pleasure when he saw his father's friends, who had played with him so often. But a moment later his face went blank. With a pleading whine, he began searching all around him.
        - id: ch01-b59
          speaker: narrator
          text: >-
            He was like a child who falls happily asleep in a nurse's arms, then wakes alone in a strange place. Such a child searches corners and cupboards and runs from room to room while silent despair grows inside. In just that way, Portly searched the island. He would not stop and would not tire. At last the dark moment came when he had to give up. He sat down and cried bitterly.
        - id: ch01-b60
          speaker: narrator
          text: >-
            Mole hurried over to comfort him. Rat stayed behind. He gazed for a long time at several deep hoofprints in the grass, uncertain and thoughtful.
        - id: ch01-b61
          speaker: water_rat
          text: >-
            Some great animal has been here.
        - id: ch01-b62
          speaker: narrator
          text: >-
            Rat stood there thinking and thinking, with something strange stirring in his mind.
        - id: ch01-b63
          speaker: mole
          text: >-
            Come on, Rat! Remember poor Otter, still waiting by the ford!
        - id: ch01-b64
          speaker: narrator
          text: >-
            Portly was soon comforted by the promise of a special treat: a trip on the river in Mr. Rat's real boat. Mole and Rat led him to the water and settled him safely between them in the bottom. Then they paddled away down the backwater.
        - id: ch01-b65
          speaker: narrator
          text: >-
            The sun was fully up by now, and its heat beat down on the boat. Birds sang with all their strength and without the strange restraint of that earlier dawn. Flowers smiled and nodded from both banks as the three animals passed. Yet somehow the whole bright river seemed less rich. Its colors did not have the same blaze that Rat and Mole half remembered seeing somewhere very recently. They both wondered where that could have been, but neither could find the answer.
        - id: ch01-b66
          speaker: narrator
          text: >-
            When they reached the main river, they turned upstream toward the place where Otter kept his lonely watch. Near the familiar ford, Mole guided the boat to the bank. They lifted Portly out, stood him on the towpath, told him where to go, and gave him a friendly pat on the back. Then they pushed out into the middle of the river.
        - id: ch01-b67
          speaker: narrator
          text: >-
            They watched the little otter waddle importantly along the path. Suddenly his muzzle lifted. His clumsy waddle broke into a run. He hurried forward with shrill whines, his whole body wriggling because he knew someone ahead.
        - id: ch01-b68
          speaker: narrator
          text: >-
            Up the river, Otter sprang from the shallow water where he had waited in silent patience. He went tense and still for one instant. Then he gave an amazed, joyful bark and bounded through the willows onto the path.
        - id: ch01-b69
          speaker: narrator
          text: >-
            Mole pulled hard on one oar and swung the boat around. Their search had ended happily. He let the full current catch them and carry them wherever it wished.
        - id: ch01-b70
          speaker: mole
          text: >-
            I feel strangely tired, Rat. You might say it's because we stayed up all night, but that can't be it. We do that half the nights of the week at this time of year. No, I feel as though I've just been through something terribly exciting and a little frightening. It feels as if it only just ended. But nothing special has happened.
        - id: ch01-b71
          speaker: water_rat
          text: >-
            Or maybe it was something surprising and glorious and beautiful. I feel exactly the same, Mole. I'm completely worn out, but not in my body. Good thing the current can carry us home. Doesn't the sun feel wonderful, soaking right into your bones? And listen to the wind in the reeds.
        - id: ch01-b72
          speaker: mole
          text: >-
            It sounds like music. Music from very far away.
        - id: ch01-b73
          speaker: narrator
          text: >-
            Mole's head began to nod. Rat leaned back too. He was dreamy and tired.
        - id: ch01-b74
          speaker: water_rat
          text: >-
            I thought so too. It's dance music, the lilting kind that keeps running on. But there are words in it as well. One moment it becomes words, and I catch a few. Then it's only dancing music again. Then all I hear is the soft, thin whisper of the reeds.
        - id: ch01-b75
          speaker: mole
          text: >-
            Your ears are better than mine. I can't make out any words.
          emotion: sad
        - id: ch01-b76
          speaker: water_rat
          text: >-
            I'll try to pass them on. The words are coming again now, faint but clear. Lest the awe should dwell and turn your frolic to fret, you shall look on my power at the helping hour, but then you shall forget! Now the reeds are taking it up. Forget, forget, they sigh. The words fade into a rustle and a whisper. But now the voice is back.
        - id: ch01-b77
          speaker: water_rat
          text: >-
            Lest limbs be reddened and rent, I spring the trap that is set. As I loose the snare, you may glimpse me there, for surely you shall forget! Row closer to the reeds, Mole. Closer! It's hard to hear, and it's growing fainter every moment.
        - id: ch01-b78
          speaker: water_rat
          text: >-
            Helper and healer, I cheer small waifs in the woodland wet. Strays I find in it, wounds I bind in it, bidding them all forget! Closer, Mole, closer! No, it's no use. The song has faded into reed talk.
        - id: ch01-b79
          speaker: mole
          text: >-
            But what do the words mean?
        - id: ch01-b80
          speaker: water_rat
          text: >-
            I don't know. I only gave them to you as they came to me. Ah! Now they're back again, full and clear this time. At last, this is the real thing. There can be no mistake. It's simple, passionate, perfect...
        - id: ch01-b81
          speaker: narrator
          text: >-
            Mole waited for several minutes. He was half asleep in the hot sun.
        - id: ch01-b82
          speaker: mole
          text: >-
            Well, let's hear it, then.
        - id: ch01-b83
          speaker: narrator
          text: >-
            No answer came. Mole looked at Rat and understood the silence. There was a deeply happy smile on Rat's face, and he still seemed to be listening. The weary Water Rat was fast asleep.
