audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖从容，带着含蓄的幽默和讲故事的亲近感
        timbre: 清润沉稳
        pace: 中等偏慢
        pitch: 中
    mole:
      display_name: 鼹鼠
      tts:
        delivery: 真诚热心，偶尔带一点天真的兴奋
        timbre: 温软明亮
        pace: 中等
        pitch: 中高
    rat:
      display_name: 河鼠
      tts:
        delivery: 爽快机敏，朋友间说话自然亲切
        timbre: 清朗温暖
        pace: 中等偏快
        pitch: 中
  chapters:
    - id: ch01
      title: 失踪的小胖墩
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 柳莺藏在河岸黑沉沉的边沿，细细地唱着。夜里已过十点，天空还拽着白昼的一片衣角，留住最后几缕亮光。短暂的仲夏之夜伸出凉凉的手指，白日里那股沉闷的酷热才渐渐散去。这一天从早到晚都没有一片云，酷热压得鼹鼠到这会儿还在喘气。白天，他和几个伙伴去河上玩，河鼠则去赴和水獭早就约好的聚会。鼹鼠回来时，屋里没亮灯，也没有人。他猜河鼠还在老朋友家里热聊。天热得无法进屋，他便躺在岸边的酸模叶上，回想这一天做过的事，觉得件件都好极了，同时等河鼠回家。
        - id: ch01-b02
          speaker: narrator
          text: 不久，焦干的草地上响起轻快的脚步声。河鼠走近了，坐下望着河水，心事重重。
        - id: ch01-b03
          speaker: rat
          text: 啊，总算凉快了！
          emotion: happy
        - id: ch01-b04
          speaker: mole
          text: 你是留在水獭家吃过晚饭才回来的吧？
        - id: ch01-b05
          speaker: rat
          text: 不留都不行。他们说什么也不肯让我早走，临到告辞还想尽办法逗我开心。可我心里一直很不好受。他们分明都在发愁，只是不肯让我看出来。鼹鼠，水獭家恐怕出事了。小胖墩又不见了。他父亲嘴上不说，其实最疼这个孩子。
        - id: ch01-b06
          speaker: mole
          text: 是那个小家伙吗？他总爱跑远，迷了路又自己回来，可从没出过事。这一带谁不认识他，又有谁不喜欢他？准会有什么动物遇见他，再把他平平安安送回去。咱们以前不也在几英里外找到过他吗？那时他又镇定又快活。
        - id: ch01-b07
          speaker: rat
          text: 这回不一样。他已经丢了好几天。水獭一家上上下下、远远近近都找遍了，连一点踪迹都没有。他们还问遍方圆几英里的动物，却没有谁知道消息。老水獭比他肯承认的还要担心。我好不容易才问出来，小胖墩游泳还没学好。老水獭的心里一直想着堰坝。照这个时节来说，这阵子河水还是太多了，可那孩子偏偏一直对堰坝着迷。再说，外面还有捕兽夹之类的东西。老水獭不会还没到时候，就为儿子白白紧张。可他现在真的怕了。
        - id: ch01-b08
          speaker: narrator
          text: 河鼠说，他离开时，水獭也走出家门，只说想透透气，活动一下腿脚。河鼠知道不是那么回事，追问了好久，才听说水獭要独自守在从前的浅滩边。
        - id: ch01-b09
          speaker: mole
          text: 我很熟悉那片浅滩。不过，他为什么要去那儿等？
        - id: ch01-b10
          speaker: rat
          text: 他第一次教小胖墩游泳，就是在岸边那片浅浅的砾石滩。后来教孩子捕鱼，也是在那里。小胖墩捉到生平第一条鱼时，别提多得意了。他最喜欢那个地方。水獭想，万一孩子自己摸索着回来，也许会往熟悉的浅滩走。只要还有一线希望，他就每晚去那里守着。
        - id: ch01-b11
          speaker: narrator
          text: 两个朋友都不说话了。他们想着同一幅景象。那个心都快碎了的父亲，正孤零零地伏在浅滩边，整夜守着，等着，只盼那个万一。
        - id: ch01-b12
          speaker: rat
          text: 好啦，我想咱们也该去睡了。
        - id: ch01-b13
          speaker: narrator
          text: 嘴上这么说，河鼠却一动也没动。
        - id: ch01-b14
          speaker: mole
          text: 河鼠，咱们明知道小胖墩丢了，怎么能回屋睡觉，什么也不做？把船划出去吧。再过一会儿月亮就升起来了，咱们可以一路往上游找。就算找不到，也比躺着不动强。
        - id: ch01-b15
          speaker: rat
          text: 我也正在想这个。这样的夜晚本来就不该睡。离天亮也不远了，到时还能问问沿途早起的动物。
    - id: ch02
      title: 月下的寻觅
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 他们把船推进水里，河鼠拿起船桨，慢慢往前划。河心有一道窄窄的水路，还能隐约映出天空。可只要岸坡、灌木和树枝把影子投在水上，那些黑影就像真正的河岸一样坚实，鼹鼠掌舵时只能处处留心。
        - id: ch02-b02
          speaker: narrator
          text: 夜色很黑，河上也空无一人，耳边却尽是细小的声音。有歌声，有交谈，还有一阵阵穸穸窣窣。这些夜间忙碌的小居民，正趁太阳出来以前做自己的营生。水声也比白天更近，汩汩声、咕咚声忽然响在身边，害得他们一次次以为真有谁在清楚地呼唤。
        - id: ch02-b03
          speaker: narrator
          text: 天边的线条又清晰又冷硬。其中一处黑得格外分明，背后的银色磷光慢慢往上涨，也不断向外铺开。终于，月亮从静候的大地边缘庄严地升起。它缓缓脱离地平线，像一条挣开系缆的船，自由地游向夜空。他们又看得见万物的模样了。广阔的草地、安静的花园，还有从此岸一直展到彼岸的河面，全都柔柔地显现出来。神秘与恐惧被洗净了。它们重新像白天那样明亮，可那又绝不是白天的模样。从前常去的老地方，仿佛曾悄悄离开，换上纯净的新衣，如今又悄悄回来。它们含笑而羞怯地等着，想看两位老朋友还能不能认出自己。
        - id: ch02-b04
          speaker: narrator
          text: 两个朋友把船系在柳树上，踏进这个寂静的银色王国。他们一处一处耐心搜过树篱和空心树，又查看浅浅的小沟、沟下的涵洞、一道道壕沟和早已干涸的水道。接着，他们重新上船，渡到对岸，再用同样的办法一路往上游寻去。无云的天上，月亮安详地高悬着。她虽然离得那么远，也在竭力帮他们搜寻。直到她的时辰过去，才不情愿地沉向大地，把他们留下。神秘也就再一次占据了田野和河流。
        - id: ch02-b05
          speaker: narrator
          text: 可是很快，又一种变化来了。天边渐渐清晰，田野和树木也越来越分明，只是都换了与月下不同的模样。刚刚重新占据它们的神秘正一点点褪去。一只鸟忽然叫了一声，马上又静下来。微风吹起，芦苇和灯心草一起沙沙作响。河鼠坐在船尾，鼹鼠一边察看河岸，一边轻轻划桨，只让小船缓缓往前。这时，河鼠忽然坐直身子，急切地倾听起来。鼹鼠觉得奇怪，不禁朝他望去。
        - id: ch02-b06
          speaker: rat
          text: 消失了！那声音又美，又陌生，还从没听过。可它既然这么快就停了，我倒宁愿自己没听见。它叫我心里生出一股渴望，疼得人难受。仿佛世上再没有别的事值得做，只值得再听它一次，然后永远听下去。不！它又来了！
          emotion: surprised
        - id: ch02-b07
          speaker: narrator
          text: 河鼠像着了迷，很久都没有开口。
        - id: ch02-b08
          speaker: rat
          text: 现在它又往远处去了，我快听不清了。鼹鼠，它多美啊！欢喜像一串快乐的水泡，从远方那细细的、明亮的笛声里涌出来。我从没梦见过这样的音乐。那里面的呼唤，比乐声还要强烈。快划，鼹鼠！那音乐和呼唤一定是为我们来的。
        - id: ch02-b09
          speaker: mole
          text: 我什么都听不见，只听见风从芦苇、灯心草和柳丛间吹过。
        - id: ch02-b10
          speaker: narrator
          text: 河鼠似乎根本没听到。那崭新又神圣的声音占据了他全部的感觉，他浑身发抖，如痴如醉。他的灵魂毫无力量，却快活地躺在一双坚实的臂膀中，像个婴儿似的被轻轻摇着、哄着。
        - id: ch02-b11
          speaker: narrator
          text: 鼹鼠一言不发，只管稳稳划船。前方不久出现一处岔口，长长的回水从河道旁边分了出去。河鼠早已放开舵绳，只轻轻动了一下头，鼹鼠便把船划进回水。曙光像涨潮一样悄悄漫来，水边的花朵已经现出了颜色。
        - id: ch02-b12
          speaker: rat
          text: 又近了，也更清楚了！这一回你肯定听见了。啊，终于！我看得出来，你也听见了！
          emotion: happy
        - id: ch02-b13
          speaker: narrator
          text: 欢快的笛声流过来，如同一道浪打在鼹鼠身上，一下就把他整个卷了进去。他屏住呼吸，定定地停下船桨。看见伙伴脸上的泪水，他低下头，一切都明白了。小船在岸边停了一会儿，滨河生长的紫色珍珠菜轻轻擦过他们。接着，那清亮、不容拒绝的呼唤和醉人的曲调并肩而来，把自己的意志压在鼹鼠心上。他机械般俯下身，重新划起桨来。天光一刻比一刻强，平日黎明将至时总要鸣唱的鸟儿，此刻却一只也没有开口。除了那仿佛来自天上的乐音，四下寂静得不可思议。
    - id: ch03
      title: 小岛上的异象
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 小船一路向前，两旁的草地也从身边缓缓滑过。这个清晨，那些肥美的牧草从未显得这样清新，这样翠绿。他们也从没注意过，玫瑰可以开得这样鲜艳，柳兰可以长得这样蓬勃，绣线菊的香气又可以这样浓郁，仿佛铺满了四周的空气。慢慢地，堰坝的低鸣也占满了天地。他们都意识到，这趟寻觅正接近某个终点。不管那终点是什么，它一定早已等在前方。
        - id: ch03-b02
          speaker: narrator
          text: 巨大的堰坝从此岸一直横到彼岸，把整条回水拦在尽头，弯成一道宽阔的半圆。那半圆由白色泡沫、不住闪动的光点，还有绿水发亮的脊背组成。漩涡和一道道漂浮的白沫在水面旋转，搅乱了原来的平静。庄严而又叫人安心的轰鸣，压住了其他一切声音。河心有一座小岛，正泊在堰坝闪耀着张开的臂弯里。柳树、银桦和赤杨紧紧围着它。小岛显得含蓄又羞怯，却仿佛充满了意义。它把自己所守护的一切藏在帷幕后面，耐心地留存着，只等那一个时辰到来，也等受到召唤、被选中的来客和它一同抵达。
        - id: ch03-b03
          speaker: narrator
          text: 两个动物缓缓穿过破碎翻腾的水流。他们没有一点疑虑，也不曾有片刻迟疑，心里只有一股庄严的期待。小船最后停在小岛开满鲜花的边缘。两个朋友默默上了岸，从花丛、芳香的草木和灌木中一路穿过。前方终于出现一片平地，他们走上去，发现自己站在一方绿得不可思议的小草坪上。四周长着大自然亲手栽下的果树，有野苹果树、野樱桃树，也有黑刺李。
        - id: ch03-b04
          speaker: rat
          text: 这就是我在歌声中梦见的地方，是那段音乐为我描绘的地方。就在这里，这片圣洁的地方。世上若有一处能让我们找到祂，一定就是这里。
        - id: ch03-b05
          speaker: narrator
          text: 一股巨大的敬畏忽然落在鼹鼠身上。他的肌肉像化成了水，头低了下去，双脚给牢牢定在草地上。那不是惊慌的恐惧。他反而感到无比安宁，无比幸福。可这份敬畏还是牢牢撮住了他。虽然什么也没看见，他已经明白，一位威严无比的存在就在近旁。
        - id: ch03-b06
          speaker: narrator
          text: 鼹鼠艰难地转过头，河鼠就在他身边，也被这威严压得低下身子，浑身不停发抖。周围的枝叶间明明栖满了鸟，却依旧没有一点声音。只有天光还在越来越强。
        - id: ch03-b07
          speaker: narrator
          text: 笛声已经停了，可那呼唤还在，强大得不容拒绝。鼹鼠只能服从。就算一抬眼便会看见凡人不该看见的事物，就算死神随即将他击倒，他也无法违抗。他颤抖着，谦卑地抬起头。黎明将至，天地一片澄澈。大自然涌着难以想象的绚烂色彩，却又屏住了呼吸。
        - id: ch03-b08
          speaker: narrator
          text: 鼹鼠望进那位朋友与救助者的眼睛。他看见弯角向后舒展，在不断增强的晨光里闪耀。慈爱的双眼俯视着他们，里面还带着诙谐的笑意。双眼之间是一只威严的鹰钩鼻，长着胡须的嘴角也露出半抹微笑。一条手臂横在宽阔的胸膛前，上面的肌肉起伏分明。修长灵活的手里还握着排箫，那排箫似乎只在刚才，才从微张的嘴唇边放下。那双毛茸茸的腿庄严而安适地舒展在草地上，曲线雄健又优美。祂显得无比威严，却又安然自在。
        - id: ch03-b09
          speaker: narrator
          text: 最后，他看见那位神灵的蹄间依偎着一个圆滚滚、胖乎乎的小小身子。正是小水獭。他睡得沉沉的，安宁而满足。这一切都清清楚楚地映在晨空上。鼹鼠屏息看着。他看见了，却还活着。他仍然活着，也仍然惊叹着。
        - id: ch03-b10
          speaker: mole
          text: 河鼠，你害怕吗？
          emotion: fearful
        - id: ch03-b11
          speaker: rat
          text: 害怕？害怕祂吗？不，永远不会！可是，可是，鼹鼠，我又真的害怕。
          emotion: fearful
        - id: ch03-b12
          speaker: narrator
          text: 两个动物一同伏低身子，紧贴着大地。他们低下头，向眼前那位朋友与救助者敬拜。
        - id: ch03-b13
          speaker: narrator
          text: 宽阔的金色太阳忽然从他们正前方的地平线上升起。第一道光掠过平坦的水乡，正正照进他们眼里。两个动物被照得睜不开眼。等他们终于又能看见，异象已经消失，四下尽是群鸟迎接黎明的歌声。
    - id: ch04
      title: 遗忘的礼物
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 他们茫然望着，谁也说不出话。起初，他们只是空空地看着眼前的草地。接着，他们才慢慢明白，自己刚才究竟看见了什么，又失去了什么。明白得越多，无声的痛苦就变得越深。这时，一阵任性又调皮的小风从水面蹦跳而来。它拨弄白杨的叶子，摇晃沾满露水的玫瑰，然后轻轻的、爱抚般吹过两个朋友的脸。就在那柔软的一触之中，遗忘立刻降临了。
        - id: ch04-b02
          speaker: narrator
          text: 这正是那位慈爱的半神，赐给受他救助、又见过他的生灵最后也最好的礼物。他小心地赐下遗忘，是为了不让那可畏的记忆一直留在心里。因为那记忆会不住长大，最后遮住每一份欢笑和喜悦。那幅宏大的异象若是日夜缠绕不去，就会毁掉这些摆脱困境的小动物今后全部的生活。而他愿他们仍然像从前一样，过得幸福，过得轻快。所以，他让他们忘记。
        - id: ch04-b03
          speaker: narrator
          text: 鼹鼠揉揉眼睛，看向河鼠。河鼠也正一脸困惑地四下张望。
        - id: ch04-b04
          speaker: mole
          text: 对不起，河鼠，你刚才说什么来着？
        - id: ch04-b05
          speaker: rat
          text: 我好像只是说，这地方很合适。要是哪儿能找到小胖墩，也就是这里了。看！他在那儿！小家伙就在那儿！
          emotion: happy
        - id: ch04-b06
          speaker: narrator
          text: 河鼠欢呼着跑向沉睡的小胖墩。鼹鼠却还在原地站了片刻，心事重重。他像一个刚从美梦中突然惊醒的人，拼命想把那个梦找回来，却什么画面也抓不住。他只能留住一点模糊的感觉。那梦曾经多么美，那份美又多么叫人心痛。可很快，连这仅剩的感觉也渐渐消失了。做梦的人只能苦涩地接受冰冷而坚硬的清醒，还有清醒带来的一切。鼹鼠也只好难过地摇摇头，然后跟上河鼠。
        - id: ch04-b07
          speaker: narrator
          text: 小胖墩醒过来，欢喜地尖叫一声。看见常常陪他玩的父亲朋友，他高兴得扭来扭去。可转眼间，那张小脸便空了。他一边发出恳求的呜咽，一边绕着圈子四下搜寻。
        - id: ch04-b08
          speaker: narrator
          text: 他就像一个在保姆怀里安睡的孩子，醒来却发现自己孤零零地躺在陌生地方。孩子会翻遍墙角和柜子，又从这个房间跑到那个房间。他不会马上喊出自己有多害怕，可绝望正在心底无声地不住长大。小胖墩也一样。他把小岛找了一遍又一遍，执拗地搜寻，怎么也不肯停下，也不知道疲倦。直到最漆黑、最难熬的那一刻到来，他终于明白只能放弃了。他坐到地上，伤心地大哭起来。
        - id: ch04-b09
          speaker: narrator
          text: 鼹鼠赶紧跑过去安慰他。河鼠还留在后面，疑惑地看了很久。草地上留着几枚深深的蹄印。
        - id: ch04-b10
          speaker: rat
          text: 有一只很大、很大的动物来过这里。
        - id: ch04-b11
          speaker: narrator
          text: 河鼠站在那里一遍遍思索，心中莫名地激动着。
        - id: ch04-b12
          speaker: mole
          text: 快来，河鼠！想想可怜的水獭，他还在上游的浅滩边等着呢！
    - id: ch05
      title: 河流带他们回家
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 他们答应让小胖墩坐河鼠先生真正的小船，到河上好好快活一回，小家伙很快就得到了安慰。两个朋友领他走到水边，把他稳稳放在船底，坐在他们中间，然后一起离开小岛，顺着回水向下游划去。太阳这时已经完全升起，晒得他们身上发热。鸟儿不再沉默，它们毫无顾忌地放开嗓子歌唱。两岸的花朵也对着船上的朋友微笑点头。可两个动物总觉得，这些花的繁茂和色彩，好像都不如他们不久前在某个地方看见的那么浓，那么亮。可那究竟是在哪儿呢？他们谁也想不起来。
        - id: ch05-b02
          speaker: narrator
          text: 小船重新回到主河道，两个朋友调转船头，往上游划去。他们知道，那位独自守候的朋友就在前方。熟悉的浅滩渐渐靠近时，鼹鼠把船划到岸边。他们抱出小胖墩，让他在纤道上站稳，仔细告诉他该往哪边走，又友好地向他道别，亲昵地拍拍他的背。随后，他们推离河岸，把船重新划回河心。
        - id: ch05-b03
          speaker: narrator
          text: 小胖墩沿小路摇摇摆摆地往前走，一副满足又神气的样子。船上的两个朋友一直望着他。忽然，他把鼻口一抬，摇摆的步子顿时变成了笨拙的小跑。他越跑越快，嘴里尖声呜叫，整个身子都因认出父亲而欢喜地扭动着。两个朋友朝上游望去。浅水里，水獭原本紧绷绷地蹲伏着，一直像尊石像似的无声忍耐。这会儿，他猛地跳起身，发出一声又惊又喜的叫喊，接着冲过柳丛，一下奔上小路。
        - id: ch05-b04
          speaker: narrator
          text: 父子就要重逢了。鼹鼠用力一扯单边船桨，小船便在河心掉过头去。这一夜的寻觅已经幸福地结束，他们不再需要用力赶路，只任凭整条河流载着自己向下游漂去，爱到哪儿就到哪儿。小船就这样顺流漂着。
        - id: ch05-b05
          speaker: mole
          text: 河鼠，我觉得累得真奇怪。你也许会说，那是因为咱们一夜没睡。可在这个时节，我们一星期有一半的夜里都是这样，那根本不算什么。我好像刚刚经历了一件又激动人心、又有点可怕的事，而那件事才刚结束。可明明什么特别的事都没发生。
        - id: ch05-b06
          speaker: rat
          text: 也许是一件又叫人惊奇、又辉煌美好的事。鼹鼠，我的感觉和你一样。我实在累坏了，可累的又不是身子。幸好水流正送咱们回家。再次感觉阳光一点点浸进骨头里，可真快活。你听，风又在芦苇里吹起来了。
        - id: ch05-b07
          speaker: mole
          text: 真像音乐。是从很远很远的地方传来的音乐。
        - id: ch05-b08
          speaker: rat
          text: 我也这么觉得。那是舞曲，轻轻跳着，一直不停。里面还藏着话。一会儿变成话语，一会儿又消失在曲调里。我隔一阵才能听清几句。接着，它又是舞曲了，最后只剩下芦苇又轻又细的低语。
        - id: ch05-b09
          speaker: mole
          text: 你听得比我清楚。我一个字也辨不出来。
        - id: ch05-b10
          speaker: rat
          text: 我试着说给你听。现在又变成话了，很轻，可很清楚。“莫让敬畏驻心底，从此嬉游变忧戚；援手之时见我力，过后还须全忘记！”现在芦苇接过去了。它们在叹息。“忘记，忘记。”声音又散成穸穸声和耳语了。现在，那个声音又回来了。
        - id: ch05-b11
          speaker: rat
          text: “莫让四肢鲜血滴，我先触动暗中机；罗网松开你见我，过后必然全忘记！”划近些，鼹鼠，再靠芦苇近一点。它越来越弱，很难听清了。
        - id: ch05-b12
          speaker: rat
          text: “救助疗伤我安慰，林间湿地小孤儿；迷途我寻，伤者我裹，嘱咐他们全忘记！”再近些，鼹鼠，再近些！不，没用了。歌声已经变成芦苇的说话声了。
        - id: ch05-b13
          speaker: mole
          text: 可这些话到底是什么意思？
        - id: ch05-b14
          speaker: rat
          text: 我也不知道。它们怎么传到我这里，我就怎么传给你。啊！现在它又回来了，这一次又饱满又清晰！终于，这是真正的声音，再不会认错了。它简单，热烈，完美。
          emotion: surprised
        - id: ch05-b15
          speaker: narrator
          text: 鼹鼠在热热的阳光下等了好几分钟，差点就睡着了。
        - id: ch05-b16
          speaker: mole
          text: 那你倒是说给我听呀。
        - id: ch05-b17
          speaker: narrator
          text: 鼹鼠耐心地等了一会儿，却没有回答。他朝身边一看，便明白了这片沉默。疲倦的河鼠已经沉沉睡去。他脸上带着无比幸福的微笑，那一抹笑意还没有褪去。一点侧耳倾听的神情，也仍停留在他脸上。
