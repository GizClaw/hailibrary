cover_prompt: |-
  A wordless cover scene on an Edwardian English riverbank shows Mole, Rat, Badger, and Toad sharing a bright spring adventure. Mole is a small dark-furred mole in a cream waistcoat, Rat a slim brown water vole in a blue jacket, Badger a broad black-and-white badger in a worn tweed coat, and Toad a plump green-brown toad in a checked motoring coat and goggles pushed above his eyes. Rat rows a varnished wooden boat carrying a wicker picnic basket while Mole trails one paw in the water, and Badger and Toad wave from a willow-lined landing. Mole's delighted first touch of the river is the focal action, with reeds, distant meadows, and Toad Hall low on the horizon. Use a low water-level three-quarter view with the boat moving gently inward and generous pale sky above the willows. Keep the animals' anatomy recognizable, their period clothes original, and every design independent of later illustrated and screen adaptations. No readable text, letters, numbers, labels, logos, captions, speech bubbles, signatures, or watermarks.
