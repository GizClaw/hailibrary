audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 温暖从容，带着含蓄的幽默
        timbre: 清澈醇厚
        pace: 舒缓而富于变化
        pitch: 中低
    mole:
      display_name: 鼹鼠
      tts:
        delivery: 诚恳好奇，兴奋时有些冒失
        timbre: 柔和明亮
        pace: 中等偏快
        pitch: 中高
    rat:
      display_name: 河鼠
      tts:
        delivery: 热情老练，随和中带着笃定
        timbre: 温暖清亮
        pace: 从容
        pitch: 中
    fleeing_rabbit:
      display_name: 逃跑的兔子
      tts:
        delivery: 紧张急促，警告中带着恐惧
        timbre: 尖细清晰
        pace: 很快
        pitch: 高
  chapters:
    - id: ch01
      title: 第三章 荒林
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 鼹鼠早就想认识獾先生。大家一提到獾，都说他在这一带很有分量。他很少露面，可这里的动物总能感觉到他的影响。鼹鼠一次次向河鼠说起这个心愿，河鼠却总把事情往后拖。
        - id: ch01-b02
          speaker: rat
          text: 别着急。獾早晚会出现，他隔些日子总要出来走动。到时候，我自然会替你们介绍。他可是天底下最好的人！不过，见到他时是什么样，你就得接受什么样。还有，不管什么时候碰见，也得接受那个时候的他。
        - id: ch01-b03
          speaker: mole
          text: 那你请他来吃顿饭，不就行了吗？
        - id: ch01-b04
          speaker: rat
          text: 他不会来。獾讨厌应酬，也讨厌请客吃饭这一套。
        - id: ch01-b05
          speaker: mole
          text: 那么，换成咱们上门去看他呢？
        - id: ch01-b06
          speaker: rat
          text: 不行，他准会不高兴！他怕见生人，贸然上门会惹他生气。我和他这么熟，也没敢去过他家。再说，咱们根本去不了。他住在荒林最深的地方。
        - id: ch01-b07
          speaker: mole
          text: 住在荒林又怎么了？你不是说过，那里没什么不妥吗？
        - id: ch01-b08
          speaker: rat
          text: 是，我知道，荒林本身没什么不妥。只是眼下先别去。路太远，而且每年这个时候，他多半不在家。你耐心等着吧，总有一天他会来。
        - id: ch01-b09
          speaker: narrator
          text: 鼹鼠只能听他的。可是獾一直没有出现，日子里又总有新鲜的消遣。夏天过去很久以后，寒冷和霜冻来了，道路满是泥泞，他们大半时间都待在屋里。窗外，涨高的河水飞奔而过，仿佛在嘲笑任何想划船的人。这时候，鼹鼠又常常想起那只孤独的灰獾。他独自住在荒林中央的洞穴里，只过自己的日子。
        - id: ch01-b10
          speaker: narrator
          text: 冬天的河鼠很能睡，晚上早早躺下，早晨迟迟才起。白天本来就短，他偶尔随手写几句诗，也做一点家里的零碎活。当然，总有动物朋友顺道上门聊天。大家围在一起讲许多故事，回想刚刚过去的夏天，再把各自经历的种种事情拿出来彼此比较。
        - id: ch01-b11
          speaker: narrator
          text: 现在回头去看，那个夏天多么丰盛！就像书里壮丽的一章，插图一幅接一幅，每幅都色彩鲜艳。河岸边的盛大行列从容向前，一幕幕图景接连出现，排着庄严的队伍展开。紫色珍珠菜先到了，它在明亮如镜的水边摇着浓密又蓬松的长发，水中的倒影也仰起脸向它欢笑。娇嫩含愁的柳兰很快跟着走来，像一片粉红晚霞。紫色和白色的紫草手挽着手，悄悄爬出来，站进队伍。终于有一天早晨，害羞又迟迟不来的野蔷薇轻轻踏上舞台。仿佛有弦乐奏起堂皇的和弦，再慢慢转入一支加沃特舞曲。大家一听就知道，六月终于来了。
        - id: ch01-b12
          speaker: narrator
          text: 但大家还在等最后一位角色。他是仙女想追求的牧童，是小姐们守在窗前盼望的骑士，也是将用一个吻唤醒夏天，让它重回生命和爱情的王子。后来，风度翩翩、香气四溢的绣线菊穿着琥珀色短上衣，走进花朵中间。整出戏终于可以开演。
        - id: ch01-b13
          speaker: narrator
          text: 那真是一出好戏。如今风雨拍打着家门，困倦的动物舒舒服服窝在洞中，仍清楚记得夏日清晨的寒意。离日出还有整整一个钟头，白雾尚未散去，紧贴水面，不肯离开。接着，他们纵身跃进冷水，迎来猛然的一阵寒颤，再沿河岸飞奔。太阳突然回到了朋友们身边，大地、空气和河水一起变得明亮。灰色化成金色，种种颜色又从泥土里出生，向外跳跃。
        - id: ch01-b14
          speaker: narrator
          text: 他们也记得炎热正午那场慵懒的午睡。大家藏在浓绿的草木深处，太阳穿过叶片，化成细小的金色光柱和光斑。午后可以划船，可以游泳，也可以沿着尘土飞扬的小路漫步，穿过一片片金黄麦田。漫长而清凉的黄昏终于到来，白天散开的许多线索在那时一一收拢，一段段友情在那里变得圆满，许多明日的冒险也在那里有了计划。
        - id: ch01-b15
          speaker: narrator
          text: 所以在短短的冬日里，大家围着炉火，总有说不完的话。可是鼹鼠仍有很多空闲。一天午后，河鼠坐在火炉前的扶手椅中，一会儿打盹，一会儿琢磨那些怎么也押不好的韵脚。鼹鼠就在这时作出决定。他要独自去探一探荒林，也许还能和獾先生交上朋友。
        - id: ch01-b16
          speaker: narrator
          text: 那天下午又冷又静，头顶的天空像一整片坚硬的钢铁。鼹鼠悄悄离开温暖的客厅，独自走到野外。四周光秃秃、空荡荡的，树叶已经完全落尽。大自然正在一年一度的沉睡中，仿佛睡熟以后把被子全踢开了。鼹鼠从没像这天一样，看得这么遥远，也从没这样亲近地看清万物的内部。
        - id: ch01-b17
          speaker: narrator
          text: 夏天里，小树丛、山坳、采石坑和一切隐秘角落都藏在繁密的叶子下面，像等待人去探寻的神秘矿藏。如今，它们可怜巴巴地露出自己的寒酸模样，也袒露出从前藏好的所有秘密，好像在请鼹鼠暂时别嫌弃。等来日重新穿上华丽丰盛的化装舞会礼服，它们还会用旧日那些障眼法哄骗他，再把他引到身边。
        - id: ch01-b18
          speaker: narrator
          text: 眼前的乡野有些凄凉，却也让鼹鼠精神振奋，甚至越走越有兴致。他发现自己真心喜欢它没有装饰、坚硬而朴素的样子。华服脱去之后，乡野露出了最里面的骨骼。那骨骼优美、强健，又简单得毫不虚饰。鼹鼠不想念温暖的苜蓿，也不需要结籽的草在风中嬉戏。山楂树篱织成的屏风撤掉了，山毛榉和榆树如波浪起伏的帷幕也落下了。在他看来，这样反倒更好。鼹鼠怀着十分轻快的心情继续赶路。荒林低伏在前面，阴沉而危险，像平静的南方海面上露出的一道黑礁。
        - id: ch01-b19
          speaker: narrator
          text: 刚进树林时，倒没有什么吓人的。细枝在脚下咔嚓作响，倒木偶尔绊他一下。树桩上的菌子像一张张滑稽怪脸，仿佛某种熟悉却遥远的东西，只会叫他猛地一惊。这些事情有趣又刺激，引着他越走越深。后来，光线暗了，树木蹲伏在周围，靠得越来越近。路两旁的洞口则像一张张丑陋的嘴，对着他张开。
        - id: ch01-b20
          speaker: narrator
          text: 这时，一切都静了。暮色稳稳地向他逼近，速度却快得惊人。黑暗在身前身后聚集，余下的光仿佛洪水退去，很快从林中流走。
        - id: ch01-b21
          speaker: narrator
          text: 接着，那些脸出现了。
        - id: ch01-b22
          speaker: narrator
          text: 最初，鼹鼠只是从肩后隐约瞥见一张脸。那是一张邪恶的楔形小脸，正从洞里偷偷看他。鼹鼠猛然转过身，那东西却已经不见。
        - id: ch01-b23
          speaker: narrator
          text: 他走快了些，还故意快活地劝自己别胡思乱想，否则就没完没了。他走过一个洞，又一个洞，再一个洞。忽然，他看见了。不，没有。是的，绝对看见了！一张狭长的小脸长着冷硬的眼睛，从洞口一闪便消失。鼹鼠停了一下，强迫自己鼓起勇气，继续大步向前。
        - id: ch01-b24
          speaker: narrator
          text: 突然间，好像事情一直就是如此。远处近处，每个洞里都有一张脸。洞穴成百上千，那些脸飞快出现，又飞快缩回去。每双眼睛都怀着恶意和仇恨，牢牢盯着鼹鼠。冷硬的眼睛，邪恶而尖利的脸，到处都是。
        - id: ch01-b25
          speaker: narrator
          text: 鼹鼠想，只要离开岸坡上的洞，就不会再看见脸了。他转身离开小路，闯进没有谁走过的林地。
        - id: ch01-b26
          speaker: narrator
          text: 接着，口哨声响起来了。
        - id: ch01-b27
          speaker: narrator
          text: 最早的一声很远，落在他身后，细细的，尖尖的，却让他不由得加快脚步。没多久，同样细尖的口哨又从前方远处传来。鼹鼠迟疑了，想掉头回去。他正站在原地拿不定主意，左右两边也响起了口哨。声音被一个又一个看不见的东西接过去，传遍树林，一直送到最远的边界。无论他们是谁，显然全都醒着，警觉着，也准备好了。鼹鼠却孤身一人，没有武器，远离援助，黑夜还在不断合拢。
        - id: ch01-b28
          speaker: narrator
          text: 接着，细碎的脚步声响起来了。
        - id: ch01-b29
          speaker: narrator
          text: 起初，那声音轻得像落叶。渐渐地，它有了整齐的节奏。鼹鼠终于听出来，那是许多小脚从远处跑来，啪嗒，啪嗒，啪嗒。脚步究竟在前面还是后面？一会儿像在这一头，一会儿又到了那一头，接着两头同时响了起来。声音越来越多，也越来越近。鼹鼠侧着身子，一边听完又转向另一边。无论朝哪里听，脚步都在向他合围。
        - id: ch01-b30
          speaker: narrator
          text: 一只兔子突然穿过树林，径直朝鼹鼠飞奔。鼹鼠以为他会减速，或者转向绕开自己。谁知兔子差点擦着他冲过去，脸绷得又冷又硬，两只眼睛直直瞪着前方。
        - id: ch01-b31
          speaker: fleeing_rabbit
          text: 快离开这里，你这个傻瓜！快走！
          emotion: fearful
        - id: ch01-b32
          speaker: narrator
          text: 兔子一转身绕过树桩，钻进一个亲切又可靠的洞穴，不见了。脚步声越来越响，像一阵冰雹突然砸在四周铺开的枯叶地毯上。如今，整座树林都在奔跑，拼命奔跑。它在围猎，在追逐，也正从每个方向收紧包围。它们要围住的究竟是某件东西，还是某一个人？
        - id: ch01-b33
          speaker: narrator
          text: 鼹鼠慌了，也开始没命地跑。他不知道要逃向哪里，只顾撞上各种东西，绊过各种东西，再跌进各种东西里面。他从一些东西底下钻过，又躲开另一些东西。最后，一棵老山毛榉的树洞出现在面前。洞穴幽深昏暗，能够遮挡他，也能把他藏起来。说不定这里甚至安全，可谁能知道呢？
        - id: ch01-b34
          speaker: narrator
          text: 鼹鼠已经累得一步也跑不动了。他钻进被风吹进树洞的干叶，把身子缩成一团，只能盼着这里至少能让他安全一阵。他喘着气，浑身不停发抖，外面的口哨和细碎脚步仍在耳边响着。到这时，他终于完完全全明白了那个可怕的东西。田野和树篱间的其他小居民也曾在这里遇见它，并把那一刻当作生命中最黑暗的时分。河鼠一直徒劳地想保护鼹鼠，不让他亲自认识它。如今他终于知道，它就是荒林的恐怖。
        - id: ch01-b35
          speaker: narrator
          text: 与此同时，河鼠还暖和舒服地坐在炉边打盹。写着半首诗的纸从膝上滑落，他仰起脑袋，张开嘴，走进梦中河流那青翠的岸边。忽然，一块煤滑动了，炉火噼啪一响，蹿出一簇火苗。河鼠惊醒过来，记起自己原本在写诗。他从地上捡回诗稿，低头读了一会儿，又转头想问鼹鼠，什么词能和自己刚写的那个词押韵。
        - id: ch01-b36
          speaker: narrator
          text: 可是鼹鼠不在。河鼠停下来仔细听了好一阵，整座屋子安静得很。他连叫几声“鼹鼠”，仍旧没有回应，只好起身走进门厅。鼹鼠平常挂帽子的钩子空了。总放在伞架边的胶套鞋也不见了。
        - id: ch01-b37
          speaker: narrator
          text: 河鼠走到门外，仔细查看泥地。鼹鼠的脚印果然留在那里。胶套鞋是入冬才买的，鞋底那些凸点又新又尖，所以印痕十分清楚。它们笔直向前，带着明确的目标，一路通向荒林。
        - id: ch01-b38
          speaker: narrator
          text: 河鼠的神情严肃起来。他站着想了一两分钟，转身回屋，在腰间扎上一条皮带，插进两把手枪，又抄起门厅角落的一根粗棍，快步赶往荒林。
        - id: ch01-b39
          speaker: narrator
          text: 河鼠到达树林最外层的树木边时，天已经快黑了。他毫不迟疑地闯进去，一边向前，一边焦急地朝左右张望，寻找朋友留下的任何踪迹。邪恶的小脸不时从这里那里的洞中探出。可它们一看见勇敢的河鼠，看见他的手枪和手里那根又粗又难看的棍子，立刻缩回洞中。河鼠刚进荒林时，口哨和脚步声还清楚可闻，后来却一点点低下去，终于全都停止。四周又安静了。
        - id: ch01-b40
          speaker: narrator
          text: 河鼠勇敢地穿过整座树林，一直走到最远的边缘。随后，他离开所有小路，下定决心横穿林地，再一点一点搜遍整个地方。他走得很辛苦，却不肯漏过任何一块地方。一路上，他始终用快活的声音呼唤朋友，不让自己的焦急传进呼喊里。
        - id: ch01-b41
          speaker: rat
          text: 鼹鼠！鼹鼠！你在哪里？是我，是你的老河鼠！
        - id: ch01-b42
          speaker: narrator
          text: 他耐心地找了一个多钟头，终于听见一声微弱的回应。河鼠欢喜极了。他跟着声音，在越来越浓的黑暗里穿行，最后来到一棵老山毛榉下面。树干上有个洞，声音正是从那里传出来的。
        - id: ch01-b43
          speaker: mole
          text: 河鼠！真的是你吗？
        - id: ch01-b44
          speaker: narrator
          text: 河鼠爬进那处幽深的树洞，终于在干叶深处找到了鼹鼠。鼹鼠已经筋疲力尽，缩在那里，身子到这时还在不停发抖。
        - id: ch01-b45
          speaker: mole
          text: 哦，河鼠！刚才真把我吓坏了。你想象不到我有多害怕！
          emotion: fearful
        - id: ch01-b46
          speaker: rat
          text: 我完全明白。鼹鼠，你确实不该独自跑来，我已经尽力拦过你了。我们这些住河岸的动物，几乎不会一个人来这里。非来不可时，至少也会两个结伴，那样通常不会有事。这里有上百样规矩要懂。我们都知道，你眼下还没学会。
        - id: ch01-b47
          speaker: rat
          text: 比如口令、暗号，还有说出来就能管用的话。口袋里要带什么草药，该念什么歌诀，遇事又该用什么门道和花招。懂了以后都不难，可是小动物非懂不可，否则一定会惹上麻烦。当然，如果你是獾或者水獭，那又是另一回事。
        - id: ch01-b48
          speaker: mole
          text: 勇敢的蟾蜍先生，应该不怕独自来荒林吧？
        - id: ch01-b49
          speaker: narrator
          text: 河鼠听了，放声大笑。
        - id: ch01-b50
          speaker: rat
          text: 老蟾蜍？就算给他满满一帽子金币，他也不敢独自在这里露脸。绝对不敢！
        - id: ch01-b51
          speaker: narrator
          text: 河鼠笑得那样轻松自在，手里又牢牢握着粗棍，腰间的两把手枪还闪闪发亮。笑声和眼前的武器都让鼹鼠深受鼓舞。他终于不再发抖，胆子慢慢回来了，也重新变回平常那个自己。
        - id: ch01-b52
          speaker: rat
          text: 好啦，咱们得振作起来，趁天边还有一点光赶紧回家。夜里绝不能留在这里。别的不说，这地方就冷得受不了。
        - id: ch01-b53
          speaker: mole
          text: 亲爱的河鼠，真对不起。可我确实已经累垮了。你得让我再歇一会儿，恢复一点力气，否则我根本走不到家。
          emotion: sad
        - id: ch01-b54
          speaker: rat
          text: 那好吧，你尽管休息。反正现在几乎全黑了。再迟一些，应该会有一点月光。
        - id: ch01-b55
          speaker: narrator
          text: 鼹鼠钻进干叶深处，伸开四肢，不久就睡着了，只是睡得断断续续，一直不太安稳。河鼠也尽量拿叶子盖住身体，好让自己暖和些。他手里握着一把手枪，安安静静躺在那里等。
        - id: ch01-b56
          speaker: narrator
          text: 鼹鼠醒来以后，精神好了许多，又有了平日的劲头。
        - id: ch01-b57
          speaker: rat
          text: 好啦！我到外面看一眼，确认四周安静，随后咱们真得动身了。
        - id: ch01-b58
          speaker: narrator
          text: 河鼠走到树洞入口，把头探出去。鼹鼠听见他在那里轻声嘀咕。
        - id: ch01-b59
          speaker: rat
          text: 嘿！嘿！这下可好！
        - id: ch01-b60
          speaker: mole
          text: 出什么事了，河鼠？
        - id: ch01-b61
          speaker: rat
          text: 雪来了。准确地说，是雪下来了。正下得很大。
        - id: ch01-b62
          speaker: narrator
          text: 鼹鼠蹲到他身边，望向外面。刚才还令他恐惧万分的树林已经彻底换了模样。一个个洞口、一处处洼地、水坑、陷阱，还有那些威胁赶路人的黑暗地方，都在迅速消失。一张闪闪发亮的仙境地毯从脚下一直铺向四面八方，看起来纤细娇嫩，仿佛经不起粗重的脚掌踩上去。细细的雪粉充满空气，落到脸颊上，轻轻一刺，又像温柔的抚摸。黑色树干立在奇异的亮光中，那光竟仿佛是从地底照上来的。
        - id: ch01-b63
          speaker: rat
          text: 没有办法，咱们只好出发，碰碰运气。最糟的是，我也不清楚这里究竟是哪儿。现在又有雪盖住地面，每一样东西看起来都完全不同了。
        - id: ch01-b64
          speaker: narrator
          text: 连鼹鼠也认不出这是原来的树林。可是两位仍勇敢上路，挑了一个看似最有希望的方向。他们彼此搀扶，一路装得乐观得不可动摇。每逢一棵陌生的树阴沉沉、静悄悄地迎面出现，他们就假装遇见了老朋友。眼前只有白茫茫的空地和黑黝黝的树干，景物单调得始终不肯显出任何变化。他们却硬说某处入口很熟，某道缺口见过，或者某条弯曲的小路像是从前曾经走过。
        - id: ch01-b65
          speaker: narrator
          text: 一两个钟头过去了，或许还要更久。他们早已算不清时间。两位终于泄了气，疲惫不堪，也完全迷失了方向，只好在一截倒下的树干上坐下，喘口气，再商量接下来该怎么办。他们累得浑身酸疼，一次次摔倒又留下许多青肿。他们掉进好几个坑，身上从里到外全湿透了。积雪越来越深，两条小短腿几乎拖不动。四周的树木比原来更密，也比原来更相像。这座树林仿佛没有开头，没有结尾，到处都没有任何区别。最糟的是，无论向哪边看，它也没有出口。
        - id: ch01-b66
          speaker: rat
          text: 咱们不能在这里久坐。非得再拼一回，想个办法出来。天气冷得要命，雪也快深得走不动了。你看，前面低处像是一个山坳，地面高高低低，到处都是土坡和土包。咱们下去找个藏身处。只要找到洞穴，地面干燥，还能挡风雪，就先好好歇一阵。咱们两个都快累垮了。等休息够了再试一次，说不定雪会停，也说不定会有别的转机。
        - id: ch01-b67
          speaker: narrator
          text: 他们又站起来，挣扎着走进山坳，寻找能躲开寒风和飞雪的干燥洞穴。两位正在查看一座起伏的土包，鼹鼠突然绊倒，尖叫着摔了个脸朝下。
        - id: ch01-b68
          speaker: mole
          text: 哦，我的腿！我可怜的胫骨！
        - id: ch01-b69
          speaker: narrator
          text: 鼹鼠坐在雪中，两只前爪紧紧抱着腿。河鼠亲切地走过来，跪下检查伤口。
        - id: ch01-b70
          speaker: rat
          text: 可怜的老鼹鼠，你今天的运气实在不怎么样。让我看看。没错，胫骨划破了。我拿手帕替你包起来。
        - id: ch01-b71
          speaker: mole
          text: 我一定是被雪下的树枝或者树桩绊倒了。哎哟，真疼！
        - id: ch01-b72
          speaker: rat
          text: 这道伤口很整齐，不会是树枝或树桩割的。倒像碰到了某件金属东西的利边。真奇怪。
        - id: ch01-b73
          speaker: narrator
          text: 河鼠又看了看伤口，接着望向周围的土坡和隆起，认真想了起来。
        - id: ch01-b74
          speaker: mole
          text: 别管是什么弄的。不管它是什么，我的腿都一样疼。
        - id: ch01-b75
          speaker: narrator
          text: 河鼠用手帕仔细包好伤腿，便把鼹鼠留在原地，自己在雪中又抓又铲，还四处探寻，四条腿一起忙个不停。鼹鼠越等越不耐烦，隔一会儿就催他快走。突然，河鼠发出一声“万岁”的欢呼，接着又喊起“万岁——岁——岁——岁”，还在雪地里勉勉强强跳起一支吉格舞。
        - id: ch01-b76
          speaker: mole
          text: 河鼠，你究竟找到什么了？
        - id: ch01-b77
          speaker: rat
          text: 过来看看！
        - id: ch01-b78
          speaker: narrator
          text: 鼹鼠一瘸一拐地走过去，仔细看了半天。
        - id: ch01-b79
          speaker: mole
          text: 我当然看见了。这种东西以前见得多啦，不就是刮鞋器吗？那又怎样？你为什么要围着刮鞋器跳舞？
        - id: ch01-b80
          speaker: rat
          text: 你还看不出它意味着什么吗？你这脑袋不灵光的动物！
        - id: ch01-b81
          speaker: mole
          text: 我当然看得出来。某个特别粗心、特别健忘的人，把自家的刮鞋器落在荒林中央，还偏偏丢在谁走过都会被绊倒的地方。他太不替别人着想了。等我回家，一定找个什么人投诉这件事。你等着瞧吧！
        - id: ch01-b82
          speaker: rat
          text: 哎呀，你怎么还不明白！别争了，快过来刨！
        - id: ch01-b83
          speaker: narrator
          text: 河鼠重新动手，刨得雪花四处乱飞。又忙了一阵，一张破旧的门垫露了出来。
        - id: ch01-b84
          speaker: rat
          text: 怎么样？我刚才告诉过你什么？
        - id: ch01-b85
          speaker: mole
          text: 你什么也没有告诉我。现在你又找到一件用坏以后扔掉的家用垃圾，想必满意了。要跳舞就赶快围着它跳完，接着咱们也好赶路，别再把时间浪费在垃圾堆上。门垫能吃吗？能盖着睡吗？还是能让咱们坐在上面，把它当雪橇一路滑回家？你这个叫人受不了的啮齿动物！
        - id: ch01-b86
          speaker: rat
          text: 你难道真的要说，这张门垫还是什么也没有告诉你？
        - id: ch01-b87
          speaker: mole
          text: 说真的，河鼠，这场胡闹已经够了。谁听说过门垫会告诉别人事情？门垫根本不会说话，它们不是那种东西。门垫知道自己该待在哪里。
        - id: ch01-b88
          speaker: rat
          text: 你这头脑迟钝的家伙，听我说，这事必须到此为止。别再讲话，只管刨。刮也好，抓也好，挖也好，给我到处找，特别是土包两边。今晚要想睡在温暖干燥的地方，就照我说的做。这是咱们最后的机会！
          emotion: angry
        - id: ch01-b89
          speaker: narrator
          text: 河鼠热火朝天地扑向旁边的雪堆。他先用粗棍到处戳探，随后拼命挖掘。鼹鼠也动手刨了起来，主要是为了让河鼠满意，因为他觉得朋友大概已经累得神志不清。
        - id: ch01-b90
          speaker: narrator
          text: 他们苦干了大约十分钟，河鼠的棍尖忽然撞上一件东西，发出空空的声音。他一直挖到爪子能够伸进去摸索，随后叫鼹鼠过来帮忙。两个动物一齐使劲，终于让辛劳的成果完整露了出来。刚才还满心怀疑的鼹鼠顿时目瞪口呆。
        - id: ch01-b91
          speaker: narrator
          text: 原本看似雪堆的土坡侧面，立着一扇结实的小门，漆成深绿色。门边垂着一条铁铃索，下面还有一小块铜牌。借着月光，他们看清了牌上刻得整整齐齐的几个大字：獾先生。
        - id: ch01-b92
          speaker: narrator
          text: 鼹鼠又惊又喜，向后一倒，坐进雪里。
        - id: ch01-b93
          speaker: mole
          text: 河鼠，你真了不起！你简直是个奇才。现在我全明白了！从我跌倒、划破腿的那一刻起，你那颗充满智慧的脑袋就在一步步推理。你一看伤口，庄严的头脑立刻说，是刮鞋器！于是你动手去找，果然找到了割伤我的那个东西。
        - id: ch01-b94
          speaker: mole
          text: 可你就此停下了吗？没有。别人也许早就满意了，你的才智却还在转。你对自己说，只要再找到一张门垫，推断就证实了。结果你真找到了门垫。你这么聪明，只要愿意，什么都能找到。接着你又想，那扇门肯定存在，简直和亲眼看见了一样清楚，剩下的事情只是把它挖出来。
        - id: ch01-b95
          speaker: mole
          text: 我在书里读到过这种事情，现实里却从没见过。你应该去一个真正懂得欣赏你的地方。和我们这帮家伙待在一起，简直浪费了你的本事。河鼠，如果我也有你那样的脑袋……
        - id: ch01-b96
          speaker: rat
          text: 可惜你没有。难道你打算坐在雪里谈一整夜？马上起来，抓住那条铃索，用尽力气拉。我来敲门！
        - id: ch01-b97
          speaker: narrator
          text: 河鼠举起棍子，一下接一下用力敲打门板。鼹鼠则跳起来牢牢抓住铃索，两只脚全离开了地面，整个身子吊在那里来回摇晃。隔着很长一段距离，他们终于隐约听见一只声音低沉的铃铛作出了回应。
