audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm, observant storytelling with gentle humor
        timbre: clear and mellow
        pace: measured
        pitch: medium
    mole:
      display_name: Mole
      tts:
        delivery: earnest, curious, and quick to wonder
        timbre: soft and youthful
        pace: lively
        pitch: medium-high
    water_rat:
      display_name: Water Rat
      tts:
        delivery: friendly, assured, and dryly amused
        timbre: warm and smooth
        pace: easygoing
        pitch: medium
    rabbit:
      display_name: Rabbit
      tts:
        delivery: breathless, urgent, and blunt
        timbre: light and wiry
        pace: quick
        pitch: high
  chapters:
    - id: ch01
      title: Thoughts of Mr. Badger
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Mole had wanted for a long time to meet Badger. By every account, Badger was an important animal. He was hardly ever seen, yet somehow everyone in the neighborhood felt his influence. Mole could tell that things happened because of him even when he was nowhere in sight. Whenever Mole told Water Rat how much he wanted an introduction, though, Rat always found a reason to put it off.
        - id: ch01-b02
          speaker: water_rat
          text: Don't worry. Badger will turn up one of these days. He always does, and then I'll introduce you. He's one of the very best. You just have to take him as he is, and whenever he chooses to appear.
        - id: ch01-b03
          speaker: mole
          text: Couldn't you invite him over for dinner or something?
        - id: ch01-b04
          speaker: water_rat
          text: He wouldn't come. Badger can't stand company, invitations, dinners, or any of that.
        - id: ch01-b05
          speaker: mole
          text: Then why don't we visit him?
        - id: ch01-b06
          speaker: narrator
          text: The suggestion alarmed Rat.
        - id: ch01-b07
          speaker: water_rat
          text: Oh, he'd hate that! He's terribly shy, and a visit would offend him. I've never gone to his home myself, and I know him well. Anyway, we can't. He lives right in the middle of the Wild Wood.
        - id: ch01-b08
          speaker: mole
          text: So what? You told me the Wild Wood was safe.
        - id: ch01-b09
          speaker: water_rat
          text: Yes, yes, it is. Still, let's not go there now. It's a long walk, and Badger wouldn't be home at this time of year. Just wait. He'll come by sooner or later.
        - id: ch01-b10
          speaker: narrator
          text: Mole had to accept that answer, but Badger never came. Summer passed with something enjoyable happening every day, so Mole's wish slipped into the background. Much later, cold and frost arrived. The paths turned muddy, and the friends spent most of their time indoors. Outside their windows, the swollen river rushed past as if it were making fun of anyone foolish enough to think of boating. With fewer adventures to distract him, Mole began thinking again and again about the solitary gray Badger who lived his own private life in a hole at the heart of the Wild Wood.
        - id: ch01-b11
          speaker: narrator
          text: Rat slept a great deal in winter. He went to bed early and rose late, leaving himself only a short day. In those few waking hours, he sometimes wrote bits of poetry. At other times he found small household jobs to do. Animals were always dropping in for a chat, too, and every visitor brought another story. They compared notes about the summer just past and remembered all the things they had done.
        - id: ch01-b12
          speaker: narrator
          text: And what a summer it had been. Looking back, it seemed like a splendid book filled with brilliant pictures. The riverbank had put on one scene after another in a grand, steady parade. Purple loosestrife came early and shook its thick, tangled hair beside the smooth water, where its own face seemed to laugh back. Tender willow-herb followed, pink as a sunset cloud. Purple and white comfrey crept forward hand in hand to take their place. At last the shy, slow dog rose stepped delicately onto the stage. It felt as if stately string music had announced that June was finally here. Still, the company waited for one last performer, the prince who would wake sleeping summer back to life and love. Then fragrant meadow-sweet walked gracefully into the group in an amber coat, and the play was ready to begin.
        - id: ch01-b13
          speaker: narrator
          text: Curled safely in their holes while rain and wind beat at the doors, sleepy animals remembered sharp mornings a full hour before sunrise. White mist still clung to the surface of the water. They remembered the shock of an early plunge and the quick race along the bank. Then the sun would suddenly return, changing earth, air, and water all at once. Gray turned to gold, and color was born again, springing from the ground. They remembered lazy naps at hot midday, hidden deep in green undergrowth while sunlight pierced the leaves in tiny golden shafts and spots. There had been boating and swimming in the afternoon, walks along dusty lanes and through yellow fields of grain, and then the long, cool evening. That was when the day's loose threads came together, friendships grew closer, and everyone planned new adventures for the morning.
        - id: ch01-b14
          speaker: narrator
          text: Those memories gave everyone plenty to discuss on the short winter days when they gathered around the fire. Even so, Mole still had a good deal of time to spare. One afternoon, Rat sat in his armchair before the flames. One moment he was dozing. The next, he was trying out rhymes that stubbornly refused to fit. As Mole watched him, he quietly made up his mind. He would go out by himself, explore the Wild Wood, and perhaps manage to make friends with Mr. Badger.
    - id: ch02
      title: The Terror of the Wild Wood
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: Mole slipped from the warm parlor into a cold, still afternoon beneath a hard steel sky. The country around him was bare and completely leafless. Never before had he been able to see so far into the insides of things. Nature was deep in her yearly sleep and seemed to have kicked off all her covers. Groves, hollows, quarries, and other secret places had been mysterious mines for exploration in leafy summer. Now they showed themselves plainly, shabby and poor, as if asking him to forgive their appearance until they could dress richly again and return to their old tricks. The sight was a little sad, but it also cheered and excited him. He liked the country undecorated, hard, and stripped of its finery. He did not miss warm clover or seeding grass. The leafy screens of hedge, beech, and elm seemed better gone. He had reached the strong, simple bones of the land, and he liked what he saw.
        - id: ch02-b02
          speaker: narrator
          text: In high spirits, he walked toward the Wild Wood. It lay low and threatening ahead, like a black reef in a still southern sea. Nothing frightened him when he first entered. Twigs snapped beneath his feet, and fallen logs tripped him. Mushrooms growing on old stumps looked like strange, twisted copies of familiar things from far away. They startled him for a moment, but that was part of the fun. The little shocks only made the adventure more exciting and drew him onward. He pressed deeper into the wood. The light grew weaker. Trees crouched closer and closer around him, and holes on either side seemed to open ugly mouths at him.
        - id: ch02-b03
          speaker: narrator
          text: Everything became very quiet. Dusk gathered quickly behind him and ahead of him. The last light seemed to drain away like floodwater.
        - id: ch02-b04
          speaker: narrator
          text: Then the faces began.
        - id: ch02-b05
          speaker: narrator
          text: Mole thought he saw the first one over his shoulder. A small, wicked, wedge-shaped face peered from a hole. When he turned to look straight at it, it disappeared. He walked faster and told himself not to imagine things. If he started that, there would be no end to it. He passed one hole, then another, then another. A narrow face with hard eyes flashed into sight and vanished. Mole hesitated, gathered his courage, and marched on.
        - id: ch02-b06
          speaker: narrator
          text: He passed another hole, and another after that. Then there it was. Or was it? Yes. A narrow little face with hard eyes flashed into sight and vanished. Mole stopped, forced himself to be brave, and marched on. Suddenly it seemed that every hole had always held a face. There were hundreds of holes, near and far, and faces came and went in all of them. Every sharp, hard-eyed face fixed him with a look of hatred. Mole decided that if he could only get away from the holes along the banks, the faces would stop. He turned sharply off the path and pushed into the trackless woods.
        - id: ch02-b07
          speaker: narrator
          text: Then the whistling began.
        - id: ch02-b08
          speaker: narrator
          text: At first it was a thin, shrill sound far behind him. It was very faint, but somehow it made him hurry. Then the same high whistle came from far ahead. Mole hesitated and wanted to turn back. As he stood there unable to choose, the sound broke out on both sides. One whistle seemed to answer another until it had been passed through the entire wood, all the way to its farthest edge. Whoever they were, they were awake, alert, and ready. Mole knew exactly what that meant for him. He was alone and unarmed, far from anyone who could help, and night was closing in.
        - id: ch02-b09
          speaker: narrator
          text: Then the pattering began.
        - id: ch02-b10
          speaker: narrator
          text: Mole first mistook the soft, delicate sound for falling leaves. As it grew louder, it settled into a regular rhythm. It was the pat-pat-pat of small feet, still a long way off. Was it ahead of him or behind? First it seemed to be one, then the other, then both. Mole leaned one way and then another, listening anxiously. The footsteps multiplied in every direction and seemed to be drawing steadily closer. While he stood still and strained to hear, a rabbit came racing toward him through the trees. Mole waited for the animal to slow down or turn onto another path. Instead, Rabbit nearly brushed against him as he dashed past. His face was set and hard, and his eyes stared straight ahead.
        - id: ch02-b11
          speaker: rabbit
          text: Get out of here, you fool! Get out!
          emotion: fearful
        - id: ch02-b12
          speaker: narrator
          text: Rabbit swung around a stump and vanished into a welcoming burrow. The pattering grew until it sounded like sudden hail striking dry leaves. Now the whole wood seemed to be running, hunting, chasing, closing around something. Or somebody.
        - id: ch02-b13
          speaker: narrator
          text: The pattering grew until it filled the wood, as sharp and sudden as hail striking the carpet of dry leaves. It seemed that the whole forest was running now. Something was hunting, chasing, and closing in around something else. Or was it closing in around somebody? Panic seized Mole, and he began to run too, though he had no idea where he was going. He crashed into things, tumbled over things and into them, ducked beneath them, and dodged around them. At last he found a deep, dark hollow inside an old beech tree. It offered shelter and concealment, perhaps even safety, though he could not be sure of that. He was too tired to run one step farther. Mole curled down into the dry leaves that had drifted inside and could only hope he would be safe for a while.
        - id: ch02-b14
          speaker: narrator
          text: He lay there panting and shaking while whistles and footsteps sounded outside. Now he understood the dreadful thing in all its fullness. Other small creatures from the fields and hedges had entered this place and met it in their darkest moments. Rat had known about it and had tried, without success, to protect Mole from it. Mole knew its name at last. It was the Terror of the Wild Wood.
    - id: ch03
      title: Rat Comes Looking
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: Meanwhile, Rat was warm and comfortable, dozing beside his fire. The page covered with his half-finished verses slipped from his knee to the floor. His head tipped back, his mouth fell open, and in his dreams he wandered beside green rivers. Then a coal shifted in the grate. The fire cracked sharply and sent up a sudden tongue of flame, waking him with a start. Rat remembered what he had been doing. He reached down, picked up his verses, and studied them closely for a minute. Then he looked around for Mole. Perhaps Mole could suggest a useful rhyme for the troublesome line.
        - id: ch03-b02
          speaker: narrator
          text: Mole was not there.
        - id: ch03-b03
          speaker: narrator
          text: Rat listened. The house was unusually quiet.
        - id: ch03-b04
          speaker: water_rat
          text: Moly! Moly!
        - id: ch03-b05
          speaker: narrator
          text: Rat called several times, but no one answered, so he got up and went into the hall. Mole's cap was gone from its usual peg. His rubber boots, which always rested beside the umbrella stand, were gone too. Rat left the house and carefully studied the muddy ground outside, hoping to find tracks. There they were. Mole had just bought the boots for winter, and the little bumps on their new soles were still fresh and sharp. Their clear marks crossed the mud in a straight, purposeful line that led directly toward the Wild Wood.
        - id: ch03-b06
          speaker: narrator
          text: Rat looked very grave. He stood still and thought deeply for a minute or two. Then he went back inside, fastened a belt around his waist, and tucked two pistols into it. From a corner of the hall he picked up a strong, heavy club. Once he had armed himself, he left the house again and set off for the Wild Wood at a brisk pace.
        - id: ch03-b07
          speaker: narrator
          text: Dusk was already near when Rat reached the first fringe of trees. He plunged into the wood without a moment's hesitation, looking anxiously from side to side for any sign of his friend. Wicked little faces appeared at holes here and there. But the creatures saw a brave, determined animal with pistols at his belt and a great ugly club in his paw, and their faces disappeared at once. Rat had heard the whistling and pattering quite clearly when he first entered. Those sounds died away too, until the wood was completely still.
        - id: ch03-b08
          speaker: narrator
          text: Rat made his way bravely through the entire length of the wood until he reached its farthest edge. Then he abandoned the paths. He began crossing the forest back and forth, slowly and laboriously searching every part of the ground. All the while he kept calling in a cheerful voice, so Mole would know that a friend had come.
        - id: ch03-b09
          speaker: water_rat
          text: Moly! Moly! Where are you? It's me, old Rat!
        - id: ch03-b10
          speaker: narrator
          text: He had searched for more than an hour when a faint answer finally came. With great relief, Rat followed the sound through the growing darkness to an old beech tree with a hollow at its base.
        - id: ch03-b11
          speaker: mole
          text: Ratty! Is it really you?
          emotion: surprised
        - id: ch03-b12
          speaker: narrator
          text: Rat crawled into the hollow and found Mole exhausted and still trembling.
        - id: ch03-b13
          speaker: mole
          text: Oh, Rat! I was so frightened. You can't imagine how bad it was!
          emotion: fearful
        - id: ch03-b14
          speaker: water_rat
          text: I understand completely. But you really shouldn't have done this, Mole. I tried my best to keep you away. We riverbank animals almost never enter the Wild Wood alone. When we must come, we travel at least in pairs, and then we're usually safe. There are a hundred things a fellow needs to know, and you haven't learned them yet. There are passwords and signs, special sayings that have power, plants you carry in your pocket, verses you repeat, and all sorts of dodges and tricks. They're simple enough once you know them. But a small animal needs that knowledge or he'll get into trouble. Badger and Otter are different, of course.
          emotion: calm
        - id: ch03-b15
          speaker: mole
          text: But surely brave Mr. Toad would come here alone?
        - id: ch03-b16
          speaker: narrator
          text: Rat laughed heartily.
        - id: ch03-b17
          speaker: water_rat
          text: Toad? He wouldn't show his face here alone for a hatful of gold coins!
          emotion: happy
        - id: ch03-b18
          speaker: narrator
          text: Rat's easy laughter cheered Mole. So did the sight of the club and the shining pistols. He stopped shaking and began to feel like himself again.
        - id: ch03-b19
          speaker: water_rat
          text: All right, then. We need to pull ourselves together and head home while a little light remains. We can't spend the night here. For one thing, it's much too cold.
        - id: ch03-b20
          speaker: mole
          text: Dear Ratty, I'm terribly sorry, but I'm completely worn out. Please let me rest a little longer and get my strength back. Otherwise I'll never make it home.
        - id: ch03-b21
          speaker: water_rat
          text: All right. Rest as long as you need. It's nearly pitch-black anyway, and the moon should come out later.
        - id: ch03-b22
          speaker: narrator
          text: Mole worked his way deep into the dry leaves, stretched himself out, and soon fell asleep. His sleep was broken and troubled, but at least he was resting. Rat covered himself with leaves as well as he could to keep warm. Then he lay patiently beside his friend and waited, holding a pistol ready in one paw.
    - id: ch04
      title: Lost in the Snow
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: Mole woke feeling much better and more like himself. Rat went to the mouth of the hollow and peered outside.
        - id: ch04-b02
          speaker: water_rat
          text: Well, now. This is a fine mess.
        - id: ch04-b03
          speaker: mole
          text: What's wrong, Ratty?
        - id: ch04-b04
          speaker: water_rat
          text: Snow. It's coming down hard.
        - id: ch04-b05
          speaker: narrator
          text: Mole came to the opening, crouched beside Rat, and looked out. The wood that had terrified him was completely changed. Holes, hollows, pools, pits, and all the other dark dangers that threatened a traveler were quickly disappearing. Everywhere, a shining, fairy-like carpet was spreading over the ground. It looked too delicate for rough feet to step on. Fine powder filled the air and touched Mole's cheek with a cold tingle. Against all that white, the black trunks of the trees stood out in a strange light that seemed to rise from the ground below them.
        - id: ch04-b06
          speaker: water_rat
          text: We can't help it. We'll have to start and take our chances. The trouble is, I don't quite know where we are, and the snow has made everything look different.
        - id: ch04-b07
          speaker: narrator
          text: Mole would never have known it was the same wood. Still, the two friends set out bravely along the route that looked most promising. They held tightly to each other as they walked. With a cheerfulness that nothing could defeat, they pretended to recognize an old friend in every new tree that greeted them grimly and silently. Each opening or gap became a path they almost remembered. But the white ground went on and on, and the black tree trunks all looked alike.
        - id: ch04-b08
          speaker: narrator
          text: An hour or perhaps two passed. They had lost all sense of time. At last they stopped, discouraged, exhausted, and completely lost. They sat on a fallen tree trunk to catch their breath and decide what to do next. Their whole bodies ached with weariness, and repeated tumbles had left them bruised. They had fallen into several holes and gotten soaked through. The snow kept deepening until they could barely drag their short legs through it. Around them, the trees stood closer together and looked more alike than ever. The wood seemed to have no beginning, no end, and no difference from one place to another. Worst of all, it seemed to have no way out.
        - id: ch04-b09
          speaker: water_rat
          text: We can't sit here much longer. We have to make another push and do something, anything. The cold is dreadful, and soon the snow will be too deep for us to wade through. Look down there in front of us. The ground dips into a hollow, and it seems full of little hills, humps, and mounds. Let's work our way down and search for shelter. We may find a cave or a hole with a dry floor, somewhere out of the snow and the wind. Then we can have a proper rest before we try again. Besides, the snow may stop, or something else may turn up.
        - id: ch04-b10
          speaker: narrator
          text: They struggled to their feet and made their way down into the hollow. There they searched among the mounds for a dry corner protected from the cutting wind and swirling snow. Suddenly Mole tripped and fell flat on his face with a squeal.
        - id: ch04-b11
          speaker: mole
          text: Oh, my leg! My poor shin!
        - id: ch04-b12
          speaker: narrator
          text: Mole sat in the snow and held his leg in both front paws.
        - id: ch04-b13
          speaker: water_rat
          text: Poor old Mole. You haven't had much luck today, have you? Let me see. Yes, you've cut your shin. Hold still while I tie my handkerchief around it.
        - id: ch04-b14
          speaker: mole
          text: I must have fallen over a buried branch or stump. Oh, that hurts!
        - id: ch04-b15
          speaker: water_rat
          text: This cut is too clean for a branch or stump. Something with a sharp metal edge made it. That's strange.
        - id: ch04-b16
          speaker: narrator
          text: Rat studied the slopes and mounds around them.
        - id: ch04-b17
          speaker: mole
          text: I don't care what made it. It hurts just as much either way.
        - id: ch04-b18
          speaker: narrator
          text: After carefully bandaging Mole's leg, Rat moved away and began scraping at the snow. He scratched, shoveled, and searched with all four paws. Mole waited impatiently and kept urging him to come on. Suddenly Rat shouted and began a weak little dance in the snow.
        - id: ch04-b19
          speaker: water_rat
          text: Hooray! Hooray, hooray, hooray!
          emotion: happy
        - id: ch04-b20
          speaker: mole
          text: What did you find, Ratty?
        - id: ch04-b21
          speaker: water_rat
          text: Come look!
          emotion: happy
        - id: ch04-b22
          speaker: narrator
          text: Mole limped over and examined the object.
        - id: ch04-b23
          speaker: mole
          text: I see it. I've seen plenty of those before. It's a door scraper. So what? Why are you dancing around a door scraper?
        - id: ch04-b24
          speaker: water_rat
          text: Don't you understand what it means, you slow-witted animal?
        - id: ch04-b25
          speaker: mole
          text: Of course I do. Some careless person left his door scraper in the middle of the Wild Wood, exactly where everyone will trip over it. It's terribly thoughtless. When I get home, I'll complain to someone. Just wait and see.
    - id: ch05
      title: Mr. Badger's Door
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: Rat groaned at Mole's failure to understand.
        - id: ch05-b02
          speaker: water_rat
          text: Oh, dear! Stop arguing and help me scrape!
        - id: ch05-b03
          speaker: narrator
          text: Rat stopped arguing and went back to work, flinging snow in every direction. Mole watched while his friend scraped and dug with determined energy. After more hard work, Rat's efforts were rewarded. A very worn and shabby doormat slowly appeared beneath the snow.
        - id: ch05-b04
          speaker: water_rat
          text: There! What did I tell you?
          emotion: happy
        - id: ch05-b05
          speaker: mole
          text: Nothing at all. Now you've found another piece of old household junk, and you're delighted. Dance around it if you must, and then perhaps we can stop wasting time on garbage. Can we eat a doormat? Can we sleep under it? Can we sit on it and sled home through the snow, you maddening rodent?
        - id: ch05-b06
          speaker: water_rat
          text: Are you really saying this doormat tells you nothing?
        - id: ch05-b07
          speaker: mole
          text: Rat, I've had enough of this foolishness. Whoever heard of a doormat telling anyone anything? Doormats don't do that. They know their place.
        - id: ch05-b08
          speaker: water_rat
          text: Listen, you thick-headed beast. That's enough. Don't say another word. Scrape, scratch, dig, and search, especially along the sides of these mounds. If you want a warm, dry place tonight, this is our last chance!
          emotion: angry
        - id: ch05-b09
          speaker: narrator
          text: Rat attacked a nearby snowbank with all his energy. First he pushed his club into every likely place, testing the hidden ground. Then he began to dig furiously. Mole scraped busily beside him, though he did it mainly to please Rat. In Mole's opinion, his friend had become light-headed from cold and exhaustion. They worked hard for about ten minutes. Then the point of Rat's club struck something that answered with a hollow sound. Rat dug faster until he could push one paw through the opening and feel what lay behind the snow. Certain now, he called Mole over to help him.
        - id: ch05-b10
          speaker: narrator
          text: The two animals threw themselves into the work. They scratched and shoveled until the result of all their labor stood fully revealed before Mole, who until that moment had refused to believe Rat's idea. A solid-looking little door was set into the side of what had seemed to be nothing but a snowbank. The door was painted dark green. An iron bell pull hung beside it. Just below the bell pull was a small brass plate. By the light of the moon, they could make out the neat square capital letters engraved upon it. The plate read, “Mr. Badger.”
        - id: ch05-b11
          speaker: narrator
          text: Mole fell backward into the snow, overcome with surprise and delight.
        - id: ch05-b12
          speaker: mole
          text: Rat, you're a wonder! A real wonder, that's what you are! I understand everything now. You worked it all out, one step at a time, inside that wise head of yours. The moment I fell and cut my shin, you studied the wound. Right away, your magnificent mind said, “Door scraper!” Then you searched until you found the very door scraper that had cut me. Did you stop there? No. Plenty of animals would have been satisfied, but not you. Your mind kept working. You said to yourself, “All I need is a doormat, and my theory will be proven.” And of course you found the doormat. You're so clever, I believe you could find anything you wanted. Then you told yourself, “The door exists as surely as if I could see it. All that's left is to uncover it.” I've read about that kind of reasoning in books, but I've never met it in real life. You should go somewhere your genius will be properly appreciated. You're simply wasted here among ordinary fellows like us. If only I had your brain, Ratty—
          emotion: happy
        - id: ch05-b13
          speaker: water_rat
          text: But you don't. So are you going to sit in the snow talking all night? Get up, grab that bell pull, and ring as hard as you can while I knock!
        - id: ch05-b14
          speaker: narrator
          text: Rat hammered the door with his club. Mole leaped for the bell pull, caught it, and swung with both feet off the ground. From somewhere far inside, they faintly heard a deep bell answer.
