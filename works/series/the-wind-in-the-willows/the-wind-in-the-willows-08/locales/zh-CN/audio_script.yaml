audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖从容，带着含蓄的幽默和讲故事的亲近感
        timbre: 清润沉稳
        pace: 中等偏慢
        pitch: 中
    toad:
      display_name: 蟾蜍
      tts:
        delivery: 浮夸善变，自信时神气十足，装可怜时戏剧感强
        timbre: 饱满响亮
        pace: 中等偏快
        pitch: 中高
    gaolers_daughter:
      display_name: 狱卒的女儿
      tts:
        delivery: 热心爽利，温柔中带着机灵和直率
        timbre: 明亮温暖
        pace: 中等
        pitch: 中高
    gaoler:
      display_name: 狱卒
      tts:
        delivery: 粗硬疲惫，说话简短而不耐烦
        timbre: 低沉沙哑
        pace: 中等偏慢
        pitch: 低
    washerwoman:
      display_name: 洗衣妇
      tts:
        delivery: 世故务实，谈条件时干脆利落
        timbre: 苍老结实
        pace: 中等
        pitch: 中低
    ticket_clerk:
      display_name: 售票员
      tts:
        delivery: 公事公办，带着不客气的讥讽
        timbre: 干脆清晰
        pace: 中等偏快
        pitch: 中
    engine_driver:
      display_name: 火车司机
      tts:
        delivery: 豪爽厚道，遇事镇定而有担当
        timbre: 粗犷温厚
        pace: 中等
        pitch: 中低
    fox:
      display_name: 狐狸
      tts:
        delivery: 油滑刻薄，取笑人时漫不经心
        timbre: 轻薄灵活
        pace: 中等偏快
        pitch: 中高
  chapters:
    - id: ch01
      title: 地牢里的烤面包
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 蟾蜍发现自己被关进又湿又臭的地牢，四周全是中世纪堡垒阴森的黑暗。阳光灿烂的世界和铺得平平整整的大路，都隔在一道道高墙外面。不久前，他还在那些路上快活地到处奔驰，神气得仿佛买下了全英国的道路。如今，他只能直挺挺扑在冰冷的地上，流着苦泪，任黑暗的绝望把自己彻底淹没。
        - id: ch01-b02
          speaker: toad
          text: 一切都完了！至少蟾蜍的生涯完了，反正也是一回事。那个人人喜爱、相貌堂堂、富有好客、自由自在又风度翩翩的蟾蜍，再也没有了！我胆敢偷走那么漂亮的汽车，还用那么惊人的无礼去对付一大群胖胖的红脸警察，当然该被关起来。我这头蠢畜生只能在这里熬下去，直到从前以认识我为荣的人，连蟾蜍这个名字也忘了。老獾多么睿智，河鼠多么聪明，鼹鼠又多么明白事理！可怜的蟾蜍却被所有人抛弃了！
          emotion: sad
        - id: ch01-b03
          speaker: narrator
          text: 他就这样哀号着，没日没夜地过了几个星期。正餐不肯吃，两餐之间的点心也不肯碰。那位阴沉衰老的狱卒知道蟾蜍口袋里很有些钱，常常提醒他，只要肯付钱，外面可以送进许多舒服的东西，甚至种种奢侈享受。狱卒有个善良和气的女儿，平日帮父亲做些轻省差事。她最喜欢动物，除了金丝雀，还养着几只花斑小鼠和一只总在转轮里忙个不停的松鼠。白天，金丝雀的笼子挂在城堡主楼厚墙的一枚钉子上，吵得那些爱在午饭后打盹的囚犯不胜其烦。夜里，鸟笼才会放到客厅桌上，罩进一块椅背巾里。
        - id: ch01-b04
          speaker: gaolers_daughter
          text: 爸爸，我真看不得那只可怜的动物这么伤心，身子还一天比一天瘦。把他交给我照料吧。你知道我有多喜欢动物。我会叫他从我手里吃东西，也会让他坐起来，再教他做些别的事。
        - id: ch01-b05
          speaker: gaoler
          text: 随你怎么办。我早受够他闹别扭、摆架子，还有那副小气样儿了。
        - id: ch01-b06
          speaker: narrator
          text: 姑娘当天便动身去做这桩善事。她走到蟾蜍的牢房外，敲响了那扇沉重的门。进门以后，她柔声哄蟾蜍坐起来，擦干眼泪，做一只明白事理的动物，再多少吃一点刚出炉的热晚饭。
        - id: ch01-b07
          speaker: gaolers_daughter
          text: 振作一点吧，蟾蜍。做一只有理性的动物，尝尝我给你带来的饭。还热着呢。
        - id: ch01-b08
          speaker: narrator
          text: 两只盘子之间夹着一份卷心菜炒土豆，香味顿时灌满狭窄的牢房。蟾蜍还沉在悲苦里，趴倒在地，可那股浓浓的卷心菜味钻进鼻子，叫他忽然觉得，生活也许不像自己想的那么空洞绝望。不过，他依旧号哭，双腿乱蹬，说什么也不肯受安慰。聪明的姑娘只好暂且退出去。热卷心菜的味道照例有许多留在牢里。蟾蜍一面抽泣，一面吸着鼻子，慢慢生出一些崭新而振奋的念头。他想起骑士风范和诗歌，也想起世上还有许多功业等着他去做。他看见开阔的草地，牛群在日晒风吹的草地上吃草。他又看见菜园里笔直的香草畦，还有暖阳下引来群蜂的金鱼草。接着，他听见蟾宫的餐桌摆上碗碟时那令人安心的叮当声，也听见大家拉动椅子，凑近桌边认真开吃时，椅脚擦过地板的声音。
        - id: ch01-b09
          speaker: narrator
          text: 狭小牢房里的空气仿佛染上了一层玫瑰色。蟾蜍又想到自己的朋友们，他们一定能想出办法来救他。他还想起那些律师。他们该多喜欢接手这样一桩精彩的案子，而自己竟然没请上几位，真是个傻瓜。最后，他想起了自己的绝顶聪明，还有那一身随机应变的本领。只要肯开动这颗伟大的头脑，他还有什么做不到？等这些念头在脑中转过一遍，他的心病几乎全好了。
        - id: ch01-b10
          speaker: narrator
          text: 几小时后，姑娘端着托盘回来。盘中一杯香茶热气袅袅，旁边堆着滚烫的黄油烤面包。面包切得很厚，两面烤得焦黄。融化的黄油从孔洞里淌下大颗金珠，就像蜂蜜流出蜂房。那股香味简直开口对蟾蜍说起话来，而且说得清清楚楚。它说的是温暖的厨房，是明亮而寒冷的早晨里吃下的早餐，也是冬夜散步归来，穿着拖鞋的双脚架在壁炉围栏上，舒舒服服坐在客厅炉火旁。它还说起满足的猫儿发出的呼噜声，以及困倦的金丝雀细细的啁啾。蟾蜍终于又坐起来，擦干眼睛，啜着茶，嚼着面包，很快便滔滔不绝地说起自己。他说起自己的宅邸和在那里做过的事，说自己如何举足轻重，朋友们又是多么看重他。
        - id: ch01-b11
          speaker: gaolers_daughter
          text: 跟我说说蟾宫吧。听起来一定很美。
        - id: ch01-b12
          speaker: toad
          text: 蟾宫是一所条件优越、设施独立、独一无二的绅士府邸。部分建筑可追溯到十四世纪，却拥有一切现代便利，卫生设备也新式齐全。离教堂、邮局和高尔夫球场只要五分钟，最适合……
        - id: ch01-b13
          speaker: gaolers_daughter
          text: 天哪，你这只动物！我又不想租下它。跟我讲点真正的蟾宫吧。先等一等，我再给你拿些茶和烤面包来。
        - id: ch01-b14
          speaker: narrator
          text: 姑娘脚步轻快地走了，很快又端来满满一盘。蟾蜍狼吞虎咽地扑向烤面包，精神完全恢复到往常的高度。他讲起船屋、鱼池和围着老墙的菜园，又讲猪圈、马厩、鸽房和鸡舍，还讲牛奶房、洗衣房、瓷器柜和亚麻布柜。姑娘尤其喜欢听亚麻布柜。他又讲到宴会厅，说其他动物围坐桌边时，大家在那里何等快活。每逢蟾蜍兴致最好，他会唱歌，会讲故事，也会闹出各式各样的热闹。姑娘接着问起他的动物朋友，听他讲大家怎样生活，平日用什么消遣。她很有见识，绝口不提自己喜欢把动物当作宠物来养，因为她知道蟾蜍听了准会恼火。道晚安以前，她替他装满水壶，又把铺在地上的稻草抖松。此时的蟾蜍，已经和从前那个乐观、自满的动物没什么两样。他唱了一两支宴会上常唱的小曲，蜷进稻草里，美美睡了一夜，还做了最愉快的梦。
        - id: ch01-b15
          speaker: narrator
          text: 此后，阴郁的日子一天天过去，两人却有过许多有趣的谈话。姑娘越来越同情蟾蜍。在她看来，不过犯了这么一点小错，就把一只可怜的小动物关进牢里，实在太不像话。至于蟾蜍，凭着那份自负，当然以为姑娘如此关心自己，是因为心里渐渐生出了爱慕。他甚至有点遗憾，两人的社会地位相差得那么远。毕竟她是个漂亮姑娘，而且显然十分仰慕他。
    - id: ch02
      title: 洗衣妇的衣裳
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 一天早晨，姑娘心事重重，答话漫不经心。蟾蜍很不满意，因为她没有专心欣赏自己的妙语和高明评论。
        - id: ch02-b02
          speaker: gaolers_daughter
          text: 蟾蜍，请你听我说。我有个姨妈，是替人洗衣服的。
        - id: ch02-b03
          speaker: toad
          text: 好啦，别放在心上。我也有好几个姨妈，本来就该去替人洗衣服。
        - id: ch02-b04
          speaker: gaolers_daughter
          text: 你安静一会儿行不行？话太多就是你最大的毛病。我正在动脑筋，你吵得我头疼。我的姨妈替城堡里所有囚犯洗衣服。这种能挣钱的生意，我们总尽量留给自家人。她星期一早晨把脏衣服带走，星期五晚上送回来，今天正是星期四。你很有钱，至少你一直这么说。她却很穷。几英镑对你没什么，对她却很要紧。只要好好买通她，她也许肯把连衣裙和帽子借给你。你就能扮成城堡的洗衣妇逃出去。你们很多地方都很像，尤其是身材。
        - id: ch02-b05
          speaker: toad
          text: 我们才不像！就我这种动物来说，我的身材优雅极了。
        - id: ch02-b06
          speaker: gaolers_daughter
          text: 就我姨妈那样的女人来说，她也优雅极了。不过随你吧。我替你难过，还想办法救你，你这只傲慢又忘恩负义的讨厌动物却不领情！
          emotion: angry
        - id: ch02-b07
          speaker: toad
          text: 对，对，太谢谢你了。可你总不会真叫蟾宫的蟾蜍先生扮成洗衣妇，在乡间到处走吧！
        - id: ch02-b08
          speaker: gaolers_daughter
          text: 那你就以蟾蜍的身份留在这里。我猜你是想坐四马大轿车出去！
          emotion: angry
        - id: ch02-b09
          speaker: narrator
          text: 诚实的蟾蜍向来肯承认错误。
        - id: ch02-b10
          speaker: toad
          text: 你是个善良、仁慈又聪明的姑娘，我的确是只骄傲而愚蠢的蟾蜍。请把那位可敬的姨妈介绍给我。我相信，那位好太太和我一定能谈出让双方都满意的条件。
        - id: ch02-b11
          speaker: narrator
          text: 第二天晚上，姑娘把姨妈领进蟾蜍的牢房。老妇人用毛巾包着蟾蜍这一星期的衣物，还拿别针别得好好的。来见面以前，她已经听姑娘说明了整个计划。走进牢房后，她又看见蟾蜍特意把几枚金镑摆在桌上最显眼的地方。事情到这一步差不多便定了，再没有多少话需要商量。蟾蜍交出钱，换来一件印花棉布长裙、一条围裙、一块披肩和一顶褪色发锈的黑帽子。
        - id: ch02-b12
          speaker: washerwoman
          text: 我只有一个条件。你们得把我堵住嘴，捆起来，扔到墙角。我再编几段像样的说辞。虽然事情看起来可疑，也许还能保住这份差事。
        - id: ch02-b13
          speaker: narrator
          text: 蟾蜍一听这个主意便欢喜极了。这样一来，他可以很有派头地离开监狱，同时又不损害自己作为亡命恶徒的名声。他立刻动手帮狱卒的女儿。他们堵住老妇人的嘴，把她捆好，安置在墙角，尽可能让她看起来像个遭遇了无法抗拒之意外的受害者。
        - id: ch02-b14
          speaker: gaolers_daughter
          text: 现在轮到你了。把外套和背心脱掉，你本来就够胖了。
        - id: ch02-b15
          speaker: narrator
          text: 姑娘笑得浑身发抖，把蟾蜍扣进长裙，又熟练地叠好披肩，把旧黑帽的带子系在他下巴底下。
        - id: ch02-b16
          speaker: gaolers_daughter
          text: 你简直和我姨妈一模一样。不过我敢说，你这辈子从没显得这么体面过。好啦，再见，蟾蜍，祝你好运。沿着来时的路一直往下走。要是有人对你说什么，他们多半会说，男人就是这样。你当然可以回嘴逗他们几句。不过千万记住，你现在是个寡妇，无依无靠地活在世上，还有自己的名声要顾惜。
        - id: ch02-b17
          speaker: narrator
          text: 蟾蜍心里直打哆嗦，脚下却尽量走得坚定。他小心翼翼地踏上这场看起来疯狂又危险万分的冒险，不久便惊喜地发现，一切竟顺利得出奇。不过一想到这份受欢迎的待遇，还有引来欢迎的性别，其实全都属于别人，他又有点泄气。洗衣妇那身眼熟的印花棉布裹着矮胖身子，仿佛一张通行证，每道铁门和阴森的大门都放他过去。就算他迟疑起来，不知该往哪里转，下一道门的看守也会替他解围。那人急着去喝茶，便催他快走，别叫自己整夜等在那里。最大的危险反倒是一路上的玩笑和俏皮话，因为蟾蜍极看重自己的尊严。在他听来，那些玩笑大多拙劣不堪，那些俏皮话则全无半点幽默。可他只能费尽力气压住脾气，按照对方的身份和洗衣妇这个角色来回敬，还得竭力不让言辞越过得体的界限。
        - id: ch02-b18
          speaker: narrator
          text: 蟾蜍觉得这段路仿佛走了好几个钟头。他终于穿过最后一重院子，拒绝最后一间警卫室里那些盛情的邀请，又躲过最后一个看守张开的双臂。那看守装出一副深情的模样，苦苦哀求只要一个临别拥抱。蟾蜍总算甩开了他。紧接着，他听见外面大门的小门在身后咔哒一声关上。外面世界的清新空气拂过他焦灼的额头。直到这一刻，他才真正知道，自己自由了。
    - id: ch03
      title: 没有口袋的旅客
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 这场大胆的行动竟然这样轻易就成功了，蟾蜍兴奋得晕晕乎乎。他朝城里的灯火快步走去，完全不知道下一步该做什么。可有一件事，他心里再清楚不过。自己被迫扮演的这位太太在附近一带实在太有名，也太受欢迎了。他必须尽快离开这里，否则刚刚得到的自由恐怕保不住多久。
        - id: ch03-b02
          speaker: narrator
          text: 他边走边盘算，忽然看见城镇一侧不远处亮着几盏红灯和绿灯。机车喷气喘息的声音，还有调度车厢时的碰撞声，也传进耳中。蟾蜍立刻认出那是一座火车站。这正是他眼下最需要的东西。更妙的是，他不用穿过城镇就能走到那里，也不必继续扮演这个丢脸的角色，靠着那些虽有力量、却丝毫不能维护自尊的回嘴来支撑场面。他赶到车站查看时刻表，发现半小时后正好有一班火车开出，大致朝着他家的方向去。
        - id: ch03-b03
          speaker: toad
          text: 运气又来了！这座车站正是我眼下最需要的东西。
          emotion: happy
        - id: ch03-b04
          speaker: narrator
          text: 他走到售票处，报出离蟾宫所在村庄最近的车站。蟾宫正是那座村庄最显眼的建筑。他习惯性地伸手去摸本该长在那里的背心口袋，想掏出买票的钱。那件一路忠诚帮助他的棉布长裙，却惨遭他无情遗忘，偏在此刻横插进来。蟾蜍像陷进一场噩梦，拼命和这个古怪可怕的东西搏斗。长裙仿佛牢牢缠住他的手，使尽多少力气都顿时化为乌有，还始终在暗暗嘲笑他。别的旅客已经在后面排成长队，不耐烦地等着。有人提出不怎么管用的建议，也有人抛来辛辣程度和中肯程度各不相同的评论。最后，蟾蜍自己也不知道怎么办到的，总算冲破衣裙的重重阻碍，抵达一切背心口袋亘古不变的位置。可那里没有钱，没有装钱的口袋，甚至没有一件背心来装那个口袋。
        - id: ch03-b05
          speaker: narrator
          text: 他惊恐地想起来，外套和背心都留在牢房里。随它们留下的还有钱夹、钱、钥匙、手表、火柴和铅笔盒。对蟾蜍来说，这些东西让生活值得一过。也正是这些宝贝，把口袋众多、堪称万物之主的动物，与那些只长一个口袋，甚至没有口袋，只会随随便便蹦跳走动，根本没为真正的生存竞争做好准备的低等造物区分开来。痛苦之中，他只好孤注一掷，企图蒙混过去。他重新摆出往日那种乡绅兼学院导师的堂皇派头，准备硬撑到底。
        - id: ch03-b06
          speaker: toad
          text: 你听我说，我把钱包落下了。先把票给我，钱明天寄来。我在这一带很有名。
        - id: ch03-b07
          speaker: ticket_clerk
          text: 要是这种把戏常玩，你在这里当然很有名。请让开窗口，太太。你挡着别的旅客了。
        - id: ch03-b08
          speaker: narrator
          text: 一位老先生早就在后面戳他，这会儿干脆把他推到一旁。更糟的是，老先生还管他叫“大嫂”。这一声称呼，比当晚发生的所有事都更叫蟾蜍生气。
        - id: ch03-b09
          speaker: narrator
          text: 蟾蜍碰了钉子，满心绝望，沿着停放火车的站台茫然走去。两行眼泪顺着鼻子两边流下来。安全已经近在眼前，家也几乎近在眼前，他却只因为少了可怜巴巴的几个先令，又碰上吃官家饭的小职员那套斤斤计较的疑心，怎么也上不了车。很快，监狱就会发现他逃跑，追捕也会开始。他会被抓住，挨一顿臭骂，戴上沉重的锁链，重新拖回牢房，继续吃清水面包，睡稻草铺。看守会加倍，刑罚也会加重。更糟的是，那姑娘还不知要说出多少挖苦话来。他跑得不快，身材偏又很容易认出来。能不能钻进车厢座位底下呢？他见过一些学生这样逃票。体贴的父母给了他们路费，他们却把钱挪去做别的、更有价值的事。
        - id: ch03-b10
          speaker: narrator
          text: 蟾蜍正这样盘算着，忽然发现自己已经走到机车前。一个魁梧的司机一手拿油壶，一手抓着一团擦机器的棉纱，正给机车上油、擦拭，满怀爱意地照料它。
        - id: ch03-b11
          speaker: engine_driver
          text: 喂，大娘，出什么事啦？你看起来可不怎么高兴。
        - id: ch03-b12
          speaker: toad
          text: 先生，我是个又穷又苦的洗衣妇，钱全丢了，买不起车票。可我今晚无论如何都得回家，真不知道怎么办才好。哎呀，哎呀！
          emotion: sad
        - id: ch03-b13
          speaker: engine_driver
          text: 这可真糟糕。钱丢了，回不了家。家里想必还有几个孩子等着你吧？
        - id: ch03-b14
          speaker: toad
          text: 多得数也数不清！他们准饿着肚子，还会玩火柴，撞倒油灯。那些天真的小宝贝又要吵架，又要把家里闹得一团糟。哎呀，哎呀！
          emotion: sad
        - id: ch03-b15
          speaker: engine_driver
          text: 这样吧。你靠洗衣服过活，我是个火车司机。这活儿脏得厉害，一件又一件衬衫给糟蹋了，我老婆已经洗烦了。你回家以后替我洗几件，再给我送来，我就让你坐在机车上搭一程。虽然违反铁路公司的规章，可这种偏远地方没那么计较。
        - id: ch03-b16
          speaker: narrator
          text: 蟾蜍的悲苦顿时变成狂喜，他赶紧爬进驾驶室。他当然从没洗过衬衫，也根本不会洗，更不打算现在学。不过他想，回到蟾宫以后，自己可以寄一笔足够洗许多衣服的钱给司机。这样也算履行约定，甚至还更好。
    - id: ch04
      title: 月光下的追车
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 列车员挥动表示放行的旗子，司机快活地鸣笛回应，火车驶出了车站。速度越来越快，蟾蜍望见两旁真正的田野、树木、篱笆、牛群和马匹，全都飞一般从身边掠过。他想到，每过一分钟，自己就离蟾宫更近一点，离那些同情自己的朋友更近一点，也离口袋里叮当作响的钱币、睡觉的软床和可口的食物更近一点。等他回去讲起这场历险，还有自己超凡的聪明才智，又会迎来多少赞美和钦佩！于是，他开始蹦蹦跳跳，高声嚷嚷，还唱起一段段小曲，把司机看得万分诧异。司机从前也偶尔遇见过洗衣妇，虽然两次之间总隔得很久，却从没见过这样的洗衣妇。
        - id: ch04-b02
          speaker: narrator
          text: 火车已经驶过许多英里。蟾蜍正盘算回家以后晚饭该吃什么，忽然发现司机满脸疑惑地探出机车一侧，仔细听着什么。接着，司机爬上煤堆，越过整列火车朝后张望。等他回到蟾蜍身边，脸上的疑惑一点也没有消失。
        - id: ch04-b03
          speaker: engine_driver
          text: 真奇怪。今晚往这个方向开的末班车就是我们，可我敢发誓，后面还有一列车在追！
        - id: ch04-b04
          speaker: narrator
          text: 蟾蜍立刻停止那些轻浮的胡闹，神情变得严肃而沮丧。脊梁骨下端泛起一阵沉沉的痛，一路传到双腿，叫他只想坐下来，拼命不去设想任何可能发生的事情。这时月光已经十分明亮。司机在煤堆上站稳，能够清楚望见身后很长一段铁轨。
        - id: ch04-b05
          speaker: engine_driver
          text: 现在看清了！是一台机车，正沿着我们的铁轨飞快赶来。我们是在被人追！他们越来越近，车上还挤满了最古怪的一帮人。有挥长戟的老狱卒，有挥警棍的警察，还有戴圆礼帽、挥着手枪和手杖的便衣侦探。他们全在喊：“停车！停车！停车！”
          emotion: surprised
        - id: ch04-b06
          speaker: narrator
          text: 蟾蜍蹲进煤屑，拼命想办法，却什么也想不出来。他扑通跪下，合起两只前爪，向司机苦苦哀求。
        - id: ch04-b07
          speaker: toad
          text: 救救我吧，亲爱的好心司机先生！我什么都招。我不是普普通通的洗衣妇，家里也没有孩子等我。我是大名鼎鼎的蟾蜍先生，是拥有地产的绅士。敌人把我扔进地牢，我刚凭着非凡的胆量和智慧逃出来。要是他们把我抓回去，可怜又无辜的蟾蜍就得重新戴锁链，吃清水面包，睡稻草堆！
          emotion: fearful
        - id: ch04-b08
          speaker: engine_driver
          text: 现在说实话。你为什么被关进监狱？
        - id: ch04-b09
          speaker: toad
          text: 也没什么大不了的。我只是趁车主吃午饭时借了他们的汽车，那会儿他们又不用。我真没想偷。可人们，尤其是法官，总爱把一时没多想、兴致又高的举动看得太严重。
        - id: ch04-b10
          speaker: engine_driver
          text: 恐怕你确实是只坏蟾蜍。照理说，我该把你交给法律。不过你正陷在大麻烦里，我不会丢下你。第一，我不喜欢汽车。第二，我在自己的机车上，也不喜欢让警察指手画脚。再说，看见动物掉眼泪，我心里总会软下来。振作点，蟾蜍！我会尽力，咱们也许还能甩掉他们。
        - id: ch04-b11
          speaker: narrator
          text: 两人发疯似的挥动铁铲，一铲又一铲地往炉里添煤。炉膛怒吼，火星飞溅，机车一路跳动摇晃，可后面的追兵仍在一点点逼近。司机望着那台越来越近的机车，终于叹了口气。他抓起一把擦机器的棉纱，抹去额头上的汗。
        - id: ch04-b12
          speaker: engine_driver
          text: 恐怕这样不行。他们没挂车厢，机车又比我们的好。只剩一个办法，也是你唯一的机会。前面有条长隧道，出去以后，铁路会穿过茂密的树林。我们进隧道就开到最快，后面那些人怕出事，一定会减速。出了隧道，我关掉蒸汽，拼命刹车。速度安全以后，你马上跳下去，在他们冲出来看见你以前躲进树林。然后我重新加速，让他们爱追多久就追多久。等我叫你跳，一定要准备好。
        - id: ch04-b13
          speaker: narrator
          text: 两人又往炉里猛添一阵煤。火车射进隧道，机车一路冲撞、轰鸣，哐啷作响，终于从另一端猛冲出去，回到清新的空气和安静的月光下。他们望见铁路两旁黑沉沉的树林，仿佛正在友善地招手。司机马上关掉蒸汽，用尽力气刹车。蟾蜍爬下驾驶室的踏板，紧紧抓住扶手。火车越来越慢，最后几乎只比人步行快一点。
        - id: ch04-b14
          speaker: engine_driver
          text: 现在，跳！
        - id: ch04-b15
          speaker: narrator
          text: 蟾蜍纵身跳下，顺着一段矮坡滚了下去。他爬起来一看，自己毫发无伤，便赶紧冲进树林藏好。他从藏身处向外偷看，只见自己搭乘的火车重新加速，很快便消失在远处。紧接着，追赶的机车怒吼着、鸣笛着，从隧道里猛冲出来。车上那群形形色色的人挥舞着长戟、警棍、手枪和手杖，还在齐声高喊：“停车！停车！停车！”等他们全都冲过去以后，蟾蜍终于放声大笑。这还是他被扔进监狱以来，头一次真正开怀地笑。
    - id: ch05
      title: 陌生的树林
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 可蟾蜍很快便笑不出来了。他这才认真想起自己的处境。眼下夜已深，天又黑又冷。他独自待在一片完全陌生的树林，身上没有钱，晚饭也彻底没了着落，离朋友和家还远得很。方才火车轰隆哐啷，震耳欲聋，如今万籁俱寂。这突如其来的安静反而叫他心里一惊。可是他不敢走出树木的遮蔽，生怕追兵回来发现自己，只能一头朝林子深处钻去，打算尽可能把铁路远远甩在身后。
        - id: ch05-b02
          speaker: narrator
          text: 在高墙里关了这么多个星期以后，蟾蜍觉得树林陌生而不友好，甚至像存心拿他取笑。夜鹰发出机械般的咯咯声，害他以为树林里到处都是正在搜捕的狱卒，包围正从四面八方收紧。一只猫头鹰无声无息地朝他俯冲下来，翅膀擦过他的肩。蟾蜍猛然一跳，恐惧地认定那是一只手碰了自己。猫头鹰却像飞蛾一样飘走，低低地笑着“呵，呵，呵”。蟾蜍觉得，这笑声出现在此时此地，实在很没有品味。
        - id: ch05-b03
          speaker: narrator
          text: 后来，他遇见一只狐狸。狐狸停下脚步，讥讽地把这位洗衣妇从头到脚打量了一遍。
        - id: ch05-b04
          speaker: fox
          text: 喂，洗衣妇！这星期少了半双袜子和一个枕套。下次可别再犯！
        - id: ch05-b05
          speaker: narrator
          text: 狐狸说完便大摇大摆地走了，一路还在窃笑。蟾蜍气坏了，立刻四下寻找石头，想朝那个无礼的家伙扔过去，可树林里偏偏一块合手的石头也找不到。这件事比今晚其他倒霉事更令他恼火。最后，他又冷又饿，累得筋疲力尽，只好在一棵空心树里寻求庇护。他捡来树枝和枯叶，给自己铺成一张尽可能舒服的床，然后蜷在树洞里沉沉睡去，一直睡到天明。
