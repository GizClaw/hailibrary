  chapters:
    - id: ch01
      title: Prison Gloom and Buttered Toast
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            Toad was shut inside a damp, foul-smelling dungeon. Between him and the sunshine stood all the grim stone of an old fortress. Only a short time before, he had been racing happily over England's fine roads as if he owned every one of them. Now he threw himself flat on the floor, cried bitterly, and gave himself up to despair.
        - id: ch01-b02
          speaker: toad
          text: >-
            This is the end of everything! At least, it's the end of Toad's career, and that amounts to the same thing. The popular, handsome Toad! The rich and generous Toad! The free, carefree, charming Toad! How can I ever hope to get out again? I stole such a splendid motorcar so boldly, and then I gave all those fat, red-faced policemen such wonderfully outrageous cheek. They were quite right to lock me up!
          emotion: sad
        - id: ch01-b03
          speaker: narrator
          text: >-
            His sobs stopped him for a moment. Then he began again.
        - id: ch01-b04
          speaker: toad
          text: >-
            What a stupid animal I was! I'll waste away down here until everyone who was once proud to know me has forgotten the name of Toad. Wise old Badger! Clever Rat! Sensible Mole! How well you understood the world! Oh, poor, abandoned Toad!
          emotion: sad
        - id: ch01-b05
          speaker: narrator
          text: >-
            Toad spent several weeks mourning like this, day and night. He refused his meals and even the snacks between them. The grim old gaoler knew Toad had plenty of money in his pockets. He often reminded him that all sorts of comforts could be brought in from outside. With the right arrangements, Toad could even have luxuries. Naturally, every one of them would have its price.
        - id: ch01-b06
          speaker: narrator
          text: >-
            The gaoler had a pleasant, kindhearted daughter who helped him with the easier parts of his work. She loved animals. She kept a canary, several spotted mice, and a restless squirrel that ran round and round in a wheel. During the day, the canary's cage hung from a nail in the massive wall of the keep. Its singing greatly annoyed prisoners who enjoyed a nap after dinner. At night, the cage sat on the parlor table beneath a little cloth cover. When the girl saw how miserable Toad was, she felt sorry for him.
        - id: ch01-b07
          speaker: gaolers_daughter
          text: >-
            Father, I can't stand seeing that poor creature so unhappy and thin. Let me manage him. You know how well I get along with animals. I'll soon have him eating from my hand, sitting up, and doing all sorts of things.
        - id: ch01-b08
          speaker: narrator
          text: >-
            Her father told her to do whatever she liked. He was tired of Toad's sulking, airs, and stinginess. That very day, she went on her mission of kindness and knocked at his cell.
        - id: ch01-b09
          speaker: gaolers_daughter
          text: >-
            Come on, Toad. Sit up, dry your eyes, and try to be sensible. Please eat a little dinner. Look, I brought you some of mine, straight from the oven.
        - id: ch01-b10
          speaker: narrator
          text: >-
            Between two plates was hot bubble-and-squeak. Its smell filled the narrow cell. As Toad lay on the floor in misery, the scent of cabbage reached his nose. For one moment, it suggested that life might not be as empty and hopeless as he had thought. Still, he wailed, kicked his legs, and refused all comfort. The wise girl left him alone for a while.
        - id: ch01-b11
          speaker: narrator
          text: >-
            The smell of hot cabbage stayed behind, as that smell usually does. Between sobs, Toad sniffed, reflected, and slowly began to have new and inspiring thoughts. He thought of brave knights, poetry, and great deeds still waiting to be done. He pictured wide meadows swept by sun and wind, with cattle grazing across them. He saw kitchen gardens, straight borders of herbs, and warm snapdragons crowded with bees. Then he heard the comforting clink of dishes being set on the table at Toad Hall. He heard chair legs scrape over the floor as everyone pulled close and got seriously to work on dinner.
        - id: ch01-b12
          speaker: narrator
          text: >-
            The narrow cell seemed almost rosy now. He remembered his friends and felt sure they would find some way to help him. Then he thought of lawyers. How they would have enjoyed a case like his! What a donkey he had been not to bring in a few of them. Last of all, he remembered his own great cleverness, his endless resources, and everything he could accomplish once he truly put his mighty mind to the problem. By then, he was nearly cured.
        - id: ch01-b13
          speaker: narrator
          text: >-
            A few hours later, the girl came back with a tray. On it stood a cup of fragrant, steaming tea and a plate piled high with toast. Every slice was thick, very hot, and browned deeply on both sides. Golden drops of butter ran through its holes like honey from a honeycomb. That toast spoke clearly to Toad's nose, and it spoke with no uncertain voice. It told him about warm kitchens and breakfast on bright, frosty mornings. It reminded him of cozy winter fires after a long walk, when slippered feet rested by the hearth. It spoke of contented cats purring and sleepy canaries softly twittering.
        - id: ch01-b14
          speaker: narrator
          text: >-
            Toad sat up, dried his eyes, drank the tea, and ate the toast. Before long, he was talking freely about himself, his home, everything he did there, how important he was, and how highly his friends regarded him. The girl could see that this subject helped him just as much as the food, so she kept him talking.
        - id: ch01-b15
          speaker: gaolers_daughter
          text: >-
            Tell me about Toad Hall. It sounds lovely.
        - id: ch01-b16
          speaker: toad
          text: >-
            Toad Hall is a most desirable private residence, entirely unique. Parts of it date from the fourteenth century, but it has every modern convenience. The sanitation is completely up to date. It's only five minutes from the church, the post office, and the golf course. Suitable for... well...
        - id: ch01-b17
          speaker: gaolers_daughter
          text: >-
            Goodness, Toad! I don't want to rent the place. Tell me something real about it. But wait here first. I'll bring you more tea and toast.
          emotion: happy
        - id: ch01-b18
          speaker: narrator
          text: >-
            She hurried off and soon returned with a fresh tray. Toad attacked the toast eagerly, and his spirits climbed all the way back to their usual height. He told her about the boathouse, the fishpond, and the old kitchen garden inside its walls. He described the pigsties and stables, then the pigeon house and henhouse. He went on through the dairy, the washhouse, the china cupboards, and the linen presses. She especially liked hearing about the linen. Then came the great banquet hall. Toad described the wonderful times they had when the other animals gathered around the table and he was at his best, singing songs, telling stories, and generally making the evening lively.
        - id: ch01-b19
          speaker: narrator
          text: >-
            She asked about his animal friends too, and listened closely as he explained where they lived and how they spent their time. She wisely avoided calling them pets, since that would have deeply offended him. At bedtime, she filled his water jug and shook up his straw. Toad was once again his hopeful, self-satisfied old self. He sang a couple of his dinner-party songs, curled into the straw, slept wonderfully, and had delightful dreams.

    - id: ch02
      title: The Washerwoman's Escape
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            As the dreary days passed, Toad and the gaoler's daughter had many interesting talks. She grew very sorry for him. To her, locking up one poor little animal for such a small offense seemed terribly unfair. Vain Toad, of course, misunderstood her interest. He decided her feelings for him must be growing tender. She was a pretty girl and clearly admired him very much. He could not help feeling a little sorry that the enormous difference in their social positions stood between them.
        - id: ch02-b02
          speaker: narrator
          text: >-
            One morning, she seemed lost in thought. Her answers wandered, and she failed to give Toad's witty remarks the attention he believed they deserved. At last, she spoke.
        - id: ch02-b03
          speaker: gaolers_daughter
          text: >-
            Toad, please listen. I have an aunt who works as a washerwoman.
        - id: ch02-b04
          speaker: toad
          text: >-
            There, there. Don't trouble yourself about it. I have several aunts who ought to be washerwomen.
        - id: ch02-b05
          speaker: gaolers_daughter
          text: >-
            Be quiet for one minute, Toad. Your worst fault is talking too much, and you're making my head hurt while I'm trying to think. My aunt washes clothes for every prisoner in this castle. We like to keep paying work in the family. She carries the dirty laundry out on Monday morning and brings it back Friday evening. Today is Thursday.
        - id: ch02-b06
          speaker: gaolers_daughter
          text: >-
            Now, you keep telling me you're rich, and she is very poor. A few pounds would mean little to you and a great deal to her. If you offered the right amount, I think she might lend you her dress, bonnet, and everything else. Then you could walk out of the castle as the official washerwoman. You and my aunt are alike in several ways, especially your figures.
        - id: ch02-b07
          speaker: toad
          text: >-
            We are not alike! My figure is extremely elegant, considering what I am.
          emotion: angry
        - id: ch02-b08
          speaker: gaolers_daughter
          text: >-
            So is my aunt's, considering what she is. But forget it. You're a horrible, proud, ungrateful animal. Here I am feeling sorry for you and trying to help!
          emotion: angry
        - id: ch02-b09
          speaker: toad
          text: >-
            Yes, yes, of course. Thank you very much. But surely you don't expect Mr. Toad of Toad Hall to wander around the country dressed as a washerwoman!
        - id: ch02-b10
          speaker: gaolers_daughter
          text: >-
            Then stay here dressed as a Toad. I suppose you'd rather escape in a carriage pulled by four horses!
          emotion: angry
        - id: ch02-b11
          speaker: narrator
          text: >-
            Honest Toad was always willing to admit when he was wrong.
        - id: ch02-b12
          speaker: toad
          text: >-
            You are a good, kind, clever girl, and I truly am a proud and foolish toad. Please introduce me to your worthy aunt. I'm sure that excellent lady and I can agree on terms that satisfy us both.
        - id: ch02-b13
          speaker: narrator
          text: >-
            The next evening, the girl brought her aunt into Toad's cell. The old woman carried his week's laundry pinned inside a towel, and she already knew about the plan. Toad had thoughtfully set several gold coins on the table in plain sight. One look at them settled nearly everything and left very little to discuss. In exchange for his money, Toad received a printed cotton dress, an apron, a shawl, and a rusty black bonnet.
        - id: ch02-b14
          speaker: washerwoman
          text: >-
            I have just one condition. Tie me up, gag me, and leave me in the corner. Then I can tell a fine story about being overpowered, and perhaps I'll keep my job even if things look suspicious.
        - id: ch02-b15
          speaker: narrator
          text: >-
            Toad loved the idea. He could leave prison in dramatic style and keep his reputation as a desperate, dangerous fellow. He eagerly helped the girl make her aunt look like the innocent victim of events completely beyond her control.
        - id: ch02-b16
          speaker: gaolers_daughter
          text: >-
            Your turn, Toad. Take off your coat and vest. You're quite round enough already.
        - id: ch02-b17
          speaker: narrator
          text: >-
            Shaking with laughter, she fastened him into the cotton dress, folded the shawl neatly around him, and tied the rusty bonnet under his chin.
        - id: ch02-b18
          speaker: gaolers_daughter
          text: >-
            You look exactly like her! In fact, you've probably never looked half this respectable. Goodbye, Toad, and good luck. Go straight down the way you came up. If anyone teases you, and they probably will, tease them right back. Just remember, you're a widow all alone in the world, and you have a reputation to protect.
          emotion: happy
        - id: ch02-b19
          speaker: narrator
          text: >-
            Toad's heart shook, but he made his steps as firm as he could and set out carefully on this wild, dangerous attempt. To his surprise, everything went easily. That discovery pleased him, but it humbled him a little too. All the welcome he received belonged to the washerwoman and the fondness her sex and personality inspired. None of it was really meant for Toad.
        - id: ch02-b20
          speaker: narrator
          text: >-
            Her familiar round shape and cotton dress worked like a passport through every barred door and grim gate. Whenever he paused because he did not know which way to turn, help came without his asking. The warder at the next gate would be eager to get away for tea. Instead of questioning Toad, the man called for the washerwoman to come along quickly and stop keeping him there all night.
        - id: ch02-b21
          speaker: narrator
          text: >-
            The real danger came from all the teasing. Toad had a powerful sense of dignity, and he found the jokes clumsy and not funny at all. Somehow he held his temper. He answered quickly in the washerwoman's manner and tried not to say anything too improper.
        - id: ch02-b22
          speaker: narrator
          text: >-
            It felt like hours before he crossed the last courtyard. He refused the eager invitations coming from the final guardroom. Then he slipped away from the last warder's outstretched arms while the man begged, with pretend passion, for one farewell hug. At last, the little gate in the great outer door clicked shut behind Toad. Fresh air from the outside world touched his worried forehead. He knew then that he was free.
        - id: ch02-b23
          speaker: narrator
          text: >-
            His easy success left him dizzy. He hurried toward the town lights without any idea what to do next. He knew only that he must get far away from the place where this washerwoman was so well known and so popular.

    - id: ch03
      title: No Money for a Ticket
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            As he walked and wondered what to do, Toad noticed red and green lights off to one side of town. Then he heard engines puffing and snorting, and train cars banging together.
        - id: ch03-b02
          speaker: toad
          text: >-
            What luck! A railroad station is exactly what I need. Better still, I can reach it without crossing town. Then I won't have to keep up this humiliating disguise by trading jokes with people. My replies are excellent, of course, but the whole business is beneath my dignity.
          emotion: happy
        - id: ch03-b03
          speaker: narrator
          text: >-
            At the station, he checked the schedule. A train heading more or less toward his home would leave in half an hour.
        - id: ch03-b04
          speaker: toad
          text: >-
            More good luck!
          emotion: happy
        - id: ch03-b05
          speaker: narrator
          text: >-
            His spirits rose as he hurried to buy a ticket. He named the station closest to the village where Toad Hall was the most important sight. Without thinking, he reached for the money in his vest pocket.
        - id: ch03-b06
          speaker: narrator
          text: >-
            The cotton dress, which had served him so nobly until now, suddenly got in his way. Toad had completely forgotten he was wearing it. He wrestled with the strange folds as though trapped in a nightmare. The uncanny thing seemed to hold both his hands, turn every struggle into helpless weakness, and laugh at him all the while. Behind him, a line of travelers formed and grew impatient. They offered suggestions of very different usefulness, along with comments that became sharper and more pointed by the moment.
        - id: ch03-b07
          speaker: narrator
          text: >-
            At last, by some method he never understood, Toad broke through the cloth and reached the place where a vest pocket ought to be. There was no money. There was no pocket to hold money, and no vest to hold a pocket.
        - id: ch03-b08
          speaker: narrator
          text: >-
            With horror, he remembered leaving his coat and vest in the cell. His wallet, money, keys, watch, matches, and pencil case were all still in them. Everything that made life worthwhile was gone. To Toad, those many pockets marked an animal as lord of creation, properly equipped for life's real struggle. Creatures with only one pocket, or no pockets at all, merely hopped or scampered about as best they could.
        - id: ch03-b09
          speaker: narrator
          text: >-
            Miserable but desperate, he tried to bluff his way through. His old grand manner came back, half country gentleman and half university professor.
        - id: ch03-b10
          speaker: toad
          text: >-
            Now, listen. It appears I've left my purse behind. Give me the ticket, please, and I'll send the money tomorrow. Everyone around here knows me.
        - id: ch03-b11
          speaker: narrator
          text: >-
            The clerk stared first at Toad and then at the rusty black bonnet. He laughed.
        - id: ch03-b12
          speaker: booking_clerk
          text: >-
            I'm sure they know you very well if you try this trick often. Move away from the window, madam. You're holding up the other passengers.
        - id: ch03-b13
          speaker: narrator
          text: >-
            An old gentleman had been poking Toad in the back for some time. Now he shoved him aside.
        - id: ch03-b14
          speaker: old_gentleman
          text: >-
            Out of the way, my good woman.
        - id: ch03-b15
          speaker: narrator
          text: >-
            Being called that angered Toad more than anything else that evening. Defeated and full of despair, he wandered blindly down the platform beside the waiting train. Tears ran along both sides of his nose. It seemed terribly cruel. Safety was right before his eyes, and home felt almost within reach. Yet the lack of a few miserable coins, together with one paid official's petty suspicion, stopped him from reaching either one.
        - id: ch03-b16
          speaker: narrator
          text: >-
            Soon the prison would discover his escape, and the hunt would begin. He would be caught, insulted, covered in chains, and dragged back to prison. Bread, water, and straw would be waiting for him. The guards would watch him twice as closely, his punishments would double, and the girl would have endless sarcastic things to say. What could he possibly do? He could not run fast, and his unfortunate shape was far too easy to recognize.
        - id: ch03-b17
          speaker: narrator
          text: >-
            Perhaps he could squeeze beneath a seat in one of the train cars. He had seen schoolboys use that method after taking the travel money supplied by thoughtful parents and spending it on other things they considered much better. While Toad turned the idea over, he found himself beside the engine. Its driver was a broad, powerful man who treated the machine with great affection. He oiled it, wiped it, and cared for it all over, holding an oil can in one hand and a wad of cotton waste in the other.
        - id: ch03-b18
          speaker: engine_driver
          text: >-
            Hello, mother. What's wrong? You don't look very cheerful.
        - id: ch03-b19
          speaker: toad
          text: >-
            Oh, sir, I'm a poor, unhappy washerwoman! I've lost every bit of my money, so I can't buy a ticket. I simply must get home tonight, but I don't know how. Oh dear, oh dear!
          emotion: sad
        - id: ch03-b20
          speaker: engine_driver
          text: >-
            That really is bad. No money, no way home, and I suppose you have children waiting there too?
        - id: ch03-b21
          speaker: toad
          text: >-
            So many children! They'll all be hungry. They'll be playing with matches, knocking over lamps, quarreling, and causing every kind of trouble, the poor little innocents! Oh dear, oh dear!
          emotion: sad
        - id: ch03-b22
          speaker: engine_driver
          text: >-
            Here's what I can do. You say you earn your living washing clothes. Well, I drive an engine, as anyone can see, and this work gets terribly dirty. I go through so many shirts that my wife is worn out from washing them. Promise to wash a few for me when you get home and send them back, and I'll let you ride on my engine. The company forbids it, but out here we don't worry too much about every rule.
        - id: ch03-b23
          speaker: narrator
          text: >-
            Toad's misery became pure joy. He scrambled eagerly into the cab. He had never washed a shirt and would not have known how to begin, but he had no intention of trying. Once safely home at Toad Hall, with money again and pockets to carry it, he would send the driver enough cash to pay for a great deal of laundry. That was just as good, or perhaps better.

    - id: ch04
      title: The Chase on the Rails
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            The guard waved his green flag, and the driver answered with a cheerful whistle. The train pulled away and gathered speed. Soon real fields, trees, hedges, cows, and horses flew past on both sides. Every minute carried Toad closer to Toad Hall and his understanding friends. Soon he would have money jingling in his pockets again, a soft bed to sleep in, and excellent things to eat. Best of all, everyone would praise and admire him when he told the story of his adventures and his unmatched cleverness.
        - id: ch04-b02
          speaker: narrator
          text: >-
            Toad began hopping around the cab, shouting and singing pieces of songs. The driver stared in astonishment. He had met washerwomen now and then, but never one remotely like this.
        - id: ch04-b03
          speaker: narrator
          text: >-
            They traveled mile after mile. Toad was already planning his supper when he noticed the driver's puzzled face. The man leaned over the engine's side and listened. Then he climbed onto the coal and looked back over the train before returning to Toad.
        - id: ch04-b04
          speaker: engine_driver
          text: >-
            This is very strange. We're the last train going this way tonight, but I'd swear I hear another one behind us.
        - id: ch04-b05
          speaker: narrator
          text: >-
            Toad stopped his foolish dancing at once. His face fell, and all his cheer disappeared. A dull pain began low in his back and passed down into his legs. It made him want to sit on the floor of the cab and try with all his strength not to think about the many dreadful things that following engine might mean.
        - id: ch04-b06
          speaker: narrator
          text: >-
            The moon shone brightly now. From his place on the coal, the driver could see far down the track behind them.
        - id: ch04-b07
          speaker: engine_driver
          text: >-
            I see it now! There's an engine on our track, and it's coming fast. It looks as though someone is chasing us!
          emotion: surprised
        - id: ch04-b08
          speaker: narrator
          text: >-
            Toad crouched miserably in the coal dust and tried to think of a plan. Nothing came.
        - id: ch04-b09
          speaker: engine_driver
          text: >-
            They're catching us quickly! And what a strange crowd they've packed onto that engine. I see men who look like ancient warders, waving halberds. There are policemen in helmets, waving clubs. And look at those shabby men in bowler hats. Even from here, anyone can tell they're plainclothes detectives. They're waving pistols and walking sticks. Every one of them is shouting the same thing.
        - id: ch04-b10
          speakers: [pursuing_warder, pursuing_policeman, pursuing_detective]
          ensemble: chorus
          text: >-
            Stop! Stop! Stop!
          emotion: angry
        - id: ch04-b11
          speaker: narrator
          text: >-
            Toad dropped to his knees among the coals and held up his clasped paws.
        - id: ch04-b12
          speaker: toad
          text: >-
            Save me, dear, kind Mr. Engine Driver! Save me, and I'll tell you everything. I'm not the simple washerwoman I appear to be. I have no children waiting for me, innocent or otherwise. I'm a toad, the famous and popular Mr. Toad, owner of a great estate. My enemies threw me into a horrible dungeon, and I have just escaped through my own daring and brilliance. If those men catch me, poor, unhappy, innocent Toad will face chains, bread, water, straw, and misery all over again!
          emotion: fearful
        - id: ch04-b13
          speaker: narrator
          text: >-
            The driver looked down at him sternly.
        - id: ch04-b14
          speaker: engine_driver
          text: >-
            Tell me the truth. Why did they put you in prison?
        - id: ch04-b15
          speaker: toad
          text: >-
            It wasn't anything serious. I only borrowed a motorcar while its owners were eating lunch. They weren't using it then. I truly didn't mean to steal it, but people, especially judges, can be so severe about one thoughtless, high-spirited act.
        - id: ch04-b16
          speaker: narrator
          text: >-
            Toad's face had turned deep red. The driver looked very grave.
        - id: ch04-b17
          speaker: engine_driver
          text: >-
            I'm afraid you have been a very wicked toad. By rights, I should turn you over to the law you offended. But you're plainly in terrible trouble, and I won't abandon you. For one thing, I don't care for motorcars. For another, I don't care for policemen ordering me around on my own engine. And whenever I see an animal crying, my heart goes soft. Cheer up, Toad. I'll do everything I can. We may beat them yet!
        - id: ch04-b18
          speaker: narrator
          text: >-
            They shoveled coal as fast as they could, piling more and more into the furnace. The fire roared, and sparks flew around them. Their engine leaped and swayed beneath their feet. Still, the pursuers slowly gained. At last, the driver let out a sigh and wiped his hot forehead with a handful of cotton waste.
        - id: ch04-b19
          speaker: engine_driver
          text: >-
            I don't think speed will save us, Toad. Their train carries no cars, and their engine is better than ours. We have one last plan, and it's your only chance, so listen closely. Just ahead is a long tunnel. Beyond it, the track runs through thick woods.
        - id: ch04-b20
          speaker: engine_driver
          text: >-
            I'll drive as fast as possible while we're inside the tunnel. They'll naturally slow down a little because they'll be afraid of a crash. As soon as we come out the other side, I'll cut the steam and brake as hard as I can. The moment it's safe, jump off and hide among the trees before they leave the tunnel and spot you. Then I'll open the engine up and race ahead again. They can chase me as long as they like and as far as they like. Be ready, and jump the instant I call.
        - id: ch04-b21
          speaker: narrator
          text: >-
            They threw on still more coal. The train plunged into the tunnel and rushed through with a roar and a rattle. At last, it burst into fresh air and peaceful moonlight. Dark, welcoming woods stood on both sides of the line. The driver shut off the steam and pulled the brakes. Toad climbed onto the step. When the train had slowed almost to walking speed, the driver's call came.
        - id: ch04-b22
          speaker: engine_driver
          text: >-
            Jump now!
        - id: ch04-b23
          speaker: narrator
          text: >-
            Toad jumped. He rolled down a short slope, rose without a scratch, scrambled into the woods, and hid.

    - id: ch05
      title: A Night in the Woods
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: >-
            Peering from his hiding place, Toad watched his train gather speed and vanish. Then the pursuing engine exploded from the tunnel, roaring and whistling. Its odd crew brandished all their weapons as it thundered by.
        - id: ch05-b02
          speakers: [pursuing_warder, pursuing_policeman, pursuing_detective]
          ensemble: chorus
          text: >-
            Stop! Stop! Stop!
          emotion: angry
        - id: ch05-b03
          speaker: narrator
          text: >-
            Once they had passed, Toad laughed heartily. It was his first real laugh since he had been thrown into prison.
        - id: ch05-b04
          speaker: narrator
          text: >-
            The laughter did not last. It was very late now, and the night was dark and cold. Toad stood in woods he did not know, without money or any hope of supper. He was still a long way from his friends and home. After the train's crashing roar and rattle, the dead silence all around him came as a shock. He did not dare leave the shelter of the trees, so he headed deeper into them, hoping to put as much distance as possible between himself and the railroad.
        - id: ch05-b05
          speaker: narrator
          text: >-
            After so many weeks behind stone walls, Toad found the woods strange and unfriendly. He even thought they were making fun of him. Nightjars made their dry, mechanical rattle in the darkness. Each time he heard it, he imagined that the forest was full of searching warders, spreading among the trees and closing in around him.
        - id: ch05-b06
          speaker: narrator
          text: >-
            An owl swept silently toward him and brushed his shoulder with one wing. Toad jumped, certain for one dreadful instant that a hand had reached out and seized him. Then the owl fluttered away through the darkness like a great moth. It called back a low, laughing ho, ho, ho. Under the circumstances, Toad considered that joke to be in extremely poor taste.
        - id: ch05-b07
          speaker: narrator
          text: >-
            Once, he met a fox. The fox stopped, looked him up and down with a mocking expression, and spoke.
        - id: ch05-b08
          speaker: fox
          text: >-
            Well, hello, washerwoman! Last week's laundry was half a pair of socks and one pillowcase short. See that it doesn't happen again!
        - id: ch05-b09
          speaker: narrator
          text: >-
            The fox swaggered away through the woods, snickering to himself. Toad looked all around for a stone to throw after him. He searched the ground carefully, but somehow there was not a single useful stone to be found. That failure annoyed him more than anything the fox had said.
        - id: ch05-b10
          speaker: narrator
          text: >-
            At last, Toad was cold, hungry, and completely worn out. He found shelter inside a hollow tree and made the best bed he could from branches and dead leaves.
        - id: ch05-b11
          speaker: narrator
          text: >-
            There he slept soundly until morning.
