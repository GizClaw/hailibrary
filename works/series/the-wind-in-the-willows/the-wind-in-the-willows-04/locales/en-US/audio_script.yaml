audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm, observant storytelling with gentle humor
        timbre: clear and mellow
        pace: measured
        pitch: medium
    mole:
      display_name: Mole
      tts:
        delivery: earnest, curious, and quick to wonder
        timbre: soft and youthful
        pace: lively
        pitch: medium-high
    water_rat:
      display_name: Water Rat
      tts:
        delivery: friendly, assured, and dryly amused
        timbre: warm and smooth
        pace: easygoing
        pitch: medium
    badger:
      display_name: Badger
      tts:
        delivery: gruff, steady, and quietly kind
        timbre: deep and weathered
        pace: deliberate
        pitch: low
    elder_hedgehog:
      display_name: Elder Hedgehog
      tts:
        delivery: respectful, shy, and careful
        timbre: light and slightly husky
        pace: measured
        pitch: medium-high
    otter:
      display_name: Otter
      tts:
        delivery: hearty, fearless, and playfully boisterous
        timbre: rich and bright
        pace: brisk
        pitch: medium-low
  chapters:
    - id: ch01
      title: Safe in Badger's Kitchen
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Rat and Mole waited so long that they had to stamp their feet in the snow to keep warm. At last, slow shuffling footsteps came toward the door from inside. Mole whispered that it sounded like someone wearing carpet slippers that were too big and worn down at the heels. And that was exactly what it was. A bolt slid back. The door opened just far enough to show a long snout and two sleepy, blinking eyes.
        - id: ch01-b02
          speaker: badger
          text: The very next time this happens, I shall be extremely angry. Who is disturbing people on a night like this? Speak up!
          emotion: angry
        - id: ch01-b03
          speaker: water_rat
          text: Oh, Badger, please let us in! It's Rat, and my friend Mole is with me. We lost our way in the snow.
        - id: ch01-b04
          speaker: badger
          text: Ratty, my dear fellow! Both of you, come in at once. You must be frozen through. Lost in the Wild Wood, in the snow, at this hour! Well, don't stand there. Come inside.
          emotion: surprised
        - id: ch01-b05
          speaker: narrator
          text: In their hurry to get indoors, the two animals nearly tumbled over each other. The door shut behind them, and they heard it with joy and relief. Badger wore a long dressing gown, and his slippers truly were worn down at the heels. He carried a flat candlestick and had probably been going to bed when they knocked. He looked down kindly and patted them both on the head.
        - id: ch01-b06
          speaker: badger
          text: Small animals shouldn't be outside on a night like this. Ratty, I suspect you've been up to some mischief again. Never mind. Come to the kitchen. There's a splendid fire, and supper too.
        - id: ch01-b07
          speaker: narrator
          text: Badger shuffled ahead with the candle while Rat and Mole followed, nudging each other and thinking of supper. They went down a long, gloomy passage. To tell the truth, it was rather shabby. The passage opened into a central hall, where other long tunnels branched away into the darkness. Rat and Mole could see no end to them, and each one seemed full of mystery. But the hall also had solid oak doors that looked warm and welcoming. Badger threw one open, and at once they stepped into the glow of a large kitchen lit by the fire.
        - id: ch01-b08
          speaker: narrator
          text: The floor was worn red brick. Logs burned on a broad hearth between two snug chimney corners built into the wall, safely away from every draft. Two high-backed benches faced each other across the fire, ready for anyone who wanted company. A long table made from plain boards stood on trestles in the middle of the room, with a bench running down either side. At one end, Badger's armchair had been pushed back. Beside it, the remains of his simple but generous supper were still spread out. Spotless rows of plates shone from the dresser at the far end. Hams, bundles of dried herbs, nets of onions, and baskets of eggs hung from the rafters overhead. Heroes could have feasted there after a victory. A whole line of tired harvesters could have eaten, sung, and celebrated the harvest home. Or two or three friends with simple tastes could have sat by the fire as they pleased, eating, smoking, and talking in complete comfort. The red floor seemed to smile at the smoky ceiling. The old oak benches, polished by years of use, looked cheerfully at each other. Plates grinned at pots, and merry firelight danced over everything alike.
        - id: ch01-b09
          speaker: narrator
          text: Kind Badger settled his guests on a bench close to the fire, where they could toast themselves in the heat. He told them to take off their soaked coats and boots, then brought them dry dressing gowns and slippers. He warmed water and washed the cut on Mole's shin himself. After he covered it neatly with sticking plaster, Mole's leg felt as good as new, perhaps even better. Soon both travelers were warm and dry. They rested their tired legs in front of the flames while Badger moved behind them, setting out plates with a promising clink. The warmth seemed to wrap around them. Safe in that light at last, they felt as if the cold, pathless Wild Wood were miles and miles away. Everything they had suffered there seemed no more than a half-forgotten dream.
        - id: ch01-b10
          speaker: narrator
          text: When they had warmed through, Badger called them to the table, where he had been busy preparing supper. They had already been hungry, but once they saw the food, they could hardly decide what to begin with. Everything looked good. The real question was whether the dishes they did not choose first would kindly wait until Rat and Mole could pay attention to them. For a long while, nobody could talk. When conversation slowly returned, it was the unfortunate sort that happens with full mouths. Badger did not object. Elbows on the table and everyone talking at once did not trouble him either. He did not go into Society, and he believed such rules did not truly matter. Of course, we know he was wrong and that they matter very much, though explaining why would take far too long.
        - id: ch01-b11
          speaker: narrator
          text: Badger sat at the head of the table and listened while Rat and Mole told him what had happened. He nodded gravely now and then. Nothing shocked him, and he never told them that he had warned them, or said what they should have done instead. Mole began to feel very friendly toward him.
        - id: ch01-b12
          speaker: narrator
          text: At last supper really was over. Each animal felt as full as he safely could be, and none of them cared much about anything anymore. They gathered around the glowing embers, delighted to be awake so late, so independent, and so wonderfully full. After they had talked about all sorts of things, Badger turned to news from the riverbank.
    - id: ch02
      title: A Plan for Toad
      blocks:
        - id: ch02-b01
          speaker: badger
          text: Now, tell me what's happening in your part of the world. How is old Toad getting along?
        - id: ch02-b02
          speaker: water_rat
          text: Worse and worse. He had another terrible crash just last week. He insists on driving for himself, and he simply can't do it. If he hired a sensible, well-trained animal, paid him properly, and let him handle everything, Toad would be fine. But no. Toad believes he was born a brilliant driver and has nothing to learn. You can guess what happens after that.
        - id: ch02-b03
          speaker: narrator
          text: Rat spoke gravely. Mole lay back on the bench in the firelight with his heels above his head and tried to look mournful.
        - id: ch02-b04
          speaker: badger
          text: How many has he had?
        - id: ch02-b05
          speaker: water_rat
          text: Crashes or cars? With Toad, they amount to the same thing. This makes seven. And you know his coach house? It's piled right to the roof with pieces of motorcars, not one of them larger than your hat. Those pieces are all that remain of the other six, as far as anyone can tell.
        - id: ch02-b06
          speaker: mole
          text: He's been in the hospital three times. And the fines he's paid are dreadful even to think about.
        - id: ch02-b07
          speaker: water_rat
          text: That's part of the trouble. Toad is rich, certainly, but he isn't a millionaire. He drives horribly and pays no attention to law or order. Sooner or later, he'll either be killed or ruined. Badger, we're his friends. Shouldn't we do something?
        - id: ch02-b08
          speaker: narrator
          text: Badger thought very hard for a while. At last he answered rather sternly.
        - id: ch02-b09
          speaker: badger
          text: Now listen. You both understand that I can't do anything about it right now.
        - id: ch02-b10
          speaker: narrator
          text: Rat and Mole agreed. They understood perfectly. Animal manners never require anyone to do anything difficult, heroic, or even fairly active during the winter season. Every animal is sleepy, and some are fast asleep. The weather keeps all of them close to home in one way or another. They need that rest. During the busy half of the year, days and nights are full of hard work. Every muscle is tested, and every bit of energy must be used.
        - id: ch02-b11
          speaker: badger
          text: Very well. But once the year has truly turned and the nights grow shorter, you wake in the middle of the night feeling restless. You want to be up and doing by sunrise, or even earlier. You know the feeling.
        - id: ch02-b12
          speaker: narrator
          text: Both animals nodded solemnly. They knew.
        - id: ch02-b13
          speaker: badger
          text: Then we'll deal with Toad properly. You and I and our friend Mole will take him in hand. We won't allow any nonsense. We'll force him back to reason if we must. We will make him into a sensible Toad. We will... Rat, you're asleep!
        - id: ch02-b14
          speaker: water_rat
          text: I am not!
          emotion: surprised
        - id: ch02-b15
          speaker: narrator
          text: Rat woke with a jerk.
        - id: ch02-b16
          speaker: mole
          text: He's fallen asleep two or three times since supper.
          emotion: happy
        - id: ch02-b17
          speaker: narrator
          text: Mole laughed. He himself felt wide awake and lively, though he did not know why. Mole had been born and raised underground, and Badger's home suited him perfectly. Rat, however, slept each night in a bedroom with windows open to the breezy river. To him, the underground air felt still and heavy.
        - id: ch02-b18
          speaker: badger
          text: Well, we should all go to bed. Come along, you two. I'll show you where you'll sleep. And don't hurry in the morning. Have breakfast whenever you please.
        - id: ch02-b19
          speaker: narrator
          text: Badger fetched flat candlesticks and led them to a long room that was half bedroom and half storeroom. His winter supplies were stacked everywhere. There were piles of apples, turnips, and potatoes, baskets of nuts, and jars of honey. On the clear half of the floor stood two small white beds. They looked soft and inviting. The sheets were coarse but clean and smelled wonderfully of lavender. Rat and Mole threw off their clothes in about thirty seconds and tumbled into bed, happy and content.
    - id: ch03
      title: Visitors at Breakfast
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: Following Badger's kind instructions, the two tired animals slept as long as they liked and came down very late the next morning. A bright fire was already burning in the kitchen. Two young hedgehogs sat side by side on a bench at the table, eating oatmeal porridge from wooden bowls. When Rat and Mole entered, both youngsters dropped their spoons at once. They rose to their feet and respectfully ducked their heads.
        - id: ch03-b02
          speaker: water_rat
          text: Sit down, both of you, and finish your porridge. Where did you youngsters come from? I suppose you got lost in the snow.
        - id: ch03-b03
          speaker: elder_hedgehog
          text: Yes, sir. Little Billy and I were trying to get to school. Mother insisted we go, no matter how bad the weather was. Of course we lost our way. Billy got scared and cried because he's young and not very brave. At last we happened upon Mr. Badger's back door, so we dared to knock. Everyone knows Mr. Badger is a kind gentleman, sir.
        - id: ch03-b04
          speaker: water_rat
          text: I see. What is the weather doing outside? And you don't have to call me “sir” quite so often.
        - id: ch03-b05
          speaker: narrator
          text: Rat cut strips of bacon for himself while Mole dropped eggs into a saucepan.
        - id: ch03-b06
          speaker: elder_hedgehog
          text: Oh, it's terribly bad, sir. The snow is terribly deep. Gentlemen like you won't be able to go out today.
        - id: ch03-b07
          speaker: mole
          text: Where is Mr. Badger?
        - id: ch03-b08
          speaker: narrator
          text: Mole warmed the coffee pot in front of the fire.
        - id: ch03-b09
          speaker: elder_hedgehog
          text: The master has gone into his study, sir. He said he would be especially busy this morning and must not be disturbed for any reason.
        - id: ch03-b10
          speaker: narrator
          text: Everyone understood that explanation. An animal who lives an intensely active life for six months and a sleepy one for the other six cannot always claim to be tired when visitors arrive or chores need doing. If he uses the same excuse every day, people soon grow tired of hearing it. So the animals knew exactly what Badger meant by being busy. After a hearty breakfast, he had gone into his study and settled into an armchair. He had put his feet on a second chair, spread a red cotton handkerchief over his face, and gone to sleep in the usual winter way.
        - id: ch03-b11
          speaker: narrator
          text: The front doorbell rang loudly. Rat's paws were greasy from buttered toast, so he sent little Billy to answer it. They heard a great deal of stamping in the hall. Soon Billy came back with Otter behind him. Otter threw his arms around Rat and greeted him with a joyful shout.
        - id: ch03-b12
          speaker: water_rat
          text: Get off me!
        - id: ch03-b13
          speaker: narrator
          text: Rat sputtered through a mouthful of food.
        - id: ch03-b14
          speaker: otter
          text: I thought I'd find you here. When I reached the River Bank this morning, everyone was in a panic. Rat had not come home all night, and neither had Mole. They were sure something dreadful had happened. The snow had covered every track, of course. But when anyone gets into trouble, they usually go to Badger, or Badger somehow hears about it. So I came straight here through the snow and the Wild Wood.
        - id: ch03-b15
          speaker: otter
          text: What a trip it was! The red sun was rising behind the black tree trunks. Everything else was still. Then a great heap of snow would suddenly slide from a branch and land with a flop. It made you jump and dash for cover. Overnight, the snow had built castles and caves out of nothing. There were snow bridges, terraces, and high walls too. I could have stayed and played among them for hours. Here and there, the weight of the snow had torn down great branches. Robins perched and hopped on them looking so proud, you might think they had broken the branches themselves.
        - id: ch03-b16
          speaker: otter
          text: A ragged line of wild geese flew high across the gray sky. A few rooks circled above the trees, looked things over, and flapped home with disgust on their faces. But I found no sensible creature who could tell me anything. Halfway across the wood, I spotted a rabbit sitting on a stump and washing his foolish face with his paws. He never noticed me creeping up behind him. When I put one heavy front paw on his shoulder, he nearly jumped out of his skin. I had to cuff him once or twice before I could get one sensible answer from him.
        - id: ch03-b17
          speaker: otter
          text: At last he told me one of the rabbits had seen Mole in the Wild Wood last night. Every burrow was talking about it. They knew Mole, Mr. Rat's special friend, was in terrible trouble. He had lost his way, and “They” were out hunting him and chasing him in circles. I asked why none of the rabbits had helped. They may not have much sense, but there are hundreds of them. They're big, sturdy fellows, fat as butter, with burrows running everywhere. They could have taken Mole in and kept him safe and comfortable, or at least tried.
        - id: ch03-b18
          speaker: otter
          text: The rabbit only stared at me and said, “Us? Do something? Us rabbits?” So I cuffed him again and left. Nothing else could be done. At least I had learned something. And if I'd been lucky enough to meet any of “Them,” I would have learned more. Or they would have.
        - id: ch03-b19
          speaker: mole
          text: Weren't you even a little... nervous?
          emotion: fearful
        - id: ch03-b20
          speaker: narrator
          text: At the mention of the Wild Wood, some of Mole's terror from the day before came back. Otter laughed and showed a bright row of strong white teeth.
        - id: ch03-b21
          speaker: otter
          text: Nervous? If any of them tried something with me, I'd make them nervous. Mole, be a good fellow and fry me some ham. I'm terribly hungry, and Ratty and I have a great deal to discuss. I haven't seen him in ages.
        - id: ch03-b22
          speaker: narrator
          text: Good-natured Mole sliced the ham, set the hedgehogs to frying it, and went back to his own breakfast. Otter and Rat put their heads together and talked eagerly about river business. River talk is always long and never seems to end. It runs on just like the babbling river itself.
        - id: ch03-b23
          speaker: narrator
          text: They had emptied one plate of fried ham and sent it back for more when Badger came in, yawning and rubbing his eyes. He greeted everyone in his quiet, simple way and kindly asked how each of them was doing.
        - id: ch03-b24
          speaker: badger
          text: It must be nearly lunchtime. Otter, you had better stay and eat with us. You must be hungry on such a cold morning.
        - id: ch03-b25
          speaker: otter
          text: You bet! Watching these greedy young hedgehogs stuff themselves with fried ham has made me absolutely starved.
        - id: ch03-b26
          speaker: narrator
          text: Otter winked at Mole. The hedgehogs had begun to feel hungry again after their porridge and all their hard work at the frying pan. They looked timidly at Badger but were too shy to speak.
        - id: ch03-b27
          speaker: badger
          text: You two youngsters should go home to your mother now. I'll send someone to show you the way. I don't suppose you'll need any dinner today.
        - id: ch03-b28
          speaker: narrator
          text: Badger gave each hedgehog sixpence and a pat on the head. They left with many respectful waves of their caps and touches to their forelocks.
        - id: ch03-b29
          speaker: narrator
          text: Before long, the four friends sat down to lunch together. Mole found that he had been given the place beside Badger. Across the table, Rat and Otter were still buried in river gossip. Nothing anyone said could pull them away from it. Since Badger and Mole had the chance to talk quietly, Mole told his host just how comfortable the house made him feel. More than comfortable, it felt like home.
        - id: ch03-b30
          speaker: mole
          text: Once you're properly underground, you always know where you stand. Nothing can happen to you, and nothing can reach you. You're your own master. You don't have to ask anyone's permission or worry about what they say. Life goes on overhead, but you can let it go on without bothering about it. Whenever you want to join in, you climb back up, and everything is right there waiting.
        - id: ch03-b31
          speaker: narrator
          text: Badger beamed at him.
        - id: ch03-b32
          speaker: badger
          text: That's exactly what I always say. You can't find real safety, peace, or quiet anywhere but underground. If you need more room, you dig and scrape, and there it is. If the house feels too large, you block a hole or two, and there you are again. No builders, no workers, and no fellows peering over your wall to make comments. Best of all, no weather.
        - id: ch03-b33
          speaker: badger
          text: Look at Rat. A couple of feet of floodwater, and he must move into rented rooms that are uncomfortable, badly placed, and horribly expensive. Then there's Toad. I have nothing against Toad Hall. As houses go, it's the best around. But what if a fire starts? What does Toad do then? What if tiles blow away, walls sink or crack, or windows break? And what if the rooms are drafty? I hate a draft myself. What does Toad do about any of that?
        - id: ch03-b34
          speaker: badger
          text: No. The open air is perfectly good for wandering around and making a living. But when the day is done, you come back underground. That is my idea of home.
        - id: ch03-b35
          speaker: narrator
          text: Mole agreed with all his heart, and Badger grew very friendly toward him.
        - id: ch03-b36
          speaker: badger
          text: After lunch, I'll show you around my little place. I can see you'll value it properly. You understand what a home ought to be.
    - id: ch04
      title: The City Beneath the Wild Wood
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: After lunch, Rat and Otter settled into a chimney corner and began a heated argument about eels. Badger lit a lantern and told Mole to follow him. They crossed the hall and entered one of the main tunnels. In the wavering lantern light, Mole caught glimpses of rooms on either side. Some were no bigger than closets. Others were nearly as broad and grand as Toad's dining room. A narrow side passage led to another corridor, and there the same thing happened again.
        - id: ch04-b02
          speaker: narrator
          text: Mole could hardly believe the size of it all or the way the passages divided and branched. The dim tunnels stretched on and on until their ends vanished. Store chambers had solid vaulted roofs and were packed tightly with supplies. Everywhere he looked, there was careful stonework. He saw heavy walls, pillars supporting the roofs, arches over the passages, and paved floors beneath his feet.
        - id: ch04-b03
          speaker: mole
          text: Badger, how did you ever find the time and strength to make all of this? It's astonishing!
        - id: ch04-b04
          speaker: badger
          text: It certainly would be astonishing if I had made it. But I did none of this. I only cleared the passages and rooms that I needed. There's much more all around us. I can see you don't understand, so I had better explain.
        - id: ch04-b05
          speaker: badger
          text: A very long time ago, before the Wild Wood planted itself here and grew into what it is today, a city stood on this spot. A city of people, Mole. Right where we stand, they lived, walked, talked, slept, and did their work. They kept horses here and held feasts. They rode out from here to fight, or drove away to trade. They were powerful and rich, and they were great builders. They built everything to last because they believed their city would last forever.
        - id: ch04-b06
          speaker: mole
          text: Then what happened to all of them?
        - id: ch04-b07
          speaker: badger
          text: Who can say? People come. They stay awhile, flourish, and build. Then they go. That is their way. But we remain. I've been told that badgers lived here long before the city ever rose, and now badgers are here again. We last. We may leave for a time, but we wait patiently, and in the end we return. It will always be so.
        - id: ch04-b08
          speaker: mole
          text: And after the people finally left?
        - id: ch04-b09
          speaker: badger
          text: Then strong winds and endless rain took over. They worked patiently and never stopped, year after year. Perhaps we badgers helped a little in our own small way. Who knows? Slowly, everything went down. Buildings fell, the ground leveled, and the city disappeared. Then everything began to rise again. Seeds became saplings, and saplings grew into forest trees. Brambles and ferns crept over the ground to help. Layers of old leaves rose and hid what remained. When streams flooded in winter, they carried in sand and soil that clogged the old spaces and covered them. In time, our home was ready for us again, and we moved in.
        - id: ch04-b10
          speaker: badger
          text: The same thing happened on the surface. Animals came, liked the place, made homes, settled down, spread, and prospered. They did not worry about the past. Animals never do. They're too busy. The ground was naturally full of bumps, little hills, and holes, but that helped them. They don't worry about the future either. Perhaps people will return someday, at least for a time. That could easily happen.
        - id: ch04-b11
          speaker: badger
          text: The Wild Wood is crowded now with all the usual sorts, good, bad, and somewhere in between. I won't name anyone. A world needs every kind. But I believe you've learned something about them yourself by now.
        - id: ch04-b12
          speaker: mole
          text: I certainly have.
          emotion: fearful
        - id: ch04-b13
          speaker: narrator
          text: Mole gave a small shiver. Badger patted his shoulder.
        - id: ch04-b14
          speaker: badger
          text: Well, it was your first meeting with them. They really aren't so bad, and we all have to live and let live. Still, tomorrow I'll pass the word around. You won't be troubled again. Any friend of mine goes wherever he likes in this country, or I will find out why.
          emotion: calm
        - id: ch04-b15
          speaker: narrator
          text: Back in the kitchen, they found Rat pacing anxiously. The underground air was weighing on him and making him nervous. He almost seemed afraid the river would run away if he were not there to watch it. He had already put on his overcoat and tucked his pistols into his belt.
        - id: ch04-b16
          speaker: water_rat
          text: Come on, Mole. We need to leave while there's still daylight. I don't want to spend another night in the Wild Wood.
        - id: ch04-b17
          speaker: otter
          text: You'll be fine, my good fellow. I'm going with you, and I know every path with my eyes shut. If any head needs punching, you can count on me to punch it.
        - id: ch04-b18
          speaker: badger
          text: There's no need to worry, Ratty. My tunnels reach much farther than you think. I have hidden exits at several edges of the wood, though I don't tell everyone about them. When you truly must go, you can use one of my shortcuts. For now, relax and sit down again.
          emotion: calm
        - id: ch04-b19
          speaker: narrator
          text: Rat still wanted to leave and look after his river, no matter what anyone said. So Badger picked up the lantern and led them through a damp, airless tunnel. It twisted, curved, and dipped for a weary distance that seemed like miles. Some parts had vaulted roofs, while others had been cut straight through solid rock. At last, a confused patch of daylight appeared ahead through tangled plants hanging over the tunnel mouth. Badger said a quick goodbye and hurried them through the opening. Then he arranged the vines, brush, and dead leaves until the entrance looked natural again, and retreated into the tunnel.
        - id: ch04-b20
          speaker: narrator
          text: They found themselves standing at the very edge of the Wild Wood. Behind them, rocks, brambles, and tree roots lay heaped and tangled together, hiding every sign of Badger's passage. Ahead stretched a great sweep of silent fields. Lines of hedges stood black against the snow and enclosed the white land. Far in the distance, they could see the welcome gleam of their familiar old river. The winter sun hung red and low above the horizon.
        - id: ch04-b21
          speaker: narrator
          text: Otter knew all the paths, so he took charge and led the way. The three friends headed in a straight line across the fields toward a distant stile. There they stopped for a moment and looked back. The whole Wild Wood stood behind them, dense, threatening, compact, and grim against the vast white land. All three turned at the same moment and hurried home. They wanted the glow of their own fires and all the familiar things the light played upon. Most of all, they wanted to hear the cheerful voice of the river outside their windows. They knew the river in every one of its moods and trusted it completely. It never frightened them with anything strange or unexpected.
        - id: ch04-b22
          speaker: narrator
          text: Mole hurried toward home, eagerly thinking of the moment when he would once again be surrounded by all the things he knew and loved. As he went, he understood himself clearly. He was an animal of the plowed field and the hedgerow. He belonged to well-used pastures, lanes where one could linger in the evening, and garden plots that were carefully tended. The hardest parts of wild nature could be left to others. They could choose its roughness, its stubborn demands, and the clash of open conflict. Mole would be wise and remain among the pleasant places where his own life had been laid. Those places held adventure enough in their own way to last him a lifetime.
