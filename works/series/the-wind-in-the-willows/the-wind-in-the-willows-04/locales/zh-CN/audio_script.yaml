audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 温暖从容，带着含蓄的幽默
        timbre: 清澈醇厚
        pace: 舒缓而富于变化
        pitch: 中低
    mole:
      display_name: 鼹鼠
      tts:
        delivery: 诚恳好奇，兴奋时有些冒失
        timbre: 柔和明亮
        pace: 中等偏快
        pitch: 中高
    rat:
      display_name: 河鼠
      tts:
        delivery: 热情老练，随和中带着笃定
        timbre: 温暖清亮
        pace: 从容
        pitch: 中
    badger:
      display_name: 獾
      tts:
        delivery: 沉稳朴实，有长者般的威严与关怀
        timbre: 低沉厚实
        pace: 缓慢从容
        pitch: 低
    elder_hedgehog:
      display_name: 大刺猬
      tts:
        delivery: 恭敬拘谨，带着乡下孩子的朴实
        timbre: 稚嫩清楚
        pace: 中等偏慢
        pitch: 中高
    billy:
      display_name: 小比利
      tts:
        delivery: 年幼羞怯，安静而听话
        timbre: 轻细稚嫩
        pace: 稍慢
        pitch: 高
    otter:
      display_name: 水獭
      tts:
        delivery: 豪爽活泼，自信又爱开玩笑
        timbre: 洪亮爽朗
        pace: 明快
        pitch: 中低
  chapters:
    - id: ch01
      title: 风雪夜的来客
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 两位在门外等了很久，只能不停跺着雪，好让脚别冻僵。终于，门里响起慢吞吞的脚步。那声音拖拖沓沓，一点点靠近门口。
        - id: ch01-b02
          speaker: mole
          text: 听起来像是谁穿着一双太大的毡拖鞋，连鞋后跟都踩塌了。
        - id: ch01-b03
          speaker: narrator
          text: 鼹鼠还真猜对了。门闩哗啦一响，门开了一条窄缝，里面露出一张长嘴，还有一双困得直眨的眼睛。
        - id: ch01-b04
          speaker: badger
          text: 再有下一回，我可真要发火了！这种夜里，又是谁来打搅人？快说！
          emotion: angry
        - id: ch01-b05
          speaker: rat
          text: 獾，求你让我们进去吧！是我，河鼠，还有我的朋友鼹鼠。我们在大雪里迷路了。
        - id: ch01-b06
          speaker: badger
          text: 什么，是小河鼠，我亲爱的老弟！你们两个快进来，马上进来。瞧这模样，一定都冻透了吧！大半夜在荒林的雪里迷路，真没想到。快进屋！
          emotion: surprised
        - id: ch01-b07
          speaker: narrator
          text: 两个动物急着跨进门，彼此绊成了一团。身后的门一关，他们听着那声音，心里别提多踏实了。獾披着长睡袍，脚上的拖鞋果然大得不合脚，鞋跟也踩塌了。他端着一只扁烛台，看样子原本正要睡觉。此刻，他慈爱地低头瞧着两位，还拍了拍他们的脑袋。
        - id: ch01-b08
          speaker: badger
          text: 这种天气，小动物不该待在外面。河鼠，你们恐怕又淘气惹事了吧。来，跟我去厨房。那儿有一炉好火，也有晚饭，什么都不缺。
        - id: ch01-b09
          speaker: narrator
          text: 獾端着灯在前面拖着脚走。鼹鼠和河鼠跟在后面，满怀期待地碰了碰胳膊肘。他们先走过一条又长又暗、实在有些破旧的甬道，来到一处中央大厅。微弱的烛光下，还有许多隧道般的长廊从这里通向四面八方，幽深得望不见尽头。大厅周围立着几扇厚实的橡木门。獾推开一扇，温暖明亮的炉火立刻迎面照来。他们走进了一间大厨房。
        - id: ch01-b10
          speaker: narrator
          text: 厨房地面铺着磨得光滑的红砖。宽大的壁炉里木柴烧得正旺，两边各有一个藏在墙内的壁炉角，穿堂风一点也钻不进去。高背长椅隔着炉火相对摆放，屋子中间是一张架在支架上的普通木板长桌，两侧都有长凳。桌子一头的扶手椅已经推开，獾那顿朴素又丰盛的晚饭还留在桌上。房间尽头，一排排洁净的盘子从餐具柜上闪着光。头顶的梁木下吊着火腿、干香草、成网的洋葱，还有一篮篮鸡蛋。
        - id: ch01-b11
          speaker: narrator
          text: 这里可以让凯旋的英雄痛快吃一顿，也可以让一大群疲惫的收割工人围住长桌，唱着歌庆祝丰收。若只是两三个趣味朴素的朋友，也能随意坐下，吃东西，抽烟，说话，舒舒服服，心满意足。红砖地面朝烟熏的天花板微笑。磨亮的橡木长椅愉快地交换眼色。盘子冲着锅咧嘴，欢快的火光则不偏不倚，在每一样东西上跳动。
        - id: ch01-b12
          speaker: narrator
          text: 好心的獾把客人按到长椅上烤火，让他们脱掉湿外套和靴子，又找来睡袍与拖鞋。他亲自用温水洗净鼹鼠的伤腿，再贴好胶布。那道伤口简直和新的一样，甚至比新的更好。鼹鼠和河鼠终于又暖又干。他们把累坏的腿支在前面，听着身后摆放盘子的清脆声响，只觉得自己已经驶进安全的港湾。门外冰冷、没有道路的荒林远在千百英里之外，刚才吃过的苦也快变成一场记不清的梦了。
        - id: ch01-b13
          speaker: narrator
          text: 等他们彻底暖过来，獾便招呼两位上桌。他刚才一直忙着摆放晚饭。他们早就饿了，可亲眼看见满桌食物以后，难题反而更多。每一样都那么诱人，该先吃哪一道呢？别的食物又肯不肯等到他们腾出嘴来？一开始，谁也顾不上谈话。后来总算有人开口，嘴里却还塞满食物，实在谈不上体面。獾完全不在意。他也不管谁把胳膊肘支在桌上，或者大家抢着同时说话。
        - id: ch01-b14
          speaker: narrator
          text: 獾自己从不参加社交，所以一直以为这些规矩并不重要。当然，我们知道他错了，而且想得太窄，因为它们实在重要得很。至于为什么，解释起来就太长了。獾坐在桌首的扶手椅里，听他们从头讲完风雪中的遭遇，只是隔一阵严肃地点点头。不管听到什么，他都不显得吃惊或震动。他既不责怪，也没说过“我早就告诉你了”，更没数落他们本该做什么，不该做什么。鼹鼠越来越喜欢这位主人。
        - id: ch01-b15
          speaker: narrator
          text: 晚饭终于真正吃完。每个动物的皮都绷得紧紧的，已经到了体面所能允许的极限。他们觉得无论遇上谁、遇上什么事，自己都不在乎了。他们围着大壁炉通红的余烬坐下，熬到这样晚还不睡，肚子又填得这样饱，还完全无拘无束，只觉得自由自在。大家闲谈了一会儿，獾提起了河岸那边的消息。
        - id: ch01-b16
          speaker: badger
          text: 好啦，说说你们那一带的新鲜事吧。老蟾蜍最近过得怎么样？
        - id: ch01-b17
          speaker: rat
          text: 越来越糟。就在上星期，他又撞坏一辆车，而且撞得很厉害。他偏要亲自驾驶，可他根本不会。只要肯雇一个稳当、正派、受过训练的动物，给人家一份好工钱，再把车全交给人家管，他本来什么事也没有。可蟾蜍认定自己生来就是驾车的天才，谁也教不了他。后面的乱子自然全来了。
        - id: ch01-b18
          speaker: narrator
          text: 鼹鼠斜躺在长椅上烤火，两只脚翘得比脑袋还高，也努力摆出一副愁容。獾的脸色沉了下来。
        - id: ch01-b19
          speaker: badger
          text: 他已经撞过多少辆了？
        - id: ch01-b20
          speaker: rat
          text: 你问撞车的次数，还是撞坏的汽车？对蟾蜍来说，两样反正是一回事。这次是第七辆。他的车库里全是汽车碎片，真的一直堆到屋顶，还没有哪一块比你的帽子更大。那就是前六辆的下落，如果还能算得清的话。
        - id: ch01-b21
          speaker: mole
          text: 他还住过三次医院。至于那些罚款，光想一想都吓人。
        - id: ch01-b22
          speaker: rat
          text: 这也是麻烦的一部分。蟾蜍确实有钱，可他不是百万富翁。他的车开得糟透了，还完全不理会法律和规矩。迟早只有两个结果，不是送命，就是破产。獾，我们是他的朋友，难道不该管一管吗？
        - id: ch01-b23
          speaker: narrator
          text: 獾费力地思索了一阵，最后严肃地开了口。
        - id: ch01-b24
          speaker: badger
          text: 你们听好。眼下我什么也做不了，这一点你们当然明白吧？
        - id: ch01-b25
          speaker: narrator
          text: 两位朋友都点头。他们当然明白。按照动物世界的规矩，冬天这个歇息时节，谁也不能指望动物去做费力的事、英勇的事，甚至稍微需要活动的事。大家全都昏昏欲睡，有些已经真的睡着。天气多少都把他们困住了。他们正在休养，因为那些艰苦日子曾把每一块肌肉都逼到极限，把每一分精力都绷得紧紧的。
        - id: ch01-b26
          speaker: badger
          text: 那就好。可是等年头真的转过去，夜晚变短，你睡到半夜忽然醒来，觉得坐也不是，躺也不是，只想赶在日出时起来做点事，甚至恨不得更早。你们懂吧？
        - id: ch01-b27
          speaker: narrator
          text: 两位严肃地点头。他们懂。
        - id: ch01-b28
          speaker: badger
          text: 到了那时候，我们三个就认真管一管蟾蜍。绝不再让他胡闹。哪怕硬来，也要让他恢复理智。我们一定逼他做一只明白事理的蟾蜍。我们要——河鼠，你睡着了！
        - id: ch01-b29
          speaker: rat
          text: 我才没睡！
          emotion: surprised
        - id: ch01-b30
          speaker: narrator
          text: 河鼠猛地惊醒。鼹鼠笑了起来。
        - id: ch01-b31
          speaker: mole
          text: 晚饭以后，他已经睡着两三回了。
          emotion: happy
        - id: ch01-b32
          speaker: narrator
          text: 鼹鼠自己倒十分清醒，甚至精神勃勃，却不明白这是为什么。其实他天生就是地下动物，祖祖辈辈也都生活在地下。獾的家正合他的心意，让他觉得回到了自己的家。河鼠则不同。他每天睡觉的房间都开着窗，窗外就是吹着清风的河。这里静止的空气自然让他觉得沉闷难受。
        - id: ch01-b33
          speaker: badger
          text: 好啦，大家都该睡觉了。你们两个跟我来，我领你们去房间。明早不用赶，想几点吃早饭都行！
        - id: ch01-b34
          speaker: narrator
          text: 獾取来扁烛台，把他们带到一间长屋。一半像卧室，一半像阁楼。屋里到处是獾储存的过冬食物。成堆的苹果、芜菁和土豆，装满坚果的篮子，还有一罐罐蜂蜜，占去了半间屋。另一半摆着两张白色小床，看起来又软又舒服。粗布床单洗得干干净净，还带着好闻的薰衣草香。鼹鼠与河鼠只用了大约三十秒，便把身上的衣服全抖落下来。他们满心欢喜，也满心满足，一头钻进床单之间。
    - id: ch02
      title: 獾宅的早晨
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 第二天，两位疲惫的客人听从獾的嘱咐，很晚才下楼吃早饭。厨房里的炉火烧得明亮。桌旁坐着两只小刺猬，正用木碗喝燕麦粥。鼹鼠和河鼠一进门，他们就放下勺子，站起来恭恭敬敬地点头。
        - id: ch02-b02
          speaker: rat
          text: 坐吧，坐吧，接着喝你们的粥。你们两个小家伙从哪里来的？是在雪里迷了路，对不对？
        - id: ch02-b03
          speaker: elder_hedgehog
          text: 是的，先生。我和小比利原本要去学校。天气再坏，妈妈也非要我们去不可，我们当然就迷路了，先生。比利年纪小，胆子也弱，吓得哭了。最后我们碰巧到了獾先生的后门，就冒昧敲了门。人人都知道，獾先生是一位好心的绅士——
        - id: ch02-b04
          speaker: narrator
          text: 河鼠从一大块咸肉上切下几片，鼹鼠则把鸡蛋放进炖锅。
        - id: ch02-b05
          speaker: rat
          text: 我明白了。外面的天气怎么样？还有，不用一口一个“先生”地叫我。
        - id: ch02-b06
          speaker: elder_hedgehog
          text: 哦，天气糟透了，先生。雪深得吓人，像你们这样的绅士，今天可出不了门。
        - id: ch02-b07
          speaker: narrator
          text: 鼹鼠把咖啡壶放到炉边温着。
        - id: ch02-b08
          speaker: mole
          text: 獾先生在哪里？
        - id: ch02-b09
          speaker: elder_hedgehog
          text: 主人去书房了，先生。他说今天早上会特别忙，无论如何也不许别人打搅。
        - id: ch02-b10
          speaker: narrator
          text: 屋里的每一个动物都完全明白这番话。一年里，动物们有六个月忙得不可开交，另外六个月却昏昏沉沉，甚至一直睡觉。到了后面这段日子，有人在身边，或者有事要办时，就不能回回都说自己困了。这个借口会叫人听腻的。他们都知道，獾吃过一顿丰盛的早饭，已经躲进书房。他会坐在扶手椅里，把脚架到另一把椅上，脸上盖一条红棉手帕，照着这个季节的老习惯“忙碌”。
        - id: ch02-b11
          speaker: narrator
          text: 前门铃忽然哐啷啷大响。河鼠吃黄油烤面包吃得满手油，便叫小比利去看看是谁。门厅里响起一阵跺脚声。没多久，比利走在前面回来，水獭跟在身后。水獭一见河鼠，便大叫着扑过来抱住他。
        - id: ch02-b12
          speaker: rat
          text: 快放开我！
        - id: ch02-b13
          speaker: narrator
          text: 河鼠嘴里塞满了食物，声音含含糊糊。
        - id: ch02-b14
          speaker: otter
          text: 我就知道，一定能在这里找到你。今天早上我到了河岸，大家都急坏了。河鼠整夜没回来，鼹鼠也没回来，他们认定你们出了大事。大雪又把所有脚印盖住了。不过我知道，谁碰上难处，多半会来找獾。就算没来，獾也总会知道消息。所以我穿过荒林和大雪，直接赶来了！
        - id: ch02-b15
          speaker: otter
          text: 红太阳升起来，照着黑树干时，走在雪里真叫人痛快。四周一点声音也没有，树枝上的大团积雪却会突然“扑”一声滑下来，吓得你一跳，赶紧跑开。一夜之间，雪地里冒出城堡、洞穴、桥梁、台地和堡垒。我在那里玩上几个钟头也不会厌。有些粗大的树枝经不住积雪，已经折断了。知更鸟神气地落在上面蹦来蹦去，好像树枝是它们亲手折的一样。
        - id: ch02-b16
          speaker: otter
          text: 一列乱糟糟的雁群从灰色天空高处飞过。几只秃鼻乌鸦在树顶转了一圈，查看过后，便一脸嫌弃地飞回家。可我没遇见一个明白事理的家伙，连消息也没处问。走到一半，我看见一只兔子坐在树桩上，用爪子洗那张傻脸。我悄悄绕到他背后，把沉重的前爪往他肩上一搭，可把他吓坏了。我还拍了他脑袋一两下，才让他讲出一点有用的话。
        - id: ch02-b17
          speaker: otter
          text: 他总算承认，昨晚有兔子在荒林里见过鼹鼠。所有兔子洞都在议论，说鼹鼠，也就是河鼠先生最要好的朋友，遇上了大麻烦。他迷了路，“那些家伙”已经全出来了，正追着他一圈又一圈地跑。我就问那只兔子，你们为什么不做点什么？也许你们没脑子，可你们成百上千，个个又大又壮，肥得像黄油，洞穴还四通八达。你们本可以收留鼹鼠，让他平安舒服些，至少也该试试。
        - id: ch02-b18
          speaker: otter
          text: 你猜他怎么回答？“什么，我们？做点事？我们兔子？”所以我又拍了他一下，转身走了。除此之外也没别的办法。反正我问到了一点消息。要是有运气撞见“那些家伙”，我还能知道得更多。或者说，他们会知道得更多。
        - id: ch02-b19
          speaker: narrator
          text: 一听到荒林，鼹鼠又想起昨天的恐怖，心里不由得发紧。
        - id: ch02-b20
          speaker: mole
          text: 你一点也不觉得……紧张吗？
          emotion: fearful
        - id: ch02-b21
          speaker: narrator
          text: 水獭笑了，露出一排又白又结实的牙齿。
        - id: ch02-b22
          speaker: otter
          text: 紧张？谁要敢找我的麻烦，我就让谁尝尝紧张的滋味。鼹鼠，做个好老弟，给我煎几片火腿吧。我饿得要命，还有一肚子话要同河鼠说。我可太久没见他了。
        - id: ch02-b23
          speaker: narrator
          text: 好脾气的鼹鼠切好火腿，让两只小刺猬替他煎，自己回去接着吃早饭。水獭与河鼠把脑袋凑在一起，兴冲冲地谈起河上的行当。这种行话说来很长，也永远说不完。一个话头接着另一个话头，正像那条河一路潺潺流动，没有停下来的时候。
        - id: ch02-b24
          speaker: narrator
          text: 一盘煎火腿刚吃光，又送回去添新的，獾便进来了。他打着哈欠，揉着眼睛，安安静静向大家问好，又亲切地挨个问候。
        - id: ch02-b25
          speaker: badger
          text: 看时辰，该快吃午饭了。水獭，不如留下来一起吃吧。这样冷的早晨，你一定饿了。
        - id: ch02-b26
          speaker: otter
          text: 那还用说！看着这两只贪吃的小刺猬拼命往肚里塞煎火腿，我简直要饿昏了。
        - id: ch02-b27
          speaker: narrator
          text: 水獭朝鼹鼠眨眨眼。两只小刺猬刚才喝过粥，随后又辛辛苦苦煎了半天火腿，这会儿肚子恰好又开始饿了。他们怯生生望向獾，却害羞得一句话也不敢说。
        - id: ch02-b28
          speaker: badger
          text: 你们两个小家伙该回家找妈妈了。我会派个人送你们，免得再迷路。今天你们肯定不用吃午饭，我敢保证。
        - id: ch02-b29
          speaker: narrator
          text: 獾给了他们一人六便士，又各自拍了拍脑袋。两个孩子恭恭敬敬地挥着帽子，摸着额前行礼，这才离开。
    - id: ch03
      title: 地下的城
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 不久，大家坐下来吃午饭。鼹鼠挨着獾先生。水獭与河鼠仍沉浸在河上的闲谈里，什么也打断不了他们。鼹鼠便趁机告诉獾，自己在这座地下宅院里觉得非常舒服，简直像回了家。
        - id: ch03-b02
          speaker: mole
          text: 只要安安稳稳住进地下，你就知道自己在哪里。不会有什么事突然落到头上，也没有东西能伤到你。你完全是自己的主人，不用跟谁商量，更不用理会别人说什么。头顶上的事情照旧发生，你就让它们发生，根本不用操心。哪天你想上去，往上一钻，那些事情还在那里等着你。
        - id: ch03-b03
          speaker: narrator
          text: 獾听得满面生光。
        - id: ch03-b04
          speaker: badger
          text: 我说的就是这个！真正的安全、安宁和清静，只有地下才有。要是想法变大，想把家扩一扩，挖几下，刨几下，立刻就成。若觉得房子有点太大，堵上一两个洞口，也马上妥当。不用建筑工，不用匠人，更没有哪个家伙从墙头探进脑袋，对你评头论足。最要紧的是，地下没有天气来捣乱。
        - id: ch03-b05
          speaker: badger
          text: 看看河鼠。洪水只要涨起两英尺，他就得搬进租来的房子。住得不舒服，地方不方便，还贵得吓人。再说蟾蜍。我不是说蟾宫不好。只当一栋房子看，它确实是这一带最好的。可一旦失火，蟾蜍怎么办？瓦片吹跑，墙壁下沉开裂，窗子破掉，他又怎么办？房间里若有穿堂风，他还能怎么办？我自己最恨穿堂风。
        - id: ch03-b06
          speaker: badger
          text: 所以说，地面上很适合到处走，也适合讨生活。可一天结束以后，要回的家还得在地下。这才是我心目中的家！
        - id: ch03-b07
          speaker: narrator
          text: 鼹鼠打心眼里赞同，獾也因此越发喜欢他。
        - id: ch03-b08
          speaker: badger
          text: 午饭以后，我带你看看我这个小住处。我看得出来，你会懂得欣赏。居家的房子究竟该怎么造，你是真明白。
        - id: ch03-b09
          speaker: narrator
          text: 午饭吃完，河鼠和水獭窝进壁炉角，为鳗鱼争得热火朝天。獾点起提灯，带鼹鼠穿过大厅，走进一条主要隧道。灯光一路摇晃，照出两旁大大小小的房间。有些只是储物小间，有些却几乎和蟾宫的餐厅一样宽阔气派。他们又从一条直角岔开的窄道走进另一条长廊，那里还是同样的景象。
        - id: ch03-b10
          speaker: narrator
          text: 鼹鼠被这座宅院的规模惊住了。它实在太大，通道又一条连着一条，彼此交错。幽暗的走廊长得望不到头，塞满东西的储藏室顶着坚固的拱券。无论灯光照向哪里，都能看见石砌的墙、粗壮的柱子、拱门和铺得平整的地面。
        - id: ch03-b11
          speaker: mole
          text: 天哪，獾！你究竟从哪里找来这么多时间和力气，做完这一切？实在太惊人了！
          emotion: surprised
        - id: ch03-b12
          speaker: badger
          text: 如果真是我做的，那确实很惊人。可这些全不是我造的。我只按照自己的需要，清理出一些走廊和房间。四周还多得很呢。我看你不明白，还是让我解释吧。
        - id: ch03-b13
          speaker: badger
          text: 很久很久以前，荒林还没在这里扎根，更没长成如今的模样，这片土地上曾经有一座城。是一座人类的城。就在我们脚下，他们生活、行走、说话、睡觉，也在这里做买卖。他们在这里养马、摆宴席，再从这里骑马出去打仗，或者赶车出去经商。他们强盛又富有，还很会建造。他们造东西，总想让它长久存在，因为他们认定自己的城市永远不会消失。
        - id: ch03-b14
          speaker: mole
          text: 可后来，那些人全去了哪里？
        - id: ch03-b15
          speaker: badger
          text: 谁知道呢？人类来了，住上一阵，兴盛起来，建造东西，然后又走了。他们一向如此。可是我们留下来。听说那座城市还没出现以前，这里就住着獾。如今，这里又住着獾。我们这一族很能长久。也许会暂时搬走，可我们会等待，会耐心守候，最后又搬回来。以后也永远如此。
        - id: ch03-b16
          speaker: mole
          text: 那么，那些人最后离开以后，又发生了什么？
        - id: ch03-b17
          speaker: badger
          text: 人类走后，强风和下个不停的雨接管了一切。它们很耐心，从不休息，一年又一年地干下去。也许我们獾也用自己的小办法帮过一点忙，谁知道呢？先是所有东西一点点往下沉，往下沉。它们坍塌了，被夷平了，最后消失不见。
        - id: ch03-b18
          speaker: badger
          text: 接着，新的东西又一点点往上长，往上长。种子变成幼树，幼树长成森林里的大树。荆棘和蕨草也慢慢爬进来帮忙。腐叶土越积越高，把旧日痕迹全抹掉。冬天暴涨的溪水带来泥沙，堵住空隙，再把一切盖住。日子久了，我们的家重新准备妥当，我们也就搬了回来。
        - id: ch03-b19
          speaker: badger
          text: 地面上也是一样。动物们来到这里，觉得地方不错，便住下，安家，繁衍，渐渐兴旺。他们不操心过去，从来都不，因为眼前的事已经够忙。这里有些高低不平，到处都是土包和洞穴，可对他们反而方便。他们也不担心将来。也许有一天，人类会重新搬来，再住上一阵。这完全可能。
        - id: ch03-b20
          speaker: badger
          text: 如今荒林里的居民已经很多。好的，坏的，不好不坏的，各种常见家伙都有。我就不点名了。一个世界里，本来就得有各种各样的居民。不过到了现在，你大概也亲自认识过其中一些了。
        - id: ch03-b21
          speaker: narrator
          text: 鼹鼠轻轻打了个寒战。
        - id: ch03-b22
          speaker: mole
          text: 我确实认识过了。
        - id: ch03-b23
          speaker: narrator
          text: 獾拍了拍他的肩膀。
        - id: ch03-b24
          speaker: badger
          text: 好啦，那只是你第一次碰上他们。其实他们没有那么坏，大家总得互相容让，各过各的日子。不过明天我会把话传遍各处。以后你应该不会再遇到麻烦。我的朋友在这一带想走哪里就走哪里。要不然，我非问问理由不可！
    - id: ch04
      title: 回到熟悉的河岸
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 他们回到厨房，发现河鼠正在焦躁地来回走。地下的空气压得他难受，弄得他越来越紧张。他好像真怕自己不在一旁照看，那条河便会径自跑掉。河鼠已经穿好大衣，还把手枪重新插进腰带。一看见鼹鼠，他马上迎了过去。
        - id: ch04-b02
          speaker: rat
          text: 快走吧，鼹鼠。我们得趁天还亮赶紧动身。我可不想再在荒林里过一夜。
        - id: ch04-b03
          speaker: otter
          text: 不会有事的，我的好老弟。我和你们一起走。那些路，我闭着眼睛也认得。要是哪个家伙的脑袋欠揍，你们尽管交给我。我准会揍上去。
        - id: ch04-b04
          speaker: badger
          text: 河鼠，你真的不用着急。我的地道比你想的远得多。我还有几个秘密出口，通到树林边缘的不同地方，只是不愿让人人都知道。等你们非走不可时，我让你们从近道出去。现在先放心坐一会儿吧。
          emotion: calm
        - id: ch04-b05
          speaker: narrator
          text: 河鼠还是一心想回去照看自己的河。獾只好再次提起灯笼，在前面带路。大家走进一条潮湿、闷得透不过气的隧道。它弯弯曲曲，时高时低，有些地方砌着拱顶，有些地方则从坚硬的岩石里直接凿穿。路长得让人疲惫，仿佛足有几英里。终于，纠结在洞口的草木后面透出朦胧的日光。
        - id: ch04-b06
          speaker: narrator
          text: 獾匆匆向他们道别，把三位赶紧推出洞口。随后，他用藤蔓、灌木与枯叶重新遮好入口，让那里看起来尽可能自然，这才退回地道。
        - id: ch04-b07
          speaker: narrator
          text: 他们正站在荒林最边缘。身后，岩石、荆棘和树根乱糟糟堆在一起，彼此纠缠。前面是一大片安静的田野，一道道篱笆在雪地上画出黑线，把田野围住。远方，那条熟悉的老河闪着微光。冬天的太阳又红又低，挂在地平线上。
        - id: ch04-b08
          speaker: narrator
          text: 水獭认得所有道路，便领着大家排成一线，直奔远处的一道篱笆门。他们在那里停了一下，回头望去。整片荒林密不透风，阴森险恶，坚实地盘踞在无边的白色原野之间。三位同时转身，飞快赶回家去。他们奔向炉火，奔向火光照亮的那些熟悉东西，也奔向窗外那条河快活的声音。他们熟悉那条河，也信赖它的每一种情绪。无论河水带来怎样的惊奇，都从不会叫他们害怕。
        - id: ch04-b09
          speaker: narrator
          text: 鼹鼠匆匆走着，一心盼望回到家，重新待在自己熟悉又喜爱的一切中间。这时他清楚地明白，自己属于耕田与树篱。他和犁过的田垄、牲畜常去的牧场、让人流连到黄昏的小路，还有精心照料的园圃紧紧连在一起。
        - id: ch04-b10
          speaker: narrator
          text: 至于野性大自然里的严酷，需要的那份顽强忍耐，还有真正冲突时的碰撞，就留给别人吧。鼹鼠得聪明一点，守在命运为他安排的宜人地方。那些地方也自有冒险，而且足够他经历整整一生。
