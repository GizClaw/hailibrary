audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 温暖从容，带着含蓄的幽默
        timbre: 清澈醇厚
        pace: 舒缓而富于变化
        pitch: 中低
    toad:
      display_name: 蟾蜍
      tts:
        delivery: 自信外放，兴奋时滔滔不绝
        timbre: 饱满洪亮
        pace: 明快多变
        pitch: 中低
    rat:
      display_name: 河鼠
      tts:
        delivery: 热心机敏，认真时坚定直接
        timbre: 清亮温暖
        pace: 中等偏快
        pitch: 中
    mole:
      display_name: 鼹鼠
      tts:
        delivery: 诚恳活泼，得意时兴致勃勃
        timbre: 柔和朴实
        pace: 中等
        pitch: 中
    badger:
      display_name: 獾
      tts:
        delivery: 沉稳威严，话少而有分量
        timbre: 低沉厚实
        pace: 舒缓
        pitch: 低
    chief_weasel:
      display_name: 黄鼠狼头领
      tts:
        delivery: 油滑张扬，嘲弄时尖声尖气
        timbre: 尖细刺耳
        pace: 中等偏快
        pitch: 高
    otter:
      display_name: 水獭
      tts:
        delivery: 爽朗豪放，爱说笑也爱逞强
        timbre: 洪亮粗犷
        pace: 明快
        pitch: 中低
    guest_1:
      display_name: 年轻宾客甲
      tts:
        delivery: 活泼起哄，兴致高昂
        timbre: 清亮
        pace: 快
        pitch: 中高
    guest_2:
      display_name: 年轻宾客乙
      tts:
        delivery: 热闹直率，喜欢随声响应
        timbre: 明亮
        pace: 快
        pitch: 中
    weasel_mother:
      display_name: 黄鼠狼妈妈
      tts:
        delivery: 亲切絮叨，吓唬孩子时一本正经
        timbre: 柔和清脆
        pace: 中等
        pitch: 中高
  chapters:
    - id: ch01
      title: 秘密通道
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 天渐渐黑了。河鼠一脸兴奋，又透着神秘，把大家叫回客厅，让每只动物站到自己的那堆装备旁。他要亲手替伙伴们装束，好去执行今晚的远征。河鼠办事认真又周全，光是穿戴就花了不少时间。每只动物先束腰带，腰带一边插剑，另一边挂弯刀，还得讲究左右平衡。接下来又是两把手枪、一根警棍、几副手铐，再加上绷带、橡皮膏、酒壶和三明治盒。
        - id: ch01-b02
          speaker: badger
          text: 好吧，河鼠！你觉得好玩，我也没什么损失。今晚该办的事，我用手里这根棍子就能全办完。
        - id: ch01-b03
          speaker: rat
          text: 求你啦，獾。事情过后，我可不想听你埋怨我漏带了什么东西！
        - id: ch01-b04
          speaker: narrator
          text: 等一切准备停当，獾一只爪提起暗灯，另一只握紧大棍，带领大家出发。
        - id: ch01-b05
          speaker: badger
          text: 都跟着我！鼹鼠走头一个，我对他非常满意。河鼠第二，蟾蜍最后。还有你，蟾蜍，别再像平常那样讲个不停。你敢出声，我准把你送回去！
        - id: ch01-b06
          speaker: narrator
          text: 蟾蜍唯恐不让自己参加，哪怕被排在最后也没抱怨半句。獾领大家沿河走了一段，忽然从岸边翻下去，钻进水面上方的一个洞。鼹鼠和河鼠看清他的动作，也默默翻过边缘，稳稳落进洞里。轮到蟾蜍，他当然没能照样办好。脚下一滑，只听扑通一声，他掉进河里，还吓得尖叫。朋友们七手八脚把他拖上来，匆匆替他擦水、拧干衣裳，又安慰几句，扶他重新站好。獾却真动了怒，严厉警告蟾蜍，只要再出一次洋相，就一定把他留下。
        - id: ch01-b07
          speaker: narrator
          text: 他们总算进入秘密通道，营救远征这才真正开始。通道又冷又黑，潮湿、低矮，还十分狭窄。蟾蜍浑身湿透，又怕前方藏着危险，冷得直发抖。暗灯已经走在很远的前面，他不知不觉落在了后头。
        - id: ch01-b08
          speaker: rat
          text: 快跟上，蟾蜍！
        - id: ch01-b09
          speaker: narrator
          text: 蟾蜍一想到自己会被独自丢在黑暗里，立刻慌了。他不只是跟上去，简直是猛冲上去，一头撞倒河鼠。河鼠扑向鼹鼠，鼹鼠又撞上獾，狭窄的通道里顿时乱成一团。獾还以为敌人从后方发动了袭击。这里窄得施展不开棍棒和弯刀，他便拔出手枪，眼看就要朝蟾蜍打出一颗子弹。等他发现所谓的敌袭不过是蟾蜍惊慌乱撞，真是气得厉害。
        - id: ch01-b10
          speaker: badger
          text: 这一次，说什么也得把这个讨厌的蟾蜍留下！
          emotion: angry
        - id: ch01-b11
          speaker: narrator
          text: 蟾蜍呜呜哀求。鼹鼠和河鼠答应替他担保，獾才消了气。队伍继续前进，不过河鼠改走最后，一只爪牢牢按住蟾蜍的肩膀。他们摸索着拖步前行，耳朵高高竖起，爪子一直按着手枪。
        - id: ch01-b12
          speaker: badger
          text: 走到这里，我们应该差不多就在庄园下面了。
        - id: ch01-b13
          speaker: narrator
          text: 忽然，他们听见一片混乱的声音。那动静似乎远在别处，又像紧贴着头顶。有人叫喊，有人欢呼，有人在地板上跺脚，还有人在敲桌子。蟾蜍又紧张起来，獾却依旧平静。
        - id: ch01-b14
          speaker: badger
          text: 这群黄鼠狼可闹得真欢！
        - id: ch01-b15
          speaker: narrator
          text: 通道开始向上倾斜。他们又摸索了一段，喧闹声再次爆发，这回清楚得很。头顶响着“哦——嗬——哦嗬”的欢呼，小脚不停跺地，小拳头猛捶桌面，酒杯被震得叮当乱响。
        - id: ch01-b16
          speaker: badger
          text: 他们玩得可真痛快！快走！
        - id: ch01-b17
          speaker: narrator
          text: 大家匆匆走到通道尽头，头上正是通往男管家餐具室的活板门。宴会厅里吵得惊天动地，他们根本不用怕敌人听见。
        - id: ch01-b18
          speaker: badger
          text: 好，小伙子们，一齐来！
        - id: ch01-b19
          speaker: narrator
          text: 四只动物肩膀一齐用力，顶开活板门，再互相托举着爬进餐具室。仅仅隔着一道门，那群毫无察觉的敌人还在宴会厅纵情狂欢。
    - id: ch02
      title: 夺回蛤蟆庄园
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 他们一钻出通道，迎面的喧闹简直震耳欲聋。四只动物守在那道门后，等欢呼和敲打声一点点低下去，终于听清了一个说话的声音。那声音每说上半句，宴会厅里便响起掌声、欢呼或大笑。
        - id: ch02-b02
          speaker: chief_weasel
          text: 各位，我不会再耽误大家太久。谢谢掌声！不过，在我坐下以前，我想说说我们亲切的主人蟾蜍先生。我们谁不了解蟾蜍呢？善良的蟾蜍，谦虚的蟾蜍，诚实的蟾蜍！
        - id: ch02-b03
          speaker: narrator
          text: 宴会厅里爆出一阵又一阵怪笑。蟾蜍气得咬牙。
        - id: ch02-b04
          speaker: toad
          text: 只要让我碰到他！
          emotion: angry
        - id: ch02-b05
          speaker: badger
          text: 再忍一会儿！大家全都准备好！
        - id: ch02-b06
          speaker: chief_weasel
          text: 现在，我要给各位唱一首亲自写的小歌，题目就是蟾蜍。蟾蜍出门寻欢去，兴高采烈上街去——
        - id: ch02-b07
          speaker: narrator
          text: 黄鼠狼头领扯着尖嗓子唱了起来。獾站直身子，两只爪牢牢握住大棍，回头看遍每一位同伴。
        - id: ch02-b08
          speaker: badger
          text: 时辰到了！跟我来！
        - id: ch02-b09
          speaker: narrator
          text: 獾把门猛地推开。哎呀，宴会厅里立刻响满了尖叫、吱哇乱叫和刺耳的惨叫！吓破胆的黄鼠狼先往桌下钻，又发疯似的扑向窗户。雪貂拼命冲向壁炉，却一只接一只卡在烟囱里，挤成一团，再也动弹不得。桌椅翻倒，玻璃杯和瓷盘砸在地上，碎裂声连成一片。就在这片最可怕的慌乱中，四位英雄怒气冲冲地走进大厅。獾胡须根根直竖，大棍划过空中，挥得呼呼作响。鼹鼠一身乌黑，神情严峻，也高高举起自己的棍子。
        - id: ch02-b10
          speaker: mole
          text: 鼹鼠来了！鼹鼠来了！
        - id: ch02-b11
          speaker: narrator
          text: 河鼠神情坚决，腰带上塞满了各个年代、各种式样的武器。蟾蜍因为激动和受伤的自尊，仿佛胀到了平常两倍大。他跳起来，发出叫人骨头发冷的战吼。
        - id: ch02-b12
          speaker: toad
          text: “蟾蜍出门寻欢去”？现在就让你们好好寻个欢！
          emotion: angry
        - id: ch02-b13
          speaker: narrator
          text: 蟾蜍直扑黄鼠狼头领。他们明明只有四个，可在惊慌失措的敌人眼里，大厅里仿佛挤满了灰、黑、棕、黄各色的庞然巨兽。这些怪物一边高声呐喊，一边挥动大得吓人的棍棒。黄鼠狼再也组织不起抵抗，只顾发出恐惧又绝望的尖叫，朝四面八方逃命。有的跳出窗户，有的往烟囱里爬，哪里都肯去，只求赶快躲开那些可怕的棍子。
        - id: ch02-b14
          speaker: narrator
          text: 战斗结束得很快。四位朋友迈着大步，从大厅这头打到那头，又从那头打回来。只要桌下或角落里有一个脑袋冒出来，迎面便是一棍。五分钟后，屋里已经肃清。透过破窗，他们还能隐隐听见黄鼠狼逃过草坪时的惨叫。地板上横七竖八躺着十来个敌人，鼹鼠正挨个给他们戴上手铐。獾总算停下来歇气。他用大棍撑住身体，擦了擦自己那正直的额头。
        - id: ch02-b15
          speaker: badger
          text: 鼹鼠，你真是最出色的好伙伴！快从窗户出去，看看那群白鼬岗哨在做什么。多亏了你，我看今晚不必再为他们费心了。
        - id: ch02-b16
          speaker: narrator
          text: 鼹鼠立刻跳出窗口。獾让河鼠和蟾蜍扶起桌子，从满地碎片中找出刀叉、碟子和杯子，再看看有什么能当晚餐。
        - id: ch02-b17
          speaker: badger
          text: 我可真饿了。快动起来，蟾蜍，手脚麻利点！我们替你夺回了宅子，你连一块三明治也不招待吗？
        - id: ch02-b18
          speaker: narrator
          text: 蟾蜍心里有点委屈。獾刚才夸了鼹鼠，却没像夸鼹鼠那样，说蟾蜍是个多么了不起的伙伴，也没说他打得多么漂亮。蟾蜍自己可得意得很，尤其满意刚才那一棍。他冲向黄鼠狼头领，只一下就把那家伙打得飞过整张桌面。不过，他没有闹脾气，还是同河鼠忙碌起来。他们找到一玻璃碟番石榴果冻、一只冷鸡、一条几乎没人碰过的牛舌、一份水果奶油布丁和许多龙虾沙拉。餐具室里还有满满一篮法式小面包，以及大把的奶酪、黄油和芹菜。两只动物刚要坐下，鼹鼠便抱着一堆步枪，笑呵呵地爬进窗口。
        - id: ch02-b19
          speaker: mole
          text: 全结束了！白鼬本来就紧张得要命，一听大厅里又叫又喊，乱成一片，有几个丢下枪就跑。其余的刚站稳一会儿，黄鼠狼便冲了出来。白鼬以为自己遭了出卖，抓住黄鼠狼就打。黄鼠狼只想逃，两边又扭又挣，拳头乱挥，在地上滚来滚去，最后大多数都滚进河里了！现在一个也不见了，他们的枪全在我这儿。一切都妥了！
        - id: ch02-b20
          speaker: badger
          text: 真是出色又值得嘉奖的动物！鼹鼠，你吃晚餐以前，再替我办最后一件事。我本不想麻烦你，可交给你的事总能办好。河鼠要不是个诗人，我就派他去了。把地上那些家伙带到楼上，让他们收拾出几间舒服的卧室。床底下也要扫，换上干净床单和枕套，被角照规矩掀开。每间屋还得放好热水、毛巾和新肥皂。做完以后，你若还想解气，就每个揍一顿，再从后门赶走。然后回来吃冷牛舌，味道好极了。鼹鼠，我非常满意！
        - id: ch02-b21
          speaker: narrator
          text: 好心的鼹鼠拿起棍子，把俘虏排成一队。
        - id: ch02-b22
          speaker: mole
          text: 全体都有，快步走！
        - id: ch02-b23
          speaker: narrator
          text: 他把队伍领上楼。过了一阵，鼹鼠笑着回来，说房间全收拾好了，干净得一尘不染。
        - id: ch02-b24
          speaker: mole
          text: 我没再揍他们。今晚挨的打已经够多了。我跟黄鼠狼一说，他们完全赞成，还保证绝不再来麻烦我。他们后悔得不得了，说自己万分抱歉，可坏事全是黄鼠狼头领和白鼬撺掇的。往后只要有用得着他们的地方，我们尽管开口。所以我给了他们一人一个小面包，从后门放走了。他们跑得可快啦！
        - id: ch02-b25
          speaker: narrator
          text: 鼹鼠坐到桌边，大口吃起冷牛舌。蟾蜍也拿出了绅士风度，把嫉妒抛在一旁。
        - id: ch02-b26
          speaker: toad
          text: 亲爱的鼹鼠，谢谢你今晚忙了这么久，尤其要谢谢你今天早上想出的聪明办法！
        - id: ch02-b27
          speaker: badger
          text: 这才是我那勇敢的蟾蜍！
        - id: ch02-b28
          speaker: narrator
          text: 大家心满意足，欢欢喜喜地吃完晚餐，随后各自回房，钻进铺着干净床单的床铺，安心睡在蟾蜍祖传的宅子里。他们靠无与伦比的勇气、精妙的计策，还有棍棒的正确用法，终于夺回了蛤蟆庄园。
    - id: ch03
      title: 蟾蜍的节目单
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 第二天，蟾蜍照例睡过头，下楼吃早餐时迟得不像话。桌上只剩一些蛋壳、几片冷硬得像皮革的吐司和一壶喝掉四分之三的咖啡，别的几乎什么也没有。想到这里明明是自己的宅子，蟾蜍的脾气当然更坏了。他透过早餐室的落地长窗，看见鼹鼠和河鼠坐在草坪的藤椅上，显然正互相讲着故事。两只动物笑得前仰后合，还把短腿直往空中踢。獾坐在扶手椅里，整张脸埋在晨报后面。蟾蜍进门时，他只抬头点了一下。蟾蜍了解他，只好坐下来，把能找到的食物凑在一起，勉强吃了顿早餐，心里却记着，迟早要找另外几个算清这笔账。
        - id: ch03-b02
          speaker: badger
          text: 对不起，蟾蜍，今天上午恐怕有不少工作等着你。我们应该马上办一场宴会庆祝胜利。大家都指望你这么做，规矩也是这样。
        - id: ch03-b03
          speaker: toad
          text: 好吧，只要大家满意，什么都行。虽然我不明白，你为什么非要上午办宴会。可你知道，我活着从来不是为了自己快活。我只想弄清朋友们要什么，再替他们安排妥当。亲爱的老獾！
        - id: ch03-b04
          speaker: badger
          text: 别装得比你实际还蠢。说话时也别对着咖啡咯咯笑，弄得四处乱喷，那不合礼数。宴会当然在晚上，可请柬现在就得写好送走，而且由你来写。桌上有很多信纸，纸头用蓝色和金色印着“蛤蟆庄园”。坐下给所有朋友写请柬。只要好好干，午餐前就能发完。我也会分担工作，宴会由我来订。
        - id: ch03-b05
          speaker: toad
          text: 什么？天气这么好，我却要关在屋里写一堆讨厌的信？我还要巡视领地，把每件事和每个家伙整治妥当，再四处神气一番，好好享受呢！绝对不——我要——等一下！当然可以，亲爱的獾。比起别人的快乐，我自己的快乐和方便算什么？你要我做，我就做。去订宴会吧，喜欢什么就订什么。然后到外面加入年轻朋友们天真的欢笑，忘掉我，忘掉我的忧虑和辛劳。我愿把这个美好的早晨献给责任与友谊！
        - id: ch03-b06
          speaker: narrator
          text: 獾怀疑地看着他，可蟾蜍的脸坦率又坦荡，叫人很难指控他藏着坏心思。獾只好走向厨房。门刚关上，蟾蜍就赶到写字桌前。方才说话时，他想出了绝妙的主意。他会写请柬，还要在信里说明，自己在战斗中担任了多么重要的角色，又怎样一棍打倒黄鼠狼头领。他会暗示那些历险，以及那段辉煌得值得大讲一场的生涯。请柬衬页上还要印一张晚会节目单。他在脑中这样安排。
        - id: ch03-b07
          speaker: toad
          text: 第一项，蟾蜍演说。整晚还会有蟾蜍的其他演说。第二项，蟾蜍专题讲话。内容包括我们的监狱制度、古老英格兰的水路、马匹交易、财产的权利与义务、回归土地，还有一位典型的英国乡绅。第三项，蟾蜍演唱本人创作的歌曲。晚间还会由作者本人演唱蟾蜍的其他作品！
        - id: ch03-b08
          speaker: narrator
          text: 这主意让蟾蜍快活极了。他埋头苦干，到正午便写完全部请柬。恰好有人来报，门外有一只身形小巧、模样又有些狼狈的黄鼠狼，正在怯生生地询问，能不能替几位先生做点事。蟾蜍大摇大摆地出去，认出那是昨夜的俘虏之一。那家伙毕恭毕敬，一心想讨好他们。蟾蜍先拍拍他的脑袋，再把整捆请柬塞进他爪里，命令他立刻上路，能跑多快就跑多快，把信全部送到。晚上要是愿意回来，也许能拿到一先令，也许什么都拿不到。可怜的黄鼠狼竟然感激不尽，满怀热心地跑去完成任务。
        - id: ch03-b09
          speaker: narrator
          text: 其他动物在河上玩了一上午，午餐时才回到庄园。他们吹了一上午的风，个个精神十足，一进门就吵吵嚷嚷。鼹鼠的良心一直不大安稳。他迟疑地望向蟾蜍，担心朋友会闹脾气，或者一个人垂头丧气。谁知蟾蜍非但没有消沉，反而傲慢又得意，整只动物都快膨胀起来。鼹鼠不免起疑，河鼠和獾也意味深长地对望了一眼。午餐刚结束，蟾蜍便把两只爪子深深插进裤兜。
        - id: ch03-b10
          speaker: toad
          text: 好啦，你们照顾好自己！需要什么，只管开口！
        - id: ch03-b11
          speaker: narrator
          text: 他神气十足地朝花园走，打算找个清静地方，替晚上的演说再想出一两个好点子。河鼠忽然追上来，一把抓住他的胳膊。蟾蜍已经猜到了几分，拼命想挣脱。等獾也赶来，牢牢抓住另一条胳膊，他才明白自己的花样已经败露。两位朋友一左一右把他夹在中间，押进门厅旁的小吸烟室，关好房门，将他按进一把椅子。他们并肩站在蟾蜍面前。蟾蜍一言不发，又恼火又怀疑地盯着他们。
    - id: ch04
      title: 最后一首小歌
      blocks:
        - id: ch04-b01
          speaker: rat
          text: 听着，蟾蜍。我们得谈谈宴会。很抱歉要这样跟你说话，可你必须彻底明白，今晚既没有演说，也没有歌曲。这一次不是商量，我们只是把决定告诉你。
        - id: ch04-b02
          speaker: narrator
          text: 蟾蜍知道自己被困住了。朋友们了解他，看穿他，还抢在前面堵住了他。那场快活的美梦碎了。
        - id: ch04-b03
          speaker: toad
          text: 难道我连一首很短很短的小歌，也不能唱给他们听吗？
          emotion: sad
        - id: ch04-b04
          speaker: rat
          text: 不行，一首小歌也不行。没办法，蟾蜍。你知道自己的歌全是自负、吹嘘和虚荣，演说也只有自我夸奖，还有夸大其词，还有——
        - id: ch04-b05
          speaker: badger
          text: 还有，你的演说全是废话。
        - id: ch04-b06
          speaker: rat
          text: 这都是为你好。你迟早必须改过自新，现在正适合开个头，也是你一生的转折点。别以为说这些话不会让我难受，我心里比你还不好过。
        - id: ch04-b07
          speaker: narrator
          text: 蟾蜍沉思了很久，终于抬起头。脸上还留着强烈感情的痕迹。
        - id: ch04-b08
          speaker: toad
          text: 朋友们，你们赢了。我求的本来只是一件小事。我只想再有一个晚上，让自己尽情绽放，施展才华，再听一听雷鸣般的掌声。不知为什么，那掌声总能激发出我最优秀的品质。不过，你们是对的，错的是我。从今以后，我要做一只完全不同的蟾蜍。我再也不会叫朋友们为我脸红。可是，唉，这个世界真不好过！
          emotion: sad
        - id: ch04-b09
          speaker: narrator
          text: 蟾蜍把手帕紧紧按在脸上，站起身来，迈着发软而踉跄的脚步离开了房间。河鼠看着他走出去，立刻觉得自己实在太狠心了。
        - id: ch04-b10
          speaker: rat
          text: 獾，我现在觉得自己简直像个恶棍。看见可怜的蟾蜍那样失望，我心里真不好受。你呢？你觉得自己现在像什么？
        - id: ch04-b11
          speaker: badger
          text: 唉，我知道。可这件事非做不可。这个好家伙得住在这里，守住地位，也得受人尊敬。难道你愿意让他变成笑柄，任凭白鼬和黄鼠狼讥笑吗？
        - id: ch04-b12
          speaker: rat
          text: 当然不愿意。说到黄鼠狼，幸好我们遇见那只送请柬的小家伙时，他才刚出门。听了你说的话，我觉得不对，抽出一两封看了看。简直不成体统！我把整捆都没收了。好心的鼹鼠正在蓝色闺房里重新填写朴素的请柬。
        - id: ch04-b13
          speaker: narrator
          text: 宴会的时辰渐渐临近。蟾蜍离开朋友们以后一直躲在卧室，此刻仍独自坐在那里。他把额头抵在爪子上，忧郁而认真地想了很久。慢慢地，他的脸色开朗起来，嘴角浮出一道又一道悠长的笑。接着，他有些害羞又有些自鸣得意地咯咯笑了。蟾蜍终于站起身，先锁好房门，再拉严每扇窗的窗帘，把屋里所有椅子都收拢过来，整整齐齐排成一个半圆。他自己站到椅子前面，身子越胀越大。蟾蜍朝空椅子鞠了一躬，又郑重地咳嗽两声。想象中的观众已经听得如痴如醉，他便抬高嗓门，唱起最后一首小歌。
        - id: ch04-b14
          speaker: toad
          text: 蟾蜍——回家了！客厅里慌作一团，大厅里哭喊连天。牛棚里哭声不断，马厩里尖叫震天，因为蟾蜍——回家了！当蟾蜍——回家时！砸碎一扇扇窗，撞破一道道门。黄鼠狼四处逃窜，昏倒在地板上面，因为蟾蜍——回家了！咚！战鼓敲起来！号手们吹响号角，士兵们举手敬礼。大炮轰隆隆鸣放，汽车嘟嘟嘟欢叫，只因那——英雄——归来！高声——万岁！人群里每一个，都来把欢呼喊响。向这只值得骄傲的动物致敬赞扬，今天是蟾蜍——光荣的日子！
          emotion: happy
        - id: ch04-b15
          speaker: narrator
          text: 他唱得震天响，投入得不得了。一遍唱完，又从头唱了一遍。这才深深叹出一口长、长、长得没有尽头的气。他把发刷浸进水罐，把头发从正中分开，紧贴脸颊两边梳得又直又亮。然后打开房门，安静地下楼，准备迎接已经聚在客厅里的宾客。
    - id: ch05
      title: 尤利西斯归来
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 蟾蜍一进客厅，所有动物都欢呼起来。他们从四面围上前，祝贺他夺回家园，又争着夸赞他的勇气、聪明才智和战斗本领。可蟾蜍没有趁机讲自己的功劳，只是淡淡一笑，低声回应。
        - id: ch05-b02
          speaker: toad
          text: 哪里，哪里！恰恰相反！
        - id: ch05-b03
          speaker: narrator
          text: 水獭正站在壁炉前，向一圈敬佩的朋友细说，假如昨晚自己在场，会怎样处置局面。他大喊一声，走过来搂住蟾蜍的脖子，想带他绕屋接受欢呼。蟾蜍却温和地冷落了他，轻轻挣开胳膊。
        - id: ch05-b04
          speaker: toad
          text: 獾才是出谋划策的主脑。鼹鼠和河鼠承担了主要战斗。我不过是普通士兵，几乎什么也没做。
        - id: ch05-b05
          speaker: narrator
          text: 动物们被这意外的态度弄得又迷惑又惊讶。蟾蜍走过一个又一个宾客身旁，谦虚地回答每句赞美，同时也觉得，大家全都在目不转睛地研究自己。獾订来的样样都是最好的，宴会办得大获成功。席间谈笑不断，动物们互相打趣。蟾蜍坐在主席位置，却始终垂着眼，只同左右宾客低声说些客气话。他不时偷看獾和河鼠。每次都见他们张着嘴，彼此瞪着对方，这让蟾蜍得意极了。
        - id: ch05-b06
          speaker: narrator
          text: 夜渐渐深了。有些年轻又活泼的动物开始交头接耳。他们觉得今晚远不如从前那些好日子有趣。终于，有人忍不住敲起桌子，还有人跟着高声起哄，想把从前那个爱唱歌、爱演说的蟾蜍叫回来。
        - id: ch05-b07
          speakers: [guest_1, guest_2]
          ensemble: duo
          text: 蟾蜍！演说！请蟾蜍演说！唱歌！蟾蜍先生唱一首！
        - id: ch05-b08
          speaker: narrator
          text: 蟾蜍只是温和地摇头，举起一只爪子，轻轻表示拒绝。他把一道道美味殷勤地推给宾客，换了些眼下人人都在谈的话题，又认真问候他们家中那些年纪太小、还不能参加社交宴会的成员。他不发脾气，也不给自己辩解，却用这些办法让大家慢慢明白，今晚的晚餐会严格遵循最正统的礼仪，一点也不会偏离。朋友们眼前的，的确是一只脱胎换骨的蟾蜍！
        - id: ch05-b09
          speaker: narrator
          text: 这场高潮过去以后，四位朋友继续过起原来的生活。那生活曾让一场内战粗暴地打断，如今重新变得快乐又满足，再没有叛乱或入侵来惊扰他们。蟾蜍经过认真商量，也听取了朋友们的意见，选中一条漂亮的金链，链上挂着镶珍珠的坠盒。他把这份礼物寄给狱卒的女儿，还附上一封信。就连獾也不得不承认，那封信写得谦虚、感激，也很懂得感谢别人。那位帮助蟾蜍逃走的火车司机，同样得到了郑重的道谢，也得到了足以补偿他全部辛劳的报酬。
        - id: ch05-b10
          speaker: narrator
          text: 在獾严厉逼迫下，大家费了不少周折，甚至找到了那位船娘，悄悄赔清她那匹马的价钱。蟾蜍为此闹得很厉害，怎么也不肯痛快答应。他认定自己只是命运手里的工具，是命运派他去惩罚那些胳膊花斑、身材肥胖，又认不出真正绅士的女人。不过赔款并不算沉重，因为当地估价人看过以后，一致承认吉卜赛人当初给那匹马开的价大致准确。
        - id: ch05-b11
          speaker: narrator
          text: 漫长的夏日黄昏里，四位朋友有时会一同去野林散步。至少在他们面前，这片从前叫人害怕的野林如今已经完全驯服。一路遇见的居民总会恭恭敬敬地向他们问候。那番情景实在叫人愉快。黄鼠狼妈妈还会特意把幼崽领到洞口，用爪子指给他们看。
        - id: ch05-b12
          speaker: weasel_mother
          text: 看呀，宝贝！走过去的是伟大的蟾蜍先生！陪着他的是勇敢的河鼠，一位可怕的战士！那边又来了著名的鼹鼠先生，你们常听爸爸讲起他！
        - id: ch05-b13
          speaker: narrator
          text: 可是，幼崽要是淘气任性，闹得无论如何也管不住，妈妈便换一种说法吓唬他们。谁要是不肯安静，还要哭闹烦人，可怕的灰獾就会立刻过来，把他一把抓走。这当然是对獾的恶毒诽谤。獾虽然不大喜欢社交，其实颇喜欢孩子，绝不会做这种事。不过妈妈们从不放弃这个办法，因为这句吓唬每一次都能发挥十足的效力。
