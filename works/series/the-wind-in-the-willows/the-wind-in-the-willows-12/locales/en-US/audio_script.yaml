  chapters:
    - id: ch01
      title: The Return of Ulysses
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            As darkness began to fall, Rat called everyone back into the parlor with a great air of excitement and mystery. He stood each animal beside his own little pile of equipment and began dressing them for the expedition. Rat took the work very seriously, and it went on for quite a while. Each friend got a belt, a sword on one side, and a cutlass on the other to balance it. Then came two pistols, a police truncheon, several pairs of handcuffs, bandages, sticking plaster, a flask, and a sandwich case.
        - id: ch01-b02
          speaker: badger
          text: >-
            All right, Ratty. If this makes you happy, it does me no harm. But I mean to do everything that needs doing with this stick right here.
        - id: ch01-b03
          speaker: water_rat
          text: >-
            Please, Badger. You know I couldn't bear to hear afterward that I'd forgotten something important.
        - id: ch01-b04
          speaker: narrator
          text: >-
            At last they were ready. Badger held a dark lantern in one paw and his great stick in the other.
        - id: ch01-b05
          speaker: badger
          text: >-
            Now, follow me. Mole goes first because I am very pleased with him. Rat comes next, and Toad goes last. Listen, Toady. If you chatter the way you usually do, I'll send you straight back. That's a promise.
        - id: ch01-b06
          speaker: narrator
          text: >-
            Toad was so afraid of being left out that he accepted the lowest place without a single complaint. The animals set off, with Badger leading them along the river. After a short distance, he suddenly swung over the edge and into a hole in the bank just above the water. Mole and Rat copied him and landed silently inside. Toad tried to do the same, but naturally he slipped. He fell into the river with a loud splash and a frightened squeal.
        - id: ch01-b07
          speaker: narrator
          text: >-
            His friends hauled him out, rubbed him down, wrung the water from him, offered hurried comfort, and put him back on his feet. Badger was seriously angry. He warned Toad that one more piece of foolishness would get him left behind.
        - id: ch01-b08
          speaker: narrator
          text: >-
            And so, at last, they entered the secret passage. Their rescue mission had truly begun.
        - id: ch01-b09
          speaker: narrator
          text: >-
            The tunnel was cold, dark, damp, low, and narrow. Poor Toad shivered partly because he feared what lay ahead and partly because he was soaked through. Badger's lantern was far in front, and Toad began falling behind in the darkness.
        - id: ch01-b10
          speaker: water_rat
          text: >-
            Come on, Toad!
        - id: ch01-b11
          speaker: narrator
          text: >-
            The warning filled Toad with terror that they might leave him there alone. He rushed forward so wildly that he knocked Rat into Mole and Mole into Badger. For a moment, no one knew what was happening. Badger thought they were under attack from behind. The tunnel was too tight for his stick or a cutlass, so he pulled a pistol and very nearly put a bullet into Toad. Once he discovered the truth, his anger grew even worse.
        - id: ch01-b12
          speaker: badger
          text: >-
            That settles it. This tiresome Toad is staying behind!
          emotion: angry
        - id: ch01-b13
          speaker: narrator
          text: >-
            Toad whimpered. Rat and Mole promised to answer for his behavior, and Badger finally calmed down. The line moved on, but now Rat walked at the rear with a firm grip on Toad's shoulder.
        - id: ch01-b14
          speaker: narrator
          text: >-
            They shuffled and felt their way onward, ears alert and paws resting on their pistols. At last, Badger stopped.
        - id: ch01-b15
          speaker: badger
          text: >-
            By now, we ought to be almost directly under the Hall.
        - id: ch01-b16
          speaker: narrator
          text: >-
            Suddenly they heard a muddled roar. It sounded far away, yet it seemed to come from just above their heads. Voices shouted and cheered. Feet stamped, and fists hammered on tables. All of Toad's frightened nerves came alive again. Badger remained perfectly at ease.
        - id: ch01-b17
          speaker: badger
          text: >-
            Those Weasels are certainly having quite a party.
        - id: ch01-b18
          speaker: narrator
          text: >-
            The passage began climbing. They felt their way a little farther, and the noise burst out again, much clearer and very close overhead. They heard a great chorus of hoorays, little feet pounding the floor, glasses clinking, and small fists beating the table.
        - id: ch01-b19
          speaker: badger
          text: >-
            What a fine time they're having. Come on!
        - id: ch01-b20
          speaker: narrator
          text: >-
            They hurried until the passage ended beneath the trapdoor into the butler's pantry. The uproar in the banquet hall was so tremendous that no one was likely to hear them.
        - id: ch01-b21
          speaker: badger
          text: >-
            All right, boys. Everyone push together!
        - id: ch01-b22
          speaker: narrator
          text: >-
            All four put their shoulders under the trapdoor and heaved it open. They helped one another climb through, then stood in the pantry. Only one door separated them from the banquet hall, where their enemies were celebrating without the faintest idea that danger had arrived.
        - id: ch01-b23
          speaker: narrator
          text: >-
            The noise was deafening. At last the cheers and pounding slowly faded, and one voice rose above the room.
        - id: ch01-b24
          speaker: chief_weasel
          text: >-
            I won't keep you much longer. But before I sit down again, I must say a word about our generous host, Mr. Toad. We all know Toad! Good Toad! Modest Toad! Honest Toad!
        - id: ch01-b25
          speaker: narrator
          text: >-
            Each pause brought louder applause, and the last three praises sent the hall into shrieks of laughter.
        - id: ch01-b26
          speaker: toad
          text: >-
            Just wait until I get my paws on him!
          emotion: angry
        - id: ch01-b27
          speaker: badger
          text: >-
            Hold on for one minute. All of you, get ready.
        - id: ch01-b28
          speaker: chief_weasel
          text: >-
            Now let me sing you a little song I composed about Toad.
        - id: ch01-b29
          speaker: narrator
          text: >-
            The announcement drew another long round of applause. Then Chief Weasel began in a high, squeaky voice.
        - id: ch01-b30
          speaker: chief_weasel
          text: >-
            Toad went out for pleasure, strolling gaily down the street—
        - id: ch01-b31
          speaker: narrator
          text: >-
            Badger drew himself to his full height. He took a firm two-pawed grip on his stick and looked around at his friends.
        - id: ch01-b32
          speaker: badger
          text: >-
            The hour has come! Follow me!
        - id: ch01-b33
          speaker: narrator
          text: >-
            He threw the door wide open. What followed was a storm of squeals, squeaks, and screeches. Terrified weasels dove under tables or sprang wildly toward the windows. Ferrets rushed for the fireplace and became hopelessly jammed in the chimney. Tables and chairs toppled in every direction. Glass and china flew from them and shattered across the floor. The enemy had been laughing only a moment before. Now every creature in the hall was fighting to escape. Into the middle of that terrible panic strode the four furious heroes.
        - id: ch01-b34
          speaker: narrator
          text: >-
            Badger came first, mighty and bristling, with his huge club whistling through the air. Mole followed, black and grim, swinging his stick and shouting his dreadful battle cry.
        - id: ch01-b35
          speaker: mole
          text: >-
            A Mole! A Mole!
        - id: ch01-b36
          speaker: narrator
          text: >-
            Rat charged in, desperate and determined, his belt bulging with weapons of every kind and age. Last came Toad, half crazed with excitement and wounded pride. He seemed twice his normal size as he leaped and let out whoops that chilled the enemy to the bone.
        - id: ch01-b37
          speaker: toad
          text: >-
            Toad went out for pleasure, did he? I'll give them pleasure!
          emotion: angry
        - id: ch01-b38
          speaker: narrator
          text: >-
            Toad went straight for Chief Weasel. One blow from his stick sent the Chief flying across the table. There were only four friends, but the panicked weasels could no longer see that clearly. To them, the hall seemed packed with monstrous grey, black, brown, and yellow animals, all whooping and waving enormous clubs. The enemy broke and ran in every direction. They fled through windows, scrambled up the chimney, and squeezed through any opening that might carry them beyond those terrible sticks.
        - id: ch01-b39
          speaker: narrator
          text: >-
            The fight ended quickly. The four friends marched up and down the full length of the hall, whacking every enemy head that appeared. Within five minutes, they had cleared the room. Through the broken windows came the fading shrieks of weasels racing across the lawn. About a dozen enemies still lay flat on the floor, and Mole was busily locking handcuffs around them. Badger leaned on his stick, rested from his work, and wiped his honest brow.
        - id: ch01-b40
          speaker: badger
          text: >-
            Mole, you are the very best fellow. Run outside and check on those stoat sentries of yours. See what they're doing. Thanks to you, I don't believe they'll give us much trouble tonight.
        - id: ch01-b41
          speaker: narrator
          text: >-
            Mole promptly disappeared through a window. Badger told the other two to stand a table upright, gather knives, forks, plates, and glasses from the wreckage, and hunt for something they could eat.
        - id: ch01-b42
          speaker: badger
          text: >-
            I want some food, and I want it now. Get moving, Toad. We win your house back, and you don't even offer us a sandwich!
        - id: ch01-b43
          speaker: narrator
          text: >-
            Toad felt rather wounded. Badger had praised Mole, but he had said nothing pleasant about Toad. He had not called him a fine fellow or admired his splendid fighting. Toad was especially proud of the way he had rushed Chief Weasel and sent him flying across the table with one blow. He thought that performance deserved some notice. Still, he hurried to work beside Rat. They searched among the dishes and through the pantry shelves. Soon they found guava jelly in a glass dish, a cold chicken, an almost untouched tongue, some trifle, and plenty of lobster salad. In the pantry they discovered a whole basket of French rolls along with all the cheese, butter, and celery they could want.
        - id: ch01-b44
          speaker: narrator
          text: >-
            They were about to sit down when Mole climbed through the window, chuckling and carrying an armful of rifles.
        - id: ch01-b45
          speaker: mole
          text: >-
            It's finished. As far as I can tell, the stoats were nervous and jumpy even before the fighting began. When they heard all the shrieks, yells, and crashing inside, some dropped their rifles and ran. The rest held their ground for a while. Then the weasels came pouring out, and the stoats thought they'd been betrayed. They grabbed the weasels, and the weasels fought to get free. They wrestled, wriggled, punched, and rolled over one another until most of them rolled right into the river. They've all vanished now, one way or another, and I brought back their rifles. So we have nothing more to worry about.
        - id: ch01-b46
          speaker: badger
          text: >-
            Excellent work, and well done, Mole! Before you join us for supper, I need one more favor. I wouldn't ask, except that I know you will see it done properly. I wish I could say that about everyone I know. I'd send Rat, but unfortunately he's a poet.
        - id: ch01-b47
          speaker: narrator
          text: >-
            Badger spoke around a mouthful of chicken and trifle.
        - id: ch01-b48
          speaker: badger
          text: >-
            Take those prisoners upstairs and have them clean several bedrooms until they're truly comfortable. Make sure they sweep under every bed, put on clean sheets and pillowcases, and turn down one corner of each bed just as it ought to be. Every room needs hot water, clean towels, and fresh soap. After that, if it makes you feel better, give each fellow one more licking and send him out the back door. I doubt we'll see them again. Then come have some cold tongue. It's first-rate. I'm very pleased with you, Mole.
        - id: ch01-b49
          speaker: narrator
          text: >-
            Good-natured Mole picked up a stick, lined his prisoners across the floor, and gave the order.
        - id: ch01-b50
          speaker: mole
          text: >-
            Quick march!
        - id: ch01-b51
          speaker: narrator
          text: >-
            He led the squad upstairs. Some time later, Mole came back smiling. Every room was ready and as clean as a new pin.
        - id: ch01-b52
          speaker: mole
          text: >-
            I didn't have to lick them after all. It seemed to me they'd taken enough punishment for one night. When I explained that, the weasels agreed at once and said they wouldn't dream of putting me to the trouble. They were terribly sorry for everything, they said. It was all Chief Weasel's fault, along with the stoats. If they could ever do us a favor to make amends, we had only to ask. So I gave each one a roll, let them out through the back door, and off they ran as fast as they could go.
        - id: ch01-b53
          speaker: narrator
          text: >-
            Mole pulled his chair to the table and attacked the cold tongue. Toad was a gentleman at heart. He put away all his jealousy and spoke warmly.
        - id: ch01-b54
          speaker: toad
          text: >-
            Thank you, dear Mole, for every bit of work and trouble you took on tonight. Most of all, thank you for being so clever this morning!
        - id: ch01-b55
          speaker: badger
          text: >-
            That's my brave Toad speaking!
        - id: ch01-b56
          speaker: narrator
          text: >-
            They finished supper in perfect happiness. Before long, they went to bed between clean sheets, safe inside Toad's ancestral home. They had won it back through unmatched courage, brilliant planning, and the proper use of stout sticks.
        - id: ch01-b57
          speaker: narrator
          text: >-
            The next morning, Toad overslept, as usual. He came down disgracefully late and found only a scattering of eggshells, scraps of cold leathery toast, a coffee pot three-quarters empty, and almost nothing else to make a breakfast from. It did not improve his temper. This was his own house, after all. Through the open French windows, he saw Mole and Rat settled in wicker chairs on the lawn. They were swapping stories, roaring with laughter, and kicking their short legs in the air. Badger sat deep in an armchair with the morning paper spread before him. When Toad entered, he merely looked up and nodded.
        - id: ch01-b58
          speaker: narrator
          text: >-
            But Toad knew Badger well. He sat down, made the best breakfast he could, and privately promised himself that he would get even with the others sooner or later. When he was almost finished, Badger lowered the paper and spoke rather sharply.
        - id: ch01-b59
          speaker: badger
          text: >-
            I'm sorry, Toad, but you have a hard morning's work ahead. We ought to hold a banquet at once to celebrate what happened. Everyone will expect it. In fact, it's the rule.
        - id: ch01-b60
          speaker: toad
          text: >-
            Oh, very well! Anything to help. I can't imagine why you want a banquet in the morning, but never mind. I don't live to please myself. I simply discover what my friends want and arrange it for them, dear old Badger.
        - id: ch01-b61
          speaker: badger
          text: >-
            Don't act more foolish than you are. And stop chuckling and spraying coffee while you talk. It isn't polite. Of course the banquet will be tonight. The invitations must go out immediately, and you are going to write them. Sit at that table. There's plenty of letter paper with “Toad Hall” printed at the top in blue and gold. If you keep working, they'll be ready before lunch. I'll carry my share of the load too. I shall order the banquet.
        - id: ch01-b62
          speaker: toad
          text: >-
            What? You expect me to stay inside writing a pile of miserable letters on a glorious morning? I want to inspect my estate, put everything and everyone in order, swagger around, and enjoy myself! Certainly not! I'll be—I'll have you—
          emotion: angry
        - id: ch01-b63
          speaker: narrator
          text: >-
            Toad stopped in the middle of his protest. A new thought had come to him.
        - id: ch01-b64
          speaker: toad
          text: >-
            Wait, though. Of course, dear Badger! What do my own pleasure and comfort matter beside the wishes of my friends? You want these invitations, and you shall have them. Go and order anything you like for the banquet. Then join our young friends outside in their innocent fun. Forget me and all my burdens. I freely give this beautiful morning to duty and friendship!
        - id: ch01-b65
          speaker: narrator
          text: >-
            Badger looked at him with deep suspicion. Still, Toad's face appeared so open and honest that it was hard to accuse him of some hidden scheme. Badger left for the kitchen. The instant the door closed, Toad rushed to the writing table.
        - id: ch01-b66
          speaker: narrator
          text: >-
            His wonderful idea had arrived while he was speaking. He would write those invitations, and he would work hard at them too. But he would also make sure they described the leading role he had played in the battle and how he had knocked Chief Weasel flat. He would hint at his adventures and the whole triumphant career he meant to tell everyone about at the banquet. Then, on the extra leaf of each invitation, he would print a program so every guest knew exactly what entertainment to expect.
        - id: ch01-b67
          speaker: toad
          text: >-
            First, a speech by Toad, with several more speeches by Toad during the evening. Next, an address by Toad. I shall cover our prison system, the old English waterways, buying and selling horses, the rights and duties of property, returning to the land, and the life of a typical English country gentleman. Then comes a song by Toad, composed by himself. Other works by Toad will also be sung during the evening by their composer. Excellent!
        - id: ch01-b68
          speaker: narrator
          text: >-
            The plan delighted him. He worked very hard and finished every letter by noon. At that moment, word came that a small, bedraggled weasel was waiting at the door.
        - id: ch01-b69
          speaker: little_weasel
          text: >-
            Excuse me, gentlemen. Is there anything I can do to help you?
        - id: ch01-b70
          speaker: narrator
          text: >-
            Toad swaggered outside and recognized one of the prisoners from the night before. The little weasel was extremely respectful and anxious to be useful. Toad patted his head and pushed the bundle of invitations into his paw.
        - id: ch01-b71
          speaker: toad
          text: >-
            Hurry along and deliver every one as quickly as you can. If you come back tonight, there may be a shilling waiting for you. Then again, there may not.
        - id: ch01-b72
          speaker: narrator
          text: >-
            The poor weasel seemed truly grateful and hurried away on his errand.
        - id: ch01-b73
          speaker: narrator
          text: >-
            The other animals came back for lunch, loud and cheerful after a morning on the river. Mole's conscience had been bothering him. He looked uneasily at Toad and expected sulking or gloom. Instead, Toad was so puffed up and important that Mole began to suspect a trick. Rat and Badger exchanged knowing looks.
        - id: ch01-b74
          speaker: narrator
          text: >-
            After lunch, Toad buried his paws in his trouser pockets and spoke as casually as he could.
        - id: ch01-b75
          speaker: toad
          text: >-
            Well, take care of yourselves, fellows. Ask for anything you need!
        - id: ch01-b76
          speaker: narrator
          text: >-
            He swaggered toward the garden, where he wanted to develop a few ideas for his speeches. Rat caught him by one arm. Toad had guessed what Rat wanted and struggled to escape, but Badger seized his other arm. Then he knew the game was over. The two friends marched him into the small smoking room beside the entrance hall, shut the door, and placed him in a chair. They stood in front of him while he stared back in angry suspicion.
        - id: ch01-b77
          speaker: water_rat
          text: >-
            Listen, Toad. This concerns tonight's banquet, and I'm truly sorry I have to speak this way. But you must understand one thing clearly. There will be no speeches, and there will be no songs. This isn't a matter for discussion. We are telling you what is going to happen.
        - id: ch01-b78
          speaker: narrator
          text: >-
            Toad saw that he was trapped. His friends understood him completely. They had discovered his plan and stopped it before he could begin. His beautiful dream fell to pieces.
        - id: ch01-b79
          speaker: toad
          text: >-
            Couldn't I sing them just one very little song?
          emotion: sad
        - id: ch01-b80
          speaker: water_rat
          text: >-
            No, not even one little song. It won't do, Toady. You know your songs are full of boasting, vanity, and how wonderful you think you are. Your speeches are nothing but praise for yourself, along with the most enormous exaggeration, and—and—
        - id: ch01-b81
          speaker: narrator
          text: >-
            Rat answered firmly, though Toad's trembling lower lip made his heart ache.
        - id: ch01-b82
          speaker: badger
          text: >-
            And hot air.
        - id: ch01-b83
          speaker: water_rat
          text: >-
            We're doing this for your sake, Toady. Sooner or later, you have to begin behaving differently. This is the perfect moment, a real turning point in your life. And please don't imagine that saying this is easy for me. It hurts me more than it hurts you.
        - id: ch01-b84
          speaker: narrator
          text: >-
            Toad sat thinking for a long time. At last he raised his head. His face showed that powerful feelings were moving inside him.
        - id: ch01-b85
          speaker: toad
          text: >-
            You have defeated me, my friends. I asked for so little. I only wished to bloom for one more evening, to let my true self unfold, and to hear that thunderous applause which somehow always brings out my finest qualities. But you are right, and I am wrong. From this moment on, I shall be an entirely different Toad. You will never need to blush for me again. Oh, dear. Oh, dear. What a hard world this is!
          emotion: sad
        - id: ch01-b86
          speaker: narrator
          text: >-
            He pressed a handkerchief to his face and walked unsteadily out of the room.
        - id: ch01-b87
          speaker: water_rat
          text: >-
            Badger, I feel like a brute. How do you feel?
        - id: ch01-b88
          speaker: badger
          text: >-
            Oh, I know. I know. But someone had to do it. Toad has to live here, stand his ground, and earn respect. Would you rather have him become everyone's joke, laughed at by stoats and weasels?
        - id: ch01-b89
          speaker: water_rat
          text: >-
            Of course not. And speaking of weasels, we're lucky we met that little fellow just as he was leaving with Toad's invitations. After what you told me, I suspected something and read one or two. They were disgraceful. I took the whole bundle away. Good old Mole is in the blue sitting room now, filling out plain, simple invitation cards.
        - id: ch01-b90
          speaker: narrator
          text: >-
            The banquet hour drew nearer. Toad had gone to his bedroom after leaving his friends, and he still sat there, gloomy and thoughtful, with his forehead resting on one paw. He pondered for a long time. Little by little, his face brightened. Slow smiles spread across it. Then he began to giggle in a shy, private way.
        - id: ch01-b91
          speaker: narrator
          text: >-
            At last, Toad stood up and locked the door. He closed the curtains, gathered every chair in the room, and arranged them in a half circle. Then he took his place before them and seemed to swell. He bowed, coughed twice, and imagined an audience hanging on his every word. In a soaring voice, he began Toad's Last Little Song.
        - id: ch01-b92
          speaker: toad
          text: >-
            The Toad came home! Panic filled the parlors, and howling filled the halls. They cried out in the cowsheds and shrieked inside the stalls, when the Toad came home!
          emotion: happy
        - id: ch01-b93
          speaker: toad
          text: >-
            Yes, the Toad came home! Windows burst to pieces, and doors came crashing in. Weasels raced in terror or fainted in the din, when the Toad came home!
          emotion: happy
        - id: ch01-b94
          speaker: toad
          text: >-
            Bang go the drums! The trumpets all are blowing, and soldiers stand saluting. The cannons fire their welcome, and motorcars are hooting, as the hero comes!
          emotion: happy
        - id: ch01-b95
          speaker: toad
          text: >-
            Shout hooray! Let every creature try to raise the loudest cry, to honor the great animal who makes you all so proud. This is Toad's great day!
          emotion: happy
        - id: ch01-b96
          speaker: narrator
          text: >-
            He sang loudly, with tremendous feeling and expression. When he reached the end, he sang the whole song again. Then he let out a deep sigh, a long, long, long sigh.
        - id: ch01-b97
          speaker: narrator
          text: >-
            Toad dipped his hairbrush into the water pitcher. He parted his hair down the middle and plastered it smooth and straight on both sides of his face. Then he unlocked the door and quietly went downstairs. He knew his guests must be gathering in the drawing room.
        - id: ch01-b98
          speakers: [guest_one, guest_two]
          ensemble: duo
          text: >-
            Hooray for Toad! Well done!
          emotion: happy
        - id: ch01-b99
          speaker: narrator
          text: >-
            All the animals cheered when Toad entered. They crowded around to congratulate him and praise his courage, cleverness, and skill in battle. Toad only gave a faint smile.
        - id: ch01-b100
          speaker: toad
          text: >-
            Oh, it was nothing at all.
        - id: ch01-b101
          speaker: narrator
          text: >-
            Sometimes, for variety, he murmured that quite the opposite was true. Otter stood on the hearthrug, explaining to an admiring group exactly how he would have handled the fight if he had been there. He rushed forward with a shout, threw an arm around Toad's neck, and tried to parade him triumphantly around the room. Toad gently freed himself and answered in a mild, almost chilly way.
        - id: ch01-b102
          speaker: toad
          text: >-
            Badger supplied the great plan. Mole and Water Rat did most of the fighting. I was only an ordinary soldier in the ranks, and I did almost nothing.
        - id: ch01-b103
          speaker: narrator
          text: >-
            His guests were puzzled and startled by this new manner. As Toad moved among them, giving one modest answer after another, he felt every eye following him with intense interest.
        - id: ch01-b104
          speaker: narrator
          text: >-
            Badger had ordered the very best of everything, and the banquet was a splendid success. The animals talked, laughed, and teased one another all around the long table. Toad, of course, occupied the chair at its head. Through all the noise, he looked modestly downward and offered pleasant little remarks to the guests on either side. Now and then, he stole a glance toward Rat and Badger. Every time he did, he found them staring at each other with their mouths open. Their astonishment gave Toad the greatest satisfaction of the whole evening.
        - id: ch01-b105
          speaker: narrator
          text: >-
            As the evening went on, a few of the younger, livelier guests whispered that parties had been more amusing in the old days. Paws began knocking on the table.
        - id: ch01-b106
          speakers: [guest_one, guest_two]
          ensemble: duo
          text: >-
            Toad! Give us a speech! A speech from Toad! Sing us Mr. Toad's song!
          emotion: happy
        - id: ch01-b107
          speaker: narrator
          text: >-
            Toad merely shook his head and raised one paw in gentle protest. He pressed more delicacies on his guests, made polite conversation about the latest events, and asked with deep concern about family members still too young to attend formal dinners. In this way, he made it clear that the banquet would follow every proper social rule.
        - id: ch01-b108
          speaker: narrator
          text: >-
            He truly was an altered Toad.
        - id: ch01-b109
          speaker: narrator
          text: >-
            After that great event, the four animals returned to their familiar lives in joy and contentment. Civil war had interrupted them roughly, but no new uprising or invasion ever disturbed them. Toad did not forget the people who had helped him during his adventures. After properly consulting his friends, he chose a handsome gold chain with a pearl-set locket and sent it to the jailer's daughter. He enclosed a letter so modest, thankful, and appreciative that even Badger admitted it was well written. In his turn, the engine driver received suitable thanks and fair payment for all his help and trouble.
        - id: ch01-b110
          speaker: narrator
          text: >-
            Badger had to force Toad to do one more thing. With considerable difficulty, they found the barge woman and quietly paid her the value of her horse. Toad fought the idea furiously. He insisted that Fate had chosen him as its instrument to punish stout women with mottled arms who could not recognize a true gentleman. Fortunately, the payment was not very heavy. Local experts agreed that the price given by the traveler who bought the horse had been nearly right.
        - id: ch01-b111
          speaker: narrator
          text: >-
            On long summer evenings, the friends sometimes walked together through the Wild Wood. As far as they were concerned, it had been thoroughly tamed. Its inhabitants greeted them with great respect. Mother weasels brought their babies to the mouths of their holes and pointed toward the passing heroes.
        - id: ch01-b112
          speaker: mother_weasel
          text: >-
            Look, little one! There goes the great Mr. Toad. Beside him is the brave Water Rat, a fearsome fighter. And over there comes famous Mr. Mole. You've heard your father tell his story many times.
        - id: ch01-b113
          speaker: narrator
          text: >-
            Those respectful lessons were not the only stories the young weasels heard. When the babies became fussy and impossible to manage, their mothers used a darker tale. They warned that unless the little ones stopped fretting, hushed at once, and behaved themselves, the terrible grey Badger would rise up and come to get them. This was a shameful lie about Badger. He cared little for Society and avoided it whenever he could, but he was actually rather fond of children. Still, the warning never failed to have its full effect.
