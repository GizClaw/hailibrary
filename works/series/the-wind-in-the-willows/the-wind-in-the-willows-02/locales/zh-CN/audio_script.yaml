audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 温暖从容，带着含蓄的幽默
        timbre: 清澈醇厚
        pace: 舒缓而富于变化
        pitch: 中低
    mole:
      display_name: 鼹鼠
      tts:
        delivery: 诚恳好奇，兴奋时有些冒失
        timbre: 柔和明亮
        pace: 中等偏快
        pitch: 中高
    rat:
      display_name: 河鼠
      tts:
        delivery: 热情老练，随和中带着笃定
        timbre: 温暖清亮
        pace: 从容
        pitch: 中
    toad:
      display_name: 蟾蜍
      tts:
        delivery: 自信外放，兴奋时滔滔不绝
        timbre: 饱满洪亮
        pace: 明快多变
        pitch: 中低
    wayfarer:
      display_name: 路人
      tts:
        delivery: 友善随意，带着旅途中的爽朗
        timbre: 清晰朴实
        pace: 中等
        pitch: 中
    roadside_rabbit:
      display_name: 路边兔子
      tts:
        delivery: 好奇惊叹，活泼直率
        timbre: 轻快明亮
        pace: 偏快
        pitch: 高
    caged_bird:
      display_name: 笼中鸟
      tts:
        delivery: 慌乱委屈，急切求助
        timbre: 细小清脆
        pace: 偏快
        pitch: 高
  chapters:
    - id: ch01
      title: 第二章 大路朝天
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 一个晴朗的夏日早晨，鼹鼠忽然有件事想求河鼠。河鼠正坐在岸边哼着自己新编的小歌，心思全在歌上，鼹鼠说什么，他都没顾得上好好听。清早，河鼠一直和鸭子朋友们在水里游。鸭子游着游着，总会突然把头扎进水里，尾巴高高翘起。每到这时，河鼠便潜到水下，在他们那假想的下巴底下挠脖子痒痒。鸭子们受不住，只好急匆匆蹿回水面，边呛水边冲他愤怒地抖羽毛。脑袋埋在水下，心里再有一肚子话，也没法全骂出来。后来，鸭子们苦苦求他走开，管好自己的事，也让他们安生地管自己的事。河鼠这才离开水里，回到岸上。他坐在温暖的太阳底下，拿刚才的事情编出一首歌。
        - id: ch01-b02
          speaker: mole
          text: 河鼠，劳驾，我想请你帮个忙。
        - id: ch01-b03
          speaker: rat
          text: 这首歌叫《鸭子小调》。回水湾里一路游，高高灯心草间钻。鸭儿水下忙觅食，只见尾巴朝上翻！母鸭尾，公鸭尾，黄色脚掌颤呀颤。黄色嘴儿全不见，河底忙得正欢！绿草软泥滑溜溜，斜齿鳊在里面游。我们的食橱就藏这里，阴凉、满当、黑黝黝。各有所好随各人，我们偏爱这样玩。头朝下，尾朝上，自在觅食不受管！高高蓝天上，雨燕盘旋声声唤。我们还在水下忙，只见尾巴朝上翻！
        - id: ch01-b04
          speaker: narrator
          text: 鼹鼠不懂诗，也不怕别人知道。他天性直率，只是开口时仍很谨慎。
        - id: ch01-b05
          speaker: mole
          text: 河鼠，要我说，这首小歌似乎没有那么了不起。
        - id: ch01-b06
          speaker: rat
          text: 鸭子们也是这么想的。他们问，一个家伙愿意什么时候做什么，就按自己的意思去做，为什么不行？另一个家伙却坐在岸上，老盯着人家，评头论足，还拿人家编诗。这不是胡闹吗？鸭子们就是这么说的。
        - id: ch01-b07
          speaker: mole
          text: 没错，确实是胡闹。
        - id: ch01-b08
          speaker: rat
          text: 才不是呢！
          emotion: angry
        - id: ch01-b09
          speaker: mole
          text: 好吧，那就不是。其实我想问，你能不能带我去拜访蟾蜍先生？我听过他不少事情，很想认识他。
        - id: ch01-b10
          speaker: narrator
          text: 河鼠脾气随和，一听这个请求，马上跳了起来，把这一天剩下的诗兴全丢到脑后。他让鼹鼠把船弄出来，两位立刻向上游划去。鼹鼠坐进船里，拿起双桨，河鼠则舒舒服服地安顿在船尾。
        - id: ch01-b11
          speaker: rat
          text: 当然能去。拜访蟾蜍，什么时候都不算不合适。不论早晚，他都一个样。见了你总是高兴，你要走时，他总是舍不得。
        - id: ch01-b12
          speaker: mole
          text: 听起来，他一定是位很好的动物。
        - id: ch01-b13
          speaker: rat
          text: 他确实好极了。单纯、厚道，又重感情。也许不算太聪明，毕竟谁也不能都是天才。他有时爱吹牛，也有点自命不凡。不过蟾蜍真有不少长处。
        - id: ch01-b14
          speaker: narrator
          text: 小船绕过一道河湾，一座庄严漂亮的红砖老宅出现在眼前。砖墙经过岁月洗磨，颜色温润，修整齐整的草坪一直铺到水边。
        - id: ch01-b15
          speaker: rat
          text: 那就是蟾蜍庄园。左边那条小溪通往船屋，牌子上写着“私人领地，不得登岸”。咱们把船停在那里。右边是马厩，你现在瞧见的是宴会厅，年头很久了。蟾蜍相当有钱，这也是附近最好的宅子之一。不过，我们从不当面告诉他。
        - id: ch01-b16
          speaker: narrator
          text: 他们划进小溪。船进入大船屋的阴影，鼹鼠便收起双桨。许多漂亮的船悬在梁下，或拖上斜坡，却没有一条在水里。整个地方冷冷清清，已经闲置了一阵。
        - id: ch01-b17
          speaker: rat
          text: 我懂了。划船已经过时，他早玩腻啦。不知道这回又迷上了什么。走，找他去吧。反正很快就会听他说个够。
        - id: ch01-b18
          speaker: narrator
          text: 两位上岸，漫步穿过开满鲜花的明艳草坪，四处寻找蟾蜍。不一会儿，他们看见蟾蜍靠在一把藤编花园椅里，神情专注，膝头摊着一张大地图。他一看见朋友，立刻从椅子里跳起来，热烈地握住两人的爪子，连鼹鼠是谁也没等介绍，便绕着他们欢快地蹦跳。
        - id: ch01-b19
          speaker: toad
          text: 太好了！你们真够朋友！河鼠，我正想派船去找你，不管你在忙什么，都得马上把你接来。我正需要你们两个。想喝什么？进屋吃点东西吧！你们这时候出现，运气好得不得了！
          emotion: happy
        - id: ch01-b20
          speaker: rat
          text: 蟾蜍，咱们先安静坐一会儿。
        - id: ch01-b21
          speaker: narrator
          text: 河鼠倒进安乐椅，鼹鼠在旁边坐下，客气地夸起这座美妙的府邸。
        - id: ch01-b22
          speaker: toad
          text: 这是整条河上最好的宅子！其实，不管上哪儿找，也没有比它更好的！
        - id: ch01-b23
          speaker: narrator
          text: 河鼠听见这句吹嘘，便用胳膊肘碰了鼹鼠一下，偏偏被蟾蜍看个正着。蟾蜍的脸立刻涨得通红，三位谁也没说话，四周顿时安静得很难堪。过了片刻，蟾蜍忽然忍不住大笑起来。
        - id: ch01-b24
          speaker: toad
          text: 好啦，河鼠，我就是这副脾气。房子也没那么差，对吧？你自己明明挺喜欢。现在说正事。你们正是我要找的动物，非帮我不可。这件事非常要紧！
        - id: ch01-b25
          speaker: rat
          text: 又是划船吧？你多少有些进步，只是水花还溅得厉害。只要有人耐心教上很久，也许你就能……
        - id: ch01-b26
          speaker: toad
          text: 呸，划船！那是小孩子的蠢把戏，我早不玩了，纯粹浪费时间。看你们把力气花在这种没意思的事情上，我真难过。我已经找到一生唯一值得做的事业，往后的日子全要献给它。过去那些年月都浪费在小事上，想起来实在可惜。亲爱的河鼠，还有你和气的朋友，请跟我到马厩院子。到了那里，你们自然会明白！
        - id: ch01-b27
          speaker: narrator
          text: 蟾蜍带头走进马厩院子，河鼠一脸怀疑地跟在后面。车房外停着一辆崭新的吉卜赛篷车，金丝雀黄色的车身配着绿色花饰和红色车轮，亮得耀眼。
        - id: ch01-b28
          speaker: toad
          text: 看吧，真正的生活就在这辆小车里！无拘无束的大路，尘土飞扬的公路，还有荒地、公地、树篱和起伏的丘陵。营地、村庄、市镇、都市，全在前面！今天住这里，明天拔营去别处。旅行、变化、新鲜、刺激！整个世界任你走，眼前的地平线永远在变。这还是世上最好的篷车，一辆也比不上。快进来瞧，里面全是我亲自设计的！
        - id: ch01-b29
          speaker: narrator
          text: 鼹鼠听得又好奇又兴奋，急忙跟着蟾蜍登上台阶，走进篷车。河鼠只从鼻子里哼了一声，双手深深插进口袋，仍旧站在原处。车里确实小巧又舒服，有一张张窄卧铺，有能折到墙边的小桌，也有做饭用的炉子、储物柜和书架。鸟笼里真养着一只鸟，至于锅、盘、壶、罐，更是大大小小，各式各样，样样都有。
        - id: ch01-b30
          speaker: toad
          text: 一样不缺！柜里有饼干、罐装龙虾、沙丁鱼，想要什么都有。这里是苏打水，那里是烟草，还有信纸、咸肉、果酱、纸牌和多米诺骨牌。等咱们今天下午出发，你们就知道我什么也没忘。
        - id: ch01-b31
          speaker: rat
          text: 请等一下。我刚才是不是听见你说了“咱们”“出发”，还有“今天下午”？
        - id: ch01-b32
          speaker: toad
          text: 亲爱又厚道的老河鼠，别拿那种生硬挑剔的口气说话。你知道自己非来不可，没有你，我应付不了。事情就这么定了，也别争，我最受不了争论。难道你想一辈子守着那条又闷又旧的河，住在岸洞里，只会划船？我要带你看看世界，让你活出个动物样来！
        - id: ch01-b33
          speaker: rat
          text: 我不去，就这么定了。我偏要守着老河，住在洞里，照旧划我的船。鼹鼠也会跟着我，照我说的做。是不是，鼹鼠？
        - id: ch01-b34
          speaker: mole
          text: 当然。我永远跟着你，你说怎么办，咱们就怎么办。不过，这件事听起来好像会挺有趣的。
        - id: ch01-b35
          speaker: narrator
          text: 鼹鼠满心向往。冒险生活对他还很陌生，越是陌生，越叫他激动。那辆金丝雀色的车，还有里面精巧的东西，他一眼就爱上了。河鼠看出他的心思，开始动摇。河鼠最怕朋友失望，又很喜欢鼹鼠，为他几乎什么都肯做。蟾蜍把两人的神情看得清清楚楚。
        - id: ch01-b36
          speaker: toad
          text: 先进屋吃午饭，咱们边吃边谈，不用急着决定。我自己其实并不在乎，只是想让你们开心。“为别人而活！”这就是我的人生格言。
        - id: ch01-b37
          speaker: narrator
          text: 蟾蜍庄园的午餐当然好极了，庄园里的每一样东西向来如此。席间，蟾蜍彻底放开手脚，不再理会河鼠，专心说服没见过世面的鼹鼠。他简直把鼹鼠当成一架竖琴，想让对方发出什么调子，就拨动哪根弦。蟾蜍本来就能说会道，想象一活跃起来，自己也会被它牵着走。他把旅途的前景、野外生活和路边天地的乐趣说得光彩夺目，鼹鼠兴奋得几乎坐不住。不知不觉，三位都像默认旅行已经说定。河鼠心里仍不赞成，却让好脾气压过了自己的异议。他不忍扫两个朋友的兴，而鼹鼠和蟾蜍早已沉进计划和憧憬，连未来几个星期里每一天分别做什么都安排起来了。
        - id: ch01-b38
          speaker: narrator
          text: 准备妥当，胜券在握的蟾蜍便带同伴去围场，叫他们捉住老灰马。谁也没问过老灰马，他却被派去做这趟满是尘土的旅行里最吃灰的差事，当然气得很。他很坦率地表明，自己宁愿留在围场，结果大家费了好大劲才捉住他。蟾蜍趁机把更多必需品硬塞进储物柜，又将饲料袋、一网兜洋葱、几捆干草和好些篮子挂在车下。老灰马终于被套上车，他们便热热闹闹地出发，一路上三位同时说着话。兴致来了就走在车边，想休息便坐到车辕上，各人随自己的心意。
        - id: ch01-b39
          speaker: narrator
          text: 那是个金光灿烂的下午。车轮和脚步扬起一路尘土，那气味浓郁又饱满，闻着叫人心满意足。道路两旁都是枝叶繁茂的果园，鸟儿藏在里面向他们啼叫，还吹起快活的口哨。好心的路人迎面走来，会问一声好，也有人特意停下，夸赞这辆漂亮的新篷车。树篱边的兔子们则坐在自家门口，看见他们经过，便一起举起前爪连声惊叹。
        - id: ch01-b40
          speaker: wayfarer
          text: 日安！你们这辆篷车真漂亮！
        - id: ch01-b41
          speaker: roadside_rabbit
          text: 哎哟！哎哟！哎哟！
          emotion: surprised
        - id: ch01-b42
          speaker: narrator
          text: 到了深夜，他们离家已有好几英里，既累又快活。三位把车停在一片远离人烟的偏僻公地，解开老灰马，让他自己去吃草。他们则坐在篷车旁边的草地上，吃了一顿简单的晚饭。蟾蜍仍在大吹大擂，讲往后的日子里自己要做多少了不起的事。谈话间，四周的星星渐渐变得又大又饱满。一轮黄月亮不知从哪儿突然现身，既没有声响，也没有惊动谁。它像是特意赶来陪伴他们，听他们说话。最后，三位才钻进篷车里的小卧铺。
        - id: ch01-b43
          speaker: toad
          text: 各位晚安！这才是绅士该过的生活！你那条老河算什么！
        - id: ch01-b44
          speaker: rat
          text: 我没有提我的河，你明明知道。可是我一直在想它，时时刻刻都在想。
          emotion: sad
        - id: ch01-b45
          speaker: narrator
          text: 黑暗里，鼹鼠从毯子下伸出前爪，摸到河鼠的爪子，轻轻握了一下。
        - id: ch01-b46
          speaker: mole
          text: 你想怎么办，我就怎么办。明天特别早的时候，咱们偷偷走掉，回河边那个亲爱的老洞，好不好？
        - id: ch01-b47
          speaker: rat
          text: 不，咱们要陪他走完。我很感谢你，可在旅行结束前，我不能丢下蟾蜍。让他自己待着不安全。不会太久，他的兴头向来长不了。晚安。
        - id: ch01-b48
          speaker: narrator
          text: 其实，旅程的终点比河鼠料想得还近。在户外待了那么久，又兴奋了整整一天，蟾蜍这一夜睡得格外香。第二天早晨，无论朋友们怎样推他摇他，也没法把他弄醒。鼹鼠和河鼠只得安安静静地拿出男子汉的气概，动手干活。河鼠照料老灰马，点起炉火，洗净昨晚用过的杯子和盘子，再把早餐预备起来。鼹鼠则独自走了很远，到最近的村子买牛奶、鸡蛋和种种必需品。这些东西，蟾蜍自然忘得一干二净。等所有苦活全都做完，两位已经累得筋疲力尽，正在歇息。蟾蜍这才神清气爽地出现。
        - id: ch01-b49
          speaker: toad
          text: 摆脱了家里的操心、烦恼和劳累，现在这种日子真是轻松愉快！
        - id: ch01-b50
          speaker: narrator
          text: 那天，他们走过长满青草的丘陵，又沿狭窄的乡间小路前行，沿途十分惬意。晚上，大家像头一天那样在公地宿营。这一回，鼹鼠和河鼠留了心，非叫蟾蜍公平地分担活计。于是第二天早晨要动身时，蟾蜍对简朴的原始生活已经不那么着迷，甚至想重新钻回卧铺，被朋友们硬生生拖了出来。他们又像前一天那样穿过乡间窄道，直到午后才走上旅途中遇到的第一条公路。一场迅疾又意外的灾难正在那里等着，忽然便会扑到他们身上。这场灾难毁了这次远行，更彻底改变了蟾蜍往后的一生。
        - id: ch01-b51
          speaker: narrator
          text: 大家悠闲地沿公路前行。鼹鼠走在老灰马头边，一路陪他讲话，因为老灰马抱怨自己被冷落得太厉害，谁都不肯替他着想。蟾蜍和河鼠跟在车后，看起来像是在交谈。其实，蟾蜍从头到尾说个不停，河鼠只隔一阵随口应上两句，心思早已飘到完全不同的事情上。
        - id: ch01-b52
          speaker: rat
          text: 对，正是这样。那么你对他说了什么？
        - id: ch01-b53
          speaker: narrator
          text: 身后很远的地方传来一阵隐隐的警告声，嗡嗡响着，像远方的蜜蜂在振翅。他们回头望去，看见一小团尘云正以难以相信的速度追来，云心里有股黑色的力量在涌动。尘土中传来微弱的“噗噗”声，像一只不安的动物在痛苦地呻吟。他们并没放在心上，转过身还想继续方才的谈话。可仿佛只过了一瞬，宁静的公路便全变了。狂风和震耳的巨响一同卷来，吓得他们纷纷跳进最近的路沟。那个东西已经扑到了眼前。
        - id: ch01-b54
          speaker: narrator
          text: “噗噗”声像铜号一样在耳边吼叫。他们只来得及瞥见车里亮闪闪的平板玻璃和华贵的摩洛哥皮革内饰。那辆雄伟的汽车实在庞大，叫人连气也喘不上来，整个车身都充满狂热的力量。驾车人紧绷着身体，死死抱住方向盘。短短一瞬，汽车仿佛占满了天地间所有空间。随后，它抛下一团铺天盖地的尘云，把他们完全包住，也彻底迷住了他们的眼睛。等尘土稍稍散去，汽车早在远方缩成一个黑点，又变回那只嗡嗡作响的蜜蜂。
        - id: ch01-b55
          speaker: narrator
          text: 老灰马一路慢慢走着，刚才还在梦见自己那片安静的围场。他从没有遇到过这样的怪物，忽然落进全然陌生的险境，便干脆任凭天性发作。他扬起前蹄，不住跳跃，又稳稳地一步步往后退。鼹鼠守在他头边，拼命拽住他，还说尽了激烈的话，想唤醒他心里通情达理的一面，可什么也没用。老灰马硬把篷车倒着推向路旁的深沟。车在沟边摇晃了一下，紧接着传来一声叫人心碎的巨响。那辆金丝雀色的篷车，他们一路上的骄傲和快乐，就这样翻倒在沟里，摔成无法挽救的残骸。
        - id: ch01-b56
          speaker: narrator
          text: 河鼠气得在路上直跳，挥舞着两只拳头，整只动物几乎被怒火托了起来。方才的思乡之情早已消失。此刻，他仿佛成了那条金丝雀色船只的船长，别的水手鲁莽地争道，把他的船逼上浅滩。他努力回想从前痛骂蒸汽艇船长时说过的那些又漂亮、又尖刻的话。那些蒸汽艇总贴着河岸开得太近，掀起的浪越过岸边，涌进他的家，连客厅里的地毯也会被淹湿。
        - id: ch01-b57
          speaker: rat
          text: 你们这些恶棍！无赖！强盗！公路恶霸！我要告你们，举报你们，把官司一层一层打到底！
          emotion: angry
        - id: ch01-b58
          speaker: narrator
          text: 蟾蜍却一屁股坐在公路正中，两腿直直伸在面前，盯着汽车消失的方向。他呼吸急促，脸上却安详而满足，不时有气无力地念叨一声“噗噗”。鼹鼠忙着安抚老灰马，费了好一阵才终于使他平静。随后，他走到沟边查看侧翻的篷车。眼前的景象实在凄惨。车板和窗户全摔碎了，车轴弯得没有修复的希望，一只车轮已经脱落。沙丁鱼罐头滚得到处都是，仿佛散落到了天涯海角。笼里的鸟儿正可怜巴巴地哭泣，不停叫人放它出去。
        - id: ch01-b59
          speaker: caged_bird
          text: 放我出去！快放我出去！
          emotion: fearful
        - id: ch01-b60
          speaker: narrator
          text: 河鼠过来帮忙，两位一起用力，还是扶不起车。
        - id: ch01-b61
          speakers: [rat, mole]
          ensemble: duo
          text: 喂，蟾蜍！快来搭把手！
        - id: ch01-b62
          speaker: narrator
          text: 蟾蜍一声不答，也一动不动。朋友们只好走过去，看他究竟出了什么事。他们发现蟾蜍像是陷入了某种迷醉，又像正做着一场美梦。那张脸上带着幸福的微笑，双眼仍旧望着毁掉篷车的汽车留下的尘烟，仿佛别的东西全看不见。他还会隔一阵低声念一句“噗噗”。河鼠忍无可忍，抓住他的肩膀，使劲摇晃起来。
        - id: ch01-b63
          speaker: rat
          text: 蟾蜍，你到底来不来帮忙？
        - id: ch01-b64
          speaker: toad
          text: 多么壮丽，多么激动人心！这是运动的诗篇，是真正的旅行，也是唯一的旅行！今天还在这里，明天已经冲进下星期。村庄一掠而过，市镇和都市一跃而过，眼前永远是别人的地平线。多么幸福！噗噗！哎哟，哎哟！
          emotion: happy
        - id: ch01-b65
          speaker: mole
          text: 蟾蜍，别再犯傻了！
        - id: ch01-b66
          speaker: toad
          text: 想想看，我从前竟然什么都不知道！过去那么多年全白白浪费了，我连做梦也没梦见过。可现在，我终于彻底明白了！从今以后，前面会铺着多么灿烂的道路。我会不顾一切地飞驰，身后扬起滚滚尘云。我的汽车猛冲过去，把一辆辆篷车随手甩进路沟。讨厌的小破车，平庸的篷车，还有金丝雀色的篷车！
        - id: ch01-b67
          speaker: mole
          text: 咱们拿他怎么办？
        - id: ch01-b68
          speaker: rat
          text: 什么也不办，因为根本没有办法。我太了解他了。他又迷上了新东西，每次刚开始都会这样。接下来好几天，他都会像在美梦里走路，什么实际的事也做不了。别管他，咱们看看篷车怎么办。
        - id: ch01-b69
          speaker: narrator
          text: 两位仔细查看了篷车。就算只凭他们的力气能够把车扶正，它也再不可能上路。两根车轴已经坏得没有办法挽救，掉下来的车轮也摔成了碎片。河鼠只好把老灰马的缰绳在他背上打个结，再走到前面牵住马头。另一只手则提着鸟笼，还有笼里那位已经歇斯底里的小乘客。
        - id: ch01-b70
          speaker: rat
          text: 走吧。最近的镇子还有五六英里，咱们只能走过去。越早动身越好。
        - id: ch01-b71
          speaker: mole
          text: 蟾蜍怎么办？他神志不清，独自坐在公路中间，不能把他丢下。要是又有一辆那种东西开来呢？
        - id: ch01-b72
          speaker: rat
          text: 管他蟾蜍呢！我再也不管了！
          emotion: angry
        - id: ch01-b73
          speaker: narrator
          text: 可他们一同上路以后，还没有走出多远，身后便响起啪嗒啪嗒的脚步。原来蟾蜍自己追了上来。他赶到两位朋友中间，一只前爪挽住一个朋友的胳膊，跟着他们往前走。蟾蜍依旧呼吸急促，双眼茫然地盯着空处，显然还没有从那辆汽车带来的震撼中清醒过来。
        - id: ch01-b74
          speaker: rat
          text: 蟾蜍，听清楚。一到镇上，你就去警察局，问他们知不知道那辆汽车和车主的消息，再正式控告。然后去找铁匠或车轮匠，请人把篷车拉回来修好。这需要时间，但也没有完全坏到不能修。我和鼹鼠去客栈找舒服的房间。咱们住到车修好，也住到你从这场惊吓里恢复过来。
        - id: ch01-b75
          speaker: toad
          text: 警察局？控告？那么美丽又神圣的异象出现在我面前，我怎么能控告它！还修什么篷车？我永远不要篷车了，也不想再看见它、听人提起它。河鼠，你肯陪我来旅行，我真不知该怎么谢你。没有你，我不会出发，也许永远看不到那只天鹅、那道阳光、那道霹雳，永远听不见迷人的声音，也闻不到让人陶醉的气味。这全是你的功劳，我最好的朋友！
          emotion: happy
        - id: ch01-b76
          speaker: narrator
          text: 听完这番话，河鼠绝望地扭开脸。他站在蟾蜍一边，鼹鼠站在另一边，于是河鼠干脆越过蟾蜍的头顶，只对鼹鼠讲话，再不指望蟾蜍能够听进任何道理。
        - id: ch01-b77
          speaker: rat
          text: 你看见了吧？他完全没救了。我认输。到了镇上，咱们就去火车站。运气好，也许今晚就能回河岸。以后要是你再见我跟这个气人的家伙出来寻开心……
        - id: ch01-b78
          speaker: narrator
          text: 河鼠重重哼了一声。后面那段疲惫的长路上，他只和鼹鼠说话，再也没有搭理蟾蜍。进了镇，三位直奔车站。他们把蟾蜍留在二等候车室，又给搬运工两便士，请他寸步不离地严加看守。随后，他们把老灰马安置在一家客栈的马厩里，还把篷车和车中物品的事情尽可能交代妥当。等了很久，一班慢车才把他们送到离蟾蜍庄园不远的车站。鼹鼠和河鼠护送着中了魔、像在梦游的蟾蜍回到家门前，把他推进门内。他们认真吩咐管家给蟾蜍吃饭，替他脱下衣服，再把他送上床休息。
        - id: ch01-b79
          speaker: narrator
          text: 两位从蟾蜍庄园的船屋里取出自己的小船，坐进去拿起双桨，沿着熟悉的河道一路划回家。这一番折腾耗去了许多时间，等他们到家，夜已经很深。两位终于坐进河边那间熟悉而舒适的客厅，安安稳稳地吃起晚饭。重新回到河边，河鼠心里又欢喜，又满足。
        - id: ch01-b80
          speaker: narrator
          text: 第二天傍晚，鼹鼠因为前一天太累，睡到很晚才起床，余下的时间也一直过得十分悠闲。这时，他正独自坐在岸边钓鱼。河鼠则沿河拜访了不少朋友，听过各处的消息，也和大家聊够了天。后来，他信步走到鼹鼠身边，带来了一桩轰动整条河岸的新闻。
        - id: ch01-b81
          speaker: rat
          text: 听说消息了吗？整条河岸都在谈这件事。蟾蜍今天一早坐火车去了城里，还订购了一辆又大又昂贵的汽车。
