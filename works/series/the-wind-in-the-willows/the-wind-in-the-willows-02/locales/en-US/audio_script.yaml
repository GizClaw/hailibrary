  chapters:
    - id: ch01
      title: The Open Road
      blocks:
        - id: ch01-b01
          speaker: mole
          text: Ratty, could I ask you a favor?
        - id: ch01-b02
          speaker: narrator
          text: It was a bright summer morning, and Rat was sitting on the riverbank, singing a song he had just made up. He was so pleased with it that Mole could hardly get his attention. Rat had spent the whole morning swimming with his friends the ducks. Whenever they tipped upside down, as ducks do, he dove beneath them and tickled their necks just below where their chins would have been, if ducks had chins. Up they came in a great hurry, spluttering, furious, and shaking their wet feathers at him. With their heads underwater, they had not been able to say everything they felt. At last, they begged him to go away, mind his own business, and let them mind theirs. So Rat left them alone, found a sunny place on the bank, and wrote a song about them called “Ducks' Ditty.”
        - id: ch01-b03
          speaker: water_rat
          text: Down the quiet backwater, through the rushes tall, ducks go dabbling, tails in the air. Drakes' tails, ducks' tails, yellow feet all trembling, yellow bills beneath the water, busy in the river. In the soft green weeds where the roach swim, we keep our pantry cool and dark and full. Everyone likes something different. We like heads down, tails up, dabbling free. High in the blue, the swifts wheel and call. Down here, we keep dabbling, tails up, all!
        - id: ch01-b04
          speaker: mole
          text: I don't think that's a particularly good song, Rat.
        - id: ch01-b05
          speaker: narrator
          text: Mole was no poet himself, and he was honest enough to say what he thought.
        - id: ch01-b06
          speaker: water_rat
          text: The ducks don't like it either. They say, “Why can't we do what we want, when we want, the way we want? Why must fellows sit on the bank, watch us, and make comments and poems about us? What nonsense!” That's what the ducks say.
        - id: ch01-b07
          speaker: mole
          text: Quite right, too. Quite right!
        - id: ch01-b08
          speaker: water_rat
          text: No, it isn't!
          emotion: angry
        - id: ch01-b09
          speaker: mole
          text: Well, then it isn't. But what I meant to ask was, will you take me to visit Mr. Toad? I've heard so much about him, and I'd really like to meet him.
        - id: ch01-b10
          speaker: water_rat
          text: Of course! Get the boat out, and we'll paddle there now. Any time is a good time to visit Toad. He's always cheerful, always glad when you arrive, and always sorry when you leave.
        - id: ch01-b11
          speaker: narrator
          text: Rat jumped up and forgot all about poetry for the rest of the day. Mole climbed into the boat and took the oars while Rat settled comfortably in the stern.
        - id: ch01-b12
          speaker: mole
          text: He sounds like a very nice animal.
        - id: ch01-b13
          speaker: water_rat
          text: He's one of the best. He's simple, affectionate, and very good-natured. Maybe he isn't terribly clever. We can't all be geniuses. And yes, he can be boastful and full of himself. Still, Toad has some wonderful qualities.
        - id: ch01-b14
          speaker: narrator
          text: They rounded a bend and saw a handsome old red-brick house, mellow with age. Neat lawns ran all the way down to the water.
        - id: ch01-b15
          speaker: water_rat
          text: That's Toad Hall. See the creek on the left, by the sign that says, “Private. No landing allowed”? It leads to his boathouse, so we'll leave our boat there. The stables are on the right, and that great room is the banquet hall. It's very old. Toad is rich, you know. This is one of the finest houses around here, though we never tell him so.
        - id: ch01-b16
          speaker: narrator
          text: They slipped into the creek, and Mole pulled in the oars as the boat entered the shadow of the large boathouse. Fine boats hung from the beams or stood on the ramp, but not one was in the water. The whole place felt deserted.
        - id: ch01-b17
          speaker: water_rat
          text: I see what's happened. He's finished with boating. He's tired of it already. I wonder what new craze has taken its place. Come on. We'll find him, and I'm sure we'll hear more than enough about it.
        - id: ch01-b18
          speaker: narrator
          text: They left the boat, crossed the bright lawns among the flowers, and searched for Toad. Before long, they found him resting in a wicker garden chair. For once, he looked deeply occupied. A large map lay open across his knees, and he was studying it with a serious face. The moment he caught sight of his visitors, the serious look vanished and he leaped to his feet.
        - id: ch01-b19
          speaker: toad
          text: Hooray! This is perfect!
          emotion: happy
        - id: ch01-b20
          speaker: narrator
          text: Toad shook both their paws without waiting to be introduced to Mole. Then he danced around them.
        - id: ch01-b21
          speaker: toad
          text: How good of you to come! Ratty, I was about to send a boat downriver with orders to bring you here, no matter what you were doing. I need you both. What can I get you? Come inside and have something. You have no idea how lucky it is that you arrived right now!
        - id: ch01-b22
          speaker: water_rat
          text: Let's sit quietly for a minute, Toady.
        - id: ch01-b23
          speaker: narrator
          text: Rat dropped into an easy chair. Mole sat beside him and politely admired Toad's lovely home.
        - id: ch01-b24
          speaker: toad
          text: The finest house on the entire river! In fact, the finest house anywhere!
        - id: ch01-b25
          speaker: narrator
          text: Rat nudged Mole. Toad saw him and turned bright red. An awkward silence followed. Then Toad began to laugh.
        - id: ch01-b26
          speaker: toad
          text: All right, Ratty. You know how I am. Still, it's not a bad house, is it? You like it yourself. Now, let's be serious. You're exactly the two animals I need. You have to help me. This is important!
        - id: ch01-b27
          speaker: water_rat
          text: Is this about your rowing? You're doing fairly well, though you still splash quite a lot. With endless patience and a great deal of coaching, perhaps you might—
        - id: ch01-b28
          speaker: toad
          text: Oh, forget boating! What a silly little pastime. I gave it up ages ago. It's a complete waste of time. Honestly, it makes me sad to watch sensible fellows like you pour all your energy into something so pointless. No, I've found the real thing. The only true occupation for a whole lifetime! I'll devote the rest of my life to it and regret every year I wasted on trifles. Come with me to the stable yard, dear Ratty, and bring your charming friend. Then you'll see!
          emotion: disgusted
        - id: ch01-b29
          speaker: narrator
          text: Toad led them into the yard. Rat followed with a deeply suspicious look. Outside the coach house stood a brand-new traveling caravan, painted bright yellow with green trim and red wheels.
        - id: ch01-b30
          speaker: toad
          text: There it is! That's real life in one little cart. The open road, the dusty highway, the heath and common, the hedges and rolling hills! Camps, villages, towns, cities! Here today, somewhere else tomorrow! Travel, change, excitement! The whole world ahead of you and a new horizon every day! And remember, this is the finest cart ever built. No exceptions. Come inside and see how it's arranged. I planned every bit of it myself!
          emotion: happy
        - id: ch01-b31
          speaker: narrator
          text: Mole eagerly climbed the steps behind him. Rat stayed outside, snorted, and shoved his hands deep into his pockets. Inside, the caravan was small but comfortable. It had bunks, a folding table, a stove, lockers, bookshelves, a birdcage with a bird inside, and pots, pans, jugs, and kettles of every kind.
        - id: ch01-b32
          speaker: toad
          text: Everything's here! Look. Biscuits, canned lobster, sardines, and anything else you might want. Soda water here, tobacco there. Writing paper, bacon, jam, cards, dominoes. When we leave this afternoon, you'll discover I haven't forgotten a single thing.
        - id: ch01-b33
          speaker: narrator
          text: They came back down the steps. Rat slowly chewed a piece of straw.
        - id: ch01-b34
          speaker: water_rat
          text: Excuse me, but did I hear the words “we,” “leave,” and “this afternoon”?
        - id: ch01-b35
          speaker: toad
          text: Now, dear old Ratty, don't use that cold, stuffy voice. You know you have to come. I can't manage without you, so it's settled. Please don't argue. I can't stand arguments. You don't really mean to stay beside that dreary old river forever, living in a hole in the bank and doing nothing but boating. I want to show you the world! I'll turn you into a proper animal, my boy!
        - id: ch01-b36
          speaker: water_rat
          text: I don't care. I'm not going, and that's final. I will stay beside my old river, live in my hole, and go boating, just as I always have. Mole will stay with me and do the same. Won't you, Mole?
        - id: ch01-b37
          speaker: mole
          text: Of course. I'll always stand by you, Rat. Whatever you decide is what we'll do. Still, it does sound as though it might have been rather fun.
        - id: ch01-b38
          speaker: narrator
          text: Mole looked longingly at the yellow cart and all its clever little fittings. Adventure was still new to him, and this kind was terribly tempting. Rat understood at once and began to give way. He hated disappointing anyone, especially Mole, and would do almost anything for him. Toad watched them both closely.
        - id: ch01-b39
          speaker: toad
          text: Come inside for lunch, and we'll discuss it. There's no need to decide in a rush. Of course, I don't care for my own sake. I only want you two to be happy. “Live for others.” That's my motto.
        - id: ch01-b40
          speaker: narrator
          text: Lunch was excellent, as meals at Toad Hall always were. Toad let himself go completely. He paid no attention to Rat's doubts and worked on the inexperienced Mole as if he were playing a harp. Toad always had plenty to say, and his own imagination easily carried him away. Now he painted the journey in glowing colors. He described the open road, life beneath the sky, the places they would see, and the pleasures waiting beside every mile. Mole grew so excited that he could hardly stay in his chair. Somehow, before lunch was over, all three were speaking as though the trip had already been decided. Rat still did not believe in it, but his kind heart defeated every objection. He could not bear to disappoint two friends who were already making plans and deciding how they would spend each day for several weeks ahead.
        - id: ch01-b41
          speaker: narrator
          text: When everything was ready, a triumphant Toad took them to the paddock and put them to work catching the old gray horse. Nobody had asked the horse whether he wanted the dustiest job on this dusty trip, and he was extremely annoyed to learn that Toad had chosen him for it. He frankly preferred his quiet paddock. He ran from them again and again and took a very long time to catch. Meanwhile, Toad kept packing the lockers more tightly with things he called necessities. He hung feed bags, onion nets, hay bundles, and baskets from the bottom of the cart until every possible space seemed full.
        - id: ch01-b42
          speaker: narrator
          text: At last, they caught the horse, put on his harness, and set out. All three talked at once as they traveled. Whenever the mood took them, they walked beside the cart or perched on its shaft for a ride. It was a golden afternoon. Their feet and wheels lifted dust from the road, and its warm, rich smell pleased them. Thick orchards stood on both sides, and birds called and whistled cheerfully from among the leaves. Friendly travelers wished them a good day. Some stopped to admire the handsome caravan and say kind things about it. Rabbits sat at the front doors of their homes in the hedges. As the bright cart rolled past, they raised their front paws and cried, “Oh my! Oh my! Oh my!”
        - id: ch01-b43
          speaker: narrator
          text: Late that evening, they were tired, happy, and many miles from home. They stopped on a lonely common, far from any house. After turning the horse loose to graze, they sat on the grass beside the caravan and ate a simple supper. Toad talked grandly about everything he meant to do in the coming days. While he spoke, the stars all around them seemed to grow fuller, brighter, and larger. Then a yellow moon appeared suddenly and silently from no particular place. It kept them company and seemed to listen to every boast and plan.
        - id: ch01-b44
          speaker: narrator
          text: At last, they climbed into their bunks. Toad stretched out his legs sleepily.
        - id: ch01-b45
          speaker: toad
          text: Good night, fellows! Now this is the true life of a gentleman. So much for your old river!
        - id: ch01-b46
          speaker: water_rat
          text: I don't talk about my river, Toad. You know I don't. But I think about it. I think about it all the time.
          emotion: sad
        - id: ch01-b47
          speaker: narrator
          text: In the dark, Mole reached from under his blanket, found Rat's paw, and squeezed it.
        - id: ch01-b48
          speaker: mole
          text: I'll do whatever you want, Ratty. Should we slip away very early tomorrow and go back to our dear little home by the river?
        - id: ch01-b49
          speaker: water_rat
          text: No. We'll finish the trip. Thank you, but I should stay with Toad until it's over. He isn't safe on his own. It won't last long. His crazes never do. Good night.
        - id: ch01-b50
          speaker: narrator
          text: The end was closer than Rat imagined.
        - id: ch01-b51
          speaker: narrator
          text: After all that fresh air and excitement, Toad slept so deeply that no amount of shaking could wake him the next morning. Mole and Rat quietly did the work. Rat cared for the horse, lit the fire, washed the cups and plates from the night before, and prepared breakfast. Mole walked a long way to the nearest village for milk, eggs, and the other supplies Toad had naturally forgotten. By the time Toad appeared, fresh and cheerful, the work was finished and his two exhausted friends were resting.
        - id: ch01-b52
          speaker: toad
          text: What a pleasant, easy life this is! Think of all the worries and hard work we had when we kept house at home.
        - id: ch01-b53
          speaker: narrator
          text: That day, they had a pleasant journey over wide grassy hills and along narrow country lanes. That evening, they camped on another common much as they had before. This time, however, the two guests made very sure that Toad did a fair share of the work. The experience changed him. When morning came and it was time to set off again, he was no longer nearly so delighted by the simplicity of outdoor life. In fact, he tried to climb back into his bunk and stay there. Rat and Mole had to haul him out by force before the journey could continue.
        - id: ch01-b54
          speaker: narrator
          text: Once again, they followed small lanes across the countryside. Not until afternoon did they reach their first main road. There, a sudden disaster raced toward them. It ended their journey and changed the rest of Toad's life.
        - id: ch01-b55
          speaker: narrator
          text: They strolled easily along the main road. Mole walked beside the horse's head and kept him company. The horse had complained bitterly that everyone left him out of things and that nobody considered him at all. Behind the cart came Toad and Rat, supposedly talking together. In truth, Toad did nearly all the talking. Every now and then, Rat murmured, “Yes, exactly. And what did you say to him?” All the while, Rat's thoughts were somewhere completely different.
        - id: ch01-b56
          speaker: narrator
          text: Far behind them came a faint warning hum, like the drone of a bee in the distance. They glanced over their shoulders. A small cloud of dust was moving toward them at an unbelievable speed. At its center was something dark, alive with power. The cloud grew larger as it rushed down the road, and from somewhere inside came a faint, mournful cry.
        - id: ch01-b57
          speaker: narrator
          text: Poop-poop!
        - id: ch01-b58
          speaker: narrator
          text: It sounded like some uneasy animal crying in pain. The three travelers hardly noticed it. They turned away and tried to continue their conversation. In what seemed like a single instant, the peaceful road changed completely. A blast of wind and a whirl of noise struck them. They jumped toward the nearest ditch just as the racing thing came upon them.
        - id: ch01-b59
          speaker: narrator
          text: Poop-poop!
        - id: ch01-b60
          speaker: narrator
          text: The horn blared like brass in their ears. For one breathless moment, they caught a glimpse through glittering glass of rich leather inside. The magnificent motorcar was huge, fierce, and full of passion. Its driver sat tense, hugging the wheel. For a fraction of a second, the car seemed to possess all the earth and air around them. Then it flung a thick cloud of dust over animals, horse, and caravan. The dust blinded them and wrapped them up completely. By the time they could see again, the motorcar had shrunk to a speck far down the road. Its roar faded until it sounded like a distant bee once more.
        - id: ch01-b61
          speaker: narrator
          text: The old gray horse had been plodding along and dreaming about his quiet paddock. He had never faced anything like this strange new terror. At once, he gave himself up to every frightened feeling in him. He reared, plunged, and backed steadily toward the deep ditch beside the road. Mole struggled at his head and called on the horse's better nature in the strongest language he knew, but nothing stopped him. The yellow caravan rolled backward. It trembled on the edge for one terrible instant. Then came a crash that broke their hearts. Their pride and joy fell onto its side in the ditch, a wreck that could never be made whole again.
        - id: ch01-b62
          speaker: narrator
          text: Rat jumped up and down in a fury.
        - id: ch01-b63
          speaker: water_rat
          text: You villains! You criminals! You road hogs! I'll bring the law down on you! I'll report you and drag you through every court there is!
          emotion: angry
        - id: ch01-b64
          speaker: narrator
          text: Rat had completely forgotten that he missed home. For that moment, he was no longer a traveler on a dusty road. In his own mind, he had become captain of the yellow vessel, and careless rival sailors had driven it onto the rocks. He stamped and raged while trying to remember every fine, cutting thing he used to shout at the captains of steamboats. Those boats sometimes passed too close to the riverbank, sending a wake into Rat's home and flooding the carpet in his parlor.
        - id: ch01-b65
          speaker: narrator
          text: Toad sat down in the middle of the dusty road with his legs stretched before him. He stared after the disappearing car, breathing in short gasps. His face looked peaceful and completely satisfied. Every so often, he murmured to himself.
        - id: ch01-b66
          speaker: toad
          text: Poop-poop!
        - id: ch01-b67
          speaker: narrator
          text: Mole stayed with the horse until he finally managed to calm him. Then he went to examine the caravan lying in the ditch. It was a miserable sight. Its panels had split, its windows were smashed, and both axles were bent beyond hope. One wheel had come off completely. Sardine cans from Toad's carefully packed supplies lay scattered across the wide world. In the fallen cage, the poor bird sobbed and called pitifully for someone to let it out. Rat came over to help Mole. They pushed and pulled together, but even their combined strength could not lift the caravan upright.
        - id: ch01-b68
          speakers: [water_rat, mole]
          ensemble: duo
          text: Toad! Come help us, will you?
        - id: ch01-b69
          speaker: narrator
          text: Toad did not answer or move. They went over and found him in a happy trance, smiling at the dusty trail left by the car. Still, now and then, he whispered, “Poop-poop.” Rat shook his shoulder.
        - id: ch01-b70
          speaker: water_rat
          text: Are you going to help us, Toad?
        - id: ch01-b71
          speaker: toad
          text: What a glorious, thrilling sight! That was motion turned into poetry! That's the real way to travel. The only way! Here today and somewhere beyond tomorrow next week! Skip the villages, leap over the towns and cities, and keep chasing somebody else's horizon! Oh, what happiness! Oh, poop-poop! Oh my! Oh my!
          emotion: happy
        - id: ch01-b72
          speaker: mole
          text: Oh, stop acting like a fool, Toad!
          emotion: angry
        - id: ch01-b73
          speaker: toad
          text: And to think I never knew! All those wasted years behind me, and I never knew or even dreamed such a thing existed. But now I know. Now I truly understand! What a beautiful road lies open before me from this day on! What great clouds of dust will rise behind me as I race recklessly ahead! What carts I'll toss carelessly into ditches when I sweep past! Horrid little carts. Ordinary carts. Yellow carts!
          emotion: happy
        - id: ch01-b74
          speaker: mole
          text: What are we going to do with him?
        - id: ch01-b75
          speaker: water_rat
          text: Nothing at all. There isn't anything we can do. I've known him for a very long time, and I recognize the signs. A new craze has taken possession of him. This is always what happens in the first stage. For days, he'll wander around like an animal in a beautiful dream. He won't be the slightest use for anything practical. Never mind him now. Let's go back and find out what can be done about the cart.
        - id: ch01-b76
          speaker: narrator
          text: They inspected every part of the wreck with great care. The caravan would never move again, even if they somehow managed to lift it out of the ditch by themselves. The axles were in a hopeless condition, and the missing wheel lay nearby, shattered into pieces.
        - id: ch01-b77
          speaker: narrator
          text: Rat tied the horse's reins over its back and took hold of its head. In his other hand, he carried the birdcage and its frantic passenger.
        - id: ch01-b78
          speaker: water_rat
          text: Come on, Mole. The nearest town is five or six miles away, and we'll have to walk. We should start now.
        - id: ch01-b79
          speaker: mole
          text: But what about Toad? We can't leave him sitting alone in the road when he's in this state. It isn't safe. What if another one of those things comes along?
        - id: ch01-b80
          speaker: water_rat
          text: Oh, bother Toad! I'm finished with him!
          emotion: angry
        - id: ch01-b81
          speaker: narrator
          text: They had not gone far when quick footsteps pattered behind them. Toad caught up and slipped one paw through each friend's arm. He was still breathing hard and staring into the distance.
        - id: ch01-b82
          speaker: water_rat
          text: Listen carefully, Toad. As soon as we reach town, you must go to the police station. Find out who owns that car and make a complaint. Then go to a blacksmith or wheelwright and arrange to have the caravan collected and repaired. It will take time, but the damage may not be completely hopeless. Mole and I will find rooms at an inn while we wait for the cart and for your nerves to settle.
        - id: ch01-b83
          speaker: toad
          text: The police station? A complaint? You want me to complain about that beautiful, heavenly vision that was granted to me? Repair the cart? I'm finished with carts forever. I never want to see that cart or even hear about it again. Oh, Ratty, how can I thank you for agreeing to this trip? I would never have left home without you. Then I might never have seen that swan, that sunbeam, that thunderbolt! I might never have heard that wonderful sound or breathed in that magical smell! I owe the whole discovery to you, my very best friend!
          emotion: happy
        - id: ch01-b84
          speaker: narrator
          text: Rat turned away in despair and spoke to Mole across Toad's head.
        - id: ch01-b85
          speaker: water_rat
          text: Now you see. He's hopeless, and I give up. When we reach town, we'll go to the station. If we're lucky, a train can take us back to the riverbank tonight. And if you ever catch me going on another pleasure trip with this impossible animal—
        - id: ch01-b86
          speaker: narrator
          text: Rat snorted. For the rest of the long, tiring walk, he spoke only to Mole.
        - id: ch01-b87
          speaker: narrator
          text: When they reached town, they went straight to the train station. Toad was still lost in his strange dream, so they placed him in the second-class waiting room. They gave a porter two pennies and strict instructions to keep a close eye on him. Then Rat and Mole led the old horse to the stable at an inn. They explained where the wrecked caravan lay and gave the best directions they could about what should be done with the cart and everything scattered around it.
        - id: ch01-b88
          speaker: narrator
          text: Eventually, a slow train carried the three animals to a station not far from Toad Hall. From there, Rat and Mole escorted the enchanted, sleepwalking Toad all the way to his own front door. They put him safely inside and told his housekeeper exactly what to do. She must give him something to eat, undress him, and put him to bed. Their duty finished, Rat and Mole went to the boathouse, pulled out their own little boat, and rowed downriver toward home. It was very late when they finally sat down to supper in their cozy parlor beside the water. Rat looked around the familiar room with deep joy and contentment.
        - id: ch01-b89
          speaker: narrator
          text: The next evening, Mole sat fishing on the bank. He had slept late and taken the whole day easily. Rat had been visiting friends and trading news. He came strolling over.
        - id: ch01-b90
          speaker: water_rat
          text: Have you heard? Everyone along the river is talking about it. Toad took an early train to Town this morning. He's ordered a large and very expensive motorcar.
