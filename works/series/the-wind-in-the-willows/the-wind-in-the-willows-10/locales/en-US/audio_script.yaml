  chapters:
    - id: ch01
      title: THE FURTHER ADVENTURES OF TOAD
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Early sunlight poured through the east-facing door of the hollow tree and woke Toad. His toes were terribly cold. In his sleep, he had imagined himself back in his handsome bedroom at home on a winter night. The blankets had climbed out of bed, complaining about the cold, and run down to the kitchen fire. Toad had chased them barefoot through miles of icy stone hallways, begging them to come back. After weeks of sleeping on straw over stone floors, he had nearly forgotten how friendly thick blankets could feel under his chin.
        - id: ch01-b02
          speaker: narrator
          text: He sat up and rubbed his eyes first. Then he rubbed his aching, complaining toes. For one confused moment, he could not remember where he was. He looked around, expecting to see the familiar stone walls of his cell and the little window crossed with bars. Then his heart gave a sudden leap. Everything came back to him at once. He remembered escaping from prison, running for his life, and being pursued across the countryside. Above all, he remembered the best and most wonderful fact. He was free.
        - id: ch01-b03
          speaker: narrator
          text: Free! The word alone warmed him more than fifty blankets could have done. Outside waited the cheerful world, eager for Toad to make his grand return. In his imagination, that world was ready to serve him, play along with him, help him whenever he needed it, and keep him company. Had it not always done so in the good old days, before misfortune came along? Toad shook himself and used his fingers to comb the dry leaves from his hair. That was all the dressing he needed. He marched out into the comfortable morning sunshine. The air was cold, but his confidence was warm. He was hungry, yet full of hope. Rest, sleep, and honest sunlight had chased away every nervous terror left from the day before.
        - id: ch01-b04
          speaker: narrator
          text: Toad had the early summer morning to himself. He threaded his way through damp, silent woods, then came out among green fields with no one else in sight. They seemed to belong to him, ready for him to do whatever he liked. When he reached the road, that too was deserted. It looked almost like a stray dog hoping someone would come along. But Toad did not need a quiet companion. He needed someone who could talk and tell him clearly which direction to take. Wandering wherever a road pointed might be pleasant if your heart was light, your conscience was clear, you had money in your pocket, and no one was searching the countryside to drag you back to prison. Toad's situation was nothing like that. He cared very much where he was going, and every minute mattered. He felt almost angry enough to kick the road for standing there in helpless silence.
        - id: ch01-b05
          speaker: narrator
          text: Before long, a little canal came around a bend and joined the road. It traveled beside the road as trustingly as a shy younger brother holding its hand. Yet the canal was no friend to strangers. It was just as tongue-tied and unhelpful as the road.
        - id: ch01-b06
          speaker: toad
          text: Bother them both! Still, one thing is certain. The road and the canal must come from somewhere and go somewhere. There's no arguing with that, Toad, my boy!
        - id: ch01-b07
          speaker: narrator
          text: So he followed the water. Around a bend came a lone horse, plodding with its head bowed. A towrope ran back from its collar and dipped into the canal with every step. Toad let the horse pass and waited to see what followed.
        - id: ch01-b08
          speaker: narrator
          text: The bow of a barge appeared, pushing the quiet water aside with a pleasant swirl. Its brightly painted upper edge came level with the towpath as it slid alongside Toad. There was only one person aboard. A large, strong woman in a linen sunbonnet stood at the tiller, with one powerful arm resting along its handle.
        - id: ch01-b09
          speaker: barge_woman
          text: Fine morning, ma'am!
        - id: ch01-b10
          speaker: toad
          text: Perhaps it is for people who aren't in terrible trouble. My married daughter sent for me in a great hurry, and I came at once. I don't know what has happened, but naturally I fear the worst. You'll understand if you're a mother. I left my laundry business to manage itself, and my young children too. A more troublesome pack of little imps never lived. Now I've lost my money and my way, and I can hardly bear to think what may be happening to my daughter!
        - id: ch01-b11
          speaker: barge_woman
          text: And where does your married daughter live, ma'am?
        - id: ch01-b12
          speaker: toad
          text: Near the river, close to a grand place called Toad Hall. It should be somewhere around here. Maybe you've heard of it.
        - id: ch01-b13
          speaker: barge_woman
          text: Toad Hall? I'm heading that way myself. This canal meets the river a few miles ahead, just above the Hall. After that, it's an easy walk. Come aboard and I'll take you along.
        - id: ch01-b14
          speaker: narrator
          text: She brought the barge close to the bank. Toad thanked her humbly, stepped aboard, and sat down feeling very pleased with himself.
        - id: ch01-b15
          speaker: toad
          text: Toad's luck again! I always land on top!
        - id: ch01-b16
          speaker: barge_woman
          text: So you're in the laundry business? It must be a good trade, if you don't mind my saying so.
        - id: ch01-b17
          speaker: toad
          text: The finest trade in the country. All the grand families bring their things to me. They wouldn't use anyone else. I know the work from top to bottom and watch over everything myself. Washing, ironing, starching, finishing gentlemen's dress shirts. Nothing leaves without my approval.
        - id: ch01-b18
          speaker: barge_woman
          text: But you don't do every bit of that work yourself, do you?
        - id: ch01-b19
          speaker: toad
          text: Oh, I have girls. About twenty of them, always working. But you know how girls are. Nasty little creatures, that's what I call them.
        - id: ch01-b20
          speaker: barge_woman
          text: So do I! I expect you keep those lazy things in their place. And do you truly enjoy washing?
        - id: ch01-b21
          speaker: toad
          text: I adore it. I'm never happier than when both arms are in the washtub. Of course, it comes naturally to me. No trouble at all. It's a real pleasure.
        - id: ch01-b22
          speaker: barge_woman
          text: Then meeting you is wonderful luck. Good fortune for both of us!
        - id: ch01-b23
          speaker: toad
          text: What exactly do you mean?
        - id: ch01-b24
          speaker: barge_woman
          text: Well, I like washing too, and I have to do my own while we're traveling. My husband is always slipping away from his work and leaving the barge to me. He ought to be steering or minding the horse right now. Luckily, the horse can mind himself. But my husband has gone off with the dog to find a rabbit for dinner. He says he'll catch me at the next lock. I don't trust him when he's with that dog, and the dog is even worse. So when am I supposed to do my washing?
        - id: ch01-b25
          speaker: toad
          text: Oh, forget the washing. Think about the rabbit instead. A nice young, fat one, I'll bet. Do you have onions?
        - id: ch01-b26
          speaker: barge_woman
          text: I can only think about my washing, and I'm surprised you're talking about rabbits with such a treat waiting for you. There's a pile of my clothes in the cabin. A lady like you will know which things need doing most. Put one or two through the tub while we travel. You'll enjoy yourself, just as you said, and you'll help me too. There's a tub, soap, a kettle on the stove, and a bucket for canal water. Much better than sitting idle, staring at the view and yawning.
        - id: ch01-b27
          speaker: toad
          text: Let me steer instead! Then you can wash things exactly the way you like. I might spoil them. I'm used to gentlemen's clothes. That's my special work.
        - id: ch01-b28
          speaker: barge_woman
          text: Let you steer? Handling a barge takes practice. Besides, steering is dull, and I want you to enjoy yourself. You do the washing you love, and I'll do the steering I understand. Don't take away my pleasure in giving you a treat!
        - id: ch01-b29
          speaker: narrator
          text: Toad was trapped. The bank was too far away for him to jump. He looked for another escape, found none, and gave in with a scowl.
        - id: ch01-b30
          speaker: toad
          text: Well, any fool can wash clothes.
        - id: ch01-b31
          speaker: narrator
          text: He fetched the tub, soap, and other supplies. He chose a few clothes at random, tried to remember what he had glimpsed through laundry windows, and began.
        - id: ch01-b32
          speaker: narrator
          text: A long half hour dragged by, and Toad grew angrier with every minute. Nothing he did seemed to please the clothes or make them any cleaner. He spoke gently to them. He slapped them, then punched them. Still they floated in the tub, smiling back at him as if perfectly satisfied with all their original dirt. Once or twice, he glanced nervously over his shoulder. The barge-woman appeared to be looking straight ahead, completely occupied with steering. His back began to ache badly. Then he noticed, with real horror, that the water was making his paws wrinkly. Toad was extremely proud of his paws. He muttered words that should never come from a washerwoman or a Toad, fumbled around in the water, and lost the soap for what felt like the fiftieth time.
        - id: ch01-b33
          speaker: narrator
          text: A sudden roar of laughter made him spin around. The barge-woman was leaning back, laughing until tears ran down her face.
        - id: ch01-b34
          speaker: barge_woman
          text: I've watched you the whole time! I guessed you were a fraud from the way you bragged. Some washerwoman you are! You've never washed so much as a dishcloth in your life!
          emotion: happy
        - id: ch01-b35
          speaker: narrator
          text: Toad's temper had been simmering. Now it boiled over, and he lost all control.
        - id: ch01-b36
          speaker: toad
          text: You common, low, fat barge-woman! How dare you speak that way to someone above you! Washerwoman? I am Toad. A famous, respected, distinguished Toad! I may be in some difficulty just now, but I will not be laughed at by a barge-woman!
          emotion: angry
        - id: ch01-b37
          speaker: narrator
          text: The woman came closer and peered sharply beneath his bonnet.
        - id: ch01-b38
          speaker: barge_woman
          text: Why, you are a Toad! Well, imagine that. A horrible, nasty, crawling Toad in my nice clean barge! I won't have it!
          emotion: disgusted
        - id: ch01-b39
          speaker: narrator
          text: She let go of the tiller for one moment. One great arm caught Toad by a front leg, and the other grabbed a back leg. The world flipped upside down. The barge sailed across the sky, wind whistled in his ears, and Toad spun through the air.
        - id: ch01-b40
          speaker: narrator
          text: At last he hit the canal with a tremendous splash. The water was more than cold enough for him, but even that chill could not cool his pride or put out his blazing temper. He rose spluttering to the surface. After wiping the duckweed from his eyes, the first thing he saw was the barge-woman. She was looking back over the stern of the barge as it moved away, and she was still laughing at him. Between coughs and choking breaths, Toad swore he would get even with her.
        - id: ch01-b41
          speaker: narrator
          text: He swam for shore, slowed by the cotton dress. The bank was steep, and climbing it took all his strength. After stopping to catch his breath, he gathered the wet skirts over his arms and raced after the barge, burning for revenge.
        - id: ch01-b42
          speaker: barge_woman
          text: Run yourself through the wringer, washerwoman! Iron your face and crimp it too. Then you might pass for a decent-looking Toad!
        - id: ch01-b43
          speaker: narrator
          text: Toad did not slow down to answer. He wanted solid revenge, not the cheap victory of trading windy insults, though several excellent replies had come to mind. Ahead of him, he saw exactly what he needed. He raced on, passed the barge, and overtook the horse. In one quick movement he unfastened the towrope and cast it loose. Then he jumped lightly onto the horse's back and kicked hard at its sides until it broke into a gallop. He steered away from the towpath into open country and sent his new mount down a deeply rutted lane. Once, he turned to look behind him. The loose barge had crossed the canal and run aground on the opposite bank. The barge-woman was waving her arms wildly and shouting after him.
        - id: ch01-b44
          speaker: barge_woman
          text: Stop! Stop! Stop!
          emotion: angry
        - id: ch01-b45
          speaker: toad
          text: I've heard that song before!
          emotion: happy
        - id: ch01-b46
          speaker: narrator
          text: The barge horse was not built for a long, heroic charge. Its gallop soon dropped into a trot, and the trot gradually became an easy walk. Toad was quite satisfied with that. Whatever the pace, he and the horse were still moving, while the stranded barge was not. Now that he had done something he considered truly clever, all his anger disappeared. He sat comfortably on the horse and let it jog through the sunshine. He guided it along small side roads and narrow bridle paths, putting more and more distance between himself and the canal. Only one uncomfortable thought kept returning. It had been a very long time since he had eaten a full meal, and he was doing his best to forget it.
        - id: ch01-b47
          speaker: narrator
          text: Toad and the horse traveled for several miles. The hot sunshine made him drowsier and drowsier as he rode. At last the horse stopped, lowered its head, and began cropping the grass. The movement woke Toad, and with a sudden effort he just managed to stop himself from tumbling off. He looked around. They were standing on a broad common that stretched away in every direction, dotted with patches of yellow gorse and tangled bramble. Close by stood a shabby gypsy caravan. Beside it, a man sat on an upside-down bucket. He seemed very busy smoking his pipe and staring out at the wide world.
        - id: ch01-b48
          speaker: narrator
          text: A fire of dry sticks burned nearby, and an iron pot hung above it. The pot bubbled and gurgled. A faint, promising cloud of steam rose from it, and with the steam came smells. They were warm smells, rich smells, and many different smells. They curled and twisted around one another until they became one complete and perfect smell. To Toad, it seemed like all the comfort in nature had taken shape and come to care for its hungry children. Only then did he understand that he had not truly been hungry before. What he had felt that morning was only a tiny warning. This was real hunger, and something had to be done about it quickly, before there was trouble for somebody or something. Toad examined the gypsy and wondered whether he could get what he wanted more easily by fighting the man or flattering him. So Toad sat there sniffing the stew and watching the gypsy. The gypsy sat smoking and watching Toad.
        - id: ch01-b49
          speaker: gypsy
          text: Want to sell that horse?
        - id: ch01-b50
          speaker: narrator
          text: "Toad was startled. He did not know how fond gypsies were of horse trading, or how much pulling a traveling caravan required. Selling the horse had never crossed his mind. But now he saw a way to get the two things he needed most: money and a solid breakfast."
        - id: ch01-b51
          speaker: toad
          text: Sell my beautiful young horse? Certainly not! Who would carry my customers' washing home each week? Besides, I love him, and he simply adores me.
        - id: ch01-b52
          speaker: gypsy
          text: Try loving a donkey. Some folks manage it.
        - id: ch01-b53
          speaker: toad
          text: You don't understand. This fine horse is far above your usual sort. He's partly a blood horse. Not the part you're looking at, of course. Another part. He was once a prize Hackney too. That was before you knew him, but anyone who understands horses can see it immediately. No, selling him is impossible. Still, what might you offer for such a beautiful young horse?
        - id: ch01-b54
          speaker: narrator
          text: The gypsy studied the horse, then Toad, then the horse again.
        - id: ch01-b55
          speaker: gypsy
          text: A shilling for each leg.
        - id: ch01-b56
          speaker: narrator
          text: He turned away and went on smoking.
        - id: ch01-b57
          speaker: toad
          text: A shilling a leg? Give me a moment. I must work out exactly how much that makes.
        - id: ch01-b58
          speaker: narrator
          text: Toad climbed down, left the horse grazing, and sat beside the gypsy. He counted on his fingers.
        - id: ch01-b59
          speaker: toad
          text: One shilling for each leg makes exactly four shillings. No more than four! I could never accept that for this beautiful young horse.
        - id: ch01-b60
          speaker: gypsy
          text: Then I'll offer five. That's three shillings and sixpence more than he's worth. Final offer.
        - id: ch01-b61
          speaker: narrator
          text: Toad sat quietly and considered the offer from every side. He was desperately hungry and had no money at all. Home was still some unknown distance away, and his enemies might even now be looking for him. When someone is in that position, five shillings can seem like a very large amount of money. On the other hand, it did not seem like much to receive for a whole horse. Then another thought came to him. He had paid nothing for the horse. Whatever he received would be pure profit. At last, he made up his mind and spoke as firmly as he could.
        - id: ch01-b62
          speaker: toad
          text: Listen. Here is my final offer. You give me six shillings and sixpence, in cash. Along with that, you give me all the breakfast I can eat in one sitting from the iron pot that smells so wonderful. In exchange, you get my spirited young horse, plus all his fine harness and gear. If that isn't good enough, say so and I'll move along. A man nearby has wanted this horse for years.
        - id: ch01-b63
          speaker: narrator
          text: The gypsy grumbled terribly. He declared that if he made a few more bargains like this one, he would be completely ruined. Still, in the end he reached deep into his trouser pocket and dragged out a dirty canvas bag. From it, he counted six shillings and sixpence, coin by coin, into Toad's waiting paw. The money settled the first half of their bargain. For the second half, the gypsy disappeared into his caravan. A moment later he came back carrying a large iron plate, along with a knife, fork, and spoon.
        - id: ch01-b64
          speaker: narrator
          text: The gypsy tilted the heavy pot. A glorious stream of rich, hot stew gurgled down onto the iron plate. It truly seemed to be the finest stew in the world. There were partridges in it, and pheasants, chickens, hares, rabbits, peahens, and guinea fowl, along with one or two other things. Toad set the plate on his lap. The sight and smell of it nearly made him cry. Then he began to eat. He filled himself as fast as he could, asked for another helping, and went right on eating. The gypsy never complained and never refused him more. Toad kept at it until he felt certain that no breakfast in his entire life had ever tasted so good.
        - id: ch01-b65
          speaker: narrator
          text: When he could hold no more, Toad said goodbye to the gypsy and gave the horse an affectionate farewell. The gypsy knew the riverside and told him which way to go. Toad set off in excellent spirits.
        - id: ch01-b66
          speaker: narrator
          text: An hour had changed Toad completely. He walked beneath a bright sun, and even the wet clothes from his fall in the canal had dried. Once again, there was money jingling in his pocket. Each step took him nearer to his home, his friends, and safety. Most important of all, he had eaten a large, hot, nourishing meal. His hunger was gone. He felt bigger than before, stronger than before, and ready to face anything. Caution slipped away from him, and his old self-confidence came marching back.
        - id: ch01-b67
          speaker: narrator
          text: As he marched along, he remembered every danger and escape. Whenever things looked hopeless, he had found a way out. His pride swelled with every step.
        - id: ch01-b68
          speaker: toad
          text: Ho, ho! What a clever Toad I am! No animal in the world can match me. My enemies locked me in prison behind guards and jailers, but courage and pure ability carried me right through them. They chased me with engines, policemen, and revolvers. I laughed, snapped my fingers, and vanished. Then a fat and wicked woman threw me into a canal. What happened? I swam out, took her horse, rode away in triumph, and sold it for a pocketful of money and an excellent breakfast. Ho, ho! I am Toad! Handsome, popular, successful Toad!
        - id: ch01-b69
          speaker: narrator
          text: He became so pleased with himself that he invented a song and sang it at full volume, though no one was there to hear. It may have been the most conceited song any animal ever made.
        - id: ch01-b70
          speaker: toad
          text: The world has known great heroes. The history books say so. But no great name can match the fame of wonderful Mr. Toad!
          emotion: happy
        - id: ch01-b71
          speaker: toad
          text: The clever men at Oxford know everything that's known. But not one knows half as much as brilliant Mr. Toad!
          emotion: happy
        - id: ch01-b72
          speaker: toad
          text: The animals in the Ark all cried, and tears around them flowed. Who cheered them with the news of land? Encouraging Mr. Toad!
          emotion: happy
        - id: ch01-b73
          speaker: toad
          text: The army gave a grand salute while marching down the road. Was that the King? Was that Kitchener? No! It was Mr. Toad!
          emotion: happy
        - id: ch01-b74
          speaker: toad
          text: The Queen and all her ladies sat sewing in a row. She cried, "Who's that handsome man?" They answered, "Mr. Toad!"
          emotion: happy
        - id: ch01-b75
          speaker: narrator
          text: Toad made up a great many more verses in the same style. They were so terribly conceited that no one could possibly write them all down. The verses already heard were among the mildest. He sang as he walked and walked as he sang. With every new line, he seemed to swell a little more with pride. He was certain that the world must admire him as much as he admired himself. But very soon, that towering pride was going to come down with a hard crash.
        - id: ch01-b76
          speaker: narrator
          text: After miles of country lanes, he came to the main road. Far down its white length, a tiny speck grew into a dot, then a shape he knew. A familiar double warning note sounded in his delighted ears.
        - id: ch01-b77
          speaker: toad
          text: Now this is more like it! Real life again! The great world has missed me for far too long. I'll call to my fellow drivers and tell them the sort of tale that has worked so well today. Naturally, they'll give me a ride. With luck, I may arrive at Toad Hall in a motorcar. Just imagine Badger's face!
          emotion: happy
        - id: ch01-b78
          speaker: narrator
          text: Toad stepped confidently into the middle of the road and prepared to signal the car. It came toward him at an easy pace and began to slow as it reached the lane. He expected another triumph. Then, in one instant, all the color left his face. His heart seemed to turn to water. His knees shook so violently that they could no longer hold him. A sickening pain twisted inside him, and he doubled over and collapsed in the road.
        - id: ch01-b79
          speaker: narrator
          text: Toad had every reason to be terrified. This was not merely a car like the one he remembered. It was the very same motorcar he had stolen from the yard of the Red Lion Hotel on that fatal day when all his troubles began. And the people riding in it were the very same people he had watched eating lunch in the hotel's coffee room before he took it.
        - id: ch01-b80
          speaker: toad
          text: It's finished. Everything is over! Chains and police again. Prison again. Bread and water again. What a fool I've been! Why did I march around singing about myself and waving people down in broad daylight? I should have hidden until dark and slipped home by the back roads. Poor, unlucky Toad!
          emotion: fearful
        - id: ch01-b81
          speaker: narrator
          text: The dreadful car came closer and stopped just before the shabby heap trembling in the road. Two gentlemen got out and walked around him.
        - id: ch01-b82
          speaker: gentleman_1
          text: Oh dear, how sad. This poor old woman has fainted in the road. Perhaps the heat was too much for her, or maybe she hasn't eaten today. Let's put her in the car and take her to the nearest village. She surely has friends there.
        - id: ch01-b83
          speaker: narrator
          text: The two gentlemen bent down and lifted Toad as gently as they could. They carried him to the motorcar, laid him inside, and propped him securely against the soft cushions. Then everyone climbed back aboard and the journey continued. Toad remained very still while he listened. The gentlemen spoke about the poor washerwoman with such kindness and sympathy that one fact slowly became clear. They had not recognized him at all. No one was reaching for chains, and no one was calling the police. His courage began to creep back. Very cautiously, he opened one eye. When nothing terrible happened, he opened the other.
        - id: ch01-b84
          speaker: gentleman_1
          text: Look, she's already improving. The fresh air must be helping. How are you feeling now, ma'am?
        - id: ch01-b85
          speaker: toad
          text: Much better, thank you kindly, sir.
        - id: ch01-b86
          speaker: gentleman_1
          text: Good. Lie still now, and above all, don't try to talk.
        - id: ch01-b87
          speaker: toad
          text: I won't. I only wondered if I might sit in front beside the driver. With the fresh air blowing straight into my face, I'd soon be perfectly well.
        - id: ch01-b88
          speaker: gentleman_2
          text: What a sensible woman! Of course you may.
        - id: ch01-b89
          speaker: narrator
          text: They carefully helped Toad into the front seat beside the driver, and the car rolled on.
        - id: ch01-b90
          speaker: narrator
          text: By now Toad felt almost like himself again. He sat upright and looked around. He tried to force down the last of his fear. But another feeling had already begun to rise inside him. The old longing returned, followed by the old irresistible craving. He fought it, yet the sound and movement of the motorcar surrounded him. Little by little, the desire took possession of him completely.
        - id: ch01-b91
          speaker: toad
          text: It is fate. Why fight it?
        - id: ch01-b92
          speaker: narrator
          text: He turned to the driver.
        - id: ch01-b93
          speaker: toad
          text: Please, sir, would you let me drive for a little while? I've watched you closely. It looks easy and so interesting. I'd love to tell my friends that I once drove a motorcar.
        - id: ch01-b94
          speaker: narrator
          text: The driver laughed so loudly that a gentleman asked what was funny. When he heard Toad's request, he was delighted.
        - id: ch01-b95
          speaker: gentleman_2
          text: Bravo, ma'am! I admire your spirit. Let her try, and keep an eye on her. She can't do any harm.
          emotion: happy
        - id: ch01-b96
          speaker: narrator
          text: Toad scrambled eagerly into the seat the driver had just left. He wrapped his paws around the steering wheel and listened to the man's instructions with a show of deep humility. Then Toad set the car moving. At first, he drove very slowly. He watched the road and handled the wheel with great care because, for those first few moments, he was honestly determined to behave sensibly.
        - id: ch01-b97
          speakers: [gentleman_1, gentleman_2]
          ensemble: duo
          text: Look how well she's doing! A washerwoman driving perfectly on her very first try!
          emotion: surprised
        - id: ch01-b98
          speaker: narrator
          text: Toad drove faster. Then faster still. Then faster again.
        - id: ch01-b99
          speakers: [gentleman_1, gentleman_2]
          ensemble: duo
          text: Careful, washerwoman!
          emotion: fearful
        - id: ch01-b100
          speaker: narrator
          text: Being called a washerwoman annoyed Toad. His careful intentions disappeared, and he began to lose his head. The driver reached over and tried to interfere, but Toad drove one elbow into him and held him down against the seat. With his other paw still on the controls, he opened the motor to full speed. Air rushed against his face. The engine's hum filled his ears, and the car gave a light, thrilling leap beneath him. Those familiar sensations were too much for Toad's weak brain. They made him wild with excitement.
        - id: ch01-b101
          speaker: toad
          text: Washerwoman, indeed! Ho, ho! I am Toad, the motorcar snatcher and prison breaker. Toad always escapes! Sit still and learn what real driving is. You are in the hands of the famous, skillful, completely fearless Toad!
          emotion: happy
        - id: ch01-b102
          speaker: narrator
          text: The whole party rose with a cry of horror and threw themselves at him.
        - id: ch01-b103
          speakers: [gentleman_1, gentleman_2, driver]
          ensemble: chorus
          text: Grab him! It's Toad, the wicked creature who stole our car! Tie him up! Chain him! Take him to the nearest police station! Stop that dangerous Toad!
          emotion: angry
        - id: ch01-b104
          speaker: narrator
          text: Sadly for them, they had chosen the wrong moment to fight him. They should have been more careful. Most of all, they should have remembered to stop the motorcar before leaping at the driver. Toad only needed half a turn of the steering wheel. The car shot away from the road and crashed straight through the low hedge beside it. There was one enormous bound, followed by a violent shock. Then the wheels were spinning uselessly and churning the thick mud at the bottom of a horse pond.
        - id: ch01-b105
          speaker: narrator
          text: The tremendous upward force threw Toad clear of the car. He went sailing through the air in the strong, graceful curve of a swallow. To his own surprise, he enjoyed the motion. For a moment, he forgot the angry people behind him and wondered how long the flight might last. Perhaps, if he stayed in the air long enough, wings would grow from his sides and he would turn into a new kind of creature, half Toad and half bird. He had only just begun to consider this delightful possibility when the flight ended. He landed on his back with a heavy thump, right in the soft, rich grass of a meadow.
        - id: ch01-b106
          speaker: narrator
          text: Sitting up, he saw the car nearly underwater in the pond. The gentlemen and driver were weighed down by their long coats and floundering helplessly in the water.
        - id: ch01-b107
          speaker: narrator
          text: Toad wasted no time. He picked himself up and ran across the countryside as hard as he could. He forced his way through one hedge after another, jumped across ditches, and pounded over open fields. At last he was breathless and exhausted, and he had to slow down to an easy walk. After a while, his breathing settled and he was able to think clearly. The memory of the car in the pond made him giggle. The giggle grew into laughter. He laughed harder and harder until his legs would carry him no farther and he had to sit down beneath a hedge.
        - id: ch01-b108
          speaker: toad
          text: Ho, ho! Toad wins again! Who persuaded them to give him a ride? Who reached the front seat by asking for fresh air? Who talked them into letting him drive? Who dropped every one of them into a horse pond? And who sailed safely through the air while those narrow-minded, stingy, timid travelers landed in the mud where they belong? Toad, of course! Clever Toad! Great Toad! Good Toad!
          emotion: happy
        - id: ch01-b109
          speaker: narrator
          text: Then he burst into song once more, lifting his voice as high as it would go.
        - id: ch01-b110
          speaker: toad
          text: The motorcar went poop-poop-poop as it hurried down the road. Who steered it straight into a pond? Ingenious Mr. Toad! Oh, how clever I am! How clever, how clever, how very clev—
          emotion: happy
        - id: ch01-b111
          speaker: narrator
          text: A faint sound behind him made him turn. Horror. Misery. Despair. Two fields away, the driver in his leather gaiters and two large country policemen were running straight toward him.
        - id: ch01-b112
          speaker: narrator
          text: Poor Toad sprang up and raced away with his heart in his mouth.
        - id: ch01-b113
          speaker: toad
          text: Oh my! What an idiot I am! A conceited, careless idiot! Bragging again! Shouting and singing again! Sitting around and talking again! Oh my, oh my, oh my!
          emotion: fearful
        - id: ch01-b114
          speaker: narrator
          text: Toad looked back and saw, to his dismay, that the three men were gaining on him. He drove his legs as hard as he could, yet every time he glanced over his shoulder they had come closer. Toad was a fat animal, and his legs were short. His best effort could not match theirs. Soon he heard the pounding of their feet close behind him. Fear made him forget everything except the chase. He stopped paying attention to the ground ahead. With his head turned toward the enemy, who now seemed certain of victory, he struggled blindly and wildly onward.
        - id: ch01-b115
          speaker: narrator
          text: Suddenly the ground vanished beneath his feet. He grabbed at the air and plunged headfirst into deep, fast water. The current seized him with more force than he could fight. In his panic, he had run straight into the river.
        - id: ch01-b116
          speaker: narrator
          text: Toad struggled back to the surface and tried to save himself. Reeds and rushes grew close beneath the riverbank, and he stretched both paws toward them. For an instant he caught hold, but the water was running too fast and pulling too hard. The stems slipped through his grasp, one after another, and the powerful current carried him onward.
        - id: ch01-b117
          speaker: toad
          text: Oh my! If I ever steal another motorcar! If I ever sing another conceited song—
          emotion: fearful
        - id: ch01-b118
          speaker: narrator
          text: Before he could finish his promise, the water pulled him under again. He rose a moment later, breathless, coughing, and spluttering. Then he noticed a large dark hole in the riverbank ahead of him, only a little higher than his head. The current swept him closer and began to carry him past. Toad made one desperate reach upward. His paw caught the lower edge of the opening, and somehow he held on while the river tugged at the rest of him. Slowly and with great difficulty, he began to pull himself out of the water. At last he raised himself high enough to rest both elbows on the edge of the hole. There he remained for several minutes. He could do nothing but puff, pant, and recover from his complete exhaustion.
        - id: ch01-b119
          speaker: narrator
          text: Toad sighed and stared into the darkness. Something small and bright gleamed inside and moved toward him. As it came closer, a familiar face appeared around the light. Brown and small, with whiskers. Grave and round, with neat ears and silky hair.
        - id: ch01-b120
          speaker: narrator
          text: It was the Water Rat!
