audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 温暖从容，带着含蓄的幽默
        timbre: 清澈醇厚
        pace: 舒缓而富于变化
        pitch: 中低
    toad:
      display_name: 蟾蜍
      tts:
        delivery: 自信外放，兴奋时滔滔不绝
        timbre: 饱满洪亮
        pace: 明快多变
        pitch: 中低
    barge_woman:
      display_name: 船娘
      tts:
        delivery: 爽直泼辣，取笑人时毫不客气
        timbre: 粗亮结实
        pace: 明快
        pitch: 中低
    gypsy:
      display_name: 吉卜赛人
      tts:
        delivery: 懒洋洋又精明，讨价还价时不动声色
        timbre: 沙哑低沉
        pace: 缓慢
        pitch: 低
    gentleman_1:
      display_name: 第一位绅士
      tts:
        delivery: 热心体面，语气温和而笃定
        timbre: 清晰稳重
        pace: 中等
        pitch: 中
    gentleman_2:
      display_name: 第二位绅士
      tts:
        delivery: 友善随和，遇事容易惊慌
        timbre: 明亮厚实
        pace: 中等偏快
        pitch: 中
    driver:
      display_name: 司机
      tts:
        delivery: 熟练爽朗，危急时急促严厉
        timbre: 结实清楚
        pace: 中等偏快
        pitch: 中低
  chapters:
    - id: ch01
      title: 运河上的洗衣妇
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 空心树的洞口朝东。天刚亮，明亮的阳光就直照到蟾蜍身上，他也给两只冷得过分的脚冻醒了。那股寒意还送给他一场怪梦。他梦见自己睡在蛤蟆庄园那间漂亮卧室里，房间有一扇都铎式窗户。外面正是严冬深夜，床上的被褥忽然站起身，一边抱怨，一边嚷着再也受不了寒冷。它们统统跑到楼下厨房，挤在炉火边取暖。蟾蜍只得光着脚，在冰冷的石板长廊里追了几英里，不断同它们讲道理，又苦苦哀求它们回去。过去几星期里，他一直睡在石板地的稻草上，差点忘了厚被子一直拉到下巴底下，有多么亲切舒服。不然，这天早晨，他还会醒得更早。
        - id: ch01-b02
          speaker: narrator
          text: 蟾蜍坐起来，先揉眼睛，又揉着不停叫苦的脚趾。一时之间，他还弄不清自己身在何处，目光四处寻找熟悉的监狱石墙，还有那扇装着铁栏的小窗。接着，他的心猛地一跳，所有事情全想起来了。先是越狱，再是逃亡，最后是一路追捕。最妙也最要紧的是，他已经自由了！单单这两个字，单单这个念头，就抵得上五十床被子。他想到外面的快活世界正在等自己堂堂登场，准备像灾祸降临以前那样服侍他、配合他、帮助他，也陪伴他，顿时浑身暖和起来。他抖抖身子，再用手指梳掉头发里的枯叶，这就算梳洗完毕，昂首走进舒畅的晨光。休息、睡眠和坦荡明亮的阳光赶走了昨天的恐惧。他虽然冷，却信心十足，虽然饿，却满怀希望。
        - id: ch01-b03
          speaker: narrator
          text: 初夏的清晨安静得仿佛只属于他。树林挂着露水，他穿过树木时，四周没有半个身影，也听不见一丝响动。外面的绿野任他来去，连空荡荡的大路也像走失的狗，急着找个伴。可蟾蜍只想找个会说话的家伙，明明白白问出回家的方向。若是心情轻快、问心无愧、口袋有钱，也没有人四处搜捕，要把你重新拖回监狱，当然可以随道路爱往哪儿走就往哪儿走。可讲求实际的蟾蜍十分在乎方向。分分秒秒对他都很要紧，大路偏偏一声不吭，气得他真想踹上一脚。
        - id: ch01-b04
          speaker: narrator
          text: 不久，一条小运河来到路旁，好像腼腆的弟弟牵住哥哥的手，却同样不肯向陌生人开口。
        - id: ch01-b05
          speaker: toad
          text: 真讨厌！不过，它们总得从某个地方来，也总要到某个地方去。这一点谁也驳不倒。蟾蜍啊，我的好小子，耐心往前走吧！
        - id: ch01-b06
          speaker: narrator
          text: 运河拐弯处走来一匹孤零零的马。它低着头，弓着背，仿佛正为心事发愁。马颈上的长索绷直在身后，又随着脚步一上一下。绳子远端刚从水里出来，不断落下珍珠似的水珠。蟾蜍放它过去，停在原处等着，看命运还会送来什么。一艘驳船随即滑到身旁，钝船头搅动平静的水面，发出悦耳的回旋声。漆得鲜艳的船舷正与纤道齐平。船上只有一个高大粗壮的女人，头戴亚麻遮阳帽，一条结实的胳膊搭在舵柄上。
        - id: ch01-b07
          speaker: barge_woman
          text: 天气真不错啊，大嫂！
        - id: ch01-b08
          speaker: toad
          text: 对不像我这样身陷苦难的人，想必是好天气吧，大嫂！我那出嫁的女儿捎来急信，叫我马上赶到她身边。于是我立刻动身，根本不知道已经出了什么事，接下来还会出什么事，只怕结果凶多吉少。你要是也做母亲，一定懂我的心。我把洗衣熨衣的生意丢在那里，任它自己照管自己，又把一群淘气惹祸的小孩子全扔在家里，让他们自己照料自己。天底下再找不出比他们更难管的小魔头了！如今我钱也丢了，路也迷了。我那出嫁的女儿眼下会遇到什么事，我连想都不敢想！
        - id: ch01-b09
          speaker: barge_woman
          text: 你女儿住在哪儿呀，大嫂？
        - id: ch01-b10
          speaker: toad
          text: 她住在河边，就在一幢叫蛤蟆庄园的漂亮宅子附近。那地方应该就在这一带，也许你听说过。
        - id: ch01-b11
          speaker: barge_woman
          text: 蛤蟆庄园？我正往那里去呢！这条运河再走几英里，就在庄园上游汇入大河。你上船吧，我捎你一程。
        - id: ch01-b12
          speaker: narrator
          text: 船娘把驳船贴近河岸。蟾蜍说了无数句谦卑又感激的话，轻快地踏上船板，舒舒服服坐下来。刚才那副忧心母亲的模样一下就不见了，他在心里得意地庆贺起自己的好运。
        - id: ch01-b13
          speaker: toad
          text: 好运又回到蟾蜍身边了！我每次都能反败为胜！
        - id: ch01-b14
          speaker: barge_woman
          text: 原来你做洗衣生意。要是这么问不算冒昧，你的生意一定很好吧？
        - id: ch01-b15
          speaker: toad
          text: 全国再没有更好的生意啦！所有体面人家只肯找我。我样样精通，凡事又亲自照看。洗衣、熨衣、上浆，还有老爷们晚宴穿的精细衬衫，一切都逃不过我的眼睛！
        - id: ch01-b16
          speaker: barge_woman
          text: 这么多活儿，总不会全由你亲手做吧？
        - id: ch01-b17
          speaker: toad
          text: 我手下有二十来个姑娘，整天干活。不过你也知道姑娘们是什么德行，一群讨厌的小浪蹄子！
        - id: ch01-b18
          speaker: barge_woman
          text: 可不是嘛！不过你一定能把那群懒骨头收拾服帖。你自己真的很喜欢洗衣服吗？
        - id: ch01-b19
          speaker: toad
          text: 我爱极了！两条胳膊泡在洗衣盆里，是我最高兴的时候。再说，这活儿对我太容易了，半点不费劲，真是一种享受！
        - id: ch01-b20
          speaker: barge_woman
          text: 碰上你可真走运！对咱们两个都是天大的好事。
        - id: ch01-b21
          speaker: toad
          text: 你这话是什么意思？
        - id: ch01-b22
          speaker: barge_woman
          text: 我和你一样，也喜欢洗衣服。不过喜欢也好，不喜欢也好，我整天驾船四处跑，自己的衣裳总得自己洗。我丈夫最会偷懒，总把整条驳船扔给我照管，弄得我连一刻也抽不出来料理自己的事。照理说，他眼下就该待在船上，要么替我掌舵，要么照看那匹马。好在马很懂事，能照顾自己。他倒带着狗跑去打兔子了，还说会在下一道船闸追上来。到底来不来，只能走着瞧。只要他跟那条比他更糟的狗混到一起，我就半点也不信他。可在他回来以前，我哪有空洗衣服呢？
        - id: ch01-b23
          speaker: toad
          text: 先别管衣服啦，想想那只兔子吧！准是又肥又嫩。你有洋葱吗？
        - id: ch01-b24
          speaker: barge_woman
          text: 除了衣服，我什么也想不了。船舱角落有几件最该洗的东西，你一眼就认得出来。洗衣盆、肥皂和水壶都在，水桶可以从运河打水。你就挑一两件洗洗吧。这样既帮了我，我也知道你在享受，不会只顾看风景，把脑袋都打哈欠打掉。
        - id: ch01-b25
          speaker: toad
          text: 还是让我掌舵吧！你可以照自己的办法洗。我平常只洗老爷们的衣服，那才是专长，万一把你的东西洗坏了怎么办？
        - id: ch01-b26
          speaker: barge_woman
          text: 让你掌舵？那可得练上一阵。再说掌舵多闷呀！你就洗最爱的衣服，我来做熟悉的事。难得我请你享受一回，你可别扫我的兴！
        - id: ch01-b27
          speaker: narrator
          text: 蟾蜍给逼进了死角。他左看右看，想找个地方逃走，可船离岸太远，根本没法纵身跳过去。他只好闷闷不乐地认命，心想既然到了这一步，洗几件衣服，随便哪个傻瓜都会。他从船舱拿来洗衣盆、肥皂和其余用具，胡乱挑了几件衣裳，再努力回想自己偶尔从洗衣店窗外瞥见的样子，终于动起手来。漫长的半个钟头过去，他一分钟比一分钟火大。无论哄、拍还是捶，那些衣服仍躺在盆里冲他微笑，半点不肯悔改，快活地守着天生的污迹。他不安地回头偷看过一两次，船娘仿佛只顾望着前面，一心掌舵。他却腰酸背疼，还惊恐地发现漂亮爪子已经泡出了皱。他低声骂着洗衣妇和蟾蜍都不该说的话，又第五十次弄丢肥皂。忽然，一阵大笑叫他直起身来。船娘笑得向后仰倒，眼泪直流。
        - id: ch01-b28
          speaker: barge_woman
          text: 我一直看着你呢！听你说话那么神气，我早就猜到你是骗子。好一个了不起的洗衣妇！我敢说，你连一块洗碗布都没洗过！
        - id: ch01-b29
          speaker: narrator
          text: 蟾蜍的怒火早已在心里恶狠狠地煨了半天，这一刻终于彻底烧开。他再也控制不住自己。
        - id: ch01-b30
          speaker: toad
          text: 你这个粗俗、下贱、肥胖的船娘！不许这样同高贵的人讲话！我根本不是什么洗衣妇。我是大名鼎鼎、受人敬重、身份显赫的蟾蜍！眼下也许暂时倒霉，可我绝不能让一个船娘取笑！
          emotion: angry
        - id: ch01-b31
          speaker: narrator
          text: 船娘凑近，仔细朝他的帽子底下打量。
        - id: ch01-b32
          speaker: barge_woman
          text: 还真是！一只可怕、恶心、爬来爬去的蟾蜍，竟敢上我这条干净漂亮的船！这个我绝不能忍！
          emotion: disgusted
        - id: ch01-b33
          speaker: narrator
          text: 船娘暂时松开舵柄。一条粗壮又带着斑点的胳膊猛伸过来，抓住蟾蜍的前腿，另一只手牢牢扣住他的后腿。刹那间，世界上下颠倒，驳船好像轻飘飘地从天空飞过，风在蟾蜍耳边呼啸。他自己则在半空飞旋，越转越快，最后扑通一声落进冰冷的河里。河水冷得完全不合他的心意，却没能压住他的傲气，也浇不熄暴怒。他一边呛水，一边浮出水面，抹掉蒙住眼睛的浮萍。第一眼看见的，还是那个胖船娘。她从正在远去的船尾回过头来，笑个不停。蟾蜍又咳又呛，当场发誓一定要找她算账。
        - id: ch01-b34
          speaker: narrator
          text: 蟾蜍奋力游向岸边，可身上的棉布长裙缠来绕去，处处妨碍他的动作。好不容易碰到陆地，陡峭的河岸又叫他无法独自爬上去。他费了很大力气才回到纤道，只好先歇上一两分钟，让呼吸恢复平稳。随后，他把湿淋淋的裙摆高高抱在两条胳膊上，拔腿追赶驳船。他满腔愤慨，一心渴望报仇，两条腿能跑多快就跑多快。等他终于追到与船并行，船娘还在放声大笑。
        - id: ch01-b35
          speaker: barge_woman
          text: 洗衣妇，把自己塞进轧水机吧！再熨熨脸，压出几道褶子，你就能冒充一只模样过得去的蟾蜍啦！
        - id: ch01-b36
          speaker: narrator
          text: 蟾蜍连脚步也没停，更不肯用廉价空洞的回嘴来逞一时痛快。尽管他脑子里确实有一两句很想骂出来的话，可他要的是实实在在的报复。前面恰好出现了他需要的东西。他冲上去追过那匹马，解开曳船索扔到一旁，轻巧地翻上马背，再猛踢马肚子，催它飞奔。他离开纤道，直奔开阔的乡野，接着又调转马头，冲进一条车辙累累的窄巷。回头一看，驳船已经在运河对岸搁浅，船娘正疯狂挥手，拼命喊他停下。
        - id: ch01-b37
          speaker: barge_woman
          text: 停下！快停下！停下！
          emotion: angry
        - id: ch01-b38
          speaker: toad
          text: 这支曲子，我从前听过！
          emotion: happy
        - id: ch01-b39
          speaker: narrator
          text: 拉船的马没什么长劲，很快从飞奔变成小跑，又从小跑变成悠闲的慢步。蟾蜍却很满意。无论如何，自己还在往前走，那艘驳船却已经动弹不得。做成这件自以为非常聪明的事以后，他的脾气彻底平复了。他安安稳稳坐在马背上晒太阳，沿偏僻小路和马道慢慢前行，又竭力不去想自己究竟有多久没吃过一顿饱饭。等他终于敢回头时，运河早已远远落在身后。
    - id: ch02
      title: 一匹马与一顿早餐
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 蟾蜍和马已经走了几英里。热烘烘的阳光晒得他昏昏欲睡，马忽然停下脚步，低头吃草。他猛然惊醒，好不容易才没从马背上掉下来。四周是一片宽阔公地，目力所及之处，到处散布着金雀花和荆棘。附近停着一辆灰暗破旧的吉卜赛篷车，一个男人倒坐在水桶上。他专心抽着烟，也专心凝望辽阔的天地。近旁的枝柴烧成一堆火，火上吊着一口铁锅。锅里咕嘟咕嘟地翻滚，不断冒出朦胧却很有暗示意味的热气，还有温暖、浓郁、层次丰富的香味。那些香气彼此盘旋缠绕，最后汇成完整又无比美妙的一股，像大自然的灵魂有了形体，化成一位安抚众生的母亲，亲自来到孩子们面前。
        - id: ch02-b02
          speaker: narrator
          text: 蟾蜍这才明白，早晨那点感觉根本不叫饿，眼下才是真正的饥饿，而且非得立刻解决不可。他打量着吉卜赛人，盘算动手容易，还是哄骗容易。于是他坐着不停闻香，也不停看人。吉卜赛人同样坐着抽烟，看着他。
        - id: ch02-b03
          speaker: gypsy
          text: 你那匹马卖不卖？
        - id: ch02-b04
          speaker: narrator
          text: 蟾蜍完全没想到这一层。他不知道吉卜赛人最爱买马卖马，碰见机会从来不会错过。他也没想过篷车一直迁移，要拉动这样一个大家伙，很需要一匹牲口。直到吉卜赛人开口以前，他压根没动过把马变成现钱的念头。可这个提议一出现，眼前的道路仿佛立刻铺平了，正好通向他最想要的两样东西，一把现钱，还有一顿扎扎实实的早餐。
        - id: ch02-b05
          speaker: toad
          text: 什么？要我卖这匹年轻漂亮的爱马？绝对不行！往后谁每星期替我送洗好的衣服？我又这么喜欢他，他也爱我爱得不得了。
        - id: ch02-b06
          speaker: gypsy
          text: 那就试着爱一头驴。有人做得到。
        - id: ch02-b07
          speaker: toad
          text: 你没看明白，我这匹好马比你高贵得多。他有一部分是血统名马，当然不是你眼前看见的这一部分，是另一部分。他以前还得过轻驾马大奖。只要懂马，一眼就看得出。卖掉他根本不该考虑。不过，你愿意出多少钱呢？
        - id: ch02-b08
          speaker: narrator
          text: 吉卜赛人先看看马，再仔细看看蟾蜍，最后又看看马。
        - id: ch02-b09
          speaker: gypsy
          text: 每条腿一先令。
        - id: ch02-b10
          speaker: toad
          text: 每条腿一先令？劳驾，容我算算总共是多少。
        - id: ch02-b11
          speaker: narrator
          text: 他下了马，坐到吉卜赛人身边，掰着指头算了半天。
        - id: ch02-b12
          speaker: toad
          text: 不多不少，正好四先令。为了四先令，我可不能卖掉这匹年轻漂亮的马。
        - id: ch02-b13
          speaker: gypsy
          text: 那我就出五先令。这已经比它的身价多了三先令六便士，是最后一口价。
        - id: ch02-b14
          speaker: narrator
          text: 蟾蜍坐下来，认真而长久地思量。他又饿又没钱，不知道离家还有多远，敌人也许仍在附近搜捕他。一个人若是落到这种处境，五先令很容易显得是一大笔钱。可另一方面，用这点钱买下一整匹马，好像又实在太少。他反复琢磨，忽然又想到，这匹马原本没有花过自己一分钱。既然本钱是零，无论最后收进多少，岂不全是清清白白的利润？
        - id: ch02-b15
          speaker: toad
          text: 听着，这也是我的最后一口价。你当场给我六先令六便士，再让我把铁锅里那些香喷喷的东西尽量吃个饱。当然，只吃这一顿。作为交换，我把这匹精神的年轻爱马交给你，连漂亮挽具和饰物都白送。你不答应，我马上就走。附近有个人想买它好几年了。
        - id: ch02-b16
          speaker: narrator
          text: 吉卜赛人可怕地抱怨起来，说自己再做几笔这样的买卖，非得破产不可。可到头来，他还是把手伸进裤兜深处，拽出一只肮脏的帆布袋，把六先令六便士一个个数进蟾蜍的爪子。随后，他钻进篷车片刻，带回一只大铁盘，还有刀、叉和匙。他把锅微微倾斜，浓厚滚烫的炖菜便咕嘟着流进盘里，盛了满满一大份。锅里有鹧鸪、雉鸡、家鸡、野兔、家兔、孔雀雌鸟、珍珠鸡，还有另外一两样东西。这的确是世上最美味的炖菜。蟾蜍把盘子放在腿上，感动得几乎要哭。他只顾大吃、猛吃、拼命吃，还不停要求添菜，吉卜赛人一次也没舍不得。这辈子，他从没吃过这么好的早餐。
        - id: ch02-b17
          speaker: narrator
          text: 等蟾蜍把能装进肚子的炖菜全都装了进去，他才站起身向吉卜赛人告别，又依依不舍地辞别那匹马。吉卜赛人熟悉河边的道路，给他仔细指明方向。蟾蜍重新踏上旅程，心情好得不能再好，已经和一个钟头前判若两蟾蜍。太阳明亮地照着，刚才还湿淋淋的衣服全都干了，口袋里重新装着钱。他离家、朋友和安全之地越来越近。最妙的是，那顿丰盛、热乎又滋养的饭叫他觉得自己身躯高大，力气充沛，什么都不在乎，对自己更是信心十足。
        - id: ch02-b18
          speaker: narrator
          text: 他边走边回想一路的冒险。每次情势糟到极点，他总能找到出路，胸中的骄傲也越胀越大。
        - id: ch02-b19
          speaker: toad
          text: 哈，哈！我这只蟾蜍多么聪明！全世界再没有第二只动物，才智能和我相比。敌人把我关进监狱，四面布满岗哨，狱卒日夜看守，我却只凭过人的才智，再加上非凡勇气，就从所有人眼前堂堂走了出来。他们动用火车、警察和左轮手枪追我，我不过朝他们打个响指，便大笑着消失得无影无踪。后来，一个身材肥胖、心肠歹毒的女人把我扔进运河，那又算得了什么？我游上岸，夺走她的马，骑着它胜利离开，最后还把马换成满满一口袋钱，以及一顿上好的早餐！哈，哈！我就是蟾蜍，英俊的蟾蜍，受人爱戴的蟾蜍，永远成功的蟾蜍！
        - id: ch02-b20
          speaker: narrator
          text: 他自负得整只动物都膨胀起来，边走边编了一首歌颂自己的歌，放开喉咙唱给自己听。这大概是动物写过的最自负的一首歌。
        - id: ch02-b21
          speaker: toad
          text: 古往今来大英雄，史书卷卷有记载。若论英名传千古，谁能与蟾蜍并排！牛津才子多聪明，天下学问尽明白。可他们合在一起，不及蟾蜍一半才！
        - id: ch02-b22
          speaker: toad
          text: 方舟动物放声哭，泪水滚滚汇成海。是谁高喊“陆地在前”？给人鼓劲是蟾蜍在！大军开过长路上，全体立正把礼抬。是国王？还是基钦纳？不，是蟾蜍走过来！
        - id: ch02-b23
          speaker: toad
          text: 女王侍女坐窗前，飞针走线巧剪裁。女王惊呼“那英俊郎君是谁？”众人齐答“蟾蜍大人才！”
        - id: ch02-b24
          speaker: narrator
          text: 后面还有许多同样的歌词，只是自负得太吓人，根本不便录下。刚才听到的这些，已经算其中最收敛的几段。蟾蜍唱着歌往前走，又走着路继续唱，每过一分钟就更膨胀一些。他完全不知道，自己的骄傲很快就要狠狠摔上一跤。
    - id: ch03
      title: 旧汽车又回来了
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 沿乡间小路又走了几英里，蟾蜍终于来到一条大路。他拐上去，顺着白茫茫的长路望去。远处先是出现一个微小的斑点，斑点变成圆点，圆点又变成一团有形状的东西，最后显出一样他再熟悉不过的物件。就在这时，两声警告号传进他满怀喜悦的耳朵。那声音他熟得不能再熟，一听就认得出来。
        - id: ch03-b02
          speaker: toad
          text: 这才像话！我又回到真正的生活，回到失去我太久的广阔世界了！我要招呼这群车轮上的兄弟，再编个以前那样管用的故事。他们当然会捎我一程。运气好的话，我还能坐着汽车开回蛤蟆庄园，让獾大吃一惊！
          emotion: happy
        - id: ch03-b03
          speaker: narrator
          text: 他信心满满地走到路中间，准备拦下那辆汽车。车子原本开得不快，靠近小路路口时又放慢了一些。就在这时，蟾蜍的脸突然白了，心仿佛化成一摊水。两只膝盖不住发抖，接着软了下去。他捂着肚子蜷起身来，内里泛起一阵叫人恶心的剧痛。这只可怜的动物当然有理由害怕。他终于认出来了！迎面而来的，正是他从红狮饭店院子偷走的那辆汽车，也是所有灾祸的开端。车里坐的，还是那个倒霉日子里，他隔着咖啡室看他们吃午餐的那几个人。
        - id: ch03-b04
          speaker: narrator
          text: 蟾蜍瘫在路上，成了一堆皱巴巴、瑟瑟发抖的可怜东西。
        - id: ch03-b05
          speaker: toad
          text: 完了！这下全完了！又要戴镣铐、见警察、坐监牢，又要吃干面包、喝白水！我怎么这么蠢？为什么大白天在乡间神气乱逛，唱自负的歌，还站在大路上招呼别人？我为什么不藏到天黑，再从小路悄悄回家？不幸的蟾蜍，命苦的动物！
          emotion: fearful
        - id: ch03-b06
          speaker: narrator
          text: 汽车慢慢开近，在他身前停下。两位绅士下了车，围着这团悲惨东西看了一圈。
        - id: ch03-b07
          speaker: gentleman_1
          text: 哎呀，真可怜！这个上了年纪的洗衣妇昏倒在路上，也许是热晕了，也许今天还没吃东西。咱们把她抬上车，送到最近的村子吧。她在那里一定有亲友。
        - id: ch03-b08
          speaker: narrator
          text: 两位绅士温柔地抬起蟾蜍，把他放进汽车，又拿柔软的垫子垫好，让他舒舒服服地靠着。车子重新开动，继续赶路。蟾蜍一直留心听着他们说话。听见这些声音如此友善，满是同情，又确定没有一个人认出自己，他的胆量才一点点回到身上。他仍旧十分谨慎，先悄悄睁开一只眼睛，看看四周，再慢慢睁开另一只。
        - id: ch03-b09
          speaker: gentleman_1
          text: 看，她已经好多了！新鲜空气对她很有好处。大嫂，你现在觉得怎么样？
        - id: ch03-b10
          speaker: toad
          text: 多谢您，先生，我已经好多了！
        - id: ch03-b11
          speaker: gentleman_1
          text: 那就好。安静躺着，最要紧的是别说话。
        - id: ch03-b12
          speaker: toad
          text: 我不说。我只是在想，要是坐到前面司机旁边，让新鲜空气全吹到脸上，很快就会彻底好起来。
        - id: ch03-b13
          speaker: gentleman_1
          text: 多么通情达理的女人！当然可以。
        - id: ch03-b14
          speaker: narrator
          text: 两位绅士小心地把蟾蜍扶到前排，让他坐在司机身边。汽车重新开动，继续向前。这时，蟾蜍已经几乎完全恢复。他坐直身子，四下张望，又竭力压住体内一阵阵的颤动和渴望。可那股熟悉的旧日欲念还是不断涌上来，从四面八方围攻他，最后把他彻底占据。他抵抗了一阵，终于决定不再抵抗。
        - id: ch03-b15
          speaker: toad
          text: 这是命运！何必反抗？何必挣扎？先生，能不能让我试着开一小会儿？我一直仔细看着，觉得又容易又有意思。我也想回去告诉朋友，自己曾经开过汽车！
        - id: ch03-b16
          speaker: narrator
          text: 司机听得放声大笑，后面的绅士便问出了什么事。听完司机解释，他却很欣赏这个主意。
        - id: ch03-b17
          speaker: gentleman_1
          text: 好样的，大嫂！我就喜欢你这股劲。让她试试吧，你在旁边照看着。她闯不了祸。
        - id: ch03-b18
          speaker: narrator
          text: 司机让出自己的位子，蟾蜍急不可耐地爬过去坐好，双手握住方向盘。他装出十分谦卑的样子，把司机的每句指点都听完，这才让汽车动起来。起先，他开得又慢又小心，因为他真心决定，这一回无论如何都要谨慎。后面的绅士高兴极了，立刻拍起手来，为他大声喝彩。
        - id: ch03-b19
          speakers: [gentleman_1, gentleman_2]
          ensemble: duo
          text: 开得真不错！一个洗衣妇头一次开汽车，也能开得这么好！
        - id: ch03-b20
          speaker: narrator
          text: 蟾蜍加快了一点，又快了一点，接着还要更快。
        - id: ch03-b21
          speakers: [gentleman_1, gentleman_2]
          ensemble: duo
          text: 小心，洗衣妇！
          emotion: fearful
        - id: ch03-b22
          speaker: narrator
          text: 这声“洗衣妇”惹恼了他。司机想要干预，他却用胳膊肘把司机压在座位上，开足马力。狂风扑面，引擎嗡鸣，车身在脚下轻盈跳动，他那颗软弱的脑袋彻底醉了。
        - id: ch03-b23
          speaker: toad
          text: 还敢叫我洗衣妇！哈，哈！我就是抢汽车的蟾蜍，越狱的蟾蜍，永远逃得掉的蟾蜍！全都坐稳了，我来叫你们见识什么才叫驾驶。你们如今落到了大名鼎鼎、技术高超、无所畏惧的蟾蜍手里！
        - id: ch03-b24
          speakers: [gentleman_1, gentleman_2, driver]
          ensemble: chorus
          text: 抓住他！就是这只坏蟾蜍偷了汽车！捆住他，锁住他，把他拖到最近的警察局！打倒这只穷凶极恶、危险万分的蟾蜍！
          emotion: angry
        - id: ch03-b25
          speaker: narrator
          text: 可惜他们忘了，扑上去胡闹以前，应该先想法子把汽车停住。他们本该想到，也本该更加谨慎。蟾蜍只把方向盘转了半圈，车子就轰然冲破路边的低树篱。先是猛地一跃，接着剧烈一震，转眼之间，四个车轮已经在马塘的厚泥里疯狂搅动。那股强劲向上的力量把蟾蜍抛进半空，他划出一道燕子般轻巧的弧线。蟾蜍还挺喜欢这种感觉，甚至开始琢磨，自己会不会一直飞下去，直到身上长出翅膀，变成一只蟾蜍鸟。随后，他砰地一声，仰面落在草地柔软肥厚的青草上。
        - id: ch03-b26
          speaker: narrator
          text: 蟾蜍从柔软肥厚的青草上坐起来，正好看见汽车大半泡在池塘里。几位绅士和司机身上都穿着碍事的长外套，正在水中无可奈何地扑腾，谁也顾不上他。蟾蜍赶紧爬起来，用最快的速度穿过乡野。他钻过一道道树篱，跳过一条条水沟，再重重踏过一片又一片田野。等他跑得气喘吁吁、疲惫不堪，只能改成慢慢走路时，后面早已什么都看不见了。气息稍稍平复，脑子也能冷静思考以后，他回想起刚才的一切，先忍不住咯咯窃笑，接着放声大笑，最后笑得站也站不住，只好在一道树篱下面坐下来。
        - id: ch03-b27
          speaker: toad
          text: 哈，哈！又是蟾蜍！蟾蜍照旧反败为胜！是谁让他们主动把自己抬上汽车，捎了一程？是谁借口要吹新鲜空气，设法坐到前排？是谁又哄得他们答应让自己试开汽车？是谁亲手把所有人送进马塘？是谁快快活活地飞过天空，落地以后毫发无伤，还顺利逃走？又是谁把那群心胸狭窄、小气吝啬、胆小怕事的游人，留在他们活该待着的泥水里？当然是蟾蜍。聪明的蟾蜍，伟大的蟾蜍，善良的蟾蜍！
          emotion: happy
        - id: ch03-b28
          speaker: narrator
          text: 他又扯开嗓子，仰头唱了起来。
        - id: ch03-b29
          speaker: toad
          text: 汽车一路噗噗噗，飞驰大路真痛快。是谁驾车冲进塘？足智多谋蟾蜍在！哦，我多聪明！多聪明，多聪明，多么聪——
          emotion: happy
    - id: ch04
      title: 大河尽头的熟面孔
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 身后远处传来一点轻微的声响。蟾蜍转头一看，所有的歌声立刻断了。真是恐怖，真是痛苦，真叫人绝望！大约相隔两片田地，一名穿着皮绑腿的司机和两个高大的乡村警察，已经清清楚楚出现在他眼前。三个人正使出全身力气，拼命朝他跑来。
        - id: ch04-b02
          speaker: narrator
          text: 可怜的蟾蜍一跃而起，心都提到了嗓子眼，再次拔腿飞奔。他一边大口喘气，一边拼命逃命，刚才还满满当当的那份得意，早已消失得无影无踪。
        - id: ch04-b03
          speaker: toad
          text: 哎呀，我真是个蠢货！又自负又粗心！我怎么又摆架子，又叫喊，又唱歌，还坐在那里废话连篇？哎呀！哎呀！哎呀！
          emotion: fearful
        - id: ch04-b04
          speaker: narrator
          text: 他不断回头，惊恐地看着追兵越来越近。蟾蜍已经使出全身力气，可他偏偏是一只肥胖的动物，两条腿又短，敌人仍在稳稳逼近。他又拼命跑了一程，每一次回头，却都发现三个人比先前更近。很快，身后的脚步声已经清清楚楚，连追捕者得意的喊声也仿佛就在耳边。他再也顾不上自己正跑向哪里，只顾越过肩头，盯着那群胜券在握的敌人，同时盲目而疯狂地向前挣扎。突然，脚下的土地没了。他伸出两只爪子，徒劳地朝半空乱抓。扑通一声，整只蟾蜍从头到脚全掉进深水。那是又深又急的水流，立刻裹住他向前冲去，力道大得根本无法抵抗。他这才明白，自己刚才慌不择路，竟然笔直地冲向河岸，一头跑进了大河。
        - id: ch04-b05
          speaker: narrator
          text: 蟾蜍好不容易浮出水面，连忙伸手去抓河岸下面的芦苇和灯心草。那些草长得很密，离他也很近，他以为总算能借它们停下来。可急流实在太强，每当爪子刚刚扣住一把草叶，水势就会猛扯他的身体，硬生生把那些草从手里夺走。他一次次伸手，又一次次被冲开，始终无法靠岸。
        - id: ch04-b06
          speaker: toad
          text: 哎呀，我要是再偷一次汽车！我要是再唱一首自负的歌——
          emotion: fearful
        - id: ch04-b07
          speaker: narrator
          text: 话还没说完，他又沉了下去。再浮上来时，已经呛咳不止，几乎喘不过气。没过多久，他看见岸壁上有个黑黝黝的大洞，正朝自己靠近，位置就在头顶上方。水流把他载过洞口时，他赶紧抬起一只爪子，勾住洞口边缘，死也不肯放开。那股急流还在身下拉扯，他只能一点点积攒力气。接着，他艰难而缓慢地把身体向上拖，先把脑袋抬出水面，再把胸口挪上去。最后，两条胳膊肘终于能搭在洞边，身体也暂时稳住。他已经彻底筋疲力尽，只能趴在那里，一动也不敢动，呼哧呼哧喘上好几分钟。
        - id: ch04-b08
          speaker: narrator
          text: 蟾蜍一边叹气，一边呼哧呼哧地喘着，还直直望进面前的黑洞。洞穴深处忽然有个明亮的小东西闪了一下，又闪了一下。那个小亮点正在朝他移动。它越走越近，四周渐渐浮现出一张脸，轮廓也越来越清楚。那竟然是一张熟悉的脸！那张脸棕色、小巧，长着胡须。神情严肃，脸颊圆润，耳朵收拾得整整齐齐，毛发像丝一样光滑。
        - id: ch04-b09
          speaker: narrator
          text: 那是河鼠！
