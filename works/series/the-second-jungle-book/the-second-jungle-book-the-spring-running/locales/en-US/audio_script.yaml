  chapters:
    - id: ch01
      title: The Time of New Talk
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: "Man goes to Man. That was the cry that would pass through the Jungle. The brother the animals had loved was going away, sorrowing toward a trail where they could not follow."
        - id: ch01-b02
          speaker: narrator
          text: "Two years had passed since the great fight with Red Dog and the death of Akela. Mowgli was nearly seventeen, though he looked older. Hard exercise, the best food, and a bath whenever he felt hot or dusty had given him strength and growth far beyond his age. When he needed to search the tree-roads, he could hang by one hand from a high branch for half an hour. He could catch a young buck in full gallop and throw it aside by the head. Even the great blue boars of the Northern Marshes could not stand against him. The Jungle People had once feared his cleverness. Now they feared his strength as well. When he went quietly about his own business, the mere whisper of his coming cleared every wood-path. Yet his eyes stayed gentle. Even in a fight they never blazed like Bagheera's. They only grew more interested and excited, and this was one thing the panther could never understand."
        - id: ch01-b03
          speaker: mowgli
          text: "When I miss my kill, I get angry. When I go hungry for two days, I get very angry. Don't my eyes show you that?"
        - id: ch01-b04
          speaker: bagheera
          text: "Your mouth is hungry, but your eyes say nothing. Hunting, eating, swimming, it is all the same to them, like a stone in rain or sunshine."
        - id: ch01-b05
          speaker: narrator
          text: "Mowgli looked lazily at Bagheera through his long lashes. As always, the panther lowered his head. Bagheera knew his master. They lay far up a hillside above the Waingunga. Morning mist hung below them in white and green bands. As the sun climbed, the mist became rolling seas of red gold. Then it churned away and let the low rays stripe the dry grass where they rested. Cold weather was ending. Leaves and trees looked worn and faded, and every breath of wind brought a dry ticking rustle. One loose leaf, caught in the moving air, tapped furiously against a twig. It roused Bagheera. He drew in the morning with a deep hollow cough, rolled onto his back, and struck at the nodding leaf with both front paws."
        - id: ch01-b06
          speaker: bagheera
          text: "The year is turning. The Jungle is moving on, and the Time of New Talk is near. That leaf knows. This is good."
        - id: ch01-b07
          speaker: mowgli
          text: "The grass is still dry. Even Eye-of-the-Spring, the little red trumpet flower among the grass, is closed. And Bagheera, should the Black Panther really lie on his back, waving his paws like a tree-cat?"
        - id: ch01-b08
          speaker: narrator
          text: "Bagheera barely heard him. His thoughts had wandered elsewhere."
        - id: ch01-b09
          speaker: mowgli
          text: "I asked whether the Black Panther ought to cough and howl and roll in the dust. Remember, you and I are the Masters of the Jungle."
        - id: ch01-b10
          speaker: bagheera
          text: "Yes, yes, I hear you, Man-cub. We are certainly the Masters of the Jungle. Who could be stronger than Mowgli, or wiser?"
        - id: ch01-b11
          speaker: narrator
          text: "Bagheera rolled up quickly and sat with dust on the ragged black fur he was shedding. Something in his slow voice made Mowgli wonder if he was being mocked. Jungle words can sound like one thing and mean another."
        - id: ch01-b12
          speaker: bagheera
          text: "I said there is no question that we are the masters. Was that wrong? I did not know the Man-cub had stopped lying on the ground. Can he fly now?"
        - id: ch01-b13
          speaker: narrator
          text: "Mowgli sat with his elbows on his knees and watched daylight spread across the valley. Far below, a bird tried the first few notes of his spring song in a husky little voice. The full liquid call would come later, but Bagheera heard its shadow."
        - id: ch01-b14
          speaker: bagheera
          text: "I told you the Time of New Talk was near."
        - id: ch01-b15
          speaker: mowgli
          text: "I hear it. But Bagheera, why are you trembling? The sun is warm."
        - id: ch01-b16
          speaker: bagheera
          text: "That is Ferao, the scarlet woodpecker. He has not forgotten. I must remember my own song now."
        - id: ch01-b17
          speaker: narrator
          text: "Bagheera began to purr and croon. Again and again he went back, never pleased with the sound."
        - id: ch01-b18
          speaker: mowgli
          text: "There is no game nearby."
        - id: ch01-b19
          speaker: bagheera
          text: "Little Brother, have both your ears closed? That is not a hunting call. It is my song, and I am getting it ready for when I need it."
        - id: ch01-b20
          speaker: mowgli
          text: "I forgot. I will know New Talk has come when all of you run off and leave me alone."
          emotion: angry
        - id: ch01-b21
          speaker: bagheera
          text: "But Little Brother, we do not always do that."
        - id: ch01-b22
          speaker: mowgli
          text: "You do. You all leave, and I, the Master of the Jungle, must walk alone. Last season I wanted sugarcane from the Man-Pack's fields. I sent you to tell Hathi to come that very night and pull the sweet grass for me with his trunk."
          emotion: angry
        - id: ch01-b23
          speaker: bagheera
          text: "He came two nights later, and he brought more of that long sweet grass than any Man-cub could eat through all the Rains. That delay was not my fault."
        - id: ch01-b24
          speaker: mowgli
          text: "But he did not come when I sent for him. He was trumpeting and racing through the moonlit valleys. His trail was as wide as three elephants' trails because he would not stay under the trees. I saw him dance before the Man-Pack's houses, and still he would not come to me. To me, the Master of the Jungle!"
          emotion: angry
        - id: ch01-b25
          speaker: bagheera
          text: "It was the Time of New Talk. Perhaps you forgot to call him with a master's word. Listen to Ferao, Little Brother, and be glad."
        - id: ch01-b26
          speaker: narrator
          text: "Mowgli's anger seemed to burn itself away. He lay back, rested his head on his arms, and closed his eyes."
        - id: ch01-b27
          speaker: mowgli
          text: "I don't know, and I don't care. Let us sleep, Bagheera. My stomach feels heavy. Lie down and give me somewhere to rest my head."
        - id: ch01-b28
          speaker: narrator
          text: "Bagheera lay down again with a sigh. Below them, Ferao kept practicing his song for the Springtime of New Talk."
        - id: ch01-b29
          speaker: narrator
          text: "In the Indian Jungle, one season slips into another with almost no dividing line. At first there seem to be only two, the wet season and the dry. Look closely beneath the pounding rain, the smoke, and the clouds of dust, though, and you will find all four turning in their proper circle. Spring is the most wonderful. In other lands she may cover clean bare fields with leaves and flowers. Here she has harder work. She must drive out the worn jumble of half-green things that the gentle winter allowed to linger. She must clear them away and make the tired, partly dressed earth feel young and new. She does it so well that no spring in the world is quite like Jungle spring."
        - id: ch01-b30
          speaker: narrator
          text: "One day everything feels weary. Even the smells drifting through the heavy air seem old and used. It is hard to explain, but every creature can feel it. Then another day comes. Nothing at all looks different, yet every smell is fresh and delightful. The Jungle People's whiskers quiver right down to their roots, and their winter coats fall from their sides in long, damp locks. A little rain may pass over the land. Then trees, bushes, bamboo, moss, and thick juicy-leaved plants wake with a growing sound you can almost hear. Beneath that sound runs a deep hum, day and night. It is not the humming of bees. It is not falling water or wind moving through the treetops. It is the warm, happy world itself purring."
        - id: ch01-b31
          speaker: narrator
          text: "Until that year, Mowgli had loved every turning of the seasons. He was usually the first to find Eye-of-the-Spring hidden deep among the grass. He saw the first bank of spring clouds, unlike any other clouds in the Jungle. On wet, starry, flower-filled nights, his voice rang from one place after another. He helped the great frogs with their choruses and mocked the small upside-down owls that hooted through the white nights. Like all his people, he chose spring for roaming. Between twilight and the morning star he might race thirty, forty, or fifty miles just for the joy of rushing through warm air. He came home panting and laughing, with unfamiliar flowers wound around him. The Four never followed these wild circuits of the Jungle. They went away to sing with other wolves. Every Jungle creature was busy in spring, grunting, screaming, or whistling in the manner of its own kind. Their voices sounded different from every other season. That is one reason spring was called the Time of New Talk."
        - id: ch01-b32
          speaker: narrator
          text: "But this spring, as Mowgli had told Bagheera, something inside him had changed. Ever since the bamboo shoots turned spotted brown, he had waited for the morning when all the smells would turn. When it came, Mor the Peacock blazed bronze, blue, and gold and cried the news through the misty woods. Mowgli opened his mouth to pass on the call, but the words caught behind his teeth. Pure unhappiness began in his toes and climbed to the roots of his hair. He looked himself over to make sure he had not stepped on a thorn. Mor called the new smells, and the other birds carried the news. From the rocks beside the Waingunga came Bagheera's hoarse spring scream, half eagle's cry and half horse's neigh. The Bandar-log yelled and scattered through the budding branches above. Mowgli's chest had filled for his answer, but misery forced out the breath in little gasps. He searched in every direction. There was nothing to see except the mocking monkeys racing through the trees and Mor dancing below with his splendid tail spread wide."
        - id: ch01-b33
          speaker: mor
          text: "The smells have changed! Good hunting, Little Brother! Where is your answer?"
        - id: ch01-b34
          speakers: [chil, chil_mate]
          ensemble: duo
          text: "Good hunting, Little Brother!"
        - id: ch01-b35
          speaker: narrator
          text: "Chil and his mate swept so close beneath Mowgli's nose that a wisp of white down brushed away. Then a light elephant-rain crossed the Jungle in a narrow belt. It left the new leaves wet and nodding, faded into a double rainbow, and ended with a soft roll of thunder. The spring hum sounded once and stopped. Every Jungle voice seemed to call at the same moment. Every voice except Mowgli's."
        - id: ch01-b36
          speaker: mowgli
          text: "I ate good food and drank good water. My throat is not burning or closing as it did when Oo the Turtle told me that blue-spotted root was safe. Still, my stomach is heavy, and I spoke badly to Bagheera and my other Jungle people. One moment I am hot, the next cold, and then neither. I am angry at something I cannot see. Enough! Tonight I will run across the ranges to the Northern Marshes and back. Hunting has been too easy. The Four will come, too. They are growing as fat as white grubs."
        - id: ch01-b37
          speaker: narrator
          text: "He called, but none of the Four answered. They were far beyond the reach of his voice, singing the Moon Songs and Sambhur Songs with the wolves of the Pack. In spring the Jungle People made very little difference between day and night. Mowgli tried again with the sharp barking note. His only answer was the mocking cry of a little spotted tree-cat twisting through the branches in search of early birds' nests. Rage shook him from head to foot, and his knife came halfway out. Then he became very proud and grand, though there was no one there to see. With his chin high and his eyebrows low, he stalked stiffly down the hillside. Not one of his own people stopped to question him. Every creature was too busy with its own spring affairs."
        - id: ch01-b38
          speaker: mowgli
          text: "Let Red Dhole come from the Dekkan, or let the Red Flower burn among the bamboo, and the whole Jungle runs whining to Mowgli with grand elephant names. But Eye-of-the-Spring turns red, Mor shows his bare legs in a dance, and everyone goes mad like Tabaqui. By the Bull that bought me, am I Master of the Jungle or not? Be quiet! What are you doing here?"
          emotion: angry
        - id: ch01-b39
          speaker: narrator
          text: "Two young Pack wolves were trotting down a path to find open ground for a fight, because Jungle Law forbade them to fight where the Pack could see. Their neck hair stood like wire. They bayed, crouched, and prepared to grapple. Mowgli sprang between them and seized a throat in each hand, expecting to throw them backward as he had during games and hunts. But he had never stepped into a spring fight. Both wolves lunged. They knocked him aside and rolled away together without wasting a word."
        - id: ch01-b40
          speaker: narrator
          text: "Mowgli regained his feet almost before he struck the ground. His knife was out and his teeth were bare. For one wild moment he meant to kill them only because they had fought when he wanted quiet, though the Law gave them every right to fight. He circled with lowered shoulders and a trembling hand, waiting to strike both when their first struggle ended. Then the strength drained from him. His knife sank. He sheathed it and stood watching."
        - id: ch01-b41
          speaker: mowgli
          text: "I must have eaten poison. Since I broke the Council with the Red Flower and killed Shere Khan, no wolf has thrown me aside. These two are only young tail-wolves. Now my strength is leaving, and soon I will die. Mowgli, why don't you kill them both?"
          emotion: fearful
        - id: ch01-b42
          speaker: narrator
          text: "At last one wolf fled. Mowgli remained on the torn, bloody ground, looking from his knife to his arms and legs. The unhappiness he had never known before closed over him like water over a log."
    - id: ch02
      title: The Spring Running
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: "Mowgli made an early kill that evening and ate only a little, keeping himself ready for the spring running. He ate alone because the Jungle People had gone away to sing or fight. Then a perfect white night rose around him. Every green thing seemed to have grown a full month since morning. When he broke a branch that had carried yellow leaves the day before, fresh sap dripped from it. Moss curled deep and warm beneath his feet, and the young grass had lost its cutting edges. Every Jungle voice boomed together like one deep harp-string touched by the Moon of New Talk. Moonlight poured across rocks and pools. It slipped between tree trunks and creepers, then sifted down through a million leaves."
        - id: ch02-b02
          speaker: narrator
          text: "Mowgli forgot his misery. He sang with pure delight as he settled into his running stride down the long slope through the heart of the Jungle toward the Northern Marshes. It felt more like flying than running. Springy earth softened every footfall. A man raised by men would have picked his way slowly and stumbled often through that tricky moonlight. Years of Jungle training carried Mowgli as lightly as a feather. If a rotten log or hidden stone turned beneath his foot, his body saved itself without slowing, effort, or thought. When he tired of traveling on the ground, he threw both hands up in the monkey fashion and caught the nearest creeper. He seemed to float rather than climb into the thin branches. There he followed a tree-road until his mood changed, then shot downward in a long curve through the leaves and returned to the earth."
        - id: ch02-b03
          speaker: narrator
          text: "He crossed hot, still hollows ringed by wet rocks, where the scent of night flowers and opening creeper buds lay so heavily that he could hardly breathe. Dark avenues followed, with moonlight spread in even bands across the ground. He plunged through thickets where wet new growth reached his chest and wrapped around his waist. On hilltops crowned with broken stone, he leaped from rock to rock above the dens of frightened little foxes. Far away came the faint sound of a boar sharpening its tusks on a tree. Soon Mowgli found the great gray beast alone, carving and tearing the bark, foam dripping from its mouth and its eyes bright as fire. Then clashing horns and hissing grunts drew him aside. Two furious sambhur staggered back and forth with lowered heads, their bodies streaked with blood that looked black in the moonlight. At a rushing ford, Jacala the Crocodile bellowed like a bull. Mowgli disturbed a knotted coil of the Poison People, but he crossed the shining stones and vanished into deep Jungle before they could strike."
        - id: ch02-b04
          speaker: narrator
          text: "He ran on, sometimes shouting and sometimes singing to himself, the happiest creature in the whole Jungle that night. At last a change in the flowers' scent warned him that the marshes were near. They lay farther away than his farthest hunting grounds. A man raised by men would have vanished over his head in three steps. Mowgli's feet seemed to have eyes of their own. Without help from the eyes in his head, they passed him from tussock to tussock and from firm clump to quaking clump. He ran straight to the middle of the swamp, sending ducks fluttering up around him. There he sat on a moss-covered tree trunk with black water lapping its sides. The marsh was awake on every side. In spring the Bird People slept lightly, and whole companies came and went through the night. None paid attention to Mowgli among the tall reeds. He hummed songs without words and studied the tough brown soles of his feet for any thorn he might have missed."
        - id: ch02-b05
          speaker: narrator
          text: "He thought he had left all unhappiness behind in his own Jungle. He filled his lungs for a great song. Then the misery returned, ten times worse than before. For the first time, Mowgli was frightened."
        - id: ch02-b06
          speaker: mowgli
          text: "It is here, too! It followed me."
          emotion: fearful
        - id: ch02-b07
          speaker: narrator
          text: "He looked over his shoulder as if the thing might be standing there."
        - id: ch02-b08
          speaker: mowgli
          text: "No one is here."
          emotion: fearful
        - id: ch02-b09
          speaker: narrator
          text: "The marsh noises continued, but no bird or beast spoke to him. His misery kept growing."
        - id: ch02-b10
          speaker: mowgli
          text: "I did eat poison. I must have swallowed it carelessly, and now my strength is going. When the wolves fought, I was afraid. It did not feel like me, but Mowgli was afraid. Akela or even Phao would have silenced those two, yet I stood and watched. That fear proves the poison is in me. And what does the Jungle care? They sing, howl, fight, and run in companies under the moon. No one thinks of me. I am left to die alone in the marshes from the poison I ate."
          emotion: fearful
        - id: ch02-b11
          speaker: narrator
          text: "He felt so sorry for himself that tears nearly came."
        - id: ch02-b12
          speaker: mowgli
          text: "Later they will find me lying in the black water. No, I will not stay here. I will go back to my own Jungle and die on the Council Rock. Perhaps Bagheera, whom I love, will stop screaming in the valley long enough to sit beside what remains of me. Perhaps he will watch for a little while so Chil cannot use me as he used Akela."
          emotion: sad
        - id: ch02-b13
          speaker: narrator
          text: "A large warm tear splashed onto his knee. Though utterly miserable, Mowgli found a strange pleasure in feeling so sorry for himself."
        - id: ch02-b14
          speaker: mowgli
          text: "As Chil used Akela, on the night I saved the Pack from Red Dog."
          emotion: sad
        - id: ch02-b15
          speaker: narrator
          text: "He sat quietly and remembered the Lone Wolf's last words."
        - id: ch02-b16
          speaker: mowgli
          text: "Akela said many foolish things before he died. A dying creature's stomach changes. He said... But no matter. I am of the Jungle!"
        - id: ch02-b17
          speaker: narrator
          text: "The memory of the fight beside the Waingunga made him shout the last words. A wild buffalo cow hidden in the reeds jumped to her knees."
        - id: ch02-b18
          speaker: buffalo_cow
          text: "Man!"
          emotion: fearful
        - id: ch02-b19
          speaker: mysa
          text: "That is no man. It is only the hairless wolf from the Seeonee Pack. He runs back and forth on nights like this."
        - id: ch02-b20
          speaker: buffalo_cow
          text: "I thought it was Man."
        - id: ch02-b21
          speaker: mysa
          text: "It was not. Mowgli, is there danger?"
        - id: ch02-b22
          speaker: mowgli
          text: "Mowgli, is there danger? That is all Mysa ever thinks about. But does anyone care for Mowgli, who travels the Jungle at night and keeps watch?"
        - id: ch02-b23
          speaker: buffalo_cow
          text: "How loudly he cries."
        - id: ch02-b24
          speaker: mysa
          text: "That is how creatures cry when they have pulled up the grass but do not know how to eat it."
        - id: ch02-b25
          speaker: mowgli
          text: "Last Rains, I would have punished Mysa for less. I would have driven him from his wallow and ridden him across the swamp with a reed for a halter."
        - id: ch02-b26
          speaker: narrator
          text: "Mowgli reached for a feathery reed, then sighed and drew his hand back. Mysa chewed steadily while the cow tore long grass."
        - id: ch02-b27
          speaker: mowgli
          text: "I will not die here with Mysa, cousin to Jacala and the pig, watching me. I will cross the swamp and see what comes. Never have I run like this, hot and cold at once. Get up, Mowgli!"
          emotion: angry
        - id: ch02-b28
          speaker: narrator
          text: "Still, he could not resist one old joke. He slipped through the reeds and pricked Mysa with his knife. The dripping bull burst from the wallow like an exploding shell, and Mowgli laughed until he had to sit down."
        - id: ch02-b29
          speaker: mowgli
          text: "Now you can tell everyone that the hairless wolf of the Seeonee Pack once herded you, Mysa!"
          emotion: happy
        - id: ch02-b30
          speaker: mysa
          text: "You call yourself a wolf? The whole Jungle knows you once herded tame cattle. You are a man's brat, no better than the boys who shout in the dust beside those crops. You claim to belong to the Jungle, but what true hunter would crawl like a snake among the leeches for a muddy joke? It was a jackal's trick, and you shamed me before my own cow. Come onto firm ground. Come here, and I will... I will..."
          emotion: angry
        - id: ch02-b31
          speaker: narrator
          text: "Mysa stamped, foamed, and threw mud in every direction. Few creatures in the Jungle had a worse temper. Mowgli watched without blinking. When the noise eased enough for him to speak, he called across the water."
        - id: ch02-b32
          speaker: mowgli
          text: "What Man-Pack lives near this marsh, Mysa? This Jungle is new to me."
        - id: ch02-b33
          speaker: mysa
          text: "Go north! It was the sort of trick a naked cowherd would play. Go tell them about it in the village at the foot of the marsh!"
          emotion: angry
        - id: ch02-b34
          speaker: mowgli
          text: "The Man-Pack does not care for Jungle stories. And one more scratch on your hide hardly needs a council. But I will look at that village. Easy now. The Master of the Jungle does not herd you every night."
        - id: ch02-b35
          speaker: narrator
          text: "Mowgli stepped onto the trembling ground at the marsh edge, knowing Mysa would never charge across it. He ran away laughing at the bull's anger."
        - id: ch02-b36
          speaker: mowgli
          text: "My strength has not all gone. Perhaps the poison has not reached my bones. A star is sitting low over there."
        - id: ch02-b37
          speaker: narrator
          text: "He shaded his eyes with both hands and looked."
        - id: ch02-b38
          speaker: mowgli
          text: "By the Bull that bought me, that is the Red Flower. I slept beside that fire before I ever came to the Seeonee Pack. Now that I have seen it, I will finish my run."
        - id: ch02-b39
          speaker: narrator
          text: "Beyond the marsh lay a broad open plain. One light twinkled in the distance. It had been a long time since Mowgli concerned himself with anything men did. On any other night he might have turned away without a second thought. This night the small glimmer of the Red Flower drew him forward across the plain."
        - id: ch02-b40
          speaker: mowgli
          text: "I will look as I did long ago and see how much the Man-Pack has changed."
    - id: ch03
      title: Messua's Door
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: "Mowgli forgot that this was not his own Jungle, where he could go wherever he pleased and no creature would question him. He walked carelessly through the dew-heavy grass toward the hut with the light. Three or four dogs began yelping as he reached the outer edge of the village. Mowgli sent back one deep wolf growl. The frightened curs fell silent, and he sat down beside the hut without making a sound."
        - id: ch03-b02
          speaker: mowgli
          text: "Whatever comes will come. Mowgli, why should you care about the Man-Pack's dens now?"
        - id: ch03-b03
          speaker: narrator
          text: "He rubbed his mouth, remembering the stone that had cut him years before when another Man-Pack drove him out. The hut door opened. A woman peered into the darkness, and a child began to cry behind her."
        - id: ch03-b04
          speaker: messua
          text: "Go back to sleep. Only a jackal woke the dogs. Morning will come soon."
        - id: ch03-b05
          speaker: narrator
          text: "Mowgli shook as though fever had seized him. He knew that voice. To make certain, he called softly and was surprised at how quickly the speech of men returned to him."
        - id: ch03-b06
          speaker: mowgli
          text: "Messua! Oh, Messua!"
          emotion: surprised
        - id: ch03-b07
          speaker: messua
          text: "Who is calling me?"
          emotion: surprised
        - id: ch03-b08
          speaker: mowgli
          text: "Have you forgotten?"
        - id: ch03-b09
          speaker: narrator
          text: "His throat had gone dry. Messua pulled the door halfway closed and clutched her breast."
        - id: ch03-b10
          speaker: messua
          text: "If it is truly you, tell me the name I gave you. Say it!"
        - id: ch03-b11
          speaker: mowgli
          text: "Nathoo! Oh, Nathoo!"
        - id: ch03-b12
          speaker: narrator
          text: "That was the name Messua had given him when he first entered the Man-Pack."
        - id: ch03-b13
          speaker: messua
          text: "Come in, my son!"
          emotion: happy
        - id: ch03-b14
          speaker: narrator
          text: "Mowgli stepped into the light and looked straight at the woman who had once been kind to him, and whose life he had saved. Messua was older now, and her hair had turned gray, but her eyes and voice were unchanged. She had expected the same boy she remembered. Her puzzled gaze moved upward from his chest until she found his face near the top of the doorway."
        - id: ch03-b15
          speaker: messua
          text: "My son... No, this is no longer my son. This is a young god from the woods!"
          emotion: surprised
        - id: ch03-b16
          speaker: narrator
          text: "In the red light of the oil lamp, Mowgli did look like a wild god from a Jungle tale. He stood strong, tall, and beautiful. Long black hair swept across his shoulders, the knife swung at his neck, and a wreath of white jasmine crowned his head. A half-sleeping child sprang from a cot and screamed in terror. Messua turned away to soothe him. Mowgli did not move. He looked into the hut at its water jars, cooking pots, grain bin, and all the other human belongings. One after another, he found that he remembered them perfectly."
        - id: ch03-b17
          speaker: messua
          text: "What will you eat? What will you drink? Everything here is yours. We owe you our lives. But are you really my Nathoo, or are you a forest god?"
        - id: ch03-b18
          speaker: mowgli
          text: "I am Nathoo. I came a very long way from my own place. I saw your light and came to it. I did not know you lived here."
        - id: ch03-b19
          speaker: messua
          text: "After we reached Khanhiwara, the English were ready to help us against the villagers who tried to burn us. Do you remember?"
        - id: ch03-b20
          speaker: mowgli
          text: "I have not forgotten."
        - id: ch03-b21
          speaker: messua
          text: "But when English law was ready, we returned to that wicked village, and there was no village left."
        - id: ch03-b22
          speaker: mowgli
          text: "I remember that, too."
        - id: ch03-b23
          speaker: messua
          text: "So my husband worked in the fields. He was a strong man, and in time we got a little land here. It is poorer than our old village, but the two of us did not need much."
        - id: ch03-b24
          speaker: mowgli
          text: "Where is the man who dug at the earth when he was frightened that night?"
        - id: ch03-b25
          speaker: messua
          text: "He died a year ago."
          emotion: sad
        - id: ch03-b26
          speaker: mowgli
          text: "And that child?"
        - id: ch03-b27
          speaker: messua
          text: "My son, born two Rains ago. If you are a forest god, give him the Jungle's favor. Let him be safe among your people, as we were safe that night."
        - id: ch03-b28
          speaker: narrator
          text: "She lifted the child. His fear had passed, and he reached for the knife on Mowgli's chest. Mowgli gently moved the tiny fingers away."
        - id: ch03-b29
          speaker: messua
          text: "And if you are Nathoo, the boy the tiger carried away, then this is your little brother. Give him an elder brother's blessing."
          emotion: sad
        - id: ch03-b30
          speaker: mowgli
          text: "What do I know about blessings? I am not a god, and I am not his brother. Oh, Mother, Mother, my heart is so heavy."
          emotion: sad
        - id: ch03-b31
          speaker: narrator
          text: "He shivered as he set the child down. Messua turned briskly to her pots."
        - id: ch03-b32
          speaker: messua
          text: "Of course it is. You have been running around the marshes at night, and the fever has soaked into your bones. I will make a fire and give you warm milk. Take off that jasmine wreath. Its scent is too strong inside this little room."
        - id: ch03-b33
          speaker: narrator
          text: "Mowgli smiled faintly at the thought that anything in the Jungle could harm him. Then he sat with his face buried in his hands and muttered to himself. All kinds of feelings he had never known before ran over him, just as if he truly had been poisoned. The little room seemed to turn. He felt dizzy and slightly sick. He drank the warm milk in long swallows while Messua patted his shoulder from time to time. She still could not decide whether he was Nathoo, her lost son from years ago, or some marvelous creature of the Jungle. But the warmth beneath her hand told her he was flesh and blood, and that made her glad."
        - id: ch03-b34
          speaker: messua
          text: "Son, has anyone ever told you that you are more beautiful than any other man?"
          emotion: happy
        - id: ch03-b35
          speaker: mowgli
          text: "What?"
          emotion: surprised
        - id: ch03-b36
          speaker: narrator
          text: "Messua laughed softly, happily. His bewildered face had answered her."
        - id: ch03-b37
          speaker: messua
          text: "Then I am the first. A mother should tell her son such things, even if the chance comes only once. You are very beautiful. I have never seen a man like you."
          emotion: happy
        - id: ch03-b38
          speaker: narrator
          text: "Mowgli twisted around and tried to look over his own hard shoulder. Messua laughed so long that he began laughing too, though he did not know why. The child ran between them, joining their laughter."
        - id: ch03-b39
          speaker: messua
          text: "Do not laugh at your brother. When you are half as handsome, we will marry you to a king's youngest daughter, and you will ride on great elephants."
          emotion: happy
        - id: ch03-b40
          speaker: narrator
          text: "Mowgli understood scarcely one word in three of this talk. After his long run, the warm milk had begun to work on him. He curled up and fell deeply asleep within a minute. Messua pushed the hair back from his eyes, laid a cloth over him, and felt happy. In the Jungle fashion, he slept through what remained of the night and through all the following day. His instincts never slept completely, and they told him there was nothing here to fear. At last he woke with a leap that shook the hut. The cloth across his face had made him dream of traps. In an instant he was standing with one hand on his knife, heavy sleep still rolling in his eyes, ready for any fight that might come."
        - id: ch03-b41
          speaker: narrator
          text: "Messua laughed at his alarm and set the evening meal before him. There were only a few coarse cakes baked over the smoky fire, a little rice, and one lump of sour preserved tamarind. It was just enough to carry him until his evening kill. The smell of dew rising from the marsh made him hungry and restless. He wanted to be outside and finish his spring running. But the little child insisted on sitting in his arms, and Messua insisted that his long blue-black hair must be properly combed. She worked through it while singing foolish little songs meant for babies. One moment she called Mowgli her own son. The next she begged the Jungle being in him to give some of his power to the small child on his knee."
        - id: ch03-b42
          speaker: narrator
          text: "The door was shut, but Mowgli heard a familiar sound. Messua's mouth fell open in horror when a huge gray paw slid under the door. Outside, Gray Brother gave a muffled, anxious whine."
        - id: ch03-b43
          speaker: mowgli
          text: "Go away and wait. None of you came when I called."
        - id: ch03-b44
          speaker: narrator
          text: "The paw vanished."
        - id: ch03-b45
          speaker: messua
          text: "Please, do not bring your servants here. We have always lived peacefully with the Jungle."
          emotion: fearful
        - id: ch03-b46
          speaker: mowgli
          text: "There is peace. Remember the road to Khanhiwara. Scores of wolves walked before and behind you that night. Even in spring, the Jungle People do not always forget. Mother, I must go."
        - id: ch03-b47
          speaker: narrator
          text: "Messua moved aside humbly. In her mind, this powerful visitor with the wolves outside truly was a wood-god. But when his hand touched the door, the mother in her became stronger than her fear. She caught him before he could leave and wrapped her arms around his neck again and again."
        - id: ch03-b48
          speaker: messua
          text: "Come back. Whether you are my son or not, come back, because I love you. Look, the little one is grieving too."
          emotion: sad
        - id: ch03-b49
          speaker: narrator
          text: "The child cried because the man with the shining knife was leaving."
        - id: ch03-b50
          speaker: messua
          text: "Come back again. Night or day, this door will never be closed to you."
          emotion: sad
        - id: ch03-b51
          speaker: narrator
          text: "The cords in Mowgli's throat seemed to tighten and pull against one another. For a moment he could not speak at all. When his answer finally came, it sounded as though each word had to be dragged out of him."
        - id: ch03-b52
          speaker: mowgli
          text: "I will come back. I promise."
          emotion: sad
    - id: ch04
      title: The Double Trail
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: "Outside, Mowgli pushed aside the head of the wolf fawning at the threshold."
        - id: ch04-b02
          speaker: mowgli
          text: "I have a complaint against you, Gray Brother. Why did none of the Four come when I called so long ago?"
        - id: ch04-b03
          speaker: gray_brother
          text: "So long ago? That was only last night. We were singing the new songs because this is the Time of New Talk. Surely you remember."
        - id: ch04-b04
          speaker: mowgli
          text: "Yes. I remember."
        - id: ch04-b05
          speaker: gray_brother
          text: "The moment the songs ended, I found your trail. I left the others and followed as fast as I could. But Little Brother, what have you done? You ate and slept with the Man-Pack!"
        - id: ch04-b06
          speaker: mowgli
          text: "It would never have happened if you had come when I called."
        - id: ch04-b07
          speaker: narrator
          text: "Mowgli began to run, faster and faster. Gray Brother kept beside him."
        - id: ch04-b08
          speaker: gray_brother
          text: "What happens now?"
        - id: ch04-b09
          speaker: narrator
          text: "Before Mowgli could answer, a girl dressed in a white cloth came down a path from the village edge. Gray Brother dropped out of sight at once. Mowgli moved backward without a sound into a field of tall spring crops. The girl passed so close that he could almost have reached out and touched her. Then the warm green stalks closed before his face, and he vanished among them like a ghost. The girl screamed because she thought she had seen a spirit. A moment later she gave a deep sigh and walked on. Mowgli gently parted the stalks with both hands and watched her until she was completely out of sight."
        - id: ch04-b10
          speaker: mowgli
          text: "Now I do not know what happens. Why didn't you come when I called?"
        - id: ch04-b11
          speaker: gray_brother
          text: "We follow you. We always follow you, except during the Time of New Talk."
        - id: ch04-b12
          speaker: mowgli
          text: "Would you follow me to the Man-Pack?"
        - id: ch04-b13
          speaker: gray_brother
          text: "Did I not follow when our old Pack drove you out? Who woke you when you slept among the crops?"
        - id: ch04-b14
          speaker: mowgli
          text: "Yes, but would you do it again?"
        - id: ch04-b15
          speaker: gray_brother
          text: "Did I not follow you tonight?"
        - id: ch04-b16
          speaker: mowgli
          text: "Yes, but again and again, Gray Brother? Perhaps for always?"
        - id: ch04-b17
          speaker: narrator
          text: "Gray Brother said nothing for a time. Then he growled under his breath."
        - id: ch04-b18
          speaker: gray_brother
          text: "The Black One spoke the truth."
        - id: ch04-b19
          speaker: mowgli
          text: "What did he say?"
        - id: ch04-b20
          speaker: gray_brother
          text: "Man goes to Man in the end. Raksha, our mother, said it too."
        - id: ch04-b21
          speaker: mowgli
          text: "Akela said the same on the night of Red Dog."
        - id: ch04-b22
          speaker: gray_brother
          text: "Kaa says it as well, and Kaa is wiser than any of us."
        - id: ch04-b23
          speaker: mowgli
          text: "But what do you say, Gray Brother?"
        - id: ch04-b24
          speaker: gray_brother
          text: "Men drove you out once with cruel words. Their stones cut your mouth. They sent Buldeo to kill you, and they meant to throw you into the Red Flower. You called them wicked and foolish, not I. I stayed with my own people and said nothing against them. You were the one who let the Jungle loose upon their village. You were the one who made a song against them, a song even more bitter than the one we sang against Red Dog."
        - id: ch04-b25
          speaker: mowgli
          text: "I asked what you say."
        - id: ch04-b26
          speaker: narrator
          text: "They spoke while running. Gray Brother bounded onward for a while before answering."
        - id: ch04-b27
          speaker: gray_brother
          text: "Man-cub, Master of the Jungle, son of Raksha, my own den-brother, listen to me. I may forget for a little while when spring brings the New Talk. Even then, your trail is my trail. Your den is my den. Your kill is my kill, and your last fight is my last fight. Wherever you go, I follow. I speak for the other Three as well as myself. But what will you say to the Jungle?"
        - id: ch04-b28
          speaker: mowgli
          text: "That is the right question. It is bad to wait between seeing and killing. Run ahead and summon everyone to the Council Rock. I will tell them what is inside me. But perhaps they will not come. In the Time of New Talk they may forget me."
        - id: ch04-b29
          speaker: gray_brother
          text: "Have you forgotten nothing, then?"
        - id: ch04-b30
          speaker: narrator
          text: "Gray Brother snapped the question over his shoulder and stretched into a gallop. Mowgli followed behind him, thinking. In any other season, such news would have brought the whole Jungle together with the hair standing along every neck. But now its people were busy with spring. They hunted, fought, killed, and sang, each caught up in the Time of New Talk. Gray Brother ran from one creature to the next, repeating the message wherever he found someone who might listen."
        - id: ch04-b31
          speaker: gray_brother
          text: "The Master of the Jungle is going back to Man! Come to the Council Rock!"
        - id: ch04-b32
          speakers: [jungle_voice_1, jungle_voice_2]
          ensemble: duo
          text: "He will come back in the summer heat. The Rains will send him home. Come sing with us, Gray Brother!"
        - id: ch04-b33
          speaker: gray_brother
          text: "The Master of the Jungle is going back to Man!"
        - id: ch04-b34
          speakers: [jungle_voice_1, jungle_voice_2]
          ensemble: duo
          text: "And does that make the Time of New Talk any less sweet?"
        - id: ch04-b35
          speaker: narrator
          text: "Heavy-hearted, Mowgli climbed through the familiar rocks to the place where he had first been brought before the Council. The eager springtime Jungle had not answered Gray Brother's summons. Its people believed summer heat or the Rains would bring Mowgli back, and New Talk was too sweet to leave. Only the Four were waiting. Old Baloo, nearly blind with age, stood beside them. Heavy, cold-blooded Kaa lay coiled around the empty place where Akela had once sat. Mowgli threw himself down among them and hid his face in his hands."
    - id: ch05
      title: A New Trail
      blocks:
        - id: ch05-b01
          speaker: kaa
          text: "So your trail ends here, Manling? Then give your cry. You and I are one blood, man and snake together."
        - id: ch05-b02
          speaker: mowgli
          text: "Why did I not die beneath Red Dog? My strength is gone, but now I know poison did not take it. Day and night, I hear two sets of feet following my trail. When I turn my head, it feels as though someone hid from me that very instant. I go back and search behind the trees, but no one is there. I call, and no one answers. Still, I feel that someone is listening and choosing not to reply. I lie down, but I cannot rest. I run the spring running, but it does not make me still. I bathe, but the water does not cool me. The kill makes me sick, yet I have no heart to fight unless I mean to kill. The Red Flower burns inside my body, my bones have turned to water, and I know nothing except that I do not know what I know."
          emotion: sad
        - id: ch05-b03
          speaker: baloo
          text: "Why use so many words? Akela said beside the river that Mowgli himself would drive Mowgli back to the Man-Pack. I said it too, though no one listens to Baloo now. Bagheera knows it. Where is Bagheera tonight? This is the Law."
        - id: ch05-b04
          speaker: kaa
          text: "I knew it when we met at the Cold Lairs, Manling. Man goes to Man in the end, even when the Jungle does not drive him out."
        - id: ch05-b05
          speaker: narrator
          text: "The Four looked at one another, then at Mowgli. They were puzzled, but they would obey."
        - id: ch05-b06
          speaker: mowgli
          text: "Then the Jungle is not casting me out?"
          emotion: surprised
        - id: ch05-b07
          speakers: [gray_brother, wolf_brother_2, wolf_brother_3, wolf_brother_4]
          ensemble: chorus
          text: "While we live, no one will dare cast you out!"
          emotion: angry
        - id: ch05-b08
          speaker: narrator
          text: "Gray Brother and the Three growled furiously, but Baloo stopped them."
        - id: ch05-b09
          speaker: baloo
          text: "I taught him the Law, so I will speak. My eyes can no longer see the rocks before me, but they can see far. Little Frog, choose your own trail. Make your den among your own blood, your own pack, and your own people. But when you need a foot, a tooth, an eye, or a message carried swiftly through the night, remember this. Master of the Jungle, the Jungle will answer your call."
        - id: ch05-b10
          speaker: kaa
          text: "The Middle Jungle is yours as well, and I do not speak for any small people."
        - id: ch05-b11
          speaker: mowgli
          text: "Oh, my brothers, I do not know what I know! I do not want to go, but both my feet pull me away. How can I ever leave nights like these?"
          emotion: sad
        - id: ch05-b12
          speaker: baloo
          text: "Look up, Little Brother. There is no shame in this hunt. When the honey is gone, we leave the empty hive."
        - id: ch05-b13
          speaker: kaa
          text: "Once we cast off a skin, we cannot crawl back into it. That is the Law."
        - id: ch05-b14
          speaker: baloo
          text: "Listen to me, dearest of all creatures to old Baloo. There is no word and no will here that would hold you back. Lift your head. Who has the right to question the Master of the Jungle? I watched you play among those white pebbles when you were only a little frog. Bagheera saw you there too, after he bought you for the price of a young bull freshly killed. Only he and I remain from that first Looking Over. Raksha, your den-mother, is dead, and your den-father died with her. The old Wolf-Pack has been gone a long time. You know where Shere Khan went. Akela died among the dholes. Without your wisdom and your strength, the second Seeonee Pack would have died there with him. Nothing remains now except old bones. This is no longer a Man-cub asking his Pack for permission. This is the Master of the Jungle changing his trail. Who can question the road a man must take?"
        - id: ch05-b15
          speaker: mowgli
          text: "But Bagheera, and the Bull that bought me... I would not leave without..."
        - id: ch05-b16
          speaker: narrator
          text: "Before Mowgli could finish, a roar and a crash burst from the thicket below. Bagheera sprang into the open and stood before them, light, strong, and terrible as ever. The hunt had left no weakness in him. He stretched out his right paw for Mowgli to see, and fresh blood dripped from it."
        - id: ch05-b17
          speaker: bagheera
          text: "That is why I did not come sooner. It was a long hunt, but the bull lies dead among the bushes now. He was in his second year, just as the Law requires. This is the Bull that sets you free, Little Brother. The old price has been paid again, and every debt between you and the Jungle is settled. For everything else, Baloo's word is my word."
        - id: ch05-b18
          speaker: narrator
          text: "Bagheera licked Mowgli's foot."
        - id: ch05-b19
          speaker: bagheera
          text: "Remember that Bagheera loved you."
          emotion: sad
        - id: ch05-b20
          speaker: narrator
          text: "He bounded away. At the foot of the hill he cried once more, long and loud."
        - id: ch05-b21
          speaker: bagheera
          text: "Good hunting on your new trail, Master of the Jungle! Remember that Bagheera loved you!"
          emotion: sad
        - id: ch05-b22
          speaker: baloo
          text: "You have heard him. There is nothing more. Go now, but first come close to me. Wise Little Frog, come to me."
        - id: ch05-b23
          speaker: narrator
          text: "Mowgli sobbed against the blind bear's side with both arms around Baloo's neck. Baloo tried weakly to lick his feet."
        - id: ch05-b24
          speaker: kaa
          text: "It is hard to cast off the skin."
        - id: ch05-b25
          speaker: gray_brother
          text: "The stars are fading. Where will we make our den today? From now on, we follow new trails."
        - id: ch05-b26
          speaker: narrator
          text: "And this is the last of the Mowgli stories."
