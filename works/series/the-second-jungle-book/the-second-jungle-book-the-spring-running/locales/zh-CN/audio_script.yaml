audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 沉稳生动，带着古老故事的智慧
        timbre: 温暖浑厚
        pace: 舒缓
        pitch: 中低
    mowgli:
      display_name: 毛克利
      tts:
        delivery: 自信敏锐，情绪直率，从少年人的困惑走向含泪的清醒
        timbre: 清亮强健
        pace: 适中偏快
        pitch: 中
    bagheera:
      display_name: 巴希拉
      tts:
        delivery: 骄傲机敏，面对毛克利时带着克制的宠爱与谦让
        timbre: 深沉顺滑
        pace: 适中
        pitch: 中低
    mor:
      display_name: 莫尔
      tts:
        delivery: 华丽响亮，满怀春日的兴奋
        timbre: 明亮高亢
        pace: 轻快
