        pace: 舒缓
        pitch: 低
  chapters:
    - id: ch01
      title: 新语时节将近
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            人终归人。让挑战的呼声传遍丛林吧。曾经的兄弟就要离开，丛林众民谁能让他回头，谁能叫他留下？人终归人。他在丛林里流泪。丛林爱过他，可他终究要踏上人的踪迹，去往众民再也不能跟随的地方。
        - id: ch01-b02
          speaker: narrator
          text: >-
            大战红狗、阿克拉死去后的第二年，毛克利已快十七岁。他看起来还要更大。终日锻炼，吃的是最好的食物，稍觉燥热或沾了灰尘便去洗澡，这样的日子让他长得远比同龄人强壮。需要查看树梢道路时，他能单手吊在最高的树枝上，一吊就是半个钟头。一头小雄鹿正在飞奔，他能迎面抓住鹿头，把它横着掀倒。连北方沼泽里那些庞大的蓝灰色野猪，他也能猛然扳翻。丛林众民从前怕他的聪明，如今又怕他的力量。他只要静静去办自己的事，一听说他来了，林中小路便会自行让空。可他的眼神始终温和。就算争斗，也从不像巴希拉的眼睛那样燃烧，只会越来越专注，越来越兴奋。这一点，连巴希拉自己也弄不明白。
        - id: ch01-b03
          speaker: mowgli
          text: >-
            猎物逃走，我会生气。要是饿上两天，我会非常生气。那时候，我的眼睛难道还不会说话？
        - id: ch01-b04
          speaker: bagheera
          text: >-
            你的嘴饿了，眼睛却什么都不说。打猎、吃东西、游水，你总是同一个样子，像一块石头，晴天雨天都不变。
        - id: ch01-b05
          speaker: narrator
          text: >-
            毛克利从长睫毛下懒懒看了他一眼，黑豹便低下头。巴希拉知道谁是自己的主人。那天清晨，他们躺在高高的山坡上，下面就是温贡加河。晨雾一带白、一带绿地悬在山下。太阳升起，雾海翻成沸腾的赤金色，随后又被搅散。低斜的光穿过去，一道道横铺在他们歇息的枯草上。寒季将尽，树叶和树木都显得疲惫褪色。风一吹，四处便响起干涩的滴答声。一片落单的叶子困在气流里，正对细枝发疯似的拍打。那声音惊醒巴希拉。他发出一声深沉空洞的咳嗽，嗅过晨风，忽然仰面翻倒，用两只前爪去扑头顶点个不停的叶片。
        - id: ch01-b06
          speaker: bagheera
          text: >-
            岁月又转了一轮，丛林正往前走。新语时节快到了，连那片叶子都知道。真好。
        - id: ch01-b07
          speaker: mowgli
          text: >-
            草还是干的，连草丛里那种蜡红色的小喇叭花，春之眼，也还闭着。巴希拉，堂堂黑豹四脚朝天，挥着爪子打空气，活像一只树猫，这合适吗？
        - id: ch01-b08
          speaker: bagheera
          text: >-
            嗷？你说这样不合适吗？
        - id: ch01-b09
          speaker: mowgli
          text: >-
            我问你，黑豹这样咂嘴、咳嗽、号叫、打滚，合适吗？别忘了，你和我才是丛林之主。
        - id: ch01-b10
          speaker: bagheera
          text: >-
            是，是，我听见了，人孩。我们当然是丛林之主！谁比毛克利强壮？谁比他聪明？我难道做错了？我不知道人孩已经不在地上躺着了。原来他如今会飞？
        - id: ch01-b11
          speaker: narrator
          text: >-
            巴希拉赶紧翻身坐正，正在褪冬毛的黑色腰腹斑斑驳驳，又沾满尘土。他把话音拖得十分古怪，毛克利不由回头看他是不是在取笑自己。丛林里有许多话，听上去是一回事，真正的意思却是另一回事。毛克利抱着膝盖坐起来，望向山谷上空的晨光。山下林子深处，一只鸟正用沙哑细弱的嗓子试唱春歌开头的几个音。眼下，那歌声还只是后来那串流丽婉转鸣啭所投下的一点影子，巴希拉却已经听见了。
        - id: ch01-b12
          speaker: bagheera
          text: >-
            我说过，新语时节快到了。
        - id: ch01-b13
          speaker: mowgli
          text: >-
            我听见了。可你为什么浑身发抖？太阳明明很暖。
        - id: ch01-b14
          speaker: bagheera
          text: >-
            那是猩红啄木鸟费拉奥，他没有忘记自己的歌。我也得把我的歌想起来了。
        - id: ch01-b15
          speaker: narrator
          text: >-
            巴希拉低低呼噜着试唱，一遍不满意，又从头再来。
        - id: ch01-b16
          speaker: mowgli
          text: >-
            附近根本没有猎物在走动。
        - id: ch01-b17
          speaker: bagheera
          text: >-
            小弟弟，你两只耳朵都堵住了吗？那不是猎杀的呼号，是我要留到时候唱的歌。
        - id: ch01-b18
          speaker: mowgli
          text: >-
            我忘了。新语时节一到，你们就会全跑开，把我一个人丢下。到时我自然会知道。
          emotion: angry
        - id: ch01-b19
          speaker: bagheera
          text: >-
            可是，小弟弟，我们并不总是……
        - id: ch01-b20
          speaker: mowgli
          text: >-
            你们就是！你们跑掉，害我这个丛林之主独自闲逛。上一个时节，我想去人群的田里采甘蔗，还派你通知哈蒂，请他在约好的夜里来替我拔甜草。
          emotion: angry
        - id: ch01-b21
          speaker: bagheera
          text: >-
            他只晚了两个晚上，而且拔来的甜草多得让一个人孩吃完整个雨季也吃不完。那不是我的错。
        - id: ch01-b22
          speaker: mowgli
          text: >-
            我叫他来的那晚，他偏不来，只顾在月光下跑遍山谷，又吹号又大吼，留下的踪迹像三头象一同走过。他还当着人群的屋子跳舞。我看见了他，他却不肯来见我，而我可是丛林之主！
        - id: ch01-b23
          speaker: bagheera
          text: >-
            那时正逢新语时节。也许你召唤他时，没有用主人的口令？听听费拉奥的歌，高兴一点吧。
        - id: ch01-b24
          speaker: narrator
          text: >-
            毛克利的坏脾气仿佛滚沸了一阵，终于全都蒸散了。他向后一躺，把脑袋枕在双臂上，闭上眼睛，声音里已经带着睡意。
        - id: ch01-b25
          speaker: mowgli
          text: >-
            我不知道，也不在乎。睡吧，巴希拉。我的肚子沉甸甸的，给我的头垫一垫。
        - id: ch01-b26
          speaker: narrator
          text: >-
            巴希拉叹了口气，重新伏下。他听见费拉奥一遍又一遍练习自己的歌。猩红啄木鸟总觉得哪里还不够好，所以唱完又从头开始。那首歌是为了迎接丛林所谓的新语之春。
    - id: ch02
      title: 春天里陌生的悲伤
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            印度丛林的四季一个滑进另一个，几乎没有界线。看起来那里只有雨季和旱季。不过，只要你细看滂沱雨幕之下，细看焦灰与尘土的云雾之下，就会发现四季仍循着不变的圆环轮转。丛林的春最奇妙。她面对的不是一片干净空旷的田野，不能只管铺上新叶、点开鲜花。温和的冬季让许多半青不黄的枝叶拖延到今天。春天得先把这堆苟延残喘、不肯退场的杂物统统赶走，收拾干净，再让衣衫半褪、困倦陈旧的大地重新变得清新年轻。她做得那么出色，世上没有哪一个春天比得上丛林之春。
        - id: ch02-b02
          speaker: narrator
          text: >-
            先会有那么一天，万物都疲倦了。连气味飘在沉滞的空气里，也显得陈旧，仿佛早就被用过。这感觉说不明白，却真真切切。接着又会有一天。眼睛看去，一切明明毫无变化，所有气味却忽然崭新可喜。丛林众民的胡须从根部微微颤动，腰腹两侧的冬毛成绺脱落，湿漉漉地拖着。然后，也许会落一阵小雨。所有树木、灌丛、竹子、苔藓，还有叶片饱含汁液的草木会一同醒来，发出几乎听得见的生长声。在这声音底下，还有一道深沉的嗡鸣，日夜不停。那就是春之声，一道震荡不息的隆隆低响。它不是蜂鸣，不是落水，也不是风吹树梢，而是温暖快乐的世界在发出呼噜声。
        - id: ch02-b03
          speaker: narrator
          text: >-
            从前每一年，毛克利都喜欢季节变换。往往是他最先在草丛深处发现初开的春之眼，也是他最先看见天边堆起春云。那种云和丛林里其他时节的云全不相同。在繁花开放、星光映着湿气的各处，总能听到他的声音。他会帮大青蛙完成一轮轮合唱，也会模仿那些倒挂的小猫头鹰，取笑它们整夜不停的呜叫。和所有丛林众民一样，他最爱在春天远游。单为迎着暖风疾驰的快乐，他会从黄昏跑到晨星升起，一口气越过三十、四十甚至五十英里，再喘着气、大笑着回来，身上缠满陌生鲜花。四位兄弟不陪他这样绕遍丛林，只顾去和别的狼唱歌。春天里，众民忙着自己的事，有的哼哼，有的尖叫，有的吹哨。那时的声音和平日全不相同，所以春天才叫新语时节。
        - id: ch02-b04
          speaker: narrator
          text: >-
            可这一年，就像他对巴希拉说的，他的肚子变了。从竹笋生出褐色斑点起，他就天天盼着气味改变的那个清晨。清晨终于来了。孔雀莫尔披着青铜、湛蓝和黄金般的灿烂羽毛，在雾林里一路高声报信。毛克利张开嘴，想把呼号接过来传下去，话却卡在牙间。一股从未有过的感觉从脚趾一直升到发梢，那是纯粹的悲伤。它来得毫无理由，毛克利只好低头查看全身，确认自己没有踩中尖刺。莫尔呼喊着新生的气息，其他鸟儿依次接过呼号。温贡加河边的岩石间又传来巴希拉沙哑的啸叫，介乎鹰唳与马嘶之间。头顶新芽初生的枝条上，猴民一边乱叫，一边四散奔逃。毛克利却站在原地。胸膛本来吸满了气，正要回应莫尔，却被这份悲伤一点点挤空，只剩急促的喘息。
        - id: ch02-b05
          speaker: mor
          text: >-
            气味变了！小弟弟，祝你狩猎顺利！你的回答呢？
          emotion: happy
        - id: ch02-b06
          speakers: [chil, chil_mate]
          ensemble: duo
          text: >-
            小弟弟，祝你狩猎顺利！
          emotion: happy
        - id: ch02-b07
          speaker: narrator
          text: >-
            奇尔和伴侣一同俯冲下来，从毛克利鼻尖下扇翅而过，近得连白色细羽也掉了几片。一道半英里宽的象雨横扫丛林，留下湿漉漉点头的新叶，又消散在双重彩虹和轻雷中。春日的嗡鸣骤然响起，又归于沉寂。所有丛林众民仿佛同时开口，只有毛克利没有。
        - id: ch02-b08
          speaker: mowgli
          text: >-
            我吃的是好食物，喝的是好水。喉咙也没有像吃下蓝斑根时那样发烧变紧。可我的肚子沉，我还对巴希拉和自己的族人说了难听的话。如今一会儿热，一会儿冷，又会无缘无故对看不见的东西生气。该出去跑一场了！今晚我要翻过群山，一直跑到北方沼泽再回来。四位兄弟也得跟我走，他们都胖得像白蛆了。
        - id: ch02-b09
          speaker: narrator
          text: >-
            他发出呼唤，四位兄弟一个也没回答。他们早已跑出听力所及的地方，同狼群唱起春日的《月之歌》和《水鹿之歌》。春天里，丛林众民几乎不再区分白天黑夜。毛克利又发出尖利短促、如吠叫一般的信号，只换来斑点小树猫嘲弄似的叫声。那家伙正在枝条间钻进钻出，寻找早起鸟儿的巢。毛克利气得浑身发抖，短刀也拔出一半。随后他又摆出极其傲慢的模样，尽管周围根本没人看。他抬着下巴，压低眉头，一脸威严地走下山坡。可他的族人谁也没有问他一句，大家都只忙自己的事。
        - id: ch02-b10
          speaker: mowgli
          text: >-
            等德干红狗来了，或红花在竹林里起舞，整个丛林就会哭着求毛克利，用象一样伟大的称号叫他。如今春之眼才变红，莫尔又要在春舞里露两条光腿，大家就像塔巴吉一样发疯。凭买下我的公牛起誓，我到底是不是丛林之主？安静！你们两个在这里做什么？
          emotion: angry
        - id: ch02-b11
          speaker: narrator
          text: >-
            两头年轻的狼正沿小路慢跑，想找一块狼群看不见的空地打架。丛林法则不许狼当着全群争斗，所以它们要到别处去。两头狼的颈毛根根直立，硬得像铁丝。它们压低身体，狂怒吠叫，等着第一次扑击。毛克利纵身冲上去，一手抓住一只伸来的喉咙，想像平常嬉闹或集体狩猎时那样，把它们向后掀开。可他从未插手过春日的争斗。两头狼一齐向前猛扑，把他撞到一旁。它们连一句话也不浪费，立刻紧咬对方，在地上翻滚起来。
        - id: ch02-b12
          speaker: narrator
          text: >-
            毛克利几乎刚倒下便跳起，短刀出鞘，白牙尽露。那一刻，他仅仅因为两头狼在自己想要安静时偏要打架，就真想把它们都杀了，尽管法则给了每一头狼充分的争斗权。他压低肩膀，手掌微微发颤，绕着它们来回跃动。只等缠斗最初那阵狂乱过去，他便要左右同时出手。可就在等待中，力量仿佛一点点从身体里退去。刀尖垂落，他终于把短刀收回鞘中，只站在那里观看。
        - id: ch02-b13
          speaker: mowgli
          text: >-
            我一定吃了毒物。自从我用红花冲散议事会，又杀了谢尔汗，狼群里再没有谁能把我撞开。这两个不过是末尾的小猎手！我的力气已经离开，很快就要死了。毛克利，你为什么不杀掉它们？
          emotion: fearful
        - id: ch02-b14
          speaker: narrator
          text: >-
            两头狼一直打到一头逃走。毛克利独自留在撕裂染血的地面上，一会儿看刀，一会儿看自己的手脚。那陌生的悲伤盖过全身，像水淹过木头。
    - id: ch03
      title: 北方沼泽的春奔
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            傍晚，毛克利早早杀了猎物，只吃一点，好让自己轻快。他独自进食，因为众民全去歌唱或争斗了。那是一个完美的白夜，丛林里就是这样称呼的。所有绿色草木仿佛从清晨起已经长了一个月。昨日还挂黄叶的树枝，如今一折便滴出汁液。苔藓温暖厚实地卷过脚面，嫩草也不再带有割人的利边。整座丛林的声音融成一根低沉的竖琴弦，在月光下嗡嗡震响。那是新语之月。她把满满的清辉泼在岩石与水潭上，让光从树干和藤蔓之间滑过，再穿过百万片叶子，细细筛落下来。
        - id: ch03-b02
          speaker: narrator
          text: >-
            毛克利忘了悲伤，迈开步子时，纯粹因为快乐而放声歌唱。那与其说是奔跑，不如说是在飞。他选了一道漫长的下坡，穿过主丛林的心脏，一直通向北方沼泽。脚下富有弹性的土地吞没了落脚声。受过人类教养的人会在捉弄眼睛的月影中跌跌撞撞，小心择路，毛克利的肌肉却受过多年磨炼，轻若羽毛地托着他前进。腐木或暗藏的石块偶尔在脚下翻动，他不必费力，也不必思索，就能稳住身体，脚步丝毫不慢。地面跑腻了，他便像猴子一样扬手抓住最近的藤蔓，与其说在攀爬，不如说飘上细枝。接着沿树间道路前行，直到心意改变，又从枝头射下，划出一道长长的绿叶弧线，直落平地。
        - id: ch03-b03
          speaker: narrator
          text: >-
            他穿过静止闷热的洼地，周围全是潮湿岩石。夜花和藤芽上花朵的浓香压在空气里，叫人几乎无法呼吸。接着又穿过幽暗的林中长廊，月光像教堂走道上的方格大理石，一道道整齐地铺在地上。湿润的新生灌木齐胸高，伸出枝条搂住他的腰。乱石山顶下，小狐狸在巢里受惊。他从一块石头跃上另一块石头。远处传来野猪用獠牙磨树的声响。不久，他便撞见那头庞大的灰色畜生，独自在高树上刻划撕扯，口滴白沫，眼里燃着火光。他听见犄角相撞和嘶哑咕哝，又从两头暴怒的水鹿身边飞掠而过。它们低着头摇晃进退，身上一道道鲜血在月色里黑得发亮。他还在湍急浅滩听见鳄鱼贾卡拉如公牛般咆哮，又惊动一团交缠的毒民。可不等它们扑咬，他早已越过闪亮的砾石滩，重新深入丛林。
        - id: ch03-b04
          speaker: narrator
          text: >-
            他时而呼喊，时而自顾自歌唱，那一夜，整个丛林里没有谁比他更快活。直到花香提醒他，北方沼泽已经近了。那里远远越过他最远的猎场。受过人类教养的人，在沼泽里走不出三步便会没顶。毛克利的脚却长着眼睛，不用头上的双眼帮忙，就能从一簇草跃向另一簇，从一块颤动的浮地跃向下一块。他一路跑到沼泽中央，惊起许多水鸭，随后坐上一根浸在黑水里的树干。树干上覆满苔藓。春天里，鸟民睡得极浅，一队队鸟儿整夜来来往往，可谁也没理会毛克利。他独坐在高高的芦苇间，哼着没有词的歌，又查看坚硬的褐色脚底，怕自己漏掉哪根尖刺。悲伤仿佛已被远远甩在自己的丛林里。他刚要纵声歌唱，那感觉却又回来了，比先前强烈十倍。
        - id: ch03-b05
          speaker: mowgli
          text: >-
            它也在这里！它一路跟来了。可这里明明没有谁。
          emotion: fearful
        - id: ch03-b06
          speaker: narrator
          text: >-
            沼泽里的夜声依旧不断，却没有一只鸟、一头野兽回应毛克利。四周没有谁同他说话，他心里那股新生的痛苦便越来越重。
        - id: ch03-b07
          speaker: mowgli
          text: >-
            我一定不小心吃了毒物，力气才会离开。我害怕了，可害怕的又不是我。两头狼打架时，是毛克利害怕了。换成阿克拉，甚至帕奥，都能让它们安静，毛克利却怕了。这就是中毒的证据。可是丛林众民在乎什么？它们又唱又叫，又争斗，又成群结队在月下奔跑。我却要死在沼泽里，死于自己吃下的毒物。然后，它们会发现我躺在黑水中。不，我要回自己的丛林，死在议事岩上。要是我深爱的巴希拉没有正在山谷里尖叫，也许他会守一会儿我的残骸，不让奇尔像对待阿克拉那样对待我。
          emotion: sad
        - id: ch03-b08
          speaker: narrator
          text: >-
            一颗又大又热的泪珠落上膝头。毛克利明明痛苦极了，却因为自己如此痛苦而生出一种颠倒的快乐。他又说了一遍，奇尔会像对待阿克拉那样对待自己。随后安静片刻，想起温贡加河岸大战红狗的夜晚，也想起孤狼临终前的那些话。
        - id: ch03-b09
          speaker: mowgli
          text: >-
            阿克拉死前对我说了许多傻话。临死时，肚子总会改变。可不管怎样，我是丛林的人！
        - id: ch03-b10
          speaker: narrator
          text: >-
            想起温贡加河岸的战斗，他激动起来，把最后一句高声喊了出来。芦苇里一头野水牛母牛猛然屈膝起身，喷着鼻息。
        - id: ch03-b11
          speaker: buffalo_cow
          text: >-
            是人来了！
          emotion: fearful
        - id: ch03-b12
          speaker: mysa
          text: >-
            那不是人，只是西奥尼狼群那头没毛的狼。这样的夜里，他总会到处乱跑。
        - id: ch03-b13
          speaker: buffalo_cow
          text: >-
            我还以为是人。
        - id: ch03-b14
          speaker: mysa
          text: >-
            我说了不是。毛克利，有危险吗？
        - id: ch03-b15
          speaker: mowgli
          text: >-
            毛克利，有危险吗？迈萨只会想这件事。可毛克利夜夜在丛林里来回巡视，你们又什么时候在乎过？
          emotion: angry
        - id: ch03-b16
          speaker: buffalo_cow
          text: >-
            他叫得真响。
        - id: ch03-b17
          speaker: mysa
          text: >-
            拔起了草却不知怎么吃的家伙，向来就是这样乱叫。
        - id: ch03-b18
          speaker: narrator
          text: >-
            毛克利心里呻吟起来。换作去年雨季，只要迈萨说一半这样的话，他早把公牛刺出泥塘，拿灯心草做缰绳，骑着他穿过沼泽了。他伸手要折一根羽毛般的芦苇，却又叹着气收回手。迈萨不慌不忙地反刍。母牛低头吃草，长草在她嘴边不断发出撕裂声。毛克利不愿死在这里，更不愿叫与鳄鱼贾卡拉和野猪一个血统的迈萨看见。他要走出沼泽，看看还会遇上什么。这场春奔从来没有过，一阵热，一阵冷，身体和心都不听使唤。
        - id: ch03-b19
          speaker: mowgli
          text: >-
            我不要死在这里，让和贾卡拉、野猪同一血统的迈萨看见。走出沼泽，看看会遇上什么吧。我从没这样春奔过，身体又热又冷。起来，毛克利！
        - id: ch03-b20
          speaker: narrator
          text: >-
            他终究抵不住诱惑，悄悄穿过芦苇，用刀尖刺了迈萨一下。湿淋淋的巨牛像炮弹炸开，猛冲出泥塘。毛克利笑得坐倒在地。
        - id: ch03-b21
          speaker: mowgli
          text: >-
            迈萨，现在你可以告诉大家，西奥尼狼群那头没毛的狼也放牧过你！
          emotion: happy
        - id: ch03-b22
          speaker: mysa
          text: >-
            狼！就凭你？整个丛林都知道，你放牧的是家牛。你就是田边尘土里吆喝的人崽子，也配说自己属于丛林？哪个猎手会像蛇一样爬过水蛭堆，只为开一个满身泥巴的胡狼玩笑，当着我的母牛羞辱我？到硬地上来，我就……我就……
          emotion: angry
        - id: ch03-b23
          speaker: narrator
          text: >-
            迈萨在泥里连连跺脚，越说越暴怒。他指责毛克利不过是田地旁边那个放家牛的人崽子，还说没有真正的猎手会像蛇一样从水蛭堆里爬过来，只为开一个满身泥巴的胡狼玩笑，当着母牛羞辱他。他要毛克利到硬地上去，却气得连威胁也说不完整，嘴边只剩白沫。丛林里脾气最坏的家伙，他差不多能排第一。毛克利神色不变地看着他喷气咆哮。等泥浆落下的啪啪声稍弱，自己的话终于能让公牛听见，他才开口。
        - id: ch03-b24
          speaker: mowgli
          text: >-
            迈萨，沼泽边住的是哪一个人群？这片丛林我没来过。
        - id: ch03-b25
          speaker: mysa
          text: >-
            往北走！你开的是赤身放牛娃的玩笑。去问沼泽脚下村子里的人！
          emotion: angry
        - id: ch03-b26
          speaker: mowgli
          text: >-
            人群不爱听丛林故事。你皮上多一道少一道划痕，也不值得议事会专门讨论。不过我会去看看那个村子。对，我会去。现在安分一点，丛林之主可不是夜夜都来放牧你的。
        - id: ch03-b27
          speaker: narrator
          text: >-
            毛克利踏上沼泽边缘颤动的地面，知道迈萨绝不敢冲过那里。他一边跑，一边想着公牛的怒相发笑。方才那场恶作剧让他明白，自己的力气并没有完全消失。也许那份古怪的毒还没有侵进骨头。就在这时，他看见远处低低亮着一点星光。
        - id: ch03-b28
          speaker: mowgli
          text: >-
            我的力气没有完全消失，也许毒还没侵进骨头。那边低处有一颗星。让我从两手之间仔细看看。凭买下我的公牛起誓，那是红花！就是我从前曾躺在旁边的红花。那时，我甚至还没有来到第一个西奥尼狼群。如今既然已经看见，我就把这场奔跑跑完。
    - id: ch04
      title: 红花照亮的茅屋
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            沼泽终于到了尽头，前方铺开一片宽阔平原，一点灯火正在那里闪烁。毛克利已经很久不再过问人的事情。这一夜，红花的微光却吸引着他，一步一步把他向前引去。
        - id: ch04-b02
          speaker: mowgli
          text: >-
            我去看看，就像从前那样，看看人群改变了多少。
        - id: ch04-b03
          speaker: narrator
          text: >-
            他忘了这里不是自己的丛林，不能再随心所欲，便漫不经心地踩过沾满露水的草地，一直走到亮灯的茅屋前。这里已经是村庄边缘，三四条狗发现陌生气味，立刻狂吠起来。毛克利回以一声深沉的狼吼，野狗顿时闭嘴。他这才无声坐下。
        - id: ch04-b04
          speaker: mowgli
          text: >-
            该来的总会来。毛克利，人群的巢穴与你还有什么相干？
        - id: ch04-b05
          speaker: narrator
          text: >-
            他摸了摸自己的嘴，想起多年前另一个人群赶走他时，石头砸中的地方。茅屋门开了，一个女人站在门口，探头望进黑暗。屋里的孩子哭起来，她便回头安慰。
        - id: ch04-b06
          speaker: messua
          text: >-
            睡吧。只是一只胡狼惊动了狗。再过一会儿，天就亮了。
        - id: ch04-b07
          speaker: narrator
          text: >-
            草丛里的毛克利像发热病一样颤抖。他太熟悉这个声音了。为了确认，他轻轻呼唤，惊讶地发现人类的话如此自然地回到嘴边。
        - id: ch04-b08
          speaker: mowgli
          text: >-
            梅苏阿！喂，梅苏阿！
          emotion: surprised
        - id: ch04-b09
          speaker: messua
          text: >-
            谁在叫我？
          emotion: fearful
        - id: ch04-b10
          speaker: mowgli
          text: >-
            你忘了吗？
        - id: ch04-b11
          speaker: messua
          text: >-
            如果真是你，我从前给你取了什么名字？快说！
          emotion: fearful
        - id: ch04-b12
          speaker: mowgli
          text: >-
            纳图！喂，纳图！
        - id: ch04-b13
          speaker: narrator
          text: >-
            那正是毛克利第一次来到人群时，梅苏阿给他的名字。
        - id: ch04-b14
          speaker: messua
          text: >-
            进来吧，我的儿子。
        - id: ch04-b15
          speaker: narrator
          text: >-
            毛克利走进灯光，正面望着梅苏阿。这个女人曾善待他，很久以前，他也曾从人群手中救下她的性命。梅苏阿老了，头发白了，眼睛和声音却没有改变。像许多母亲一样，她以为离别的人还会停在自己上次见到的模样。可眼前已经不是那个孩子。她的目光从毛克利宽阔的胸前一路向上，越过肩头和长发，困惑地找到他碰着门楣的头。
        - id: ch04-b16
          speaker: messua
          text: >-
            我的儿子……可他已经不是我的儿子了。他是森林里的小神！阿嗨！
          emotion: surprised
        - id: ch04-b17
          speaker: narrator
          text: >-
            她跪倒在毛克利脚边。油灯红光里，毛克利强健、高大而美丽。乌黑长发披过肩头，短刀在颈下摇晃，头顶还戴着白茉莉编成的花环。谁看了，都很容易把他当成某则丛林传说里的野神。小床上半睡半醒的孩子猛然坐起，害怕得放声尖叫。梅苏阿转身安慰他。毛克利一动不动，向屋里望去。他看见水罐、炊具、粮箱，还有种种属于人类的物件。他惊讶地发现，自己还把它们记得十分清楚。
        - id: ch04-b18
          speaker: messua
          text: >-
            你想吃什么，喝什么？这里的一切都是你的，我们欠你两条命。可是，你真是我叫作纳图的孩子，还是一位小神？
        - id: ch04-b19
          speaker: mowgli
          text: >-
            我是纳图。我离自己的地方很远，看见这点灯光才走过来。我不知道你住在这里。
        - id: ch04-b20
          speaker: messua
          text: >-
            我们到了坎希瓦拉以后，英国人本来要帮我们惩办那些想烧死我们的村民。你还记得吗？
        - id: ch04-b21
          speaker: mowgli
          text: >-
            我当然没有忘。
        - id: ch04-b22
          speaker: messua
          text: >-
            可是英国人的律法准备好以后，我们回到那些恶人的村子，却再也找不到它了。
        - id: ch04-b23
          speaker: mowgli
          text: >-
            这件事我也记得。
        - id: ch04-b24
          speaker: messua
          text: >-
            所以我男人替人下地干活。他很强壮，后来我们终于有了这一小块地。这里不如从前的村子富足，不过我们两个人需要的也不多。
        - id: ch04-b25
          speaker: mowgli
          text: >-
            那一夜，那个害怕得在泥地里挖洞的男人呢？他在哪里？
        - id: ch04-b26
          speaker: messua
          text: >-
            他死了，已经一年了。
          emotion: sad
        - id: ch04-b27
          speaker: mowgli
          text: >-
            那这个孩子呢？
        - id: ch04-b28
          speaker: messua
          text: >-
            是我的儿子，两个雨季前出生。你若是小神，就赐他一份丛林的眷顾，让他在你的族人中平平安安，像那晚我们受到保护一样。
        - id: ch04-b29
          speaker: narrator
          text: >-
            她抱起孩子。孩子忘了害怕，伸手去玩毛克利胸前的短刀。毛克利极小心地把那些小手指挪开。
        - id: ch04-b30
          speaker: messua
          text: >-
            你若是被老虎叼走的纳图，他就是你的弟弟。请你像哥哥一样祝福他吧。
          emotion: sad
        - id: ch04-b31
          speaker: mowgli
          text: >-
            嗨——麦！我哪里懂什么祝福？我既不是小神，也不是他的哥哥。哦，妈妈，妈妈，我的心好沉。
          emotion: sad
        - id: ch04-b32
          speaker: narrator
          text: >-
            他放下孩子，浑身颤抖。梅苏阿忙着摆弄炊具。
        - id: ch04-b33
          speaker: messua
          text: >-
            多半是夜里跑沼泽惹来的。寒热一定浸进你的骨头了。我来生火，你喝些热牛奶。把茉莉花环摘掉吧，这么小的屋子，花香太浓。
        - id: ch04-b34
          speaker: narrator
          text: >-
            想到丛林里竟有什么东西能伤害自己，毛克利微微一笑。他坐下，把脸埋进双手，低声咕哝。种种从未体会过的古怪感受一阵阵涌遍全身，真像中了毒。他头晕，还有一点恶心，只能一大口一大口喝着热牛奶。梅苏阿不时拍拍他的肩。她不能确定眼前究竟是多年前的儿子纳图，还是某个神奇的丛林生灵。不过触手所及，至少是一个有血有肉的人。这一点已经叫她满心欢喜。
        - id: ch04-b35
          speaker: messua
          text: >-
            儿子，有没有谁告诉过你，你比世上所有男人都美？
          emotion: happy
        - id: ch04-b36
          speaker: mowgli
          text: >-
            哈？你刚才说什么？
          emotion: surprised
        - id: ch04-b37
          speaker: narrator
          text: >-
            毛克利从没听过这样的话。梅苏阿看见他的神情，轻轻笑了。
        - id: ch04-b38
          speaker: messua
          text: >-
            原来我是第一个？母亲本来就该把这些好话告诉儿子，虽说机会不常有。你真的很美，我从没见过像你这样美的男人。
          emotion: happy
        - id: ch04-b39
          speaker: narrator
          text: >-
            毛克利扭头想越过坚硬的肩膀看看自己。梅苏阿笑了许久，他不知道原因，也只得陪着笑。孩子在两人之间跑来跑去，也跟着笑。
        - id: ch04-b40
          speaker: messua
          text: >-
            不许取笑你哥哥。等你有他一半好看，我们就替你娶国王最小的女儿，让你骑大象。
          emotion: happy
        - id: ch04-b41
          speaker: narrator
          text: >-
            这番话毛克利三句里有一句听不懂。长途奔跑后，热牛奶渐渐起了作用。他蜷起身体，不出片刻便沉沉睡去。梅苏阿替他拨开眼前的头发，盖上一块布，心满意足。他依着丛林习性，一直睡过后半夜，又睡了整整一个白天。从不彻底沉睡的本能告诉他，这里没有危险。他终于醒来时，猛然一跃，震得茅屋都摇晃起来。原来盖在脸上的布害他梦见了陷阱。他就那样站在那里，一只手按住短刀，转动的眼睛里还压着沉沉睡意，却已经准备好应付任何争斗。
        - id: ch04-b42
          speaker: narrator
          text: >-
            梅苏阿笑着摆上晚饭。烟火烤出的几张粗饼、一些米饭，再加一块酸腌罗望子，刚好让毛克利垫垫肚子，撑到傍晚猎食。沼泽露水的气味飘进来，让他又饿又烦躁。他很想立刻出门，跑完自己的春奔，可孩子非要坐在他怀里，梅苏阿也坚持替他梳开那头泛着蓝光的乌黑长发。她一面梳，一面唱着傻乎乎的婴儿小调，时而叫毛克利儿子，时而求他分一点丛林的力量给孩子。
        - id: ch04-b43
          speaker: narrator
          text: >-
            茅屋门虽然关着，毛克利却听见熟悉的动静。他还没回头，已经知道门外是谁。梅苏阿惊恐地张开嘴。一只巨大的灰爪从门底慢慢伸进来，门外的灰弟低低哀鸣。声音被门板压得发闷，里面满是歉意、焦急和害怕。
        - id: ch04-b44
          speaker: mowgli
          text: >-
            出去等着！我叫你们时，你们不肯来。
          emotion: angry
        - id: ch04-b45
          speaker: narrator
          text: >-
            听见毛克利的命令，那只巨大的灰爪立刻从门底缩了回去。
        - id: ch04-b46
          speaker: messua
          text: >-
            别把你的……你的仆从带进来。我们一直同丛林相安无事。
          emotion: fearful
        - id: ch04-b47
          speaker: mowgli
          text: >-
            这里是和平的。想想去坎希瓦拉路上的那一夜，你前后都有几十位这样的族民。不过看来，即使在春天，丛林众民也不是什么都会忘。妈妈，我走了。
        - id: ch04-b48
          speaker: narrator
          text: >-
            梅苏阿谦卑退开，心里认定他是森林之神。可他的手才碰到门，母亲的天性便让她一次又一次抱住他的脖子。
        - id: ch04-b49
          speaker: messua
          text: >-
            回来！不管你是不是我的儿子，都要回来，因为我爱你。看，孩子也舍不得你。
          emotion: sad
        - id: ch04-b50
          speaker: narrator
          text: >-
            孩子也哭了，因为那个带着闪亮短刀的男人就要离开。
        - id: ch04-b51
          speaker: messua
          text: >-
            一定要再回来。无论白天黑夜，这扇门永远不会对你关闭。
          emotion: sad
        - id: ch04-b52
          speaker: narrator
          text: >-
            毛克利的喉头动了动，仿佛里面的筋被人拉扯。回答像是硬从嗓子里拽出来的。
        - id: ch04-b53
          speaker: mowgli
          text: >-
            我一定会回来。
          emotion: sad
    - id: ch05
      title: 灰弟的回答
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: >-
            毛克利推开门槛上那颗亲昵讨好的狼头。
        - id: ch05-b02
          speaker: mowgli
          text: >-
            灰弟，我正有句话要问你。我先前呼唤了那么久，你们四个为什么一个也不来？
        - id: ch05-b03
          speaker: gray_brother
          text: >-
            那么久？不过是昨天晚上。我，我们在丛林里唱新歌，因为现在是新语时节。你忘了吗？
        - id: ch05-b04
          speaker: mowgli
          text: >-
            对，对。
        - id: ch05-b05
          speaker: gray_brother
          text: >-
            歌一唱完，我马上追踪你。我离开其他同伴，沿着足迹一路急追。可是，小弟弟，你这是做了什么？竟同人群一起吃饭、一起睡觉？
        - id: ch05-b06
          speaker: mowgli
          text: >-
            要是我呼唤时你们肯来，这一切根本不会发生。
          emotion: angry
        - id: ch05-b07
          speaker: gray_brother
          text: >-
            现在又该怎么办？
        - id: ch05-b08
          speaker: narrator
          text: >-
            毛克利正要回答，一个穿白布衣裳的姑娘沿村边小路走来。灰弟立刻隐没，毛克利也无声退进长势高大的庄稼。他伸手几乎就能碰到姑娘，温暖青绿的茎秆却已在眼前合拢，让他像幽灵般消失。姑娘以为自己看见了精怪，先惊叫一声，随后又深深叹气。毛克利用双手分开茎秆，一直望着她，直到她走出视线。
        - id: ch05-b09
          speaker: mowgli
          text: >-
            现在我也不知道了。可我呼唤时，你们为什么不来？
          emotion: sad
        - id: ch05-b10
          speaker: gray_brother
          text: >-
            我们跟着你，一直跟着你。除了新语时节，我们永远跟着你。
        - id: ch05-b11
          speaker: mowgli
          text: >-
            那你们会跟我到人群那里吗？
        - id: ch05-b12
          speaker: gray_brother
          text: >-
            从前的狼群赶你出去那晚，我不是也跟了你吗？你躺在庄稼地里，又是谁把你叫醒？
        - id: ch05-b13
          speaker: mowgli
          text: >-
            是，可是以后呢？
        - id: ch05-b14
          speaker: gray_brother
          text: >-
            我今晚不是也跟了你吗？
        - id: ch05-b15
          speaker: mowgli
          text: >-
            是，可是再以后、再以后呢？也许还有许多个以后呢，灰弟？
        - id: ch05-b16
          speaker: narrator
          text: >-
            灰弟沉默着继续慢跑了一阵。再开口时，他低声对自己咆哮。
        - id: ch05-b17
          speaker: gray_brother
          text: >-
            黑家伙说得对。
        - id: ch05-b18
          speaker: mowgli
          text: >-
            他说什么？
        - id: ch05-b19
          speaker: gray_brother
          text: >-
            人终归人。我们的母亲罗刹也说过……
        - id: ch05-b20
          speaker: mowgli
          text: >-
            红狗来袭那晚，阿克拉也这样说过。
        - id: ch05-b21
          speaker: gray_brother
          text: >-
            比我们谁都聪明的卡阿也是这样说。
        - id: ch05-b22
          speaker: mowgli
          text: >-
            灰弟，你自己怎么说？
        - id: ch05-b23
          speaker: gray_brother
          text: >-
            人群曾用恶话赶你，用石头砸破你的嘴，派布尔迪奥杀你，还想把你丢进红花。是你说他们邪恶愚蠢，不是我。放丛林进去毁掉他们的是你，不是我，我只跟自己的族人走。编歌辱骂他们，而且唱得比反对红狗的战歌还尖刻的，也是你，不是我。
        - id: ch05-b24
          speaker: mowgli
          text: >-
            我问的是，你自己怎么说？
        - id: ch05-b25
          speaker: narrator
          text: >-
            他们边跑边谈。灰弟过了一阵才回答，仿佛每跃一步便说出几个字。
        - id: ch05-b26
          speaker: gray_brother
          text: >-
            人孩，丛林之主，罗刹的儿子，与我同巢的兄弟。尽管春天里，我有时会暂且忘记，可你的踪迹就是我的踪迹，你的巢穴就是我的巢穴，你的猎物就是我的猎物。你拼死一战，我也拼死一战。这些话，我也替另外三个说了。可是你要对丛林说什么？
        - id: ch05-b27
          speaker: mowgli
          text: >-
            你想得很好。从看见猎物到杀死猎物，中间不该耽搁。你先去把大家召到议事岩，我会说出肚子里的话。不过它们也许不会来。正逢新语时节，它们也许把我忘了。
        - id: ch05-b28
          speaker: gray_brother
          text: >-
            这么说，只有你什么都没忘？
        - id: ch05-b29
          speaker: narrator
          text: >-
            灰弟回头厉声说完，便伏低身体飞奔而去。毛克利一面思索，一面跟随。若在别的时节，这消息早已召来整个丛林。众民会颈毛直竖，一齐奔向议事岩。可眼下，它们正忙着追猎、争斗、杀戮和歌唱。灰弟从一个跑到另一个身边，反复传令。快乐而热切的众民听完，只说毛克利会在暑热到来时返回，雨季也会把他赶回巢穴。它们还招呼灰弟，不要再管这些话，快去同它们奔跑歌唱。
        - id: ch05-b30
          speaker: gray_brother
          text: >-
            丛林之主要回到人那里去了！都到议事岩来！
        - id: ch05-b31
          speaker: narrator
          text: >-
            快乐的众民只说，他会在暑天回来，雨季会把他赶回巢穴，还叫灰弟别再传信，快去同它们唱歌。
        - id: ch05-b32
          speaker: gray_brother
          text: >-
            可是丛林之主要回到人那里去了。
        - id: ch05-b33
          speaker: narrator
          text: >-
            众民只管反问，难道这样一来，新语时节就不甜美了吗？所以，毛克利心情沉重地穿过那些记忆深刻的岩石，回到自己当年被接纳进狼群的议事之地。他没有看到挤满岩石的丛林众民。来等他的只有四位兄弟、年老得几乎失明的巴鲁，还有沉重而冷血的卡阿。大蟒把庞大的身躯盘在阿克拉空下的位置周围。
    - id: ch06
      title: 新的踪迹
      blocks:
        - id: ch06-b01
          speaker: kaa
          text: >-
            人孩，你的踪迹走到这里便终结了吗？喊出你的呼号吧。你我同属一个血统，人和蛇在一起。
        - id: ch06-b02
          speaker: narrator
          text: >-
            毛克利扑倒在地，把脸深深埋进双手。
        - id: ch06-b03
          speaker: mowgli
          text: >-
            我为什么没有死在红狗爪下？我的力气已经离开了，可我中的不是毒。白天黑夜，我总听见自己的踪迹上有两重脚步。每次回头，那个人仿佛就在那一刻藏开。我绕到树后寻找，他却不在那里。我发出呼唤，无人回答，可总觉得有谁正在听，只把声音忍住。我躺下，得不到休息。出去春奔，心也静不下来。我洗过澡，身体还是凉不了。猎物让我恶心，可是不先杀戮，我又没有心思争斗。红花烧在我的身体里，骨头全化成了水。我连自己知道什么都不知道。
          emotion: sad
        - id: ch06-b04
          speaker: baloo
          text: >-
            还说什么呢？阿克拉在河边说过，毛克利会把毛克利赶回人群。我也说过。可是如今还有谁听巴鲁的话？巴希拉今晚在哪里？他也知道。这就是法则。
        - id: ch06-b05
          speaker: kaa
          text: >-
            人孩，我们在寒冷巢穴相遇时，我就知道了。人终归人，即使丛林并没有把他赶出去。
        - id: ch06-b06
          speaker: narrator
          text: >-
            四位兄弟先看看彼此，又一同看向毛克利。它们显得困惑，不懂为什么古老的朋友都在说同样的话，却仍旧服从丛林的法则。
        - id: ch06-b07
          speaker: mowgli
          text: >-
            这么说，丛林没有把我赶出去？
          emotion: surprised
        - id: ch06-b08
          speakers: [gray_brother, wolf_brother_two, wolf_brother_three, wolf_brother_four]
          ensemble: chorus
          text: >-
            只要我们还活着，谁也不敢把你赶出去！
          emotion: angry
        - id: ch06-b09
          speaker: narrator
          text: >-
            四兄弟愤怒地低吼起来，话还没说完，巴鲁便制止了它们。法则是他教给毛克利的，这一次也应当由他开口。
        - id: ch06-b10
          speaker: baloo
          text: >-
            法则是我教你的，该由我来说。如今我连面前的岩石都看不清，却能看得很远。小青蛙，去走自己的踪迹吧，到与你血脉相连的族群和子民中筑巢。可是，当你需要脚、牙齿、眼睛，或要谁在夜里迅速传一句话时，记住，丛林之主，只消你一声呼唤，丛林便属于你。
        - id: ch06-b11
          speaker: kaa
          text: >-
            中部丛林也属于你。我可不是替弱小之辈说话。
        - id: ch06-b12
          speaker: mowgli
          text: >-
            嗨——麦，我的兄弟们！我连自己知道什么都不知道。我不想走，可两只脚都被拉走了。我怎么舍得离开这些夜晚？
          emotion: sad
        - id: ch06-b13
          speaker: baloo
          text: >-
            抬起头来，小弟弟。这样的狩猎并不可耻。蜂蜜吃尽，我们便离开空巢。
          emotion: calm
        - id: ch06-b14
          speaker: kaa
          text: >-
            旧皮一旦褪下，便不能重新钻回去。这是法则。
        - id: ch06-b15
          speaker: baloo
          text: >-
            听着，我最亲爱的孩子。这里没有一句话、一个念头要拦住你。抬起头！谁有资格质问丛林之主？你还是小青蛙时，我看见你在那边的白石子间玩耍。拿一头刚杀的小公牛作价买下你的巴希拉也看见了。如今，那场受检礼只剩我们两个。你的巢母罗刹已经和巢父一同死去，老狼群也早已不在。谢尔汗去了哪里，你很清楚。阿克拉死在豺狗群中。若不是你的聪明和力量，第二个西奥尼狼群也会一同死在那里。留下的无非一堆老骨头。如今，不再是人孩请求狼群准许，而是丛林之主自己换了踪迹。人要走自己的路，谁能质问？
          emotion: calm
        - id: ch06-b16
          speaker: mowgli
          text: >-
            可是巴希拉，还有买下我的那头公牛，我不愿……
          emotion: sad
        - id: ch06-b17
          speaker: narrator
          text: >-
            山坡下突然传来一声咆哮，紧跟着又是灌木折断的巨响，毛克利的话被截住了。巴希拉站到他面前，仍旧像从前一样轻捷、强壮而可怕。他伸出一只鲜血淋漓的右爪。
        - id: ch06-b18
          speaker: bagheera
          text: >-
            所以我没有来。那是一场很长的追猎，不过他如今已经死在灌木里了。一头两岁的公牛，正是替你赎身的那头公牛，小弟弟。如今所有债都已经还清。至于其他的话，我和巴鲁说的一样。
        - id: ch06-b19
          speaker: narrator
          text: >-
            巴希拉伸出滴血的右爪，又舔了舔毛克利的脚。
        - id: ch06-b20
          speaker: bagheera
          text: >-
            记住，巴希拉爱过你！
          emotion: sad
        - id: ch06-b21
          speaker: narrator
          text: >-
            他纵身离去。到了山脚，又发出一声悠长响亮的呼喊。
        - id: ch06-b22
          speaker: bagheera
          text: >-
            踏上新的踪迹，祝你狩猎顺利，丛林之主！记住，巴希拉爱过你！
          emotion: sad
        - id: ch06-b23
          speaker: baloo
          text: >-
            你已经听见了。再没有别的话。去吧，不过先到我身边来。聪明的小青蛙，最后再到我这里来！
        - id: ch06-b24
          speaker: narrator
          text: >-
            毛克利来到失明老熊身旁，把头深深埋在巴鲁腰腹边，双臂紧紧抱住他的脖子。他一直哭，一直哭。年老的巴鲁已没有多少力气，只能笨拙地低下头，一次又一次想去舔毛克利的脚。
        - id: ch06-b25
          speaker: kaa
          text: >-
            褪下一身旧皮，可真难。
        - id: ch06-b26
          speaker: gray_brother
          text: >-
            星星已经淡了。我闻得到黎明的风。我们今天到哪里筑巢？从现在起，我们要追随新的踪迹了。
        - id: ch06-b27
          speaker: narrator
          text: >-
            毛克利的故事，到这里便全部讲完了。
