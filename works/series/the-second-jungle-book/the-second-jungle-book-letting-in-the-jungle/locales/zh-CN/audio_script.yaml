        delivery: 冲动凶狠，语气咄咄逼人
        timbre: 浑浊有力
        pace: 快
        pitch: 中低
  chapters:
    - id: ch01
      title: 回到狼群
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 花朵、藤蔓和野草啊，遮住他们，盖住他们，再筑起一道墙，把他们围起来。让那族类的形貌和声响从记忆里消失，也忘掉他们的气息和触感。祭坛石旁已经积起厚厚的黑灰，白足的雨也来到这里。母鹿在无人播种的田野生下幼崽，从此再没有谁去惊吓它们。盲眼的墙无声崩塌，倒在地上，从此也再没有谁住进城里。
        - id: ch01-b02
          speaker: narrator
          text: 毛克利把谢尔汗的虎皮钉上议事岩以后，曾告诉西奥尼狼群残存的成员，他往后要独自在丛林狩猎。可狼爸爸和狼妈妈的四个孩子都不肯离开，说愿意同他一起狩猎。旧日的生活没法一下子全改掉，在丛林里尤其如此。那群乱哄哄的狼夹着尾巴散去以后，毛克利先回到自家洞穴，倒头睡了整整一天一夜。
        - id: ch01-b03
          speaker: narrator
          text: 醒来以后，他把在人村遭遇的事挑着讲给狼爸爸和狼妈妈听，只说他们能明白的部分。他拿出剥皮刀，让清晨的阳光在刀口上跳动。正是这把刀剥下了谢尔汗的皮。狼爸爸和狼妈妈看过以后承认，小青蛙的确学会了些新本事。接着，阿克拉和灰兄弟也得说说自己的那一段，讲他们怎样把大群水牛赶进峡谷。巴鲁费了好大力气才爬上山，却坚持坐在那里，听完了全部经过。巴希拉听说毛克利这一仗打得漂亮，高兴得浑身发痒，不住拿爪子抓挠。
        - id: ch01-b04
          speaker: narrator
          text: 太阳已经升得很高，大家却还是毫无睡意。说话的时候，风一阵阵送来议事岩上那张虎皮的气味。每逢闻到它，狼妈妈便昂起头，深深吸上一口，心里十分痛快。
        - id: ch01-b05
          speaker: mowgli
          text: 要不是阿克拉和灰兄弟帮忙，我什么也做不成。妈妈，你真该看看那些黑色大公牛冲下峡谷！人朝我扔石头时，它们又是怎样挤过村门的！
        - id: ch01-b06
          speaker: mother_wolf
          text: 最后那一幕，我没看见反倒好。罗刹绝不会由着自己的孩子被人像赶豺狗那样赶来赶去。我一定叫他们付出代价。只有那个给过你奶喝的女人，我会留下她的命，只留她一个。
          emotion: angry
        - id: ch01-b07
          speaker: father_wolf
          text: 安静些，罗刹。我们的小青蛙已经回来了。如今他聪明得连亲爹都该去舔他的脚。脑袋多一道口子、少一道口子，有什么要紧？别管人群了。
        - id: ch01-b08
          speakers: [baloo, bagheera]
          ensemble: duo
          text: 别管人群了。
        - id: ch01-b09
          speaker: narrator
          text: 毛克利把头枕在狼妈妈身边，心满意足地笑了。他告诉伙伴，至于自己，这一生再也不愿看见人，不愿听见人的声音，也不愿闻到人的气味。
        - id: ch01-b10
          speaker: akela
          text: 可要是人不肯放过你呢，小兄弟？
        - id: ch01-b11
          speaker: gray_brother
          text: 我们一共有五个。
        - id: ch01-b12
          speaker: narrator
          text: 灰兄弟扫视众狼，说到“五个”时，牙齿猛地合拢。
        - id: ch01-b13
          speaker: bagheera
          text: 真要再狩猎一次，我们也能帮忙。不过阿克拉，眼下何必还想着那些人？
        - id: ch01-b14
          speaker: akela
          text: 因为我回村探过路。黄皮首领的皮挂上岩石以后，我沿旧路折回去，每一步都踩进原先的脚印。我又绕到旁边伏下身，把踪迹搅得乱七八糟，免得谁循着它们跟来。连我自己都快认不出脚印时，蝙蝠莽飞来捕虫，倒挂在我头顶。他告诉我，赶走人孩的村子正嗡嗡乱响，活像一窝被石头砸中的黄蜂。
        - id: ch01-b15
          speaker: mowgli
          text: 我扔进去的石头可真不小！
          emotion: happy
        - id: ch01-b16
          speaker: narrator
          text: 毛克利咯咯笑了。他从前常把熟透的木瓜扔进黄蜂窝，再转身飞跑，赶在蜂群追上以前跳进最近的水塘。每次玩这种把戏，都能叫他开心很久。
        - id: ch01-b17
          speaker: akela
          text: 我问莽究竟看见了什么。他说，村门口开着红花，一群人带着火枪，正围坐在火边。枪可不是拿来消遣的，这一点我知道，而且有足够的理由知道。用不了多久，小兄弟，就会有人顺着我们的踪迹追来。说不定，他现在已经追上来了。
        - id: ch01-b18
          speaker: narrator
          text: 阿克拉说话时低头看了看腰腹间干枯的旧伤疤。
        - id: ch01-b19
          speaker: mowgli
          text: 为什么还要追？他们已经把我赶出来，还想怎样？
          emotion: angry
        - id: ch01-b20
          speaker: akela
          text: 你是人，小兄弟。你的同类为什么那样做，我们这些自由猎手可说不明白。
        - id: ch01-b21
          speaker: narrator
          text: 剥皮刀一下扎进阿克拉脚边的泥土，他只来得及猛然缩回爪子。毛克利出手快得普通人的眼睛根本追不上，可阿克拉是一头狼。狼的反应比人眼更快。就连远离野狼祖先的狗，也能在睡梦中被车轮擦到腰侧时突然惊醒，赶在轮子真正压上来以前跃开，连一根毛都不受伤。
        - id: ch01-b22
          speaker: mowgli
          text: 下次说起人群和毛克利，分成两口气说。别把我们混在一起。
          emotion: calm
        - id: ch01-b23
          speaker: akela
          text: 呸，好锋利的牙！可你在人群里住了一阵，眼力已经退了。你刚才耽搁的工夫，够我咬死一头公鹿。
        - id: ch01-b24
          speaker: narrator
          text: 巴希拉忽然跃起，把头尽量昂到最高，鼻子迎向空气，全身的每一根线条都一下绷紧了。灰兄弟立刻照做，又往左挪了一点，好接住右边吹来的风。阿克拉则迎风跃出五十码，半伏在地，也定住不动。毛克利羡慕地看着他们。他的鼻子比大多数人灵得多，可还是比不了丛林鼻子那种一点就着的敏锐。人村的烟火又熏了他三个月，本领更退了不少。他把手指沾湿，擦过鼻尖，挺直身子，努力去接高处的气味。那里的气味虽然最淡，却也最真。
        - id: ch01-b25
          speaker: akela
          text: 人！
        - id: ch01-b26
          speaker: mowgli
          text: 是布尔迪奥！他在追我们。那边阳光照到他的枪了，快看！
        - id: ch01-b27
          speaker: narrator
          text: 那支老式火枪的黄铜箍只闪了一下，短得不过一瞬。丛林里偶尔会有东西这样发光。天上若有云影飞驰，云缝里的日光会让一片云母、一汪水洼，甚至一片磨亮的叶子突然闪起来，像是在发信号。可这一天，天空没有一片云，空气也静止不动，所以那道亮光只能来自布尔迪奥的枪。
        - id: ch01-b28
          speaker: akela
          text: 我就知道有人会追来。我到底带领过狼群，这点本事没有白学。
        - id: ch01-b29
          speaker: narrator
          text: 四头年轻的狼贴地奔下山坡，钻进荆棘，转眼便像鼹鼠进草地一样消失。
        - id: ch01-b30
          speaker: mowgli
          text: 一句话不说，你们要去哪里？
        - id: ch01-b31
          speaker: gray_brother
          text: 嘘！正午以前，我们把他的脑袋滚到这里来！
        - id: ch01-b32
          speaker: mowgli
          text: 回来，回来等着！人不能吃人！
        - id: ch01-b33
          speaker: akela
          text: 刚才是谁说自己是狼？我只猜他也许是人，谁又拿刀扎我？
        - id: ch01-b34
          speaker: narrator
          text: 四头狼不情愿地折回来，垂着脑袋跟在后面。
        - id: ch01-b35
          speaker: mowgli
          text: 难道我每做一个决定，都得向你们解释？
          emotion: angry
        - id: ch01-b36
          speaker: bagheera
          text: 听听，这就是人说话的口气！乌代浦尔王宫兽笼旁的人也是这样。丛林里的动物都说，人是万物中最聪明的。可要相信自己的耳朵，我们准会把他当成万物中最愚蠢的。不过这一次，人孩说得对。人向来成群狩猎，没弄清其他人会怎样行动，就抢先杀掉一个，这可不是好猎法。走吧，我们去瞧瞧这个人究竟打算怎样对付我们。
        - id: ch01-b37
          speaker: gray_brother
          text: 我们不去。小兄弟，你自己打猎吧。我们很清楚自己要什么。现在那颗脑袋本来已经送到了。
        - id: ch01-b38
          speaker: narrator
          text: 毛克利望向这个，又望向那个，胸口急促起伏，眼睛里满是泪水。他大步走到四头狼面前，单膝跪在它们正中。
        - id: ch01-b39
          speaker: mowgli
          text: 难道我不知道自己要什么？看着我！
        - id: ch01-b40
          speaker: narrator
          text: 狼兄弟不安地迎上他的目光。谁只要稍稍把眼睛移开，毛克利便立刻把他叫回来。他就这样一直盯着，一次也不放松，直到四头狼浑身的毛全都竖起，四条腿也不由自主地发抖。
        - id: ch01-b41
          speaker: mowgli
          text: 现在，我们五个里面谁是首领？
        - id: ch01-b42
          speaker: gray_brother
          text: 你是首领，小兄弟。
        - id: ch01-b43
          speaker: narrator
          text: 灰兄弟舔了舔毛克利的脚。
        - id: ch01-b44
          speaker: mowgli
          text: 那就跟上。
        - id: ch01-b45
          speaker: narrator
          text: 四头狼夹起尾巴，紧跟在他脚后。
        - id: ch01-b46
          speaker: bagheera
          text: 这就是跟人群生活的结果。巴鲁，如今丛林里除了丛林法则，又多出了一样东西。
        - id: ch01-b47
          speaker: narrator
          text: 巴鲁没有回答，心里却想了许多。毛克利无声地横穿丛林，走的路线同布尔迪奥正好成直角。他拨开一片矮树，看见老人肩上扛着火枪，正沿他们昨夜留下的足迹一路小跑着追来。
    - id: ch02
      title: 猎人的故事
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 毛克利离村时背着沉重的新鲜虎皮，阿克拉和灰兄弟跟在后面，三道脚印都很清楚。布尔迪奥来到阿克拉折返并搅乱足迹的地方，只好坐下来，又咳又哼。他围着原地绕小圈，一点点找路。暗中看他的人离得很近，近得扔块石头就能砸中他。狼若不愿被听见，世上再没有更安静的生灵。毛克利在狼眼里虽然动作笨拙，也能像影子一样移动。他们围着老人绕圈，就像海豚围着一艘全速前进的船，还若无其事地彼此交谈。那些声音的最低处，人耳听不见。再往高处，是蝙蝠莽的尖叫，许多人同样听不见。再高上去，才接着鸟、蝙蝠和昆虫的语言。
        - id: ch02-b02
          speaker: gray_brother
          text: 这比猎杀有趣多了。他活像一头在河边丛林迷路的猪。他嘴里在嘟囔什么？
        - id: ch02-b03
          speaker: mowgli
          text: 他说有一群狼围着他跳过舞，说一辈子没见过这么乱的脚印，还说自己累坏了。
        - id: ch02-b04
          speaker: bagheera
          text: 等他重新找回路，早就歇够了。瞧，那瘦东西现在又在干什么？
        - id: ch02-b05
          speaker: mowgli
          text: 不是吃，就是从嘴里冒烟。人总喜欢拿自己的嘴变花样。
        - id: ch02-b06
          speaker: narrator
          text: 老人慢吞吞地装好水烟，点起烟草，一口接一口地抽起来。悄无声息的跟踪者守在旁边，把那种烟草的气味牢牢记住。往后哪怕在最黑的夜里需要寻找布尔迪奥，它们也绝不会认错。
        - id: ch02-b07
          speaker: narrator
          text: 几个烧炭人从小路走来。方圆二十英里，人人都听过这位猎人的名号，他们自然停下来，坐在他身边一同抽烟。巴希拉和伙伴们也悄悄靠近旁听。布尔迪奥从头讲起魔孩毛克利的故事，可故事里塞满了他刚刚编出的谎话。他说谢尔汗其实是自己杀的。毛克利先变成狼，同他打了整整一个下午，后来又变回男孩，对他的火枪施了妖法。他开枪时，子弹竟然拐弯打死了自己的一头水牛。村民知道他是西奥尼最勇敢的猎人，这才派他出来除掉魔孩。
        - id: ch02-b08
          speaker: buldeo
          text: 村里已经抓住美苏亚和她丈夫。他们准是魔孩的父母。大家堵住屋门，等会儿就逼他们招认自己是巫师，再把他们活活烧掉。
        - id: ch02-b09
          speaker: charcoal_burner
          text: 什么时候烧？
        - id: ch02-b10
          speaker: buldeo
          text: 得等我回去。我先杀掉丛林男孩，村里再处置那两个巫师，把他们的土地和水牛分掉。他家的水牛可有几头特别壮。敢收留狼孩的人，正是最坏的巫师。
        - id: ch02-b11
          speaker: charcoal_burner
          text: 可英国人听说以后怎么办？听说他们疯得很，连本分农民安安静静杀几个巫师也要阻拦。
        - id: ch02-b12
          speaker: buldeo
          text: 村长只要说他们被蛇咬死就行。事情全安排好了，只差杀死狼孩。你们可曾见过这种怪物？
        - id: ch02-b13
          speaker: narrator
          text: 烧炭人小心地望了望四周，说老天保佑，自己从没见过这种怪物。要是真有人能找到狼孩，当然只能是布尔迪奥。太阳慢慢西斜，他们想继续赶路，到村里亲眼看看那个邪恶女巫。布尔迪奥却摆出一副保护人的样子，说杀掉魔孩虽然是自己的职责，他也绝不能让一群手无寸铁的人独自穿过丛林。他要一路护送大家。狼妖随时可能冒出来，要是真敢露面，他正好可以让众人看看，西奥尼最好的猎人怎样对付这种东西。再说，婆罗门给过他一道护符，准能挡住怪物，保住大家。
        - id: ch02-b14
          speakers: [gray_brother, wolf_brother_2, wolf_brother_3, wolf_brother_4]
          ensemble: chorus
          text: 他在说什么？快告诉我们，他又说什么？
        - id: ch02-b15
          speaker: narrator
          text: 狼兄弟隔上几分钟便要追问一次，毛克利也一直把听见的话翻给它们。可是讲到巫术那一段，他自己也弄不明白，只能告诉伙伴，那对曾经善待过自己的人，如今掉进了人设下的陷阱。
        - id: ch02-b16
          speaker: bagheera
          text: 人也会设陷阱捉人吗？
        - id: ch02-b17
          speaker: mowgli
          text: 他就是这么说的。我听不懂那些巫术，可这些人准是一起疯了。美苏亚和她男人同我有什么关系，他们凭什么掉进陷阱？那些红花又是怎么回事？这件事我一定得管。不论他们想把美苏亚怎么样，都得等布尔迪奥回去以后才动手。
        - id: ch02-b18
          speaker: narrator
          text: 布尔迪奥和烧炭人排成一列，威风凛凛地走远了。毛克利却留在原地苦苦思索，手指在剥皮刀的刀柄上来回摩挲。
        - id: ch02-b19
          speaker: mowgli
          text: 我要尽快赶回人村。
        - id: ch02-b20
          speaker: gray_brother
          text: 那几个人怎么办？
        - id: ch02-b21
          speaker: mowgli
          text: 一路唱歌送他们回家。天黑以前，我不想让他们到村门口。你们拦得住吧？
        - id: ch02-b22
          speaker: gray_brother
          text: 只要我还懂人，就能叫他们兜着圈子走，像拴在木桩上的山羊。
        - id: ch02-b23
          speaker: mowgli
          text: 不必那样，只唱几句，免得他们寂寞。歌别太甜。巴希拉也去帮忙。等天全黑了，到村边同我会合，灰兄弟认得地方。
        - id: ch02-b24
          speaker: bagheera
          text: 替一个人孩办事，可真不是轻松的狩猎。我究竟什么时候才能睡觉？居然要我唱给一群光皮人听！也罢，我们就试试看。
        - id: ch02-b25
          speaker: narrator
          text: 巴希拉低下头，好让声音传得更远，拖出一声长长的“祝你猎运亨通”。那本来是半夜的呼唤，如今偏在下午响起，光是开头便足以叫人胆寒。毛克利穿过丛林飞奔，听见声音在身后滚动，一会儿升高，一会儿落低，最后化成可怕的哀号。他忍不住暗自发笑。烧炭人已经紧紧挤成一团，老布尔迪奥举着枪，枪管像一片香蕉叶，朝东南西北胡乱摇摆。
        - id: ch02-b26
          speaker: gray_brother
          text: 呀——啦——咿！呀啦哈！
        - id: ch02-b27
          speaker: narrator
          text: 那是狼群驱赶公鹿和蓝牛时的叫声。它仿佛从大地尽头传来，一路越来越近，最后猛然断在一声尖啸里。另外三头狼一同回应，连毛克利听了都几乎要相信，后面正有整群狼在追猎。接着，它们唱起雄壮的丛林晨歌。四头狼把浑厚嗓音里会使的转折和花腔全用上了，还狠狠咬住每个字，唱得满是尖刻的嘲弄。
        - id: ch02-b28
          speakers: [gray_brother, wolf_brother_2, wolf_brother_3, wolf_brother_4]
          ensemble: chorus
          text: 片刻以前，我们的影子还没有投上平原，如今它又黑又清，随着我们的脚步奔回家园。清晨里，岩石和树丛都显得坚硬、高耸又赤裸。愿所有遵守丛林法则的生灵都安睡好梦！兽角和毛皮，我们的族类，全都藏进密林安居。丛林的领主伏低身子，悄悄滑向洞穴和山谷。人的耕牛孤零零地拖着新套上的犁，赤裸又可怕的黎明升过发亮的水塘。嗬，快回巢穴！太阳正在燃烧，从呼吸的草后越升越高。嫩竹咔嚓作响，林间传遍低低的警告。野鸭从天空向下呼喊，白日，白日属于人！浸透毛皮、洗过小径的露珠已经晒干，饮水处泥泞的岸也渐渐结硬。叛徒黑夜交出所有痕迹，伸开的爪、张开的爪，再也没有地方藏躲。听吧，愿所有遵守丛林法则的生灵都安睡好梦！
        - id: ch02-b29
          speaker: narrator
          text: 任何翻译都传不出那歌声真正的力量，也传不出四头狼一字一字唱出的讥嘲。它们听见树枝折断，知道人们正慌忙往树上爬，布尔迪奥也开始一遍遍念咒语和护符。等这场消遣结束，狼群便躺下睡觉。靠自己本领谋生的生灵做事都有章法，因为缺了睡眠，谁也干不好活。
        - id: ch02-b30
          speaker: narrator
          text: 与此同时，毛克利把一英里又一英里甩在身后，每小时足足奔出九英里。在人群里憋屈了好几个月，他的身体居然仍旧这样强健，这叫他跑得满心欢喜。脑子里只有一个念头，不管美苏亚和她丈夫落进了什么陷阱，他都要把他们救出来。毛克利生来便不相信陷阱。至于整个村庄欠下的债，他已经答应自己，可以留到以后慢慢偿还。
    - id: ch03
      title: 逃出人村
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 暮色降临时，毛克利看见了熟悉的牧场，也看见那棵达克树。杀死谢尔汗的早晨，灰兄弟曾在那里等他。他恨人群，也恨他们聚居的村庄，可村中屋顶一入眼，喉头还是猛地涌起什么，叫他一下屏住呼吸。他留意到，人们比往日更早离开田地，却没有一家生火做饭。所有人都聚在村中的大树下面，吵吵嚷嚷，叫个不停。
        - id: ch03-b02
          speaker: mowgli
          text: 人非得给人设下陷阱，心里才会满意。昨夜轮到毛克利，可那一夜现在想来，已经像隔了许多个雨季。今晚轮到美苏亚和她的男人。等到明天，再往后的许多个夜晚，又该轮到毛克利了。
        - id: ch03-b03
          speaker: narrator
          text: 他贴着外墙爬到美苏亚的小屋，从窗口望进去。美苏亚躺在地上，嘴被堵住，手脚捆得结结实实。她呼吸粗重，不住低声呻吟。丈夫则被绑在一张漆得花花绿绿的床架上。临街的门锁得死死的，外面还有三四个人背靠门板坐着。毛克利很熟悉村民的习惯。他们只要还有东西吃，还有话说，还有烟抽，就不会起身办别的事。可是等他们填饱肚子，危险便来了，布尔迪奥也快要回来。毛克利从窗口钻进去，俯身割断两人身上的绳索，拔掉堵嘴的东西，又在屋里四处找牛奶。
        - id: ch03-b04
          speaker: narrator
          text: 美苏亚整整一上午都在挨打，还受人投石。她又痛又怕，几乎失去神志。毛克利及时捂住她的嘴，才没让她惊叫出声。她丈夫倒没有那样害怕，只是既迷惑又愤怒。他坐起身来，从被人扯乱的胡须里一点点挑出灰土和杂物。
        - id: ch03-b05
          speaker: messua
          text: 我知道，我就知道你一定会来。现在我真的明白了，你就是我的儿子！
          emotion: happy
        - id: ch03-b06
          speaker: narrator
          text: 她紧紧抱住毛克利。男孩原本一直镇定，这时却忽然全身发抖，连自己也吃了一惊。
        - id: ch03-b07
          speaker: mowgli
          text: 这些绳子是怎么回事？他们为什么捆你们？
        - id: ch03-b08
          speaker: messua_husband
          text: 因为我们把你当儿子，他们便要处死我们。看，我还流着血。
        - id: ch03-b09
          speaker: narrator
          text: 美苏亚没有说话。毛克利也不去看男人的伤，只盯着她身上的伤口。他看见那些血痕，牙齿便咬得咯咯作响，屋里的两个人都听见了。
        - id: ch03-b10
          speaker: mowgli
          text: 谁干的？这笔账一定要还。
        - id: ch03-b11
          speaker: messua_husband
          text: 全村人。我太有钱，牲畜也太多。只因收留过你，我们就成了巫师。
        - id: ch03-b12
          speaker: messua
          text: 纳图，我给过你奶喝，你还记得吗？我以为你就是那个被老虎叼走的儿子，因为我真的那样疼爱你。他们便说我是你的母亲，是一个魔鬼的母亲，所以应该去死。
        - id: ch03-b13
          speaker: mowgli
          text: 魔鬼是什么？死，我倒见过。
        - id: ch03-b14
          speaker: messua
          text: 你看，我早说过他不是巫师。他是我的儿子，我的儿子！
        - id: ch03-b15
          speaker: messua_husband
          text: 是儿子还是巫师又能怎样？我们已经跟死人一样了。
        - id: ch03-b16
          speaker: mowgli
          text: 窗外就是丛林。手脚已经自由，现在就走。
        - id: ch03-b17
          speaker: narrator
          text: 美苏亚迟疑起来。她不像毛克利那样熟悉丛林，怕自己根本走不了多远。她丈夫又说，村里的男女一定会从后面追来，把他们拖回去。毛克利用刀尖轻轻搔着掌心。他说自己眼下还不想伤害村里任何人，可他们绝拦不住这对夫妇。再过一会儿，那些人就会有许多别的事要操心。就在这时，外面传来一阵叫喊和杂乱脚步。毛克利抬头听了听，知道布尔迪奥终于被放回来了，而老人准会带回一段精彩的故事。
        - id: ch03-b18
          speaker: messua
          text: 今早他们派他去杀你！你碰上他了吗？
          emotion: fearful
        - id: ch03-b19
          speaker: mowgli
          text: 碰上了。他装着一肚子故事，讲故事的工夫足够办许多事。你们先想好去哪里，我去听听他们的打算。
        - id: ch03-b20
          speaker: narrator
          text: 毛克利溜到菩提树附近，躲在能听见人声的地方。布尔迪奥躺在地上，又咳又哼，人人都围着他追问。他头发散在肩头，手脚全被爬树磨破，几乎说不出完整的话。可他很清楚自己此刻有多么重要。隔一会儿，他便断断续续吐出几句魔鬼、会唱歌的魔鬼和妖法，再停下来要水喝，让众人先尝尝后面故事的滋味。
        - id: ch03-b21
          speaker: mowgli
          text: 呸，尽管叽叽喳喳吧！说呀，快说呀！人和班德尔—洛格果然是血亲兄弟。他先得拿水洗嘴，再从嘴里吐烟，等这些都做完，才肯讲故事。只要布尔迪奥的故事还没有塞满他们的耳朵，他们就不会留下人去看守美苏亚。可我还站在这里等，我也快变得同他们一样懒了。
        - id: ch03-b22
          speaker: narrator
          text: 他抖了抖身体，悄无声息地溜回小屋。刚到窗边，脚上忽然有一个熟悉的鼻吻轻轻碰了一下。那种触碰他再熟悉不过。
        - id: ch03-b23
          speaker: mowgli
          text: 妈妈，你怎么来了？
        - id: ch03-b24
          speaker: mother_wolf
          text: 我听见孩子们唱歌，就跟着最疼爱的那个过来。小青蛙，我想看看给过你奶喝的女人。
        - id: ch03-b25
          speaker: mowgli
          text: 他们捆住她，要杀她。我割断了绳子，她要和丈夫穿过丛林。
        - id: ch03-b26
          speaker: mother_wolf
          text: 我跟他们去。我虽然老了，牙齿还在。
        - id: ch03-b27
          speaker: narrator
          text: 狼妈妈直立起来，朝窗口里黑暗的小屋望了一会儿，看看那位后来给过毛克利奶喝的女人。片刻后，她又无声地落回地面。
        - id: ch03-b28
          speaker: mother_wolf
          text: 最早喂你奶的是我。不过巴希拉说得对，人到最后总会回到人那里。
        - id: ch03-b29
          speaker: mowgli
          text: 也许吧。可今晚我离那条路还远。妈妈，我从来没有怕过你。你先在这里等着，藏好别叫她看见。
        - id: ch03-b30
          speaker: narrator
          text: 毛克利又从窗口荡进屋里，快活地告诉两人，村民全都围着布尔迪奥，听他讲那些根本没有发生过的事。等故事讲完，他们就会带着红花，也就是带着火，来到这里把两人一同烧死。现在必须决定下一步怎么办。美苏亚说，她已经和丈夫商量过了。三十英里外就是坎希瓦拉，到了那里也许能找到英国人。毛克利问那些英国人属于哪一群，美苏亚却说自己也不知道。她只听说那些白人统治整片土地，不许人没有见证便互相焚烧、殴打。今晚能赶到那里，两人便活。赶不到，便只有死。
        - id: ch03-b31
          speaker: mowgli
          text: 那就活下去。今晚谁也走不出村门。你丈夫在挖什么？
        - id: ch03-b32
          speaker: messua
          text: 是我们的一点钱，别的都带不走。
        - id: ch03-b33
          speaker: mowgli
          text: 原来是那种在手里传来传去，却永远捂不热的东西。离开这里也要用它吗？
        - id: ch03-b34
          speaker: messua_husband
          text: 有钱才能买马。我们伤得太重，走不远。不到一小时，全村就会追上来。
        - id: ch03-b35
          speaker: narrator
          text: 男人跪在屋角，用手刨开泥土，把藏着的一点钱取出来。美苏亚解释说，除了这些，别的东西都带不走。毛克利认出那是在人手之间传来传去、却永远也捂不热的东西，不明白离开村子为什么还需要它。男人恼火地看着他，低声说他只是个傻子，并不是魔鬼。随后，他把最后几枚卢比系进腰布，说有了钱才能买马。两人挨打太重，根本走不了远路，不到一个钟头，全村人便会追上来。毛克利再次保证，只要自己不愿意，谁也追不上他们，还说买马确实是个好主意，因为美苏亚已经累坏了。他扶着她爬出窗户。凉爽的夜气让她恢复了些精神，可星光下的丛林依然又黑又可怕。毛克利低声问他们是否认识去坎希瓦拉的路，两人都点了点头。
        - id: ch03-b36
          speaker: mowgli
          text: 别害怕，也不用赶。丛林里前后也许会有一点歌声。
        - id: ch03-b37
          speaker: messua_husband
          text: 若不是怕被烧死，我们怎会夜闯丛林？被野兽吃掉，也强过死在人手里。
        - id: ch03-b38
          speaker: mowgli
          text: 听清楚，丛林里不会有一颗牙向你们龇起，也不会有一只脚抬起来伤你们。无论人还是野兽，都不能阻拦你们，一直到你们亲眼看见坎希瓦拉。一路上都会有人保护。美苏亚，你丈夫不相信我的话，可你相信吗？
        - id: ch03-b39
          speaker: messua
          text: 我当然信，我的儿子。不管你是人，是鬼，还是丛林里的狼，我都信。
        - id: ch03-b40
          speaker: narrator
          text: 美苏亚哭着伏到毛克利脚边。男孩打了个寒战，赶紧把她扶起来。她又抱住他的脖子，把自己能想到的祝福全都给了他。她丈夫却依依不舍地望着自家田地，发誓只要到了坎希瓦拉，能让英国人听见自己的话，便要控告婆罗门、布尔迪奥和其他所有人。他要让这场官司把村子啃得只剩骨头，还要大家为自己没能种下的庄稼和没能喂养的水牛赔上双份，给他一个大大的公道。
        - id: ch03-b41
          speaker: mowgli
          text: 我不懂公道是什么。不过等下个雨季，再回来看看这里剩下什么吧。
        - id: ch03-b42
          speaker: narrator
          text: 两人朝丛林走去，狼妈妈从藏身处跃了出来。毛克利让她跟上去，还要她把禁令传遍丛林，告诉所有生灵，这两个人谁也不能碰。为了把巴希拉也唤到身边，他还叫狼妈妈稍微发出一点声音。随后，一声低沉绵长的狼嗥起伏着传开。美苏亚的丈夫猛然缩起身子回头，像是又想逃回小屋。
        - id: ch03-b43
          speaker: mowgli
          text: 往前走！我说过会有歌声。这道呼唤会跟你们到坎希瓦拉，是丛林给的保护。
        - id: ch03-b44
          speaker: narrator
          text: 黑暗合拢，把夫妇和狼妈妈一同吞没。巴希拉几乎贴着毛克利的脚冒出来，夜里的气味让他兴奋得浑身发抖。他先嫌狼兄弟叫自己丢脸，又吹嘘自己一路唱遍丛林，活像春天出去求偶，把布尔迪奥一行赶上了树。听说毛克利不准任何人离村，他说根本用不着四头狼，自己一个便守得住。他问毛克利，终于可以杀了吗。方才又唱歌，又看人惊慌爬树，他早已按捺不住。歌声和追逐唤醒了他血里的狂热。他两脚不停换动，眼里烧起红光，喉咙中的低吼越滚越响。他说，人根本不值得放在心上，不过是赤裸的褐色掘土虫，无毛无牙，只会吃泥。他整整一天都在白亮亮的阳光下追赶那些人，像狼群追赶公鹿一样。说着，他像小猫扑枯叶那样跃到空中，左右挥爪，爪下的空气嗡嗡作响。他无声落地，又接连跃起，半咕噜半咆哮的声音越来越响。他吼着自己的名字，说自己身在丛林，身在黑夜，浑身都是力量。没有谁挡得住他的一击，只要一掌，他便能把人孩的脑袋拍扁，像夏天晒死的青蛙。
        - id: ch03-b45
          speaker: mowgli
          text: 那就打吧！
        - id: ch03-b46
          speaker: narrator
          text: 毛克利用村民的语言说出这句话，而不是丛林话。人的词语叫巴希拉猛然停下，向后一坐，颤抖的后腿撑住身体，头恰好同毛克利一般高。男孩像方才盯住反叛狼崽那样，直直望进那双绿宝石似的眼睛。眼底红光一点点熄灭，像远方的灯突然闭上。黑豹的目光低垂，硕大的头也越垂越低，最后只有粗糙的红舌舔过毛克利的脚背。
        - id: ch03-b47
          speaker: mowgli
          text: 兄弟，安静些。是夜晚的错，不是你的错。
          emotion: calm
        - id: ch03-b48
          speaker: bagheera
          text: 是夜里的气味。四周的空气一直朝我大声呼喊。可你怎么会明白呢？你属于丛林，又不属于丛林，我却只是一头黑豹。可是我爱你，小兄弟。
        - id: ch03-b49
          speaker: narrator
          text: 毛克利又安抚了黑豹一会儿。巴希拉终于像炉火前的猫一样卧下，爪子收在胸前，眼睛也半闭起来。毛克利说，树下的人谈得实在太久了。他们很快就会来把美苏亚夫妇拖出陷阱，扔进红花，却不知道陷阱已经空了。巴希拉说自己血里的狂热已经退去，可以滑进小屋，让那群人在里面发现自己。见过他以后，没几个人还敢走出家门。毛克利答应了，却叮嘱他机灵一些。黑豹嫌屋里全是人的臭味，好在那张彩漆床同乌代浦尔王宫兽笼里的床很像。他爬上去躺好，床绳被沉重的身体压得嘎嘎作响。他还邀毛克利坐到身边，一同祝村民猎运亨通。毛克利拒绝了，因为他不愿让人群知道，这场消遣里也有自己的一份。很快，菩提树下的议论炸成疯狂的呼喊。男女老少举着棍棒、竹竿、镰刀、短刀和火把冲来，布尔迪奥和婆罗门走在最前，暴民跟在后面，叫嚷着要烫打巫师，再连人带屋一起烧掉。
        - id: ch03-b50
          speakers: [villager_1, villager_2, villager_3]
          ensemble: chorus
          text: 女巫！男巫！拿烧红的钱币烫他们！先打，再烧！把火把拿来！
          emotion: angry
        - id: ch03-b51
          speaker: narrator
          text: 门闩很结实，人群费了不少工夫，最后索性把整扇门都撕下来。火光涌进屋，却只见巴希拉舒展全身躺在床上，两只前爪交叠着，悠闲地垂在床尾。黑豹像深渊一样黑，也像恶魔一样可怕。最前面的人拼命抓扯着向后退，屋里足足静了半分钟。巴希拉这才抬起头，慢慢打了一个讲究而招摇的呵欠，正像他想羞辱一个旗鼓相当的对手时那样。他把带毛边的嘴唇向后翻开，红舌卷曲，下颌越张越低，几乎能让人看见滚热的喉咙深处。他的犬齿一直露到牙根，上下颌猛然合拢，响得像一排钢锁同时扣上。下一瞬，街上已经空了。巴希拉从后窗跃到毛克利身边，尖叫的人群则互相践踏，跌跌撞撞地逃回各自屋里，又拖动沉重的粮箱，一只只顶住门板。
        - id: ch03-b52
          speaker: bagheera
          text: 天亮以前，他们不会再出来。现在做什么？
        - id: ch03-b53
          speaker: mowgli
          text: 你做得好极了。守到天亮，我去睡觉。
        - id: ch03-b54
          speaker: narrator
          text: 村子仿佛一下陷进午睡时的寂静，只有粮箱拖过泥地的声音还从屋里传来。巴希拉说得不错，天亮以前不会再有人出来。毛克利静静坐着思索，脸色越来越阴沉。巴希拉见他不说话，还站起来，讨好似的问自己是不是做错了什么。毛克利只说他做得好，要他守到天亮，自己则奔进丛林，像死人一样倒在岩石上。他从白天睡到黑夜，又从黑夜睡到天明。醒来时，巴希拉守在旁边，脚下放着一头刚杀死的公鹿。毛克利用剥皮刀割肉，吃饱喝足，又双手托着下巴翻身躺下。巴希拉一直好奇地看着他，随后告诉他，美苏亚夫妇已经走到能望见坎希瓦拉的地方。狼妈妈托老鹰契尔送回消息，说他们获救那夜还没到午夜便找到一匹马，走得很快，已经平安脱险。村民直到太阳升得很高才敢行动，吃过东西以后，很快又各自跑回家。巴希拉天亮时还在村门的尘土里打滚，也许还给自己唱了一小段歌。
    - id: ch04
      title: 布尔特普尔的主宰密语
      blocks:
        - id: ch04-b01
          speaker: bagheera
          text: 好了，小兄弟，事情已经办完了。跟我和巴鲁一起打猎去吧。他发现了几窝新蜂蜜，正想带你去看。我们都盼着你变回从前的样子。别再摆出那副连我看了都害怕的脸色。那男人和女人不会被扔进红花，丛林里也一切安好。把人群忘了吧。
        - id: ch04-b02
          speaker: mowgli
          text: 很快他们就会被忘掉。哈蒂今晚在哪里吃东西？
        - id: ch04-b03
          speaker: bagheera
          text: 他高兴到哪里吃，就会到哪里吃。谁能替沉默者回答？可你找他做什么？究竟有什么事是哈蒂能办，我们却办不了的？
        - id: ch04-b04
          speaker: mowgli
          text: 叫他带三个儿子来见我。
        - id: ch04-b05
          speaker: bagheera
          text: 对丛林之主这样发号施令可不合规矩。别忘了，人群还没让你变成这样以前，是他教你主宰密语的。
        - id: ch04-b06
          speaker: mowgli
          text: 这没有分别。现在我也有一句密语给他。叫他来见青蛙毛克利。若他第一次不听，就说是为了布尔特普尔田野的浩劫。
        - id: ch04-b07
          speaker: narrator
          text: 巴希拉把“布尔特普尔田野的浩劫”重复了两三遍，免得自己记错。他说最坏不过是哈蒂发怒，可要是能听见一句连沉默者也不得不服从的主宰密语，自己情愿拿整整一个月的狩猎来换。随后，他便离去了。毛克利独自留下，用剥皮刀一下下狠狠刺着泥土。在美苏亚以前，他一生从没见过人的血。更要紧的是，他从捆过她的皮绳上闻到了她的血。美苏亚待他好。只要他还懂得一点爱，他对美苏亚的爱便有多深，对其他人的憎恨也同样深。可是无论他怎样厌恶那些人的言语、残忍和胆怯，就算拿丛林里的一切来交换，他也不能逼自己杀死一个人，让那可怕的血味重新钻进鼻孔。他想出的办法更简单，却也彻底得多。一想到这个主意偏偏来自布尔迪奥在菩提树下讲过的故事，他便独自笑了起来。
        - id: ch04-b08
          speaker: bagheera
          text: 果然是主宰密语。他们在河边进食，一听便像耕牛一样服从。瞧，已经来了。
        - id: ch04-b09
          speaker: narrator
          text: 哈蒂和三个儿子无声到来，还是它们一贯的样子，没有发出半点声音。新鲜的河泥沾在它们两胁。老象用象牙掘起一株幼小的芭蕉树，一边嚼着青绿的茎，一边慢慢思索。三个儿子并排跟在父亲身后，缓缓晃动。哈蒂先向毛克利道了一声“祝你猎运亨通”，男孩却几乎连头也不抬。巴希拉见多识广，一眼便从那庞大身躯的每一根线条看出，此刻并不是丛林之主来同人孩说话，而是一个心怀恐惧者来见一个无所畏惧的人。毛克利让四头大象久久站在那里，前后换脚，自己开口时却只同巴希拉说话。
        - id: ch04-b10
          speaker: mowgli
          text: 今天那个被你们追赶的猎人讲了一个故事。故事里，一头年老聪明的大象掉进陷阱，坑底削尖的木桩从脚跟上方一直划到肩峰，留下长长一道白疤。人把他从坑里拖出来，可他力气很大，挣断绳索逃走了，一直等到伤口痊愈。后来他满怀怒火，带着三个儿子，乘夜回到猎人的田野。那是许多许多个雨季以前，地方也远得很，就在布尔特普尔。哈蒂，下一次收获时，那些田野变成什么样了？
        - id: ch04-b11
          speaker: hathi
          text: 我和三个儿子替他们收割了。
        - id: ch04-b12
          speaker: mowgli
          text: 收过以后，有人耕地吗？
        - id: ch04-b13
          speaker: hathi
          text: 没有。靠地上青苗活命的人全都走了。我们撕碎他们的屋顶，丛林吞掉了墙壁。从东到西，是我两夜能走过的好土地。从北到南，是我三夜能走过的好土地。这些全被丛林收去了。我们把丛林放进五座村庄。直到今天，那些村子和村外的牧地，还有松软的庄稼地里，再没有一个人从土中取得食物。那就是我和三个儿子造出的布尔特普尔田野浩劫。现在倒该你告诉我了，人孩，你怎么会知道？
        - id: ch04-b14
          speaker: mowgli
          text: 是一个人告诉我的。现在看来，连布尔迪奥也会讲真话。白疤哈蒂，你们上次做得好，这一次会做得更好，因为这回有人指挥。你知道那座赶走我的人村。他们懒惰、愚蠢又残忍，只会耍嘴皮子。他们杀死弱者，不是为了填饱肚子，而是为了取乐。自己吃饱以后，他们还想把同类扔进红花。这些事都是我亲眼见过的。不能再让他们住在那里。我恨他们！
          emotion: angry
        - id: ch04-b15
          speaker: hathi_youngest_son
          text: 那就杀光。
        - id: ch04-b16
          speaker: mowgli
          text: 白骨对我有什么用？我又不是狼崽，难道还要拿一颗血淋淋的脑袋在阳光下玩耍？我杀了谢尔汗，他的皮正在议事岩上腐烂。可是我不知道谢尔汗去了哪里，我的肚子也照样会饿。这一次，我要夺走那种看得见、摸得着的东西。哈蒂，把丛林放进那座村子！
        - id: ch04-b17
          speaker: narrator
          text: 巴希拉听得打了个寒战，身体越伏越低。真到了最坏的时候，沿着街道猛冲过去，在人群中左右挥爪，或者趁暮色降临、村民还在田里时悄悄杀死几个，这些事他都能理解。可毛克利有意把整个村庄从人和野兽的眼中彻底抹去，这个计划连巴希拉也害怕。直到现在，他才明白毛克利为什么一定要找哈蒂。除了这头长寿的老象，再没有谁能筹划并打赢这样的战争。
        - id: ch04-b18
          speaker: mowgli
          text: 让他们像布尔特普尔田野上的人一样逃走，一直逃到雨水成为那里唯一的犁。让大雨敲打密叶的声音，代替屋里纺锤嗒嗒转动的声音。等到那时，巴希拉和我要住进婆罗门的屋子，公鹿会在神庙后面的水池饮水。哈蒂，把丛林放进来！
        - id: ch04-b19
          speaker: hathi
          text: 可我，还有我的儿子，我们同那些人并没有仇。只有剧痛烧起那种血红的狂怒，才会叫我们去毁掉人睡觉的地方。
        - id: ch04-b20
          speaker: mowgli
          text: 难道你们是丛林里仅有的食草者？把你们的族类全引来，让鹿、野猪和蓝牛先去办。庄稼没有吃光以前，你们连一掌宽的皮也不必露出来。
        - id: ch04-b21
          speaker: hathi
          text: 不会杀戮吗？上一次我的象牙染红了，我不愿再唤醒那种气味。
        - id: ch04-b22
          speaker: mowgli
          text: 我也不愿意杀戮。我连他们的骨头都不想留在干净的土地上。让他们离开，另外去找巢穴。他们不能再留在这里。我看见了给过我食物的女人流血，也闻见了那血的气味。要不是我，他们已经杀死她了。只有门阶上新草的气息，才能抹掉那股味道。它一直烧着我的嘴。哈蒂，把丛林放进来！
        - id: ch04-b23
          speaker: hathi
          text: 坑里的木桩留下伤疤以后，那道伤也曾这样烧灼我的皮。它一直烧着，直到我们亲眼看见村庄被春天的新绿淹没。现在我明白了。你的战争就是我们的战争。我们要把丛林放进来！
        - id: ch04-b24
          speaker: narrator
          text: 毛克利气得浑身发抖，几乎还没来得及喘上一口气，大象站过的地方便已经空了。巴希拉惊恐地望着他。黑豹凭那道放自己自由的断锁起誓，又想起狼群和毛克利都还年幼的时候，自己曾替那个赤裸的小东西说过话。如今，他几乎认不出眼前这个丛林之主了。他恳求毛克利，等自己的力量衰退时，要替自己说话，也替巴鲁和所有伙伴说话。因为在毛克利面前，他们不过是幼崽，是脚下折断的枯枝，是失去母鹿的小鹿。一想到强大的巴希拉竟成了迷路的小鹿，毛克利再也绷不住了。他又笑又喘，又哭又笑，只好跳进水塘，像自己的同名青蛙一样，在一道道月光之间钻进钻出，游了一圈又一圈。
    - id: ch05
      title: 让丛林进来
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 哈蒂和三个儿子各自朝一个方向转身，无声地走下了一英里外的山谷。它们不停向前，整整走了两天，也就是漫长的六十英里。它们迈出的每一步，象鼻的每一次摆动，都被蝙蝠莽、老鹰契尔、猴族和所有鸟儿看见了。大家把这些动静记在心里，又彼此议论。随后四头象停下来，安安静静吃了大约一星期。它们和岩蟒卡阿一样，不到非快不可的时候，从来不着急。日子一到，也没人知道传言最初从哪里冒出来，整个丛林都开始议论，说某处山谷有更好的食物和水。野猪当然最先成群上路。只要能吃一顿饱饭，它们肯走到天涯海角。它们哼哼着翻过岩石，鹿群跟在后面，靠兽群中死伤者过活的小野狐也一道来了。肩背沉重的蓝牛同鹿群并排前进，沼泽里的野水牛又跟在蓝牛后面。兽群一路吃草、闲逛、饮水，然后再吃草，本来稍有惊动就会掉头。可每逢它们慌张，总有谁出来安抚。豪猪伊基满肚子都是消息，会告诉它们再往前一点还有好饲料。蝙蝠莽欢快地叫着，拍翅飞过林间空地，用行动表示那里什么危险也没有。巴鲁有时嘴里还塞着树根，笨拙地沿着一支犹豫的队伍慢慢走，半吓半闹地把它们赶回正路。许多动物中途折返，逃跑，或者失去兴致，可仍有许多继续向前。
        - id: ch05-b02
          speaker: narrator
          text: 又过了大约十天，情形已经变了。鹿、野猪和蓝牛在村子周围八九英里的大圈里来回打转，食肉兽沿着圆圈外侧巡行，把它们一点点向前、向内逼。村庄正好处在圆心，四周的庄稼就要成熟。田里的人坐在马昌上驱赶鸟雀和其他偷食者。那种平台只靠四根柱子顶着几根木棍，远远看去很像鸽子的栖架。这时候，已经再没有谁哄着鹿群向前走，食肉兽就紧贴在它们身后，逼着它们继续前进。一个漆黑的夜晚，哈蒂和三个儿子从林中悄然下来，用象鼻一根根折断马昌的柱子。平台像脆弱的花茎一样倒下。摔落的人什么也看不见，耳边只有大象喉间低沉的汩汩声。紧接着，受惊的鹿群冲破阻挡，像洪水一样涌进村外牧场和犁过的田地。利蹄拱土的野猪随后冲来。鹿群没有吃完的东西，全被野猪糟蹋了。狼群不时发出袭击的警报，兽群便绝望地来回奔突，踏倒青嫩的大麦，把灌溉渠的堤岸踩得平平整整。黎明以前，圆圈外侧的压力突然松开。食肉兽退到两旁，朝南放出一条路，成群的公鹿沿路逃走。还有一些胆大的鹿伏进灌木，等着下一夜再回来吃完。
        - id: ch05-b03
          speaker: narrator
          text: 事情其实已经办妥。清晨，村民只看一眼便明白，庄稼已经全部毁了。若不离开，这就意味着死亡，因为他们一年又一年都活在饥饿边缘，正像丛林始终紧贴村边一样。水牛被赶出去放牧，可饥饿的牲畜发现草场也被鹿群吃光了。它们只好四处游荡，最后走进丛林，渐渐同野生伙伴一起远去。黄昏时，村里仅有的三四匹小马也倒毙在厩中，头颅全被击碎。能打出这种伤口的只有巴希拉。会傲慢地把最后一具尸体拖到街道正中的，也只有巴希拉。
        - id: ch05-b04
          speaker: narrator
          text: 那一夜，村民再也提不起精神到田里生火，于是哈蒂和三个儿子进来捡食残余。哈蒂走过的地方，根本不必再有谁跟在后面。人们商量着，先靠储存的种粮活到雨季，再给别人做工，勉强熬过荒废的一年。村里的粮商却还想着自己装得满满的谷箱，盘算出售时究竟该开多高的价钱。可他还没盘算完，哈蒂尖利的象牙已经挑开泥屋一角，撞破那只外面糊着牛粪、存放宝贵粮食的大柳条箱。最后这场损失一被发现，便轮到婆罗门开口。他曾向自己的神祈祷，却始终没有得到回应，只好说村子也许在无意中冒犯了某位丛林神，因为丛林显然正在同他们作对。人们派人请来附近一支流浪贡德猎人的首领。那些猎人身材矮小，头脑聪明，皮肤黝黑，住在丛林深处。他们的祖先属于印度最古老的种族，也是这片土地原来的主人。村民拿仅剩的东西招待这位首领。他单腿站着，手握弓箭，发髻里插着两三支毒箭，望过忧心忡忡的村民和毁掉的田地。那目光一半畏惧，一半轻蔑。大家想问，他所信的古神是不是生了气，又该献什么祭品。贡德人一句话也没说。他只捡起一根结苦葫芦的藤，在那尊瞪着眼睛的红色神像前，把藤来回系在神庙门上。接着，他伸手朝空中一推，指向通往坎希瓦拉的道路，便转身回到丛林。他望着丛林子民从身边流过，知道丛林一旦移动，只有白人也许还能叫它改变方向。
        - id: ch05-b05
          speaker: narrator
          text: 他的意思再清楚不过。野葫芦会爬满他们敬神的地方，人越早逃命越好。可一座村庄已经扎下了根，要它一下挣脱并不容易。只要还剩一点夏季食物，人们便迟迟不肯走。他们试着进丛林采果子，可总有眼睛发亮的暗影盯着他们，哪怕正午也在前方滚动。人们害怕地逃回围墙，却发现五分钟前才经过的树干上，树皮已经被巨爪一击剥开，留下凿刻般的伤痕。人们越向村里收缩，野兽就变得越大胆，在温贡加河边的牧地上跳跃吼叫。村民忙得没空修补牛棚背靠丛林的后墙。野猪把墙踩倒，盘根错节的藤蔓马上跟来，伸着弯曲的枝条扑上新夺来的土地。粗草又在藤蔓后面竖起，好像妖怪大军追赶败兵时，一排排密密麻麻的长矛。未婚男子最先逃走，把村庄注定灭亡的消息传到远处。他们说，连菩提树下台座里的村蛇都离开了巢穴，谁还能对抗丛林和丛林里的神？穿过旷野的道路越踩越少，也越来越淡，村子同外界仅有的一点贸易跟着萎缩，最后几乎完全断绝。后来，哈蒂父子夜间的号叫也不再使人烦恼，因为已经没有什么东西可抢。地上的庄稼和地下的种子全没了，外围田地也失去界线。现在，他们只能去坎希瓦拉，靠英国人的施舍活命。
        - id: ch05-b06
          speaker: narrator
          text: 人们还是照自己的老习惯，把启程从今天拖到明天，直到第一场雨终于捉住他们。没人修补的屋顶往下泻着洪水，牧场上的积水没过脚踝。漫长炎夏一结束，所有东西都猛然生长。男女老少只好在清晨灼热又迷眼的雨幕中涉水离去。可走出村子时，他们还是自然而然地回过头，最后看了一眼家园。最后一户背着重担走出村门，围墙后忽然传来房梁和茅草倒塌的巨响。一条油亮得像蛇一样的黑色象鼻高高举起，湿透的茅草四散飞开。象鼻一闪不见，里面又响起一声轰鸣和一声尖叫。哈蒂正像拔睡莲一样揭下茅屋顶，一根弹起的房梁刺痛了他。这一下来得正好，立刻放开了他全部怒火。丛林万物之中，再没有什么比暴怒的野象破坏起来更加恣意。他抬起后腿猛踢泥墙。墙应声崩塌，又在倾盆大雨中化成一滩黄泥。哈蒂随即转过身，尖叫着冲过狭窄街道，左右撞向茅屋。他震碎那些摇摇欲坠的门，把一间间洞穴似的屋子挤垮。屋梁折断，茅草飞散，泥墙在雨水里接连倒下。三个儿子紧跟在后面肆虐，正像当年制造布尔特普尔田野浩劫时一样。
        - id: ch05-b07
          speaker: mowgli
          text: 丛林自然会吞掉这些空壳。现在该倒下的是外墙。
          emotion: calm
        - id: ch05-b08
          speaker: narrator
          text: 废墟里响起的声音平静得很。雨水不断冲刷毛克利裸露的肩膀和手臂。他从一面墙边轻巧地跃开，那面墙正像一头疲倦的水牛，慢慢向下塌落。
        - id: ch05-b09
          speaker: hathi
          text: 一步一步来。啊，当年在布尔特普尔，我的象牙可是红的。孩子们，都到外墙去！用头顶住！一齐来！现在！
        - id: ch05-b10
          speaker: narrator
          text: 四头大象并肩排开，把头抵住外墙，一同向前推动。墙先向外鼓起，接着裂开，最后轰然倒地。村民吓得一句话也说不出，只看见四个毁灭者凶猛而沾满黄泥的头颅，出现在参差不齐的缺口中。他们这才终于转身逃走。如今他们既没有家，也没有食物，只能沿着山谷一路奔去。身后的村庄还在被撕碎，被抛散，被沉重的脚掌反复践踏，最后在倾盆大雨里一点点融化。
        - id: ch05-b11
          speaker: narrator
          text: 一个月以后，那里只剩下一座微微起伏的土丘，上面覆满柔软青嫩的新草。等到雨季结束，就在半年前还压着一道道犁痕的土地上，丛林已经轰鸣着蓬勃生长。
