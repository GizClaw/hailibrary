  chapters:
    - id: ch01
      title: "The Trail of Buldeo"
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: "After Mowgli pinned Shere Khan's hide to the Council Rock, he told the broken Seeonee Pack that he would hunt alone. Mother and Father Wolf's four sons chose to hunt with him. Still, no one changes a whole life in a moment, least of all in the Jungle. Mowgli went first to the home cave and slept for a day and a night. When he woke, he told his wolf parents what he could about his months among men. He flashed the morning sun along the skinning knife that had stripped Shere Khan, and they saw that he had learned something. Akela and Gray Brother told their part in the buffalo drive. Baloo climbed the hill to hear it all, while Bagheera scratched himself with delight over Mowgli's clever war. Sunrise had passed long ago, but no one thought of sleep. Now and then Mother Wolf raised her head and drew in the wind, pleased by the smell of the tiger skin on the Rock."
        - id: ch01-b02
          speaker: mowgli
          text: "Without Akela and Gray Brother, I could have done nothing. Mother, you should have seen those black herd bulls pour down the ravine! You should have seen them rush through the gates when the Man-Pack threw stones at me!"
        - id: ch01-b03
          speaker: mother_wolf
          text: "I am glad I missed that last part. No cub of mine should be chased about like a jackal. I would have made the Man-Pack pay. Only the woman who gave you milk would have gone free. Her alone I would have spared."
        - id: ch01-b04
          speaker: father_wolf
          text: "Peace, Raksha. Our Frog has come home so wise that his own father should lick his feet. What is one more cut on his head? Leave men alone."
        - id: ch01-b05
          speakers: [baloo, bagheera]
          ensemble: duo
          text: "Leave men alone."
        - id: ch01-b06
          speaker: narrator
          text: "Mowgli rested his head against Mother Wolf's side and smiled. He said he never wanted to see, hear, or smell a man again."
        - id: ch01-b07
          speaker: akela
          text: "But what if men refuse to leave you alone, Little Brother?"
        - id: ch01-b08
          speaker: gray_brother
          text: "There are five of us."
        - id: ch01-b09
          speaker: bagheera
          text: "Baloo and I might join that hunt too. But why trouble yourself about men now, Akela?"
        - id: ch01-b10
          speaker: akela
          text: "Because after we hung the yellow chief's hide, I went back along our trail toward the village. I stepped in my own tracks, turned aside, and lay down here and there until the trail was so tangled that even I could hardly read it. Then Mang the Bat came through the trees and hung above me. He said the village that cast out the Man-cub was humming like a hornet's nest."
        - id: ch01-b11
          speaker: mowgli
          text: "I threw a large stone into that nest."
        - id: ch01-b12
          speaker: narrator
          text: "Mowgli chuckled. He had often thrown ripe pawpaws into real hornets' nests, then raced for the nearest pool before the insects caught him."
        - id: ch01-b13
          speaker: akela
          text: "I asked Mang what he had seen. The Red Flower was burning at the village gate, and men sat around it with guns. I have scars enough to know men do not carry guns for pleasure. A gun bearer will follow our trail soon, if he is not following it already."
        - id: ch01-b14
          speaker: mowgli
          text: "Why would he follow? They drove me out. What else can they want?"
          emotion: angry
        - id: ch01-b15
          speaker: akela
          text: "You are a man, Little Brother. We Free Hunters cannot explain what your own brothers do or why they do it."
        - id: ch01-b16
          speaker: narrator
          text: "Akela barely snatched back his paw before Mowgli's knife struck deep into the earth. The boy moved faster than an ordinary human eye could follow, but Akela was a wolf. Even a sleeping dog can feel a cartwheel touch his side and leap clear before it rolls over him."
        - id: ch01-b17
          speaker: mowgli
          text: "Next time, speak of the Man-Pack and Mowgli in two separate breaths."
        - id: ch01-b18
          speaker: akela
          text: "That tooth is sharp. But the Man-Pack has dulled your eye, Little Brother. I could have killed a buck while you were making that stroke."
        - id: ch01-b19
          speaker: narrator
          text: "Bagheera sprang upright and sniffed. His whole body stiffened. Gray Brother moved left to catch the wind, and Akela bounded fifty yards upwind and crouched. Mowgli watched them with envy. His nose was better than almost any man's, but it could not match a Jungle nose, and three smoky months in the village had weakened it. He wet a finger, rubbed his nose, and stood tall to catch the faint but truthful upper scent."
        - id: ch01-b20
          speaker: akela
          text: "Man."
        - id: ch01-b21
          speaker: mowgli
          text: "Buldeo. He is on our trail. There, the sunlight just touched his gun."
        - id: ch01-b22
          speaker: narrator
          text: "For less than a second, light flashed from the brass fittings of Buldeo's old musket. Mica, water, or a polished leaf might flash when clouds cross the sun, but the sky that day was clear and still."
        - id: ch01-b23
          speaker: akela
          text: "I knew they would follow. I did not lead the Pack for nothing."
        - id: ch01-b24
          speaker: narrator
          text: "The four young wolves slipped downhill on their bellies and vanished into thorn and brush."
        - id: ch01-b25
          speaker: mowgli
          text: "Where are you going without a word?"
        - id: ch01-b26
          speaker: gray_brother
          text: "We will roll his skull back here before noon."
        - id: ch01-b27
          speaker: mowgli
          text: "Come back and wait! Man does not eat man!"
          emotion: angry
        - id: ch01-b28
          speaker: akela
          text: "A moment ago you were a wolf. You threw a knife at me because I called you a man."
        - id: ch01-b29
          speaker: narrator
          text: "The wolves returned unwillingly and fell in behind him."
        - id: ch01-b30
          speaker: mowgli
          text: "Must I explain every choice I make?"
          emotion: angry
        - id: ch01-b31
          speaker: bagheera
          text: "There speaks Man. Men talked just that way around the King's cages at Oodeypore. The Jungle says Man is the wisest creature alive. If we believed our own ears, we would call him the greatest fool. Still, the Man-cub is right. Men hunt in packs. Killing one before we know what the others will do is bad hunting. Let us learn what this man wants."
        - id: ch01-b32
          speaker: gray_brother
          text: "We will not come. Hunt by yourself, Little Brother. We know what we want, and his skull could have been here by now."
        - id: ch01-b33
          speaker: narrator
          text: "Mowgli looked from one friend to another. His chest heaved, and tears filled his eyes. He stepped before the wolves, dropped to one knee, and fixed them with his stare."
        - id: ch01-b34
          speaker: mowgli
          text: "Do you think I do not know my own mind? Look at me."
        - id: ch01-b35
          speaker: narrator
          text: "Whenever their eyes wandered, he called them back. Soon their fur stood on end and every limb trembled beneath Mowgli's unbroken gaze."
        - id: ch01-b36
          speaker: mowgli
          text: "Now tell me. Of the five of us, who leads?"
        - id: ch01-b37
          speaker: gray_brother
          text: "You lead, Little Brother."
        - id: ch01-b38
          speaker: narrator
          text: "Gray Brother licked Mowgli's foot."
        - id: ch01-b39
          speaker: mowgli
          text: "Then follow."
        - id: ch01-b40
          speaker: narrator
          text: "The four wolves followed with their tails between their legs. Bagheera slipped downhill after them."
        - id: ch01-b41
          speaker: bagheera
          text: "This is what comes of living with men. Something stronger than Jungle Law walks here now, Baloo."
        - id: ch01-b42
          speaker: narrator
          text: "Baloo said nothing, though many thoughts moved through his head. Mowgli cut silently across Buldeo's path. Through the leaves he saw the old hunter jogging along the trail with his musket on his shoulder. Mowgli's burden of raw tiger hide, with Akela and Gray Brother behind him, had left three clear tracks the night before. Buldeo followed them until he reached the place where Akela had tangled the signs. He sat, coughed, grunted, and cast about for the trail. All the while, his unseen watchers were close enough to hit with a stone. Wolves can be utterly silent, and even Mowgli, clumsy by their measure, moved like a shadow. They circled Buldeo as swiftly as porpoises circle a ship. They spoke freely in tones below the range of an untrained human ear."
        - id: ch01-b43
          speaker: gray_brother
          text: "This is finer than a kill. He looks like a lost river pig, puffing and peering. What is he muttering?"
        - id: ch01-b44
          speaker: mowgli
          text: "He says wolves must have danced around me. He has never seen tracks like these, and he is tired."
        - id: ch01-b45
          speaker: bagheera
          text: "He will rest a long while before he finds them again. What is the lean creature doing now?"
        - id: ch01-b46
          speaker: mowgli
          text: "Either eating or blowing smoke. Men are always busy with their mouths."
        - id: ch01-b47
          speaker: narrator
          text: "Buldeo filled and lit his water pipe. The hunters memorized the tobacco smell, so they could know him even on the darkest night. Then several charcoal burners came down the path and stopped beside the famous hunter. They sat to smoke, while Bagheera and the wolves crept close to listen. Buldeo told them about Mowgli, the Devil-child, and improved the tale at every turn. He claimed he had killed Shere Khan himself. Mowgli, he said, had become a wolf and fought him all afternoon, then changed back into a boy and bewitched his rifle so that its bullet turned a corner and killed Buldeo's buffalo. Because Buldeo was the bravest hunter in Seeonee, the village had sent him to destroy this monster. Meanwhile, the villagers had seized Messua and her husband, whom they called the Devil-child's parents. They had shut the pair inside their hut. Soon they would torture them into confessing that they were witch and wizard, then burn them."
        - id: ch01-b48
          speaker: charcoal_burner
          text: "When will they burn them?"
        - id: ch01-b49
          speaker: narrator
          text: "The charcoal burners hoped to watch. Buldeo told them nothing would happen until he returned from killing the Jungle Boy. Then Messua and her husband would die, and the village would divide their land and fine buffaloes. Destroying wizards was excellent work, he said, and anyone who welcomed a wolf-child must be the worst kind of witch. The charcoal burners wondered what the English might do. They had heard those people were mad enough to stop honest farmers from killing witches in peace."
        - id: ch01-b50
          speaker: buldeo
          text: "The headman will report that both of them died from snakebite. That is settled. We only need to kill the Wolf-child now. You have not seen such a creature, have you?"
        - id: ch01-b51
          speaker: narrator
          text: "The men looked around nervously and thanked their stars they had not. Surely, they said, a hunter as brave as Buldeo would find the creature. The sun was sinking, and they wanted to visit the village and see the wicked witch. Buldeo declared that he could not let unarmed men cross a Jungle where a wolf-demon might appear. He would escort them, and if the sorcerer's child came, they would see how Seeonee's finest hunter dealt with him. A charm from the Brahmin made Buldeo perfectly safe."
        - id: ch01-b52
          speaker: gray_brother
          text: "What is he saying now? Tell us, Mowgli."
        - id: ch01-b53
          speaker: narrator
          text: "Mowgli translated until he reached the talk of witchcraft, which made little sense to him. What he understood was enough. The man and woman who had shown him kindness were trapped."
        - id: ch01-b54
          speaker: bagheera
          text: "Do men set traps for other men?"
        - id: ch01-b55
          speaker: mowgli
          text: "Buldeo says so. I cannot make sense of it. They are all mad together. What have Messua and her man done because of me? Why should they be trapped, and why all this talk of the Red Flower? I must see for myself. They will wait for Buldeo before they hurt her, so I have time."
        - id: ch01-b56
          speaker: narrator
          text: "His fingers moved around the knife handle while Buldeo and the charcoal burners marched bravely away in single file."
        - id: ch01-b57
          speaker: mowgli
          text: "I am running straight back to the village."
        - id: ch01-b58
          speaker: gray_brother
          text: "And what about those men?"
        - id: ch01-b59
          speaker: mowgli
          text: "Sing them home. Keep them away from the gates until dark. Can you hold them?"
        - id: ch01-b60
          speaker: gray_brother
          text: "If I understand men, we can turn them in circles like goats tied to a post."
        - id: ch01-b61
          speaker: mowgli
          text: "No circles. Give them a little company on the road, but do not make the song sweet. Bagheera, help them sing. Meet me at the village after nightfall. Gray Brother knows the place."
        - id: ch01-b62
          speaker: bagheera
          text: "Working for a Man-cub is no light hunt. When am I supposed to sleep? And now I must sing to naked men! Very well. Let us try."
        - id: ch01-b63
          speaker: narrator
          text: "Bagheera's bright eyes betrayed his delight. He lowered his head and sent a long midnight hunting call through the afternoon woods. It rolled, rose, and fell behind Mowgli until it died in a dreadful whine. Mowgli laughed as he ran. Behind him the charcoal burners bunched together, and Buldeo's gun swept every way like a banana leaf in a storm. Gray Brother gave the buck-driving cry. It sounded far away, then nearer and nearer, until it ended in one sharp scream. His three brothers answered, making even Mowgli believe the whole Pack was hunting. Then all four wolves broke into the grand Morning Song, throwing every deep-throated turn and flourish into it. They sang of shadows lengthening across the plain, of horn and pelt melting into cover, of red dawn above the pool, and of the warning passing through young bamboo. They sang the Day to Man and good rest to all who kept the Jungle Law. No human words could carry the scorn in that music. Trees crashed as the terrified men climbed into them, while Buldeo repeated charms. Then the wolves lay down and slept. Jungle hunters know that no one works well without rest."
        - id: ch01-b64
          speaker: narrator
          text: "Mowgli covered mile after mile, glad that the cramped months among men had not weakened him. He meant to free Messua and her husband from whatever trap held them. After that, he would settle his debt with the village."
    - id: ch02
      title: "Messua's Escape"
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: "At twilight Mowgli reached the familiar grazing grounds and the dhak tree where Gray Brother had waited on the morning Shere Khan died. He hated the whole breed of men, yet the sight of the village roofs caught his breath. Everyone had left the fields early. Instead of cooking the evening meal, the villagers crowded beneath the great tree, shouting and chattering."
        - id: ch02-b02
          speaker: mowgli
          text: "Men cannot be content unless they are making traps for one another. Last night the trap was for Mowgli, though that feels many Rains ago. Tonight it is for Messua and her man. Tomorrow, and for many nights after, it will be Mowgli's turn again."
        - id: ch02-b03
          speaker: narrator
          text: "He crept outside the wall to Messua's hut and looked through the window. Messua lay gagged, with her hands and feet tied. She breathed painfully and groaned. Her husband was bound to the painted bedstead. The street door was barred, and several guards sat with their backs against it. Mowgli knew village habits. While people could eat, talk, and smoke, they would do nothing else. Once they finished eating, they would become dangerous. Buldeo would return soon, if the wolves had done their work, and he would bring a marvelous story. Mowgli slipped through the window. He cut the ropes, pulled out the gags, and searched for milk. Messua had been beaten and stoned all morning. Pain and terror had nearly driven her wild, and Mowgli covered her mouth just before she screamed. Her husband sat up, bewildered and angry, picking dirt from his torn beard."
        - id: ch02-b04
          speaker: messua
          text: "I knew you would come. Now I know you truly are my son."
          emotion: happy
        - id: ch02-b05
          speaker: narrator
          text: "She pulled Mowgli against her heart. Until then he had been perfectly steady. Now his whole body trembled, and the feeling astonished him."
        - id: ch02-b06
          speaker: mowgli
          text: "Why did they bind you?"
        - id: ch02-b07
          speaker: messuas_husband
          text: "They mean to kill us because we called you our son. Look at me. I am bleeding."
        - id: ch02-b08
          speaker: narrator
          text: "Messua did not speak. Mowgli looked at her wounds instead, and his teeth ground together when he saw her blood."
        - id: ch02-b09
          speaker: mowgli
          text: "Who did this? Someone will pay."
          emotion: angry
        - id: ch02-b10
          speaker: messuas_husband
          text: "The whole village. I owned too many cattle and had too much land. So now we are witches because we sheltered you."
        - id: ch02-b11
          speaker: mowgli
          text: "I still do not understand. Messua, tell me what happened."
        - id: ch02-b12
          speaker: messua
          text: "I gave you milk, Nathoo. Do you remember? I thought you were the son the tiger stole from me, and I loved you dearly. They said that made me the mother of a devil, and they said I must die."
          emotion: sad
        - id: ch02-b13
          speaker: mowgli
          text: "What is a devil? I know what death is."
        - id: ch02-b14
          speaker: narrator
          text: "The man stared gloomily, but Messua laughed."
        - id: ch02-b15
          speaker: messua
          text: "You see? I told you he was no sorcerer. He is my son."
          emotion: happy
        - id: ch02-b16
          speaker: messuas_husband
          text: "Son or sorcerer, how does that save us? We are already as good as dead."
        - id: ch02-b17
          speaker: mowgli
          text: "The road outside that window leads to the Jungle. Your hands and feet are free. Go now."
        - id: ch02-b18
          speaker: messua
          text: "We do not know the Jungle as you do, my son. I am not sure I can walk very far."
        - id: ch02-b19
          speaker: messuas_husband
          text: "The villagers would catch us and drag us back."
        - id: ch02-b20
          speaker: mowgli
          text: "I do not want to harm anyone here yet. But they will not stop you. Soon they will have other things to think about."
        - id: ch02-b21
          speaker: narrator
          text: "Shouts and pounding feet sounded outside. Mowgli raised his head to listen."
        - id: ch02-b22
          speaker: mowgli
          text: "So they have finally allowed Buldeo to come home."
        - id: ch02-b23
          speaker: messua
          text: "They sent him to kill you this morning. Did you meet him?"
          emotion: fearful
        - id: ch02-b24
          speaker: mowgli
          text: "We met. I met him. He has a long tale to tell, and that gives us time. Decide where you will go. I will come back after I learn what the villagers mean to do."
        - id: ch02-b25
          speaker: narrator
          text: "He leaped through the window and circled outside the wall until he could hear the crowd beneath the peepul tree. Buldeo lay on the ground, coughing and groaning, surrounded by questions. His hair hung loose. His hands and legs were scraped raw from climbing trees. He could barely talk, but he knew everyone was watching him. Now and then he mentioned devils, singing spirits, and enchantment, giving his listeners a taste of the wonders ahead. Then he demanded water."
        - id: ch02-b26
          speaker: mowgli
          text: "Talk, talk, chatter, chatter! Men are blood brothers to the Bandar-log. First he must drink. Then he must smoke. After all that, he will still have his story to tell. Such wise creatures! They have left no one guarding Messua because every ear must be stuffed with Buldeo's tales. And I am growing as lazy as they are."
        - id: ch02-b27
          speaker: narrator
          text: "He shook himself and returned to the hut. Just below the window, something touched his foot. He knew the tongue at once."
        - id: ch02-b28
          speaker: mowgli
          text: "Mother, what are you doing here?"
        - id: ch02-b29
          speaker: mother_wolf
          text: "I heard my children singing in the woods, so I followed the one I love best. Little Frog, I want to see the woman who gave you milk."
        - id: ch02-b30
          speaker: mowgli
          text: "They tied her up and mean to kill her. I cut her bonds. She and her man will go through the Jungle."
        - id: ch02-b31
          speaker: mother_wolf
          text: "Then I will follow them. I may be old, but I still have teeth."
        - id: ch02-b32
          speaker: narrator
          text: "Mother Wolf rose on her hind legs and looked into the dark hut. A moment later she dropped silently to the ground."
        - id: ch02-b33
          speaker: mother_wolf
          text: "I gave you your first milk, but Bagheera was right. In the end, Man returns to Man."
        - id: ch02-b34
          speaker: mowgli
          text: "Perhaps. But tonight I am far from that trail. Wait here, and do not let her see you."
        - id: ch02-b35
          speaker: mother_wolf
          text: "You were never afraid of me, Little Frog."
        - id: ch02-b36
          speaker: narrator
          text: "She backed into the high grass and disappeared. Mowgli swung cheerfully through the window again."
        - id: ch02-b37
          speaker: mowgli
          text: "Everyone is listening to Buldeo tell things that never happened. When he finishes, they plan to come with fire and burn you both. What will you do?"
        - id: ch02-b38
          speaker: messua
          text: "My husband and I have decided. Khanhiwara is thirty miles away, but we may find the English there."
        - id: ch02-b39
          speaker: mowgli
          text: "What Pack are the English?"
        - id: ch02-b40
          speaker: messua
          text: "I do not know. They are white, and people say they rule the land. They do not allow anyone to burn or beat another person without witnesses. If we reach them tonight, we live. If not, we die."
        - id: ch02-b41
          speaker: mowgli
          text: "Then live. No one will pass through the gates tonight. But what is your husband doing?"
        - id: ch02-b42
          speaker: narrator
          text: "Messua's husband was digging into the earth at one corner of the hut."
        - id: ch02-b43
          speaker: messua
          text: "He buried a little money there. We can take nothing else."
        - id: ch02-b44
          speaker: mowgli
          text: "Ah, the stuff men pass from hand to hand that never grows warmer. Do you need it outside this village too?"
        - id: ch02-b45
          speaker: messuas_husband
          text: "He is a fool, not a devil. Money can buy a horse. We are too bruised to walk far, and the village will be after us within an hour."
        - id: ch02-b46
          speaker: mowgli
          text: "They will not follow until I choose. Still, a horse is a good thought. Messua is tired."
        - id: ch02-b47
          speaker: narrator
          text: "The man tied his last rupees into his waistcloth. Mowgli helped Messua through the window. Cool night air revived her, though the starlit Jungle looked black and terrible."
        - id: ch02-b48
          speaker: mowgli
          text: "Do you know the road to Khanhiwara? Good. Do not be afraid, and do not hurry. You may hear a little singing ahead of you or behind you."
        - id: ch02-b49
          speaker: messuas_husband
          text: "We would not risk the Jungle at night unless burning frightened us more. Better to die by beasts than by men."
        - id: ch02-b50
          speaker: narrator
          text: "Messua looked at Mowgli and smiled. He spoke with the patient firmness Baloo used when teaching an old law to a foolish cub."
        - id: ch02-b51
          speaker: mowgli
          text: "Hear me. Not one Jungle tooth will be bared against you. Not one Jungle foot will rise against you. Neither beast nor man will stop you before Khanhiwara comes into sight. Someone will watch over you. He does not believe me, Messua. Do you?"
        - id: ch02-b52
          speaker: messua
          text: "Yes, my son. Whether you are man, ghost, or Jungle wolf, I believe you."
        - id: ch02-b53
          speaker: mowgli
          text: "He will be frightened when my people sing, but you will understand them. Go slowly. There is no need to hurry. The gates are closed."
        - id: ch02-b54
          speaker: narrator
          text: "Messua fell sobbing at Mowgli's feet. He lifted her quickly, with a shiver. She held him around the neck and gave him every blessing she knew. Her husband looked enviously across his fields."
        - id: ch02-b55
          speaker: messuas_husband
          text: "If we reach Khanhiwara and the English listen to me, I will bring a lawsuit that eats this village to the bone. The Brahmin, Buldeo, and all the rest will pay twice for my lost crops and hungry buffaloes. I will have justice."
        - id: ch02-b56
          speaker: mowgli
          text: "I do not know what justice means. Come back after the next Rains and see what remains."
        - id: ch02-b57
          speaker: narrator
          text: "The couple entered the Jungle. Mother Wolf sprang from hiding."
        - id: ch02-b58
          speaker: mowgli
          text: "Follow them. Tell the whole Jungle these two are safe. Give tongue once. I need to call Bagheera."
        - id: ch02-b59
          speaker: narrator
          text: "Mother Wolf's long, low howl rose and fell. Messua's husband flinched and half turned toward the village."
        - id: ch02-b60
          speaker: mowgli
          text: "Keep going! I warned you there might be singing. That call will follow you to Khanhiwara. It is the Jungle's favor."
        - id: ch02-b61
          speaker: narrator
          text: "Messua urged her husband onward, and the dark closed over all three. Bagheera rose almost beneath Mowgli's feet. He trembled with the wild delight that night brings to the Jungle People."
        - id: ch02-b62
          speaker: bagheera
          text: "Your human brothers shame me."
        - id: ch02-b63
          speaker: mowgli
          text: "Did they dislike your song to Buldeo?"
        - id: ch02-b64
          speaker: bagheera
          text: "We sang too well! Even I forgot my pride and sang like a panther courting in spring. Did you not hear us?"
        - id: ch02-b65
          speaker: mowgli
          text: "I had another hunt. Ask Buldeo how he liked the music. Where are the four wolves? No villager must leave tonight."
        - id: ch02-b66
          speaker: bagheera
          text: "Why need the Four? I can hold the village. Is there killing at last? The song and the sight of men scrambling up trees have sharpened me. Why should we care for Man, that naked brown digger, hairless, toothless, eating from the dirt? All day I drove him as wolves drive buck. I am Bagheera! I danced with those men as I dance with my own shadow. My strength is in me tonight. Who can stop my paw? One blow could flatten your head like a dead summer frog."
        - id: ch02-b67
          speaker: narrator
          text: "The panther leaped at the empty air like a kitten chasing a falling leaf. His paws struck left and right, making the air sing. He landed without sound and leaped again, while his purr grew into a rumble."
        - id: ch02-b68
          speaker: mowgli
          text: "Then strike."
        - id: ch02-b69
          speaker: narrator
          text: "Mowgli used the village tongue, not Jungle speech. The human words stopped Bagheera at once. He fell onto his trembling haunches, his head level with the boy's. Mowgli stared into the green eyes until the red fire behind them went dark. Bagheera lowered his gaze and his great head. His rough tongue scraped Mowgli's foot."
        - id: ch02-b70
          speaker: mowgli
          text: "Brother, brother. Be still. The night is to blame, not you."
          emotion: calm
        - id: ch02-b71
          speaker: bagheera
          text: "It was the smell of the night. The air itself calls to me. But how did you know?"
        - id: ch02-b72
          speaker: narrator
          text: "An Indian village sends countless smells into the dark. To a creature who thinks through his nose, they can be as maddening as music or drugs are to men. Mowgli stroked Bagheera's neck and heaving back until the panther lay with his paws folded beneath him and his eyes half closed."
        - id: ch02-b73
          speaker: bagheera
          text: "You belong to the Jungle, yet you do not. I am only a black panther. But I love you, Little Brother."
        - id: ch02-b74
          speaker: mowgli
          text: "The people are taking a long time. Buldeo must have many lies to tell. Soon they will come to drag Messua and her man from the trap and throw them into the fire. They will find the trap empty."
        - id: ch02-b75
          speaker: bagheera
          text: "Listen. My fever has passed. Let them find me inside. Few will leave their houses after meeting me. I have lived in a cage before, and they will not bind me with cords."
        - id: ch02-b76
          speaker: mowgli
          text: "Be wise, then."
        - id: ch02-b77
          speaker: narrator
          text: "Mowgli laughed, reckless now himself. Bagheera slipped through the window."
        - id: ch02-b78
          speaker: bagheera
          text: "This hut reeks of Man, but the bed is much like the one in the King's cages at Oodeypore. I will lie here. By the Broken Lock that freed me, they will think they have caught great game. Sit beside me, and we will wish them good hunting together."
        - id: ch02-b79
          speaker: mowgli
          text: "No. I have another thought inside me. They must not know what part I played. Make your own hunt. I do not want to watch."
        - id: ch02-b80
          speaker: bagheera
          text: "As you wish. They are coming now."
        - id: ch02-b81
          speaker: narrator
          text: "The meeting beneath the tree burst into wild cries. Men and women charged up the street, waving clubs, bamboo poles, sickles, and knives. Buldeo and the Brahmin led them. They shouted for the witch and wizard. Some wanted hot coins to force a confession. Some wanted to burn the hut, and others insisted on beating the prisoners first. They called for more torches and told Buldeo to heat his gun barrels. The barred door resisted, then the crowd tore it away. Torchlight poured across the bed. Bagheera lay there full length, black as the Pit and terrible as a demon, with his paws crossed over the end. For half a minute no one made a sound. The people at the front fought to back away. Bagheera raised his head and gave the slowest, grandest, most insulting yawn he knew. His lips lifted. His red tongue curled. His lower jaw sank until the crowd could see deep into his throat, and his enormous teeth clicked together like the bolts of a safe. An instant later the street was empty. Bagheera jumped through the window as the screaming villagers tumbled over one another toward their homes."
        - id: ch02-b82
          speaker: bagheera
          text: "They will not move again before daylight. What now?"
        - id: ch02-b83
          speaker: narrator
          text: "The village went as still as it did during the afternoon sleep. From inside the huts came the scrape of heavy grain boxes being dragged against doors. Bagheera was right. No one would stir before morning. Mowgli sat thinking, and his face darkened."
        - id: ch02-b84
          speaker: bagheera
          text: "What have I done?"
          emotion: fearful
        - id: ch02-b85
          speaker: mowgli
          text: "You have done great good. Guard them until day. I am going to sleep."
        - id: ch02-b86
          speaker: narrator
          text: "Mowgli ran into the Jungle, fell across a rock like a dead boy, and slept through the day and back into the night."
    - id: ch03
      title: "The Sack of Bhurtpore"
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: "When Mowgli woke, Bagheera sat beside him and a newly killed buck lay at his feet. The panther watched while Mowgli skinned the animal, ate, drank, and finally rested his chin in his hands."
        - id: ch03-b02
          speaker: bagheera
          text: "The man and woman are safely within sight of Khanhiwara. Your lair mother sent word by Chil the Kite. They found a horse before midnight and traveled quickly. Is that good news?"
        - id: ch03-b03
          speaker: mowgli
          text: "It is good."
        - id: ch03-b04
          speaker: bagheera
          text: "The villagers stayed inside until the sun was high. Then they came out to eat and hurried back behind their doors."
        - id: ch03-b05
          speaker: mowgli
          text: "Did they happen to see you?"
        - id: ch03-b06
          speaker: bagheera
          text: "They may have. At dawn I rolled in the dust before the gate, and perhaps I sang a small song. But there is nothing left to do now. Hunt with Baloo and me. He has found new hives, and we want our Little Brother back as he was. Take that look from your face. It frightens even me. Messua and her man are safe from the fire. All is well in the Jungle. Let the Man-Pack go."
        - id: ch03-b07
          speaker: mowgli
          text: "They will be forgotten soon. Where is Hathi feeding tonight?"
        - id: ch03-b08
          speaker: bagheera
          text: "Wherever he chooses. Who can answer for the Silent One? Why do you ask? What can Hathi do that we cannot?"
        - id: ch03-b09
          speaker: mowgli
          text: "Tell him to come here with his three sons."
        - id: ch03-b10
          speaker: bagheera
          text: "Little Brother, it is not proper to order Hathi about. He is the Master of the Jungle. Before the Man-Pack changed your face, he taught you the Master Words."
        - id: ch03-b11
          speaker: mowgli
          text: "That does not matter. I have a Master Word for him now. Tell him Mowgli the Frog calls. If he refuses, say he must come because of the Sack of the Fields of Bhurtpore."
        - id: ch03-b12
          speaker: bagheera
          text: "The Sack of the Fields of Bhurtpore. I will remember. At worst, Hathi can only be angry, and I would give a month's hunting to hear a word that commands the Silent One."
        - id: ch03-b13
          speaker: narrator
          text: "Bagheera left Mowgli stabbing his knife furiously into the earth. Before seeing the blood on Messua's ropes, Mowgli had never seen human blood. More important, he had never smelled it. Messua had treated him kindly. As far as he understood love, he loved her as completely as he hated the rest of mankind. Yet no matter how he loathed their cruel, cowardly ways, he could not kill a man and bring that blood smell back to his nose. His plan was simpler and far more complete. He laughed when he remembered that one of Buldeo's own boasts had given him the idea."
        - id: ch03-b14
          speaker: bagheera
          text: "It truly was a Master Word. Hathi and his sons were feeding by the river, but they obeyed like driven cattle. Look. They are here."
        - id: ch03-b15
          speaker: narrator
          text: "The four elephants had arrived without a sound. Fresh river mud marked their sides. Hathi thoughtfully chewed a young plantain stem that he had torn up with his tusks. Bagheera read every line of the huge body. This was not the Master of the Jungle speaking down to a Man-cub. This was someone afraid, approaching someone without fear. Hathi's sons stood side by side behind him. Hathi offered good hunting, but Mowgli barely raised his head. He let the elephant rock, sway, and shift from foot to foot for a long while. When the boy finally spoke, he addressed Bagheera."
        - id: ch03-b16
          speaker: mowgli
          text: "I heard a story today from the hunter we hunted. It was about an old, wise elephant who fell into a pit. A sharpened stake cut him from above his heel to the top of his shoulder and left one long white scar. Men came to take him, but he was strong. He broke the ropes and escaped until the wound healed. Then he returned by night to the hunters' fields. I remember that he had three sons. This happened many Rains ago, far away among the fields of Bhurtpore. Hathi, what happened to those fields at the next harvest?"
        - id: ch03-b17
          speaker: narrator
          text: "Mowgli flung out one hand. Hathi wheeled, and moonlight showed a white scar down his gray side like the mark of a burning whip."
        - id: ch03-b18
          speaker: hathi
          text: "My three sons and I harvested them."
        - id: ch03-b19
          speaker: mowgli
          text: "What happened when it was time to plow again?"
        - id: ch03-b20
          speaker: hathi
          text: "No one plowed."
        - id: ch03-b21
          speaker: mowgli
          text: "And the people who lived from those green crops?"
        - id: ch03-b22
          speaker: hathi
          text: "They left."
        - id: ch03-b23
          speaker: mowgli
          text: "What became of their huts?"
        - id: ch03-b24
          speaker: hathi
          text: "We ripped away the roofs. The Jungle swallowed the walls."
        - id: ch03-b25
          speaker: mowgli
          text: "What else did you do?"
        - id: ch03-b26
          speaker: hathi
          text: "Across as much land as I can walk in two nights from east to west, and three nights from north to south, the Jungle took possession. We let it into five villages. No man gathers food from that ground today. That was the Sack of the Fields of Bhurtpore, done by my sons and me. Now tell me, Man-cub. How did the story reach you?"
        - id: ch03-b27
          speaker: mowgli
          text: "A man told me, so even Buldeo sometimes speaks truth. You did well, Hathi of the white scar. But the second sack will be better, because a man will direct it. You know the village that drove me out. Its people are idle, senseless, and cruel. Their mouths never stop. They kill the weak for sport instead of food. With full bellies, they would throw their own kind into the fire. I saw it. They must not live here any longer. I hate them."
          emotion: angry
        - id: ch03-b28
          speaker: hathis_youngest_son
          text: "Then kill them."
        - id: ch03-b29
          speaker: narrator
          text: "The youngest elephant pulled up a tuft of grass, dusted it against his forelegs, and tossed it away. His small red eyes moved from side to side."
        - id: ch03-b30
          speaker: mowgli
          text: "What use are white bones to me? Am I a wolf cub who plays with a raw head in the sun? I killed Shere Khan, and his skin rots on the Council Rock. I do not know where Shere Khan himself has gone, and my stomach is still empty. I want something I can see and touch. Let in the Jungle upon that village, Hathi."
        - id: ch03-b31
          speaker: narrator
          text: "Bagheera shivered and crouched low. He understood a sudden rush down a street, a panther striking left and right, or hunters being killed at dusk. But a slow plan to erase a whole village from the sight of man and beast frightened him. Now he knew why Mowgli needed the oldest elephant. Only Hathi could carry out such a war."
        - id: ch03-b32
          speaker: mowgli
          text: "Make them flee as the people fled Bhurtpore. Let rainwater be the only plow. Let rain on thick leaves replace the sound of their spindles. Let Bagheera and me sleep in the Brahmin's house, while buck drink from the temple tank. Let in the Jungle, Hathi."
        - id: ch03-b33
          speaker: hathi
          text: "My sons and I have no quarrel with them. Only the red rage of great pain makes us tear down men's homes."
        - id: ch03-b34
          speaker: mowgli
          text: "You are not the only grass eaters. Send in your people. Bring deer, pig, and nilghai. You need not show one strip of hide until the fields are bare. Let in the Jungle."
        - id: ch03-b35
          speaker: hathi
          text: "There will be no killing? My tusks were red at Bhurtpore. I do not want that smell awake again."
        - id: ch03-b36
          speaker: mowgli
          text: "Neither do I. I do not even want their bones on the clean earth. Let them find another home. They cannot remain here. I saw and smelled the blood of the woman who fed me, the woman they would have killed without me. Only new grass growing at their doors can clear that smell from my mouth. It burns there. Let in the Jungle, Hathi!"
          emotion: angry
        - id: ch03-b37
          speaker: hathi
          text: "Now I understand. The stake scar burned on me until I watched those villages sink beneath spring growth. Your war is our war. We will let in the Jungle."
        - id: ch03-b38
          speaker: narrator
          text: "Mowgli barely caught his breath. Rage and hatred shook him from head to foot. Then the elephants were gone, and Bagheera stared at him in terror."
        - id: ch03-b39
          speaker: bagheera
          text: "By the Broken Lock that freed me, are you the naked cub I once defended before the Pack? Master of the Jungle, when my strength fails, speak for me. Speak for Baloo. Speak for us all. Beside you, we are cubs, snapped twigs, little fawns that have lost their mothers."
        - id: ch03-b40
          speaker: narrator
          text: "The thought of mighty Bagheera as a lost fawn broke Mowgli's fury. He laughed, gasped, sobbed, and laughed again until he had to jump into a pool to stop. He swam through bars of moonlight, diving and rising like the frog whose name he carried."
    - id: ch04
      title: "Letting In the Jungle"
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: "By then Hathi and his sons had each taken a different direction. One went east, another west, another south, while Hathi chose his own road. They walked soundlessly down valley after valley for two long days, covering a full sixty miles through the Jungle. Nothing so large could travel so far without the whole forest learning of it. Mang saw them from the evening air. Chil watched from high above. The Monkey People called from tree to tree, and birds carried the news beyond the next ridge. Every planted foot and every slow sweep of a trunk was noticed, repeated, and discussed. Yet no one knew why the four elephants traveled. After their march, they stopped and fed quietly for a week or more. They tore branches, pulled young trees, drank, rested, and seemed to have forgotten the journey. Hathi and his sons are like Kaa the Rock Python in that way. They never hurry merely because others are impatient. They wait until movement is needed, and then nothing turns them aside. At last a rumor began to move through the Jungle. No creature could say who spoke first. Somewhere ahead, the rumor said, there was a certain valley where food grew richer and water stood deeper. The place always seemed to lie just beyond the next stretch of forest. The pigs moved first. A wild pig will push to the farthest end of the earth if a full meal waits there. They came in small companies, snuffling between stones, shoving through thorn, and scuffling over the rocks. The deer began to follow the pigs. Behind the deer traveled the little wild foxes that live upon the dead and dying at the edges of a herd. Heavy-shouldered nilghai moved on a line beside the deer. After them came the wild buffalo from the swamps, dark and ponderous, following the same promise of food and water. They did not yet form an army. They were separate groups that grazed, wandered, drank, and wandered again, but all of them were being drawn toward the same place."
        - id: ch04-b02
          speaker: narrator
          text: "At first, the smallest alarm could have scattered the wandering herds. A strange scent, one frightened leap, or a warning cry might have turned hundreds of animals back toward their old feeding grounds. Whenever the long, loose lines hesitated, however, some Jungle helper appeared to settle them. Sometimes Ikki the Porcupine bustled among them, full of fresh news. The feeding ahead was excellent, he said, only a little farther on. At other times Mang flew low over an open glade. He called cheerfully and showed by his easy flight that nothing dangerous waited there. When a whole line began to bend away from the chosen road, Baloo came shambling beside it with roots bulging from his mouth. His great clumsy body half frightened the uncertain animals and half played them back into place. None of these guides drove the herds openly. They only answered each doubt at the moment it arose. Many creatures still broke away. Some ran at the first alarm. Some lost interest and stopped where they found enough to eat. Others turned back toward familiar ground. Yet so many remained that the movement grew instead of fading. After another ten days, deer, pigs, and nilghai were no longer traveling in lines. They milled round and round inside a circle eight or ten miles across. The Eaters of Flesh moved along the rim of that circle, appearing wherever an opening formed. At the very center stood the village. Around it ripened the crops that had survived the summer. Men sat above the fields on machans, little platforms of sticks built on top of four tall poles. From those perches they shouted and waved to scare birds and other hungry thieves from the grain. The villagers saw scattered animals at first and did not understand what was gathering beyond the fields. Then the time for coaxing ended. Wolves, panthers, and the other flesh eaters closed the outer spaces. They did not attack the herds. They showed tooth and eye just near enough to turn every frightened head inward. The loose circle tightened, and all its weight pressed slowly toward the crops."
        - id: ch04-b03
          speaker: narrator
          text: "On a moonless night, Hathi and his three sons slipped down from the Jungle. Even with four enormous bodies moving together, they made no warning sound. They reached the machans from behind, wrapped their trunks around the supporting poles, and broke them as easily as stalks of flowering hemlock. Platforms tilted and collapsed. The men guarding the fields tumbled into the crops with sticks and baskets falling around them. Before they could rise, they heard the elephants' deep gurgling close to their ears. They ran for the village without waiting to see what stood in the dark. The fall of the platforms and the flight of the men startled the front ranks of the waiting herds. Bewildered deer surged over the edge of the grazing land and into the plowed fields. Once the first animals began to run, those behind could only follow. The open ground filled with backs, horns, and pounding feet. Sharp-hoofed, rooting wild pigs poured after the deer. They did not merely eat. Their snouts turned the soil, broke stems, and dug up roots. Whatever the deer left standing, the pigs spoiled. From the darkness beyond the fields, a wolf gave an alarm. The sound shook the crowded animals, and they rushed sideways in terror. When they slowed, another warning rose from a different point. The herds swung back again, trampling the same ground twice. Young barley disappeared beneath thousands of feet. Hooves cut the raised banks of the irrigation channels until the earth lay flat and water spread into mud. All night the animals fed, ran, crowded, and fed again. Before dawn, the pressure around the outside of the circle eased at one point in the south. The Eaters of Flesh had deliberately fallen back. A clear road opened, and drive after drive of buck poured through it toward safety. Other deer, bolder or hungrier, remained hidden in nearby thickets. They waited there for darkness, ready to return and finish the meal the next night."
        - id: ch04-b04
          speaker: narrator
          text: "The work was nearly finished before the villagers dared to leave their huts. At sunrise they looked across the fields and saw no unbroken crop. Barley had been eaten, rooted out, or stamped into mud. Irrigation banks were gone, and the soil bore so many tracks that no one could separate one herd from another. The loss was more than a ruined harvest. These people lived year after year as close to starvation as their walls stood close to the Jungle. They had no food to spare and no second crop waiting elsewhere. Unless they left, the empty fields meant death. Still they tried to continue the familiar work of the day. The tame buffaloes were driven toward the grazing grounds, but the deer had cleared away every edible thing. Hungry and restless, the village animals followed wild scents beyond the usual boundary. One after another, they wandered into the trees and joined their untamed relatives. They did not return when called. The villagers had also owned three or four small ponies. Those animals might have carried people or goods away, so they too had to be removed from the village's hopes. When twilight fell, the ponies lay in their stalls with their heads crushed by single terrible blows. No wolf or elephant had done that work. Only Bagheera's paw could strike with such clean force. And only Bagheera, proud and playful even in war, would have dragged the final carcass from the stable and left it in the middle of the open street where every villager must see it."
        - id: ch04-b05
          speaker: narrator
          text: "No one had the courage to light the usual field fires that night. Fire might have driven away a few deer or pigs, but the people had heard elephants moving beyond the ruined crops and knew the Jungle was watching. Darkness settled over the flattened fields without a single protective flame. Hathi and his three sons came down to glean whatever remained. They walked in broad lines, taking every patch the smaller animals had missed. A trunk could find grain beneath fallen stalks, and a great foot could uncover roots hidden under churned soil. Where Hathi gleans, no one needs to come afterward. By morning there was nothing worth searching for. The villagers met and made a desperate plan. They would open their stores of seed corn and eat that grain until the Rains arrived. Seed was meant for planting, but hunger would not wait for another harvest. Once rain softened the ground, they would leave their own fields and hire themselves out as servants. Perhaps a year of labor elsewhere would allow them to recover what this season had taken. Even while the village discussed survival, the grain dealer made a different calculation. His mud house held well-filled crates of corn. Because everyone else had lost so much, each measure in his store would bring a greater price. He imagined the desperate buyers and decided how much he could demand. But the elephants had not forgotten the grain. During the night, Hathi stood beside the dealer's house and felt along the wall with the point of one tusk. He found the corner, pressed, and picked the packed mud apart. The opening widened with each movement until a whole section broke away. Behind it stood a huge wicker chest, carefully plastered with cow dung to keep its precious contents dry and safe. Hathi drove his tusks through the basket. Wicker split, the plaster shell burst, and corn poured into the mud. His sons fed, trampled, and scattered it. By the time the loss was discovered, the village's plan for living until the Rains had disappeared with the grain dealer's hoped-for profit."
        - id: ch04-b06
          speaker: narrator
          text: "When the last store was gone, the Brahmin took his turn to explain the disaster. He had prayed to the village gods, repeated the proper words, and waited for an answer. No answer came. The attacks had not stopped, and each new loss had been worse than the one before it. Perhaps, he said, the villagers had unknowingly offended one of the gods who belonged to the Jungle. There could be no doubt that the Jungle itself had turned against them. If that was true, the old powers must be consulted. The villagers sent messengers to the nearest band of wandering Gonds. These were small, wise, very dark hunters who made their homes deep among the trees. Their fathers came from the oldest people in India, the first owners of the land, and they understood signs that field workers and village priests had forgotten. The Gond headman came alone. Since the village had asked for help, the people welcomed him with the best of what little food remained. He did not sit among them. He stood balanced on one leg, holding his bow, with two or three poisoned arrows thrust sideways through his topknot. He looked across the anxious villagers and their wrecked fields. Part of him seemed afraid of what had gathered there, and part of him seemed to despise the people for failing to understand it. The villagers asked whether his gods, the Old Gods, were angry with them. They asked what animal should be killed, what food should be offered, and what words might persuade those gods to lift the punishment. The Gond listened without interrupting, but he offered no prayer and named no sacrifice."
        - id: ch04-b07
          speaker: narrator
          text: "The Gond gave no spoken answer. He picked up a karela vine, the creeper that bears bitter wild gourds, and wove it across the temple doorway before the staring red image. Then he swept one hand through the open air toward the road to Khanhiwara. He returned to the Jungle and watched its people move. He knew that when the Jungle itself advances, only white men might hope to turn it. The villagers understood. Bitter gourds would soon grow where they worshiped, and they should save themselves while they could."
        - id: ch04-b08
          speaker: narrator
          text: "But a village is hard to tear from the ground. Every hut held some memory, every path led to a field, and every family hoped one more day might change its fortune. The people stayed while any summer food remained. When their stores ran low, they went into the Jungle to gather nuts. They never gathered in peace. Shadows with glaring eyes watched from between the trunks. Sometimes the eyes moved ahead of them in full daylight, rolling from cover to cover and never showing the body behind them. The villagers would lose courage and hurry back toward the wall. On trees they had passed less than five minutes earlier, they then found bark freshly stripped away. Great claw strokes had cut and chiseled the pale wood beneath. Each mark told them that something had followed close enough to touch them. The more tightly the people kept to their huts, the more boldly the wild creatures claimed the open land. Animals played, fought, and bellowed across the old grazing grounds beside the Waingunga. The sounds continued by day and night, until the village seemed like a small trapped thing surrounded by a living forest. The tame cattle sheds stood empty now. Their rear walls backed directly onto the Jungle, and no one had time or courage to patch the cracking plaster. Wild pigs rooted beneath those walls and trampled them down. Once the first gap opened, plants followed the animals. Thick, knotted vines hurried over the fallen earth. Their roots gripped the wet soil, and their long stems threw elbows across each piece of newly won ground. Behind the vines came coarse grass, rising stiff and close like the lances of a goblin army following a retreat. Seeds lodged in roof thatch and wall cracks. Green shoots appeared beside doorstones. Each morning the people saw the Jungle standing a little nearer than it had stood the evening before."
        - id: ch04-b09
          speaker: narrator
          text: "The unmarried young men fled first. They carried word everywhere that the village was doomed. Who could fight the Jungle or its gods, they asked, when even the village cobra had abandoned its hole beneath the peepul tree? Trade with the outer world faded as the paths across the open land grew dim. In time, Hathi's nightly trumpeting no longer troubled anyone. The villagers had nothing left for him to steal. Their crop and their seed were gone. The distant fields had already lost their shapes. Only charity from the English at Khanhiwara remained."
        - id: ch04-b10
          speaker: narrator
          text: "Still they put off leaving, one day after another, until the first Rains caught them. Water poured through the broken roofs. The grazing ground stood ankle deep. After the long summer heat, life burst from the earth all at once. Men, women, and children finally waded out through hot, blinding morning rain. At the gate they turned for one last look at home."
        - id: ch04-b11
          speaker: narrator
          text: "As the final burdened family passed through the gate, a crash of beams and thatch sounded behind the outer wall. Everyone turned. For one instant they saw a shiny black trunk rise like a great snake above the roofs. It flung a load of soaked thatch into the rain and vanished. Another roof crashed inward. Then came a sharp elephant squeal. Hathi had been taking the huts apart one by one. He curled his trunk around the edge of a roof and plucked it free as easily as a man might pluck a water lily. The wet thatch was heavy, and broken roof poles sprang in unexpected directions. One rebounding beam jabbed him. The wound was small, but he needed only that touch of pain to unchain all the strength and anger held in his body. Of all creatures in the Jungle, a wild elephant in rage is the most careless and complete destroyer. Hathi kicked backward. His foot struck a mud wall, and the whole side of the hut crumbled at once. Under the torrent of rain, the broken earth dissolved into streams of yellow mud. Hathi wheeled in the narrow lane with his trunk lifted and gave another squeal. He drove forward where there seemed no room for his body. He leaned first against a hut on his right, then one on his left. Roof beams slid loose. Painted walls bulged outward. Weak doors shivered into pieces beneath his knees and forehead. The little windowless rooms, which had seemed as solid as caves to the people inside them, folded and crushed like clay boxes. Behind their father came the three sons. They too remembered the old work at Bhurtpore. They pushed through walls, trod roof frames flat, and threw broken wood from the lanes until no line of the old street remained. Rain beat on their broad backs and washed clay down their legs while the village came apart around them."
        - id: ch04-b12
          speaker: mowgli
          text: "The Jungle will swallow these empty shells. The outer wall must come down too."
        - id: ch04-b13
          speaker: narrator
          text: "Mowgli's quiet voice came from the wreckage. Rain streamed over his bare arms and shoulders as he jumped away from a wall settling like a tired buffalo."
        - id: ch04-b14
          speaker: hathi
          text: "All in good time. My tusks were red at Bhurtpore! Sons, to the outer wall. Use your heads. Together. Now!"
        - id: ch04-b15
          speaker: narrator
          text: "All four elephants pushed side by side. The outer wall bowed, split, and fell. Through the torn gap, the villagers stared in silent horror at four savage heads streaked with clay. Then they fled down the valley without homes or food. Behind them, the village was ripped, tossed, trampled, and dissolved by the rain."
        - id: ch04-b16
          speaker: narrator
          text: "One month later, no street, doorway, or field boundary could be seen. A low, dimpled mound lay where the village had stood, covered everywhere in soft green shoots. Creepers crossed the fallen walls, grass hid the broken clay, and young growth rose through the soaked thatch. By the end of the Rains, roaring Jungle filled the place. Trees, vines, and weed had taken ground that had been under the plow less than six months before."
