audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: "measured, vivid, and storywise"
        timbre: "warm and resonant"
        pace: "unhurried"
        pitch: "medium-low"
    mugger:
      display_name: Mugger of Mugger-Ghaut
      tts:
        delivery: "ponderous, vain, and smoothly menacing"
        timbre: "thick and muddy"
        pace: "slow"
        pitch: "very low"
    adjutant:
      display_name: Adjutant
      tts:
        delivery: "dry, cutting, and self-important"
        timbre: "rasping and woody"
        pace: "measured"
        pitch: "medium-low"
    jackal:
      display_name: Jackal
      tts:
        delivery: "fawning, hungry, and quick-witted"
        timbre: "thin and wiry"
        pace: "quick"
        pitch: "medium-high"
    bridge_builder:
      display_name: Bridge Builder
      tts:
        delivery: "quiet, practical, and resolute"
        timbre: "firm and weathered"
        pace: "measured"
        pitch: "medium-low"
    english_companion:
      display_name: English Companion
      tts:
        delivery: "alert, restrained, and conversational"
        timbre: "clear and steady"
        pace: "measured"
        pitch: "medium"
  chapters:
    - id: ch01
      title: "Voices at Mugger-Ghaut"
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: "The Jungle Law says this. When you call Tabaqui your brother, when you invite the Hyena to feed, then you may declare a Full Truce with Jacala, the belly that runs on four feet."
        - id: ch01-b02
          speaker: mugger
          text: "Respect the aged! Companions of the River, respect the aged!"
        - id: ch01-b03
          speaker: narrator
          text: "It was a thick, muddy voice, with a croak and a whine in it, like something soft breaking in two. Yet nothing showed on the broad river except three square-sailed barges loaded with building stone. They had passed beneath the railway bridge and were steering around the sand-bar when the dreadful voice called again."
        - id: ch01-b04
          speaker: mugger
          text: "Brahmins of the River, show kindness to the old and infirm!"
        - id: ch01-b05
          speaker: narrator
          text: "A boatman sitting on the gunwale turned toward the voice, raised one hand, and shouted something that was certainly no blessing. The three heavy barges creaked away through the twilight. The wide Indian river looked more like a chain of connected lakes than a running stream. Its middle lay smooth as glass and reflected the sandy red sky. Yellow and deep purple stained the water close to the low banks. Small creeks fed the river during the wet season, but now their dry mouths hung uselessly above the waterline."
        - id: ch01-b06
          speaker: narrator
          text: "On the left bank, almost below the bridge, stood a village of mud, brick, thatch, and sticks. Its main street ran straight down to a rough brick landing where people could wade into the river one step at a time. Cattle filled the street as they went home to their sheds. Behind the houses lay low ground that the river flooded each year, leaving fields rich enough for lentils, rice, and cotton. This was Mugger-Ghaut, the village named for the old crocodile at its ford."
        - id: ch01-b07
          speaker: narrator
          text: "Night settled quickly over the low fields of lentils, rice, and cotton, all planted in ground the river flooded each year. Darkness spread across the reeds that fringed the elbow of the bend and the tangled grazing jungle behind them. Parrots and crows had finished chattering and shouting over their evening drink. They flew inland to roost and crossed the great outward stream of flying foxes. Then cloud after cloud of water birds came whistling and honking into the shelter of the reeds. Barrel-headed and black-backed geese passed with teal, widgeon, mallard, sheldrake, and curlews. Here and there, a flamingo crossed the darkening sky."
        - id: ch01-b08
          speaker: narrator
          text: "Last of all came a lumbering Adjutant-crane. Below him, reed beds darkened around the bend. Beyond them lay the tangled jungle where village cattle grazed. Each slow beat of the bird's wings looked as if it might be his final one."
        - id: ch01-b09
          speaker: mugger
          text: "Respect the aged, Brahmins of the River! Respect the aged!"
        - id: ch01-b10
          speaker: narrator
          text: "The Adjutant turned his head, swerved toward the voice, and landed stiffly on the sand below the bridge. Only then could anyone see what a rough brute he really was. From behind, he looked wonderfully respectable. He stood nearly six feet tall, like a proper bald-headed parson. From the front, he was a different creature. Not one feather covered his ugly head or neck. A horrible pouch of raw skin sagged beneath his chin, ready to hold whatever his pickax beak might steal. His long legs were thin, bare, and bony, yet he placed each one with delicate care. He admired them, smoothed his ash-gray tail feathers, glanced across the polished curve of one shoulder, and snapped into a perfect pose of attention."
        - id: ch01-b11
          speaker: narrator
          text: "A mangy little Jackal had been yapping with hunger from a low bluff. He pricked his ears, raised his tail, and scampered through the shallows to join the bird. Even the best jackals are worth very little, and this one stood at the very bottom of his kind. He was half beggar and half thief, cleaning whatever he could from village rubbish heaps. One moment he was desperately timid and the next wildly bold. He was always hungry, and his endless cunning never seemed to help him."
        - id: ch01-b12
          speaker: jackal
          text: "Ugh! May red mange take every dog in that village! I have three bites for every flea on me, all because I only looked at an old shoe in a cowshed. Only looked, mind you. Am I supposed to eat mud?"
        - id: ch01-b13
          speaker: narrator
          text: "He landed, shook himself miserably, and scratched below his left ear."
        - id: ch01-b14
          speaker: adjutant
          text: "I heard there was a newborn puppy inside that very shoe."
        - id: ch01-b15
          speaker: jackal
          text: "Hearing is one thing. Knowing is another."
        - id: ch01-b16
          speaker: narrator
          text: "The Jackal knew plenty of proverbs from listening beside the village fires. The Adjutant's voice rasped like a blunt saw cutting thick wood."
        - id: ch01-b17
          speaker: adjutant
          text: "Quite true. So while the dogs were busy elsewhere, I made certain about the puppy."
        - id: ch01-b18
          speaker: jackal
          text: "They were very busy. I had better keep away from the village scraps for a while. So there really was a blind puppy in the shoe?"
        - id: ch01-b19
          speaker: adjutant
          text: "It is here. Small, but welcome in a world where charity is dead."
        - id: ch01-b20
          speaker: narrator
          text: "The Adjutant glanced down his beak at his full pouch. The Jackal wailed that the world had turned to iron. Then his restless eye caught the tiniest ripple on the water, and his voice changed at once."
        - id: ch01-b21
          speaker: jackal
          text: "Life is hard for everyone. Even our excellent master, the Pride of the Ghaut and Envy of the River, must find food scarcer since the bridge was built. Still, though I would never say it to his noble face, he is far wiser and more virtuous than I am. His food surely never fails."
        - id: ch01-b22
          speaker: adjutant
          text: "A liar, a flatterer, and a jackal all hatch from the same egg. When a jackal admits he is gray, imagine how black he truly is."
        - id: ch01-b23
          speaker: narrator
          text: "The Adjutant muttered this to no one in particular. He could lie finely himself when he chose, but he had not seen what was coming. A soft grating sounded at the edge of the shoal. The Jackal spun around, for it is always wisest to face the creature you have been discussing."
        - id: ch01-b24
          speaker: narrator
          text: "A crocodile twenty-four feet long lay with his chin in the shallows. His hide looked like three layers of riveted iron, studded, ridged, and crested. Yellow upper teeth hung over his beautifully grooved lower jaw. This was the blunt-nosed Mugger of Mugger-Ghaut, older than anyone in the village. The village carried his name. Before the railway bridge he had been the demon of the ford, a killer, a man-eater, and a local godling all together. One faint ripple of his tail held him still. The Jackal knew that a single stroke could shoot that armored body from the water and up the bank like a rushing engine."
        - id: ch01-b25
          speaker: jackal
          text: "What a fortunate meeting, Protector of the Poor! We heard a delightful voice and came hoping for pleasant talk. While we waited, my foolish tongue happened to mention you. I trust you heard nothing."
        - id: ch01-b26
          speaker: narrator
          text: "He backed away with every word. Of course he had spoken loudly so the Mugger would hear. The Jackal knew flattery might earn him food. The Mugger knew it too, and each knew that the other knew. That suited them both perfectly."
        - id: ch01-b27
          speaker: narrator
          text: "The old brute pushed, panted, and grunted his way onto the bank, asking everyone to respect the old and infirm. His little eyes burned like coals beneath heavy, horn-covered lids at the top of his triangular head. His swollen, barrel-shaped body dragged between bent legs. Then he settled on the sand like a drifting log. Though the Jackal had seen the trick a hundred times, he still started. The Mugger had chosen the exact angle that a log would take after the season's current stranded it there. Habit made him careful even though he had come ashore only for pleasure. A crocodile is never completely full. If the likeness fooled the Jackal, he would not live to think about it."
    - id: ch02
      title: "The Watcher of the Ford"
      blocks:
        - id: ch02-b01
          speaker: mugger
          text: "My child, I heard nothing. The water was in my ears, and hunger had made me faint. Since the railway bridge was built, my own people have stopped loving me. It breaks my heart."
        - id: ch02-b02
          speaker: jackal
          text: "What shame, and such a noble heart! Men are all the same, if you ask me."
        - id: ch02-b03
          speaker: mugger
          text: "Oh, no. Men differ greatly. Some are thin as boat poles. Others are as fat as young ja... young dogs. I would never insult them without cause. After all these years, I find men, women, and children very good, one with another. Remember, child, whoever scolds the World will be scolded by the World."
        - id: ch02-b04
          speaker: adjutant
          text: "Flattery fills the stomach no better than an empty tin. What we have just heard, however, is wisdom."
        - id: ch02-b05
          speaker: narrator
          text: "He brought one foot down firmly. The Jackal began to mourn the ingratitude shown to so excellent a creature, but the Mugger corrected him."
        - id: ch02-b06
          speaker: mugger
          text: "Not ingratitude. They simply never think of others. From my usual place below the ford, I have watched them struggle with the new bridge. Its stairs are painfully hard to climb for old people and little children. The old matter less, of course, but those fat children truly grieve me. In a little while, the bridge will lose its novelty. Then my people's bare brown legs will come bravely splashing through the ford again, just as they did before. When that happens, the old Mugger will be honored once more."
        - id: ch02-b07
          speaker: adjutant
          text: "But I saw marigold wreaths floating from the Ghaut at noon today."
        - id: ch02-b08
          speaker: narrator
          text: "Throughout India, a marigold wreath is a sign of reverence."
        - id: ch02-b09
          speaker: mugger
          text: "A mistake, nothing more. The sweetmeat seller's wife loses more of her sight each year. She can no longer tell a floating log from the Mugger of the Ghaut. I was lying at the very foot of the steps when she threw that garland. Had she taken just one more step toward the water, I might have shown her a small difference between us. Still, she meant well. We must judge the loving spirit in which the offering was made."
        - id: ch02-b10
          speaker: jackal
          text: "What use is a marigold wreath once you are lying on the rubbish heap?"
        - id: ch02-b11
          speaker: narrator
          text: "The Jackal hunted for fleas while keeping one cautious eye on the Protector of the Poor."
        - id: ch02-b12
          speaker: mugger
          text: "True, but the rubbish heap that will carry me has not even been started. Five times I have watched the river pull away from the village and leave new land below the street. Five times I have watched the villagers rebuild their homes along the changed bank, and I shall watch them rebuild five times more. I am no faithless, fish-eating Gavial who wanders from Kasi today to Prayag tomorrow. I am the true and faithful watcher of this ford. The village bears my name for good reason. He who watches long enough will receive his reward at last."
        - id: ch02-b13
          speaker: jackal
          text: "I have watched for nearly my whole life, and all I have won is bites and blows."
        - id: ch02-b14
          speaker: adjutant
          text: "Ho! Ho! Ho! The Jackal was born in August, and the Rains arrived in September. Then he cried, 'I've never seen such a terrible flood!'"
        - id: ch02-b15
          speaker: narrator
          text: "The Adjutant had one especially unpleasant habit. At uncertain moments, a fit of twitching or cramp seized his legs. Though cranes are all immensely respectable and he looked more virtuous than most, he would burst into a wild war dance on his crooked stilts. His wings opened halfway and his bald head bobbed up and down. For reasons known only to him, the worst fits always came with his nastiest remarks. At the last word of his song he snapped back to attention, ten times more solemn than before."
        - id: ch02-b16
          speaker: narrator
          text: "The Jackal winced. He was three seasons old, but you do not answer an insult from someone with a yard-long beak who can drive it like a spear. The Adjutant was a famous coward. The Jackal was worse."
        - id: ch02-b17
          speaker: mugger
          text: "We must live before we can learn. Small jackals are common, child. A mugger like me is not. I say that without pride, for pride destroys. It is Fate, and no creature that swims, walks, or runs should argue with Fate. I am content with mine. Good luck, sharp eyes, and the sense to check whether a creek has another way out before entering it can carry one very far."
        - id: ch02-b18
          speaker: jackal
          text: "Yet I once heard that even the Protector of the Poor made a mistake."
        - id: ch02-b19
          speaker: narrator
          text: "There was spite in the Jackal's voice, but the Mugger agreed."
        - id: ch02-b20
          speaker: mugger
          text: "I did, and Fate rescued me. I was not full-grown then. It was three famines before the last, when the rivers carried far more water. I was young and thoughtless, and very little could make me happy. A flood covered the village, and I happily swam inland above the Ghaut to the rice fields. The mud there was deep and pleasant. That evening I found a pair of glass bracelets, which bothered me a little, and a shoe. I ought to have shaken off both shoes, but I was hungry. I learned better afterward."
        - id: ch02-b21
          speaker: mugger
          text: "I fed and rested. By the time I wanted the river again, the flood had dropped. I had to walk through the mud of the main street. Priests, women, and children all came out, and I looked kindly upon them. Mud is a poor place for fighting, especially when one must cross it on short legs. A boatman called for axes to kill the Mugger of the ford. But a Brahmin stopped him. He pointed to the water flowing ahead of me and said I was driving the flood before me. Surely, he told them, I must be the village godling. The people threw flowers, and one clever soul led a goat across the road."
        - id: ch02-b22
          speaker: jackal
          text: "Goat is so good. So very good!"
        - id: ch02-b23
          speaker: mugger
          text: "Too hairy. A goat found in the water often hides a cross-shaped hook. That one was safe. I accepted it and returned to the Ghaut with great honor. Later, Fate sent me the boatman who had wanted my tail cut off. His boat grounded on an old shoal that you would not remember."
        - id: ch02-b24
          speaker: adjutant
          text: "We are not all jackals here. Was it the long shoal made when the stone barges sank during the great drought? It lasted three floods."
        - id: ch02-b25
          speaker: mugger
          text: "There were two shoals, an upper one and a lower one."
        - id: ch02-b26
          speaker: adjutant
          text: "Yes, I remember now. A channel divided them, then dried away."
        - id: ch02-b27
          speaker: mugger
          text: "The boat grounded on the lower shoal. My well-wisher had been sleeping in the bow. Half awake, he jumped overboard into water that reached his knees, not his waist, and tried to push free. The empty boat slipped away from him, floated on with the river as it ran in those days, and grounded again below the next bend. I followed it. I knew other men would see the abandoned boat and wade out to pull it ashore."
        - id: ch02-b28
          speaker: jackal
          text: "Did they come?"
        - id: ch02-b29
          speaker: narrator
          text: "The scale of such hunting had filled the Jackal with awe."
        - id: ch02-b30
          speaker: mugger
          text: "They did, there and farther down. I stopped after three well-fed boatmen in one day. Only the last made a cry to warn the men on shore, and that was because I grew careless."
        - id: ch02-b31
          speaker: jackal
          text: "What magnificent sport! It must take remarkable cleverness and judgment."
        - id: ch02-b32
          speaker: mugger
          text: "Not cleverness, child. Thought. A little thought flavors life like salt on rice, and I have always thought deeply. My cousin the Gavial says following fish is difficult. He must learn every kind, separately and together. Rewa travel in companies with their mouths above water. Mohoo and little Chapta rise and roll on their sides. Batchua and Chilwa gather in shoals after a flood. Knowing all that is wisdom, certainly, but my cousin lives among the creatures he hunts. Mine live on land, in houses, among cattle. I must know what they do and what they mean to do. I add the tail to the trunk and build the whole elephant."
        - id: ch02-b33
          speaker: mugger
          text: "A green branch and iron ring above a doorway tell me a boy has been born there. Someday he will come down to play at the Ghaut. Gifts moving back and forth between houses tell me a girl will marry. She too must come to the Ghaut and bathe before her wedding, and I will be there. When the river changes course and lays fresh earth over old sand, the Mugger knows that too. Every sign tells me what my people will do and where they must come to do it."
        - id: ch02-b34
          speaker: jackal
          text: "What good is knowing where the river moves? It has shifted even in my short life."
        - id: ch02-b35
          speaker: narrator
          text: "Indian rivers often wander two or three miles in a season. They drown fields on one bank and spread rich silt on the other."
        - id: ch02-b36
          speaker: mugger
          text: "No knowledge is more useful, because new land brings new quarrels. The Mugger knows. Oh, the Mugger knows. When the water drains away, I creep into a channel that a man would swear could not hide a dog. Then I wait."
        - id: ch02-b37
          speaker: mugger
          text: "One farmer arrives and says he will plant cucumbers here and melons there in the new land the river gave him. He tests the rich mud with his bare toes. Another comes and claims his own places for onions, carrots, and sugar cane. They meet like two drifting boats and stare at each other from beneath large blue turbans. Each calls the other Brother, very politely, while they walk off to mark the boundaries. I hurry with them from point to point, keeping low in the mud, watching and listening."
        - id: ch02-b38
          speaker: mugger
          text: "Soon they argue. Hot words follow, then each man grabs the other's turban. Their iron-bound bamboo clubs rise, and at last one farmer falls backward into the mud. The other runs away. When he returns, the loser's body and club show that the boundary dispute is settled. Yet no one thanks the Mugger. They cry murder instead, and their families fight with sticks, twenty against twenty. My people are the broad-shouldered upland Jats, the Malwais of the Bet. They are good people. They never strike merely for amusement."
        - id: ch02-b39
          speaker: mugger
          text: "When the fighting ends, I wait far below the village, behind the kikar scrub. Under the stars, eight or nine broad-shouldered men carry the dead man down on a bed. Gray-bearded elders make a small fire, smoke, and nod toward one another and the body. They say English Law will bring a rope, and the killer's family will live in shame after he hangs in the jail square. The dead man's friends say to let him hang. They repeat the argument all night."
        - id: ch02-b40
          speaker: mugger
          text: "At last someone says it was a fair fight. They will accept blood money, a little more than the killer offered, and speak no more of it. Then they haggle over the price. The dead man was strong, they say, and he left many sons. Before the first light of sunrise, they touch his body with fire as custom requires. After that, the dead man comes downriver to me. He has no complaint about the settlement and says nothing more. Ah, my children, the Mugger knows. The Mugger knows, and my Malwa Jats are good people!"
        - id: ch02-b41
          speaker: adjutant
          text: "They are too tightfisted for my crop. Who can find a scrap after a Malwai?"
        - id: ch02-b42
          speaker: mugger
          text: "I find the Malwais themselves."
    - id: ch03
      title: "Ice, Iron, and the Bridge"
      blocks:
        - id: ch03-b01
          speaker: adjutant
          text: "In the old days at Calcutta of the South, everything went into the streets, and we could choose what we pleased. Those were delicious seasons. Now they clean the streets like the outside of an egg, and my people leave. Cleanliness is one thing. Dusting, sweeping, and sprinkling seven times a day would tire the gods themselves."
        - id: ch03-b02
          speaker: jackal
          text: "A jackal from down-country heard from his brother that every Calcutta jackal grows as fat as an otter in the Rains."
        - id: ch03-b03
          speaker: narrator
          text: "The Jackal had this news from a down-country jackal, who had heard it from a brother. That was enough proof for him. The mere thought of rain-fat jackals made his mouth water."
        - id: ch03-b04
          speaker: adjutant
          text: "The English are there too. They bring great fat dogs down the river in boats to keep those jackals thin."
        - id: ch03-b05
          speaker: jackal
          text: "Then they are as hardhearted as the people here. I should have known. Earth, sky, and water show no mercy to a jackal. Last season after the Rains, I found an Englishman's tents and ate a new yellow bridle. They prepare leather all wrong. It made me terribly sick."
        - id: ch03-b06
          speaker: adjutant
          text: "You fared better than I did. In my third season, when I was young and bold, I went to the river where the great English ships arrive. Those ships are three times the size of this village."
        - id: ch03-b07
          speaker: jackal
          text: "He has been as far as Delhi, and he says the people there walk on their heads."
        - id: ch03-b08
          speaker: narrator
          text: "The Mugger opened his left eye and studied the bird."
        - id: ch03-b09
          speaker: adjutant
          text: "It is true. A liar tells lies only when he expects belief. No one who had not seen those ships could believe this truth."
        - id: ch03-b10
          speaker: mugger
          text: "That sounds reasonable. What happened next?"
        - id: ch03-b11
          speaker: adjutant
          text: "The men carried huge pieces of white stuff out of the ship, and every piece slowly turned to water. Chips split away and lay scattered along the shore. The men hurried everything else into a house with very thick walls, as if the white stuff were precious. One boatman laughed, broke off a piece as large as a small dog, and threw it to me. All my people swallow first and think afterward. I followed our custom and swallowed it whole."
        - id: ch03-b12
          speaker: adjutant
          text: "At once a dreadful cold began in my crop and ran to the tips of my toes. I could not even speak. Never had I felt cold like that. I danced from pain and surprise until my breath returned. Then I danced again and cried out against the treachery of the world while the boatmen laughed themselves to the ground. Strangest of all, when my grief was over, nothing remained in my crop."
        - id: ch03-b13
          speaker: narrator
          text: "The Adjutant was trying his best to describe swallowing a seven-pound block of ice from Wenham Lake. It had crossed the ocean in an American ice ship, back before Calcutta made ice by machine. The bird did not know what ice was. The Mugger and Jackal knew even less. They could not understand either the sudden cold or why the white lump had vanished, so his finest story fell completely flat."
        - id: ch03-b14
          speaker: mugger
          text: "Anything may come from a ship three times the size of Mugger-Ghaut. Anything at all. My village is not small."
        - id: ch03-b15
          speaker: narrator
          text: "A whistle sounded above them on the bridge. The Delhi Mail slid across, every carriage bright with lamps. Below it, matching shadows raced over the dark river. The train clanked away into the night until nothing remained but the quiet water. The Mugger and Jackal had heard it so many times that neither even turned his head. Only the Adjutant looked up."
        - id: ch03-b16
          speaker: adjutant
          text: "Isn't that as marvelous as your ship?"
        - id: ch03-b17
          speaker: mugger
          text: "I watched that bridge being built, stone by stone, as every pier rose from the river. The workers were remarkably sure-footed for the most part. But when one fell, and some did fall, I was ready below. After the first pier was finished, the men stopped wasting time searching downstream for a body to burn. There again, I saved my people a great deal of trouble and firewood. Nothing about building the bridge was mysterious to me."
        - id: ch03-b18
          speaker: adjutant
          text: "I mean the thing crossing it and pulling covered carts. That is mysterious. Beyond doubt, it is a new breed of bullock. Someday it will lose its footing up there and fall like the workmen. Then the old Mugger will be ready."
        - id: ch03-b19
          speaker: narrator
          text: "The Jackal looked at the Adjutant, and the Adjutant looked back. Both knew the engine could be anything in the world except a bullock. The Jackal had often watched it from the aloe hedges beside the track. The bird had seen engines since the first locomotive ran in India. But from below, the Mugger had seen only the brass dome that looked a little like a bullock's hump."
        - id: ch03-b20
          speaker: mugger
          text: "Mm, yes. A new sort of bullock."
        - id: ch03-b21
          speaker: jackal
          text: "Certainly a bullock."
        - id: ch03-b22
          speaker: mugger
          text: "And yet it might be something else."
        - id: ch03-b23
          speaker: jackal
          text: "Certainly. Most certainly."
        - id: ch03-b24
          speaker: mugger
          text: "Certainly what? I had not finished. You said it was a bullock."
          emotion: angry
        - id: ch03-b25
          speaker: narrator
          text: "The Mugger could tell that the others knew more, and the thought angered him."
        - id: ch03-b26
          speaker: jackal
          text: "It is whatever the Protector of the Poor wishes it to be. I serve him, not the thing above the river."
        - id: ch03-b27
          speaker: adjutant
          text: "Whatever it is, the English built it. I would not lie on a sand-bar so close to their work."
        - id: ch03-b28
          speaker: mugger
          text: "You do not know the English as I do. One stayed here while the bridge was built. Each evening he took a boat onto the river. He shuffled his boots across the bottom boards and whispered, 'Is he here? Is he there? Bring me my gun.' I heard every sound before I saw him. His boots creaked, he puffed with effort, and his gun rattled as the boat worked up and down the river."
        - id: ch03-b29
          speaker: mugger
          text: "Whenever I took one of his workmen and spared the expense of firewood for burning the body, he came to the Ghaut. He shouted in a great voice that he would hunt me and free the river from the Mugger of Mugger-Ghaut. Me! I swam beneath his boat for hour after hour, listening while he fired his gun at floating logs. I waited until he had worn himself out. Then I rose suddenly beside him and snapped my jaws in his face. When the bridge was finished, he went away. That is how all the English hunt, except when someone hunts them."
        - id: ch03-b30
          speaker: jackal
          text: "Who hunts the English?"
        - id: ch03-b31
          speaker: narrator
          text: "The Jackal's sharp little voice rose with excitement."
        - id: ch03-b32
          speaker: mugger
          text: "No one hunts them now, but I hunted them once."
        - id: ch03-b33
          speaker: adjutant
          text: "I remember a little of that hunt. I was young then."
        - id: ch03-b34
          speaker: narrator
          text: "His beak clattered, and the Mugger began another tale."
        - id: ch03-b35
          speaker: mugger
          text: "I was already firmly settled here. My village was being built for the third time when my cousin the Gavial brought news of rich waters above Benares. At first I refused to leave. My cousin eats fish, and a fish eater cannot always tell good food from bad. But in the evenings I heard my own people talking beside the river. What they said matched his report and finally convinced me."
        - id: ch03-b36
          speaker: jackal
          text: "What did they say?"
        - id: ch03-b37
          speaker: mugger
          text: "Enough to make the Mugger of Mugger-Ghaut leave the water and take to his feet. I traveled only at night and followed the smallest streams whenever they helped me. The hot season had begun, so even those streams ran low. I crossed dusty roads and pushed through tall grass. I climbed hills by moonlight. I even climbed over bare rocks. Consider that well, children. At last I crossed the dry tail of Sirhind and found the little rivers whose waters flow toward the Ganges. I had traveled a full month from my own people and the river I knew. For a Mugger, it was an astonishing journey."
        - id: ch03-b38
          speaker: jackal
          text: "And what did you eat along the way?"
        - id: ch03-b39
          speaker: narrator
          text: "The Jackal kept his soul in his stomach, so the great land journey meant nothing to him."
        - id: ch03-b40
          speaker: mugger
          text: "Whatever I could find, Cousin."
        - id: ch03-b41
          speaker: narrator
          text: "In India, you call someone cousin only when you can claim a family tie. Muggers marry jackals only in old fairy tales, so the Jackal understood the threat. Alone, he might not have minded, but the Adjutant's eyes glittered at the ugly joke."
        - id: ch03-b42
          speaker: jackal
          text: "Of course, Father. I should have known."
        - id: ch03-b43
          speaker: narrator
          text: "The Mugger did not care to be called the father of jackals. He said so at great length."
        - id: ch03-b44
          speaker: jackal
          text: "The Protector of the Poor claimed kinship first. How could I know the exact relation? Besides, we eat the same food. He said so himself."
        - id: ch03-b45
          speaker: narrator
          text: "That made things worse. The Jackal was hinting that during his land journey, the Mugger had eaten whatever he found while it was still fresh. Any proper mugger, and most respectable wild creatures, keeps meat beside him until it reaches the right condition whenever he can. Along the river, calling someone an eater of fresh meat was a deep insult. It was almost as bad as calling a man a cannibal."
        - id: ch03-b46
          speaker: adjutant
          text: "That meal was eaten thirty seasons ago. Talking for thirty more will not bring it back. Tell us what happened when you reached those wonderful waters. If business stopped for every howling jackal, no town could survive."
        - id: ch03-b47
          speaker: narrator
          text: "The Mugger seemed grateful for the rescue. His story rushed on."
    - id: ch04
      title: "The Terrible Year"
      blocks:
        - id: ch04-b01
          speaker: mugger
          text: "By the Right and Left of Gunga, I had never seen such waters!"
        - id: ch04-b02
          speaker: jackal
          text: "Were they better than last season's great flood?"
        - id: ch04-b03
          speaker: mugger
          text: "Better? That was an ordinary five-year flood. A few drowned strangers, some chickens, and one dead bullock tumbled through muddy cross-currents. In the season I mean, the river ran low, smooth, and steady. Just as the Gavial promised, dead English people floated down shoulder to shoulder. I gained my girth and my depth that year, from Agra past Etawah and through the broad water at Allahabad."
        - id: ch04-b04
          speaker: adjutant
          text: "Ah, the eddy beneath the fort walls at Allahabad! They swept into it like widgeon entering reeds and circled round and round, just so!"
        - id: ch04-b05
          speaker: narrator
          text: "The Adjutant broke into his dreadful dance. The Jackal watched with envy. He was too young to remember the terrible Mutiny year they meant."
        - id: ch04-b06
          speaker: mugger
          text: "At Allahabad, one could lie quietly in the slack water beneath the fort, let twenty bodies circle past, and choose the best. Above all, the English wore none of the nose rings, anklets, and other ornaments that burden my women today. Loving jewels ends with a rope around your neck, as the saying goes. Every mugger in every river grew fat that season, but Fate made me fatter than all the rest. News traveled along the banks that the English were being hunted into the rivers. By the Right and Left of Gunga, we believed it. Wherever I traveled south, the water seemed to prove the tale. I went below Monghyr, past the tombs that look down upon the river."
        - id: ch04-b07
          speaker: adjutant
          text: "I know Monghyr. Since those days it has become a lost city. Few people live there now."
        - id: ch04-b08
          speaker: mugger
          text: "After that, I turned and worked slowly, lazily upstream. A little above Monghyr, a boat came down carrying living English people. I remember women lying beneath a cloth roof stretched over sticks, and they were crying aloud. In those days, no gun was fired at us, the patient watchers of the fords. All the guns were needed elsewhere. We heard their distant voices inland by day and night. The sound came and went whenever the wind changed."
        - id: ch04-b09
          speaker: mugger
          text: "I rose directly before the boat because I had never seen living English people, though by then I knew the dead ones well. A naked white child knelt at the side. He leaned over and tried to trail both hands through the moving river. It is a pretty thing to see how every child loves running water. I had already fed that day, though there was still a little room inside me. It was not hunger that brought me up. I came for sport and from the wish to examine something new."
        - id: ch04-b10
          speaker: mugger
          text: "The child's hands made such a clear target that I closed my jaws without even looking. I know my teeth struck true because I heard them ring together. But those white hands were tiny. The child snatched them away untouched. They must have passed exactly between tooth and tooth. I should have taken him crosswise at the elbows. Still, as I told you, I had risen only for sport and the desire to see new things. Everyone in the boat cried out, one after another. I surfaced again to watch them. The boat was much too heavy to overturn. They were only women, but anyone who trusts a woman might as well walk across duckweed on a pond."
        - id: ch04-b11
          speaker: jackal
          text: "A woman once gave me dried fish skin. I had hoped for her baby, but a mouthful of horse feed is better than a kick. What did your woman do?"
        - id: ch04-b12
          speaker: mugger
          text: "One of the women raised a short gun unlike any weapon I had seen before, or have seen since. She fired five times, one shot following another. I stayed there openmouthed, staring, with my whole head wrapped in smoke. Never had I known one small gun could strike so often. Five times, as quickly as I can sweep my tail, like this!"
        - id: ch04-b13
          speaker: narrator
          text: "The huge tail sliced past like a scythe. The Jackal, now completely caught by the story, barely jumped clear."
        - id: ch04-b14
          speaker: mugger
          text: "Not until the fifth shot did I sink. I rose again in time to hear a boatman telling all the women that I was most certainly dead. One bullet had slipped beneath a plate on my neck. I do not know whether it remains there today because my body will not let me turn my head far enough to see. Come closer and look for it, child. The mark will prove that every word of my tale is true."
        - id: ch04-b15
          speaker: jackal
          text: "Me? Would an eater of shoes and cracker of bones dare doubt the Envy of the River? May blind puppies bite off my tail if such a thought ever crossed my humble mind. The Protector of the Poor has kindly told his servant that a woman once wounded him. His word is proof enough. I shall tell every one of my children."
        - id: ch04-b16
          speaker: mugger
          text: "Too much politeness can insult as surely as too little. A guest may choke even on curds. I do not want your children hearing that the Mugger of Mugger-Ghaut received his only wound from a woman. If they feed as badly as their father, they will have plenty else to think about."
        - id: ch04-b17
          speaker: jackal
          text: "Forgotten already! No one said it. There was no white woman, no boat, and no event at all."
        - id: ch04-b18
          speaker: narrator
          text: "He swept his brush through the air as though wiping the whole memory away, then sat down with an expression of great dignity. The Mugger had failed for the second time that night to outwit his smaller friend. Neither creature held a grudge over such exchanges. Beside the river, eat and be eaten was fair law. The Jackal knew the Mugger might eat him if chance allowed, while the Mugger knew the Jackal would return whenever scraps remained after one of his meals."
        - id: ch04-b19
          speaker: mugger
          text: "Very many things happened. I left the women's boat behind and continued upstream. By the time I reached Arrah and the backwaters beyond it, no more dead English came down. For a while the river was empty. Then one or two bodies appeared in red coats. They were not English. They were Hindus and men from the east, all soldiers of one kind. Soon five or six floated abreast. At last, from Arrah all the way north beyond Agra, it seemed as though whole villages had walked together into the water."
        - id: ch04-b20
          speaker: mugger
          text: "Bodies came one after another from the little creeks, the way logs pour out during the Rains. Some had rested on shallow sand-banks. When the river rose, they rose in companies too. Later, the falling flood dragged them across the drowned fields and through the jungle, catching and pulling them by their long hair. All night as I went north, I heard guns firing inland. By day came the tramp of booted men across the fords. I heard the deep grinding noise a heavy cartwheel makes when it rolls over sand beneath the water. Every new ripple seemed to bring more dead."
        - id: ch04-b21
          speaker: mugger
          text: "At last even I was frightened. If such a thing could happen to men, how could the Mugger of Mugger-Ghaut escape? Then boats came up behind me without any sails. Smoke and fire poured from them continually, as if they were cotton barges burning on the river. Yet they did not sink, and they kept moving against the current."
          emotion: fearful
        - id: ch04-b22
          speaker: adjutant
          text: "I know those boats. They come to Calcutta of the South. Tall and black, with a tail beating the water behind them, and they are..."
        - id: ch04-b23
          speaker: mugger
          text: "And three times larger than my village, I suppose? The boats I saw were low and painted white. They struck the water on both sides instead of beating it with one tail, and they were no larger than the boats of anyone who speaks the truth. Even so, they frightened me badly. I climbed out of the water and began the long journey home. I hid all day. At night I walked over land whenever I could find no little stream to carry and conceal me."
        - id: ch04-b24
          speaker: mugger
          text: "I expected to find my village empty. Instead, my people were plowing, sowing, reaping, and moving through the fields as quietly as their own cattle."
        - id: ch04-b25
          speaker: jackal
          text: "Was there still good food in your river?"
        - id: ch04-b26
          speaker: mugger
          text: "More than I had any desire for. Even I, who certainly do not eat mud, grew tired of the silent ones and a little frightened by their endless arrival. My villagers first said all the English must be dead. But the bodies that floated facedown past the Ghaut were not English, as anyone could plainly see. Then my people decided that silence was safest. They would say nothing at all, pay whatever tax was demanded, and keep plowing their land."
        - id: ch04-b27
          speaker: mugger
          text: "After a long while, the river cleared. The bodies that came afterward had plainly drowned in floods. Food became harder to find, but I was glad. A little killing now and then does no harm. Yet even the Mugger may have enough."
        - id: ch04-b28
          speaker: jackal
          text: "Marvelous, truly marvelous! Merely hearing of so much food has made me fat. If I may ask, what did the Protector of the Poor do afterward?"
        - id: ch04-b29
          speaker: mugger
          text: "I locked my jaws on a vow never to wander again. I lived beside the Ghaut, close to my people, and watched over them year after year. They loved me so dearly that whenever my head rose, they threw marigold wreaths at it. Fate has treated me kindly, and the river has respected my aged and humble presence. There is only one thing."
        - id: ch04-b30
          speaker: adjutant
          text: "No creature is happy from beak to tail. What more does the Mugger of Mugger-Ghaut desire?"
        - id: ch04-b31
          speaker: mugger
          text: "That little white child I missed. He was very small, but I have never forgotten him. I am old now, and before I die, I want to try one new thing. The English are loud, foolish, and heavy-footed, so hunting one would offer very little sport. Still, I remember the old days above Benares, and perhaps the child remembers them too. If he still lives, he may walk beside some other river telling people how his two small hands once passed between the teeth of the Mugger of Mugger-Ghaut, and how he lived to make a tale of it."
        - id: ch04-b32
          speaker: mugger
          text: "Fate has been kind to me. Even so, the thought of that white child kneeling in the bow troubles my dreams. Now I will rest and think. Be silent, my children, and respect the aged."
        - id: ch04-b33
          speaker: narrator
          text: "He yawned, closed his jaws, turned stiffly, and shuffled to the top of the sand-bar. The Jackal and Adjutant moved beneath a stranded tree near the railway bridge."
    - id: ch05
      title: "The White Child Returns"
      blocks:
        - id: ch05-b01
          speaker: jackal
          text: "What a pleasant and profitable life! Yet not once did he tell me where he might have left a morsel along the bank. I have warned him a hundred times about good things floating downstream. How true it is that once the news is told, everyone forgets the jackal and the barber. And now he means to sleep! Arrh!"
        - id: ch05-b02
          speaker: narrator
          text: "The Jackal grinned up at the tall bird, waiting to hear whether the Adjutant agreed with his complaint."
        - id: ch05-b03
          speaker: adjutant
          text: "How could a jackal hunt beside a Mugger? Put a great thief with a small one, and anyone can guess who keeps the best pieces."
        - id: ch05-b04
          speaker: narrator
          text: "The Jackal whined and turned to curl beneath the tree. Suddenly he crouched low and stared through the tangled branches at the bridge almost directly overhead."
        - id: ch05-b05
          speaker: adjutant
          text: "What is it now?"
        - id: ch05-b06
          speaker: narrator
          text: "He opened his wings uneasily."
        - id: ch05-b07
          speaker: jackal
          text: "Wait, and we will see. The wind blows from us toward them, but those two men are not hunting us."
        - id: ch05-b08
          speaker: adjutant
          text: "Men? My work protects me. Everyone in India knows I am holy."
        - id: ch05-b09
          speaker: narrator
          text: "As a first-rate scavenger, the Adjutant was allowed to go almost anywhere without being harmed. He cleaned away things that no one else would touch, and people across India treated birds of his kind as holy. Trusting that protection, he did not move from beneath the bridge."
        - id: ch05-b10
          speaker: jackal
          text: "I am not worth striking with anything better than an old shoe, so I am safe enough. But listen to that step above us. No soft village sandal made such a sound. That is the heavy, shod foot of an Englishman. Listen once more. Hear iron touch iron on the bridge? That is a gun. Friend, those loud, heavy-footed, foolish English have come at last to speak with the Mugger."
        - id: ch05-b11
          speaker: adjutant
          text: "Then warn him. Someone very like a starving Jackal called him Protector of the Poor not long ago."
        - id: ch05-b12
          speaker: jackal
          text: "My cousin may protect his own hide. He has told me often enough that the English are harmless. English they must be, because no villager of Mugger-Ghaut would dare hunt him. Yes, that is a gun. With luck, we shall eat before dawn. He hears badly out of water, and this time the shooter is not a woman."
        - id: ch05-b13
          speaker: narrator
          text: "A polished gun barrel flashed for a moment in the moonlight between the iron girders. On the sand-bar below, the Mugger lay as still and dark as his own shadow. His forefeet were spread a little to either side. His great head drooped between them, and the creature who had survived floods, guns, and thirty seasons of cunning snored exactly like a mugger."
        - id: ch05-b14
          speaker: english_companion
          text: "It is a strange angle, nearly straight down, but the shot is safe enough. Aim just behind the neck. What a monster! The villagers will be furious if we kill him. He is the godling around here."
        - id: ch05-b15
          speaker: bridge_builder
          text: "I do not care. He took about fifteen of my best workers while we built this bridge. It is time to stop him. I have hunted him from a boat for weeks. Keep the Martini ready after I fire both barrels."
        - id: ch05-b16
          speaker: english_companion
          text: "Watch the recoil. A double four-bore is no toy."
        - id: ch05-b17
          speaker: bridge_builder
          text: "The Mugger can decide that. Here goes."
        - id: ch05-b18
          speaker: narrator
          text: "The great rifle roared like a small cannon, and two streaks of flame cut the darkness. Then came the hard, stinging crack of the Martini. Its long bullet could pass through a crocodile's armored plates as if they were nothing. But the explosive rounds from the first gun had already done their work. One struck just behind the Mugger's neck, a hand's breadth to the left of his spine. The other burst lower down, where the thick tail began."
        - id: ch05-b19
          speaker: narrator
          text: "In ninety-nine cases out of a hundred, even a mortally wounded crocodile can scramble into deep water and disappear. The Mugger of Mugger-Ghaut could not. The two exploding bullets had quite literally broken his body into three pieces. He hardly had time to move his head before life left him. Then the ancient watcher of the ford lay as flat upon the sand as the frightened Jackal."
        - id: ch05-b20
          speaker: jackal
          text: "Thunder and lightning! Lightning and thunder! Has the creature that drags the covered carts finally fallen from the bridge?"
          emotion: fearful
        - id: ch05-b21
          speaker: adjutant
          text: "It was only a gun. Nothing more than a gun. He is certainly dead. The English are coming."
        - id: ch05-b22
          speaker: narrator
          text: "The Adjutant spoke bravely, though every feather in his tail trembled. The two Englishmen hurried down from the bridge, picked their way across to the sand-bar, and stood over the dead Mugger. For a while they simply admired his tremendous length. Then a local man arrived with an ax and cut the huge head from the ruined body. Four men took hold and began dragging it together across the spit."
        - id: ch05-b23
          speaker: bridge_builder
          text: "The last time I had my hand inside a mugger's mouth, I was about five years old. We were coming down the river by boat toward Monghyr. People called children like me Mutiny babies. My poor mother was in that boat too. Many times afterward, she told me how she snatched up my father's old pistol and fired again and again at the beast's head."
        - id: ch05-b24
          speaker: english_companion
          text: "Then you have certainly taken revenge on the chief of the whole clan, even if the gun's kick made your nose bleed. Boatmen, haul that head up the bank. We will boil it clean and keep the skull. The exploding bullets have knocked the hide about too badly to save it. Come along to bed now. This was worth sitting awake all night for, wasn't it?"
        - id: ch05-b25
          speaker: narrator
          text: "Not three minutes after the men had gone, the Jackal and the Adjutant said exactly the same thing."
        - id: ch05-b26
          speakers: [jackal, adjutant]
          ensemble: duo
          text: "That was worth waiting up all night for."
