audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 沉稳生动，带着古老故事的智慧
        timbre: 温暖浑厚
        pace: 舒缓
        pitch: 中低
    mugger:
      display_name: 马格尔河阶的泽鳄
      tts:
        delivery: 慢吞吞又自负，温和中藏着威胁
        timbre: 粗浊低沉
        pace: 缓慢
        pitch: 很低
    adjutant:
      display_name: 秃鹳
      tts:
        delivery: 刻薄冷淡，带着一本正经的傲慢
        timbre: 粗哑干涩
        pace: 适中
        pitch: 中低
    jackal:
      display_name: 豺
      tts:
        delivery: 奉承机敏，永远透着饥饿与算计
        timbre: 尖细灵活
        pace: 稍快
        pitch: 中高
    bridge_builder:
      display_name: 造桥人
      tts:
        delivery: 务实果断，说话压低声音
        timbre: 坚实略哑
        pace: 适中
        pitch: 中低
    english_companion:
      display_name: 英国同伴
      tts:
        delivery: 警醒克制，语气随意而直接
        timbre: 清晰平稳
        pace: 适中
        pitch: 中
  chapters:
    - id: ch01
      title: 河阶暮色
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 《丛林法则》里有这样一段话。若你肯叫塔巴基一声“我的兄弟”，若你肯邀请鬣狗同来吃肉，那么，你也大可以同泽鳄杰卡拉宣布全面休战。说到底，它不过是一只长着四条腿、四处爬行的肚囊。
        - id: ch01-b02
          speaker: mugger
          text: 敬老！河中的伙伴们啊，敬重年老体弱的吧！
        - id: ch01-b03
          speaker: narrator
          text: 这声音粗浊得叫人发抖，像什么软东西断成了两截。里面既有颤音，又有嘶哑的咕叫，还夹着呜咽。宽阔的河面上却看不见说话者，只有一小队方帆木栓的驳船，满载建筑石料，刚从铁路桥下出来。桥墩把水流冲成一道沙洲，笨重的船只只好扳转船舵避让。三艘船并排而过，那可怕的声音又一次响起，船夫便坐在舷边转过身，抬手骂了一句绝不是祝福的话。船队随后吱嘎着顺流驶进暮色。
        - id: ch01-b04
          speaker: narrator
          text: 印度的大河宽得不像一条河，倒像一串相连的小湖。河心平滑如镜，映着沙红色天空，低矮两岸旁的水面却染着一块块昏黄和暗紫。雨季里，小溪会从这里流进大河，如今干涸的溪口全悬在水线以上。左岸几乎就在铁路桥底下，泥砖、茅草和树枝搭成了一座村庄。挤满归栏牲口的大街笔直通往河边，尽头是粗陋的砖砌码头。要洗澡的人，可以沿台阶一步步走进水里。这里叫马格尔河阶村。
        - id: ch01-b05
          speaker: narrator
          text: 夜色飞快落向低地的扁豆田、稻田和棉田。这些土地每年都会遭河水漫淹。黑暗也盖住河湾肘部的芦苇，还有静静苇丛后、牧场上纠缠成片的莽林。鹦鹉和乌鸦刚才还在晚间饮水处吵个不停，如今已飞回内陆归巢，迎面掠过一队队出动的狐蝠。成云成片的水鸟吹着哨，嘎嘎叫着钻进芦苇。里面有斑头雁、黑背雁、绿翅鸭、赤颈鸭、野鸭和翘鼻麻鸭，还有杓鹬，偶尔也夹着一只火烈鸟。最后，一只笨重的秃鹳慢慢飞来，每次扇翅都像最后一下。
        - id: ch01-b06
          speaker: mugger
          text: 河中的婆罗门啊，敬老！
        - id: ch01-b07
          speaker: narrator
          text: 秃鹳转过半边脑袋，偏向声音传来的地方，僵直地落在桥下沙洲上。直到这时，才看得出它实在是个恶棍。从背后看，它近六英尺高，很像一个规规矩矩的秃头牧师。正面却完全不同。光秃的脑袋和脖子没有一根羽毛，下巴底下垂着一个可怕的生皮囊，专门收起鹤嘴锄般的长喙偷来的东西。它的腿又长又细，只剩一层皮，却走得十分斯文。它得意地打量着双腿，梳好灰白尾羽，越过光滑的肩头看了一眼，然后挺直身体，摆成了立正姿势。
        - id: ch01-b08
          speaker: narrator
          text: 一只癞皮小豺刚才还站在低矮土崖上，饿得嗷嗷叫。听见动静，它竖起耳朵和尾巴，蹚过浅滩奔向秃鹳。它是豺中最低等的货色。虽说最好的豺也没多大用处，这一只却格外下贱，一半是乞丐，一半是罪犯，专靠翻村里的垃圾堆过活。它时而胆小得要命，时而狂妄得出奇，永远挨饿，满肚子诡计却从没靠诡计得到好处。
        - id: ch01-b09
          speaker: jackal
          text: 呸！愿红癞疮吃光这个村里的狗！我身上每一只跳蚤都配了三个牙印，全因为我看了看牛棚里的一只旧鞋。留神，我真的只是看了一眼。难道我能拿泥来填肚子吗？
        - id: ch01-b10
          speaker: narrator
          text: 豺凄惨地抖抖身子，挠起左耳根。
        - id: ch01-b11
          speaker: adjutant
          text: 我听说，那只鞋里有一条刚出生的小狗。
        - id: ch01-b12
          speaker: jackal
          text: 听说是一回事，亲眼知道又是另一回事。
        - id: ch01-b13
          speaker: narrator
          text: 豺很懂得搬弄谚语。这些话都是它每晚躲在一旁，偷听村民围着火堆谈天时，一句一句捡来的。
        - id: ch01-b14
          speaker: adjutant
          text: 说得对。趁狗群在别处忙碌，我替它们仔细照料了那条小狗，好把事情弄清楚。
        - id: ch01-b15
          speaker: jackal
          text: 它们确实忙得很。看来我暂时不能进村找残羹了。那鞋里真有一条瞎眼小狗？
        - id: ch01-b16
          speaker: adjutant
          text: 就在这里。虽说小了点，可如今慈善已经死绝，有总比没有好。
        - id: ch01-b17
          speaker: narrator
          text: 秃鹳斜着眼，越过自己的长喙，望了望鼓鼓囊囊的嗉囊。豺那双不安分的眼睛忽然捕捉到水面上一丝几乎看不见的细纹，立刻加快语速，提高了嗓门。
        - id: ch01-b18
          speaker: jackal
          text: 哎呀，如今的世道简直是铁打的！大家活着都不容易。我毫不怀疑，就连我们尊贵的主人、河阶的荣耀、全河嫉妒的对象，也觉得铁路桥建好以后，好吃的东西更难找了。不过换个角度看，这话我绝不敢当着他尊贵的面讲，他实在智慧又有德行。而我呢，唉，这两样我全都没有。所以，他的食物永远也不会断绝。
        - id: ch01-b19
          speaker: adjutant
          text: 骗子、马屁精和豺，本来就是从一只蛋里孵出来的。一只豺若肯承认自己是灰的，那它得黑成什么样！
        - id: ch01-b20
          speaker: narrator
          text: 水边响起船擦浅滩似的轻响。豺猛地转身，因为面对来者总最稳妥。眼前是一条二十四英尺长的鳄鱼，浑身的甲像铆了三层的锅炉铁板，上面凸起棱脊，还长着冠状硬甲。上排黄牙的尖端，恰好悬在凹槽分明的下颌上。它是马格尔河阶的钝吻泽鳄，比村里任何人都老，村庄也因它得名。铁路桥建起以前，它便是渡口的恶魔。它既是杀手和食人者，也是当地供奉的小神。
        - id: ch01-b21
          speaker: narrator
          text: 泽鳄把下巴搁在浅水里，只靠尾巴轻轻摆动，拨出几乎看不见的涟漪，让身体稳在原地。豺清楚得很，那条尾巴只要在水里猛扫一下，这头庞然大物便会带着蒸汽机般的冲力跃上河岸。
        - id: ch01-b22
          speaker: jackal
          text: 吉日相逢，穷人的保护者！我们听见这样悦耳的声音，才赶来盼一场甜美的闲谈。您看，我这个没有尾巴的狂妄东西，方才在这里等候时，竟胆敢谈起您来。我只希望，您什么也不曾听见。
        - id: ch01-b23
          speaker: narrator
          text: 豺本来就是故意说给泽鳄听的，因为它知道，奉承是换来食物的最好办法。泽鳄也知道豺说这些话只为讨吃的。豺知道泽鳄看穿了自己，泽鳄又知道豺明白自己已经看穿了它。于是三个家伙心照不宣，相处得十分满意。
        - id: ch01-b24
          speaker: narrator
          text: 老泽鳄一边推挪，一边喘气哼叫着爬上岸，嘴里还在劝人敬重年老体弱者。三角脑袋顶上，两只小眼睛在厚重的角质眼皮下像煤块发亮。它用拐杖似的腿推着鼓胀的桶形身体，趴稳以后立刻变成一根搁浅的漂流木。它甚至费心调准角度，完全合乎一根木头在这个季节、这个地点、这样的水流下自然搁浅的模样。豺早熟悉它的把戏，仍第一百次吓得一跳。泽鳄这回上岸只是消遣，可鳄鱼永远吃不饱。若豺真被伪装骗过，也就没有命事后评论了。
        - id: ch01-b25
          speaker: mugger
          text: 孩子，我什么也没听见。刚才河水灌满了我的耳朵，何况我还饿得发昏。铁路桥建好以后，我村里的子民便不再爱我了，这件事可伤透了我的心。
        - id: ch01-b26
          speaker: jackal
          text: 真可耻！还是这样一颗高贵的心。依我看，人全都一样。
        - id: ch01-b27
          speaker: mugger
          text: 不，人同人的差别很大。有的瘦得像船篙，有的肥得像小豺，不，是小狗。我从不无故辱骂他们。男人、女人和孩子模样各异，可漫长岁月告诉我，合在一起看，他们的滋味都很好。孩子，记住，斥责世人者，也会受世人斥责。
        - id: ch01-b28
          speaker: adjutant
          text: 奉承话进了肚子，还不如吞下一只空铁罐。不过，我们刚才听到的那番话倒真算得上智慧。
        - id: ch01-b29
          speaker: jackal
          text: 可他们竟忘恩负义地对待这样一位尊贵的主人。
        - id: ch01-b30
          speaker: mugger
          text: 不，不是忘恩负义，他们只是不替别人着想。我一直躺在渡口下属于自己的位置，已经仔细留意过了。新桥的台阶对老人和年幼的孩子都很难爬。老人其实不大值得费心，可那些胖乎乎的孩子实在叫我难过，真的叫我难过。再过一阵，等新桥的新鲜劲儿过去，我的子民便会像从前一样，光着棕色双腿，勇敢地蹚过渡口。到了那时候，老泽鳄又会得到敬重。
        - id: ch01-b31
          speaker: adjutant
          text: 可今天中午，我明明看见金盏花环从河阶边漂下来。
        - id: ch01-b32
          speaker: narrator
          text: 在整个印度，金盏花环都是敬奉的标志。
        - id: ch01-b33
          speaker: mugger
          text: 她弄错了，弄错了。那是糖果商的妻子。她的眼睛一年比一年昏花，已经分不清一根漂流木和我这条河阶的泽鳄。她扔下花环时，我正躺在河阶最下面，一眼便看出了这个错误。她若再往前走一步，我或许就能叫她看出我们之间的一点差别。不过她的心意是好的，我们必须看重这份供奉的诚意。
        - id: ch01-b34
          speaker: jackal
          text: 自己都躺上垃圾堆了，要金盏花环有什么用？
        - id: ch01-b35
          speaker: mugger
          text: 可那座要盛放我的垃圾堆，他们还没有开始造。河水五次从村庄前退去，在大街尽头造出新地，这些我亲眼看见了。村庄五次在河岸重建，我也亲眼看见了。我还会再看着它重建五次。我不是那种没心没肺、只会捕鱼的恒河鳄，今天待在迦尸，明天便游去钵罗耶伽。我才是渡口真正忠实的守望者。孩子，这座村庄以我为名，自有它的道理。守得足够久，终会得到报偿。
        - id: ch01-b36
          speaker: jackal
          text: 我已经守了很久，非常久，差不多守了我的一辈子。可到头来，命运给我的报偿只有狗牙咬出的伤口，还有人打下来的棍子。
        - id: ch01-b37
          speaker: adjutant
          text: 豺儿生在八月间，九月大雨落连天。它看着这般可怕的洪水，偏说自己从前从来没见过！
          emotion: happy
        - id: ch01-b38
          speaker: narrator
          text: 秃鹳大笑着又犯了老毛病。它的腿说不准什么时候便会奇痒或抽筋。鹤类全都体面得不得了，它看上去又比任何一只鹤都有德行。可一发作，它便跳起疯癫的瘸脚高跷战舞，翅膀半张，秃脑袋上下乱点。它总爱把最厉害的发作留给最刻薄的话。唱完最后一个字，它又猛地立正，比先前更像一只副官鹳。豺虽已活了三个季节，也只得缩起身子。对着一码长、能像标枪般刺来的尖喙，它可不敢计较侮辱。秃鹳虽是出名的胆小鬼，豺却比它更糟。
    - id: ch02
      title: 老泽鳄的智慧
      blocks:
        - id: ch02-b01
          speaker: mugger
          text: 我们得先活下来，才能继续学本事。还有一点，小豺遍地都是，孩子，可像我这样的泽鳄并不常见。尽管如此，我可不骄傲，因为骄傲会招来毁灭。你得明白，这一切都是命运。凡是在水里游、地上走或者奔跑的生灵，都不该对自己的命运多说什么。我对命运十分知足。只要运气好，眼睛尖，再养成一个习惯，每次进入小溪或回水湾以前，先停下来仔细想想那里有没有出口，便能办成许多事情，也能平安活过许多个季节。
        - id: ch02-b02
          speaker: jackal
          text: 我倒听说，连穷人的保护者也犯过一次错误。
        - id: ch02-b03
          speaker: mugger
          text: 不错，可那次命运帮了我。那时我还没完全长成，是最近那场饥荒以前第三场饥荒之前。凭恒河左右两岸起誓，当年的溪水真满！我年轻，又不爱动脑。洪水一来，谁能比我更高兴？那时候，一点小事便能叫我快活。村庄全淹在深水里，我越过河阶，向内陆游了很远，一直游进满是好泥的稻田。那晚我还找到一对玻璃镯子，着实添了不少麻烦。若我记得不错，还有一只鞋。我本该把两只鞋都甩掉，可我饿了。后来我才学聪明。
        - id: ch02-b04
          speaker: mugger
          text: 我吃饱歇够，准备回河里时，洪水已经退去。我只得穿过村中大街的泥。除了我，还会是谁呢？我的子民全跑了出来，有祭司，有女人，也有孩子。我怀着慈爱望着他们，因为泥地并不适合打架。一个船夫叫大家拿斧头来，杀掉渡口的泽鳄。婆罗门却拦住他说，快看，是这条鳄鱼把洪水赶走了，它是村里的小神。人们便向我撒来许多花。更妙的是，有人灵机一动，牵来一只山羊横过大路。
        - id: ch02-b05
          speaker: jackal
          text: 山羊真好吃，实在太好吃了！
        - id: ch02-b06
          speaker: mugger
          text: 毛太多，实在太多。要是在水里发现，里面多半还藏着十字形的钩子。不过那只山羊我收下了，并在众人的敬意中回到河阶。后来，命运又把那个想用斧头砍掉我尾巴的船夫送给了我。他的船搁在一道旧浅滩上。那地方年代太久，你不会记得。
        - id: ch02-b07
          speaker: adjutant
          text: 这里可不全是豺。是不是大旱那年运石船沉没后留下的长浅滩，熬过了三场洪水的那一道？
        - id: ch02-b08
          speaker: mugger
          text: 有两道，上游一道，下游一道。
        - id: ch02-b09
          speaker: adjutant
          text: 对，中间原有条水道，后来又干了。我一时忘了。
        - id: ch02-b10
          speaker: mugger
          text: 我那位好心人的船搁在下游浅滩。他睡在船头，半醒之间跳进水里推船，本以为水会齐腰。其实没有，只到膝盖。他的空船继续漂走，到下一处河湾下方又碰了底，那时候的河道就是这样。我一路跟着，因为知道一定会有人出来，把船拖回岸上。
        - id: ch02-b11
          speaker: jackal
          text: 他们真来了？
        - id: ch02-b12
          speaker: mugger
          text: 来了。那里和更下游都有人。我没有继续跟，可一天便得了三个吃得饱饱的船夫。除了最后一个，谁也没来得及叫一声，警告岸上的人。最后那次是我大意了。
        - id: ch02-b13
          speaker: jackal
          text: 多高贵的狩猎！得有多聪明，多会判断啊！
        - id: ch02-b14
          speaker: mugger
          text: 不是聪明，只是肯想。船夫说过，活着多想一点，就像米饭上撒一撮盐，而我一向想得很深。我的恒河鳄表亲吃鱼，它告诉我，追鱼有多么费力，每一种鱼又有多么不同。它得把所有鱼全认清，既认得成群的样子，也认得落单的模样，那确实算智慧。可它住在自己的子民中间。列瓦鱼成群游水，把嘴露在水面。穆胡鱼和小恰普塔鱼总是浮起来，侧身翻转。巴楚阿鱼和奇尔瓦鱼则在洪水以后聚成大群。
        - id: ch02-b15
          speaker: adjutant
          text: 每一种都很好吃。
        - id: ch02-b16
          speaker: mugger
          text: 表亲也这样说，还把捕鱼讲得天花乱坠。可鱼不会为了躲它的尖鼻子爬上岸。我的子民不同。他们住在陆地上，住在房屋里，生活在牲口中间。我得知道他们正在做什么，也得知道接下来准备做什么。把尾巴接到躯干上，我便能拼出整头大象。门上挂着绿枝和铁环，我就知道那家生了男孩，他总有一天会来河阶玩。人们来回送礼，我便知道姑娘要出嫁。成婚以前，她也会来河阶沐浴，而我会在那里。河道改变，原来的沙地变成新土地，我同样知道。
        - id: ch02-b17
          speaker: jackal
          text: 知道新土地有什么用？连我这一辈子里，河道都变过。
        - id: ch02-b18
          speaker: narrator
          text: 印度的河流总在河床里游移，一个季节有时就能横挪两三英里，淹掉一岸田地，又给另一岸铺上肥沃淤泥。
        - id: ch02-b19
          speaker: mugger
          text: 没有比这更有用的知识，因为新土地就意味着新争端。水刚退尽，我便爬进那些人以为连狗也藏不住的小溪，在里面等候。不久，一个农夫来了，说河流赐给他这片新地，他要在这里种黄瓜，在那里种甜瓜。他用赤脚趾试探肥沃的淤泥。过一会儿，另一个农夫又来，说他要在某处种洋葱，在某处种胡萝卜和甘蔗。两人像漂流的船碰在一起，各自在大蓝头巾底下转着眼珠瞪对方，嘴里还互称兄弟，然后一道去划新土地的边界。
        - id: ch02-b20
          speaker: mugger
          text: 我把肚皮贴得低低的，在泥里跟着他们从一点赶到另一点。很快，两人吵起来，说出火辣难听的话。他们扯掉彼此的头巾，又举起叫作拉提的棍棒。最后，一个仰面倒进泥里，另一个转身逃走。等逃走的人回来，争端已经解决，失败者那根箍铁的竹棍便是见证。他们却不感激我，只会大喊杀人。两家的亲眷各出二十人，又拿棍子互相殴打。
        - id: ch02-b21
          speaker: mugger
          text: 我的子民是住高地的贾特人，也是河中洲地上的马尔瓦人。他们不会为了取乐打人。事情结束后，我远远待在下游，躲到村庄看不见的金合欢灌木后。星光下，八九个肩膀宽阔的老人用床抬着死者下来。他们留着灰胡子，嗓音和我的一样低沉。人们点起一小堆火，这火我太熟悉了。他们抽着烟草，围成一圈向前点头，又侧过脸看看岸上的死者。他们说，英国法律会带着绳索来，凶手会在大监狱的广场上吊死，家族也会因此蒙羞。死者的朋友一遍遍说，那就让他吊死好了。
        - id: ch02-b22
          speaker: mugger
          text: 漫漫长夜里，这些话从头讲上一遍、两遍、二十遍。最后终于有人说，那一架打得公平，只要凶手比原先的价钱多付一点血钱，事情便不再提。死者身强力壮，又留下许多儿子，于是他们为价钱争个不休。可在阿姆拉特维拉，也就是太阳升起以前，他们仍按习俗给尸体点上一点火。随后死者便来到我这里，他自己也再不说话。啊哈，孩子们，泽鳄知道。我的马尔瓦贾特人真是好人！
        - id: ch02-b23
          speaker: adjutant
          text: 他们实在太小气，手也攥得太紧，我的嗉囊可从中捞不到多少好处。俗话说，马尔瓦人连擦亮牛角的东西都舍不得白白浪费。还有一句话说得更明白，一个马尔瓦人走过以后，谁还可能从地上捡到一粒遗漏的谷子？
        - id: ch02-b24
          speaker: mugger
          text: 啊，可我捡的并不是他们留下的谷子。我捡的是他们本人。
        - id: ch02-b25
          speaker: adjutant
          text: 从前在南方的加尔各答，什么东西都扔在大街上，我们尽可以挑挑拣拣。那才是精美丰盛的好年月。如今他们把街道打扫得像蛋壳外面一样干净，害得我的族类纷纷飞走。爱干净本来是一回事，可一天掸七次、扫七次，还要洒七次水，这样折腾下去，连诸神自己也会厌烦。
        - id: ch02-b26
          speaker: jackal
          text: 有一只从下游来的豺，是听它兄弟亲口说的。每到雨季，南方加尔各答的豺全都能吃得像水獭一样肥。光是想到这件事，我的口水都要流下来了。
        - id: ch02-b27
          speaker: adjutant
          text: 可那里有英国白脸人。他们用船运来又大又肥的狗，好让那些豺一直瘦下去。
        - id: ch02-b28
          speaker: jackal
          text: 原来他们也同这里的人一样铁石心肠！我早该想到。大地、天空和河水，没有一样肯对豺发一点慈悲。去年雨季以后，我见过一个白脸人的帐篷，还捡到一副新的黄皮笼头来吃。可那些白脸人根本不懂得用正确的方法鞣皮，那副笼头害我病得很重。
        - id: ch02-b29
          speaker: adjutant
          text: 那还比我的遭遇好。我活到第三个季节时，还是一只年轻而且大胆的鸟。我一路飞到那些大船驶入的河边。英国人的船足有这座村庄三倍大，我从来没见过那样的东西。
        - id: ch02-b30
          speaker: jackal
          text: 它最远也不过去过德里，却总说那里所有的人都倒过身子，拿自己的脑袋走路。
        - id: ch02-b31
          speaker: adjutant
          text: 我说的是真的。一个骗子只有在希望别人相信的时候才会撒谎。可这样一件事，任何没亲眼见过那些大船的人都不可能相信，所以它反而一定是真话。
        - id: ch02-b32
          speaker: mugger
          text: 这话倒合理。后来呢？
        - id: ch02-b33
          speaker: adjutant
          text: 人们正从船肚子里搬出一大块一大块白东西。那些东西没过多久便变成了水。许多碎片崩落，散在岸边，其余的被人飞快送进一座厚墙房子。一个船夫笑起来，拿起一块不过小狗那么大的，朝我扔来。我们整个族类吞东西从不多想，我也照老规矩一口咽了下去。寒气立刻从嗉囊开始，一直窜到每根脚趾尖。我冷得连话都说不出，船夫们却只顾大笑。
        - id: ch02-b34
          speaker: adjutant
          text: 我从没受过那样的冷。又悲伤，又惊讶，我只好不停跳舞，直到终于喘过气来。接着，我又跳又叫，痛斥这个世界虚假。船夫们一直嘲笑我，最后笑得全倒在地上。先不提那不可思议的寒冷，最神奇的事情是，等我哀号完毕，嗉囊里竟然什么也没有！
        - id: ch02-b35
          speaker: narrator
          text: 秃鹳已经竭尽全力，想说清吞下那东西以后是什么感受。其实它吞的是一块七磅重的温纳姆湖冰，由美国运冰船一路送来。那时加尔各答还不能用机器制冰。可秃鹳不知道冰是什么，泽鳄和豺知道得比它还少，因此这个本该神奇的故事根本没有打动听众。
        - id: ch02-b36
          speaker: mugger
          text: 只要一样东西来自一条有马格尔河阶三倍大的船，那无论是什么都有可能。别忘了，我的村庄本身可一点也不小。
        - id: ch02-b37
          speaker: narrator
          text: 头顶的桥上响起一声汽笛，德里邮车随即滑行而过。每一节车厢都灯火通明，车身的影子也忠实地沿着河水一路跟随。火车铿锵作响，很快又驶进黑暗。泽鳄和豺对这番动静早已习以为常，连头也没有转一下。
        - id: ch02-b38
          speaker: adjutant
          text: 这东西难道不比那条大船更神奇？
        - id: ch02-b39
          speaker: mugger
          text: 我亲眼看着它建起来，看着桥墩一块石头一块石头升高。那些工人大多脚下稳得出奇，可他们总有掉下来的时候。每逢那时，我早已准备好。第一座桥墩完成后，人们便再没想到去下游寻找尸体火化。你看，我又替他们省了许多麻烦。所以造桥没有什么稀奇。
        - id: ch02-b40
          speaker: adjutant
          text: 可桥上那个拖着有篷车辆的东西很稀奇。它一定是新品种的公牛。总有一天，它会站不稳，像工人一样掉下来。老泽鳄到时正好等着。
        - id: ch02-b41
          speaker: narrator
          text: 豺和秃鹳彼此看了一眼。若世上有一件事是它们再清楚不过的，那就是火车头无论是什么，也绝不会是一头公牛。豺一次次从铁路旁的龙舌兰篱笆后看过它，秃鹳从印度第一台机车开动起也见惯了火车。只有泽鳄始终待在桥下仰望那东西。从那个角度看，机车的黄铜穹顶确实很像公牛背上的隆起。
        - id: ch02-b42
          speaker: mugger
          text: 唔，对，确实是一种新品种的公牛。这样一想，整件事便完全说得通。当然，话又说回来，它也可能是别的什么东西……
        - id: ch02-b43
          speaker: jackal
          text: 当然是，肯定是。
        - id: ch02-b44
          speaker: mugger
          text: 什么？它可能是什么？我的话根本还没说完。明明是你自己说它是一头公牛，现在又来问我。
        - id: ch02-b45
          speaker: jackal
          text: 只要穷人的保护者喜欢，它是什么便是什么。我是您的仆人，只听您的话，可不是那件从桥上渡河的东西的仆人。
        - id: ch02-b46
          speaker: adjutant
          text: 不管它究竟是什么，反正一定是白脸人的造物。至于我，我绝不会躺在离那东西这么近的一片沙洲上休息。
    - id: ch03
      title: 兵变之河
      blocks:
        - id: ch03-b01
          speaker: mugger
          text: 你不像我这样了解英国人。造桥时，这里住着一个白脸人。每天晚上，他都会乘一条船出来，双脚在船底板上拖来拖去，低声念叨我在这里还是在那里，又叫人把枪拿给他。我还没看见他，便早已听清他在河上来来回回发出的每一点声音。木板在吱嘎，他在喘气，手里的枪也一路咔嗒乱响。
        - id: ch03-b02
          speaker: mugger
          text: 我每捡走他的一个工人，替人省下一大笔火化用的木柴，他就一定会来到河阶，放声大喊，说要猎杀我，要替河里除掉我这条马格尔河阶的泽鳄。除掉我！孩子们，我曾一小时又一小时游在他的船底，听他朝一根根漂流木开枪。等到确信他已经疲倦，我便浮到船边，当着他的脸猛合双颌。桥造好以后，他离开了。所有英国人都是这样打猎，除非他们自己成了猎物。
        - id: ch03-b03
          speaker: jackal
          text: 谁会猎白脸人？
        - id: ch03-b04
          speaker: mugger
          text: 如今没有谁了，可我从前猎过。
        - id: ch03-b05
          speaker: adjutant
          text: 那场狩猎我还记得一点，当时我很年轻。
        - id: ch03-b06
          speaker: mugger
          text: 那时我已经在这里稳稳安家。记得当时，我的村庄正在第三次重建。那位恒河鳄表亲给我带来消息，说贝拿勒斯上游有十分丰美的水域。起初我不愿前去，因为那位表亲只会吃鱼，不一定总分得出什么真正好，什么不好。后来我听见自己的子民在夜间谈话，他们说的事终于叫我确信不疑。
        - id: ch03-b07
          speaker: jackal
          text: 他们说了什么？
        - id: ch03-b08
          speaker: mugger
          text: 他们说的已经足够叫我这条马格尔河阶的泽鳄离开水域，用四脚在陆地上走路。我借着夜色赶路，只要有最小的溪流可用，便从水中前进。可热季刚开始，所有溪水都很浅。我穿过一条条尘土飞扬的大路，钻过没顶的高草，在月光下面爬上一座又一座山。孩子们，我甚至靠四脚爬过坚硬的岩石，你们可要好好想想这件事。我越过无水的锡尔欣德尾端，才找到那些朝恒河方向流去的小河。我离开熟悉的河与自己的子民，足足走了一个月。那可真是一段非同寻常的旅程。
        - id: ch03-b09
          speaker: jackal
          text: 路上吃什么？
        - id: ch03-b10
          speaker: mugger
          text: 找到什么，就吃什么，表亲。
        - id: ch03-b11
          speaker: narrator
          text: 在印度，除非觉得多少能攀上一点血缘关系，否则不会管别人叫表亲。可只有古老的童话里，泽鳄才会娶一只豺。豺立刻听懂了这个恶毒的笑话，明白自己为何突然被抬进泽鳄的家族圈子。若只有它们两个，它原不会在意。可秃鹳的眼睛正因这句话笑得发亮。
        - id: ch03-b12
          speaker: jackal
          text: 当然，父亲，我早该想到。
        - id: ch03-b13
          speaker: narrator
          text: 泽鳄可不愿做豺的父亲，当场说了许多难听话。
        - id: ch03-b14
          speaker: jackal
          text: 穷人的保护者亲口认了亲，我哪记得清是哪一辈？何况我们吃同一种食物。
        - id: ch03-b15
          speaker: narrator
          text: 豺是在暗示，泽鳄一路陆行时，每天都把猎物趁新鲜吃掉，不曾留在身边，等食物达到合宜而体面的状态。凡有自尊的泽鳄，以及大多数野兽，只要办得到，都会先把肉存上一阵。事实上，在河床一带，骂谁是“吃鲜肉的”，是最难听的蔑称之一，几乎同骂人是食人族一样恶毒。
        - id: ch03-b16
          speaker: adjutant
          text: 那些东西三十个季节前便吃完了，再谈三十个季节也回不来。现在说说，走完那段惊人的陆路以后发生了什么。若每只豺一嗥叫，全城便停下买卖，那还得了。
        - id: ch03-b17
          speaker: narrator
          text: 泽鳄感激这场解围，立刻说了下去。
        - id: ch03-b18
          speaker: mugger
          text: 凭恒河两岸起誓，我从没见过那样的水域！
        - id: ch03-b19
          speaker: jackal
          text: 比上个季节的大洪水还好？
        - id: ch03-b20
          speaker: mugger
          text: 那场洪水不过五年一次的寻常光景。浑浊的横流里，只有一小撮淹死的陌生人、几只鸡和一头死公牛。我说的那一年完全不同。河水很低，水面平滑，流得也很均匀。正如恒河鳄事先告诉我的，死去的英国人一个挨一个漂来。就在那一季，我长足了腰围，也长足了身体的厚度。他们从阿格拉漂来，经过伊塔瓦，又经过阿拉哈巴德一带的宽阔水域。
        - id: ch03-b21
          speaker: adjutant
          text: 阿拉哈巴德城堡墙下那道回流！他们像赤颈鸭扑进芦苇，漂进去便一圈圈打转，就像这样！
        - id: ch03-b22
          speaker: narrator
          text: 秃鹳又跳起可怕的战舞，豺羡慕地看着。它年纪太小，不可能记得它们说的那场兵变惨年。
        - id: ch03-b23
          speaker: mugger
          text: 在阿拉哈巴德的缓流里，我只要静静躺着，尽可放过二十个，再从中挑一个。最妙的是，那些英国人不像如今我的女人，浑身累赘地戴满首饰、鼻环和脚镯。爱戴饰物，最后便会拿绳索当项链。那一年，每条河里的泽鳄都吃胖了，可我的命运注定我比它们全都更胖。
        - id: ch03-b24
          speaker: mugger
          text: 消息说，英国人正被赶进河里。凭恒河两岸起誓，我们全信了。我一路向南，越过蒙吉尔和俯瞰河流的墓冢，仍相信这话。
        - id: ch03-b25
          speaker: adjutant
          text: 我知道蒙吉尔。那以后它便成了失落的城，如今没多少人住在那里。
        - id: ch03-b26
          speaker: mugger
          text: 后来我慢吞吞地逆流而上。走到蒙吉尔上方不远，一船白脸人漂了下来，而且全是活的。我记得那是一群女人，躺在一块用支架撑起的布篷下面，放声哭喊。那些年月，谁也不朝我们这些渡口守望者开枪。所有枪都在内陆别处忙着。昼夜都能听见枪声，风向一变，那声音便忽近忽远。
        - id: ch03-b27
          speaker: mugger
          text: 我把整个身子浮到船前。死去的白脸人我很熟悉，活的却从没见过。一个赤身的白孩子跪在船边，探下身体，偏要把两只手拖进河里。孩子这样喜爱流动的水，看起来真是一件美事。那天我已经吃过，可肚子里还剩下一点空处。不过我扑向那双手，只是为了取乐，并不是为了食物。我也想看看这种新鲜事物。
        - id: ch03-b28
          speaker: mugger
          text: 那双手是再清楚不过的目标，我合嘴时甚至没有多看。两颌明明准确地撞在一起，这一点我十分肯定，孩子却飞快把手缩回，毫发无损。那双白色小手一定穿过了牙齿与牙齿之间。我本该横着咬住他的两只胳膊肘。不过刚才说过，我浮上去只为取乐。船上的人一个接一个尖叫起来，我很快又浮上去看。可船太重，我掀不翻。她们虽然只是一群女人，可信任女人的人，终会在池塘的浮萍上行走。凭恒河左右两岸起誓，这话是真的！
        - id: ch03-b29
          speaker: jackal
          text: 有个女人给过我一点干鱼皮。我本来想吃她的婴儿，不过得到马料总好过挨马一脚。你那个女人做了什么？
        - id: ch03-b30
          speaker: mugger
          text: 她拿一把我此前此后都没见过的短枪，接连向我开了五枪。我张着嘴，脑袋罩在烟里。五枪快得像我甩一下尾巴。
        - id: ch03-b31
          speaker: narrator
          text: 话音刚落，那条巨大的尾巴便像镰刀一样横扫过去。豺听故事听得越来越入神，这时只来得及拼命往后一跳，才没有被当场扫中。
        - id: ch03-b32
          speaker: mugger
          text: 直到第五枪以后，我才沉下水去。再浮起来时，恰好听见一个船夫告诉那些白女人，说我肯定已经死了。一颗子弹钻进我颈部的一块甲片下面。如今它还在不在，我不知道，因为我的头转不过去。孩子，替我看看吧。看见那颗子弹，也就能证明我的故事是真的。
        - id: ch03-b33
          speaker: jackal
          text: 我？我不过是个吃旧鞋、啃骨头的东西，怎么胆敢怀疑全河嫉妒的对象？倘若我卑微的心里闪过一丝这样的念头，就让瞎眼的小狗咬掉我的尾巴！穷人的保护者已经屈尊告诉我这个奴仆，他一生中曾经受过一次伤，而且是一个女人打伤的。知道这些便足够了。我会把故事讲给我所有的孩子，绝不向您索要任何证据。
        - id: ch03-b34
          speaker: mugger
          text: 过分有礼，有时并不比过分无礼高明。俗话说得好，凝乳也能噎死客人。我不希望你的任何一个孩子知道，马格尔河阶的泽鳄一生唯一的一次受伤，竟然伤在一个女人手里。要是它们同自己的父亲一样，弄到的肉少得可怜，自然会有许多别的事值得操心。
        - id: ch03-b35
          speaker: jackal
          text: 早就忘得一干二净了！这些话从来没人说过！根本没有什么白女人，也没有那条船，什么事情都没有发生过！
        - id: ch03-b36
          speaker: narrator
          text: 豺用力摆了摆尾巴，表示白女人、船和那场枪击都已经从记忆里擦得干干净净，然后摆出一副一本正经的样子坐下。泽鳄那一夜第二次想占朋友的上风，又一次失败了。不过它们谁也不会为这种事记仇。吃与被吃，本来就是河边公平的法则。泽鳄每次吃完一餐，豺总能从剩下的东西里分到属于自己的那一份。
        - id: ch03-b37
          speaker: mugger
          text: 其实发生过许多事。我离开那条船，继续逆流而上。到了阿拉，又到了城后的回水湾，便再看不见死去的英国人。河面空了一阵，接着漂来一两个穿红衣的死者。他们不是英国人，却全属同一种人，有印度教徒，也有普尔比亚人。后来，他们五个六个并排漂来。到最后，从阿拉一路向北，越过阿格拉，简直像一座又一座村庄全走进了水里。
        - id: ch03-b38
          speaker: mugger
          text: 尸体像雨季的木头，从一条条小溪里接连漂出。河水上涨时，他们成群从歇息过的浅滩浮起来。洪水退去，又拖着他们的长发，带他们穿过田野和丛林。一路向北的夜里，我都听见枪声。白天则听见穿鞋的脚涉过渡口，也听见沉重车轮在水下沙地上滚动的声音。每一道涟漪都送来更多死者。
        - id: ch03-b39
          speaker: mugger
          text: 最后连我也害怕起来。我对自己说，这样的事情若能发生在人身上，马格尔河阶的泽鳄又怎么逃得掉？河上还有一艘艘没有帆的船从我身后赶来。它们一直燃烧，像运棉船有时起火那样，却始终不肯沉没。
        - id: ch03-b40
          speaker: adjutant
          text: 那种船也去南方的加尔各答。它们又高又黑，用尾巴拍打身后的水，而且……
        - id: ch03-b41
          speaker: mugger
          text: 你说的那种船有我的村庄三倍大。可我见到的船又低又白，在船身两侧拍水，大小也没有超过一个说真话的人所能相信的限度。它们把我吓得离开河水，返回自己的河。我白天躲藏，夜里步行。只有找到小溪时，才借水赶一段路。
        - id: ch03-b42
          speaker: mugger
          text: 回到村庄时，我根本不敢指望还能见到一个子民。可他们仍旧在田里耕耘、播种、收割，仍旧来来往往，安静得就像他们自家的牛。
        - id: ch03-b43
          speaker: jackal
          text: 河里还有好吃的吗？
        - id: ch03-b44
          speaker: mugger
          text: 多得超过了我的任何欲望。连我都厌倦了，我可不是吃泥的东西。那些不断漂来的沉默者也把我吓得不轻。村民先说英国人全死了，后来他们看出，脸朝下随水漂来的根本不是英国人。于是他们又说，最好什么也别讲，只管缴税耕地。过了很久，河水才恢复清澈。后来漂下来的，一看便知道只是遭洪水淹死的人。那时食物虽不如以前好找，我心里却由衷高兴。这里杀一点，那里杀一点，并不是坏事，可连泽鳄也有满足的时候。
        - id: ch03-b45
          speaker: jackal
          text: 真是神奇！光听这么多美食，我都胖了。后来，穷人的保护者做了什么？
        - id: ch03-b46
          speaker: mugger
          text: 我对自己说，凭恒河左右两岸起誓，我还咬紧双颌立下这个誓言，从此再也不四处漫游。于是我回到河阶旁边，紧挨着自己的子民，一年又一年地守望他们。他们是那么爱我，只要看见我的脑袋从水里浮起，便朝我抛来一串串金盏花环。是的，我的命运一直待我很好，这条河也肯敬重我这样贫弱而衰老的存在。只是……
        - id: ch03-b47
          speaker: adjutant
          text: 没有谁从长喙到尾巴尖都称心。你还缺什么？
        - id: ch03-b48
          speaker: mugger
          text: 那个没吃到的白孩子。他当时很小，我却一直没有忘记。如今我老了，死前还想尝试一次新东西。不错，那一族脚步沉重、吵闹又愚蠢，猎他们也没有多少乐趣。可我记得贝拿勒斯上游的旧日时光。若那个孩子还活着，他一定也还记得。或许他正沿某条河岸来来去去，告诉别人自己怎样把双手伸进马格尔河阶泽鳄的牙齿之间，还活下来把这件事说成故事。
        - id: ch03-b49
          speaker: mugger
          text: 我的命运待我非常好，可一想到船头那个小小的白孩子，这件事有时仍会在梦里折磨我，让我不能安睡。现在我要休息，安静地好好想一想。孩子们，别再说话了，也别忘记敬重年老体弱的。
    - id: ch04
      title: 沙洲上的枪声
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 泽鳄僵硬地转过身体，蹒跚爬向沙洲顶端。豺和秃鹳一道退开，藏到一棵搁浅的树后。那棵树横在最靠近铁路桥的一头，正好遮住它们。
        - id: ch04-b02
          speaker: jackal
          text: 它这一生可真愉快，也真有收获。可你一定要留心，从头到尾，它连一次也没想到告诉我，哪一段河岸可能还剩着一小口肉。我却足足告诉过它上百次，有什么好东西正在下游水里打滚着漂来。那句老话说得多么准确，消息一经说完，全世界便立刻忘了豺和理发匠。如今它倒好，舒舒服服地爬上沙洲去睡了！
        - id: ch04-b03
          speaker: adjutant
          text: 豺怎么能同泽鳄一起打猎？一个是大贼，一个是小贼，谁得到残羹还用问吗？
        - id: ch04-b04
          speaker: narrator
          text: 豺转过身，不耐烦地哼哼着，正要蜷缩到树干下面。忽然，它伏低身体，透过一根根湿淋淋的枝条，抬头望向几乎就在头顶的铁路桥。
        - id: ch04-b05
          speaker: adjutant
          text: 又怎么了？
        - id: ch04-b06
          speaker: jackal
          text: 等看清再说。风从我们这里吹向他们，他们闻不到我们。况且，桥上那两个人本来也不是来找我们的。
        - id: ch04-b07
          speaker: adjutant
          text: 是人吗？我的职分会保护我。全印度都知道我是神圣的。
        - id: ch04-b08
          speaker: narrator
          text: 秃鹳是头等食腐鸟，获准随意出入，所以从不畏缩。
        - id: ch04-b09
          speaker: jackal
          text: 除了旧鞋，谁也不会觉得我值得打一下。再听那脚步！那不是乡下人穿的皮鞋，是白脸人钉了掌的鞋。仔细听，桥上还有铁碰铁的声音。那是一支枪！朋友，那些脚步沉重、愚蠢的英国人，是来同泽鳄谈话的。
        - id: ch04-b10
          speaker: adjutant
          text: 那你去警告它。不久前，有个很像饿豺的家伙还称它为穷人的保护者。
        - id: ch04-b11
          speaker: jackal
          text: 让我的表亲自己保护那张皮吧。它一遍又一遍告诉我，白脸人没有什么可怕。来的也一定是白脸人，因为马格尔河阶没有一个村民胆敢追它。瞧，我就说那是一支枪！如今只要运气好，天亮以前我们便有肉吃。泽鳄离开水便听不清楚，而且这一回，来的可不是女人。
        - id: ch04-b12
          speaker: narrator
          text: 一根擦得发亮的枪管，在月光下的桥梁铁架间映亮了片刻。泽鳄仍趴在沙洲顶端，静得如同自己的影子。它的两只前脚略微向外张开，硕大的脑袋垂在中间，完全没有察觉头顶的人。它发出的鼾声像什么呢？只能说，像极了一条睡熟的泽鳄。
        - id: ch04-b13
          speaker: english_companion
          text: 这一枪角度古怪，几乎要直直朝下，并不好打，不过稳妥得很。最好瞄在颈后试试。老天，好大一头畜生！可要是打死它，村民准会气得发疯。它是这一带的德奥塔，也就是小神。
        - id: ch04-b14
          speaker: bridge_builder
          text: 我才不在乎。造桥时，它吃了我大约十五个最好的苦力，早该叫它住手了。我乘船追了它整整好几星期。等我把这支枪的两管都打出去，你立刻准备好，用马蒂尼步枪补射。
        - id: ch04-b15
          speaker: english_companion
          text: 小心后坐力，四号双管枪可不是闹着玩的。
        - id: ch04-b16
          speaker: bridge_builder
          text: 那得由它决定。开火！
        - id: ch04-b17
          speaker: narrator
          text: 一声巨响像小炮轰鸣。其实最大号的猎象枪，同某些火炮并没有多大差别。两道火焰同时射出，紧接着又传来马蒂尼步枪刺耳的炸裂声。它的长子弹能轻易洞穿鳄鱼的甲片，真正致命的却是两颗爆炸弹。一颗打在泽鳄颈后，落在脊椎左侧一掌宽的地方。另一颗打得更低，在尾巴起始处炸开。
        - id: ch04-b18
          speaker: narrator
          text: 一百条受致命伤的鳄鱼里，九十九条还能凭最后一点力气，挣扎着爬进深水，从猎人眼前逃走。可这一次，马格尔河阶的泽鳄实实在在被两颗爆炸弹打成了三截。生命离开以前，它几乎没能动一下沉重的脑袋。最后，它同身旁那只瘦小的豺一样，扁扁地趴在沙上，再也没有一点声息。
        - id: ch04-b19
          speaker: jackal
          text: 雷霆加闪电！闪电加雷霆！拖着有篷车辆过桥的东西终于摔下来了吗？
          emotion: fearful
        - id: ch04-b20
          speaker: adjutant
          text: 这不过是一支枪，没有别的。只是一支枪罢了。它这回肯定已经死了。瞧，那两个白脸人正从桥上下来了。
        - id: ch04-b21
          speaker: narrator
          text: 秃鹳嘴上说得镇定，连尾羽都在不停发抖。两个英国人已经从桥上匆匆跑下来，又穿过浅水走上沙洲。他们站在尸体旁边，从头到尾打量着，赞叹泽鳄惊人的身长。随后，一个跟来的本地人拿斧头砍下了那颗硕大的脑袋，另外四个人合力把它拖过长长的沙嘴。
        - id: ch04-b22
          speaker: bridge_builder
          text: 上一次我的手伸进泽鳄嘴里，我大约只有五岁。那时我们乘船顺流而下，正要去蒙吉尔。我是个所谓的兵变婴儿。可怜的母亲也在那条船上。后来她常告诉我，她怎样拿起父亲的旧手枪，一枪又一枪朝那畜生的脑袋开火。
        - id: ch04-b23
          speaker: english_companion
          text: 你总算向这一族的头领报了仇，哪怕后坐力震得你鼻子流血。喂，船夫们！把那颗脑袋拖上河岸。我们把它煮掉皮肉，留下头骨。至于这张皮，已经给子弹打得太烂，没法保存。现在回去睡觉吧。为了这件事坐等整整一夜，也算值得，对不对？
        - id: ch04-b24
          speaker: narrator
          text: 两个英国人觉得，为这件事坐等并熬上整整一夜，实在很值得。说来奇怪，他们带着鳄鱼头离开还不到三分钟，留在搁浅树木后面的豺和秃鹳，也探出头来，望着那条断成三截、再也不会醒来的老泽鳄，说出了完全相同的一句话。
