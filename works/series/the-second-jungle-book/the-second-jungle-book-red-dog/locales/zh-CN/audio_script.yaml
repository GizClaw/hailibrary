audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 沉稳生动，带着古老故事的智慧
        timbre: 温暖浑厚
        pace: 舒缓
        pitch: 中低
    mowgli:
      display_name: 毛克利
      tts:
        delivery: 勇猛机敏，少年气十足，戏谑时锋利，立誓时坚定
        timbre: 清亮结实
        pace: 稍快
        pitch: 中高
    gray_brother:
      display_name: 灰弟
      tts:
        delivery: 忠诚警醒，言语简短直接
        timbre: 沉着有力
        pace: 适中
        pitch: 中低
    pao:
      display_name: 帕奥
      tts:
        delivery: 首领般庄重果断，战斗时威严高亢
        timbre: 洪亮厚实
        pace: 适中
        pitch: 低
    akela:
      display_name: 阿克拉
      tts:
        delivery: 苍老从容，带着昔日首领的尊严与慈爱
        timbre: 低沉苍劲
        pace: 稍慢
        pitch: 低
    wontolla:
      display_name: 旺托拉
      tts:
        delivery: 疲惫坚忍，被血债支撑着，说话克制而悲愤
        timbre: 粗哑虚弱
        pace: 稍慢
        pitch: 中低
    kaa:
      display_name: 卡阿
      tts:
        delivery: 古老冷静，话音绵长，讥讽中带着深沉智慧
        timbre: 沙哑深厚
        pace: 舒缓
        pitch: 低
    dhole_leader:
      display_name: 红狗首领
      tts:
        delivery: 凶狠傲慢，怒火一起便尖厉暴烈
        timbre: 尖硬粗粝
        pace: 稍快
        pitch: 中
    dhole:
      display_name: 一只红狗
      tts:
        delivery: 疲惫凶悍，危急时惊惶急促
        timbre: 粗粝紧绷
        pace: 稍快
        pitch: 中
  chapters:
    - id: ch01
      title: 菲尔与誓言
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            这是献给洁白长夜和飞奔狩猎的歌。夜里望得远，计谋要稳，黎明的露水清新，雾中的猎物四散奔逃。等水鹿回身困守，同伴的呼喊便穿过黑暗。白日睡在洞口，夜晚迎向险境。现在，去战斗。嗥啊，嗥啊！
        - id: ch01-b02
          speaker: narrator
          text: >-
            丛林放水以后，毛克利过上了一生中最快活的日子。他还清旧债，心里坦荡，整个丛林都喜欢他，也都有一点怕他。他和四位兄弟四处漫游，经历多得讲也讲不完。他遇见过疯象曼德拉。那头象杀死二十二头公牛，公牛原本拉着十一车铸币去政府金库，亮闪闪的卢比便撒满尘土。他也曾在北方沼泽同鳄鱼贾卡拉打上一整夜，剥皮刀都砍断在那畜生的背甲上。后来，他从一个被野猪杀死的人颈上取到更长的新刀，又追踪那头野猪，把它杀掉，算是付清刀钱。大饥荒时，迁徙鹿群把他卷进去，摇荡而炽热的兽群几乎将他活活挤死。他还救出沉默的哈蒂，不让大象再次掉入坑底插着尖桩的陷阱，第二天自己却落进精巧的捕豹陷阱，最后由哈蒂踩碎头顶的粗木栅栏。他甚至在沼泽里挤过野水牛的奶。可故事只能一篇一篇地讲。
        - id: ch01-b03
          speaker: narrator
          text: >-
            狼爸爸和狼妈妈死后，毛克利用巨石封住洞口，为他们唱了死亡之歌。巴鲁老得僵硬，连钢筋铁骨的巴希拉捕猎也慢了一点。阿克拉更老了，灰毛变得雪白，肋骨根根突起，走路像木头一样，所以毛克利替他打猎。与此同时，散掉的西奥尼狼群又有了四十来头五岁的壮狼。阿克拉告诉他们，自由民该重新结成狼群，守着丛林法则，跟随一位首领奔跑。
        - id: ch01-b04
          speaker: narrator
          text: >-
            毛克利不愿插手。他说，酸果子是什么滋味，又长在哪棵树上，他全知道。不过帕奥依照法则一路搏斗，当上了首领。帕奥是帕奥纳的儿子，阿克拉做首领时，帕奥纳就是那头灰色追踪狼。古老的呼号和歌声重新响在星空下，毛克利也为了旧日情分回到议事岩。他坐在阿克拉身旁，位置甚至高过帕奥。只要他开口，全群都会等他说完。那段日子里，狩猎顺利，睡眠香甜。狼群自称毛克利的族人，外来的野兽谁也不敢闯入。年轻狼吃得肥壮，许多幼崽也到了受检礼的年纪。毛克利每次都会到场。那句“狼群啊，看清楚，仔细看”一响起，他就想起黑豹用代价买下赤裸婴儿的那个夜晚，心也跟着怦怦跳。除此以外，他总和四位兄弟远游，去尝、去摸、去看、去感受丛林里种种新鲜事物。
        - id: ch01-b05
          speaker: narrator
          text: >-
            一天黄昏，毛克利杀了头公鹿，正悠闲地穿过山林，带着一半鹿肉去找阿克拉。四位兄弟在后面慢跑，偶尔互相扑打，把对方撞翻。他们没有别的理由，只因为活着就满心欢喜。忽然，一声久违的尖啸越过温贡加河。自从谢尔汗横行的坏日子过去以后，毛克利再也没有听见过它。那声音时高时低，摇曳着，颤个不停。丛林称它为“菲尔”，只有胡狼尾随老虎狩猎，或大屠杀将要来临时才会发出。若把仇恨、得意、恐惧和绝望混在一起，再让一丝狞笑从当中穿过，听来便有几分像它。四位兄弟立即停下，竖起全身的毛，喉咙里滚出低吼。毛克利把手按到短刀上，也站住了。他脸上的血色一下退尽，双眉紧紧锁在一起。
        - id: ch01-b06
          speaker: mowgli
          text: >-
            这片丛林里，没有哪头条纹兽敢这样杀戮。
        - id: ch01-b07
          speaker: gray_brother
          text: >-
            那不是给老虎开路的胡狼。这里出了大屠杀。你听！
        - id: ch01-b08
          speaker: narrator
          text: >-
            “菲尔”又响起来，半像抽泣，半像窃笑。毛克利深吸一口气，奔向议事岩，路上追上了匆匆赶去的狼群。帕奥和阿克拉并肩站在岩上，群狼坐在下面，根根神经绷紧。母狼正带幼崽赶回巢穴。弱小的族类听见“菲尔”，绝不能留在外面。
        - id: ch01-b09
          speaker: narrator
          text: >-
            黑暗里只剩河水奔涌，晚风轻轻穿过树梢。河对岸忽然响起陌生的狼嗥，拖成一声绝望的长叫：“豺狗！豺狗！”疲惫的脚步踏上岩石，一头瘦得只剩骨架的狼扑进圈里，倒在毛克利脚边。他两肋血痕纵横，右前爪已经废了，嘴角尽是白沫。
        - id: ch01-b10
          speaker: pao
          text: >-
            祝你狩猎顺利。你归哪位首领管辖？
        - id: ch01-b11
          speaker: wontolla
          text: >-
            祝你狩猎顺利。我叫旺托拉，是一头离群独居的狼。
        - id: ch01-b12
          speaker: narrator
          text: >-
            旺托拉就是“离群者”。南方有许多这样的狼，在偏僻巢穴里独自养活伴侣和幼崽。他喘个不停，心跳震得全身前后摇晃。
        - id: ch01-b13
          speaker: pao
          text: >-
            什么东西正在行动？
        - id: ch01-b14
          speaker: wontolla
          text: >-
            德干的豺狗，红色的杀戮者。他们从南方一路向北，说德干已经空了，沿途见什么就杀什么。月初新月刚出现时，我还有伴侣和三个幼崽。她正在草原上教他们埋伏，再把公鹿赶出来。半夜，我听见豺狗沿着踪迹追赶，一群一群地嗥叫。晨风起来时，我的四位家人全僵在草里了。月初还是四个自由民啊！我追上去讨血债，这才找到他们。
          emotion: sad
        - id: ch01-b15
          speaker: mowgli
          text: >-
            他们有多少？
        - id: ch01-b16
          speaker: wontolla
          text: >-
            我不知道。有三个再也不能杀戮了。可其余的像追公鹿一样追我。我只剩三条腿，他们还是不放。你们看！
        - id: ch01-b17
          speaker: narrator
          text: >-
            他伸出残破的前爪。爪上结着黑血，肋腹布满恶狠狠的咬伤，喉咙也被撕烂了。
        - id: ch01-b18
          speaker: akela
          text: >-
            先吃吧。
        - id: ch01-b19
          speaker: narrator
          text: >-
            阿克拉让开毛克利送来的鹿肉。旺托拉立刻扑上去，压住最初那阵饥火，才谦逊地抬起头。
        - id: ch01-b20
          speaker: wontolla
          text: >-
            这块肉不会白给。自由民，再让我恢复一点力气，我也要杀敌。月初时我的巢穴还是满的，现在里面空了，可我的血债还没还清。
        - id: ch01-b21
          speaker: narrator
          text: >-
            他一口咬裂后腿骨，帕奥满意地哼了一声。
        - id: ch01-b22
          speaker: pao
          text: >-
            这副牙齿正用得上。那群豺狗里有幼崽吗？
        - id: ch01-b23
          speaker: wontolla
          text: >-
            没有。全是成年的红色猎手，粗壮有力。可在德干，他们也只配吃蜥蜴。
        - id: ch01-b24
          speaker: narrator
          text: >-
            这就是说，一整群德干红狗正在向前扫荡。狼群知道，连老虎也会把刚捕到的猎物让给他们。他们笔直穿过丛林，撞见什么便扑倒撕碎。豺狗比狼小，聪明不及狼的一半，却强壮而且数量惊人。不到一百只，他们都不肯自称一群，四十头狼却已经是了不起的大群。毛克利漫游时到过德干高高的草原边缘，亲眼见过无所畏惧的豺狗。他们在浅洼和草丛中睡觉、嬉闹、抓痒，那里就是他们的巢穴。毛克利憎恶那股不像自由民的气味，也看不起他们不住洞穴，尤其讨厌他们脚趾之间长着毛。毛克利和朋友们的足底可都清清爽爽。可哈蒂告诉过他，一群出猎的豺狗有多可怕。就连哈蒂也会从他们行进的路上让开。除非全被杀死，或一路上的猎物耗尽，他们绝不会停下。
        - id: ch01-b25
          speaker: akela
          text: >-
            与其孤零零活着，不如死在完整的狼群里。这会是一场好狩猎，也是我的最后一场。可你还年轻，小弟弟，你还有许许多多个日夜。去北方避一避吧。等豺狗过去，若还有谁活着，自会把战况告诉你。
        - id: ch01-b26
          speaker: mowgli
          text: >-
            那我该躲进沼泽捉小鱼，睡在树上吗？还是去求猴民收留，让我一边敲坚果，一边看狼群在下面送死？
        - id: ch01-b27
          speaker: akela
          text: >-
            这是决一死战。你从没遇见过红色杀手。连条纹兽也会——
        - id: ch01-b28
          speaker: mowgli
          text: >-
            嗷哇，嗷哇！我早杀过一只条纹猴子。我的肚子明白，谢尔汗若隔着三座山闻到豺狗，准会丢下伴侣，自己逃命。听好！狼是我的父亲，狼是我的母亲。还有一头不大聪明、如今已经雪白的老狼，也做过我的父亲和母亲。只要豺狗真敢来，毛克利就和自由民同披一张皮。我凭当年买下我的公牛起誓。让树木和河流都听见，也替我牢牢记住。我的刀会成为狼群的一颗牙，它还没有钝。这就是我的誓言！
        - id: ch01-b29
          speaker: wontolla
          text: >-
            长着狼舌头的人，你不懂豺狗。我只求在他们把我撕碎以前，多还一点血债。两天后我能恢复些力气，就会转身去找他们。可我劝自由民先往北走，少吃几天，等他们过去。这场狩猎没有肉吃。
        - id: ch01-b30
          speaker: mowgli
          text: >-
            听听这位离群者！自由民，我们快逃到北方去吧，挖蜥蜴和耗子吃，免得碰上豺狗。让他们杀光我们的猎场，再等他们高兴了，把土地还给我们。那些红黄肚皮的狗没有巢，脚趾缝全是毛，一胎生六只八只，跟蹦跳鼠奇凯一样。我们还该向北方各族讨一点死牛残渣！可老话怎么说？北方尽是害虫，南方尽是虱子，我们才是丛林！现在选吧。为了完整的狼群，为了巢穴和幼崽，为了我们的猎场，也为了洞里最小的狼崽，我们迎上去！迎上去！迎上去！
        - id: ch01-b31
          speakers: [pao, akela, gray_brother]
          ensemble: chorus
          text: >-
            我们迎上去！
        - id: ch01-b32
          speaker: narrator
          text: >-
            群狼的回答低沉得震耳，仿佛一棵大树在夜里轰然倒下。
        - id: ch01-b33
          speaker: mowgli
          text: >-
            四位兄弟，你们留下。每一颗牙都用得上。帕奥和阿克拉准备战斗，我去数一数那些狗。
        - id: ch01-b34
          speaker: wontolla
          text: >-
            这是去送死！一个无毛的家伙能把红狗怎样？连条纹兽都——
        - id: ch01-b35
          speaker: mowgli
          text: >-
            你果然是离群者。等豺狗死了，我们再谈。祝各位狩猎顺利！
    - id: ch02
      title: 卡阿的计策
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            毛克利兴奋得发狂，冲进黑暗，连落脚处都不看，结果一头绊在卡阿庞大的身躯上。巨蟒正盘在河边鹿径旁等候猎物。
        - id: ch02-b02
          speaker: kaa
          text: >-
            咝哈！你一路顿足乱踩，毁了我整夜的狩猎。猎物本来走得好好的。这也叫丛林里的规矩吗？
          emotion: angry
        - id: ch02-b03
          speaker: mowgli
          text: >-
            是我的错。我其实正在找你呢，扁脑袋。每次见你，你都比上次长一臂，也宽一臂。丛林里再没有谁像你这样聪明、年长、强壮，还这么美丽。
        - id: ch02-b04
          speaker: kaa
          text: >-
            这一次，踪迹又通向哪里？还不到一个月，有个人孩朝我脑袋扔石头，还用树猫的坏名字骂我，只因为我躺在空地睡觉。
        - id: ch02-b05
          speaker: mowgli
          text: >-
            那时我正在打猎，你却聋得听不见口哨，躺在鹿道上不肯让开，把赶来的鹿全惊跑了。
        - id: ch02-b06
          speaker: kaa
          text: >-
            如今还是这个人孩，带着挠痒似的好话回来。老扁脑袋居然相信了，还腾出地方给扔石头的人孩。现在躺得舒服吗？巴希拉能给你这么好的地方？
        - id: ch02-b07
          speaker: narrator
          text: >-
            卡阿把蛇身盘成柔软的半边吊床。毛克利安稳坐进去，揽住那条绳索般的颈子，让卡阿把头枕在自己肩上，然后讲完当夜发生的一切。
        - id: ch02-b08
          speaker: kaa
          text: >-
            我也许聪明，可我的确聋了，不然早该听见“菲尔”。怪不得食草的族类全坐立不安。豺狗有多少？
        - id: ch02-b09
          speaker: mowgli
          text: >-
            还没看见。我听到消息就来找你。你比哈蒂更年长。卡阿，这会是一场好狩猎，我们没几个能看到下一轮月亮。
        - id: ch02-b10
          speaker: kaa
          text: >-
            你也要参战？记住，你是个人。再记住，是那群狼把你赶了出去。让狼去对付狗吧。
        - id: ch02-b11
          speaker: mowgli
          text: >-
            去年的坚果，今年已经成了黑土。我是人，可我的肚子明白，今晚我已经说自己是狼。我请河流和树木作证。豺狗过去以前，我就是自由民。
        - id: ch02-b12
          speaker: kaa
          text: >-
            自由民？自由的贼！为了死去的狼，你就把自己绑进死结。这算不上好狩猎。
        - id: ch02-b13
          speaker: mowgli
          text: >-
            誓言已经出口，树木和河流都知道。豺狗过去以前，它不会回到我这里。
        - id: ch02-b14
          speaker: kaa
          text: >-
            咝，这样一来，所有路径都变了。我原想带你去北方沼泽。可誓言就是誓言，哪怕出自一个赤裸无毛的小人孩。现在我要说——
        - id: ch02-b15
          speaker: mowgli
          text: >-
            先想清楚，扁脑袋，别也把自己系进死结。我不需要你的誓言，我很清楚你会怎样做。
        - id: ch02-b16
          speaker: kaa
          text: >-
            那就不发誓。告诉我，豺狗来时，你肚子里有什么打算？
        - id: ch02-b17
          speaker: mowgli
          text: >-
            他们总得游过温贡加河。我拿刀站在浅滩，狼群守住身后。我们一面刺杀一面冲撞，也许能让他们转向下游，或者给那些滚烫的喉咙凉快凉快。
        - id: ch02-b18
          speaker: kaa
          text: >-
            豺狗不会转向，喉咙倒确实滚烫。照这个办法打完，既不会剩人孩，也不会剩狼崽，只会留下满地干骨头。
        - id: ch02-b19
          speaker: mowgli
          text: >-
            阿拉拉，死便死吧，这仍会是一场好狩猎。只是我还年轻，没见过多少场雨。我不聪明，也不强壮。你有没有更好的办法？
        - id: ch02-b20
          speaker: kaa
          text: >-
            我见过两百场雨。哈蒂还没换掉乳牙时，我爬过的宽阔踪迹已经印在尘土里。凭第一枚蛋起誓，我比许多树都老，也看过丛林里发生的一切。
        - id: ch02-b21
          speaker: mowgli
          text: >-
            可这次是新的。豺狗从没越过我们的踪迹。
        - id: ch02-b22
          speaker: kaa
          text: >-
            已经存在的事，早就发生过。将要发生的事，不过是某个被忘掉的年头重新回来。安静些，让我数一数岁月。
        - id: ch02-b23
          speaker: narrator
          text: >-
            整整一个钟头，毛克利仰卧在卡阿的盘圈里。巨蟒把头放在地上，一动不动，回想自己从蛋壳里出来以后，见过、听过、知道的一切。他眼里的光仿佛彻底熄灭，只剩两颗失去光泽的蛋白石。偶尔，他会僵硬地把头向左划几下，又向右划几下，仿佛正在梦中狩猎。毛克利一直保持安静，后来也睡着了。他知道狩猎之前，没有什么比睡觉更好，而且无论白天还是黑夜，无论哪个时辰，只要需要，他随时都能倒头入睡。
        - id: ch02-b24
          speaker: narrator
          text: >-
            后来，毛克利感觉身下的蛇背越来越粗，越来越宽。卡阿鼓起全身，嘶声像长剑抽出钢鞘。
        - id: ch02-b25
          speaker: kaa
          text: >-
            所有死去的季节我都见过，还有老树、老象，以及苔藓还没长出来时，那些裸露尖锐的岩石。人孩，你还活着吗？
        - id: ch02-b26
          speaker: mowgli
          text: >-
            月亮才落下去一会儿。我不明白你为什么——
        - id: ch02-b27
          speaker: kaa
          text: >-
            咝！我又是卡阿了。我就知道只过了一小会儿。走，我们去河边。我让你看看怎样对付豺狗。
        - id: ch02-b28
          speaker: narrator
          text: >-
            卡阿笔直如箭，爬向温贡加河，在和平岩上方入水。毛克利跟到河边。
        - id: ch02-b29
          speaker: kaa
          text: >-
            别游，我更快。上我的背，小弟弟。
        - id: ch02-b30
          speaker: narrator
          text: >-
            毛克利用左臂环住卡阿的颈子，右臂贴身，两腿伸直。卡阿用只有他才有的本领迎流而上。受阻的水在男孩颈边竖起一圈皱褶，蛇身有力摆动，激起的涡流推着他的双脚来回荡。上游一两英里，河道缩进一条大理石峡谷。两侧岩壁足有八十到一百英尺高，急流像磨坊水道，从一块块狰狞怪石之间和上方冲过。世上几乎没有哪片水能让毛克利害怕片刻。他只顾打量两侧峡壁，又不安地嗅着空气。那股气味甜中带酸，像炎热天气里一座大蚁丘散出的气息。他本能地把身体沉进水中，只偶尔抬头换气。卡阿用尾巴在水下岩石上绕了两圈，稳稳停住，又用一圈蛇身托住毛克利，任奔流从身边冲过去。
        - id: ch02-b31
          speaker: mowgli
          text: >-
            这是死亡之地。我们为什么到这里？
        - id: ch02-b32
          speaker: kaa
          text: >-
            他们睡着了。哈蒂不让条纹兽，哈蒂和条纹兽却都让着豺狗。听说豺狗什么也不怕。那么岩石上的小民会给谁让路？告诉我，丛林之主，谁才是丛林真正的主人？
        - id: ch02-b33
          speaker: mowgli
          text: >-
            是他们。这里是死亡之地，我们快走。
        - id: ch02-b34
          speaker: kaa
          text: >-
            不，仔细看。他们还在睡。这里和我还没有你一臂长时一模一样。
        - id: ch02-b35
          speaker: narrator
          text: >-
            自丛林初生以来，忙碌暴烈的黑色野蜂就住在开裂风化的峡壁中。所有路径到了半英里外便会绕开。几百年间，小民从一条石缝迁到另一条，一次次分群，在内层洞穴的黑暗里筑起又高又深的蜂巢。人、兽、火和水，从没有碰到那里。陈旧蜂蜜染过白色大理石，峡谷两边像挂满微亮的黑丝绒。毛克利看清以后，身体向下一沉。那是千百万只挤在一起沉睡的蜂。岩面还挂着团块、垂饰和朽木般的东西，有些是往年的旧巢，有些是建在无风阴影里的新城。大团海绵似的腐烂废物滚落，卡在攀住岩壁的树木和藤蔓间。灌满蜂蜜的巢脾不时在黑暗廊道里翻倒、滑落，随后便是愤怒的振翅声和废蜜沉沉的滴答声。蜂蜜顺着沟槽漫过露天石沿，黏稠地滴到细枝上。河边狭窄的小滩堆满死蜂、雄蜂、清扫出的废物、酸败巢脾和偷蜜飞蛾的翅膀，全化成细细的黑尘，堆成平滑高堆。光是那股尖锐气味，就足够赶走任何没有翅膀、又懂得小民厉害的生灵。
        - id: ch02-b36
          speaker: narrator
          text: >-
            卡阿游到峡谷顶端的沙洲。岸上躺着两头幼鹿和一头水牛的骨架，没有狼或胡狼碰过，仍保持死去时的姿势。
        - id: ch02-b37
          speaker: kaa
          text: >-
            看，这就是他们本季的猎获。
        - id: ch02-b38
          speaker: mowgli
          text: >-
            他们越了界，不懂这里的法则，所以小民杀了他们。趁蜂群没醒，我们走吧。
        - id: ch02-b39
          speaker: kaa
          text: >-
            天亮以前，他们不会醒。许多场雨以前，一头南方公鹿逃到这里，后面跟着一群猎手。公鹿不认识这片丛林，只顾从崖顶跳下。狼群追得又热又盲，只盯着他的踪迹。当时太阳高挂，小民数量众多，又怒火冲天。许多狼跟着跳进河，可还没碰到水便死了。没跳的，也死在岩石间。只有公鹿活下来。
        - id: ch02-b40
          speaker: mowgli
          text: >-
            他怎么能活？
        - id: ch02-b41
          speaker: kaa
          text: >-
            他第一个到，一心逃命，在小民察觉前已经跳进河里。等蜂群聚齐去杀他，他早在水中了。后面的狼却被小民的重量压垮。
        - id: ch02-b42
          speaker: mowgli
          text: >-
            那头公鹿真的活了？
        - id: ch02-b43
          speaker: kaa
          text: >-
            至少那时候还活着。不过下方可没有强壮的身体接住他，护着他不被河水卷走。不像某条又老又胖、耳朵又聋的黄色扁脑袋，会在这里等一个人孩，哪怕德干所有豺狗都追在后面。你肚子里想到什么了？
        - id: ch02-b44
          speaker: mowgli
          text: >-
            这是去拔死神脸上的胡须。卡阿，你果然是全丛林最聪明的。
        - id: ch02-b45
          speaker: kaa
          text: >-
            很多人都这么说。假如豺狗追着你——
        - id: ch02-b46
          speaker: mowgli
          text: >-
            他们一定会追。我舌头下面藏着许多小刺，正好扎进他们皮里。
        - id: ch02-b47
          speaker: kaa
          text: >-
            等他们追得又热又盲，只看得见你的肩膀，上面没死的就会在这里或下游落水。小民会飞起来盖住他们。温贡加河正在挨饿，豺狗又没有卡阿托住。活下来的会被冲到西奥尼巢穴旁的浅滩，狼群便能咬住他们的喉咙。
        - id: ch02-b48
          speaker: mowgli
          text: >-
            啊嗨！除非旱季忽然下大雨，再没有比这更好的计策。剩下的只是奔跑和纵身一跃。我会去让豺狗认识我，好让他们紧追不舍。
        - id: ch02-b49
          speaker: kaa
          text: >-
            你从陆地那边看过崖顶吗？
        - id: ch02-b50
          speaker: mowgli
          text: >-
            没有。我把这一点忘了。
        - id: ch02-b51
          speaker: kaa
          text: >-
            去看清楚。上面全是松软烂地，裂缝和洞到处都是。你那双笨脚只要踩错一步，狩猎就结束了。我去替你给狼群捎信，叫他们等在浅滩。可我不和任何狼同披一张皮。
        - id: ch02-b52
          speaker: narrator
          text: >-
            卡阿顺流而下，在议事岩对岸遇见倾听夜声的帕奥和阿克拉。
        - id: ch02-b53
          speaker: kaa
          text: >-
            咝，狗儿们！豺狗会顺流下来。你们若不害怕，就在浅滩杀他们。
        - id: ch02-b54
          speaker: pao
          text: >-
            他们什么时候来？
        - id: ch02-b55
          speaker: akela
          text: >-
            我的人孩在哪里？
        - id: ch02-b56
          speaker: kaa
          text: >-
            该来时就来，等着看吧。至于你的人孩，你收下他的誓言，又把他暴露给死亡。他如今跟我在一起。若他没死，可一点不是你的功劳，褪色的狗！在这里等着。你该庆幸，人孩和我站在你们一边。
        - id: ch02-b57
          speaker: narrator
          text: >-
            卡阿又游回上游，停在峡谷中央。没多久，毛克利的头从崖顶星光间掠过。空中一声呼啸，一个身体双脚向下，清脆地落进水里，随后安稳落入卡阿的身圈。
        - id: ch02-b58
          speaker: mowgli
          text: >-
            夜里跳这点高度不算什么，我玩耍时跳过两倍远。可上面真糟，矮树和深沟遍地都是，沟里全住着小民。我在三道沟边垒了石堆。奔跑时踢下去，小民就会怒冲冲地从身后飞起来。
        - id: ch02-b59
          speaker: kaa
          text: >-
            这是人的话，也是人的计谋。你很聪明，不过小民向来都在生气。
        - id: ch02-b60
          speaker: mowgli
          text: >-
            黄昏时，所有有翅膀的生灵都会歇一会儿。我就在那时候跟豺狗玩，他们最擅长白日狩猎。眼下他们正追旺托拉的血迹。
        - id: ch02-b61
          speaker: kaa
          text: >-
            赤尔不会离开死牛，豺狗也不会离开血迹。
        - id: ch02-b62
          speaker: mowgli
          text: >-
            那我就用他们自己的血，再替他们铺一条踪迹，让他们满嘴吃土。你会留在这里等我带豺狗回来吗？
        - id: ch02-b63
          speaker: kaa
          text: >-
            会。可要是他们先在丛林里杀了你，或者小民在你落水前杀了你呢？
        - id: ch02-b64
          speaker: mowgli
          text: >-
            明日来到，再为明日杀戮。等我死了，才该唱死亡之歌。祝你狩猎顺利，卡阿！
    - id: ch03
      title: 树上的挑战
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            毛克利放开卡阿，像洪水里的圆木顺峡而下，游到远岸缓流处，快活得大笑。他最喜欢的事，就是去拔死神的胡须，再让丛林知道谁才是主宰。他知道野蜂厌恶野蒜，便采一小束，用树皮绳扎好。随后，他沿旺托拉的血迹向南追了五英里，一路侧头查看树木，暗自窃笑。
        - id: ch03-b02
          speaker: mowgli
          text: >-
            我做过青蛙毛克利，也说过自己是狼毛克利。现在要先做猴子毛克利，再做公鹿毛克利。最后，我会成为人毛克利。呵！
        - id: ch03-b03
          speaker: narrator
          text: >-
            他用拇指轻轻试过十八英寸长的刀刃。旺托拉的踪迹腥气浓重，一路布满暗色血斑，从密密相挨的树下穿过。这片林子向东北伸展，随后树木越来越稀，到蜂岩两英里处便完全消失。最后一棵树与低矮灌丛之间，是无遮无拦的开阔地，连一头狼都很难藏住。毛克利在林下小跑，一根一根估量枝条间的距离，不时爬上树干，试着从这棵跃到那棵，直到来到空地。他花整整一个钟头仔细看清地形，才转身回到离开旺托拉踪迹的地方。他坐上一根离地八英尺的横枝，静静地用脚掌磨刀，嘴里哼着歌。
        - id: ch03-b04
          speaker: narrator
          text: >-
            还没到正午，阳光已经暖起来。脚步啪嗒作响，那股恶心的豺狗气味也飘进鼻子。红狗沿旺托拉的踪迹赶来。从树上看，他们还不到狼的一半大，可毛克利知道那些腿脚和牙齿有多强。领头那只栗色尖脑袋正低头嗅踪。
        - id: ch03-b05
          speaker: mowgli
          text: >-
            祝你狩猎顺利！
        - id: ch03-b06
          speaker: narrator
          text: >-
            那畜生抬起头，伙伴们也在他身后停住。一群接一群红狗垂着尾巴，肩膀粗重，后腿细弱，嘴边全染着血。豺狗本来就是极沉默的族类，即使待在自己的丛林也毫无礼貌。如今树下足足聚了两百只，密密围住树干。不过，毛克利看得出来，几只领头狗仍在饥渴地嗅着旺托拉的血迹，急着把全群继续向前带。若让他们得逞，红狗会在大白天赶到西奥尼巢穴，狼群的安排便全落了空。毛克利不能放他们走，必须把这两百只狗牢牢扣在树下，一直拖到黄昏。
        - id: ch03-b07
          speaker: mowgli
          text: >-
            谁准你们踏进这片丛林？
        - id: ch03-b08
          speaker: dhole
          text: >-
            所有丛林都是我们的！
        - id: ch03-b09
          speaker: narrator
          text: >-
            毛克利笑着俯视，学起德干蹦跳鼠奇凯尖细急促的叫声，明明白白告诉红狗，在他眼里，他们还不如一只小耗子。狗群紧紧围住树干，首领长嗥着骂他是树猴。毛克利不答，只垂下一条赤裸的腿，让光溜溜的脚趾在首领头顶扭动。脚趾缝长毛的豺狗最恨别人提起这件事，全群顿时暴怒。首领跃起，毛克利收回脚，声音甜得很。
        - id: ch03-b10
          speaker: mowgli
          text: >-
            狗，红狗！滚回德干吃蜥蜴吧，去找你的兄弟奇凯。红色的狗，每个脚趾缝里都长着毛！
        - id: ch03-b11
          speaker: dhole
          text: >-
            无毛猴子，滚下来！我们会守在这里，活活饿死你！
          emotion: angry
        - id: ch03-b12
          speaker: narrator
          text: >-
            这正是毛克利想听的。他沿树枝伏下，面颊贴住树皮，空出右臂，慢条斯理地数落红狗的礼数、习性、伴侣和幼崽。他把自己知道的每一点都拿来讥刺。丛林族类轻蔑敌人时，说出的话又毒又狠。仔细想想便会明白，事情也只能如此。毛克利曾告诉卡阿，他舌头下面藏着许多小刺。如今那些小刺一根接一根扎出去，把豺狗从沉默激成低吼，从低吼激成尖叫，再从尖叫逼到嘶哑疯狂的奴才叫骂。红狗也试着回敬，可那就像幼崽顶撞盛怒中的卡阿。毛克利始终把右手屈在身边，准备随时出手，双脚则牢牢扣住树枝，不让狂怒骗走自己的耐心。
        - id: ch03-b13
          speaker: narrator
          text: >-
            毛克利始终屈着右手，双脚紧扣树枝。栗色首领一次次往上扑，他却不肯冒险打出落空的一击。终于，首领气疯了，猛地跃起七八英尺。毛克利的手像树蛇脑袋一样探出，揪住他的后颈。沉重的身体向下一坠，树枝剧烈摇晃，几乎把毛克利也拖下去。可他牢牢不放，一寸一寸把红狗提上来。那家伙悬在半空，像一只淹死的胡狼。毛克利左手抽刀，割掉蓬松红尾，又把他扔回地面。
        - id: ch03-b14
          speaker: narrator
          text: >-
            这一下已经足够。除非红狗杀死毛克利，或毛克利杀掉他们，他们绝不会再沿旺托拉的血迹赶路。全群臀部一颤，围着树坐下，表示决意不走。毛克利爬到更高的枝杈，舒舒服服睡了过去。
        - id: ch03-b15
          speaker: narrator
          text: >-
            三四个钟头后，他醒来数了数。两百只红狗仍全守在下面，沉默、嘶哑、口渴，眼睛硬得像钢。太阳已经西沉，再过半个钟头，岩石小民便会结束一天的劳作。豺狗又最不善于在暮色中战斗。
        - id: ch03-b16
          speaker: mowgli
          text: >-
            我本来不需要这么忠心的守卫，可我会记住。你们确实是货真价实的豺狗，只是同一种货色实在太多。所以，那只吃大蜥蜴的家伙别想拿回尾巴。红狗，你不高兴吗？
        - id: ch03-b17
          speaker: dhole_leader
          text: >-
            我要亲手扯出你的肚肠！
          emotion: angry
        - id: ch03-b18
          speaker: mowgli
          text: >-
            德干的聪明耗子，你再想想。以后会生出一窝又一窝没尾巴的小红狗，个个拖着鲜红肉桩，沙地一热便刺得发疼。回家哭诉是猴子干的吧。还是不走？那就跟上，我会让你们聪明一点！
        - id: ch03-b19
          speaker: narrator
          text: >-
            毛克利学着猴民，从一棵树荡到下一棵，再荡向更前面一棵。狗群仰着一颗颗饥饿的脑袋，在树下紧追不舍。他不时故意装作失足，身子猛地向下一沉。红狗以为终于能扑上去咬死他，便你撞我、我压你，滚成混乱的一团。眼前的景象十分奇异。低斜的阳光穿过高处枝叶，男孩手中的刀一阵阵闪亮，下面那群沉默的狗挤在一起，红毛全像着了火，还一步不落地跟随。到了最后一棵树，毛克利取出准备好的野蒜，仔细涂遍全身。豺狗闻到气味，立刻轻蔑地叫起来。
        - id: ch03-b20
          speaker: dhole_leader
          text: >-
            长着狼舌头的猴子，你以为这样能遮住气味？我们会追你到死！
        - id: ch03-b21
          speaker: mowgli
          text: >-
            拿好你的尾巴。现在跟来吧，一直跟到死！
        - id: ch03-b22
          speaker: narrator
          text: >-
            他把断尾沿原路扔回去。狗群本能地一拥而上，还没弄明白，毛克利已经滑下树干，光脚朝蜂岩飞奔，快得像风。
    - id: ch04
      title: 蜂岩奔袭
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            红狗齐声长嗥，随即迈开起伏悠长的步子。这种跑法看似不急，只要一直追下去，却能耗尽任何奔跑的生灵。可毛克利知道，豺狗全群行进的速度比狼慢得多，否则他绝不敢在他们眼皮底下跑这两英里。豺狗确信人孩终于落进掌中，毛克利也确信自己能随意戏弄他们。他真正要操心的只有一件事，就是让身后的怒火烧得足够旺，逼他们只看着自己，不肯过早转向。蜂岩越来越近，他仍把速度控制得恰到好处。
        - id: ch04-b02
          speaker: narrator
          text: >-
            毛克利跑得平稳又利落。断尾首领离他不到五码，后面的队伍拖出四分之一英里，每只狗都被杀戮的怒火烧得又疯又瞎。他靠耳朵量着距离，把最后的力气留给蜂岩。
        - id: ch04-b03
          speaker: narrator
          text: >-
            暮色来得早，岩石小民已经睡下。毛克利第一脚踏上空洞地面，脚下发出空空回声，整片土地像在嗡鸣。他以前所未有的速度冲刺，把第一堆、第二堆、第三堆石头踢进散着甜香的黑沟。轰鸣像海浪灌进洞穴，身后的天空忽然暗了。下方远远露出温贡加河，水里浮着卡阿扁平的菱形脑袋。
        - id: ch04-b04
          speaker: narrator
          text: >-
            毛克利拼尽全力跃出去。断尾首领也跃在半空，牙齿咬向他的肩。男孩双脚向下落进河里，气喘吁吁，却得意极了。野蒜在他穿过蜂群的几秒间护住了他，身上一处也没被蜇。浮出水面时，卡阿的身圈已经稳稳托住他。
        - id: ch04-b05
          speaker: narrator
          text: >-
            悬崖边不断有东西弹落，好像一团团聚在一起、铅坠般下落的蜜蜂。每一团还没碰到水，蜂群便向上飞散，露出一具在河中打转、被急流冲向下游的豺狗。崖顶传来狂怒而短促的尖叫，转眼便被碎浪似的振翅声淹没。有些红狗掉进连着地下洞穴的沟里，在坍塌蜂巢之间窒息、扭打、乱咬。他们即使死了，仍被身下翻涌的蜂群托起，最后从临河岩壁的洞口喷出来，翻滚着摔到黑色垃圾堆上。有些跳得不够远，落进攀在悬崖上的树木，蜂群把他们的身影完全涂黑。不过，大多数豺狗被蜇得发疯，径直扑进河中。温贡加果然是一条饥饿的河。
        - id: ch04-b06
          speaker: narrator
          text: >-
            卡阿牢牢托着毛克利，直到他喘匀气息。
        - id: ch04-b07
          speaker: kaa
          text: >-
            不能留在这里。小民全醒了，快走！
        - id: ch04-b08
          speaker: narrator
          text: >-
            毛克利紧贴水面，频频潜水，握着短刀顺流而下。
        - id: ch04-b09
          speaker: kaa
          text: >-
            慢一点。一颗牙杀不了一百只，除非是眼镜蛇的毒牙。很多豺狗一见小民飞起，就立刻跳进水里了。
        - id: ch04-b10
          speaker: mowgli
          text: >-
            那我的刀就多做一点。呸，小民追得真紧！
        - id: ch04-b11
          speaker: narrator
          text: >-
            他又沉入水中。水面铺满野蜂，阴沉地嗡鸣，蜇刺攻击碰到的一切。
        - id: ch04-b12
          speaker: kaa
          text: >-
            沉默从来不会坏事。你还有整整一夜可以狩猎。听听那些狗怎样叫吧！
        - id: ch04-b13
          speaker: narrator
          text: >-
            近半数豺狗看见同伴冲入陷阱，猛然转向，从峡谷断成陡岸的地方跳进河里。他们怒骂让自己受辱的树猴，叫声又和挨过蜂蜇的尖叫、低吼混成一片。每一只豺狗都明白，留在岸上只有死路。全群被水流冲向和平潭的深涡，愤怒的野蜂一直追到那里，又逼得他们躲回水中。断尾首领的命令越过水面，叫全群坚持住，一定把西奥尼每一头狼都杀光。毛克利没有停下来听。他忙着随水前进，也忙着寻找下一只可以拖下去的红狗。
        - id: ch04-b14
          speaker: dhole
          text: >-
            黑暗里有东西从背后杀我们！这条水染了邪气！
          emotion: fearful
        - id: ch04-b15
          speaker: narrator
          text: >-
            毛克利像水獭一样潜到前方，趁一只挣扎的红狗还没来得及张口，一把将他拖进水底。尸体扑通浮起，侧过身随水漂流，水面升起一圈又一圈暗纹。其余红狗试图掉头，可急流不肯放他们回去，野蜂又不断扑向头顶和耳朵。渐浓的黑暗里，西奥尼狼群的挑战声越来越近，也越来越低沉。毛克利再次潜下，又一只豺狗被拖得沉没，死后才浮上水面。狗群后方顿时爆出更大的喧嚷。有的嗥叫着说应该立刻上岸，有的请求首领带全群回德干，还有的只顾叫毛克利现身受死。不同的主意从水面乱纷纷冒出来，却没有哪只狗真能离开河水。
        - id: ch04-b16
          speaker: kaa
          text: >-
            他们带着两个肚子、好几副嗓子来打仗。剩下的交给下游的兄弟。小民追得够远，要回去睡了。我也回头，因为我不与狼同披一张皮。祝你狩猎顺利，小弟弟。记住，豺狗专咬低处。
        - id: ch04-b17
          speaker: narrator
          text: >-
            一头狼用三条腿沿岸奔来。他忽高忽低地跳，把脑袋侧过来贴近地面，接着弓起背，高高蹿到空中，仿佛正在和幼崽嬉戏。那是离群者旺托拉。他一句话也不说，只在红狗身边继续这场可怕的游戏。豺狗已经在水里泡了太久，游得疲惫不堪。湿透的毛皮压在身上，沉重无比，原本蓬松的尾巴也像吸饱水的海绵，拖在身体后面。他们一个个累得发抖，渐渐全都沉默下来，只盯着岸边那双和自己并排移动、像火一样燃烧的眼睛。
        - id: ch04-b18
          speaker: dhole
          text: >-
            这算不上好狩猎。
        - id: ch04-b19
          speaker: mowgli
          text: >-
            祝你狩猎顺利！
        - id: ch04-b20
          speaker: narrator
          text: >-
            毛克利猛地在红狗身旁浮起，把长刀深深送进他肩后，再用力推开，避过临死的一咬。
        - id: ch04-b21
          speaker: wontolla
          text: >-
            人孩，你在那里吗？
        - id: ch04-b22
          speaker: mowgli
          text: >-
            去问死者吧，离群者。我让这些狗满嘴吃土，白天还戏弄了他们。首领也丢了尾巴。不过这里给你留下不少。要我把他们赶去哪里？
        - id: ch04-b23
          speaker: wontolla
          text: >-
            我会等。长夜还在前面。
        - id: ch04-b24
          speakers: [pao, akela, gray_brother]
          ensemble: chorus
          text: >-
            为了狼群，为了完整的狼群，我们迎上去！
        - id: ch04-b25
          speaker: narrator
          text: >-
            河道忽然转弯，把红狗推向西奥尼巢穴对面的沙洲和浅滩。他们直到这时才看清自己犯下的错误。本来应该在上游半英里处登岸，再从干地冲向狼群，可如今水流已经把他们送到狼群面前，再想回头已经太迟。岸边一排排燃烧的眼睛正等着他们。除了那声可怕的“菲尔”，整片丛林再没有一点声音。“菲尔”从太阳落山起便没有停过，在黑暗里一阵又一阵地回荡。旺托拉沿岸走着，仿佛讨好猎物似的，一点点引诱他们踏上浅滩。
        - id: ch04-b26
          speaker: dhole_leader
          text: >-
            转身，咬住他们！
        - id: ch04-b27
          speaker: narrator
          text: >-
            全群扑向岸边，拍打浅水，跌撞向前。温贡加河被搅得雪白破碎，巨浪横过两岸。红狗挤成一道浪涌上河滩，毛克利也握刀冲进浪中。
    - id: ch05
      title: 最后一场狩猎
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: >-
            漫长的战斗开始了。染红的湿沙上，纠缠的树根内外，灌木之间和草丛前后，两群野兽推挤、扭斗、撕咬，又突然散开。整个兽群一会儿收窄成一团，一会儿又沿河滩铺展开来。即便经过蜂岩的野蜂和温贡加的急流，红狗仍有狼群的两倍。可迎战他们的狼，是在为狼群赖以活着的一切拼命。那里面有自己的领地，有领地上的猎物，有巢穴，也有巢里还不能战斗的幼崽。这些东西全在他们身后，所以没有一头狼肯让开。
        - id: ch05-b02
          speaker: narrator
          text: >-
            队伍里不只有那些矮壮、肩高、胸宽、白牙森森的猎手。守巢的拉希尼也来了，她们眼里烧着焦灼的火，要替洞中的幼崽拼命。间或还有刚满一岁、第一层毛仍带几分绒软的小狼，跟在母狼身旁撕咬扭斗。狼惯于扑向喉咙，或者一口咬住肋侧，豺狗却最爱攻击低处，专门去咬对手的肚腹。红狗刚从河水里挣扎上岸，不得不抬高脑袋，露出喉咙，这时狼便占了上风。可等战斗移到干地，红狗能低头贴近地面，吃亏的又变成狼。
        - id: ch05-b03
          speaker: narrator
          text: >-
            无论水中还是岸上，毛克利的刀一直来回飞舞。四位兄弟一路撕咬，终于赶到他身边。灰弟伏在男孩两膝之间，专门护住他的肚腹，其余三位分别守住背后和左右。若有嗥叫的红狗迎着平稳的刀锋全身扑来，冲击把毛克利撞倒，四位兄弟便立即跨到他身上，把人孩护在下面，直到他重新站起。没有谁发号施令，他们仍像从前共同狩猎时那样，各自守住自己的位置。
        - id: ch05-b04
          speaker: narrator
          text: >-
            四下一片纠缠混乱，像一群彼此咬杀的野兽沿河岸左右摇摆，又绕着自己的中心缓缓旋转。这里鼓起一座小丘，像漩涡里的水泡，破裂时又像水泡一样抛出四五只遍体鳞伤的狗。每一只落地后都挣扎着要赶回中央。那里，一头狼被两三只豺狗压倒，仍拖着敌人吃力前进，自己却一点点沉下去。另一边，一只早已死去的周岁狼被四周的压力托着站立。他那因无声狂怒而发疯的母亲，翻滚着、撕咬着，一路向他冲去。兽群最拥挤的地方，一狼一豺也许会忘掉别的一切，只管彼此试探，要抢先咬住对方，可下一刻又一同被狂怒的队伍卷走。
        - id: ch05-b05
          speaker: narrator
          text: >-
            毛克利曾从阿克拉身旁经过，看见两只红狗咬住老狼两侧，那副几乎无牙的老颚仍死死扣住第三只的腰。阿克拉的身体已经苍老，可首领时代留下的意志仍在他的牙关里。又有一次，毛克利看见帕奥咬紧一只豺狗的喉咙。敌人四脚撑地，拼命往后挣，不肯再向前一步。帕奥却一直拖着他，把他送到一只周岁狼面前，让年轻猎手结果他的性命。在河岸的每一个角落，相同的扑击、抵抗和拖拽都在黑暗中反复发生。
        - id: ch05-b06
          speaker: narrator
          text: >-
            但战斗大多只剩黑暗里的盲目扑击。打、绊、翻滚，尖叫、呻吟、咬住不放，身旁、身后、头顶，到处都是。空气让拥挤的身体挤得令人窒息，谁也看不清整场战斗的模样。夜越深，那阵迅疾而让人眩晕的旋转反而越快。红狗已经胆怯，不敢再向更强壮的狼进攻，却还没有胆量转身逃跑。毛克利看出结局正在逼近，便只用刀把敌人打残，不再一味杀死，好让狼群去收拾他们。年轻的周岁狼越来越勇。混战中终于偶尔会露出一点空隙，让猎手喘口气，和伙伴喊上一句话。有时毛克利的刀光只轻轻一闪，面前的红狗也会惊得退开。
        - id: ch05-b07
          speaker: gray_brother
          text: >-
            肉已经贴到骨头了！
        - id: ch05-b08
          speaker: narrator
          text: >-
            灰弟身上二十来处伤口都在流血。
        - id: ch05-b09
          speaker: mowgli
          text: >-
            可骨头还没有咬碎。嗷哇哇！我们在丛林里就是这样做！
        - id: ch05-b10
          speaker: narrator
          text: >-
            红色刀刃像火焰，划过一只豺狗的肋侧。那只狗的后半身已被一头狼死死压住。
        - id: ch05-b11
          speaker: wontolla
          text: >-
            这是我的猎物，留给我！
        - id: ch05-b12
          speaker: mowgli
          text: >-
            离群者，你的肚子还空着吗？
        - id: ch05-b13
          speaker: narrator
          text: >-
            旺托拉已经伤得惨不忍睹，可被他咬住的红狗瘫在地上，怎么也转不过身去咬他。毛克利抹掉眼中的鲜血，认出了栗色皮毛。
        - id: ch05-b14
          speaker: mowgli
          text: >-
            凭买下我的公牛起誓，是那只断尾狗！杀幼崽和拉希尼可算不上聪明，除非你也能杀死离群者。我的肚子明白，旺托拉会杀了你。
        - id: ch05-b15
          speaker: narrator
          text: >-
            一只豺狗扑来救首领。牙齿还没碰到旺托拉，毛克利的刀已经刺进他的喉咙，灰弟接过剩下的活。
        - id: ch05-b16
          speaker: mowgli
          text: >-
            我们在丛林里就是这样做。
        - id: ch05-b17
          speaker: narrator
          text: >-
            旺托拉一声不出。生命正从他身体里流走，双颚仍一下又一下咬紧敌人的脊骨。断尾首领猛地一颤，脑袋垂落，再不动弹。旺托拉也倒在他身上。
        - id: ch05-b18
          speaker: mowgli
          text: >-
            哈，血债还清了。唱歌吧，旺托拉。
        - id: ch05-b19
          speaker: gray_brother
          text: >-
            他再也不狩猎了。阿克拉也已经沉默很久。
          emotion: sad
        - id: ch05-b20
          speaker: pao
          text: >-
            骨头咬碎了！他们要逃！自由民的猎手，杀！把他们杀光！
        - id: ch05-b21
          speaker: narrator
          text: >-
            一只又一只红狗开始从染血的暗沙上偷偷溜走。他们不再维持队伍，也不再听首领号令。有的奔向河流，有的钻进密林，有的逃往上游，有的冲向下游，只看哪里还有一条能走的路，便朝哪里逃命。
        - id: ch05-b22
          speaker: mowgli
          text: >-
            还债！把债还清！他们杀了孤狼，一只狗也不能放走！
        - id: ch05-b23
          speaker: narrator
          text: >-
            毛克利握着刀奔向河边，要拦住敢下水的红狗。就在这时，他看见九具尸体下面露出阿克拉的头和前半身，立刻扑通跪到孤狼身旁。
        - id: ch05-b24
          speaker: akela
          text: >-
            我不是早说过，这是我的最后一战吗？这是一场好狩猎。你呢，小弟弟？
        - id: ch05-b25
          speaker: mowgli
          text: >-
            我还活着，也杀了许多敌人。
        - id: ch05-b26
          speaker: akela
          text: >-
            那就好。我快死了。我愿意死在你身边，小弟弟。
          emotion: calm
        - id: ch05-b27
          speaker: narrator
          text: >-
            毛克利把那颗伤痕累累、看起来十分可怕的头抱到膝上，双臂环住被撕裂的颈子。眼前这头雪白瘦削的老狼，正是当年在议事岩上看护那个赤裸婴儿、后来又为他挺身说话的首领。如今他们又一同打完了最后一场狩猎。
        - id: ch05-b28
          speaker: akela
          text: >-
            谢尔汗的旧日已经过去很久。那个赤裸着在尘土里打滚的人孩，也已经过去了。
        - id: ch05-b29
          speaker: mowgli
          text: >-
            不！我是狼，我和自由民同披一张皮。我不愿意做人！
          emotion: sad
        - id: ch05-b30
          speaker: akela
          text: >-
            你是人，小弟弟，是我亲眼看护长大的狼崽。你若不是人，狼群今晚早在豺狗面前逃了。我欠你一条命，今天你又救了狼群，就像我从前救过你。你忘了吗？如今所有债都还清了。回到自己的族人那里吧。我再告诉你一次，我眼中的眼睛，这场狩猎结束了。回到人类中去。
        - id: ch05-b31
          speaker: mowgli
          text: >-
            我永远不走。我会独自在丛林里狩猎，我早就说过。
        - id: ch05-b32
          speaker: akela
          text: >-
            夏日后面是雨季，雨季后面又是春天。趁你还没被赶走，回去吧。
        - id: ch05-b33
          speaker: mowgli
          text: >-
            谁能赶我走？
        - id: ch05-b34
          speaker: akela
          text: >-
            毛克利会赶走毛克利。回到你的族人那里，回到人类中去。
        - id: ch05-b35
          speaker: mowgli
          text: >-
            等毛克利赶走毛克利，我就去。
        - id: ch05-b36
          speaker: akela
          text: >-
            那便没什么可说了。小弟弟，扶我站起来好吗？我也曾是自由民的首领。
        - id: ch05-b37
          speaker: narrator
          text: >-
            毛克利万分小心地移开压在阿克拉身边的尸体，动作轻柔得仿佛老狼仍没有受伤。他用双臂环抱住阿克拉，把他一点点扶起来。孤狼站稳后深吸一口气，唱起只有狼群首领临死时才唱的死亡之歌。起初，那歌声从受伤的胸膛里缓缓出来，随后越来越有力，音调越升越高，远远传过河面。唱到最后一句“祝你狩猎顺利”时，阿克拉忽然有一瞬挣开毛克利。他跃入空中，又仰面倒下，死在自己最后、也最可怕的猎物身上。
        - id: ch05-b38
          speaker: narrator
          text: >-
            毛克利抱膝坐下，对周围的一切都不再理会。毫不留情的拉希尼追上溃逃的残余红狗，把他们一一扑杀。那些追逐和搏斗的叫声越传越远，终于渐渐消失。狼群身上的伤口开始僵硬，活下来的猎手一瘸一拐地回到河边，清点这一夜失去了多少族人。十五头狼战死，河边还躺着六只守巢的拉希尼。剩下的狼身上，也没有一只不带伤。毛克利始终坐在阿克拉身旁，直到寒冷的黎明到来。帕奥走近，把湿漉漉、染红的口鼻放进他手中。毛克利这才向后挪开，让新的首领看见阿克拉消瘦的尸身。
        - id: ch05-b39
          speaker: pao
          text: >-
            祝你狩猎顺利！
        - id: ch05-b40
          speaker: narrator
          text: >-
            帕奥说得仿佛阿克拉仍然活着，仍是自由民中受尊敬的老首领。接着，他越过自己被咬伤的肩头，向那些拖着伤腿、围回河边的狼发出呼喊。
        - id: ch05-b41
          speaker: pao
          text: >-
            嗥吧，狗儿们！今夜死了一头狼！
        - id: ch05-b42
          speaker: narrator
          text: >-
            那两百只善战的豺狗从德干一路向北，沿途杀尽猎物。他们曾在树下向毛克利夸口，说所有丛林都是他们的丛林，世上没有任何活物能够挡住他们。可蜂岩的小民、饥饿的温贡加河、自由民的牙齿和毛克利的刀，一同结束了这场远征。如今整群之中，没有一只能够回到德干，也没有一只还能把那句夸口带回去。
