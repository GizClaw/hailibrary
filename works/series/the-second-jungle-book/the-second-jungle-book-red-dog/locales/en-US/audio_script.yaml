  chapters:
    - id: ch01
      title: The Cry Across the Waingunga
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: "For our white and excellent nights, and the nights of swift running. For wide ranging, far seeing, good hunting, and sure cunning. For the clean smells of dawn before the dew is gone, and the rush through the mist when the quarry starts blind. For our mates' cry when the sambhur turns and stands at bay. For the danger and wild joy of night, and sleep by the lair mouth in daytime. It is met, and we go to the fight. Bay! O bay!"
        - id: ch01-b02
          speaker: narrator
          text: "After Mowgli let the Jungle into the village, the happiest part of his life began. His debts were paid, and that gave him a clear conscience. All the Jungle was his friend, and just a little afraid of him. He wandered from one people to another, sometimes alone and sometimes with his four wolf brothers. What he did, saw, and heard could fill many stories as long as this one. He met the Mad Elephant of Mandla after it killed twenty-two bullocks that had been pulling eleven carts of silver to the Government Treasury, then scattered the shining rupees in the dust. He fought Jacala the Crocodile through a whole night in the northern marshes and broke his skinning knife on Jacala's armored back. Later he found a longer knife hanging around the neck of a man killed by a wild boar. He followed that boar and killed it as a fair price for the blade. During the Great Famine, the moving deer herds caught him among their hot, swaying bodies and nearly crushed him. He saved Hathi the Silent from falling once more into a pit with a stake at the bottom. The very next day Mowgli fell into a cleverly built leopard trap, and Hathi broke apart the thick wooden bars above him. Mowgli even milked wild buffalo in the swamp. There are more tales, but one must be told at a time."
        - id: ch01-b03
          speaker: narrator
          text: "Father Wolf and Mother Wolf died. Mowgli sealed their cave with a great stone and sang the Death Song over them. Baloo became old and stiff. Even Bagheera, with nerves like steel and muscles like iron, killed a little more slowly. Akela's gray coat turned milky white. His ribs showed, and he walked like a wooden wolf, so Mowgli hunted for him. Meanwhile the young children of the scattered Seeonee Pack grew strong and numerous. When about forty clean-footed, full-voiced five-year-olds were living without a master, Akela told them to gather, obey the Law, and run beneath one leader, as the Free People should."
        - id: ch01-b04
          speaker: narrator
          text: "Mowgli kept out of that business. He said he had tasted sour fruit and knew the tree it came from. But Phao, son of Phaona the old Gray Tracker, fought his way to leadership under Jungle Law. When the ancient calls and songs rang beneath the stars again, Mowgli came to Council Rock for the sake of memory. He sat beside Akela, above Phao, and the Pack waited whenever he chose to speak. Hunting was good, sleep was peaceful, and no stranger entered the jungle of Mowgli's people. The wolves grew fat and strong, and many cubs came to the Looking-over. Mowgli always attended. The call of 'Look well, O Wolves' still made his heart leap, because he remembered the night a black panther bought a naked brown baby into the Pack. At other times he roamed with his four brothers, tasting, touching, seeing, and learning new things."
        - id: ch01-b05
          speaker: narrator
          text: "One twilight Mowgli trotted easily across the ranges to bring Akela half of a buck he had killed. The Four jogged behind him. They sparred as they went and tumbled one another over simply for the joy of being alive. Then a cry sounded that none of them had heard since the evil days of Shere Khan. The Jungle calls it the pheeal. It is the jackal's hideous shriek when he hunts behind a tiger, or when some great killing is about to begin. Imagine hate, triumph, fear, and despair all mixed together, with a sneer running through the sound. That was the cry that rose, sank, wavered, and trembled far away across the Waingunga. The Four stopped at once. Their hackles lifted, and low growls came from their throats. Mowgli's hand went to the handle of his knife. He stopped in the middle of his stride. The color drained from his face, and his eyebrows tightened as he listened."
        - id: ch01-b06
          speaker: mowgli
          text: "No Striped One dares to kill here."
        - id: ch01-b07
          speaker: gray_brother
          text: "That is not a tiger's forerunner. Some great killing has begun. Listen."
        - id: ch01-b08
          speaker: narrator
          text: "The cry rose again, half sob and half chuckle, almost as if the jackal had soft human lips. Mowgli took one deep breath and ran for Council Rock, passing wolves who were hurrying there too. Phao and Akela stood together on the Rock. Every wolf below them sat tense and listening. Mothers and cubs were already running home, because weak creatures should not be abroad when the pheeal calls. For a while there was only the river rushing in darkness and a light wind moving through the treetops. Then a strange wolf called from across the water. His note stretched into a hopeless bay."
        - id: ch01-b09
          speaker: wontolla
          text: "Dhole! Dhole! Dhole!"
          emotion: fearful
        - id: ch01-b10
          speaker: narrator
          text: "Tired feet scraped over the rocks. A gaunt wolf stumbled into the circle and fell gasping at Mowgli's feet. Red streaked his flanks. His right forepaw hung useless, his throat and side were savagely bitten, and foam whitened his jaws."
        - id: ch01-b11
          speaker: phao
          text: "Good hunting. Who leads you?"
        - id: ch01-b12
          speaker: wontolla
          text: "Good hunting. I am Won-tolla."
        - id: ch01-b13
          speaker: narrator
          text: "That meant he was an Outlier, a solitary wolf who guarded his mate and cubs in a lonely southern lair instead of running with a pack. His heartbeat shook his whole body as he panted."
        - id: ch01-b14
          speaker: phao
          text: "What is moving?"
        - id: ch01-b15
          speaker: narrator
          text: "That is the question all the Jungle asks after the pheeal cries."
        - id: ch01-b16
          speaker: wontolla
          text: "The dholes of the Dekkan are coming. Red Dogs. Killers. They came north because the Dekkan was empty, and they killed as they traveled. When this moon was new, I had four beside me, my mate and our three cubs. She was teaching them to hunt the open grass, hiding so they could drive the buck. At midnight I heard all four crying together on a trail. At dawn I found them stiff in the grass. Four Free People when the moon was new, and four dead by morning. I claimed my Blood-Right and found the dholes."
          emotion: sad
        - id: ch01-b17
          speaker: mowgli
          text: "How many are there?"
        - id: ch01-b18
          speaker: wontolla
          text: "I do not know. Three will never kill again. But the rest drove me like a buck, and I ran before them on three legs. Look at me, Free People."
        - id: ch01-b19
          speaker: narrator
          text: "He held out the ruined paw, dark with dried blood. The Pack growled deep in their throats. Akela rose from Mowgli's meat and gave it to the stranger. Won-tolla threw himself upon it. When the sharpest edge of hunger was gone, he spoke humbly."
        - id: ch01-b20
          speaker: wontolla
          text: "This meat will not be wasted. Give me enough strength to fight, Free People, and I will kill again. My lair was full at the new moon. Now it is empty, and my Blood Debt is not yet paid."
        - id: ch01-b21
          speaker: narrator
          text: "His teeth cracked a thighbone. Phao gave an approving grunt."
        - id: ch01-b22
          speaker: phao
          text: "We will need jaws like those. Did the dholes have cubs with them?"
        - id: ch01-b23
          speaker: wontolla
          text: "No. They were all grown Red Hunters, heavy and strong, though they live on lizards in the Dekkan."
        - id: ch01-b24
          speaker: narrator
          text: "Won-tolla's news meant that a hunting pack of red dogs was moving north and killing as it came. The Pack knew the danger. Even a tiger gives up a fresh kill when dholes arrive. They drive straight through the Jungle, pulling down and tearing apart whatever they meet. One dhole is not as large as a wolf and has not half a wolf's cunning. But the red dogs are strong, and there are terribly many of them. They do not even call themselves a pack until a hundred run together, while forty wolves make a very strong pack. Mowgli's wanderings had once taken him to the high grassy downs at the edge of the Dekkan. There he had watched fearless dholes sleep, play, and scratch themselves in the little hollows and grass clumps they used as lairs. He despised them because they did not smell like the Free People and did not live in caves. Most of all, he despised the hair growing between their toes, because Mowgli and the wolves were clean-footed. Still, he understood the danger. Hathi had told him what a terrible thing a hunting pack of dholes could be. Even Hathi steps aside from their line. Until the pack is killed, or until the country runs out of game, the red dogs keep moving forward."
        - id: ch01-b25
          speaker: akela
          text: "It is better to die inside a full Pack than alone without a leader. This will be good hunting, and my last. But you are a man, Little Brother, with many nights and days ahead. Go north and stay safe. If anyone survives after the dholes pass, he will bring you news."
        - id: ch01-b26
          speaker: mowgli
          text: "Should I hide in the marshes, catch tiny fish, and sleep in a tree? Or shall I ask the Bandar-log for help cracking nuts while the Pack fights below?"
        - id: ch01-b27
          speaker: akela
          text: "This fight ends only in death. You have never met the Red Killer. Even a tiger would fear them."
        - id: ch01-b28
          speaker: mowgli
          text: "Aowa, old wolf, do not fuss over me. I killed one striped ape already, and I know Shere Khan would have abandoned his own mate as meat if he smelled a dhole pack three ranges away. Now listen. A wolf was my father. A wolf was my mother. And one old gray wolf, not very wise and white with age now, was father and mother to me. So hear my word. If the dholes come, Mowgli and the Free People wear one skin for this hunt. By the Bull that bought me, the Bull Bagheera paid long ago, let the Trees and River remember if I forget. My knife will be a tooth for the Pack, and it is not blunt. My Word has gone from me."
        - id: ch01-b29
          speaker: wontolla
          text: "You do not know the dholes, man with a wolf's tongue. I only hope to finish my Blood Debt before they tear me apart. They move slowly because they kill along the way. In two days I may have strength enough to turn and meet them again. But you Free People should go north, eat little, and wait until they pass. There is no meat in this hunt."
        - id: ch01-b30
          speaker: mowgli
          text: "Hear the Outlier! We must flee north and dig rats and lizards from the banks, in case we meet a dhole. We should let that dog, that dog-pup, that yellow-bellied, homeless creature with hairy toes, kill everything on our land. He has six or eight pups at once, like Chikai the jumping rat. Yes, let us beg the northern peoples for scraps from dead cattle. You know the saying. Vermin live north, lice live south, but we are the Jungle. Choose now! This hunt is for the whole Pack, for every lair and litter, for the mate who drives the doe, and for the smallest cub in the cave. It is met! It is met! It is met!"
        - id: ch01-b31
          speakers: [wolf_1, wolf_2, wolf_3]
          ensemble: chorus
          text: "It is met!"
        - id: ch01-b32
          speaker: narrator
          text: "Forty wolf voices answered as one. Their single deep, crashing bark rolled across the Council Rock and sounded through the darkness like a great tree falling in the night. The Pack had made its choice, and every wolf there understood that the fight would be to the death."
        - id: ch01-b33
          speaker: mowgli
          text: "Stay with the Pack, my brothers. We will need every tooth. Phao and Akela must prepare the battle. I am going to count the dogs."
        - id: ch01-b34
          speaker: wontolla
          text: "That is death! What can a hairless creature do against the Red Dogs? Even the tiger fears them."
          emotion: fearful
        - id: ch01-b35
          speaker: mowgli
          text: "You truly are an Outlier. We will discuss it after the dholes are dead. Good hunting, all!"

    - id: ch02
      title: Kaa's Old Memory
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: "Mowgli raced into the darkness, wild with excitement and hardly watching his feet. Naturally, he tripped full length over Kaa's enormous coils. The python had been waiting beside a deer path near the river."
        - id: ch02-b02
          speaker: kaa
          text: "Kssha! Is this Jungle work? You stamp around, spoil a night's hunting, and frighten the game just when it is moving well."
          emotion: angry
        - id: ch02-b03
          speaker: mowgli
          text: "My fault, Kaa. Truly, I was looking for you. Every time we meet, you seem an arm's length longer and broader. No one in the Jungle is as wise, old, strong, or beautiful as you."
        - id: ch02-b04
          speaker: kaa
          text: "And where does that trail of sweet words lead? Less than a moon ago, a Manling with a knife threw stones at my head and called me nasty little tree-cat names because I slept in the open."
        - id: ch02-b05
          speaker: mowgli
          text: "Yes, because that same Flathead scattered every deer I was driving. He was too deaf to hear my whistle and clear the deer paths."
        - id: ch02-b06
          speaker: kaa
          text: "Now the stone-throwing Manling comes praising the very same old Flathead. He calls him wise and strong and beautiful. The foolish Flathead believes him and makes a comfortable place like this. Are you settled now? Could Bagheera make you such a fine bed?"
        - id: ch02-b07
          speaker: narrator
          text: "Kaa curved himself into a soft half-hammock beneath Mowgli. The boy drew the supple, cable-thick neck close until Kaa's head rested on his shoulder. Then he told the python everything that had happened."
        - id: ch02-b08
          speaker: kaa
          text: "Perhaps I am wise, but I must be deaf, or I would have heard the pheeal. No wonder the Grass Eaters are restless. How many dholes are coming?"
        - id: ch02-b09
          speaker: mowgli
          text: "I have not seen them yet. I ran straight to you because you are older than Hathi. Oh, Kaa, this will be good hunting! Few of us will see another moon."
        - id: ch02-b10
          speaker: kaa
          text: "Will you fight in this? Remember, you are a man. Remember the Pack that cast you out. Let wolves deal with dogs. You are a man."
        - id: ch02-b11
          speaker: mowgli
          text: "Last year's nuts are black earth now. I am a man, but tonight my heart told me I was a wolf. I called the River and Trees to remember my promise. Until the dholes are gone, I belong to the Free People."
        - id: ch02-b12
          speaker: kaa
          text: "Free People? Free thieves. You tied yourself into a death-knot for dead wolves and old memories. That is not good hunting."
        - id: ch02-b13
          speaker: mowgli
          text: "I gave my Word. The Trees know it. The River knows it. My Word cannot return until the dholes have passed."
        - id: ch02-b14
          speaker: kaa
          text: "That changes every trail. I meant to carry you away to the northern marshes. But a Word is a Word, even when it comes from a small, naked, hairless Manling. So I, Kaa, say..."
        - id: ch02-b15
          speaker: mowgli
          text: "Think carefully, Flathead. Do not tie yourself into the death-knot too. I need no promise from you. I know you well."
        - id: ch02-b16
          speaker: kaa
          text: "Then I make no promise. Tell me what you mean to do when the dholes arrive."
        - id: ch02-b17
          speaker: mowgli
          text: "They must cross the Waingunga. I thought I could meet them with my knife in the shallows, with the Pack behind me. We might stab and drive some downstream, or cool their hot throats."
        - id: ch02-b18
          speaker: kaa
          text: "Dholes do not turn, and their throats stay hot. When that hunt ends, no Manling or wolf-cub will remain. There will only be dry bones."
        - id: ch02-b19
          speaker: mowgli
          text: "Alala! If we die, then we die. It will still be a great hunt. But I am young and have seen few Rains. I am neither wise nor strong. Do you have a better plan?"
        - id: ch02-b20
          speaker: kaa
          text: "I have seen two hundred Rains. My trail was broad in the dust before Hathi lost his milk tusks. By the First Egg, I am older than many trees, and I have watched everything the Jungle has done."
        - id: ch02-b21
          speaker: mowgli
          text: "But this hunt is new. The dholes have never crossed our trail before."
        - id: ch02-b22
          speaker: kaa
          text: "What exists has existed before. What will come is only a forgotten year returning. Be quiet while I count my years."
        - id: ch02-b23
          speaker: narrator
          text: "For a long hour Mowgli rested among the coils. Kaa laid his head motionless on the earth and searched everything he had known since he came from the egg. His eyes faded like old opals. Now and then his head made a short, stiff pass from side to side, as if he hunted in a dream. Mowgli slept. Nothing is better before a hunt, and he had learned to sleep at any hour. At last Kaa's back swelled beneath him. The giant python hissed like a sword sliding from a steel sheath."
        - id: ch02-b24
          speaker: kaa
          text: "I have seen all the dead seasons. I remember great trees and old elephants, and rocks that were bare and sharp before moss covered them. Are you still alive, Manling?"
        - id: ch02-b25
          speaker: mowgli
          text: "The moon only just went down. I do not understand."
        - id: ch02-b26
          speaker: kaa
          text: "Hssh! I am Kaa again. I knew it had only been a little while. Come to the river. I will show you what to do about the dholes."
        - id: ch02-b27
          speaker: narrator
          text: "Kaa turned straight toward the main Waingunga and entered above the pool that hid the Peace Rock. Mowgli moved beside him."
        - id: ch02-b28
          speaker: kaa
          text: "Do not swim. I move faster. Climb onto my back, Little Brother."
        - id: ch02-b29
          speaker: narrator
          text: "Mowgli wrapped his left arm around Kaa's neck, held his right arm close against his body, and stretched his feet straight behind him. Kaa drove into the current with a power no other creature could match. Where his body checked the water, a rippling frill rose around Mowgli's neck, while the eddies beside Kaa's lashing flanks waved the boy's feet from side to side. A mile or two above Peace Rock, the Waingunga narrowed between walls of marble eighty or a hundred feet high. The current raced through that gorge like water in a mill channel. It rushed between the cliffs and broke over every kind of ugly stone. Mowgli did not trouble himself about the danger of the water, because very little water anywhere in the world could frighten him. Instead, he watched both sides of the gorge and sniffed uneasily. A sweet and sour smell hung in the air. It reminded him of the smell rising from a great anthill on a hot day. Without thinking, he lowered his whole body into the river and brought up only his head whenever he needed to breathe. Kaa stopped by winding his tail twice around a rock below the surface. Then he curved one coil around Mowgli and held him in its hollow while the hungry current raced past them both."
        - id: ch02-b30
          speaker: mowgli
          text: "This is the Place of Death. Why have you brought me here?"
          emotion: fearful
        - id: ch02-b31
          speaker: kaa
          text: "They are asleep. Hathi will not move aside for a tiger, but Hathi and the tiger both move aside for the dholes. The dholes claim they avoid nothing. Then tell me, Master of the Jungle, who do the Little People of the Rocks avoid? Who truly rules the Jungle?"
        - id: ch02-b32
          speaker: mowgli
          text: "They do. This is the Place of Death. Let us leave."
          emotion: fearful
        - id: ch02-b33
          speaker: kaa
          text: "No. Look carefully. They are asleep, just as they were when I was shorter than your arm."
        - id: ch02-b34
          speaker: narrator
          text: "Since the beginning of the Jungle, the split and weather-beaten rocks of that gorge had belonged to the Little People, the busy and furious black wild bees of India. Every Jungle trail turned aside half a mile before reaching that place. Century after century, the bees had filled one crack, swarmed away, and filled another. Old honey stained the white marble. Their combs rose tall and sank deep into the darkness of inner caves that no man or beast had reached, and that neither fire nor water had touched. Along both sides of the gorge, millions of sleeping bees hung like curtains of black, shimmering velvet. Other dark lumps and hanging shapes covered the stone. Some were old combs from seasons long gone. Some were new cities built in the windless shadows. Great masses of rotten, spongy refuse had rolled down and lodged among the trees and creepers clinging to the cliff. As Mowgli listened, a comb heavy with honey rustled and slid somewhere in those dark passages. Sometimes one fell, followed by the deep boom of angry wings. Wasted honey dripped slowly through the galleries, reached a ledge, and spilled into the open air before creeping down the twigs. On one side of the river lay a beach less than five feet wide. Countless years had piled it with dead bees, drones, hive sweepings, stale comb, and the wings of moths that had tried to steal honey. All of it had become smooth heaps of the finest black dust. The sharp smell alone could frighten any wingless creature that knew the Little People. Mowgli understood, and sank lower in Kaa's coil as he looked."
        - id: ch02-b35
          speaker: narrator
          text: "Kaa moved upstream to a sandbar at the gorge's head. The untouched skeletons of two young deer and a buffalo lay on the bank."
        - id: ch02-b36
          speaker: kaa
          text: "There is this season's kill. Look."
        - id: ch02-b37
          speaker: mowgli
          text: "They crossed the line without knowing the Law, and the Little People killed them. We should go before the bees wake."
        - id: ch02-b38
          speaker: kaa
          text: "They sleep until dawn. Many Rains ago, a hunted buck came north from the south with a pack behind him. Fear had blinded him. He jumped from the cliff, and the pack followed by sight, hot and blind upon his trail. The sun was high, and the Little People were awake and angry. Many pursuers leaped into the river, but died before touching it. The others died on the rocks. Only the buck lived."
        - id: ch02-b39
          speaker: mowgli
          text: "How did he live?"
        - id: ch02-b40
          speaker: kaa
          text: "He ran first and jumped before the bees understood. He reached the water while they were gathering to kill. The pack behind him vanished beneath the Little People."
        - id: ch02-b41
          speaker: mowgli
          text: "And the buck truly lived?"
        - id: ch02-b42
          speaker: kaa
          text: "He did not die then. Of course, no strong body waited in the river to hold him against the current. No old, fat, deaf, yellow Flathead waited for that buck as one might wait for a Manling with every dhole in the Dekkan behind him. Now, what are you thinking?"
        - id: ch02-b43
          speaker: narrator
          text: "Kaa's head rested close to Mowgli's ear. The boy was silent for a moment."
        - id: ch02-b44
          speaker: mowgli
          text: "We will pull Death by the whiskers. Kaa, you truly are the wisest creature in the Jungle."
        - id: ch02-b45
          speaker: kaa
          text: "Many have said so. If the dholes follow you..."
        - id: ch02-b46
          speaker: mowgli
          text: "They will follow. I have enough thorns under my tongue to drive them mad."
        - id: ch02-b47
          speaker: kaa
          text: "If they chase you hot and blind, looking only at your shoulders, the bees will cover them. Those who survive above must enter the river here or farther down. The Waingunga is hungry water, and they will have no Kaa to hold them. Whoever lives will be swept toward the shallows by the Seeonee Lairs. Your Pack can take them by the throat there."
        - id: ch02-b48
          speaker: mowgli
          text: "Ahai! Nothing could be better, unless rain fell in the dry season. I only have to make the run and the leap. I will show myself to the dholes and keep them close behind me."
        - id: ch02-b49
          speaker: kaa
          text: "Have you examined the rocks above us from the landward side?"
        - id: ch02-b50
          speaker: mowgli
          text: "No. I forgot that."
        - id: ch02-b51
          speaker: kaa
          text: "Go and look. The ground is rotten, cut through with holes. One careless step from those clumsy feet would finish the hunt. I will tell the Pack where to wait for the dholes, and I do that only for you. I do not share one skin with any wolf."
        - id: ch02-b52
          speaker: narrator
          text: "When Kaa disliked someone, he could be more unpleasant than any Jungle creature except Bagheera. He swam down to Council Rock and found Phao and Akela listening to the night."
        - id: ch02-b53
          speaker: kaa
          text: "Hssh, dogs. The dholes will come downriver. If you are not afraid, you may kill them in the shallows."
        - id: ch02-b54
          speaker: phao
          text: "When will they come?"
        - id: ch02-b55
          speaker: akela
          text: "Where is my Man-cub?"
        - id: ch02-b56
          speaker: kaa
          text: "They will come when they come. Wait and see. As for your Man-cub, you took his Word and opened the road to his death. He is with me now. If he is not already dead, bleached dog, that is no thanks to you. Wait for the dholes, and be grateful that the Man-cub and I fight beside you."
        - id: ch02-b57
          speaker: narrator
          text: "Kaa flashed back upstream and anchored in the middle of the gorge, watching the cliff. Soon Mowgli's head crossed the stars. A body whistled down, struck the water feet first with a clean plunge, and came safely to rest in Kaa's loop."
        - id: ch02-b58
          speaker: mowgli
          text: "That leap is nothing at night. I have jumped twice as far for amusement. But the ground above is evil. Low bushes cover deep gullies, and every hole is full of the Little People. I stacked large stones beside three gullies. As I run, I will kick them down. The bees will rise behind me in a fury."
        - id: ch02-b59
          speaker: kaa
          text: "That is man's speech and man's cunning. You are wise, though the Little People need no help becoming angry."
        - id: ch02-b60
          speaker: mowgli
          text: "At twilight, every wing rests for a little while. I will play with the dholes then, because they hunt best by day. They must be following Won-tolla's blood trail now."
        - id: ch02-b61
          speaker: kaa
          text: "Chil does not abandon a dead ox, and dholes do not abandon a blood trail."
        - id: ch02-b62
          speaker: mowgli
          text: "Then I will give them a new trail made from their own blood, if I can, and feed them dirt. Will you wait here until I return with my dholes?"
        - id: ch02-b63
          speaker: kaa
          text: "Yes. But what if they kill you in the Jungle? What if the Little People kill you before you reach the river?"
        - id: ch02-b64
          speaker: mowgli
          text: "We kill tomorrow's dangers when tomorrow comes. When I am dead, it will be time for the Death Song. Good hunting, Kaa!"

    - id: ch03
      title: Mowgli Leads the Red Dogs
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: "Mowgli released Kaa and shot down the gorge like a log in floodwater. He paddled toward the quiet water by the far bank, laughing from pure happiness. Nothing delighted him more than pulling Death by the whiskers and reminding the Jungle that he was its master. With Baloo's help, he had robbed beehives in single trees, so he knew the Little People hated wild garlic. He gathered a small bundle and tied it with bark. Then he followed Won-tolla's blood trail south from the Lairs for five miles, studying the trees and chuckling."
        - id: ch03-b02
          speaker: mowgli
          text: "First I was Mowgli the Frog. Tonight I called myself Mowgli the Wolf. Before I become Mowgli the Buck, I must be Mowgli the Ape. At the end, I will be Mowgli the Man. Ho!"
        - id: ch03-b03
          speaker: narrator
          text: "He tested the edge of his eighteen-inch knife. The dark, bloody trail ran beneath dense trees toward the northeast. The forest slowly thinned until open country began two miles from the Bee Rocks, with barely enough scrub to conceal a wolf. Mowgli measured the spaces between branches. He climbed trunks and practiced leaping from tree to tree. Then he spent an hour studying the open ground. At last he returned to the blood trail, settled on a branch eight feet high, sharpened his knife against the sole of his foot, and sang quietly."
        - id: ch03-b04
          speaker: narrator
          text: "Just before noon, feet began to patter beneath the hot sun. The hateful smell of dholes rolled through the trees as the pack followed Won-tolla's trail without mercy. From above, each red dog looked much smaller than a wolf, but Mowgli knew the strength in their feet and jaws. He watched the sharp-headed leader sniffing the blood."
        - id: ch03-b05
          speaker: mowgli
          text: "Good hunting!"
        - id: ch03-b06
          speaker: narrator
          text: "The leader looked up. Scores upon scores of red dogs stopped behind him, their tails low, shoulders heavy, hindquarters lean, and mouths stained with blood. Dholes are usually silent and have no manners even in their own land. Nearly two hundred gathered under Mowgli's tree. The leaders were hungry for Won-tolla's trail and kept trying to pull the pack onward. Mowgli could not allow that. They would reach the Lairs in daylight, and he needed to hold them there until dusk."
        - id: ch03-b07
          speaker: mowgli
          text: "Who gave you leave to enter this jungle?"
        - id: ch03-b08
          speaker: dhole_leader
          text: "Every jungle belongs to us."
        - id: ch03-b09
          speaker: narrator
          text: "The leader showed his white teeth. Mowgli smiled and copied Chikai, the Dekkan jumping rat, perfectly. His meaning was plain. He thought the dholes no better than rats. They crowded around the trunk, and the leader bayed that Mowgli was a tree-ape. Mowgli lowered one bare leg and wriggled his toes just beyond the leader's reach. Creatures with hair between their toes hate being reminded of it. The whole pack burst into stupid rage. When the leader jumped, Mowgli snatched his foot away."
        - id: ch03-b10
          speaker: mowgli
          text: "Red dog, go home to the Dekkan and eat lizards with your brother Chikai. Dog! Red dog! You have hair between every toe."
        - id: ch03-b11
          speakers: [dhole_leader, dhole_1]
          ensemble: duo
          text: "Come down before we starve you out, hairless ape!"
          emotion: angry
        - id: ch03-b12
          speaker: narrator
          text: "That was exactly what Mowgli wanted. He stretched along the branch with his cheek against the bark, his right arm bent and ready beside him. Then he told the dholes everything he thought about them. He spoke of their habits, their manners, their mates, and their puppies. No language stings like the Jungle's language of scorn. Mowgli had told Kaa there were many little thorns beneath his tongue, and now he pressed them into the dogs one by one. Slowly and deliberately, he drove them from silence to growls, from growls to yells, and from yells to hoarse, slavering madness. They tried to answer, but a cub might as well answer an angry Kaa. All the while, Mowgli kept his feet locked around the branch and his hand ready. The great bay-colored leader leaped again and again, but Mowgli would not risk a poor strike. At last rage carried the dhole seven or eight feet clear of the ground. Mowgli's hand shot forward like a tree snake's head and caught the loose skin of his neck. The falling weight shook the branch and nearly tore the boy down. Mowgli never opened his hand. Inch by inch he hauled the dangling beast upward until it hung like a drowned jackal. With his left hand, Mowgli drew his knife, cut off the bushy red tail, and threw the leader back to earth."
        - id: ch03-b13
          speaker: narrator
          text: "Now the pack would not return to Won-tolla's trail until either Mowgli or every dhole was dead. They settled in circles to wait. Mowgli climbed to a higher fork, rested his back, and slept. Three or four hours later he woke and counted them. Every dog remained below, silent, thirsty, and hoarse, with hard eyes fixed upon him. The sun was sinking. In half an hour the Little People would end their work, and dholes fight poorly in twilight."
        - id: ch03-b14
          speaker: mowgli
          text: "I did not ask for such faithful guards, but I will remember you. You are true dholes, though there are far too many of the same kind. That is why I will not return the great lizard-eater's tail. Are you pleased, Red Dog?"
        - id: ch03-b15
          speaker: dhole_leader
          text: "I will tear out your stomach myself!"
          emotion: angry
        - id: ch03-b16
          speaker: mowgli
          text: "Think, wise rat of the Dekkan. Soon there will be litters of tailless red puppies, all with raw stumps burning in hot sand. Go home and tell them an ape did this. You will not leave? Then come with me, and I will teach you wisdom."
        - id: ch03-b17
          speaker: narrator
          text: "He moved into the next tree as lightly as one of the Bandar-log, then passed into the next and the next. Below him, the pack followed with lifted, hungry heads. Now and then Mowgli pretended that his grip had failed. Each time he slipped, the dholes tumbled over one another in their hurry to be first at the kill. It made a strange sight beneath the sinking sun. The boy traveled through the high branches, and his knife shone whenever a shaft of low light reached it. On the ground, the silent pack crowded after him. Their red coats seemed to burn in that same light. When Mowgli reached the last tree, no more branches stood between him and the open ground. He took out his bundle of wild garlic and rubbed it carefully over his arms, legs, and body. The dholes smelled it and howled with scorn. They called him an ape with a wolf's tongue. They asked if he thought a new smell could hide his trail, and they promised to follow him until he died."
        - id: ch03-b18
          speaker: mowgli
          text: "Here is your tail. Now follow me to the death!"
        - id: ch03-b19
          speaker: narrator
          text: "He flung the tail back along the route he had taken through the trees. By instinct, the whole pack rushed after it. In that brief confusion, Mowgli slid down the trunk and flew barefoot across the open country toward the Bee Rocks. When the dholes understood, they gave one deep howl and settled into their long, rolling canter. That steady pack pace can run down almost anything in the end, but it is slower than a wolf's pace. Mowgli knew that, or he would never have risked a two-mile race in full view of two hundred enemies. The dogs believed the hairless boy was finally theirs. Mowgli was equally certain that he held them and could lead them wherever he wished. His only danger was letting their rage cool. He had to keep them hot enough that none would turn aside before the trap. So he ran cleanly, evenly, and lightly, never showing panic and never wasting strength. The tailless leader stayed no more than five yards behind him. The rest of the pack stretched over nearly a quarter mile of ground, blind with rage and the desire to kill. Mowgli judged the distance without looking back. He listened to their feet and saved his last great effort for the final rush across the Bee Rocks."
        - id: ch03-b20
          speaker: narrator
          text: "The Little People had gone to rest in the early twilight, because this was not the season when flowers bloomed late. Still, Mowgli's first footfall rang hollow on the broken ground, and he heard a sound as though the whole earth had begun to hum. Then he ran as he had never run before. His feet struck the first pile of stones and sent it tumbling into a dark, sweet-smelling gully. He kicked down the second pile, then the third. Behind him rose a roar like the sea breaking inside a cave. At the edge of his sight, the air turned black with wings. Far below, the Waingunga flashed between the rocks, and Kaa's flat, diamond-shaped head waited in the current. Mowgli gathered every bit of strength left in his body and leaped out into the empty air. The tailless leader jumped after him, snapping so close that its teeth clicked beside Mowgli's shoulder. Then the boy dropped feet first into the river. He came up breathless and triumphant. The wild garlic had confused the Little People for the few seconds he needed to cross their ground. Not one sting had touched him."
        - id: ch03-b21
          speaker: narrator
          text: "Kaa's coils steadied him as he rose. Bodies began tumbling from the cliff. At first they looked like great heavy clumps made entirely of bees. Before each mass struck the river, the bees flew upward, and the body of a dhole was left to spin away downstream. Overhead, the dogs gave short, furious yells, but those cries vanished beneath a roar like waves breaking on a shore. It was the roar of millions of wings. Some dholes had fallen into gullies that opened into the underground caves. Trapped there among heaps of broken honeycomb, they choked, fought, and snapped at the living darkness. Even after they died, the heaving bees beneath them carried their bodies onward. At last the dead dogs shot through holes in the river face, rolled down the cliff, and landed on the old black refuse heaps. Other dholes had jumped too soon or too far to one side and caught themselves in the trees growing from the rocks. The bees covered them so completely that their shapes disappeared. But the greatest number, maddened beyond thought by the stings, flung themselves over the edge and into the river. Kaa had spoken truly. The Waingunga was hungry water, and now it began to feed."
        - id: ch03-b22
          speaker: narrator
          text: "Kaa held Mowgli until he could breathe again."
        - id: ch03-b23
          speaker: kaa
          text: "We cannot remain. The Little People are fully awake. Come."
        - id: ch03-b24
          speaker: narrator
          text: "Mowgli swam low downriver and dived whenever he could, keeping his knife ready."
        - id: ch03-b25
          speaker: kaa
          text: "Slowly, slowly. One tooth cannot kill a hundred unless it belongs to a cobra. Many dholes reached the river quickly when they saw the bees rise."
        - id: ch03-b26
          speaker: mowgli
          text: "Then my knife has more work. Phai! Look how the Little People follow us!"
        - id: ch03-b27
          speaker: narrator
          text: "The water's surface was covered with wild bees, buzzing darkly and stinging everything they found. Mowgli dived again."
        - id: ch03-b28
          speaker: kaa
          text: "Silence has never cost anyone anything. My scales stop their stings, and you have the whole night for hunting. Listen to the dogs howl."
        - id: ch03-b29
          speaker: narrator
          text: "Almost half the dholes had seen the trap in time. They turned aside and entered the river where the gorge fell into steep banks. Their furious threats against the tree-ape mixed with the cries of dogs already punished by the bees. Staying on land meant death, so all entered the current. It swept them through the deep eddies of the Peace Pool, where the Little People still forced them beneath the surface. The tailless leader ordered his pack to hold together and kill every Seeonee wolf. Mowgli did not stop to listen."
        - id: ch03-b30
          speaker: dhole_1
          text: "Something kills in the darkness behind us! The water smells of blood!"
          emotion: fearful
        - id: ch03-b31
          speaker: narrator
          text: "Mowgli had shot forward underwater like an otter and pulled a struggling dhole under before it could bite. Dark circles spread as the dead body rolled onto its side. The pack tried to turn, but the current held them while bees struck their ears and heads. Far ahead, the Seeonee challenge grew deeper in the darkness. Mowgli dived once more, and another dhole rose dead. Panic broke out behind him. Some wanted the bank. Some called for the leader to take them back to the Dekkan. Others demanded that Mowgli show himself and die."
        - id: ch03-b32
          speaker: kaa
          text: "They enter battle with two stomachs and many voices. The rest belongs to your brothers below. The Little People are returning to sleep now, and I will turn back. I share no skin with wolves. Good hunting, Little Brother. Remember that dholes bite low."

    - id: ch04
      title: The Fight at the Lairs
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: "A wolf ran along the bank on three legs. He leaped, tilted his head toward the ground, hunched his back, and sprang high again as if playing with cubs. It was Won-tolla. He said nothing as he performed that terrible game beside his enemies. The dholes had spent a long time in the river. Their soaked coats weighed them down, and their bushy tails dragged like sponges. Exhausted and shaken, they swam in silence beside Won-tolla's blazing eyes."
        - id: ch04-b02
          speaker: dhole_1
          text: "This is bad hunting."
        - id: ch04-b03
          speaker: mowgli
          text: "Good hunting!"
        - id: ch04-b04
          speaker: narrator
          text: "Mowgli surfaced beside the dog and drove his knife behind its shoulder, leaning away from the dying snap."
        - id: ch04-b05
          speaker: wontolla
          text: "Are you there, Man-cub?"
        - id: ch04-b06
          speaker: mowgli
          text: "Ask the dead, Outlier. Did none reach you from upstream? I filled these dogs' mouths with dirt. I fooled them in daylight, and their leader has no tail. Still, I saved a few for you. Where shall I drive them?"
        - id: ch04-b07
          speaker: wontolla
          text: "I will wait. The night lies ahead."
        - id: ch04-b08
          speaker: narrator
          text: "The Seeonee wolves sounded nearer and nearer, crying that the hunt was met for the whole Pack. A bend drove the dholes onto the sandy shallows opposite the Lairs. Only then did they understand their error. They should have landed half a mile earlier and attacked on dry ground. Now burning eyes lined the bank. The Jungle was silent except for the pheeal, which had screamed without stopping since sunset. Won-tolla seemed almost to coax the dholes ashore."
        - id: ch04-b09
          speaker: dhole_leader
          text: "Turn and take hold!"
        - id: ch04-b10
          speaker: narrator
          text: "At their leader's order, the entire pack turned and hurled itself at the shore. The dogs thrashed, kicked, and scrambled through the shallow water. Soon the face of the Waingunga was white with foam and torn by their bodies. Great ripples ran from one side to the other like the bow waves made by a boat. The dholes could not spread out. The current and the narrow landing drove them shoulder to shoulder, and they climbed toward the river beach in one packed red wave. Mowgli rushed with them. His knife stabbed and sliced wherever a body rose before him, while the press of the dogs carried him toward the waiting wolves."
        - id: ch04-b11
          speaker: narrator
          text: "Then the long battle began. It heaved and strained along the wet red sand. It split apart, gathered again, narrowed, and spread through tangled roots, bushes, and clumps of grass. Even after the bees and river, the dholes still outnumbered the wolves two to one. But the Seeonee wolves fought for everything that made them a Pack. The short, deep-chested hunters with high shoulders and white tusks fought for their hunting ground and their fellows. The anxious-eyed she-wolves came from the lairs to fight for their litters. Here and there a yearling, still wearing part of his first woolly coat, pulled and grappled beside his mother. A wolf goes for an enemy's throat or snaps at the flank. A dhole prefers to bite low at the belly. While the red dogs struggled from the river, they had to lift their heads, and that gave the wolves their chance at the throat. Once the dholes gained dry land, the wolves began to suffer. In water and on shore, wherever Mowgli could reach an enemy, his knife went in and out without rest."
        - id: ch04-b12
          speaker: narrator
          text: "The Four fought their way to Mowgli. Gray Brother crouched between the boy's knees and guarded his stomach. The others protected his back and sides. When a leaping dhole drove itself onto the steady knife and knocked Mowgli down, they stood above him. Everywhere else, fighters locked together in a swaying mass that rolled from left to right, then right to left, while turning slowly around its own center. A mound of bodies might rise like a blister in a whirlpool. Then it would burst and throw out four or five torn dogs, each struggling to force its way back into the middle. In another place, two or three dholes would bear down one wolf. Even while sinking beneath them, the wolf dragged his enemies forward. A yearling killed early in the fight sometimes remained upright because the bodies around him held him there. His mother, mad with a rage too deep for sound, rolled over and over as she snapped, then vanished onward into the press. In the heart of the confusion, one wolf and one dhole might forget every other enemy. They watched each other, turned, and searched for the first hold, only to be swept apart by another rush of fighting bodies."
        - id: ch04-b13
          speaker: narrator
          text: "Once Mowgli passed Akela in the dark. A dhole hung from each of the old wolf's flanks, while his nearly toothless jaws remained locked across the loins of a third. Later Mowgli saw Phao with his teeth set in another dog's throat. The Pack leader was dragging the unwilling dhole toward the yearlings so they could finish it. Those were only brief clear pictures. Most of the fight was a blind struggle in darkness. Bodies struck, tripped, and tumbled. Yelps and groans rose above the endless sound of worrying teeth, around Mowgli, behind him, and even above him. As the night deepened, the whole dizzy circle of battle turned faster. At last the dholes began to lose courage. They feared throwing themselves against the strongest wolves, but they did not yet dare to run away. Mowgli felt that the end was coming. He no longer needed to kill every dog he reached, so he struck only to cripple them for the Pack. The young yearlings grew bolder. Now and then there was enough space for Mowgli to breathe and call a word to a friend. Sometimes even the faint flash of his knife was enough to turn a dhole away."
        - id: ch04-b14
          speaker: gray_brother
          text: "The meat is almost stripped to the bone!"
        - id: ch04-b15
          speaker: mowgli
          text: "But the bone still needs breaking. Eowawa! This is how we hunt in the Jungle!"
        - id: ch04-b16
          speaker: narrator
          text: "His red blade flashed along a dhole's side. A clinging wolf had already trapped the dog's hindquarters."
        - id: ch04-b17
          speaker: wontolla
          text: "My kill! Leave this one to me."
        - id: ch04-b18
          speaker: narrator
          text: "Won-tolla was terribly wounded, but his grip had paralyzed the dhole so it could not twist and bite him."
        - id: ch04-b19
          speaker: mowgli
          text: "Is your stomach still empty, Outlier? By the Bull that bought me, you have caught the tailless leader! A hunter should not kill cubs and she-wolves unless he has also killed the Outlier. I believe Won-tolla will kill you now, Red Dog."
        - id: ch04-b20
          speaker: narrator
          text: "Another dhole jumped to save its leader. Before its teeth reached Won-tolla's side, Mowgli put the knife through its throat. Gray Brother finished what remained."
        - id: ch04-b21
          speaker: mowgli
          text: "And that is how we hunt in the Jungle."
        - id: ch04-b22
          speaker: narrator
          text: "Won-tolla spoke no more. As his own life drained away, his jaws closed harder and harder upon the leader's spine. The dhole shuddered, lowered its head, and became still. Won-tolla fell dead across him."
        - id: ch04-b23
          speaker: mowgli
          text: "The Blood Debt is paid. Sing your song, Won-tolla."
        - id: ch04-b24
          speaker: gray_brother
          text: "He will hunt no more. Akela has been silent for a long time too."
        - id: ch04-b25
          speaker: phao
          text: "The bone is broken! They are running! Hunters of the Free People, kill them all!"
        - id: ch04-b26
          speaker: narrator
          text: "One dhole after another slipped away from the bloody sands, toward river or forest, upstream or down, wherever a road opened."
        - id: ch04-b27
          speaker: mowgli
          text: "The debt! Make them pay the debt! They killed the Lone Wolf. Do not let one dog escape!"

    - id: ch05
      title: Akela's Last Song
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: "Mowgli rushed toward the water with his knife, ready to stop any dhole that tried to swim away. Then Akela's head and forequarters rose from beneath a heap of nine dead enemies. Mowgli dropped to his knees beside him."
        - id: ch05-b02
          speaker: akela
          text: "Did I not say this would be my last fight? It was good hunting. And you, Little Brother?"
        - id: ch05-b03
          speaker: mowgli
          text: "I am alive, and I killed many."
        - id: ch05-b04
          speaker: akela
          text: "Yes. I am dying, and I want to die beside you, Little Brother."
          emotion: sad
        - id: ch05-b05
          speaker: narrator
          text: "Mowgli laid the terribly scarred head across his knees and wrapped both arms around Akela's torn neck."
        - id: ch05-b06
          speaker: akela
          text: "Long years have passed since Shere Khan's time, and since a naked Man-cub rolled in the dust."
        - id: ch05-b07
          speaker: mowgli
          text: "No, no! I am a wolf. I wear one skin with the Free People. I never chose to be a man."
          emotion: sad
        - id: ch05-b08
          speaker: akela
          text: "You are a man, Little Brother, and the wolfling I watched over. If you were not a man, the Pack would have fled from the dholes. I owed you my life, and today you saved the Pack as I once saved you. Do you remember? Every debt is paid. Go to your own people now. Eye of my eye, this hunt has ended. Go back to Man."
        - id: ch05-b09
          speaker: mowgli
          text: "I will never go. I will hunt alone in the Jungle. I have given my word."
        - id: ch05-b10
          speaker: akela
          text: "After summer come the Rains. After the Rains comes spring. Go back before something drives you."
        - id: ch05-b11
          speaker: mowgli
          text: "Who could drive me?"
        - id: ch05-b12
          speaker: akela
          text: "Mowgli will drive Mowgli. Return to your people. Go to Man."
        - id: ch05-b13
          speaker: mowgli
          text: "When Mowgli drives Mowgli, I will go."
        - id: ch05-b14
          speaker: akela
          text: "Then there is nothing more to say. Little Brother, will you lift me to my feet? I too was once a leader of the Free People."
        - id: ch05-b15
          speaker: narrator
          text: "With great care, Mowgli moved the bodies away. He raised Akela and held him upright with both arms. The Lone Wolf drew one long breath and began the Death Song that a Pack leader sings when he dies. His voice grew stronger as the song went on. It climbed and rang across the river until the final cry of good hunting. For one instant Akela shook himself free. He leaped into the air, then fell backward, dead upon his last and most terrible kill."
        - id: ch05-b16
          speaker: narrator
          text: "Mowgli sat with his head bowed onto his knees and cared for nothing else. Beyond him, the merciless she-wolves overtook and pulled down the last fleeing dholes. Little by little, the hunting cries weakened and died away. Then the wolves came back to the riverbank, limping more heavily as their wounds cooled and stiffened. They began to count what the victory had cost. Fifteen hunters of the Pack lay dead beside the Waingunga, and so did six of the she-wolves from the lairs. Among all the others, not one wolf had escaped without a mark. Through the returning wolves, through the counting and the silence, Mowgli remained beside Akela. He did not move until the cold light of daybreak reached the sands. Then Phao came to him and lowered a muzzle wet with water and red with blood into Mowgli's hand. Mowgli drew his hand away so Phao could see the gaunt body of the old Lone Wolf."
        - id: ch05-b17
          speaker: phao
          text: "Good hunting, Akela."
        - id: ch05-b18
          speaker: narrator
          text: "Phao spoke as though the old wolf still lived. Then he looked back across his bitten shoulder."
        - id: ch05-b19
          speaker: phao
          text: "Howl, dogs! A Wolf died tonight!"
          emotion: sad
        - id: ch05-b20
          speaker: narrator
          text: "Two hundred fighting dholes had come north boasting that every jungle belonged to them and that no living creature could stand in their path. The battle ended their journey. Not one Red Dog returned to the Dekkan to carry that boast home."
