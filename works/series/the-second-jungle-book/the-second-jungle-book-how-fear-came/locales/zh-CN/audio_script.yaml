  chapters:
    - id: ch01
      title: 大旱与饮水休战
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 溪流细了，水潭干了。猎手和猎物挤在同一条河岸上，热病烧着腮，尘土扑满肋腹。谁也不再想着追逐和杀戮，全被同一种干渴的恐惧镇住。幼鹿躲在母亲腹下，看见瘦狼也像自己一样畏缩。高大的雄鹿一动不动，望着曾撕开父亲喉咙的利齿。直到天边的云层放下大雨，冲破饮水休战。在那以前，他们都是同伴，都是玩伴。
        - id: ch01-b02
          speaker: narrator
          text: 《丛林法则》比世上任何法律都古老，丛林居民可能遇上的祸事，它差不多样样都有规矩。经过无数年月，习惯一代代传下来，这部法典已经完备得不能再完备。毛克利一生中有很长一段时光住在西奥尼狼群，巴鲁就在那里教他学习法则。男孩嫌那些命令没完没了，巴鲁便说，法则像巨大的藤蔓，会落到每个人背上，谁也躲不开。
        - id: ch01-b03
          speaker: baloo
          text: 小兄弟，等你活到我这把年纪，就会看见整个丛林服从同一条法则。那场面可不好看。
        - id: ch01-b04
          speaker: narrator
          text: 毛克利没把这话放在心上，那番教训从一只耳朵进去，又从另一只耳朵溜走。一个成天只顾吃饭睡觉的孩子，总要等麻烦站到面前、盯住自己，才肯操心。后来有一年，巴鲁的话真的应验了。毛克利亲眼看见整个丛林怎样在法则下行事。
        - id: ch01-b05
          speaker: narrator
          text: 那年冬季几乎没下雨。豪猪伊基在一片竹林里遇见毛克利，告诉他野山药正在枯死。所有动物都知道，伊基挑选食物时挑剔得可笑，不是最熟、最好的东西绝不入口。所以毛克利听了只觉得好笑。
        - id: ch01-b06
          speaker: mowgli
          text: 那跟我有什么关系？
        - id: ch01-b07
          speaker: ikki
          text: 眼下关系不大，往后就知道了。小兄弟，蜂岩下面那个深石潭还能跳水吗？
        - id: ch01-b08
          speaker: mowgli
          text: 不能。那笨水快跑光了，我才不去撞破脑袋。
        - id: ch01-b09
          speaker: ikki
          text: 吃亏的是你。脑袋开条小缝，也许能漏进去一点智慧。
        - id: ch01-b10
          speaker: narrator
          text: 伊基赶紧低头，躲过毛克利来揪鼻须的手。毛克利那时自信得很，觉得自己一个人知道的事，抵得上五个丛林居民。可他还是把这番话告诉巴鲁。巴鲁听完沉下脸，半是对毛克利、半是对自己低声盘算起来。
        - id: ch01-b11
          speaker: baloo
          text: 若只有我自己，我现在就会换个猎场，赶在别人想到以前动身。可到陌生地方打猎少不了争斗，他们还可能伤到人崽。我们先等着，看莫瓦树开不开花。
        - id: ch01-b12
          speaker: narrator
          text: 那年春天，巴鲁喜欢的莫瓦树没有开花。淡绿乳白的蜡质花苞还未开放，就被热死了。巴鲁用后腿站起来摇树，也只落下几片难闻的花瓣。酷热没有半点收敛，一寸寸钻进丛林深处，把绿色烤成黄色、褐色，最后烤成黑色。
        - id: ch01-b13
          speaker: narrator
          text: 沟边的草烧成断铁丝似的枯梗。水潭下沉，泥面结硬，岸边最后一个脚印像铸进了铁里。多汁的藤蔓从树上脱落，死在树根旁。枯竹在热风里铿锵碰撞，苔藓从岩石上剥落，石头赤裸滚烫，像干河床上被热气晃动的蓝色巨石。
        - id: ch01-b14
          speaker: narrator
          text: 鸟儿和猴民早早往北去了。鹿和野猪跑到村庄的枯田里，有时死在人们眼前，可人已经虚弱得杀不动它们。鸢鹰奇尔却靠遍地腐肉长胖了。他每天傍晚都带回同一个消息：向任何方向飞三天，太阳都在杀死丛林。
        - id: ch01-b15
          speaker: narrator
          text: 毛克利从没尝过真正的饥饿，如今只能去废弃的石蜂巢里刮三年前的陈蜜。那蜜黑得像黑刺李，表面蒙着一层干糖粉。他又剥开树皮，找钻进深处的幼虫，还去抢黄蜂新孵的幼崽。丛林里的猎物全都只剩皮包骨。巴希拉一夜可以捕杀三次，却还是吃不上一顿饱饭。更糟的是缺水。丛林居民喝得不勤，可每次都要喝足。
        - id: ch01-b16
          speaker: narrator
          text: 热浪一天接着一天，吸走了最后一点湿气。最后，温贡加河的主河道成了唯一还在死寂河岸间流动的水，不过也只剩下一线。野象哈蒂已经活了百年以上。他看见河心露出一道细长的青色石脊，认出那是和平岩，立刻举起长鼻宣布饮水休战，正如五十年前他的父亲所做的一样。鹿、野猪和水牛用嘶哑的声音传开呼号，奇尔也飞着大圈，把尖厉的警讯送往四面八方。
        - id: ch01-b17
          speaker: narrator
          text: 休战一旦宣布，谁在饮水处杀生，谁就得死，因为喝水比吃饭更要紧。猎物少时，大家总还能想办法活下去。可水就是水，只剩一处水源时，丛林居民必须来这里取水，所有狩猎也必须停下。好年景里，年轻雄鹿最喜欢冒险下河。它们悄悄走下岸，不惊动一片叶子，再涉入没膝的激流，让轰响盖住背后一切声音。喝水时，它们还要越过肩膀回头张望，全身肌肉绷紧，准备一受惊就拼命跳走。喝饱后，它们去沙地打个滚，带着湿鼻吻和圆肚皮回到鹿群，享受同伴羡慕的目光。正因为巴希拉或谢尔汗随时会扑来，把它们按倒，这才刺激得很。
        - id: ch01-b18
          speaker: narrator
          text: 如今这份生死乐趣没有了。老虎、熊、鹿、水牛和野猪又饿又累，一同来到缩小的河边，喝污水，伏在水面上方喘息，累得连离开都做不到。鹿和野猪走了一整天，也找不到比干树皮和枯叶更好的食物。水牛没有泥塘可以纳凉，也偷不到青庄稼。蛇离开丛林，盘在湿石头上等一只落单的青蛙。野猪刨食时用鼻子把它们拱开，它们也懒得咬。河龟早被最精明的猎手巴希拉吃光，鱼深深钻进干泥。只有和平岩像长蛇横在浅滩上。疲惫的小水纹拍到它滚烫的侧面，嘶嘶响着干掉。
        - id: ch01-b19
          speaker: narrator
          text: 毛克利每晚都来这里乘凉，也来寻找同伴。他光裸的皮肤让他显得比所有动物更瘦、更可怜，连最饿的敌人都不会想吃。头发被太阳晒成浅麻色，肋骨像篮架一样一根根凸起。他平日四肢着地追踪猎物，膝盖和手肘都磨出了硬疙瘩，如今长在细瘦的四肢上，像草茎的节。只有蓬乱额发下的眼睛依旧清凉安静。巴希拉在这段苦日子里给他出主意，教他走路要静，打猎要慢，无论如何别发脾气。
        - id: ch01-b20
          speaker: bagheera
          text: 眼下是坏日子，不过只要我们能活到尽头，它总会过去。人崽，你的肚子吃饱了吗？
        - id: ch01-b21
          speaker: mowgli
          text: 肚里有东西，可一点用也没有。巴希拉，雨季是不是忘了我们，再也不回来了？
        - id: ch01-b22
          speaker: bagheera
          text: 我不信。我们还会看见莫瓦开花，小鹿吃着新草长胖。来，去和平岩听消息。爬到我背上。
        - id: ch01-b23
          speaker: mowgli
          text: 现在可不是驮分量的时候。我还能自己站住。再说，咱俩说到底都不是养肥的公牛。
        - id: ch01-b24
          speaker: narrator
          text: 巴希拉低头看了看自己蓬乱、满是尘土的肋腹，仿佛不愿让别的动物听见似的，把声音压得很低。
        - id: ch01-b25
          speaker: bagheera
          text: 昨夜我杀了一头套着轭的公牛。我已经虚弱到这种地步，要是它没拴着，我恐怕都不敢扑。呜嗷！
        - id: ch01-b26
          speaker: mowgli
          text: 咱们真是了不起的猎手。我也勇敢得很，敢吃虫子呢。
        - id: ch01-b27
          speaker: narrator
          text: 两个伙伴一起穿过干枯的灌木。枝叶在脚下噼啪作响。他们来到河岸，看见一道道浅滩从岸边伸向四方，像铺开的网眼花边。巴鲁也赶来同他们会合。
        - id: ch01-b28
          speaker: baloo
          text: 这点水活不了多久。看对岸，那些兽径已经宽得像人修的路。
        - id: ch01-b29
          speaker: narrator
          text: 对岸十英尺高的草直立着死去，干得像木乃伊。鹿和野猪踩出的路全朝河边延伸，把没有颜色的草原划成一道道尘沟。天还早，每条长路上已经挤满赶来喝水的动物。母鹿和幼鹿在鼻烟般的尘土里咳嗽，隔着河都能听见。上游，死水绕着和平岩拐弯。哈蒂是饮水休战的守护者，他带着三个儿子站在那里，月光下又瘦又灰，不停前后摇晃。鹿群的先头排在他们下面，再往下是野猪和野水牛。对岸的高树一直长到水边，树下的位置留给了老虎、狼、黑豹、熊和其他食肉者。
        - id: ch01-b30
          speaker: bagheera
          text: 看来大家真归一条法则管了。祝各位同族猎运亨通。若不是法则挡着，今晚的猎运一定更亨通。
        - id: ch01-b31
          speakers: [deer_1, deer_2, deer_3]
          ensemble: chorus
          text: 休战！别忘了休战！
          emotion: fearful
        - id: ch01-b32
          speaker: hathi
          text: 安静。休战仍然有效，巴希拉。现在不谈打猎。
        - id: ch01-b33
          speaker: bagheera
          text: 还有谁比我更清楚？我如今只吃乌龟、抓青蛙。呃呀，要是嚼树枝也能填肚子该多好！
        - id: ch01-b34
          speaker: young_fawn
          text: 我们才真盼着你能吃树枝呢。
        - id: ch01-b35
          speaker: narrator
          text: 小鹿那年春天才出生，完全不喜欢巴希拉这番话。丛林居民虽然已经苦不堪言，哈蒂听见这个回答，还是忍不住低声发笑。毛克利用手肘支着身体，伏在温热的水里放声大笑，还用双脚把水面的浮沫拍得到处都是。
        - id: ch01-b36
          speaker: bagheera
          text: 说得好，小角芽。休战结束以后，我会记住你这份情。
        - id: ch01-b37
          speaker: narrator
          text: 他望进黑暗，仔细认住那只小鹿，好等休战结束以后还能找到它。饮水处渐渐热闹起来。野猪一边推搡一边喷着鼻息，要别的动物再让出一点地方。水牛摇摇晃晃穿过沙洲，彼此低声咕哝。鹿则讲起寻找食物的漫长苦路，说自己走到四蹄生疼。它们偶尔向对岸的食肉者问消息，听到的却全是坏消息。滚烫的风在岩石和咔嗒碰响的枯枝间来来去去，把碎枝与尘土撒到水上。
        - id: ch01-b38
          speaker: young_sambhur
          text: 人也死在犁边。我从日落走到天黑，看见三个。他们和公牛都躺着不动。过不了多久，我们也会那样。
          emotion: sad
        - id: ch01-b39
          speaker: baloo
          text: 河水比昨天夜里又低了一截。哈蒂，你活了这么久，见过这样的大旱吗？
        - id: ch01-b40
          speaker: hathi
          text: 会过去的。它一定会过去。
        - id: ch01-b41
          speaker: narrator
          text: 哈蒂一面说，一面把水喷到背上和身体两侧。巴鲁却转头看着他深爱的男孩，心里显然没有这样踏实。
        - id: ch01-b42
          speaker: baloo
          text: 可我们这里有一个，恐怕撑不了太久了。
        - id: ch01-b43
          speaker: mowgli
          text: 我？我不过是没有长毛遮住骨头。可巴鲁，要是把你的皮也剥掉——
        - id: ch01-b44
          speaker: narrator
          text: 哈蒂想到那模样，浑身摇了起来。巴鲁却很严肃。
        - id: ch01-b45
          speaker: baloo
          text: 人崽，不许这样对法则教师说话。从没有谁见过我不带皮的样子。
        - id: ch01-b46
          speaker: mowgli
          text: 我没有恶意。你像一只包着壳的椰子，我就是同一只椰子，只不过没壳。你那层棕色的壳——
        - id: ch01-b47
          speaker: narrator
          text: 毛克利盘腿坐着，像平常解释道理时那样竖起食指。还没等他把棕色外壳讲完，巴希拉已经伸出一只厚软的爪子，把他仰面掀进水里。男孩呛着水，扑腾着爬了起来。
        - id: ch01-b48
          speaker: bagheera
          text: 越说越不像话。先要剥巴鲁的皮，又说他是椰子。小心他像熟椰子那样对付你。
        - id: ch01-b49
          speaker: mowgli
          text: 熟椰子会怎样？
        - id: ch01-b50
          speaker: bagheera
          text: 砸破你的脑袋。
        - id: ch01-b51
          speaker: narrator
          text: 这原是丛林里最老套的圈套，毛克利却一时没提防。巴希拉平静地说完，又把他按进水里。等毛克利第三次被浸过水，再冒出头时，才听见巴鲁认真教训他。
        - id: ch01-b52
          speaker: baloo
          text: 拿老师取笑不好。
    - id: ch02
      title: 谢尔汗的权利
      blocks:
        - id: ch02-b01
          speaker: shere_khan
          text: 不好？那还要怎样？这个光溜溜的东西四处乱跑，把从前的好猎手当猴子耍，还揪最出色者的胡须取乐。丛林都成了光皮崽子的育幼场。看着我，人崽！
        - id: ch02-b02
          speaker: narrator
          text: 瘸虎谢尔汗一拐一拐来到水边，故意停下，享受对岸鹿群因他而起的骚动。毛克利抬眼看去，或者说，他用自己摆得出的最傲慢神气瞪了过去。没过多久，谢尔汗反倒不安地转开了头。
        - id: ch02-b03
          speaker: shere_khan
          text: 什么人崽不人崽。他既不像人，也不像幼崽，不然早就害怕了。下个季节，我喝水也许还得先求他准许。嗷呜！
        - id: ch02-b04
          speaker: bagheera
          text: 也许真会有那一天。呸，谢尔汗！你又把什么耻辱带到这里来了？
        - id: ch02-b05
          speaker: narrator
          text: 瘸虎把下巴和腮帮浸进水里，乌黑油腻的污迹立刻顺流漂开。
        - id: ch02-b06
          speaker: shere_khan
          text: 人。一个钟头前杀的。
        - id: ch02-b07
          speaker: narrator
          text: 谢尔汗说完，仍兀自得意地咕噜、低吼。两岸的兽群一齐颤动，原本整齐的队伍前后摇摆。低语从一小片动物传到另一小片，越传越响，最后变成了喊声。
        - id: ch02-b08
          speakers: [deer_1, deer_2, deer_3]
          ensemble: chorus
          text: 人！他杀了人！
          emotion: fearful
        - id: ch02-b09
          speaker: narrator
          text: 大家全都望向哈蒂，他却像没听见。时候未到，哈蒂从不行动，这也是他能活得那么久的原因之一。巴希拉轻蔑地盯着谢尔汗，从被弄脏的水里爬出来，像猫那样一只一只甩干爪子。
        - id: ch02-b10
          speaker: bagheera
          text: 这种时候还去杀人？难道没有别的猎物了吗？
        - id: ch02-b11
          speaker: shere_khan
          text: 我杀他，是因为我乐意，不是因为饿。我现在来喝水，也把自己洗干净。谁敢拦我？
        - id: ch02-b12
          speaker: narrator
          text: 谢尔汗故意拖长声音。恐惧的耳语再次响起，哈蒂那只警觉的小白眼珠终于斜向他。巴希拉的脊背一点点弓起，像狂风里的竹子。哈蒂却只举起长鼻，声音依旧平稳。
        - id: ch02-b13
          speaker: hathi
          text: 你杀他，只因为自己乐意？
        - id: ch02-b14
          speaker: narrator
          text: 哈蒂问话时，谁都知道最好回答。
        - id: ch02-b15
          speaker: shere_khan
          text: 正是。这是我的权利，也是属于我的那一夜。哈蒂，你知道。
        - id: ch02-b16
          speaker: hathi
          text: 我知道。你喝够了吗？
        - id: ch02-b17
          speaker: shere_khan
          text: 今晚够了。
        - id: ch02-b18
          speaker: hathi
          text: 那就走。河水是用来喝的，不是让你弄脏的。人和丛林居民都在受苦，这种时候也只有瘸虎会夸耀这份权利。无论你洗没洗净，滚回巢穴去，谢尔汗！
          emotion: angry
        - id: ch02-b19
          speaker: narrator
          text: 最后几个字像银号一样响彻河岸。哈蒂的三个儿子齐齐向前迈了半步，其实根本用不着他们出手。谢尔汗低着身子溜走，连一声低吼都不敢发出。他和所有动物都清楚，事情真到了最后一步，哈蒂才是丛林的主人。
        - id: ch02-b20
          speaker: mowgli
          text: 谢尔汗说的那份权利究竟是什么？法则明明说，杀人永远都是可耻的。可哈蒂刚才却说他知道那份权利。
        - id: ch02-b21
          speaker: bagheera
          text: 你去问哈蒂，我也不知道。有没有权利都一样。要不是哈蒂先开口，我早就教训那个瘸腿屠夫了。刚杀完人就跑到和平岩来，还拿这事炫耀，这是豺狗才有的行径。何况，他还把大家仅剩的好水弄脏了。
        - id: ch02-b22
          speaker: narrator
          text: 毛克利等了一会儿，先给自己壮了壮胆，因为谁也不大愿意直接向哈蒂发问。等勇气攒够了，他才朝着河面高声喊起来。
        - id: ch02-b23
          speaker: mowgli
          text: 哈蒂，谢尔汗到底有什么权利？
        - id: ch02-b24
          speaker: narrator
          text: 两岸都清清楚楚地回荡着他的声音。丛林居民个个好奇得要命，因为他们刚刚亲眼看见了一件从未见过的事。除了神色若有所思的巴鲁，没有谁明白其中的缘故。
        - id: ch02-b25
          speaker: hathi
          text: 这是一个非常古老的故事，比我们眼前这座丛林还要古老。两岸全都安静下来，我就从头讲给你们听。
        - id: ch02-b26
          speaker: narrator
          text: 野猪和水牛推搡了一会儿，两个兽群的首领先后答话。
        - id: ch02-b27
          speakers: [pig_leader, buffalo_leader]
          ensemble: duo
          text: 我们等着。
        - id: ch02-b28
          speaker: narrator
          text: 哈蒂大步走进和平岩旁的潭水，直到水几乎没过他的膝头。他消瘦多皱，象牙发黄，可站在兽群面前时，仍显出丛林熟悉的模样。他就是他们的主人。
    - id: ch03
      title: 恐惧来到丛林
      blocks:
        - id: ch03-b01
          speaker: hathi
          text: 孩子们，你们都知道，世上万物之中，你们最怕的是人。
        - id: ch03-b02
          speaker: narrator
          text: 两岸传来赞同的低语。
        - id: ch03-b03
          speaker: bagheera
          text: 小兄弟，仔细听，这个故事也跟你有关。
        - id: ch03-b04
          speaker: mowgli
          text: 跟我有关？我是狼群的一员，是自由民的猎手。我跟那些人能有什么关系？
        - id: ch03-b05
          speaker: hathi
          text: 可你们不知道为什么怕人。丛林刚诞生时，谁也不知道那是哪一年，我们共同来往，彼此不怕。那时没有旱灾，一棵树上同时有叶、有花、有果。大家只吃叶子、花朵、青草、果实和树皮。
        - id: ch03-b06
          speaker: bagheera
          text: 幸好我没生在那时。树皮只适合磨爪子。
        - id: ch03-b07
          speaker: hathi
          text: 当时的丛林主人，是第一头大象塔。他用长鼻把丛林从深水里拖出来。象牙犁过大地，河流就顺着犁痕奔淌。脚掌踏下去，那里便涌出清澈的池塘。他从鼻子里这样吹一口气，树木便倒下。丛林就是这样造成的，故事就是这样传给我的。
        - id: ch03-b08
          speaker: bagheera
          text: 传了这么久，这故事倒一点也没变瘦。
        - id: ch03-b09
          speaker: narrator
          text: 毛克利用手掩住嘴笑了。哈蒂继续往下讲。
        - id: ch03-b10
          speaker: hathi
          text: 那时没有谷物、甜瓜、胡椒和甘蔗，也没有大家后来见过的小茅屋。丛林居民还不知道人，全都住在一起，原本是一族。可他们很快为了食物争吵，虽然草地足够所有动物吃饱。他们太懒，只想躺在哪里就吃哪里的草，就像春雨丰沛时偶尔还能做的那样。塔忙着开辟新的丛林，把河水引进河床，不能每个地方都亲自赶到，于是任命第一只老虎做丛林的主人和裁判，让大家把争端带到他面前。
        - id: ch03-b11
          speaker: hathi
          text: 那时，第一只老虎也和大家一样吃果子和青草。他和我一样高大，模样美极了，浑身都是黄藤花的颜色。在丛林刚刚诞生的好日子里，他的皮毛上没有一道条纹，也没有一块斑痕。丛林居民毫不害怕地走到他面前，他说的话就是整个丛林的法则。记住，那时我们还是同一个族群。
        - id: ch03-b12
          speaker: hathi
          text: 一天夜里，两头雄鹿为了吃草争执起来。这本来只是如今用角和前蹄就能解决的小事。他们来到第一只老虎面前，当时他正卧在花丛里。其中一头鹿说着说着，用角顶了他一下。第一只老虎忘记自己是主人和裁判，扑上去折断了那头鹿的脖子。
        - id: ch03-b13
          speaker: hathi
          text: 在那个夜晚以前，我们之中从没有谁死过。第一只老虎看见自己做了什么，又被血腥味迷昏，逃进北方沼泽。丛林没有裁判，大家便互相争斗。塔听见吵闹赶回来。有的动物这样讲，有的那样说，可他一眼就看见死鹿躺在花丛中，于是问是谁杀的。血腥味也叫我们发昏，谁都不肯说，只管兜着圈子乱跑，跳着喊着，不停摇头。
        - id: ch03-b14
          speaker: hathi
          text: 塔命令所有低垂的树木和拖在地上的藤蔓，等杀鹿者经过时，就在他身上留下记号，好让塔再次见到时能够认出凶手。接着，他问在场的动物，现在谁愿意来做丛林居民的主人？
        - id: ch03-b15
          speaker: gray_ape
          text: 我来！现在我就是丛林的主人！
        - id: ch03-b16
          speaker: narrator
          text: 塔笑了，让灰猿如愿，自己却生着气离开。
        - id: ch03-b17
          speaker: hathi
          text: 你们都认识灰猿。他那时和现在一样。起初，他故意装出一张聪明的脸。可没过多久，他就又抓又挠，跳上跳下。塔回来时，他正倒挂在树枝上，嘲弄站在下面的动物，大家也反过来嘲弄他。丛林里再没有法则，只剩愚蠢的闲话和毫无意义的胡言乱语。
        - id: ch03-b18
          speaker: narrator
          text: 塔把所有动物召到一起。
        - id: ch03-b19
          speaker: tha
          text: 你们的第一位主人把死亡带进丛林，第二位又带来了耻辱。现在该有一条法则了，一条你们绝不能违反的法则。从今以后，你们会认识恐惧。等找到他，就会知道他才是你们的主人，其余一切也会跟着到来。
        - id: ch03-b20
          speakers: [deer_1, pig_leader, buffalo_leader]
          ensemble: chorus
          text: 恐惧是什么？
        - id: ch03-b21
          speaker: tha
          text: 去找，找到为止。
        - id: ch03-b22
          speaker: hathi
          text: 我们走遍丛林寻找恐惧。不久，水牛带回了消息——
        - id: ch03-b23
          speaker: mysa
          text: 呃！
        - id: ch03-b24
          speaker: hathi
          text: 对，迈萨，就是水牛。他们说，恐惧坐在丛林的一座洞穴里。他没有毛，只用两条后腿走路。我们跟着牛群，一直来到那座洞穴。果然，一个无毛者站在洞口，模样和水牛说的一样。他一看见我们就放声大叫。那声音一下钻进耳朵，我们便生出直到今天听见人声仍会有的恐惧。大家掉头拼命逃跑，因为害怕而失去理智，互相践踏，互相撕扯。
        - id: ch03-b25
          speaker: hathi
          text: 那一夜，我们没有像从前那样共同躺卧。每一族都独自退开。野猪挨着野猪，鹿靠着鹿，角对着角，蹄挨着蹄，同类只守着同类。所有动物就这样缩在各自族群里，在丛林中不停发抖。
        - id: ch03-b26
          speaker: hathi
          text: 第一只老虎仍躲在北方沼泽。听说洞穴里有个怪物，他立刻要去折断那东西的脖子。他整夜飞奔，直奔那座洞穴。路边的树木和藤蔓记得塔的命令，纷纷垂下枝条，在他跑过时留下记号。它们的指头划过他的背、肋腹、额头和腮帮，每碰到一处，黄色皮毛上就多出一道条纹。直到今天，他的子孙仍穿着它们。
        - id: ch03-b27
          speaker: narrator
          text: 第一只老虎跑到洞口，无毛者伸出手，尖声叫他。
        - id: ch03-b28
          speaker: first_man
          text: 夜里来的条纹东西！
          emotion: fearful
        - id: ch03-b29
          speaker: hathi
          text: 第一只老虎竟然怕了这个无毛者，转过身，一路嚎叫着逃回北方的沼泽。
        - id: ch03-b30
          speaker: narrator
          text: 毛克利把下巴浸在水里，偷偷笑了一声。
    - id: ch04
      title: 老虎的那一夜
      blocks:
        - id: ch04-b01
          speaker: hathi
          text: 第一只老虎嚎得太响，塔听见了，便问他为什么悲伤。老虎抬起鼻吻，对着那片刚刚造好、如今已经无比古老的天空回答。
        - id: ch04-b02
          speaker: first_tiger
          text: 塔，把力量还给我。我在整个丛林面前受了羞辱。我从无毛者面前逃走，他还给我取了可耻的名字。
          emotion: sad
        - id: ch04-b03
          speaker: tha
          text: 他为什么那样叫你？
        - id: ch04-b04
          speaker: first_tiger
          text: 因为沼泽的泥涂满了我的身体。
        - id: ch04-b05
          speaker: tha
          text: 那就游水，再到湿草上打滚。若真是泥，自然会洗掉。
        - id: ch04-b06
          speaker: hathi
          text: 第一只老虎听话地游过水，又到湿草上不停翻滚。他滚了一圈又一圈，滚得眼前整个丛林都团团转。可是浑身上下的条纹没有一道变淡。塔站在旁边看着他，忍不住笑了。
        - id: ch04-b07
          speaker: first_tiger
          text: 我究竟做错了什么，为什么要遭到这些？
        - id: ch04-b08
          speaker: tha
          text: 你杀死雄鹿，把死亡放进了丛林。恐惧跟着死亡而来。如今丛林居民彼此惧怕，正像你惧怕无毛者。
        - id: ch04-b09
          speaker: first_tiger
          text: 他们绝不会怕我。我从丛林初生时就认识他们。
        - id: ch04-b10
          speaker: tha
          text: 那就去看看。
        - id: ch04-b11
          speaker: hathi
          text: 第一只老虎跑遍丛林，高声呼唤鹿、野猪、水鹿、豪猪和各个族群，想让他们重新到自己面前来。可大家一见昔日的裁判就逃，因为他们已经怕他了。没有一个族群愿意停下来听他说话。他只好回到塔面前，心里的傲气全被粉碎。他用头一次次撞地，四只脚一起刨开泥土。
        - id: ch04-b12
          speaker: first_tiger
          text: 记住，我曾是丛林的主人。塔，别忘了我！也别让我的子孙忘记，我曾经没有耻辱，也没有恐惧！
          emotion: sad
        - id: ch04-b13
          speaker: tha
          text: 你和我一起看着丛林造成，所以我会为你留下一件事。每年会有一个夜晚，一切恢复到雄鹿被杀以前。那一夜属于你，也属于你的子孙。你们若遇见无毛者，不会害怕他。他反而会怕你们，仿佛你们仍是丛林的裁判，是万物的主人。可在他恐惧的那一夜，要对他仁慈，因为你自己已经知道恐惧是什么滋味。
        - id: ch04-b14
          speaker: first_tiger
          text: 我很满意。
        - id: ch04-b15
          speaker: hathi
          text: 可他下一次喝水，看见肋腹和身体两侧的黑条纹，想起无毛者叫他的那个名字，又动了怒。他在沼泽住了整整一年，耐心等待塔履行承诺。终于有一夜，月亮的豺狗，也就是昏星，离开丛林上空的雾气，清清楚楚地显现出来。第一只老虎立刻感觉到，属于自己的夜晚已经来了，于是动身去那座洞穴寻找无毛者。
        - id: ch04-b16
          speaker: hathi
          text: 塔的承诺果然应验了。无毛者一见第一只老虎，就倒在他面前，直挺挺伏在地上。老虎挥出一掌，折断了无毛者的脊背。他以为整个丛林里只有这一个怪物，也以为自己已经杀死恐惧。老虎正在尸体上方嗅闻，听见塔从北方树林走来。接着，林间响起第一头大象的声音，也就是此刻山岭间的雷声。
        - id: ch04-b17
          speaker: narrator
          text: 就在哈蒂讲到这里时，雷声滚过干裂而伤痕累累的山岭。那雷没有带来一滴雨，只带来更浓的热气。闪电沿着一道道山脊明明灭灭。哈蒂停了一停，说第一只老虎当年听见的，正是这样的声音。
        - id: ch04-b18
          speaker: tha
          text: 这就是你的仁慈吗？
        - id: ch04-b19
          speaker: first_tiger
          text: 那又怎样？我已经杀死了恐惧。
        - id: ch04-b20
          speaker: tha
          text: 又瞎又蠢的家伙！你解开了死亡的脚，他会沿着你的踪迹追到你死。是你教会了人杀戮！
          emotion: angry
        - id: ch04-b21
          speaker: first_tiger
          text: 他和雄鹿没什么不同。恐惧已经没有了。现在我又能裁判丛林各族。
        - id: ch04-b22
          speaker: tha
          text: 丛林居民再也不会来见你。他们不会穿过你的足迹，不会睡在你附近，不会跟随你，也不会到你的巢穴旁吃草。只有恐惧会跟着你。他会用你看不见的一击，命你停下来听候处置。他会让你脚下的地裂开，让藤索缠住你的脖子，让树干在你四周合拢，长得比你所能跃过的高度还高。最后，他会剥下你的皮，拿去包裹他受冷的幼崽。你没有对他仁慈，他也不会对你仁慈。
        - id: ch04-b23
          speaker: first_tiger
          text: 塔的承诺就是塔的承诺。你不会收回属于我的夜晚吧？
        - id: ch04-b24
          speaker: tha
          text: 那一夜仍属于你，可你要付出代价。你教会人杀戮，而他学得很快。
        - id: ch04-b25
          speaker: first_tiger
          text: 他就在我脚下，脊背已经折断。让整个丛林知道，我杀死了恐惧。
        - id: ch04-b26
          speaker: tha
          text: 你杀的只是许多人中的一个。可你会亲自把消息告诉丛林，因为你的夜晚已经结束。
        - id: ch04-b27
          speaker: hathi
          text: 黑夜过去，天亮了。又一个无毛者从洞穴里走出来。他先看见道路上的尸体，又看见第一只老虎站在尸体上方。无毛者拿起一根削尖的木棍——
        - id: ch04-b28
          speaker: ikki
          text: 他们现在扔的是一种会割伤人的东西。
        - id: ch04-b29
          speaker: narrator
          text: 伊基沙沙作响地走下河岸。贡德人很爱吃豪猪，管伊基叫“霍伊古”。他们的小斧头像蜻蜓一样飞过林间空地，伊基很清楚那东西有多坏。
        - id: ch04-b30
          speaker: hathi
          text: 当时是一根尖木棍，和人们插在陷阱坑底的木棍一样。无毛者把它投出去，深深扎进第一只老虎的肋腹。塔的话这就应验了。老虎疼得嚎叫，在丛林里到处乱跑，直到终于把木棍拔出来。整个丛林从此都知道，无毛者不必走到面前，也能从远处击中他们。大家因此比以前更加害怕。
        - id: ch04-b31
          speaker: hathi
          text: 第一只老虎就这样教会了无毛者杀戮。你们都知道，后来我们各族受尽了这些祸害。有套住身体的绳索，有脚下突然塌开的陷坑，有看不见的机关，也有从远处飞来的尖棍。还有白烟里冲出的蜇人飞虫，也就是步枪子弹，以及把我们逼出藏身处的红花。可每年仍有一个夜晚，无毛者会像塔许诺的那样惧怕老虎。老虎从不肯让他少怕半分，在那一夜遇见人就把人杀死，因为每只老虎都记得祖先受过的羞辱。其余所有日夜里，恐惧一直在丛林中来回行走。
        - id: ch04-b32
          speakers: [deer_1, deer_2, deer_3]
          ensemble: chorus
          text: 唉咿！嗷呜！
          emotion: sad
        - id: ch04-b33
          speaker: hathi
          text: 只有一种巨大的恐惧压住所有动物时，就像眼下这场大旱一样，我们丛林居民才能暂时放下各自心里的小恐惧，来到同一个地方相聚。
        - id: ch04-b34
          speaker: mowgli
          text: 人只有一个夜晚怕老虎吗？
        - id: ch04-b35
          speaker: hathi
          text: 只有一个夜晚。
        - id: ch04-b36
          speaker: mowgli
          text: 可是我、我们，还有整个丛林都知道，谢尔汗一个月会杀两三个人。
        - id: ch04-b37
          speaker: hathi
          text: 没错。可平时他只敢从背后扑人，出掌时还要把头偏开，因为他心里全是恐惧。人只要回头看他，他就会逃。到了属于他的那一夜，他才敢公开走进村庄，从房屋之间穿过，把头伸进门里。人们会伏倒在地，他便在那里杀死一个。那一夜，只杀一个。
        - id: ch04-b38
          speaker: mowgli
          text: 啊，我明白谢尔汗为什么叫我看他了！可他没占到便宜。他连目光都不敢稳住，我也没有伏倒在他脚下。不过我不是人，我是自由民的一员。
        - id: ch04-b39
          speaker: bagheera
          text: 老虎知道哪一夜属于自己吗？
        - id: ch04-b40
          speaker: hathi
          text: 不到月亮的豺狗，也就是昏星，从傍晚的雾气中清楚出现，老虎自己也不会知道。有时属于他的夜晚落在干燥的夏季，有时却落在潮湿的雨季。若没有第一只老虎当初做下的事，这一夜根本不会存在，我们之中也不会有谁认识恐惧。
        - id: ch04-b41
          speaker: narrator
          text: 鹿群想到这故事对自己意味着什么，悲哀地低声哼鸣起来。巴希拉的嘴边却慢慢浮起一个不怀好意的笑。
        - id: ch04-b42
          speaker: bagheera
          text: 人知道这个故事吗？
        - id: ch04-b43
          speaker: hathi
          text: 除了老虎，还有我们这些塔的子孙，也就是大象，从前没有谁知道。如今水潭边的你们也听过这个故事了。我要说的话已经说完。
        - id: ch04-b44
          speaker: narrator
          text: 哈蒂把长鼻慢慢伸进水里，用这个动作表示自己不愿再说下去。两岸也随之安静下来。可毛克利心里还有最后一个疑问。他没有就此罢休，立刻转过身去缠住巴鲁。
        - id: ch04-b45
          speaker: mowgli
          text: 可是，第一只老虎后来为什么不继续吃青草、树叶和树上的东西？他那时只是折断了雄鹿的脖子，又没有吃掉它。到底是什么引着他，叫他从此去吃热腾腾的肉？
        - id: ch04-b46
          speaker: baloo
          text: 树木和藤蔓在他身上留下记号，把他变成了我们今天看见的条纹动物。他从此不肯再吃树木和藤蔓结出的果实，反而向鹿和别的食草者报仇。
        - id: ch04-b47
          speaker: mowgli
          text: 原来你一直都知道这个故事。嘿，那为什么从来没有讲给我听？
        - id: ch04-b48
          speaker: baloo
          text: 因为丛林里到处都是这样的故事。我要是开了头，就永远也讲不完。现在放开我的耳朵吧，小兄弟。
