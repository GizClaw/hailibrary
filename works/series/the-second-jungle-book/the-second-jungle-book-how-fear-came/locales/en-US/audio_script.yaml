  chapters:
    - id: ch01
      title: "The Drought"
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: "The stream has shrunk, and the pool is dry. Predator and prey crowd the same bank, feverish and dusty, held still by one thirsty fear. A fawn can look out from under his mother and see a lean wolf crouching as meekly as he does. A tall buck can watch the very fangs that tore his father's throat. Until the cloud breaks and rain ends the Water Truce, they are comrades. They are playmates."
        - id: ch01-b02
          speaker: narrator
          text: "The Law of the Jungle is the oldest law in the world. Over time, it has made a rule for nearly every trouble that can befall the Jungle People. Mowgli learned that Law from Baloo while he lived with the Seeonee Wolf-Pack. Whenever the boy grew tired of being ordered about, Baloo told him the Law was like the Giant Creeper. It fell across every back, and no one escaped it."
        - id: ch01-b03
          speaker: baloo
          text: "When you've lived as long as I have, Little Brother, you'll see the whole Jungle obey a single Law. You won't enjoy the sight."
        - id: ch01-b04
          speaker: narrator
          text: "Mowgli let that warning pass straight through his head. A boy who spends his days eating and sleeping rarely worries until trouble stands before him. Then one year Baloo's words came true, and Mowgli saw the whole Jungle bend to the Law."
        - id: ch01-b05
          speaker: narrator
          text: "The winter Rains almost failed. In a bamboo thicket, Ikki the Porcupine told Mowgli that the wild yams were drying up. Ikki would eat only the finest, ripest food, so Mowgli laughed at him."
        - id: ch01-b06
          speaker: mowgli
          text: "Why should that matter to me?"
        - id: ch01-b07
          speaker: ikki
          text: "It doesn't matter much yet. Later, we'll see. Can you still dive into the deep rock pool below the Bee-Rocks, Little Brother?"
        - id: ch01-b08
          speaker: mowgli
          text: "No. The silly water keeps disappearing, and I'm not going to crack my head."
        - id: ch01-b09
          speaker: ikki
          text: "Your loss. A little crack might let some wisdom in."
        - id: ch01-b10
          speaker: narrator
          text: "Ikki ducked before Mowgli could tug his nose bristles. Mowgli repeated the talk to Baloo, who looked grave and muttered to himself."
        - id: ch01-b11
          speaker: baloo
          text: "If I were alone, I'd leave these hunting grounds now, before everyone else has the same thought. But hunting among strangers ends in fighting, and they might hurt the Man-cub. We must wait and see whether the mohwa blooms."
        - id: ch01-b12
          speaker: narrator
          text: "That spring, Baloo's beloved mohwa tree never flowered. Heat killed its greenish, cream-colored, waxy blossoms before they opened. When Baloo stood up and shook the tree, only a few foul petals fell. Then the heat crept inch by inch into the Jungle's heart. Green turned yellow, then brown, and at last black."
        - id: ch01-b13
          speaker: narrator
          text: "Plants along the ravines burned into brittle wires and curled scraps. Hidden pools sank and hardened, preserving the last tiny footprints at their edges as if they had been cast in iron. Juicy creepers slipped from the trees and died at their roots. Bamboo withered and clanked in the hot wind. Moss peeled from the deep Jungle rocks until those rocks lay bare and burning, like the blue boulders trembling in the streambed heat."
        - id: ch01-b14
          speaker: narrator
          text: "The birds and Monkey People went north early, because they knew what was coming. Deer and wild pigs fled toward the ruined village fields. Some died before men too weak to kill them. Chil the Kite stayed and grew fat on carrion. Each evening he brought the same news to the animals who lacked the strength to seek new ground. The sun was killing the Jungle for three days' flight in every direction."
        - id: ch01-b15
          speaker: narrator
          text: "Mowgli had never known real hunger. Now he scraped three-year-old honey from abandoned rock hives. It was black as a sloe and dusty with dried sugar. He dug deep-boring grubs from under tree bark and stole young wasps from their nests. Every animal was skin and bone. Bagheera could kill three times in one night and still go hungry. Worst of all was the lack of water. The Jungle People might drink seldom, but when they drank, they needed plenty."
        - id: ch01-b16
          speaker: narrator
          text: "The heat went on, drinking every trace of moisture. At last only a trickle moved through the dead banks of the Waingunga. Then Hathi, the wild elephant who lives a hundred years and more, saw a long, lean ridge of blue rock rising dry from the middle of the stream. It was the Peace Rock. At once he raised his trunk and proclaimed the Water Truce, as his father had done fifty years before. Deer, pigs, and buffalo passed on the hoarse cry, while Chil circled far and wide, whistling and shrieking the warning."
        - id: ch01-b17
          speaker: narrator
          text: "Once the Water Truce is declared, the Law gives death to anyone who kills at the drinking places. Drinking comes before eating. When game is scarce, the Jungle can somehow struggle on. But when only one water source remains, hunting must stop while every creature drinks."
        - id: ch01-b18
          speaker: narrator
          text: "In good seasons, a trip to the Waingunga was dangerous, and young bucks loved it for that reason. They would creep down without stirring a leaf, wade into noisy shallows that hid the sound of anything behind them, and drink while looking back over one shoulder. Every muscle waited for the terrified leap that might save them from Bagheera or Shere Khan. Then they rolled on the sand and returned wet-muzzled and full-bellied to the admiring herd."
        - id: ch01-b19
          speaker: narrator
          text: "Now that deadly game was over. Tiger, bear, deer, buffalo, and pig came together to the shrunken river. Starved and exhausted, they drank the dirty water and stayed hanging over it because they had no strength to leave."
        - id: ch01-b20
          speaker: narrator
          text: "Deer and pigs had searched all day for anything better than dry bark and withered leaves. Buffalo found no cool wallow and no green crop to raid. Snakes left the Jungle hoping for one stray frog. They coiled around wet stones and did not strike even when a rooting pig knocked them loose. Bagheera had eaten the river turtles long ago, and the fish had buried themselves deep in the mud. Across the shallows lay only the Peace Rock, long as a snake, while tired little ripples hissed dry against its hot side."
    - id: ch02
      title: "At the Peace Rock"
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: "Mowgli came there every night for cool water and company. Even his hungriest enemy would hardly have wanted him then. With no fur to hide his body, he looked leaner and more wretched than the others. The sun had bleached his hair pale. His ribs showed like basket ribs, and the hard knots on his knees and elbows made his thin limbs look like knotted grass. Still, his eyes remained cool and quiet beneath his tangled hair. Bagheera had taught him to move gently, hunt slowly, and never lose his temper."
        - id: ch02-b02
          speaker: bagheera
          text: "These are evil days, but they'll pass if we live long enough. Is there food in your stomach, Man-cub?"
        - id: ch02-b03
          speaker: mowgli
          text: "There's something in it, but it does me no good. Bagheera, do you think the Rains have forgotten us? What if they never return?"
        - id: ch02-b04
          speaker: bagheera
          text: "I don't believe that. We'll see the mohwa bloom again and the little fawns grow fat on new grass. Come hear the news at the Peace Rock. Climb on my back, Little Brother."
        - id: ch02-b05
          speaker: mowgli
          text: "This is no time for you to carry weight. I can still walk. Though neither of us looks much like a fat bullock."
        - id: ch02-b06
          speaker: narrator
          text: "Bagheera glanced along his ragged, dusty side and lowered his voice."
        - id: ch02-b07
          speaker: bagheera
          text: "Last night I killed a bullock still under its yoke. I was so weak, I might not have dared to spring if it had been free. Wou!"
        - id: ch02-b08
          speaker: mowgli
          text: "Oh yes, we're mighty hunters now. I'm wonderfully brave when I hunt grubs."
        - id: ch02-b09
          speaker: narrator
          text: "They went together through the crackling brush to the riverbank and the lacework of sandbars reaching from it. Baloo joined them."
        - id: ch02-b10
          speaker: baloo
          text: "The water won't last much longer. Look across the river. Those trails are as broad as Man's roads."
        - id: ch02-b11
          speaker: narrator
          text: "On the far bank, the tall grass had died upright and dried like a mummy. Deer and pigs had beaten dusty gullies through it, all leading toward the river. Though the evening was young, every path held animals hurrying to drink. Does and fawns coughed in the fine, snuff-like dust."
        - id: ch02-b12
          speaker: narrator
          text: "Upstream, where the slow pool bent around the Peace Rock, Hathi stood guard over the Truce. His sons waited beside him, gaunt and gray in the moonlight, rocking without pause. The deer stood below them, then the pigs and wild buffalo. Across the water, under the tall trees, waited the Eaters of Flesh: tiger, wolves, panther, bear, and the rest."
        - id: ch02-b13
          speaker: bagheera
          text: "We truly are under one Law. Good hunting to all of my blood."
        - id: ch02-b14
          speaker: narrator
          text: "Bagheera waded in and stretched full length with one side above the shallows. He watched the clicking antlers and startled eyes of the crowded deer and pigs. Then he spoke through his teeth."
        - id: ch02-b15
          speaker: bagheera
          text: "Without the Law, the hunting would be very good indeed."
        - id: ch02-b16
          speakers: [deer_1, deer_2, deer_3]
          ensemble: chorus
          text: "The Truce! Remember the Truce!"
          emotion: fearful
        - id: ch02-b17
          speaker: hathi
          text: "Peace there. The Truce holds, Bagheera. This isn't the time to speak of hunting."
        - id: ch02-b18
          speaker: bagheera
          text: "Who knows that better than I do? Why, I eat turtles and fish for frogs. Ngaayah! If only chewing branches did me any good."
        - id: ch02-b19
          speaker: young_fawn
          text: "We wish it did. We truly do."
        - id: ch02-b20
          speaker: narrator
          text: "The fawn had been born that spring and disliked Bagheera's joke very much. Even in their misery, Hathi chuckled. Mowgli laughed aloud, lying on his elbows in the warm water and kicking up the scum."
        - id: ch02-b21
          speaker: bagheera
          text: "Well said, little bud-horn. When the Truce ends, I'll remember that in your favor."
        - id: ch02-b22
          speaker: narrator
          text: "Bagheera peered into the darkness to make sure he would know the fawn again. Talk slowly spread along both banks. Pigs shoved and snorted for room. Buffalo grunted as they lumbered over the sandbars. The deer told sad stories of long, footsore searches for food. Sometimes they questioned the Eaters of Flesh across the river, but every answer was bad. The burning wind swept between rock and rattling branch, scattering dust and twigs over the water."
        - id: ch02-b23
          speaker: young_sambhur
          text: "The men are dying beside their plows too. Between sunset and dark, I passed three lying still with their bullocks. Soon we'll be lying still as well."
          emotion: sad
        - id: ch02-b24
          speaker: baloo
          text: "The river is lower than it was last night. Hathi, have you ever known a drought like this?"
        - id: ch02-b25
          speaker: hathi
          text: "It will pass. It will pass."
        - id: ch02-b26
          speaker: narrator
          text: "Hathi sprayed water over his back and sides."
        - id: ch02-b27
          speaker: baloo
          text: "One of us may not last long enough."
        - id: ch02-b28
          speaker: narrator
          text: "He looked at the boy he loved. Mowgli sat upright in the water, offended."
        - id: ch02-b29
          speaker: mowgli
          text: "Me? I may not have long fur over my bones, but if someone took your hide off, Baloo—"
        - id: ch02-b30
          speaker: narrator
          text: "Hathi shuddered at the thought."
        - id: ch02-b31
          speaker: baloo
          text: "Man-cub, that is no proper way to speak to your Law Teacher. No one has ever seen me without my hide."
        - id: ch02-b32
          speaker: mowgli
          text: "I meant no harm. You're like a coconut inside its husk, while I'm the same coconut with no husk at all. Now, that brown covering of yours—"
        - id: ch02-b33
          speaker: narrator
          text: "Mowgli sat cross-legged, explaining with one raised finger, until Bagheera reached out a soft paw and tipped him backward into the water."
        - id: ch02-b34
          speaker: bagheera
          text: "This gets worse and worse. First Baloo must be skinned, and now he's a coconut. Take care he doesn't do what ripe coconuts do."
        - id: ch02-b35
          speaker: mowgli
          text: "What do they do?"
        - id: ch02-b36
          speaker: narrator
          text: "For a moment Mowgli forgot that old Jungle trick."
        - id: ch02-b37
          speaker: bagheera
          text: "They break your head."
        - id: ch02-b38
          speaker: narrator
          text: "Bagheera pulled him under again. After Mowgli had been ducked a third time, Baloo spoke."
        - id: ch02-b39
          speaker: baloo
          text: "It's wrong to make fun of your teacher."
    - id: ch03
      title: "Shere Khan's Right"
      blocks:
        - id: ch03-b01
          speaker: shere_khan
          text: "Wrong? What else do you expect? That naked creature races about, mocks animals who used to be fine hunters, and tugs the best of us by the whiskers for sport."
        - id: ch03-b02
          speaker: narrator
          text: "Shere Khan, the Lame Tiger, limped down to the water. He paused to enjoy the terror among the deer across the stream."
        - id: ch03-b03
          speaker: shere_khan
          text: "So the Jungle is a nursery for naked cubs now. Look at me, Man-cub."
        - id: ch03-b04
          speaker: narrator
          text: "Mowgli stared back with all the insolence he could manage. Before long, Shere Khan looked away uneasily and began to drink."
        - id: ch03-b05
          speaker: shere_khan
          text: "Always Man-cub this and Man-cub that. He's neither man nor cub, or he would be afraid. Next season I'll need his permission before I drink. Augrh!"
        - id: ch03-b06
          speaker: bagheera
          text: "Perhaps you will. But what new shame have you brought here, Shere Khan? Faugh!"
        - id: ch03-b07
          speaker: narrator
          text: "Dark, oily trails floated downstream from the tiger's wet chin and jaws."
        - id: ch03-b08
          speaker: shere_khan
          text: "Man. I killed one an hour ago."
        - id: ch03-b09
          speaker: narrator
          text: "He purred and growled to himself. The lines of animals trembled and swayed as a whisper rose into a cry."
        - id: ch03-b10
          speakers: [deer_1, deer_2, deer_3]
          ensemble: chorus
          text: "Man! He killed Man!"
          emotion: fearful
        - id: ch03-b11
          speaker: narrator
          text: "Every face turned toward Hathi, but the elephant seemed not to hear. Hathi never acts before the proper moment, and that is one reason he lives so long. Bagheera stepped out of the fouled water, shaking each paw like a cat."
        - id: ch03-b12
          speaker: bagheera
          text: "You killed Man in a season like this? Was there no other game?"
        - id: ch03-b13
          speaker: shere_khan
          text: "I chose to kill. I wasn't hungry."
        - id: ch03-b14
          speaker: narrator
          text: "The horrified whisper began again. Hathi's small white eye turned toward Shere Khan."
        - id: ch03-b15
          speaker: shere_khan
          text: "Yes, I chose it. Now I've come to drink and wash myself clean. Who will stop me?"
        - id: ch03-b16
          speaker: narrator
          text: "Bagheera's back bent like bamboo in a storm, but Hathi raised his trunk and spoke quietly."
        - id: ch03-b17
          speaker: hathi
          text: "You killed only because you chose to?"
        - id: ch03-b18
          speaker: narrator
          text: "When Hathi asks, it is wise to answer. Shere Khan became almost polite."
        - id: ch03-b19
          speaker: shere_khan
          text: "I did. It was my right, and it was my Night. You know that, Hathi."
        - id: ch03-b20
          speaker: hathi
          text: "Yes. I know. Have you drunk enough?"
        - id: ch03-b21
          speaker: shere_khan
          text: "For tonight, yes."
        - id: ch03-b22
          speaker: hathi
          text: "Then go. This river is for drinking, not defiling. Only the Lame Tiger would boast of such a right now, while Man and Jungle People suffer together. Clean or filthy, go back to your lair, Shere Khan!"
          emotion: angry
        - id: ch03-b23
          speaker: narrator
          text: "The last words rang like silver trumpets. Hathi's three sons rolled half a step forward, though they did not need to. Shere Khan slunk away without a growl. Like every creature there, he knew that when all else fails, Hathi is Master of the Jungle."
        - id: ch03-b24
          speaker: mowgli
          text: "What right was he talking about? Killing Man is always shameful. The Law says so. But Hathi said—"
        - id: ch03-b25
          speaker: bagheera
          text: "Ask Hathi. I don't know. Right or no right, if he hadn't spoken, I'd have taught that lame butcher a lesson. Coming to the Peace Rock after killing Man, boasting about it, and spoiling our water—that's the trick of a jackal."
        - id: ch03-b26
          speaker: narrator
          text: "Mowgli gathered his courage. No one liked to address Hathi directly."
        - id: ch03-b27
          speaker: mowgli
          text: "Hathi, what right did Shere Khan mean?"
        - id: ch03-b28
          speaker: narrator
          text: "His words echoed from both banks. Every Jungle creature was curious. They had seen something none of them understood, except perhaps Baloo, who looked thoughtful."
        - id: ch03-b29
          speaker: hathi
          text: "It is an old tale, older than the Jungle. Be still along the banks, and I will tell it."
        - id: ch03-b30
          speaker: narrator
          text: "Pigs and buffalo pushed and shouldered one another for another minute. Then the leaders of the herds answered in turn."
        - id: ch03-b31
          speaker: pig_leader
          text: "We are waiting."
        - id: ch03-b32
          speaker: buffalo_leader
          text: "We are waiting."
        - id: ch03-b33
          speaker: deer_1
          text: "We are waiting."
        - id: ch03-b34
          speaker: narrator
          text: "Hathi strode into the pool until the water nearly reached his knees. Lean, wrinkled, and yellow-tusked, he looked exactly as the Jungle knew him: their master."
    - id: ch04
      title: "How Fear Entered the Jungle"
      blocks:
        - id: ch04-b01
          speaker: hathi
          text: "Children, you know that Man is what you fear most. But do you know why you fear him? Listen, and I will tell you. In the beginning, so long ago that no one knows the time, all the Jungle walked together. No creature feared another. There was no drought in those days. Leaves, flowers, and fruit grew together on the same tree, and no one ate anything except grass, bark, leaves, flowers, and fruit."
        - id: ch04-b02
          speaker: narrator
          text: "A low murmur of agreement had passed along the banks when Hathi spoke of their fear of Man. Bagheera leaned toward Mowgli."
        - id: ch04-b03
          speaker: bagheera
          text: "This tale concerns you, Little Brother."
        - id: ch04-b04
          speaker: mowgli
          text: "Me? I belong to the Pack. I hunt with the Free People. What do I have to do with Man?"
        - id: ch04-b05
          speaker: bagheera
          text: "I'm glad I missed those early days. Bark is useful only when I need to sharpen my claws."
        - id: ch04-b06
          speaker: hathi
          text: "Tha, the First of the Elephants, was Lord of the Jungle then. He lifted the Jungle from deep water with his trunk. When he dragged his tusks through the ground, water followed the furrows and made the rivers. Where his great foot struck the earth, pools of good water rose. When he blew through his trunk like this, whole trees fell before him. That is how Tha made the Jungle, or so the tale came down to me."
        - id: ch04-b07
          speaker: bagheera
          text: "The tale certainly hasn't grown thin in the telling."
        - id: ch04-b08
          speaker: narrator
          text: "Mowgli hid a laugh behind his hand, and Hathi went on."
        - id: ch04-b09
          speaker: hathi
          text: "There was no corn then, no melon, pepper, or sugar cane. There were none of the little huts that all of you have seen. The Jungle People knew nothing of Man. We lived together as one people. Before long, though there was grazing enough for everybody, quarrels began over food. Everyone was lazy and wanted to eat without moving from the spot where he lay. You can still do that sometimes, when the spring Rains have been good."
        - id: ch04-b10
          speaker: hathi
          text: "Tha was busy shaping new jungles and guiding the rivers into their beds. He could not travel to every place, so he made the First of the Tigers master and judge. The Jungle People were to bring all their disputes before him. In those days that Tiger ate grass and fruit with everyone else. He was as large as I am, and very beautiful. His whole body was the yellow of the yellow creeper's flower. Not one stripe or bar crossed his hide while the Jungle was new. Every creature came before him without fear, and his word was the Law for us all. Remember, we were still one people."
        - id: ch04-b11
          speaker: hathi
          text: "One night two bucks came before him with a quarrel over grazing, the kind of quarrel bucks now settle with horns and forefeet. The First of the Tigers lay among the flowers while they argued. Then one buck shoved him with his horns. In that instant the Tiger forgot that he was the Jungle's master and judge. He leaped on the buck and broke his neck."
        - id: ch04-b12
          speaker: hathi
          text: "Until that night, not one of us had ever died. The First of the Tigers looked at what he had done, and the smell of blood clouded his mind. He fled far away into the northern marshes. The Jungle was left without its judge, and fights broke out everywhere. Tha heard the uproar and came back. Some creatures told him one thing and some another, but he saw the dead buck among the flowers. Tha asked who had killed him. No one would tell. The blood scent had made all of them foolish. They ran in circles, leaping, crying out, and shaking their heads."
        - id: ch04-b13
          speaker: hathi
          text: "Tha spoke to the trees with low-hanging branches and to the creepers that trailed across the Jungle paths. He ordered them to mark the buck's killer, so Tha would recognize him when he returned. Then he turned to the Jungle People and asked who would be their master now."
        - id: ch04-b14
          speaker: gray_ape
          text: "I will be master of the Jungle now!"
        - id: ch04-b15
          speaker: narrator
          text: "Tha laughed at the Gray Ape's answer."
        - id: ch04-b16
          speaker: tha
          text: "So be it."
        - id: ch04-b17
          speaker: narrator
          text: "Tha went away in anger."
        - id: ch04-b18
          speaker: hathi
          text: "Children, you know the Gray Ape. He was no different in those days. At first he tried to look very wise. That did not last. Soon he scratched himself and jumped up and down. When Tha returned, he found the Gray Ape hanging head downward from a branch. The Ape mocked everyone standing below, and they mocked him back. So the Jungle was left without any Law. There was nothing but foolish talk and words without sense."
        - id: ch04-b19
          speaker: narrator
          text: "Tha called all the Jungle People together."
        - id: ch04-b20
          speaker: tha
          text: "The first master you chose brought Death into the Jungle. The second master brought Shame. Now the time has come for a Law, one that none of you may break. You will come to know Fear. When you have found him, you will understand that Fear is your master. After that, everything else will follow."
        - id: ch04-b21
          speakers: [deer_1, deer_2, deer_3]
          ensemble: chorus
          text: "What is Fear?"
        - id: ch04-b22
          speaker: tha
          text: "Search until you find him."
        - id: ch04-b23
          speaker: hathi
          text: "We wandered up and down through the Jungle, searching everywhere for Fear. At last the buffaloes came back with news of what they had found."
        - id: ch04-b24
          speaker: mysa
          text: "Ugh!"
        - id: ch04-b25
          speaker: hathi
          text: "Yes, Mysa. It was the buffaloes. They said Fear was sitting inside a Jungle cave. He had no hair, and he walked on his hind legs. All the Jungle People followed the buffalo herd until we reached the cave. Fear stood at its mouth, hairless and upright, just as the buffaloes had said. The moment he saw us, he cried out. His voice filled us with the same dread we feel whenever we hear it now. We turned and fled together, trampling and tearing one another because we were so afraid."
        - id: ch04-b26
          speaker: hathi
          text: "That night, so the tale says, we did not lie down together as we had always done. Each kind drew away by itself. Pig stayed with pig and deer with deer. Horn pressed beside horn, and hoof beside hoof. Like kept only to like, and the separate tribes lay trembling through the Jungle."
        - id: ch04-b27
          speaker: hathi
          text: "Only the First of the Tigers was missing when the tribes lay trembling. He was still hidden among the reeds and dark water of the northern marshes. Word reached him there about the strange creature in the cave, and the Tiger answered with a boast."
        - id: ch04-b28
          speaker: first_tiger
          text: "I'll go to this creature and break his neck."
        - id: ch04-b29
          speaker: hathi
          text: "He ran all night toward the cave. Along every path, the trees and creepers remembered Tha's command. They lowered their branches as the Tiger passed and drew their fingers over his back and sides, his forehead and jaws. Wherever they touched that smooth yellow hide, they left a mark and a stripe. Those very stripes are still worn by his children today."
        - id: ch04-b30
          speaker: narrator
          text: "At the cave, the Hairless One reached out a hand toward him."
        - id: ch04-b31
          speaker: first_man
          text: "The Striped One comes by night!"
          emotion: fearful
        - id: ch04-b32
          speaker: hathi
          text: "For the first time, the First of the Tigers was afraid of the Hairless One. He turned from the cave and fled all the way back to the marshes, howling as he ran."
        - id: ch04-b33
          speaker: narrator
          text: "Mowgli rested his chin in the water and chuckled softly."
    - id: ch05
      title: "The Tiger's Night"
      blocks:
        - id: ch05-b01
          speaker: hathi
          text: "The Tiger's howling rang so loudly through the Jungle that Tha heard him and came to ask what sorrow had befallen him. The First of the Tigers lifted his muzzle toward the sky. That sky had only just been made, though now it is older than any living creature."
        - id: ch05-b02
          speaker: first_tiger
          text: "Give me back the power I once had, Tha. I have been shamed before the whole Jungle. I ran away from a Hairless One, and he called me by a name that carries my shame wherever I go."
        - id: ch05-b03
          speaker: tha
          text: "Why did he call you that?"
        - id: ch05-b04
          speaker: first_tiger
          text: "Because the mud of the marshes is smeared over me."
        - id: ch05-b05
          speaker: tha
          text: "Then swim and roll in wet grass. If it is mud, it will wash away."
        - id: ch05-b06
          speaker: hathi
          text: "The Tiger plunged into the water and swam. Then he rolled over and over on the wet grass until the whole Jungle seemed to circle before his eyes. But when he stopped, not one small bar anywhere on his hide had faded. Tha had watched it all, and Tha laughed."
        - id: ch05-b07
          speaker: first_tiger
          text: "What have I done to deserve this?"
        - id: ch05-b08
          speaker: tha
          text: "You killed the buck. By doing that, you set Death loose in the Jungle for the first time. Fear entered beside Death. That is why the Jungle People now fear one another, just as you have learned to fear the Hairless One."
        - id: ch05-b09
          speaker: first_tiger
          text: "They will never fear me. I've known them since the beginning."
        - id: ch05-b10
          speaker: tha
          text: "Go and see."
        - id: ch05-b11
          speaker: hathi
          text: "The First of the Tigers ran back and forth through the Jungle, calling loudly to the deer and pigs, the sambhur and porcupines, and every other Jungle People he had known since the beginning. But all of them ran from the creature who had once been their judge. They were afraid of him now."
        - id: ch05-b12
          speaker: hathi
          text: "He returned to Tha with all his pride broken inside him. He beat his head against the earth and ripped up the ground beneath him with all four feet."
        - id: ch05-b13
          speaker: first_tiger
          text: "Remember that I was once Master of the Jungle. Do not forget what I was, Tha. Let my children remember too. Let them know that their father once stood before the whole Jungle without shame and without fear."
          emotion: sad
        - id: ch05-b14
          speaker: tha
          text: "I will do this much for you, because you and I together watched the Jungle being made. For one night in every year, it will be as it was before the buck died. That gift will belong to you and to all your children. If you meet the Hairless One on that Night, remember that his name is Man. You will feel no fear of him. Instead, he will fear you, as though you were once again the Jungle's judge and the master of every living thing. But when Man lies afraid before you, show him mercy. You have known Fear yourself, and you know what it does."
        - id: ch05-b15
          speaker: first_tiger
          text: "That is enough for me."
        - id: ch05-b16
          speaker: hathi
          text: "But the next time the Tiger bent to drink, the water showed him the black stripes along his flanks and sides. He remembered the name the Hairless One had called him, and the memory made him angry. For a whole year he lived in the marshes, waiting for Tha to keep his promise. Then one evening the Jackal of the Moon, which is the Evening Star, stood bright and clear above the Jungle. The First Tiger felt the change at once. His Night had come, and he set out for the Hairless One's cave."
        - id: ch05-b17
          speaker: hathi
          text: "Tha's promise held true. When the Hairless One saw the Tiger, he fell before him and lay stretched along the ground. The First of the Tigers struck and broke the creature's back. He believed there was only one such being anywhere in the Jungle, so he thought he had killed Fear itself. Then, while he nosed over the body, a sound came down from the northern woods. Tha was approaching. The First Tiger heard the voice of the First of the Elephants, the same great voice we hear in the hills tonight."
        - id: ch05-b18
          speaker: narrator
          text: "Thunder rolled over the dry, scarred hills. It brought no rain, only heat and lightning along the ridges. Hathi continued."
        - id: ch05-b19
          speaker: tha
          text: "Is this the mercy you promised?"
        - id: ch05-b20
          speaker: first_tiger
          text: "Why does that matter? I have killed Fear."
        - id: ch05-b21
          speaker: tha
          text: "You are blind and foolish! You have untied the feet of Death. From now until the day you die, Death will be free to follow your trail. Worst of all, you have taught Man how to kill."
          emotion: angry
        - id: ch05-b22
          speaker: first_tiger
          text: "He is no different from the buck I killed among the flowers. He is dead beneath my feet, so there is no Fear left in the Jungle. I will take my old place now. Once again, I will judge all the Jungle People."
        - id: ch05-b23
          speaker: tha
          text: "Never again will the Jungle People come to you. They will not cross your trail, sleep beside you, follow you, or graze near your lair. Only Fear will follow. He will strike you with a blow you cannot see and make you wait until he chooses to come. He will open the ground under your feet. He will twist a creeper around your neck. He will make tree trunks close around you, higher than you can leap. At last he will strip off your hide and wrap it around his cubs when they are cold. You showed Man no mercy, and he will show you none."
        - id: ch05-b24
          speaker: hathi
          text: "The First of the Tigers was still bold because his Night had not ended."
        - id: ch05-b25
          speaker: first_tiger
          text: "Tha's promise is Tha's promise. You won't take away my Night, will you?"
        - id: ch05-b26
          speaker: tha
          text: "The one Night still belongs to you, exactly as I promised. I will not take it away. But there is a price for what you have done. You taught Man the lesson of killing, and Man is not a slow learner."
        - id: ch05-b27
          speaker: first_tiger
          text: "He lies under my paw with a broken back. Let the Jungle hear that I have killed Fear."
        - id: ch05-b28
          speaker: tha
          text: "You have killed only one Hairless One out of many. The rest are still alive. And you yourself will carry the news of what you have done through the Jungle, because your Night of power has ended."
        - id: ch05-b29
          speaker: hathi
          text: "Night ended and daylight came. Another Hairless One walked out of the cave. He saw the dead man lying in the path, and above the body he saw the First of the Tigers. The man reached for a pointed stick."
        - id: ch05-b30
          speaker: ikki
          text: "Nowadays they throw a sharp thing that cuts."
        - id: ch05-b31
          speaker: narrator
          text: "Ikki came rustling down the riverbank as he spoke. The Gonds thought porcupine was unusually good eating, and they called Ikki Ho-Igoo. He had learned all about the wicked little Gond axe that can whirl across an open clearing like a dragonfly."
        - id: ch05-b32
          speaker: hathi
          text: "In those days it was a pointed stick, like the sharp stakes men plant at the bottom of a pit trap. The Hairless One hurled it across the space between them, and its point sank deep into the Tiger's side. Everything happened exactly as Tha had warned. The First Tiger ran howling up and down through the Jungle. He could not escape the pain until at last he tore the stick free. All the Jungle saw that the Hairless One did not need claws or fangs to reach them. He could wound them from far away, and after that they feared him even more."
        - id: ch05-b33
          speaker: hathi
          text: "So the First of the Tigers taught Man to kill. You know the harm that lesson has brought all our peoples ever since. Man learned the noose and the pitfall, the trap hidden from our eyes, the stick that flies through the air, the stinging fly that comes out of white smoke, and the Red Flower that drives us from cover into the open. Yet one night each year, as Tha promised, the Hairless One fears the Tiger. Tigers have never given him any reason to fear them less. Wherever a Tiger finds Man on that Night, he kills him, remembering how the First Tiger was shamed. During all the other nights and days, Fear walks up and down the Jungle."
        - id: ch05-b34
          speakers: [deer_1, deer_2, deer_3]
          ensemble: chorus
          text: "Ahi! Aoo!"
          emotion: fearful
        - id: ch05-b35
          speaker: hathi
          text: "Only when one great Fear hangs over every creature, as this drought hangs over us now, can the Jungle put aside all its smaller fears. Only then can we meet together in one place, just as we have gathered here tonight."
        - id: ch05-b36
          speaker: mowgli
          text: "Does Man fear the Tiger for only one night?"
        - id: ch05-b37
          speaker: hathi
          text: "Only one night."
        - id: ch05-b38
          speaker: mowgli
          text: "But everyone in the Jungle knows Shere Khan kills a man two or three times in a month."
        - id: ch05-b39
          speaker: hathi
          text: "That is true. On ordinary nights he leaps from behind and turns his head aside as he strikes, because fear is inside him. If Man turned and looked straight at him, the Tiger would run. But on his one Night, he goes openly down to the village. He walks between the houses and pushes his head through a doorway. The men fall upon their faces before him, and there he makes his kill. Only one kill in that Night."
        - id: ch05-b40
          speaker: narrator
          text: "Mowgli rolled over in the water as understanding came to him."
        - id: ch05-b41
          speaker: mowgli
          text: "Now I understand why Shere Khan ordered me to look at him! He expected me to fall down before him, the way men do on the Tiger's Night. It did him no good at all. He couldn't even keep his own eyes steady, and I certainly didn't fall at his feet. Of course, I'm not a man. I belong to the Free People."
        - id: ch05-b42
          speaker: bagheera
          text: "Does the Tiger know when his Night has come?"
        - id: ch05-b43
          speaker: hathi
          text: "The Tiger never knows until the Jackal of the Moon shines clear of the evening mist. That one Night may come in the dry heat of summer, or it may come during the wet Rains. Without the First of the Tigers, none of this would ever have happened. Not one of us in the Jungle would have learned Fear."
        - id: ch05-b44
          speaker: narrator
          text: "The deer grunted sadly. A dangerous little smile curled Bagheera's lips."
        - id: ch05-b45
          speaker: bagheera
          text: "Do men know this tale?"
        - id: ch05-b46
          speaker: hathi
          text: "No man knows this tale. Only the tigers know it, and we elephants, who are the children of Tha. Now every one of you gathered beside these pools has heard it too. I have said all that I will say."
        - id: ch05-b47
          speaker: narrator
          text: "Hathi dipped his trunk into the water as a sign to everyone along the banks. The old elephant would say no more."
        - id: ch05-b48
          speaker: mowgli
          text: "But there is still something I don't understand. Why didn't the First of the Tigers go on eating grass, leaves, and fruit from the trees? He broke the buck's neck, yes, but he did not eat the body. What happened afterward that made him turn from plants and begin eating hot meat?"
        - id: ch05-b49
          speaker: baloo
          text: "The trees and creepers obeyed Tha and marked him, Little Brother. They turned him into the striped creature we know today. After that, he would never again eat the fruit of the plants that had betrayed him. From that day onward, he took his revenge on the deer and all the other Eaters of Grass. That was what first led him to hot meat."
        - id: ch05-b50
          speaker: mowgli
          text: "Then you knew the tale all along! Why didn't you ever tell me?"
        - id: ch05-b51
          speaker: baloo
          text: "Because the Jungle is full of tales like this. If I began telling them, I would never come to the end. Now let go of my ear, Little Brother."
