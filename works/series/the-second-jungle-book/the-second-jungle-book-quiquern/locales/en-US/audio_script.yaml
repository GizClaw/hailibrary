  chapters:
    - id: ch01
      title: Kotuko and His Dog
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: "The People of the Eastern Ice were melting away like snow. They begged for coffee and sugar, and they followed wherever the white men went. The People of the Western Ice learned how to steal and fight. They sold their furs at the trading post, and they sold their souls to the white men. The People of the Southern Ice traded with the crews of whaling ships. Their women wore plenty of colored ribbons, though the people's tents were torn and few. But beyond the white man's knowledge lived the People of the Elder Ice. Their spears were still made from the long horn of the narwhal. They kept to the old ways, and they were the last of the Men."
        - id: ch01-b02
          speaker: amoraq
          text: "His eyes are open. Look!"
          emotion: surprised
        - id: ch01-b03
          speaker: kadlu
          text: "Put him back in the skin. He'll grow into a strong dog. We'll name him in his fourth month."
        - id: ch01-b04
          speaker: amoraq
          text: "Who shall we name him for?"
        - id: ch01-b05
          speaker: narrator
          text: "Kadlu looked around the skin-lined snow house. His eye came to rest on fourteen-year-old Kotuko, who sat on the sleeping bench carving a button from walrus ivory."
        - id: ch01-b06
          speaker: kotuko
          text: "Give him my name. I'll need him one day."
        - id: ch01-b07
          speaker: narrator
          text: "Kadlu grinned until his flat cheeks nearly swallowed his eyes, then nodded to Amoraq. The puppy's fierce mother whined below her baby, who wriggled beyond her reach in a little sealskin pouch hung over the warmth of the blubber lamp. Kotuko returned to carving his ivory button. Kadlu tossed a rolled bundle of leather dog harnesses into a tiny side room. He stripped off his heavy deerskin hunting suit, placed it in a whalebone net above another lamp, and dropped onto the sleeping bench. There he shaved pieces from a frozen joint of seal while he waited for Amoraq, his wife, to bring their usual dinner of boiled meat and blood soup. He had left at early dawn for seal holes eight miles away and returned with three large animals. Halfway down the long, low snow tunnel leading to the inner door, the freed sleigh dogs snapped and yelped as they fought over the warmest places."
        - id: ch01-b08
          speaker: narrator
          text: "When the noise became too much, Kotuko rolled from the bench and took up the long whip. Its springy whalebone handle was only eighteen inches, but its heavy braided lash stretched twenty-five feet. He plunged into the passage amid sounds that suggested the dogs were eating him alive. It was only their usual grace before dinner. Six furry heads watched him crawl outside to the whale-jaw frame where their meat hung. He split the frozen meat into chunks with a broad-headed spear and stood beneath the blazing Northern Lights, meat in one hand and whip in the other. He called each dog by name, starting with the weakest. Any animal that moved before its turn lost hair and hide to the darting lash. Each dog growled, snapped up its share, choked once, then hurried back into the tunnel. The great black team leader ate last. Kotuko gave him twice the meat and one extra crack of the whip."
        - id: ch01-b09
          speaker: kotuko
          text: "Ah, there's a little fellow above the lamp who'll make plenty of noise. Sarpok! Get inside!"
        - id: ch01-b10
          speaker: narrator
          text: "Kotuko crawled back across the crowded dogs. At the door he beat the dry snow from his furs, then tapped the skin roof so any icicles fallen from the snow dome would shake loose. He curled on the bench. The dogs snored and whimpered in the tunnel. The baby boy in Amoraq's deep fur hood kicked, choked, and gurgled. Beside Kotuko, the puppy's mother stared at the safe warm bundle above the wide yellow lamp flame."
        - id: ch01-b11
          speaker: narrator
          text: "This was far in the north, beyond Labrador and Hudson Strait, where great tides heave the ice. It was beyond Melville Peninsula and even Fury and Hecla Straits, on the north shore of Baffin Land. There Bylot Island rises over the ice of Lancaster Sound like an upside-down pudding bowl. We know little of the country north of that sound except North Devon and Ellesmere Land. Yet scattered people live even there, almost next door to the Pole."
        - id: ch01-b12
          speaker: narrator
          text: "Kadlu was an Inuit, one of the people once called Eskimo. His tribe numbered only about thirty and belonged to the Tununirmiut, whose name means the country lying behind something. Maps call their lonely coast Navy Board Inlet. The Inuit name suits it better, for the place lies at the very back of everything in the world. Ice, snow, gale after gale, and unimaginable cold rule it for nine months. Anyone who has never watched a thermometer fall even to zero cannot understand that cold. Six of those nine months are dark, and the darkness is the worst part. During the three-month summer it freezes only every other day and every night. Snow weeps away from the southern slopes. Ground willows show woolly buds, a few tiny stonecrops pretend to bloom, and beaches of fine gravel and rounded stones meet the open sea. Polished boulders and striped rocks rise above the grainy snow. Within a few weeks all of it disappears, and wild winter locks the land again. Offshore, the ice drives, jams, rams, splits, strikes, pounds, and grinds. At last it freezes together in a sheet ten feet thick, from the land all the way to deep water."
        - id: ch01-b13
          speaker: narrator
          text: "In winter Kadlu followed seals to the edge of the land ice and speared them when they rose at breathing holes. A seal needs open water where it can live and catch fish. Yet in deep winter, unbroken ice might reach eighty miles from the nearest shore. In spring the people withdrew from the floes and pitched skin tents on the rocky mainland. They snared seabirds and speared young seals lying in the sun on the beaches. Later they traveled south into Baffin Land to hunt reindeer and collect a whole year's salmon from the hundreds of inland streams and lakes. By September or October they returned north for musk ox and the usual winter sealing. Dog sleighs covered twenty or thirty miles a day. Sometimes great skin boats carried them along the coast. Dogs and babies lay among the rowers' feet, and the women sang as the boats glided from cape to cape over glassy, freezing water."
        - id: ch01-b14
          speaker: narrator
          text: "Every luxury the Tununirmiut knew came from the south. Driftwood became runners for their sleighs. Rod iron supplied harpoon points. They valued steel knives, flint and steel, and even matches. Tin kettles cooked far better than the old vessels made of soapstone. Women wore colored ribbons in their hair, admired themselves in small cheap mirrors, and edged deerskin jackets with red cloth. Kadlu traded rich creamy narwhal tusks, beautifully twisted, and musk-ox teeth as valuable as pearls. Southern Inuit received those goods and passed them onward in exchange with whalers and the mission posts at Exeter and Cumberland Sounds. The chain of trade reached halfway around the world. A kettle first picked up by a ship's cook in the Bhendy Bazaar could end its working life above a blubber lamp somewhere on the cold side of the Arctic Circle."
        - id: ch01-b15
          speaker: narrator
          text: "Kadlu's skill as a hunter made him rich in iron harpoons, snow knives, bird darts, and all the other things that make life easier in the great cold. He was the head of the tribe, or, as his people put it, the man who knew all about things through practice. This office gave him no real authority. Now and then he could advise his friends to move to different hunting grounds, but he did not command them. Kotuko made rather more of his father's position. In the lazy, well-fed Inuit fashion, he bossed the other boys a little when they came outside at night. They played ball in the moonlight or sang the Child's Song to the Aurora Borealis."
        - id: ch01-b16
          speaker: narrator
          text: "At fourteen, an Inuit boy already feels like a man. Kotuko had had enough of making snares for wild birds and little Arctic foxes. Most of all, he was tired of sitting through the long day helping the women chew seal and deer hides, though nothing else made leather so soft. The men were outside hunting, and that was where he wanted to be. He longed to enter the Singing House when the hunters gathered for their secret ceremonies. There the angekok frightened everyone into the most delightful fits after the lamps went out. They heard the Reindeer Spirit stamping across the roof. A spear thrust through the wall into the black night came back covered with hot blood. Kotuko wanted to throw his great boots into the drying net with the weary air of a man who supported a family. He wanted to gamble when hunters visited in the evening and played their homemade game with a tin pot and a nail. He wanted hundreds of things that belonged to grown men, but they only laughed at his impatience."
        - id: ch01-b17
          speakers: [kadlu, villager_1, villager_2]
          ensemble: chorus
          text: "Wait until you've sat in the buckle, Kotuko. Hunting isn't all catching."
        - id: ch01-b18
          speaker: narrator
          text: "The puppy made the future look brighter. No Inuit gives a good dog to a son until the boy understands driving, and Kotuko felt certain he knew more than everything. He fed and handled the puppy so much that any weaker animal would have died. He made a tiny harness, tied on a trace, and hauled him around the floor while shouting the words for right, left, and stop. The puppy disliked being fished around the house in this fashion. Still, it was pure happiness beside his first day before a sleigh. He sat stubbornly in the snow and played with the sealskin trace that joined his harness to the great thong at the sleigh's bow. Then the team sprang away. The heavy ten-foot sleigh ran onto his back and dragged him through the snow while Kotuko laughed until tears ran down his face."
        - id: ch01-b19
          speaker: narrator
          text: "Then came day after day of the cruel whip hissing like wind over ice. The older dogs bit him for not knowing his work. His harness rubbed him raw, and he lost his place beside Kotuko to sleep in the coldest part of the passage. The puppy suffered, and Kotuko learned just as quickly. A dog sleigh can break a driver's heart. Each animal runs on its own trace, with the weakest nearest the driver. A loop and button attach each trace to the main thong, so one twist of the wrist can free a dog. That matters when a young dog tangles the line behind its legs and the leather cuts to the bone. Every dog also tries to visit friends while running, hopping through the traces until a fight knots everything worse than a fishing line."
        - id: ch01-b20
          speaker: narrator
          text: "A skilled whip prevents much of that trouble. Every Inuit boy takes pride in mastering the long lash. Hitting a mark on still ground is easy. Leaning forward to strike a lazy dog just behind the shoulders from a racing sleigh is not. Hit the wrong animal after calling another one's name, and those two settle the mistake by fighting while the whole team stops. Talk to a companion or sing while traveling alone, and every dog may halt, turn around, and sit down to hear the rest. Kotuko forgot to block his stopped sleigh more than once and watched it run away. He snapped many lashings and ruined several thongs before anyone trusted him with eight dogs and a light sleigh. Once they did, he felt like a person of consequence. On smooth black ice, with a bold heart and a quick elbow, he flew over the level ground as fast as a hunting pack in full cry."
        - id: ch01-b21
          speaker: narrator
          text: "He traveled ten miles to the seal holes. On the hunting ground, he loosened one trace and freed the clever black leader. As soon as that dog scented a breathing place, Kotuko reversed the sleigh. Two sawed-off antlers stuck up from its back like handles. He drove them deep into the snow so the waiting team could not escape. Then he crawled forward inch by inch and waited for the seal to breathe. At the right instant, he drove down his spear and running line. Soon he hauled the body to the lip of the ice while the black dog came near and helped pull it across to the sleigh. The harnessed animals screamed and foamed with excitement. Kotuko laid the long lash across all their faces like a red-hot bar until the seal froze stiff. The return was the heavy part. He had to coax the loaded sleigh among rough ice while hungry dogs sat down and stared at the meat instead of pulling. At last they reached the worn road to the village and trotted over ringing ice, heads low and tails high. Kotuko sang the Returning Hunter's Song beneath the dim, star-filled sky, and voices hailed him from house to house."
        - id: ch01-b22
          speaker: narrator
          text: "Kotuko the dog grew into his happiness too. Fight by fight, he climbed steadily through the team. One fine evening, while the dogs ate and the boy made sure the contest stayed fair, he challenged the great black leader and reduced him to second place. The yellow dog was promoted to the long leading thong and ran five feet in advance of every other animal. It became his duty to stop all fighting, whether the team was harnessed or free. He wore a very thick and heavy collar braided from copper wire. On special days he ate cooked food inside the house, and sometimes Kotuko allowed him to sleep on the bench. He became an excellent seal dog. He could hold a musk ox at bay by circling and snapping at its heels. He would even stand against a lean Arctic wolf. For a sleigh dog that was the final proof of courage, because northern dogs usually fear wolves beyond anything else that walks over snow."
        - id: ch01-b23
          speaker: narrator
          text: "Boy and yellow dog hunted together by day and night. They did not count the ordinary team as company. One was wrapped in fur. The other was a savage yellow creature, shaggy, narrow-eyed, and white-fanged. An Inuit family has only one great task: find food and skins. Women turn the skins into clothing and sometimes help trap small animals. But the people eat enormous amounts, and the men must bring home most of it. If that supply fails, there is no neighbor close enough to sell, lend, or give them food. There is no storehouse to visit and no warmer land within reach. The people must die."
        - id: ch01-b24
          speaker: narrator
          text: "No one thought about that while there was no need. Kadlu, Amoraq, Kotuko, and the baby who kicked in his mother's hood and chewed blubber all day were as happy as any family. Their gentle people rarely lost their tempers and almost never struck a child. They hardly understood a true lie and understood stealing even less. They speared their living from the bitter cold, smiled oily smiles, shared ghost and fairy stories, ate until they could hold no more, and sang the endless women's song through the long lamplit days of mending clothes and hunting gear."
    - id: ch02
      title: The Winter of Hunger
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: "Then one terrible winter, everything failed them. After the yearly salmon fishing, the Tununirmiut built their houses on early ice north of Bylot Island and waited for the sea to freeze for sealing. Autumn came early and savage. Through September, endless gales smashed the smooth ice while it was only four or five feet thick. The wind drove it inland and heaped a barrier twenty miles wide from lumpy, ragged, needle-shaped blocks. No dog sleigh could cross it. The floe edge where the people usually hunted lay perhaps twenty miles beyond that barrier, completely out of reach. Their frozen salmon, stored blubber, and whatever the traps supplied might still have carried them through. But in December a hunter found a skin tent holding three women and a girl near death. Their men had come from the far north and been crushed in little skin hunting boats while pursuing long-horned narwhal. Kadlu had only one possible choice. No Inuit dares refuse food to strangers, because no hunter knows when his own turn to beg may come. He divided the women among the huts of the winter village."
        - id: ch02-b02
          speaker: narrator
          text: "Amoraq took the girl, who was about Kotuko's age, into her house as a helper. Her pointed hood and the long diamond pattern on her white deerskin leggings suggested Ellesmere Land. She had never seen a tin pot or a sleigh with wooden runners. Both Kotukos, boy and dog, grew fond of her. Then the foxes moved south. Even the blunt-headed, thieving wolverine ignored Kotuko's empty traps. A musk-ox fight crippled two of the tribe's best hunters, leaving still more work for the rest."
        - id: ch02-b03
          speaker: narrator
          text: "Day after day, Kotuko took a light hunting sleigh and six or seven of the strongest dogs over the broken ice. He searched until his eyes ached for one clear patch where a seal might have scratched a breathing hole. The yellow dog ranged far and wide. In the dead stillness, the boy could hear his half-choked whine of excitement above a hole three miles away as plainly as if the animal stood beside him. When the dog found a place, Kotuko built a low snow wall to block the worst of the bitter wind. He made one tiny mark over the hole to guide his downward thrust. A little sealskin mat went under his feet, and he tied his legs together in the buckle the old hunters had mentioned. The buckle stopped a waiting man's muscles from twitching and warning the quick-eared seal. Kotuko might sit there ten, twelve, or twenty hours with the air forty degrees below zero and his eyes fixed on that single mark. There was no excitement in it, but waiting motionless in the buckle was the hardest work his people knew. If he caught a seal, the yellow dog bounded in with his loose trace streaming behind him and helped drag the body toward the sleigh. The tired, starving team lay sullenly in the shelter of the broken ice."
        - id: ch02-b04
          speaker: narrator
          text: "One seal could not feed the village long. Every mouth had a right to be filled, and nobody wasted bone, hide, or sinew. Food that should have gone to dogs went to people. Amoraq dug old summer tent skins from beneath the sleeping bench, cut them up, and fed those scraps to the team. The dogs howled with hunger, slept, and woke to howl again. The boat-shaped soapstone lamps showed how near famine had come. With plenty of blubber, their cheerful oily yellow flames rose two feet. Now each flame barely reached six inches. Whenever an unwatched wick brightened for a moment, Amoraq carefully pressed down the moss, and every eye in the family followed her hand. In the great cold, famine is horrible not only because people die, but because they die in darkness. All Inuit fear the night that presses upon them without a break for six months of every year. When the lamps sink low inside the houses, people's thoughts begin to shake and wander."
        - id: ch02-b05
          speaker: narrator
          text: "Worse followed. The underfed dogs snapped and growled in the entrance passages. Night after night they glared at the cold stars and tested the bitter wind with their noses. When their howls stopped, silence fell as solid and heavy as drifted snow against a door. Men could hear blood beating through the narrow channels of their ears. Their own hearts thudded as loudly as sorcerers' drums sounding across the snow. One night the yellow dog, who had been unusually sullen in harness, sprang up and pressed his head against Kotuko's knee. The boy stroked him, but the dog pushed blindly forward and begged for attention. Kadlu woke, gripped the heavy wolf-like head between his hands, and stared into glassy eyes. The dog whimpered and trembled between Kadlu's knees. The hair rose around his neck. He growled as if a stranger waited at the doorway. Then without warning he barked joyfully, rolled on the floor, and bit at Kotuko's boot like a puppy."
        - id: ch02-b06
          speaker: kotuko
          text: "What's wrong with him?"
          emotion: fearful
        - id: ch02-b07
          speaker: kadlu
          text: "It's the sickness. The dog sickness."
        - id: ch02-b08
          speaker: narrator
          text: "The yellow dog lifted his muzzle and howled again and again."
        - id: ch02-b09
          speaker: kotuko
          text: "I've never seen it. What will happen to him?"
          emotion: fearful
        - id: ch02-b10
          speaker: narrator
          text: "Kadlu raised one shoulder and crossed the hut for his short stabbing harpoon. The great dog watched him, howled once more, and slipped down the passage. Every other animal moved to the right or left and left him plenty of room. Once outside on the snow, he barked furiously as if he had found the trail of a musk ox. Barking, leaping, and frisking, he disappeared. He did not have hydrophobia. It was plain madness. Cold, hunger, and most of all the endless dark had overturned his mind. Once that dog sickness appears in a team, it races through like wildfire. On the next hunting day, another animal became sick and bit and struggled among the traces. Kotuko killed him on the spot. Then the old black leader suddenly called out on an imaginary reindeer trail. They slipped his fastening from the main thong. He flew at the throat of an ice cliff, then ran away as the yellow leader had done, still wearing his harness."
        - id: ch02-b11
          speaker: narrator
          text: "After that, no one dared take the dogs hunting. The village needed them for something else, and the animals seemed to know what that meant. Though tied down and fed by hand, their eyes held fear and despair. Old women made matters worse by telling ghost tales. They said they had met the spirits of hunters lost that autumn, and those dead men had foretold every kind of horror. Kotuko mourned his yellow dog more than anything. An Inuit may eat enormously, but he also knows how to starve. Even so, hunger, darkness, cold, and long exposure weakened the boy. Voices sounded inside his head. People who were not there flickered at the outer edge of his sight and vanished when he turned."
        - id: ch02-b12
          speaker: narrator
          text: "One night, after ten hours over a seal hole that proved empty, he unfastened the buckle and staggered toward home, faint and dizzy. He stopped to rest his back against a boulder. The stone happened to balance like a rocker on one projecting point of ice. Kotuko's weight disturbed it. The great rock rolled ponderously over, and when he jumped aside, it slid after him down the icy slope with a squeak and hiss. That was enough for Kotuko. From childhood, he had believed every rock and boulder had an owner, its inua. Usually this owner was a one-eyed womanlike creature called a tornaq. When such a spirit meant to help a man, she rolled after him inside her stone house and asked to become his guardian. During summer thaws, rocks supported by ice really did roll and slide all over the land, so the belief in living stones came easily. Blood had beaten in Kotuko's ears all day. Now he heard that pounding as the tornaq speaking. Before he reached home, he felt certain they had held a long conversation. All his people believed this could happen, so no one contradicted him."
        - id: ch02-b13
          speaker: kotuko
          text: "She told me, 'I jump down from my place on the snow.' She said she'd guide me. She'll lead me to good seal holes. Tomorrow I'll go out, and my tornaq will show the way."
        - id: ch02-b14
          speaker: narrator
          text: "He leaned into the dim light, his eyes hollow. The village angekok came in, and Kotuko repeated his story with even greater force."
        - id: ch02-b15
          speaker: angekok
          text: "Follow the spirits of the stones. They will bring food back to us."
        - id: ch02-b16
          speaker: narrator
          text: "For days the northern girl had lain near the lamp, eating little and speaking less. The next morning, Kadlu and Amoraq packed a hand sleigh with Kotuko's hunting gear and all the blubber and frozen seal meat they could spare. The girl seized the pulling rope and stepped boldly beside him."
        - id: ch02-b17
          speaker: northern_girl
          text: "Your home is my home."
        - id: ch02-b18
          speaker: kotuko
          text: "And mine is yours. But I think we'll both meet Sedna together."
        - id: ch02-b19
          speaker: narrator
          text: "Sedna was Mistress of the Underworld. The Inuit believed the dead spent a year in her dreadful country before passing to the Happy Place, where it never froze and fat reindeer came when called. The small bone-shod sleigh squeaked and struck the ice behind the two young travelers."
        - id: ch02-b20
          speakers: [villager_1, villager_2, villager_3]
          ensemble: chorus
          text: "The stone spirits spoke to Kotuko! They'll show him open water. He'll bring us seals again!"
        - id: ch02-b21
          speaker: narrator
          text: "The cold empty darkness swallowed the villagers' voices. Kotuko and the girl pressed shoulder to shoulder as they pulled, easing the sleigh across the broken ice toward the Polar Sea. He insisted the stone spirit had ordered him north, so north they went beneath the Reindeer, the stars others call the Great Bear."
    - id: ch03
      title: Across the Frozen Waste
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: "No European could have covered five miles a day through that wreckage of ice and knife-edged snow. Kotuko and the girl knew exactly how to travel there. A turn of the wrist coaxed a runner around a hummock. One sharp pull almost lifted the sleigh from an ice crack. A few quiet blows with a spearhead opened a road where the way looked hopeless. The girl said nothing. She lowered her head and leaned into the pulling rope while the long wolverine fringe of her ermine hood blew across her broad dark face."
        - id: ch03-b02
          speaker: narrator
          text: "Above them, the sky was deep black velvet, changing to bands of rich red along the horizon. The great stars burned there like street lamps. Sometimes a green wave of Northern Light rolled across the hollow of the high sky, flicked like a flag, and vanished. Sometimes a meteor crackled from one darkness to another and trailed a shower of sparks. For an instant, those lights tipped and laced the ridged floe with red, copper, and blue. Ordinary starlight turned everything one frost-bitten gray. Autumn storms had battered and tormented that floe until it resembled a frozen earthquake. Gullies and ravines crossed it. There were hollows like gravel pits, only cut from ice, and scattered pieces frozen firmly to the original floor. Blotches of old black ice had been forced beneath the floe in one storm and heaved up in another. Rounded ice boulders stood beside saw-like edges carved by driven snow. In sunken pits, thirty or forty acres lay below the level of the field. From a distance, those shapes might be seals, walruses, overturned sleighs, hunters, or the great ten-legged white Spirit Bear. Every form seemed just ready to wake, yet there was no sound and not the faintest echo. Through the silence and waste, where sudden lights flapped and died again, the sleigh and its two pullers crawled like figures in a nightmare of the world's end at the end of the world."
        - id: ch03-b03
          speaker: narrator
          text: "When exhausted, Kotuko built what hunters call a half-house, a tiny snow shelter where they crowded with the traveling lamp and tried to thaw frozen seal meat. After they slept, the march began again. They might cover thirty miles while gaining only ten miles north. The girl was always silent. Kotuko muttered to himself and suddenly burst into songs learned in the Singing House. He sang about summer, reindeer, and salmon, all horribly wrong for that season. Then he declared that the tornaq was growling to him. He ran wildly up a hummock, threw his arms in the air, and answered in loud threatening words. In truth, hunger and darkness had nearly driven Kotuko mad for a time. The girl saw it differently. She believed his guardian spirit was leading him and felt certain everything would somehow come right."
        - id: ch03-b04
          speaker: narrator
          text: "At the end of their fourth march, Kotuko's eyes burned like flames. He told her his spirit followed them as a two-headed dog. She looked where he pointed and saw something slide into a ravine. It was not human. Everyone knew the stone spirits liked the shapes of bears, seals, and other creatures. It might have been the ten-legged Spirit Bear or anything at all. Starvation made their eyes untrustworthy. They had trapped nothing and found no game. Less than a week of food remained, and a storm was coming. A polar gale can blow for ten days. Anyone caught outside through it will die."
        - id: ch03-b05
          speaker: narrator
          text: "Kotuko built a snow house large enough to hold the hand sleigh, for a hunter never separates himself from his meat. As he shaped the uneven last block that locked the roof, he saw a Thing watching from a small ice cliff half a mile away. Haze made it seem forty feet long and ten feet high. It appeared to have twenty feet of tail, and its whole outline trembled and changed. The girl saw it too. She did not cry out."
        - id: ch03-b06
          speaker: northern_girl
          text: "That's Quiquern. What comes next?"
        - id: ch03-b07
          speaker: kotuko
          text: "He'll speak to me."
          emotion: fearful
        - id: ch03-b08
          speaker: narrator
          text: "The snow knife trembled in Kotuko's hand. A man may believe he is friendly with strange and ugly spirits, but he rarely enjoys being taken at his word. Quiquern was said to be the ghost of a gigantic hairless, toothless dog. It wandered the far north just before something happened. The coming event might be pleasant or dreadful, but not even sorcerers cared to discuss Quiquern. It made dogs lose their minds. Like the ten-legged Spirit Bear, it had several extra pairs of legs. The shape leaping in the mist had six or eight, certainly more than a real dog needed. Kotuko and the girl hurried into their shelter. If Quiquern wanted them, it could tear the roof apart above their heads. Even so, a foot-thick snow wall between them and the wicked darkness gave great comfort."
        - id: ch03-b09
          speaker: narrator
          text: "The wind struck with the scream of a train. For three days and three nights it held to one direction. It did not weaken even for a minute. They kept the stone lamp between their knees, fed its small flame, nibbled seal meat that was only half warm, and watched black soot gather across the roof. Seventy-two long hours passed that way. The northern girl counted every remaining piece of food in the sleigh. There was no more than a two-day supply. Kotuko looked over the iron heads and the deer-sinew fastenings of his harpoon, his seal lance, and his bird dart. Then he looked them over again. There was nothing else to do."
        - id: ch03-b10
          speaker: northern_girl
          text: "We'll go to Sedna very soon. In three days we'll lie down and leave. Won't your tornaq help? Sing one of the angekok's songs and call her here."
          emotion: fearful
        - id: ch03-b11
          speaker: narrator
          text: "Kotuko began the high howling chant of a magic song. Slowly the gale weakened. Halfway through, the girl started. She put a mitten, then her head, against the frozen floor. Kotuko copied her. Kneeling face to face, they listened with every nerve. He tore a fine strip of whalebone from a bird snare, straightened it, and planted it in a small hole, firming it with his mitten. The rod stood as delicately as a compass needle. They stopped listening and watched. It gave one tiny quiver, vibrated for several seconds, rested, and trembled again toward a different point."
        - id: ch03-b12
          speaker: kotuko
          text: "It's too early. A large floe must have broken far offshore."
        - id: ch03-b13
          speaker: northern_girl
          text: "No. This is the great breaking. Listen to the land ice knocking."
        - id: ch03-b14
          speaker: narrator
          text: "They knelt again. Beneath their feet came faint, muffled grunts and blows. One sounded like a blind puppy squeaking above a lamp. Another was stone grinding on hard ice, then a padded drumbeat. Every noise seemed stretched and shrunk by a tiny horn over a great distance."
        - id: ch03-b15
          speaker: kotuko
          text: "We won't reach Sedna by lying down. The ice is breaking. My tornaq tricked us. We're going to die."
          emotion: fearful
        - id: ch03-b16
          speaker: narrator
          text: "Their danger was real. Three days of gale had pushed the deep water of Baffin Bay south and piled it against the far-reaching land ice stretching west from Bylot Island. At the same time, the strong current flowing east from Lancaster Sound carried mile after mile of rough pack ice with it. That pack bombarded the floe while the swell from the stormy sea weakened and hollowed it from below. The fight was thirty or forty miles away. Its faint echoes reached the hut, and every distant shock made the little whalebone pointer tremble. Once ice wakes from its long winter sleep, Inuit say, no one knows what it may do next. Solid floe ice can change its shape almost as quickly as a cloud. The gale had come like a spring storm sent at the wrong time, and now anything was possible."
        - id: ch03-b17
          speaker: narrator
          text: "Strangely, they felt happier. Breaking ice meant they would no longer wait and suffer. Spirits, goblins, and witch people seemed to move over the tortured floe. Kotuko and the girl imagined stepping into Sedna's land among wild Things while excitement still warmed them. Outside after the gale, the horizon's noise grew steadily. Hard ice moaned and buzzed on every side."
        - id: ch03-b18
          speaker: kotuko
          text: "It's still waiting."
        - id: ch03-b19
          speaker: narrator
          text: "The eight-legged Thing crouched on a hummock. It gave a dreadful howl."
        - id: ch03-b20
          speaker: northern_girl
          text: "Let's follow it. It may know a road that doesn't end with Sedna."
        - id: ch03-b21
          speaker: narrator
          text: "She staggered from weakness when she took the rope. The Thing moved awkwardly over the ridges, always west toward land. They followed as thunder rolled closer from the floe edge."
    - id: ch04
      title: The Breaking Ice
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: "For three or four miles inland, cracks split the floe's outer rim in every direction. Great pans of ice, ten feet thick and anywhere from a few yards to twenty acres across, pitched, dipped, and struck one another as the heavy swell caught and shook them. Water spouted between the blocks. This was the sea's first army, a charge of frozen battering rams against the unbroken field. Their endless crash almost covered the ripping beneath, where whole sheets of pack ice drove under the floe like cards shoved hurriedly under a tablecloth. In shallow water those layers piled one upon another until the lowest touched mud fifty feet down. Discolored seawater banked behind the muddy ice. The pressure mounted until it hurled everything forward again."
        - id: ch04-b02
          speaker: narrator
          text: "True icebergs came with the wind and current, sailing mountains broken from Greenland or the northern shore of Melville Bay. They moved solemnly toward the floe like an ancient fleet under full sail, with waves breaking white around them. One berg that seemed able to sweep the world away grounded helplessly in deep water. It reeled and wallowed in foam, mud, and flying frozen spray. A smaller, lower berg ripped into the flat floe, throwing tons of ice to each side and cutting a track half a mile long before it stopped. Some fell like swords and sheared raw-edged canals. Some shattered into blocks weighing scores of tons, which spun and skirted among the hummocks. Others rose bodily from the water when they reached shallows, twisted as if in pain, and crashed onto their flanks while the sea threshed across their shoulders. Along the whole northern edge, ice trampled, crowded, bent, buckled, and arched into every possible shape."
        - id: ch04-b03
          speaker: narrator
          text: "To the two travelers, the destruction beneath the horizon looked like a crawling ripple. Every moment it came nearer. Far behind them toward land, heavy booms sounded like cannon through fog. The floe was being driven against Bylot Island's iron cliffs."
        - id: ch04-b04
          speaker: kotuko
          text: "This has never happened before. It's the wrong season. How can the floe break now?"
          emotion: surprised
        - id: ch04-b05
          speaker: northern_girl
          text: "Follow that Thing!"
          emotion: fearful
        - id: ch04-b06
          speaker: narrator
          text: "She pointed at the limping shape. They dragged the hand sleigh after it as the roaring ice advanced. Cracks starred the fields around them and snapped open like wolves' teeth. The Thing stopped on a fifty-foot mound of old scattered blocks. That mound did not move. Kotuko lunged ahead, pulling the girl with him, and scrambled to its foot. Ice talked louder and louder on every side, but their refuge held firm. He looked at the girl and thrust his right elbow up and out, the Inuit sign for island land."
        - id: ch04-b07
          speaker: narrator
          text: "It was land. The eight-legged Thing had brought them to a little islet near the coast, with granite at its crown and sand along its beach. Ice shod it, sheathed it, and masked it so completely that no one could distinguish it from the surrounding floe. Beneath that frozen disguise was solid earth, not moving ice. Floes smashed, rebounded, and splintered along its borders. A friendly shoal reached north and turned aside the heaviest rush exactly as a plowshare turns earth. There was still danger. A field squeezed hard enough might shoot up the beach and plane the top from the island. Kotuko and the girl did not trouble over that possibility. They built another snow house, began to eat, and listened to ice hammer, grind, and skid along the beach."
        - id: ch04-b08
          speaker: narrator
          text: "The Thing vanished. Beside the lamp, Kotuko spoke wildly of his command over spirits. In the middle of his excited claims, the girl began to laugh and rock back and forth. Over her shoulder, two heads crept slowly into the hut, one yellow and one black. They belonged to the saddest, most ashamed dogs anyone had ever seen. Kotuko's yellow dog and the old black leader were fat, healthy, and entirely sane again, but fastened together in an astonishing way. The black dog had fled the village wearing his harness. Somewhere on the ice he must have met the yellow dog and played or fought with him. The harness loop from his shoulder had caught in the yellow dog's braided copper collar and drawn tight. Neither animal could reach the trace with his teeth to gnaw it apart. Each was fixed sideways against his neighbor's neck. Being forced to sleep, eat, and hunt together while free on the ice must have helped cure their madness. Now they entered with the deeply sober air of dogs who knew exactly how strange they looked."
        - id: ch04-b09
          speaker: narrator
          text: "The girl pushed the shamefaced pair toward Kotuko. She laughed until she sobbed."
        - id: ch04-b10
          speaker: northern_girl
          text: "There's Quiquern, the spirit who led us onto safe ground! Look at his eight legs and his two heads!"
          emotion: happy
        - id: ch04-b11
          speaker: narrator
          text: "Kotuko cut the dogs apart, and yellow and black tumbled into his arms together, trying to explain how they had recovered. He felt along their round, well-covered ribs and grinned."
        - id: ch04-b12
          speaker: kotuko
          text: "They've been eating. We may not go to Sedna yet. My tornaq sent them, and their sickness is gone."
          emotion: happy
        - id: ch04-b13
          speaker: narrator
          text: "The dogs had slept, eaten, and hunted side by side for weeks. The moment their greeting ended, they seized each other's throats and began a splendid fight inside the snow house."
        - id: ch04-b14
          speaker: kotuko
          text: "Starving dogs don't fight. They've found seals. Sleep now. We'll find food."
        - id: ch04-b15
          speaker: narrator
          text: "When they woke, open water washed the island's northern beach, and all the loosened ice had driven toward the land. To Inuit ears, the first sound of surf is one of the loveliest sounds in the world because it says spring is already on the road. Kotuko and the girl held hands and smiled. The full clear roar of waves among ice reminded them of salmon time and reindeer time, and of the scent of ground willows in blossom. Even as they watched, the fierce cold began skinning the water with new ice between the floating cakes. But the horizon glowed vast and red with light from the sun still hidden below it. It was more like hearing the sun yawn in his sleep than watching him rise. The red glow lasted only a few minutes, yet it marked the turning of the year. Nothing, they felt, could alter that promise now."
        - id: ch04-b16
          speaker: narrator
          text: "Kotuko found the dogs fighting over a newly killed seal that had followed fish stirred up by the gale. It was only the first of twenty or thirty seals to land on the island during that day. Until the sea froze hard again, hundreds of keen black heads rejoiced in the shallow open water. They floated and dove among the loose cakes of drifting ice. How good it was to eat fresh seal liver again. How good to fill the lamps recklessly with blubber and watch the bright flames leap three feet into the air."
    - id: ch05
      title: Food for the Village
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: "As soon as the new sea ice could carry weight, Kotuko and the girl loaded their hand sleigh. They made the two dogs pull harder than they had ever pulled, for fear of what might have happened at home. The weather remained as pitiless as before. Still, drawing a sleigh loaded with good food was easier than hunting on an empty stomach. They buried twenty-five seal carcasses in the ice along the beach, ready for later use, and hurried toward their people. Once Kotuko explained what he expected, the two dogs showed them the road. There was no landmark anywhere on the white waste. Even so, in two days the team stood outside Kadlu's house and gave tongue. Only three village dogs answered. The people had eaten all the others, and every house was dark."
        - id: ch05-b02
          speaker: kotuko
          text: "Ojo! Boiled meat!"
        - id: ch05-b03
          speaker: narrator
          text: "Weak voices answered his cry. Kotuko called the roll of the village, speaking every name slowly and clearly. Not one person was missing. An hour later, the lamps blazed high in Kadlu's house. Snow water warmed, the cooking pots began to simmer, and heat sent drops from the roof. Amoraq prepared a meal for everyone in the village. The baby in her hood chewed a strip of rich, nutty blubber. Around him, the hunters ate seal meat slowly and methodically, filling themselves to the very brim."
        - id: ch05-b04
          speaker: narrator
          text: "Kotuko and the northern girl told everything that had happened. The two dogs sat between them throughout the tale. Whenever either name came into the story, each animal cocked one ear and looked thoroughly ashamed of himself. Inuit say that a dog who has once gone mad and recovered is safe from every later attack of the sickness."
        - id: ch05-b05
          speaker: kotuko
          text: "So my tornaq remembered us. The storm came, the ice broke, and the seals followed the frightened fish. The new seal holes are less than two days away now. Tomorrow the good hunters can fetch the twenty-five seals I buried in the ice. When those are eaten, we'll all follow the seals out on the floe."
        - id: ch05-b06
          speaker: angekok
          text: "And what will you do?"
        - id: ch05-b07
          speaker: narrator
          text: "The angekok used the respectful voice he usually kept for Kadlu, the richest man among the Tununirmiut. Kadlu looked at the girl and spoke quietly."
        - id: ch05-b08
          speaker: kadlu
          text: "We will build a house."
          emotion: calm
        - id: ch05-b09
          speaker: narrator
          text: "He pointed to the northwest side of his own house. Among his people, that was the side where a married son or daughter always built a new home. The northern girl turned both hands palm upward and gave a small despairing shake of her head. She was a foreigner whom they had rescued from starvation. She could bring nothing at all to the new household. Amoraq jumped from the sleeping bench. She began sweeping treasures into the girl's lap: stone lamps, iron scrapers for working skins, tin cooking pots, and deerskins embroidered with musk-ox teeth. Last came real canvas needles of the kind sailors used. It was the finest dowry ever given at the far edge of the Arctic Circle, and the girl from the north bowed her head all the way to the floor."
        - id: ch05-b10
          speaker: kotuko
          text: "And these too!"
          emotion: happy
        - id: ch05-b11
          speaker: narrator
          text: "Kotuko laughed and beckoned to the dogs. They pushed their cold noses into the girl's face. The angekok coughed importantly, as though he had considered everything for a long time."
        - id: ch05-b12
          speaker: angekok
          text: "The moment Kotuko left, I entered the Singing House and began my magic. I sang through every long night and called the Reindeer Spirit. My song raised the gale that shattered the ice. I drew the two dogs to Kotuko before the floe could crush him. I brought the seals behind the broken ice. My body stayed in the Singing House, but my spirit ran across the floe and guided Kotuko and the dogs through every deed. It was all my doing."
        - id: ch05-b13
          speaker: narrator
          text: "Everyone was full and sleepy, so nobody bothered to disagree with his grand account. By right of his important office, the angekok helped himself to one more great lump of boiled meat from the pot. Then he lay down to sleep among the others in the warm, well-lighted home that smelled richly of oil."
    - id: ch06
      title: The Ivory Story
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: "Kotuko could draw very well in the Inuit manner. He chose a long, flat piece of ivory with a hole pierced through one end. Across its surface he scratched pictures of every adventure, setting the whole tale down in the form his people understood and preserving each part of their journey in its proper place. During the year remembered as the Wonderful Open Winter, Kotuko and the girl traveled north together to Ellesmere Land. Before they began that journey, he left the complete picture story safely in Kadlu's keeping."
        - id: ch06-b02
          speaker: narrator
          text: "One summer, Kadlu's dog sleigh broke down on the shore of Lake Netilling near Nikosiring. In the confusion of repairing the sleigh and continuing his journey, he lost the carved ivory among the shingle and rounded beach pebbles. It lay there through the winter. A Lake Inuit found it on that same shore the following spring. He carried it away and sold it to a man at Imigen. That man worked as an interpreter aboard a whaling ship from Cumberland Sound. The interpreter kept the picture for a time, then passed the carving on to Hans Olsen in another sale. Olsen afterward became quartermaster on a large steamer that carried tourists far north to see Norway's North Cape."
        - id: ch06-b03
          speaker: narrator
          text: "When each tourist season ended, the steamer changed its route. It traveled the long line between London and Australia and called at Ceylon along the way. There Hans Olsen sold the carved ivory to a Cingalese jeweler. In return for the record of Kotuko's journey, he accepted two imitation sapphires. Much later, I entered a house in Colombo and found the ivory lying forgotten beneath a heap of rubbish. The pictures still ran over the long flat surface from the pierced end to the other. I took Kotuko's picture story, followed every mark in its proper order, and translated the tale carefully from one end to the other."
