audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 沉稳生动，带着古老故事的智慧
        timbre: 温暖浑厚
        pace: 舒缓
        pitch: 中低
    kotuko:
      display_name: 科图科
      tts:
        delivery: 坚韧率直，从少年人的自信渐渐转为疲惫而执着
        timbre: 清亮结实
        pace: 适中
        pitch: 中高
    kadlu:
      display_name: 卡德卢
      tts:
        delivery: 寡言稳重，带着老猎手的从容和实际
        timbre: 低沉厚实
        pace: 稍慢
        pitch: 低
    amoraq:
      display_name: 阿莫拉克
      tts:
        delivery: 温和利落，透着北方母亲安静的坚强
        timbre: 温暖柔韧
        pace: 适中
        pitch: 中
    northern_girl:
      display_name: 北方女孩
      tts:
        delivery: 沉静勇敢，话少而坚定，危急时依然清醒
        timbre: 清冷柔和
        pace: 稍慢
        pitch: 中高
    angekok:
      display_name: 安格库克
      tts:
        delivery: 神秘郑重，善于用煞有介事的口气夸大自己
        timbre: 沙哑低沉
        pace: 舒缓
        pitch: 中低
  chapters:
    - id: ch01
      title: 冰原上的两个科图科
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            东冰原的人像雪一样消融，他们向白人讨咖啡和糖，也跟着白人四处走。西冰原的人学会偷窃争斗，把毛皮和灵魂一同卖给商站。南冰原的人同捕鲸船做买卖，女人有许多彩带，帐篷却又少又破。只有古老冰原的人住在白人看不见的地方。他们用独角鲸的长角做矛，是人中最后的一代。
        - id: ch01-b02
          speaker: amoraq
          text: >-
            它睁开眼了。快看！
        - id: ch01-b03
          speaker: kadlu
          text: >-
            把它放回皮袋。它会长成一条壮狗，到了第四个月再取名字。
        - id: ch01-b04
          speaker: amoraq
          text: >-
            用谁的名字？
        - id: ch01-b05
          speaker: narrator
          text: >-
            卡德卢在兽皮衬里的雪屋里看了一圈，目光落在十四岁的儿子身上。科图科坐在睡榻上，正用海象牙雕纽扣。
        - id: ch01-b06
          speaker: kotuko
          text: >-
            就叫它科图科吧。我总有一天会用得上它。
        - id: ch01-b07
          speaker: narrator
          text: >-
            卡德卢也咧嘴笑了，扁平面颊上的肥肉几乎埋住双眼。他朝阿莫拉克点点头。小狗凶悍的母亲呜呜叫着，眼巴巴看着孩子在海豹皮袋里扭动，却怎么也够不到。那只袋子高高挂在鲸脂灯的暖气上方。科图科继续雕他的纽扣。卡德卢把一卷皮制狗具扔进雪屋侧面的小储藏室，又脱下厚重的鹿皮猎装，放到另一盏灯上方的鲸骨网里。随后，他坐上睡榻，削起一块冻海豹肉，等妻子阿莫拉克端来照例的熟肉和血汤。他天不亮就去了八英里外的海豹孔，带回三头大海豹。通往内门的低矮雪道里，不时传出咬斗和吠叫。拉了一天雪橇的狗刚解下挽具，正在争抢暖和的位置。
        - id: ch01-b08
          speaker: narrator
          text: >-
            叫声太响，科图科就懒洋洋地下榻，拿起长鞭钻进通道。鞭柄是一尺半长、富有弹性的鲸骨，后面连着二十五英尺的粗重编皮鞭。通道里听来，仿佛所有狗都在活吃他，其实那不过是它们饭前照例的祷告。他从另一头爬到屋外，六七颗毛茸茸的脑袋一路盯着他。他走到鲸鱼颌骨搭成的架子前，狗粮就挂在那里。科图科用宽头长矛劈下大块冻肉，一手执鞭，一手拿肉站好。最弱的狗先来，随后每条狗都要等他叫到名字。谁抢在轮到自己以前乱动，鞭梢就像拴在皮绳上的闪电，削掉它一寸宽的毛皮。每条狗都低吼、猛咬，险些噎住地吞下那份肉，随后赶紧躲回通道。男孩站在灿烂北极光下的雪地上，给它们主持公道。最后轮到黑色大头犬。它在套上挽具时负责维持秩序，科图科给了这条领队双份肉，也多赏了一鞭。
        - id: ch01-b09
          speaker: kotuko
          text: >-
            萨波克，进去！灯上面还有个小家伙，将来叫起来可有你们受的。
        - id: ch01-b10
          speaker: narrator
          text: >-
            他从挤作一团的狗群上爬回屋，用阿莫拉克放在门边的鲸骨拍子，掸净皮衣上的干雪。随后又敲敲兽皮衬里的屋顶，把可能从雪穹上落下的冰凌震掉，这才蜷回睡榻。通道里的狗睡着了，仍在打鼾呜咽。阿莫拉克深深的皮兜帽里，男婴又踢又咳，嘴里还发出含混的咕哝。母狗伏在科图科身旁，两只眼睛始终盯着高悬在宽阔黄色灯焰上方的小皮袋。那里温暖又安全。
        - id: ch01-b11
          speaker: narrator
          text: >-
            这一切发生在遥远的北方。那里越过拉布拉多，又越过大潮推动冰层起伏的哈得孙海峡。还要走到梅尔维尔半岛以北，甚至越过狭窄的富里—赫克拉海峡，才会来到巴芬岛北岸。拜洛特岛矗立在兰开斯特海峡的冰面上，活像一只倒扣的布丁碗。兰开斯特海峡以北，人们所知的地方寥寥无几，除了北德文岛和埃尔斯米尔陆地。可即使在那里，也散居着几户人家，仿佛就住在北极隔壁。
        - id: ch01-b12
          speaker: narrator
          text: >-
            卡德卢是因纽特人，也就是人们所说的爱斯基摩人。他一家属于图努尼尔米乌特，全族约有三十人。这个名字是“某物背后的土地”。地图管那片荒凉海岸叫海军委员会湾，但因纽特人的名字更准确，因为那里真躲在世上一切事物背后。一年有九个月只见冰雪，一场接一场的狂风，还有没见过温度计落到零度的人根本无法想象的严寒。这九个月里，又有六个月暗无天日，真正可怕的正是这一点。夏季三个月里，也不过是隔一天结一次冰，夜里更是天天冻结。朝南山坡上的雪开始像流泪一样融化，贴地柳树冒出毛茸茸的芽，一两株小景天装模作样地开花。细砾和圆石铺成的海滩伸向开阔水面，磨得光亮的巨石和带条纹的岩石，也从颗粒般的残雪中露头。几星期后，一切又消失，狂野冬天重新锁住大地。海冰在近岸外上下冲撞，挤压、猛击、裂开、碰撞，彼此捶打，又撞上浅底。最后，从岸边通向深水的海面全冻成一体，足有十英尺厚。
        - id: ch01-b13
          speaker: narrator
          text: >-
            冬季，卡德卢追着海豹来到陆缘冰尽头，守在呼吸孔旁，等它们露头便用矛刺下去。海豹必须有开阔水面，才能活命和捕鱼。可到了隆冬，从最近的海岸向外八十英里，也可能没有一道水缝。春天，族人退回多岩的大陆，搭起兽皮帐篷，捕海鸟，也用矛猎杀在滩上晒太阳的小海豹。再晚一些，他们便南下巴芬岛追驯鹿，还要从内陆数不清的溪流和湖泊里，捕足整整一年的鲑鱼。九月或十月，他们返回北方猎麝牛，再按时开始冬季猎海豹。旅行时，他们驾狗橇，一天走二三十英里。有时也乘大型兽皮女人船沿海岸航行。狗和婴儿躺在划船人的脚边，女人一路唱歌，船滑过冰冷如镜的海水，从一座海角驶向下一座海角。
        - id: ch01-b14
          speaker: narrator
          text: >-
            图努尼尔米乌特人所知的奢侈品全来自南方。有给雪橇滑木用的漂流木、做鱼叉尖的条铁、钢刀，还有比皂石锅好用得多的铁皮锅。火石、火镰，甚至火柴，也是从那里来的。女人们用的东西也一样，头发上的彩带、廉价小镜子、给鹿皮短袄镶边的红布，全要靠交易。卡德卢拿乳白而带螺纹的独角鲸角和麝牛牙，向南方因纽特人换取这些东西。它们像珍珠一样珍贵。南方人再同捕鲸船和埃克塞特湾、坎伯兰湾的传教站交易。货物就这样一站站传递，直到一只船上厨师从本迪市场买来的锅，最终在北极圈寒冷的一侧，悬到某盏鲸脂灯上，度过余生。
        - id: ch01-b15
          speaker: narrator
          text: >-
            卡德卢是好猎手，铁鱼叉、雪刀和投鸟镖很多，算得上富有。他也是部族头领，就是“凭经验什么都懂的人”。这身份没给他多少权力，最多能劝朋友换个猎场。倒是科图科仗着父亲的地位，在月光下玩球、对北极光唱《孩子之歌》时，会用因纽特人那种懒洋洋、胖乎乎的派头，对别的男孩摆一点威风。
        - id: ch01-b16
          speaker: narrator
          text: >-
            十四岁的因纽特男孩总觉得自己已是男人。科图科早厌了给野禽和北极狐下套，更厌了男人出猎时，整天帮女人嚼软海豹皮和鹿皮。只有这样，皮子才会柔软，可他实在不想再嚼了。他想进夸吉，也就是歌唱屋，看猎手举行秘密仪式。灯一熄，巫师安格库克便把众人吓得痛快。黑暗里，屋顶会响起驯鹿之灵的脚步。一支矛刺进屋外漆黑的夜，抽回来时，矛头就沾满热血。他也想学一家之主那样，摆出疲惫的样子，把大靴子扔进网里。猎手们晚上到访时，他还想同他们一起赌博，用铁皮罐和钉子玩自制轮盘。想做的事足有几百件，成年男人却只管笑他。
        - id: ch01-b17
          speaker: kadlu
          text: >-
            等你在扣带里待过再说吧，科图科。打猎可不只是捉到猎物。
        - id: ch01-b18
          speaker: narrator
          text: >-
            父亲用他的名字给小狗命名，事情便有了盼头。因纽特人绝不会把好狗交给不懂赶狗的儿子，而科图科确信，世上赶狗的学问，他懂得还不止全部。
        - id: ch01-b19
          speaker: narrator
          text: >-
            小狗若不是天生铁打的身子，早被科图科喂得太饱、摆弄得太多，丢了性命。男孩给它做小挽具，拖着它在屋里练习右转、左转和停步。可第一次套上雪橇，它才知道先前有多幸福。狗队一跑，十英尺长的重雪橇直冲上它后背，拖着它在雪地滑行，科图科却笑出了眼泪。此后，它天天听见长鞭像寒风般嘶响，因为不懂干活而被同伴咬，皮也给挽具磨破。它再不能同科图科睡，只能住在通道最冷的地方。那是小狗的一段苦日子。
        - id: ch01-b20
          speaker: narrator
          text: >-
            男孩也学得飞快，可驾驭狗橇实在叫人操碎了心。每条狗各有牵绳，最弱的靠赶车人最近。牵绳从左前腿下穿过，扣在主索上，手腕一转便能解开，一次放开一条狗。这一点很要紧。年轻狗常把绳子夹进后腿，活活磨到骨头。它们奔跑时又非要穿过绳索去拜访朋友，接着当场打架，缠得比第二天清晨的一团湿钓线还乱。鞭子用得好，能免掉许多麻烦。每个男孩都说自己是长鞭高手，可抽中地面记号很容易，雪橇飞驰时俯身向前，正好打中偷懒狗的肩后，就完全不同。若你喊着一条乱跑的狗，却误打了另一条，两条狗立刻就地决斗，整支队伍也跟着停下。人若同旅伴说话，或独自唱歌，狗还会停步转身，坐好听他到底想说什么。科图科停车时忘过卡住雪橇，眼看它自己逃走。他扯断过许多捆索，也毁过不少皮绳，最后才获准驾驭八条狗和轻雪橇。
        - id: ch01-b21
          speaker: narrator
          text: >-
            从那以后，他觉得自己成了大人物。在光滑黑冰上，只要胆子够大，手肘够快，他就能驾橇飞过平地，快得像一群放声追猎的猎犬。他会去十英里外找海豹孔。到了猎场，他从主索上解下一根牵绳，放开最聪明的黑色头犬。狗一嗅到孔的气味，他就掉转雪橇，把靠背上的两根短鹿角插进雪地。那两根鹿角像婴儿车的把手，深深卡进雪里，狗队便逃不了。随后，科图科一点点爬向前方，等海豹上来换气。海豹一露头，他便用带活绳的长矛向下刺去。不久，海豹被拖到冰缘，黑狗也跑来帮忙，把尸体拉过冰面，送到雪橇旁。其余狗馋得狂吠吐沫，兴奋得几乎发疯。长鞭像烧红的铁条，扫过它们的脸，直到尸体冻硬。回程更辛苦。满载的雪橇过碎冰时要处处小心，狗却只想坐着盯住海豹，不肯拉橇。直到踏上村边熟路，它们才低头翘尾，发出“嘟噜嘟噜——咿”的声音，在鸣响的冰上飞跑。科图科唱起《猎人归来之歌》。暗淡星光下，一座座雪屋都有人招呼他。
        - id: ch01-b22
          speaker: narrator
          text: >-
            狗科图科也长大了。它在队里一场接一场地打上去，终于在一天傍晚分食时，向黑色头犬发起挑战。男孩科图科在一旁主持公平。黄狗赢了，旧头犬降成二号犬，它则升到领头犬的长绳上，比其他狗跑在前面五英尺。无论套着挽具还是卸下挽具，制止所有打斗，都是它推不掉的职责。它戴着又粗又重的铜丝项圈。特殊日子里，它能进屋吃熟食，有时也同主人睡在榻上。它会猎海豹，会绕着麝牛奔跑，咬住脚跟，把那大家伙困在原地。它甚至敢迎战瘦骨嶙峋的北极狼，而北方狗最怕的就是这种走过雪原的野兽。男孩和黄狗日日夜夜一同打猎，一个裹着毛皮，一个长毛、细眼、白牙，凶猛而金黄。他们从不把普通狗队当作伙伴。因纽特人一生要做的，就是替自己和家人找到食物与毛皮。女人把毛皮做成衣服，也偶尔帮忙捕捉小兽，可一家人大得惊人的食量，主要还得靠男人填满。食物一旦断绝，那里无人可以买、可以求，也无人可借，所有人只能死。
        - id: ch01-b23
          speaker: narrator
          text: >-
            可不到绝境，因纽特人不会去想这种事。卡德卢、阿莫拉克、两个科图科，还有兜帽里乱踢、整天嚼鲸脂的男婴，同世上任何家庭一样幸福。他们的族类性情温和，很少发火，几乎从不打孩子，也不知道真正的谎话究竟是什么意思，更不用说偷窃。他们满足于从苦寒而绝望的冰冷心脏里，替自己刺出一条生路。到了晚上，他们油汪汪地笑着，讲起古怪的鬼怪和仙灵故事，一直吃到再也吃不下。在漫长的灯火日子里，他们一面缝补衣物和猎具，一面唱那支没有尽头的女人歌：“阿姆纳阿呀，阿呀阿姆纳，啊！啊！”
    - id: ch02
      title: 饥荒与狗瘟
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            可有一个可怕的冬天，一切都背叛了他们。图努尼尔米乌特人结束一年一度的鲑鱼捕捞，在拜洛特岛北面的初生冰上建起雪屋，等海面一封冻便去猎海豹。那年秋天来得又早又凶。整个九月狂风不断，平整海冰才冻到四五英尺厚，就被打碎推向内陆，堆成一道约二十英里宽的巨大冰障。那里到处是凹凸、锯齿和针尖般的碎冰，狗拉雪橇根本无法通过。他们冬季捕海豹的浮冰边缘，也许就在冰障以外二十英里，却已经落到族人无法抵达的地方。
        - id: ch02-b02
          speaker: narrator
          text: >-
            靠冻鲑鱼、鲸脂和陷阱里的猎物，他们本来还能勉强度冬。十二月，一名猎手却发现一顶图皮克，也就是兽皮帐篷。里面三个女人和一个女孩已经奄奄一息。她们的男人从遥远北方南下猎独角鲸，那种鲸长着长角。男人们出海时，小小的兽皮猎船全被压碎了。卡德卢只能把女人分到冬季村落的各座雪屋。因纽特人不敢拒绝给陌生人一顿饭，因为谁也不知道，何时会轮到自己上门乞食。阿莫拉克收留了约十四岁的女孩，让她留在家中帮忙。她的兜帽尖尖的，白鹿皮绑腿上绣着长长的菱形花纹，众人因此猜她来自埃尔斯米尔陆地。她从没见过铁皮锅，也没见过装木滑板的雪橇，男孩科图科和狗科图科却都很喜欢她。
        - id: ch02-b03
          speaker: narrator
          text: >-
            随后，狐狸全去了南方。就连狼獾，那种在雪中低吼、脑袋钝圆的小偷，也懒得光顾科图科布下的一排空陷阱。部族里两名最好的猎手同麝牛搏斗，伤得很重，从此残废，其他人的担子便更重了。科图科天天驾轻便猎橇，带着六七条最强壮的狗出门。他四处寻找一小片平整冰面，盼着那里也许有海豹抓出的呼吸孔，找得两眼发疼。黄狗科图科跑得又远又广。在死寂冰原上，哪怕它守着三英里外的孔，发出压抑而激动的呜咽，男孩也听得清清楚楚，仿佛狗就在自己手肘旁边。
        - id: ch02-b04
          speaker: narrator
          text: >-
            找到孔后，科图科便垒一道低矮的小雪墙，挡住最刺骨的风。他脚下只垫一小块海豹皮，双腿用图塔里昂，也就是老猎手说过的那副扣带，牢牢绑紧。眼睛始终盯住孔上方自己留下的小记号，那是鱼叉向下落去的准星。他会这样坐十小时、十二小时，甚至二十小时。扣带不让腿突然抽动，免得惊走耳朵灵敏的海豹。这件事没有半点激动人心的地方，可在零下四十度里静坐不动，是因纽特人所知最苦的活。真有海豹中矛，黄狗才拖着牵绳向前猛冲，帮他把尸体拉到雪橇旁。又饿又累的狗群则阴沉地伏在碎冰背风处。
        - id: ch02-b05
          speaker: narrator
          text: >-
            一头海豹喂不了多久。小村里每张嘴都有权吃饱，骨、皮、筋一点也不能浪费。原本给狗吃的肉也留给了人。阿莫拉克从睡榻下翻出夏季用过的旧帐篷皮，切成碎片喂狗。狗群叫了又叫，睡着后又会饿醒，继续哀号。饥荒临近，油灯最先知道。好年景里鲸脂充足，船形皂石灯上的黄火焰能蹿起两英尺，明亮、油润，叫人心里快活。如今只剩六英寸。火苗无人照看时偶尔亮一下，阿莫拉克就赶紧把苔藓灯芯挑低，全家人的眼睛都跟着她的手移动。北方饥荒最可怕的，不只是死，而是在黑暗里死。每年有六个月，无休无止的黑暗压在因纽特人身上，他们个个怕它。屋里的灯越暗，人心越动摇，神智也越混乱。
        - id: ch02-b06
          speaker: narrator
          text: >-
            可更坏的事来了。吃不饱的狗夜夜在通道里龇牙低吼，瞪着寒冷的星星，又把鼻子伸向刺骨的风。它们一停止号叫，寂静就像门口堵住的一堆积雪，沉重又坚实地落下。人能听见血液流过耳中细小管道的搏动，也能听见自己的心跳。那声音响得仿佛巫师的鼓声隔着雪原传来。一天夜里，白天套在挽具中格外阴郁的狗科图科忽然跃起，把脑袋抵在主人膝上。男孩拍拍它，它仍闭着眼往前顶，像在讨好。卡德卢醒来，抱住那颗狼一样的沉重脑袋，盯着玻璃般的眼睛。狗在他双膝之间哀鸣发抖，颈毛猛地竖起，仿佛门外来了陌生人。它先低声咆哮，接着又欢喜地吠叫，满地打滚，像幼犬那样去咬科图科的靴子。
        - id: ch02-b07
          speaker: kotuko
          text: >-
            它怎么了？
          emotion: fearful
        - id: ch02-b08
          speaker: kadlu
          text: >-
            是狗瘟。它病了。
        - id: ch02-b09
          speaker: narrator
          text: >-
            黄狗仰起鼻子，一声接一声长嚎。
        - id: ch02-b10
          speaker: kotuko
          text: >-
            我从没见过。它接下来会怎样？
        - id: ch02-b11
          speaker: narrator
          text: >-
            卡德卢微微耸了一边肩膀，穿过雪屋去拿短柄刺矛。大狗看见了，又嚎一声，低头溜进通道。其他狗纷纷向左右让开，给它腾出很大一片地方。它跑到外面的雪地上，忽然凶猛地狂吠起来，仿佛追到了麝牛。随后，它一边叫，一边跳跃嬉闹，最后消失不见。它得的不是怕水的狂犬病，只是简单而彻底的疯狂。寒冷、饥饿，尤其是黑暗，搅乱了它的脑子。可怕的狗瘟在队里一露头，就像野火一样蔓延。
        - id: ch02-b12
          speaker: narrator
          text: >-
            下一次出猎，又一条狗在牵绳间发病，乱咬乱挣扎，科图科当场杀了它。随后，从前当过头犬的黑色二号犬，忽然对着根本不存在的驯鹿踪迹放声追叫。人们刚把它从主索上解开，它便扑向一座冰崖的咽喉，随后背着挽具逃走，和黄狗一样消失了。从此谁也不敢再带狗出门。人们还需要用它们做另一件事，狗也明白。即使被牢牢拴住，由人亲手喂食，它们眼中仍满是绝望和恐惧。老妇人又开始讲鬼故事，说自己见到了那年秋天死去的猎手幽灵，那些幽灵还预言了种种骇人的灾祸。
        - id: ch02-b13
          speaker: narrator
          text: >-
            失去爱犬，比任何事都令科图科伤心。因纽特人食量虽大，也懂忍饥，可黑暗、严寒和风霜渐渐耗尽他的力气。他开始听见脑中有人说话，也会从眼角看见不存在的人。一天夜里，他在一个没有海豹的瞎孔上苦等十小时，回村时又饿又晕。半路上，他靠住一块只由冰尖托着的摇摇石。石头失去平衡，轰然翻倒。他跳到一旁，它却顺冰坡追来，一路摩擦嘶响。
        - id: ch02-b14
          speaker: narrator
          text: >-
            这对科图科已经足够。他从小相信，每块岩石都有自己的主人，也就是伊努阿。那通常是名叫托纳克的独眼女人怪。托纳克若愿意帮助一个人，就会待在自己的石屋里，一路滚着追来，问那个人愿不愿收她做守护灵。夏季解冻时，冰托住的岩石和巨石本就会在大地上到处滚落滑动，活石头的故事便由此而生。科图科听见耳中的血声。那声音他已听了一整天，如今却以为石头里的托纳克正在跟他说话。还没走到家，他已确信自己同她长谈了一场。族人也相信这种事完全可能，自然没人反驳。
        - id: ch02-b15
          speaker: kotuko
          text: >-
            她说：“我要从雪地上的位置跳下来。我会做你的向导，领你去好的海豹孔。”明天我就走，托纳克会带路。
        - id: ch02-b16
          speaker: narrator
          text: >-
            安格库克来到雪屋，科图科又讲了一遍。这次，故事一点也没缩水。
        - id: ch02-b17
          speaker: angekok
          text: >-
            跟着托奈特走。那些石头精灵会重新给我们带来食物。
    - id: ch03
      title: 向北寻找托纳克
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            北方女孩这些天一直躺在灯旁，吃得很少，说得更少。第二天，阿莫拉克和卡德卢给科图科备好手橇，装上猎具和所能省出的鲸脂、冻肉。女孩却拿起拉绳，勇敢地站到男孩身边。小雪橇装着骨滑板，跟在身后，在北极黑夜里吱嘎颠簸。
        - id: ch03-b02
          speaker: northern_girl
          text: >-
            你的家，就是我的家。
        - id: ch03-b03
          speaker: kotuko
          text: >-
            我的家也就是你的家。不过我想，我们大概要一起去见塞德娜了。
        - id: ch03-b04
          speaker: narrator
          text: >-
            塞德娜是冥界女主人。因纽特人相信，死者必须先在她的可怕国度住一年，才能去幸福之地夸德利帕米乌特。那里永不结冰，肥驯鹿一叫就来。村里的人高喊着，说托奈特会带科图科找到水面和海豹。声音很快被寒冷空旷的黑暗吞没。两人肩挨着肩拉橇，引着它越过碎冰。科图科坚持说，托纳克叫他往北。他们便在大熊座那头“驯鹿”的星光下，一直向北。
        - id: ch03-b05
          speaker: narrator
          text: >-
            换作欧洲人，在满地冰碴和边缘锋利的雪堆间，一天连五英里也走不了。他们两个却知道怎样转动手腕，哄着雪橇绕过冰丘，也知道怎样猛地一拽，让它几乎跃出冰缝。绝路当前时，他们更清楚该用多大的力气，不慌不忙地用矛头敲上几下，凿出一条通道。女孩低头不语。她的白鼬皮兜帽镶着长长的狼獾毛边，风把毛边吹过她宽阔黝黑的脸。头顶的天空像浓黑丝绒，到了地平线才化作一道道印度红色的光带，巨大的星星在那里燃烧，亮得像街灯。绿色北极光偶尔横卷过高空穹窿，像旗帜一样猛地抖动，转眼又消失。流星也会噼啪作响，从一片黑暗划进另一片黑暗，身后拖着一阵火花。
        - id: ch03-b06
          speaker: narrator
          text: >-
            那些光照亮浮冰上的脊岭和沟壑，边缘仿佛缀上了红色、铜色和淡蓝色。可在平常星光下，一切只是冻伤般的灰。秋季风暴反复捶打折磨这片冰原，把它变成一场凝固的地震。这里有沟渠、峡谷，还有像砾石坑一样凿进冰层的深洞。大块小块的碎冰散落各处，冻在原先的冰面上。有些旧冰漆黑一片，曾被风暴挤到浮冰下面，又被顶了上来。还有圆滚滚的冰石、被飞雪雕出的锯齿冰刃，以及一片片低陷的冰地。每一片足有三四十英亩，低于周围冰原。从远处看，冰块可能是海豹、海象，可能是翻倒的雪橇或出猎的人，甚至可能是十条腿的白色熊灵。每种怪诞形状都像下一刻便会活过来，可四周没有声音，连最微弱的回声也没有。两个人拖着雪橇爬过这片寂静荒原，头顶突如其来的光一阵招展，又骤然熄灭。他们像陷在一场噩梦里，在世界尽头，梦见世界末日。
        - id: ch03-b07
          speaker: narrator
          text: >-
            累了，科图科就造一座猎手所谓的“半屋”，也就是极小的雪屋。两个人挤进去，点起旅行灯，试着化开冻海豹肉。睡醒后再走，一天走上三十英里，却只能向北推进十英里。女孩始终沉默。科图科却不停嘟囔，忽然又唱起从歌唱屋里学来的曲子。有夏日歌，有驯鹿歌，也有鲑鱼歌，在这个季节里听来全都荒唐而可怕。他声称听见托纳克朝自己低吼，随后狂奔上一座冰丘，挥舞双臂，用响亮而威胁的口气喊叫。其实他那阵子已经接近疯狂，女孩却确信守护灵正在引路，也相信最后一切都会好起来。
        - id: ch03-b08
          speaker: narrator
          text: >-
            第四段路结束时，科图科两眼在脑袋里烧得像火球。他告诉女孩，托纳克正化成一条双头犬，在雪地上跟着他们。女孩朝他手指的地方望去，仿佛有什么滑进一道冰沟。那当然不是人，可谁都知道，托奈特原本就爱变成熊、海豹一类的样子出现。那也可能是十条腿的白色熊灵，或者任何东西，因为两人饿得连自己的眼睛都靠不住。他们离开村子以后，什么也没捕到，连猎物的踪迹也没见过。剩下的食物撑不过一星期，而风暴已经来了。
        - id: ch03-b09
          speaker: narrator
          text: >-
            北极风暴能连刮十天，一刻也不停。那时候留在屋外，必死无疑。科图科造了一座足够放进手橇的雪屋，因为猎手永远不能同自己的食物分开。他正修整最后一块形状不规则的冰，要把它嵌作屋顶的拱顶石，忽然看见半英里外的小冰崖上，有个东西正在望着自己。空气里雾气蒙蒙，那东西看上去足有四十英尺长、十英尺高，身后还拖着二十英尺的尾巴，整个轮廓不停颤动。女孩也看见了，却没有害怕地叫出声。
        - id: ch03-b10
          speaker: northern_girl
          text: >-
            那是奎昆。接下来会发生什么？
        - id: ch03-b11
          speaker: kotuko
          text: >-
            它会来跟我说话。
        - id: ch03-b12
          speaker: narrator
          text: >-
            可他手里的雪刀在发抖。一个人再相信自己是怪精灵的朋友，精灵真来找他时，也不会自在。奎昆是巨大的无毛无牙狗鬼，住在遥远北方。每逢有事将要发生，它便四处游荡。事情可能好，也可能坏，连巫师都不愿谈它。它会把狗逼疯，还像白色熊灵一样，有六条或八条腿。雾里那个东西的腿，确实比真狗需要的多。
        - id: ch03-b13
          speaker: narrator
          text: >-
            两人赶紧缩进雪屋。奎昆真想抓他们，当然能从头顶撕碎整座屋子。可一英尺厚的雪墙隔开了邪恶黑暗，想起来仍让人安心。狂风像火车尖啸般扑来，刮了三天三夜。方向丝毫不变，连一分钟也不曾减弱。他们把石灯夹在膝间，不断添油，小口啃着半温的海豹肉，看黑烟灰在屋顶越积越厚，熬过漫长的七十二小时。女孩把雪橇上的食物一一清点，只够两天。科图科则反复检查鱼叉、海豹矛和投鸟镖，查看每一个铁头和每一处鹿筋绑索。除此以外，他们无事可做。
        - id: ch03-b14
          speaker: northern_girl
          text: >-
            我们很快就要去见塞德娜了。三天以后，我们躺下，就这样去了。你的托纳克还是不肯帮忙吗？唱一支巫师的歌，把她叫来吧。
          emotion: sad
        - id: ch03-b15
          speaker: narrator
          text: >-
            科图科扯起尖厉长嗥，唱起法术歌，狂风慢慢低下去。歌到一半，女孩忽然一动，把戴着手套的手按在冰地上，接着又贴下耳朵。科图科也照着做。两人跪在那里，彼此盯住对方的眼睛，全身每一根神经都在倾听。他从雪橇上的捕鸟套边缘撕下一片薄鲸骨，把它拉直，插进冰面一个小孔，再用手套把四周压牢。那根细杆几乎像罗盘针一样灵敏。他们不再用耳朵听，只盯着它看。细杆先轻轻一颤，那震动细微到了极点。接着，它连续振动几秒，终于停住，随后又颤起来。这一次，它朝另一个方向点头。
        - id: ch03-b16
          speaker: kotuko
          text: >-
            太早了！一定是远处有一大块浮冰裂开。
        - id: ch03-b17
          speaker: northern_girl
          text: >-
            不是普通的裂冰，是大冰裂。听贴地的冰，它在敲。
        - id: ch03-b18
          speaker: narrator
          text: >-
            他们再次跪下。脚底传来沉闷古怪的哼声和叩击，有时像瞎眼幼犬在灯上吱叫，有时像石头碾过坚冰，又像蒙住的鼓声。所有声音都拖得很长，又缩得极小，仿佛从疲惫的远方，穿过一只细号角传来。
        - id: ch03-b19
          speaker: kotuko
          text: >-
            我们不会躺着去见塞德娜了。冰正在裂。托纳克骗了我们，我们会死。
          emotion: fearful
    - id: ch04
      title: 冰醒了
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            这话听来荒唐，两个人面对的危险却再真实不过。三天狂风把巴芬湾的深水推向南方，一路堆到辽阔陆缘冰的边沿。那片冰从拜洛特岛向西伸展。与此同时，兰开斯特海峡向东流去的强劲海流，又送来一英里接一英里的粗砺流冰。那些冰还没有冻成整片冰原。流冰群不停轰击浮冰，饱经风暴搅动的海水也一面涌动起伏，一面削弱并掏空冰层。两人听见的，正是三四十英里外那场争斗传来的微弱回声。那根报信的小细杆，也随着一次次冲击颤抖。
        - id: ch04-b02
          speaker: narrator
          text: >-
            因纽特人说，冰从漫长冬眠中一醒，谁也猜不到接下来会发生什么。原本坚固的浮冰改变形状时，几乎和天上的云一样快。这显然是一场来错季节的春风暴，所以任何事都可能发生。两个人心里反倒比先前轻松了些。冰若碎裂，他们便不用再等待，也不用继续受苦。挤压呻吟的冰上，精灵、妖怪和巫人都在走动。也许他们能带着胸中最后的激动，同那些狂野怪物并肩走进塞德娜的国度。风停后，他们离开雪屋，地平线上的轰鸣越来越响，坚韧的冰层在四周呻吟嗡鸣。
        - id: ch04-b03
          speaker: kotuko
          text: >-
            它还在等我们。
        - id: ch04-b04
          speaker: narrator
          text: >-
            三天前的八腿怪物蹲在冰丘顶上，发出骇人长嗥。
        - id: ch04-b05
          speaker: northern_girl
          text: >-
            跟着它走吧。也许它知道一条不通往塞德娜的路。
        - id: ch04-b06
          speaker: narrator
          text: >-
            女孩拿起拉绳时，虚弱得站不稳。那东西慢慢越过一道道冰脊，动作笨拙，一直向西，也就是向陆地移动。他们跟在后面，冰海滚雷般的咆哮越来越近。浮冰边缘向内三四英里都裂开了。十英尺厚的巨大冰盘互相冲撞、沉浮、翻涌。有的只几码见方，有的足有二十英亩。沉重的涌浪抓住它们，使劲摇晃，又从冰块之间向上喷射。它们不仅撞击同伴，也撞向还没有破裂的浮冰。这些攻城槌般的冰块，就是大海掷向浮冰的第一支军队。
        - id: ch04-b07
          speaker: narrator
          text: >-
            冰盘不停碰撞震击，几乎淹没另一种声音。那是大片流冰被整个推入浮冰底下，发出的撕裂声。看起来，就像有人匆忙把纸牌塞进桌布下面。浅水处，流冰一层叠一层，直到最下面碰到五十英尺深的海泥。浑浊的海水在沾泥的冰墙后越积越高，压力不断增加，最后又把所有冰块一齐推向前方。除了浮冰和流冰群，狂风与海流还带来真正的冰山。那些航行的冰山从格陵兰一侧，或从梅尔维尔湾北岸断裂下来。它们四周浪花翻白，像一支挂满风帆的古老舰队，庄严地冲向浮冰。
        - id: ch04-b08
          speaker: narrator
          text: >-
            有的巨型冰山仿佛能横扫整个世界，却在深水里无可奈何地搁浅。它摇晃倾倒，在泡沫、泥浆和飞溅的冻雾中翻滚。另一些矮小冰山反而撕进平坦冰原，把成吨的冰抛向两旁，划出半英里长的轨迹才停下。有的像剑一样倒下，劈开一条边缘生硬的水道。有的碎成无数冰块，每块重达几十吨，在冰丘之间旋转擦过。还有的到了浅处，整个身子忽然升出水面，仿佛痛苦般扭转，再重重侧倒，任海浪抽打肩头。北方整条冰线都在踩踏、拥挤、弯折、折叠和拱起，变成一切可能的形状。远远看去，只像地平线下不安的起伏蠕动，却每一刻都在逼近。南方靠近陆地的地方，传来雾中炮声般的沉重巨响。那说明浮冰正被死死挤向拜洛特岛的铁崖，而陆地就在他们身后。
        - id: ch04-b09
          speaker: kotuko
          text: >-
            这种事从没发生过。现在还不是时候，浮冰怎么会现在裂开？
          emotion: surprised
        - id: ch04-b10
          speaker: northern_girl
          text: >-
            别停，跟着那个东西！
        - id: ch04-b11
          speaker: narrator
          text: >-
            她指着前方半跛半跑的怪物。两人拖着手橇追去，冰的咆哮越来越近。周围冰原裂出星状缝隙，裂口张合，如狼牙咬击。怪物停在一座五十英尺高的旧冰丘上，那里却纹丝不动。科图科拖着女孩冲到山脚。冰声越来越响，山丘依旧稳固。他抬起右肘向外一扬，做出因纽特人表示岛屿的手势。
        - id: ch04-b12
          speaker: narrator
          text: >-
            那八条腿、一瘸一拐的怪物带他们来到的，真是陆地。这是一座离岸小岛，顶部露着花岗岩，岸边铺着沙。冰替它穿鞋、裹身、遮脸，谁也无法把它同浮冰分开。可冰层底下是坚实大地，不是漂移的海冰。浮冰在岛边搁浅、撞碎又弹回，正好勾出小岛轮廓。一道亲切的浅滩向北伸出，像犁铧翻开泥土那样，把最沉重的冰流拨向两边。当然，受挤压的冰原仍可能突然冲上海滩，把整座小岛的顶部削平。但两人造起雪屋、开始吃东西时，只听见冰沿着海滩锤击滑撞，根本顾不上这种危险。怪物已经消失。科图科蹲在灯边，兴奋又狂热地夸说自己驾驭精灵的本领。话说到一半，女孩忽然前后摇晃，笑个不停。
        - id: ch04-b13
          speaker: narrator
          text: >-
            她肩后有两个脑袋，一点一点爬进雪屋。一个黄，一个黑，属于世上最悲伤、最羞愧的两条狗。一条是狗科图科，另一条是黑色头犬。它们如今都胖了，模样健壮，神智也完全恢复，却以一种古怪方式拴在一起。还记得吗，黑狗逃走时，身上依然套着挽具。它遇上黄狗后，一定同它玩过，或者打过一架，因为肩带绳圈勾进了黄狗编结的铜丝项圈，越收越紧。两条狗谁也够不到那根牵绳，无法把它咬断，只能侧着身子，一条拴在另一条脖子旁。这种处境，再加上能够自由自在地为自己捕猎，大概治好了它们的疯病。如今它们老实极了。
        - id: ch04-b14
          speaker: northern_girl
          text: >-
            原来这就是带我们找到陆地的奎昆！你看，八条腿，两个脑袋！
          emotion: happy
        - id: ch04-b15
          speaker: narrator
          text: >-
            科图科割断缠在一起的绳索，黄狗和黑狗便一起扑进他怀里。它们又叫又蹭，拼命想向主人解释，自己究竟是怎样恢复神智的。科图科伸手摸过两条狗的肋骨。那里圆滚滚的，覆着厚实的皮肉。他立刻明白过来，咧嘴笑了。
        - id: ch04-b16
          speaker: kotuko
          text: >-
            它们找到过食物。看来我们没那么快去见塞德娜。是托纳克送它们来的，疯病也离开了。
          emotion: happy
        - id: ch04-b17
          speaker: narrator
          text: >-
            两条狗过去几星期被迫一起睡、一起吃、一起捕猎。刚同科图科亲热完，它们便扑向彼此咽喉，在雪屋里痛痛快快打了一场精彩大战。
        - id: ch04-b18
          speaker: kotuko
          text: >-
            饿狗不会打架。它们找到海豹了。先睡吧，醒来就会有食物。
    - id: ch05
      title: 海豹归来
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: >-
            他们醒来时，小岛北岸有了开阔水面，所有松动的冰全被推向陆地。浪涛第一声拍击，是因纽特人最爱听的声音之一，因为那意味着春天已经上路。科图科和女孩握住彼此的手，相视而笑。海浪在冰块之间发出清晰而饱满的轰鸣，让他们想起捕鲑鱼和追驯鹿的季节，也想起贴地柳树开花的气味。他们还在望着，严寒便让浮冰之间结起一层薄冰。可地平线上出现了浩大的红光，那是沉在天际下面的太阳发出的光。与其说他们看见太阳升起，不如说听见它在睡梦里打了个哈欠。红光只停留几分钟，却说明一年已经转向。他们觉得，再没有什么能改变这一点。
        - id: ch05-b02
          speaker: narrator
          text: >-
            科图科找到两条狗时，它们正在争夺一头刚咬死的海豹。风暴总会搅乱鱼群，那头海豹正是追着鱼游来的。当天先后有二三十头海豹爬上小岛，它只是第一头。海面再次冻牢以前，浅浅的开阔水里出现了数百颗机警的黑脑袋。海豹在那里欢腾，也随着一块块浮冰到处漂动。
        - id: ch05-b03
          speaker: narrator
          text: >-
            再次吃到海豹肝，实在痛快。把鲸脂毫不吝惜地装满油灯，看火焰一直蹿到三英尺高，也同样痛快。可新生海冰刚能承受人的重量，两人便装满手橇，催两条狗使出一生最大的力气，因为他们害怕村里出了事。天气仍像往常一样无情，但拉着一橇好食物，总比饿着肚子四处打猎容易。他们把二十五头海豹埋在海滩冰层里，全都预备妥当，随时可以取用，然后匆匆赶回族人身边。
        - id: ch05-b04
          speaker: narrator
          text: >-
            科图科一让两条狗明白自己要它们做什么，它们立刻开始带路。四周明明没有地标，两天后，它们却已在卡德卢家外放声叫喊。只有三条狗回应，其余的都被人吃了，所有雪屋也一片漆黑。科图科高喊“奥约”，也就是熟肉。微弱的人声立刻应了起来。他又清清楚楚地挨个叫出全村人的名字，一一点名。一个也没少。
        - id: ch05-b05
          speaker: narrator
          text: >-
            一小时后，卡德卢家的灯熊熊燃烧。融化的雪水正在加热，锅里的肉汤开始咕嘟作响，屋顶积雪也滴下水来。阿莫拉克忙着给全村准备饭食。兜帽里的男婴啃着一条油润、带坚果香的鲸脂。猎手们不慌不忙，有条不紊地往肚里填海豹肉，一直吃到再也容不下一口。科图科和女孩讲完一路经历。两条狗坐在他们中间，每听到自己的名字，便各自竖起一只耳朵，看上去羞愧透顶。因纽特人说，疯过又痊愈的狗，从此再不会发病。
        - id: ch05-b06
          speaker: kotuko
          text: >-
            托纳克没有忘记我们。风暴吹来，冰层裂开，海豹追着受惊的鱼游进来了。新的海豹孔离这里不到两天。好猎手们明天去吧，把我埋在冰里的二十五头海豹带回来。吃完以后，我们全都跟着海豹搬到浮冰上。
        - id: ch05-b07
          speaker: angekok
          text: >-
            那么，你自己要做什么？
        - id: ch05-b08
          speaker: narrator
          text: >-
            巫师说这句话时，用的是他同图努尼尔米乌特最富有的人，也就是卡德卢说话时的口气。卡德卢看看北方女孩，平静地指向自家雪屋的西北侧。按照他们的规矩，成婚的儿子或女儿总住在那边。
        - id: ch05-b09
          speaker: kadlu
          text: >-
            我们要在那边造一座屋子。
        - id: ch05-b10
          speaker: narrator
          text: >-
            女孩把双手翻过来，掌心向上，绝望地轻轻摇头。她是个外乡人，饿得半死时才被人收留，什么持家的东西也拿不出来。阿莫拉克立刻从睡榻上跳起，把东西一件件塞进她怀里。有石灯、铁制刮皮刀、铁皮锅、用麝牛牙绣花的鹿皮，还有水手才用得上的真正帆布针。这是北极圈遥远边缘上，所赠出过的最丰厚嫁妆。北方来的女孩把头一直低到地面。
        - id: ch05-b11
          speaker: kotuko
          text: >-
            还有它们两个！
          emotion: happy
        - id: ch05-b12
          speaker: narrator
          text: >-
            他笑着招手，两条狗把冰凉的鼻吻凑到女孩脸上。安格库克煞有介事地咳了一声，仿佛早已想透一切。
        - id: ch05-b13
          speaker: angekok
          text: >-
            科图科一离村，我就到歌唱屋施法。我唱了一个又一个长夜，召唤驯鹿之灵。是我的歌引来狂风，劈开冰层。冰快压碎科图科时，也是我的歌把两条狗引到他身旁。海豹会游进碎冰后面，也是因为我的歌。我的身体虽然躺在夸吉里，灵魂却跑遍冰原，指引科图科和狗做成每一件事。这些全是我做的。
        - id: ch05-b14
          speaker: narrator
          text: >-
            人人都吃得饱饱的，困得睁不开眼，便没有谁开口反驳。安格库克凭着自己的巫师身份，又拿了一大块熟肉。随后，他同大家一起，在这个温暖、明亮、满是油脂气味的家里躺下，很快便睡着了。
    - id: ch06
      title: 象牙上的故事
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: >-
            科图科很会用因纽特人的方式画画。他找来一片又长又平、一端钻孔的象牙，把这些历险全都刻在上面。到了那个“奇异暖冬”之年，他和女孩一起北上埃尔斯米尔陆地，把这幅图画故事留给了卡德卢。一个夏天，卡德卢的狗拉雪橇在尼科西林的内提灵湖岸边坏了，他把象牙遗失在卵石滩上。
        - id: ch06-b02
          speaker: narrator
          text: >-
            第二年春天，一名湖区因纽特人捡到它，卖给伊米根的一个男人。那人在坎伯兰海峡的一艘捕鲸船上当翻译，后来又把象牙卖给汉斯·奥尔森。奥尔森后来在一艘大轮船上当舵工，那条船专门载着游客前往挪威北角。旅游季结束以后，轮船便改跑伦敦到澳大利亚的航线，途中还会停靠锡兰。奥尔森在那里把象牙卖给一名僧伽罗珠宝商，换回两颗假蓝宝石。后来，我在科伦坡一所房子的杂物底下找到了这片象牙。上面的画从钻孔的一端排到另一端，一幅接着一幅。我便照着那些刻痕，把科图科、北方女孩、两条狗和冰原上的全部故事，从头到尾，完完整整翻译了出来。
