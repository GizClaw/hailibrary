audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: "measured, vivid, and storywise"
        timbre: "warm and resonant"
        pace: "unhurried"
        pitch: "medium-low"
    mowgli:
      display_name: Mowgli
      tts:
        delivery: "bold, curious, and quick"
        timbre: "clear and youthful"
        pace: "lively"
        pitch: "medium-high"
    kaa:
      display_name: Kaa
      tts:
        delivery: "ancient, dry, and quietly amused"
        timbre: "deep and smooth"
        pace: "slow"
        pitch: "low"
    bagheera:
      display_name: Bagheera
      tts:
        delivery: "smooth, controlled, and sly"
        timbre: "dark and velvety"
        pace: "measured"
        pitch: "low"
    passing_cobra:
      display_name: Passing Cobra
      tts:
        delivery: "brief and courteous"
        timbre: "soft and sibilant"
        pace: "quick"
        pitch: "medium"
    white_cobra:
      display_name: White Cobra
      tts:
        delivery: "proud, ancient, and venomous"
        timbre: "dry and rasping"
        pace: "deliberate"
        pitch: "low"
  chapters:
    - id: ch01
      title: "Kaa's New Skin"
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: "There are four things that have never had enough since the first dew fell: Jacala's mouth, the Kite's hunger, the Ape's hands, and the Eyes of Man. So says the Jungle."
        - id: ch01-b02
          speaker: narrator
          text: "Kaa, the great Rock Python, had shed his skin for perhaps the two-hundredth time since his birth. Mowgli came to congratulate him, for he never forgot how Kaa had saved his life during that night at Cold Lairs. A snake is gloomy and miserable while his old skin loosens. That mood lasts until the new coat begins to shine and show its beauty. Kaa no longer made jokes about Mowgli. Like the other Jungle People, he accepted the boy as Master of the Jungle. He also brought him every scrap of news that a python of his size could hear. Kaa knew nearly everything about what the animals called the Middle Jungle. That was the life close to the earth or underneath it, among boulders, burrows, and hollow tree trunks. What he did not know could have been written on his smallest scale."
        - id: ch01-b03
          speaker: narrator
          text: "That afternoon Mowgli sat inside the circle of Kaa's huge coils. He turned the old skin in his hands and felt the dry, broken flakes. The whole empty covering lay looped and twisted among the rocks exactly where Kaa had left it. With great courtesy, the python had packed his own body beneath Mowgli's broad bare shoulders. The boy was resting in a living chair."
        - id: ch01-b04
          speaker: mowgli
          text: "Even the scales over the eyes came away whole. It must be strange to see the skin of your own head lying at your feet."
        - id: ch01-b05
          speaker: kaa
          text: "I have no feet. And all my people shed their skins, so there is nothing strange in it. Does your skin never grow old and rough?"
        - id: ch01-b06
          speaker: mowgli
          text: "Then I wash, Flathead. Still, in the hottest weather, I have wished I could slip out of my skin without pain and run about skinless."
        - id: ch01-b07
          speaker: kaa
          text: "I wash and shed my skin. Now tell me how the new coat looks."
        - id: ch01-b08
          speaker: narrator
          text: "Mowgli stroked the slanting checks along Kaa's enormous back."
        - id: ch01-b09
          speaker: mowgli
          text: "The Turtle's back is harder, but not so bright. The Frog is brighter, but not so hard. Your skin is beautiful, like the colors inside a lily."
        - id: ch01-b10
          speaker: kaa
          text: "It needs water. A new skin never shows its full color before the first bath. Let us go."
        - id: ch01-b11
          speaker: mowgli
          text: "I'll carry you."
        - id: ch01-b12
          speaker: narrator
          text: "Laughing, Mowgli bent over and tried to lift the thickest part of Kaa's body. A grown man might as well have tried to heave up a water pipe two feet across. Kaa did not help him. He lay still and puffed quietly with amusement. Then their usual evening game began. The boy was full of his new strength, and the python looked splendid in his rich new skin. They stood against each other for a wrestling match that tested both quick eyes and strong bodies. Kaa could have crushed a dozen Mowglis if he had let his power loose, but he played carefully and never used a tenth of it. Since Mowgli had grown strong enough for rough handling, Kaa had taught him this game. Nothing else kept the boy's limbs so supple."
        - id: ch01-b13
          speaker: narrator
          text: "Sometimes the moving coils wrapped Mowgli to the throat while he fought to free one arm and catch Kaa by the neck. Kaa would suddenly go limp. Then Mowgli used both quick feet to pin the great tail as it searched behind him for a rock or stump. They swayed head to head, waiting for an opening, until the still shape burst into black-and-yellow coils, kicking legs, and grasping arms."
        - id: ch01-b14
          speaker: kaa
          text: "Now, now! Watch me, Little Brother. I touch you here, and here. Are your hands numb? Here I come again!"
        - id: ch01-b15
          speaker: narrator
          text: "The match ended as it always did. Kaa drove his head straight forward with one hard blow and sent Mowgli rolling over and over. The boy had never learned to guard against that lightning stroke. Kaa always told him there was not the slightest use in trying."
        - id: ch01-b16
          speaker: kaa
          text: "Good hunting!"
        - id: ch01-b17
          speaker: narrator
          text: "Mowgli landed several yards away, laughing and gasping, with grass between his fingers. He got up and followed Kaa to the wise snake's favorite bathing place. It was a deep, pitch-black pool, shut in by rocks, with old tree stumps sunk below the surface. Mowgli slipped into the water in the Jungle way, without making a sound. He dived across the pool and rose just as quietly. Then he floated on his back with his arms behind his head. The moon climbed above the rocks, and he broke its reflection into pieces with his toes. Kaa's diamond-shaped head cut across the pool like a razor and came to rest on Mowgli's shoulder. They lay still together, enjoying the cool water."
        - id: ch01-b18
          speaker: mowgli
          text: "This is very good. In the Man-Pack, they would lie on hard wooden things inside a mud trap. They would shut out every clean wind, pull foul cloth over their heavy heads, and make ugly songs through their noses. The Jungle is better."
        - id: ch01-b19
          speaker: narrator
          text: "A cobra hurried down the rocks, drank, and slipped away."
        - id: ch01-b20
          speaker: passing_cobra
          text: "Good hunting!"
        - id: ch01-b21
          speaker: kaa
          text: "Hss! Little Brother, has the Jungle given you everything you ever wanted?"
        - id: ch01-b22
          speaker: mowgli
          text: "Not everything. If it had, there would be a new, strong Shere Khan for me to kill every moon, and I would need no buffaloes to help me. I've wished for sun during the Rains and rain in the deepest summer. When I was hungry, I wished for a goat. When I killed a goat, I wished it had been a buck, and when I killed a buck, I wished for a nilghai. We all feel that way."
        - id: ch01-b23
          speaker: kaa
          text: "And you have no other wish?"
        - id: ch01-b24
          speaker: mowgli
          text: "What else could I want? The Jungle is mine, and the Jungle favors me. Is there anything more between sunrise and sunset?"
        - id: ch01-b25
          speaker: kaa
          text: "There was something the Cobra said..."
        - id: ch01-b26
          speaker: mowgli
          text: "Which cobra? The one that just left said nothing. He was hunting."
        - id: ch01-b27
          speaker: kaa
          text: "Another one."
        - id: ch01-b28
          speaker: mowgli
          text: "Do you often deal with the Poison People? I leave them to their own paths. They are so small, yet they carry death in one front tooth. What sort of hood did you meet?"
        - id: ch01-b29
          speaker: narrator
          text: "Kaa rolled slowly in the water."
        - id: ch01-b30
          speaker: kaa
          text: "Three or four moons ago, I hunted at Cold Lairs. My prey fled past the tanks, through the house whose wall I broke for you, and down into the earth."
        - id: ch01-b31
          speaker: mowgli
          text: "But the Monkey People don't live in holes underground."
        - id: ch01-b32
          speaker: kaa
          text: "This creature was hardly living, though it was trying to. It entered a long tunnel. I followed, killed it, and slept. When I woke, I went farther."
        - id: ch01-b33
          speaker: mowgli
          text: "Under the ground?"
        - id: ch01-b34
          speaker: kaa
          text: "Yes. At last I found a White Hood. He told me things I did not understand and showed me things I had never seen."
        - id: ch01-b35
          speaker: mowgli
          text: "Was it new game? Was the hunting good?"
        - id: ch01-b36
          speaker: kaa
          text: "It was not game. It would have broken every tooth in my head. But the White Hood said a man would give the breath beneath his ribs merely to see those things."
        - id: ch01-b37
          speaker: mowgli
          text: "Then we'll go and look. I remember now that I was once a man."
        - id: ch01-b38
          speaker: kaa
          text: "Slowly, slowly. Haste killed the Yellow Snake that ate the sun. I told the White Hood about you and said you were a man. He is as old as the Jungle. He said he had not seen a man for a long time. He invited you to come, because men would die for even the smallest thing there."
        - id: ch01-b39
          speaker: mowgli
          text: "That must mean new game. But the Poison People never tell us when game is near. They are unfriendly folk."
        - id: ch01-b40
          speaker: kaa
          text: "It is not game. I cannot tell you what it is."
        - id: ch01-b41
          speaker: mowgli
          text: "We'll go. I've never seen a White Hood, and I want to see the other things. Did he kill them?"
        - id: ch01-b42
          speaker: kaa
          text: "They are dead things. He says he guards them all."
        - id: ch01-b43
          speaker: mowgli
          text: "Then he guards them as a wolf guards meat in his den. Come on."
    - id: ch02
      title: "The King's Treasure"
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: "Mowgli swam ashore and rolled on the grass until he was dry. Then he and Kaa set out for Cold Lairs, the deserted city. Mowgli no longer feared the Monkey People in the least. The Monkey People, however, were terrified of him. Their tribes were away raiding that night, so the whole ruined city stood empty and silent in the moonlight. Kaa led Mowgli up to the remains of the queens' pavilion on the terrace. He slid over the rubble and disappeared down a half-blocked staircase that began in the center of the pavilion and went underground. Mowgli called out the snake greeting and followed on his hands and knees."
        - id: ch02-b02
          speaker: mowgli
          text: "We are of one blood, you and I."
        - id: ch02-b03
          speaker: narrator
          text: "They crawled a long way through the sloping passage. It turned and twisted several times as it carried them deep underground. At last they reached a place where the root of a great tree had pushed one solid stone out of the wall. The tree itself grew thirty feet above their heads. Kaa and Mowgli squeezed through the opening and entered a broad vault. Tree roots had broken through its domed roof as well, and a few narrow streaks of light dropped into the darkness."
        - id: ch02-b04
          speaker: mowgli
          text: "This den is safe, but too far away for daily visits. Now, what are we meant to see?"
        - id: ch02-b05
          speaker: white_cobra
          text: "Do you see nothing when you look at me?"
        - id: ch02-b06
          speaker: narrator
          text: "A voice answered from the middle of the vault. Something white stirred there, then rose little by little into the largest cobra Mowgli had ever seen. The creature was nearly eight feet long. So many years in darkness had bleached it the color of old ivory. Even the spectacle marks on its spread hood had faded to a weak yellow. Its eyes shone as red as rubies. Altogether, it was the strangest and most wonderful snake Mowgli had ever faced."
        - id: ch02-b07
          speaker: mowgli
          text: "Good hunting!"
        - id: ch02-b08
          speaker: white_cobra
          text: "What news of the great walled city? Does the city of a hundred elephants, twenty thousand horses, and cattle beyond counting still stand? Does the King of Twenty Kings still rule? I have grown deaf down here, and it has been long since I heard the war gongs."
        - id: ch02-b09
          speaker: mowgli
          text: "There is only Jungle above us. Of elephants, I know Hathi and his sons. Bagheera killed all the horses in one village. And what is a king?"
        - id: ch02-b10
          speaker: kaa
          text: "I told you four moons ago that your city was gone."
        - id: ch02-b11
          speaker: white_cobra
          text: "The great forest city can never vanish. The King's towers guard its gates. It was built before my father's father broke his egg, and it will stand when my sons' sons are as white as I am. Salomdhi, son of Chandrabija, son of Viyeja, son of Yegasuri, built it in the days of Bappa Rawal. Whose cattle are you?"
        - id: ch02-b12
          speaker: mowgli
          text: "The trail is lost, Kaa. I don't understand him."
        - id: ch02-b13
          speaker: kaa
          text: "Nor do I. He is very old. Father of Cobras, there is nothing here but Jungle, as there has been since the beginning."
        - id: ch02-b14
          speaker: white_cobra
          text: "Then who is this boy who sits before me without fear? He does not know the King's name, yet he speaks our language with a man's lips. Who carries both a knife and a snake's tongue?"
        - id: ch02-b15
          speaker: mowgli
          text: "They call me Mowgli. I belong to the Jungle. The wolves are my people, and Kaa is my brother. Father of Cobras, who are you?"
        - id: ch02-b16
          speaker: white_cobra
          text: "I am the Warden of the King's Treasure. Kurrun Raja built the stone chamber above me when my skin was dark. I was placed here to bring death to thieves. They lowered the treasure through the stone while my Brahmin masters sang."
        - id: ch02-b17
          speaker: mowgli
          text: "Hmm. I met a Brahmin once among the Man-Pack. I know what I know. There is a little evil here."
        - id: ch02-b18
          speaker: white_cobra
          text: "The stone has opened five times since I came, always to lower more treasure and never to remove any. Here lie the riches of a hundred kings. But no one has opened it for many years. Perhaps my city has forgotten."
        - id: ch02-b19
          speaker: kaa
          text: "There is no city. Look above you. Great roots are tearing the stones apart. Trees and men cannot grow in the same place."
        - id: ch02-b20
          speaker: white_cobra
          text: "Men have found their way here two or three times. They groped in the darkness, and when I reached them, they cried only briefly. Now Man and Snake come with lies and say my city is dead and my watch is over. Men change very little, and I never change! Until the Brahmins return with their songs and warm milk and carry me back into the light, I alone am Warden of the King's Treasure. If the city is dead, bend down and take whatever you wish. Nothing on earth equals this treasure. If you leave alive, Man with the snake's tongue, lesser kings will serve you."
          emotion: angry
        - id: ch02-b21
          speaker: mowgli
          text: "The trail is lost again. Perhaps a jackal dug down here and bit this great White Hood. He must be mad. Father of Cobras, I see nothing worth taking."
        - id: ch02-b22
          speaker: white_cobra
          text: "The madness of death is on you! Before your eyes close, I grant you one favor. Look and see what no man has seen before."
          emotion: angry
        - id: ch02-b23
          speaker: mowgli
          text: "No one in the Jungle speaks to Mowgli about favors. Still, darkness changes everyone. If it pleases you, I will look."
        - id: ch02-b24
          speaker: narrator
          text: "Mowgli narrowed his eyes and lifted a handful of glittering pieces from the floor."
        - id: ch02-b25
          speaker: mowgli
          text: "This looks like the stuff the Man-Pack plays with, except theirs was brown and this is yellow."
        - id: ch02-b26
          speaker: narrator
          text: "He let the coins trickle from his hand and walked on. The whole floor lay buried beneath five or six feet of gold and silver money. Long ago, the coins had burst from the sacks that held them. Over the years the metal had settled and packed together like sand at low tide. Rich objects rose through it like wrecks rising through a beach. There were elephant seats of embossed silver, plated with hammered gold and set with carbuncles and turquoises. There were royal litters built from silver and enamel, with poles of jade and rings of amber for their curtains. Golden candlesticks stood among them. Pierced emeralds hanging from their branches trembled whenever the air moved. Five-foot statues of forgotten gods watched with jeweled eyes from silver faces."
        - id: ch02-b27
          speaker: narrator
          text: "Coats of steel mail were inlaid with gold and fringed with seed pearls that had rotted black. Helmets carried crests and beads of dark red rubies. Shields made from lacquer, tortoise shell, and rhinoceros hide had bosses of red gold and emeralds around their edges. Bundles of swords, daggers, and hunting knives had diamond-studded handles. Golden bowls and ladles for sacrifices lay beside small altars shaped for secret rites. There were jade cups, bracelets, incense burners, combs, and embossed gold jars for perfume, henna, and eye powder. Nose rings, arm rings, headbands, finger rings, and girdles lay beyond counting. Some belts were seven fingers wide and covered with square diamonds and rubies. The wood had crumbled away from iron-bound chests, exposing heaps of raw star sapphires, opals, cat's-eyes, blue sapphires, rubies, diamonds, emeralds, and garnets. Centuries of war, plunder, trade, and taxes had filled the vault. No amount of ordinary money could have paid for it. The coins alone were priceless, even before anyone counted the gems. The gold and silver by themselves weighed two or three hundred tons."
        - id: ch02-b28
          speaker: narrator
          text: "Mowgli understood none of the treasure's value. The knives interested him for a moment, but none balanced as well as his own knife, so he dropped them. At last he found something that truly held his attention. It lay across the front of an elephant seat that was half buried in coins. The object was a three-foot elephant goad called an ankus, shaped somewhat like a small boat hook. A single round, shining ruby crowned the top. Eight inches of the handle below it were packed with rough turquoises, making a firm grip for the hand. A band of cool green jade came next, carved with a pattern of flowers. Emeralds formed the leaves, and rubies made the blossoms. The long shaft beneath was pure ivory. Its steel point and hook were inlaid with gold pictures showing men catching elephants. Those pictures interested Mowgli most, because he saw that they had something to do with his friend Hathi the Silent."
        - id: ch02-b29
          speaker: white_cobra
          text: "Was the sight not worth dying for? Have I not given you a great favor?"
        - id: ch02-b30
          speaker: mowgli
          text: "I don't understand. These things are hard and cold, and none can be eaten. But I want to take this pointed thing into the sunlight. You say everything here is yours. Give it to me, and I'll bring you frogs to eat."
        - id: ch02-b31
          speaker: narrator
          text: "The White Cobra trembled with wicked delight."
        - id: ch02-b32
          speaker: white_cobra
          text: "Certainly. I give you everything here, until you try to leave."
        - id: ch02-b33
          speaker: mowgli
          text: "But I am leaving now. This place is dark and cold, and I want to carry the pointed thing into the Jungle."
        - id: ch02-b34
          speaker: white_cobra
          text: "Look beside your foot. What lies there?"
        - id: ch02-b35
          speaker: narrator
          text: "Mowgli picked up something white and smooth."
        - id: ch02-b36
          speaker: mowgli
          text: "It is the bone from a man's head. There are two more over here."
        - id: ch02-b37
          speaker: white_cobra
          text: "Long ago, those men came to carry away the treasure. I spoke to them in the dark, and soon they lay still."
        - id: ch02-b38
          speaker: mowgli
          text: "I have no need for treasure. Give me the ankus, and good hunting. Keep it, and good hunting all the same. I don't fight the Poison People, and I know your tribe's Master-word."
        - id: ch02-b39
          speaker: white_cobra
          text: "There is only one Master-word here, and it belongs to me!"
          emotion: angry
        - id: ch02-b40
          speaker: narrator
          text: "Kaa flung himself forward, his eyes blazing."
        - id: ch02-b41
          speaker: kaa
          text: "Who told me to bring the Man here?"
        - id: ch02-b42
          speaker: white_cobra
          text: "I did. It has been long since I saw a man, and this one speaks our tongue."
        - id: ch02-b43
          speaker: kaa
          text: "You said nothing about killing him. How could I return to the Jungle and say I led him to his death?"
        - id: ch02-b44
          speaker: white_cobra
          text: "I speak of killing only when the time comes. As for whether you return, the hole is there. Be still, fat monkey-killer! One touch upon your neck, and the Jungle will forget you. No man has entered this place and left with breath beneath his ribs. I am Warden of the Treasure of the King's City!"
          emotion: angry
        - id: ch02-b45
          speaker: kaa
          text: "White worm of the darkness, there is no king and no city. The Jungle surrounds us!"
          emotion: angry
        - id: ch02-b46
          speaker: white_cobra
          text: "The treasure remains. Wait, Kaa of the Rocks, and watch the boy run. There is room here for fine sport. Run back and forth for me, boy. Life is good!"
        - id: ch02-b47
          speaker: narrator
          text: "Mowgli calmly laid one hand on Kaa's head."
        - id: ch02-b48
          speaker: mowgli
          text: "This white creature knows only men of the Man-Pack. He does not know me. He asked for a hunt, so let him have one."
        - id: ch02-b49
          speaker: narrator
          text: "Mowgli had held the ankus with its point downward. Now he flung it behind the cobra's hood and pinned him to the floor. Kaa dropped his weight across the writhing body, holding it helpless from hood to tail. The White Cobra's red eyes burned, and the few free inches of his head struck wildly from side to side."
        - id: ch02-b50
          speaker: kaa
          text: "Kill him!"
          emotion: angry
        - id: ch02-b51
          speaker: mowgli
          text: "No. I will never kill again except for food. But look, Kaa."
        - id: ch02-b52
          speaker: narrator
          text: "Mowgli drew his knife, caught the cobra behind the hood, and forced open his mouth. The deadly fangs lay black and withered in the gums. The old snake had outlived his poison."
        - id: ch02-b53
          speaker: mowgli
          text: "Thuu. Dried up."
        - id: ch02-b54
          speaker: narrator
          text: "He waved Kaa aside, lifted the ankus, and freed the White Cobra."
        - id: ch02-b55
          speaker: mowgli
          text: "The King's Treasure needs a new warden. You have done badly, Thuu. Now run back and forth and make sport for us."
        - id: ch02-b56
          speaker: white_cobra
          text: "I am ashamed. Kill me!"
        - id: ch02-b57
          speaker: mowgli
          text: "There has been enough talk of killing. We are leaving. I will take the pointed thing because I fought you and won it."
        - id: ch02-b58
          speaker: white_cobra
          text: "Then see that it does not kill you. It is Death! It holds enough death for every man in my city. You will not keep it long, nor will the man who takes it from you. They will kill and kill and kill to possess it. My strength is gone, but the ankus will do my work. It is Death! Death! Death!"
          emotion: angry
        - id: ch02-b59
          speaker: narrator
          text: "Mowgli crawled back through the hole and into the passage. As he left, he looked once more into the vault. The White Cobra was striking furiously at the still golden faces of the gods scattered on the floor. His useless fangs could do them no harm. Again and again, his dry voice hissed after Mowgli that the ankus was Death."
    - id: ch03
      title: "The Red-Eyed Thorn"
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: "Kaa and Mowgli were glad when they reached daylight again. They made their way back to their own Jungle. There Mowgli held the ankus in the morning sun and turned it until the jewels flashed. The sight delighted him almost as much as finding a bunch of fresh flowers to put in his hair."
        - id: ch03-b02
          speaker: mowgli
          text: "It shines brighter than Bagheera's eyes. I'll show it to him. But what did Thuu mean by calling it Death?"
        - id: ch03-b03
          speaker: kaa
          text: "I do not know. I am sorry all the way to my tail's tail that he never felt your knife. Evil always lives at Cold Lairs, above the earth or below it. Now I am hungry. Will you hunt with me this dawn?"
        - id: ch03-b04
          speaker: mowgli
          text: "No. Bagheera must see this. Good hunting!"
        - id: ch03-b05
          speaker: narrator
          text: "Mowgli danced away through the Jungle, swinging the great ankus. Every little while he stopped and held it up so he could admire it again. At last he reached the part of the Jungle where Bagheera usually hunted. He found the panther drinking after a heavy kill. Mowgli settled down and told him the whole adventure from the beginning, including Kaa's visit to the underground passage, the treasure, and the fight with the White Cobra. From time to time Bagheera leaned forward and sniffed the ankus. When Mowgli repeated the White Cobra's final warning about death, the panther gave an approving purr."
        - id: ch03-b06
          speaker: mowgli
          text: "So the White Hood told the truth?"
        - id: ch03-b07
          speaker: bagheera
          text: "I was born in the King's cages at Oodeypore, so I know something of men. Many men would kill three times in one night for that large red stone alone."
        - id: ch03-b08
          speaker: mowgli
          text: "But the stone only makes this heavy. My little bright knife is better, and the red stone cannot be eaten. Why would men kill for it?"
        - id: ch03-b09
          speaker: bagheera
          text: "Go to sleep, Mowgli. You lived among men, and you should remember."
        - id: ch03-b10
          speaker: mowgli
          text: "I do remember. Men kill when they are not hunting. They kill from idleness and pleasure. Wake up, Bagheera. What was this pointed thing made for?"
        - id: ch03-b11
          speaker: narrator
          text: "Bagheera opened his sleepy eyes halfway, and a cruel little gleam appeared in them."
        - id: ch03-b12
          speaker: bagheera
          text: "Men made it to drive into the heads of Hathi's sons until blood runs. I saw such things in the streets of Oodeypore, outside our cages. This one has tasted the blood of many elephants."
        - id: ch03-b13
          speaker: mowgli
          text: "Why do men stab elephants in the head?"
        - id: ch03-b14
          speaker: bagheera
          text: "To teach them Man's Law. Men have no claws or fangs, so they make tools like this, and worse ones too."
        - id: ch03-b15
          speaker: mowgli
          text: "Blood follows me whenever I come near things made by the Man-Pack. First there was Messua's blood on the ropes, and now there is Hathi's blood on this. If I had known, I would never have taken it. I will not use it. Look!"
          emotion: disgusted
        - id: ch03-b16
          speaker: narrator
          text: "Mowgli hurled the sparkling ankus. It flew thirty yards and buried its point in the earth between the trees."
        - id: ch03-b17
          speaker: mowgli
          text: "Now my hands are clean of Death. Thuu said Death would follow me, but he is old, white, and mad."
        - id: ch03-b18
          speaker: bagheera
          text: "White or black, death or life, I am going to sleep. I cannot hunt all night and howl all day, as certain people do."
        - id: ch03-b19
          speaker: narrator
          text: "Bagheera went away to a hunting den he knew, nearly two miles off. Mowgli chose a convenient tree and climbed it easily. He knotted three or four creepers together and, in less time than it takes to tell, made himself a hammock fifty feet above the ground. Strong daylight did not truly trouble him, but he followed the habit of his Jungle friends and used as little of it as possible. He slept through the day among the very loud people that live in the treetops. When he woke, twilight had returned, and he had been dreaming about the beautiful stones he had thrown away."
        - id: ch03-b20
          speaker: mowgli
          text: "At least I'll look at it once more."
        - id: ch03-b21
          speaker: narrator
          text: "He slid down a creeper, but Bagheera had arrived first. Mowgli heard him sniffing through the half-light."
        - id: ch03-b22
          speaker: mowgli
          text: "Where is the pointed thing?"
        - id: ch03-b23
          speaker: bagheera
          text: "A man took it. Here is his trail."
        - id: ch03-b24
          speaker: mowgli
          text: "Now we'll learn whether Thuu spoke the truth. If the thing is Death, this man will die. Let us follow him."
        - id: ch03-b25
          speaker: bagheera
          text: "First we eat. An empty stomach makes the eyes careless. Men move slowly, and this wet Jungle will keep even the faintest track."
        - id: ch03-b26
          speaker: narrator
          text: "They hunted as soon as they could. Even so, nearly three hours passed before they finished their meat, drank, and finally bent over the trail. The Jungle People know very well that nothing can make up for being hurried over a meal."
    - id: ch04
      title: "Six Deaths in a Night"
      blocks:
        - id: ch04-b01
          speaker: mowgli
          text: "Do you think the pointed thing will turn in the man's hand and kill him? Thuu called it Death."
        - id: ch04-b02
          speaker: bagheera
          text: "We will know when we find him. Only one man passed here. The weight he carried drove his heels deep into the ground."
        - id: ch04-b03
          speaker: mowgli
          text: "The marks are as clear as summer lightning."
        - id: ch04-b04
          speaker: narrator
          text: "They settled into the short, quick trail-trot used by the Jungle People. In and out they ran through the checkered patches of moonlight, never losing the marks left by the man's two bare feet. The trail lay clear in the wet ground. Bagheera kept his dark head low while Mowgli read the shape of every toe and heel."
        - id: ch04-b05
          speaker: mowgli
          text: "Now he is running. His toes spread wide. But why did he turn aside here?"
        - id: ch04-b06
          speaker: bagheera
          text: "Wait."
        - id: ch04-b07
          speaker: narrator
          text: "The tracks crossed wet ground, then suddenly stopped making sense. A hunter must be careful at such a place. If he walks around searching, his own feet destroy the very marks he needs. The right way is to cast forward in one clean leap and leave the ground around the last print untouched. Bagheera gathered himself, sprang as far as he could, and landed well ahead. Then he turned to face Mowgli."
        - id: ch04-b08
          speaker: bagheera
          text: "A second trail meets his here. This foot is smaller, and the toes point inward."
        - id: ch04-b09
          speaker: narrator
          text: "Mowgli ran up and studied the marks."
        - id: ch04-b10
          speaker: mowgli
          text: "A Gond hunter made them. His bow dragged across the grass. That is why the first man turned away so quickly. Big Foot hid from Little Foot."
        - id: ch04-b11
          speaker: bagheera
          text: "Yes. We must not cross the tracks and spoil them. I will follow Big Foot. You take Little Foot, the Gond."
        - id: ch04-b12
          speaker: narrator
          text: "Bagheera sprang back to the first trail without touching the second one. Mowgli remained bent over the curious narrow footprints of the small forest hunter. From then on, they acted out the movements of the two men, each calling what his own set of tracks revealed."
        - id: ch04-b13
          speaker: bagheera
          text: "I am Big Foot. I turn aside, hide behind this rock, and stand without moving. Call your trail, Little Brother."
        - id: ch04-b14
          speaker: mowgli
          text: "I am Little Foot. I reach the rock and sit beneath it, leaning on my right hand with my bow between my toes. I wait a long time. My feet have pressed deeply into the earth."
        - id: ch04-b15
          speaker: bagheera
          text: "I wait too, hidden behind the rock. I rest the pointed thing on this stone, and it slips. Here is the scratch. Call your trail."
        - id: ch04-b16
          speaker: mowgli
          text: "Two twigs and one large branch are broken. Now I understand. Little Foot walks away, stamping and making noise so Big Foot will hear him. I go toward the falling water, where its noise hides mine. Then I stop and wait. Call your trail, Big Foot!"
        - id: ch04-b17
          speaker: narrator
          text: "Bagheera searched in every direction to discover how Big Foot had moved away from behind the rock. He kept clear of the marks already found and tested the ground ahead until the man's hurried path showed itself."
        - id: ch04-b18
          speaker: bagheera
          text: "I crawl out on my knees, dragging the pointed thing. I see no one, so I run. Big Foot runs fast, and his trail is plain. Now we each follow our own track."
        - id: ch04-b19
          speaker: narrator
          text: "Bagheera swept forward along the larger, deeply marked footprints. Mowgli kept to the narrow steps of the Gond. For some time the two trackers moved separately through the silent Jungle. Each followed a different man, and neither allowed his own path to cross the other's trail."
        - id: ch04-b20
          speaker: bagheera
          text: "Where are you, Little Foot?"
        - id: ch04-b21
          speaker: narrator
          text: "Mowgli answered from less than fifty yards away. Bagheera gave a deep cough."
        - id: ch04-b22
          speaker: bagheera
          text: "The trails run side by side, and the men are drawing closer."
        - id: ch04-b23
          speaker: narrator
          text: "They raced for another half mile. The two trails ran almost side by side and drew steadily nearer, while Mowgli and Bagheera kept about the same distance apart. Mowgli's head rode higher than the panther's, so he was the first to see where the paths joined. He called across the trees."
        - id: ch04-b24
          speaker: mowgli
          text: "They met here. Little Foot knelt on this rock. And there lies Big Foot."
        - id: ch04-b25
          speaker: narrator
          text: "Not ten yards ahead, the villager from the district lay stretched across a pile of broken rocks. A long Gond arrow, feathered with small feathers, had entered through his back and passed out through his chest. Big Foot's flight had ended there."
        - id: ch04-b26
          speaker: bagheera
          text: "Was Thuu truly old and mad, Little Brother? Here is one death."
        - id: ch04-b27
          speaker: mowgli
          text: "Keep following. But where is the red-eyed thorn that drank elephant blood?"
        - id: ch04-b28
          speaker: bagheera
          text: "Little Foot must have it. Only one trail leaves here."
        - id: ch04-b29
          speaker: narrator
          text: "One trail left the body. It belonged to a light man who had run quickly while carrying a burden on his left shoulder. The tracks wound around a long, low ridge of dried grass. To Mowgli and Bagheera's sharp eyes, every footprint seemed marked in hot iron. They followed in silence until the trail climbed into a ravine and reached the ashes of a campfire hidden there."
        - id: ch04-b30
          speaker: bagheera
          text: "Again!"
        - id: ch04-b31
          speaker: narrator
          text: "Bagheera stopped so sharply that he might have turned to stone. The little, thin Gond hunter lay dead with both feet among the ashes. Bagheera looked at Mowgli and waited for the boy to read what had happened."
        - id: ch04-b32
          speaker: mowgli
          text: "A bamboo club did this. I used one among the buffaloes when I lived with the Man-Pack. Father of Cobras, I am sorry I mocked you. You knew men well, and I should have known them too. Did I not say men kill from idleness?"
        - id: ch04-b33
          speaker: bagheera
          text: "They killed him for the red and blue stones. Remember, I lived in the King's cages at Oodeypore."
        - id: ch04-b34
          speaker: mowgli
          text: "One, two, three, four trails. Four men wearing shoes. They cannot travel as quickly as a Gond. What wrong did the little hunter do them? Look, all five stood talking before they killed him. Bagheera, let us turn back. My stomach is full, but it rises and falls like an oriole's nest on the end of a branch."
          emotion: disgusted
        - id: ch04-b35
          speaker: bagheera
          text: "A hunter does not leave moving game. Follow. Those four men cannot be far ahead."
        - id: ch04-b36
          speaker: narrator
          text: "For a full hour they said nothing. They worked steadily along the broad trail left by four men in shoes. Those men moved more heavily and slowly than the Gond, and eight shod feet left signs that even growing daylight could not hide. By then it was clear, hot day. Mowgli and Bagheera were traveling through a new part of the Jungle where low scrub grew thickly, trotting in and out among the bushes without losing the track."
        - id: ch04-b37
          speaker: bagheera
          text: "I smell smoke."
        - id: ch04-b38
          speaker: mowgli
          text: "Men are always readier to eat than to run."
        - id: ch04-b39
          speaker: narrator
          text: "Mowgli trotted among low bushes with Bagheera beside him. A strange sound rose in the panther's throat."
        - id: ch04-b40
          speaker: bagheera
          text: "Here is one who has finished eating."
        - id: ch04-b41
          speaker: narrator
          text: "Beneath a bush lay what first looked like a tumbled bundle of bright-colored clothes. It was another dead man. Flour had spilled on the ground all around him."
        - id: ch04-b42
          speaker: mowgli
          text: "The bamboo struck again. This white powder is men's food. The others killed the man who carried it, took their food from him, and left his body for Chil the Kite."
        - id: ch04-b43
          speaker: bagheera
          text: "That makes three."
        - id: ch04-b44
          speaker: mowgli
          text: "I will bring the Father of Cobras large fresh frogs and feed him until he is fat. The elephant-blood drinker truly is Death, and still I do not understand it."
        - id: ch04-b45
          speaker: bagheera
          text: "Follow."
        - id: ch04-b46
          speaker: narrator
          text: "They had not gone another half mile when they heard Ko the Crow singing the death song from the top of a tamarisk tree. Beneath its shade, three men lay on the ground. A fire in the middle of their circle was nearly dead but still sent up smoke. An iron plate stood over it, holding a blackened and burned cake of flat bread. Close beside the fire, the ruby-and-turquoise ankus blazed in the full sunlight."
        - id: ch04-b47
          speaker: bagheera
          text: "The thing works quickly. It ends here. How did these three die? There is no wound on any of them."
        - id: ch04-b48
          speaker: narrator
          text: "Anyone raised in the Jungle learns a great deal about poisonous plants and berries. Experience had taught Mowgli as much as many doctors knew. He leaned close and smelled the smoke rising from the fire. Then he broke a small piece from the blackened bread, tasted it carefully, and spat it out at once."
        - id: ch04-b49
          speaker: mowgli
          text: "Apple of Death. The food carrier must have poisoned the bread for these three after they killed the Gond. Then they killed him."
        - id: ch04-b50
          speaker: narrator
          text: "The Jungle People call thorn-apple the Apple of Death. It is one of the easiest poisons to find in India."
        - id: ch04-b51
          speaker: bagheera
          text: "Good hunting indeed. One kill follows another. What now? Must you and I fight to the death for that red-eyed killer?"
        - id: ch04-b52
          speaker: mowgli
          text: "Can it speak? Did I wrong it when I threw it away? It cannot harm us, because we do not desire what men desire. But if it stays here, it will go on killing men as quickly as nuts fall in a high wind. I do not love men, yet I would not have six of them die in one night."
        - id: ch04-b53
          speaker: bagheera
          text: "Why should that trouble you? They are only men. They killed one another and were glad to do it. The first little hunter did his work well."
        - id: ch04-b54
          speaker: mowgli
          text: "They are still cubs. A cub may drown itself trying to bite the moon's reflection in the water, and men destroy themselves just as foolishly. This was my fault. I carried a strange thing out of the vault and brought it into the Jungle. I will never do that again, even if the thing is as beautiful as fresh flowers. The ankus must go back to the Father of Cobras. First, though, we need to sleep, and we cannot sleep close to these dead men. We must bury the ankus before we rest, or it may run away and kill six more. Dig a deep hole beneath that tree."
        - id: ch04-b55
          speaker: bagheera
          text: "Little Brother, the blood-drinker is not to blame. The trouble lies with men."
        - id: ch04-b56
          speaker: mowgli
          text: "It is all the same. Dig the hole deep. When we wake, I will carry it back."
        - id: ch04-b57
          speaker: narrator
          text: "Bagheera dug the hole as Mowgli asked. They buried the ankus deeply beneath the tree, far from the six dead men, and slept. When they woke, Mowgli dug it up again and began the long journey back to Cold Lairs. Two nights later, the White Cobra sat mourning in the darkness of the treasure vault. He was ashamed of his weakness, robbed of the object he had guarded, and entirely alone. Without warning, the turquoise ankus whirled through the opening in the wall and struck the floor with a clash of golden coins. Mowgli had been careful to remain safely on the other side of the wall, beyond the reach of the old cobra's head."
        - id: ch04-b58
          speaker: mowgli
          text: "Father of Cobras, find a young, strong cobra to help guard the King's Treasure. Then no man will leave this place alive again."
        - id: ch04-b59
          speaker: white_cobra
          text: "Ah! So it returns. I told you the thing was Death. How are you still alive?"
          emotion: surprised
        - id: ch04-b60
          speaker: narrator
          text: "The old cobra slid over the scattered coins and wound himself lovingly around the jeweled handle. The treasure he had guarded through so many empty years was whole again, and the deadly object lay beneath his coils once more."
        - id: ch04-b61
          speaker: mowgli
          text: "By the Bull that bought me, I do not know. That thing killed six times in one night. Never let it leave again."
