audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 沉稳生动，带着古老故事的智慧
        timbre: 温暖浑厚
        pace: 舒缓
        pitch: 中低
    mowgli:
      display_name: 毛格利
      tts:
        delivery: 率真敏捷，带着丛林少年的自信与好奇
        timbre: 清亮结实
        pace: 稍快
        pitch: 中高
    kaa:
      display_name: 卡阿
      tts:
        delivery: 从容古老，话语里带着蛇族的冷静与幽默
        timbre: 低沉丝滑
        pace: 缓慢
        pitch: 低
    traveling_cobra:
      display_name: 过路眼镜蛇
      tts:
        delivery: 简短客气，带着赶路时的利落
        timbre: 轻细嘶哑
        pace: 稍快
        pitch: 中
    white_cobra:
      display_name: 白眼镜蛇
      tts:
        delivery: 苍老威严，在骄傲、凶狠与衰败间起伏
        timbre: 干涩阴冷
        pace: 缓慢
        pitch: 低
    bagheera:
      display_name: 巴希拉
      tts:
        delivery: 冷静老练，偶尔透出黑豹式的讥诮与温柔
        timbre: 深沉柔滑
        pace: 适中
        pitch: 中低
  chapters:
    - id: ch01
      title: 卡阿的新皮
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            丛林里有句老话。自从第一滴露水落下，世上就有四样东西从不知足：泽鳄杰卡拉的嘴，鸢鹰的肚囊，猿猴的双手，还有人的眼睛。岩蟒卡阿大概已经蜕下了出生以来的第二百张皮。毛格利一直记得，当年在冷宫，是卡阿救他活着出来，所以特意去道贺。蛇刚蜕完皮，总要阴沉一阵，等新皮渐渐发亮，显出漂亮的光泽，心情才会好起来。卡阿早已不再拿毛格利取笑，也像其他丛林居民一样，承认他是丛林之主。它还会把一条巨蟒自然能听见的种种消息，全都告诉毛格利。那些贴着地面生活，或藏在地下、岩缝、洞穴和树干里的生灵，属于所谓的中层丛林。卡阿若有不知道的事，写下来恐怕连它最小的一片鳞也占不满。
        - id: ch01-b02
          speaker: narrator
          text: >-
            那天下午，毛格利坐在卡阿盘成的巨大蛇圈里，手指拨弄着蜕下的旧皮。那张皮已经片片剥落，到处破损，却还保持着卡阿离开时扭曲盘绕的样子，散在岩石之间。卡阿很客气地把粗大的身子垫到毛格利宽阔赤裸的肩膀下，让男孩靠着一把真正的活扶手椅。
        - id: ch01-b03
          speaker: mowgli
          text: >-
            连眼睛上的鳞片都好好的。自己的脑袋外壳躺在脚边，看着可真怪。
        - id: ch01-b04
          speaker: kaa
          text: >-
            可我没有脚。我们全族一向这样，没什么奇怪的。你的皮难道不会变老、变硬吗？
        - id: ch01-b05
          speaker: mowgli
          text: >-
            那我就去洗澡呀，扁脑袋。不过天气最热的时候，我也真想不疼不痒地把皮脱掉，光着身子跑。
        - id: ch01-b06
          speaker: kaa
          text: >-
            我不光洗澡，还能蜕皮。你看我这身新衣服怎么样？
        - id: ch01-b07
          speaker: narrator
          text: >-
            毛格利摸过卡阿背上巨大的斜方格纹，很认真地端详起来。
        - id: ch01-b08
          speaker: mowgli
          text: >-
            龟背比它硬，可没它好看。青蛙，就是那个跟我同名的家伙，比它漂亮一点，却没它结实。真好看，像百合花心里的斑纹。
        - id: ch01-b09
          speaker: kaa
          text: >-
            它还需要水。新皮第一次洗过以前，颜色总显不全。我们去吧。
        - id: ch01-b10
          speaker: mowgli
          text: >-
            我背你！
        - id: ch01-b11
          speaker: narrator
          text: >-
            毛格利笑着弯腰，想抬起卡阿腰间最粗、像大桶一样的那一段。这和抬一根两英尺粗的水管差不多，当然纹丝不动。卡阿只是暗暗好笑地呼气。接着，他们照例开始了每晚的游戏。强壮的男孩和披着新皮的巨蟒角力，也比眼力和力气。卡阿若认真起来，压碎十几个毛格利也不难，可它处处小心，连十分之一的力量都不用。
        - id: ch01-b12
          speaker: narrator
          text: >-
            自从毛格利长得壮实，经得起一点摔打，卡阿就教他玩这种游戏。再没有什么比这更能让四肢变得柔韧。卡阿有时一圈圈缠到毛格利喉咙下。毛格利拼命抽出胳膊，要扼住它的颈项。卡阿软软退开，毛格利则飞快挪脚，想卡住那条向后甩去、四处寻找岩石和树桩借力的巨尾。他们头抵着头，摇来晃去，各自等着机会。那两道像雕像般优美的身影，忽然就变成黑黄蛇圈和手脚翻飞的旋风，然后又一次次重新立起。
        - id: ch01-b13
          speaker: kaa
          text: >-
            来呀，来呀！看，我碰到你了，小兄弟！这里，还有这里！手麻了吗？这里再来一下！
          emotion: happy
        - id: ch01-b14
          speaker: narrator
          text: >-
            每次游戏都以同样的方式收场。卡阿把头笔直撞出去，毛格利便接连翻上几个跟头。他始终挡不住这道闪电般的攻击，而卡阿说，他也不必学。
        - id: ch01-b15
          speaker: kaa
          text: >-
            狩猎顺利！
        - id: ch01-b16
          speaker: narrator
          text: >-
            毛格利照例被弹出六七码远，喘着气哈哈大笑。他爬起来，指缝里还夹着草，跟这条聪明的蛇去了它最喜欢的浴池。那潭水被岩石围着，深得发黑，水底沉着的树桩又给卡阿添了几分游水的乐趣。男孩像丛林居民一样无声滑进水里，潜到对岸，再悄悄浮上来。他仰面躺着，双手枕在脑后，看月亮从岩顶上升起，又用脚趾搅碎水中的月影。卡阿菱形的脑袋像剃刀一样划开水面，游来搁在毛格利肩头。他们舒舒服服地泡在凉水里，久久没有说话。
        - id: ch01-b17
          speaker: mowgli
          text: >-
            真舒服。我还记得，人群到了这时候，会把自己塞进泥笼子，躺在硬木板上，把干净的风全关在外面，再拿脏布蒙住沉重的脑袋，从鼻子里哼难听的歌。还是丛林好。
        - id: ch01-b18
          speaker: narrator
          text: >-
            一条赶路的眼镜蛇从岩石上滑下来，匆匆喝了水。
        - id: ch01-b19
          speaker: traveling_cobra
          text: >-
            狩猎顺利。
        - id: ch01-b20
          speaker: narrator
          text: >-
            它随即走了。卡阿却像突然想起了什么。
        - id: ch01-b21
          speaker: kaa
          text: >-
            嘘！小兄弟，这么说，丛林已经把你想要的一切都给你了？
        - id: ch01-b22
          speaker: mowgli
          text: >-
            也没有全给。不然每个月都该有一只年轻强壮的谢尔·汗让我杀。如今我不靠水牛，也能亲手杀它。我还盼过雨季里出大太阳，盛夏里下大雨。饿着肚子时，我想杀一只山羊。真杀了山羊，又盼它是公鹿。杀了公鹿，又觉得蓝牛更好。大家不都是这样吗？
        - id: ch01-b23
          speaker: kaa
          text: >-
            除了这些，就再没别的愿望了？
        - id: ch01-b24
          speaker: mowgli
          text: >-
            我还能缺什么？我有丛林，丛林也眷顾我。从日出到日落之间，难道还有更多东西？
        - id: ch01-b25
          speaker: kaa
          text: >-
            那么，那条眼镜蛇说的……
        - id: ch01-b26
          speaker: mowgli
          text: >-
            哪条眼镜蛇？刚才那条什么也没说，它正忙着打猎。
        - id: ch01-b27
          speaker: kaa
          text: >-
            是另一条。
        - id: ch01-b28
          speaker: mowgli
          text: >-
            你常跟毒族来往吗？我一向不招惹它们。它们那么小，前牙却带着死亡，这可不好。你说的那顶兜帽是谁？
    - id: ch02
      title: 冷宫地下
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            卡阿像一艘横遇风浪的船，在水中慢慢翻了个身。
        - id: ch02-b02
          speaker: kaa
          text: >-
            三四个月前，我去冷宫打猎。你没忘记那里吧？我追的东西尖叫着跑过水池，钻进那座我曾替你撞破墙的屋子，又逃到地下去了。
        - id: ch02-b03
          speaker: mowgli
          text: >-
            可冷宫的猴族不住洞穴。
        - id: ch02-b04
          speaker: kaa
          text: >-
            那东西已经活不久了，却还很想活。它钻进一个深洞，我追进去杀了它，睡过一觉，醒来又继续往前。
        - id: ch02-b05
          speaker: mowgli
          text: >-
            还在地底下？
        - id: ch02-b06
          speaker: kaa
          text: >-
            正是。后来我遇见一顶白兜帽，是一条白眼镜蛇。它说的事连我都不懂，还让我看了许多从没见过的东西。
        - id: ch02-b07
          speaker: mowgli
          text: >-
            是新猎物吗？那场狩猎怎么样？
        - id: ch02-b08
          speaker: kaa
          text: >-
            不是猎物。真咬下去，我的牙都会硌断。可白兜帽说，人只要看那些东西一眼，就肯交出肋骨下的气息。
        - id: ch02-b09
          speaker: mowgli
          text: >-
            那我们去看看。我差点忘了，自己从前也是人。
        - id: ch02-b10
          speaker: kaa
          text: >-
            慢些。吞掉太阳的黄蛇，就是因为太性急才死的。我告诉白兜帽，你是个人。它老得像丛林一样，说自己很久没见过人了，叫我带你去。它还说，那里最不起眼的东西，也能要掉许多人的命。
        - id: ch02-b11
          speaker: mowgli
          text: >-
            那准是新猎物。毒族发现猎物，从来不肯告诉我们，真不友善。
        - id: ch02-b12
          speaker: kaa
          text: >-
            不是猎物。它到底是什么，我也说不清。
        - id: ch02-b13
          speaker: mowgli
          text: >-
            那就更该去了。我没见过白兜帽，也想看看那些东西。是它杀死了它们吗？
        - id: ch02-b14
          speaker: kaa
          text: >-
            那些东西根本没有生命。它说，自己是它们的守护者。
        - id: ch02-b15
          speaker: mowgli
          text: >-
            明白了，就像狼守着拖回洞里的肉。我们走。
        - id: ch02-b16
          speaker: narrator
          text: >-
            毛格利上岸，在草地里打滚，把身子弄干，便和卡阿赶往冷宫。你或许听说过这座废弃的城市。那时毛格利已经一点也不怕猴族，猴族反倒怕他怕得要命。各支猴群又都到丛林里劫掠去了，所以废城空荡荡的，在月光下没有一点声音。卡阿领他爬上露台中央的王后寝宫废墟，越过瓦砾，从寝宫中一段堵了大半的地下石阶滑下去。毛格利喊出蛇族暗语“你我同属一血”，也手脚并用地跟了下去。
        - id: ch02-b17
          speaker: narrator
          text: >-
            他们沿一条倾斜的通道爬了很远。通道弯了又弯，转了又转。最后，他们来到一面墙边。一棵长在头顶三十英尺处的大树，竟用根须从墙上顶开了一整块石头。他们从缺口钻进去，来到一座巨大的地窖。圆拱顶也被树根撑破，几缕微光从裂口漏进黑暗。
        - id: ch02-b18
          speaker: mowgli
          text: >-
            这洞倒安全，可离得太远，不能天天来。现在要看什么？
        - id: ch02-b19
          speaker: white_cobra
          text: >-
            难道我不算一样东西？
        - id: ch02-b20
          speaker: narrator
          text: >-
            声音从地窖中央传来。毛格利先看见一点白色在移动。慢慢地，他见过的最大一条眼镜蛇昂起身体。它将近八英尺长，常年待在不见阳光的地下，通身已经褪成旧象牙般的白色。就连张开兜帽时露出的眼镜花纹，也只剩一层淡黄。只有那双眼睛仍像两颗红宝石，在黑暗中显得格外奇异。
        - id: ch02-b21
          speaker: mowgli
          text: >-
            狩猎顺利！
        - id: ch02-b22
          speaker: white_cobra
          text: >-
            城里怎么样了？那座有高墙的大城怎么样？那里有一百头象、两万匹马和数不清的牛，是二十王之王的城市。我困在这里，耳朵都聋了，已经很久没听见战鼓。
        - id: ch02-b23
          speaker: mowgli
          text: >-
            我们头顶只有丛林。象里面，我只认识哈蒂和它的儿子。巴希拉倒杀过一个村子的马。还有，王是什么？
        - id: ch02-b24
          speaker: kaa
          text: >-
            我四个月前就告诉过你，那座城已经没了。
        - id: ch02-b25
          speaker: white_cobra
          text: >-
            不可能！那是森林里的伟大城市，城门有国王的高塔守卫。它在我祖父破壳前就建成了，等我子孙的子孙也白得像我，它仍会站着。巴帕·拉瓦尔的年代，耶加苏里的儿子维耶贾、维耶贾的儿子昌德拉比贾、昌德拉比贾的儿子萨洛姆迪建造了它。你们是哪一家的牲口？
        - id: ch02-b26
          speaker: mowgli
          text: >-
            这条踪迹断了，卡阿。我听不懂它在说什么。
        - id: ch02-b27
          speaker: kaa
          text: >-
            我也不懂。它太老了。眼镜蛇之父，这里从开天辟地起就只有丛林。
        - id: ch02-b28
          speaker: white_cobra
          text: >-
            那他又是谁？他坐在我面前，一点也不怕，不知道国王的名字，却用人的嘴说蛇语。这个带着刀、长着蛇舌的人是谁？
        - id: ch02-b29
          speaker: mowgli
          text: >-
            大家叫我毛格利。我属于丛林，狼是我的族人，卡阿是我的兄弟。眼镜蛇之父，你是谁？
        - id: ch02-b30
          speaker: white_cobra
          text: >-
            我是国王宝藏的守护者。我皮还黑时，卡伦王就在上方砌起石板，叫我把死亡教给每一个盗贼。后来，人们从石板那里放下宝物，我还听见婆罗门主人唱歌。
        - id: ch02-b31
          speaker: mowgli
          text: >-
            我在人群里见识过一个婆罗门。照我看，这里很快就要出祸事。
        - id: ch02-b32
          speaker: white_cobra
          text: >-
            自我来到这里，石板只抬起过五次。每次都有更多宝物放下来，从没拿走一样。这是一百位国王的珍宝，世上没有财富能相比。可上一次打开石板，已经是很久以前了。我的城市大概忘了我。
        - id: ch02-b33
          speaker: kaa
          text: >-
            城市根本不在了。抬头看，树根正在撕开石头。树和人不能长在一起。
        - id: ch02-b34
          speaker: white_cobra
          text: >-
            有人找到过这里。他们在黑暗里摸索，碰见我才喊起来，而且只喊了一会儿。如今人和蛇都来骗我，说城市死了，守卫也该结束。许多年过去，人没有变，我也永远不会变。除非石板升起，婆罗门唱着旧歌下来，喂我温奶，再带我回到光里，否则只有我永远守着国王的宝藏！你们说城市死了，树根也进来了？那就低头随便拿吧。长着蛇舌的人，只要你能活着走出去，那些小国王都会做你的仆人！
          emotion: angry
        - id: ch02-b35
          speaker: mowgli
          text: >-
            踪迹又断了。是有豺挖到这里，把这顶白兜帽咬疯了吗？眼镜蛇之父，我没看出这里有什么值得带走。
        - id: ch02-b36
          speaker: white_cobra
          text: >-
            凭太阳神和月神起誓，这孩子疯得要命！趁你还睁着眼，我准你领受这份恩惠。看吧，好好看看从来没人见过的东西！
          emotion: angry
        - id: ch02-b37
          speaker: mowgli
          text: >-
            在丛林里，谁拿恩惠来压毛格利，谁都不会有好结果。不过黑暗会改变东西。既然你喜欢，我就看。
    - id: ch03
      title: 国王的宝藏
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            毛格利眯起眼睛四下看，从地上抓起一把闪亮的东西。
        - id: ch03-b02
          speaker: mowgli
          text: >-
            哦嗬！这很像人群拿来玩的东西，不过这些是黄色的，那些是褐色的。
        - id: ch03-b03
          speaker: narrator
          text: >-
            他让金币从指间落回去，继续向前。整座地窖铺着五六英尺深的金币和银币。盛钱的袋子早已烂光，金属经过漫长岁月，像退潮后的沙一样沉降、压紧。在钱币上面、钱币中间，还有从钱堆里露出来的地方，摆着一件又一件宝物，仿佛一艘沉船从沙中露出残骸。有镶满珠宝、刻着花纹的银象轿，外面钉着锤薄的金片，还装饰着红玉髓和绿松石。有王后乘坐的肩舆和轿子，白银与珐琅搭成框架，轿杠把手用玉制成，帘环则是琥珀。有黄金烛台，枝头挂着镂空翡翠，稍有动静便轻轻颤动。还有五英尺高的忘却之神像，银身上嵌着宝石眼睛。
        - id: ch03-b04
          speaker: narrator
          text: >-
            用黄金镶嵌的钢甲旁边，珍珠饰边已经腐烂发黑。头盔上用鸽血红宝石缀成冠饰。漆盾、玳瑁盾和犀牛皮盾都有赤金背带和圆饰，边缘还嵌着翡翠。钻石作柄的长剑、匕首和猎刀成捆放着。祭祀用的金碗、金勺和从不见天日的便携祭坛也埋在其中。玉杯、手镯、黄金香炉、梳子，还有盛香料、指甲花和眼粉的罐子，堆得到处都是。鼻环、臂钏、额带、指环和腰带根本数不完。其中一条腰带足有七指宽，由方形钻石和红宝石拼成。几只上过三道铁箍的木箱已经化成尘土，里面未经切割的星光蓝宝石、蛋白石、猫眼石、蓝宝石、红宝石、钻石、翡翠和石榴石全露了出来。
        - id: ch03-b05
          speaker: narrator
          text: >-
            白眼镜蛇说得没错，这座宝藏根本不能只用钱来估价。几百年的战争、劫掠、贸易和征税，把最贵重的东西一点点筛到这里。哪怕完全不算宝石，光那些钱币就已价值无穷，金银本身的重量恐怕足有两三百吨。直到今天，印度的本地统治者无论多穷，也往往藏着一座不断添置的宝库。偶尔会有一位开明的王公，运走四五十牛车白银，把它换成政府证券。可绝大多数人，还是更愿意把财宝和财宝的秘密一起藏牢。
        - id: ch03-b06
          speaker: narrator
          text: >-
            毛格利当然不懂这些东西意味着什么。那些刀稍稍引起了他的兴趣，可没有一把像自己的刀那样平衡，他拿起看看便随手丢掉。最后，他在一顶半埋进钱币的象轿前，看见一件真正吸引他的东西。那是一根三英尺长的安库斯，也就是象刺棒，形状像一把小号挽舟钩。顶端是一颗圆滚滚、亮闪闪的红宝石。往下八英寸长的握柄，密密嵌着未经打磨的绿松石，抓在手里十分合适。再往下是一圈带花纹的玉，翡翠拼成叶子，红宝石嵌进清凉的绿玉，成了一朵朵花。其余棒身全由象牙制成。末端的尖刺和钩子是金丝镶嵌的钢，上面画着一幅幅捕象的图景。正是那些图画吸引了毛格利，因为他看出画中是自己的朋友“沉默者”哈蒂的同族。
        - id: ch03-b07
          speaker: white_cobra
          text: >-
            这些东西难道不值得人看一眼就死吗？我给你的恩惠还不够大？
        - id: ch03-b08
          speaker: mowgli
          text: >-
            我不明白。它们又硬又冷，也不能吃。不过这个我想带到太阳底下看看。你说这些全是你的，那你愿意给我吗？我可以带青蛙来给你吃。
        - id: ch03-b09
          speaker: narrator
          text: >-
            白眼镜蛇浑身发抖，邪恶地快活起来。
        - id: ch03-b10
          speaker: white_cobra
          text: >-
            当然给你。这里的一切都可以给你，直到你想离开。
          emotion: happy
        - id: ch03-b11
          speaker: mowgli
          text: >-
            可我现在就要走。这里又黑又冷，我想把这件带尖刺的东西拿去丛林。
        - id: ch03-b12
          speaker: white_cobra
          text: >-
            看看你脚下。那是什么？
        - id: ch03-b13
          speaker: narrator
          text: >-
            毛格利捡起一样光滑洁白的东西。
        - id: ch03-b14
          speaker: mowgli
          text: >-
            是人的头骨。这里还有两个。
        - id: ch03-b15
          speaker: white_cobra
          text: >-
            很多年前，他们来拿宝藏。我在黑暗中同他们说过话，他们便躺下不动了。
        - id: ch03-b16
          speaker: mowgli
          text: >-
            可我要宝藏做什么？你若让我带走象刺棒，那就狩猎顺利。你若不肯，也一样狩猎顺利。我不跟毒族争斗，而且知道你们一族的主宰密语。
        - id: ch03-b17
          speaker: white_cobra
          text: >-
            这里只能有一句主宰密语。那一句属于我！
          emotion: angry
        - id: ch03-b18
          speaker: narrator
          text: >-
            卡阿眼中冒出火光，猛地扑向前。
        - id: ch03-b19
          speaker: kaa
          text: >-
            是谁叫我把人带来的？
          emotion: angry
        - id: ch03-b20
          speaker: white_cobra
          text: >-
            是我。我太久没见过人了，而这个人还会说蛇语。
        - id: ch03-b21
          speaker: kaa
          text: >-
            可你从没说要杀他。我若把他领来送死，回到丛林以后还能怎么开口？
        - id: ch03-b22
          speaker: white_cobra
          text: >-
            时候没到，我当然不谈杀戮。你想走，墙上便有洞。安静，肥胖的杀猴者！我只要碰一下你的脖子，丛林便再也认不出你。从来没人能从这里带着肋骨下的气息离开。我是王城宝藏的守护者！
          emotion: angry
        - id: ch03-b23
          speaker: kaa
          text: >-
            黑暗里的白虫，我再告诉你一次，国王和城市早就没了，四周全是丛林！
          emotion: angry
        - id: ch03-b24
          speaker: white_cobra
          text: >-
            宝藏还在，那就够了。岩石中的卡阿，你等着看孩子奔跑吧。这里地方很大，正好玩一场好游戏。孩子，活着多好啊，快跑起来逗我开心！
        - id: ch03-b25
          speaker: narrator
          text: >-
            毛格利平静地把一只手放在卡阿头上。
        - id: ch03-b26
          speaker: mowgli
          text: >-
            这白东西只跟人群的人交过手，它还不了解我。既然是它要打猎，那就给它一场狩猎。
        - id: ch03-b27
          speaker: narrator
          text: >-
            毛格利原本让象刺棒尖头朝下。忽然，他把棒横着扔出去，正落在白蛇兜帽后方，将它钉在地上。卡阿立刻用全身重量压住蛇身，从兜帽到尾尖都不能动。白蛇的红眼睛像火一样燃烧，只有最后六英寸长的脑袋还能左右扑咬。
        - id: ch03-b28
          speaker: kaa
          text: >-
            杀了它！
          emotion: angry
        - id: ch03-b29
          speaker: mowgli
          text: >-
            不。除了为了食物，我不再杀生。不过卡阿，你来看。
        - id: ch03-b30
          speaker: narrator
          text: >-
            毛格利拔出刀，抓住白蛇兜帽后方，用刀刃逼它张嘴。上颌那对可怕的毒牙已经发黑，枯萎在牙龈里。白眼镜蛇活得太久，毒液早已干涸。
        - id: ch03-b31
          speaker: mowgli
          text: >-
            图！你已经干枯了，就像一截腐烂空心的树桩。
        - id: ch03-b32
          speaker: narrator
          text: >-
            他挥手让卡阿退开，捡起象刺棒，放了白眼镜蛇。
        - id: ch03-b33
          speaker: mowgli
          text: >-
            国王的宝藏该换一位守护者了。图，你守得不好。现在换你跑来跑去，逗人开心吧！
        - id: ch03-b34
          speaker: white_cobra
          text: >-
            我羞愧极了。杀了我！
          emotion: sad
        - id: ch03-b35
          speaker: mowgli
          text: >-
            杀戮的话已经说得太多，我们要走了。图，这件尖东西归我，因为我同你交过手，而且胜了你。
        - id: ch03-b36
          speaker: white_cobra
          text: >-
            当心它最后杀了你！它就是死亡。记住，它就是死亡！这件东西足以杀光整座城的人。你拿不了多久，从你手里拿走它的人也拿不了多久。他们会为它一次又一次杀下去！我的力量干涸了，象刺棒却会替我动手。它是死亡！死亡！死亡！
          emotion: fearful
        - id: ch03-b37
          speaker: narrator
          text: >-
            毛格利带着象刺棒从墙上的缺口爬回通道。离开前最后看了一眼，他看见白眼镜蛇正用失去毒性的牙疯狂扑咬地上那些毫无表情的金神像，嘴里还在一遍遍嘶叫着“它是死亡”。
    - id: ch04
      title: 红眼杀手
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            毛格利和卡阿重新回到阳光下，心情都很好。回到自己的丛林，毛格利让象刺棒在晨光里闪耀，喜欢得几乎像刚找到一束能插在头发里的新花。
        - id: ch04-b02
          speaker: mowgli
          text: >-
            它比巴希拉的眼睛还亮。我要拿给它看看。不过图一直说死亡，到底是什么意思？
          emotion: happy
        - id: ch04-b03
          speaker: kaa
          text: >-
            我也说不出。我从尾巴尖一直难过到尾巴的尾巴，只恨它没尝到你的刀。冷宫不管地上地下，总有邪恶。我饿了，你愿意同我趁黎明打猎吗？
        - id: ch04-b04
          speaker: mowgli
          text: >-
            不去，巴希拉一定得看这个。狩猎顺利！
        - id: ch04-b05
          speaker: narrator
          text: >-
            毛格利挥着巨大的象刺棒，蹦蹦跳跳地走了，还不时停下来，把红宝石转到光里再欣赏一番。他来到巴希拉常出没的那片丛林，找到黑豹时，巴希拉刚完成一场大猎，正在水边喝水。毛格利从钻进冷宫地下说起，把白眼镜蛇、国王宝藏和两条蛇的冲突全讲了一遍。巴希拉一边听，一边不时凑近象刺棒，用鼻子仔细嗅闻。等毛格利说到白眼镜蛇最后那番警告，黑豹从喉咙深处发出赞同的呼噜声。
        - id: ch04-b06
          speaker: mowgli
          text: >-
            这么说，白兜帽讲的是真的？
        - id: ch04-b07
          speaker: bagheera
          text: >-
            我出生在乌代浦的王家兽笼，多少懂一点人的事。单是那颗大红宝石，就有人肯在一夜里杀上三次。
        - id: ch04-b08
          speaker: mowgli
          text: >-
            可这石头拿着很沉，我那把亮闪闪的小刀还更好。再说，它又不能吃。人为什么要为它杀人？
        - id: ch04-b09
          speaker: bagheera
          text: >-
            毛格利，去睡吧。你在人群里住过，应该……
        - id: ch04-b10
          speaker: mowgli
          text: >-
            我想起来了。人杀生不一定是为了狩猎。他们会因为无聊，拿杀生取乐。巴希拉，别睡。这件尖东西是做什么的？
        - id: ch04-b11
          speaker: narrator
          text: >-
            巴希拉困得只睁开半只眼，眼里却闪过一点恶作剧的光。
        - id: ch04-b12
          speaker: bagheera
          text: >-
            人造它，是为了刺进哈蒂儿子们的头，让血流出来。我在乌代浦兽笼前见过一样的东西。这一件一定尝过许多象的血。
        - id: ch04-b13
          speaker: mowgli
          text: >-
            他们为什么要刺象的头？
        - id: ch04-b14
          speaker: bagheera
          text: >-
            为了教象遵守人的法则。人没有爪牙，只好造这些东西，还有比这更坏的。
        - id: ch04-b15
          speaker: mowgli
          text: >-
            我一靠近人群，哪怕只靠近他们造的东西，总会流更多血。早知道，我就不拿它了。先是梅苏亚的血沾在皮带上，现在又是哈蒂同族的血。我不要了。看！
          emotion: disgusted
        - id: ch04-b16
          speaker: narrator
          text: >-
            象刺棒闪着光飞过三十码，落进树林，尖头深深扎入地面。那东西已经沉得让毛格利有些受不了。他低头看着自己的双手，又在新鲜湿润的泥土上仔细擦了擦手掌。
        - id: ch04-b17
          speaker: mowgli
          text: >-
            这下我的手不再沾着死亡了。图说死亡会跟着我，可它又老又白，还疯疯癫癫。
        - id: ch04-b18
          speaker: bagheera
          text: >-
            不管它白还是黑，是死是活，我都要睡了，小兄弟。我可不像有些家伙，整夜打猎，白天还叫个不停。
        - id: ch04-b19
          speaker: narrator
          text: >-
            巴希拉说完便去了两英里外一个熟悉的猎穴。毛格利轻轻松松爬上一棵合适的树，把三四根藤蔓结在一起，转眼就在离地五十英尺的吊床里荡了起来。他并不真的讨厌强烈的日光，只是丛林里的朋友们大多有躲开阳光的习惯，他也就照着做。树上那些大嗓门的居民一直吵闹，可他还是睡熟了。等他醒来，暮色已经又一次降临。整个白天，他在梦里反复看见地窖里的宝石，还有那件被自己丢掉的漂亮东西。
        - id: ch04-b20
          speaker: mowgli
          text: >-
            至少该再看它一眼。
        - id: ch04-b21
          speaker: narrator
          text: >-
            他说着顺一根藤蔓滑到地面，回到丢掉象刺棒的地方。巴希拉却已经先到了，正在昏暗里低头嗅来嗅去。
        - id: ch04-b22
          speaker: mowgli
          text: >-
            那件尖东西呢？
        - id: ch04-b23
          speaker: bagheera
          text: >-
            被一个人拿走了。踪迹在这里。
        - id: ch04-b24
          speaker: mowgli
          text: >-
            现在正好看看图说的是不是真话。若它真是死亡，拿走它的人就会死。我们追。
        - id: ch04-b25
          speaker: bagheera
          text: >-
            先去打猎。空着肚子，眼睛会漏掉线索。人走得慢，丛林又湿，最轻的脚印也留得住。
        - id: ch04-b26
          speaker: narrator
          text: >-
            他们立刻去找猎物，尽可能快地完成了狩猎。可吃肉不能匆忙，喝水也不能省下。等他们吃饱喝足，再回到足迹旁循踪出发，已经过去将近三个小时。丛林居民都知道，若有人在吃饭时催赶，坏掉的心情事后拿什么也补不回来。那个人走得慢，而湿润的土地会把最轻的脚印留得清清楚楚，他们一点也不担心追丢。
        - id: ch04-b27
          speaker: mowgli
          text: >-
            你说，那件尖东西会不会在那人手里转过头杀他？图说它是死亡。
        - id: ch04-b28
          speaker: bagheera
          text: >-
            找到就知道了。这里只有一双脚，是一个人。而且那东西很沉，把他的脚跟压得很深。
        - id: ch04-b29
          speaker: mowgli
          text: >-
            对，像夏天的闪电一样清楚。他现在跑快了，脚趾全张开。可走过湿地以后，他为什么突然转向？
        - id: ch04-b30
          speaker: bagheera
          text: >-
            等等！
        - id: ch04-b31
          speaker: narrator
          text: >-
            踪迹突然不再说明缘故时，不能踩乱地上的线索。巴希拉使出全力向前一跃，落地后立刻转身。
        - id: ch04-b32
          speaker: bagheera
          text: >-
            有另一道踪迹从这里迎上他。那双脚更小，脚趾向内弯。
        - id: ch04-b33
          speaker: mowgli
          text: >-
            是贡德猎人的脚印。看，他的弓拖过草地。难怪大脚突然躲开了小脚。
        - id: ch04-b34
          speaker: bagheera
          text: >-
            不错。为了不互相踩乱记号，我们各跟一道。我是大脚，你就是贡德人的小脚。
        - id: ch04-b35
          speaker: narrator
          text: >-
            巴希拉跃回大脚印上，毛格利俯身追查山林人的窄脚印。
        - id: ch04-b36
          speaker: bagheera
          text: >-
            我这个大脚在这里转弯，躲到岩石后面，一动不动。小兄弟，说说你的踪迹。
        - id: ch04-b37
          speaker: mowgli
          text: >-
            我这个小脚来到岩石边，在石头下坐好，右手撑地，弓夹在脚趾中间。我等了很久，这里的脚印压得很深。
        - id: ch04-b38
          speaker: bagheera
          text: >-
            我也在等。我把象刺棒的一头搁在石头上，它滑了一下，留下这道刮痕。小兄弟，接着说。
        - id: ch04-b39
          speaker: mowgli
          text: >-
            这里断了一根、两根细枝，还有一根大树枝。明白了。我这个小脚故意踩出声音，慢慢走远，让大脚听见。我一直走到瀑布声盖住脚步，再躲在这里等。巴希拉，该大脚说了！
        - id: ch04-b40
          speaker: bagheera
          text: >-
            我从岩石后跪着出来，拖着尖东西。四周没人，我就跑起来。大脚的踪迹很清楚。现在各跟各的，我要跑了！
        - id: ch04-b41
          speaker: narrator
          text: >-
            巴希拉沿大脚留下的清楚踪迹疾驰，毛格利也跟着贡德人的窄脚印向前。两道足迹各走各的，却一直朝着相同方向延伸。有一阵，丛林里静得听不见他们以外的声音。
        - id: ch04-b42
          speaker: bagheera
          text: >-
            小脚，你在哪里？
        - id: ch04-b43
          speaker: mowgli
          text: >-
            在你右边，不到五十码！
        - id: ch04-b44
          speaker: bagheera
          text: >-
            嗯，两个人并排跑着，而且越来越近了！
        - id: ch04-b45
          speaker: narrator
          text: >-
            他们又奔出半英里，仍隔着相仿的距离。毛格利的头没有巴希拉贴地那么低，所以先看出了结果。
        - id: ch04-b46
          speaker: mowgli
          text: >-
            他们碰面了。狩猎顺利！看，小脚把膝盖抵过这块石头，大脚果然就在前面。
        - id: ch04-b47
          speaker: narrator
          text: >-
            前方不到十码，一名本地村民横死在一堆碎石上。一支贡德人的长箭从背后射入，又从胸前穿出。箭尾的羽毛剪得很短，清楚说明了射箭人的来历。大脚躲避小脚、两人隔着岩石彼此等待，后来又一同奔跑的谜底，全在这具尸体上了。贡德猎人先故意走远，借瀑布声藏住自己，再绕过去射中了带着象刺棒逃跑的人。
        - id: ch04-b48
          speaker: bagheera
          text: >-
            小兄弟，图真的又老又疯吗？这里至少已经有一个死者了。
        - id: ch04-b49
          speaker: mowgli
          text: >-
            继续追。可那件喝象血、长着红眼睛的尖东西在哪里？
        - id: ch04-b50
          speaker: bagheera
          text: >-
            也许到了小脚手里。现在又只剩一个人的踪迹。
    - id: ch05
      title: 一夜六次死亡
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: >-
            此后只剩瘦小男人独自留下的脚印。踪迹绕过一片低矮而绵长的枯草坡。他跑得很快，左肩扛着沉重的象刺棒，所以身体每次落下，左右脚印的轻重都不一样。对毛格利和巴希拉这样敏锐的追踪者来说，他踏出的每一步都像用烙铁印在地上。他们不用交谈，也能看见他一路急奔的样子。两人沉默地追到一道沟谷，足迹在那里通向一处隐蔽的营地，只剩一堆熄灭的火灰。
        - id: ch05-b02
          speaker: bagheera
          text: >-
            又一个！
        - id: ch05-b03
          speaker: narrator
          text: >-
            巴希拉猛然停下，像化成了石头。一个枯瘦矮小的贡德人躺在地上，双脚伸进灰烬。黑豹看向毛格利。
        - id: ch05-b04
          speaker: mowgli
          text: >-
            是竹棍打死的。我在人群里放牛时，也用过这种东西。眼镜蛇之父很懂人，我本来也该懂。我不是说过吗？人会因为无聊而杀人。
        - id: ch05-b05
          speaker: bagheera
          text: >-
            他们是为了红石头和蓝石头杀他的。别忘了，我在乌代浦的王家兽笼住过。
        - id: ch05-b06
          speaker: mowgli
          text: >-
            一道、两道、三道、四道，是四个穿鞋的人。他们走得没有贡德人快。可这个小林中人对他们做过什么坏事？你看，他死前，五个人还站在这里说过话。巴希拉，我们回去吧。我的胃沉甸甸的，又像树枝上的黄鹂巢一样摇来晃去。
        - id: ch05-b07
          speaker: bagheera
          text: >-
            还会动的猎物不能丢下。跟上！那八只穿鞋的脚走得不远。
        - id: ch05-b08
          speaker: narrator
          text: >-
            接下来整整一个小时，他们沿着四个穿鞋人的宽阔足迹追赶，谁也没再开口。五个人曾围着灰烬站立，离开时却只有四个人继续上路，这件事已经不用再说。此时天色完全亮了，暑气逼人。那些人的步子不如贡德猎人轻快，四道脚印仍一路沉重地留在他们眼前。
        - id: ch05-b09
          speaker: bagheera
          text: >-
            我闻到烟味了。
        - id: ch05-b10
          speaker: mowgli
          text: >-
            人总是更愿意吃东西，不愿意赶路。
        - id: ch05-b11
          speaker: narrator
          text: >-
            毛格利在陌生丛林的矮灌木间穿来穿去。稍偏左边，巴希拉喉咙里发出一种说不清的声音。
        - id: ch05-b12
          speaker: bagheera
          text: >-
            这里有一个再也不用吃东西了。
        - id: ch05-b13
          speaker: narrator
          text: >-
            一团鲜艳衣裳凌乱地堆在灌木下，里面躺着又一个死人，周围还洒满了从行囊漏出的面粉。四个穿鞋人从贡德猎人手里拿到象刺棒以后，又抢了这个人背着的食物。他们用竹棍把他打倒，只把尸体留给天上的鸢鹰奇尔。
        - id: ch05-b14
          speaker: mowgli
          text: >-
            又是竹棍。白粉是人的食物。他们抢走这个人背的粮食，又把他送去给鸢鹰奇尔吃了。
        - id: ch05-b15
          speaker: bagheera
          text: >-
            这是第三个。
        - id: ch05-b16
          speaker: mowgli
          text: >-
            我要带又大又新鲜的青蛙，去喂那条肥眼镜蛇。喝象血的东西果然就是死亡，可我还是不明白！
        - id: ch05-b17
          speaker: bagheera
          text: >-
            跟上！
        - id: ch05-b18
          speaker: narrator
          text: >-
            还没走半英里，他们便听见乌鸦科在一棵柽柳顶上唱起死亡之歌。树荫下躺着三个人。三人围成的圆圈中央，一堆快熄灭的火还冒着烟。火上架着铁盘，盘里是一张烧焦发黑的无酵饼。看样子，他们抢到食物以后便停下来做饭，以为争夺已经结束。营火旁边，镶着红宝石和绿松石的象刺棒在阳光下灼灼发亮。它仍旧像毛格利初见时那样美，周围却已经躺满为了得到它而死的人。
        - id: ch05-b19
          speaker: bagheera
          text: >-
            这东西下手真快，到这里全结束了。毛格利，这三个人怎么死的？他们身上都没有伤。
        - id: ch05-b20
          speaker: narrator
          text: >-
            丛林居民凭经验认得许多毒草毒果，这方面的知识并不比许多医生少。毛格利俯身闻了闻火上升起的烟，又从铁盘里掰下一小块焦饼。他只尝了一点，便咳着立刻吐掉。
        - id: ch05-b21
          speaker: mowgli
          text: >-
            是死亡之果。第一个人一定把它拌进食物，留给这些人。他们先杀贡德人，又杀了下毒的人。
        - id: ch05-b22
          speaker: bagheera
          text: >-
            真是狩猎顺利，一个猎物紧跟着一个。
        - id: ch05-b23
          speaker: narrator
          text: >-
            丛林居民把曼陀罗叫作死亡之果。它是全印度最容易找到的毒物。第一个穿鞋的人显然早有打算。他把毒物混进食物，等同伴吃下。那三个人用竹棍杀他时，并不知道自己的死也已经放进了铁盘。
        - id: ch05-b24
          speaker: bagheera
          text: >-
            现在怎么办？你和我也要为那个红眼杀手互相残杀吗？
        - id: ch05-b25
          speaker: mowgli
          text: >-
            它会说话吗？我把它丢掉，是不是得罪了它？它不能在你我之间作恶，因为我们不贪人想要的东西。可留它在这里，它还会继续杀人，快得像大风吹落树上的坚果。我不喜欢人，却也不愿看他们一夜死去六个。
        - id: ch05-b26
          speaker: bagheera
          text: >-
            那又怎样？他们不过是人。他们互相残杀，还觉得很满意。第一个小林中人猎得很不错。
        - id: ch05-b27
          speaker: mowgli
          text: >-
            可他们到底都是幼崽。幼崽会为了咬水里的月亮，把自己淹死。这是我的错。我以后再也不把陌生东西带进丛林，哪怕它们美得像花。这根象刺棒得还给眼镜蛇之父。不过我们先睡一觉，不能睡在这些长眠者旁边。还得把它埋好，免得它跑掉，再杀六个人。请在那棵树下挖个坑。
        - id: ch05-b28
          speaker: bagheera
          text: >-
            可是小兄弟，我说过，这不是喝血者的错。麻烦在人身上。
        - id: ch05-b29
          speaker: mowgli
          text: >-
            都一样。把坑挖深一点。睡醒以后，我会挖出它，送回原处。
        - id: ch05-b30
          speaker: narrator
          text: >-
            巴希拉挖好深坑，他们把象刺棒埋进去，然后离开六名死者，在别处睡下。醒来以后，毛格利照自己的话重新挖出它。两夜以后，白眼镜蛇独自坐在地窖的黑暗里哀伤。它被毛格利揭穿衰老，又失去了自己守卫的宝物，既羞惭又孤零零的。忽然，绿松石象刺棒从墙洞中旋转飞入，撞在遍地金币上，发出清亮的一声。
        - id: ch05-b31
          speaker: mowgli
          text: >-
            眼镜蛇之父，去找一条年轻力壮的同族，帮你守国王的宝藏吧。这样，再也不会有人活着离开。
        - id: ch05-b32
          speaker: narrator
          text: >-
            毛格利很小心，扔进象刺棒以后，始终留在墙的另一边。老眼镜蛇含混地咕哝着，亲昵地把身体盘上象刺棒的柄，像重新抱住失而复得的宝物。
        - id: ch05-b33
          speaker: white_cobra
          text: >-
            啊哈，它回来了！我早说过，这东西就是死亡。你怎么还活着？
          emotion: surprised
        - id: ch05-b34
          speaker: mowgli
          text: >-
            凭那头买下我的公牛起誓，我到现在也不知道！这东西只用一夜就杀了六次。以后再也别让它出去了。
