audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 沉稳生动，带着古老故事的智慧
        timbre: 温暖浑厚
        pace: 舒缓
        pitch: 中低
    purun_bhagat:
      display_name: 普伦·巴格特
      tts:
        delivery: 深思克制，危急时果断威严
        timbre: 清正沉厚
        pace: 徐缓
        pitch: 中低
    london_guest:
      display_name: 伦敦宾客
      tts:
        delivery: 热情赞叹，带着社交场合的优雅
        timbre: 明亮圆润
        pace: 适中
        pitch: 中
    village_priest:
      display_name: 村中祭司
      tts:
        delivery: 虔敬谨慎，敬畏中带着笃定
        timbre: 温和略哑
        pace: 缓慢
        pitch: 中低
    village_woman:
      display_name: 村中妇人
      tts:
        delivery: 朴实虔诚，说话轻柔
        timbre: 柔和清亮
        pace: 适中
        pitch: 中高
    blacksmith_wife:
      display_name: 铁匠的妻子
      tts:
        delivery: 机敏果断，危急中保持清醒
        timbre: 结实清晰
        pace: 稍快
        pitch: 中
  chapters:
    - id: ch01
      title: 普伦·达斯爵士
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 那一夜，小小的山民感觉大地就要移动，便偷偷赶来牵住他的手。它们只知道自己爱他，却不明白这爱从何而来。后来山坡怒吼着崩裂，整个天地在雨中倒塌，是这些野兽救了他。可它们的兄弟再也没有回来。它们为那份微薄却倾尽一切的爱哀悼，也为永远不会醒来的兄弟哀悼，而他的人族还会把它们赶走。这就是叶猴为他唱的挽歌。
        - id: ch01-b02
          speaker: narrator
          text: 从前，印度西北部有一个半独立的土邦，首相名叫普伦·达斯。他是婆罗门，种姓高贵得连种姓本身对他也失去了特别的意义。他的父亲曾在一个旧式印度宫廷里做大官。那个宫廷衣饰鲜艳，各种尊卑人物混杂在一起，十分热闹。普伦·达斯长大后看出，旧世道正在改变。想在世上出头，既要讨英国人喜欢，仿效英国人眼中一切美好的东西，又不能失去本国君主的恩宠。这场游戏并不好玩，更不好赢。
        - id: ch01-b03
          speaker: narrator
          text: 这位年轻婆罗门沉静寡言，又在孟买的大学受过良好的英式教育。他始终冷静，不动声色地走好每一步，最后当上首相，手里的实权甚至超过了摩诃罗阇。老国王疑心英国人，也不信他们的铁路和电报。老王去世后，曾受英国人教导的新王十分器重普伦·达斯。两人办女童学校，修道路，设邦立诊疗所，还举办农具展览。他们每年出版一本蓝皮书，详细报告本邦在道德和物质上的进步。首相总小心地把功劳让给主人，英国外交部和印度政府因此欢喜极了。
        - id: ch01-b04
          speaker: narrator
          text: 很少有土邦会全盘接受英国式进步，因为他们不肯相信，凡是对英国人有益的东西，对亚洲人就该有双倍好处。普伦·达斯却表现得深信不疑。他结交总督、省督、副督、医疗传教士和普通传教士，也结交那些骑马来邦内猎场打猎的英国军官。冬天，一群群游客在印度到处旅行，教别人怎样办事，也都成了他的朋友。闲下来时，他出钱设立奖学金，让人严格照英国路子研究医学和制造业。他还给印度最大的日报《先驱报》写信，说明自家君主的宗旨和目标。
        - id: ch01-b05
          speaker: narrator
          text: 后来，他去英国访问。回来以后，祭司向他收了一大笔钱，因为再高贵的婆罗门，只要渡过黑海，也算失去了种姓身份。在伦敦，他见遍了所有值得结交的名人，那些人的名字传遍世界。他同他们交谈，却一直看得多，说得少。著名大学给他荣誉学位，他也一次次发表演说，在穿晚礼服的英国女士面前谈印度的社会改革。整个伦敦都为他着迷。
        - id: ch01-b06
          speaker: london_guest
          text: 自从世上有人铺桌布吃饭，我们还从没在宴席上见过这么迷人的人！
          emotion: happy
        - id: ch01-b07
          speaker: narrator
          text: 普伦·达斯回到印度，迎接他的是一片辉煌。总督本人专程前来，把镶满钻石、绶带和珐琅装饰的印度之星大十字勋章授给摩诃罗阇。典礼上礼炮轰鸣，普伦·达斯也获封印度帝国勋章爵级司令。从此，他的全名成了普伦·达斯爵士，印度帝国爵级司令勋章获得者。当天晚上，他佩着勋章和颈饰，在总督的大帐篷里起身，答谢为主人健康而举杯的祝酒辞。他的演说，几乎没有哪个英国人能讲得更好。
        - id: ch01-b08
          speaker: narrator
          text: 一个月后，城里重归烈日下的寂静，他做了一件任何英国人都想不到的事。对世间事务来说，他死了。他交还镶满宝石的勋章，新首相接掌政务，下面所有职位也开始大换位。祭司知道缘故，百姓也猜得到。可在印度，一个人可以照自己的心意生活，没人追问。所以普伦·达斯爵士辞掉权位，离开宫殿，拿起托钵，穿上桑雅西的赭色衣袍，谁也不觉得稀奇。人们知道，桑雅西就是舍弃家室、四处求道的圣人。
        - id: ch01-b09
          speaker: narrator
          text: 古法说，人生先用二十年做青年，再用二十年做战士，接着用二十年做一家之主。普伦·达斯虽然一生从没带过兵器，也算走完了这三段路。他把财富和权力用在自己明知有价值的事上，荣誉走到面前时，他也坦然接受。他看遍远近各处的人和城市，那些人与城市也都曾站起来向他致敬。如今，他愿意让所有这些东西离开自己，就像一个人随手脱掉一件再也用不着的斗篷。
        - id: ch01-b10
          speaker: narrator
          text: 他赤脚独自走出城门，眼睛垂向地面。腋下夹着羚羊皮和铜柄拐杖，手里托着磨亮的棕色海椰壳。身后，堡垒正鸣炮庆贺他那位得意的继任者。他只点了点头。过去的人生已经结束，像一场没有颜色的夜梦，不值得怨，也不值得留恋。他现在是云游四方、没有家室的托钵僧，每天吃什么都要仰赖邻人。只要印度还有一口饭可以分，祭司和乞丐就不会饿死。
        - id: ch01-b11
          speaker: narrator
          text: 他一生不曾吃肉，连鱼也很少入口。那些执掌亿万财富的年头里，任取一年，五英镑都足够付清他自己的饭钱。哪怕在伦敦最受追捧时，他仍守着一个安宁的梦。梦里有一条漫长洁白、落满尘土的印度大路，上面印着无数赤脚足迹。行旅缓缓走个不停。黄昏时，无花果树下飘起辛烈的柴烟，过路人围坐着吃晚饭。时机一到，他便用妥当的办法让梦成真。三天以后，想在印度聚散不定的亿万人中找到他，比在大西洋的浪槽里寻找一颗水泡还难。
    - id: ch02
      title: 向雪山走去
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 黑夜在哪里追上他，他就在哪里铺开羚羊皮。有时是路旁的桑雅西修院，有时是黑圣卡拉·皮尔的泥柱神龛。住在那里的约吉，是圣人中另一个界限模糊的支派。他们明白种姓和派别到底值多少，所以愿意收留他。有时，他睡在印度教小村外，孩子们偷偷送来父母备好的饭。有时，他睡在空旷牧场正中，一小堆树枝火会惊醒昏睡的骆驼。如今，他自称普伦·巴格特。对他来说，所有土地、所有人、所有食物都没有分别。
        - id: ch02-b02
          speaker: narrator
          text: 可他的双脚不知不觉总往东北走。从南方到罗塔克，再到库尔努尔和荒废的萨马纳。随后，他沿格格尔河干涸的河床逆流而上。这条河只有山中下雨才会涨水。终于有一天，远方出现了喜马拉雅山脉的长长轮廓。普伦·巴格特笑了。他母亲是库鲁一带的拉杰普特婆罗门，生在山里，一生思念雪峰。身上哪怕只有一丝山民的血，到最后也会被牵回属于自己的地方。
        - id: ch02-b03
          speaker: purun_bhagat
          text: 就去那边吧。我要在那里坐下，求取真知。
        - id: ch02-b04
          speaker: narrator
          text: 他迎着西瓦利克山的低坡往上走，七枝烛台似的仙人掌立在路旁，喜马拉雅的凉风吹过耳边。上一次走这条路，他排场显赫，有一支马蹄铿锵的骑兵卫队护送，是来拜访历任总督中最温和亲切的一位。两人谈了整整一个钟头，谈伦敦共同的朋友，也谈印度平民对世事真正抱着什么想法。这一次，他谁也不拜访，只倚在西姆拉林荫道的栏杆上，俯看四十英里下方的壮阔平原。一个本地穆斯林警察说他挡住了交通，他便恭敬地向法律行礼。他懂得法律的价值，也正在寻找属于自己的法。
        - id: ch02-b05
          speaker: narrator
          text: 当晚，他睡在小西姆拉一间空屋里。那里像世界的尽头，其实旅程才开始。他沿喜马拉雅—西藏公路前行。十英尺宽的小路，有时从整块岩石中炸出来，有时用木架撑在千英尺深的峡谷上。它落进温暖潮湿的封闭山谷，又爬过光秃草坡，太阳像聚火镜一样灼人。它还会拐进阴暗滴水的森林，树蕨从头到脚裹满树干，雉鸡在林中呼唤伴侣。
        - id: ch02-b06
          speaker: narrator
          text: 路上有带着狗和羊群的西藏牧人，每只羊都驮一袋硼砂。也有流浪樵夫，还有裹着斗篷和毯子、去印度朝圣的喇嘛。小山邦的使者骑着环纹或花斑小马飞驰而过，偶尔还有出访的罗阇和整支随从队伍。但也有一整个晴朗的长日，他只看见谷底一头黑熊哼哼着拱土。刚离开尘世时，旧世界仍在耳边轰响，像火车驶过后久久回荡的隧道。越过马蒂阿尼山口，那声音终于消失了。普伦·巴格特只和自己同行。他一路走，一路惊叹，也一路思索。眼睛望着脚下，心思却跟着云走。
        - id: ch02-b07
          speaker: narrator
          text: 一天傍晚，他结束两天的攀登，翻过一路上最高的山口。眼前忽然出现一列雪峰，像一道高墙横过整片天边。它们高达一万五千到两万英尺，看起来近得扔块石头就能打中，其实远在五六十英里之外。山口顶上长着幽暗浓密的树林，有胡桃、野樱桃、野橄榄和野梨，最多的是喜马拉雅雪松。雪松阴影里立着一座荒废的迦梨神祠。人们也称这位女神为难近母或湿多罗，有时供奉她来抵御天花。
        - id: ch02-b08
          speaker: narrator
          text: 普伦·达斯扫净石地，对咧嘴而笑的神像笑了笑，在神祠后垒起小泥灶。他把羚羊皮铺在新鲜松针做成的褥子上，将那根叫作拜拉吉的铜柄拐杖拢在腋下，坐下来歇息。脚下的山坡笔直落下一千五百英尺，一座石墙夯土顶的小村紧贴陡坡。四周的梯田像拼布围裙摊在大山膝头，小牛如甲虫般在一圈圈平整的石砌打谷场间吃草。
        - id: ch02-b09
          speaker: narrator
          text: 对面山腰看似低矮的灌木，其实是百英尺高的松林。这里的尺度把人的眼睛也骗了。雄鹰飞过巨大的山谷，还没到一半便缩成小点。几带云悬在谷中，有的挂上山肩，有的升到山口高度便消散了。普伦·巴格特望着这一切，知道自己走到了地方。
        - id: ch02-b10
          speaker: purun_bhagat
          text: 我会在这里找到安宁。
          emotion: calm
    - id: ch03
      title: 神祠里的圣人
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 山民从来不把上下几百英尺的山路当回事。村民看见荒废已久的神祠升起炊烟，祭司很快沿一层层梯田爬来迎接陌生人。他一碰上普伦·巴格特的目光，便认出那双眼睛惯于统御千百人。他立刻伏地行礼，一声不响地接过托钵，又匆匆回村告诉大家。
        - id: ch03-b02
          speaker: village_priest
          text: 我们总算迎来一位真正的圣人。我从没见过这样的人。他虽来自平原，肤色却白，是婆罗门中最高贵的婆罗门。
        - id: ch03-b03
          speaker: village_woman
          text: 他会留在我们这里吗？
        - id: ch03-b04
          speaker: narrator
          text: 每个主妇都想给巴格特做最香的饭。山里食材简单，却有荞麦、玉米、稻米和红辣椒，有谷底溪流里的小鱼，也有从石墙烟道般的蜂房里取出的蜂蜜。再添上杏干、姜黄、野姜和面烙饼，虔诚的女人就能做出很好的饭菜。祭司端着满满一钵食物上山，问他会不会留下，要不要一个叫作切拉的弟子替他化缘，有没有抵御寒冬的毯子，饭菜又合不合口。
        - id: ch03-b05
          speaker: narrator
          text: 普伦·巴格特吃过饭，也向送饭的人道谢。他心里确实愿意留下，祭司说，知道这一点便足够了。从此，只要把托钵放在神祠外面，搁进两条弯曲树根围成的凹处，村里每天都会送上食物供养他。祭司有些胆怯地望着巴格特的脸。这样一位圣人肯停留在他们中间，整个村庄都觉得荣耀。
        - id: ch03-b06
          speaker: narrator
          text: 他的漂泊在这一天结束了。他来到命定的地方，来到寂静与辽阔之间。从此，时间仿佛停住。他坐在神祠门口，分不清自己是活是死，是一个仍能支配四肢的人，还是山峦、云朵、流动的雨水和阳光的一部分。他一遍又一遍轻诵圣名，一天要念上千遍万遍。每念一次，他都仿佛离肉身更远，向上飘到某个伟大发现的门前。可门刚要打开，身体总会把他拽回来。他只能悲伤地感觉到，自己又被锁进普伦·巴格特的血肉和骨骼。
        - id: ch03-b07
          speaker: narrator
          text: 每天清晨，装满食物的托钵静静放在树根间。有时祭司送来，有时投宿村里的拉达克商人为积功德，费力爬上来。更多时候，送饭的是头夜做饭的女人。偶尔，一个胆大的孩子也获准来送。他放下钵便撒腿跑远，两条小腿跑得能有多快就有多快。巴格特始终不下村。村庄像地图铺在脚边，打谷场是唯一平地，村民每晚在那里聚会。他能看见嫩稻奇妙得叫不出名字的青绿、靛蓝色的玉米、酸模叶似的荞麦田，还有当季盛放的红苋菜。苋菜籽不是谷物也不是豆类，守斋的印度教徒可以拿它充饥。
        - id: ch03-b08
          speaker: village_woman
          text: 巴格特，请在诸神面前替我说句话，也请替某某人的妻子说句话。
        - id: ch03-b09
          speaker: narrator
          text: 年岁轮转，村里每座茅屋的屋顶都成了纯金色的小方块，因为家家都把一根根玉米棒铺在那里晾晒。收蜂蜜、收庄稼、播稻、舂米，这些农事从他眼前一一经过，仿佛全被细细绣在山下那些多边形的小田里。巴格特把它们全看在眼中，也把它们全放进思绪，猜测这一切到了漫长岁月的尽头，究竟会通向哪里。
    - id: ch04
      title: 巴格特的兄弟
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 即使在印度人口最密的地方，一个人静坐一天，野兽也会把他当成石头，从他身上跑过去。在这片荒野，熟悉迦梨神祠的动物很快回来察看闯入者。最先来的当然是喜马拉雅叶猴。它们身形很大，长着浓密的灰色颊须，浑身都像装满了好奇心。它们弄翻托钵，让它在石地上滚来滚去。它们用牙试咬铜柄拐杖，又冲羚羊皮做鬼脸。最后，它们认定这个一动不动的人没有危险。
        - id: ch04-b02
          speaker: narrator
          text: 傍晚，叶猴从松树上跳下来，伸出两手讨吃的，吃完又荡着优美的弧线离开。它们也喜欢火堆的温暖，总挤得巴格特必须把它们推开才能添柴。早晨，他常发现一只毛茸茸的猴子钻进毯子，同自己睡了一夜。从早到晚，猴群里总有一个坐在身旁，望着雪峰轻声哼唱。那张脸说不出的悲伤，又像藏着说不尽的智慧。
        - id: ch04-b03
          speaker: narrator
          text: 接着来了十二角鹿。这种大鹿比欧洲赤鹿更强壮。它本想在冰冷的神像上蹭掉角上的茸皮，看见神祠里有人，便顿足示威。普伦·巴格特纹丝不动。雄鹿渐渐靠近，用鼻吻碰他的肩。他伸出清凉的手，抚过滚热的鹿角。焦躁的动物安静下来，低下头，让他轻轻揉掉茸皮。
        - id: ch04-b04
          speaker: narrator
          text: 后来，雄鹿带来母鹿和幼鹿。那些温顺的动物会站在圣人的毯子上，一面咕哝，一面咀嚼。雄鹿也会独自在夜里出现，眼睛被跳动的火光映成绿色，来取自己那份新鲜胡桃。最羞怯、几乎也最小的麝鹿竖着兔子般的大耳朵，也走进神祠。连那只安静的斑纹穆希克—纳巴，也非要探究火光是什么。它随着火影时来时去，把驼鹿般的长鼻子垂进巴格特怀中。
        - id: ch04-b05
          speaker: narrator
          text: 巴格特把这些动物全都叫作自己的兄弟。只要它们还在听得见的地方，他中午低低唤两声“巴伊，巴伊”，它们便会离开森林，走到他身边。下巴带着V形白斑的喜马拉雅黑熊索纳也不止一次经过这里。它性情阴沉，又总疑心别人。可是巴格特没有显露恐惧，索纳也就不显露怒意。它先远远观察，随后越走越近，讨几下爱抚，也讨一份面包或野莓。
        - id: ch04-b06
          speaker: narrator
          text: 寂静的黎明，巴格特常爬上山口最高处，看红色的白昼沿着一座座雪峰走来。索纳拖着步子跟在脚后，不断哼哼。它好奇地把一只前掌探到倒下的树干底下，又不耐烦地呼一声，猛然抽回来。有时，巴格特清早的脚步会惊醒蜷睡的索纳。巨兽立刻直立起来，以为自己需要争斗。直到它听见巴格特的声音，才认出眼前人正是自己最好的朋友。
        - id: ch04-b07
          speaker: narrator
          text: 远离大城、独自生活的隐士和圣人，大都有能向野兽施奇迹的名声。其实全部秘诀只是保持不动，绝不匆忙做出动作。至少在很长一段时间里，也绝不直盯来客。村民看见十二角鹿像影子一样穿过神祠后的黑林，看见喜马拉雅虹雉在迦梨神像前展示最绚丽的羽毛，看见叶猴蹲在祠里玩胡桃壳。孩子们还听见索纳藏在坍塌的岩石后，用熊的方式哼唱。于是，巴格特会施奇迹的名声稳稳传开。
        - id: ch04-b08
          speaker: narrator
          text: 可他心里离施展奇迹这种念头再远不过。他相信，万事万物合在一起，本就是一个伟大的奇迹。人能懂得这一点，便真正有了继续求索的根基。他确信世上没有什么真正伟大，也没有什么真正渺小。日日夜夜，他都在努力思索，想穿过万物的表面，走进它们的心，一直回到自己灵魂来时的地方。
        - id: ch04-b09
          speaker: narrator
          text: 岁月一点点留下痕迹。他的长发披到肩头。铜柄拐杖在羚羊皮旁的石板上磨出小坑。每天放钵的树根间，也凹下去一块，光滑得像棕色钵壳。每只动物都知道自己该坐在火边哪里。田野随季节变色，打谷场装满又清空，再一次次装满。冬天，叶猴在覆着薄雪、仿佛生出羽毛的枝头跳跃。春天，母猴从暖谷带来眼神忧郁的幼崽。村庄很少变化，祭司却老了，当年送饭的孩子也派自己的孩子来送。若问村民圣人在山口住了多久，他们只会说，他一直就在那里。
        - id: ch04-b10
          speaker: narrator
          text: 后来，山里降下许多个年头都没有见过的盛夏暴雨。整整三个月，山谷裹在云和浸透一切的湿雾中。雨稳定而无情地落下，偶尔断开，马上又接上一场雷雨，再接一场雷雨。神祠大多立在云层之上。巴格特有整整一个月没看见自己的村庄。村子藏在一层洁白的云下面，云海摇摆、移动、翻卷着自身，又向上鼓起，却总被山谷两侧淌水的斜坡牢牢托住。
        - id: ch04-b11
          speaker: narrator
          text: 那些日子里，四周只有百万道细流的声音。水从头顶的树上落下，也从脚下的地面流过。它浸透松针，从湿漉漉的蕨叶尖滴下，再沿山坡上新冲开的泥沟喷涌而去。后来太阳出来，蒸起雪松和杜鹃如香火般的芬芳，也带来远方那种清冽气息，就是山民所谓“雪的气味”。烈日照了一个星期，雨云又聚拢来倾下最后一场大雨。水幕砸向地面，剥掉大地的表皮，又从泥浆里高高溅起。
        - id: ch04-b12
          speaker: narrator
          text: 那天夜里，普伦·巴格特把火添得很旺。他料想兄弟们淋过这样的雨，一定会需要火边的温暖。可一只野兽也没有来到神祠。他一遍又一遍朝黑暗的森林呼唤，却始终没有等到任何回应。直到自己终于睡去，他心里仍在猜测林中究竟出了什么事。
    - id: ch05
      title: 山崩之夜
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 黑夜最深处，雨像一千面鼓轰鸣。有什么在扯巴格特的毯子。他惊醒伸手，摸到叶猴的小手。
        - id: ch05-b02
          speaker: purun_bhagat
          text: 这里总比树上舒服。把这角毯子拿去，好好暖一暖。
        - id: ch05-b03
          speaker: narrator
          text: 猴子却抓住他的手，用力往外拉。
        - id: ch05-b04
          speaker: purun_bhagat
          text: 是饿了吗？再等一会儿，我给你准备吃的。
        - id: ch05-b05
          speaker: narrator
          text: 他跪起来要往火里添柴，叶猴立刻跑到门边哀鸣，又回来拉扯他的膝盖。那双眼睛里装满了说不出来的事。
        - id: ch05-b06
          speaker: purun_bhagat
          text: 到底怎么了，兄弟？除非你的同族落进陷阱，可这里又没人设陷阱，不然我可不愿走进这场雨。你看，连十二角鹿都来躲雨了。
        - id: ch05-b07
          speaker: narrator
          text: 雄鹿大步闯入，鹿角撞上咧嘴的迦梨神像，铿锵作响。它朝巴格特低下角，不安地跺脚，从半闭的鼻孔里喷气。
        - id: ch05-b08
          speaker: purun_bhagat
          text: 嗨，嗨！我让你住一夜，你就这样报答我吗？
        - id: ch05-b09
          speaker: narrator
          text: 雄鹿却把他推向门口。就在那一刻，他听见什么东西叹息着裂开。两块石地板正彼此分离，下面黏湿的泥土咂起了嘴。他终于明白，今夜为什么没有动物守在火旁。
        - id: ch05-b10
          speaker: purun_bhagat
          text: 原来山要塌了。难怪兄弟们全都离开。可是，我又为什么非走不可？
        - id: ch05-b11
          speaker: narrator
          text: 他的目光落在空托钵上，脸色变了。自从来到这里，山下的人每天给他送来好饭。若不赶快，明天谷里将不剩一张吃饭的嘴。
        - id: ch05-b12
          speaker: purun_bhagat
          text: 我必须下去警告他们。兄弟，先退后，让我到火边去。
        - id: ch05-b13
          speaker: narrator
          text: 十二角鹿不情愿地后退。普伦·巴格特把松枝火把伸进火里转动，直到火焰烧旺。他站了起来。
        - id: ch05-b14
          speaker: purun_bhagat
          text: 原来你们是来救我的。可我们要做得更多。走吧，兄弟，把脖子借我靠着，我毕竟只有两只脚。
        - id: ch05-b15
          speaker: narrator
          text: 他右手抓住雄鹿竖起的鬃甲，左手把火把举得远远的，踏出神祠，走进凶险绝望的黑夜。空气里没有一丝风，暴雨却差点浇灭火焰。大鹿用臀腿向下滑着，匆匆奔下山坡。一离开森林，更多兄弟便围拢过来。巴格特看不清身边拥挤的叶猴，却听见它们穿过雨水的声音。猴群后方，还传来索纳一声又一声沉重的呼喊。
        - id: ch05-b16
          speaker: narrator
          text: 雨把他的白色长发粘成一绺绺绳索。水花在赤脚下飞溅，黄色长袍紧紧贴住衰老虚弱的身体。他仍倚着十二角鹿，一步一步稳稳往下走。此刻，他不再只是一个住在神祠中的圣人。他又成了普伦·达斯爵士，印度帝国爵级司令勋章的获得者，成了那个执掌一个不小的土邦、惯于发号施令的人。现在，这位首相要走进黑夜，去拯救人的性命。
        - id: ch05-b17
          speaker: narrator
          text: 巴格特和野兽们一齐涌下陡峭泥泞的山路，一直往下走，直到鹿蹄磕到打谷场的围墙，踉跄了一下。雄鹿闻见人的气味，立刻喷响鼻子。他们已经来到村中唯一一条弯街的高处。屋檐挡住暴雨，火把在檐下重新旺起来，照亮铁匠家的窗。巴格特举起那根铜柄拐杖，一下又一下猛敲紧闭的窗板。神祠中的漫长岁月里，他从没有这样对人高声呼喊。此刻，连他自己都认不出从胸中传出的嗓音。
        - id: ch05-b18
          speaker: purun_bhagat
          text: 醒来，快出来！山要塌了，山正在塌！屋里的人，全都起来，赶快出来！
          emotion: fearful
        - id: ch05-b19
          speaker: blacksmith_wife
          text: 是我们的巴格特，他和那些野兽站在一起。带上孩子，赶紧通知全村！
        - id: ch05-b20
          speaker: narrator
          text: 呼声从一家传到一家。动物挤在窄街里，推涌着围住巴格特，索纳不耐烦地喷着气。全村总共不过七十人，很快都奔到街上。火光里，他们看见巴格特拉住惊恐的雄鹿，叶猴可怜地扯着他的衣摆，索纳坐起后腿放声怒吼。
        - id: ch05-b21
          speaker: purun_bhagat
          text: 穿过山谷，爬上对面的山！一个人也不许留下！我们跟在后面！
        - id: ch05-b22
          speaker: narrator
          text: 人们以只有山民才有的速度奔跑。他们知道，山崩时必须冲过谷底，往对面最高处爬。众人一路逃下村庄，踏着水花渡过谷底小河，又喘着气冲上另一面的梯田。巴格特和他的野兽兄弟紧紧跟随。他们在对面山坡上越爬越高，一路逐个呼喊彼此的名字，像点名一样清点全村人口。高大的十二角鹿艰难地走在最后，巴格特力气将尽，越来越沉地压在它身上。爬到五百英尺高的一片浓密松林阴影里，雄鹿终于停步。曾警告它灾难将临的本能，也告诉它这里安全。
        - id: ch05-b23
          speaker: narrator
          text: 普伦·巴格特倒在雄鹿身旁，昏了过去。冰冷的雨和刚才那场拼尽全力的攀登，正在一点点夺走他的生命。可在彻底倒下以前，他仍看着前方散落在山坡上的火把，先向获救的人们发出最后一道命令。
        - id: ch05-b24
          speaker: purun_bhagat
          text: 都停下，数清人数！
        - id: ch05-b25
          speaker: narrator
          text: 他看见灯火聚成一团，知道村民已经集合，便对身边的雄鹿轻声说出最后一句话。
        - id: ch05-b26
          speaker: purun_bhagat
          text: 留在我身边，兄弟。陪着我，直到我走。
          emotion: calm
        - id: ch05-b27
          speaker: narrator
          text: 空气中先有一声叹息，叹息渐渐变成低沉的轰鸣。轰鸣又长成咆哮，最后大得超出了耳朵能够承受的界限。村民脚下的山坡在黑暗中遭到猛然一击，随着撞击摇晃起来。紧接着，一道像管风琴低音C那样稳定、深沉而准确的巨响淹没了一切。声音足足延续了五分钟，连脚下松树的根都跟着颤抖。
        - id: ch05-b28
          speaker: narrator
          text: 巨响终于消退，雨水落地的声音也变了。原先，它打在绵延数英里的硬地和草叶上。如今，却像低沉的鼓点一样，闷闷地落在新翻出的松软泥土上。这个声音自己讲明了一切。没有一个村民，连祭司也不敢走过去同救了他们性命的巴格特说话。大家只能蜷缩在松树下，沉默地一直等待天亮。
        - id: ch05-b29
          speaker: narrator
          text: 晨光里，他们望过山谷。从前的森林、梯田和小路交错的牧场，全变成一片鲜红裸露的扇形泥痕。只有几棵树头朝下，被抛在陡坡上。红泥一直冲到他们避难的山坡高处，堵住谷底的小河。河水已经开始四处铺开，聚成一座砖红色的湖。村庄没有一点痕迹，通往神祠的路没有一点痕迹，连神祠本身和后面的森林也全都消失了。一英里宽、两千英尺深的整片山腰，整个从顶到底滑落下来，仿佛被巨大的刨子削得干干净净。
        - id: ch05-b30
          speaker: narrator
          text: 村民一个接一个穿过树林，走到他们的巴格特面前祈祷。十二角鹿一直站在他身旁守着他，等人们真正走近，才转身逃开。叶猴在高高的枝头哀号，索纳也在山坡更高处发出悲鸣。可是，他们的巴格特已经死了。他仍盘腿端坐，后背倚着一棵树，铜柄拐杖安放在腋下，脸朝着东北方向。
        - id: ch05-b31
          speaker: village_priest
          text: 看哪，一个奇迹之后又是一个奇迹！所有桑雅西下葬时都必须保持这个坐姿。我们就在他现在坐着的地方，为圣人建一座神庙。
        - id: ch05-b32
          speaker: narrator
          text: 一年还没有过完，村民便在巴格特死去的地方建起一座泥石小祠。他们把那座山称为巴格特山，直到今天还带着灯火、鲜花和各样供品去那里敬拜。可他们一点也不知道，自己供奉的圣人正是已故的普伦·达斯爵士。他有印度帝国爵级司令勋章，也有民法学博士和哲学博士头衔。他曾经是进步开明的莫希尼瓦拉邦首相，还是数不清的学术与科学团体的荣誉会员或通讯会员。那些团体，无论在今世还是来生，恐怕都永远派不上什么用场。
