  chapters:
    - id: ch01
      title: The Man Who Left Power Behind
      blocks:
        - id: ch01-b01
          speakers: [langur_1, langur_2, langur_3]
          ensemble: chorus
          text: "On the night when the earth was ready to move, we stole in and pulled him by the hand. We loved him with the love of wild creatures, a love that knows but cannot understand."
        - id: ch01-b02
          speakers: [langur_1, langur_2, langur_3]
          ensemble: chorus
          text: "The hillside roared and broke, and our whole world fell in the rain. We Little Folk saved him, but he never came back. Mourn for our brother. We saved him with all the poor love wild creatures have, but he will not wake, and his own kind drive us away."
          emotion: sad
        - id: ch01-b03
          speaker: narrator
          text: "Once there was a man in India who served as Prime Minister of a native State in the northwest. His name was Purun Dass. He was a Brahmin of such high caste that caste itself hardly seemed to matter to him. His father had been an important official in an old fashioned Hindu court, full of color, disorder, and ceremony."
        - id: ch01-b04
          speaker: narrator
          text: "As Purun Dass grew up, he saw that the old way was passing. A man who wished to rise had to please the English and follow everything they called good. At the same time, a native official had to keep the favor of his own ruler. It was a difficult game. Purun Dass was quiet, guarded, and well educated at a university in Bombay. He played that game coolly, climbed from post to post, and became Prime Minister. In truth, he held more power than the Maharajah he served."
        - id: ch01-b05
          speaker: narrator
          text: "The old king distrusted English railways, telegraphs, and English ways. When he died, Purun Dass stood close to the young king who followed him. An Englishman had taught that young ruler. Together they opened schools for girls, built roads, founded dispensaries, displayed new farming tools, and issued a yearly report on the State's moral and material progress. Purun Dass always made sure his master received the praise. The Foreign Office and the Government of India were delighted."
        - id: ch01-b06
          speaker: narrator
          text: "Few native States accepted English ideas of progress so completely. Purun Dass seemed to believe that whatever was good for an Englishman must be twice as good for an Asian. Viceroys, governors, missionaries, hard riding officers, and winter tourists all treated him as an honored friend. Those tourists traveled across India in the cool season, telling people how everything ought to be managed. In spare moments he paid for scholarships in English medicine and manufacturing. He also wrote to the Pioneer, the great Indian newspaper, explaining his ruler's plans."
        - id: ch01-b07
          speaker: narrator
          text: "At last he visited England. Crossing the black sea cost a Brahmin his caste, so when he returned he had to pay the priests enormous sums. In London he met famous people whose names traveled around the world. He watched far more than he said. Universities gave him honorary degrees. He spoke to fashionable English ladies about reform in Hindu society, and London declared him the most fascinating dinner guest anyone could remember."
        - id: ch01-b08
          speaker: narrator
          text: "His return to India brought a blaze of ceremony. The Viceroy came in person to give the Maharajah the Grand Cross of the Star of India, glittering with diamonds, ribbons, and enamel. Cannon boomed while Purun Dass became a Knight Commander of the Order of the Indian Empire. Now his full name was Sir Purun Dass, K.C.I.E. That evening, wearing the badge and collar of his Order in the great Viceregal tent, he rose at dinner and answered a toast to his master's health with a speech few Englishmen could have bettered."
        - id: ch01-b09
          speaker: narrator
          text: "One month later, after the city had settled into its baked, sunny quiet, he did something no Englishman would have imagined. As far as worldly affairs were concerned, he died. He returned the jeweled Order to the Indian Government. Another Prime Minister took his place, and every lower official shifted into a new position. The priests understood. The people guessed. Yet in India a man could choose his own road without everyone asking why."
        - id: ch01-b10
          speaker: narrator
          text: "Sir Purun Dass gave up rank, palace, and power. He took a begging bowl and put on the ochre robe of a Sunnyasi, a holy man. No one found that strange. The Old Law gave twenty years to youth, twenty years to fighting, though Purun Dass had never carried a weapon, and twenty years to leading a household. He had spent wealth and power on the work he thought valuable. He had accepted honor when it came. He had seen distant cities and important men, and they had honored him in return. Now he let it all fall away like a cloak he no longer needed."
        - id: ch01-b11
          speaker: narrator
          text: "He walked through the city gates barefoot and alone, his eyes lowered. An antelope skin and a brass handled crutch rested under his arm, and he carried a polished brown begging bowl made from a coco-de-mer shell. Behind him, guns fired from the walls to honor his happy successor. Purun Dass only nodded. That life had ended. He felt no more love or anger toward it than a waking man feels toward a pale dream from the night."
        - id: ch01-b12
          speaker: narrator
          text: "He called himself Purun Bhagat now. He had no house and wandered wherever the road led, trusting his neighbors for daily bread. In India, while anyone has a morsel to share, neither priest nor beggar starves. Purun Bhagat had never eaten meat and had rarely eaten fish. Even when he controlled millions, five pounds would have paid for all the food he personally ate in a year."
        - id: ch01-b13
          speaker: narrator
          text: "During the years when London had celebrated him, he had kept one dream before his eyes. He saw the long white roads of India, dusty and covered with barefoot prints. He saw the slow traffic that never ended and smelled sharp wood smoke curling beneath the fig trees at dusk, where travelers sat down for their evening meal. When the hour came to make that dream real, he arranged everything properly. Three days later, finding Purun Dass among India's wandering millions would have been harder than finding one bubble in the long Atlantic waves."
        - id: ch01-b14
          speaker: narrator
          text: "Wherever night overtook him, he spread his antelope skin. Sometimes he slept in a roadside monastery for holy men. Sometimes he stopped beside a mud pillar shrine of Kala Pir, where wandering Jogis welcomed anyone who understood the true worth of caste and division. Sometimes children crept out from a Hindu village with food their parents had cooked. Sometimes he lay on open grazing land, where his little fire woke sleeping camels."
        - id: ch01-b15
          speaker: narrator
          text: "Place, people, and food were all the same to Purun Bhagat. Yet without planning it, he moved north and east. He went from the south to Rohtak, from Rohtak to Kurnool, and on to ruined Samanah. Then he followed the dry bed of the Gugger River, which fills only when rain falls in the hills. One day, far ahead, he saw the great line of the Himalayas."
        - id: ch01-b16
          speaker: narrator
          text: "Purun Bhagat smiled. His mother had been a Rajput Brahmin woman from the country near Kulu. She had always longed for the snow peaks, and even the smallest drop of Hill blood will draw a person home in the end."
        - id: ch01-b17
          speaker: purun_bhagat
          text: "Up there, I will sit down and find knowledge."
        - id: ch01-b18
          speaker: narrator
          text: "He climbed the lower Sewalik slopes, where cactus plants stood like seven branched lamps. The cool Himalayan wind whistled around him as he followed the road toward Simla."
    - id: ch02
      title: The Shrine Above the Valley
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: "The last time Purun Dass had traveled that road, cavalry had clattered around him in a grand escort. He had come to visit a gentle and gracious Viceroy, and the two men had spent an hour discussing friends in London and what ordinary Indians truly thought. This time Purun Bhagat called on no one. He leaned against the rail of the Mall and gazed at the plains spread forty miles below. A Mohammedan policeman told him he was blocking the way. Purun Bhagat bowed respectfully to the Law. He knew its value, and now he was searching for a Law of his own."
        - id: ch02-b02
          speaker: narrator
          text: "He moved on and slept in an empty hut at Chota Simla. It looked like the very edge of the earth, but his journey had only begun. He took the narrow Himalaya and Tibet road. In places it was cut from solid rock. In others, wooden beams held its ten foot width above drops a thousand feet deep. It dipped into warm, wet valleys shut in by mountains, then climbed out across bare green shoulders where the sun burned like a glass held over a flame. It turned again into dripping forests, where tree ferns clothed the trunks from root to crown and pheasants called to their mates."
        - id: ch02-b03
          speaker: narrator
          text: "He passed Tibetan herdsmen with their dogs and flocks of sheep, each sheep carrying a little sack of borax on its back. He met wandering woodcutters and cloaked, blanketed Lamas coming from Tibet on pilgrimage. Messengers from lonely Hill States galloped past on striped and spotted ponies. Sometimes a Rajah's whole procession filled the road. On other clear days, from morning until night, the only living thing he saw was a black bear grunting and digging far below in the valley."
        - id: ch02-b04
          speaker: narrator
          text: "At first, the noise of the world he had left still sounded in his mind, like a tunnel roaring after the train has gone. Once Mutteeanee Pass lay behind him, the sound ended. Purun Bhagat walked alone, wondering and thinking, with his eyes on the earth and his thoughts among the clouds."
        - id: ch02-b05
          speaker: narrator
          text: "One evening, after climbing for two days, he crossed the highest pass he had yet found. A wall of snowy peaks filled the horizon. They rose fifteen to twenty thousand feet, and looked close enough for a thrown stone to reach, though they stood fifty or sixty miles away. Dark forest covered the pass. Walnut, wild cherry, wild olive, and wild pear grew there, but most of the trees were deodars, the cedars of the Himalayas. Beneath them stood an abandoned shrine to Kali, the goddess also called Durga and Sitala, whom some people worship against smallpox."
        - id: ch02-b06
          speaker: narrator
          text: "Purun Bhagat swept the stone floor. He smiled at the grinning image of the goddess, built a small fireplace from mud at the back, and laid his antelope skin on fresh pine needles. Then he tucked his brass handled crutch beneath his arm and rested."
        - id: ch02-b07
          speaker: narrator
          text: "Below him, the cleared hillside dropped fifteen hundred feet to a tiny village. Stone houses with roofs of beaten earth clung to the steep ground. Little terraced fields spread around them like patchwork aprons across the mountain's knees. Cows that looked no larger than beetles grazed between the smooth stone circles used for threshing grain."
        - id: ch02-b08
          speaker: narrator
          text: "Distance played tricks across the enormous valley. What looked like low bushes on the opposite slope was really a forest of hundred foot pines. An eagle swept into the open space and dwindled to a speck before it had crossed halfway. Thin bands of cloud drifted along the valley. Some caught against a shoulder of rock. Others rose and vanished when they reached the height of the pass."
        - id: ch02-b09
          speaker: purun_bhagat
          text: "Here I will find peace."
        - id: ch02-b10
          speaker: narrator
          text: "A Hill man thinks little of climbing a few hundred feet. As soon as smoke appeared above the abandoned shrine, the village priest came up the terraces to greet the stranger. He looked into Purun Bhagat's eyes and saw the gaze of a man who had once commanded thousands. The priest bowed to the earth, took the begging bowl without speaking, and carried it back to the village."
        - id: ch02-b11
          speaker: village_priest
          text: "At last, a holy man has come to us. I have never seen anyone like him. He comes from the Plains, but his skin is pale. He is a Brahmin above other Brahmins."
        - id: ch02-b12
          speakers: [housewife_1, housewife_2, housewife_3]
          ensemble: chorus
          text: "Do you think he will stay with us?"
        - id: ch02-b13
          speaker: narrator
          text: "Each woman tried to prepare the finest meal. Hill food was simple, but a devout cook could do much with buckwheat, corn, rice, red pepper, little fish from the stream, honey from hives built into the stone walls, dried apricots, turmeric, wild ginger, and flat cakes of flour. The priest carried a full bowl up to the shrine. He asked if Purun Bhagat meant to stay. Did he want a disciple to beg for him? Did he own a blanket for the cold? Was the food good?"
        - id: ch02-b14
          speaker: narrator
          text: "Purun Bhagat ate and thanked the person who had given the meal. He said he intended to remain. That answer satisfied the priest. He explained that the bowl should be left outside, in the hollow between two twisted roots. The village would fill it every day. Everyone felt honored that such a man might live among them, though the priest spoke timidly as he looked into the Bhagat's face."
        - id: ch02-b15
          speaker: narrator
          text: "Purun Bhagat's wandering ended that day. He had reached the place meant for him, a place of silence and open space. Time seemed to stop. Sitting at the shrine's entrance, he could hardly tell whether he lived or had died, whether he was still a man who ruled his own limbs or had become part of the hills, clouds, rain, and moving sunlight."
        - id: ch02-b16
          speaker: narrator
          text: "He repeated one sacred Name softly, hundreds and hundreds of times. With each repetition he seemed to rise farther from his body and sweep toward the doors of a tremendous discovery. Just as those doors began to open, his body pulled him back. Then grief came over him because he was locked once more inside the flesh and bones of Purun Bhagat."
        - id: ch02-b17
          speaker: narrator
          text: "Every morning someone quietly set the filled bowl among the roots. Sometimes the priest brought it. Sometimes a Ladakhi trader staying in the village climbed up, hoping to earn religious merit. Most often, the woman who had cooked the meal came herself and whispered so softly that the forest almost swallowed her words."
        - id: ch02-b18
          speaker: housewife_1
          text: "Bhagat, speak for me before the gods. Speak for me, the wife of my husband."
        - id: ch02-b19
          speaker: narrator
          text: "Now and then a brave child received the honor. Purun Bhagat would hear the bowl drop and then hear little feet race away. He never went down to the village. It lay beneath him like a map. In the evening, people gathered on the round threshing floors, the only level ground. He watched young rice shine in a green too strange to name. Corn stood in deep indigo blue, buckwheat spread in broad patches, and red amaranth bloomed in its season. Its tiny seeds were neither grain nor pulse, so Hindus could lawfully eat them while fasting."
        - id: ch02-b20
          speaker: narrator
          text: "As the year turned, corn cobs drying on the roofs made every hut a square of pure gold. Bee keeping and harvest, rice planting and husking, all passed below his eyes across the many shaped fields. He thought about each labor and wondered where it would all lead in the end."
    - id: ch03
      title: Brothers of the Forest
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: "Even in crowded parts of India, a person cannot sit still for long before wild creatures begin to cross him as if he were a stone. In that lonely place, the animals who had always known Kali's shrine soon returned to inspect its new inhabitant. The langurs came first. Those large Himalayan monkeys, with their gray whiskers, are filled with curiosity."
        - id: ch03-b02
          speaker: narrator
          text: "They tipped over the begging bowl and rolled it across the floor. They tested the brass handle of the crutch with their teeth and pulled faces at the antelope skin. At last they decided that the motionless man meant no harm. In the evening they dropped from the pines, held out their hands for food, and swung away in long, easy curves. They loved the fire. They crowded so close that Purun Bhagat had to push them aside whenever he added wood. Many mornings he woke to find a furry monkey beneath his blanket. Through the day, one or another sat beside him, gazing at the snow, crooning, and looking impossibly wise and sad."
        - id: ch03-b03
          speaker: narrator
          text: "Next came the barasingh, a stag like a red deer but stronger. He wanted to scrape the velvet from his antlers against the cold stone image of Kali. When he found a man in the shrine, he stamped. Purun Bhagat did not move. The great stag edged nearer and nearer until he touched the man's shoulder with his nose. Purun Bhagat passed a cool hand over the hot antlers. The troubled animal grew quiet, lowered his head, and let the Bhagat gently rub away the velvet."
        - id: ch03-b04
          speaker: narrator
          text: "After that, the stag brought his doe and fawn. The gentle pair mouthed the holy man's blanket. Sometimes the stag came alone at night, his eyes green in the firelight, to claim fresh walnuts. Then the musk deer arrived, one of the smallest and shyest deer, with great ears like a rabbit's. Even the silent, brindled mushick-nabha came to discover why the shrine held light. She slipped in and out with the fire shadows and laid her long, heavy nose in Purun Bhagat's lap."
        - id: ch03-b05
          speaker: narrator
          text: "He called every animal his brother. When he gave his low call, they came from the woods at noon if they were close enough to hear."
        - id: ch03-b06
          speaker: purun_bhagat
          text: "Bhai! Bhai! Brothers, come."
        - id: ch03-b07
          speaker: narrator
          text: "Sona, the Himalayan black bear with a white V beneath his chin, passed the shrine more than once. He was suspicious and moody. But Purun Bhagat showed no fear, so Sona showed no anger. The bear watched him, crept closer, and began to ask for strokes, bread, or wild berries."
        - id: ch03-b08
          speaker: narrator
          text: "In the quiet dawn, the Bhagat often climbed to the top of the pass to watch red daylight travel over the snowy peaks. Sona shuffled at his heels, grunting and poking a curious paw beneath fallen logs. When he found nothing, he pulled it out with an impatient whoof. At other times, the Bhagat's early steps woke the sleeping bear. Sona rose upright, ready to fight, until he heard his friend's voice and knew him."
        - id: ch03-b09
          speaker: narrator
          text: "People often say that hermits and holy men who live far from cities can work miracles with wild animals. The whole miracle is this. Keep still. Make no sudden movement. For a long while, do not look straight at the visitor. That is enough to let a wild creature lose its fear. The villagers saw the barasingh pass like a shadow through the dark forest behind the shrine. They saw the bright Himalayan pheasant blazing in her finest colors before Kali's image. They saw langurs sitting inside, turning walnut shells in their hands. Some children heard Sona singing to himself in the way bears sing, hidden behind the fallen rocks. So everyone believed firmly that the Bhagat worked miracles."
        - id: ch03-b10
          speaker: narrator
          text: "Miracles were far from Purun Bhagat's thoughts. He believed that everything together was one great Miracle, and that knowing this gave a man firm ground to stand on. He knew there was nothing truly great and nothing truly small in the world. Day and night he tried to think his way into the heart of all things, back toward the place from which his soul had come."
        - id: ch03-b11
          speaker: narrator
          text: "His uncut hair grew over his shoulders. The foot of his crutch wore a small hollow into the stone beside his antelope skin. The begging bowl, set between the same roots each day, shaped another smooth hollow almost like its own brown shell. Every animal learned its place beside the fire."
        - id: ch03-b12
          speaker: narrator
          text: "The fields changed color with the seasons. The threshing floors filled, emptied, and filled again. Each winter the langurs played among branches feathered with pale snow. Each spring the mother monkeys brought their sad eyed babies back from the warmer valleys. Little changed among the people. The priest grew old. Children who had once carried the begging bowl began sending their own children with it. If anyone asked how long the holy man had lived in Kali's shrine above the pass, the villagers gave only one answer."
        - id: ch03-b13
          speakers: [housewife_1, housewife_2, housewife_3]
          ensemble: chorus
          text: "He has always been there."
    - id: ch04
      title: The Mountain Begins to Fall
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: "Then summer brought rain unlike any the Hills had known for many seasons. For three full months, cloud and soaking mist covered the valley. Rain fell without mercy, pausing only to break into one thunderstorm after another. Most of the time Kali's shrine stood above the clouds. For one whole month, Purun Bhagat never saw the village. A white floor hid it. That cloud floor swayed, rolled over itself, and pushed upward, but it never broke loose from the streaming walls of the valley."
        - id: ch04-b02
          speaker: narrator
          text: "All around him sounded a million little streams. Water fell from branches overhead and ran beneath the pine needles. It dripped from the ends of beaten down ferns and burst through fresh channels of mud on the slopes. Then the sun returned. Warmth drew the rich scent from deodars and rhododendrons, along with the distant clean fragrance that Hill people call the smell of the snows."
        - id: ch04-b03
          speaker: narrator
          text: "The hot sun stayed for a week. After that, the rains gathered for one last outpouring. Water dropped in solid sheets, stripped the skin from the ground, and sprang back as mud. Purun Bhagat built a high fire that night because he knew his brothers would need warmth. Not one animal came. He called again and again, then fell asleep, still wondering what had happened in the forest."
        - id: ch04-b04
          speaker: narrator
          text: "In the blackest part of the night, with rain beating like a thousand drums, something tugged his blanket. Purun Bhagat reached out and touched the small hand of a langur. Still half asleep, he loosened a fold for the monkey."
        - id: ch04-b05
          speaker: purun_bhagat
          text: "It is safer here than in the trees, Brother. Take this part of the blanket and get warm."
        - id: ch04-b06
          speaker: narrator
          text: "The langur seized his hand and pulled with all its strength."
        - id: ch04-b07
          speaker: purun_bhagat
          text: "Are you hungry, then? Wait a little, and I will make food for you."
        - id: ch04-b08
          speaker: narrator
          text: "As he knelt to feed the fire, the langur rushed to the doorway, crooned, ran back, and tugged at his knee. Its eyes held a message it had no words to tell."
        - id: ch04-b09
          speaker: purun_bhagat
          text: "What is wrong, Brother? What trouble has found you? Unless another langur is caught in a trap, and no one sets traps here, I will not step into that storm. Look, even the barasingh has come inside for shelter."
        - id: ch04-b10
          speaker: narrator
          text: "The stag strode into the shrine. His antlers struck each other and clashed against Kali's grinning stone face. He lowered them toward Purun Bhagat, stamped nervously, and forced air through nearly closed nostrils."
        - id: ch04-b11
          speaker: purun_bhagat
          text: "Hai! Hai! Is that how you repay me for a night's shelter?"
        - id: ch04-b12
          speaker: narrator
          text: "The stag pushed him toward the door. Then Purun Bhagat heard something open with a sigh. Two slabs of the stone floor moved apart, and the wet earth beneath them made a sucking sound. At once he understood."
        - id: ch04-b13
          speaker: purun_bhagat
          text: "Now I see. My brothers had good reason to stay away from the fire. The mountain is falling. But why should I leave?"
        - id: ch04-b14
          speaker: narrator
          text: "His gaze fell on the empty begging bowl, and his face changed."
        - id: ch04-b15
          speaker: purun_bhagat
          text: "They have brought me food every day since I came here. If I do not hurry, tomorrow there will be no one left alive in the valley. I must go down and warn them. Back, Brother. Give me room to reach the fire."
        - id: ch04-b16
          speaker: narrator
          text: "The barasingh stepped back unwillingly. Purun Bhagat thrust a pine branch deep into the flames and turned it until it burned as a torch."
        - id: ch04-b17
          speaker: purun_bhagat
          text: "Ah, you came to save me. We will do better than that. Outside now, Brother, and let me hold your neck. I have only two feet."
        - id: ch04-b18
          speaker: narrator
          text: "With his right hand he gripped the rough hair above the stag's shoulders. With his left he held the torch away from them. Then they stepped from the shrine into that desperate night. No wind blew, yet the downpour almost drowned the flame. The great deer hurried downhill, sometimes sliding on his hindquarters."
        - id: ch04-b19
          speaker: narrator
          text: "Beyond the forest, more of the Bhagat's brothers closed around them. He could not see the langurs, but heard them pressing near. Behind them came Sona's heavy grunts. Rain twisted Purun Bhagat's long white hair into ropes. Water splashed beneath his bare feet, and his yellow robe clung to his thin old body. Still he descended with steady steps, leaning against the barasingh."
        - id: ch04-b20
          speaker: narrator
          text: "He was no longer only a holy man. He was Sir Purun Dass, Knight Commander and Prime Minister, a man trained to command, going out to save lives. Down the steep flooded path they poured together, Bhagat and animals, until the deer's feet struck the wall of a threshing floor. The stag stumbled and snorted at the scent of human beings."
        - id: ch04-b21
          speaker: narrator
          text: "They had reached the top of the village's one crooked street. Under the blacksmith's eaves, the torch flared. Purun Bhagat hammered his crutch against the barred windows. When he shouted, he hardly knew his own voice. Years had passed since he had spoken aloud to another person."
        - id: ch04-b22
          speaker: purun_bhagat
          text: "Wake up and come out! The hill is breaking loose! Everyone inside, get up and come out!"
          emotion: fearful
        - id: ch04-b23
          speaker: blacksmith_wife
          text: "It is our Bhagat. He is standing there with all his animals. Gather the children and call the village."
        - id: ch04-b24
          speaker: narrator
          text: "The warning passed from house to house. The narrow lane trapped the animals close together. They pushed and huddled around the Bhagat while Sona breathed in impatient bursts. No more than seventy people lived there. They hurried into the street carrying torches and saw their holy man restraining the terrified stag. Monkeys pulled miserably at his robe, and Sona sat upright and roared."
        - id: ch04-b25
          speaker: purun_bhagat
          text: "Cross the valley and climb the next hill! Make sure no one is left behind. We will come after you!"
        - id: ch04-b26
          speaker: narrator
          text: "The people ran with the speed of Hill folk. They knew that when a landslide threatened, safety lay on the highest ground across the valley. They splashed through the little river at the bottom and struggled up the terraced fields on the other side. Purun Bhagat and his animal brothers followed."
        - id: ch04-b27
          speaker: narrator
          text: "Higher and higher they climbed. Villagers called each other by name, taking a roll call as they ran. Behind them, the barasingh labored under Purun Bhagat's failing weight. Five hundred feet above the valley, the stag stopped beneath a deep pinewood. The instinct that had warned him about the slide now told him this place was safe."
        - id: ch04-b28
          speaker: narrator
          text: "Purun Bhagat collapsed beside him. The freezing rain and the brutal climb were killing the old man. Before he fainted, he called toward the separate torchlights ahead."
        - id: ch04-b29
          speaker: purun_bhagat
          text: "Stop there and count everyone."
        - id: ch04-b30
          speaker: narrator
          text: "The lights drew together. Purun Bhagat turned to the stag and whispered."
        - id: ch04-b31
          speaker: purun_bhagat
          text: "Stay with me, Brother. Stay until I go."
          emotion: calm
    - id: ch05
      title: The Bhagat's Hill
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: "A sigh passed through the air. It deepened into a mutter, the mutter became a roar, and the roar grew too vast for hearing. In the darkness, something struck the hillside where the villagers stood and shook it with the blow. Then one steady, deep note covered every other sound. It was as low and true as the deepest C of a great organ. For perhaps five minutes it continued, while the roots of the pine trees trembled."
        - id: ch05-b02
          speaker: narrator
          text: "The note faded. Rain had been ringing on miles of hard ground and grass. Now its sound became a dull drumming on soft earth. That change told the villagers what had happened."
        - id: ch05-b03
          speaker: narrator
          text: "No one, not even the priest, dared speak to the Bhagat who had saved them. They crouched beneath the pines and waited for daylight. When morning came, they looked across the valley. Forest, terraces, and grazing land crossed by little paths had vanished. In their place lay one raw red stain shaped like a fan, with a few trees thrown headfirst down the torn slope."
        - id: ch05-b04
          speaker: narrator
          text: "The red earth had swept high up the hill where they had taken shelter. It blocked the little river, which was already spreading into a lake the color of brick. The village was gone. So were the road to the shrine, the shrine itself, and all the forest behind it. A piece of mountain one mile wide and two thousand feet deep had broken away as one body. The slope had been scraped clean from top to bottom."
        - id: ch05-b05
          speaker: narrator
          text: "One by one, the villagers crept through the trees to pray before their Bhagat. The barasingh stood over him until the people drew near, then fled. Langurs wailed among the branches. Farther up the hill, Sona moaned. Purun Bhagat was dead. He sat cross legged with his back against a tree, his crutch tucked beneath his arm, and his face turned toward the northeast."
        - id: ch05-b06
          speaker: village_priest
          text: "See this miracle upon a miracle. Every Sunnyasi must be buried in this very position. We will build the temple to our holy man on the place where he sits."
        - id: ch05-b07
          speaker: narrator
          text: "Before a year had passed, they built a little shrine of stone and earth. They named the place the Bhagat's Hill. To this day, people worship there with lamps, flowers, and offerings."
        - id: ch05-b08
          speaker: narrator
          text: "Yet they do not know the full name of the saint they honor. He was the late Sir Purun Dass, Knight Commander, Doctor of Civil Law, Doctor of Philosophy, once Prime Minister of the progressive and enlightened State of Mohiniwala. He had belonged to more learned and scientific societies than could ever do any good in this world or the next."
