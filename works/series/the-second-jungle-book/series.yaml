cover_prompt: |-
  A wordless cover scene at the Peace Rock during a severe drought in the forests of central India in the late nineteenth century gathers many jungle animals under a water truce. A lean brown-skinned Indian boy of about thirteen with sun-bleached shaggy black hair and a simple russet waistcloth kneels at the shrinking river beside a sleek black panther and a large shaggy sloth bear. Across the shallows, a towering gray Asian elephant and his three sons stand watch while deer, wild pigs, buffalo, wolves, and a striped Bengal tiger drink without hunting one another. The boy cups the last clear water in his hands as every animal turns toward the shared pool, making fragile peace the focal action. Use a wide child-height view with cracked banks, dry bamboo, heat-hazed forest ridges, and the long pale rock leading the eye into the gathering, leaving calm open sky at the top. Keep the people, animals, plants, and landscape faithful to India around the 1890s, with restrained expressions and no resemblance to later film or animation designs. No readable text, letters, numbers, labels, logos, captions, speech bubbles, signatures, or watermarks.
