audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 叙述者
      tts:
        delivery: 清楚沉静，简洁报出书信日期与场景转换
        timbre: 温暖清澈
        pace: 舒缓
        pitch: 中音
    judy:
      display_name: 朱迪
      tts:
        delivery: 聪敏直率，像把心事和见闻亲口讲给亲近的人
        timbre: 明亮自然的年轻女声
        pace: 轻快而富于变化，伤心时稍慢
        pitch: 中高音
  chapters:
    - id: ch01
      title: 8月19日：我要到树林里去啦
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 8月19日，朱迪从海边写信给长腿叔叔。
        - id: ch01-b02
          speaker: judy
          text: 亲爱的长腿叔叔，我窗外是世上最美的风景。不对，应该叫海景，因为放眼望去，只有海水和礁石。
        - id: ch01-b03
          speaker: judy
          text: 暑假眼看就要过去。每天上午，我都得应付拉丁文、英文、代数，还有那两个笨学生。我真想不出玛丽恩怎么考得进大学，就算考进去，又怎么留得下来。弗洛伦丝更是没救了，可她偏偏长得那么漂亮。一个姑娘只要漂亮，聪明不聪明也许根本不要紧吧？不过，她们要是没找到同样愚笨的丈夫，婚后说起话来，准会把人闷坏。好在世上似乎到处都是笨男人，这个夏天我已经见过好几个了。
        - id: ch01-b04
          speaker: judy
          text: 到了下午，我们就去悬崖边散步。潮水合适的时候，还会下海游泳。我在咸水里游得毫不费力。您看，我受的教育这么快就派上用场了！
          emotion: happy
        - id: ch01-b05
          speaker: judy
          text: 杰维斯·彭德尔顿先生从巴黎寄来一封信，短得干脆利落。我不肯照他的劝告做，他还没有完全消气。不过，他要是及时回来，会在开学前到洛克柳庄园看我几天。照信里的意思，我只要又亲切、又甜美、又听话，他就肯重新喜欢我。
        - id: ch01-b06
          speaker: judy
          text: 莎莉也写信来了。她要我九月去她家的营地住两个星期。这回还得先问您吗？难道我还没到能自己做主的时候？当然已经到了，我可是四年级学生。整个夏天都在用功，我觉得自己该有一点对身体有益的消遣，好好休息一下。我想看阿迪朗达克山，想见莎莉，也想见莎莉的哥哥。他答应教我划独木舟。
        - id: ch01-b07
          speaker: judy
          text: 不过，我真正的动机有点小气。我想等杰维少爷赶到洛克柳庄园时，让他发现我根本不在那里。我非叫他知道，他不能对我发号施令。只有您能管我，叔叔，而且连您也不是每次都管得住！我要到树林里去啦。朱迪。
    - id: ch02
      title: 9月6日：麦克布赖德营地
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 到了9月6日，朱迪已经在麦克布赖德营地住了五天。
        - id: ch02-b02
          speaker: judy
          text: 亲爱的叔叔，您的信没能及时赶到，我很高兴。您要是真想让人听从命令，就该叫秘书在两个星期以内把信送来。您也看到了，我已经在营地，而且已经住了五天。
        - id: ch02-b03
          speaker: judy
          text: 这里的树林好，营地好，天气好，麦克布赖德一家好，连整个世界都好。我快活得不得了！
          emotion: happy
        - id: ch02-b04
          speaker: judy
          text: 吉米正叫我去划独木舟呢。再见。没有听您的话，我很抱歉，可您为什么说什么也不肯让我玩一小会儿？我用功了一整个夏天，当然该休息两个星期。您就像那只守着干草、自己不吃也不让别人吃的狗。
        - id: ch02-b05
          speaker: judy
          text: 不过，叔叔，您虽然有这么多缺点，我还是爱您。朱迪。
    - id: ch03
      title: 10月3日：衣裳与男人的心计
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 10月3日，朱迪回到大学，开始了四年级生活。
        - id: ch03-b02
          speaker: judy
          text: 亲爱的长腿叔叔，我又回到大学了，不但成了四年级学生，还当上了《月刊》的编辑。谁能相信，这样一个深谙世故的人，四年前还是约翰·格里尔孤儿院的院童呢？我们美国人向上爬得可真快！
        - id: ch03-b03
          speaker: judy
          text: 杰维少爷有一封短信寄到洛克柳庄园，又转到了这里。他说很抱歉，今年秋天去不成了。他答应跟几个朋友乘游艇出海，还祝我暑假愉快，希望我喜欢乡下。可朱莉娅早就告诉他，我正跟麦克布赖德一家住在一起，他明明知道！你们男人还是别玩心计了，这种事该交给女人，你们的手法实在不够轻巧。
        - id: ch03-b04
          speaker: judy
          text: 朱莉娅带来满满一衣箱的新衣裳，漂亮得让人眼花。里面有件彩虹色的利伯蒂绉绸晚礼服，天堂里的天使穿上都很合适。我原先觉得，自己今年的衣服已经美得前所未有了。真有“前所未有地美”这种说法吗？我找了个收费便宜的裁缝，照着帕特森太太的衣橱做了一套。成品虽说不大像原样的双胞胎，朱莉娅没开箱以前，我还是满意得很。可她一件件取出新衣服，我的得意也跟着没了。现在，我活着就是为了有一天能去看看巴黎！
        - id: ch03-b05
          speaker: judy
          text: 亲爱的叔叔，幸亏您不是女孩子，对不对？您准觉得，我们为衣服这么大惊小怪，蠢得无可救药。确实很蠢，这一点不用怀疑。可这全怪你们男人。
        - id: ch03-b06
          speaker: judy
          text: 有位学问渊博的德国教授，特别瞧不起没用的装饰，一心提倡女人穿明智实用的衣服。他的妻子很好说话，就照他的主张改革了服装。结果您猜怎么了？教授跟一个歌舞女郎私奔了。永远属于您的朱迪。
        - id: ch03-b07
          speaker: judy
          text: 又及，我们这层走廊的女服务员总穿蓝格子棉布围裙。我准备送她几条棕围裙，再把蓝的全沉到湖底。每回看见那些蓝格子，我都会想起从前，冷得打个寒战。
    - id: ch04
      title: 11月17日：文学事业遭了霜冻
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 11月17日，朱迪的文学事业遭遇了第一次沉重打击。
        - id: ch04-b02
          speaker: judy
          text: 亲爱的长腿叔叔，我的文学事业遭了一场可怕的霜冻。我本来不知道该不该告诉您，可我需要一点同情。请您只在心里同情我，下一封信千万别提，免得伤口又裂开。
          emotion: sad
        - id: ch04-b03
          speaker: judy
          text: 我写了一本书。去年冬天每天晚上都在写，今年夏天只要不用教那两个笨孩子拉丁文，我也在写。开学以前总算写完了，我把稿子寄给一家出版社。他们足足留了两个月，我越等越认定一定会采用。可是昨天早晨，快递送回一个包裹，还要我补付三十美分。稿子原封不动地回到我手里，另外附着出版人的信。那封信亲切得像父亲，可说得真坦白。
        - id: ch04-b04
          speaker: judy
          text: 他从地址看出我还在大学，便劝我把全部精力放在功课上，毕业以后再开始写作。他还寄回了审稿意见，上面说：“情节很不可信，人物写得太夸张，对白也不自然。作品颇有幽默，不过有时趣味不高。叫她继续尝试，也许以后能写出一本真正的书。”
        - id: ch04-b05
          speaker: judy
          text: 叔叔，这怎么也算不上恭维吧？我还真以为自己给美国文学添了一部了不起的作品。我原本想在毕业前写成一部伟大的小说，让您大吃一惊。去年圣诞节住在朱莉娅家时，我还认真搜集了素材，把那里的见闻都当成了小说材料。不过，编辑大概没说错。要观察一座大城市的风俗习惯，两个星期恐怕太短了。
        - id: ch04-b06
          speaker: judy
          text: 昨天下午，我带着那部稿子出去散步。走到煤气厂，我进去问工程师，能不能借他的炉子。他很客气地替我开了炉门，我亲手把稿子扔了进去。那感觉就像火化了自己唯一的孩子！
          emotion: sad
        - id: ch04-b07
          speaker: judy
          text: 昨晚睡觉时，我彻底灰了心。我觉得自己永远不会有出息，您花在我身上的钱也全浪费了。可是您猜今天怎样？我一觉醒来，脑子里已经有了一个绝妙的新情节。整整一天，我走到哪里都在琢磨书里的人物，快活极了。谁也不能说我是悲观主义者！
          emotion: happy
        - id: ch04-b08
          speaker: judy
          text: 要是哪天我的丈夫和十二个孩子全叫地震吞了，第二天早晨，我照样会笑着冒出头来，动手另找一套。亲爱的您的朱迪。
    - id: ch05
      title: 12月14日：自由意志与一支流泪的钢笔
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 12月14日，朱迪从一个古怪又有趣的梦说起。
        - id: ch05-b02
          speaker: judy
          text: 亲爱的长腿叔叔，昨晚我做了个最好笑的梦。我走进一家书店，店员拿给我一本新书，叫《朱迪·艾博特的生平与书信》。那本书清清楚楚就在眼前。封面包着红布，上面印着约翰·格里尔孤儿院。卷首还有我的肖像，底下写着“谨此致意，朱迪·艾博特”。
        - id: ch05-b03
          speaker: judy
          text: 我正要把书翻到最后，读一读自己墓碑上究竟刻了什么，偏偏在这时候醒了。真叫人生气！我差一点就能知道，以后会嫁给谁，又会在什么时候死。
        - id: ch05-b04
          speaker: judy
          text: 要是能读到自己一生的故事，而且那是一位无所不知的作者完完全全照实写下来的，不是很有意思吗？不过，读它有一个条件。你一旦看过，永远也忘不掉。往后做任何事，都提前知道结果会怎样，一辈子都带着这份预知往前走，还能准确预见自己死在哪一天、哪一个钟头。
        - id: ch05-b05
          speaker: judy
          text: 真有这样一本书，多少人敢把它读完？又有多少人能压住好奇，坚决不读？哪怕读下去的代价，是这一辈子从此没有希望，也没有惊喜。
        - id: ch05-b06
          speaker: judy
          text: 人活着本来已经够单调了，隔不了多久就得吃饭、睡觉。再想一想，要是两顿饭之间连一件意外都不会发生，那日子该单调得多么要命。天哪！叔叔，纸上落了一大团墨水。可我已经写到第三页，不能换张纸从头来了。
        - id: ch05-b07
          speaker: judy
          text: 今年我又接着学生物学，这门课很有意思。我们现在研究消化系统。显微镜下面，猫的十二指肠横切面可爱得不得了，真该让您也看一眼。
        - id: ch05-b08
          speaker: judy
          text: 我们还开始学哲学了。它也有意思，可那些思想一转眼就从脑子里跑掉。我更喜欢生物学，因为讨论的东西能钉到板子上。又一滴墨水！又来一滴！这支钢笔哭得真厉害，请您原谅它流个不停。
        - id: ch05-b09
          speaker: judy
          text: 您相信自由意志吗？我毫无保留地相信。我根本不同意那些哲学家。他们说，每一个行动都是许多久远原因合在一起以后，必然又自动产生的结果。我从没听过比这更不道德的学说。照这样说，无论谁做了什么，都不该受到责备。
        - id: ch05-b10
          speaker: judy
          text: 一个人如果信宿命，自然会坐下来，说一句“愿主的旨意成全”，然后一直坐着，直到倒下死掉。我绝对相信自己的自由意志，也相信自己有力量做成想做的事。能移山的正是这种信念。您等着看吧，我一定会成为伟大的作家！新书我已经写完四章，另外五章也打好了草稿。
        - id: ch05-b11
          speaker: judy
          text: 这封信实在太深奥。叔叔，您的头疼了吗？今天就说到这里，我们要去做软糖了。真遗憾，不能寄一块给您尝尝。这一次做出来的软糖准会格外好吃，因为我们要用真正的奶油，还会放三大块黄油。亲爱的您的朱迪。
        - id: ch05-b12
          speaker: judy
          text: 又及，体育课正在学花式舞蹈。看看信里附的图，就知道我们多像一支真正的芭蕾舞团。站在最后面，正优美地单脚旋转的那个是我。不对，应该说，是本人。
