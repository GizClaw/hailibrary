audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm, observant storytelling with a dry touch of humor
        timbre: clear and gently textured
        pace: measured and flowing
        pitch: medium
    jerusha:
      display_name: Jerusha Abbott
      tts:
        delivery: bright, quick, and candid, with feeling close to the surface
        timbre: youthful and clear
        pace: lively
        pitch: medium-high
  chapters:
    - id: ch01
      title: 19th August
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: August nineteenth.
        - id: ch01-b02
          speaker: jerusha
          text: >-
            Dear Daddy-Long-Legs, the view from my window is perfectly lovely. I should call it an ocean-scape, because there is nothing out there but water and rocks.
        - id: ch01-b03
          speaker: jerusha
          text: >-
            Summer is slipping away. Every morning I work on Latin, English, and algebra with my two stupid girls. I can't imagine how Marion will ever get into college, much less stay there. Florence is hopeless too, but oh, she is such a little beauty! Perhaps being stupid doesn't matter if you're pretty. Still, think how badly they may bore their husbands, unless they manage to marry stupid husbands. That ought to be possible. The world seems full of stupid men, and I've met quite a few this summer.
        - id: ch01-b04
          speaker: jerusha
          text: >-
            In the afternoons, we walk along the cliffs, or we swim when the tide is right. Salt water makes swimming wonderfully easy. You see? My education is already proving useful!
        - id: ch01-b05
          speaker: jerusha
          text: >-
            Mr. Jervis Pendleton has written from Paris. It was a very short, businesslike letter. Apparently, he still hasn't quite forgiven me for ignoring his advice. But if he returns in time, he'll visit me at Lock Willow for a few days before college starts. And if I behave very sweetly and obediently, I gather that he may forgive me.
        - id: ch01-b06
          speaker: jerusha
          text: >-
            Sallie wrote too. She wants me at their camp for two weeks in September. Do I still have to ask permission, or have I reached the age when I can decide for myself? Yes, I'm sure I have. I'm a Senior now, you know. After working all summer, I deserve a little healthy fun. I want to see the Adirondacks and Sallie. I want to see Sallie's brother, who is going to teach me to canoe. And now for my chief motive, which is rather mean. I want Master Jervie to arrive at Lock Willow and discover that I'm not there.
        - id: ch01-b07
          speaker: jerusha
          text: >-
            I must show him that he cannot order me about. Nobody can do that but you, Daddy, and even you can't always manage it! I'm off to the woods. Judy.
    - id: ch02
      title: 6th September
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: Camp McBride. September sixth.
        - id: ch02-b02
          speaker: jerusha
          text: >-
            Dear Daddy, I'm pleased to say that your letter arrived too late. If you want your orders obeyed, your secretary must deliver them in less than two weeks. As you can see, I'm already here. In fact, I've been here for five days.
        - id: ch02-b03
          speaker: jerusha
          text: >-
            The woods are wonderful. So are the camp, the weather, the McBrides, and the entire world. I'm so happy!
          emotion: happy
        - id: ch02-b04
          speaker: jerusha
          text: >-
            Jimmie is calling me to go canoeing, so goodbye. I'm sorry I disobeyed you, but why are you so determined not to let me have any fun? I worked all summer. I've earned these two weeks. You're behaving like a dog in the manger.
        - id: ch02-b05
          speaker: jerusha
          text: >-
            Still, I love you, Daddy, in spite of all your faults. Judy.
    - id: ch03
      title: 3rd October
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: October third.
        - id: ch03-b02
          speaker: jerusha
          text: >-
            Dear Daddy-Long-Legs, I'm back at college, I'm a Senior, and I'm editor of the Monthly. Can you believe that this sophisticated person was living at the John Grier Home only four years ago? People certainly rise quickly in America!
        - id: ch03-b03
          speaker: jerusha
          text: >-
            Now listen to this. Master Jervie sent a note to Lock Willow, and it was forwarded here. He says he's sorry, but he can't visit this fall after all. He has accepted an invitation to go yachting with friends. He hopes I enjoyed my summer and am enjoying the country.
        - id: ch03-b04
          speaker: jerusha
          text: >-
            And the whole time, he knew I was staying with the McBrides because Julia told him! You men should leave plotting to women. You simply aren't subtle enough.
        - id: ch03-b05
          speaker: jerusha
          text: >-
            Julia brought a whole trunk of gorgeous new clothes. She has an evening dress made of rainbow-colored Liberty crepe that an angel could wear in Paradise. Until she unpacked, I thought my own new clothes were more beautiful than anything I'd ever owned. I copied Mrs. Paterson's wardrobe with help from a cheap dressmaker. The dresses didn't come out exactly like hers, but I was perfectly content. Now I live for the day I see Paris!
        - id: ch03-b06
          speaker: jerusha
          text: >-
            Daddy, aren't you glad you aren't a girl? You probably think all this excitement over clothes is completely silly. It is. There's no question about that. But it is entirely your fault.
        - id: ch03-b07
          speaker: jerusha
          text: >-
            Have you heard about the learned German professor who despised decoration and believed women should wear sensible, practical clothes? His obliging wife agreed to dress that way. And what did he do? He ran away with a chorus girl.
        - id: ch03-b08
          speaker: jerusha
          text: >-
            Yours always, Judy. Postscript. The chambermaid in our hall wears blue checked gingham aprons. I'm going to buy her brown ones and sink the blue ones at the bottom of the lake. Every time I see them, I get a cold shiver from the old days.
    - id: ch04
      title: 17th November
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: November seventeenth.
        - id: ch04-b02
          speaker: jerusha
          text: >-
            Dear Daddy-Long-Legs, disaster has struck my literary career. I wasn't sure I should tell you, but I do want some sympathy. Silent sympathy, please. Don't mention it in your next letter and open the wound again.
          emotion: sad
        - id: ch04-b03
          speaker: jerusha
          text: >-
            I've been writing a book. I worked on it every evening last winter, and all through the summer whenever I wasn't teaching Latin to those two stupid children. I finished just before college began and sent it to a publisher. He kept it for two months, so of course I felt certain he meant to publish it.
        - id: ch04-b04
          speaker: jerusha
          text: >-
            But yesterday morning, an express parcel arrived, with thirty cents still to pay. My book was inside. The publisher included a kind, fatherly letter, but he was painfully honest. He noticed from my address that I was still in college. His advice was to put all my energy into my lessons and wait until after graduation to begin writing.
        - id: ch04-b05
          speaker: jerusha
          text: >-
            He also sent the reader's report. It said the plot was highly improbable, the characters were exaggerated, and the conversation sounded unnatural. There was plenty of humor, though it wasn't always in the best taste. I should keep trying, and someday I might produce a real book.
        - id: ch04-b06
          speaker: jerusha
          text: >-
            That isn't very flattering, is it, Daddy? I truly believed I was adding something important to American literature. I planned to surprise you by writing a great novel before graduation. I gathered my material during those two weeks at Julia's last Christmas. Still, the editor is probably right. Two weeks may not be long enough to learn the habits of a great city.
        - id: ch04-b07
          speaker: jerusha
          text: >-
            Yesterday afternoon, I took the book out walking. When I reached the gas house, I asked the engineer if I could borrow his furnace. He politely opened the door, and I threw the book in with my own hands. It felt as if I had cremated my only child!
          emotion: sad
        - id: ch04-b08
          speaker: jerusha
          text: >-
            Last night I went to bed completely miserable. I thought I would never become anything at all, and you had wasted your money on me.
          emotion: sad
        - id: ch04-b09
          speaker: jerusha
          text: >-
            But guess what happened. This morning I woke up with a beautiful new plot in my head. I've spent the whole day happily planning the characters. No one could ever call me a pessimist! If an earthquake swallowed my husband and twelve children one day, I'd pop up smiling the next morning and start looking for another set. Affectionately, Judy.
          emotion: happy
    - id: ch05
      title: 14th December
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: December fourteenth.
        - id: ch05-b02
          speaker: jerusha
          text: >-
            Dear Daddy-Long-Legs, I had the funniest dream last night. I walked into a bookstore, and the clerk handed me a new book called The Life and Letters of Judy Abbott. I saw it perfectly. It had a red cloth cover with a picture of the John Grier Home. Inside was my portrait, with the words, “Very truly yours, Judy Abbott,” written underneath.
        - id: ch05-b03
          speaker: jerusha
          text: >-
            I was just turning to the last page to read what was written on my tombstone when I woke up. How annoying! I almost discovered whom I'm going to marry and when I'm going to die.
        - id: ch05-b04
          speaker: jerusha
          text: >-
            Wouldn't it be fascinating to read the true story of your life, written by an author who knew everything? But suppose there were one condition. You could never forget what you read. You would have to live knowing exactly how every choice would turn out and the very hour you would die. How many people would be brave enough to read it? And how many could resist looking, even if it meant living without hope or surprises afterward?
        - id: ch05-b05
          speaker: jerusha
          text: >-
            Life is repetitive enough already. We have to stop and eat and sleep so often. Just imagine how deadly dull it would be if nothing unexpected could happen between meals. Oh, dear, Daddy, I've made an ink blot. But I'm already on page three, so I refuse to start over.
        - id: ch05-b06
          speaker: jerusha
          text: >-
            I'm taking biology again this year, and it's very interesting. Right now we're studying the digestive system. You should see how lovely a cross-section of a cat's duodenum looks under the microscope.
        - id: ch05-b07
          speaker: jerusha
          text: >-
            We've reached philosophy too. It's interesting, but it slips away as soon as you think you understand it. I prefer biology, where you can pin the thing you're discussing to a board. There's another blot! And another! This pen is crying rivers. Please forgive its tears.
        - id: ch05-b08
          speaker: jerusha
          text: >-
            Do you believe in free will? I do, completely. Some philosophers say every action must happen because of a great collection of causes from long ago. I think that's the most immoral idea I've ever heard. It would mean no one was responsible for anything. Anyone who believed in fate could just sit down, say, “The Lord's will be done,” and keep sitting there until he fell over dead.
        - id: ch05-b09
          speaker: jerusha
          text: >-
            I believe absolutely in my own free will and in my own power to accomplish things. That is the belief that moves mountains. Just watch me become a great author! I've already finished four chapters of my new book and planned five more.
        - id: ch05-b10
          speaker: jerusha
          text: >-
            This has become a very difficult letter. Does your head hurt, Daddy? We'd better stop and make fudge. I'm sorry I can't send you any. It will be especially good because we're using real cream and three balls of butter. Yours affectionately, Judy.
        - id: ch05-b11
          speaker: jerusha
          text: >-
            Postscript. We're learning fancy dancing in gym class. From the picture I've drawn, you can see how closely we resemble a real ballet. The graceful dancer at the end, doing a pirouette, is me. I mean, is I.
