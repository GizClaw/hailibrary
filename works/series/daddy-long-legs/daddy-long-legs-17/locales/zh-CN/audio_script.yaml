audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 叙述者
      tts:
        delivery: 清楚沉静，简洁报出书信日期与场景转换
        timbre: 温暖清澈
        pace: 舒缓
        pitch: 中音
    judy:
      display_name: 朱迪
      tts:
        delivery: 聪敏直率，像把心事和见闻亲口讲给亲近的人
        timbre: 明亮自然的年轻女声
        pace: 轻快而富于变化，伤心时稍慢
        pitch: 中高音
  chapters:
    - id: ch01
      title: 4月4日：洛克柳庄园的复活节假期
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 4月4日，朱迪在洛克柳庄园给长腿叔叔写信。
        - id: ch01-b02
          speaker: judy
          text: >-
            亲爱的叔叔，看见邮戳了吗？复活节这十天假期，莎莉和我到洛克柳庄园来了。我们认定，还是找个安静的地方最好。神经绷得太紧，实在经不起弗格森食堂里的又一顿饭了。
        - id: ch01-b03
          speaker: judy
          text: >-
            人累的时候，跟四百个女孩同室吃饭，真是受罪。屋里吵得厉害，对面的人必须把手圈在嘴边，当成喇叭大声喊，你才听得清。我可一点也没夸张。
        - id: ch01-b04
          speaker: judy
          text: >-
            现在我们每天翻山越岭，读读书，写写字，过得又舒服又安静。今早爬上了“天山”。两年前，我和杰维少爷曾在山顶做晚饭。时间过得真快，可当年烟火在石头上留下的黑印，现在还在那里。
        - id: ch01-b05
          speaker: judy
          text: >-
            有些地方总会和某个人连在一起。以后再去，一定会想起他。山顶少了杰维少爷，我还真有点寂寞。整整寂寞了两分钟。
        - id: ch01-b06
          speaker: judy
          text: >-
            叔叔，再猜猜我近来干了什么？您一定要说我无药可救了。我又开始写书啦！三星期前开的头，现在大口大口地写，好像要把它吞下去。这一回，我可算找到秘诀了。
        - id: ch01-b07
          speaker: judy
          text: >-
            杰维少爷和那个编辑都说对了。只有写自己懂的事，才能真正写得叫人相信。我这回的题材，我可熟透了。您猜故事在哪里？就在约翰·格里尔孤儿院。
        - id: ch01-b08
          speaker: judy
          text: >-
            叔叔，这本书真的很好。我自己就是这样相信的。书里没有什么惊天动地的大事，写的是孤儿院每天都会发生的一件件小事。我现在可是现实主义者。浪漫主义已经叫我放在一边了。等我未来的奇遇开始时，再把它请回来。
        - id: ch01-b09
          speaker: judy
          text: >-
            这本新书一定会完稿，也一定会出版。您就等着瞧吧。一样东西，只要想得足够厉害，又肯一直尝试，最后总能得到。我想收到您的信，已经想了四年，可我现在还没死心呢。
        - id: ch01-b10
          speaker: judy
          text: >-
            再见，亲爱的叔叔。我喜欢这样叫您。英文里那两个词开头的声音一样，念起来真好玩。爱您的朱迪。
        - id: ch01-b11
          speaker: judy
          text: >-
            又及，我差点忘了庄园的新闻。这些消息都很悲伤。您要是不想听得心神不宁，下面就别看了。
        - id: ch01-b12
          speaker: judy
          text: >-
            可怜的老格罗弗死了。它已经嚼不动食物，大家只好把它开枪打死。上个星期还死了九只鸡，凶手不知是黄鼠狼、臭鼬，还是老鼠。
        - id: ch01-b13
          speaker: judy
          text: >-
            一头奶牛生了病，我们特地从邦尼里格四岔路请来兽医。阿马赛一夜没睡，守着奶牛灌亚麻籽油和威士忌。不过，我们非常怀疑，威士忌根本没进牛的嘴，那个可怜的病号只吃到了亚麻籽油。
        - id: ch01-b14
          speaker: judy
          text: >-
            还有那只玳瑁猫，“多情的汤米”，它也不见了。我们担心它叫捕兽夹给夹住了。唉，这个世界怎么有这么多烦恼！
    - id: ch02
      title: 5月17日：请您来参加毕业典礼
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 5月17日，朱迪写了一封极短的信。
        - id: ch02-b02
          speaker: judy
          text: >-
            亲爱的长腿叔叔，这封信必须写得非常短。我的肩膀现在只要看见钢笔，立刻就疼。白天写一整天听课笔记，晚上接着写我那部不朽的小说，一天里写的字也未免太多了。
        - id: ch02-b03
          speaker: judy
          text: >-
            从下星期三开始算，再过三个星期就要举行毕业典礼。我觉得您应该来，也该正式认识我了。要是不来，我会恨您的！
        - id: ch02-b04
          speaker: judy
          text: >-
            朱莉娅会请杰维少爷，因为他是她的亲人。莎莉会请吉米·麦克布赖德，因为他也是她的亲人。我呢？我还能请谁？只有您和利皮特太太。可我不想请她。所以，求您一定要来。
        - id: ch02-b05
          speaker: judy
          text: >-
            爱您，还带着一只写字写到抽筋的手。朱迪。
    - id: ch03
      title: 6月19日：我受过教育啦
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 6月19日，朱迪又回到了洛克柳庄园。
        - id: ch03-b02
          speaker: judy
          text: >-
            亲爱的长腿叔叔，我已经是受过教育的人啦！毕业文凭躺在五斗橱最底下那层抽屉里，旁边放着我最好的两条裙子。毕业典礼还是老样子。几阵雨偏偏挑最要紧的时刻落下来。
        - id: ch03-b03
          speaker: judy
          text: >-
            谢谢您的玫瑰花蕾，真是美极了。杰维少爷和吉米少爷也送了玫瑰。可我把他们两个的花都放在浴缸里，毕业游行时，我抱着的是您送的那一束。
        - id: ch03-b04
          speaker: judy
          text: >-
            暑假我就住在洛克柳庄园，说不定以后永远也不走了。这儿食宿价钱低，四周又清静，天生适合过作家的生活。一个还在苦苦奋斗的作家，哪里还能要求更多呢？
        - id: ch03-b05
          speaker: judy
          text: >-
            我为这本书着了迷。只要醒着，每一刻都在想它。睡着以后，它还要跑到梦里来。我现在只求安静，再有足够的时间干活。当然，干活中间还得有几顿营养充足的饭。
        - id: ch03-b06
          speaker: judy
          text: >-
            杰维少爷八月会来住一个星期左右。吉米·麦克布赖德也说，今年夏天找个时候来一趟。他进了一家债券公司，现在四处奔走，把债券卖给各地的银行。
        - id: ch03-b07
          speaker: judy
          text: >-
            吉米打算拿一趟旅程同时办两件事。他要去四岔路的“农民国家银行”，也要来看我。可见洛克柳庄园还不至于完全没有人来往。
        - id: ch03-b08
          speaker: judy
          text: >-
            我本来也可以盼您坐汽车路过这里。不过我如今明白了，这件事根本没指望。连我的毕业典礼您都不来。我已经把您从心里拔出去，埋得永远也找不到了。文学学士，朱迪·艾博特。
    - id: ch04
      title: 7月24日：工作真有意思
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 7月24日，朱迪从自己最爱的工作说起。
        - id: ch04-b02
          speaker: judy
          text: >-
            最亲爱的长腿叔叔，工作起来真有意思，对不对？还是说，您从来没干过活？假如你做的工作，就是全世界最想做的那件事，干起来就更有意思了。
        - id: ch04-b03
          speaker: judy
          text: >-
            这个夏天，我天天都在拼命写。钢笔跑得有多快，我就跟着它写多快。我对生活只有一个意见，白天太短了。我脑子里正冒出那么多美妙、重要又有趣的念头，一天根本写不完。
        - id: ch04-b04
          speaker: judy
          text: >-
            书的第二稿已经写好了。明天早上七点半，我准时开始第三稿。这本书可爱得不得了，您从来没见过这么可爱的书。我说的是真话。现在除了它，我什么也不想。
        - id: ch04-b05
          speaker: judy
          text: >-
            每天一醒，我连穿衣服、吃早饭都嫌耗时间，只想快点坐下写作。然后我就一直写，不停地写，直到忽然发现自己已经累得全身发软。
        - id: ch04-b06
          speaker: judy
          text: >-
            这时候，我会带上新来的牧羊犬科林，跑到田野里玩个痛快。一边玩，一边又攒下一批新念头，留给明天。这是您见过的最美的书。哎呀，请原谅，这句我好像已经说过了。
        - id: ch04-b07
          speaker: judy
          text: >-
            亲爱的叔叔，您不会觉得我太自负吧？我真的不自负，只是现在干劲正足。也许将来我会冷静下来，对它又挑剔，又看不顺眼。不，才不会呢！我这次写的真是一本好书。您看到就知道了。
        - id: ch04-b08
          speaker: judy
          text: >-
            先把我的书放下一分钟，换一件事说吧。我好像还没告诉您，阿马赛和凯莉五月结婚了。他们还在庄园干活，可依我看，这场婚姻已经把两个人全弄坏了。
        - id: ch04-b09
          speaker: judy
          text: >-
            从前阿马赛踩着泥进门，或者把炉灰掉在地上，凯莉只觉得好笑。现在呢，您真该听听她怎么数落人。她连头发也不卷了。
        - id: ch04-b10
          speaker: judy
          text: >-
            阿马赛也变了。以前请他拍拍地毯，抱些木柴，他都乐意帮忙。如今谁敢请他做，他就嘟嘟囔囔。他的领带也失去了光彩，以前是大红大紫，现在只剩下黑色和棕色。
        - id: ch04-b11
          speaker: judy
          text: >-
            所以我已经下定决心，永远不结婚。看起来，婚姻这道手续，只会把人越变越差。
        - id: ch04-b12
          speaker: judy
          text: >-
            庄园里没有别的新闻。动物们全都健康得很。猪比平时还肥，牛们看来挺满足，母鸡也下了不少蛋。您喜欢研究养鸡吗？要是喜欢，我推荐一本宝贵的小书，叫《每只母鸡每年下两百只蛋》。
        - id: ch04-b13
          speaker: judy
          text: >-
            我打算明年春天办个孵化场，养些嫩鸡。您看，我是当真想永远留在洛克柳庄园了。我要像安东尼·特罗洛普的母亲那样，不写满114部小说就不走。等一生的工作完成，我就退休，然后去旅行。
        - id: ch04-b14
          speaker: judy
          text: >-
            詹姆斯·麦克布赖德先生上星期日来过。晚饭吃的是炸鸡和冰淇淋，看样子，两样他都非常欣赏。我见到他也高兴得很。就那么一小会儿，他让我想起，原来庄园之外还有一个大世界。
        - id: ch04-b15
          speaker: judy
          text: >-
            可怜的吉米卖债券卖得非常辛苦。四岔路的“农民国家银行”怎么也不肯买，虽说那些债券的利息有百分之六，有时还有百分之七。
        - id: ch04-b16
          speaker: judy
          text: >-
            我猜他最后还是会回伍斯特，到父亲的工厂找份工作。他对人太坦白，信人信得太快，心肠也太软，根本当不成成功的金融家。
        - id: ch04-b17
          speaker: judy
          text: >-
            可是，管理一家生意兴隆的背带工装厂，也是很好的工作，您不这样想吗？眼下吉米瞧不起背带工装，早晚有一天，他还是会回去找它们的。
        - id: ch04-b18
          speaker: judy
          text: >-
            我这只手明明已经写到抽筋，却还给您写了这么长的信。您可得知道感激。不过，亲爱的叔叔，我依然爱您，而且我快活得很。
        - id: ch04-b19
          speaker: judy
          text: >-
            四周有好风景，能吃得饱饱的，还有一张舒舒服服的四柱床。我手边有整整一令白纸，再加上一品脱墨水。一个人活在世上，还能缺什么呢？永远属于您的朱迪。
        - id: ch04-b20
          speaker: judy
          text: >-
            又及，邮差刚来，又送到一个新消息。杰维少爷下星期五就到，要在这里住一周。这件事真让人盼望。只是，我那本可怜的书恐怕要受苦了。杰维少爷可是很会占用别人时间的。
