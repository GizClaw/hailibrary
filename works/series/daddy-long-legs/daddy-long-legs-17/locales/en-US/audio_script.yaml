audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm, observant storytelling with a dry touch of humor
        timbre: clear and gently textured
        pace: measured and flowing
        pitch: medium
    jerusha:
      display_name: Jerusha Abbott
      tts:
        delivery: bright, quick, and candid, with feeling close to the surface
        timbre: youthful and clear
        pace: lively
        pitch: medium-high
  chapters:
    - id: ch01
      title: 4th April
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: April fourth. Lock Willow.
        - id: ch01-b02
          speaker: jerusha
          text: >-
            Dear Daddy, did you notice the postmark? Sallie and I are spending Easter vacation at Lock Willow. We decided the best use of our ten free days was to go somewhere quiet. Our nerves couldn't survive one more meal in Fergussen. When you're tired, eating with four hundred girls is an ordeal. The room is so very loud that you can't hear the girls across the table unless they cup their hands around their mouths like megaphones and shout. I mean that literally.
        - id: ch01-b03
          speaker: jerusha
          text: >-
            We're walking over the hills, reading, writing, and resting. This morning we climbed Sky Hill, where Master Jervie and I cooked supper almost two years ago. I could still see the black mark our fire left on the rock. Isn't it strange how a place can become tied to a person? You can never return without thinking of them. I felt quite lonely without him, for two whole minutes.
        - id: ch01-b04
          speaker: jerusha
          text: >-
            Can you guess my newest project, Daddy? You'll decide I'm hopeless. I'm writing a book. I began three weeks ago, and I'm devouring it in great chunks. At last I've learned the secret. Master Jervie and that editor were right. Your writing is most convincing when it's about something you know.
        - id: ch01-b05
          speaker: jerusha
          text: >-
            This time I know my subject completely. The book is set in the John Grier Home. And Daddy, I honestly think it's good. It's about all the tiny things that happened there every day. I'm a realist now. I've given up romanticism, though I'll return to it when my own adventurous future begins.
        - id: ch01-b06
          speaker: jerusha
          text: >-
            This book is going to be finished and published. Just wait and see. When you want something badly enough and keep working for it, you finally get it. I've spent four years trying to get a letter from you, and I haven't stopped hoping yet.
        - id: ch01-b07
          speaker: jerusha
          text: >-
            Goodbye, Daddy dear. I like calling you that. The two words begin with the same sound, and I love the alliteration. Affectionately, Judy.
        - id: ch01-b08
          speaker: jerusha
          text: >-
            Postscript. I nearly forgot the farm news, and it's terribly upsetting. You may skip this part if you'd rather not get worked up.
        - id: ch01-b09
          speaker: jerusha
          text: >-
            Poor old Grove is dead. He couldn't chew anymore, so they had to shoot him. Last week, nine chickens were killed by a weasel, a skunk, or a rat.
        - id: ch01-b10
          speaker: jerusha
          text: >-
            One cow is sick, and we had to bring the veterinarian from Bonnyrigg Four Corners. Amasai stayed awake all night giving her linseed oil and whisky. We strongly suspect that the poor cow received only the linseed oil.
        - id: ch01-b11
          speaker: jerusha
          text: >-
            Sentimental Tommy, the tortoiseshell cat, has vanished. We're afraid he was caught in a trap. There are so many troubles in the world!
    - id: ch02
      title: 17th May
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: May seventeenth.
        - id: ch02-b02
          speaker: jerusha
          text: >-
            Dear Daddy-Long-Legs, this letter will be extremely short. My shoulder aches as soon as I see a pen. Taking lecture notes all day and writing my immortal novel all evening is simply too much writing.
        - id: ch02-b03
          speaker: jerusha
          text: >-
            Commencement is three weeks from next Wednesday. I think you ought to come and finally meet me. I'll hate you if you don't! Julia is inviting Master Jervie because he's her family, and Sallie is inviting Jimmie McBride because he's hers. Who can I invite? There's only you and Miss Lippett, and I don't want her. Please come.
        - id: ch02-b04
          speaker: jerusha
          text: Yours with love and writer's cramp, Judy.
    - id: ch03
      title: 19th June
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: June nineteenth. Lock Willow.
        - id: ch03-b02
          speaker: jerusha
          text: >-
            Dear Daddy-Long-Legs, I'm educated! My diploma is tucked into the bottom bureau drawer beside my two best dresses. Commencement was much like every other commencement, complete with rain showers at exactly the wrong moments.
        - id: ch03-b03
          speaker: jerusha
          text: >-
            Thank you for the rosebuds. They were lovely. Master Jervie and Master Jimmie gave me roses too, but I left both of their bouquets in the bathtub. Yours were the ones I carried in the class procession.
        - id: ch03-b04
          speaker: jerusha
          text: >-
            Now I'm at Lock Willow for the summer, and perhaps forever. The board is cheap, and the quiet surroundings are perfect for a literary life. What else could a struggling author need? I'm completely wrapped up in my book. I think about it every moment I'm awake and dream about it at night. All I want is peace, quiet, and plenty of time to write, with nourishing meals now and then.
        - id: ch03-b05
          speaker: jerusha
          text: >-
            Master Jervie will visit for a week or so in August. Jimmie McBride plans to stop by sometime this summer too. He works for a bond house now and travels around selling bonds to banks. On one trip, he's going to visit both the Farmers' National at the Corners and me.
        - id: ch03-b06
          speaker: jerusha
          text: >-
            So you see, Lock Willow isn't completely without company. I would expect you to drive through as well, except that I know better now. When you missed my commencement, I tore you out of my heart and buried you forever. Judy Abbott, Bachelor of Arts.
    - id: ch04
      title: 24th July
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: July twenty-fourth.
        - id: ch04-b02
          speaker: jerusha
          text: >-
            Dearest Daddy-Long-Legs, isn't working fun? Or have you never tried it? It's especially wonderful when your work is the one thing you'd rather do than anything else. I've written as fast as my pen could move every day this summer. My only complaint is that the days are too short for all the beautiful, important, entertaining thoughts in my head.
        - id: ch04-b03
          speaker: jerusha
          text: >-
            I've finished the second draft of my book. Tomorrow morning at seven thirty, I'll begin the third. It's the sweetest book you ever saw. Truly, it is. I think about nothing else. Each morning I can barely wait to dress and eat before I start. Then I write and write until I'm suddenly so tired that my whole body goes limp.
        - id: ch04-b04
          speaker: jerusha
          text: >-
            After that, I take Colin, the new sheepdog, into the fields and romp with him. By the time we come back, I've gathered fresh ideas for the next day. It's the most beautiful book you ever saw. Oh, excuse me. I already said that.
        - id: ch04-b05
          speaker: jerusha
          text: >-
            You don't think I'm conceited, do you, Daddy dear? I'm really not. I'm simply in the enthusiastic stage. Maybe later I'll become cold and critical and turn up my nose at it. No, I'm certain I won't! This time I've written a real book. Wait until you see it.
        - id: ch04-b06
          speaker: jerusha
          text: >-
            Let me try to talk about something else for a minute. Did I ever tell you that Amasai and Carrie got married last May? They still work here, but as far as I can tell, marriage has spoiled them both.
        - id: ch04-b07
          speaker: jerusha
          text: >-
            Carrie used to laugh when Amasai tracked in mud or spilled ashes on the floor. Now you should hear her scold him. She doesn't curl her hair anymore, either. Amasai used to beat rugs and carry wood without complaint. Now he grumbles whenever anyone asks. Even his neckties have faded into dull black and brown. Before the wedding, they were scarlet and purple.
        - id: ch04-b08
          speaker: jerusha
          text: >-
            I've decided never to marry. Marriage is evidently a process that makes people deteriorate.
        - id: ch04-b09
          speaker: jerusha
          text: >-
            There isn't much farm news. Every animal is wonderfully healthy. The pigs are unusually fat, the cows look contented, and the hens are laying plenty of eggs. Does poultry interest you? If it does, I recommend that priceless little book, Two Hundred Eggs per Hen per Year.
        - id: ch04-b10
          speaker: jerusha
          text: >-
            I'm thinking about starting an incubator next spring and raising broilers. As you can see, I'm settled at Lock Willow permanently. I intend to stay until I've written one hundred fourteen novels, like Anthony Trollope's mother. Then my life's work will be complete, and I can retire and travel.
        - id: ch04-b11
          speaker: jerusha
          text: >-
            Mister James McBride spent last Sunday with us. We served fried chicken and ice cream for dinner, and he seemed to appreciate both. I was awfully glad to see him. For a little while, he reminded me that the larger world still exists.
        - id: ch04-b12
          speaker: jerusha
          text: >-
            Poor Jimmie is struggling to sell his bonds. The Farmers' National at the Corners wouldn't touch them, even though they pay six percent interest and sometimes seven. I think he'll eventually return to Worcester and work in his father's factory. He's far too open, trusting, and kindhearted to become a successful financier.
        - id: ch04-b13
          speaker: jerusha
          text: >-
            Still, managing a thriving overall factory would be a very good position, don't you think? Right now he looks down on overalls, but he'll come around.
        - id: ch04-b14
          speaker: jerusha
          text: >-
            I hope you appreciate this long letter from someone with writer's cramp. I still love you, Daddy dear, and I'm very happy. I have beautiful scenery, plenty to eat, a comfortable four-poster bed, a whole ream of blank paper, and a pint of ink. What more could anyone want? Yours as always, Judy.
        - id: ch04-b15
          speaker: jerusha
          text: >-
            Postscript. The mailman has just brought more news. Master Jervie will arrive next Friday and stay for a week. That's a very pleasant prospect. I'm only afraid my poor book will suffer. Master Jervie demands a great deal of attention.
