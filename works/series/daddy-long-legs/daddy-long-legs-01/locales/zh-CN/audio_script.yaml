audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 机敏而从容，带着温和的讽刺意味
        timbre: 温暖清亮
        pace: 舒缓而富有变化
        pitch: 中音
    jerusha_abbott:
      display_name: 杰鲁莎·艾博特
      tts:
        delivery: 聪敏直率，克制中透出活泼和想象力
        timbre: 清澈明亮的少女声线
        pace: 自然轻快，紧张时略快
        pitch: 中高音
    tommy_dillon:
      display_name: 汤米·狄龙
      tts:
        delivery: 顽皮好唱，调侃里带着善意
        timbre: 清脆的男孩声线
        pace: 轻快
        pitch: 高音
    mrs_lippett:
      display_name: 利佩特太太
      tts:
        delivery: 一本正经，缓慢庄重，习惯训诫别人
        timbre: 饱满而略显冷硬
        pace: 缓慢稳重
        pitch: 中低音
  chapters:
    - id: ch01
      title: 糟糕透顶的日子
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 每个月的第一个星期三，都是个糟糕透顶的日子。孤儿院里的人害怕它来，只能咬牙熬过去，然后尽快忘掉。那天，所有楼层都要擦得干干净净，椅子不能有灰，床铺不能有一道褶。九十七个扭个不停的小孤儿，全得洗净脸，梳好头，再穿上浆得硬挺挺的条格布衣裳。每个孩子还要听一遍规矩。理事一开口，他们必须说“是，先生”或者“不，先生”。
        - id: ch01-b02
          speaker: narrator
          text: 这一天谁都不好过，年纪最大的孤儿杰鲁莎·艾博特尤其辛苦。不过，这个星期三也总算慢吞吞地挨到了尾声。杰鲁莎刚在食品储藏室里替客人做完三明治，又得上楼完成每天的差事。她照管的是F室。那里有十一个四岁到七岁的小不点儿，也有排成一列的十一张小床。她把孩子们叫齐，拉平揉皱的衣服，擦净一只只鼻子，再把他们排成整齐听话的一队，送往餐厅。面包、牛奶和西梅布丁一端上来，至少能让他们安静半个钟头。
        - id: ch01-b03
          speaker: narrator
          text: 孩子们一走，杰鲁莎便瘫坐在窗边，把疼得直跳的太阳穴贴到冰凉的玻璃上。她从早晨五点就一直站着，所有人都在使唤她。那位紧张不安的女院长还不停地催促，不停地训斥。利佩特太太只有面对理事和来访的太太小姐时，才总是镇定又庄严。到了幕后，那副气派就未必保得住了。
        - id: ch01-b04
          speaker: narrator
          text: 杰鲁莎朝窗外望去。冰封的草坪铺得很远，尽头立着孤儿院高高的铁栅栏。再往外，一道道山脊上下起伏，乡间的大宅散落在山坡上。更远的地方，村庄的尖塔从一片光秃秃的树间伸了出来。
        - id: ch01-b05
          speaker: narrator
          text: 据杰鲁莎所知，这一天办得还算顺利。理事和视察委员会已经巡查过，念过报告，也喝完了茶。现在，他们正急着赶回各自明亮温暖的炉边。接下来的一个月，他们又可以忘掉这些麻烦的小累赘了。杰鲁莎带着好奇探身向前，也有一点羡慕。她看着马车和汽车一辆接一辆驶出大门，心里先跟上这一辆，再追着那一辆，一直来到山坡上的大房子前。
        - id: ch01-b06
          speaker: narrator
          text: 她想象自己披着毛皮大衣，头戴插着羽毛的天鹅绒帽子，懒洋洋地靠在车里，再若无其事地吩咐司机一声：“回家。”可是，车到了她自己的家门口，那幅画面就散了。杰鲁莎的想象力一向丰富。利佩特太太说，这想象力要是不管好，准会给她惹祸。可是再丰富的想象，也没法带她越过门廊。十七年来，这个热切又爱冒险的姑娘从没走进过一户普通人家。没有一群孤儿拖在身后的人每天怎样生活，她根本想不出来。
    - id: ch02
      title: 长脚蛛的影子
      blocks:
        - id: ch02-b01
          speaker: tommy_dillon
          text: 杰——鲁——莎·艾——博——特，办公室里有人找你。我看你呀，最好快点去！
        - id: ch02-b02
          speaker: narrator
          text: 刚参加唱诗班的汤米·狄龙唱着歌上了楼，又一路穿过走廊。离F室越近，他唱得越响。杰鲁莎只好离开窗边，重新回到生活里的麻烦中去。
        - id: ch02-b03
          speaker: jerusha_abbott
          text: 谁找我？
        - id: ch02-b04
          speaker: narrator
          text: 她一下打断汤米的歌，声音里绷着焦虑。
        - id: ch02-b05
          speaker: tommy_dillon
          text: 利佩特太太在办公室，我看她正在生气。阿——门！
        - id: ch02-b06
          speaker: narrator
          text: 汤米把最后三个字唱得无比虔诚，不过他并不是一味幸灾乐祸。就算是最麻木的小孤儿，看见哪个姐妹犯了错，被叫去面对恼火的女院长，也难免会同情她。汤米其实很喜欢杰鲁莎。虽然杰鲁莎有时会猛扯他的胳膊，替他洗脸时，也差点把他的鼻子搓掉。
        - id: ch02-b07
          speaker: narrator
          text: 杰鲁莎没说话，眉头却拧出两道直纹。到底出了什么岔子？三明治切得太厚了吗？果仁蛋糕里留下了碎壳吗？还是来访的女士发现苏茜·霍索恩的袜子破了洞？更可怕的是，难道F室某个看起来像小天使的孩子，竟然对理事顶了嘴？
        - id: ch02-b08
          speaker: narrator
          text: 楼下的长走廊还没点灯。杰鲁莎走下去时，最后一位理事站在敞开的门前，正准备离开。那扇门通向门廊下的车道。她只来得及瞥他一眼，脑子里只剩下一个印象。这个人真高。他抬起胳膊，向弯道上等候的汽车挥了挥手。汽车开过来，车头正对大门的一瞬，雪亮的灯光把他的影子清楚地照在墙上。那影子的胳膊和腿被拉得又细又长，先横过地板，再一直爬上走廊的墙。怎么看，都像一只巨大、摇晃的长脚蛛。
        - id: ch02-b09
          speaker: narrator
          text: 杰鲁莎紧皱的眉头一下松开，笑出了声。她生来开朗，只要有一丁点可以开心的理由，就绝不会放过。“理事”这个事实本来压得人喘不过气，谁想到里面还能找出一点乐趣呢？这个小小的发现让她振作起来。等她走进办公室时，脸上已经有了笑容。更意外的是，利佩特太太就算没有笑，也明显比平时亲切，几乎拿出了接待访客时才有的好脸色。
    - id: ch03
      title: 一个不寻常的提议
      blocks:
        - id: ch03-b01
          speaker: mrs_lippett
          text: 坐下，杰鲁莎。我有话对你说。
        - id: ch03-b02
          speaker: narrator
          text: 杰鲁莎在离自己最近的椅子上坐好，屏住一点呼吸，等着她开口。一辆汽车从窗外飞快闪过，利佩特太太转头看了一眼。
        - id: ch03-b03
          speaker: mrs_lippett
          text: 刚刚离开的那位先生，你看见了吗？
        - id: ch03-b04
          speaker: jerusha_abbott
          text: 我只看见了他的背影。
        - id: ch03-b05
          speaker: mrs_lippett
          text: 他是本院最有财势的理事之一，也捐了很多钱来维持孤儿院。我不能告诉你他的姓名。他特地交代过，绝不能公开他的身份。
        - id: ch03-b06
          speaker: narrator
          text: 杰鲁莎的眼睛睁大了一点。女院长从没叫她来办公室谈论理事们的怪脾气，这可不是寻常事。
        - id: ch03-b07
          speaker: mrs_lippett
          text: 这位先生资助过院里的几个男孩子。查尔斯·本顿和亨利·弗里兹，你还记得吧？他们都是由这位——呃，这位理事供完大学的。两个人后来勤奋工作，也都取得了成就，算是回报了他慷慨花出去的钱。除此以外，他什么报答也不要。可是过去，他只肯帮助男孩子。院里的姑娘不管多么上进，我也没法让他对谁产生一点兴趣。这个嘛，我可以告诉你，他不喜欢女孩子。
        - id: ch03-b08
          speaker: jerusha_abbott
          text: 是，太太。
        - id: ch03-b09
          speaker: narrator
          text: 杰鲁莎小声应了一句，因为利佩特太太停在那里，显然是在等她回答。
        - id: ch03-b10
          speaker: mrs_lippett
          text: 今天召开例会时，大家谈到了你将来的安排。
        - id: ch03-b11
          speaker: narrator
          text: 利佩特太太故意停了一会儿。杰鲁莎的神经一下绷紧，她却还是不紧不慢，平心静气地继续说，简直叫人受不了。
        - id: ch03-b12
          speaker: mrs_lippett
          text: 你知道，院里的孩子满了十六岁，通常就不能再留下。你是个例外。你十四岁便读完了这里的学校，功课一直很好。当然，我得指出，你的品行并非一向良好。所以，我们才决定让你到村里的中学继续念书。现在你快毕业了，孤儿院自然不能再供养你。算起来，你已经比大多数孩子多留了两年。
        - id: ch03-b13
          speaker: narrator
          text: 可利佩特太太完全没提另一面。为了换取这两年的食宿，杰鲁莎一直辛苦做事。孤儿院什么时候需要她，永远比她上学更要紧。碰到今天这样的日子，她只能留在院里刷刷洗洗。
        - id: ch03-b14
          speaker: mrs_lippett
          text: 我刚才说了，会上谈到了你的前途。你的记录，大家也讨论过了，而且讨论得非常彻底。
        - id: ch03-b15
          speaker: narrator
          text: 利佩特太太带着责备盯住杰鲁莎，仿佛自己正在审判犯人。杰鲁莎也只好露出有罪的神色。倒不是她记得记录上有过什么特别糟糕的事，只是别人显然希望她显得有罪。
        - id: ch03-b16
          speaker: mrs_lippett
          text: 按照惯例，像你这样的姑娘，应当由院里找个职位，好让你开始工作。不过，你有几门功课确实不错。听说你的英文写作甚至十分出色。视察委员会的普里查德小姐同时也是学校董事。她和你的修辞课老师谈过，又在会上替你说了不少好话。后来，她还念了你写的一篇文章，题目是《忧郁的星期三》。
        - id: ch03-b17
          speaker: narrator
          text: 这回，杰鲁莎脸上的心虚可是真心实意的了。
        - id: ch03-b18
          speaker: mrs_lippett
          text: 孤儿院为你做了这么多，你却写文章取笑这里。在我看来，这实在不懂感恩。要是你没能把文章写得有趣，恐怕大家不会原谅你。幸好那位——先生，也就是刚刚离开的那一位，偏偏有着过了头的幽默感。他就是看了你那篇无礼的文章，才提出要送你上大学。
        - id: ch03-b19
          speaker: jerusha_abbott
          text: 您是说，我要上大学？
          emotion: surprised
        - id: ch03-b20
          speaker: narrator
          text: 杰鲁莎瞪大了眼睛。利佩特太太点点头。
        - id: ch03-b21
          speaker: mrs_lippett
          text: 他特意留下，就是为了跟我商量条件。那些条件很不寻常。我可以说，这位先生行事颇为古怪。他认为你有独创性，打算让你接受教育，将来当一名作家。
        - id: ch03-b22
          speaker: jerusha_abbott
          text: 您是说，让我当作家？
          emotion: surprised
        - id: ch03-b23
          speaker: narrator
          text: 杰鲁莎已经听得脑子发木，只能重复利佩特太太最后说出的词。
    - id: ch04
      title: 约翰·史密斯先生的条件
      blocks:
        - id: ch04-b01
          speaker: mrs_lippett
          text: 这就是他的愿望。你将来究竟能不能有所成就，只有以后才知道。他给你的零用钱相当优厚。对一个从来没有管过钱的姑娘来说，我甚至觉得太多了。不过，他已经把细节全都安排妥当，我不便再提意见。这个夏天你仍旧住在院里。普里查德小姐好心答应过，会替你照管上学需要的衣服和用品。学校会直接收到你的学费和食宿费。此外，在大学四年里，你每个月还能领三十五美元。这样，你就可以和别的学生过一样的生活。
        - id: ch04-b02
          speaker: mrs_lippett
          text: 每个月，那位先生的私人秘书会把钱寄给你。作为回报，你也必须每月写一封信，说明钱已经收到。注意，你不需要为钱向他道谢，他不愿意让你提这件事。你要告诉他功课学得怎么样，每天又是怎样生活的。假如你的父母还在世，你会给他们写什么，就照那样写。
        - id: ch04-b03
          speaker: mrs_lippett
          text: 信要写给约翰·史密斯先生，再由秘书转交。当然，那位先生真正的名字并不是约翰·史密斯。他想隐瞒身份，所以对你来说，他永远都只是约翰·史密斯。他要求这些信，是因为他认为，经常写信最能练好文字表达。你没有家人可以通信，他才要你这样做，同时也好知道你有没有进步。他永远不会回信，也绝不会以任何方式理会你的信。他最讨厌写信，更不想让你成为负担。
        - id: ch04-b04
          speaker: mrs_lippett
          text: 如果以后真出了什么非得有人答复的事，比如你被学校开除——但愿不会如此——你可以写信给他的秘书格里格斯先生。每月寄信是你必须尽到的义务，没有商量的余地。史密斯先生只要这一种回报，所以你寄信一定要准时认真，就跟付账一样。我希望你的措辞始终恭敬，让人看得出你在这里受过良好教养。记住，你是在给约翰·格里尔孤儿院的一位理事写信。
        - id: ch04-b05
          speaker: narrator
          text: 杰鲁莎眼巴巴地望向门口。突如其来的兴奋搅得她满脑子纷乱，她只想赶快逃开这些老生常谈，找个地方独自想一想。她站起身，小心地往后退了一步。利佩特太太却抬手把她拦住。这么适合发表训话的机会，她可舍不得放过。
        - id: ch04-b06
          speaker: mrs_lippett
          text: 这么难得的好运落到你身上，我相信你知道自己应该怎样感恩。处境像你这样的姑娘，很少有机会改变身份，获得地位。你必须永远记得——
        - id: ch04-b07
          speaker: jerusha_abbott
          text: 我——是，太太，谢谢您。要是没有别的事，我想我该去给弗雷迪·珀金斯的裤子补补丁了。
        - id: ch04-b08
          speaker: narrator
          text: 门在杰鲁莎身后关上了。利佩特太太张着嘴，直愣愣地望着那扇门。她精心准备的结束语，还悬在半空中。
