audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm, observant storytelling with a dry touch of humor
        timbre: clear and gently textured
        pace: measured and flowing
        pitch: medium
    jerusha:
      display_name: Jerusha Abbott
      tts:
        delivery: bright, quick, and candid, with feeling close to the surface
        timbre: youthful and clear
        pace: lively
        pitch: medium-high
    tommy:
      display_name: Tommy Dillon
      tts:
        delivery: playful and sing-song, with an earnest streak
        timbre: light and boyish
        pace: jaunty
        pitch: high
    mrs_lippett:
      display_name: Mrs. Lippett
      tts:
        delivery: formal, deliberate, and self-important
        timbre: firm and polished
        pace: slow
        pitch: medium-low
  chapters:
    - id: ch01
      title: The Perfectly Awful Day
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            The first Wednesday of every month was a Perfectly Awful Day. Everyone dreaded it before it came, suffered bravely while it lasted, and tried to forget it as soon as it was over. Every floor had to shine. Not a chair could have dust on it, and not a bed could show one wrinkle. All ninety-seven little orphans had to be scrubbed, combed, and buttoned into freshly starched gingham clothes. Then all ninety-seven had to be reminded of their manners. Whenever a Trustee spoke, they were to answer, “Yes, sir,” or “No, sir.”
        - id: ch01-b02
          speaker: narrator
          text: >-
            It was hard on everyone, but it was hardest on poor Jerusha Abbott. At seventeen, she was the oldest orphan, so most of the work fell on her. Still, this first Wednesday finally dragged toward its end, just as all the others had. Jerusha escaped from the pantry, where she had spent the day making sandwiches for the Home's guests, and went upstairs to finish her regular chores.
        - id: ch01-b03
          speaker: narrator
          text: >-
            Room F was her special responsibility. Eleven little children, ages four through seven, slept there in eleven small beds lined up in a row. Jerusha gathered them together, smoothed their wrinkled clothes, wiped their noses, and formed them into a neat and willing line. Off they went to the dining room, where bread and milk and prune pudding would keep them busy for one blessed half hour.
        - id: ch01-b04
          speaker: narrator
          text: >-
            As soon as they were gone, Jerusha sank onto the window seat and pressed her pounding temples to the cool glass. She had been on her feet since five that morning, obeying everyone, while a nervous matron rushed and scolded her. Behind the scenes, Mrs. Lippett did not always have the calm, grand manner she displayed for Trustees and lady visitors.
        - id: ch01-b05
          speaker: narrator
          text: >-
            Jerusha looked across the wide frozen lawn. Past the tall iron fence around the Home, the land rolled down through country estates to the village, where church spires rose among bare trees. As far as Jerusha knew, the day had ended successfully. The Trustees and the visiting committee had made their rounds, read their reports, and drunk their tea. Now they were hurrying back to their own cheerful firesides. For another month, they could forget the troublesome little children in their care.
        - id: ch01-b06
          speaker: narrator
          text: >-
            With curiosity, and just a little longing, Jerusha watched the carriages and automobiles stream through the gates. In her imagination, she followed them one by one to the large houses scattered over the hillside. She pictured herself leaning back in a seat, dressed in a fur coat and a velvet hat with feathers. She would casually say, “Home,” to the driver. But when she tried to imagine herself at that home's front door, the picture faded.
        - id: ch01-b07
          speaker: narrator
          text: >-
            Jerusha had plenty of imagination. Mrs. Lippett often warned her that it would get her into trouble if she wasn't careful. Yet even Jerusha's quick mind could not take her past the front porch of an ordinary house. In all her eager, adventurous seventeen years, she had never been inside one. She had no idea what daily life was like for people who could go about their business without orphans getting in the way.
    - id: ch02
      title: A Summons to the Office
      blocks:
        - id: ch02-b01
          speaker: tommy
          text: >-
            Je-ru-sha Ab-bott! You are wan-ted in the of-fice! And I think you'd bet-ter hur-ry up!
        - id: ch02-b02
          speaker: narrator
          text: >-
            Tommy Dillon had joined the choir, and he came singing up the stairs and along the hall. His chant grew louder and louder as he neared room F. Jerusha pulled herself away from the window and turned back to the troubles of real life.
        - id: ch02-b03
          speaker: jerusha
          text: Who is asking for me?
          emotion: fearful
        - id: ch02-b04
          speaker: narrator
          text: Jerusha's sharp question cut right through Tommy's song.
        - id: ch02-b05
          speaker: tommy
          text: >-
            Mrs. Lippett's in the of-fice! And I think that she is mad! Ah-a-men!
        - id: ch02-b06
          speaker: narrator
          text: >-
            Tommy sang the last word as solemnly as he could, though he was not being entirely mean. Even the toughest little orphan felt sorry for a sister who had been called to face an annoyed matron. And Tommy liked Jerusha, even if she sometimes yanked him by the arm and nearly scrubbed the nose off his face.
        - id: ch02-b07
          speaker: narrator
          text: >-
            Jerusha said nothing as she left, but two worried lines appeared between her eyebrows. What had gone wrong? Maybe the sandwiches had been too thick. Maybe a bit of shell had slipped into the nut cakes. Had a lady visitor noticed the hole in Susie Hawthorn's stocking? Or, worst of all, had one of the sweet-looking little children from room F talked back to a Trustee?
    - id: ch03
      title: The Long-Legged Shadow
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            No one had lit the long downstairs hall. As Jerusha came down, she saw the last Trustee about to leave through the open door to the covered driveway. She had only a quick glimpse of him, and all she really noticed was how tall he was. He raised one arm toward an automobile waiting on the curved drive.
        - id: ch03-b02
          speaker: narrator
          text: >-
            The automobile started forward. For one moment its bright headlights shone straight through the doorway, throwing the man's shadow sharply onto the wall inside. His arms and legs stretched in strange, long shapes across the floor and high up the corridor wall. He looked exactly like a huge, wavering daddy-long-legs.
        - id: ch03-b03
          speaker: narrator
          text: >-
            Jerusha's anxious frown broke into a quick laugh. She had a naturally sunny spirit and could find amusement in the smallest thing. A Trustee was usually an oppressive fact of life. Finding anything entertaining about one was a welcome surprise.
        - id: ch03-b04
          speaker: narrator
          text: >-
            That little moment cheered her so much that she entered the office smiling. To her surprise, Mrs. Lippett seemed almost pleasant too. She was not exactly smiling, but she wore nearly the same friendly expression she saved for visitors.
        - id: ch03-b05
          speaker: mrs_lippett
          text: Jerusha, sit down. I have something to tell you.
        - id: ch03-b06
          speaker: narrator
          text: >-
            Jerusha dropped into the nearest chair and waited, hardly breathing. An automobile flashed past the window, and Mrs. Lippett looked after it.
        - id: ch03-b07
          speaker: mrs_lippett
          text: Did you see the gentleman who just left?
        - id: ch03-b08
          speaker: jerusha
          text: I saw him from behind.
        - id: ch03-b09
          speaker: mrs_lippett
          text: >-
            He is one of our wealthiest Trustees, and he has donated a great deal of money to support the Home. I cannot tell you his name. He made it very clear that he wishes to remain unknown.
        - id: ch03-b10
          speaker: narrator
          text: >-
            Jerusha's eyes opened a little wider. Mrs. Lippett had never called her into the office before to discuss the peculiar habits of Trustees.
        - id: ch03-b11
          speaker: mrs_lippett
          text: >-
            This gentleman has helped several of our boys. You remember Charles Benton and Henry Freize, don't you? He paid for both of them to go through college. They repaid his generosity by working hard and becoming successful. He asks for no other payment. Until now, he has helped only boys. I have never managed to interest him in any of our girls, no matter how deserving they were. I should tell you that he does not care for girls.
        - id: ch03-b12
          speaker: jerusha
          text: No, ma'am.
        - id: ch03-b13
          speaker: narrator
          text: >-
            Jerusha answered because Mrs. Lippett seemed to expect some reply.
    - id: ch04
      title: An Astonishing Offer
      blocks:
        - id: ch04-b01
          speaker: mrs_lippett
          text: At today's regular meeting, the Trustees discussed what is to become of you.
        - id: ch04-b02
          speaker: narrator
          text: >-
            Mrs. Lippett paused. Then she continued in a slow, peaceful voice that was terribly hard on Jerusha's suddenly tight nerves.
        - id: ch04-b03
          speaker: mrs_lippett
          text: >-
            As you know, children do not usually stay here after they turn sixteen. We made an exception for you. You finished our school when you were fourteen, and you did very well in your studies, though I cannot always say the same about your behavior. So we decided to let you attend the village high school. Now you are about to finish there, and the Home can no longer support you. You have already received two years more than most children do.
        - id: ch04-b04
          speaker: narrator
          text: >-
            Mrs. Lippett did not mention that Jerusha had worked hard for her room and meals during those two years. The Home's needs always came before her education. On days like this one, she had to miss school and stay behind to scrub.
        - id: ch04-b05
          speaker: mrs_lippett
          text: As I was saying, they considered your future and went over your record very carefully.
        - id: ch04-b06
          speaker: narrator
          text: >-
            Mrs. Lippett fixed Jerusha with accusing eyes, as if she were a prisoner on trial. Jerusha looked guilty because that seemed to be what was required, not because she could remember anything especially terrible in her record.
        - id: ch04-b07
          speaker: mrs_lippett
          text: >-
            Ordinarily, a girl in your position would be placed in a job so she could begin earning her living. But you have done well in certain school subjects. Your English work, it seems, has even been brilliant. Miss Pritchard serves both on our visiting committee and on the school board. She spoke with your rhetoric teacher, and today she argued on your behalf. She also read the Trustees an essay you wrote called “Blue Wednesday.”
        - id: ch04-b08
          speaker: narrator
          text: >-
            This time, the guilty look on Jerusha's face was real.
        - id: ch04-b09
          speaker: mrs_lippett
          text: >-
            I thought it showed very little gratitude to make fun of an institution that has done so much for you. If the essay had not been funny, I doubt anyone would have forgiven it. Fortunately for you, the gentleman who just left has an unusually strong sense of humor. Because of that disrespectful paper, he has offered to send you to college.
        - id: ch04-b10
          speaker: jerusha
          text: To college?
          emotion: surprised
        - id: ch04-b11
          speaker: narrator
          text: Jerusha's eyes grew enormous. Mrs. Lippett nodded.
        - id: ch04-b12
          speaker: mrs_lippett
          text: >-
            He stayed behind to discuss the conditions with me. They are quite unusual. The gentleman is rather unpredictable. He believes you have originality, and he intends to educate you to become a writer.
        - id: ch04-b13
          speaker: jerusha
          text: A writer?
          emotion: surprised
        - id: ch04-b14
          speaker: narrator
          text: >-
            Jerusha's mind had gone numb. All she could do was repeat Mrs. Lippett's words.
    - id: ch05
      title: The Terms of Her Future
      blocks:
        - id: ch05-b01
          speaker: mrs_lippett
          text: >-
            That is what he wants. Whether you will actually succeed is something only the future can tell. He has decided to give you a very generous allowance. In fact, it may be too generous for a girl who has never had to manage money. But he arranged every detail himself, and I did not feel it was my place to object.
        - id: ch05-b02
          speaker: mrs_lippett
          text: >-
            You will stay here through the summer. Miss Pritchard has kindly agreed to oversee the clothes and other things you will need. Your tuition and board will be paid directly to the college. On top of that, throughout your four years there, you will receive thirty-five dollars each month. That will allow you to live on the same level as the other students.
        - id: ch05-b03
          speaker: mrs_lippett
          text: >-
            The gentleman's private secretary will send you the money once a month. In return, you must write one letter every month to acknowledge it. You are not supposed to thank the gentleman for the money. He does not want you to mention that. Instead, you will tell him how your studies are going and describe the ordinary details of your daily life. Write the kind of letter you would send to your parents if they were alive.
        - id: ch05-b04
          speaker: mrs_lippett
          text: >-
            Address every letter to Mr. John Smith and send it through his secretary. John Smith is not the gentleman's real name, but he intends to stay anonymous. As far as you are concerned, he will always be John Smith.
        - id: ch05-b05
          speaker: mrs_lippett
          text: >-
            He requires these letters because he believes regular letter writing is one of the best ways to become skillful with words. You have no family to write to, so he wants you to practice this way. It will also let him follow your progress.
        - id: ch05-b06
          speaker: mrs_lippett
          text: >-
            He will never answer you. He will not respond to your letters in any way at all. He hates writing letters and does not want you to become a nuisance. If something happens that absolutely requires an answer, such as your being expelled, which I sincerely hope will never occur, then you may write to his secretary, Mr. Griggs.
        - id: ch05-b07
          speaker: mrs_lippett
          text: >-
            Your monthly letters are required. They are the only repayment Mr. Smith asks of you, so you must send them as reliably as you would pay a bill. I hope your tone will always be respectful and that your letters will show the quality of the training you received here. Never forget that you are writing to a Trustee of the John Grier Home.
        - id: ch05-b08
          speaker: narrator
          text: >-
            Jerusha looked longingly at the door. Her head spun with excitement. She wanted only to escape Mrs. Lippett's solemn advice and have a chance to think. She stood and took one careful step backward. But Mrs. Lippett stopped her with a gesture. This was too fine a chance for a speech to let it end so soon.
        - id: ch05-b09
          speaker: mrs_lippett
          text: >-
            I trust you understand how grateful you should be for this rare piece of good fortune. Very few girls in your position are ever given such a chance to improve their place in the world. You must always remember—
        - id: ch05-b10
          speaker: jerusha
          text: >-
            I do. Yes, ma'am. Thank you. If that's everything, I need to go patch Freddie Perkins's trousers.
        - id: ch05-b11
          speaker: narrator
          text: >-
            The door shut behind Jerusha. Mrs. Lippett stared after her with her mouth open, her grand conclusion still hanging in the air.
