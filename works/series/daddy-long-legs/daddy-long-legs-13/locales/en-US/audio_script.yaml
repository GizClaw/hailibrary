audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm, observant storytelling with a dry touch of humor
        timbre: clear and gently textured
        pace: measured and flowing
        pitch: medium
    jerusha:
      display_name: Jerusha Abbott
      tts:
        delivery: bright, quick, and candid, with feeling close to the surface
        timbre: youthful and clear
        pace: lively
        pitch: medium-high
  chapters:
    - id: ch01
      title: 20th December
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: December twentieth.
        - id: ch01-b02
          speaker: jerusha
          text: >-
            Dear Daddy-Long-Legs, I only have a moment. I have two classes to attend, a trunk and a suitcase to pack, and a four o'clock train to catch. But I couldn't leave without telling you how much I love my Christmas box.
        - id: ch01-b03
          speaker: jerusha
          text: >-
            I love the furs, the necklace, the Liberty scarf, the gloves, the handkerchiefs, the books, and the purse. Most of all, I love you! But Daddy, you really shouldn't spoil me like this. I'm only human, and I'm a girl besides. How am I supposed to keep my mind firmly on a serious life of study when you distract me with all these worldly delights?
          emotion: happy
        - id: ch01-b04
          speaker: jerusha
          text: >-
            Now I have a strong suspicion about which John Grier trustee used to provide the Christmas tree and Sunday ice cream. He never gave us his name, but I know him by what he does. You deserve to be happy after all the good things you do.
        - id: ch01-b05
          speaker: jerusha
          text: >-
            Goodbye, and have a very merry Christmas. Yours always, Judy.
        - id: ch01-b06
          speaker: jerusha
          text: >-
            Postscript. I'm sending you a small token too. Do you think you'd like her if you knew her?
    - id: ch02
      title: 11th January
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: January eleventh.
        - id: ch02-b02
          speaker: jerusha
          text: >-
            I meant to write from the city, Daddy, but New York takes up every bit of your attention.
        - id: ch02-b03
          speaker: jerusha
          text: >-
            I had an interesting time, and I learned a great deal. Still, I'm glad I don't belong to a family like that. I honestly prefer having the John Grier Home behind me. My upbringing had plenty wrong with it, but at least no one pretended it was something else.
        - id: ch02-b04
          speaker: jerusha
          text: >-
            Now I understand what people mean when they say they're weighed down by Things. Everything in that house pressed in on me. I couldn't take a full breath until I was on the express train home. Every piece of furniture was carved, upholstered, and magnificent. Everyone was beautifully dressed, soft-spoken, and perfectly well-bred. But Daddy, from the moment we arrived until the moment we left, I never heard one real conversation. I don't believe an idea has ever made it through the front door.
        - id: ch02-b05
          speaker: jerusha
          text: >-
            Mrs. Pendleton thinks about nothing but jewelry, dressmakers, and social engagements. What a different mother she is from Mrs. McBride! If I ever marry and have children, I mean to make my family as much like the McBrides as possible. Not for all the money in the world would I let my children turn into Pendletons.
        - id: ch02-b06
          speaker: jerusha
          text: >-
            Perhaps it's rude to criticize people after staying in their home. If it is, please forgive me. This is strictly between you and me.
        - id: ch02-b07
          speaker: jerusha
          text: >-
            I only saw Master Jervie once, when he came for tea, and I never got to speak with him alone. After the lovely time we had last summer, that was a real disappointment. I don't think he cares much for his relatives, and I'm sure they don't care much for him.
          emotion: sad
        - id: ch02-b08
          speaker: jerusha
          text: >-
            Julia's mother says he's unbalanced. He's a Socialist, though thank goodness he doesn't grow his hair long or wear red neckties. She can't imagine where he found such strange ideas. Her family has belonged to the Church of England for generations. Instead of buying sensible things like yachts, automobiles, and polo ponies, he throws his money at every wild reform he finds.
        - id: ch02-b09
          speaker: jerusha
          text: >-
            He does spend some of it on candy. He sent Julia and me a box apiece for Christmas.
        - id: ch02-b10
          speaker: jerusha
          text: >-
            You know, I think I may become a Socialist too. You wouldn't object, would you, Daddy? Socialists are quite different from Anarchists. They don't want to blow people up. I probably belong with them by birth anyway, since I'm one of the proletariat. I haven't decided which kind of Socialist I'll be. I'll study the subject on Sunday and announce my principles in my next letter.
        - id: ch02-b11
          speaker: jerusha
          text: >-
            I've seen more theaters, hotels, and beautiful houses than I can count. My head is still spinning with onyx, gold decoration, mosaic floors, and palm trees. I'm a little breathless from it all, but I'm glad to be back with my books at college.
        - id: ch02-b12
          speaker: jerusha
          text: >-
            I believe I really am a student. The calm air here wakes me up more than New York ever could. College life is deeply satisfying. Books, studying, and regular classes keep your mind alive. When your brain gets tired, there is the gym and outdoor sports. And there are always good friends nearby who care about the same things you do.
        - id: ch02-b13
          speaker: jerusha
          text: >-
            We can spend an entire evening talking and talking, then go to bed feeling wonderfully noble, as if we've solved some urgent problem for the whole world. And every empty moment gets filled with nonsense. We make foolish jokes about whatever happens, and they satisfy us completely. We certainly appreciate our own cleverness!
        - id: ch02-b14
          speaker: jerusha
          text: >-
            I've discovered that the biggest pleasures aren't the ones that matter most. The secret of happiness is making a great deal out of little pleasures and living right now. Don't keep regretting the past or waiting for the future. Take everything you can from this very moment.
        - id: ch02-b15
          speaker: jerusha
          text: >-
            It's like farming. A farmer can spread his work over a great deal of land, or work one smaller piece very carefully. From now on, I'm choosing that second kind of life. I mean to enjoy every second and know that I'm enjoying it while it happens.
        - id: ch02-b16
          speaker: jerusha
          text: >-
            Most people don't really live. They race toward some faraway point on the horizon. They run so hard that they stop seeing the beautiful, peaceful country they're passing through. Then suddenly they're old and tired, and it no longer matters whether they reached the goal.
        - id: ch02-b17
          speaker: jerusha
          text: >-
            I've decided to sit down beside the road and gather a great many little happinesses, even if I never become a Great Author. Have you ever met such a philosopher as I'm becoming? Yours ever, Judy.
        - id: ch02-b18
          speaker: jerusha
          text: >-
            Postscript. It's raining cats and dogs tonight. Two puppies and a kitten have just landed on the windowsill.
    - id: ch03
      title: Dear Comrade
      blocks:
        - id: ch03-b01
          speaker: jerusha
          text: Dear Comrade, hooray! I'm a Fabian.
          emotion: happy
        - id: ch03-b02
          speaker: jerusha
          text: >-
            A Fabian is a Socialist who's willing to wait. We don't want the social revolution to arrive tomorrow morning. That would upset everything. We want it to come little by little, sometime far in the future, when we're all ready and able to bear the shock.
        - id: ch03-b03
          speaker: jerusha
          text: >-
            While we're waiting, we must prepare by reforming industry, education, and orphan asylums. Yours, with fraternal love, Judy.
        - id: ch03-b04
          speaker: narrator
          text: Monday, third hour.
    - id: ch04
      title: 11th February
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: February eleventh.
        - id: ch04-b02
          speaker: jerusha
          text: >-
            Dear D-L-L, don't be offended because this is so short. It isn't really a letter. It's only one line to promise that I'll write properly as soon as examinations are over. I don't merely have to pass. I have to pass well. I have a scholarship to live up to. Yours, studying hard, J. A.
    - id: ch05
      title: 5th March
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: March fifth.
        - id: ch05-b02
          speaker: jerusha
          text: >-
            Dear Daddy-Long-Legs, President Cuyler gave us a speech tonight about how careless and shallow the modern generation has become. He says we're losing the old ideals of serious effort and true scholarship. Worst of all, our disrespect for organized authority shows how far we've fallen. We no longer treat our superiors with the proper respect.
        - id: ch05-b03
          speaker: jerusha
          text: >-
            I left chapel feeling very solemn. Am I too familiar with you, Daddy? Should I address you with more dignity and distance? Yes, I'm certain I should. Let me begin again.
        - id: ch05-b04
          speaker: jerusha
          text: My dear Mr. Smith,
        - id: ch05-b05
          speaker: jerusha
          text: >-
            You will be pleased to learn that I passed my midyear examinations successfully and have begun my work for the new semester. Having completed qualitative analysis, I am leaving chemistry and taking up biology. I approach the subject with some concern, since I understand that we must dissect earthworms and frogs.
        - id: ch05-b06
          speaker: jerusha
          text: >-
            Last week, we heard an extremely interesting and valuable chapel lecture about Roman remains in southern France. Never have I listened to such an enlightening explanation of a subject.
        - id: ch05-b07
          speaker: jerusha
          text: >-
            In English Literature, we are studying Wordsworth's Tintern Abbey. What an exquisite poem it is, and how perfectly it expresses his ideas about Pantheism. I find the Romantic movement of the early nineteenth century, represented by poets such as Shelley, Byron, Keats, and Wordsworth, much more appealing than the Classical period before it. And while we're discussing poetry, have you read Tennyson's charming little poem called Locksley Hall?
        - id: ch05-b08
          speaker: jerusha
          text: >-
            Lately, I have attended gymnasium with great regularity. The college has introduced a proctor system, and breaking the rules now causes considerable trouble. Our gymnasium has a beautiful cement-and-marble swimming pool, donated by a former graduate. My roommate, Miss McBride, has kindly given me her bathing suit because it shrank and no longer fits her. I am about to begin swimming lessons.
        - id: ch05-b09
          speaker: jerusha
          text: >-
            Last night, we had delicious pink ice cream for dessert. The college uses only vegetable coloring in its food. For reasons of both beauty and health, it strongly opposes artificial aniline dyes.
        - id: ch05-b10
          speaker: jerusha
          text: >-
            Our recent weather has been ideal, with bright sunshine and clouds, interrupted now and then by a welcome snowstorm. My companions and I have greatly enjoyed walking to and from our classes, especially from them.
        - id: ch05-b11
          speaker: jerusha
          text: >-
            Trusting, my dear Mr. Smith, that this letter finds you in your usual good health, I remain most cordially yours, Jerusha Abbott.
