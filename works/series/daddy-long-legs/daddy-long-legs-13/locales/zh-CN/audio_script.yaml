audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 叙述者
      tts:
        delivery: 清楚沉静，简洁报出书信日期与场景转换
        timbre: 温暖清澈
        pace: 舒缓
        pitch: 中音
    judy:
      display_name: 朱迪
      tts:
        delivery: 聪敏直率，像把心事和见闻亲口讲给亲近的人
        timbre: 明亮自然的年轻女声
        pace: 轻快而富于变化，伤心时稍慢
        pitch: 中高音
  chapters:
    - id: ch01
      title: 12月20日
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 12月20日，朱迪赶火车以前，匆匆给长腿叔叔写了一封信。
        - id: ch01-b02
          speaker: judy
          text: 亲爱的长腿叔叔，我只有一点点时间。两堂课等着我去上，衣箱和手提箱等着我收拾，我还得赶四点钟的火车。可我不能就这么走掉，总要先告诉您，我有多喜欢那只圣诞礼盒。
        - id: ch01-b03
          speaker: judy
          text: 那些皮草、项链、利伯蒂花绸围巾，还有手套、手帕、书和钱包，我样样都爱。不过，我最爱的是您！叔叔，您真不该这么宠我。我不过是个凡人，偏偏又是个女孩子。您拿这些好看又不实用的东西来引我分心，我还怎么板着脸，一心走勤学苦读的道路呢？
          emotion: happy
        - id: ch01-b04
          speaker: judy
          text: 现在我非常怀疑，约翰·格里尔孤儿院的董事当中，有一位就是从前送我们圣诞树和星期日冰激凌的人。他从不留姓名，可我认得出他做的好事！您给别人这么多快乐，自己也应该幸福。
        - id: ch01-b05
          speaker: judy
          text: 再见，祝您过一个快快乐乐的圣诞节。永远属于您的朱迪。又及，我也送去了一件小礼物。要是您认识她，您会喜欢她吗？
    - id: ch02
      title: 1月11日
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 1月11日，朱迪从纽约回到大学，又给叔叔写信。
        - id: ch02-b02
          speaker: judy
          text: 叔叔，我本来想在城里写信，可纽约实在太会抓住人的全部心思了。
        - id: ch02-b03
          speaker: judy
          text: 这一趟很有意思，也让我开了眼界。不过，我真庆幸自己不是那种家庭里的人！我宁可拿约翰·格里尔孤儿院当自己的出身。我的成长经历虽然有不少缺憾，至少那里的日子是什么样，就是什么样，没人费心装成另一副模样。
        - id: ch02-b04
          speaker: judy
          text: 现在我明白了，为什么有人会说，自己被“东西”压得喘不过气。那座房子里的物质气息沉甸甸的。我直到坐上回程的特快列车，才敢深深吸一口气。家具件件雕着花、包着软垫，豪华得不得了。那里的人衣着漂亮，说话轻声细气，举止也无可挑剔。可从我们进门到离开，我一句真正有内容的话都没听见。思想这种东西，大概从来没跨进过那座宅子的前门。
        - id: ch02-b05
          speaker: judy
          text: 彭德尔顿太太一天到晚只想着那些珠宝、裁缝和社交约会。她和麦克布赖德太太可真不像同一种母亲！将来我要是结婚成家，一定要让我的一家尽量像麦克布赖德家。就算把全世界的钱都给我，我也不会让自己的孩子长成彭德尔顿家那种人。
        - id: ch02-b06
          speaker: judy
          text: 去别人家做过客，又在背后批评人家，也许不大礼貌吧？要是不礼貌，请您原谅。这些话只在您和我之间说，绝对保密。
        - id: ch02-b07
          speaker: judy
          text: 杰维少爷来喝下午茶时，我只见了他一次，也没机会单独跟他说话。想想去年夏天我们相处得那么愉快，这一回却连话都没能好好说，真叫人失望。他好像不大喜欢自己的亲戚，我也敢肯定，那些亲戚不大喜欢他。
          emotion: sad
        - id: ch02-b08
          speaker: judy
          text: 朱莉娅的母亲说他脑子不正常，因为他是个社会主义者。好在他不留长头发，也不系红领带。她不明白他从哪里沾来了怪思想，说他们家祖祖辈辈都是英国国教徒。他不买游艇、汽车、马球小马这些正经东西，偏把钱扔给各种荒唐改革。
        - id: ch02-b09
          speaker: judy
          text: 不过，他也会拿钱买糖果。圣诞节，他送了朱莉娅和我一人一盒。
        - id: ch02-b10
          speaker: judy
          text: 我想，我也要做个社会主义者。叔叔，您不会介意吧？社会主义者和无政府主义者可不一样，他们不主张把人炸飞。按出身算，我本来就该是一个，因为我是无产阶级。只是我还没决定要做哪一种。星期日我会认真研究，下封信再宣布自己的信条。
        - id: ch02-b11
          speaker: judy
          text: 我看了多得数不清的剧院、旅馆和漂亮房子。现在，缟玛瑙、金色装饰、马赛克地板和棕榈树，还在我脑子里挤成一团。这一切闹得我有些喘不过气，能回到大学，重新坐在自己的书本中间，我真高兴。
        - id: ch02-b12
          speaker: judy
          text: 看来我骨子里确实是个学生。这里安静的学术气息，比纽约更能叫我打起精神。大学生活让人心满意足。书本、功课和每天按时开始的课堂，让脑子一直活跃。脑子累了，还有体育馆和户外运动。身边也总有许多志趣相投的朋友，和你关心同样的事。
        - id: ch02-b13
          speaker: judy
          text: 我们可以整晚说个没完，睡觉时觉得自己崇高极了，好像已经替全世界解决了一个紧要难题。只要有一点空隙，我们又会拿眼前的小事胡闹，讲些傻乎乎的笑话，还个个都很满足。我们可真会欣赏自己的聪明话！
        - id: ch02-b14
          speaker: judy
          text: 我发现，最要紧的不是那些了不起的大快乐，而是把小快乐过得有滋有味。叔叔，我找到了幸福的秘诀，那就是活在眼前。别老懊悔过去，也别光等着未来，要尽量享受现在这一刻。
        - id: ch02-b15
          speaker: judy
          text: 这就像种田。有的人铺开大片土地粗粗地种，有的人守着一小块地精细地种。从今以后，我要选后一种活法。每一秒我都要好好享受，而且快乐的时候，我要明明白白地知道自己正在快乐。
        - id: ch02-b16
          speaker: judy
          text: 多数人不是真的活着，只是在奔跑。他们一心要赶到地平线外那个遥远的目标，越跑越急，最后累得气喘吁吁，连沿途那片美丽安静的乡野都看不见。等他们忽然回过神，已经又老又累。那时候有没有到达目标，也没什么分别了。
        - id: ch02-b17
          speaker: judy
          text: 我决定在路边坐一坐，慢慢攒起许多小幸福。哪怕永远成不了“大作家”，也没有关系。您见过谁像我这样，眼看就要变成女哲学家吗？永远属于您的朱迪。
        - id: ch02-b18
          speaker: judy
          text: 又及，今晚的雨下得像猫狗一起从天上掉。刚刚已经有两只小狗和一只小猫落到窗台上了。
    - id: ch03
      title: 亲爱的同志
      blocks:
        - id: ch03-b01
          speaker: judy
          text: 亲爱的同志，万岁！我现在是费边主义者了。
          emotion: happy
        - id: ch03-b02
          speaker: judy
          text: 费边主义者就是肯等的社会主义者。我们不想让社会革命明天早晨突然来到，那会把一切都打乱。我们希望它在遥远的将来慢慢发生。到那时候，大家都准备好了，也就经得住这场震动。
        - id: ch03-b03
          speaker: judy
          text: 等待的时候，我们得先做好准备，推动工业、教育和孤儿院的改革。怀着同志般的爱，您的朱迪。
        - id: ch03-b04
          speaker: narrator
          text: 这几行字写在星期一第三节课上。
    - id: ch04
      title: 2月11日
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 2月11日，考试还没有结束，朱迪只来得及写一封短信。
        - id: ch04-b02
          speaker: judy
          text: 亲爱的长——腿——叔叔，别嫌它太短。这根本不算信，只是一行字，告诉您等考试结束，我很快就会好好写一封。我不只是非及格不可，还一定得考好，不能辜负那份奖学金。正在苦读的杰·艾。
    - id: ch05
      title: 3月5日
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 3月5日，朱迪听完院长的演说，决定换一种恭敬的口气写信。
        - id: ch05-b02
          speaker: judy
          text: 亲爱的长腿叔叔，今晚凯勒院长发表了一篇演说。他说现代人轻浮又浅薄，正在丢掉过去认真进取、潜心治学的理想。退步最明显的地方，就是我们不尊重有组织的权威，也不肯规规矩矩地敬重上级。
        - id: ch05-b03
          speaker: judy
          text: 我离开小礼拜堂时，神情非常严肃。叔叔，我是不是跟您太不见外了？我该不该更庄重、更疏远一点？对，我确实应该。让我重新开头。
        - id: ch05-b04
          speaker: judy
          text: 尊敬的史密斯先生，想必您乐于得知，我已经顺利通过期中考试，目前正在开始新学期的课程。定性分析课程已经修完，所以我不再学习化学，改为研习生物学。听说我们必须解剖蚯蚓和青蛙，我对这门课不免有些踌躇。
        - id: ch05-b05
          speaker: judy
          text: 上星期，小礼拜堂举办了一场极有意义、极有价值的讲座，内容是法国南部的古罗马遗迹。我以前听过的所有讲解当中，没有一次能这样深入地阐明这个题旨，带给人如此丰富的启迪。
        - id: ch05-b06
          speaker: judy
          text: 英国文学课正在研读华兹华斯的《丁登寺》。这部作品何等精妙，又何等充分地体现了他的泛神论观念！上世纪初的浪漫主义运动，以雪莱、拜伦、济慈和华兹华斯等诗人为代表。和之前的古典主义时期相比，我实在更心向往之。说到诗歌，您是否读过丁尼生那首迷人的小诗《洛克斯利庄园》？
        - id: ch05-b07
          speaker: judy
          text: 近来，我极有规律地前往体育馆锻炼。校方新定了一套学监制度，不遵守规则就会遭遇诸多不便。体育馆里有一座美观非凡的游泳池，用水泥和大理石砌成，是一位往届毕业生赠送的。我的室友麦克布赖德小姐把游泳衣送给了我。那件衣服缩水以后，她已经穿不下了。我即将开始学习游泳。
        - id: ch05-b08
          speaker: judy
          text: 昨晚的甜点是美味的粉红色冰激凌。学院给食物上色时，一律只许使用植物染料。无论从审美还是卫生的角度来看，校方都极力反对使用苯胺染料。
        - id: ch05-b09
          speaker: judy
          text: 近日天气堪称理想。有灿烂的阳光，也有浮云，其间还会落几场叫人欣喜的雪。我和同伴往返课堂，一路散步，兴味盎然，尤其是返程。敬祝尊敬的史密斯先生身体一如往常地康健。谨致最诚挚的问候，杰鲁莎·艾博特。
