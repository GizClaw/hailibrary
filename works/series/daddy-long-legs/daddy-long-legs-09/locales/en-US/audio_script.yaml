audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm, observant storytelling with a dry touch of humor
        timbre: clear and gently textured
        pace: measured and flowing
        pitch: medium
    jerusha:
      display_name: Jerusha Abbott
      tts:
        delivery: bright, quick, and candid, with feeling close to the surface
        timbre: youthful and clear
        pace: lively
        pitch: medium-high
  chapters:
    - id: ch01
      title: 10th April
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: April tenth.
        - id: ch01-b02
          speaker: jerusha
          text: >-
            Dear Mr. Rich-Man, I'm sending back your fifty-dollar check. Thank you very much, but I don't feel right keeping it. My allowance covers all the hats I need. I'm sorry I went on so foolishly about that millinery shop. I'd simply never seen anything like it before.
        - id: ch01-b03
          speaker: jerusha
          text: >-
            But I wasn't asking you to buy me anything. I'd rather not take any more charity than I absolutely must. Sincerely yours, Jerusha Abbott.
    - id: ch02
      title: 11th April
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: April eleventh.
        - id: ch02-b02
          speaker: jerusha
          text: >-
            Dearest Daddy, please forgive the letter I sent yesterday. I regretted it the moment it was in the mail. I even tried to get it back, but that beastly mail clerk refused to return it.
        - id: ch02-b03
          speaker: jerusha
          text: >-
            It's the middle of the night, and I've been lying awake for hours, thinking what a worm I am. A thousand-legged worm! That's the worst thing I can call myself. I shut the study door as quietly as I could, so Julia and Sallie wouldn't wake up. Now I'm sitting in bed, writing on a page torn from my history notebook.
        - id: ch02-b04
          speaker: jerusha
          text: >-
            I had to tell you how sorry I am for being so rude about your check. I know you meant it kindly. You're an old dear to go to so much trouble over a silly little thing like a hat, and I should have sent it back much more graciously.
        - id: ch02-b05
          speaker: jerusha
          text: >-
            Still, I did have to return it. Things are different for me. Other girls can accept presents naturally. They have fathers and brothers and aunts and uncles. I can't have that kind of relationship with anyone. I like pretending that you belong to me, just for the pleasure of the idea, but of course I know you don't. I'm really alone, with my back against the wall, fighting the world. Sometimes the thought leaves me hardly able to breathe. Usually I push it away and go on pretending.
        - id: ch02-b06
          speaker: jerusha
          text: >-
            But don't you understand, Daddy? I can't accept more money than I have to. Someday I'll want to pay it all back, and even the great author I mean to become couldn't face a perfectly tremendous debt. I'd love to have pretty hats and other lovely things, but I mustn't mortgage my future to buy them.
        - id: ch02-b07
          speaker: jerusha
          text: >-
            You will forgive me for being rude, won't you? I have a terrible habit of writing the first thing that comes into my head and mailing it before I can stop myself. If I ever seem thoughtless or ungrateful, I don't mean to be. Deep down, I'm always thanking you for the life and freedom and independence you've given me.
        - id: ch02-b08
          speaker: jerusha
          text: >-
            My childhood was one long, gloomy rebellion. Now I'm so happy every minute that I can hardly believe any of this is real. I feel like a heroine someone invented for a storybook.
        - id: ch02-b09
          speaker: jerusha
          text: >-
            It's two fifteen in the morning. I'm going to tiptoe out and mail this now. It will reach you right after the other letter, so you won't have too long to think badly of me. Good night, Daddy. I love you always. Judy.
    - id: ch03
      title: 4th May
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: May fourth.
        - id: ch03-b02
          speaker: jerusha
          text: >-
            Dear Daddy-Long-Legs, we had Field Day last Saturday, and it was quite a spectacle. It began with a parade of all the classes. Everyone wore white linen. The seniors carried blue-and-gold Japanese umbrellas, and the juniors marched with white-and-yellow banners. Our class carried crimson balloons. They looked wonderful, especially when they escaped and floated away. The freshmen wore green tissue-paper hats with long streamers.
        - id: ch03-b03
          speaker: jerusha
          text: >-
            We even hired a town band dressed in blue uniforms. Between the events, about a dozen ridiculous circus-clown people kept the crowd amused.
        - id: ch03-b04
          speaker: jerusha
          text: >-
            Julia dressed up as a fat countryman, complete with a linen duster, whiskers, and a baggy umbrella. Tall, thin Patsy Moriarty played his wife, wearing an absurd green bonnet tipped over one ear. Her real name is Patrici, by the way. Have you ever heard anything like it? Even Mrs. Lippett couldn't have chosen a better name.
        - id: ch03-b05
          speaker: jerusha
          text: >-
            People laughed all the way around the course as those two went by. Julia was extremely funny. I never imagined a Pendleton could have such a gift for comedy. I beg Master Jervie's pardon, of course, though I no more think of him as a true Pendleton than I think of you as a true Trustee.
        - id: ch03-b06
          speaker: jerusha
          text: >-
            Sallie and I missed the parade because we had entered the contests. And guess what? We both won something! We lost the running broad jump, but Sallie won the pole vault at seven feet three inches, and I won the fifty-yard sprint in eight seconds.
        - id: ch03-b07
          speaker: jerusha
          text: >-
            I was gasping by the finish, but it was glorious. The whole class waved balloons and shouted, "What's the matter with Judy Abbott? She's all right! Who's all right? Judy Ab-bott!"
        - id: ch03-b08
          speaker: jerusha
          text: >-
            That, Daddy, is what true fame feels like. Afterward I trotted back to the dressing tent, where they rubbed me down with alcohol and gave me a lemon to suck. You can see how very professional we are.
        - id: ch03-b09
          speaker: jerusha
          text: >-
            Winning an event for your class matters because the class with the most victories receives the athletic cup for the year. The seniors took it this time with seven events. Then the athletic association served dinner in the gym for all the winners. We ate fried soft-shell crabs and chocolate ice cream shaped like basketballs.
        - id: ch03-b10
          speaker: jerusha
          text: >-
            I spent half of last night reading Jane Eyre. Daddy, are you old enough to remember what life was like sixty years ago? If you are, did people truly talk that way?
        - id: ch03-b11
          speaker: jerusha
          text: >-
            Proud Lady Blanche orders a footman to stop chattering and obey her. Mr. Rochester says "the metal welkin" when he only means the sky. And then there's the madwoman. She laughs like a hyena, burns bed curtains, tears up wedding veils, and bites people. It is melodrama in its purest form, but you still read and read and read.
        - id: ch03-b12
          speaker: jerusha
          text: >-
            I can't understand how any girl managed to write a book like that, especially a girl raised in a churchyard. Something about the Brontes fascinates me. Their books, their lives, their spirit. Where did all of it come from?
        - id: ch03-b13
          speaker: jerusha
          text: >-
            When I reached little Jane's troubles at the charity school, I became so angry that I had to take a walk. I knew exactly what she was feeling. After living with Mrs. Lippett, it was easy for me to picture Mr. Brocklehurst.
        - id: ch03-b14
          speaker: jerusha
          text: >-
            Now, don't be offended, Daddy. I'm not saying the John Grier Home was another Lowood Institute. We had enough food and clothes, enough water for washing, and a furnace down in the cellar. But the two places did share one terrible thing. Life was completely monotonous. Nothing pleasant ever happened except Sunday ice cream, and even that came regularly.
        - id: ch03-b15
          speaker: jerusha
          text: >-
            In all my eighteen years there, I had exactly one adventure. The woodshed caught fire. We got up in the night and dressed, ready in case the house caught too. It didn't, so we all went back to bed.
        - id: ch03-b16
          speaker: jerusha
          text: >-
            Everyone needs an occasional surprise. It's a perfectly natural human craving. I never had one until Mrs. Lippett summoned me to the office and told me that Mr. John Smith meant to send me to college. Even then, she gave me the news so slowly that it barely managed to shock me.
        - id: ch03-b17
          speaker: jerusha
          text: >-
            You know, Daddy, I believe imagination may be the most important quality anyone can have. It lets you put yourself in someone else's place. That's how people learn to be kind, sympathetic, and understanding. Children ought to be taught to use it. At the John Grier Home, though, the smallest spark of imagination was stamped out at once.
        - id: ch03-b18
          speaker: jerusha
          text: >-
            Duty was the only quality they encouraged. I don't think children should even know what that word means. It's hateful. Children ought to do things because they love to.
        - id: ch03-b19
          speaker: jerusha
          text: >-
            Just wait until you see the orphan asylum I'm going to run! Planning it is my favorite game when I'm falling asleep. I work out every tiny detail, from the meals and clothes to lessons, games, and punishments. Even my excellent orphans will misbehave sometimes.
        - id: ch03-b20
          speaker: jerusha
          text: >-
            Whatever happens, they are going to be happy. No matter what troubles a person meets as an adult, everyone should have a happy childhood to remember. And if I ever have children of my own, however unhappy I may be, I won't let them carry any worries until they're grown.
        - id: ch03-b21
          speaker: jerusha
          text: >-
            There's the chapel bell. I'll have to finish this letter another time.
        - id: ch03-b22
          speaker: narrator
          text: Thursday.
        - id: ch03-b23
          speaker: jerusha
          text: >-
            When I came back from the laboratory this afternoon, a squirrel was sitting on our tea table, helping himself to the almonds. Those are the visitors we get now that the weather is warm and the windows stay open.
        - id: ch03-b24
          speaker: narrator
          text: Saturday morning.
        - id: ch03-b25
          speaker: jerusha
          text: >-
            You may imagine that, since last night was Friday and there were no classes today, I spent a peaceful evening reading the set of Stevenson I bought with my prize money. If you think that, Daddy dear, you've never gone to a girls' college.
        - id: ch03-b26
          speaker: jerusha
          text: >-
            Six friends came in to make fudge. One of them dropped it while it was still liquid, right in the middle of our best rug. We'll never get that mess out.
        - id: ch03-b27
          speaker: jerusha
          text: >-
            I haven't said much about lessons lately, but we do still have them every day. It's a relief to escape from them and talk about life in general with you. Our discussions are rather one-sided, but that is your fault. You may answer whenever you like.
        - id: ch03-b28
          speaker: jerusha
          text: >-
            I've been adding to this letter for three days, and by now I fear you are very bored. Goodbye, nice Mr. Man. Judy.
    - id: ch04
      title: A Letter in Proper Form
      blocks:
        - id: ch04-b01
          speaker: jerusha
          text: >-
            Mr. Daddy-Long-Legs Smith, sir. Now that I've studied argumentation and learned the science of dividing a thesis into headings, I've chosen a new form for my letters. It gives every necessary fact with no unnecessary words.
        - id: ch04-b02
          speaker: jerusha
          text: >-
            First, we had written examinations this week in chemistry and history.
        - id: ch04-b03
          speaker: jerusha
          text: >-
            Second, a new dormitory is going up. It will be built of red brick and gray stone. It will hold one dean, five instructors, two hundred girls, one housekeeper, three cooks, twenty waitresses, and twenty chambermaids.
        - id: ch04-b04
          speaker: jerusha
          text: >-
            Third, we had junket for dessert tonight.
        - id: ch04-b05
          speaker: jerusha
          text: >-
            Fourth, I'm writing a special paper on the sources of Shakespeare's plays.
        - id: ch04-b06
          speaker: jerusha
          text: >-
            Fifth, Lou McMahon slipped during basketball this afternoon. She dislocated her shoulder and bruised her knee.
        - id: ch04-b07
          speaker: jerusha
          text: >-
            Sixth, I have a new hat trimmed with blue velvet ribbon, two blue quills, and three red pompoms.
        - id: ch04-b08
          speaker: jerusha
          text: >-
            Seventh, it is half past nine.
        - id: ch04-b09
          speaker: jerusha
          text: >-
            Eighth, good night. Judy.
