audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 叙述者
      tts:
        delivery: 清楚沉静，简洁报出书信日期
        timbre: 温暖清澈
        pace: 舒缓
        pitch: 中音
    judy:
      display_name: 朱迪
      tts:
        delivery: 聪敏活泼，像把新鲜见闻亲口讲给亲近的人
        timbre: 明亮自然的年轻女声
        pace: 轻快而富于变化
        pitch: 中高音
    student_1:
      display_name: 学生甲
      tts:
        delivery: 兴奋响亮，带头喊出运动会口号
        timbre: 清脆的年轻女声
        pace: 明快
        pitch: 中高音
    student_2:
      display_name: 学生乙
      tts:
        delivery: 热烈齐整，跟着同学高声应和
        timbre: 明亮的年轻女声
        pace: 明快
        pitch: 中高音
    student_3:
      display_name: 学生丙
      tts:
        delivery: 活泼有力，在集体口号中清晰应声
        timbre: 爽朗的年轻女声
        pace: 明快
        pitch: 中音
    student_4:
      display_name: 学生丁
      tts:
        delivery: 充满朝气，与同学一起放声欢呼
        timbre: 清朗的年轻女声
        pace: 明快
        pitch: 中音
  chapters:
    - id: ch01
      title: 4月10日
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 4月10日，朱迪退回了那张支票。
        - id: ch01-b02
          speaker: judy
          text: 亲爱的阔佬先生，这是您的五十美元支票。多谢您，可我不能收。零用钱已经够我买所有需要的帽子了。上回我写了那么多帽子店的傻话，实在抱歉。我只是从没见过那种地方。
        - id: ch01-b03
          speaker: judy
          text: 可我没有向您讨东西！除了非接受不可的帮助，我不想再多受施舍。谨上，洁茹莎·艾博特。
    - id: ch02
      title: 4月11日
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 第二天半夜，朱迪又写了一封信。
        - id: ch02-b02
          speaker: judy
          text: 最亲爱的叔叔，请你原谅我昨天那封信，好吗？寄出去以后，我马上就后悔了。我跑去想把信取回来，可那个讨厌的邮务员怎么都不肯给我。
        - id: ch02-b03
          speaker: judy
          text: 现在是半夜，我已经醒了几个钟头，越想越觉得自己是条坏虫子，还是条千足大虫。我再也想不出比这更狠的骂法了！怕吵醒朱莉娅和莎莉，我轻轻关上通往书房的门。我正坐在床上，拿从历史笔记本里撕下的纸给你写信。
        - id: ch02-b04
          speaker: judy
          text: 我就想说，我真后悔自己谈到支票时那么失礼。我明白你是好意。一顶帽子这么小的事，你也肯为我费心，真是个亲切的老好人。我明明可以更客气地把支票退回来。
        - id: ch02-b05
          speaker: judy
          text: 不过，这张支票我非退不可。别的姑娘收下东西，可以觉得理所当然。她们有父亲、兄弟、姑妈和叔伯，我却没有谁能跟我这样亲近。我总爱想象你属于我，这样想着玩很有意思。可我当然知道，你并不是我的亲人。
        - id: ch02-b06
          speaker: judy
          text: 其实，我是孤零零一个人，背靠着墙，独自跟整个世界打仗。想到这里，我就有点喘不上气。我平时不让自己去想，只管继续假装。可是叔叔，你还不明白吗？除了非收不可的钱，我不能再多拿。总有一天，我会想把这些钱还给你。到时候，就算我成了梦想中的大作家，也不敢面对一笔大得吓人的债。
        - id: ch02-b07
          speaker: judy
          text: 漂亮帽子和那些好东西，我都喜欢。可不能为了买它们，先把自己的将来抵押掉。
        - id: ch02-b08
          speaker: judy
          text: 我那么粗鲁，你会原谅我吧？我有个大毛病。念头刚冒出来，我就冲动地写下来，紧接着又把信寄了，再想追也追不回。我有时看着没心没肺，好像不知感恩，但我绝不是有意的。在我心里，我永远感谢你给我的生活、自由和独立。
        - id: ch02-b09
          speaker: judy
          text: 我的童年漫长又阴郁，几乎全在反抗中度过。如今，我从早到晚时时刻刻都这么快乐，简直不敢相信这是真的。我像个从故事书里编出来的女主人公。
        - id: ch02-b10
          speaker: judy
          text: 现在是两点一刻。我要踮着脚尖出去寄信了。它会紧跟在上一封后面到你手里，你便没有多少时间说我坏。晚安，叔叔。我永远爱你。朱迪。
    - id: ch03
      title: 5月4日·运动会
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 5月4日，朱迪说起上星期六的运动会。
        - id: ch03-b02
          speaker: judy
          text: 亲爱的长腿叔叔，那天的场面可壮观了。各年级先游行，人人都穿白麻衣裳。四年级生撑着蓝金两色的日式纸伞，三年级生打着白黄两色的旗帜。我们年级拿深红气球，真是好看，尤其它们总从手里逃走，飘上天去。一年级生戴绿色薄纸帽，后面拖着长飘带。城里还来了一支穿蓝制服的乐队。十来个滑稽人物像马戏团的小丑，趁比赛空隙逗观众。
        - id: ch03-b03
          speaker: judy
          text: 朱莉娅扮成胖乎乎的乡下男人，穿亚麻防尘长衣，贴上胡子，还拿了一把松垮垮的伞。又高又瘦的帕茜·莫里亚蒂扮她的妻子，一顶荒唐的绿帽子斜挂在耳朵上。帕茜其实叫帕特里夏。你听过这样的名字吗？就算利佩特太太来起，也未必能更妙。她们走完整条赛道，一路都有笑声追着。
        - id: ch03-b04
          speaker: judy
          text: 朱莉娅演得好极了。我从没想到，彭德尔家的人也能有这么多滑稽天分。请杰维少爷原谅。不过，我没把他当成真正的彭德尔家人，就跟我没把你当成真正的董事一样。
        - id: ch03-b05
          speaker: judy
          text: 莎莉和我要比赛，所以没参加游行。你猜结果怎样？我们俩都赢了，至少各赢了一项！急行跳远我们输了，但莎莉以七英尺三英寸赢下撑竿跳，我用八秒跑完五十码，拿了第一。
        - id: ch03-b06
          speaker: judy
          text: 到终点时，我喘得厉害，可实在好玩。全年级的人挥着气球，一起欢呼大喊。
        - id: ch03-b07
          speaker: student_1
          text: 朱迪·艾博特怎么样？
        - id: ch03-b08
          speakers: [student_2, student_3, student_4]
          ensemble: chorus
          text: 她好得很！
          emotion: happy
        - id: ch03-b09
          speaker: student_1
          text: 谁好得很？
        - id: ch03-b10
          speakers: [student_2, student_3, student_4]
          ensemble: chorus
          text: 朱——迪·艾——博特！
          emotion: happy
        - id: ch03-b11
          speaker: judy
          text: 叔叔，这才是真正的名望。然后我小跑回更衣帐篷，让人用酒精擦身，又吮起柠檬来。你看，我们多有职业选手的派头。替自己的年级赢下一项比赛，是件了不起的事。一年里赢得最多的年级，会拿到体育奖杯。今年四年级赢了七项，奖杯归了她们。体育协会在体育馆请所有获胜者吃晚餐，有油炸软壳蟹，还有做成篮球样子的巧克力冰淇淋。
    - id: ch04
      title: 5月4日·《简·爱》与童年
      blocks:
        - id: ch04-b01
          speaker: judy
          text: 昨晚我读《简·爱》，一直读到半夜。叔叔，你的年纪够不够大，还能记得六十年前？要是记得，那时候的人真会那样说话吗？
        - id: ch04-b02
          speaker: judy
          text: 那位傲慢的布兰奇夫人，竟然命令男仆闭上嘴，骂他是奴才，叫他听命行事。罗切斯特先生想说天空，却说什么铁打的苍穹。还有那个疯女人，笑起来像鬣狗，点燃床帘，撕烂婚纱，居然还咬人。这是最纯正的通俗闹剧，可你就是会不停地读下去。
        - id: ch04-b03
          speaker: judy
          text: 我真想不通，一个女孩怎么写得出这样的书，更何况她还是在教堂墓地里长大的。勃朗特姐妹真叫我着迷。她们的书、生活和精神，究竟是从哪里来的？我读到小简在慈善学校里吃的苦，气得非得出门走走。我完全懂她的感受。我既然认识利佩特太太，也就能看清布罗克尔赫斯特先生。
        - id: ch04-b04
          speaker: judy
          text: 叔叔，别生气。我可没说约翰·格里尔孤儿院跟劳沃德学校一样。我们吃得饱，有衣服穿，洗澡的水也够，地下室还有暖炉。可两边有一点像得要命。那里的日子都单调得不得了，什么事也不会发生。除了星期日的冰淇淋，从来没有好事，可就连冰淇淋也每周准时出现。
        - id: ch04-b05
          speaker: judy
          text: 我在那里过了十八年，只遇上一次险事，就是柴房起火。我们半夜起来穿好衣服，等着看房子会不会也烧起来。结果它没烧，大家又上床睡觉了。
        - id: ch04-b06
          speaker: judy
          text: 谁都喜欢偶尔来点意外，人天生就有这种愿望。可在利佩特太太叫我去办公室，说约翰·史密斯先生要送我上大学之前，我一次惊喜也没遇到过。偏偏她把消息说得那么慢，我差点连惊都没惊着。
        - id: ch04-b07
          speaker: judy
          text: 我想，人最需要的品质是想象力。它能让人站到别人的位置上去想，也能让人变得仁慈，懂得同情和体谅。孩子的想象力本该好好培养。可约翰·格里尔孤儿院一见到小小的火花冒出来，马上就把它踩灭。那里只鼓励一种品质，就是尽责。我甚至觉得，孩子都不该知道“职责”这个词。它又可恶又叫人讨厌。孩子做事，应该全是因为爱。
        - id: ch04-b08
          speaker: judy
          text: 你就等着看我将来主持的孤儿院吧！每天晚上睡之前，我最爱想这个游戏。饭食、衣服、功课、游戏，还有惩罚，我会连最小的细节都安排好。就算是我那些了不起的孤儿，有时也会做坏事。
        - id: ch04-b09
          speaker: judy
          text: 但他们一定会很快乐。一个人长大以后，不管要经历多少烦恼，都该有一段幸福童年可以回想。如果我将来有自己的孩子，无论我过得多不快乐，也不会让他们在长大前有一点忧愁。
        - id: ch04-b10
          speaker: judy
          text: 教堂的钟响了。这封信，我改天再写完。
    - id: ch05
      title: 星期四与星期六早晨
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 到了星期四，信纸上又多了几行。
        - id: ch05-b02
          speaker: judy
          text: 今天下午，我从实验室回来，看见一只松鼠坐在茶几上，正不客气地拿杏仁吃。暖和天气来了，窗户总是开着，我们现在接待的就是这种客人。
        - id: ch05-b03
          speaker: narrator
          text: 星期六早晨，朱迪又接着写。
        - id: ch05-b04
          speaker: judy
          text: 亲爱的叔叔，昨晚是星期五，今天又没课。你可能以为，我会安安静静地读一晚上书，陪着那套用比赛奖金买的史蒂文森文集。要是你真这样想，那你一定没上过女子学院。六个朋友跑来做牛奶软糖，其中一个把还是稀的糖弄掉了，全洒在我们最好的地毯正中央。那一摊再也清理不干净了。
        - id: ch05-b05
          speaker: judy
          text: 我最近没提功课，但课还是每天都在上。偶尔把它们放在一边，跟你谈谈广阔的人生，真叫人轻松。虽然我们的讨论只有我一个人说话，但这要怪你自己。你什么时候想回信反驳，我都欢迎。
        - id: ch05-b06
          speaker: judy
          text: 这封信我断断续续写了三天。恐怕到了现在，你已经被我烦得不得了吧！再见，好心的先生。朱迪。
    - id: ch06
      title: 提纲式的信
      blocks:
        - id: ch06-b01
          speaker: judy
          text: 长腿叔叔·史密斯先生，先生，我已经学完议论文写作，也学会了怎样把一篇论文分成各个标题。所以，我决定改用下面这种格式写信。必要的事实全在里面，却不会多说一句废话。
        - id: ch06-b02
          speaker: judy
          text: 第一，这星期我们进行了笔试。甲，化学。乙，历史。
        - id: ch06-b03
          speaker: judy
          text: 第二，一栋新宿舍正在修建。甲，建筑材料。第一，红砖。第二，灰色石材。乙，容纳人员。第一，一名学院主任和五名教师。第二，两百名女生。第三，一名管家、三名厨师、二十名餐厅女侍，还有二十名客房女侍。
        - id: ch06-b04
          speaker: judy
          text: 第三，今晚的甜点是凝乳。第四，我正在写一篇专题论文，题目叫《莎士比亚戏剧的素材来源》。
        - id: ch06-b05
          speaker: judy
          text: 第五，露·麦克马洪今天下午打篮球时滑倒了。甲，她的肩膀脱臼。乙，她的膝盖撞伤。
        - id: ch06-b06
          speaker: judy
          text: 第六，我有一顶新帽子。帽子上有蓝色天鹅绒缎带，两根蓝色长羽毛，还有三个红色毛绒球。
        - id: ch06-b07
          speaker: judy
          text: 第七，现在是九点半。第八，晚安。朱迪。
