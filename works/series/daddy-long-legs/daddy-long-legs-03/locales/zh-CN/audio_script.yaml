audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 机敏而从容，带着温和的讽刺意味
        timbre: 温暖清亮
        pace: 舒缓而富有变化
        pitch: 中音
    jerusha_abbott:
      display_name: 杰鲁莎·艾博特
      tts:
        delivery: 聪敏直率，克制中透出活泼和想象力
        timbre: 清澈明亮的少女声线
        pace: 自然轻快，紧张时略快
        pitch: 中高音
  chapters:
    - id: ch01
      title: 十月二十五日：我进篮球队了
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 十月二十五日，朱迪又给长腿叔叔写了一封信。
        - id: ch01-b02
          speaker: jerusha_abbott
          text: 亲爱的长腿叔叔，我进篮球队了！您要是看见我左肩上的淤青，一定会吃惊。那儿一块青，一块红褐，还夹着几道橙黄色。朱莉娅·彭德尔顿也去参加选拔，可她没进。万岁！您这下知道我的心眼有多坏了吧。
        - id: ch01-b03
          speaker: jerusha_abbott
          text: 大学一天比一天更可爱。女孩子、老师、功课、校园，还有吃的东西，我样样都喜欢。我们一星期能吃两次冰激凌，还从来不喝玉米糊。
        - id: ch01-b04
          speaker: jerusha_abbott
          text: 您只想每月收到我一封信，对吧？可我隔几天就寄一封，简直是在拿信轰炸您。这些新鲜经历一件接着一件，每一件都让我兴奋得非找个人讲不可，偏偏我认识的人只有您。请原谅我这么闹腾，我很快就会安静下来的。要是信太烦，您尽管看也不看，随手丢进废纸篓。我保证，十一月中旬以前不再写了。您那最饶舌的朱迪·艾博特。
    - id: ch02
      title: 十一月十五日：新裙子和前线战报
      blocks:
        - id: ch02-b01
          speaker: jerusha_abbott
          text: 亲爱的长腿叔叔，听听我今天学到了什么。正棱锥台的侧面积，等于上下底周长之和乘上任一侧面梯形的高，再除以二。听起来不像真的，可它就是真的，我还能证明呢！
        - id: ch02-b02
          speaker: jerusha_abbott
          text: 我还没给您讲过衣服吧？我有六条崭新漂亮的裙子，全是特意买给我的，不是谁穿小了才给我。您大概不懂，这对一个孤儿来说，是一生里多么了不起的高峰。它们都是您送的，我真是非常、非常、非常感激。受教育固然很好，可拥有六条新裙子的滋味，比那叫人晕眩多了。
        - id: ch02-b03
          speaker: jerusha_abbott
          text: 幸好裙子是探访委员会的普里查德小姐挑的，不是利佩特太太。我有粉红细棉纱罩丝绸的晚礼服，穿上美极了。还有蓝色的礼拜裙，配东方饰边的红薄纱晚餐裙，穿着像吉卜赛姑娘。再加一条玫瑰色软毛料裙，一套灰色出门装，还有平日上课的裙子。六件都是新的，每一件都真正属于我。对朱莉娅·拉特奇·彭德尔顿，这或许不算多大的衣橱。可对杰鲁莎·艾博特来说，我的天哪！
        - id: ch02-b04
          speaker: jerusha_abbott
          text: 您是不是正想，这女孩又轻浮又浅薄，花钱供她读书真浪费？叔叔，要是您一辈子都穿方格棉布，就会懂我的心情。上中学以后，日子甚至比穿方格棉布更糟，因为我进入了另一个时期，开始穿慈善箱里的衣服。每次穿上它们，我还没走进教室，心里已经缩成了一团。
        - id: ch02-b05
          speaker: jerusha_abbott
          text: 我最怕穿着那些可怜的旧裙子去学校。老师仿佛总会把我排在裙子的原主人旁边，她再窃窃私语，笑着指给别人看。穿仇人不要的衣裳，那股苦味会啃进心里。就算后半辈子都穿丝袜，这道疤恐怕也消不掉。
        - id: ch02-b06
          speaker: jerusha_abbott
          text: 现在播报最新战况。十一月十三日星期四第四更，汉尼拔击溃罗马军前锋，率迦太基军翻山进入卡西利努姆平原。一队轻装努米底亚兵迎战昆图斯·费边·马克西姆斯的步兵。两场大战，另有零星交锋。罗马军损失惨重，已经败退。谨致敬意，您的前线特派记者，J.艾博特。
        - id: ch02-b07
          speaker: jerusha_abbott
          text: 又及。我知道不能指望您回信，也有人告诫我别拿问题烦您。可只这一次，请告诉我吧。您是老得不得了，还是只老了一点点？您是秃得彻底，还是只秃了一点点？像想象一道几何定理那样凭空想象您，实在太难了。
        - id: ch02-b08
          speaker: jerusha_abbott
          text: 已知有个又高又富的男人，他讨厌女孩子，却对一个很放肆的女孩十分慷慨。请问，他长什么样？敬请赐复。
    - id: ch03
      title: 十二月十九日：您到底秃不秃
      blocks:
        - id: ch03-b01
          speaker: jerusha_abbott
          text: 亲爱的长腿叔叔，您一直没有回答那个非常重要的问题。您到底秃不秃？
        - id: ch03-b02
          speaker: jerusha_abbott
          text: 您的模样，我从头到脚都安排得清清楚楚，而且十分满意。可一来到头顶，我就卡住了。我不知道您是一头白发、一头黑发，还是头发灰白相间，又或者一根也没有。我已经画好了肖像，现在的问题是，该不该给您添头发？
        - id: ch03-b03
          speaker: jerusha_abbott
          text: 您还想知道自己的眼睛是什么颜色吗？灰色。眉毛像门廊顶一样伸出来，小说把这叫作浓眉压眼。嘴巴抿成一条直线，两个嘴角还总有一点往下撇。您瞧，我全知道。您就是个脾气急、动不动就发火的老家伙。
        - id: ch03-b04
          speaker: narrator
          text: 礼拜堂的钟打断了她。到了晚上九点四十五分，朱迪又接着写。
        - id: ch03-b05
          speaker: jerusha_abbott
          text: 我刚给自己定下一条绝不更改的新规矩。晚上永远不念功课，哪怕第二天早晨有再多笔试。我得读普通的书，因为身后还有十八年的空白要补。叔叔，您想不到我的脑子里有多无知，像一道深不见底的沟，连我自己也是刚发现。别的女孩从家人、朋友和家里的书架上随手拾来的知识，对我来说全是空白。
        - id: ch03-b06
          speaker: jerusha_abbott
          text: 有家、有亲人、有朋友、有藏书的女孩，不知不觉就懂得许多东西，我却连名字也没听过。我没读过《鹅妈妈童谣》、《大卫·科波菲尔》、《艾凡赫》、《灰姑娘》、《蓝胡子》、《鲁滨孙漂流记》、《简·爱》、《爱丽丝漫游奇境》，吉卜林的作品更是一个字都没读过。
        - id: ch03-b07
          speaker: jerusha_abbott
          text: 我不知道亨利八世结过好几次婚，也不知道雪莱是诗人。不知道人类从前是猴子，不知道伊甸园是个美丽的神话。不知道R. L. S.就是罗伯特·路易斯·史蒂文森，也不知道乔治·艾略特是位女士。我没见过《蒙娜丽莎》，甚至连福尔摩斯都没听说过。真的，您虽然不会相信，可这都是真的。
        - id: ch03-b08
          speaker: jerusha_abbott
          text: 如今这些我都知道了，还知道了不少别的，可要补的东西依然多得很。而且读书真有意思！我从早晨起就盼着天黑。到了晚上，我就在门上挂出“请勿打扰”，换上那件漂亮的红浴袍和毛茸茸的拖鞋，把所有靠垫全堆到长沙发背后，让自己舒舒服服地陷进去。接着点亮手边的黄铜台灯，读呀，读呀，一直读。
        - id: ch03-b09
          speaker: jerusha_abbott
          text: 一本书哪里够，我同时读四本。现在读的是丁尼生诗集、《名利场》、吉卜林的《山间故事》，还有，不许笑，《小妇人》。全校好像只有我不是读着《小妇人》长大的。我可没告诉别人，不然大家准会认定我是个怪人。我悄悄拿上个月的一美元十二美分零用钱买了一本。下回有人提起腌酸橙，我总算听得懂了。
        - id: ch03-b10
          speaker: narrator
          text: 十点钟又响了。这封信写得断断续续。到了星期六，她改用一副郑重的报告口吻。
        - id: ch03-b11
          speaker: jerusha_abbott
          text: 先生，谨报告几何学领域里的新探索。上星期五，我军放弃平行六面体的旧阵地，向截棱柱进发。道路崎岖，还一路上坡。
        - id: ch03-b12
          speaker: narrator
          text: 星期日，她又继续写下去。
        - id: ch03-b13
          speaker: jerusha_abbott
          text: 圣诞假期下周就开始，箱子全搬出来了，走廊堵得几乎没法走。大家兴奋得直冒泡，谁也顾不上功课。我会过一个很棒的假期。还有个家在得克萨斯的一年级生留下，我们打算一起走很远的路。要是结冰，还要学滑冰。再说，整座图书馆都等着我去读，我有整整三个空闲的星期呢！
        - id: ch03-b14
          speaker: jerusha_abbott
          text: 再见，叔叔，希望您也跟我一样快乐。永远属于您的，朱迪。又及，别忘了回答问题。要是嫌写信麻烦，就请秘书发电报。他只要说，史密斯先生秃得很彻底，或者史密斯先生并不秃头，又或者史密斯先生长着白发。二十五美分电报费可以从我的零用钱里扣。一月见，祝您圣诞快乐！
    - id: ch04
      title: 圣诞假期：七样礼物
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 圣诞假期快结束了，确切日期却没人知道。朱迪坐在塔楼的窗边，又提起笔来。
        - id: ch04-b02
          speaker: jerusha_abbott
          text: 亲爱的长腿叔叔，您那里下雪了吗？从塔楼望出去，整个世界都披着白色，雪花像爆米花那么大。现在是傍晚，冷黄色的太阳刚落到一排更冷的紫色山峦背后。我坐在窗台座上，借最后一点天光给您写信。
        - id: ch04-b03
          speaker: jerusha_abbott
          text: 您送的五枚金币真叫我吃惊。我不习惯收圣诞礼物。您已经给了我那么多，我所有的东西本来都是您给的，所以总觉得自己不配再要额外的礼物。不过这丝毫不妨碍我喜欢它们。钱拿在手里，我一样样认真挑选，觉得每一枚金币都能变成一件顶要紧的东西。要不要听听我买了什么？
        - id: ch04-b04
          speaker: jerusha_abbott
          text: 第一只，是装在皮套里、可以戴在手腕上的银表，好让我准时到课堂。第二是马修·阿诺德诗集。第三是热水袋。第四是旅行毯，因为塔楼很冷。第五是五百张黄色稿纸，我很快就要当作家。第六是同义词词典，作家得扩大词汇量。第七样，我不太好意思说，可还是坦白吧，是一双丝袜。叔叔，这下可别说我瞒着您。
        - id: ch04-b05
          speaker: jerusha_abbott
          text: 买丝袜的动机很卑劣。朱莉娅每天晚上来我房里做几何题，总穿着丝袜，盘腿坐在长沙发上。等她一回来，我就穿着自己的丝袜，到她房里去，也盘腿坐上她的长沙发。您瞧，我就是这么可怜。不过我至少诚实。您看过孤儿院的档案，早知道我并不完美，对吧？
        - id: ch04-b06
          speaker: jerusha_abbott
          text: 总而言之，英语老师每隔一句就这样开头，我非常感谢这七样礼物。我假装它们装在一只大箱子里，是加利福尼亚的家人一起寄来的。手表来自爸爸，毯子来自妈妈。热水袋是外祖母送的，她总担心这里的气候会让我着凉。黄色稿纸来自弟弟哈里。姐姐伊莎贝尔送丝袜，苏珊姑妈送马修·阿诺德的诗集，哈里舅舅送同义词词典。小哈里就是用舅舅的名字取的。舅舅本想寄巧克力，可我坚持要同义词。
        - id: ch04-b07
          speaker: jerusha_abbott
          text: 您不会反对扮演由全家人合成的一个人吧？现在，我该讲讲假期，还是您只关心我“本身而言”的教育？请留意“本身而言”那点微妙的味道。这是我的词汇库刚添的新东西。
        - id: ch04-b08
          speaker: jerusha_abbott
          text: 那个得克萨斯女孩叫莉奥诺拉·芬顿，几乎跟杰鲁莎一样可笑。我喜欢她，可没有那么喜欢莎莉·麦克布莱德。除了您，我永远不会更喜欢别人。您得排第一，因为您一个人就是我的全家。
        - id: ch04-b09
          speaker: jerusha_abbott
          text: 天气好的时候，我、莉奥诺拉和两个二年级生会穿短裙和针织外套，戴上帽子，拿着亮闪闪的手杖去乡间远足。一路上有什么就拿手杖敲什么，整个邻近地区几乎都让我们探遍了。有一次，我们足足走了四英里进城，到大学女生常去的餐馆吃晚饭。烤龙虾三十五美分，甜点是荞麦饼配枫糖浆，十五美分。又顶饱，又便宜。
        - id: ch04-b10
          speaker: jerusha_abbott
          text: 那天真痛快，对我更是如此，因为一切都跟孤儿院大不相同。每回走出校园，我都觉得自己像个越狱犯。我差一点就说出为何觉得这么新鲜。秘密那只猫都探出袋口了，幸亏我揪住尾巴，把它拖回来。我天生爱把心里的事全告诉人。要是没有您听着，我一定会憋得爆炸。
        - id: ch04-b11
          speaker: jerusha_abbott
          text: 上星期五晚上，弗格森楼舍监请各宿舍里留下的人来做糖蜜糖。一共二十二个，从一年级到四年级，大家和和气气地聚在一起。厨房大得惊人，石墙上挂满铜锅铜壶，最小的炖锅也有洗衣锅那么大。这里住四百个女孩。厨师戴着白帽、系着白围裙，又变出二十二套来。我们全成了厨师。
        - id: ch04-b12
          speaker: jerusha_abbott
          text: 糖做得不算好，我以前见过更像样的，过程却好玩极了。等糖终于完成，我们每个人、整间厨房，连门把手都黏透了。大家临时组织起一支队伍，仍戴白帽、系白围裙，手里各举一把大叉子、大勺子或煎锅，排队穿过空荡荡的走廊，走进教职员休息室。六七位教授和讲师本来在那里安安静静地度过夜晚。我们唱校歌向他们致意，又献上糖。他们礼貌而迟疑地收下。离开时，我们把他们留在那里，嘴里含着大块糖蜜糖，浑身发黏，一句话也说不出来。
        - id: ch04-b13
          speaker: jerusha_abbott
          text: 所以您看，我的教育一直在进步。您真不觉得我该当艺术家，而不是作家吗？假期再过两天就结束，我很高兴又能见到那些女孩。我的塔楼只有一点点寂寞，可一幢原本住四百人的大房子里只剩九个人，大家在里面一走动，便显得零零落落，稍有一点声响，四周就越发空荡荡。
        - id: ch04-b14
          speaker: jerusha_abbott
          text: 已经十一页了，可怜的叔叔，您一定累了。我本来只想写一张感谢便条，谁知一动笔就停不住。再见，谢谢您还想着我。要不是天边有一小片不祥的乌云，我就完全幸福了。二月要考试。
        - id: ch04-b15
          speaker: jerusha_abbott
          text: 爱您的朱迪。又及，写“爱您的”也许不大合礼数，要是这样，请原谅。可我非得爱一个人，而能选的只有您和利佩特太太。亲爱的叔叔，您只好忍着了，因为我实在没法爱她。
    - id: ch05
      title: 考试前夕：家谱和不规则动词
      blocks:
        - id: ch05-b01
          speaker: jerusha_abbott
          text: 亲爱的长腿叔叔，您真该看看大家怎样用功。我们早忘了曾经放过假。四天里，我往脑子里介绍了五十七个不规则动词，只盼它们肯留到考试以后。
        - id: ch05-b02
          speaker: jerusha_abbott
          text: 有些女孩一门课读完，就把课本卖掉。我可要把自己的全留下。等毕业以后，我受过的全部教育会一本挨一本，整整齐齐地站在书架上。哪天需要其中哪个细节，我都不用迟疑，伸手一翻就能找到。这比费尽力气把所有东西都留在脑袋里容易多了，也准确多了。
        - id: ch05-b03
          speaker: jerusha_abbott
          text: 朱莉娅今晚特意来串门，足足坐了一个小时。她一谈起家世，我怎么也岔不开话题。她问我母亲娘家姓什么。对一个从弃婴院出来的人问这个，您听过更无礼的事吗？我没勇气承认自己根本不知道，只好愁眉苦脸地抓住脑子里第一个姓，蒙哥马利。谁知这还没完，她马上追问，我究竟属于马萨诸塞州那一家，还是弗吉尼亚州那一家。
        - id: ch05-b04
          speaker: jerusha_abbott
          text: 她母亲娘家姓拉瑟福德，那一家坐诺亚方舟来到这里，还跟亨利八世攀过亲。父亲那边比亚当还古老。她家族树最高的枝头上，坐着一种高贵的猴子，毛又细又滑，尾巴还格外长。
        - id: ch05-b05
          speaker: jerusha_abbott
          text: 今晚本想写一封快活又有趣的信，可我太困，也太害怕。一年级新生的命真不好。即将受审的朱迪·艾博特。
    - id: ch06
      title: 星期日：一个糟糕透顶的消息
      blocks:
        - id: ch06-b01
          speaker: jerusha_abbott
          text: 最亲爱的长腿叔叔，我有个糟糕、糟糕、糟糕透顶的消息。不过先不说，我得先哄您高兴。
        - id: ch06-b02
          speaker: jerusha_abbott
          text: 杰鲁莎·艾博特开始当作家了。二月号《月刊》的第一页登了我的诗，题目是《从我的塔楼望去》。一年级生能登在第一页，是很大的荣誉。昨晚做完礼拜，英语老师叫住我，说诗写得很迷人，只是第六行音步太多。要是您想看，我会寄给您。
        - id: ch06-b03
          speaker: jerusha_abbott
          text: 再说一件好事。我正在学滑冰，如今已经能独自滑得挺像样。我也会抓绳子从体育馆屋顶滑下来，还能跳过三英尺六英寸的横杆。希望很快升到四英尺。
        - id: ch06-b04
          speaker: jerusha_abbott
          text: 今天早晨，阿拉巴马州的主教讲了一篇极能鼓舞人的道。他引用“你们不要论断人，免得你们被论断”，告诉大家该宽容别人的过失，别揪住错误不放，也不能用严厉的评判叫人灰心。那番话正好适合现在听。真希望您也在场，也把每一句都听进去了。
        - id: ch06-b05
          speaker: jerusha_abbott
          text: 今天是个冬日的下午，阳光灿烂得刺眼。冷杉树上的冰柱一根根往下滴水，放眼望去，整个世界都压在沉甸甸的白雪下面，连树枝也弯了腰。只有我不是被雪压弯的，我肩上压的是悲伤。现在该说坏消息了。勇敢一点，朱迪，你非说不可。
        - id: ch06-b06
          speaker: jerusha_abbott
          text: 您现在真的心情很好吗？我的数学和拉丁文写作不及格。我正在补课，下月再考。要是让您失望，我很抱歉。除此之外，我一点也不在乎，因为我学会了许多课程目录里没有的东西。
        - id: ch06-b07
          speaker: jerusha_abbott
          text: 我读了十七本小说和成堆的诗，其中有真正少不了的《名利场》、《理查德·费弗雷尔的磨难》和《爱丽丝漫游奇境》。还读完了爱默生的《随笔集》、洛克哈特的《司各特传》、吉本《罗马帝国衰亡史》第一卷，又读了本韦努托·切利尼自传的一半。他多有趣啊，常常像闲逛一样走出门，在早餐前漫不经心地杀掉一个人。这些可全不在学校的课程目录里。
        - id: ch06-b08
          speaker: jerusha_abbott
          text: 所以叔叔，比起只埋头学拉丁文，我现在聪明多了。只要我答应以后绝不再考砸，您能原谅这一次吗？披麻戴孝的朱迪。
    - id: ch07
      title: 风雨之夜：请您做我的外祖母
      blocks:
        - id: ch07-b01
          speaker: jerusha_abbott
          text: 亲爱的长腿叔叔，今晚有点寂寞，所以月中又多写一封。外面风雨很大，校园里的灯全灭了。偏偏我喝过黑咖啡，怎么也睡不着。
        - id: ch07-b02
          speaker: jerusha_abbott
          text: 今晚我在房里办了一场夜宵聚会，请来莎莉、朱莉娅和莉奥诺拉·芬顿。桌上摆着沙丁鱼、烤松饼、沙拉和软糖，我们还喝了咖啡。朱莉娅临走时说，她今晚过得很开心。莎莉没有只说一句好听的话，她留了下来，跟我一起把盘子全洗干净。
        - id: ch07-b03
          speaker: jerusha_abbott
          text: 现在拿点时间学拉丁文，本来很有用。可毫无疑问，我是个懒洋洋的拉丁文学生。我们已经读完李维和《论老年》，眼下正在对付《论友谊》。它的拉丁文题目念起来，简直像“该死的友谊”。
        - id: ch07-b04
          speaker: jerusha_abbott
          text: 您介不介意暂时装成我的外祖母？莎莉有一个，朱莉娅和莉奥诺拉各有两个。今晚她们一直把各自的外祖母拿来比较。我听着听着，觉得自己再也想不出更想拥有的东西了。外祖母这种亲属关系多么稳当，又多么体面呀。
        - id: ch07-b05
          speaker: jerusha_abbott
          text: 要是您真的不反对，我已经替您看好礼物了。昨天进城，我见到一顶特别可爱的克吕尼花边小帽，上面还系着淡紫色缎带。等您过八十三岁生日，我就把这顶帽子送给您。
        - id: ch07-b06
          speaker: narrator
          text: 礼拜堂塔钟一连敲了十二下。
        - id: ch07-b07
          speaker: jerusha_abbott
          text: 原来已经十二点了。看来我到底还是困了。晚安，外祖母。我非常爱您。朱迪。
