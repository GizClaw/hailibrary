audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm, observant storytelling with a dry touch of humor
        timbre: clear and gently textured
        pace: measured and flowing
        pitch: medium
    jerusha:
      display_name: Jerusha Abbott
      tts:
        delivery: bright, quick, and candid, with feeling close to the surface
        timbre: youthful and clear
        pace: lively
        pitch: medium-high
  chapters:
    - id: ch01
      title: 25th October
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: October twenty-fifth.
        - id: ch01-b02
          speaker: jerusha
          text: >-
            Dear Daddy-Long-Legs, I made the basketball team! You should see the bruise on my left shoulder. It's blue and mahogany, with little orange streaks. Julia Pendleton tried out too, but she didn't make it. Hooray! You can see what a mean nature I have.
        - id: ch01-b03
          speaker: jerusha
          text: >-
            College keeps getting better. I like the girls, the teachers, the classes, the campus, and especially the food. We have ice cream twice a week, and we never, ever have cornmeal mush.
        - id: ch01-b04
          speaker: jerusha
          text: >-
            You only asked me to write once a month, didn't you? Instead, I've been showering you with letters every few days. There are so many exciting new things happening that I have to tell somebody, and you're the only person I know. Please forgive me for being so full of talk. I'll settle down soon. If I bore you, just throw my letters in the wastebasket. I promise I won't write again until the middle of November. Yours most talkatively, Judy Abbott.
    - id: ch02
      title: 15th November
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: November fifteenth.
        - id: ch02-b02
          speaker: jerusha
          text: >-
            Dear Daddy-Long-Legs, listen to what I learned today. The convex surface area of the frustum of a regular pyramid equals half the sum of the perimeters of its bases, multiplied by the altitude of either trapezoid. It doesn't sound as if it could possibly be true, but it is. I can prove it!
        - id: ch02-b03
          speaker: jerusha
          text: >-
            I've never told you about my clothes, have I? I have six dresses, all new and beautiful and bought especially for me. Not one was handed down from a bigger girl. Maybe you don't understand what an enormous moment that is in an orphan's life. You gave them to me, and I am very, very, very grateful. Education is wonderful, but it can't compare with the dizzy feeling of owning six new dresses.
        - id: ch02-b04
          speaker: jerusha
          text: >-
            Miss Pritchard from the visiting committee chose them, thank goodness, instead of Mrs. Lippett. There's a pink evening dress made of soft cotton over silk, and I look perfectly beautiful in it. There's a blue dress for church, a red dinner dress with Oriental trimming that makes me look like a Gypsy, another dress in rose-colored challis, a gray street suit, and an everyday dress for class. Julia Rutledge Pendleton might not call that a large wardrobe. But for Jerusha Abbott? Oh, my!
        - id: ch02-b05
          speaker: jerusha
          text: >-
            I suppose you're thinking I'm a silly, shallow little creature, and educating me is a waste of money. But Daddy, if you'd worn checked gingham all your life, you would understand. And when I entered high school, I reached a period that was even worse than checked gingham. I had to wear clothes from the poor box.
        - id: ch02-b06
          speaker: jerusha
          text: >-
            I dreaded going to school in those miserable dresses. I was always sure the teacher would seat me beside the girl who had owned mine first. Then she'd whisper and giggle and point it out to everyone else. Wearing your enemies' castoffs leaves a bitter mark. Even a lifetime of silk stockings couldn't rub it away.
        - id: ch02-b07
          speaker: jerusha
          text: >-
            Latest war bulletin! News from the scene of action. During the fourth watch on Thursday, November thirteenth, Hannibal defeated the Roman advance guard. He led the Carthaginians across the mountains and onto the plains of Casilinum. Light-armed Numidians fought the infantry of Quintus Fabius Maximus. There were two battles and some skirmishing. The Romans were driven back with heavy losses. I have the honor to remain your special correspondent at the front, J. Abbott.
        - id: ch02-b08
          speaker: jerusha
          text: >-
            Postscript. I know I shouldn't expect letters from you, and I've been warned not to bother you with questions. But please answer just once. Are you terribly old, or only a little old? Are you completely bald, or only a little bald? It's hard to imagine you when you're as abstract as a geometry theorem.
        - id: ch02-b09
          speaker: jerusha
          text: >-
            Here is the problem. Given a tall, rich man who hates girls but is very generous to one rather impertinent girl, what does he look like? Please reply.
    - id: ch03
      title: 19th December
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: December nineteenth.
        - id: ch03-b02
          speaker: jerusha
          text: >-
            Dear Daddy-Long-Legs, you never answered my question, and it was very important. Are you bald? I have your appearance planned out perfectly until I reach the top of your head. Then I'm stuck. Do you have white hair, black hair, scattered gray hair, or none at all? I've drawn your portrait, but should I put hair on it?
        - id: ch03-b03
          speaker: jerusha
          text: >-
            Would you like to know the color of your eyes? They're gray. Your eyebrows jut out like a porch roof. Novels call that beetling. Your mouth is a straight line whose corners turn down. Oh, I know exactly what you're like. You're a sharp old thing with a temper.
        - id: ch03-b04
          speaker: narrator
          text: The chapel bell rings. Later, at nine forty-five that evening, Judy continues.
        - id: ch03-b05
          speaker: jerusha
          text: >-
            I have a firm new rule. I will never study at night, no matter how many written reviews I have the next morning. Instead, I read ordinary books. I have to, because there are eighteen empty years behind me. You wouldn't believe what a chasm of ignorance I have in my mind. I'm only beginning to understand how deep it is.
        - id: ch03-b06
          speaker: jerusha
          text: >-
            Girls who grew up with families, homes, friends, and libraries learned all kinds of things without even trying. I had never heard of most of them. I'd never read Mother Goose, David Copperfield, Ivanhoe, Cinderella, Blue Beard, Robinson Crusoe, Jane Eyre, Alice in Wonderland, or a single word by Rudyard Kipling.
        - id: ch03-b07
          speaker: jerusha
          text: >-
            I didn't know Henry the Eighth married more than once, or that Shelley was a poet. I didn't know people used to be monkeys, or that the Garden of Eden was a beautiful myth. I had no idea that R. L. S. meant Robert Louis Stevenson, or that George Eliot was a woman. I had never seen the Mona Lisa. And this is true, though you won't believe it. I had never even heard of Sherlock Holmes.
        - id: ch03-b08
          speaker: jerusha
          text: >-
            Now I know all those things and many more, but you can see how much catching up I have to do. And oh, it's fun! I look forward to evening all day. Then I put an "engaged" sign on my door, pull on my nice red bathrobe and furry slippers, pile cushions behind me on the couch, light the brass student lamp at my elbow, and read and read.
        - id: ch03-b09
          speaker: jerusha
          text: >-
            One book isn't enough, so I keep four going at once. Right now I have Tennyson's poems, Vanity Fair, Kipling's Plain Tales, and, don't laugh, Little Women. I'm the only girl in college who didn't grow up with Little Women. I haven't told anyone. That really would mark me as strange. I quietly spent a dollar and twelve cents from last month's allowance on a copy. The next time someone mentions pickled limes, I'll know what she means!
        - id: ch03-b10
          speaker: narrator
          text: The ten o'clock bell rings, interrupting the letter again. Judy returns to it on Saturday.
        - id: ch03-b11
          speaker: jerusha
          text: >-
            Sir, I have the honor to report new explorations in geometry. Last Friday, we abandoned our old position among the parallelopipeds and advanced into truncated prisms. The road is rough, and it goes steeply uphill.
        - id: ch03-b12
          speaker: narrator
          text: On Sunday, Judy adds one more report.
        - id: ch03-b13
          speaker: jerusha
          text: >-
            Christmas vacation begins next week, and the trunks have come out. The corridors are so crowded you can hardly squeeze through. Everyone is bubbling with excitement, and studying has nearly disappeared. I'm going to have a beautiful vacation. Another Freshman from Texas is staying here too. We plan to take long walks and learn to skate if there's ice. And the whole library is still waiting, with three empty weeks to read it!
        - id: ch03-b14
          speaker: jerusha
          text: >-
            Goodbye, Daddy. I hope you're as happy as I am. Yours always, Judy. Postscript. Please don't forget my question. If writing is too much trouble, have your secretary send a telegram. He can say, "Mr. Smith is quite bald," or "Mr. Smith is not bald," or "Mr. Smith has white hair." You may take the twenty-five cents out of my allowance. Goodbye until January, and merry Christmas!
    - id: ch04
      title: Towards the End of Christmas Vacation
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: Near the end of Christmas vacation. The exact date is unknown.
        - id: ch04-b02
          speaker: jerusha
          text: >-
            Dear Daddy-Long-Legs, is it snowing where you are? From my tower, the whole world is draped in white, and the flakes are as big as popcorn. It's late afternoon. The sun is going down behind the hills, cold yellow against colder violet, and I'm sitting in my window seat, using the last of the light to write.
        - id: ch04-b03
          speaker: jerusha
          text: >-
            Your five gold pieces were such a surprise! I'm not used to Christmas presents. You've already given me so much, everything I own, really, that I don't feel as if I deserve anything extra. But I like them all the same. Would you like to hear what I bought?
        - id: ch04-b04
          speaker: jerusha
          text: >-
            First, a silver watch in a leather wrist case, so I'll reach recitations on time. Second, Matthew Arnold's poems. Third, a hot-water bottle. Fourth, a steamer rug, because my tower is cold. Fifth, five hundred sheets of yellow manuscript paper. I'm going to start being an author very soon. Sixth, a dictionary of synonyms to enlarge my authorly vocabulary. And seventh, though I don't much like admitting it, a pair of silk stockings. There, Daddy. You can never say I don't tell you everything!
        - id: ch04-b05
          speaker: jerusha
          text: >-
            The silk stockings came from a very low motive, if you must know. Julia Pendleton comes to my room to study geometry. Every night, she sits cross-legged on the couch in silk stockings. Just wait until vacation ends. I'm going to sit on her couch in mine. You see what a miserable creature I am. At least I'm honest. And my asylum record already told you I wasn't perfect, didn't it?
        - id: ch04-b06
          speaker: jerusha
          text: >-
            To sum it all up, as my English instructor does every other sentence, thank you very much for my seven presents. I'm pretending they arrived in a box from my family in California. The watch came from Father. Mother sent the rug. Grandmother sent the hot-water bottle because she's always afraid I'll catch cold in this climate. My little brother Harry sent the yellow paper.
        - id: ch04-b07
          speaker: jerusha
          text: >-
            My sister Isabel gave me the silk stockings, Aunt Susan chose the Matthew Arnold poems, and Uncle Harry, whom little Harry was named after, sent the dictionary. He wanted to give me chocolates, but I insisted on synonyms. You don't mind playing the part of one whole family, do you?
        - id: ch04-b08
          speaker: jerusha
          text: >-
            Now, shall I tell you about vacation, or do you care only about my education as such? I hope you noticed the delicate meaning of "as such." It's the newest piece in my vocabulary.
        - id: ch04-b09
          speaker: jerusha
          text: >-
            The girl from Texas is Leonora Fenton. Her name is almost as funny as Jerusha, isn't it? I like her, though not as much as Sallie McBride. I'll never like anyone as much as Sallie, except you. I have to like you best because you're my entire family rolled into one.
        - id: ch04-b10
          speaker: jerusha
          text: >-
            Leonora, two Sophomores, and I have walked across the countryside on every pleasant day. We wore short skirts, knitted jackets, and caps, and carried shiny sticks for whacking things. Once we walked four miles into town and ate at a restaurant the college girls like. We had broiled lobster for thirty-five cents, then buckwheat cakes and maple syrup for fifteen cents. Cheap and nourishing!
        - id: ch04-b11
          speaker: jerusha
          text: >-
            It was such fun, especially for me, because it was so different from the asylum. Every time I leave campus, I feel like an escaped prisoner. Without thinking, I started telling the others what an adventure it was for me. The secret was almost out before I caught it by the tail and pulled it back. Keeping things to myself is terribly hard. I'm naturally trusting, and if I couldn't tell you everything, I think I'd burst.
        - id: ch04-b12
          speaker: jerusha
          text: >-
            Last Friday evening, the Fergussen house matron held a molasses-candy pull for everyone left behind in the other halls. There were twenty-two of us, from Freshmen all the way through Seniors, living together in perfect friendship. The kitchen is enormous. Copper pots and kettles hang in rows on the stone walls, and even the smallest casserole is about as large as a wash boiler. Four hundred girls live in Fergussen.
        - id: ch04-b13
          speaker: jerusha
          text: >-
            The chef came out in his white cap and apron, carrying twenty-two more caps and aprons. I can't imagine where he found so many. We put them on and turned ourselves into cooks. We had great fun, though I've tasted better candy. By the time we finished, we were sticky. So were the kitchen and all the doorknobs.
        - id: ch04-b14
          speaker: jerusha
          text: >-
            Then we formed a parade. Still wearing our caps and aprons, each of us carried an enormous fork, spoon, or frying pan through the empty corridors. We marched into the officers' parlor, where half a dozen professors and instructors had been enjoying a peaceful evening. We sang college songs and offered them candy. They accepted very politely and very doubtfully. We left them sucking on chunks of molasses candy, too sticky to speak.
        - id: ch04-b15
          speaker: jerusha
          text: >-
            So you see, Daddy, my education is moving right along! Don't you think I ought to become an artist instead of an author?
        - id: ch04-b16
          speaker: jerusha
          text: >-
            Vacation ends in two days, and I'll be glad to see the girls again. My tower is just a little lonely. When only nine people live in a building made for four hundred, they do rattle around.
        - id: ch04-b17
          speaker: jerusha
          text: >-
            Eleven pages! Poor Daddy, you must be exhausted. I meant to write one short thank-you note, but once I begin, my pen never wants to stop. Goodbye, and thank you for thinking of me. I would be perfectly happy if there weren't one small dark cloud ahead. Examinations come in February. Yours with love, Judy.
        - id: ch04-b18
          speaker: jerusha
          text: >-
            Postscript. Maybe sending love isn't proper. If it isn't, please forgive me. But I have to love somebody, and my only choices are you and Mrs. Lippett. So you'll have to endure it, Daddy dear, because I can't love her.
    - id: ch05
      title: On the Eve
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: On the eve of examinations.
        - id: ch05-b02
          speaker: jerusha
          text: >-
            Dear Daddy-Long-Legs, you should see how everyone at college is studying. We've already forgotten we ever had a vacation. In the last four days, I've introduced fifty-seven irregular verbs into my brain. Now I can only hope they stay there until the examinations are over.
        - id: ch05-b03
          speaker: jerusha
          text: >-
            Some girls sell their textbooks after they finish a course, but I'm keeping mine. When I graduate, my whole education will stand in a row on my bookcase. Whenever I need some detail, I can look it up immediately. That will be much easier, and far more accurate, than trying to keep everything in my head.
        - id: ch05-b04
          speaker: jerusha
          text: >-
            Julia Pendleton dropped by for a social visit this evening and stayed for one solid hour. She started talking about families, and I couldn't steer her away. She asked for my mother's maiden name. Can you imagine asking that of someone from a foundling asylum? I couldn't bring myself to admit I didn't know, so I miserably blurted out the first name that came to mind. Montgomery.
        - id: ch05-b05
          speaker: jerusha
          text: >-
            Then Julia wanted to know whether I belonged to the Massachusetts Montgomerys or the Virginia Montgomerys. Her mother was a Rutherford. Her family arrived on the ark and married into Henry the Eighth's family. On her father's side, they go back even further than Adam. At the highest branches of Julia's family tree, there are superior monkeys with fine silky hair and extra-long tails.
        - id: ch05-b06
          speaker: jerusha
          text: >-
            I meant to send you a cheerful, entertaining letter tonight, but I'm too sleepy and too frightened. A Freshman's life is not a happy one. Yours, about to be examined, Judy Abbott.
    - id: ch06
      title: Sunday
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: Sunday.
        - id: ch06-b02
          speaker: jerusha
          text: >-
            Dearest Daddy-Long-Legs, I have awful, awful, awful news. But I won't begin with that. First, I'll try to put you in a good mood.
        - id: ch06-b03
          speaker: jerusha
          text: >-
            Jerusha Abbott has begun to be an author. My poem, "From My Tower," is in the February Monthly. It's on the very first page, which is a tremendous honor for a Freshman. Last night, my English instructor stopped me as we left chapel. She called it a charming piece of work, except for the sixth line, which had too many feet. I'll send you a copy in case you'd like to read it.
        - id: ch06-b04
          speaker: jerusha
          text: >-
            Let me think of something else pleasant. Oh, yes! I'm learning to skate. I can glide around quite respectably all by myself. I've also learned to slide down a rope from the gymnasium roof, and I can vault over a bar three feet six inches high. Soon I hope to make it four feet.
        - id: ch06-b05
          speaker: jerusha
          text: >-
            We heard a very inspiring sermon this morning from the Bishop of Alabama. His text was, "Judge not, that ye be not judged." He spoke about overlooking other people's mistakes and not crushing them with harsh judgments. I wish you could have heard him.
        - id: ch06-b06
          speaker: jerusha
          text: >-
            This winter afternoon is dazzling and bright. Icicles are dripping from the fir trees, and the whole world bends beneath the weight of the snow. Everything bends except me. I'm bending under sorrow instead.
        - id: ch06-b07
          speaker: jerusha
          text: >-
            Now I must tell you. Courage, Judy! Are you absolutely sure you're in a good mood? I failed mathematics and Latin prose. I'm getting tutoring in both, and next month I'll take another examination.
          emotion: sad
        - id: ch06-b08
          speaker: jerusha
          text: >-
            I'm sorry if I've disappointed you. Otherwise, I don't care in the least, because I've learned so many things that aren't in the college catalogue. I've read seventeen novels and mountains of poetry. Important novels too, like Vanity Fair, Richard Feverel, and Alice in Wonderland.
        - id: ch06-b09
          speaker: jerusha
          text: >-
            I've also read Emerson's Essays, Lockhart's Life of Scott, the first volume of Gibbon's Roman Empire, and half of Benvenuto Cellini's Life. Wasn't he entertaining? He used to stroll out and casually kill a man before breakfast.
        - id: ch06-b10
          speaker: jerusha
          text: >-
            So you see, Daddy, I'm much more intelligent than I would be if I'd done nothing but Latin. Will you forgive me this once if I promise never to fail again? Yours in sackcloth, Judy.
    - id: ch07
      title: A Stormy Night
      blocks:
        - id: ch07-b01
          speaker: jerusha
          text: >-
            Dear Daddy-Long-Legs, this is an extra letter in the middle of the month because I'm rather lonely tonight. A terrible storm is blowing. Every light on campus is out, and I drank black coffee, so I can't sleep.
        - id: ch07-b02
          speaker: jerusha
          text: >-
            I gave a supper party tonight for Sallie, Julia, and Leonora Fenton. We had sardines, toasted muffins, salad, fudge, and coffee. Julia said she enjoyed herself, but Sallie stayed afterward to help me wash the dishes.
        - id: ch07-b03
          speaker: jerusha
          text: >-
            I could use this time very sensibly on Latin. But there's no denying it. I'm a lazy Latin student. We've finished Livy and De Senectute. Now we're working on De Amicitia, which we pronounce "Damn Icitia."
        - id: ch07-b04
          speaker: jerusha
          text: >-
            Would you mind pretending to be my grandmother for a little while? Sallie has one grandmother, and Julia and Leonora each have two. They were all comparing theirs tonight. I can't imagine any relation I'd rather have. A grandmother sounds so respectable.
        - id: ch07-b05
          speaker: jerusha
          text: >-
            So, if you truly don't object, I saw the sweetest little cap in town yesterday. It's made of Cluny lace with lavender ribbon. I'm going to give it to you for your eighty-third birthday.
        - id: ch07-b06
          speaker: narrator
          text: The clock in the chapel tower strikes twelve.
        - id: ch07-b07
          speaker: jerusha
          text: >-
            I believe I'm sleepy after all. Good night, Granny. I love you dearly. Judy.
