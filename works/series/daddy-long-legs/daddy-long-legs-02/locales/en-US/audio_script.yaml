  chapters:
    - id: ch01
      title: 24th September
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 215 Fergussen Hall. September twenty-fourth.
        - id: ch01-b02
          speaker: jerusha
          text: >-
            Dear Kind Trustee Who Sends Orphans to College, here I am! Yesterday I spent four whole hours on a train. Riding one for the first time feels very strange, doesn't it?
        - id: ch01-b03
          speaker: jerusha
          text: >-
            College is enormous and terribly confusing. Every time I leave my room, I get lost. Once my head stops spinning, I'll describe it properly and tell you about my lessons. Classes don't start until Monday morning, and tonight is only Saturday. But I wanted my first letter to help us get acquainted.
        - id: ch01-b04
          speaker: jerusha
          text: >-
            Writing to someone I don't know feels odd. Writing any letter feels odd to me. I've written only three or four in my whole life, so please forgive me if mine aren't exactly perfect examples.
        - id: ch01-b05
          speaker: jerusha
          text: >-
            Before we left yesterday morning, Mrs. Lippett gave me a very serious talk. She explained how I must behave for the rest of my life, especially toward the kind gentleman doing so much for me. Above all, I must be Very Respectful.
        - id: ch01-b06
          speaker: jerusha
          text: >-
            But how can anyone feel very respectful toward a man who asks to be called John Smith? Couldn't you choose a name with some character? I might as well address my letters to Dear Hitching Post or Dear Clothes Prop.
        - id: ch01-b07
          speaker: jerusha
          text: >-
            I've thought about you a great deal this summer. After all these years, having someone care what happens to me feels almost like finding a family. Now I belong to somebody, and that's wonderfully comforting. Still, my imagination has almost nothing to build you from. I know just three facts. You're tall. You're rich. And you hate girls.
        - id: ch01-b08
          speaker: jerusha
          text: >-
            I could call you Dear Mr. Girl Hater, but that insults me. Dear Mr. Rich Man insults you, as if money were the only thing that mattered about you. Richness is only on the outside anyway. You may not always have it. Plenty of clever men lose everything on Wall Street. But you'll always be tall! So I've chosen Dear Daddy-Long-Legs. I hope you don't mind. It's our private pet name, and we won't tell Mrs. Lippett.
        - id: ch01-b09
          speaker: jerusha
          text: >-
            The ten o'clock bell will ring in two minutes. Bells divide our whole day. We eat by bells, study by bells, and sleep by bells. It keeps things exciting. I feel like a fire horse waiting to race every time one rings. There it goes! Lights out. Good night.
        - id: ch01-b10
          speaker: jerusha
          text: >-
            Please notice how exactly I follow the rules, thanks to my training at the John Grier Home. Yours most respectfully, Jerusha Abbott. To Mr. Daddy-Long-Legs Smith.
    - id: ch02
      title: 1st October
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: October first.
        - id: ch02-b02
          speaker: jerusha
          text: >-
            Dear Daddy-Long-Legs, I love college, and I love you for sending me here. I'm so happy and excited every minute that I can hardly sleep. You couldn't imagine how different this is from the John Grier Home. I never dreamed such a place existed. I feel sorry for everyone who isn't a girl and can't come here. I'm certain the college you attended as a boy wasn't nearly this nice.
        - id: ch02-b03
          speaker: jerusha
          text: >-
            My room is high in a tower. It used to be the contagious ward, before they built the new infirmary. Three other girls live on this floor. There's a Senior in spectacles who is always asking us to please make less noise. Then there are two Freshmen, Sallie McBride and Julia Rutledge Pendleton. Sallie has red hair, a turned-up nose, and a friendly manner. Julia belongs to one of New York's oldest families, and so far she hasn't noticed me.
        - id: ch02-b04
          speaker: jerusha
          text: >-
            Sallie and Julia share a room. The Senior and I each have one to ourselves. Single rooms are scarce, so Freshmen usually don't get them, but nobody even asked me. Perhaps the registrar thought a properly raised girl shouldn't have to share with a foundling. You see? Being one has its advantages!
        - id: ch02-b05
          speaker: jerusha
          text: >-
            My room sits at the northwest corner, with two windows and a view. After eighteen years in a ward with twenty roommates, being alone is wonderfully peaceful. For the first time, I can get to know Jerusha Abbott. I think I'm going to like her. Do you think you will?
        - id: ch02-b06
          speaker: narrator
          text: Tuesday.
        - id: ch02-b07
          speaker: jerusha
          text: >-
            They're putting together the Freshman basketball team, and I might actually make it. I'm small, of course, but I'm quick, wiry, and tough. While the other girls jump around in the air, I can slip under their feet and snatch the ball. Practice is wonderful. We play outside in the afternoon, with red and yellow trees around us and the smell of burning leaves in the air. Everyone laughs and shouts. These are the happiest girls I've ever seen, and I'm the happiest one of all!
          emotion: happy
        - id: ch02-b08
          speaker: jerusha
          text: >-
            I meant to write a long letter about everything I'm learning, since Mrs. Lippett said you wanted to hear. But the seventh-hour bell just rang, and I have ten minutes to reach the athletic field in my gym clothes. Aren't you hoping I make the team? Yours always, Jerusha Abbott.
        - id: ch02-b09
          speaker: narrator
          text: Postscript. Nine o'clock.
        - id: ch02-b10
          speaker: jerusha
          text: >-
            Sallie McBride just poked her head through my doorway. She said,
        - id: ch02-b11
          speaker: sallie
          text: >-
            I'm so terribly homesick I can't bear it. Are you homesick too?
          emotion: sad
        - id: ch02-b12
          speaker: jerusha
          text: >-
            I gave her a little smile and said no, I thought I'd manage. At least homesickness is one illness I've escaped! Nobody ever gets homesick for an asylum, do they?
    - id: ch03
      title: 10th October
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: October tenth.
        - id: ch03-b02
          speaker: jerusha
          text: >-
            Dear Daddy-Long-Legs, have you ever heard of Michelangelo? He was a famous artist in Italy during the Middle Ages. Everyone in English Literature knew who he was, and the entire class laughed when I thought he was an archangel. But his name sounds like one, doesn't it?
        - id: ch03-b03
          speaker: jerusha
          text: >-
            That's the trouble with college. People expect you to know dozens of things nobody ever taught you. Sometimes it's horribly embarrassing. Now, when the girls mention something I've never heard of, I stay quiet and find it later in the encyclopedia.
        - id: ch03-b04
          speaker: jerusha
          text: >-
            On my very first day, I made a dreadful mistake. Someone mentioned Maurice Maeterlinck, and I asked if she was a Freshman. By now, the whole college knows that joke. Still, I'm doing as well in class as the other girls, and better than some!
        - id: ch03-b05
          speaker: jerusha
          text: >-
            Would you like to hear about my room? It's a symphony in brown and yellow. The walls were already buff. I bought yellow denim for curtains and cushions, a secondhand mahogany desk for three dollars, a rattan chair, and a brown rug with an ink stain right in the center. I keep the chair over that.
        - id: ch03-b06
          speaker: jerusha
          text: >-
            The windows are too high to see through from a regular chair. So I took the mirror off the back of the bureau, padded the bureau top, and pushed it beside the window. Now it's exactly the right height for a window seat. I pull the drawers out like steps and climb up. It's very comfortable!
        - id: ch03-b07
          speaker: jerusha
          text: >-
            Sallie McBride helped me pick everything at the Senior auction. She's lived in a house all her life, so she understands furnishing rooms. You can't know how thrilling it is to shop with a real five-dollar bill, pay for something, and receive change, when you've never owned more than a few cents. Believe me, Daddy dear, I truly appreciate my allowance.
        - id: ch03-b08
          speaker: jerusha
          text: >-
            Sallie is the most entertaining person alive, and Julia Rutledge Pendleton is the least. The registrar certainly creates strange mixtures when she assigns roommates. Sallie can laugh at anything, even failing a class. Julia finds everything boring. She never tries to be pleasant. Apparently, being a Pendleton gets her straight into heaven with no examination required. Julia and I were born to be enemies.
        - id: ch03-b09
          speaker: jerusha
          text: >-
            And now, I suppose you've been waiting impatiently to hear what I'm studying. In Latin, we're on the Second Punic War. Hannibal and his army camped at Lake Trasimene last night, set a trap for the Romans, and fought them at the fourth watch this morning. The Romans are retreating.
        - id: ch03-b10
          speaker: jerusha
          text: >-
            In French, I've read twenty-four pages of The Three Musketeers, and we're doing third-conjugation irregular verbs. In geometry, we've finished cylinders and started cones. In English, we're studying exposition, and my writing grows clearer and shorter every day. In physiology, we've reached the digestive system. Next come bile and the pancreas.
        - id: ch03-b11
          speaker: jerusha
          text: >-
            Yours, on the way to becoming educated, Jerusha Abbott. Postscript. Daddy, I hope you never drink alcohol. It does terrible things to your liver.
    - id: ch04
      title: Wednesday
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: Wednesday.
        - id: ch04-b02
          speaker: jerusha
          text: >-
            Dear Daddy-Long-Legs, I've changed my name. The catalogue still calls me Jerusha, but everywhere else I'm Judy. Isn't it sad that I had to give myself the only pet name I've ever had? I didn't invent it completely. Freddy Perkins called me that before he could speak clearly.
        - id: ch04-b03
          speaker: jerusha
          text: >-
            I wish Mrs. Lippett used more imagination when she named babies. She takes last names from the telephone book. Abbott is right there on the first page. Then she finds first names anywhere at all. She found Jerusha on a tombstone. I've always hated it, but I rather like Judy. It's such a silly name.
        - id: ch04-b04
          speaker: jerusha
          text: >-
            Judy sounds like a girl who is nothing like me. She'd be a sweet little blue-eyed child, spoiled and fussed over by her whole family, who could romp through life without a worry. Wouldn't that be lovely? Whatever else anyone says about me, nobody can claim my family spoiled me! Still, pretending they did is great fun. Please address every letter to Judy from now on.
        - id: ch04-b05
          speaker: jerusha
          text: >-
            And would you like to know something? I own three pairs of kid gloves. I've received kid mittens from the Christmas tree, but never proper gloves with five fingers. Every little while, I take them out and try them on. I can barely stop myself from wearing them to class.
        - id: ch04-b06
          speaker: jerusha
          text: >-
            There's the dinner bell. Goodbye.
    - id: ch05
      title: Friday to Sunday
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: Friday.
        - id: ch05-b02
          speaker: jerusha
          text: >-
            What do you think, Daddy? My English instructor said my latest paper showed unusual originality. She really did. Those were her exact words. After eighteen years of my particular kind of training, it hardly seems possible, does it? As you surely know and heartily approve, the John Grier Home tries to turn ninety-seven orphans into ninety-seven twins.
        - id: ch05-b03
          speaker: jerusha
          text: >-
            My remarkable artistic talent began early. I developed it by drawing chalk portraits of Mrs. Lippett on the woodshed door.
        - id: ch05-b04
          speaker: jerusha
          text: >-
            I hope criticizing the home where I grew up doesn't hurt your feelings. You do have the advantage, you know. If I become too rude, you can stop sending the checks. That wasn't a very polite thing to say. But you can't expect good manners from me. A foundling asylum is not a finishing school for young ladies.
        - id: ch05-b05
          speaker: jerusha
          text: >-
            Daddy, the hard part of college won't be the work. It'll be the play. Half the time, I have no idea what the girls mean. Their jokes come from a past they all seem to share, except me. I feel like a foreigner who can't understand the language. It's a miserable feeling, and I've known it all my life.
        - id: ch05-b06
          speaker: jerusha
          text: >-
            At high school, girls would gather in little groups and stare at me. I was strange and different, and everyone knew it. I could feel the words John Grier Home written across my face. Then a few charitable girls would make a special effort to come over and say something polite. I hated every one of them, especially the charitable ones.
          emotion: angry
        - id: ch05-b07
          speaker: jerusha
          text: >-
            Here, nobody knows I grew up in an asylum. I told Sallie McBride that my parents had died and a kind older gentleman was paying for my college. That's all true, as far as it goes. I don't want you to think I'm a coward. I only want to be like the other girls, and that Dreadful Home hanging over my childhood is the one enormous difference between us.
        - id: ch05-b08
          speaker: jerusha
          text: >-
            If I can turn away from it and shut out the memory, perhaps I can be as worthwhile as any other girl. I don't believe there's any real difference underneath. Do you? Anyway, Sallie McBride likes me! Yours ever, Judy Abbott, formerly Jerusha.
        - id: ch05-b09
          speaker: narrator
          text: Saturday morning.
        - id: ch05-b10
          speaker: jerusha
          text: >-
            I just read this letter again, and it sounds rather gloomy. But perhaps you can forgive me when you hear that I have a special paper due Monday morning, a geometry review, and a cold that makes me sneeze constantly.
        - id: ch05-b11
          speaker: narrator
          text: Sunday.
        - id: ch05-b12
          speaker: jerusha
          text: >-
            I forgot to mail this yesterday, so now I'm adding an outraged postscript. A bishop preached to us this morning, and can you imagine what he said?
          emotion: angry
        - id: ch05-b13
          speaker: bishop
          text: >-
            The kindest promise the Bible makes us is this: “You will always have the poor among you.” They are here so that we may keep practicing charity.
        - id: ch05-b14
          speaker: jerusha
          text: >-
            So the poor are a kind of useful household animal. If I hadn't become such a perfect lady, I would have marched up after the service and told him exactly what I thought.
          emotion: angry
