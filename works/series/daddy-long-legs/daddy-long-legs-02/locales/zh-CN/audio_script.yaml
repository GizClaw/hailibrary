audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 机敏而从容，带着温和的讽刺意味
        timbre: 温暖清亮
        pace: 舒缓而富有变化
        pitch: 中音
    jerusha_abbott:
      display_name: 杰鲁莎·艾博特
      tts:
        delivery: 聪敏直率，克制中透出活泼和想象力
        timbre: 清澈明亮的少女声线
        pace: 自然轻快，紧张时略快
        pitch: 中高音
    sallie_mcbride:
      display_name: 莎莉·麦克布莱德
      tts:
        delivery: 热情爽朗，说话坦率自然
        timbre: 明快柔和的少女声线
        pace: 轻快
        pitch: 中高音
    bishop:
      display_name: 主教
      tts:
        delivery: 郑重自信，带着布道时的权威感
        timbre: 浑厚的成年男声
        pace: 缓慢清晰
        pitch: 中低音
  chapters:
    - id: ch01
      title: 第一封信：我到啦
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 九月二十四日，信从弗格森楼二百一十五室寄出。
        - id: ch01-b02
          speaker: jerusha_abbott
          text: 亲爱的、送孤儿上大学的好心理事，我到啦！昨天我坐了整整四个小时的火车。那滋味真新鲜，不是吗？我从前还从没坐过呢。
        - id: ch01-b03
          speaker: jerusha_abbott
          text: 大学大得惊人，也复杂得惊人。我一出房门就迷路。现在我的脑子还乱成一团。等我清醒一点，再把这里是什么样子，还有我上了什么课，都好好讲给您听。今天是星期六，课程要到星期一早晨才开始。我只是急着先写封信，好让我们彼此熟悉一点。
        - id: ch01-b04
          speaker: jerusha_abbott
          text: 给一个完全不认识的人写信，怪不自在的。对我来说，写信本身就够奇怪了。我长这么大，总共也只写过三四封。要是它们不像规规矩矩的标准信件，您就多原谅一点吧。
        - id: ch01-b05
          speaker: jerusha_abbott
          text: 昨天早晨出发前，利佩特太太严肃地教导了我一番。她规定了我今后一辈子应该怎么表现，还特别告诉我，该怎样对待您这位为我做了这么多事的好心先生。最要紧的是，我必须时刻记得“非常恭敬”。
        - id: ch01-b06
          speaker: jerusha_abbott
          text: 可您要别人称您约翰·史密斯，这叫人怎么恭敬得起来呢？您就不能选个稍微有点性格的名字吗？照这样，我写“亲爱的拴马桩”或“亲爱的晾衣杆”也没什么不同。
        - id: ch01-b07
          speaker: jerusha_abbott
          text: 这个夏天，我常想到您。过了这么多年，终于有人在意我，就像我找到了一点家人的感觉。我似乎也属于某个人了，心里很安稳。可要我想象您的模样，想象力根本找不到多少可用的材料。线索只有三条。您很高，您很有钱，还有，您讨厌女孩子。
        - id: ch01-b08
          speaker: jerusha_abbott
          text: 叫您“讨厌女孩先生”，可是我听着受辱。叫您“有钱先生”，又像在辱辱您，好像钱是您唯一重要的地方。而且钱是一种外在的特点，未必能跟您一辈子。华尔街上好多聪明人都破了产，谁知道您会不会永远有钱？可您肯定会一辈子都那么高。所以我决定叫您“长腿叔叔”。希望您不会介意。这是我们的秘密昵称，千万别告诉利佩特太太。
        - id: ch01-b09
          speaker: jerusha_abbott
          text: 再过两分钟，十点的铃声就会响。我们在这儿吃饭听铃，睡觉听铃，念书也听铃。整天都被铃声切成一段一段，弄得我总觉得自己像匹等着出动的救火马。响了！该熄灯了。晚安。
        - id: ch01-b10
          speaker: jerusha_abbott
          text: 请您欣赏一下，约翰·格里尔孤儿院教出的学生，遵守规矩时有多准时。最恭敬您的，杰鲁莎·艾博特。
    - id: ch02
      title: 十月一日：大学和新朋友
      blocks:
        - id: ch02-b01
          speaker: jerusha_abbott
          text: 亲爱的长腿叔叔，我太喜欢大学了，也太感谢您送我来这里。我快乐得不得了，每一刻都兴奋，连觉都快睡不着。这里跟约翰·格里尔孤儿院完全不一样。我根本没想到世上还有这种地方。所有不是女孩子、没法来这儿的人都真可怜。您小时候上的大学，我敢说准没这么好。
        - id: ch02-b02
          speaker: jerusha_abbott
          text: 我住在塔楼上。新医务室没建起来前，这里是传染病房。同层还有三个女孩。一个是戴眼镜的四年级生，总是客客气气地请我们小声点。另外两个是新生，莎莉·麦克布莱德和朱莉娅·拉特奇·彭德尔顿。莎莉红头发，翘鼻子，很好相处。朱莉娅出身纽约顶尖的家族，还没看见我这个人。
        - id: ch02-b03
          speaker: jerusha_abbott
          text: 莎莉和朱莉娅两个同屋，四年级生和我都住单间。新生很难分到单间，因为这种房间非常少，我却没开口就有了一间。注册主任大概觉得，不该让家教良好的姑娘和一个弃婴同住。所以你看，弃婴也能占到便宜。
        - id: ch02-b04
          speaker: jerusha_abbott
          text: 我的房间在西北角，有两扇窗，也看得到风景。我跟二十个人挤在大寝室里住了十八年，如今总算能安静地独处。这还是我第一回有机会慢慢认识杰鲁莎·艾博特。我大概会喜欢她。您会喜欢她吗？
        - id: ch02-b05
          speaker: narrator
          text: 到了星期二，她又接着往下写。
        - id: ch02-b06
          speaker: jerusha_abbott
          text: 学校正在选一年级篮球队，我很可能会选上。我虽然矮，可动作快，身体又有韧劲儿，怎么折腾都不怕。别人在半空中跳的时候，我能从她们脚下钻过去抢球。下午在运动场练球太有意思了。树叶红红黄黄，空气里飘着烧落叶的味道，每个人都在笑，在喊。我从没见过这么快乐的女孩子，而我是她们中最快乐的一个。
        - id: ch02-b07
          speaker: jerusha_abbott
          text: 我原想写封长信，把我学的东西全告诉您。利佩特太太说过，您想知道。可第七节课的铃刚刚响了，再过十分钟，我就得换好运动服，准时赶到运动场。您也希望我能选上，对吧？永远属于您的，杰鲁莎·艾博特。
        - id: ch02-b08
          speaker: narrator
          text: 晚上九点，信里多了一段又及。莎莉·麦克布莱德刚把头探进杰鲁莎的房间。
        - id: ch02-b09
          speaker: sallie_mcbride
          text: 我想家想得快受不了了。你也想家吗？
          emotion: sad
        - id: ch02-b10
          speaker: jerusha_abbott
          text: 我笑了笑，说我不想，我挺得住。至少“想家”这场病没轮到我！您几时听说过有人“想孤儿院”呢？
    - id: ch03
      title: 十月十日：上课和布置房间
      blocks:
        - id: ch03-b01
          speaker: jerusha_abbott
          text: 亲爱的长腿叔叔，您听说过米开朗基罗吗？他是中世纪意大利的大艺术家。英国文学课上的人人都认识他，只有我以为他是位大天使，弄得全班都笑起来。他的名字明明就像大天使，不是吗？
        - id: ch03-b02
          speaker: jerusha_abbott
          text: 大学的麻烦就在这儿。人家假定你懂得许多你根本没学过的东西，有时真会弄得人很尴尬。如今女孩子们谈起我不懂的事，我就闭着嘴，回去再查百科全书。
        - id: ch03-b03
          speaker: jerusha_abbott
          text: 头一天我就出了个大丑。有人说到莫里斯·梅特林克，我还问“她”是不是新生。现在全校都在传这个笑话。可不管怎么说，我在课堂上跟别人一样聪明，我比其中好几个还聪明呢。
        - id: ch03-b04
          speaker: jerusha_abbott
          text: 您想听听我怎么布置房间吗？它是一支棕色和黄色的交响曲。墙本来就是淡黄褐色的。我又买了黄色粗棉布窗帘和坐垫，还有一张三美元的二手红木书桌，一把藤椅，一张棕色地毯。地毯中间有块墨渍，解决起来很简单，我把椅子摆在上面就行了。
        - id: ch03-b05
          speaker: jerusha_abbott
          text: 窗子开得太高，坐在普通椅子上根本望不到外面。所以我把镜子从五斗橱后面拆下来，在橱顶铺上软垫，再把整个五斗橱搬到窗边。高度刚好适合当窗台座。想上去，就把抽屉一层层拉出来当台阶。坐着可舒服了。
        - id: ch03-b06
          speaker: jerusha_abbott
          text: 这些家具都是莎莉帮我从四年级生的拍卖会上挑的。她从小到大一直住在真正的家里，当然懂得怎么布置房间。我以前手里最多只有几美分，所以您根本不会明白，买东西时拿出真正的五美元钞票，再等人找回零钱，到底有多好玩。叔叔，我向您保证，我真的很珍惜您给我的零用钱。
        - id: ch03-b07
          speaker: jerusha_abbott
          text: 莎莉是世界上最有意思的人，朱莉娅·拉特奇·彭德尔顿则是最没意思的。真不知道注册主任怎么会把这样的两个人分到一屋。莎莉看什么都好笑，连考不及格也能笑。朱莉娅却对什么都厌倦，根本不肯费心对人亲切一点。她相信，只要姓彭德尔顿，连考试都不用就能上天堂。她和我注定要做敌人。
        - id: ch03-b08
          speaker: jerusha_abbott
          text: 现在，您肯定已经急着听我学了什么。先说拉丁语，我们在学第二次布匿战争。昨晚，汉尼拔带着军队驻扎在特拉西梅诺湖边，又为罗马人设好了埋伏。今天凌晨第四更，两军开战。目前的最新消息是，罗马人正在撤退。
        - id: ch03-b09
          speaker: jerusha_abbott
          text: 法语学了二十四页《三个火枪手》，还有第三类动词变位和不规则动词。几何已经学完圆柱，开始学圆锥。英语正在学说明文，我的文笔每天都更清楚、更简练。生理学学到消化系统，下次就轮到胆汁和胰腺了。
        - id: ch03-b10
          speaker: jerusha_abbott
          text: 这就是正在走向受过教育的杰鲁莎·艾博特。又及，叔叔，您可千万别喝酒。酒会把肝脏弄得一塌糊涂。
    - id: ch04
      title: 星期三：我改名字了
      blocks:
        - id: ch04-b01
          speaker: jerusha_abbott
          text: 亲爱的长腿叔叔，我改名字了。名册上我还是“杰鲁莎”，可别的地方都叫我“朱迪”。唯一的昵称还得自己取，是不是有点可怜？不过它也不全是我造的。弗雷迪·珀金斯小时候说不清话，就这么叫我。
        - id: ch04-b02
          speaker: jerusha_abbott
          text: 利佩特太太要是肯在婴儿的名字上多动点心思就好了。姓是她从电话簿里拿的，第一页就有“艾博特”。名呢，遇到哪个就拿哪个。“杰鲁莎”是她在墓碑上看见的。我向来讨厌这个名字，却挺喜欢傻里傻气的“朱迪”。
        - id: ch04-b03
          speaker: jerusha_abbott
          text: 这名字本该属于我绝对不是的那种女孩。她甜甜的，长着蓝眼睛，全家人都疼她，也把她宠坏了。她没有烦恰，一路蹦蹦跳跳地过日子。要是能这样该多好。不管我有什么毛病，总不会有人说我叫家里宠坏了。不过，装成受过宠的样子很好玩。从今以后，请您每次写信都叫我朱迪。
        - id: ch04-b04
          speaker: jerusha_abbott
          text: 再告诉您一件事。我现在有三双小羊皮手套！圣诞树上以前给过我小羊皮连指手套，可五根手指各有各的位置的真手套，我从来没有过。我每过一会儿就要把三双手套拿出来，一双双地试戴。我好不容易才忍住，没有把它们戴去上课。
        - id: ch04-b05
          speaker: narrator
          text: 晚饭铃响了。朱迪匆匆写下“再见”，收住了这封信。
    - id: ch05
      title: 星期五到星期日：我是世界里的异乡人
      blocks:
        - id: ch05-b01
          speaker: jerusha_abbott
          text: 叔叔，您猜猜看？英语老师说，我上一篇作文表现出了很不寻常的独创性。真的，这是她亲口说的，一字不差。想想我受了十八年什么样的训练，简直叫人不敢相信。您当然知道，也当然非常赞成，约翰·格里尔孤儿院的目标，就是把九十七个孤儿全部变成一模一样的双胞胎。
        - id: ch05-b02
          speaker: jerusha_abbott
          text: 我那异乎寻常的艺术才能，倒是从小就得到了培养。我会用粉笔，在柴房门上画利佩特太太。
        - id: ch05-b03
          speaker: jerusha_abbott
          text: 我这样批评自己从小长大的那家孤儿院，您不会伤心吧？不过您手里有权，总是占着上风。我要是太放肆，您随时可以停掉支票。这话不太有礼貌，可您也不能指望我有礼貌。弃婴孤儿院又不是淑女精修学校。
        - id: ch05-b04
          speaker: jerusha_abbott
          text: 叔叔，大学里真正难的不是学习，而是玩。女孩子们讲话，我有一半时候都听不懂。她们的笑话总是牵着某些共同的过去。除了我，每个人都有那些过去。我好像是这个世界里的异乡人，听不懂它的话。这种感觉真叫人难受，而且不是到大学才有。我一辈子都是这样过来的。
        - id: ch05-b05
          speaker: jerusha_abbott
          text: 上中学时，女孩子们总是三三两两站在一起，什么也不说，只是看我。她们知道我古怪，知道我跟别人不一样。我几乎能觉得，自己脸上印着“约翰·格里尔孤儿院”。接着会有几个好心人特意走过来，为了表示慈善，对我说些客套话。我恨每一个人，最恨的就是那些好心人。
          emotion: angry
        - id: ch05-b06
          speaker: jerusha_abbott
          text: 这里谁都不知道我是在孤儿院长大的。我只告诉莎莉，父母都已经去世，有位好心的老先生供我上大学。我说出来的那些都是真话，只是没把全部真相都说完。我不想让您觉得我胆小，可我真的想和别的女孩一样。
        - id: ch05-b07
          speaker: jerusha_abbott
          text: 那家可怕的孤儿院像个黑影，一直笼罩着我的童年。它就是我跟别的女孩之间，那个最大、也最明显的差别。只要我能背过身去，把它和那些记忆全都挡在身后，我也该能像别的女孩那样讨人喜欢。我不信我们在内心最深处真有什么不同。您也不信，对吗？
        - id: ch05-b08
          speaker: jerusha_abbott
          text: 不管怎样，莎莉·麦克布莱德喜欢我！永远属于您的，朱迪·艾博特，原名杰鲁莎。
        - id: ch05-b09
          speaker: narrator
          text: 星期六早晨，朱迪重读了这封信，又补上几句。
        - id: ch05-b10
          speaker: jerusha_abbott
          text: 我刚才从头到尾重读了一遍，这封信听起来真不快活。不过，难道您猜不出缘故吗？我星期一早晨得交一篇专题作文，还要复习几何，同时又感冒得喷嚏打个不停。
        - id: ch05-b11
          speaker: narrator
          text: 信到星期日还没寄走。朱迪又气呼呼地添了最后一段。
        - id: ch05-b12
          speaker: jerusha_abbott
          text: 我昨天忘了寄信，所以现在要再补一段气愤的又及。今天早晨来了一位主教，您知道他竟然说了什么吗？
          emotion: angry
        - id: ch05-b13
          speaker: bishop
          text: 《圣经》给我们最仁慈、最能造福人类的应许，就是“因为常有穷人和你们同在”。穷人留在世上，就是为了让我们不断有机会行善。
        - id: ch05-b14
          speaker: jerusha_abbott
          text: 请您留意，照他这么说，穷人算是一种挺有用的家畜。要不是我已经变成了这么完美的淑女，礼拜一结束，我非走上前去，把我的想法当面告诉他不可。
          emotion: angry
