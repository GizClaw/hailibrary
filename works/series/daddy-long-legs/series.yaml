cover_prompt: |-
  A wordless cover scene in an early-twentieth-century American women's college courtyard centers on Jerusha Abbott beginning her independent life. Jerusha is a lively slender eighteen-year-old with chestnut hair pinned beneath a modest hat, wearing a dark blue walking skirt, white blouse, and simple brown jacket while carrying a stack of books and a sealed envelope. At the far end of a sunlit arcade, the elongated shadow of a tall departing gentleman falls across the wall, but his face and identity remain unseen. Jerusha pauses and looks from the mysterious shadow toward the open college green, making possibility and curiosity the focal action. Use an eye-level diagonal composition with brick buildings and autumn trees leading inward, leaving calm open sky and uncluttered wall space at the top. Keep clothing and campus details faithful to the United States around 1910 and avoid any modern adaptation imagery. No readable text, letters, numbers, labels, logos, captions, speech bubbles, signatures, or watermarks.
