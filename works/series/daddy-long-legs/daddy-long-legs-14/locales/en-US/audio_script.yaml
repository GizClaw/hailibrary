audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm, observant storytelling with a dry touch of humor
        timbre: clear and gently textured
        pace: measured and flowing
        pitch: medium
    jerusha:
      display_name: Jerusha Abbott
      tts:
        delivery: bright, quick, and candid, with feeling close to the surface
        timbre: youthful and clear
        pace: lively
        pitch: medium-high
  chapters:
    - id: ch01
      title: 24th April
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: April twenty-fourth.
        - id: ch01-b02
          speaker: jerusha
          text: >-
            Dear Daddy, spring is here again! You ought to see how beautiful the campus is. Why don't you come and see it yourself?
        - id: ch01-b03
          speaker: jerusha
          text: >-
            Master Jervie stopped by again last Friday, but his timing couldn't have been worse. Sallie, Julia, and I were rushing off to catch a train. And where were we going? To Princeton for a dance and a ball game, if you please!
        - id: ch01-b04
          speaker: jerusha
          text: >-
            I didn't ask your permission because I had a feeling your secretary would say no. But it was all perfectly proper. The college gave us leave, and Mrs. McBride went along as our chaperone. We had a wonderful time, but there are far too many complicated details to tell you.
        - id: ch01-b05
          speaker: narrator
          text: Saturday.
        - id: ch01-b06
          speaker: jerusha
          text: >-
            We were up before dawn! The night watchman woke all six of us. We made coffee in a chafing dish, with more grounds than you can imagine, and walked two miles to the top of One Tree Hill to watch the sunrise.
        - id: ch01-b07
          speaker: jerusha
          text: >-
            We had to scramble up the final slope, and the sun nearly beat us to the top! You can guess what kind of appetite we brought back to breakfast.
        - id: ch01-b08
          speaker: jerusha
          text: >-
            Goodness, Daddy, everything I write today ends in an exclamation point. They're sprinkled all over the page.
        - id: ch01-b09
          speaker: jerusha
          text: >-
            I meant to tell you all sorts of things. The trees are budding. There's a new cinder path on the athletic field. We have a dreadful biology lesson tomorrow, and there are new canoes on the lake. Catherine Prentiss has pneumonia. President Cuyler's Angora kitten wandered away from home and lived in Fergussen Hall for two weeks before a chambermaid reported it.
        - id: ch01-b10
          speaker: jerusha
          text: >-
            And I have three new dresses! One is white, one is pink, and one is blue with polka dots, and there's a matching hat. But I'm too sleepy to say any more. I always use that excuse, don't I? A girls' college is a busy place, and by evening we really are tired, especially when the day began at dawn. Affectionately, Judy.
    - id: ch02
      title: 15th May
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: May fifteenth.
        - id: ch02-b02
          speaker: jerusha
          text: >-
            Dear Daddy-Long-Legs, when you get into a streetcar, is it polite to stare straight ahead and act as if no one else is there?
        - id: ch02-b03
          speaker: jerusha
          text: >-
            Today, a very beautiful woman in a beautiful velvet dress got on. Without changing her expression once, she spent fifteen minutes staring at an advertisement for suspenders. Ignoring everyone as if you're the only important person doesn't seem polite to me. Besides, you miss so much. While she studied that silly sign, I studied a whole car full of interesting people.
        - id: ch02-b04
          speaker: jerusha
          text: >-
            I'm also sending you a picture that's never been shown before. It may look like a spider dangling from a string, but it isn't. It's me learning to swim in the gymnasium pool.
        - id: ch02-b05
          speaker: jerusha
          text: >-
            The instructor hooks a rope to a ring on the back of my belt and runs it through a pulley in the ceiling. It would be a lovely arrangement if I completely trusted the instructor. But I'm always afraid she'll let the rope go slack. So I keep one worried eye on her and try to swim with the other. Dividing my attention like that is slowing me down.
        - id: ch02-b06
          speaker: jerusha
          text: >-
            The weather has been changing every minute lately. It was raining when I began this letter, and now the sun is out. Sallie and I are going to play tennis, which means we won't have to go to gym.
        - id: ch02-b07
          speaker: narrator
          text: One week later.
        - id: ch02-b08
          speaker: jerusha
          text: >-
            I should have finished this ages ago, but I didn't. You don't mind if my letters aren't very regular, do you, Daddy? I truly love writing to you. It makes me feel respectable, as if I have a family.
        - id: ch02-b09
          speaker: jerusha
          text: >-
            Shall I tell you a secret? You aren't the only man I write to. There are two others! Master Jervie has been sending me beautiful long letters all winter. He even types the addresses so Julia won't know his handwriting. Isn't that shocking?
        - id: ch02-b10
          speaker: jerusha
          text: >-
            Then every week or so, a very untidy letter comes from Princeton, usually written on yellow tablet paper. I answer all of them with prompt, businesslike efficiency. You see, I'm not so different from other girls after all. I get letters too.
        - id: ch02-b11
          speaker: jerusha
          text: >-
            Did I mention that I've been elected to the Senior Dramatic Club? It's a very exclusive organization, with only seventy-five members out of a thousand students. As a loyal Socialist, do you think I ought to join something so select?
        - id: ch02-b12
          speaker: jerusha
          text: >-
            And can you guess what I'm studying in sociology right now? I'm writing a paper on the care of dependent children! The professor shuffled all the topics together and handed them out at random, and that was the one I got. Isn't that funny?
        - id: ch02-b13
          speaker: jerusha
          text: >-
            There's the dinner gong. I'll mail this on my way past the box. Affectionately, J.
    - id: ch03
      title: 4th June
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: June fourth.
        - id: ch03-b02
          speaker: jerusha
          text: >-
            Dear Daddy, everything is so busy. Commencement is ten days away, examinations begin tomorrow, and there's studying and packing everywhere. Meanwhile, the world outdoors is so lovely that staying inside almost hurts.
        - id: ch03-b03
          speaker: jerusha
          text: >-
            But vacation is coming. Julia will spend the summer abroad for the fourth time. There's no denying it, Daddy. The world's goods aren't divided very evenly. Sallie is going to the Adirondacks, as usual. And what do you think I'm doing? You may have three guesses.
        - id: ch03-b04
          speaker: jerusha
          text: >-
            Lock Willow? No. The Adirondacks with Sallie? No again. I won't try that after what happened last year. Can't you think of anything else? You're not being very inventive.
        - id: ch03-b05
          speaker: jerusha
          text: >-
            I'll tell you, Daddy, if you promise not to object too much. And I'm warning your secretary now that I've already made up my mind.
        - id: ch03-b06
          speaker: jerusha
          text: >-
            I'm spending the summer by the sea with Mrs. Charles Paterson and tutoring her daughter, who will start college in the fall. I met Mrs. Paterson through the McBrides, and she's delightful. I'll teach English and Latin to the younger daughter too, though I'll still have some time for myself.
        - id: ch03-b07
          speaker: jerusha
          text: >-
            And I'll earn fifty dollars a month! Isn't that an outrageous amount? She offered it herself. I would have been embarrassed to ask for more than twenty-five.
        - id: ch03-b08
          speaker: jerusha
          text: >-
            I'll finish in Magnolia, where she lives, on the first of September. Then I'll probably spend the last three weeks at Lock Willow. I'd like to see the Semples again, and all those friendly animals.
        - id: ch03-b09
          speaker: jerusha
          text: >-
            What do you think of my plan? I'm becoming quite independent. You've helped me stand on my own feet, and now I think I can almost walk by myself.
        - id: ch03-b10
          speaker: jerusha
          text: >-
            Princeton's commencement falls on exactly the same days as our examinations. What a blow! Sallie and I wanted so much to get away in time for it, but of course we can't.
        - id: ch03-b11
          speaker: jerusha
          text: >-
            Goodbye, Daddy. Have a lovely summer. Come back in the fall rested and ready for another year of work. That's what you should be writing to me!
        - id: ch03-b12
          speaker: jerusha
          text: >-
            I have no idea what you do all summer or how you entertain yourself. I can't picture anything around you. Do you play golf, hunt, ride horses, or simply sit in the sunshine and think?
        - id: ch03-b13
          speaker: jerusha
          text: >-
            Whatever you do, enjoy yourself, and don't forget Judy.
    - id: ch04
      title: 10th June
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: June tenth.
        - id: ch04-b02
          speaker: jerusha
          text: >-
            Dear Daddy, this is the hardest letter I've ever had to write. But I've decided what I must do, and I'm not going to turn back.
        - id: ch04-b03
          speaker: jerusha
          text: >-
            It was sweet and generous and dear of you to offer me a summer in Europe. For one moment, the idea swept me away. Then I thought clearly, and the answer was no. It wouldn't make sense to refuse your money for college and then spend it on amusement instead.
        - id: ch04-b04
          speaker: jerusha
          text: >-
            Please don't teach me to expect too many luxuries. You don't miss what you've never had. But once you begin to think something belongs to you by natural right, giving it up is terribly hard. I nearly said it belongs to him, but I mean her. The English language needs another pronoun.
        - id: ch04-b05
          speaker: jerusha
          text: >-
            Living with Sallie and Julia puts a terrible strain on my stoic philosophy. They've had nice things since they were babies, so they expect happiness. They believe the world owes them everything they want. Perhaps it does. At any rate, the world admits the debt and pays it.
        - id: ch04-b06
          speaker: jerusha
          text: >-
            But the world owes me nothing, and it made that very clear from the start. I have no right to borrow against a claim the world may refuse when payment comes due.
        - id: ch04-b07
          speaker: jerusha
          text: >-
            Now I'm drowning in a sea of metaphors, but I hope you understand me. I feel very strongly that the honest thing is to teach this summer and begin supporting myself.
        - id: ch04-b08
          speaker: narrator
          text: Magnolia. Four days later.
        - id: ch04-b09
          speaker: jerusha
          text: >-
            I had written only that much when something happened. The maid arrived with Master Jervie's card.
        - id: ch04-b10
          speaker: jerusha
          text: >-
            He's going abroad this summer too, though not with Julia and her family. He's going alone. I told him you'd invited me to travel with a lady who was chaperoning a group of girls.
        - id: ch04-b11
          speaker: jerusha
          text: >-
            He knows about you, Daddy. Well, he knows my parents are dead and that a kind gentleman pays for my college education. I couldn't bring myself to tell him about the John Grier Home and everything else. He believes you're my guardian and an entirely proper old family friend.
        - id: ch04-b12
          speaker: jerusha
          text: >-
            I've never told him that I don't know you. It would sound much too strange!
        - id: ch04-b13
          speaker: jerusha
          text: >-
            Anyway, he insisted that I go to Europe. He said traveling was a necessary part of my education and I must not refuse. He would be in Paris at the same time, so now and then we could escape from the chaperone and have dinner together in amusing little foreign restaurants.
        - id: ch04-b14
          speaker: jerusha
          text: >-
            Oh, Daddy, the idea was tempting! I nearly gave in. If he hadn't been so bossy, I might have given in completely. You can lead me along one step at a time, but I will not be forced.
        - id: ch04-b15
          speaker: jerusha
          text: >-
            He called me a silly, foolish, unreasonable, quixotic, idiotic, stubborn child. Those are only a few of his insulting adjectives. I've forgotten the rest. He said I didn't know what was best for me and ought to let older people decide. We almost quarreled. In fact, I'm not sure we didn't quarrel altogether!
          emotion: angry
        - id: ch04-b16
          speaker: jerusha
          text: >-
            Whatever you call it, I packed my trunk in a hurry and came straight here. I wanted to see the bridges burning behind me before I finished this letter to you. Now they're nothing but ashes.
        - id: ch04-b17
          speaker: jerusha
          text: >-
            Here I am at Cliff Top, which is the name of Mrs. Paterson's cottage. My trunk is unpacked, and Florence, the younger girl, is already wrestling with first-declension nouns. It looks as if the wrestling will go on for quite a while.
        - id: ch04-b18
          speaker: jerusha
          text: >-
            She is an extraordinarily spoiled child. Before I can teach her Latin, I'll have to teach her how to study. In her whole life, she's never concentrated on anything harder than an ice-cream soda.
        - id: ch04-b19
          speaker: jerusha
          text: >-
            We hold school in a quiet corner of the cliffs because Mrs. Paterson wants the girls outdoors. I must admit, it's hard to concentrate when the blue sea is spread out in front of me and ships keep sailing past.
        - id: ch04-b20
          speaker: jerusha
          text: >-
            Then I remember that I might have been on one of those ships, sailing toward foreign countries. But I will not think about anything except Latin grammar.
        - id: ch04-b21
          speaker: jerusha
          text: >-
            The prepositions a or ab, absque, coram, cum, de, e or ex, prae, pro, sine, tenus, in, subter, sub, and super govern the ablative.
        - id: ch04-b22
          speaker: jerusha
          text: >-
            So you see, Daddy, I'm already deep in my work, with my eyes firmly turned away from temptation. Please don't be cross with me. And don't imagine that I fail to appreciate your kindness. I do appreciate it, always and always.
        - id: ch04-b23
          speaker: jerusha
          text: >-
            The only way I can repay you is by becoming a Very Useful Citizen. Though are women citizens? I don't suppose they are. Then I'll become a Very Useful Person. When you look at me, you can say, “I gave that Very Useful Person to the world.”
        - id: ch04-b24
          speaker: jerusha
          text: >-
            That sounds impressive, doesn't it? But I don't want to fool you. I often suspect that I'm not remarkable at all. Planning a grand career is fun, but I'll probably turn out no different from any other ordinary person.
        - id: ch04-b25
          speaker: jerusha
          text: >-
            I may end up marrying an undertaker and inspiring him in his work. Yours ever, Judy.
