audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 叙述者
      tts:
        delivery: 清楚沉静，简洁报出书信日期与场景转换
        timbre: 温暖清澈
        pace: 舒缓
        pitch: 中音
    judy:
      display_name: 朱迪
      tts:
        delivery: 聪敏直率，像把心事和见闻亲口讲给亲近的人
        timbre: 明亮自然的年轻女声
        pace: 轻快而富于变化，伤心时稍慢
        pitch: 中高音
  chapters:
    - id: ch01
      title: 4月24日
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 4月24日，春天回到校园，朱迪又给长腿叔叔写信。
        - id: ch01-b02
          speaker: judy
          text: 亲爱的叔叔，春天又来了！校园现在美极了，您真应该亲自来看看。上星期五，杰维少爷又顺道来看我们，可他来得太不巧。莎莉、朱莉娅和我正忙着赶火车呢。
          emotion: happy
        - id: ch01-b03
          speaker: judy
          text: 猜猜我们要去哪里？去普林斯顿参加舞会，还要看球赛！我没有先问您准不准去，因为总觉得您的秘书准会说不行。不过这件事完全合乎规矩。学院准了我们的假，还有麦克布赖德太太一路陪着。这趟玩得真痛快。至于详情嘛，事情又多又复杂，只好不讲了。
        - id: ch01-b04
          speaker: narrator
          text: 到了星期六，朱迪又接着写。
        - id: ch01-b05
          speaker: judy
          text: 今天，我们天没亮就爬起来了！守夜人叫醒我们六个，我们用小酒精炉煮咖啡，那咖啡渣多得简直没法形容。然后大家走了两英里，到一树山顶看日出。最后那段坡，我们是手脚并用爬上去的，太阳差一点就比我们先到！回来吃早饭的时候，您想想，我们能不饿吗？
        - id: ch01-b06
          speaker: judy
          text: 哎呀，叔叔，我今天说话怎么净是大呼小叫的，这一整页信纸上简直撒得到处都是惊叹号。
        - id: ch01-b07
          speaker: judy
          text: 本来还有好多事想告诉您。树刚刚抽芽，运动场铺了新的煤渣跑道，明天生物课那篇功课可怕极了，湖里又添了新独木舟。凯瑟琳·普伦蒂斯得了肺炎。院长家的安哥拉猫离家出走以后，竟在弗格森楼白吃白住了两个星期，直到一位女佣发现，才把它报上去。
        - id: ch01-b08
          speaker: judy
          text: 对了，我还有三条新裙子，一条白的，一条粉红的，一条蓝底圆点的，每一条都有配套的帽子。可是我困得睁不开眼啦。我是不是总拿困当借口？女子学院真的很忙，熬到晚上当然会累，尤其是天没亮就开始的一天。爱您的朱迪。
    - id: ch02
      title: 5月15日
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 5月15日，朱迪先从车厢里的一位太太说起。
        - id: ch02-b02
          speaker: judy
          text: 亲爱的长腿叔叔，一个人上了车，只管盯着正前方，装作谁都没看见，这算有礼貌吗？
        - id: ch02-b03
          speaker: judy
          text: 今天上来一位非常漂亮的太太，还穿着一身非常漂亮的天鹅绒衣裳。她面无表情地坐了整整十五分钟，一直盯着吊带广告。车里明明还有别人，她却全不理会，好像只有她自己才重要，这可不大礼貌。而且会错过很多好玩的事。她研究那张傻广告的时候，我已经把满车厢有趣的人研究了一遍。
        - id: ch02-b04
          speaker: judy
          text: 我还随信附上一幅画，现在就让它第一次公开发表。您看，它很像一只吊在线头上的蜘蛛吧？其实根本不是。画上那个人是我，我正在体育馆的水池里学游泳。
        - id: ch02-b05
          speaker: judy
          text: 教练把绳子扣在我腰带后面的圆环上，再穿过天花板的滑轮。只要你完全信得过教练，这办法当然妙极了。可我总怕她把绳子放松，只好一只眼紧张地盯着她，另一只眼负责游泳。心思一分为二，我当然学得没有本来那么快。
        - id: ch02-b06
          speaker: judy
          text: 最近的天气真是什么样都有。我刚开始写这封信时，外面还下着雨，现在太阳却已经照出来了。莎莉和我要出去打网球，这么一来，我们就可以免上体育课。
        - id: ch02-b07
          speaker: narrator
          text: 一个星期过去，朱迪才重新拿起这封没写完的信。
        - id: ch02-b08
          speaker: judy
          text: 叔叔，这封信早就该写完，可我一直拖到现在。写信总是没个准时候，您不会介意吧？我真的很喜欢给您写信，因为每次一写起信来，我就觉得自己也体体面面地有了家人。这感觉真好。
        - id: ch02-b09
          speaker: judy
          text: 告诉您一个秘密。我写信的男人不只您，还有两个呢！这个冬天，杰维少爷常给我写漂亮的长信。信封上的地址特意用打字机打，免得朱莉娅认出他的字。是不是惊人得很？每隔一星期左右，普林斯顿也会来一封潦草透顶的信，多半写在黄色便笺上。我对每封信都像办公事一样，马上回复。
        - id: ch02-b10
          speaker: judy
          text: 所以您看，我和别的女孩子并没有那么不一样。我也会收到信呀。
        - id: ch02-b11
          speaker: judy
          text: 我有没有告诉过您，我入选高年级戏剧社了？这个团体可讲究了，全校一千个人里只收七十五个。可我既然是立场坚定的社会主义者，到底该不该参加这样挑剔的团体呢？
        - id: ch02-b12
          speaker: judy
          text: 您再猜猜，我眼下在社会学课上忙什么。论文题目居然是《贫困儿童的照护》！教授把所有题目洗乱，漫不经心地像发牌一样发下来，偏偏把这个发给了我。您说怪不怪？
        - id: ch02-b13
          speaker: judy
          text: 开饭钟响了。我经过信箱时就把信寄走。爱您的杰。
    - id: ch03
      title: 6月4日
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 6月4日，考试和毕业典礼都近在眼前。
        - id: ch03-b02
          speaker: judy
          text: 亲爱的叔叔，最近忙得要命。十天后就是毕业典礼，明天又有考试。书怎么也念不完，行李怎么也收不完，外面的天地偏偏美得让人心疼，叫人根本坐不住。
        - id: ch03-b03
          speaker: judy
          text: 好在假期就要来了。朱莉娅今夏又要出国，这已经是第四次。叔叔，世上的好东西果然分得不公平。莎莉还是去阿迪朗达克山区。那我呢？给您猜三次。洛克柳庄园？不对。跟莎莉一起去山区？也不对。去年碰过一次钉子，我再也不试了。
        - id: ch03-b04
          speaker: judy
          text: 还猜不到吗？您的想象力可不怎么样。只要您答应别反对个没完，我就公布答案。也请您的秘书提前听清楚，我已经决定了。
        - id: ch03-b05
          speaker: judy
          text: 今年暑假，我要去海边陪查尔斯·帕特森太太住，还要辅导她那个秋天上大学的女儿。我通过麦克布赖德一家认识她，她非常可爱。她的小女儿也要跟我学英语和拉丁文。不过我每天还能有一点自己的时间，而且每个月能挣五十美元！这价钱是不是高得惊人？是她主动开的。换成我，连二十五美元都不好意思要。
        - id: ch03-b06
          speaker: judy
          text: 她住的地方叫马格诺利亚，我会在那里教到9月1日。暑假剩下的三个星期，大概再去洛克柳庄园。我很想再见到森普尔一家，也想看看那些一直待我亲切的动物。
        - id: ch03-b07
          speaker: judy
          text: 叔叔，您觉得这个安排怎么样？您看，我越来越独立了。您已经扶我站稳，现在我差不多能自己往前走啦。
        - id: ch03-b08
          speaker: judy
          text: 可惜普林斯顿的毕业典礼，正好撞上我们的考试。这打击太沉重了。莎莉和我都想及时赶过去，但当然绝对办不到。
          emotion: sad
        - id: ch03-b09
          speaker: judy
          text: 再见，叔叔。祝您过个愉快的夏天，等秋天回来时，已经休息得精神饱满，也准备好再工作一年。这句话本来该由您来嘱咐我才对！我一点也不知道您夏天做什么，又拿什么消遣，连您周围是什么样都想不出来。您会打高尔夫、打猎、骑马，还是只坐在太阳底下想心事？
        - id: ch03-b10
          speaker: judy
          text: 不管您做什么，都要玩得开心，也别把朱迪忘了。
    - id: ch04
      title: 6月10日
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 6月10日，朱迪动笔写下了自己最难写的一封信。
        - id: ch04-b02
          speaker: judy
          text: 亲爱的叔叔，我已经决定该怎么做了，这次不会再回头。您想送我今夏去欧洲，真的又慷慨又体贴。刚听到时，我简直醉在这个念头里。可等头脑冷静下来，我还是得说不。
        - id: ch04-b03
          speaker: judy
          text: 我不肯拿您的钱交大学学费，却拿它去玩，不是太不合道理了吗？您不能让我习惯那么多奢侈享受。从没拥有过的东西，人不会觉得缺。可一旦认定某样东西天生就该属于他，或者属于她，忽然又没有了，那才真难受。英语真应该多造一个代词！
        - id: ch04-b04
          speaker: judy
          text: 跟莎莉和朱莉娅住在一起，我那点斯多葛哲学每天都在受考验。她们从婴儿时候起什么都有，觉得幸福本来就该如此，世界理当给她们想要的一切。也许世界确实欠她们吧。至少它承认这笔账，而且每次都肯如数偿还。可世界不欠我什么，它从一开始就明明白白说过了。所以我没有权利向它赊账，因为将来总有一天，它会拒绝承认我的债权。
        - id: ch04-b05
          speaker: judy
          text: 我好像掉进比喻的海里，越扑腾越乱。可您应该听懂了吧？不管怎么说，我心里很确定，今年夏天应该去教书，从现在开始养活自己。只有这样做，我才觉得诚实。
        - id: ch04-b06
          speaker: narrator
          text: 四天以后，朱迪到了马格诺利亚，又把信接着写下去。
        - id: ch04-b07
          speaker: judy
          text: 我刚写到那里，您猜出了什么事？女佣送来了杰维少爷的名片。今夏他也要出国，不过不跟朱莉娅一家同行，而是一个人去。我告诉他，您请我跟一位太太去欧洲，她会陪着一群女孩子。
        - id: ch04-b08
          speaker: judy
          text: 叔叔，他知道一点您的事。他知道我父母都去世了，有位好心先生供我念大学。可我实在没勇气说出约翰·格里尔孤儿院，还有其他那些事情。他以为您是我的监护人，也是我们家名正言顺的老朋友。我从没告诉他，我根本不认识您。那听起来也太古怪了！
        - id: ch04-b09
          speaker: judy
          text: 总之，杰维少爷非让我去欧洲不可。他说，欧洲是教育中不能少的一部分，我根本不该拒绝。他还说，那时候他也在巴黎，我们偶尔可以甩掉陪同的太太，一起去那些稀奇有趣的外国餐馆吃晚饭。
        - id: ch04-b10
          speaker: judy
          text: 叔叔，我承认，这实在很诱人。我差一点就改变主意。要不是他说话那么专横，我没准真的投降了。一步一步哄我走还可以，逼我可不行。他骂我是个愚蠢、糊涂、不讲道理、满脑子骑士幻想、白痴一样又顽固的小孩子。这还只是我记得的几个形容词呢。
        - id: ch04-b11
          speaker: judy
          text: 他还说，我根本不知道什么对自己好，应该听年长的人判断。我们差一点吵起来。说不定，已经彻底吵过一架了！
          emotion: angry
        - id: ch04-b12
          speaker: judy
          text: 反正，我马上收好衣箱，赶到了这里。我觉得，非得亲眼看着身后的桥烧起来，才能把这封信写完。现在那座桥已经烧得连灰都不剩。我住在崖顶别墅，这是帕特森太太乡间小屋的名字。衣箱已经打开，弗洛伦丝，就是她的小女儿，也已经在第一变格名词里面苦苦挣扎。看来这会是一场苦战！
        - id: ch04-b13
          speaker: judy
          text: 弗洛伦丝实在被宠坏了。我得先教她怎么用功，因为她一辈子还没把心思放在比冰激凌苏打更难的东西上。我们把悬崖上一处安静的角落当教室。帕特森太太希望女儿们都待在户外。可是蓝色大海就在眼前，船一艘艘扬帆经过，我怎么专心得了？
        - id: ch04-b14
          speaker: judy
          text: 我一想到自己本来也可能坐在船上，正驶向外国……不行，我只准自己想拉丁语法。介词a或ab，absque，coram，cum，de，e或ex，prae，pro，sine，tenus，in，subter，sub和super，都支配夺格。
        - id: ch04-b15
          speaker: judy
          text: 所以您看，我已经忙起来了，而且一直不肯朝诱惑多看一眼。请别生我的气，也别以为我不感激您的好意。我真的感激，永远都感激。我唯一能报答您的办法，就是长大以后成为一个非常有用的公民。可是，女人算公民吗？大概不算吧。那就做一个非常有用的人。
        - id: ch04-b16
          speaker: judy
          text: 将来您看着我，就可以说，这个非常有用的人，是我送给世界的。听起来很不错，对不对？不过我不愿意让您受骗。有时候我忽然觉得，自己根本没有什么出众的地方。替未来规划一番事业当然很有趣，可到头来，我十有八九跟任何一个普普通通的人都没有两样。
        - id: ch04-b17
          speaker: judy
          text: 说不定最后，我会嫁给一个殡仪员，在他的事业中给他带来灵感。永远属于您的朱迪。
