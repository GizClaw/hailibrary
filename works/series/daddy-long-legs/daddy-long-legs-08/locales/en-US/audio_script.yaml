  chapters:
    - id: ch01
      title: 4th February
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: February fourth.
        - id: ch01-b02
          speaker: jerusha
          text: >-
            Dear Daddy-Long-Legs, Jimmie McBride sent me a Princeton banner as big as one end of our room. It was sweet of him to remember me, but what in the world can I do with it? Sallie and Julia refuse to let me hang it up. Our room is red this year, so just imagine adding orange and black. Still, the felt is so warm and thick that I hate to waste it. Would it be terribly improper to turn a Princeton banner into a bathrobe? My old robe shrank in the wash.
        - id: ch01-b03
          speaker: jerusha
          text: >-
            I haven't told you much lately about what I'm learning. You might not guess it from my letters, but studying takes up practically all my time. Trying to get educated in five subjects at once is very confusing.
        - id: ch01-b04
          speaker: chemistry_professor
          text: A true scholar must have a patient passion for every detail.
        - id: ch01-b05
          speaker: jerusha
          text: That is what the chemistry professor tells us. Then the history professor says exactly the opposite.
        - id: ch01-b06
          speaker: history_professor
          text: Don't stare so closely at the details that you miss everything else. Step back and see the whole picture.
        - id: ch01-b07
          speaker: jerusha
          text: >-
            So you see how carefully we have to steer between chemistry and history. I prefer the history method. Suppose I say William the Conqueror arrived in 1492, while Columbus discovered America in 1100, or 1066, or whenever it was. That is only a detail, and the professor lets it pass. History class feels wonderfully safe and restful. Chemistry does not.
        - id: ch01-b08
          speaker: jerusha
          text: >-
            There's the sixth-hour bell. I must go to the laboratory and investigate acids, salts, and alkalis. Hydrochloric acid burned a hole the size of a plate in the front of my chemistry apron. If the theory is right, I should be able to neutralize the hole with some nice strong ammonia, shouldn't I?
        - id: ch01-b09
          speaker: jerusha
          text: Examinations are next week, but who is afraid? Yours ever, Judy.
    - id: ch02
      title: 5th March
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: March fifth.
        - id: ch02-b02
          speaker: jerusha
          text: >-
            Dear Daddy-Long-Legs, a March wind is blowing, and the sky is full of heavy black clouds racing past. The crows in the pine trees are making an enormous racket. It sounds thrilling, exciting, almost as if they're calling you. You want to shut your books, run over the hills, and race the wind.
        - id: ch02-b03
          speaker: jerusha
          text: >-
            Last Saturday we had a five-mile paper chase through soggy countryside. Our fox was really three girls carrying a bushel or so of confetti. They left half an hour before the twenty-seven hunters. I was one of those hunters. Eight girls fell out along the way, so nineteen of us finished.
        - id: ch02-b04
          speaker: jerusha
          text: >-
            First the trail went over a hill and through a cornfield. Then it led into a swamp, where we tried to hop lightly from one grassy mound to the next. Of course, half of us landed ankle-deep in the water. We kept losing the trail and spent twenty-five minutes wandering around that swamp.
        - id: ch02-b05
          speaker: jerusha
          text: >-
            From there we climbed another hill, ran through some woods, and came to a barn window. The doors were locked, and the window was both high and rather small. I don't call that fair, do you? We did not climb through. We went around the barn instead and found the trail again. It came down a low shed roof and crossed the top of a fence. The fox thought that would stop us, but we fooled him.
        - id: ch02-b06
          speaker: jerusha
          text: >-
            After that, the trail ran straight across two miles of rolling meadow. It was terribly hard to see because the confetti was growing scarce. The rules say the pieces can be no more than six feet apart, but those were the longest six feet I have ever seen.
        - id: ch02-b07
          speaker: jerusha
          text: >-
            At last, after two hours of steady trotting, we tracked Monsieur Fox into the kitchen at Crystal Spring. That's a farm where the girls ride out in sleighs and hay wagons for chicken-and-waffle suppers. There sat all three foxes, calmly eating milk, honey, and biscuits. They never thought we would make it that far. They expected us to get stuck at the barn window.
        - id: ch02-b08
          speaker: jerusha
          text: >-
            Both sides claim they won. I say we did, don't you? We caught them before they reached campus. Anyway, all nineteen hunters came down on the furniture like a swarm of locusts and demanded honey. There wasn't enough for everyone. Mrs. Crystal Spring is really Mrs. Johnson, but that is our pet name for her. She brought out strawberry jam, maple syrup made just the week before, and three loaves of brown bread.
        - id: ch02-b09
          speaker: jerusha
          text: >-
            We reached college at six thirty, half an hour late for dinner. We marched straight in without changing our clothes, and our appetites were perfectly fine. Then all of us skipped evening chapel. The condition of our boots was excuse enough.
        - id: ch02-b10
          speaker: jerusha
          text: >-
            I never told you how the examinations went. I passed everything easily. Now that I know the secret, I never intend to fail again. I can't graduate with honors because of that horrid Latin prose and geometry from freshman year, but I don't care. What's the odds as long as you're happy? That is a quotation. I have been reading the English classics.
        - id: ch02-b11
          speaker: jerusha
          text: >-
            Speaking of classics, have you read Hamlet? If not, start at once. It is perfectly corking. I have heard about Shakespeare all my life, but I had no idea he truly wrote so well. I always suspected he lived mostly on his reputation.
        - id: ch02-b12
          speaker: jerusha
          text: >-
            I invented a lovely game when I first learned to read, and I still play it every night as I fall asleep. I pretend to be the person in my current book. Naturally, I am always the most important person.
        - id: ch02-b13
          speaker: jerusha
          text: >-
            Right now I am Ophelia, but a very sensible Ophelia. I keep Hamlet entertained. I pet him, scold him, and make him wrap up his throat when he catches cold. I have cured his sadness completely. The King and Queen both died in an accident at sea, so there was no need for a funeral. Now Hamlet and I rule Denmark with no trouble at all.
        - id: ch02-b14
          speaker: jerusha
          text: >-
            Our kingdom runs beautifully. Hamlet handles the government, while I take care of charity. I have just opened several excellent orphan asylums. If you or any of the other trustees would like a tour, I would be delighted to show you around. You might pick up many useful ideas.
        - id: ch02-b15
          speaker: jerusha
          text: I remain, sir, yours most graciously, Ophelia, Queen of Denmark.
    - id: ch03
      title: 24th March, maybe the 25th
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: March twenty-fourth. Or perhaps the twenty-fifth.
        - id: ch03-b02
          speaker: jerusha
          text: >-
            Dear Daddy-Long-Legs, I can't believe I'm going to Heaven. So many good things are happening to me here that it would hardly be fair to give me more afterward. Just listen to this.
        - id: ch03-b03
          speaker: jerusha
          text: >-
            Jerusha Abbott won the Monthly's annual short-story contest and its twenty-five-dollar prize. And she is only a sophomore! Nearly everyone else who entered was a senior. When I saw my name posted, I could hardly believe it. Maybe I really will become an author. I only wish Mrs. Lippett had not given me such a foolish name. Jerusha Abbott sounds like an authoress, doesn't it?
          emotion: happy
        - id: ch03-b04
          speaker: jerusha
          text: >-
            There is more. I was chosen for the spring play. We are performing As You Like It outdoors, and I will play Celia, Rosalind's own cousin.
          emotion: happy
        - id: ch03-b05
          speaker: jerusha
          text: >-
            And finally, Julia, Sallie, and I are going to New York next Friday. We'll shop for spring clothes, stay overnight, and go to the theater the next day with Master Jervie. He invited us. Julia will stay with her family, but Sallie and I will sleep at the Martha Washington Hotel.
        - id: ch03-b06
          speaker: jerusha
          text: >-
            Have you ever heard of anything so exciting? I have never stayed in a hotel, and I have never been to a real theater. Once, the Catholic Church held a festival and invited the orphans, but that wasn't a real play, so it does not count.
          emotion: happy
        - id: ch03-b07
          speaker: jerusha
          text: >-
            And guess what we are going to see. Hamlet! Think of it. We studied the play for four weeks in Shakespeare class, and I know it by heart. All these wonderful things have me so excited that I can barely sleep.
          emotion: happy
        - id: ch03-b08
          speaker: jerusha
          text: Goodbye, Daddy. This is a very entertaining world. Yours ever, Judy.
        - id: ch03-b09
          speaker: jerusha
          text: Postscript. I just checked the calendar. Today is the twenty-eighth.
        - id: ch03-b10
          speaker: jerusha
          text: >-
            Another postscript. Today I saw a streetcar conductor with one brown eye and one blue eye. Wouldn't he make a splendid villain in a detective story?
    - id: ch04
      title: 7th April
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: April seventh.
        - id: ch04-b02
          speaker: jerusha
          text: >-
            Dear Daddy-Long-Legs, mercy, New York is enormous! Worcester is nothing beside it. Do you really live in the middle of all that confusion? Two days there left me so bewildered that I may need months to recover. I can't possibly tell you every amazing thing I saw. You live there, so I suppose you already know.
        - id: ch04-b03
          speaker: jerusha
          text: >-
            Aren't the streets fascinating? And the people, and the stores? I had never seen anything as lovely as the things in those windows. They make you want to devote your whole life to wearing clothes.
        - id: ch04-b04
          speaker: jerusha
          text: >-
            On Saturday morning, Sallie, Julia, and I went shopping together. Julia led us into the most gorgeous place I had ever seen. It had white-and-gold walls, blue carpets, blue silk curtains, and gilded chairs. A beautiful yellow-haired woman in a long, trailing black silk dress came toward us with a welcoming smile.
        - id: ch04-b05
          speaker: jerusha
          text: >-
            I thought we had come for a social visit, so I started to shake her hand. It turned out that we were only there to buy hats. Julia was, anyway. She sat before a mirror, tried on a dozen hats, each prettier than the one before, and bought the two loveliest.
        - id: ch04-b06
          speaker: jerusha
          text: >-
            I cannot imagine any greater joy than sitting before a mirror and choosing any hat you please without asking the price first. There is no question about it, Daddy. New York would quickly destroy the fine, stern character that the John Grier Home worked so patiently to build in me.
        - id: ch04-b07
          speaker: jerusha
          text: >-
            When we finished shopping, we met Master Jervie at Sherry's. You must have been there. Picture Sherry's, and then picture the John Grier Home dining room. Its tables were covered in oilcloth. The dishes were white crockery that could not be broken, and the knives and forks had wooden handles. Now imagine how I felt.
        - id: ch04-b08
          speaker: jerusha
          text: >-
            I ate my fish with the wrong fork. The waiter kindly brought me another one, and no one noticed.
        - id: ch04-b09
          speaker: jerusha
          text: >-
            After lunch, we went to the theater. It was dazzling, marvelous, impossible to believe. I dream of it every night. Isn't Shakespeare wonderful? Hamlet is so much better onstage than it is when we pull it apart in class. I liked it before, but now! Oh, my.
          emotion: happy
        - id: ch04-b10
          speaker: jerusha
          text: >-
            If you don't mind, I think I would rather be an actress than a writer. Would you let me leave college for drama school? Then I would send you a box for every performance and smile at you across the footlights. Please wear a red rose in your buttonhole, so I smile at the right man. Imagine how embarrassing it would be if I chose someone else.
        - id: ch04-b11
          speaker: jerusha
          text: >-
            We came back Saturday night and ate dinner on the train. We sat at little tables lit by pink lamps, and Black waiters served us. I had never heard of serving meals on trains, and I accidentally said so aloud.
        - id: ch04-b12
          speaker: julia
          text: Where in the world did you grow up?
        - id: ch04-b13
          speaker: narrator
          text: Jerusha answered Julia meekly.
        - id: ch04-b14
          speaker: jerusha
          text: In a village.
        - id: ch04-b15
          speaker: julia
          text: But hadn't you ever traveled before?
        - id: ch04-b16
          speaker: jerusha
          text: >-
            Not until I came to college. That trip was only a hundred and sixty miles, and we didn't have a meal.
        - id: ch04-b17
          speaker: jerusha
          text: >-
            Julia is becoming quite interested in me because I say such strange things. I try not to, but they slip out whenever I'm surprised, and I am surprised nearly all the time. Daddy, spending eighteen years in the John Grier Home and then suddenly being dropped into the world is a dizzying experience.
        - id: ch04-b18
          speaker: jerusha
          text: >-
            But I am getting used to it. I don't make as many terrible mistakes, and I no longer feel uncomfortable around the other girls. I used to twist and squirm whenever anyone looked at me. I thought they could see straight through my pretend new clothes to the checked gingham underneath. The gingham does not trouble me now. Yesterday has enough troubles of its own.
        - id: ch04-b19
          speaker: jerusha
          text: >-
            I almost forgot our flowers. Master Jervie gave each of us a large bouquet of violets and lilies of the valley. Wasn't that sweet? I never cared much for men before, but I was judging them by the trustees. I am beginning to change my mind.
        - id: ch04-b20
          speaker: jerusha
          text: Eleven pages! This truly is a letter. Be brave. I am stopping now. Yours always, Judy.
