audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 叙述者
      tts:
        delivery: 清楚沉静，简洁报出书信日期
        timbre: 温暖清澈
        pace: 舒缓
        pitch: 中音
    judy:
      display_name: 朱迪
      tts:
        delivery: 聪敏活泼，像把新鲜见闻亲口讲给亲近的人
        timbre: 明亮自然的年轻女声
        pace: 轻快而富于变化
        pitch: 中高音
    chemistry_professor:
      display_name: 化学教授
      tts:
        delivery: 严谨郑重，强调学术准则
        timbre: 清晰坚实
        pace: 从容
        pitch: 中低音
    history_professor:
      display_name: 历史教授
      tts:
        delivery: 开阔自信，像在课堂上耐心点拨
        timbre: 稳重清朗
        pace: 从容
        pitch: 中音
    julia:
      display_name: 朱莉娅
      tts:
        delivery: 见多识广，惊讶时仍带着矜持
        timbre: 清脆端正的年轻女声
        pace: 适中
        pitch: 中高音
  chapters:
    - id: ch01
      title: 2月4日
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 2月4日，朱迪写信给长腿叔叔。
        - id: ch01-b02
          speaker: judy
          text: 吉米·麦克布赖德送给我一面普林斯顿大学的三角旗，足有一面墙那么大。他还记得我，我当然很感激，可这东西究竟能拿来做什么呢？莎莉和朱莉娅不许我挂起来。我们今年的房间全是红色，要是再加上橙色和黑色，那模样你也想得到。可它的毡子又厚又暖，白白浪费实在可惜。我的旧浴袍洗缩水了，把这面旗改成浴袍，会不会太不像话？
        - id: ch01-b03
          speaker: judy
          text: 我近来完全没提自己学了什么。你看我的信，也许猜不到我的时间其实全让功课占满了。一个人同时在五门学问里受教育，真会弄得晕头转向。
        - id: ch01-b04
          speaker: chemistry_professor
          text: 真正有学问的人，必定肯怀着热情，把每一个细节都查得一丝不苟。
        - id: ch01-b05
          speaker: history_professor
          text: 不要把眼睛死死粘在细节上。站远一点，你才能看清事情的全貌。
        - id: ch01-b06
          speaker: judy
          text: 你瞧，我们夹在化学和历史之间，掌帆时得多么小心。我还是喜欢历史课的办法。假如我说征服者威廉在1492年渡海，哥伦布在1100年、1066年，或者随便哪一年发现了美洲，教授只会把那当成不值一提的细节。上历史课，心里又安稳又轻松。化学课可没有这种感觉。
        - id: ch01-b07
          speaker: judy
          text: 第六节的铃已经响了。我得赶去实验室，看看酸、盐和碱那些小事。盐酸在我的化学围裙上烧了一个洞，足有盘子那么大。要是理论真管用，我拿浓氨水把洞中和掉，不就行了吗？
        - id: ch01-b08
          speaker: judy
          text: 下星期就考试，可谁怕呢？永远是你的，朱迪。
    - id: ch02
      title: 3月5日
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 3月5日，朱迪又写来一封信。
        - id: ch02-b02
          speaker: judy
          text: 三月的风正在刮，沉重的乌云铺满天空，还不停往前涌。松树上的乌鸦吵成一片。那叫声让人陶醉，又让人振奋，简直像在不停召唤我。我只想把书一合，翻过山坡，跑出去跟风赛跑。
        - id: ch02-b03
          speaker: judy
          text: 上星期六，我们跑了一场五英里的越野撒纸追踪赛，一路都是烂泥。三位姑娘带着大约一蒲式耳彩纸屑，扮成“狐狸”，比二十七名“猎人”早出发半小时。我也是猎人。八个人半路掉了队，最后只剩十九个。我们翻过山，穿过玉米地，又进了沼泽，只能从一个草墩跳到另一个草墩。当然，一半人都踩进水里，湿到了脚踝。踪迹老是断掉，我们光在沼泽里就耽误了二十五分钟。
        - id: ch02-b04
          speaker: judy
          text: 接着，我们又上山，穿过树林，还得钻进一扇谷仓窗户。门全锁着，窗户又高又小。这也叫公平吗？我们才不钻呢。大家绕过谷仓，在一处低棚顶通向篱笆顶的地方，又找到了纸屑。“狐狸”以为这下能困住我们，可我们偏偏识破了。
        - id: ch02-b05
          speaker: judy
          text: 前面还有两英里起伏的草地。彩纸屑越来越少，踪迹难找极了。规矩说两片纸最多隔六英尺，可那天的六英尺，是我见过最长的六英尺。我们不停地小跑了两个钟头，终于追进水晶泉农庄的厨房。姑娘们平时常坐雪橇或干草车去那里，吃鸡肉和华夫饼。三只“狐狸”正安安稳稳地吃牛奶、蜂蜜和饼干。她们根本没料到我们能追来，还以为我们会卡在谷仓窗户上。
        - id: ch02-b06
          speaker: judy
          text: 两边都说自己赢了。可我们在她们回到校园以前就抓住了她们，当然该算我们赢，对吧？反正，十九个人像一群蝗虫，呼啦一下占满了所有家具，吵着要蜂蜜。蜂蜜不够分，水晶泉太太就拿出草莓酱、上星期新做的枫糖浆，还有三大条黑面包。对了，“水晶泉太太”只是我们的爱称，她其实姓约翰逊。
        - id: ch02-b07
          speaker: judy
          text: 我们六点半才回学院，吃晚饭迟了半小时。大家衣服也不换，直接进餐厅，胃口一点儿没受影响。晚礼拜谁也没去，看看我们的靴子，就知道这个理由完全够用了。
        - id: ch02-b08
          speaker: judy
          text: 我还没告诉你考试结果。所有科目我都轻轻松松地过了。我现在摸到了诀窍，以后再也不会不及格。只是，因为一年级那可恶的拉丁文作文和几何，我大概不能以优等成绩毕业。可我不在乎。只要你快活，少点儿字母算啥？这可是引文，我最近在读英国古典名著。
        - id: ch02-b09
          speaker: judy
          text: 说到名著，你读过《哈姆雷特》吗？没读过就赶快读，实在好得不得了。我一直听人说莎士比亚，却不知道他真能写得这么好。从前我总怀疑，他主要是靠名声混日子。
        - id: ch02-b10
          speaker: judy
          text: 我刚学会读书时，发明过一个很美的游戏。每天晚上，我都把自己想成正在读的那本书里最重要的人物，就这样哄自己睡着。
        - id: ch02-b11
          speaker: judy
          text: 现在，我是奥菲利娅，而且是个非常明智的奥菲利娅。我一直逗哈姆雷特开心，疼他，也训他。他一感冒，我就叫他把脖子裹好。他已经完全不忧郁了。国王和王后都在一次海难中去世，连葬礼也省了。于是我和哈姆雷特轻轻松松地统治丹麦，把王国治理得好极了。他管政务，我管慈善。我才创办了几家第一流的孤儿院。
        - id: ch02-b12
          speaker: judy
          text: 如果你或其他董事想来参观，我很乐意带你们看看。你们准能得到不少有用的启发。谨此奉上，先生。您最仁慈的丹麦王后，奥菲利娅。
    - id: ch03
      title: 3月24日，也可能是25日
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 下一封信标着3月24日，朱迪又补了一句，也可能是25日。
        - id: ch03-b02
          speaker: judy
          text: 我看，我大概去不了天堂了。我在人间已经得到这么多好东西，来世还要再得一份，那也太不公平。快听听发生了什么吧。
          emotion: happy
        - id: ch03-b03
          speaker: judy
          text: 洁茹莎·艾博特赢了《月刊》一年一度的短篇小说比赛，奖金有二十五美元。她还只是二年级学生，参赛的却大多是四年级学生。我在公布的名单上看见自己的名字，几乎不敢相信。说不定，我到底还是能当作家。只可惜利佩特太太给了我这么个傻名字，听起来很像一个“女作家”的名字，是不是？
          emotion: surprised
        - id: ch03-b04
          speaker: judy
          text: 我还入选了春季戏剧演出。我们要在户外演《皆大欢喜》，我演的是罗瑟琳的亲表妹西莉娅。
        - id: ch03-b05
          speaker: judy
          text: 最后还有一件事。下星期五，朱莉娅、莎莉和我要去纽约买春装，住上一夜，第二天再跟“杰维少爷”去看戏，是他邀请我们的。朱莉娅回自己家住，莎莉和我住玛莎·华盛顿旅馆。还有比这更叫人兴奋的事吗？我一辈子没住过旅馆，也没进过真正的剧院。天主教堂有一回办庆典，请孤儿们看过节目，可那不算真正的戏。
        - id: ch03-b06
          speaker: judy
          text: 猜猜我们要看什么？是《哈姆雷特》！莎士比亚课上，我们足足学了四星期，我都已经会背了。
          emotion: happy
        - id: ch03-b07
          speaker: judy
          text: 这些好事一件接一件，我兴奋得几乎睡不着。再见，叔叔。这个世界真有意思。永远是你的，朱迪。
          emotion: happy
        - id: ch03-b08
          speaker: judy
          text: 又及，我刚刚看过日历，今天原来是28日。再补一笔，今天我见到一位电车售票员，一只眼睛棕色，一只眼睛蓝色。让他在侦探小说里当坏蛋，一定很合适吧？
    - id: ch04
      title: 4月7日
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 4月7日，从纽约回来以后，朱迪写道。
        - id: ch04-b02
          speaker: judy
          text: 天哪，纽约怎么会那么大？伍斯特跟它相比，简直算不了什么。你真的住在那一团纷乱里吗？我在那里只待了两天，就看得眼花缭乱，几个月大概都缓不过来。那些惊人的东西，我都不知道该从哪里讲起。不过你就住在那里，想必全都知道。
          emotion: surprised
        - id: ch04-b03
          speaker: judy
          text: 街道可真有意思，还有街上的人和两旁的商店。我从没见过橱窗里那些漂亮东西。看着看着，真想一辈子什么都不做，只管穿衣打扮。
        - id: ch04-b04
          speaker: judy
          text: 星期六上午，我跟莎莉、朱莉娅一起买东西。朱莉娅走进一家店，那是我见过最华丽的地方。墙壁又白又金，铺着蓝地毯，挂着蓝绸窗帘，摆着镀金椅子。一位漂亮极了的金发女士笑着来迎接我们。她穿一件拖地的黑绸长裙。我以为我们来作客，伸手就要跟她握手。后来才知道，我们只是来买帽子，至少朱莉娅是。她坐在镜子前，接连试了十二顶。每一顶都比上一顶漂亮，最后她把最好看的两顶全买了。
        - id: ch04-b05
          speaker: judy
          text: 坐在镜子前，看中哪顶帽子就买哪顶，完全不用先想价钱。人生最大的乐趣，恐怕也不过如此了。说真的，叔叔，约翰·格里尔孤儿院费尽耐心培养出来的坚忍品格，很快就会让纽约毁得干干净净。
        - id: ch04-b06
          speaker: judy
          text: 买完东西，我们到谢里餐厅跟杰维少爷会合。你大概去过那里吧？那就先想想谢里餐厅，再想想约翰·格里尔孤儿院的饭厅。那里的桌子铺油布，白瓷餐具怎么也摔不破，刀叉全是木柄。两边一比，你该明白我当时是什么滋味了。
        - id: ch04-b07
          speaker: judy
          text: 吃鱼时，我拿错了叉子。幸好侍者体贴地又递给我一把，谁也没有发现。
        - id: ch04-b08
          speaker: judy
          text: 午饭后，我们去了剧院。那里炫目、美妙，简直叫人不敢相信，我现在每天夜里都会梦见它。莎士比亚是不是太了不起了？《哈姆雷特》在舞台上演出来，比在课堂上一句句分析好看多了。我从前已经很喜欢它，可现在，哎呀！
          emotion: happy
        - id: ch04-b09
          speaker: judy
          text: 要是你不介意，我想我还是不当作家，改当演员吧。你肯让我离开学院，去戏剧学校吗？以后我每次登台，都给你留一张包厢票，还会隔着脚灯向你微笑。不过，你得在扣眼里插一朵红玫瑰，让我认准该向谁笑。万一挑错了人，那可太难为情了。
        - id: ch04-b10
          speaker: judy
          text: 星期六晚上，我们坐火车回来，晚饭就在车上吃。小桌上亮着粉红色的灯，还有黑人侍者为我们服务。我从不知道火车上也供应饭菜，一不留神就把这句话说了出来。
        - id: ch04-b11
          speaker: julia
          text: 你到底是在什么地方长大的？
          emotion: surprised
        - id: ch04-b12
          speaker: judy
          text: 我很温顺地告诉她，我是在一个小村子里长大的。
        - id: ch04-b13
          speaker: julia
          text: 可是，你从来没有出过远门吗？
          emotion: surprised
        - id: ch04-b14
          speaker: judy
          text: 我告诉她，来上大学以前，我从没出过远门。那一趟也只有一百六十英里，路上根本没吃饭。
        - id: ch04-b15
          speaker: judy
          text: 朱莉娅如今越来越留意我，因为我老是说出叫她觉得好笑的话。我明明很努力地不说，它们却总在我吃惊时自己蹦出来。偏偏我差不多一直都在吃惊。叔叔，一个人在约翰·格里尔孤儿院过了十八年，忽然被扔进这个大千世界，当然会头晕目眩。
        - id: ch04-b16
          speaker: judy
          text: 不过，我已经慢慢适应了。我不会再犯从前那些可怕的错误，跟别的姑娘相处也不觉得难受了。过去只要有人看我，我就浑身不自在，总觉得别人能透过我那套装样子的新衣服，一眼看见底下的格子布制服。现在，我不肯再为那格子布烦恼。昨天自有昨天的烦恼。
        - id: ch04-b17
          speaker: judy
          text: 对了，我忘了说鲜花。杰维少爷送给我们每人一大束紫罗兰和铃兰。他是不是很贴心？从那些董事看来，我过去并不太喜欢男人。现在，我可要改变看法了。
        - id: ch04-b18
          speaker: judy
          text: 十一页，这才叫一封信。鼓起勇气吧，我终于要停笔了。永远是你的，朱迪。
