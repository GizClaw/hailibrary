audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm, observant storytelling with a dry touch of humor
        timbre: clear and gently textured
        pace: measured and flowing
        pitch: medium
    jerusha:
      display_name: Jerusha Abbott
      tts:
        delivery: bright, quick, and candid, with feeling close to the surface
        timbre: youthful and clear
        pace: lively
        pitch: medium-high
  chapters:
    - id: ch01
      title: 27th May
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: May twenty-seventh.
        - id: ch01-b02
          speaker: jerusha
          text: >-
            Daddy-Long-Legs, Esquire. Dear Sir, I have received a letter from Mrs. Lippett. She hopes I am behaving well and doing well in my studies. Since I probably have nowhere to go this summer, she says I may return to the asylum and work for my board until college begins again.
        - id: ch01-b03
          speaker: jerusha
          text: >-
            I hate the John Grier Home. I would rather die than go back. Yours most truthfully, Jerusha Abbott.
          emotion: angry
        - id: ch01-b04
          speaker: jerusha
          text: >-
            Dear Daddy-Long-Legs, you are a brick! I am so happy about the farm because I have never been on one in my life, and I would hate to go back to John Grier and wash dishes all summer. Something dreadful might happen. I have lost my old humility, and I am afraid that one day I would burst out and smash every cup and saucer in the place.
          emotion: happy
        - id: ch01-b05
          speaker: jerusha
          text: >-
            Please forgive this short letter and the paper. I cannot send you any news because I am sitting in French class, and I am afraid Monsieur the Professor is about to call on me.
        - id: ch01-b06
          speaker: jerusha
          text: >-
            He did! Goodbye. I love you very much. Judy.
    - id: ch02
      title: 30th May
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: May thirtieth.
        - id: ch02-b02
          speaker: jerusha
          text: >-
            Dear Daddy-Long-Legs, have you ever seen this campus? That is only a rhetorical question, so please do not let it bother you. In May, this place is heavenly. Every shrub is blooming, and the trees are covered in the loveliest young green. Even the old pines look fresh and new. Yellow dandelions dot the grass, along with hundreds of girls in blue and white and pink dresses. Everyone feels joyful and free because vacation is coming. With that ahead of us, examinations hardly matter.
          emotion: happy
        - id: ch02-b03
          speaker: jerusha
          text: >-
            Isn't that a wonderful way to feel? Oh, Daddy, I am the happiest one of all! I am not in the asylum anymore. I am not anybody's nursemaid or typist or bookkeeper, which is what I would have become if not for you.
          emotion: happy
        - id: ch02-b04
          speaker: jerusha
          text: >-
            Now I am sorry for every bad thing I ever did. I am sorry I was rude to Mrs. Lippett. I am sorry I slapped Freddie Perkins, filled the sugar bowl with salt, and made faces behind the Trustees' backs.
        - id: ch02-b05
          speaker: jerusha
          text: >-
            I am going to be good and sweet and kind to everyone because I am so happy. This summer, I will write and write and write, and start becoming a great author. Isn't that a noble position to take? My beautiful character is developing! It droops a little in cold and frost, but grows very fast when the sun shines.
        - id: ch02-b06
          speaker: jerusha
          text: >-
            I think everyone is like that. I do not believe hardship, sorrow, and disappointment make people morally strong. Happy people are the ones overflowing with kindness. I have no faith in misanthropes. Fine word, isn't it? I just learned it. You are not a misanthrope, are you, Daddy?
        - id: ch02-b07
          speaker: jerusha
          text: >-
            I meant to tell you about the campus. I wish you would visit and let me guide you around. I would say, “That is the library. This is the gas plant, Daddy dear. The Gothic building on your left is the gymnasium, and the Tudor Romanesque one beside it is the new infirmary.”
        - id: ch02-b08
          speaker: jerusha
          text: >-
            I am very good at showing visitors around. I did it all my life at the asylum, and I have honestly been doing it all day here. And I showed a man around, too!
        - id: ch02-b09
          speaker: jerusha
          text: >-
            That was a great adventure. I had never talked to a man before, except for an occasional Trustee, and those do not count. Please forgive me, Daddy. I do not mean to hurt your feelings when I insult Trustees. You do not truly seem like one of them. You must have landed on the Board by accident. A proper Trustee is fat, pompous, and kindly. He pats you on the head and wears a gold watch chain.
        - id: ch02-b10
          speaker: jerusha
          text: >-
            My drawing looks like a June bug, but it is supposed to be a portrait of every Trustee except you.
        - id: ch02-b11
          speaker: jerusha
          text: >-
            But back to my story. I have been walking, talking, and taking tea with a man. A very superior man, too. His name is Mr. Jervis Pendleton, of the House of Julia. In other words, he is her uncle. Perhaps I should say “in longer words,” since he is as tall as you. He was in town on business and came out to the college to see his niece. He is her father's youngest brother, though she hardly knows him. Apparently, he looked at her when she was a baby, decided he did not like her, and has paid no attention to her since.
        - id: ch02-b12
          speaker: jerusha
          text: >-
            There he sat in the reception room, looking perfectly proper, with his hat, walking stick, and gloves beside him. Julia and Sallie both had last-period classes they could not miss. Julia rushed into my room and begged me to show him the campus, then bring him back when class ended. I agreed, though without much excitement, because I do not care for Pendletons.
        - id: ch02-b13
          speaker: jerusha
          text: >-
            But he turned out to be a sweet lamb. He is a real human being, not a Pendleton at all. We had a wonderful time. I have always wanted an uncle. Would you mind pretending to be mine? I think uncles are better than grandmothers.
        - id: ch02-b14
          speaker: jerusha
          text: >-
            Mr. Pendleton made me think of you, Daddy, as you must have been twenty years ago. You see, I know you very well, even though we have never met! He is tall and rather thin, with a dark face full of lines. He has the funniest hidden smile. It never quite appears, but it wrinkles the corners of his mouth. Right away, he makes you feel as if you have known him for years. He is wonderful company.
        - id: ch02-b15
          speaker: jerusha
          text: >-
            We walked from the quadrangle all the way to the athletic fields. Then he said he was growing weak and needed tea. He suggested the College Inn, just beyond the campus near the pine walk. I said we should go back for Julia and Sallie. He said too much tea made his nieces nervous, so we slipped away without them.
        - id: ch02-b16
          speaker: jerusha
          text: >-
            We sat at a little table on the balcony and had tea, muffins, marmalade, ice cream, and cake. The inn was conveniently empty because it was the end of the month and everyone's allowance was running low. We had the best time!
          emotion: happy
        - id: ch02-b17
          speaker: jerusha
          text: >-
            As soon as we returned, he had to race for his train. He hardly saw Julia at all. She was furious with me for carrying him off, because he is an unusually rich and desirable uncle. I was relieved to hear he was rich. All that tea and food cost sixty cents each.
        - id: ch02-b18
          speaker: jerusha
          text: >-
            This morning, which is Monday now, three boxes of chocolates arrived by express. One was for Julia, one for Sallie, and one for me. Imagine that! A man sent me candy.
          emotion: surprised
        - id: ch02-b19
          speaker: jerusha
          text: >-
            I am beginning to feel like a girl instead of a foundling. I wish you would come for tea someday, so I could find out whether I like you. Wouldn't it be dreadful if I did not? But I know I would. Very well! My compliments to you. I shall never forget you. Judy.
        - id: ch02-b20
          speaker: jerusha
          text: >-
            Postscript. I looked in the mirror this morning and discovered a completely new dimple that I had never seen before. It is very strange. Where do you suppose it came from?
    - id: ch03
      title: 9th June
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: June ninth.
        - id: ch03-b02
          speaker: jerusha
          text: >-
            Dear Daddy-Long-Legs, happy day! I have just finished my last examination, Physiology. And now I get three whole months on a farm!
          emotion: happy
        - id: ch03-b03
          speaker: jerusha
          text: >-
            I do not know what a farm is really like. I have never been on one, and I have only seen farms through a train window. But I know I am going to love it. Most of all, I am going to love being free.
        - id: ch03-b04
          speaker: jerusha
          text: >-
            I am still not used to being outside the John Grier Home. Whenever I remember, excited little thrills run up and down my back. I feel as if I ought to run faster and faster, looking over my shoulder to make sure Mrs. Lippett is not reaching out to drag me back.
        - id: ch03-b05
          speaker: jerusha
          text: >-
            I do not have to obey anyone this summer, do I? Your authority does not trouble me at all. You are much too far away to do any harm. As far as I am concerned, Mrs. Lippett is gone forever. And the Semples are not supposed to watch over my moral welfare, are they? No, I am sure they are not. I am completely grown up. Hooray!
          emotion: happy
        - id: ch03-b06
          speaker: jerusha
          text: >-
            I must leave you now. I have to pack one trunk and three boxes full of teakettles, dishes, sofa cushions, and books. Yours always, Judy.
        - id: ch03-b07
          speaker: jerusha
          text: >-
            Postscript. Here is my physiology examination. Do you think you could have passed it?
    - id: ch04
      title: Lock Willow Farm, Saturday Night
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: Lock Willow Farm. Saturday night.
        - id: ch04-b02
          speaker: jerusha
          text: >-
            Dearest Daddy-Long-Legs, I have only just arrived, and I have not even unpacked. But I cannot wait to tell you how much I like farms. This is a heavenly, heavenly, heavenly place!
          emotion: happy
        - id: ch04-b03
          speaker: jerusha
          text: >-
            The house is square, and it is old, perhaps a hundred years old. There is a veranda on the side that I cannot fit into my drawing, and a darling porch in front. My picture does not do it justice. Those shapes like feather dusters are maple trees. The prickly ones beside the drive are whispering pines and hemlocks. The house stands on top of a hill. From there, you can look across miles of green meadows to another row of hills.
        - id: ch04-b04
          speaker: jerusha
          text: >-
            Connecticut rolls along in a series of Marcelle waves, and Lock Willow Farm sits right on top of one. The barns once stood across the road and blocked the view. Then a kind flash of lightning came down from heaven and burned them up.
        - id: ch04-b05
          speaker: jerusha
          text: >-
            The people here are Mr. and Mrs. Semple, a hired girl, and two hired men. The hired workers eat in the kitchen. The Semples and Judy eat in the dining room. For supper, we had ham and eggs, biscuits, honey, jelly cake, pie, pickles, cheese, and tea, along with a great deal of conversation.
        - id: ch04-b06
          speaker: jerusha
          text: >-
            I have never been so entertaining in my life. Everything I say seems to make them laugh. I suppose that is because I have never lived in the country, and every question I ask shows how completely ignorant I am.
        - id: ch04-b07
          speaker: jerusha
          text: >-
            In my drawing, the room with a cross is not the scene of a murder. It is my room. It is large and square and almost empty, with lovely old-fashioned furniture. The windows have to be held open with sticks. The green shades have gold trim, and they tumble down if you touch them.
        - id: ch04-b08
          speaker: jerusha
          text: >-
            There is also a big square mahogany table. I mean to spend the summer sitting there with my elbows spread wide, writing a novel.
        - id: ch04-b09
          speaker: jerusha
          text: >-
            Oh, Daddy, I am so excited! I can hardly wait for daylight so I can explore. It is eight thirty now. I am about to blow out my candle and try to sleep. We get up at five. Have you ever heard of anything so much fun?
          emotion: happy
        - id: ch04-b10
          speaker: jerusha
          text: >-
            I cannot believe this is really Judy. You and the Good Lord have given me more than I deserve. I must become a very, very, very good person to repay you. I will. You will see.
        - id: ch04-b11
          speaker: jerusha
          text: >-
            Good night. Judy.
        - id: ch04-b12
          speaker: jerusha
          text: >-
            Postscript. You should hear the frogs singing and the little pigs squealing. And you should see the new moon! I saw it over my right shoulder.
