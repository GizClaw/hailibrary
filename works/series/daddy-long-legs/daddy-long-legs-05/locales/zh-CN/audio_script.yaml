audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 机敏而从容，带着温和的讽刺意味
        timbre: 温暖清亮
        pace: 舒缓而富有变化
        pitch: 中音
    jerusha_abbott:
      display_name: 杰鲁莎·艾博特
      tts:
        delivery: 聪敏直率，克制中透出活泼和想象力
        timbre: 清澈明亮的少女声线
        pace: 自然轻快，紧张时略快
        pitch: 中高音
  chapters:
    - id: ch01
      title: 五月二十七日：我宁可死也不回去
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 五月二十七日，朱迪先用“杰鲁莎·艾博特”这个名字，给长腿叔叔写了一封一本正经的信。
        - id: ch01-b02
          speaker: jerusha_abbott
          text: 长腿叔叔先生，尊敬的先生，我收到了利佩特太太的信。她希望我品行端正，功课也有长进。她还说，我暑假大概没地方可去，可以回孤儿院干活，用劳动抵偿食宿，一直等到大学开学。
        - id: ch01-b03
          speaker: jerusha_abbott
          text: 我恨约翰·格里尔孤儿院。我宁可死，也不回去。最最诚实的，杰鲁莎·艾博特。
          emotion: angry
        - id: ch01-b04
          speaker: narrator
          text: 农场的安排很快有了消息。朱迪正在上法语课，便赶紧又写了一封信。这回，她连英文和法文也兴冲冲地混在了一起。
        - id: ch01-b05
          speaker: jerusha_abbott
          text: 亲爱的长腿老爸，您真是个大好人！听说能去农场，我快活极了。我从来没在农场住过，也实在不愿回约翰·格里尔孤儿院，洗一整个夏天的盘子。真回去了，准会出可怕的事。我已经没有从前那么谦卑了，说不定哪天会突然发作，把所有杯子碟子全砸碎。
          emotion: happy
        - id: ch01-b06
          speaker: jerusha_abbott
          text: 请原谅，这封信很短，纸也不好。我正在上法语课，没法细说近况，而且教授先生好像马上就要点我。果然点了！再见，我非常爱您。朱迪。
    - id: ch02
      title: 五月三十日：一位真正的男士
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 五月三十日，校园正是一年里最美的时候。朱迪又提起笔，问了长腿叔叔一个根本不需要回答的问题。
        - id: ch02-b02
          speaker: jerusha_abbott
          text: 叔叔，您见过我们的校园吗？别担心，我不是当真要您回答，也不想用这个问题烦您。五月的校园就像天堂。灌木全开了花，树木披着最可爱的嫩绿，连那些老松树也显得又清新又年轻。草地上散着黄蒲公英，还走着成百上千个穿蓝裙、白裙、粉红裙的姑娘。假期快到了，人人看着都轻松快活。有这么好的事等在前面，考试也不值一提。
        - id: ch02-b03
          speaker: jerusha_abbott
          text: 我是所有人里最幸福的一个！我已经离开孤儿院，不必再给人当保姆、打字员或记账员了。要不是您，那原本就是我的将来。现在想想，以前做过的坏事，我全后悔了。我不该顶撞利佩特太太，不该打弗雷迪·珀金斯，不该往糖罐里装盐，也不该躲在理事背后扮鬼脸。
          emotion: happy
        - id: ch02-b04
          speaker: jerusha_abbott
          text: 往后我要对人人都温柔和善。今年夏天，我会一刻不停地写，开始向大作家的目标前进。我的品格也正越长越美呢。寒风霜冻一来，它会蔫一点，可太阳一照，立刻长得飞快。
        - id: ch02-b05
          speaker: jerusha_abbott
          text: 人其实都这样。我才不信逆境、悲伤和失望能使人的品格坚强。心里装满善意、满得快流出来的，明明都是幸福的人。我不信那些厌世者。这个词真漂亮，我刚学会。叔叔，您可不是厌世者吧？
        - id: ch02-b06
          speaker: jerusha_abbott
          text: 我原本是在说校园。真希望您来看看，让我带您四处参观。我会告诉您，那边是图书馆，这边是煤气厂，左手的哥特式建筑是体育馆，旁边的都铎罗曼式建筑是新医务室。带人参观，我可熟练了。在孤儿院做了一辈子，今天又在这里做了一整天。
        - id: ch02-b07
          speaker: jerusha_abbott
          text: 而且，今天让我带着参观的是一位男士！这是多了不起的经历。我以前从没跟男人聊过，偶尔见到的理事不算。叔叔，我说理事的坏话，不是故意要伤您的心。您不是真正的理事，只是不小心掉进理事会罢了。真正的理事又胖又气派，满脸慈爱，会拍拍人的头，还戴一条金表链。我给您画了一位。他看着像六月甲虫，可这幅画指的是除您之外的任何理事。
        - id: ch02-b08
          speaker: jerusha_abbott
          text: 还是回到正题吧。我跟一位非常出色的男士散了步，聊了天，还喝了茶。他就是朱莉娅家的杰维斯·彭德尔顿先生，简而言之，是她的叔叔。也许该说“长而言之”，因为他跟您一样高。他进城办事，顺路来看侄女。他虽是朱莉娅父亲最小的弟弟，两人却不熟。听说朱莉娅还是婴儿时，他看了一眼就不喜欢，从此再没理过她。
        - id: ch02-b09
          speaker: jerusha_abbott
          text: 我见到他时，他端端正正坐在会客室，帽子、手杖和手套都摆在一旁。朱莉娅和莎莉偏偏有第七节课，临时又逃不掉。朱莉娅冲进我房里，求我先带叔叔逛校园，等下课再把他送回来。我答应了，可并不热心，因为我向来不喜欢彭德尔顿家的人。
        - id: ch02-b10
          speaker: jerusha_abbott
          text: 没想到，他竟温顺得像只可爱的小羊。他是个真正有血有肉的人，一点也不像彭德尔顿家的人。我们相处得太愉快了！我盼一位叔叔，已经盼了很久。您愿不愿意假装成我的叔叔？我看叔叔比外祖母还好。
          emotion: happy
        - id: ch02-b11
          speaker: jerusha_abbott
          text: 彭德尔顿先生让我想到二十年前的您。别忘了，我们虽然没见过，我却熟悉您。他又高又瘦，脸色黝黑，满脸细纹，嘴角还藏着一种有趣的笑。那笑意从不完全露出来，只把嘴角挤出几道皱纹。他一见面就让人觉得，彼此仿佛认识了许多年。跟他待在一起很自在。
        - id: ch02-b12
          speaker: jerusha_abbott
          text: 我们从四方院走到运动场，把校园全逛了一遍。后来他说饿得发虚，非喝点茶不可，便提议去学院旅店。旅店就在校园外，沿着松林小径走过去便到。我说该回去找朱莉娅和莎莉，他却说，不能让侄女喝太多茶，免得神经紧张。于是我们偷偷溜了，在阳台上一张可爱的小桌旁，吃了茶、松饼、橘子酱、冰激凌和蛋糕。正好是月底，大家的零用钱都见了底，旅店空空的，方便极了。
        - id: ch02-b13
          speaker: jerusha_abbott
          text: 我们玩得痛快极了！可他刚回学校就得奔去赶火车，几乎连朱莉娅的面也没见着。朱莉娅怪我把人领跑了，气得不得了。原来，这位叔叔既格外富有，又格外值得讨好。知道他有钱，我总算放下心来，因为那顿茶点每个人足足花了六十美分。
        - id: ch02-b14
          speaker: jerusha_abbott
          text: 今天已经是星期一。早晨，快递送来了整整三盒巧克力，我、朱莉娅和莎莉一人一盒。叔叔，您觉得怎么样？我竟然收到一位男士送的糖果了！我开始觉得自己是个姑娘，不再只是个弃婴了。
          emotion: surprised
        - id: ch02-b15
          speaker: jerusha_abbott
          text: 真希望您哪天也来喝茶，让我亲眼看看自己到底喜不喜欢您。万一见了面，我发现自己不喜欢您，那可太糟了。不过，我心里知道自己一定会喜欢。好啦，谨向您致意。我永远不会忘记你。朱迪。
        - id: ch02-b16
          speaker: jerusha_abbott
          text: 又及。今天早晨照镜子时，我忽然发现脸上多了一个崭新的酒窝，从前从没见过。真是奇怪极了。叔叔，您猜它到底是从哪儿来的？
    - id: ch03
      title: 六月九日：自由就在前面
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 六月九日，朱迪终于考完了最后一门生理学。她一想到接下来的三个月，快乐得几乎坐不住。
        - id: ch03-b02
          speaker: jerusha_abbott
          text: 叔叔，今天真快活！最后一门考试结束了。现在，我要到农场住三个月！农场是什么样，我一点也不知道。这辈子没去过，除了隔着火车窗，也没真正看过。不过我知道，我一定会喜欢那里，更会喜欢自由。
          emotion: happy
        - id: ch03-b03
          speaker: jerusha_abbott
          text: 离开约翰·格里尔孤儿院这么久，我还是不习惯。一想到自己真的出来了，一阵阵兴奋就顺着后背跑。我总想越跑越快，还要不断回头，看看利佩特太太是不是伸着手臂追在后面，要把我抓回去。
        - id: ch03-b04
          speaker: jerusha_abbott
          text: 这个夏天，我谁的话也不用听，对不对？您只有名义上的权威，而且离得太远，伤不着我。对我来说，利佩特太太已经永远死了。森普尔夫妇也没有责任监管我的品行吧？当然没有。我已经完完全全长大了。万岁！
          emotion: happy
        - id: ch03-b05
          speaker: jerusha_abbott
          text: 先不陪您啦。我得装好一只衣箱，还有三箱茶壶、餐具、沙发靠垫和书。永远属于您的，朱迪。又及，这是我的生理学试卷。您觉得自己能考及格吗？
    - id: ch04
      title: 星期六晚上：洛克威洛农场
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 到了星期六晚上，朱迪已经站在洛克威洛农场了。行李还没有拆，她便迫不及待地写起信来。
        - id: ch04-b02
          speaker: jerusha_abbott
          text: 最亲爱的长腿叔叔，我才刚到，可一定得马上告诉您，我太喜欢农场了。这里简直是天堂、天堂、天堂！房子方方正正，已经有一百来年了。侧面有一条我画不出来的游廊，正面还有可爱的小门廊。我的画根本没画出它的美。那些像鸡毛掸子的是枫树，车道两旁刺刺的是低声絮语的松树和铁杉。房子站在山顶，越过一英里又一英里的绿草场，能一直望到另一列山。
          emotion: happy
        - id: ch04-b03
          speaker: jerusha_abbott
          text: 康涅狄格的土地一道接一道，像头发烫出的马塞尔式波浪。洛克威洛农场正好站在一道浪尖上。从前，谷仓盖在马路对面，把景色挡住了。幸好老天大发慈悲，降下一道闪电，把它们全烧了。
        - id: ch04-b04
          speaker: jerusha_abbott
          text: 这里有森普尔先生、森普尔太太，一个女佣和两个男长工。佣人在厨房吃饭，我们三个在餐厅吃。今晚有火腿、鸡蛋、烤饼、蜂蜜、果酱蛋糕、馅饼、腌菜、奶酪和茶，还有一大堆说不完的话。我从来没这么招人开心过。似乎不管说什么，大家都觉得有趣。大概因为我没来过乡下，每个问题后面都撑着一片无边无际的无知。
        - id: ch04-b05
          speaker: jerusha_abbott
          text: 我在画里给一个房间标了十字。别误会，那里没有发生过谋杀案，那是我的房间。它又大又方，空空荡荡，摆着可爱的老式家具。窗户要用木棍撑住，镶金边的绿色窗帘一碰就掉。房里还有一张方正的红木大桌子。整个夏天，我都要把胳膊肘摊在上面，写一部长篇小说。
        - id: ch04-b06
          speaker: jerusha_abbott
          text: 叔叔，我兴奋得等不到天亮，恨不得立刻出去探险。现在才八点半，我就要吹灭蜡烛，试着让自己睡觉了，因为这里的人早晨五点起床。您听说过这么好玩的事吗？我简直不敢相信，住在这里的这个人真是朱迪。您和仁慈的上帝给我的，远远超过我应得的。为了报答，我一定得做个非常、非常、非常好的人。我会做到的，您等着看。晚安。朱迪。
          emotion: happy
        - id: ch04-b07
          speaker: jerusha_abbott
          text: 又及。您真该听听青蛙唱歌、小猪尖叫，也该看看那弯新月！我从右肩上方看见了它。
