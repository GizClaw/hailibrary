audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 叙述者
      tts:
        delivery: 清楚沉静，简洁报出书信日期与场景转换
        timbre: 温暖清澈
        pace: 舒缓
        pitch: 中音
    judy:
      display_name: 朱迪
      tts:
        delivery: 聪敏直率，像把心事和见闻亲口讲给亲近的人
        timbre: 明亮自然的年轻女声
        pace: 轻快而富于变化，伤心时稍慢
        pitch: 中高音
  chapters:
    - id: ch01
      title: 9月26日：回到大学
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 9月26日，朱迪回到大学，成了高年级学生。她写信给长腿叔叔。
        - id: ch01-b02
          speaker: judy
          text: 亲爱的叔叔，今年的书房比去年还好，朝南，开着两扇大窗，家具又气派得不得了。朱莉娅的零用钱没有限额。她提前两天到校，一来就热火朝天地布置起屋子。
        - id: ch01-b03
          speaker: judy
          text: 我们换了墙纸，铺了东方地毯，还摆上了真正的桃花心木椅子。去年那种仿桃花心木已经让我们够开心了，今年竟然全是真货。屋子漂亮得耀眼，我却老觉得自己不该待在里面，生怕一不小心，把墨水滴在不该滴的地方。
        - id: ch01-b04
          speaker: judy
          text: 我还看见您的信正等着我。请原谅，我说错了，是您秘书的信。您能不能告诉我，我为什么不该接受奖学金？给我一个听得懂的理由就行。您的反对实在叫我摸不着头脑。可反对也没用了，我已经接受，而且绝不会改主意！这话好像有点无礼，不过我不是故意的。
        - id: ch01-b05
          speaker: judy
          text: 我猜你既然供我上学，就想把这件事从头做到尾，最后拿一张毕业文凭，规规矩矩地画上句号。可是，也请从我的立场想想。不管学费是不是全由您付，我受的教育都要归功于您，只是这样一来，我欠您的可以少一点。
        - id: ch01-b06
          speaker: judy
          text: 我知道您没打算让我还钱，但只要有可能，我自己一定会想还。拿到奖学金，还起来就容易得多。我原先以为余下一生都要拿来还债，现在只用半生就够啦。
        - id: ch01-b07
          speaker: judy
          text: 希望您能明白，别生气。每月的零用钱我还是会满心感激地收下。要跟得上朱莉娅和她那些家具，没零用钱可不行！真希望她从小喜欢的是朴素东西，要不然，别做我的室友也好。
        - id: ch01-b08
          speaker: judy
          text: 这封信本该写得长些，可我实在太忙了。四幅窗帘、三幅门帘都得缝边，幸亏您看不见我的针脚有多长。我还用牙粉擦黄铜书桌用具，费劲极了，又拿修指甲的小剪刀一点点锯挂画的铁丝。接着拆了整整四箱书，再把两大箱衣服收好。杰鲁莎·艾博特居然有两箱衣服，真叫人不敢相信，可她就是有！这些活儿还不是全部。每做一阵，我就要停下来欢迎一位返校的老朋友，前前后后足有五十位，而且每一位都亲爱得很。
        - id: ch01-b09
          speaker: judy
          text: 开学日可真快活！晚安，亲爱的叔叔。您的小鸡想自己扒土找食，请别生气。她正长成一只精力旺盛的小母鸡，咯咯叫起来很有主意，羽毛也漂亮极了。当然，这全是您的功劳。深深爱您的，朱迪。
    - id: ch02
      title: 9月30日：奖学金之争
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 9月30日，叔叔显然还没有放弃反对。朱迪又写了一封信。
        - id: ch02-b02
          speaker: judy
          text: 亲爱的叔叔，您还在念叨奖学金吗？我从没见过哪个男人像您这样固执、顽强、不讲理、死不松口，简直像斗牛犬咬住了东西，还怎么也不肯替别人想想。
        - id: ch02-b03
          speaker: judy
          text: 您说，不希望我接受陌生人的恩惠。陌生人！请问，您自己又算什么？全世界还有谁比您更让我陌生？我们要是在街上碰见，我根本认不出您。
        - id: ch02-b04
          speaker: judy
          text: 您要是肯做个头脑正常、通情达理的人，给小朱迪写些亲切鼓励、像父亲一样的信，偶尔来拍拍她的头，说一声她是个好姑娘，您心里很高兴，那她或许就不会在您年老时违抗您了。她本来是要做个孝顺女儿的，说不定连您最小的愿望也会听从。
        - id: ch02-b05
          speaker: judy
          text: 还说什么陌生人呢！史密斯先生，您自己明明住在玻璃房子里。再说，这不是谁施舍的恩惠，而是我靠用功挣来的奖品。如果没有学生的英文成绩好到配得上，委员会根本不会硬把奖学金发出去。有些年份，这份奖学金就是空着没人拿。
        - id: ch02-b06
          speaker: judy
          text: 可我为什么要跟男人讲道理？史密斯先生，男人这个性别根本不懂逻辑。要男人听话，只有两种办法，要么哄，要么惹他不高兴。我才不肯为了得到想要的东西去哄男人，所以只好让人不高兴了。
        - id: ch02-b07
          speaker: judy
          text: 先生，我不会放弃奖学金。您再闹下去，我连每月的零用钱也不收，宁可去给那些笨得要命的一年级学生补课，把自己累到神经衰弱。这就是我的最后通牒！
        - id: ch02-b08
          speaker: judy
          text: 还有，我想到了一个办法。您怕我拿走奖学金，会让别人失去读书的机会，那就把原来要花在我身上的钱拿出来，供约翰·格里尔孤儿院另一个小女孩上学。这个主意很好吧？不过叔叔，那个新来的姑娘，您爱供她读多少书都可以，可千万不许比喜欢我更喜欢她。
        - id: ch02-b09
          speaker: judy
          text: 我几乎没把您秘书在信里的劝告放在心上，希望他别因此伤心。可他真伤心了，我也没有办法。他是个被宠坏的孩子，叔叔。从前他有什么任性的要求，我总是温顺地让步。这一次可不同，我已经决定了，非坚持到底不可。此致，主意已经完全、永远、直到世界末日也绝不改变的杰鲁莎·艾博特。
    - id: ch03
      title: 11月9日：两件外套和圣诞邀请
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 11月9日，朱迪先讲起那天进城时遇到的麻烦。
        - id: ch03-b02
          speaker: judy
          text: 亲爱的长腿叔叔，我今天进城，打算买鞋油、几只衣领、一件新衬衫的料子、一罐紫罗兰香脂，还有一块卡斯蒂利亚香皂。全都是要紧东西，少一样我都没法再快活一天。可是上车付钱时，我才发现钱包还在另一件外套的口袋里。只好下车，等下一班车，体操课也迟到了。一个人没有记性，却偏偏有两件外套，真可怕！
        - id: ch03-b03
          speaker: judy
          text: 朱莉娅·彭德尔顿请我去她家过圣诞节。史密斯先生，您觉得怎么样？想想看，约翰·格里尔孤儿院的杰鲁莎·艾博特，竟然要坐到富人家的餐桌边。我也不知道她为什么请我，近来她好像越来越喜欢我了。
        - id: ch03-b04
          speaker: judy
          text: 说实话，我更想去萨莉家。可朱莉娅先邀请了我，所以真要出门，只能去纽约，不能去伍斯特。一想到一下子面对彭德尔顿全家人，我就有点发怵。那可不是只见朱莉娅一个人，而是他们全家一齐上场。况且去那种人家做客，还得添不少新衣服。亲爱的叔叔，如果您来信说，希望我安安静静留在大学，我一定拿出平日那副甜美温顺的样子，乖乖听话。
        - id: ch03-b05
          speaker: judy
          text: 我的零碎时间都拿来读《托马斯·赫胥黎的生平与书信》了，随手翻翻，真是又轻松又好懂。您知道始祖鸟是什么吗？是一种鸟。那楔齿兽呢？我自己也不清楚，猜它是遗失的环节，也许像长牙的鸟，或者有翅膀的蜥蜴。不对，两样都不是。我刚查了书，它是中生代的哺乳动物。
        - id: ch03-b06
          speaker: judy
          text: 我今年选了经济学，学起来真叫人大开眼界。等这门课读完，我还要接着选“慈善与改革”。到时候，理事先生，我就会清清楚楚地知道，一家孤儿院究竟该怎样管理。我要是能享有自己应有的权利，肯定会是个出色的选民。上星期我已经满二十一岁了。像我这么诚实、受过教育、认真负责又聪明的公民，这个国家竟然白白不用，真是浪费。永远属于您的，朱迪。
    - id: ch04
      title: 12月7日：创办人舞会
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 到了12月7日，长腿叔叔一直没有回绝圣诞邀请。朱迪便把沉默当成了许可。
        - id: ch04-b02
          speaker: judy
          text: 亲爱的叔叔，谢谢您准许我去朱莉娅家。近来我们的社交生活忙得人团团转！上星期是创办人舞会。只有高年级学生可以参加，所以我们今年才头一回获准出席。
        - id: ch04-b03
          speaker: judy
          text: 我邀请了吉米·麦克布赖德。萨莉请来他在普林斯顿的室友，就是去年夏天到他们营地做过客的红头发男生，人好得不得了。朱莉娅从纽约请来一位先生。他不怎么有趣，不过社会地位无可挑剔，还跟德拉马特·奇切斯特家有亲戚。也许您听了会明白什么，反正我一点也不明白。
        - id: ch04-b04
          speaker: judy
          text: 客人们星期五下午赶到，正好来得及在高年级学生走廊喝茶，接着又飞奔下山，赶到旅馆吃晚饭。那天旅馆挤得满满的。听男生们自己说，晚上他们只好一排排躺在台球桌上睡觉。吉米说，下一次要是再受邀来参加我们学校的社交活动，他一定从家里带上一顶阿迪朗达克帐篷，干脆搭在校园里。
        - id: ch04-b05
          speaker: judy
          text: 七点半，他们又回来参加校长招待会和舞会。我们这里的活动开始得真早！男宾的舞卡都事先填好了。每跳完一支舞，我们就按姓氏开头的字母把他们分好，留在对应的字母牌下面。下一位舞伴找起来就方便了。
        - id: ch04-b06
          speaker: judy
          text: 比如吉米·麦克布赖德，就该老实站在“M”下面等人认领。至少他应该这样。可他总是溜走，一会儿混进“R”堆，一会儿又跑到“S”堆，到处都有他。这位客人可真难照管。他只跟我跳了三支舞，便闹起别扭，说自己害羞，不好意思跟不认识的姑娘跳舞！
        - id: ch04-b07
          speaker: judy
          text: 第二天早上，我们听了合唱团音乐会。您猜猜，为音乐会新写的那首滑稽歌曲是谁作的？没错，就是她。叔叔，您那个小弃儿，现在可快成显赫人物了！
          emotion: happy
        - id: ch04-b08
          speaker: judy
          text: 总之，那两个热闹的日子好玩极了，男生们应该也很开心。有些人起初听说自己要面对一千个姑娘，着实慌了神，可他们适应得很快。我们请来的两位普林斯顿男生尤其快活，至少临走时，他们很有礼貌地这样告诉我们。他们还邀请我们明年春天去参加那边的舞会。我们三个已经答应了，所以亲爱的叔叔，这一次请别反对。
        - id: ch04-b09
          speaker: judy
          text: 我们三个都穿了新礼服。想听听是什么样吗？朱莉娅穿奶油色缎子，上面绣着金线，还戴了紫色兰花。那件礼服简直像一场梦，从巴黎来的，值整整一百万美元。
        - id: ch04-b10
          speaker: judy
          text: 萨莉那件是浅蓝色，镶着波斯刺绣，跟她的红头发配得漂亮极了。价钱没有一百万美元那么多，穿出来却一点不输给朱莉娅。
        - id: ch04-b11
          speaker: judy
          text: 我穿浅粉色双绉，配本色花边和玫瑰色缎子。手里还捧着J.麦克布赖德送的深红玫瑰。是萨莉告诉他该买什么颜色的。我们都有缎面舞鞋、丝袜，还有跟礼服相配的雪纺围巾。这些服饰细节一定让您印象深刻吧。
        - id: ch04-b12
          speaker: judy
          text: 叔叔，只要想想男人过的日子，我就忍不住替他们觉得苍白。雪纺、威尼斯花边、手工刺绣、爱尔兰钩针花边，在男人耳朵里只是几个空洞的词，听过也不会生出任何画面。女人可不同。她感兴趣的也许是婴儿，也许是微生物、丈夫、诗歌、仆人、平行四边形、花园、柏拉图或者桥牌，可不管她平日钻研什么，心里永远都会给衣服留个位置。
        - id: ch04-b13
          speaker: judy
          text: 正是这点共同的人性，让全世界成了一家人。这句话不是我想出来的，是从莎士比亚的一出戏里借来的。好了，说回正题。我要告诉您一个刚发现的秘密，您先答应不笑我虚荣。听好了，我很漂亮。
        - id: ch04-b14
          speaker: judy
          text: 真的。房间里有三面镜子，要是这样还看不出来，我才是个大傻瓜。一位朋友。又及，这是小说里常写的那种邪恶匿名信。
