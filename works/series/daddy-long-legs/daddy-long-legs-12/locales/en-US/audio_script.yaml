audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm, observant storytelling with a dry touch of humor
        timbre: clear and gently textured
        pace: measured and flowing
        pitch: medium
    jerusha:
      display_name: Jerusha Abbott
      tts:
        delivery: bright, quick, and candid, with feeling close to the surface
        timbre: youthful and clear
        pace: lively
        pitch: medium-high
  chapters:
    - id: ch01
      title: 26th September
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: September twenty-sixth.
        - id: ch01-b02
          speaker: jerusha
          text: >-
            Dear Daddy-Long-Legs, I'm back at college, and now I'm an upperclassman. Our study is better than ever. It faces south and has two enormous windows. And oh, the furniture! Julia arrived two days early with her unlimited allowance and came down with a fever for decorating.
        - id: ch01-b03
          speaker: jerusha
          text: >-
            We have new wallpaper, Oriental rugs, and mahogany chairs. They're real mahogany this time, not the painted kind that made us perfectly happy last year. The room is gorgeous, but I feel as if I don't belong in it. I'm always afraid I'll put an ink spot in the wrong place.
        - id: ch01-b04
          speaker: jerusha
          text: >-
            And Daddy, your letter was waiting for me. Excuse me. I mean your secretary's letter. Would you please give me one understandable reason why I shouldn't accept the scholarship? I don't understand your objection at all. It won't help to object anyway, because I've accepted it, and I won't change my mind. That sounds rather rude, but I don't mean it that way.
        - id: ch01-b05
          speaker: jerusha
          text: >-
            I suppose that since you began educating me, you want to finish the job and put a neat period at the end in the shape of a diploma. But please look at it from my side for a moment. I'll owe my education to you just as much as if you paid for all of it. I simply won't owe quite so much money.
        - id: ch01-b06
          speaker: jerusha
          text: >-
            I know you don't expect me to repay you. Even so, I'll want to do it if I possibly can, and this scholarship makes it much easier. I thought I'd spend the rest of my life paying my debts. Now it will only take half the rest of my life.
        - id: ch01-b07
          speaker: jerusha
          text: >-
            I hope you understand and won't be angry. I'll still accept my allowance very gratefully. It takes an allowance to keep up with Julia and her furniture. I only wish she'd been raised with simpler tastes, or that she weren't my roommate.
        - id: ch01-b08
          speaker: jerusha
          text: >-
            This isn't much of a letter. I meant to write a great deal, but I've been hemming four window curtains and three doorway curtains. Be glad you can't see my stitches. I've polished a brass desk set with tooth powder, which is very hard work, and cut picture wire with manicure scissors. I've unpacked four boxes of books, put away two trunks of clothes, and welcomed back fifty dear friends in between. It hardly seems possible that Jerusha Abbott owns two trunks full of clothes, but she does.
        - id: ch01-b09
          speaker: jerusha
          text: Opening day is such a happy occasion!
          emotion: happy
        - id: ch01-b10
          speaker: jerusha
          text: >-
            Good night, dear Daddy. Please don't be annoyed because your chick wants to scratch for herself. She's growing into a very energetic little hen, with a determined cluck and lots of beautiful feathers. Every feather is thanks to you. Affectionately, Judy.
    - id: ch02
      title: 30th September
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: September thirtieth.
        - id: ch02-b02
          speaker: jerusha
          text: >-
            Dear Daddy, are you still going on about that scholarship? I have never known a man so obstinate, stubborn, unreasonable, determined, bull-doggish, and completely unable to see anyone else's point of view.
          emotion: angry
        - id: ch02-b03
          speaker: jerusha
          text: >-
            You would rather I didn't accept favors from strangers. Strangers! And what, exactly, are you? Is there anyone in the world I know less? I wouldn't recognize you if we passed on the street.
        - id: ch02-b04
          speaker: jerusha
          text: >-
            If you'd been a sane, sensible person, you would have written your little Judy kind, encouraging, fatherly letters. You might have visited sometimes, patted her on the head, and told her you were glad she was such a good girl. Then perhaps she wouldn't defy you in your old age. She might have obeyed every tiny wish, like the dutiful daughter she was meant to be.
        - id: ch02-b05
          speaker: jerusha
          text: >-
            Strangers, indeed! You live in a glass house, Mr. Smith. Besides, the scholarship isn't a favor. It's more like a prize, and I earned it by working hard. If no one had done well enough in English, the committee wouldn't have given it at all. Some years, they don't.
        - id: ch02-b06
          speaker: jerusha
          text: >-
            But why argue with a man? Mr. Smith, men simply have no sense of logic. There are only two ways to bring a man around. You can coax him, or you can be disagreeable. I refuse to coax men to get what I want, so I must be disagreeable.
        - id: ch02-b07
          speaker: jerusha
          text: >-
            I will not give up the scholarship, sir. If you make any more fuss, I won't take the monthly allowance either. I'll wear myself into a nervous wreck tutoring stupid freshmen. That is my final answer!
          emotion: angry
        - id: ch02-b08
          speaker: jerusha
          text: >-
            And listen, I've thought of something else. You're afraid that by taking this scholarship, I'm keeping someone else from getting an education. There's an easy solution. Use the money you would have spent on me to educate another little girl from the John Grier Home. Isn't that a nice idea? Educate her as much as you like, Daddy. Only please don't like her more than you like me.
        - id: ch02-b09
          speaker: jerusha
          text: >-
            I hope your secretary won't be hurt because I've paid so little attention to the advice in his letter. I can't help it if he is. He's a spoiled child, Daddy. I've meekly given in to his wishes until now, but this time I mean to be firm.
        - id: ch02-b10
          speaker: jerusha
          text: >-
            Yours, with a mind completely, irrevocably, and forever made up, Jerusha Abbott.
    - id: ch03
      title: 9th November
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: November ninth.
        - id: ch03-b02
          speaker: jerusha
          text: >-
            Dear Daddy-Long-Legs, I went downtown today to buy shoe polish, collars, material for a new blouse, violet cream, and Castile soap. Every one of them was necessary. I couldn't have been happy for another day without them. But when I tried to pay my streetcar fare, I discovered that my purse was in my other coat. I had to get off, take the next car, and arrive late for gym.
        - id: ch03-b03
          speaker: jerusha
          text: It's dreadful to have no memory and two coats!
        - id: ch03-b04
          speaker: jerusha
          text: >-
            Julia Pendleton has invited me to spend Christmas vacation with her. What do you think of that, Mr. Smith? Just imagine Jerusha Abbott from the John Grier Home dining with rich people. I don't know why Julia wants me, though she does seem to be growing fond of me lately.
        - id: ch03-b05
          speaker: jerusha
          text: >-
            To tell the truth, I'd much rather go to Sallie's. But Julia invited me first, so if I go anywhere, it must be New York instead of Worcester. The thought of meeting all the Pendletons at once is rather frightening. And I would need a lot of new clothes. So, dear Daddy, if you write that you'd prefer me to stay quietly at college, I'll submit with my usual sweet obedience.
        - id: ch03-b06
          speaker: jerusha
          text: >-
            In odd moments, I've been reading The Life and Letters of Thomas Huxley. It's nice, light reading to pick up whenever I have time. Do you know what an Archaeopteryx is? It's a bird. And a Stereognathus? I'm not quite sure, but I think it's some kind of missing link, perhaps a bird with teeth or a lizard with wings.
        - id: ch03-b07
          speaker: jerusha
          text: >-
            No, it's neither one. I just checked the book. It's a Mesozoic mammal.
        - id: ch03-b08
          speaker: jerusha
          text: >-
            I'm taking economics this year, and it's very enlightening. After that, I plan to study Charity and Reform. Then, Mr. Trustee, I'll know exactly how an orphan asylum should be managed.
        - id: ch03-b09
          speaker: jerusha
          text: >-
            Wouldn't I make an excellent voter if I had the right? I turned twenty-one last week. What a wasteful country this is, throwing away an honest, educated, conscientious, intelligent citizen like me. Yours always, Judy.
    - id: ch04
      title: 7th December
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: December seventh.
        - id: ch04-b02
          speaker: jerusha
          text: >-
            Dear Daddy-Long-Legs, thank you for letting me visit Julia. I assume your silence means yes.
        - id: ch04-b03
          speaker: jerusha
          text: >-
            We've been swept up in such a whirl of society! The Founder's dance was last week. This was the first year any of us could go, because only upperclassmen are allowed.
        - id: ch04-b04
          speaker: jerusha
          text: >-
            I invited Jimmie McBride. Sallie invited his Princeton roommate, who stayed at their camp last summer. He's a very nice man with red hair. Julia brought a man from New York. He wasn't very exciting, but his social position was perfect. He's connected to the De la Mater Chichesters. Perhaps that tells you something. It tells me nothing at all.
        - id: ch04-b05
          speaker: jerusha
          text: >-
            Our guests arrived Friday afternoon in time for tea in the senior corridor. Then they rushed back to the hotel for dinner. The hotel was so crowded that they claim the men slept in rows on the billiard tables. Jimmie says that next time he's invited to a college event, he'll bring one of their Adirondack tents and put it up on campus.
        - id: ch04-b06
          speaker: jerusha
          text: >-
            At seven thirty, they returned for the president's reception and the dance. Our parties start early! We had already filled out the men's dance cards. After each dance, we left the men in groups beneath the first letter of their last names, ready for their next partners to find them.
        - id: ch04-b07
          speaker: jerusha
          text: >-
            Jimmie McBride, for instance, was supposed to wait patiently under M until someone claimed him. He should have waited patiently, but he kept wandering off and getting mixed in with the R's and S's and every other letter. He was a difficult guest. He sulked because he only got three dances with me, and said he was too shy to dance with girls he didn't know.
        - id: ch04-b08
          speaker: jerusha
          text: >-
            The next morning, we had a glee club concert. And who do you think wrote the funny new song for it? It's true. I did! Daddy, your little foundling is becoming quite an important person.
          emotion: happy
        - id: ch04-b09
          speaker: jerusha
          text: >-
            Anyway, those two lively days were great fun, and I think the men enjoyed themselves. Some were terribly nervous at first about facing a thousand girls, but they adjusted very quickly. Our two Princeton men had a wonderful time, or at least they politely said so. They've invited us to their dance next spring. We've accepted, so please don't object, dear Daddy.
        - id: ch04-b10
          speaker: jerusha
          text: >-
            Julia, Sallie, and I all had new dresses. Would you like to hear about them? Julia wore cream satin with gold embroidery and purple orchids. It was a dream. It came from Paris and cost a million dollars.
        - id: ch04-b11
          speaker: jerusha
          text: >-
            Sallie's dress was pale blue with Persian embroidery, and it looked beautiful with her red hair. It didn't cost quite a million, but it was every bit as striking as Julia's.
        - id: ch04-b12
          speaker: jerusha
          text: >-
            Mine was pale pink crepe de chine with ecru lace and rose-colored satin. I carried crimson roses from Jimmie. Sallie had told him which color to buy. We all wore satin slippers, silk stockings, and matching chiffon scarves.
        - id: ch04-b13
          speaker: jerusha
          text: >-
            You must be deeply impressed by all these fashion details. A man is forced to live such a colorless life. Chiffon, Venetian lace, hand embroidery, and Irish crochet are only empty words to him.
        - id: ch04-b14
          speaker: jerusha
          text: >-
            But a woman may care about babies, microbes, husbands, poetry, servants, parallelograms, gardens, Plato, or bridge. Underneath it all, she will always care about clothes. It's the one touch of nature that makes the whole world kin. I didn't invent that. I found it in one of Shakespeare's plays.
        - id: ch04-b15
          speaker: jerusha
          text: >-
            But back to my letter. Shall I tell you a secret I've just discovered? Will you promise not to think I'm vain? Then listen.
        - id: ch04-b16
          speaker: jerusha
          text: I'm pretty.
        - id: ch04-b17
          speaker: jerusha
          text: >-
            I truly am. I'd be a complete idiot not to know it when there are three mirrors in the room. A Friend.
        - id: ch04-b18
          speaker: jerusha
          text: >-
            Postscript. This is one of those wicked anonymous letters you read about in novels.
