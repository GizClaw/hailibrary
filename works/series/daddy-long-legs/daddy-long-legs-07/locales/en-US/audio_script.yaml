audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm, observant storytelling with a dry touch of humor
        timbre: clear and gently textured
        pace: measured and flowing
        pitch: medium
    jerusha:
      display_name: Jerusha Abbott
      tts:
        delivery: bright, quick, and candid, with feeling close to the surface
        timbre: youthful and clear
        pace: lively
        pitch: medium-high
  chapters:
    - id: ch01
      title: 17th October
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: October seventeenth.
        - id: ch01-b02
          speaker: jerusha
          text: >-
            Dear Daddy-Long-Legs, imagine filling the gymnasium swimming tank all the way up with lemon jelly. If someone tried to swim in it, would that person stay on top, or sink?
        - id: ch01-b03
          speaker: jerusha
          text: >-
            We were eating lemon jelly for dessert when that question came up. We argued about it for half an hour, and we still haven't settled it. Sallie says she could swim in the jelly. I am certain even the finest swimmer alive would go under. What a funny way to drown!
        - id: ch01-b04
          speaker: jerusha
          text: >-
            Two more problems have everyone at our table thinking. First, what shape are the rooms inside an octagonal house? Some girls insist they must be square, but I think each room would look like a slice of pie. Don't you?
        - id: ch01-b05
          speaker: jerusha
          text: >-
            Second, picture a huge hollow ball made entirely of mirror, with you sitting inside. At what point would the mirror stop showing your face and start showing your back? The longer you think about it, the more confusing it gets. So you see how deeply we spend our free time pondering philosophy!
        - id: ch01-b06
          speaker: jerusha
          text: >-
            Did I tell you about the election? It was three weeks ago, but life moves so quickly here that three weeks feels like ancient history. Sallie won. We celebrated with a torchlight parade, signs that read “McBride Forever,” and a fourteen-piece band made up of three mouth organs and eleven combs.
        - id: ch01-b07
          speaker: jerusha
          text: >-
            We are very important people in room 258 now. Julia and I get plenty of reflected glory. Living under the same roof as a president is quite a strain on one's social life.
        - id: ch01-b08
          speaker: jerusha
          text: >-
            Good night, dear Daddy. Please accept my compliments. Most respectfully, I remain your Judy.
    - id: ch02
      title: 12th November
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: November twelfth.
        - id: ch02-b02
          speaker: jerusha
          text: >-
            Dear Daddy-Long-Legs, yesterday we beat the freshmen at basketball. Naturally, we are delighted. But oh, if only we could beat the juniors! I would gladly be bruised from head to foot and spend a week in bed wrapped in witch hazel compresses.
        - id: ch02-b03
          speaker: jerusha
          text: >-
            Sallie has asked me to spend Christmas vacation with her in Worcester, Massachusetts. Wasn't that kind of her? I will love going. I have never stayed with a private family except at Lock Willow, and the Semples were old, grown-up people, so they hardly count.
        - id: ch02-b04
          speaker: jerusha
          text: >-
            The McBrides have a whole houseful of children, or at least two or three. They also have a mother, a father, a grandmother, and an Angora cat. It is a perfectly complete family! Packing a trunk and going somewhere is much more exciting than staying behind. I can hardly wait.
        - id: ch02-b05
          speaker: jerusha
          text: >-
            It is seventh hour, and I have to hurry to rehearsal. I am acting in the Thanksgiving play. I get to be a prince in a tower, wearing a velvet tunic and yellow curls. What fun! Yours, J. A.
    - id: ch03
      title: Saturday
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: Saturday.
        - id: ch03-b02
          speaker: jerusha
          text: >-
            Would you like to know what I look like? Here is a photograph Leonora Fenton took of the three of us.
        - id: ch03-b03
          speaker: jerusha
          text: >-
            The fair-haired girl laughing is Sallie. The tall girl with her nose in the air is Julia. And the small girl whose hair is blowing across her face is Judy. She is much prettier than the picture makes her look, but the sun was shining in her eyes.
    - id: ch04
      title: 31st December
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: Stone Gate, Worcester, Massachusetts. December thirty-first.
        - id: ch04-b02
          speaker: jerusha
          text: >-
            Dear Daddy-Long-Legs, I meant to thank you sooner for the Christmas check. But life with the McBride family keeps me so busy that I cannot find even two minutes in a row to sit at a desk.
        - id: ch04-b03
          speaker: jerusha
          text: >-
            I bought a new dress. I did not need it at all. I simply wanted it. This year my Christmas present came from Daddy-Long-Legs, while my family sent nothing but love.
        - id: ch04-b04
          speaker: jerusha
          text: >-
            My vacation with Sallie has been wonderful. Her family lives in a large, old-fashioned brick house with white trim, set well back from the street. When I lived at the John Grier Home, I used to stare at houses just like this and wonder what it might be like inside. I never dreamed I would see for myself, but here I am! Every room feels comfortable, peaceful, and homey. I wander through them all, taking in every piece of furniture.
        - id: ch04-b05
          speaker: jerusha
          text: >-
            It is the perfect place for children. There are dark little corners for hide-and-seek, open fireplaces for popping corn, and an attic where they can romp on rainy days. The banisters are slippery, with a nice flat knob waiting at the bottom. There is a huge sunny kitchen, too, and a cheerful, plump cook who has been with the family for thirteen years. She always saves a bit of dough for the children to bake. One look at this house makes you want to be a child again.
        - id: ch04-b06
          speaker: jerusha
          text: >-
            And the family! I never imagined a family could be so lovely. Sallie has a father, a mother, and a grandmother. She has the sweetest three-year-old sister, covered in curls, and a middle-sized brother who never remembers to wipe his feet. Then there is her handsome older brother, Jimmie, who is a junior at Princeton.
        - id: ch04-b07
          speaker: jerusha
          text: >-
            Meals are the most wonderful fun. Everyone laughs and jokes and talks at the same time, and no one makes us say grace first. After giving so many required thanks for every bite I ate, it is a relief not to thank Somebody for every mouthful. That may sound shocking, but you might feel the same way if you had thanked as often as I have.
        - id: ch04-b08
          speaker: jerusha
          text: >-
            We have done so much that I cannot tell you everything. Mr. McBride owns a factory, and on Christmas Eve he gave a tree for his workers' children. They held it in the long packing room, decorated with evergreen branches and holly. Jimmie dressed as Santa Claus, and Sallie and I helped hand out the presents.
        - id: ch04-b09
          speaker: jerusha
          text: >-
            Daddy, what a strange feeling that was! I felt as generous as one of the John Grier Home trustees. I kissed one sweet little boy with a sticky face, but I am fairly sure I did not pat a single child on the head.
        - id: ch04-b10
          speaker: jerusha
          text: >-
            Two days after Christmas, the McBrides gave a dance at their house for me.
        - id: ch04-b11
          speaker: jerusha
          text: >-
            It was the first real ball I had ever attended. College dances do not count, because we dance with other girls there. I wore a new white evening dress, which was your Christmas present, so thank you very much. I also had long white gloves and white satin slippers.
        - id: ch04-b12
          speaker: jerusha
          text: >-
            My happiness was perfect, complete, and absolute, except for one thing. Mrs. Lippett was not there to see me lead the cotillion with Jimmie McBride. The next time you visit the John Grier Home, please tell her all about it. Yours always, Judy Abbott.
        - id: ch04-b13
          speaker: jerusha
          text: >-
            Postscript. Daddy, would you be terribly disappointed if I did not become a Great Author after all, and turned out to be only a Plain Girl?
    - id: ch05
      title: 6.30, Saturday
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: Six thirty, Saturday.
        - id: ch05-b02
          speaker: jerusha
          text: >-
            Dear Daddy, we set out to walk into town today, but mercy, what a downpour! I prefer winter to behave like winter and give us snow instead of rain.
        - id: ch05-b03
          speaker: jerusha
          text: >-
            Julia's eligible uncle visited again this afternoon, and he brought five pounds of chocolates. As you can see, sharing a room with Julia does have its rewards.
        - id: ch05-b04
          speaker: jerusha
          text: >-
            Our innocent chatter seemed to entertain him, so he waited for a later train and joined us for tea in the study. Getting permission was a terrible struggle. Entertaining fathers and grandfathers is difficult enough. Uncles are even worse, and brothers and cousins are almost impossible.
        - id: ch05-b05
          speaker: jerusha
          text: >-
            Julia practically had to swear before a notary that he truly was her uncle and attach a certificate from the county clerk. Aren't you impressed by my knowledge of the law? Even then, I doubt we would have been allowed our tea if the dean had noticed how young and handsome Uncle Jervis is.
        - id: ch05-b06
          speaker: jerusha
          text: >-
            We did have tea, though, with brown-bread sandwiches filled with Swiss cheese. He helped us make them and ate four himself. When I told him I had spent the summer at Lock Willow, we had a lovely, gossipy talk about the Semples and all the horses, cows, and chickens.
        - id: ch05-b07
          speaker: jerusha
          text: >-
            Every horse he remembered is dead except Grover, who was only a colt when Jervis last visited. Poor old Grover can barely limp around the pasture now.
        - id: ch05-b08
          speaker: jerusha
          text: >-
            He asked whether they still keep doughnuts in a yellow crock, covered by a blue plate, on the pantry's bottom shelf. They do! Then he wanted to know whether there was still a woodchuck hole beneath the rocks in the night pasture. There is! This summer, Amasai caught a large, fat, gray woodchuck there. It must have been the twenty-fifth great-grandson of the one Master Jervis caught as a boy.
        - id: ch05-b09
          speaker: jerusha
          text: >-
            I actually called him “Master Jervie” to his face, and he did not seem offended. Julia says she has never seen him so friendly. Usually, he keeps everyone at a distance. But Julia has no tact at all, and I have discovered that men need a great deal of it. Stroke them the right way and they purr. Stroke them the wrong way and they spit. That is not a very elegant comparison, of course. I mean it figuratively.
        - id: ch05-b10
          speaker: jerusha
          text: >-
            We are reading Marie Bashkirtseff's journal. Can you believe this? She writes that one night she fell into such despair that she moaned and finally threw the dining-room clock into the sea.
        - id: ch05-b11
          speaker: jerusha
          text: >-
            That almost makes me hope I am not a genius. Living with one must be exhausting, and very hard on the furniture.
        - id: ch05-b12
          speaker: jerusha
          text: >-
            Mercy, the rain still will not stop. We may have to swim to chapel tonight. Yours always, Judy.
    - id: ch06
      title: 20th Jan.
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: January twentieth.
        - id: ch06-b02
          speaker: jerusha
          text: >-
            Dear Daddy-Long-Legs, did you ever have a darling baby daughter who was stolen from her cradle?
        - id: ch06-b03
          speaker: jerusha
          text: >-
            Perhaps I am that daughter! If this were a novel, that would be the grand revelation at the end, wouldn't it?
        - id: ch06-b04
          speaker: jerusha
          text: >-
            It is very strange not knowing what I am. It feels exciting and romantic, too, because anything is possible. Maybe I am not American. Plenty of people aren't. I might be descended directly from the ancient Romans. I might be a Viking's daughter. I could be the child of a Russian exile and belong in a Siberian prison. Or perhaps I am a Gypsy. I rather think I am. I certainly have a wandering spirit, though I have not had many chances to use it yet.
        - id: ch06-b05
          speaker: jerusha
          text: >-
            Do you know about the one dreadful stain on my record? I once ran away from the asylum after they punished me for stealing cookies. The whole story is written in the records for any trustee to read.
        - id: ch06-b06
          speaker: jerusha
          text: >-
            But honestly, Daddy, what did they expect? They put a hungry nine-year-old girl in the pantry to scour knives, left the cookie jar right beside her, and walked away. Then they suddenly came back. Of course they found crumbs on her!
        - id: ch06-b07
          speaker: jerusha
          text: >-
            Then they grabbed her by the elbow, boxed her ears, sent her away from the table just when the pudding arrived, and told every other child she was a thief. After all that, wouldn't you expect her to run away?
        - id: ch06-b08
          speaker: jerusha
          text: >-
            I only made it four miles. They caught me and took me back. Every day for a week, while the other children had recess, they tied me to a stake in the backyard like a badly behaved puppy.
        - id: ch06-b09
          speaker: jerusha
          text: >-
            Oh dear, there is the chapel bell. I have a committee meeting after chapel, too. I am sorry, because this time I meant to write you a very entertaining letter.
        - id: ch06-b10
          speaker: jerusha
          text: >-
            Until we meet again, dear Daddy. Peace be with you. Judy.
        - id: ch06-b11
          speaker: jerusha
          text: >-
            Postscript. There is one thing I know for certain. I am not Chinese.
