audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖从容地讲述，幽默处略带会意
        timbre: 清澈柔和，富有质感
        pace: 舒缓流畅
        pitch: 中音
    jerusha:
      display_name: 杰鲁莎·艾博特
      tts:
        delivery: 明快坦率，机灵活泼，情绪自然流露
        timbre: 年轻清亮
        pace: 轻快而有变化
        pitch: 中高音
  chapters:
    - id: ch01
      title: 十月十七日
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 十月十七日。
        - id: ch01-b02
          speaker: jerusha
          text: >-
            亲爱的长腿叔叔，您想想，要是把体育馆的游泳池灌满柠檬果冻，人跳进去以后，到底能浮在上面游，还是会沉下去？
        - id: ch01-b03
          speaker: jerusha
          text: >-
            我们吃甜点的时候正好吃到柠檬果冻，这个问题就冒出来了。大家争了整整半个钟头，还是谁也说服不了谁。莎莉说她准能游，我却认定，哪怕世上最会游泳的人也得沉底。淹死在柠檬果冻里，想起来多滑稽呀！
        - id: ch01-b04
          speaker: jerusha
          text: >-
            我们饭桌上还忙着研究两道难题。第一道，八角形房子的房间会是什么形状？有几个姑娘非说是方形，我看却只能像一块块切开的馅饼。您觉得呢？
        - id: ch01-b05
          speaker: jerusha
          text: >-
            第二道，想象一个巨大又空心的镜面圆球，您就坐在里面。镜子照到哪个地方，才会不再映出您的脸，开始映出您的后背？越往下想越糊涂。您现在知道了吧，我们用空闲时间思考的，可都是多么高深的哲学！
        - id: ch01-b06
          speaker: jerusha
          text: >-
            我说过选举的结果吗？事情才过去三个星期，可我们这里日子过得飞快，三个星期前已经像远古时代了。莎莉当选以后，我们举着火炬游行，灯牌上写着“麦克布赖德万岁”。乐队足足有十四件乐器，三只口琴，十一把梳子。
        - id: ch01-b07
          speaker: jerusha
          text: >-
            如今住在二五八号的都是要人。朱莉娅和我跟着沾了不少光。不过，跟班长住在一幢楼里，社交上的压力可真不小。
        - id: ch01-b08
          speaker: jerusha
          text: >-
            晚安，亲爱的叔叔。请接受我的问候。我怀着最崇高的敬意，永远是您的朱迪。
    - id: ch02
      title: 十一月十二日
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 十一月十二日。
        - id: ch02-b02
          speaker: jerusha
          text: >-
            亲爱的长腿叔叔，昨天打篮球，我们赢了一年级，当然开心得很。可要是能赢三年级，那才叫痛快！就算撞得从头到脚青一块紫一块，敷着金缕梅药膏在床上躺一个星期，我也愿意。
        - id: ch02-b03
          speaker: jerusha
          text: >-
            莎莉邀请我到马萨诸塞州的伍斯特，跟她一起过圣诞假期。她待我多好！我太想去了。除了洛克威洛，我一辈子从来没住进过一个真正的家庭。森普尔夫妇年纪大了，只有两个大人，当然不能算。
        - id: ch02-b04
          speaker: jerusha
          text: >-
            麦克布赖德家可不一样。那里有满屋子的孩子，至少也有两三个，有爸爸、妈妈和祖母，还有一只安哥拉猫，家庭成员一个不少！把自己的大箱子收拾好，再动身去别处过假期，总比独自留下有趣得多。我越想越兴奋，简直等不及了。
        - id: ch02-b05
          speaker: jerusha
          text: >-
            第七节课到了，我得跑去排练。感恩节演出里，我要扮一个困在塔楼里的王子，身上穿天鹅绒短上衣，头上戴金黄色卷发。是不是很好玩？您的杰·艾。
    - id: ch03
      title: 星期六
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 星期六。
        - id: ch03-b02
          speaker: jerusha
          text: >-
            您想看看我是什么模样吗？我寄上一张莉奥诺拉·芬顿拍的照片，我们三个都在里面。
        - id: ch03-b03
          speaker: jerusha
          text: >-
            那个浅色头发、笑得正欢的是莎莉。高个子、鼻子朝天的是朱莉娅。最小的那个，头发被风吹得遮住脸的，就是朱迪。其实她本人还要漂亮些，只是拍照时太阳正刺着她的眼睛。
    - id: ch04
      title: 十二月三十一日
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 马萨诸塞州伍斯特，石门宅。十二月三十一日。
        - id: ch04-b02
          speaker: jerusha
          text: >-
            亲爱的长腿叔叔，我早该写信谢谢您的圣诞支票。可是麦克布赖德家的日子太吸引人，我连坐在书桌前、安安静静待上两分钟都办不到。
        - id: ch04-b03
          speaker: jerusha
          text: >-
            我买了件新礼服。其实根本不需要，只是心里想要。今年的圣诞礼物是长腿叔叔给的，我的家人呢，只寄来了满满的爱。
        - id: ch04-b04
          speaker: jerusha
          text: >-
            在莎莉家过的这个假期，简直好得不能再好。她家是一幢老式大砖房，镶着白边，离街道远远的。我住在约翰·格里尔孤儿院时，常常好奇地望着这样的房子，猜里面究竟会是什么样。我从没想过自己真能亲眼看见，可现在，我就在里面！这里舒服、安静，到处都有家的味道。我从一间屋走到另一间屋，恨不得把每一样家具陈设都看进心里。
        - id: ch04-b05
          speaker: jerusha
          text: >-
            孩子住在这样的房子里，实在再合适不过。暗暗的角落能捉迷藏，敞开的壁炉能爆玉米花。雨天可以跑去阁楼尽情玩闹，楼梯扶手滑溜溜的，滑到底下正好停在一只舒服的扁圆头上。大厨房宽敞又明亮，还有一位胖胖的好厨娘，整个人也像阳光一样。她在这家住了十三年，每回做面食，都会特意留下一小块面团，让孩子们亲手烤着玩。只要看一眼这样的房子，就想从头再做一回孩子。
        - id: ch04-b06
          speaker: jerusha
          text: >-
            至于一家人，那就更美好了。我做梦也没想到，他们能这样可爱。莎莉有爸爸、妈妈和祖母，有一个满头卷发、甜极了的三岁小妹妹，还有一个个头不大不小、老是忘记擦鞋底的弟弟。她的大哥名叫吉米，长得高大英俊，正在普林斯顿念三年级。
        - id: ch04-b07
          speaker: jerusha
          text: >-
            饭桌上最好玩。大家同时说话，一起笑，一起开玩笑，而且饭前不用祷告。每吃一口东西，都不必向某一位道一次谢，真叫人松了一口气。我说这话也许算亵渎，可要是您像我一样，已经被迫道过那么多次谢，您也会这么想。
        - id: ch04-b08
          speaker: jerusha
          text: >-
            我们做过的事太多，根本讲不完。麦克布赖德先生有一家工厂。平安夜，他在长长的包装间里摆了一棵圣诞树，四周挂满常青枝和冬青，专门招待雇员家的孩子。吉米扮成圣诞老人，我和莎莉帮着把礼物送出去。
        - id: ch04-b09
          speaker: jerusha
          text: >-
            叔叔，那感觉真说不出的奇妙！我觉得自己简直和约翰·格里尔孤儿院的理事一样仁慈。我还亲了一个甜甜的、黏糊糊的小男孩。不过，我敢说自己没有拍任何一个孩子的头。
        - id: ch04-b10
          speaker: jerusha
          text: >-
            圣诞节过了两天，他们竟然在自己家里，专门为我一个人办了一场特别的舞会。
        - id: ch04-b11
          speaker: jerusha
          text: >-
            这才是我参加的第一场真正的舞会。大学里只有姑娘和姑娘跳，不能算。我穿上崭新的白色晚礼服，那是您的圣诞礼物，多谢啦。再戴上白色长手套，穿上白缎舞鞋，我的幸福真是完美、圆满、彻彻底底。唯一遗憾的，是利佩特太太没看见我和吉米·麦克布赖德领跳方阵舞。下回您去约翰·格里尔孤儿院，请讲给她听。
        - id: ch04-b12
          speaker: jerusha
          text: >-
            永远属于您的，朱迪·艾博特。又及，叔叔，要是我最后没有成为大作家，只做了一个普通姑娘，您会非常失望吗？
    - id: ch05
      title: 星期六六点半
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 星期六，六点半。
        - id: ch05-b02
          speaker: jerusha
          text: >-
            亲爱的叔叔，今天我们本想走路进城，谁知道雨泼下来一样大。冬天就该有冬天的样子，我宁可要雪，也不要雨。
        - id: ch05-b03
          speaker: jerusha
          text: >-
            朱莉娅那位很讨人喜欢的叔叔，下午又来看我们，还带来五磅巧克力。您看，跟朱莉娅同住确实有好处。
        - id: ch05-b04
          speaker: jerusha
          text: >-
            我们那些天真无邪的闲话好像把他逗乐了。他索性不坐原来那班火车，改等晚一班，好留下来在起居室喝茶。为了得到许可，我们可费尽力气。父亲和祖父已经不容易招待，叔叔还得再难一层，兄弟和堂表兄弟就几乎没门了。朱莉娅简直要当着公证人的面发誓，证明他确实是自己的叔叔，再附上县书记官的证书才算数。瞧，我是不是很懂法律？即使这样，要是院长碰巧看见杰维斯叔叔这么年轻英俊，我看这顿茶照样喝不成。
        - id: ch05-b05
          speaker: jerusha
          text: >-
            不管怎么说，我们到底喝上了茶，还做了黑面包夹瑞士奶酪的三明治。他也来帮忙，做好以后自己吃掉四个。我告诉他，去年夏天我住在洛克威洛。于是我们聊森普尔夫妇，聊马、奶牛和鸡，闲话说得痛快极了。他认识的那些马都不在了，只剩格罗弗。杰维斯叔叔上回去时，它还是小马驹，如今老得只能一瘸一拐地走过牧场。
        - id: ch05-b06
          speaker: jerusha
          text: >-
            他问我，食品柜最下面是不是还有那只黄色陶罐，上面盖着蓝盘子，里面总放着炸面圈。没错，还在那里！他又问，夜牧场的石堆底下还有没有土拨鼠洞。也有！今年夏天，阿马赛就在洞里捉到一只又大又肥的灰土拨鼠，据说是杰维少爷小时候捉到的那只的第二十五代玄孙。
        - id: ch05-b07
          speaker: jerusha
          text: >-
            我当面叫他“杰维少爷”，他一点儿没生气。朱莉娅说，从没见过他这样和气，平常总是很难接近。可朱莉娅根本不懂体贴人。我现在明白了，男人得顺着毛摸。摸对地方，他们会呼噜呼噜，摸得不对，他们就龇牙吐气。这个比方不太文雅，我只是打个比方而已。
        - id: ch05-b08
          speaker: jerusha
          text: >-
            我们正在读玛丽·巴什基尔采夫的日记，简直不可思议。听听这一段：“昨夜，一阵绝望忽然攫住了我，逼得我呻吟出声，最后竟把餐厅里的钟扔进了大海。”
        - id: ch05-b09
          speaker: jerusha
          text: >-
            看完以后，我差不多希望自己不是天才了。跟天才一起生活准会累得够呛，而且家具也太危险。天哪，雨还在下！今晚去礼拜堂，我们只怕真得游过去。永远属于您的，朱迪。
    - id: ch06
      title: 一月二十日
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: 一月二十日。
        - id: ch06-b02
          speaker: jerusha
          text: >-
            亲爱的长腿叔叔，您是不是曾经有个可爱的小女儿，在她还是婴儿的时候，有人从摇篮里把她偷走了？
        - id: ch06-b03
          speaker: jerusha
          text: >-
            没准我就是那个孩子！假如我们是在小说里，这不是正好用来揭开最后的谜底吗？
        - id: ch06-b04
          speaker: jerusha
          text: >-
            一个人连自己是什么来历都不知道，真是古怪，可又让人觉得刺激，还挺浪漫。摆在眼前的可能性实在太多了。也许我根本不是美国人，世界上不是美国人的人多着呢。我可能是古罗马人的直系后代，也可能是某个维京人的女儿。说不定我的父亲或母亲是俄国流亡者，那我照理该待在西伯利亚的监狱里。又或许我是吉卜赛人，我觉得这个可能最大。我天生有一颗非要到处漂泊的心，只是一直没有机会让这股性子好好发挥出来。
        - id: ch06-b05
          speaker: jerusha
          text: >-
            您知道我过去唯一那件不光彩的事吧？我因为偷饼干受了罚，就从孤儿院逃跑了。档案里写得清清楚楚，哪个理事想看都可以。可叔叔，您说这到底能怪谁？一个饿着肚子的九岁小姑娘，被派到食品储藏室里擦刀子，胳膊旁边偏偏就是饼干罐。大人把她独自留下，走开以后又突然闯回来，难道真没料到她嘴边会有几粒饼干屑？
        - id: ch06-b06
          speaker: jerusha
          text: >-
            接着，大人扯住她的胳膊肘，打她耳光。布丁端上桌时，不让她吃饭，还当着所有孩子的面说，她受罚是因为她是小偷。受了这些委屈，她怎么可能不逃跑呢？
        - id: ch06-b07
          speaker: jerusha
          text: >-
            其实我只跑了四英里。他们追上来，把我带回去。后来整整一个星期，别的孩子每天出去玩，我却像一只不听话的小狗，被拴在后院的木桩上。
        - id: ch06-b08
          speaker: jerusha
          text: >-
            哎呀，礼拜堂的钟响了。礼拜完我还要参加委员会会议。真可惜，我本来还想给您写一封特别有趣的信呢。
        - id: ch06-b09
          speaker: jerusha
          text: >-
            再见，亲爱的叔叔，愿平安与您同在。朱迪。又及，有件事我完全肯定，我不是中国人。
