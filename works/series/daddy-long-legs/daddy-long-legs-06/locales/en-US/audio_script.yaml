audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm, observant storytelling with a dry touch of humor
        timbre: clear and gently textured
        pace: measured and flowing
        pitch: medium
    jerusha:
      display_name: Jerusha Abbott
      tts:
        delivery: bright, quick, and candid, with feeling close to the surface
        timbre: youthful and clear
        pace: lively
        pitch: medium-high
  chapters:
    - id: ch01
      title: 12th July
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Lock Willow. July twelfth.
        - id: ch01-b02
          speaker: jerusha
          text: >-
            Dear Daddy-Long-Legs, how did your secretary know about Lock Willow? That is not a rhetorical question. I truly want to know. Just listen to this. Mr. Jervis Pendleton used to own the farm, and then he gave it to Mrs. Semple, who had been his nurse. Isn't that the funniest coincidence? She still calls him Master Jervie and tells me what a sweet little boy he was. She even keeps one of his baby curls in a box. It is red, or at least reddish!
        - id: ch01-b03
          speaker: jerusha
          text: >-
            The moment Mrs. Semple learned that I knew him, I rose tremendously in her opinion. At Lock Willow, knowing a Pendleton is the finest introduction anyone can have. And Master Jervis is the very best of the family. I am happy to report that Julia comes from an inferior branch.
        - id: ch01-b04
          speaker: jerusha
          text: >-
            This farm grows more entertaining every day. Yesterday I rode on a hay wagon. We have three large pigs and nine piglets, and you ought to watch them eat. They really are pigs! Then there are oceans of baby chickens, ducks, turkeys, and guinea fowl. Anyone who chooses a city when a farm is available must be mad.
        - id: ch01-b05
          speaker: jerusha
          text: >-
            Hunting for eggs is my daily job. Yesterday I was crawling across a beam in the barn loft toward a nest that the black hen had stolen. I fell off and scratched my knee. Mrs. Semple bandaged it with witch hazel, saying over and over, “Dear, dear! It feels like yesterday when Master Jervie fell from that very beam and scraped that very knee.”
        - id: ch01-b06
          speaker: jerusha
          text: >-
            Everything around us is beautiful. Below the farm are a valley and a river, with wooded hills all around. Far away stands one tall blue mountain. It looks as if it would melt in your mouth.
        - id: ch01-b07
          speaker: jerusha
          text: >-
            We churn butter twice each week. The cream stays in a stone springhouse, with the brook flowing underneath it. Some nearby farmers use separators, but we want nothing to do with those modern inventions. Setting the cream in pans takes more work, but the result is worth it.
        - id: ch01-b08
          speaker: jerusha
          text: >-
            We have six calves, and I named every one. Sylvia was born in the woods. Lesbia is named for Catullus's Lesbia. Then come Sallie, and Julia, who is a spotted creature of no particular description. The fifth is Judy, after me. The sixth is Daddy-Long-Legs. You do not mind, do you, Daddy? He is a pure Jersey with a lovely nature, and if you could see him, you would know exactly why the name fits.
        - id: ch01-b09
          speaker: jerusha
          text: >-
            I still have not begun my immortal novel. Farm life keeps me much too busy. Yours always, Judy.
        - id: ch01-b10
          speaker: jerusha
          text: >-
            Postscript. I have learned to make doughnuts.
        - id: ch01-b11
          speaker: jerusha
          text: >-
            Second postscript. If you ever raise chickens, I recommend Buff Orpingtons. They have no pinfeathers.
        - id: ch01-b12
          speaker: jerusha
          text: >-
            Third postscript. I wish I could send you some of the fresh butter I churned yesterday. I am becoming an excellent dairymaid!
        - id: ch01-b13
          speaker: jerusha
          text: >-
            Fourth postscript. Here is Miss Jerusha Abbott, the future great author, driving the cows home.
    - id: ch02
      title: Sunday
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: Sunday.
        - id: ch02-b02
          speaker: jerusha
          text: >-
            Dear Daddy-Long-Legs, something funny happened. Yesterday afternoon I began a letter to you, but I only got as far as “Dear Daddy-Long-Legs.” Then I remembered that I had promised to pick blackberries for supper, so I went away and left the paper on the table. When I came back today, what do you think was sitting right in the middle of the page? A real, living daddy-long-legs!
        - id: ch02-b03
          speaker: jerusha
          text: >-
            I lifted him very gently by one leg and put him out the window. I would never hurt one. They always make me think of you.
        - id: ch02-b04
          speaker: jerusha
          text: >-
            This morning we hitched up the spring wagon and drove to the Centre for church. It is a sweet little white wooden church with a steeple and three columns in front. They may be Doric, or they may be Ionic. I always confuse the two.
        - id: ch02-b05
          speaker: jerusha
          text: >-
            The sermon was pleasantly sleepy. Everyone waved palm-leaf fans and looked drowsy. Except for the minister, the only sound was the locusts buzzing in the trees outside. I did not wake until I found myself standing to sing the hymn. Then I was sorry I had missed the sermon. I would like to understand the mind of a man who chose a hymn like this.
        - id: ch02-b06
          speaker: jerusha
          text: >-
            “Come, leave your games and earthly toys, and join me in the joys of heaven. If not, dear friend, then one long farewell. I leave you here to sink to hell.”
        - id: ch02-b07
          speaker: jerusha
          text: >-
            I have discovered that discussing religion with the Semples is dangerous. Their idea of God came down to them unchanged from distant Puritan ancestors. He is narrow, unreasonable, unfair, mean, revengeful, and bigoted. Thank heaven no one handed me my God! I can imagine Him for myself. Mine is kind, sympathetic, imaginative, forgiving, and understanding. He also has a sense of humor.
        - id: ch02-b08
          speaker: jerusha
          text: >-
            I like the Semples enormously because the way they live is far better than what they believe. They are kinder than their own God. I told them that, and now they are terribly upset. They think I am blasphemous. I think they are. So we no longer talk about theology.
        - id: ch02-b09
          speaker: jerusha
          text: >-
            It is Sunday afternoon now. Amasai, our hired man, has just driven away with Carrie, our hired girl. He is freshly shaved and very red, wearing a purple tie and bright yellow buckskin gloves. Carrie has on a blue muslin dress and a large hat covered with red roses. Her hair is curled as tightly as it can be. Amasai spent the whole morning washing the buggy. Carrie claimed she stayed home from church to cook dinner, but she really stayed to iron that dress.
        - id: ch02-b10
          speaker: jerusha
          text: >-
            As soon as I finish this letter, I am settling down with a book I found in the attic. It is called On the Trail. Across the first page, in a funny little boy's handwriting, it says, “Jervis Pendleton. If this book should ever roam, box its ears and send it home.”
        - id: ch02-b11
          speaker: jerusha
          text: >-
            Jervie spent a summer here after an illness when he was about eleven, and he left the book behind. It was clearly well loved. His grimy fingerprints appear everywhere. In one corner of the attic I also found a water wheel, a windmill, and several bows and arrows.
        - id: ch02-b12
          speaker: jerusha
          text: >-
            Mrs. Semple talks about him so often that I am beginning to believe he is still here. Not the grown man with the silk hat and walking stick. I picture a pleasant, dirty boy with untidy hair, thundering up the stairs, leaving the screen doors open, and forever asking for cookies. If I know Mrs. Semple, he always got them. He sounds adventurous, brave, and honest. I am sorry he is a Pendleton. He deserved something better.
        - id: ch02-b13
          speaker: jerusha
          text: >-
            Tomorrow we begin threshing the oats. A steam engine and three extra men are coming.
        - id: ch02-b14
          speaker: jerusha
          text: >-
            I am sorry to report that Buttercup has behaved disgracefully. She is the spotted cow with one horn, and Lesbia's mother. Friday evening she got into the orchard and ate the fallen apples. She ate and ate until they went straight to her head. For two days she has been completely drunk! I promise that is the truth. Have you ever heard of such scandalous conduct?
        - id: ch02-b15
          speaker: jerusha
          text: >-
            Sir, I remain your affectionate orphan, Judy Abbott.
        - id: ch02-b16
          speaker: jerusha
          text: >-
            Postscript. There were Indians in chapter one and highwaymen in chapter two. I can hardly breathe. What could chapter three possibly hold? The front picture shows Red Hawk leaping twenty feet into the air and biting the dust. Aren't Judy and Jervie having a wonderful time?
    - id: ch03
      title: 15th September
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: September fifteenth.
        - id: ch03-b02
          speaker: jerusha
          text: >-
            Dear Daddy, yesterday they weighed me on the flour scales at the general store in the Comers. I have gained nine pounds! I heartily recommend Lock Willow as a health resort. Yours ever, Judy.
    - id: ch04
      title: A Sophomore
      blocks:
        - id: ch04-b01
          speaker: jerusha
          text: >-
            Dear Daddy-Long-Legs, look at me now. I am a Sophomore! I returned last Friday. I hated leaving Lock Willow, but I was glad to see the campus again. Coming back to a familiar place feels wonderful.
        - id: ch04-b02
          speaker: jerusha
          text: >-
            College is beginning to feel like home, and I no longer feel lost here. In fact, I am beginning to feel at home in the whole world. It is as if I truly belong, instead of having slipped inside only because people allowed me to.
        - id: ch04-b03
          speaker: jerusha
          text: >-
            I do not suppose you understand what I mean at all. Anyone important enough to be a Trustee could never quite know how the world feels to someone unimportant enough to be a foundling.
        - id: ch04-b04
          speaker: jerusha
          text: >-
            Now listen to this, Daddy. Can you guess who my roommates are? Sallie McBride and Julia Rutledge Pendleton. It is true! We share one study and have three small bedrooms. Voilà!
        - id: ch04-b05
          speaker: jerusha
          text: >-
            Sallie and I decided last spring that we wanted to live together. Then Julia decided she would stay with Sallie. I cannot imagine why, since those two are nothing alike. But Pendletons naturally dislike change and hold tightly to the old ways. Fine word for that: inimical!
        - id: ch04-b06
          speaker: jerusha
          text: >-
            Anyway, here we are. Think of it. Jerusha Abbott, recently of the John Grier Home for Orphans, is living with a Pendleton. This certainly is a democratic country.
        - id: ch04-b07
          speaker: jerusha
          text: >-
            Sallie is running for class president, and every sign says she will win. You should see the plotting around us. We have become real politicians! I am warning you, Daddy. Once women get our rights, you men will have to move quickly if you want to keep yours. The election is next Saturday. That evening we will hold a torchlight parade, no matter which side wins.
        - id: ch04-b08
          speaker: jerusha
          text: >-
            I have started chemistry, which is the strangest subject I have ever met. It uses molecules and atoms. Next month I may be able to tell you something more definite about them.
        - id: ch04-b09
          speaker: jerusha
          text: >-
            I am also taking argumentation and logic, the history of the entire world, the plays of William Shakespeare, and French. If this continues for a few more years, I may become quite intelligent.
        - id: ch04-b10
          speaker: jerusha
          text: >-
            I would have preferred economics to French, but I was afraid to risk it. If I did not take French again, the professor might refuse to pass me. I barely squeezed through the examination in June. I admit that my high school preparation was not very thorough.
        - id: ch04-b11
          speaker: jerusha
          text: >-
            One girl in our class speaks French as quickly as she speaks English. Her parents took her abroad when she was little, and she spent three years at a convent school. You can imagine how clever she seems beside the rest of us. To her, irregular verbs are toys.
        - id: ch04-b12
          speaker: jerusha
          text: >-
            Sometimes I wish my parents had tossed me into a French convent instead of a foundling asylum. No, I do not wish that at all! If they had, perhaps I would never have known you. I would rather know you than know French.
        - id: ch04-b13
          speaker: jerusha
          text: >-
            Goodbye, Daddy. I must go visit Harriet Martin. We will discuss our chemistry, and then I will casually offer a few thoughts about who ought to be our next president. Yours in politics, J. Abbott.
