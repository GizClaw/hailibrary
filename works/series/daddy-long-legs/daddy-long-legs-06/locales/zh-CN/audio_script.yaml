audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 机敏而从容，带着温和的讽刺意味
        timbre: 温暖清亮
        pace: 舒缓而富有变化
        pitch: 中音
    jerusha_abbott:
      display_name: 杰鲁莎·艾博特
      tts:
        delivery: 聪敏直率，克制中透出活泼和想象力
        timbre: 清澈明亮的少女声线
        pace: 自然轻快，紧张时略快
        pitch: 中高音
  chapters:
    - id: ch01
      title: 七月十二日：农场越来越有意思
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 七月十二日，朱迪还住在洛克威洛农场。一个奇妙的巧合让她满腹疑问，她立刻写信去问长腿叔叔。
        - id: ch01-b02
          speaker: jerusha_abbott
          text: 亲爱的长腿叔叔，您的秘书怎么会知道洛克威洛呢？这回我是真的想听回答，因为我好奇极了。原来农场以前是杰维斯·彭德尔顿先生的，后来他把它送给了小时候照料他的森普尔太太。世上会有这么巧的事吗？她现在还叫他“杰维少爷”，说起他小时候有多可爱就停不下来。她甚至收藏着他婴儿时的一绺卷发，那头发是红的，至少也有点红！
        - id: ch01-b03
          speaker: jerusha_abbott
          text: 自从森普尔太太知道我认识他，我在她心里的地位可高多了。在洛克威洛，只要认识一位彭德尔顿，就是最好的介绍。全家最出色的人当然是杰维斯少爷。我很高兴地宣布，朱莉娅属于比较次等的那一支。
        - id: ch01-b04
          speaker: jerusha_abbott
          text: 农场一天比一天好玩。昨天我坐上了运干草的车。这里有三头大猪、九只小猪，您真该看看它们吃东西，那才叫真正的猪呢！小鸡、小鸭、小火鸡和珍珠鸡更是多得像海。明明能住农场，却偏去城里生活，人一定是疯了。
        - id: ch01-b05
          speaker: jerusha_abbott
          text: 每天找鸡蛋归我管。昨天黑母鸡偷偷在谷仓阁楼里做了窝，我爬过横梁去找，结果掉了下来，膝盖也擦破了。森普尔太太用金缕梅药水替我包扎，嘴里不停念着：“哎呀，哎呀，仿佛就是昨天。杰维少爷也从这根横梁上摔下来，擦破的也是这个膝盖。”
        - id: ch01-b06
          speaker: jerusha_abbott
          text: 附近的风景实在美。有山谷，有河，有一座座长满树林的小山。很远很远的地方还有一座高高的蓝山，看起来柔美得会在嘴里融化。
        - id: ch01-b07
          speaker: jerusha_abbott
          text: 我们每星期搅两回黄油。奶油放在石砌的泉水房里，溪水正从屋子底下流过。附近有的农场用奶油分离机，可我们不爱那些新式东西。从浅盘里把奶油撇出来是费事些，味道却好得值得。这里还有六头小牛，名字都是我取的。
        - id: ch01-b08
          speaker: jerusha_abbott
          text: 第一头叫西尔维娅，因为她生在树林里。第二头叫莱斯比娅，名字来自卡图卢斯的诗。第三头是莎莉。第四头是朱莉娅，一头有斑点、说不清长成什么模样的家伙。第五头叫朱迪，跟我一样。第六头嘛，就叫长腿叔叔。您不会生气吧？他是纯种泽西牛，脾气温柔。您看看他的样子，就明白这名字多合适了。
        - id: ch01-b09
          speaker: jerusha_abbott
          text: 农场把我忙坏了，那部不朽的小说到现在还没有开头。永远属于您的，朱迪。
        - id: ch01-b10
          speaker: jerusha_abbott
          text: 又及，我学会做炸面圈了。再又及，如果您打算养鸡，我推荐浅黄色奥平顿鸡，它们没有讨厌的针羽。还有，我真想寄一块昨天亲手搅的新鲜黄油给您，我现在可是很棒的挤奶姑娘！最后一件事，这幅画里赶着奶牛回家的小姐，就是未来的大作家杰鲁莎·艾博特。
    - id: ch02
      title: 星期日：一只真正的长腿蜘蛛
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 到了星期日，朱迪又坐到桌前。前一天下午，她其实已经写过一个抬头，却被摘黑莓的约定叫走了。再次拿起信纸时，一个意外的访客正在纸上等她。
        - id: ch02-b02
          speaker: jerusha_abbott
          text: 亲爱的长腿叔叔，您说好不好笑？昨天我才写下“亲爱的长腿叔叔”，忽然想起答应过晚饭前去摘黑莓，只好把信留在桌上。今天回来一看，纸的正中央竟端端正正坐着一只货真价实的长腿蜘蛛！
          emotion: surprised
        - id: ch02-b03
          speaker: jerusha_abbott
          text: 我轻轻捏住它一条腿，把它送出了窗外。无论如何，我也不会伤害长腿蜘蛛。它们总叫我想到您。
        - id: ch02-b04
          speaker: jerusha_abbott
          text: 今早我们套好轻便马车，到村子中心做礼拜。那是一座小巧可爱的白色木教堂，有尖塔，门前还有三根多立克式圆柱。也许是爱奥尼式吧，我总是分不清。
        - id: ch02-b05
          speaker: jerusha_abbott
          text: 牧师的布道听起来正好催眠，大家也昏昏沉沉地摇着棕榈叶扇。除了牧师，只听得见外面树上的蝉在叫。我醒过来时，自己已经站着唱圣歌了。这下我倒很后悔没听布道，因为我真想研究一下，究竟怎样的人会挑中这么一首歌。
        - id: ch02-b06
          speaker: jerusha_abbott
          text: 歌里唱着：“快放下嬉戏与尘世玩具，随我同享那天国欢愉。否则，亲爱的朋友，永别了，我就此留下你沉入地狱。”
        - id: ch02-b07
          speaker: jerusha_abbott
          text: 我发现，跟森普尔夫妇谈宗教并不安全。他们从遥远的清教徒祖先那里原样继承了一位上帝。这位神心胸狭窄，不讲道理，有失公允，刻薄、记仇，还顽固不化。谢天谢地，我不必从谁那里继承上帝！我可以自己想象他。我心里的上帝仁慈，懂得同情，有想象力，能够宽恕，也善解人意。他还懂幽默。
        - id: ch02-b08
          speaker: jerusha_abbott
          text: 我非常喜欢森普尔夫妇，因为他们做的远比信奉的道理高明。他们比自己的上帝还好。我把这句话告诉他们，两个人却吓坏了。他们说我亵渎上帝，可在我看来，明明是他们在亵渎。如今，我们已经不谈神学了。
        - id: ch02-b09
          speaker: narrator
          text: 那是一个星期日下午。窗外有人精心打扮，正准备驾车出门。
        - id: ch02-b10
          speaker: jerusha_abbott
          text: 男长工阿马赛系着紫领带，戴着鲜黄的鹿皮手套，脸刮得干干净净，红得发亮。他刚驾车带女佣凯丽走了。凯丽戴一顶缀满红玫瑰的大帽子，身上是蓝色细棉布裙，头发卷得不能再卷。阿马赛洗了一上午马车。凯丽呢，嘴上说留在家里做午饭，所以没去教堂，其实是为了熨那条裙子。
        - id: ch02-b11
          speaker: jerusha_abbott
          text: 写完信，我要好好读一本从阁楼里找到的书，名字叫《在路上》。扉页上歪歪扭扭写着几行小孩子的字：“杰维斯·彭德尔顿。若是此书离家游荡，揪住耳朵送还原乡。”
        - id: ch02-b12
          speaker: jerusha_abbott
          text: 他十一岁左右生过一场病，病好后在这里过了一夏天，把这本书留了下来。书显然看过许多次，到处都有他脏兮兮的小手印。阁楼角落里还放着水车、风车和几副弓箭。森普尔太太天天说起他，说得我几乎相信那个孩子还住在这里。
        - id: ch02-b13
          speaker: jerusha_abbott
          text: 我想到的不是那个戴礼帽、拄手杖的大人，而是一个可爱的小男孩。他浑身脏兮兮，头发乱蓬蓬，咚咚咚地跑上楼，闹出吓人的声音。他总忘记关纱门，还不停地讨饼干。要是我了解森普尔太太，他当然每次都能讨到。他似乎从小就爱冒险，又勇敢，又诚实。可惜他偏偏姓彭德尔顿，他本来配得上更好的姓。
        - id: ch02-b14
          speaker: jerusha_abbott
          text: 明天要给燕麦脱粒，会来一台蒸汽机，还要多来三个帮工。
        - id: ch02-b15
          speaker: jerusha_abbott
          text: 还有一件事，我怀着悲痛的心情告诉您，毛茛做了非常丢脸的事。她就是那头只有一只角的花奶牛，也是莱斯比娅的妈妈。星期五晚上，她钻进果园，把树下的苹果一个接一个吃下去，吃到酒劲冲上了头。她整整醉了两天，醉得人事不省！这可全是真的。您听过这么不像话的事吗？
          emotion: surprised
        - id: ch02-b16
          speaker: jerusha_abbott
          text: 先生，谨此致意。您深情的孤儿，朱迪·艾博特。
        - id: ch02-b17
          speaker: jerusha_abbott
          text: 又及，《在路上》第一章写印第安人，第二章写拦路强盗。我正屏住呼吸等着，第三章会有什么呢？卷首插图画着：“红鹰腾空跃起二十英尺，一头栽倒在尘土中。”朱迪和杰维玩得可真开心！
          emotion: happy
    - id: ch03
      title: 九月十五日：洛克威洛疗养胜地
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 九月十五日，朱迪从洛克威洛寄出一封短得不能再短的健康报告。
        - id: ch03-b02
          speaker: jerusha_abbott
          text: 亲爱的叔叔，昨天我在科默斯的杂货店里站上面粉秤，发现自己足足长了九磅！我愿意向您推荐洛克威洛，把这里当作疗养胜地。永远属于您的，朱迪。
          emotion: happy
    - id: ch04
      title: 二年级学生朱迪
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 暑假结束了。朱迪在星期五回到学校，舍不得离开洛克威洛，却也很高兴再次看见熟悉的校园。她一坐定，就把这种回家的感觉写给长腿叔叔。
        - id: ch04-b02
          speaker: jerusha_abbott
          text: 亲爱的长腿叔叔，看看我吧，我已经是二年级学生了！回到熟悉的地方，感觉真舒服。大学渐渐像我的家，我也越来越有把握应付眼前的一切。甚至整个世界都开始像我的家了。我好像真的属于这里，不再是靠着别人勉强容忍，才偷偷溜进来的人。
          emotion: happy
        - id: ch04-b03
          speaker: jerusha_abbott
          text: 我想您根本不会明白。您重要得能当理事，哪里体会得到一个渺小得只能做弃婴的人是什么心情。
        - id: ch04-b04
          speaker: jerusha_abbott
          text: 现在请听好。猜猜谁跟我同住？莎莉·麦克布赖德，还有朱莉娅·拉特利奇·彭德尔顿。真的！我们共用一间起居室，每个人还有一间小卧室。瞧吧！
          emotion: surprised
        - id: ch04-b05
          speaker: jerusha_abbott
          text: 去年春天，莎莉和我已经说好住在一起。朱莉娅却决定跟着莎莉。我真不懂为什么，她们一点也不像。不过彭德尔顿家天生守旧，对变化充满敌意。这个词真漂亮！总之，我们现在住到了一起。您想想，刚从约翰·格里尔孤儿院出来不久的杰鲁莎·艾博特，居然跟一个彭德尔顿同住。这里果然是民主国家。
        - id: ch04-b06
          speaker: jerusha_abbott
          text: 莎莉正在竞选班长。照现在的种种迹象，她一定会赢。学校里到处都有竞选谋划，您真该看看我们这些政客有多老练。叔叔，等女人争取到自己的权利，你们男人可要当心了，得打起精神才能保住你们的权利。下星期六投票，不管谁获胜，晚上我们都要举行火炬游行。
        - id: ch04-b07
          speaker: jerusha_abbott
          text: 我开始学化学了，这门学问真特别，从前从没见过这样的东西。它拿分子和原子当材料。等到下个月，我大概就能把它们讲得更明白。
        - id: ch04-b08
          speaker: jerusha_abbott
          text: 我还选了辩论与逻辑、世界通史、威廉·莎士比亚戏剧，还有法语。照这样再学几年，我会变得相当聪明。
        - id: ch04-b09
          speaker: jerusha_abbott
          text: 其实我更想选经济学，可我没敢放下法语。要是不再选，教授也许不会让我及格。即使这样，我六月考试也只是勉强挤过去。不过我的中学基础确实不够好，这一点我得承认。
        - id: ch04-b10
          speaker: jerusha_abbott
          text: 班里有个姑娘，法语说得跟英语一样快，叽叽呱呱没个停。她小时候随父母去过国外，在一所修道院学校读了三年。您可以想象，她比我们其他人聪明多少。不规则动词在她手里，只是随便摆弄的玩意儿。
        - id: ch04-b11
          speaker: jerusha_abbott
          text: 我真希望小时候父母把我扔进法国修道院，而不是弃婴院。不对，我一点也不希望！那样我也许永远不会认识您。比起会说法语，我还是宁可认识您。
        - id: ch04-b12
          speaker: jerusha_abbott
          text: 再见，叔叔。现在我得去拜访哈丽雅特·马丁了。我们先讨论化学上的情况，再假装随口说起下一任班长。您政治上的盟友，杰·艾博特。
