audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 沉静清楚，像在翻阅一叠按日期排好的旧信
        timbre: 温暖清澈
        pace: 舒缓
        pitch: 中
    judy:
      display_name: 朱迪
      tts:
        delivery: 聪敏坦率，情绪鲜活，玩笑里带着少女的真心
        timbre: 明亮柔和
        pace: 自然轻快，动情处放慢
        pitch: 中高
    butler:
      display_name: 男管家
      tts:
        delivery: 亲切谨慎，带着忠厚老人的关怀
        timbre: 温和醇厚
        pace: 从容
        pitch: 中低
    jervie:
      display_name: 杰维
      tts:
        delivery: 病后虚弱却温柔含笑
        timbre: 清朗微哑
        pace: 缓慢
        pitch: 中低
  chapters:
    - id: ch01
      title: "8月27日"
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 8月27日，朱迪从洛克柳庄园写信给长腿叔叔。
        - id: ch01-b02
          speaker: judy
          text: 亲爱的长腿叔叔，您现在究竟在哪儿？我永远猜不到您正在世界的哪一边。天气坏成这样，但愿您没留在纽约。最好正站在一座近些的山峰上，看着雪，也想着我。不过别远在瑞士，请挑个近些的地方。请您一定想想我。我实在很寂寞，真想有人惦记。叔叔，我要是认识您该多好。等我们谁不快活了，就能给对方打气。
        - id: ch01-b03
          speaker: judy
          text: 洛克柳庄园我大概再也待不下去了，我想搬去波士顿。莎莉明年冬天要在那里做贫民区的社会服务，我可以跟她合租一间画室。白天她忙她的，我写我的，晚上我们还能作伴。这里只有森普尔夫妇、凯莉和阿马赛，夜晚长得没完没了。不过我知道，您一定不赞成。您秘书会写什么，我连语气都猜得出来。杰鲁莎·艾博特小姐，尊敬的女士，史密斯先生希望您继续留在洛克柳庄园。您忠实的，埃尔默·H·格里格斯。
        - id: ch01-b04
          speaker: judy
          text: 我讨厌您的秘书。叫这个名字的人，肯定讨厌透顶。可我说真的，叔叔，我非去波士顿不可。再不发生点什么，我绝望起来，准会跳进青贮窖。这里热得要命，草晒焦了，小溪干了，路上全是灰。雨已经好多个星期没下了。
        - id: ch01-b05
          speaker: judy
          text: 这封信听起来活像我得了恐水病，可我没有病。我只是太想拥有一个家，想有几个真正属于自己的家人。再见，我最亲爱的叔叔。我真希望能认识您。朱迪。
    - id: ch02
      title: "9月19日"
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 9月19日，朱迪又从洛克柳庄园寄出一封短信。
        - id: ch02-b02
          speaker: judy
          text: 亲爱的叔叔，出了一件事，我需要您指点。我不想听世上任何别人的话，只想听您的。能让我见您一面吗？有些话，说出来比写下来容易得多。何况这封信还可能被您的秘书拆开。朱迪。
        - id: ch02-b03
          speaker: judy
          text: 又及，我现在非常难过。
          emotion: sad
    - id: ch03
      title: "10月3日"
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 10月3日，叔叔亲笔写来的便条到了。
        - id: ch03-b02
          speaker: judy
          text: 亲爱的长腿叔叔，您那张字迹歪歪扭扭的便条，今天早晨送到了。听说您病了，我真难过。早知道的话，我绝不会拿自己的事情烦您。好吧，我会把烦恼说出来，可这件事很复杂，也非常隐私。请您看完就把信烧掉，千万别留下。
        - id: ch03-b03
          speaker: judy
          text: 说正事以前，先收下这张一千美元的支票。由我给您寄钱，听着真奇怪，是不是？您猜我是从哪儿得到的？叔叔，我的小说卖出去了！它会先分七期连载，接着出版成书。可我没有欣喜若狂，反倒整个人都麻木了。能开始还钱，我当然高兴。我还欠您两千多美元，稿酬会一笔一笔分期付给我。请别故意为难，不肯把钱收下。这笔钱还给您，我才会快活。我欠您的远远不只钱，剩下的，我会用一辈子的感激和爱慢慢偿还。
        - id: ch03-b04
          speaker: judy
          text: 现在说另一件事。请您用最懂人情世故的眼光替我想一想，答案中不中听都没有关系。您知道，我对您的感情一向很特别，因为您差不多就是我的整个家。可我对另一个男人，有一种更特别得多的感情。您不会介意吧？那个人是谁，您多半早就猜到了。这么久以来，我的信里到处都有杰维少爷。
        - id: ch03-b05
          speaker: judy
          text: 我多希望您能明白他是什么样的人，也明白我们有多么合拍。我们对所有事情的看法都一样。说不定，是我总把自己的想法悄悄改成和他一样！可他几乎永远是对的。他比我多活了十四年，也该比我懂得多。偏偏在别的事情上，他又只是个长得太大的男孩，连下雨要穿胶鞋都不明白，非得有人照看。最要紧的是，同一件事总能把我们两个人逗笑。要是两个人的幽默感互相打架，那道沟恐怕永远也跨不过去。
        - id: ch03-b06
          speaker: judy
          text: 至于他到底好在哪里，我也说不清。他就是他。我想他，想他，还是想他。没有他，整个世界空荡荡的，连空气都叫人心疼。月光越美，我越讨厌，因为他不在这里陪我看。也许您也爱过一个人，所以您会懂。要是爱过，我不用再说。要是没爱过，我说了也没有用。
          emotion: sad
        - id: ch03-b07
          speaker: judy
          text: 可我偏偏拒绝嫁给他了。我没告诉他为什么，只是难过得发不出声音，一个字也想不到。于是他走了，以为我想嫁给吉米·麦克布赖德。我根本不想嫁给吉米，他还没真正长大呢。杰维少爷和我被误会缠成了一团，两个人都伤了心。我叫他离开，不是因为不爱他，恰恰是因为太爱。我怕他以后会后悔，那是我无论如何也受不了的。
        - id: ch03-b08
          speaker: judy
          text: 我这样一个连来历都没有的人，怎么能嫁进他那样的家庭？我从没告诉他孤儿院的事，也实在不愿亲口解释，自己连父母是谁、从哪里来都不知道。我的血统说不定糟糕得吓人。他的家人很骄傲，而我也有我的骄傲。再说，我总觉得对您有一份责任。您供我受教育，是要我做作家。我至少得认真试一试。拿了您的教育，却转身走开，根本不用它，怎么也说不过去。现在我能把钱还上，这份债总算减轻了一些。何况结了婚，我照样可以写作，这两种身份并不互相排斥。
        - id: ch03-b09
          speaker: judy
          text: 我把一切翻来覆去想了很久。他是社会主义者，观念又不守旧，也许不会像别的男人那样，在意我出身于无产阶级。两个人要是心意完全相通，相聚时总是快活，分开时总是寂寞，或许就不该让任何东西挡在中间。我太想相信这句话了！可我需要一个冷静的意见。您大概也出身名门，会用世俗的眼光来看，不会只从同情和人情这一面答我。所以您瞧，我敢来问您，需要多大的勇气。
        - id: ch03-b10
          speaker: judy
          text: 要是我去找他，告诉他问题不在吉米，而在约翰·格里尔孤儿院，这样做会不会太可怕？我得鼓起很大的勇气。我甚至觉得，宁可一辈子不快活，也比开口容易。
        - id: ch03-b11
          speaker: judy
          text: 事情已经过去将近两个月。他离开以后，一个字也没有捎来。我刚开始习惯心碎是什么滋味，朱莉娅的一封信又把一切搅乱了。她像随口一提似的说，杰维斯舅舅在加拿大打猎，遇上暴风雨，在野外困了一整夜，后来得了肺炎，一直病着。可我一点也不知道。那段日子里，我还在受伤，还以为他一句话不说，就这样消失进一片空白里。我想他很不快活，我知道自己也一样。叔叔，您说我到底该怎么办？朱迪。
          emotion: sad
    - id: ch04
      title: "10月6日"
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 10月6日，长腿叔叔答应见她。
        - id: ch04-b02
          speaker: judy
          text: 最亲爱的长腿叔叔，我当然会来。下星期三下午四点半，我一定准时到。路我当然找得到，我都去过纽约三次了，又不是小娃娃。真不敢相信我终于要见到您。您在我想象里待了那么久，我几乎不敢相信您真是个有血有肉、伸手可以碰到的人。
        - id: ch04-b03
          speaker: judy
          text: 您身体还没恢复，却肯操心我的事，实在太好了。请一定保重，千万别着凉，秋雨的湿气很重。爱您的，朱迪。
        - id: ch04-b04
          speaker: judy
          text: 又及，我忽然想到一件吓人的事。您家里会不会有男管家？我最怕男管家。万一是他来开门，我准会昏倒在台阶上。可我该跟他说什么呢？您连自己的名字都没告诉我。难道我要请他去找史密斯先生？
    - id: ch05
      title: "星期四早晨"
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 到了星期四早晨，一切都已经不同了。
        - id: ch05-b02
          speaker: judy
          text: 我最最亲爱的杰维少爷、长腿叔叔、彭德尔顿、史密斯，您昨晚睡着了吗？我可一眼没合。我又吃惊，又激动，又迷惑，又幸福。恐怕从今以后，我再也不用睡觉，连饭也不用吃了。不过您一定要睡。睡足了，身体才能快点好起来，才能来见我。
          emotion: happy
        - id: ch05-b03
          speaker: judy
          text: 亲爱的人，一想到您病得那么厉害，我心里就受不了，而我那时竟什么也不知道。昨天医生送我上马车，才告诉我有三天工夫，大家都以为您救不回来了。要是真发生了那件事，我的世界就会彻底失去光亮。很久很久以后，我们当中总有一个人会先离开。可到了那一天，我们至少已经拥有过幸福，也会留下足够的回忆。
          emotion: sad
        - id: ch05-b04
          speaker: judy
          text: 我明明想让您高兴起来，怎么反倒要先安慰自己？我现在比梦想里最幸福的时候还幸福，心却也比从前沉重。总怕会有什么意外，那份担心像影子一样落在心上。以前我什么也不怕，因为没有珍贵的东西可以失去。从现在起，我一辈子都有一件天大的心事了。您只要不在我身边，我就会惦记路上的汽车、头顶会掉下来的招牌，还有那些会被您吞下去、蠕来蠕去的可怕病菌。我的安宁算是永远丢了。不过，那种平淡的安宁，我本来也不大喜欢。
        - id: ch05-b05
          speaker: judy
          text: 请您快一点、再快一点好起来。我想让您就在身边，近得可以伸手碰一碰，好让我确定您是真的。我们才相聚半个小时，短得像一场梦。我要是您的家人就好了，哪怕只是很远的四代表妹。那我就能天天来看您，念书给您听，拍松您的枕头，抚平额头上的两道小皱纹，再让您的嘴角重新弯成一个快活的笑。您已经快活了，对不对？昨天我离开以前，您明明已经在笑了。医生说我准是个好护士，因为您看上去年轻了十岁。但愿恋爱不会让每个人都年轻十岁。亲爱的，要是我最后变成十一岁，您还会爱我吗？
        - id: ch05-b06
          speaker: judy
          text: 昨天是我一生里最奇妙的一天。哪怕活到九十九岁，我也不会忘记任何一个小地方。天刚亮时，从洛克柳庄园出发的那个女孩，跟夜里回来的已经不是同一个人。森普尔太太四点半叫醒我。我在黑暗里一下睁开眼，脑子里只有一句话，我要去见长腿叔叔了！我借着烛光在厨房吃完早饭，又坐车走了五英里去车站。路上太阳升起来，沼泽枫和山茱萸亮成深红和橙黄，石墙与玉米地披着白霜，闪闪发光。空气又冷又清，仿佛许诺着什么。我知道，一定会有事情发生。
        - id: ch05-b07
          speaker: judy
          text: 火车一路往前，车轮和铁轨反复唱着，你要去见长腿叔叔了。听着这句话，我心里特别安稳，总觉得叔叔能把一切都安排好。我也知道，在另一个地方，还有一个比叔叔更亲爱的人正想见我。不知为什么，我相信旅程结束以前，也会碰见他。结果您看，我真的见到了！
        - id: ch05-b08
          speaker: judy
          text: 到了麦迪逊大道，那座房子又大，外墙又是阴沉沉的褐色，看着那么森严，我没敢直接进去，先绕着街区走了一整圈，才攒够勇气。其实根本不用怕。您的男管家又亲切，又像一位慈祥的长辈，我一进门就觉得自在了。
        - id: ch05-b09
          speaker: butler
          text: 请问，您是艾博特小姐吗？
        - id: ch05-b10
          speaker: judy
          text: 是的。
        - id: ch05-b11
          speaker: judy
          text: 这样，我到底没用开口找史密斯先生。他请我在客厅等。那房间色调幽暗，布置得富丽堂皇，可一看就是男人住的地方。我只敢挨着一张软垫大椅子的边沿坐下，嘴里不停念着，我就要见到长腿叔叔了，我就要见到长腿叔叔了！
        - id: ch05-b12
          speaker: judy
          text: 过了一会儿，男管家回来，请我上楼去书房。我激动得连脚都快迈不动了。走到门口，他回过身来，压低了声音。
        - id: ch05-b13
          speaker: butler
          text: 先生病得很重，小姐。今天医生才头一次准他坐起来。您不会待得太久，让他太激动吧？
        - id: ch05-b14
          speaker: judy
          text: 我一听就知道，他是真心爱您的。我觉得这位老人可亲极了。他敲了敲门，通报说艾博特小姐来了。我走进去，门就在身后关上。
        - id: ch05-b15
          speaker: judy
          text: 走廊很亮，屋里却很暗，我一时几乎什么也看不见。慢慢地，我看见壁炉前的大安乐椅、亮闪闪的茶桌，还有旁边那张小椅子。大椅子里坐着一个男人，背后垫着枕头，膝上盖着毯子。我还没来得及拦，他就摇摇晃晃地站起来，扶住椅背，一句话也不说，只望着我。然后，我认出了您。可我还是没明白，只以为叔叔特意请您来，想给我一个惊喜。
        - id: ch05-b16
          speaker: jervie
          text: 亲爱的小朱迪，你真的一直没猜到，我就是长腿叔叔吗？
          emotion: happy
        - id: ch05-b17
          speaker: judy
          text: 那一瞬间，我什么都明白了。我怎么会这么笨！只要稍微聪明一点，那一百件小事早该把答案告诉我了。我一定成不了好侦探。可是，我到底该叫您什么？叔叔？杰维？只叫杰维，好像不够尊敬，可我怎么能不尊敬您呢？
        - id: ch05-b18
          speaker: judy
          text: 医生来赶我走以前，我们有了最甜蜜的半个小时。我到车站时还是晕的，差一点坐上去圣路易斯的火车。您也一样迷糊，连茶都忘了给我。不过，我们两个人现在都非常幸福，对不对？我摸黑坐车回洛克柳庄园，可一路上，那些星星亮得惊人。今天早晨，我带着科林，把从前我们一起去过的每一个地方重新走了一遍，想着您说过的每句话，还有说话时的模样。树林泛着擦亮的青铜色，空气里满是霜意。这是最适合爬山的天气，我多希望您就在这里，跟我一起走上山坡。
        - id: ch05-b19
          speaker: judy
          text: 亲爱的杰维，我想您想得要命，可这次的思念是快活的，因为我们很快就会在一起。如今我们真正属于彼此了，不是想象，也不是假装，而是千真万确。我终于也属于一个人了。想到这里，我觉得又奇妙，又甜蜜。
          emotion: happy
        - id: ch05-b20
          speaker: judy
          text: 我永远不会让您有一刻后悔。永永远远属于您的，朱迪。
        - id: ch05-b21
          speaker: judy
          text: 又及，这是我平生写的第一封情书。真有意思，我怎么偏偏知道该怎样写呢？
