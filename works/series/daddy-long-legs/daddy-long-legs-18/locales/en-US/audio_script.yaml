audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm, observant storytelling with a dry touch of humor
        timbre: clear and gently textured
        pace: measured and flowing
        pitch: medium
    jerusha:
      display_name: Jerusha Abbott
      tts:
        delivery: bright, quick, and candid, with feeling close to the surface
        timbre: youthful and clear
        pace: lively
        pitch: medium-high
    butler:
      display_name: The Butler
      tts:
        delivery: courteous, fatherly, and quietly protective
        timbre: warm and mature
        pace: unhurried
        pitch: medium-low
    jervie:
      display_name: Jervis Pendleton
      tts:
        delivery: gentle and affectionate, with easy humor beneath the words
        timbre: warm and slightly resonant
        pace: relaxed
        pitch: medium-low
  chapters:
    - id: ch01
      title: 27th August
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: August twenty-seventh.
        - id: ch01-b02
          speaker: jerusha
          text: >-
            Dear Daddy-Long-Legs, where in the world are you? I never know. I only hope you aren't in New York in this dreadful heat. I hope you're up on a snowy mountain, looking out from the peak and thinking about me. Not in Switzerland, though. Somewhere closer. Please do think about me. I'm lonely, and I want someone to hold me in his thoughts. Oh, Daddy, I wish I knew you! Then whenever either of us was unhappy, we could make each other feel better.
        - id: ch01-b03
          speaker: jerusha
          text: >-
            I don't think I can bear much more of Lock Willow. I'm thinking about leaving. Sallie plans to do settlement work in Boston this winter. Wouldn't it be lovely if I went with her and we shared a studio? I could write while she did her settling, and we'd have our evenings together. Evenings here last forever when the only people to talk to are the Semples, Carrie, and Amasai.
        - id: ch01-b04
          speaker: jerusha
          text: >-
            I already know you won't approve of the studio. I can practically read your secretary's answer before he sends it. “Miss Jerusha Abbott. Dear Madam, Mister Smith would rather have you stay at Lock Willow. Yours truly, Elmer H. Griggs.”
        - id: ch01-b05
          speaker: jerusha
          text: >-
            I hate your secretary. Any man called Elmer H. Griggs is sure to be horrid. But really, Daddy, I may have to go to Boston. I can't stay here. If nothing happens soon, sheer desperation will send me straight into the silo pit.
        - id: ch01-b06
          speaker: jerusha
          text: >-
            Mercy, it's hot! The grass is burned brown, the streams have dried up, and dust covers the roads. We haven't had rain for weeks and weeks.
        - id: ch01-b07
          speaker: jerusha
          text: >-
            This letter makes me sound as if I have hydrophobia. I don't. I only want a family. Goodbye, my dearest Daddy. I wish I knew you. Judy.
    - id: ch02
      title: 19th September
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: September nineteenth. Lock Willow.
        - id: ch02-b02
          speaker: jerusha
          text: >-
            Dear Daddy, something has happened, and I need advice. Yours, and no one else's in the whole world. Couldn't I come see you? Talking would be so much easier than writing, and your secretary might open the letter. Judy.
        - id: ch02-b03
          speaker: jerusha
          text: Postscript. I am very unhappy.
    - id: ch03
      title: 3rd October
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: October third. Lock Willow.
        - id: ch03-b02
          speaker: jerusha
          text: >-
            Dear Daddy-Long-Legs, your note arrived this morning, written in your very own rather shaky hand. I'm so sorry you've been ill. If I'd known, I would never have bothered you with my troubles. Yes, I'll tell you what's wrong, though it's complicated to put in a letter and terribly private. Please burn this after you read it.
        - id: ch03-b03
          speaker: jerusha
          text: >-
            But first, I'm sending you a check for one thousand dollars. Isn't it strange that I'm the one sending you money? Can you guess where it came from?
        - id: ch03-b04
          speaker: jerusha
          text: >-
            I sold my story, Daddy! It will appear as a serial in seven parts, and then it will become a book. You'd expect me to be beside myself with joy, but I feel almost nothing. I am glad to start paying you back. I still owe you more than two thousand dollars, and the rest of the money will come in installments. Please don't be difficult about accepting it. Returning it makes me happy. Of course, I owe you far more than money. I'll spend my whole life repaying the rest with gratitude and affection.
        - id: ch03-b05
          speaker: jerusha
          text: >-
            Now for the other matter. Daddy, please give me your most practical, worldly advice, even if you know I won't like it.
        - id: ch03-b06
          speaker: jerusha
          text: >-
            You know I've always felt something very special for you. In a way, you've been my entire family. But you won't mind if I confess that I feel something even more special for another man, will you? You can probably guess who. My letters have been full of Master Jervie for ages.
        - id: ch03-b07
          speaker: jerusha
          text: >-
            I wish I could show you exactly what he's like, and how perfectly we get along. We agree about everything. Though I'm afraid I sometimes adjust my opinions until they fit his. Still, he's almost always right. He ought to be, since he's had fourteen more years to learn than I have. In other ways he's nothing but an overgrown boy, and someone really should look after him. He hasn't the sense to wear rubbers in the rain.
        - id: ch03-b08
          speaker: jerusha
          text: >-
            We laugh at all the same things, and that matters enormously. It would be awful to share your life with someone whose sense of humor fought with yours. I don't think anyone could build a bridge across a gap like that.
        - id: ch03-b09
          speaker: jerusha
          emotion: sad
          text: >-
            And he is... well, he's simply himself. I miss him and miss him and miss him. The whole world feels empty, and it hurts. I even hate the moonlight. It's beautiful, and he isn't here to see it with me. Perhaps you've loved someone too, and you understand. If you have, no explanation is needed. If you haven't, no explanation could help.
        - id: ch03-b10
          speaker: jerusha
          emotion: sad
          text: Anyway, that's how I feel. And I refused to marry him.
        - id: ch03-b11
          speaker: jerusha
          text: >-
            I never told him why. I just sat there, silent and miserable, unable to find a single word. Now he's gone away believing I want to marry Jimmie McBride. I don't. I would never even consider it. Jimmie isn't grown-up enough. But Master Jervie and I tangled ourselves in a terrible misunderstanding, and we both came away hurt.
        - id: ch03-b12
          speaker: jerusha
          text: >-
            I sent him away because I cared too much, not too little. I was afraid that someday he would regret marrying me, and I couldn't bear that. How could someone with no ancestors she knows about marry into a family like his? I never told him about the orphan asylum. I hated the thought of admitting that I don't know who I am. For all I know, I may come from perfectly dreadful people. His family is proud, and so am I.
        - id: ch03-b13
          speaker: jerusha
          text: >-
            I also felt that I owed something to you. You paid for my education so I could become a writer. I had to at least try. It wouldn't be fair to accept everything you gave me and then run away without using it. Now that I can begin returning the money, part of that debt feels settled. Besides, I suppose marriage wouldn't stop me from writing. A woman can have both professions.
        - id: ch03-b14
          speaker: jerusha
          text: >-
            I've thought and thought about all of this. Jervie is a Socialist, and his ideas aren't exactly conventional. Maybe marrying someone from the proletariat wouldn't trouble him as much as it might trouble another man. And maybe two people who understand each other completely, who are always happy together and lonely apart, shouldn't allow anything in the world to separate them. Naturally, that's what I want to believe.
        - id: ch03-b15
          speaker: jerusha
          text: >-
            But I want your cool, sensible opinion. I imagine you belong to a Family too. You'll see the worldly side of it, not merely the warm and human side. So you can tell how brave I am, putting the question in your hands.
        - id: ch03-b16
          speaker: jerusha
          text: >-
            What if I went to Jervie and told him the problem was never Jimmie? What if I explained about the John Grier Home? Would that be a terrible thing to do? It would take more courage than I can imagine. I think I'd almost prefer being miserable forever.
        - id: ch03-b17
          speaker: jerusha
          text: >-
            All this happened nearly two months ago. I hadn't heard one word from him since his visit. I was just beginning to get used to having a broken heart when Julia sent a letter that upset everything again. She mentioned, as casually as could be, that Uncle Jervis had been caught outdoors all night in a storm while hunting in Canada. He has had pneumonia ever since.
        - id: ch03-b18
          speaker: jerusha
          emotion: sad
          text: >-
            And I knew nothing about it. I was hurt because he'd vanished without a word. I think he's terribly unhappy, and I know I am. What do you think is the right thing for me to do? Judy.
    - id: ch04
      title: 6th October
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: October sixth.
        - id: ch04-b02
          speaker: jerusha
          text: >-
            Dearest Daddy-Long-Legs, yes, of course I'll come. I'll be there next Wednesday afternoon at four thirty. Naturally I can find my way. I've visited New York three times, and I'm not a baby. I can hardly believe I'm truly going to meet you. I've imagined you for so long that you don't quite seem like a real person made of flesh and blood.
        - id: ch04-b03
          speaker: jerusha
          text: >-
            You're very good to concern yourself with me when you still aren't strong. Take care of yourself, and please don't catch cold. These autumn rains are terribly damp. Affectionately, Judy.
        - id: ch04-b04
          speaker: jerusha
          emotion: fearful
          text: >-
            Postscript. A horrible possibility just occurred to me. Do you have a butler? Butlers frighten me. If one answers the door, I'll faint right there on the step. What am I supposed to say to him? You never told me your name. Should I ask for Mister Smith?
    - id: ch05
      title: Thursday Morning
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: Thursday morning.
        - id: ch05-b02
          speaker: jerusha
          emotion: happy
          text: >-
            My very dearest Master-Jervie-Daddy-Long-Legs Pendleton-Smith, did you sleep last night? I didn't sleep one single wink. I was far too amazed, excited, confused, and happy. I don't believe I'll ever sleep again, or eat, either. But I hope you slept. You must sleep, because then you'll recover faster and come to me.
        - id: ch05-b03
          speaker: jerusha
          emotion: sad
          text: >-
            Dear Man, I can't bear knowing how sick you've been while I knew nothing about it. When the doctor helped me into the cab yesterday, he told me that for three days they thought you might die. Oh, dearest, if you had, all the light would have gone out of my world.
        - id: ch05-b04
          speaker: jerusha
          text: >-
            Someday, far in the future, one of us will have to leave the other. But by then we'll have shared our happiness, and the one left behind will have memories to live on.
        - id: ch05-b05
          speaker: jerusha
          text: >-
            I meant to make you feel cheerful, and now I'm the one who needs cheering. I'm happier than I ever dreamed possible, but more serious too. The fear that something could happen lies like a shadow over my heart. Before this, I could be silly and carefree because I had nothing precious to lose. Now I'll carry one Great Big Worry for the rest of my life.
        - id: ch05-b06
          speaker: jerusha
          text: >-
            Whenever we're apart, I'll imagine automobiles running over you, signboards dropping on your head, and horrible wriggling germs going down your throat. My peace of mind is gone forever. Still, I was never especially fond of plain old peace.
        - id: ch05-b07
          speaker: jerusha
          emotion: happy
          text: >-
            Please get well quickly, quickly, quickly. I want you close enough to touch so I can be certain you're real. We had only that tiny half hour together. Perhaps I dreamed the whole thing.
        - id: ch05-b08
          speaker: jerusha
          text: >-
            If I belonged to your family, even as a very distant fourth cousin, I could visit every day. I could read to you, puff up your pillow, smooth away those two little lines in your forehead, and coax the corners of your mouth into a pleasant smile. You are cheerful again, aren't you? You were before I left yesterday. The doctor said I must be an excellent nurse because you looked ten years younger.
        - id: ch05-b09
          speaker: jerusha
          text: >-
            I hope falling in love doesn't make everyone ten years younger. If I turn out to be only eleven, will you still love me, darling?
        - id: ch05-b10
          speaker: jerusha
          emotion: happy
          text: >-
            Yesterday was the most wonderful day anyone could ever have. Even if I live to ninety-nine, I won't forget one tiny detail. The girl who left Lock Willow at dawn was not the same girl who returned that night.
        - id: ch05-b11
          speaker: jerusha
          text: >-
            Mrs. Semple woke me at four thirty. I came wide awake in the darkness with one thought already in my mind. I was going to see Daddy-Long-Legs! I ate breakfast by candlelight in the kitchen, then rode five miles to the station through the glorious October colors.
        - id: ch05-b12
          speaker: jerusha
          text: >-
            The sun rose along the way. Swamp maples and dogwoods blazed crimson and orange. Frost glittered on the stone walls and cornfields. The air felt sharp and clear and full of promise. I knew something was going to happen.
        - id: ch05-b13
          speaker: jerusha
          text: >-
            During the whole train ride, the rails seemed to sing, “You're going to see Daddy-Long-Legs.” I felt safe because I trusted Daddy to set everything right. And somewhere there was another man, dearer to me than Daddy, who wanted to see me too. Somehow I felt I would meet him before the trip was over. And I did!
        - id: ch05-b14
          speaker: jerusha
          text: >-
            The house on Madison Avenue looked so large, dark, and forbidding that I couldn't make myself enter. I walked all the way around the block to gather courage. I needn't have worried. Your butler was a dear, fatherly old man, and he made me comfortable at once.
        - id: ch05-b15
          speaker: butler
          text: Are you Miss Abbott?
        - id: ch05-b16
          speaker: jerusha
          text: >-
            I said I was, so there was no need to ask for Mister Smith after all. He led me to the drawing room to wait. It was a grand, gloomy room, just the sort a man would have. I perched on the edge of a huge upholstered chair and kept repeating the same thing to myself.
        - id: ch05-b17
          speaker: jerusha
          emotion: happy
          text: I'm going to see Daddy-Long-Legs! I'm going to see Daddy-Long-Legs!
        - id: ch05-b18
          speaker: jerusha
          text: >-
            After a while, the butler returned and asked me to come upstairs to the library. I was so excited that my feet could barely carry me. At the door, he stopped and spoke in a whisper.
        - id: ch05-b19
          speaker: butler
          text: >-
            He's been terribly ill, miss. This is the first day they've let him sit up. You won't stay long enough to tire him, will you?
        - id: ch05-b20
          speaker: jerusha
          text: >-
            The way he spoke told me how much he loved you. I think he's an old dear. He knocked, announced Miss Abbott, and let me enter. Then the door shut behind me.
        - id: ch05-b21
          speaker: jerusha
          text: >-
            The hallway had been bright, and the library was so dim that at first I could see almost nothing. Then shapes began to appear. There was a big chair by the fire, a shining tea table, and a smaller chair beside it. A man sat in the big chair, supported by pillows, with a rug across his knees.
        - id: ch05-b22
          speaker: jerusha
          text: >-
            Before I could stop him, he got to his feet. He was rather unsteady and had to hold the chair for balance. He only stood there and looked at me. Then I saw that the man was you! Even then I didn't understand. I thought Daddy had arranged for you to be there as a surprise.
        - id: ch05-b23
          speaker: jerusha
          text: Then you laughed, reached out your hand, and spoke.
        - id: ch05-b24
          speaker: jervie
          emotion: happy
          text: Dear little Judy, couldn't you tell that I was Daddy-Long-Legs?
        - id: ch05-b25
          speaker: jerusha
          emotion: surprised
          text: >-
            In that instant, everything became clear. Oh, how stupid I've been! A hundred tiny clues could have told me if I'd had any sense. I wouldn't be much of a detective, would I? And what am I supposed to call you now? Daddy? Jervie? Plain Jervie sounds disrespectful, and I could never be disrespectful to you.
        - id: ch05-b26
          speaker: jerusha
          emotion: happy
          text: >-
            We had one very sweet half hour before your doctor arrived and sent me away. I was so dazed at the station that I nearly boarded a train to Saint Louis. You were dazed too. You completely forgot to give me tea. But we are both very, very happy, aren't we?
        - id: ch05-b27
          speaker: jerusha
          text: >-
            I rode back to Lock Willow in the darkness, and oh, how brightly the stars shone! This morning Colin and I visited every place where you and I had walked together. I remembered the things you said and the way you looked. Today the woods are polished bronze, and the air is full of frost. It's climbing weather. I wish you were here to climb the hills with me.
        - id: ch05-b28
          speaker: jerusha
          emotion: happy
          text: >-
            I miss you terribly, dear Jervie, but now it's a happy kind of missing because we'll be together soon. We truly belong to each other at last. There is no pretending anymore. Isn't it strange that I finally belong to someone? It feels very, very sweet.
        - id: ch05-b29
          speaker: jerusha
          text: And I will never let you regret it for a single moment.
        - id: ch05-b30
          speaker: jerusha
          emotion: happy
          text: >-
            Yours forever and ever, Judy. Postscript. This is the first love letter I've ever written. Isn't it funny that I knew exactly how?
