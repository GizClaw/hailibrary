audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm, observant storytelling with a dry touch of humor
        timbre: clear and gently textured
        pace: measured and flowing
        pitch: medium
    jerusha:
      display_name: Jerusha Abbott
      tts:
        delivery: bright, quick, and candid, with feeling close to the surface
        timbre: youthful and clear
        pace: lively
        pitch: medium-high
    mother:
      display_name: The Mother
      tts:
        delivery: devout and earnest, with weary gratitude
        timbre: soft and worn
        pace: unhurried
        pitch: medium
    doctor:
      display_name: The Doctor
      tts:
        delivery: brisk, practical, and mildly incredulous
        timbre: firm and clear
        pace: measured
        pitch: medium-low
  chapters:
    - id: ch01
      title: 26th December
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: December twenty-sixth.
        - id: ch01-b02
          speaker: jerusha
          text: >-
            My dear, dear Daddy, haven't you any sense at all? You can't give one girl seventeen Christmas presents! Remember, I'm a Socialist. Are you trying to turn me into a Plutocrat?
        - id: ch01-b03
          speaker: jerusha
          text: >-
            Just think how awkward it would be if we ever quarreled. I'd need a moving van to send all your gifts back.
        - id: ch01-b04
          speaker: jerusha
          text: >-
            I'm sorry the necktie I sent is so lumpy. I knitted it myself, though I suppose the evidence already told you that. Save it for cold days, and button your coat tightly over it.
        - id: ch01-b05
          speaker: jerusha
          text: >-
            Thank you a thousand times, Daddy. You're the sweetest man who ever lived, and the most foolish! Judy.
        - id: ch01-b06
          speaker: jerusha
          text: >-
            I'm sending a four-leaf clover from Camp McBride. May it bring you good luck in the New Year.
    - id: ch02
      title: 9th January
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: January ninth.
        - id: ch02-b02
          speaker: jerusha
          text: >-
            Daddy, would you like to do something that will guarantee your eternal salvation? There's a family here in desperate trouble. The parents have four children still at home. Their two older boys went out into the world to make their fortunes, but none of that fortune has come back.
        - id: ch02-b03
          speaker: jerusha
          text: >-
            The father worked in a glass factory and caught consumption. It's terribly unhealthy work. Now he's in a hospital, and sending him there used up all their savings. So the whole family depends on the oldest daughter. She's twenty-four. She earns a dollar and a half a day sewing dresses when she can find the work, then spends her evenings embroidering centerpieces.
        - id: ch02-b04
          speaker: jerusha
          text: >-
            The mother is weak, helpless, and very pious. She sits with folded hands, patiently resigned, while her daughter wears herself out with work and worry. The girl can't see how they'll survive the rest of the winter, and neither can I. A hundred dollars would buy coal and shoes for three children, so they could attend school. It would also give her a little breathing room when several days pass without work.
        - id: ch02-b05
          speaker: jerusha
          text: >-
            You're the richest man I know. Couldn't you spare a hundred dollars? That girl deserves help far more than I ever did. I wouldn't ask except for her. I don't care nearly so much what happens to her mother. She's a complete jellyfish.
        - id: ch02-b06
          speaker: jerusha
          text: >-
            It makes me furious when people roll their eyes toward heaven and say, “Maybe it's all for the best,” when they know perfectly well it isn't. Call it humility or resignation if you like. I call it doing nothing because you're powerless. I want a more militant religion!
          emotion: angry
        - id: ch02-b07
          speaker: jerusha
          text: >-
            Philosophy is giving us the most dreadful assignments. We have all of Schopenhauer due tomorrow. The professor seems unaware that we study anything else. He's an odd old duck who walks around with his head in the clouds, then blinks in surprise whenever he bumps into solid earth.
        - id: ch02-b08
          speaker: jerusha
          text: >-
            Sometimes he tries to brighten a lecture with a joke. We try hard to smile, but believe me, his jokes are serious business. Between classes, he spends every minute wondering whether matter truly exists or whether he merely imagines it.
        - id: ch02-b09
          speaker: jerusha
          text: >-
            My sewing girl has no doubt that matter exists!
        - id: ch02-b10
          speaker: jerusha
          text: >-
            And where is my new novel? In the wastebasket. Even I can tell it's no earthly good. If its loving author thinks that, imagine what a critical public would say.
        - id: ch02-b11
          speaker: narrator
          text: Later.
        - id: ch02-b12
          speaker: jerusha
          text: >-
            Daddy, I'm writing from a bed of pain. My tonsils have been swollen for two days, and hot milk is the only thing I can swallow.
        - id: ch02-b13
          speaker: doctor
          text: >-
            What could your parents have been thinking? Those tonsils should have come out when you were a baby.
        - id: ch02-b14
          speaker: jerusha
          text: >-
            I honestly don't know. I rather doubt they thought much about me. Yours, J. A.
        - id: ch02-b15
          speaker: narrator
          text: The next morning.
        - id: ch02-b16
          speaker: jerusha
          text: >-
            I just read this before sealing it. Why did I make life sound so gloomy? Let me quickly assure you that I'm young, happy, and bursting with life. I hope you are too. Youth isn't a matter of birthdays. It depends on how alive your spirit is. Even with gray hair, Daddy, you can still be a boy. Affectionately, Judy.
    - id: ch03
      title: 12th January
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: January twelfth.
        - id: ch03-b02
          speaker: jerusha
          text: >-
            Dear Mister Philanthropist, your check for my family arrived yesterday. Thank you so much! I skipped gym and took it to them right after lunch. You should have seen the girl's face. She was so astonished, happy, and relieved that she looked almost young, though she's only twenty-four. Isn't that pitiful?
          emotion: happy
        - id: ch03-b03
          speaker: jerusha
          text: >-
            Now she feels as if every good thing is happening at once. She also has steady work for the next two months because someone is getting married and needs a whole trousseau made.
        - id: ch03-b04
          speaker: mother
          text: >-
            Thank the good Lord!
          emotion: happy
        - id: ch03-b05
          speaker: narrator
          text: >-
            The mother cried out when she understood that the little piece of paper was worth one hundred dollars.
        - id: ch03-b06
          speaker: jerusha
          text: >-
            The good Lord didn't send it. Daddy-Long-Legs did. I called you Mister Smith, by the way.
        - id: ch03-b07
          speaker: mother
          text: >-
            But the good Lord put the idea into his mind.
        - id: ch03-b08
          speaker: jerusha
          text: >-
            No, he didn't! I put it there myself.
        - id: ch03-b09
          speaker: jerusha
          text: >-
            Still, Daddy, I hope the good Lord rewards you properly. You deserve ten thousand years taken off your time in purgatory. Yours most gratefully, Judy Abbott.
    - id: ch04
      title: 15th February
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: February fifteenth.
        - id: ch04-b02
          speaker: jerusha
          text: >-
            May it please Your Most Excellent Majesty. This morning I did eat my breakfast upon a cold turkey pie and a goose, and I did send for a cup of tea, a China drink, which I had never drunk before.
        - id: ch04-b03
          speaker: jerusha
          text: >-
            Don't worry, Daddy. I haven't lost my mind. I'm only quoting Samuel Pepys. We're reading his diary as an original source for English History. Sallie, Julia, and I now talk to each other in the language of 1660. Listen to this.
        - id: ch04-b04
          speaker: jerusha
          text: >-
            “I went to Charing Cross to see Major Harrison hanged, drawn, and quartered. He looked as cheerful as any man could in that condition.” Then there's this one. “Dined with my lady, who is in handsome mourning for her brother, who died yesterday of spotted fever.”
        - id: ch04-b05
          speaker: jerusha
          text: >-
            Doesn't the day after his death seem a little early to start entertaining? One of Pepys's friends also invented a clever plan for paying the king's debts. He would sell old, rotten food to poor people. As a reformer, what do you think of that? Maybe the present isn't as dreadful as the newspapers claim.
        - id: ch04-b06
          speaker: jerusha
          text: >-
            Samuel cared as much about clothes as any girl. He spent five times more on his wardrobe than his wife did. That must have been the Golden Age of husbands. Here's a touching entry that proves he really was honest. “Today my fine camlet cloak with gold buttons came home. It cost me a great deal, and I pray God will make me able to pay for it.”
        - id: ch04-b07
          speaker: jerusha
          text: >-
            Forgive me for going on about Pepys. I'm writing a special paper about him.
        - id: ch04-b08
          speaker: jerusha
          text: >-
            And Daddy, guess what? The Self-Government Association has abolished the ten o'clock rule. We may keep our lights on all night as long as we don't bother anyone. That means no enormous parties. The result says something lovely about human nature. Now that we can stay awake as late as we please, we don't want to. By nine our heads are drooping. At nine-thirty, the pens fall from our limp hands. It's nine-thirty now. Good night.
        - id: ch04-b09
          speaker: narrator
          text: Sunday.
        - id: ch04-b10
          speaker: jerusha
          text: >-
            I've just come back from church. The preacher was from Georgia. He warned us not to strengthen our minds while neglecting our emotions, but methought it was a poor, dry sermon. That's Pepys again.
        - id: ch04-b11
          speaker: jerusha
          text: >-
            It makes no difference where these preachers come from in the United States or Canada, or which denomination they belong to. We always hear that same sermon. Why don't they visit men's colleges and warn the students not to let too much studying crush their manly natures?
        - id: ch04-b12
          speaker: jerusha
          text: >-
            It's a beautiful day, frozen and icy and clear. After dinner, Sallie, Julia, Marty Keene, Eleanor Pratt, and I are putting on short skirts and walking across the country to Crystal Spring Farm. Marty and Eleanor are friends of mine you haven't met. We'll eat fried chicken and waffles, then Mister Crystal Spring will drive us home in his buckboard.
        - id: ch04-b13
          speaker: jerusha
          text: >-
            We're supposed to be back on campus by seven, but tonight we're stretching the rule to eight. Farewell, kind sir. I have the honor to remain your most loyal, dutiful, faithful, and obedient servant, J. Abbott.
    - id: ch05
      title: March Fifth
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: March fifth.
        - id: ch05-b02
          speaker: jerusha
          text: >-
            Dear Mister Trustee, tomorrow is the first Wednesday of the month, that exhausting day at the John Grier Home. How relieved everyone will be when five o'clock arrives, you pat the children on the head, and all of you leave! Did you personally ever pat my head, Daddy? I don't think so. All I remember are the fat Trustees.
        - id: ch05-b03
          speaker: jerusha
          text: >-
            Please give the Home my love, and I truly mean love. Looking back through four years of distance, I feel quite tender toward it. When I first reached college, I resented being cheated out of the ordinary childhood the other girls had. Now I don't feel that way at all. I think of it as a very unusual adventure.
        - id: ch05-b04
          speaker: jerusha
          text: >-
            Growing up there gave me a place outside ordinary life where I could stand and look at it. I came out fully grown, with a view of the world that people raised right in the middle of things never get.
        - id: ch05-b05
          speaker: jerusha
          text: >-
            I know many girls, Julia for example, who don't even realize they're happy. They're so used to happiness that they can't feel it anymore. But I know I'm happy every moment of my life. I mean to stay that way, no matter what unpleasant things appear.
        - id: ch05-b06
          speaker: jerusha
          text: >-
            I'll treat every one of them, even a toothache, as an interesting experience. I'll be glad to learn what it feels like. “Whatever sky's above me, I've a heart for any fate.”
        - id: ch05-b07
          speaker: jerusha
          text: >-
            Still, Daddy, don't take my new affection for the John Grier Home too seriously. If I ever have five children, like Rousseau, I won't leave them on the steps of a foundling asylum just to make sure they're raised simply.
        - id: ch05-b08
          speaker: jerusha
          text: >-
            Give my kindest regards to Mrs. Lippett. I believe that's truthful. Love would be going too far. And don't forget to tell her what a beautiful nature I've developed. Affectionately, Judy.
