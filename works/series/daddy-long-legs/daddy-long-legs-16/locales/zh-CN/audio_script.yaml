audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 叙述者
      tts:
        delivery: 清楚沉静，简洁报出书信日期与场景转换
        timbre: 温暖清澈
        pace: 舒缓
        pitch: 中音
    judy:
      display_name: 朱迪
      tts:
        delivery: 聪敏直率，像把心事和见闻亲口讲给亲近的人
        timbre: 明亮自然的年轻女声
        pace: 轻快而富于变化，伤心时稍慢
        pitch: 中高音
    mother:
      display_name: 那位母亲
      tts:
        delivery: 虔诚恳切，感激中带着疲惫
        timbre: 柔和而略显衰弱
        pace: 从容
        pitch: 中音
    doctor:
      display_name: 医生
      tts:
        delivery: 干脆务实，带一点难以置信
        timbre: 坚定清晰
        pace: 适中
        pitch: 中低音
  chapters:
    - id: ch01
      title: 12月26日：十七件圣诞礼物
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 12月26日，朱迪收到了长腿叔叔送来的十七件圣诞礼物。
        - id: ch01-b02
          speaker: judy
          text: 亲爱的、亲爱的叔叔，您怎么一点儿常识也没有？哪能一口气送一个姑娘十七件圣诞礼物！别忘了，我可是社会主义者。您难道想把我变成财阀吗？
        - id: ch01-b03
          speaker: judy
          text: 万一我们哪天吵起架来，那场面得多难堪。我得雇一辆搬家货车，才能把您的礼物一件不落地退回去。
        - id: ch01-b04
          speaker: judy
          text: 我送您的领带织得歪歪扭扭，真对不起。那是我亲手织的，当然，光看领带本身，您大概早就找到证据了。留到冷天再戴吧，还得把大衣扣得严严实实。
        - id: ch01-b05
          speaker: judy
          text: 叔叔，谢谢您，千遍万遍地谢谢您。您是世上最可爱的人，也是最傻的人！朱迪。
          emotion: happy
        - id: ch01-b06
          speaker: judy
          text: 另外送您一片麦克布赖德营地的四叶草。愿它在新的一年里给您带来好运。
    - id: ch02
      title: 1月9日：请救救那一家人
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 1月9日，朱迪写信请求叔叔帮助一个陷入困境的家庭。
        - id: ch02-b02
          speaker: judy
          text: 叔叔，您想不想做件事，保证自己永远得救？这里有一家人，实在快过不下去了。父母身边还有四个孩子，另外两个大儿子出去闯世界、发大财，可到现在一分钱也没有寄回家。
        - id: ch02-b03
          speaker: judy
          text: 父亲原来在玻璃厂做工，那活儿特别伤身体，他染上了肺结核，只好住院。家里的积蓄全花在这上面。现在，一家人的日子都压在二十四岁的大女儿肩上。她接得到活儿时，就替人裁衣服，一天挣一块五。到了晚上，还得绣桌心。
        - id: ch02-b04
          speaker: judy
          text: 她母亲身体不好，什么事也办不成，偏偏又虔诚极了。她只管双手交叠地坐着，满脸忍耐顺从。女儿却为了工作、责任和忧虑，快把自己活活累垮了。她不知道这个冬天剩下的日子要怎么熬，我也不知道。
        - id: ch02-b05
          speaker: judy
          text: 只要一百美元，他们就能买煤，还能给三个孩子买鞋，让孩子们去上学。手里有一点余钱，姑娘哪怕几天接不到活儿，也不至于愁得要命。您是我认识的最有钱的人，不能匀出这一百美元吗？她比从前的我更值得人帮。要不是为了她，我不会开口。至于她母亲，我可不怎么在乎。那女人简直是只没骨头的水母。
        - id: ch02-b06
          speaker: judy
          text: 有些人明知道事情糟透了，还总把眼睛转向天堂，说什么“也许一切自有好处”。一听这话我就生气。管它叫谦卑还是顺从，其实都是无能为力，只好坐着不动。我赞成一种更有战斗精神的宗教！
          emotion: angry
        - id: ch02-b07
          speaker: judy
          text: 我们的哲学功课也可怕得很，明天竟要读完叔本华的全部著作。教授似乎忘了我们还要上别的课。他是只古怪的老鸭子，整天把头伸进云里，偶尔碰到坚实的地面，反而会茫然地眨眼睛。
        - id: ch02-b08
          speaker: judy
          text: 他有时讲个笑话，想让课堂轻松一点。我们都很努力地笑，可那些笑话实在不是闹着玩的。每逢课间，他就忙着琢磨，物质是真的存在，还是只有他以为物质存在。我那位替人缝衣服的姑娘，可绝不会怀疑物质存不存在！
        - id: ch02-b09
          speaker: judy
          text: 至于我的新小说，您猜它在哪儿？已经进了废纸篓。我自己都看得出，那本书一点儿用也没有。连最疼爱作品的作者都这样想，挑剔的读者又会怎么说呢？
        - id: ch02-b10
          speaker: narrator
          text: 写到稍晚一些，朱迪已经病倒在床上。
        - id: ch02-b11
          speaker: judy
          text: 叔叔，我如今躺在病榻上写信。扁桃体已经肿了两天，我只能咽下热牛奶，别的什么也吃不了。
        - id: ch02-b12
          speaker: doctor
          text: 你还是婴儿的时候，你父母究竟怎么想的？他们为什么没把扁桃体割掉？
        - id: ch02-b13
          speaker: judy
          text: 我怎么会知道呢？不过，我怀疑他们根本没怎么想过我。您的，J. A.
        - id: ch02-b14
          speaker: narrator
          text: 第二天早晨，朱迪封信以前又读了一遍。
        - id: ch02-b15
          speaker: judy
          text: 我也不知道，自己为什么把人生说得雾蒙蒙的。请让我赶快说明，我年轻、快活，而且精神十足。希望您也是这样。青春不在于过了多少个生日，只在于心里是不是鲜活。所以叔叔，哪怕您的头发已经灰了，您还是可以做个少年。深情爱您的朱迪。
    - id: ch03
      title: 1月12日：一百美元的支票
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 1月12日，叔叔寄来的支票已经送到了那家人手中。
        - id: ch03-b02
          speaker: judy
          text: 亲爱的慈善家先生，支票昨天到了。真是太谢谢您啦！我吃过午饭，连体操课都没去，马上把它送了过去。您真该看看那姑娘当时的脸。她又惊讶，又高兴，整个人一下子轻松下来，看着几乎年轻了。可她明明才二十四岁，这不是很可怜吗？
          emotion: happy
        - id: ch03-b03
          speaker: judy
          text: 她现在觉得，好事全赶到一起来了。接下来两个月都有稳定的活儿，因为有人要结婚，得做一整套嫁妆衣物。
        - id: ch03-b04
          speaker: mother
          text: 感谢仁慈的主！这么小一张纸，原来值整整一百美元！
          emotion: surprised
        - id: ch03-b05
          speaker: judy
          text: 这可不是主给的，是长腿叔叔给的。我对她说，您是史密斯先生。
        - id: ch03-b06
          speaker: mother
          text: 可是，是仁慈的主把这个念头放进史密斯先生心里的呀。
        - id: ch03-b07
          speaker: judy
          text: 才不是呢！明明是我亲自把这个念头放进去的。不过叔叔，不管怎么说，我相信仁慈的主会好好奖赏您。您应该少在炼狱里待上一万年。满怀感激的朱迪·艾博特。
    - id: ch04
      title: 2月15日：佩皮斯与十点规则
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 2月15日，朱迪从塞缪尔·佩皮斯的日记说起。
        - id: ch04-b02
          speaker: judy
          text: 谨奏至高无上的陛下。今晨臣食早膳，吃的是冷火鸡馅饼与一只鹅。臣又命人送来一杯“茶”，也就是瓷器国的饮品，此物臣此前从未喝过。
        - id: ch04-b03
          speaker: judy
          text: 叔叔，您别紧张，我没有疯，只是在引用塞缪尔·佩皮斯。英国史课正在读他的日记，把它当成原始资料。莎莉、朱莉娅和我如今都拿1660年的口吻说话。
        - id: ch04-b04
          speaker: judy
          text: 您听听这一段。“我往查令十字街，看哈里森少校被绞死、开膛、分尸。身处这般境地，他却像任何人所能做到的那样神色愉快。”还有一句。“同我家夫人共进晚餐。她的兄弟昨日死于斑疹热，她正穿着漂亮的丧服。”
        - id: ch04-b05
          speaker: judy
          text: 兄弟才死了一天，她就开始请人吃饭，似乎早了点儿吧？佩皮斯有个朋友，还想出一条狡猾的办法。把腐坏的旧食物卖给穷人，再拿钱替国王还债。您这位改革家觉得怎么样？看来今天的世道，并不像报纸说的那么坏。
        - id: ch04-b06
          speaker: judy
          text: 塞缪尔一见漂亮衣服，兴奋起来一点儿也不输给姑娘。他花在自己衣服上的钱，是妻子的五倍。那大概才是丈夫们的黄金时代。可他确实诚实得可爱。日记里写道：“今日，我那件配金纽扣的精美驼毛斗篷送到家中，耗费甚巨。我祈求上帝，使我有能力付清此款。”
        - id: ch04-b07
          speaker: judy
          text: 请原谅我一直谈佩皮斯，我正在写一篇关于他的专题论文。对了，叔叔，学生自治会已经取消十点熄灯的规定啦！现在只要不打扰别人，我们爱亮多久的灯都可以。当然，不能大摆宴席。
        - id: ch04-b08
          speaker: judy
          text: 结果，这件事给人性作了一条漂亮的注解。以前不许熬夜，我们偏想熬。如今爱熬多久都行，反而没人愿意了。九点钟，大家的脑袋就开始往下点。九点半，笔从没力气的手里掉下来。现在正好九点半。晚安。
        - id: ch04-b09
          speaker: narrator
          text: 到了星期日，朱迪刚从教堂回来。
        - id: ch04-b10
          speaker: judy
          text: 今天讲道的是一位佐治亚州来的牧师。他说，我们可不能只顾发展理智，把情感的天性牺牲掉。可依臣之见，这篇布道真是又干又乏味。您听，又是佩皮斯的口气。
        - id: ch04-b11
          speaker: judy
          text: 不管牧师来自美国还是加拿大，也不管属于哪个教派，我们听见的总是同一篇布道。他们为什么不去男子大学，劝那里的学生小心一点，别让太多脑力活动毁掉自己的男子气概？
        - id: ch04-b12
          speaker: judy
          text: 今天天气美极了，地上全冻住了，冷冰冰的，天空却很清澈。吃完饭，我要跟莎莉、朱莉娅、马蒂·基恩和埃莉诺·普拉特换上短裙，穿过乡野，走到水晶泉农场。后面两位也是我的朋友，不过您不认识。
        - id: ch04-b13
          speaker: judy
          text: 到了农场，我们要吃炸鸡配华夫饼，再请水晶泉先生赶四轮马车送我们回来。按规定，七点以前就得进校园，可今晚我们打算稍微破一次例，八点再回去。再会了，仁慈的先生。谨此荣幸署名，您最忠贞、尽责、诚实而顺从的仆人，J. 艾博特。
    - id: ch05
      title: 3月5日：隔着四年的薄雾
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 3月5日，朱迪想起了约翰·格里尔孤儿院每月一次的董事来访日。
        - id: ch05-b02
          speaker: judy
          text: 亲爱的董事先生，明天是这个月的第一个星期三。对孤儿院的孩子们来说，那又是疲惫难熬的一天。等五点一到，你们拍拍他们的脑袋，终于起身离开，他们该多么松一口气啊！
        - id: ch05-b03
          speaker: judy
          text: 叔叔，您自己拍过我的脑袋吗？我想没有。我的记忆里，好像只有那些胖董事。请替我向孤儿院问好，而且是真心实意地问好。
        - id: ch05-b04
          speaker: judy
          text: 隔着四年光阴的薄雾回头看，我竟然对那里生出了一份温柔的感情。刚进大学时，我很愤怒，觉得孤儿院夺走了我的正常童年，别的姑娘有过的童年，我却没有。现在，我一点儿也不这样想了。我觉得那是一次很不寻常的历险。
        - id: ch05-b05
          speaker: judy
          text: 那段生活给了我一个特别的立足点，让我能退到一旁看人生。我像个大人一样突然从孤儿院里走出来，看世界时便有了一种不同的眼光。从小就在生活中心长大的人，反而没有这样的眼光。
        - id: ch05-b06
          speaker: judy
          text: 我认识许多姑娘，朱莉娅就是一个。她们从来不知道自己很幸福，因为早就习惯了幸福，连感觉都变迟钝了。可我活着的每一刻，都清清楚楚地知道自己很幸福。无论以后冒出什么讨厌的事，我也要一直幸福下去。
        - id: ch05-b07
          speaker: judy
          text: 我会把那些事全当成有趣的经历，就连牙疼也一样。能知道它们是什么滋味，我也觉得高兴。“无论头顶是怎样的天空，我都有一颗迎接任何命运的心。”
          emotion: happy
        - id: ch05-b08
          speaker: judy
          text: 不过叔叔，您别把我新生的孤儿院之爱看得太当真。假如我像卢梭一样有五个孩子，我可不会为了让他们过得简朴，就把他们丢在育婴堂的台阶上。
        - id: ch05-b09
          speaker: judy
          text: 请代我向利佩特太太致以最亲切的问候。这句话应该还算诚实，要是说爱她，就有点儿过头了。也别忘了告诉她，我已经养成了多么美好的品性。深情爱您的朱迪。
