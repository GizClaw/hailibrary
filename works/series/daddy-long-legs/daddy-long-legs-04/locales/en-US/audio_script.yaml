audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm, observant storytelling with a dry touch of humor
        timbre: clear and gently textured
        pace: measured and flowing
        pitch: medium
    jerusha:
      display_name: Jerusha Abbott
      tts:
        delivery: bright, quick, and candid, with feeling close to the surface
        timbre: youthful and clear
        pace: lively
        pitch: medium-high
  chapters:
    - id: ch01
      title: The Ides of March
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: The Ides of March.
        - id: ch01-b02
          speaker: jerusha
          text: >-
            Dear Daddy-Long-Legs, I am studying Latin prose composition. I have been studying it. I shall be studying it. I shall be about to have been studying it. My reexamination comes at the seventh hour next Tuesday, and I mean to pass or bust. So the next news you get from me will be either one whole, happy girl, free of conditions, or a pile of fragments.
        - id: ch01-b03
          speaker: jerusha
          text: >-
            I'll write you a proper letter when it's all over. Tonight I have an urgent appointment with the Ablative Absolute. Yours, in an obvious hurry, J. A.
    - id: ch02
      title: 26th March
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: March twenty-sixth.
        - id: ch02-b02
          speaker: jerusha
          text: >-
            Mr. D.-L.-L. Smith, sir, you never answer a single question. You never show the least bit of interest in anything I do. I suppose you're the most horrible of all those horrible Trustees, and you're educating me from a sense of duty, not because you care about me at all.
          emotion: angry
        - id: ch02-b03
          speaker: jerusha
          text: >-
            I know absolutely nothing about you. I don't even know your name. It's not very inspiring to write to a Thing. I'm sure you toss my letters into the wastebasket without reading them. From now on, I'll write about work and nothing else.
        - id: ch02-b04
          speaker: jerusha
          text: >-
            My Latin and geometry reexaminations were last week. I passed both, so now I have no conditions at all. Yours truly, Jerusha Abbott.
    - id: ch03
      title: 2nd April
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: April second.
        - id: ch03-b02
          speaker: jerusha
          text: >-
            Dear Daddy-Long-Legs, I am a beast.
          emotion: sad
        - id: ch03-b03
          speaker: jerusha
          text: >-
            Please forget that dreadful letter I sent last week. That night I felt terribly lonely and miserable, and my throat hurt. I didn't realize I was coming down with tonsillitis and grippe and all sorts of things at once. I've been in the infirmary for six days. This is the first time they've let me sit up with a pen and paper, because the head nurse is very bossy.
        - id: ch03-b04
          speaker: jerusha
          text: >-
            I've thought about my letter the whole time, and I can't get well until you forgive me. Imagine me with a bandage around my head, tied into rabbit ears. Doesn't that make you feel sorry for me?
        - id: ch03-b05
          speaker: jerusha
          text: >-
            My sublingual glands are swollen. I've studied physiology all year without once hearing about sublingual glands. Education can be so useless!
        - id: ch03-b06
          speaker: jerusha
          text: >-
            I can't write any more. If I sit up too long, I start to shake. Please forgive me for being rude and ungrateful. I was badly brought up. Yours with love, Judy Abbott.
          emotion: sad
    - id: ch04
      title: The Infirmary, 4th April
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: The infirmary. April fourth.
        - id: ch04-b02
          speaker: jerusha
          text: >-
            Dearest Daddy-Long-Legs, yesterday evening, just before dark, I was sitting up in bed, watching the rain and feeling terribly bored with life in a great institution. Then the nurse came in with a long white box addressed to me. It was filled with the loveliest pink rosebuds. Better still, there was a card inside with a very polite message, written in a funny little uphill backhand. It looked like handwriting with a great deal of character.
        - id: ch04-b03
          speaker: jerusha
          text: >-
            Thank you, Daddy, a thousand times. Your flowers are the first real, true present I have ever received. And if you want to know what a baby I am, I lay down and cried because I was so happy.
          emotion: happy
        - id: ch04-b04
          speaker: jerusha
          text: >-
            Now that I know you read my letters, I'll make them much more interesting. They'll be worth locking in a safe and tying up with red tape. Only please take out that dreadful one and burn it. I couldn't bear to think of you reading it again.
        - id: ch04-b05
          speaker: jerusha
          text: >-
            Thank you for cheering up one very sick, cross, miserable Freshman. You probably have a loving family and plenty of friends, so maybe you don't know what being alone feels like. I do.
          emotion: sad
        - id: ch04-b06
          speaker: jerusha
          text: >-
            Goodbye. I promise I'll never be horrid again, because now I know you're a real person. I also promise I won't bother you with any more questions. Do you still hate girls? Yours forever, Judy.
    - id: ch05
      title: 8th Hour, Monday
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: Eighth hour, Monday.
        - id: ch05-b02
          speaker: jerusha
          text: >-
            Dear Daddy-Long-Legs, I hope you weren't the Trustee who sat on the toad. I heard it went off with quite a pop, so it was probably a fatter Trustee.
        - id: ch05-b03
          speaker: jerusha
          text: >-
            Do you remember the little dugout spaces with grates over them beside the laundry windows at the John Grier Home? Every spring, when toad season began, we collected toads and kept them in those window holes. Sometimes they spilled into the laundry and caused a wonderfully exciting commotion on wash day. We were punished severely for it, but no amount of discouragement ever stopped the toads from collecting.
        - id: ch05-b04
          speaker: jerusha
          text: >-
            Then one day... well, I won't tire you with every detail. Somehow, one of the fattest, biggest, juiciest toads found its way into a large leather armchair in the Trustees' room. That afternoon, during the Trustees' meeting... but perhaps you were there, and you remember what happened next?
        - id: ch05-b05
          speaker: jerusha
          text: >-
            Looking back now, calmly and after plenty of time, I admit the punishment was deserved. If I remember correctly, it was also quite enough.
        - id: ch05-b06
          speaker: jerusha
          text: >-
            I don't know why I'm remembering all this, except that spring and the return of the toads always wake up my old urge to collect them. The only thing stopping me now is that there isn't any rule against it.
    - id: ch06
      title: After Chapel, Thursday
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: After chapel, Thursday.
        - id: ch06-b02
          speaker: jerusha
          text: >-
            What do you think my favorite book is? I mean right now, because I change favorites every three days. It's Wuthering Heights. Emily Brontë was very young when she wrote it, and she had never been beyond the Haworth churchyard. She had hardly known any men. So how could she possibly imagine someone like Heathcliff?
        - id: ch06-b03
          speaker: jerusha
          text: >-
            I couldn't do it, and I'm young too. I never got beyond the John Grier Asylum, so I've had every possible advantage. Sometimes I get the horrible fear that I may not be a genius. Daddy, would you be terribly disappointed if I didn't grow up to be a great author?
        - id: ch06-b04
          speaker: jerusha
          text: >-
            In spring, when everything is green and beautiful and budding, I want to turn my back on lessons and run outside to play with the weather. The fields are full of adventures. Living books is much more fun than writing them.
        - id: ch06-b05
          speaker: jerusha
          text: Ow! Ow! Ow!
          emotion: fearful
        - id: ch06-b06
          speaker: narrator
          text: >-
            Judy's shriek brings Sallie and Julia running, along with the Senior from across the hall for one disgusted moment. A centipede has dropped from the ceiling and landed beside Judy just as she finished her sentence.
        - id: ch06-b07
          speaker: jerusha
          text: >-
            It was a horrible centipede! I knocked two cups off the tea table trying to get away. Sallie hit it with the back of my hairbrush, which I can never use again. She killed the front end, but the back fifty feet ran under the bureau and escaped.
        - id: ch06-b08
          speaker: jerusha
          text: >-
            This dormitory is old, with ivy all over the walls, so it's full of centipedes. They're dreadful. I would much rather find a tiger under my bed.
    - id: ch07
      title: Friday, 9:30 p.m.
      blocks:
        - id: ch07-b01
          speaker: narrator
          text: Friday, nine thirty in the evening.
        - id: ch07-b02
          speaker: jerusha
          text: >-
            What a day of troubles! I missed the rising bell this morning. Then, while I was rushing to dress, my shoestring broke and my collar button fell down my neck. I was late to breakfast and late to first-hour recitation. I forgot my blotting paper, and my fountain pen leaked.
        - id: ch07-b03
          speaker: jerusha
          text: >-
            In trigonometry, the professor and I disagreed over a small matter involving logarithms. I looked it up later. She was right. Lunch was mutton stew and pie-plant. I hate both, because they taste like the asylum. The mail brought nothing but bills, though I never get anything else. My family isn't the letter-writing kind.
        - id: ch07-b04
          speaker: jerusha
          text: >-
            Then, in English class, we had an unexpected written lesson. A poem was waiting on the blackboard when we came in. It said, “I asked no other thing. No other was denied. I offered Being for it. The mighty merchant smiled. Brazil? He twirled a button without a glance my way. But, madam, is there nothing else that we can show today?”
        - id: ch07-b05
          speaker: jerusha
          text: >-
            I don't know who wrote that poem or what it means, but we were ordered to explain it. At first, I thought the Mighty Merchant was some kind of god handing out blessings in exchange for good deeds. Then he started twirling a button. That idea suddenly seemed like blasphemy, so I changed my mind in a hurry.
        - id: ch07-b06
          speaker: jerusha
          text: >-
            The rest of the class was just as lost. We sat there for three quarters of an hour with blank paper and minds that were equally blank. Getting an education can wear a person out!
        - id: ch07-b07
          speaker: jerusha
          text: >-
            And that still wasn't the end. Worse was coming. Rain kept us from playing golf, so we had to go to the gym instead. The girl beside me struck my elbow with an Indian club. When I got home, the box with my new blue spring dress had arrived, but the skirt was so tight I couldn't sit down.
        - id: ch07-b08
          speaker: jerusha
          text: >-
            Friday is sweeping day, and the maid had scrambled every paper on my desk. Dessert was tombstone, that milk-and-gelatin thing flavored with vanilla. Chapel ran twenty minutes late because we had to hear a speech about womanly women.
        - id: ch07-b09
          speaker: jerusha
          text: >-
            At last, I settled down with The Portrait of a Lady and gave a sigh of well-earned relief. That was when Ackerly came in. She's the dough-faced, hopelessly, endlessly stupid girl who sits beside me in Latin because her name begins with A. I wish Mrs. Lippett had named me Zabriski.
        - id: ch07-b10
          speaker: jerusha
          text: >-
            Ackerly only wanted to know whether Monday's lesson began at paragraph sixty-nine or seventy. Then she stayed for one whole hour. She has finally gone.
        - id: ch07-b11
          speaker: jerusha
          text: >-
            Have you ever heard of such a discouraging chain of events? The great disasters aren't what really test your character. Anyone can rise to a crisis and meet a crushing tragedy bravely. But laughing your way through all the tiny dangers of an ordinary day? I truly think that takes spirit.
        - id: ch07-b12
          speaker: jerusha
          text: >-
            That's the kind of character I intend to build. I'm going to pretend that life is a game, and I'll play it as skillfully and fairly as I can. If I lose, I'll shrug and laugh. If I win, I'll laugh then too.
        - id: ch07-b13
          speaker: jerusha
          text: >-
            Anyway, I'm going to be a good sport. You'll never hear me complain again, Daddy dear, not because Julia wears silk stockings, and not because centipedes fall off the wall. Yours ever, Judy.
        - id: ch07-b14
          speaker: jerusha
          text: Answer soon.
