audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 机敏而从容，带着温和的讽刺意味
        timbre: 温暖清亮
        pace: 舒缓而富有变化
        pitch: 中音
    jerusha_abbott:
      display_name: 杰鲁莎·艾博特
      tts:
        delivery: 聪敏直率，克制中透出活泼和想象力
        timbre: 清澈明亮的少女声线
        pace: 自然轻快，紧张时略快
        pitch: 中高音
  chapters:
    - id: ch01
      title: 三月十五日：不是通过，就是粉身碎骨
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 三月十五日，朱迪正在为拉丁文写作补考苦战。
        - id: ch01-b02
          speaker: jerusha_abbott
          text: 亲爱的长腿叔叔，我正在学拉丁文写作。我一直在学，将来还要学，甚至就要一直学下去了。下星期二第七节课补考，我不是通过，就是粉身碎骨。所以下回您收到信时，我要么完完整整、欢欢喜喜，已经摆脱补考，要么就只剩几块碎片。
        - id: ch01-b03
          speaker: jerusha_abbott
          text: 等考完了，我会正经写信。今晚不行，我跟独立夺格有一场非赴不可的约会。匆忙得显而易见的，J. A.
    - id: ch02
      title: 三月二十六日：写给一个东西
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 三月二十六日，她的补考已经结束，信上的称呼却忽然变得一本正经。
        - id: ch02-b02
          speaker: jerusha_abbott
          text: 长腿史密斯先生，您从来不肯回答问题，也从不关心我做了什么。在那群讨厌的董事里，您大概最讨厌。您供我读书，才不是因为在乎我，不过是觉得这是自己的责任。
          emotion: angry
        - id: ch02-b03
          speaker: jerusha_abbott
          text: 我对您一无所知，连名字都不知道。给一个“东西”写信，实在叫人提不起劲。我敢说，您看也不看就把信扔进废纸篓。往后，我只跟您谈功课。
        - id: ch02-b04
          speaker: jerusha_abbott
          text: 上星期，我补考了拉丁文和几何，两门都过了。现在再也没有不及格的科目。谨上，杰鲁莎·艾博特。
    - id: ch03
      title: 四月二日：请原谅这个坏家伙
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 四月二日，朱迪已经在医务室住了六天。
        - id: ch03-b02
          speaker: jerusha_abbott
          text: 亲爱的长腿叔叔，我真是个坏透了的家伙。求您忘了上星期那封可怕的信吧。那晚我寂寞又难受，嗓子也疼。自己还不知道，扁桃体炎、流行性感冒和一大堆病正一起找上门来。
          emotion: sad
        - id: ch03-b03
          speaker: jerusha_abbott
          text: 我在医务室住到今天，她们才第一次准我坐起来，给我纸笔。护士长真爱管人。可我一直想着那封信。您不原谅我，我的病就好不了。
        - id: ch03-b04
          speaker: jerusha_abbott
          text: 您想想我现在的样子。头上缠着绷带，两头竖起来，活像兔耳朵。这样还不能让您同情我吗？我的舌下腺肿了。可我学了整整一年生理学，竟然从没听说过舌下腺。教育真没用！
        - id: ch03-b05
          speaker: jerusha_abbott
          text: 不能再写了。我坐久一点，身上就会发抖。请原谅我的无礼和忘恩负义吧。我从小没有受过好教养。爱您的，朱迪·艾博特。
          emotion: sad
    - id: ch04
      title: 四月四日：第一份真正的礼物
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 四月四日，朱迪还在医务室。可是前一天傍晚，一只白色长盒子送到了她的病床前。
        - id: ch04-b02
          speaker: jerusha_abbott
          text: 最最亲爱的长腿叔叔，昨天天快黑时，我坐在床上看雨。一想到自己又住进这样一座大机构，我就觉得人生无聊透顶。这时护士拿来一只写着我名字的长盒子，里面全是最可爱的粉红玫瑰花苞！
        - id: ch04-b03
          speaker: jerusha_abbott
          text: 更好的是，盒里还有一张卡片。上面的字小小的，向右上方斜着，模样挺有趣，却很见性格，还写着一句客客气气的话。谢谢您，叔叔，一千个谢谢！这些花，是我有生以来收到的第一份真正的礼物。我高兴得躺下来哭了一场。您看，我是不是很像个小孩子？
          emotion: happy
        - id: ch04-b04
          speaker: jerusha_abbott
          text: 如今我总算知道，您真的会读我的信。以后我一定写得有趣些，好让您觉得它们值得用红带子捆好，锁进保险柜。可是那封可怕的信，请您抽出来烧掉。我一想到您也许会重读，就受不了。
        - id: ch04-b05
          speaker: jerusha_abbott
          text: 谢谢您让一个病得厉害、脾气很坏、心里又难受的一年级女生重新高兴起来。您大概有许多爱您的家人和朋友，不明白孤零零是什么滋味。可我明白。
        - id: ch04-b06
          speaker: jerusha_abbott
          text: 再见。我保证再也不那么讨厌了，因为现在我知道，您是个真真切切的人。我也保证，不再拿一大堆问题烦您。
        - id: ch04-b07
          speaker: jerusha_abbott
          text: 不过，您现在还是讨厌女孩子吗？永远属于您的，朱迪。
    - id: ch05
      title: 星期一：董事、癞蛤蟆和旧日收藏
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 到了星期一第八节课，春天和重新露面的癞蛤蟆，勾起了朱迪在孤儿院里的旧事。
        - id: ch05-b02
          speaker: jerusha_abbott
          text: 亲爱的长腿叔叔，坐到癞蛤蟆上的董事应该不是您吧？听说那只蛤蟆“啪”的一声爆了。照这么看，那位董事大概比您胖。
        - id: ch05-b03
          speaker: jerusha_abbott
          text: 约翰·格里尔孤儿院的洗衣房窗外，有几个罩着铁栅的小地坑，您还记得吗？每年春天，癞蛤蟆一出现，我们就开始收藏，把它们养在那些窗坑里。偶尔，蛤蟆会涌进洗衣房，洗衣日立刻乱成一团，我们看着别提多快活了。大人每次都严厉惩罚我们，可怎么罚也没用，蛤蟆照样越聚越多。
        - id: ch05-b04
          speaker: jerusha_abbott
          text: 后来有一天……细节就不拿来烦您了。反正有一只最肥、最大、最多汁的癞蛤蟆，不知怎么钻进董事会议室的一张大皮椅。那天下午，董事们正好来开会。您多半也在，后面的事一定还记得吧？
        - id: ch05-b05
          speaker: jerusha_abbott
          text: 事情过去这么久，我也能冷静回头看了。那顿罚，我们确实该挨。而且要是我没有记错，罚得也相当够分量。
        - id: ch05-b06
          speaker: jerusha_abbott
          text: 不知道今天为什么这样怀旧。大概因为春天到了，癞蛤蟆又出现，我从前那股搜罗东西的兴致也醒了。现在没动手收藏，唯一的原因就是校规没有禁止养癞蛤蟆。
    - id: ch06
      title: 星期四到星期五：蜈蚣和一连串麻烦
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: 星期四礼拜之后，朱迪又拿起了这封信。她眼下最喜欢的书，三天一换，这一次是《呼啸山庄》。
        - id: ch06-b02
          speaker: jerusha_abbott
          text: 艾米莉·勃朗特写那本书时还很年轻，也从没走出哈沃斯教堂墓园。她一辈子根本不认识什么男人，怎么会想得出希斯克利夫这样的人？
        - id: ch06-b03
          speaker: jerusha_abbott
          text: 我可想不出来。我也年轻，也从没走出过约翰·格里尔孤儿院，条件明明全有了。有时我会忽然害怕起来，也许我根本不是天才。叔叔，如果我没能成为大作家，您会不会失望透顶？
        - id: ch06-b04
          speaker: jerusha_abbott
          text: 一到春天，到处又美又绿，嫩芽一簇簇冒出来，我只想不管功课，跑出去跟天气一起玩。田野里有那么多冒险。亲自活进故事，比坐着写故事有趣多了。
        - id: ch06-b05
          speaker: jerusha_abbott
          text: 哎哟！一条蜈蚣从天花板上掉下来了！
          emotion: fearful
        - id: ch06-b06
          speaker: narrator
          text: 这一声尖叫，把莎莉、朱莉娅和走廊对面的四年级女生都招来了。那位四年级女生只嫌恶地停了一会儿。
        - id: ch06-b07
          speaker: jerusha_abbott
          text: 我刚写完上一句，还在想接下来写什么，它就啪嗒一声落下来了。我逃得太急，撞翻了茶桌上的两只杯子。莎莉拿我的发刷，用背面狠狠拍它。那把刷子我这辈子都不可能再用了。蜈蚣的前半截是打死了，可后面五十英尺长的那截钻进五斗柜底下，逃掉了。
        - id: ch06-b08
          speaker: jerusha_abbott
          text: 这宿舍楼太老，外墙又爬满常春藤，所以到处都是蜈蚣。那些东西太可怕了。床底下藏一只老虎，我都情愿。
        - id: ch06-b09
          speaker: narrator
          text: 星期五晚上九点半，她带着一肚子牢骚再次续写。
        - id: ch06-b10
          speaker: jerusha_abbott
          text: 今天的麻烦简直没完！早晨我没听见起床铃。忙着穿衣服时，鞋带断了，领扣还掉进衣领。早餐迟到，第一节课也迟到。我没带吸墨纸，钢笔偏偏漏水。三角课上，我为了一个对数问题跟教授争起来，后来一查，竟然是她对。
        - id: ch06-b11
          speaker: jerusha_abbott
          text: 午饭是炖羊肉和大黄馅饼，我两样都讨厌，因为吃着都有孤儿院的味道。邮差只送来账单，不过我平时也收不到别的，我家里人本来就不写信。下午的英语课又突然随堂笔试。我们进教室时，黑板上已经写着一首诗，老师要大家当场评论。
        - id: ch06-b12
          speaker: jerusha_abbott
          text: 诗里说，我别无所求，所求也未遭拒。我愿用生命换取，那伟大的商人微微一笑。
        - id: ch06-b13
          speaker: jerusha_abbott
          text: 接着又说，“巴西？”他捻着一颗纽扣，看也不看我一眼。“可是，夫人，今天本店没有别的东西可供您挑选了吗？”
        - id: ch06-b14
          speaker: jerusha_abbott
          text: 我不知道诗是谁写的，也不知道它说什么。读第一节时，我以为伟大的商人是位神明，人做了善事，他便赐下福泽。可到了第二节，他竟然捻着纽扣。我觉得刚才的想法简直亵渎神明，赶紧改了主意。全班都一样为难。我们对着空白的纸，脑子也一片空白，足足坐了四十五分钟。受教育真能把人累坏！
        - id: ch06-b15
          speaker: jerusha_abbott
          text: 可这一天还没结束。更糟的还在后面。
        - id: ch06-b16
          speaker: jerusha_abbott
          text: 天下雨，不能打高尔夫，我们只好去体育馆。旁边的女孩挥印度棒，重重撞了我的胳膊肘。回宿舍一看，新买的蓝色春装到了，可裙腰紧得让我坐不下。今天还是扫除日，女佣把桌上的纸全弄乱。甜点叫“墓碑”，是加了香草味的牛奶明胶。晚礼拜又拖了二十分钟，大家只好听一场怎样做个有女人味的女人的演讲。
        - id: ch06-b17
          speaker: jerusha_abbott
          text: 我好不容易松了口气，刚坐下来翻开《一位女士的画像》，阿克利就来了。她面团似的白胖，迟钝得要命，而且没有一刻不迟钝。因为她和我的姓都以A开头，拉丁文课上偏偏坐我旁边。真希望利佩特太太当初给我取名叫扎布里斯基。
        - id: ch06-b18
          speaker: jerusha_abbott
          text: 阿克利只是来问，星期一的功课从第六十九段还是第七十段开始，可她竟然待了整整一个钟头。她才刚走。您听说过这么叫人泄气的一连串遭遇吗？
        - id: ch06-b19
          speaker: jerusha_abbott
          text: 真正考验性格的，不是人生里的大灾大难。危机来了，谁都能振作起来，鼓起勇气面对压垮人的悲剧。可是每天碰到那些琐碎的麻烦，还能笑着应付，我觉得那才真需要精神。
        - id: ch06-b20
          speaker: jerusha_abbott
          text: 我就要练出这样的性格。我要把整个人生当成一场游戏，尽本事、公公平平地玩。输了，就耸耸肩，笑一笑。赢了，也一样。
        - id: ch06-b21
          speaker: jerusha_abbott
          text: 不管怎样，我要做个输得起也赢得起的人。亲爱的叔叔，以后您不会再听见我抱怨朱莉娅穿丝袜，也不会听见我抱怨蜈蚣从墙上掉下来。永远属于您的，朱迪。
        - id: ch06-b22
          speaker: jerusha_abbott
          text: 快回信。
