audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm, observant storytelling with a dry touch of humor
        timbre: clear and gently textured
        pace: measured and flowing
        pitch: medium
    jerusha:
      display_name: Jerusha Abbott
      tts:
        delivery: bright, quick, and candid, with feeling close to the surface
        timbre: youthful and clear
        pace: lively
        pitch: medium-high
    jervie:
      display_name: Master Jervie
      tts:
        delivery: easygoing, witty, and quietly self-assured
        timbre: warm and resonant
        pace: relaxed
        pitch: medium-low
    mrs_semple:
      display_name: Mrs. Semple
      tts:
        delivery: bustling, motherly, and firmly practical
        timbre: full and homely
        pace: brisk
        pitch: medium
  chapters:
    - id: ch01
      title: 25th August
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: August twenty-fifth.
        - id: ch01-b02
          speaker: jerusha
          text: >-
            Well, Daddy, Master Jervie is here, and we're having the nicest time. At least I am, and I think he is too. He's stayed ten days already, with no sign that he means to leave. Mrs. Semple spoils him terribly. If she treated him this way as a baby, I can't imagine how he grew up so well.
        - id: ch01-b03
          speaker: jerusha
          text: >-
            We eat at a little table on the side porch, or under the trees. If it's rainy or cold, we use the best parlor. He chooses the place, and Carrie trots after him carrying the table. When she's had an especially troublesome trip with the dishes, she finds a dollar tucked under the sugar bowl.
        - id: ch01-b04
          speaker: jerusha
          text: >-
            He's wonderfully good company, though you'd never guess it from a quick look. At first he seems like a perfect Pendleton, but he isn't. He's simple and natural and sweet. That sounds like a strange word for a man, but it's true.
        - id: ch01-b05
          speaker: jerusha
          text: >-
            He's very good with the farmers, too. He meets them as one man meeting another, and they stop feeling suspicious at once. They didn't trust him at first because of his clothes. And honestly, his clothes are astonishing. He wears knickerbockers, pleated jackets, white flannels, and riding clothes with puffed trousers.
        - id: ch01-b06
          speaker: jerusha
          text: >-
            Whenever he appears in something new, Mrs. Semple beams and circles around to admire him from every side. Then she warns him to watch where he sits because she can't bear the thought of dust getting on him. It bores him dreadfully. He always tells her this.
        - id: ch01-b07
          speaker: jervie
          text: >-
            Go on, Lizzie. You have work to do. You can't order me around anymore. I'm grown up now.
        - id: ch01-b08
          speaker: jerusha
          text: >-
            It's so funny to imagine that tall, long-legged man sitting on Mrs. Semple's lap while she washed his face. He's almost as long-legged as you, Daddy. And you should see her lap now! She has two laps and three chins. He says she used to be thin and wiry and quick enough to outrun him.
        - id: ch01-b09
          speaker: jerusha
          text: >-
            We're having adventure after adventure. We've explored for miles. I've learned to fish with funny little feather flies, shoot a rifle and a revolver, and ride a horse. Old Grove has a surprising amount of life in him. After we fed him oats for three days, he shied at a calf and nearly ran away with me.
    - id: ch02
      title: Wednesday
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: Wednesday.
        - id: ch02-b02
          speaker: jerusha
          text: >-
            On Monday afternoon, we climbed Sky Hill. It's a mountain near here. It isn't terribly high, and there's no snow on top, but you're certainly out of breath when you get there. Woods cover the lower slopes. At the summit, there are only heaps of rock and open moorland.
        - id: ch02-b03
          speaker: jerusha
          text: >-
            We stayed to watch the sunset, built a fire, and cooked supper. Master Jervie took charge of the cooking because he said he knew more about it than I did. He was right. He's used to camping.
        - id: ch02-b04
          speaker: jerusha
          text: >-
            We walked down by moonlight. When we reached the dark trail through the woods, he pulled an electric light from his pocket. It was such fun! He laughed and joked the whole way and talked about all sorts of interesting things. He's read every book I've read, and many more. It's amazing how much he knows.
        - id: ch02-b05
          speaker: jerusha
          text: >-
            This morning we took a long walk and got caught in a storm. By the time we reached home, our clothes were dripping, but our good spirits weren't damp at all. You should have seen Mrs. Semple when we walked into her kitchen.
        - id: ch02-b06
          speaker: mrs_semple
          text: >-
            Oh, Master Jervie! Miss Judy! You're soaked through! Dear, dear, what am I going to do? That lovely new coat is completely ruined!
          emotion: surprised
        - id: ch02-b07
          speaker: jerusha
          text: >-
            She was so funny. You'd have thought we were ten years old and she was our frantic mother. For a while, I was afraid she might punish us by withholding the jam at tea.
    - id: ch03
      title: Saturday and Sunday Night
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: Saturday.
        - id: ch03-b02
          speaker: jerusha
          text: >-
            I began this letter ages ago, but I haven't had one spare second to finish it. Here's a lovely thought from Stevenson. The world holds so many different things that surely we should all be as happy as kings.
        - id: ch03-b03
          speaker: jerusha
          text: >-
            It's true. There's happiness everywhere, with enough for everyone, if you're willing to accept whatever kind comes your way. The whole secret is being flexible. The country is especially full of amusing things. I can cross anyone's land, admire anyone's view, and splash in anyone's brook. I enjoy it as much as if I owned it all, without paying any taxes.
        - id: ch03-b04
          speaker: jerusha
          text: >-
            Now it's Sunday night, around eleven. I ought to be getting my beauty sleep, but I drank black coffee at dinner, so there will be no beauty sleep for me.
        - id: ch03-b05
          speaker: jerusha
          text: >-
            This morning Mrs. Semple spoke to Mr. Pendleton in a very determined voice.
        - id: ch03-b06
          speaker: mrs_semple
          text: >-
            We must leave at ten fifteen if we're going to reach church by eleven.
        - id: ch03-b07
          speaker: jervie
          text: >-
            All right, Lizzie. Have the buggy ready. If I'm not dressed, go ahead without me.
        - id: ch03-b08
          speaker: mrs_semple
          text: We'll wait for you.
        - id: ch03-b09
          speaker: jervie
          text: >-
            Suit yourself. Just don't leave the horses standing too long.
        - id: ch03-b10
          speaker: jerusha
          text: >-
            While she was getting dressed, he had Carrie pack a lunch and told me to hurry into my walking clothes. Then we slipped out the back way and went fishing.
        - id: ch03-b11
          speaker: jerusha
          text: >-
            This upset the household dreadfully because Sunday dinner at Lock Willow is served at two. But he ordered dinner for seven. He orders meals whenever he likes, as if the farm were a restaurant. That kept Carrie and Amasai from taking their drive.
        - id: ch03-b12
          speaker: jerusha
          text: >-
            Master Jervie said that was for the best because they shouldn't go driving without a chaperone. Besides, he wanted the horses so he could take me driving. Have you ever heard anything so funny?
        - id: ch03-b13
          speaker: jerusha
          text: >-
            Poor Mrs. Semple believes anyone who fishes on Sunday will end up in a sizzling hot hell. She's terribly worried that she failed to train him properly when he was small and helpless. And she had wanted to show him off at church.
        - id: ch03-b14
          speaker: jerusha
          text: >-
            Anyway, we went fishing. He caught four little fish, and we cooked them over a campfire for lunch. They kept sliding off our pointed sticks into the flames, so they tasted a bit like ashes. We ate them anyway.
        - id: ch03-b15
          speaker: jerusha
          text: >-
            We came home at four, went driving at five, and ate dinner at seven. At ten I was sent to bed, and now here I am, writing to you. I am starting to feel sleepy, though. Good night.
        - id: ch03-b16
          speaker: jerusha
          text: Here's a picture of the one fish I caught.
    - id: ch04
      title: Ship Ahoy
      blocks:
        - id: ch04-b01
          speaker: jerusha
          text: >-
            Ship ahoy, Captain Long-Legs! Avast! Belay! Yo ho ho, and a bottle of rum! Can you guess what I'm reading? For two days, all our talk has been about ships and pirates.
        - id: ch04-b02
          speaker: jerusha
          text: >-
            Isn't Treasure Island fun? Did you ever read it, or had it not been written when you were a boy? Stevenson received only thirty pounds for the serial rights. I don't believe being a great author pays very well. Perhaps I'll become a schoolteacher instead.
        - id: ch04-b03
          speaker: jerusha
          text: >-
            Forgive me for stuffing my letters with Stevenson. He's taking up most of my thoughts right now, and nearly all of Lock Willow's library.
        - id: ch04-b04
          speaker: jerusha
          text: >-
            I've worked on this letter for two weeks, and it's surely long enough. Never claim I don't give you details, Daddy. I wish you were here with us. We'd all have such a good time. I like my different friends to meet each other.
        - id: ch04-b05
          speaker: jerusha
          text: >-
            I wanted to ask Mr. Pendleton whether he knows you in New York. It seems possible. You must belong to the same grand social circles, and you're both interested in reforms and things. But I couldn't ask because I don't know your real name.
        - id: ch04-b06
          speaker: jerusha
          text: >-
            Not knowing your name is the silliest thing I've ever heard of. Mrs. Lippett warned me you were eccentric. She was certainly right. Affectionately, Judy.
        - id: ch04-b07
          speaker: jerusha
          text: >-
            Postscript. Now that I've read this letter over, I see it isn't entirely about Stevenson. There may be one or two passing mentions of Master Jervie.
    - id: ch05
      title: 10th September
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: September tenth.
        - id: ch05-b02
          speaker: jerusha
          text: >-
            Dear Daddy, he's gone, and we miss him! Once you grow used to a person, a place, or a way of living, and then it's suddenly taken away, it leaves a hollow, hungry feeling. Mrs. Semple's conversation seems rather flavorless now.
          emotion: sad
        - id: ch05-b03
          speaker: jerusha
          text: >-
            College begins in two weeks, and I'll be glad to work again. I have done quite a lot this summer, though. I've written six short stories and seven poems. Every piece I sent to a magazine came back with impressive speed and perfect politeness. I don't mind. It's useful practice.
        - id: ch05-b04
          speaker: jerusha
          text: >-
            Master Jervie read them because he brought in the mail and couldn't help finding out about them. He said they were dreadful. According to him, they proved I had no idea what I was writing about. Master Jervie never lets politeness get in the way of the truth.
        - id: ch05-b05
          speaker: jerusha
          text: >-
            But the last thing I wrote was a little story set at college, and he said it wasn't bad. He had it typed for me, and I sent it to a magazine. They've kept it for two weeks. Maybe they're considering it.
        - id: ch05-b06
          speaker: jerusha
          text: >-
            You should see the sky. Everything is covered in the strangest orange light. A storm must be coming.
        - id: ch05-b07
          speaker: jerusha
          text: >-
            It began the instant I wrote that. Huge drops came down, and all the shutters started banging. I ran to shut the windows while Carrie hurried to the attic with an armful of milk pans for the leaks in the roof.
        - id: ch05-b08
          speaker: jerusha
          text: >-
            Just as I sat down to write again, I remembered the cushion, rug, hat, and Matthew Arnold's poems that I'd left beneath a tree in the orchard. I dashed out to rescue them and got completely soaked. The book's red cover bled into the pages. From now on, Dover Beach will have pink waves.
        - id: ch05-b09
          speaker: jerusha
          text: >-
            A country storm is terribly disruptive. There are always so many outdoor things to remember before they're spoiled.
        - id: ch05-b10
          speaker: narrator
          text: Thursday.
        - id: ch05-b11
          speaker: jerusha
          text: >-
            Daddy! Daddy! Guess what! The postman has just brought two letters.
          emotion: surprised
        - id: ch05-b12
          speaker: jerusha
          text: >-
            First, my story has been accepted. Fifty dollars! So there it is. I'm an author!
          emotion: happy
        - id: ch05-b13
          speaker: jerusha
          text: >-
            Second, the college secretary says I've won a scholarship for two years. It will pay for my room and tuition. The scholarship is for outstanding ability in English and general excellence in other subjects. And I won it!
          emotion: happy
        - id: ch05-b14
          speaker: jerusha
          text: >-
            I applied before I left college, but I never thought I would get it after my poor freshman work in math and Latin. It seems I've made up for that. I'm so glad, Daddy, because I won't cost you as much now. All I'll need is my monthly allowance, and perhaps I can earn even that by writing or tutoring or something.
        - id: ch05-b15
          speaker: jerusha
          text: >-
            I'm longing to go back and begin working. Yours always, Jerusha Abbott, author of When the Sophomores Won the Game. Available at every newsstand for ten cents.
