audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 叙述者
      tts:
        delivery: 清楚沉静，简洁报出书信日期与场景转换
        timbre: 温暖清澈
        pace: 舒缓
        pitch: 中音
    judy:
      display_name: 朱迪
      tts:
        delivery: 聪敏直率，像把心事和见闻亲口讲给亲近的人
        timbre: 明亮自然的年轻女声
        pace: 轻快而富于变化，伤心时稍慢
        pitch: 中高音
    jervie:
      display_name: 杰维少爷
      tts:
        delivery: 随和坦率，带一点顽皮和不拘礼数
        timbre: 温暖清朗的成年男声
        pace: 从容
        pitch: 中低音
    mrs_semple:
      display_name: 森普尔太太
      tts:
        delivery: 热心操持，关切中带着不容商量的坚持
        timbre: 厚实亲切的年长女声
        pace: 稍慢
        pitch: 中音
  chapters:
    - id: ch01
      title: 8月25日：杰维少爷来了
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 8月25日，杰维少爷已经来到洛克威洛十天了。朱迪写信告诉长腿叔叔，这位客人丝毫没有要走的意思。
        - id: ch01-b02
          speaker: judy
          text: 叔叔，我们过得快活极了！至少我很快活，我想杰维少爷也是。森普尔太太宠他宠得简直不像话。要是他小时候也受这般纵容，我真不懂他怎么还能长得这么好。
          emotion: happy
        - id: ch01-b03
          speaker: judy
          text: 我们两个人吃饭的地方全听他挑。有时在侧廊，有时在树下，天冷或下雨才进家里最体面的客厅。他看中哪里，凯丽就扛着小桌子一路小跑着跟过去。要是害她端着盘子走得太远，她过后准会在糖罐下面找到一美元。
        - id: ch01-b04
          speaker: judy
          text: 偶然见上一面，谁也想不到他会这么好相处。他看着像个十足的彭德尔顿，其实一点儿也不像。他朴素自然，性情温柔。拿温柔形容一个男人好像挺怪，可这是真的。附近的农民起初不信任他，尤其看不上他的衣服。可他把他们当平等的男子汉，一见面就让人放下戒心。话说回来，他那些灯笼裤、打褶上衣、白法兰绒衣服和鼓着裤腿的骑马装，的确很惊人。
        - id: ch01-b05
          speaker: judy
          text: 每次他穿新衣服下楼，森普尔太太都满脸骄傲，围着他前后打量，还不住叮嘱他别坐到灰尘上。他烦得要命，总要赶她走。
        - id: ch01-b06
          speaker: jervie
          text: 莉齐，你快忙自己的事去吧。如今我已经长大，你管不了我啦。
        - id: ch01-b07
          speaker: judy
          text: 想到这么个高高大大、腿长得快赶上您的男人，也曾坐在森普尔太太膝头让她洗脸，真是好笑。尤其她如今有两层膝头、三层下巴！可他说，她年轻时又瘦又结实，动作飞快，跑得比他还快。
        - id: ch01-b08
          speaker: judy
          text: 我们还经历了好多冒险。四周方圆几英里的乡野都探过了。我学会用羽毛做成的古怪小飞蝇钓鱼，也学会打步枪和左轮手枪，甚至还会骑马了。您绝对想不到，老格罗弗身上竟然藏着那么多活力。我们连续喂了他三天燕麦，他一看见小牛就猛地受惊，险些驮着我一路逃跑。
    - id: ch02
      title: 星期三：天山与暴雨
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 到了星期三，朱迪又添上他们星期一攀登天山的经历。
        - id: ch02-b02
          speaker: judy
          text: 天山就在附近，不算太高，山顶连雪都没有，可爬上去照样喘得厉害。山坡下半截全是树林，到了顶上，就只剩堆叠的岩石和一片空旷荒原。我们留在那里看完日落，又生火做了晚饭。杰维少爷说他比我会做，非要自己下厨。事实证明他的确更在行，因为他常去露营。
        - id: ch02-b03
          speaker: judy
          text: 我们趁着月光一路下山。等走进黑漆漆的林间小道，连月光也照不进来了，他便从口袋里拿出一只电筒照路。一路上，他说笑个不停，还讲了许多有意思的事。我读过的书，他一本不落地读过，此外还读过好多别的书。他懂的东西实在多得惊人。
        - id: ch02-b04
          speaker: judy
          text: 今天早上，我们走远路时遇上暴雨。回到家，衣服已经湿透，兴致却丝毫没被淋湿。我们滴着水走进厨房，森普尔太太那张脸才叫精彩。
        - id: ch02-b05
          speaker: mrs_semple
          text: 哎哟，杰维少爷，朱迪小姐！你们浑身都湿透了。这可怎么办呀？那件好端端的新外套全毁了！
          emotion: surprised
        - id: ch02-b06
          speaker: judy
          text: 她急得仿佛我们只有十岁，而她是操碎了心的母亲。我一度还担心，她会罚掉我们下午茶的果酱呢。
    - id: ch03
      title: 周末：星期日逃去钓鱼
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 星期六，朱迪承认，这封信开了头很久，却一直忙得没空写完。她想起史蒂文森的两句诗。
        - id: ch03-b02
          speaker: judy
          text: 世间万物多又多，人人都该乐如王。这话是真的。世界上的快乐足够大家分享，只要愿意接住落到自己手里的那一种。秘诀就是懂得变通。乡下尤其好玩，我能走过别人的田地，看别人的风景，在别人的小溪里玩水，享受得像个地主，却不用交税。
        - id: ch03-b03
          speaker: judy
          text: 现在是星期日晚上十一点。我本该去睡美容觉，可晚饭喝了黑咖啡，今晚是别想睡了。今天早晨，森普尔太太斩钉截铁地告诉杰维少爷，我们十点一刻必须出门，才赶得上十一点的礼拜。
        - id: ch03-b04
          speaker: mrs_semple
          text: 我们十点一刻准时走。再晚就赶不到教堂了。
        - id: ch03-b05
          speaker: jervie
          text: 好吧，莉齐。你叫人备好马车。到时候我还没穿好，你们就先走，别等我。
        - id: ch03-b06
          speaker: mrs_semple
          text: 我们会等你。
        - id: ch03-b07
          speaker: jervie
          text: 那也随你，只是别让马站得太久。
        - id: ch03-b08
          speaker: judy
          text: 她一上楼换衣服，他立刻叫凯丽收拾一份午饭，又催我赶紧穿上走路的衣服。我们从后门悄悄溜走，钓鱼去了。这可把全家的安排搅得一团糟。洛克威洛星期日一向在两点吃正餐，他偏偏命令大家改到七点。他想什么时候开饭，就让人什么时候开饭，简直把这里当成了餐馆。凯丽和阿马赛原本要驾车出去，也被他这一改耽误了。
        - id: ch03-b09
          speaker: judy
          text: 他却说，这样反倒更好。没有年长的人陪着，凯丽和阿马赛两个人一起出去，本来也不合规矩。况且他自己还要用那些马，带我坐车兜风。您说，这是不是好笑透了？森普尔太太深信，星期日钓鱼的人死后会掉进烧得咝咝响的地狱。她懊恼自己当年没趁他年幼无助时好好管教他，还错过了把他带去教堂给众人瞧的机会。
        - id: ch03-b10
          speaker: judy
          text: 我们到底还是钓了鱼。他捉到四条小鱼，中午就架在篝火上当午饭。那些鱼老从尖棍上滑下来，直接掉进火里，所以吃着有一股炉灰味，不过我们照样吃光了。四点钟回家，五点钟坐车出去，七点钟吃正餐，到了十点，我被打发上床。现在我正坐在床上给您写这些事。不过，我真的有点困了。晚安。这儿还有我钓到的唯一一条鱼的画像。
    - id: ch04
      title: 长腿船长与信的结尾
      blocks:
        - id: ch04-b01
          speaker: judy
          text: 船来喽，长腿船长！停船，站稳，哟嗬嗬，再来一瓶朗姆酒！猜猜我在看什么？这两天，我们开口闭口全是水手和海盗的黑话。《金银岛》实在太有趣了。您到底读过没有？还是您当小男孩的时候，它压根儿还没写出来？史蒂文森卖掉这本书的连载版权，竟然只得了三十英镑。看来做大作家并不划算，也许我还是去当学校教师吧。
          emotion: happy
        - id: ch04-b02
          speaker: judy
          text: 请原谅我满纸都在说史蒂文森。眼下他占满了我的脑子。至于洛克威洛的藏书，说穿了也全由他一个人包办。这封信断断续续写了两个星期，我想已经够长了。您以后可千万别说我写信不给细节。
        - id: ch04-b03
          speaker: judy
          text: 真希望您也在这儿，我们大家一定会玩得很快活。我喜欢让自己在各处认识的朋友彼此结识。我很想问问彭德尔顿先生，他在纽约认不认识您。我觉得他多半认识。你们来往的大概是同样高不可攀的社交圈，而且你们两个人都关心改革之类的事。可我一句也问不了，因为直到现在，我连您的真名都不知道。
        - id: ch04-b04
          speaker: judy
          text: 连您的名字都不知道，实在荒唐透顶。利佩特太太早就说您是个怪人。她可说对了！深深爱您的朱迪。又及，我重读以后发现，这封信也不全是史蒂文森，中间还顺便提过一两次杰维少爷。
    - id: ch05
      title: 9月10日：两封好消息
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 9月10日，杰维少爷已经离开洛克威洛。朱迪又写了一封信。
        - id: ch05-b02
          speaker: judy
          text: 亲爱的长腿叔叔，他已经走了，我们大家都在想念他！一个人、一处地方，甚至一种过日子的方式，只要慢慢习惯了，忽然又被人从身边拿走，心里就会留下一个空荡荡的窟窿，还一直隐隐地啃咬着人。如今再听森普尔太太谈话，简直像天天吃没有放盐的东西。
          emotion: sad
        - id: ch05-b03
          speaker: judy
          text: 再过两周大学开学，我很高兴又能用功。这个暑假我也没闲着，写了六篇短篇小说和七首诗。凡是投给杂志的作品，全都礼貌得无可挑剔，又迅速得惊人地退了回来。没关系，就当练习。杰维少爷替大家把邮件拿进屋，我怎么也瞒不了他。他读完便说，那些作品糟透了，明摆着我根本不懂自己写的东西。他从不肯为了礼貌少说一句真话。
        - id: ch05-b04
          speaker: judy
          text: 最后一篇只是个以大学为背景的小故事，他倒说还不坏。他找人替我把稿子打了出来，我便寄给一家杂志。那份稿子在他们手里已经放了两个星期，也许编辑正在考虑。您真该看看现在的天空。田野和房屋上全罩着一层古怪的橙黄色光。暴风雨马上要来了。
        - id: ch05-b05
          speaker: narrator
          text: 朱迪刚写完这句话，大颗雨点就砸了下来，百叶窗也一齐乱响。
        - id: ch05-b06
          speaker: judy
          text: 我赶忙去关窗。凯丽抱着一大摞牛奶盆冲上阁楼，把盆一个个摆到屋顶漏雨的地方。我刚坐回来重新拿起笔，又记起果园树下还丢着一个靠垫、一张小毯、一顶帽子和马修·阿诺德的诗集，只得冲进雨里抢救。等拿回来，它们已经全湿透了。诗集的红封面还把颜色染进了书页。往后，《多佛海滩》里可要翻粉红色的浪了。乡下一下暴雨，真叫人不得安生。留在外面的东西太多，眼看样样都要淋坏，什么都得惦记。
        - id: ch05-b07
          speaker: narrator
          text: 到了星期四，邮差送来两封信。朱迪一拿到手，就激动地喊起了叔叔。
        - id: ch05-b08
          speaker: judy
          text: 叔叔！叔叔！您猜发生了什么？第一封信说，我的小说被采用了，稿费五十美元。那么，我成了作家啦！
          emotion: happy
        - id: ch05-b09
          speaker: judy
          text: 第二封来自大学秘书。学校给了我一笔为期两年的奖学金，膳宿费和学费全都包括在内。这项奖学金专门给英文成绩卓越、其他各科也普遍优秀的学生，而我竟然得到了！离校以前我申请过，可一年级时，我的数学和拉丁文实在太糟，压根儿没指望自己会入选。看来后来总算把那些坏成绩补了上来。
          emotion: happy
        - id: ch05-b10
          speaker: judy
          text: 叔叔，我真是高兴极了。以后我不会再给您添那么重的负担，只需要每月的零用钱就够了。说不定连这笔钱，我也能靠写作、替人补课或别的办法自己挣出来。我一心盼着回学校，重新开始用功，简直都要盼疯了。永远属于您的，杰鲁莎·艾博特，《二年级生赢得比赛》作者。各家报摊均有出售，每册只卖十美分。
          emotion: happy
