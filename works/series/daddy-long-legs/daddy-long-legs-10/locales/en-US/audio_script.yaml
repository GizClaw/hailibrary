audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm, observant storytelling with a dry touch of humor
        timbre: clear and gently textured
        pace: measured and flowing
        pitch: medium
    jerusha:
      display_name: Jerusha Abbott
      tts:
        delivery: bright, quick, and candid, with feeling close to the surface
        timbre: youthful and clear
        pace: lively
        pitch: medium-high
  chapters:
    - id: ch01
      title: 2nd June
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: June second.
        - id: ch01-b02
          speaker: jerusha
          text: >-
            Dear Daddy-Long-Legs, you will never guess the wonderful thing that's happened. The McBrides have invited me to spend the summer at their camp in the Adirondacks!
        - id: ch01-b03
          speaker: jerusha
          text: >-
            They belong to a club on a lovely little lake deep in the woods. The members have log houses scattered among the trees. They canoe on the lake, walk along trails to other camps, and dance once a week at the clubhouse. Jimmie McBride will have a college friend visiting for part of the summer, so we'll have plenty of men to dance with.
        - id: ch01-b04
          speaker: jerusha
          text: >-
            Wasn't it sweet of Mrs. McBride to invite me? She must have liked me when I visited at Christmas.
        - id: ch01-b05
          speaker: jerusha
          text: >-
            Please excuse such a short note. This isn't a real letter. I only wanted you to know that my summer is settled. Yours, in a very contented frame of mind, Judy.
    - id: ch02
      title: 5th June
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: June fifth.
        - id: ch02-b02
          speaker: jerusha
          text: >-
            Dear Daddy-Long-Legs, your secretary has written to say that Mr. Smith would rather I didn't accept Mrs. McBride's invitation. I'm supposed to go back to Lock Willow, just as I did last summer.
        - id: ch02-b03
          speaker: jerusha
          text: Why, why, why, Daddy?
          emotion: surprised
        - id: ch02-b04
          speaker: jerusha
          text: >-
            You don't understand. Mrs. McBride truly wants me there. I won't be any trouble. I'll help. They don't bring many servants to camp, and Sallie and I can make ourselves useful. It would be a wonderful chance to learn how to keep a house. Every woman ought to know that, and all I know is how to keep an asylum.
        - id: ch02-b05
          speaker: jerusha
          text: >-
            There are no other girls our age at camp, so Mrs. McBride wants me to keep Sallie company. Sallie and I plan to do plenty of reading together. We'll finish all the books for next year's English and sociology classes. Our professor said summer reading would help us, and it is much easier to remember a book when you read it together and talk about it.
        - id: ch02-b06
          speaker: jerusha
          text: >-
            Just living in the same house with Sallie's mother would be an education. She is the most interesting, entertaining, friendly, charming woman in the world. She knows everything. After all those summers with Mrs. Lippett, think how much I would appreciate the difference.
        - id: ch02-b07
          speaker: jerusha
          text: >-
            You needn't worry that I would crowd them. Their house seems to be made of rubber. When too many guests arrive, they put up tents in the woods and send the boys outside.
        - id: ch02-b08
          speaker: jerusha
          text: >-
            It would be such a happy, healthy summer, with every minute spent outdoors. Jimmie McBride would teach me to ride a horse, paddle a canoe, shoot, and do all sorts of things I ought to know. I've never had that kind of cheerful, carefree time. I think every girl deserves one summer like it.
        - id: ch02-b09
          speaker: jerusha
          text: >-
            Of course I'll do exactly what you say. But please, please let me go, Daddy. I've never wanted anything so much. This isn't Jerusha Abbott, the future great author, writing to you. It's only Judy, a girl.
          emotion: sad
    - id: ch03
      title: 9th June
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: June ninth.
        - id: ch03-b02
          speaker: jerusha
          text: >-
            Mr. John Smith, sir. I have received your letter of the seventh. Following the orders sent through your secretary, I will leave next Friday to spend the summer at Lock Willow Farm. I hope always to remain, Miss Jerusha Abbott.
    - id: ch04
      title: 3rd August
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: Lock Willow Farm, August third.
        - id: ch04-b02
          speaker: jerusha
          text: >-
            Dear Daddy-Long-Legs, it has been almost two months since I wrote. That wasn't nice of me, I know. But I haven't loved you very much this summer. There, I'm being honest.
        - id: ch04-b03
          speaker: jerusha
          text: >-
            You can't imagine how disappointed I was to give up the McBrides' camp. I know you're my guardian, and I must respect your wishes in everything. But I couldn't see any reason for it. Going to camp was clearly the best thing that could have happened to me.
          emotion: sad
        - id: ch04-b04
          speaker: jerusha
          text: >-
            If I had been Daddy and you had been Judy, I would have said, "Bless you, my child. Go have a good time. Meet new people and learn new things. Live outdoors, grow strong and healthy, and rest before another year of hard work."
        - id: ch04-b05
          speaker: jerusha
          text: >-
            But that isn't what happened. All I got was one short line from your secretary, ordering me to Lock Willow.
        - id: ch04-b06
          speaker: jerusha
          text: >-
            It hurts that your orders are so impersonal. If you cared even the tiniest bit for me the way I care for you, surely you would sometimes send a message in your own handwriting. Instead, I get those horrible typewritten notes from your secretary. If you gave me the smallest sign that you cared, I would do anything in the world to please you.
          emotion: sad
        - id: ch04-b07
          speaker: jerusha
          text: >-
            I know our agreement was that I would write long, pleasant, detailed letters and never expect an answer. You're keeping your side of it. I'm getting an education. And perhaps you think I'm not keeping mine.
        - id: ch04-b08
          speaker: jerusha
          text: >-
            But Daddy, it is a hard agreement. It truly is. I'm terribly lonely. You're the only person I have to care about, and you're no more than a shadow. You're an imaginary man I made up, and the real you is probably nothing like him.
          emotion: sad
        - id: ch04-b09
          speaker: jerusha
          text: >-
            Still, when I was sick in the infirmary, you sent me one message. Now, whenever I feel completely forgotten, I take out your card and read it again.
        - id: ch04-b10
          speaker: jerusha
          text: >-
            This isn't what I meant to tell you at all. What I meant was this. My feelings are still hurt. It is humiliating to be picked up and moved around by an all-powerful, invisible Providence who is bossy, unreasonable, and never explains anything.
        - id: ch04-b11
          speaker: jerusha
          text: >-
            Even so, you've been kind, generous, and thoughtful to me before. I suppose that gives you the right to be an unreasonable invisible Providence whenever you choose. So I forgive you, and I'll be cheerful again. But I still don't enjoy Sallie's letters about all the fun they're having at camp.
        - id: ch04-b12
          speaker: jerusha
          text: >-
            Now let's draw a curtain over the whole thing and begin again. I've spent the summer writing and writing. I've finished four short stories and sent them to four different magazines. You see, I really am trying to become an author.
        - id: ch04-b13
          speaker: jerusha
          text: >-
            I've made a workroom in one corner of the attic, where Master Jervie used to play on rainy days. It is cool and breezy, with two dormer windows. A maple tree shades it, and a family of red squirrels lives in a hole in the tree.
        - id: ch04-b14
          speaker: jerusha
          text: >-
            I'll write a nicer letter in a few days and tell you all the farm news. We need rain. Yours as ever, Judy.
    - id: ch05
      title: 10th August
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: August tenth.
        - id: ch05-b02
          speaker: jerusha
          text: >-
            Mr. Daddy-Long-Legs, sir. I'm writing from the second fork of the willow tree beside the pasture pool. A frog is croaking below me, a locust is singing overhead, and two little devil downheads keep darting up and down the trunk.
        - id: ch05-b03
          speaker: jerusha
          text: >-
            I've been sitting here for an hour. This fork is quite comfortable now that I've padded it with two sofa cushions. I climbed up with a pen and writing tablet, hoping to create an immortal short story. But my heroine has been giving me a dreadful time. I can't make her behave the way I want, so I've left her alone for a while and turned to you. It isn't much of a relief, though. I can't make you behave the way I want, either.
        - id: ch05-b04
          speaker: jerusha
          text: >-
            If you're trapped in dreadful New York, I wish I could send you some of this bright, breezy, sunny view. After a week of rain, the country feels like heaven.
        - id: ch05-b05
          speaker: jerusha
          text: >-
            That reminds me of Mr. Kellogg, the minister at the little white church at the Corners. I told you about him last summer. The poor old man died of pneumonia last winter. I heard him preach half a dozen times, so I knew his theology quite well.
        - id: ch05-b06
          speaker: jerusha
          text: >-
            He believed exactly the same things at the end that he believed at the beginning. Anyone who can think for forty-seven years without changing a single idea ought to be kept in a glass cabinet as a curiosity. I hope he's enjoying his harp and golden crown. He was perfectly certain they would be waiting for him.
        - id: ch05-b07
          speaker: jerusha
          text: >-
            A very important young minister has taken his place. The congregation isn't sure about him, especially the group led by Deacon Cummings. It looks as if the church may split apart. People in this neighborhood don't care for new ideas in religion.
        - id: ch05-b08
          speaker: jerusha
          text: >-
            During that rainy week, I stayed in the attic and read wildly, mostly Stevenson. I find Stevenson himself more entertaining than any character in his books. I suspect he made himself into the sort of hero who would look good in print.
        - id: ch05-b09
          speaker: jerusha
          text: >-
            Wasn't it perfect of him to spend the entire ten thousand dollars his father left him on a yacht, then sail away to the South Seas? He lived exactly as his adventurous beliefs told him to. If my father had left me ten thousand dollars, I would do the same.
        - id: ch05-b10
          speaker: jerusha
          text: >-
            Just thinking of Vailima makes me restless. I want to see the tropics. I want to see the whole world. I'm going to become a great author, artist, actress, playwright, or whatever kind of great person I finally turn out to be.
        - id: ch05-b11
          speaker: jerusha
          text: >-
            I have a terrible case of wanderthirst. One look at a map makes me want to put on my hat, pick up an umbrella, and set out. Before I die, I shall see the palms and temples of the South.
        - id: ch05-b12
          speaker: narrator
          text: Thursday evening at twilight, sitting on the doorstep.
        - id: ch05-b13
          speaker: jerusha
          text: >-
            It is very hard to put any news into this letter. Judy has grown so philosophical lately that she wants to discuss the whole wide world, not come down to the small details of daily life. But if you insist on news, here it is.
        - id: ch05-b14
          speaker: jerusha
          text: >-
            Last Tuesday, our nine young pigs crossed the brook and ran away. Only eight came home. We don't want to accuse anyone unfairly, but we suspect Widow Dowd now has one pig more than she should.
        - id: ch05-b15
          speaker: jerusha
          text: >-
            Mr. Weaver painted his barn and both silos a bright pumpkin yellow. It is a very ugly color, but he says it will last.
        - id: ch05-b16
          speaker: jerusha
          text: >-
            The Brewers have visitors this week. Mrs. Brewer's sister and her two nieces have come from Ohio.
        - id: ch05-b17
          speaker: jerusha
          text: >-
            One of our Rhode Island Reds hatched only three chicks from fifteen eggs. We can't imagine what went wrong. In my opinion, Rhode Island Reds are a very poor breed. I prefer Buff Orpingtons.
        - id: ch05-b18
          speaker: jerusha
          text: >-
            The new clerk at the Bonnyrigg Four Corners post office drank their entire stock of Jamaica ginger before anyone discovered it. Seven dollars' worth!
        - id: ch05-b19
          speaker: jerusha
          text: >-
            Old Ira Hatch has rheumatism and can't work anymore. He never saved while he was earning good wages, so now the town has to support him.
        - id: ch05-b20
          speaker: jerusha
          text: >-
            There will be an ice-cream social at the schoolhouse next Saturday evening. Come, and bring your families.
        - id: ch05-b21
          speaker: jerusha
          text: >-
            I have a new hat from the post office. It cost twenty-five cents. Imagine this as my latest portrait, wearing it on my way to rake hay.
        - id: ch05-b22
          speaker: jerusha
          text: >-
            It is getting too dark to see, and I've used up all the news anyway. Good night, Judy.
        - id: ch05-b23
          speaker: narrator
          text: Friday.
        - id: ch05-b24
          speaker: jerusha
          text: >-
            Good morning! Now I have news. Who do you think is coming to Lock Willow? You would never, never, never guess. Mrs. Semple has a letter from Mr. Pendleton.
          emotion: happy
        - id: ch05-b25
          speaker: jerusha
          text: >-
            He's driving through the Berkshires and has grown tired. He wants to rest at a nice, quiet farm. If he happens to arrive at her door one evening, could she have a room ready? He may stay for one week, two weeks, or three. He'll decide after he sees how restful it is here.
        - id: ch05-b26
          speaker: jerusha
          text: >-
            What a commotion we're in! The whole house is being cleaned, and every curtain is being washed. I'm driving to the Corners this morning for new oilcloth in the entry and two cans of brown paint for the hall floor and back stairs.
        - id: ch05-b27
          speaker: jerusha
          text: >-
            Mrs. Dowd is coming tomorrow to wash the windows. Because this is an emergency, we've put aside our suspicions about the missing piglet. You might think the house wasn't already spotless, but I promise you it was. Whatever Mrs. Semple may lack, she is a housekeeper.
        - id: ch05-b28
          speaker: jerusha
          text: >-
            Isn't it just like a man, Daddy? He gives no hint whether he'll appear today or two weeks from now. We will hold our breath until he arrives. If he takes too long, we'll have to clean everything all over again.
        - id: ch05-b29
          speaker: jerusha
          text: >-
            Amasai is waiting below with the buckboard and Grover. I'm driving alone, but if you could see old Grove, you wouldn't worry about my safety. With my hand on my heart, farewell. Isn't that a fine ending? I borrowed it from Stevenson's letters. Judy.
        - id: ch05-b30
          speaker: narrator
          text: Saturday.
        - id: ch05-b31
          speaker: jerusha
          text: >-
            Good morning again! I didn't get this letter into an envelope before the postman came yesterday, so I'll add a little more. We receive mail once a day at noon. Rural delivery is a blessing to farmers.
        - id: ch05-b32
          speaker: jerusha
          text: >-
            Our postman delivers letters, but he also runs errands in town for five cents each. Yesterday he brought me shoelaces, a jar of cold cream because I burned all the skin off my nose before buying my new hat, a blue Windsor tie, and a bottle of shoe blacking. He charged ten cents for everything. My large order earned me a special bargain.
        - id: ch05-b33
          speaker: jerusha
          text: >-
            He also tells us what's happening in the Great World. Several people on his route receive daily newspapers. He reads the papers while his horse jogs along, then repeats the news to everyone who doesn't subscribe.
        - id: ch05-b34
          speaker: jerusha
          text: >-
            So if the United States goes to war with Japan, or the president is assassinated, or Mr. Rockefeller leaves a million dollars to the John Grier Home, don't trouble yourself to write. I'll hear about it anyway.
        - id: ch05-b35
          speaker: jerusha
          text: >-
            There is still no sign of Master Jervie. But you should see how clean our house is, and how anxiously we wipe our feet before going inside.
        - id: ch05-b36
          speaker: jerusha
          text: >-
            I hope he comes soon. I'm longing for someone to talk to. To tell you the truth, Mrs. Semple becomes rather monotonous. Ideas never interrupt the easy flow of her conversation.
        - id: ch05-b37
          speaker: jerusha
          text: >-
            The people here are funny that way. Their entire world is this one hilltop. They aren't universal at all, if you know what I mean. It was the same at the John Grier Home. Our thoughts stopped at the four sides of the iron fence.
        - id: ch05-b38
          speaker: jerusha
          text: >-
            I didn't mind as much then because I was younger and always busy. I made all my beds, washed my babies' faces, went to school, came home, washed those faces again, darned stockings, and mended Freddie Perkins's trousers. He tore them every single day. Somewhere in between, I learned my lessons.
        - id: ch05-b39
          speaker: jerusha
          text: >-
            By bedtime, I was too tired to notice that no one had any conversation. But after two years at a college where everyone talks, I miss it. I'll be glad to see someone who speaks my language.
        - id: ch05-b40
          speaker: jerusha
          text: >-
            I truly think I'm finished now, Daddy. Nothing else comes to mind. I'll try to write a longer letter next time. Yours always, Judy.
        - id: ch05-b41
          speaker: jerusha
          text: >-
            One last thing. The lettuce has done very badly this year. The early season was too dry.
