audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 叙述者
      tts:
        delivery: 清楚沉静，简洁报出书信日期与场景转换
        timbre: 温暖清澈
        pace: 舒缓
        pitch: 中音
    judy:
      display_name: 朱迪
      tts:
        delivery: 聪敏直率，像把心事和见闻亲口讲给亲近的人
        timbre: 明亮自然的年轻女声
        pace: 轻快而富于变化，伤心时稍慢
        pitch: 中高音
  chapters:
    - id: ch01
      title: 6月2日：一个好得不得了的邀请
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 6月2日，朱迪带着一个意想不到的好消息，写信给长腿叔叔。
        - id: ch01-b02
          speaker: judy
          text: 亲爱的长腿叔叔，您绝对猜不到出了什么好事。麦克布赖德一家请我到阿迪朗达克山里的营地过暑假！他们加入了湖边的一个俱乐部。那座小湖藏在树林中央，漂亮极了。会员们住在一幢幢圆木屋里，房子散落在树木之间。大家能去湖上划独木舟，也能沿小径走很远，到别的营地串门。每周还有一次舞会，在俱乐部会所里举行。
          emotion: happy
        - id: ch01-b03
          speaker: judy
          text: 吉米·麦克布赖德会请一个大学朋友来住一阵，我们连舞伴都不用愁。麦克布赖德太太主动邀请我，是不是很贴心？我圣诞节去她家时，她看来真的很喜欢我。这回请原谅信这么短，它还算不上真正的信。我只想告诉您，我的暑假已经有着落啦。您的，心满意足得不得了的朱迪。
          emotion: happy
    - id: ch02
      title: 6月5日：求求您让我去
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 三天以后，叔叔的答复由秘书转来。朱迪盼望的暑假突然落了空。
        - id: ch02-b02
          speaker: judy
          text: 亲爱的长腿叔叔，您的秘书刚刚写信来，说史密斯先生不希望我接受麦克布赖德太太的邀请，要我照去年那样回洛克威洛。为什么？为什么？到底为什么呀，叔叔？
          emotion: surprised
        - id: ch02-b03
          speaker: judy
          text: 您不知道真正的情形。麦克布赖德太太确实想让我去，我一点儿也不会给她家添麻烦，还能帮上忙。他们没雇多少仆人，我和莎莉有许多事情可以做。我正好借这个机会学习怎样料理家务。每个女人都该懂得这些，可我现在只会料理孤儿院。
        - id: ch02-b04
          speaker: judy
          text: 营地里没有跟我们同龄的姑娘，莎莉也需要我作伴。我们已经约好，一起读完明年英文课和社会学课的书。教授说，暑假先读完，开学后会轻松得多。两个人边读边讨论，内容也更容易记住。
        - id: ch02-b05
          speaker: judy
          text: 只要跟莎莉的母亲同住，我就能学到许多东西。她有趣、风趣、亲切又迷人，世上好像没有她不懂的事。想想我过去跟利佩特太太一起熬过的那些暑假，您就知道，这次我会有多珍惜。您不用怕我挤着他们。麦克布赖德家的房子简直会伸缩，客人一多，他们就在林子里支几顶帐篷，把男孩子赶出去睡。
        - id: ch02-b06
          speaker: judy
          text: 整个暑假都能在户外活动，一定又快活又健康。吉米会教我骑马、划独木舟、开枪，还会教我许多本该学会的事。我从没过过这样热闹、自在、无忧无虑的日子。每个姑娘一生至少该有一次这样的暑假。当然，最后还是您说了算。可是叔叔，求求您让我去吧。我从来没有这样想要过一件事。
        - id: ch02-b07
          speaker: judy
          text: 现在跟您说话的，不是未来的大作家杰鲁莎·艾博特，只是朱迪，一个普普通通的姑娘。
          emotion: sad
    - id: ch03
      title: 6月9日：谨遵指示
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 6月9日，朱迪换上了最冷淡、最正式的口气。
        - id: ch03-b02
          speaker: judy
          text: 约翰·史密斯先生，尊敬的先生，您本月7日的来信已经收到。按照贵秘书转来的指示，本人将在本星期五启程，到洛克威洛农场度过暑假。本人愿永远保持，（小姐）杰鲁莎·艾博特。
    - id: ch04
      title: 8月3日：我原谅您了
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 将近两个月过去了。8月3日，朱迪从洛克威洛农场重新提笔。
        - id: ch04-b02
          speaker: judy
          text: 亲爱的长腿叔叔，我知道，这么久不写信很不好。可今年夏天，我实在不怎么爱您。瞧，我够坦白吧！您无法想象，放弃麦克布赖德家的营地让我多失望。我知道您是监护人，凡事都该尊重您的意思，可我完全看不出您这样安排的理由。去营地明明是我可能遇见的最好机会。
          emotion: sad
        - id: ch04-b03
          speaker: judy
          text: 假如我是叔叔，您是朱迪，我会祝福您，让您赶快去痛痛快快玩一个暑假。我会叫您多认识些人，多学点新东西，整天待在户外，把身体养得健康强壮，也让精神休息够了，再回来应付一年的苦读。可您没有这样做。您只让秘书冷冰冰地写来一行字，命令我回洛克威洛。
        - id: ch04-b04
          speaker: judy
          text: 真正伤人的，是那些命令里完全没有一点人情味。要是您像我惦记您那样，哪怕只稍微惦记我一点，也该偶尔亲手写句话给我，不要总寄来那些可恶的秘书打字便条。只要让我看出您有一点在乎，我什么事都肯做，只要能让您高兴。
          emotion: sad
        - id: ch04-b05
          speaker: judy
          text: 我记得我们的约定。我要写又长又详细的信，却永远不能等您的回音。您已经做到答应的事，让我受教育。您大概觉得，我没有做好答应您的那一半。可是叔叔，这个约定真的很苛刻。我孤单极了。您是我唯一能牵挂的人，偏偏又像一道影子。如今这个您，是我凭想象造出来的，真实的您可能根本不是这样。
        - id: ch04-b06
          speaker: judy
          text: 不过，我在医务室生病时，您曾经捎过一句话给我。每次觉得自己彻底被忘掉，我都会取出那张卡片，再读一遍。说到这里，我好像还是没讲出原本想说的话。
        - id: ch04-b07
          speaker: judy
          text: 我的心还在痛。任凭一个专断、蛮横、无理、无所不能又看不见的“天意”把自己拎来挪去，实在很丢脸。不过，您过去对我那么善良、慷慨又体贴。既然这样，只要您愿意，大概也有权偶尔当一回不讲理的“天意”。所以，我决定原谅您，重新高兴起来。只是莎莉写来的那些营地趣事，我还是不爱看！
        - id: ch04-b08
          speaker: judy
          text: 好吧，这件事就拿帘子遮住，我们重新开始。这个夏天我不停地写，已经完成四篇短篇小说，分别投给四家杂志。我正在认真学习当作家。阁楼一角现在是我的工作室，杰维少爷小时候下雨天就在那里玩。那地方凉爽通风，有两扇老虎窗，外面的枫树正好遮阴，树洞里还住着一家红松鼠。
        - id: ch04-b09
          speaker: judy
          text: 过几天，我会写一封更可爱的信，把农场新闻都告诉您。眼下只有一条消息，我们需要下雨。永远属于您的朱迪。
    - id: ch05
      title: 8月10日：柳树上的长信
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 8月10日，朱迪坐在牧场水塘边的柳树上，开始了一封写了三天的长信。
        - id: ch05-b02
          speaker: judy
          text: 长腿叔叔先生，尊敬的先生，我坐在柳树的第二个枝杈上给您写信。下面有青蛙咕咕叫，头顶有蝉在唱，树干上还有两只“魔鬼绒毛虫”窜上窜下。我在这里坐了一个钟头。垫上两个沙发靠垫以后，这个树杈舒服得很。
        - id: ch05-b03
          speaker: judy
          text: 我带了笔和写字板，本想写一篇不朽的短篇小说。可女主人公完全不肯照我的意思行事，把我折腾得够呛。我只好先丢下她，改来写信。其实也没轻松多少，因为您同样不肯照我的意思行事。
        - id: ch05-b04
          speaker: judy
          text: 要是您正在可怕的纽约，我真想分给您一点这里的清风、阳光和美景。下了一星期雨以后，乡下简直就是天堂。说起天堂，您还记得去年提过的凯洛格先生吗？他是街角白色小教堂的牧师。可怜的老人去年冬天得肺炎去世了。
        - id: ch05-b05
          speaker: judy
          text: 我听过他五六次布道，很熟悉他的神学。他到死都相信着四十七年前相信的每一个念头，从来没有改过。我觉得，能把思想沿一条直线走四十七年的人，应该放进陈列柜当珍品。希望他已经拿到竖琴和金王冠，他生前确信自己一定会有。如今接替他的是个神气十足的年轻人。教众都不大放心，康明斯执事带领的那一派尤其怀疑。教会看来快要分裂了。我们这一带可不喜欢宗教上的新花样。
        - id: ch05-b06
          speaker: judy
          text: 下雨那一周，我坐在阁楼里读了个痛快，读得最多的是史蒂文森。他本人比书里的人物还有趣，大概是故意把自己活成了印在书上很好看的英雄。父亲留给他一万美元，他全拿去买游艇，扬帆驶向南太平洋。做得多漂亮！他真的照自己的冒险信条活了一辈子。要是父亲也留给我一万美元，我一定跟他一样。
        - id: ch05-b07
          speaker: judy
          text: 我一想到瓦伊利马就激动。我想看热带，也想看完整个世界。将来我要当伟大的作家、画家、演员或剧作家。不管最后做什么，总得做个伟大人物。我患了很严重的漫游癖，一看见地图，就想戴帽子、拿雨伞，立刻出发。在我死去以前，我要看见南方的棕榈与神殿。
        - id: ch05-b08
          speaker: narrator
          text: 到了星期四黄昏，朱迪从柳树移到门前台阶上，终于开始报告农场新闻。
        - id: ch05-b09
          speaker: judy
          text: 这封信真难塞进新闻。朱迪最近太爱思考，只愿大谈整个世界，不愿讲日常琐事。不过，既然您非听不可，我就说吧。上星期二，九只小猪蹚过小溪逃走，回来时少了一只。我们不想冤枉人，可寡妇多德家的猪，好像比她该有的多了一只。
        - id: ch05-b10
          speaker: judy
          text: 韦弗先生把谷仓和两座青贮塔漆成鲜亮的南瓜黄。颜色难看极了，可他说这样耐用。布鲁尔家来了客人，是布鲁尔太太从俄亥俄州来的妹妹和两个外甥女。还有一只罗得岛红母鸡，十五个蛋只孵出三只小鸡。谁也不知道哪里出了问题。依我看，这种鸡太差了，我更喜欢浅黄色奥平顿鸡。
        - id: ch05-b11
          speaker: judy
          text: 邦尼里格街角邮局新来的办事员，把库存的牙买加姜汁喝得一滴不剩，足足喝掉七美元的货，后来才被发现。老艾拉·哈奇得了风湿病，再也不能干活。他从前挣钱不少，却一点也没存，所以现在只能靠镇上养活。下星期六晚上，校舍要办冰激凌联欢会，请大家带家人一起来。
        - id: ch05-b12
          speaker: judy
          text: 我在邮局花二十五美分买了一顶新帽子。信里画的，就是我戴着它去耙干草的最新肖像。天越来越黑，已经看不见了，新闻也恰好全讲完。晚安，朱迪。
        - id: ch05-b13
          speaker: narrator
          text: 星期五早晨，她忽然有了真正的大新闻。
        - id: ch05-b14
          speaker: judy
          text: 又一次向您道早安！您猜不到谁要来洛克威洛，永远也猜不到。彭德尔顿先生写信给森普尔太太，说他正开车穿过伯克希尔。他累了，想找一座安静可爱的农场歇歇。要是哪天晚上来到门前，她能不能备好房间？他也说不准会住一周、两周还是三周，要等到了这里，看看休息得怎么样。
          emotion: happy
        - id: ch05-b15
          speaker: judy
          text: 我们全忙翻了。房子上上下下都在打扫，窗帘统统洗过。今天早上，我要赶车去街角，买门厅用的新油布，再买两罐棕色地板漆，漆前厅和后楼梯。多德太太明天来擦窗户。情况紧急，我们只好暂时不追究那只小猪。听起来，您也许以为房子原本不干净。我保证，它本来就一尘不染。森普尔太太不管还有什么缺点，料理家务绝对拿手。
        - id: ch05-b16
          speaker: judy
          text: 可这真像男人做的事。他根本不说今天到，还是两个星期以后才到。我们只能一直提着一口气等下去。再迟一点儿，所有地方恐怕得重新打扫。阿马赛已经在楼下等我，轻便马车也套好了格罗弗。我要一个人赶车。不过您要是见过老格罗弗，就不会担心我的安全。我把手按在心口，向您告辞。这个结尾不错吧？我是从史蒂文森的书信里学来的。
        - id: ch05-b17
          speaker: narrator
          text: 可这封信还没寄出。星期六早晨，朱迪又添了一大段。
        - id: ch05-b18
          speaker: judy
          text: 再一次向您道早安！昨天邮差来以前，我没赶上把信装进信封，所以继续写。我们每天中午十二点只有一班邮件。乡村投递真是农民的福气。邮差不只送信，还替我们进城办事，一件收五美分。昨天，他替我带来鞋带、一罐冷霜、一条蓝色温莎领带和一瓶鞋油，总共才收十美分。新帽子买来以前，我把鼻子都晒脱皮了，所以冷霜正好派上用场。东西订得多，这次还特别便宜。
        - id: ch05-b19
          speaker: judy
          text: 邮差还负责告诉我们外面的大事。沿途几户人家订日报，他一边赶车一边读，再把新闻讲给没订的人。以后要是美国和日本开战，总统遇刺，或者洛克菲勒先生留给约翰·格里尔孤儿院一百万美元，您都不用写信通知我。我反正会听见。
        - id: ch05-b20
          speaker: judy
          text: 杰维少爷还没出现。您真该看看房子如今有多干净，也该看看我们每次进门前，怎样提心吊胆地擦脚。我盼他快来，因为太想找个人谈谈了。老实说，森普尔太太听久了有些单调。她说话时，思想从来不会跳出来，打断那股从容的流水。
        - id: ch05-b21
          speaker: judy
          text: 这里的人也很有意思，他们的整个世界只有这一座山顶，眼光从来不越过去。这跟约翰·格里尔孤儿院很像。那时，我们的想法也被铁栅栏四面围住。只是我年纪小，每天忙着铺床，给孩子们洗脸，上学，回来再洗一遍脸，还得补袜子，缝弗雷迪·珀金斯天天扯破的裤子。功课只能塞进这些事情的缝隙里。等全做完，我已经困得只想睡觉，根本没发现自己少了与人交谈。
        - id: ch05-b22
          speaker: judy
          text: 如今我在一所人人爱说话的大学里待了两年，真的很想念交谈。只要有个跟我说同一种语言的人来，我就会高兴极了。这次我相信，信真的写完了。眼下再也想不起别的事，下一封我会努力写得更长。永远属于您的朱迪。对了，今年的莴苣长得很不好，因为开春时太干。
