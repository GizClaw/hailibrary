  chapters:
    - id: ch01
      title: The Appeal to Cæsar
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: The children's plan had gone well so far. They meant to call on Lord Andore and tell him about his unfortunate tenant, whose pretty cottage was wanted by some weekend visitors. Then they reached the lodge gate, and trouble began.
        - id: ch01-b02
          speaker: narrator
          text: The long gate clicked shut behind them. An elderly woman in a black cap trimmed with violet ribbons poked her head out of the lodge window.
        - id: ch01-b03
          speaker: lodge_keeper
          text: No, you don't!
          emotion: angry
        - id: ch01-b04
          speaker: charlotte
          text: Yes, we do.
        - id: ch01-b05
          speaker: lodge_keeper
          text: Village children aren't allowed in here.
        - id: ch01-b06
          speaker: charles
          text: We're not village children.
        - id: ch01-b07
          speaker: narrator
          text: The cap vanished from the window, then appeared at the lodge door on a very angry old lady with a long, sharp nose. She might have been Mrs. Wilmington's grandmother.
        - id: ch01-b08
          speaker: lodge_keeper
          text: Out you go, the same way you came. Those are my orders. What do you want, anyway?
          emotion: angry
        - id: ch01-b09
          speaker: caroline
          text: We brought Lord Andore a bouquet.
        - id: ch01-b10
          speaker: lodge_keeper
          text: Keep it until the fifteenth. No village people come in before the gala and fête for his lordship's coming of age. You may come then. Now get out. I've no patience for this.
          emotion: angry
        - id: ch01-b11
          speaker: narrator
          text: That was a foolish thing to say, because no bouquet will last for two weeks. Still, the children had to turn back. I wish I could hide what Charles did as he passed the woman, but he stuck out his tongue. It is dreadful to have to tell you that. My only comfort is that Caroline and Charlotte did not join him. Charlotte merely made a face, while Caroline behaved beautifully.
        - id: ch01-b12
          speaker: narrator
          text: Once they were back on the road, though, Caroline spoke through almost clenched teeth, just as a hero might at a desperate moment.
        - id: ch01-b13
          speaker: caroline
          text: Do you remember that broken fence we passed?
        - id: ch01-b14
          speaker: narrator
          text: The others understood at once, without needing another word. They went back, found the broken paling, and squeezed through. Caroline's dress was the one that got badly torn. Charlotte's damage was only in the gathers. She could tuck those into her waistband, though that left a lump and made her skirt hang at rather uneven lengths. As for Charles, the fence was innocent. A nail ripped his stocking very badly.
        - id: ch01-b15
          speaker: narrator
          text: They landed in a shrubbery thick with thorns and undergrowth, much closer to the lodge than they would have chosen. Now and then they could see its white walls quite plainly. They feared that the lodge, or rather the woman who managed it, might be able to see them too. But it makes all the difference whether you are looking for something or not. The very last thing that woman expected was for anyone to dare to defy her.
        - id: ch01-b16
          speaker: narrator
          text: So the children crept through the undergrowth, neither seen nor suspected. Thorns and briars scratched at their blue muslin clothes, which had already lost their first freshness. A stout chestnut stump snatched Charlotte's white hat right off her head. The bouquet had never been the handsomest of its kind, and its travels did nothing to improve it. But every tropical explorer meets misfortunes like these, so the children pressed ahead.
        - id: ch01-b17
          speaker: narrator
          text: At last they came out of the undergrowth into the broad, smooth park. All three were very warm by then, and rather dirty too. Beyond a quiet belt of trees, they saw the pale gray towers of the castle rising against the sky. They stopped to look behind them. The lodge had vanished from sight, and there was no sign that anyone had followed.
        - id: ch01-b18
          speaker: caroline
          text: Well, that's all right. Now we must walk quickly without looking as if we're hurrying. Very long steps ought to do it. I only wish we knew where the front door was. Imagine going to the back by mistake and being turned away by Lord Andore's my-myrmidons.
        - id: ch01-b19
          speaker: charlotte
          text: His back door is probably grander than our front door. We won't know which it is until the myr-whatever-they-are come after us.
        - id: ch01-b20
          speaker: caroline
          text: If we'd had time to dress up as grown-ups, they'd have taken our cards and shown us in, unless he was out. Char, tear that strip off your hat. It looks as if your petticoat tape is hanging down.
        - id: ch01-b21
          speaker: charlotte
          text: He has to be at home. It would be too much if he weren't.
        - id: ch01-b22
          speaker: narrator
          text: Charlotte tore away a long streamer. Her poor hat now looked less like a hat than a fading flower someone had sat upon. They crossed the trees and came to a drive covered in very yellow gravel. It felt hot and gritty under their feet and looked almost painful to the eye. They followed it around a corner, and the castle suddenly stood before them, far larger than they had expected.
        - id: ch01-b23
          speaker: narrator
          text: There could be no doubt about the entrance. Two tall gray towers held a great arch between them, and the drive ran straight through it. Yet there was no bell, no knocker, and, as far as they could tell, no door.
        - id: ch01-b24
          speaker: charles
          text: I feel like Jack the Giant Killer, except there's no trumpet for me to blow.
        - id: ch01-b25
          speaker: narrator
          text: Though Charles barely whispered, his voice sounded loud and hollow beneath the echoing arch. Beyond its cool, shadowy depths lay a courtyard full of sunshine. There was green grass, and pink geraniums overflowed from great stone vases. In the middle, a fountain sprang upward, sank again, and splashed into a stone basin.
        - id: ch01-b26
          speaker: narrator
          text: Across the courtyard, steps led to an arched doorway where a footman stood.
        - id: ch01-b27
          speaker: caroline
          text: He's exactly like the footman in Alice. Courage and dispatch!
        - id: ch01-b28
          speaker: narrator
          text: The footman watched the three hot, dusty, untidy children cross the carefully arranged garden. His curious gaze moved over them and rested especially on the battered bouquet. Then he examined Charlotte's unspeakable hat and the great tear in Charles's stocking.
        - id: ch01-b29
          speaker: caroline
          text: If you please, we'd like to see Lord Andore.
        - id: ch01-b30
          speaker: footman
          text: His lordship is not at home.
        - id: ch01-b31
          speaker: charlotte
          text: When will he come back?
        - id: ch01-b32
          speaker: narrator
          text: Caroline's heart was pounding, and she suddenly wished they had at least brought their gloves. The footman picked at his teeth with a pin and answered in a voice remarkably like Mrs. Wilmington's.
        - id: ch01-b33
          speaker: footman
          text: I really couldn't say.
        - id: ch01-b34
          speaker: charles
          text: We need to see him very much. Look, we brought him this bouquet.
        - id: ch01-b35
          speaker: footman
          text: Yes, I can see that. Would you care to leave it? What a surprise it will be for his lordship when he comes in.
        - id: ch01-b36
          speaker: narrator
          text: The footman gave a little mocking laugh.
        - id: ch01-b37
          speaker: caroline
          text: So he is here. I mean, he isn't in London?
        - id: ch01-b38
          speaker: footman
          text: His lordship is not in London. Any more questions? I'm always delighted to recite my catechism.
        - id: ch01-b39
          speaker: narrator
          text: The children turned away because they needed to speak privately. The footman laughed again behind them.
        - id: ch01-b40
          speaker: footman
          text: Shall I have a name? His lordship will simply be dying to know who called.
        - id: ch01-b41
          speaker: charlotte
          text: You needn't bother with our names. I don't believe Lord Andore knows how you behave when he isn't here. He doesn't know yet, anyway.
        - id: ch01-b42
          speaker: footman
          text: I meant no offense, miss.
        - id: ch01-b43
          speaker: charlotte
          text: We accept your apology. We'll wait here until Lord Andore comes in.
        - id: ch01-b44
          speaker: narrator
          text: The footman stepped down toward them, suddenly earnest.
        - id: ch01-b45
          speaker: footman
          text: Now, look here. You can't wait here.
        - id: ch01-b46
          speaker: caroline
          text: Oh yes, we can.
        - id: ch01-b47
          speaker: narrator
          text: Caroline sat on the second step, and the others joined her.
        - id: ch01-b48
          speaker: charles
          text: So there!
        - id: ch01-b49
          speaker: caroline
          text: Hush!
        - id: ch01-b50
          speaker: charlotte
          text: No other house we've visited has refused to ask us in and offer us chairs. But if this is that sort of house, never mind. Luckily, the weather is fine.
        - id: ch01-b51
          speaker: footman
          text: This won't do. We have company coming. I can't have a lot of ragged children sitting on the steps like a May Day parade.
        - id: ch01-b52
          speaker: charlotte
          text: I'm sorry, but if you have no room fit to invite us into, then I'm afraid you will have to let us sit here.
        - id: ch01-b53
          speaker: narrator
          text: Without looking back, the children watched the bright garden and the dancing fountain. The footman tried to sound fierce, but there was weakness beneath his bluster.
        - id: ch01-b54
          speaker: footman
          text: This is pure cheek! Leave now, do you hear? Or must I make you go?
          emotion: angry
        - id: ch01-b55
          speaker: narrator
          text: Caroline was nearly choking with anger, disappointment, fear, and doubt, but she made her voice as steady as she could.
        - id: ch01-b56
          speaker: caroline
          text: We hear you.
          emotion: calm
        - id: ch01-b57
          speaker: charlotte
          text: I dare you to touch one of your master's visitors. How can you know who we are? We haven't told you our names.
        - id: ch01-b58
          speaker: narrator
          text: A sudden doubt seemed to strike the footman. For one moment he stood there hesitating. Then he muttered something about going to see Mr. Checkles and retreated into the castle. He left the children in possession of the field. There they remained in a determined row on Lord Andore's steps, with the battered bouquet laid carefully on the step just above their heads.
        - id: ch01-b59
          speaker: narrator
          text: The gray-walled courtyard fell very quiet.
        - id: ch01-b60
          speaker: charles
          text: I say, let's go. We beat him, anyway. We ought to make a run for it before he brings back someone we can't beat. He may return with thousands of stately butlers.
          emotion: fearful
        - id: ch01-b61
          speaker: charlotte
          text: Never.
        - id: ch01-b62
          speaker: narrator
          text: Charlotte's hands were cold and trembling with excitement.
        - id: ch01-b63
          speaker: caroline
          text: I hope Mr. Checkles is a gentleman, the ordinary sort we know. A lord's servants seem commoner than anyone else's, so perhaps the lord is just like them. They do say, like master, like man.
        - id: ch01-b64
          speaker: narrator
          text: As if Caroline's wish had called him, a door in the wall opened and gave them a glimpse of another garden beyond. A cheerful young man came toward them. He was very big, and his loose clothes were made of dust-colored Harris tweed. He looked like a boy from the highest form at school. Charles immediately felt that here was a man and a brother, so he jumped up and went to meet him.
        - id: ch01-b65
          speaker: charles
          text: Hullo!
        - id: ch01-b66
          speaker: lord_andore
          text: Hullo!
          emotion: happy
        - id: ch01-b67
          speaker: narrator
          text: The big young man grinned at him in the friendliest way.
        - id: ch01-b68
          speaker: charles
          text: There isn't really any reason we can't wait here if we want to, is there?
        - id: ch01-b69
          speaker: lord_andore
          text: Not a reason in the world, provided the thing you're waiting for is likely to come, and this is the best place to wait for it.
        - id: ch01-b70
          speaker: caroline
          text: We're waiting for Lord Andore. I'm so glad you came, because we don't understand English menservants. When you call on people in India, the servants behave differently.
        - id: ch01-b71
          speaker: lord_andore
          text: What have the servants here done?
        - id: ch01-b72
          speaker: narrator
          text: The young man frowned, his hands in his pockets.
        - id: ch01-b73
          speaker: charles
          text: Oh, nothing. I mean, we accepted his apology, so it wouldn't be fair to tell tales.
        - id: ch01-b74
          speaker: caroline
          text: It wouldn't be telling tales if we told you, because you'd give your word not to tell Lord Andore. We don't want another person's servants punished after we've accepted their apology. But the footman was rather...
        - id: ch01-b75
          speaker: narrator
          text: Before Caroline could finish, the footman appeared at the top of the steps beside an elderly, whiskered man dressed in black. The children correctly guessed that this was the butler. Both men had hurried out, but at the sight of the young man, the footman stopped as if he had turned to stone.
        - id: ch01-b76
          speaker: lord_andore
          text: Come here, Checkles.
        - id: ch01-b77
          speaker: narrator
          text: The young man's voice was suddenly short. The butler came quickly, then astonished the three C.'s far more than he will astonish you.
        - id: ch01-b78
          speaker: checkles
          text: Yes, my lord.
        - id: ch01-b79
          speaker: lord_andore
          text: Tea on the terrace at once, and tell them not to take all day over it.
        - id: ch01-b80
          speaker: narrator
          text: Checkles hurried away to obey, and the footman went with him. Before disappearing, the footman cast one last glance toward Charlotte. She always believed afterward that there was no defiance in that look now. It seemed much more like a silent plea that she would say nothing.
        - id: ch01-b81
          speaker: charles
          text: So you're Lord Andore! How jolly!
          emotion: surprised
        - id: ch01-b82
          speaker: narrator
          text: Caroline felt there was no time for flattering personal remarks. Lord Andore's tea was coming, it was already past most people's teatime, and he was probably eager for it. She held out the flowers.
        - id: ch01-b83
          speaker: caroline
          text: Here's the bouquet we made for you. Will you please take it?
        - id: ch01-b84
          speaker: lord_andore
          text: That's awfully good of you. Thanks tremendously!
          emotion: happy
        - id: ch01-b85
          speaker: narrator
          text: He buried his nose in the columbine, roses, cornflowers, lemon verbena, wistaria, gladiolus, and straw, and breathed in their scent.
        - id: ch01-b86
          speaker: caroline
          text: I'm afraid it isn't very pretty. We had to choose the flowers by looking through two books at once. It says, "Welcome, fair stranger," then, "An unexpected meeting," and, "We are anxious and trembling." We left out "Confidence" because we didn't have any. The last part means "Agreement," because we hope you'll agree.
        - id: ch01-b87
          speaker: lord_andore
          text: How very interesting. It really was kind of you.
        - id: ch01-b88
          speaker: charlotte
          text: Please understand, it isn't an ordinary bouquet, and you mustn't thank us. We made it to get what we wanted, not to please you. Though now we know how nice you are, we'd gladly have made you one just because you wanted it.
        - id: ch01-b89
          speaker: lord_andore
          text: I see.
        - id: ch01-b90
          speaker: caroline
          text: I'm sure you don't. Please don't be polite. Tell us if you don't understand. We came because we want justice.
        - id: ch01-b91
          speaker: caroline
          text: One of your tenants has lived in her cottage since your father's time. Now they're turning her out because some weekend people like it. But she planted the flowers herself. Her father built the arbor, and her uncle in Cambridgeshire sent the roses. She said you knew nothing about it, so we decided you ought to know.
        - id: ch01-b92
          speaker: caroline
          text: That's why we made the bouquet and came here. We should leave now. Her name and address are on this paper, though I'm sorry they're only in pencil. You will make sure justice is done, won't you?
        - id: ch01-b93
          speaker: lord_andore
          text: It is very kind of you to care so much about my tenants.
        - id: ch01-b94
          speaker: charlotte
          text: There, that's exactly what we feared you'd say. We didn't mean to interfere. We only stopped for ginger beer, and Caro found her crying. Her hornbeam arbor is terribly old, and a few shillings a week can't matter to you when you have this lovely castle.
        - id: ch01-b95
          speaker: charlotte
          text: Besides, the motto on your ancestors' tombs is Flat Justicia. We only want plain justice. We saw the tomb in church on Sunday, with all the sons and daughters wearing ruffs.
        - id: ch01-b96
          speaker: lord_andore
          text: Stop! I'm only a poor, weak fellow, and I need my tea. Come and have some. Then I'll try to understand all this.
        - id: ch01-b97
          speakers: [caroline, charlotte, charles]
          ensemble: chorus
          text: Thanks awfully!
          emotion: happy
        - id: ch01-b98
          speaker: caroline
          text: We can't stay long over tea, please. We must be home by half past six, and it must be nearly that now.
        - id: ch01-b99
          speaker: lord_andore
          text: You'll be home by half past six. Don't worry.
        - id: ch01-b100
          speaker: narrator
          text: Lord Andore led the way through the little door by which he had entered. It opened onto a pleasant stone terrace, where roses grew over, under, in, out, and all around the broad old balustrades. Tea waited on a white cloth spread over a good-sized table, and it was truly a tea worth waiting for. There were honey and jam, cakes of every sort, ripe peaches, and strawberries.
        - id: ch01-b101
          speaker: lord_andore
          text: Here we are. You must be starving. In this house, cake comes first, and bread and butter afterward if you insist. Milk and sugar?
        - id: ch01-b102
          speaker: narrator
          text: The footman hovered nearby. Only Charles seemed to notice him. It delighted Charles to see his proud enemy humbly carrying the urn and lighting the spirit lamp for the children he had tried to chase even from the doorstep.
        - id: ch01-b103
          speaker: narrator
          text: Out of respect for their host, all three drank tea much too strong for them. Lord Andore had forgotten that, when he was a little boy, children had milk at teatime.
        - id: ch01-b104
          speaker: narrator
          text: With patient, careful questions, Lord Andore slowly drew out the whole story in a form he could understand. The children's explanations kept tumbling over one another, so he suddenly made a rule. No one was allowed to say more than thirty-seven words without stopping and giving someone else a chance.
        - id: ch01-b105
          speaker: lord_andore
          text: I see. Yes, now I see. And what happened next?
        - id: ch01-b106
          speaker: narrator
          text: At last, after the final peach had been gladly accepted and the final strawberry sadly refused, tea was truly over. Lord Andore stood.
        - id: ch01-b107
          speaker: lord_andore
          text: If you don't mind my saying so, you are three splendid little bricks for taking so much trouble. I am honestly very grateful. I want to treat my tenants fairly, but I can't know what's happening unless someone tells me. You've helped me enormously. Thank you.
        - id: ch01-b108
          speaker: charlotte
          text: Then you will?
        - id: ch01-b109
          speaker: caroline
          text: She means, will you stop them from turning the woman out of her cottage?
        - id: ch01-b110
          speaker: charles
          text: The Mineral woman, she means.
        - id: ch01-b111
          speaker: lord_andore
          text: Of course I won't. That is, of course I will stop it. I mean, everything will be all right. I'll drive you home too, and if you're a minute late, I'll explain it to your uncle.
        - id: ch01-b112
          speaker: narrator
          text: A magnificent motorcar waited outside the great arch held between the two castle towers. It was the sort of car one might dream about. There was room for all three C.'s together in the front, sitting beside Lord Andore, who took the driver's place himself.
        - id: ch01-b113
          speaker: narrator
          text: The footman stood there too. Charles's proudest moment of the day came when Lord Andore handed that man the petition bouquet.
        - id: ch01-b114
          speaker: lord_andore
          text: Put this in water, and be careful with it. Tell them it is to go on the dinner table tonight.
        - id: ch01-b115
          speaker: footman
          text: Yes, my lord.
        - id: ch01-b116
          speaker: narrator
          text: He spoke as if he had never seen the bouquet before. Charlotte's proudest moment came at the lodge gate, when the old woman had to curtsey as the motor swept past.
        - id: ch01-b117
          speaker: narrator
          text: Rupert was waiting at their own lodge gate. When he saw the motorcar, his eyes grew as round as pennies.
        - id: ch01-b118
          speakers: [caroline, charlotte, charles]
          ensemble: chorus
          text: Oh, stop! It's Rupert!
        - id: ch01-b119
          speaker: narrator
          text: Rupert was bundled into the body of the car, where he traveled alone in great splendor. Even after the motor had carried them home and gone away, his doubts remained. The three C.'s told him all their adventures, from the lodge gate to the castle steps. They told him about Lord Andore, the marvelous tea, and the splendid success of their magic bouquet. Rupert listened to it all and still refused to be convinced.
        - id: ch01-b120
          speaker: rupert
          text: It was chance, I tell you. An accident. Co... whatever the word is... coincidence. Everything would have happened exactly the same without that horrible mixed haystack you carried.
        - id: ch01-b121
          speaker: charlotte
          text: Still being disagreeable?
        - id: ch01-b122
          speaker: charles
          text: Oh, it would all have been the same, would it? That shows how much you know.
        - id: ch01-b123
          speaker: rupert
          text: It is not all I know. I happen to know heaps of things you don't, and I could learn plenty more if I chose. So there!
          emotion: angry
        - id: ch01-b124
          speaker: caroline
          text: Rupert, please don't be cross when we're all so happy. I truly wish you'd been with us, especially for tea.
        - id: ch01-b125
          speaker: rupert
          text: I'm not cross. I was feeling unusually jolly until all of you came home.
        - id: ch01-b126
          speaker: caroline
          text: Oh, don't be like that. Let's call a truce. We haven't told you half the interesting little things yet. If you can't believe in magic, that's your misfortune, and we know it isn't your fault. You don't disbelieve on purpose. We know we're right, and you think you know you're right.
        - id: ch01-b127
          speaker: rupert
          text: No, it is the other way around.
        - id: ch01-b128
          speaker: caroline
          text: I know it is when you think about it. When we think about it, it's the other way around again. Oh, peace! Peace! Peace!
        - id: ch01-b129
          speaker: rupert
          text: All right. I had a good swim. Your Mr. Penfold isn't bad at all. He taught me a new side stroke.
        - id: ch01-b130
          speaker: narrator
          text: He agreed to peace, but it was plain that Rupert's feelings had not cleared. Inside, he was still cloudy and far from comfortable.
        - id: ch01-b131
          speaker: narrator
          text: The next day, the three C.'s and Rupert were halfway through their Irish stew when Mrs. Wilmington suddenly rustled into the room.
        - id: ch01-b132
          speaker: mrs_wilmington
          text: Caroline, a person wishes to see you. A quite poor person. I asked her to wait until dinner was finished, but she says she hopes you will see her now because she ought to begin her journey home almost at once.
        - id: ch01-b133
          speaker: caroline
          text: Of course! It must be the Mineral woman.
        - id: ch01-b134
          speaker: mrs_wilmington
          text: I thought her face looked rather like an animal's.
        - id: ch01-b135
          speaker: narrator
          text: Caroline was already in the hall. A figure rose politely from the oak chair. Though disguised in her Sunday clothes, she was unmistakably the Mineral woman.
        - id: ch01-b136
          speaker: mineral_woman
          text: Oh, miss! Oh, miss!
          emotion: happy
        - id: ch01-b137
          speaker: narrator
          text: She seized both Caroline's hands and shook them, but that was not nearly enough for all she felt. Caroline found herself kissed on one cheek and then the other. A moment later, the woman wrapped her in a sudden hug. After another cry of, "Oh, miss!" she felt about inside the black bag she carried, found her handkerchief, and blew her nose very loudly.
        - id: ch01-b138
          speaker: narrator
          text: Mrs. Wilmington crossed the hall as slowly as she possibly could. Even so, she had gone through the baize door by the time the woman's nose was finished for the moment. From beyond it, she heard one more joyful cry.
        - id: ch01-b139
          speaker: mineral_woman
          text: Oh, miss!
          emotion: happy
        - id: ch01-b140
          speaker: narrator
          text: Five minutes later, Mrs. Wilmington came back. This time she overheard the news itself.
        - id: ch01-b141
          speaker: mineral_woman
          text: It's all right, miss! He sent two bright new five-pound notes for more rose trees, and a letter in his very own handwriting thanking us for making the cottage so pretty. I'm to be the tenant for the rest of my life.
          emotion: happy
        - id: ch01-b142
          speaker: mineral_woman
          text: It was all your doing. Bless your kind heart! That's why I came to tell you. I never thought I could feel this way about a little girl I'd never known before. It was all your doing, my dear.
          emotion: happy
        - id: ch01-b143
          speaker: narrator
          text: For any housekeeper who knew nothing of the secret, those words were a mysterious and exciting thing to overhear. For the little girl who stood listening to them, they were something else entirely. They were heartwarming, pleasant, and wonderful.
        - id: ch01-b144
          speaker: narrator
          text: Caroline returned to the others and told them how happy the Mineral woman was.
        - id: ch01-b145
          speaker: caroline
          text: You see? The magic always works.
          emotion: happy
