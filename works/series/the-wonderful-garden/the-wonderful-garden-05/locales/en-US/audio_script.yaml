audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm, observant storytelling with a gently amused touch
        timbre: clear and rounded
        pace: measured
        pitch: medium
    caroline:
      display_name: Caroline
      tts:
        delivery: lively, affectionate, and increasingly careful when being polite
        timbre: bright and clear
        pace: medium
        pitch: medium-high
    charlotte:
      display_name: Charlotte
      tts:
        delivery: eager, curious, and quick with an idea
        timbre: light and energetic
        pace: brisk
        pitch: high
    charles:
      display_name: Charles
      tts:
        delivery: proud, teasing, and boyishly direct
        timbre: youthful and crisp
        pace: medium-fast
        pitch: medium-high
    rupert:
      display_name: Rupert Wix
      tts:
        delivery: blunt and gloomy at first, warming quickly among friends
        timbre: youthful and slightly husky
        pace: medium
        pitch: medium-high
  chapters:
    - id: ch01
      title: The Midnight Adventure
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: The fern-seed was only supposed to show things that were invisible. It was not supposed to let anyone hear them. So if the raised hand tapped without a sound, the children would know the Latin book was right. But what if they heard an ordinary tap? Perhaps the fern-seed could reveal more than the book promised. Or perhaps the spell was nonsense, and the face and hand belonged to a real person whose fingers would rattle the glass.
        - id: ch01-b02
          speaker: narrator
          text: The children could not decide which answer they wanted. Then the hand tapped. It made the same quiet sound that anyone might make when tapping on a window without waking the whole house. Startled as they were, the children suddenly knew exactly what they hoped.
        - id: ch01-b03
          speaker: charles
          text: It's just a real person.
        - id: ch01-b04
          speaker: narrator
          text: Charles let out a long breath.
        - id: ch01-b05
          speaker: caroline
          text: It's only a boy. What can he want?
        - id: ch01-b06
          speaker: charlotte
          text: That's Rupert, the boy from the train.
        - id: ch01-b07
          speaker: narrator
          text: Everyone breathed more easily. They smiled and nodded at the window. The face nodded back without smiling.
        - id: ch01-b08
          speaker: charles
          text: He must have run away, just as I told him to.
        - id: ch01-b09
          speaker: charlotte
          text: You didn't tell him. I did.
        - id: ch01-b10
          speaker: charles
          text: I like this much better than invisible people. Now this really is an adventure.
        - id: ch01-b11
          speaker: caroline
          text: But we wouldn't be having it if we hadn't come down for the fern-seed.
        - id: ch01-b12
          speaker: narrator
          text: They smiled and nodded once more. The face moved its lips, but they could not hear the words.
        - id: ch01-b13
          speaker: caroline
          text: It really is Rupert, and he's run away to us. What fun!
          emotion: happy
        - id: ch01-b14
          speaker: narrator
          text: Caroline and Charles nodded again.
        - id: ch01-b15
          speaker: charlotte
          text: Let's not keep bobbing like Chinese pagodas. He wants to come inside.
        - id: ch01-b16
          speaker: narrator
          text: The others saw at once that she was right.
        - id: ch01-b17
          speaker: charlotte
          text: He can't come through this window.
        - id: ch01-b18
          speaker: narrator
          text: Opening it would mean moving the table, the bell-glass full of fern, and all the sad little ferns in dry pots. Some were even protected by curved pieces of an old drinking glass. Shifting it all would be risky and probably noisy.
        - id: ch01-b19
          speaker: caroline
          text: The morning-room is next door. Mrs. Wilmington called it that. It has a French window, and I know how to open the fastenings.
        - id: ch01-b20
          speaker: narrator
          text: Caroline began making signs to tell the face to move along to that other window.
        - id: ch01-b21
          speaker: charlotte
          text: Why do they call it French?
        - id: ch01-b22
          speaker: charles
          text: Because it's like a door. Everything in France is backward. They say “we” when they mean yes, “two” means you, and “four” is an oven. It's silly.
        - id: ch01-b23
          speaker: narrator
          text: Charles helped with the signs as he spoke.
        - id: ch01-b24
          speaker: caroline
          text: Hush! Step quietly, and don't trip over the wolf-skins.
        - id: ch01-b25
          speaker: narrator
          text: Carrying their candles, the children crept into the morning-room. The face had understood. It was waiting inside the panes of the French window. Caroline opened the door-like window, and there stood the whole of Rupert, the boy from the platform, or else someone exactly like him.
        - id: ch01-b26
          speaker: caroline
          text: Come in.
        - id: ch01-b27
          speaker: charlotte
          text: Don't be afraid! We'll outwit anyone chasing you. We're yours to the death.
        - id: ch01-b28
          speaker: narrator
          text: Rupert stepped in, dusty and drooping. The window had opened gently and quietly, but when Caroline closed it, it gave a terribly unhelpful squawk.
        - id: ch01-b29
          speaker: caroline
          text: Run! But your boots may give us away.
        - id: ch01-b30
          speaker: narrator
          text: There was nothing to do but run and risk the boots. Yet Rupert moved as quietly as the others. They wore bath slippers, and with care those were shoes of silence.
        - id: ch01-b31
          speaker: narrator
          text: Once they were safely inside Charles's room, they shut the door and blew out the candles. In the darkness they clung to one another and held their breath. They expected Mrs. Wilmington's lock to click, her door to creak, her gown to rustle closer, and her careful voice to cry out in surprise.
        - id: ch01-b32
          speaker: narrator
          text: Nothing happened. The room was as still as the inside of a palm-house, which is quieter than almost any other quiet place in this noisy world. The four fugitives slowly let out their breaths, then held them again. Silence and darkness wrapped around them, thick and unbroken.
        - id: ch01-b33
          speaker: caroline
          text: It's all right. Light the candles.
        - id: ch01-b34
          speaker: narrator
          text: Luckily, every silver candlestick had a box of safety matches in a silver holder chained to its handle. That can happen in a very well-run house. Soon the candles were burning again.
        - id: ch01-b35
          speaker: charlotte
          text: We're saved!
          emotion: happy
        - id: ch01-b36
          speaker: caroline
          text: You came up as quietly as a mouse, Rupert. A very quiet mouse.
        - id: ch01-b37
          speaker: narrator
          text: Then they saw why. Rupert's muddy boots were in his hand, tied together with worn bootlaces.
        - id: ch01-b38
          speaker: rupert
          text: I took them off when I reached the park. My feet hurt so much, and the grass felt soft and lovely. Oh, I'm so tired and hungry!
          emotion: sad
        - id: ch01-b39
          speaker: narrator
          text: His voice wavered. If he had not been a boy, he might have cried.
        - id: ch01-b40
          speaker: charlotte
          text: Climb onto the bed and lie down. You can be a wounded warrior, and we'll be the Arab oasis you've reached.
        - id: ch01-b41
          speaker: narrator
          text: Charles helped Rupert up onto the huge feather bed.
        - id: ch01-b42
          speaker: charlotte
          text: That's the sheikh's tent. Rest there, weary and honored stranger. We may be humble Arabs, but we welcome travelers. Now we'll go and hunt a desert deer for you.
        - id: ch01-b43
          speaker: caroline
          text: There are plenty of biscuits in the dining-room sideboard. I'll stay with the wounded warrior. Unless one of you wants to stay, and then I'll go with the other one.
        - id: ch01-b44
          speaker: narrator
          text: Though it was midnight, no one thought of sleep. Perhaps this truly real adventure kept them awake. Perhaps fern-seed has that effect. Whatever the reason, the three C's were as ready for a new game as if it were ten in the morning on the first holiday, instead of half past twelve on St. John's Eve.
        - id: ch01-b45
          speaker: narrator
          text: Charlotte and Charles set off on tiptoe to hunt for biscuits. Caroline played the good little nurse. She fetched a basin and sponge and washed Rupert's face, ignoring his protests that he was not a baby. In her long dressing gown, she hoped she looked a little like an Arab maiden caring for a foreign warrior.
        - id: ch01-b46
          speaker: caroline
          text: Now put your feet over the side of the bed, and I'll wash them. That's what they always do in Saracen lands. If washing sounds babyish, we'll call it dressing your wounds.
        - id: ch01-b47
          speaker: narrator
          text: She carefully brought a chair, a basin of water, and a large sponge. Then she peeled off Rupert's stockings and gently bathed his sore, swollen feet. A little water spilled onto the bed, but no one can think of everything at once. Afterward, she did remember to put a towel under his legs.
        - id: ch01-b48
          speaker: rupert
          text: That feels jolly good.
        - id: ch01-b49
          speaker: caroline
          text: These wounds are dreadful. You must have fought dragons, walked on red-hot ploughshares, or made a pilgrimage with peas in your shoes. We play pilgrims sometimes, with shells on our hats and staffs in our hands. We only pretend about the peas, though. It's fair to pretend that part, isn't it?
        - id: ch01-b50
          speaker: narrator
          text: Charlotte and Charles returned from the hunt with a fine bag of biscuits, though their bag was really a tin.
        - id: ch01-b51
          speaker: caroline
          text: Hush! The stranger is asleep. Let's say he's fainted and wake him with a skin of wine. Put some water in the tooth mug. And where are those biscuits?
        - id: ch01-b52
          speaker: charlotte
          text: We ought to have turbans too.
        - id: ch01-b53
          speaker: narrator
          text: Charlotte quickly wound a bath towel around her head.
        - id: ch01-b54
          speaker: charlotte
          text: Every proper Arab maiden is a turbaned Turk.
        - id: ch01-b55
          speaker: charles
          text: Let's make the room look more like a tent before he wakes. We can pull the curtains around the bed and hide the candles as if they were Arabian knights' lanterns.
        - id: ch01-b56
          speaker: charlotte
          text: Or we can line them up on the chest and call them the sun rising over the desert sands.
        - id: ch01-b57
          speaker: narrator
          text: Charlotte set the three candlesticks in a row. When everything was ready, the towel-turbaned children climbed into the tent. Rupert lay fast asleep. He looked terribly tired, with his feet still wrapped in the towel and his head slipping halfway off the pillow.
        - id: ch01-b58
          speaker: caroline
          text: Let him rest a little longer before we wake him to eat the deer my brothers brought to our wigwam for this poor pale-face.
        - id: ch01-b59
          speaker: charlotte
          text: Don't be silly. We're Arabs, not Indians. And I wouldn't mind some of that deer myself.
        - id: ch01-b60
          speaker: charles
          text: Neither would I.
        - id: ch01-b61
          speaker: narrator
          text: His turban had slipped over one eye.
        - id: ch01-b62
          speaker: charles
          text: Staying awake is jolly. People say you'll get sleepy and cross if you're allowed to sit up late, but just look at us.
        - id: ch01-b63
          speakers: [caroline, charlotte]
          ensemble: duo
          text: Yes, look at us.
        - id: ch01-b64
          speaker: narrator
          text: They ate the best mixed biscuits in peaceful silence, with nothing to hear but crunching.
        - id: ch01-b65
          speaker: narrator
          text: The familiar feeling of biscuit in their mouths quieted the children's excitement. Everything that had happened began to seem stranger and more real. Eating biscuits also made them stop talking, unless they wanted to speak with full mouths and scatter crumbs everywhere. That gave them time to think.
        - id: ch01-b66
          speaker: caroline
          text: Do you know—pass the mug, please—I don't know what we're going to do with him.
        - id: ch01-b67
          speaker: charlotte
          text: I was thinking exactly that.
        - id: ch01-b68
          speaker: charles
          text: So was I.
        - id: ch01-b69
          speaker: caroline
          text: But I've been thinking—
        - id: ch01-b70
          speakers: [charlotte, charles]
          ensemble: duo
          text: So have we.
        - id: ch01-b71
          speaker: caroline
          text: About what?
        - id: ch01-b72
          speaker: charlotte
          text: The same thing as you.
        - id: ch01-b73
          speaker: charles
          text: The same thing.
        - id: ch01-b74
          speaker: caroline
          text: Then I don't need to tell you my idea.
        - id: ch01-b75
          speaker: narrator
          text: Perhaps they were getting sleepy after all. Or perhaps the fern-seed was losing its power.
        - id: ch01-b76
          speaker: charlotte
          text: Oh, don't be cross. We only meant that we can't see what to do with him. He'll have to sleep with Charles. There's plenty of room.
        - id: ch01-b77
          speaker: narrator
          text: Charlotte leaned back against a soft mound of feather bed and closed her eyes.
        - id: ch01-b78
          speaker: caroline
          text: Oh no, you don't.
        - id: ch01-b79
          speaker: narrator
          text: Caroline pulled her sister upright by one limp arm.
        - id: ch01-b80
          speaker: caroline
          text: I could fall asleep too. Take off that turban. It may cool you down and wake you up.
        - id: ch01-b81
          speaker: charlotte
          text: I said, “Let him sleep with Charles.”
        - id: ch01-b82
          speaker: narrator
          text: Charlotte spoke very slowly, the way people do when they are so tired that they are not sure they can speak at all.
        - id: ch01-b83
          speaker: caroline
          text: Oh, yes! Then they'll find him when they wake us, capture him alive, and hand him back to that Murdstone man. We have to hide him and wake him before anyone comes in. I can make myself wake early by bumping my head on the pillow the right number of times before I sleep.
        - id: ch01-b84
          speaker: narrator
          text: Charlotte's head was nodding happily.
        - id: ch01-b85
          speaker: caroline
          text: Get up! Up now! Off the bed and onto your feet. Charles, that means you too!
        - id: ch01-b86
          speaker: narrator
          text: But Charles was sound asleep, with his mouth open much wider than it should have been.
        - id: ch01-b87
          speaker: caroline
          text: There we are. It's only you and me now. Women always have to do the world's work. Aunt Emmeline once said it isn't “Men must work and women must weep.” It's “Men must talk and women must work.” Come on. Help me.
        - id: ch01-b88
          speaker: charlotte
          text: All right, I'm awake. I was biting my tongue through that whole dreadful speech. What's your plan?
        - id: ch01-b89
          speaker: caroline
          text: We'll build him an upper berth, like the ones on ships. Then we'll wake him, give him water and biscuits, and explain everything. We'll put Charles to bed and hide every trace. You and I will have done it all. That's glory.
        - id: ch01-b90
          speaker: charlotte
          text: Oh, please stop talking. I'll do whatever you want if you'll only stop.
