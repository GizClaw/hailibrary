audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 温暖机敏，带着克制的幽默讲述
        timbre: 清澈柔和
        pace: 从容而富有变化
        pitch: 中音
    caroline:
      display_name: 卡罗琳
      tts:
        delivery: 大方热情，努力摆出长姐的懂事
        timbre: 明亮清脆
        pace: 自然轻快
        pitch: 中高音
    charlotte:
      display_name: 夏洛特
      tts:
        delivery: 活泼直率，想到什么便说什么
        timbre: 轻盈清亮
        pace: 偏快
        pitch: 高音
    charles:
      display_name: 查尔斯
      tts:
        delivery: 淘气认真，笑话总说得一本正经
        timbre: 清亮的男孩声
        pace: 轻快
        pitch: 中高音
    rupert:
      display_name: 鲁珀特
      tts:
        delivery: 倔强有礼，疲惫时仍尽力稳住声音
        timbre: 略带沙哑的男孩声
        pace: 自然偏慢
        pitch: 中高音
  chapters:
    - id: ch01
      title: 第五章　午夜奇遇
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: |-
            蕨种只答应让人看见看不见的东西，可没说能叫人听见听不见的声音。那只举起的手要是敲了窗户，屋里却听不到动静，魔法就跟拉丁文书上说的一样。可要是玻璃真的响了，那便有两种可能。也许蕨种的本领比书上写的还大。孩子们明明没有把同一种魔法敷在耳朵上，它却连无声之声也能送进来。也许整套咒语都是胡闹。窗外本来就是一张真人的脸，那只手也是有血有肉的手。这样的手指落在玻璃上，当然会敲出又硬又脆的响声。
        - id: ch01-b02
          speaker: narrator
          text: |-
            三个孩子都很确定，自己其实一点也拿不准。他们更盼着看见真人，还是盼着看见被蕨种显出来的隐形人呢？手指终于碰上玻璃，一声轻轻的敲击传进屋里，听得清清楚楚。那声音正像你或我不愿惊动满屋子的人，只敢悄悄敲窗。孩子们虽然吓了一跳，却再也不怀疑了。他们立刻知道自己希望那张脸是谁了。
        - id: ch01-b03
          speaker: charles
          text: |-
            原来只是个真人。
        - id: ch01-b04
          speaker: narrator
          text: |-
            查尔斯深深松了一口气。
        - id: ch01-b05
          speaker: caroline
          text: |-
            只是个男孩。他来做什么？
        - id: ch01-b06
          speaker: charlotte
          text: |-
            是火车上那个鲁珀特。
        - id: ch01-b07
          speaker: narrator
          text: |-
            大家的气都顺了。他们朝窗外微笑点头，那张脸也点点头，却没有笑。
        - id: ch01-b08
          speaker: charles
          text: |-
            他准是逃出来了，照我叫他做的那样。
        - id: ch01-b09
          speaker: charlotte
          text: |-
            才不是你，是我叫他逃的。
        - id: ch01-b10
          speaker: charles
          text: |-
            反正这样比隐形人好多了。这才算真正的冒险。
        - id: ch01-b11
          speaker: caroline
          text: |-
            可要不是我们下来找蕨种，也碰不上这场冒险。
        - id: ch01-b12
          speaker: narrator
          text: |-
            三个人又笑着点头。窗外那张脸动了动嘴唇，可隔着玻璃，屋里一个字也听不到。
        - id: ch01-b13
          speaker: caroline
          text: |-
            真的是鲁珀特。他是逃来找我们的。多好玩呀！
          emotion: happy
        - id: ch01-b14
          speaker: narrator
          text: |-
            卡罗琳和查尔斯还在点头，夏洛特可受不了了。
        - id: ch01-b15
          speaker: charlotte
          text: |-
            别像中国宝塔上的小人一样点个不停啦。他明明是想进来。
        - id: ch01-b16
          speaker: narrator
          text: |-
            另外两个这才明白。
        - id: ch01-b17
          speaker: charlotte
          text: |-
            可他不能从这扇窗进来。
        - id: ch01-b18
          speaker: narrator
          text: |-
            窗前那张桌子根本不能随便挪。桌上有一只装满蕨草的玻璃罩，周围还摆着一盆盆愁眉苦脸的小蕨草。花盆里的土干巴巴的，每一盆上面还扣着一片旧玻璃杯，拱起来护住叶子。只要碰歪一点，玻璃和花盆就可能倒下来。搬动整张桌子既危险，又多半会弄出很大声响。不先清开这一重又一重的蕨草障碍，窗户就不可能打开。
        - id: ch01-b19
          speaker: caroline
          text: |-
            隔壁是晨间起居室，威尔明顿太太是这么叫的。那里有一扇法式落地窗，肯定能开。我知道插销怎么弄。
        - id: ch01-b20
          speaker: narrator
          text: |-
            卡罗琳忙着打手势，叫窗外的人顺着墙走到法式窗。偏偏在这个紧要关头，夏洛特还想长知识。
        - id: ch01-b21
          speaker: charlotte
          text: |-
            可它为什么叫“法式”窗？
        - id: ch01-b22
          speaker: charles
          text: |-
            因为它长得像门。法国什么都跟我们相反。他们把“是”说成“我们”，把“二”说成“你”，把“四”说成“烤箱”。真傻。
        - id: ch01-b23
          speaker: caroline
          text: |-
            嘘！脚步轻一点，别让狼皮绊倒了。
        - id: ch01-b24
          speaker: narrator
          text: |-
            小队伍举着蜡烛，悄悄走进晨间起居室。窗外的人显然看懂了手势，因为那张脸已经等在一格格玻璃后面。那扇法式窗果然跟一扇门没有两样。打开以后，大家看见的不只是脸，还有手、胳膊、身体、腿和脚。合起来正是站台上的鲁珀特，或者一个跟他一模一样的人。
        - id: ch01-b25
          speaker: caroline
          text: |-
            快进来。
        - id: ch01-b26
          speaker: charlotte
          text: |-
            别害怕！我们会挫败追兵。哪怕死，我们也站在你这边。
        - id: ch01-b27
          speaker: narrator
          text: |-
            鲁珀特浑身是灰，疲惫得耷拉着身子，走了进来。那扇窗打开时温顺又安静，关上时却突然尖叫了一声，实在太不识趣。
        - id: ch01-b28
          speaker: caroline
          text: |-
            快逃！可你的靴子会出卖我们。
        - id: ch01-b29
          speaker: narrator
          text: |-
            他们只剩逃跑这一条路，只好冒着让靴子发出声响的危险。谁知鲁珀特跑起来和另外三个一样无声。那三个穿的是浴室拖鞋，只要走得小心些，再留意脚下，它们就是三双无声之鞋。
        - id: ch01-b30
          speaker: narrator
          text: |-
            大家安全钻进查尔斯的房间，关好房门，又吹灭蜡烛。他们在黑暗里彼此拉着，连气也不敢出。他们认定，接下来先会听见威尔明顿太太的门锁咔嗒一响，随后是房门吱呀打开。再往后，她的长袍会一路窸窣着靠近，最后响起她那细声细气、故作惊讶的问话。于是大家一动不动，只管等着。
        - id: ch01-b31
          speaker: narrator
          text: |-
            可四下里静极了，静得像棕榈温室里面。你大概知道，这个吵闹的世界上，安静地方本来就少，而棕榈温室比其中大多数还要安静。
        - id: ch01-b32
          speaker: narrator
          text: |-
            四个逃亡者小心地吐出一口气，又马上屏住。寂静仍旧把他们裹得严严实实，跟身边的黑暗一样浓厚。
        - id: ch01-b33
          speaker: caroline
          text: |-
            没事了。把灯点起来吧。
        - id: ch01-b34
          speaker: narrator
          text: |-
            幸好每座银烛台都带着一盒安全火柴，装在银架里，再用银链拴在把手上。管理得真正周到的人家，确实会这样预备。蜡烛很快重新亮了。
        - id: ch01-b35
          speaker: charlotte
          text: |-
            我们得救了！
          emotion: happy
        - id: ch01-b36
          speaker: caroline
          text: |-
            你上楼时真像一只老鼠，一只安安静静的小老鼠。
        - id: ch01-b37
          speaker: narrator
          text: |-
            这时大家才发现，鲁珀特没有穿靴子。那双靴子沾满泥，正提在他手上，磨毛的鞋带把它们系在一起。
        - id: ch01-b38
          speaker: rupert
          text: |-
            我一进你们的庄园就脱掉了。我的脚疼得厉害，草地又软，踩着可舒服了。唉，我累坏了，还饿得要命！
          emotion: sad
        - id: ch01-b39
          speaker: narrator
          text: |-
            他的声音有些发颤。依我看，要不是因为他是个男孩，他准会哭出来。
        - id: ch01-b40
          speaker: charlotte
          text: |-
            快上床躺下。你是受伤的勇士，我们是你找到的阿拉伯绿洲。那张床就是酋长的帐篷。
        - id: ch01-b41
          speaker: narrator
          text: |-
            查尔斯托了鲁珀特一把，把他送进巨大羽毛床翻滚的波浪里。
        - id: ch01-b42
          speaker: charlotte
          text: |-
            安歇吧，疲惫又尊贵的异乡人。我们虽然只是卑微的阿拉伯人，却最懂得招待客人。我们这就去猎一头沙漠里的鹿给你吃。
        - id: ch01-b43
          speaker: caroline
          text: |-
            餐厅的餐具柜里有好多饼干。我可以留下照顾伤员。要不你留下，我跟另一个没留下的人去。
        - id: ch01-b44
          speaker: narrator
          text: |-
            已经半夜了，可谁也没想到困。也许这场冒险太真实，叫人兴奋。也许蕨种本来就能提神。总之，三个名字以 C 开头的孩子又准备好玩新游戏了。他们的精神好得不得了，仿佛现在是假期第一天的上午十点。可事实上，时间已经到了夜里十二点半。这个夜晚本来没有任何特别，只不过碰巧是圣约翰节前夜。
        - id: ch01-b45
          speaker: narrator
          text: |-
            夏洛特和查尔斯肩负着重大任务，踮起脚尖，出门猎取饼干。卡罗琳留在房里，像个尽职的小护士。她拿来脸盆和海绵，认认真真给这位陌生人洗脸。鲁珀特一再抗议，说自己不是小娃娃，卡罗琳只当没听见。她更关心另一件事。自己穿着长睡袍，弯腰照顾伤员，看起来会不会有一点像服侍法兰克勇士的阿拉伯少女呢？她真心盼望会。
        - id: ch01-b46
          speaker: caroline
          text: |-
            现在轮到洗你这双疲惫的脚了。请把脚伸出床沿。撒拉逊人的地方总是这样。要是你觉得这样像小娃娃，我就说我是在替你包扎伤口。
        - id: ch01-b47
          speaker: narrator
          text: |-
            她小心搬来一把椅子，端来一盆清水和一大块海绵。接着，卡罗琳剥下鲁珀特的袜子，十分仔细，也十分轻柔地浸洗那双又累又肿的脚。确实有一点水泼到了床上，可谁能在短短一会儿里，把每一件事都想得周周全全呢？再说，她后来也想起来了，还特意拿一条毛巾垫在鲁珀特腿下。
        - id: ch01-b48
          speaker: rupert
          text: |-
            这样可真舒服。
        - id: ch01-b49
          speaker: caroline
          text: |-
            你的伤太重了。一定是刚打过恶龙，或者走过烧红的犁头。也可能你去朝圣了，鞋里还塞着豌豆。我们有时也玩朝圣者，帽子上戴扇贝壳，手里拿朝圣杖，不过豌豆总是假装的。鞋也假装一下，应该很公平吧？
        - id: ch01-b50
          speaker: narrator
          text: |-
            另外两个打猎回来，收获很不错。其实，他们只是带回一只装满饼干的铁罐。撒拉逊少女连忙迎上去。
        - id: ch01-b51
          speaker: caroline
          text: |-
            嘘！异乡人睡着了。我们就当他昏过去，再拿一皮囊葡萄酒把他救醒。用漱口杯装些水来。饼干在哪里？
        - id: ch01-b52
          speaker: charlotte
          text: |-
            我们也该戴头巾。真正的阿拉伯少女都是裹头巾的土耳其人。
        - id: ch01-b53
          speaker: narrator
          text: |-
            她匆忙把一条浴巾缠在头上。
        - id: ch01-b54
          speaker: charles
          text: |-
            先把这里弄得更像帐篷，再叫醒他。我们可以把蜡烛藏起来，假装那是阿拉伯骑士的灯笼。
        - id: ch01-b55
          speaker: narrator
          text: |-
            查尔斯说着，拉起四柱床两边的帷幔。
        - id: ch01-b56
          speaker: charlotte
          text: |-
            也可以把蜡烛在衣箱上排成一行，当作太阳从沙漠上升起来。
        - id: ch01-b57
          speaker: narrator
          text: |-
            她把三座烛台排好。一切布置妥当，三个裹着浴巾头巾的孩子爬进帐篷，望着受伤的骑士。鲁珀特睡得很熟，看起来实在累极了，双脚仍包在毛巾里，脑袋有一半滑出了枕头。
        - id: ch01-b58
          speaker: caroline
          text: |-
            让他再睡一会儿。等我的兄弟为了可怜的白脸人，把鹿肉带回棚屋，我们再唤醒他享用。
        - id: ch01-b59
          speaker: charlotte
          text: |-
            我们又不是印第安人，笨蛋。我们是阿拉伯人。再说，要是有鹿肉，我也很想吃一点。
        - id: ch01-b60
          speaker: charles
          text: |-
            我也想吃。不用睡觉真有趣。人家说，小孩子获准熬夜以后会又困又爱发脾气。可你们看看我们。
        - id: ch01-b61
          speakers: [caroline, charlotte]
          ensemble: duo
          text: |-
            对呀，看看我们。
        - id: ch01-b62
          speaker: narrator
          text: |-
            查尔斯的头巾已经滑下来，遮住一只眼睛。三个孩子却心满意足地吃起上等什锦饼干。他们刚才还声称自己一点也不困，一点也不爱发脾气，现在倒真的安静下来。屋里只剩咔嚓咔嚓的咀嚼声。饼干含在嘴里的熟悉滋味，不知怎么，渐渐平息了三个 C 的兴奋。
        - id: ch01-b63
          speaker: narrator
          text: |-
            夜里的种种奇遇，正在发生时好像没多么稀奇，现在回想起来，却越来越惊人，也越来越真实。吃饼干又需要安静。除非你情愿表现得实在没规矩，嘴里塞满饼干还要开口，把碎屑喷得到处都是。不然的话，每个人都只好静静地嚼。这样的安静正适合慢慢回想，也给了他们足够的工夫去思考。可以说，它是思考的好朋友。
        - id: ch01-b64
          speaker: caroline
          text: |-
            你们知道吗？先把杯子递给我。你们知道吗，我根本不知道该拿鲁珀特怎么办。
        - id: ch01-b65
          speaker: charlotte
          text: |-
            我刚才就在想这个。
        - id: ch01-b66
          speaker: charles
          text: |-
            我也是。
        - id: ch01-b67
          speaker: caroline
          text: |-
            可是我一直在想……
        - id: ch01-b68
          speakers: [charlotte, charles]
          ensemble: duo
          text: |-
            我们也一直在想。
        - id: ch01-b69
          speaker: caroline
          text: |-
            想什么？
        - id: ch01-b70
          speaker: charlotte
          text: |-
            跟你想的一样。
        - id: ch01-b71
          speaker: charles
          text: |-
            对，跟你一样。
        - id: ch01-b72
          speaker: caroline
          text: |-
            那我就不用告诉你们，我想了什么。
        - id: ch01-b73
          speaker: narrator
          text: |-
            看来他们都有点困了，也可能是蕨种的效力正在消退。
        - id: ch01-b74
          speaker: charlotte
          text: |-
            哎呀，别闹脾气。我们只是也不知道究竟该拿他怎么办。我看他只好跟查尔斯睡，床上地方多着呢。
        - id: ch01-b75
          speaker: narrator
          text: |-
            她往后一倒，陷进羽毛床蓬松的褶皱，闭上了眼睛。卡罗琳抓住她软绵绵的胳膊，又把她拉起来坐好。
        - id: ch01-b76
          speaker: caroline
          text: |-
            不许睡。真要说起来，我自己也能睡着。把头巾摘掉，脑袋凉快一点，就不会这么困了。
        - id: ch01-b77
          speaker: narrator
          text: |-
            夏洛特说得极慢，一个字一个字，清清楚楚。人困到连自己还能不能开口都拿不准时，往往就是这种腔调。
        - id: ch01-b78
          speaker: charlotte
          text: |-
            我说的是，让他跟查尔斯一起睡。
        - id: ch01-b79
          speaker: caroline
          text: |-
            好主意呀！明早他们来叫我们，一眼发现他，再把他活捉了送回默德斯通那家伙手里。不行，我们得把他藏起来，还要在他们叫我们以前喊醒他。我每天睡前只要拿脑袋在枕头上撞够一定的次数，早上准会醒。我常常这么办。
        - id: ch01-b80
          speaker: narrator
          text: |-
            夏洛特幸福地打起瞌睡，脑袋一点一点。
        - id: ch01-b81
          speaker: caroline
          text: |-
            起来！快起来！从床上下来，站到地上。查尔斯，现在轮到你了！
          emotion: angry
        - id: ch01-b82
          speaker: narrator
          text: |-
            可查尔斯已经睡得很沉，嘴巴张得远远超过了应有的大小。夏洛特总算顺着卡罗琳的拉扯站起来。
        - id: ch01-b83
          speaker: caroline
          text: |-
            就知道会这样！只剩我们两个了。世上的活总要靠女人来干！埃默琳姨妈有一次说，不是“男人须劳作，女人须哭泣”，而是“男人只管说，女人只管做”。来，帮我一把。
        - id: ch01-b84
          speaker: charlotte
          text: |-
            好啦，我现在醒了。你刚才说了那么长一大通，我一直咬着舌头，难受极了。你到底有什么主意？
        - id: ch01-b85
          speaker: caroline
          text: |-
            我们给他做一张上铺，就像船上的床位。再叫醒他，给他喝水，喂他饼干，把事情讲清楚。然后让查尔斯上床，把所有痕迹全藏好。这件事就全是你和我做成的。那才叫光荣。
        - id: ch01-b86
          speaker: charlotte
          text: |-
            哎呀，你别再说了。只要你停下来，叫我做什么都行。
        - id: ch01-b87
          speaker: narrator
          text: |-
            房间里有一座巨大的桃花心木衣柜。柜子两边各有一个挂衣橱，中间留出一块地方，下方是一层层桃花心木抽屉，上方则是一层层桃花心木搁板。那些搁板像很浅的抽屉，也像很深的托盘，每一层都能抽进抽出。上面没有衣物，也没有杂物，只铺着干净的白纸。每层还放着一个白细棉布小袋，袋里装满晒干的薰衣草。甜甜的香气透过细密的布眼飘出来。
        - id: ch01-b88
          speaker: narrator
          text: |-
            女孩们抽出两层托盘，把它们藏到床底。最低和最高的托盘之间立刻腾出一大片空隙，跟轮船上下铺之间留给人的地方差不多。她们拿来毯子和枕头，在里面铺好一张临时小床。所有东西都预备停当以后，她们才去叫醒两个男孩。办法既温柔又坚决。先把湿海绵贴到额头上，再用一只手捂住嘴，免得睡梦中的人突然惊醒，放声大叫。
        - id: ch01-b89
          speaker: narrator
          text: |-
            不过，两个男孩醒来时都很安静。查尔斯只醒了那么一点点，刚好够他乖乖任人摆布。女孩们脱掉他的外套和拖鞋，把他整个塞进被窝。鲁珀特倒是彻底醒了。他吃下饼干，喝了水，也听懂女孩们的安排。剩下的半夜要在哪里度过，要用什么办法藏身，又为什么非得这样不可，他全都明白了。
        - id: ch01-b90
          speaker: narrator
          text: |-
            鲁珀特踩着一把椅子，爬进衣柜里的临时上铺。等他躺稳以后，女孩们立刻把椅子搬走，又把两扇衣柜门合起来，只留下一道窄窄的缝。
        - id: ch01-b91
          speaker: charlotte
          text: |-
            明天我们要开一次大会。别担心，只要记住，我们哪怕死也站在你这边。我在站台上就这么告诉过你。
        - id: ch01-b92
          speaker: charles
          text: |-
            那句话是我说的。
        - id: ch01-b93
          speaker: narrator
          text: |-
            查尔斯几乎是在睡梦里纠正她。
        - id: ch01-b94
          speaker: caroline
          text: |-
            不管发生什么，你都别出来。我会很早过来，再把你藏到别处。我睡着以后准能想到办法，我常常这样。晚安。
        - id: ch01-b95
          speaker: rupert
          text: |-
            晚安。我说，你们真是了不起的好伙伴。你们不会让他们抓到我吧？
        - id: ch01-b96
          speakers: [caroline, charlotte, charles]
          ensemble: chorus
          text: |-
            当然不会。
        - id: ch01-b97
          speaker: narrator
          text: |-
            三个 C 答得信心十足，虽然查尔斯完全是在睡梦里说话。只过了五分钟，另外几个人也睡得和查尔斯一样沉。可是远在汤布里奇一带，默德斯通那家伙还没有停下来。他带着自己的马夫、园丁和当地警察，仍旧忧心忡忡地四处寻找鲁珀特。众人手里的灯笼闪着昏黄的光，在黎明淡灰色的天幕下忽明忽暗。
