audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 温暖机敏，带着克制的幽默讲述
        timbre: 清澈柔和
        pace: 从容而富有变化
        pitch: 中音
    caroline:
      display_name: 卡罗琳
      tts:
        delivery: 大方热情，努力摆出长姐的懂事
        timbre: 明亮清脆
        pace: 自然轻快
        pitch: 中高音
    charlotte:
      display_name: 夏洛特
      tts:
        delivery: 活泼直率，想到什么便说什么
        timbre: 轻盈清亮
        pace: 偏快
        pitch: 高音
    charles:
      display_name: 查尔斯
      tts:
        delivery: 淘气认真，笑话总说得一本正经
        timbre: 清亮的男孩声
        pace: 轻快
        pitch: 中高音
    mrs_wilmington:
      display_name: 威尔明顿太太
      tts:
        delivery: 谨慎严肃，字句里带着管家的规矩
        timbre: 紧致清楚
        pace: 稍慢
        pitch: 中音
    rupert:
      display_name: 鲁珀特
      tts:
        delivery: 直爽开朗，病中说话虚弱而迷糊
        timbre: 清亮的少年声
        pace: 自然，发烧时忽快忽慢
        pitch: 中高音
    uncle_charles:
      display_name: 查尔斯舅舅
      tts:
        delivery: 温和飘忽，偶尔流露出幽微的兴味
        timbre: 轻柔低沉
        pace: 舒缓
        pitch: 中低音
    harriet:
      display_name: 哈丽雅特
      tts:
        delivery: 机灵健谈，带着年轻女佣爽快的口气
        timbre: 清脆明快
        pace: 偏快
        pitch: 中高音
    doctor:
      display_name: 医生
      tts:
        delivery: 爽朗笃定，说话干脆而带幽默
        timbre: 洪亮温厚
        pace: 自然利落
        pitch: 中低音
  chapters:
    - id: ch01
      title: 第十三章　玫瑰妙方
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: |-
            威尔明顿太太发现鲁珀特睡在一堆沾着露水、已经压烂的玫瑰花瓣里，倒还明白不该惊醒他。她又往他身上添了两条毯子，让他继续安睡。自己则裹紧披肩，在四柱床床尾那张蓝沙发上度过了余下的夜晚。
        - id: ch01-b02
          speaker: narrator
          text: |-
            一大早，查尔斯舅舅衣冠整齐，早早下楼去书房。脸色煞白的女管家迎面拦住他。她薄薄的嘴唇抿得死紧，一看就有话要说。
        - id: ch01-b03
          speaker: mrs_wilmington
          text: |-
            先生，请您让那几个孩子离开这所宅子。不然，我走。我说的就是那几个孩子。
          emotion: angry
        - id: ch01-b04
          speaker: uncle_charles
          text: |-
            他们这回又干什么了？
        - id: ch01-b05
          speaker: narrator
          text: |-
            舅舅问得很疲倦。他刮胡子时刚想到一个研究科普特魔法的新点子，只想独自守着这个点子，好好吃早餐。
        - id: ch01-b06
          speaker: mrs_wilmington
          text: |-
            他们使出浑身解数，差点就在床上谋杀了那位可怜的小少爷。
          emotion: angry
        - id: ch01-b07
          speaker: narrator
          text: |-
            她说这话时，活像一幅瘦削版的西登斯夫人画像。
        - id: ch01-b08
          speaker: uncle_charles
          text: |-
            他们把花草之类放进那孩子吃的、喝的东西里了？
        - id: ch01-b09
          speaker: mrs_wilmington
          text: |-
            比那更糟，先生，糟得多。他们把那孩子放进花草之类里头去了。我已经自作主张，请人去叫医生。求您让我收拾他们的箱子吧。再这样下去，谁的命都保不住……都保不住，我是说。
          emotion: angry
        - id: ch01-b10
          speaker: uncle_charles
          text: |-
            请你克制一下。这件事我会查清楚，医生看过那孩子以后，我也会见他。眼下别再大惊小怪。请告诉厨娘，另做一份煎蛋卷，再沏一壶茶。这些东西已经凉得不能给人吃了。
        - id: ch01-b11
          speaker: narrator
          text: |-
            威尔明顿太太把手帕塞回口袋，回到鲁珀特身边。他正裹在一堆毯子里扭来扭去，问有什么东西可以给他吃。鲁珀特的确好多了，毫无疑问。哈丽雅特送早餐时，已经悄悄把这个消息告诉了孩子们。
        - id: ch01-b12
          speaker: harriet
          text: |-
            可W太太这回真气疯了，简直暴跳如雷。换成你们，我可一点也不愿碰上她。真不知道你们怎么想得出这种事。老爷差不多还没起床，她就找上去没完没了地数落，那阵势真是吓人得很。
        - id: ch01-b13
          speaker: charlotte
          text: |-
            你怎么知道？
        - id: ch01-b14
          speaker: harriet
          text: |-
            小姐，我知道的可比你想的多。我要打听什么，自有我自己的法子。我还知道一道准灵的咒语，能查出你将来要嫁的那位先生叫什么名字。哪天我教你，只要这场风波能过去，你们也别因为这件事被赶走。
        - id: ch01-b15
          speaker: charlotte
          text: |-
            谁稀罕结婚。我谁也不嫁。我要做北极探险家，驾船航行在北方冰冷的海上。
        - id: ch01-b16
          speaker: harriet
          text: |-
            你还是先想想眼前这锅热水吧。听我劝，别跟她顶嘴，这样风波兴许就过去了。少说一句，少惹一事，这是我的主张。只要你们不还嘴，她总不能永远说个没完。
        - id: ch01-b17
          speaker: charles
          text: |-
            可你不还嘴，他们又说你闹别扭。
        - id: ch01-b18
          speaker: harriet
          text: |-
            不会的，查尔斯少爷。她每次停下来喘气，你就说“是，太太”“不是，太太”。相信我，准能把她磨得没脾气。
        - id: ch01-b19
          speaker: narrator
          text: |-
            三个C没想明白，挨骂时不停回答“是，太太”和“不是，太太”，怎样才能把威尔明顿太太磨得筋疲力尽。他们也知道，就算解释自己为什么做那件事，她绝不会懂。于是那顿责骂很不好受。她围着玫瑰花瓣说了老半天，又说他们差点害死鲁珀特。可卡罗琳后来坚持说，花瓣明明给他添了生机和活力，才叫他好起来。
        - id: ch01-b20
          speaker: narrator
          text: |-
            威尔明顿太太还告诉他们，休想出门再惹出什么危险的祸事。她说，等医生看过鲁珀特一离开，舅舅马上就会把他们狠狠训斥一顿。
        - id: ch01-b21
          speaker: charles
          text: |-
            可我们明天能出去，对不对？
        - id: ch01-b22
          speaker: mrs_wilmington
          text: |-
            说不定你们明天已经不在这里了。
        - id: ch01-b23
          speaker: narrator
          text: |-
            这句话听得人心里发慌。孩子们留在餐厅，等着挨那顿狠狠的训。你一定知道，等着挨训有多难熬。他们愁眉苦脸地坐在那里，甚至怀疑威尔明顿太太会不会碰上什么异乎寻常的意外，竟然有生以来对了一回。他们是不是真的害了鲁珀特？差不多每隔半分钟，三个人就彼此安慰，说鲁珀特到底已经好多了，不管她怎么讲，他就是好多了。
        - id: ch01-b24
          speaker: narrator
          text: |-
            三个人都觉得，非见医生一面，问清有没有害到鲁珀特不可。他们想过躲进鲁珀特房里的衣柜，偷听医生在床边说出的高明见解。可偷听不够光明磊落，威尔明顿太太也没给他们藏起来的机会。等医生下楼进了舅舅的书房，趴在门外偷听也因为同样的理由办不到。唯一的办法，就是让餐厅门一直开着。
        - id: ch01-b25
          speaker: caroline
          text: |-
            再猛扑上去。只要扑得突然、扑得准，谁也来不及阻止，我们就已经问完了。我们就问，鲁珀特怎么样？他究竟更糟了，还是好些了？再说医生是位绅士。淑女问了话，他非回答不可。
        - id: ch01-b26
          speaker: charles
          text: |-
            你们不是淑女，只是两个小女孩。
        - id: ch01-b27
          speaker: narrator
          text: |-
            另两个人没有跟他计较。毕竟，这是受考验的时候。卡罗琳反倒用一种温柔得叫人难以忍受的口气回答。
        - id: ch01-b28
          speaker: caroline
          text: |-
            不，亲爱的查尔斯，我们就是淑女。艾梅琳姨妈说，想做淑女，开始得越早越好。所以喝东西以前要擦嘴，喝完也要擦。绝不能插嘴，出门以前还得把手套戴好。那个满地泥泞的星期五，我送给清扫街口的人一便士，他就说我是个真正的小淑女。你一定记得那一天，查尔斯。就是你把墨水打翻在我那本《觉醒的赫里沃德》上的那天。
        - id: ch01-b29
          speaker: charles
          text: |-
            喂，别提了。我根本没做那种事！
        - id: ch01-b30
          speaker: charlotte
          text: |-
            噢，休战吧，看在老天的分上。现在正该彼此撑腰，要是还互相挖苦，我们就跟逃兵一样。团结起来，我们站得住。一分开，我们就会落进威尔明顿的魔掌。听，是舅舅的门！
        - id: ch01-b31
          speaker: narrator
          text: |-
            三个孩子一齐冲进门厅。医生正站在那里，向查尔斯舅舅说最后几句客套话，吃惊地迎上一支孩子组成的冲锋队。三个孩子谁也不退让，坚定地一齐发问。
        - id: ch01-b32
          speakers: [caroline, charlotte, charles]
          ensemble: chorus
          text: |-
            鲁珀特怎么样？他更糟了吗？好些了吗？我们真的伤害他了吗？
        - id: ch01-b33
          speaker: doctor
          text: |-
            他好多了。你们的玫瑰花瓣，是所谓包裹疗法的一种变通。你们帮了他天大的忙。不过，这也可能非常危险，非常危险。判决如下，无罪，但下不为例。
          emotion: happy
        - id: ch01-b34
          speaker: narrator
          text: |-
            医生正快活地搓着手。舅舅在他身后轻轻哼了一声，威尔明顿太太也从楼梯顶上意味深长地大声咳嗽，他才赶紧添上后半句话。随后，他红扑扑的脸上露出爽朗的笑，走出大门，骑上马离去了。
        - id: ch01-b35
          speaker: uncle_charles
          text: |-
            现在，该说说你们的事了。
        - id: ch01-b36
          speaker: narrator
          text: |-
            舅舅领他们回到餐厅。那一幕还是拉起帷幕遮住吧。挨一顿狠狠的训，从来不是什么值得记录的愉快事。何况三个C究竟该不该挨这一顿，我也说不准。让他们恰好用对了治疗鲁珀特的办法，究竟是巧合，还是魔法？
        - id: ch01-b37
          speaker: narrator
          text: |-
            他们当然详详细细向舅舅解释，既然用的是三重咒语，它就一定会像实际发生的那样准确生效。舅舅摇着头，没有笑，继续讲什么责任心、谨慎小心等等。夏洛特的眼泪都快涌出来了，她说他们只是在仿效古代的玫瑰十字会会员。舅舅这才真的笑了，却拿手帕挡住笑容，没让孩子们看见。
        - id: ch01-b38
          speaker: uncle_charles
          text: |-
            现在，该说说接下来的事了。
        - id: ch01-b39
          speaker: narrator
          text: |-
            他又说了一遍，却停在这里。三个孩子太熟悉这两个字了。每个人都在心里猜，这回等待他们的究竟会是什么惩罚。
        - id: ch01-b40
          speaker: charles
          text: |-
            但愿不是罚抄。什么都行，只要别罚抄。
        - id: ch01-b41
          speaker: caroline
          text: |-
            但愿不是不许出门。什么都行，只要别关在屋里。今天天气还这么好。
        - id: ch01-b42
          speaker: narrator
          text: |-
            舅舅还是不说话。夏洛特终于受不住了，根本顾不上自己情愿受哪一种惩罚。
        - id: ch01-b43
          speaker: charlotte
          text: |-
            舅舅，我们真的不是存心淘气！鲁珀特也真的没有受伤害。我们不想逃避责任，只求您别再把我们悬在半空，快告诉我们最坏的结果吧。偷一只羊和偷一只羊羔，是不是都要绞死？您知道，要是很快绞死，就等于绞了两次。您说什么，我们都照办。要是您觉得该罚，我们也不怕受罚。只是别照威尔……我是说，别照威尔明顿太太说的办。
          emotion: fearful
        - id: ch01-b44
          speaker: uncle_charles
          text: |-
            她说了什么？
        - id: ch01-b45
          speaker: charlotte
          text: |-
            她说，我们明天说不定就不在这里了。
          emotion: sad
        - id: ch01-b46
          speaker: narrator
          text: |-
            夏洛特说完便哭了起来，卡罗琳也跟着哭了。查尔斯没有哭，只把两只手插进口袋，用力抽了抽鼻子。
        - id: ch01-b47
          speaker: uncle_charles
          text: |-
            别哭，请别哭。我认为自己有责任说的话，已经说完了。事情到此为止。那只是一场错误，我当然没打算为此惩罚你们。我责备你们，是因为……简单说吧，是因为你们插手干预，又把太多责任揽到自己身上。
          emotion: calm
        - id: ch01-b48
          speaker: charlotte
          text: |-
            就是把我们的桨硬插进去。可我们实在太希望鲁珀特好起来了。
          emotion: sad
        - id: ch01-b49
          speaker: uncle_charles
          text: |-
            他已经好了。请别哭，事情过去了。不过，我得要你们答应一件事。
          emotion: calm
        - id: ch01-b50
          speaker: charles
          text: |-
            上一次的诺言，我们遵守了。
        - id: ch01-b51
          speaker: uncle_charles
          text: |-
            我知道。这一次的诺言范围更广，意思也更明确。你们不但不能让别人把你们的药吃进肚子，也不能把药敷在任何朋友身上……或者敌人身上。
        - id: ch01-b52
          speaker: caroline
          text: |-
            就是不准往别人身上抹？好吧。
        - id: ch01-b53
          speaker: uncle_charles
          text: |-
            除非事先问过我。要是还想做什么实验，只送上一束有象征意义的花就足够了。对我来说，那就已经够了。你们还记得吧。
        - id: ch01-b54
          speakers: [caroline, charlotte, charles]
          ensemble: chorus
          text: |-
            我们当然答应。
        - id: ch01-b55
          speaker: charlotte
          text: |-
            舅舅，您真好，没有发更大的脾气！
          emotion: happy
        - id: ch01-b56
          speaker: charles
          text: |-
            我们真的不是存心做坏事。
        - id: ch01-b57
          speaker: caroline
          text: |-
            可你想做好事，有时候偏偏会变成坏事。你又不能干脆什么都不做，虽说什么都不做确实是唯一安全的办法。好多事情就是会变坏，事先怎么也想不到会变成那样。
        - id: ch01-b58
          speaker: uncle_charles
          text: |-
            的确如此。现在擦干眼泪，赶快出去玩吧。还有，要是你们能想个办法，让威尔明顿太太知道你们很抱歉，或许会比较好。
        - id: ch01-b59
          speakers: [caroline, charlotte, charles]
          ensemble: chorus
          text: |-
            您想让我们去，我们当然会去。
        - id: ch01-b60
          speaker: charlotte
          text: |-
            一定会比较好。她总是这么说。
        - id: ch01-b61
          speaker: uncle_charles
          text: |-
            她总说什么是什么？
        - id: ch01-b62
          speaker: charlotte
          text: |-
            我们一说抱歉，她就总说，什么事都说得倒轻巧。
        - id: ch01-b63
          speaker: narrator
          text: |-
            话全说完以后，他们绕到那座一层层铺开台地的花园。三个人坐在草地上，又把刚才发生的整件事从头到尾、翻来覆去议论了一遍。
        - id: ch01-b64
          speaker: charlotte
          text: |-
            世上要真有天使一样的舅舅，那就是我们的舅舅。
        - id: ch01-b65
          speaker: charles
          text: |-
            是啊，鲁珀特也确实好多了。反正我很高兴我们做了那件事。你们是不是也很高兴？
        - id: ch01-b66
          speaker: caroline
          text: |-
            大概吧。高兴。不高兴。高兴。我不知道。你们瞧，咒语确实灵了。不管怎样，能肯定这一点就很了不起。
        - id: ch01-b67
          speaker: narrator
          text: |-
            可偏偏只有这一件事，他们怎么也不能让鲁珀特相信。他当然已经好多了，这是谁都看得见的。可照鲁珀特自己指出的，就算没有那些玫瑰花瓣，他也可能照样好起来。
        - id: ch01-b68
          speaker: rupert
          text: |-
            你们替我弄来那些花瓣什么的，当然特别够朋友。不过我想，是医生给我开的药把我治好了。我不是不领你们的情，可不然的话，要医生干什么呢？
        - id: ch01-b69
          speaker: charles
          text: |-
            我可不知道。但你假装隐身的时候，明明试过蕨籽。
        - id: ch01-b70
          speaker: rupert
          text: |-
            我觉得自己比那时候老成多了。
        - id: ch01-b71
          speaker: narrator
          text: |-
            鲁珀特趴在干燥爽脆的草地上，一边咬着草尖。这是他头一天摆脱那些束缚过病人的规矩。那种日子，你一定知道。明明觉得自己好得很，却只因为伤风、麻疹或别的什么，想出门时偏要留在屋里，想待在屋里时又被赶出去，还说那是“一天里最好的时候”。你觉得最不需要吃药，偏有一小口一小口的药送到面前。你正满心惦记烤牛肉和板油布丁，热牛奶和牛肉茶却又来了。人家还会告诉你，你需要的不是布丁和牛肉这种难消化的食物，而是清淡又有营养的东西。此外，你必须比别人早睡，也不准坐在风口。
        - id: ch01-b72
          speaker: narrator
          text: |-
            这些日子如今全过去了。鲁珀特又成了大家当中的一员，能跟别人一样正常吃饭。顺带一提，他父母拍来电报，万分感谢查尔斯舅舅，也接受他的邀请，让鲁珀特在庄园宅邸度过余下的假期。他们还拍电报告诉默德斯通先生，鲁珀特不会再回到他那里。现在，尽情享受快乐似乎已经没有任何阻碍，只剩下一个小问题，鲁珀特不肯相信咒语。
        - id: ch01-b73
          speaker: caroline
          text: |-
            可蕨籽明明灵验了，秘密玫瑰也灵验了，玫瑰十字会的那些玫瑰花瓣同样灵验了。
        - id: ch01-b74
          speaker: rupert
          text: |-
            蕨籽怎么能算灵验？我根本没隐身，你们隔着窗户全看见我了。
        - id: ch01-b75
          speaker: charlotte
          text: |-
            可你本来就想让我们看见你呀。你自己不想让咒语生效，怎么能指望它生效？假如我是咒语，我反正不会。
        - id: ch01-b76
          speaker: caroline
          text: |-
            根本不是那么回事。你忘了吗？我们嚼蕨籽，是为了看见隐形的东西，后来我们看见了你。你也嚼过蕨籽，所以你当时就是隐形的。每一步都严丝合缝，只是你偏偏不肯明白。你愿意的话，我们就再试一回，我说的是再试蕨籽。
        - id: ch01-b77
          speaker: narrator
          text: |-
            可鲁珀特怎么也不肯再试。他宁愿继续趴在草地上读《狗儿克鲁索》。其他人也各自拿了书来看。
