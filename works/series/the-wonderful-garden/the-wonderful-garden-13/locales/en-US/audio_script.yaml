audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm, observant storytelling with a gently amused touch
        timbre: clear and rounded
        pace: measured
        pitch: medium
    caroline:
      display_name: Caroline
      tts:
        delivery: lively, affectionate, and increasingly careful when being polite
        timbre: bright and clear
        pace: medium
        pitch: medium-high
    charlotte:
      display_name: Charlotte
      tts:
        delivery: eager, curious, and quick with an idea
        timbre: light and energetic
        pace: brisk
        pitch: high
    charles:
      display_name: Charles
      tts:
        delivery: proud, teasing, and boyishly direct
        timbre: youthful and crisp
        pace: medium-fast
        pitch: medium-high
    rupert:
      display_name: Rupert Wix
      tts:
        delivery: blunt and gloomy at first, warming quickly among friends
        timbre: youthful and slightly husky
        pace: medium
        pitch: medium-high
    mrs_wilmington:
      display_name: Mrs. Wilmington
      tts:
        delivery: correct, reserved, and carefully ladylike
        timbre: pale and precise
        pace: measured
        pitch: medium
    uncle_charles:
      display_name: Uncle Charles
      tts:
        delivery: scholarly, restrained, and dryly patient
        timbre: mellow and thoughtful
        pace: measured
        pitch: medium-low
    harriet:
      display_name: Harriet
      tts:
        delivery: chatty, knowing, and briskly confidential
        timbre: warm and earthy
        pace: medium-fast
        pitch: medium
    doctor:
      display_name: Doctor
      tts:
        delivery: hearty, reassuring, and professionally direct
        timbre: full and genial
        pace: medium
        pitch: medium-low
  chapters:
    - id: ch01
      title: The Rosy Cure
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Mrs. Wilmington found Rupert asleep among the damp, crushed rose leaves. Sensibly, she did not wake him. She covered him with two more blankets, wrapped herself in a shawl, and spent the rest of the night on the blue sofa at the foot of the four-post bed.
        - id: ch01-b02
          speaker: narrator
          text: Uncle Charles came down early, looking as neat as ever, and went to his study. A very pale housekeeper met him there. Her lips were pressed into a prim, tight line.
        - id: ch01-b03
          speaker: mrs_wilmington
          text: If you please, sir, those children must leave this house, or I shall. I mean those three children.
        - id: ch01-b04
          speaker: uncle_charles
          text: What have they done this time?
        - id: ch01-b05
          speaker: narrator
          text: He sounded weary. While shaving, he had thought of a new idea about Coptic magic, and now he wanted to be alone with that idea and his breakfast.
        - id: ch01-b06
          speaker: mrs_wilmington
          text: They did their very best to murder that poor young gentleman in his own bed.
          emotion: angry
        - id: ch01-b07
          speaker: narrator
          text: She looked like a thin portrait of the great actress Mrs. Siddons.
        - id: ch01-b08
          speaker: uncle_charles
          text: Did they put flowers or anything of that kind into the boy's food or drink?
        - id: ch01-b09
          speaker: narrator
          text: Uncle Charles frowned.
        - id: ch01-b10
          speaker: mrs_wilmington
          text: Worse, sir. Much worse. They put the boy into the flowers! I have taken the liberty of sending for the doctor. And may I pack their boxes, please? No one's life is safe. No one's lives are safe, I mean.
          emotion: fearful
        - id: ch01-b11
          speaker: narrator
          text: Mrs. Wilmington sniffed and pulled out her handkerchief.
        - id: ch01-b12
          speaker: uncle_charles
          text: Please control yourself. I shall find out what happened, and I shall speak to the doctor after he has seen the boy. Until then, kindly make no more fuss. And ask the cook for another omelette and some fresh tea. These are no longer warm enough to be eaten.
        - id: ch01-b13
          speaker: narrator
          text: Mrs. Wilmington put away her handkerchief and returned to Rupert. By then he was wriggling under the blankets and asking what he could have to eat. He was much better. There could be no doubt about that.
        - id: ch01-b14
          speaker: narrator
          text: Harriet brought the children's breakfast and told them the good news in confidence.
        - id: ch01-b15
          speaker: harriet
          text: But Mrs. W. is in a proper temper, and that's the truth. She's in a regular fanteague. I wouldn't be in your shoes for anything. How you ever thought of such a thing beats me. She was after the Master almost before he was awake, carrying on something dreadful.
        - id: ch01-b16
          speaker: charlotte
          text: How do you know that?
        - id: ch01-b17
          speaker: harriet
          text: Oh, I know more than you think, miss. I have my own ways of finding out whatever I want to know.
        - id: ch01-b18
          speaker: narrator
          text: Then Harriet hurried on to another subject.
        - id: ch01-b19
          speaker: harriet
          text: I know a sure spell for learning the name of the gentleman you'll marry. I'll show you one day, if this trouble blows over and you aren't sent away.
        - id: ch01-b20
          speaker: charlotte
          text: Bother getting married. I don't mean to marry anyone. I'm going to explore the Arctic and sail the cold northern seas.
        - id: ch01-b21
          speaker: harriet
          text: You'll be in hot water before you reach cold water. Take my advice and don't answer her back. Then perhaps the trouble will pass. The less you say, the sooner it's over. She can't scold forever if you give her no answers.
        - id: ch01-b22
          speaker: charles
          text: If you don't answer, they call you sulky.
        - id: ch01-b23
          speaker: narrator
          text: Charles had noticed that sort of thing before.
        - id: ch01-b24
          speaker: harriet
          text: Not if you keep saying, "Yes, ma'am," and "No, ma'am," whenever she stops for breath. That's the way to wear her out. You can trust me on that.
        - id: ch01-b25
          speaker: narrator
          text: The three C.'s could not quite imagine wearing Mrs. Wilmington out by answering yes and no to every reproach. They knew she would never understand if they tried to explain why they had done it, either. So they had a miserable time while she said a great deal about the rose leaves and told them they might have caused Rupert's death.
        - id: ch01-b26
          speaker: narrator
          text: Caroline said afterward that the rose leaves had really been the life and soul of his getting better.
        - id: ch01-b27
          speaker: narrator
          text: Mrs. Wilmington also forbade them to go outside and get into more dangerous mischief. Their uncle would give them a thorough talking-to as soon as the doctor had gone.
        - id: ch01-b28
          speaker: charles
          text: We may go out tomorrow, mayn't we?
        - id: ch01-b29
          speaker: mrs_wilmington
          text: Perhaps you will not be here tomorrow.
        - id: ch01-b30
          speaker: narrator
          text: That was a very troubling answer. The children stayed in the dining room and waited for the promised talking-to. Waiting for one is a hateful business. They wondered miserably whether, by some extraordinary accident, Mrs. Wilmington might be right for once. Had they truly harmed Rupert?
        - id: ch01-b31
          speakers: [caroline, charlotte, charles]
          ensemble: chorus
          text: But Rupert is better. Whatever she says, he is better.
        - id: ch01-b32
          speaker: narrator
          text: They repeated things like that every half minute, trying to comfort themselves. Still, they all felt they must see the doctor and learn whether they had done any harm.
        - id: ch01-b33
          speaker: narrator
          text: They thought of hiding in Rupert's wardrobe to hear the doctor's wise words at the bedside. They rejected the idea partly because listening in secret felt dishonorable, and partly because Mrs. Wilmington gave them no chance to hide. They could not listen at Uncle Charles's door after the doctor went into the study, either. All they could do was leave the dining-room door open.
        - id: ch01-b34
          speaker: caroline
          text: Then we'll pounce. If we do it quickly, we can ask, "How is Rupert? Is he truly worse or better?" before anyone stops us. The doctor is a gentleman, so he must answer a lady's question.
        - id: ch01-b35
          speaker: charles
          text: You're not ladies. You're only little girls.
        - id: ch01-b36
          speaker: narrator
          text: The girls made allowances for Charles. This was a time of trial. Caroline gave him the sort of gentle answer that can be especially hard to bear.
        - id: ch01-b37
          speaker: caroline
          text: Yes, dear Charles, we are ladies. Aunt Emmeline says you cannot begin too young. That is why you wipe your mouth both before and after you drink, never interrupt, and put on your gloves before going out. And remember the muddy Friday when I gave my penny to the crossing sweeper? He called me a real little lady. You must remember. It was the day you spilled ink all over my Hereward the Wake.
        - id: ch01-b38
          speaker: narrator
          text: Charles turned rather red.
        - id: ch01-b39
          speaker: charles
          text: Oh, stop it. I never—
        - id: ch01-b40
          speaker: charlotte
          text: Peace, for goodness' sake. If we start quarreling when we ought to stand together, we're no better than deserters. United we stand, divided we fall victim to the Wilmington. Listen! That's Uncle's door.
        - id: ch01-b41
          speaker: narrator
          text: They hurled themselves into the hall. The astonished doctor was saying his last polite words to Uncle Charles when the children charged at him, all asking the same questions.
        - id: ch01-b42
          speakers: [caroline, charlotte, charles]
          ensemble: chorus
          text: How is Rupert? Is he worse or better? Did we truly hurt him?
        - id: ch01-b43
          speaker: doctor
          text: He is much better. Your rose leaves were a kind of treatment known as packing, and they did him a world of good.
          emotion: happy
        - id: ch01-b44
          speaker: narrator
          text: The doctor rubbed his hands cheerfully. Then Uncle Charles made the faintest grunt behind him, while Mrs. Wilmington gave a loud and meaningful cough from the top of the stairs. The doctor hurried to add a warning.
        - id: ch01-b45
          speaker: doctor
          text: But it might have been very dangerous. Very dangerous indeed. My verdict is not guilty, but you must never do it again.
        - id: ch01-b46
          speaker: narrator
          text: He laughed in his jolly, red-faced way, went through the front door, mounted his horse, and rode away.
        - id: ch01-b47
          speaker: uncle_charles
          text: And now...
        - id: ch01-b48
          speaker: narrator
          text: Uncle Charles led them back into the dining room. We shall draw a veil over what happened there. A thorough talking-to is never pleasant to record, and it is hard to say whether the three C.'s deserved this one or not.
        - id: ch01-b49
          speaker: narrator
          text: Had chance or magic made them do exactly the right thing for Rupert? They explained that a threefold spell was bound to work exactly as it had. Their uncle did not smile. He shook his head and continued talking about responsibility, carefulness, and similar matters.
        - id: ch01-b50
          speaker: charlotte
          text: We were only doing what the Rosicurians did in olden times.
        - id: ch01-b51
          speaker: narrator
          text: Charlotte was close to tears. This time Uncle Charles really did smile, but he hid it in his handkerchief, so the children never saw.
        - id: ch01-b52
          speaker: uncle_charles
          text: And now...
        - id: ch01-b53
          speaker: narrator
          text: Once again he paused. The children knew those words, and each one wondered what punishment would follow.
        - id: ch01-b54
          speaker: narrator
          text: Charles hoped it would not be writing lines. He would rather have anything else. Caroline hoped they would not be kept indoors, especially on such a fine day. She, too, would rather have anything else.
        - id: ch01-b55
          speaker: narrator
          text: Their uncle still said nothing. At last Charlotte could bear the suspense no longer. She had not even decided which punishment she feared most.
        - id: ch01-b56
          speaker: charlotte
          text: Oh, Uncle, we never meant to be naughty! We didn't hurt Rupert, and we won't try to escape whatever punishment you think we deserve. But please don't leave us hanging like this. Tell us the worst. Are we to be hanged for a sheep as a lamb? It feels as if you're hanged twice when you have to wait. We'll do whatever you say. Only please don't do what the Wil—what Mrs. Wilmington said.
        - id: ch01-b57
          speaker: uncle_charles
          text: What did she say?
        - id: ch01-b58
          speaker: charlotte
          text: She said perhaps we wouldn't be here tomorrow. Oh!
          emotion: sad
        - id: ch01-b59
          speaker: narrator
          text: Charlotte began to cry, and Caroline joined her. Charles thrust his hands into his pockets and sniffed. Uncle Charles answered them earnestly.
        - id: ch01-b60
          speaker: uncle_charles
          text: Don't cry. Please don't. I have said what I thought it was my duty to say, and now it is over. I certainly do not mean to punish you for a mistake. What I blame you for is... well, interfering and taking too much upon yourselves.
        - id: ch01-b61
          speaker: charlotte
          text: Shoving our oar in. But we wanted Rupert to get better so much.
          emotion: sad
        - id: ch01-b62
          speaker: uncle_charles
          text: He is better. Please stop crying. It is all over now. But I must have one promise from you.
        - id: ch01-b63
          speaker: charles
          text: We did keep the other promise.
        - id: ch01-b64
          speaker: uncle_charles
          text: I know. This promise will cover more, and it will also be clearer. You must promise not to give your remedies to anyone to swallow. You must also promise not to put them on the outside of any friend—or enemy.
        - id: ch01-b65
          speaker: caroline
          text: You mean we mustn't put them on people's outsides?
        - id: ch01-b66
          speaker: uncle_charles
          text: Not without asking me first. If you want to try another experiment, simply offer the person a symbolic bouquet. That was enough in my case, as you may remember.
        - id: ch01-b67
          speakers: [caroline, charlotte, charles]
          ensemble: chorus
          text: Of course we promise.
        - id: ch01-b68
          speakers: [caroline, charlotte, charles]
          ensemble: chorus
          text: Oh, Uncle, it is kind of you not to be angrier! We truly don't mean to do wrong.
        - id: ch01-b69
          speaker: caroline
          text: But sometimes you try to do right, and it all goes wrong. You cannot simply do nothing, though doing nothing seems to be the only safe choice. Things turn out wrong when you never thought they would.
        - id: ch01-b70
          speaker: uncle_charles
          text: They do. Now dry your eyes and run outside to play. And if you can bring yourselves to tell Mrs. Wilmington that you are sorry, that might be wise.
        - id: ch01-b71
          speakers: [caroline, charlotte, charles]
          ensemble: chorus
          text: Of course we will, if you want us to.
        - id: ch01-b72
          speaker: charlotte
          text: It will be wise. She always says so.
        - id: ch01-b73
          speaker: uncle_charles
          text: She always says what is wise?
        - id: ch01-b74
          speaker: charlotte
          text: Whenever we say we're sorry, she says everything is all very well.
        - id: ch01-b75
          speaker: narrator
          text: Afterward the children went around to the terraced garden. They sat on the grass and talked over everything that had happened.
        - id: ch01-b76
          speaker: charlotte
          text: If ever there was an angel of an uncle, ours is the one.
        - id: ch01-b77
          speaker: charles
          text: Yes. And Rupert is better. I'm glad we did it. Aren't you?
        - id: ch01-b78
          speaker: caroline
          text: I suppose I am. Yes. No. Yes. I don't know. But the spell worked. At least it's wonderful to be sure of that.
        - id: ch01-b79
          speaker: narrator
          text: That was the one thing they could not persuade Rupert to believe. He was certainly better, but he pointed out that he might have recovered without the rose leaves.
        - id: ch01-b80
          speaker: rupert
          text: It was awfully decent of you to gather them and everything. But I expect the doctor's medicine cured me. I don't mean to sound ungrateful, but what else are doctors for?
        - id: ch01-b81
          speaker: charles
          text: I don't know what doctors are for. But I know you tried fern-seed when you pretended to be invisible.
        - id: ch01-b82
          speaker: rupert
          text: I feel much older than I did then.
        - id: ch01-b83
          speaker: narrator
          text: Rupert lay on his stomach, biting the ends of the grass on the dry, crisp turf. This was his first day free from all those rules that hamper the movements of people who have been ill and stop them doing as they please.
        - id: ch01-b84
          speaker: narrator
          text: You know how it is. You feel perfectly well, yet a cold or the measles keeps you indoors when you want to go out. Then you are sent out for what grown-ups call the best part of the day when you would rather stay in. Tiny doses of medicine arrive just when you least want them. Hot milk and beef tea appear while you are dreaming of roast beef and suet pudding. You are told that heavy food is wrong for you, and that what you need is something light but nourishing. You must go to bed before everyone else and keep away from drafts.
        - id: ch01-b85
          speaker: narrator
          text: All that was over now. Rupert was one of the others again, with no special rules at mealtimes. He could eat the same ordinary food as everyone else.
        - id: ch01-b86
          speaker: narrator
          text: Rupert's parents had sent Uncle Charles a telegram. They thanked him very much and accepted his invitation for Rupert to spend the rest of the holidays at the Manor House. They had sent another telegram to the Murdstone master, telling him Rupert would not return. Nothing now seemed to stand in the way of complete enjoyment, except the one small fact that Rupert refused to believe in spells.
        - id: ch01-b87
          speaker: caroline
          text: But the fern-seed worked. So did the secret rose, and so did the Rosicurian rose leaves.
        - id: ch01-b88
          speaker: rupert
          text: How can you say the fern-seed worked? I wasn't invisible. You all saw me through the window.
        - id: ch01-b89
          speaker: charlotte
          text: Oh, don't you see? You wanted us to see you. A spell cannot work when you don't want it to. I know I wouldn't work if I were a spell.
        - id: ch01-b90
          speaker: caroline
          text: No, that wasn't it. We chewed fern-seed so we could see invisible things, and then we saw you. You were invisible because you had chewed it too. Everything worked out perfectly. You simply refuse to see it. We could try the fern-seed again, if you like.
        - id: ch01-b91
          speaker: narrator
          text: Rupert would not try it. He preferred to lie on his stomach in the grass and read The Dog Crusoe. The others found books too.
