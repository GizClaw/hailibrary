audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm, observant storytelling with a gently amused touch
        timbre: clear and rounded
        pace: measured
        pitch: medium
    caroline:
      display_name: Caroline
      tts:
        delivery: lively, affectionate, and increasingly careful when being polite
        timbre: bright and clear
        pace: medium
        pitch: medium-high
    charlotte:
      display_name: Charlotte
      tts:
        delivery: eager, curious, and quick with an idea
        timbre: light and energetic
        pace: brisk
        pitch: high
    charles:
      display_name: Charles
      tts:
        delivery: proud, teasing, and boyishly direct
        timbre: youthful and crisp
        pace: medium-fast
        pitch: medium-high
    rupert:
      display_name: Rupert Wix
      tts:
        delivery: blunt and gloomy at first, warming quickly among friends
        timbre: youthful and slightly husky
        pace: medium
        pitch: medium-high
    mrs_wilmington:
      display_name: Mrs. Wilmington
      tts:
        delivery: correct, reserved, and carefully ladylike
        timbre: pale and precise
        pace: measured
        pitch: medium
    william:
      display_name: William
      tts:
        delivery: gruff, loyal, and slyly protective
        timbre: rough and earthy
        pace: unhurried
        pitch: low
    gardener:
      display_name: Gardener
      tts:
        delivery: dry, practical, and not unkind
        timbre: weathered and full
        pace: measured
        pitch: low
    uncle:
      display_name: Uncle
      tts:
        delivery: gentle, hesitant, and earnestly kind
        timbre: soft and slightly breathy
        pace: measured
        pitch: medium-low
  chapters:
    - id: ch01
      title: The Morning After
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Charlotte sat bolt upright, wide awake. She pinched her sister gently but firmly.
        - id: ch01-b02
          speaker: charlotte
          text: Wake up!
        - id: ch01-b03
          speaker: caroline
          text: Why? No one's called us yet, and it's still dark.
        - id: ch01-b04
          speaker: charlotte
          text: Of course it's dark. The curtains are shut. Wake up, silly! Don't you remember?
        - id: ch01-b05
          speaker: narrator
          text: Caroline murmured that she was awake, then went straight back to sleep.
        - id: ch01-b06
          speaker: charlotte
          text: You can't have forgotten yesterday! We were detectives, you were Sherlock Holmes backward, and then there was Rupert. Rupert, Rupert, Rupert!
        - id: ch01-b07
          speaker: narrator
          text: That woke Caroline at last. She sat up in bed and rubbed her eyes. Charlotte began jumping up and down beside her. Their splendid secret, the rose, and everything that had happened seemed glorious to Charlotte. She thought they were the luckiest children in the world.
        - id: ch01-b08
          speaker: caroline
          text: I suppose we are lucky. But what are we going to do with him?
        - id: ch01-b09
          speaker: charlotte
          text: Hide him, of course, and answer for him with our lives until India sends an answer.
        - id: ch01-b10
          speaker: caroline
          text: The letter hasn't even gone yet.
        - id: ch01-b11
          speaker: narrator
          text: Caroline reminded her that the letter had not been sent, then slowly put one foot out of bed. Charlotte stared at her. She could not understand what was wrong or why Caroline did not seem the least bit eager.
        - id: ch01-b12
          speaker: caroline
          text: I don't feel enthusiastic. I wish none of it had happened. I only want everything quiet again, the way it used to be. My inside mind feels stiff and sore.
        - id: ch01-b13
          speaker: charlotte
          text: That's because you used it so much yesterday. Your mind isn't used to being so clever.
        - id: ch01-b14
          speaker: narrator
          text: Charlotte said Caroline's mind was sore from doing so much clever work the day before. It simply was not used to the exercise. Then she sprang from the bed and ran to the window. The moment she pulled back the curtains, she gave a tragic little cry and stood frozen, still holding the curtain. It was raining hard. Somehow, after days and days of sunshine, none of them had imagined rain at all. It had felt as though the sun must go on shining forever.
        - id: ch01-b15
          speaker: charlotte
          text: Rupert can't hide in the woods in this, can he?
        - id: ch01-b16
          speaker: caroline
          text: Charlotte, it's only quarter to five! I'm going back to sleep. If you get up too early, you feel thin and rotten all afternoon. Come on. Maybe the rain will stop by proper getting-up time.
        - id: ch01-b17
          speaker: narrator
          text: It did not. At proper getting-up time, the rain was falling as hard as ever. Breakfast was a dismal little meal. The dining room, usually so sunny and pleasant at that hour, looked brown and gloomy. Every book had somehow become a lesson book. Even the portrait of the lady in the ruff could scarcely interest them. It was as if someone had turned off all the sunshine and all the magic at the meter. Worry about Rupert mixed with the ordinary misery of a wet day. At first, everyone felt too wretched even to tell the others how wretched they were.
        - id: ch01-b18
          speaker: narrator
          text: Caroline poured the milk, Charles served the bacon, and Charlotte passed the toast. Not one of them spoke while they ate and drank. But breakfast slowly did its healing work, as breakfast often does. By the time they reached the marmalade, Charlotte was ready to speak and propose desperate measures.
        - id: ch01-b19
          speaker: charlotte
          text: I'll have some tea, please, Caro. Aunt Emmeline says it's a dreadful drug that people drink instead of beer. I don't even like it. I'm only drinking it to show how desperate we are.
        - id: ch01-b20
          speaker: caroline
          text: Drinking tea won't help Rupert. He'll be soaked out in the woods.
        - id: ch01-b21
          speaker: charles
          text: At least he'll be safe. No one will search for him in pouring rain. I'll have tea too. We could call it a carouse in the smugglers' cave.
        - id: ch01-b22
          speaker: narrator
          text: The others thought pretending to carouse in a smugglers' cave went a little too far. Charlotte did not feel they ought to play at all until they knew where Rupert was and whether he had eaten any breakfast. Besides, she was certain the Wilming-cat would never allow them outside in the rain.
        - id: ch01-b23
          speaker: caroline
          text: Then one of us has to find William. I'll risk the Wil-cat. We can't all go. People notice a crowd much more.
        - id: ch01-b24
          speaker: narrator
          text: So William, working in the harness room, received a small visitor in a damp mackintosh and a red tam-o'-shanter dusted with raindrops.
        - id: ch01-b25
          speaker: caroline
          text: Where is he? Has he had breakfast?
        - id: ch01-b26
          speaker: william
          text: Be off with you, miss. I'm not talking this early. My jaws are hanging crooked after all yesterday's talking. Go on now!
        - id: ch01-b27
          speaker: narrator
          text: William said every word loudly and plainly, as if he truly meant to send her away. But while he spoke, he took a piece of chalk from his pocket and wrote, "Come at twelve," on the table. Caroline understood at once. William rubbed the message away with his cuff just as the gardener came to the door and observed that the weather did not look likely to clear.
        - id: ch01-b28
          speaker: caroline
          text: We need flowers to put in a letter, and it's too wet for us to pick them. I thought William might help.
        - id: ch01-b29
          speaker: gardener
          text: Flowers aren't William's work or his pleasure. If they were, he wouldn't wear a dead one in his buttonhole like that.
        - id: ch01-b30
          speaker: narrator
          text: The gardener pointed at William's coat, which hung on a saddle perch. The withered rose of secrecy was still in its buttonhole.
        - id: ch01-b31
          speaker: caroline
          text: Could you get them, then? Four red roses. No, five, and ten buds. Have you any stephanotis? I think it means absent friends.
        - id: ch01-b32
          speaker: gardener
          text: No, we haven't.
        - id: ch01-b33
          speaker: caroline
          text: Then traveller's joy. That means safety.
        - id: ch01-b34
          speaker: gardener
          text: Plenty of that nasty weed. All right, miss. I'll bring it to the dining-room window and keep my boots off cook's flagstones.
        - id: ch01-b35
          speaker: narrator
          text: Caroline went back to the others and told them that everything was all right. They were to come at noon. But now they really had to write to Aunt Emmeline and send her the traveller's joy, because Caroline had claimed they wanted flowers for a letter.
        - id: ch01-b36
          speaker: caroline
          text: You have to write too, Charles. It'll be an unselfish act, because none of us wants to do it. Aunt Emmeline says unselfishness makes the sun shine on the cloudiest day.
        - id: ch01-b37
          speaker: charles
          text: All right. We'll see if it works.
        - id: ch01-b38
          speaker: narrator
          text: Charles agreed to try the effect of unselfishness, though he did not sound hopeful. Soon a deep stillness filled the room. Nothing broke it but the slow scratching of their pens. After a while, the gardener appeared at the window and held out a wet red-and-green bundle of roses and clematis.
        - id: ch01-b39
          speaker: gardener
          text: Is this what you wanted?
        - id: ch01-b40
          speaker: caroline
          text: Exactly. And it's lucky you had no stephanotis. It doesn't mean absent friends after all. It means, "Will you come East with me?" Aunt Emmeline would have worried terribly about that.
        - id: ch01-b41
          speaker: gardener
          text: She wouldn't have been the only one.
        - id: ch01-b42
          speaker: narrator
          text: The gardener remarked that Aunt Emmeline would not have been the only puzzled person, then clumped away in the boots that were not considered fit for cook's flagstones. When the letters were finished, it was only eleven. The children decided that Rupert must have eaten breakfast by then. It would not be unfeeling to play desert islands for just one hour while they waited for noon.
        - id: ch01-b43
          speaker: narrator
          text: The dining table became an excellent island. The armchair held all three children and made a ship that, with reasonable care, could be wrecked safely on the deep waters of the hearth rug. The card table from the window, turned upside down, made a charming raft. The girls tied their pinafores to the poker and tongs for sails. They steered with the fire shovel and brought away bags of biscuit that looked remarkably like cushions. The good ship Golden Vanity, disguised as the sofa, lay abandoned across Carpet Bay.
        - id: ch01-b44
          speaker: narrator
          text: It was such a grand game that the shipwrecked sailors were astonished when the tall clock with the silver face and golden roses began to strike twelve.
        - id: ch01-b45
          speaker: caroline
          text: I ought to go now. But if we leave this mess, the Wil-cat will see it.
        - id: ch01-b46
          speaker: charlotte
          text: We'll clear it up to make up for being beastly yesterday. You go, Caro. When we're done, we'll wait by the door until you say it's safe.
        - id: ch01-b47
          speaker: charles
          text: That's jolly decent of Charlotte. I'll do the same.
        - id: ch01-b48
          speaker: caroline
          text: Jolly decent of you.
        - id: ch01-b49
          speaker: narrator
          text: The rain was still falling. Caroline stood at the back door with one rose and two buds in her hand. She watched drops splash into the puddles. Rain bounced from the sacking over the shoulders of the gardener, the gardener's boy, and the stable boy as they went off to dinner. Caroline waited until she could be quite certain they were truly gone and unlikely to return for something forgotten. Then she ran across to the harness room.
        - id: ch01-b50
          speaker: caroline
          text: Here's your new secret rose. May I see Rupert now? The others will be here in a moment.
        - id: ch01-b51
          speaker: william
          text: Tell them to stay where they are. There won't be much secrecy left if all of you hang about here. And Mrs. What's-her-name is rather fond of secret nosing herself. Hurry, before they come.
        - id: ch01-b52
          speaker: narrator
          text: The others were not at all pleased when Caroline carried back William's order, but they had to admit that he probably knew best. So Caroline alone followed him through the stable and up the ladder. At first the straw loft seemed to hold nothing but straw. It lay very dark in the corners and shone bright yellow beneath the skylight.
        - id: ch01-b53
          speaker: caroline
          text: Where is he?
        - id: ch01-b54
          speaker: narrator
          text: The straw rustled. Then it opened to reveal Rupert, his hair tousled and full of straw. Beside him, the bright eyes and black ears of a little fox terrier peeped from the hiding place.
        - id: ch01-b55
          speaker: rupert
          text: I hid when I heard you climbing. You can't be too careful.
        - id: ch01-b56
          speaker: narrator
          text: His voice was low and hoarse.
        - id: ch01-b57
          speaker: william
          text: I'll stay down in the stable. If I whistle, keep out of sight.
        - id: ch01-b58
          speaker: narrator
          text: William climbed down, and they heard him say, "Over," to one of the horses.
        - id: ch01-b59
          speaker: rupert
          text: I wish this were over.
        - id: ch01-b60
          speaker: caroline
          text: The rain is beastly, but it'll probably be fine tomorrow. I brought you a secrecy rose.
        - id: ch01-b61
          speaker: narrator
          text: Rupert thanked her without much enthusiasm. Caroline struggled to pull something else from her tight pocket.
        - id: ch01-b62
          speaker: caroline
          text: I brought Robinson Crusoe too, and paper and a pencil. Now you can really write to your father and mother. I'll post the letter when the rain stops.
        - id: ch01-b63
          speaker: rupert
          text: You really are a brick. I'll be all right now that I have something to read. But you simply can't imagine how slowly time passes when you're in hiding. I don't know how those Royalist fellows endured it. And what about the Man in the Iron Mask, Sir Walter Raleigh, and Mary Queen of Scots? I can't think how any of them stood it.
        - id: ch01-b64
          speaker: caroline
          text: I really am sorry. How many days will an answer from India take?
        - id: ch01-b65
          speaker: rupert
          text: Oh, weeks. I was just thinking I couldn't stand it that long. Perhaps I really ought to run away to sea, though I certainly wouldn't go by way of Hastings. Still, it doesn't seem quite so bad now that I have the book. Pincher is rather jolly company. And so are you, of course.
        - id: ch01-b66
          speaker: caroline
          text: Tell me what happened last night, after we left.
        - id: ch01-b67
          speaker: narrator
          text: Caroline made herself comfortable in a nest of straw.
        - id: ch01-b68
          speaker: rupert
          text: William brought me inside. He gave me a rug, the dog, and more bread and cheese. This morning I had bread and bacon.
        - id: ch01-b69
          speaker: caroline
          text: Your voice is terribly hoarse.
        - id: ch01-b70
          speaker: rupert
          text: It's nothing. Don't think I'm greedy, but I would like something to eat. It feels as though I've had bread and cheese and cold bacon for years. And the bacon is all fat.
        - id: ch01-b71
          speaker: narrator
          text: Caroline said how stupid she had been not to think of proper food. She promised to bring him something when the men went home for their tea. After that, quite suddenly, neither child could think of anything more to say. The silence lasted until Rupert put his head beneath the blanket and tried to smother a cough.
        - id: ch01-b72
          speaker: caroline
          text: I hope you haven't caught a chill. Aunt Emmeline says you won't if you sleep with the windows open. Of course, there aren't any windows here.
        - id: ch01-b73
          speaker: rupert
          text: No. Do you play chess, draughts, halma, or anything like that?
        - id: ch01-b74
          speaker: caroline
          text: I could bring the games. I only know how the chessmen move, and that trick where you bring down the Queen and the Bishop and the other person is caught by Fool's Mate. But they always see what I'm doing before I can finish it.
        - id: ch01-b75
          speaker: rupert
          text: I'll teach you. Everything is pretty beastly, isn't it? India is jolly. I wish I were there.
        - id: ch01-b76
          speaker: caroline
          text: So do I. No, I don't mean that. I only wish you weren't so miserable.
        - id: ch01-b77
          speaker: rupert
          text: There ought to be a Society for the Prevention of Schools. Then everything would be all right.
        - id: ch01-b78
          speaker: caroline
          text: It's a dumpy sort of day. I felt flat this morning, as if nothing mattered, but I got better. I'll look for a flower that means cheer up. If there is one, I'll bring it, and perhaps its cheering charm will work on you.
        - id: ch01-b79
          speaker: narrator
          text: Caroline sat among the straw with her forehead wrinkled, working hard to think of some way to cheer the prisoner. Just then, she was almost a cheering charm herself. Rupert may have felt something of it, because he tried to reassure her.
        - id: ch01-b80
          speaker: rupert
          text: I'm all right. I just feel thoroughly rotten.
        - id: ch01-b81
          speaker: caroline
          text: Write your letter. I don't feel nearly so flat now. I'll think of all sorts of things to amuse the captive, and I'll bring you—
        - id: ch01-b82
          speaker: narrator
          text: Before Caroline could finish, William whistled below. Both children stiffened until they were as still as stone, and each held their breath. Then they heard voices. One of them belonged to Mrs. Wilmington.
        - id: ch01-b83
          speaker: mrs_wilmington
          text: Have you seen Miss Caroline, William? I fear she has gone out in the rain.
        - id: ch01-b84
          speaker: william
          text: She's in the loft, mum. I let her climb up for a look. Come down now, miss. You've seen all there is.
        - id: ch01-b85
          speaker: narrator
          text: Caroline rustled out of the straw and descended the ladder. Mrs. Wilmington stood in the stable doorway, wearing a cloak and a brown plaid shawl over her head. William climbed up to padlock the trapdoor.
        - id: ch01-b86
          speaker: caroline
          text: I'm quite dry. Truly I am.
        - id: ch01-b87
          speaker: mrs_wilmington
          text: You had better come inside at once.
        - id: ch01-b88
          speaker: narrator
          text: Just then a faint noise came from the loft. Rupert had coughed again.
        - id: ch01-b89
          speaker: mrs_wilmington
          text: What was that?
        - id: ch01-b90
          speaker: william
          text: My dog is up there. He catches rats now and then.
        - id: ch01-b91
          speaker: mrs_wilmington
          text: That was a very strange sound for a dog.
        - id: ch01-b92
          speaker: william
          text: Wasn't it? You'd never believe the noises dogs make when they're after rats. It just takes them that way.
        - id: ch01-b93
          speaker: narrator
          text: Mrs. Wilmington said she understood, though she still looked thoughtful. Then she turned away and picked each galoshed step with great care. Caroline followed. She dared to breathe again now, and splashed straight through all the puddles.
        - id: ch01-b94
          speaker: mrs_wilmington
          text: Your uncle was asking for you. He does not wish you to go outside in the rain. And I have always understood that young ladies are better kept away from low company.
        - id: ch01-b95
          speaker: caroline
          text: If you mean William—
        - id: ch01-b96
          speaker: mrs_wilmington
          text: I mean dogs in straw lofts. Now you know. Your uncle is in the dining room. Please wipe your shoes on the mat.
        - id: ch01-b97
          speaker: narrator
          text: Caroline decided that as soon as the rain stopped, she would gather Mrs. Wilmington a soothing bouquet. The housekeeper told her again that the Uncle was waiting in the dining room. Talking came through the open door. Charles was explaining that the Uncle had only to sit upon the wreck while the children came to rescue him with the raft. Caroline stopped in the doorway. Could it possibly be true that the Uncle was playing with them? No, it could not.
        - id: ch01-b98
          speaker: uncle
          text: Thank you, but I feel safer staying on the wreck. I'm glad you've found a game.
        - id: ch01-b99
          speaker: narrator
          text: He blinked kindly at Caroline.
        - id: ch01-b100
          speaker: caroline
          text: I hope you don't mind the room being a little untidy, Uncle.
        - id: ch01-b101
          speaker: narrator
          text: The room truly was untidy. Charlotte and Charles had decided that their clearing-up bargain no longer counted, and they had simply continued the game.
        - id: ch01-b102
          speaker: uncle
          text: Not at all, as long as nothing gets broken.
        - id: ch01-b103
          speaker: charles
          text: We're most awfully careful. We keep the raft on the carpet so it won't scratch anything.
        - id: ch01-b104
          speaker: charlotte
          text: I think dragging it across the Turkish sea actually polishes the carpet.
        - id: ch01-b105
          speaker: uncle
          text: So you aren't bored, even in this rain? I was afraid the day might feel rather tiresome.
        - id: ch01-b106
          speakers: [caroline, charlotte, charles]
          ensemble: chorus
          text: Oh, no! It's the loveliest house in the world.
        - id: ch01-b107
          speaker: narrator
          text: Charlotte kindly asked how his magic was going.
        - id: ch01-b108
          speaker: uncle
          text: Poorly. Very poorly. How is yours?
        - id: ch01-b109
          speaker: narrator
          text: A deep silence answered him. Every child was thinking about the magic of the fern-seed and the great secret of Rupert hidden in the straw loft.
        - id: ch01-b110
          speaker: caroline
          text: We've started a Secret Society. It's called the Secret Society of the Rose. Members wear one full rose and two buds.
        - id: ch01-b111
          speaker: uncle
          text: I see. What is the secret?
        - id: ch01-b112
          speaker: narrator
          text: Everyone except the Uncle turned scarlet.
        - id: ch01-b113
          speaker: uncle
          text: I beg your pardon.
        - id: ch01-b114
          speaker: caroline
          text: We'd tell you at once if we could. But it really is a Secret Society.
        - id: ch01-b115
          speaker: uncle
          text: I understand. I'm sorry I asked such an indiscreet question. But you haven't broken anything, have you?
        - id: ch01-b116
          speakers: [caroline, charlotte, charles]
          ensemble: chorus
          text: Not one thing.
        - id: ch01-b117
          speaker: uncle
          text: I knew you wouldn't. Mrs. Wilmington thought you might break almost everything in the house, but that was before she met you. If you ever do break something, you'll tell me, won't you?
        - id: ch01-b118
          speakers: [caroline, charlotte, charles]
          ensemble: chorus
          text: Of course.
        - id: ch01-b119
          speaker: uncle
          text: Quite so. I should have known. I wish I could find something to amuse you. If you had friends nearby, you could take the carriage to visit them. But naturally, you don't know anyone here.
        - id: ch01-b120
          speaker: charles
          text: We know the clergyman.
        - id: ch01-b121
          speaker: narrator
          text: Caroline asked whether they might visit him.
        - id: ch01-b122
          speaker: uncle
          text: Certainly. Bring him home for tea. I'm sincerely glad you're making yourselves at home.
        - id: ch01-b123
          speaker: narrator
          text: Then he left them.
        - id: ch01-b124
          speaker: charles
          text: Was that snarkasm, about making ourselves at home?
        - id: ch01-b125
          speaker: charlotte
          text: Not at all. I'm sure the Uncle is as open as the day. Still, we'd better clear up.
        - id: ch01-b126
          speaker: narrator
          text: Charlotte insisted that the Uncle was as open as the day, but still thought they had better put the room in order. At that very word, Harriet entered to set the table, with Mrs. Wilmington behind her. Mrs. Wilmington did all the clearing herself. Her lips were pinched tight, and she very pointedly kept herself from uttering a single reproach.
        - id: ch01-b127
          speaker: narrator
          text: The children ate dinner by themselves. The cook remarked on the sudden growth of their appetites, but how could she know the truth? Generous double helpings of beef, Yorkshire pudding, potatoes, summer cabbage, rhubarb pie, and custard were hidden behind the books on the dining-room shelf. Every bit was meant for the runaway boy who was still lurking in the straw loft.
        - id: ch01-b128
          speaker: caroline
          text: We have to use tumblers. Someone would miss the plates, but dozens of tumblers live in the sideboard.
        - id: ch01-b129
          speaker: narrator
          text: So they packed the food into a row of tumblers. Those clear glasses had never before held anything so greasy. Standing together in a line, they looked like beakers upon the bench of a secret laboratory.
        - id: ch01-b130
          speaker: charlotte
          text: Hiding the food is all very well, but how are we going to carry it to him?
        - id: ch01-b131
          speaker: caroline
          text: William will manage it when the men have tea.
        - id: ch01-b132
          speaker: charlotte
          text: But we're supposed to bring the clergyman home for tea.
        - id: ch01-b133
          speaker: caroline
          text: Oh, bother! I never thought of that.
