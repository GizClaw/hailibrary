audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 温暖机敏，带着克制的幽默讲述
        timbre: 清澈柔和
        pace: 从容而富有变化
        pitch: 中音
    caroline:
      display_name: 卡罗琳
      tts:
        delivery: 大方热情，努力摆出长姐的懂事
        timbre: 明亮清脆
        pace: 自然轻快
        pitch: 中高音
    charlotte:
      display_name: 夏洛特
      tts:
        delivery: 活泼直率，想到什么便说什么
        timbre: 轻盈清亮
        pace: 偏快
        pitch: 高音
    charles:
      display_name: 查尔斯
      tts:
        delivery: 淘气认真，笑话总说得一本正经
        timbre: 清亮的男孩声
        pace: 轻快
        pitch: 中高音
    rupert:
      display_name: 鲁珀特
      tts:
        delivery: 倔强有礼，疲惫时仍尽力稳住声音
        timbre: 略带沙哑的男孩声
        pace: 自然偏慢
        pitch: 中高音
    william:
      display_name: 威廉
      tts:
        delivery: 朴实机灵，挖苦话说得不动声色
        timbre: 粗朴温和
        pace: 自然
        pitch: 中低音
    gardener:
      display_name: 园丁
      tts:
        delivery: 务实随和，玩笑藏在一本正经的话里
        timbre: 粗厚朴实
        pace: 自然偏慢
        pitch: 中低音
    mrs_wilmington:
      display_name: 威尔明顿太太
      tts:
        delivery: 谨慎严肃，字句里带着管家的规矩
        timbre: 紧致清楚
        pace: 稍慢
        pitch: 中音
    uncle:
      display_name: 舅舅
      tts:
        delivery: 和善拘谨，说话时总带一点不安
        timbre: 温和单薄
        pace: 从容
        pitch: 中音
  chapters:
    - id: ch01
      title: 第九章　第二天早晨
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: |-
            第二天一早，天还黑着。夏洛特已经完全醒了。她坐起身，轻轻却坚定地拧着妹妹，要把她叫醒。
        - id: ch01-b02
          speaker: charlotte
          text: |-
            卡罗，快醒醒！
        - id: ch01-b03
          speaker: caroline
          text: |-
            为什么呀？还没人来叫我们呢，外面也黑着。
        - id: ch01-b04
          speaker: charlotte
          text: |-
            还等人来叫？窗帘都没拉开，当然黑了。你忘了昨天的事吗？我们当了侦探，你还是个颠倒过来的福尔摩斯。还有鲁珀特呀，鲁珀特！
        - id: ch01-b05
          speaker: narrator
          text: |-
            卡罗琳先含糊地答应一声，又睡了过去。夏洛特只好提醒她，昨天她们当过侦探，还藏起了鲁珀特。听见鲁珀特的名字，卡罗琳才真的醒来，坐起身揉揉眼睛。夏洛特兴奋得在床上直蹦，觉得那个秘密、秘密玫瑰和昨天发生的一切都好极了。
        - id: ch01-b06
          speaker: charlotte
          text: |-
            这不是太了不起了吗？我们有一个绝妙的秘密，还有玫瑰，还有所有这些事！我们的运气多好呀！
        - id: ch01-b07
          speaker: caroline
          text: |-
            大概吧。可是，我们要拿鲁珀特怎么办呢？
        - id: ch01-b08
          speaker: charlotte
          text: |-
            当然要把他藏起来，拿性命替他担保，一直等到寄往印度的信有回音。
        - id: ch01-b09
          speaker: caroline
          text: |-
            那封信还没寄出去呢。再说，我今天一点劲头都没有。我真希望这件事没发生。我只想安安静静的，什么都别发生，像从前一样。脑袋里的心思又僵又疼。
        - id: ch01-b10
          speaker: charlotte
          text: |-
            那是你昨天把心思用得太多了。你那么聪明，它当然会僵。以前它又没用惯。
        - id: ch01-b11
          speaker: narrator
          text: |-
            夏洛特快活地跳下床，跑去拉开窗帘，随后却抓着帘子不动了。她那声惊呼太惨，卡罗琳还以为出了什么大事。其实，外面只是正下着大雨。可谁也没料到会下雨。太阳明明已经一连照耀了好多天，看起来像是永远不会停。姐妹俩望着雨幕，凄凄惨惨地沉默了一阵。
        - id: ch01-b12
          speaker: charlotte
          text: |-
            鲁珀特不能再藏在树林里了，对不对？
        - id: ch01-b13
          speaker: caroline
          text: |-
            夏洛特，现在才四点三刻！我要再睡一会儿。起得太早，下午会又软又难受。等到该起床的时候，雨也许就停了。
        - id: ch01-b14
          speaker: narrator
          text: |-
            可到了起床时间，雨还是那么大。早餐桌上一片愁云惨雾。平时这个钟点，餐厅总是阳光灿烂，让人一进去就高兴。今天却到处阴沉沉、灰褐褐的。书全像课本，就连那幅戴轮状皱领的夫人画像也没意思了。仿佛有人走到总表前，一下子关掉了全部阳光，也关掉了全部魔法。
        - id: ch01-b15
          speaker: narrator
          text: |-
            雨天的沮丧里，又混着对鲁珀特的担忧。起初，每个人都难受得厉害，甚至没有力气告诉别人自己有多难受。卡罗琳默默倒牛奶，查尔斯分培根，夏洛特递烤面包。大家一声不响地吃，一声不响地喝。好在早餐慢慢发挥了疗效。食物一点点赶走了绝望。还没吃到橘子酱，夏洛特便已经恢复到能够说话了。
        - id: ch01-b16
          speaker: charlotte
          text: |-
            这种时候就该做点不顾一切的事。卡罗，给我倒杯茶吧。埃默琳姑妈说，茶是可怕的毒品，人们拿它代替啤酒。我可不喜欢茶，只是要表示我们已经不顾一切了。
        - id: ch01-b17
          speaker: caroline
          text: |-
            你喝茶也帮不了鲁珀特。他会在树林里浑身湿透。
        - id: ch01-b18
          speaker: charles
          text: |-
            至少他很安全。雨下成这样，不会有人去找他。我也喝茶。就说这是走私贩子洞窟里的狂欢吧。
        - id: ch01-b19
          speaker: narrator
          text: |-
            另外两个孩子都觉得，把喝茶说成洞窟里的狂欢未免太过火。夏洛特也觉得，在弄清鲁珀特的情形、知道他有没有吃早餐以前，他们不该玩耍。可她很清楚，威尔明顿猫绝不会准大家冒雨出去。卡罗琳想出了办法。只去一个人，目标小些，也不容易让大人起疑。
        - id: ch01-b20
          speaker: caroline
          text: |-
            我一个人出去找威廉，碰碰威尔猫的运气。我们不能全去，人一多就更容易叫人留意。
        - id: ch01-b21
          speaker: narrator
          text: |-
            不久，一个小身影来到马具房。她的雨衣湿漉漉的，红色苏格兰圆帽上落满雨珠，像结了霜。卡罗琳压低声音，问威廉鲁珀特在哪里，有没有吃早餐。
        - id: ch01-b22
          speaker: william
          text: |-
            小姐，快走吧！我一大早可没精神说话。昨天说得太多，两边下巴都挂歪了。走吧。
        - id: ch01-b23
          speaker: narrator
          text: |-
            威廉嘴上说得又响亮又清楚，手却从口袋里摸出一截粉笔，在桌上写下“十二点来”。就在这时，园丁走到门口，说天气看着不像会放晴。威廉马上用袖口把字抹得干干净净。卡罗琳一下就懂了。为了说明自己为什么跑到马具房来，她立刻说，他们想找些花，夹在一封要寄出去的信里，可雨太大，没法亲自去采。
        - id: ch01-b24
          speaker: gardener
          text: |-
            采花既不是威廉的差事，也不是他的爱好。不然，他就会挑朵新鲜的花，不会像现在这样，让纽扣眼里插着一朵死花。
        - id: ch01-b25
          speaker: narrator
          text: |-
            园丁说着，指了指威廉的外套。衣服正挂在马鞍架上，那朵枯萎的秘密玫瑰还留在纽扣眼里。卡罗琳见他并不真心生气，便转而请园丁亲自帮忙采花。
        - id: ch01-b26
          speaker: caroline
          text: |-
            我要五朵红玫瑰、十个花苞。还有素馨花吗？我记得它的意思是远方的朋友。
        - id: ch01-b27
          speaker: gardener
          text: |-
            没有素馨花。铁线莲倒多得很，那种讨厌的野草。行吧，我把花送到餐厅窗前，免得这双靴子踩上厨娘的石板地。
        - id: ch01-b28
          speaker: narrator
          text: |-
            卡罗琳回去告诉大家，威廉约他们十二点再来。在那以前，既然已经对园丁说花要放进信里，他们就真得给埃默琳姑妈写信，还要把铁线莲寄给她。查尔斯也不能例外。卡罗琳说，这正好算做一件无私的事，因为她敢肯定，谁也不想给姑妈写信，而姑妈总说，无私会让阳光照亮最阴沉的日子。
        - id: ch01-b29
          speaker: charles
          text: |-
            好吧，那就试试。
        - id: ch01-b30
          speaker: narrator
          text: |-
            查尔斯答应试试看，却没指望这份无私真能叫太阳出来。屋里很快静下来，只剩笔尖慢慢划过纸面的沙沙声。过了一阵，园丁果真来到窗口，把那束湿漉漉、红绿相间的玫瑰和铁线莲递了进来。卡罗琳重新查过花语才发现，没有素馨花反倒更好。
        - id: ch01-b31
          speaker: caroline
          text: |-
            原来素馨花的意思是“你愿意陪我到东方去吗？”要是真寄给埃默琳姑妈，她一定会急着猜我们是什么意思。
        - id: ch01-b32
          speaker: gardener
          text: |-
            猜不透的恐怕不只她一个。
        - id: ch01-b33
          speaker: narrator
          text: |-
            园丁踩着那双不宜踏上厨娘石板地的靴子，咚咚走远了。孩子们继续写信。等每个人终于写完，时钟才指到十一点，离约好的时间还有整整一个钟头。大家商量了一番，认定鲁珀特一定已经吃过早餐。既然他暂时不会挨饿，那么为了让时间快点过去，在十二点以前玩一会儿荒岛游戏，也不能算没心没肺。
        - id: ch01-b34
          speaker: narrator
          text: |-
            餐桌成了一座绝佳的荒岛，扶手椅成了船，三个孩子全都坐得进去。只要小心一些，这艘船就能安全沉没在壁炉前地毯的深海里。翻过来的牌桌是一只漂亮木筏，女孩子们的围裙系在拨火棍和火钳上，就成了船帆。火铲用来掌舵，靠垫是从好船“金色虚荣号”上运下来的袋装饼干。那艘乔装成长沙发的船，就横在地毯湾里，无人照管。
        - id: ch01-b35
          speaker: narrator
          text: |-
            他们驾船、遇难，又从沉船往木筏上搬运饼干，玩得简直忘了时间。等那座高高的时钟开口说“十二点”，遇难的水手们全都吃了一惊。报时的当然是它。它有一张银色钟面，上面还嵌着金色玫瑰。卡罗琳赶紧把充当桅杆的拨火棍和火钳放回壁炉围栏，说他们该马上出发了。可是房间还保持着海难现场的样子，她担心威尔猫一看就会生气。
        - id: ch01-b36
          speaker: charlotte
          text: |-
            我们来收拾，算是补偿昨天的可恶。卡罗，你先去。收拾好以后，我们会在门口等着，直到你说没事。
        - id: ch01-b37
          speaker: charles
          text: |-
            夏洛特真够意思。我也一样。
        - id: ch01-b38
          speaker: caroline
          text: |-
            你也真够意思。
        - id: ch01-b39
          speaker: narrator
          text: |-
            雨仍在下。卡罗琳拿着一朵玫瑰和两个花苞，站在后门口。她看着雨水落进水洼，又溅在园丁、园丁的小伙计和马厩男孩披着麻袋的肩膀上。三个人正要去吃午饭。卡罗琳耐心等着，直到确信他们真的走了，也不会回来取忘带的东西，才跑过院子，进了马具房，把新的秘密玫瑰交给威廉。
        - id: ch01-b40
          speaker: caroline
          text: |-
            现在能让我见鲁珀特了吗？另外两个人马上也会出来。
        - id: ch01-b41
          speaker: william
          text: |-
            去叫他们待在原地。你们全在这里晃荡，秘密玫瑰就没有秘密了。那个什么太太也很会打听秘密。快去，别等他们过来。
        - id: ch01-b42
          speaker: narrator
          text: |-
            夏洛特和查尔斯听说自己不能去，当然很不高兴，但也只好承认，威廉多半最懂该怎么办。于是只有卡罗琳跟着他穿过马厩，再顺着梯子爬进干草阁楼。乍看之下，里面除了干草，什么也没有。角落里一片漆黑，天窗下面的草却黄得耀眼。
        - id: ch01-b43
          speaker: caroline
          text: |-
            鲁珀特，你在哪里？
        - id: ch01-b44
          speaker: narrator
          text: |-
            干草窸窣一响，向两边分开了。鲁珀特从里面露出来，头发睡得蓬蓬乱乱，上面沾满了草屑。旁边还有一只小猎狐梗，只露出亮晶晶的眼睛和黑色耳朵。鲁珀特说，他听见梯子响，还不知道来的是谁，所以赶快藏进了草里。
        - id: ch01-b45
          speaker: rupert
          text: |-
            我听见你上梯子，就藏起来了。再小心也不为过。
        - id: ch01-b46
          speaker: narrator
          text: |-
            鲁珀特的声音低沉沙哑。威廉说自己会待在下面马厩附近，要是吹口哨，他们就得趴下别动。随后他顺着梯子退了下去。两个孩子听见他走到一匹马身边，叫那匹马转过去。楼上安全了，可鲁珀特的语气依然很烦躁。
        - id: ch01-b47
          speaker: rupert
          text: |-
            我真希望这件事快点结束。
        - id: ch01-b48
          speaker: caroline
          text: |-
            下雨是很讨厌，不过明天也许会放晴。我先给你带了一朵秘密玫瑰。还有一样东西，等我从这个紧巴巴的口袋里掏出来。你看，是《鲁滨孙漂流记》，还有纸和铅笔。你可以正正经经给父母写信，雨一停我就替你寄出去。
        - id: ch01-b49
          speaker: rupert
          text: |-
            你可真够朋友。有书看，我就没事了。你不知道躲藏时，时间过得有多慢。我真不明白那些保王党人是怎么熬的，还有铁面人、沃尔特·雷利爵士和苏格兰女王玛丽。
        - id: ch01-b50
          speaker: caroline
          text: |-
            真让人难过。从印度寄来回信，要等多久？
        - id: ch01-b51
          speaker: rupert
          text: |-
            要好几个星期。我刚才还在想，这么久我一定熬不下去，也许真该逃到海上。当然，这一次不能再去黑斯廷斯。可现在有了这本书，事情好像没有那么糟了。平彻陪着我，也挺有趣。你当然也一样。
        - id: ch01-b52
          speaker: narrator
          text: |-
            最后一句，是鲁珀特忽然想起礼貌才补上的。卡罗琳也不计较。她在干草里扒出一个舒适的小窝，安安稳稳坐进去，请鲁珀特从头讲讲昨晚的事，也就是他们离开以后发生了什么。
        - id: ch01-b53
          speaker: rupert
          text: |-
            威廉把我带进来，给了我毯子，把狗也送来，又拿来面包和奶酪。今天早上是面包和培根。
        - id: ch01-b54
          speaker: caroline
          text: |-
            你的嗓子真的哑了。
        - id: ch01-b55
          speaker: rupert
          text: |-
            没什么。你别觉得我是贪吃鬼，可我真想吃点别的。好像好多年都在吃面包、奶酪和冷培根。培根还全是肥肉。
        - id: ch01-b56
          speaker: narrator
          text: |-
            卡罗琳怪自己怎么会没想到这个，答应等那些男人回家喝下午茶时，就带点不一样的食物来。可这件事说完，两人忽然都找不到别的话了。阁楼里安静得出奇。过了一会儿，鲁珀特把脑袋钻进毯子里，想把咳嗽声压低，可那声音还是叫人听见了。
        - id: ch01-b57
          speaker: caroline
          text: |-
            你可别受凉了。埃默琳姑妈说，只要晚上一直开着窗，人就永远不会受凉。可这里连一扇窗也没有，你当然没法开。你会不会下国际象棋、跳棋、哈尔玛棋，或者什么别的棋？我可以把棋都带过来，陪你消磨时间。
        - id: ch01-b58
          speaker: narrator
          text: |-
            卡罗琳说，自己下国际象棋只会走棋子，还知道把后和象调出来时，对方那种输法叫“傻瓜将死”。可别人总会在她布置完以前识破。
        - id: ch01-b59
          speaker: rupert
          text: |-
            我来教你下棋。唉，现在什么事都糟透了。躲在这里，时间又过得这么慢。印度可好玩了，我真希望自己还在那里。
        - id: ch01-b60
          speaker: caroline
          text: |-
            我也希望。不是，我不是那个意思。我只是希望你别这么惨兮兮的。
        - id: ch01-b61
          speaker: rupert
          text: |-
            应该成立一个防止学校虐待协会。那样就什么问题也没有了。
        - id: ch01-b62
          speaker: caroline
          text: |-
            今天是个泄气日。我早上也像整个人都扁了，觉得什么都不重要。后来就好多了。我回去查查花语，看哪种花表示振作起来。找到以后就带给你，说不定能施一道振作精神的魔法。
        - id: ch01-b63
          speaker: narrator
          text: |-
            卡罗琳坐在干草中，皱起眉头，努力想着怎样才能让这个囚徒高兴。她想得那么认真，一心只顾着帮助鲁珀特。其实，她自己坐在那里，就差不多是一道振作精神的魔法。鲁珀特大概也感觉到了她的好意。
        - id: ch01-b64
          speaker: rupert
          text: |-
            我没事，只是觉得难受透了。
        - id: ch01-b65
          speaker: caroline
          text: |-
            你先写信吧。我已经没那么泄气了，会想出各种办法逗囚徒开心。我还会给你带……
        - id: ch01-b66
          speaker: narrator
          text: |-
            楼下突然响起威廉的口哨。两个孩子顿时像石头一样僵住，连气也不敢喘。接着，他们听见了威尔明顿太太的声音。
        - id: ch01-b67
          speaker: mrs_wilmington
          text: |-
            威廉，你看见卡罗琳小姐了吗？我怕她冒雨跑出去了。
        - id: ch01-b68
          speaker: william
          text: |-
            她在阁楼上，太太。我让她上去瞧一眼。小姐，下来吧，该看的都看完了。
        - id: ch01-b69
          speaker: narrator
          text: |-
            卡罗琳拨开干草，窸窸窣窣爬下梯子。威尔明顿太太披着斗篷，头上蒙着一条棕色格子披肩，正站在马厩门口。卡罗琳连忙说自己身上很干。威廉趁这时候爬上梯子，给阁楼的活动门挂上了锁。
        - id: ch01-b70
          speaker: caroline
          text: |-
            我身上很干，真的。
        - id: ch01-b71
          speaker: mrs_wilmington
          text: |-
            你最好马上进屋。
        - id: ch01-b72
          speaker: narrator
          text: |-
            就在这时，阁楼里传来轻轻一声。鲁珀特又咳嗽了。威尔明顿太太停下脚步，单脚踩着胶套鞋，仔细听着。
        - id: ch01-b73
          speaker: mrs_wilmington
          text: |-
            那是什么声音？
        - id: ch01-b74
          speaker: william
          text: |-
            我的狗在上头。它有时会抓耗子。
        - id: ch01-b75
          speaker: mrs_wilmington
          text: |-
            那可不像狗发出的声音。
        - id: ch01-b76
          speaker: william
          text: |-
            可不是吗？真不知道狗怎么发得出来！它们抓耗子时，什么声音都能弄出来。狗就是这样。
        - id: ch01-b77
          speaker: narrator
          text: |-
            威尔明顿太太若有所思地说自己明白了，便转身往回走。她穿着胶套鞋，每一步都小心挑选落脚的地方。卡罗琳跟在后面，这才敢重新呼吸。为了证明雨水没有什么可怕，她还故意踩遍了路上的每一个水洼。到了后门，女管家摘下披肩，用力抖了抖上面的水。
        - id: ch01-b78
          speaker: mrs_wilmington
          text: |-
            你舅舅刚才在找你。他不希望你冒雨出去。我一向以为，年轻小姐应该离下等的伙伴远一点。
        - id: ch01-b79
          speaker: caroline
          text: |-
            如果您说的是威廉……
        - id: ch01-b80
          speaker: mrs_wilmington
          text: |-
            我说的是干草阁楼里的狗。现在你明白了吧。你舅舅在餐厅，请先在垫子上擦干净鞋。
        - id: ch01-b81
          speaker: narrator
          text: |-
            卡罗琳决定，雨一停就送威尔明顿太太一束安抚心情的花。餐厅里传来说话声。她听见查尔斯正请舅舅坐在沉船上，等孩子们划着木筏来救他。卡罗琳停在门口，简直不敢相信自己的耳朵。那个一向拘谨的舅舅，难道真的在陪他们玩游戏？不，那一定不可能。
        - id: ch01-b82
          speaker: uncle
          text: |-
            多谢，我觉得待在沉船上更安全。你们玩得高兴，我很欣慰。
        - id: ch01-b83
          speaker: narrator
          text: |-
            舅舅慈祥地朝卡罗琳眨眨眼。整个房间依旧乱着，地毯、桌椅四周到处都是船难游戏留下的东西。原来夏洛特和查尔斯等卡罗琳走后，便认定收拾房间的约定已经不算数，又接着玩了起来。
        - id: ch01-b84
          speaker: caroline
          text: |-
            屋里有一点乱，希望您不介意，舅舅。
        - id: ch01-b85
          speaker: uncle
          text: |-
            完全不介意，只要你们没有打坏东西。
        - id: ch01-b86
          speaker: charles
          text: |-
            我们小心得不得了。比如那只木筏，我们一直让它待在地毯上，绝不拖到地板上去，这样就不会把它刮花了。
        - id: ch01-b87
          speaker: charlotte
          text: |-
            我觉得，在这片土耳其海上拖来拖去，还能把木筏擦亮呢。
        - id: ch01-b88
          speaker: uncle
          text: |-
            这么说，雨天下着，你们也不无聊？我还怕你们会闷得难受。
        - id: ch01-b89
          speakers: [caroline, charlotte, charles]
          ensemble: chorus
          text: |-
            一点也不！这是世界上最可爱的房子。
        - id: ch01-b90
          speaker: narrator
          text: |-
            夏洛特亲切地问舅舅，他的魔法进展如何。
        - id: ch01-b91
          speaker: uncle
          text: |-
            不好，很不好。你们的魔法呢？
        - id: ch01-b92
          speaker: narrator
          text: |-
            孩子们谁也没有马上回答。他们同时想到了两件事，一件是蕨草种子的魔法，另一件是鲁珀特那个天大的秘密。舅舅还在等着。沉默越拖越显得可疑，卡罗琳只好艰难地抢先开口，急急忙忙把秘密玫瑰会说了出来。
        - id: ch01-b93
          speaker: caroline
          text: |-
            我们成立了一个秘密会社，叫秘密玫瑰会。会员要戴一朵盛开的玫瑰和两个花苞。
        - id: ch01-b94
          speaker: uncle
          text: |-
            原来如此。那你们的秘密是什么？
        - id: ch01-b95
          speaker: narrator
          text: |-
            和蔼而毫无戒心的舅舅一问，孩子们的脸全红了。谁也不能把鲁珀特的事说出来。只有舅舅没有红。他那张苍白又有些紧张的脸，看起来反而比平时更像牡蛎壳。他见大家不回答，还以为自己问错了话。
        - id: ch01-b96
          speaker: uncle
          text: |-
            请原谅。
        - id: ch01-b97
          speaker: caroline
          text: |-
            要是能说，我们马上就告诉您。可它本来就是秘密会社呀。
        - id: ch01-b98
          speaker: uncle
          text: |-
            我明白了。抱歉，我太冒失。可是，你们没有打坏什么吧？
        - id: ch01-b99
          speakers: [caroline, charlotte, charles]
          ensemble: chorus
          text: |-
            一样也没有。
        - id: ch01-b100
          speaker: uncle
          text: |-
            我就知道你们不会。威尔明顿太太原先认为，你们一来，就会把这屋里差不多每一样东西都打坏。当然，那是她还没有见到你们的时候。现在我知道她错了。不过，万一你们真的打坏了什么，一定会来告诉我，对不对？
        - id: ch01-b101
          speakers: [caroline, charlotte, charles]
          ensemble: chorus
          text: |-
            当然会。
        - id: ch01-b102
          speaker: uncle
          text: |-
            我早该知道你们会说实话。我真希望能想个办法，让你们在雨天也开心些。要是你们在附近有朋友，我可以让人套好马车，你们就能坐车出去拜访他们。只可惜，你们才刚来这里，在附近当然不会有什么熟人。
        - id: ch01-b103
          speaker: charles
          text: |-
            牧师是我们的朋友。
        - id: ch01-b104
          speaker: caroline
          text: |-
            那我们能去看他吗？
        - id: ch01-b105
          speaker: uncle
          text: |-
            当然可以去。坐车去看牧师，再把他一起带回来喝下午茶吧。你们能在这里找到朋友，也能自己找乐子，我很高兴。尤其是看到你们不把这里当外人家，我实在很高兴。
        - id: ch01-b106
          speaker: narrator
          text: |-
            舅舅说完便走了。孩子们望着他离开，又想起餐厅里那场船难，还有藏在阁楼中的秘密。查尔斯越想越不放心。他拿不准，舅舅刚才说他们“不把这里当外人家”，究竟是真心高兴，还是因为房间被弄得一团糟，故意挖苦他们。
        - id: ch01-b107
          speaker: charlotte
          text: |-
            才不是呢。舅舅坦荡得像白昼一样。不过，我们最好还是收拾一下。
        - id: ch01-b108
          speaker: narrator
          text: |-
            夏洛特刚说完，哈丽雅特便进来摆餐具，威尔明顿太太也跟在她身后。孩子们还来不及动手，最后已经是女管家收拾了屋子。她紧紧抿着嘴，脸上明明有一大堆话，却有意克制住自己，从头到尾一句责备也没说。
        - id: ch01-b109
          speaker: narrator
          text: |-
            孩子们独自吃午饭。厨娘还奇怪，他们的胃口怎么突然变得这么大。她哪里知道，孩子们要了分量十足的双份食物。牛肉、约克郡布丁、土豆、夏甘蓝，还有蛋奶糊大黄馅饼，全都悄悄藏进餐厅书架的书后面。那些食物并没有进孩子们的肚子，而是要留给那个此刻躲在干草阁楼里的逃家男孩。
        - id: ch01-b110
          speaker: caroline
          text: |-
            食物得装进玻璃杯。少了盘子会让人发现，玻璃杯却有好几十只，全放在餐具柜里。
        - id: ch01-b111
          speaker: narrator
          text: |-
            一排玻璃杯很快整整齐齐地摆在桌上，活像秘密实验室工作台上的烧杯。杯子平时住在餐具柜里，从没装过这样的东西。如今里面塞着牛肉、布丁和别的食物。那些油腻腻的东西，从前可从没有玷污过这样清澈的杯底。孩子们把杯子藏好。夏洛特再把最后一本用来遮掩食物的书放回原处，拉响了铃。
        - id: ch01-b112
          speaker: charlotte
          text: |-
            装好了当然不错，可我们怎么把这些东西送给鲁珀特？
        - id: ch01-b113
          speaker: caroline
          text: |-
            喝下午茶的时候，威廉一定有办法。
        - id: ch01-b114
          speaker: charlotte
          text: |-
            可我们还得带牧师回来喝下午茶呢。
        - id: ch01-b115
          speaker: caroline
          text: |-
            哦，真讨厌！我压根没想到这个。
