      display_name: Jane
      tts:
        delivery: practical, attentive, and matter-of-fact
        timbre: clear and homely
        pace: medium
        pitch: medium
  chapters:
    - id: ch01
      title: Hunted
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: No one could say exactly how it happened. Perhaps Caroline was too sleepy to bump her head on the pillow seven times before she fell asleep. Perhaps even that excellent spell sometimes failed. Whatever the reason, none of the children woke until Jane drew the blinds and let the half-past-seven sunshine into their rooms.
        - id: ch01-b02
          speaker: narrator
          text: Caroline opened her eyes, checked her little watch, and sprang out of bed. A moment later she stood swaying in the middle of the room, rubbing her eyes and yawning.
        - id: ch01-b03
          speaker: jane
          text: What's your hurry, miss? It's only just gone half past seven.
        - id: ch01-b04
          speaker: caroline
          text: I was dreaming.
        - id: ch01-b05
          speaker: narrator
          text: As soon as Jane had gone, Caroline shook Charlotte awake.
        - id: ch01-b06
          speaker: caroline
          text: Listen! Did anything really happen last night?
        - id: ch01-b07
          speaker: charlotte
          text: No.
        - id: ch01-b08
          speaker: narrator
          text: Charlotte behaved exactly like a dormouse. Caroline snatched up her dressing gown and crept into Charles's room. He was sitting upright in bed, staring wildly at the open wardrobe. The shelves were all back where they belonged. They held nothing but clean paper and little muslin bags of sweet-smelling lavender.
        - id: ch01-b09
          speaker: caroline
          text: What in the world has happened?
        - id: ch01-b10
          speaker: narrator
          text: She was afraid something dreadful had gone wrong.
        - id: ch01-b11
          speaker: charles
          text: Nothing. I had a stupid dream, that's all. When I woke up, I thought it had really happened. Of course it hadn't.
        - id: ch01-b12
          speaker: caroline
          text: I thought mine was a dream too, and Charlotte says nothing happened. What did you dream about?
        - id: ch01-b13
          speaker: narrator
          text: Charles told her part of it.
        - id: ch01-b14
          speaker: caroline
          text: But I dreamed the very same things! The fern-seed, Rupert, our Arab Saracens game, and hunting for biscuits. We couldn't both have the same dream. In yours, where did you leave the biscuits that were left?
        - id: ch01-b15
          speaker: charles
          text: You left them on the dressing table.
        - id: ch01-b16
          speaker: caroline
          text: They're not there now.
        - id: ch01-b17
          speaker: charles
          text: Then it must have been a dream, and we both dreamed it.
        - id: ch01-b18
          speaker: narrator
          text: They stared blankly at each other. After a doubtful pause, Caroline remembered one more test.
        - id: ch01-b19
          speaker: caroline
          text: I dreamed I dressed his wounds. I mean, I sponged his feet. The mud was thick, so if it really happened, there should be mud in the basin.
        - id: ch01-b20
          speaker: narrator
          text: But Jane knew her work too well. The basin held no mud at all. Beside it stood a shining brass can of hot water with a clean towel neatly laid across the top.
        - id: ch01-b21
          speaker: caroline
          text: The fern-seed did something, anyway, even if it only made us dream the same dream.
        - id: ch01-b22
          speaker: narrator
          text: Charles wanted to know how she could be sure they had not dreamed the fern-seed as well.
        - id: ch01-b23
          speaker: caroline
          text: Oh, just get dressed.
        - id: ch01-b24
          speaker: narrator
          text: She went back to dress herself. Once Charlotte was properly awake, she admitted remembering Rupert's arrival. Yet if he had truly come, he had vanished without leaving a trace, and boys rarely manage that. So all three decided the night must have been a dream brought on by eating fern-seed. For some reason, though, they all felt certain the fern-seed itself had been real.
        - id: ch01-b25
          speaker: narrator
          text: Breakfast was duller than usual. Afterward Mrs. Wilmington carefully asked them to spend the morning outdoors, just as she had asked them the day before. They obeyed, but their feet moved slowly and their boots felt strangely heavy.
        - id: ch01-b26
          speaker: charlotte
          text: Let's go somewhere we can't see the house.
        - id: ch01-b27
          speaker: narrator
          text: Beyond the shrubbery they entered the wood. Oaks, hazels, dogwoods, silver birches, and an occasional black yew stood around open glades feathered with bracken. Between honeysuckle, sweet chestnut, and a hazel thicket, they found a small clearing. They pressed the bracken flat and sat in its sweet scent.
        - id: ch01-b28
          speaker: caroline
          text: We came here to hold a council about that wonderful dream we all had.
        - id: ch01-b29
          speaker: narrator
          text: If it was a council at all, it was a sleepy and lifeless one.
        - id: ch01-b30
          speaker: caroline
          text: I'd rather think for a while first.
        - id: ch01-b31
          speaker: narrator
          text: The others agreed.
        - id: ch01-b32
          speaker: charles
          text: Caro, I could think better with my head in your lap.
        - id: ch01-b33
          speaker: charlotte
          text: And bunch the fern closer under my back, Caro.
        - id: ch01-b34
          speaker: narrator
          text: When the sun climbed over the sweet chestnut, it shone on a warm, comfortable heap of sleeping children. You cannot stay awake all night, or even dream that you did, and then hold an important council the next morning as if nothing had happened.
        - id: ch01-b35
          speaker: narrator
          text: At last the sun crept high enough to shine straight into their eyes. They woke, and suddenly everything seemed different and far more interesting.
        - id: ch01-b36
          speaker: charlotte
          text: I know what we should do. Let's try the fern-seed again.
        - id: ch01-b37
          speaker: charles
          text: But it only works on the eve of—
        - id: ch01-b38
          speaker: charlotte
          text: Once you've planted it, the seed keeps working. I mean, once you've chewed it. I'm sure it does. Even if we don't see anything, perhaps we'll dream some more.
        - id: ch01-b39
          speaker: charles
          text: There isn't enough time for a properly deep dream before dinner.
        - id: ch01-b40
          speaker: charlotte
          text: That doesn't matter. If we're late, we'll tell the truth and say we fell asleep in the woods. There's fern everywhere. It would be silly not to try.
        - id: ch01-b41
          speaker: narrator
          text: That sounded reasonable. Once again they chewed fern-seed. Well-educated people have said that bracken is not really a fern, but it looked like one to the children. It certainly tried hard to do what they expected. They lifted the damp green pads from their eyes and blinked at the leaves. There, between the hazel thicket and the honeysuckle, stood Rupert. He was real and alive, with no dream-nonsense about him.
        - id: ch01-b42
          speakers: [caroline, charlotte, charles]
          ensemble: chorus
          text: Was last night a dream? Did you really come to the window?
        - id: ch01-b43
          speaker: rupert
          text: Of course it wasn't a dream. I was afraid they'd catch me, so I left early. I put the shelves back and returned the pillows to the bed. I took the biscuits too. I didn't think you'd mind.
        - id: ch01-b44
          speakers: [caroline, charlotte, charles]
          ensemble: chorus
          text: We don't mind at all!
        - id: ch01-b45
          speaker: rupert
          text: I climbed out through your dressing-room window and down the ivy. It was easy. Then I crossed the grass and hid beneath those fancy fir trees in the avenue, the ones with branches that trail down. I saw you come outside, but gardeners and other people were everywhere. I waited until their dinner bell rang, then slipped out here. I was about to call to you when you put that nasty green stuff over your eyes. Why did you do that?
        - id: ch01-b46
          speaker: narrator
          text: The children explained.
        - id: ch01-b47
          speaker: rupert
          text: That's queer. I knew fern-seed was supposed to make you invisible. Shakespeare says so. On my way here I ate some, just in case it helped people not see me. And no one did see me until you did. So perhaps I truly was invisible until you put fern-seed on your eyes.
        - id: ch01-b48
          speaker: charlotte
          text: What a splendid idea! Then everything really happened. We felt awful when we thought we'd only dreamed it. Now please tell us why you ran away, how you did it, and what you'll do next.
          emotion: happy
        - id: ch01-b49
          speaker: rupert
          text: I thought about running away to sea, but the coast is a long way off. I'd rather stay here with you. Couldn't you hide me in a log hut or somewhere, like a runaway slave, until they stop searching? I could write to my father in India and ask if I may live here instead of with old Mug's brother. Could you keep me hidden until his answer comes?
        - id: ch01-b50
          speaker: charles
          text: We could try.
        - id: ch01-b51
          speaker: charlotte
          text: Of course we can, and we will! But why do you seem so different now? You look years older than you did at the station.
        - id: ch01-b52
          speaker: rupert
          text: You'd look years older too if you'd locked your master in his study, run away, and spent half a day and a night hiding.
        - id: ch01-b53
          speakers: [caroline, charlotte, charles]
          ensemble: chorus
          text: But what did he do to you?
        - id: ch01-b54
          speaker: rupert
          text: You saw what he was like on the train.
        - id: ch01-b55
          speaker: charlotte
          text: You seemed terribly afraid of him. I'm surprised you dared to escape.
        - id: ch01-b56
          speaker: rupert
          text: I wasn't afraid on the train. That was suppressed fury. I was working out where I could go if I had to run. Then I did have to run, and I ran like Billy-o. I saw the name on a signpost and remembered your promise to be true to the death. I stayed behind the hedges because I wasn't sure the fern-seed worked. I climbed a tree and watched you pass. When you came back with the parson, I quietly followed you home.
        - id: ch01-b57
          speaker: rupert
          text: I hoped you'd come out, but you didn't. I hid under one of those fancy firs and must have fallen asleep. When I woke, I saw a light in a window and went toward it like a silly bird. You know how sparrows fly out of ivy when someone shows a light?
        - id: ch01-b58
          speaker: narrator
          text: They did not know.
        - id: ch01-b59
          speaker: rupert
          text: Well, they do. Then I saw you messing about inside. I was so glad. I tapped on the window, and you know everything after that.
        - id: ch01-b60
          speaker: narrator
          text: He finished like a hero in a book, but Charlotte still wanted an answer.
        - id: ch01-b61
          speaker: charlotte
          text: What did that Murdstone man actually do to you?
        - id: ch01-b62
          speaker: rupert
          text: He was looking for a quarrel from the beginning. When we reached his horrible house that night, he gave me bread and milk with a teaspoon. Bread and milk! I said I'd rather not eat it, and he said I had to learn to take whatever I was given. Then he talked about discipline and showed me a cane. He said he was glad there were no other little boys there. Little boys! That meant he could spend all his time breaking me in.
          emotion: disgusted
        - id: ch01-b63
          speaker: charlotte
          text: What a beast!
          emotion: angry
        - id: ch01-b64
          speaker: rupert
          text: He thought I was a soft little white rabbit. He knows better now.
        - id: ch01-b65
          speaker: narrator
          text: Charles and Caroline began to feel uneasy around this young desperado. Fern-seed was one thing, and so was the idea of escaping from school. But a master truly being so cruel that a boy had to run away came frighteningly close to real life.
        - id: ch01-b66
          speaker: charlotte
          text: He must be like the Spanish Inquisition. We have proper laws now, so why isn't he in prison?
          emotion: angry
        - id: ch01-b67
          speaker: narrator
          text: Charles and Caroline still thought it more likely that Rupert was exaggerating to excuse his escape than that Mr. Macpherson could be quite so hateful. They might have believed him more easily if he had looked frightened and miserable. Instead, he seemed comfortable whenever he was not defiant.
        - id: ch01-b68
          speaker: narrator
          text: Perhaps you know that miserable feeling. You want to be kind to someone, yet you cannot be sure that believing them would be unfair to somebody else. Nothing feels worse than being unable to trust a person you want to trust. Rupert must have known what the others were thinking, because suddenly he pulled his hand from his pocket.
        - id: ch01-b69
          speaker: rupert
          text: Look, then. No, I don't blame you. I know it sounds impossible. But he did this on the first night, after the bread and milk, when I was already in bed. He used a ruler.
        - id: ch01-b70
          speaker: narrator
          text: Across the back of the hand he had kept hidden lay a blue bruise and a small red graze.
        - id: ch01-b71
          speaker: charlotte
          text: I believed you before you showed us that. I know people like him exist. I've read Uncle Tom's Cabin.
        - id: ch01-b72
          speaker: caroline
          text: We do believe you. No one said we didn't.
        - id: ch01-b73
          speaker: charles
          text: Of course we believe you. What nonsense! We'll bring paper, a pencil, and an envelope so you can write to your father. And we will hide you.
        - id: ch01-b74
          speaker: rupert
          text: Right-o! Quiet!
        - id: ch01-b75
          speaker: narrator
          text: Everyone fell silent. Rupert pointed through a patch of blue between the oak and the honeysuckle. A figure dressed in blue was coming up the drive.
        - id: ch01-b76
          speaker: rupert
          text: Go and find out who it is, but don't give anything away.
        - id: ch01-b77
          speaker: charlotte
          text: I'll go.
        - id: ch01-b78
          speaker: charles
          text: What will you say if they ask why you've come back to the house?
        - id: ch01-b79
          speaker: charlotte
          text: I'll say I came to fetch your handkerchief because you needed one badly. You always do.
        - id: ch01-b80
          speaker: narrator
          text: Charlotte left.
        - id: ch01-b81
          speaker: caroline
          text: If they're hunting for you, we'd better cover you with leaves and bracken. Then your tweed clothes won't show between the trees. We'll cover your head too. Crawl through carefully and crush as little bracken as you can.
        - id: ch01-b82
          speaker: narrator
          text: Soon Rupert was completely hidden. Charlotte returned breathless from an unexpected part of the wood.
        - id: ch01-b83
          speaker: charlotte
          text: I went the long way around to throw them off the trail.
        - id: ch01-b84
          speaker: rupert
          text: Who is it?
        - id: ch01-b85
          speaker: narrator
          text: His voice came from beneath the leaves. Charlotte delivered her enormous news with perfect calm.
        - id: ch01-b86
          speaker: charlotte
          text: The police. They're asking about you. They've tracked you as far as Hadlow.
        - id: ch01-b87
          speaker: rupert
          text: What did they say at the house?
        - id: ch01-b88
          speaker: charlotte
          text: The people there said they hadn't seen you, but the police may search the grounds.
        - id: ch01-b89
          speaker: rupert
          text: And what did you tell them?
        - id: ch01-b90
          speaker: charlotte
          text: No one asked me anything. But I did tell them something. Lie as still as a mouse, Rupert. You're safe for now, and I'm glad we buried you.
        - id: ch01-b91
          speaker: rupert
          text: What did you say?
        - id: ch01-b92
          speaker: narrator
          text: Charlotte glowed with pride in her strategy.
        - id: ch01-b93
          speaker: charlotte
          text: I said we'd help them search! Come on, you other two C's. We'll go back the long way and help the police hunt for their runaway boy. Once they're gone, we'll bring you proper food, not just biscuits. Don't worry. The three C's are yours to the death!
          emotion: happy
