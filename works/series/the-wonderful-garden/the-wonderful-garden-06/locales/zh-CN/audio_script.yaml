audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 温暖机敏，带着克制的幽默讲述
        timbre: 清澈柔和
        pace: 从容而富有变化
        pitch: 中音
    caroline:
      display_name: 卡罗琳
      tts:
        delivery: 大方热情，努力摆出长姐的懂事
        timbre: 明亮清脆
        pace: 自然轻快
        pitch: 中高音
    charlotte:
      display_name: 夏洛特
      tts:
        delivery: 活泼直率，想到什么便说什么
        timbre: 轻盈清亮
        pace: 偏快
        pitch: 高音
    charles:
      display_name: 查尔斯
      tts:
        delivery: 淘气认真，笑话总说得一本正经
        timbre: 清亮的男孩声
        pace: 轻快
        pitch: 中高音
    rupert:
      display_name: 鲁珀特
      tts:
        delivery: 倔强有礼，疲惫时仍尽力稳住声音
        timbre: 略带沙哑的男孩声
        pace: 自然偏慢
        pitch: 中高音
    jane:
      display_name: 简
      tts:
        delivery: 勤快利落，说话带着女仆自然的恭敬
        timbre: 清爽朴实
        pace: 自然
        pitch: 中音
    mrs_wilmington:
      display_name: 威尔明顿太太
      tts:
        delivery: 拿腔拿调，客气里透着不容商量
        timbre: 细而干脆
        pace: 稍慢
        pitch: 中高音
  chapters:
    - id: ch01
      title: 第六章　遭到追捕
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: |-
            事情到底怎么会变成这样，我也说不准。也许卡罗琳实在太困，睡前没有把脑袋在枕头上撞够七下。也许那个一向很好用的法子，并不能保证每次都灵。反正，三个孩子谁也没有按计划早早醒来。直到简走进他们的房间，拉起百叶窗，让七点半的阳光照了进来，他们才睁开眼睛。
        - id: ch01-b02
          speaker: narrator
          text: |-
            卡罗琳这才完全清醒。她看了一眼小表，猛地跳下床，站在房间中央。可她两腿还有些发晃，只顾揉着眼睛打哈欠。
        - id: ch01-b03
          speaker: jane
          text: |-
            小姐，急什么呀？才刚过七点半呢。
        - id: ch01-b04
          speaker: caroline
          text: |-
            我刚才在做梦。
        - id: ch01-b05
          speaker: narrator
          text: |-
            简一离开，卡罗琳立刻摇醒夏洛特。
        - id: ch01-b06
          speaker: caroline
          text: |-
            喂，昨天夜里到底出过什么事没有？
        - id: ch01-b07
          speaker: charlotte
          text: |-
            没有。
        - id: ch01-b08
          speaker: narrator
          text: |-
            夏洛特说完又缩成一只睡鼠。卡罗琳抓起晨衣，悄悄来到查尔斯房里。他已经坐起来了，正惊慌地望着衣柜。柜门大开，昨夜抽出来藏在床下的搁板全都回到了原处。每一层都铺着洁净白纸，上面只摆着薰衣草小袋。甜香透过白细棉布飘出来。鲁珀特、毯子和枕头全不见了，柜子里什么痕迹也没有。
        - id: ch01-b09
          speaker: caroline
          text: |-
            出了什么事？
        - id: ch01-b10
          speaker: narrator
          text: |-
            她心里已经想到了最坏的结果。查尔斯却有点不耐烦。
        - id: ch01-b11
          speaker: charles
          text: |-
            没什么。我做了个傻梦，醒来还当它是真的。它当然不是真的。
        - id: ch01-b12
          speaker: caroline
          text: |-
            我刚醒时也以为是梦。夏洛特又说昨晚什么都没发生。你梦见什么了？
        - id: ch01-b13
          speaker: narrator
          text: |-
            查尔斯说了一点。卡罗琳越听越着急。
        - id: ch01-b14
          speaker: caroline
          text: |-
            可这些我也梦见了呀！蕨种、鲁珀特，还有我们扮成撒拉逊人，出去猎饼干。两个人哪能做同一个梦？梦里吃剩的饼干放在哪儿了？
        - id: ch01-b15
          speaker: charles
          text: |-
            你放在梳妆台上了。
        - id: ch01-b16
          speaker: caroline
          text: |-
            可现在那里没有。
        - id: ch01-b17
          speaker: charles
          text: |-
            那就真是梦。我们俩碰巧梦得一样。
        - id: ch01-b18
          speaker: narrator
          text: |-
            两个人呆呆地互相望着。卡罗琳迟疑了好一会儿，又想起一件事。
        - id: ch01-b19
          speaker: caroline
          text: |-
            我还梦见给他治伤。其实是拿海绵洗他的脚。泥那么厚，要不是梦，脸盆里一定还有泥。
        - id: ch01-b20
          speaker: narrator
          text: |-
            可简太懂得自己的职责了。等孩子们去查看时，脸盆里哪还会留下泥？那里只有一只擦得亮闪闪的黄铜罐，里面盛满热水，罐子上还整整齐齐搭着一条干净毛巾。
        - id: ch01-b21
          speaker: caroline
          text: |-
            不管怎样，蕨种总算起了作用。就算它只让我们做了同一个梦，那也算呀。
        - id: ch01-b22
          speaker: narrator
          text: |-
            查尔斯反问，她凭什么肯定连吃蕨种也不是梦。卡罗琳不愿再争。
        - id: ch01-b23
          speaker: caroline
          text: |-
            哦，你快穿衣服吧。
        - id: ch01-b24
          speaker: narrator
          text: |-
            夏洛特真正醒来后，也承认自己记得鲁珀特到过这里。可他若是真的来过，现在已经走了，而且没留下一点痕迹。男孩能把事情收拾得这么干净，实在很少见。于是三个孩子认定，他们一定是吃了蕨种以后，一起做了场梦。至于为什么，他们谁也说不明白，可三个人又全都认定，至少吃蕨种这件事肯定是真的。
        - id: ch01-b25
          speaker: narrator
          text: |-
            早餐吃起来也不像往常那么有滋味。三个孩子满脑子都想着昨夜的事。等大家吃完，威尔明顿太太才细声细气地发了话，要他们上午到外面去。
        - id: ch01-b26
          speaker: mrs_wilmington
          text: |-
            请你们上午出去，就跟昨儿个要求你们的一样。
        - id: ch01-b27
          speaker: narrator
          text: |-
            三个人慢吞吞往外走，脚上的靴子也重得出奇。
        - id: ch01-b28
          speaker: charlotte
          text: |-
            先走到屋里看不见我们的地方吧。
        - id: ch01-b29
          speaker: narrator
          text: |-
            他们走过灌木丛，一直来到更远处的树林。那里长着橡树、榛树、山茱萸和白桦，偶尔露出一株黑黝黝的紫杉。树木之间敞开一片片空地，地上铺着羽毛似的蕨叶。三个孩子在忍冬、甜栗树和一丛榛树之间找到一小块地方，压平蕨叶，坐进那股清甜的气味里。
        - id: ch01-b30
          speaker: caroline
          text: |-
            我们开个大会，谈谈大家一起做的奇妙梦。
        - id: ch01-b31
          speaker: narrator
          text: |-
            这场大会既没精神，也没开多久。
        - id: ch01-b32
          speaker: caroline
          text: |-
            我想先自己想一会儿。
        - id: ch01-b33
          speaker: narrator
          text: |-
            另外两个也觉得应该先想一想。
        - id: ch01-b34
          speaker: charles
          text: |-
            卡罗，让我枕着你的腿吧，那样准能想得更清楚。
        - id: ch01-b35
          speaker: charlotte
          text: |-
            卡罗，把我背后的蕨叶再拢紧一点。
        - id: ch01-b36
          speaker: narrator
          text: |-
            等太阳越过甜栗树梢，照到林间时，地上已经只剩一堆暖暖和和、舒舒服服睡着的孩子。一个人真熬了整夜，或者只是梦见自己熬了一整夜，第二天都不可能像什么也没发生过一样，坐下来召开重要大会。这件事你可不能怪他们。
        - id: ch01-b37
          speaker: narrator
          text: |-
            阳光慢慢爬高，直照进他们眼里。三个孩子醒来以后，周围的一切忽然又有趣了。
        - id: ch01-b38
          speaker: charlotte
          text: |-
            我想到一个办法。咱们再试一次蕨种。
        - id: ch01-b39
          speaker: charles
          text: |-
            可那东西只有圣约翰节前夜才……
        - id: ch01-b40
          speaker: charlotte
          text: |-
            种子种下去，效力当然会留下。我是说，嚼下去。就算看不见东西，也许还能接着做梦。
        - id: ch01-b41
          speaker: charles
          text: |-
            午饭以前可不够做一个厚实的大梦。
        - id: ch01-b42
          speaker: charlotte
          text: |-
            别管了，试试再说。午饭迟到了，我们就照实说在树林里睡着了。四周全是蕨草，不试才傻呢。
        - id: ch01-b43
          speaker: narrator
          text: |-
            她的话有道理。三个孩子又嚼了蕨种。我听真正有学问的人说过，欧洲蕨其实根本不算蕨类。可在孩子们眼里，它分明就是蕨草。况且，它也确实尽了全力，没有辜负大家的期待。三个人把湿漉漉的绿色叶片从眼睛上揭下来，对着满眼绿叶眨了又眨。就在枝叶最浓密的地方，榛树丛和忍冬之间，鲁珀特正看着他们。这回是个真真正正、活生生的鲁珀特，绝不是梦里闹出来的影子。
        - id: ch01-b44
          speakers: [caroline, charlotte, charles]
          ensemble: chorus
          text: |-
            昨晚是不是梦？你真的来敲过窗户吗？
        - id: ch01-b45
          speaker: rupert
          text: |-
            当然不是。我只是怕给人逮住，所以天一亮就出来了。搁板都放回去了，枕头也摆回了床上。还有，我把饼干带走了。我想你们不会介意吧……
        - id: ch01-b46
          speakers: [caroline, charlotte, charles]
          ensemble: chorus
          text: |-
            一点也不介意，当然不介意。
        - id: ch01-b47
          speaker: rupert
          text: |-
            我从你们更衣室的窗户出去，顺着常春藤爬下来，一点也不难。然后我穿过草地，躲到林荫道旁边那些怪冷杉底下，就是树枝一直拖到地上的那种，你们知道吧。我看见你们出门，可园丁和别的人到处都是。我只好一直等到他们的午饭铃响，才悄悄溜到这里来。正要喊一声“嗨”，你们就把绿糊糊的东西贴在眼睛上了。看着真恶心。那到底是做什么的？
        - id: ch01-b48
          speaker: narrator
          text: |-
            他们把蕨种的事从头到尾说给鲁珀特听。鲁珀特听完，舒舒服服地坐到他们中间，看起来一点也不拘束，只有一只手始终插在口袋里。
        - id: ch01-b49
          speaker: rupert
          text: |-
            这可怪了。我知道蕨种能让人隐身，莎士比亚就是这么写的。来的路上，我也吃了一点，只想碰碰运气，让别人看不见我。结果在你们以前，的确谁也没看见我。那么，也许我真的一直隐着身，直到你们拿蕨种蒙住眼睛。
        - id: ch01-b50
          speaker: charlotte
          text: |-
            这想法太棒了！这样所有事情就都是真的啦。刚才以为我们只是做梦，心里难受极了。你快说说，你为什么逃，怎么逃的，往后又准备怎么办。全都告诉我们！
          emotion: happy
        - id: ch01-b51
          speaker: rupert
          text: |-
            我原来打算逃到海上，可这里离海岸实在太远。我倒更愿意留下来，跟你们待在一起。你们能不能找一间木屋之类的地方把我藏起来，就像故事里藏一个逃跑的奴隶？只要藏到他们不再找我就行。我会写信给远在印度的父亲，请他答应让我留在这里，不要再住到默德斯通老家伙的弟弟那里。父亲回信以前，你们能一直藏住我吗？
        - id: ch01-b52
          speaker: charles
          text: |-
            我们可以试试看。
        - id: ch01-b53
          speaker: charlotte
          text: |-
            当然可以，我们一定藏好你！不过，你怎么变得这么不一样？跟站台上相比，好像一下大了好几岁。
        - id: ch01-b54
          speaker: rupert
          text: |-
            你要是把老师锁在书房里，逃出来以后又跑又躲，过上大半天和一整夜，也会老上好几岁。
        - id: ch01-b55
          speakers: [caroline, charlotte, charles]
          ensemble: chorus
          text: |-
            可他到底对你做了什么？
        - id: ch01-b56
          speaker: rupert
          text: |-
            你们在火车上看见他的样子了。
        - id: ch01-b57
          speaker: charlotte
          text: |-
            那时你明明怕他怕得厉害。我真没想到你敢逃。
        - id: ch01-b58
          speaker: rupert
          text: |-
            那才不是害怕。我只是在死死压住火气。我一直盘算，万一非逃不可，该往哪里去。后来真到了非逃不可的时候，我就拼命跑。路牌上的地名让我想起你们说过，会哪怕死也站在我这边。我不敢肯定蕨种有用，只好一直躲在树篱后面走。后来我爬到一棵树上，看见你们从下面经过。等你们带着牧师回来，我就远远跟在后面，一路来到你们家外头。我盼着你们会出来，可你们始终没出来。我只好躲在一棵怪模怪样的冷杉底下，后来大概还睡着了。醒来以后，我看见一扇窗里亮着灯，竟像只傻鸟一样朝灯光走过去。你们知道吗，拿灯一照，麻雀就会从常春藤里飞出来？
        - id: ch01-b59
          speaker: narrator
          text: |-
            他们谁也不知道。
        - id: ch01-b60
          speaker: rupert
          text: |-
            真的会。后来我看见你们在那里瞎忙活，心里别提多高兴了。我敲了窗户，后面的事你们都知道。
        - id: ch01-b61
          speaker: narrator
          text: |-
            鲁珀特说到这里便停了下来，口气活像故事书里的英雄，讲完一场历险以后，觉得其余的事根本不必再说。可夏洛特并没有忘记最要紧的问题，非得问出答案不可。
        - id: ch01-b62
          speaker: charlotte
          text: |-
            默德斯通那家伙到底怎么欺负你了？
        - id: ch01-b63
          speaker: rupert
          text: |-
            他从一开始就存心找碴，巴不得跟我闹起来。那天晚上到了他的讨厌屋子，他竟让我吃牛奶泡面包。牛奶泡面包，还得拿一把茶匙吃！我说宁可不吃，他就说，摆到我面前的东西，我必须学会全部吃下去。他又大谈什么纪律，还特意拿出一根手杖给我看。他说，幸好那里没有别的小男孩。小男孩！因为那样一来，他就能把全部工夫用在我一个人身上，好好管教我，直到我乖乖听话。
          emotion: disgusted
        - id: ch01-b64
          speaker: charlotte
          text: |-
            畜生！
          emotion: angry
        - id: ch01-b65
          speaker: rupert
          text: |-
            他以为我是只没用的小白兔。现在可知道我不是了。
        - id: ch01-b66
          speaker: narrator
          text: |-
            请别因此看不起查尔斯和卡罗琳。面对这个年纪轻轻的亡命徒，他们心里确实有点不安。蕨种当然很有趣，从学校逃走的念头听起来也很有趣。可一个老师竟会像猪一样可恶，把学生逼到非逃不可，这就不是游戏了。它离真正可怕的事情太近，两个孩子怎么也没法放松下来。
        - id: ch01-b67
          speaker: charlotte
          text: |-
            他简直跟西班牙宗教裁判所一样！现在有正经法律，为什么还不把他关起来？
          emotion: angry
        - id: ch01-b68
          speaker: narrator
          text: |-
            查尔斯和卡罗琳仍有疑心。也许鲁珀特为了替逃跑找借口，故意把事情说得很夸张。对他们来说，这个解释似乎比默德斯通真的坏到那种地步更容易相信。鲁珀特若是显得胆怯又可怜，他们反而会更相信他。偏偏这男孩不是满脸反抗，就是轻松自在，怎么也不像一个受尽欺负的人。
        - id: ch01-b69
          speaker: narrator
          text: |-
            你大概懂那种难受的滋味。你很想对一个人好，却又拿不准他是否可信。你若相信他说的话，还怕自己会冤枉另一个人。这种感觉实在讨厌。你一心想信任眼前的人，却怎么也不能完全放心，几乎没有比这更叫人痛苦的事。鲁珀特一定懂得，也一定看出了另外三个孩子心里的怀疑。他突然把一直藏着的手从口袋里抽了出来。
        - id: ch01-b70
          speaker: rupert
          text: |-
            那你们就看看吧。不过，我不怪你们。这种事确实不像真的。对，就是他干的。第一天晚上，为了牛奶泡面包那件事。等我上床以后，他才过来，拿尺子打的。
        - id: ch01-b71
          speaker: narrator
          text: |-
            原来，鲁珀特手背上有一块青紫的瘀伤，上面还横着一道浅浅的红色擦痕。他嘴里说的“那件事”，就是这些伤。直到刚才，那只手一直藏在口袋里，谁也没有看见。
        - id: ch01-b72
          speaker: charlotte
          text: |-
            就算没看见这个，我也相信你。我知道世上有那样的人，《汤姆叔叔的小屋》里就是。
        - id: ch01-b73
          speaker: narrator
          text: |-
            她的脸颊烧得通红。
        - id: ch01-b74
          speaker: caroline
          text: |-
            我们本来就相信你。谁说不信了？
        - id: ch01-b75
          speaker: charles
          text: |-
            当然相信，这还用说！我们会拿纸、铅笔和信封来，让你写信给父亲。我们一定把你藏好。
        - id: ch01-b76
          speaker: rupert
          text: |-
            好极了！嘘！
        - id: ch01-b77
          speaker: narrator
          text: |-
            大家立刻住了声。鲁珀特抬手指向前方。橡树和忍冬之间露出一小块蓝天，三个孩子的目光顺着他的手指望过去。只见一个穿蓝衣服的人影正沿着车道朝这边走来。
        - id: ch01-b78
          speaker: rupert
          text: |-
            去看看是谁，可别让人发现。
        - id: ch01-b79
          speaker: charlotte
          text: |-
            我去。
        - id: ch01-b80
          speaker: charles
          text: |-
            要是人家问你为什么回屋，你怎么回答？
        - id: ch01-b81
          speaker: charlotte
          text: |-
            我就说替你拿手帕，因为你急着要。你不是一向都急着要手帕吗？
        - id: ch01-b82
          speaker: narrator
          text: |-
            她跑开了。卡罗琳又把自己当成了保护勇士的撒拉逊少女，心里一阵激动。
        - id: ch01-b83
          speaker: caroline
          text: |-
            万一他们真是追你来的呢？我们用树叶和蕨草盖住你。这样往树林里一看，就不会看见你那身花呢衣服。头上也得盖好。你从蕨草下面爬过去，尽量别压坏叶子。
        - id: ch01-b84
          speaker: narrator
          text: |-
            卡罗琳和查尔斯很快用叶子和蕨草把鲁珀特遮严了。等夏洛特回来时，他已经藏得一点也看不见。夏洛特为了迷惑追踪的人，特意绕了远路，从谁也没想到的方向钻进树林，跑得上气不接下气。
        - id: ch01-b85
          speaker: charlotte
          text: |-
            我特意绕了一圈，好把他们引到别处。
        - id: ch01-b86
          speaker: rupert
          text: |-
            他们是谁？
        - id: ch01-b87
          speaker: charlotte
          text: |-
            警察。他们正在打听你，而且一路追到哈德洛了。
        - id: ch01-b88
          speaker: narrator
          text: |-
            夏洛特说得又平静又坦然，心里却完全明白自己带回了多么惊人的消息。鲁珀特躲在树叶底下，一句接一句地追问。
        - id: ch01-b89
          speaker: rupert
          text: |-
            他们在屋里说了什么？
        - id: ch01-b90
          speaker: charlotte
          text: |-
            屋里的人说没见过你，不过警察也许会搜查庄园。
        - id: ch01-b91
          speaker: rupert
          text: |-
            那你说什么了？
        - id: ch01-b92
          speaker: charlotte
          text: |-
            没人问我呀。不过，我可以告诉你。鲁珀特，你先像老鼠一样躺着别动，不会有事的。幸好我们已经把你埋好了。
        - id: ch01-b93
          speaker: rupert
          text: |-
            你到底说了什么？
        - id: ch01-b94
          speaker: narrator
          text: |-
            夏洛特终于要揭开答案了。她想出的计策显然十分成功，脸上亮着掩不住的得意。
        - id: ch01-b95
          speaker: charlotte
          text: |-
            我说，我们会帮他们一起搜！走吧，三个 C，从后面绕过去！他们要找那个逃跑的男孩，我们当然要好好帮忙，而且一定会尽心尽力地找。等他们走了，我们再给你带些吃的来。这次要带真正好吃的东西，不能再只有饼干。你什么也不用担心。三个 C 哪怕死也站在你这边！
