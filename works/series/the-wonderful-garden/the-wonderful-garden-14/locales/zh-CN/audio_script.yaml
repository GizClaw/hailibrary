audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 温暖机敏，带着克制的幽默讲述
        timbre: 清澈柔和
        pace: 从容而富有变化
        pitch: 中音
    caroline:
      display_name: 卡罗琳
      tts:
        delivery: 大方热情，努力摆出长姐的懂事
        timbre: 明亮清脆
        pace: 自然轻快
        pitch: 中高音
    charlotte:
      display_name: 夏洛特
      tts:
        delivery: 活泼直率，想到什么便说什么
        timbre: 轻盈清亮
        pace: 偏快
        pitch: 高音
    charles:
      display_name: 查尔斯
      tts:
        delivery: 淘气认真，笑话总说得一本正经
        timbre: 清亮的男孩声
        pace: 轻快
        pitch: 中高音
    rupert:
      display_name: 鲁珀特
      tts:
        delivery: 直爽开朗，病中说话虚弱而迷糊
        timbre: 清亮的少年声
        pace: 自然，发烧时忽快忽慢
        pitch: 中高音
    uncle_charles:
      display_name: 查尔斯舅舅
      tts:
        delivery: 温和飘忽，偶尔流露出幽微的兴味
        timbre: 轻柔低沉
        pace: 舒缓
        pitch: 中低音
    harriet:
      display_name: 哈丽雅特
      tts:
        delivery: 机灵健谈，带着年轻女佣爽快的口气
        timbre: 清脆明快
        pace: 偏快
        pitch: 中高音
    mineral_woman:
      display_name: 汽水女人
      tts:
        delivery: 朴实直爽，乡间口吻里带着生活磨出的辛劳
        timbre: 略显粗哑的中年女声
        pace: 自然，伤心时断续
        pitch: 中音
  chapters:
    - id: ch01
      title: 第十四章　汽水女人
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: |-
            第二天，鲁珀特觉得身上又有活气了。吃早餐时，他提议大家出去探险。
        - id: ch01-b02
          speaker: rupert
          text: |-
            喂，你们听着。咱们去发现北极怎么样？
        - id: ch01-b03
          speaker: caroline
          text: |-
            那可真不错。你是说阁楼吗？我们还没去那里探过险呢。
        - id: ch01-b04
          speaker: rupert
          text: |-
            不行，阁楼得留到下雨天。
        - id: ch01-b05
          speaker: charles
          text: |-
            你该不会说的是真正的北极吧？
        - id: ch01-b06
          speaker: narrator
          text: |-
            鲁珀特无论说出多奇妙、多冒险的事，查尔斯都完全相信他可能是当真的。
        - id: ch01-b07
          speaker: rupert
          text: |-
            当然不是。我想的是一条“维亚·梅迪亚斯·雷斯”。
        - id: ch01-b08
          speaker: charles
          text: |-
            这是拉丁文。
        - id: ch01-b09
          speaker: rupert
          text: |-
            意思是走中间那条路。你们问问舅舅，能不能让我们带午饭出去。面包、奶酪和蛋糕就够了。请他别等我们喝茶，没准那时也回不来。我们想到哪儿就往哪儿走，看见路牌和邮局就闭上眼睛。就算迷路，我也会照顾你们。
        - id: ch01-b10
          speaker: caroline
          text: |-
            可我们答应过舅舅，一个星期都不打扰他。
        - id: ch01-b11
          speaker: rupert
          text: |-
            那就写封信。
        - id: ch01-b12
          speaker: narrator
          text: |-
            于是卡罗琳提笔写信，大家准备在后面签名。确切地说，信是她一个人写的。她才写下“最最亲爱的舅舅”，查尔斯就看了鲁珀特一眼，想先确定鲁珀特也会赞成自己的意见。
        - id: ch01-b13
          speaker: charles
          text: |-
            “最最亲爱的”真肉麻。写“亲爱的”吧。
        - id: ch01-b14
          speaker: caroline
          text: |-
            “亲爱的”才更肉麻呢。你写信给肉铺老板，说送来的肋排本该属于某某爵士时，就会这样称呼他。我知道。
        - id: ch01-b15
          speaker: narrator
          text: |-
            卡罗琳接着写。他们请求带着午饭在外面过一天，面包、奶酪和蛋糕就够了。鲁珀特说他会照顾大家，请舅舅不必指望他们喝茶以前回来，说不定喝茶时也不会回来。信末写着“爱您的”，下面签了卡罗琳、夏洛特和查尔斯。
        - id: ch01-b16
          speaker: caroline
          text: |-
            鲁珀特不能签。他在信里是“他”，只有那些“我们”才能签名。
        - id: ch01-b17
          speaker: narrator
          text: |-
            哈丽雅特把信送去，舅舅很快回了信。他当然准许孩子们出门，还说相信他们一定记得，不可让路上遇见的任何人内服或外用咒语。他吩咐大家六点半前回来，若有事情耽搁，就拍一封电报。信里附了两先令六便士作临时开销，落款特意写成了“你们最最亲爱的舅舅”。
        - id: ch01-b18
          speakers: [caroline, charlotte]
          ensemble: duo
          text: |-
            舅舅真好。
          emotion: happy
        - id: ch01-b19
          speaker: charles
          text: |-
            “临时开销”是什么开销？
        - id: ch01-b20
          speaker: rupert
          text: |-
            比如你忽然想吃苹果或巧克力，身上却正好没有。也可能想喝姜汁汽水，或者边走边吸一只生鸡蛋。等别的食物全都指望不上时，生鸡蛋特别顶饿。
        - id: ch01-b21
          speaker: narrator
          text: |-
            舅舅一定吩咐过厨房，因为哈丽雅特很快拿来四个包得整整齐齐的牛皮纸包。
        - id: ch01-b22
          speaker: harriet
          text: |-
            这是你们的午饭。今天的天气正适合出游，祝你们一路玩得开心。不管最后去了什么地方，都给我带件纪念品回来，好不好？
        - id: ch01-b23
          speaker: charlotte
          text: |-
            当然好。你想要什么？
        - id: ch01-b24
          speaker: narrator
          text: |-
            哈丽雅特笑了，说自己只是随口讲讲。天气热极了，孩子们都换上最轻薄的衣服，又请威廉给每人削了一根白蜡木手杖。查尔斯说，万一他们忽然想扮成拄着手杖的朝圣者，这些木杖正好用得上。
        - id: ch01-b25
          speaker: narrator
          text: |-
            两个女孩一心想让鲁珀特穿上学校的西装外套。她们夸那件衣服，夸鲁珀特本人，又夸衣服穿在他身上的样子和他穿着衣服的样子，终于把他哄得答应了。查尔斯也穿着自己的校服外套。女孩们穿蓝色薄纱裙，戴柔软的白纱帽。他们扛着白蜡木杖，打结的手帕吊在杖头，里面装着牛皮纸午饭包。沿车道出发时，四个人看上去又鲜亮又凉快。
        - id: ch01-b26
          speaker: charlotte
          text: |-
            今天我们都扮成谁呢？
        - id: ch01-b27
          speaker: charles
          text: |-
            我要当南森。要是还有几条“埃奎斯莫”狗和一架雪橇就好了。
        - id: ch01-b28
          speaker: rupert
          text: |-
            是“爱斯基摩”。
        - id: ch01-b29
          speaker: charles
          text: |-
            我知道。
        - id: ch01-b30
          speaker: rupert
          text: |-
            我才不信你原来知道。
        - id: ch01-b31
          speaker: narrator
          text: |-
            查尔斯红了脸，两个女孩也不自在地互相看着。
        - id: ch01-b32
          speaker: charles
          text: |-
            我没说原来就知道。我第一次讲的时候不知道。你告诉我以后，我现在知道了。书上看着就是“埃奎斯莫”。
        - id: ch01-b33
          speaker: narrator
          text: |-
            这番话叫人没法再怪他。鲁珀特只好捶捶他的背，向他道歉。卡罗琳赶紧岔开话题，问鲁珀特要扮成谁。
        - id: ch01-b34
          speaker: rupert
          text: |-
            当然是鲁珀特亲王。他发明了鲁珀特之泪，那是一种玻璃，只要瞧得太用力就会碎成粉末。他还打过内斯比战役。为了英格兰国王查尔斯，也为了莱茵河的鲁珀特！
        - id: ch01-b35
          speaker: charles
          text: |-
            那你既然当鲁珀特，就让我当查尔斯吧。这样才公平。
        - id: ch01-b36
          speaker: rupert
          text: |-
            不能换来换去。再说，查尔斯后来被砍了头。
        - id: ch01-b37
          speaker: charles
          text: |-
            要这么说，鲁珀特后来也死了呀。你也可能会死，鲁珀特。
        - id: ch01-b38
          speakers: [caroline, charlotte]
          ensemble: duo
          text: |-
            就让他当吧。
        - id: ch01-b39
          speaker: narrator
          text: |-
            两个女孩也替查尔斯说情，鲁珀特只好答应，还说自己并不在乎。夏洛特原想当查尔斯二世，因为他是位快乐君王。可大家觉得有两个查尔斯容易混淆，她只好退一步做圣女贞德，卡罗琳则做布狄卡。
        - id: ch01-b40
          speaker: caroline
          text: |-
            布狄卡是英国人。艾梅琳姨妈说，人应该支持本国产业。
        - id: ch01-b41
          speaker: charlotte
          text: |-
            今天一整天，都得用游戏里的名字叫别人。叫错一次就扣一分。
        - id: ch01-b42
          speaker: charles
          text: |-
            谁来记分？
        - id: ch01-b43
          speaker: charlotte
          text: |-
            各人记各人的，用手指头数。错到十次，就在手帕上打个结。姨妈们要是常玩，一天会错十次。我们不会。
        - id: ch01-b44
          speaker: narrator
          text: |-
            布狄卡、圣女贞德、鲁珀特亲王和查尔斯国王走出门房的大门，探险队在十点十七分准时启程。三个C始终认真玩着，频频使用新名字，每一次都叫得准确。鲁珀特却越来越沉默。夏洛特郑重地叫他“清白无瑕的骑士鲁珀特亲王”时，他反倒叫她别犯傻。
        - id: ch01-b45
          speaker: narrator
          text: |-
            十二点一刻，四个孩子终于来到一处铁路平交道。他们浑身是土，热得厉害，也颇有些疲倦。火车就要来了，栏门已经关闭。沿着铁轨望去，远处的火车头越来越大、越来越黑，喷出的蒸汽越来越白、越来越蓬松。人靠在栏门上，还能感觉到它随着火车逼近而颤动。
        - id: ch01-b46
          speaker: narrator
          text: |-
            火车喷着气，喘着息，匆匆停在栏门旁边的小站。几位乘客下了车，它又不耐烦地抖抖身子，尖叫一声，继续开走。横在公路上的大栏门慢慢转回去，最后横在铁路两侧。下车的人沿月台的斜坡走下来，穿过小转门。四个孩子正要横过铁轨，半路上和他们迎面相逢。
        - id: ch01-b47
          speaker: narrator
          text: |-
            那群人里有两个挎篮子的女人，一个牵着罗圈腿小狗的男人，还有一个姑娘。姑娘抱着一只半裹在牛皮纸里的大帽盒。紧接着，四个孩子突然看见了最不愿碰见的人。那列火车上竟然下来了那个默德斯通。等他们发觉时，双方已经脸对脸，彼此还不到一码远。
        - id: ch01-b48
          speaker: narrator
          text: |-
            鲁珀特猛地昂起头，往后退了一点，像是料定会挨打。三个C同时深吸一口气，“噢”了一声，浑身发抖地等着不知什么事情发生。谁也不知道默德斯通先生究竟有多大权力。他会不会抓住鲁珀特，把他带走？会不会叫警察？孩子们突然撞见这个可恨的老师，又没有退路。那一刻，仿佛什么事都可能发生。
        - id: ch01-b49
          speaker: narrator
          text: |-
            可是什么也没发生。默德斯通就这样从他们身边走了过去。他只是冷冰冰、酸溜溜地扫了三个C一眼，眼神里没有半点认识他们的意思。他根本没看鲁珀特，只从他的头顶望过去，仿佛那里从来没有这个人，然后走远了。
        - id: ch01-b50
          speaker: narrator
          text: |-
            默德斯通走远以后，鲁珀特的脸涨得通红，却一句话也没有说。两个女孩彼此对望了一眼。
        - id: ch01-b51
          speaker: caroline
          text: |-
            咱们沿河走。走起来以后，我们就告诉你他为什么没看你。
        - id: ch01-b52
          speaker: rupert
          text: |-
            现在就说。不然我一步也不走。
        - id: ch01-b53
          speaker: charlotte
          text: |-
            他没看你，是因为根本没瞧见你。你刚好在最想隐身的时候隐形了。
        - id: ch01-b54
          speaker: rupert
          text: |-
            我并没想隐身。至少……唉，好吧，走吧。
        - id: ch01-b55
          speaker: narrator
          text: |-
            他们继续往前走，来到一片绿色草地。草坡舒舒服服地缓缓伸向梅德韦河边，河岸边生着一排垂柳。
        - id: ch01-b56
          speaker: charlotte
          text: |-
            你在他眼里真的隐形了。这就是魔法。现在你总该相信咒语了吧？
        - id: ch01-b57
          speaker: rupert
          text: |-
            可根本没有什么咒语。
        - id: ch01-b58
          speakers: [caroline, charlotte]
          ensemble: duo
          text: |-
            你脱下外套看看。
        - id: ch01-b59
          speaker: rupert
          text: |-
            我讨厌装神弄鬼。
        - id: ch01-b60
          speaker: narrator
          text: |-
            鲁珀特嘴上说讨厌装神弄鬼，到底还是脱下了外套。卡罗琳翻开做纽扣眼的那条松松的衣襟，指给他看藏在里面的蕨籽。
        - id: ch01-b61
          speaker: caroline
          text: |-
            我和夏尔趁你跟查尔斯洗手时，用万能胶粘上去的。我们本想等进了商店，再请你许愿隐身，好证明咒语是真的。可不用我们开口，你自己就做到了。现在你总肯相信了吧？
        - id: ch01-b62
          speaker: rupert
          text: |-
            我就是没法相信。别再说了，把吃的拿出来吧。
        - id: ch01-b63
          speaker: narrator
          text: |-
            他们打开纸包，把吃的全拿了出来。里面有三明治、面对面叠着的果酱馅饼和饼干。鲁珀特那包里还有一只旧巧克力纸盒，装着覆盆子。最后是切得很大块的蛋糕，又结实又可口。如今，只有那些不知道发酵粉和自发面粉是什么的老式人家，偶尔还吃得到这种蛋糕。
        - id: ch01-b64
          speaker: caroline
          text: |-
            这是我们第一次自己出来野餐。你喜欢吗，鲁珀特亲王？
        - id: ch01-b65
          speaker: narrator
          text: |-
            鲁珀特嘴里正塞满了三明治，没法把话说清楚。大家听了一阵，认为他大概是在说这次野餐“还不错”。
        - id: ch01-b66
          speaker: charles
          text: |-
            查尔斯国王仁慈地表示喜欢。天气这么渴人，布狄卡最好把莱茵葡萄酒倒出来。
        - id: ch01-b67
          speaker: caroline
          text: |-
            噢，我们没带！
          emotion: surprised
        - id: ch01-b68
          speaker: narrator
          text: |-
            他们真的什么也没带。一滴牛奶，一滴水，一滴姜汁汽水，任何能喝的东西都没有。艾梅琳姨妈的外甥和外甥女，绝不会鲁莽到去喝一条还没经过正式介绍的陌生河流里的水。大家只能吃覆盆子，假装覆盆子能解渴。你多半早就知道，那东西根本不能解渴。
        - id: ch01-b69
          speaker: narrator
          text: |-
            等所有食物都吃光了，他们把碎纸深深埋进一棵空心树。这样就不会破坏绿柳、蓝绿色河水和草绿色青草组成的美丽景色。接着，他们动身去找一间出售姜汁汽水的小屋。来时路上，他们正好经过这样一间。
        - id: ch01-b70
          speaker: narrator
          text: |-
            小屋有个整洁明快的小花园，黄玫瑰攀上门廊。一面红砖墙上长着梨树，横生的枝条贴墙往上伸，像一架双层梯子。另一面墙钉着深蓝铁牌，清楚的白字写着“贝泰斯矿物饮料”。要是有位从维多利亚女王早年穿越而来的陌生人看见它，也许会以为小屋有座收藏地质标本的小博物馆，就像德比郡偶尔能见到的那种。孩子们却知道，“矿物饮料”只是姜汁汽水和其他冒泡饮料的简称。
        - id: ch01-b71
          speaker: narrator
          text: |-
            孩子们先仔细确认舅舅给的两先令六便士没有在路上丢掉，这才打开小屋那扇白色栅栏门，走进了花园。
        - id: ch01-b72
          speaker: narrator
          text: |-
            绿色前门没有门环，正敞开着，从门外一眼就能望进前厅。屋里十分整洁，到处铺着油布。粉红毛线垫上放着贝壳，旁边摆着卷曲的玻璃花瓶，壁炉台上的绿脸大钟滴答声响得不得了。还有一张马鬃沙发和数不清的白色钩针椅背罩，连最体面的海滨出租屋也未必摆得下这么多。
        - id: ch01-b73
          speaker: narrator
          text: |-
            窗边摆满一盆盆天竺葵，一只黑白花猫挤在花盆之间，躺在阳光里睡得正香。总之，这是一间清清爽爽、再典型不过的英格兰乡间小屋。这样的屋子矗立在那里，多么美丽！
        - id: ch01-b74
          speaker: narrator
          text: |-
            口渴的孩子客客气气地等着，一直等到实在受不了。卡罗琳才踮着脚走过一尘不染的棕蓝色油毡，轻轻敲了敲里屋的门。没有任何动静。她把虚掩的门再推开一点，探头看了进去。随后，她转身摇摇头，向大家打了个难懂的手势，叫他们留在原地。自己穿过那道门，又把门关上了。
        - id: ch01-b75
          speaker: narrator
          text: |-
            其余三个人只好等在那里。卡罗琳刚才用的是他们约好的秘密手势，只有碰上真正严重的紧急情况时才会使用。
        - id: ch01-b76
          speaker: charles
          text: |-
            里头大概有只鸟，她想抓住它。
        - id: ch01-b77
          speaker: narrator
          text: |-
            另外两个人不相信，而且他们是对的。没多久，卡罗琳托着一只起皱的黑托盘回来。盘里有三瓶柠檬汽水、三只玻璃杯，还有一个圆圆的小木塞。喝这种汽水时，就用它把玻璃珠压进瓶颈里。
        - id: ch01-b78
          speaker: caroline
          text: |-
            拿着。你们绕到屋后去，那里有座鹅耳枥凉亭，还有长凳和桌子，你们尽管坐。我待会儿再告诉你们。快拿走，快去呀。
        - id: ch01-b79
          speaker: rupert
          text: |-
            到底出了什么事？
        - id: ch01-b80
          speaker: caroline
          text: |-
            她哭得厉害极了。我还不知道出了什么事。噢，你们快走吧。
        - id: ch01-b81
          speaker: narrator
          text: |-
            卡罗琳把托盘硬塞给鲁珀特，摆出一副身负重任的神气，又穿过门回去了。那副神气连同伴们也觉得稍微有点难受。不过他们既口渴，又讲义气，还是照她说的去做。他们找到鹅耳枥凉亭，在漆成蓝色的长凳上坐下，一边喝柠檬汽水，一边互相诉说方才有多渴。每喝几大口，大家就深深喘口气，趁机再说上一遍。
        - id: ch01-b82
          speaker: narrator
          text: |-
            与此同时，卡罗琳待在陌生小屋的后厨里。一个素不相识的女人坐在那儿，两肘撑着轧衣机，双手捧着头，只顾哭呀，哭呀，不停地哭。卡罗琳在旁边轻轻拍着她的肩膀。
        - id: ch01-b83
          speaker: caroline
          text: |-
            别哭。噢，求求你别哭了！
        - id: ch01-b84
          speaker: mineral_woman
          text: |-
            走开吧。我没空招呼你。走开！
          emotion: sad
        - id: ch01-b85
          speaker: narrator
          text: |-
            女人年纪已经不轻，深色头发里夹着灰丝，在脑后紧紧绾成发髻。她高高挽着袖子，周围堆满了运送柠檬汽水和姜汁汽水的方木箱，每只箱子里面都有木格。绿色瓶子零零落落插在箱里，有的满着，有的空着。箱子到处都是，水槽上、水槽下、煮衣锅上、砖地上，一直堆到敞开的后门外面。
        - id: ch01-b86
          speaker: caroline
          text: |-
            别哭了。告诉我出了什么事吧，说不定我能帮你。
        - id: ch01-b87
          speaker: mineral_woman
          text: |-
            噢，你快走吧。你像是个好心的小姑娘，可这事没用。走吧，小乖乖。
          emotion: sad
        - id: ch01-b88
          speaker: caroline
          text: |-
            可你要是不哭了，我怎么付柠檬汽水的钱？你说过我可以拿的，一共三瓶。
        - id: ch01-b89
          speaker: mineral_woman
          text: |-
            六便士。
          emotion: sad
        - id: ch01-b90
          speaker: caroline
          text: |-
            你真可怜。好了，你就当我是自己的小女儿，把出了什么事告诉我吧。
        - id: ch01-b91
          speaker: narrator
          text: |-
            卡罗琳一边安慰她，一边伸手搂住她的脖子。女人终于转过脸来，亲了亲这个素不相识却一心想帮助她的小姑娘。
        - id: ch01-b92
          speaker: mineral_woman
          text: |-
            愿上帝保佑你这个傻乎乎的小鸭子。我自己的闺女在汤布里奇那边做女佣。我这样哭哭啼啼是够傻的，可事情来得太突然了。
          emotion: sad
        - id: ch01-b93
          speaker: caroline
          text: |-
            什么事？告诉我吧。说不定我能帮忙。要是你缺钱，我舅舅一定肯给我钱来帮你。而且，我有时真的能让好事发生。
        - id: ch01-b94
          speaker: mineral_woman
          text: |-
            不是钱的事。我也不知道为什么要告诉你。
          emotion: sad
        - id: ch01-b95
          speaker: caroline
          text: |-
            说出来心里会好受。我姨妈说会的。告诉我吧，你这样难过，我心里也很不好受。
        - id: ch01-b96
          speaker: mineral_woman
          text: |-
            你不会明白。我知道自己这样挺傻，可我今天早晨才听到消息。刚才整理瓶子时，事情忽然全压到心头，我一下子再也撑不住了。你瞧，我就在这间小屋里出生，一辈子都住在这儿。如今却要离开！还只给我一个星期！我能去哪儿？往后的日子怎么办？又靠什么养活自己？
          emotion: sad
        - id: ch01-b97
          speaker: mineral_woman
          text: |-
            这屋子正好就在大路边，路过的客人口渴了，全都会来我这里。我还能搬到哪儿？赖特农场后面倒有间小屋，可那里连一小块花园都没有，一年到头也不会有人经过。就算我在那里活到一百岁，也卖不掉一瓶饮料。
          emotion: sad
        - id: ch01-b98
          speaker: caroline
          text: |-
            可你为什么非离开这里不可？
        - id: ch01-b99
          speaker: mineral_woman
          text: |-
            都是那些有钱人家！他们自己在伦敦已经有一座大宅子，却偏偏看中了我的这一点地方。就因为我亲手种的花把小屋衬得漂亮，因为我父亲搭了这座凉亭，还因为这些玫瑰是我舅舅从剑桥郡送来的。
          emotion: angry
        - id: ch01-b100
          speaker: mineral_woman
          text: |-
            他们说：“周末来住，这间小屋多甜美、多漂亮！”我呢，倒可以搬进济贫院，一个星期又一个星期地住下去，反正他们才不在乎。《圣经》里有件差不多的事。可如今再也没有从前那样的先知，去斥责那些抢走穷人的葡萄园和小羊羔之类、拿去改成周末小屋的人。
          emotion: angry
        - id: ch01-b101
          speaker: mineral_woman
          text: |-
            他们当然付得起钱，想要什么都能买。可这对我实在太狠心了，亲爱的。事情就是这样，现在你全知道了。
          emotion: sad
        - id: ch01-b102
          speaker: caroline
          text: |-
            这太可怕了。地主一定是个坏透了的人。
        - id: ch01-b103
          speaker: mineral_woman
          text: |-
            这不是地主本人做的。说到底，他还只是个小伙子，再过一两个星期才成年，也就是说，他从来没真正做过自己的主人。替他管理产业的是他的表兄。那个人满脑子只想从我们身上多榨一两个先令，这里刮一点，那里刮一点，走到哪儿都一样。
        - id: ch01-b104
          speaker: mineral_woman
          text: |-
            大概是为了少爷成年时搭彩门、挂旗子吧。你现在明白了，你帮不上忙。走吧，小乖乖。你肯为这件事操心，真是个好姑娘，也是唯一肯操心的人。放心，你的好心一定会回到自己身上。好话不会白说，好事也不会白做。再见了，小姐。
        - id: ch01-b105
          speaker: caroline
          text: |-
            再见。不过我可不敢肯定自己什么也做不了。我要去问舅舅。说不定他认识那位爵爷，不管他是谁。
        - id: ch01-b106
          speaker: mineral_woman
          text: |-
            安多尔。可这附近没人认识他。他从小胸口弱，出国受教育去了。不过这事没用，小乖乖。我非走不可，就像以前那些人一样。
          emotion: sad
        - id: ch01-b107
          speaker: caroline
          text: |-
            我一定会想出办法，你等着瞧。我不但有舅舅，还有姨妈。她说过，人可以让事情发生。你只管不停地对自己说：“一切都会好起来。我不再担心。”这样一来，一切真的会好起来。你会看到的。明天或后天我还会来看你。再见，亲爱的。
        - id: ch01-b108
          speaker: narrator
          text: |-
            卡罗琳亲了亲女人，付过那三瓶柠檬汽水的六便士，随后走到鹅耳枥凉亭。她神情郑重，像是真的肩负起了一项使命。
        - id: ch01-b109
          speaker: caroline
          text: |-
            走吧，我们边走边说。不，我现在不渴。噢，好吧，既然你们给我留了一点。你们真够朋友。
        - id: ch01-b110
          speaker: narrator
          text: |-
            她接过伙伴们特意留下的汽水，喝了几口。喝完以后，卡罗琳的神情一下又严肃起来。
        - id: ch01-b111
          speaker: caroline
          text: |-
            现在一分钟也不能耽搁了。这件事关系到汽水女人的生死。快走吧。
        - id: ch01-b112
          speaker: narrator
          text: |-
            四个孩子离开那间开满鲜花的小屋，沿着尘土飞扬的道路一路往回走。一路上，卡罗琳把自己在后厨听到的事情从头到尾十分仔细地讲给大家听。
        - id: ch01-b113
          speaker: caroline
          text: |-
            我必须立刻问舅舅认不认识安多尔勋爵。他可以像上次给印度拍电报那样，给勋爵发电报。这样一切都会好起来。
        - id: ch01-b114
          speaker: charlotte
          text: |-
            可我们答应过，无论什么事都不打扰舅舅。要是喝茶时他不露面呢？
        - id: ch01-b115
          speaker: caroline
          text: |-
            那就得想别的办法。这是我有机会去做的最真实的一件事。当然，除了你，鲁珀特。要是找不到舅舅，我们就试一道咒语。我们试过的每一道咒语最后都灵验了。先是蕨籽，后来又是……
        - id: ch01-b116
          speaker: rupert
          text: |-
            对，我知道。拿它当游戏玩没什么，可这是一件真正的事。我的教父是位从男爵。我会请他去上议院，把这件事告诉安多尔勋爵。直接向恺撒本人申诉，你们懂吧。这个主意怎么样？
        - id: ch01-b117
          speaker: charlotte
          text: |-
            好呀，快写。不过咒语也照样施。就像画里那个盲眼姑娘，我们不妨给竖琴多安一根弦。该用什么咒语？
        - id: ch01-b118
          speaker: caroline
          text: |-
            我们去书里查。鲁珀特，要是我们成功了，她没有被赶出去，你就会相信咒语了，对不对？
        - id: ch01-b119
          speaker: rupert
          text: |-
            我尽量相信。不管怎样，我会写信给教父。只是他人在挪威，也许我最好拍电报？
        - id: ch01-b120
          speaker: charles
          text: |-
            那得花好几英镑吧？
        - id: ch01-b121
          speaker: rupert
          text: |-
            没关系。威尔明顿太太会先把钱借给我，等我领到零用钱再还。既然已经动手，就该把事情好好办到底。反正有句话说，偷一只羊和偷一只羊羔是一样的。
        - id: ch01-b122
          speaker: charlotte
          text: |-
            是偷一头牛才对。没错，反正都一样要绞死。
