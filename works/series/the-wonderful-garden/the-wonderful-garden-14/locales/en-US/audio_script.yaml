        pace: unhurried
        pitch: medium-low
  chapters:
    - id: ch01
      title: The Mineral Woman
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: The next morning Rupert announced that he felt much more alive. Over breakfast, he proposed an expedition to discover the North Pole.
        - id: ch01-b02
          speaker: caroline
          text: That would be lovely. Do you mean the attics? We've never explored those.
        - id: ch01-b03
          speaker: rupert
          text: No. Attics are for rainy days.
        - id: ch01-b04
          speaker: charles
          text: You don't mean the real North Pole, do you?
        - id: ch01-b05
          speaker: narrator
          text: Charles was quite prepared to believe that Rupert might mean anything, however astonishing or adventurous.
        - id: ch01-b06
          speaker: rupert
          text: No. I was thinking of a via medias res.
        - id: ch01-b07
          speaker: charles
          text: That's Latin.
        - id: ch01-b08
          speaker: rupert
          text: It means a middle way. Ask your uncle if we can take lunch with us. Bread, cheese, and cake will do. Tell him not to expect us before tea, and perhaps not even then. We'll wander wherever we please and close our eyes whenever we pass a signpost or a post office. We may get lost, but I'll look after you.
        - id: ch01-b09
          speaker: caroline
          text: We promised not to disturb Uncle for a week.
        - id: ch01-b10
          speaker: rupert
          text: Then write him a letter.
        - id: ch01-b11
          speaker: narrator
          text: So they composed one. Caroline held the pen, and all three cousins were to sign it.
        - id: ch01-b12
          speaker: caroline
          text: Dearest Uncle—
        - id: ch01-b13
          speaker: charles
          text: Dearest is rot. Put Dear.
        - id: ch01-b14
          speaker: narrator
          text: Charles looked at Rupert to make sure Rupert agreed.
        - id: ch01-b15
          speaker: caroline
          text: Dear is even rottener. That's what you write to the butcher when the ribs ought to have been Sir Something. I know.
        - id: ch01-b16
          speaker: caroline
          text: Please may we go out for the day and take our lunch? Bread and cheese and cake will do. Rupert says he'll look after us. Please don't expect us home until tea, and perhaps not even then. With love, Caroline, Charlotte, and Charles.
        - id: ch01-b17
          speaker: caroline
          text: Rupert can't sign. He's the “he” in the letter, and only the “we” people can put their names down.
        - id: ch01-b18
          speaker: narrator
          text: Harriet carried the note away. Before long, Uncle Charles sent back his answer.
        - id: ch01-b19
          speaker: uncle_charles
          text: By all means. I trust you will remember not to give any spells, inside or out, to anyone you meet. Be home by half past six. If something delays you, send a telegram. I enclose two shillings and sixpence for incidental expenses. Your dearest Uncle.
        - id: ch01-b20
          speakers: [caroline, charlotte]
          ensemble: duo
          text: How sweet of him!
        - id: ch01-b21
          speaker: charles
          text: What are incidental expenses?
        - id: ch01-b22
          speaker: rupert
          text: Things you suddenly need when you haven't brought them. An apple, or some chocolates, or ginger beer. Or raw eggs to suck while you walk. They're very sustaining when every other kind of food has failed.
        - id: ch01-b23
          speaker: narrator
          text: Uncle Charles must have given instructions, because Harriet soon appeared with four tidy parcels wrapped in brown paper.
        - id: ch01-b24
          speaker: harriet
          text: Here are your lunches. I hope you have a grand time. You've got a fine day for it. Bring me a little keepsake, won't you, from wherever you end up?
        - id: ch01-b25
          speaker: charlotte
          text: Of course. What would you like?
        - id: ch01-b26
          speaker: narrator
          text: Harriet laughed and said she had only been talking. Since the day was very hot, the children put on their lightest clothes. William cut them ash sticks because Charles thought they might decide to be pilgrims with staffs. The girls praised Rupert's school blazer, Rupert himself, and the splendid effect of the two together until he agreed to wear it. Charles wore his own blazer. Caroline and Charlotte wore blue muslin dresses with soft white hats.
        - id: ch01-b27
          speaker: narrator
          text: They looked bright and cool as they set off down the drive. Each carried an ash stick over one shoulder, with a lunch parcel tied in a knotted handkerchief swinging from the end.
        - id: ch01-b28
          speaker: charlotte
          text: Who are we going to be?
        - id: ch01-b29
          speaker: narrator
          text: They had just entered the shade of the woods, where the road led toward the lodge gate.
        - id: ch01-b30
          speaker: charles
          text: I'll be Nansen. I wish we had Equismo dogs and a sledge.
        - id: ch01-b31
          speaker: rupert
          text: It's Eskimo.
        - id: ch01-b32
          speaker: charles
          text: I know.
        - id: ch01-b33
          speaker: rupert
          text: I don't believe you did.
        - id: ch01-b34
          speaker: narrator
          text: Charles went red, and the girls exchanged uncomfortable looks.
        - id: ch01-b35
          speaker: charles
          text: I didn't say I knew when I first said it. I mean I know now because you've told me. It looked like Equismo in the books.
        - id: ch01-b36
          speaker: narrator
          text: That answer took all the fight out of Rupert. He thumped Charles on the back and apologized.
        - id: ch01-b37
          speaker: caroline
          text: And who will you be, Rupert?
        - id: ch01-b38
          speaker: rupert
          text: Rupert, of course. Prince Rupert. He invented Prince Rupert drops. They're glass, and they crumble into powder if you look at them too hard. He fought at Naseby too. Rupert of the Rhine! “For Charles, King of England, and Rupert of the Rhine!”
        - id: ch01-b39
          speaker: charles
          text: Oh, let me be Charles if you're Rupert. That's only fair.
        - id: ch01-b40
          speaker: rupert
          text: You can't keep changing. Besides, Charles had his head cut off later.
        - id: ch01-b41
          speaker: charles
          text: Rupert died too, if it comes to that. You might die, Rupert.
        - id: ch01-b42
          speakers: [caroline, charlotte]
          ensemble: duo
          text: Oh, do let him.
        - id: ch01-b43
          speaker: narrator
          text: Rupert gave in and said he did not mind. Charlotte wanted to be Charles the Second because he was a merry monarch. Two Charleses would be confusing, so she settled for Joan of Arc. Caroline chose Boadicea.
        - id: ch01-b44
          speaker: caroline
          text: Boadicea was British, you see. Aunt Emmeline says we ought to support home industries.
        - id: ch01-b45
          speaker: charlotte
          text: We must use our play names all day. Every time you make a mistake, you lose a mark.
        - id: ch01-b46
          speaker: charles
          text: Who keeps the marks?
        - id: ch01-b47
          speaker: charlotte
          text: Everyone keeps their own on their fingers. If you make ten mistakes, tie a knot in your handkerchief. Aunts reach ten if they play often. We don't.
        - id: ch01-b48
          speaker: narrator
          text: Boadicea, Joan of Arc, Prince Rupert, and King Charles passed through the lodge gate. Their expedition officially began at exactly seventeen minutes past ten. The three cousins used the new names often and correctly. Rupert, though, became quieter and quieter. When Charlotte called him Prince Rupert the stainless knight, he told her not to be silly.
        - id: ch01-b49
          speaker: narrator
          text: At a quarter past twelve, dusty, hot, and rather tired, the four children reached a railway crossing. The gates were closed. Far down the track, the engine grew larger and blacker. Its steam billowed whiter and thicker, and the gate shivered beneath their hands as the train approached.
        - id: ch01-b50
          speaker: narrator
          text: The train stopped at the little station beside the crossing, snorting and panting in a hurry. A few passengers got out. Then the train shook impatiently, screamed, and rushed away. The road gates slowly swung open. As the children crossed the tracks, they met the passengers coming down from the platform.
        - id: ch01-b51
          speaker: narrator
          text: There were two women carrying baskets, a man with a bandy-legged dog, and a girl whose large bandbox was partly wrapped in brown paper. Then, before the children had any warning, they found themselves face to face with the one passenger they least wanted to meet. It was the Murdstone man, Rupert's hated schoolmaster.
        - id: ch01-b52
          speaker: narrator
          text: He stood less than a yard away. Rupert lifted his head and stepped backward as though he expected a blow. Caroline, Charlotte, and Charles breathed one deep “Oh!” together. They trembled while every dreadful possibility flashed through their minds. Could the master seize Rupert and carry him away? Could he summon the police? No one knew what power he might have.
        - id: ch01-b53
          speaker: narrator
          text: Then nothing happened. The Murdstone man walked straight past. He gave the three cousins one cold, sour glance without recognizing them. He never looked at Rupert at all. His eyes passed over Rupert's head as if there were nobody there.
        - id: ch01-b54
          speaker: narrator
          text: Rupert's face turned very red, but he said nothing. The girls looked at each other.
        - id: ch01-b55
          speaker: caroline
          text: Let's go along the river. Then we'll explain why he didn't look at you.
        - id: ch01-b56
          speaker: rupert
          text: Tell me now, or I won't take another step.
        - id: ch01-b57
          speaker: charlotte
          text: He didn't look because he couldn't see you. You went invisible at the exact moment you needed to.
        - id: ch01-b58
          speaker: rupert
          text: I didn't need to. At least—oh, never mind. Come on.
        - id: ch01-b59
          speaker: narrator
          text: They reached a green meadow that sloped gently toward the River Medway, with willows fringing the water.
        - id: ch01-b60
          speaker: charlotte
          text: You really were invisible to him. That's the magic. Surely you'll believe in spells now.
        - id: ch01-b61
          speaker: rupert
          text: But nobody worked a spell.
        - id: ch01-b62
          speakers: [caroline, charlotte]
          ensemble: duo
          text: Take off your blazer and look.
        - id: ch01-b63
          speaker: rupert
          text: I hate all this hanky-panky.
        - id: ch01-b64
          speaker: narrator
          text: Still, Rupert removed the coat. Caroline folded back the loose strip of cloth behind the buttonholes.
        - id: ch01-b65
          speaker: caroline
          text: There it is. Fern seed. Charlotte and I glued it in while you and Charles were washing your hands. We meant to have you wish to be invisible when we went into a shop, so we could prove the spells worked. But you did it before we even asked. You believe us now, don't you?
        - id: ch01-b66
          speaker: rupert
          text: I can't. Don't say any more about it. Let's get the food out.
        - id: ch01-b67
          speaker: narrator
          text: They opened the parcels. There were sandwiches, jam tarts packed face to face, biscuits, and thick wedges of the solid cake still baked in old-fashioned houses. Rupert's parcel also held raspberries in a cardboard box that had once contained chocolates.
        - id: ch01-b68
          speaker: caroline
          text: This is the first picnic we've ever had on our own. Don't you like it, Prince Rupert?
        - id: ch01-b69
          speaker: narrator
          text: Rupert's mouth was full of sandwich, but they understood him to say it was all right.
        - id: ch01-b70
          speaker: charles
          text: King Charles is graciously pleased with it. Boadicea had better pour the Rhine wine. This is thirsty weather.
        - id: ch01-b71
          speaker: caroline
          text: Oh! There isn't any!
        - id: ch01-b72
          speaker: narrator
          text: There was not one drop of milk, water, ginger beer, or anything else they could drink. No niece or nephew of Aunt Emmeline would risk drinking from a strange river before being properly introduced to it. They ate the raspberries and pretended those would cure their thirst. As anyone who has tried it knows, raspberries do nothing of the kind.
        - id: ch01-b73
          speaker: narrator
          text: When every crumb was gone, they buried the waste paper deep inside a hollow tree. They would not spoil the lovely scene of green willows, blue-green water, and grass-green grass. Then they set off to find a cottage where they could buy ginger beer. They remembered passing one along the road.
        - id: ch01-b74
          speaker: narrator
          text: The cottage had a cheerful little garden, a yellow rose climbing over the porch, and a pear tree trained against one red-brick wall in level branches like a double ladder. A deep-blue iron sign on the other wall read “Bateyes Minerals.” Someone from the early years of Queen Victoria might have expected a collection of rocks inside. The children knew that “minerals” simply meant ginger beer and other fizzy drinks.
        - id: ch01-b75
          speaker: narrator
          text: They checked that their two shillings and sixpence were safe, opened the white gate, and went in. The green front door had no knocker and stood wide open. Beyond it was a very neat parlor with oilcloth on the floor. Seashells rested on pink wool mats. Curly glass vases and a clock with a loud green face stood on the mantelpiece. White crocheted covers seemed to lie everywhere, even across the horsehair sofa. A black-and-white cat slept in the sunny window among pots of geraniums. It was a spotless example of a beautiful English cottage home.
        - id: ch01-b76
          speaker: narrator
          text: The thirsty visitors waited politely for as long as they could bear. At last Caroline tiptoed over the perfectly clean brown-and-blue linoleum and knocked on the inner door. No one answered. She pushed it a little farther open and peered through. Then she turned, shook her head, and gave the others a secret signal used only in the most serious emergencies. She slipped through and closed the door behind her.
        - id: ch01-b77
          speaker: charles
          text: I expect there's a bird in there, and she wants to catch it.
        - id: ch01-b78
          speaker: narrator
          text: The others did not believe that, and they were right. Soon Caroline came back carrying a wrinkled black tray. On it stood three bottles of lemonade, three glasses, and the little wooden tool used to press the glass marble down into each bottle's neck.
        - id: ch01-b79
          speaker: caroline
          text: Take this round the other side of the cottage. There's a hornbeam arbor with a table and a bench, and you're very welcome to sit there. I'll explain later. Please, just take it and go.
        - id: ch01-b80
          speaker: rupert
          text: But what has happened?
        - id: ch01-b81
          speaker: caroline
          text: She's crying terribly. I don't know why yet. Oh, please go.
        - id: ch01-b82
          speaker: narrator
          text: She pushed the tray into Rupert's hands and hurried back through the door. Her air of importance was just a little trying, even to her friends. Still, they were both loyal and desperately thirsty. They found the arbor, settled on its blue-painted benches, and drank the lemonade. Between long swallows, each kept saying how terribly thirsty they had been.
        - id: ch01-b83
          speaker: narrator
          text: Meanwhile, Caroline stood in the back kitchen, gently patting the shoulder of a woman she had never met. The woman sat with her elbows on the mangle and her face in her hands, sobbing and sobbing.
        - id: ch01-b84
          speaker: caroline
          text: Please don't cry. Oh, please don't.
        - id: ch01-b85
          speaker: mineral_woman
          text: Go away. I can't see to you now. Please go away.
          emotion: sad
        - id: ch01-b86
          speaker: narrator
          text: The woman was middle-aged. Grey streaked her dark hair, which was twisted into a tight knot, and her sleeves were rolled up. Wooden crates for lemonade and ginger beer stood all around her. Some of their greenish bottles were full and others empty. Crates covered the sink, the space beneath it, the copper, the bricks, and even the ground outside the open back door.
        - id: ch01-b87
          speaker: caroline
          text: Tell me what's wrong. I might be able to help. Please don't cry.
        - id: ch01-b88
          speaker: narrator
          text: Caroline spoke so soothingly that she might have calmed an angry bear.
        - id: ch01-b89
          speaker: mineral_woman
          text: Oh, run along, do. You're a kind little girl, but there's no use in it. Off you go, dearie.
          emotion: sad
        - id: ch01-b90
          speaker: narrator
          text: She tried to dry her eyes on the corner of her blue-checked apron.
        - id: ch01-b91
          speaker: caroline
          text: But if you won't stop crying, how can I pay for the lemonade you let me take? It was three bottles.
        - id: ch01-b92
          speaker: mineral_woman
          text: Sixpence.
        - id: ch01-b93
          speaker: caroline
          text: You poor dear.
        - id: ch01-b94
          speaker: narrator
          text: Caroline put her arms around the woman's neck.
        - id: ch01-b95
          speaker: caroline
          text: Just pretend I'm your own little girl, and tell me what's happened.
          emotion: calm
        - id: ch01-b96
          speaker: narrator
          text: The woman turned and kissed her.
        - id: ch01-b97
          speaker: mineral_woman
          text: Bless you, you silly little duck. My own girl is in service over Tonbridge way. I know I shouldn't carry on so, but the news came all at once.
          emotion: sad
        - id: ch01-b98
          speaker: caroline
          text: What news? Please tell me. Maybe I can help. My uncle would give me money for you, if money is what you need. And sometimes I really can make good things happen.
        - id: ch01-b99
          speaker: mineral_woman
          text: It isn't money, and I don't know why I'd tell you.
          emotion: sad
        - id: ch01-b100
          speaker: caroline
          text: My aunt says talking eases your heart. Please tell me. I'm so sorry you're unhappy.
        - id: ch01-b101
          speaker: mineral_woman
          text: You wouldn't understand. I only heard this morning. It all came over me just now while I was sorting the bottles. I was born in this little house, and I've lived here all my life. Now I have to leave, with only a week's notice. Where can I go? How will I manage? How am I to earn my living?
          emotion: sad
        - id: ch01-b102
          speaker: mineral_woman
          text: This place stands right on the highroad, so every thirsty traveler comes by me. There's a cottage behind Wright's farm, but it hasn't a scrap of garden, and no one passes it from one year's end to the next. I could live there to be a hundred and never sell one bottle.
          emotion: sad
        - id: ch01-b103
          speaker: caroline
          text: Why are they making you leave this house?
        - id: ch01-b104
          speaker: mineral_woman
          text: Gentlefolk. They've a grand house of their own in London, but they've taken a fancy to my little place. They think it looks pretty because of the flowers I planted, the arbor my father built, and the roses my mother's brother sent from Cambridgeshire.
          emotion: angry
        - id: ch01-b105
          speaker: mineral_woman
          text: They call it a sweet cottage for their weekends. I may go to the Union and stay there week after week, for all they care. The Bible tells of things like this. But there aren't prophets now to rebuke people who take a poor person's vineyard or lamb just to make themselves a weekend cottage. They can pay for whatever they fancy, of course. It comes hard, my dear. That's the whole of it. Now you know.
          emotion: angry
        - id: ch01-b106
          speaker: caroline
          text: That's dreadful. Your landlord must be a very wicked man.
        - id: ch01-b107
          speaker: mineral_woman
          text: It isn't his doing. He's only a lad, after all, and won't come of age for another week or two. He's never been his own master. His cousin manages the estate. The cousin means to squeeze another shilling or two from every tenant, here and there and everywhere. I suppose it will pay for the arches and flags when his lordship comes of age.
        - id: ch01-b108
          speaker: narrator
          text: As she spoke, the woman began sorting the bottles quickly.
        - id: ch01-b109
          speaker: mineral_woman
          text: You see now that there's nothing you can do. Run along, lovey. You're a good little girl to care, and you're the only one who has. Your kindness will come back to you. Kind words and kind deeds are never lost. Good day, missy.
        - id: ch01-b110
          speaker: caroline
          text: Good-bye, but I don't believe there's nothing I can do. I'll ask my uncle. Perhaps he knows your lord, whoever he is.
        - id: ch01-b111
          speaker: mineral_woman
          text: Andore. But no one here knows him. He's been abroad for his education because his chest has been weak since childhood. It won't help, dearie. I'll have to leave, just like all the others who went before me.
          emotion: sad
        - id: ch01-b112
          speaker: caroline
          text: I'll think of something. You wait and see. I have an aunt as well as an uncle, and she says you can make things happen. Keep telling yourself, “Everything will be all right. I won't worry.” Then everything will come right. You'll see. I'll visit again tomorrow or the next day. Good-bye, dear.
          emotion: calm
        - id: ch01-b113
          speaker: narrator
          text: Caroline kissed her, paid the sixpence, and went out to the hornbeam arbor looking like someone with a mission.
        - id: ch01-b114
          speaker: caroline
          text: Come on. I'll explain while we walk. No, I'm not thirsty now. Well, if you saved me some, that was jolly decent of you.
        - id: ch01-b115
          speaker: narrator
          text: She drank the lemonade they had kept for her.
        - id: ch01-b116
          speaker: caroline
          text: Now we haven't a moment to waste. It's life or death for the Mineral Woman. Come on.
        - id: ch01-b117
          speaker: narrator
          text: They started back along the dusty road, and Caroline told the others everything that had happened.
        - id: ch01-b118
          speaker: caroline
          text: I must ask Uncle at once whether he knows Lord Andore. He can telegraph to him, the way he sent that telegram to India. Then everything will be all right.
        - id: ch01-b119
          speaker: charlotte
          text: But we promised we wouldn't disturb him for anything. What if he doesn't come to tea?
        - id: ch01-b120
          speaker: caroline
          text: Then we'll have to do something else. This is the most real thing I've ever had a chance to do—except helping you, Rupert, of course. If we can't reach Uncle, we'll try a spell. Every spell we've used has worked. First there was the fern seed, and then—
        - id: ch01-b121
          speaker: rupert
          text: Yes, I know. Spells are all right as a game, but this is real. My godfather is a baronet. I'll write and ask him to go to the House of Lords and speak to Lord Andore. Appeal to Caesar himself, don't you know. What do you think?
        - id: ch01-b122
          speaker: charlotte
          text: Yes, do that. But we'll use a spell as well. We might as well have two strings to our harp, like the blind girl in the picture. Which spell shall we try?
        - id: ch01-b123
          speaker: caroline
          text: We'll look through the books. Rupert, if it works and she isn't turned out of her cottage, will you believe in the spell then?
        - id: ch01-b124
          speaker: rupert
          text: I'll try. And I'll still write to my godfather. He's in Norway, though. Perhaps I'd better send a telegram.
        - id: ch01-b125
          speaker: charles
          text: Won't that cost pounds?
        - id: ch01-b126
          speaker: rupert
          text: Never mind. Mrs. Wilmington can lend me the money until my allowance comes. If we're doing this, let's do it properly. You may as well be hanged for a sheep as—
        - id: ch01-b127
          speaker: charlotte
          text: As a cow. Yes, exactly.
