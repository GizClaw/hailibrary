audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 温暖机敏，带着克制的幽默讲述
        timbre: 清澈柔和
        pace: 从容而富有变化
        pitch: 中音
    caroline:
      display_name: 卡罗琳
      tts:
        delivery: 大方热情，努力摆出长姐的懂事
        timbre: 明亮清脆
        pace: 自然轻快
        pitch: 中高音
    charlotte:
      display_name: 夏洛特
      tts:
        delivery: 活泼直率，想到什么便说什么
        timbre: 轻盈清亮
        pace: 偏快
        pitch: 高音
    charles:
      display_name: 查尔斯
      tts:
        delivery: 淘气认真，笑话总说得一本正经
        timbre: 清亮的男孩声
        pace: 轻快
        pitch: 中高音
    rupert:
      display_name: 鲁珀特
      tts:
        delivery: 直爽开朗，病中说话虚弱而迷糊
        timbre: 清亮的少年声
        pace: 自然，发烧时忽快忽慢
        pitch: 中高音
    william:
      display_name: 威廉
      tts:
        delivery: 朴实机灵，挖苦话说得不动声色
        timbre: 粗朴温和
        pace: 自然
        pitch: 中低音
    poad:
      display_name: 波德
      tts:
        delivery: 自负生硬，窘迫时仍强撑威严
        timbre: 粗哑结实
        pace: 稍慢
        pitch: 中低音
    gardener:
      display_name: 园丁
      tts:
        delivery: 简短直接，带着干活人的利落
        timbre: 浑厚朴实
        pace: 自然
        pitch: 低音
    leopard_keeper:
      display_name: 豹子饲养员
      tts:
        delivery: 熟练果断，对野兽比对人更有耐心
        timbre: 沉稳粗粝
        pace: 不紧不慢
        pitch: 低音
  chapters:
    - id: ch01
      title: 第十八章　豹见愁
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: |-
            主意一定，孩子们就抱起那些渐渐枯萎的豹见愁，向通往地道的凉亭走去。进门后，他们点亮蜡烛，照吩咐关门上闩，再小心地下台阶，走进秘密通道。烛火小小的，不停摇晃，前方的黑暗却浓得化不开。那黑暗里，忽然有什么动了。
        - id: ch01-b02
          speaker: narrator
          text: |-
            三个人立刻停下来听。有呼吸声。接着，他们在几乎一片漆黑中看见一个模糊的身影。它有四条腿，浑身长毛，带着斑点，正顺通道向他们爬来。随后，它发出一声低沉而凶狠的吼叫。
        - id: ch01-b03
          speaker: caroline
          text: |-
            快扔下！它过不来的。它绝对过不来。
          emotion: fearful
        - id: ch01-b04
          speaker: narrator
          text: |-
            卡罗琳把花全撒在地上。一堆被压烂的花叶纠结在一起，成了孩子们和豹子之间唯一的阻隔。
        - id: ch01-b05
          speaker: caroline
          text: |-
            它过不来。一定过不来。
          emotion: fearful
        - id: ch01-b06
          speaker: narrator
          text: |-
            她的声音已经变成痛苦的耳语。可没人敢转身逃走。夏洛特想起，人的目光能制服野兽，便想盯住它的眼睛。她几乎没意识到自己在这样做。可豹子把头紧贴地面，一动不动，她根本看不到它的眼睛。谁也不敢把后背朝向它。转身也无处可逃，因为通道尽头的门锁着。万一花咒失灵，他们才一转身，豹子只要一扑……
        - id: ch01-b07
          speaker: charles
          text: |-
            噢，我真希望我们没来！
          emotion: fearful
        - id: ch01-b08
          speaker: narrator
          text: |-
            查尔斯立刻大哭起来。
        - id: ch01-b09
          speaker: caroline
          text: |-
            别哭，噢，别哭！
          emotion: fearful
        - id: ch01-b10
          speaker: narrator
          text: |-
            豹子还是没动。卡罗琳鼓起一股近乎疯狂的勇气，对它下了命令。
        - id: ch01-b11
          speaker: caroline
          text: |-
            趴下，先生！给我趴下！
          emotion: fearful
        - id: ch01-b12
          speaker: narrator
          text: |-
            豹子果然趴下了，身子紧紧贴住地面。它趴得那么扁，比你以为豹子能趴到的还要扁。
        - id: ch01-b13
          speaker: charlotte
          text: |-
            它听得懂。
          emotion: surprised
        - id: ch01-b14
          speaker: caroline
          text: |-
            是的，它懂。可怜的猫咪！好啦，可怜的豹子。
          emotion: fearful
        - id: ch01-b15
          speaker: narrator
          text: |-
            卡罗琳的声音和举着烛台的手抖得一样厉害。那团伏在地上的斑点皮毛里，竟传出微弱的轰隆声。
        - id: ch01-b16
          speaker: caroline
          text: |-
            它好像想打呼噜。豹子的呼噜声，当然跟猫不一样。那你把爪子伸过来。
          emotion: fearful
        - id: ch01-b17
          speaker: narrator
          text: |-
            豹子抬起一只毛蓬蓬的前爪。可就连卡罗琳，也不敢把手伸过去。
        - id: ch01-b18
          speaker: caroline
          text: |-
            那就睡吧，好狗狗。乖乖睡觉吧，好小豹子。
          emotion: fearful
        - id: ch01-b19
          speaker: narrator
          text: |-
            豹子蜷起身子，安静下来。
        - id: ch01-b20
          speaker: caroline
          text: |-
            我说没事了。查尔斯，别抽抽噎噎的。我就知道豹见愁会管用。现在我们倒着慢慢退。它要是动，我就再跟它说话。
        - id: ch01-b21
          speaker: narrator
          text: |-
            他们拼命盯着豹子，一步步向后退。三步还没走完，就听它动了。三个人马上停住。
        - id: ch01-b22
          speaker: caroline
          text: |-
            趴下！
          emotion: fearful
        - id: ch01-b23
          speaker: narrator
          text: |-
            下一刻，恐惧、惊奇、欢喜、诧异、惊慌和满意一起涌上他们心头。因为真有一个又沙又哑、像被什么噎住的声音，回答了他们。
        - id: ch01-b24
          speaker: rupert
          text: |-
            豹子不动。小姐别怕。豹子喜欢花。豹子很乖。
        - id: ch01-b25
          speaker: caroline
          text: |-
            真的吗？是豹子在说话吗？
          emotion: surprised
        - id: ch01-b26
          speaker: rupert
          text: |-
            系呀，小小姐。漂亮花花松开豹子舌头头，让他说话话。豹子告诉你秘密。小姐们要种种子，粉粉的、心心的种子。挑对日子，用对法子，再看看长出什么。现在跑掉吧。豹子说完话话了，要睡觉觉。再会啦！
        - id: ch01-b27
          speaker: narrator
          text: |-
            后来，谁也说不清他们是怎样跑到尽头，抽开门闩，冲出去又关上门的。反正等他们在昏暗的凉亭里站定，每张脸都像纸一样白。夏洛特走进阳光两步，便脸朝下扑在小路上，双肩不住抽动。查尔斯还在放声大哭，既不克制，也不想遮掩。卡罗琳则站在阳光下，浑身发抖。
        - id: ch01-b28
          speaker: caroline
          text: |-
            可我们还得回去。这一边有豹见愁，所以很安全。万一有人从宅子那边进地道，站到豹见愁后面呢？我们必须翻过围墙，去宅子里警告大家。夏尔，快起来。查尔斯，你要是早晚得做个男子汉，就现在做吧。等事情结束，有的是时间让你嚎。我们非得想办法爬过那道墙。
          emotion: fearful
        - id: ch01-b29
          speaker: narrator
          text: |-
            我们先把他们留在花园里。他们和豹子之间隔着锁住的门，面前却是十英尺高的围墙。园丁不见踪影，大门又全锁着。
        - id: ch01-b30
          speaker: caroline
          text: |-
            我们必须过去。非过去不可！咒语管用得不得了。只要能到地道另一头，再扔些豹见愁进去，那件伟大的事就完成了。查尔斯，再试一次。我托你上去。我们必须过去。快再试试。
        - id: ch01-b31
          speaker: narrator
          text: |-
            那就先留查尔斯在那儿继续试吧。他一次次往墙上爬，卡罗琳还在下面托他的腿。三个C坚信，是黄绿相间的花发挥魔力，制服了豹子，还让它开口说话。那腔调不知怎的，很像他们远在印度时的奶妈。但我实在不能要求你也相信。而且也不能再拖了，该讲讲你真正可以相信的事。我们得回到鲁珀特那里。上次离开他时，他还和威廉待在马具房，一会儿摸摸马具上明亮的搭扣，一会儿把光滑的长缰绳从指间抽过。
        - id: ch01-b32
          speaker: rupert
          text: |-
            威廉，我们捉弄一下那个波德，怎么样？客厅里有张豹皮。我再找两个枕头，还有针线……
        - id: ch01-b33
          speaker: william
          text: |-
            啥？哈，鲁珀特少爷，这回你可真想到点子上了！你快进去拿豹皮。小心威尔明顿太太。
          emotion: happy
        - id: ch01-b34
          speaker: rupert
          text: |-
            可客厅锁着。而且我不想让别人知道。
        - id: ch01-b35
          speaker: william
          text: |-
            窗子可没锁。我们看准时机，我弯下来给你当梯子。枕头用不着，塞麦秸就够了。针和线可别忘。客厅里准有女士的针线盒，从那里拿。
        - id: ch01-b36
          speaker: narrator
          text: |-
            鲁珀特顺利翻进客厅，很快找到豹皮，针线却难找得多。他找到一张缎木针线桌，上面嵌着象牙，里面衬着褪色的红天鹅绒。一轴轴丝线和缠着线的扁平象牙板都在，可针全锈红了，死死卡在针垫和针包里。他朝四周的陈列柜看了又看，没一个像是放着针的。再说，找到更多锈针又有什么用？一根锈针和五十根同样没用。他想过用百叶窗的拉绳代替线，可那绳子太粗，没有针就穿不过豹皮，强行硬塞只会把它扯破。
        - id: ch01-b37
          speaker: narrator
          text: |-
            那时，他看到墙角里安静立着的金色竖琴。也许能拆几根琴弦？可他并不知道竖琴的弦该怎么拆。他试着碰了碰一根细铁丝。那东西倒是正好适合缝东西，而且不用针也能穿过豹皮。可手指才一碰，竖琴就发出一丝细细的甜美乐声，像个游魂。声音虽轻，却足以警告他，要是硬来，竖琴就会大声喊叫。他轻轻松开琴弦，琴身还在他手下颤动，底座上忽然有东西喀啦响了一声。原来那里有个小盒子似的隔层，盖子被震动了。
        - id: ch01-b38
          speaker: rupert
          text: |-
            也许备用琴弦放在这里。
        - id: ch01-b39
          speaker: narrator
          text: |-
            他打开盖子，果然看到一盒盒盘得整整齐齐的备用琴弦。这些弦不知是谁留下的，如今还原样躺在小圆盒里。鲁珀特连开几盒，挑了几根较细的收进口袋。另一个盒子拿在手里，却发出干涩的哗啦声。打开后，里面没有琴弦，只有一堆奇异的扁平种子。它们带着淡粉色，每一粒都像一颗心。盒上写着，H·D的F之种，只可以正确的方式，在正确的日子播种。鲁珀特合上盒子，没再多想。不过后来，他又想起来了。
        - id: ch01-b40
          speaker: narrator
          text: |-
            他抱着豹皮，口袋里装着琴弦，小心来到窗边。威廉的暗号说明外面很安全。他先把亮闪闪的豹皮扔进威廉手里，再自己跳下去。
        - id: ch01-b41
          speaker: rupert
          text: |-
            我想到个比麦秸更好的办法。
        - id: ch01-b42
          speaker: narrator
          text: |-
            回到马具房，鲁珀特把新点子一说，威廉把大腿拍得比上次更响，也笑得更厉害了。
        - id: ch01-b43
          speaker: narrator
          text: |-
            鲁珀特才走进秘密通道，第一根火柴刚好熄灭，就听见了另一头的孩子们。他立刻朝他们走去，原本真心打算上前解释清楚。他要告诉他们，自己是什么样的豹子，又和威廉准备了什么“玩笑”等着波德。至少在鲁珀特心里，那就是个玩笑。可他听见孩子说话，又看到豹见愁一阵阵落在石板上，就用他后来的说法，把戏演了下去。那声低沉的吼叫，也就是这样吓住了孩子们。
        - id: ch01-b44
          speaker: narrator
          text: |-
            孩子们一走，他就暗暗发笑，开始挑选埋伏波德的好地方。第一根火柴曾照出一处拱形壁龛。你还记得吧，就是孩子们玩玫瑰十字会、治好鲁珀特的那一夜，他们把装着湿玫瑰花瓣的口袋存在了那里。鲁珀特准备躲进壁龛，安安静静等波德路过。到时他就突然跳出来，发出刚才吓孩子时那种吼声。那一声效果那么好，拿来吓波德一定再合适不过。
        - id: ch01-b45
          speaker: narrator
          text: |-
            他等花园的门锁好，便伸手去摸火柴。火柴不见了，准是刚才装豹子时掉在地上。他蹲下摸遍地面，还是找不到。算了，摸黑也能走。他很清楚壁龛在哪儿，就在通道左边，大约四分之三的地方。他站起来，把手搭在墙上，一步步往前摸。手指终于碰到壁龛的转角。他弯下身，准备蜷在里面等波德。坐下时，他伸手想撑住身子。
        - id: ch01-b46
          speaker: narrator
          text: |-
            那只手碰到的不是石板，而是柔软、温热的皮毛。这不是他身上那种干硬、被琴弦紧紧缝住的毛皮，而是一只活物身上的活皮毛。鲁珀特猛地缩回手，额头冒出冷汗，后颈上的汗毛仿佛自己动了起来。那种可怕的温软触感还留在手上。他几乎以为，自己连皮毛上的斑点都摸到了。
        - id: ch01-b47
          speaker: rupert
          text: |-
            噢，我真希望自己没干这事！我真希望我没干！
          emotion: fearful
        - id: ch01-b48
          speaker: narrator
          text: |-
            事情已经太晚时，我们多少人都这样说过。鲁珀特穿着缝在身上的假豹皮，站得一动不动，等真豹子离开，或者安稳地趴好。豹子一定是花园门打开，等孩子们通过时溜进来的。它大概睡在这里，也许还没被他弄醒。
        - id: ch01-b49
          speaker: rupert
          text: |-
            我刚才怎么没跟他们一起走？可我要是跟去了，就会和他们一起在外面。他们不会因为遇到我而返回，接着就可能碰见真豹子。它说不定会扑向他们。幸好现在只有我。
        - id: ch01-b50
          speaker: narrator
          text: |-
            这个好念头让鲁珀特站起来，扶住墙。可转眼间，所有念头都被恐惧淹没了。他摸着墙，几乎一路跑到宅子那头。只要赶在豹子追上来前逃出去就好了。可通道尽头，楼梯下的门关着，还上了锁。他被独自困在黑暗里，通道两头的门全锁着。他在门边蹲下。怕得那样难受，他还是忍住了捶门呼救的第一个疯狂冲动。
        - id: ch01-b51
          speaker: rupert
          text: |-
            别出声。一定会有人来。只要你安安静静，豹子也许会继续睡。孩子们听见晚餐铃，就会打开花园的门，那时你就能出去。可你一闹，豹子就会醒来找你。
          emotion: fearful
        - id: ch01-b52
          speaker: narrator
          text: |-
            他蹲在那里等，却始终没人来。然后他突然想起，听见晚餐铃后，孩子们会顺着通道回来。他们会碰见真豹子，也一定会惊醒它。鲁珀特自己已经被豹子吓成这样，他越想越确定，等孩子们在阳光下安全下来，准会明白刚才发生了什么。那个穿豹皮、还会说话的家伙，只能是一个假扮的人。他们说不定已经猜到那是鲁珀特。所以，他们会毫不害怕地回来找他。他们一路说说笑笑，以为不过是来揭穿一场恶作剧，最后遇上的却会是那个东西。
        - id: ch01-b53
          speaker: narrator
          text: |-
            这时，鲁珀特做了一件真正英勇的事。他站起来，尽快摸索着往回走，贴着离壁龛较远的那面墙。他要回到花园那头。孩子们开门时，他就能拦住他们。可要做到这件事，他必须从豹子身边经过。
        - id: ch01-b54
          speaker: narrator
          text: |-
            一股温暖又甜美的热流悄悄涌遍他的全身。这才值得。他不能像个胆小鬼似的蹲在远处，让那几个孩子说说笑笑地走进来，遇上那个刚从睡梦中惊醒的凶兽。他脱下靴子，悄悄向前摸去。漆黑的寂静中，一点声音也没有。他走上台阶，摸到那扇门，然后坐在最高一级上等待。
        - id: ch01-b55
          speaker: narrator
          text: |-
            寂静里，什么也没动。
        - id: ch01-b56
          speaker: rupert
          text: |-
            反正坐在楼梯顶上，总比坐在底下让我安心。
        - id: ch01-b57
          speaker: narrator
          text: |-
            鲁珀特永远不会知道，自己在黑暗里坐了多久。门缝透出几条苍白的竖线，成了他唯一的安慰。只要望着那几条浅色的线，他就知道门外还有阳光。他试着脱掉身上的豹皮，可缝住它的琴弦实在太结实，他怎么也挣不开。在他感觉里，自己仿佛已经等了整整一星期。
        - id: ch01-b58
          speaker: narrator
          text: |-
            外面终于传来一大群人的声音，夏洛特的声音高高盖过了其他人。鲁珀特希望豹子离得远，没有听见。可他怎么知道它在哪里？豹子的肉垫走路没有声音，它也许已经悄悄爬到他附近，甚至就在一码以内。
        - id: ch01-b59
          speaker: narrator
          text: |-
            在那一个钟头里，鲁珀特终于明白，他替警察准备的恶作剧，究竟是什么滋味。
        - id: ch01-b60
          speaker: rupert
          text: |-
            当然了，我对波德来说，也会像那个东西对我一样可怕。他会把我当成它。
        - id: ch01-b61
          speaker: narrator
          text: |-
            脚步和说话声越来越近，很快就到了门外。
        - id: ch01-b62
          speaker: poad
          text: |-
            它一冲出来，最好马上射死。我带着左轮手枪。
        - id: ch01-b63
          speaker: narrator
          text: |-
            鲁珀特背上一阵冰凉。如果真按计划，在这条黑暗通道里单独遇见波德，会发生什么？
        - id: ch01-b64
          speaker: gardener
          text: |-
            让我拿园艺叉对付它。
        - id: ch01-b65
          speaker: leopard_keeper
          text: |-
            别伤着它。这头野兽可值钱了。我不是说过吗，它是驯服的。你们别动，全都退后。我来收拾它。
        - id: ch01-b66
          speaker: narrator
          text: |-
            鲁珀特悲惨地想着，自己会怎样落网，还在想真豹子离自己到底有多近。事到如今，再多一点声音也没关系了。他轻轻敲门，大声喊了起来。
        - id: ch01-b67
          speaker: rupert
          text: |-
            放我出去！是我，鲁珀特！
          emotion: fearful
        - id: ch01-b68
          speaker: narrator
          text: |-
            他一敲门，门外就响起一片惊叫，把他的话淹没了。豹子呢？这么多人一起喊叫，谁知道它会怎样？就在喧闹中，有人抽开门闩，打开了门。鲁珀特立刻纵身跳出去，又赶紧转身去关门。可他的双脚、双臂和脑袋全给琴弦缠在一起，连站都站不稳，当场摔倒在地。
        - id: ch01-b69
          speaker: rupert
          text: |-
            是我，是鲁珀特！快关门！真豹子在里面！
          emotion: fearful
        - id: ch01-b70
          speaker: leopard_keeper
          text: |-
            咦！原来是个讨厌的小鬼，穿成这副样子。
          emotion: disgusted
        - id: ch01-b71
          speaker: narrator
          text: |-
            豹子饲养员正是把网撒到鲁珀特身上的人，他的声音充满厌恶。门外聚了一大群人。三个C原来借一棵梨树，好不容易才爬过十英尺高的围墙。他们带回了威廉。威廉胚子里藏着一场大笑，脸上却只偷偷透出一点笑意。同来的还有豹子饲养员，和十来个人。这会儿，二十来只手一起忙活，拉网的拉网，解绳的解绳，才终于把鲁珀特从网里弄出来。
        - id: ch01-b72
          speaker: rupert
          text: |-
            噢，我也说不清。我就是想闹着玩，捉弄一下别人。可我已经得到报应了。豹子真在里面。我在黑暗里摸到它了。
          emotion: fearful
        - id: ch01-b73
          speaker: narrator
          text: |-
            人群一片轰动。
        - id: ch01-b74
          speaker: william
          text: |-
            你看，半个钟头前我就说，那头野兽多半躲进了地道。你倒好，硬说在树上看到了它的尾巴，怎么也不肯下去。
        - id: ch01-b75
          speaker: poad
          text: |-
            我当时的的确确觉得，自己看到它的尾巴挂在某棵树上。这位先生的伙伴，还有五六个人，现在都在另一座门房附近追它呢。不过那也许根本不是它的尾巴。是啊，如果里面真有小少爷说的那头野兽，树上的尾巴当然不可能是真的。
        - id: ch01-b76
          speaker: rupert
          text: |-
            我告诉你们，豹子现在就在里面。谁快帮我把这讨厌的皮脱掉。
        - id: ch01-b77
          speaker: narrator
          text: |-
            威廉替他解开系绳。鲁珀特从豹皮里跨出来，变回一个脸色惨白、只穿着衬衫和灯笼裤的男孩。
        - id: ch01-b78
          speaker: leopard_keeper
          text: |-
            它现在就在里面，是吗？那就请人拿一两盏风灯来。我们进去把它弄出来。
        - id: ch01-b79
          speaker: narrator
          text: |-
            饲养员无礼地完全不理波德。去拿风灯的是威廉。凉亭里恰好已经备好了几盏，他很快就把灯带回门边。饲养员接过风灯，一点也不担心似的走下台阶，好像进去抓豹子只是件寻常工作。
        - id: ch01-b80
          speaker: leopard_keeper
          text: |-
            在右边？
        - id: ch01-b81
          speaker: rupert
          text: |-
            对，就在右边。
        - id: ch01-b82
          speaker: narrator
          text: |-
            威廉和另外三个男人小心跟了进去。其他人都觉得，留在门边才是最好的选择。五个人加一张网，怎么也该抓得住一头豹子了。不过留下的人也不肯错过任何动静。每个人都往门前挤，后面的人伸长脖子，前面的人甚至悄悄走下几级台阶，弯下腰，屏住气，等着听里面传出的第一点动静。
        - id: ch01-b83
          speaker: narrator
          text: |-
            突然，地道深处传来一阵奇怪的声音，门外的人吓得全往后退。那不是吼叫，也不是什么东西扑过来的声音。仔细一听，原来是又长又响的大笑。笑声在拱顶通道里一次次激起回声，而且越来越近。聚在门口的人群又一起往后退了几步。
        - id: ch01-b84
          speaker: narrator
          text: |-
            笑声从黑暗中一路靠近，三个人先后走了出来。豹子饲养员笑着，手里还提着抓野兽的网。威廉也笑着，手里举着准备对付豹子的园艺叉。波德跟在后面，他脸上一半在笑，另一半却在生气。
        - id: ch01-b85
          speaker: narrator
          text: |-
            门外的人一起追问，里面究竟是什么。
        - id: ch01-b86
          speaker: narrator
          text: |-
            不只是孩子，外面每个人都在问。可里面出来的人笑得喘不上气，过了一会儿，威廉才终于能开口。
        - id: ch01-b87
          speaker: william
          text: |-
            是威尔明顿太太的老猫！它躲到里面生小猫，图个安静，好躲开孩子们，不受他们打扰。你那个小宝贝已经抓到了。看，围墙外的树丛里有个白点。我之前告诉过比尔，要是他们在波德说看见斑点尾巴的地方，把豹子其余的部分也找出来，就跑上去发个信号给我们看。现在那信号不就在树丛里吗？
          emotion: happy
        - id: ch01-b88
          speaker: poad
          text: |-
            那你在我们进去前，就已经知道了？
          emotion: angry
        - id: ch01-b89
          speaker: william
          text: |-
            当然知道。我要是不知道我家勋爵和他的斑点尾巴在哪里，你们可别想抓我进地道。我早猜到是鲁珀特少爷又在搞鬼花样。他准备好了一场玩笑，我可不想提前说破，扫了他的兴。
          emotion: happy
        - id: ch01-b90
          speaker: poad
          text: |-
            这事还没完，你等着吧。
          emotion: angry
        - id: ch01-b91
          speaker: william
          text: |-
            你那边也没完，所以可别觉得事情过去了，詹姆斯·波德。你明明亲眼看见一个故事，却偏要相信另一个。斑点尾巴就在你眼前，那可是你自己两只眼睛亲自看到、又发过誓的证据，你却连自己的眼睛都不肯相信。
