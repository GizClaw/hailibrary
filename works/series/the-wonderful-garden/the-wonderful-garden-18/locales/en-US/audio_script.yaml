  chapters:
  - id: ch01
    title: The Leopard's-Bane
    blocks:
      - id: ch01-b01
        speaker: narrator
        text: Once their minds were made up, the children gathered the fading armfuls of leopard's-bane and hurried to the arbour that led into the tunnel. They lit their candle inside, shut and bolted the door as they had been told, and went carefully down the steps. As they moved along the secret passage, they heard something stirring in the thick darkness beyond the candle's little, wavering light.
      - id: ch01-b02
        speaker: narrator
        text: They stopped to listen. Something was breathing ahead of them. Then they could just make out a four-footed, spotted, furry shape creeping their way. A low, savage growl came out of the darkness.
      - id: ch01-b03
        speaker: caroline
        text: Throw the flowers down! It can't cross them. It can't!
        emotion: fearful
      - id: ch01-b04
        speaker: narrator
        text: Caroline flung her flowers away. Now only a tangled heap of crushed leaves and blossoms stood between the children and the leopard.
      - id: ch01-b05
        speaker: caroline
        text: It can't cross. It can't.
        emotion: fearful
      - id: ch01-b06
        speaker: narrator
        text: Her whisper was full of agony, but none of them dared turn and run. Charlotte remembered hearing that a person could master a wild animal by looking into its eyes. Almost without meaning to, she tried to meet the leopard's gaze. She could not do it. The creature held its head close to the ground and stayed perfectly still. Each child felt it was impossible to show the leopard a turned back. Facing it seemed safer. The garden door behind them was bolted, and if the flower spell failed while their backs were turned, the leopard could reach them in a single spring.
      - id: ch01-b07
        speaker: charles
        text: Oh, I wish we'd never done this!
        emotion: fearful
      - id: ch01-b08
        speaker: narrator
        text: Charles burst into tears.
      - id: ch01-b09
        speaker: caroline
        text: Don't cry. Oh, please don't!
        emotion: fearful
      - id: ch01-b10
        speaker: narrator
        text: Then Caroline gathered a wild kind of courage and spoke to the leopard, which had not moved.
      - id: ch01-b11
        speaker: caroline
        text: Down, sir! Lie down!
      - id: ch01-b12
        speaker: narrator
        text: The leopard flattened itself against the floor, flatter than you might think any leopard could lie.
      - id: ch01-b13
        speaker: charlotte
        text: It understood you.
        emotion: surprised
      - id: ch01-b14
        speaker: caroline
        text: Yes. It really did. Poor pussy. Poor leopard.
        emotion: fearful
      - id: ch01-b15
        speaker: narrator
        text: Her voice shook as badly as the hand holding the candlestick. A faint rumble came from the crouching mound of spotted fur.
      - id: ch01-b16
        speaker: caroline
        text: I think it's trying to purr. A leopard's purr would sound different, of course.
      - id: ch01-b17
        speaker: caroline
        text: Give me your paw, then.
        emotion: fearful
      - id: ch01-b18
        speaker: narrator
        text: The leopard raised a ragged-looking forepaw. Even Caroline could not make herself reach toward it.
      - id: ch01-b19
        speaker: caroline
        text: Go to sleep, good dog. Go to sleep now. By-by, good little leopard.
        emotion: fearful
      - id: ch01-b20
        speaker: narrator
        text: The leopard curled up and became quite still.
      - id: ch01-b21
        speaker: caroline
        text: I told you it was all right. Stop crying, Charles. I knew the leopard's-bane would work. Now we'll walk backward very slowly. If it moves, I'll talk to it again.
      - id: ch01-b22
        speaker: narrator
        text: They backed away, moving very slowly and doing their best to keep watching the leopard. Before they had taken three steps, they heard it stir. They stopped at once.
      - id: ch01-b23
        speaker: caroline
        text: Lie down!
      - id: ch01-b24
        speaker: narrator
        text: Then a voice answered. It was choked, husky, and very strange. The children felt horror, wonder, delight, surprise, dismay, and satisfaction all at once.
      - id: ch01-b25
        speaker: rupert
        text: Leopard stay still. Little lady no be frightened. Leopard like flowers. Leopard very good.
      - id: ch01-b26
        speaker: caroline
        text: Are you? Is that really the leopard talking?
        emotion: surprised
      - id: ch01-b27
        speaker: rupert
        text: Ess, little missy. Pretty flowers loose leopard's tonguey and make him talky. Leopard tell secret. Little ladies sow pinky, hearty seeds on right day and in right way. Then see what comes up. Run away now. Leopard finished talky. He go sleepy by-by. So long!
      - id: ch01-b28
        speaker: narrator
        text: None of them ever knew how they reached the tunnel's end, pulled back the bolts, shut the door behind them, and found themselves in the dusky arbour, staring at one another with paper-white faces.
      - id: ch01-b29
        speaker: narrator
        text: Charlotte took two steps into the sunlight and threw herself face down on the path, her shoulders heaving. Charles went on crying without trying to hide it. Caroline stood trembling in the sun.
      - id: ch01-b30
        speaker: caroline
        text: We have to get back. We're safe on this side because of the leopard's-bane. But someone might come from the house and reach it from behind the flowers. We must climb the wall, get to the house, and warn them. Get up, Char. Charles, if you're ever going to be a man, be one now. You can howl when this is over. Somehow, we have to climb that wall.
      - id: ch01-b31
        speaker: narrator
        text: So we leave the children in the garden, with a locked door between them and the leopard, trying one way after another to scale a ten-foot wall. The gates were locked, and not a gardener could be found anywhere to help them.
      - id: ch01-b32
        speaker: caroline
        text: We must get over! The charm worked perfectly. If we can reach the other end of the tunnel and throw in more leopard's-bane, we'll have done the great deed. Try once more, Charles. I'll give you a leg up. We must get over. Try again!
      - id: ch01-b33
        speaker: narrator
        text: We leave Charles trying.
      - id: ch01-b34
        speaker: narrator
        text: The three C.'s firmly believed that the green and yellow flowers had subdued the leopard and made it speak in a way that reminded them of their old ayah in India. You may find that hard to believe. So now we must go back to Rupert. We left him with William in the harness room, fingering the shining buckles and drawing the long, smooth reins through his hands.
      - id: ch01-b35
        speaker: rupert
        text: William, couldn't we play a trick on Poad? There's a leopard skin in the drawing room. Suppose I found two pillows and a needle and thread?
      - id: ch01-b36
        speaker: narrator
        text: William stared at him. Then the idea struck him. He slapped his leg and laughed aloud.
      - id: ch01-b37
        speaker: william
        text: You've got it this time, Master Rupert! You fetch that skin, but mind Mother Wilmington doesn't catch you.
        emotion: happy
      - id: ch01-b38
        speaker: rupert
        text: The drawing room is locked, and I don't want the others to know.
      - id: ch01-b39
        speaker: william
        text: The windows aren't locked. We'll wait for our chance, and I'll give you a back. Never mind the pillows. Straw will stuff it well enough. Just bring a needle and cotton too. There'll be a lady's workbox in there somewhere.
      - id: ch01-b40
        speaker: narrator
        text: Once William had helped him safely through the window, Rupert found the leopard skin easily. The needle and cotton were another matter. He searched a satinwood worktable, inlaid with ivory and lined in faded red velvet. It held silk reels and flat ivory winders with thread wound around them, but every needle was rusted red and stuck fast in its cushion or case. He looked around the room. None of the cabinets seemed likely to hold needles, and there was little use hunting for more rusty ones. Fifty useless needles would be no better than one.
      - id: ch01-b41
        speaker: narrator
        text: He considered using the blind cords instead of cotton, but they were too thick. He could never force them through the leopard skin without tearing it. Then he noticed the silent golden harp standing in a far corner. Its strings might be exactly right for sewing without a needle. He did not know how to unstring a harp, though. When he touched one fine wire, it gave a thin, sweet ghost of a musical note. The sound was faint, but loud enough to warn him how the harp would cry out if he used force.
      - id: ch01-b42
        speaker: narrator
        text: He let the string go gently. The harp trembled under his hand, and something rattled. It was the lid of a little box built into the pedestal.
      - id: ch01-b43
        speaker: rupert
        text: Perhaps they keep spare strings in there.
      - id: ch01-b44
        speaker: narrator
        text: They did. Neat coils of spare strings lay in small round boxes. Rupert opened several, chose some thin ones, and slipped them into his pocket. Another box gave a dry rattle. Inside, instead of strings, were several strange, flat, pinkish seeds shaped like hearts. The label read, "Seed of the F. of H.D. Sow only in the way and on the day."
      - id: ch01-b45
        speaker: narrator
        text: Rupert replaced the lid and forgot the box for the moment. Later, he remembered it.
      - id: ch01-b46
        speaker: narrator
        text: Carrying the leopard skin and the wires, Rupert crept to the window. William's signal told him the way was clear. He dropped the bright skin into William's hands and jumped down after it.
      - id: ch01-b47
        speaker: rupert
        text: I've thought of something better than straw.
      - id: ch01-b48
        speaker: narrator
        text: Back in the harness room, Rupert explained his new idea. William slapped his leg even harder and laughed more heartily than before.
      - id: ch01-b49
        speaker: narrator
        text: Rupert had only just entered the secret passage when his first match went out and he heard the children at the far end. He moved toward them, fully intending to explain what sort of leopard he was. He would tell them about the trick he and William had arranged for Poad, though Rupert preferred to call it a joke in his own mind.
      - id: ch01-b50
        speaker: narrator
        text: Then he heard the children talking and saw the leopard's-bane shower onto the stone floor. As he said afterward, he "played up." Once they had gone, he laughed softly and began choosing the best place to wait for Poad. By the matchlight, he had noticed the arched recess where the children had stored their sacks of wet rose leaves when they played at Rosicurians and cured him. He would hide there, then spring out with the same snarl that had worked so well on the children.
      - id: ch01-b51
        speaker: narrator
        text: He waited until the garden door was locked, then reached for his matches. They were gone. He must have dropped them during his performance. He searched the floor, but found nothing. It did not matter, he thought. He knew exactly where the recess was, on the left and about three quarters of the way along.
      - id: ch01-b52
        speaker: narrator
        text: Rupert put one hand against the wall and felt his way forward. At the corner of the recess, he bent down to curl up and wait for Poad. He reached out to steady himself. His hand touched soft, warm fur.
      - id: ch01-b53
        speaker: narrator
        text: This was not the dry, stiff fur sewn around Rupert with harp strings. It was living fur on a living creature. He snatched his hand back. Cold sweat broke across his forehead, and the little hairs on his neck seemed to rise by themselves. His hand still remembered that dreadful warmth and softness. He almost felt he had touched the very spots.
      - id: ch01-b54
        speaker: rupert
        text: Oh, I wish I hadn't done it. I wish I hadn't!
        emotion: fearful
      - id: ch01-b55
        speaker: narrator
        text: Many of us have said the same thing when it was already too late. Rupert stood perfectly still inside the mockery of his sewn-on leopard skin. He waited for the real leopard to move or settle down. Perhaps it would sleep again. The creature must have slipped in while the garden door stood open, ready for the children to pass through. It could have curled up in the recess and gone to sleep before Rupert arrived. Perhaps his touch had not woken it after all.
      - id: ch01-b56
        speaker: rupert
        text: Why didn't I go with the others?
        emotion: fearful
      - id: ch01-b57
        speaker: narrator
        text: Then a better thought came to him.
      - id: ch01-b58
        speaker: rupert
        text: If I'd gone with them, they wouldn't have met me and turned back. They might have found the real leopard, and it might have jumped on them. I'm glad it's only me.
      - id: ch01-b59
        speaker: narrator
        text: That good thought stayed with Rupert as he rose and steadied himself against the wall. A moment later, terror swept every thought away. He hurried toward the house entrance, almost running as he felt his way along the wall. If only he could escape before the leopard rose and chased him.
      - id: ch01-b60
        speaker: narrator
        text: At the end of the passage, he found the door at the foot of the stairs shut and locked. Both ends of the tunnel were locked now. Rupert was alone in the darkness with the leopard. He crouched beside the door. Even in his agony of fear, he had enough sense not to hammer on it and scream for help, though that was his first wild impulse.
      - id: ch01-b61
        speaker: rupert
        text: Keep quiet. Someone must come soon. If you make no noise, perhaps the leopard will stay asleep. The children will open the garden door when the dinner bell rings, and then you can get out. But if you make a sound, the leopard will wake and come after you.
        emotion: fearful
      - id: ch01-b62
        speaker: narrator
        text: Rupert waited, but no one came. Then he suddenly remembered that the dinner bell would bring the children through the passage. They would meet the real leopard and certainly wake it.
      - id: ch01-b63
        speaker: narrator
        text: Now that Rupert himself knew such fear, he felt certain the children, safe in the sunshine, would think over what had happened. A creature that talked while dressed in a leopard skin could only have been a person in disguise. Perhaps they already knew it was Rupert. They would come back without fear, laughing and expecting to find him. Instead, they would find the real leopard.
      - id: ch01-b64
        speaker: narrator
        text: Then Rupert did something truly heroic. He stood and began feeling his way back along the side of the tunnel farthest from the recess. He meant to reach the garden door and stop the children when they opened it. To do that, he had to pass the leopard.
      - id: ch01-b65
        speaker: narrator
        text: A warm, wonderful glow spread through him. This was worth doing. It was better than hiding like a coward at the far end while the children came laughing and talking down the passage toward a savage animal startled from sleep. Rupert took off his boots so he could move quietly, then crept along the wall. No sound broke the black silence. He passed the recess, reached the flight of steps, climbed to the garden door, and sat on the top stair to wait.
      - id: ch01-b66
        speaker: narrator
        text: Still, nothing moved.
      - id: ch01-b67
        speaker: rupert
        text: Anyway, I feel safer at the top of the stairs than at the bottom.
      - id: ch01-b68
        speaker: narrator
        text: Rupert never knew how long he sat there. His only comfort came from the pale upright lines where light showed through the cracks around the door. He tried to wriggle free of the leopard skin, but the harp strings held fast. It seemed as if he had waited a whole week.
      - id: ch01-b69
        speaker: narrator
        text: At last he heard many voices, with Charlotte's high voice rising above them all. Rupert hoped the leopard was too far away to hear. But how could he know where it was? The creature could move on padded, noiseless feet. It might have crept close while he waited, and he would never have known. It might be standing only a yard behind him now.
      - id: ch01-b70
        speaker: narrator
        text: During that hour, Rupert understood exactly what sort of practical joke he had prepared for the policeman.
      - id: ch01-b71
        speaker: rupert
        text: I would have seemed just as terrible to Poad as the real leopard seems to me. He would have thought I was truly It.
      - id: ch01-b72
        speaker: narrator
        text: The footsteps and voices drew nearer. Now the people were talking just outside the door.
      - id: ch01-b73
        speaker: poad
        text: Best shoot it when it charges. I've got a revolver.
      - id: ch01-b74
        speaker: narrator
        text: A cold shiver ran down Rupert's back. What if he had met Poad alone in the dark passage, just as he had planned?
      - id: ch01-b75
        speaker: gardener
        text: Let me at the beast with my garden fork.
      - id: ch01-b76
        speaker: leopard_keeper
        text: Don't hurt it. That animal is valuable, and I keep telling you it's tame. Stand back and leave it to me.
      - id: ch01-b77
        speaker: narrator
        text: Rupert wondered miserably how they meant to trap him, and how close the true leopard might be. A little more noise could hardly matter now. He knocked on the door.
      - id: ch01-b78
        speaker: rupert
        text: Let me out! It's Rupert!
        emotion: fearful
      - id: ch01-b79
        speaker: narrator
        text: His words were drowned by the chorus of alarm that rose when he knocked. In the middle of that babel, someone pulled the bolt and opened the door. Rupert sprang out and turned at once to close it again, but the strings around the leopard skin tangled his feet, arms, and head. He crashed to the ground before he could reach the door.
      - id: ch01-b80
        speaker: rupert
        text: It's me! I'm Rupert! Shut the door! The real leopard is inside!
        emotion: fearful
      - id: ch01-b81
        speaker: narrator
        text: The leopard's keeper had thrown his net over Rupert.
      - id: ch01-b82
        speaker: leopard_keeper
        text: Why, it's only a nasty boy in a costume.
        emotion: disgusted
      - id: ch01-b83
        speaker: narrator
        text: He sounded deeply disgusted. A crowd had gathered. The three C.'s had finally crossed the wall by climbing a pear tree. They had brought William, the leopard's owner, and a dozen other people. William was privately shaking with laughter. Twenty hands helped pull the net away from Rupert.
      - id: ch01-b84
        speaker: rupert
        text: I don't know why I did it. It was only a lark. I meant to fool someone, but I've been punished for it. The leopard is in there. I touched it in the dark.
      - id: ch01-b85
        speaker: narrator
        text: That caused a sensation.
      - id: ch01-b86
        speaker: william
        text: There, Poad! Half an hour ago I told you the beast might have taken shelter in this passage. But you insisted you'd seen its tail up a tree somewhere, and you wouldn't come down.
      - id: ch01-b87
        speaker: poad
        text: I certainly thought I saw its tail. The keeper's friend and half a dozen others are chasing it near the other lodge right now. Still, perhaps it wasn't the tail after all. It couldn't have been, if the animal is in here as the young gentleman says.
      - id: ch01-b88
        speaker: rupert
        text: I'm telling you, the leopard is in there now. And somebody please get me out of this horrible skin!
      - id: ch01-b89
        speaker: narrator
        text: William unlaced the disguise. Rupert stepped free, a pale boy in his shirt and knickerbockers.
      - id: ch01-b90
        speaker: leopard_keeper
        text: So it's in there now? Fetch a lantern or two, and we'll go in and bring it out.
      - id: ch01-b91
        speaker: narrator
        text: The keeper ignored Poad completely. William fetched the lanterns, which were already waiting in the summerhouse. The keeper started down the steps without the least concern.
      - id: ch01-b92
        speaker: leopard_keeper
        text: Is it on the right-hand side?
      - id: ch01-b93
        speaker: rupert
        text: Yes, on the right.
      - id: ch01-b94
        speaker: narrator
        text: William and three other men followed carefully, but most of the party decided it was wiser to remain by the door. Five people and a net ought to be enough to catch one leopard. Even so, everyone crowded around the entrance. Some people ventured down a few steps and bent forward, straining to catch the first sound of whatever might be happening in the tunnel.
      - id: ch01-b95
        speaker: narrator
        text: Suddenly a strange sound rolled out of the dark passage below. It was long, loud laughter, echoing and re-echoing beneath the vaulted roof as it came nearer and nearer. The listeners jumped back, and the whole crowd drew away from the door.
      - id: ch01-b96
        speaker: narrator
        text: The leopard keeper came out laughing with his net. William followed, laughing over his pitchfork. Poad came last, half amused and half angry.
      - id: ch01-b97
        speakers: [onlooker_1, onlooker_2, onlooker_3]
        ensemble: chorus
        text: What was it? What did you find?
      - id: ch01-b98
        speaker: narrator
        text: For a moment, none of the men could catch enough breath to answer. The children asked again. At last William managed to speak.
      - id: ch01-b99
        speaker: william
        text: Mrs. Wilmington's old cat! She went down there to have her kittens in peace, away from the children. And they've caught your little fellow too. Look over there!
        emotion: happy
      - id: ch01-b100
        speaker: narrator
        text: William pointed to a white speck among the trees beyond the wall.
      - id: ch01-b101
        speaker: william
        text: I told Bill to signal us if they found the rest of the leopard where Poad claimed he'd seen its spotted tail.
      - id: ch01-b102
        speaker: poad
        text: Did you know about the cat before we went into that passage?
        emotion: angry
      - id: ch01-b103
        speaker: narrator
        text: William planted his hands on his knees. His red face was deeply creased with laughter.
      - id: ch01-b104
        speaker: william
        text: Of course I knew. You wouldn't catch me walking in there unless I knew where his lordship and his spotted tail had gone. I thought Master Rupert was playing another prank, and I wasn't going to spoil the fun.
        emotion: happy
      - id: ch01-b105
        speaker: poad
        text: You haven't heard the last of this.
        emotion: angry
      - id: ch01-b106
        speaker: william
        text: Neither have you, James Poad, so don't imagine you have. You believed one story after you'd seen the other with your own eyes. You refused to trust the sworn evidence of those eyes and one spotted tail.
