      display_name: William
      tts:
        delivery: gruff, practical, and loyally protective
        timbre: rough and earthy
        pace: medium
        pitch: low
  chapters:
    - id: ch01
      title: The Le-o-pard
      blocks:
        - id: ch01-b01
          speaker: caroline
          text: We simply have to write to Aunt Emmeline. I bought three new pens yesterday, and some lovely ink that smells of violets. Besides, I've been counting all the picture postcards she and Uncle Percival have sent us. There are forty-two of them altogether. And twenty-eight of those arrived since the last time we wrote to them.
        - id: ch01-b02
          speaker: charles
          text: I almost wish we didn't get the postcards. Every new one makes you feel more dreadful when you haven't written back. Suppose we send them picture postcards instead of a letter. You hardly have to write anything on a postcard.
        - id: ch01-b03
          speaker: charlotte
          text: That would be shirking. Come along. If it must be done, we'll do it. Necessity doesn't know the law.
        - id: ch01-b04
          speaker: narrator
          text: Charlotte did not want to go out just then, and she more than half believed her own argument. Writing the letter seemed like the proper thing to do, whether anyone wanted to do it or not.
        - id: ch01-b05
          speaker: charles
          text: You write as well, Rupert. Put in some Latin. They'll adore that. Or tell me what to say, and how to spell it, and I'll write it down.
        - id: ch01-b06
          speaker: narrator
          text: Rupert said he could not be bothered. He took down Jesse's Anecdotes of Dogs. It had tempting pictures and delightful stories, but he did not really read a word. Caroline, meanwhile, was in an agony over the spelling of asafoetida. Her medicine book said it helped pains in the head caused by too much study of printed books. When she looked up, she saw Rupert staring miserably at the portrait of Dame Eleanour above the mantelpiece. His eyes were fixed on it, though he seemed not to see it at all.
        - id: ch01-b07
          speaker: charlotte
          text: Isn't she splendid? She knew all about spells. Most of ours come from her books.
        - id: ch01-b08
          speaker: rupert
          text: If she knew all about spells, then she knew what rubbish they were. You only try magic on things that would happen anyway.
        - id: ch01-b09
          speaker: caroline
          text: What did you say about my spelling?
        - id: ch01-b10
          speaker: narrator
          text: Caroline had made a bold guess at the shape she remembered from the medicine book. In a fierce violet smudge, she had written “Asserphrodite.” Now she put down her pen. The wet ink on its nib began to dry, changing from purple into a bronze-like greenish gold.
        - id: ch01-b11
          speaker: rupert
          text: I said your magic isn't real.
        - id: ch01-b12
          speaker: caroline
          text: But we saw you when you were invisible—
        - id: ch01-b13
          speaker: rupert
          text: Yes, I know. But if magic is real, why not do something that couldn't happen naturally? Bring back Mrs. Wilmington's lost cat. Find my Kohinore pencil. Mr. Penfold has a book with another spell in it. You make a wax model of your enemy and stick pins into it. Wherever a pin goes in, the enemy feels pain in that very spot.
        - id: ch01-b14
          speaker: caroline
          text: That's terribly wicked!
          emotion: surprised
        - id: ch01-b15
          speaker: rupert
          text: Or you put the wax man by the fire. As the wax melts, the real man wastes away.
        - id: ch01-b16
          speaker: charlotte
          text: Oh, please don't!
          emotion: fearful
        - id: ch01-b17
          speaker: charles
          text: No, go on. What else can you do?
        - id: ch01-b18
          speaker: rupert
          text: Nothing else. It works better if you get some of your enemy's hair and put it on the wax man's head. Mr. Penfold read me part of a poem about it.
        - id: ch01-b19
          speaker: caroline
          text: Didn't he tell you it was wicked?
        - id: ch01-b20
          speaker: rupert
          text: Yes, but I don't need Mr. Penfold to tell me right from wrong. I don't need you to tell me either. Just imagine your enemy twisting when the pins went in. To him, each prick would feel like a sword thrust.
        - id: ch01-b21
          speaker: caroline
          text: Stop, Rupert. Please stop. It's horrible, and I don't want to hear about spells like that.
          emotion: fearful
        - id: ch01-b22
          speaker: charles
          text: Rupert wouldn't really do it. He's only talking.
        - id: ch01-b23
          speaker: rupert
          text: How do you know? Next time your leg aches, Caroline, you'll think it's growing pains. But it might be me secretly driving a long hatpin into a wax model of you.
          emotion: angry
        - id: ch01-b24
          speaker: narrator
          text: Caroline stood up.
        - id: ch01-b25
          speaker: caroline
          text: Come on, Char. If Rupert keeps talking like this, we'll sit in the drawing room.
        - id: ch01-b26
          speaker: charles
          text: He doesn't mean it.
        - id: ch01-b27
          speaker: rupert
          text: Of course I don't.
        - id: ch01-b28
          speaker: narrator
          text: Suddenly he smiled.
        - id: ch01-b29
          speaker: rupert
          text: I don't know why I said it. Don't be silly. There are plenty of harmless things you could try. Why don't you...
        - id: ch01-b30
          speaker: narrator
          text: He glanced around, and his eyes settled on the portrait again.
        - id: ch01-b31
          speaker: rupert
          text: Why don't you bring that portrait to life? If Dame Eleanour was a witch, her picture ought to be good for something like that.
        - id: ch01-b32
          speakers: [caroline, charlotte, charles]
          ensemble: chorus
          text: Oh, if only we could!
        - id: ch01-b33
          speaker: rupert
          text: Then do it. That might make me believe, unlike all the useless things you've tried since I came here.
        - id: ch01-b34
          speaker: narrator
          text: Silence followed.
        - id: ch01-b35
          speaker: charles
          text: How do you spell “impossible”?
        - id: ch01-b36
          speaker: narrator
          text: After that, only the scratching of violet pens could be heard. Yet Rupert's idea stayed with Charlotte from that moment on. It slipped into her mind between every other thought and every other happening. If only the portrait could be made to come alive! She could not stop wondering whether it might be possible.
        - id: ch01-b37
          speaker: narrator
          text: Charles let his imagination play, rather timidly, with the wax man. He would never hurt the person it copied, of course. He only wanted to find out whether anything happened. He would not use pins. But perhaps he could hide the little image in his pocket while the real person was in the room. Then he might pinch its foot just a very, very, very little. If the person suddenly jumped or cried out, as people do even when they are pinched gently, Charles would know. And no one else need ever hear about it.
        - id: ch01-b38
          speaker: narrator
          text: Charlotte's thoughts were busy with Rupert too, then and afterward. Between all her other ideas, she kept asking herself what was wrong with him. More than that, she wondered whether something could be done to help.
        - id: ch01-b39
          speaker: narrator
          text: There was no doubt about it. Rupert was not at all the boy they had first believed him to be. Sometimes he was as cheerful as anyone could wish. He would begin a new game himself, then play it in the most amusing and satisfying way. But the good time never lasted. Sooner or later, and generally sooner, the light of life seemed to go out of him. Suddenly he was not only tired of the game, but tired of everything else as well. Then he was not only tired of everything. He was angry with everybody.
        - id: ch01-b40
          speaker: charlotte
          text: I'm certain he's bewitched. Perhaps someone made a wax model of him. Whenever they push in a pin, he suddenly turns savage.
        - id: ch01-b41
          speaker: narrator
          text: Charlotte said this more than once in the private part of the evening when she and Caroline brushed their hair and talked everything over. The sudden change in Rupert seemed to her exactly like the moment when a pin might have been pushed into a hidden wax figure.
        - id: ch01-b42
          speaker: caroline
          text: That really is nonsense. I'm sure such a thing wouldn't be allowed.
        - id: ch01-b43
          speaker: narrator
          text: The question kept working in Charlotte's mind even after bedtime. One night she woke Caroline from sleep because she could not wait until morning to ask it.
        - id: ch01-b44
          speaker: charlotte
          text: How would you make a model of someone's mind?
        - id: ch01-b45
          speaker: caroline
          text: You can't. Do go to sleep.
        - id: ch01-b46
          speaker: charlotte
          text: I believe you can. I remember something written under a person's portrait in a history book. It said the picture painted his mind. So if a mind can be painted, surely someone can make a wax model of it. I believe that's what somebody has done to Rupert. Perhaps they've made a model of his mind and stuck knives into it. Don't you think so? Oh, well, if you insist on going back to sleep!
        - id: ch01-b47
          speaker: narrator
          text: As the days passed, Rupert became grumpier and grumpier. He cared less and less for the company of the three C.'s. Often he went for long walks by himself. When he did choose company, he seemed to prefer William, who simply put up with him. He even preferred Mrs. Wilmington, who adored him, to being with the other children.
        - id: ch01-b48
          speaker: charlotte
          text: We thought it would be so jolly when Rupert came. And the worst part is that Charles copies him now. Charles sometimes speaks quite rudely, even to you, Caro. You know he always used to like you best.
          emotion: sad
        - id: ch01-b49
          speaker: narrator
          text: Swimming was the only thing Rupert seemed to care about truly and steadily. Nearly every day he went down to the river with Mr. Penfold, or met him at the bathing place. Then the two of them swam together. With Mr. Penfold, Rupert was nearly always at his best. Perhaps that was because Mr. Penfold never appeared to notice on the occasions when Rupert was not at his best.
        - id: ch01-b50
          speaker: narrator
          text: Meanwhile, the village grew busier and more excited with every passing day. Lord Andore was about to turn twenty-one, and the people called the celebration a Grangaileranfeat. It would be held in his park and in several meadows beside it. Roundabouts were coming, along with coconut shies and shooting galleries. Best of all, there would be a real circus. Its menagerie would be there too, with performing elephants and educated seals. And every part of it would be free.
        - id: ch01-b51
          speaker: narrator
          text: The children looked forward to the day with longing. Lord Andore had sent each of them a proper invitation card. His mother's name and his own were printed on it, while each child's name had been written in separately. It requested the pleasure of their company on Lord Andore's twenty-first birthday. They had answered with joyful acceptance and a great deal of violet ink. The day drew closer and closer. With such a real pleasure waiting for them, it hardly seemed worthwhile to begin any new piece of magic.
        - id: ch01-b52
          speaker: narrator
          text: Then came the very day before the great day. The roundabouts had arrived and were already standing in place. From its appointed field, the menagerie howled in the most inviting way. And that was when, as Charlotte said, their cup of joy was dashed into little pieces. Lady Andore had slipped on an orange pip and broken her ankle. The whole celebration was postponed until September. The news came on a card, carried by the very footman who had once failed to know their names.
        - id: ch01-b53
          speaker: charles
          text: Well, he jolly well knows our names now.
        - id: ch01-b54
          speaker: narrator
          text: That was his only comfort.
        - id: ch01-b55
          speaker: charlotte
          text: There's many a pip between the cup and the lip.
        - id: ch01-b56
          speaker: caroline
          text: Oh, bother!
        - id: ch01-b57
          speaker: narrator
          text: Rupert said nothing at all. Of course he had been invited too, and at moments he had seemed pleased by the thought of going. Now he simply took his cap and went out. He did not come home until late for tea.
        - id: ch01-b58
          speaker: narrator
          text: The three C.'s were upset when they discovered where he had been, and their distress was mixed with anger. Rupert had gone to the menagerie all by himself and seen every one of the animals. The circus people had decided it was worth giving a performance for any villagers willing to pay for their amusement, and Rupert had watched that too. He had seen everything the others had missed, from the accomplished elephants to the educated seals.
        - id: ch01-b59
          speaker: charles
          text: You might have told us you were going.
        - id: ch01-b60
          speaker: rupert
          text: You could have gone too, if you'd wanted.
        - id: ch01-b61
          speaker: caroline
          text: Never mind, Charles. We'll ask Uncle to take us tomorrow.
        - id: ch01-b62
          speaker: rupert
          text: They're leaving tomorrow. That's why I went today.
        - id: ch01-b63
          speaker: narrator
          text: Then he added a bitter remark about a parcel of kids. The words were almost more than the three C.'s could bear.
        - id: ch01-b64
          speaker: narrator
          text: But the circus did not leave the next day after all. An accident had happened. Something was missing, though no one at the house yet knew what it was. Whatever the missing thing might be, the circus could not go on with its travels until it had been found.
        - id: ch01-b65
          speaker: harriet
          text: I don't know what they've lost, but it's something they set great store by. Some people say it's an improving seal. Others say it's a boar-conjector snake. Then Poad told my gentleman friend that the white-eyed Kaffir had made a dash for freedom and India's coral strand, where he was stolen from as a baby. I can't tell you the rights of it myself. But they did send for Poad. My gentleman friend will know everything the next time I see him.
        - id: ch01-b66
          speaker: charles
          text: When will you see him again?
        - id: ch01-b67
          speaker: harriet
          text: Whenever I choose. I'm not one of those girls who has to chase after her gentleman friend.
        - id: ch01-b68
          speaker: charlotte
          text: I wonder what it is. Please see your friend soon and ask him, Harriet. I do hope it isn't snakes or bears. You'll tell us the moment you know, won't you?
        - id: ch01-b69
          speaker: harriet
          text: Sure.
        - id: ch01-b70
          speaker: narrator
          text: Harriet promised that she would tell them. But in the end, it was not from Harriet or her gentleman friend that the children learned the truth. William was the one who told them what the circus had really lost.
        - id: ch01-b71
          speaker: william
          text: It's a tame le-o-pard. The spotted sort that can't change its spots, with a long tail.
        - id: ch01-b72
          speaker: charlotte
          text: I know what they look like. There's a leopard skin in the drawing room, covered in spots. I believe they're fierce too. Oh, William, I hope it doesn't come here!
        - id: ch01-b73
          speaker: caroline
          text: There's something about leopards in one of our books. I'm sure I remember seeing it.
        - id: ch01-b74
          speaker: narrator
          text: As usual, Caroline had her magic books tucked under her arm. She remembered seeing something that might help and began to search. At last she found the place. The heading read, “Leopard's-bane, its government and virtues.” What followed was quite a long passage, and Caroline read the whole thing aloud.
        - id: ch01-b75
          speaker: caroline
          text: This plant is governed by Apollo. Leopards and all creatures of their kind fear and hate its flowers and leaves. If the herb is scattered on the paths these dreadful beasts often use, they cannot pass over it. Instead, each beast must turn around and meekly go back to its own place. Ancient people believed this, and so have philosophers in our own time. They say the herb can turn the hearts of fierce spotted cats to water. It can even loosen the strings of their tongues, until the beasts speak in the language of men and tell strange and wonderful things. But the author cannot promise that part is true. Leopards do not belong to this country, unless some are hidden in Northumberland or Wales, where any wild thing might be concealed.
        - id: ch01-b76
          speaker: william
          text: Thank you kindly. Quite pretty, isn't it?
        - id: ch01-b77
          speaker: narrator
          text: Rupert called it all nonsense.
        - id: ch01-b78
          speaker: charlotte
          text: But it won't come this way, will it?
        - id: ch01-b79
          speaker: william
          text: They call it tame. At least, that's the character it got from its last employer. But I don't expect it'll be quite tame enough for Poad. I hear he's been given the job of catching it, and it serves him right too.
        - id: ch01-b80
          speaker: charlotte
          text: Why does it serve him right?
        - id: ch01-b81
          speaker: william
          text: Because it does.
        - id: ch01-b82
          speaker: narrator
          text: William's answer was so short that they told him not to be cross when nothing was the matter.
        - id: ch01-b83
          speaker: william
          text: It isn't nothing. I've got a reason. It's the way Poad behaved about my dog license. My dog was only two months past puppy age. At that age, no license is taken out, and no one has any business asking for one either.
        - id: ch01-b84
          speaker: rupert
          text: I don't care much for Poad either. He didn't need to be so eager to catch me.
        - id: ch01-b85
          speaker: william
          text: That's where you're wrong. Hunting you was nothing more than Poad's duty. If he went about it like a jackape, well, some men are born foolish and can't help it. There's no sense blaming a man for that. But my dog was different. Pincher was none of Poad's duty, and Poad went too far over him. I don't bear malice, but one day I'll get even with Poad for what he did about that dog.
        - id: ch01-b86
          speaker: rupert
          text: How will you do that?
        - id: ch01-b87
          speaker: william
          text: Oh, I'll find a way. There's no hurry at all. A deed like the one Poad did over my Pincher always comes home to roost in the end. Now then, Miss Charlotte, leave that saddle soap alone. All of you get along into the garden. The gates have been locked since eight this morning, so you must use the secret way today. And don't go outside the garden, on account of that old spotted le-o-pard.
        - id: ch01-b88
          speaker: narrator
          text: The three C.'s obeyed and went through to the garden. Rupert did not follow them. He lingered beside William instead, touching the bright buckles on the harness and passing the smooth reins slowly through his fingers.
        - id: ch01-b89
          speaker: narrator
          text: For some time, the three C.'s were very busy in the garden. The warning about the escaped leopard had given their work a real purpose. They searched among the plants and gathered all that they could find of the herb they needed. Soon they had a great many green leaves shaped like hearts, along with delicate golden flowers that looked rather like daisies. They carried the green and yellow harvest back toward the terrace together.
        - id: ch01-b90
          speaker: caroline
          text: When I read about this plant in The Language Of and in the medicine book, I never dreamed we would actually need it. But look at what it says. Leopards are afraid of the flowers and leaves. If we scatter them across a path the leopard uses, it cannot cross. It has to turn around and go meekly back where it came from. The old writers even believed the herb could soften the heart of a fierce spotted cat. They said it might loosen the leopard's tongue too, so that it could speak like a person and tell strange and wonderful things.
        - id: ch01-b91
          speaker: narrator
          text: Caroline opened the brown book and sat down on the terrace steps. Beside her lay a whole sheaf of green leaves and yellow flowers. The book had told them exactly what power the plant was supposed to have. Now the herb was gathered and ready, if only the children could discover how to put it in the leopard's path.
        - id: ch01-b92
          speaker: caroline
          text: So, you see.
        - id: ch01-b93
          speaker: charlotte
          text: That's all very well, and we've gathered plenty of the plant. But how, exactly, are we supposed to carry the leopard's-bane out and get it anywhere near the leopard?
