audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 温暖机敏，带着克制的幽默讲述
        timbre: 清澈柔和
        pace: 从容而富有变化
        pitch: 中音
    caroline:
      display_name: 卡罗琳
      tts:
        delivery: 大方热情，努力摆出长姐的懂事
        timbre: 明亮清脆
        pace: 自然轻快
        pitch: 中高音
    charlotte:
      display_name: 夏洛特
      tts:
        delivery: 活泼直率，想到什么便说什么
        timbre: 轻盈清亮
        pace: 偏快
        pitch: 高音
    charles:
      display_name: 查尔斯
      tts:
        delivery: 淘气认真，笑话总说得一本正经
        timbre: 清亮的男孩声
        pace: 轻快
        pitch: 中高音
    rupert:
      display_name: 鲁珀特
      tts:
        delivery: 直爽开朗，病中说话虚弱而迷糊
        timbre: 清亮的少年声
        pace: 自然，发烧时忽快忽慢
        pitch: 中高音
    harriet:
      display_name: 哈丽雅特
      tts:
        delivery: 机灵健谈，带着年轻女佣爽快的口气
        timbre: 清脆明快
        pace: 偏快
        pitch: 中高音
    william:
      display_name: 威廉
      tts:
        delivery: 朴实机灵，挖苦话说得不动声色
        timbre: 粗朴温和
        pace: 自然
        pitch: 中低音
  chapters:
    - id: ch01
      title: 第十七章　花——豹
      blocks:
        - id: ch01-b01
          speaker: caroline
          text: |-
            我们真得给埃梅琳姨妈写信了。我有三支新钢笔，还有昨天买的紫罗兰香墨水，可好闻了。她和珀西瓦尔姨父寄来的风景明信片，我刚数过，一共四十二张。我们上次写信以后，人家又寄来了二十八张呢。
        - id: ch01-b02
          speaker: charles
          text: |-
            那些明信片还不如不来呢。欠着信的时候一看见，心里就难受。要不我们也给他们寄明信片吧？不用写那么多字。
        - id: ch01-b03
          speaker: charlotte
          text: |-
            那不成了偷懒吗？来吧，非写不可就写。事到临头，规矩也顾不上了。
        - id: ch01-b04
          speaker: narrator
          text: |-
            夏洛特自己也不想出门，所以这话至少有一多半是认真的。查尔斯倒好心地叫上了鲁珀特。
        - id: ch01-b05
          speaker: charles
          text: |-
            鲁珀特，你也写一封吧。添几句拉丁文，他们准喜欢。或者你教我一句也行，把拼法告诉我，我来写。
        - id: ch01-b06
          speaker: narrator
          text: |-
            鲁珀特说自己懒得费这个劲，从书架上拿了一本杰西的《狗的轶事》。那本书原本很能吸引人，插图诱人，故事也妙趣横生。他看着摊开的书页，却一个字都没真正读进去。
        - id: ch01-b07
          speaker: narrator
          text: |-
            卡罗琳正在拼“阿魏”这个词。医书说，它能治研读印刷书籍太久引起的头痛。这个词该怎么写，她一点把握也没有，正苦恼得要命。她抬起头，发现鲁珀特正凄然瞪着壁炉架上方那幅画像。画里的人是埃莉诺夫人。他的眼睛虽然朝着画像，心里却仿佛根本没看见它。
        - id: ch01-b08
          speaker: charlotte
          text: |-
            她多神气呀！她才真正懂得咒语。我们的法术大半都是照她的书做的。
        - id: ch01-b09
          speaker: rupert
          text: |-
            她要是真懂，就该知道那些全是臭得不能再臭的胡说。你们每回施法，挑的都是不用念咒也照样会发生的事。
        - id: ch01-b10
          speaker: caroline
          text: |-
            你说我的拼法怎么了？
        - id: ch01-b11
          speaker: narrator
          text: |-
            她凭记忆大胆写下一个“阿——薇——洛——黛”，纸上顿时多了一团刺眼的紫墨。
        - id: ch01-b12
          speaker: rupert
          text: |-
            我说的是，你们的魔法根本不是真的。
        - id: ch01-b13
          speaker: caroline
          text: |-
            可你隐身的时候，我们明明看见——
        - id: ch01-b14
          speaker: narrator
          text: |-
            卡罗琳放下钢笔。湿笔尖一干，颜色便从紫色变成金绿相间的古铜色。鲁珀特打断了她。
        - id: ch01-b15
          speaker: rupert
          text: |-
            是，我知道。可魔法要真管用，你们怎么不做件自然之力绝对办不到的事？拉丁文叫“in puris naturalatibus”，就是单凭自然的意思。你们怎么不把威尔明顿太太走失的猫找回来？或者找出我的科伊诺铅笔？彭福尔德先生还有一本书，里面写着另一种法术，他讲给我听过。先照仇人的样子做个蜡像，再拿针去扎。每扎一针，那个仇人身上相同的地方就会疼。
        - id: ch01-b16
          speaker: caroline
          text: |-
            这也太邪恶了！
          emotion: surprised
        - id: ch01-b17
          speaker: rupert
          text: |-
            还可以把蜡人放在火前烤。蜡慢慢融掉，那个人也会一点点消瘦下去。
        - id: ch01-b18
          speaker: charlotte
          text: |-
            噢，别说了！
        - id: ch01-b19
          speaker: charles
          text: |-
            说呀，还有什么？
        - id: ch01-b20
          speaker: rupert
          text: |-
            没别的了。要是能弄到仇人的一绺头发，放到蜡人头上，效果更好。彭福尔德先生还从一首诗里念了几段给我听。
        - id: ch01-b21
          speaker: caroline
          text: |-
            他没告诉你，这么做很邪恶吗？
        - id: ch01-b22
          speaker: rupert
          text: |-
            说了。可什么叫邪恶，用不着彭福尔德先生教我，更不用你教。想想仇人挨针扎时会怎么扭吧。你扎的是针，他挨的可像一剑一剑刺进身体。
        - id: ch01-b23
          speaker: caroline
          text: |-
            别说了，鲁珀特，太可怕了。求你别说了，我不想听这种咒语。
          emotion: fearful
        - id: ch01-b24
          speaker: charles
          text: |-
            他当然不会真做，只是嘴上说说。
        - id: ch01-b25
          speaker: rupert
          text: |-
            你怎么知道我不会？卡罗琳，下次你腿疼，准会以为是长个儿疼。其实呀，是我偷偷做了你的蜡像，正拿一根长帽针往上扎呢。
          emotion: angry
        - id: ch01-b26
          speaker: narrator
          text: |-
            卡罗琳站了起来。
        - id: ch01-b27
          speaker: caroline
          text: |-
            走吧，夏尔。他再这么说，我们就去客厅坐。
        - id: ch01-b28
          speaker: charles
          text: |-
            他不是当真的。
        - id: ch01-b29
          speaker: rupert
          text: |-
            我当然不是当真的。我也不知道刚才为什么那么说。别犯傻了。还有许多不会伤人的法术可以试嘛。你们怎么不……
        - id: ch01-b30
          speaker: narrator
          text: |-
            鲁珀特忽然笑了。他茫然地看看四周，目光又落在画像上。
        - id: ch01-b31
          speaker: rupert
          text: |-
            怎么不让她活过来？她要真是女巫，她的画像至少该经得起这种法术。
        - id: ch01-b32
          speakers: [caroline, charlotte, charles]
          ensemble: chorus
          text: |-
            真希望我们能办到。
        - id: ch01-b33
          speaker: rupert
          text: |-
            那就做呀。这种事真做成了，我才会信。别再做我来了以后看见的那些傻事。
        - id: ch01-b34
          speaker: narrator
          text: |-
            屋里静了一会儿。
        - id: ch01-b35
          speaker: charles
          text: |-
            “不可能”怎么拼？
        - id: ch01-b36
          speaker: narrator
          text: |-
            随后只剩下紫墨水钢笔在纸上的沙沙声。从此以后，不管眼前又冒出什么事情，夏洛特心里始终留着那个主意。别的念头来了又走，它却总会绕回来。要是那幅画像真能活起来，该有多好！
        - id: ch01-b37
          speaker: narrator
          text: |-
            查尔斯的想象也小心翼翼地碰了碰蜡人这个主意。他当然不想伤害蜡像所代表的人，只想知道究竟会不会发生什么。他绝不会用针。只要把蜡像藏进口袋，等那个人也在旁边时，极轻、极轻、极轻地捏一下蜡像的脚，偷偷看看那个人会不会跳起来，或者叫出声。毕竟，人要是突然挨了掐，不管那一下多轻，也会跳会叫。
        - id: ch01-b38
          speaker: narrator
          text: |-
            夏洛特想的却是，鲁珀特到底怎么了，他们能不能帮帮他。事情很清楚，鲁珀特根本不是他们起初以为的那种人。有时他会非常快活，快活得正像大家最希望一个男孩有的样子。他会想出新游戏，也能把游戏玩得又有趣又称心。可早早晚晚，而且通常很早，他身上那盏生命之灯便像熄灭了。他忽然不只厌倦眼前的游戏，还厌倦所有事情。不只厌倦所有事情，还会生所有人的气。
        - id: ch01-b39
          speaker: charlotte
          text: |-
            我肯定他中了魔法。说不定有人照他做了蜡像。那个人一扎针，他就突然凶起来。
        - id: ch01-b40
          speaker: narrator
          text: |-
            两个女孩一边梳头一边说悄悄话时，夏洛特不止一次这样猜。
        - id: ch01-b41
          speaker: caroline
          text: |-
            这个我可真觉得是胡说。这种事一定不会获准发生。
        - id: ch01-b42
          speaker: narrator
          text: |-
            一天夜里，夏洛特把卡罗琳叫醒。
        - id: ch01-b43
          speaker: charlotte
          text: |-
            一个人的心要怎么做成蜡像？
        - id: ch01-b44
          speaker: caroline
          text: |-
            做不了。快睡吧。
        - id: ch01-b45
          speaker: charlotte
          text: |-
            我觉得做得了。历史书上有个人的肖像，画下面写着，那幅画连他的心灵也画出来了。心灵既然能画出来，当然也能做成蜡像。我看准是有人把鲁珀特的心做成了蜡像。你说呢？那个人还拿刀往上扎。噢，好吧，你偏要睡就睡吧！
        - id: ch01-b46
          speaker: narrator
          text: |-
            日子一天天过去，鲁珀特的脾气越来越坏，也越来越不愿跟三个C待在一起。他常常独自出门，走很远很远的路。比起孩子们，他仿佛更愿意陪能“容忍”他的威廉，甚至愿意陪把他宠上天的威尔明顿太太。
        - id: ch01-b47
          speaker: charlotte
          text: |-
            我们原以为他来了会多有趣呢。最糟的是，查尔斯也学他，有时说话真没礼貌，连对你也是这样，卡罗。你知道，他以前最喜欢你。
          emotion: sad
        - id: ch01-b48
          speaker: narrator
          text: |-
            鲁珀特似乎只有一样东西始终真心喜欢，那就是游泳。他几乎每天跟彭福尔德先生一起去河边。有时两人也会直接在游泳的地方会合，然后一同下水。跟彭福尔德先生相处时，鲁珀特差不多总会显出最好的一面。也许正因为他没有显出最好一面时，彭福尔德先生从来不露出已经注意到的样子。
        - id: ch01-b49
          speaker: narrator
          text: |-
            安多尔勋爵的成年庆典越来越近，村里也一天比一天忙，一天比一天兴奋。村民把那场庆典叫作“盛大游园会”。游园会要在勋爵的园林和旁边几片草地上举行。那里会有旋转木马、椰子投掷摊和射击场，还会来一个货真价实的马戏团。马戏团带着动物园、会表演的大象和训练有素的海豹。这一切全都免费。
        - id: ch01-b50
          speaker: narrator
          text: |-
            孩子们眼巴巴盼着那一天。安多尔勋爵还送来了请帖。上面印着他母亲和他的名字，又手写了每个孩子的名字，请他们光临自己的二十一岁生日庆典。孩子们兴高采烈地接受了邀请，回信时当然也用了不少紫罗兰墨水。那一天越来越近。既然眼前有这样一件真真切切的乐事可盼，谁还觉得值得去忙新的魔法呢？
        - id: ch01-b51
          speaker: narrator
          text: |-
            可就在庆典前一天，旋转木马已经运来架好，动物园也在指定的场地里发出诱人的吼声时，那杯快乐却一下摔得粉碎。这是夏洛特的说法。安多尔夫人踩中一粒橙子籽，滑倒摔断了脚踝，庆典只好推迟到九月。通知写在一张卡片上。把卡送来的，正是以前连孩子们姓名都不知道的那个男仆。
        - id: ch01-b52
          speaker: charles
          text: |-
            他现在可太知道我们的名字了。
        - id: ch01-b53
          speaker: narrator
          text: |-
            这是查尔斯唯一能找到的安慰。
        - id: ch01-b54
          speaker: charlotte
          text: |-
            幸福举到嘴边，也会叫橙籽绊翻。
        - id: ch01-b55
          speaker: caroline
          text: |-
            真讨厌！
        - id: ch01-b56
          speaker: narrator
          text: |-
            鲁珀特没说话。他当然也收到了邀请，有几次看起来还挺高兴。现在却只拿上帽子出门，直到下午茶都迟到了才回来。三个C这才知道，鲁珀特独自去了动物园，看过里面所有的野兽。他甚至看了马戏团的一场演出。那些马戏演员觉得，既然有村民肯花钱找乐子，演一场也很值得。从技艺高超的大象到训练有素的海豹，鲁珀特一样也没错过。三个C听了，既难过，又生气。
        - id: ch01-b57
          speaker: charles
          text: |-
            你要去，本来可以告诉我们一声。
        - id: ch01-b58
          speaker: rupert
          text: |-
            你们想去，自己也可以去。
        - id: ch01-b59
          speaker: caroline
          text: |-
            算了，查尔斯。明天我们请舅舅带我们去。
        - id: ch01-b60
          speaker: rupert
          text: |-
            他们明天就走，所以我今天才去。
        - id: ch01-b61
          speaker: narrator
          text: |-
            他又说了句尖酸得叫人几乎受不了的话，大意是“小毛孩子们”怎样怎样。
        - id: ch01-b62
          speaker: narrator
          text: |-
            然而事情后来有了变化，马戏团第二天并没有离开。那里出了意外，有一样东西不见了。在把那样东西找回来以前，整个马戏团都没法收拾行装，继续到下一处地方去。哈丽雅特吃早餐时，把自己听来的消息告诉了孩子们。
        - id: ch01-b63
          speaker: harriet
          text: |-
            究竟是什么，我也不知道。反正他们丢了样看得很宝贝的东西。有人说，是只上进的海豹。也有人说，是条大蟒推测蛇。波德告诉我的男朋友，说是那个白眼睛的卡菲尔人逃出去追求自由了，还要奔回印度的珊瑚海岸。他还是婴儿时，就是从那里被偷来的。可事情到底怎样，我也不清楚。他们已经把波德叫去了。下回见到男朋友，他准知道全部内情。
        - id: ch01-b64
          speaker: charles
          text: |-
            你什么时候再见他？
        - id: ch01-b65
          speaker: harriet
          text: |-
            我想见就见。我可不是那种非得追着男朋友跑的人。
        - id: ch01-b66
          speaker: charlotte
          text: |-
            真想知道丢了什么。哈丽雅特，你尽快见他，替我们问问，好不好？但愿不是蛇，也不是熊。你一知道，就马上告诉我们，好不好？
        - id: ch01-b67
          speaker: harriet
          text: |-
            当然。
        - id: ch01-b68
          speaker: narrator
          text: |-
            然而到了最后，他们还是从威廉那里，才确切听说马戏团真正丢了什么东西。
        - id: ch01-b69
          speaker: william
          text: |-
            是只驯服的花——豹。就是斑点怎么也改不了，还拖着长尾巴的那种。
        - id: ch01-b70
          speaker: charlotte
          text: |-
            我知道，客厅里就有一张豹皮。豹子身上的斑点可多了，而且我听说，它们还很凶。噢，威廉！但愿这只豹子别往我们这边来！
        - id: ch01-b71
          speaker: caroline
          text: |-
            书里写过豹子。
        - id: ch01-b72
          speaker: narrator
          text: |-
            卡罗琳像平常一样，胳膊下面夹着魔法书。她翻到那一页，念起“豹见愁的星辰主宰与功效”。那是很长的一段。她从头一直念到尾，威廉才像客客气气听完了似的开了口。
        - id: ch01-b73
          speaker: william
          text: |-
            多谢啦，写得挺漂亮，是不是？
        - id: ch01-b74
          speaker: narrator
          text: |-
            鲁珀特却说，这全是胡说。
        - id: ch01-b75
          speaker: charlotte
          text: |-
            可它不会往这边来，对不对？
        - id: ch01-b76
          speaker: william
          text: |-
            它是驯服的，至少上一处东家给它的评语是这样。不过真碰到波德，我看它不会驯服得太过分。听说抓回这只豹子的差事落到他头上了。这也正是他活该。
        - id: ch01-b77
          speaker: charlotte
          text: |-
            噢，为什么？
        - id: ch01-b78
          speaker: william
          text: |-
            因为就是因为。
        - id: ch01-b79
          speaker: narrator
          text: |-
            威廉答得没好气。孩子们说他不该平白发脾气。
        - id: ch01-b80
          speaker: william
          text: |-
            才不是平白无故。还不是他办我那张狗证时的德行。我的狗才刚超过小狗的岁数两个月，照规矩既不用领证，也没人该来查。
        - id: ch01-b81
          speaker: rupert
          text: |-
            我也不大喜欢波德。他抓我的时候，根本不必那么卖力。
        - id: ch01-b82
          speaker: william
          text: |-
            这你可说错了。追捕你不过是波德的职责。他办差时像只蠢猴，那也没办法。有些人生来就傻，自己也管不了，何必怪他？可我的狗根本不归他管。狗的事情上，是波德越了界。他的确越了界。我这个人不记仇，不过这笔狗账，迟早总要跟他算平。
        - id: ch01-b83
          speaker: rupert
          text: |-
            怎么算？
        - id: ch01-b84
          speaker: william
          text: |-
            噢，我总能想出办法，不用着急。波德对我的小咬做了那种事。像这样的事，早晚会回到做事的人自己头上。准会的。
        - id: ch01-b85
          speaker: william
          text: |-
            好了，夏洛特小姐，别碰那块鞍皂了，快到花园去。今天早上八点起，大门全锁上了。你们得走秘密通道，而且不许出花园，免得撞上那只老斑点花——豹。
        - id: ch01-b86
          speaker: narrator
          text: |-
            三个C听话走了，鲁珀特却磨磨蹭蹭，仍留在威廉身旁。他一会儿拨弄马具上闪亮的扣子，一会儿又把光滑的缰绳慢慢从手指间抽过去。
        - id: ch01-b87
          speaker: narrator
          text: |-
            有好一阵，三个C都在花园里忙着。他们采下心形的绿叶，又采下金色的花朵。那些花像雏菊一样，纤细又娇嫩。卡罗琳抱着这一大束黄绿相间的花叶，坐到露台台阶上，这才翻开那本棕色封皮的书。
        - id: ch01-b88
          speaker: caroline
          text: |-
            我在《花语》和医书里读到它时，从没想到真会用上。你们听，书上说：“此草归阿波罗主宰。豹子和它的同类，全都害怕、憎恶这种花与叶。若把它撒在这些凶兽常走的小路上，它们就不能通过，只能回头，各自回到原来的地方，变得温顺而臣服。古人，还有今天的哲人，都曾认为这种草含有咒力。它能让暴烈的斑点巨猫心化成水，也能松开它们舌头上的绳索。这样，它们便会开口说人话，说出奇异又绝妙的事。不过作者不能断定这说法是真是假，因为豹子并不是这里土生的野兽。除非诺森伯兰和威尔士也有豹子，毕竟一切野物都可能藏在那两个地方。”
        - id: ch01-b89
          speaker: caroline
          text: |-
            所以，你们看。
        - id: ch01-b90
          speaker: narrator
          text: |-
            夏洛特却说，书上讲得好听没用，他们怎么把豹见愁送到豹子那里去？
        - id: ch01-b91
          speaker: charlotte
          text: |-
            我们又不许自由进出。真希望大人别防得那么严。只要我们身上带着豹见愁，豹子绝不会伤害我们。我们还可以像拿白蜡树叶围住蛇一样，用豹见愁把豹子包围起来。那样它就无路可走，非投降不可。
        - id: ch01-b92
          speaker: charlotte
          text: |-
            说不定它还会跟我们讲话，再像温顺的小鹿一样跟在后面。也可能像尤娜身边那一只，不过她带的是狮子。
        - id: ch01-b93
          speaker: charles
          text: |-
            胡说，你明明会害怕。
        - id: ch01-b94
          speaker: charlotte
          text: |-
            我才不会。
        - id: ch01-b95
          speaker: charles
          text: |-
            你会。
        - id: ch01-b96
          speaker: charlotte
          text: |-
            我不会。
        - id: ch01-b97
          speaker: charles
          text: |-
            你会。
        - id: ch01-b98
          speaker: charlotte
          text: |-
            我不会。
        - id: ch01-b99
          speaker: charles
          text: |-
            你会。
        - id: ch01-b100
          speaker: caroline
          text: |-
            你们两个现在跟鲁珀特一模一样。你们只顾吵架，豹子还没被豹见愁管住，正在外面乱逛。简直像尼禄和罗马。
        - id: ch01-b101
          speaker: narrator
          text: |-
            他们足足吵了二十分钟，才重新和好。那段时间里，豹见愁一直躺在阳光下面，慢慢蔫了。一堆堆娇嫩的金黄和翠绿，也一点点被压得越来越扁。
        - id: ch01-b102
          speaker: charles
          text: |-
            好吧，你既然不怕，我们就去。除了威廉，也没人禁止我们出去。
        - id: ch01-b103
          speaker: charlotte
          text: |-
            你去，我就去。
        - id: ch01-b104
          speaker: narrator
          text: |-
            夏洛特涨红了脸。卡罗琳却白了脸。
        - id: ch01-b105
          speaker: caroline
          text: |-
            我也去。
        - id: ch01-b106
          speaker: charles
          text: |-
            今天早上你念豹见愁那一段时，鲁珀特说那是胡说。
        - id: ch01-b107
          speaker: charlotte
          text: |-
            他这么说，又不会让它真变成胡说。
        - id: ch01-b108
          speaker: charles
          text: |-
            可要是碰上豹子呢？
        - id: ch01-b109
          speaker: caroline
          text: |-
            只要沿大路走，就碰不上。豹子会爬到树上，不会像大象那样在路上走来走去。就算马戏团的人带着豹子赶路，也不会让它沿大路走。我们要办的可是件大事，别人以后怎么说我们，全看事情的结果。要是我们用豹见愁制住豹子，救了整个村子，就会成为女英雄，像……
        - id: ch01-b110
          speaker: charles
          text: |-
            还有男英雄。
        - id: ch01-b111
          speaker: caroline
          text: |-
            像圣女贞德，还有那个在加来从市民钥匙上吸出毒液的菲莉帕。
        - id: ch01-b112
          speaker: narrator
          text: |-
            可要是没把豹见愁放对地方，或者豹子根本不理它，别人只会说他们不听话。
        - id: ch01-b113
          speaker: charles
          text: |-
            要是跟豹子迎面撞上呢？
        - id: ch01-b114
          speaker: caroline
          text: |-
            那是只驯服的豹子。
          emotion: fearful
        - id: ch01-b115
          speaker: caroline
          text: |-
            噢，我不想去。我是真的害怕，我承认。我怕得不得了，所以才觉得自己应该去。正因为我一点儿也不想去，我才敢肯定，去做这件事是对的。不过，我希望你和查尔斯留下。万一豹子越过围墙，而这里一个能对付它的人也没有呢？
          emotion: fearful
        - id: ch01-b116
          speaker: narrator
          text: |-
            卡罗琳脸色煞白，身体也在发抖。她是真的怕极了。另外两个听完，却毫不犹豫。
        - id: ch01-b117
          speakers: [charlotte, charles]
          ensemble: duo
          text: |-
            想都别想！
        - id: ch01-b118
          speaker: narrator
          text: |-
            卡罗琳听了，显然松了口气。
        - id: ch01-b119
          speaker: caroline
          text: |-
            那就走吧。先在这里撒一点，保护园丁。噢，不对，这些草根本来就会让花园平安。大门锁着，我们得走秘密通道，再悄悄穿过马厩院子，贴着花园围墙走，别让威尔明顿太太看见。最后从废弃的门房出去。
