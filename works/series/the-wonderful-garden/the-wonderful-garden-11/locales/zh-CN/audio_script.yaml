audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 温暖机敏，带着克制的幽默讲述
        timbre: 清澈柔和
        pace: 从容而富有变化
        pitch: 中音
    caroline:
      display_name: 卡罗琳
      tts:
        delivery: 大方热情，努力摆出长姐的懂事
        timbre: 明亮清脆
        pace: 自然轻快
        pitch: 中高音
    charlotte:
      display_name: 夏洛特
      tts:
        delivery: 活泼直率，想到什么便说什么
        timbre: 轻盈清亮
        pace: 偏快
        pitch: 高音
    charles:
      display_name: 查尔斯
      tts:
        delivery: 淘气认真，笑话总说得一本正经
        timbre: 清亮的男孩声
        pace: 轻快
        pitch: 中高音
    mrs_wilmington:
      display_name: 威尔明顿太太
      tts:
        delivery: 谨慎严肃，字句里带着管家的规矩
        timbre: 紧致清楚
        pace: 稍慢
        pitch: 中音
    uncle:
      display_name: 舅舅
      tts:
        delivery: 和善拘谨，说话时总带一点不安
        timbre: 温和单薄
        pace: 从容
        pitch: 中音
  chapters:
    - id: ch01
      title: 第十一章　玫瑰十字会会员
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: |-
            庄园宅邸的客厅一直锁着。威尔明顿太太亲自进去掸灰，钥匙也总揣在口袋里。舅舅曾说，她原本以为三个孩子会打坏屋里所有的东西。从此，三个C便常常猜想，客厅向来如此，还是专为防他们才锁起来的。
        - id: ch01-b02
          speaker: charles
          text: |-
            我看，这是特意向我们表示敬意。
        - id: ch01-b03
          speaker: caroline
          text: |-
            八成就是这样。客厅本来就是给人坐的。威尔明顿总会料到有人进去，不然何必掸得那么仔细？
        - id: ch01-b04
          speaker: charlotte
          text: |-
            前几天她掸灰，我往里瞧过一眼。只看到一小块粉红配灰色的地毯，还有一个黑柜子的角，上头画着树、鸟和金色的中国人。桌上的汤盆用红兔子头做把手。还有一面圆镜子，照出来的屋子小小的，样子也有点走形。哈丽雅特说那叫“罪犯镜”。她还说，屋里尽是好东西。
        - id: ch01-b05
          speaker: charles
          text: |-
            你怎么不问她，客厅是不是为了向我们表示敬意才锁上的？
        - id: ch01-b06
          speaker: charlotte
          text: |-
            我当然不能往哈丽雅特脑子里塞这种念头呀。
        - id: ch01-b07
          speaker: narrator
          text: |-
            卡罗琳也觉得，一问就等于不打自招。其实，三个C早把客厅的门把手转过许多遍了。他们每次都盼着，威尔明顿太太会不会偏偏在这一次忘记上锁。可是她从没忘过。越是进不去，三个孩子对屋里的兴趣就越浓。偏偏这天又下雨，正适合细看柜子上金色的中国人，也适合瞧瞧凸面镜会把自己照成什么怪样子。客厅却牢牢锁着，谁也享受不到这些乐趣。
        - id: ch01-b08
          speaker: narrator
          text: |-
            鲁珀特仍在床上。医生已经断定不是麻疹，可正是这场发热的重感冒，先前才叫人疑心起麻疹来。眼下，他除了躺在床上，哪里也去不了。其他孩子每次只准进去看他几分钟。哈丽雅特说，威尔明顿太太喜欢上这位新来的小少爷了，喜欢得简直叫人不敢相信。这天下午，她正在床边给鲁珀特念《准备号上的船长》。此前她还特意从自己房里取来《埃里克，或一步一步》，想念给他听。结果鲁珀特宁可用手指堵住耳朵，也不肯听那本书。
        - id: ch01-b09
          speaker: charlotte
          text: |-
            眼下正是紧要关头。我们想办法进去吧。威尔明顿已经稳稳当当走开了，来吧！
        - id: ch01-b10
          speaker: charles
          text: |-
            好，来吧。
        - id: ch01-b11
          speaker: caroline
          text: |-
            别去。舅舅也许不愿意让我们进去。说不定屋里藏着了不得的秘密，只有一家之主和他忠心的威尔明顿知道。舅舅一直待我们这么好，我们还是去问她要钥匙吧。
        - id: ch01-b12
          speaker: narrator
          text: |-
            另外两个听完就笑了。查尔斯说，卡罗琳明明知道，向威尔明顿太太要钥匙根本行不通。卡罗琳倒觉得客厅里不会真的有秘密。舅舅如今已经加入秘密玫瑰皇家骑士团，而骑士团那条永不更改的格言正是，所有秘密，一人一半。
        - id: ch01-b13
          speaker: charles
          text: |-
            真有那种事，他早就毫无保留地告诉我们了。这回我赞成卡萝。
        - id: ch01-b14
          speaker: charlotte
          text: |-
            哎呀，我有主意了！画像里的夫人胳膊底下还有一本书，我们再去找找吧。舅舅对鲁珀特那么好，替他找书，是我们欠他的一份神圣责任。
        - id: ch01-b15
          speaker: charles
          text: |-
            客厅的门把手跟这扇一模一样，晨间起居室和书房的也一样。拿餐厅门上的钥匙试试看。
        - id: ch01-b16
          speaker: caroline
          text: |-
            求你别这样。出了事，人人总责怪年纪最大的那个。查尔斯，真希望你才是最大的。
        - id: ch01-b17
          speaker: charles
          text: |-
            要是办得到，我早就当了。走吧。
        - id: ch01-b18
          speaker: caroline
          text: |-
            不行。我去问舅舅准不准。宁可打扰他，也别钻进他不许我们去的地方。他说“可以”，我们就进去。他说“不行”，我们就会庆幸自己没有擅自闯进去。
        - id: ch01-b19
          speaker: charles
          text: |-
            里面能有什么东西，是他不愿让我们看的？
        - id: ch01-b20
          speaker: charlotte
          text: |-
            什么都可能。也许有成群的活蝴蝶，午饭后才放出来，下午茶铃一响又飞回笼子里。不过，卡萝说得对，我们该问问舅舅。
        - id: ch01-b21
          speaker: charles
          text: |-
            蝴蝶那一套纯粹是胡扯。它们会到处产卵，还会不停变成茧。我养过蚕，我知道。
        - id: ch01-b22
          speaker: charlotte
          text: |-
            那就算一条蛇吧。一条大得不得了的蛇王，头上戴着王冠。每天下午两点到四点，它从柜里爬出来，把长长的身子缠在家具腿上。你要是进去，它也会缠你的腿。我猜它才不在乎是哪一种腿。
        - id: ch01-b23
          speaker: charles
          text: |-
            我喜欢蛇。卡萝想找舅舅，就让她去吧。
        - id: ch01-b24
          speaker: narrator
          text: |-
            结果三个人谁也没有留下，全都去找舅舅。为了表示尊敬，他们决定先稍微洗一洗。卡罗琳说，求人办事的时候，人家总喜欢你干干净净的。夏洛特却抱怨，不管要做什么，大人总少不了一句“洗一洗”。依她看，简直是生命不息，肥皂不止。嘴上虽然这样说，她到底也跟着洗了。
        - id: ch01-b25
          speaker: narrator
          text: |-
            三个孩子站在书房门外的羊皮垫子上，忐忑地停了一会儿。查尔斯问要不要敲门。卡罗琳说，进起居室不用敲门，便把门推开了三英寸又八分之三。
        - id: ch01-b26
          speaker: uncle
          text: |-
            谁在那里？我说过多少遍，无论找什么借口都不许打扰我？
        - id: ch01-b27
          speaker: charles
          text: |-
            我们没有找借口——
        - id: ch01-b28
          speaker: caroline
          text: |-
            这是秘密玫瑰会派来的破坏团。
        - id: ch01-b29
          speaker: uncle
          text: |-
            我看得出来。可我正忙着，没工夫玩。
        - id: ch01-b30
          speaker: narrator
          text: |-
            单听口气就知道，舅舅正用大拇指按住书页，生怕松手以后找不到刚才读到哪里。
        - id: ch01-b31
          speaker: caroline
          text: |-
            我们不是来玩的，是想请您准许一件事。
        - id: ch01-b32
          speaker: uncle
          text: |-
            好吧。要是我接见这个代表团，你们能保证一个星期内不再来打扰吗？能保证就进来。
        - id: ch01-b33
          speaker: narrator
          text: |-
            书房里仿佛塞满了书。桌上、地板上、壁炉台和窗台上，到处都有。有摊开的，也有合上的。有新有旧，有美有丑。连墙壁都像普通人贴墙纸那样铺满了书。舅舅坐在宽大的绿皮书桌前，果然用拇指按着一本高高的棕色对开本。
        - id: ch01-b34
          speaker: caroline
          text: |-
            舅舅，我们想找遍整幢房子，寻找画像里少掉的另一本书，就是埃莉诺夫人的那本。您答应过可以找，可客厅锁着。
        - id: ch01-b35
          speaker: uncle
          text: |-
            哎呀，你们不能把门打开吗？
        - id: ch01-b36
          speaker: charles
          text: |-
            不能。威尔——我是说威尔明顿太太，把钥匙放在裙子底下的口袋里。
        - id: ch01-b37
          speaker: uncle
          text: |-
            哦，是这样吗？你们不会打坏东西吧？当然不会。既然都是秘密玫瑰会的会员，我就让你们走我的秘密门。
        - id: ch01-b38
          speaker: narrator
          text: |-
            舅舅拿一张折好的纸夹进书里，记住刚才读到的地方。他站起身，走到壁炉旁边。那里有扇低矮狭窄的小门，看上去只通向一只壁橱。舅舅走了进去，孩子们紧跟在后面，来到一条铺着地毯的小走廊。左边的门关着，还上了闩。右边是一段楼梯，正前方也有一扇门。舅舅打开前面的门，粉红和灰色的玫瑰花地毯立刻露了出来，正是夏洛特先前看到的花样。客厅果然就在这里。
        - id: ch01-b39
          speaker: narrator
          text: |-
            他又领孩子们上楼，推开楼梯顶端的门。外面竟是他们熟悉的走廊，摆着鸟兽和鱼类标本，三人的卧室也都开在那里。
        - id: ch01-b40
          speaker: uncle
          text: |-
            这扇门的钥匙交给你们。以后想去客厅，随时都能去。只要别挪动东西，也别穿着泥靴进去，威尔明顿太太就不必知道。这是我们之间的秘密，算我对秘密玫瑰会的一点贡献。很像一场密谋，对不对？
        - id: ch01-b41
          speakers: [caroline, charlotte, charles]
          ensemble: chorus
          text: |-
            简直一模一样！
        - id: ch01-b42
          speaker: narrator
          text: |-
            他们又问，这是不是真正的秘密楼梯。
        - id: ch01-b43
          speaker: uncle
          text: |-
            不管怎样，现在是了。从前不过是一道普通的后楼梯。我不喜欢吵闹，才叫人把它封起来。
        - id: ch01-b44
          speaker: caroline
          text: |-
            我们保证每次都穿浴室拖鞋下来。舅舅，您真是个大宝贝！
        - id: ch01-b45
          speaker: narrator
          text: |-
            卡罗琳答应，以后他们一定穿着浴室拖鞋来。说完，三个孩子一起扑上去，给了舅舅一场颇为复杂的三重拥抱。舅舅只好由着他们抱，随后回去继续读那本棕色对开本。三个C则登上三级台阶，走进客厅。客厅的地面正好比外面高出这三阶，所以从屋外根本够不到那三扇窗，更别想扒着窗台往里偷看。
        - id: ch01-b46
          speaker: narrator
          text: |-
            三扇窗都挂着灰色和粉红色的锦缎窗帘，色彩正好配那块地毯。金框高镜子立在大理石边桌上，桌腿也闪着金光。还有边框带一圈圆疙瘩的圆镜子，以及下面伸出枝形烛台的椭圆镜子。角落里立着一架金色竖琴，琴弦竟然几乎一根也没断。旁边是一架用各色木片镶成的钢琴。卡罗琳真想坐下弹《苏格兰的蓝铃花》，再弹一曲海顿的《惊愕交响曲》。可那样一来，威尔明顿太太也会受到一场“惊愕”，所以连想都不能想。
        - id: ch01-b47
          speaker: narrator
          text: |-
            屋里还有雕着大象和狮子的印度柜子，也有装饰着官老爷和金色小脚仕女的中国柜子。象牙宝塔罩在玻璃里，蜡花也罩在玻璃里。一座座雕像高高立着，又白又冷。大大小小的盒子，有象牙雕的、乌木雕的、豪猪刺做的，还有一只用珍珠母和银制成的针线盒。靠垫和椅垫上的刺绣已经褪色。那些古老漂亮的椅子，有直背的，也有圆背的。头顶两盏水晶吊灯，看着就像倒挂过来的喷泉。瓷器更是什么样的都有，其中有个中国人瓷偶，只要你一走近，他就对着你摇起头来。
        - id: ch01-b48
          speaker: narrator
          text: |-
            有些老宅由同一家人一代接一代地住下去，住上许多年、许多年、许多年，你偶尔便会在那里见到这样的房间。先人留下来的美丽东西，每一代人都小心照料。他们自己再添上一两件美丽东西，交给后来的下一代接着照料。客厅里的收藏就是这样一点一点积起来的。光是从这一件看到那一件，不用做别的，也足够快活地消磨一个钟头。三个C望着满屋宝贝，还欢欢喜喜地记起一件很要紧的事。舅舅只说不能挪动东西，并没有不准他们伸手去碰。
        - id: ch01-b49
          speaker: narrator
          text: |-
            孩子只要始终记着自己一定得小心，不让心思溜到别处去，也能小心得叫人吃惊。三个C看遍了每一样东西，也用手碰了许多样，却什么都没有打破，连一点损伤也没留下。接着，他们挨个查看柜子，打开所有柜门，拉出每一个抽屉，只盼里面会有个秘密夹层，正好藏着“那本书”。可是，他们只找到了硬币、奖章、国际象棋子、西洋跳棋子和挑棒，还有色彩鲜亮的外国贝壳、一只海马和一张蛇皮。除此以外，还有珍珠母筹码、象牙棋子，以及一块镶着黄铜的象牙克里比奇牌板，那黄铜亮得像金子一样。
        - id: ch01-b50
          speaker: charles
          text: |-
            没用。来玩挑棒吧。这种游戏安安静静，大人最喜欢看孩子玩了。舅舅待我们这么好，我们总得为他做点什么。
        - id: ch01-b51
          speaker: charlotte
          text: |-
            再找最后一遍，就一遍。哎呀，桌上的书还没看呢。
        - id: ch01-b52
          speaker: narrator
          text: |-
            几张桌上也摆着书，数目不算多，都是带着插图的大本子。三个孩子这才想起，方才检查了柜子和抽屉，却还没有翻过这些书。其中有一本相册尤其沉重，卡罗琳伸手想把它拿起来，竟然怎么也拿不动。
        - id: ch01-b53
          speaker: caroline
          text: |-
            快来看。这本相册里只有三页左右的舅舅、姨妈照片，其余部分全是实心的，像个做成书样的盒子。“那本书”会不会藏在里面？
        - id: ch01-b54
          speaker: charlotte
          text: |-
            它打不开吗？
        - id: ch01-b55
          speaker: charles
          text: |-
            这里好像有个机关。
        - id: ch01-b56
          speaker: narrator
          text: |-
            查尔斯把手指按到一个小小的黄铜按钮上。书里忽然传出低低的嗡嗡声，他吓得往后一跳，另外两个也跟着跳开。
        - id: ch01-b57
          speaker: charlotte
          text: |-
            是无政府党人的炸弹，快躲开！
          emotion: fearful
        - id: ch01-b58
          speaker: narrator
          text: |-
            夏洛特只来得及喊完这句话。下一刻，那本厚书没有爆炸，反倒叮叮咚咚地奏起了《甜蜜的家》。曲调一句接一句，清脆得像银铃。夏洛特连忙解释，那是个八音盒。其实大家都听出来了，根本用不着她解释。可同一个更要紧的念头，马上闯进了三个人的脑袋。他们同时想起了一个人。
        - id: ch01-b59
          speakers: [caroline, charlotte, charles]
          ensemble: chorus
          text: |-
            威尔明顿太太！
          emotion: fearful
        - id: ch01-b60
          speaker: narrator
          text: |-
            这不是一只声音微弱的小八音盒，而是做工精良的大家伙。清亮如银的乐声从书里流出来，响遍了整间客厅，还会穿过房门传到宅子的其他地方。威尔明顿太太不论此刻待在哪里，一定都听得见。她一听见，也一定会循着声音赶来。
        - id: ch01-b61
          speaker: caroline
          text: |-
            逃！
          emotion: fearful
        - id: ch01-b62
          speaker: narrator
          text: |-
            大家冲出客厅，反手锁上门，脚下轻轻的，速度却快得很。他们一口气奔上楼梯，躲在楼上的门后等着。不久，前楼梯那边响起窸窸窣窣的声音，是威尔明顿太太的羊驼呢衣裙一路扫了下去。三个孩子立刻从门后钻出来，也飞快地下楼，悄悄跟在她后面，既不能叫她听见，又绝不能落后太远。
        - id: ch01-b63
          speaker: narrator
          text: |-
            威尔明顿太太走进锁得好好的客厅，只见屋里空无一人，八音盒却不慌不忙，镇定自若地奏着甜美清脆的曲子。她先查看锦缎窗帘后面，又绕到印度屏风后面，确定没有闯入者藏在那里，才来到餐厅。这时，三个C已经各自捧着一本书，安安静静地坐好，活像雨天里三个听话的好孩子。她当然看不出查尔斯读的是一本《布拉德肖铁路时刻表》，也没发现卡罗琳手里的《佐蒂意大利语语法》整个拿倒了。
        - id: ch01-b64
          speaker: mrs_wilmington
          text: |-
            哦，你们果然在这里。听见那个八音盒了吗？
        - id: ch01-b65
          speakers: [caroline, charlotte, charles]
          ensemble: chorus
          text: |-
            听见了。
        - id: ch01-b66
          speaker: narrator
          text: |-
            威尔明顿太太站在门口，没有立刻离开。她对机器一窍不通，所以在她看来，一只八音盒不靠外力，自己突然奏起乐来，也不是没有可能。也许里头的机关就是会自行发动。可是换个角度想，在这些孩子来到宅子以前，那只八音盒从来没有选择自行奏乐。偏偏孩子们一来，它就有了这个念头，未免太巧了些。
        - id: ch01-b67
          speaker: mrs_wilmington
          text: |-
            你们不该穿着卧室拖鞋走进起居室。
        - id: ch01-b68
          speaker: narrator
          text: |-
            她没有再问，也没有指责谁。只留下这一句关于拖鞋的规矩，便转身走了。等她真的离开餐厅，查尔斯这才开口。
        - id: ch01-b69
          speaker: charles
          text: |-
            我差点憋炸了，尤其是她留意到我们的脚时。
        - id: ch01-b70
          speaker: charlotte
          text: |-
            可她会查出来的。鲁珀特的事就让她查出来了。我们现在就回去。她知道我们在这里，一定想不到我们又在那里。还有一本书也很重，我们把那本也弄响，再吵醒她一次。
        - id: ch01-b71
          speaker: narrator
          text: |-
            这主意立刻把三个孩子又引向了秘密楼梯。他们离开餐厅，一个跟着一个，蹑手蹑脚地往楼上爬，唯恐刚才走开的威尔明顿太太听见。
        - id: ch01-b72
          speaker: charles
          text: |-
            这可真好玩，对不对？
