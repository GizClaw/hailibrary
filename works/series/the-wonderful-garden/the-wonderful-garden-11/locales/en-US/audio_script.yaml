  chapters:
    - id: ch01
      title: The Rosicurians
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: The drawing-room at the Manor House was always locked. Mrs. Wilmington dusted it herself and kept the key in her pocket. Ever since Uncle had said she expected the children to break everything in the house, the three C.'s had wondered about that locked door. Had it always been kept shut, or was Mrs. Wilmington doing it because they were there?
        - id: ch01-b02
          speaker: charles
          text: It must be her special compliment to us.
        - id: ch01-b03
          speaker: caroline
          text: I rather think it is. Drawing-rooms are meant to be sat in. Mrs. Wilmington must expect somebody to use this one, or she wouldn't dust it so carefully.
        - id: ch01-b04
          speaker: charlotte
          text: I peeped inside while she was dusting the other day. I didn't see much. There was a pretty pink-and-grey carpet, and the corner of a black cabinet with trees, birds, and gold Chinamen on it. I saw a table too, with a soup tureen whose handles were red rabbits' heads. And there was one of those round mirrors that makes the room inside look tiny and somehow wrong. Harriet calls them convict mirrors. I asked her.
        - id: ch01-b05
          speaker: charles
          text: When did you ask her?
        - id: ch01-b06
          speaker: charlotte
          text: Oh, sometime just afterward. Harriet goes in there to sweep, and she says the room is full of lovely things.
        - id: ch01-b07
          speaker: charles
          text: Why didn't you ask whether Mrs. Wilmington locked it as a compliment to us?
        - id: ch01-b08
          speaker: charlotte
          text: Because I wasn't going to put that idea into Harriet's head.
        - id: ch01-b09
          speaker: narrator
          text: Caroline agreed. Asking a question like that would simply give them away. All three children had tried the drawing-room handle again and again, hoping Mrs. Wilmington might forget the key just once. She never did, and the mystery of the room only grew. Now another wet day had come. It was perfect weather for inspecting golden Chinamen and seeing themselves in bulging mirrors, but the locked door kept every pleasure out of reach.
        - id: ch01-b10
          speaker: narrator
          text: Rupert was still in bed. The doctor had ruled out measles, but Rupert's feverish cold was bad enough to keep him there, and the others could visit for only a few minutes at a time. Harriet said Mrs. Wilmington had taken to the new young gentleman more warmly than anyone would believe. That afternoon she was reading Masterman Ready to him. First she had fetched Eric, or Little by Little from her own room, but Rupert had put his fingers in his ears rather than listen.
        - id: ch01-b11
          speaker: charlotte
          text: This is the time. There's a time in the affairs of men called the Nick, and this is it. Let's try to get inside. Mrs. Wilmington is safely out of the way. Come on!
        - id: ch01-b12
          speaker: charles
          text: Yes, let's do it.
        - id: ch01-b13
          speaker: caroline
          text: No, we'd better not. Uncle might not want us in there. Perhaps that compliment business isn't the true reason at all. There might be some wonderful secret in the room, known only to the head of the house and his faithful Wilmington. Uncle has been so awfully decent to us. Let's ask Mrs. Wilmington for the key.
        - id: ch01-b14
          speaker: narrator
          text: The others laughed.
        - id: ch01-b15
          speaker: charles
          text: You know perfectly well that wouldn't work.
        - id: ch01-b16
          speaker: narrator
          text: Caroline did not really believe there could be a secret. Uncle now belonged to their Royal Order of the Secret Rose, and its unchangeable motto was, "Halves in all secrets."
        - id: ch01-b17
          speaker: charles
          text: If there were a secret like that, Uncle would have told us without any keeping back. Still, I agree with Caro.
        - id: ch01-b18
          speaker: charlotte
          text: And I don't see— Oh! I've got an idea. Let's hunt again for the second book, the one the Lady in the picture has under her elbow. We really ought to find it. We owe Uncle that sacred duty after he's been so decent about Rupert.
        - id: ch01-b19
          speaker: charles
          text: The drawing-room knob is just like this one. The morning-room and library knobs match it too. Maybe the dining-room key will open the drawing-room.
        - id: ch01-b20
          speaker: narrator
          text: As he spoke, Charles rattled the key in the dining-room door.
        - id: ch01-b21
          speaker: caroline
          text: I wish you wouldn't. It's very rough on me, because everyone blames the eldest. I wish you'd been born first, Charles.
        - id: ch01-b22
          speaker: charles
          text: I would have been if I could. Come along.
        - id: ch01-b23
          speaker: caroline
          text: No, please listen. Don't do it. I'll go and ask Uncle whether we may. There!
        - id: ch01-b24
          speaker: charles
          text: But we're not allowed to disturb him.
        - id: ch01-b25
          speaker: caroline
          text: I'd sooner disturb him than poke around where he doesn't want us. If he doesn't mind, he'll say yes. If he does mind, he'll say no, and then we'll be glad we asked before going in.
        - id: ch01-b26
          speaker: charles
          text: What could possibly be in there that he wouldn't want us to see?
        - id: ch01-b27
          speaker: charlotte
          text: Anything! Perhaps clouds of live butterflies come out after lunch and fly back into their cages when the tea bell rings. I think Caro is right. We should ask Uncle.
        - id: ch01-b28
          speaker: charles
          text: Butterflies are nonsense. They'd lay eggs everywhere and keep turning into cocoons. I know all about that from silkworms.
        - id: ch01-b29
          speaker: charlotte
          text: Then perhaps it's a snake. An enormous king-serpent with a crown on its head, yards and yards long. Every day from two until four it comes out of a cabinet and winds bits of itself around the furniture legs. Or around your legs, if you go in. I don't suppose it would care whose legs they were.
        - id: ch01-b30
          speaker: charles
          text: I like snakes. Caro may ask Uncle if she wants to.
        - id: ch01-b31
          speaker: narrator
          text: They all went, but first they decided it would be respectful to wash a little.
        - id: ch01-b32
          speaker: caroline
          text: People like you to be clean when you ask them for things.
        - id: ch01-b33
          speaker: charlotte
          text: Whatever you do, somebody says, "Wash!" While there's life, there's soap.
        - id: ch01-b34
          speaker: narrator
          text: Even Charlotte washed. Then the children gathered nervously on the sheepskin mat outside Uncle's study.
        - id: ch01-b35
          speaker: charles
          text: Shall we knock?
        - id: ch01-b36
          speaker: caroline
          text: You don't knock on sitting-room doors.
        - id: ch01-b37
          speaker: narrator
          text: She turned the handle and opened the door exactly three inches and three-eighths.
        - id: ch01-b38
          speaker: uncle
          text: Who is that? How many times must I order people not to disturb me on any pretence?
        - id: ch01-b39
          speaker: charles
          text: But there isn't any pretence—
        - id: ch01-b40
          speaker: caroline
          text: It's a depredation from the Secret Rose.
        - id: ch01-b41
          speaker: uncle
          text: So I perceive. I'm too busy to play just now.
        - id: ch01-b42
          speaker: narrator
          text: His very voice told them that his thumb was holding a place in a book and he was afraid of losing it.
        - id: ch01-b43
          speaker: caroline
          text: This isn't play. We want your permission for something.
        - id: ch01-b44
          speaker: uncle
          text: Very well. If I receive this deputation, will it promise not to interrupt me again for a week, on any pretence? If so, come in.
        - id: ch01-b45
          speaker: narrator
          text: The room they entered seemed full of books. Books lay on tables, the floor, the mantelpiece, and the window ledge. Some were open and some shut, some old and some new, some handsome and some ugly. Uncle had even covered his walls with books as other people covered theirs with wallpaper. He sat at a broad writing table covered in green leather, and sure enough, his thumb was inside a tall brown folio.
        - id: ch01-b46
          speakers: [caroline, charlotte, charles]
          ensemble: chorus
          text: Good morning, Uncle.
        - id: ch01-b47
          speaker: narrator
          text: Caroline coughed before she began.
        - id: ch01-b48
          speaker: caroline
          text: If you please, Uncle, we want to explore the whole house and search for the other book. I mean the missing book from the picture, Dame Eleanour's book. You said we could look, but the drawing-room is locked.
        - id: ch01-b49
          speaker: uncle
          text: Dear me. Can't you simply unlock it?
        - id: ch01-b50
          speaker: charles
          text: No. The Wil— I mean, Mrs. Wilmington keeps the key in her under-pocket.
        - id: ch01-b51
          speaker: uncle
          text: Oh, does she? You won't break anything. No, of course you won't. Well, since you belong to the Society of the Secret Rose, I'll take you through my secret door.
        - id: ch01-b52
          speaker: narrator
          text: In rather a hurry, Uncle slipped a folded paper into his book to mark the page. He rose and crossed to a low, narrow door beside the fireplace. It looked as though it opened into a cupboard. Uncle went through, and the children followed him into a little carpeted passage. A closed, barred door stood on the left, a staircase climbed away on the right, and another door waited straight ahead. Uncle opened that one.
        - id: ch01-b53
          speaker: uncle
          text: Here is the drawing-room.
        - id: ch01-b54
          speaker: narrator
          text: And there it was. They could see one corner of the carpet, covered in the same pink-and-grey roses Charlotte had glimpsed before.
        - id: ch01-b55
          speaker: uncle
          text: Now come up this way.
        - id: ch01-b56
          speaker: narrator
          text: He led them upstairs and opened the door at the top. Beyond it lay the familiar corridor where stuffed birds and fishes watched over the children's bedroom doors.
        - id: ch01-b57
          speaker: uncle
          text: I'll give you the key to this upper door. Then you may visit the drawing-room whenever you please. Don't disturb anything, and don't go in wearing muddy boots. If you manage that, Mrs. Wilmington never needs to know. It will be our secret, my little contribution to the Society of the Rose. Rather like a conspiracy, isn't it?
        - id: ch01-b58
          speakers: [caroline, charlotte, charles]
          ensemble: chorus
          text: Exactly like a conspiracy! Is it truly a secret staircase?
        - id: ch01-b59
          speaker: uncle
          text: It is now, at any rate. It used to be nothing more than the back stairs, but I had them closed because I dislike noise.
        - id: ch01-b60
          speaker: caroline
          text: We'll always come down in our bedroom slippers. Oh, Uncle, you are a darling!
        - id: ch01-b61
          speaker: narrator
          text: Uncle patiently endured a complicated embrace from all three children. Then he returned to his brown folio.
        - id: ch01-b62
          speakers: [caroline, charlotte, charles]
          ensemble: chorus
          text: Now then!
        - id: ch01-b63
          speaker: narrator
          text: The three C.'s entered the drawing-room. They had to climb three steps to reach it, which explained why no one outside could look through its three windows. Grey-and-pink brocade curtains matched the carpet. Tall mirrors in gold frames hung above marble tables with golden legs. Some mirrors were round, with knobs around their frames. Others were oval, with candlesticks branching beneath them.
        - id: ch01-b64
          speaker: narrator
          text: A golden harp stood in one corner with most of its strings still unbroken. There was also a piano made with patterns of many-colored wood. Caroline longed to play "The Bluebells of Scotland" and Haydn's "Surprise." But that would give Mrs. Wilmington a surprise as well, so she could not even consider it.
        - id: ch01-b65
          speaker: narrator
          text: The room held carved Indian cabinets with elephants and lions, and Chinese cabinets with mandarins and little gold ladies whose feet were tiny. Ivory pagodas stood under glass, beside wax flowers in glass cases. Tall white statues looked down, beautiful and cold. There were boxes carved from ivory and ebony, another made of porcupine quills, and a workbox that shone with mother-of-pearl and silver.
        - id: ch01-b66
          speaker: narrator
          text: Faded needlework covered the cushions and chair seats. Some of the old, beautiful chairs had straight backs and some had round ones. Two crystal chandeliers hung like fountains turned upside down. China ornaments stood everywhere, including a Chinaman whose head wagged whenever anyone came close.
        - id: ch01-b67
          speaker: narrator
          text: It was the sort of room you sometimes find in a house where one family has lived for many, many, many years. Each generation had carefully kept the beautiful things left by its ancestors. Then it had added one or two more treasures and passed them on, so the generation that came next could care for them too. A person could happily spend a whole hour there just looking. And the three C.'s remembered with delight that Uncle had never forbidden them to touch.
        - id: ch01-b68
          speaker: narrator
          text: Children can be wonderfully careful when they do not let their thoughts wander away from the work of being careful. The three C.'s looked at everything and touched a great many things without breaking or harming a single one. They examined every cabinet. They opened all the doors and pulled out every drawer, hoping to uncover some secret little place where the Book might be hidden.
        - id: ch01-b69
          speaker: narrator
          text: Instead, they found coins, medals, chessmen, draughts, and spellicans. There were bright shells from foreign seas, a sea horse, a snakeskin, mother-of-pearl counters, ivory draughts, and an ivory cribbage board. Brass inlay gleamed across it like gold.
        - id: ch01-b70
          speaker: charles
          text: This is no use. Let's play spellicans instead. It's a nice quiet game that grown-ups approve of, and we owe Uncle something.
        - id: ch01-b71
          speaker: narrator
          text: He pulled out another lacquered drawer as he spoke.
        - id: ch01-b72
          speaker: charlotte
          text: Just one more look, please. Oh, wait! We haven't searched the books.
        - id: ch01-b73
          speaker: narrator
          text: A few large picture books lay on the tables. One was a photograph album so heavy that Caroline could not lift it.
        - id: ch01-b74
          speaker: caroline
          text: Come and see this! There are only about three pages of aunts and uncles. The rest is solid, like a box pretending to be a book. What if the missing book is hidden inside the box part?
        - id: ch01-b75
          speaker: narrator
          text: The other two crowded close.
        - id: ch01-b76
          speaker: charles
          text: Won't it open? Look, there's some sort of catch here.
        - id: ch01-b77
          speaker: narrator
          text: Charles pressed a small brass button with one finger. A low whir came from inside the book, and all three children jumped back.
        - id: ch01-b78
          speaker: charles
          text: Oh, crikey!
          emotion: surprised
        - id: ch01-b79
          speaker: charlotte
          text: It's a Nihilist bomb! Get away!
          emotion: fearful
        - id: ch01-b80
          speaker: narrator
          text: Before Charlotte had finished, the book began chiming the silvery tune of "Home, Sweet Home."
        - id: ch01-b81
          speaker: charlotte
          text: It's only a musical box.
        - id: ch01-b82
          speaker: narrator
          text: The explanation was hardly needed. Then the same thought struck all three of them at once.
        - id: ch01-b83
          speakers: [caroline, charlotte, charles]
          ensemble: chorus
          text: Mrs. Wilmington!
          emotion: fearful
        - id: ch01-b84
          speaker: narrator
          text: It was a fine musical box, and its clear silver notes rang through the room. Wherever Mrs. Wilmington might be, she was sure to hear. And when she heard, she would come.
        - id: ch01-b85
          speaker: caroline
          text: Run!
          emotion: fearful
        - id: ch01-b86
          speaker: narrator
          text: They fled, locked the door behind them, and hurried up the stairs as softly and swiftly as they could. Behind the upper door they waited until they heard Mrs. Wilmington's alpaca skirt sweep down the main staircase. Then they slipped out and followed her, quick and quiet.
        - id: ch01-b87
          speaker: narrator
          text: Mrs. Wilmington entered the locked drawing-room and found the musical box calmly tinkling away with no one there. She searched behind the brocade curtains and the Indian screen, but found no intruder. By the time she reached the dining room, the three C.'s were sitting quietly with books in their hands. They looked like a perfect picture of good little children on a rainy day. She could not tell that Charles was reading a railway timetable or that Caroline held an Italian grammar upside down.
        - id: ch01-b88
          speaker: mrs_wilmington
          text: Oh, so you are here. Did you hear that musical box?
        - id: ch01-b89
          speakers: [caroline, charlotte, charles]
          ensemble: chorus
          text: Yes.
        - id: ch01-b90
          speaker: narrator
          text: The children answered meekly. Mrs. Wilmington remained in the doorway for a moment and considered both possibilities. She did not understand machinery, so it seemed quite possible to her that a musical box might begin playing all by itself, without anyone helping it from outside. On the other hand, it had never once chosen to do such a thing before these children arrived.
        - id: ch01-b91
          speaker: mrs_wilmington
          text: You should not wear bedroom slippers in the sitting rooms.
        - id: ch01-b92
          speaker: narrator
          text: With that, she went away.
        - id: ch01-b93
          speaker: charles
          text: I nearly burst, especially when she noticed our feet.
        - id: ch01-b94
          speaker: charlotte
          text: But she'll discover the truth. She found out about Rupert. Let's go back right now. Since she knows we're here, she won't imagine we're there. I saw another book, and that one was heavy too. We'll start it playing and wake her up again.
        - id: ch01-b95
          speaker: narrator
          text: They crept back up the stairs.
        - id: ch01-b96
          speaker: charles
          text: I say, isn't this a lark?
