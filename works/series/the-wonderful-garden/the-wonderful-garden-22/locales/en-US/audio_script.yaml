  chapters:
    - id: ch01
      title: The Portrait
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: The three C.'s now had two things to look forward to. Rupert would come home, and Lord Andore would have his coming-of-age party. But the waxen man spell had ended so seriously that none of them wanted to suggest any more magic. Charlotte still hoped they might bring the portrait to life one day, though none of their books explained how.
        - id: ch01-b02
          speaker: charlotte
          text: We've had plenty of experience by now. Surely we could invent a spell ourselves.
        - id: ch01-b03
          speaker: narrator
          text: Yet Rupert's banishment had left a dull emptiness behind. New ideas would not come. It felt like an extremely wet Sunday, with someone ill in the house and no chance of going to church. Caroline and Charlotte never said so, but both felt they ought to be especially good to make up for poor Rupert. Charles cared for little except swimming. He had improved so much that even in the water, he sometimes knew which limbs were his arms and which were his legs. He could at least imagine that all four were moving correctly.
        - id: ch01-b04
          speaker: narrator
          text: Uncle Charles appeared even less often than before. When he did, he seemed more like an uncle and less like a polite acquaintance. The books the children had found meant a great deal to him, and he told them so more than once. Nearly every other day he went away to study them. He visited the British Museum in London and the library at Canterbury. Once he spent two whole days looking up old parchments at the Bodleian Library, which meant a journey to Oxford. Mr. Penfold was very kind, and the children did quite a lot of building under his direction. Altogether, though, it was a flat sort of time.
        - id: ch01-b05
          speaker: narrator
          text: Then everything suddenly grew interesting again. A tall gentleman in spectacles came to call while Uncle Charles was out. He had a long nose, a thin face, and a slow, pleasant smile. He left his card, but Caroline heard Harriet telling him the master was away. She hurried after him and caught up on the gravel.
        - id: ch01-b06
          speaker: caroline
          text: I'm sure Uncle wouldn't want you to leave without a rest. You've come such a long way, and it's such a hot day.
        - id: ch01-b07
          speaker: mr_appleby
          text: Especially after you called me back all this way and made me hurry so.
        - id: ch01-b08
          speaker: narrator
          text: After an answer like that, he could no longer be treated as a stranger. Meanwhile, Charlotte and Charles had inspected his card in the Russian bowl on the hall table. It said, “Mr. Alfred Appleby,” followed by what Charlotte called most of the alphabet, beginning with F.R.S. and F.S.A. When Caroline privately asked what the card said, they could remember only “Mr. Alphabet.”
        - id: ch01-b09
          speaker: narrator
          text: Mr. Appleby accepted Caroline's invitation and walked back with her.
        - id: ch01-b10
          speaker: caroline
          text: I can't take you straight into the drawing room. But if you'll wait in the dining room, I'll fetch the key. I'm afraid it's rather awful in there. We were going to play Red Indians, and the gum on the scalps is drying across most of the chairs.
        - id: ch01-b11
          speaker: narrator
          text: Mr. Appleby refused the drawing room at any price. He stayed among the chairs and told them several things they had never known about Red Indians, wampum, moccasins, and war paint. The children soon decided that he was easily the nicest thing to happen since the day Caroline and Charlotte privately called “that awful image day.”
        - id: ch01-b12
          speaker: narrator
          text: Mrs. Wilmington came in to see what the children were doing. Mr. Appleby won her heart at once by calling her Mrs. Davenant. Later she proudly told Harriet that he had taken her for the lady of the house. Then she drew Caroline aside.
        - id: ch01-b13
          speaker: mrs_wilmington
          text: If you'd care to invite the gentleman to lunch, Miss Caroline, you may. We happen to have fowls, peas, and a Paradise pudding. Perhaps your uncle would want him to stay.
        - id: ch01-b14
          speaker: narrator
          text: So Mr. Appleby stayed for lunch and proved excellent company. Every one of his very amusing stories was new to the people listening. He carved the fowls with the skill of a master and helped himself to the Paradise pudding twice. All the while, he gave exactly the right amount of wonder and admiration to Dame Eleanour in her ruff, the strange magic potions beside her, and her two marvelous books.
        - id: ch01-b15
          speaker: charlotte
          text: We were the ones who found those books, Mr. Alphabet.
        - id: ch01-b16
          speaker: narrator
          text: That meant telling him the whole story. Mr. Alphabet, as we may now call him, listened with deep interest. His clever questions drew out each spell, and he nodded as if he understood it all.
        - id: ch01-b17
          speaker: mr_appleby
          text: Do you mean to keep experimenting?
        - id: ch01-b18
          speaker: narrator
          text: He asked this after hearing about the leopard, the last adventure they could possibly mention. Naturally, the business of the wax man could never be told.
        - id: ch01-b19
          speaker: caroline
          text: There isn't anything we especially want to use a spell for just now. I thought about bringing Father and Mother home. But leaving India might be terribly inconvenient for them, and we wouldn't want our spell to cause them trouble.
        - id: ch01-b20
          speaker: mr_appleby
          text: Quite so.
        - id: ch01-b21
          speaker: charlotte
          text: What I really want is to bring her to life.
        - id: ch01-b22
          speaker: narrator
          text: Charlotte nodded toward the portrait.
        - id: ch01-b23
          speaker: charlotte
          text: None of the books has a spell for it, but she looks so dear. What if she put magic into the picture herself, and someone living now could catch the other end of her spell? Do you know what I mean?
        - id: ch01-b24
          speaker: mr_appleby
          text: Quite so. Why shouldn't she?
        - id: ch01-b25
          speaker: charlotte
          text: I suppose it wouldn't truly be her. It might be more like a cinematograph and a phonograph together. I want to watch her move and hear her voice, the way people did when she was alive.
        - id: ch01-b26
          speaker: mr_appleby
          text: And again, why not?
        - id: ch01-b27
          speaker: charles
          text: If only we knew the right spell. Everything we've tried has worked out, beginning with the fern seed. But we can't discover this one.
        - id: ch01-b28
          speaker: mr_appleby
          text: I'll give it some thought. And since I've stayed this long, I think I'll invite myself to remain until your uncle comes home. I'd very much like to see the Wonderful Garden. Perhaps you'll even let me smoke my after-dinner pipe there.
        - id: ch01-b29
          speaker: narrator
          text: The afternoon was delightful. Mr. Alphabet was one of those people who make you comfortable from the very beginning. He understood what you said. That is one of the two feet on which comfortable companionship stands. And he never said anything you could not understand, provided you truly used your mind. That is the other foot.
        - id: ch01-b30
          speaker: narrator
          text: He told them the names of many flowers that had been strangers to the children. Then he talked about magic from India and China, Egypt and Ceylon, Australia and Mexico. They listened and longed for more, and each time there was more to hear. After tea, Uncle Charles returned. He greeted Mr. Alphabet warmly and took him away to the study. Once the grown-ups had gone, the children agreed that their new friend was exactly the right sort of person. They hoped they would see him again often.
        - id: ch01-b31
          speaker: caroline
          text: At least once a week.
        - id: ch01-b32
          speaker: charles
          text: Once every day.
        - id: ch01-b33
          speaker: narrator
          text: They saw him once more, and only once. He and Uncle Charles came out of the study together. Uncle went to speak to William about putting the horse in and driving Mr. Alphabet to the station. Before he left, Mr. Alphabet came into the dining room to say goodbye to the children.
        - id: ch01-b34
          speaker: mr_appleby
          text: I've considered what you said about Dame Eleanour. Ask your uncle if you may cover her whole portrait, frame and all, with a green curtain. Make garlands from suitable flowers and hang them across it. Then wait. You must never lift the curtain, and it absolutely must be green. Wish with all your might to see her move and hear her speak. If nothing happens in about three weeks, I shall be very surprised. Remember, green. Don't let your housekeeper give you red moreen or old blue damask. No other color will do.
        - id: ch01-b35
          speaker: charlotte
          text: Do you honestly think it will work?
          emotion: surprised
        - id: ch01-b36
          speaker: mr_appleby
          text: With anyone else, I wouldn't dare think a thing. But you have been unusually fortunate so far, haven't you? With you, I can hardly doubt that the spell will succeed. Mind, I don't promise you'll see her here in front of the portrait. I can't tell you how she will appear, or where, or when. Those things belong to the great mysteries.
        - id: ch01-b37
          speaker: mr_appleby
          text: Perhaps one morning, while you're eating breakfast, the curtain will move ever so slightly. At first you'll think the air from the open window has stirred it. Then you'll notice a bulge in the green cloth. Don't forget, it must be green. A white hand will draw it back, and Dame Eleanour will step down from her frame onto the nearest chair. Her silk petticoat will rustle, and she'll wear scarlet high-heeled shoes. Perhaps that is how she will come. But I only say perhaps.
        - id: ch01-b38
          speaker: mr_appleby
          text: Or perhaps you'll meet her in the wood, in the middle of some merry celebration, or right there in the Wonderful Garden. It is her own garden, after all, still kept just as she planted it. Your uncle showed me an old document. In it, Dame Eleanour leaves her blessing to the family for as long as the garden stays as it was in her time. There is a long list of flowers and a plan with the proper place for every kind marked on it. Did you know that? No? I must ask your uncle to show you. I think she may very well choose to appear in the garden.
        - id: ch01-b39
          speaker: charles
          text: You're not making fun of us, are you?
        - id: ch01-b40
          speaker: mr_appleby
          text: Could you really believe that of me? No, I can see you couldn't. Try my spell, then write and tell me what happens. Yes, Davenant, I'm coming! Where is my hat? Outside, of course. And my umbrella. Goodbye, all of you. Thank you for a delightful day.
        - id: ch01-b41
          speaker: caroline
          text: Thank you.
        - id: ch01-b42
          speakers: [caroline, charlotte, charles]
          ensemble: chorus
          text: Goodbye! Please come back soon!
        - id: ch01-b43
          speaker: narrator
          text: Those were not quite his final words. Mr. Alphabet climbed into the dogcart beside William, then waved his umbrella in a cheerful farewell to the whole group at the front door, which was actually at the side of the house.
        - id: ch01-b44
          speaker: mr_appleby
          text: Don't forget the green!
        - id: ch01-b45
          speaker: narrator
          text: Uncle Charles raised no objection when they explained the plan for the portrait. He even drove the children to Maidstone and bought a curtain specially for it. The woollen cloth they chose was soft and wide. Most importantly, it was very, very green. Mrs. Wilmington hemmed the new curtain. Then Uncle Charles himself climbed onto the housemaid's steps. He tottered there while he hung the curtain in its proper place.
        - id: ch01-b46
          speaker: uncle_charles
          text: Look at her one last time. Look carefully, so you'll recognize her if you see her again.
        - id: ch01-b47
          speaker: narrator
          text: He came down and held the green curtain aside. Dame Eleanour gazed from the shadow of the cloth, almost as though she were alive.
        - id: ch01-b48
          speaker: charlotte
          text: If we see her?
        - id: ch01-b49
          speaker: uncle_charles
          text: I meant when.
        - id: ch01-b50
          speaker: narrator
          text: Uncle Charles let the curtain fall in long, straight folds. Now everyone, even Uncle, thought about the garlands.
        - id: ch01-b51
          speaker: uncle_charles
          text: Arbor vitae means “tree of life.”
        - id: ch01-b52
          speaker: caroline
          text: Then we'll use it. It also means “unchanging friendship.”
        - id: ch01-b53
          speaker: narrator
          text: Caroline thought of Rupert.
        - id: ch01-b54
          speaker: caroline
          text: I hope Rupert comes home before she appears. Seeing her would make him believe in magic, wouldn't it?
        - id: ch01-b55
          speaker: narrator
          text: This was Uncle Charles's first introduction to The Language Of. The writing in that remarkable book seemed to impress him greatly.
        - id: ch01-b56
          speaker: uncle_charles
          text: “Never did the florographist select from cunning Nature's wonderous field a more appropriate interpreter of man's innermost passions than when he chose the arbor vitae to formulate the significance, ‘Live for me.’” I had no idea human beings could write in such a fashion. And I thought you said arbor vitae meant something entirely different.
        - id: ch01-b57
          speaker: caroline
          text: The flowers often have several meanings. We used to think the book couldn't make up its mind. Now we think it adds meanings whenever it finds new ones. It's confusing at first, but “live for me” is perfect. That's exactly what we want the portrait to do. What else shall we choose?
        - id: ch01-b58
          speaker: uncle_charles
          text: I leave that to you. Your author's style is far too appealing. I could lose the rest of the daylight to him. Farewell. Tell me if you need help hanging the garlands.
        - id: ch01-b59
          speaker: narrator
          text: The children thanked him warmly, then hesitated.
        - id: ch01-b60
          speaker: charles
          text: She's meant to come alive for us, so I think it ought to be us who hang them.
        - id: ch01-b61
          speaker: uncle_charles
          text: We, Charles. Not us.
        - id: ch01-b62
          speaker: charles
          text: But I do mean us. I don't mean “we” if that includes you.
        - id: ch01-b63
          speaker: uncle_charles
          text: I was correcting your grammar, not what you meant. But never mind. Goodbye.
        - id: ch01-b64
          speaker: narrator
          text: No one was certain what counted as a garland. In books, people wore garlands on their heads, where they would surely be wreaths. They also wound garlands around pillars, where they looked more like Christmas decorations.
        - id: ch01-b65
          speaker: caroline
          text: We'd better make both kinds, just to be safe.
        - id: ch01-b66
          speaker: narrator
          text: They made a foundation from arbor vitae twigs, then wound the twigs with Jaeger wool. The wool had originally been bought so Caroline could knit a vest for Aunt Emmeline. Caroline admitted that she knew she would never finish it. Then they tied on flowers for their symbolic meanings. Some went into circles or wreaths. Others covered long, straight lengths.
        - id: ch01-b67
          speaker: charlotte
          text: Let's add rye grass. It means “a changeable disposition,” and we do want her to change from paint into someone alive. Pink verbena means “family reunion,” and she is our relation. Besides, pink is so pretty.
        - id: ch01-b68
          speaker: narrator
          text: Caroline discovered that yew meant life. But everyone agreed that Charles made the finest discovery of the afternoon. Jacob's ladder meant “come down,” which was exactly what they wanted the lady to do. The gardener knew what Jacob's ladder was, although the children did not. They had feared it might be a dull shrub with flowers too small to see. When they finally looked at the plant, its bright blue blooms took away all their fears.
        - id: ch01-b69
          speaker: caroline
          text: We should wear coronilla ourselves, a fresh piece every day. It means “success attend your wishes.”
        - id: ch01-b70
          speaker: narrator
          text: The gardener had never heard of anything called coronilla. Caroline opened The Language Of, which she had been carrying under her arm as usual, and read the plant's description aloud to him.
        - id: ch01-b71
          speaker: caroline
          text: The book calls it “a flowering shrub of the pea family,” with small pinnate leaves, whatever those are. It says the graceful flowers start reddish brown and later turn yellow.
        - id: ch01-b72
          speaker: gardener
          text: Oh, that plant! That's scorpion's senna. The name has something to do with how the stars are shaped. Old women sell it as a charm for bashful sweethearts.
        - id: ch01-b73
          speaker: caroline
          text: Our book says, “Success crown your wishes.”
        - id: ch01-b74
          speaker: gardener
          text: That's the one. She names the day, and all. You'll find it along there.
        - id: ch01-b75
          speaker: narrator
          text: When the work was done, the garlands looked very handsome and the wreaths looked very beautiful. That was the distinction Caroline made between the two. Their dark leaves stood against the green curtain, along with flowers of bright pink, blue, and yellow. The whole display looked charming.
        - id: ch01-b76
          speaker: caroline
          text: Now all we have to do is wait. Charlotte and I must keep working on our glove and handkerchief cases if they're to be ready for Mother's birthday. Charles, you should ask Mr. Penfold to teach you the chip carving he offered, so you can make her a box. And none of us must peek behind the curtain.
        - id: ch01-b77
          speaker: charlotte
          text: I won't forget. What I'd like to forget is my head. It feels twice its usual size.
        - id: ch01-b78
          speaker: caroline
          text: My head aches too. I suppose it's the sun.
        - id: ch01-b79
          speaker: charles
          text: Then my head ought to hurt as well. Mine's in my nose. I've used four handkerchiefs since breakfast, and one of them belonged to Mrs. Wilmington.
        - id: ch01-b80
          speaker: caroline
          text: Well, let's work on our embroidery. Every one of my silks is terribly tangled.
        - id: ch01-b81
          speaker: narrator
          text: The silks stayed tangled that day, while the headaches grew worse. There is no need to linger over what happened next. The doctor explained the whole disaster the following day in a few brief, well-chosen words.
        - id: ch01-b82
          speaker: doctor
          text: The girls have measles, right enough. The boy hasn't got them yet.
