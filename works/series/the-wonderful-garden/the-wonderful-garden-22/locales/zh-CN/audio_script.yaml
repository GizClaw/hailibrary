audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 温暖机敏，带着克制的幽默讲述
        timbre: 清澈柔和
        pace: 从容而富有变化
        pitch: 中音
    caroline:
      display_name: 卡罗琳
      tts:
        delivery: 大方热情，努力摆出长姐的懂事
        timbre: 明亮清脆
        pace: 自然轻快
        pitch: 中高音
    charlotte:
      display_name: 夏洛特
      tts:
        delivery: 活泼直率，想到什么便说什么
        timbre: 轻盈清亮
        pace: 偏快
        pitch: 高音
    charles:
      display_name: 查尔斯
      tts:
        delivery: 淘气认真，笑话总说得一本正经
        timbre: 清亮的男孩声
        pace: 轻快
        pitch: 中高音
    rupert:
      display_name: 鲁珀特
      tts:
        delivery: 直爽开朗，病中说话虚弱而迷糊
        timbre: 清亮的少年声
        pace: 自然，发烧时忽快忽慢
        pitch: 中高音
    uncle_charles:
      display_name: 查尔斯舅舅
      tts:
        delivery: 温和飘忽，偶尔流露出幽微的兴味
        timbre: 轻柔低沉
        pace: 舒缓
        pitch: 中低音
    appleby:
      display_name: 字母表先生
      tts:
        delivery: 亲切诙谐，对奇闻异事一本正经
        timbre: 温厚清朗
        pace: 从容
        pitch: 中低音
    mrs_wilmington:
      display_name: 威尔明顿太太
      tts:
        delivery: 能干爽利，带着管家的周到与自得
        timbre: 饱满温暖
        pace: 稳健
        pitch: 中音
    gardener:
      display_name: 园丁
      tts:
        delivery: 朴实笃定，带着乡间口吻
        timbre: 粗厚低沉
        pace: 不紧不慢
        pitch: 低音
    doctor:
      display_name: 医生
      tts:
        delivery: 简短明确，诊断时不绕弯子
        timbre: 平稳清晰
        pace: 稳健
        pitch: 中低音
  chapters:
    - id: ch01
      title: 平淡日子里的客人
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: |-
            鲁珀特走后，三个名字都以C开头的孩子有两件事可盼。一件是等他回来，一件是等安多尔勋爵的成年宴会。蜡人魔法闹出的结果太严重，谁也不愿再提新咒语。只有夏洛特还暗暗存着希望。也许有一天，他们能试一道咒语，让画像活起来。可所有书里偏偏都没有这样的办法。
        - id: ch01-b02
          speaker: charlotte
          text: |-
            我们已经试过那么多咒语了，总该能自己想出一个吧。
        - id: ch01-b03
          speaker: narrator
          text: |-
            可鲁珀特被送走以后，日子里像空了一块，新的主意怎么也冒不出来。那感觉很像一个阴雨绵绵的星期日，家里又有人生病，连教堂也去不成。卡罗琳和夏洛特心里都有个不肯承认的念头，觉得自己应该格外乖一点，好补偿可怜的鲁珀特。查尔斯却只关心游泳。他在这门本领上进步很大，在水里偶尔已经能分清哪两样是胳膊，哪两样是腿，还能想象自己的四肢都划出了正确的动作。
        - id: ch01-b04
          speaker: narrator
          text: |-
            查尔斯舅舅露面的次数比刚来时更少了，但只要见到孩子们，他倒越来越像真正的舅舅，不再像一位客气的泛泛之交。孩子们发现的那些书对他非常重要，这话他亲口说过不止一次。他几乎隔一天就要出门，去伦敦的大英博物馆，去坎特伯雷的图书馆，还曾到牛津的博德利图书馆待了两天，只为查几卷古老的羊皮文书。彭福尔德先生待孩子们很好，还教他们造了不少东西。可总的说来，这段日子实在平淡。
        - id: ch01-b05
          speaker: narrator
          text: |-
            就在这时，事情忽然又有趣起来。一位高个子客人来了。他戴着眼镜，鼻子很长，脸庞清瘦，笑得缓慢又和气。舅舅不在家，他留下名片便往回走。卡罗琳听见哈丽特向他解释主人出门了，马上热情地追了出去。小脚踩得砂石啪嗒直响，那位先生听见声音，停下来等她。卡罗琳一直跑到他面前，已经喘得上气不接下气。
        - id: ch01-b06
          speaker: caroline
          text: |-
            您走了这么远，天气又热，舅舅一定不愿让您连歇也不歇就回去。
        - id: ch01-b07
          speaker: appleby
          text: |-
            你把我领出这么远，又让我跑得这么快，当然该让我歇一会儿。
        - id: ch01-b08
          speaker: narrator
          text: |-
            这句俏皮话一说，大家当然不能再把他当陌生人。夏洛特和查尔斯也已经从门厅桌上的俄罗斯碗里拿起名片，匆匆看过。上面写着“阿尔弗雷德·阿普尔比先生”，后面跟着F.R.S.、F.S.A.等一大串字母，几乎像整套字母表都跟他的名字混在了一起。等卡罗琳悄悄来问，他们只记得一个称呼了，那就是“字母表先生”。
        - id: ch01-b09
          speaker: narrator
          text: |-
            字母表先生跟卡罗琳回到宅子。可饭厅正乱得很，孩子们打算玩印第安人，大多数椅子上都放着粘好的头皮，胶水还没干。
        - id: ch01-b10
          speaker: caroline
          text: |-
            真对不起，我不能马上带您进客厅。您先在饭厅等一下，我去拿钥匙。只是这里太乱了，我们做的头皮还摆在椅子上晾着呢。
        - id: ch01-b11
          speaker: narrator
          text: |-
            字母表先生说什么也不肯换地方。他还讲起印第安人、贝壳串珠、鹿皮鞋和作战时涂的油彩，尽是孩子们不知道的事。自从卡罗琳和夏洛特私下所谓的“那个可怕的蜡像日”以后，再没有什么比这位客人更叫人高兴。威尔明顿太太进来查看孩子们又在忙什么，一听他称自己为“达文南特太太”，立刻喜欢上了他。她还得意地告诉哈丽特，这位先生一眼就把她当成了女主人。
        - id: ch01-b12
          speaker: mrs_wilmington
          text: |-
            卡罗琳小姐，您若想留这位先生吃午饭，只管开口。今天正好有鸡、天堂布丁和豌豆。您舅舅大概也会赞成。
        - id: ch01-b13
          speaker: narrator
          text: |-
            客人就这样留了下来，孩子们很快发现，他实在是个再有趣不过的饭伴。他讲的故事全都新鲜又好笑，切鸡肉的手艺也高明，布丁还添了第二份。不过，他最叫孩子们满意的地方，是他自始至终都在望着埃莉诺夫人的画像，而且流露出的赞叹和惊奇恰到好处。画像里的夫人围着轮状皱领，她曾有古怪的魔法药水，还有两本奇妙的书。
        - id: ch01-b14
          speaker: charlotte
          text: |-
            字母表先生，那两本书就是我们发现的。
        - id: ch01-b15
          speaker: narrator
          text: |-
            于是，孩子们非把所有经历都讲出来不可。字母表先生越听越有兴趣。他问得聪明又妥帖，每听懂一道咒语，便心领神会地点一点头。最后，他们讲到豹子的故事。那是能够告诉外人的最后一场冒险，至于蜡人的事，当然永远也不能泄露。
        - id: ch01-b16
          speaker: appleby
          text: |-
            那么，你们还准备继续试验咒语吗？
        - id: ch01-b17
          speaker: caroline
          text: |-
            眼下没有特别想办的事。我本想用咒语叫爸爸妈妈回来，可他们现在离开印度，也许会很不方便。我们不愿施一个只会给他们添麻烦的咒语。
        - id: ch01-b18
          speaker: appleby
          text: |-
            正是如此！
    - id: ch02
      title: 让画像活起来的办法
      blocks:
        - id: ch02-b01
          speaker: charlotte
          text: |-
            我一直想让埃莉诺夫人活过来，可书里没有这种咒语。您瞧，她多可爱呀。会不会是她自己给画像施过魔法？只要如今有人抓住咒语的另一头，画像就能活起来。您懂我的意思吗？
        - id: ch02-b02
          speaker: appleby
          text: |-
            当然懂。为什么不呢？
        - id: ch02-b03
          speaker: charlotte
          text: |-
            那大概不是真正的她，可也许会像活动电影和留声机合在一起。我想看她像生前那样走动，也想听她说话。
        - id: ch02-b04
          speaker: appleby
          text: |-
            为什么不呢？
        - id: ch02-b05
          speaker: charles
          text: |-
            要是能找到咒语就好了。从蕨草籽开始，我们做的每件事最后都成功了，只有这个没办法。
        - id: ch02-b06
          speaker: appleby
          text: |-
            这件事我得想想。既然待到现在，我索性自己邀请自己留下，等你们舅舅回来吧。我很想看看奇妙花园。饭后若能到那里抽一斗烟，那就更好了。
        - id: ch02-b07
          speaker: narrator
          text: |-
            整个下午都过得很快活。字母表先生属于那种一见面就能让人自在的人。他听得懂孩子们说的话，这是愉快相处赖以站立的一只脚。只要孩子们真正肯动脑筋，他说的每句话也都听得懂，这是另一只脚。他告诉他们许多原本陌生的花名，又讲印度、中国、埃及、锡兰、澳大利亚和墨西哥的魔法。孩子们越听越想听，而他果然一直讲给他们听。
        - id: ch02-b08
          speaker: narrator
          text: |-
            茶点以后，舅舅回来了。他热情地迎接客人，很快便把人领进自己的书房。客人一离开，三个孩子马上交换了意见。他们一致认定，这位新朋友是个真正合得来的人，只盼以后常常见到他。
        - id: ch02-b09
          speaker: caroline
          text: |-
            至少每星期来一次。
        - id: ch02-b10
          speaker: charles
          text: |-
            最好每天来一次。
        - id: ch02-b11
          speaker: narrator
          text: |-
            可他们后来只再见了他一面，而且仅仅一面。字母表先生和舅舅一起走出书房。舅舅去找威廉，叫他把马套上，好送客人到车站。字母表先生则转身走进饭厅，专程向孩子们告别。
        - id: ch02-b12
          speaker: appleby
          text: |-
            夏洛特，我想过埃莉诺夫人的事了。你们可以请舅舅用一块绿帘子，把她连画框一起遮住。然后选合适的花编成花环，横挂在画像前面，再耐心等着。等待时千万不能掀帘子，而且非得用绿色。你们还要一心一意盼着看她走动，听她说话。大约三个星期以后，要是什么也没发生，我反而会吃惊。记住，帘子必须是绿色的。红色厚呢不行，旧蓝缎子也不行，别让管家拿那些东西敷衍你们。只能用绿的。
        - id: ch02-b13
          speaker: charlotte
          text: |-
            您真的觉得会成功吗？
          emotion: surprised
        - id: ch02-b14
          speaker: appleby
          text: |-
            若换了别人，我什么也不敢想。可你们一直幸运得非同寻常，成功应当没有疑问。不过，我没说你们会在这里见到她，也没说会在何时何地见到。这些都是最深奥的秘密。
        - id: ch02-b15
          speaker: appleby
          text: |-
            也许有一天，你们正在吃早饭，会看见帘子轻轻动了一下。起初，你们以为是敞开的窗户吹进了风，接着却发现绿帘鼓起了一块。别忘了，那必须是绿帘子。随后，一只雪白的手会把它掀开。她穿着沙沙作响的丝绸衬裙，脚踏猩红色高跟鞋，从画框里一步跨到最近的椅子上。她也许会这样来，但听清楚了，我只说也许。
        - id: ch02-b16
          speaker: appleby
          text: |-
            当然，你们也可能在树林里遇见她，或在一场热闹的欢宴中，或在奇妙花园本身。那是她的花园，至今仍保持着她当年栽种的样子。你们舅舅给我看过一份古老文书。埃莉诺夫人在上面留下话，只要花园不变，她的祝福就会留给这个家族。文书还列了一长串花名，又画出花园的图，每种花该种的位置都标得清清楚楚。你们不知道吗？我得叫舅舅拿给你们看。我想，她很可能会在花园里现身。
        - id: ch02-b17
          speaker: charles
          text: |-
            您不是在逗我们吧？
        - id: ch02-b18
          speaker: appleby
          text: |-
            你会把我想成那样的人吗？我看不会。只管试试这个咒语，再写信告诉我结果。好啦，达文南特，我就来。帽子在外面，雨伞也拿好了。大家再见，多谢你们让我过了这么愉快的一天。
        - id: ch02-b19
          speakers: [caroline, charlotte, charles]
          ensemble: chorus
          text: |-
            也谢谢您。再见，请快些再来！
        - id: ch02-b20
          speaker: appleby
          text: |-
            别忘了绿色！
        - id: ch02-b21
          speaker: narrator
          text: |-
            这就是他登上双轮马车时留下的最后一句话。他坐到威廉身边，举着雨伞，快活地向侧面前门旁送行的人挥手。
    - id: ch03
      title: 绿帘和花语
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: |-
            查尔斯舅舅听过这个办法，一点也不反对给画像加上帘子。他甚至亲自驾车带孩子们到梅德斯通，专门买了一幅帘料。那羊毛料柔软、宽大、碧绿，实在很软，很宽，也很绿。威尔明顿太太把帘边缝好，舅舅本人登上女仆的活梯，摇摇晃晃地将它挂到了画像前。
        - id: ch03-b02
          speaker: uncle_charles
          text: |-
            最后看她一眼吧。好好记住她的模样，免得见到她时认不出来。
        - id: ch03-b03
          speaker: narrator
          text: |-
            他一边走下梯子，一边仍用手撩着绿帘。埃莉诺夫人从帘后的幽暗中向外望来，几乎已经像个活人。舅舅叫孩子们看仔细些，把她的模样牢牢记住。
        - id: ch03-b04
          speaker: charlotte
          text: |-
            你说的是“免得见到”吗？难道还有“见不到”？
        - id: ch03-b05
          speaker: uncle_charles
          text: |-
            我是说，等你们见到她的时候。
        - id: ch03-b06
          speaker: narrator
          text: |-
            舅舅松开手，长长的绿帘垂下，挡住了画像。现在，人人都开始琢磨该编什么花环，连舅舅也不例外。
        - id: ch03-b07
          speaker: uncle_charles
          text: |-
            Arbor vitæ的意思，是生命之树。
        - id: ch03-b08
          speaker: caroline
          text: |-
            那就用它。它还有一层意思，是“永不改变的友谊”。但愿鲁珀特能在夫人出现以前回来。等他亲眼看见，就一定会相信魔法了。
        - id: ch03-b09
          speaker: narrator
          text: |-
            卡罗琳说着想起了鲁珀特，希望他赶得上亲眼看见画像显灵。随后，孩子们第一次把那本《花语》拿给舅舅看。舅舅翻开书，读起其中那种华丽得叫人喘不过气的句子。这部非凡著作的文风，显然把他深深震住了。
        - id: ch03-b10
          speaker: uncle_charles
          text: |-
            书上说，花语学家从机巧的大自然那奇妙的田野中，选出生命之树，用它表达“为我而活”，再没有什么比这更适合诠释人类内心最深的激情。我以前竟不知道，人能写出这样的句子。不过，你刚刚不是说，生命之树代表另一种意思吗？
        - id: ch03-b11
          speaker: caroline
          text: |-
            一种花经常有好几个意思。以前我们觉得这本书连自己在想什么都不知道。现在我们想，它每发现一个新意思，就会把那个意思添进去。刚开始读，确实会叫人有点糊涂。不过，“为我而活”正合适。我们就是想让画像为了我们活过来呀。接下来还要选什么花呢？
        - id: ch03-b12
          speaker: uncle_charles
          text: |-
            你们自己选吧。这位作者太迷人了，我若继续读，今天剩下的日光都要耗在他身上。告辞。挂花环时需要帮忙，再来叫我。
        - id: ch03-b13
          speaker: narrator
          text: |-
            孩子们道了谢，却有些迟疑。既然埃莉诺夫人是为他们活过来，花环似乎也该由他们亲手挂。
        - id: ch03-b14
          speaker: charles
          text: |-
            她要活给“我们宾格”看，所以最好也让“我们宾格”去挂花环。
        - id: ch03-b15
          speaker: uncle_charles
          text: |-
            应该说“我们主格”，不是“我们宾格”。
        - id: ch03-b16
          speaker: charles
          text: |-
            可我说的就是“我们宾格”。不是把你也算进去的“我们主格”。
        - id: ch03-b17
          speaker: uncle_charles
          text: |-
            我只是在纠正你的语法，不是在纠正你说的事情。算了，再见。
    - id: ch04
      title: 孩子们编花环
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: |-
            接下来还有个难题。书里的人有时把花环戴在头上，那该是圆环。有时又把花环缠在柱子上，那便像圣诞节的装饰彩带。谁也说不准字母表先生指的是哪一种。
        - id: ch04-b02
          speaker: caroline
          text: |-
            两种都做好了，这样才万无一失。
        - id: ch04-b03
          speaker: narrator
          text: |-
            他们拿生命之树的细枝作底，用耶格牌毛线一圈圈缠好。那毛线原本是买给卡罗琳的，好让她织一件背心送给埃梅琳姨妈。可卡罗琳自己也承认，那件背心永远织不完。随后，孩子们把各有寓意的花扎上去。有些细枝弯成一圈，做成戴在头上的圆花环。另一些则接成长长直直的一串，做成缠柱子的长花环。
        - id: ch04-b04
          speaker: charlotte
          text: |-
            我们可以加黑麦草，它代表“性情多变”。我们正想让她改变，从颜料变成活人。还要加粉红马鞭草，它代表“一家团聚”。埃莉诺夫人毕竟是亲戚，而且粉红色多好看呀。
        - id: ch04-b05
          speaker: narrator
          text: |-
            卡罗琳又查到紫杉象征生命。可这一下午最出色的发现，大家公认来自查尔斯。他找到一种名叫“雅各之梯”的花，意思恰好是“下来吧”。这正是孩子们希望画像里的夫人做的事，没有哪一种花语能比它更合适了。
        - id: ch04-b06
          speaker: narrator
          text: |-
            园丁认识雅各之梯，孩子们却连它长什么样也不知道。他们原怕那会是一丛暗沉沉的灌木，开的花小得几乎看不见。等园丁带他们看见那一片鲜亮的蓝色，先前的担心顿时全消失了。
        - id: ch04-b07
          speaker: caroline
          text: |-
            我们自己还应该佩戴小冠花，而且每天换一枝。它代表“愿成功伴随你的心愿”。书上说，那是豆科的开花灌木，有小小的羽状叶片，也不知道那究竟是什么模样。花初开时是红褐色，度过一段优美的生命以后，才慢慢变成黄色。
        - id: ch04-b08
          speaker: gardener
          text: |-
            哦，你说那个呀！那是蝎子番泻树，好像跟天上星星的形状有点关系。乡下老太太常把它当护符，卖给那些不敢向心上人开口的人。
        - id: ch04-b09
          speaker: caroline
          text: |-
            可我们的书说，它代表“愿成功为你的心愿加冕”。
        - id: ch04-b10
          speaker: gardener
          text: |-
            一点不错，连日子也由她定。就是那边那一株。
        - id: ch04-b11
          speaker: narrator
          text: |-
            花环全都做好了。长花环显得十分气派，圆花环则非常美丽。至少，卡罗琳认真地坚持要作这样的区分。深色枝叶间点着鲜明的粉红、蓝色和黄色花朵，各种颜色彼此映衬，显得明亮动人，挂到绿帘前格外好看，连那块单调的绿羊毛料也变得悦目起来。
    - id: ch05
      title: 帘子后面要等三星期
      blocks:
        - id: ch05-b01
          speaker: caroline
          text: |-
            现在只要等着就行。夏洛特和我得专心做手套袋和手帕袋，不然就不能及时寄出去，赶上妈妈的生日。查尔斯，我要是你，就会请彭福尔德先生照他答应的那样，教你做缺口雕刻，再给妈妈做个盒子。还有，谁都不能忘记，不许偷看帘子后面。
        - id: ch05-b02
          speaker: charlotte
          text: |-
            这个我忘不了。我倒想把自己的脑袋忘掉，它好像胀成了平常的两倍大。
        - id: ch05-b03
          speaker: caroline
          text: |-
            我也头疼，大概是太阳晒的。
        - id: ch05-b04
          speaker: charles
          text: |-
            要真是太阳，我也该头疼。可我难受的是鼻子。早饭以后已经用了四条手帕，其中一条还是威尔明顿太太的。
        - id: ch05-b05
          speaker: caroline
          text: |-
            算了，还是去接着绣花吧。我的丝线全缠在一起，乱得要命。
        - id: ch05-b06
          speaker: narrator
          text: |-
            可那一天，丝线始终没有理开。两个姑娘的头反而越来越疼，查尔斯的鼻子也没有好转。这场灾难怎样一步步降临，我们就不细说了。到了第二天，医生来看过三个孩子，只用一句简短而准确的话，便说明了一切。
        - id: ch05-b07
          speaker: doctor
          text: |-
            两个姑娘确实出麻疹了，男孩还没出。
