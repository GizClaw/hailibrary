audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 温暖机敏，带着克制的幽默讲述
        timbre: 清澈柔和
        pace: 从容而富有变化
        pitch: 中音
    caroline:
      display_name: 卡罗琳
      tts:
        delivery: 大方热情，努力摆出长姐的懂事
        timbre: 明亮清脆
        pace: 自然轻快
        pitch: 中高音
    charlotte:
      display_name: 夏洛特
      tts:
        delivery: 活泼直率，想到什么便说什么
        timbre: 轻盈清亮
        pace: 偏快
        pitch: 高音
    charles:
      display_name: 查尔斯
      tts:
        delivery: 淘气认真，笑话总说得一本正经
        timbre: 清亮的男孩声
        pace: 轻快
        pitch: 中高音
    rupert:
      display_name: 鲁珀特
      tts:
        delivery: 倔强有礼，疲惫时仍尽力稳住声音
        timbre: 略带沙哑的男孩声
        pace: 自然偏慢
        pitch: 中高音
    william:
      display_name: 威廉
      tts:
        delivery: 朴实机灵，挖苦话说得不动声色
        timbre: 粗朴温和
        pace: 自然
        pitch: 中低音
  chapters:
    - id: ch01
      title: 第八章　女英雄
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: |-
            夏洛特和查尔斯找遍了屋子、花园和庄园，找了快一个钟头，还是不见卡罗琳。最后，他们抱着一线渺茫的希望，拖着脚步来到马厩院子。两个人早已后悔透了，也愧疚透了。现在，他们只想快点知道姐姐究竟去了哪里。正好，威廉在那里。
        - id: ch01-b02
          speakers: [charlotte, charles]
          ensemble: duo
          text: |-
            你没在附近看见卡罗琳吧？
        - id: ch01-b03
          speaker: narrator
          text: |-
            威廉坐在马具房门口，抽着黑陶烟斗，纽扣眼里还插着一朵玫瑰。
        - id: ch01-b04
          speaker: william
          text: |-
            她刚才还在花园里。这朵插在我纽扣眼里的玫瑰，就是她给我的。你们有这样的姐姐，真该觉得骄傲。
        - id: ch01-b05
          speaker: charles
          text: |-
            为什么？
        - id: ch01-b06
          speaker: william
          text: |-
            就凭她今天早上办的事。
        - id: ch01-b07
          speaker: charles
          text: |-
            她大概觉得自己做得对。
        - id: ch01-b08
          speaker: william
          text: |-
            对不对，我可说不上来。反正她吃过午饭就去了树林，就是你们早上瞎折腾过的地方。她胳膊底下夹着一本书，围裙兜里装满了玫瑰。我抽完这斗烟，也正要往那边走。
        - id: ch01-b09
          speaker: narrator
          text: |-
            姐弟俩慢吞吞地走向树林，心里别提多难受了。他们总觉得，就算卡罗琳认为自己做得有理，也不该回到那个地方去。可是，这句话谁也说不完整。
        - id: ch01-b10
          speaker: charlotte
          text: |-
            我真不懂她怎么还能回那里。鲁珀特早上明明就藏在那里，还好好的。
        - id: ch01-b11
          speaker: narrator
          text: |-
            夏洛特说完，脚下更慢了。两人磨蹭了半天，连抽烟的威廉都快从后面追上他们，这才来到树林边。阳光穿过枝叶，在林间投下斑驳的树影。还没拐进去，查尔斯忽然听见了什么。
        - id: ch01-b12
          speaker: charles
          text: |-
            你听见了吗？
        - id: ch01-b13
          speaker: charlotte
          text: |-
            听见了，只是卡罗在自言自语。
        - id: ch01-b14
          speaker: narrator
          text: |-
            他们接着往前走，却再没听见说话声。等到了那个藏过鲁珀特的蕨草窝，只见卡罗琳一声不响地坐在那里。蕨叶间堆着一片红艳艳的玫瑰，像忽然溅落的一团颜色。
        - id: ch01-b15
          speaker: charlotte
          text: |-
            卡罗，对不起！我们刚才太坏了。现在我明白，你一定觉得自己该像斯巴达男孩那样做。整件事糟透了。我们和好吧，好不好？
          emotion: sad
        - id: ch01-b16
          speaker: narrator
          text: |-
            夏洛特几乎哭了，一屁股坐在姐姐身边。卡罗琳也亲了亲她。
        - id: ch01-b17
          speaker: caroline
          text: |-
            我还以为你们更明白事理，至少该知道我比你们更明白。我刚要解释，你就说了那种话。
          emotion: sad
        - id: ch01-b18
          speaker: narrator
          text: |-
            卡罗琳说，她才刚想解释，夏洛特就说出了那种伤人的话。说完，她吸了吸鼻子。谁都看得出来，她刚才哭过。查尔斯也坐下来，摆出很大方的样子，向姐姐道歉。
        - id: ch01-b19
          speaker: charles
          text: |-
            我也对不起你。别再谈这件事了。我们只能忘掉可怜的鲁珀特。
        - id: ch01-b20
          speaker: charlotte
          text: |-
            我会努力忘掉他。可他真是个好男孩。卡罗，你大概非那么做不可，可我真希望他还能回来。
          emotion: sad
        - id: ch01-b21
          speaker: narrator
          text: |-
            夏洛特真的哭了。卡罗琳伸手搂住她。
        - id: ch01-b22
          speaker: caroline
          text: |-
            别哭呀！你怎么到现在还不明白？我真没想到你这么傻。
        - id: ch01-b23
          speaker: charles
          text: |-
            她一点也不傻。我也希望鲁珀特就在这里。
        - id: ch01-b24
          speaker: caroline
          text: |-
            他就在这里，在你背后。我们以为来的是别人，他才躲起来的。出来吧，鲁珀特，是他们俩。
        - id: ch01-b25
          speaker: narrator
          text: |-
            杂乱的灌木丛里立刻探出一个脑袋。鲁珀特的头发乱得不成样子，上面横七竖八地插满了细树枝和松针。
        - id: ch01-b26
          speaker: charlotte
          text: |-
            你没有逃到海上去？
        - id: ch01-b27
          speaker: rupert
          text: |-
            当然没有。
        - id: ch01-b28
          speaker: narrator
          text: |-
            他用胳膊肘撑着地，身子仍藏在灌木后面，只露出脑袋和肩膀。夏洛特吃惊得很。鲁珀特既然没有投海，那封留在大路上的信又是怎么回事？
        - id: ch01-b29
          speaker: charlotte
          text: |-
            可信上明明说……
        - id: ch01-b30
          speaker: rupert
          text: |-
            那全是她想的，整个计策都是她安排的。我以后再也不说女孩子不中用。她把一切都办妥了，真是个顶呱呱的好家伙。
        - id: ch01-b31
          speaker: narrator
          text: |-
            鲁珀特腾不出手，便拿脑袋朝卡罗琳一指。写出来似乎很古怪，可你亲自试试看，就会发现拿脑袋指人其实一点也不难。他越夸越起劲，卡罗琳的耳朵也越来越红。
        - id: ch01-b32
          speaker: caroline
          text: |-
            闭嘴吧。
        - id: ch01-b33
          speaker: charles
          text: |-
            她到底做了什么？
        - id: ch01-b34
          speaker: rupert
          text: |-
            她把那些人引到别处去了。你自己把整个经过告诉他们吧。
        - id: ch01-b35
          speaker: caroline
          text: |-
            不，你说。
        - id: ch01-b36
          speaker: narrator
          text: |-
            卡罗琳不肯讲。她翻过身去，把鼻子埋进那堆玫瑰里。于是鲁珀特只好从他们离开以后说起，把那场惊险的计策从头讲给姐弟俩听。
        - id: ch01-b37
          speaker: rupert
          text: |-
            你们走后，我真怕得要命。她回来时，我还当是警察，心想除了一点点名誉，什么都保不住了。后来她说出计策，我就把靴子脱下来。
        - id: ch01-b38
          speaker: charles
          text: |-
            什么计策？
        - id: ch01-b39
          speaker: rupert
          text: |-
            当然是她的计策呀，你这个笨蛋。她那个了不起的福尔摩斯式计策。
        - id: ch01-b40
          speaker: charlotte
          text: |-
            你本来可以告诉我们。
        - id: ch01-b41
          speaker: caroline
          text: |-
            威廉和警察都在旁边，我怎么说？
        - id: ch01-b42
          speaker: charlotte
          text: |-
            好吧，接着讲。
        - id: ch01-b43
          speaker: rupert
          text: |-
            她带了记事本，让我写下那封信。我又把手帕和靴子给她。她一直拎着靴子，到了泥地才穿上，踩出那些脚印。
        - id: ch01-b44
          speaker: caroline
          text: |-
            我每一步都使劲踩。然后我从栅栏钻出去，放下信，又绕过门房飞快跑回来。难怪我热成那样。我还看见那个默德斯通式的男人了，不过我戴着遮阳帽。他用手杖削荨麻尖，简直像法国大革命里的人。
        - id: ch01-b45
          speaker: rupert
          text: |-
            她就这样把他们彻底引走了。这里的蕨草全给踩乱，明摆着有人藏过。不把搜寻的人引到别处，他们准会发现我。连这一点也是她事先想到的。
        - id: ch01-b46
          speaker: charles
          text: |-
            那你躲在哪里？
        - id: ch01-b47
          speaker: rupert
          text: |-
            我躲在那棵枝叶茂盛的山毛榉上，看见你们一个个从树下走过去。那个警察像条老猎犬，鼻子都快碰到地了，可你们谁也没有抬头。要我说，卡罗琳绝对是头等一流的好家伙。现在只要你们先把我藏在这里，让我写信给家里，再等到他们的回信就行。没错，好家伙就是好家伙，哪怕她只是个女孩子。
        - id: ch01-b48
          speaker: narrator
          text: |-
            卡罗琳听见鲁珀特一遍遍夸她，心里自然高兴极了，可又拼命装作并不在意。她觉得，真正谦逊的女英雄在这种时候就该换个话题。
        - id: ch01-b49
          speaker: caroline
          text: |-
            瞧你说个没完。我想成立“秘密玫瑰皇家骑士团”。玫瑰代表保守秘密。每个人戴一朵盛开的玫瑰和两朵花苞，这就是徽章。
        - id: ch01-b50
          speaker: narrator
          text: |-
            她从那堆深红的玫瑰里仔细挑出盛开的花和小花苞，一份份送给大家。别花要用的针，她早就别在围裙前襟上了。鲁珀特藏在灌木里，露出笑脸，说自己也有一枚徽章。
        - id: ch01-b51
          speaker: rupert
          text: |-
            我也有徽章，还有……
        - id: ch01-b52
          speaker: charlotte
          text: |-
            嘘，有人来了。是威廉！
        - id: ch01-b53
          speaker: caroline
          text: |-
            没关系。威廉知道，他是我们的人，也戴着皇家玫瑰。
        - id: ch01-b54
          speaker: charles
          text: |-
            一个大人也不会说出去吗？
        - id: ch01-b55
          speaker: william
          text: |-
            不会，我才不会说出去。像卡罗琳小姐这样够朋友的人，我绝不会出卖。
        - id: ch01-b56
          speaker: narrator
          text: |-
            说话的正是威廉。他拨开挡路的枝叶走进来，四平八稳地坐到一个树桩上。查尔斯简直不敢相信，原来一个大人也能加入他们，还肯替他们守住秘密。
        - id: ch01-b57
          speaker: charlotte
          text: |-
            你什么时候发现的？
        - id: ch01-b58
          speaker: william
          text: |-
            她神神秘秘地走开时，我就有点疑心。等她回来，我当然全明白了。
        - id: ch01-b59
          speaker: charles
          text: |-
            为什么是“当然”？
        - id: ch01-b60
          speaker: william
          text: |-
            除了警察，谁会相信卡罗琳小姐能狠心出卖一条信任她的逃家狗？何况还是一位年轻少爷。
        - id: ch01-b61
          speaker: narrator
          text: |-
            威廉的意思再明白不过。只有警察才会误会卡罗琳，把她看成一个会出卖朋友的人。夏洛特和查尔斯听懂以后，羞愧得不能再羞愧了。威廉却还没说完，他接着一项项数起计策里的破绽。
        - id: ch01-b62
          speaker: william
          text: |-
            先说那些靴印。一个后头有人追、拼命逃走的人，哪会留下那么深、那么清楚的脚印？我们穿过庄园时，我还看见树上露出年轻少爷的一小块外套。那条手帕也掉得太方便。等看到信，我真以为这回一切都完了。逃命的人怎么会停下来写信，还端端正正摆在大路中间？这不是聪明反被聪明误吗？可老波德什么都信，吞得比母乳还顺溜。那个教书先生也一样。这个走了，那个也走了，你们全回去吃饭。我来找树上的小伙子，给他送点吃的，再吹口哨告诉他外面安全。后来卡罗琳小姐又封我做“玫瑰水牛骑士团”还是别的什么团的一员。于是大家现在又快活又安全。不过依我看，你们还是该告诉主人。
        - id: ch01-b63
          speaker: caroline
          text: |-
            不能告诉他。那样对鲁珀特不公平。主人也许会觉得自己有责任，或者别的什么。
        - id: ch01-b64
          speaker: charles
          text: |-
            原来不只我们这么想。我们先前也是这样想你的，完全一样。
        - id: ch01-b65
          speaker: narrator
          text: |-
            卡罗琳当天只反击了这一次，所以我们可以原谅她。
        - id: ch01-b66
          speaker: caroline
          text: |-
            只有一个不同。我是对的，你们错了。
        - id: ch01-b67
          speaker: narrator
          text: |-
            查尔斯听完这一句，茫然地“哦”了一声，再也没话说。威廉仍旧不肯放弃，又用劝人的口气说，最好把鲁珀特的事告诉主人。
        - id: ch01-b68
          speaker: charlotte
          text: |-
            可你说过要至死不渝地效忠我们。
        - id: ch01-b69
          speaker: william
          text: |-
            是你问我愿不愿意，我总不能反驳一位小姐。要说闭紧嘴巴不泄密，再帮忙管管吃的，还有在我有钥匙的草料阁楼里铺上毯子和一捆干草，这些我都愿意。连主人自己也不会冒昧地把鼻子伸进去。特别是我见过那个教书先生发火。他气得脸色煞白，整张脸都扭歪了。我连一只瞎眼小猫也不肯交给他慈悲照料。不过我的意见是……
        - id: ch01-b70
          speaker: caroline
          text: |-
            别说了，求你！我们真的不能告诉主人。
        - id: ch01-b71
          speaker: william
          text: |-
            好吧，我也该走了。上回选举以后，我还没一口气说过这么多话呢。其实，我本来就没打算说你以为我要说的那句话。我想说的是，快离开这里。到处都踩乱了，迟早会有人看出来，哪怕只是那个吉姆。你们往树林更深处走。等到天黑，我再来带他离开，把他好好安顿下来。再会！
        - id: ch01-b72
          speaker: narrator
          text: |-
            威廉僵硬地站起身，大步走远。他每走一步，脚下的枯枝和草梗便咔嚓作响。等他的身影消失，夏洛特才慢慢说出自己此刻对姐姐的看法。
        - id: ch01-b73
          speaker: charlotte
          text: |-
            有个活生生的女英雄做姐姐，真了不起。
        - id: ch01-b74
          speaker: charles
          text: |-
            可威廉真的能保守秘密吗？
        - id: ch01-b75
          speaker: rupert
          text: |-
            我敢拿命替他担保。你们不知道他有多够朋友。他给我送来面包和奶酪，还有一药瓶的水。那水喝起来有一点樟脑味，不过他真是个好得不得了的人。
        - id: ch01-b76
          speaker: caroline
          text: |-
            他想泄密也办不到。他戴着皇家玫瑰和一对花苞，那是保守秘密的徽章。一个人只要戴上它，就绝不可能背叛受托保守的秘密。《花语》第三十七页明明就是这么说的。
        - id: ch01-b77
          speaker: narrator
          text: |-
            卡罗琳说得无比郑重。她从玫瑰底下拿起那本《花语》，哗啦啦翻了一阵，终于找到第三十七页。接下来，她照着书念起一段庄严、华丽，而且绕口得不得了的文字。
        - id: ch01-b78
          speaker: caroline
          text: |-
            一朵完全盛开的红玫瑰或锦缎玫瑰，配上它自己的两朵花苞，是永不违犯的——我是说，不可侵犯的——秘密之象征与誓约。凡是佩戴百花中尊贵的王后，又以两朵尚未开放的花苞相伴的人，便借这个雄辩的象征约束自己。那两朵花苞，是她未来盛美的两项未启诺言。戴花的人必须让托付给他的秘密永远保持纯洁，不受玷污。这个秘密来自人类中较为纤弱娇柔的那一部分，而这一部分人类，也像我们正在谈论的美丽花朵一样纤弱娇柔。
        - id: ch01-b79
          speaker: charlotte
          text: |-
            我懂了。那么就算威廉想说，也说不出去。
        - id: ch01-b80
          speaker: charles
          text: |-
            只要这本书说得没错。
        - id: ch01-b81
          speaker: rupert
          text: |-
            反正不会有事。我善于识人，知道威廉光明磊落。就算他能说出去，也绝不会想说。
        - id: ch01-b82
          speaker: charlotte
          text: |-
            那就好了。鲁珀特，你不害怕吗？
        - id: ch01-b83
          speaker: rupert
          text: |-
            怕什么？
        - id: ch01-b84
          speaker: charlotte
          text: |-
            警察呀。
        - id: ch01-b85
          speaker: narrator
          text: |-
            鲁珀特听到“警察”两个字便笑了。他从蕨草里又往外挪了一点。随着这个动作，他纽扣眼里那朵红玫瑰忽然整个露了出来，鲜红鲜红地摆在众人眼前。
        - id: ch01-b86
          speaker: rupert
          text: |-
            威廉说得对。警察连那封信都信，还有什么不会信？就算整个“人民之声”的眼睛都盯着我，卡罗琳也一定能找到一条“中间道路”，也就是脱身之路。
        - id: ch01-b87
          speaker: narrator
          text: |-
            鲁珀特把这句话说得气派堂皇，仿佛真懂得许多大道理。其实，他只是模模糊糊记得老穆格从前认真教过的几句拉丁文。这一点，查尔斯当然不知道。
        - id: ch01-b88
          speaker: caroline
          text: |-
            胡扯！
        - id: ch01-b89
          speaker: charles
          text: |-
            嘿，你居然懂这么多拉丁文！
