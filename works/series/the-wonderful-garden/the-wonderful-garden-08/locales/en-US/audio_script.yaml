audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm, observant storytelling with a gently amused touch
        timbre: clear and rounded
        pace: measured
        pitch: medium
    caroline:
      display_name: Caroline
      tts:
        delivery: lively, affectionate, and increasingly careful when being polite
        timbre: bright and clear
        pace: medium
        pitch: medium-high
    charlotte:
      display_name: Charlotte
      tts:
        delivery: eager, curious, and quick with an idea
        timbre: light and energetic
        pace: brisk
        pitch: high
    charles:
      display_name: Charles
      tts:
        delivery: proud, teasing, and boyishly direct
        timbre: youthful and crisp
        pace: medium-fast
        pitch: medium-high
    rupert:
      display_name: Rupert Wix
      tts:
        delivery: blunt and gloomy at first, warming quickly among friends
        timbre: youthful and slightly husky
        pace: medium
        pitch: medium-high
    william:
      display_name: William
      tts:
        delivery: plainspoken, shrewd, and good-humored
        timbre: rough and earthy
        pace: unhurried
        pitch: low
  chapters:
    - id: ch01
      title: The Heroine
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Charlotte and Charles had searched the house, the garden, and the park for nearly an hour. At last they wandered sadly into the stable yard, hoping against hope that Caroline might be there. By then, they were deeply sorry for how they had treated her, and terribly anxious to find her.
        - id: ch01-b02
          speaker: narrator
          text: William was sitting in the harness-room doorway. He had a rose in his buttonhole and a black clay pipe in his mouth.
        - id: ch01-b03
          speakers: [charlotte, charles]
          ensemble: duo
          text: Have you seen Caroline anywhere?
        - id: ch01-b04
          speaker: william
          text: She was in the garden a little while ago. Gave me this flower, she did. That's a sister to be proud of.
        - id: ch01-b05
          speaker: charles
          text: Why?
        - id: ch01-b06
          speaker: william
          text: Because of what she did this morning.
        - id: ch01-b07
          speaker: charles
          text: I suppose she believed it was right.
        - id: ch01-b08
          speaker: william
          text: I don't know about right. Anyway, after dinner she headed toward that bit of the wood where you were carrying on this morning. She had a book under her arm and her pinafore full of roses. I'll be going that way myself once I've finished my pipe.
        - id: ch01-b09
          speaker: narrator
          text: Charlotte and Charles set off slowly toward the wood, and both of them felt very uneasy. Caroline might have done what she thought was right. Even so, it was hard to understand how she could bear to go back to the very place where Rupert had been safe that morning.
        - id: ch01-b10
          speaker: charlotte
          text: I don't understand how she can go back there. He was safe in that very place this morning.
        - id: ch01-b11
          speaker: narrator
          text: She slowed down even more. William had almost caught up by the time they reached the wood. Just before the dappled shade closed around them, Charles stopped.
        - id: ch01-b12
          speaker: charles
          text: Did you hear that?
        - id: ch01-b13
          speaker: charlotte
          text: Yes. It's only Caro talking to herself.
        - id: ch01-b14
          speaker: narrator
          text: They walked on, but heard no more talking. At the hidden lair, Caroline sat silently among the ferns, with a bright heap of red roses beside her.
        - id: ch01-b15
          speaker: charlotte
          text: Oh, Caro! I'm sorry we were so horrid. We understand now. You must have thought you were being brave and Spartan, or something. It's all too awful. Please, can't we make it up?
          emotion: sad
        - id: ch01-b16
          speaker: narrator
          text: Charlotte dropped beside her sister, almost in tears.
        - id: ch01-b17
          speaker: caroline
          text: I thought you had more sense. Or at least that you'd know I had more sense. That's what I mean. But the moment I started to explain, you said that awful thing and wouldn't listen.
          emotion: sad
        - id: ch01-b18
          speaker: narrator
          text: Caroline kissed Charlotte, then sniffed. She had plainly been crying.
        - id: ch01-b19
          speaker: charles
          text: I'm sorry too. Let's talk about something else now. Our only hope is to forget poor Rupert.
        - id: ch01-b20
          speaker: charlotte
          text: I'll try, but he was such a nice boy. I suppose you had to do it, Caro. Oh, I wish he could come back.
          emotion: sad
        - id: ch01-b21
          speaker: narrator
          text: Charlotte began to cry.
        - id: ch01-b22
          speaker: caroline
          text: Oh, don't cry! You still don't understand? I never knew you could be so silly.
        - id: ch01-b23
          speaker: narrator
          text: Caroline put an arm around her.
        - id: ch01-b24
          speaker: charles
          text: She isn't silly. I wish Rupert were here too.
        - id: ch01-b25
          speaker: caroline
          text: He is here. He's right behind you. We thought you might be someone else, so he hid. Come back, Rupert. It's only them.
        - id: ch01-b26
          speaker: narrator
          text: A head rose from the tangled thicket. Rupert's rough hair bristled with twigs and pine needles.
        - id: ch01-b27
          speakers: [charlotte, charles]
          ensemble: duo
          text: Then you didn't run away to sea?
        - id: ch01-b28
          speaker: rupert
          text: Not likely.
        - id: ch01-b29
          speaker: narrator
          text: He leaned on his elbows, with only his head and shoulders showing.
        - id: ch01-b30
          speaker: charles
          text: But the letter said—
        - id: ch01-b31
          speaker: rupert
          text: That was her idea.
        - id: ch01-b32
          speaker: narrator
          text: Rupert pointed toward Caroline with a movement of his head. It may sound odd, but it is quite easy if you try it.
        - id: ch01-b33
          speaker: rupert
          text: The whole thing was hers. She managed every bit of it. I'll never call girls useless again. She's an absolute brick.
        - id: ch01-b34
          speaker: caroline
          text: Oh, be quiet.
        - id: ch01-b35
          speaker: narrator
          text: Caroline's ears grew hot.
        - id: ch01-b36
          speakers: [charlotte, charles]
          ensemble: duo
          text: But what did she do?
        - id: ch01-b37
          speaker: rupert
          text: She sent them off the wrong way. Go on, tell them.
        - id: ch01-b38
          speaker: caroline
          text: No, you tell them.
        - id: ch01-b39
          speaker: narrator
          text: Caroline rolled over and buried her nose in the roses.
        - id: ch01-b40
          speaker: rupert
          text: All right. After you left, I was in a dreadful blue funk, and I don't mind admitting it. When Caroline came back, I thought the police had found me. I thought everything was lost except honor, and that there was precious little honor left too. Then she explained her whole plan, and I pulled off my boots for her.
        - id: ch01-b41
          speaker: charles
          text: What did she tell you?
        - id: ch01-b42
          speaker: rupert
          text: Her plan, you duffer. Her magnificent Sherlock Holmes plan.
        - id: ch01-b43
          speaker: charlotte
          text: You could have told us about it.
        - id: ch01-b44
          speaker: caroline
          text: How could I, with William and the police all around us?
        - id: ch01-b45
          speaker: charlotte
          text: Well, go on.
        - id: ch01-b46
          speaker: rupert
          text: She had her pocketbook, so I wrote the letter in it. That was her idea too. Then I gave her my handkerchief and my boots. She carried them to the swampy ground, put them on, and made the footprints.
        - id: ch01-b47
          speaker: caroline
          text: I stamped every footprint as deep as I could. Then I found the fence, climbed out, and put the letter where they would find it. After that I simply tore back around by the lodge. Didn't you notice how hot I was when I returned? I saw that Murdstone man on the way, but I had my sunbonnet on, so he didn't recognize me. He was chopping the heads off nettles with his stick, like someone in the French Revolution.
        - id: ch01-b48
          speaker: rupert
          text: She fooled them completely. They were certain to find me here otherwise, because the ferns were trampled everywhere. She had thought of that too.
        - id: ch01-b49
          speaker: charles
          text: Where were you while all that was happening?
        - id: ch01-b50
          speaker: rupert
          text: Up that tree.
        - id: ch01-b51
          speaker: narrator
          text: He pointed to a leafy beech.
        - id: ch01-b52
          speaker: rupert
          text: I watched the whole lot of you go past from among the leaves. Your policeman had his nose to the ground like an old hound, and not one of you thought to look up. Caroline is a true A1, first-class brick. Now, if you can keep me hidden here until I've written to my people and received an answer... Yes, she's a brick. From now on, I'll always stand up for it that bricks are bricks, even when they're only girls.
        - id: ch01-b53
          speaker: caroline
          text: You do make such a fuss.
        - id: ch01-b54
          speaker: narrator
          text: She was delighted by his praise and trying hard not to show it. A modest heroine ought to change the subject, she thought.
        - id: ch01-b55
          speaker: caroline
          text: I thought we could form the Royal Order of the Secret Rose. A rose stands for secrecy. You have to wear two buds and one full-blown flower. That's the badge.
        - id: ch01-b56
          speaker: narrator
          text: From the crimson heap, she chose flowers and buds for the others. The pins she needed came from the front of her pinafore.
        - id: ch01-b57
          speaker: rupert
          text: I've got one too. A badge, I mean, and—
        - id: ch01-b58
          speaker: charlotte
          text: Hush! Someone's coming. It's William!
          emotion: fearful
        - id: ch01-b59
          speaker: caroline
          text: That's all right. William knows. He's one of us, and he's wearing the Royal Rose too.
        - id: ch01-b60
          speaker: charles
          text: And he won't tell? A grown-up really won't tell?
        - id: ch01-b61
          speaker: william
          text: No, he isn't going to tell.
        - id: ch01-b62
          speaker: narrator
          text: William pushed through the leaves and settled himself squarely on a stump.
        - id: ch01-b63
          speaker: william
          text: I don't betray a good sport like Miss Caroline. Not me.
        - id: ch01-b64
          speaker: charlotte
          text: When did you find out?
        - id: ch01-b65
          speaker: william
          text: I suspected something from the start, when Miss Caroline slipped away so cleverly. Then she came back, and of course I knew.
        - id: ch01-b66
          speaker: charles
          text: Why did you know then?
        - id: ch01-b67
          speaker: william
          text: Well, only the police would believe a young lady like Miss Caroline might betray a runaway dog that trusted her, much less a young gentleman.
        - id: ch01-b68
          speaker: narrator
          text: Charlotte and Charles had never felt less pleased with themselves.
        - id: ch01-b69
          speaker: william
          text: And those footprints were far too deep and clear for someone trying to get away with people chasing him. Then, as we crossed the park, I spotted a piece of the young master's jacket up in the tree. That handkerchief had been dropped very conveniently too. Mind you, when we found the letter, I thought the game was up. That seemed a bit much. As if people on the run would stop to write letters, then lay them down neatly in the middle of the road for everyone to find. I thought you'd spoiled your own plan by trying too hard.
        - id: ch01-b70
          speaker: william
          text: But old Poad swallowed every word as easily as mother's milk, and so did the schoolmaster. Off went Poad, off went the other man, and off you children went to dinner. Then I came back to the young fellow in the tree. I brought him a bite to eat and whistled him down when everything was quiet and safe. Miss Caroline came along afterward and made me a member of her ancient order of Rosy Buffaloes, or whatever the name is. So here we all are, as cheerful as you please and as safe as you please. Still, my advice is to tell the Master.
        - id: ch01-b71
          speaker: caroline
          text: We can't. It wouldn't be fair. He might think it was his duty to tell someone, or something.
        - id: ch01-b72
          speaker: charles
          text: Ah, so we're not the only ones. That's exactly what we thought about you.
        - id: ch01-b73
          speaker: caroline
          text: There is one difference. I'm right, and you were wrong.
        - id: ch01-b74
          speaker: narrator
          text: It was the only time Caroline struck back that day, so perhaps she may be forgiven.
        - id: ch01-b75
          speaker: charles
          text: Oh.
        - id: ch01-b76
          speaker: william
          text: Best tell the Master.
        - id: ch01-b77
          speaker: narrator
          text: William's voice was persuasive.
        - id: ch01-b78
          speaker: caroline
          text: You said you were ours to the death.
        - id: ch01-b79
          speaker: william
          text: You asked if I was, and I wasn't going to contradict a lady. I'll keep my tongue between my teeth and lend a hand in the food department. I've got the key to the straw loft too. I can put a rug and a bundle of straw up there, and the Master himself would never think of showing his nose in that place. As far as all that goes, I'm your man.
        - id: ch01-b80
          speaker: william
          text: And after I saw your governess, teacher, pastor, and master in that ugly white rage, his face all twisted, I wouldn't hand a blind kitten over to his tender mercies. But my advice is—
        - id: ch01-b81
          speaker: caroline
          text: Please don't say it. We truly can't tell, you know.
        - id: ch01-b82
          speaker: william
          text: Well, I must get along. I haven't talked this much since the election. And I wasn't going to say what you thought I meant to say. My advice was to get out of this spot. The ground is trampled all over, and somebody is bound to notice it, even if it's only Jim. Go deeper into the wood and stay out of sight. When night comes, I'll fetch the young master away, take him to the loft, and bed him down properly. So long.
        - id: ch01-b83
          speaker: narrator
          text: William tramped off, crunching sticks and stalks beneath his feet.
        - id: ch01-b84
          speaker: charlotte
          text: How wonderful it is to have a real live heroine for a sister.
        - id: ch01-b85
          speaker: charles
          text: Yes, but are you certain William will keep the secret?
        - id: ch01-b86
          speaker: rupert
          text: I'd trust him with my life. You should have seen how decent he was when he brought me bread and cheese, and water in a medicine bottle. The water tasted a little like camphor, but he's a splendid fellow.
        - id: ch01-b87
          speaker: caroline
          text: He has to keep it. He wears the Royal Rose and the twin buds, the badge of secrecy. If you wear that badge, you simply cannot betray a secret. The Language Of says so on page thirty-seven.
        - id: ch01-b88
          speaker: narrator
          text: Caroline picked up the book from under the roses, fluttered through its pages, and found the place. Then she read aloud.
        - id: ch01-b89
          speaker: caroline
          text: The full-blown red or damask rose, worn with two of its own buds, is the emblem and promise of inviolet... I mean, inviolable secrecy. Whoever wears the Royal Queen of flowers, together with two unopened promises of her future magnificence, is bound by this eloquent symbol. He must preserve, pure and uncontaminated, the secret trust placed in him by the more delicate and fragile part of the human race, as fragile and delicate as the lovely flower that is the subject of these remarks.
        - id: ch01-b90
          speaker: charlotte
          text: I see. Then he can't tell, even if he wants to.
        - id: ch01-b91
          speaker: charles
          text: If the book is right.
        - id: ch01-b92
          speaker: rupert
          text: Anyway, it's all right. I'm a judge of human nature, and I know William is the soul of honor. He wouldn't want to tell, even if he could.
        - id: ch01-b93
          speaker: charlotte
          text: Then that's settled. Rupert, aren't you afraid?
        - id: ch01-b94
          speaker: rupert
          text: Afraid of what?
        - id: ch01-b95
          speaker: charlotte
          text: The police.
        - id: ch01-b96
          speaker: narrator
          text: Rupert laughed and wriggled farther out of the ferns. The red rose in his buttonhole suddenly came into view.
        - id: ch01-b97
          speaker: rupert
          text: I think William was right. If the police swallowed that letter, they'll swallow anything. Even if the eyes of the whole vox populi were upon me, Caroline would find a via media... a way out.
        - id: ch01-b98
          speaker: narrator
          text: It was a grand but rather vague memory of old Mug's careful lessons.
        - id: ch01-b99
          speaker: caroline
          text: Rats!
        - id: ch01-b100
          speaker: charles
          text: I say! What a tremendous lot of Latin you know!
