cover_prompt: |-
  A wordless cover scene in an English country-house garden in the summer of 1911 shows four children gathered among geometrically neat flower beds, clipped box borders, stone terrace steps, and an old sundial. Three siblings—an eldest girl of twelve, her younger sister, and their younger brother—stand with a fourth boy, all in simple Edwardian summer clothes, each holding pieces of a freshly plucked white star-shaped flower. The four taste the strange blossoms together in a ring while seven straight green stems rise from the dark, extraordinarily fertile soil, making their shared act and expectant faces the focal action. Behind them, the enclosed garden climbs toward a stone balustrade and dense old trees, with every leaf, bud, and flower uncannily perfect yet gentle and inviting. Use a wide child-height view with the figures and luminous flowers in the lower half, the garden paths leading inward, and generous calm summer sky at the top. Keep the house, clothing, plants, and garden faithful to rural England in 1911, with original child-friendly figures independent of any screen adaptation. No readable text, letters, numbers, labels, logos, captions, speech bubbles, signatures, or watermarks.
