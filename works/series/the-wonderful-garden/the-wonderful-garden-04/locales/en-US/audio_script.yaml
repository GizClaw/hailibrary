  chapters:
    - id: ch01
      title: In Thessalonians
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: You may call it Chance, Fate, Destiny, or Fortune. Call it whatever you like. It will not change what happened.
        - id: ch01-b02
          speaker: narrator
          text: Mrs. Wilmington put a fat brown book of sermons on the shelf and declared it was the last. She did not mean to be wrong. But after tea, the children discovered another book. It was a large, dreary volume called Shadoxhurst on Thessalonians. She had missed it because it lay on the floor under the tablecloth. Charles happened to look there for his handkerchief, which was usually on the floor whenever he needed it.
        - id: ch01-b03
          speaker: narrator
          text: Charles picked up Thessalonians, and its cover came away in his hand, just as cup handles come away for maids who are washing up. Something hidden inside the cover dropped with a thump. Caroline picked it up.
        - id: ch01-b04
          speaker: charles
          text: The cover says Shadoxhurst on Thessalonians.
        - id: ch01-b05
          speaker: caroline
          text: But this isn't that book. It's... Oh! What if this is the book we're looking for?
          emotion: surprised
        - id: ch01-b06
          speaker: narrator
          text: She looked up at the picture. The book in her hands certainly resembled the painted one.
        - id: ch01-b07
          speaker: caroline
          text: It doesn't have brass clasps now, but it used to. Look at the marks where they were fastened.
        - id: ch01-b08
          speaker: narrator
          text: The marks were there.
        - id: ch01-b09
          speaker: charlotte
          text: Glory! We found it on our very first day! Let's show Uncle Charles.
          emotion: surprised
        - id: ch01-b10
          speaker: charlotte
          text: Or perhaps it isn't the right one. He might be furious if we're wrong.
        - id: ch01-b11
          speaker: charles
          text: We can soon find out. Let me see. It ought to be full of magic, Abracadabra, and crossed triangles, like Ingoldsby Legends.
        - id: ch01-b12
          speaker: caroline
          text: I get the first look. I found it.
        - id: ch01-b13
          speaker: charles
          text: I found it. You only picked it up.
        - id: ch01-b14
          speaker: caroline
          text: You only dropped it. Oh, bother!
        - id: ch01-b15
          speaker: narrator
          text: Caroline had opened the book. Now her hands fell, though she still held it.
        - id: ch01-b16
          speakers: [charlotte, charles]
          ensemble: duo
          text: What's the matter?
        - id: ch01-b17
          speaker: caroline
          text: It isn't in English. It's French or Latin or something. Isn't that just our luck? Here, you look.
        - id: ch01-b18
          speaker: charles
          text: It's Latin. I could read it if I knew a little more Latin. I can manage some of it now. I know quam, apud, and rara. We should take it to Uncle Charles.
        - id: ch01-b19
          speaker: caroline
          text: No, let's find out what it is first.
        - id: ch01-b20
          speaker: narrator
          text: That was not easy. The title page was gone, and useful as quam, apud, and rara may be, they gave almost no clue to the subject.
        - id: ch01-b21
          speaker: charles
          text: I wish we had someone to ask. Mrs. Wilmington probably knows no Latin at all, not even apud, quam, and rara. That Murdstone fellow could tell us, if only he were here.
        - id: ch01-b22
          speaker: charlotte
          text: I'm glad he isn't. He probably wouldn't tell us, and he'd take the book away. There must be a church nearby, with a clergyman. He would know.
        - id: ch01-b23
          speaker: caroline
          text: Of course he would! Let's go and ask him.
          emotion: happy
        - id: ch01-b24
          speaker: narrator
          text: Half an hour later, the children came down a lane between deep banks. Ahead stood the gray church tower, ringed by elm trees, old gravestones, and long grass. Across the churchyard was a white-fronted house.
        - id: ch01-b25
          speaker: caroline
          text: I suppose the clergyman lives there. Excuse me, does he live in that house?
        - id: ch01-b26
          speaker: narrator
          text: She had spoken to a pleasant man with a hooked nose. He was repairing the churchyard wall and whistling Blow Away the Morning Dew. With a diamond-shaped trowel, he spread the mortar and neatly trimmed its edges.
        - id: ch01-b27
          speaker: clergyman
          text: He does. Do you need him?
        - id: ch01-b28
          speaker: caroline
          text: Yes, please.
        - id: ch01-b29
          speaker: clergyman
          text: Then you've found him. How can I help?
        - id: ch01-b30
          speaker: caroline
          text: You mean you're... you're the clergyman? I beg your pardon.
          emotion: surprised
        - id: ch01-b31
          speaker: clergyman
          text: At your service.
        - id: ch01-b32
          speaker: narrator
          text: Caroline's ears turned very red.
        - id: ch01-b33
          speaker: caroline
          text: I'm so sorry. I thought you were a working man.
        - id: ch01-b34
          speaker: clergyman
          text: I am, thank God. Our parish is poor, and we haven't much money to spare, so we do the little repairs ourselves. Have you ever set a stone? It's great fun. The mortar spreads so nicely and squeezes out around the edges. Would you like a turn?
        - id: ch01-b35
          speaker: narrator
          text: Of course, all three wanted a turn. Each child laid a stone, patted it into place, and scraped away the extra mortar. By the time they were dusty, dirty, and thoroughly comfortable, they had forgotten why they came.
        - id: ch01-b36
          speaker: clergyman
          text: Oh, this book? It looks interesting. Yes, it's Latin.
        - id: ch01-b37
          speaker: narrator
          text: Though his hands were very dirty, he opened it with care. Charles answered with modest pride.
        - id: ch01-b38
          speaker: charles
          text: That's what I told them. I spotted rara, quam, and apud.
        - id: ch01-b39
          speaker: clergyman
          text: Ah, yes. Rara, quam, and apud. Words of Power.
        - id: ch01-b40
          speakers: [caroline, charlotte, charles]
          ensemble: chorus
          text: You know about Words of Power?
          emotion: surprised
        - id: ch01-b41
          speaker: clergyman
          text: Rather! Do you?
        - id: ch01-b42
          speakers: [caroline, charlotte, charles]
          ensemble: chorus
          text: Rather!
          emotion: happy
        - id: ch01-b43
          speaker: narrator
          text: If their new friendship needed anything more to bind it together, that did the job.
        - id: ch01-b44
          speaker: clergyman
          text: Wait here while I wash my hands. I'll walk home with you, take the book, and tell you what I find tomorrow.
        - id: ch01-b45
          speaker: charles
          text: But what is it about?
        - id: ch01-b46
          speaker: narrator
          text: The clergyman turned the pages with the finger that had the least mortar on it.
        - id: ch01-b47
          speaker: clergyman
          text: What is it about? Oh, spells, charms, and that sort of thing.
        - id: ch01-b48
          speaker: charlotte
          text: How perfectly lovely! Please read one to us. Just one!
          emotion: happy
        - id: ch01-b49
          speaker: clergyman
          text: Right O. Here it is. The seed of the fern, if pulverized... that means pounded or smashed... and laid upon the eyes at the twelfth hour, which means midnight, I think, on the last night before the feast of Saint John... and that's tomorrow... shall give those treated eyes the power to see what cannot be seen. So it lets you see invisible things. But I really must wash. I can feel the dirt soaking into my bones. Will you wait?
        - id: ch01-b50
          speaker: narrator
          text: The children looked at one another before Charlotte answered.
        - id: ch01-b51
          speaker: charlotte
          text: Please don't think we dislike you, because we like you awfully. But if you come home with us, will you have to tell Uncle Charles about the book? It's a secret. He's searching for a book, and we think this may be it, but we don't want to tell him until we're certain.
        - id: ch01-b52
          speaker: charles
          text: I found it inside Somebody-or-other's very dull book on Thessalonians. I knew it was Latin when I saw quam and...
        - id: ch01-b53
          speaker: clergyman
          text: My dear sir and ladies, I am honor itself. I would perish at the stake before revealing one tiny bit of your smallest secret. Trust me to the death.
        - id: ch01-b54
          speaker: narrator
          text: With that, he went away.
        - id: ch01-b55
          speaker: charles
          text: What a different sort of clergyman. He's like anyone else, only nicer.
        - id: ch01-b56
          speaker: caroline
          text: He said, "Thank God." And he said it as if he were in church, not like a cabman or someone in the street.
        - id: ch01-b57
          speaker: charlotte
          text: He said he thanked God he was a working man. I wonder what he meant.
        - id: ch01-b58
          speaker: caroline
          text: I'll ask him one day, when we know him better.
        - id: ch01-b59
          speaker: narrator
          text: Yet anyone who saw the party talking and laughing on the way up the hill would have thought they had known one another quite long enough and could hardly become better friends.
        - id: ch01-b60
          speaker: narrator
          text: That night, Charles dreamed he had mortared the Murdstone man firmly into a first-class railway carriage and was tapping him on the head with a brass trowel that was also a candlestick. Then a gentle pinch woke him. A hand covered his mouth, and someone whispered in the dark.
        - id: ch01-b61
          speaker: charlotte
          text: Hush! Don't say a word.
        - id: ch01-b62
          speaker: charles
          text: Be quiet. I'm asleep. Don't be a duffer. Go back to bed.
        - id: ch01-b63
          speaker: charlotte
          text: No, listen. Caroline and I have been talking about the fern seed. We're going to try it on our eyes and see if it really lets us see invisible things.
        - id: ch01-b64
          speaker: charles
          text: That's silly.
        - id: ch01-b65
          speaker: charlotte
          text: All right. Just don't say later that we never invited you.
        - id: ch01-b66
          speaker: charles
          text: There isn't any fern seed.
        - id: ch01-b67
          speaker: charlotte
          text: Yes, there is. Mrs. Wilmington has little ferns under a glass cover in the housekeeper's room. They aren't much to look at, but their seed should work. Caroline saw them when she asked if we might get up at seven instead of half past, because everything here is so new and lovely. Of course, she really meant the charm book.
        - id: ch01-b68
          speaker: charles
          text: Are you truly going to do it?
        - id: ch01-b69
          speaker: charlotte
          text: Yes.
        - id: ch01-b70
          speaker: charles
          text: Very well. But remember, I said it was silly nonsense, and nothing will happen. I was right about the Latin, you know.
        - id: ch01-b71
          speaker: charlotte
          text: Here's your dressing gown. Feel around for your shoes with your feet. They're probably beside the bed. Hurry!
        - id: ch01-b72
          speaker: narrator
          text: Charles got up with a low grumble. Unlike his sisters, he had not spent more than three hours thinking and talking about fern seed or pinching himself to stay awake. Still, he followed them downstairs to Mrs. Wilmington's room.
        - id: ch01-b73
          speaker: narrator
          text: The room was warm and crowded with antimacassars, china ornaments, and cheerful-looking books of poetry, the sort given as birthday presents and prizes. They were lovely outside, but inside the print was tiny and showed through the thin pages. Charlotte discovered this while the children waited by the light of one candle for midnight.
        - id: ch01-b74
          speaker: narrator
          text: Caroline carefully plucked fern fronds without spoiling the look of the plants.
        - id: ch01-b75
          speaker: charles
          text: It's all rubbish, and don't forget I said so. How will you pound this horrible stuff? If you start pounding, you'll wake Mrs. Wilmington, Uncle Charles, and everyone else.
        - id: ch01-b76
          speaker: narrator
          text: Caroline hesitated with the fronds in her hand. Her short little pigtail stuck out like a saucepan handle, as Charles said afterward.
        - id: ch01-b77
          speaker: caroline
          text: I had an idea. It sounds nasty, but it really isn't if each person does their own. We could chew the fronds ourselves, then put them over our eyes like a poultice. I know you hated it when Aunt Emmeline chewed lily leaves for your burned thumb, Charles. But chewing your own is completely different.
        - id: ch01-b78
          speaker: charles
          text: I don't care. It's only more of your nonsense. Give me the horrible seeds.
        - id: ch01-b79
          speaker: caroline
          text: The seeds won't come away from the leaves. We'll have to chew everything together.
        - id: ch01-b80
          speaker: charlotte
          text: In for a penny, in for a sheep! I mean, we may as well be hanged for a pound as a lamb. I mean...
        - id: ch01-b81
          speaker: caroline
          text: I know what you mean. Here are your fronds. It's almost twelve. Chew as hard as you can. When Mrs. Wilmington's clock starts striking, put them on your eyes. Take them off after the sixth stroke. Yes, that's right. I've planned it all. Now chew.
        - id: ch01-b82
          speaker: charles
          text: I hope they aren't poisonous. Remember that I warned you...
        - id: ch01-b83
          speaker: caroline
          text: Of course they aren't. I've licked ferns often enough, and I'm not dead. Probably nothing will happen. But imagine how foolish we'd feel if we never tried. Tonight is our only chance. The clergyman said so.
        - id: ch01-b84
          speaker: charles
          text: Oh, all right. Once we've done it, you can't keep saying we should have tried.
        - id: ch01-b85
          speaker: charlotte
          text: Chew!
        - id: ch01-b86
          speaker: narrator
          text: The clock began to strike.
        - id: ch01-b87
          speaker: clock
          text: One, two, three, four, five, six.
        - id: ch01-b88
          speaker: narrator
          text: Each child pushed a small bunch of fern fronds into their mouth.
        - id: ch01-b89
          speaker: clock
          text: Seven.
        - id: ch01-b90
          speaker: caroline
          text: Now!
        - id: ch01-b91
          speaker: narrator
          text: And each child put the chewed fern over their eyes. You can picture the scene.
        - id: ch01-b92
          speaker: clock
          text: Eight, nine, ten, eleven, twelve... purr.
        - id: ch01-b93
          speaker: narrator
          text: The clock said no more.
        - id: ch01-b94
          speaker: charlotte
          text: I don't want to take it off. What if we really see something?
          emotion: fearful
        - id: ch01-b95
          speaker: charles
          text: We won't.
        - id: ch01-b96
          speaker: caroline
          text: You have to.
        - id: ch01-b97
          speaker: charlotte
          text: Oh, very well.
        - id: ch01-b98
          speaker: narrator
          text: Charlotte lifted the little poultice of chewed fern from each eye.
        - id: ch01-b99
          speaker: charlotte
          text: There's nothing there.
        - id: ch01-b100
          speaker: charles
          text: I knew there wouldn't be. Perhaps next time you'll believe me.
        - id: ch01-b101
          speaker: caroline
          text: Never mind. We tried, so now we won't keep wondering what might have happened. Let's go to bed. It was decent of you to join us, Charles, when you didn't want to. Oh!
          emotion: surprised
        - id: ch01-b102
          speakers: [charlotte, charles]
          ensemble: duo
          text: What is it?
        - id: ch01-b103
          speaker: charles
          text: Poison. I knew it wasn't safe. You must have chewed harder than we did, and... Oh!
          emotion: fearful
        - id: ch01-b104
          speaker: narrator
          text: Charlotte had already cried out too. All three children stared at the window. A moment before, there had been only the bare blackness of night. Now a face was there, a white face with wide, dark eyes.
        - id: ch01-b105
          speaker: caroline
          text: It is true! The fern seed really does...
          emotion: surprised
        - id: ch01-b106
          speaker: charles
          text: It isn't true.
        - id: ch01-b107
          speaker: narrator
          text: He spoke stoutly, but his eyes never left the face.
        - id: ch01-b108
          speaker: charlotte
          text: Oh, but it is! What's going to happen now?
          emotion: fearful
        - id: ch01-b109
          speaker: narrator
          text: Deep down, none of them had believed the fern seed would work. Yet now their own eyes were seeing the unseen.
        - id: ch01-b110
          speaker: charles
          text: I wish we hadn't done it. I told you not to.
          emotion: fearful
        - id: ch01-b111
          speaker: narrator
          text: The lips of the face moved as though it were speaking.
        - id: ch01-b112
          speaker: charlotte
          text: No! I don't want it to be true!
          emotion: fearful
        - id: ch01-b113
          speaker: narrator
          text: Outside the window, a hand rose. Was it going to knock? The fern seed let the children see what could not be seen, but it did not let them hear what could not be heard. If that hand struck the glass, would they hear it?
        - id: ch01-b114
          speaker: narrator
          text: The hand knocked.
