audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 温暖机敏，带着克制的幽默讲述
        timbre: 清澈柔和
        pace: 从容而富有变化
        pitch: 中音
    caroline:
      display_name: 卡罗琳
      tts:
        delivery: 大方热情，努力摆出长姐的懂事
        timbre: 明亮清脆
        pace: 自然轻快
        pitch: 中高音
    charlotte:
      display_name: 夏洛特
      tts:
        delivery: 活泼直率，想到什么便说什么
        timbre: 轻盈清亮
        pace: 偏快
        pitch: 高音
    charles:
      display_name: 查尔斯
      tts:
        delivery: 淘气认真，笑话总说得一本正经
        timbre: 清亮的男孩声
        pace: 轻快
        pitch: 中高音
    clergyman:
      display_name: 牧师
      tts:
        delivery: 随和风趣，郑重的话也说得爽朗自然
        timbre: 温厚明朗
        pace: 自然舒展
        pitch: 中低音
    clock:
      display_name: 粉红瓷钟
      tts:
        delivery: 机械而一本正经地报时，末尾带一点滑稽的疲倦
        timbre: 清脆玲珑
        pace: 均匀稍慢
        pitch: 高音
  chapters:
    - id: ch01
      title: 第四章　在《帖撒罗尼迦书》里
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: |-
            你可以说这是偶然，也可以说这是命运。说它是天意或运气也行，爱怎么说都随你。可不管你说什么，事实还是事实，一点也不会变。威尔明顿太太把一本厚厚的棕皮布道集塞回书架，说：“好了，这是最后一本。”可她不知道，自己无意间说了一句不实在的话。
        - id: ch01-b02
          speaker: narrator
          text: |-
            下午茶以后，孩子们才发现，那本厚布道集根本不是最后一本。地上还躺着一本又大又乏味的《沙多克斯特论〈帖撒罗尼迦书〉》。威尔明顿太太没有把它放回去，因为桌布把它遮得严严实实。要不是查尔斯碰巧要用手帕，低头在地上寻找，孩子们也不会看见。查尔斯的手帕一到要用的时候，照例都在地上。
        - id: ch01-b03
          speaker: narrator
          text: |-
            查尔斯拾起《帖撒罗尼迦书》，封面竟一下掉在他手中。那情形，就像洗碗女佣拿起杯子，杯把偏偏断在手里一样。藏在封面里的另一本书“砰”地坠到地板上，卡罗琳赶紧捡了起来。
        - id: ch01-b04
          speaker: charles
          text: |-
            封面上写的是《沙多克斯特论〈帖撒罗尼迦书〉》。
        - id: ch01-b05
          speaker: caroline
          text: |-
            可掉出来的不是。等等！这会不会就是我们要找的那本书？
          emotion: surprised
        - id: ch01-b06
          speaker: narrator
          text: |-
            她说到一半，抬头对照墙上的画像。这本书还真的很像画中那一本。
        - id: ch01-b07
          speaker: caroline
          text: |-
            只是它没有黄铜搭扣。不过这里还留着印子，从前一定装过。
        - id: ch01-b08
          speaker: narrator
          text: |-
            大家凑过去看。原先安搭扣的地方，印子确实清清楚楚。
        - id: ch01-b09
          speaker: charlotte
          text: |-
            太棒了！谁能想到，我们来的第一天就把它找到了！快拿给查尔斯舅公看吧。
          emotion: happy
        - id: ch01-b10
          speaker: charlotte
          text: |-
            等等，也许它并不是那一本。我们要是兴冲冲拿去，后来却弄错了，舅公说不定会大发脾气。
        - id: ch01-b11
          speaker: charles
          text: |-
            翻开瞧一眼，很快就知道了。真正的魔法书，里头应该全是魔法、阿布拉卡达布拉，还有《英戈尔兹比传奇》里那种画着交叉线的三角形。
        - id: ch01-b12
          speaker: caroline
          text: |-
            我先看，是我发现它的。
        - id: ch01-b13
          speaker: charles
          text: |-
            明明是我发现的，你只是捡起来。
        - id: ch01-b14
          speaker: caroline
          text: |-
            你只是把它弄掉了。哎呀，怎么偏偏这样！
        - id: ch01-b15
          speaker: narrator
          text: |-
            卡罗琳已经抢先翻开书。才看一眼，她便失望得垂下双手，书却还握在手里。另外两个赶紧追问，到底讨厌什么。
        - id: ch01-b16
          speaker: caroline
          text: |-
            它不是英文，是法文、拉丁文，或是什么别的语言。你们自己看吧。
        - id: ch01-b17
          speaker: charles
          text: |-
            是拉丁文。我要是再多懂一点拉丁文，整本都能读懂。现在也能认出几个词，quam、apud，还有 rara。还是拿给舅公吧。
        - id: ch01-b18
          speaker: caroline
          text: |-
            不行。先弄明白它究竟是什么书。
        - id: ch01-b19
          speaker: narrator
          text: |-
            想弄清楚可不容易。书的扉页已经丢了，连书名也无处可找。quam、apud 和 rara 虽然各有各的正经用处，却没法给出多少线索，更没法告诉他们整本书究竟讲些什么。
        - id: ch01-b20
          speaker: charles
          text: |-
            真希望有个人可以问问。我看威尔明顿一点拉丁文也不懂，她大概连 apud、quam 和 rara 都不认识。要是默德斯通那家伙就在旁边，他倒可能告诉我们。
        - id: ch01-b21
          speaker: charlotte
          text: |-
            幸好他不在。我看他不会告诉我们，还会把书拿走。我说，这附近总该有一座教堂吧。有教堂就该有牧师，牧师准懂拉丁文。
        - id: ch01-b22
          speaker: caroline
          text: |-
            对呀，我们找他问去。
        - id: ch01-b23
          speaker: narrator
          text: |-
            半个钟头后，他们沿着一条两边土坡高高隆起的小路往下走，看见灰色的教堂塔楼立在榆树之间。塔楼四周，是古老的墓碑和一片片长草。墓园对面有一栋白墙房子。一个长着鹰钩鼻、模样和气的男人正在修围墙。他一边吹《吹散清晨的露珠》，一边拍上灰泥，再拿菱形泥刀把边缘修得整整齐齐。
        - id: ch01-b24
          speaker: caroline
          text: |-
            请问，牧师住在那栋房子里吗？
        - id: ch01-b25
          speaker: clergyman
          text: |-
            是啊。你们找他？那他就在这里。有什么事？
        - id: ch01-b26
          speaker: caroline
          text: |-
            您的意思是，您就是……就是牧师？请原谅。我还以为您是个干活的人呢。
        - id: ch01-b27
          speaker: narrator
          text: |-
            她的耳朵一下红透了。
        - id: ch01-b28
          speaker: clergyman
          text: |-
            我本来就是，感谢上帝。你们看，这个教区很穷，我们没多少余钱，所以零零碎碎的修补都得自己动手。你们砌过石头吗？可有意思了。灰泥往上一抹，又听话又服帖，从石头边上挤出来的样子也很痛快。查尔斯，你想试试吗？
        - id: ch01-b29
          speaker: narrator
          text: |-
            他们当然全都想试。三个人各砌了一块石头，把它拍进合适的位置，再刮掉挤出来的灰泥。一直到每个人都沾满尘土和污渍，浑身脏得透透的，也舒服得透透的，才终于有人想起，他们原本为什么来到这里。
        - id: ch01-b30
          speaker: clergyman
          text: |-
            哦，是这本？看着很有意思。拉丁文。
        - id: ch01-b31
          speaker: narrator
          text: |-
            他的两只手都沾着灰泥，只能格外小心地翻开书。我们当然得叫他牧师。可他穿着沾满灰泥的法兰绒衣裤，外面又套一件蓝色便上衣，看起来半点也不像牧师。要从世上找一个更不像牧师的人，恐怕还真找不到。
        - id: ch01-b32
          speaker: charles
          text: |-
            我早说是拉丁文。我看见了 rara、quam 和 apud。
        - id: ch01-b33
          speaker: clergyman
          text: |-
            没错。rara、quam、apud，都是有魔力的词。
        - id: ch01-b34
          speaker: caroline
          text: |-
            原来您也知道有魔力的词？
        - id: ch01-b35
          speaker: clergyman
          text: |-
            那还用说！你们也知道？
        - id: ch01-b36
          speakers: [caroline, charlotte, charles]
          ensemble: chorus
          text: |-
            那还用说！
        - id: ch01-b37
          speaker: narrator
          text: |-
            要是这份刚结下的交情还缺一点什么，才能粘得牢牢的，这几句话也足够了。
        - id: ch01-b38
          speaker: clergyman
          text: |-
            听我说，你们只要等我洗过手，我就陪你们一路走回去。这本书也交给我仔细看看，明天我一定向你们报告。
        - id: ch01-b39
          speaker: charlotte
          text: |-
            可它讲的到底是什么？
        - id: ch01-b40
          speaker: clergyman
          text: |-
            讲什么？哦，讲的是咒语、法术，还有这一类神秘的东西。
        - id: ch01-b41
          speaker: charlotte
          text: |-
            太美妙了！给我们念一条吧，只要一条。
          emotion: happy
        - id: ch01-b42
          speaker: clergyman
          text: |-
            行啊。“蕨类之种，若碾为粉末”，也就是捣碎、砸烂，你们懂吧。“于第十二时辰敷于双眼”，就是半夜，至少我想是这个意思。“须在圣约翰节前最后一夜”，顺便说一句，就是明晚。“如此施治，双眼便可得见不可见之物。”也就是说，你们会看见隐形的东西。现在我真得洗手了，泥好像快渗进骨头里啦。你们等我吗？
        - id: ch01-b43
          speaker: narrator
          text: |-
            孩子们互相看了看。夏洛特开口了。
        - id: ch01-b44
          speaker: charlotte
          text: |-
            您可别误会，以为我们不喜欢您。我们特别喜欢您。可是，如果您跟我们一道回去，会不会觉得非得把这本书告诉舅公？因为这是个秘密。舅公正在找一本书，我们怀疑就是它。可在完全确定以前，我们还不想告诉他。
        - id: ch01-b45
          speaker: charles
          text: |-
            我是在一本某某人论《帖撒罗尼迦书》的书里找到它的，那本书无聊透顶。我一看见 quam，就知道这是拉丁文，还有……
        - id: ch01-b46
          speaker: clergyman
          text: |-
            我亲爱的先生，还有几位女士，我把荣誉看得比性命还重。就算被绑在火刑柱上活活烧死，我也绝不泄露你们最小的秘密，连一厘米都不泄露。你们尽管信任我，信任到死也没有问题。
        - id: ch01-b47
          speaker: narrator
          text: |-
            这位可亲的牧师说完，便转身去洗手了。
        - id: ch01-b48
          speaker: charles
          text: |-
            这个牧师跟别的牧师真不一样。他就像随便哪一个普通人，只不过比普通人更讨人喜欢。
        - id: ch01-b49
          speaker: caroline
          text: |-
            可他还是说了“感谢上帝”。而且那句话说得像在教堂里，不像马车夫和街上的人随口说出来的。
        - id: ch01-b50
          speaker: charlotte
          text: |-
            他说的是，感谢上帝，他是个干活的人。我真想知道，这句话究竟是什么意思。
        - id: ch01-b51
          speaker: caroline
          text: |-
            等我们跟他再熟一点，我就问问。
        - id: ch01-b52
          speaker: narrator
          text: |-
            卡罗琳说，等大家再熟一点，她一定去问问。可离开教堂以后，他们一路谈着、笑着，沿山坡往上走。谁要是迎面遇见这群人，一定会以为他们早已认识很久，彼此再也不可能比现在更熟了。
        - id: ch01-b53
          speaker: narrator
          text: |-
            夜里，查尔斯做了一个梦。他正用灰泥把默德斯通先生牢牢砌进一节头等车厢，又拿黄铜泥刀敲他的脑袋。奇怪的是，那把泥刀同时还是一座烛台。就在这时，有人轻轻掐了他一下，把他弄醒了。与此同时，一只手捂住他的嘴，一个声音贴着耳边悄悄响起。
        - id: ch01-b54
          speaker: charlotte
          text: |-
            嘘！别出声。
        - id: ch01-b55
          speaker: charles
          text: |-
            闭嘴。我睡着呢。别犯傻，回床上去。
        - id: ch01-b56
          speaker: charlotte
          text: |-
            卡罗琳和我一直在商量蕨种。我们决定试试看。我是说，把蕨种敷在眼睛上，瞧瞧我们到底能不能看见隐形的东西。
        - id: ch01-b57
          speaker: charles
          text: |-
            真蠢。
        - id: ch01-b58
          speaker: charlotte
          text: |-
            随你。以后别说我们没叫你。
        - id: ch01-b59
          speaker: charles
          text: |-
            可这里根本没有蕨种。
        - id: ch01-b60
          speaker: charlotte
          text: |-
            有。威尔明顿在管家房里养了几盆小蕨，都罩在玻璃罩下面。那些蕨看着呆头呆脑，种子大概没有问题。卡萝去问她，明早能不能七点起床，不等到七点半。她嘴上说，是因为这里样样东西都又新鲜又可爱，其实当然是为了咒语书。她进屋时看见了那些蕨。
        - id: ch01-b61
          speaker: charles
          text: |-
            你们真要做？
        - id: ch01-b62
          speaker: charlotte
          text: |-
            对。来不来随你。
        - id: ch01-b63
          speaker: charles
          text: |-
            哦，那好吧。不过你可别忘了，我早就告诉你们，这是胡闹，肯定什么也不会发生。那本书是拉丁文，我不是早就说对了吗？
        - id: ch01-b64
          speaker: charlotte
          text: |-
            睡袍在这里。我刚才一直在衣柜里摸，总算找到了。鞋子大概就在床边，你用脚乱扒几下吧。快点。
        - id: ch01-b65
          speaker: narrator
          text: |-
            查尔斯躺在暖和的被窝里，嘴上还在反对，最后却低声抱怨着起了床。他当然不像两个姐姐那么起劲。三个多钟头以来，她们想的、谈的全是蕨种，为了不睡着还得互相掐来掐去。可查尔斯到底披上睡袍，摸到鞋子，跟她们一起下了楼。
        - id: ch01-b66
          speaker: narrator
          text: |-
            威尔明顿太太的房间暖烘烘的，看起来到处都是椅背罩、瓷器摆设，还有装帧得喜气洋洋的诗集。这种诗集最适合拿来当生日礼物和奖品，外面漂漂亮亮，里面却是薄纸和蝇头小字，连纸背的字都透出来。三个孩子只带了一支蜡烛。等候十二点的时候，夏洛特借着那点光，发现了诗集里面的模样。
        - id: ch01-b67
          speaker: narrator
          text: |-
            卡罗琳仔细摘下一片片蕨叶，生怕把盆栽弄得难看。
        - id: ch01-b68
          speaker: charles
          text: |-
            全是胡闹，别忘了我说过。还有，这讨厌的东西打算怎么捣碎？真要砸起来，威尔明顿、舅公和全家上下都会给你们吵醒。
        - id: ch01-b69
          speaker: narrator
          text: |-
            卡罗琳迟疑地捏着蕨叶。她那条短短的小辫子向后翘着，照查尔斯后来形容的，活像一只平底锅的把手。
        - id: ch01-b70
          speaker: caroline
          text: |-
            我有个办法。听起来有点恶心，可只要记住每个人自己嚼自己的，其实也没什么。我们把叶子嚼碎，再像敷药一样敷在眼睛上。查尔斯，你烫伤大拇指时，埃默琳姨妈嚼碎百合叶给你敷，你是特别讨厌。可别人替你嚼，跟自己嚼完全不同。
        - id: ch01-b71
          speaker: charles
          text: |-
            我才不在乎。反正不过是你们又一种胡闹。来吧，把那些讨厌的种子给我。
        - id: ch01-b72
          speaker: caroline
          text: |-
            种子摘不下来，只能连叶子一起嚼。
        - id: ch01-b73
          speaker: charlotte
          text: |-
            一便士都花了，还怕花一只羊吗？我是说，反正偷一磅也得上绞架，何必舍不得一只小羊。我是说……哎呀，反正已经开始了，就做到底。
        - id: ch01-b74
          speaker: caroline
          text: |-
            我明白你要说什么。给你。马上十二点了，使劲嚼。等钟开始敲，就把它敷到眼睛上。钟敲过六下，再拿下来。对，我全都想过了。这样一定没错。好了，嚼吧。
        - id: ch01-b75
          speaker: charles
          text: |-
            但愿没毒。记住，我提醒过你们……
        - id: ch01-b76
          speaker: caroline
          text: |-
            当然没有毒。我以前舔过好多次蕨叶，现在不是还活着吗？我说，也许什么都不会发生。可如果连试都不试，以后想起来，我们才会觉得自己真傻。况且只有今晚这一夜可以，牧师说过的。
        - id: ch01-b77
          speaker: charles
          text: |-
            哦，好吧。不管怎样，只要真的试过了，你们以后总不能老在我耳边念叨，当初早该试试看。
        - id: ch01-b78
          speaker: charlotte
          text: |-
            嚼。
        - id: ch01-b79
          speaker: narrator
          text: |-
            夏洛特一声令下，钟正好开始敲响。那座粉红瓷钟装饰得花团锦簇，报时的模样却一本正经。三个孩子一边听它数，一边各自把一小束蕨叶塞进嘴里。
        - id: ch01-b80
          speaker: clock
          text: |-
            一、二、三、四、五、六。七。
        - id: ch01-b81
          speaker: caroline
          text: |-
            敷上去。
        - id: ch01-b82
          speaker: narrator
          text: |-
            于是，每个孩子都把刚嚼烂的蕨叶敷在眼睛上。那副情景，你们还是自己想吧。
        - id: ch01-b83
          speaker: clock
          text: |-
            八、九、十、十一、十二，呼噜。
        - id: ch01-b84
          speaker: narrator
          text: |-
            粉红瓷钟说完，再也不响了。
        - id: ch01-b85
          speaker: charlotte
          text: |-
            我不想把叶子拿下来。万一拿开以后，我们真的看见了什么可怕的东西呢？
          emotion: fearful
        - id: ch01-b86
          speaker: charles
          text: |-
            什么也看不见。
        - id: ch01-b87
          speaker: caroline
          text: |-
            你必须拿下来。
        - id: ch01-b88
          speaker: narrator
          text: |-
            夏洛特勉强答应一声，这才抬起手，从两只眼睛上分别揭下一个嚼烂的蕨叶小药包。
        - id: ch01-b89
          speaker: charlotte
          text: |-
            什么也没有。
        - id: ch01-b90
          speaker: charles
          text: |-
            我早就知道什么也不会有。也许下一次，你们总算会记得我说得对。
        - id: ch01-b91
          speaker: caroline
          text: |-
            没关系，至少我们试过了。以后不会老是惦记，要是那晚试了，究竟会发生什么。回去睡觉吧。查尔斯，你本来不大愿意，还肯陪我们一起试，真够朋友……啊！
          emotion: surprised
        - id: ch01-b92
          speakers: [charlotte, charles]
          ensemble: duo
          text: |-
            怎么了？
        - id: ch01-b93
          speaker: charles
          text: |-
            中毒了。我就知道这东西不安全。你大概比我们嚼得更用力，所以先发作了。你看……啊！
          emotion: fearful
        - id: ch01-b94
          speaker: narrator
          text: |-
            夏洛特也已经叫过一声。现在，三个孩子全都直瞪瞪地盯住前方的窗户。就在片刻以前，外面还只有一片空荡荡的漆黑夜色。如今那里却出现了一张脸。一张惨白的脸，睁着一双大大的黑眼睛。
        - id: ch01-b95
          speaker: caroline
          text: |-
            是真的。蕨种真的能……
          emotion: fearful
        - id: ch01-b96
          speaker: charles
          text: |-
            不是真的。肯定不是真的。
          emotion: fearful
        - id: ch01-b97
          speaker: narrator
          text: |-
            查尔斯嘴上说得坚定，眼睛却一刻也没离开那张脸。
        - id: ch01-b98
          speaker: charlotte
          text: |-
            可它就在那儿。现在会发生什么？
          emotion: fearful
        - id: ch01-b99
          speaker: narrator
          text: |-
            其实在心底最深的地方，他们谁也不曾真正相信蕨种会有用。可现在，每个孩子都觉得，蕨种竟然做到了不可能的事。他们睁着自己的眼睛，正清清楚楚地看着原本看不见的东西。
        - id: ch01-b100
          speaker: charles
          text: |-
            真希望我们根本没有试。我早就劝过你们别这么做。
          emotion: fearful
        - id: ch01-b101
          speaker: narrator
          text: |-
            窗外那张惨白的脸动了动嘴唇，仿佛正隔着玻璃对他们说话。可是屋里听不见一个字。
        - id: ch01-b102
          speaker: charlotte
          text: |-
            不！我不想让它是真的。
          emotion: fearful
        - id: ch01-b103
          speaker: narrator
          text: |-
            窗外又举起一只手。它会敲窗户吗？蕨种只能让人看见看不见的东西，却不能让人听见听不见的声音。可那只手分明就要敲下来了，眼看就要碰到玻璃。如果它真的敲在玻璃上，他们会听见吗？
        - id: ch01-b104
          speaker: narrator
          text: |-
            下一刻，就在三个孩子眼前，那只手真的落了下来。它敲响了窗户。
