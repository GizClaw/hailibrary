audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 温暖机敏，带着克制的幽默讲述
        timbre: 清澈柔和
        pace: 从容而富有变化
        pitch: 中音
    caroline:
      display_name: 卡罗琳
      tts:
        delivery: 大方热情，努力摆出长姐的懂事
        timbre: 明亮清脆
        pace: 自然轻快
        pitch: 中高音
    charlotte:
      display_name: 夏洛特
      tts:
        delivery: 活泼直率，想到什么便说什么
        timbre: 轻盈清亮
        pace: 偏快
        pitch: 高音
    charles:
      display_name: 查尔斯
      tts:
        delivery: 淘气认真，笑话总说得一本正经
        timbre: 清亮的男孩声
        pace: 轻快
        pitch: 中高音
    rupert:
      display_name: 鲁珀特
      tts:
        delivery: 倔强有礼，疲惫时仍尽力稳住声音
        timbre: 略带沙哑的男孩声
        pace: 自然偏慢
        pitch: 中高音
    william:
      display_name: 威廉
      tts:
        delivery: 朴实机灵，挖苦话说得不动声色
        timbre: 粗朴温和
        pace: 自然
        pitch: 中低音
    mrs_wilmington:
      display_name: 威尔明顿太太
      tts:
        delivery: 谨慎严肃，字句里带着管家的规矩
        timbre: 紧致清楚
        pace: 稍慢
        pitch: 中音
    uncle:
      display_name: 舅舅
      tts:
        delivery: 和善拘谨，说话时总带一点不安
        timbre: 温和单薄
        pace: 从容
        pitch: 中音
    mr_penfold:
      display_name: 彭福尔德先生
      tts:
        delivery: 体贴睿智，温和的话里带一点奇趣
        timbre: 温暖清朗
        pace: 从容
        pitch: 中低音
  chapters:
    - id: ch01
      title: 第十章　调制魔法药水
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: |-
            事情越来越棘手了。三个孩子独自坐马车出去拜访朋友，这本该让人十分开心。那场拜访也确实有趣，他们吃了薄荷糖，看了一大批漂亮的蝴蝶标本，还获准亲手弹一弹小风琴。可就在所有这些快乐底下，卡罗琳心底那份为难始终没有消失，一路都在不停地磨着她。
        - id: ch01-b02
          speaker: narrator
          text: |-
            查尔斯和夏洛特在一间空荡荡的大屋里试弹风琴。那里从前是老牧师的客厅，如今用来举办各种教区聚会。彭福尔德先生则带卡罗琳进了温室，让她看自己的宠物水螈。
        - id: ch01-b03
          speaker: mr_penfold
          text: |-
            来见见我的朋友吧。瞧，他穿着橘黄色的小背心呢。
        - id: ch01-b04
          speaker: narrator
          text: |-
            水螈很可爱，橘黄色的肚皮也很好看，可它赶不走卡罗琳的忧虑。那些装着食物的玻璃杯，究竟怎么送到鲁珀特手里？她越想越发愁。这场冒险已经大得吓人，也认真得吓人，渐渐不像三个孩子能够应付的事了。后来，彭福尔德先生忽然问她能不能保守秘密，又让她看一只绿鹦鹉。鹦鹉躲在一大盆天竺葵后面，正安安稳稳地伏在窝里。卡罗琳真想先答应替他保密，再把压在自己心上的秘密也说出来。可她欣赏过鹦鹉以后，却换了一个问法。
        - id: ch01-b05
          speaker: caroline
          text: |-
            您是牧师，什么是对、什么是错，您一定全都明白吧？
        - id: ch01-b06
          speaker: mr_penfold
          text: |-
            我只能尽力弄明白。你想问什么呢？
        - id: ch01-b07
          speaker: caroline
          text: |-
            有些秘密是不是应该守住？就算有些人知道以后，会说你不该守，也还是该守。当然，他们现在根本不知道。
        - id: ch01-b08
          speaker: narrator
          text: |-
            这样绕来绕去的话，彭福尔德先生居然听懂了，实在很聪明。
        - id: ch01-b09
          speaker: mr_penfold
          text: |-
            有些事，每个人都得自己判断。你能举个相仿的例子吗？不用讲你心里那件真事，只讲一件差不多的就行。
        - id: ch01-b10
          speaker: caroline
          text: |-
            我当然不会把真事告诉您。可是假如……
        - id: ch01-b11
          speaker: narrator
          text: |-
            卡罗琳停了下来。她忽然想到一个自以为绝顶聪明的办法。她可以把真事说出来，而彭福尔德先生一定会以为那只是个假例子。
        - id: ch01-b12
          speaker: mr_penfold
          text: |-
            假如什么？
        - id: ch01-b13
          speaker: caroline
          text: |-
            昨天大家都在找一个逃跑的男孩，您听说了吧？
        - id: ch01-b14
          speaker: narrator
          text: |-
            彭福尔德先生低头摘着鲑红色倒挂金钟上的枯叶。
        - id: ch01-b15
          speaker: mr_penfold
          text: |-
            听说了。他还没有被找到，对吗？
        - id: ch01-b16
          speaker: caroline
          text: |-
            对。那么，假如他来找您，您会怎么办？您总不会把他交出去吧？
        - id: ch01-b17
          speaker: mr_penfold
          text: |-
            可我不了解这件事的实情。
        - id: ch01-b18
          speaker: caroline
          text: |-
            假如他是个逃跑的奴隶呢？
        - id: ch01-b19
          speaker: mr_penfold
          text: |-
            那我当然不会交出去。
        - id: ch01-b20
          speaker: caroline
          text: |-
            这不就对了吗？
        - id: ch01-b21
          speaker: mr_penfold
          text: |-
            可是不把他交出去，事情还没有完。他得吃饭，得穿衣服，也得有地方睡觉。想一直藏住一个人，绝对办不到。别人迟早会找到他。
        - id: ch01-b22
          speaker: caroline
          text: |-
            是啊。可是，那又能怎么办呢？
        - id: ch01-b23
          speaker: mr_penfold
          text: |-
            先不说那个男孩，反正他只是例子。要是你遇上了别的难处，就该告诉舅舅。你可以完全信任他，他会判断怎样做才对。你若愿意，也可以告诉我，我一定尽力帮你。
        - id: ch01-b24
          speaker: caroline
          text: |-
            以后我有了能告诉您的秘密，一定会说。现在我们成立了秘密会社，所以大家都戴着红玫瑰。
        - id: ch01-b25
          speaker: mr_penfold
          text: |-
            真希望我也能加入。也许以后，你们会收下我吧？
        - id: ch01-b26
          speaker: caroline
          text: |-
            只要有一天可以，我一定让您加入。
        - id: ch01-b27
          speaker: narrator
          text: |-
            另外两个孩子也跑来看水螈，随后大家坐马车回家喝茶。舅舅和彭福尔德先生谈起许多事。孩子们也许听得懂，只要他们肯认真听。可他们的心思全在书架后面，那里藏着一杯杯牛肉和布丁，等着送给鲁珀特。他们只零星听见“金枝”“神话”和“民间传说”，一点也没放在心上。直到“秘密仪式”和“象征”钻进耳朵，才稍稍留神。
        - id: ch01-b28
          speaker: uncle
          text: |-
            到我书房来吧。我把方才说的那一段找给你看。
        - id: ch01-b29
          speaker: narrator
          text: |-
            两位大人一离开，三个孩子马上赶往马厩院子。马厩里的男人们已经去喝茶，宅里的仆人们也在吃自己的茶点，眼下不会有人留意他们，安全得很。可杯里的牛肉和布丁已经凉透，表面蒙上一层凝固的薄油，看着一点也不诱人。查尔斯把几只杯子塞在衣服两侧的大口袋里，女孩们则小心地把其余杯子藏到围裙底下。
        - id: ch01-b30
          speaker: narrator
          text: |-
            威廉一看见他们，脸上就写满了不赞成。
        - id: ch01-b31
          speaker: william
          text: |-
            你们来晚了。我还要去村里给轻便马车配根新车轴。那些乱七八糟的是什么？难道我给那位大老爷吃的东西，还配不上他？
        - id: ch01-b32
          speaker: caroline
          text: |-
            当然配得上。我们只想让他换换口味。威廉，别生气。你可是我们的大恩仁呀。
        - id: ch01-b33
          speaker: william
          text: |-
            管它恩仁还是豆仁，今晚你们都见不着他。快走吧，我会把他照料好的。吃的可以留下。明早八点左右再来，到时候再看。
        - id: ch01-b34
          speaker: narrator
          text: |-
            三个孩子失望地回到餐厅。夏洛特原以为救人会是另一番样子，可现在一切都很没劲，而且这种日子还要过上好几个星期。卡罗琳最受不了的是整天提心吊胆。彭福尔德先生说得没错，秘密的确是一种很难养的宠物。眼下这个秘密既不能放走，也不能让别人看见，三个人却又不知道怎样才能好好养活它。
        - id: ch01-b35
          speaker: charlotte
          text: |-
            为什么一件事原本看着会永远不变，后来却总是变得跟原先想的不一样呢？
        - id: ch01-b36
          speaker: caroline
          text: |-
            我们的年纪太小，恐怕还不适合救人。
        - id: ch01-b37
          speaker: charles
          text: |-
            可除了救他，我们没有别的办法。不管年纪多小，现在也只能继续救下去。
        - id: ch01-b38
          speaker: narrator
          text: |-
            他们谈了整整一个钟头。谁也想不出新办法，只能把同样的担忧和同样的理由来来回回说上好多遍。就在三个人快要把话全说尽时，彭福尔德先生走进来告辞。他告诉孩子们，那本书的翻译已经有了进展，内容非常有趣。他口袋里还装着几页刚译好的手稿。
        - id: ch01-b39
          speakers: [caroline, charlotte, charles]
          ensemble: chorus
          text: |-
            快让我们看看吧！
        - id: ch01-b40
          speaker: mr_penfold
          text: |-
            只能看一页，不然唱诗班练习就要迟到了。
        - id: ch01-b41
          speaker: narrator
          text: |-
            他把一张打字纸放在桌上，三个孩子全趴过去读。开头写着，怎样使自己的请求得到满足，又说起有利于求请的草药。可是该写草药名字的地方还空着。彭福尔德先生解释说，那些名字太麻烦，他还没来得及翻译出来。
        - id: ch01-b42
          speaker: narrator
          text: |-
            那张纸又说，向国王或身居高位的人求情时，应该送上用那些花草扎成的花束或花环。若把草药捣烂，挤出汁液，煎煮后混进一点温热的雪莉酒、烈酒或其他合适的饮品里，再让掌管此事的人喝下，效力会更强。不过，要这样做，就得有门路接近国王的内廷，或接近那位能够答应请求的人的家里。还有一条，那些草药必须由请愿者本人在初弦月时亲手采摘。只有这样，它们才有本领让对方的心转向自己，乐意听取请求。
        - id: ch01-b43
          speaker: narrator
          text: |-
            这一页到此为止。三个孩子只好承认，他们完全没看懂。
        - id: ch01-b44
          speaker: mr_penfold
          text: |-
            意思很简单，就是求别人办事时可以这样做。我记得有一种草药是凤仙花。我真得走了。这张纸，你们喜欢就留到明天。
        - id: ch01-b45
          speaker: charlotte
          text: |-
            我们非把事情告诉舅舅不可。先煎一剂凤仙花药汤给他喝，然后再说吧。
        - id: ch01-b46
          speaker: narrator
          text: |-
            另外两个孩子起初根本不肯听。可到了第二天中午，他们就不得不认真考虑这个主意了。威廉准他们去阁楼看鲁珀特。男孩躺在干草上，眼睛亮得反常，两只手摸上去滚烫。他几乎一直在咳。那咳嗽的声音很小，听起来似乎并不厉害，可一声接着一声，怎么也不肯停。
        - id: ch01-b47
          speaker: caroline
          text: |-
            威廉，我们必须告诉舅舅。鲁珀特一定是病了，得请医生来看他。
        - id: ch01-b48
          speaker: william
          text: |-
            这回您说对了，小姐。我从一开始就怎么劝你们来着？
        - id: ch01-b49
          speaker: narrator
          text: |-
            卡罗琳本以为鲁珀特会严厉反对，甚至会说，与其让舅舅知道，他宁可真的逃去海上。可鲁珀特只在干草上烦躁地转过头。
        - id: ch01-b50
          speaker: rupert
          text: |-
            我不在乎了。你们想怎么办，就怎么办吧。
          emotion: sad
        - id: ch01-b51
          speaker: narrator
          text: |-
            幸好这一天阳光很好。午饭后，他们全都进花园找凤仙花，却一朵也没找到。卡罗琳便拿来《花语》，想挑几种最像是能叫别人照他们心愿行事的花草。他们先在书里查，选中了再到园子里找。三个人一路商量个不停，选花的工夫也就过得飞快。
        - id: ch01-b52
          speaker: caroline
          text: |-
            我们真的不用担心。有这些花草，舅舅一定会答应留下鲁珀特。蕨籽那回灵验了，送给威尔明顿猫的道歉花束也灵验了，这回当然也会。除了送花束，还要在茶里放一些。这样才肯定不会出错。
        - id: ch01-b53
          speaker: narrator
          text: |-
            她说起鲁珀特的口气，简直像在谈一只走失的小猫，或一只没有主人的小狗。
        - id: ch01-b54
          speaker: charlotte
          text: |-
            全是胡闹。再说，舅舅一定会把茶吐掉。换作我就会吐。你可以把舅舅领到茶壶边，可没法逼他喝下去。
        - id: ch01-b55
          speaker: caroline
          text: |-
            就选蒲包花。它的意思是愿意给人金钱上的援助，也可以说愿把财产献给他。养鲁珀特当然要花钱。要是找得到，再拿重瓣翠菊，它表示心意相通。稻草表示赞同，也得拿一些，藏在花束里就行。还要花菱草，因为它的意思是请勿拒绝我。
        - id: ch01-b56
          speaker: narrator
          text: |-
            他们找到了蒲包花和花菱草，可园丁说，翠菊还没开。夏洛特嫌两种花太少，提议他们也在纽扣眼里戴点花，向舅舅表示“我们信任你”。可他们把书翻来翻去，也找不到意思刚好是这句话的花。最接近的是天芥菜，表示“我转向你”，还有表示“危险”的杜鹃花。只是杜鹃花和天芥菜都不适合塞进人的纽扣眼，三个人只好把它们一并添到舅舅的花束里。
        - id: ch01-b57
          speaker: charlotte
          text: |-
            现在进去挤花汁吧。这次可不能用嘴嚼，太恶心了。
        - id: ch01-b58
          speaker: charles
          text: |-
            我看，用剪刀剪碎，再放进茶里。
        - id: ch01-b59
          speaker: narrator
          text: |-
            这个主意立刻得到采纳。后来发生的事，彭福尔德先生或许也有一点责任。卡罗琳拿出剪指甲的小剪刀，把蒲包花、杜鹃花和那个极难拼写的花菱草剪得细碎。剪下来的花瓣和叶片全藏进查尔斯的手帕里。为了这件事，他还特意下楼取来一条干净的。茶盘一送到，女仆刚出去摇铃召唤舅舅，他们便赶紧掀开壶盖，把一大把碎花碎叶塞进茶壶。
        - id: ch01-b60
          speaker: narrator
          text: |-
            魔法花束摆在舅舅的盘子上。舅舅进来时，脸色还是那样苍白，身影还是那样朦胧，不过孩子们觉得，他仿佛有一点不同。他拿起花束仔细端详。那真是一束古怪的花。结实的杜鹃花中间，花菱草和天芥菜都可怜巴巴地垂着头。蒲包花皱成一团，看上去也很不快活。查尔斯一时太热心，足足搬来两大捧稻草。卡罗琳本想把稻草悄悄藏住，可它们偏偏从花束里露出一大片。
        - id: ch01-b61
          speaker: uncle
          text: |-
            这些都是什么？
        - id: ch01-b62
          speaker: caroline
          text: |-
            这是一束象……象什么来着的花。
        - id: ch01-b63
          speaker: uncle
          text: |-
            像样？它可一点也不像样。相投？
        - id: ch01-b64
          speaker: charlotte
          text: |-
            都不是。是您昨天跟彭福尔德先生谈魔法时，说过的那个词。
        - id: ch01-b65
          speaker: uncle
          text: |-
            象征，我明白了。那它象征什么呢？
        - id: ch01-b66
          speakers: [caroline, charlotte, charles]
          ensemble: chorus
          text: |-
            等您喝过茶，我们再告诉您。
        - id: ch01-b67
          speaker: narrator
          text: |-
            舅舅先把花束凑近鼻子闻了闻。也许正因为花的气味抢在前头，他才没有再去闻茶。卡罗琳把茶倒进杯里时，那股稀奇古怪的混合气味几乎装满了整间屋子。三个孩子都不明白，舅舅怎么可能一点也闻不出来。可他只是拿小匙慢慢搅着茶，说起天气来，而且说得一点也不好笑。过了一会儿，他终于把杯子举到唇边。
        - id: ch01-b68
          speaker: narrator
          text: |-
            六只焦急的眼睛紧盯着他。茶水刚一入口，舅舅的动作立刻又快又反常。他把鼻子皱起来。换个时候，那模样一定很好笑。接着他飞快走到窗边，把身子探出去，果然一丝不差地做了夏洛特说他会做的事。
        - id: ch01-b69
          speaker: uncle
          text: |-
            请原谅。方才那个动作出于本能，可很不礼貌。这壶茶恐怕有毒。你们谁也别喝，请摇铃叫人来。我得把事情查清楚。
        - id: ch01-b70
          speaker: narrator
          text: |-
            没有一个人动。
        - id: ch01-b71
          speaker: charles
          text: |-
            我们本来就没打算喝。
        - id: ch01-b72
          speaker: charlotte
          text: |-
            千万别查呀！
          emotion: fearful
        - id: ch01-b73
          speaker: caroline
          text: |-
            是不是特别难喝？我真的太对不起您了。
          emotion: sad
        - id: ch01-b74
          speaker: uncle
          text: |-
            请你们摇铃，好吗？
        - id: ch01-b75
          speaker: narrator
          text: |-
            舅舅的声音冷了下来。这一刻十分可怕，可卡罗琳还是鼓起勇气迎了上去。
        - id: ch01-b76
          speaker: caroline
          text: |-
            不。舅舅，别去问仆人，这不是他们的错。那些东西是我们放进茶壶的。
        - id: ch01-b77
          speaker: uncle
          text: |-
            你们把毒药放进茶壶，拿来给我喝？
          emotion: surprised
        - id: ch01-b78
          speaker: narrator
          text: |-
            舅舅猛地坐了下来。
        - id: ch01-b79
          speaker: caroline
          text: |-
            不，不是毒药！只有蒲包花、花菱草、稻草和杜鹃花，一点毒也没有。我们只是施一道小魔法，好让您答应我们的请求。
        - id: ch01-b80
          speaker: uncle
          text: |-
            难道我做过什么，让你们觉得不用魔法，我就不会答应你们？
          emotion: angry
        - id: ch01-b81
          speaker: caroline
          text: |-
            没有！可我们想把事情做得万无一失。
        - id: ch01-b82
          speaker: narrator
          text: |-
            夏洛特递上那张译文。舅舅读完，指出上面根本没有写蒲包花，也没有写其余那些东西。
        - id: ch01-b83
          speaker: charlotte
          text: |-
            正因为它没写，我们才只能找意思最接近的花。稻草代表赞同，因为我们想让您答应。蒲包花表示愿给您金钱上的援助。杜鹃花说明不答应会有危险。还有那个花什么草，表示请勿拒绝我。
        - id: ch01-b84
          speaker: uncle
          text: |-
            请勿拒绝你们什么？
          emotion: angry
        - id: ch01-b85
          speaker: narrator
          text: |-
            三个孩子你看我，我看你。其中两个一齐叫卡罗琳来说。卡罗琳把手握得紧紧的，深吸一口气，一口不停地说了下去。
        - id: ch01-b86
          speaker: caroline
          text: |-
            有个叫鲁珀特的男孩从学校逃出来因为校长对他很残忍他跑到这里来我们把他藏起来还把警察引到别处去了他是个特别好的男孩他的爸爸也跟我们的爸爸一样在印度他现在就在干草阁楼里还得了很厉害的感冒应该请医生来看他可要是您把他还给那个默德斯通一样的人他一定会死的我受不了我知道往您的茶里放这些东西很傻可我们一点险也不敢冒如果您为了茶生气就惩罚我们吧可是请站在鲁珀特这边哦舅舅我不知道该说什么如果您是我们您会怎么办呢？
        - id: ch01-b87
          speaker: uncle
          text: |-
            好了，好了，别哭。查尔斯，你也不许哭。都去洗洗脸吧。我们叫人换一把壶，重新沏茶，再把这件事谈清楚。
          emotion: calm
        - id: ch01-b88
          speaker: narrator
          text: |-
            舅舅并没有他们预想的那么惊讶。他也没有马上责骂孩子，只让他们先去洗掉脸上的泪痕。卡罗琳站在水盆前擦脸时，越想越觉得事情还有希望。
        - id: ch01-b89
          speaker: caroline
          text: |-
            他还没说“不行”呢。魔法肯定开始起作用了。夏洛特，别哭。现在还没有什么可哭的。
        - id: ch01-b90
          speaker: charlotte
          text: |-
            明明是你先哭的。
        - id: ch01-b91
          speaker: caroline
          text: |-
            我没有。就算哭了，也是因为你们把话全推给我，我都不知道自己在说什么。快下楼，不能让他独自想得太久。
        - id: ch01-b92
          speaker: narrator
          text: |-
            仆人用另一把壶重新沏了茶，可这次谁也没有胃口。舅舅一面听，一面问了许多问题。孩子们只得从头讲起，把鲁珀特怎样逃出学校、怎样来到这里、他们怎样骗开警察，都老老实实说了。舅舅也听完了秘密玫瑰皇家骑士团成立的整个故事。
        - id: ch01-b93
          speaker: charlotte
          text: |-
            您千万别怪威廉。他从一开始就一直叫我们把事情告诉您。
        - id: ch01-b94
          speaker: uncle
          text: |-
            我不会怪他。
        - id: ch01-b95
          speaker: caroline
          text: |-
            我也想告诉您，至少第二天就想了。可那不是我的秘密。现在鲁珀特已经同意我们说出来。
        - id: ch01-b96
          speaker: narrator
          text: |-
            茶喝完了，屋里静了下来。查尔斯舅舅一个一个地看着孩子们。
        - id: ch01-b97
          speaker: uncle
          text: |-
            所以，你们当真以为，把那堆难喝的东西放进茶里，就能让我答应收留那个逃跑的男孩？
        - id: ch01-b98
          speaker: charlotte
          text: |-
            还有蕨籽那回事呢。书上也说，凤仙花药汤能让您答应我们的请求。蒲包花哪一点也不比凤仙花差。
        - id: ch01-b99
          speaker: uncle
          text: |-
            你们真的相信它会灵验？
        - id: ch01-b100
          speaker: caroline
          text: |-
            难道不会吗？舅舅，您不知道，我多不愿意让您喝那种怪东西，而不是平常的好茶。这件事让我受的罪，比您喝那一口受的罪大多了。
          emotion: sad
        - id: ch01-b101
          speaker: narrator
          text: |-
            舅舅轻轻笑了一声。虽然笑得很淡，可他毕竟笑了。
        - id: ch01-b102
          speaker: charlotte
          text: |-
            那您一定会答应我们！要是不想答应，您就不会笑。您看，这些花草真的施了魔法。
          emotion: happy
        - id: ch01-b103
          speaker: uncle
          text: |-
            看来的确有什么东西施了魔法。给我一朵红玫瑰和两个花苞吧，也把我收进秘密玫瑰皇家骑士团。
        - id: ch01-b104
          speaker: narrator
          text: |-
            舅舅的话音刚落，三个孩子便从三面一起扑过去，把他紧紧抱住。他忽然陷进一场猛烈的三重拥抱里。好不容易等孩子们松开手，他先把被揉歪的领带整理好，这才决定给他们一点忠告。
        - id: ch01-b105
          speaker: uncle
          text: |-
            以后千万别再把迷魂药或魔法药水灌进别人肚子里。用在外面一样有效。说不定，单凭这束花就足够施展魔法了。反正确实有东西起了作用。
        - id: ch01-b106
          speaker: uncle
          text: |-
            现在我可以告诉你们，威尔明顿太太早就起了疑心。今天下午，她使了个办法，撞破了秘密。她来告诉我，还想请警察。我听完威廉的解释，决定喝过茶再报警。既然她已经见过鲁珀特，你们也可以让她做一名王家玫瑰骑士。她不会出卖你们。
        - id: ch01-b107
          speaker: narrator
          text: |-
            三个孩子惊讶地互相望着，一时间谁也说不出话。发现秘密的人竟然是威尔明顿太太，而且她还愿意替他们保密？这简直叫人无法相信。
        - id: ch01-b108
          speaker: uncle
          text: |-
            医生马上就来。但愿不是麻疹。
        - id: ch01-b109
          speaker: caroline
          text: |-
            那么，如果我们没对您施魔法，您会把他交给警察吗？
        - id: ch01-b110
          speaker: uncle
          text: |-
            是你们把事情告诉了我，或许是魔法，又或许是什么别的东西。总之，它阻止了我。现在去公园玩吧。只要他的病不会传染，晚些时候你们就能去看他。
        - id: ch01-b111
          speaker: charlotte
          text: |-
            哦，舅舅，再长的巷子，也总有欢喜的一头。我们为了这件事，难受得都快病了。如今终于好了。您真是个亲爱的舅舅。
          emotion: happy
        - id: ch01-b112
          speaker: caroline
          text: |-
            是最亲爱、最亲爱的舅舅。
          emotion: happy
        - id: ch01-b113
          speaker: charles
          text: |-
            要我说，舅舅真是个顶呱呱的好汉。
          emotion: happy
        - id: ch01-b114
          speaker: uncle
          text: |-
            还剩一件事。去拿那朵红玫瑰给我。这样我才知道，你们下次有了真正要紧的秘密，也会让我参与。
        - id: ch01-b115
          speaker: narrator
          text: |-
            孩子们立刻跑去找那朵红玫瑰和两个花苞。舅舅郑重收下了自己的骑士团徽章，又拿起那束为求他答应而采来的古怪花束，把两束花一同带回了书房。
        - id: ch01-b116
          speaker: narrator
          text: |-
            医生看过鲁珀特以后，孩子们获准在睡前见他几分钟。他们原以为还会爬上干草阁楼，没想到鲁珀特已经住进蓝房间。那是一间真正的卧室，墙上挂着壁毯，窗口垂着蓝色丝绸帘子，屋里还有一张带帷架的四柱床。
        - id: ch01-b117
          speaker: rupert
          text: |-
            喝下午茶时，他们就把我抬进来了。你们家的威尔明顿太太真是一流。我不明白，你们怎么会说她讨厌。还有你们的舅舅，他真是个顶呱呱的好汉，对吧？
        - id: ch01-b118
          speaker: narrator
          text: |-
            查尔斯听了，心里十分庆幸。“顶呱呱的好汉”这个词是他自己先想到的，如今鲁珀特也用了同一个说法。这就足以证明，称赞舅舅时，世上再没有比它更正确、更合适的词了。
        - id: ch01-b119
          speaker: rupert
          text: |-
            你们把事情告诉舅舅，我真高兴。原来的办法当然维持不了多久。他还给我在印度的家人发了一封足有一英里长的电报，问能不能让我住在这里，直到学校重新开学。
          emotion: happy
        - id: ch01-b120
          speaker: charlotte
          text: |-
            太了不起了，实在太、太了不起了！我从来不知道，舅舅也能是这个样子。
          emotion: surprised
        - id: ch01-b121
          speaker: rupert
          text: |-
            只要好好对待舅舅，舅舅都挺不错。
        - id: ch01-b122
          speaker: narrator
          text: |-
            鲁珀特说完便咳嗽起来。威尔明顿太太端着柠檬水和蜂蜜走进房间。她说，孩子们已经让病人太累了，而且不管怎么说，现在都到了上床睡觉的时候。于是另外三个孩子只好离开蓝房间。
        - id: ch01-b123
          speaker: charlotte
          text: |-
            只要好好对待舅舅，舅舅都挺不错。可是，如果我们没有完全照原来的办法对待他，你觉得他还会这么好吗？
        - id: ch01-b124
          speaker: narrator
          text: |-
            晚上，姐妹俩回到卧室。夏洛特一边慢慢梳头，一边若有所思地重复鲁珀特的话，又琢磨起白天那道魔法。卡罗琳正背对着她站好，等她帮忙解开裙子后面的衣钩。
        - id: ch01-b125
          speaker: caroline
          text: |-
            不会。夏尔，帮我解开衣钩，好吗？我想，真正起作用的是魔法。
        - id: ch01-b126
          speaker: charlotte
          text: |-
            我也这么想。你别动，不然解不开。眼睛看不见，衣钩解不开。那壶茶大概让舅舅受了神经休克，就像佩基特小姐的姐姐服侍的那位太太家里进了贼一样。
        - id: ch01-b127
          speaker: charlotte
          text: |-
            电击不是能让原本不会走路的人重新走起来吗？这次神经休克，一定把舅舅身上专管答应别人请求的那一部分震醒了，还叫它起来走路。你说是不是？
        - id: ch01-b128
          speaker: caroline
          text: |-
            快点上床吧。何必绕来绕去说个没完？我们照书上写的做了，事情也照书上写的发生了。只要知道正确的咒法，我相信什么事都能用魔法办成。
        - id: ch01-b129
          speaker: caroline
          text: |-
            等我长大，我要做一位研究魔法咒语的女教授，把办事处设在美丽的宫殿里。国王和王后会乘着金马车来问我，该施什么魔法，才能让臣民幸福，不再贫穷，让人人锅里都有一只鸡，还有——
        - id: ch01-b130
          speaker: charlotte
          text: |-
            还说我说个没完呢！快来睡觉，快点吧。
