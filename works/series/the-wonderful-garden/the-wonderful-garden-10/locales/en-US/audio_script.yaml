audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm, observant storytelling with a gently amused touch
        timbre: clear and rounded
        pace: measured
        pitch: medium
    caroline:
      display_name: Caroline
      tts:
        delivery: lively, affectionate, and increasingly careful when being polite
        timbre: bright and clear
        pace: medium
        pitch: medium-high
    charlotte:
      display_name: Charlotte
      tts:
        delivery: eager, curious, and quick with an idea
        timbre: light and energetic
        pace: brisk
        pitch: high
    charles:
      display_name: Charles
      tts:
        delivery: proud, teasing, and boyishly direct
        timbre: youthful and crisp
        pace: medium-fast
        pitch: medium-high
    rupert:
      display_name: Rupert Wix
      tts:
        delivery: blunt and gloomy at first, warming quickly among friends
        timbre: youthful and slightly husky
        pace: medium
        pitch: medium-high
    mrs_wilmington:
      display_name: Mrs. Wilmington
      tts:
        delivery: correct, reserved, and carefully ladylike
        timbre: pale and precise
        pace: measured
        pitch: medium
    mr_penfold:
      display_name: Mr. Penfold
      tts:
        delivery: thoughtful, kindly, and lightly unconventional
        timbre: warm and gentle
        pace: unhurried
        pitch: medium-low
    uncle_charles:
      display_name: Uncle Charles
      tts:
        delivery: reserved and exact, softening into quiet affection
        timbre: low and refined
        pace: measured
        pitch: low
    william:
      display_name: William
      tts:
        delivery: gruff, practical, and loyally protective
        timbre: rough and earthy
        pace: medium
        pitch: low
  chapters:
    - id: ch01
      title: Brewing the Spell
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: The whole business had become awkward, and the awkwardness kept troubling Caroline. Even the pleasure of riding out in the carriage without the grown-ups could not quiet it. The visit itself was delightful. There were peppermints, a fine butterfly collection, and even a chance to try playing the harmonium. Yet beneath all that fun, the same worry kept working away at the back of her mind.
        - id: ch01-b02
          speaker: narrator
          text: Charles and Charlotte were trying the harmonium in a large bare room. It had once been the old rector's drawing room, but now it was used for parish parties. Meanwhile, Mr. Penfold took Caroline into the conservatory to meet his pet newt.
        - id: ch01-b03
          speaker: mr_penfold
          text: Here is a friend of mine in an orange waistcoat.
        - id: ch01-b04
          speaker: narrator
          text: The newt was very nice, orange stomach and all, but he could not drive away Caroline's thoughts. How could they get those tumblers of food to Rupert? She felt thoroughly worried now. Their adventure no longer seemed exciting and manageable. It was becoming much too large and serious. Then Mr. Penfold asked whether she could keep a secret. Behind a large geranium, he showed her a green parrot sitting on a nest. Caroline longed to promise that she would keep his secret, and then tell him the secret that was weighing on her.
        - id: ch01-b05
          speaker: narrator
          text: Instead, after admiring the parrot, she asked him something else.
        - id: ch01-b06
          speaker: caroline
          text: You're a clergyman, so you must know all about what's right and what's wrong. Don't you?
        - id: ch01-b07
          speaker: mr_penfold
          text: I do my best. What is it?
        - id: ch01-b08
          speaker: caroline
          text: Aren't there secrets you ought to keep, even when other people would say you shouldn't? I mean, they would say that if they knew you were keeping one, but of course they don't know.
        - id: ch01-b09
          speaker: narrator
          text: It was clever of Mr. Penfold to understand such a question, but he did.
        - id: ch01-b10
          speaker: mr_penfold
          text: Some things have to be judged for ourselves. Could you give me an example of the kind of thing you mean? Not your real secret, naturally. Just something like it.
        - id: ch01-b11
          speaker: caroline
          text: Of course I wouldn't tell you the real thing.
        - id: ch01-b12
          speaker: narrator
          text: She paused. Then a wonderfully clever temptation came to her. She could tell him the real thing, and he would never imagine it was real.
        - id: ch01-b13
          speaker: caroline
          text: Well, suppose...
        - id: ch01-b14
          speaker: mr_penfold
          text: Yes? Suppose what?
        - id: ch01-b15
          speaker: caroline
          text: You heard about the boy who ran away, the one they were searching for yesterday?
        - id: ch01-b16
          speaker: narrator
          text: Mr. Penfold carefully picked dead leaves from a salmon-colored fuchsia.
        - id: ch01-b17
          speaker: mr_penfold
          text: They haven't found him, have they?
        - id: ch01-b18
          speaker: caroline
          text: No. But imagine he came to you. What would you do? You wouldn't hand him over, would you?
        - id: ch01-b19
          speaker: mr_penfold
          text: I don't know the facts, so I couldn't say.
        - id: ch01-b20
          speaker: caroline
          text: But suppose he were a runaway slave.
        - id: ch01-b21
          speaker: mr_penfold
          text: Then I certainly would not give him up.
        - id: ch01-b22
          speaker: caroline
          text: Well, there you are.
        - id: ch01-b23
          speaker: mr_penfold
          text: But hiding him would only be the beginning. He would need food, clothes, and a place to sleep. Keeping him hidden would be impossible. Someone would be certain to find him.
        - id: ch01-b24
          speaker: caroline
          text: Yes, but what could you do?
        - id: ch01-b25
          speaker: mr_penfold
          text: Let's leave the boy aside, since he was only an example. If you were in some other sort of trouble, you should tell your uncle. Believe me, you can trust him completely. He will decide what is right. Or you could tell me, if you wished. I would do all I could to help.
        - id: ch01-b26
          speaker: caroline
          text: If I ever have a secret that I can tell you, I promise I will. Right now we're a Secret Society. That's why we're all wearing red roses.
        - id: ch01-b27
          speaker: mr_penfold
          text: I wish I could have joined. Perhaps you might let me in another time?
        - id: ch01-b28
          speaker: caroline
          text: I will, if I ever can.
        - id: ch01-b29
          speaker: narrator
          text: Then Charles and Charlotte came to see the newt, and everyone rode home for tea. Uncle Charles and Mr. Penfold talked about things the children did not understand. Perhaps they might have understood if they had listened, but their thoughts were with the tumblers of beef and pudding hidden behind the books. They caught a few words about the golden bough, myths, and folklore. Only when they heard secret rites and symbolic did they pay attention.
        - id: ch01-b30
          speaker: uncle_charles
          text: Come along to my room. I'll show you the passage I mentioned.
        - id: ch01-b31
          speaker: narrator
          text: The two men went away, and of course the three C's hurried straight to the stable yard. The stablemen had gone to their tea, and the servants were having theirs too, so the way was safe. By now the food looked extremely uninviting. A thin, cold layer of hardened fat covered each tumbler. Charles tucked some into the side pockets of his clothes, while the girls carried the rest hidden beneath their pinafores.
        - id: ch01-b32
          speaker: narrator
          text: William greeted them with plain disapproval.
        - id: ch01-b33
          speaker: william
          text: You're late, and I've got to go to the village about a new axle for the light cart. What's that rubbish? Isn't the food I give his lordship good enough for him?
        - id: ch01-b34
          speaker: narrator
          text: He looked sourly at the tumblers they had put on the corn bin. Caroline knew at once that they had made a terrible mistake.
        - id: ch01-b35
          speaker: caroline
          text: Of course your food is good enough. We only thought Rupert might like something different. Please don't be cross, William. You're our beanyfactor, you know.
        - id: ch01-b36
          speaker: william
          text: Beany or not, you're not seeing him tonight. Off you go. I'll make sure he's all right. Leave the grub if you want. Come around eight tomorrow morning, and then we'll see.
        - id: ch01-b37
          speaker: narrator
          text: The children went back to the dining room bitterly disappointed.
        - id: ch01-b38
          speaker: charlotte
          text: I thought rescuing someone would be different. This is all so dull, and it will keep going on like this for weeks.
        - id: ch01-b39
          speaker: caroline
          text: It's the dreadful worrying that I can't bear. Mr. Penfold said secrets were awkward pets to keep. He was right.
        - id: ch01-b40
          speaker: charlotte
          text: Why does everything turn out different just when you thought it would always stay the same?
        - id: ch01-b41
          speaker: narrator
          text: She spoke like a philosopher asking a very deep question.
        - id: ch01-b42
          speaker: caroline
          text: I suppose we're rather young to be rescuing people.
        - id: ch01-b43
          speaker: charles
          text: But rescuing him was the only thing we could do. And now we've started, we can't do anything else, however young we are.
        - id: ch01-b44
          speaker: narrator
          text: For an hour they went over the same arguments again and again. Then Mr. Penfold came in to say goodbye.
        - id: ch01-b45
          speaker: mr_penfold
          text: I've been working on the translation of that book. It is most interesting, and I have a page of the manuscript in my pocket.
        - id: ch01-b46
          speakers: [caroline, charlotte, charles]
          ensemble: chorus
          text: Oh, please let us see it!
        - id: ch01-b47
          speaker: mr_penfold
          text: One page, then. Only one, or I'll be late for choir practice.
        - id: ch01-b48
          speaker: narrator
          text: He put down a typewritten sheet, and the children sprawled across the table to read. It began by explaining how to win a request, with herbs that helped petitions succeed. The names of the herbs were still blank because Mr. Penfold had not translated them yet.
        - id: ch01-b49
          speaker: narrator
          text: The page advised people asking favors from kings and other powerful persons to offer those herbs as bouquets or garlands. It said the spell worked even better if the plants were crushed, their juices squeezed out, and the mixture served in warm wine, spirits, or any convenient drink. That required help from someone in the ruler's household. The herbs would make a ruler look kindly on a request, provided the person asking had gathered them during the moon's first quarter.
        - id: ch01-b50
          speaker: narrator
          text: That was the whole page, and the children admitted they could make no sense of it.
        - id: ch01-b51
          speaker: mr_penfold
          text: It simply tells you what to do when you want to ask someone a favor. I believe one of the herbs was balsam. Now I really must fly. You may keep the page until tomorrow.
        - id: ch01-b52
          speaker: narrator
          text: They were very glad to keep it. As soon as he had gone, Charlotte shared her idea.
        - id: ch01-b53
          speaker: charlotte
          text: We will have to tell Uncle Charles. Let's make him a balsam drink first, and then tell him.
        - id: ch01-b54
          speaker: narrator
          text: The others refused to consider it. By noon the next day, however, they had no choice. William let them climb up to Rupert's loft. Rupert's eyes shone too brightly, his hands were hot, and a small stubborn cough kept coming back almost without pause.
        - id: ch01-b55
          speaker: narrator
          text: Caroline climbed down the ladder to speak to William.
        - id: ch01-b56
          speaker: caroline
          text: We have to tell Uncle Charles. Rupert is ill, I'm certain of it. He needs a doctor.
        - id: ch01-b57
          speaker: william
          text: You're right, miss. That's what I told you from the start.
        - id: ch01-b58
          speaker: narrator
          text: Caroline expected Rupert to fight the idea. She even feared he would threaten to run away to sea rather than let them reveal his secret. Instead, he moved his head restlessly on the straw.
        - id: ch01-b59
          speaker: rupert
          text: Oh, I don't care anymore. Do whatever you like.
        - id: ch01-b60
          speaker: narrator
          text: Luckily, the day was fine. After dinner the children went into the garden to find balsam, but there was none.
        - id: ch01-b61
          speaker: caroline
          text: I'll fetch The Language of Flowers. We can choose whichever herbs seem most likely to make someone do what we want.
        - id: ch01-b62
          speaker: narrator
          text: First they hunted through the book for flowers with the right meanings. Then they hunted through the garden for the flowers themselves. There was a great deal to discuss at every step, so the time slipped away surprisingly fast.
        - id: ch01-b63
          speaker: caroline
          text: I truly don't think we need to worry. The herbs are sure to work, and Uncle Charles will let us keep Rupert. The fern-seed worked, and so did our sorry bouquet for Mrs. Wilmington. This will work too. We'll put some herbs in his tea and give him the bouquet. Then we can be absolutely sure.
        - id: ch01-b64
          speaker: narrator
          text: She spoke as though Rupert were a stray kitten or a puppy with no owner.
        - id: ch01-b65
          speaker: charlotte
          text: It's all nonsense. Besides, he'll spit the tea out. I know I would. You can lead an uncle to the teapot, but you can't make him drink.
        - id: ch01-b66
          speaker: caroline
          text: We'll use calceolaria. It means, “I offer you money,” or even, “I offer you my fortune,” and keeping Rupert will cost something. If we can find double China aster, that means, “I share your feelings.” We'll add straw because it means agreement, though it needn't show. And eschscholtzia means, “Do not refuse me.”
        - id: ch01-b67
          speaker: narrator
          text: They found calceolarias and eschscholtzias, but the gardener said the asters had not flowered yet.
        - id: ch01-b68
          speaker: charlotte
          text: That's only two flowers. Couldn't we wear something in our buttonholes that means, “We trust you”?
        - id: ch01-b69
          speaker: narrator
          text: The book offered nothing with that exact meaning. The closest choices were heliotrope for “I turn to you” and rhododendron for “danger.” Neither plant fitted a human buttonhole, so both went into Uncle Charles's bouquet instead.
        - id: ch01-b70
          speaker: charlotte
          text: Now let's go inside and squeeze out the juice. We can't chew these plants. That would be disgusting.
        - id: ch01-b71
          speaker: charles
          text: I say scissors and tea.
        - id: ch01-b72
          speaker: narrator
          text: It seemed a brilliant suggestion, and they acted on it. Perhaps Mr. Penfold deserved a little blame for what followed. With Caroline's nail scissors, they chopped the calceolaria, rhododendron, and eschscholtzia into tiny pieces. Then they hid everything in a clean handkerchief Charles had fetched for the purpose.
        - id: ch01-b73
          speaker: narrator
          text: The tea tray arrived. As soon as the maid went to ring the bell that summoned uncles, the children lifted the teapot lid and pushed in a large handful of chopped leaves and petals. Then they placed the magic bouquet on Uncle Charles's plate.
        - id: ch01-b74
          speaker: narrator
          text: Uncle Charles came in looking as pale and shadowy as ever, though the children thought there was something different about him. He picked up the bouquet. It was an odd arrangement. The eschscholtzias and heliotrope drooped between the stiff rhododendrons. The calceolarias looked shriveled and miserable. Worst of all, Charles had brought two great handfuls of straw, and far more of it showed than Caroline had intended.
        - id: ch01-b75
          speaker: uncle_charles
          text: What in the world is all this?
        - id: ch01-b76
          speaker: caroline
          text: It's a sym... a sym-something bouquet.
        - id: ch01-b77
          speaker: uncle_charles
          text: Simple? It is certainly not that. Do you mean sympathetic?
        - id: ch01-b78
          speaker: charlotte
          text: No, the word Mr. Penfold used yesterday when he was talking to you about magic.
        - id: ch01-b79
          speaker: uncle_charles
          text: Symbolic. I understand. What does it symbolize?
        - id: ch01-b80
          speaker: narrator
          text: He was kind, but he did not smile.
        - id: ch01-b81
          speakers: [caroline, charlotte, charles]
          ensemble: chorus
          text: We'll tell you after you've had your tea.
        - id: ch01-b82
          speaker: narrator
          text: Uncle Charles smelled the bouquet. Perhaps that was why he did not smell the tea. Caroline could hardly understand it, because the strange mixed scent seemed to fill the room as she poured. He stirred his cup and talked rather dully about the weather. At last he raised the tea to his lips.
        - id: ch01-b83
          speaker: narrator
          text: Six anxious eyes followed every movement of the cup. The moment the tea entered his mouth, Uncle Charles began to move with astonishing speed. He twisted up his nose in a way that would have made all three children laugh at any less serious moment. Then he hurried to the window, leaned far out, and did exactly what Charlotte had predicted he would do.
        - id: ch01-b84
          speaker: uncle_charles
          text: Please excuse that natural but impolite action. I believe this tea may be poisoned. Do not drink it. Ring the bell, please. I must find out what happened.
        - id: ch01-b85
          speaker: narrator
          text: No one moved.
        - id: ch01-b86
          speaker: charles
          text: We weren't going to drink any.
        - id: ch01-b87
          speaker: charlotte
          text: Oh, please don't investigate!
          emotion: fearful
        - id: ch01-b88
          speaker: caroline
          text: Was it terribly awful? I am so sorry.
        - id: ch01-b89
          speaker: uncle_charles
          text: Will you kindly ring the bell?
        - id: ch01-b90
          speaker: narrator
          text: His voice was cold. It was a dreadful moment, but Caroline faced it bravely.
        - id: ch01-b91
          speaker: caroline
          text: No. Please don't question the servants, Uncle. It wasn't their fault. We put those things in the teapot.
        - id: ch01-b92
          speaker: narrator
          text: Uncle Charles sat down very suddenly.
        - id: ch01-b93
          speaker: uncle_charles
          text: You put poison in my teapot? For me?
          emotion: surprised
        - id: ch01-b94
          speaker: caroline
          text: No, no! It wasn't poison, dear Uncle. It was only calceolaria, eschscholtzia, straw, and rhododendron. We made a little magic spell so you would say yes to what we want.
        - id: ch01-b95
          speaker: uncle_charles
          text: Have I ever made you think I would refuse your request unless you used a spell?
        - id: ch01-b96
          speaker: caroline
          text: Oh no. We only wanted to be certain.
        - id: ch01-b97
          speaker: narrator
          text: Charlotte handed him Mr. Penfold's translation, and Uncle Charles read it.
        - id: ch01-b98
          speaker: uncle_charles
          text: This says nothing about calceolaria or any of the other plants.
        - id: ch01-b99
          speaker: caroline
          text: No, because the names were missing. We had to choose the nearest things. Straw means agreement, and we need you to agree. Calceolaria means, “I offer you money.” Rhododendron shows it would be dangerous not to agree. And the es-what's-its-name says, “Do not refuse me.”
        - id: ch01-b100
          speaker: uncle_charles
          text: Do not refuse you what?
          emotion: angry
        - id: ch01-b101
          speaker: narrator
          text: The three children looked at one another.
        - id: ch01-b102
          speakers: [charlotte, charles]
          ensemble: duo
          text: You tell him, Caro.
        - id: ch01-b103
          speaker: narrator
          text: Caroline locked her hands together, drew one long breath, and rushed through the whole story.
        - id: ch01-b104
          speaker: caroline
          text: A boy called Rupert ran away from school because his master was cruel, and he came here, and we hid him, and sent the police the wrong way. He's such a nice boy, and his father is in India like ours. Now he's in the straw loft with a dreadful cold, and he needs a doctor. If you send him back to that Murdstone man, I know he'll die, and I can't bear it. I'm very, very sorry we put things in your tea. It was silly, but we couldn't take any chances. If you're angry about the tea, punish us, but please stand by Rupert. Oh, Uncle, I don't know what else to say. What would you have done if you had been us?
          emotion: fearful
        - id: ch01-b105
          speaker: uncle_charles
          text: There, there. Don't cry. And Charles, you mustn't start crying too. Go and wash your faces. We'll have fresh tea in another pot, and then we'll talk about it.
          emotion: calm
        - id: ch01-b106
          speaker: narrator
          text: Charles had begun to sniff. The children went away to wash.
        - id: ch01-b107
          speaker: caroline
          text: I tell you, this is hopeful. He hasn't said no. I believe the spell is working. Stop sniveling, Charlotte. There's nothing to cry about yet.
        - id: ch01-b108
          speaker: charlotte
          text: You started crying.
        - id: ch01-b109
          speaker: caroline
          text: I did not. And even if I did, you both made me do all the telling. I hardly knew what I was saying. Come downstairs. We mustn't leave him alone to think for too long.
        - id: ch01-b110
          speaker: narrator
          text: Over the fresh tea, though no one felt much like eating, Uncle Charles asked question after question. He heard the full tale of Rupert's escape and the Royal Order of the Secret Rose.
        - id: ch01-b111
          speaker: charlotte
          text: You won't blame William, will you? He has told us to come to you ever since this began.
        - id: ch01-b112
          speaker: uncle_charles
          text: I shall not blame William.
        - id: ch01-b113
          speaker: caroline
          text: I did want to tell you. At least, I wanted to the next day. But it wasn't my secret to tell, and Rupert has agreed now.
        - id: ch01-b114
          speaker: narrator
          text: Tea ended, and silence settled over the room. Uncle Charles looked slowly from one child to another.
        - id: ch01-b115
          speaker: uncle_charles
          text: Did you honestly believe that putting that horrible mess in my tea would make me agree to keep your runaway boy?
        - id: ch01-b116
          speaker: charlotte
          text: We knew the fern-seed worked. And the book said a drink made from balsam would win our request. Calceolaria is every bit as good as balsam.
        - id: ch01-b117
          speaker: uncle_charles
          text: You truly thought it would work?
        - id: ch01-b118
          speaker: caroline
          text: Won't it work? Oh, Uncle, if you knew how much I hated giving you that nasty drink instead of your good tea! It hurt me far more than it hurt you.
          emotion: sad
        - id: ch01-b119
          speaker: narrator
          text: Uncle Charles gave a faint laugh, but it was a laugh all the same.
        - id: ch01-b120
          speaker: charlotte
          text: Then you will grant our request! You couldn't laugh if you meant to refuse. You see? The herbs really did make the magic happen.
          emotion: happy
        - id: ch01-b121
          speaker: uncle_charles
          text: Something appears to have done it. You had better give me one red rose and two buds, and make me a member of the Royal Order of the Secret Rose.
        - id: ch01-b122
          speaker: narrator
          text: At once, all three children flung their arms around him.
        - id: ch01-b123
          speaker: narrator
          text: When the violent threefold embrace was over, Uncle Charles straightened his necktie.
        - id: ch01-b124
          speaker: uncle_charles
          text: Let me give you one piece of advice. Never make people swallow your magic potions. Putting them on the outside works just as well. In fact, the bouquet alone may have been enough. Something certainly worked. Mrs. Wilmington had already become suspicious. This afternoon she used a trick to discover your secret. She told me and wanted to call the police. I listened to William too, and decided to wait until after tea before sending for them. Since Mrs. Wilmington has now seen Rupert, you may as well make her a Royal Rose. She won't betray you.
        - id: ch01-b125
          speaker: narrator
          text: The children stared at one another. Mrs. Wilmington helping them seemed impossible.
        - id: ch01-b126
          speaker: uncle_charles
          text: The doctor is on his way. I only hope Rupert hasn't got measles.
        - id: ch01-b127
          speaker: caroline
          text: If we hadn't put the spell on you, would you have handed him over to the police?
        - id: ch01-b128
          speaker: uncle_charles
          text: Your confession, or the spell, or something else has prevented that. Now go and play in the park. If his illness is not infectious, you may see your young friend later.
        - id: ch01-b129
          speaker: charlotte
          text: Oh, Uncle, even the longest lane has to rejoice at last. We have felt so sick with worry, and now everything is all right. You really are a dear.
          emotion: happy
        - id: ch01-b130
          speaker: caroline
          text: The very dearest dear.
          emotion: happy
        - id: ch01-b131
          speaker: charles
          text: I call him a brick.
        - id: ch01-b132
          speaker: narrator
          text: Charles said it like a man who knew the world.
        - id: ch01-b133
          speaker: uncle_charles
          text: There is one more thing. Fetch me that red rose. Then I'll know you mean to let me share the next truly important secret.
        - id: ch01-b134
          speaker: narrator
          text: They ran to find it. Uncle Charles took the rose and the petition bouquet away to his study.
        - id: ch01-b135
          speaker: narrator
          text: After the doctor's visit, the children were allowed to see Rupert for a few minutes before bed. He was no longer in the straw loft. Instead, he lay in the blue room, with its tapestry-covered walls, blue silk window curtains, and four-poster bed.
        - id: ch01-b136
          speaker: rupert
          text: They carried me in at teatime. That Mrs. Wilmington of yours is first-rate. Why did you ever call her a rotter? And your uncle really is a brick, isn't he?
        - id: ch01-b137
          speaker: narrator
          text: Charles was pleased that he had chosen that word first. Rupert's use of it proved it was exactly the right thing to say.
        - id: ch01-b138
          speaker: rupert
          text: I'm awfully glad you told him. We couldn't have kept going as we were. He has sent a telegram a mile long to my people in India, asking if I may stay here until school begins again.
          emotion: happy
        - id: ch01-b139
          speaker: charlotte
          text: How splendid! How wonderfully splendid! I never knew uncles could be like that.
          emotion: happy
        - id: ch01-b140
          speaker: rupert
          text: Uncles are all right if you handle them properly.
        - id: ch01-b141
          speaker: narrator
          text: Rupert began to cough. Mrs. Wilmington came in carrying lemonade and honey. She said the children were tiring him and that it was bedtime anyway.
        - id: ch01-b142
          speaker: narrator
          text: Later, as Charlotte brushed her hair, she thought dreamily about Rupert's words.
        - id: ch01-b143
          speaker: charlotte
          text: Uncles are all right if you handle them properly. Do you think ours would still have been all right if we hadn't handled him exactly as we did?
        - id: ch01-b144
          speaker: caroline
          text: No, I don't. Unhook my dress, please, Char. I think it was the spell.
        - id: ch01-b145
          speaker: charlotte
          text: So do I. Stand still, or I can't undo the hooks. What the eye doesn't see, the hook doesn't come out of. I expect the tea gave Uncle Charles a nervous shock, like the one Miss Peckitt's sister's mistress had when burglars broke into her house. A nervous shock must be like the electric shocks that make people walk when they couldn't before. Perhaps it woke up the part of Uncle that grants favors and made it walk. Don't you think so?
        - id: ch01-b146
          speaker: caroline
          text: Hurry up and get into bed. Why talk all around it? We did what the book said, and what it promised came true. If you knew the right spells, I believe you could arrange anything. When I grow up, I'll be a professoress of magic spells. My office will be in a beautiful palace. Kings and queens will arrive in golden carriages and ask which spells will make their people happy and keep them from being poor, with a chicken in every pot, and—
        - id: ch01-b147
          speaker: charlotte
          text: And you say I talk too much! Come along to bed. Please.
