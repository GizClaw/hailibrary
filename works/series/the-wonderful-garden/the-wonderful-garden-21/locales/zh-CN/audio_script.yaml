audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 温暖机敏，带着克制的幽默讲述
        timbre: 清澈柔和
        pace: 从容而富有变化
        pitch: 中音
    caroline:
      display_name: 卡罗琳
      tts:
        delivery: 大方热情，努力摆出长姐的懂事
        timbre: 明亮清脆
        pace: 自然轻快
        pitch: 中高音
    charlotte:
      display_name: 夏洛特
      tts:
        delivery: 活泼直率，想到什么便说什么
        timbre: 轻盈清亮
        pace: 偏快
        pitch: 高音
    charles:
      display_name: 查尔斯
      tts:
        delivery: 淘气认真，笑话总说得一本正经
        timbre: 清亮的男孩声
        pace: 轻快
        pitch: 中高音
    rupert:
      display_name: 鲁珀特
      tts:
        delivery: 直爽开朗，病中说话虚弱而迷糊
        timbre: 清亮的少年声
        pace: 自然，发烧时忽快忽慢
        pitch: 中高音
    uncle_charles:
      display_name: 查尔斯舅舅
      tts:
        delivery: 温和飘忽，偶尔流露出幽微的兴味
        timbre: 轻柔低沉
        pace: 舒缓
        pitch: 中低音
  chapters:
    - id: ch01
      title: 等待默德斯通的消息
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: |-
            三个孩子慢慢走回宅子，一路猜着鲁珀特和默德斯通究竟去了哪里。夏洛特觉得，咒语一定让默德斯通变好了。他本来是来告诉鲁珀特这个好消息，恰好在路上遇见了他。可这一猜想还有个地方说不通。若只是传个话，两个人为什么会一起回宅子呢？
        - id: ch01-b02
          speaker: charles
          text: |-
            可他在路上说完，就该回家了呀。他为什么跟鲁珀特一起回来？也许他要亲口告诉我们，自己已经变好了。那可太棒了！
        - id: ch01-b03
          speaker: caroline
          text: |-
            他大概先去告诉舅舅。坏王子摆脱了坏魔法师的咒语，变成好人以后，总要立刻让所有人知道。
        - id: ch01-b04
          speaker: charles
          text: |-
            那他也会来告诉我们。我们也算所有人，不比大人少一份。
        - id: ch01-b05
          speaker: narrator
          text: |-
            宅子里不见那两个人。三个孩子十分识趣地没有去找，也没有找人打听。这份懂分寸，主要还是卡罗琳的功劳。他们把自己关进饭厅耐心等着。那个从前人人讨厌的默德斯通，总不能来一趟又走掉，事情就这样结束。可等待实在无聊。任凭孩子们多么为自己的体贴得意，心里还是又好奇又着急，连假装看书都办不到。终于，门厅里传来了脚步声和谈话声，他们别提多高兴了。
        - id: ch01-b06
          speaker: caroline
          text: |-
            他们来了！这回准是来告诉我们结果的。既然默德斯通已经后悔，也认了错，咱们一定要对他特别好，谁也不许让他难堪。
        - id: ch01-b07
          speaker: charles
          text: |-
            当然。你说，我能不能请他把自己的蜡像送给我，留个纪念？
        - id: ch01-b08
          speaker: caroline
          text: |-
            当然不能。求你别说话了，快听！
        - id: ch01-b09
          speaker: narrator
          text: |-
            其实不用特意偷听。脚步声没有进饭厅，而是径直走向宅子侧面的前门。谁也没故意竖起耳朵，可窗户开着，鲁珀特和默德斯通的临别话还是清清楚楚地传了进来。
        - id: ch01-b10
          speaker: rupert
          text: |-
            我现在就去办。这是最后一件了。谢谢您，先生。再见！
        - id: ch01-b11
          speaker: narrator
          text: |-
            靴子踏着砂石渐渐远去，前门砰地关上。下一刻，鲁珀特走进饭厅。他脸白得吓人，两眼却亮得出奇。进门以后，他立刻关好门，靠在门板上，像是对着空空的喉咙咽了两下。两只手攥得死紧，眼睛只管望着正前方，连三个孩子的脸也不敢看。
        - id: ch01-b12
          speaker: rupert
          text: |-
            我有件事必须告诉你们。听完以后，你们大概再也不肯理我了。我说了麦克弗森先生的谎话，是一个卑鄙透顶的谎。他根本没有像我说的那样打我。我本来没想那么说，可话忽然出了口，后来再也收不回来。这些日子，我心里难受得要命。事情就是这样。
          emotion: sad
        - id: ch01-b13
          speaker: charles
          text: |-
            不管是什么事，我们都会理你。可你怎么可能做出这种事？
          emotion: surprised
        - id: ch01-b14
          speaker: narrator
          text: |-
            夏洛特一句话也说不出来。卡罗琳也只想得到一句安慰。
        - id: ch01-b15
          speaker: caroline
          text: |-
            可你现在已经承认了呀。
        - id: ch01-b16
          speaker: rupert
          text: |-
            走以前，我想让你们知道真相。出了这种事，你们的舅舅不会再留我，当然会把我送回麦克弗森先生那里。他还没亲口这样说，只叫我送客回来以后去找他。可我怕他立刻赶我走，所以必须先来告诉你们。
          emotion: sad
    - id: ch02
      title: 鲁珀特说出真相
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: |-
            卡罗琳看出，鲁珀特还有许多话非说不可。他急切得很，却受不了三个人一起围着。若屋里只留下卡罗琳或夏洛特，他大概就说得出来。于是，卡罗琳做了一件颇有勇气的事。她硬把查尔斯拉到门外，让鲁珀特单独跟夏洛特谈。
        - id: ch02-b02
          speaker: charles
          text: |-
            鲁珀特竟然成了一个说谎的人。这不是太可怕了吗？
        - id: ch02-b03
          speaker: caroline
          text: |-
            别这样说！这些日子，他心里一定一直很难受。现在他已经后悔，也认了错。我们得尽量忘掉这件事。来吧，咱们聊点别的，别再议论他了。
        - id: ch02-b04
          speaker: narrator
          text: |-
            然而，他们根本聊不了别的。饭厅里，鲁珀特看着两个人从窗外走过，沿着林荫道渐渐走远。屋里只剩下夏洛特，他终于能把压在心里的话一点点说出来。
        - id: ch02-b05
          speaker: rupert
          text: |-
            我早就想告诉你。就是你说我脾气不好的那一天，可我怎么也开不了口。
        - id: ch02-b06
          speaker: charlotte
          text: |-
            亲爱的老鲁珀特，你总算把它摆脱了！原来那就是黑狗。我早知道你心里藏着事。你愿意就告诉我吧，他们已经沿着林荫道走远了。
        - id: ch02-b07
          speaker: narrator
          text: |-
            鲁珀特走到桌边，半坐在桌沿上，把脸转开，手里不停拧着桌布。
        - id: ch02-b08
          speaker: rupert
          text: |-
            我一直以为，自己会成为一个格外正直的人。爸爸从前常跟我讲那些道理，我也从没做过这种事。可那天我烦透了跟麦克弗森先生走。他把我当成小娃娃，还给我吃面包牛奶。现在他说，他只是想对我好，还以为我的年纪比实际小。除了挨打，别的事都是真的。他也确实说过，对付闹脾气的男孩自有办法。后来我决定逃走，翻门时伤了手，气得要命。那时，我觉得只有逃走这一条路。
        - id: ch02-b09
          speaker: rupert
          text: |-
            等我向你们解释时，又怎么也找不到合适的话，说不清那一切有多可恨。我怕你们听完以后，会觉得我平白无故就逃跑。手又疼得厉害，我还以为，你们认定一定发生过更严重的事。就在那个时候，我说出了麦克弗森先生打我的话。真卑鄙！
          emotion: disgusted
        - id: ch02-b10
          speaker: charlotte
          text: |-
            我真希望你当时没有那么说。
          emotion: sad
        - id: ch02-b11
          speaker: rupert
          text: |-
            起初，我竟觉得这没什么要紧。为什么会这样，我自己也想不通。我以为他第二天本来就想揍我，反正你们也不认识他。后来我病了，什么都不在乎。可病一好，这件事就越来越糟，越来越难受，像一把开瓶钻不停往身体里拧，一下比一下更深。
        - id: ch02-b12
          speaker: charlotte
          text: |-
            那你为什么不早些承认？
        - id: ch02-b13
          speaker: rupert
          text: |-
            我做不到。要不是因为这个，我永远也不会说。
        - id: ch02-b14
          speaker: narrator
          text: |-
            他费力地从口袋里掏出一条手帕。手帕里包着东西。他慢慢把它展开，伸到夏洛特面前。手心里托着的正是那个蜡人，可鲁珀特的脸仍旧转向一旁。
        - id: ch02-b15
          speaker: rupert
          text: |-
            昨天我穿过树林回来，看见你们在试那个用针的讨厌咒语。我知道，一定是因为我说了那个卑鄙的谎。
        - id: ch02-b16
          speaker: charlotte
          text: |-
            才不是呢！我们没有往蜡人身上扎针，一直都在对它做好事。我们想让默德斯通后悔从前那么可恶，再跟你做朋友。鲁珀特，咒语真的灵验了。我们施咒就是为了让他跟你和好。你看，他真的跟你和好了！
          emotion: surprised
        - id: ch02-b17
          speaker: rupert
          text: |-
            不管怎么说，麦克弗森先生待我很厚道。昨晚，我从彭福尔德先生家回来，路过树林时发现了蜡人。我把它拿回房，藏进放衣领的抽屉最里面。今早，我又带着它去见彭福尔德先生。有它在，承认错误好像容易了一点。彭福尔德先生也很厚道。他陪我到汤布里奇，让我亲口把真相告诉麦克弗森先生。后来，他说了许多话。他早就知道我心里压着一件事，想要说出来，还跟我讲了悔过的道理。我真喜欢他。
    - id: ch03
      title: 最难受的一刻
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: |-
            夏洛特不知道还能说什么。若是什么都不说，又显得太无情。可除了那句最简单的话，她实在想不出别的安慰。于是，她只好告诉鲁珀特，自己很庆幸大家做出了那个蜡人。
        - id: ch03-b02
          speaker: rupert
          text: |-
            不管接下来会是什么，也不管会受什么罚，我都认了。麦克弗森先生其实人不错，可离开这里一定很难受。只是我想，出了这种事，你们大概都会很高兴我走吧。
          emotion: sad
        - id: ch03-b03
          speaker: charlotte
          text: |-
            鲁珀特！我怎么会高兴？
          emotion: surprised
        - id: ch03-b04
          speaker: rupert
          text: |-
            好吧，我知道你不会真的高兴。请你把这些话也告诉他们。告诉他们，我知道自己一直像个脾气暴躁的混蛋。那是因为这件事藏在心里，像那只可恶的斯巴达狐狸，一直在里面咬我。我好像无时无刻不坐着等牙医。现在呢，又像一口气拔光了所有牙，而且接连拔了二十遍。
        - id: ch03-b05
          speaker: narrator
          text: |-
            鲁珀特说完以后想笑一笑，好让事情显得不那么难受，可那笑一点也没成功。夏洛特也想陪着他笑，眼泪却一下涌了出来。她靠到鲁珀特身边，把泪湿的脸蹭在他的外套袖子上。
        - id: ch03-b06
          speaker: rupert
          text: |-
            别哭了。你这样，我心里更难受。现在我得回你舅舅那里，等着被赶出去。我活该。
          emotion: sad
        - id: ch03-b07
          speaker: charlotte
          text: |-
            你已经后悔，也已经承认，以后绝不会再做这种事。你先等一小会儿。走以前，我有一样东西要送给你。留在这里等我，好不好？
        - id: ch03-b08
          speaker: rupert
          text: |-
            那就别去太久。
        - id: ch03-b09
          speaker: narrator
          text: |-
            夏洛特擦干眼泪，回到自己房里，取来最心爱的《苏格兰骑士歌谣》。她在书上写下鲁珀特的名字，随后没有回饭厅，而是径直走进舅舅的房间。查尔斯舅舅难得既没读书，也没写字。他坐在桌边，手指不停敲着桌面，脸上又难过，又生气。
        - id: ch03-b10
          speaker: uncle_charles
          text: |-
            鲁珀特在哪里？
        - id: ch03-b11
          speaker: charlotte
          text: |-
            他不知道我来找你。我请他等着，说要拿一样东西送给他。舅舅，你不会把他送走，对不对？
        - id: ch03-b12
          speaker: uncle_charles
          text: |-
            我必须把鲁珀特送回去，才对得起麦克弗森先生。这能表明，我们对加在他身上的诬蔑深感歉意。鲁珀特逃走时，我帮了他，还把他带离麦克弗森先生的照管，无意中助长了那番诬蔑。既然我也做了这些事，就更该表明自己的歉意。如果回去对鲁珀特是一种惩罚，那也是他应得的。
        - id: ch03-b13
          speaker: charlotte
          text: |-
            可鲁珀特早就在受罚了，而且一直都在受罚。别人都不知道，只有我知道。他难受透了，只是无论如何也说不出口。现在，他已经正正当当地告诉了每一个人，一个也没有瞒着。亲爱的舅舅，求你别送他走，我太难过了！
          emotion: sad
        - id: ch03-b14
          speaker: narrator
          text: |-
            舅舅没有立刻跟她争辩，只叫她到自己身边。夏洛特靠过去以后才发现，他那只裹在黑外套里的瘦肩膀，很适合让一个伤心的孩子靠着，好好哭上一场。
        - id: ch03-b15
          speaker: uncle_charles
          text: |-
            我愿意相信，他受的惩罚已经够了。可是你要明白，现在只有把他送回去，才对麦克弗森先生公平。
        - id: ch03-b16
          speaker: charlotte
          text: |-
            你不知道他有多难受。这些日子，他脾气坏得像头熊，简直叫人受不了。
        - id: ch03-b17
          speaker: uncle_charles
          text: |-
            这个我倒不知道。不过，那样对麦克弗森先生还是不公平。鲁珀特必须回去。
    - id: ch04
      title: 夏洛特的聪明主意
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: |-
            舅舅已经说定鲁珀特必须走。就在这时，夏洛特忽然想到一个聪明主意。那个念头在心里一亮，她的眼泪也跟着干了，立刻抬起头来。
        - id: ch04-b02
          speaker: charlotte
          text: |-
            舅舅，我真的想到办法了！你不一定非把鲁珀特送回去。只要请麦克弗森先生来这里做客，不也一样能补偿他吗？这样也能让大家看出，你完全信任他。
        - id: ch04-b03
          speaker: uncle_charles
          text: |-
            我办不到。只要有成年客人来住，我的工作就会全乱套，最后彻底毁掉。你们找到的那些书，已经改变了我的整套研究计划。不过，仔细想来，为这件事，我的确欠你们一点回报。
        - id: ch04-b04
          speaker: charlotte
          text: |-
            那就拿鲁珀特还给我们，算作你的回报。你只要忍受麦克弗森先生一个周末，所有人都会知道你们是朋友，也就不会再相信那番诬蔑。舅舅，可怜的鲁珀特真的后悔了，他也已经承认了呀。
        - id: ch04-b05
          speaker: narrator
          text: |-
            舅舅没有马上回答，反而问起刚才听见的蜡像。夏洛特只好把孩子们做蜡人、铺玫瑰床、烧掉坏品性，又盼着默德斯通变好的事情从头到尾说了一遍。他一边听，一边点头，还不时说“是，是”和“完全正确”。
        - id: ch04-b06
          speaker: uncle_charles
          text: |-
            好吧，你们如愿以偿了。你们让他们和解了。看来咒语确实灵验。
        - id: ch04-b07
          speaker: charlotte
          text: |-
            每一道咒语都灵验了，我们试过的，一道也没有失灵。舅舅，你的咒语呢？
        - id: ch04-b08
          speaker: uncle_charles
          text: |-
            我但愿它们也灵验了。夏洛特，我真希望能照你的心愿办，可别用咒语逼我，因为这次我实在不能让步。鲁珀特明天必须回去，至少住两个星期。之后，他可以回来，一直住到假期结束。这样可以吗？我会告诉他，这不是惩罚，只是他做下那件事的后果。如果没有说谎，他也不必回去。
        - id: ch04-b09
          speaker: charlotte
          text: |-
            如果鲁珀特一开始没有说那个谎，你会把他留下吗？
        - id: ch04-b10
          speaker: uncle_charles
          text: |-
            他在那里过得不开心。光这一点就够了，再加上你们的咒语。
    - id: ch05
      title: 永不改变的友谊
      blocks:
        - id: ch05-b01
          speaker: rupert
          text: |-
            没事了。你舅舅原谅了我，我以后还能回来。他也解释了我为什么必须走，我现在已经明白了。这段日子，我能好好忍过去。我宁愿受过这段苦，再清清白白地重新开始，也宁愿为自己的错付出一点代价。可我还得写信告诉爸爸，那才是最难受的事。
        - id: ch05-b02
          speaker: charlotte
          text: |-
            等你回来，我们就把这一切当成一场噩梦。
        - id: ch05-b03
          speaker: narrator
          text: |-
            第二天，鲁珀特走了。三个名字都以C开头的孩子一同到车站送他。每个人的纽扣眼里都别着一小枝侧柏，因为侧柏表示“永不改变的友谊”。直到火车快开时，夏洛特才把自己心爱的《苏格兰骑士歌谣》塞进鲁珀特手里。
        - id: ch05-b04
          speaker: charles
          text: |-
            不过，鲁珀特撒了那个谎，难道不是太可怕了吗？
        - id: ch05-b05
          speaker: narrator
          text: |-
            他们才离开站台，查尔斯就又提起这件事。这里明明是公共场所，他的一个姐姐还是当场抓住他摇晃起来，另一个更给了他最后通牒。查尔斯终于听懂了警告，却又觉得自己并不是讨厌鲁珀特，只是还有一番道理非讲不可。
        - id: ch05-b06
          speaker: charlotte
          text: |-
            听着，查尔斯。你以后再提一个字，我们就再也不理你。明白了吗？
        - id: ch05-b07
          speaker: charles
          text: |-
            我又不是说我不喜欢他。可你们也不希望我觉得，说谎没有错吧？
        - id: ch05-b08
          speaker: narrator
          text: |-
            这下，两个姑娘也明白了。他们都不愿因为原谅鲁珀特，就假装说谎本身没有错。可卡罗琳仍不打算让查尔斯继续说下去。
        - id: ch05-b09
          speaker: caroline
          text: |-
            你用不着管我们究竟怎么想。现在只管闭嘴吧，查尔斯。我们是二对一。
