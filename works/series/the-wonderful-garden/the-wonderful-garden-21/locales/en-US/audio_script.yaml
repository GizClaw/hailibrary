audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm, observant storytelling with a gently amused touch
        timbre: clear and rounded
        pace: measured
        pitch: medium
    caroline:
      display_name: Caroline
      tts:
        delivery: lively, affectionate, and increasingly careful when being polite
        timbre: bright and clear
        pace: medium
        pitch: medium-high
    charlotte:
      display_name: Charlotte
      tts:
        delivery: eager, curious, and quick with an idea
        timbre: light and energetic
        pace: brisk
        pitch: high
    charles:
      display_name: Charles
      tts:
        delivery: proud, teasing, and boyishly direct
        timbre: youthful and crisp
        pace: medium-fast
        pitch: medium-high
    rupert:
      display_name: Rupert Wix
      tts:
        delivery: blunt and gloomy at first, warming quickly among friends
        timbre: youthful and slightly husky
        pace: medium
        pitch: medium-high
    uncle_charles:
      display_name: Uncle Charles
      tts:
        delivery: scholarly, restrained, and dryly patient
        timbre: mellow and thoughtful
        pace: measured
        pitch: medium-low
    one_sister:
      display_name: One of the Sisters
      tts:
        delivery: firm, protective, and sharply direct
        timbre: youthful and clear
        pace: brisk
        pitch: high
  chapters:
    - id: ch01
      title: Waiting for Rupert
      blocks:
        - id: ch01-b01
          speaker: charlotte
          text: I wonder what's happened. Perhaps the Murdstone man was coming to tell Rupert that the spell had made him nice, and they met on the road.
        - id: ch01-b02
          speaker: charles
          text: But he could have told Rupert there and gone home. Why come back with him? Maybe he's going to tell us he's changed too. Wouldn't that be ripping?
        - id: ch01-b03
          speaker: caroline
          text: I expect he's telling Uncle. When a wicked magician breaks the spell and a wicked prince turns good, he always tells everyone at once.
        - id: ch01-b04
          speaker: charles
          text: Then he'll tell us next. We're part of everyone, just as much as grown-ups are.
        - id: ch01-b05
          speaker: narrator
          text: The three cousins had walked slowly back to the house. There was no sign of Rupert or Mr. Macpherson. With great tact, most of it Caroline's, they did not go hunting for Rupert or for news.
        - id: ch01-b06
          speaker: narrator
          text: They shut themselves in the dining room and waited. Something else simply had to happen. The man they had once hated could not visit the house, leave again, and bring the whole affair to an end. They felt proud of their tact and delicacy, but waiting was still tiresome work. They were far too interested and anxious even to pretend to read. At last, to their great relief, footsteps and voices sounded in the hall.
        - id: ch01-b07
          speaker: caroline
          text: Here they come! We'll be awfully nice to him, won't we? He's sorry now, and he's admitted everything.
        - id: ch01-b08
          speaker: charles
          text: Of course. Do you think I could ask for his wax image? I'd like to keep it as a memorio.
        - id: ch01-b09
          speaker: caroline
          text: No, of course you can't. Hush, Charles. Do hush!
        - id: ch01-b10
          speaker: narrator
          text: There was no need. The footsteps passed the dining room and went toward the front door. No one meant to listen, but the open window carried Rupert's parting words inside.
        - id: ch01-b11
          speaker: rupert
          text: I'll do it now, sir. That will be the last of it. Thank you. Good-bye!
        - id: ch01-b12
          speaker: narrator
          text: They heard boots retreating over the gravel. The front door banged, and a moment later Rupert came in. His face was very pale and his eyes shone strangely bright. He shut the dining-room door, leaned back against it, and seemed to swallow nothing twice. His hands were clenched as he stared straight ahead.
        - id: ch01-b13
          speaker: rupert
          text: Listen. I have to tell you something. After you hear it, I don't suppose you'll ever want to speak to me again.
        - id: ch01-b14
          speaker: charles
          text: Yes, we will. Whatever it is.
        - id: ch01-b15
          speaker: narrator
          text: Rupert did not answer him. After a moment, he forced himself to go on.
        - id: ch01-b16
          speaker: rupert
          text: I told a horrible lie about Mr. Macpherson. He never hit me. I hadn't planned to say it. The lie just came out, and then I couldn't take it back. I've been wretched ever since. That's all.
        - id: ch01-b17
          speaker: caroline
          text: But you've told the truth now.
        - id: ch01-b18
          speaker: narrator
          text: It was the only comfort Caroline could find. Charles had gone as pale as Rupert, and his eyes were round with shock.
        - id: ch01-b19
          speaker: charles
          text: You couldn't have done that!
          emotion: surprised
        - id: ch01-b20
          speaker: narrator
          text: Charlotte said nothing.
        - id: ch01-b21
          speaker: rupert
          text: Before I leave, I want you to understand.
          emotion: sad
        - id: ch01-b22
          speaker: charlotte
          text: Leave? Where are you going?
          emotion: sad
        - id: ch01-b23
          speaker: rupert
          text: Back to Mr. Macpherson, of course. Your uncle won't let me stay after this.
        - id: ch01-b24
          speaker: charlotte
          text: Did Uncle say that?
        - id: ch01-b25
          speaker: rupert
          text: No. He told me to come back after I saw Mr. Macpherson out. But I had to tell you first, in case he sends me away at once.
        - id: ch01-b26
          speaker: caroline
          text: Oh, Rupert, I am so sorry!
          emotion: sad
        - id: ch01-b27
          speaker: narrator
          text: Then Caroline did something rather brave. She could see that Rupert desperately needed to say more, and that the words simply would not come while all three cousins stood there. He might manage to tell one person, either Caroline or Charlotte, if only they were alone.
        - id: ch01-b28
          speaker: caroline
          text: Charles, come outside. I need to tell you something.
        - id: ch01-b29
          speaker: narrator
          text: Once they were beyond the door, Caroline spoke earnestly.
        - id: ch01-b30
          speaker: caroline
          text: Come away. Yes, you must. Rupert can't bear all of us crowding around him. Let him talk to Charlotte.
        - id: ch01-b31
          speaker: charles
          text: Isn't it dreadful? Rupert has turned out to be a liar.
        - id: ch01-b32
          speaker: caroline
          text: Oh, don't say that! This must have been awful for him all along. He's sorry, and he's admitted it now. We must try to forget. Let's talk about something else.
          emotion: angry
        - id: ch01-b33
          speaker: narrator
          text: Talking about something else was very difficult indeed.
    - id: ch02
      title: The Black Dog
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: Left alone with Charlotte, Rupert watched the others pass the window.
        - id: ch02-b02
          speaker: rupert
          text: I wanted to tell you before, that day when you talked about being disagreeable. I simply couldn't.
        - id: ch02-b03
          speaker: charlotte
          text: Dear old Rupert! I'm so glad you're rid of it. That was the black dog. I knew something was wrong. Tell me, old chap, unless you'd rather not. The others have gone down the avenue.
        - id: ch02-b04
          speaker: narrator
          text: Rupert left the door and half sat on the table. He kept his face turned away while his fingers twisted the tablecloth into pleats.
        - id: ch02-b05
          speaker: rupert
          text: I always meant to grow up into an especially honourable sort of fellow. Father used to say things about honour to me, and I'd never done anything like this before. I hated being sent to Mr. Macpherson at all. Then I thought he treated me like a baby. He says now that he was trying to be kind and honestly believed I was younger than I am. Everything I told you was true, even the bread and milk, except that he hit me. He really did say he knew how to deal with sulky boys.
        - id: ch02-b06
          speaker: rupert
          text: I decided to run away, and I hurt my hand climbing a gate. I was furious. When I tried to explain it all to you, I couldn't find words for how hateful it had been. I thought you'd believe I'd run away for no reason. My hand hurt, and it seemed as if you expected something worse to have happened. So I said he'd hit me. What a mean beast I was!
        - id: ch02-b07
          speaker: charlotte
          text: I do wish you hadn't said it.
          emotion: sad
        - id: ch02-b08
          speaker: rupert
          text: At first, it hardly seemed to matter. I can't understand why. I thought he meant to hit me the next day anyway, and since you didn't know him, it somehow felt less real. Then I became ill, and nothing mattered at all. But once I got better, the lie kept growing worse and worse. It was like a corkscrew boring into me, harder and deeper every day.
        - id: ch02-b09
          speaker: charlotte
          text: Why didn't you tell the truth sooner?
        - id: ch02-b10
          speaker: rupert
          text: I couldn't. I never would have managed it if I hadn't found this.
        - id: ch02-b11
          speaker: narrator
          text: With some trouble, he pulled out his handkerchief. Something lay wrapped inside. Still looking away, Rupert unfolded it and held out the wax man.
        - id: ch02-b12
          speaker: rupert
          text: Yesterday I came home through the woods and saw that you'd tried that beastly pin spell I told you about.
        - id: ch02-b13
          speaker: charlotte
          text: Oh, now I understand!
          emotion: surprised
        - id: ch02-b14
          speaker: rupert
          text: I knew you'd done it because of my beastly lie.
        - id: ch02-b15
          speaker: charlotte
          text: We didn't! We only did kind things to him. We wanted him to stop being hateful and become your friend. Rupert, the spell worked! We meant it to make you friends, and now you are!
          emotion: surprised
        - id: ch02-b16
          speaker: rupert
          text: Mr. Macpherson was jolly decent about everything, anyway. I found the wax man when I came home from Mr. Penfold's last night. I carried it away and hid it at the back of my collar drawer. This morning I took it down to Mr. Penfold's with me. Having it there somehow made the truth easier to tell.
        - id: ch02-b17
          speaker: rupert
          text: Mr. Penfold was decent too. He took me to Tonbridge so I could confess to Mr. Macpherson. He said he'd known all along that I had something I needed to get off my chest. Then he talked about repentance and things. I do like him.
        - id: ch02-b18
          speaker: charlotte
          text: I'm glad we made the image.
        - id: ch02-b19
          speaker: narrator
          text: It seemed unkind to say nothing, and Charlotte could think of nothing else.
        - id: ch02-b20
          speaker: rupert
          text: Whatever happens, I'll take it. Mr. Macpherson is all right, but I hate leaving here. I suppose all of you will be glad when I'm gone.
          emotion: sad
        - id: ch02-b21
          speaker: charlotte
          text: Oh, Rupert, don't say that!
          emotion: surprised
        - id: ch02-b22
          speaker: rupert
          text: Well, I know you won't be glad. Charlotte, will you tell the others? Tell them I know I've been a grumpy brute. That lie was inside me all the time, like the Spartan fox. It felt like waiting at the dentist's every minute. Telling the truth feels like having every tooth pulled out twenty times over.
          emotion: sad
        - id: ch02-b23
          speaker: narrator
          text: Rupert tried to laugh, but the laugh would not come. Charlotte tried too, and burst into tears instead.
        - id: ch02-b24
          speaker: rupert
          text: Please don't cry!
        - id: ch02-b25
          speaker: narrator
          text: Charlotte moved close and rubbed her wet face against his coat sleeve.
        - id: ch02-b26
          speaker: charlotte
          text: You're sorry. You've told the truth, and you'll never do it again.
          emotion: sad
        - id: ch02-b27
          speaker: rupert
          text: You bet I won't. Please don't cry. It makes everything worse. Now I have to face your uncle and be thrown out, and I jolly well deserve it.
          emotion: sad
        - id: ch02-b28
          speaker: charlotte
          text: Wait here a moment. I want to fetch something for you before you go. You will wait, won't you?
        - id: ch02-b29
          speaker: rupert
          text: All right. Just don't be long.
        - id: ch02-b30
          speaker: narrator
          text: Rupert spoke with a quiet misery. Charlotte dried her eyes, hurried to her own room, and took down her favourite book, Lays of the Scottish Cavaliers. It was the thing she wanted Rupert to have. She carefully wrote his name inside. Then, carrying the book, she marched straight to her uncle's room, opened the door, and went in.
    - id: ch03
      title: Charlotte's Bright Idea
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: For once, Uncle Charles was neither reading nor writing. He sat beside his table, drumming his fingers on it. He looked sad and angry.
        - id: ch03-b02
          speaker: charlotte
          text: Uncle, I must speak to you.
        - id: ch03-b03
          speaker: uncle_charles
          text: Where is Rupert?
        - id: ch03-b04
          speaker: narrator
          text: Uncle Charles frowned. Charlotte answered the thought behind his question.
        - id: ch03-b05
          speaker: charlotte
          text: He doesn't know I've come here. I asked him to wait while I fetched a present for him. Uncle, you aren't going to send him away, are you?
        - id: ch03-b06
          speaker: uncle_charles
          text: I believe I owe it to Mr. Macpherson to send Rupert back. Rupert cast a false accusation against him, and I made matters worse by helping the boy in his flight and removing him from Mr. Macpherson's care. Sending Rupert back will show how deeply we regret all of that. If the return feels like a punishment to Rupert, it is not an undeserved one.
        - id: ch03-b07
          speaker: charlotte
          text: Yes, I hadn't thought of that. But Rupert has been punished every minute. No one else knows, but I do. He's been perfectly miserable. He just couldn't confess, and now he's told everyone. He's told everyone honourably. Oh, dear Uncle, please don't! I am so mizzy!
          emotion: sad
        - id: ch03-b08
          speaker: uncle_charles
          text: Come here.
          emotion: calm
        - id: ch03-b09
          speaker: narrator
          text: Charlotte discovered that a thin shoulder in a black coat was a very good place to cry.
        - id: ch03-b10
          speaker: uncle_charles
          text: You see, it is only fair to Mr. Macpherson that Rupert should return. I am willing to believe the boy has suffered enough.
        - id: ch03-b11
          speaker: charlotte
          text: You don't know how much. He's been as unbearable as a bear because he's been so unhappy.
        - id: ch03-b12
          speaker: uncle_charles
          text: I did not know that. Still, it would not be fair to Mr. Macpherson. Rupert must go.
        - id: ch03-b13
          speaker: narrator
          text: Then one of Charlotte's bright ideas came to her, and it dried her tears at once.
        - id: ch03-b14
          speaker: charlotte
          text: Uncle, I've got it! Couldn't you make things right with Mr. Macpherson and show that you trust him by inviting him here for a visit?
        - id: ch03-b15
          speaker: uncle_charles
          text: I couldn't. My work would fall to pieces. I simply cannot have grown-up visitors. The books you children found have changed the whole plan of my work. Though, now that I think of it, I do owe you something for that.
        - id: ch03-b16
          speaker: charlotte
          text: Then pay us with Rupert. Couldn't you endure Mr. Macpherson for one weekend? Everyone would see you were friends. Poor Rupert is terribly sorry, Uncle, and he did confess.
        - id: ch03-b17
          speaker: uncle_charles
          text: What was that I heard about a wax image?
        - id: ch03-b18
          speaker: narrator
          text: Charlotte told him the whole story. Now and then he nodded and murmured, “Yes, yes,” or, “Exactly.” When she finished, he considered it.
        - id: ch03-b19
          speaker: uncle_charles
          text: Well, you achieved what you set out to do. You brought those two together again. It seems the charm worked.
        - id: ch03-b20
          speaker: charlotte
          text: Every charm we've tried has worked. Did yours work too, Uncle?
        - id: ch03-b21
          speaker: uncle_charles
          text: I wish it had.
          emotion: sad
        - id: ch03-b22
          speaker: narrator
          text: Uncle Charles sighed.
        - id: ch03-b23
          speaker: uncle_charles
          text: Charlotte, I wish I could give you what you want. Please do not try a spell on me, because I cannot. Rupert must return tomorrow for at least a fortnight. After that, he may come back and stay until the holidays end. Will that do? I shall explain that this is not a punishment. It is simply the consequence of what he did. Without the lie, there would be no reason for him to go back.
        - id: ch03-b24
          speaker: charlotte
          text: If Rupert hadn't told the lie, would you have let him stay here from the beginning?
        - id: ch03-b25
          speaker: uncle_charles
          text: He was unhappy there. That would have been reason enough, along with your spells.
    - id: ch04
      title: Unchanging Friendship
      blocks:
        - id: ch04-b01
          speaker: rupert
          text: It's all right. Your uncle has forgiven me, and I'm allowed to come back. He explained why I have to go, and I understand. I can bear it. I'd rather take what I deserve and make a fresh start. I'd rather pay something for what I did. But I have to write and tell Father. That's worse than anything.
        - id: ch04-b02
          speaker: charlotte
          text: When you come back, we'll treat the whole thing like a bad dream.
        - id: ch04-b03
          speaker: narrator
          text: As Uncle Charles had decided, Rupert went back to Mr. Macpherson the next day. The three cousins went all the way to the station to see him off. Each wore a sprig of arbor vitae in a buttonhole. They had chosen it because it stood for unchanging friendship. Then, at the very last moment before he went, Charlotte pressed her beloved Scottish Cavaliers into Rupert's hand.
        - id: ch04-b04
          speaker: charles
          text: Still, wasn't it dreadful that he told that lie?
        - id: ch04-b05
          speaker: narrator
          text: They had only just turned away from the platform. It was a public place, but one sister shook Charles then and there while the other warned him.
        - id: ch04-b06
          speaker: one_sister
          text: Listen, Charles. If you ever mention it again, we'll never speak to you. Do you understand?
        - id: ch04-b07
          speaker: narrator
          text: Charles understood.
        - id: ch04-b08
          speaker: charles
          text: I don't mean that I dislike Rupert. But you wouldn't want me to pretend lying isn't wrong, would you?
        - id: ch04-b09
          speaker: narrator
          text: Then the girls understood too.
        - id: ch04-b10
          speaker: caroline
          text: Don't imagine we think anything at all. Just be quiet, Charles. There are two of us and only one of you.
