      display_name: The Gardener
      tts:
        delivery: plainspoken, guarded, and quietly knowing
        timbre: rough and elderly
        pace: unhurried
        pitch: low
  chapters:
    - id: ch01
      title: The Wonderful Garden
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: The next morning began gloriously. The children woke in enormous soft four-poster beds, surrounded by folds of silk and dark, shining furniture that caught the sunlight like mirrors. Breakfast was just as splendid. Silver dishes stood over little lamps, filled with bacon, sausages, and scrambled eggs. There was all the toast and marmalade anyone could want, instead of Aunt Emmeline's usual porridge and apples. They could choose tea, coffee, or hot milk, and all three chose hot milk.
        - id: ch01-b02
          speaker: caroline
          text: I feel as if we're going to enjoy every single second here.
          emotion: happy
        - id: ch01-b03
          speaker: narrator
          text: Caroline poured from a large silver jug. Little pieces of ivory kept its handle from growing hot. Charles answered through a mouthful of sausage, then swallowed and tried again.
        - id: ch01-b04
          speaker: charles
          text: We certainly are. Isn't Uncle Charles a dear? I dreamed he painted his face with the paint box I gave Caro. Then we used the bellows to blow him up and make him fatter.
        - id: ch01-b05
          speaker: caroline
          text: Did it work?
        - id: ch01-b06
          speaker: charles
          text: He burst and turned into showers of dead leaves.
        - id: ch01-b07
          speaker: narrator
          text: For a while they ate in contented silence. Then Charles asked what they should do first.
        - id: ch01-b08
          speakers: [caroline, charlotte]
          ensemble: duo
          text: Explore, of course!
          emotion: happy
        - id: ch01-b09
          speaker: narrator
          text: They finished breakfast while imagining every hole and corner of the wonderful house. But when they rang for the dishes to be taken away, Mrs. Wilmington appeared.
        - id: ch01-b10
          speaker: mrs_wilmington
          text: Your uncle wishes me to say that spending several hours in the hopen... open air will be good for you. He takes the air himself in the afternoon. So please go out at once, and do not come home before one o'clock.
        - id: ch01-b11
          speaker: charlotte
          text: Where are we supposed to go?
        - id: ch01-b12
          speaker: narrator
          text: Charlotte was not pleased.
        - id: ch01-b13
          speaker: mrs_wilmington
          text: You may go anywhere in the park and grounds, but no farther. Mr. Charles also said you might name any pudding you would like.
        - id: ch01-b14
          speakers: [caroline, charlotte, charles]
          ensemble: chorus
          text: Treacle hat, please!
        - id: ch01-b15
          speaker: narrator
          text: After a quick conference, treacle hat was their answer. Once Mrs. Wilmington had minced away, the children turned to one another. They declared her a brick and an old duck, and said this was something like having an uncle.
        - id: ch01-b16
          speaker: narrator
          text: Out they went, as ordered. No one had told them to take off their shoes and stockings, but no one had forbidden it either. They walked barefoot through the grass, still cool and wet with dew beneath the trees. Then they put their boots on again and explored the park and stable yard. A groom polished the silver harness buckles until they shone, whistling as he rubbed. The children searched the stables, the harness room, the straw loft, and the hayloft. Back in the park, they even climbed a little way up the trees. They had always known they would climb trees if they ever got half a chance. Until now, they had never had any chance at all.
        - id: ch01-b17
          speaker: narrator
          text: All the while, even when they were thinking about something else, part of each child's mind was searching for the garden. But there was no garden. After two hours in the green sunshine, they had to face that plain fact.
        - id: ch01-b18
          speaker: caroline
          text: I'm certain Mother said there was a beautiful garden with a terrace.
        - id: ch01-b19
          speaker: narrator
          text: Caroline dropped down on the grass.
        - id: ch01-b20
          speaker: charles
          text: Perhaps Uncle didn't like it, so he turned it back into something that wasn't a garden. Aunt Emmeline would call that going back to nature.
        - id: ch01-b21
          speaker: caroline
          text: It would be dreadful if there were no garden. We meant to put flowers in our letters, and I'm sure wild flowers don't have such deep meanings. Besides, we haven't seen any wild flowers. Oh, bother!
        - id: ch01-b22
          speaker: charles
          text: Never mind. We can still explore the house and perhaps find the book. When we go in, we'll ask the Elegant One why there isn't a garden.
        - id: ch01-b23
          speaker: charlotte
          text: Let's not wait. We'll ask that jolly man polishing the harness. He looked as if he wouldn't mind talking to us.
        - id: ch01-b24
          speaker: charles
          text: He's the man who drove us yesterday.
        - id: ch01-b25
          speaker: narrator
          text: So they approached William like an old friend and asked him why there was no garden. His answer was both indignant and surprising.
        - id: ch01-b26
          speaker: william
          text: Haven't they shown you, Miss? No garden? Why, there isn't a garden anywhere nearby that can beat ours. Come along, and I'll show you.
        - id: ch01-b27
          speaker: narrator
          text: More surprisingly still, William led them toward the back door.
        - id: ch01-b28
          speaker: caroline
          text: We're not allowed indoors before dinner. And we really would like to see the garden, if there truly is one.
        - id: ch01-b29
          speaker: william
          text: Of course there is, Miss. If you're quick, she won't see you. She'll be in her room doing her accounts by now, and the Master never comes through the back parts in the morning.
        - id: ch01-b30
          speaker: charles
          text: The garden must be locked. I suppose he's going to fetch the key.
        - id: ch01-b31
          speaker: narrator
          text: Charles whispered this, but William did nothing of the kind. He took them through a whitewashed passage, with cupboards and larders opening from it, then through a green baize door into the hall. He hurried across, unlatched another door, and held it open while he told them to come quietly. Once they were all inside, he shut the door. They stood in a small, bare square room. A stone staircase dropped straight through its center like a well, with a wooden railing around three sides. The room held nothing else but William and the children.
        - id: ch01-b32
          speaker: charlotte
          text: A secret staircase! Oh, it can't really be one. How lovely!
          emotion: surprised
        - id: ch01-b33
          speaker: william
          text: It may have been secret once. These railings weren't always here. See that ridge along the wall? My grandfather says boards used to cover the opening, with joists fitted there. There might have been a trapdoor over the stairs.
        - id: ch01-b34
          speakers: [caroline, charlotte, charles]
          ensemble: chorus
          text: What are the stairs for? Where do they go? Are we going down?
        - id: ch01-b35
          speaker: william
          text: Yes, and we'd better be quick. No one is meant to use this way except the Master, so don't tell anyone about me. I'll go first. Mind the steps, Miss. Their edges are rather worn.
        - id: ch01-b36
          speaker: narrator
          text: The children minded the worn edges and followed carefully down. Ahead of them, the candle flame blinked and winked blue and yellow in the dark. There were not many steps.
        - id: ch01-b37
          speaker: william
          text: Straight on now.
        - id: ch01-b38
          speaker: narrator
          text: William raised the candle. It lit a long, straight stone passage, with an arched roof above and flagstones underfoot.
        - id: ch01-b39
          speaker: charlotte
          text: This is perfectly ripping! It was awfully good of you to bring us. Where does the passage lead?
          emotion: happy
        - id: ch01-b40
          speaker: william
          text: Just wait and see.
        - id: ch01-b41
          speaker: narrator
          text: At the far end, another flight of steps climbed to a door. William opened it. Green leaves and blue sky filled the doorway, and everyone blinked against the light.
        - id: ch01-b42
          speaker: william
          text: Here's the garden.
        - id: ch01-b43
          speaker: narrator
          text: And there it was indeed.
        - id: ch01-b44
          speaker: william
          text: The gardeners use another door at the far end. I'll get you a key to it sometime.
        - id: ch01-b45
          speaker: narrator
          text: They had come out beneath an arching arbour whose entrance was almost hidden by thick shrubs.
        - id: ch01-b46
          speaker: caroline
          text: Oh, thank you. But when was this passage built, and what was it for?
        - id: ch01-b47
          speaker: william
          text: They built it when the people in the house were too grand to cross the stable yard and too lazy to walk around. You can't reach the garden from the stable yard now. I must get back, Miss. Don't let anyone know I brought you this way.
        - id: ch01-b48
          speakers: [caroline, charlotte, charles]
          ensemble: chorus
          text: Of course we won't.
        - id: ch01-b49
          speaker: charles
          text: I didn't know the house was old enough to have secret passages from history times.
        - id: ch01-b50
          speaker: william
          text: The back parts are as old as you please.
        - id: ch01-b51
          speaker: narrator
          text: William returned through the secret door. The children went the other way, pushing through the leafy screen at the front of the arbour. Beyond it lay the most beautiful walled garden imaginable. I prefer gardens without walls myself, where a terrace gives you a view. Here, the only things in sight were tall trees and the garden itself.
        - id: ch01-b52
          speaker: narrator
          text: The lower half was a vegetable garden, neatly divided into squares. Dwarf fruit trees and flower borders ran around each one like the borders on old-fashioned pocket handkerchiefs. Halfway up the garden stood a flight of steps with stone balustrades and a terrace. Beyond that lay the flower garden. Its smooth green turf paths were edged in box, a sundial stood in the center, and the beds held more flowers than I could ever name.
        - id: ch01-b53
          speaker: charlotte
          text: Oh, it's perfectly perfect!
          emotion: happy
        - id: ch01-b54
          speaker: caroline
          text: I wish I'd brought The Language of Flowers!
        - id: ch01-b55
          speaker: charles
          text: Everything is so terribly tidy!
        - id: ch01-b56
          speaker: narrator
          text: He spoke in awe, and he was right. Not one leaf was spoiled. Not one bud was twisted, and not one flower was misshapen. Every plant grew straight and strong, with a strange and perfect evenness.
        - id: ch01-b57
          speaker: caroline
          text: They look more like pictures of plants than real plants.
        - id: ch01-b58
          speaker: narrator
          text: An old gardener was sweeping the terrace steps. He wished them good morning, and they returned the greeting. The children stayed to watch him. It seemed rude to leave without saying anything more, so Caroline spoke.
        - id: ch01-b59
          speaker: caroline
          text: Everything grows beautifully here.
        - id: ch01-b60
          speaker: gardener
          text: Aye, it does. Call it perfect and you won't be far wrong.
        - id: ch01-b61
          speaker: charlotte
          text: You must be very clever. There isn't one bad weed anywhere in your garden.
        - id: ch01-b62
          speaker: gardener
          text: I do my share, but there seems to be a blessing on this place. Everything grows and thrives just so. Maybe it's the soil, or the aspect. I don't know. And I've noticed things.
        - id: ch01-b63
          speakers: [caroline, charlotte, charles]
          ensemble: chorus
          text: What things?
        - id: ch01-b64
          speaker: gardener
          text: Oh, only things.
        - id: ch01-b65
          speaker: narrator
          text: He cut the answer short and swept his way to the far end of the steps. Caroline followed him.
        - id: ch01-b66
          speaker: caroline
          text: May we pick some flowers?
        - id: ch01-b67
          speaker: gardener
          text: In moderation.
        - id: ch01-b68
          speaker: narrator
          text: Then he walked away.
        - id: ch01-b69
          speaker: charles
          text: I wonder what he means by moderation.
        - id: ch01-b70
          speaker: narrator
          text: They debated that question so earnestly that the dinner bell rang before they picked a single flower. The gate at the end of the garden stood open, so they left by that way. Above it, a stone carried some carved words and a date. They stopped and slowly spelled out each letter. "Here be dreames. 1589. Respice finem." Caroline copied the last two words into her gray pocketbook.
        - id: ch01-b71
          speaker: narrator
          text: At dinner, Mrs. Wilmington came in to carve the mutton, and Caroline asked what the words meant.
        - id: ch01-b72
          speaker: mrs_wilmington
          text: I never asked. Whatever they once meant, they must be quite out of date now. But you could only have seen them from inside the garden. How did you get in?
        - id: ch01-b73
          speaker: narrator
          text: It was an awkward question. There was only one truthful answer, and Charles gave it.
        - id: ch01-b74
          speaker: charles
          text: We went through the secret passage.
        - id: ch01-b75
          speaker: mrs_wilmington
          text: No one uses that passage except your uncle, and you were asked to remain outdoors until dinner.
        - id: ch01-b76
          speaker: narrator
          text: Her mouth snapped shut, and she went on carving.
        - id: ch01-b77
          speaker: caroline
          text: We're sorry.
        - id: ch01-b78
          speaker: mrs_wilmington
          text: Your apology is accepted.
        - id: ch01-b79
          speaker: narrator
          text: She did not sound cordial. She placed two slices of mutton on every plate and left.
        - id: ch01-b80
          speaker: charlotte
          text: It is jolly having meals by ourselves. I only wish she weren't cross.
        - id: ch01-b81
          speaker: caroline
          text: Since we're alone, I suppose we ought to have extra-good manners. May I pass you the salt, Charles?
        - id: ch01-b82
          speaker: charles
          text: No, you may not. I mean, thank you, but there is salt at every corner. That's one for each of us, and one left over for...
        - id: ch01-b83
          speaker: charlotte
          text: For her.
        - id: ch01-b84
          speaker: narrator
          text: Charlotte pointed to the portrait of the fair-haired lady with dark eyes.
        - id: ch01-b85
          speaker: charlotte
          text: Let's give her a chair and pretend she has come to dinner. Then we'll have to behave like grown-ups.
        - id: ch01-b86
          speaker: charles
          text: I can never remember how to behave. There are so many rules, and none of them seem important. Why shouldn't you drink when your mouth is full? It is your own mouth.
        - id: ch01-b87
          speaker: charlotte
          text: And why not eat peas with a knife? Getting them to your mouth without cutting yourself would be as clever as conjuring. Balancing them is hard enough.
        - id: ch01-b88
          speaker: narrator
          text: Charlotte tried to lift some peas on her knife, but they rolled off among the mutton.
        - id: ch01-b89
          speaker: caroline
          text: Don't do that. She's watching you. Charles, you're the only gentleman, worse luck. I wish I were a boy. Please bring her a chair.
        - id: ch01-b90
          speaker: narrator
          text: Charles obeyed. They rolled a large green-seated chair into the empty place on the fourth side of the table. Its mahogany back was inlaid with a curling brass pattern, and now the lady had her place among them.
        - id: ch01-b91
          speaker: caroline
          text: Now none of us must look at her portrait. Then we can't be certain she isn't sitting in that chair.
        - id: ch01-b92
          speaker: narrator
          text: After dinner, Caroline opened The Language of Flowers and looked for remorse and regret. They agreed that Mrs. Wilmington deserved a bouquet.
        - id: ch01-b93
          speaker: caroline
          text: Brambles mean remorse, but they wouldn't make a very comfortable bouquet. Verbena means regret, and I don't even know what verbena is.
        - id: ch01-b94
          speaker: charlotte
          text: Put pansies with the brambles. Then they'll mean thoughts of remorse.
        - id: ch01-b95
          speaker: narrator
          text: Later, Mrs. Wilmington came downstairs looking very neat in an afternoon dress of shiny black alpaca. The children met her with a bunch of pansies and the prickly brambles that stood for remorse.
        - id: ch01-b96
          speaker: charlotte
          text: These show that we're feeling remorsish about the secret stairs. Be careful, though. The brambles are the remorse, and they prick like anything!
        - id: ch01-b97
          speaker: narrator
          text: Mrs. Wilmington smiled, and the smile made her look quite nice.
        - id: ch01-b98
          speaker: mrs_wilmington
          text: Thank you. I am sure you will remember not to make the same mistake again.
        - id: ch01-b99
          speaker: narrator
          text: That was not the nicest possible way to accept a remorse bouquet. As Charlotte said afterward, perhaps Mrs. Wilmington could not help not knowing the nice ways. In any case, she seemed pleased, and Charlotte pointed out that pleasing her was the great thing.
        - id: ch01-b100
          speaker: narrator
          text: Once they had pleased Mrs. Wilmington, the children longed to please someone else. Their uncle was the only person they could think of.
        - id: ch01-b101
          speaker: charlotte
          text: Suppose we arrange every book in the dining-room bookcase by color. We could put all the red books together, then all the green ones, and give the ugly books a shelf of their own.
        - id: ch01-b102
          speaker: narrator
          text: The others agreed, and they set to work on the dining-room bookcase. As Caroline put it, the afternoon flew past like any old bird. By the time tea arrived, books covered the floor, the sofa, and every chair. One whole shelf shone brightly with red books, and half another looked modestly green.
        - id: ch01-b103
          speaker: mrs_wilmington
          text: Your uncle will not be coming in today, and I am sure that is just as well. What a mess! Go and wash your hands. I will put these books back.
        - id: ch01-b104
          speakers: [caroline, charlotte, charles]
          ensemble: chorus
          text: We'll put them back!
        - id: ch01-b105
          speaker: narrator
          text: It was no use. They had to go and wash their hands, while Mrs. Wilmington patiently and carefully returned every book without caring about its color at all. She kept putting them back through the whole of the children's tea. Her care and patience seemed to speak more loudly than words. There they sat enjoying their nice tea, while she could not have hers because she had to clear up after them. Yet she did not complain. The children would much rather she had complained, of course. But they could hardly tell her so.
