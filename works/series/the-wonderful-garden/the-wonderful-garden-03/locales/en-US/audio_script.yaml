audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm, observant storytelling with a gently amused touch
        timbre: clear and rounded
        pace: measured
        pitch: medium
    caroline:
      display_name: Caroline
      tts:
        delivery: lively, affectionate, and increasingly careful when being polite
        timbre: bright and clear
        pace: medium
        pitch: medium-high
    charlotte:
      display_name: Charlotte
      tts:
        delivery: eager, curious, and quick with an idea
        timbre: light and energetic
        pace: brisk
        pitch: high
    charles:
      display_name: Charles
      tts:
        delivery: proud, teasing, and boyishly direct
        timbre: youthful and crisp
        pace: medium-fast
        pitch: medium-high
    mrs_wilmington:
      display_name: Mrs. Wilmington
      tts:
        delivery: prim, exact, and restrained, with careful pronunciation
        timbre: small and dry
        pace: measured
        pitch: medium-high
    william:
      display_name: William
      tts:
        delivery: friendly, practical, and cheerfully confidential
        timbre: open and sturdy
        pace: medium
        pitch: medium-low
