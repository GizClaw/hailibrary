audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 温暖机敏，带着克制的幽默讲述
        timbre: 清澈柔和
        pace: 从容而富有变化
        pitch: 中音
    caroline:
      display_name: 卡罗琳
      tts:
        delivery: 大方热情，努力摆出长姐的懂事
        timbre: 明亮清脆
        pace: 自然轻快
        pitch: 中高音
    charlotte:
      display_name: 夏洛特
      tts:
        delivery: 活泼直率，想到什么便说什么
        timbre: 轻盈清亮
        pace: 偏快
        pitch: 高音
    charles:
      display_name: 查尔斯
      tts:
        delivery: 淘气认真，笑话总说得一本正经
        timbre: 清亮的男孩声
        pace: 轻快
        pitch: 中高音
    mrs_wilmington:
      display_name: 威尔明顿太太
      tts:
        delivery: 客气克制，始终保持管家的端庄
        timbre: 纤细平直
        pace: 稍慢
        pitch: 中音
    william:
      display_name: 威廉
      tts:
        delivery: 爽快亲切，说话朴实而带着几分神秘
        timbre: 开朗厚实
        pace: 自然
        pitch: 中低音
    gardener:
      display_name: 老园丁
      tts:
        delivery: 朴实寡言，含着不肯明说的见识
        timbre: 苍老粗哑
        pace: 从容
        pitch: 低音
  chapters:
    - id: ch01
      title: 第三章　奇妙花园
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: |-
            第二天早晨，三个孩子在又宽又软的四柱床上醒来，别提多快活了。床边垂着层层叠叠的丝帷，深色家具亮得像镜子，把照进来的阳光映了回去。早餐也丰盛极了。各样吃食都盛在银盘里，盘子下面点着酒精灯。熏肉、香肠、炒蛋，全都热腾腾的。烤面包和橘子酱想吃多少就吃多少，再也不是埃默琳姨妈家的麦片粥配苹果。桌上还有茶、咖啡和热牛奶。三个孩子全选了热牛奶。
        - id: ch01-b02
          speaker: narrator
          text: |-
            卡罗琳拿起大银壶。壶柄和壶身之间嵌着小小的象牙片，摸起来一点也不烫。
        - id: ch01-b03
          speaker: caroline
          text: |-
            我觉得，我们住在这里的每一秒都会特别快活。
        - id: ch01-b04
          speaker: narrator
          text: |-
            查尔斯嘴里还嚼着香肠，先含糊地答应一声，咽下去以后才重新开口。
        - id: ch01-b05
          speaker: charles
          text: |-
            肯定会。查尔斯舅公多可爱呀！昨晚我梦见他用我送给卡萝的颜料盒涂脸。后来，我们拿风箱给他吹气，想把他吹胖。
        - id: ch01-b06
          speaker: caroline
          text: |-
            吹胖了吗？
        - id: ch01-b07
          speaker: charles
          text: |-
            他炸开了，变成一阵阵枯叶。
        - id: ch01-b08
          speaker: narrator
          text: |-
            大家心满意足地安静了一会儿。接着，查尔斯问，第一件事该做什么。
        - id: ch01-b09
          speakers: [caroline, charlotte]
          ensemble: duo
          text: |-
            当然是探险！
        - id: ch01-b10
          speaker: narrator
          text: |-
            他们边吃边想着，要把这栋奇妙宅邸从头到尾搜个遍，每个洞、每个角落都不放过。早餐结束，他们摇铃叫人收走餐具，来的却不是普通仆人，而是威尔明顿太太本人。
        - id: ch01-b11
          speaker: mrs_wilmington
          text: |-
            你们舅公让我转告，他认为每天到户……户外待几个钟头，对身体有好处。他本人每天下午也要出去散心。所以，请你们马上出去，一点钟以前不要回……回家。
        - id: ch01-b12
          speaker: charlotte
          text: |-
            那我们去哪里？
        - id: ch01-b13
          speaker: narrator
          text: |-
            夏洛特显然不大高兴。
        - id: ch01-b14
          speaker: mrs_wilmington
          text: |-
            草木公园和庄园里都可以去，但不许走到外面。还有，查尔斯先生说，你们若有特别想吃的布丁……
        - id: ch01-b15
          speaker: narrator
          text: |-
            三个人赶紧商量了一下。
        - id: ch01-b16
          speakers: [caroline, charlotte, charles]
          ensemble: chorus
          text: |-
            请做糖浆帽子布丁！
        - id: ch01-b17
          speaker: narrator
          text: |-
            威尔明顿太太迈着碎步走远了。孩子们马上你一句我一句地夸起来。有人说她真够朋友，有人叫她可爱的老太太，还有人说，这才像个舅公。
        - id: ch01-b18
          speaker: narrator
          text: |-
            他们照吩咐出了门。不过，谁也没叫他们脱掉鞋袜，当然，也没人说不许脱。于是三个孩子光着脚踩进树下的草地。草叶还挂着露水，踩上去凉丝丝的。后来，他们穿回靴子，走遍草木公园，又去了马厩院。一个马夫正边吹口哨，边擦马具上的银扣。银扣被他擦得闪闪发亮。他们又看过马厩、马具房、堆稻草的阁楼和堆干草的阁楼，最后回到公园里爬树。他们早就认定，只要有一点机会，自己准会爬树。过去一直没有机会，今天总算有了。不过，因为以前从没爬过，他们只敢爬上一小段。
        - id: ch01-b19
          speaker: narrator
          text: |-
            这一路，他们心底始终在寻找那座花园。无论是踩草地、逛马厩，还是爬树，那个念头都跟着他们。就算脑子里管思考的地方忘了找，藏在后面的念头也没有忘。
        - id: ch01-b20
          speaker: narrator
          text: |-
            可是，哪里也没有花园！他们在阳光底下走过一片又一片绿地，足足找了两个钟头。眼前只有明亮的天空和绿色的户外天地。到这时候，三个孩子只得面对这个明明白白、叫人失望的事实。
        - id: ch01-b21
          speaker: caroline
          text: |-
            我敢肯定，妈妈说这里有一座美丽的花园，还有露台。
        - id: ch01-b22
          speaker: narrator
          text: |-
            卡罗琳一屁股坐在草地上。
        - id: ch01-b23
          speaker: charles
          text: |-
            也许舅公不喜欢花园，叫人把它重新变回不是花园的样子了。埃默琳姨妈说的“回归自然”，大概就是这么回事。
        - id: ch01-b24
          speaker: caroline
          text: |-
            没有花园可糟了。我们本来还想把花夹在信里寄出去呢。野花的含义肯定没那么深。何况，我们连野花也没看见。真讨厌！
        - id: ch01-b25
          speaker: charles
          text: |-
            先别想这个。我们还能探索宅邸，说不定会找到那两本书。等回去以后，再问问那位端庄人物，为什么这里没有花园。
        - id: ch01-b26
          speaker: charlotte
          text: |-
            不用等回去。咱们去问那个擦马具的快活家伙吧。他看起来很愿意跟我们说话。
        - id: ch01-b27
          speaker: charles
          text: |-
            昨天就是他赶车送我们来的。
        - id: ch01-b28
          speaker: narrator
          text: |-
            他们像去找老朋友一样找到了威廉，问他为什么这里没有花园。威廉又惊讶又有点生气。
        - id: ch01-b29
          speaker: william
          text: |-
            没人带小姐们去看？怎么会没有花园？这一带就数它最好。来，我领你们去。
        - id: ch01-b30
          speaker: narrator
          text: |-
            更奇怪的是，威廉没有带他们绕着庄园去找花园，反而转过身，径直领着三个孩子走向宅邸的后门。
        - id: ch01-b31
          speaker: caroline
          text: |-
            可我们到午饭时才能进屋。而且，我们确实想看花园……只要真的有花园。
        - id: ch01-b32
          speaker: william
          text: |-
            当然有，小姐。动作快点，她就看不见。她这会儿准在房里算账。老爷早上也从不来后面这些地方。
        - id: ch01-b33
          speaker: charles
          text: |-
            我猜，那座花园锁起来了，他现在要去拿钥匙。
        - id: ch01-b34
          speaker: narrator
          text: |-
            查尔斯悄声说完，才发现自己猜错了。威廉根本没有去拿钥匙。他领他们走进一条粉刷得雪白的过道，两边开着一间间储藏室和食品间。过道尽头有一扇蒙着绿色呢绒的门。威廉推开它，他们竟然回到了宅邸的门厅。
        - id: ch01-b35
          speaker: william
          text: |-
            快。悄悄进来。
        - id: ch01-b36
          speaker: narrator
          text: |-
            威廉急匆匆地穿过门厅，拔开另一扇门的插销，扶着门叫孩子们进去。门在身后重新关好。三个孩子发现，自己站在一间方方正正的小屋里。屋里空空的，除了他们和威廉，什么也没有。只有正中央一道石阶向下通去，活像一口井。楼梯三面围着木栏杆。
        - id: ch01-b37
          speaker: charlotte
          text: |-
            秘密楼梯！不会吧，真的是吗？太妙了！
          emotion: surprised
        - id: ch01-b38
          speaker: narrator
          text: |-
            威廉擦亮火柴，点燃楼梯口黄铜烛台里的蜡烛。
        - id: ch01-b39
          speaker: william
          text: |-
            从前大概真是秘密楼梯。你们看，那时候还没有这些栏杆。墙上那道凸痕，就是从前架托梁的地方。我祖父说，楼梯口原先铺着木板，上面多半还有一扇活板门。
        - id: ch01-b40
          speakers: [caroline, charlotte, charles]
          ensemble: chorus
          text: |-
            楼梯是做什么用的？通到哪儿？我们要下去吗？
        - id: ch01-b41
          speaker: william
          text: |-
            要下去，还得快。除了老爷，谁也不该走这里。不过，你们不会告我的状。让我走前面。小姐们小心脚下，石阶边沿有点磨坏了。
        - id: ch01-b42
          speaker: narrator
          text: |-
            孩子们当心着脚下，踩稳每一级石阶，跟着那一点蓝黄相间、忽明忽暗的烛光向下走。石阶并不多。到了底下，威廉举高蜡烛。微弱的光照出一条笔直的长廊。长廊全用石头砌成，地上铺的是一块块石板，头顶则是交叉相接的拱顶。
        - id: ch01-b43
          speaker: william
          text: |-
            现在一直往前。
        - id: ch01-b44
          speaker: charlotte
          text: |-
            这里简直太棒了！你肯带我们来，真够朋友！这条路通到哪儿？
          emotion: happy
        - id: ch01-b45
          speaker: william
          text: |-
            再等一会儿，你就知道了。
        - id: ch01-b46
          speaker: narrator
          text: |-
            他们继续向前。长廊尽头又出现一段石阶，这次是向上走。石阶顶端立着一扇门。威廉把门打开，所有人都被外面的亮光晃得直眨眼，只好先闭上眼睛。等他们再睁开，门框里挤满了绿叶，叶片之间还透出一块块蓝天。
        - id: ch01-b47
          speaker: william
          text: |-
            花园到了。
        - id: ch01-b48
          speaker: narrator
          text: |-
            花园真的就在眼前。刚才那扇门，原来开在一座拱廊似的凉亭里。凉亭入口几乎被长得又高又密的灌木遮住，从外面很难看出来。
        - id: ch01-b49
          speaker: william
          text: |-
            另一头还有一道门，园丁们从那里进出。我改天给你们弄把钥匙。
        - id: ch01-b50
          speaker: caroline
          text: |-
            谢谢你！可是，这条地道是什么时候修的？为什么要修呢？
        - id: ch01-b51
          speaker: william
          text: |-
            从前宅子里的人太体面，不肯穿过马厩院，又懒得绕路，就修了它。现在从马厩院已经走不通了。我要回去干活了。小姐们可别说是我带你们来的。
        - id: ch01-b52
          speakers: [caroline, charlotte, charles]
          ensemble: chorus
          text: |-
            我们当然不说！
        - id: ch01-b53
          speaker: charles
          text: |-
            我还不知道这宅子这么古老，古老到会有历史故事里的秘密通道。
        - id: ch01-b54
          speaker: william
          text: |-
            你想说它有多老都成。后面这些地方就是这样。
        - id: ch01-b55
          speaker: narrator
          text: |-
            威廉转身穿过那扇门，沿原路回去了。孩子们则朝前走，钻过凉亭入口那层浓密的叶幕。出现在他们眼前的，是世上所能有的最美丽的一座花园。花园四周围着墙。我自己更喜欢没有围墙、能从露台望见远处景色的花园。可站在这里，除了墙外高大的树木，你什么也看不见。眼里只有花园本身。
        - id: ch01-b56
          speaker: narrator
          text: |-
            花园的下半部是一块块方方正正的菜畦。矮小的果树和一圈圈花带围在每块菜地四周，就像老式手帕边上的花纹。走到花园一半高的地方，便能看见石阶、石栏杆和一道露台。再往上，才是真正的花园。平滑的绿草小径两边镶着黄杨矮篱，中央立着一座日晷。一个个花圃里到处都是花，花的种类多得连我也叫不出名字。
        - id: ch01-b57
          speaker: charlotte
          text: |-
            这里完美得不能再完美了！
          emotion: happy
        - id: ch01-b58
          speaker: caroline
          text: |-
            真该把我的《花语》带出来！
        - id: ch01-b59
          speaker: charles
          text: |-
            所有东西都整齐得吓人！
        - id: ch01-b60
          speaker: narrator
          text: |-
            确实如此。整座花园里，找不出一片残缺的叶子，也找不出一枚长歪的花苞，或一朵形状不周正的花。每一株植物都长得又直又壮。更奇怪的是，它们整齐匀称得不同寻常，仿佛从来不知道随意生长是什么样子。
        - id: ch01-b61
          speaker: caroline
          text: |-
            它们不像真的植物，倒更像画出来的。
        - id: ch01-b62
          speaker: narrator
          text: |-
            卡罗琳说得很准。一位老园丁正在清扫露台的石阶，见到孩子们，先向他们道了声早安。孩子们也回了一句，随后留下来看他扫地。可要是看过以后一句话也不说，转身便走，似乎不大礼貌。他们觉得，总该再说点什么。
        - id: ch01-b63
          speaker: caroline
          text: |-
            这里的花草长得真美。
        - id: ch01-b64
          speaker: gardener
          text: |-
            可不是嘛。就算说它们长得完美，也差不了多少。
        - id: ch01-b65
          speaker: charlotte
          text: |-
            您真有本事。您的花园里连一处杂草也没有。
        - id: ch01-b66
          speaker: gardener
          text: |-
            我也不是一点活儿没干。可这地方像受过祝福，种什么都长得旺，长得正正好好。也许是土，也许是方位，我说不准。不过，我倒留意到一些事情。
        - id: ch01-b67
          speakers: [caroline, charlotte, charles]
          ensemble: chorus
          text: |-
            什么事情？
        - id: ch01-b68
          speaker: gardener
          text: |-
            哦，不过是些事情。
        - id: ch01-b69
          speaker: narrator
          text: |-
            老园丁不肯多说，边扫边走到了长阶另一头。卡罗琳追上去，问他们能不能摘花。
        - id: ch01-b70
          speaker: gardener
          text: |-
            可以，适可而止。
        - id: ch01-b71
          speaker: charles
          text: |-
            不知道他心里的“适可而止”到底是多少。
        - id: ch01-b72
          speaker: narrator
          text: |-
            三个孩子认真讨论起来，谁也说不准老园丁肯让他们摘多少。等午饭铃响起，他们才发现，自己只顾讨论，竟然连一朵花也没摘。花园尽头的门开着，他们便从那里出去。门楣上嵌着一块石头，上面刻着文字和年份。他们停下脚步，辨认每一个刻痕，慢慢念出：“此处有梦。一五八九。须思结局。”
        - id: ch01-b73
          speaker: narrator
          text: |-
            卡罗琳拿出珀西瓦尔姨父送她的灰封皮袖珍簿，把最后那句“须思结局”认真抄了进去。午饭时，威尔明顿太太进来替孩子们切羊肉。卡罗琳想起那块刻字的石头，便问她，那几个字是什么意思。
        - id: ch01-b74
          speaker: mrs_wilmington
          text: |-
            我从没问过。不管从前是什么意思，现在一定已经过时了。不过，你得进过花园才会看见。你们怎么进去的？
        - id: ch01-b75
          speaker: narrator
          text: |-
            这个问题实在为难。可除了说实话，也没有别的办法。
        - id: ch01-b76
          speaker: charles
          text: |-
            我们是从秘密通道进去的。
        - id: ch01-b77
          speaker: mrs_wilmington
          text: |-
            除了你们舅公，没人走那条路。而且我明明吩咐过，午饭以前，你们要一直待在户外。
        - id: ch01-b78
          speaker: narrator
          text: |-
            她啪地闭紧嘴巴，继续切肉。
        - id: ch01-b79
          speaker: caroline
          text: |-
            对不起。
        - id: ch01-b80
          speaker: mrs_wilmington
          text: |-
            接受道歉。
        - id: ch01-b81
          speaker: narrator
          text: |-
            她算是接受了道歉，口气却一点也不亲切。威尔明顿太太给每只盘子放了两片羊肉，这才转身走了。
        - id: ch01-b82
          speaker: charlotte
          text: |-
            我们自己吃饭真快活。只希望她别生气。
        - id: ch01-b83
          speaker: caroline
          text: |-
            没有大人在旁边，我们大概更得讲礼貌。查尔斯，我可以把盐递给你吗？
        - id: ch01-b84
          speaker: charles
          text: |-
            不可以。我的意思是，谢谢你。可每个桌角都有一只盐罐，正好我们一人一只，还多出一只给……
        - id: ch01-b85
          speaker: charlotte
          text: |-
            多出来的那一只，是给她的。
        - id: ch01-b86
          speaker: narrator
          text: |-
            夏洛特指了指那幅金发黑眼的女士画像。
        - id: ch01-b87
          speaker: charlotte
          text: |-
            给她摆把椅子吧，就当她也来吃午饭。这样，我们就得像大人一样规矩了。
        - id: ch01-b88
          speaker: charles
          text: |-
            我怎么也记不住那些规矩。规矩那么多，又没一条真要紧。嘴里有东西为什么不能喝水？那是你自己的嘴呀。
        - id: ch01-b89
          speaker: charlotte
          text: |-
            还有，不许用餐刀吃豌豆。要是能用刀把豌豆送进嘴里，又不割伤自己，那跟变戏法一样厉害。更别说还得把它们托稳了。
        - id: ch01-b90
          speaker: narrator
          text: |-
            夏洛特用餐刀铲起豌豆。可惜一颗也没托稳，全滚进了羊肉中间。
        - id: ch01-b91
          speaker: caroline
          text: |-
            别这样，她正看着你呢。查尔斯，真倒霉，你是这里唯一的绅士。我真希望自己也是男孩。快去给她摆把椅子。
        - id: ch01-b92
          speaker: narrator
          text: |-
            他们把一把高背椅推到桌子第四边的空位上。那把椅子很大，椅面是绿色的。桃花心木做成的椅背上，还镶着黄铜卷草花纹。
        - id: ch01-b93
          speaker: caroline
          text: |-
            现在谁也不许看画像。这样，我们就没法确定，她是不是正坐在那把椅子上。
        - id: ch01-b94
          speaker: narrator
          text: |-
            午饭结束，卡罗琳拿出《花语》，查找怎样表达“悔恨之遗憾”。大家商量以后决定，他们应该为偷偷走秘密通道的事表示歉意，威尔明顿太太也应该收到一束花。
        - id: ch01-b95
          speaker: caroline
          text: |-
            黑莓藤代表悔恨，可用它扎花束，拿着一定不舒服。马鞭草代表遗憾，但我连它是什么都不知道。
        - id: ch01-b96
          speaker: charlotte
          text: |-
            那就在黑莓藤里加上三色堇。这样就是满怀悔恨的心思。
        - id: ch01-b97
          speaker: narrator
          text: |-
            下午，威尔明顿太太换上发亮的黑色羊驼呢衣裙，浑身上下收拾得整整齐齐。她走下楼来，孩子们已经等在那里，迎面送给她一束三色堇，花束里还藏着带刺的黑莓藤。
        - id: ch01-b98
          speaker: charlotte
          text: |-
            这是说，我们想到秘密楼梯的事，心里很“悔恨恨”。拿的时候小心，黑莓藤就是悔恨，扎起人来可厉害啦！
        - id: ch01-b99
          speaker: narrator
          text: |-
            威尔明顿太太笑了。笑起来，她看着相当和气。
        - id: ch01-b100
          speaker: mrs_wilmington
          text: |-
            谢谢你们。我相信，你们会记得不再犯同样的错。
        - id: ch01-b101
          speaker: narrator
          text: |-
            这句话，可不是接受悔恨花束最讨喜的方式。不过，照夏洛特的说法，也许威尔明顿太太根本不懂那些讨喜的方式，这也不能怪她。无论如何，她收下花时看起来很高兴。夏洛特指出，这才是最要紧的。
        - id: ch01-b102
          speaker: narrator
          text: |-
            他们刚做了一件让威尔明顿太太高兴的事，心里也跟着高兴起来。接着，三个孩子又渴望为另一个人做点什么，好讨那个人欢心。可他们想来想去，整栋宅子里，能让他们为他做点事情的人只有舅公。
        - id: ch01-b103
          speaker: charlotte
          text: |-
            要不，把餐厅书柜里的书按颜色排好？红书放一起，绿书放一起，难看的书单独摆一层。
        - id: ch01-b104
          speaker: narrator
          text: |-
            其他人都赞成，马上动手把书一本本搬出来。照卡罗琳的话，那个下午像随便哪只老鸟似的，扑棱一下就飞走了。下午茶送来时，他们还没有收拾完。地板上、沙发上、椅子上，到处铺满了书。一层书架已经被红书装点得又鲜艳又热闹，另有半层书架端端庄庄地绿着。
        - id: ch01-b105
          speaker: mrs_wilmington
          text: |-
            你们舅公今天不来了。我敢说，这倒正好。瞧你们弄得多乱！让我来放回去，你们快去洗手。
        - id: ch01-b106
          speakers: [caroline, charlotte, charles]
          ensemble: chorus
          text: |-
            我们会自己放回去！
        - id: ch01-b107
          speaker: narrator
          text: |-
            说也没用，他们非去洗手不可。整个下午茶时间，威尔明顿太太一直在把书放回原处。她做得那么耐心，那么仔细，却完全不管书是什么颜色。她一句埋怨也没说。可是，她那份耐心比说话还响，仿佛在告诉他们：“是啊，你们坐在那里，舒舒服服地喝着好茶。我却得替你们收拾，连自己的茶也喝不成。不过，我不抱怨。不。”
        - id: ch01-b108
          speaker: narrator
          text: |-
            当然，孩子们宁可她真的抱怨出来。可这话，他们又不能说。
