audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 温暖机敏，带着克制的幽默讲述
        timbre: 清澈柔和
        pace: 从容而富有变化
        pitch: 中音
    caroline:
      display_name: 卡罗琳
      tts:
        delivery: 大方热情，努力摆出长姐的懂事
        timbre: 明亮清脆
        pace: 自然轻快
        pitch: 中高音
    charlotte:
      display_name: 夏洛特
      tts:
        delivery: 活泼直率，想到什么便说什么
        timbre: 轻盈清亮
        pace: 偏快
        pitch: 高音
    charles:
      display_name: 查尔斯
      tts:
        delivery: 淘气认真，笑话总说得一本正经
        timbre: 清亮的男孩声
        pace: 轻快
        pitch: 中高音
    mrs_wilmington:
      display_name: 威尔明顿太太
      tts:
        delivery: 谨慎严肃，字句里带着管家的规矩
        timbre: 紧致清楚
        pace: 稍慢
        pitch: 中音
    rupert:
      display_name: 鲁珀特
      tts:
        delivery: 直爽开朗，病中说话虚弱而迷糊
        timbre: 清亮的少年声
        pace: 自然，发烧时忽快忽慢
        pitch: 中高音
  chapters:
    - id: ch01
      title: 第十二章　另一本书
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: |-
            三个孩子找到了第二本书。它没有上一本那么沉，前面却也只有三四页照片。照片里的太太穿着裙撑，先生留着络腮胡，脖子上束着硬领巾。他们倚在大理石柱旁，背后垂着松松的天鹅绒帷幔。
        - id: ch01-b02
          speaker: charlotte
          text: |-
            小心点。动手以前先准备好，随时都能逃。
        - id: ch01-b03
          speaker: narrator
          text: |-
            他们按下小机关，立刻蹿向门口，准备“逃命”。可银铃般的乐声并没有响起来。三个人屏住呼吸，慢慢走回桌边，这才看清机关不是往下按，而是要横着推。夏洛特推了一下，盖子猛地弹开。里头留着一块空处，原先也许装过八音盒。如今，那里放着一轴丝线、一本旧天鹅绒针插簿、一盒带玻璃盖的珠子、一只骨制绕丝板、一根编网针，还有一张写满细小铅笔字的纸。针插簿封面画着怀特岛的风景，里面的针早叫多年的锈染红了。
        - id: ch01-b04
          speaker: charles
          text: |-
            真扫兴。咱们还是把另一本弄响吧。
        - id: ch01-b05
          speaker: narrator
          text: |-
            夏洛特正看那些珠子，卡罗琳则拿起了那张纸。
        - id: ch01-b06
          speaker: charlotte
          text: |-
            这些小珠子真有意思，颗颗都不一样，跟现在的一点也不像。
        - id: ch01-b07
          speaker: caroline
          text: |-
            这只是一张书单。咦，那本帖撒罗尼迦什么的书下面画了好重一道线，为什么呢？背面还有一本画了线，叫蒲柏的《伊尔什么》……
        - id: ch01-b08
          speaker: charles
          text: |-
            是《伊利亚特》。拉丁文单词我一眼就认得，哪怕不知道它是什么意思。咱们去弄另一个八音盒吧。
        - id: ch01-b09
          speaker: caroline
          text: |-
            不，先找蒲柏那本什么。整张纸上只有这两本画了线，肯定是线索。快来，别出声。我们已经到了边缘，最最边缘。要准时，要迅速。
        - id: ch01-b10
          speaker: charles
          text: |-
            餐厅里所有书的名字，都记在最底下一层末尾的一本书里。我还以为那就是我们要找的书呢，因为封面跟画像里的有点像。
        - id: ch01-b11
          speaker: narrator
          text: |-
            在目录里找到蒲柏的《伊利亚特》并不难。上面清清楚楚写着，一册，顶层，第六柜，第三十九号。三个人立刻冲向第六柜，又把几把椅子拖到书柜跟前。卡罗琳个子最高，便爬上去够到那一册，把它从顶层取了下来。
        - id: ch01-b12
          speaker: caroline
          text: |-
            封皮在我手里松松的。啊，我真觉得就是它！
          emotion: surprised
        - id: ch01-b13
          speaker: narrator
          text: |-
            果然是它。松脱的书壳假装包着亚历山大·蒲柏先生翻译的希腊史诗，里面却藏着一本完全不同的薄棕书。正是画像里的第二本。夏洛特特意爬上椅子，把书和画像一样一样对照。绝不会错，两本完全相同。里面的纸已经发黄，还带着一种古怪的波浪纹。字体又大又老派，单词末尾以外的 s，全印得像 f。
        - id: ch01-b14
          speaker: charles
          text: |-
            这本我们看得懂，就连你们也能看懂。这回不是拉丁文。拿去给舅舅吧，他知道我们找到了书，一定高兴得不得了。
        - id: ch01-b15
          speaker: charlotte
          text: |-
            可我们答应一个星期不去打扰他。先藏着，到时候把两本一起送去。他准会不敢相信自己的眼睛。这就叫“碍眼之物”，是不是？
        - id: ch01-b16
          speaker: caroline
          text: |-
            你想说的是“赏心悦目”吧。先看看内容。会不会是咒语？
        - id: ch01-b17
          speaker: charlotte
          text: |-
            看起来全在讲生病。那些 s 偏要装成 f，实在难懂，拼法也怪得很。
        - id: ch01-b18
          speaker: charles
          text: |-
            所有拼法都很怪，尤其是 ie 和 ei。
        - id: ch01-b19
          speaker: charlotte
          text: |-
            I 在 E 前，C 后除外。这里写着，“掌管星宿与德性。此草属月亮！”
        - id: ch01-b20
          speaker: charles
          text: |-
            什么属月亮？
        - id: ch01-b21
          speaker: charlotte
          text: |-
            不知道。下面说，“此乃疗伤良草，取其汁液和酒服下，可治黄疸。亦为鼠疫之灵药，只消病者未曾病入膏肓。”
        - id: ch01-b22
          speaker: charles
          text: |-
            到底什么东西能治？
        - id: ch01-b23
          speaker: charlotte
          text: |-
            “其花有大而黄者，亦有较淡较小者。其茎高二英尺，自行分作许多横展枝杈。”
        - id: ch01-b24
          speaker: charles
          text: |-
            可说的是什么？
        - id: ch01-b25
          speaker: charlotte
          text: |-
            糙叶草。我看整本书都在讲植物，还有它们各自能做什么。
        - id: ch01-b26
          speaker: caroline
          text: |-
            太棒了！三样全齐了。咒语、药，还有《花之语言》。一样不管用，另一样总会管用。嘘，一个字也别说！
          emotion: happy
        - id: ch01-b27
          speaker: narrator
          text: |-
            她刚说完，门就开了。哈丽雅特端着茶盘走进来，卡罗琳只来得及把书扔到一把椅子上，再一屁股坐到书上。舅舅没有来喝茶。只有威尔明顿太太往屋里看了一眼，说鲁珀特的感冒更重了，今天最好别再去看他。
        - id: ch01-b28
          speaker: mrs_wilmington
          text: |-
            还有，请你们别穿着沉甸甸的靴子，一趟趟上下楼。
        - id: ch01-b29
          speaker: charlotte
          text: |-
            今天我们的脚不管穿什么，她好像都不满意。真想给她吃点东西，让她喜欢我们。她简直把我们当成黑甲虫。
        - id: ch01-b30
          speaker: caroline
          text: |-
            现在最要紧的是治好鲁珀特。刚才在客厅里，我一直觉得，这么有意思的事他偏偏不能参加，实在太可恨了。要是能把三本书合起来想个办法，他马上就会好。我们需要一道三重咒语。
        - id: ch01-b31
          speaker: charlotte
          text: |-
            那可办不到。两本书已经够多了，他不过是感冒。要是鼠疫、外伤，或者黄胆，黄疸，还是叫什么的，倒可能非用三本不可。
        - id: ch01-b32
          speaker: narrator
          text: |-
            茶具一收走，他们就把那本书摊在桌上，三颗脑袋紧紧凑到发黄的纸页上。他们从一味药草看到另一味，找了好一阵，也没找到什么看起来真能治鲁珀特的东西。
        - id: ch01-b33
          speaker: charlotte
          text: |-
            世上怎么有这么一大堆讨厌的药草。
        - id: ch01-b34
          speaker: narrator
          text: |-
            查尔斯提醒她，书里随便什么老花都叫药草。
        - id: ch01-b35
          speaker: charles
          text: |-
            我最不明白的是，人怎么会同时得那么多恶心的病。瘫痪、麻风、咽喉脓肿，还有别的这一样那一样。
        - id: ch01-b36
          speaker: caroline
          text: |-
            我猜现在的人已经不得那些病了。艾梅琳姨妈说，卫生进步得很好，人不像从前那样，动不动就得可怕的病。你看一千四百多少年那场黑死病，现在就从没听说过。
        - id: ch01-b37
          speaker: charles
          text: |-
            葬礼穿黑色，会不会就是因为这个？我记得有句拉丁文，好像说黑死病用整齐的脚步敲骑士的后背。
        - id: ch01-b38
          speaker: charlotte
          text: |-
            我早就觉得拉丁文全是胡说八道。
        - id: ch01-b39
          speaker: narrator
          text: |-
            发黄的纸和长长的 s 看得他们眼睛发酸。就在这时，卡罗琳忽然想到了一个绝妙的主意。
        - id: ch01-b40
          speaker: caroline
          text: |-
            查查玫瑰吧。我敢说，玫瑰是鲁珀特的幸运花。也许能熬成果酱，或者煎剂、酊剂什么的……
        - id: ch01-b41
          speaker: charles
          text: |-
            我刚想起来，我们答应过不给任何人吃进肚子里的东西。真糟糕！
        - id: ch01-b42
          speaker: caroline
          text: |-
            没关系，先查查。再从《花之语言》找一句，把药也变成咒语。我看一定管用。快找玫瑰。
        - id: ch01-b43
          speaker: narrator
          text: |-
            他们翻到了玫瑰，足足写了好几页。《药草志》的作者显然有一肚子话。用他自己的说法就是，要是把玫瑰的一切用途全写在这里，他的书写到这儿早就太长了。三个孩子仔仔细细查了半天，终于发现，玫瑰受维纳斯掌管。
        - id: ch01-b44
          speaker: charles
          text: |-
            这就对了。她自己也有个小男孩，所以她懂。
        - id: ch01-b45
          speaker: narrator
          text: |-
            书上还说，玫瑰煎剂正好能清解热病之热。
        - id: ch01-b46
          speaker: charles
          text: |-
            可我们不知道鲁珀特得的是哪种热病。也许是猩红热，也许是猪瘟，要是人也会得猪瘟的话。
        - id: ch01-b47
          speaker: narrator
          text: |-
            他们又读到，玫瑰是一味很有用的复元良药。鲜玫瑰的苦味，可以医治胆汁之症和水液之症。
        - id: ch01-b48
          speaker: charlotte
          text: |-
            “水液之症”大概就是想哭吧。鲁珀特倒没有。
        - id: ch01-b49
          speaker: narrator
          text: |-
            再往下，书里说，湿玫瑰膏和秘药调在一起服用，能治脑中黏液滴流到眼鼻的毛病。
        - id: ch01-b50
          speaker: caroline
          text: |-
            就是这个！我早知道玫瑰一定管用。伤风流鼻水就是黏液，那是法文，没准也是拉丁文。我以前可不知道感冒是从脑子里流出来的。怪不得人一感冒，脑袋就那么不中用。
          emotion: happy
        - id: ch01-b51
          speaker: narrator
          text: |-
            即使刚才还有谁心里存着一点疑问，下面两句话也足以叫他放心。古书先说，“红玫瑰能使人安歇入眠。”接着又说，“一剂浓厚玫瑰酊，可制怡人凉饮，平谵妄，助树皮之效。”读到这里，孩子们心里的最后一丝疑虑也烟消云散了。
        - id: ch01-b52
          speaker: caroline
          text: |-
            野猫说过，他要的正是休息。玫瑰还能帮助树皮起作用，这就更对了。她不是说，要让咳嗽轻一点吗？
        - id: ch01-b53
          speaker: charles
          text: |-
            树皮是咳嗽的意思吗？
        - id: ch01-b54
          speaker: caroline
          text: |-
            古时候准是。艾梅琳姨妈说，好些现在叫俚语的词，从前都是书里的正经词。莎士比亚那时候，“摆阔”就不是俚语。雨也停了。先去摘玫瑰，再想怎么给他用。也许让他闻一闻就行。
        - id: ch01-b55
          speaker: charles
          text: |-
            从前有个古罗马的家伙，请朋友来赴宴，又往他们身上撒成吨的玫瑰花瓣，直到全压死了。我们能不能也这样治鲁珀特？当然不撒到死，只撒到病好。
        - id: ch01-b56
          speaker: caroline
          text: |-
            可以拿玫瑰花瓣把他盖起来，就像树林里的两个孩子。装满几只枕套吧，我知道布草间在哪儿。先藏着，等大家睡了，再盖到他身上。还该添一点《花之语言》里的东西。我记得冰岛苔藓代表健康，可惜这里没有。
        - id: ch01-b57
          speaker: narrator
          text: |-
            他们赶紧翻开《花之语言》，一页一页寻找适合鲁珀特的花。书上说，粉蝶花代表“处处成功”。三个人再也找不到比它更合适的意思，于是一起决定，往大堆玫瑰花瓣里掺上几朵粉蝶花。
        - id: ch01-b58
          speaker: caroline
          text: |-
            从前有个秘密社团叫玫瑰十字会，艾梅琳姨妈告诉过我。要是玫瑰治好了鲁珀特，我们就是玫瑰十字会会员。我喜欢当很久很久以前的东西，你们呢？
        - id: ch01-b59
          speaker: narrator
          text: |-
            花园早已湿透。就算穿着防水外套，也很难不让全身淋个透。每棵树都不停往孩子头上滴水，泡湿的玫瑰花瓣又把水送进他们的袖管，再沿着脖子往下流。园里完全盛开的玫瑰倒多得很，三个带褶边的布枕套不难装满。不过，这种活儿当然不能一眨眼就干完。
        - id: ch01-b60
          speaker: narrator
          text: |-
            眼看快到睡觉时间，三个浑身滴水的孩子，各自扛着一袋同样滴水的玫瑰花瓣，站在凉亭外面。这个凉亭正通往秘密地道。他们到花园里去时，走的也是这条路。
        - id: ch01-b61
          speaker: charlotte
          text: |-
            我知道人家不许我们走。可那话只是野猫说的，而且只是因为舅舅不喜欢别人用地道。我们以后当然会告诉他，他一定会说没关系。等治好鲁珀特，人人都会夸我们聪明。
        - id: ch01-b62
          speaker: narrator
          text: |-
            可到了最后关头，他们还是站住了。
        - id: ch01-b63
          speaker: caroline
          text: |-
            真希望我能想起来，我们到底答应过不走地道，还是只听见别人叫我们不许走。这两件事完全不一样，对不对？
        - id: ch01-b64
          speaker: narrator
          text: |-
            大人常以为孩子不听话。其实，孩子有时是真的忘了自己究竟答应过没有，自然会把疑处往有利于自己的方向想。可轮到大人，大人有时却不肯也这样替孩子想。查尔斯和夏洛特谁也不记得自己曾经答应过。
        - id: ch01-b65
          speaker: caroline
          text: |-
            那就走吧！
        - id: ch01-b66
          speaker: narrator
          text: |-
            卡罗琳推开门。他们预先放好的蜡烛，光亮正够照着他们插好门闩，也照亮了地道拱顶下的一处凹室。三个孩子早已选中那里，准备用来藏玫瑰花瓣。他们贴着另一扇门听了听，平安穿过过道，又上楼回到各自房间。卡罗琳脱下湿衣服，换上浴室拖鞋，再带着浴巾悄悄下楼，把他们滴在秘密楼梯房门口的水擦干。要是留下那么大一片水迹，威尔明顿太太准会把它当成一条线索。
        - id: ch01-b67
          speaker: narrator
          text: |-
            这时，威尔明顿太太正守在鲁珀特房里，把一道道冷绷带敷到他滚烫的额头上。等她照料完鲁珀特，离开他过夜时，秘密楼梯门口的石地板早已经干了。
        - id: ch01-b68
          speaker: narrator
          text: |-
            也许你不愿在半夜走下秘密楼梯，再钻进地下通道。哪怕是去取能治好生病朋友的玫瑰花瓣，你也未必肯去。可三个C不怕黑。妈妈从小就让他们习惯在黑暗里走动。她常把一小包一小包糖果预先放好，再清清楚楚地告诉他们到哪里去找。摸着黑在屋里找路，对他们来说是一种游戏。于是，在三个孩子心里，黑暗总是和糖果、期待，还有种种愉快的事连在一起。何况，他们只需摸黑走过宅子里的楼梯。一到秘密楼梯口，当然就点起蜡烛。
        - id: ch01-b69
          speaker: narrator
          text: |-
            现在，你可以看见三个孩子穿着红色绗缝睡袍，把一袋袋湿漉漉的玫瑰花瓣搬上楼。他们在黑暗里摸索着，一直走到鲁珀特的房间。屋里只有一盏夜灯发着昏暗的光。三个孩子进去以后，又点亮了梳妆台上的蜡烛。
        - id: ch01-b70
          speaker: rupert
          text: |-
            喂，是谁？
        - id: ch01-b71
          speaker: caroline
          text: |-
            只是我们。烧得很厉害吗？
        - id: ch01-b72
          speaker: rupert
          text: |-
            现在很热，刚才还冷。我想睡，可就是睡不着。一会儿热，一会儿冷，难受透了。
        - id: ch01-b73
          speaker: charlotte
          text: |-
            我们带来了又舒服又凉快的东西。你先下床，一会儿就知道了。
        - id: ch01-b74
          speaker: narrator
          text: |-
            鲁珀特的眼睛亮得出奇，两颊烧得鲜红。他身上穿着一件长得不得了的睡衣，跌跌撞撞地下了床，又一头滚进床头的扶手椅。卡罗琳马上拿来一条毯子，从头到脚裹住他。鲁珀特不肯这样盖着，立刻抗议起来。
        - id: ch01-b75
          speaker: caroline
          text: |-
            非盖不可。病人换床单的时候，别人总会这样做。
        - id: ch01-b76
          speaker: narrator
          text: |-
            三个孩子一起动手，把鲁珀特床上的被子和床单翻开。接着，他们提起三个湿漉漉的枕套，把三大袋还在滴水的红玫瑰花瓣全倒到了床上。
        - id: ch01-b77
          speaker: charles
          text: |-
            好了，躺进去吧。这么多花瓣，再厉害的高烧也能凉下来。
        - id: ch01-b78
          speaker: narrator
          text: |-
            鲁珀特滚进花瓣里。他实在烧得糊涂了。要不然，绝不会有人自愿滚进一床湿淋淋的红玫瑰花瓣。
        - id: ch01-b79
          speaker: rupert
          text: |-
            啊，太痛快了！真舒服，好凉，好凉。你们给我带这个，真够朋友。花瓣也真香。别盖我！威尔明顿太太总给我盖被子，让我凉快凉快吧。
          emotion: happy
        - id: ch01-b80
          speaker: caroline
          text: |-
            病人总得盖起来。躺着别动，不然咒语就不灵了。
        - id: ch01-b81
          speaker: rupert
          text: |-
            原来是咒语？我还以为是玫瑰花瓣。一袋又一袋，一袋一袋又一袋。每只袋里一只猫，每只猫有一只小猫，你们知道的。要是我说胡话，那是我自己想说。别以为我不知道这是胡话。
        - id: ch01-b82
          speaker: charlotte
          text: |-
            一句话也不许说，就算能说正经话也不行。躺好，只管说，“我好多了。我完全好了。”艾梅琳姨妈从来不请医生，她总是这样说。
        - id: ch01-b83
          speaker: rupert
          text: |-
            我好多了。我完全好了。我好多了。我完全好了。我好多了。我是一口钟。过一会儿我要响铃叫威尔明顿太太。脑袋里有个钟舌。我好多了。我是一口钟。
        - id: ch01-b84
          speaker: narrator
          text: |-
            鲁珀特就这样一句接一句，翻来覆去地说了好长好长时间，话也变得越来越没有道理。
        - id: ch01-b85
          speaker: caroline
          text: |-
            这就是书里说的谵妄。
        - id: ch01-b86
          speaker: narrator
          text: |-
            卡罗琳心满意足，把毯子压得更紧。不久，鲁珀特开始发抖。夏洛特赶紧把三个人床上的鸭绒被全抱来，另外两个死死按住裹着他的毯子。这会儿，鲁珀特已经完全不知道自己说的是什么，也不知道在对谁说。他谈起印度，把查尔斯当成了照料他的阿妈，把卡罗琳当成马夫，又错把夏洛特认成默德斯通先生，叫她难受极了。可三个人仍不松手。鲁珀特嚷着外面太阳底下实在太热，求他们赶快叫人拉起大蒲扇，他们还是牢牢按住他。
        - id: ch01-b87
          speaker: narrator
          text: |-
            忽然之间，鲁珀特睡着了。三个孩子又等了一会儿，直到确信他真的睡熟，才拿起壁炉前的毛皮地毯，也盖到他的床上，生怕他会着凉。随后，他们自己冻得够呛，却深信那道咒语已经治好了鲁珀特，于是悄悄回到各自床上。那些床没了鸭绒被，睡进去可真有些凉。
        - id: ch01-b88
          speaker: caroline
          text: |-
            我知道咒语一定会灵。你们看吧，鲁珀特明早准会好。
        - id: ch01-b89
          speaker: narrator
          text: |-
            清晨五点，威尔明顿太太悄悄走进鲁珀特的房间，看看他需不需要什么。地板上散满湿冷、压烂的玫瑰花瓣，还丢着两条湿床单。鲁珀特裹在乱成一团的毯子、鸭绒被和壁炉地毯里，睡得像一个健健康康的小娃娃。她极轻地把手放到他的额头上。那额头又凉又柔软。
        - id: ch01-b90
          speaker: narrator
          text: |-
            夜里剩下的时间就这样过去。到了第二天早餐时分，鲁珀特已经好多了，那场折磨他的高烧也完全退了。
        - id: ch01-b91
          speaker: caroline
          text: |-
            所以你们看，咒语确实灵验了。鲁珀特好多了。有时候我觉得，我们其实比大人以为的聪明得多。鲁珀特真的好多了。
        - id: ch01-b92
          speaker: narrator
          text: |-
            可是到了这时候，三个C自己却全都患上了严重的伤风感冒。
