  chapters:
    - id: ch01
      title: The Other Book
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: They found the second book. It was lighter than the first one. Like that first book, it had only three or four pages showing ladies in crinolines and gentlemen with whiskers and chokers. They leaned against marble pillars, with velvet curtains hanging loosely behind them.
        - id: ch01-b02
          speaker: charlotte
          text: Be careful. Make sure you're ready to run before you start it.
        - id: ch01-b03
          speaker: narrator
          text: They pressed the little catch and sprang toward the door, ready to fly. But no silvery music came. They stood there in awed silence, then slowly returned to the table.
        - id: ch01-b04
          speaker: narrator
          text: A closer look showed them that the catch was meant to slide, not press down. Charlotte pushed it. Up flew a lid. The hollow underneath might once have held a musical box. Now it held a reel of silk, a bone silk-winder, a netting needle, and an old velvet needle-book. The outside showed a painted view of the Isle of Wight, and the needles inside were red with years of rust. There was also a glass-topped box of beads and a sheet of paper covered in fine pencil writing.
        - id: ch01-b05
          speaker: charles
          text: Bother! Let's start the other one.
        - id: ch01-b06
          speaker: narrator
          text: Charlotte was studying the beads, while Caroline read the paper.
        - id: ch01-b07
          speaker: charlotte
          text: Look at all these jolly little beads. They're nothing like the ones we have now.
        - id: ch01-b08
          speaker: caroline
          text: It's only a list of books. Wait! That Thessalonian book has a very hard line under it. Why would someone do that?
        - id: ch01-b09
          speaker: narrator
          text: She unfolded the sheet and looked at the other side.
        - id: ch01-b10
          speaker: caroline
          text: Here's another one with a line under it. Pope's Ill Something.
        - id: ch01-b11
          speaker: charles
          text: Iliad. I know a Latin word the moment I see one, even when I haven't the faintest idea what it means. Now let's start the other musical box.
        - id: ch01-b12
          speaker: caroline
          text: No, we must find Pope's What's-its-name. Those are the only two books underlined, so this must be a clue. Come on, and keep quiet. I feel as if we're right on the brink of something. Punctuality and despatch!
        - id: ch01-b13
          speaker: charles
          text: There's a book at the end of the bottom shelf with the names of all the dining-room books in it. I know because I thought it was the book we wanted. Its cover looks rather like the one in the picture.
        - id: ch01-b14
          speaker: narrator
          text: The catalogue soon gave them Pope's Iliad. It said, “One volume. Top shelf. Case Six. Number Thirty-nine.” They rushed to Case Six and dragged chairs into place. Caroline was tallest, so she reached up and brought the volume down.
        - id: ch01-b15
          speaker: caroline
          text: The cover feels loose in my hand. Oh, I really think this is it!
        - id: ch01-b16
          speaker: narrator
          text: It was. The loose boards pretended to cover Mr. Alexander Pope's translation of the Greek epic. But another book slipped out from between them, a thin brown book, just like the second book in the picture. Charlotte climbed onto a chair to compare them. There could be no mistake. Inside were wavy yellow pages and large old-fashioned print. Every letter s looked like an f unless it came at the end of a word.
        - id: ch01-b17
          speaker: charles
          text: We can read this one. I mean, even you can. It's not Latin. Let's take it to Uncle and tell him what we've found. Won't he be pleased with us?
        - id: ch01-b18
          speaker: charlotte
          text: We said we wouldn't bother him for a week. Let's keep this until then and give him both books together. He won't believe his eyes. That would be an eyesore, wouldn't it?
        - id: ch01-b19
          speaker: caroline
          text: I think you mean a sight for sore eyes. Let's see what's in it. Are there spells?
        - id: ch01-b20
          speaker: charlotte
          text: It seems to be about being ill. It's awfully hard to read when all the s's pretend to be f's, and the spelling is very rum.
        - id: ch01-b21
          speaker: charles
          text: All spelling is rum, if you ask me. Especially i-e and e-i.
        - id: ch01-b22
          speaker: charlotte
          text: I before e, except after c. Listen to this. “Government and Virtues. It is under the Moon!”
        - id: ch01-b23
          speaker: charles
          text: What is under the moon?
        - id: ch01-b24
          speaker: charlotte
          text: I don't know. It says, “It is a good wound herb, and the juice taken in wine helps the jaundice. It is sovereign for the plague, if the sufferer is not too far gone.”
        - id: ch01-b25
          speaker: charles
          text: But what is? What plant does it mean?
        - id: ch01-b26
          speaker: charlotte
          text: “The flowers are large and yellow in some forms, and paler and smaller in others. The stalk is two feet high and divides into many spreading branches.”
        - id: ch01-b27
          speaker: charles
          text: What does?
        - id: ch01-b28
          speaker: charlotte
          text: Rugged wort. I think the whole book is about plants and what they're good for.
        - id: ch01-b29
          speaker: caroline
          text: How glorious! Now we have all three. We have the spells, the medicine, and the Language Of. If one of them doesn't work, another one will. Hist! Not a word!
          emotion: happy
        - id: ch01-b30
          speaker: narrator
          text: The door was opening. Caroline had just enough time to toss the book onto a chair and sit on it before Harriet came in with the tea-tray.
        - id: ch01-b31
          speaker: narrator
          text: The Uncle did not come to tea. Mrs. Wilmington only looked in for a moment. Rupert's cold was worse, she told them, and they had better not see him again that day.
        - id: ch01-b32
          speaker: mrs_wilmington
          text: And please don't keep going up and down the stairs in those heavy boots.
        - id: ch01-b33
          speaker: charlotte
          text: Nothing we put on our feet seems to please her today. I wish we could give her something that would make her like us. We might as well be black beetles.
        - id: ch01-b34
          speaker: caroline
          text: What matters is making Rupert better. While we were in the drawing room, I kept thinking how hateful it was for him to miss all this. If we can work something out of the three books, I'm sure he'll get well quickly. We need a threefold spell.
        - id: ch01-b35
          speaker: charlotte
          text: Then we can't have one. Two books ought to be plenty for a cold. You might need all three for plague, wounds, or jauntry—jaundice, or whatever it's called.
        - id: ch01-b36
          speaker: narrator
          text: Caroline finished pouring the milk, and as soon as tea was cleared away, they spread the Herbal open across the table. They put their heads together over its yellow pages. For a long while they searched without finding anything that could possibly help Rupert.
        - id: ch01-b37
          speaker: charlotte
          text: What a beastly number of herbs there are in the world.
        - id: ch01-b38
          speaker: narrator
          text: Charles reminded her that old books called almost any flower an herb.
        - id: ch01-b39
          speaker: charles
          text: What I don't understand is how people could have so many disgusting illnesses. They had palsy and leprosy and quinsy, and every other thing as well.
        - id: ch01-b40
          speaker: caroline
          text: I don't suppose people get those things now. Aunt Emmeline says Hygiene has improved so nicely that people don't have nearly as many dreadful illnesses as they used to. Think of the Black Death in fourteen hundred and something. You never hear about black deaths nowadays.
        - id: ch01-b41
          speaker: charles
          text: Perhaps that's why funerals are black. I think there's something in Latin about Black Death knocking the horseman on the back with an even foot.
        - id: ch01-b42
          speaker: charlotte
          text: I always thought Latin was nonsense.
        - id: ch01-b43
          speaker: narrator
          text: By the time the great idea came, their eyes were tired from staring at yellow paper and long s's. Caroline was the one who thought of it.
        - id: ch01-b44
          speaker: caroline
          text: Let's look up roses. I'm sure the rose is Rupert's lucky flower. Perhaps we could make some sort of conserve, decoction, or tincture.
        - id: ch01-b45
          speaker: charles
          text: I've just remembered that we promised not to give anyone anything to swallow. How rotten!
        - id: ch01-b46
          speaker: caroline
          text: Never mind. Let's look anyway. We'll turn it into a spell and use the Language Of too. I'm sure that will work. Find Rose.
        - id: ch01-b47
          speaker: narrator
          text: They found page after page about the rose. The author of the Herbal had so much to say that he admitted his book would already be too long if he set down every use of the flower. The children searched those crowded pages with great care. At last they learned that the rose was under the rule of Venus.
        - id: ch01-b48
          speaker: charles
          text: That's all right, then. Venus had a little boy of her own, so she would know.
        - id: ch01-b49
          speaker: narrator
          text: They also read that a decoction of roses was good for cooling the heat of fevers.
        - id: ch01-b50
          speaker: charles
          text: We don't know what sort of fever Rupert has. It could be scarlet fever, or swine fever, if human beings can get that.
        - id: ch01-b51
          speaker: narrator
          text: Next, the book called the rose a considerable restorative. It said the bitterness of fresh roses could cure choler and watery humours.
        - id: ch01-b52
          speaker: charlotte
          text: Watery humours must mean being in the humour to cry. Rupert isn't like that.
        - id: ch01-b53
          speaker: narrator
          text: Farther down, they found exactly what they needed. The book said that moist conserve of roses, mixed with mithridate, helped people troubled by distillations of rheum from the brain to the eyes and nose.
        - id: ch01-b54
          speaker: caroline
          text: That's it! I knew the rose would do it. A cold in the head is rheum. That's French, and I daresay it's Latin too. I never knew colds came from your brain, though. That must be why a cold makes you feel so duffing.
          emotion: happy
        - id: ch01-b55
          speaker: narrator
          text: Any doubt they still had disappeared when the book said that red roses brought rest and sleep. It also said a strong rose tincture made a pleasant julep, calmed delirium, and helped the action of the bark.
        - id: ch01-b56
          speaker: caroline
          text: Rest is what he needs. The Wil-cat said so. And if roses help the bark, that's perfect. She said his cough needed easing.
        - id: ch01-b57
          speaker: narrator
          text: She shut the book with a bang.
        - id: ch01-b58
          speaker: charles
          text: Does bark really mean cough?
        - id: ch01-b59
          speaker: caroline
          text: It must have meant that in old times. Aunt Emmeline says plenty of words that are slang now used to be book words. She said “swank” wasn't slang in Shakespeare's day. And look, the rain has stopped. Let's fetch the roses first and decide how to use them afterward. Perhaps Rupert only has to smell them.
        - id: ch01-b60
          speaker: charles
          text: There was an old Roman fellow who invited all his friends to a party. He dropped tons of rose leaves onto them until they died. Couldn't we do that to Rupert? Not until he dies, of course. Only until he gets better.
        - id: ch01-b61
          speaker: caroline
          text: We could cover him in rose leaves, like the babes in the wood. Let's fill pillowcases with them. I know where the linen room is. We can hide them until everyone is in bed, then spread them over him. We ought to add something from the Language Of too. I think Iceland moss means health, but there isn't any here.
        - id: ch01-b62
          speaker: narrator
          text: A hurried search through the Language of Flowers told them that nemophila meant “success everywhere.” They could find nothing more suitable, so they decided to mix a few nemophila flowers among the rose leaves.
        - id: ch01-b63
          speaker: caroline
          text: Aunt Emmeline told me there was once a secret society called the Rosicurians. If the roses cure Rupert, that's what we'll be. I do like being long-ago things, don't you?
        - id: ch01-b64
          speaker: narrator
          text: The garden was soaking wet. Even in mackintoshes, the children could hardly keep dry. Water dripped from every tree onto their heads. It ran from the soaked rose leaves, up their sleeves, and down their necks. Luckily, so many roses were fully open that there were enough petals to fill all three frilled linen pillowcases. Gathering that many still took a long time.
        - id: ch01-b65
          speaker: narrator
          text: It was nearly bedtime when the three dripping children stood outside the arbour with a dripping sack of rose leaves apiece. The arbour led to the secret passage, and that was how they had come outside.
        - id: ch01-b66
          speaker: charlotte
          text: I know we were told not to use it, but only the Wil-cat told us. She only said it because Uncle doesn't like other people going through the passage. Of course we'll tell him afterward, and he'll say it was all right. Once we've cured Rupert, everyone will think us clever.
        - id: ch01-b67
          speaker: narrator
          text: Yet at the last moment, they hesitated.
        - id: ch01-b68
          speaker: caroline
          text: I wish I could remember whether we actually promised not to use the passage, or whether we were only told not to. It makes all the difference, doesn't it?
        - id: ch01-b69
          speaker: narrator
          text: Grown-ups often think children are disobedient when the children truly cannot remember whether they made a promise. Naturally, children give themselves the benefit of the doubt. Sometimes the grown-ups do not return the favor. Neither Charles nor Charlotte could remember promising anything.
        - id: ch01-b70
          speaker: caroline
          text: Then here goes!
        - id: ch01-b71
          speaker: narrator
          text: Caroline pushed the door open. They had left a candle ready inside. Its light let them fasten the bolts and find the recess in the arched roof of the passage where they meant to hide the rose leaves. At the other end, they listened carefully at the door. Then they slipped safely into the house and made their way upstairs to their rooms.
        - id: ch01-b72
          speaker: narrator
          text: Caroline took off her wet clothes, put on her bath slippers, and crept downstairs with her bath towel. Water had dripped from them onto the stones beside the room with the secret staircase. They feared the wet patch would give Mrs. Wilmington a clue, so Caroline rubbed it away. But Mrs. Wilmington was with Rupert, laying cold bandages on his very hot head. By the time she left him for the night, the stones were dry.
        - id: ch01-b73
          speaker: narrator
          text: Perhaps you would not care to go down a secret staircase at midnight and enter an underground passage, even to fetch rose leaves for a sick friend. The three C.'s did not mind the darkness. Their mother had taught them to move about without a light. She made a game of it by hiding little packets of sweets and telling them exactly where to feel for each one. So darkness always made them think of sweets, expectation, and pleasant things. Besides, they only crossed the house in the dark. As soon as they reached the secret stair, they lit their candle.
        - id: ch01-b74
          speaker: narrator
          text: Now the three children came upstairs in quilted red dressing gowns, carrying the sacks of wet rose leaves. They felt their way into Rupert's room. A night-light glowed dimly there, and they lit the candles on the dressing table.
        - id: ch01-b75
          speaker: rupert
          text: Hullo! Who's there?
        - id: ch01-b76
          speaker: caroline
          text: It's only us. Is your fever very hot?
        - id: ch01-b77
          speaker: rupert
          text: It is now. A little while ago it was cold. I wish I could sleep, but I can't. First I'm burning and then I'm freezing. It's beastly.
        - id: ch01-b78
          speaker: charlotte
          text: We've brought you something lovely and cool. Get out of bed and you'll see.
        - id: ch01-b79
          speaker: narrator
          text: Rupert's eyes shone, and his cheeks were bright scarlet. He tumbled out in a very long nightshirt and rolled into the armchair beside the bed. Caroline put a blanket over him, though he protested.
        - id: ch01-b80
          speaker: caroline
          text: You must have it. They always wrap you up when you're ill and they're making your bed.
        - id: ch01-b81
          speaker: narrator
          text: The children pulled back the bedclothes and poured all three sacks of dripping rose leaves onto the bed.
        - id: ch01-b82
          speaker: charles
          text: Get in now. This ought to cool even the hottest fever.
        - id: ch01-b83
          speaker: narrator
          text: Charles was shivering a little himself. Rupert rolled into the bed. He truly was feverish. If he had not been, he would never have lain down on that couch of wet red petals.
        - id: ch01-b84
          speaker: rupert
          text: Oh, this is ripping! It's lovely and cold. You're bricks to bring it, and the roses smell so sweet. No, don't cover me. That's what Mrs. Wilmington does. Let me cool down.
          emotion: happy
        - id: ch01-b85
          speaker: caroline
          text: They always cover sick people. Keep still, or the spell won't work.
        - id: ch01-b86
          speaker: rupert
          text: Oh, is it a spell? I thought it was rose leaves. Sacks and sacks and sacks and sacks and sacks of them. Each sack had a cat, and each cat had a kit, you know. If I talk nonsense, it's because I choose to. Don't think I don't know it's nonsense.
        - id: ch01-b87
          speaker: charlotte
          text: You mustn't talk at all, even if you can talk sense. Lie still and say, “I am much better. I am quite well.” My aunt Emmeline never has a doctor, and that's what she always says.
        - id: ch01-b88
          speaker: narrator
          text: Charlotte tucked the bedclothes very tightly around his neck, and Rupert obediently began.
        - id: ch01-b89
          speaker: rupert
          text: I am much better. I am quite well. I am much better. I am quite well. I am much better. I am a bell. Soon I shall ring for Mrs. Wilmington. There's a clapper inside my head. I am much better. I am a bell.
        - id: ch01-b90
          speaker: narrator
          text: He went on that way for a very long time.
        - id: ch01-b91
          speaker: caroline
          text: This is the delirium the book mentioned.
        - id: ch01-b92
          speaker: narrator
          text: Caroline sounded satisfied, and she held the blankets down more firmly. Before long Rupert began to shiver. Charlotte fetched the eiderdowns from all three children's beds. Caroline and Charles kept the blankets wrapped tightly around Rupert. By then he no longer seemed to know what he was saying or whom he was talking to.
        - id: ch01-b93
          speaker: narrator
          text: He talked about India. He seemed to think Charles was his ayah and Caroline was his syce. He mistook Charlotte for the Murdstone man, which hurt her feelings badly. Still, they held the blankets tight, even when he complained that the sun outside was too hot and begged them to start the punkahs.
        - id: ch01-b94
          speaker: narrator
          text: Then, quite suddenly, Rupert fell asleep. The children waited until they were certain. After that, they picked up the fur hearthrug and laid it over his bed in case he caught cold. They were very cold themselves, but completely sure their spell had cured him. At last they crept back to their own beds, which felt rather chilly without the eiderdowns.
        - id: ch01-b95
          speaker: caroline
          text: I know the spell will work. You'll see. Rupert will be perfectly all right in the morning.
        - id: ch01-b96
          speaker: narrator
          text: At five o'clock, Mrs. Wilmington crept into Rupert's room to see whether he needed anything. Wet, cold, crushed rose leaves covered the floor, and two wet sheets lay among them. Rupert was rolled up in a tangle of blankets, eiderdowns, and the hearthrug. He slept as soundly as a healthy baby. Very gently, she put her hand on his forehead. It was cool and soft.
        - id: ch01-b97
          speaker: narrator
          text: By breakfast, Rupert was much better. His fever had gone.
        - id: ch01-b98
          speaker: caroline
          text: There, you see? The spell did work. Rupert is much better. Sometimes I think we're much cleverer than grown-ups believe. Rupert is much better.
        - id: ch01-b99
          speaker: narrator
          text: But all three C.'s had dreadful colds in their heads.
