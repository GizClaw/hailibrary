audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 温暖机敏，带着克制的幽默讲述
        timbre: 清澈柔和
        pace: 从容而富有变化
        pitch: 中音
    caroline:
      display_name: 卡罗琳
      tts:
        delivery: 大方热情，努力摆出长姐的懂事
        timbre: 明亮清脆
        pace: 自然轻快
        pitch: 中高音
    charlotte:
      display_name: 夏洛特
      tts:
        delivery: 活泼直率，想到什么便说什么
        timbre: 轻盈清亮
        pace: 偏快
        pitch: 高音
    charles:
      display_name: 查尔斯
      tts:
        delivery: 淘气认真，笑话总说得一本正经
        timbre: 清亮的男孩声
        pace: 轻快
        pitch: 中高音
    rupert:
      display_name: 鲁珀特
      tts:
        delivery: 直爽开朗，病中说话虚弱而迷糊
        timbre: 清亮的少年声
        pace: 自然，发烧时忽快忽慢
        pitch: 中高音
  chapters:
    - id: ch01
      title: 第十五章　正义
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: |-
            这个了不起的主意，是夏洛特想出来的。孩子们回家以后，听说舅舅当天去了坦布里奇，都觉得非做点什么不可。鲁珀特先给教父写了一封长长的电报，把事情解释得清清楚楚。没想到威尔明顿太太只肯借九便士，电报根本发不出去。卡罗琳只好坐在那里前后摇晃，两根手指堵着耳朵，不听查尔斯在旁边议论指点，一心想找出一道能帮助汽水女人的咒语。
        - id: ch01-b02
          speaker: charles
          text: |-
            你想想，我们连咒语该怎么用都不知道。光去翻书，也找不出办法呀。
        - id: ch01-b03
          speaker: narrator
          text: |-
            卡罗琳只得承认他说得对。她还是摇来摇去，拼命地想，脑子却越来越迟钝。一个念头要是偏不肯让你想到，你越想抓住它，它就躲得越远。这样的事，人人都遇到过。
        - id: ch01-b04
          speaker: charlotte
          text: |-
            你们看，我们不能拿东西给那个坏表兄吃，把他变成好人。就算这件事不犯规，我们也未必靠得近他，更别说哄他吃下去了。要是能碰到那位从小身体不好、又在外国受教育的勋爵就好了。我敢说，我们准能让他吃点什么。一个人从小体弱，别人拿什么给他，他多半都肯吃。
        - id: ch01-b05
          speaker: rupert
          text: |-
            这倒是真的。我认识一个胸膛扁扁的家伙，别人叫他吃鱼肝油，还给他配橙子。可他说，就算有橙子，那鱼肝油也不值得吃。
        - id: ch01-b06
          speaker: charlotte
          text: |-
            可我们不准拿东西给别人吃。
        - id: ch01-b07
          speaker: rupert
          text: |-
            而且，我们连那位体弱勋爵住在哪里都不知道。
        - id: ch01-b08
          speaker: caroline
          text: |-
            我知道。
        - id: ch01-b09
          speaker: narrator
          text: |-
            卡罗琳把手指从耳朵里拔了出来。其实就算不拔，她也差不多什么都听见了。
        - id: ch01-b10
          speaker: charlotte
          text: |-
            那我们去见他，直接向恺撒申诉。
        - id: ch01-b11
          speaker: caroline
          text: |-
            可他有两个住处，我们不知道他现在在哪一个。我是说，汽水女人不知道。
        - id: ch01-b12
          speaker: rupert
          text: |-
            那就两个都试试。
        - id: ch01-b13
          speaker: caroline
          text: |-
            可有一个在伦敦。汽水女人说，他当然过得好好的，既有城堡，又有贝尔格雷夫广场的大宅子，怎么会费心管她和她的小屋呢？
        - id: ch01-b14
          speaker: narrator
          text: |-
            夏洛特一下子跳了起来。
        - id: ch01-b15
          speaker: charlotte
          text: |-
            我们先去城堡。要是他不在那里，改天再带上午饭，奶酪蛋糕就够了，然后到伦敦找他。
        - id: ch01-b16
          speaker: narrator
          text: |-
            这个主意又大胆又高明，其他人全都倒吸了一口气。
        - id: ch01-b17
          speaker: caroline
          text: |-
            你是说，现在就去？
        - id: ch01-b18
          speaker: charlotte
          text: |-
            为什么不去？今天还早，连三点半都不到呢。
        - id: ch01-b19
          speaker: rupert
          text: |-
            可你连城堡在哪里都不知道。
        - id: ch01-b20
          speaker: caroline
          text: |-
            我知道，就是知道！找鲁珀特那天，威廉说，他倒希望鲁珀特逃进了城堡的园地。普oad要敢追进去，爵爷手下的人早把他赶走了。所以城堡一定就在附近。
        - id: ch01-b21
          speaker: charlotte
          text: |-
            我有办法了。还记得我们当上蔷薇十字会会员的第二天吗？舅舅问过，要不要坐马车去看彭福尔德先生。我们没去，因为知道他去了坎特伯雷。只要叫威廉相信，今天跟那天一样，去见安多尔勋爵也跟去见彭福尔德先生一样，我们就能坐马车去了。坐着马车上门，那些仆人才会把你当回事。他们又不懂什么叫真正的价值，不懂心地好比长得漂亮更要紧，也不懂发亮的东西未必都是金子。
        - id: ch01-b22
          speaker: rupert
          text: |-
            可你们到了那里，究竟要做什么？
        - id: ch01-b23
          speaker: charlotte
          text: |-
            当然是送他一束魔法花，再把汽水女人的事告诉他。
        - id: ch01-b24
          speaker: rupert
          text: |-
            你坐着马车去一位勋爵家，送给他一把两便士半的花，看上去准傻透了。人家多半有好几英亩的玻璃暖房。
        - id: ch01-b25
          speaker: charlotte
          text: |-
            就算他有好几英里的玻璃房，里面种着葡萄、菠萝，还有各种最时新的麻烦玩意儿，我也不管。他没有奇妙花园里这么端正、这么挺拔的花。托马斯说过，这附近谁家都没有。再说，我们的花有魔法。噢，鲁珀特，你别再这么老气横秋了。
        - id: ch01-b26
          speaker: rupert
          text: |-
            我才没有。犯傻的是你。
        - id: ch01-b27
          speaker: charlotte
          text: |-
            你老是跟我们以为的那个你不一样。好了，我总算说出来了。起初我们可怜你，后来又喜欢上你，因为你爱冒险，又那么了不起。可你一伤风，整个人就泄了气。你为什么非要变成这样？
          emotion: angry
        - id: ch01-b28
          speaker: rupert
          text: |-
            弓弦不能总绷着。人也不能永远一个样，那多没意思。何况我得了这么讨厌的伤风，冒险也已经冒过了。谁愿意从早到晚一顿接一顿地吃，总得换换口味。我只是讲道理罢了。也许有一天，我还会想再犯一次傻。一个家伙要犯傻，也得自己愿意才行。查尔斯，刚才那句拉丁文，就是“自作主张”的意思。
        - id: ch01-b29
          speaker: charles
          text: |-
            好，我记住了。
        - id: ch01-b30
          speaker: charlotte
          text: |-
            那么，你们要是愿意，我去跟威廉试试看。不过他最喜欢卡罗琳，因为找鲁珀特那天，她做了那件事。
        - id: ch01-b31
          speaker: rupert
          text: |-
            你就非得一次次拿那件事刺我吗？有时候，我真希望你们那天没帮过我。
        - id: ch01-b32
          speaker: narrator
          text: |-
            屋里安静了一会儿，夏洛特才重新开口。
        - id: ch01-b33
          speaker: charlotte
          text: |-
            卡罗，还是你去吧。还有查尔斯，不管发生什么，你都得把手洗干净。现在就去，免得待会儿耽误时间。
        - id: ch01-b34
          speaker: rupert
          text: |-
            这样做对谁有好处？一百年以后，洗不洗都一样。至于查尔斯那双手，恐怕连五分钟以后都没区别。
        - id: ch01-b35
          speaker: narrator
          text: |-
            夏洛特说，要是查尔斯不去洗，他们就不带他。查尔斯这才走了。门一关上，夏洛特马上转向鲁珀特。
        - id: ch01-b36
          speaker: charlotte
          text: |-
            好，你听我说。我知道你怎么了。你心里那条黑狗又骑到你背上了。我不知道它是哪一条，也不知道为什么来，可它就是来了。你今天一点儿也不好。玩莱茵河的鲁珀特时，你根本不肯认真玩。你觉得我们都是傻孩子，还觉得跟我们一起玩很丢脸。可我们头一天救你时，你不是这样。一定有什么东西钻进你身体里了。我真的觉得你中了魔法。鲁珀特，你自己觉得呢？要真是这样，我们知道怎么替你解开。
        - id: ch01-b37
          speaker: narrator
          text: |-
            鲁珀特想了很久，最后只挤出一句话。
        - id: ch01-b38
          speaker: rupert
          text: |-
            你真是个傻乎乎的小姑娘。
        - id: ch01-b39
          speaker: charlotte
          text: |-
            我才不傻呢。你这样讲，是因为自己没有姐妹，当然什么都不懂。我们一直尽力对你好，你却一天比一天讨厌。你肯好好待人，那就好好待人。你要是不肯，我就知道不是你的错，是你中了魔法。我会可怜你，可不会看不起你。现在明白了吗？
          emotion: happy
        - id: ch01-b40
          speaker: narrator
          text: |-
            鲁珀特低头看着地板，把沙发靠垫的流苏缠起来，又慢慢松开。
        - id: ch01-b41
          speaker: rupert
          text: |-
            那么，你现在讨厌我了？
        - id: ch01-b42
          speaker: charlotte
          text: |-
            不，我不讨厌你。我讨厌的是那条黑狗。起初我觉得你很了不起，现在也觉得你心里其实还是很了不起，只是不知道出了什么事。我真的觉得这像中了魔法。你不能想办法让它停下来吗？我会帮你，真的会。还有，刚才我要是抓得太狠，对不起。
        - id: ch01-b43
          speaker: rupert
          text: |-
            你不明白。我有时候就是会这样，觉得自己变成了另一个人。我说不清楚。你想笑就笑吧，我只是想告诉你。别跟其他人说。这种感觉糟透了。要是知道办法，我也许能管住它，可我不知道该怎么办。
          emotion: sad
        - id: ch01-b44
          speaker: charlotte
          text: |-
            要不，你去洗个澡？艾梅琳姨妈说，小孩子觉得自己想使坏时，就该把脸洗干净。既然对小孩子有用，对大人当然也有用。你别皱眉呀，不管多大年纪，脸都是同一种东西做的。
        - id: ch01-b45
          speaker: rupert
          text: |-
            今天看见那条河，我不痛快也有这个缘故。你会游泳吗？我会。可我答应过父亲，没有大人在场，绝不下水。你也知道，我父亲在印度。游泳就是他教我的。我本来以为自己能跟他回印度，后来医生说了一大通讨厌的废话，父亲便没带我走。三个月后，我已经完全好了，本来跟他去也不会有事，可那时太迟了。后来又发生了那些我从没想到过的事。以后再也不会好起来了。
          emotion: sad
        - id: ch01-b46
          speaker: narrator
          text: |-
            其实，他父亲远在印度这件事，用不着再说。鲁珀特走到窗前，朝外面望去。
        - id: ch01-b47
          speaker: charlotte
          text: |-
            听我说，刚才抓痛了你，我很难过。你父亲和你没能去印度，我也难过极了。今天下午，你别跟我们去了。你去找彭福尔德先生。他是牧师，前几天还说要教查尔斯游泳，那他自己一定会。你现在就过去，他会带你到河边，让你把满肚子的烦恼都淹进梅德韦河。
          emotion: sad
        - id: ch01-b48
          speaker: rupert
          text: |-
            你觉得他不会嫌麻烦吗？
        - id: ch01-b49
          speaker: charlotte
          text: |-
            嫌麻烦？他一定高兴极了。你就告诉他，三个C说我会游泳，而且我真的会！
        - id: ch01-b50
          speaker: rupert
          text: |-
            那样不大好。不过你要是托我带点东西过去，比方说一本书，我就能很自然地把话说到游泳上，再看看他怎么回答。
        - id: ch01-b51
          speaker: charlotte
          text: |-
            那你就说，我们想问问，那本拉丁文翻译书还有没有别的部分能借。这样行吧？你懂拉丁文，不会露馅。哎呀，希望他们没扔下我们先走。他们也太慢了。听着，你愿意的话，现在就赶去彭福尔德先生那里，别等他们回来。我只说你已经走了。快去吧。
        - id: ch01-b52
          speaker: rupert
          text: |-
            你这人还不坏。我想，我会去的。
        - id: ch01-b53
          speaker: narrator
          text: |-
            鲁珀特出门时捶了捶她的背，却小心地把脸转向另一边。
        - id: ch01-b54
          speaker: narrator
          text: |-
            夏洛特出门时，正和查尔斯撞了个满怀，而且撞得相当厉害。两个人都急得很，夏洛特急着问威廉答应了没有，查尔斯急着把消息一口气说出来。可惜，查尔斯根本没去洗手。他刚才在帮威廉梳马，手上的颜色已经老老实实招认了一切。卡罗琳倒是说服了威廉，叫他承认从实际用处来看，今天跟那天没有区别。她能成功，或许还因为威尔明顿太太正好走出来，坚称今天跟那天完全不是一回事。卡罗琳还说，也许大家都该洗一洗，不该只叫查尔斯洗手。
        - id: ch01-b55
          speaker: charles
          text: |-
            威廉说，他怎么都得去车站接舅舅。安多尔勋爵家的庄园门正好顺路，至少就在旁边，所以他能把我们送到门口。不过回来要自己走。我们还忘了该摘什么花。卡罗叫我们把书拿上楼，她趁你们洗手的时候查。威廉说，一刻钟以后非动身不可。鲁珀特呢？
        - id: ch01-b56
          speaker: charlotte
          text: |-
            他不跟我们去。你去把《波普卷四》拿下来，我去拿《花语》。
        - id: ch01-b57
          speaker: narrator
          text: |-
            夏洛特抱着书冲上那道宽阔平缓的楼梯，每一步都跨过三级。留给他们的时间实在太少，根本没法慢慢挑选最能打动一位年轻贵族的花。夏洛特想照着从前为追求者设计的那束花，再配一模一样的。毕竟，那束花用在鲁珀特和舅舅身上都大获成功。卡罗琳却说，适合舅舅的花，送给一位毫无亲戚关系的勋爵，也许恰恰最不合适。还是应该从头选一套新的。
        - id: ch01-b58
          speaker: caroline
          text: |-
            我洗手的时候，你来查《花语》。找找责任、正义，还有善待穷人。
        - id: ch01-b59
          speaker: narrator
          text: |-
            夏洛特听话地把书页翻得哗啦啦响。
        - id: ch01-b60
          speaker: charlotte
          text: |-
            嫉妒、玩笑、欢乐……找到正义了，是唐菖蒲和香款冬。款冬是什么？
        - id: ch01-b61
          speaker: caroline
          text: |-
            我不知道。去查医药书。
        - id: ch01-b62
          speaker: narrator
          text: |-
            卡罗琳一边说，一边使劲打着肥皂。医药书勉强承认，款冬还有两个名字，一个叫欧洲款冬，另一个叫马蹄草。
        - id: ch01-b63
          speaker: caroline
          text: |-
            可马蹄草二月才开花。它长大以后，我们又认不出来。
        - id: ch01-b64
          speaker: charlotte
          text: |-
            这里还有金光菊，也代表正义。
        - id: ch01-b65
          speaker: narrator
          text: |-
            可医药书装作根本不知道什么是金光菊，孩子们自己也不知道，只好把它放弃。
        - id: ch01-b66
          speaker: charlotte
          text: |-
            还有矢车菊，意思是“正义必将伸张”。
        - id: ch01-b67
          speaker: narrator
          text: |-
            医药书先叫她们去看“蓝芙蓉”，接着又说，矢车菊天性寒而燥，受土星管辖。要是用车前草或大紫草的水送服，还可以解除蝎毒。
        - id: ch01-b68
          speaker: charlotte
          text: |-
            这就对了。碰上坏地主，肯定比让蝎子的牙咬了还厉害。接下来……
          emotion: happy
        - id: ch01-b69
          speaker: caroline
          text: |-
            现在换我查，你快去洗！
        - id: ch01-b70
          speaker: narrator
          text: |-
            卡罗琳选了红耧斗菜，因为它表示“焦虑颤抖”。
        - id: ch01-b71
          speaker: caroline
          text: |-
            我敢说，过不了多久，我们就该焦虑得发抖了。
        - id: ch01-b72
          speaker: narrator
          text: |-
            医药书也说她选得不错。耧斗菜归金星管，常用来医治嘴巴和喉咙的肿痛，而且很有效。
        - id: ch01-b73
          speaker: caroline
          text: |-
            事情办完以前，我们的嘴巴和喉咙准会疼。要把一切跟他讲明白，得费多少口舌呀。
        - id: ch01-b74
          speaker: narrator
          text: |-
            杂色肝草报春虽然代表信心，可它多半太难找到，只好也被舍弃。月月红的意思是“我渴望你的微笑”，她们觉得再合适不过。柠檬马鞭草不但香气宜人，又代表“意外相逢”，两人也一致认为很恰当。
        - id: ch01-b75
          speaker: caroline
          text: |-
            我还有一小根麦秆，是威廉套车时给我的。上回送给舅舅，效果特别好。再放进紫藤，它的意思是“欢迎你，美丽的陌生人”。
        - id: ch01-b76
          speaker: narrator
          text: |-
            她们已经没时间把每一种花都拿到医药书里核对，只查了肝草。书上说，米扎尔杜斯和其他人，乃至几乎所有星相医师，都认定它归木星管。可真相是，它属于水星，尤其擅长医治各种心神忧郁。她们刚读到这里，查尔斯就跑来催了。
        - id: ch01-b77
          speaker: charles
          text: |-
            快一点！再不走，威廉要扔下我们了！
        - id: ch01-b78
          speaker: caroline
          text: |-
            摘花用不了多久。你们两个先上马车，我去告诉威廉，让他从废弃的门房出去，到花园门口接我。
        - id: ch01-b79
          speaker: narrator
          text: |-
            不巧，那些花一点也不好找，他们只得去问园丁。光是把献给安多尔勋爵的花一一找齐，就足足花了一刻钟。等卡罗琳提着裙摆、捧着花从园子里一路跑出来，威廉早已等得十分不耐烦。查尔斯还特意告诉她，这只能叫一抱花，根本算不上花束。
        - id: ch01-b80
          speaker: narrator
          text: |-
            威廉说，现在已经来不及把他们送到庄园门口，只能在岔路口放下。他照理已经迟了，连岔路口都不该送，还得狠狠催马，才能准时赶到车站。就这样，坐着马车气派地来到城堡的打算落了空。他们甚至连庄园门口也到不了。卡罗琳费尽心思，对威廉又求又劝，使遍了办法，最后得到的，用她自己的话说，也不过是“顺路捎了一小段”。
        - id: ch01-b81
          speaker: caroline
          text: |-
            可这样总算省了时间。我们必须在六点半以前回家，现在每一刻都要紧。真希望安多尔勋爵在家。你们呢？
        - id: ch01-b82
          speaker: charles
          text: |-
            我不知道。要是我们必须牺牲自己，跑到伦敦去找他，那才更高尚呢。我们非得砸开自己的储钱罐不可。我早就想砸一次了。真希望鲁珀特也来。他可以编几句拉丁文说给勋爵听，那样安多尔勋爵非注意我们不可。
        - id: ch01-b83
          speaker: caroline
          text: |-
            只要他在家，我们说英文，他也非听不可。噢，真希望他在！汽水女人这时候大概还在哭。我敢说，她只停下来一小会儿，把瓶子整理好，因为三点钟有人赶车来收。等我们去告诉她，事情已经解决，她不用搬走了，那该多么光荣呀！
          emotion: happy
        - id: ch01-b84
          speaker: charles
          text: |-
            可要是事情根本没解决，她还是非搬不可呢？
        - id: ch01-b85
          speaker: caroline
          text: |-
            我们的咒语从来没有失败过。
        - id: ch01-b86
          speaker: charlotte
          text: |-
            我觉得，这一定跟花园有关，也跟我们是埃莉诺夫人的祖先有关。事情当然会顺利的，查尔斯。
        - id: ch01-b87
          speaker: charles
          text: |-
            鲁珀特可不这样想。
        - id: ch01-b88
          speaker: charlotte
          text: |-
            只要不是拉丁文，鲁珀特懂的就没我们多。以后我们得教他好多事情，你等着瞧吧。好了，威廉，我们不是正在尽快下车吗？
        - id: ch01-b89
          speaker: narrator
          text: |-
            马车已经停住，车夫座上传来催促声，要他们动作快一点。接着，马车滚滚而去，把三个孩子和卡罗琳一路匆忙扎好的大花束留在了岔路口。
        - id: ch01-b90
          speaker: caroline
          text: |-
            要是真见到安多尔勋爵，让我来说，好不好？汽水女人是把事情告诉我的。
        - id: ch01-b91
          speaker: narrator
          text: |-
            其他人都答应了。只有查尔斯指出，汽水女人会告诉卡罗琳，不过是因为当时恰好只有她一个人在那里。
