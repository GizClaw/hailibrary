audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm, observant storytelling with a gently amused touch
        timbre: clear and rounded
        pace: measured
        pitch: medium
    caroline:
      display_name: Caroline
      tts:
        delivery: lively, affectionate, and increasingly careful when being polite
        timbre: bright and clear
        pace: medium
        pitch: medium-high
    charlotte:
      display_name: Charlotte
      tts:
        delivery: eager, curious, and quick with an idea
        timbre: light and energetic
        pace: brisk
        pitch: high
    charles:
      display_name: Charles
      tts:
        delivery: proud, teasing, and boyishly direct
        timbre: youthful and crisp
        pace: medium-fast
        pitch: medium-high
    rupert:
      display_name: Rupert Wix
      tts:
        delivery: blunt and gloomy at first, warming quickly among friends
        timbre: youthful and slightly husky
        pace: medium
        pitch: medium-high
    mrs_wilmington:
      display_name: Mrs. Wilmington
      tts:
        delivery: correct, reserved, and carefully ladylike
        timbre: pale and precise
        pace: measured
        pitch: medium
    william:
      display_name: William
      tts:
        delivery: gruff, loyal, and slyly protective
        timbre: rough and earthy
        pace: unhurried
        pitch: low
  chapters:
    - id: ch01
      title: Justice
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: The great discovery belonged to Charlotte. When the children reached home, Uncle Charles had gone to Tonbridge for the day. Everyone felt they had to do something. Rupert began a telegram to his godfather. It was a very good telegram, long enough to explain the whole business perfectly. But Mrs. Wilmington unexpectedly refused to lend them more than ninepence, so they could not send it. Caroline rocked back and forth with her fingers in her ears, shutting out Charles's comments and advice while she tried in vain to think of a spell that might help the Mineral woman.
        - id: ch01-b02
          speaker: charles
          text: There's no point searching the spell books before we know what we mean to do with a spell.
        - id: ch01-b03
          speaker: narrator
          text: Caroline had to admit he was right. She went on rocking and racking her brains, but the harder she tried to think, the stupider she slowly felt. That is what happens when you chase an idea that has firmly decided not to be caught or thought about.
        - id: ch01-b04
          speaker: charlotte
          text: We can't feed the wicked cousin anything that would make him good. We probably couldn't reach him, even if Uncle let us try. If only we could reach the lord who had a foreign education and has been weak since childhood. I expect he'd take anything we gave him. People who are weak from childhood get given all sorts of things.
        - id: ch01-b05
          speaker: rupert
          text: That's true. I knew a fellow with a flat chest who had to take cod-liver oil with oranges. He said even the oranges didn't make it worthwhile.
        - id: ch01-b06
          speaker: charlotte
          text: But Uncle has forbidden us to give people things to eat.
        - id: ch01-b07
          speaker: rupert
          text: And we don't know where this weak lord lives.
        - id: ch01-b08
          speaker: caroline
          text: I do.
        - id: ch01-b09
          speaker: narrator
          text: Caroline pulled her fingers from her ears, though she had really heard nearly everything with them in.
        - id: ch01-b10
          speaker: charlotte
          text: Then let's visit him. We'll appeal to Caesar.
        - id: ch01-b11
          speaker: caroline
          text: He has two homes, and we don't know which one he's in. The Mineral woman didn't know either.
        - id: ch01-b12
          speaker: rupert
          text: Try them both.
        - id: ch01-b13
          speaker: caroline
          text: But one is in London. The Mineral woman said he was all right because he had the castle and a mansion in Belgrave Square. She couldn't expect him to trouble himself over her little house.
        - id: ch01-b14
          speaker: narrator
          text: Charlotte jumped to her feet.
        - id: ch01-b15
          speaker: charlotte
          text: We'll go to the castle. If he isn't there, we'll have another cheese-and-cake day, take our lunch with us, and go to London.
        - id: ch01-b16
          speaker: narrator
          text: The idea was so brilliant and daring that the others could only gasp when they heard it.
        - id: ch01-b17
          speaker: caroline
          text: You mean go right now?
        - id: ch01-b18
          speaker: charlotte
          text: Why not? It isn't even half past three. There's plenty of day left.
        - id: ch01-b19
          speaker: rupert
          text: You don't know where the castle is.
        - id: ch01-b20
          speaker: caroline
          text: Yes, I do. During the hunt for Rupert, William hoped he'd slipped into the castle grounds. He said the lord's men would soon have sent Poad away if Poad trespassed there. So the castle must be close.
        - id: ch01-b21
          speaker: charlotte
          text: Uncle offered us the carriage to visit Mr. Penfold the day after we played Rosicurians. We didn't go because Mr. Penfold was in Canterbury. If William can be persuaded that visiting Lord Andore is the same as visiting Mr. Penfold, and today is the same as that day, then we can arrive in the carriage. Servants and people who don't understand sterling worth always think more of you when you have a carriage. They don't know that being good matters more than being pretty, or that everything that glitters isn't gold.
        - id: ch01-b22
          speaker: rupert
          text: What will you do once you arrive?
        - id: ch01-b23
          speaker: charlotte
          text: Give him magic flowers and tell him about the Mineral woman.
        - id: ch01-b24
          speaker: rupert
          text: You'll look ridiculous, turning up at a lord's house with a cheap little bunch of flowers. He probably has acres of glasshouses.
        - id: ch01-b25
          speaker: charlotte
          text: I don't care if he has miles of glass, with vineries, pineries, and every modern inconvenience. His flowers still won't grow as true and straight as ours from the wonderful garden. Thomas says no others in the whole countryside do. And ours are magic. Oh, Rupert, must you act so grown-up?
        - id: ch01-b26
          speaker: rupert
          text: I'm not acting grown-up. You're being silly.
        - id: ch01-b27
          speaker: charlotte
          text: You're never what we decide you are. There, I've said it. First we felt sorry for you. Then we liked you because you were brave and splendid. Now you've caught a cold and gone completely flat. Why?
          emotion: angry
        - id: ch01-b28
          speaker: rupert
          text: Non semper vivens arcus. No one can stay the same forever. That would be dull. Besides, I had a beastly cold, and I'd already had the adventure. You don't want one dinner after another all day. You need a change. I'm only being sensible. I expect I'll be silly again someday, if that comforts you. A fellow has to be silly of his own accord. That's what not moresuis means, Charles. It means off his own bat.
        - id: ch01-b29
          speaker: charles
          text: Yes. I'll remember that.
        - id: ch01-b30
          speaker: charlotte
          text: I'll try the idea on William, if you like. Though he likes Caroline best after what she did during the hunt for Rupert.
        - id: ch01-b31
          speaker: rupert
          text: You do keep reminding me. Sometimes I wish you hadn't helped me that day.
        - id: ch01-b32
          speaker: narrator
          text: For a long moment, no one spoke at all.
        - id: ch01-b33
          speaker: charlotte
          text: You ask William, Caro. Charles, whatever else happens, wash your hands. Go now and do it, so we don't waste time later.
        - id: ch01-b34
          speaker: rupert
          text: Cui bono? What good will it do? Charles's hands will look the same in a hundred years, or even five minutes.
        - id: ch01-b35
          speaker: narrator
          text: Charles went only after Charlotte threatened to leave without him. As soon as the door shut, she turned to Rupert.
        - id: ch01-b36
          speaker: charlotte
          text: I know what's wrong. You've got the black dog on your back. I don't know which dog it is or why it's there, but it is. You haven't been a bit nice today. You hardly tried when you played Rupert of the Rhine. You think we're silly children and that you're lowering yourself by playing with us. You didn't think so on the first day, when we saved you. Something has got into you. I truly believe you're bewitched. Do you think you are? If so, we know how to undo spells.
        - id: ch01-b37
          speaker: rupert
          text: You are a very silly little girl.
        - id: ch01-b38
          speaker: charlotte
          text: Not at all. You only say that because you have no sisters of your own, so of course you don't know. We've been as kind to you as we can, and you keep getting nastier. If you want to be nice, then be nice. If you don't, I'll know it isn't your fault. A spell is making you do it, and I'll pity you instead of despising you. Now you know.
        - id: ch01-b39
          speaker: narrator
          text: Rupert twisted the fringe on a sofa cushion, winding and unwinding the tassel while he stared at the floor.
        - id: ch01-b40
          speaker: rupert
          text: So you hate me now, I suppose?
        - id: ch01-b41
          speaker: charlotte
          text: No, I don't hate you. I hate the black dog. I thought you were splendid at first, and even now I think you're truly splendid underneath. Something has happened to you. It really does seem like bewitchment. Can't you do anything to stop it? I'd help you. I truly would. And I'm sorry if I scratched too hard.
        - id: ch01-b42
          speaker: rupert
          text: You don't understand. Sometimes I get like this and feel as if I'm someone else. I can't explain it. Laugh if you want. I only thought I'd tell you. Please don't tell the others. It's perfectly beastly. I might be able to stop it if I knew how, but I don't.
          emotion: sad
        - id: ch01-b43
          speaker: narrator
          text: It plainly cost Rupert an effort to say so.
        - id: ch01-b44
          speaker: charlotte
          text: What if you had a bath? Aunt Emmeline says children should wash their faces whenever they feel naughty. It must work for older people too. Your face is made of the same stuff, however old you are.
        - id: ch01-b45
          speaker: narrator
          text: She added the last part quickly when Rupert frowned.
        - id: ch01-b46
          speaker: rupert
          text: Seeing the river was part of it today. Can you swim? I can, but I promised Father never to go into the water unless a man was there. My father is in India, you know. He taught me. I thought I was going back to India with him. Then the doctors came out with some rotten rigmarole, and Father went without me. Three months later I was perfectly well. I could just as easily have gone, but by then it was too late. After that, things began happening that I never thought could happen. Nothing will ever be right again.
          emotion: sad
        - id: ch01-b47
          speaker: narrator
          text: Rupert had walked over to the window. He stood looking out.
        - id: ch01-b48
          speaker: charlotte
          text: I'm frightfully sorry I scratched you. And I'm sorry about your father and your not going with him. Don't come with us this afternoon. Go down to Mr. Penfold's instead. He's the clergyman, and he offered the other day to teach Charles to swim, so I know he can. If you go at once, perhaps he'll take you to the river and you can drown your dull care in the Medway.
          emotion: sad
        - id: ch01-b49
          speaker: rupert
          text: Do you think he'd mind?
        - id: ch01-b50
          speaker: charlotte
          text: Mind? He'd love it. Just tell him the three C.'s said, “I can swim,” and you can too!
        - id: ch01-b51
          speaker: rupert
          text: I couldn't say that. But if you gave me an errand, perhaps a book to carry, I could mention swimming naturally and see what he said.
        - id: ch01-b52
          speaker: charlotte
          text: Ask whether there's any more of that translated Latin book we can borrow. You know Latin, so that will work. I hope the others haven't gone without us. They're taking ages. Slip off to Mr. Penfold's before they return. I'll tell them you've left. Go on. Just go.
        - id: ch01-b53
          speaker: rupert
          text: You're not a bad sort. I think I will.
        - id: ch01-b54
          speaker: narrator
          text: Rupert thumped her on the back as he left, taking care to keep his face turned away.
        - id: ch01-b55
          speaker: narrator
          text: Charlotte and Charles collided rather violently in the doorway. Both were in a hurry, Charlotte to find out what William had said and Charles to tell her. I am sorry to say that Charles had not washed his hands. Their color plainly confessed it. Instead, he had been helping William get the horse ready.
        - id: ch01-b56
          speaker: charles
          text: Caroline convinced William that today is the same as that other day, at least for anything that matters. He may have agreed more quickly because Mrs. Wilmington came out and insisted it wasn't the same at all. Caro said perhaps all of us should wash, not only me. William has to meet Uncle at the station anyway, so he'll drive us as far as Lord Andore's lodge gates. It's on his way, or next door to it. We'll have to walk home. We haven't chosen the flowers, and Caro says to bring the books so she can read them while we wash. William leaves in fifteen minutes. Where's Rupert?
        - id: ch01-b57
          speaker: narrator
          text: Charles reached the end of all this quite breathless.
        - id: ch01-b58
          speaker: charlotte
          text: He isn't coming. Fetch volume four of Pope, and I'll bring The Language of Flowers.
        - id: ch01-b59
          speaker: narrator
          text: Carrying the books, Charlotte took the broad, shallow stairs three at a time. They had very little time to choose the flowers most likely to influence a young lord. Charlotte wanted to copy the suitor's bouquet, flower for flower, because it had worked so well in the cases of Rupert and Uncle Charles. Caroline argued that something suited to uncles might be exactly wrong for lords who were no relation at all. They would do much better to begin again with a completely new selection.
        - id: ch01-b60
          speaker: caroline
          text: While I wash, search The Language of Flowers. Find duty, justice, and kindness to the poor.
        - id: ch01-b61
          speaker: narrator
          text: Charlotte obediently flicked through the pages.
        - id: ch01-b62
          speaker: charlotte
          text: Jealousy, jest, joy, justice. Justice is gladiolus and sweet-scented tussilage. What is tussilage?
        - id: ch01-b63
          speaker: caroline
          text: I don't know. Try the medicine book.
        - id: ch01-b64
          speaker: narrator
          text: Caroline scrubbed hard while the medicine book explained that tussilage was another name for Tussilago farfara, or coltsfoot.
        - id: ch01-b65
          speaker: caroline
          text: But coltsfoot flowers in February, and we don't recognize it once it grows up.
        - id: ch01-b66
          speaker: charlotte
          text: Rudbeckia means justice. Could we use that?
        - id: ch01-b67
          speaker: narrator
          text: The medicine book pretended rudbeckia did not exist. Since the children knew nothing about it either, they crossed it off.
        - id: ch01-b68
          speaker: charlotte
          text: Cornflower means justice shall be done.
        - id: ch01-b69
          speaker: narrator
          text: The medicine book first said only, “See Bluebottle.” Under that name, it explained that cornflowers were naturally cold and dry, and under the rule of Saturn. Taken with water of plantain or greater comfrey, cornflower was said to be a remedy against the poison of a scorpion.
        - id: ch01-b70
          speaker: charlotte
          text: Good. A wicked landlord must be sharper than a scorpion's tooth. Now, what next?
        - id: ch01-b71
          speaker: caroline
          text: I'll search now. You wash, quickly!
        - id: ch01-b72
          speaker: narrator
          text: Caroline picked red columbine for anxious and trembling.
        - id: ch01-b73
          speaker: caroline
          text: I'm sure we'll be anxious and trembling soon enough.
        - id: ch01-b74
          speaker: narrator
          text: The medicine book supported her choice. It called columbine an herb of Venus, often used successfully for sore mouths and throats.
        - id: ch01-b75
          speaker: caroline
          text: Our throats will be sore before we're finished. We'll have so much to explain.
        - id: ch01-b76
          speaker: narrator
          text: Liverwort polyanthus stood for confidence, but they rejected it because it would probably be too hard to find. The daily rose meant, “I aspire to your smile,” which seemed exactly right. Lemon verbena meant an unexpected meeting. It smelled sweet as well as fitting the occasion, so everyone agreed to include it.
        - id: ch01-b77
          speaker: caroline
          text: I have a little straw as well. I picked it while William harnessed the horse, because straw worked so well with Uncle. And wistaria says, “Welcome, fair stranger,” so we'll use that.
        - id: ch01-b78
          speaker: narrator
          text: There was no time to check the straw, wistaria, or verbena in the medicine book. They managed to look up liverwort. The book admitted that Mizaldus and almost every other astrological physician called it an herb of Jupiter. Then it firmly declared that the truth was otherwise. Liverwort belonged to Mercury and was a singularly good herb for every sadness of spirit. Before they could read more, Charles called from outside.
        - id: ch01-b79
          speaker: charles
          text: Hurry, or William will leave without us!
        - id: ch01-b80
          speaker: caroline
          text: Gathering the flowers will be only a moment's work. You two go ahead and get into the carriage. I'll tell William to drive out by the deserted lodge and pick me up at the garden gate.
        - id: ch01-b81
          speaker: narrator
          text: Unfortunately, the flowers were not easy to find. Caroline had to consult the gardener. Gathering Lord Andore's presentation bouquet took about fifteen minutes instead of one. By the time she came running from the garden with the flowers piled in her lifted skirt, William was waiting and extremely cross. Charles pointed out that what she carried was only a bundle, not a bouquet at all.
        - id: ch01-b82
          speaker: william
          text: There's no time to take anyone to the lodge gates now. I'll put you down at the turning, though I shouldn't even do that. I'm late already, and I'll have to push the horse cruelly hard if I'm to reach the station in time.
          emotion: angry
        - id: ch01-b83
          speaker: narrator
          text: So the children were denied the glory of driving up to the castle in the carriage. They could not even ride as far as the lodge. After all Caroline's careful and diplomatic handling of William, they received only what she called a bit of a lift.
        - id: ch01-b84
          speaker: caroline
          text: At least it saves time, and time is everything when we have to be home by half past six. I do hope Lord Andore is there. Don't you hope so too?
        - id: ch01-b85
          speaker: charles
          text: I don't know. It might be nobler if we had to sacrifice ourselves and go to London. We'd have to break open our money boxes, and I've always wanted to do that. I wish Rupert were here. He could invent something in Latin, and Lord Andore would be forced to listen.
        - id: ch01-b86
          speaker: caroline
          text: If Lord Andore is home, he'll have to listen in English. Oh, I hope he is there. The Mineral woman is probably crying all this time. I'm certain she stopped for only one minute to sort the bottles because the man was coming for them with his cart at three. Won't it be glorious to go back and tell her everything is all right and she needn't leave her house?
        - id: ch01-b87
          speaker: charles
          text: What if everything isn't all right, and she does have to leave?
        - id: ch01-b88
          speaker: caroline
          text: Our spells have never failed yet.
        - id: ch01-b89
          speaker: charlotte
          text: I think it has something to do with the garden and our being Dame Eleanour's ancestors. Of course it will be all right, Charles.
        - id: ch01-b90
          speaker: charles
          text: Rupert didn't think it would.
        - id: ch01-b91
          speaker: charlotte
          text: Unless it's Latin, Rupert doesn't know as much as we do. We'll teach him plenty later. Just wait and see.
        - id: ch01-b92
          speaker: narrator
          text: Just then the carriage stopped. From the driver's box, William's voice urged them to look lively and get out.
        - id: ch01-b93
          speaker: charlotte
          text: All right, William. We're getting out as fast as we can.
        - id: ch01-b94
          speaker: narrator
          text: The carriage rolled away and left the three children standing at the corner. Caroline had hurriedly arranged the flowers as they drove, so now they held one large bouquet between them.
        - id: ch01-b95
          speaker: caroline
          text: If we do see Lord Andore, you'll let me be the one to explain, won't you? The Mineral woman told the whole story to me.
        - id: ch01-b96
          speaker: narrator
          text: Charlotte and Charles agreed. Charles did point out, though, that the Mineral woman had told her story to Caroline only because Caroline happened to be there at the time.
