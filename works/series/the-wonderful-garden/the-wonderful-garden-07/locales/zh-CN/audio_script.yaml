audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 温暖机敏，带着克制的幽默讲述
        timbre: 清澈柔和
        pace: 从容而富有变化
        pitch: 中音
    caroline:
      display_name: 卡罗琳
      tts:
        delivery: 大方热情，努力摆出长姐的懂事
        timbre: 明亮清脆
        pace: 自然轻快
        pitch: 中高音
    charlotte:
      display_name: 夏洛特
      tts:
        delivery: 活泼直率，想到什么便说什么
        timbre: 轻盈清亮
        pace: 偏快
        pitch: 高音
    charles:
      display_name: 查尔斯
      tts:
        delivery: 淘气认真，笑话总说得一本正经
        timbre: 清亮的男孩声
        pace: 轻快
        pitch: 中高音
    mrs_wilmington:
      display_name: 威尔明顿太太
      tts:
        delivery: 拿腔拿调，客气里透着不容商量
        timbre: 细而干脆
        pace: 稍慢
        pitch: 中高音
    police:
      display_name: 警察波德
      tts:
        delivery: 自负热心，官腔里带着乡下口音
        timbre: 粗厚洪亮
        pace: 稍慢
        pitch: 中低音
    william:
      display_name: 威廉
      tts:
        delivery: 朴实机灵，挖苦话说得不动声色
        timbre: 粗朴温和
        pace: 自然
        pitch: 中低音
    macpherson:
      display_name: 麦克弗森先生
      tts:
        delivery: 冷厉暴躁，话音短促而不耐烦
        timbre: 干硬低沉
        pace: 偏快
        pitch: 低音
  chapters:
    - id: ch01
      title: 第七章　当侦探
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: |-
            假如你是少年侦探杰克·德拉米尔，能独自查明一切秘密，还能扮成法国伯爵、外省小姐，或一个伤风鼻塞的林肯郡苦力，叫至亲、铸假币犯和走私客都认不出你；假如你又会彻底换掉嗓音，让老同学真把你当成意大利街头艺人，甚至一头登台献艺的熊……
        - id: ch01-b02
          speaker: narrator
          text: |-
            对不起，这句话实在太难，我讲不下去了。我原本只想说，侦探和躲侦探的人都惯于演戏。他们有罪时能装得清白，知道真相时又能装作无知。这种人换个身份大概很容易。可一个从没在真正危险的事情里演过戏，只在游戏里假装过的人，做起来就难了。查尔斯和卡罗琳眼下正有这种感觉。
        - id: ch01-b03
          speaker: narrator
          text: |-
            夏洛特早已安排好，要大家帮警察寻找鲁珀特。另两个也诚心夸她想得聪明，三个人便朝侧门走去。警察还在那里跟威尔明顿太太说话。计划听着很好，可不知怎么，他们的脚偏偏不愿往那边去，步子越来越慢。走到屋子一半远，卡罗琳先退缩了。
        - id: ch01-b04
          speaker: caroline
          text: |-
            我还是不去了。我根本不会装，准会干出傻事，把秘密泄露出去。我就说自己累了。
        - id: ch01-b05
          speaker: charlotte
          text: |-
            你真坏！计策都是我想的，你倒临阵退缩。
          emotion: angry
        - id: ch01-b06
          speaker: caroline
          text: |-
            我没有退缩。别挖苦我。我只是没你聪明，怕自己演不好。
        - id: ch01-b07
          speaker: narrator
          text: |-
            卡罗琳实在受不了明知鲁珀特藏在哪里，却还要假装寻找他。她宁可承认自己不如妹妹聪明。可是夏洛特只回了声“呸”，又故意问查尔斯是不是也要退出。她其实并不认为他会，谁知查尔斯真的开了口。
        - id: ch01-b08
          speaker: charles
          text: |-
            要是你不介意，我也不太想参加。
        - id: ch01-b09
          speaker: narrator
          text: |-
            夏洛特气得跺了跺脚。
        - id: ch01-b10
          speaker: charlotte
          text: |-
            好吧！可你们快走。他们看见我们磨磨蹭蹭，会觉得不对劲的。
        - id: ch01-b11
          speaker: caroline
          text: |-
            等等，我还是帮忙装着找吧。我只是太怕他们真的找到鲁珀特。要是我忽然走开，你们就知道，我是因为觉得自己傻得受不了。查尔斯，你也来。可别演得太卖力，少说话，只问问题。
        - id: ch01-b12
          speaker: charlotte
          text: |-
            这就对了！
        - id: ch01-b13
          speaker: charles
          text: |-
            那好。不过我若是不小心说漏嘴，你们不能怪我。
        - id: ch01-b14
          speaker: narrator
          text: |-
            他们来到镶着彩色玻璃的侧门。威尔明顿太太拿手帕蒙着头，威廉、园丁和园丁的帮工都在。还有一个高大粗壮的年轻人，一双肥手红通通的。他就是警察。
        - id: ch01-b15
          speaker: mrs_wilmington
          text: |-
            我不能去，也不会去。主人说过，上午无论如何都不许打扰他，房子着火也不行。我哪敢拿男孩逃跑这种粗俗的事去见他？不过，我准许你们搜查。这点事我完全能作主，完全能。
        - id: ch01-b16
          speaker: narrator
          text: |-
            警察转向孩子们。除了先前已经问过好的夏洛特，大家都向他道了早安。
        - id: ch01-b17
          speaker: police
          text: |-
            你们也早上好。几位小小姐、小少爷都要加入搜寻队吗？
        - id: ch01-b18
          speaker: caroline
          text: |-
            是的。可您抓到他以后，会把他怎么样？
        - id: ch01-b19
          speaker: police
          text: |-
            当然送进监牢。你们这是在帮助法律执行职责。你们熟悉这里，一定很有用。现在，咱们玩个假装的游戏。假装逃跑的男孩是你们的朋友，你们约好玩捉迷藏，他负责躲。那你们最先去哪儿找？
        - id: ch01-b20
          speaker: narrator
          text: |-
            警察说到鲁珀特是他们的朋友时，三个年幼的脊背同时掠过一阵寒意。那一瞬间，他们真以为一切都被发现了，连藏人的地方也已经暴露，下一句话就会说出全部真相。可是警察毫无异样，仍旧满脸逗小孩的神气，而且他的口吻越来越亲切，亲切得简直叫他们受不了。
        - id: ch01-b21
          speaker: charles
          text: |-
            我不知道。
        - id: ch01-b22
          speaker: charlotte
          text: |-
            随便什么地方。
        - id: ch01-b23
          speaker: caroline
          text: |-
            我会先去那边的树林。
        - id: ch01-b24
          speaker: narrator
          text: |-
            她指的正是鲁珀特埋在蕨草和树叶下的地方。警察终于得到一个主意，高高兴兴地叫大家出发。夏洛特不敢看姐姐，唯恐脸上露出对这桩背叛的厌恶。查尔斯把手插进口袋，好显得满不在乎。他本想吹口哨，又怕演过了头，只好忍住。他一遍遍告诉自己，真没想到卡罗会做出这种事，从来没想到。
        - id: ch01-b25
          speaker: caroline
          text: |-
            玩捉迷藏的话，我会去那里找。可我们整个上午都在那里，他要进去，我们一定听得见。您找过花园外面那片树林吗？茅草凉亭呢？另外几扇大门旁边那座没人住的旧门房呢？
        - id: ch01-b26
          speaker: police
          text: |-
            旧门房？很像个藏人的地方。小少爷，你带路。
        - id: ch01-b27
          speaker: narrator
          text: |-
            队伍一出发，夏洛特便在心里连声喊着，好卡罗，真是好卡罗。警察郑重宣布，过一会儿还要正式部署自己的搜寻队，随后转过身，问那个正弯腰摆弄鞋子的卡罗琳为什么不来。
        - id: ch01-b28
          speaker: caroline
          text: |-
            我鞋里进了石子，硌得疼，不能去了。
        - id: ch01-b29
          speaker: narrator
          text: |-
            她说着，还把脚稳稳踩在石子上。随后她进了屋。搜寻队穿过一片片树林，最后从四面围住那座空门房。格子窗积满灰，门歪挂在一只断铰链上，院子的石板缝里散落着一颗颗黑硬的苔藓球。屋顶有些地方已经松散，乱蓬蓬的茅草像一只陈旧标本鸟的羽毛。花园荒了太久，早已不再是荒园起初那种长满野草的泥地。青草、蕨草、荆棘和小橡树铺满了每一处。它已经变成外面树林的一角，只不过四周还围着篱笆。
        - id: ch01-b30
          speaker: police
          text: |-
            停！就是这里。这回准把那位小少爷堵在洞里了。
        - id: ch01-b31
          speaker: narrator
          text: |-
            可他们没有。楼下只有一个破洞的大篮子，一地散乱的稻草和受潮的旧纸，壁炉里还有一些冷灰。楼上的房间也没有男孩，只有两只去年留下的鸟巢，还有一把三条腿、只剩半截靠背的椅子。警察只好低下戴着头盔的脑袋，钻过矮门楣，垂头丧气地回到太阳底下。
        - id: ch01-b32
          speaker: police
          text: |-
            我还以为逮住他了呢。
        - id: ch01-b33
          speaker: narrator
          text: |-
            后来在茅草凉亭、落叶松林，以及庄园和园地里每一个没有鲁珀特的地方，他都重复这句话。搜寻队一处接一处地找，还是一无所获。大家挤过一片格外扎人的荆棘丛，再次来到废弃门房背后时，查尔斯终于忍不住问起午饭。
        - id: ch01-b34
          speaker: charles
          text: |-
            是不是快到吃饭的时候了？
        - id: ch01-b35
          speaker: police
          text: |-
            你们好心的家庭女教师把午饭推迟了一个钟头，好让你们帮忙搜查。
        - id: ch01-b36
          speaker: william
          text: |-
            波德先生，最好到另一边试试。这里已经扑空了。
        - id: ch01-b37
          speaker: police
          text: |-
            我现在吹哨，把男孩的主人叫来。
        - id: ch01-b38
          speaker: narrator
          text: |-
            哨子响了。夏洛特立刻想到那个默德斯通式的先生。他仿佛只用半只眼便能看透一切，半分钟就能抓走鲁珀特。查尔斯则在想，帮助逃跑的男孩究竟会受什么惩罚。
        - id: ch01-b39
          speaker: charlotte
          text: |-
            那个人在哪儿？
        - id: ch01-b40
          speaker: police
          text: |-
            他和“钟声”客栈的宾斯金先生守在大路上。我得报告一声。
        - id: ch01-b41
          speaker: charles
          text: |-
            他也会跟着我们吗？
        - id: ch01-b42
          speaker: police
          text: |-
            他留在那里最好。我叫他继续在外面来回守着。“钟声”的马夫守在另一边，防着男孩从那边出去，除非他已经回去干活了。
        - id: ch01-b43
          speaker: charlotte
          text: |-
            等着的时候，咱们再去看看那些鸟巢吧。
        - id: ch01-b44
          speaker: narrator
          text: |-
            这个主意来得正好。孩子们隔着门房的一扇扇菱形小窗，又看见那个默德斯通式的先生。他外套里面还穿着晚礼服，领带揉得皱巴巴的，歪在一只耳朵下面。夏洛特说，那张脸活像一个没能得手的刽子手。他板着孩子们熟悉的阴沉脸，跟警察说了几句。孩子们心里就是觉得那副怒容十分熟悉，尽管他们其实只见过这位皱眉先生一次。说完话，他便穿过大门离开了。
        - id: ch01-b45
          speaker: narrator
          text: |-
            孩子们等了又等，直到完全确定那人已经离开，才重新加入警察的队伍。他们已经累得很。这场傻乎乎的游戏，分明是在寻找一个他们知道在哪里，却又希望无论如何也找不到的人。它仿佛已经没完没了地玩了许多年，而且看起来还会永远继续下去。
        - id: ch01-b46
          speaker: police
          text: |-
            我让那位先生待在外面，是有道理的。他脾气暴躁。接下来我们要搜温室。万一他在玻璃房里看见那男孩，没准会像狐狸扑鸭子似的，隔着玻璃扑上去，那可不知要闯多大的祸。
        - id: ch01-b47
          speaker: narrator
          text: |-
            还用我说吗？他们在玻璃房里也没找到鲁珀特。搜寻队再回到彩色玻璃侧门时，脚步比出发时慢多了，人人都没了精神。卡罗琳却站在门阶上迎接他们。她气喘吁吁，热得满脸通红，手里提着遮阳帽的两根系带。埃梅琳姨妈最信奉遮阳帽，还一口气做了几十顶，送给所有朋友当礼物。
        - id: ch01-b48
          speaker: caroline
          text: |-
            怎么样？
        - id: ch01-b49
          speaker: police
          text: |-
            没找到他，小姐。你没看见什么吧？
        - id: ch01-b50
          speaker: narrator
          text: |-
            卡罗琳没有马上回答。她先紧张地瞧了瞧弟弟妹妹，像是很难把接下来的话说出口。随后，她把目光转开，再也不看他们的眼睛。她开口时，嗓音也变得呆板僵硬。
        - id: ch01-b51
          speaker: caroline
          text: |-
            我听见那边树林里有动静。我有东西落在那里，所以回去了一次。我听见窸窣声，还在泥泞的地方看到了脚印。看起来像男孩的靴印。
        - id: ch01-b52
          speaker: narrator
          text: |-
            夏洛特后来坚持说，她那一刻简直要炸成小碎片了。查尔斯也有同感。他们自己的姐姐，直到片刻前还一直受他们爱戴和敬重，居然平静地出卖了那个逃难的朋友！偏偏他们又不能把心里的话说出来，否则就得交代自己做过的事也不怎么坦白。那真是可怕的一刻。
        - id: ch01-b53
          speaker: police
          text: |-
            真的吗？这活儿可真叫人口渴。
        - id: ch01-b54
          speaker: narrator
          text: |-
            威廉进屋问了问，很快有人送来一托盘玻璃杯和一壶清凉饮料。警察和威廉一杯接一杯地喝，两个人看起来都比刚才舒服了。园丁却已经退出搜寻。他说，现在早已过了自己的午饭时间，而且过得太久，实在不能继续等下去。警察喝完，长长出了一口气，又用手背抹抹嘴。
        - id: ch01-b55
          speaker: police
          text: |-
            好了，小姐，你带路。
        - id: ch01-b56
          speaker: narrator
          text: |-
            卡罗琳走在前面，其他人跟在后头。查尔斯和夏洛特几乎不忍跟去，却更加不能忍受被独自留下，只得带着一肚子无可奈何的怒火往前走。大家穿过阳光灼热的草地，走进树林。那里虽有树荫，却还是闷热。苍蝇多得远远超过任何正当用途所需要的数目。卡罗琳始终小心避开他们的眼睛，径直来到藏过鲁珀特的蕨草窝。
        - id: ch01-b57
          speaker: police
          text: |-
            嘿，这才有点名堂。
        - id: ch01-b58
          speaker: narrator
          text: |-
            那个蕨草窝清清楚楚地留在那里，谁都能一眼看出，叶子下面曾经藏过一个人。它不是天然凹地，也不像动物睡过的地方。它的确是个藏人的窝，除此以外什么都不可能是。可现在，里面已经空空如也。
        - id: ch01-b59
          speaker: police
          text: |-
            这回快追上他了。小小姐，你说脚印在哪里？
        - id: ch01-b60
          speaker: caroline
          text: |-
            还要往前。我把手帕系在树上，给那里做了记号。
        - id: ch01-b61
          speaker: police
          text: |-
            真想不到！你应该加入警队。就连警察，也不是人人能想出这个办法。
        - id: ch01-b62
          speaker: narrator
          text: |-
            我相信这句话倒是真的。卡罗琳和警察走在前头，夏洛特和查尔斯愁眉苦脸地跟着。他们费力挤过一丛丛灌木。前面的人刚推开枝条，枝条就在身后弹回来，仿佛存心要抽他们的脸。两个孩子什么也不能说，只能交换一个意味深长的眼神。
        - id: ch01-b63
          speaker: narrator
          text: |-
            整支队伍弄出好大声响。他们碰着鲜绿的叶子，也踩着地上的枯叶，到处都是一片沙沙声。脚下的细枝一根接一根啪嚓折断。众人又推又挤，穿过榛树、甜栗树和一棵棵小橡树，四周的枝杈一路彼此刮擦，发出刺耳的声音。
        - id: ch01-b64
          speaker: william
          text: |-
            你们当猎场看守最合适。偷猎的人绝对听不见你们过来。
        - id: ch01-b65
          speaker: police
          text: |-
            树上那条是你的手帕吗，小姐？你能认出来吗？
        - id: ch01-b66
          speaker: caroline
          text: |-
            是。还有那里……
        - id: ch01-b67
          speaker: narrator
          text: |-
            她指着地面。那里有一串很深、很清楚的脚印。它们不大，却不像女孩的脚印那么小，毫无疑问属于一个男孩。
        - id: ch01-b68
          speaker: police
          text: |-
            这回可逮住他了。
        - id: ch01-b69
          speaker: narrator
          text: |-
            这已经是他当天上午大约第十五次这么说。接着，他像一条老练的侦探猎犬，循着脚印追去。威廉在旁边说，这个季节还能踩出这么深的脚印，真稀奇，可谁也没有理会。园丁的帮工却玩得很开心，故意一步一步把自己的脚印踩在他们追踪的印迹旁边，直到警察出言喝止他。
        - id: ch01-b70
          speaker: police
          text: |-
            那些脚印是证据。别挨得那么近踩。
        - id: ch01-b71
          speaker: narrator
          text: |-
            警察领着大家继续追踪。脚印一路走下一片陡坡，坡底狭窄得像一道小峡谷。众人也跟着深一脚、浅一脚地下去。到了峡谷尽头，那串印迹停在一堵高高的橡木栅栏前，再也看不见了。
        - id: ch01-b72
          speaker: police
          text: |-
            他一定是从这里逃出去的。
        - id: ch01-b73
          speaker: william
          text: |-
            我敢拿礼拜天穿的衬衫打赌，他绝对没有。
        - id: ch01-b74
          speaker: caroline
          text: |-
            这里还有一个脚印。
        - id: ch01-b75
          speaker: police
          text: |-
            果真有。小姐，你帮了大忙，我会在报告里写上你的名字。
        - id: ch01-b76
          speaker: narrator
          text: |-
            大家这才看清，另一串脚印正沿着栅栏向前，一直通到一块松动的栅板。警察认定鲁珀特就是从那里钻出去的。威廉说，要是大家想跟过去，他很容易再撬松一块。动手时，他分明朝卡罗琳眨了眨眼。夏洛特看得清清楚楚，只觉得人人都这么可恨。哦，可怜的鲁珀特！
        - id: ch01-b77
          speaker: narrator
          text: |-
            众人一个接一个钻出栅栏。查尔斯和夏洛特有些迟疑，先朝路的两头张望，唯恐看见鲁珀特那个默德斯通式的主人。警察焦急地问自己，也问大家，接下来该往哪边走。答案很快就有了。十码外路中央躺着一件发白的东西，像是在招呼他们往右边去。他僵硬地弯腰捡起那条手帕，仔细查看四角。
        - id: ch01-b78
          speaker: police
          text: |-
            鲁珀特·威克斯。现在我要吹哨，通知他的主人，我们找到了逃跑男孩的手帕。
        - id: ch01-b79
          speaker: narrator
          text: |-
            警察一面说，一面又把哨子送到嘴边。就在他准备吹响的一刻，卡罗琳赶紧伸出一只手，按住了他的胳膊。那只哨子就这样停在了他的唇边，没能发出声音。
        - id: ch01-b80
          speaker: caroline
          text: |-
            前面是不是还有一件白东西？
        - id: ch01-b81
          speaker: william
          text: |-
            可别说他有两条手帕。从来没有哪个男孩能同时有两条。
        - id: ch01-b82
          speaker: police
          text: |-
            我什么也没看见。
        - id: ch01-b83
          speaker: narrator
          text: |-
            可警察还是顺着卡罗琳的目光朝那边走了。威廉夸她长着一双了不起的眼睛，说其他人谁也没瞧见。查尔斯和夏洛特则故意离姐姐远远的，明明白白地另走一边。路中央果然有件白东西。那是一张用石头压着的纸，上面写着铅笔字。字迹又黑又粗，显然那支铅笔的尖头早已风光不再，写字的人只好用舌头给它鼓劲。
        - id: ch01-b84
          speaker: police
          text: |-
            上面写着：“烦请好心过路人，把里面的东西替我投进邮筒。”
        - id: ch01-b85
          speaker: narrator
          text: |-
            写着这句话的纸，是从记事本撕下的一页，已经横着折好。里面另有一页，角上贴着邮票，看起来就像一张明信片。一面写的是地址，印度西姆拉“巢居”，威克斯先生及夫人收。翻到另一面，还有几行给父母的话。警察把它们也高声念了出来。
        - id: ch01-b86
          speaker: police
          text: |-
            亲爱的爸爸妈妈，麦克弗森虐待我，所以我要逃到海上去。到了第一个港口，我会写信。我想在黑斯廷斯找条船。你们亲爱的儿子，鲁珀特。
        - id: ch01-b87
          speaker: police
          text: |-
            嘿，这可不得了！幸亏让我们看见了。
        - id: ch01-b88
          speaker: william
          text: |-
            可不是吗？这儿又正好是去黑斯廷斯的路。您马上动身，准能追上。
        - id: ch01-b89
          speaker: police
          text: |-
            我现在照例吹哨，通知男孩的监护人。
        - id: ch01-b90
          speaker: caroline
          text: |-
            要是再也帮不上忙了，我们能回去吃饭吗？这种天气，饭菜恐怕会凉得厉害。
        - id: ch01-b91
          speaker: william
          text: |-
            从缺口回去最好。不过那儿也该修了。你绕道门房，告诉彼得斯找人修好。
        - id: ch01-b92
          speaker: police
          text: |-
            不必再留你们。谢谢各位帮忙，我会写进报告。祝你们早安。
        - id: ch01-b93
          speaker: narrator
          text: |-
            他说不必再耽搁孩子们，又郑重谢过他们相助，还保证会把这份功劳写进报告。随后，他终于吹响了那只三番两次要吹的哨子。孩子们不敢停留，赶快从松开的栅栏缺口钻了回去。一过去，查尔斯和夏洛特就拒绝看卡罗琳的眼睛，用这种方式表明自己的态度。卡罗琳却像是丝毫没有察觉。
        - id: ch01-b94
          speaker: caroline
          text: |-
            我知道偷听不对。可是当侦探的时候，规矩不一样。我想……
        - id: ch01-b95
          speaker: william
          text: |-
            小姐，顺着栅栏溜过去吧。俗话说，情场战场，不择手段。
        - id: ch01-b96
          speaker: narrator
          text: |-
            卡罗琳顺着栅栏溜过去，另外两个虽然还在生她的气，却实在忍不住，也悄悄跟上。威廉同样去了。几个人藏在栅栏后面等着。没多久，大路上传来麦克弗森的靴声。接着响起警察的声音，正在详细说明自己如何聪明地发现脚印、手帕和信，好像那些全是他的功劳。最后，他还叫麦克弗森亲自读读那封信。短短一阵读信的沉默过后，那个默德斯通式的男人怒气冲冲地开了口。
        - id: ch01-b97
          speaker: macpherson
          text: |-
            岂有此理！竟把这种信丢在大路上，让陌生人随便看！岂有此理！里面一个字都不是真的。
          emotion: angry
        - id: ch01-b98
          speaker: police
          text: |-
            这话您可以告诉治安法官。对不起，先生，我是说，我想自己已经替您解决了这个小麻烦。
        - id: ch01-b99
          speaker: macpherson
          text: |-
            村里应该能雇到一辆马车吧？
        - id: ch01-b100
          speaker: police
          text: |-
            能，先生。去“绿龙”客栈。
        - id: ch01-b101
          speaker: macpherson
          text: |-
            好。再会！
        - id: ch01-b102
          speaker: narrator
          text: |-
            麦克弗森干脆利落地说完，转身快步走远，根本没再理会那个帮了他一上午的人。他把警察原地撂下。用法国人的说法，他把警察种在那里了。警察愣在路上，眼睁睁看着他离开。沉默了一会儿，他认定周围根本没人，终于把憋在心里的不满全都大声说了出来。
        - id: ch01-b103
          speaker: police
          text: |-
            好家伙！连两个便士的酒钱都不给，好让我喝一杯，祝他那该死的身体安康。这个吝啬鬼！以后他自己找男孩去吧。我倒真希望那小家伙逃得掉。
          emotion: angry
        - id: ch01-b104
          speaker: william
          text: |-
            我也一样。
        - id: ch01-b105
          speaker: narrator
          text: |-
            威廉躲在灰色橡木栅栏后面，悄悄说自己也这样希望。警察没有听见，迈着沉重的步子走远了。等靴声消失，威廉才叫孩子们回去吃饭。于是四个人谁也没有说话，默默穿过开阔的园地，一直走回彩色玻璃侧门。快要分别时，威廉才又对卡罗琳开口。
        - id: ch01-b106
          speaker: william
          text: |-
            卡罗琳小姐，您真是件绝妙的杰作。我非得这么说。
        - id: ch01-b107
          speaker: caroline
          text: |-
            谢谢。
        - id: ch01-b108
          speaker: narrator
          text: |-
            查尔斯和夏洛特后来都承认，当时有千言万语堵在喉咙里，几乎叫他们透不过气来。可是威廉还在旁边，他们什么也不能对卡罗琳说。两个孩子只好深深吸气，胸口搅着各种情绪，鼻子里几乎哼出了声。等威廉终于转身离开，卡罗琳急着解释，查尔斯却抢先打断她。
        - id: ch01-b109
          speaker: charles
          text: |-
            我们不打算跟你说话。
        - id: ch01-b110
          speaker: narrator
          text: |-
            威尔明顿太太偏在这时出现在门口，于是谁也不能再说真正要紧的话。她护送两个女孩回房，还是那副高人一等的淑女派头，却又对失踪男孩的事好奇得很。夏洛特简略讲了一遍，卡罗琳则把滚烫的脸埋进一大盆冷水，像海豚一样往外喷气。后来大家去吃午饭。威尔明顿太太从头坐到尾，只为了多听几件详情。饭一吃完，卡罗琳就不见了。
        - id: ch01-b111
          speaker: charlotte
          text: |-
            我猜她躲起来哭了。真希望刚才没那样对她。可我们约好了，叛徒后悔以前都不理她。你在树林里也这么说过。
          emotion: sad
        - id: ch01-b112
          speaker: charles
          text: |-
            整件事都糟透了。要是什么也没发生就好了，现在全乱了。
          emotion: sad
        - id: ch01-b113
          speaker: charlotte
          text: |-
            咱们现在就原谅她吧。她大概以为自己做得对，像什么斯巴达男孩似的。卡罗有时就会这样犯傻。咱们找到她，告诉她不生气了，再舒舒服服地把事情谈开。
        - id: ch01-b114
          speaker: charles
          text: |-
            我没意见。你愿意的话，咱们就去找她。
        - id: ch01-b115
          speaker: narrator
          text: |-
            两个人就这样决定去找姐姐，原谅她，再让三个孩子舒舒服服地坐在一起，把这件扰乱了一切的事从头到尾好好说清楚。他们满以为卡罗琳就在附近，很快便能找到。可是他们找遍了能想到的地方，也没能找到她。
