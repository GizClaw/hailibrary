        pitch: medium-high
  chapters:
    - id: ch01
      title: Being Detectives
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Suppose you are Jack Delamere, the Boy Detective. You uncover every secret by disguising yourself as a French count, a young provincial lady, or a Lincolnshire laborer with a cold. Your own family never recognizes you. Neither do the coiners and smugglers who know your ordinary face so well. You can even change your voice until old school friends take you for an Italian organ-grinder or a performing bear.
        - id: ch01-b02
          speaker: narrator
          text: I am sorry. That sentence is too much for me, so I give it up. What I meant was simple. Detectives, and people who hide from detectives, may find it easy to act innocent when they are guilty, or ignorant when they know everything. But if you have never acted a part in a real, serious adventure, the work is very hard. Charles and Caroline were discovering that now.
        - id: ch01-b03
          speaker: narrator
          text: Charlotte had arranged for them to help the police search for Rupert. The other two had praised her clever plan, and all three set off toward the side door, where the policeman was still talking to Mrs. Wilmington. Somehow their feet slowed more and more. Halfway to the house, Caroline stopped.
        - id: ch01-b04
          speaker: caroline
          text: I don't think I can do it. I don't know how. I'll do something foolish and give everything away. I'll say I'm too tired.
        - id: ch01-b05
          speaker: charlotte
          text: You are too bad! I make all the plans, and then you lose your nerve.
          emotion: angry
        - id: ch01-b06
          speaker: caroline
          text: I haven't lost my nerve. Don't be cross. I'm only saying I'm not clever enough for this. I'm not as clever as you, that's all.
        - id: ch01-b07
          speaker: narrator
          text: Caroline spoke humbly because she dreaded pretending to hunt for Rupert while knowing exactly where he was. Charlotte's only answer was, “Rats!” Then she asked whether Charles meant to give up too. She did not expect him to say yes, but he surprised her.
        - id: ch01-b08
          speaker: charles
          text: I'd rather not do it either, if you don't mind.
        - id: ch01-b09
          speaker: narrator
          text: Charlotte stamped her foot.
        - id: ch01-b10
          speaker: charlotte
          text: Fine! But please keep walking. They'll think something is wrong.
        - id: ch01-b11
          speaker: narrator
          text: They went on. Then Caroline suddenly changed her mind.
        - id: ch01-b12
          speaker: caroline
          text: Listen, I will pretend to help. I was only terribly afraid they might find him. If I disappear, you'll know it's because I feel too silly to bear it. You help as well, Charles. Just don't try too hard. If I were you, I'd say very little except to ask questions.
        - id: ch01-b13
          speaker: charlotte
          text: Right you are!
        - id: ch01-b14
          speaker: charles
          text: All right. But if I give it away by accident, you mustn't blame me.
        - id: ch01-b15
          speaker: narrator
          text: They reached the side door with its many-colored glass. Mrs. Wilmington stood there with a handkerchief over her head. William, the gardener, the gardener's boy, and a tall, stout young policeman with fat red hands were there too.
        - id: ch01-b16
          speaker: mrs_wilmington
          text: I cannot and will not disturb the Master. His orders are that no one is to interrupt him in the morning for any reason, not even if the house were on fire. I could not face him with this vulgar tale of runaway boys. I give you permission to search. I am quite competent to decide that for myself. Quite.
        - id: ch01-b17
          speaker: narrator
          text: The policeman turned to the children. Everyone but Charlotte wished him good morning. She had already done it once.
        - id: ch01-b18
          speaker: constable_poad
          text: Good morning to you. So the young ladies and gentleman are joining the search party, are they?
        - id: ch01-b19
          speaker: caroline
          text: Yes, please. What will you do to Rupert if you catch him?
        - id: ch01-b20
          speaker: narrator
          text: The policeman winked at William.
        - id: ch01-b21
          speaker: constable_poad
          text: Send him to jail, of course. And all of you will help the law do its duty. You'll be useful, knowing the grounds and all. Now we'll play a little make-believe game. Pretend this runaway boy is your friend, and the two of you planned a game of hide-and-seek. He's hiding. Where would you look first?
        - id: ch01-b22
          speaker: narrator
          text: A cold shiver ran down all three backs when he called Rupert their friend. For one moment they thought he had discovered everything.
        - id: ch01-b23
          speaker: charles
          text: I don't know.
        - id: ch01-b24
          speaker: charlotte
          text: Oh, anywhere, I suppose.
        - id: ch01-b25
          speaker: caroline
          text: I would look in that wood over there.
        - id: ch01-b26
          speaker: narrator
          text: She pointed straight toward the spot where Rupert lay under the ferns and leaves.
        - id: ch01-b27
          speaker: constable_poad
          text: Good. There's a place to begin. Off we go.
        - id: ch01-b28
          speaker: narrator
          text: Charlotte dared not look at her sister. Her face might show exactly what she thought of such treachery. Charles put his hands into his pockets to look unconcerned, but decided that whistling would be too much. He had never imagined Caro could do such a thing.
        - id: ch01-b29
          speaker: caroline
          text: That is where I'd look if we really were playing hide-and-seek. But we've been in that wood all morning. He couldn't have gone in without us hearing him. Have you searched the other wood beyond the garden? Or the thatched summerhouse? What about the empty lodge beside the other gates?
        - id: ch01-b30
          speaker: constable_poad
          text: The old lodge. That sounds very likely. Young gentleman, you lead us there.
        - id: ch01-b31
          speaker: narrator
          text: As the party started, Charlotte silently cheered Caroline. The policeman announced that he would organize his search party properly later. Then he saw Caroline bending over her foot.
        - id: ch01-b32
          speaker: constable_poad
          text: Aren't you coming, miss?
        - id: ch01-b33
          speaker: caroline
          text: I can't. There's a stone in my shoe, and it hurts.
        - id: ch01-b34
          speaker: narrator
          text: She stood firmly on the painful foot, then went indoors while the others made their way through the woods toward the empty lodge.
        - id: ch01-b35
          speaker: narrator
          text: The search party wound through the woods and came at last to the empty lodge. Its diamond-paned windows were dusty, and its door hung from one broken hinge. Little hard balls of black moss dotted the stones in the yard. The loose thatch looked like the ruffled feathers of an old stuffed bird. No one had worked in the garden for so long that it was no longer merely a patch of earth full of weeds. Grass, ferns, brambles, and young oaks had covered it completely. It had become a fenced-off piece of the wood beyond.
        - id: ch01-b36
          speaker: constable_poad
          text: Stop here! This is just the place. I'll wager we've cornered the young gentleman at last.
        - id: ch01-b37
          speaker: narrator
          text: They had not cornered anyone. The only things downstairs were an old hamper with a hole in it, some scattered straw and damp paper, and a heap of cold ashes in the grate. Upstairs they found two birds' nests left from the year before and a chair with three legs and half a back. Constable Poad lowered his helmeted head beneath the short doorframe and stepped back into the sunlight looking thoroughly disappointed.
        - id: ch01-b38
          speaker: constable_poad
          text: I thought we had him that time.
        - id: ch01-b39
          speaker: narrator
          text: He said the same thing at the thatched summerhouse, in the larch wood, and everywhere else they searched without finding Rupert. At last they fought through a thick patch of brambles and came around behind the empty lodge again.
        - id: ch01-b40
          speaker: charles
          text: Isn't it nearly time for dinner?
        - id: ch01-b41
          speaker: constable_poad
          text: Your kind governess has moved dinner back an hour so you can help us search.
        - id: ch01-b42
          speaker: william
          text: Better try the other side, Mr. Poad. There's nothing here.
        - id: ch01-b43
          speaker: constable_poad
          text: I shall whistle for the gentleman who owns the runaway and report to him now.
        - id: ch01-b44
          speaker: narrator
          text: He whistled, and the sound seemed sudden and terrible. Charlotte immediately pictured Mr. Macpherson, who seemed able to see everything with half an eye, spotting Rupert and carrying him away in half a minute. Charles was busy wondering what the law did to people who helped runaway boys.
        - id: ch01-b45
          speaker: charlotte
          text: Where is he?
        - id: ch01-b46
          speaker: constable_poad
          text: Up the road with Mr. Binskin from the Peal of Bells. He's keeping watch, so I'd better tell him how we're doing.
        - id: ch01-b47
          speaker: charles
          text: Will he come searching with us?
        - id: ch01-b48
          speaker: constable_poad
          text: I think he's best left where he is. I'll tell him to keep walking up and down outside. The inn's stableman is watching the other side too, unless he's had to return to work.
        - id: ch01-b49
          speaker: charlotte
          text: Let's look at those birds' nests again while we wait.
        - id: ch01-b50
          speaker: narrator
          text: Charlotte had enough presence of mind to suggest another look at the birds' nests while they waited. Through the lodge's little diamond panes, the children saw Mr. Macpherson again. He still wore evening clothes beneath his overcoat, and his crumpled tie had slipped beneath one ear. Charlotte said afterward that his face looked exactly like the face of an executioner who had somehow been defeated.
        - id: ch01-b51
          speaker: narrator
          text: He stood talking with the constable for a few moments, wearing the same familiar scowl the children remembered, although they had met him only once before. Then he went back through the gate. The children waited until they were quite sure he had gone before they joined the constable again. By now they were tired. This foolish game of searching for someone they knew, or at least hoped, they would not find seemed to have lasted forever, with no sign that it would ever stop.
        - id: ch01-b52
          speaker: constable_poad
          text: I kept that gentleman outside because he has a hot temper. We're searching the glasshouses next. If he saw his boy in there, he might spring through the glass like a fox after a duck and do no end of damage.
        - id: ch01-b53
          speaker: narrator
          text: Rupert was not found anywhere among the glasshouses. The search party had begun briskly, but it moved much more slowly when it returned to the door with the colored glass. Caroline met them on the doorstep. She was out of breath and very hot, and she carried her sunbonnet dangling by its strings. Aunt Emmeline believed strongly in sunbonnets and made dozens of them as presents for all her friends.
        - id: ch01-b54
          speaker: caroline
          text: Well?
        - id: ch01-b55
          speaker: constable_poad
          text: We haven't found him, miss, if that's what you mean. You haven't seen anything, I suppose?
        - id: ch01-b56
          speaker: narrator
          text: Caroline glanced nervously at the others. Then she spoke in a stiff voice without looking at them.
        - id: ch01-b57
          speaker: caroline
          text: I heard something in that wood. I went back because I'd left something there. There was a rustling sound, and I found tracks in the muddy part. They looked like a boy's boots.
        - id: ch01-b58
          speaker: narrator
          text: Charlotte said afterward that she truly thought she would burst into little pieces, and Charles said the same. Their own older sister, whom they had loved and respected until that moment, was quietly betraying the boy who had trusted them. Yet they could not tell her what they thought without explaining why all three of them had been hiding the truth. They had to stand there in silence. It was a terrible moment.
        - id: ch01-b59
          speaker: constable_poad
          text: You don't say! Searching is thirsty work, William.
        - id: ch01-b60
          speaker: narrator
          text: The constable turned casually to William and mentioned that searching was thirsty work. William went inside, and soon a tray appeared with glasses and a jug of something cool. He and the constable both seemed much better after drinking. The gardener had already left. He said it was far too late on the wrong side of dinner-time for him. Constable Poad drew a long breath and wiped his mouth with the back of his hand.
        - id: ch01-b61
          speaker: constable_poad
          text: All right, miss. Show us the way.
        - id: ch01-b62
          speaker: narrator
          text: Caroline led, and the others followed. Charles and Charlotte could hardly bear to go with her, but they could bear being left behind even less. The party crossed the hot, sunny grass and entered the wood. Even beneath the trees it was hot, and there seemed to be more flies than could possibly serve any useful purpose. Caroline carefully avoided the others' eyes. She took them straight to the bed of ferns where they had left Rupert, while Charles and Charlotte followed in helpless fury.
        - id: ch01-b63
          speaker: constable_poad
          text: Hello! Now this looks promising.
        - id: ch01-b64
          speaker: narrator
          text: The hiding place was easy to see. It could not be mistaken for anything but a bed someone had made among the ferns. Yet whoever had lain there was gone, and the leafy hollow was completely empty.
        - id: ch01-b65
          speaker: constable_poad
          text: We're on his trail now. Which way were those footprints, miss?
        - id: ch01-b66
          speaker: caroline
          text: Farther on. I tied my handkerchief to a tree so I could mark the spot.
        - id: ch01-b67
          speaker: constable_poad
          text: Did you really? You ought to join the police, miss. Even some constables wouldn't have thought of that.
        - id: ch01-b68
          speaker: narrator
          text: And I believe the constable spoke the truth. Caroline and the constable pushed ahead while Charles and Charlotte followed miserably, exchanging looks full of meaning. The bushes sprang back after the people in front passed and seemed to strike the children in the face. The whole party made a great deal of noise. Green leaves and dead ones rustled, twigs snapped under their feet, and branches grated against one another as they forced their way through hazels, sweet chestnuts, and young oaks.
        - id: ch01-b69
          speaker: william
          text: You'd make fine gamekeepers. No poacher would ever hear you coming.
        - id: ch01-b70
          speaker: constable_poad
          text: Is that your handkerchief on the dogwood, miss? Can you identify it?
        - id: ch01-b71
          speaker: caroline
          text: Yes. And look down there.
        - id: ch01-b72
          speaker: narrator
          text: Deep footprints showed clearly in the soft ground where Caroline pointed. They were not especially large, but they were not the small prints of a girl's boots either. Anyone looking at them would have said the same thing. Beyond any possible doubt, they were the footprints of a boy.
        - id: ch01-b73
          speaker: constable_poad
          text: Now we've got him.
        - id: ch01-b74
          speaker: narrator
          text: This was about the fifteenth time he had said it that morning. He bent over the marks and followed them like an old hunting dog with a scent. William observed that footprints so deep were remarkable at that time of year, but nobody paid him any attention. The gardener's boy amused himself by planting his own steps right beside the trail they were following. He kept at it until the constable noticed what he was doing.
        - id: ch01-b75
          speaker: constable_poad
          text: Those tracks are evidence. Keep your feet away from them.
        - id: ch01-b76
          speaker: narrator
          text: The trail ran down a steep little gorge and stopped at the tall oak fence.
        - id: ch01-b77
          speaker: constable_poad
          text: He must have escaped over here.
        - id: ch01-b78
          speaker: william
          text: I'll wager my Sunday hat he didn't.
        - id: ch01-b79
          speaker: caroline
          text: There's another footprint here.
        - id: ch01-b80
          speaker: constable_poad
          text: So there is. You've been a great help, miss. I'll name you in my report.
        - id: ch01-b81
          speaker: narrator
          text: Then everyone noticed that the trail had not truly ended. Another line of footprints ran beside the tall fence until it reached a place where one of the wooden palings had come loose.
        - id: ch01-b82
          speaker: constable_poad
          text: You can depend on it. This is where he squeezed through.
        - id: ch01-b83
          speaker: william
          text: I can loosen another paling so we can follow him.
        - id: ch01-b84
          speaker: narrator
          text: As William pulled at the wood, Charlotte saw him wink at Caroline. It was a distinct, unmistakable wink. She thought everybody had become hateful and could only pity poor Rupert. When the opening was wide enough, the whole party climbed through the fence. Charles and Charlotte went reluctantly. Before stepping into the road, they looked carefully in both directions to make sure Mr. Macpherson was nowhere in sight.
        - id: ch01-b85
          speaker: constable_poad
          text: Which way did he go?
        - id: ch01-b86
          speaker: narrator
          text: The question was quickly answered. A whitish object lay in the middle of the road about ten yards to their right, almost as if it were beckoning them that way. The constable walked over, bent down rather stiffly, picked it up, and carefully examined its corners.
        - id: ch01-b87
          speaker: constable_poad
          text: Rupert Wix. I shall whistle and tell the boy's guardian that we've found the runaway's handkerchief.
        - id: ch01-b88
          speaker: narrator
          text: Caroline put her hand on his arm and stopped him just as he was raising the whistle to his lips.
        - id: ch01-b89
          speaker: caroline
          text: Isn't there something else white farther down the road?
        - id: ch01-b90
          speaker: william
          text: Don't say he owns two handkerchiefs. No boy ever had two at once.
        - id: ch01-b91
          speaker: constable_poad
          text: I can't see anything.
        - id: ch01-b92
          speaker: narrator
          text: Even so, he walked where Caroline was looking.
        - id: ch01-b93
          speaker: william
          text: You've got remarkable eyes, miss. None of us spotted it.
        - id: ch01-b94
          speaker: narrator
          text: Charles and Charlotte made a point of walking apart from Caroline. There really was something white in the road. It was a sheet of paper held down by a stone, with writing on it. The letters were thick, black, and blunt, the kind of marks a pencil makes after its point has worn down and its owner keeps encouraging it by licking the end.
        - id: ch01-b95
          speaker: constable_poad
          text: To any kind passerby, please put the letter inside into the post for me.
        - id: ch01-b96
          speaker: narrator
          text: The outside message was written on a notebook page that had been torn out and folded across. Inside was a second page with a stamp in the corner, so it looked like a homemade postcard. One side carried an address for Mr. and Mrs. Wix at The Nest in Simla, India. On the other side was a letter, and Constable Poad read every word aloud.
        - id: ch01-b97
          speaker: constable_poad
          text: Dear Parents, I am running away to sea because Macpherson treats me so badly. I will write from the first port. I expect to find a ship at Hastings. Your affectionate son, Rupert.
        - id: ch01-b98
          speaker: constable_poad
          text: Well! That beats everything. We're lucky we found it.
        - id: ch01-b99
          speaker: william
          text: Aren't we just? And this is the Hastings road. If you leave now, you should catch him easily.
        - id: ch01-b100
          speaker: constable_poad
          text: I shall whistle and inform the boy's guardian of our discovery.
        - id: ch01-b101
          speaker: caroline
          text: If you don't need us anymore, may we go back to dinner? It must be getting terribly cold by now.
        - id: ch01-b102
          speaker: william
          text: Go back through the gap. It needs mending, though. Boy, go around by the lodge and tell Peters to see to it.
        - id: ch01-b103
          speaker: constable_poad
          text: I need not keep you. Thank you for your help. It will go into my report. Good morning.
        - id: ch01-b104
          speaker: narrator
          text: He blew his whistle, and the children hurried back through the opening in the fence. Once they were safely on the other side, Charles and Charlotte firmly refused to meet Caroline's eyes. She did not seem to notice how pointedly they were ignoring her.
        - id: ch01-b105
          speaker: caroline
          text: I know it's wrong to listen, but detective games have different rules, and I'd like to—
        - id: ch01-b106
          speaker: william
          text: Move quietly along the fence, miss. All's fair in love and war, as they say.
        - id: ch01-b107
          speaker: narrator
          text: Caroline slipped quietly along beside the wooden paling. Charles and Charlotte could not help following her, and William went with them. Soon they heard Mr. Macpherson's boots striking the road. Then came Constable Poad's voice. He was explaining how cleverly he had discovered the footprints, the handkerchief, and the letter, as though he had done it all by himself. At last he told Mr. Macpherson that he had better read the letter.
        - id: ch01-b108
          speaker: narrator
          text: After a short silence, Mr. Macpherson burst out in anger.
        - id: ch01-b109
          speaker: reverend_macpherson
          text: Monstrous! He left this in a public road for any stranger to read. Monstrous! Not one word of it is true.
          emotion: angry
        - id: ch01-b110
          speaker: constable_poad
          text: You can tell that to the magistrate. Beg pardon, sir. I mean, I believe I've solved this little difficulty for you.
        - id: ch01-b111
          speaker: reverend_macpherson
          text: Can I hire a carriage in the village?
        - id: ch01-b112
          speaker: constable_poad
          text: At the Green Dragon, sir.
        - id: ch01-b113
          speaker: reverend_macpherson
          text: Good. Good morning.
        - id: ch01-b114
          speaker: narrator
          text: Mr. Macpherson turned at once and walked rapidly away. He left Constable Poad planted in the road, as they say in France. The constable believed he was completely alone. After one silent moment, he spoke aloud to the empty air.
        - id: ch01-b115
          speaker: constable_poad
          text: Well, I'm done for! He didn't leave me so much as two pennies to drink to his rotten health. Miserly brute! He can hunt for his own boys after this. I hope the youngster gets away.
        - id: ch01-b116
          speaker: william
          text: So do I.
        - id: ch01-b117
          speaker: narrator
          text: William whispered his agreement from his hiding place behind the gray oak fence. Constable Poad never knew that anyone had heard him. He walked heavily away along the road, disappointed with Mr. Macpherson and finished with the search.
        - id: ch01-b118
          speaker: william
          text: Best go in to dinner.
        - id: ch01-b119
          speaker: narrator
          text: William decided it was best to go in to dinner. He and the three children crossed the park together without speaking. No one broke the silence until they reached the side door, where William turned to Caroline.
        - id: ch01-b120
          speaker: william
          text: You're a real masterpiece, Miss Caroline. I'll say that for you.
        - id: ch01-b121
          speaker: caroline
          text: Thank you.
        - id: ch01-b122
          speaker: narrator
          text: Charles and Charlotte admitted later that they were nearly choking on all the things they wanted to say to Caroline. They could not say any of them while William was there. They took long breaths and almost snorted because so many different feelings were crowded inside them. The moment William turned away, Caroline eagerly tried to speak.
        - id: ch01-b123
          speaker: caroline
          text: Listen—
        - id: ch01-b124
          speaker: charles
          text: We aren't speaking to you.
          emotion: angry
        - id: ch01-b125
          speaker: narrator
          text: Just then Mrs. Wilmington appeared in the doorway, so no one could say anything more, or at least nothing that mattered. She escorted the girls upstairs to their room. In her superior, ladylike manner, she showed that she was curious about the missing boy. Charlotte told the story briefly. All the while, Caroline buried her hot face in a large basin of cold water and blew into it like a grampus.
        - id: ch01-b126
          speaker: narrator
          text: Then it was time for dinner, and Mrs. Wilmington stayed through the whole meal because she wanted to hear more details. When dinner was over, Caroline disappeared without telling the others where she was going.
        - id: ch01-b127
          speaker: charlotte
          text: I expect she's gone away to cry. I wish we hadn't treated her like that. But we agreed not to speak to a traitor until she was sorry. You said so in the wood.
        - id: ch01-b128
          speaker: charles
          text: The whole thing is beastly. I wish it hadn't happened and spoiled everything.
        - id: ch01-b129
          speaker: charlotte
          text: Let's forgive her now. Maybe she thought she was doing the right thing, like one of those Spartan boys. Caro can be silly that way. Let's find her, forgive her, and talk it all over together.
        - id: ch01-b130
          speaker: charles
          text: All right. Let's look for her.
        - id: ch01-b131
          speaker: narrator
          text: But they could not find Caroline.
