audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm, observant storytelling with a gently amused touch
        timbre: clear and rounded
        pace: measured
        pitch: medium
    caroline:
      display_name: Caroline
      tts:
        delivery: lively, affectionate, and increasingly careful when being polite
        timbre: bright and clear
        pace: medium
        pitch: medium-high
    charlotte:
      display_name: Charlotte
      tts:
        delivery: eager, curious, and quick with an idea
        timbre: light and energetic
        pace: brisk
        pitch: high
    charles:
      display_name: Charles
      tts:
        delivery: proud, teasing, and boyishly direct
        timbre: youthful and crisp
        pace: medium-fast
        pitch: medium-high
    miss_peckitt:
      display_name: Miss Peckitt
      tts:
        delivery: modest, formal, and slightly fluttered
        timbre: small and gentle
        pace: measured
        pitch: medium-high
    aunt_emmeline:
      display_name: Aunt Emmeline
      tts:
        delivery: composed, precise, and unfailingly mild
        timbre: soft and restrained
        pace: unhurried
        pitch: medium
  chapters:
    - id: ch01
      title: Caroline's Birthday Presents
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Caroline's birthday had brought her some very pleasant presents. Her younger sister Charlotte gave her a blue leather blotting book, or at least one that looked like leather, painted with pink and purple roses. Her brother Charles gave her a paint box that was as good as new.
        - id: ch01-b02
          speaker: charles
          text: I hardly used it at all. It's much nicer than anything I could have bought with my own money, and I cleaned every paint for you.
        - id: ch01-b03
          speaker: caroline
          text: It's lovely! And look at those beautiful brushes.
          emotion: happy
        - id: ch01-b04
          speaker: charles
          text: They're real fitch brushes. Their points are as sharp as needles.
        - id: ch01-b05
          speaker: narrator
          text: Charles was very proud of them. Caroline agreed as she put the brushes into her mouth one after another, then held each one toward the light to inspect its point.
        - id: ch01-b06
          speaker: narrator
          text: More presents had arrived from India. Their father sent a tin-lined case of carved chessmen. Their mother sent red and blue scarves and, best of all, a leopard skin.
        - id: ch01-b07
          speaker: aunt_emmeline
          text: They will put a little color into the playroom.
        - id: ch01-b08
          speaker: narrator
          text: That was what Mother had written in her letter, and the presents certainly did brighten the room. Aunt Emmeline gave Caroline a copy of Sesame and Lilies. People said it was good for girls, though it was rather difficult when you were only twelve. Uncle Percival gave her a gray leather pocketbook and an olive-wood paper knife with the word Sorrento on its handle. The cook and the housemaid had chosen their presents too. One gave her a needle book, and the other gave her a pincushion.
        - id: ch01-b09
          speaker: narrator
          text: Then Miss Peckitt arrived. She was the little dressmaker who came to the house whenever the girls needed new dresses made. Her present was a small, thin book bound in red. Its cover was covered in tiny hard raised dots that felt like pinheads beneath your fingers. She hoped Caroline would accept it.
        - id: ch01-b10
          speaker: miss_peckitt
          text: This book was mine when I was a child, Miss Caroline. My dear mother loved it too when she was young. Please take it, with my very best wishes.
        - id: ch01-b11
          speaker: narrator
          text: Caroline thanked her warmly and threw her arms around her. After the sudden kiss, Miss Peckitt had to straighten her collar.
        - id: ch01-b12
          speaker: miss_peckitt
          text: You're quite welcome. I wasn't expecting that kiss. Someone gave me a piece of southernwood this morning, and the book says southernwood means a surprise.
          emotion: surprised
        - id: ch01-b13
          speaker: narrator
          text: The book was called The Language of Flowers, so Miss Peckitt's southernwood had told the truth. And that little book began this story. Or perhaps another book began it. We shall come to that one later.
        - id: ch01-b14
          speaker: caroline
          text: It's splendid. I especially like the red cover.
          emotion: happy
        - id: ch01-b15
          speaker: narrator
          text: The last gifts were a huge bunch of marigolds and a halfpenny birthday card from the boy who cleaned the boots and knives. The card had a gold anchor and two pink hands clasped together.
    - id: ch02
      title: A House That Needed Color
      blocks:
        - id: ch02-b01
          speaker: charlotte
          text: Let's decorate our room for your birthday, Caro. We have loads of colored things, and I'll borrow Cook's Sunday scarf. It's pink and purple shot silk. It's perfect! I'll run and get it.
        - id: ch02-b02
          speaker: narrator
          text: Off she flew. When she came back, the children decorated their room.
        - id: ch02-b03
          speaker: narrator
          text: You may wonder why color mattered so much to them. Their house had so little of it that the place looked more like a black, white, and gray picture in a book than a home for real people. It was pale, tidy, and chilly. White straw matting covered the floors instead of warm, colored carpets. The stairs had pale gray coconut matting. The soft cotton curtains were a faint lavender. There was no rich damask anywhere and not one cheerful flower pattern.
        - id: ch02-b04
          speaker: narrator
          text: The walls had no wallpaper. They were painted in clean, pale shades, and the whole house felt rather like an especially fine private hospital. Every week the floors were washed with Sanitas, which left a pleasant woody smell. Even the pictures had no color. They were brown copies of great paintings by Raphael, Velazquez, and other famous artists.
        - id: ch02-b05
          speaker: narrator
          text: Caroline, Charlotte, and Charles Stanmore lived in that house because their father and mother were far away in India. Almost all their other relations were far away too, in New Zealand. The one exception was old Uncle Charles. He was their mother's uncle, and years before, he and the children's parents had quarreled. Or perhaps it would be fairer to say that the parents had quarreled with him. Nobody had explained which side began it.
        - id: ch02-b06
          speaker: narrator
          text: The house belonged to the Sandals, who were some sort of relations, perhaps cousins. The children called them Uncle Percival and Aunt Emmeline, though they were not truly their uncle and aunt. There was this much to be said for the pair. They were never cross and were rarely unfair. Their tempers seemed as pale and calm as the colors in their house. The children had meat every day for dinner, but Mr. and Miss Sandal ate nothing except vegetables, and people say vegetables have a calming effect.
        - id: ch02-b07
          speaker: narrator
          text: India, as pictures show, is full of strong color. The Stanmore children felt faded in the Sandals' gray house. That was why they made such a fuss over the leopard skin, the Indian needlework, the marigolds, the little red book, and the ring of golden forget-me-nots around the words The Language of Flowers.
        - id: ch02-b08
          speaker: charlotte
          text: Once Aunt Emmeline sees how beautiful this looks, she'll want scarves and leopard skins all over the house.
        - id: ch02-b09
          speaker: narrator
          text: Charlotte draped the pink scarf over a picture called Hope, which showed a blind girl sitting on an orange.
        - id: ch02-b10
          speaker: caroline
          text: I don't think she will. I once asked what old Uncle Charles's house was like, because Mother said it was beautiful. Aunt Emmeline said it had far too many things in it and wasn't properly aired.
        - id: ch02-b11
          speaker: charlotte
          text: I think it's a shame they quarreled with Uncle Charles. I wouldn't mind staying with him at all. I expect he really likes nice little girls. What was the whole quarrel about? Why didn't they kiss and make up before the sun went down, the way we're told to?
    - id: ch03
      title: Grown-Up Quarrels
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: I cannot tell you what that quarrel was about. I know no more than you do, or than Charlotte did. Grown-up quarrels are often enormous and mysterious.
        - id: ch03-b02
          speaker: narrator
          text: When you quarrel with a brother or sister, the reason is usually simple. Someone left the paintbrushes standing in water. Someone forgot The Water Babies in the hayfield. Perhaps somebody spilled gum over a brother's map, or stepped on the dollhouse sofa while everyone was scuffling and then put the furniture back in a hurry.
        - id: ch03-b03
          speaker: narrator
          text: Those quarrels soon end because quarreling is uncomfortable. Besides, you have probably been taught, just as Charlotte had, not to let the sun go down while you are still angry.
        - id: ch03-b04
          speaker: narrator
          text: Grown-ups can be different. Sometimes they seem to forget all about the setting sun. Their quarrels last for weeks, months, and years, until you would think they had forgotten what began the trouble. But they have not. When Aunt Jane comes to tea, you still hear little pieces about Uncle William's behavior and what a pity it was that Edward acted as he did.
        - id: ch03-b05
          speaker: narrator
          text: If the grown-ups notice you listening, they send you away to play. You never learn what caused the quarrel. If you did learn, you probably would not understand. And if you understood, you might think it was a great fuss over nothing. You might wonder how anyone kept it going for so many years. Uncle William may have behaved badly years and years ago, and Edward may have done his extraordinary deed long before you were born. The one thing you can usually discover is that these quarrels concern money, or somebody marrying a person the family did not want them to marry.
        - id: ch03-b06
          speaker: narrator
          text: Perhaps you have also noticed that when you suddenly mention a person, that person often appears almost at once. So after Charlotte wished the quarrel with Uncle Charles had never happened, you might expect him to walk straight up to the front door.
        - id: ch03-b07
          speaker: narrator
          text: He did not. But someone did walk up to the door. It was the postman.
    - id: ch04
      title: The Letter
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: Caroline dashed out to see whether any more birthday cards had come. The summer holidays had just begun, but perhaps some girls from the High School had remembered her birthday and sent something after all.
        - id: ch04-b02
          speaker: narrator
          text: Instead, she ran straight into Aunt Emmeline. The collision must have hurt her aunt, because Caroline's own head was sore afterward where it struck the mother-of-pearl buckle at Aunt Emmeline's waist.
        - id: ch04-b03
          speaker: aunt_emmeline
          text: Gently, my child. Gently.
          emotion: calm
        - id: ch04-b04
          speaker: narrator
          text: Caroline later said that was worse than a scolding. It made you feel as clumsy as an elephant. And there were no birthday cards for her. Every letter belonged to Miss Sandal.
        - id: ch04-b05
          speaker: narrator
          text: The children had just spread the leopard skin across the floor when Aunt Emmeline came to their doorway with one of those letters in her hand.
        - id: ch04-b06
          speaker: aunt_emmeline
          text: I have a surprise for you.
        - id: ch04-b07
          speaker: caroline
          text: Please come in and sit down.
        - id: ch04-b08
          speaker: narrator
          text: That was one of the nice things about Aunt Emmeline. She treated the children's room as if it really did belong to the children. Whenever she entered, she expected to be received as a visitor in someone else's room. She never simply chose a chair and sat. She always waited until one of the children invited her.
        - id: ch04-b09
          speaker: aunt_emmeline
          text: Thank you. Here is the surprise. You are going to the country for your holidays.
        - id: ch04-b10
          speaker: narrator
          text: Silence followed. At last Charles spoke.
        - id: ch04-b11
          speaker: charles
          text: Then we didn't need to go to all this trouble decorating the room.
        - id: ch04-b12
          speaker: aunt_emmeline
          text: Oh, is this decoration?
        - id: ch04-b13
          speaker: narrator
          text: She sounded as if pink scarves might climb onto picture frames by themselves, while leopard skins wandered onto floors and marigolds landed on mantelpieces through mere accident or untidiness.
        - id: ch04-b14
          speaker: aunt_emmeline
          text: I have known for some time that this might happen. The letter that just arrived settles everything. You are to leave the day after tomorrow.
        - id: ch04-b15
          speaker: caroline
          text: But where are we going?
        - id: ch04-b16
          speaker: aunt_emmeline
          text: Have you ever heard of your Great-Uncle Charles?
        - id: ch04-b17
          speaker: narrator
          text: Those were memorable and unusual words for Miss Sandal to say.
        - id: ch04-b18
          speaker: charles
          text: Do you mean the uncle everyone quarreled with?
        - id: ch04-b19
          speaker: aunt_emmeline
          text: I didn't know you knew about that. Yes. The quarrel is over now, and he has asked you to spend the holidays at the Manor House.
        - id: ch04-b20
          speaker: narrator
          text: A deeper silence fell. All three children wanted to shout, "Hooray!" but they did not think it would be polite.
    - id: ch05
      title: Going to the Manor House
      blocks:
        - id: ch05-b01
          speaker: aunt_emmeline
          text: I thought you would be pleased. People consider it a very beautiful house, and it stands in a park.
        - id: ch05-b02
          speaker: caroline
          text: Are you coming too, Aunt Emmeline?
        - id: ch05-b03
          speaker: aunt_emmeline
          text: No, dear. Only you children have been invited. You must be quiet and gentle. Please remember that your great-uncle is a quiet student and isn't accustomed to having children around. You will have a great deal of freedom, and I hope you use it wisely. You have never gone away on a visit before without somebody there to remind you of things, or to tell you what to do.
        - id: ch05-b04
          speaker: charlotte
          text: Oh, we'll manage, Aunt Emmie. But who will sew our buttons on and mend our stockings?
        - id: ch05-b05
          speaker: aunt_emmeline
          text: Naturally, there is a housekeeper. I will pack your clothes tomorrow. If you choose the toys you want to bring, I will pack those as well.
        - id: ch05-b06
          speaker: caroline
          text: Yes. Thank you, Aunt Emmeline.
        - id: ch05-b07
          speaker: narrator
          text: Caroline was still trying hard not to look too pleased.
        - id: ch05-b08
          speaker: charles
          text: I hope he likes us. He should, since we're all named after him. Could we pretend to have different names? Three Charleses are bad enough now. With Uncle Charles in the house too, it will be dreadful. Aunt Emmie, do we have to call him "Great"?
        - id: ch05-b09
          speaker: caroline
          text: He means Great-Uncle Charles. I suppose we should simply call him Uncle, shouldn't we?
        - id: ch05-b10
          speaker: charles
          text: He won't like being called plain.
        - id: ch05-b11
          speaker: caroline
          text: Don't be silly. He won't care what a little boy calls him.
        - id: ch05-b12
          speaker: narrator
          text: Caroline was still suffering under the need to be polite.
        - id: ch05-b13
          speaker: charles
          text: I bet he'd care if I called him the things you call me. You're silly yourself!
        - id: ch05-b14
          speaker: aunt_emmeline
          text: Children, children! I thought you would be so pleased.
        - id: ch05-b15
          speaker: caroline
          text: We are pleased. But won't you be rather lonely without us? That's why we don't look as happy as you expected.
        - id: ch05-b16
          speaker: narrator
          text: Miss Sandal smiled. The smile made her long face, the color of pale brown paper, look much prettier.
        - id: ch05-b17
          speaker: aunt_emmeline
          text: Thank you, Caroline. Uncle Percival and I are taking a holiday too. We are going to Switzerland, the Italian Lakes, and Venice. You may be as happy as you please without worrying about us.
        - id: ch05-b18
          speaker: narrator
          text: At that moment, the three children felt that politeness and honesty could finally come together.
        - id: ch05-b19
          speakers: [caroline, charlotte, charles]
          ensemble: chorus
          text: Hooray!
          emotion: happy
