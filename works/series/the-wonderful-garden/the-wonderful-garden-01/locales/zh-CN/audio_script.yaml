audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 温暖机敏，带着克制的幽默讲述
        timbre: 清澈柔和
        pace: 从容而富有变化
        pitch: 中音
    caroline:
      display_name: 卡罗琳
      tts:
        delivery: 大方热情，努力摆出长姐的懂事
        timbre: 明亮清脆
        pace: 自然轻快
        pitch: 中高音
    charlotte:
      display_name: 夏洛特
      tts:
        delivery: 活泼直率，想到什么便说什么
        timbre: 轻盈清亮
        pace: 偏快
        pitch: 高音
    charles:
      display_name: 查尔斯
      tts:
        delivery: 淘气认真，笑话总说得一本正经
        timbre: 清亮的男孩声
        pace: 轻快
        pitch: 中高音
    mother:
      display_name: 母亲
      tts:
        delivery: 亲切端庄，像在远方写家信
        timbre: 温柔圆润
        pace: 舒缓
        pitch: 中音
    miss_peckitt:
      display_name: 佩基特小姐
      tts:
        delivery: 谦恭拘谨，措辞讲究而真诚
        timbre: 纤细柔和
        pace: 稍慢
        pitch: 中高音
    aunt_emmeline:
      display_name: 埃默琳姨妈
      tts:
        delivery: 平静克制，礼貌得近乎严肃
        timbre: 淡雅平稳
        pace: 不疾不徐
        pitch: 中音
  chapters:
    - id: ch01
      title: 第一章　开端
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: |-
            卡罗琳生日这天，收到了好些可爱的礼物。妹妹夏洛特送她一本蓝皮吸墨簿，封面画着粉红和紫色的玫瑰。那皮子至少看上去很像真的。弟弟查尔斯送的，则是一盒彩颜，差不多跟新的一样。
        - id: ch01-b02
          speaker: charles
          text: |-
            我真的没怎么用过。拿我自己的钱，可买不到这么好的礼物。你看，每块颜料我都擦得干干净净。
        - id: ch01-b03
          speaker: caroline
          text: |-
            太漂亮了！这些画笔也真好看！
        - id: ch01-b04
          speaker: charles
          text: |-
            那可是真鼬毛，笔尖细得就像针。
        - id: ch01-b05
          speaker: narrator
          text: |-
            卡罗琳说，确实很像。她把画笔一支支放进嘴里抿尖，再举到亮处端详。
        - id: ch01-b06
          speaker: narrator
          text: |-
            除了彩颜和吸墨簿，从印度寄来的礼物还有不少。父亲送了一只内衬白铁皮的匣子，里面装着一套雕花棋子。母亲送了红蓝两色的围巾，还有一件简直想都不敢想的华美礼物，那就是一张豹皮。
        - id: ch01-b07
          speaker: mother
          text: |-
            这些东西，多少能给游戏室添点亮色。
        - id: ch01-b08
          speaker: narrator
          text: |-
            它们还真把房间点亮了。埃默琳姨妈送了一本《芝麻与百合》。大家都说这书对女孩子有好处，可十二岁读起来实在不容易。珀西瓦尔姨父送了灰皮袖珍簿和橄榄木裁纸刀，刀柄刻着“索伦托”。厨娘和女佣合送了针线簿与针插。常来家里给女孩们做衣裳的小裁缝佩基特小姐，则带来一本红封皮的小薄书。封面满是针头般硬硬的小凸点，她希望卡罗琳小姐肯赏脸收下。
        - id: ch01-b09
          speaker: miss_peckitt
          text: |-
            这书，我小时候读过。先母年轻时也很喜欢它。卡罗琳小姐，请您收下，也请收下我微薄而诚挚的祝福。
        - id: ch01-b10
          speaker: caroline
          text: |-
            真是太谢谢您啦！
          emotion: happy
        - id: ch01-b11
          speaker: narrator
          text: |-
            卡罗琳一把抱住了她。佩基特小姐被这个吻弄得措手不及，忙把衣领理正。
        - id: ch01-b12
          speaker: miss_peckitt
          text: |-
            不必客气。虽然这一下，我可真没料到。今早恰好有人送我一枝南木蒿。您去书里查查就知道，它表示“惊喜”。
        - id: ch01-b13
          speaker: narrator
          text: |-
            那果然是个惊喜，因为书名正是《花语》。说起来，这本书就是故事的开端。若不是这一本，那便是另一本，不过那得以后再讲。
        - id: ch01-b14
          speaker: caroline
          text: |-
            棒极了！我尤其喜欢这个红封皮。
          emotion: happy
        - id: ch01-b15
          speaker: narrator
          text: |-
            最后一件礼物来自那个负责擦靴子、磨刀的小厮。他送了一大束金盏花，还有一张只值半便士的生日贺卡。卡片上画着一只金色的锚，还有一双粉红色、紧紧握在一起的手。
        - id: ch01-b16
          speaker: charlotte
          text: |-
            卡罗，今天是你的生日，咱们来装点房间吧！彩色东西已经不少了，我再去借厨娘礼拜天戴的围巾。粉色紫色交织的变色绸，简直像一场梦！我马上飞回来！
        - id: ch01-b17
          speaker: narrator
          text: |-
            夏洛特当真飞奔而去。等她回来，孩子们便一起布置房间。
        - id: ch01-b18
          speaker: narrator
          text: |-
            他们为什么如此渴望颜色呢？因为这栋房子淡得出奇，比起真正有人居住的家，更像书里一幅只有黑、白、灰的房屋插图。屋子整齐、苍白，还冷冰冰的。地上没有温暖的彩色地毯，只铺着白草席。楼梯上是浅灰色椰衣垫。柔软的棉布窗帘也只有淡淡的薰衣草色，既没有华贵的锦缎，也没有鲜艳热闹的花样。墙上不贴壁纸，只刷了干净的浅色水浆。放眼望去，整栋房子活像一家格外上等的私人医院。
        - id: ch01-b19
          speaker: narrator
          text: |-
            每星期，地板都用“赛尼塔斯”消毒液刷洗，屋里总飘着一股还算好闻的木料场气味。墙上也没有彩色画，只有拉斐尔、委拉斯开兹那些大画家作品的褐色复制品。
        - id: ch01-b20
          speaker: narrator
          text: |-
            斯坦莫尔家的三个孩子住在这儿，是因为父亲和母亲远在印度，其余亲戚又全在新西兰。只有老查尔斯舅公例外。他是母亲的叔父，多年前就同孩子们的父母断了来往。至于究竟是他同孩子们的父母闹翻了，还是孩子们的父母同他闹翻了，那可说不清。
        - id: ch01-b21
          speaker: narrator
          text: |-
            房子的主人姓桑德尔，也算某一种亲戚，大概是表亲吧。孩子们管他们叫珀西瓦尔姨父和埃默琳姨妈，其实并不真是姨父姨妈。这两位所谓的姨父姨妈有一个好处。他们从不动怒，也很少待人不公。两人的性情，似乎跟房子的色彩一样浅淡平和。孩子们每天晚饭吃肉，桑德尔先生和小姐却只吃蔬菜，而据说蔬菜会让人心平气和。
        - id: ch01-b22
          speaker: narrator
          text: |-
            从画上也能看出，印度是个色彩浓烈的地方。住进这座灰蒙蒙的房子，三个孩子觉得自己都快跟着褪色了。因此，他们才那样迷恋颜色，才会围着豹皮、印度刺绣和金盏花大惊小怪。他们喜欢那本红色小旧书，也喜欢封面上环绕“花语”二字的一圈金色勿忘草。
        - id: ch01-b23
          speaker: charlotte
          text: |-
            等埃默琳姨妈瞧见房间这么美，没准会想让整栋屋子都披上围巾、铺满豹皮呢。
        - id: ch01-b24
          speaker: narrator
          text: |-
            夏洛特说着，把粉红围巾挂到一幅画上。那幅画名叫《希望》，画里一个盲眼姑娘正坐在一只橙子上。
        - id: ch01-b25
          speaker: caroline
          text: |-
            我看不会。有一回我问她，妈妈说美极了的老查尔斯舅公家到底什么样。她只说，屋里塞的东西太多，通风也不大好。
        - id: ch01-b26
          speaker: charlotte
          text: |-
            我真觉得，跟查尔斯舅公闹翻太可惜了。去他家住住，我可一点也不介意。他其实也许很喜欢乖巧的小姑娘。可他们到底为什么吵架？怎么不在太阳落山前亲一亲、重新和好？大人不是总这么教咱们吗？
        - id: ch01-b27
          speaker: narrator
          text: |-
            那场争吵到底为了什么，我知道得并不比你和夏洛特多。大人们的争吵，总是又大又神秘。孩子和兄弟姐妹吵架，起因却清清楚楚。无非是谁把你的画笔丢在水里，谁把你的《水孩子》忘在草场，谁碰翻胶水弄脏了哥哥的地图。又或是那天大家打闹时弄翻玩具屋，慌忙把家具塞回去，究竟是谁一脚踩上了里面的小沙发。
        - id: ch01-b28
          speaker: narrator
          text: |-
            孩子们很快就会和好，因为吵架实在不舒服。他们也多半像夏洛特一样受过教导，不可含怒到日落。可大人好像把太阳落山这回事忘得干干净净。他们一吵就是几星期、几个月、几年，没完没了，久得你以为他们早忘了缘故。偏偏他们没忘。简姨妈来喝茶时，你仍会断断续续听到几句，说威廉姨父当年如何如何，爱德华做出那种事又多么可惜。
        - id: ch01-b29
          speaker: narrator
          text: |-
            要是大人发现你在听，就会让你出去玩。那场争吵为什么开始，你永远不会知道。就算知道，也听不懂。就算听懂了，多半也只会觉得，他们为一点无聊小事闹了这么多年，实在可笑。也许威廉姨父那桩倒霉事发生在很久很久以前，爱德华做出那番惊人举动时，你甚至还没出生呢。关于大人的争吵，你能确定的只有一件事。它们好像总跟钱有关，或者有人偏偏娶了亲戚不许他娶的人。
        - id: ch01-b30
          speaker: narrator
          text: |-
            这些事，你大概早就留意过。也许你还发现，一旦忽然提到某个人，那个人往往马上就会出现。所以，夏洛特刚说完真希望大家没有同查尔斯舅公闹翻，即使舅公本人下一刻突然走到大门前，你大概也一点不会奇怪。
        - id: ch01-b31
          speaker: narrator
          text: |-
            可惜来的不是舅公。确实有人走到大门前，却只是邮差。
        - id: ch01-b32
          speaker: narrator
          text: |-
            卡罗琳冲出去，看还有没有生日贺卡。暑假才刚开始，高等女校里的某个姑娘说不定还记得她的生日。她一路飞奔，一头撞上埃默琳姨妈。姨妈一定也被撞得很疼，因为卡罗琳的脑袋后来痛得厉害，她恰好撞中了姨妈那枚珍珠母腰扣。可埃默琳姨妈没有责骂，只说了一句话。
        - id: ch01-b33
          speaker: aunt_emmeline
          text: |-
            慢一点，我的孩子，慢一点。
          emotion: calm
        - id: ch01-b34
          speaker: narrator
          text: |-
            卡罗琳后来觉得，这话比挨骂更难受，听得人仿佛成了一头笨重的大象。而且，根本没有新的生日贺卡。所有信都是寄给桑德尔小姐的。孩子们才把豹皮在地板上铺开，她便拿着其中一封信，来到他们的房门口。
        - id: ch01-b35
          speaker: aunt_emmeline
          text: |-
            我有一个惊喜要告诉你们。
        - id: ch01-b36
          speaker: caroline
          text: |-
            快请进，坐下来讲吧。
        - id: ch01-b37
          speaker: narrator
          text: |-
            埃默琳姨妈这一点很招人喜欢。她真把孩子们的房间当成他们自己的地方，每回来都等着孩子们把她当客人招待。只有听到邀请，她才会坐下，绝不会自己找个位置落座。
        - id: ch01-b38
          speaker: aunt_emmeline
          text: |-
            谢谢。惊喜就是，你们要到乡下去过暑假了。
        - id: ch01-b39
          speaker: narrator
          text: |-
            房里顿时安静下来。只有查尔斯打破了沉默，而他也不过说了这么一句。
        - id: ch01-b40
          speaker: charles
          text: |-
            早知道，咱们就不用费劲布置房间了。
        - id: ch01-b41
          speaker: aunt_emmeline
          text: |-
            哦，这原来是在布置房间吗？
        - id: ch01-b42
          speaker: narrator
          text: |-
            听她的口气，仿佛粉红围巾会自己爬上画框，豹皮会因为偶然或凌乱跑到地板上，金盏花也会碰巧跳上壁炉台，而这一切根本不是孩子们特意布置的。
        - id: ch01-b43
          speaker: aunt_emmeline
          text: |-
            这件事可能成，我已经知道一阵子了。不过刚来的信，才真正把它定下来。你们后天出发。
        - id: ch01-b44
          speaker: caroline
          text: |-
            可我们到底要去哪里？
        - id: ch01-b45
          speaker: narrator
          text: |-
            桑德尔小姐说出了一句不同寻常，值得牢牢记住的话。
        - id: ch01-b46
          speaker: aunt_emmeline
          text: |-
            你们听说过查尔斯舅公吗？
        - id: ch01-b47
          speaker: charles
          text: |-
            就是跟家里闹翻的那个？
        - id: ch01-b48
          speaker: aunt_emmeline
          text: |-
            我不知道你们听说过。是他。如今争执已经了结，他请你们去庄园宅邸过暑假。
        - id: ch01-b49
          speaker: narrator
          text: |-
            孩子们又陷入深深的沉默。他们都憋着一声“好哇”，恨不得立刻喊出来，又觉得那样不合礼数。
        - id: ch01-b50
          speaker: aunt_emmeline
          text: |-
            我就知道你们会高兴。大家都说那栋宅子很美，而且坐落在一座庄园里。
        - id: ch01-b51
          speaker: caroline
          text: |-
            埃默琳姨妈，您也去吗？
        - id: ch01-b52
          speaker: aunt_emmeline
          text: |-
            不，亲爱的，只邀请了你们几个孩子。你们会安安静静、规规矩矩的，是不是？要记住，查尔斯舅公是位喜欢清静的学者，不习惯身边有孩子。在那里，你们会有很大的自由，我希望你们懂得好好利用。你们以前从来没有这样独自去别人家做过客，没有……没有人在一旁提醒你们……告诉你们……
        - id: ch01-b53
          speaker: charlotte
          text: |-
            哎呀，这不用操心，埃米姨妈。可是，谁来给我们钉纽扣、补袜子呀？
        - id: ch01-b54
          speaker: aunt_emmeline
          text: |-
            当然有管家。明天我替你们收拾衣物。你们想好要带什么玩具，我也一并装上。
        - id: ch01-b55
          speaker: narrator
          text: |-
            卡罗琳仍以为，不露出高兴的样子才够有礼貌。
        - id: ch01-b56
          speaker: caroline
          text: |-
            好的。谢谢您，埃默琳姨妈。
        - id: ch01-b57
          speaker: charles
          text: |-
            希望舅公会喜欢我们。我们三个全是照着他的名字起名，他总该喜欢吧？要不咱们全假装叫别的名字？现在已经够麻烦了，等屋里又多一位查尔斯舅公，那可糟透了。埃米姨妈，我们是不是非得管他叫“大”呀？
        - id: ch01-b58
          speaker: caroline
          text: |-
            他说的是“大舅公查尔斯”。我想，咱们就叫普通的“舅公”好了，对不对？
        - id: ch01-b59
          speaker: charles
          text: |-
            他才不喜欢别人叫他“普通的”呢。
        - id: ch01-b60
          speaker: caroline
          text: |-
            别犯傻。小男孩怎么称呼他，他不会介意的。
        - id: ch01-b61
          speaker: charles
          text: |-
            我要拿你平时骂我的那些话去叫他，他准介意。你才犯傻！
        - id: ch01-b62
          speaker: aunt_emmeline
          text: |-
            孩子们，孩子们！我还以为你们会高兴极了。
        - id: ch01-b63
          speaker: caroline
          text: |-
            我们是很高兴。可我们走了，您不会觉得闷吗？我们只是为这个，才没显得像您以为的那么欢喜。
        - id: ch01-b64
          speaker: narrator
          text: |-
            桑德尔小姐笑了。她那张又长、颜色像灰白牛皮纸的脸，立刻好看了许多。
        - id: ch01-b65
          speaker: aunt_emmeline
          text: |-
            谢谢你，卡罗琳。珀西瓦尔姨父和我也要去度假。我们会去瑞士、意大利湖区和威尼斯。你们尽管快活，不必为我们操心。
        - id: ch01-b66
          speaker: narrator
          text: |-
            到这时，三个孩子终于觉得，礼貌和真心可以汇在一起，化成一声发自肺腑的欢呼了。
        - id: ch01-b67
          speakers: [caroline, charlotte, charles]
          ensemble: chorus
          text: |-
            好哇！
          emotion: happy
        - id: ch01-b68
          speaker: caroline
          text: |-
            我要带豹皮，还有我收到的每一件礼物。
        - id: ch01-b69
          speaker: charlotte
          text: |-
            那我带西洋跳棋和挑棒游戏。
        - id: ch01-b70
          speaker: caroline
          text: |-
            妈妈说，她小时候，客厅里有一副乌木和象牙做的西洋跳棋，棋子都是狮子头。还有一副珍珠母做的挑棒呢。
        - id: ch01-b71
          speaker: charles
          text: |-
            我要把自己的东西一件不落全带上，板球用具也带！
