  chapters:
    - id: ch01
      title: F. of H.D.
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: You may hardly believe it, but Uncle Charles never noticed the whole noisy business of the two leopards. His instructions had been firm. No one was to disturb him on any pretense at all. And so, while everything happened elsewhere in the house, he remained entirely unaware of it.
        - id: ch01-b02
          speaker: narrator
          text: Nobody told him afterward, either. The three C.'s kept quiet because they feared he might not approve of Rupert pretending to be a leopard. Mrs. Wilmington said nothing because Rupert was her great favorite. She carefully mended the places where the harp strings had torn the leopard skin, returned it to its place, and never mentioned the matter to anyone. William said nothing. William was the sort of man who could keep a joke entirely to himself. Poad said nothing because he was never quite sure whether the laugh had been on his side or William's. Rupert kept quiet too, for reasons that will make more sense later. So Uncle Charles simply went on writing his book about Sympathetic Magic. He stayed in complete ignorance of every leopardish thing that had happened.
        - id: ch01-b03
          speaker: narrator
          text: At last, all the fuss and bustle died away. Rupert and the children were left face to face, and words of reproach rose to every one of their lips. But Rupert knew what he had faced in that underground passage for the children's sake. Enough of that warm, comforting feeling still remained to help him speak before they could begin.
        - id: ch01-b04
          speaker: rupert
          text: Look here, don't start on me. I'm awfully sorry if I truly frightened you. I didn't know. I had no idea what it felt like to be scared by a leopard until I thought I was shut up with one myself. So please don't rub it in. Be good chaps about it.
        - id: ch01-b05
          speaker: narrator
          text: Such an honest appeal could not fail with the three C.'s. And even if the girls had needed one more thing to melt their anger, Rupert had supplied it by calling them “good chaps.”
        - id: ch01-b06
          speakers: [caroline, charlotte]
          ensemble: duo
          text: Oh, all right.
        - id: ch01-b07
          speaker: charlotte
          text: But let's tell each other the whole story. We won't say anything more until after dinner, and then we'll have a grand palaver in the garden. Rupert, I want to understand exactly what you felt when you felt that leopard. Then we can see whether it was anything like what we felt when we saw your spots.
        - id: ch01-b08
          speaker: rupert
          text: All right!
        - id: ch01-b09
          speaker: charles
          text: It was the most dreadful thing in the world, but at least we'll have plenty to talk about.
        - id: ch01-b10
          speaker: narrator
          text: It certainly did give them something to talk about. They compared every part of the two frights, from the moment the children saw the spotted shape to the moment Rupert believed a real leopard was beside him. Deep inside, Rupert knew he had done something rather decent when he went through the underground passage for their sake. He did not boast about it, but the knowledge changed how he felt about himself. It made him more like the Rupert the children had first met on his first night in the house. That kinder self no longer seemed like a part he had only been playing. The children spent a most enjoyable afternoon with him. For the first time in many days, Rupert did not act as if he wanted to shake the others off and be alone. Instead, he stayed with them willingly. At last he invited them down to the river to see him dive.
        - id: ch01-b11
          speaker: rupert
          text: Mind you, I'm nowhere near as good as Mr. Penfold.
        - id: ch01-b12
          speaker: narrator
          text: Of course they went. At the river, Charles even had his very first swimming lesson. It gave him a great deal to think about on the walk home.
        - id: ch01-b13
          speaker: charles
          text: Swimming would be all right if you could only remember which are your arms and which are your legs. I never can remember when I'm in the water. On dry land, of course, it is perfectly easy to tell. But once the water is all around you, they get mixed up. Anyway, you seem to have far too many arms and legs when you're trying to swim, and every single one of them feels as if it belongs to somebody else.
        - id: ch01-b14
          speaker: narrator
          text: Charles smoothed down his wet hair as they walked home. When the children reached the bridge, Mr. Penfold met them there and told them his news.
        - id: ch01-b15
          speaker: mr_penfold
          text: I've finished that translation, and I've had it typed. Now you can tell your uncle about it and present it to him. I know he'll be awfully pleased. I daresay he'll let you have a copy too. In fact, I've had a copy made especially for you, with all the parts that wouldn't be useful to you left out. By the way, something at the very end mentions the seventh of July. That's tomorrow. So you had better make your presentation then.
        - id: ch01-b16
          speakers: [caroline, charlotte, charles, rupert]
          ensemble: chorus
          text: Thank you!
        - id: ch01-b17
          speaker: narrator
          text: Their thanks came in a chorus, because this was just the help they had been hoping for. Then, before they left the bridge, they arranged every part of the presentation for the following day. The children would take the precious old Latin book home with them and keep it safe overnight. Mr. Penfold would bring along the typed translation when it was ready. Together they would present the book and its newly readable secrets to Uncle Charles on the seventh of July.
        - id: ch01-b18
          speaker: mr_penfold
          text: I'll bring it when I've corrected the spelling and all the stops. And if I may come, I'd like to see you make the presentation. I think there should be flowers as well. Symbolic flowers, you know, suggested by that other book of yours.
        - id: ch01-b19
          speaker: narrator
          text: When the children reached home, they carried the old Latin book straight to the table beside the window. They spread it open carefully so the pages would catch the last rosy light of sunset. The day was fading, and they meant to use every bit of light that remained. Charles looked across the glowing pages at Rupert with proud affection. In his eyes, a translation made by an adult was no longer important. They had Rupert with them, and Charles was certain their own expert could tell them anything they needed to know.
        - id: ch01-b20
          speaker: charles
          text: Now we have you, Rupert, we don't need any old translation.
        - id: ch01-b21
          speaker: narrator
          text: Rupert frowned. At once, the girls shrank back, as sensitive plants shrink when a finger touches them. They knew the sort of bitter remark trembling on his lips. It would be something about how doing things for children was never worth the trouble. But his expression changed almost at once. His face went red, though perhaps that was only the sunset growing deeper around him.
        - id: ch01-b22
          speaker: rupert
          text: You know, there's something I ought to admit. I'm afraid I've been fooling you rather badly about my Latin. As a matter of fact, I'm not very good at it at all. I've only just begun reading Virgil.
        - id: ch01-b23
          speaker: charles
          text: But you know lots of Latin. You're always quoting it.
        - id: ch01-b24
          speaker: narrator
          text: Charles sounded anxious.
        - id: ch01-b25
          speaker: rupert
          text: That was just showing off. Silly showing off. I expect most of the Latin I said was wrong. There, now the truth is out!
        - id: ch01-b26
          speaker: narrator
          text: Rupert may have expected his confession to lower him in the children's eyes. Instead, they treated him with even greater respect. It seemed splendid to them that someone who had shown off should suddenly tell the whole truth without being forced. Later that evening, while the girls' hair was being brushed, Caroline returned to the subject. She said again how splendid it was of Rupert to own up about the Latin. Charlotte immediately reminded her sister that she herself had always thought Rupert splendid. This was not really true. There had been many moments when Charlotte had thought nothing of the kind. Still, by then she honestly believed she had admired him all along.
        - id: ch01-b27
          speaker: charlotte
          text: Never mind about the Latin. We'll have Mr. Penfold's translation tomorrow, and then we'll try one of the spells at once. I am sorry that the leopard who spoke turned out to be only you, Rupert. We truly thought that after such a thing, you would have to believe in magic.
        - id: ch01-b28
          speaker: caroline
          text: There's something written at the end of the book. I'd forgotten about it.
        - id: ch01-b29
          speaker: narrator
          text: Caroline was right. Something had been written at the end of the book in very faint brown ink. Indoors, the marks were no more than a dim blur. The children carried the heavy book from the table and took it right outside the front door, which, as you know, stood at the side of the house. They shifted the open pages toward the last of the evening light and bent over them together. At first they were sure they still could not make out the writing because it must be Latin. That seemed the obvious reason for their difficulty. But when they found enough light and the faded letters grew clear, they made a surprising discovery. The words were not Latin at all. They were English, and now the children could read every one of them for themselves.
        - id: ch01-b30
          speaker: narrator
          text: This was the message they found. The sowing had to take place on the seventh day of the seventh month, and at the seventh hour of that day. Whoever performed it must count out seven seeds, exactly seven, and use no more. Those seeds could not be planted in any common patch of earth. They had to be sown in the garden of peace, which the writing called the seventh garden of the world. The person who wished to sow them had to prepare by bathing seven separate times in clear, fair water. At the moment of planting, that person must turn and face toward the east. No word must pass the lips. In the heart there must be faith in every good thing and love for every beautiful thing. If all this was done correctly, seven weeks would pass before the flower appeared. Then the very person who had sown the seed must eat that flower. At the end came the unfinished words, “The seed of the F. of H.D.” Whatever those letters meant had once been explained, but the explanation was gone.
        - id: ch01-b31
          speaker: rupert
          text: The seed of what?
          emotion: surprised
        - id: ch01-b32
          speaker: caroline
          text: That's all. It ends right there. There's nothing else.
        - id: ch01-b33
          speaker: narrator
          text: Yet there had once been more. Someone had deliberately scratched out the rest of the writing.
        - id: ch01-b34
          speaker: caroline
          text: Someone used a knife or scissors. Oh, what a shame!
          emotion: sad
        - id: ch01-b35
          speaker: rupert
          text: I say—
        - id: ch01-b36
          speaker: narrator
          text: Rupert had only begun when Charles interrupted him. Charles had stooped down and was looking upward beneath the page Caroline held between her fingers.
        - id: ch01-b37
          speaker: charles
          text: There's more! Look, turn the page!
          emotion: surprised
        - id: ch01-b38
          speaker: narrator
          text: There truly was more on the other side of the page. The old words explained that no one knows the heart's dearest desire while it is still only a wish. A person may believe they know what they want most, but they cannot be certain before the gift is granted. After it has been granted, everything becomes clear. Then the person understands that this, and nothing else, was the true Desire of the Heart. It was what the heart had wanted all along, and what it must always have been meant to want.
        - id: ch01-b39
          speaker: charlotte
          text: That is true, at any rate. I was just wondering what my own heart's desire really might be. Suppose you thought it was going to be a new paint box. But then the flower knew you better than you knew yourself, and it turned out that what you truly wanted was elephants. What would happen then?
        - id: ch01-b40
          speaker: rupert
          text: No, but listen to me! You know I don't believe in magic. I'd like to believe in it. I truly would. But I found something, and it may have to do with this. You have the key to the drawing room, don't you? I believe I know where those seeds are hidden.
        - id: ch01-b41
          speaker: narrator
          text: They hurried to the drawing room. By the time they reached it, the room was almost dark. Only one last ray of dusky gold stretched across it. The ray struck the round mirror, leaped back from the glass, and shone with dazzling brightness on a golden object at the far end of the room.
        - id: ch01-b42
          speaker: rupert
          text: The harp! How strange. That's exactly where—
        - id: ch01-b43
          speaker: narrator
          text: Rupert stopped because this was the exact place where the little round box had been before. It was still there now, exactly where he remembered it. In that strange reflected light, every one of them felt quite certain that the box held the very seeds described in the old book.
        - id: ch01-b44
          speaker: charlotte
          text: Look at them while I hold them in this yellow light. They're shaped like little hearts, and they're pink, just like wishes. I know wishes are pink. They must be some color, after all, and why shouldn't that color be pink?
        - id: ch01-b45
          speaker: caroline
          text: But are we allowed to take them?
        - id: ch01-b46
          speaker: narrator
          text: Caroline's question cast a shadow over the discovery. The seeds were in Uncle Charles's house, and the children could not simply decide they belonged to them. So they wrote a note, and Harriet obligingly carried it to their uncle. “Dearest Uncle,” the note began. They explained that there were some pinkish seeds in the drawing room and asked whether they might have seven of them to sow.
        - id: ch01-b47
          speaker: uncle_charles
          text: Certainly. You may have seventy of them if you like. Your D.S.T.U.
        - id: ch01-b48
          speaker: narrator
          text: That settled it. Very early the next morning, all four children got out of bed to prepare for the sowing. Bathing seven times was no joke at all. It took especially long because Caroline conscientiously insisted that they dry themselves thoroughly between one bath and the next.
        - id: ch01-b49
          speaker: caroline
          text: We have to be absolutely sure we do it exactly right.
        - id: ch01-b50
          speaker: narrator
          text: At the time they had agreed upon, the four children met at the top of the stairs. From that moment they kept silent, just as the instructions required. They crept downstairs together and left the house through the French window that had once admitted Rupert. They did not speak until they were safely outside.
        - id: ch01-b51
          speaker: rupert
          text: I bathed seven times too, because Charles did nothing but bother me until I did. But even if all this is true, there is no use in my sowing any of the seeds. I haven't got faith in my heart, and I haven't got it in my head either. If you ask me, though, I think my head is the part that's really at fault.
        - id: ch01-b52
          speaker: charlotte
          text: Oh, never mind about your head. We'll each sow one seed of our own. That will use four of them. Then, for the three that remain, we'll all plant them together. All four of us can take part.
        - id: ch01-b53
          speaker: narrator
          text: The morning grass was still wet with dew when they crossed it. Even at that early hour, the gardener was already at work in the Wonderful Garden. Someone would have to go up and ask him for a plot of earth. To decide who it should be, the children went through the ancient counting rhyme, “ena dena dina dus.” The lot fell upon Charlotte.
        - id: ch01-b54
          speaker: charlotte
          text: Please, may we have a little piece of garden for ourselves?
        - id: ch01-b55
          speaker: gardener
          text: Ay.
        - id: ch01-b56
          speaker: narrator
          text: The gardener agreed at once and pointed toward an empty plot of ground close to the arbor. It would have been an easy answer, except that this was not the place named in the instructions.
        - id: ch01-b57
          speaker: charlotte
          text: Oh, thank you. But could we have a piece in the garden of peace instead?
        - id: ch01-b58
          speaker: gardener
          text: Who taught you to call it that?
        - id: ch01-b59
          speaker: narrator
          text: The gardener did not answer at once. He gave Charlotte a strange, searching look. His expression made her wonder whether they had misunderstood the old writing, and sudden anxiety came into her voice.
        - id: ch01-b60
          speaker: charlotte
          text: It is the right name, isn't it?
        - id: ch01-b61
          speaker: gardener
          text: Ay, it's the right name.
        - id: ch01-b62
          speaker: charlotte
          text: We need a little piece of it where the earth won't be touched or disturbed for seven whole weeks.
        - id: ch01-b63
          speaker: narrator
          text: At the mention of seven weeks, the gardener's look grew stranger still. It seemed that Charlotte's request meant far more to him than an ordinary wish for a garden plot.
        - id: ch01-b64
          speaker: gardener
          text: Are you certain you have the proper seed to plant?
        - id: ch01-b65
          speaker: narrator
          text: Charlotte opened her hand and showed him the seven little seeds. The gardener stooped close to examine them. Then he rose to his full height, straightened himself, and saluted her as solemnly as a soldier.
        - id: ch01-b66
          speaker: charlotte
          text: Why did you do that? What does it mean?
          emotion: surprised
        - id: ch01-b67
          speaker: gardener
          text: Nothing, my dear! It's only that I've worked in this garden all my days. My father worked here before me, and his father worked here before him, and our family goes on backward like that for many a year. You can see our names carved on the stones in the churchyard, just as you can see the names of the Master's people on the tombs inside the church. I'll find a corner for you. Once you've set those seeds in the earth, no one shall disturb them. But you do know how the sowing must be done, don't you? You know there must be no chatter, and you know which way you have to look?
        - id: ch01-b68
          speaker: charlotte
          text: Yes, I know. But how do you know?
        - id: ch01-b69
          speaker: gardener
          text: Old men's tales, my dear. That's how I know. Nothing but old men's tales.
        - id: ch01-b70
          speaker: narrator
          text: With that, he turned and led Charlotte toward the terrace. But she was too eager, and too impressed by what he knew, to leave the matter there.
        - id: ch01-b71
          speaker: charlotte
          text: Would you like to sow one of the seeds yourself? I know the others won't mind giving you one if you would like it. Would you? Please say you would.
        - id: ch01-b72
          speaker: gardener
          text: Not me, my dear.
        - id: ch01-b73
          speaker: narrator
          text: The old man refused, and then he sighed. His answer was not cross or doubtful. It carried the quiet certainty of someone who had thought about such wishes long ago.
        - id: ch01-b74
          speaker: gardener
          text: Years ago, I might have done it. I don't say I wouldn't. But not now. I'm old, you see, and I have no heart's desires left nowadays except for the things I'll receive in the way of nature and in the Lord's good time. You young ones go along and set your seeds. I'm glad I lived to see them, though. Look over there, between the lupins and the larkspurs. That shall be your plot, and I'll mark the place so no one touches it.
        - id: ch01-b75
          speaker: narrator
          text: Charlotte was deeply impressed by everything the old gardener had said. She beckoned to the other three, but did not call out to them. Together, and in complete silence, the children sowed their seeds. The gardener stood nearby and watched every part of it. They placed the seeds in the earth, covered them carefully, and finished the strange ceremony. Then the gardener reached into his pocket. He brought out a pencil and one of the little painted labels used to mark plants. He wrote something on the label and stuck it firmly into the ground above the seeds. All four children stooped together to see what he had written.
        - id: ch01-b76
          speaker: narrator
          text: The label said, “F. of H.D.”
        - id: ch01-b77
          speaker: caroline
          text: Well!
