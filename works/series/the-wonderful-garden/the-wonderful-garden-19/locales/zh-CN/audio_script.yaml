audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 温暖机敏，带着克制的幽默讲述
        timbre: 清澈柔和
        pace: 从容而富有变化
        pitch: 中音
    caroline:
      display_name: 卡罗琳
      tts:
        delivery: 大方热情，努力摆出长姐的懂事
        timbre: 明亮清脆
        pace: 自然轻快
        pitch: 中高音
    charlotte:
      display_name: 夏洛特
      tts:
        delivery: 活泼直率，想到什么便说什么
        timbre: 轻盈清亮
        pace: 偏快
        pitch: 高音
    charles:
      display_name: 查尔斯
      tts:
        delivery: 淘气认真，笑话总说得一本正经
        timbre: 清亮的男孩声
        pace: 轻快
        pitch: 中高音
    rupert:
      display_name: 鲁珀特
      tts:
        delivery: 直爽开朗，病中说话虚弱而迷糊
        timbre: 清亮的少年声
        pace: 自然，发烧时忽快忽慢
        pitch: 中高音
    uncle_charles:
      display_name: 查尔斯舅舅
      tts:
        delivery: 温和飘忽，偶尔流露出幽微的兴味
        timbre: 轻柔低沉
        pace: 舒缓
        pitch: 中低音
    mr_penfold:
      display_name: 彭福尔德先生
      tts:
        delivery: 体贴睿智，温和的话里带一点奇趣
        timbre: 温暖清朗
        pace: 从容
        pitch: 中低音
    gardener:
      display_name: 园丁
      tts:
        delivery: 简短直接，带着干活人的利落
        timbre: 浑厚朴实
        pace: 自然
        pitch: 低音
    mrs_wilmington:
      display_name: 威尔明顿太太
      tts:
        delivery: 一本正经，话里总带着挑剔和自以为是
        timbre: 干脆冷硬的中年女声
        pace: 稍慢
        pitch: 中音
  chapters:
    - id: ch01
      title: 豹子风波之后
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: |-
            你大概想不到，两头豹子闹出那么大一场风波，查尔斯舅舅竟从头到尾毫不知情。他早已严令，无论有什么事都不许打扰。事后也没人去告诉他。三个C怕他不喜欢鲁珀特扮豹子。威尔明顿太太偏爱鲁珀特，只管补好被琴弦扯破的豹皮，再悄悄放回原处。威廉很能把笑话藏在心里。波德连谁在笑谁都没弄明白。鲁珀特也有自己的理由，暂且不说。于是，舅舅仍安安静静地写他的《交感巫术》，一点不知道什么豹子不豹子。
        - id: ch01-b02
          speaker: narrator
          text: |-
            忙乱平息后，鲁珀特和孩子们面对面站着。三个人都有一肚子话要责备他。可是鲁珀特想起自己为了他们，在地道里曾冒过怎样的险，心里那股温暖的感觉还没有散，便抢先开了口。
        - id: ch01-b03
          speaker: rupert
          text: |-
            喂，先别骂我。我要是真把你们吓坏了，对不起。我以前哪知道，被豹子吓是这种滋味？直到我以为自己跟一头真豹子关在一起，才算明白。你们就别再揭我的短了，都是好伙伴嘛。
        - id: ch01-b04
          speaker: narrator
          text: |-
            这么坦白地一求，三个C哪里还能不答应？更何况鲁珀特还把两个姑娘叫作“好伙伴”，她们最后那点气也消了。
        - id: ch01-b05
          speakers: [caroline, charlotte]
          ensemble: duo
          text: |-
            好吧，那就不骂你了。
        - id: ch01-b06
          speaker: charlotte
          text: |-
            不过，咱们得把各自的经过全讲一遍。吃饭前先别说，饭后去花园开一场大会。鲁珀特，我想知道你摸到豹子时到底是什么感觉，再跟我们看见你那身斑点时比一比。
        - id: ch01-b07
          speaker: rupert
          text: |-
            好，就这么办！
        - id: ch01-b08
          speaker: charles
          text: |-
            那是全世界最可怕的事。不过以后倒有得讲了。
        - id: ch01-b09
          speaker: narrator
          text: |-
            他们果然有说不完的话。孩子们说起看到斑点豹子时的恐惧，鲁珀特也说起自己以为被真豹子困在地道里的感觉。鲁珀特心底知道，自己为了孩子们做了一件相当不错的事。这个念头使他又变回了初来那晚的模样，不再像这些天那样处处跟大家疏远。整整一下午，孩子们都跟他玩得很快活。许多天来第一次，鲁珀特不再急着甩开他们，反而主动邀大家到河边看自己跳水。
        - id: ch01-b10
          speaker: rupert
          text: |-
            先说好，我可远远比不上彭福尔德先生。
        - id: ch01-b11
          speaker: narrator
          text: |-
            大家还是去了，查尔斯还上了第一堂游泳课。回家时，他一边把湿头发抹平，一边认真总结经验。
        - id: ch01-b12
          speaker: charles
          text: |-
            游泳本来还行，麻烦是一下水就分不清哪两条是胳膊，哪两条是腿。而且手脚一下子多得不得了，每一条都像是别人的。
        - id: ch01-b13
          speaker: narrator
          text: |-
            走到桥上，彭福尔德先生告诉他们，那本拉丁文书已经译好，译文也打了字。他们可以把这件事告诉舅舅，再把译文正式献给他。先生料定舅舅会非常喜欢，说不定还会让孩子们留一份。他已经特意为他们另做了一份，把他们读了也得不到什么益处的部分略去。书末还有几句话提到七月七日，正是明天，所以献礼最好也定在明天。
        - id: ch01-b14
          speakers: [caroline, charlotte, charles, rupert]
          ensemble: chorus
          text: |-
            太谢谢您了！
        - id: ch01-b15
          speaker: mr_penfold
          text: |-
            等我把拼写和标点全改好，就把译文带来。要是你们准许，我也想亲眼看看这场献礼。最好再摆些花，要有象征意义，就照你们那本《花之语》来挑。
        - id: ch01-b16
          speaker: narrator
          text: |-
            他们当场安排妥当，带着古老的拉丁文书回了家。孩子们把书摊在窗边桌上，借落日前最后一点玫瑰色的光细看。查尔斯望着鲁珀特，满心骄傲，觉得既然自家的拉丁文高手在场，什么旧译文都不必稀罕。
        - id: ch01-b17
          speaker: charles
          text: |-
            现在有你在，鲁珀特，我们哪还需要什么译文？
        - id: ch01-b18
          speaker: narrator
          text: |-
            鲁珀特皱了皱眉。两个姑娘马上像被手指碰到的敏感草一样缩起来。她们以为，他又要说替小孩子做事不值得。可是他很快换了神色，脸也红了。或许，那只是夕阳映得更红。
        - id: ch01-b19
          speaker: rupert
          text: |-
            有件事我得承认。我以前把自己的拉丁文吹得太厉害，其实我学得并不好，才刚开始读维吉尔。
        - id: ch01-b20
          speaker: charles
          text: |-
            可你明明懂很多呀。你不是老念出几句拉丁文吗？
        - id: ch01-b21
          speaker: rupert
          text: |-
            那是在显摆，傻乎乎地显摆。我猜念的还全是错的。好啦，这回总算说出来了！
        - id: ch01-b22
          speaker: narrator
          text: |-
            孩子们不但没有看轻他，反倒更加敬重他。晚上梳头时，卡罗琳还夸鲁珀特肯承认这件事，实在了不起。夏洛特立刻说，自己一向觉得他了不起。这其实不真，不过她那时倒真心相信。
        - id: ch01-b23
          speaker: charlotte
          text: |-
            明天拿到译文，我们马上就试一道咒语。可惜那头会说话的豹子只是你。我们还以为这样一来，你非得相信魔法不可呢。
    - id: ch02
      title: 七粒心形种子
      blocks:
        - id: ch02-b01
          speaker: caroline
          text: |-
            等等，书末还有字，我差一点忘了。
        - id: ch02-b02
          speaker: narrator
          text: |-
            字迹淡得发褐。孩子们把书一直搬到侧面的前门外，举到天光最亮的地方，才终于看清。起初他们以为那是拉丁文，肯定读不懂。等光线真的够了，仔细一看，却发现写的是英文，他们完全读得懂。
        - id: ch02-b03
          speaker: narrator
          text: |-
            那段话说，七月第七日的第七个时辰，要在世间第七座花园，也就是和平之园里播种。每位播种者只能种七粒，绝不能多。事先还要用清水沐浴七次。播种时面朝东方，唇间无声，心里要相信一切善物，也要爱一切美物。七周后，花朵便会出现。到了那时，亲手播种的人须吃下那朵花。最后写着，这是H·D的F之种。
        - id: ch02-b04
          speaker: rupert
          text: |-
            什么？就这些吗？
        - id: ch02-b05
          speaker: caroline
          text: |-
            就这些，写到这里断了。后面的字让人用小刀或剪刀刮掉了，真可惜。
        - id: ch02-b06
          speaker: narrator
          text: |-
            鲁珀特正要说话，查尔斯已经弯腰去看卡罗琳手指下的书页。他发现背面还有一段，连忙叫她翻过去。那段话说，心中至爱之愿在实现以前，无人知道它是什么。等愿望得偿，人便明白，只有这个愿望，过去、现在和将来，都必定是心之真愿。
        - id: ch02-b07
          speaker: charlotte
          text: |-
            这话总不会错。我正想呢，要是你以为自己最想要一盒新颜料，可花比你更明白，最后告诉你，你真正想要的是大象呢？
        - id: ch02-b08
          speaker: rupert
          text: |-
            先听我说！你们知道我不信魔法，其实我真想相信。可我以前找到过一样东西。你们有客厅钥匙，我想我知道那些种子在哪儿。
        - id: ch02-b09
          speaker: narrator
          text: |-
            客厅几乎全黑了，只有最后一道暗金色夕照横在房里。光先照到圆镜，再反射到尽头一件金色物品上，亮得耀眼。鲁珀特轻声认出那是竖琴，话说到一半就停住了，因为亮光所照的位置，恰好就是他先前发现小圆盒的地方。盒子还原样待在那里。打开一看，那些种子正是心形，也正是淡粉色。每个人都相信，它们就是书里所说的种子。
        - id: ch02-b10
          speaker: charlotte
          text: |-
            你们看，种子像一颗颗心，颜色又跟愿望一样粉。我知道愿望是粉色的。愿望总得有个颜色，为什么不能是粉色？
        - id: ch02-b11
          speaker: caroline
          text: |-
            可是，这些种子我们该拿吗？
        - id: ch02-b12
          speaker: narrator
          text: |-
            这个扫兴的问题，最后由一张字条解决。哈丽雅特很乐意跑这一趟，替他们把字条送给舅舅。孩子们恭恭敬敬地写道，客厅里有一些粉粉的种子，能不能给他们七粒去种。舅舅回得干脆，当然可以，愿意的话拿七十粒也行。落款则是“一心不受打扰的舅舅”。
        - id: ch02-b13
          speaker: narrator
          text: |-
            第二天一早，四个孩子全起了床。洗七遍澡可不是闹着玩的，更别说每次洗完都要彻底擦干。可卡罗琳坚持，方法必须一点不差。他们在楼梯顶会合，静悄悄地下楼，从那扇曾经放鲁珀特进来的落地窗走出去。
        - id: ch02-b14
          speaker: rupert
          text: |-
            我也洗了七遍，全怪查尔斯缠着不放。不过就算书上说的是真的，让我播种也没用。我心里不信，脑子也不信。说到底，大概是脑子的错。
        - id: ch02-b15
          speaker: charlotte
          text: |-
            别管你的脑子。咱们一人种一粒，剩下三粒由四个人一起种。
        - id: ch02-b16
          speaker: narrator
          text: |-
            草地还湿漉漉地挂着露水，园丁已在奇妙花园里干活。孩子们念起古老的“伊娜、迪娜、戴娜、达斯”，选谁上前开口。夏洛特抽中了，便去问能不能给他们一小块自己的花圃。园丁指向凉亭旁的空地，可她想要的是和平之园里的一角。
        - id: ch02-b17
          speaker: gardener
          text: |-
            是谁教你把这里叫作和平之园的？
        - id: ch02-b18
          speaker: charlotte
          text: |-
            难道这不是它真正的名字吗？
        - id: ch02-b19
          speaker: gardener
          text: |-
            名字没错，一点也没错。
        - id: ch02-b20
          speaker: charlotte
          text: |-
            我们想找一块七个星期里谁也不会碰的地方。
        - id: ch02-b21
          speaker: gardener
          text: |-
            你们手里真是该种的种子吗？
        - id: ch02-b22
          speaker: narrator
          text: |-
            夏洛特摊开手。园丁俯身看清那几粒种子，随即挺直腰背，像士兵那样敬了个礼。夏洛特越发不明白，追问他这是什么意思。
        - id: ch02-b23
          speaker: gardener
          text: |-
            没什么。我在这里干了一辈子，我父亲、祖父，还有更早的人，也代代在这里干活。教堂墓园的石头上刻着我家人的名字，就像教堂里面那些墓上刻着老爷祖上的名字。我会替你们找个角落。种子一下地，谁也不会去动。你们知道种法吧？不能出声，也知道该朝哪边看吧？
        - id: ch02-b24
          speaker: charlotte
          text: |-
            我知道怎么种。可你怎么会知道这些？
        - id: ch02-b25
          speaker: gardener
          text: |-
            都是老人家的故事，老人家的故事罢了。
        - id: ch02-b26
          speaker: narrator
          text: |-
            园丁带她走向露台。夏洛特热切地邀他也种一粒，还说其他人一定不会反对。老人却叹了口气。
        - id: ch02-b27
          speaker: gardener
          text: |-
            我就不种了，亲爱的。若是许多年前，那还说不准。可现在我老了。如今我心里想要的，只有顺其自然，等主到了时候赐给我的那些。你们去种吧。能亲眼瞧见这些种子，我已经很高兴。羽扇豆和飞燕草中间那块地方归你们，我会做个记号。
        - id: ch02-b28
          speaker: narrator
          text: |-
            夏洛特深受触动，招手叫来同伴。四个人走到园丁挑好的花圃，照着古书的规矩面朝东方，心里想着善与美，一言不发地播下种子，再仔细盖好泥土。园丁一直站在一旁看着。等他们种完，他从口袋里取出铅笔和一块上过漆的小标签，在上面写好几个字，郑重地插进土中。孩子们一起弯腰去看，上面正是“H·D的F”。
        - id: ch02-b29
          speaker: caroline
          text: |-
            哎呀，他连这个都知道！
        - id: ch02-b30
          speaker: gardener
          text: |-
            少说为妙。也许再过七天，子叶就会破土。这里从来就是一座奇妙花园。
        - id: ch02-b31
          speaker: charlotte
          text: |-
            哎呀，这可真是不得了！
    - id: ch03
      title: 花语献礼
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: |-
            他们穿过露水未干的园地回去。早餐后，大家郑重地翻开《花之语》。围绕H·D的F谈了足足一个半钟头，卡罗琳终于认为，再想下去也没有用，该为献礼寻找合适的花了。
        - id: ch03-b02
          speaker: narrator
          text: |-
            又认真查了一个钟头，他们才从佩基特小姐那份无价的礼物里列好花单。“学问”找不到对应的花，便用象征“智慧”的蓝花鼠尾草代替。这么重要的场合，好东西再多也不嫌多，他们一共挑了十二种。只有象征咒语的露珠草是外来的，连园丁都没听说过。其余十一种，奇妙花园里全都找得到。
        - id: ch03-b03
          speaker: narrator
          text: |-
            鲁珀特以牧师要来喝茶为理由，终于劝动威尔明顿太太打开客厅。她甚至准许孩子们把献礼的花摆在那间神圣的屋子里，只规定哪怕搬进去一根草叶，也得先在地上铺好亚麻护毯。那块护毯洗过不知多少次，已经洁白干净。铺开以后，不但没有扫兴，反倒使客厅渐渐有了过节的样子。
        - id: ch03-b04
          speaker: charlotte
          text: |-
            你们还说什么魔法！鲁珀特对威尔明顿太太使的不是魔法，又是什么？他拿一根织补线当缰绳，就能牵着她走。
        - id: ch03-b05
          speaker: narrator
          text: |-
            威尔明顿太太的确答应替他们料理壁炉台和陈列柜上的花瓶，还肯照鲁珀特的意思，只插他递来的花。她当然也有自己的说法。
        - id: ch03-b06
          speaker: mrs_wilmington
          text: |-
            我来弄，总好过让你们把这里砸成碎片。不过我活到今天，还真没见过这样寒酸的一堆花。依我看，这就是一捆杂草。
        - id: ch03-b07
          speaker: narrator
          text: |-
            那些花确实不大艳丽。客厅的装饰差一点就要显得小里小气，幸亏夏洛特忽然想起，玫瑰象征秘密，理应出现，而且必须多得不能再多。于是大桌上铺满粉红玫瑰花瓣，这是卡罗琳的主意。
        - id: ch03-b08
          speaker: caroline
          text: |-
            我知道这些花瓣会让大家想起什么。可事情都忘了，也都原谅了，想起来又有什么关系？你们瞧，它们软软的、茸茸的，多像粉红色的毛。
        - id: ch03-b09
          speaker: narrator
          text: |-
            这句话当然也使人想到那张豹皮。谁也没说破。可大家为了不往豹皮那边看，费的力气实在太大，看上去简直跟盯着它没有两样。
        - id: ch03-b10
          speaker: caroline
          text: |-
            你们看，花映在镜子里多漂亮。
        - id: ch03-b11
          speaker: narrator
          text: |-
            卡罗琳很机灵地岔开话题。夏洛特也怀着同样的好意，只是办法没那么巧。她搬来一张绣花凳，直接挡住鲁珀特看豹皮的视线。
        - id: ch03-b12
          speaker: narrator
          text: |-
            喝茶时，每个人都藏着兴奋。孩子们不时要笑，又赶忙忍住。查尔斯舅舅和彭福尔德先生则小心装出若无其事的样子。最后一杯茶终于喝光，最后一块蛋糕也只剩碎屑和回忆。查尔斯憋了一整顿茶点，总算可以把预先写好的话说出来。
        - id: ch03-b13
          speaker: charles
          text: |-
            舅舅，玫瑰秘密会要在客厅开会，玫瑰十字会会员给你准备了一件礼物……不对，是一场献礼。请你过去接受献礼吧。
        - id: ch03-b14
          speaker: charlotte
          text: |-
            全说错了！我明明不是这样写的。
        - id: ch03-b15
          speaker: narrator
          text: |-
            这篇话出自夏洛特之手，作者自然有一点虚荣心。可大家正纷纷离开椅子，闹出一阵声响，谁也没听见她。客厅的确像哈丽雅特喝茶前从门外偷看时说的那样，真叫人开眼。白护毯铺满地面，花瓶、水罐和坛子里插着一簇簇玫瑰。铺满花瓣的大桌四周，十二种象征花分插在又白又精致的小果酱罐里。午后阳光有的直接照进来，有的从镜中反射出来，满屋灿烂。舅舅越过眼镜打量房间，仿佛从来没有见过这里。
        - id: ch03-b16
          speaker: uncle_charles
          text: |-
            美极了，实在美极了。
          emotion: happy
        - id: ch03-b17
          speaker: narrator
          text: |-
            夏洛特牵起舅舅的手。她解释说，这回送礼不是为了从他那里换到什么，只想让他知道，孩子们心里怎样看他。卡罗琳会像给市长念贺词那样，念出大家写好的话。今天来不及给贺词画上彩饰，舅舅喜欢的话，他们以后一定补好。等贺词念完，才会送出真正的礼物。礼物藏在桌子中央那只盆下，没等孩子们允许，舅舅绝不能先看。
        - id: ch03-b18
          speaker: charlotte
          text: |-
            我忘词了。舅舅一说“美极了”，我脑子里的话就全没了。不过意思一点没变。再说，查尔斯刚才也没记住他的词。
        - id: ch03-b19
          speaker: uncle_charles
          text: |-
            你的致辞正是好致辞该有的样子，简短，又直接。我以名誉保证，没得到准许以前，绝不窥探盆下的秘密。
        - id: ch03-b20
          speaker: narrator
          text: |-
            蓝白相间的大瓷盆倒扣在桌子中央，顶上放着一朵盛开的玫瑰和两个花苞。卡罗琳展开一张对开纸大小的纸。平常人们拿这种纸烤蛋糕、衬盒子、吸炸鱼的油。她从厨娘那里讨来后，写上了许多紫色墨水。
        - id: ch03-b21
          speaker: caroline
          text: |-
            嗯哼，让我看看……对，从这里开始。谨向世间最高贵的舅舅致意，夏洛特、查尔斯和卡罗琳敬献谢意。我们从您的奇妙花园采来这些花，借它们说出我们心里的一切。这些娇美可爱的花儿宠物，代表最细腻、最合适的感情。把它们献给心爱的人，一定能传达爱慕者心底最深的秘密。亲爱的舅舅，我们的心全属于您，因为您真是个顶好的人。
        - id: ch03-b22
          speaker: narrator
          text: |-
            讲到“娇美可爱的花儿宠物”时，你猜得出哪些字来自《花之语》，哪些是卡罗琳自己想出来的吗？她指向左边第一只罐子，开始解释每一种花。
        - id: ch03-b23
          speaker: caroline
          text: |-
            第一种是醋栗枝，意思是“您让大家都很高兴”，因为您确实让我们高兴。接着是黄合欢。现在不是花期，我们只找到叶子。它代表“秘密的爱”。舅舅跟我们同在一个秘密会社，我们喜欢他加入。
        - id: ch03-b24
          speaker: caroline
          text: |-
            铁线莲说，没有心灵之美，再好看的外表也只是转眼就没的虚影。舅舅很聪明，所以我们摘了它。白石竹代表才华。酸模代表亲爱，而且长得好看，到处又都是。悬铃木看着不起眼，可书上说，把悦目的枝叶献到天才手里，是赠花人的荣幸。这里的天才就是舅舅，因为舅舅会写书。毕达哥拉斯也讲过许多悬铃木的话。
        - id: ch03-b25
          speaker: caroline
          text: |-
            月桂不用解释，大家都知道，它装点伟人的额头，也代表成功。我们希望您的书大获成功。红三叶草表示勤奋，因为舅舅每天都努力工作，无论什么事都不许打扰。颠茄的叶子幽暗，花又是神秘的紫色，所以象征巫术和魔法。我们把玫瑰混在里面，因为玫瑰表示爱，而舅舅爱巫术，我们也爱。
        - id: ch03-b26
          speaker: caroline
          text: |-
            最后是重瓣雏菊。《花之语》说，这朵天真的小花虽然谦卑，开成重瓣后却有很深的意思，表示“我跟你想得一样”。我们在魔法等等事情上，正好跟舅舅想得一样。也希望舅舅看过真正的礼物以后，会跟我们想得一样。好啦，全部念完了。
        - id: ch03-b27
          speaker: narrator
          text: |-
            卡罗琳一口气念完，已经喘得厉害。彭福尔德先生立即叫好。
        - id: ch03-b28
          speaker: mr_penfold
          text: |-
            说得好，真是说得好！
        - id: ch03-b29
          speaker: uncle_charles
          text: |-
            谢谢你们，非常感谢。这是我听过最博学、也最可爱的贺词。花本身很美，花的寓意也一样美。
          emotion: happy
    - id: ch04
      title: 献礼的心
      blocks:
        - id: ch04-b01
          speaker: charles
          text: |-
            你喜欢就好，可真正的礼物还没看呢。卡罗，他现在可以看了吗？
        - id: ch04-b02
          speaker: charlotte
          text: |-
            舅舅，把盆抬起来吧。小心别摔了，它可沉得很。
        - id: ch04-b03
          speaker: narrator
          text: |-
            查尔斯舅舅双手抬起大瓷盆，把它放进玫瑰花瓣中。盆底下还有一块白布，盖着什么东西。白布上依旧摆了一朵盛开的红玫瑰和两个花苞。
        - id: ch04-b04
          speaker: caroline
          text: |-
            这才是整场献礼真正的心。先别看。我们在蒲柏译的《伊利亚特》和《帖撒罗尼迦书》里找到它们，差不多可以肯定就是那两本。希望你会喜欢。
        - id: ch04-b05
          speaker: uncle_charles
          text: |-
            我简直想不到，自己还能比现在更高兴。
          emotion: happy
        - id: ch04-b06
          speaker: narrator
          text: |-
            舅舅满怀感激，揭开那块白布。其实，那是卡罗琳最好的一方手帕。布下面的两本书终于露了出来。屋里顿时静得人人都屏住了呼吸，谁也不敢抢先说话。舅舅拿起两本书，先看过一本，又看另一本，仔细端详了好一阵。
        - id: ch04-b07
          speaker: uncle_charles
          text: |-
            你们知道吗？我相信就是它们。我差不多可以肯定，就是这两本。
          emotion: happy
        - id: ch04-b08
          speaker: narrator
          text: |-
            他的声音近乎哽咽。说完后，他沉默了一会儿，又打开书，转向彭福尔德先生。
        - id: ch04-b09
          speaker: uncle_charles
          text: |-
            谢谢，谢谢你们。有了它们，一切都会大不相同，绝对会大不相同。
          emotion: happy
        - id: ch04-b10
          speaker: narrator
          text: |-
            查尔斯正要把他们怎样找到这两本书讲出来。彭福尔德先生却先向他打手势，叫他暂时别出声，又朝门口示意了一下，自己带头离开客厅。孩子们一个接一个跟了出去。等所有人都到了门外，他才轻轻把门关上，让舅舅独自留在房中。
        - id: ch04-b11
          speaker: mr_penfold
          text: |-
            人要是特别幸福，或是特别难过，总喜欢独自待一会儿。我想，你们舅舅现在就是特别幸福。
        - id: ch04-b12
          speaker: caroline
          text: |-
            这可太好了！
          emotion: happy
        - id: ch04-b13
          speaker: mr_penfold
          text: |-
            我也特别幸福。有位名叫詹姆斯·霍奇金森的先生，简直是化身成人的天使。他寄给我五英镑，用来修缮教堂。我已经一文不剩，全花在门廊屋顶的瓦片上了。你们要是愿意，可以下去帮我铺瓦。来不来？
          emotion: happy
        - id: ch04-b14
          speakers: [caroline, charlotte, charles]
          ensemble: chorus
          text: |-
            当然来！
          emotion: happy
        - id: ch04-b15
          speaker: narrator
          text: |-
            鲁珀特没有回答。大家回头找他，想看看他为什么不出声。这才发现，鲁珀特已经不在那里了。
