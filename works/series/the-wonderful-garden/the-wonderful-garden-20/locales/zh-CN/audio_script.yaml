audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 温暖机敏，带着克制的幽默讲述
        timbre: 清澈柔和
        pace: 从容而富有变化
        pitch: 中音
    caroline:
      display_name: 卡罗琳
      tts:
        delivery: 大方热情，努力摆出长姐的懂事
        timbre: 明亮清脆
        pace: 自然轻快
        pitch: 中高音
    charlotte:
      display_name: 夏洛特
      tts:
        delivery: 活泼直率，想到什么便说什么
        timbre: 轻盈清亮
        pace: 偏快
        pitch: 高音
    charles:
      display_name: 查尔斯
      tts:
        delivery: 淘气认真，笑话总说得一本正经
        timbre: 清亮的男孩声
        pace: 轻快
        pitch: 中高音
    rupert:
      display_name: 鲁珀特
      tts:
        delivery: 直爽开朗，病中说话虚弱而迷糊
        timbre: 清亮的少年声
        pace: 自然，发烧时忽快忽慢
        pitch: 中高音
  chapters:
    - id: ch01
      title: 真正的魔法
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: |-
            有一天，鲁珀特照常去了彭福尔德先生那里。趁他不在，查尔斯想起鲁珀特说过，他们该用魔法做一件真正的事，便跟两个姑娘认真商量起来。夏洛特抬头看着墙上埃莉诺夫人的画像，以为他说的是让画像里的夫人活过来。
        - id: ch01-b02
          speaker: charlotte
          text: |-
            你是说，让埃莉诺夫人的画像活过来？
        - id: ch01-b03
          speaker: charles
          text: |-
            不是。鲁珀特说过，可以照着一个人做蜡像，再往上面扎针。我倒想试试。我总觉得，《花之语》已经玩不下去了。也许不会永远这样，可咱们大张旗鼓地办过舅舅的献礼，扮过豹子，还种了H·D的F。做过这些大事，别的玩法都显得没劲了。
        - id: ch01-b04
          speaker: caroline
          text: |-
            可不能往蜡像上扎针！那一定是墨黑墨黑的魔法，又残忍，又不应该。
        - id: ch01-b05
          speaker: charles
          text: |-
            我没说非扎针不可。先把蜡像做出来，再决定往里扎什么。我已经攒了好大一团蜡。每天早晨，烛台会放在洗涤间的靴架上等着擦洗。我从里面抠了几个蜡烛头，还收了好多蜡烛上凸出来的小块。
        - id: ch01-b06
          speaker: narrator
          text: |-
            夏洛特提醒他，她和卡罗琳绝不会答应往蜡像里扎东西，而且他手里根本没有蜡。查尔斯这才得意地说，他早就开始攒了。两个姑娘一齐追问蜡从哪儿来。等查尔斯交代清楚，卡罗琳觉得，捏个东西倒也好玩。查尔斯马上趴到地上，从书架最底层的大书后面，摸出一团灰灰的半透明蜡。他还不许她们先告诉鲁珀特，非要等事情做成，让鲁珀特不得不相信。
        - id: ch01-b07
          speaker: charles
          text: |-
            咱们就做那个默德斯通。胳膊、腿和脑袋不用空，只把胸口做空。心脏要另外捏好，再装进去。每天把心拿出来熔一遍，他的心自然会软下来。他会向鲁珀特道歉，鲁珀特也会原谅他。
        - id: ch01-b08
          speaker: charlotte
          text: |-
            歌里不是唱着，“当空洞的心戴上面具……”吗？
        - id: ch01-b09
          speaker: caroline
          text: |-
            那是歌里的胡话。人的心一拿出来，人就会死。还是别把他做空，先做成实心，再慢慢想办法吧。
        - id: ch01-b10
          speaker: charlotte
          text: |-
            可他骨子里要是头猪，不管做得多实心，也还是头猪。咱们又不扎针，那做蜡像有什么用？
        - id: ch01-b11
          speaker: caroline
          text: |-
            我想到了！做好以后，咱们就对它好。野兽都能靠和善驯服。
        - id: ch01-b12
          speaker: charlotte
          text: |-
            不是说，和善会害死猫吗？
        - id: ch01-b13
          speaker: caroline
          text: |-
            害死猫的是操心，不是和善。再说，就算那话是真的，这个蜡人又不是猫。咱们尽管想些好事做在它身上。现在就开始吧。
        - id: ch01-b14
          speaker: charles
          text: |-
            那得由我来做！主意是我出的，蜡也是我攒的。
        - id: ch01-b15
          speaker: charlotte
          text: |-
            瞧你，像只攒蜡的老蜜蜂。好吧，你先动手。
    - id: ch02
      title: 默德斯通的蜡像
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: |-
            查尔斯一直把蜡拢在手里焐软。卡罗琳还没来得及取来报纸铺好，他已经迫不及待地分出了六块，说那是一个脑袋、两条胳膊、两条腿和一个身子。两个姑娘屏住呼吸，兴致勃勃地看着。最小的一块被搓成玻璃弹子，最大的一块像墙手球，其余四块则被搓成长条，仿佛四根粗烟斗。他把四根烟斗和圆弹子全粘到大球上，得意地举起作品。
        - id: ch02-b02
          speaker: charles
          text: |-
            简直像极了！尤其是打过鲁珀特的右胳膊。我真想只扎这一针。
        - id: ch02-b03
          speaker: caroline
          text: |-
            一针也不行。这个蜡人做得很不错，可它还没穿衣服呢。希腊英雄的雕像不穿衣服，可默德斯通又不是希腊英雄。现在的人做成雕像也得穿衣服。你看格莱斯顿先生。还该给它添上鼻子和耳朵，那才像真人。
        - id: ch02-b04
          speaker: charlotte
          text: |-
            找几根弯树枝，拿它们当他的身子，再给他裹上蜡衣服吧。查尔斯，让我们也做，光看着就有意思。只要你答应，蜡人做好以后，第一件对他好的事就由你来办。
        - id: ch02-b05
          speaker: charles
          text: |-
            我做的这个已经挺好，虽然它更像一只没长齐的章鱼。不过，既然好事让我先做，你们可以来帮忙。
        - id: ch02-b06
          speaker: narrator
          text: |-
            夏洛特跑去找树枝。找回来以后，三个人一块儿动手。没过多久，卡罗琳和查尔斯就停下来，只看夏洛特做。她好像真的知道该怎么办，另外两个人可不敢这样评价自己。她挑好合适的细枝，用一块块蜡粘成身架，再一点点给它穿衣服。上衣和背心很像样，裤子却做不好。连最高明的雕塑家都承认，裤子很难做得有艺术美。幸好他们记起，默德斯通上次穿的是灯笼短裤。短裤下面露着裹长袜的腿，大家都说，夏洛特这回做得比自己从前还好。
        - id: ch02-b07
          speaker: narrator
          text: |-
            脑袋也费了不少工夫。至于头发，扣上一顶宽大的鸭舌帽就解决了。蜡人终于有了鼻子、嘴巴，还有两只虽然大、但确实算得上耳朵的耳朵。两只手各有四根手指和一根拇指。夏洛特又把极小的蜡粒搓圆压扁，粘在上衣和背心上当纽扣。
        - id: ch02-b08
          speaker: caroline
          text: |-
            好极了！你跟普拉克西——那个叫什么的人一样厉害！
        - id: ch02-b09
          speaker: narrator
          text: |-
            就连查尔斯也承认，蜡人做得真不赖。夏洛特提议，第一件好事是让它睡在玫瑰花瓣铺成的床上。人们说一个人一辈子没有忧愁和烦恼，就会说他躺在玫瑰床上。卡罗琳还想从《花之语》里挑出含义合适的花草，给蜡人烧香。
        - id: ch02-b10
          speaker: charles
          text: |-
            玫瑰花瓣多没意思。真人默德斯通也许根本不喜欢香味。
        - id: ch02-b11
          speaker: charlotte
          text: |-
            真人默德斯通可以不喜欢，这个蜡人可不行。它非得喜欢咱们要它喜欢的东西。是咱们做出了它，当然只有咱们知道它应该喜欢什么。
        - id: ch02-b12
          speaker: charles
          text: |-
            那能不能叫它喜欢挨针扎？
        - id: ch02-b13
          speaker: charlotte
          text: |-
            能是能，可咱们才不做这种傻事。走吧，把《花之语》和默德斯通的蜡像带上。我找盒子，卡罗采玫瑰花瓣，然后到树林里选个不会被人发现的秘密地方。
    - id: ch03
      title: 玫瑰床和奇怪的香
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: |-
            夏洛特拿来装过自己最好那双鞋的硬纸盒。孩子们把芬芳的粉红花瓣铺满盒底，让蜡人躺进去。它站着的确好看些，可睡在床上哪有站着的道理？哪怕那是一张玫瑰床，也不能例外。他们又从废门房倒塌的猪圈搬来旧砖。旧砖很沉，他们费了不少力气才把它们搬到树林里，砌起一座台子。接着，三个人合力抬来一块平石压在上面，再把盒子安放在平石上。
        - id: ch03-b02
          speaker: narrator
          text: |-
            盒子外面印着一行蓝字，叫“斯马姆与辛普尔卫生鞋具”。姑娘们嫌它难看，查尔斯却觉得这行字在撒谎。于是三个人都开始为盒子的模样烦恼。
        - id: ch03-b03
          speaker: charles
          text: |-
            他不管是什么，反正绝不是鞋具。要是拿脚踩他，这行字倒能变成真的，可你们又不答应。
        - id: ch03-b04
          speaker: caroline
          text: |-
            咱们把我的绿腰带剪一块，贴在盒子上，再围一圈苔藓。那就更像树林里的东西了。
        - id: ch03-b05
          speaker: narrator
          text: |-
            厨娘给了浆糊，卡罗琳也真的剪开了自己的绿腰带。她把第一块丝绸涂得湿淋淋的，贴上去以后满是难看的水渍，显得乱七八糟。查尔斯一直在旁边看着，当然没有放过这个机会，马上把糟糕的样子指了出来。
        - id: ch03-b06
          speaker: caroline
          text: |-
            没关系，腰带还长着呢。我再剪一块，这次少抹点浆糊。
        - id: ch03-b07
          speaker: charlotte
          text: |-
            浆糊越多，速度越慢。剪我的吧，这样两条腰带还能一样长。
        - id: ch03-b08
          speaker: narrator
          text: |-
            两个姑娘重新动手。这回，丝绸稳稳贴住了。盒子显得十分华丽，四周的苔藓也又鲜嫩、又漂亮。孩子们又砌了一小堆砖，托住一只可可粉罐的盖子，那便是香炉。他们匆匆翻开《花之语》，查出茉莉代表和气，金丝桃代表敌意，印度石竹代表厌恶，琉璃繁缕代表改变，鼠尾草代表敬重，榛树代表和解。书上还说，柽柳代表罪行，马铃薯则代表仁慈。
        - id: ch03-b09
          speaker: narrator
          text: |-
            除了马铃薯，这些东西在奇妙花园里都有。三个孩子谁也不知道马铃薯长在地里时是什么模样，又不敢问人，怕别人反过来追问用途。查尔斯便说，午饭时留一个熟的也行。偏偏当天吃的是土豆泥。不过大家认为，这只算不走运，还称不上灾难。
        - id: ch03-b10
          speaker: narrator
          text: |-
            他们估量好分量，觉得这些土豆泥足以通过蜡像感化默德斯通，便把它藏进埃梅琳姨妈来信的信封。那枚意大利邮票早被查尔斯剪去收藏，信封上留下一个四方洞。好在从洞里漏进他口袋的土豆泥，连八分之一都没有。
        - id: ch03-b11
          speaker: caroline
          text: |-
            想让他有的品性，就摆在盒子周围。不想让他有的，就烧成香。
        - id: ch03-b12
          speaker: narrator
          text: |-
            查尔斯承认，他刚才一直想不通，土豆泥究竟能做成什么样的香。洁白如星的茉莉、鲜艳的印度石竹、明亮成簇的鼠尾草，还有边缘绕着椭圆纹路的榛叶，被摆在盒子四周，交织成一片好看的花草丛。查尔斯说，花草已经把“卫生鞋具”那行蓝字全遮住，根本用不着丝绸。姑娘们却一致认为，哪怕丝绸看不见，只要知道它藏在花草下面，就一样叫人满意。
        - id: ch03-b13
          speaker: narrator
          text: |-
            孩子们把这些象征好品性的花叶，一样样布置在蜡人周围。土豆泥和有些蔫了的琉璃繁缕不太好看，便被小心藏在那些更漂亮的供品下面。查尔斯退后仔细看了看，说这一切真气派。他说出口的，也正是三个孩子此刻共同的心声。
    - id: ch04
      title: 烧掉罪行和敌意
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: |-
            可是在露天里，要靠一盒火柴和姨妈来信留下的碎纸，点燃罐盖上几小片绿叶，实在太难了。何况那封从意大利寄来的信，已经让土豆泥弄得湿乎乎的。孩子们试了又试，最后只冒出一点烟，一根火柴头倒烧痛了查尔斯的手指。
        - id: ch04-b02
          speaker: charles
          text: |-
            没有纸了，只剩写着默德斯通名字的那一片。
        - id: ch04-b03
          speaker: caroline
          text: |-
            还有火柴盒。咱们先用细树枝生一小堆火，等它烧旺，再把香料放上去。
        - id: ch04-b04
          speaker: narrator
          text: |-
            孩子们真用细树枝生起一堆小火。等火烧旺，他们才把做香的花草放上去。这个办法果然成功了。金黄如星的金丝桃、鲜艳的印度石竹，还有长着羽毛般绿叶的柽柳，在火焰和浓烟里扭曲翻卷。
        - id: ch04-b05
          speaker: caroline
          text: |-
            默德斯通，请让你的罪行、敌意和厌恶统统烧掉。等你改变，变得和善，就请你真的睡上玫瑰床。等你真正有了仁慈之心，鲁珀特和我们都会敬重你。榛树是为了让大家和解。现在让香在这里施展治愈的力量吧。明天我们再换一床新花瓣，烧一炉新香。
        - id: ch04-b06
          speaker: narrator
          text: |-
            查尔斯和夏洛特都赞成。孩子们把写有默德斯通名字的标签贴在盒子上，免得命运假装弄错，不知道巫术是对谁施的。事情办妥以后，三个人排成一路纵队，穿过一片片浓绿的树荫，到树林另一头搭棚屋。他们带了三根啤酒花架杆、三条红毯子，还有三件雨衣。
        - id: ch04-b07
          speaker: charles
          text: |-
            但愿鲁珀特别追着问，咱们今天到底做了什么。
        - id: ch04-b08
          speaker: narrator
          text: |-
            鲁珀特却一个问题也没问。他回家后异乎寻常地沉默，早早上了床，还特意告诉大家，第二天仍要去彭福尔德先生那里待一天。
        - id: ch04-b09
          speaker: charlotte
          text: |-
            那就等大功告成以后再告诉他。这样最好。
        - id: ch04-b10
          speaker: narrator
          text: |-
            第二天，三个孩子抱着一大捧新鲜而含义合适的花草，又带上更多马铃薯。这回是煎土豆，上面还留着不少跟早餐培根亲密接触过的油迹。他们满心期待地来到秘密地点。焚香火堆的灰烬还在，砖台还在，蒙着绿丝绸的盒子也还在。盒里也还剩着半盒半蔫的玫瑰花瓣。可是默德斯通的蜡像不见了。
        - id: ch04-b11
          speaker: charlotte
          text: |-
            一定是默德斯通自己来取走了。他准是感觉到咱们在做什么，便下定决心，要变得仁慈。他拿走蜡像，是不愿意让咱们再把好好的土豆浪费在他身上。
        - id: ch04-b12
          speaker: charles
          text: |-
            我希望他做点什么，叫咱们看出他成了真正的好人，也看出他究竟是哪一种好人。
        - id: ch04-b13
          speaker: narrator
          text: |-
            魔法做完了，却不知道它究竟怎样起效，实在叫人心烦。当然，孩子们绝不怀疑魔法已经灵验。你也知道，他们施过的魔法太多了，从不会有哪怕一刻，怀疑自己的咒语有没有用。至于这次的做法没有完全照书上写的来，他们同样一点也不在意。
        - id: ch04-b14
          speaker: caroline
          text: |-
            既然蜡人能害人，就也能帮人。我想，帮人的效力还会更强。因为害人是错的，帮人是对的。
    - id: ch05
      title: 魔法怎样灵验
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: |-
            尽管这么说，三个孩子离开秘密地点、走进绿林时，还是十分失望。被踩倒的花和散落的灰烬留在身后。他们偶然走到昨天搭的棚屋，便在那里消磨了余下的上午。午饭铃一响，大家才把昨天遗忘的三件雨衣和三条毯子全背到身上，拖着这些东西向家里走去。
        - id: ch05-b02
          speaker: narrator
          text: |-
            他们拖着东西走出树林，踏上通往宅子的车道。查尔斯走在最前面，忽然把毯子往地上一丢，猛地停住。林间小路很窄，他恰好站在路当中，把跟在后面的两个姑娘的视线全挡住了。
        - id: ch05-b03
          speakers: [caroline, charlotte]
          ensemble: duo
          text: |-
            怎么了？你看见什么了？
        - id: ch05-b04
          speaker: charles
          text: |-
            嘘，别出声！
        - id: ch05-b05
          speaker: narrator
          text: |-
            查尔斯倒退着躲进榛树丛。两个姑娘挤上前，想知道他为什么叫她们安静。下一刻，她们也退进浓绿的灌木。树枝在身后合拢，三个孩子站在里面，全都屏住了呼吸。脚步声顺着车道，从他们面前走了过去。他们一直等到脚步声走得足够远，才敢动一动。
        - id: ch05-b06
          speaker: narrator
          text: |-
            孩子们不约而同地退向树林深处，一步也不停，直到来到一块开阔的林间空地。到了这里，大家终于可以自在地互相望着，惊叹一声：“哎呀！”他们惊讶得失去了说别的话的本领。除此之外，谁也挤不出更多话来。
        - id: ch05-b07
          speaker: narrator
          text: |-
            原来，他们刚才看见鲁珀特沿车道走来。他脸色苍白，却并不显得难过。走在旁边的，正是默德斯通。他把一只手搭在鲁珀特肩上，亲亲热热地跟鲁珀特说着话。
        - id: ch05-b08
          speaker: caroline
          text: |-
            这一下，鲁珀特非相信不可了！
          emotion: surprised
        - id: ch05-b09
          speakers: [charlotte, charles]
          ensemble: duo
          text: |-
            可不是！
          emotion: surprised
