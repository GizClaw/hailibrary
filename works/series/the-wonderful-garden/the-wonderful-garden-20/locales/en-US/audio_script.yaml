audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm, observant storytelling with a gently amused touch
        timbre: clear and rounded
        pace: measured
        pitch: medium
    caroline:
      display_name: Caroline
      tts:
        delivery: lively, affectionate, and increasingly careful when being polite
        timbre: bright and clear
        pace: medium
        pitch: medium-high
    charlotte:
      display_name: Charlotte
      tts:
        delivery: eager, curious, and quick with an idea
        timbre: light and energetic
        pace: brisk
        pitch: high
    charles:
      display_name: Charles
      tts:
        delivery: proud, teasing, and boyishly direct
        timbre: youthful and crisp
        pace: medium-fast
        pitch: medium-high
  chapters:
    - id: ch01
      title: The Waxen Man
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: One day Rupert was away at Mr. Penfold's, as usual. Charles reminded the girls of something Rupert had once said about doing something real with their magic.
        - id: ch01-b02
          speaker: charlotte
          text: You mean making Dame Eleanour come alive?
        - id: ch01-b03
          speaker: narrator
          text: Charlotte glanced up at Dame Eleanour's picture.
        - id: ch01-b04
          speaker: charles
          text: No. I mean making a wax person and sticking pins into it. I'd like to try that. Somehow, the Language Of doesn't feel as if it's working anymore.
        - id: ch01-b05
          speaker: caroline
          text: Oh, Charles, don't say that.
          emotion: sad
        - id: ch01-b06
          speaker: narrator
          text: Caroline looked hurt, so Charles softened what he had said.
        - id: ch01-b07
          speaker: charles
          text: Perhaps it isn't broken forever. But we gave Uncle such a tremendous celebration for his presentation. Then there was the leopard, and we planted the F. of H.D. Anything else feels rather small after all that. I wish we could make somebody out of wax.
        - id: ch01-b08
          speaker: caroline
          text: We mustn't put pins in it. I'm certain that would be the blackest kind of magic. Besides, it would be terribly cruel and wrong.
        - id: ch01-b09
          speaker: charles
          text: I didn't say we had to use pins. We could make the figure first and decide later what to put into it.
        - id: ch01-b10
          speaker: charlotte
          text: Caro and I won't agree to putting anything into it. Anyway, you haven't any wax.
        - id: ch01-b11
          speaker: charles
          text: Yes, I have! I've been saving it ever since Rupert told us about wax images.
        - id: ch01-b12
          speakers: [caroline, charlotte]
          ensemble: duo
          text: Where did you get it?
        - id: ch01-b13
          speaker: charles
          text: From the bits that stick out of candles. I took one or two candle ends, too, when they were left on the scullery boot shelf to be cleaned. I've got quite a large lump now. Shall I fetch it?
        - id: ch01-b14
          speaker: caroline
          text: Well, it would be fun to model something.
        - id: ch01-b15
          speaker: narrator
          text: Charles dropped flat on his stomach and reached behind the big books on the lowest shelf. Out came a large ball of gray, half-transparent wax.
        - id: ch01-b16
          speaker: charles
          text: Here it is. Now listen to my plan, and don't tell Rupert. We'll do it first and tell him afterward. Then he'll have to believe us.
        - id: ch01-b17
          speaker: charlotte
          text: All right. What's the plan?
        - id: ch01-b18
          speaker: charles
          text: We'll make the Murdstone man out of wax. His arms, legs, and head can be solid, but we'll leave his chest hollow. Then we'll make a heart, put it inside, and take it out every day to melt it. That ought to soften his heart. He'll say he's sorry, and Rupert will forgive him.
        - id: ch01-b19
          speaker: charlotte
          text: When hollow hearts shall wear a mask.
        - id: ch01-b20
          speaker: caroline
          text: That's only nonsense from a song. People die when you take out their hearts. I know they do.
        - id: ch01-b21
          speaker: charles
          text: Then we'll make him solid and decide what to do afterward.
        - id: ch01-b22
          speaker: charlotte
          text: But if he's a pig, he'll still be a pig, however solid we make him. What's bred in the bone will come out in the wash. And if we can't stick pins in him, what's the use?
        - id: ch01-b23
          speaker: caroline
          text: Wait, I know! We'll make the figure and be kind to it. Kindness can tame wild animals.
        - id: ch01-b24
          speaker: charlotte
          text: Kindness kills cats.
        - id: ch01-b25
          speaker: caroline
          text: No, Care killed the cat. And this won't be a cat, even if kindness did it. We'll think of pleasant things to do for the figure. Let's start now.
        - id: ch01-b26
          speaker: charles
          text: I claim the modeling! The idea was mine, and I collected all the wax.
        - id: ch01-b27
          speaker: charlotte
          text: Like an old bee. Very well, get started.
        - id: ch01-b28
          speaker: narrator
          text: Charles had been warming the wax in his hands. Caroline barely had time to fetch a newspaper and spread it out before he divided the lump into six pieces.
        - id: ch01-b29
          speaker: charles
          text: One for the head, two for the arms, two for the legs, and one for the body.
        - id: ch01-b30
          speaker: narrator
          text: The girls watched without taking their eyes off him. Charles rolled the smallest piece into a marble and the largest into a fives ball. He rolled the other four into long, thick shapes like tobacco pipes. Then he stuck the four long pieces and the little round head onto the body and proudly held up the result.
        - id: ch01-b31
          speaker: charles
          text: It looks wonderfully like him, especially the right arm he used to hit Rupert. I would like to put just one pin into that arm.
        - id: ch01-b32
          speaker: caroline
          text: You mustn't. The figure is very nice, but it needs clothes. Greek heroes may have statues without clothes, but this man isn't a Greek hero. People nowadays have clothes on their statues. Just look at Mr. Gladstone. And wouldn't it seem more real with a nose and ears?
        - id: ch01-b33
          speaker: charlotte
          text: Let's use bent twigs for the man underneath and put wax clothes over them. Please let us help, Charles. It looks so interesting. If you do, you may choose the first kind thing we do for him.
        - id: ch01-b34
          speaker: narrator
          text: Charles studied his lumpy creature. It looked more like a badly made octopus than a man, though Charles himself was satisfied.
        - id: ch01-b35
          speaker: charles
          text: I think he's fine already. Still, if I really get the first choice, you may help.
        - id: ch01-b36
          speaker: charlotte
          text: Right! I'll fetch the sticks.
        - id: ch01-b37
          speaker: narrator
          text: Once they had the sticks, all three children began modeling the Murdstone man. Before long, Caroline and Charles gave up their own efforts and watched Charlotte instead. She seemed to understand the work, which was more than either of them could say for themselves.
        - id: ch01-b38
          speaker: narrator
          text: Charlotte chose the right twigs, joined them with bits of wax, and covered them in wax clothing. Soon the figure had something very like a jacket and waistcoat. The trousers failed completely. Even the finest sculptors have admitted that trousers are hard to make artistic.
        - id: ch01-b39
          speaker: narrator
          text: Then the children remembered that the Murdstone man had worn knickerbockers the last time they saw him. Those showed the shape of his stockinged legs, and everyone agreed that Charlotte had surpassed herself. The head was harder still, but she managed it. A large flat cap with a peak solved the problem of his hair.
        - id: ch01-b40
          speaker: narrator
          text: The finished man had a nose and mouth. His ears were large, but they were certainly ears, and each hand had four fingers and a thumb. At last Charlotte rolled the tiniest crumbs of wax flat and pressed them onto the coat and waistcoat as buttons.
        - id: ch01-b41
          speaker: caroline
          text: Bravo! You're as good as Praxi—whatever his name is!
          emotion: happy
        - id: ch01-b42
          speaker: charles
          text: That's not half bad.
        - id: ch01-b43
          speaker: charlotte
          text: The first kind thing should be putting him in a bed of rose leaves. People say that means a life with no sorrow or care.
        - id: ch01-b44
          speaker: caroline
          text: After that, we'll burn incense. We can make proper incense from flowers.
        - id: ch01-b45
          speaker: charles
          text: Rose leaves are dull. And perhaps the Murdstone man doesn't even like incense.
        - id: ch01-b46
          speaker: charlotte
          text: The real man might not, but this one must like whatever we decide he likes. We made him, so we know what he has to like.
        - id: ch01-b47
          speaker: charles
          text: Then couldn't we decide that he likes being stuck with pins?
        - id: ch01-b48
          speaker: charlotte
          text: We could, but we won't be so silly. Bring the Language Of and the Murdstone man. I'll find a box, and Caro can gather rose leaves. Then we'll choose a secret place in the wood.
        - id: ch01-b49
          speaker: narrator
          text: They filled the cardboard box from Charlotte's best shoes with sweet pink petals and laid the waxen man inside. He looked better standing, but no one stands up in bed, even in a bed of roses.
        - id: ch01-b50
          speaker: narrator
          text: In the wood, the children built a kind of pedestal. With great effort they carried old bricks from the ruined pigsty beside the deserted lodge. All three of them had to lift the flat stone that went on top. Then they placed the box on the stone.
        - id: ch01-b51
          speaker: narrator
          text: Blue letters on the box said, "Smarm and Simple's Hygienic Footwear." Its ugliness troubled the girls, while the untruth of it troubled Charles.
        - id: ch01-b52
          speaker: charles
          text: Whatever this man may be, he is not footwear. We could make the label true by trampling on him, but you two won't allow that.
        - id: ch01-b53
          speaker: caroline
          text: No, but I have another idea. We'll paste some of my green sash over the box, then arrange moss around it. That will make it belong in the woods.
        - id: ch01-b54
          speaker: narrator
          text: Cook supplied the paste, and Caroline cut the sash. She soaked the first piece of silk with so much paste that it dried in wet-looking spots. Charles was quick to point out how messy it looked.
        - id: ch01-b55
          speaker: caroline
          text: Never mind. The sash is far too long, so I'll cut another piece and use less paste this time.
        - id: ch01-b56
          speaker: charlotte
          text: More paste, less speed. I'll cut a piece from mine. Then the two sashes will match, just as they did before.
        - id: ch01-b57
          speaker: narrator
          text: The second attempt made the box look very rich indeed, and the fresh moss around it was beautiful. Nearby, they made a smaller brick stand and set the lid of a cocoa tin on top. That was where the incense would burn.
        - id: ch01-b58
          speaker: narrator
          text: They hurriedly opened The Language of Flowers. It told them that jasmine meant amiability. Saint John's wort meant animosity, Indian pink meant aversion, pimpernel meant change, sage meant esteem, and hazel meant reconciliation. Tamarisk stood for crime, while potato stood for benevolence.
        - id: ch01-b59
          speaker: narrator
          text: Everything on the list grew in the Wonderful Garden except the potato. None of the children knew what a potato plant looked like, and they dared not ask. Whoever they asked might want to know why they needed one.
        - id: ch01-b60
          speaker: charles
          text: That doesn't matter. We can save a potato from dinner. I don't suppose it matters if it's cooked.
        - id: ch01-b61
          speaker: narrator
          text: By bad luck, dinner that day included mashed potatoes. Still, the children decided that was a mishap, not a disaster. They took enough mash to influence Mr. Murdstone through his wax figure and hid it in an envelope from Aunt Emmeline. Only about an eighth escaped into Charles's pocket through the square hole where he had cut out the Italian stamp for his collection.
        - id: ch01-b62
          speaker: caroline
          text: We'll put the things we want him to become around the box. We'll burn the things we want him to stop being and call that the incense.
        - id: ch01-b63
          speaker: narrator
          text: Charles admitted that he had been wondering what sort of incense anyone could make from mashed potato.
        - id: ch01-b64
          speaker: narrator
          text: Around the box they wound a lovely tangle of white, starry jasmine, bright Indian pinks, gay sage, and hazel leaves marked with oval rings.
        - id: ch01-b65
          speaker: charles
          text: We didn't really need the silk. With all these flowers, no one would ever see the words about hygienic boots.
        - id: ch01-b66
          speaker: narrator
          text: The girls agreed that even if the silk could not be seen, it was pleasant to know it was there. They carefully hid the mashed potato and the rather faded pimpernel under the prettier offerings.
        - id: ch01-b67
          speaker: charles
          text: It looks splendid.
        - id: ch01-b68
          speaker: narrator
          text: All three of them thought so.
        - id: ch01-b69
          speaker: narrator
          text: Making little green leaves burn outdoors in a cocoa-tin lid is very difficult. A box of matches and scraps of a potato-dampened envelope from an aunt in Italy did not help much. They produced plenty of smoke, and one match head burned Charles's finger, but that was all.
        - id: ch01-b70
          speaker: charles
          text: We haven't any paper left, except the piece with his name on it.
        - id: ch01-b71
          speaker: caroline
          text: We still have the matchbox. Let's use twigs to make a little bonfire. Once it's burning, we can put the incense plants on top.
        - id: ch01-b72
          speaker: narrator
          text: That was what they did. The golden stars of Saint John's wort, the bright Indian pinks, and the feathery green tamarisk twisted in the flames and smoke.
        - id: ch01-b73
          speaker: caroline
          text: Now we'll leave you here. Please, Murdstone man, let the fire burn away your crimes, your animosity, and your aversion. Once you have changed and become amiable, may you truly lie on beds of roses. When you are benevolent at last, Rupert and all of us will esteem you, and the hazel will bring reconciliation. We shall go now and let the incense heal you. Tomorrow we'll bring a fresh bed of roses and burn more incense.
        - id: ch01-b74
          speaker: narrator
          text: The others agreed. They put a label bearing the Murdstone man's name on the box, so Destiny could not pretend to mistake the person their witchcraft was meant for. Then they walked single file through the green thickets to another part of the wood. There they built a wigwam from three hop poles, three red blankets, and their three mackintoshes.
        - id: ch01-b75
          speaker: charles
          text: I hope Rupert doesn't ask too many questions about what we've done today.
        - id: ch01-b76
          speaker: narrator
          text: Rupert asked none. He came home strangely quiet, went to bed early, and announced that he would spend the next day with Mr. Penfold as well.
        - id: ch01-b77
          speaker: charlotte
          text: Good. We needn't tell him until our work succeeds. I'm glad of that.
        - id: ch01-b78
          speaker: narrator
          text: The following day, the children gathered another armful of suitable flowers and brought more potatoes. These were fried and carried strong signs of having been close to the breakfast bacon. Then they returned to the secret place where they had left Mr. Murdstone's wax image on its rose bed.
        - id: ch01-b79
          speaker: narrator
          text: The ashes of the incense fire were still there. So were the pedestal and the green-covered box, still half full of fading rose leaves. But the waxen man had vanished.
        - id: ch01-b80
          speaker: narrator
          text: For a moment, all three children stood silent in awe. Charlotte was the first to speak.
        - id: ch01-b81
          speaker: charlotte
          text: The Murdstone man must have come for it himself. He must have felt our magic and decided to become benevolent. He took the figure away so we wouldn't waste any more good potatoes on him.
          emotion: surprised
        - id: ch01-b82
          speaker: charles
          text: I wish he'd show us that he has changed into a Real Good. I'd like to know what kind of Good he has become.
        - id: ch01-b83
          speaker: narrator
          text: It is tiresome to work magic and never find out exactly what it has done. Of course, the children had no doubt that their spell had worked. They had performed magic far too often to wonder whether a spell of theirs would succeed. Nor did it bother them that this spell was not quite the one described in the book.
        - id: ch01-b84
          speaker: caroline
          text: If magic can hurt wax people, then it can help them too. I should think it can help them even more, because hurting is wrong and helping is right.
        - id: ch01-b85
          speaker: narrator
          text: Even so, the three children were disappointed as they left the hidden place, with its trampled flowers and scattered ashes. They found the wigwam and spent the rest of the morning there. When the dinner bell rang, they gathered up the mackintoshes and blankets they had forgotten the day before.
        - id: ch01-b86
          speaker: narrator
          text: They trailed out of the wood toward the drive. Charles went first. Suddenly he dropped his blanket and stopped, blocking the narrow path so the girls could not see ahead.
        - id: ch01-b87
          speakers: [caroline, charlotte]
          ensemble: duo
          text: What is it? What can you see?
        - id: ch01-b88
          speaker: charles
          text: Shish! Keep quiet!
        - id: ch01-b89
          speaker: narrator
          text: Charles backed into the hazel bushes. The girls pushed forward just far enough to see why he had hushed them, then backed into the green cover too. The bushes closed around the children. They held their breath while footsteps passed along the drive.
        - id: ch01-b90
          speaker: narrator
          text: When the footsteps had gone far enough, all three retreated deeper into the wood. They did not stop until they reached an open glade where they could look at one another.
        - id: ch01-b91
          speakers: [caroline, charlotte, charles]
          ensemble: chorus
          text: Well, would you look at that!
          emotion: surprised
        - id: ch01-b92
          speaker: narrator
          text: No one could manage another word. They had seen Rupert walking up the drive, pale but not unhappy. Beside him was the Murdstone man, with one hand on Rupert's shoulder, talking to him in the friendliest way.
        - id: ch01-b93
          speaker: caroline
          text: Now Rupert will have to believe us!
          emotion: surprised
        - id: ch01-b94
          speakers: [charlotte, charles]
          ensemble: duo
          text: Yes, he certainly will!
          emotion: surprised
