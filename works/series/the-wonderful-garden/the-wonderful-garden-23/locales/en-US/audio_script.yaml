audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm, observant storytelling with a gently amused touch
        timbre: clear and rounded
        pace: measured
        pitch: medium
    caroline:
      display_name: Caroline
      tts:
        delivery: lively, affectionate, and increasingly careful when being polite
        timbre: bright and clear
        pace: medium
        pitch: medium-high
    charlotte:
      display_name: Charlotte
      tts:
        delivery: eager, curious, and quick with an idea
        timbre: light and energetic
        pace: brisk
        pitch: high
    charles:
      display_name: Charles
      tts:
        delivery: proud, teasing, and boyishly direct
        timbre: youthful and crisp
        pace: medium-fast
        pitch: medium-high
    rupert:
      display_name: Rupert Wix
      tts:
        delivery: blunt and gloomy at first, warming quickly among friends
        timbre: youthful and slightly husky
        pace: medium
        pitch: medium-high
    uncle_charles:
      display_name: Uncle Charles
      tts:
        delivery: scholarly, restrained, and dryly patient
        timbre: mellow and thoughtful
        pace: measured
        pitch: medium-low
    eleanour:
      display_name: Eleanour
      tts:
        delivery: gracious, luminous, and gently commanding
        timbre: clear and silvery
        pace: slow and flowing
        pitch: medium-high
  chapters:
    - id: ch01
      title: The End
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: It was a tragedy. The three C.'s had measles, with Lord Andore's party and Rupert's return both set for the week after next. Charles had only a bad ordinary cold, but everyone suspected measles. Mrs. Wilmington kept him away from draughts, took him on walks, and would not let him bathe. He was bored beyond words. The girls were almost better off in bed, as jelly led to beef tea, then fish and chicken, and finally proper beef and pudding and breakfast downstairs.
        - id: ch01-b02
          speaker: narrator
          text: The three were reunited on the very day of Lord Andore's party, but they could not go for fear of chills. After tea, Charles carefully shut the dining-room door.
        - id: ch01-b03
          speaker: charles
          text: I have something to confess.
        - id: ch01-b04
          speakers: [caroline, charlotte]
          ensemble: duo
          text: Well? Go on.
        - id: ch01-b05
          speaker: narrator
          text: Charles had stopped, and seemed unlikely ever to begin again.
        - id: ch01-b06
          speaker: charles
          text: Once I tell you, I don't suppose either of you will ever speak to me again.
        - id: ch01-b07
          speaker: charlotte
          text: Don't copy Rupert. If you've really done something, tell us. You know we'll stand by you.
        - id: ch01-b08
          speaker: charles
          text: I'm very sorry, and I hope I haven't ruined everything. You don't know how sick I was of being alone, with Wilmington fussing and Uncle buried in his books every minute. One day I couldn't bear it any longer, so I did it.
        - id: ch01-b09
          speaker: caroline
          text: Did what, dear?
        - id: ch01-b10
          speaker: charles
          text: I looked behind the curtain.
          emotion: sad
        - id: ch01-b11
          speaker: charlotte
          text: I might have known you would. That's just like you. I'll never do magic with you again.
          emotion: angry
        - id: ch01-b12
          speaker: charles
          text: Oh yes, make me feel worse.
        - id: ch01-b13
          speaker: caroline
          text: I expect you have spoiled it all. Oh, Charles, how could you?
          emotion: sad
        - id: ch01-b14
          speaker: charles
          text: I'm sorrier than you are, because the magic had started. She was gone from the frame.
          emotion: sad
        - id: ch01-b15
          speakers: [caroline, charlotte]
          ensemble: duo
          text: Gone?
          emotion: surprised
        - id: ch01-b16
          speaker: charles
          text: Completely gone. It was black behind the curtain. She wasn't there.
        - id: ch01-b17
          speaker: caroline
          text: Are you certain?
        - id: ch01-b18
          speaker: charles
          text: Certain sure.
        - id: ch01-b19
          speaker: narrator
          text: Both girls sprang toward the curtain, but Charles caught an arm of each and stopped them.
        - id: ch01-b20
          speaker: charles
          text: Don't! Wait. I've thought about this a lot. There was nothing else for me to do.
        - id: ch01-b21
          speaker: charlotte
          text: Poor old Charles. I'm sorry I snapped at you. Still, it is aggravating, isn't it?
        - id: ch01-b22
          speaker: charles
          text: Not for you. You haven't looked behind the curtain or broken your part of the magic. You'll see her. I'm the one who won't.
        - id: ch01-b23
          speaker: caroline
          text: Perhaps your looking broke the spell, and she's back now.
        - id: ch01-b24
          speaker: narrator
          text: Caroline reached for the curtain.
        - id: ch01-b25
          speaker: charles
          text: Don't! The spell kept going. I looked again to see, and she still wasn't there.
          emotion: fearful
        - id: ch01-b26
          speaker: caroline
          text: How many times have you looked?
        - id: ch01-b27
          speaker: charles
          text: Every day since.
        - id: ch01-b28
          speaker: caroline
          text: And when was the first time?
        - id: ch01-b29
          speaker: charles
          text: The day you went to bed. She was gone then, and she's gone now. Please don't tease me about it. Not seeing her is punishment enough.
          emotion: sad
        - id: ch01-b30
          speaker: caroline
          text: We won't. But you won't look again, will you?
        - id: ch01-b31
          speaker: charles
          text: I won't want to, now that you're back.
        - id: ch01-b32
          speaker: narrator
          text: That compliment melted both sisters' hearts. Nothing more was said about Charles's dreadful peeping.
        - id: ch01-b33
          speaker: narrator
          text: The next day, Uncle Charles asked whether Caroline and Charlotte would dust the drawing room.
        - id: ch01-b34
          speaker: uncle_charles
          text: Mrs. Wilmington is going to Lord Andore's fête, and she has a great deal to do.
        - id: ch01-b35
          speaker: narrator
          text: Mrs. Wilmington gave them the key, and the girls dusted with great care. Charles tried to help, but he was no expert with a duster. He preferred watching the mandarin's slow old nod, painted smile, and crossed china hands.
        - id: ch01-b36
          speaker: charlotte
          text: Just think! Wilmington is going, and the Mineral woman, and Rupert, and everyone except us.
          emotion: sad
        - id: ch01-b37
          speaker: caroline
          text: Never mind. We still have the Flower of Heart's Desire, and Rupert will be back. Remember all the grapes Lord Andore sent, and the chocolates from Mr. Alphabet.
        - id: ch01-b38
          speaker: narrator
          text: Caroline moved an old silk handkerchief across the marble top of a large console table. Mrs. Wilmington thought the drawing room too sacred for any cloth but silk. Then Caroline noticed something that was not usually there. It was a square parcel like a letter, tied with braided green-and-white silk. One green seal closed it, and another hung from the ribbon.
        - id: ch01-b39
          speaker: caroline
          text: Look, Char. Isn't this strange? It looks terribly old, as if it's written on vellum. And that seal has Uncle's coat of arms.
        - id: ch01-b40
          speaker: charlotte
          text: Let's take it to Uncle. Why, what's wrong?
        - id: ch01-b41
          speaker: narrator
          text: Caroline held out the letter. Her hand and her voice were both trembling.
        - id: ch01-b42
          speaker: caroline
          text: Look! It has our names on it!
          emotion: surprised
        - id: ch01-b43
          speaker: narrator
          text: And it did. On the square parchment, in strange but readable writing and ink faded by many years, were the names Caroline, Charlotte, and Charles.
        - id: ch01-b44
          speaker: charlotte
          text: You open it, Caro.
        - id: ch01-b45
          speaker: charles
          text: Yes, Caro. You do it.
        - id: ch01-b46
          speaker: narrator
          text: It seemed a shame to break the green seals. They were glad the braided silk slipped off when the letter was bent a little, though one seal still had to be broken. The parchment crackled in Caroline's uncertain hands. Inside were lines in the same clear, strange hand and the same faded ink.
        - id: ch01-b47
          speaker: narrator
          text: At eight o'clock, they were to lean on the marble table and look into the mirror. There they would see and speak with their kinswoman Eleanour. They must look only in the mirror, say nothing, and wear pink verbena behind their ears and roses over their hearts.
        - id: ch01-b48
          speaker: charles
          text: Then I didn't spoil it, not even for myself. The letter is for me as well as both of you.
        - id: ch01-b49
          speaker: caroline
          text: Yes, but you'd better stand between us, Charles. And you mustn't turn around.
        - id: ch01-b50
          speaker: charles
          text: As if I would even think of it!
        - id: ch01-b51
          speaker: narrator
          text: At five minutes to eight that evening, the three C.'s stood before the console table. Pink verbena was tucked behind their ears, and red roses lay over their hearts. Mrs. Wilmington had arranged the dining-room vases that morning, and by a curious chance she had chosen those very flowers.
        - id: ch01-b52
          speaker: charlotte
          text: The magic must be strong if it made her choose those. Secrecy and family reunion.
        - id: ch01-b53
          speaker: narrator
          text: The evening room was neither dark nor quite light. Charles stood safely between his sisters. All three kept perfectly still and waited.
        - id: ch01-b54
          speaker: narrator
          text: Then, surely and plainly, they saw the door to Uncle's secret staircase open in the looking glass. A lady came through in trailing velvet. She was the lady from the picture. They knew her ruff and coif, her darkly flashing jewels, and her softly shining eyes. For weeks they had seen them every day inside the carved frame in the dining room.
        - id: ch01-b55
          speaker: narrator
          text: Charles immediately tried to turn around, but his sisters caught him with their arms around his neck. The lady glided to a place where she could look through the mirror and straight into the children's eyes.
        - id: ch01-b56
          speaker: eleanour
          text: I am here. Do not move or speak. I came because you believed in old and beautiful things. You searched for my books and found them. You also tried to use their magic to help the poor and needy, and to bring peace between those who quarrelled. So now you see what you wished to see. When the flowering time comes, you shall have your heart's desire.
          emotion: calm
        - id: ch01-b57
          speaker: eleanour
          text: Stay still and silent, or the spell will break. I shall sing to you. When the last note fades, close your eyes and count very slowly to twenty-seven. That is the number of years your kinswoman Eleanour lived on earth.
          emotion: calm
        - id: ch01-b58
          speaker: narrator
          text: The beautiful figure moved to the harp, which they could also see within the mirror's tarnished golden frame. She sat on a faded needlework chair and drew the golden harp toward her. Then she sang softly in the same starry voice.
        - id: ch01-b59
          speaker: narrator
          text: The children did not know the language. Charles later said it was Latin, though it sounded unlike any Latin the girls had heard. The music was starry too. Its meaning seemed full of love and parting, hope and noble dreams, and the longing for great and good things. It made them deeply happy, yet ready to cry. Her voice softened. The gentle, ringing harp softened with it. Then the song ended.
        - id: ch01-b60
          speaker: eleanour
          text: Now, farewell!
          emotion: sad
        - id: ch01-b61
          speaker: narrator
          text: The children closed their eyes. Caroline covered Charles's hand to make sure. But the song and the beautiful mystery had moved him so deeply that he hardly wriggled. Behind them came a soft rustle. Very slowly, all three counted from one to twenty-seven. Caroline held Charlotte's hand. At the end, one long squeeze and another in reply told each sister that the other had finished.
        - id: ch01-b62
          speaker: narrator
          text: They opened their eyes and turned. The drawing room was empty. It seemed impossible, but it was true.
        - id: ch01-b63
          speaker: charles
          text: It's all over.
          emotion: sad
        - id: ch01-b64
          speaker: caroline
          text: But we've seen her.
        - id: ch01-b65
          speaker: charlotte
          text: And we've heard her.
        - id: ch01-b66
          speaker: charles
          text: Yes. I mean to be good every minute for the rest of my life. I wish Rupert had been here. He would never do anything wrong again either, like that time when he—
        - id: ch01-b67
          speaker: charlotte
          text: Remembering what other people did wrong is wrong too. Come on. Let's go back to the dining room. It feels lonely here without her.
        - id: ch01-b68
          speaker: narrator
          text: They returned to the dining room and talked over the great mystery in almost-whispers until bedtime.
        - id: ch01-b69
          speaker: charlotte
          text: Tomorrow we can go outside. And the Flower of Heart's Desire ought to be blooming. We planted it exactly seven weeks ago.
        - id: ch01-b70
          speaker: caroline
          text: Of course we did. Don't speak as if only you remembered. If you had to name your heart's desire, what would it be?
        - id: ch01-b71
          speaker: charlotte
          text: To see her again, and hear her starry voice.
        - id: ch01-b72
          speaker: narrator
          text: The moment they entered the dining room next morning, the three began debating the curtain. Should it come down? The girls wanted to leave it and hang fresh garlands every day while they remained at the Manor House. But during the measles, Charles had faithfully put up fresh flowers each day, though they were not always made into garlands. He had had enough.
        - id: ch01-b73
          speaker: charles
          text: She's had enough too. The flowers were meant to bring her, and she came. She won't come back if you keep hanging garlands forever.
        - id: ch01-b74
          speaker: narrator
          text: For once, Uncle Charles joined them at breakfast, so Charles appealed to him.
        - id: ch01-b75
          speaker: charles
          text: We saw her yesterday. She truly came. The charm has worked, so we shouldn't keep putting up garlands, should we?
        - id: ch01-b76
          speaker: uncle_charles
          text: You truly saw her?
        - id: ch01-b77
          speaker: narrator
          text: The children told him many things. Uncle Charles listened to all of them before he answered.
        - id: ch01-b78
          speaker: uncle_charles
          text: Then I think we may draw back the curtain. The magic has done its work. Everything should now be returned to its former state.
        - id: ch01-b79
          speaker: charles
          text: I told you so.
        - id: ch01-b80
          speaker: uncle_charles
          text: Shall I take the curtain down?
        - id: ch01-b81
          speakers: [caroline, charlotte, charles]
          ensemble: chorus
          text: Yes!
        - id: ch01-b82
          speaker: narrator
          text: Uncle Charles pulled the green folds. The curtain and yesterday's drooping flowers fell together in a heap. The picture stood uncovered. From the frame, the lady's lips almost smiled, and her beautiful eyes looked down at them with a new meaning.
        - id: ch01-b83
          speaker: caroline
          text: But she'll never speak to us again.
          emotion: sad
        - id: ch01-b84
          speaker: charlotte
          text: Or sing to us.
          emotion: sad
        - id: ch01-b85
          speaker: charles
          text: Or tell us to count slowly to twenty-seven.
          emotion: sad
        - id: ch01-b86
          speaker: uncle_charles
          text: Still, it means something to have seen her, even if it happened only once, doesn't it?
        - id: ch01-b87
          speaker: narrator
          text: Nothing Mrs. Wilmington said could break the spell of such a wonderful adventure. She offered empty explanations. The portrait had been lent to an exhibition of famous local people, she said, and returned very late the night before after the servants had gone to bed. A gentleman had brought Mr. Alphabet's love. A great London actress had appeared in Lord Andore's pageant, dressed like the portrait and listed in the silver-printed programme as Dame Eleanour. Mrs. Wilmington could show it to them.
        - id: ch01-b88
          speaker: caroline
          text: I daresay Wilmington's story is true, but it changes nothing. Our Lady wasn't dressed to resemble the portrait. She was the picture. Perhaps our heart's desire really will be to see her again. Let's find out whether the seed has flowered.
        - id: ch01-b89
          speaker: narrator
          text: It had. In the terraced garden, where the old gardener had left his pencilled marker, seven tall, straight stems had risen. Every leaf and stalk was perfect and even, as all plants were in that wonderful soil. Each stem carried one white, star-shaped flower with a strange sweet scent.
        - id: ch01-b90
          speaker: charlotte
          text: I wish Rupert were here. We ought to wait for him.
        - id: ch01-b91
          speaker: narrator
          text: As Charlotte spoke, Rupert came toward them through the flowers of the lower garden.
        - id: ch01-b92
          speaker: rupert
          text: So they've bloomed.
        - id: ch01-b93
          speaker: caroline
          text: Yes, and now we'll eat them and get our heart's desire. Oh, Rupert, I wish you believed in all of it.
        - id: ch01-b94
          speaker: rupert
          text: Perhaps I do. After the decent way old Macpherson treated me, you could believe almost anything.
        - id: ch01-b95
          speaker: caroline
          text: Then let's eat them. One flower each, and we'll divide the other three as evenly as we can.
        - id: ch01-b96
          speaker: narrator
          text: Each child picked a white starry blossom. The stalks snapped cleanly, like primrose stems. All four placed a hand on the fifth stalk and broke it between them, then did the same with the sixth and seventh. Caroline carefully divided those three flowers and handed each child an equal share.
        - id: ch01-b97
          speaker: narrator
          text: Standing in a ring in the sunny garden, they ate the white flowers. The taste was pleasant and strange. It was something like pineapple and something like flower artichokes, which have the most mysterious taste in the world. There was spice in it too, and something like fruit eaten in dreams.
        - id: ch01-b98
          speaker: narrator
          text: As they finished, a foot sounded on the terrace steps. Uncle Charles was coming toward them with pale-coloured papers in one hand and waxy white flowers in the other. Fond as they all were of him, no one thought he had chosen a good moment. Charles nearly spoke what they were all thinking.
        - id: ch01-b99
          speaker: charles
          text: Oh, bother!
        - id: ch01-b100
          speaker: narrator
          text: Uncle Charles approached with a kind smile.
        - id: ch01-b101
          speaker: uncle_charles
          text: I have come to make a presentation to you. I consulted your fascinating Language of Flowers once again. It tells me this is the proper flower for the feelings I wish to express.
        - id: ch01-b102
          speaker: narrator
          text: He gave one white flower to each child.
        - id: ch01-b103
          speakers: [caroline, charlotte, charles, rupert]
          ensemble: chorus
          text: Thank you very much.
        - id: ch01-b104
          speaker: caroline
          text: But what does it mean, Uncle?
        - id: ch01-b105
          speaker: uncle_charles
          text: What? Has your book taught you so little?
        - id: ch01-b106
          speaker: caroline
          text: You see, I don't even know the flower's name. But it's most awfully kind of you all the same, Uncle.
        - id: ch01-b107
          speaker: uncle_charles
          text: Oh, its name? It is stephanotis.
        - id: ch01-b108
          speaker: caroline
          text: But stephanotis means, “Will you accompany me to the East?”
          emotion: surprised
        - id: ch01-b109
          speaker: uncle_charles
          text: Well, will you?
        - id: ch01-b110
          speaker: caroline
          text: To the East?
        - id: ch01-b111
          speaker: uncle_charles
          text: Yes. Let us sit on the steps and discuss the idea.
        - id: ch01-b112
          speaker: narrator
          text: They sat down, and Uncle Charles explained.
        - id: ch01-b113
          speaker: uncle_charles
          text: Finding those books has completely changed my ideas about magic. I cannot finish my own book as it stands. I must melt the whole thing down and rewrite it, and I need more knowledge before I can do that. I mean to travel and study the magic of other countries.
        - id: ch01-b114
          speaker: uncle_charles
          text: India will be my first destination. I thought you might like to come and visit your parents. I have been exchanging cables with them, and they are delighted by the idea of a family reunion. Pink verbena, you know. If the idea pleases you, we leave next week.
        - id: ch01-b115
          speakers: [caroline, charlotte, charles]
          ensemble: chorus
          text: Oh, Uncle!
          emotion: surprised
        - id: ch01-b116
          speaker: narrator
          text: For a moment, none of the three could say anything more. Then Charlotte found her voice.
        - id: ch01-b117
          speaker: charlotte
          text: But what about Rupert?
        - id: ch01-b118
          speaker: uncle_charles
          text: Rupert will come too, as far as Suez. His father will meet him there.
        - id: ch01-b119
          speaker: rupert
          text: Is Father coming home?
          emotion: surprised
        - id: ch01-b120
          speaker: uncle_charles
          text: For a year's leave. But none of you has answered my stephanotis question. Will you accompany me to the East?
        - id: ch01-b121
          speaker: narrator
          text: Caroline ran to a flower bed. She returned with leaves and blossoms and pushed them into Uncle Charles's hand.
        - id: ch01-b122
          speaker: caroline
          text: Small white bellflower, wood sorrel, and aquilegia. They mean perfect joy, we love you beyond measure, and yes. Yes! Yes!
          emotion: happy
        - id: ch01-b123
          speaker: narrator
          text: They turned toward the house and saw the seven bare stems where the white stars had grown. Then, suddenly and certainly, each child understood. When Uncle Charles came carrying pale papers in one hand and stephanotis in the other, he had truly brought every child their Heart's Desire.
        - id: ch01-b124
          speaker: narrator
          text: The end.
