  chapters:
    - id: ch01
      title: The Party at the Smiling Pool
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: All the Merry Little Breezes of Old Mother West Wind were hurrying over the Green Meadows. Some flew one way, some ran another way, and some danced off in a third direction. Jerry Muskrat had asked them to carry invitations to his party beside the Big Rock in the Smiling Pool.
        - id: ch01-b02
          speaker: narrator
          text: Everyone was delighted to go. Round Mr. Sun shone as brightly as he could, and the sky was deep blue. The little birds had promised to sing for Jerry, so all the little folks from the Green Meadows and the wood wanted to be there.
        - id: ch01-b03
          speaker: narrator
          text: Johnny Chuck came, and so did Reddy Fox, Jimmy Skunk, Bobby Coon, Happy Jack Squirrel, Striped Chipmunk, Billy Mink, Little Joe Otter, Grandfather Frog, old Mr. Toad, and Mr. Blacksnake. They were all on their way to Jerry Muskrat's party.
        - id: ch01-b04
          speaker: narrator
          text: When they reached the Smiling Pool, Jerry was ready for them. His brothers and sister were there, along with all his aunts, uncles, and cousins. What a merry time they had! Water splashed everywhere.
        - id: ch01-b05
          speaker: narrator
          text: Billy Mink, Little Joe Otter, and Grandfather Frog jumped straight into the pool. They chased one another through the water and hid behind the Big Rock. Then they turned somersaults down the slippery slide. They were having a wonderful time.
    - id: ch02
      title: No Fun on the Shore
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: But Reddy Fox, Peter Rabbit, Bobby Coon, Johnny Chuck, Jimmy Skunk, Happy Jack, and Striped Chipmunk could not swim. They could not join the game of tag, hide in the water, or tumble down the slippery slide. They could only sit on the shore and watch. How they wished they could swim too.
        - id: ch02-b02
          speaker: narrator
          text: Before long, they wished they had never come. When Jerry saw that they were not enjoying his party, he felt very bad. He spent so much of his life in the water that he had forgotten anyone might not know how to swim. If he had remembered, he never would have invited all those little meadow folks who lived on dry land.
        - id: ch02-b03
          speaker: peter_rabbit
          text: Come on, Johnny. Let's go home.
        - id: ch02-b04
          speaker: jimmy_skunk
          text: We'd have more fun up on the hill.
        - id: ch02-b05
          speaker: narrator
          text: Just then, Little Joe Otter came through the Smiling Pool, pushing a great big log ahead of him.
        - id: ch02-b06
          speaker: little_joe_otter
          text: Look, Bobby Coon! Here's a ship. Climb onto one end, and I'll sail you across the Smiling Pool!
          emotion: happy
        - id: ch02-b07
          speaker: narrator
          text: Bobby crawled out onto the log and held tight. Little Joe swam behind him and pushed. Away they went, all the way across the Smiling Pool and back again.
        - id: ch02-b08
          speaker: narrator
          text: Bobby enjoyed his ride so much that he wanted another turn. But Jimmy Skunk wanted to ride too. Bobby hopped off, Jimmy hopped on, and Little Joe pushed the log away across the pool once more.
    - id: ch03
      title: Everyone Joins the Fun
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: Jerry Muskrat found another log and took Peter Rabbit for a ride. Then Jerry's brothers and sister, his aunts and uncles, and all his cousins began finding logs too. Soon they were carrying Reddy Fox, Johnny Chuck, and even old Mr. Toad back and forth across the Smiling Pool.
        - id: ch03-b02
          speaker: narrator
          text: Happy Jack Squirrel sat very straight at the end of his log. He spread his great bushy tail wide and used it for a sail. All the little Breezes blew and blew, and Happy Jack sailed round and round the pool.
        - id: ch03-b03
          speaker: narrator
          text: Now and then, someone tumbled off a log and into the water. Jerry Muskrat or Billy Mink always pulled that guest out again. No one minded getting wet, not even the tiniest bit.
        - id: ch03-b04
          speaker: narrator
          text: In the bushes around the Smiling Pool, the little birds sang and sang. Reddy Fox gave his loudest bark. Happy Jack chattered and chirred, and all the muskrats squealed and squeaked. Jerry Muskrat's party had become such fun!
        - id: ch03-b05
          speaker: narrator
          text: At last, Mr. Sun went down behind the Purple Hills and headed home. Old Mother West Wind and all her Merry Little Breezes followed him. Then the little stars came out and twinkled overhead.
        - id: ch03-b06
          speaker: narrator
          text: The Smiling Pool lay quiet and still, smiling and smiling as it remembered what a good time everyone had enjoyed at Jerry Muskrat's party.
