audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖亲切，带着轻快的讲故事感
        timbre: 清澈柔和
        pace: 舒展而富有变化
        pitch: 中音
    peter_rabbit:
      display_name: 兔子彼得
      tts:
        delivery: 顽皮机灵，笑声爽朗
        timbre: 明亮清透的少年声
        pace: 轻快
        pitch: 中高音
    jimmy_skunk:
      display_name: 臭鼬吉米
      tts:
        delivery: 自负傲慢，心虚时仍勉强装腔作势
        timbre: 略低而圆滑的男声
        pace: 从容偏慢
        pitch: 中低音
    little_joe_otter:
      display_name: 小水獭乔
      tts:
        delivery: 活泼随和，兴奋时干脆响亮
        timbre: 清朗有朝气的少年声
        pace: 轻快
        pitch: 中高音
  chapters:
    - id: ch01
      title: 微笑池的邀请
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 西风妈妈的欢乐小风匆匆越过绿草地。有的往这边飞，有的朝那边跑，还有的跳着舞去了另一个方向。麝鼠杰里要在微笑池的大岩石旁办一场聚会，正请它们把邀请送出去。
        - id: ch01-b02
          speaker: narrator
          text: 大家一听，全都乐意参加。圆圆的太阳先生拿出了最灿烂的阳光，天空蓝得不能再蓝，小鸟也答应来给杰里唱歌。绿草地和树林里的小居民，哪一个会不想去呢？
        - id: ch01-b03
          speaker: narrator
          text: 土拨鼠约翰尼、狐狸雷迪、臭鼬吉米、浣熊博比、松鼠快乐杰克和花栗鼠条纹都来了。水貂比利、小水獭乔、青蛙爷爷、年迈的蟾蜍先生和黑蛇先生也一道赶去，一个都不愿错过杰里的聚会。
        - id: ch01-b04
          speaker: narrator
          text: 等他们来到微笑池，杰里早把一切安排好了。他的兄弟姐妹、叔叔婶婶、舅舅姨妈和各家亲戚也全在那儿。池里真是热闹极了，水花溅得到处都是！
        - id: ch01-b05
          speaker: narrator
          text: 水貂比利、小水獭乔和青蛙爷爷刚到就跳进水里。他们在池中追着捉人，又藏到大岩石后面，还从湿滑的斜坡上翻着跟头溜下去。三个人玩得别提多痛快了。
    - id: ch02
      title: 岸边的客人
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 可狐狸雷迪、兔子彼得、浣熊博比、土拨鼠约翰尼、臭鼬吉米、快乐杰克和花栗鼠条纹都不会游泳。他们不能到水里追逐，不能玩捉迷藏，也不能滑下那道斜坡，只能坐在岸边看着，巴不得自己也能游起来。
        - id: ch02-b02
          speaker: narrator
          text: 他们越坐越不开心，很快就后悔来这一趟了。杰里瞧见客人们闷闷不乐，心里难受极了。他总在水里生活，早忘了还有人不会游泳。要是先想起这件事，他说什么也不会请这些住在旱地上的朋友来受冷落。
        - id: ch02-b03
          speaker: peter_rabbit
          text: 约翰尼，咱们还是回家吧。
        - id: ch02-b04
          speaker: jimmy_skunk
          text: 对呀，到了山上，咱们还能玩得痛快一点。
        - id: ch02-b05
          speaker: narrator
          text: 话音刚落，小水獭乔推着一根大木头，从微笑池那头游了过来。
        - id: ch02-b06
          speaker: little_joe_otter
          text: 博比，快看，这就是一艘船！你坐到木头那头，我推着你渡过微笑池！
    - id: ch03
      title: 木头船开起来了
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 浣熊博比爬到大木头上，牢牢抱紧。小水獭乔游在后面，用力推着木头。他们驶过微笑池，又转身驶回来。博比坐得那么开心，还想再玩一次，可臭鼬吉米也等着上船呢。
        - id: ch03-b02
          speaker: narrator
          text: 博比跳下木头，吉米马上跳了上去。小水獭乔仍在后面推着，把吉米也送过了微笑池。
        - id: ch03-b03
          speaker: narrator
          text: 这下，麝鼠杰里明白该怎么办了。他找来另一根木头，载着兔子彼得游了一趟。杰里一家也纷纷找来木头，带狐狸雷迪、土拨鼠约翰尼，还有蟾蜍先生，在池中来来回回地坐船。
        - id: ch03-b04
          speaker: narrator
          text: 松鼠快乐杰克挺直身子坐在木头一端，把毛茸茸的大尾巴展开，正好当成船帆。欢乐小风吹了一阵又一阵，快乐杰克便绕着微笑池，一圈接一圈地航行。
        - id: ch03-b05
          speaker: narrator
          text: 偶尔有人没坐稳，扑通一声掉进水里，弄得浑身湿透。不过，麝鼠杰里或水貂比利总会把他拉上来。到了这时候，谁还会把这点儿湿淋淋放在心上呢？
    - id: ch04
      title: 快乐的聚会
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 微笑池四周的灌木丛里，小鸟唱了又唱。狐狸雷迪用最大的嗓门吠叫。松鼠快乐杰克叽叽喳喳，还把声音拖得长长的，吱——吱——吱——！所有麝鼠也尖声欢叫，吱吱作响。杰里的聚会真是太好玩了！
        - id: ch04-b02
          speaker: narrator
          text: 后来，太阳先生落到紫山背后，回家去了。西风妈妈领着欢乐小风，也跟随他离开。小星星一颗颗露面，在天上闪呀，闪呀。
        - id: ch04-b03
          speaker: narrator
          text: 微笑池终于安静下来，静得一点儿声息也没有。可它还在笑呀，笑呀。只要想起大家在麝鼠杰里的聚会上玩得那么快乐，它便忍不住一直微笑。
