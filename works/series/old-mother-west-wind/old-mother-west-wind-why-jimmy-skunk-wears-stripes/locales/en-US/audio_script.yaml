  chapters:
    - id: ch01
      title: "CHAPTER IV. WHY JIMMY SKUNK WEARS STRIPES"
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Everybody knows Jimmy Skunk by his black-and-white striped suit. But long, long ago, every member of the Skunk family wore a coat of glossy black. Those coats were very handsome. The Skunks took enormous pride in them and gave them the greatest care, brushing them carefully many times each day.
        - id: ch01-b02
          speaker: narrator
          text: The head of the Skunk family in those days was also named Jimmy, just as the head of the family is now. He thought himself quite a gentleman. He was very independent and cared little about anyone else. Like many people who pride themselves on independence, he did not always respect the rights of his neighbors. Folks in the wood and on the Green Meadows whispered that some of his deeds could not bear the light of day.
        - id: ch01-b03
          speaker: narrator
          text: People openly said that Jimmy prowled around far too much at night. Still, no one could prove that he caused any of the mischief done after dark, because no one ever saw him. His coat was so black that it disappeared completely in the darkness of night.
        - id: ch01-b04
          speaker: narrator
          text: Around that time, Mrs. Ruffed Grouse built a nest at the foot of the Great Pine and laid fifteen beautiful buff-colored eggs. She was wonderfully happy about her nest and eggs. Her happiness spread to all the little meadow folk who knew about it. They were happy for her because they all loved the shy and gentle Mrs. Grouse.
        - id: ch01-b05
          speaker: narrator
          text: Every morning, Peter Rabbit trotted down the Lone Little Path through the wood. When he passed the Great Pine, he stopped for a little talk with Mrs. Grouse. Happy Jack Squirrel brought her all the news each afternoon. The Merry Little Breezes ran up a dozen times a day to see how she was getting along.
        - id: ch01-b06
          speaker: narrator
          text: Then one morning, Peter arrived for his usual visit and found a terrible sight. Mrs. Grouse was heartbroken. Empty shells from all fifteen of her lovely eggs lay broken and scattered this way and that around the foot of the Great Pine.
        - id: ch01-b07
          speaker: peter_rabbit
          text: Mrs. Grouse, what happened here?
        - id: ch01-b08
          speaker: mrs_ruffed_grouse
          text: I don't know. I was fast asleep when something sprang on me in the night. I got away and flew to the top of the Great Pine. When morning came, I found every egg broken, just as they are now.
          emotion: sad
        - id: ch01-b09
          speaker: narrator
          text: Peter searched the ground with great care. He hunted all around the back of the Great Pine and peered under every bush. Then he stood studying the ground with a very wise air. When he had finished, he hopped away down the Lone Little Path toward the Green Meadows and stopped at Johnny Chuck's house.
        - id: ch01-b10
          speaker: johnny_chuck
          text: Peter, why are your eyes so big and round?
        - id: ch01-b11
          speaker: narrator
          text: Peter came very close and whispered everything he had seen into Johnny's ear. Then Peter and Johnny set off together for Jimmy Skunk's house.
        - id: ch01-b12
          speaker: narrator
          text: Jimmy was still in bed. When he came to the door, he was sleepy and cross. Peter told him about the broken eggs.
        - id: ch01-b13
          speaker: jimmy_skunk
          text: That is too bad. It is very bad indeed.
        - id: ch01-b14
          speaker: narrator
          text: Jimmy gave a sleepy yawn.
        - id: ch01-b15
          speaker: johnny_chuck
          text: Will you come with us and help find whoever did it?
        - id: ch01-b16
          speaker: narrator
          text: Jimmy said he would be delighted, but claimed he had other business that morning. He promised to join them in the afternoon. So Peter and Johnny went on without him.
        - id: ch01-b17
          speaker: narrator
          text: Before long, they met the Merry Little Breezes and told them the dreadful news.
        - id: ch01-b18
          speaker: johnny_chuck
          text: What can we do now?
        - id: ch01-b19
          speakers: [breeze_1, breeze_2, breeze_3]
          ensemble: chorus
          text: Let's hurry to Old Dame Nature, tell her everything, and ask what we should do!
        - id: ch01-b20
          speaker: narrator
          text: Away flew the Breezes to find Old Dame Nature. They told her the whole dreadful story, and she listened closely to every word. Then she sent them racing off again. This time they had an order for every little meadow neighbor. Everyone must gather at the Great Pine that afternoon.
        - id: ch01-b21
          speaker: narrator
          text: Whatever Old Dame Nature commanded, the meadow folk were bound to do. None of them dared disobey her. At exactly four o'clock, everyone stood together around the foot of the Great Pine. Mrs. Ruffed Grouse sat brokenhearted beside her empty nest, with the shattered shells still scattered all around.
        - id: ch01-b22
          speaker: narrator
          text: Reddy Fox was there with Peter Rabbit, Johnny Chuck, Billy Mink, Little Joe Otter, Jerry Muskrat, Hooty the Owl, Bobby Coon, Sammy Jay, Blacky the Crow, Grandfather Frog, Mr. Toad, Spotty the Turtle, and the Merry Little Breezes. Jimmy Skunk arrived last.
        - id: ch01-b23
          speaker: narrator
          text: Jimmy looked very handsome in his shining black coat. He also appeared deeply sorry that such a dreadful thing had happened. He told Mrs. Grouse just how badly he felt. Then, loud enough for everyone to hear, he demanded that the guilty one be discovered and punished severely.
        - id: ch01-b24
          speaker: narrator
          text: Old Dame Nature usually wore the most smiling face in the world. That afternoon, her face was very grave indeed. First, she asked Mrs. Grouse to tell the whole story once more so that everyone could hear it. After that, each neighbor had to say in turn exactly where he had been the night before.
        - id: ch01-b25
          speaker: narrator
          text: Johnny Chuck, Happy Jack Squirrel, Striped Chipmunk, Sammy Jay, and Blacky the Crow had gone to bed when the sun sank behind the Purple Hills. Jerry Muskrat, Billy Mink, Little Joe Otter, Grandfather Frog, and Spotty the Turtle had stayed at the Smiling Pool.
        - id: ch01-b26
          speaker: narrator
          text: Bobby Coon had visited Farmer Brown's cornfield. Hooty the Owl had hunted at the lower end of the Green Meadows. Peter Rabbit had been in the berry patch. Mr. Toad had stayed beneath the piece of bark he called home.
        - id: ch01-b27
          speaker: narrator
          text: Old Dame Nature saved Jimmy Skunk for last. Jimmy protested that he had been very, very tired the evening before. He insisted he had gone to bed early and slept soundly through the entire night.
        - id: ch01-b28
          speaker: narrator
          text: Then Old Dame Nature called on Peter and asked what he had discovered among the eggshells that morning. Peter hopped out where everyone could see him and placed three long black hairs on the ground before her.
        - id: ch01-b29
          speaker: peter_rabbit
          text: I found these three hairs right there among the broken shells.
        - id: ch01-b30
          speaker: old_dame_nature
          text: Johnny Chuck, what did you notice when you visited Jimmy Skunk this morning?
        - id: ch01-b31
          speaker: johnny_chuck
          text: I saw Jimmy, and he looked awfully sleepy. I also thought his whiskers looked yellow.
        - id: ch01-b32
          speaker: old_dame_nature
          text: That is enough. Old Mother West Wind, when did you reach the Green Meadows this morning?
        - id: ch01-b33
          speaker: old_mother_west_wind
          text: I came at daybreak, just as the sun rose from behind the Purple Hills.
        - id: ch01-b34
          speaker: old_dame_nature
          text: And whom did you see out so early?
        - id: ch01-b35
          speaker: old_mother_west_wind
          text: I saw Bobby Coon heading home from Farmer Brown's cornfield. I saw Hooty the Owl returning from the lower Green Meadows, and Peter Rabbit was in the berry patch. Last of all, I saw something like a black shadow moving along the Lone Little Path toward Jimmy Skunk's house.
        - id: ch01-b36
          speaker: narrator
          text: Everyone stared at Jimmy. He began to look uneasy and very unhappy.
        - id: ch01-b37
          speaker: old_dame_nature
          text: Who wears a black coat?
        - id: ch01-b38
          speakers: [peter_rabbit, johnny_chuck, breeze_1, grandfather_frog]
          ensemble: chorus
          text: Jimmy Skunk does!
        - id: ch01-b39
          speaker: old_dame_nature
          text: What could turn a creature's whiskers yellow?
        - id: ch01-b40
          speaker: narrator
          text: At first, no one knew. Then Peter spoke.
        - id: ch01-b41
          speaker: peter_rabbit
          text: The yolk from an egg might do it.
        - id: ch01-b42
          speaker: old_dame_nature
          text: Who is likely to feel sleepy on a bright, sunny morning?
        - id: ch01-b43
          speaker: johnny_chuck
          text: Someone who stayed out all night.
        - id: ch01-b44
          speaker: narrator
          text: Johnny knew about early bedtimes, because he always went to bed with the sun.
        - id: ch01-b45
          speaker: narrator
          text: Old Dame Nature's face stayed grave, and her voice became very stern.
        - id: ch01-b46
          speaker: old_dame_nature
          text: Jimmy Skunk, I accuse you of breaking and eating Mrs. Grouse's eggs. What do you have to say?
          emotion: angry
        - id: ch01-b47
          speaker: narrator
          text: Jimmy hung his head. He had no answer at all. He only wanted to slip away by himself.
        - id: ch01-b48
          speaker: old_dame_nature
          text: Jimmy Skunk, you were proud of that handsome black coat because it let you move through the night unseen. Now we can no longer trust your word. From this day on, you and all your descendants will wear stripes as a sign that you cannot be trusted. Your coats will be black and white, so whenever you travel at night, everyone will be able to see you.
          emotion: angry
        - id: ch01-b49
          speaker: narrator
          text: And that is why Jimmy Skunk still wears a striped suit of black and white today.
