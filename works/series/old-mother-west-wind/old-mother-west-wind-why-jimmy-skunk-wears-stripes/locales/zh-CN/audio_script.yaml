audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖亲切，带着轻快的讲故事感
        timbre: 清澈柔和
        pace: 舒展而富有变化
        pitch: 中音
    breeze_1:
      display_name: 小风一号
      tts:
        delivery: 活泼爽朗，充满好奇
        timbre: 清亮的童声
        pace: 轻快
        pitch: 中高音
    breeze_2:
      display_name: 小风二号
      tts:
        delivery: 机灵热心，语气干脆
        timbre: 轻盈的童声
        pace: 轻快
        pitch: 高音
    breeze_3:
      display_name: 小风三号
      tts:
        delivery: 顽皮热烈，带着跳跃感
        timbre: 明快的童声
        pace: 稍快
        pitch: 中高音
    breeze_4:
      display_name: 小风四号
      tts:
        delivery: 天真勇敢，说话利落
        timbre: 柔亮的童声
        pace: 轻快
        pitch: 高音
    johnny_chuck:
      display_name: 土拨鼠约翰尼
      tts:
        delivery: 天真贪玩，情绪来得快也去得快
        timbre: 圆润稚气的童声
        pace: 稍快而有弹性
        pitch: 中高音
    reddy_fox:
      display_name: 狐狸雷迪
      tts:
        delivery: 狡黠爱逞强，得意时带着坏笑
        timbre: 清脆偏细
        pace: 灵活轻快
        pitch: 中音
    peter_rabbit:
      display_name: 兔子彼得
      tts:
        delivery: 顽皮机灵，笑声爽朗
        timbre: 明亮清透的少年声
        pace: 轻快
        pitch: 中高音
    jimmy_skunk:
      display_name: 臭鼬吉米
      tts:
        delivery: 自负傲慢，心虚时仍勉强装腔作势
        timbre: 略低而圆滑的男声
        pace: 从容偏慢
        pitch: 中低音
    mrs_ruffed_grouse:
      display_name: 花尾榛鸡太太
      tts:
        delivery: 腼腆温柔，悲伤时声音微微发颤
        timbre: 柔和纤细的女声
        pace: 舒缓
        pitch: 中高音
    old_dame_nature:
      display_name: 自然奶奶
      tts:
        delivery: 慈爱威严，审问时沉着有力
        timbre: 温厚清晰的老年女声
        pace: 稳健从容
        pitch: 中低音
    old_mother_west_wind:
      display_name: 西风妈妈
      tts:
        delivery: 温和坦率，语气开阔明朗
        timbre: 柔润成熟的女声
        pace: 从容
        pitch: 中音
    billy_mink:
      display_name: 水貂比利
      tts:
        delivery: 机敏直爽，说话响亮
        timbre: 清亮的少年声
        pace: 轻快
        pitch: 中音
  chapters:
    - id: ch01
      title: 黑衣裳藏住了谁
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 大家都知道，如今的臭鼬吉米穿着黑白条纹衣。可在很久很久以前，臭鼬一家穿的全是黑衣裳。他们的皮毛又漂亮又光亮，黑得没有一根杂色。全家都为这身毛骄傲，也爱惜得不得了，每天总要仔仔细细地梳上好多遍。那时的族长也叫吉米，正像现在一样。他自认是位了不起的绅士，谁也不放在眼里，凡事只照自己的心意来，也不大理会别人的权利。
        - id: ch01-b02
          speaker: narrator
          text: 树林和绿草地上早有传言，说吉米做过一些见不得光的事。大家甚至公开议论，说他太喜欢趁夜四处游荡。可夜里无论出了什么乱子，谁也不能证明是他闯的，因为从来没有谁亲眼看见过他。那身黑毛一融进夜色，就完全消失了。
        - id: ch01-b03
          speaker: narrator
          text: 这时，花尾榛鸡太太在大松树脚下筑了巢，生下十五枚漂亮的浅黄褐色鸟蛋。她满心欢喜，喜欢她的小居民们也替她高兴。大家都爱这位腼腆、文静、小巧的榛鸡太太。兔子彼得每天早晨沿着孤独小径跑来，总在大松树下停一停，陪她聊几句。松鼠快乐杰克每天下午送来新消息，欢乐小风们一天要来看她十几次。
        - id: ch01-b04
          speaker: narrator
          text: 一天早晨，彼得照常沿着孤独小径来探望，却看见了一幅可怕的景象。榛鸡太太伤透了心。她那些漂亮的蛋全被打碎，空壳东一片，西一片，撒得大松树脚下到处都是。
        - id: ch01-b05
          speaker: peter_rabbit
          text: 榛鸡太太，这到底是怎么发生的？
        - id: ch01-b06
          speaker: mrs_ruffed_grouse
          text: 我也不知道。夜里我睡得正熟，忽然有个东西扑向我。我好不容易逃开，飞到了大松树顶。天亮以后，我下来一看，所有的蛋都成了现在这个样子。
          emotion: sad
    - id: ch02
      title: 彼得找到线索
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 彼得先仔细察看地面，又绕到大松树后面寻找，还探头看了看灌木底下。最后，他摆出一副很有见识的样子，研究起地上的痕迹。查完以后，他沿着孤独小径一路蹦到绿草地，停在土拨鼠约翰尼家门前。
        - id: ch02-b02
          speaker: johnny_chuck
          text: 彼得，你为什么把眼睛瞪得那么大、那么圆？
        - id: ch02-b03
          speaker: narrator
          text: 彼得凑得很近，在约翰尼耳边把看到的一切悄悄说了。两人一起来到臭鼬吉米家。吉米还躺在床上，困得厉害，被叫起来开门时，脾气也坏极了。彼得把榛鸡太太的惨事从头讲给他听。
        - id: ch02-b04
          speaker: jimmy_skunk
          text: 真糟糕，太糟糕了！
        - id: ch02-b05
          speaker: narrator
          text: 吉米说完，还困倦地打了个哈欠。
        - id: ch02-b06
          speaker: johnny_chuck
          text: 你能跟我们一起查一查，找出是谁干的吗？
        - id: ch02-b07
          speaker: narrator
          text: 吉米嘴上说，他当然非常乐意帮忙，只是今天早晨另有事情要办，等下午再来跟大家会合。彼得和约翰尼只好继续往前。没过多久，他们碰见了欢乐小风，便把那件可怕的事原原本本地说了出来。
        - id: ch02-b08
          speaker: johnny_chuck
          text: 这下我们该怎么办？
        - id: ch02-b09
          speakers: [breeze_1, breeze_2, breeze_3, breeze_4]
          ensemble: chorus
          text: 我们马上去告诉自然奶奶，请她来拿主意！
        - id: ch02-b10
          speaker: narrator
          text: 欢乐小风们立刻飞去找自然奶奶，把整件事告诉了她。自然奶奶一声不漏地听完，又叫小风们通知所有小居民，下午到大松树下集合。她吩咐的事，绿草地上谁都必须照办，没有一个敢违抗。四点一到，大家准时来了。榛鸡太太心都碎了，还守在空巢旁，身边尽是破碎的蛋壳。狐狸雷迪、兔子彼得、土拨鼠约翰尼、水貂比利、小水獭乔、麝鼠杰里、猫头鹰胡蒂、浣熊博比、松鸦萨米、乌鸦布莱基、青蛙爷爷、蟾蜍先生、斑点龟和欢乐小风们，全围在树下。
        - id: ch02-b11
          speaker: narrator
          text: 臭鼬吉米最后才到。他的黑毛闪闪发亮，看上去十分漂亮，脸上的神情也像是为这件惨事难过极了。他告诉榛鸡太太，自己心里有多不好受。接着，他又把声音抬得高高的，要求大家非把罪犯查出来不可，还要严厉惩罚那个家伙。
    - id: ch03
      title: 大松树下的审问
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 自然奶奶有着世上最爱笑的一张脸，这会儿却严肃得很。她先请榛鸡太太从头再讲一遍，好让在场的每一个人都听清楚。接着，她又让大家一个挨一个，交代昨天夜里各自去了哪里。
        - id: ch03-b02
          speaker: narrator
          text: 太阳落到紫山后面时，约翰尼、快乐杰克、花栗鼠条纹、松鸦萨米和乌鸦布莱基都睡了。麝鼠杰里、水貂比利、小水獭乔、青蛙爷爷和斑点龟没离开微笑池。浣熊博比在农夫布朗的玉米地，猫头鹰胡蒂在绿草地较低的那一头打猎，彼得在浆果园，蟾蜍先生在那片被他称为家的树皮底下。
        - id: ch03-b03
          speaker: narrator
          text: 最后才轮到吉米。他一口咬定，自己昨天累坏了，很早很早就上床睡觉，而且一觉睡到天亮。自然奶奶听完没有多说，转而询问彼得，早晨在碎蛋壳中发现了什么。彼得立刻跳到大家面前，把三根长长的黑毛放在自然奶奶脚边。
        - id: ch03-b04
          speaker: peter_rabbit
          text: 我在碎蛋壳中间找到了这三根黑毛。
        - id: ch03-b05
          speaker: old_dame_nature
          text: 约翰尼，今天早晨你去吉米家时，看见了什么？
        - id: ch03-b06
          speaker: johnny_chuck
          text: 我见到了吉米。他困得眼睛都快睁不开了。我还觉得，他的胡须有些发黄。
        - id: ch03-b07
          speaker: old_dame_nature
          text: 这些已经够了。西风妈妈，你今早什么时候来到绿草地？
        - id: ch03-b08
          speaker: old_mother_west_wind
          text: 天刚亮我就来了。那时太阳先生正从紫山后面升起。
        - id: ch03-b09
          speaker: old_dame_nature
          text: 那么早的时候，你遇见了谁？
        - id: ch03-b10
          speaker: old_mother_west_wind
          text: 我看见浣熊博比从老农夫布朗的玉米地回家，也看见猫头鹰胡蒂从绿草地那一头回来。兔子彼得还在浆果园。最后，我看见一团黑影沿着孤独小径走下来，朝臭鼬吉米家去了。
    - id: ch04
      title: 黑白相间的条纹衣
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 西风妈妈说完，所有人的目光都落在臭鼬吉米身上，盯着他看个不停。吉米越来越不安，脸色也越来越难看。
        - id: ch04-b02
          speaker: old_dame_nature
          text: 谁穿着一身黑衣裳？
        - id: ch04-b03
          speakers: [reddy_fox, peter_rabbit, johnny_chuck, billy_mink]
          ensemble: chorus
          text: 臭鼬吉米！
        - id: ch04-b04
          speaker: old_dame_nature
          text: 什么东西可能把胡须染成黄色？
        - id: ch04-b05
          speaker: narrator
          text: 大家起初谁也想不出来。过了一会儿，兔子彼得忽然开口了。
        - id: ch04-b06
          speaker: peter_rabbit
          text: 胡须上的黄色，有可能是蛋黄。
        - id: ch04-b07
          speaker: old_dame_nature
          text: 天气晴朗，太阳也出来了，什么人还会这样困？
        - id: ch04-b08
          speaker: johnny_chuck
          text: 那一定是整夜都在外面游荡的人。
        - id: ch04-b09
          speaker: narrator
          text: 约翰尼自己向来是太阳一落山就睡觉。自然奶奶的神色越发凝重，声音也严厉起来。
        - id: ch04-b10
          speaker: old_dame_nature
          text: 臭鼬吉米，我指控你打碎并吃掉了榛鸡太太的蛋。你还有什么话替自己辩解？
          emotion: angry
        - id: ch04-b11
          speaker: narrator
          text: 吉米把头垂了下去，一个字也答不出来。他只想从大家眼前悄悄溜走，找个地方独自躲起来。
        - id: ch04-b12
          speaker: old_dame_nature
          text: 吉米，你总为这身漂亮的黑皮毛得意。正因为有它，你才能在夜里四处走动，不被任何人看见。现在，我们再也不能相信你会凭良心行事了。从今以后，你和你的子孙都必须穿上条纹衣。这身衣裳就是不可信任的标记。往后，你们的皮毛要黑白相间。这样一来，只要你们在夜里走动，别人就总能看得见。
        - id: ch04-b13
          speaker: narrator
          text: 所以直到今天，臭鼬吉米仍然穿着黑白相间的条纹衣。
