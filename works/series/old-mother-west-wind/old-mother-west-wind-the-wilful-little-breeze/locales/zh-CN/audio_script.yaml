audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖亲切，带着轻快的讲故事感
        timbre: 清澈柔和
        pace: 舒展而富有变化
        pitch: 中音
    old_mother_west_wind:
      display_name: 西风妈妈
      tts:
        delivery: 温和坦率，语气开阔明朗
        timbre: 柔润成熟的女声
        pace: 从容
        pitch: 中音
    wilful_little_breeze:
      display_name: 任性的小风
      tts:
        delivery: 顽皮天真，遇事时又机敏勇敢
        timbre: 轻盈清亮的童声
        pace: 轻快而富有变化
        pitch: 中高音
    reddy_fox:
      display_name: 狐狸雷迪
      tts:
        delivery: 狡黠爱逞强，得意时带着坏笑
        timbre: 清脆偏细
        pace: 灵活轻快
        pitch: 中音
    hooty_owl:
      display_name: 猫头鹰胡蒂
      tts:
        delivery: 阴沉狡猾，说话简短而冷冷的
        timbre: 低哑的男声
        pace: 缓慢
        pitch: 低音
    mr_bob_white:
      display_name: 白鹑先生
      tts:
        delivery: 警醒沉着，对朋友真诚有礼
        timbre: 温和清晰的成年男声
        pace: 稳健
        pitch: 中音
  chapters:
    - id: ch01
      title: 不肯回家的小风
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 西风妈妈累坏了，累得还有一点点心烦。她会心烦，正是因为实在太累。这一天，她从一大早就忙个不停。她吹鼓海上船只的白帆，让船走得更快。她推动大大小小的风车，为口渴的人汲水，为饥饿的人磨玉米。高烟囱、火车头和汽船冒出来的浓烟，也全让她吹散了。西风妈妈这一天实在太忙了。
        - id: ch01-b02
          speaker: narrator
          text: 傍晚，她穿过绿草地，准备回紫山后面的家。她一边走，一边打开随身背着的大口袋，叫来那些在草地上尽情玩了一整天的欢乐小风。孩子们也累了，都愿意回紫山后面的家，于是一个接一个钻进袋子。没过多久，袋子外面只剩下一阵任性的小风。他还没玩够，偏不肯回家，只想再多玩一会儿。
        - id: ch01-b03
          speaker: narrator
          text: 小风跑到西风妈妈前面，欢快地跳起舞来。他亲亲昏昏欲睡的雏菊，摇摇一朵朵垂着头的毛茛花，还逗得白杨树的一片片小叶子也一起舞动，就是不肯进袋子。西风妈妈只好合上袋口，把大口袋往肩上一甩，继续朝紫山后面的家走去。
        - id: ch01-b04
          speaker: narrator
          text: 西风妈妈一走，被留下的小风忽然觉得孤单极了。雏菊困得不想跟他玩，毛茛花也在发脾气。又大又圆、亮堂堂的太阳先生照耀了一整天，这时已经上床去了，还戴上一顶金云做的睡帽。黑乎乎的影子悄悄爬出来，一点点铺进绿草地。小风这才盼着自己能安稳地待在西风妈妈的大口袋里，和其他欢乐小风挤在一起。
    - id: ch02
      title: 月光下的坏主意
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 小风动身穿过绿草地，要去寻找紫山。可所有山头全都黑了，他分不清该往哪一座走，更不知道自己的家究竟在哪座山后面。这时，他真希望自己先前听了西风妈妈的话。过了一阵，他蜷在一丛杨梅灌木下面，想睡上一觉，却觉得那么孤单，怎么也睡不着。
        - id: ch02-b02
          speaker: narrator
          text: 月亮妈妈升起来了，冷白的月光铺满整片绿草地，也照出许许多多黑影。这光一点也不像快乐的圆太阳先生那么明亮。没过多久，小风听见猫头鹰胡蒂出来寻找晚餐，他要捉一只田鼠。接着，狐狸雷迪沿着紧挨灌木的孤独小径轻轻跑来。他隔一会儿就扭头看看身后，瞧瞧有没有谁跟踪。谁都看得出，他准在打坏主意。
        - id: ch02-b03
          speaker: narrator
          text: 雷迪来到灌木旁坐下，汪汪叫了两声。胡蒂马上答应，飞来和他会合。两个坏家伙忙着商量，根本没发现藏在灌木底下的小风。他们想偷偷越过绿草地，溜到褐色牧场边上。白鹑先生、白鹑太太和十二只白鹑宝宝就住在那里。
        - id: ch02-b04
          speaker: reddy_fox
          text: 等他们在地上跑，我就来捉。等他们飞起来，你再动手。这样一只也逃不掉，全都能进我们的肚子！
        - id: ch02-b05
          speaker: narrator
          text: 雷迪说完，馋得舔了舔嘴唇。胡蒂也咔哒咔哒地夹着尖嘴，好像这一刻已经尝到了鲜嫩的小白鹑。任性的小风看着他们，吓得浑身直发抖。没过多久，两个坏家伙便朝褐色牧场出发了。
    - id: ch03
      title: 小风抢先报信
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 等他们走得看不见了，小风立刻跳起来，抖了抖身子，飞快地越过绿草地，直奔褐色牧场。小风跑得比他们快，走的又是一条近路，所以抢先赶到了那里。他在牧场上找呀找呀，找了好半天，终于发现白鹑先生、白鹑太太和所有白鹑宝宝。他们全都把脑袋藏在翅膀底下，睡得正熟。
        - id: ch03-b02
          speaker: narrator
          text: 小风轻轻摇了摇白鹑先生。白鹑先生一下子醒了过来。
        - id: ch03-b03
          speaker: wilful_little_breeze
          text: 嘘，小点声！狐狸雷迪和猫头鹰胡蒂正往这里来。他们要把你、白鹑太太，还有所有白鹑宝宝全都吞掉！
          emotion: fearful
        - id: ch03-b04
          speaker: mr_bob_white
          text: 谢谢你来报信，小风。看来我得马上带着全家换个地方。
        - id: ch03-b05
          speaker: narrator
          text: 白鹑先生马上叫醒太太和所有宝宝，自己飞在最前面，领着全家一起飞到褐色牧场的另一头。他们很快就在一棵刺柏下面藏好，终于安安全全了。
    - id: ch04
      title: 再也不孤单
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 小风亲眼看着白鹑一家平安到达，又等他们好好藏起来，这才赶回他们刚才睡觉的地方。这时，狐狸雷迪正轻手轻脚地穿过草丛，脚步放得轻得不能再轻。胡蒂则像一道影子，飞起来无声无息。雷迪觉得距离够近了，便把身子紧紧缩成一团，突然向前猛扑，正好落进白鹑先生空荡荡的床铺。
        - id: ch04-b02
          speaker: narrator
          text: 白鹑一家竟然不见了。雷迪和胡蒂又吃惊又犯傻，那副模样逗得小风差点笑出了声。两个坏家伙在褐色牧场上到处寻找，一会儿搜这里，一会儿翻那里，可他们始终没找到白鹑一家。
        - id: ch04-b03
          speaker: narrator
          text: 任性的小风回到刺柏树下，蜷在白鹑先生身边睡着了。这一回，他再也不孤单了。
