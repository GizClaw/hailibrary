  chapters:
    - id: ch01
      title: CHAPTER V THE WILFUL LITTLE BREEZE
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Old Mother West Wind was tired, and being tired had made her just a little cross. She had been busy since early morning. Out on the great ocean, she had filled the white sails of the ships and helped them speed along. She had kept windmills large and small turning to pump water for thirsty people and grind corn for hungry ones. She had blown smoke away from tall chimneys, engines, and steamboats. Yes, Old Mother West Wind had worked very hard indeed.
        - id: ch01-b02
          speaker: narrator
          text: Now she was crossing the Green Meadows on her way home behind the Purple Hills. She opened the big bag she carried and called her children, the Merry Little Breezes. They had played hard in the meadows all day. One after another, they crept into the bag, tired and ready to go home.
        - id: ch01-b03
          speaker: narrator
          text: Soon every Breeze was inside except one. This willful little Breeze was not ready. He wanted a little more time to play. He danced ahead of Old Mother West Wind, kissed the sleepy daisies, shook the nodding buttercups, and made the little poplar leaves dance with him. Still he would not climb into the bag.
        - id: ch01-b04
          speaker: narrator
          text: So Old Mother West Wind closed her bag, swung it over her shoulder, and went on toward her home behind the Purple Hills.
        - id: ch01-b05
          speaker: narrator
          text: The moment she was gone, the little Breeze felt terribly lonely. The sleepy daisies would not play, and the nodding buttercups were cross. Great, round, bright Mr. Sun had shone all day. Now he went to bed and pulled on a nightcap of golden clouds. Across the Green Meadows, black shadows began creeping out.
        - id: ch01-b06
          speaker: narrator
          text: The willful little Breeze wished he were safely tucked inside Old Mother West Wind's bag with all the other Merry Little Breezes.
        - id: ch01-b07
          speaker: narrator
          text: He set off across the Green Meadows to look for the Purple Hills. But darkness had turned every hill black. He looked one way and then another, yet he could not tell which hill he should search behind to find his home, Old Mother West Wind, and the other Merry Little Breezes. How he wished he had listened to Old Mother West Wind.
        - id: ch01-b08
          speaker: narrator
          text: After a while, he curled up beneath a bayberry bush and tried to sleep. He was so lonely that sleep would not come. Old Mother Moon rose and washed the Green Meadows with light. It was nothing like the jolly, bright light of round Mr. Sun. This light was cold and white, and it cast many black shadows.
        - id: ch01-b09
          speaker: narrator
          text: Before long, the little Breeze heard Hooty the Owl hunting for a meadow mouse to eat for dinner. Then Reddy Fox came trotting down the Lone Little Path beside the bayberry bush. He moved very softly. Every few moments, he looked back to see whether anyone was following. Reddy Fox was plainly up to mischief.
        - id: ch01-b10
          speaker: narrator
          text: At the bayberry bush, Reddy sat down and barked twice. Hooty answered at once and flew over to him. Neither rogue noticed the little Breeze curled beneath the bush. They were too busy making their wicked plan. They meant to creep across the Green Meadows to the edge of the Brown Pasture. That was where Mr. Bob White, Mrs. Bob White, and their twelve little Bob Whites lived.
        - id: ch01-b11
          speaker: reddy_fox
          text: When they race along the ground, I'll catch them. If they fly into the air, you catch them. Then we'll gobble up every one!
        - id: ch01-b12
          speaker: narrator
          text: Reddy licked his chops, and Hooty snapped his bill. They acted as if they could already taste those tender little Bob Whites. The sight made the little Breeze shiver. Soon the two rogues started toward the Brown Pasture.
        - id: ch01-b13
          speaker: narrator
          text: Once they were out of sight, the little Breeze jumped up and shook himself. Away he raced across the Green Meadows. He was faster than they were, and he knew a shorter way, so he reached the Brown Pasture first.
        - id: ch01-b14
          speaker: narrator
          text: He searched and searched for the Bob White family. At last he found Mr. and Mrs. Bob White and all twelve little Bob Whites. They were sound asleep with their heads tucked beneath their wings.
        - id: ch01-b15
          speaker: narrator
          text: Very gently, the little Breeze shook Mr. Bob White. In an instant, Mr. Bob White was wide awake.
        - id: ch01-b16
          speaker: breeze_1
          text: Shh! Reddy Fox and Hooty the Owl are coming to the Brown Pasture. They mean to gobble up you, Mrs. Bob White, and every one of your little Bob Whites.
          emotion: fearful
        - id: ch01-b17
          speaker: mr_bob_white
          text: Thank you, little Breeze. I believe I'll take my family somewhere else.
        - id: ch01-b18
          speaker: narrator
          text: Mr. Bob White woke Mrs. Bob White and all their little ones. With him leading the way, the whole family flew to the far side of the Brown Pasture. Before long, they were safely hidden beneath a juniper tree.
        - id: ch01-b19
          speaker: narrator
          text: The little Breeze made sure they were safe. Then, once they were well hidden, he hurried back to the place where they had slept. Reddy Fox was slipping through the grass as softly as he could. Hooty the Owl flew as silently as a shadow.
        - id: ch01-b20
          speaker: narrator
          text: When Reddy thought he was close enough, he gathered himself and sprang. He landed right in Mr. Bob White's empty bed. Reddy and Hooty looked so startled and so foolish when they found no Bob Whites there that the little Breeze almost laughed aloud.
        - id: ch01-b21
          speaker: narrator
          text: Reddy Fox and Hooty the Owl searched here, then searched there. They hunted all over the Brown Pasture, but they could not find the Bob Whites anywhere.
        - id: ch01-b22
          speaker: narrator
          text: The little Breeze went back to the juniper tree and curled up beside Mr. Bob White. There he went to sleep, for he was lonely no longer.
