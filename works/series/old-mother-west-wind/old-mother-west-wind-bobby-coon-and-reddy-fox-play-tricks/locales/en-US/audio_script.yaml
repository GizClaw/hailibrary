  chapters:
    - id: ch01
      title: "CHAPTER XII. BOBBY COON AND REDDY FOX PLAY TRICKS"
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: It was night. All the little stars looked down, twinkling and twinkling. Mother Moon was doing her best to light the Green Meadows as brightly as Mr. Sun did by day. Nearly all the little birds were fast asleep in their nests. Only Hooty the Owl, Boomer the Night Hawk, and noisy Mr. Whip-poor-will were awake. Old Mother West Wind's Merry Little Breezes had gone to sleep too.
        - id: ch01-b02
          speaker: narrator
          text: It was oh, so still. In fact, it was so very still that Bobby Coon began talking to himself as he came down the Lone Little Path through the wood.
        - id: ch01-b03
          speaker: bobby_coon
          text: I don't know why everyone wants to play all day and sleep all night. Night is the very best time to be out. Now, Reddy Fox—
        - id: ch01-b04
          speaker: reddy_fox
          text: You'd better be careful what you say about Reddy Fox.
        - id: ch01-b05
          speaker: narrator
          text: The voice came from right behind him. Bobby spun around. He had thought he was alone, but there was Reddy Fox himself, trotting down the path.
        - id: ch01-b06
          speaker: bobby_coon
          text: I thought you were sound asleep at home, Reddy.
        - id: ch01-b07
          speaker: reddy_fox
          text: Then you thought wrong. I'm out for a walk in the moonlight.
        - id: ch01-b08
          speaker: narrator
          text: Bobby and Reddy walked on together. They followed the Lone Little Path out of the wood and down toward the Green Meadows. Along the way, they met Jimmy Skunk. Jimmy had dreamed of a great many beetles up on the hill, and he was just about to climb the Crooked Little Path to see if they were really there.
        - id: ch01-b09
          speakers: [bobby_coon, reddy_fox]
          ensemble: duo
          text: Hello, Jimmy Skunk! Come down to the Green Meadows with us.
        - id: ch01-b10
          speaker: narrator
          text: Jimmy said he would come. So all three went down across the Green Meadows together. Bobby led the way, Reddy followed him, and Jimmy came last of all, because Jimmy Skunk never hurries. Before long, they reached Johnny Chuck's house.
        - id: ch01-b11
          speaker: bobby_coon
          text: Listen. Johnny Chuck is sound asleep.
        - id: ch01-b12
          speaker: narrator
          text: They listened. From deep inside his snug little bed came the sound of Johnny Chuck snoring.
        - id: ch01-b13
          speaker: reddy_fox
          text: Let's leave Johnny a surprise.
        - id: ch01-b14
          speaker: bobby_coon
          text: What kind of surprise?
        - id: ch01-b15
          speaker: reddy_fox
          text: I've got it. We'll roll that big stone across his doorway. In the morning, he'll have to dig his way out.
        - id: ch01-b16
          speaker: narrator
          text: Bobby and Reddy went to work on the big stone. They pulled and tugged, then tugged and pulled, until at last they rolled it right over Johnny Chuck's doorway. All the while, Jimmy Skunk pretended he could not see what they were doing.
        - id: ch01-b17
          speaker: bobby_coon
          text: Now let's go to the Laughing Brook. We can wake old Grandfather Frog and make him say, "Chug-a-rum!"
        - id: ch01-b18
          speaker: reddy_fox
          text: Come on! I'll beat you there!
        - id: ch01-b19
          speaker: narrator
          text: Reddy raced away down the Lone Little Path, and Bobby ran after him. They were off to wake Grandfather Frog from a comfortable sleep on his green lily pad.
        - id: ch01-b20
          speaker: narrator
          text: But Jimmy did not follow them. He stayed beside Johnny Chuck's house and watched until Reddy and Bobby were almost at the Laughing Brook. Then he began digging along one side of the stone that filled the doorway. My, how he made the dirt fly! Before long, he had opened a hole large enough to call through. Down below, Johnny was still fast asleep, snoring in his snug little bed.
        - id: ch01-b21
          speaker: jimmy_skunk
          text: Johnny Chuck, Chuck, Chuck! Johnny Woodchuck!
        - id: ch01-b22
          speaker: narrator
          text: Johnny only snored.
        - id: ch01-b23
          speaker: jimmy_skunk
          text: Johnny Chuck, Chuck, Chuck! Johnny Woodchuck!
        - id: ch01-b24
          speaker: narrator
          text: Still Johnny snored. Jimmy called once more, louder this time.
        - id: ch01-b25
          speaker: johnny_chuck
          text: Who's there?
        - id: ch01-b26
          speaker: narrator
          text: It was a very sleepy voice.
        - id: ch01-b27
          speaker: jimmy_skunk
          text: It's Jimmy Skunk. Put on your coat and come up here!
        - id: ch01-b28
          speaker: johnny_chuck
          text: Go away, Jimmy. I want to sleep!
        - id: ch01-b29
          speaker: jimmy_skunk
          text: There's a surprise waiting for you, Johnny. You really ought to come and see it.
        - id: ch01-b30
          speaker: narrator
          text: The moment Johnny heard that Jimmy had a surprise for him, he wanted to know what it could be. Though he was very, very sleepy, he put on his coat and climbed up toward his door. There he found the great stone Bobby and Reddy had left, and of course it surprised him very much indeed. At first, he thought Jimmy had played the mean trick. For a few minutes, he was very angry. But Jimmy soon told him who had really blocked the doorway.
        - id: ch01-b31
          speaker: jimmy_skunk
          text: You push from inside, Johnny, and I'll pull from out here. We'll soon move this stone away from your door.
        - id: ch01-b32
          speaker: narrator
          text: Johnny pushed while Jimmy pulled, and before long the stone was out of the doorway.
        - id: ch01-b33
          speaker: jimmy_skunk
          text: Now we'll roll it down the Lone Little Path to Reddy Fox's house. Then Reddy can have a surprise of his own.
        - id: ch01-b34
          speaker: narrator
          text: Johnny and Jimmy began tugging and pulling once more. Together, they rolled the big stone down the Lone Little Path, all the way to Reddy Fox's house. Sure enough, the stone filled Reddy's doorway.
        - id: ch01-b35
          speaker: johnny_chuck
          text: Good night, Jimmy Skunk.
        - id: ch01-b36
          speaker: narrator
          text: Johnny trotted home along the Lone Little Path, chuckling to himself every step of the way.
        - id: ch01-b37
          speaker: narrator
          text: Jimmy walked slowly back up the path toward the wood, because Jimmy Skunk never hurries. When he reached the big hollow tree where Bobby Coon lived, he found Hooty the Owl there.
        - id: ch01-b38
          speaker: hooty_owl
          text: Hello, Jimmy Skunk. Where have you been?
        - id: ch01-b39
          speaker: jimmy_skunk
          text: Oh, just out walking. Who lives in this big hollow tree?
        - id: ch01-b40
          speaker: narrator
          text: Of course Jimmy knew perfectly well. He only pretended he did not.
        - id: ch01-b41
          speaker: hooty_owl
          text: Why, this is Bobby Coon's home.
        - id: ch01-b42
          speaker: jimmy_skunk
          text: Let's prepare a surprise for Bobby.
        - id: ch01-b43
          speaker: hooty_owl
          text: What shall we do?
        - id: ch01-b44
          speaker: jimmy_skunk
          text: We can pack his house full of old sticks and leaves.
        - id: ch01-b45
          speaker: narrator
          text: Hooty thought that would be a fine joke. Jimmy gathered all the old sticks and leaves he could find. Hooty took each armful and stuffed it into the old hollow tree that was Bobby's house. He kept packing them in until he could not fit even one more stick or leaf inside.
        - id: ch01-b46
          speaker: jimmy_skunk
          text: Good night, Hooty.
        - id: ch01-b47
          speaker: narrator
          text: Jimmy started up the Crooked Little Path toward his own snug home on the hill.
        - id: ch01-b48
          speaker: hooty_owl
          text: Good night, Jimmy.
        - id: ch01-b49
          speaker: narrator
          text: Hooty flew over to the Great Pine like a big, soft shadow.
        - id: ch01-b50
          speaker: narrator
          text: After a while, old Mother Moon was ready for bed, and the little stars had grown too sleepy to twinkle. Up the Lone Little Path came Reddy Fox and Bobby Coon. They were tired and soaking wet from playing in the Laughing Brook, and they were ready to tumble into their snug little beds.
        - id: ch01-b51
          speaker: narrator
          text: They chuckled about the trick they had played on Johnny Chuck. They chuckled about waking old Grandfather Frog, too, and about all the other mischief they had made. But what do you suppose they said when they reached home and discovered that someone else had been playing tricks as well?
        - id: ch01-b52
          speaker: narrator
          text: I surely don't know. But when round, red Mr. Sun peeped over the hill at Reddy Fox and Bobby Coon, he laughed and laughed. And he will not tell us why.
