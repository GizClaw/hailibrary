  chapters:
    - id: ch01
      title: "CHAPTER I. MRS. REDWING'S SPECKLED EGG"
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Old Mother West Wind came down from the Purple Hills in the golden early-morning light. A great big bag hung over her shoulders. Inside it rode all her children, the Merry Little Breezes.
        - id: ch01-b02
          speaker: narrator
          text: She made her way toward the Green Meadows, singing softly as she went.
        - id: ch01-b03
          speaker: old_mother_west_wind
          text: "Ships upon the ocean wait. I must hurry, hurry on! Mills stand idle if I'm late. I must hurry, hurry on!"
        - id: ch01-b04
          speaker: narrator
          text: At the Green Meadows, Old Mother West Wind opened the bag, tipped it upside down, and gave it a good shake. Out tumbled every one of the Merry Little Breezes. They began spinning round and round for pure joy. They could stay in the meadows all day, until Old Mother West Wind returned that night and gathered them into her bag for the journey home behind the Purple Hills.
        - id: ch01-b05
          speaker: narrator
          text: The first thing they did was race off to visit Johnny Chuck. They found him sitting just outside his own door, eating breakfast. One especially mischievous Breeze snatched the green corn leaf right out of his mouth and dashed away with it. Another gave his whiskers a playful tug, while a third rumpled all the hair on his head.
        - id: ch01-b06
          speaker: narrator
          text: Johnny Chuck acted terribly cross, but he did not mind at all. He loved the Merry Little Breezes and played with them every day.
        - id: ch01-b07
          speaker: narrator
          text: And although they teased Johnny Chuck, they were good to him too. Whenever they spotted Farmer Brown crossing the Green Meadows with a gun, one Breeze would dance over and whisper that he was coming. Johnny Chuck would hide deep inside his snug little home underground. Farmer Brown would wonder and wonder why he could never get close enough to shoot Johnny Chuck. But he never, ever could.
        - id: ch01-b08
          speaker: narrator
          text: After leaving Johnny Chuck, the Breezes raced across the Green Meadows to the Smiling Pool. They wanted to say good morning to Grandfather Frog. He sat on a big lily pad, watching for green flies to eat for breakfast.
        - id: ch01-b09
          speaker: grandfather_frog
          text: Chug-arum! Good morning to you!
        - id: ch01-b10
          speaker: narrator
          text: That cheerful chug-arum was Grandfather Frog's own kind of greeting. Just then, a fat green fly came buzzing along. Up jumped Grandfather Frog. When he settled onto the lily pad again, that fat green fly was nowhere to be seen. Grandfather Frog looked very satisfied indeed as he contentedly rubbed his white waistcoat with one hand.
        - id: ch01-b11
          speakers: [breeze_1, breeze_2, breeze_3]
          ensemble: chorus
          text: Grandfather Frog, what's the news?
        - id: ch01-b12
          speaker: grandfather_frog
          text: Mrs. Redwing has laid a new speckled egg in her nest among the bulrushes.
        - id: ch01-b13
          speakers: [breeze_1, breeze_2, breeze_3]
          ensemble: chorus
          text: We have to go and see it!
        - id: ch01-b14
          speaker: narrator
          text: Away they all ran to the swamp where the bulrushes grew.
        - id: ch01-b15
          speaker: narrator
          text: But someone else had heard about Mrs. Redwing's precious little nest. He had set out early that morning to find it. This was Tommy Brown, the farmer's boy, and he wanted to steal the little speckled eggs simply because they were pretty.
        - id: ch01-b16
          speaker: narrator
          text: When the Merry Little Breezes reached the swamp, they found poor Mrs. Redwing terribly upset. Tommy Brown was already very close to her dear little nest, and his eyes were very sharp. She feared he would find it.
        - id: ch01-b17
          speakers: [breeze_1, breeze_2, breeze_3]
          ensemble: chorus
          text: Oh, we have to help Mrs. Redwing save her pretty speckled eggs from that bad Tommy Brown!
        - id: ch01-b18
          speaker: narrator
          text: One of the Merry Little Breezes whisked Tommy Brown's old straw hat straight off his head and sent it sailing out into the Green Meadows. Of course, Tommy ran after it. Just as he stooped and reached down to pick up the hat, another little Breeze darted in and carried it away again.
        - id: ch01-b19
          speaker: narrator
          text: The little Breezes took turns with the hat. Each time Tommy almost caught it, another one swept it out of reach. They chased it past the Smiling Pool and across the Laughing Brook. Tommy raced behind them, cross and red in the face, breathing harder and harder.
        - id: ch01-b20
          speaker: narrator
          text: On they went, all the way across the Green Meadows to the edge of the wood. There the Breezes hung the old straw hat in the middle of a thorn tree.
        - id: ch01-b21
          speaker: narrator
          text: By the time Tommy Brown had pulled the hat free and put it back on his head, Mrs. Redwing and her dear little nest had slipped entirely from his mind. Besides, at that very moment he heard the breakfast horn blowing. So off he started for home, up the Lone Little Path through the wood.
        - id: ch01-b22
          speaker: narrator
          text: The Merry Little Breezes danced back across the Green Meadows to the swamp and the tall bulrushes. They went to see the new speckled egg in the dear little nest, while Mrs. Redwing sang with joy.
        - id: ch01-b23
          speaker: narrator
          text: As she sang, the Breezes danced among the bulrushes. They knew, and Mrs. Redwing knew, that one day a tiny baby Redwing would come out of that pretty new speckled egg.
