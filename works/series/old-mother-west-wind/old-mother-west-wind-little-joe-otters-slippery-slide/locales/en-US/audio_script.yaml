  chapters:
    - id: ch01
      title: A New Game
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Little Joe Otter and Billy Mink had spent the whole sunny morning playing around the Smiling Pool. They caught enough trout to take a fine dinner home to old Grandfather Mink and blind old Granny Otter. They played tag with the Merry Little Breezes and got into every kind of mischief. Now they had run out of things to do.
        - id: ch01-b02
          speaker: narrator
          text: They sat together on the Big Rock, each trying to shove the other into the pool. Round, red Mr. Sun smiled down and made the Green Meadows very warm. From the tall grass, Reddy Fox heard all their splashing and shouting. He wished he liked cool water and knew how to swim.
        - id: ch01-b03
          speaker: little_joe_otter
          text: I've got an idea!
          emotion: happy
        - id: ch01-b04
          speaker: billy_mink
          text: What is it?
        - id: ch01-b05
          speaker: narrator
          text: Little Joe only gave him a knowing look.
        - id: ch01-b06
          speaker: billy_mink
          text: Is it something we can eat?
        - id: ch01-b07
          speaker: little_joe_otter
          text: No, it isn't something to eat.
        - id: ch01-b08
          speaker: billy_mink
          text: I don't think you have an idea at all.
        - id: ch01-b09
          speaker: little_joe_otter
          text: I do too! I've thought of something we can do.
        - id: ch01-b10
          speaker: billy_mink
          text: Well, what is it?
        - id: ch01-b11
          speaker: narrator
          text: Just then, Little Joe spotted Jerry Muskrat.
        - id: ch01-b12
          speaker: little_joe_otter
          text: Hey, Jerry Muskrat! Come over here!
        - id: ch01-b13
          speaker: narrator
          text: Jerry swam over to the Big Rock and climbed up beside them.
        - id: ch01-b14
          speaker: jerry_muskrat
          text: What are you two doing?
        - id: ch01-b15
          speaker: billy_mink
          text: We're having fun. Little Joe says he's found something new to do, but he won't tell me what it is.
        - id: ch01-b16
          speaker: little_joe_otter
          text: Let's build a slide!
          emotion: happy
        - id: ch01-b17
          speaker: billy_mink
          text: All right. Show us how.
        - id: ch01-b18
          speaker: narrator
          text: Little Joe found a good, smooth place on the bank and showed the others what to do. Billy and Jerry carried over mud. Then all three worked together, patting the mud down until the whole slope was smooth. When they finished, they stood beside the loveliest slippery slide in the world.
    - id: ch02
      title: Down the Slippery Slide
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: Little Joe scrambled up the bank to the very top of the slide. He stretched out flat on his stomach, and Billy gave him a push. Away he went, down and down the slippery slope, until he landed in the Smiling Pool with a great splash. Then Jerry took his turn, and Billy came after him. As soon as all three had tried it, they hurried back up and started over.
        - id: ch02-b02
          speaker: narrator
          text: Each time, they found a different way to slide. Sometimes they lay on their backs, and sometimes they went flat on their stomachs. They tried going headfirst. Then they tried going feet first. Oh, what fun they had racing down that muddy bank and splashing into the water! Even Grandfather Frog came over and tried the slide for himself.
        - id: ch02-b03
          speaker: narrator
          text: Their noise carried all across the Green Meadows. Johnny Chuck heard it and stole down the Lone Little Path to find out what was happening. Up on the hill, Jimmy Skunk had been looking for beetles. The shouts made him forget that he had not eaten breakfast, and off he went toward the pool. Reddy Fox woke from his nap and hurried over to watch the fun. Peter Rabbit was the last one to arrive.
        - id: ch02-b04
          speaker: narrator
          text: Little Joe saw Peter coming.
        - id: ch02-b05
          speaker: little_joe_otter
          text: Hello, Peter Rabbit! Come try our slippery slide!
        - id: ch02-b06
          speaker: narrator
          text: Peter could not swim, but he pretended that was not the reason he stayed away.
        - id: ch02-b07
          speaker: peter_rabbit
          text: I left my bathing suit at home.
        - id: ch02-b08
          speaker: billy_mink
          text: That doesn't matter. Mr. Sun can dry you afterward.
        - id: ch02-b09
          speakers: [breeze_1, breeze_2, breeze_3]
          ensemble: chorus
          text: And we'll help him!
          emotion: happy
        - id: ch02-b10
          speaker: narrator
          text: But Peter shook his head.
        - id: ch02-b11
          speaker: peter_rabbit
          text: No, I won't try it.
        - id: ch02-b12
          speaker: narrator
          text: Billy Mink, Little Joe Otter, Jerry Muskrat, and old Grandfather Frog kept on sliding. They went faster and faster down the bank, and every trip ended with another splash in the Smiling Pool. Peter watched from a distance at first. Then he edged nearer. A little later, he came nearer still. At last, he stood right at the top of the slippery slide.
        - id: ch02-b13
          speaker: narrator
          text: Billy crept up behind him without a sound and pushed. Peter's long legs slipped out from under him, and he landed with a thump on the slide.
        - id: ch02-b14
          speaker: narrator
          text: Peter cried out and tried to stop himself, but he could not. Away he went, straight down the slippery slide and into the Smiling Pool with a splash.
    - id: ch03
      title: Peter Rabbit Takes a Swim
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: Billy Mink laughed, “Ha, ha, ha!” Little Joe Otter shouted, “Ho, ho, ho!” Jerry Muskrat and Grandfather Frog laughed along with them. Sammy Jay, Jimmy Skunk, Reddy Fox, Blacky the Crow, and Mr. Kingfisher all joined in too. You see, Peter Rabbit was forever playing jokes on every one of them.
        - id: ch03-b02
          speaker: narrator
          text: But poor Peter was in real trouble. Water ran into his eyes, up his nose, and into his mouth. He choked and spluttered. He could not get back to the bank because he did not know how to swim.
        - id: ch03-b03
          speaker: narrator
          text: Little Joe soon saw what a dreadful time Peter was having. He dived into the Smiling Pool, swam to Peter, and caught hold of one of his long ears. Billy Mink swam out after him and took hold of the other ear. Then Jerry Muskrat went right underneath Peter and lifted him up onto his back.
        - id: ch03-b04
          speaker: narrator
          text: With old Grandfather Frog leading the way, they carried Peter right across the Smiling Pool. When they reached the other side, they pulled him safely out of the water and onto the grassy bank, where Mr. Sun had made everything warm. All the Merry Little Breezes came over too, and together they helped Mr. Sun dry Peter off.
        - id: ch03-b05
          speaker: narrator
          text: After that, everyone sat down together and watched Little Joe Otter turn a somersault as he went down the slippery slide.
