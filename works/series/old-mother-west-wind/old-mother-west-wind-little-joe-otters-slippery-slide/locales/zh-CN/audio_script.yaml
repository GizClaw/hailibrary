audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖亲切，带着轻快的讲故事感
        timbre: 清澈柔和
        pace: 舒展而富有变化
        pitch: 中音
    little_joe_otter:
      display_name: 小水獭乔
      tts:
        delivery: 活泼随和，兴奋时干脆响亮
        timbre: 清朗有朝气的少年声
        pace: 轻快
        pitch: 中高音
    billy_mink:
      display_name: 水貂比利
      tts:
        delivery: 机灵自信，取笑人时透着顽皮
        timbre: 清亮有活力的男声
        pace: 轻快
        pitch: 中音
    jerry_muskrat:
      display_name: 麝鼠杰里
      tts:
        delivery: 热情爽快，说话朴实直接
        timbre: 温厚明亮的少年声
        pace: 平稳偏快
        pitch: 中音
    grandfather_frog:
      display_name: 青蛙爷爷
      tts:
        delivery: 悠然稳重，话音里带一点诙谐
        timbre: 浑厚略带沙哑
        pace: 缓慢
        pitch: 低音
    peter_rabbit:
      display_name: 兔子彼得
      tts:
        delivery: 好奇冲动，想到好吃的便兴奋起来
        timbre: 轻盈活泼的少年声
        pace: 稍快
        pitch: 中高音
    breeze_1:
      display_name: 小风一号
      tts:
        delivery: 活泼爽朗，充满好奇
        timbre: 清亮的童声
        pace: 轻快
        pitch: 中高音
    breeze_2:
      display_name: 小风二号
      tts:
        delivery: 机灵热心，语气干脆
        timbre: 轻盈的童声
        pace: 轻快
        pitch: 高音
    breeze_3:
      display_name: 小风三号
      tts:
        delivery: 顽皮热烈，带着跳跃感
        timbre: 明快的童声
        pace: 稍快
        pitch: 中高音
    sammy_jay:
      display_name: 松鸦萨米
      tts:
        delivery: 眼尖嘴快，喊话时响亮利落
        timbre: 尖亮的年轻男声
        pace: 偏快
        pitch: 高音
    jimmy_skunk:
      display_name: 臭鼬吉米
      tts:
        delivery: 自负傲慢，心虚时仍勉强装腔作势
        timbre: 略低而圆滑的男声
        pace: 从容偏慢
        pitch: 中低音
    reddy_fox:
      display_name: 狐狸雷迪
      tts:
        delivery: 机灵淘气，出主意时得意又干脆
        timbre: 明亮灵巧的少年声
        pace: 稍快
        pitch: 中音
    blacky_crow:
      display_name: 乌鸦布莱基
      tts:
        delivery: 爽直沉稳，说话简短清楚
        timbre: 略带沙哑的年轻男声
        pace: 平稳
        pitch: 中低音
    mr_kingfisher:
      display_name: 翠鸟先生
      tts:
        delivery: 爽朗响亮，笑声干脆
        timbre: 清脆的成年男声
        pace: 明快
        pitch: 中高音
  chapters:
    - id: ch01
      title: 想个新玩法
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 一个阳光灿烂的早晨，小水獭乔和水貂比利一直在微笑池四周玩耍。他们先去捉鱼，又把一顿丰盛的鳟鱼大餐送回家，给年迈的水貂爷爷和失明的水獭奶奶享用。接着，他们同欢乐小风玩捉人，还到处淘气胡闹，能玩的花样全都试过了。这会儿，两个人再也想不出还能做什么。
        - id: ch01-b02
          speaker: narrator
          text: 他们并肩坐在大岩石上，你推我，我挤你，都想把对方弄进微笑池。圆圆的太阳先生红彤彤、笑眯眯，把绿草地晒得实在暖和。狐狸雷迪躲在远处的高草里，听见他们一会儿泼水，一会儿叫喊，玩得那么痛快，真盼着自己也喜欢清凉舒服的池水，也能下水游泳。
        - id: ch01-b03
          speaker: little_joe_otter
          text: 我想到一个好玩的主意啦！
        - id: ch01-b04
          speaker: billy_mink
          text: 什么好主意？
        - id: ch01-b05
          speaker: narrator
          text: 小水獭乔故意摆出高深莫测的样子，一声不吭。
        - id: ch01-b06
          speaker: billy_mink
          text: 是找到什么好吃的了吗？
        - id: ch01-b07
          speaker: little_joe_otter
          text: 不是。
        - id: ch01-b08
          speaker: billy_mink
          text: 我看你根本什么也没想到。
        - id: ch01-b09
          speaker: little_joe_otter
          text: 谁说的！我想到的是一件好玩的事。
        - id: ch01-b10
          speaker: billy_mink
          text: 那到底是什么？
        - id: ch01-b11
          speaker: narrator
          text: 这时，小水獭乔正好看见麝鼠杰里。
        - id: ch01-b12
          speaker: little_joe_otter
          text: 嗨，麝鼠杰里！快到我们这边来！
        - id: ch01-b13
          speaker: narrator
          text: 杰里游过微笑池，爬上大岩石，挨着两个伙伴坐下。
        - id: ch01-b14
          speaker: jerry_muskrat
          text: 你们俩在玩什么呢？
        - id: ch01-b15
          speaker: billy_mink
          text: 正找乐子呢。乔说他想到了新玩法，可就是不肯告诉我。
        - id: ch01-b16
          speaker: little_joe_otter
          text: 咱们做一条滑梯吧！
        - id: ch01-b17
          speaker: billy_mink
          text: 好啊，你来教我们怎么做。
    - id: ch02
      title: 世上最棒的滑梯
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 小水獭乔在岸坡上找到一块平整光滑的好地方。比利和杰里一趟趟搬来泥巴，帮着乔把坡面拍平。他们拍呀，抹呀，直到眼前出现了世上最可爱的一条滑梯。
        - id: ch02-b02
          speaker: narrator
          text: 乔爬上岸坡，来到滑梯顶端，肚皮贴地趴好。比利从后面一推，他便顺着滑梯向下滑呀，滑呀，最后扑通一声冲进微笑池。接着杰里试了一回，比利又跟在杰里后面滑下来。三个人滑完，马上跑回坡顶，又从头玩起。
        - id: ch02-b03
          speaker: narrator
          text: 他们换着花样往下滑。有时仰面朝天，有时肚皮贴地。有时脑袋在前，有时脚丫在前。哎呀，他们玩得别提有多痛快了！就连年迈的青蛙爷爷也赶过来，亲自试了试这条滑溜溜的滑梯。
        - id: ch02-b04
          speaker: narrator
          text: 热闹声传到绿草地那边。土拨鼠约翰尼听见了，便悄悄沿着孤独小径下来瞧个究竟。臭鼬吉米正在山坡上找甲虫，听到声音，竟连自己还没吃早饭都忘了。狐狸雷迪原本睡得正香，也被吵醒，急忙赶来看热闹。最后一个到的是兔子彼得。
        - id: ch02-b05
          speaker: little_joe_otter
          text: 你好呀，兔子彼得！快来滑一趟！
        - id: ch02-b06
          speaker: narrator
          text: 彼得不会游泳，可他偏要装成自己不想玩。
        - id: ch02-b07
          speaker: peter_rabbit
          text: 我的泳衣忘在家里了。
        - id: ch02-b08
          speaker: billy_mink
          text: 没事，太阳先生会把你晒干的。
        - id: ch02-b09
          speakers: [breeze_1, breeze_2, breeze_3]
          ensemble: chorus
          text: 我们也会来帮忙！
        - id: ch02-b10
          speaker: narrator
          text: 彼得还是摇摇头。
        - id: ch02-b11
          speaker: peter_rabbit
          text: 我不玩。
        - id: ch02-b12
          speaker: narrator
          text: 比利、乔、杰里和青蛙爷爷根本停不下来。他们一趟接着一趟冲下滑梯，扑通扑通滑进微笑池，而且越滑越快。
    - id: ch03
      title: 彼得落水了
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 兔子彼得嘴上说不玩，脚下却越凑越近，最后竟站到了滑梯顶端。比利轻手轻脚溜到他身后，猛地推了一把。彼得两条长腿立刻从身下滑了出去。只听扑通一声，他一屁股坐上了滑梯。
        - id: ch03-b02
          speaker: peter_rabbit
          text: 哎哟！
          emotion: surprised
        - id: ch03-b03
          speaker: narrator
          text: 彼得一边大叫，一边拼命想让自己停下来，可怎么也办不到。他只能顺着滑梯一路冲下去，最后扑通一声掉进了微笑池。
        - id: ch03-b04
          speaker: billy_mink
          text: 哈！哈！哈！
          emotion: happy
        - id: ch03-b05
          speaker: little_joe_otter
          text: 呵！呵！呵！
          emotion: happy
        - id: ch03-b06
          speakers: [jerry_muskrat, grandfather_frog, sammy_jay, jimmy_skunk]
          ensemble: chorus
          text: 嘿！嘿！嘿！
          emotion: happy
        - id: ch03-b07
          speakers: [reddy_fox, blacky_crow, mr_kingfisher]
          ensemble: chorus
          text: 嘿！嘿！嘿！
          emotion: happy
        - id: ch03-b08
          speaker: narrator
          text: 麝鼠杰里、青蛙爷爷、松鸦萨米、臭鼬吉米、狐狸雷迪、乌鸦布莱基和翠鸟先生全都笑了。要知道，兔子彼得平时总爱拿他们开玩笑、捉弄他们。
        - id: ch03-b09
          speaker: narrator
          text: 可怜的彼得！池水灌进眼睛，钻进鼻子，又涌进嘴里，呛得他不停地咳，不住地喘。更糟的是，他怎么也回不到岸上。兔子彼得根本不会游泳，只能在水里苦苦挣扎。
    - id: ch04
      title: 大家一起救彼得
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 小水獭乔看见彼得难受成这样，马上潜进微笑池，抓住他的一只长耳朵。水貂比利也游到彼得身边，抓住另一只长耳朵。麝鼠杰里则径直游到彼得身下，把他稳稳托在自己背上。
        - id: ch04-b02
          speaker: narrator
          text: 年迈的青蛙爷爷游在最前面领路。大家就这样带着彼得，穿过整个微笑池，再把他拖上暖洋洋的草岸。西风妈妈所有的欢乐小风也全赶过来，和太阳先生一起，帮彼得把湿漉漉的身子吹干、晒干。
        - id: ch04-b03
          speaker: narrator
          text: 随后，大家一同坐下来，看着小水獭乔翻着跟头，再一次滑下那条滑梯。
