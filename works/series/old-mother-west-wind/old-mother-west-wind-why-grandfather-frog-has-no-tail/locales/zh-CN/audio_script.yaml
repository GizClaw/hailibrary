audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖亲切，带着轻快的讲故事感
        timbre: 清澈柔和
        pace: 舒展而富有变化
        pitch: 中音
    breeze_1:
      display_name: 小风一号
      tts:
        delivery: 活泼爽朗，充满好奇
        timbre: 清亮的童声
        pace: 轻快
        pitch: 中高音
    breeze_2:
      display_name: 小风二号
      tts:
        delivery: 机灵热心，语气干脆
        timbre: 轻盈的童声
        pace: 轻快
        pitch: 高音
    breeze_3:
      display_name: 小风三号
      tts:
        delivery: 顽皮热烈，带着跳跃感
        timbre: 明快的童声
        pace: 稍快
        pitch: 中高音
    breeze_4:
      display_name: 小风四号
      tts:
        delivery: 天真勇敢，说话利落
        timbre: 柔亮的童声
        pace: 轻快
        pitch: 高音
    grandfather_frog:
      display_name: 青蛙爷爷
      tts:
        delivery: 悠然稳重，话音里带一点诙谐
        timbre: 浑厚略带沙哑
        pace: 缓慢
        pitch: 低音
    mother_nature:
      display_name: 大自然妈妈
      tts:
        delivery: 庄重坚定，不疾不徐
        timbre: 沉稳宽厚的成熟女声
        pace: 从容
        pitch: 中低音
  chapters:
    - id: ch01
      title: 微笑池边
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 西风妈妈上工去了，把欢乐小风都留在绿草地上。小风们玩过捉人游戏，跟蜜蜂赛过跑，还和阳光捉过迷藏。玩够以后，它们一起聚到微笑池边。青蛙爷爷正坐在一片绿油油的大睡莲叶上。
        - id: ch01-b02
          speaker: narrator
          text: 青蛙爷爷年纪很大，实在是很大了，也聪明得很。他穿着绿外套，嗓音又低又沉。只要他一开口，大家都会恭恭敬敬地听。就连水貂比利也不例外。因为比利的爸爸，还有爸爸的爸爸，都记不得青蛙爷爷是哪一天开始坐在那里等绿头苍蝇的。
        - id: ch01-b03
          speaker: narrator
          text: 水里还游着青蛙爷爷隔了好多代的玄孙。要是没人告诉你，你准认不出它们来。它们和青蛙爷爷一点儿也不像，身子又圆又胖，还拖着长尾巴。也许人们正是为这个，才叫它们蝌蚪。
        - id: ch01-b04
          speaker: breeze_1
          text: 青蛙爷爷，您年轻时也有尾巴，后来怎么没有了？给我们讲讲吧！
        - id: ch01-b05
          speaker: narrator
          text: 青蛙爷爷一口吞下一只傻乎乎的绿头苍蝇，在大睡莲叶上坐稳。欢乐小风全围了过来，等着听故事。
    - id: ch02
      title: 青蛙国王的长尾巴
      blocks:
        - id: ch02-b01
          speaker: grandfather_frog
          text: 很久很久以前，青蛙统治着整个世界。那时到处几乎都是水，陆地少得可怜，实在少得可怜！那时没有男孩子朝青蛙扔石头，也没有饿肚子的水貂，把正在晒太阳的傻青蛙娃娃一口吞掉！
        - id: ch02-b02
          speaker: narrator
          text: 水貂比利也挤在欢乐小风中间听着。听到这里，他不安地扭了扭身子，心虚地把脸转开了。
        - id: ch02-b03
          speaker: grandfather_frog
          text: 那时候，青蛙都有又长又漂亮的尾巴，每一只都得意得不得了。青蛙国王比别的青蛙大一倍，尾巴更是长了三倍。他最骄傲的，就是自己的长尾巴。
        - id: ch02-b04
          speaker: grandfather_frog
          text: 他整天坐着欣赏那条尾巴，越看越觉得，不管过去还是将来，世上都不会再有这么好的尾巴。他把尾巴放在水里来回摆。每摆一下，别的青蛙就一起叫一声“啊”，再叫一声“噢”。
        - id: ch02-b05
          speaker: grandfather_frog
          text: 国王一天比一天自负。到后来，除了吃饭、睡觉和看自己的尾巴，他什么也不干。别的青蛙见了，也全都照着学。没过多久，整个青蛙一族都只会闲坐着吃饭、睡觉，欣赏自己的尾巴，也欣赏国王的尾巴。
    - id: ch03
      title: 尾巴消失了
      blocks:
        - id: ch03-b01
          speaker: grandfather_frog
          text: 你们都知道，一个人在世上什么正经事也不做，就没有用处，世上也没有多少地方留给他。大自然妈妈看见青蛙一族变成了这个样子，就把青蛙国王叫到面前。
        - id: ch03-b02
          speaker: mother_nature
          text: 你心里只想着漂亮的尾巴，我要把它收走。你除了吃饭、睡觉，什么也不肯做。你的嘴会变得像门一样宽，眼睛会从脑袋上鼓出来，两条腿也会弯曲难看。全世界都会笑话你。
        - id: ch03-b03
          speaker: grandfather_frog
          text: 青蛙国王连忙看自己的漂亮尾巴。尾巴好像已经短了一些。他再看一眼，又短了。每看一次，那条尾巴就变得更短、更小。
        - id: ch03-b04
          speaker: grandfather_frog
          text: 过了一会儿，他低头一看，只剩下一小截尾巴，连摆也摆不动。后来，这一小截也消失了。他的眼睛从脑袋上鼓出来，嘴巴却越变越大。
    - id: ch04
      title: 青蛙爷爷的答案
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 青蛙爷爷忽然停住了。他忧伤地望着一只傻乎乎的绿头苍蝇，那只苍蝇正朝他飞来。
        - id: ch04-b02
          speaker: grandfather_frog
          text: 咕咚呱！
        - id: ch04-b03
          speaker: narrator
          text: 青蛙爷爷大大张开嘴，往空中一跃。等他重新坐回大睡莲叶上，绿头苍蝇已经不见了。他咂了咂嘴，又讲了下去。
        - id: ch04-b04
          speaker: grandfather_frog
          text: 从那一天直到今天，每只青蛙刚出生时都有一条大尾巴。身子越长越大，尾巴却越变越小，最后完全消失。到了这时候，他就会想起，拿大自然赐给自己的东西来炫耀，是多么愚蠢、多么无用。我的尾巴就是这样丢掉的。
        - id: ch04-b05
          speakers: [breeze_1, breeze_2, breeze_3, breeze_4]
          ensemble: chorus
          text: 谢谢您！我们不会忘记的！
        - id: ch04-b06
          speaker: narrator
          text: 说完，小风们又赛起跑来，看谁能最先赶到土拨鼠约翰尼家，把布朗农夫正带着枪走向绿草地的消息告诉他。
