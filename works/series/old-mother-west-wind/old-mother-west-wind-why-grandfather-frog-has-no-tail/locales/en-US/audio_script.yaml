  chapters:
    - id: ch01
      title: CHAPTER II WHY GRANDFATHER FROG HAS NO TAIL
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Old Mother West Wind had gone off to her day's work, leaving all the Merry Little Breezes to play in the Green Meadows. They had chased one another in a game of tag, raced with the Bees, and hidden from the Sun Beams. Now they were gathered around the Smiling Pool. Grandfather Frog sat there on a green lily pad.
        - id: ch01-b02
          speaker: narrator
          text: Grandfather Frog was old. He was very old indeed, and very, very wise. He wore a green coat, and his voice was deep. Whenever he spoke, everyone listened with great respect. Even Billy Mink showed respect for Grandfather Frog. Neither Billy's father nor his father's father could remember a time when the old Frog had not sat on that lily pad, watching for green flies.
        - id: ch01-b03
          speaker: narrator
          text: Some of Grandfather Frog's great-great-great-great-great-grandchildren lived down in the Smiling Pool. You would never have guessed they were his grandchildren unless someone told you. They looked nothing like him. They were fat and round, with long tails. Perhaps that was why everyone called them Pollywogs.
        - id: ch01-b04
          speaker: breeze_1
          text: Oh, Grandfather Frog, please tell us why you don't have the tail you had when you were young.
        - id: ch01-b05
          speaker: narrator
          text: Grandfather Frog snapped up a foolish green fly. Then he made himself comfortable on his big lily pad, and all the Merry Little Breezes crowded around to hear his story.
        - id: ch01-b06
          speaker: grandfather_frog
          text: Long, long ago, the Frogs ruled the world, and almost all of that world was water. There was hardly any dry land. There were no boys to throw stones. And there were no hungry Minks to gobble up foolish little Frogs while they took a sunbath!
        - id: ch01-b07
          speaker: narrator
          text: Billy Mink had joined the Breezes to listen. Now he wriggled uneasily and looked away, feeling guilty.
        - id: ch01-b08
          speaker: grandfather_frog
          text: Every Frog had a tail in those days. They were long, handsome tails, and the Frogs were very proud of them. The King of the Frogs was twice as big as any other Frog, and his tail was three times as long.
        - id: ch01-b09
          speaker: grandfather_frog
          text: The King was terribly proud of that tail. He would sit and stare at it until he was sure no one had ever owned such a tail before, and no one ever would again. He waved it back and forth through the water. Each time he did, all the other Frogs cried out.
        - id: ch01-b10
          speakers: [frog_1, frog_2, frog_3]
          ensemble: chorus
          text: Ah! Oh!
        - id: ch01-b11
          speaker: grandfather_frog
          text: The King became more vain every day. Soon he did nothing except eat, sleep, and admire his tail. All the other Frogs copied their King. Before long, the whole Frog tribe simply sat around eating and sleeping, admiring their own tails and the King's tail too.
        - id: ch01-b12
          speaker: grandfather_frog
          text: Now, there is little room in this world for those who never do anything worthwhile. Mother Nature saw how useless the Frog tribe had become. She called the King Frog before her and spoke to him.
        - id: ch01-b13
          speaker: mother_nature
          text: You think of nothing but your beautiful tail, so I will take it away. You do nothing except eat and sleep, so your mouth will grow as wide as a door, and your eyes will stick out from your head. Your legs will bend, you will become ugly, and the whole world will laugh at you.
        - id: ch01-b14
          speaker: grandfather_frog
          text: The King Frog looked at his beautiful tail. It already seemed shorter. He looked once more, and it was shorter still. Each time he turned to look, the tail had shrunk again.
        - id: ch01-b15
          speaker: grandfather_frog
          text: At last, only a tiny stub remained, and he could not even wriggle it. Then the stub vanished too. His eyes popped out, and his mouth grew wider and wider.
        - id: ch01-b16
          speaker: narrator
          text: Old Grandfather Frog paused. He watched sadly as another foolish green fly came his way.
        - id: ch01-b17
          speaker: grandfather_frog
          text: Chug-arum!
        - id: ch01-b18
          speaker: narrator
          text: Grandfather Frog opened his mouth very wide and sprang into the air. When he landed on his big lily pad again, the green fly had disappeared. He smacked his lips and went on with the story.
        - id: ch01-b19
          speaker: grandfather_frog
          text: From that day to this, every Frog begins life with a big tail. As the Frog grows larger, the tail grows smaller. At last it disappears. Then the Frog remembers how foolish and useless it is to be vain about what nature has given us. And that is how I lost my tail.
        - id: ch01-b20
          speakers: [breeze_1, breeze_2, breeze_3]
          ensemble: chorus
          text: Thank you! We won't forget!
        - id: ch01-b21
          speaker: narrator
          text: Then the Merry Little Breezes raced away to see who could reach Johnny Chuck's home first. They all wanted to tell him that Farmer Brown was coming down onto the Green Meadows with a gun.
