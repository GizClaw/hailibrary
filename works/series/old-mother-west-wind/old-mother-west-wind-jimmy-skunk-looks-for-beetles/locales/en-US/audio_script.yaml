  chapters:
    - id: ch01
      title: "CHAPTER VII. JIMMY SKUNK LOOKS FOR BEETLES"
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Very early one morning, Jimmy Skunk opened his eyes and peeked out of his snug little house on the hill. Big, round Mr. Sun had just begun climbing into the sky, with his red face smiling. Old Mother West Wind was just setting out for the Green Meadows with her large bag over one shoulder. Jimmy knew that all her children, the Merry Little Breezes, were riding inside. She was taking them down to the meadows, where they would play and frolic all day.
        - id: ch01-b02
          speaker: jimmy_skunk
          text: Good morning, Mother West Wind. On your way down the hill, did you happen to see any beetles?
        - id: ch01-b03
          speaker: narrator
          text: Old Mother West Wind told him she had not seen a single beetle on her way down.
        - id: ch01-b04
          speaker: jimmy_skunk
          text: Thank you. Then I suppose I'll have to find them myself. I'm very, very hungry.
        - id: ch01-b05
          speaker: narrator
          text: Jimmy brushed his handsome black-and-white coat, washed his face and paws, and set out to find some beetles for breakfast. First he went down to the Green Meadows and stopped at Johnny Chuck's house. But Johnny was still in bed, fast asleep. Next Jimmy went to see whether Reddy Fox would come along and help him find those beetles. Reddy had stayed out very, very late the night before, and he was still in bed, fast asleep too.
        - id: ch01-b06
          speaker: narrator
          text: So Jimmy went on alone, following the Crooked Little Path uphill. He moved slowly, because Jimmy Skunk never hurries. At every old log, he paused and looked underneath for beetles.
        - id: ch01-b07
          speaker: narrator
          text: After a while, he came upon a big piece of bark lying beside the Crooked Little Path. He took hold of it with his two little black paws and pulled and pulled. All at once, the heavy bark turned over so quickly that Jimmy lost his balance and fell flat on his back.
        - id: ch01-b08
          speaker: narrator
          text: Jimmy rolled back onto his feet. There in the path sat old Mr. Toad, looking very, very cross. He puffed himself up, then puffed some more, until he looked twice as big as Jimmy had ever seen him.
        - id: ch01-b09
          speaker: jimmy_skunk
          text: Good morning, Mr. Toad. Have you come across any beetles?
        - id: ch01-b10
          speaker: narrator
          text: Mr. Toad only blinked his huge, round, goggly eyes.
        - id: ch01-b11
          speaker: mr_toad
          text: Jimmy Skunk, why did you pull the roof right off my house?
          emotion: angry
        - id: ch01-b12
          speaker: jimmy_skunk
          text: Oh, was that your roof? I won't pull it off again.
        - id: ch01-b13
          speaker: narrator
          text: Then Jimmy stepped right over old Mr. Toad and continued up the Crooked Little Path, still looking for beetles.
        - id: ch01-b14
          speaker: narrator
          text: Before long, Jimmy came to the hollow stump of an old tree. In one side was the nicest little round hole. Jimmy took hold of the edge with his two little black paws and pulled and pulled. All at once, the whole side of the stump tore open. Once again, Jimmy lost his balance and fell flat on his back.
        - id: ch01-b15
          speaker: narrator
          text: When Jimmy had rolled to his feet, Striped Chipmunk was in the middle of the path, hopping up and down with anger.
        - id: ch01-b16
          speaker: jimmy_skunk
          text: Good morning, Striped Chipmunk. Have you seen any beetles around here?
        - id: ch01-b17
          speaker: narrator
          text: Striped Chipmunk only hopped faster.
        - id: ch01-b18
          speaker: striped_chipmunk
          text: Jimmy Skunk, why did you tear the whole side off my house?
          emotion: angry
        - id: ch01-b19
          speaker: jimmy_skunk
          text: Was that part of your house? I won't do it again.
        - id: ch01-b20
          speaker: narrator
          text: Jimmy stepped right over Striped Chipmunk and kept going up the Crooked Little Path in search of beetles.
        - id: ch01-b21
          speaker: narrator
          text: Soon he met Peter Rabbit, who was hopping down the path toward him.
        - id: ch01-b22
          speaker: peter_rabbit
          text: Good morning, Jimmy Skunk. Where are you headed at this time of day?
        - id: ch01-b23
          speaker: jimmy_skunk
          text: Good morning, Peter Rabbit. Have you spotted any beetles?
        - id: ch01-b24
          speaker: peter_rabbit
          text: No, I haven't spotted any. But I'll help you look.
        - id: ch01-b25
          speaker: narrator
          text: Peter turned right around and hopped ahead of Jimmy, going back up the Crooked Little Path. Peter Rabbit had long legs, and he was always in a hurry. Jimmy, as usual, took his time. So Peter reached the top of the hill long before Jimmy did.
        - id: ch01-b26
          speaker: narrator
          text: When Jimmy finally reached the end of the Crooked Little Path at the top of the hill, Peter was sitting up very straight. His eyes were fixed on a great flat stone, and he was looking at it as hard as he could.
        - id: ch01-b27
          speaker: jimmy_skunk
          text: Peter Rabbit, what are you staring at?
        - id: ch01-b28
          speaker: peter_rabbit
          text: Sh-h-h! I believe there are beetles under that big flat stone. See that little black string poking out? Wait until I count to three. Then grab it and give it a hard pull. There might be a beetle on the other end.
        - id: ch01-b29
          speaker: narrator
          text: Jimmy got himself ready, and Peter began to count.
        - id: ch01-b30
          speaker: peter_rabbit
          text: One! Two! Three!
        - id: ch01-b31
          speaker: narrator
          text: Jimmy grabbed the black string and pulled as hard as he possibly could. Out from under the stone came Mr. Black Snake! The little black string Jimmy had pulled was really Mr. Black Snake's tail, and Mr. Black Snake was very, very angry indeed.
        - id: ch01-b32
          speaker: peter_rabbit
          text: Ha! Ha! Ha!
          emotion: happy
        - id: ch01-b33
          speaker: mr_black_snake
          text: Jimmy Skunk, what did you pull my tail for?
          emotion: angry
        - id: ch01-b34
          speaker: jimmy_skunk
          text: Oh, was that your tail? I won't pull it again. Have you happened to see any beetles?
        - id: ch01-b35
          speaker: narrator
          text: Mr. Black Snake had not seen any beetles. He was so cross that Jimmy went on over the hill to keep searching.
        - id: ch01-b36
          speaker: narrator
          text: Peter Rabbit was still laughing and laughing and laughing. The more Peter laughed, the angrier Mr. Black Snake grew. At last, Mr. Black Snake could stand it no longer. He started after Peter Rabbit to teach him a lesson.
        - id: ch01-b37
          speaker: narrator
          text: Peter stopped laughing then, because Mr. Black Snake could move very fast. Away Peter flew down the Crooked Little Path, going as fast as his long legs could carry him. And away went Mr. Black Snake, racing right after Peter.
        - id: ch01-b38
          speaker: narrator
          text: Jimmy did not look back even once to find out whether Mr. Black Snake caught Peter Rabbit. Jimmy had found some beetles at last, and he was busy eating his breakfast.
