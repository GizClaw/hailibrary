audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖亲切，带着轻快的讲故事感
        timbre: 清澈柔和
        pace: 舒展而富有变化
        pitch: 中音
    old_mother_west_wind:
      display_name: 西风妈妈
      tts:
        delivery: 温和坦率，语气开阔明朗
        timbre: 柔润成熟的女声
        pace: 从容
        pitch: 中音
    jimmy_skunk:
      display_name: 臭鼬吉米
      tts:
        delivery: 自负傲慢，心虚时仍勉强装腔作势
        timbre: 略低而圆滑的男声
        pace: 从容偏慢
        pitch: 中低音
    mr_toad:
      display_name: 蟾蜍先生
      tts:
        delivery: 脾气直爽，生气时气呼呼的
        timbre: 粗厚的老年男声
        pace: 偏慢
        pitch: 低音
    striped_chipmunk:
      display_name: 花栗鼠条纹
      tts:
        delivery: 活泼敏捷，着急时语速飞快
        timbre: 清亮的少年声
        pace: 轻快
        pitch: 中高音
    peter_rabbit:
      display_name: 兔子彼得
      tts:
        delivery: 顽皮机灵，笑声爽朗
        timbre: 明亮清透的少年声
        pace: 轻快
        pitch: 中高音
    mr_black_snake:
      display_name: 黑蛇先生
      tts:
        delivery: 严厉警觉，发怒时声音紧绷
        timbre: 低沉清晰的成年男声
        pace: 稳健
        pitch: 低音
  chapters:
    - id: ch01
      title: 吉米的甲虫早餐
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 一天清早，臭鼬吉米睁开眼睛，从山坡上那座暖和又舒适的小屋里探头往外看。圆滚滚的太阳先生露着红彤彤的笑脸，刚刚开始往天空中爬。西风妈妈也才出发。她肩上背着大口袋，正要去绿草地。吉米知道，袋子里装着她所有的孩子，那些欢乐小风。她要带小风们到绿草地上尽情玩耍，痛痛快快地玩上一整天。
        - id: ch01-b02
          speaker: jimmy_skunk
          text: 西风妈妈，早安。您下山的时候，看见甲虫了吗？
        - id: ch01-b03
          speaker: narrator
          text: 西风妈妈告诉吉米，她一路下来，一只甲虫也没看见。
        - id: ch01-b04
          speaker: jimmy_skunk
          text: 谢谢您。那我只好自己去找啦。我现在饿得很，真是太饿了。
        - id: ch01-b05
          speaker: narrator
          text: 吉米把漂亮的黑白外套刷干净，又洗了脸和手，这才出门找甲虫当早餐。他先来到绿草地，在土拨鼠约翰尼家门口停下。可约翰尼还躺在床上，睡得正香。吉米又去找狐狸雷迪，想问他愿不愿意一道去，帮自己找几只甲虫。可雷迪昨晚在外面待到很晚，也还在床上呼呼大睡。
        - id: ch01-b06
          speaker: narrator
          text: 看来谁也不能陪他。吉米便独自沿着弯弯小径上山，继续寻找自己的甲虫早餐。他走得慢悠悠的，因为臭鼬吉米从来不会匆匆忙忙。每遇到一根倒在地上的老木头，他都要停下来，探头仔细看看底下有没有藏着甲虫。
    - id: ch02
      title: 两座被拆开的家
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 走着走着，吉米看见弯弯小径旁边有一大块树皮。他用两只黑色小爪子抓紧树皮，拉呀，拉呀。忽然，大树皮猛地翻了过来，吉米也仰面摔倒，四脚朝天。
        - id: ch02-b02
          speaker: narrator
          text: 吉米翻身用四只脚站稳，才发现蟾蜍先生正坐在弯弯小径中央。蟾蜍先生真的气坏了。他鼓起身子，又呼呼喘气，喘了又鼓，鼓了又喘，最后竟比吉米以前见过的大了整整一倍。
        - id: ch02-b03
          speaker: jimmy_skunk
          text: 蟾蜍先生，早安。您有没有看见甲虫？
        - id: ch02-b04
          speaker: narrator
          text: 蟾蜍先生眨了眨又大又圆、向外凸出的眼睛。
        - id: ch02-b05
          speaker: mr_toad
          text: 臭鼬吉米，你干吗把我家的屋顶掀掉？
          emotion: angry
        - id: ch02-b06
          speaker: jimmy_skunk
          text: 原来那是您家的屋顶吗？以后我不掀了。
        - id: ch02-b07
          speaker: narrator
          text: 吉米从蟾蜍先生身上一跨而过，继续沿着弯弯小径上山找甲虫。
        - id: ch02-b08
          speaker: narrator
          text: 走着走着，他又来到一个空心的老树桩前。树桩一边有个圆圆的小洞，看上去再合适不过。吉米用两只黑色小爪子抓住树桩的一边，接着拉呀，拉呀。忽然，树桩的整个侧面一下子被扯开了，吉米又一次仰面摔倒，摔了个四脚朝天。
        - id: ch02-b09
          speaker: narrator
          text: 他刚翻身用四只脚站稳，就看见花栗鼠条纹在小径正中央跳上跳下。条纹气得一刻也停不住。
        - id: ch02-b10
          speaker: jimmy_skunk
          text: 花栗鼠条纹，早安。你看见甲虫了吗？
        - id: ch02-b11
          speaker: narrator
          text: 花栗鼠条纹跳得更快了。
        - id: ch02-b12
          speaker: striped_chipmunk
          text: 臭鼬吉米，你为什么把我家的墙壁扯下来？
          emotion: angry
        - id: ch02-b13
          speaker: jimmy_skunk
          text: 原来那是你家的墙壁吗？以后我不扯了。
        - id: ch02-b14
          speaker: narrator
          text: 吉米从花栗鼠条纹身上一跨而过，又沿着弯弯小径向山上走去。他还是要找甲虫。
    - id: ch03
      title: 石头下面的黑绳
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 没过多久，兔子彼得蹦蹦跳跳地沿着弯弯小径下山来了。
        - id: ch03-b02
          speaker: peter_rabbit
          text: 臭鼬吉米，早安。这么早，你要去哪儿呀？
        - id: ch03-b03
          speaker: jimmy_skunk
          text: 兔子彼得，早安。你看见甲虫了吗？
        - id: ch03-b04
          speaker: peter_rabbit
          text: 没有，一只也没看见。不过我可以帮你一起找。
        - id: ch03-b05
          speaker: narrator
          text: 彼得转过身，蹦到吉米前头，带着他沿弯弯小径上山。彼得的腿很长，做什么又总是急急忙忙，所以他第一个到了山顶。等吉米终于走到山顶的弯弯小径尽头，彼得已经直挺挺地坐在那里。他的眼睛紧盯着一块又大又平的石头，翻来覆去地看，看得可仔细了。
        - id: ch03-b06
          speaker: jimmy_skunk
          text: 兔子彼得，你一直盯着什么呢？
        - id: ch03-b07
          speaker: peter_rabbit
          text: 嘘，小声点儿！那块大平石底下露出了一根黑绳，我想下面一定藏着甲虫。等我数到三，你抓住绳子用力拉。也许绳子的另一头正好就是一只甲虫呢。
        - id: ch03-b08
          speaker: narrator
          text: 吉米摆好了架势，彼得开始数数。
        - id: ch03-b09
          speaker: peter_rabbit
          text: 我开始啦。一！二！三！
        - id: ch03-b10
          speaker: narrator
          text: 吉米抓住那根黑绳，使出全身力气猛地一拉。可从石头下面钻出来的不是甲虫，而是黑蛇先生！吉米拉的哪里是什么绳子，分明是黑蛇先生的尾巴。黑蛇先生气得不得了。
        - id: ch03-b11
          speaker: narrator
          text: 兔子彼得看见这一幕，哈哈大笑起来。
        - id: ch03-b12
          speaker: mr_black_snake
          text: 臭鼬吉米，你为什么要拉我的尾巴？
          emotion: angry
        - id: ch03-b13
          speaker: jimmy_skunk
          text: 原来那是您的尾巴吗？以后我不拉了。对了，您看见甲虫了吗？
        - id: ch03-b14
          speaker: narrator
          text: 黑蛇先生也没有见过甲虫。他还气得厉害，吉米便翻过山头，接着去找自己的早餐。
    - id: ch04
      title: 谁也耽误不了早餐
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 兔子彼得还在不停地笑，笑呀，笑呀，怎么也停不下来。他笑得越厉害，黑蛇先生就越生气。到最后，黑蛇先生朝彼得追了过去，非要给他一个教训不可。
        - id: ch04-b02
          speaker: narrator
          text: 彼得这下再也笑不出来了。黑蛇先生爬得快极了，彼得只好沿着弯弯小径往山下逃，能跑多快就跑多快。黑蛇先生紧跟在后面，也一路追了下去。
        - id: ch04-b03
          speaker: narrator
          text: 可臭鼬吉米连一次头也没回。他根本没去看黑蛇先生有没有追上兔子彼得，又有没有给彼得一个教训。因为他已经找到了甲虫，正忙着吃自己的早餐呢。
