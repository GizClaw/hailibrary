  chapters:
    - id: ch01
      title: CHAPTER VI REDDY FOX GOES FISHING
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: One morning, Mr. Sun shone very, very brightly, and the Green Meadows were very, very warm. Reddy Fox came hopping and skipping along the Lone Little Path toward the Laughing Brook. Hoppity, skip, skippity hop! He was mighty pleased with himself that sunny morning.
        - id: ch01-b02
          speaker: narrator
          text: Before long, he saw Johnny Chuck sitting straight up beside his little house.
        - id: ch01-b03
          speaker: reddy_fox
          text: Johnny Chuck, Chuck, Chuck! Johnny Chuck, Chuck, Chuck! Johnny Woodchuck!
        - id: ch01-b04
          speaker: narrator
          text: Johnny acted as though he had heard nothing. His mother had told him not to play with Reddy Fox, because Reddy was a bad boy.
        - id: ch01-b05
          speaker: reddy_fox
          text: Johnny Chuck, Chuck, Chuck! Johnny Woodchuck!
        - id: ch01-b06
          speaker: narrator
          text: This time Johnny looked around. Reddy was turning somersaults, chasing his own tail, and rolling over and over on the little path.
        - id: ch01-b07
          speaker: reddy_fox
          text: Come with me! Let's go fishing!
        - id: ch01-b08
          speaker: johnny_chuck
          text: I can't.
        - id: ch01-b09
          speaker: narrator
          text: Johnny remembered what his mother had told him.
        - id: ch01-b10
          speaker: reddy_fox
          text: I'll teach you how to catch a fish!
        - id: ch01-b11
          speaker: narrator
          text: Reddy tried to leap right over his own shadow.
        - id: ch01-b12
          speaker: johnny_chuck
          text: No, I can't.
        - id: ch01-b13
          speaker: narrator
          text: Good little Johnny turned away. Then he could not watch Reddy chasing butterflies and playing catch with the Field Mice children.
        - id: ch01-b14
          speaker: narrator
          text: So Reddy went all alone down to the Laughing Brook. The brook laughed and sang as it hurried along to join the Big River. Above it, the sky was blue, and the bright sun warmed everything below.
        - id: ch01-b15
          speaker: narrator
          text: Reddy jumped onto the Big Rock in the middle of the brook and peeped over the far side. And what did he see? Down below, in a Dear Little Pool, swam Mr. and Mrs. Trout with all the little Trouts.
        - id: ch01-b16
          speaker: narrator
          text: Reddy wanted to take some of those little Trouts home for his dinner, but he had no idea how to catch them. He lay flat on the Big Rock and reached as far down into the pool as he could. The little Trouts only laughed. Not one of them came close enough for his paw to reach.
        - id: ch01-b17
          speaker: narrator
          text: Then Mr. Trout darted up before Reddy saw him coming and bit his little black paw hard.
        - id: ch01-b18
          speaker: reddy_fox
          text: Ouch!
          emotion: surprised
        - id: ch01-b19
          speaker: narrator
          text: Reddy jerked his paw out of the water, while all the little Trouts laughed at him.
        - id: ch01-b20
          speaker: narrator
          text: Just then, Billy Mink came along.
        - id: ch01-b21
          speaker: billy_mink
          text: Hello, Reddy Fox! What are you doing out here?
        - id: ch01-b22
          speaker: reddy_fox
          text: I'm trying to catch a fish.
        - id: ch01-b23
          speaker: billy_mink
          text: Pooh! That's easy. Watch me, and I'll show you.
        - id: ch01-b24
          speaker: narrator
          text: Billy lay down beside Reddy on the Big Rock and peeped into the Dear Little Pool. The little Trouts were still laughing at Reddy and having a fine time. But Billy took great care as he looked over the edge. He made sure Mr. Trout and Mrs. Trout never saw him there.
        - id: ch01-b25
          speaker: narrator
          text: When Billy saw all the little Trouts playing below, he laughed.
        - id: ch01-b26
          speaker: billy_mink
          text: Count to three, Reddy. Then you'll see how to catch one.
        - id: ch01-b27
          speaker: reddy_fox
          text: One! Two! Three!
        - id: ch01-b28
          speaker: narrator
          text: Splash! Billy dived headfirst into the Dear Little Pool. Water flew all the way up onto Reddy. It startled old Grandfather Frog so badly that he toppled backward from the lily pad where he had been taking his morning nap and fell straight into the water.
        - id: ch01-b29
          speaker: narrator
          text: A minute later, Billy climbed out on the other side of the Dear Little Pool. Sure enough, he had caught one of the little Trouts.
        - id: ch01-b30
          speaker: reddy_fox
          text: Give that fish to me!
        - id: ch01-b31
          speaker: billy_mink
          text: Catch your own. Old Grandpa Mink wants a fish for dinner, so I'm taking this one home. You're scared, Reddy Fox! Fraid-cat! Fraid-cat!
        - id: ch01-b32
          speaker: narrator
          text: Billy shook the water from his little brown coat, picked up the Trout, and ran home.
        - id: ch01-b33
          speaker: narrator
          text: Reddy lay down on the Big Rock again and peered into the Dear Little Pool. Not one Trout was in sight. They were all safely hidden with Mr. and Mrs. Trout.
        - id: ch01-b34
          speaker: narrator
          text: Reddy watched and watched. The sun felt warm, and the Laughing Brook sang him a lullaby. And then, what do you suppose happened? Reddy fell fast asleep right at the edge of the great Big Rock.
        - id: ch01-b35
          speaker: narrator
          text: After a while, Reddy began to dream. He dreamed he had a fine little brown coat that kept out water, just like the little brown coat Billy Mink wore. Then he dreamed he had learned to swim and could catch fish just as Billy did.
        - id: ch01-b36
          speaker: narrator
          text: In his dream, the Dear Little Pool was full of little Trouts. He was just about to catch one when—splash! Reddy rolled straight off the Big Rock and into the pool.
        - id: ch01-b37
          speaker: narrator
          text: Water filled Reddy's eyes and ran up his nose. He swallowed so much that he felt he would never, never want another drink.
        - id: ch01-b38
          speaker: narrator
          text: His beautiful red coat was soaking wet. Old Mother Fox had warned him to take very, very good care of it, because he could not have another coat for a whole year. His pants were wet too. His beautiful bushy tail, the tail he was so proud of, held so much water that he could not lift it.
        - id: ch01-b39
          speaker: narrator
          text: Reddy crawled from the Dear Little Pool and dragged that heavy tail up the bank behind him.
        - id: ch01-b40
          speaker: mr_kingfisher
          text: Ha! Ha! Ha!
          emotion: happy
        - id: ch01-b41
          speaker: narrator
          text: Mr. Kingfisher sat laughing in a tree.
        - id: ch01-b42
          speaker: grandfather_frog
          text: Ho! Ho! Ho!
          emotion: happy
        - id: ch01-b43
          speaker: narrator
          text: Grandfather Frog had climbed back onto his lily pad.
        - id: ch01-b44
          speakers: [little_trout_1, little_trout_2, mr_trout, mrs_trout]
          ensemble: chorus
          text: He! He! He!
          emotion: happy
        - id: ch01-b45
          speaker: narrator
          text: All the little Trouts laughed with Mr. and Mrs. Trout as they swam round and round the pool.
        - id: ch01-b46
          speaker: billy_mink
          text: Ha! Ha! Ha! Ho! Ho! Ho! He! He! He!
          emotion: happy
        - id: ch01-b47
          speaker: narrator
          text: Billy Mink had come back to the Big Rock just in time to see Reddy tumble into the water.
        - id: ch01-b48
          speaker: narrator
          text: Reddy was too ashamed to say a word. He crept home along the Lone Little Path, pulling his wet, muddy tail behind him and dripping water every step of the way.
        - id: ch01-b49
          speaker: narrator
          text: Johnny Chuck was still beside his door, just as his mother had told him to be. Reddy tried to slip past unseen, but Johnny's bright little eyes spotted him.
        - id: ch01-b50
          speaker: johnny_chuck
          text: Where are all the fish you caught, Reddy Fox?
        - id: ch01-b51
          speaker: johnny_chuck
          text: Why aren't you turning somersaults now? Why don't you jump over your shadow, chase butterflies, and play with the little Field Mice?
        - id: ch01-b52
          speaker: narrator
          text: Reddy only walked faster. When he was nearly home, he saw old Mother Fox sitting in the doorway. A great big switch lay across her lap. You see, Mother Fox had told Reddy not to go near the Laughing Brook.
        - id: ch01-b53
          speaker: narrator
          text: And that is all I am going to tell you about the day Reddy Fox went fishing.
