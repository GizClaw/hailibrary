audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖亲切，带着轻快的讲故事感
        timbre: 清澈柔和
        pace: 舒展而富有变化
        pitch: 中音
    reddy_fox:
      display_name: 狐狸雷迪
      tts:
        delivery: 狡黠爱逞强，得意时带着坏笑
        timbre: 清脆偏细
        pace: 灵活轻快
        pitch: 中音
    johnny_chuck:
      display_name: 土拨鼠约翰尼
      tts:
        delivery: 乖巧谨慎，开口时直率清楚
        timbre: 明亮稚嫩的男童声
        pace: 平稳
        pitch: 中高音
    billy_mink:
      display_name: 水貂比利
      tts:
        delivery: 机灵自信，取笑人时透着顽皮
        timbre: 清亮有活力的男声
        pace: 轻快
        pitch: 中音
    mr_kingfisher:
      display_name: 翠鸟先生
      tts:
        delivery: 爽朗响亮，笑声干脆
        timbre: 清脆的成年男声
        pace: 明快
        pitch: 中高音
    old_mr_frog:
      display_name: 老青蛙先生
      tts:
        delivery: 慢悠悠又爱看热闹
        timbre: 粗哑浑厚的老年男声
        pace: 舒缓
        pitch: 低音
    mr_trout:
      display_name: 鳟鱼先生
      tts:
        delivery: 沉稳机警，笑起来响亮
        timbre: 清晰厚实的成年男声
        pace: 稳健
        pitch: 中低音
    mrs_trout:
      display_name: 鳟鱼太太
      tts:
        delivery: 温和机敏，笑声轻快
        timbre: 柔亮的成年女声
        pace: 从容
        pitch: 中音
    trout_baby_1:
      display_name: 鳟鱼宝宝一
      tts:
        delivery: 天真活泼，笑声清亮
        timbre: 轻盈的童声
        pace: 轻快
        pitch: 高音
    trout_baby_2:
      display_name: 鳟鱼宝宝二
      tts:
        delivery: 顽皮活泼，笑声跳跃
        timbre: 明亮的童声
        pace: 轻快
        pitch: 中高音
  chapters:
    - id: ch01
      title: 雷迪来邀约翰尼
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 一天早晨，太阳先生把天空照得亮堂堂的，天气暖和极了。绿草地上，狐狸雷迪沿着通往欢笑溪的孤独小径走来。蹦一下，跳两步，再蹦一下！这个阳光灿烂的早晨，他对自己满意极了。没走多远，他就看见土拨鼠约翰尼挺直身子，坐在自家小屋旁边。
        - id: ch01-b02
          speaker: reddy_fox
          text: 土拨鼠约翰尼，尼，尼！土拨鼠约翰尼，尼，尼！约翰尼土拨鼠！
          emotion: happy
        - id: ch01-b03
          speaker: narrator
          text: 雷迪扯着嗓子喊，约翰尼却装作没听见。妈妈早就叮嘱过他，不许跟雷迪一起玩，因为雷迪是个坏孩子。
        - id: ch01-b04
          speaker: reddy_fox
          text: 土拨鼠约翰尼，尼，尼！约翰尼土拨鼠！
          emotion: happy
        - id: ch01-b05
          speaker: narrator
          text: 这一次，约翰尼转头看了看。雷迪一会儿在小径上翻跟头，一会儿追着自己的尾巴打转，还从小径这头滚到那头，再滚回来。
        - id: ch01-b06
          speaker: reddy_fox
          text: 来吧，咱们去钓鱼！
        - id: ch01-b07
          speaker: johnny_chuck
          text: 不行，我不去。
        - id: ch01-b08
          speaker: narrator
          text: 妈妈不许约翰尼跟雷迪一起玩。雷迪又试着从自己的影子上跳过去。
        - id: ch01-b09
          speaker: reddy_fox
          text: 我可以教你怎么捉鱼呀。
        - id: ch01-b10
          speaker: johnny_chuck
          text: 不行。
        - id: ch01-b11
          speaker: narrator
          text: 乖巧的小约翰尼说完就转开了脸。他不再看雷迪追蝴蝶，也不看雷迪和田鼠家的孩子们玩捉人游戏。
    - id: ch02
      title: 大岩石上的教训
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 雷迪只好独自来到欢笑溪边。小溪一路笑，一路唱，朝大河奔去。天空湛蓝，阳光明亮。雷迪跳上溪水中央的大岩石，探头往另一边一瞧。你猜他看见了什么？下面那个可爱的小水潭里，鳟鱼先生、鳟鱼太太和所有鳟鱼宝宝都在呢。
        - id: ch02-b02
          speaker: narrator
          text: 雷迪想捉几条鳟鱼宝宝，带回家当晚餐，可他根本不知道该怎么捉。他趴在岩石上，把身子尽量往前探，又使劲把爪子伸进水潭。鳟鱼宝宝们全在笑话他，谁也不肯游到他够得着的地方。忽然，鳟鱼先生飞快地游过来。雷迪还没看见他靠近，一只黑色小爪子就被狠狠咬了一口。
        - id: ch02-b03
          speaker: reddy_fox
          text: 哎哟！
          emotion: surprised
        - id: ch02-b04
          speaker: narrator
          text: 雷迪大叫着抽回爪子，所有鳟鱼宝宝都哈哈大笑。就在这时，水貂比利来到了溪边。
        - id: ch02-b05
          speaker: billy_mink
          text: 你好啊，狐狸雷迪！你趴在这里做什么？
        - id: ch02-b06
          speaker: reddy_fox
          text: 我想捉一条鱼。
        - id: ch02-b07
          speaker: billy_mink
          text: 嗐，这有什么难的！看着，我捉给你瞧。
        - id: ch02-b08
          speaker: narrator
          text: 比利挨着雷迪趴在大岩石上，也探头望进水潭。鳟鱼宝宝们还在笑雷迪，在水里玩得别提多开心了。可是比利小心得很，真是小心极了。他只偷偷往水里瞧，绝不让鳟鱼先生和鳟鱼太太看见自己。
        - id: ch02-b09
          speaker: narrator
          text: 看见那么多鳟鱼宝宝在水潭里嬉戏，比利忍不住笑了。
        - id: ch02-b10
          speaker: billy_mink
          text: 雷迪，你来数一、二、三。我这就让你看看，鱼到底该怎么捉。
        - id: ch02-b11
          speaker: reddy_fox
          text: 一！二！三！
        - id: ch02-b12
          speaker: narrator
          text: 扑通！比利一头扎进水潭，水花溅得老高，把雷迪从头到脚浇了一身，也把正在睡早觉的老青蛙先生吓了一大跳。青蛙先生从睡莲叶上仰面一翻，同样扑通一声掉进水里。没过多久，比利从水潭另一边爬上岸，嘴里果然捉着一条鳟鱼宝宝。
        - id: ch02-b13
          speaker: reddy_fox
          text: 快给我！
        - id: ch02-b14
          speaker: billy_mink
          text: 要吃就自己捉。老水貂爷爷晚餐想吃鱼，我得把这条带回家。你才不敢下水呢，雷迪！胆小鬼！胆小鬼！
        - id: ch02-b15
          speaker: narrator
          text: 比利抖掉棕色小外套上的水，叼起鳟鱼宝宝，跑回家去了。
    - id: ch03
      title: 一个湿漉漉的梦
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 雷迪重新趴到大岩石上，往小水潭里张望，却连一条鳟鱼也看不到。鳟鱼宝宝全跟爸爸妈妈躲到了安全的地方。雷迪等啊，等啊。阳光暖洋洋的，欢笑溪唱着催眠曲。后来呢？他竟在大岩石边上沉沉睡着了。
        - id: ch03-b02
          speaker: narrator
          text: 过了一阵，雷迪做起梦来。他梦见自己也穿上了一件漂亮的棕色小外套，跟比利那件一模一样，水怎么也浸不透。他还梦见自己学会了游泳，也能像比利那样钻进水里捉鱼。可爱的小水潭里挤满了鳟鱼宝宝，他眼看就要伸爪抓住一条了。
        - id: ch03-b03
          speaker: narrator
          text: 扑通！雷迪从大岩石上滚下来，一头栽进了小水潭。
        - id: ch03-b04
          speaker: narrator
          text: 水灌进他的眼睛，又钻进他的鼻子。他还咽下那么多水，觉得自己这辈子再也不想喝一口水了。身上那件漂亮的红外套也彻底湿透了。狐狸妈妈明明叮嘱过他，一定要爱惜这件外套，因为整整一年里，他都不会再有新外套。
        - id: ch03-b05
          speaker: narrator
          text: 现在，雷迪的裤子湿了。那条让他无比得意、又漂亮又蓬松的大尾巴也吸饱了水，沉得再也翘不起来。他费了好大的劲才爬上岸，只能拖着尾巴往前走。
    - id: ch04
      title: 水潭边的笑声
      blocks:
        - id: ch04-b01
          speaker: mr_kingfisher
          text: 哈！哈！哈！
          emotion: happy
        - id: ch04-b02
          speaker: narrator
          text: 翠鸟先生坐在树上，放声大笑。
        - id: ch04-b03
          speaker: old_mr_frog
          text: 嚯！嚯！嚯！
          emotion: happy
        - id: ch04-b04
          speaker: narrator
          text: 老青蛙先生也笑起来。这时，他已经爬回睡莲叶上了。
        - id: ch04-b05
          speakers: [mr_trout, mrs_trout, trout_baby_1, trout_baby_2]
          ensemble: chorus
          text: 嘻！嘻！嘻！
          emotion: happy
        - id: ch04-b06
          speaker: narrator
          text: 鳟鱼先生、鳟鱼太太和所有鳟鱼宝宝，一边绕着可爱的小水潭游来游去，一边冲着雷迪笑个不停。
        - id: ch04-b07
          speaker: billy_mink
          text: 哈！哈！哈！嚯！嚯！嚯！嘻！嘻！嘻！
          emotion: happy
        - id: ch04-b08
          speaker: narrator
          text: 比利恰好回到大岩石旁，正赶上看见雷迪掉进水里，也跟着笑起来。
        - id: ch04-b09
          speaker: narrator
          text: 雷迪羞得一句话也说不出来。他悄悄爬上孤独小径，往家里走。湿漉漉、沾满泥巴的尾巴拖在身后，一路都在滴水。
    - id: ch05
      title: 回家的路
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 土拨鼠约翰尼还照着妈妈的吩咐，坐在自家门口。雷迪想趁他没看见，偷偷从旁边溜过去，可约翰尼那双明亮的小眼睛早已经发现了他。
        - id: ch05-b02
          speaker: johnny_chuck
          text: 狐狸雷迪，你捉到的鱼呢？
        - id: ch05-b03
          speaker: johnny_chuck
          text: 你怎么不翻跟头了？也不跳过自己的影子啦？要不要再追追蝴蝶，跟田鼠家的小家伙们玩一会儿呀？
        - id: ch05-b04
          speaker: narrator
          text: 雷迪一句也不回答，只顾越走越快。快到家时，他看见老狐狸妈妈坐在门口，膝上横着一根老大的细树条。原来，妈妈早就叮嘱过雷迪，不许靠近欢笑溪。
        - id: ch05-b05
          speaker: narrator
          text: 至于狐狸雷迪这趟钓鱼后来怎么样了，我就只讲到这里。
