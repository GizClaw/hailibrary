audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖亲切，带着轻快的讲故事感
        timbre: 清澈柔和
        pace: 舒展而富有变化
        pitch: 中音
    breeze_1:
      display_name: 小风一号
      tts:
        delivery: 活泼爽朗，充满好奇
        timbre: 清亮的童声
        pace: 轻快
        pitch: 中高音
    breeze_2:
      display_name: 小风二号
      tts:
        delivery: 机灵热心，语气干脆
        timbre: 轻盈的童声
        pace: 轻快
        pitch: 高音
    breeze_3:
      display_name: 小风三号
      tts:
        delivery: 顽皮热烈，带着跳跃感
        timbre: 明快的童声
        pace: 稍快
        pitch: 中高音
    breeze_4:
      display_name: 小风四号
      tts:
        delivery: 天真勇敢，说话利落
        timbre: 柔亮的童声
        pace: 轻快
        pitch: 高音
    johnny_chuck:
      display_name: 土拨鼠约翰尼
      tts:
        delivery: 天真贪玩，情绪来得快也去得快
        timbre: 圆润稚气的童声
        pace: 稍快而有弹性
        pitch: 中高音
    reddy_fox:
      display_name: 狐狸雷迪
      tts:
        delivery: 狡黠爱逞强，得意时带着坏笑
        timbre: 清脆偏细
        pace: 灵活轻快
        pitch: 中音
    peter_rabbit:
      display_name: 兔子彼得
      tts:
        delivery: 顽皮机灵，笑声爽朗
        timbre: 明亮清透的少年声
        pace: 轻快
        pitch: 中高音
  chapters:
    - id: ch01
      title: 越走越远的早餐
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 土拨鼠约翰尼和狐狸雷迪都住在绿草地边上，两家离得很近。约翰尼胖墩墩、圆滚滚，雷迪却瘦长瘦长的，披着一身鲜红的毛。雷迪总爱突然从树后蹿出来，装作要一口吃掉约翰尼，把他吓一大跳。
        - id: ch01-b02
          speaker: narrator
          text: 一个晴朗的夏日，约翰尼出门去找鲜嫩的苜蓿，想吃一顿好早饭。妈妈明明嘱咐过，绝不能走到看不见家门的地方，他却一路走出了长草丛里的小屋，越走越远。他就像有些小男孩一样，早把妈妈的话忘光了。
        - id: ch01-b03
          speaker: narrator
          text: 约翰尼走啊，走啊，一直往前走。每过一会儿，他就看见远处有一片地方，很像新鲜的苜蓿。可每一次赶到跟前，他都会发现自己看错了。于是，他又走啊，走啊，一直往前走。西风妈妈穿过绿草地，看见了他，问他要去哪里。约翰尼假装没听见，反而走得更快。
        - id: ch01-b04
          speaker: narrator
          text: 一阵欢乐小风跳着舞跑到他前面。
        - id: ch01-b05
          speaker: breeze_1
          text: 土拨鼠约翰尼，当心呀！再这样走下去，你会迷路的！
        - id: ch01-b06
          speaker: narrator
          text: 小风说完，揪了揪约翰尼的胡须，转眼就跑远了。圆滚滚、红彤彤的太阳先生越爬越高。约翰尼每次抬头，太阳先生都朝他眨眨眼。
        - id: ch01-b07
          speaker: johnny_chuck
          text: 我还能看见圆滚滚、红彤彤的太阳先生，他也还在朝我眨眼。这样我就不可能迷路。
        - id: ch01-b08
          speaker: narrator
          text: 约翰尼又小跑着找起苜蓿。过了好一阵，他终于找到了，而且那是整片绿草地上最香甜的苜蓿。他吃啊，吃啊，吃了又吃。接着，你猜他做了什么？他竟往香甜的苜蓿里一蜷，很快就睡熟了。
    - id: ch02
      title: 醒来以后迷路了
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 圆滚滚、红彤彤的太阳先生继续往上爬，越爬越高。过了些时候，他又慢慢往天空的另一边落下。长长的影子开始悄悄爬过绿草地，约翰尼却什么也不知道，还是睡得正香。
        - id: ch02-b02
          speaker: narrator
          text: 后来，一阵欢乐小风发现了他。约翰尼蜷成一个滑稽的圆球，躺在苜蓿里。
        - id: ch02-b03
          speaker: breeze_2
          text: 土拨鼠约翰尼，醒一醒！快醒来呀！
        - id: ch02-b04
          speaker: narrator
          text: 约翰尼睁开眼，坐起来揉了揉。刚醒来的短短一会儿，他根本想不起自己在哪儿。过了一阵，他把身子挺得直直的，越过草尖四下一望，才发现自己离家太远了，眼前连一样熟悉的东西也没有。这里的树不一样，灌木不一样，什么都不一样。土拨鼠约翰尼真的迷路了。
        - id: ch02-b05
          speaker: narrator
          text: 约翰尼的脑袋刚冒出草丛，正在眺望绿草地的狐狸雷迪就看见了。
        - id: ch02-b06
          speaker: reddy_fox
          text: 哈，我这就去狠狠吓他一回！我要叫他后悔今天把鼻子伸出了家门！
        - id: ch02-b07
          speaker: narrator
          text: 雷迪立刻伏下身，躲进长草。他顺着熟悉的小路，轻轻地，轻得不能再轻地往前溜，一直摸到了约翰尼背后。约翰尼只顾着找回家的路，压根没有注意四周。
    - id: ch03
      title: 雷迪反被追赶
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 雷迪偷偷凑上去，狠狠揪了一下约翰尼那条短尾巴。约翰尼吓得笔直蹦上半空。等他落回地面，已经成了绿草地上脾气最大的小土拨鼠。
        - id: ch03-b02
          speaker: narrator
          text: 雷迪本以为约翰尼会逃跑。他打算追在后面，一路揪着约翰尼的尾巴，把他戏弄到家。谁知这一次，轮到雷迪吃惊了。他吃的这一惊，一点儿也不比刚才尾巴被揪的约翰尼小。约翰尼连想都没想，根本没管雷迪有自己的两倍大。他两眼冒火，嘴里发出只有小土拨鼠才会发出的咯咯声。全身短毛根根竖起，让他看上去也足足大了一倍。就这样，他直冲雷迪而去。
        - id: ch03-b03
          speaker: narrator
          text: 雷迪惊得没了主意，只会拔腿逃跑。约翰尼在后面紧追，每隔一会儿就在他的脚后跟上咬一口。
        - id: ch03-b04
          speaker: narrator
          text: 兔子彼得恰巧就在附近。他直挺挺地坐着，正想找点淘气事做，忽然看见雷迪跑得飞快。
        - id: ch03-b05
          speaker: peter_rabbit
          text: 一定是猎犬鲍泽在追雷迪。我得小心一点儿，可别让鲍泽发现我。
        - id: ch03-b06
          speaker: narrator
          text: 这时，彼得才看见后面的土拨鼠约翰尼。约翰尼浑身的毛都竖着，两条小短腿迈得飞快，一直追着雷迪。
        - id: ch03-b07
          speaker: peter_rabbit
          text: 哈！哈！哈！狐狸雷迪居然怕土拨鼠约翰尼！哈！哈！哈！
          emotion: happy
        - id: ch03-b08
          speaker: narrator
          text: 彼得一溜烟跑去找臭鼬吉米、浣熊博比和松鼠快乐杰克。他要把狐狸雷迪被土拨鼠约翰尼追得逃跑的事，从头到尾讲给大家听。要知道，他们几个平时都有一点儿怕雷迪。
    - id: ch04
      title: 胆小鬼跑过家门
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 雷迪一路直奔家门，跑得能有多快就有多快，回家的路上正好经过约翰尼的家。约翰尼的小短腿当然跑不过他。这时，约翰尼已经累得呼哧呼哧直喘，活像一只胖乎乎的小土拨鼠拼命奔跑时才会有的样子。
        - id: ch04-b02
          speaker: narrator
          text: 不过，约翰尼早就不生气了。他一想到自己居然把狐狸雷迪吓跑，就觉得这是天下最好笑的事。来到自家门口，他停下来，又用后腿坐直，扯起尖嗓子朝雷迪喊。
        - id: ch04-b03
          speaker: johnny_chuck
          text: 狐狸雷迪是胆小鬼，胆小鬼！狐狸雷迪就是个胆小鬼！
          emotion: happy
        - id: ch04-b04
          speaker: narrator
          text: 西风妈妈的欢乐小风们正在绿草地上玩。听见约翰尼这样喊，它们也一起叫了起来。
        - id: ch04-b05
          speakers: [breeze_1, breeze_2, breeze_3, breeze_4]
          ensemble: chorus
          text: 狐狸雷迪是胆小鬼，胆小鬼！
        - id: ch04-b06
          speaker: narrator
          text: 狐狸雷迪就是这样大吃了一惊，土拨鼠约翰尼也这样找到了回家的路。
