  chapters:
    - id: ch01
      title: "CHAPTER III. HOW REDDY FOX WAS SURPRISED"
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Johnny Chuck and Reddy Fox lived close to each other at the edge of the Green Meadows. Johnny was fat and roly-poly. Reddy was slim, with a bright red coat. Reddy liked to spring out from behind a tree and frighten Johnny by pretending he meant to gobble him up.
        - id: ch01-b02
          speaker: narrator
          text: One bright summer day, Johnny went looking for tender clover to eat for breakfast. He wandered a long way from his snug little house in the tall meadow grass. His mother had warned him never to go where he could not see his own door. But Johnny was like some little boys you may know. He forgot every word she had told him.
        - id: ch01-b03
          speaker: narrator
          text: He walked and walked and walked. Every few minutes, he spotted what looked like a lovely patch of fresh clover farther ahead. Each time he reached the place, there was no clover after all. He had made another mistake. Then off he went again, walking and walking and walking.
        - id: ch01-b04
          speaker: narrator
          text: Old Mother West Wind came across the Green Meadows and saw him. She asked where he was going. Johnny only pretended he had not heard her, and he hurried on even faster.
        - id: ch01-b05
          speaker: narrator
          text: One Merry Little Breeze danced ahead of him and called back a warning.
        - id: ch01-b06
          speaker: breeze_1
          text: Watch out, Johnny Chuck! You'll get lost!
        - id: ch01-b07
          speaker: narrator
          text: Then the Breeze tugged Johnny's whiskers and ran away.
        - id: ch01-b08
          speaker: narrator
          text: Round, red Mr. Sun climbed higher and higher. Whenever Johnny looked up, Mr. Sun seemed to wink at him.
        - id: ch01-b09
          speaker: johnny_chuck
          text: If I can still see great round, red Mr. Sun winking at me, I can't be lost.
        - id: ch01-b10
          speaker: narrator
          text: So Johnny trotted on in search of clover.
        - id: ch01-b11
          speaker: narrator
          text: At last, he truly found some. It was the sweetest clover anywhere in the Green Meadows. Johnny ate and ate and ate. And what do you think he did next? He curled up right there in the soft, sweet clover and fell fast asleep.
        - id: ch01-b12
          speaker: narrator
          text: Mr. Sun climbed to the top of the sky. After a while, he started down the other side, and long shadows crept over the Green Meadows. Johnny knew nothing about them. He was still sound asleep.
        - id: ch01-b13
          speaker: narrator
          text: Before long, one of the Merry Little Breezes found Johnny curled into a funny round ball.
        - id: ch01-b14
          speaker: breeze_1
          text: Wake up, Johnny Chuck! Wake up!
        - id: ch01-b15
          speaker: narrator
          text: Johnny opened his eyes. He sat up and rubbed them. For a few moments, he could not remember where he was.
        - id: ch01-b16
          speaker: narrator
          text: Then he sat very straight and peered over the grass to find out where he was. He was so far from home that not one thing looked familiar. The trees were different. The bushes were different. Everything was different. Johnny Chuck was lost.
        - id: ch01-b17
          speaker: narrator
          text: Just as Johnny's head popped above the grass, Reddy Fox happened to be looking across the Green Meadows and saw him.
        - id: ch01-b18
          speaker: reddy_fox
          text: Aha! I'll give Johnny Chuck such a scare that he'll wish he'd never poked his nose outside his house.
        - id: ch01-b19
          speaker: narrator
          text: Reddy dropped behind the long grass. Softly, ever so softly, he crept along his own little paths until he was right behind Johnny. Johnny was looking so hard for home that he noticed nothing else.
        - id: ch01-b20
          speaker: narrator
          text: Reddy slipped up close and gave Johnny's short little tail a hard pull. Johnny was terribly frightened. He leaped straight into the air. But when he landed, he was the angriest little woodchuck in all the Green Meadows.
        - id: ch01-b21
          speaker: narrator
          text: Reddy had expected Johnny to run away. He planned to chase him, tug his tail, and tease him all the way home. Instead, Reddy got a surprise just as great as the one he had given Johnny.
        - id: ch01-b22
          speaker: narrator
          text: Johnny never stopped to think that Reddy was twice his size. His eyes snapped. He chattered the way only a little Chuck can chatter. Every little hair on his body stood straight up, making him look twice as big as he really was. Without stopping for even a moment, Johnny charged at Reddy Fox.
        - id: ch01-b23
          speaker: narrator
          text: Reddy was so startled that he had no idea what to do. He simply ran. Johnny raced after him and nipped at Reddy's heels every minute or two.
        - id: ch01-b24
          speaker: narrator
          text: Peter Rabbit happened to be nearby. He was sitting very straight and watching for some mischief to get into when he saw Reddy Fox running as hard as he could.
        - id: ch01-b25
          speaker: peter_rabbit
          text: Bowser the Hound must be chasing Reddy Fox. I'd better be careful so Bowser doesn't find me.
        - id: ch01-b26
          speaker: narrator
          text: Then Peter spotted Johnny Chuck close behind. Every little hair on Johnny stood on end, and his short legs were going as fast as they could.
        - id: ch01-b27
          speaker: peter_rabbit
          text: Ho, ho, ho! Reddy Fox is afraid of Johnny Chuck! Ho, ho, ho!
          emotion: happy
        - id: ch01-b28
          speaker: narrator
          text: Peter scampered off to find Jimmy Skunk, Bobby Coon, and Happy Jack Squirrel. He wanted to tell every one of them how Reddy Fox had run away from Johnny Chuck. You see, they were all a little afraid of Reddy Fox themselves.
        - id: ch01-b29
          speaker: narrator
          text: Reddy ran straight home as fast as he could. On the way, he passed Johnny Chuck's house.
        - id: ch01-b30
          speaker: narrator
          text: Johnny could not run nearly as fast as Reddy. He puffed and blew the way a fat little woodchuck does when he has to run hard. By then, his anger was gone. He thought it was the best joke in the world that he had actually frightened Reddy Fox.
        - id: ch01-b31
          speaker: narrator
          text: When Johnny reached his own house, he stopped and sat up on his hind legs. Then he called after Reddy Fox in a high, shrill voice.
        - id: ch01-b32
          speaker: johnny_chuck
          text: Reddy Fox is a scaredy-cat, scaredy-cat! Reddy Fox is a scaredy-cat!
          emotion: happy
        - id: ch01-b33
          speaker: narrator
          text: All the Merry Little Breezes of Old Mother West Wind were playing over the Green Meadows. They joined in too.
        - id: ch01-b34
          speakers: [breeze_1, breeze_2, breeze_3]
          ensemble: chorus
          text: Reddy Fox is a scaredy-cat, scaredy-cat!
          emotion: happy
        - id: ch01-b35
          speaker: narrator
          text: And that is how Reddy Fox was surprised, and how Johnny Chuck found his way home.
