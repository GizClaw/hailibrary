  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm and lively storytelling
        timbre: clear and gentle
        pace: measured
        pitch: medium
    mrs_trout:
      display_name: Mrs. Trout
      tts:
        delivery: caring and watchful
        timbre: warm and mature
        pace: medium
        pitch: medium
    tommy_trout:
      display_name: Tommy Trout
      tts:
        delivery: curious and willful
        timbre: bright and youthful
        pace: medium-quick
