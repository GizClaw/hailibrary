  chapters:
    - id: ch01
      title: Tommy Trout Would Not Mind
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: The Laughing Brook rippled and sang all day long. Mr. Trout and Mrs. Trout lived there with a great many little Trouts. There were so many children that their parents stayed busy from morning till night. They found breakfast, dinner, and supper for them, watched over them, and taught them how to swim.
        - id: ch01-b02
          speaker: narrator
          text: The little Trouts learned to catch foolish flies that fell on the water. They learned to keep away from big hungry fish, sharp-eyed Mr. Kingfisher, and the men and boys who came fishing with hooks and lines.
        - id: ch01-b03
          speaker: narrator
          text: Nearly every little Trout was very good and did just what Mrs. Trout said. But Tommy Trout never obeyed right away. Whenever she spoke to him, he always waited a little first.
        - id: ch01-b04
          speaker: narrator
          text: Tommy did not mean to be bad. Oh, no! He simply wanted his own way. But because he chose his own way instead of minding Mrs. Trout, there is no Tommy Trout now. Not even one little blue spot from his beautiful coat remains. It happened for one reason. Tommy Trout would not mind.
    - id: ch02
      title: Beyond the Big Rock
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: One day, round red Mr. Sun shone overhead while the Laughing Brook sang on its way to the Big River. Mrs. Trout was about to look for some nice plump flies for dinner. All the little Trouts were playing in their own pool, safely tucked behind the Big Rock.
        - id: ch02-b02
          speaker: narrator
          text: Before she left, Mrs. Trout gathered her children around her. She told them they must stay inside the pool until she came back.
        - id: ch02-b03
          speaker: mrs_trout
          text: Something dreadful could happen if you leave this pool.
        - id: ch02-b04
          speaker: narrator
          text: Every little Trout except Tommy promised to stay right there. Soon they were jumping, chasing one another, and playing as happily as could be. Tommy was the only one who did not join them.
        - id: ch02-b05
          speaker: narrator
          text: The moment Mrs. Trout was gone, Tommy swam off alone to the edge of the pool.
        - id: ch02-b06
          speaker: tommy_trout
          text: I wonder what's on the far side of the Big Rock. The sun is shining, and the brook is laughing. Nothing can happen if I only swim the tiniest bit farther.
        - id: ch02-b07
          speaker: narrator
          text: When no one was watching, Tommy slipped out of the safe little pool where the others were playing. He swam just a little speck of a way farther. Now he could almost see around the Big Rock. Then he swam just a little speck of a way farther still.
    - id: ch03
      title: Mr. Pickerel's Great Big Mouth
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: Oh, dear! Tommy found himself staring straight into the mouth of a great big fish named Mr. Pickerel. Mr. Pickerel was very fond of little Trouts. He would gladly have eaten one for breakfast every day.
        - id: ch03-b02
          speaker: mr_pickerel
          text: Ah-ha!
        - id: ch03-b03
          speaker: narrator
          text: Mr. Pickerel opened his enormous mouth as wide as it would go. Tommy turned and tried to hurry back to the dear, safe pool where all the other little Trouts were still playing happily. But he was too late.
        - id: ch03-b04
          speaker: narrator
          text: Tommy went straight into that great big mouth, and Mr. Pickerel swallowed him whole.
        - id: ch03-b05
          speaker: mr_pickerel
          text: Ah-ha. Little Trouts are just what I like.
        - id: ch03-b06
          speaker: narrator
          text: Nothing more was ever heard of Tommy Trout, who would not mind.
