audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖亲切，带着轻快的讲故事感
        timbre: 清澈柔和
        pace: 舒展而富有变化
        pitch: 中音
    mrs_trout:
      display_name: 鳟鱼太太
      tts:
        delivery: 慈爱细心，叮嘱孩子时认真恳切
        timbre: 温柔清亮的成年女声
        pace: 平稳
        pitch: 中音
    tommy_trout:
      display_name: 小鳟鱼汤米
      tts:
        delivery: 好奇任性，总觉得自己不会碰上麻烦
        timbre: 稚嫩明亮的男童声
        pace: 稍快
        pitch: 中高音
    mr_pickerel:
      display_name: 梭鱼先生
      tts:
        delivery: 贪吃得意，开口短促而有压迫感
        timbre: 低沉粗厚的成年男声
        pace: 缓慢
        pitch: 低音
  chapters:
    - id: ch01
      title: 欢乐小溪里的鳟鱼一家
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 欢乐小溪整天一路欢唱，水面闪着粼粼波光。鳟鱼先生和鳟鱼太太带着一大群小鳟鱼，就住在溪水里。
        - id: ch01-b02
          speaker: narrator
          text: 孩子实在太多，鳟鱼先生和鳟鱼太太从早忙到晚。他们要准备三顿饭，要看好孩子们，还得教他们游泳，教他们捉落在水面上的傻飞虫。
        - id: ch01-b03
          speaker: narrator
          text: 他们还要让孩子们记牢，千万躲开饥饿的大鱼、眼睛锐利的翠鸟先生，以及那些拿着钓钩和钓线来捕鱼的大人和小男孩。
        - id: ch01-b04
          speaker: narrator
          text: 小鳟鱼们全都非常听话。鳟鱼太太说什么，他们马上就做。只有汤米不一样。唉，这孩子每次听见吩咐，总要先磨蹭一会儿，就是不能立刻照办。
        - id: ch01-b05
          speaker: narrator
          text: 汤米并不想做坏孩子，他只是凡事都想依着自己的性子来。可正因为他任性，不肯听鳟鱼太太的话，如今世上再也没有小鳟鱼汤米了。
        - id: ch01-b06
          speaker: narrator
          text: 真的，就连他那件漂亮小外衣上的一个蓝色斑点，也没有留下。为什么呢？唉，就因为汤米不听话。
    - id: ch02
      title: 只游出去一丁点儿
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 一天，圆圆的太阳先生红彤彤地照着，欢乐小溪唱着歌，向大河奔去。鳟鱼太太要出门给孩子们捉几只肥美的小飞虫，当作午饭。
        - id: ch02-b02
          speaker: narrator
          text: 小鳟鱼们都在心爱的小水潭里玩耍。前面有大岩石护着，这里十分安全。临走前，鳟鱼太太把孩子们全叫到身边。
        - id: ch02-b03
          speaker: mrs_trout
          text: 我回来以前，谁也不许离开这个小水潭。外面说不定会有可怕的事情落到你们头上。
        - id: ch02-b04
          speaker: narrator
          text: 除了汤米，所有小鳟鱼都答应，一定会乖乖留在水潭里。接着，他们又跳又追，玩得快活极了。只有汤米没有加入。
        - id: ch02-b05
          speaker: narrator
          text: 鳟鱼太太才刚走，汤米便独自游到了水潭边。他望着大岩石，心里越来越好奇。
        - id: ch02-b06
          speaker: tommy_trout
          text: 大岩石那边到底有什么呢？太阳这么好，溪水又笑得这么欢。我只游出去一丁点儿，怎么可能出事？
        - id: ch02-b07
          speaker: narrator
          text: 趁谁也没注意，汤米悄悄溜出了安全的小水潭，把正在玩耍的伙伴们留在后面。他往前游了一丁点儿，又往前游了一丁点儿，已经快看见大岩石的另一边了。
        - id: ch02-b08
          speaker: narrator
          text: 汤米又向前游了一丁点儿。哎呀，糟了！他一抬眼，正对上一张大得吓人的嘴。那是梭鱼先生。梭鱼先生最爱吃小鳟鱼，巴不得每天早饭都能吃上一条。
    - id: ch03
      title: 梭鱼先生的大嘴
      blocks:
        - id: ch03-b01
          speaker: mr_pickerel
          text: 啊哈！
          emotion: happy
        - id: ch03-b02
          speaker: narrator
          text: 梭鱼先生说着，把那张大嘴张得不能再大。
        - id: ch03-b03
          speaker: narrator
          text: 汤米慌忙转身，想逃回那个亲切又安全的小水潭，回到正在快快乐乐玩耍的伙伴们身边。可是，已经太迟了。
        - id: ch03-b04
          speaker: narrator
          text: 汤米没有游回水潭，反倒一头进了梭鱼先生的大嘴。梭鱼先生把他整个儿吞了下去。
        - id: ch03-b05
          speaker: mr_pickerel
          text: 啊哈，我就爱吃小鳟鱼。
          emotion: happy
        - id: ch03-b06
          speaker: narrator
          text: 从那以后，再也没有谁听到过那个不听话的小鳟鱼汤米的消息。
