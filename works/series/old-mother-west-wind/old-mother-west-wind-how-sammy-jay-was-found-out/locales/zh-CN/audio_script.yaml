audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖亲切，带着轻快的讲故事感
        timbre: 清澈柔和
        pace: 舒展而富有变化
        pitch: 中音
    sammy_jay:
      display_name: 松鸦萨米
      tts:
        delivery: 眼尖嘴快，喊话时响亮利落
        timbre: 尖亮的年轻男声
        pace: 偏快
        pitch: 高音
    old_mother_west_wind:
      display_name: 西风妈妈
      tts:
        delivery: 温和坦率，语气开阔明朗
        timbre: 柔润成熟的女声
        pace: 从容
        pitch: 中音
    breeze_1:
      display_name: 小风一号
      tts:
        delivery: 活泼爽朗，充满好奇
        timbre: 清亮的童声
        pace: 轻快
        pitch: 中高音
    happy_jack_squirrel:
      display_name: 松鼠快乐杰克
      tts:
        delivery: 快活顽皮，笑起来爽朗响亮
        timbre: 清脆明亮的少年声
        pace: 轻快
        pitch: 中高音
    blacky_crow:
      display_name: 乌鸦布莱基
      tts:
        delivery: 爽直沉稳，说话简短清楚
        timbre: 略带沙哑的年轻男声
        pace: 平稳
        pitch: 中低音
    johnny_chuck:
      display_name: 土拨鼠约翰尼
      tts:
        delivery: 天真贪玩，情绪来得快也去得快
        timbre: 圆润稚气的童声
        pace: 稍快而有弹性
        pitch: 中高音
    billy_mink:
      display_name: 水貂比利
      tts:
        delivery: 机敏直爽，说话响亮
        timbre: 清亮的少年声
        pace: 轻快
        pitch: 中音
  chapters:
    - id: ch01
      title: 萨米在忙什么
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 松鸦萨米忙得不得了。可只要有人从附近经过，他立刻装成无所事事的样子。萨米总觉得自己是位很有派头的绅士。他那件蓝外套镶着白边，头上还戴着高高的帽子，样样都让他得意。
        - id: ch01-b02
          speaker: narrator
          text: 平日里，萨米是个游手好闲的家伙。他坐在篱笆桩上，看见土拨鼠约翰尼给绿草地上的小屋开新门，就取笑约翰尼。看见花栗鼠条纹贮藏过冬的玉米和坚果，他也要取笑一番。可萨米一旦忙起来，十有八九是在做不该做的事。闲懒的人呀，几乎总会惹出麻烦。
        - id: ch01-b03
          speaker: narrator
          text: 这一次，萨米果然正在干坏事。所以，只要觉得有人在看，他就假装自己什么也没做。
        - id: ch01-b04
          speaker: narrator
          text: 那天一早，西风妈妈离开紫山后面的家，下山来了。她穿过绿草地，要去帮大船渡过海洋。那时，快乐、圆滚滚、红彤彤的太阳先生才刚刚起床。西风妈妈的眼睛很尖，萨米还没发现她，她倒先看见了萨米。
        - id: ch01-b05
          speaker: narrator
          text: 西风妈妈觉得奇怪。萨米究竟在忙什么？他怎么一点儿声音也没有？这家伙准在打坏主意。
        - id: ch01-b06
          speaker: narrator
          text: 西风妈妈打开大口袋，把欢乐小风全放到绿草地上玩耍，又派出一阵小风，叫他去看看萨米在老栗树上做什么。小风越过树梢，一路跳着舞，就像满心只想着唤醒那些小叶子，带它们一块儿跳起来。
        - id: ch01-b07
          speaker: narrator
          text: 萨米只顾看着西风妈妈和其他欢乐小风，完全没发现这一阵小风。没多久，小风便跳着舞回来了。他凑到西风妈妈耳边，悄悄告诉她自己看见的事。
        - id: ch01-b08
          speaker: breeze_1
          text: 松鸦萨米在偷松鼠快乐杰克的坚果！快乐杰克把坚果藏在老栗树的树洞里，萨米却一颗颗搬走，藏进大松树上的破鸟巢，想留给自己。那只巢还是乌鸦布莱基去年筑的呢。
        - id: ch01-b09
          speaker: old_mother_west_wind
          text: 啊哈，原来是这么回事！
        - id: ch01-b10
          speaker: narrator
          text: 西风妈妈继续穿过绿草地。经过一根篱笆桩时，萨米正装模作样地坐在上面。
        - id: ch01-b11
          speaker: sammy_jay
          text: 早安，西风妈妈。
        - id: ch01-b12
          speaker: old_mother_west_wind
          text: 早安，松鸦萨米。这么一大早，你出来做什么？
        - id: ch01-b13
          speaker: sammy_jay
          text: 我是为了身体健康才出来的。医生嘱咐我，每天太阳升起时都要洗一次露水澡。
        - id: ch01-b14
          speaker: narrator
          text: 西风妈妈没有回答，只管赶路，去吹送海上的船只。等她走远，萨米赶紧把快乐杰克剩下的最后几颗坚果也搬进了大松树上的旧鸟巢。
    - id: ch02
      title: 快乐杰克丢了坚果
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 可怜的快乐杰克还不知道出了什么事。他又带着一颗坚果，一蹦一跳地来到老栗树下，想把它收进树洞。可他探头一看，那一大堆辛苦存下的坚果竟然全不见了。他简直不敢相信自己的眼睛。
        - id: ch02-b02
          speaker: narrator
          text: 快乐杰克伸进一只爪子，把树洞里里外外摸了个遍，一颗坚果也没摸到。他干脆爬进去找，可树洞果然空空如也。
        - id: ch02-b03
          speaker: narrator
          text: 快乐杰克再爬出来时，眼里已经含着泪。他朝四周望了又望，看不见别人，只有英俊的松鸦萨米待在附近，忙着梳理那件漂亮的蓝外套。
        - id: ch02-b04
          speaker: happy_jack_squirrel
          text: 早安，松鸦萨米。你看见谁从这里经过了吗？有人把我藏在老栗树树洞里的坚果全偷走了。
          emotion: sad
        - id: ch02-b05
          speaker: narrator
          text: 萨米装得难过极了。那时候，他的嗓音甜得很。他拿出自己最甜美的声音，要陪快乐杰克一起去抓那个偷坚果的贼。
        - id: ch02-b06
          speaker: sammy_jay
          text: 这实在太糟了。走吧，快乐杰克，我来帮你把那个贼找出来。
        - id: ch02-b07
          speaker: narrator
          text: 他们一同穿过绿草地，见到谁就问谁，有没有看见偷走那一树洞坚果的贼。欢乐小风也全来帮忙。很快，绿草地和树林里的每一个居民都听说了这件事。大家都喜欢快乐杰克，个个都替他难过。
        - id: ch02-b08
          speaker: narrator
          text: 第二天一大早，西风妈妈把欢乐小风全放出大口袋。这一天，有许多口信要请它们去送。小风们跑遍绿草地和树林，又沿着欢笑溪上上下下，绕过微笑池，把大家全请到山上的大松树下。九点钟，所有人要在那里组成调查会，查清是谁偷了快乐杰克的坚果。
    - id: ch03
      title: 大松树下的调查会
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 因为人人都喜欢快乐杰克，所以大家全来了。狐狸雷迪、浣熊博比、臭鼬吉米，还有快乐杰克的表亲花栗鼠条纹，都赶到了大松树下。水貂比利、小水獭乔、麝鼠杰里也来了。猫头鹰胡蒂困得几乎睁不开眼睛，却还是没有缺席。
        - id: ch03-b02
          speaker: narrator
          text: 乌鸦布莱基、土拨鼠约翰尼、兔子彼得也到了，就连年迈的青蛙爷爷都来了。当然，松鸦萨米也在场，还把自己打扮得英俊极了。
        - id: ch03-b03
          speaker: narrator
          text: 等大家全聚齐，西风妈妈抬起手，指向高高树顶上的旧鸟巢。
        - id: ch03-b04
          speaker: old_mother_west_wind
          text: 乌鸦布莱基，那是你的窝吗？
        - id: ch03-b05
          speaker: blacky_crow
          text: 从前是我的，不过我已经把它送给表弟松鸦萨米了。
        - id: ch03-b06
          speaker: old_mother_west_wind
          text: 松鸦萨米，那就是你的窝了？我能从里面拿一根树枝吗？
        - id: ch03-b07
          speaker: narrator
          text: 萨米行了一个最有礼貌的鞠躬礼。
        - id: ch03-b08
          speaker: sammy_jay
          text: 是我的。您当然可以拿一根。
        - id: ch03-b09
          speaker: narrator
          text: 萨米心里盘算，西风妈妈只会从鸟巢最上面拿走一根，那根本不要紧。
        - id: ch03-b10
          speaker: narrator
          text: 谁知，西风妈妈忽然鼓起双颊，使劲吹了一口气。呼的一下，一根粗树枝从旧鸟巢底下飞了出来，一路撞着大松树的枝杈，咚咚碰碰地往下掉。
        - id: ch03-b11
          speaker: narrator
          text: 等树枝落到地上，你猜又掉下了什么？山核桃、栗子、橡子、榛子，稀里哗啦地撒了下来。好大一堆呀！
        - id: ch03-b12
          speaker: happy_jack_squirrel
          text: 咦！咦——！我丢的坚果全在这里！
          emotion: surprised
    - id: ch04
      title: 萨米露了馅
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 大家一齐转头去看松鸦萨米。可萨米早已拼命拍着翅膀，以最快的速度逃进树林。西风妈妈朝他的背影大喊起来。
        - id: ch04-b02
          speaker: old_mother_west_wind
          text: 抓住小偷！
          emotion: angry
        - id: ch04-b03
          speakers: [breeze_1, johnny_chuck, billy_mink, happy_jack_squirrel]
          ensemble: chorus
          text: 抓住小偷！
          emotion: angry
        - id: ch04-b04
          speaker: narrator
          text: 欢乐小风、土拨鼠约翰尼、水貂比利和其他伙伴全跟着喊，可松鸦萨米根本没有停下。
        - id: ch04-b05
          speaker: narrator
          text: 大家开始捡起从旧鸟巢里落下来的坚果。萨米刚才正是把偷来的坚果藏在那里。过了一会儿，快乐杰克走在最前面，伙伴们排着队跟在后头，一起回到了老栗树下。
        - id: ch04-b06
          speaker: narrator
          text: 到了树下，快乐杰克把失而复得的坚果一颗颗收好，又放进了自己温暖舒适的小树洞。
        - id: ch04-b07
          speaker: narrator
          text: 从那一天起，每当松鸦萨米想要鸣叫，嘴里发出的都只有尖厉的喊声。
        - id: ch04-b08
          speaker: sammy_jay
          text: 小偷！小偷！小偷！
