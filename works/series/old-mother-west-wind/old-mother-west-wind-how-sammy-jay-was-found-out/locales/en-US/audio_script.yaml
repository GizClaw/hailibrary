  chapters:
    - id: ch01
      title: Sammy Jay Is Very Busy
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Sammy Jay was very busy indeed. Yet whenever anyone came near, he acted as though he had been doing nothing at all. Sammy thought himself a fine gentleman. He was proud of his handsome blue coat with its white trimmings, and proud of his high cap too.
        - id: ch01-b02
          speaker: narrator
          text: Most days, Sammy was idle. He would perch on a fence post and laugh at Johnny Chuck for working hard to dig a new door to his snug home in the Green Meadows. He laughed at Striped Chipmunk too, just because Striped Chipmunk was storing heap after heap of corn and nuts for winter. Sammy did not care for such useful work. And when an idle fellow like Sammy did get busy, he was usually doing something he ought not to do. Idle people have a way of getting into mischief.
        - id: ch01-b03
          speaker: narrator
          text: That was exactly what Sammy was doing now. That was why he tried to look innocent whenever he thought someone might be watching.
        - id: ch01-b04
          speaker: narrator
          text: Old Mother West Wind came down from her home behind the Purple Hills very early that morning. Jolly, round, red Mr. Sun was hardly out of bed when she crossed the Green Meadows. She had a long journey ahead, for she was on her way to help the great ships across the ocean. Old Mother West Wind had sharp eyes. She spotted Sammy Jay before he spotted her.
        - id: ch01-b05
          speaker: old_mother_west_wind
          text: What is keeping Sammy Jay so busy? And why is he being so very quiet? He must be getting into mischief.
        - id: ch01-b06
          speaker: narrator
          text: Old Mother West Wind opened her big bag and let all the Merry Little Breezes out to play. Then she sent one Breeze to find out what Sammy was doing in the old chestnut tree.
        - id: ch01-b07
          speaker: narrator
          text: The little Breeze danced over the treetops as if he cared about nothing but waking the leaves and making them dance too. Sammy kept his eyes on Old Mother West Wind and the other Breezes, so he never noticed this one.
        - id: ch01-b08
          speaker: narrator
          text: Before long, the Breeze danced back and whispered in Old Mother West Wind's ear.
        - id: ch01-b09
          speaker: breeze_1
          text: Sammy Jay is stealing the nuts Happy Jack hid in the hollow of the old chestnut tree. He is hiding them for himself in that broken-down nest Blacky the Crow built last year, up in the Great Pine.
        - id: ch01-b10
          speaker: old_mother_west_wind
          text: Aha! Now I know what Sammy is doing.
        - id: ch01-b11
          speaker: narrator
          text: Then Old Mother West Wind continued across the Green Meadows.
        - id: ch01-b12
          speaker: sammy_jay
          text: Good morning, Old Mother West Wind.
        - id: ch01-b13
          speaker: old_mother_west_wind
          text: Good morning, Sammy Jay. Why are you out so early?
        - id: ch01-b14
          speaker: sammy_jay
          text: I am out for my health. The doctor told me to bathe in the dew at sunrise every morning.
        - id: ch01-b15
          speaker: narrator
          text: Old Mother West Wind said nothing. She went on across the meadows to blow the ships over the ocean. As soon as she had passed, Sammy hurried away with the last of Happy Jack's nuts and hid them in the old nest in the Great Pine.
    - id: ch02
      title: Happy Jack's Nuts Are Gone
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: Soon poor Happy Jack came dancing along with another nut for the hollow in the old chestnut tree. He peeped inside and saw that his whole store had vanished. He could hardly believe his eyes.
        - id: ch02-b02
          speaker: narrator
          text: Happy Jack reached one paw into the hollow and felt all around. He could not find a single nut. Then he climbed inside. It was true. The hollow was empty.
        - id: ch02-b03
          speaker: narrator
          text: Tears filled his eyes as he crept out again. He looked everywhere, but the only creature he saw was handsome Sammy Jay, carefully brushing his beautiful blue coat.
        - id: ch02-b04
          speaker: happy_jack
          text: Good morning, Sammy Jay. Did you see anyone come by? Someone stole all the nuts I had stored in the hollow of this old chestnut tree.
          emotion: sad
        - id: ch02-b05
          speaker: narrator
          text: Sammy pretended that Happy Jack's trouble made him feel terribly sorry. His voice was very sweet in those days. In that sweetest voice, he offered to go along and help Happy Jack catch the thief who had emptied the hollow in the old chestnut tree.
        - id: ch02-b06
          speaker: sammy_jay
          text: I will help you look for whoever took your nuts, Happy Jack.
        - id: ch02-b07
          speaker: narrator
          text: Together they crossed the Green Meadows, asking everyone they met whether they had seen the thief. All the Merry Little Breezes joined the search. Soon every creature in the meadows and the wood knew that someone had stolen Happy Jack's whole store from the old chestnut tree. Everyone liked Happy Jack, and everyone felt sorry for him.
    - id: ch03
      title: A Meeting at the Great Pine
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: Early the next morning, Old Mother West Wind let all the Merry Little Breezes out of her big bag. They had many errands to run. They hurried over the Green Meadows and through the wood, up and down the Laughing Brook and all around the Smiling Pool.
        - id: ch03-b02
          speaker: narrator
          text: Everywhere they went, the Breezes carried the same invitation. At nine o'clock, everyone was to gather at the Great Pine on the hill. Together they would form one great committee and try to discover who had stolen Happy Jack's store of nuts from the hollow in the old chestnut tree.
        - id: ch03-b03
          speaker: narrator
          text: Because everyone liked Happy Jack, everyone came. There were Reddy Fox, Bobby Coon, Jimmy Skunk, and Happy Jack's cousin Striped Chipmunk. Billy Mink came with Little Joe Otter and Jerry Muskrat. Hooty the Owl was there, though he could hardly keep his sleepy eyes open. Blacky the Crow came, along with Johnny Chuck, Peter Rabbit, and even old Grandfather Frog. Of course Sammy Jay came too, looking as handsome as he could.
        - id: ch03-b04
          speaker: narrator
          text: Once they had gathered around the Great Pine, Old Mother West Wind pointed toward the old nest high in its branches.
        - id: ch03-b05
          speaker: old_mother_west_wind
          text: Blacky, is that your nest?
        - id: ch03-b06
          speaker: blacky_crow
          text: It used to be mine, but I gave it to my cousin Sammy Jay.
        - id: ch03-b07
          speaker: old_mother_west_wind
          text: Sammy, is that your nest? May I take one stick from it?
        - id: ch03-b08
          speaker: sammy_jay
          text: It is my nest, and you are quite welcome to one stick.
        - id: ch03-b09
          speaker: narrator
          text: Sammy gave his politest bow. He thought Old Mother West Wind would take a stick from the top, where it would not matter.
        - id: ch03-b10
          speaker: narrator
          text: But Old Mother West Wind suddenly puffed out her cheeks. She blew so hard that a big stick shot from the bottom of the nest. It came tumbling down, bumping from branch to branch in the Great Pine.
    - id: ch04
      title: Sammy Jay Is Found Out
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: After the stick fell, something else came pouring down. Hickory nuts, chestnuts, acorns, and hazel nuts bounced everywhere. There were more and more of them!
        - id: ch04-b02
          speaker: happy_jack
          text: Why... why, those are all my stolen nuts!
          emotion: surprised
        - id: ch04-b03
          speaker: narrator
          text: Everyone turned toward Sammy Jay. But Sammy was already flying through the wood as fast as he could go.
        - id: ch04-b04
          speaker: old_mother_west_wind
          text: Stop, thief!
        - id: ch04-b05
          speakers: [breeze_1, breeze_2, johnny_chuck, billy_mink]
          ensemble: chorus
          text: Stop, thief!
        - id: ch04-b06
          speaker: narrator
          text: Sammy Jay did not stop. The others began gathering every nut that had fallen from the old nest where he had hidden them.
        - id: ch04-b07
          speaker: narrator
          text: They kept picking up nuts until the ground beneath the old nest was clear. After a while, Happy Jack took the lead. Everyone else marched behind him, carrying the recovered nuts all the way back to the old chestnut tree. There, Happy Jack put his whole store safely into the snug little hollow once more.
        - id: ch04-b08
          speaker: narrator
          text: And ever since that day, whenever Sammy Jay tries to call, all he can do is scream.
        - id: ch04-b09
          speaker: sammy_jay
          text: Thief! Thief! Thief!
