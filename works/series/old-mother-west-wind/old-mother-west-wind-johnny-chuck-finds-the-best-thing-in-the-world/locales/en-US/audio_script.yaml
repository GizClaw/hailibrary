  chapters:
    - id: ch01
      title: CHAPTER XIII JOHNNY CHUCK FINDS THE BEST THING IN THE WORLD
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Old Mother West Wind had stopped for a talk with the Slender Fir Tree.
        - id: ch01-b02
          speaker: old_mother_west_wind
          text: I've just crossed the Green Meadows, and I saw the Best Thing in the World there.
        - id: ch01-b03
          speaker: narrator
          text: Striped Chipmunk happened to be sitting beneath the Slender Fir Tree. He heard every word Old Mother West Wind said, and right away he began wondering what the Best Thing could be.
        - id: ch01-b04
          speaker: striped_chipmunk
          text: The Best Thing in the World? What could that be? It must be heaps and heaps of nuts and acorns! I'm going to find it.
        - id: ch01-b05
          speaker: narrator
          text: Off he raced through the wood, following the Lone Little Path as fast as his legs could carry him. Before long, he met Peter Rabbit.
        - id: ch01-b06
          speaker: peter_rabbit
          text: Where are you rushing off to, Striped Chipmunk?
        - id: ch01-b07
          speaker: striped_chipmunk
          text: I'm going down to the Green Meadows to find the Best Thing in the World!
        - id: ch01-b08
          speaker: narrator
          text: Striped Chipmunk gave his answer and ran on even faster. Peter Rabbit began thinking about what the Best Thing in the World might be.
        - id: ch01-b09
          speaker: peter_rabbit
          text: The Best Thing in the World? That has to be great piles of carrots and cabbage! I'll go find it too.
        - id: ch01-b10
          speaker: narrator
          text: Peter Rabbit hurried down the Lone Little Path after Striped Chipmunk, going as fast as he could.
        - id: ch01-b11
          speaker: narrator
          text: As they passed the great hollow tree, Bobby Coon poked his head out.
        - id: ch01-b12
          speaker: bobby_coon
          text: Where are you two going in such a hurry?
        - id: ch01-b13
          speakers: [striped_chipmunk, peter_rabbit]
          ensemble: duo
          text: Down to the Green Meadows to find the Best Thing in the World!
        - id: ch01-b14
          speaker: narrator
          text: Striped Chipmunk and Peter Rabbit shouted back. Then both of them began running faster along the path toward the Green Meadows.
        - id: ch01-b15
          speaker: bobby_coon
          text: The Best Thing in the World? That must be a whole field of sweet, milky corn. I'm going to find it!
        - id: ch01-b16
          speaker: narrator
          text: Bobby Coon climbed out of the hollow tree and hurried after them along the Lone Little Path. There was nothing he liked eating better than sweet, milky corn.
        - id: ch01-b17
          speaker: narrator
          text: At the edge of the wood, they met Jimmy Skunk.
        - id: ch01-b18
          speaker: jimmy_skunk
          text: Why is everyone in such a hurry?
        - id: ch01-b19
          speakers: [striped_chipmunk, peter_rabbit, bobby_coon]
          ensemble: chorus
          text: We're going down to the Green Meadows to find the Best Thing in the World!
        - id: ch01-b20
          speaker: narrator
          text: The three friends shouted the news to Jimmy Skunk and rushed on. Each of them tried to get a little more speed from his legs.
        - id: ch01-b21
          speaker: jimmy_skunk
          text: The Best Thing in the World? It must be packs and packs of beetles!
        - id: ch01-b22
          speaker: narrator
          text: For once in his life, Jimmy Skunk began to hurry. He followed Striped Chipmunk, Peter Rabbit, and Bobby Coon down the path.
        - id: ch01-b23
          speaker: narrator
          text: They were going so fast that none of them saw Reddy Fox until he sprang out of the long grass.
        - id: ch01-b24
          speaker: reddy_fox
          text: Where are all of you racing to?
        - id: ch01-b25
          speakers: [striped_chipmunk, peter_rabbit, bobby_coon, jimmy_skunk]
          ensemble: chorus
          text: We're going to find the Best Thing in the World!
        - id: ch01-b26
          speaker: narrator
          text: The four travelers shouted their answer as they raced past. Once again, every one of them did his best to run faster.
        - id: ch01-b27
          speaker: reddy_fox
          text: The Best Thing in the World? That must be a whole pen of tender young chickens, and I mean to have them!
        - id: ch01-b28
          speaker: narrator
          text: Away went Reddy Fox at top speed. Down the Lone Little Path he flew after Striped Chipmunk, Peter Rabbit, Bobby Coon, and Jimmy Skunk.
        - id: ch01-b29
          speaker: narrator
          text: After a while, they all reached Johnny Chuck's house.
        - id: ch01-b30
          speaker: johnny_chuck
          text: Where is everybody going so fast?
        - id: ch01-b31
          speakers: [striped_chipmunk, peter_rabbit, bobby_coon, jimmy_skunk]
          ensemble: chorus
          text: We're going to find the Best Thing in the World!
        - id: ch01-b32
          speaker: narrator
          text: Striped Chipmunk, Peter Rabbit, Bobby Coon, and Jimmy Skunk all shouted the answer. Reddy Fox joined their cry, and the whole company hurried on toward the Green Meadows.
        - id: ch01-b33
          speaker: johnny_chuck
          text: The Best Thing in the World? Well, I don't know anything better than my own little home, the warm sunshine, and the beautiful blue sky.
        - id: ch01-b34
          speaker: narrator
          text: Johnny Chuck did not follow them. He stayed right there at his own little home beneath the warm sun and blue sky. All day, he played among the flowers with the Merry Little Breezes of Old Mother West Wind, as happy as anyone could be.
        - id: ch01-b35
          speaker: narrator
          text: Striped Chipmunk, Peter Rabbit, Bobby Coon, Jimmy Skunk, and Reddy Fox spent that whole day running this way and that across the Green Meadows. They searched everywhere for the Best Thing in the World. The sun grew very, very warm. They went so far and ran so fast that they became very, very hot and tired. Still, they could not find it.
        - id: ch01-b36
          speaker: narrator
          text: When the long day ended, they turned toward home. Their way took them back up the Lone Little Path and past Johnny Chuck's house. This time, nobody hurried. They were much too tired, and oh, how cross they were!
        - id: ch01-b37
          speaker: narrator
          text: Striped Chipmunk had not found one nut. Peter Rabbit had not found even a cabbage leaf. Bobby Coon had not found the tiniest taste of sweet, milky corn. Jimmy Skunk had not seen one beetle. Reddy Fox had not heard so much as a chicken's peep. Every one of them was as hungry as could be.
        - id: ch01-b38
          speaker: narrator
          text: Halfway up the Lone Little Path, they met Old Mother West Wind on her way home behind the hill.
        - id: ch01-b39
          speaker: old_mother_west_wind
          text: Did you find the Best Thing in the World?
        - id: ch01-b40
          speakers: [striped_chipmunk, peter_rabbit, bobby_coon, jimmy_skunk]
          ensemble: chorus
          text: No!
          emotion: angry
        - id: ch01-b41
          speaker: narrator
          text: Striped Chipmunk, Peter Rabbit, Bobby Coon, and Jimmy Skunk cried out together. Reddy Fox shouted no with them too. They had searched all day and found none of the things they wanted.
        - id: ch01-b42
          speaker: old_mother_west_wind
          text: Johnny Chuck has it. It means being happy with what you have, without wishing for what belongs to someone else. Its name is contentment.
