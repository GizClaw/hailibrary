  chapters:
    - id: ch01
      title: "CHAPTER VIII. BILLY MINK'S SWIMMING PARTY"
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Billy Mink came down the bank of the Laughing Brook feeling very good indeed. He had eaten a good breakfast, and the sun felt warm. Little white clouds sailed across the blue sky like ships, while their shadows crossed the Green Meadows. Birds sang, bees hummed, and Billy felt like singing too. But his voice was never meant for a song.
        - id: ch01-b02
          speaker: narrator
          text: After a while, Billy reached the Smiling Pool. The Laughing Brook stopped there to rest on its way to the Big River. Its noisy laughter and singing grew quiet, and the water lay smiling in the warm sunshine. Little flowers leaned over the bank and nodded to it. Now and then, the old beech tree dropped in a leaf. Along the edge, the cat-tails kept their feet cool in the water.
        - id: ch01-b03
          speaker: narrator
          text: Billy jumped onto the Big Rock and looked into the pool. Across the water, old Grandfather Frog sat on a green lily pad.
        - id: ch01-b04
          speaker: billy_mink
          text: Good morning, Grandfather Frog!
        - id: ch01-b05
          speaker: grandfather_frog
          text: Good morning, Billy Mink. What sort of mischief are you planning on this fine, sunny morning?
        - id: ch01-b06
          speaker: narrator
          text: Just then, Billy noticed a little brown head moving through the water near the edge of the pool.
        - id: ch01-b07
          speaker: billy_mink
          text: Hello there, Jerry Muskrat!
        - id: ch01-b08
          speaker: jerry_muskrat
          text: Hello yourself, Billy Mink! Come on in for a swim. The water feels fine!
        - id: ch01-b09
          speaker: billy_mink
          text: That's a fine idea. Let's have a swimming party!
        - id: ch01-b10
          speaker: narrator
          text: The Merry Little Breezes of Old Mother West Wind were playing with the flowers along the bank. Billy called them over and sent them to find Little Joe Otter and invite him to the party. Before long, the Breezes came back, and Little Joe was with them.
        - id: ch01-b11
          speaker: little_joe_otter
          text: Hello, Billy Mink! Here I am!
        - id: ch01-b12
          speaker: billy_mink
          text: Hello, Little Joe! Climb onto the Big Rock with us. We'll see who can dive deepest into the Smiling Pool.
        - id: ch01-b13
          speaker: narrator
          text: Little Joe Otter and Jerry Muskrat climbed up beside Billy. The three friends stood shoulder to shoulder on the Big Rock in their little brown bathing suits and looked down at the water.
        - id: ch01-b14
          speaker: billy_mink
          text: When I reach three, we'll all dive in together and see who goes deepest. One! Two! Three!
        - id: ch01-b15
          speaker: narrator
          text: At the word three, all of them went in headfirst. What a splash they made! Grandfather Frog was knocked right off his lily pad. Mr. and Mrs. Trout were so frightened that they leaped clear out of the water. Tiny Tadpole got such a scare that he buried himself deep in the mud, with only the tip of his funny little nose showing.
        - id: ch01-b16
          speaker: grandfather_frog
          text: Chug-a-rum! If I weren't so old, I'd show you youngsters how a proper dive is done.
        - id: ch01-b17
          speaker: narrator
          text: Grandfather Frog climbed back onto his lily pad.
        - id: ch01-b18
          speaker: billy_mink
          text: Come on, Grandfather Frog! Show us how you dive!
        - id: ch01-b19
          speaker: narrator
          text: And what do you think happened? Grandfather Frog became so excited that he really did climb onto the Big Rock to show them. Splash! Into the Smiling Pool he went. Billy Mink splashed in right behind him. Then Little Joe Otter and Jerry Muskrat followed close at Billy's heels, splash, splash!
        - id: ch01-b20
          speaker: mr_kingfisher
          text: Hurrah!
          emotion: happy
        - id: ch01-b21
          speaker: narrator
          text: Mr. Kingfisher had been watching from a branch of the old beech tree. Now he wanted to show that he could dive too, so down he splashed into the pool.
        - id: ch01-b22
          speaker: narrator
          text: What a noise they made! The Merry Little Breezes danced for joy along the bank. Blacky the Crow and Sammy Jay flew over to find out what was happening.
        - id: ch01-b23
          speaker: billy_mink
          text: Now let's find out who can swim farthest under the water!
        - id: ch01-b24
          speaker: narrator
          text: Billy Mink, Little Joe Otter, Jerry Muskrat, and Grandfather Frog lined up side by side at one edge of the Smiling Pool.
        - id: ch01-b25
          speaker: mr_kingfisher
          text: Go!
        - id: ch01-b26
          speaker: narrator
          text: They plunged into the pool together. Little ripples hurried across the surface. Then the water grew smooth and smiling again, as though no one had dived into it at all.
        - id: ch01-b27
          speaker: narrator
          text: Grandfather Frog soon realized that he was not as young as he used to be. Besides, he could never swim as fast as the others. When he began to run short of breath, he rose toward the surface and poked out just the tip of his nose for more air. Sammy Jay's sharp eyes spotted him.
        - id: ch01-b28
          speaker: sammy_jay
          text: There he is! There's Grandfather Frog!
          emotion: surprised
        - id: ch01-b29
          speaker: narrator
          text: Grandfather Frog popped his whole head above the water. Then he swam back to his green lily pad to rest.
        - id: ch01-b30
          speaker: narrator
          text: Far beyond the Big Rock, three long trails of tiny bubbles kept rising to the top of the pool. Those bubbles showed exactly where Billy Mink, Little Joe Otter, and Jerry Muskrat were swimming far below, out of sight. The air from their lungs made each little trail.
        - id: ch01-b31
          speaker: narrator
          text: The three rows of bubbles went straight across the Smiling Pool. At last, two little heads bobbed up close together on the far side. They belonged to Billy Mink and Little Joe Otter. A moment later, Jerry Muskrat's head appeared beside them.
        - id: ch01-b32
          speaker: narrator
          text: They had swum all the way across the pool, so of course they could go no farther.
        - id: ch01-b33
          speaker: narrator
          text: And that is how Billy Mink's swimming party became a great success.
