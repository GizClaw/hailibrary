audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖亲切，带着轻快的讲故事感
        timbre: 清澈柔和
        pace: 舒展而富有变化
        pitch: 中音
    billy_mink:
      display_name: 水貂比利
      tts:
        delivery: 机灵自信，取笑人时透着顽皮
        timbre: 清亮有活力的男声
        pace: 轻快
        pitch: 中音
    grandfather_frog:
      display_name: 青蛙爷爷
      tts:
        delivery: 悠然稳重，话音里带一点诙谐
        timbre: 浑厚略带沙哑
        pace: 缓慢
        pitch: 低音
    jerry_muskrat:
      display_name: 麝鼠杰里
      tts:
        delivery: 热情爽快，说话朴实直接
        timbre: 温厚明亮的少年声
        pace: 平稳偏快
        pitch: 中音
    little_joe_otter:
      display_name: 小水獭乔
      tts:
        delivery: 活泼随和，兴奋时干脆响亮
        timbre: 清朗有朝气的少年声
        pace: 轻快
        pitch: 中高音
    mr_kingfisher:
      display_name: 翠鸟先生
      tts:
        delivery: 爽朗响亮，笑声干脆
        timbre: 清脆的成年男声
        pace: 明快
        pitch: 中高音
    sammy_jay:
      display_name: 松鸦萨米
      tts:
        delivery: 眼尖嘴快，喊话时响亮利落
        timbre: 尖亮的年轻男声
        pace: 偏快
        pitch: 高音
  chapters:
    - id: ch01
      title: 阳光下的微笑池
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 水貂比利沿着欢笑溪岸往下走，心情好极了。他早饭吃得饱饱的，太阳晒在身上暖洋洋。朵朵白云像一艘艘小船，在蓝天上悠悠驶过。它们投下的影子也像小船，在绿草地上悠悠驶过。鸟儿唱着歌，蜜蜂嗡嗡地哼着小调。比利也很想跟着唱上一曲，可他的嗓子天生就不是唱歌的料。
        - id: ch01-b02
          speaker: narrator
          text: 不久，比利来到微笑池。欢笑溪一路奔向大河，到了这里就停下来歇歇脚。它收起哗啦啦的欢笑和歌声，只静静躺在温暖的阳光里，微笑呀，微笑。岸边的小花俯下身朝它点头。那棵年纪很大的山毛榉，偶尔会送它一片落叶。香蒲把脚泡在池边，舒舒服服地乘凉。
        - id: ch01-b03
          speaker: narrator
          text: 比利跳上大岩石，低头一看，青蛙爷爷正坐在对面一片碧绿的睡莲叶上。
        - id: ch01-b04
          speaker: billy_mink
          text: 青蛙爷爷，你好呀！
        - id: ch01-b05
          speaker: grandfather_frog
          text: 水貂比利，你好。这么晴朗的早晨，你又想淘气了吧？
        - id: ch01-b06
          speaker: narrator
          text: 就在这时，一个棕色小脑袋贴着微笑池的一边游了过来。比利一眼就认出，那是麝鼠杰里。
        - id: ch01-b07
          speaker: billy_mink
          text: 麝鼠杰里，你好呀！
        - id: ch01-b08
          speaker: jerry_muskrat
          text: 水貂比利，你也好！快下来游一会儿，水里舒服得很！
        - id: ch01-b09
          speaker: billy_mink
          text: 好啊，那咱们干脆开个游泳会！
    - id: ch02
      title: 谁能潜得最深
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 西风妈妈的欢乐小风正在岸边同花儿玩耍。比利把它们全叫来，请它们去找小水獭乔，邀他参加游泳会。没过多久，小风们就回来了，小水獭乔也跟着它们一起来了。
        - id: ch02-b02
          speaker: little_joe_otter
          text: 水貂比利，你好，我来啦！
        - id: ch02-b03
          speaker: billy_mink
          text: 小水獭乔，你来得正好！快上大岩石，咱们比比谁能潜得最深。
        - id: ch02-b04
          speaker: narrator
          text: 小水獭乔和麝鼠杰里爬上大岩石，一左一右站到比利身旁。三个小伙伴都穿着自己的棕色小泳衣，肩并着肩，一起低头看着微笑池。
        - id: ch02-b05
          speaker: billy_mink
          text: 我数到三，大家一起往下跳，看谁潜得最深。准备好，一！二！三！
        - id: ch02-b06
          speaker: narrator
          text: “三”字刚出口，他们就一齐头朝下扎进水里。哎呀，那水花溅得可真大！青蛙爷爷被掀下了睡莲叶，鳟鱼先生和鳟鱼太太吓得蹿出水面。小蝌蚪蒂尼更是直钻进深深的泥里，只敢露出古怪小鼻子的鼻尖。
        - id: ch02-b07
          speaker: narrator
          text: 青蛙爷爷从水里爬回睡莲叶，低低地叫了一声“咕咚隆咚”。
        - id: ch02-b08
          speaker: grandfather_frog
          text: 我要是没这么老，早就让你们见识见识该怎么跳水啦。
        - id: ch02-b09
          speaker: billy_mink
          text: 那就来吧，青蛙爷爷！跳给我们看看！
    - id: ch03
      title: 大家都来跳水
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 你猜怎么着？青蛙爷爷当真兴奋起来。他爬上大岩石，要给大家露一手。扑通！青蛙爷爷先跳进微笑池。扑通！比利紧跟着跳了下去。又是扑通、扑通两声，小水獭乔和麝鼠杰里也贴着比利的脚后跟入了水。
        - id: ch03-b02
          speaker: mr_kingfisher
          text: 好哇！
          emotion: happy
        - id: ch03-b03
          speaker: narrator
          text: 翠鸟先生坐在老山毛榉的树枝上，高声为他们叫好。为了证明自己也会跳水，他也扑通一声扎进了微笑池。
        - id: ch03-b04
          speaker: narrator
          text: 他们闹出的动静可真大，池边一下热闹极了。西风妈妈的欢乐小风高兴得在岸上跳起舞来。乌鸦布莱基和松鸦萨米听见声响，也飞过来瞧瞧这里出了什么事。
        - id: ch03-b05
          speaker: billy_mink
          text: 接下来比比看，谁能在水底下游得最远！
        - id: ch03-b06
          speaker: narrator
          text: 大家来到微笑池的一边，再次肩并着肩站好。
        - id: ch03-b07
          speaker: mr_kingfisher
          text: 出发！
        - id: ch03-b08
          speaker: narrator
          text: 大家一齐扎进水里。细小的波纹一圈圈掠过池面，很快，水面又平静下来，仍旧笑盈盈的，仿佛刚才根本没有谁猛地跳进去。
    - id: ch04
      title: 横渡微笑池
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 游着游着，青蛙爷爷才发觉，自己已经不像从前那么年轻了。他本来就游不过那些小伙伴，没多久又喘不上气，只好浮到水面，先把鼻尖露出来吸几口气。松鸦萨米眼睛尖，一下就发现了他。
        - id: ch04-b02
          speaker: sammy_jay
          text: 看哪，青蛙爷爷在那儿！
        - id: ch04-b03
          speaker: narrator
          text: 青蛙爷爷这才把整个脑袋探出水面，游回碧绿的睡莲叶上休息。
        - id: ch04-b04
          speaker: narrator
          text: 大岩石远远的另一边，三长排小气泡不断冒出水面。顺着这三排气泡，就能清清楚楚地看出，比利、小水獭乔和麝鼠杰里正在深深的水下往前游。他们藏在水下，谁也看不见，只有肺里的空气化成小气泡，一路冒到水面上来。
        - id: ch04-b05
          speaker: narrator
          text: 三排气泡笔直穿过微笑池。到了远处的另一岸，两个小脑袋几乎同时冒出水面，是水貂比利和小水獭乔。过了一会儿，麝鼠杰里也在他们身边探出头来。
        - id: ch04-b06
          speaker: narrator
          text: 原来，他们已经一口气游过了整个微笑池。当然啦，池水已经到了头，再也没法游得更远了。
        - id: ch04-b07
          speaker: narrator
          text: 水貂比利的这场游泳会，就这样办得成功极了。
