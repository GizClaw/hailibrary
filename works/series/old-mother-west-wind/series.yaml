cover_prompt: |-
  A wordless cover scene in the early morning shows an elderly maternal wind figure descending from purple hills toward broad green meadows in rural America around 1910. She wears a long pale blue-gray dress and shawl billowing in the breeze, with a large cloth bag slung over her shoulders. As she turns the bag upside down, a lively stream of small airy childlike breeze figures tumbles out and spins above the grass. A brown rabbit, a red fox, a striped skunk, a dark mink, and a green frog beside a lily pool look toward the joyful arrival. Use a wide child-height view with the tumbling breezes as the focal action, the meadow and laughing brook guiding the eye toward the hills, and calm open sunrise sky across the top. Keep the animals anatomically believable, the clothing period-appropriate, and every figure gentle and child-friendly. No readable text, letters, numbers, labels, logos, captions, speech bubbles, signatures, or watermarks.
