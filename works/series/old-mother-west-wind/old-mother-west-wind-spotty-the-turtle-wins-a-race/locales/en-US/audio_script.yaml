  chapters:
    - id: ch01
      title: A Race Across the Green Meadows
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: All the little people who lived on the Green Meadows, around the Smiling Pool, and beside the Laughing Brook were going to have a holiday. The Merry Little Breezes had been very busy carrying the news from one meadow neighbor to another.
        - id: ch01-b02
          speaker: narrator
          text: It began because Peter Rabbit had boasted about how fast he could run. Reddy Fox was sure he could outrun Peter. Billy Mink moved so quickly that you could hardly see him, and he was certain he could beat them both. At last, the three met beside the Smiling Pool and asked wise old Grandfather Frog to settle the matter.
        - id: ch01-b03
          speaker: narrator
          text: Grandfather Frog had lived much longer than any of them. Whenever the meadow folk had a dispute, they called on him. He sat on his green lily pad while Billy perched on the Big Rock and Peter and Reddy waited on the bank. One by one, they explained why each thought he was fastest. Grandfather Frog listened without saying a word. When they were done, he paused to catch a foolish green fly.
        - id: ch01-b04
          speaker: grandfather_frog
          text: There is one good way to learn who is fastest. You must race.
        - id: ch01-b05
          speaker: narrator
          text: So they chose a course. They would start at the old butternut tree on one side of the Green Meadows, cross to the little hill on the far side, and each fetch a nut from the big hickory tree. The first racer back at the butternut tree with a hickory nut would win. The Merry Little Breezes flew everywhere with the news, and everyone planned to watch.
        - id: ch01-b06
          speaker: narrator
          text: The race came on a beautiful summer day. The more Mr. Sun smiled, the warmer the meadow grew. Striped Chipmunk, Happy Jack Squirrel, Sammy Jay, Blacky the Crow, Hooty the Owl, and Bobby Coon found cool, shady seats in the old butternut tree. Johnny Chuck, Jerry Muskrat, Jimmy Skunk, Little Joe Otter, Grandfather Frog, and even old Mr. Toad came too.
        - id: ch01-b07
          speaker: narrator
          text: Spotty the Turtle arrived last. Spotty walked very slowly, and he could not run at all. When Peter saw him coming toward the tree, he called out to him.
        - id: ch01-b08
          speaker: peter_rabbit
          text: Come on, Spotty! Wouldn't you like to race with us?
        - id: ch01-b09
          speaker: narrator
          text: Everyone laughed because Spotty was so very slow. But Spotty did not laugh, and he did not lose his temper.
        - id: ch01-b10
          speaker: spotty_the_turtle
          text: Peter Rabbit, an old saying tells us that the fastest runners do not always arrive first. I believe I will join this race.
        - id: ch01-b11
          speaker: narrator
          text: The meadow folk thought this was the finest joke they had heard in a long time. They laughed even harder at the thought of slow Spotty racing Peter, Reddy, and Billy. Still, they all agreed that Spotty could start with the others.
        - id: ch01-b12
          speaker: narrator
          text: The racers lined up. Peter stood first, then Billy Mink, then Reddy Fox, with Spotty beside Reddy.
        - id: ch01-b13
          speaker: grandfather_frog
          text: Is everyone ready? Go!
    - id: ch02
      title: The Racers Reach the Pond
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: Peter bounded away in enormous jumps. Billy Mink shot after him, no more than a little brown streak in the tall grass, and Reddy Fox ran beside Billy. As they started, Spotty reached up and caught the long hair at the end of Reddy's big tail.
        - id: ch02-b02
          speaker: narrator
          text: Reddy could not stop to shake him loose. Peter and Billy were moving so fast that Reddy had to run his very best just to stay with them. He did not even know Spotty was there. Spotty weighed very little, and Reddy was too excited to notice that his tail felt heavier than usual.
        - id: ch02-b03
          speaker: narrator
          text: The Merry Little Breezes flew along to make sure the race was fair. Peter sailed over every little bush in great big jumps. His long legs were made for jumping. Slim little Billy slipped between the bushes and through the tall grass like a brown streak. Reddy was bigger than either of them, yet he had no trouble keeping up. The three racers were watching one another so closely that none of them saw Spotty hanging firmly from the end of Reddy's tail.
        - id: ch02-b04
          speaker: narrator
          text: A long, narrow pond lay at the foot of the hill where the hickory tree grew. Billy remembered it, and he chuckled as he ran. Peter could not swim, and Reddy disliked the water, so both of them would have to go around. Billy could swim even faster than he could run.
        - id: ch02-b05
          speaker: narrator
          text: The more Billy thought about the pond, the sillier it seemed to hurry on such a hot day.
        - id: ch02-b06
          speaker: narrator
          text: Billy told himself that Peter and Reddy might reach the pond first, but they would still have to run around it. He could swim straight across and cool himself at the same time. He felt sure he would reach the hickory tree first. So Billy slowed down more and more until he had fallen behind.
        - id: ch02-b07
          speaker: narrator
          text: Round, red Mr. Sun looked down and smiled at the race. As he smiled, the day grew warmer and warmer. Peter wore a thick gray coat, while Reddy wore a thick red one. Soon they were both terribly hot. Peter could no longer make the great long jumps he had made at the start. Reddy became so thirsty that his tongue hung out. When they saw that Billy had fallen behind, they decided they no longer needed to run quite so hard.
        - id: ch02-b08
          speaker: narrator
          text: Peter reached the pond first. He had forgotten all about it when he entered the race. He stopped at the very edge and sat upright on his hind legs. Across the water, he could see the big hickory tree. It looked so close, yet Peter could not swim to it. He would have to run the full length of the pond, go around its end, and come back along the other side. It was a long, long distance.
        - id: ch02-b09
          speaker: narrator
          text: A moment later, Reddy burst out of the bushes and understood the trouble at once. Far behind them, Billy came trotting comfortably along, chuckling to himself. Peter stared at Reddy in dismay. Reddy stared back. Then both looked at Billy and remembered that he could swim straight across.
        - id: ch02-b10
          speaker: narrator
          text: Peter raced around the pond in one direction, while Reddy dashed around it the other way. They were so excited that neither heard a small splash. Spotty had released Reddy's tail and slipped into the pond.
        - id: ch02-b11
          speaker: narrator
          text: Spotty was a splendid swimmer. He went straight across under the water, lifting his little black nose only once or twice for air. No one saw him except the Merry Little Breezes. He reached the far bank and climbed out directly beneath the big hickory tree.
    - id: ch03
      title: Three Hickory Nuts
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: Only three nuts remained beneath the hickory tree. Spotty carried two down to the pond and buried them in the mud. He took the third in his mouth and started swimming back.
        - id: ch03-b02
          speaker: narrator
          text: Just as Spotty reached the near shore, Billy Mink trotted up. Billy did not see him. He was watching Peter and Reddy, who were only halfway around the pond. Billy jumped into the water with a splash. My, how good that cool water felt!
        - id: ch03-b03
          speaker: narrator
          text: Billy was certain the race belonged to him, so there was no reason to hurry. He swam around and around, chased a few fish, and had a beautiful time in the cool water. After a while, he finally looked up. Peter was almost around one end of the pond, and Reddy was almost around the other. Both racers looked tired, hot, and discouraged, but Billy still felt sure he would win.
        - id: ch03-b04
          speaker: narrator
          text: At last, Billy swam slowly to the far side and climbed onto the bank beneath the hickory tree. Then he looked for the nuts. There were none. The Merry Little Breezes had told everyone that three nuts lay there, but Billy could not find even one.
        - id: ch03-b05
          speaker: narrator
          text: He hurried one way and then another, turning over leaves and peering beneath twigs and bits of bark. He was still searching when Peter and Reddy finally arrived.
        - id: ch03-b06
          speaker: narrator
          text: Peter and Reddy joined the hunt. They looked under every leaf and every piece of bark. They pawed through the grass and searched every nook and cranny around the hickory tree. Not one of them found a nut. Tired, cross, and hot after the long run, Peter and Reddy accused Billy of hiding all three.
        - id: ch03-b07
          speaker: narrator
          text: Billy insisted that he had not hidden the nuts. He had never found them at all. Peter and Reddy watched how hard he kept searching, and at last they believed him.
    - id: ch04
      title: Spotty Crawls Home
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: All afternoon, Peter, Reddy, and Billy hunted and hunted beneath the hickory tree. They did not know that Spotty was already on his way back. All that same afternoon, he crawled straight across the Green Meadows toward the old butternut tree. He kept the hickory nut in his mouth and moved slowly, oh, so slowly, over the whole wide meadow.
        - id: ch04-b02
          speaker: narrator
          text: Round, red Mr. Sun sank close to the Purple Hills, where he went to bed each night. The little meadow folk began getting ready to go home. They wondered again and again what could have happened to the racers. Then Sammy Jay spotted the Merry Little Breezes dancing across the meadow.
        - id: ch04-b03
          speaker: sammy_jay
          text: The Merry Little Breezes are coming! They can tell us who won!
        - id: ch04-b04
          speaker: narrator
          text: When the Breezes reached the old butternut tree, all the waiting meadow folk crowded around them. Everyone wanted to hear who had finished first. But the Merry Little Breezes only laughed and laughed. They would not say a single word about the race.
        - id: ch04-b05
          speaker: narrator
          text: Suddenly, Spotty crept out of the tall meadow grass. He went to old Grandfather Frog and placed the hickory nut at his feet. Grandfather Frog was so astonished that he let a great green fly buzz right past his nose.
        - id: ch04-b06
          speaker: grandfather_frog
          text: Spotty, where did you find that hickory nut?
          emotion: surprised
        - id: ch04-b07
          speaker: spotty_the_turtle
          text: I found it under the big hickory tree on the hill across the Green Meadows.
    - id: ch05
      title: Spotty Wins the Race
      blocks:
        - id: ch05-b01
          speakers: [breeze_1, breeze_2, breeze_3]
          ensemble: chorus
          text: He did! He did! Spotty has won the race!
          emotion: happy
        - id: ch05-b02
          speaker: narrator
          text: The Merry Little Breezes clapped their hands. Then they told everyone exactly what had happened. Spotty had reached the pond by holding onto the tip of Reddy Fox's tail. He had hidden two of the hickory nuts. Then, while Billy Mink, Reddy Fox, and Peter Rabbit searched and searched for nuts they could not find, Spotty had patiently crawled home with the third.
        - id: ch05-b03
          speaker: narrator
          text: And so Spotty the Turtle was declared the winner. To this day, Peter Rabbit, Reddy Fox, and Billy Mink cannot bear the sight of a hickory nut.
