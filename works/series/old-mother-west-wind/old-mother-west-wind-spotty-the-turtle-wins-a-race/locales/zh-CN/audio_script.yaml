audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖亲切，带着轻快的讲故事感
        timbre: 清澈柔和
        pace: 舒展而富有变化
        pitch: 中音
    peter_rabbit:
      display_name: 兔子彼得
      tts:
        delivery: 顽皮机灵，笑声爽朗
        timbre: 明亮清透的少年声
        pace: 轻快
        pitch: 中高音
    spotty_turtle:
      display_name: 乌龟斑斑
      tts:
        delivery: 沉着自信，受人取笑也不急不恼
        timbre: 温和清润的少年声
        pace: 从容偏慢
        pitch: 中音
    grandfather_frog:
      display_name: 青蛙爷爷
      tts:
        delivery: 悠然稳重，话音里带一点诙谐
        timbre: 浑厚略带沙哑
        pace: 缓慢
        pitch: 低音
    billy_mink:
      display_name: 水貂比利
      tts:
        delivery: 机灵自信，取笑人时透着顽皮
        timbre: 清亮有活力的男声
        pace: 轻快
        pitch: 中音
    sammy_jay:
      display_name: 松鸦萨米
      tts:
        delivery: 眼尖嘴快，喊话时响亮利落
        timbre: 尖亮的年轻男声
        pace: 偏快
        pitch: 高音
    breeze_1:
      display_name: 小风一号
      tts:
        delivery: 活泼爽朗，充满好奇
        timbre: 清亮的童声
        pace: 轻快
        pitch: 中高音
    breeze_2:
      display_name: 小风二号
      tts:
        delivery: 机灵热心，语气干脆
        timbre: 轻盈的童声
        pace: 轻快
        pitch: 高音
    breeze_3:
      display_name: 小风三号
      tts:
        delivery: 顽皮热烈，带着跳跃感
        timbre: 明快的童声
        pace: 稍快
        pitch: 中高音
    breeze_4:
      display_name: 小风四号
      tts:
        delivery: 天真勇敢，说话利落
        timbre: 柔亮的童声
        pace: 轻快
        pitch: 高音
  chapters:
    - id: ch01
      title: 到底谁跑得最快
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 住在绿草地、微笑池和欢笑溪一带的小家伙们，要过一个快乐的节日了。西风妈妈的欢乐小风们忙着给每一位小邻居送信，简直忙得团团转。
        - id: ch01-b02
          speaker: narrator
          text: 原来，兔子彼得总在吹嘘自己跑得快。狐狸雷迪一口咬定，他比彼得还快。水貂比利呢，跑起来只剩一道影子。他也认定，那两个家伙谁都赶不上自己。
        - id: ch01-b03
          speaker: narrator
          text: 一天，他们在微笑池边碰了面，决定请青蛙爷爷来评一评，到底谁跑得最快。大家都说青蛙爷爷很有智慧。他活得很久很久，比其他小家伙的年纪都大。正因为上了年纪，见多识广，大家争执不下时，总会找他评理。
        - id: ch01-b04
          speaker: narrator
          text: 青蛙爷爷坐在绿色的睡莲叶上。水貂比利坐在大岩石上，彼得和雷迪坐在岸边。三个人轮流说起自己为什么最快。青蛙爷爷一直听着，一句话也没说。
        - id: ch01-b05
          speaker: narrator
          text: 等他们全讲完，青蛙爷爷先捉住一只傻乎乎的绿头苍蝇，这才开了口。
        - id: ch01-b06
          speaker: grandfather_frog
          text: 光靠说可分不出谁最快。你们赛一场，不就知道了吗？
        - id: ch01-b07
          speaker: narrator
          text: 大家便定下了路线。彼得、雷迪和比利要从绿草地一头的老胡桃树下一起出发，穿过整片草地，跑到另一头的小山上。到了那里，每人要从大山核桃树下拿一颗果子，再原路返回。
        - id: ch01-b08
          speaker: narrator
          text: 谁最先带着山核桃回到老胡桃树下，谁就是赢家。欢乐小风们把消息送遍了绿草地，小家伙们听了，都打定主意要来看比赛。
    - id: ch02
      title: 最慢的选手
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 比赛这天，夏日晴美。太阳先生笑呀笑呀，他笑得越欢，天气就越暖。花栗鼠条纹、松鼠快乐杰克、松鸦萨米、乌鸦布莱基、猫头鹰胡蒂和浣熊博比，全坐在老胡桃树上。那儿又阴凉，又舒服。
        - id: ch02-b02
          speaker: narrator
          text: 土拨鼠约翰尼、麝鼠杰里、臭鼬吉米、小水獭乔、青蛙爷爷，连年迈的蟾蜍先生也来了。最后出现的是乌龟斑斑。他走得很慢，根本不会跑。
        - id: ch02-b03
          speaker: narrator
          text: 彼得看见斑斑正朝老胡桃树爬来，便高声招呼他。
        - id: ch02-b04
          speaker: peter_rabbit
          text: 来呀，斑斑！你也跟我们赛一场，怎么样？
        - id: ch02-b05
          speaker: narrator
          text: 大家一下全笑了。谁不知道斑斑慢得不能再慢呢？可斑斑既没有跟着笑，也没有因为大家取笑他而发火。
        - id: ch02-b06
          speaker: spotty_turtle
          text: 彼得，有句古老的话很有道理。跑得最快的，不一定最先到达。所以这场比赛，我也参加。
        - id: ch02-b07
          speaker: narrator
          text: 大家觉得，这是好久以来听过的最好笑的笑话，于是笑得更厉害了。不过，他们都同意让斑斑参加。
        - id: ch02-b08
          speaker: narrator
          text: 四位选手排成一行。最前面是兔子彼得，接着是水貂比利，然后是狐狸雷迪。乌龟斑斑就站在雷迪右边。
        - id: ch02-b09
          speaker: grandfather_frog
          text: 都准备好了吗？跑！
        - id: ch02-b10
          speaker: narrator
          text: 彼得立刻迈开大步，一蹦一跳地冲了出去。比利紧随其后，快得只剩一道棕色细影，在高高的草间闪过。雷迪和他并肩飞奔。
        - id: ch02-b11
          speaker: narrator
          text: 就在起跑的一刻，斑斑伸长脖子，一口咬住雷迪大尾巴尖上的长毛。雷迪不能停下来甩掉他。彼得和比利跑得飞快，他得使出全副本领才能跟上。
        - id: ch02-b12
          speaker: narrator
          text: 其实，雷迪压根儿不知道斑斑挂在后面。斑斑并不重，雷迪又兴奋得不得了，根本没发现自己的尾巴比平时沉了一点。
    - id: ch03
      title: 池塘边的转机
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 欢乐小风们一路跟着，要看看比赛是否公平。彼得碰见小灌木就纵身跳过。他的两条长腿，天生就适合跳跃。比利身子细长，在灌木和高草间穿来穿去，活像一道棕色细影。
        - id: ch03-b02
          speaker: narrator
          text: 雷迪比他们俩都大，却一点儿也没落后。谁也没有发现，斑斑还牢牢挂在他的尾巴尖上。
        - id: ch03-b03
          speaker: narrator
          text: 大山核桃树所在的小山脚下，有一片池塘。池塘不算宽，却很长。比利记得它。他一边跑一边偷笑。彼得不会游泳，雷迪又不喜欢水，他们都得绕过去。可比利游得比跑得还快。
        - id: ch03-b04
          speaker: narrator
          text: 比利越想越觉得，这么暖和的天气，根本没必要赶得满头大汗。
        - id: ch03-b05
          speaker: billy_mink
          text: 就算他们先到池塘，也得绕着岸跑。我可以直接游过去，还能凉快凉快。第一个到的准是我。
        - id: ch03-b06
          speaker: narrator
          text: 比利越跑越慢，很快落到了后面。圆圆的、红红的太阳先生从天上望着他们，笑呀笑呀。他笑得越欢，天气就越热。
        - id: ch03-b07
          speaker: narrator
          text: 彼得穿着厚厚的灰外衣，雷迪穿着厚厚的红外衣，两个人渐渐热得受不了。彼得已经跳不了刚出发时那么远。雷迪口渴得伸出了舌头。他们见比利落在后面，也觉得不用再那么拼命了。
        - id: ch03-b08
          speaker: narrator
          text: 彼得最先跑到池塘边。他答应参赛时，压根儿没想起这里还有水。他猛地停住，用后腿坐起来。对岸的大山核桃树看得一清二楚，好像近在眼前，却又远在天边。
        - id: ch03-b09
          speaker: narrator
          text: 彼得知道，自己得绕过这片长长的池塘，回来时还要再绕一遍。那可真是好远好远的路。没过多久，雷迪也从灌木丛里冲了出来，心里和彼得一样沮丧。
        - id: ch03-b10
          speaker: narrator
          text: 很远很远的后面，比利正舒舒服服地小跑，还在暗自偷笑。彼得沮丧地望着雷迪，雷迪也沮丧地望着彼得。接着，他们一起望向比利，这才想起，比利可以径直游过池塘。
        - id: ch03-b11
          speaker: narrator
          text: 彼得赶紧朝池塘的一边飞奔，雷迪也从另一边绕了过去。两个人急得什么都顾不上，谁也没听见水里那轻轻的一响。
        - id: ch03-b12
          speaker: narrator
          text: 那是斑斑松开雷迪的尾巴，游进了池塘。别看他走得慢，游水的本领可高明极了。他只把黑色的小鼻子露出水面一两次，换了换气，其余时候全在水下向前游。
        - id: ch03-b13
          speaker: narrator
          text: 除了欢乐小风们，谁也没看见斑斑。他径直到了对岸，就在大山核桃树下面爬上了岸。
    - id: ch04
      title: 消失的山核桃
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 树下只剩三颗山核桃。斑斑把两颗搬到池塘边，埋进泥里。他把最后一颗衔在嘴中，又向池塘对岸游去。
        - id: ch04-b02
          speaker: narrator
          text: 斑斑刚刚上岸，比利就慢悠悠地跑来了。比利没有看见他，只顾盯着彼得和雷迪。那两个家伙才各自绕过半个池塘。
        - id: ch04-b03
          speaker: narrator
          text: 比利扑通一声跳进水里。哎呀，清凉的池水可真舒服！他觉得自己不用再着急，冠军已经稳稳到手，便一圈又一圈地游起来，还追着几条小鱼玩，在水里过得快活极了。
        - id: ch04-b04
          speaker: narrator
          text: 过了一会儿，他抬头一看，彼得从一边快要绕过来了，雷迪从另一边也快要绕过来了。他们俩又累又热，满脸泄气。比利这才慢慢游过池塘，在大山核桃树下爬上岸。
        - id: ch04-b05
          speaker: narrator
          text: 可是，山核桃上哪儿去了？比利怎么找也找不到一颗。欢乐小风们明明说过，树下有三颗呀。他一会儿跑到这边，一会儿跑到那边，翻了一层又一层落叶，又往细枝和碎树皮下面仔细看。
        - id: ch04-b06
          speaker: narrator
          text: 等彼得和雷迪赶到，比利还在四处寻找。他们俩也立刻翻起落叶和树皮，用爪子扒拉草丛。他们找遍每个角落和每条缝隙，也看过细枝和碎树皮下面。可一颗山核桃也没有。
        - id: ch04-b07
          speaker: narrator
          text: 三个人又累、又烦、又热，都指责比利把果子藏了起来。比利坚决说，自己既没有藏，也没有找到。彼得和雷迪见他找得那么卖力，也就信了。
        - id: ch04-b08
          speaker: narrator
          text: 他们找呀找呀，找了整整一个下午。同一个下午，斑斑始终把那颗山核桃衔在嘴里，一点一点，慢得不能再慢地爬过绿草地，沿着最直的路一路朝老胡桃树前进。
        - id: ch04-b09
          speaker: narrator
          text: 圆圆的、红红的太阳先生已经快要落到紫山那边了。他每天晚上都去那里睡觉。等在老胡桃树下的小家伙们也准备回家了。他们猜来猜去，怎么也想不出参赛者究竟出了什么事。
        - id: ch04-b10
          speaker: narrator
          text: 这时，松鸦萨米看见欢乐小风们正一路舞过绿草地。
        - id: ch04-b11
          speaker: sammy_jay
          text: 欢乐小风们回来啦！他们一定知道谁赢了！
    - id: ch05
      title: 斑斑赢了赛跑
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 欢乐小风们一飞到老胡桃树下，草地上的小家伙便从四面八方挤过来，把他们团团围住。可小风们只是笑呀笑呀，一句话也不肯说。
        - id: ch05-b02
          speaker: narrator
          text: 忽然，斑斑从高高的草丛里爬了出来，把山核桃放在年迈的青蛙爷爷脚边。青蛙爷爷惊讶得不得了，竟让一只绿头大苍蝇嗡嗡地从鼻尖前飞了过去。
        - id: ch05-b03
          speaker: grandfather_frog
          text: 斑斑，这颗山核桃是从哪儿来的？
          emotion: surprised
        - id: ch05-b04
          speaker: spotty_turtle
          text: 我从绿草地另一头的小山上拿来的，就在那棵大山核桃树下面。
        - id: ch05-b05
          speakers: [breeze_1, breeze_2, breeze_3, breeze_4]
          ensemble: chorus
          text: 没错！没错！斑斑赢了赛跑！
          emotion: happy
        - id: ch05-b06
          speaker: narrator
          text: 接着，欢乐小风们把一切都讲了出来。斑斑先咬住雷迪的尾巴尖，一路到达池塘。他游到对岸，把另外两颗山核桃藏好，再衔着最后一颗耐心地爬回家。
        - id: ch05-b07
          speaker: narrator
          text: 可水貂比利、狐狸雷迪和兔子彼得呢？他们还守在山核桃树下，找呀找呀，寻找那些永远也找不到的果子。
        - id: ch05-b08
          speaker: narrator
          text: 就这样，乌龟斑斑赢得了这场赛跑。直到今天，兔子彼得、狐狸雷迪和水貂比利只要看见山核桃，心里就难受得不得了。
