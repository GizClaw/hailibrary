  chapters:
    - id: ch01
      title: CHAPTER IX PETER RABBIT PLAYS A JOKE
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: One morning, big round Mr. Sun was climbing into the sky. Old Mother West Wind had sent all her Merry Little Breezes out to play in the Green Meadows, and Johnny Chuck was starting off for a walk. Before he went anywhere, he sat up very straight and searched all around for Reddy Fox. Reddy liked to tease him, you know.
        - id: ch01-b02
          speaker: narrator
          text: Reddy Fox was nowhere in sight, so Johnny trotted down the Lone Little Path toward the wood. Mr. Sun shone as brightly as he could. Johnny Chuck was very, very fat, and soon he felt very, very warm. At last, he sat on the end of a log beneath a big tree to rest.
        - id: ch01-b03
          speaker: narrator
          text: Thump! Something struck the top of Johnny's round little head, and he jumped.
        - id: ch01-b04
          speaker: happy_jack_squirrel
          text: Hello down there, Johnny Chuck!
        - id: ch01-b05
          speaker: narrator
          text: The voice seemed to come straight out of the sky. Johnny tipped his head far back and looked up. Just then, Happy Jack Squirrel dropped a nut. Down it fell, right onto the tip of Johnny's funny little black nose.
        - id: ch01-b06
          speaker: johnny_chuck
          text: Oh!
          emotion: surprised
        - id: ch01-b07
          speaker: narrator
          text: Johnny tumbled backward off the log. But he was so round, so fat, and so roly-poly that the fall did not hurt him at all.
        - id: ch01-b08
          speaker: happy_jack_squirrel
          text: Ha, ha, ha!
          emotion: happy
        - id: ch01-b09
          speaker: johnny_chuck
          text: Ha, ha, ha!
          emotion: happy
        - id: ch01-b10
          speaker: narrator
          text: Johnny picked himself up, laughing just as hard as Happy Jack. First the nut had bumped his head, then another had landed on his nose, and then he had rolled right off the log without being hurt. They both thought it was a very good joke.
        - id: ch01-b11
          speakers: [happy_jack_squirrel, johnny_chuck]
          ensemble: duo
          text: Ha, ha, ha!
          emotion: happy
        - id: ch01-b12
          speaker: peter_rabbit
          text: What are you two laughing about?
        - id: ch01-b13
          speaker: narrator
          text: The voice was so close that Johnny rolled over three times in surprise. It was Peter Rabbit.
        - id: ch01-b14
          speaker: peter_rabbit
          text: Johnny Chuck, what are you doing here in my wood?
        - id: ch01-b15
          speaker: johnny_chuck
          text: I'm out for a walk.
        - id: ch01-b16
          speaker: peter_rabbit
          text: Good! Then I'll go with you.
        - id: ch01-b17
          speaker: narrator
          text: Johnny Chuck and Peter Rabbit set off together along the Lone Little Path through the wood. Peter bounded ahead in great big jumps. His legs were long and made for jumping. Johnny hurried after him and tried very hard to keep up, but his own legs were short. Soon Peter was far ahead. Then he came softly back and leaned close to whisper in Johnny's ear.
        - id: ch01-b18
          speaker: peter_rabbit
          text: I've discovered something.
        - id: ch01-b19
          speaker: johnny_chuck
          text: What did you find?
        - id: ch01-b20
          speaker: peter_rabbit
          text: Come with me and I'll show you. But you have to be very still. Don't make even the tiniest sound.
        - id: ch01-b21
          speaker: narrator
          text: Johnny promised to stay very, very still and not make a sound. He wanted more than anything to see Peter's discovery. Peter tiptoed down the Lone Little Path through the wood, with his funny long ears pointing straight up toward the sky. Johnny tiptoed right behind him, wondering and wondering what Peter could possibly have found.
        - id: ch01-b22
          speaker: narrator
          text: Soon they reached a fine mossy green log lying all the way across the Lone Little Path. Peter stopped and sat up very straight. He looked one way, then the other. Johnny stopped too. He sat just as straight and looked both ways, exactly as Peter had. Still, the only thing he could see was the mossy green log across the path.
        - id: ch01-b23
          speaker: johnny_chuck
          text: Peter, what is it?
        - id: ch01-b24
          speaker: peter_rabbit
          text: You can't see it from here. First, we have to get over this mossy green log. Watch me jump, then do it just the way I do. Once you're over, you'll see what I found.
        - id: ch01-b25
          speaker: narrator
          text: Peter went first. With those long legs that were made for jumping, he sailed far, far over the mossy green log. He landed safely on the other side, turned around, and sat up. Now he was ready to watch Johnny jump over it too.
        - id: ch01-b26
          speaker: narrator
          text: Johnny tried to jump just as high and far as Peter had. But Johnny's short legs were not made for jumping, and Johnny himself was very, very fat. He tried as hard as he could. Still, his toes caught the top of the log. Over he tumbled, headfirst, and landed with a tremendous thump right on Reddy Fox, who was fast asleep on the other side.
        - id: ch01-b27
          speaker: narrator
          text: Peter laughed and laughed until he had to hold his sides.
        - id: ch01-b28
          speaker: peter_rabbit
          text: Ha, ha, ha!
          emotion: happy
        - id: ch01-b29
          speaker: narrator
          text: How frightened Johnny was when he saw what he had done! Before he could even stand, he rolled behind a little bush and lay there very, very still.
        - id: ch01-b30
          speaker: narrator
          text: Reddy Fox woke with a grunt when Johnny landed on him so hard. The first thing he saw was Peter laughing and holding his sides. Reddy did not stop to look around, so he never saw Johnny hiding behind the bush. He thought Peter was the one who had jumped on him. Reddy sprang to his feet, and Peter ran. Away they went, with Reddy racing after Peter.
        - id: ch01-b31
          speaker: narrator
          text: Peter dodged behind the trees, leaped over the bushes, and darted this way and that as fast as he could. He was very much afraid of Reddy Fox. Reddy followed every turn, rushing behind the trees and over the bushes. But no matter how hard Reddy ran, he could not catch Peter.
        - id: ch01-b32
          speaker: narrator
          text: Before long, Peter reached Jimmy Skunk's house. He knew Jimmy was over in the pasture, so he popped inside. Now he was safe. The doorway was too small for Reddy to squeeze through.
        - id: ch01-b33
          speaker: narrator
          text: Reddy sat outside the little doorway and waited, but Peter did not come out. He waited and waited. At last, Reddy gave up and trotted all the way home, where old Mother Fox was waiting for him.
        - id: ch01-b34
          speaker: narrator
          text: All this time, Johnny Chuck had stayed very still behind the little bush. From there, he watched Reddy try and try to catch Peter. He saw Peter pop safely into Jimmy Skunk's house, and he kept watching until Reddy finally trotted away toward home.
        - id: ch01-b35
          speaker: narrator
          text: Only then did Johnny stand up. He carefully brushed his little coat until it was very clean. Then he trotted back up the Lone Little Path through the wood and onto his own dear little path across the Green Meadows. Old Mother West Wind's Merry Little Breezes were still playing there. Johnny kept going until he was safe once more in his own snug little house.
