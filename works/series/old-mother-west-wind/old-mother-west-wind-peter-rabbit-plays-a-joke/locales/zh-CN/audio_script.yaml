audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖亲切，带着轻快的讲故事感
        timbre: 清澈柔和
        pace: 舒展而富有变化
        pitch: 中音
    johnny_chuck:
      display_name: 土拨鼠约翰尼
      tts:
        delivery: 天真贪玩，情绪来得快也去得快
        timbre: 圆润稚气的童声
        pace: 稍快而有弹性
        pitch: 中高音
    happy_jack_squirrel:
      display_name: 松鼠快乐杰克
      tts:
        delivery: 快活顽皮，笑起来爽朗响亮
        timbre: 清脆明亮的少年声
        pace: 轻快
        pitch: 中高音
    peter_rabbit:
      display_name: 兔子彼得
      tts:
        delivery: 顽皮机灵，笑声爽朗
        timbre: 明亮清透的少年声
        pace: 轻快
        pitch: 中高音
  chapters:
    - id: ch01
      title: 从天上掉下来的坚果
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 一天早晨，圆滚滚的太阳先生正往天空上爬。西风妈妈把欢乐小风全送到绿草地上玩耍以后，土拨鼠约翰尼也出门散步了。他先直起身子，仔仔细细朝四周看了一圈，生怕狐狸雷迪躲在附近。雷迪总爱捉弄他，他当然得当心。
        - id: ch01-b02
          speaker: narrator
          text: 可是，到处都不见雷迪的影子。约翰尼这才放心，沿着孤独小径一溜小跑进了树林。太阳先生把浑身的光都使出来，照得格外明亮。胖乎乎、圆滚滚的约翰尼没走多久，就热得不得了。他找了棵大树，在树下那根倒木的一头坐下来歇息。
        - id: ch01-b03
          speaker: narrator
          text: 咚！一样东西正中他圆圆的脑袋顶，吓得他猛地跳了起来。这时，一个声音仿佛从天上落了下来。
        - id: ch01-b04
          speaker: happy_jack_squirrel
          text: 土拨鼠约翰尼，你好呀！
        - id: ch01-b05
          speaker: narrator
          text: 约翰尼把脑袋使劲往后仰，抬头向上看。他看得正是时候，只见树上的松鼠快乐杰克丢下一颗坚果。坚果一路直落下来，不偏不倚，又砸中了约翰尼滑稽的黑色小鼻尖。
        - id: ch01-b06
          speaker: johnny_chuck
          text: 哎哟！
          emotion: surprised
        - id: ch01-b07
          speaker: narrator
          text: 约翰尼仰面滚下倒木。好在他又圆又胖，活像一只皮球，这一跤一点儿也不疼。
        - id: ch01-b08
          speaker: happy_jack_squirrel
          text: 哈！哈！哈！
          emotion: happy
        - id: ch01-b09
          speaker: johnny_chuck
          text: 哈！哈！哈！
          emotion: happy
        - id: ch01-b10
          speaker: narrator
          text: 约翰尼一边从地上爬起来，一边也哈哈大笑。他和树上的快乐杰克一齐笑个不停。两个人都觉得，这个玩笑真是太有趣了。
    - id: ch02
      title: 彼得发现了什么
      blocks:
        - id: ch02-b01
          speaker: peter_rabbit
          text: 你们在笑什么呢？
        - id: ch02-b02
          speaker: narrator
          text: 这声音就在约翰尼身旁，惊得他连打了三个滚。原来是兔子彼得。
        - id: ch02-b03
          speaker: peter_rabbit
          text: 你跑到我的树林里来做什么？
        - id: ch02-b04
          speaker: johnny_chuck
          text: 我就是出来走一走。
        - id: ch02-b05
          speaker: peter_rabbit
          text: 好啊，那我也和你一起走。
        - id: ch02-b06
          speaker: narrator
          text: 于是，两个伙伴沿着孤独小径穿过树林。彼得蹦蹦跳跳地走在前面。他腿长，天生善跳，每一下都蹦得老远。约翰尼的小短腿使足了劲，也追不上他。过了一会儿，彼得轻手轻脚地折回来，贴近约翰尼的耳朵，低声告诉他一件事。
        - id: ch02-b07
          speaker: peter_rabbit
          text: 我刚刚发现了一样东西。
        - id: ch02-b08
          speaker: johnny_chuck
          text: 什么东西？
        - id: ch02-b09
          speaker: peter_rabbit
          text: 我带你去看。不过你得悄悄的，一点儿声音也别出。
        - id: ch02-b10
          speaker: narrator
          text: 约翰尼马上答应，一定会安安静静。他实在太想看看彼得发现的东西。彼得踮着脚尖，沿着林中的孤独小径悄悄往前走，两只滑稽的长耳朵直指天空。约翰尼也踮起脚，紧紧跟在彼得后面。他一路猜呀猜，可怎么也猜不出，那到底会是什么。
        - id: ch02-b11
          speaker: narrator
          text: 没多久，他们来到一根横在孤独小径上的倒木前。木头长满绿色苔藓，模样十分漂亮。彼得停住脚，直挺挺地坐起来，这边瞧瞧，那边瞧瞧。约翰尼也停下，照彼得的样子直起身子，朝两边仔细看。可是，他看来看去，只看见了那根横在小径上的绿苔木头。
        - id: ch02-b12
          speaker: johnny_chuck
          text: 彼得，你说的东西到底在哪儿？
        - id: ch02-b13
          speaker: peter_rabbit
          text: 现在还看不见。咱们得先跳过这根木头。我先跳，你照着我的样子来。等你跳过去，就能看见了。
    - id: ch03
      title: 木头另一边的玩笑
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 彼得先跳了过去。他的长腿天生就是用来跳的，轻轻一下，便远远越过了绿苔木头。落地以后，他转过身，直起身子坐好，专心等着约翰尼也从木头上跳过来。
        - id: ch03-b02
          speaker: narrator
          text: 约翰尼亲眼看过彼得怎么跳，也想照他的样子，跳得又高又远。可约翰尼的腿又短，又不是天生用来跳的，再加上他胖得很，实在不善于跳远。尽管他拼足了力气，脚趾还是绊上了木头顶。他顿时头朝下翻过去，咚的一声巨响，重重落在了狐狸雷迪身上。原来，雷迪一直躺在木头另一边，睡得正香。
        - id: ch03-b03
          speaker: narrator
          text: 彼得笑个没完，笑得只好用手捂住肚子。约翰尼看清自己闯下的祸，吓得不得了。他还没站起来，就顺势滚到一丛小灌木后面，躺在那里，一动也不敢动。
        - id: ch03-b04
          speaker: narrator
          text: 雷迪被约翰尼重重一砸，哼了一声醒过来。他睁眼先看见彼得捂着肚子大笑，根本没停下来朝四处看看，便认定跳到自己身上的就是彼得。雷迪一下蹿起来，彼得拔腿便跑，雷迪也跟着追了出去，紧紧赶在彼得后面。
    - id: ch04
      title: 谁笑到了最后
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 彼得本来就很怕狐狸雷迪。他一会儿闪到一棵棵树后，一会儿跳过一丛丛灌木，忽左忽右，拼了命地逃。雷迪也始终跟着他绕树越过灌木，左追右赶，可就是捉不住他。
        - id: ch04-b02
          speaker: narrator
          text: 没过多久，彼得跑到了臭鼬吉米家。他知道吉米正在牧场那边，便一头钻进屋里。这下安全了，因为吉米家的门太小，雷迪根本挤不进去。雷迪坐在门外等了又等，彼得始终没有出来。最后，他只好放弃，小跑着回家去找等着他的狐狸妈妈。
        - id: ch04-b03
          speaker: narrator
          text: 从头到尾，约翰尼都一动不动地藏在小灌木后面，看着雷迪一次又一次想捉住彼得。等他亲眼看见彼得钻进臭鼬吉米家，又看见狐狸雷迪放弃等待，小跑着回了家，这才从藏身的地方站起身，把自己的小外套仔仔细细掸得干干净净。
        - id: ch04-b04
          speaker: narrator
          text: 随后，约翰尼沿着林中的孤独小径往回走。他一路小跑，回到绿草地上那条属于自己的亲爱小径。西风妈妈的欢乐小风还在那里快活地玩耍。约翰尼继续向前，终于又平平安安地回到了自己温暖舒适的小屋。
