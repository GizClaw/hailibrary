audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 亲切而略带调侃的讲述
        timbre: 温暖清亮
        pace: 舒缓而有变化
        pitch: 中音
    peter_rabbit:
      display_name: 小兔彼得
      tts:
        delivery: 好奇活泼，心思全写在语气里
        timbre: 清亮稚嫩
        pace: 轻快
        pitch: 中高音
    danny_meadow_mouse:
      display_name: 草地鼠丹尼
      tts:
        delivery: 年轻直率，闹别扭时语气生硬
        timbre: 轻细明亮
        pace: 稍快
        pitch: 中高音
  chapters:
    - id: ch01
      title: 荆棘丛边的动静
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 小兔彼得躲在亲爱的老荆棘丛里，坐在最隐秘的藏身处。他一条长长的后腿肿得厉害。细铁丝仍旧紧紧勒着，已经陷进肉里，疼得他难以忍受。
        - id: ch01-b02
          speaker: narrator
          text: 彼得听见农夫布朗的儿子在荆棘丛边走来走去，还不时停下来摆弄什么。腿上虽然疼，彼得还是忍不住好奇。最后，他叫来了田鼠丹尼。
        - id: ch01-b03
          speaker: peter_rabbit
          text: 丹尼，你个头小，躲起来比我容易。你尽量走近一点，看看农夫布朗的儿子究竟在干什么。不过，千万别勉强自己走得太近。
        - id: ch01-b04
          speaker: narrator
          text: 丹尼悄悄溜出去，走到自己敢去的最近处。他盯着农夫布朗的儿子看了又看，怎么也猜不透那人在忙什么。过了一会儿，丹尼回到了彼得身边。
    - id: ch02
      title: 每条小路都有圈套
      blocks:
        - id: ch02-b01
          speaker: danny_meadow_mouse
          text: 彼得，我没看明白他在做什么。不过，从绿草原进来的每一条隐秘小路上，他都放了东西。
        - id: ch02-b02
          speaker: peter_rabbit
          text: 哈，我明白了！
        - id: ch02-b03
          speaker: danny_meadow_mouse
          text: 那是一个个小圈，跟挂在你腿上的怪东西一模一样。
        - id: ch02-b04
          speaker: peter_rabbit
          text: 果然是这样！
        - id: ch02-b05
          speaker: danny_meadow_mouse
          text: 他还在那些小圈周围放了卷心菜叶和苹果块。
        - id: ch02-b06
          speaker: peter_rabbit
          text: 那我们可得当心了！
    - id: ch03
      title: 丹尼解开铁丝
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 彼得的腿伤得很重，这些天受了不少罪，那根铁丝还不停往肉里勒。最糟的是，他根本不知道该怎样把它取下来。他试过用大门牙咬断铁丝，可怎么咬也不行。丹尼也啃了又啃，同样一点儿用都没有。
        - id: ch03-b02
          speaker: narrator
          text: 可丹尼不是轻易灰心的田鼠。他仍旧不停地啃。有一回，他觉得铁丝好像滑动了一点。丹尼没有出声，只管接着干。没多久，他确信铁丝真的松动了，就比先前啃得更加卖力。
        - id: ch03-b03
          speaker: narrator
          text: 终于，铁丝松得可以取下来了。丹尼把它从彼得腿上褪下，彼得竟然没有发觉。那个狠毒的圈套勒得太紧，彼得的腿除了疼，早已什么也感觉不到。直到丹尼把铁丝举到他眼前，他才知道自己已经自由了。
        - id: ch03-b04
          speaker: narrator
          text: 彼得心里别提多感激了，一遍又一遍地向丹尼道谢。
        - id: ch03-b05
          speaker: danny_meadow_mouse
          text: 这根本算不了什么，彼得，真的一点儿也不算。你一直待我这么好，还让我住进亲爱的老荆棘丛。我欠你的可比这多得多呢。
    - id: ch04
      title: 大饱口福
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 彼得过了很久才又能像从前那样蹦跳。不过，第一天过去以后，他已经可以四处走动了。这一走，他才发现农夫布朗的儿子真没漏掉一处。彼得的每一条隐秘小路上，都有那种可恶的铁丝圈套。
        - id: ch04-b02
          speaker: narrator
          text: 如今彼得知道圈套是什么了。他告诉丹尼，田鼠的个头这么小，可以安安全全地穿过那些圈套，把农夫布朗的儿子留下当诱饵的卷心菜叶和苹果全都偷走。
        - id: ch04-b03
          speaker: narrator
          text: 丹尼觉得，偷走诱饵不但好玩，还是跟农夫布朗的儿子开了一个天大的玩笑。于是他每天都去，把那些卷心菜叶和苹果带回来。彼得养伤的日子里，他们两个天天大饱口福。
        - id: ch04-b04
          speaker: narrator
          text: 农夫布朗的儿子却一直想呀想呀，怎么也想不明白，自己为什么就是捉不到小兔彼得。
