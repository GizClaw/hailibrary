audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm, observant storytelling
        timbre: clear and gentle
        pace: measured
        pitch: medium
    peter_rabbit:
      display_name: Peter Rabbit
      tts:
        delivery: quick, curious, and plainly expressive
        timbre: youthful and bright
        pace: lively
        pitch: medium-high
    danny_meadow_mouse:
      display_name: Danny Meadow Mouse
      tts:
        delivery: earnest, helpful, and quietly cheerful
        timbre: small and clear
        pace: quick
        pitch: high
  chapters:
    - id: ch01
      title: Peter Rabbit and Danny Meadow Mouse Live High
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Peter Rabbit sat in his most secret spot in the dear Old Briar-patch. One of his long hind legs was badly swollen and terribly sore. A thin wire was pulled tight around it and cutting into him.
        - id: ch01-b02
          speaker: narrator
          text: Along the edge of the Briar-patch, Peter could hear Farmer Brown's boy moving about. Every little while, the boy stopped to do something. Peter was hurting, but he was curious too. At last, he called Danny Meadow Mouse.
        - id: ch01-b03
          speaker: peter_rabbit
          text: Danny, you're small, so it's easier for you to stay hidden. Go as close to Farmer Brown's boy as you dare, and see what he's doing.
        - id: ch01-b04
          speaker: narrator
          text: Danny crept out until he was as close to Farmer Brown's boy as he dared to go. He watched and watched, trying to understand what the boy was doing. After a while, he went back to Peter.
        - id: ch01-b05
          speaker: danny_meadow_mouse
          text: I can't tell what he's doing, Peter. But he's putting something in every one of your little private paths from the Green Meadows.
        - id: ch01-b06
          speaker: peter_rabbit
          text: Ah! I see.
        - id: ch01-b07
          speaker: danny_meadow_mouse
          text: There are little loops made from that strange stuff hanging from your leg.
        - id: ch01-b08
          speaker: peter_rabbit
          text: That's just what I thought.
        - id: ch01-b09
          speaker: danny_meadow_mouse
          text: And he's scattered cabbage leaves and bits of apple all around them.
        - id: ch01-b10
          speaker: peter_rabbit
          text: Then we'll have to be careful!
        - id: ch01-b11
          speaker: narrator
          text: Peter's leg was in a very bad state, and the pain was awful. Worst of all, he had no idea how to remove the wire that was cutting him. Peter had tried to bite through it with his big teeth, but the wire wouldn't break. Danny had tried gnawing it too. He worked at it again and again, but nothing seemed to help.
        - id: ch01-b12
          speaker: narrator
          text: But Danny wasn't the sort to give up. He kept working at that stubborn wire. Then he thought he felt it move just a little. Danny didn't tell Peter. He simply went on gnawing. Soon he was certain the wire was slipping, and that made him work harder than ever.
        - id: ch01-b13
          speaker: narrator
          text: At last, the wire was loose enough for Danny to slip it right off Peter's leg. Peter didn't even notice. The cruel snare had been so tight that pain was the only feeling left in his leg. Peter understood what had happened only when Danny held the wire up in front of him.
        - id: ch01-b14
          speaker: narrator
          text: My, how thankful Peter was! He thanked Danny again and again for setting him free from that cruel snare.
        - id: ch01-b15
          speaker: danny_meadow_mouse
          text: It was nothing, Peter. Really, nothing at all. I owe you much more for being so good to me and letting me live in the dear Old Briar-patch.
        - id: ch01-b16
          speaker: narrator
          text: Peter couldn't hop in his usual way for a long time. Still, once the first day had passed, he could move around the Briar-patch. That was how he discovered those miserable wire snares in every one of his private little paths. Farmer Brown's boy hadn't missed a single path.
        - id: ch01-b17
          speaker: narrator
          text: Now Peter knew exactly what the snares were. He showed Danny that a mouse as small as he was could run safely among them and steal the cabbage leaves and apples that Farmer Brown's boy had left for bait.
        - id: ch01-b18
          speaker: narrator
          text: Danny thought stealing the bait was wonderful fun. Better still, it was a fine joke on Farmer Brown's boy. Danny did it every day, bringing away the cabbage leaves and apples. So he and Peter lived high while Peter's sore leg slowly healed.
        - id: ch01-b19
          speaker: narrator
          text: And all that time, Farmer Brown's boy kept wondering why he couldn't catch Peter Rabbit.
