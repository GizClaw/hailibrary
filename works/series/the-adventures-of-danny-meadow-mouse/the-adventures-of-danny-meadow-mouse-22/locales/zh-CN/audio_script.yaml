audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 亲切而略带调侃的讲述
        timbre: 温暖清亮
        pace: 舒缓而有变化
        pitch: 中音
    danny_meadow_mouse:
      display_name: 草地鼠丹尼
      tts:
        delivery: 年轻直率，闹别扭时语气生硬
        timbre: 轻细明亮
        pace: 稍快
        pitch: 中高音
  chapters:
    - id: ch01
      title: 穿过空地
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 丹尼一次次从危险里逃出来，早就习惯了。他从不会停下来，反复去想刚才有多惊险。这一回也是一样。
        - id: ch01-b02
          speaker: danny_meadow_mouse
          text: 一个人想同时朝两个方向看，准会什么也看不见。
        - id: ch01-b03
          speaker: narrator
          text: 丹尼很清楚，要是脑子里总装着已经发生的事，他就没法留心接下来可能出现的危险。
        - id: ch01-b04
          speaker: narrator
          text: 他沿着自己的秘密小路匆匆赶路，平安来到一大片草地边上。这里的草短得藏不住他，可他又非得穿过去不可。附近只要有谁，一眼就能把他看得清清楚楚。
        - id: ch01-b05
          speaker: narrator
          text: 丹尼小心地探出头，看看这边，又瞧瞧那边，还抬头望了望天空。哪儿都没有人影。他深深吸了一口气，冲进空地，两条短腿飞快地跑了起来。
    - id: ch02
      title: 红尾鹰追来了
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 可丹尼不知道，红尾鹰一直停在远处的一棵树上。他坐得一动不动，就像长在树上的一部分，难怪丹尼没有发现。
        - id: ch02-b02
          speaker: narrator
          text: 红尾鹰的眼睛却尖得很。丹尼才踏上空地，他隔着老远就看见了。红尾鹰满意地低笑一声，张开宽阔的翅膀，朝丹尼追过去。
        - id: ch02-b03
          speaker: narrator
          text: 丹尼跑到空地中间，离对面的高草还有一段路。他匆匆回头一看，一颗心差点儿蹦到嗓子眼儿。红尾鹰就在身后，那双可怕的利爪已经伸出来，马上就要抓到他了！
        - id: ch02-b04
          speaker: narrator
          text: 丹尼吓得尖叫起来。他觉得这次恐怕真要被捉住了，可还是不肯就这么放弃。前面三跳远的地方有个怪模怪样的东西。他不知道那是什么，只盼上面有个洞，好让自己躲进去骗过红尾鹰。
    - id: ch03
      title: 三跳之外的洞口
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 第一跳！来得及吗？第二跳！真的有个洞！第三跳！丹尼又吓得叫了一声，在最后一刻，一头扎进洞口。
        - id: ch03-b02
          speaker: narrator
          text: 你猜他钻进了什么？原来，那是一只旧番茄罐。农夫布朗的儿子有一次去微笑池塘钓鱼，拿它装过鱼饵，回家时把罐头掉在了这里。
        - id: ch03-b03
          speaker: narrator
          text: 红尾鹰本来认定，这回一定能捉住田鼠丹尼。眼看到嘴的晚餐逃了，他气得尖声大叫，两只巨爪狠狠砸在旧罐头上。
        - id: ch03-b04
          speaker: narrator
          text: 他想把罐头抓起来，可爪子怎么也使不上劲。每次刚一下爪，罐头就从旁边滚开。红尾鹰试了一回又一回，最后实在厌烦了，只好飞回原来那棵树上。
    - id: ch04
      title: 留在罐头里
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 罐头滚来滚去，丹尼当然怕得不得了。红尾鹰的爪子敲在这个古怪的藏身处，响声也把他吓得够呛。
        - id: ch04-b02
          speaker: narrator
          text: 不过，丹尼很聪明。他决定先不出去，就在里面多待一会儿。很快他就会知道，幸亏自己没有急着离开。
