audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm, observant storytelling
        timbre: clear and gentle
        pace: measured
        pitch: medium
    danny_meadow_mouse:
      display_name: Danny Meadow Mouse
      tts:
        delivery: quick, practical, and plainly expressive
        timbre: small and youthful
        pace: lively
        pitch: high
    redtail_the_hawk:
      display_name: Redtail the Hawk
      tts:
        delivery: sharp, watchful, and forceful
        timbre: strong and piercing
        pace: deliberate
        pitch: medium-high
  chapters:
    - id: ch01
      title: What Happened Next to Danny Meadow Mouse
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Danny was so used to narrow escapes that he never spent much time thinking about them. This time was no different.
        - id: ch01-b02
          speaker: danny_meadow_mouse
          text: If you try to look two ways at once, you're pretty sure to see nothing.
        - id: ch01-b03
          speaker: narrator
          text: Danny knew that thinking too much about what had already happened would keep him from watching closely for whatever might happen next.
        - id: ch01-b04
          speaker: narrator
          text: Nothing else happened as he hurried along his own little path. Then he reached a wide patch of very short grass. He couldn't hide beneath it, but he had to cross it. Anyone nearby would be able to see him the whole way.
        - id: ch01-b05
          speaker: narrator
          text: Danny carefully peeked out. He looked one way, then the other, and he remembered to check the sky. He couldn't see anyone anywhere. He took a long breath and raced into the open as fast as his short legs could carry him.
        - id: ch01-b06
          speaker: narrator
          text: All that time, Redtail the Hawk had been perched in a tree some distance away. He sat so still that he seemed to be part of the tree. That was why Danny hadn't spotted him.
        - id: ch01-b07
          speaker: narrator
          text: Redtail spotted Danny the moment he ran into the open. A hawk's keen eyes can see from very far away. Redtail gave a pleased chuckle, opened his broad wings, and flew after him.
        - id: ch01-b08
          speaker: narrator
          text: Danny was about halfway to the safe, long grass on the other side when he glanced back. His heart seemed to leap into his mouth. Redtail was right there, with his cruel claws already reaching to grab him.
        - id: ch01-b09
          speaker: danny_meadow_mouse
          text: Squeak!
          emotion: fearful
        - id: ch01-b10
          speaker: narrator
          text: Danny was sure he would be caught this time, but he wouldn't give up without trying to get away. Three jumps ahead stood a strange-looking object. He didn't know what it was. If it had a hole, though, he might still fool Redtail.
        - id: ch01-b11
          speaker: narrator
          text: One jump! Could he reach it? Two jumps! Yes, there was a hole! Three jumps! Danny squeaked again and dived through the opening just in time.
        - id: ch01-b12
          speaker: danny_meadow_mouse
          text: Squeak!
          emotion: fearful
        - id: ch01-b13
          speaker: narrator
          text: And what had he jumped into? It was an old tomato can. Farmer Brown's boy had once carried fishing bait in it when he went to the Smiling Pool, then dropped it on his way home.
        - id: ch01-b14
          speaker: redtail_the_hawk
          text: Screech!
          emotion: angry
        - id: ch01-b15
          speaker: narrator
          text: Redtail struck the old can with his great claws, furious and disappointed. He had been so certain he would catch Danny Meadow Mouse this time.
        - id: ch01-b16
          speaker: narrator
          text: He tried to lift the can, but he couldn't get a grip on it. Every time he tried, it rolled away. At last Redtail gave up in disgust and flew back to the tree where he had first seen Danny.
        - id: ch01-b17
          speaker: narrator
          text: Of course, Danny was terribly frightened when the can rolled and Redtail's claws crashed against his strange hiding place. Still, he wisely decided that staying inside for a while was the best thing to do.
        - id: ch01-b18
          speaker: narrator
          text: Very soon, Danny would discover just how fortunate that decision had been.
