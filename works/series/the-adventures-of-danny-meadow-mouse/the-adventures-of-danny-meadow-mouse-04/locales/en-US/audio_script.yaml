audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm, observant storytelling
        timbre: clear and gentle
        pace: measured
        pitch: medium
    danny_meadow_mouse:
      display_name: Danny Meadow Mouse
      tts:
        delivery: youthful and plainly expressive
        timbre: small and bright
        pace: lively
        pitch: medium-high
    reddy_fox:
      display_name: Reddy Fox
      tts:
        delivery: sly and quick, with flashes of impatience
        timbre: sharp and youthful
        pace: brisk
        pitch: medium
    granny_fox:
      display_name: Granny Fox
      tts:
        delivery: shrewd and confidently deliberate
        timbre: dry and seasoned
        pace: unhurried
        pitch: medium-low
  chapters:
    - id: ch01
      title: Old Granny Fox Tries for Danny Meadow Mouse
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Danny Meadow Mouse hadn't had so much fun in a long time. All afternoon, he chuckled whenever he thought about that game of hide-and-seek. Reddy Fox had been it, of course. He had stayed it from beginning to end because he never once caught Danny. If he had caught him, there would be no more stories about Danny Meadow Mouse. There would be no Danny Meadow Mouse at all.
        - id: ch01-b02
          speaker: narrator
          text: Danny didn't let himself dwell on that. The danger had only made the game more exciting. He would dive through one of his little round doorways in the snow, race along one of his own tunnels, and peek out through another doorway. From there, he watched Reddy digging furiously at the entrance Danny had just left.
        - id: ch01-b03
          speaker: narrator
          text: At last, Reddy gave up in disgust. He stalked away, muttering angrily as he went to look for something else to eat. Danny sat up on the snow and watched him leave. Then, in his funny little squeaky voice, he called after him.
        - id: ch01-b04
          speaker: danny_meadow_mouse
          text: Though Reddy Fox is smart and sly, hi-hum-diddle-de-o! I'm just as smart and twice as spry, hi-hum-diddle-de-o!
          emotion: happy
        - id: ch01-b05
          speaker: narrator
          text: That night, Reddy told old Granny Fox how he had tried to catch Danny. Granny listened with her head tipped to one side. When Reddy described how fat Danny was, her mouth began to water. Snow covered the Green Meadows and the Green Forest now, so both foxes had a hard time finding enough food. Most of the time, they were hungry.
        - id: ch01-b06
          speaker: granny_fox
          text: Tomorrow morning, I'll go down to the meadows with you. Then we'll find out whether Danny Meadow Mouse is really as clever as he thinks.
        - id: ch01-b07
          speaker: narrator
          text: Bright and early the next morning, Granny Fox and Reddy Fox went down to the meadows where Danny lived. Danny had felt in his bones that Reddy would return, so he was already keeping watch. He spotted them the moment they came out of the Green Forest.
        - id: ch01-b08
          speaker: narrator
          text: When Danny saw Granny, his heart began to beat a little faster. He knew how smart and wise she was. She had learned nearly all the tricks used by the other little people of the meadows and the forest.
        - id: ch01-b09
          speaker: danny_meadow_mouse
          text: This game will be even more exciting than the last one.
        - id: ch01-b10
          speaker: narrator
          text: Danny hurried down out of sight. He checked every one of his little tunnels to make sure the way was clear, so he could race through them if he needed to. Then he peeked from a small doorway hidden inside a clump of tall grass.
        - id: ch01-b11
          speaker: narrator
          text: Granny sent Reddy to search for Danny's little round doorways. Each time he found one, she came over and sniffed it. Her nose could tell which doorway Danny had used most recently.
        - id: ch01-b12
          speaker: narrator
          text: At last, Granny headed straight for the tall clump of grass. Danny ducked down and dashed into one of his little tunnels. Behind him, he heard Granny sniffing at the doorway he had just left.
        - id: ch01-b13
          speaker: narrator
          text: All at once, something plunged through the snow right at Danny's heels. He didn't need to turn around. He knew it was Granny Fox herself.
        - id: ch01-b14
          speaker: narrator
          text: Danny squeaked with fright.
