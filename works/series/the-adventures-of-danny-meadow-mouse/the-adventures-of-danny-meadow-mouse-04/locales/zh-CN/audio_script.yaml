audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 亲切而略带调侃的讲述
        timbre: 温暖清亮
        pace: 舒缓而有变化
        pitch: 中音
    danny_meadow_mouse:
      display_name: 草地鼠丹尼
      tts:
        delivery: 年轻直率，闹别扭时语气生硬
        timbre: 轻细明亮
        pace: 稍快
        pitch: 中高音
    granny_fox:
      display_name: 老狐狸奶奶
      tts:
        delivery: 老练沉着，盘算时胸有成竹
        timbre: 低沉略带沙哑
        pace: 从容
        pitch: 中低音
  chapters:
    - id: ch01
      title: 第四章　老狐狸奶奶要捉草地鼠丹尼
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 草地鼠丹尼已经很久没有这么快活了。这场捉迷藏，让他整个下午一想起来就咯咯直笑。当然，负责捉人的“鬼”一直是狐狸雷迪。因为从头到尾，他一次也没抓到丹尼。
        - id: ch01-b02
          speaker: narrator
          text: 要是雷迪真抓到了呢？那往后就没有丹尼的故事了。因为世上也不会再有草地鼠丹尼。
        - id: ch01-b03
          speaker: narrator
          text: 可丹尼从来不去想这个。游戏越危险，他反倒玩得越起劲。他钻进雪地里一扇圆门，顺着自己的小地道跑开，再从另一扇门探出头来。雷迪呢，还在刚才那扇门口拼命刨雪。这可把丹尼乐坏了。
        - id: ch01-b04
          speaker: narrator
          text: 最后，雷迪实在受够了。他只得放弃，气呼呼地嘟囔着走开，另外找晚餐去了。丹尼蹲坐在雪地上，看着他越走越远，便用尖细的小嗓门高声唱起来。
        - id: ch01-b05
          speaker: danny_meadow_mouse
          text: 狐狸雷迪又精又滑，嗨哼嘀哩嘀哩哟！我一样聪明，灵快胜他两倍呀。嗨哼嘀哩嘀哩哟！
          emotion: happy
        - id: ch01-b06
          speaker: narrator
          text: 当天晚上，雷迪把自己怎么捉丹尼、又怎么没捉到，全都讲给老狐狸奶奶听。奶奶歪着脑袋，一声不响地听着。等雷迪说到丹尼有多肥，她馋得口水都流了出来。
        - id: ch01-b07
          speaker: narrator
          text: 这时候，大雪盖住了绿草地，也盖住了绿森林。狐狸奶奶和雷迪想找够吃的可不容易，肚子大半时候都是空的。
        - id: ch01-b08
          speaker: granny_fox
          text: 明天早晨，我跟你一起到草地去。到时候再看看，丹尼是不是真有他自己想的那么聪明。
        - id: ch01-b09
          speaker: narrator
          text: 第二天天一亮，狐狸奶奶和雷迪就下到丹尼居住的草地上。丹尼早有预感，知道雷迪会回来，所以早早守着，一直留心望着。他们才走出绿森林，丹尼就发现了。
        - id: ch01-b10
          speaker: narrator
          text: 一看见老狐狸奶奶，丹尼的心跳得快了一点。他知道，这位奶奶聪明又有见识。草地和森林里的小居民会使什么招数，她差不多都学会了。
        - id: ch01-b11
          speaker: danny_meadow_mouse
          text: 这一回的游戏，肯定比上一次更惊险。
        - id: ch01-b12
          speaker: narrator
          text: 丹尼赶快窜进雪下，身影一下就从雪面上消失了。他把所有小地道都查看一遍，得保证条条都畅通。万一非逃不可，他才能在里面飞快穿过。检查完，丹尼从一扇藏在高高草丛里的小门探出头来。
        - id: ch01-b13
          speaker: narrator
          text: 狐狸奶奶让雷迪去找那些圆圆的小门。雷迪每找到一扇，她马上就走过去闻一闻。她知道，单凭气味，就能找出丹尼最后到过哪一扇门。
        - id: ch01-b14
          speaker: narrator
          text: 终于，狐狸奶奶直奔那一大丛高草。丹尼立刻缩回头，沿着一条小地道飞跑。他听见奶奶正在嗅自己刚离开的那扇门。
        - id: ch01-b15
          speaker: narrator
          text: 突然，有个东西从雪上猛扎下来，就落在丹尼脚后跟旁边！不用回头，他也知道，扑下来的正是狐狸奶奶本人。丹尼吓得尖叫了一声。
