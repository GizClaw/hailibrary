audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm, observant storytelling
        timbre: clear and gentle
        pace: measured
        pitch: medium
    danny_meadow_mouse:
      display_name: Danny Meadow Mouse
      tts:
        delivery: youthful and plainly expressive
        timbre: small and bright
        pace: lively
        pitch: medium-high
    mr_toad:
      display_name: Mr. Toad
      tts:
        delivery: kindly, shrewd, and good-humored
        timbre: rough and rounded
        pace: unhurried
        pitch: medium-low
  chapters:
    - id: ch01
      title: Danny Hides His Tail
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: "Danny Meadow Mouse could think of only one thing: his short tail. He felt so ashamed of it that whenever anyone came by, he crept out of sight. He didn't want them to see just how short it was."
        - id: ch01-b02
          speaker: narrator
          text: Danny used to play in the sunshine. Now he sat around and sulked instead. Before long, his friends stopped waiting for him. They simply passed on by.
        - id: ch01-b03
          speaker: narrator
          text: Then one day, old Mr. Toad sat down in front of Danny and started asking questions.
        - id: ch01-b04
          speaker: mr_toad
          text: What's troubling you, Danny?
        - id: ch01-b05
          speaker: danny_meadow_mouse
          text: Nothing.
        - id: ch01-b06
          speaker: mr_toad
          text: I don't suppose anything is really wrong. But what do you think is wrong?
    - id: ch02
      title: Mr. Toad Asks Questions
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: Danny squirmed. Mr. Toad looked up at the jolly, round, red Mr. Sun and gave him a wink.
        - id: ch02-b02
          speaker: mr_toad
          text: The sun is shining as brightly as ever, isn't it?
        - id: ch02-b03
          speaker: danny_meadow_mouse
          text: Yes.
        - id: ch02-b04
          speaker: mr_toad
          text: And you have plenty to eat and drink, don't you?
        - id: ch02-b05
          speaker: danny_meadow_mouse
          text: Yes.
        - id: ch02-b06
          speaker: narrator
          text: Mr. Toad studied Danny from head to foot.
        - id: ch02-b07
          speaker: mr_toad
          text: That suit of clothes you're wearing looks very fine to me. You have sunny weather, all the food and drink you need, and good clothes too. Danny Meadow Mouse, you simply don't know how well off you are.
        - id: ch02-b08
          speaker: narrator
          text: Danny lowered his head. At last he looked up and saw a kindly twinkle in Mr. Toad's eyes.
        - id: ch02-b09
          speaker: danny_meadow_mouse
          text: Mr. Toad, how can I grow a long tail like my cousin Whitefoot in the Green Forest?
        - id: ch02-b10
          speaker: mr_toad
          text: So that's the trouble! Ha, ha, ha! Danny Meadow Mouse, I'm ashamed of you. I truly am! What good would a long tail do you? Tell me that.
          emotion: surprised
    - id: ch03
      title: Just as He Is
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: For a moment, Danny had no answer. Then he tried to explain.
        - id: ch03-b02
          speaker: danny_meadow_mouse
          text: I—I—I think I'd look much better with a long tail.
        - id: ch03-b03
          speaker: narrator
          text: Old Mr. Toad only laughed.
        - id: ch03-b04
          speaker: mr_toad
          text: Have you ever seen a Meadow Mouse with a long tail? Of course you haven't. What a sight that would be! Everyone on the Green Meadows would laugh until they were sick.
        - id: ch03-b05
          speaker: mr_toad
          text: You have to be slim, trim, and handsome to carry a long tail well. And think what a bother it would be. You'd always be worrying about that tail and trying to keep it safe.
        - id: ch03-b06
          speaker: mr_toad
          text: Now look at me. I'm homely. Some folks even say I'm ugly. But nobody tries to catch me for my fine coat, the way Farmer Brown's boy chases Billy Mink. And nobody wants to put me in a cage for my beautiful voice.
        - id: ch03-b07
          speaker: mr_toad
          text: I'm satisfied to be exactly as I am. Take my advice, Danny Meadow Mouse. Be satisfied to be exactly as you are too.
        - id: ch03-b08
          speaker: narrator
          text: Danny thought about that for a little while.
        - id: ch03-b09
          speaker: danny_meadow_mouse
          text: Perhaps you're right. I'll try.
