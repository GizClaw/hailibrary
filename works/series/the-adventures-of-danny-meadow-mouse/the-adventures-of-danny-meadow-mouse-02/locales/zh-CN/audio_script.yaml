audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 亲切而略带调侃的讲述
        timbre: 温暖清亮
        pace: 舒缓而有变化
        pitch: 中音
    danny_meadow_mouse:
      display_name: 草地鼠丹尼
      tts:
        delivery: 年轻直率，闹别扭时语气生硬
        timbre: 轻细明亮
        pace: 稍快
        pitch: 中高音
    old_mr_toad:
      display_name: 老蟾蜍先生
      tts:
        delivery: 老练风趣，劝说时亲切而直率
        timbre: 粗厚温暖
        pace: 从容
        pitch: 中低音
  chapters:
    - id: ch01
      title: 第二章　草地鼠丹尼和他的短尾巴
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 草地鼠丹尼脑子里转来转去，全是自己的短尾巴。他越想越觉得丢脸。只要有人经过，他就赶紧躲起来，不让人家看见自己的尾巴有多短。从前，他总爱在阳光下玩耍。如今呢，他只坐在那里生闷气。渐渐地，朋友们路过也不停下了。终于有一天，老蟾蜍先生来到丹尼面前坐下，开口问他。
        - id: ch01-b02
          speaker: old_mr_toad
          text: 丹尼，你这是怎么了？
        - id: ch01-b03
          speaker: danny_meadow_mouse
          text: 我没怎么。
        - id: ch01-b04
          speaker: old_mr_toad
          text: 嗯，我想你确实没什么事。可你自己觉得，是什么地方不对劲呢？
        - id: ch01-b05
          speaker: narrator
          text: 丹尼不安地动来动去。老蟾蜍先生抬头看看那位快活、滚圆、红彤彤的太阳先生，还朝他眨了眨眼。
        - id: ch01-b06
          speaker: old_mr_toad
          text: 你瞧，太阳不是还跟平常一样亮吗？
        - id: ch01-b07
          speaker: danny_meadow_mouse
          text: 是啊。
        - id: ch01-b08
          speaker: old_mr_toad
          text: 那你也不缺吃的喝的吧？
        - id: ch01-b09
          speaker: danny_meadow_mouse
          text: 不缺。
        - id: ch01-b10
          speaker: narrator
          text: 老蟾蜍先生从头到脚，仔仔细细地打量着丹尼。
        - id: ch01-b11
          speaker: old_mr_toad
          text: 我看，你穿的这身衣裳也很漂亮嘛。天气晴朗，吃喝都够，衣裳也体面。丹尼，你有这么多好处，怎么就不知道知足呢？
        - id: ch01-b12
          speaker: narrator
          text: 丹尼低下了头。过了好一阵，他才抬起头，正好看见老蟾蜍先生眼里闪着亲切的笑意。
        - id: ch01-b13
          speaker: danny_meadow_mouse
          text: 蟾蜍先生，我要怎么做，才能像绿森林里的表亲白脚那样，长出一条长尾巴呢？
        - id: ch01-b14
          speaker: old_mr_toad
          text: 原来你愁的是这个！哈！哈！哈！草地鼠丹尼，我真替你害臊，真的！可长尾巴对你有什么好处？你说说看。
        - id: ch01-b15
          speaker: narrator
          text: 丹尼想了半天，一时还真不知道该怎么回答。
        - id: ch01-b16
          speaker: danny_meadow_mouse
          text: 要是尾巴长一点，我……我……我肯定会好看得多。
        - id: ch01-b17
          speaker: narrator
          text: 老蟾蜍先生听了，只管哈哈大笑。
        - id: ch01-b18
          speaker: old_mr_toad
          text: 你见过长尾巴的草地鼠吗？没有吧？当然没有！草地鼠拖着长尾巴，那模样得多古怪呀！绿草地上的大伙儿见了，准会笑得肚子疼。得有苗条、利落又漂亮的身材，配上长尾巴才好看。何况长尾巴麻烦得很。你走到哪儿都得惦记着，还得小心别让它受伤。
        - id: ch01-b19
          speaker: old_mr_toad
          text: 再看看我。我长得不漂亮，有些人甚至说我丑。可是，农夫布朗家的男孩会为了比利水貂那身好皮毛去追捕他，却没人来追捕我。也没人觉得我的声音好听，想把我抓进笼子。我对自己现在的模样很满意。丹尼，你要肯听我的，就也该满意自己本来的样子。
        - id: ch01-b20
          speaker: narrator
          text: 丹尼想了一会儿，才回答。
        - id: ch01-b21
          speaker: danny_meadow_mouse
          text: 也许您说得对。我会试试看。
