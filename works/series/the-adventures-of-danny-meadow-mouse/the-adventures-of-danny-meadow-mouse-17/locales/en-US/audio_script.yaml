  chapters:
    - id: ch01
      title: Danny Meadow Mouse Becomes Worried
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Danny Meadow Mouse limped through the dear Old Briar-patch. He had lived there with Peter Rabbit ever since he wriggled free of Hooty the Owl's claws and fell right at Peter's feet. Hooty's terrible claws had left Danny lame and sore. Still, Danny didn't think about the pain very much. He was far too thankful just to be alive.
        - id: ch01-b02
          speaker: narrator
          text: So Danny went limping around the Old Briar-patch, gathering seeds that had fallen on the snow. Now and then, he pulled down a few red berries that stayed on the wild rose bushes all winter. Their seeds tasted very good, and a meal of them always made Danny feel especially well.
        - id: ch01-b03
          speaker: narrator
          text: Danny had grown very fond of Peter Rabbit because Peter had treated him so kindly. Danny felt he could never repay all that kindness. Peter had offered to share the Old Briar-patch when Danny was too far from home to return safely. And he had done even more. During those first few days after Danny escaped from Hooty, Peter cared for him so well. He brought Danny good things to eat when Danny was too weak and sore to find food for himself. Oh, Peter really had been very good indeed!
        - id: ch01-b04
          speaker: narrator
          text: But Danny wasn't happy as he limped about now. No, sir, he wasn't happy at all. He was worried. This worry was unlike any he had ever felt before, because for the first time in his life, Danny was worried about someone else. He was worried about Peter Rabbit.
        - id: ch01-b05
          speaker: narrator
          text: Peter had been away from the Old Briar-patch for a whole night and a whole day. He often stayed out all night, but never all day as well. Danny was certain something had happened to him. Danny remembered begging Peter not to visit Farmer Brown's young peach orchard. He had felt in his bones that the trip wasn't safe and that something dreadful would happen. But Peter had laughed and set off bravely. Why hadn't he come home?
        - id: ch01-b06
          speaker: narrator
          text: As Danny limped along, he spoke to himself.
        - id: ch01-b07
          speaker: danny_meadow_mouse
          text: Why can't folks enjoy the good things they have? Why can't they mind their own business at home instead of wandering away?
        - id: ch01-b08
          speaker: narrator
          text: The second night since Peter left had come, and Danny couldn't sleep at all. He limped round and round the Old Briar-patch. At last, he sat at the edge to wait and watch.
        - id: ch01-b09
          speaker: narrator
          text: Jolly, round, red Mr. Sun finally sent his first long rays across the Green Meadows. Then Danny saw something crawling toward the Old Briar-patch. He rubbed his eyes and looked once more. It couldn't be Peter Rabbit. And yet, yes, it was Peter! But what was wrong with him? Peter always came home lipperty-lipperty-lipperty-lip. This time he was crawling. He was truly crawling, and Danny couldn't understand why.
        - id: ch01-b10
          speaker: narrator
          text: Peter came closer and closer. Something seemed to be following him. No, he was dragging something behind him. At last, he began crawling down one of his own little paths into the Old Briar-patch. The thing behind him caught in the brambles. Peter pitched headfirst into the snow, too tired and worn out to move.
        - id: ch01-b11
          speaker: narrator
          text: Now Danny saw what was wrong. A wire was fastened to one of Peter's long hind legs. Part of a stake hung from the wire's other end. Peter had been caught in a snare! Danny hurried to him, and tears filled his eyes. Then he whispered to Peter.
        - id: ch01-b12
          speaker: danny_meadow_mouse
          text: Oh, poor Peter! I'm so sorry.
          emotion: sad
