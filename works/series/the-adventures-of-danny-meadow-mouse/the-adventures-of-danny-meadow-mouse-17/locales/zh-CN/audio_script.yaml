audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 亲切而略带调侃的讲述
        timbre: 温暖清亮
        pace: 舒缓而有变化
        pitch: 中音
    danny_meadow_mouse:
      display_name: 草地鼠丹尼
      tts:
        delivery: 年轻直率，闹别扭时语气生硬
        timbre: 轻细明亮
        pace: 稍快
        pitch: 中高音
  chapters:
    - id: ch01
      title: 在老荆棘丛养伤
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 田鼠丹尼还住在亲爱的老荆棘丛里。那天，他从猫头鹰胡蒂的爪子里挣脱，掉下来时正好落在小兔彼得脚边。从那以后，彼得就让他留在这里一起生活。
        - id: ch01-b02
          speaker: narrator
          text: 胡蒂的利爪把丹尼伤得不轻。他身上还疼，走路也一瘸一拐，可他很少去想这些。能活下来，丹尼已经觉得太幸运了。他每天在荆棘丛里慢慢走着，捡雪地上的草籽吃。有时，他也会拉下野蔷薇枝头挂了一冬的红果子。里面的籽味道真不错，每次吃过，丹尼都觉得身上舒服多了。
        - id: ch01-b03
          speaker: narrator
          text: 丹尼越来越喜欢彼得。彼得待他那么好，他觉得自己怎么也报答不完。丹尼的家离这里很远，他受着伤，回去的路又不安全。彼得却愿意把老荆棘丛分给他住。
        - id: ch01-b04
          speaker: narrator
          text: 而且，彼得做的远不止这些。丹尼刚从胡蒂爪下逃回来时，又虚弱又疼，根本没法自己找食物。头几天里，彼得一直用心照料他，还把好吃的东西带到他身边。彼得对丹尼，实在是好得没话说。
    - id: ch02
      title: 等不到彼得
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 可这一天，丹尼拖着伤腿走来走去，心里一点也不快活。不，先生，一点也不快活。因为他正在担心，而且这种担心从前从没来过。这是丹尼一生中第一次为别人发愁。他惦记的是小兔彼得。
        - id: ch02-b02
          speaker: narrator
          text: 彼得已经整整一夜又一整天没回老荆棘丛了。平常，他在外面待上一夜并不稀奇，可他从不会连白天也不回来。丹尼越想越觉得，彼得准是出了事。
        - id: ch02-b03
          speaker: narrator
          text: 丹尼明明苦苦劝过彼得，不要去农夫布朗的小桃园。他那时打心底里觉得不安全，觉得彼得会碰上可怕的事。彼得却笑了，还勇敢地出发了。现在，他为什么迟迟不回家呢？丹尼一边来回走，一边念叨起来。
        - id: ch02-b04
          speaker: danny_meadow_mouse
          text: |-
            送到眼前的好东西，
            为什么总不肯知足？
            为何不守好自家门，
            偏偏要往远处跑？
    - id: ch03
      title: 黎明时的身影
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 彼得离开后的第二个夜晚到了，丹尼一点也睡不着。他拖着伤腿，在老荆棘丛里转了一圈又一圈。最后，他坐到荆棘丛边上，守在那里等彼得。
        - id: ch03-b02
          speaker: narrator
          text: 终于，圆滚滚、红彤彤的快活太阳先生把第一道长长的光送过绿草原。就在这时，丹尼看见有个东西正朝老荆棘丛爬过来。他揉揉眼睛，又仔细看了一遍。那是……不，不会吧……没错，真的是小兔彼得！
        - id: ch03-b03
          speaker: narrator
          text: 可彼得到底怎么了？往常回家时，他总会一路蹦跶着跳回来。现在，他却在地上爬，真的是一点一点爬过来的。丹尼怎么也想不明白。
        - id: ch03-b04
          speaker: narrator
          text: 彼得越来越近，后面还跟着一个东西。不对，那东西是被他拖着走的。彼得好不容易爬到老荆棘丛，开始沿着自己的一条秘密小径往里钻。可身后的东西一下钩住荆棘，他便一头栽进雪里。彼得实在太累了，倒在那里，一动也动不了。
        - id: ch03-b05
          speaker: narrator
          text: 丹尼这才看清出了什么事。一根铁丝紧紧拴在彼得的一条长后腿上，另一头还连着一截木桩。原来，彼得中了圈套！丹尼急忙跑过去，眼泪一下涌了出来。他轻声对彼得说。
        - id: ch03-b06
          speaker: danny_meadow_mouse
          text: 可怜的彼得！彼得，我心里真难受！
          emotion: sad
