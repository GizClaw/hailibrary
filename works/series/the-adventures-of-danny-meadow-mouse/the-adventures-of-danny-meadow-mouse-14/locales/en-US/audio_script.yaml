audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm, observant storytelling
        timbre: clear and gentle
        pace: measured
        pitch: medium
    peter_rabbit:
      display_name: Peter Rabbit
      tts:
        delivery: quick, curious, and plainly expressive
        timbre: youthful and bright
        pace: lively
        pitch: medium-high
    farmer_brown:
      display_name: Farmer Brown
      tts:
        delivery: practical and firm
        timbre: sturdy and weathered
        pace: measured
        pitch: medium-low
  chapters:
    - id: ch01
      title: Farmer Brown Sets a Trap
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Peter Rabbit was in trouble. He had gotten into mischief, and like anyone who gets into mischief, he now wished he hadn't. Worst of all, he was far from his home in the dear Old Briar-patch, with no idea how he would ever get back.
        - id: ch01-b02
          speaker: narrator
          text: Where was Peter? He was hiding inside the stone wall beside Farmer Brown's young peach orchard. How thankful he was for that old wall and its safe hiding place! Bowser had stayed nearby for almost the whole night, so Peter hadn't dared to start for home. Daylight had come now, and he knew it wasn't safe even to poke his nose outside.
        - id: ch01-b03
          speaker: narrator
          text: Peter was much too worried to sleep the way he usually did during the day. He stayed hidden in the wall instead, waiting and watching.
        - id: ch01-b04
          speaker: narrator
          text: After a while, Farmer Brown and his boy came into the orchard. They noticed Peter's mischief at once. From the sound of their voices, Peter could tell they were very, very angry. They left, but they soon came back. For the rest of the day, Peter watched them work, putting something around every young peach tree.
        - id: ch01-b05
          speaker: narrator
          text: Soon Peter was so curious that he forgot his trouble and how far he was from home. He could hardly wait for night. Then he could find out what the two of them had been doing.
        - id: ch01-b06
          speaker: narrator
          text: At last, jolly, round, red Mr. Sun began to slip behind the Purple Hills. Farmer Brown and his boy started toward the house. By then, Farmer Brown was smiling.
        - id: ch01-b07
          speaker: farmer_brown
          text: I guess that ought to take care of him!
        - id: ch01-b08
          speaker: narrator
          text: Peter wondered what Farmer Brown meant. Who was going to be taken care of? Could he mean Peter?
        - id: ch01-b09
          speaker: peter_rabbit
          text: It can't be me. I don't need anyone to take care of me.
        - id: ch01-b10
          speaker: narrator
          text: Peter waited as long as he could. At last, all was still, and the moonlight began to throw the trees' shadows across the snow. Very carefully, he crept out of the wall. Bowser the Hound was nowhere to be seen. The orchard seemed just as quiet and peaceful as it had when Peter first arrived the night before.
        - id: ch01-b11
          speaker: narrator
          text: Peter had decided to run straight home as fast as his long legs could carry him. But that dreadful curiosity of his wouldn't let him leave until he learned what Farmer Brown and his boy had done to the peach trees.
        - id: ch01-b12
          speaker: narrator
          text: So Peter hurried to the nearest tree. Wire netting covered its trunk, starting at the ground and reaching higher than Peter could stretch. There was no way for him to get even one nibble of the delicious bark.
        - id: ch01-b13
          speaker: narrator
          text: Peter hadn't planned to eat any. He had meant to head straight home. But the moment he found he couldn't have it, he wanted that bark more than ever. He only wanted one bite. Peter looked all around. Everything was quiet.
        - id: ch01-b14
          speaker: peter_rabbit
          text: I'll just try the next tree. Then I'll go home.
        - id: ch01-b15
          speaker: narrator
          text: The next tree had wire around it too. Peter stopped and looked about. He turned toward home, but then he remembered how good the bark had tasted the night before. He paused once more before hurrying to the third tree. That one was protected just like the first two.
        - id: ch01-b16
          speaker: narrator
          text: By then, Peter had forgotten all about going home. He wanted some of that delicious bark. Away he ran, as fast as he could, checking one tree after another.
        - id: ch01-b17
          speaker: narrator
          text: At last, far down at the end of the orchard, Peter came to a tree with no wire netting around its trunk. His eyes sparkled.
        - id: ch01-b18
          speaker: peter_rabbit
          text: They must have missed this one!
          emotion: happy
        - id: ch01-b19
          speaker: narrator
          text: Lots of little shiny wires lay on the snow around the tree, but Peter never noticed them. All he saw was the delicious bark. He hopped straight into the middle of those wires. Just as he stretched up for his first bite, something tugged at one of his hind legs.
