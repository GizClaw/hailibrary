audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 亲切而略带调侃的讲述
        timbre: 温暖清亮
        pace: 舒缓而有变化
        pitch: 中音
    peter_rabbit:
      display_name: 小兔彼得
      tts:
        delivery: 好奇活泼，心思全写在语气里
        timbre: 清亮稚嫩
        pace: 轻快
        pitch: 中高音
    farmer_brown:
      display_name: 农夫布朗
      tts:
        delivery: 朴实直率，语气沉稳有力
        timbre: 浑厚粗犷
        pace: 从容
        pitch: 中低音
  chapters:
    - id: ch01
      title: 石墙里的彼得
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 小兔彼得遇上麻烦了。他闯了祸，现在后悔得不得了。闯祸的人呀，事后多半都会这样。更糟的是，他离亲爱的老荆棘丛很远，根本不知道该怎么回家。
        - id: ch01-b02
          speaker: narrator
          text: 彼得这会儿正躲在农夫布朗那座新桃园旁边的石墙里。他真庆幸有这堵老石墙，给了他一个安全的藏身处。猎犬鲍泽几乎守了整整一夜，彼得一直不敢回家。现在天亮了，他知道，自己连鼻子都不能探出去。
        - id: ch01-b03
          speaker: narrator
          text: 彼得愁得白天也睡不着，只好藏在墙里，一边等，一边看。过了一阵，农夫布朗和他的男孩走进桃园，一眼就看见了彼得闯的祸。听他们说话的声音，就知道两个人都气坏了。
        - id: ch01-b04
          speaker: narrator
          text: 他们先离开了一会儿，很快又回来了。接下来一整天，彼得都看着他们在每棵小桃树周围安上什么东西。他越看越好奇，竟忘了自己还在躲麻烦，也忘了家有多远。他恨不得天马上黑下来，好去看看那两个人究竟做了什么。
    - id: ch02
      title: 每棵树都碰不得
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 快活、滚圆、红彤彤的太阳先生正要落到紫山后面睡觉，农夫布朗和他的男孩也动身回屋了。农夫布朗这时已经笑了起来。
        - id: ch02-b02
          speaker: farmer_brown
          text: 我看，这下准能收拾他了！
        - id: ch02-b03
          speaker: peter_rabbit
          text: 他这话是什么意思？要收拾谁？难道是我吗？我好端端的，才不用谁来收拾呢。
        - id: ch02-b04
          speaker: narrator
          text: 彼得一直等到实在等不下去了。四下终于没了动静，月光也把树影投到了雪地上。他万分小心地爬出石墙。附近没有鲍泽，一切都跟前一晚他刚进桃园时一样安静。
        - id: ch02-b05
          speaker: narrator
          text: 彼得本来已经拿定主意，要迈开两条长腿，径直飞奔回家。可是，那股可怕的好奇心偏要拦住他。他非得先看看农夫布朗和他的男孩对小桃树做了什么。
        - id: ch02-b06
          speaker: narrator
          text: 彼得赶紧跑到最近的一棵树旁。树干外面裹了一圈铁丝网，从地面一直围到他够不着的高处。那香喷喷的树皮，他连一小口都啃不到。
        - id: ch02-b07
          speaker: narrator
          text: 原本彼得并不打算再吃，只想着回家。可现在吃不到，他反而比什么时候都馋，只想咬上一口。他看看四周，到处静悄悄的。
        - id: ch02-b08
          speaker: peter_rabbit
          text: 我就去试试下一棵树，试完马上回家。
    - id: ch03
      title: 被遗忘的那棵树
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 可下一棵树也裹着铁丝网。彼得犹豫了一下，四处看看，转身想回家。他马上又想起，昨晚的树皮有多么好吃。于是他再次停住脚，随后急匆匆地跑向第三棵树。
        - id: ch03-b02
          speaker: narrator
          text: 第三棵树也防护得严严实实。彼得这下把回家彻底忘了。他一心只想吃那鲜美的树皮，便从这棵树跑到那棵树，一棵接一棵，跑得飞快。
        - id: ch03-b03
          speaker: narrator
          text: 最后，彼得在桃园远远的另一头发现了一棵没有铁丝网的树。他的两只眼睛一下亮了起来。
        - id: ch03-b04
          speaker: peter_rabbit
          text: 他们准是忘了这一棵！
          emotion: happy
        - id: ch03-b05
          speaker: narrator
          text: 雪地上其实散着许多细细的、亮晶晶的铁丝，可彼得一点儿也没留意。他眼里只有小桃树上那鲜美的树皮。
        - id: ch03-b06
          speaker: narrator
          text: 彼得一下跳进铁丝中间，刚直起身子，准备啃下第一口树皮，忽然觉得有样东西猛地扯住了自己的一条后腿。
