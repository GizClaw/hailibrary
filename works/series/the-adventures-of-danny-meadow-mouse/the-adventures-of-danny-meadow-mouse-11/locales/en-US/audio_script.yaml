audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm, observant storytelling
        timbre: clear and gentle
        pace: measured
        pitch: medium
    danny_meadow_mouse:
      display_name: Danny Meadow Mouse
      tts:
        delivery: youthful and plainly expressive
        timbre: small and bright
        pace: lively
        pitch: medium-high
    peter_rabbit:
      display_name: Peter Rabbit
      tts:
        delivery: curious, eager, and openly expressive
        timbre: bright and youthful
        pace: lively
        pitch: medium-high
    tommy_tit:
      display_name: Tommy Tit
      tts:
        delivery: cheerful, quick, and neighborly
        timbre: light and chirpy
        pace: brisk
        pitch: high
  chapters:
    - id: ch01
      title: Peter Rabbit Gets a Fright
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Peter Rabbit sat in his favorite spot, right in the middle of the dear Old Briar-patch. He was trying to choose where to travel that night. The night before, he had barely escaped old Granny Fox in the Green Forest. The Smiling Pool had no food and no one left to talk to. And Peter could never be perfectly happy unless he was eating or asking questions. So the pool seemed much too dull on such a beautiful moonlit night. But Peter didn't want to race Granny Fox through the Green Forest again, either.
        - id: ch01-b02
          speaker: narrator
          text: Early that morning, just after Peter had settled down for his nap, Tommy Tit the Chickadee had stopped by the Old Briar-patch to be neighborly. Peter was almost asleep when he heard the cheeriest little voice in the world.
        - id: ch01-b03
          speaker: tommy_tit
          text: Dee-dee-chickadee! I can see you! Can you see me?
          emotion: happy
        - id: ch01-b04
          speaker: narrator
          text: Peter smiled before he could even open his eyes. When he looked up, Tommy was hanging upside down from an old bramble that nodded beneath him. A moment later, Tommy dropped onto the snow in front of Peter. Then he darted back into the brambles. He flipped right side up and upside down, whisking here and there without staying still for a moment. All the while, he chattered in that wonderfully cheerful voice.
        - id: ch01-b05
          speaker: tommy_tit
          text: Dee-dee-chickadee! I'm as happy as can be! Being happy all day long is the better way for me. Dee-dee-chickadee! Everybody's good to me!
          emotion: happy
        - id: ch01-b06
          speaker: peter_rabbit
          text: Hello, Tommy! Where have you been?
        - id: ch01-b07
          speaker: tommy_tit
          text: I've been in Farmer Brown's new orchard, up on the hill. Oh, Peter Rabbit, it's a fine orchard! I eat breakfast there every morning. If winter lasts long enough, I'll clean every tree for Farmer Brown.
        - id: ch01-b08
          speaker: narrator
          text: Peter looked puzzled.
        - id: ch01-b09
          speaker: peter_rabbit
          text: What do you mean by that?
        - id: ch01-b10
          speaker: tommy_tit
          text: I mean just what I said! Those young peach trees have a million insect eggs on them. I'm eating the eggs as fast as I can, and they make a mighty fine breakfast, Peter Rabbit!
        - id: ch01-b11
          speaker: narrator
          text: Tommy almost turned a somersault in the air as he answered. Then he said good-bye and flitted away.
        - id: ch01-b12
          speaker: narrator
          text: Now, as Peter sat in the moonlight deciding where to go, he remembered that young orchard. Just thinking about those young peach trees made his mouth water. But the orchard was far away, high on the hill, and Peter wondered if the trip would be safe. He had almost decided to take the chance, because he was very, very fond of young peach-tree bark. Then, thump! Something fell from the sky and landed right at his feet.
        - id: ch01-b13
          speaker: narrator
          text: Peter was so startled that he nearly fell over backward. At that same instant, Hooty the Owl gave a fierce, angry scream. Peter's heart almost stopped, even though he knew Hooty couldn't reach him inside the Old Briar-patch.
        - id: ch01-b14
          speaker: narrator
          text: At last, Peter gathered his wits, and his heart stopped jumping so wildly. He looked down to see what had fallen beside him. His big eyes grew even bigger. He rubbed them, just to make sure he was seeing what he thought he saw.
        - id: ch01-b15
          speaker: narrator
          text: There could be no mistake. Danny Meadow Mouse was lying at Peter's feet!
