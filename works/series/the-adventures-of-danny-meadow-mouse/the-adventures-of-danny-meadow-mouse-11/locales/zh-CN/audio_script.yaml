audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 亲切而略带调侃的讲述
        timbre: 温暖清亮
        pace: 舒缓而有变化
        pitch: 中音
    danny_meadow_mouse:
      display_name: 草地鼠丹尼
      tts:
        delivery: 年轻直率，闹别扭时语气生硬
        timbre: 轻细明亮
        pace: 稍快
        pitch: 中高音
    hooty_the_owl:
      display_name: 猫头鹰胡蒂
      tts:
        delivery: 阴沉粗鲁，饿肚子时格外不耐烦
        timbre: 低沉浑厚
        pace: 从容偏慢
        pitch: 低音
    peter_rabbit:
      display_name: 小兔彼得
      tts:
        delivery: 好奇活泼，心思全写在语气里
        timbre: 清亮稚嫩
        pace: 轻快
        pitch: 中高音
    tommy_tit:
      display_name: 山雀汤米
      tts:
        delivery: 欢快伶俐，待人热情
        timbre: 轻盈清脆
        pace: 明快
        pitch: 高音
  chapters:
    - id: ch01
      title: 月光下的打算
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 小兔彼得坐在亲爱的老荆棘丛中央，那是他最喜欢待的地方。他正盘算着，今晚该往哪儿去逛。昨天夜里，他在绿森林碰上狐狸奶奶，险些就逃不掉了。微笑池塘边既没什么可吃，也找不到谁陪他说话。你知道，彼得想要真正快活，就得吃点儿东西，或者问上一堆问题。
        - id: ch01-b02
          speaker: narrator
          text: 这么好的月夜，微笑池塘显得太冷清，彼得提不起兴致。可是再进绿森林，跟狐狸奶奶比谁跑得快？他也不想再试一回。
        - id: ch01-b03
          speaker: narrator
          text: 当天一早，彼得刚躺下要睡上午觉，山雀汤米就到老荆棘丛来串门了。彼得才要睡着，忽然听见世上最欢快的小嗓门唱了起来。
        - id: ch01-b04
          speaker: tommy_tit
          text: 嘀嘀，山雀啼！我瞧见你！你可瞧见我？
          emotion: happy
        - id: ch01-b05
          speaker: narrator
          text: 彼得还没睁开眼，先笑了起来。他抬头一看，汤米正倒挂在头顶那根摇晃的老荆条上。眨眼间，汤米落到他面前的雪地，又飞回荆棘间。他一会儿头朝上，一会儿头朝下，忽而在这里，忽而又到了那里，一刻也不肯停。那欢快的小嗓门也始终没有停下。
        - id: ch01-b06
          speaker: tommy_tit
          text: 嘀嘀，山雀啼！我呀快活又欢喜！要问什么法子好，一天到晚笑嘻嘻。嘀嘀，山雀啼！大家待我真客气！
          emotion: happy
    - id: ch02
      title: 山坡上的新果园
      blocks:
        - id: ch02-b01
          speaker: peter_rabbit
          text: 你好呀，汤米！你这是从哪儿回来？
        - id: ch02-b02
          speaker: tommy_tit
          text: 我刚从山坡上布朗农场主的新果园回来。彼得，那地方可真不错！我每天早晨都去那里吃早饭。要是这个冬天够长，我就能替布朗农场主把每棵树都收拾干净。
        - id: ch02-b03
          speaker: narrator
          text: 彼得听得一头雾水。
        - id: ch02-b04
          speaker: peter_rabbit
          text: 你说的“收拾干净”，到底是什么意思？
        - id: ch02-b05
          speaker: tommy_tit
          text: 就是字面上的意思呀！那些小桃树上有数不清的虫卵，我正尽快把它们全吃掉。彼得，那东西味道好极了，真好吃！
        - id: ch02-b06
          speaker: narrator
          text: 汤米回答时，身子在半空中几乎翻了个筋斗。说完，他向彼得道了别，轻快地飞走了。
    - id: ch03
      title: 从天上掉下来的丹尼
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 到了晚上，彼得坐在月光下拿不定主意，便想起了那座新果园。那些小桃树光是在脑海里一闪，他就馋得流口水。可是果园在山坡上，路实在远得很。他不知道，跑这一趟到底安不安全。
        - id: ch03-b02
          speaker: narrator
          text: 彼得非常非常爱吃小桃树的嫩皮。他眼看就要下定决心，冒险去一趟，忽然“扑通”一声，有个东西从天上掉下来，正落在他的脚边！
        - id: ch03-b03
          speaker: narrator
          text: 彼得吓得差点儿向后摔倒。同一瞬间，猫头鹰胡蒂发出了一声又凶又怒的尖叫。彼得知道，自己躲在老荆棘丛里，胡蒂抓不到他，可他的心还是吓得几乎不跳了。
        - id: ch03-b04
          speaker: narrator
          text: 过了一会儿，彼得才回过神来，心口也不再乱蹦。他低头去看，究竟是什么从天上掉在了身边。那双本来就很大的眼睛一下瞪得更大了。他又揉揉眼睛，生怕自己看错。
        - id: ch03-b05
          speaker: narrator
          text: 没错，绝不会错。躺在彼得脚边的，正是草地鼠丹尼！
