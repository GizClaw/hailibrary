audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm, observant storytelling
        timbre: clear and gentle
        pace: measured
        pitch: medium
    danny_meadow_mouse:
      display_name: Danny Meadow Mouse
      tts:
        delivery: youthful and plainly expressive
        timbre: small and bright
        pace: lively
        pitch: medium-high
    peter_rabbit:
      display_name: Peter Rabbit
      tts:
        delivery: cheerful, adventurous, and self-assured
        timbre: bright and youthful
        pace: lively
        pitch: medium-high
  chapters:
    - id: ch01
      title: Peter Rabbit Visits the Peach Orchard
      blocks:
        - id: ch01-b01
          speaker: danny_meadow_mouse
          text: Don't go, Peter Rabbit! Please don't go!
        - id: ch01-b02
          speaker: narrator
          text: Danny Meadow Mouse begged him to stay. But Peter hopped to the edge of the Old Briar-patch and gazed across the moonlit, snow-covered meadows. Beyond Farmer Brown's house stood a hill, and on that hill grew the young peach orchard Tommy Tit the Chickadee had told him about. Whenever Peter thought of those young trees and their tender bark, his mouth watered and watered.
        - id: ch01-b03
          speaker: peter_rabbit
          text: I think I'll go, Danny, just this once. It's a long way, and I've never been there. Still, it ought to be as safe as the Meadows or the Green Forest.
        - id: ch01-b04
          speaker: peter_rabbit
          text: |-
            Oh, I'm as bold as bold can be!
            Sing hoppy-hippy-hippy-hop-o!
            I'll hurry out, the world to see!
            Sing hoppy-hippy-hippy-hop-o!
            My ears are long,
            My legs are strong,
            So now, good day!
            I'll hop away!
            Sing hoppy-hippy-hippy-hop-o!
        - id: ch01-b05
          speaker: narrator
          text: With that, Peter left the dear, safe Old Briar-patch. Lipperty-lipperty-lip he went across the Green Meadows, heading for the hill and the young orchard behind Farmer Brown's house.
        - id: ch01-b06
          speaker: narrator
          text: Danny watched him go and shook his head. He did not approve at all.
        - id: ch01-b07
          speaker: danny_meadow_mouse
          text: Foolish, foolish, foolish! Why can't Peter be happy with all the good things he already has?
        - id: ch01-b08
          speaker: narrator
          text: Peter hurried on through the moonlight. Every few minutes he stopped, sat up, and looked and listened. Far away in the Green Forest, he heard Hooty the Owl's fierce hunting call. That told him Hooty was nowhere near. And since Granny Fox and Reddy Fox had returned to the Green Meadows and the Green Forest, they had stayed away from Farmer Brown's place. Peter gave them no more thought.
        - id: ch01-b09
          speaker: narrator
          text: After a while, Peter reached the young orchard. It was just as Tommy Tit had described it. Peter hopped over to the nearest peach tree and took a nibble of bark. Oh, how good it tasted! He worked his way around the whole trunk, stripping off the bark. Then he stood on his long hind legs and stretched as high as he could. He even dug away the snow so he could eat farther down. Once there was no tender young bark left within reach, he moved on to the next tree.
        - id: ch01-b10
          speaker: narrator
          text: Peter had no idea that this was the worst kind of mischief. When he stripped the bark from all the way around a young peach tree, he killed it. Just inside the bark are the paths that carry life-giving sap from the roots up to every branch. Now, when spring came, the sap could no longer rise through the bare ring Peter had made around the trunk. Without meaning to, Peter Rabbit was doing terrible harm.
        - id: ch01-b11
          speaker: narrator
          text: Peter knew nothing about that. He kept filling his big stomach and enjoying every bite. Soon he was having such a good time that he forgot to watch for danger.
        - id: ch01-b12
          speaker: narrator
          text: He had just started on another tree when a tremendous roar burst out behind him. Peter nearly jumped out of his skin. He knew that voice. He did not even stop to look back. He raced straight for the stone wall on the far side of the orchard. Bowser the Hound was right at his heels, with his great mouth wide open.
