audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 亲切而略带调侃的讲述
        timbre: 温暖清亮
        pace: 舒缓而有变化
        pitch: 中音
    danny_meadow_mouse:
      display_name: 草地鼠丹尼
      tts:
        delivery: 年轻直率，闹别扭时语气生硬
        timbre: 轻细明亮
        pace: 稍快
        pitch: 中高音
    peter_rabbit:
      display_name: 小兔彼得
      tts:
        delivery: 好奇活泼，心思全写在语气里
        timbre: 清亮稚嫩
        pace: 轻快
        pitch: 中高音
  chapters:
    - id: ch01
      title: 彼得拿定主意
      blocks:
        - id: ch01-b01
          speaker: danny_meadow_mouse
          text: 别去，小兔彼得！求你别去！
        - id: ch01-b02
          speaker: narrator
          text: 丹尼一个劲儿地央求。彼得却蹦到老荆棘丛边上，望过月光下白雪茫茫的草地。农夫布朗家后面有座山坡，那里就是山雀汤米说过的新桃园。彼得一想到小桃树上的嫩皮，嘴里的口水就止不住。
        - id: ch01-b03
          speaker: peter_rabbit
          text: 丹尼，我还是想去，就这一次。路是远了点儿，我也从没去过。不过那里应该和绿草地、绿森林一样安全。
        - id: ch01-b04
          speaker: peter_rabbit
          text: |-
            要说胆量我最大！
            蹦呀跳呀蹦蹦跳！
            我要出门看天下！
            蹦呀跳呀蹦蹦跳！
            耳朵长，
            腿脚强，
            这就告辞，
            奔向远方！
            蹦呀跳呀蹦蹦跳！
        - id: ch01-b05
          speaker: narrator
          text: 歌一唱完，彼得就离开亲爱又安全的老荆棘丛，啪嗒啪嗒地穿过绿草地，往农夫布朗家后面的山坡去了。那座新桃园正在山坡上等着他。
        - id: ch01-b06
          speaker: narrator
          text: 丹尼看着彼得越走越远，连连摇头。他一点儿也不赞成彼得这么做。
        - id: ch01-b07
          speaker: danny_meadow_mouse
          text: 糊涂，糊涂，真糊涂！彼得已经有那么多好东西了，怎么还是不知足呢？
    - id: ch02
      title: 月光下的新桃园
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 彼得借着月光赶路。每走几分钟，他就停下来，直起身子，仔细看看，再听听。猫头鹰胡蒂捕猎的叫声从很远的绿森林传来，这下彼得知道，胡蒂不在附近。狐狸奶奶和狐狸雷迪回到绿草地和绿森林以后，也一直没靠近农夫布朗家。彼得觉得他们也没什么好担心的。
        - id: ch02-b02
          speaker: narrator
          text: 过了一阵，彼得到了新桃园。这里跟山雀汤米说的一模一样。他蹦到最近的小桃树旁，张嘴啃了一口。哎呀，这树皮真好吃！他绕着树干不停地啃，把一整圈树皮都剥掉了。
        - id: ch02-b03
          speaker: narrator
          text: 彼得又用两条长长的后腿站起来，使劲往高处够。他还刨开树下的雪，尽量往低处吃。上下都再也够不到嫩树皮以后，他才去找下一棵树。
        - id: ch02-b04
          speaker: narrator
          text: 彼得哪里知道，他闯下的是再糟糕不过的大祸。小桃树没了整整一圈树皮，就活不成了。树液原本要从树皮内侧往上流，从根部一直流到所有树枝，给树木带去生命，让它长大。可树干被彼得啃秃了一圈，到了春天，树液便再也上不去了。小兔彼得这回害得小桃树可真不轻。
    - id: ch03
      title: 身后的巨吼
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 可彼得根本不知道自己做了什么。他只顾把大肚子填得饱饱的，一口接一口，吃得开心极了。吃着吃着，他连周围有没有危险都忘了留心。
        - id: ch03-b02
          speaker: narrator
          text: 彼得刚开始啃另一棵树，背后猛地响起一声巨吼，吓得他险些从皮里蹦出来。他听得出是谁，根本不敢回头，拔腿就往果园另一头的石墙跑。猎犬鲍泽张开血盆大口，就紧紧追在彼得脚后。
