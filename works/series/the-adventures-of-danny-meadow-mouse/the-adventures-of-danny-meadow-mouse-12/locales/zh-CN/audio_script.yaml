audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 亲切而略带调侃的讲述
        timbre: 温暖清亮
        pace: 舒缓而有变化
        pitch: 中音
    danny_meadow_mouse:
      display_name: 草地鼠丹尼
      tts:
        delivery: 年轻直率，闹别扭时语气生硬
        timbre: 轻细明亮
        pace: 稍快
        pitch: 中高音
    peter_rabbit:
      display_name: 小兔彼得
      tts:
        delivery: 好奇活泼，心思全写在语气里
        timbre: 清亮稚嫩
        pace: 轻快
        pitch: 中高音
  chapters:
    - id: ch01
      title: 从天上掉下来的丹尼
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 草地鼠丹尼慢慢睁开眼睛，又马上闭紧了，像是根本不敢看看四周。他听见有人正在说话。那声音很亲切，跟猫头鹰胡蒂可怕的嗓音一点儿也不像。丹尼昏过去之前，最后记得的正是胡蒂的声音。他一动不动地躺了一会儿，只管听着。
        - id: ch01-b02
          speaker: peter_rabbit
          text: 咦，草地鼠丹尼，你到底是从哪儿掉下来的？
        - id: ch01-b03
          speaker: narrator
          text: 这声音听起来太像小兔彼得了。丹尼再次睁开眼睛，眼前果然就是彼得。
        - id: ch01-b04
          speaker: danny_meadow_mouse
          text: 我……我现在在哪儿？
        - id: ch01-b05
          speaker: narrator
          text: 丹尼的嗓音又小又虚弱。
        - id: ch01-b06
          speaker: peter_rabbit
          text: 你在亲爱的老荆棘丛中间，跟我待在一起呢。可你是怎么来的？刚才看着就像从天上直掉下来一样。
        - id: ch01-b07
          speaker: narrator
          text: 丹尼浑身一颤，忽然全想起来了。猫头鹰胡蒂用又大又狠的爪子抓着他，飞过月光下的绿草地。那时，积雪盖满了整片草地。后来胡蒂的爪子松了一下，丹尼就拼命挣扎，踢呀，扭呀，转呀，直到皮毛被撕破。他一路往下掉，掉进松软的雪里，撞得小小的身体连气都喘不过来。昏过去前，他最后听见的是胡蒂那声凶狠的尖叫。胡蒂又气又失望。想起这些，丹尼再次打了个寒战。
    - id: ch02
      title: 在老荆棘丛养伤
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 丹尼突然想到，他得赶紧躲起来。胡蒂说不定会再来抓他！他挣扎着想站起来。
        - id: ch02-b02
          speaker: danny_meadow_mouse
          text: 哎哟！好疼！
        - id: ch02-b03
          speaker: narrator
          text: 丹尼呻吟了一声，只好又躺下不动。
        - id: ch02-b04
          speaker: peter_rabbit
          text: 好啦，好啦，丹尼，你别动。在这里，你什么都不用怕。
          emotion: calm
        - id: ch02-b05
          speaker: narrator
          text: 彼得轻声安慰他。看着丹尼，一双大眼睛里很快盈满了泪水。胡蒂那双狠毒的利爪，把丹尼抓得浑身是伤。你知道，彼得有一副非常柔软的心肠。
        - id: ch02-b06
          speaker: narrator
          text: 丹尼便安静地躺着。彼得想办法让他舒服一点，还替他包扎伤口。丹尼一边躺着，一边把整件事讲给彼得听。他忘了留心天空，才会被胡蒂抓走。后来，他就夹在那双残忍的爪子里，经历了一场可怕的空中旅行。
        - id: ch02-b07
          speaker: danny_meadow_mouse
          text: 唉，我现在该怎么办？我怎么才能回家呢？我想回到温暖的草屋，回到白雪下面安全的小地道。旧篱笆桩的空洞里，还藏着我攒下的一小堆种子呢！
          emotion: sad
    - id: ch03
      title: 老荆棘丛的新住客
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 听完丹尼的话，彼得认真地想了起来。
        - id: ch03-b02
          speaker: peter_rabbit
          text: 你回不去了，真的回不去。对你这样的小家伙来说，那段路太远，硬要回去很不安全。要是晚上走，猫头鹰胡蒂可能会再抓住你。要是白天走，粗腿老鹰几乎准能看见你。无论白天还是晚上，狐狸奶奶或狐狸雷迪都可能在附近东张西望。真碰上他们，你就一定逃不掉了。
        - id: ch03-b03
          speaker: peter_rabbit
          text: 这样吧，你干脆留在这里！亲爱的老荆棘丛是世上最安全的地方。你想想，在这里，就算大白天出来，你也能当面笑话狐狸奶奶、狐狸雷迪和粗腿老鹰。他们就是想抓你也进不来，这些可靠的老荆棘会把他们全挡在外面。
        - id: ch03-b04
          speaker: peter_rabbit
          text: 你可以在这里的雪下面挖地道，跟原来那些一样好。地上还有好多好多种子，够你吃的。反正你也知道，我不爱吃种子。我一个人住在这里，有时还真有点儿寂寞。留下来吧，以后这片老荆棘丛就归咱们俩了。
        - id: ch03-b05
          speaker: narrator
          text: 丹尼感激地望着彼得。
        - id: ch03-b06
          speaker: danny_meadow_mouse
          text: 好，我留下。彼得，真是太谢谢你了！
          emotion: happy
        - id: ch03-b07
          speaker: narrator
          text: 就这样，亲爱的老荆棘丛里多了一位住客。
