audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm, observant storytelling
        timbre: clear and gentle
        pace: measured
        pitch: medium
    danny_meadow_mouse:
      display_name: Danny Meadow Mouse
      tts:
        delivery: youthful and plainly expressive
        timbre: small and bright
        pace: lively
        pitch: medium-high
    peter_rabbit:
      display_name: Peter Rabbit
      tts:
        delivery: friendly and tenderhearted
        timbre: light and warm
        pace: easy
        pitch: medium-high
  chapters:
    - id: ch01
      title: The Old Briar-patch Has a New Tenant
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Danny Meadow Mouse slowly opened his eyes. Then he quickly shut them again, almost afraid to look. Someone was talking nearby. The voice was pleasant, nothing like the terrible voice of Hooty the Owl. Hooty's voice was the last thing Danny could remember. So Danny stayed still for a moment and listened.
        - id: ch01-b02
          speaker: peter_rabbit
          text: Why, Danny Meadow Mouse! Where in the world did you fall from?
          emotion: surprised
        - id: ch01-b03
          speaker: narrator
          text: That sounded very much like Peter Rabbit. Danny opened his eyes once more, and there Peter was.
        - id: ch01-b04
          speaker: danny_meadow_mouse
          text: Where am I?
        - id: ch01-b05
          speaker: narrator
          text: Danny's voice was tiny and weak.
        - id: ch01-b06
          speaker: peter_rabbit
          text: You're here with me, right in the middle of the dear Old Briar-patch. But how did you get here? You looked as if you had dropped straight out of the sky.
        - id: ch01-b07
          speaker: narrator
          text: Danny shuddered. All at once, he remembered everything. Hooty the Owl had seized him in those great, cruel claws. The Owl had carried him through the moonlight, high above the snow-covered Green Meadows. Then Danny had felt the claws slipping. He had kicked and struggled, twisting this way and that, until his coat tore. Down he fell, and down again, until he struck the soft snow. The fall knocked every bit of breath from his little body. After that, he remembered only Hooty's fierce scream, full of rage and disappointment. Danny shuddered once more.
        - id: ch01-b08
          speaker: narrator
          text: Then another thought struck him. He had to hide before Hooty caught him again. Danny tried to scramble onto his feet.
        - id: ch01-b09
          speaker: danny_meadow_mouse
          text: Ooch! Oh!
        - id: ch01-b10
          speaker: narrator
          text: Danny groaned and dropped back down.
        - id: ch01-b11
          speaker: peter_rabbit
          text: There, there, Danny. Don't move. You have nothing to fear in here.
          emotion: calm
        - id: ch01-b12
          speaker: narrator
          text: Peter's big eyes filled with tears as he looked at Danny. Hooty's cruel claws had torn and hurt the little Mouse all over, and Peter had a very tender heart.
        - id: ch01-b13
          speaker: narrator
          text: Danny stayed where he was. Peter tried to make him comfortable and care for his wounds. While Peter worked, Danny told him the whole story. He had forgotten to keep watch on the sky, so Hooty had caught him. Then came that terrible journey in the Owl's claws.
        - id: ch01-b14
          speaker: danny_meadow_mouse
          text: Oh, dear! What can I do now? How will I ever get home to my warm grass house, my safe little tunnels under the snow, and the seeds I stored in that snug hollow in the old fence-post?
          emotion: fearful
        - id: ch01-b15
          speaker: narrator
          text: Peter Rabbit thought for a while before he answered.
        - id: ch01-b16
          speaker: peter_rabbit
          text: You can't go back, Danny. You really can't. It's much too far for a little fellow like you, and the trip wouldn't be safe. Go at night, and Hooty might catch you again. Go by day, and old Roughleg the Hawk would almost surely spot you. And whether it's day or night, old Granny Fox or Reddy Fox might come snooping along. If either one found you, you'd be caught.
        - id: ch01-b17
          speaker: peter_rabbit
          text: I know what you should do. Stay right here! The dear Old Briar-patch is the safest place in the world. You can come out in broad daylight and laugh at Granny Fox, Reddy Fox, and old Roughleg the Hawk. If they try to reach you, these good old brambles will keep them out.
        - id: ch01-b18
          speaker: peter_rabbit
          text: You can dig tunnels under the snow here, just as good as the ones you had at home. There are plenty of seeds on the ground too, and you know I don't eat them. Sometimes I get lonely here by myself. Stay, Danny, and the Old Briar-patch can belong to both of us.
        - id: ch01-b19
          speaker: narrator
          text: Danny Meadow Mouse looked at Peter with gratitude.
        - id: ch01-b20
          speaker: danny_meadow_mouse
          text: I will stay. Thank you ever so much, Peter Rabbit.
        - id: ch01-b21
          speaker: narrator
          text: And that is how the dear Old Briar-patch came to have another tenant.
