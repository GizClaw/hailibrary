  chapters:
    - id: ch01
      title: Danny Meadow Mouse Returns a Kindness
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: There Peter Rabbit lay in the snow. He had dragged that piece of stake a long, long way. Now it was tangled in the bramble bushes, and he couldn't pull it any farther.
        - id: ch01-b02
          speaker: narrator
          text: Peter dropped down and cried. Yes, sir, he really cried. He was worn out and frightened. His stiff, sore leg hurt terribly. After dragging that stake so far, he had made it all the way home, only to be stopped on his own doorstep. So Peter just lay there in the snow and cried.
        - id: ch01-b03
          speaker: narrator
          text: And what if old Granny Fox came poking around and found him caught there? She would only have to grab that hateful stake where it was tangled in the brambles. Then she could pull Peter out of the bushes and get him. Can you blame Peter for crying?
        - id: ch01-b04
          speaker: narrator
          text: After a while, Peter felt someone wiping away his tears. It was Danny Meadow Mouse, singing in a funny little voice. Before long, Peter stopped crying and listened.
        - id: ch01-b05
          speaker: danny_meadow_mouse
          text: "Isn't any use to cry! Not a bit! Not a bit! Wipe your eyes and wipe 'em dry! Use your wit! Use your wit! Just remember that tomorrow never brings a single sorrow. Yesterday has gone forever, and tomorrow gets here never. Chase your worries all away. Nothing's worse than just today."
        - id: ch01-b06
          speaker: narrator
          text: Peter couldn't help smiling.
        - id: ch01-b07
          speaker: danny_meadow_mouse
          text: That's it, Peter Rabbit! Keep smiling. All your troubles are here today, and between you and me, I don't think they're as bad as they seem. Stay right where you are while I find out what we can do.
        - id: ch01-b08
          speaker: narrator
          text: Off whisked Danny, as lively as could be in spite of his lame leg. A few minutes later, Peter felt the wire on his leg give little twitches. He knew Danny must be doing something at the other end, though he couldn't see what it was.
        - id: ch01-b09
          speaker: narrator
          text: Danny had begun gnawing the piece of stake into splinters. He sat there and gnawed and gnawed and gnawed. Jolly, round, red Mr. Sun climbed higher in the sky. Danny grew hungry, but he kept working at that bothersome stake.
        - id: ch01-b10
          speaker: narrator
          text: Then Danny happened to look across the snow-covered Green Meadows. What he saw made his heart jump. Farmer Brown's boy was coming straight toward the dear Old Briar-patch.
        - id: ch01-b11
          speaker: narrator
          text: Danny said nothing to Peter. He only gnawed faster than ever.
        - id: ch01-b12
          speaker: narrator
          text: Farmer Brown's boy was almost there when Danny finally stopped. Only a tiny bit of the stake remained. Danny hurried back to Peter with the news.
        - id: ch01-b13
          speaker: danny_meadow_mouse
          text: Nothing can stop you now. Go on to your most secret hiding place, deep in the Old Briar-patch!
        - id: ch01-b14
          speaker: narrator
          text: Peter slowly dragged himself through the bushes. Danny trotted behind him and kept the wire from catching. They reached Peter's secretest retreat just as Farmer Brown's boy came to the edge of the dear Old Briar-patch.
        - id: ch01-b15
          speaker: farmer_browns_boy
          text: So this is where the rabbit that killed our peach tree lives! We'll set a few snares and keep you from causing any more trouble.
        - id: ch01-b16
          speaker: narrator
          text: For the rest of the afternoon, Farmer Brown's boy stayed very busy around the edge of the Old Briar-patch.
