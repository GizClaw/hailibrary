audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 亲切而略带调侃的讲述
        timbre: 温暖清亮
        pace: 舒缓而有变化
        pitch: 中音
    danny_meadow_mouse:
      display_name: 草地鼠丹尼
      tts:
        delivery: 年轻直率，闹别扭时语气生硬
        timbre: 轻细明亮
        pace: 稍快
        pitch: 中高音
    farmer_browns_boy:
      display_name: 农夫布朗的儿子
      tts:
        delivery: 直截了当，带着乡下少年的粗朴
        timbre: 年轻结实
        pace: 中速
        pitch: 中音
  chapters:
    - id: ch01
      title: 到家却进不了门
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 小兔彼得就躺在雪地上。那截木桩，他已经拖了很远很远。可现在，木桩钩住了荆棘，他再也拖不动了。彼得一下瘫倒，哭了起来。是的，先生，他真的哭了！
        - id: ch01-b02
          speaker: narrator
          text: 他累得一点力气也没有，又怕得厉害。一条腿僵硬酸痛，疼得实在受不了。最叫人难过的是，他好不容易回到家，却偏偏被拦在自家门口。彼得只能躺在那里哭。
        - id: ch01-b03
          speaker: narrator
          text: 万一狐狸奶奶在附近寻摸，发现他这样被困住，可就糟了。她只要叼住那截钩在荆棘上的木桩，把彼得拖出来，就能抓到他。碰上这样的事，彼得怎能不哭呢？
    - id: ch02
      title: 丹尼有个办法
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 过了一会儿，彼得觉得有人在替自己擦眼泪。原来是田鼠丹尼。丹尼还用滑稽的小嗓音唱着歌。彼得渐渐不哭了，听见他唱。
        - id: ch02-b02
          speaker: danny_meadow_mouse
          text: |-
            哭呀哭呀没有用！
            一点没有！一点没有！
            擦擦眼睛别泪汪汪！
            动动脑筋！动动脑筋！
            你只要记牢，明天来到，
            从不会带来半点烦恼。
            昨天已经一去不回，
            明天永远还没到来。
            快把忧愁全都赶跑，
            再糟也不过是今天糟。
        - id: ch02-b03
          speaker: narrator
          text: 彼得听着听着，到底还是笑了。
        - id: ch02-b04
          speaker: danny_meadow_mouse
          text: 对啦，对啦！笑吧，彼得，尽管笑！先生，你这些麻烦都只在今天。说句咱俩之间的话，我看事情根本没有你想得那么糟。你先躺着别动，我去找找办法。
        - id: ch02-b05
          speaker: narrator
          text: 丹尼说完，一溜烟跑开了。别看一条腿还瘸着，他的动作照样轻快。没过几分钟，彼得腿上的铁丝轻轻抽动起来。他知道，丹尼正在铁丝另一头忙活。
        - id: ch02-b06
          speaker: narrator
          text: 丹尼想把那截木桩彻底啃碎。他坐下来，啃呀，啃呀，不停地啃。圆滚滚、红彤彤的太阳先生越爬越高。丹尼的肚子饿了，可他还是对着那截讨厌的木桩，一个劲儿地啃。
    - id: ch03
      title: 来不及了
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 又过了一阵，丹尼抬头望向白雪覆盖的绿草原。只看了一眼，他的心就猛地一跳。农夫布朗的儿子正笔直朝亲爱的老荆棘丛走来。
        - id: ch03-b02
          speaker: narrator
          text: 丹尼什么也没告诉彼得，只管加快速度，比刚才啃得更起劲。
        - id: ch03-b03
          speaker: narrator
          text: 农夫布朗的儿子眼看就要到了，丹尼才停下。木桩已经只剩下一丁点儿。他赶紧告诉彼得，再也没有东西拦着他了，快躲到老荆棘丛最深处，藏进那个最隐秘的地方。
        - id: ch03-b04
          speaker: narrator
          text: 彼得慢慢拖着身子向前挪，丹尼跟在后面小跑，处处留心，不让铁丝再钩上灌木。他们刚平安躲进彼得最隐秘的藏身地，农夫布朗的儿子也正好走到老荆棘丛边。
    - id: ch04
      title: 新的圈套
      blocks:
        - id: ch04-b01
          speaker: farmer_browns_boy
          text: 原来害死我们桃树的兔子就住在这儿！好，我们来放几个圈套，看你以后还怎么捣乱。
        - id: ch04-b02
          speaker: narrator
          text: 那天下午剩下的时间里，农夫布朗的儿子一直在老荆棘丛四周忙个不停。
