audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm, observant storytelling
        timbre: clear and gentle
        pace: measured
        pitch: medium
    danny_meadow_mouse:
      display_name: Danny Meadow Mouse
      tts:
        delivery: small, alert, and plainly expressive
        timbre: youthful and light
        pace: quick
        pitch: high
    reddy_fox:
      display_name: Reddy Fox
      tts:
        delivery: sly, confident, and keenly curious
        timbre: smooth and wiry
        pace: measured
        pitch: medium
  chapters:
    - id: ch01
      title: Waiting in the Tomato Can
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Danny Meadow Mouse had been sitting perfectly still for a long time inside the old tomato can. It was the hiding place that had saved him from Redtail the Hawk. Danny didn't dare poke out even his head. Redtail might still be circling above, ready to drop on him.
        - id: ch01-b02
          speaker: danny_meadow_mouse
          text: If I wait here long enough, Redtail will get tired and leave. Maybe he's gone already. This morning has been exciting, and I'm getting a little tired. I might as well nap while I wait to be sure it's safe outside.
        - id: ch01-b03
          speaker: narrator
          text: Danny curled up inside the old can. But he wasn't going to get that nap. His eyes had closed, though his ears were still wide awake. Before long, he heard soft footsteps coming closer.
        - id: ch01-b04
          speaker: narrator
          text: Danny's eyes popped open, and all thought of sleep vanished. He knew that sound. Those footsteps were very much like the footsteps of someone you may know. Yes, they sounded like Reddy Fox. Danny listened as his heart began to beat faster. Could it really be Reddy? He did not dare look out.
        - id: ch01-b05
          speaker: narrator
          text: Then a faint scent drifted into the tomato can. Now Danny knew for certain. It was Reddy Fox.
        - id: ch01-b06
          speaker: danny_meadow_mouse
          text: Oh, dear! I hope he doesn't discover me in here. What in the world brought him this way just now?
          emotion: fearful
    - id: ch02
      title: Reddy Comes to Investigate
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: Curiosity was exactly what had brought Reddy there. He had been hunting for breakfast some distance away on the Green Meadows when Redtail tried so hard to catch Danny Meadow Mouse.
        - id: ch02-b02
          speaker: narrator
          text: Reddy's sharp eyes had spotted Redtail the moment the Hawk left his tree and raced after Danny. From the way Redtail flew, Reddy knew he had seen something he wanted to catch. Reddy watched him swoop. Then he heard Redtail scream with rage when Danny dodged into the old tomato can and escaped him.
        - id: ch02-b03
          speaker: narrator
          text: Again and again, Redtail struck at something on the ground. At last, he flew away in disgust, with nothing in his claws.
        - id: ch02-b04
          speaker: reddy_fox
          text: I wonder what Redtail was chasing and how it got away. He's terribly upset about losing it. I'll go over and see what I can find.
        - id: ch02-b05
          speaker: narrator
          text: Reddy set off at a brisk trot toward the short patch of grass where he had seen Redtail striking the ground. When he came near, he began to creep very quietly. He stopped at the very edge of the open patch and searched it from end to end.
        - id: ch02-b06
          speaker: narrator
          text: The old tomato can was the only thing there. Reddy had passed it many times before.
        - id: ch02-b07
          speaker: reddy_fox
          text: What could Redtail have been hunting here? This grass is too short to hide even a grasshopper, but whatever he chased still escaped. That's very strange. Very strange indeed.
    - id: ch03
      title: Reddy Follows the Scent
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: Reddy trotted into the patch. With his nose close to the ground, he ran one way and then the other. He hoped his nose could discover what his eyes had missed. Back and forth he went, until he stopped all at once.
        - id: ch03-b02
          speaker: reddy_fox
          text: Ha!
        - id: ch03-b03
          speaker: narrator
          text: Reddy had picked up the scent Danny Meadow Mouse left when he ran across the grass toward the old tomato can. Reddy followed it all the way to the can. He jumped over it, but on the far side, Danny's scent disappeared.
        - id: ch03-b04
          speaker: narrator
          text: In an instant, Reddy understood. Satisfaction gleamed in his yellow eyes as he turned toward the can again. Danny Meadow Mouse had to be hiding inside.
        - id: ch03-b05
          speaker: narrator
          text: Reddy put his nose close to the opening at the end of the can and sniffed.
        - id: ch03-b06
          speaker: reddy_fox
          text: This time, I've caught you!
          emotion: angry
