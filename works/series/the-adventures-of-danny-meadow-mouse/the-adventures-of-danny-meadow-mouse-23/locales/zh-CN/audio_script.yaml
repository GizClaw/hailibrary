audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 亲切而略带调侃的讲述
        timbre: 温暖清亮
        pace: 舒缓而有变化
        pitch: 中音
    danny_meadow_mouse:
      display_name: 草地鼠丹尼
      tts:
        delivery: 年轻直率，闹别扭时语气生硬
        timbre: 轻细明亮
        pace: 稍快
        pitch: 中高音
    reddy_fox:
      display_name: 狐狸雷迪
      tts:
        delivery: 急躁自负，心里打算盘时透着狡猾
        timbre: 清亮略尖
        pace: 稍快
        pitch: 中高音
  chapters:
    - id: ch01
      title: 丹尼等着脱险
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 丹尼钻进旧番茄罐，躲过红尾鹰以后，在里面一动不动地待了很久。他连头也不敢伸出去。说不定红尾鹰还在天上盘旋，正等着扑下来呢。
        - id: ch01-b02
          speaker: danny_meadow_mouse
          text: 我只要在这里多待一会儿，他总会等烦了飞走的。也许他早就走啦。
        - id: ch01-b03
          speaker: narrator
          text: 这个早晨实在太惊险，丹尼也有点儿累了。反正还得等到确定外面没有危险，他觉得正好可以歇一歇，先睡一觉，醒来再看看是不是真的安全。
        - id: ch01-b04
          speaker: narrator
          text: 丹尼在旧罐头里蜷起身子，闭上了眼睛。可他的耳朵还醒着。这场觉呀，注定是睡不成了。
    - id: ch02
      title: 熟悉的脚步声
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 没过多久，一阵轻轻的脚步声越来越近。丹尼猛地睁开眼，立刻没了睡意。那声音熟得很，越听越像一个家伙的脚步。你猜是谁？正是狐狸雷迪！
        - id: ch02-b02
          speaker: narrator
          text: 丹尼的心越跳越快。他不敢探头去看，只能竖着耳朵听，心里还在问，真的会是雷迪吗？过了一会儿，一丝淡淡的气味飘进罐头。这下不用猜了，来的就是雷迪。
        - id: ch02-b03
          speaker: danny_meadow_mouse
          text: 糟了！但愿雷迪别发现我藏在这里。他怎么偏偏这时候跑来了？
          emotion: fearful
        - id: ch02-b04
          speaker: narrator
          text: 雷迪为什么会来？说到底，是他的好奇心把他引来的。
    - id: ch03
      title: 雷迪要弄个明白
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 红尾鹰追丹尼的时候，雷迪正在绿草地另一头找早饭。他离得不近，可那双尖眼睛一下就看见红尾鹰离开树梢，朝什么东西追了过去。从红尾鹰飞行的样子，雷迪知道，他一定发现了想捉的猎物。
        - id: ch03-b02
          speaker: narrator
          text: 雷迪看着红尾鹰俯冲下去，也听见了那声气急败坏的尖叫。丹尼及时躲进旧番茄罐，红尾鹰扑了个空。接着，红尾鹰又一次次击打地上的东西。最后，他什么也没抓到，只能恼火地飞走。这些，雷迪全都看在眼里。
        - id: ch03-b03
          speaker: reddy_fox
          text: 红尾鹰刚才到底在追什么？怎么还会失手呢？看他那副样子，又生气又失望。我得过去瞧瞧，弄清楚是怎么回事。
        - id: ch03-b04
          speaker: narrator
          text: 雷迪迈开轻快的步子，朝那片短草地小跑过去。快到空地时，他放轻脚步，悄悄摸到边缘，停下来仔细扫了一圈。那里没有别的东西，只有一只旧番茄罐。雷迪以前见过它很多次。
        - id: ch03-b05
          speaker: reddy_fox
          text: 红尾鹰在这里追的会是什么呢？草这么短，连蚱蜢也藏不住，他怎么偏偏没抓到？这可真奇怪，太奇怪了。
    - id: ch04
      title: 气味通向旧罐头
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 雷迪跑进空地，把鼻子贴近地面，来来回回地寻找。他一边跑，一边仔细嗅着每一处地面。他的眼睛没有找到答案，也许鼻子能闻出线索。雷迪跑了一趟又一趟，忽然停住了。
        - id: ch04-b02
          speaker: reddy_fox
          text: 哈，这下有线索了！
        - id: ch04-b03
          speaker: narrator
          text: 他闻到了丹尼留下的气味。丹尼跑向旧番茄罐时，沿路留下了这条踪迹。雷迪跟着气味一直走，鼻子把他领到了旧罐头旁边。
        - id: ch04-b04
          speaker: narrator
          text: 雷迪从罐头上跳过去，却在另一边找不到一点儿丹尼的气味。他马上明白了，回头望着旧罐头，黄色的眼睛里闪起得意的光。丹尼一定藏在里面。
        - id: ch04-b05
          speaker: reddy_fox
          text: 这一次，你可逃不掉了！
        - id: ch04-b06
          speaker: narrator
          text: 雷迪低声咆哮着，把鼻子凑到罐头一端的开口处，仔细嗅了起来。
