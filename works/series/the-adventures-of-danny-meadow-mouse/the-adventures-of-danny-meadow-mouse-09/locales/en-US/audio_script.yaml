audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm, observant storytelling
        timbre: clear and gentle
        pace: measured
        pitch: medium
    danny_meadow_mouse:
      display_name: Danny Meadow Mouse
      tts:
        delivery: youthful and plainly expressive
        timbre: small and bright
        pace: lively
        pitch: medium-high
    hooty_the_owl:
      display_name: Hooty the Owl
      tts:
        delivery: gruff and deliberate
        timbre: deep and hollow
        pace: unhurried
        pitch: low
  chapters:
    - id: ch01
      title: Danny Meadow Mouse Is Caught at Last
      blocks:
        - id: ch01-b01
          speaker: danny_meadow_mouse
          text: Tippy-toppy-tippy-toe, play and frolic in the snow! Now you see me! Now you don't! Think you'll catch me, but you won't! Tippy-toppy-tippy-toe, oh, such fun to play in snow!
          emotion: happy
        - id: ch01-b02
          speaker: narrator
          text: Danny Meadow Mouse sang that song, or at least he tried to, while he skipped over the snow that covered the Green Meadows. His voice was so tiny, funny, and squeaky that if you had been there, you might never have guessed he was singing. But Danny believed he was, and he enjoyed it as much as if his voice had been the most beautiful in the world. After all, singing is just the happiness in your heart making itself heard.
        - id: ch01-b03
          speaker: narrator
          text: Oh, yes, Danny was happy! And why shouldn't he be? He had proved that he was smarter than old Granny Fox, and that would make anyone happy. Some folks might fool Granny once, and a few might fool her twice. Hardly anyone could keep fooling her until she finally gave up in disgust. Danny had done exactly that. He felt very clever, and of course he felt very happy.
        - id: ch01-b04
          speaker: narrator
          text: So Danny sang his little song and skipped about in the moonlight. He dodged in and out of his small round doorways in the snow. All the while, his sharp little eyes stayed open for any sign of Granny Fox or Reddy Fox. Yet for all his cleverness, Danny forgot one thing. Yes, Sir, he forgot to look up at the sky.
        - id: ch01-b05
          speaker: narrator
          text: Danny knew old Roughleg the Hawk was asleep, so Roughleg could not harm him. But Danny never thought about Hooty the Owl.
        - id: ch01-b06
          speaker: narrator
          text: Dear me, dear me, forgetting is a dreadful habit. If no one ever forgot, there would not be nearly so much trouble in the world. No, indeed, there would not be nearly so much trouble. But Danny did forget. He kept skipping and singing, as happy as could be, without once thinking to watch the sky.
        - id: ch01-b07
          speaker: narrator
          text: Over in the Green Forest, Hooty the Owl had found very little to eat, and he was feeling cross. You see, Hooty was hungry, and hunger can make anyone feel cross. The longer he hunted, the hungrier and crosser he became. Then, all at once, he thought of Danny Meadow Mouse.
        - id: ch01-b08
          speaker: hooty_the_owl
          text: I expect he's asleep somewhere warm and safe beneath the snow. Still, he just might be outside playing in the moonlight. I'll fly down to the meadows and have a look.
        - id: ch01-b09
          speaker: narrator
          text: Hooty can fly without making even the smallest sound. He seems to drift through the air like one great shadow. He spread his broad wings and floated out over the meadows.
        - id: ch01-b10
          speaker: narrator
          text: Hooty sees as well at night as most folks see by day. Before long, he spotted Danny skipping over the snow and darting through his little round doorways. Hooty's great eyes turned brighter and fiercer.
        - id: ch01-b11
          speaker: narrator
          text: Not a sound came from Hooty as he floated through the moonlight. Soon he was directly above Danny Meadow Mouse.
        - id: ch01-b12
          speaker: narrator
          text: Danny looked up too late. His little song broke off in one tiny squeak of fear, and he ran for the nearest round doorway.
        - id: ch01-b13
          speaker: narrator
          text: Hooty the Owl reached down with his long, cruel claws, and Danny Meadow Mouse was caught at last!
