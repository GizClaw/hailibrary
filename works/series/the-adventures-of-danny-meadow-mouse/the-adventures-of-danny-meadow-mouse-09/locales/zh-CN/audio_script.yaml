audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 亲切而略带调侃的讲述
        timbre: 温暖清亮
        pace: 舒缓而有变化
        pitch: 中音
    danny_meadow_mouse:
      display_name: 草地鼠丹尼
      tts:
        delivery: 年轻直率，闹别扭时语气生硬
        timbre: 轻细明亮
        pace: 稍快
        pitch: 中高音
    hooty_the_owl:
      display_name: 猫头鹰胡蒂
      tts:
        delivery: 阴沉粗鲁，饿肚子时格外不耐烦
        timbre: 低沉浑厚
        pace: 从容偏慢
        pitch: 低音
  chapters:
    - id: ch01
      title: 月光下的小歌
      blocks:
        - id: ch01-b01
          speaker: danny_meadow_mouse
          text: 踮起脚尖轻轻跳，雪地玩耍真逍遥！一会儿看见，一会儿藏，想抓住我？休想休想！踮起脚尖轻轻跳，雪地玩耍真逍遥！
          emotion: happy
        - id: ch01-b02
          speaker: narrator
          text: 丹尼唱着这支歌，在铺满绿草地的白雪上蹦来跳去。说是唱歌，其实他只是在努力地唱。他那声音又细又小，还有点滑稽。要是你当时站在旁边，恐怕怎么也猜不到那是在唱歌，只会当成几声吱吱叫。可丹尼自己觉得唱得像模像样，心里也和拥有全世界最美的歌喉一样快活。歌声不就是心里的快乐跑出来，让大家听见了吗？
        - id: ch01-b03
          speaker: narrator
          text: 丹尼当然快活。他已经证明，自己比老狐狸奶奶更聪明了，这件事谁想起来都会得意。骗过她一次、两次的家伙或许还有几个，可谁能接连骗过她，叫她恼得彻底放弃呢？丹尼做到了，所以他觉得自己聪明极了，也高兴极了。
    - id: ch02
      title: 丹尼忘了天空
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 月光下面，丹尼边唱边跳，从一扇圆圆的小门钻进去，又从另一扇门里钻出来。他一直睁着尖利的小眼睛，提防狐狸奶奶和雷迪。可这么聪明的丹尼，偏偏漏掉了一件事。不错，先生，他把这件事忘得一干二净。他没有抬头看天空。他知道老粗腿鹰正在睡觉，不会来伤害他，却完全没想起猫头鹰胡蒂。
        - id: ch02-b02
          speaker: narrator
          text: 忘事真是个糟糕的习惯。要是谁都不忘事，世上的麻烦一定会少许多，真的会少许多。可是丹尼忘了。他又唱又跳，开心得不得了，一次也没朝天上望。
        - id: ch02-b03
          speaker: narrator
          text: 这时，绿森林里的胡蒂却没有这么快活。他这一晚运气很差，找了很久，也没捕到什么猎物，肚子饿得厉害，脾气也越来越坏。饿着肚子的时候，谁都容易发脾气。胡蒂找得越久，就越饿，心里也越烦。忽然，他想到了草地鼠丹尼。
        - id: ch02-b04
          speaker: hooty_the_owl
          text: 那个小家伙大概正躲在雪底下，睡得又暖和又安全。不过，他也可能出来了，哪怕只有那么一点点可能。说不定，他偏偏正在月光底下玩呢。我还是到草地上看看。
    - id: ch03
      title: 无声的影子
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 胡蒂飞起来时，连一丁点儿声音也没有，连最轻最轻的一点响动也听不见。看上去，他根本不像是在扇动翅膀，只像一道巨大的影子，在空中静静地向前飘。他展开宽大的翅膀，越过绿森林，滑向草地。胡蒂在夜里看得很清楚，就像大多数家伙在白天一样。
        - id: ch03-b02
          speaker: narrator
          text: 没过多久，他便瞧见丹尼在雪上蹦跳，一会儿钻进小圆门，一会儿又钻出来。胡蒂的两只大眼睛立刻亮了起来，目光也凶了起来。他没有发出一点声音，只在月光里慢慢靠近，最后飘到了丹尼头顶。
        - id: ch03-b03
          speaker: narrator
          text: 丹尼终于抬头了，可已经太迟。他的歌声一下子断了，只发出一声细细的惊叫。他转过身，拼命冲向最近的那扇圆门。胡蒂伸下又长又狠的利爪，紧接着，草地鼠丹尼终于被抓住了！
