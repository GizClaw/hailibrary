audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 亲切而略带调侃的讲述
        timbre: 温暖清亮
        pace: 舒缓而有变化
        pitch: 中音
    danny_meadow_mouse:
      display_name: 草地鼠丹尼
      tts:
        delivery: 年轻直率，闹别扭时语气生硬
        timbre: 轻细明亮
        pace: 稍快
        pitch: 中高音
    granny_fox:
      display_name: 老狐狸奶奶
      tts:
        delivery: 老练沉着，盘算时胸有成竹
        timbre: 低沉略带沙哑
        pace: 从容
        pitch: 中低音
    reddy_fox:
      display_name: 狐狸雷迪
      tts:
        delivery: 急躁自负，心里打算盘时透着狡猾
        timbre: 清亮略尖
        pace: 稍快
        pitch: 中高音
  chapters:
    - id: ch01
      title: 第六章　丹尼记起来了，雷迪却忘了
      blocks:
        - id: ch01-b01
          speaker: granny_fox
          text: 他又跑起来了！别让他再停下！
        - id: ch01-b02
          speaker: reddy_fox
          text: 我听到他的动静了！
        - id: ch01-b03
          speaker: narrator
          text: 雷迪喊着扑进雪里，学的正是一分钟前狐狸奶奶的动作。可他什么也没抓着。他喷掉鼻子里的雪，又把蒙住眼睛的雪擦干净。等他睁眼一看，狐狸奶奶也正好扎进雪中。她这一回同样扑了个空。
        - id: ch01-b04
          speaker: granny_fox
          text: 不要紧。只要逼着他不停地跑，我们就听得见。多试几次，总会抓住他的。再等一会儿，他累得没这么灵活了，那时嘛……
        - id: ch01-b05
          speaker: narrator
          text: 狐狸奶奶说到这里便住了口，只舔舔嘴角，又响亮地咂了咂嘴。雷迪咧嘴笑了，也舔了舔嘴角，跟着咂起嘴来。接着，两只狐狸又一次轮番往雪里扑。
        - id: ch01-b06
          speaker: narrator
          text: 雪下面，丹尼正在自己挖的小地道里逃命。正像狐狸奶奶料定的那样，他真的越来越累，气都快喘不上来了。丹尼浑身酸痛，一条腿还火辣辣的。狐狸奶奶有一回差点抓住他，利爪撕破了他的裤子，也在腿上留下了一道抓伤。
        - id: ch01-b07
          speaker: danny_meadow_mouse
          text: 哎呀，哎呀！要是能让我停下来想一想就好了！
          emotion: fearful
        - id: ch01-b08
          speaker: narrator
          text: 丹尼喘得上气不接下气。偏偏就在这时，雷迪猛地撞进地道，落在他的脚后跟旁边。丹尼吓得叫得更尖了。
        - id: ch01-b09
          speaker: danny_meadow_mouse
          text: 我得找个地方躲起来！一定得找个他们碰不到我的地方！
          emotion: fearful
        - id: ch01-b10
          speaker: narrator
          text: 丹尼一边抽泣，一边拼命地想。就在那一瞬间，他记起了旧篱笆柱。
        - id: ch01-b11
          speaker: narrator
          text: 那根柱子倒在地上，中间是空的，外面还钉着带尖利倒刺的长铁丝。下雪后的第一天，丹尼就挖通了一条通往那里的地道。他把一批种子偷偷藏在柱子的空洞里。刚才怎么会没想到这个藏身处呢？他一定是吓得根本没法思考了。
        - id: ch01-b12
          speaker: narrator
          text: 现在丹尼终于记起来，立刻拐进那条地道，跑得比先前还快。恐惧把他的心提到了嗓子眼儿，可心底也升起了希望。希望真是一样奇妙的东西。
        - id: ch01-b13
          speaker: narrator
          text: 狐狸奶奶熟悉那根旧篱笆柱，也记得钉在上面的带刺铁丝。铁丝虽被雪盖住，她仍清楚它们大概横在哪里。所以快到跟前时，她不再往雪里扑了。雷迪也知道那里有铁丝，只是兴奋得什么都忘了。
        - id: ch01-b14
          speaker: granny_fox
          text: 快停下！
        - id: ch01-b15
          speaker: narrator
          text: 雷迪或许没听见，或许听见了却不理。他的尖耳朵告诉他，丹尼正在脚下不远处奔跑。奶奶愿意停就停，他非得捉住丹尼当早饭不可。于是，他使出全身力气，再次扎进雪里。
        - id: ch01-b16
          speaker: reddy_fox
          text: 哎哟！哎哟！嗷！嗷！疼死我啦！
        - id: ch01-b17
          speaker: narrator
          text: 这声音可不属于丹尼。哎呀，当然不属于他！叫喊的是狐狸雷迪。真的，先生，正是雷迪。他落下去时，一只黑爪子恰好踩中铁丝的尖刺，可把他疼坏了。
        - id: ch01-b18
          speaker: granny_fox
          text: 我还从没见过哪只小狐狸像你这样会惹麻烦！忘了那些铁丝，你这是自作自受！
          emotion: angry
        - id: ch01-b19
          speaker: narrator
          text: 狐狸奶奶没好气地训着雷迪。雷迪只靠三条腿，一瘸一拐地跟在她身后，走过铺满白雪的绿草地。
        - id: ch01-b20
          speaker: reddy_fox
          text: 是，奶奶。
        - id: ch01-b21
          speaker: narrator
          text: 草地鼠丹尼却已经安全躲进旧篱笆柱的空洞里，正在包扎腿上那道被狐狸奶奶抓出的伤口。
