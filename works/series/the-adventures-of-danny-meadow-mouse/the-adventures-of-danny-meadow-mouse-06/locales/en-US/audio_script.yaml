audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm, observant storytelling
        timbre: clear and gentle
        pace: measured
        pitch: medium
    danny_meadow_mouse:
      display_name: Danny Meadow Mouse
      tts:
        delivery: youthful and plainly expressive
        timbre: small and bright
        pace: lively
        pitch: medium-high
    granny_fox:
      display_name: Granny Fox
      tts:
        delivery: sharp, seasoned, and commanding
        timbre: dry and weathered
        pace: deliberate
        pitch: medium-low
    reddy_fox:
      display_name: Reddy Fox
      tts:
        delivery: eager and impulsive
        timbre: bright and wiry
        pace: quick
        pitch: medium
  chapters:
    - id: ch01
      title: Danny Meadow Mouse Remembers and Reddy Fox Forgets
      blocks:
        - id: ch01-b01
          speaker: granny_fox
          text: There he goes! Don't give him another chance to stop!
        - id: ch01-b02
          speaker: reddy_fox
          text: I can hear him!
        - id: ch01-b03
          speaker: narrator
          text: Reddy Fox plunged into the snow, just as Granny Fox had done a moment before. He caught nothing. By the time he had blown the snow from his nose and wiped it from his eyes, Granny was diving in again. She had no better luck.
        - id: ch01-b04
          speaker: granny_fox
          text: That doesn't matter. If we keep him moving, we'll keep hearing him. One of us will catch him sooner or later. He'll soon be too tired to move so fast, and then—
        - id: ch01-b05
          speaker: narrator
          text: Granny stopped there. She licked her chops and smacked her lips. Reddy grinned and did the same. Then the two Foxes went back to taking turns, each one diving into the snow after Danny.
        - id: ch01-b06
          speaker: narrator
          text: Underneath them, Danny Meadow Mouse raced through the little tunnels he had made in the snow. Above him, Granny and Reddy kept crashing down, one after the other. Danny was running for his life, and he was tiring just as Granny Fox had predicted. He could hardly catch his breath. He was sore, and one leg smarted. On one of Granny's jumps, her claws had come so close that they had torn his pants and scratched him.
        - id: ch01-b07
          speaker: danny_meadow_mouse
          text: Oh, dear! Oh, dear! If I only had a moment to think!
          emotion: fearful
        - id: ch01-b08
          speaker: narrator
          text: Danny panted the words. Then Reddy Fox crashed into the tunnel right behind him, and Danny squealed in even greater fright.
        - id: ch01-b09
          speaker: danny_meadow_mouse
          text: I have to find someplace safe! I need a place where they can't reach me!
          emotion: fearful
        - id: ch01-b10
          speaker: narrator
          text: He sobbed as he ran. At that very moment, he remembered the old fence-post.
        - id: ch01-b11
          speaker: narrator
          text: The old fence-post lay hollow on the ground, with long wires fastened to it and cruel, sharp barbs along the wires. On the first day after the snow came, Danny had dug a tunnel over to the post. Inside its hollow center, he kept a secret store of seeds. Why hadn't he remembered it sooner? He had been too frightened to think. Now he turned into the tunnel that led there and ran faster than ever. Fear had put his heart in his mouth, but hope was in his heart too, and hope is a wonderful thing.
        - id: ch01-b12
          speaker: narrator
          text: Granny Fox knew all about that old fence-post and the barbed wires attached to it. Snow covered the wires, but she knew about where they lay. Just before she reached them, she stopped diving into the snow. Reddy knew about the wires too. In all his excitement, he had forgotten them.
        - id: ch01-b13
          speaker: granny_fox
          text: Stop!
        - id: ch01-b14
          speaker: narrator
          text: Granny's warning was sharp, but Reddy either did not hear it or paid no attention. His keen ears told him that Danny Meadow Mouse was running almost directly below. Granny could stop if she liked. Reddy meant to have Danny for breakfast. He threw himself down into the snow as hard as he could.
        - id: ch01-b15
          speaker: reddy_fox
          text: Oh! Oh! Wow! Wow! Oh, dear! Oh, dear!
        - id: ch01-b16
          speaker: narrator
          text: That was not Danny Meadow Mouse crying out. No, indeed. It was Reddy Fox. One black paw had landed squarely on a sharp wire barb, and it hurt dreadfully.
        - id: ch01-b17
          speaker: granny_fox
          text: I have never known a young Fox who finds as much trouble as you do! That's what you get for forgetting!
          emotion: angry
        - id: ch01-b18
          speaker: narrator
          text: Granny snapped at him as they crossed the snow-covered Green Meadows. Reddy hobbled behind her on three legs.
        - id: ch01-b19
          speaker: reddy_fox
          text: Yes'm.
        - id: ch01-b20
          speaker: narrator
          text: Safe inside the hollow fence-post, Danny Meadow Mouse was tending the scratch that Granny Fox's claws had made on his leg.
