audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm, observant storytelling
        timbre: clear and gentle
        pace: measured
        pitch: medium
    danny_meadow_mouse:
      display_name: Danny Meadow Mouse
      tts:
        delivery: youthful and plainly expressive
        timbre: small and bright
        pace: lively
        pitch: medium-high
    mr_toad:
      display_name: Mr. Toad
      tts:
        delivery: kindly, shrewd, and good-humored
        timbre: rough and rounded
        pace: unhurried
        pitch: medium-low
  chapters:
    - id: ch01
      title: Timid Danny Meadow Mouse
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Everybody says Danny Meadow Mouse is timid. What everybody says ought to be true, though anybody can make a mistake, and sometimes everybody can too. This time, they are probably right. Danny really is timid. Ask Peter Rabbit. Ask Sammy Jay. Ask Striped Chipmunk. Each of them will tell you the same thing.
        - id: ch01-b02
          speaker: narrator
          text: Sammy Jay may even claim that Danny is afraid of his own shadow, or that he tries to run away from his own tail. Neither claim is true, of course. Sammy likes saying mean things, and it would not be fair to Danny Meadow Mouse to believe everything Sammy says.
        - id: ch01-b03
          speaker: narrator
          text: Still, the plain fact is that Danny certainly is timid, and he is not the least little bit ashamed of it. One sunny morning, he sat on his doorstep talking with his friend, old Mr. Toad.
        - id: ch01-b04
          speaker: danny_meadow_mouse
          text: This is how I see it. If I weren't afraid, I wouldn't always be watching for danger. And if I didn't keep watch, I'd have no more chance than that foolish red ant running in front of you.
        - id: ch01-b05
          speaker: narrator
          text: Mr. Toad looked where Danny was pointing. His tongue flashed out and back so fast that Danny was not sure he had seen it move. But the ant had vanished, and a satisfied twinkle shone in Mr. Toad's eyes. Danny's eyes twinkled too as he went on.
        - id: ch01-b06
          speaker: danny_meadow_mouse
          text: No, sir. I wouldn't have stood one tiny bit more chance than that foolish ant did. Now, if I were big and strong like Old Man Coyote, or had swift wings like Skimmer the Swallow, or looked so homely and ugly that no one wanted me, like... like some folks I know, then I suppose I wouldn't be afraid.
        - id: ch01-b07
          speaker: narrator
          text: Mr. Toad looked up sharply when Danny mentioned people who were homely and ugly. Danny did not look back at him. He was gazing far across the Green Meadows with such an innocent face that Mr. Toad decided Danny could not possibly have meant him.
        - id: ch01-b08
          speaker: narrator
          text: Mr. Toad thoughtfully scratched his nose.
        - id: ch01-b09
          speaker: mr_toad
          text: Well, perhaps you're right. But fear seems very foolish to me. I don't even know what it feels like. I mind my own business, and no one bothers me. It must be terribly uncomfortable.
        - id: ch01-b10
          speaker: danny_meadow_mouse
          text: It is uncomfortable. But like I said, fear keeps me on guard when so many creatures are watching for me. Why, there's Mr. Blacksnake, and...
        - id: ch01-b11
          speaker: mr_toad
          text: Where?
          emotion: fearful
        - id: ch01-b12
          speaker: narrator
          text: Mr. Toad turned as pale as a toad can turn. He twisted this way and that, looking uneasily and anxiously in every direction for Mr. Blacksnake. Danny turned his head to hide a smile. If Mr. Toad was not showing fear, then no one ever had.
        - id: ch01-b13
          speaker: danny_meadow_mouse
          text: Oh, I didn't mean Mr. Blacksnake is nearby now. I was going to say that he and Granny Fox and Reddy Fox and Redtail the Hawk and Hooty the Owl are always watching for a chance to make their dinner out of poor little me. And I could name others too. Can you blame me for being afraid most of the time?
        - id: ch01-b14
          speaker: mr_toad
          text: No, I can't blame you. It must be dreadful to feel hungry eyes watching you every minute, day and night.
        - id: ch01-b15
          speaker: danny_meadow_mouse
          text: Oh, it isn't so bad. In fact, it's rather exciting. Besides, being afraid keeps my wits sharp all the time. I think life would be very dull indeed if I feared nothing and nobody, the way you do. By the way, look at that grass moving so strangely over there. It looks as if Mr. Blacksnake... Why, Mr. Toad, where are you going in such a hurry?
        - id: ch01-b16
          speaker: mr_toad
          text: I just remembered an important engagement with my cousin, Grandfather Frog, at the Smiling Pool!
        - id: ch01-b17
          speaker: narrator
          text: Mr. Toad shouted over his shoulder as he rushed away so fast that he tripped over his own feet.
        - id: ch01-b18
          speaker: narrator
          text: Left alone on his doorstep, Danny chuckled.
        - id: ch01-b19
          speaker: danny_meadow_mouse
          text: Oh, no, old Mr. Toad doesn't know what fear is! It's funny how some people won't admit what everyone else can plainly see. I am afraid, and I'm willing to say so.
