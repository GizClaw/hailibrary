audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 亲切而略带调侃的讲述
        timbre: 温暖清亮
        pace: 舒缓而有变化
        pitch: 中音
    danny_meadow_mouse:
      display_name: 草地鼠丹尼
      tts:
        delivery: 年轻直率，闹别扭时语气生硬
        timbre: 轻细明亮
        pace: 稍快
        pitch: 中高音
    old_mr_toad:
      display_name: 老蟾蜍先生
      tts:
        delivery: 老成自信，受惊时慌张却仍想维持体面
        timbre: 低沉粗哑
        pace: 平时从容，慌乱时明显加快
        pitch: 中低音
  chapters:
    - id: ch01
      title: 大家都说丹尼胆小
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 大家都说田鼠丹尼胆子小。大家都这么说，听起来总该没错吧？不过，谁都会弄错，大家当然也会。只是这一回，他们多半说对了。丹尼确实胆小。
        - id: ch01-b02
          speaker: narrator
          text: 你去问小兔彼得，问冠蓝鸦萨米，再问花栗鼠条纹，他们都会这么回答。萨米甚至可能说，丹尼怕自己的影子，还会躲着自己的尾巴跑。那可不是真的。萨米就爱说刻薄话，要是信了他，对丹尼可不公平。
        - id: ch01-b03
          speaker: narrator
          text: 不过，丹尼胆小倒是事实。而且，他一点儿也不觉得难为情，真的连一点儿也不觉得。
    - id: ch02
      title: 红蚂蚁的下场
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 一个晴朗的早晨，丹尼坐在家门口的台阶上，和朋友老蟾蜍先生聊天。
        - id: ch02-b02
          speaker: danny_meadow_mouse
          text: 事情是这样。我如果不害怕，就不会老是留神。我如果不老是留神，就会跟那只傻红蚂蚁一个下场。你看，它正从你面前跑过去。
        - id: ch02-b03
          speaker: narrator
          text: 老蟾蜍先生朝丹尼指的地方看过去。他的舌头飞快地伸出去，又缩了回来。动作实在太快，丹尼都不敢肯定自己看清没有。可是那只蚂蚁已经不见了，老蟾蜍先生眼里还闪着一丝满足的光。
        - id: ch02-b04
          speaker: narrator
          text: 丹尼眼里也有了笑意。他接着把自己的道理讲了下去。
        - id: ch02-b05
          speaker: danny_meadow_mouse
          text: 没错，先生，我能活下来的机会绝不会比那只傻蚂蚁多一点儿。我要是像老郊狼一样又高又壮，或者像燕子斯基默一样有飞得很快的翅膀，又或者长得寒碜难看，谁都不想要我，就像……就像……
        - id: ch02-b06
          speaker: narrator
          text: 丹尼犹豫了一下，后面的话说得不大利索。
        - id: ch02-b07
          speaker: danny_meadow_mouse
          text: 就像我认识的某些人。那样的话，我大概也不会害怕了。
        - id: ch02-b08
          speaker: narrator
          text: 一听丹尼提起长得寒碜难看的人，老蟾蜍先生立刻抬眼看他。可丹尼正远远望着绿草原，样子无辜极了。老蟾蜍先生想，丹尼说的应该不是自己。
    - id: ch03
      title: 谁不知道害怕
      blocks:
        - id: ch03-b01
          speaker: old_mr_toad
          text: 嗯，我想你也许说得对。不过我觉得，害怕真是件傻事。我从来不知道那是什么滋味。我只管自己的事，也从没人来找我的麻烦。老是害怕，准会很不好受。
        - id: ch03-b02
          speaker: narrator
          text: 老蟾蜍先生一边说，一边若有所思地挠着鼻子。
        - id: ch03-b03
          speaker: danny_meadow_mouse
          text: 的确不好受。不过我刚才也说了，有那么多家伙盯着我，害怕正好能让我随时提防。就说黑蛇先生，还有……
        - id: ch03-b04
          speaker: old_mr_toad
          text: 他在哪儿？
          emotion: fearful
        - id: ch03-b05
          speaker: narrator
          text: 老蟾蜍先生吓得脸色惨白，当然，是蟾蜍所能变出的最白脸色。他又不安又紧张，赶紧朝四面八方看。
        - id: ch03-b06
          speaker: narrator
          text: 丹尼转过头，偷偷藏住笑容。老蟾蜍先生要是还不算害怕，那就没人知道什么叫害怕了。
        - id: ch03-b07
          speaker: danny_meadow_mouse
          text: 我不是说黑蛇先生现在就在附近。我本来是想说，黑蛇先生、狐狸奶奶、红狐狸雷迪、红尾鹰、猫头鹰胡蒂，还有好多我叫得出名字的家伙，都在等机会拿可怜的小丹尼当晚餐。你说，我怎么可能不常常害怕呢？
        - id: ch03-b08
          speaker: old_mr_toad
          text: 不奇怪，我一点儿也不奇怪你会害怕。白天黑夜，每时每刻都觉得有饥饿的眼睛盯着自己，那一定可怕极了。
    - id: ch04
      title: 急匆匆的约会
      blocks:
        - id: ch04-b01
          speaker: danny_meadow_mouse
          text: 其实也没那么糟，还挺刺激的。害怕也让我一直保持机灵。要是像你一样，什么都不怕，谁也不怕，我恐怕会觉得日子无聊透顶。
        - id: ch04-b02
          speaker: danny_meadow_mouse
          text: 对了，你看看那边的草，怎么动得那么奇怪？看起来好像是黑蛇先生……咦，蟾蜍先生，你这么着急要去哪儿？
        - id: ch04-b03
          speaker: old_mr_toad
          text: 我刚想起来，我和表亲青蛙爷爷约好在微笑池塘见面，还有一件要紧事！
          emotion: fearful
        - id: ch04-b04
          speaker: narrator
          text: 老蟾蜍先生一边拼命赶路，一边回头大声回答。他跑得太急，竟然被自己的脚绊倒了。
        - id: ch04-b05
          speaker: narrator
          text: 丹尼独自坐在门阶上，忍不住咯咯笑了起来。
        - id: ch04-b06
          speaker: danny_meadow_mouse
          text: 对呀，老蟾蜍先生根本不知道害怕是什么！有些人真有意思，明明大家一眼就能看出来，他们偏偏不肯承认。我呢，我确实会害怕，也愿意老实说出来。
