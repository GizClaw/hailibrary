  chapters:
    - id: ch01
      title: Peter Rabbit Is Caught in a Snare
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Peter Rabbit reached up to nibble the bark of one of Farmer Brown's young trees. Then something tugged at one of his hind legs. Peter jumped in fright and tried to get away, but instead he fell flat on his face. Whatever had caught his leg pulled tight and held him fast.
        - id: ch01-b02
          speaker: narrator
          text: Fear swept over Peter. He lay there in the snow, kicking and struggling with all his might. But every kick only made that hateful thing tighten around his leg. At last he was too tired to fight anymore, so he lay still. His leg hurt where the dreadful thing held it, but as long as he stayed still, it did not pull.
        - id: ch01-b03
          speaker: narrator
          text: Once Peter felt a little calmer, he sat up and examined what had caught him. It reminded him of the blackberry vines he sometimes tripped over. But this thing was bright and shiny. It had no branches or tiny prickers, and one end was tied to a stake. Peter tried to bite through it, but even his great, sharp front teeth could not make a cut.
        - id: ch01-b04
          speaker: narrator
          text: Then Peter understood. It was wire! Farmer Brown had set a snare to catch him, and Peter had walked straight into it. He had been so greedy for the young peach tree's bark that he had forgotten to use his eyes and watch for danger.
        - id: ch01-b05
          speaker: narrator
          text: Oh, how Peter wished he had not been so curious about Farmer Brown's work that day. He wished he had gone straight home, just as he had planned, instead of trying to get one more meal of young peach bark. Big tears rolled down his cheeks. What was he going to do? What could he do?
        - id: ch01-b06
          speaker: narrator
          text: For a long time, Peter sat in the moonlight and tried to think. At last, his thoughts turned to the stake holding the hateful wire. The wire was too strong for his teeth, but the stake was made of wood. His teeth could cut wood! Hope leaped in Peter's heart. Right away, he dug the snow from around the stake. Then he settled down and began gnawing through it.
        - id: ch01-b07
          speaker: narrator
          text: Peter worked and worked on that stake. He had gnawed a little more than halfway through when a loud sniff came from the far end of the orchard. Peter looked up. And whom do you think he saw? Bowser the Hound! Bowser had not noticed Peter yet, but he had already found Peter's tracks. In only a few minutes, those tracks would lead him straight to Peter.
        - id: ch01-b08
          speaker: narrator
          text: Poor Peter! There was no time to finish chewing through the stake. What could he do? He made one frightened leap, just as he had when the wire first caught his leg, and once again he landed flat on his face. Peter scrambled up and tried another leap. Down he went, exactly as before.
        - id: ch01-b09
          speaker: narrator
          text: Just then, Bowser saw him. The Hound opened his mouth and let out a great roar. Peter gave one last desperate jump. Snap! The stake broke. Peter pitched forward onto his head, tumbled in a somersault, and scrambled back to his feet. At last, he was free! He could run now, though a piece of the stake still dragged behind him.
        - id: ch01-b10
          speaker: narrator
          text: And how Peter ran! Dragging that piece of stake made every bound hard, but he kept going. He reached the old stone wall at the side of the orchard just in time and crawled inside. Bowser could only stand outside and bark his disappointment up at the moon.
