audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 亲切而略带调侃的讲述
        timbre: 温暖清亮
        pace: 舒缓而有变化
        pitch: 中音
    peter_rabbit:
      display_name: 小兔彼得
      tts:
        delivery: 好奇活泼，心思全写在语气里
        timbre: 清亮稚嫩
        pace: 轻快
        pitch: 中高音
  chapters:
    - id: ch01
      title: 铁丝圈套
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 小兔彼得直起身子，正要啃农夫布朗一棵小树的树皮，忽然有样东西扯住了他的一条后腿。他吓得赶紧往外跳，没想到不但没有逃开，反而一头扑倒在地。腿上的东西一下收紧，把他牢牢套住了。
        - id: ch01-b02
          speaker: narrator
          text: 彼得害怕极了。他躺在雪地上，使出全身力气又踢又挣。可他越挣扎，那个可恨的东西就勒得越紧。最后，他累得再也踢不动，只能安静地躺下来。腿还是被勒得生疼，不过，只要他不动，那东西就不会继续拉扯。
        - id: ch01-b03
          speaker: narrator
          text: 等心里稍微平静一点儿，彼得坐起来，仔细看了看困住自己的东西。它有些像会绊住他的黑莓藤，却亮闪闪的，没有枝杈，也没有细刺，一头还拴在木桩上。
        - id: ch01-b04
          speaker: narrator
          text: 彼得张嘴去咬，连他那对又大又锋利的门牙也咬不断。这下他明白了，这是铁丝，是农夫布朗设来捉他的圈套。彼得只顾着贪吃小桃树的嫩皮，忘了留心危险，竟然自己走进了圈套。
    - id: ch02
      title: 月光下的希望
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 唉，彼得真希望自己没有那么好奇，没有留下来看农夫布朗在忙什么。他本来都决定直接回家了，为什么还非要多吃一顿小桃树皮呢？大颗大颗的眼泪从他的脸颊上滚了下来。
        - id: ch02-b02
          speaker: narrator
          text: 现在该怎么办？还有什么办法呢？彼得坐在月光里，想了很久很久。终于，他想到了拴住铁丝的木桩。木桩是木头做的，而他的牙齿能咬木头。希望在彼得心里猛地跳了一下。
        - id: ch02-b03
          speaker: narrator
          text: 他马上刨开木桩周围的雪，伏下身子，一口接一口地啃起来，决心把木桩咬断。彼得辛苦干了很久，眼看已经咬断了一多半，桃园另一头突然传来一声响亮的嗅鼻声。
        - id: ch02-b04
          speaker: narrator
          text: 彼得抬头一看。你猜谁来了？竟然是猎犬鲍泽！鲍泽还没有看见彼得，却已经找到了他留在雪地上的脚印。再过不了几分钟，鲍泽就会找到他了。
    - id: ch03
      title: 拖着木桩逃跑
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 可怜的彼得已经来不及把木桩完全咬断了。他还能怎么办？彼得吓得纵身一跳，跟刚被铁丝扯住时一模一样。他又一头摔在地上，赶紧爬起来再跳，却还是被狠狠摔倒。
        - id: ch03-b02
          speaker: narrator
          text: 就在这时候，鲍泽看见了他。那只猎犬张开大嘴，发出一声震天的吼叫。彼得拼尽力气，又跳了一次。只听啪的一声，木桩终于断了！彼得一头栽出去，翻了个跟头，又挣扎着爬起来。
        - id: ch03-b03
          speaker: narrator
          text: 他总算自由了！好吧，也不能说完全自由。彼得现在确实能跑了，可身后还拖着半截木桩。
        - id: ch03-b04
          speaker: narrator
          text: 彼得跑得可真快！拖着木桩跑当然很费劲，可他还是跑了起来。就在鲍泽追上以前，他及时钻进了桃园一侧的老石墙。鲍泽没能捉住彼得，只好对着月亮汪汪大叫，把满肚子的失望全叫了出来。
