audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 亲切而略带调侃的讲述
        timbre: 温暖清亮
        pace: 舒缓而有变化
        pitch: 中音
    danny_meadow_mouse:
      display_name: 草地鼠丹尼
      tts:
        delivery: 年轻直率，闹别扭时语气生硬
        timbre: 轻细明亮
        pace: 稍快
        pitch: 中高音
  chapters:
    - id: ch01
      title: 第一章　草地鼠丹尼在发愁
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 草地鼠丹尼坐在家门口，双手托着下巴。瞧他那副模样，谁都知道他心里有事。臭鼬吉米经过时，他只点了一下头。就连兔子彼得来问候他，也没听见一句好声气。
        - id: ch01-b02
          speaker: danny_meadow_mouse
          text: 彼得，早上好。
        - id: ch01-b03
          speaker: narrator
          text: 丹尼可不是在为昨天的事烦恼。昨天他打了个盹，差点儿被狐狸雷迪捉去送了命，可他已经记住了教训，往后不会再让雷迪得手。他也不是嫌没人陪着玩。正相反，他还挺愿意一个人待着。丹尼真正的毛病，是心里有件事怎么也放不下。
        - id: ch01-b04
          speaker: narrator
          text: 发愁是世上最糟糕的事之一。丹尼明明没什么值得烦恼，却偏偏找了件事折磨自己。一个人越想越别扭，身边的人也会跟着不舒服。那天早晨，花栗鼠条纹已经两次叫他“臭脾气”。就连昨天替他跟雷迪打过一架的土拨鼠约翰尼，也说他是个“气包子”。丹尼到底在愁什么呢？原来，他只是嫌自己的尾巴太短。没错，就是这么回事。那个阳光明亮的早晨，他不痛也不病，烦的就只有这件事。
        - id: ch01-b05
          speaker: narrator
          text: 有些人总拿自己的长相跟自己过不去。他们嫌自己不漂亮，嫌脸上有雀斑，又嫌个子太高或太矮，身材太胖或太瘦。为这些事烦恼，实在很傻。丹尼嫌尾巴短，其实也傻得一样。
        - id: ch01-b06
          speaker: narrator
          text: 不过，他的尾巴确实很短，短得不能再短了。以前丹尼从没在意过，直到有一天，他碰见了住在绿森林里的表亲白脚。白脚穿得很体面，最神气的还是那条细长又漂亮的尾巴。丹尼这才猛然觉得，自己那条短粗的小尾巴太难看了。他羞得头都快抬不起来，简直不像一只堂堂正正的草地鼠。从此，他想来想去，总不明白自家这一族为什么都长着短尾巴。想着想着，他嫉妒起白脚来。他盼了一遍又一遍，只想也有那样一条长尾巴。
        - id: ch01-b07
          speaker: narrator
          text: 丹尼光顾着盼一条长尾巴，竟忘了照看自己原有的尾巴，差一点儿连尾巴和性命都保不住。沼泽鹰老白尾看见他坐在门口闷闷不乐，便贴着草尖静悄悄地滑翔过来，眼看就要抓住他。幸亏一阵快乐的小微风赶来相救，丹尼才没落进鹰爪。这场危险，全是嫉妒招来的。
        - id: ch01-b08
          speaker: narrator
          text: 嫉妒真是个坏毛病，坏得很。
