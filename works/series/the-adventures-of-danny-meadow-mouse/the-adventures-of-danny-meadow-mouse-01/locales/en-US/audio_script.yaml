  chapters:
    - id: ch01
      title: Danny Meadow Mouse Is Worried
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Danny Meadow Mouse sat on his doorstep, his chin resting in his hands. Anyone could see that something was troubling him. When Jimmy Skunk passed, Danny only nodded. Even Peter Rabbit got nothing but a cross little greeting.
        - id: ch01-b02
          speaker: danny_meadow_mouse
          text: Good morning.
        - id: ch01-b03
          speaker: narrator
          text: Danny wasn't upset because Reddy Fox had caught him napping the day before and had nearly finished him. He had learned from that fright. Reddy would never catch him that way again. And Danny wasn't lonely. Right then, he was glad no one had come to play. The truth was simple. Danny Meadow Mouse was worried.
        - id: ch01-b04
          speaker: narrator
          text: Worry is one of the worst things in the world. Danny seemed to have nothing worth worrying about, but finding a worry is easy. Soon you make yourself miserable, and before long everyone around you feels miserable too. That was what Danny had done that morning.
        - id: ch01-b05
          speaker: striped_chipmunk
          text: You're a real Cross Patch today, Danny.
        - id: ch01-b06
          speaker: narrator
          text: Striped Chipmunk had said that twice.
        - id: ch01-b07
          speaker: johnny_chuck
          text: My, you're grumpy this morning.
        - id: ch01-b08
          speaker: narrator
          text: That came from Johnny Chuck, who had fought Reddy Fox for Danny only the day before. So what was bothering Danny Meadow Mouse? His tail was short. Yes, sir, that was the whole trouble on that bright morning.
        - id: ch01-b09
          speaker: narrator
          text: Some people make themselves unhappy over the way they look. They fret because they think they're homely, or because they have freckles. They worry about being short or tall, thin or stout. It's foolish, and Danny was just as foolish to worry about his short tail.
        - id: ch01-b10
          speaker: narrator
          text: It truly was short. Danny had never understood just how short it was until he happened to meet his cousin Whitefoot, who lived in the Green Forest. Whitefoot was dressed very elegantly, but what caught Danny's eye was his beautiful tail. It was long and slim, and it made quite an impression.
        - id: ch01-b11
          speaker: narrator
          text: At once, Danny became painfully aware of his own little stub of a tail. He could hardly hold his head up with the proper pride of an honest Meadow Mouse. After that, he kept thinking about why his whole family had such short tails. Then envy crept in. He wished and wished and wished for a long tail like Whitefoot's.
        - id: ch01-b12
          speaker: narrator
          text: Danny was so busy wishing for a long tail that he forgot to protect the tail he already had. He nearly lost that tail, and his life along with it. Old Whitetail the Marsh Hawk spotted Danny moping on his doorstep. He sailed over the meadow grass so quietly that he almost caught him.
        - id: ch01-b13
          speaker: narrator
          text: One of the Merry Little Breezes saved Danny just in time. Without that breeze, the hawk would have caught him. And it all happened because Danny was envious. Envy is a bad, bad habit.
