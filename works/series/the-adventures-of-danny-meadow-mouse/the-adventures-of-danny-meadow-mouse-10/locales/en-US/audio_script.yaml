audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm, observant storytelling
        timbre: clear and gentle
        pace: measured
        pitch: medium
    danny_meadow_mouse:
      display_name: Danny Meadow Mouse
      tts:
        delivery: youthful and plainly expressive
        timbre: small and bright
        pace: lively
        pitch: medium-high
    hooty_the_owl:
      display_name: Hooty the Owl
      tts:
        delivery: stern and menacing
        timbre: deep and hollow
        pace: deliberate
        pitch: low
  chapters:
    - id: ch01
      title: A Strange Ride and How It Ended
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Danny Meadow Mouse had often sat and watched Skimmer the Swallow sail through the blue, blue sky. He had seen Ol' Mistah Buzzard climb higher and higher until he was only a tiny speck. Danny used to wonder what it would feel like to be far above the Green Meadows and the Green Forest, looking down. It must be wonderful and beautiful, he thought. Sometimes he even wished for wings so he could rise into the air and see it for himself. And now Danny Meadow Mouse was really doing that very thing!
        - id: ch01-b02
          speaker: narrator
          text: But Danny could see nothing wonderful or beautiful now. Everything was terrible. He was not flying on wings of his own. He was being carried through the air in the cruel claws of Hooty the Owl! It had happened because Danny had forgotten something very important. He had forgotten to watch the sky for danger.
        - id: ch01-b03
          speaker: narrator
          text: Poor Danny! Hooty's great claws hurt him dreadfully, but the pain was not the worst part. What frightened Danny most was the thought of reaching Hooty's home in the Green Forest. Once they got there, Hooty would gobble him up, bones and all. As they flew, Hooty kept chuckling to himself. Danny understood those chuckles very well. Hooty was thinking about the good meal he meant to have.
        - id: ch01-b04
          speaker: narrator
          text: Hanging there in Hooty's claws, Danny looked down at the snow-covered Green Meadows he loved so well. They seemed terribly far below, though Hooty was really flying quite low. Danny had never been this high in all his life. To him, it felt as if he were far, far up in the sky. He closed his eyes so he would not have to see how high he was.
        - id: ch01-b05
          speaker: narrator
          text: Yet Danny could not keep his eyes shut. No matter how he tried, he simply had to open them again and look. The dear old Green Forest was coming nearer and nearer. Danny had always thought it was beautiful. Now it looked dreadful, because somewhere inside that forest, in a dark place, stood Hooty's home.
        - id: ch01-b06
          speaker: narrator
          text: Just ahead lay the Old Briar-patch, where Peter Rabbit lived in safety. Snow covered every old bramble, and the whole patch was very beautiful. In fact, everything was as beautiful as ever. The moonlight, the Green Forest, the snowy Green Meadows, and the Old Briar-patch had not changed. Only Danny had changed, and that was because he had forgotten.
        - id: ch01-b07
          speaker: narrator
          text: All at once, Danny began to wriggle and struggle.
        - id: ch01-b08
          speaker: hooty_the_owl
          text: Stop squirming!
          emotion: angry
        - id: ch01-b09
          speaker: narrator
          text: Danny only struggled harder. It seemed to him that Hooty's grip was not as tight as it had been at first. Then Danny felt one of those claws slip. It tore his coat and hurt dreadfully, but it slipped. That was what mattered.
        - id: ch01-b10
          speaker: narrator
          text: The truth was, Hooty had caught only the loose part of Danny's coat. Up in the air, he had no way to take a better hold. Danny kicked, squirmed, and twisted. Then he twisted, squirmed, and kicked some more. He felt his coat tear, and the skin tore with it. Still, Danny kept going, because now he was hanging almost free. Hooty started flying down so he could get a firmer grip. Danny gave one last kick. Then he felt himself falling!
        - id: ch01-b11
          speaker: narrator
          text: Danny shut his eyes and held his breath. Down, down, down he fell. It felt as though he would never reach the snowy meadow. In truth, he fell only a short way, but to Danny it seemed like a terrible distance.
        - id: ch01-b12
          speaker: narrator
          text: Something scratched him. Then, plump! Danny landed in the soft snow, right in the middle of the Old Briar-patch.
        - id: ch01-b13
          speaker: narrator
          text: The last thing Danny remembered was Hooty the Owl screaming with disappointment and rage.
