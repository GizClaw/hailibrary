audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 亲切而略带调侃的讲述
        timbre: 温暖清亮
        pace: 舒缓而有变化
        pitch: 中音
    danny_meadow_mouse:
      display_name: 草地鼠丹尼
      tts:
        delivery: 年轻直率，闹别扭时语气生硬
        timbre: 轻细明亮
        pace: 稍快
        pitch: 中高音
    hooty_the_owl:
      display_name: 猫头鹰胡蒂
      tts:
        delivery: 阴沉粗鲁，饿肚子时格外不耐烦
        timbre: 低沉浑厚
        pace: 从容偏慢
        pitch: 低音
  chapters:
    - id: ch01
      title: 真的飞上了天空
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 丹尼常常坐着仰望天空。他看燕子斯基默在蓝天里自在地飞，也看老秃鹰先生越升越高，直到变成一个小黑点。每到这时，他总会想，要是自己也飞到绿草地和绿森林上方，再从高处往下看，那会是什么滋味？一定又神奇又美丽吧。有时，他真希望自己也有一双翅膀，可以飞上去亲眼瞧一瞧。
        - id: ch01-b02
          speaker: narrator
          text: 现在，草地鼠丹尼竟然真的在天上飞了！可眼前哪有什么神奇和美丽？没有，一点儿也没有。一切都可怕极了。因为丹尼不是自己飞上来的，他正被猫头鹰胡蒂抓在利爪里，从空中带走。不错，先生，这全怪丹尼忘了一件事。他忘了抬头看看，天空中有没有危险。
        - id: ch01-b03
          speaker: narrator
          text: 可怜的丹尼！胡蒂又大又狠的爪子抓得他疼痛难忍，可最折磨他的还不是这份疼。不错，先生，最可怕的不是疼，真的不是。他知道，胡蒂一回到绿森林里的家，就会把他连皮带骨地吞下去。一路上，胡蒂不住地窃笑。丹尼听得懂那种笑声。胡蒂正在盘算着，自己马上就能美美地吃上一顿了。
    - id: ch02
      title: 越来越近的绿森林
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 丹尼被利爪吊在空中，低头望着自己深爱的绿草地。白雪覆盖的草地好像落在很深很深的下方，其实胡蒂飞得很低，它并没有那么远。只不过丹尼一生中从没到过这么高的地方，才觉得自己已经升到了高高的天空。
        - id: ch02-b02
          speaker: narrator
          text: 他吓得闭上眼，可没过一会儿，又忍不住睁开了。不错，先生，他就是没法一直闭着眼睛。前方，那片亲爱的老绿森林越来越近。往日里，丹尼总觉得它美极了，现在却越看越可怕。因为森林的某个阴暗角落里，就是猫头鹰胡蒂的家。
        - id: ch02-b03
          speaker: narrator
          text: 再往前，就是小兔彼得安安全全住着的老荆棘丛。那些苍老的荆棘全都披着白雪，漂亮得不得了。其实，眼前的一切都和从前一样美。月光没有变，绿森林没有变，白雪覆盖的绿草地和老荆棘丛也没有变。变的只有丹尼自己，而这一切，都因为他忘了留心。
    - id: ch03
      title: 掉进老荆棘丛
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 忽然，丹尼扭起身子，拼命挣扎。
        - id: ch03-b02
          speaker: hooty_the_owl
          text: 别乱动！
          emotion: angry
        - id: ch03-b03
          speaker: narrator
          text: 丹尼不但没停，反而挣扎得更凶了。他感觉胡蒂抓得不像刚才那么紧。有一根利爪滑了一下，撕破了他的皮毛，痛得厉害。可它到底是滑开了！
        - id: ch03-b04
          speaker: narrator
          text: 原来，胡蒂只抓住了丹尼身上一块松松的皮毛。飞在空中，他没法再换个地方抓牢。丹尼又踢又扭，左挣右拧，拧了又挣，挣了又踢，怎么也不肯停。皮毛撕开了，连皮肉也跟着裂开，可这时的丹尼几乎已经挣脱了。
        - id: ch03-b05
          speaker: narrator
          text: 胡蒂开始往下降，想把丹尼重新抓紧。就在这时，丹尼又猛踢了一下。接着，他突然觉得身子一轻，自己掉了下去！
        - id: ch03-b06
          speaker: narrator
          text: 丹尼赶紧闭紧眼睛，屏住呼吸。他往下落，往下落，一直往下落，仿佛永远也碰不到白雪覆盖的草地。其实，他只落下很短一段距离，可在丹尼心里，这段距离长得吓人。
        - id: ch03-b07
          speaker: narrator
          text: 他先撞上了什么，被刮得生疼，随后扑通一声落进松软的雪里，正好掉在老荆棘丛中央。后来，他只记得自己听见了猫头鹰胡蒂又失望又愤怒的尖叫。
