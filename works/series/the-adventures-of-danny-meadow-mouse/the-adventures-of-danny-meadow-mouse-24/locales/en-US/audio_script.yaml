audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm, observant storytelling
        timbre: clear and gentle
        pace: measured
        pitch: medium
    danny_meadow_mouse:
      display_name: Danny Meadow Mouse
      tts:
        delivery: earnest, gentle, and plainly expressive
        timbre: small and warm
        pace: measured
        pitch: medium-high
    reddy_fox:
      display_name: Reddy Fox
      tts:
        delivery: sly, boastful, and sharply expressive
        timbre: lean and raspy
        pace: deliberate
        pitch: medium-low
  chapters:
    - id: ch01
      title: Reddy Thinks He Has Danny
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Reddy Fox had caught Danny Meadow Mouse, and yet he hadn't caught him. He had found Danny hiding in the old tomato can. It never occurred to Reddy that he might not be able to get Danny out whenever he pleased.
        - id: ch01-b02
          speaker: narrator
          text: Reddy wasn't in a hurry. He had eaten a good breakfast of grasshoppers, so he decided to torment Danny for a while before gobbling him up. Reddy lay down by the open end of the can and peeped inside. At the far end, Danny was trying to make himself as small as he possibly could.
        - id: ch01-b03
          speaker: narrator
          text: Reddy grinned so widely that all his long teeth showed. He was always a bully, especially when his victim was much smaller and weaker than he was.
        - id: ch01-b04
          speaker: reddy_fox
          text: Well, Mr. Smarty, I've finally got you. Haven't I?
        - id: ch01-b05
          speaker: narrator
          text: Danny said nothing.
        - id: ch01-b06
          speaker: reddy_fox
          text: You thought you were so clever when you fooled me those other times. But now I've got you in a place where none of your tricks will help. What are you going to do this time?
        - id: ch01-b07
          speaker: narrator
          text: Danny still didn't answer. He was too frightened to speak, and he had no idea what he could do. He stayed perfectly still, but his bright eyes never left Reddy's cruel face.
        - id: ch01-b08
          speaker: narrator
          text: Even while he was frightened, Danny was thinking as hard as he could. He had been trapped in tight places before, and he had learned never to give up hope. Something might happen and scare Reddy away. Besides, Reddy still had to get him out of that old can. Until then, Danny wouldn't admit that he was truly caught.
    - id: ch02
      title: Danny Bites Back
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: For a long time, Reddy lay there licking his chops. He said every frightening thing he could think of to poor Danny Meadow Mouse. At last, Reddy got tired of teasing him. He decided it was time to finish the matter and finish Danny at the same time.
        - id: ch02-b02
          speaker: narrator
          text: Reddy pushed his sharp nose into the opening of the old can. But the opening was too small. He could get only his nose inside, and the sharp edge scratched it. He couldn't even touch Danny.
        - id: ch02-b03
          speaker: reddy_fox
          text: Then I'll drag you out with my paw.
        - id: ch02-b04
          speaker: narrator
          text: Reddy thrust one black paw into the can. Danny promptly bit down so hard that Reddy yelped in pain and jerked his paw out.
        - id: ch02-b05
          speaker: narrator
          text: After a moment, Reddy tried again with his other paw. This time Danny bit even harder. Reddy danced about in pain and anger.
        - id: ch02-b06
          speaker: narrator
          text: Then Reddy completely lost his temper. Losing your temper is always foolish, and it was very foolish now. Reddy struck the old can, and away it rolled with Danny Meadow Mouse still inside.
        - id: ch02-b07
          speaker: narrator
          text: That only made Reddy angrier. He leaped after the can and struck it again. Then he batted it one way and the other, growing more furious with every blow. Danny managed to stay inside the whole time, though the tumbling gave him a terrible shaking.
    - id: ch03
      title: The Can Rolls to Safety
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: Back and forth across the patch of short grass went the old can as Reddy knocked it about. He was in such a rage that he never noticed where he was sending it.
        - id: ch03-b02
          speaker: narrator
          text: At last, one blow sent the can spinning into the long grass on the far side of the open patch. It stopped close to one of Danny's own private little paths.
        - id: ch03-b03
          speaker: narrator
          text: Danny shot out of the can like a flash and raced along the little path. He dodged into a second path, then into a third. That one led him to a tangle of barbed wire Farmer Brown had left behind when he built a new fence. Once Danny slipped under the wire, he was safe.
        - id: ch03-b04
          speaker: danny_meadow_mouse
          text: Phew! That was my narrowest escape yet! But I think I'll still find the special grass seed I came out to get.
        - id: ch03-b05
          speaker: narrator
          text: Danny was breathing very hard when he said it. And he did go on to find that special grass seed. As for Reddy Fox, he still wonders how Danny escaped from the old tomato can without being seen.
    - id: ch04
      title: What Temper Does
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: And so you see what temper does when someone lets it take control. It cheats them of the very thing they worked so hard to gain.
        - id: ch04-b02
          speaker: narrator
          text: Danny had many more adventures, but there isn't room to tell them here. Besides, Grandfather Frog is eager for you to hear about the strange things that happened to him. Those stories are told in the next book.
