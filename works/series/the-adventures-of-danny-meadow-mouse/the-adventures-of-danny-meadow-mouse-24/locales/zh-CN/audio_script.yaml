audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 亲切而略带调侃的讲述
        timbre: 温暖清亮
        pace: 舒缓而有变化
        pitch: 中音
    danny_meadow_mouse:
      display_name: 草地鼠丹尼
      tts:
        delivery: 年轻直率，闹别扭时语气生硬
        timbre: 轻细明亮
        pace: 稍快
        pitch: 中高音
    reddy_fox:
      display_name: 狐狸雷迪
      tts:
        delivery: 急躁自负，心里打算盘时透着狡猾
        timbre: 清亮略尖
        pace: 稍快
        pitch: 中高音
  chapters:
    - id: ch01
      title: 捉住了，又没完全捉住
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 狐狸雷迪找到了躲在旧番茄罐里的田鼠丹尼。可这算捉住了吗？算，也不算。雷迪根本没想到，等他真想抓丹尼的时候，自己会拿这个小家伙没办法。
        - id: ch01-b02
          speaker: narrator
          text: 雷迪并不着急。他刚用蚱蜢吃了一顿挺不错的早饭，便想先吓唬丹尼一阵，再把他吞掉。
        - id: ch01-b03
          speaker: narrator
          text: 雷迪趴在罐头开口前，朝里面张望。丹尼缩在最里面，恨不得把身子变得越小越好。雷迪咧着嘴直笑，露出满口长牙。他最爱欺负比自己弱小得多的对手。
        - id: ch01-b04
          speaker: reddy_fox
          text: 自作聪明的家伙，这一次总算落到我手里了吧？
        - id: ch01-b05
          speaker: narrator
          text: 丹尼一声不吭。
        - id: ch01-b06
          speaker: reddy_fox
          text: 你耍过我两三次，就以为自己很聪明，对不对？这回你跑不了啦。你那些花招都没用了，我看你现在还能怎么办！
        - id: ch01-b07
          speaker: narrator
          text: 丹尼还是没有回答。他怕得说不出话，也实在想不出办法，只能一动不动地待着。可他那双亮眼睛，一刻也没有离开雷迪凶狠的脸。
    - id: ch02
      title: 丹尼不肯放弃希望
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 丹尼心里虽然害怕，脑子却没有停。他以前也陷入过绝境，因此懂得，不能轻易放弃希望。也许会出点儿什么事，把雷迪吓走呢。
        - id: ch02-b02
          speaker: narrator
          text: 再说，雷迪还没把他弄出旧罐头。只要还待在里面，丹尼就不肯承认自己真的被捉住了。
        - id: ch02-b03
          speaker: narrator
          text: 雷迪趴在那里，馋得直舔嘴。他把能想到的吓人话全说了一遍，只想让可怜的丹尼更害怕。过了好久，他终于玩腻了，决定把这场游戏和丹尼一起解决掉。
        - id: ch02-b04
          speaker: narrator
          text: 雷迪把尖鼻子伸进罐口。可开口太小，只塞得进他的鼻子。罐头锋利的边沿刮疼了他，他却连丹尼都没碰着。
        - id: ch02-b05
          speaker: reddy_fox
          text: 等着瞧，我这就把你拖出来！
        - id: ch02-b06
          speaker: narrator
          text: 说完，雷迪把一只黑爪子伸了进去。
    - id: ch03
      title: 雷迪大发脾气
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 丹尼立刻狠狠咬住那只爪子。雷迪疼得尖叫起来，赶紧把爪子抽了出去。过了一会儿，他又把另一只爪子伸进罐头。丹尼这一口咬得更重，雷迪又痛又气，在地上直跳。
        - id: ch03-b02
          speaker: narrator
          text: 这下，雷迪彻底发起了脾气。发脾气从来不是聪明的做法，这一次当然也一样。他一爪拍中旧罐头，罐头载着丹尼滚了出去。
        - id: ch03-b03
          speaker: narrator
          text: 雷迪见了更加恼火。他追上去，又拍了一爪。接着一下打到这边，一下打到那边，越打越生气。丹尼在罐头里被颠得够呛，却一直没有掉出来。
        - id: ch03-b04
          speaker: narrator
          text: 旧罐头就这样在短草地上来回滚动。雷迪气昏了头，只顾着乱拍，根本没注意罐头滚向了哪里。
    - id: ch04
      title: 罐头滚进长草
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 最后，雷迪又拍了一下。旧罐头旋转着冲进空地另一边的长草，正好停在丹尼的一条私家小路旁。
        - id: ch04-b02
          speaker: narrator
          text: 丹尼一下钻出罐头，沿着小路飞奔。他先拐进另一条小路，随后又转入第三条。这条路通向一团带刺铁丝，是农夫布朗修新篱笆时留下的。丹尼躲到铁丝下面，总算安全了。
        - id: ch04-b03
          speaker: danny_meadow_mouse
          text: 呼，这次可真是险到了家！不过，我出门要找的那种特别草籽，看来还是找得到的。
        - id: ch04-b04
          speaker: narrator
          text: 丹尼喘得很厉害。后来，他真的找到了那种草籽。
    - id: ch05
      title: 脾气坏了好事
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 可狐狸雷迪直到今天还在纳闷。田鼠丹尼究竟是怎么溜出旧番茄罐的？为什么自己一点儿也没发觉呢？
        - id: ch05-b02
          speaker: narrator
          text: 所以你看，乱发脾气，到头来害的是自己。拼命想要得到的东西，偏偏就这样失去。
        - id: ch05-b03
          speaker: narrator
          text: 丹尼后来还有过许许多多的冒险，可这里已经没有地方讲了。再说，青蛙爷爷正急着让你听听，他自己遇到过哪些稀奇古怪的事情。那些故事，就在下一本书里。
