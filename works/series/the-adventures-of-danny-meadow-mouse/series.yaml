cover_prompt: |-
  A wordless cover scene in the snowy early-twentieth-century American countryside shows a small meadow mouse with bright eyes and a notably short stubby tail gnawing almost through a wooden stake beside a young rabbit with one long hind leg caught in a fine wire snare. The tired rabbit lies still at the snowy entrance to a dense old briar patch while the determined little mouse, despite his own lame leg, works beside the trailing wire. Beyond them, the white Green Meadows lead toward a weathered stone wall, a distant peach orchard, and the edge of the Green Forest. The splintering stake and the mouse's urgent act of returning a kindness form the clear focal action, with both animals expressive and the rescue hopeful rather than frightening. Use a wide child-height three-quarter view with the figures prominent in the lower middle, their private path curving toward shelter, and calm open winter sky above. Keep the animals anatomically believable, the rural setting appropriate to the 1910s, and every figure independent of film or animation designs. No readable text, letters, numbers, labels, logos, captions, speech bubbles, signatures, or watermarks.
