audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm, observant storytelling
        timbre: clear and gentle
        pace: measured
        pitch: medium
    danny_meadow_mouse:
      display_name: Danny Meadow Mouse
      tts:
        delivery: youthful and plainly expressive
        timbre: small and bright
        pace: lively
        pitch: medium-high
    granny_fox:
      display_name: Granny Fox
      tts:
        delivery: shrewd and sharply confident
        timbre: dry and weathered
        pace: deliberate
        pitch: medium-low
    reddy_fox:
      display_name: Reddy Fox
      tts:
        delivery: eager and self-important
        timbre: quick and clear
        pace: brisk
        pitch: medium
  chapters:
    - id: ch01
      title: What Happened on the Green Meadows
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Things were happening thick and fast to Danny Meadow Mouse on the snow-covered Green Meadows. Or rather, they were almost happening. When Reddy Fox had tried to catch him alone, Danny hadn't minded. He had turned it into a fine game of hide-and-seek and enjoyed every minute of it.
        - id: ch01-b02
          speaker: narrator
          text: But now this was different. Granny Fox was much harder to fool than Reddy. She would have made the game dangerous all by herself. With Reddy beside her, Danny had both of the foxes to watch. He had so many frights that it felt as if his heart had jumped right into his mouth and meant to stay there. Yes, sir, that was exactly how it felt.
        - id: ch01-b03
          speaker: narrator
          text: Danny felt perfectly safe inside his little tunnels under the snow. Whenever Reddy saw him slip through a small round doorway, Reddy stopped at the place where Danny had vanished and dug wildly. But Granny knew all about those tunnels. She didn't waste time digging at the entrances. She pricked up her sharp ears and listened as hard as she could.
        - id: ch01-b04
          speaker: narrator
          text: Granny Fox had very keen ears. Oh, very keen ears indeed. Soon she heard exactly what she had hoped for. Danny Meadow Mouse was running through one of his tunnels beneath the snow.
        - id: ch01-b05
          speaker: narrator
          text: Plunge! Granny Fox dived straight into the snow and broke right through to Danny's tunnel. Her two black paws actually touched his tail. Danny was very glad that tail was no longer.
        - id: ch01-b06
          speaker: granny_fox
          text: Ha! I nearly caught him that time!
        - id: ch01-b07
          speaker: narrator
          text: Granny ran a little way ahead across the snow, then listened again. Plunge! Down into the snow she went. Luckily for Danny, he had just turned into another tunnel. Otherwise, she surely would have caught him.
        - id: ch01-b08
          speaker: narrator
          text: Granny Fox blew the snow out of her nose.
        - id: ch01-b09
          speaker: granny_fox
          text: I'll catch him next time!
        - id: ch01-b10
          speaker: narrator
          text: Reddy Fox learned quickly whenever food was involved. He watched Granny until he understood her trick, and then he decided to try it himself. He worried that if Granny caught Danny, she might decide he wasn't big enough to share. Perhaps Reddy thought that way because he was so selfish himself.
        - id: ch01-b11
          speaker: narrator
          text: The next time Granny plunged into the snow, she missed Danny just as before. Reddy rushed ahead of her. The moment he heard Danny running below, he plunged into the snow, copying what he had seen Granny do. But Reddy hadn't taken the trouble to find Danny's exact position. Of course, he came nowhere near him. All he did was frighten Danny even more and make Granny Fox lose her temper.
        - id: ch01-b12
          speaker: narrator
          text: Poor Danny Meadow Mouse had never been so frightened in his life. He didn't know which way to turn or where to run. So he sat perfectly still. He didn't know it, but that was the very best thing he could have done.
        - id: ch01-b13
          speaker: narrator
          text: While Danny sat still, he made no sound. Granny and Reddy couldn't tell where he was. Above the snow, Granny Fox sat listening and listening and listening, wondering where Danny Meadow Mouse could be. Beneath the snow, Danny sat listening and listening and listening, wondering where Granny and Reddy Fox could be.
        - id: ch01-b14
          speaker: granny_fox
          text: Pooh! That Meadow Mouse thinks he can fool me by sitting still. I'll give him a good scare.
        - id: ch01-b15
          speaker: narrator
          text: Granny began plunging into the snow here and there. Before long, she landed so close to Danny Meadow Mouse that one of her claws scratched him.
