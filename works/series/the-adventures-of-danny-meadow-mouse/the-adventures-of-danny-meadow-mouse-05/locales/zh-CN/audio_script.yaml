audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 亲切而略带调侃的讲述
        timbre: 温暖清亮
        pace: 舒缓而有变化
        pitch: 中音
    danny_meadow_mouse:
      display_name: 草地鼠丹尼
      tts:
        delivery: 年轻直率，闹别扭时语气生硬
        timbre: 轻细明亮
        pace: 稍快
        pitch: 中高音
    granny_fox:
      display_name: 老狐狸奶奶
      tts:
        delivery: 老练沉着，盘算时胸有成竹
        timbre: 低沉略带沙哑
        pace: 从容
        pitch: 中低音
    reddy_fox:
      display_name: 狐狸雷迪
      tts:
        delivery: 急躁自负，心里打算盘时透着狡猾
        timbre: 清亮略尖
        pace: 稍快
        pitch: 中高音
  chapters:
    - id: ch01
      title: 第五章　绿草地上发生的事
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 白雪盖住了绿草地，丹尼遇上的险事却一桩接一桩，来得又快又急。说得更准确些，那些险事还没有真的发生。每一次，危险都只是差一点儿找上他。
        - id: ch01-b02
          speaker: narrator
          text: 以前只有雷迪来捉他，丹尼根本不怕，还把这当成捉迷藏，玩得痛快极了。可这次不一样。老狐狸奶奶可没雷迪那么好骗。光是她一个，游戏就已经够危险了，现在再加上雷迪，丹尼得同时提防两个对手。
        - id: ch01-b03
          speaker: narrator
          text: 这可让丹尼受尽了惊吓。他觉得自己的心都跳进嗓子眼儿了，还打算待在那里不下来。真的，先生，当时他就是这种感觉。
        - id: ch01-b04
          speaker: narrator
          text: 躲进雪下的小地道，丹尼本来用不着怕雷迪，觉得自己安全得很。雷迪只会守在最后看见他的那扇圆门前，发疯似的刨雪。狐狸奶奶却熟悉这些小地道。她连一点时间也不肯浪费在门口，只把两只尖耳朵竖起来，使劲听。
        - id: ch01-b05
          speaker: narrator
          text: 狐狸奶奶的耳朵实在太灵了。没多久，她就听到了自己最想听见的声音。丹尼正在雪下的一条地道里飞跑。
        - id: ch01-b06
          speaker: narrator
          text: 扑通！狐狸奶奶一头扎进雪里，直接穿进了丹尼的地道。她的两只黑爪子竟然碰到了丹尼的尾巴。丹尼别提多庆幸了，幸好自己的尾巴早已不像从前那么长。
        - id: ch01-b07
          speaker: granny_fox
          text: 哈！这一回，我差一点儿就捉到他了！
          emotion: happy
        - id: ch01-b08
          speaker: narrator
          text: 狐狸奶奶往前跑了一段，又停下来细听。扑通！她第二次扎进雪里。幸亏丹尼正好拐进另一条地道，不然这次准会落进她的爪子。
        - id: ch01-b09
          speaker: narrator
          text: 狐狸奶奶把鼻子里的雪喷了出去。
        - id: ch01-b10
          speaker: granny_fox
          text: 下一回，我一定能捉住他！
        - id: ch01-b11
          speaker: narrator
          text: 雷迪学东西很快，特别是这种能帮他弄到吃食的本领。他盯着狐狸奶奶看了一阵，明白她在干什么以后，也打定主意亲自试试。因为他怕奶奶先捉到丹尼，会嫌这只草地鼠太小，不够两个人分。也许雷迪会这样猜，正是因为他自己十分自私。
        - id: ch01-b12
          speaker: narrator
          text: 狐狸奶奶再一次扑进雪里，又没捉到丹尼。雷迪赶紧冲到她前面。他一听见丹尼从雪下跑过，就学着奶奶的样子猛扎下去。
        - id: ch01-b13
          speaker: narrator
          text: 可他根本没有耐心听准丹尼在哪里，当然扑了个空。丹尼却被吓得更厉害，老狐狸奶奶也让雷迪气得发了脾气。
        - id: ch01-b14
          speaker: narrator
          text: 可怜的丹尼，这辈子从没这么害怕过。他不知道该往哪边拐，也不知道该往哪里逃。最后，他干脆坐着不动。丹尼自己还不明白，这正是眼下最好的办法。
        - id: ch01-b15
          speaker: narrator
          text: 丹尼一动不动，就不会发出半点声音。狐狸奶奶和雷迪听不见，当然弄不清他在哪里。于是，狐狸奶奶坐在雪地上，听啊，听啊，又听啊，心里猜着丹尼躲在哪里。雪下面，丹尼也坐着，听啊，听啊，又听啊，猜着那两只狐狸守在哪里。
        - id: ch01-b16
          speaker: granny_fox
          text: 呸！这只草地鼠以为一动不动，我就拿他没办法。那我可得吓他一跳。
        - id: ch01-b17
          speaker: narrator
          text: 说完，狐狸奶奶便东一下、西一下，不停地朝雪里扑。没过多久，她真的落在了离丹尼极近的地方。一只利爪擦过丹尼，把他抓伤了。
