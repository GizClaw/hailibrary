audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 亲切而略带调侃的讲述
        timbre: 温暖清亮
        pace: 舒缓而有变化
        pitch: 中音
    danny_meadow_mouse:
      display_name: 草地鼠丹尼
      tts:
        delivery: 年轻直率，闹别扭时语气生硬
        timbre: 轻细明亮
        pace: 稍快
        pitch: 中高音
    granny_fox:
      display_name: 老狐狸奶奶
      tts:
        delivery: 老练沉着，盘算时胸有成竹
        timbre: 低沉略带沙哑
        pace: 从容
        pitch: 中低音
    reddy_fox:
      display_name: 狐狸雷迪
      tts:
        delivery: 急躁自负，心里打算盘时透着狡猾
        timbre: 清亮略尖
        pace: 稍快
        pitch: 中高音
  chapters:
    - id: ch01
      title: 每天换一扇门
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 一连好几天，丹尼都没见着狐狸奶奶和雷迪。每天早晨，他还没吃东西，就先爬到一扇圆圆的小门前，悄悄望向白茫茫的草地，看看四周有没有危险。而且，他天天选的门都不一样。
        - id: ch01-b02
          speaker: danny_meadow_mouse
          text: 要是今天早晨碰巧有谁看见我，明天他没准就会守在这扇门外等我。所以，我可不能总从同一个地方露面。
        - id: ch01-b03
          speaker: narrator
          text: 丹尼的小脑袋不大，里面的智慧却多着呢。第一天过去了，第二天过去了，第三天也过去了，狐狸奶奶和雷迪一直没有露面。丹尼渐渐又快活起来。他在雪下的地道里来回奔跑，还会窜上雪面，从一扇小门跑到另一扇小门，就像狐狸们追捕他之前一样自在。不过，狐狸奶奶盼着他忘掉那场危险，这可没能如愿。丹尼记得清清楚楚，他才不会上那个当。
    - id: ch02
      title: 雪封住了小门
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 一天早晨，丹尼爬向一扇小门，到了跟前才发现，门堵住了。不错，堵住了。再仔细一看，哪里还有什么门呀！原来夜里又下了一场雪，丹尼所有圆圆的小门，全叫新雪盖得没影了。
        - id: ch02-b02
          speaker: danny_meadow_mouse
          text: 哈，今天可有得忙了！这些门都得重新挖开。我先填饱肚子，然后马上开工。
        - id: ch02-b03
          speaker: narrator
          text: 丹尼在旧篱笆柱的空洞里藏了不少草籽。那根柱子如今埋在雪下，他就在里面舒舒服服地吃了一顿。吃饱以后，他选了最近的门，开始往外挖。其实这活儿一点也不辛苦。雪又轻又松，丹尼偏偏最爱挖雪。才过了一小会儿，他便挖出一个细小的洞口，能仰头看见快活又滚圆的太阳公公。再挖一会儿，洞口就容得下他的脑袋了。
        - id: ch02-b04
          speaker: narrator
          text: 丹尼向左瞧瞧，又向右看看。在很远很远的一棵树顶上，他望见了沼泽鹰老白尾。老白尾离得太远，根本吓不着他。
        - id: ch02-b05
          speaker: danny_meadow_mouse
          text: 看来四周平平静静，没什么东西可怕，也没有哪个家伙能吓着我。
        - id: ch02-b06
          speaker: narrator
          text: 他说着，又把头往外伸了伸。
    - id: ch03
      title: 北风揭开了秘密
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 丹尼没有立刻出去。他只把小脑袋露在门外，安安静静地坐着，把四周看了一遍又一遍。眼前的世界白得耀眼，也美得出奇。到处那么洁净，仿佛在这样的地方，谁也不可能受到伤害，更不会碰上危险。可丹尼早就知道，眼睛看到的样子未必是真相。于是他继续察看，终于注意到不远处有一小堆雪。
        - id: ch03-b02
          speaker: danny_meadow_mouse
          text: 奇怪，我不记得那儿有一堆雪。下面也没有灌木，没有旧木头，什么东西都没有。也许是粗暴的北风兄弟觉得好玩，随手把雪堆起来的。
        - id: ch03-b03
          speaker: narrator
          text: 嘴上虽然这么说，丹尼的眼睛可一直没离开那堆雪。没过多久，粗暴的北风兄弟果真来了。他一路卷起雪花，直朝这边吹。经过那个小雪堆时，他从顶上抓走一把雪，接着便过去了。
        - id: ch03-b04
          speaker: narrator
          text: 丹尼眼尖，立刻看见雪里露出一点红色。那抹红，和老狐狸奶奶身上的斗篷分毫不差。
        - id: ch03-b05
          speaker: danny_meadow_mouse
          text: 狐狸奶奶，想骗我可不成！我看得清清楚楚，那儿露着你的红斗篷！
        - id: ch03-b06
          speaker: narrator
          text: 丹尼高声喊完，马上缩回门里，连影子也看不见了。狐狸奶奶只好站起来，把红斗篷上的雪抖掉。她又失望又恼火，嘴里低低地吼了一声，然后慢吞吞地往绿森林走去。雷迪还在那里等着她呢。
