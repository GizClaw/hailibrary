audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm, observant storytelling
        timbre: clear and gentle
        pace: measured
        pitch: medium
    danny_meadow_mouse:
      display_name: Danny Meadow Mouse
      tts:
        delivery: youthful and plainly expressive
        timbre: small and bright
        pace: lively
        pitch: medium-high
    reddy_fox:
      display_name: Reddy Fox
      tts:
        delivery: sly and quick, with flashes of impatience
        timbre: sharp and youthful
        pace: brisk
        pitch: medium
    granny_fox:
      display_name: Granny Fox
      tts:
        delivery: shrewd and confidently deliberate
        timbre: dry and seasoned
        pace: unhurried
        pitch: medium-low
  chapters:
    - id: ch01
      title: Brother North Wind Proves a Friend
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Danny Meadow Mouse hadn't seen old Granny Fox or Reddy Fox for several days. Each morning, the very first thing he did, before he even ate breakfast, was climb to one of his little round doorways. From there, he peeped across the beautiful white meadows and looked to see whether any danger was near. But Danny chose a different doorway every morning.
        - id: ch01-b02
          speaker: danny_meadow_mouse
          text: Suppose somebody happens to see me this morning. They might wait right outside this doorway to catch me tomorrow morning.
        - id: ch01-b03
          speaker: narrator
          text: There was a great deal of wisdom in the little head Danny carried on his shoulders.
        - id: ch01-b04
          speaker: narrator
          text: On the first day, Danny saw no sign of either fox. The second and third days were the same. Soon he was enjoying himself again. He ran through his tunnels beneath the snow and scurried across the snow from one doorway to another, just as he had before the foxes tried so hard to catch him.
        - id: ch01-b05
          speaker: narrator
          text: Granny Fox had hoped Danny would forget about them. But he hadn't forgotten at all. Danny was much too wise for that.
        - id: ch01-b06
          speaker: narrator
          text: One morning, Danny started up toward one of his little doorways and found it closed. In fact, the doorway was gone. More snow had fallen from the clouds during the night, covering every one of his little round doorways.
        - id: ch01-b07
          speaker: danny_meadow_mouse
          text: Ha! I'll have a very busy day opening all my doorways. First I'll eat breakfast, and then I'll get to work.
        - id: ch01-b08
          speaker: narrator
          text: Danny ate a good breakfast of seeds. He had stored them in a hollow inside the old fence post buried under the snow. Then he began opening the nearest doorway.
        - id: ch01-b09
          speaker: narrator
          text: It didn't feel like work at all. The snow was soft and light, and Danny dearly loved digging in it. Opening the doorway went quickly. After a few minutes, he had made a tiny hole. He could peep through it at jolly, round Mr. Sun. A few minutes later, the hole was wide enough for Danny to put out his head.
        - id: ch01-b10
          speaker: narrator
          text: He looked one way, then the other. Far away, on the top of a tree, he saw old Roughleg the Hawk. Roughleg was so far off that Danny wasn't afraid of him.
        - id: ch01-b11
          speaker: danny_meadow_mouse
          text: I can't see anyone or anything I need to fear.
        - id: ch01-b12
          speaker: narrator
          text: Danny pushed his head a little farther out. Then he sat for a long time, carefully studying everything around him.
        - id: ch01-b13
          speaker: narrator
          text: It was a beautiful white world. Everything looked so white, pure, and lovely that it hardly seemed possible anyone could even think of harm or danger there. But Danny had learned long ago that things aren't always what they seem. So he sat with only his little head outside the doorway and studied everything again and again.
        - id: ch01-b14
          speaker: narrator
          text: A short distance away, he noticed a small heap of snow.
        - id: ch01-b15
          speaker: danny_meadow_mouse
          text: I don't remember seeing that. And there's no little bush or old log underneath it to make a heap like that. Maybe rough Brother North Wind piled it up for fun.
        - id: ch01-b16
          speaker: narrator
          text: Still, Danny kept his eyes on that little heap. Before long, rough Brother North Wind came tossing snow about as he swept Danny's way. He snatched a handful from the top of the heap and rushed on past.
        - id: ch01-b17
          speaker: narrator
          text: Danny's sharp eyes caught a flash of red beneath the missing snow. It was exactly the color of old Granny Fox's cloak.
        - id: ch01-b18
          speaker: danny_meadow_mouse
          text: Granny Fox, you can't fool me! I see you plain as plain can be!
        - id: ch01-b19
          speaker: narrator
          text: Danny shouted the rhyme and dropped out of sight. Old Granny Fox shook the snow from her red cloak. Then, snarling with disappointment and anger, she slowly started back toward the Green Forest. Reddy Fox was waiting for her there.
