audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm, observant storytelling
        timbre: clear and gentle
        pace: measured
        pitch: medium
    danny_meadow_mouse:
      display_name: Danny Meadow Mouse
      tts:
        delivery: alert, thoughtful, and cheerfully self-assured
        timbre: small and bright
        pace: lively
        pitch: medium-high
  chapters:
    - id: ch01
      title: An Exciting Day for Danny Meadow Mouse
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Very early one morning, Danny Meadow Mouse set off along one of his own little paths. He was going to gather a kind of grass seed he especially liked. He had waited and waited for it to ripen, and the day before, he had gone to check. Now the seed was just right.
        - id: ch01-b02
          speaker: narrator
          text: There was only one problem. That grass grew a long way from Danny's home. To get there, he would have to cross an open place. The grass there was so short that Danny couldn't make one of his hidden little paths beneath it.
        - id: ch01-b03
          speaker: danny_meadow_mouse
          text: I can feel it in my bones. This is going to be an exciting day. If I were truly wise, I suppose I'd stay close to home and go without that lovely seed. But if something is worth having, it's worth working for. And that seed will taste even better after all the trouble of getting it.
        - id: ch01-b04
          speaker: narrator
          text: Danny trotted on. His ears and eyes were wide open, and his little nose tested every Merry Little Breeze for any smell of danger. Most of all, he trusted his ears. The grass was so tall that even when he sat up, he couldn't see over it.
        - id: ch01-b05
          speaker: narrator
          text: He had not gone far when he heard a strange rustle behind him. Danny stopped and listened. There it was again, right there in the path! He knew at once who could make a sound like that. No one else made that kind of rustle. It was Mr. Blacksnake.
        - id: ch01-b06
          speaker: narrator
          text: Danny could run very fast on his own little paths, but he knew Mr. Blacksnake was faster.
        - id: ch01-b07
          speaker: danny_meadow_mouse
          text: If my legs can't save me, I'll have to use my wits. I must get to that old hollow fence post!
        - id: ch01-b08
          speaker: narrator
          text: Danny ran as fast as he could. He was almost out of breath when he reached the fallen post and darted into its open end. From the rustling close behind him, he knew Mr. Blacksnake was right at his heels.
        - id: ch01-b09
          speaker: narrator
          text: The old post was hollow from end to end. Halfway through it was an old knot hole, just big enough for Danny to squeeze out. Mr. Blacksnake knew nothing about that hole, and the inside of the post was too dark for him to see Danny slip through it.
        - id: ch01-b10
          speaker: narrator
          text: Danny raced back along the top of the post. He arrived just in time to see the tip of Mr. Blacksnake's tail vanish inside. And then, what do you think Danny did? He followed Mr. Blacksnake straight into the post without making the tiniest sound.
        - id: ch01-b11
          speaker: narrator
          text: Mr. Blacksnake went all the way through the post and out the other end. He was certain Danny had gone that way. He never guessed Danny had slipped out through the knot hole, so he kept following the little path.
        - id: ch01-b12
          speaker: narrator
          text: Danny knew Mr. Blacksnake would not go far before he discovered the trick. Then, of course, he would come back. Danny waited only long enough to catch his breath. He ran back to the place where another little path branched away, and for a moment, he stopped.
        - id: ch01-b13
          speaker: danny_meadow_mouse
          text: If Mr. Blacksnake follows me, he'll be sure I've taken this other path. So that's exactly what I won't do.
        - id: ch01-b14
          speaker: narrator
          text: Danny ran harder than ever. Soon he reached a place where two little paths branched off, one to the right and one to the left. He chose the path on the left and scampered away. By now, he felt sure Mr. Blacksnake would be so confused that he would stop chasing him. Danny was right.
        - id: ch01-b15
          speaker: danny_meadow_mouse
          text: Brains are far better than speed, as wise men agreed long ago.
        - id: ch01-b16
          speaker: narrator
          text: Danny trotted on toward the grass seed he liked so much.
        - id: ch01-b17
          speaker: danny_meadow_mouse
          text: I felt it in my bones. This really is an exciting day. I wonder what will happen next.
