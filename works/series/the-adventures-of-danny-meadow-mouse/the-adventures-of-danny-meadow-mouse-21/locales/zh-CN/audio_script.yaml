audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 亲切而略带调侃的讲述
        timbre: 温暖清亮
        pace: 舒缓而有变化
        pitch: 中音
    danny_meadow_mouse:
      display_name: 草地鼠丹尼
      tts:
        delivery: 年轻直率，闹别扭时语气生硬
        timbre: 轻细明亮
        pace: 稍快
        pitch: 中高音
  chapters:
    - id: ch01
      title: 远处的草籽
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 一天清早，田鼠丹尼沿着一条只属于自己的小路出发了。他要去采一种特别爱吃的草籽。为了等它们成熟，他已经惦记了好些日子。昨天，他还特意跑去看过，知道草籽现在熟得正好。
        - id: ch01-b02
          speaker: narrator
          text: 可那种草长得离家很远。丹尼要走到那里，非得穿过一片空地不可。空地上的草又太矮，根本遮不住一条小路。
        - id: ch01-b03
          speaker: danny_meadow_mouse
          text: 我骨头里有个声音告诉我，今天准会过得惊险万分。我要是真够聪明，就该留在家附近，别去惦记那些香喷喷的草籽。
        - id: ch01-b04
          speaker: danny_meadow_mouse
          text: 不过，一样东西要是不值得费力，也就不值得拥有。越是费一番辛苦才弄到，草籽吃起来一定越香。
        - id: ch01-b05
          speaker: narrator
          text: 丹尼说着，还是顺着那条秘密小路跑了下去。他耳朵高高竖起，眼睛睁得溜圆，小鼻子仔细嗅着每一阵路过的快乐小风，生怕风里带来危险的气味。
        - id: ch01-b06
          speaker: narrator
          text: 他最信得过的还是自己的耳朵。周围的草太高，哪怕直起身子坐着，也看不到草顶外面。
    - id: ch02
      title: 身后的沙沙声
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 才走了一小段路，丹尼忽然听见身后有种怪怪的沙沙声。他停下来，侧耳细听。沙沙声又来了，而且就在他身后的路上！
        - id: ch02-b02
          speaker: narrator
          text: 丹尼根本不用猜。能弄出这种动静的只有黑蛇先生。
        - id: ch02-b03
          speaker: narrator
          text: 在自己的小路上，丹尼能跑得飞快。可他很清楚，黑蛇先生比自己更快。
        - id: ch02-b04
          speaker: danny_meadow_mouse
          text: 腿要是救不了我，我就得靠脑子。一定要赶到那根倒在地上的空心旧篱笆柱！
        - id: ch02-b05
          speaker: narrator
          text: 丹尼撒腿飞奔，赶到旧柱子时已经喘不过气了。他一头钻进敞开的那一端，身后的沙沙声却紧紧追着他。黑蛇先生已经到了他的脚后跟。
        - id: ch02-b06
          speaker: narrator
          text: 那根旧柱子从这一头到另一头都是空的。半中间还有个旧节孔，大小刚够丹尼挤出去。黑蛇先生并不知道这个洞。柱子里面黑漆漆的，他也没看见丹尼从那里钻了出去。
    - id: ch03
      title: 钻进旧柱子
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 丹尼跑回木头顶上，恰好看见黑蛇先生的尾巴尖钻进柱子。接下来，他做了一件谁也想不到的事。他悄悄跟在黑蛇先生后面，也钻进了旧柱子，一丁点儿声音都没有发出来。
        - id: ch03-b02
          speaker: narrator
          text: 黑蛇先生认定丹尼是从另一头跑掉的。他穿过整根柱子，从那一端钻出去，又沿着小路继续追。
        - id: ch03-b03
          speaker: narrator
          text: 丹尼知道，黑蛇先生很快就会发现上了当，也一定会掉头回来。他只停了一会儿，等自己喘匀气，就顺着原路往回跑。
        - id: ch03-b04
          speaker: narrator
          text: 跑到另一条小路岔出去的地方，丹尼停了片刻。
        - id: ch03-b05
          speaker: danny_meadow_mouse
          text: 黑蛇先生追到这里，准会认定我拐上了这条岔路。所以，我偏不往那边走。
    - id: ch04
      title: 脑袋胜过快腿
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 丹尼接着跑，比刚才还要快。他一路冲到下一个岔路口。那里分出两条小路，一条向右，一条向左。丹尼选了左边，飞快地跑了下去。
        - id: ch04-b02
          speaker: narrator
          text: 他相信，黑蛇先生这时候一定已经被绕糊涂，只能放弃追赶。丹尼猜得一点儿也没错。
        - id: ch04-b03
          speaker: danny_meadow_mouse
          text: 跑得再快也不如脑袋灵，早先的聪明人都这么认定。
        - id: ch04-b04
          speaker: narrator
          text: 丹尼念完这两句顺口溜，继续小跑着去找自己最爱吃的草籽。
        - id: ch04-b05
          speaker: danny_meadow_mouse
          text: 我骨头里的声音果然没说错，今天真够惊险的。不知道接下来还会碰上什么。
