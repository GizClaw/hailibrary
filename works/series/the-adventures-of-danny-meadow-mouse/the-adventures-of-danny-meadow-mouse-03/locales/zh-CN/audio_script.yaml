audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 亲切而略带调侃的讲述
        timbre: 温暖清亮
        pace: 舒缓而有变化
        pitch: 中音
    reddy_fox:
      display_name: 狐狸雷迪
      tts:
        delivery: 狡猾急切，盘算时压低声音
        timbre: 尖细而略带沙哑
        pace: 稍快
        pitch: 中高音
  chapters:
    - id: ch01
      title: 第三章　草地鼠丹尼玩捉迷藏
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 对草地鼠丹尼来说，过日子就像一直在玩捉迷藏。他长得胖乎乎的，许多披毛的居民，还有差不多同样多披羽毛的居民，只要能抓住他，都想把他当成早餐或晚餐。有些家伙还会装朋友呢。所以，他们一到附近，丹尼就睁大眼睛，马上玩起捉迷藏。
        - id: ch01-b02
          speaker: narrator
          text: 兔子彼得、臭鼬吉米、花栗鼠条纹和松鼠快乐杰克，丹尼都信得过。可要是狐狸雷迪、水貂比利、黄鼠狼影子、沼泽鹰老白尾，或是另外那几个家伙来了，他明亮的小眼睛就会警醒地闪着光。到了晚上，他尤其要防着猫头鹰胡蒂。
        - id: ch01-b03
          speaker: narrator
          text: 不过，丹尼的胆量可不小。粗暴的北风兄弟大喊着刮过绿草地，把雪云一团团撕开，又抖下无数雪花。绿草地上的雪越积越深，越积越深。丹尼只是裹紧暖和的外套，安安稳稳地缩在那座草屋里等着。
        - id: ch01-b04
          speaker: narrator
          text: 丹尼喜欢雪。不错，先生，草地鼠丹尼就是喜欢雪。他最爱钻进雪里挖地道。一条条地道伸向四面八方，他想上哪儿就上哪儿，想什么时候去就什么时候去，还不会叫谁看见。那可太好玩了！
        - id: ch01-b05
          speaker: narrator
          text: 每隔一小段路，丹尼就在一根硬挺的草茎旁边开一扇圆圆的小门。他能从门里探头看看白茫茫的世界，也能透一透清冷的新鲜空气。
        - id: ch01-b06
          speaker: narrator
          text: 有时候，丹尼确定周围没有谁，就从雪面上飞快地跑过，出了这一扇门，又钻进另一扇门。雪地上随即留下一串小脚印，好看极了。
        - id: ch01-b07
          speaker: narrator
          text: 狐狸雷迪早就知道这些小门，也知道是谁开的。天气这么冷，他很难找够吃的，肚子几乎总是饿着。
        - id: ch01-b08
          speaker: narrator
          text: 一天早晨，雷迪踮着脚，轻轻走过草地。就在前面，草地鼠丹尼的脑袋忽然从一扇圆圆的小门里冒了出来。雷迪馋得口水直流，便把脚步放得更轻，一点点摸过去。
        - id: ch01-b09
          speaker: narrator
          text: 到了一跃就能扑上的地方，雷迪把强壮的后腿缩到身下，准备猛扑。说时迟，那时快！草地鼠丹尼不见了！雷迪还是扑了上去，两只爪子飞快地挖起雪来。他闻得到丹尼的气味，急得简直要发疯。
        - id: ch01-b10
          speaker: narrator
          text: 可这时候，丹尼已经沿着一条小地道飞奔起来。雷迪越挖越喘，最后实在挖不动了。丹尼却从另一扇小门里探出头，冲着他哈哈大笑。
        - id: ch01-b11
          speaker: narrator
          text: 雷迪当然看见了。他赶到那边，又像刚才一样拼命地挖。可丹尼呢？当然早就不在那儿了。
        - id: ch01-b12
          speaker: narrator
          text: 过了一阵，雷迪玩腻了这个游戏，想出了别的办法。丹尼下一次探出脑袋时，雷迪装作没有看见。他把身子摊开，趴在地上，假装又累又困，然后闭紧了眼睛。
        - id: ch01-b13
          speaker: narrator
          text: 接着，雷迪又把眼睛偷偷睁开一条细缝。这样，他既能盯着丹尼，又能装成还在睡觉。丹尼看了他很久，暗自咯咯一笑，便缩回雪下，不见了。
        - id: ch01-b14
          speaker: narrator
          text: 丹尼才一消失，雷迪就悄悄溜到那扇小门旁边，守在那里。
        - id: ch01-b15
          speaker: reddy_fox
          text: 他肯定还会把脑袋伸出来，看看我是不是真睡着了。等他一露头，我就能抓住他。
        - id: ch01-b16
          speaker: narrator
          text: 雷迪等啊，等啊，又等啊。过了好一会儿，他转头一看。草地鼠丹尼正在另一扇小门里，冲着他哈哈大笑呢！
