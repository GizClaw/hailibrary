  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm, observant storytelling
        timbre: clear and gentle
        pace: measured
        pitch: medium
    danny_meadow_mouse:
      display_name: Danny Meadow Mouse
      tts:
        delivery: youthful and plainly expressive
        timbre: small and bright
        pace: lively
        pitch: medium-high
    reddy_fox:
      display_name: Reddy Fox
      tts:
        delivery: sly and self-assured
        timbre: smooth and sharp
        pace: measured
        pitch: medium-low
  chapters:
    - id: ch01
      title: Danny Meadow Mouse Plays Hide and Seek
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Life is always a game of hide and seek for Danny Meadow Mouse. He is such a fat little fellow that many furry people would gobble him up for breakfast or dinner if they could. Nearly as many feathered people would do the same. Some even pretend to be his friends, so Danny keeps his eyes open and starts hiding whenever they come near.
        - id: ch01-b02
          speaker: narrator
          text: He can trust Peter Rabbit, Jimmy Skunk, Striped Chipmunk, and Happy Jack Squirrel. But one bright, twinkling eye is always watching for Reddy Fox, Billy Mink, Shadow the Weasel, old Whitetail the Marsh Hawk, and several others. At night, he watches especially for Hooty the Owl.
        - id: ch01-b03
          speaker: narrator
          text: Danny is a stout-hearted little fellow. When rough Brother North Wind came shouting across the Green Meadows, he tore the snow clouds apart and shook out their flakes. Soon the meadows lay deep, deep, deep beneath the snow. Danny simply tucked himself into his warm coat, settled inside his snug little grass house, and waited.
        - id: ch01-b04
          speaker: narrator
          text: Danny liked the snow. Yes, sir, Danny Meadow Mouse liked it. He loved digging through it and making tunnels. Those tunnels ran in every direction, so he could go wherever he pleased, whenever he pleased, without anyone seeing him. What fun that was!
        - id: ch01-b05
          speaker: narrator
          text: Every little way along, Danny made a small round doorway beside a stiff stalk of grass. He could peep through it at the white world and breathe the fresh, cold air. Sometimes he was certain no one was near. Then he would scamper over the snow from one doorway to another, leaving the prettiest little footprints behind him.
        - id: ch01-b06
          speaker: narrator
          text: Reddy Fox knew exactly who had made those doorways. Food was hard to find in the cold weather, and Reddy was hungry most of the time. One morning, he tiptoed softly across the meadows. Just ahead, Danny's head popped from a little round doorway.
        - id: ch01-b07
          speaker: narrator
          text: Reddy's mouth began to water. He crept forward even more quietly. Once he was close enough to jump, he pulled his strong hind legs beneath him and got ready to spring. Then, presto! Danny Meadow Mouse vanished.
        - id: ch01-b08
          speaker: narrator
          text: Reddy jumped anyway. He began digging as fast as his paws could move. Danny's scent was there, and it nearly drove Reddy frantic. But Danny was already scurrying through one of his tunnels.
        - id: ch01-b09
          speaker: narrator
          text: At last, Reddy stopped digging because he was completely out of breath. Danny poked his head through a different doorway and laughed at him. Of course Reddy saw him. Of course he rushed over and dug as wildly as before. And, of course, Danny Meadow Mouse was no longer there.
        - id: ch01-b10
          speaker: narrator
          text: After a while, Reddy grew tired of that game and made a new plan. The next time Danny put his head out, Reddy acted as though he hadn't noticed. He stretched himself on the ground and pretended to be terribly tired and sleepy. He shut his eyes, then opened them the tiniest bit. He could still watch Danny while looking fast asleep.
        - id: ch01-b11
          speaker: narrator
          text: Danny watched him for a long time. Then he chuckled to himself and slipped out of sight. The moment Danny disappeared, Reddy crept close to that little doorway and waited.
        - id: ch01-b12
          speaker: reddy_fox
          text: He'll put his head out again to find out if I'm asleep. Then I'll catch him.
        - id: ch01-b13
          speaker: narrator
          text: So Reddy waited and waited and waited. After a while, he turned his head. There was Danny Meadow Mouse at another little doorway, laughing at him!
