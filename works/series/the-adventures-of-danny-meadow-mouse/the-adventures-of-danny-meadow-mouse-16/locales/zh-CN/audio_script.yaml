audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 亲切而略带调侃的讲述
        timbre: 温暖清亮
        pace: 舒缓而有变化
        pitch: 中音
    peter_rabbit:
      display_name: 小兔彼得
      tts:
        delivery: 好奇活泼，心思全写在语气里
        timbre: 清亮稚嫩
        pace: 轻快
        pitch: 中高音
  chapters:
    - id: ch01
      title: 等待黑暗
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 小兔彼得躲在农夫布朗桃园旁边的老石墙里，等月亮太太熄灯离开。等她一走，世界就会黑下来，直到圆滚滚、红彤彤的太阳先生踢开玫瑰色的被子，爬上湛蓝的天空。
        - id: ch01-b02
          speaker: narrator
          text: 冬天的太阳先生总爱睡懒觉。彼得知道，月亮太太熄灯以后，还有两三个钟头天才会亮。到了这时候，猫头鹰胡蒂多半吃过晚饭了，老狐狸奶奶和红狐狸雷迪也该吃过了。猎犬鲍泽早就困得没心思守在外面。彼得想回到老荆棘丛的家里，这是最安全的时机。
        - id: ch01-b03
          speaker: narrator
          text: 彼得等了又等。把他追进石墙的鲍泽来过两次。每一次，鲍泽都对着彼得汪汪叫，还想把他弄出来。可老石墙护得严严实实，鲍泽只能放弃。
        - id: ch01-b04
          speaker: narrator
          text: 等待的时候，彼得一直疼得厉害。那根亮闪闪的铁丝绷得紧紧的，已经勒进肉里。铁丝另一头还拖着一截木头，那是他好不容易咬断以后，剩下的半截木桩。
        - id: ch01-b05
          speaker: narrator
          text: 正因为拖着木桩，彼得只能慢慢走。他知道，凡是能躲开的危险，一点儿也不能再冒。所以他一直等着。过了一阵，月亮太太果然熄了灯。彼得又等了一会儿，竖起耳朵，使劲听着。四周一点动静也没有，他这才悄悄爬出老石墙。
    - id: ch02
      title: 拖着木桩前行
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 麻烦马上就来了。木桩被铁丝拴在彼得腿上，一拖过石头就卡住了，猛地把他扯停。实在太疼了，彼得的眼泪一下涌了出来。可他咬紧牙，转过身去折腾了好一阵，总算把木桩弄了出来。接着，他又拖着它上路了。
        - id: ch02-b02
          speaker: narrator
          text: 彼得极慢极慢地爬过桃园，又从另一头的篱笆底下钻出去。他那条腿又僵又疼，几乎不敢碰到雪地。可那截木桩一直拖在身后，仿佛每过一分钟就更沉一点，也更难拖一点。
        - id: ch02-b03
          speaker: narrator
          text: 彼得不敢穿过空旷的田野。万一碰上危险，那里连个藏身的地方也没有。他只好贴着长满灌木的篱笆往前走。可是木桩不停钩住枝条，每次都狠狠一扯受伤的腿。彼得疼得尖叫起来，只能又停下。
        - id: ch02-b04
          speaker: narrator
          text: 这还不够。彼得心里始终压着一个可怕的念头。猫头鹰胡蒂或老狐狸奶奶，会不会碰巧从这里经过？他不得不一次又一次停下来休息。每次一停，就屏住气听了又听，然后一遍遍责怪自己。
        - id: ch02-b05
          speaker: peter_rabbit
          text: 唉，我明知道不该去那片小桃园，为什么还非要去呢？绿森林和绿草原上有那么多好东西，本来都是我的。我怎么就不能知足呢？唉！唉！
          emotion: sad
    - id: ch03
      title: 回到老荆棘丛
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 圆滚滚、红彤彤的太阳先生刚开始照亮绿草原，彼得终于赶到了老荆棘丛。田鼠丹尼正坐在荆棘丛边上，焦急地等着他。
        - id: ch03-b02
          speaker: narrator
          text: 彼得爬到跟前，沿着自己的一条秘密小径往里钻。他自己倒是进去了，拖在后面的木桩却钩住了荆棘。彼得当场倒在那里的雪地上。他已经累得筋疲力尽，连动一下的力气都没有了。
