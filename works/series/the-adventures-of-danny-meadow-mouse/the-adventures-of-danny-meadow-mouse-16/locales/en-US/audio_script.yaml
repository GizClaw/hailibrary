audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm, observant storytelling
        timbre: clear and gentle
        pace: measured
        pitch: medium
    peter_rabbit:
      display_name: Peter Rabbit
      tts:
        delivery: quick, curious, and plainly expressive
        timbre: youthful and bright
        pace: lively
        pitch: medium-high
  chapters:
    - id: ch01
      title: Peter Rabbit's Hard Journey
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Peter Rabbit sat inside the old stone wall beside Farmer Brown's orchard. He was waiting for Mrs. Moon to put out her light. Then the world would stay dark until jolly, round, red Mr. Sun kicked off his rosy bedclothes and began his daily climb into the blue, blue sky.
        - id: ch01-b02
          speaker: narrator
          text: In winter, Mr. Sun sleeps late. Peter knew he would have two or three hours of darkness after the moon went down. By then, Hooty the Owl had probably caught his dinner. So had old Granny Fox and Reddy Fox. Bowser the Hound would be too sleepy to keep watch. That would be the safest time for Peter to make his way home to the dear Old Briar-patch.
        - id: ch01-b03
          speaker: narrator
          text: So Peter waited and waited. Twice, Bowser came back to the wall. The hound who had chased Peter into hiding barked and tried to reach him, but the stones kept the little rabbit safe. At last, Bowser gave up and went away.
        - id: ch01-b04
          speaker: narrator
          text: All that time, Peter was in terrible pain. The shiny wire was pulled so tight around his leg that it cut into him. A piece of wood hung from the other end. It was part of the stake that had held the snare. Peter had gnawed through the stake and broken that piece loose.
        - id: ch01-b05
          speaker: narrator
          text: That dragging piece of wood was why Peter needed darkness before he left the wall. He knew it would make him travel very slowly, and he couldn't risk any more danger than he had to. So he kept waiting. At last, just as he had hoped, Mrs. Moon put out her light. Peter waited a little longer and listened as hard as he could. Everything was still. Then he crept out of the old stone wall.
        - id: ch01-b06
          speaker: narrator
          text: Trouble began at once. The stake at the end of the wire caught between the stones, and Peter was jerked to a sudden stop. Oh, how it hurt! The pain brought tears to his eyes. But Peter clenched his teeth, turned back toward the stones, and worked until the stake came free. Then he started once more, dragging it behind him.
        - id: ch01-b07
          speaker: narrator
          text: Very slowly, Peter crept across the whole orchard and under the fence on the far side. His injured leg was so stiff and sore that he could hardly let it touch the snow. All the while, he had to drag that broken piece of stake. It seemed to grow heavier with every step and harder to pull with every passing minute.
        - id: ch01-b08
          speaker: narrator
          text: Peter didn't dare cross the open fields. If danger came along, there would be nowhere to hide. Instead, he stayed near the fences where bushes grew. That made the journey much harder. Again and again, the stake caught in a bush. Each time it yanked his injured leg, stopped him short, and made him squeal with pain.
        - id: ch01-b09
          speaker: narrator
          text: The pain was bad enough, but Peter was also terribly afraid that Hooty the Owl or Granny Fox might come by. He had to stop and rest very often. Whenever he stopped, he listened and listened. Over and over, he spoke to himself.
        - id: ch01-b10
          speaker: peter_rabbit
          text: Oh, why did I ever go to the young peach orchard when I knew I shouldn't be there? Why wasn't I satisfied with all the good things I had in the Green Forest and on the Green Meadows? Oh, dear. Oh, dear!
          emotion: sad
        - id: ch01-b11
          speaker: narrator
          text: Just as jolly, round, red Mr. Sun began to light the Green Meadows, Peter reached the dear Old Briar-patch. Danny Meadow Mouse sat at its edge, watching anxiously for him.
        - id: ch01-b12
          speaker: narrator
          text: Peter crawled up and began to creep inside along one of his own little paths. He made it in, but the stake dragging behind him caught in the brambles. Right there, Peter fell into the snow. He was too tired and worn out to move.
