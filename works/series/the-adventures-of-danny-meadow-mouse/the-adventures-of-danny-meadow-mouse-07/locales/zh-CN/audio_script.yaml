audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 亲切而略带调侃的讲述
        timbre: 温暖清亮
        pace: 舒缓而有变化
        pitch: 中音
    danny_meadow_mouse:
      display_name: 草地鼠丹尼
      tts:
        delivery: 年轻直率，闹别扭时语气生硬
        timbre: 轻细明亮
        pace: 稍快
        pitch: 中高音
    granny_fox:
      display_name: 老狐狸奶奶
      tts:
        delivery: 老练沉着，盘算时胸有成竹
        timbre: 低沉略带沙哑
        pace: 从容
        pitch: 中低音
    reddy_fox:
      display_name: 狐狸雷迪
      tts:
        delivery: 急躁自负，心里打算盘时透着狡猾
        timbre: 清亮略尖
        pace: 稍快
        pitch: 中高音
  chapters:
    - id: ch01
      title: 第七章　老狐狸奶奶另想一计
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 老狐狸奶奶怎么也忘不了草地鼠丹尼。丹尼胖乎乎的，她每想一回，口水就要流一回。她早已下定决心，无论如何都要把他抓到手。上次她和雷迪钻进雪里，追着丹尼闯进那些小地道，一定把他吓得不轻。狐狸奶奶料定，丹尼不敢离开旧篱笆柱太远。柱子中间是空的，藏在里面又暖和又安全。
        - id: ch01-b02
          speaker: narrator
          text: 狐狸奶奶可精明着呢。她躺在一棵铁杉下面，心里盘算着下一顿饭该怎么弄到嘴。
        - id: ch01-b03
          speaker: granny_fox
          text: 这一两天，丹尼肯定连鼻子都不敢伸出旧篱笆柱。可他总关在里面，早晚会待腻的。到那时，他准会从一扇圆圆的小门探头看看。只要外面没有危险，他就会跑上雪地，去吃高草梢上露出来的草籽。要是一直没人惊动他，他就会离那根柱子远一点，再远一点。所以这几天，我得让他安安心心的，不能吓着他。
        - id: ch01-b04
          speaker: narrator
          text: 想好这个主意，她便把雷迪叫来，命令他留在绿草地外面，直到奶奶准他过来。雷迪嘴里不停地抱怨。他想去哪儿就该去哪儿，凭什么不行？可他还是不敢违抗。原来，上次追丹尼的时候，他钻进雪里，一只脚被铁丝倒刺扎伤了，现在只能靠三条腿跑。雷迪要想吃饱，全得指望狐狸奶奶帮忙，只好乖乖听话。
        - id: ch01-b05
          speaker: narrator
          text: 事情果然和狐狸奶奶想的一模一样。丹尼在旧篱笆柱里待烦了。他先探出头看看，接着跑上雪面，只跑了一小段。后来，他又跑远一点，再远一点。不过丹尼处处小心。不管跑到哪儿，附近总有一扇通往雪下地道的小圆门，最多一两跳就能钻进去。
        - id: ch01-b06
          speaker: narrator
          text: 狐狸奶奶躲在绿森林边上，把这一切看得清清楚楚。她又抬头望了望天，知道马上还会下雪。
        - id: ch01-b07
          speaker: granny_fox
          text: 好极了。明天早上，我就有肥嫩的草地鼠当早饭了。
          emotion: happy
        - id: ch01-b08
          speaker: narrator
          text: 狐狸奶奶说着，露出了一副馋嘴的笑容。
        - id: ch01-b09
          speaker: narrator
          text: 第二天一大早，快活、滚圆、红彤彤的太阳公公还没起床，狐狸奶奶已经小跑着来到草地，直奔埋在雪下的旧篱笆柱。夜里又落了一场雪。丹尼那些小小的门口，全让柔软的新雪盖住了。雷迪瘸着腿跟在后面，一路还在低声嘟囔。
        - id: ch01-b10
          speaker: narrator
          text: 到了地方，狐狸奶奶把身子压得平平的，紧贴着雪地趴好。她又叫雷迪把松软的新雪盖到自己身上。雷迪照办了，嘴里却始终抱怨个没完。
        - id: ch01-b11
          speaker: granny_fox
          text: 现在你回绿森林去，藏好，别让谁看见。等一会儿，我会带草地鼠回来，给你当早饭。
        - id: ch01-b12
          speaker: narrator
          text: 狐狸奶奶想到自己的计策这样聪明，又想到马上就能抓住丹尼，忍不住得意地咯咯笑了起来。
