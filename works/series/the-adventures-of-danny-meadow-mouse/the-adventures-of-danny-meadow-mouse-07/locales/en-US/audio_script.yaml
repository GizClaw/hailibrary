  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm, observant storytelling
        timbre: clear and gentle
        pace: measured
        pitch: medium
    danny_meadow_mouse:
      display_name: Danny Meadow Mouse
      tts:
        delivery: youthful and plainly expressive
        timbre: small and bright
        pace: lively
        pitch: medium-high
    reddy_fox:
      display_name: Reddy Fox
