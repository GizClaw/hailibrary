  chapters:
    - id: ch01
      title: Old Granny Fox Tries a New Plan
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Old Granny Fox couldn't stop thinking about Danny Meadow Mouse. She knew how fat he was, and every thought of him made her mouth water. She had made up her mind. One way or another, she would have him.
        - id: ch01-b02
          speaker: narrator
          text: Granny knew that she and Reddy had given Danny a terrible fright when they plunged through the snow after him. She was sure he would stay close to the old fence post. Inside its hollow center, he was warm and safe.
        - id: ch01-b03
          speaker: narrator
          text: Granny Fox was very smart. As she lay beneath a hemlock tree, wondering how to get her next meal, she worked out exactly what Danny would do.
        - id: ch01-b04
          speaker: granny_fox
          text: Danny won't even poke his nose out of that old fence post for a day or two. But he'll soon get tired of being shut inside. Then he'll peek from one of his little round doorways to see whether it's safe. If he sees no danger, he'll climb onto the snow and gather seeds from the tall grass tops. As long as nothing scares him, he'll wander a little farther from that fence post each time. So I must make sure nothing frightens him for the next few days.
        - id: ch01-b05
          speaker: narrator
          text: Then Granny called Reddy Fox over and told him he was not to set foot on the meadows until she gave him permission.
        - id: ch01-b06
          speaker: narrator
          text: Reddy grumbled and muttered. He couldn't see why he shouldn't go wherever he liked. Still, he didn't dare disobey Granny.
        - id: ch01-b07
          speaker: narrator
          text: Reddy had hurt his foot on a wire barb while diving through the snow after Danny. Now he could run on only three legs. He needed Granny's help if he was going to get enough food, so he had to do as she said.
        - id: ch01-b08
          speaker: narrator
          text: Everything happened just as Granny had expected. Danny did grow tired of hiding in the old fence post. First he peeped out. Then he ran a short way across the snow. Before long, he was going farther and farther from the fence post. Each trip took him a little farther than the one before.
        - id: ch01-b09
          speaker: narrator
          text: Even so, Danny was careful. He never strayed more than one or two jumps from a little round doorway that led to his tunnels beneath the snow.
        - id: ch01-b10
          speaker: narrator
          text: From her hiding place at the edge of the Green Forest, Granny watched him. Then she looked up at the sky and saw that more snow was coming.
        - id: ch01-b11
          speaker: granny_fox
          text: Good. Tomorrow morning, I'll have a fat Meadow Mouse for breakfast.
        - id: ch01-b12
          speaker: narrator
          text: Granny smiled a hungry smile.
        - id: ch01-b13
          speaker: narrator
          text: Early the next morning, before jolly, round, red Mr. Sun was out of bed, Granny Fox trotted onto the meadows. She went straight to the spot where the old fence post lay beneath the snow.
        - id: ch01-b14
          speaker: narrator
          text: Fresh snow had fallen in the night. It was soft and fleecy, and it covered every one of Danny's little doorways. Reddy Fox limped along behind Granny, grumbling to himself.
        - id: ch01-b15
          speaker: narrator
          text: When they reached the buried fence post, Granny stretched herself as flat as she could. She ordered Reddy to cover her with the new snow. Reddy obeyed, though he grumbled the whole time.
        - id: ch01-b16
          speaker: granny_fox
          text: Now go back to the Green Forest and stay out of sight. Before long, I'll bring you a Meadow Mouse for breakfast.
        - id: ch01-b17
          speaker: narrator
          text: Granny chuckled. She was very pleased with her clever plan for catching Danny Meadow Mouse.
