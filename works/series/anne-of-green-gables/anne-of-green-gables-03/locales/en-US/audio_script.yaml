audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm, observant, and gently amused
        timbre: clear and rounded
        pace: measured
        pitch: medium
    matthew_cuthbert:
      display_name: Matthew Cuthbert
      tts:
        delivery: shy, hesitant, and quietly kind
        timbre: soft and weathered
        pace: unhurried
        pitch: low
    anne_shirley:
      display_name: Anne Shirley
      tts:
        delivery: vivid, earnest, and eagerly imaginative
        timbre: clear and youthful
        pace: lively
        pitch: medium-high
    marilla_cuthbert:
      display_name: Marilla Cuthbert
      tts:
        delivery: firm, practical, and restrained
        timbre: clear and mature
        pace: steady
        pitch: medium-low
  chapters:
    - id: ch01
      title: Marilla Cuthbert Is Surprised
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            Marilla came briskly forward when Matthew opened the door. Then she saw the odd little figure beside him. The child wore a stiff, ugly dress. Long red braids hung down her back, and her bright eyes were full of expectation. Marilla stopped short.
        - id: ch01-b02
          speaker: marilla_cuthbert
          text: Matthew Cuthbert, who is that? Where's the boy?
          emotion: surprised
        - id: ch01-b03
          speaker: matthew_cuthbert
          text: There wasn't any boy. There was only... her.
        - id: ch01-b04
          speaker: narrator
          text: >-
            He nodded toward the child and suddenly remembered that he had never even asked her name.
        - id: ch01-b05
          speaker: marilla_cuthbert
          text: No boy? There had to be a boy. We told Mrs. Spencer to bring us one.
          emotion: surprised
        - id: ch01-b06
          speaker: matthew_cuthbert
          text: >-
            Well, she didn't. She brought this girl. I checked with the stationmaster, and I had to bring her home. Whatever caused the mistake, I couldn't leave her there.
        - id: ch01-b07
          speaker: marilla_cuthbert
          text: Well, this is a fine mess!
          emotion: angry
        - id: ch01-b08
          speaker: narrator
          text: >-
            All this time, the child listened without a word. Her eyes traveled from Marilla to Matthew and back again, while all the life slowly faded from her face. Then she understood exactly what they meant. She dropped her precious carpetbag, sprang forward one step, and clasped her hands.
        - id: ch01-b09
          speaker: anne_shirley
          text: >-
            You don't want me! You don't want me because I'm not a boy! I should have known. Nobody has ever wanted me. It was all too beautiful to last. Oh, what am I going to do? I'm going to burst into tears!
          emotion: sad
        - id: ch01-b10
          speaker: narrator
          text: >-
            And that was exactly what she did. She dropped into a chair by the table, flung her arms across it, and buried her face in them. Then she cried as if a storm had broken inside her. Across the stove, Marilla and Matthew exchanged helpless, apologetic looks. Neither of them knew what to say or what to do. At last Marilla stepped awkwardly into the silence.
        - id: ch01-b11
          speaker: marilla_cuthbert
          text: There, there. You don't need to cry like this.
        - id: ch01-b12
          speaker: anne_shirley
          text: >-
            Yes, I do! You would cry too if you were an orphan and came to a place you thought would be home, only to learn they didn't want you because you weren't a boy. This is the most tragical thing that has ever happened to me!
          emotion: sad
        - id: ch01-b13
          speaker: narrator
          text: >-
            Something like a reluctant smile softened Marilla's stern expression. It was a rusty sort of smile, as if she had not used it in a very long time.
        - id: ch01-b14
          speaker: marilla_cuthbert
          text: >-
            All right, no more crying. We aren't putting you outdoors tonight. You'll stay here while we find out what happened. Now, what's your name?
        - id: ch01-b15
          speaker: narrator
          text: The child hesitated.
        - id: ch01-b16
          speaker: anne_shirley
          text: Would you please call me Cordelia?
        - id: ch01-b17
          speaker: marilla_cuthbert
          text: Call you Cordelia? Is that your name?
        - id: ch01-b18
          speaker: anne_shirley
          text: >-
            No-o-o, not exactly. But I would dearly love to be called Cordelia. It's such an elegant name.
        - id: ch01-b19
          speaker: marilla_cuthbert
          text: What in the world do you mean? If your name isn't Cordelia, what is it?
        - id: ch01-b20
          speaker: anne_shirley
          text: >-
            Anne Shirley. But please, couldn't you call me Cordelia? If I'm only staying a little while, it can't matter much to you. And Anne is so unromantic.
        - id: ch01-b21
          speaker: marilla_cuthbert
          text: >-
            Unromantic fiddlesticks! Anne is a good, plain, sensible name. There's nothing in it to be ashamed of.
        - id: ch01-b22
          speaker: anne_shirley
          text: >-
            I'm not ashamed. I just like Cordelia better. Lately I've always imagined that was my name. When I was younger, I imagined I was Geraldine, but now I prefer Cordelia. Still, if you must call me Anne, please make it Anne with an E.
        - id: ch01-b23
          speaker: marilla_cuthbert
          text: What difference can the spelling make?
        - id: ch01-b24
          speaker: narrator
          text: Another rusty smile appeared as Marilla picked up the teapot.
        - id: ch01-b25
          speaker: anne_shirley
          text: >-
            It makes such a difference! When you hear a name, don't you see it in your mind as if it were printed? I do. A-n-n looks dreadful, but A-n-n-e looks so much more distinguished. If you'll call me Anne with an E, I'll try to make peace with not being Cordelia.
        - id: ch01-b26
          speaker: marilla_cuthbert
          text: >-
            Very well, Anne with an E. Can you explain how this mistake happened? We asked Mrs. Spencer for a boy. Weren't there any boys at the asylum?
        - id: ch01-b27
          speaker: anne_shirley
          text: >-
            Oh, there were plenty. But Mrs. Spencer said very clearly that you wanted an eleven-year-old girl, and the matron thought I would do. I was so delighted I couldn't sleep at all last night.
        - id: ch01-b28
          speaker: narrator
          text: Anne turned toward Matthew, her voice full of hurt.
        - id: ch01-b29
          speaker: anne_shirley
          text: >-
            Why didn't you tell me at the station that you didn't want me? You could have left me there. If I had never seen the White Way of Delight and the Lake of Shining Waters, this wouldn't hurt so much.
          emotion: sad
        - id: ch01-b30
          speaker: marilla_cuthbert
          text: What on earth is she talking about?
        - id: ch01-b31
          speaker: matthew_cuthbert
          text: >-
            She... she means some things we talked about on the drive. I'm going out to put the mare away, Marilla. Have tea ready when I get back.
        - id: ch01-b32
          speaker: narrator
          text: Matthew escaped to the barn. Marilla continued her questions.
        - id: ch01-b33
          speaker: marilla_cuthbert
          text: Did Mrs. Spencer bring anyone else with her?
        - id: ch01-b34
          speaker: anne_shirley
          text: >-
            She brought Lily Jones for herself. Lily is only five, and she's very beautiful, with nut-brown hair. If I were beautiful and had nut-brown hair, would you keep me?
        - id: ch01-b35
          speaker: marilla_cuthbert
          text: >-
            No. We need a boy to help Matthew on the farm. A girl is no use to us. Take off your hat. I'll put it and your bag on the hall table.
        - id: ch01-b36
          speaker: narrator
          text: Anne obeyed meekly.
        - id: ch01-b37
          speaker: narrator
          text: >-
            Matthew soon returned, and they sat down to supper. Anne could not eat. She tried nibbling at her bread and butter. She pecked at the crab-apple preserve in the little scalloped glass dish beside her plate. But no matter how she tried, she made no real progress at all.
        - id: ch01-b38
          speaker: marilla_cuthbert
          text: You're not eating anything.
        - id: ch01-b39
          speaker: narrator
          text: >-
            Marilla spoke sharply and watched Anne as if failing to eat were a serious fault. Anne could only sigh.
        - id: ch01-b40
          speaker: anne_shirley
          text: I can't eat. I'm in the depths of despair. Can you eat when you're in the depths of despair?
          emotion: sad
        - id: ch01-b41
          speaker: marilla_cuthbert
          text: I've never been there, so I couldn't say.
        - id: ch01-b42
          speaker: anne_shirley
          text: Never? But have you ever tried to imagine you were in the depths of despair?
        - id: ch01-b43
          speaker: marilla_cuthbert
          text: No, I haven't.
        - id: ch01-b44
          speaker: anne_shirley
          text: >-
            Then you can't know how uncomfortable it is. The moment you try to eat, a lump rises in your throat and you can't swallow, not even if the food were a chocolate caramel. I had one chocolate caramel two years ago, and it was delicious. Ever since, I've dreamed of having piles of them, but I always wake up just as I'm about to taste one.
        - id: ch01-b45
          speaker: anne_shirley
          text: >-
            Please don't be offended because I can't eat. Everything is extremely nice. I simply can't manage it.
        - id: ch01-b46
          speaker: narrator
          text: Matthew had said nothing since coming back from the barn. Now he spoke up.
        - id: ch01-b47
          speaker: matthew_cuthbert
          text: I reckon she's tired. Best put her to bed, Marilla.
        - id: ch01-b48
          speaker: narrator
          text: >-
            Marilla had been wondering where Anne should sleep. She had made up a couch in the room above the kitchen for the boy they wanted and expected. The room was neat and clean, but somehow it did not seem right to put a girl there. The spare room was out of the question for a stray orphan. That left only the east gable room.
        - id: ch01-b49
          speaker: narrator
          text: >-
            Marilla lit a candle and told Anne to follow. Anne picked up her hat and carpetbag as she passed the hall table and trailed along without spirit. The hall was frighteningly clean. The little gable room looked cleaner still. Marilla placed the candle on a three-legged corner table and turned down the bedclothes.
        - id: ch01-b50
          speaker: marilla_cuthbert
          text: I suppose you have a nightgown?
        - id: ch01-b51
          speaker: narrator
          text: Anne nodded.
        - id: ch01-b52
          speaker: anne_shirley
          text: >-
            I have two. The asylum matron made them, but they're terribly skimpy. There is never enough of anything in a poor asylum, so everything has to be skimpy. I hate skimpy nightgowns. Still, you can dream just as well in one as you can in a lovely trailing nightgown with frills around the neck. That's one comfort.
        - id: ch01-b53
          speaker: marilla_cuthbert
          text: >-
            Get undressed quickly and go to bed. I'll be back for the candle in a few minutes. I can't trust you to put it out. You might set the house on fire.
        - id: ch01-b54
          speaker: narrator
          text: >-
            After Marilla left, Anne looked around sadly. The whitewashed walls were painfully bare. They seemed to stare at her, and she thought they must ache from their own emptiness. The floor was bare too, except for a round braided mat unlike any Anne had seen. A high, old-fashioned bed stood in one corner, with four dark, low-turned posts. In the other corner was the three-sided table. On it sat a fat red velvet pincushion, so hard it could turn the point of the boldest pin. A tiny mirror, only six inches by eight, hung above it.
        - id: ch01-b55
          speaker: narrator
          text: >-
            Halfway between the table and the bed was the window, edged with an icy white muslin ruffle. The washstand stood across from it. Everything in the room felt so stiff and severe that words could hardly describe it. The feeling sent a shiver right through Anne's bones. With a sob, she hurried out of her clothes, pulled on one of the skimpy nightgowns, and sprang into bed. Then she burrowed face-first into the pillow and dragged the covers over her head.
        - id: ch01-b56
          speaker: narrator
          text: >-
            When Marilla returned for the candle, Anne's few skimpy clothes lay scattered untidily across the floor. The stormy-looking bed was the only other sign that anyone was in the room besides Marilla herself. Marilla deliberately picked up each garment, set them all neatly on a prim yellow chair, and then took the candle over to the bedside.
        - id: ch01-b57
          speaker: marilla_cuthbert
          text: Good night.
        - id: ch01-b58
          speaker: narrator
          text: >-
            The words came out a little awkwardly, but Marilla did not sound unkind. Anne's white face and enormous eyes suddenly appeared above the covers.
        - id: ch01-b59
          speaker: anne_shirley
          text: How can you call it a good night when you know this is the very worst night I've ever had?
          emotion: sad
        - id: ch01-b60
          speaker: narrator
          text: Then she disappeared under the covers again.
        - id: ch01-b61
          speaker: narrator
          text: >-
            Marilla went slowly downstairs and began washing the supper dishes. Matthew was smoking, a sure sign that something weighed on his mind. He rarely smoked because Marilla strongly disapproved of the filthy habit. But at certain times he felt driven to it. Then Marilla pretended not to notice, because she understood that even a man needed some way to let out his feelings.
        - id: ch01-b62
          speaker: marilla_cuthbert
          text: >-
            Well, here's a pretty kettle of fish. This is what we get for sending a message instead of going ourselves. Someone in Richard Spencer's family must have mixed it up. One of us has to drive over and speak to Mrs. Spencer tomorrow. The girl will have to go back to the asylum.
          emotion: angry
        - id: ch01-b63
          speaker: matthew_cuthbert
          text: Yes, I suppose so.
        - id: ch01-b64
          speaker: marilla_cuthbert
          text: You suppose so? Don't you know?
        - id: ch01-b65
          speaker: matthew_cuthbert
          text: >-
            Well now, she's a real nice little thing, Marilla. Seems a shame to send her back when she wants so badly to stay.
        - id: ch01-b66
          speaker: marilla_cuthbert
          text: Matthew Cuthbert! You don't truly think we should keep her, do you?
          emotion: surprised
        - id: ch01-b67
          speaker: narrator
          text: >-
            Marilla stared at him. Her astonishment could not have been any greater if Matthew had announced that he had a special liking for standing on his head.
        - id: ch01-b68
          speaker: matthew_cuthbert
          text: >-
            Well now, no. Not exactly. I suppose no one could expect us to keep her.
        - id: ch01-b69
          speaker: narrator
          text: >-
            Matthew had not meant to go quite that far. Now Marilla had cornered him and wanted him to say exactly what he meant. He stammered and shifted uncomfortably.
        - id: ch01-b70
          speaker: marilla_cuthbert
          text: I should think not. What use would she be to us?
        - id: ch01-b71
          speaker: matthew_cuthbert
          text: Maybe we could be some use to her.
        - id: ch01-b72
          speaker: narrator
          text: The answer came so suddenly that it surprised them both.
        - id: ch01-b73
          speaker: marilla_cuthbert
          text: >-
            Matthew Cuthbert, that child has bewitched you! It's perfectly plain that you want to keep her.
          emotion: surprised
        - id: ch01-b74
          speaker: matthew_cuthbert
          text: >-
            Well now, she's a real interesting little thing. You should have heard her talking on the way from the station.
        - id: ch01-b75
          speaker: marilla_cuthbert
          text: >-
            Oh, she can talk. I noticed that immediately, and it doesn't count in her favor. I don't care for children who always have something to say. I don't want an orphan girl, and if I did, she isn't the sort I'd choose. There's something about her I don't understand. No, she must go straight back where she came from.
        - id: ch01-b76
          speaker: matthew_cuthbert
          text: I could hire a French boy to help me. And she could keep you company.
        - id: ch01-b77
          speaker: marilla_cuthbert
          text: I don't need company, and I am not keeping her.
        - id: ch01-b78
          speaker: matthew_cuthbert
          text: Well now, it's your decision, of course, Marilla. I'm going to bed.
        - id: ch01-b79
          speaker: narrator
          text: >-
            Matthew rose, put away his pipe, and went to bed. Marilla finished washing the dishes and put every one of them away. Then she went to bed too, still wearing her most determined frown.
        - id: ch01-b80
          speaker: narrator
          text: >-
            Upstairs in the east gable, a lonely, heart-hungry, friendless child cried herself to sleep.
