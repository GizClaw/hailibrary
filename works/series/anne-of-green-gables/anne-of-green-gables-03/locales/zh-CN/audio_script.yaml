audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖从容，带着细腻而机智的讲述感
        timbre: 清澈柔和
        pace: 舒缓而有变化
        pitch: 中音
    anne:
      display_name: 安妮
      tts:
        delivery: 热切灵动，想法接连涌出，真挚而富于想象
        timbre: 清亮稚嫩
        pace: 明快，动情处自然放慢
        pitch: 中高音
    matthew:
      display_name: 马修
      tts:
        delivery: 腼腆温厚，说话迟缓而谨慎
        timbre: 低沉柔和
        pace: 缓慢
        pitch: 中低音
    marilla:
      display_name: 玛丽拉
      tts:
        delivery: 干脆严谨，言语直截了当，偶尔透出克制的温情
        timbre: 清晰沉稳
        pace: 中等
        pitch: 中音
  chapters:
    - id: ch01
      title: 第三章　玛丽拉·卡思伯特大吃一惊
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 马修一开门，玛丽拉便快步迎上来。可她看见那个古怪的小姑娘，脚步一下停住了。孩子穿着又硬又难看的裙子，两根红色长辫垂在身后，一双眼睛又热切又明亮。玛丽拉吃惊得愣在原地。
        - id: ch01-b02
          speaker: marilla
          text: 马修·卡思伯特，这孩子是谁？我们要的男孩呢？
          emotion: surprised
        - id: ch01-b03
          speaker: matthew
          text: 根本没有男孩。到车站以后，我只看见了她。
        - id: ch01-b04
          speaker: narrator
          text: 马修朝孩子点点头，这才记起来，自己一路上竟然连她的名字都没问。
        - id: ch01-b05
          speaker: marilla
          text: 怎么会没有男孩？明明应该有一个。我们捎给斯宾塞太太的话，说的就是带个男孩回来。
        - id: ch01-b06
          speaker: matthew
          text: 可她没有带男孩，带来的是这个孩子。我问过站长了。不管是谁弄错了，总不能把她独自留在那里，所以我只好先把她带回来。
        - id: ch01-b07
          speaker: marilla
          text: 这件事办得可真漂亮！
        - id: ch01-b08
          speaker: narrator
          text: 两人说话的时候，孩子一直静静听着。她的眼睛在马修和玛丽拉之间来回望，脸上的光彩一点点消失了。忽然，她完全听懂了。她扔下视若珍宝的旅行毯包，跳上前一步，紧紧握住双手。
        - id: ch01-b09
          speaker: anne
          text: 你们不要我！就因为我不是男孩，你们就不要我！我早该猜到的，从来没有人想要我。这一切实在太美好了，怎么可能长久呢？根本不会有人真的要我。啊，我该怎么办？我要忍不住大哭了！
          emotion: sad
        - id: ch01-b10
          speaker: narrator
          text: 说完，安妮真的大哭起来。她坐到桌边，把两条胳膊往桌上一扑，脸埋进臂弯里，哭声像暴风雨一样猛烈。玛丽拉和马修隔着炉子无奈地望着对方，谁也不知道该怎么办。最后，还是玛丽拉勉强开了口。
        - id: ch01-b11
          speaker: marilla
          text: 好了，好了，这件事也不至于让你哭成这样。
        - id: ch01-b12
          speaker: anne
          text: 当然至于！要是您也是孤儿，好不容易来到一个地方，以为这里终于会成为自己的家，却发现人家只因为您不是男孩就不要您，您一样会哭的。这是我这辈子遇到过最悲惨的事！
          emotion: sad
        - id: ch01-b13
          speaker: narrator
          text: 安妮猛地抬起头，脸上全是泪，嘴唇还在发抖。玛丽拉那张严厉的脸软了一点，竟然露出一丝不情愿的笑。她太久没笑过，那笑意简直已经生了锈。
        - id: ch01-b14
          speaker: marilla
          text: 别再哭了。今晚我们不会把你赶出去。等把这件事查清楚了再说。你叫什么名字？
        - id: ch01-b15
          speaker: narrator
          text: 孩子犹豫了一会儿，随后急切地提出了一个请求。
        - id: ch01-b16
          speaker: anne
          text: 您能不能叫我考狄利娅？
        - id: ch01-b17
          speaker: marilla
          text: 叫你考狄利娅？难道那是你的名字？
        - id: ch01-b18
          speaker: anne
          text: 不——不——不，也不完全是。可我一直特别想让人这样叫我。考狄利娅听起来多优雅呀。
        - id: ch01-b19
          speaker: marilla
          text: 我根本听不懂你在说什么。既然考狄利娅不是你的名字，那你的真名是什么？
        - id: ch01-b20
          speaker: anne
          text: 我叫安妮·雪莉。可求您还是叫我考狄利娅吧。反正我只能在这里待一会儿，叫什么对您也没有多大分别，对不对？安妮这个名字实在太不浪漫了。
        - id: ch01-b21
          speaker: marilla
          text: 什么不浪漫，尽是胡话。安妮这个名字朴实、正派，听起来也明白事理，你根本不必嫌弃它。
        - id: ch01-b22
          speaker: anne
          text: 我没有嫌弃安妮，只是更喜欢考狄利娅。这几年，我总把自己想成考狄利娅。再小一点的时候，我想象自己叫杰拉尔丁，可现在还是考狄利娅更好。不过，要是您一定叫我安妮，请记得是末尾带一个“e”的 Anne。
        - id: ch01-b23
          speaker: narrator
          text: 玛丽拉拿起茶壶，脸上又闪过一丝生锈的笑意。
        - id: ch01-b24
          speaker: marilla
          text: 一个名字怎么拼，真有那么大分别吗？
        - id: ch01-b25
          speaker: anne
          text: 当然有，分别可大了。带“e”的样子漂亮多了。您听到一个名字时，难道不会在心里看见它印在纸上的模样吗？我每次都能看见。A-n-n 难看极了，A-n-n-e 却显得高贵得多。只要您肯叫我末尾带“e”的 Anne，我就努力接受自己不能叫考狄利娅这件事。
        - id: ch01-b26
          speaker: marilla
          text: 好吧，末尾带“e”的安妮。现在告诉我们，这场误会到底是怎么来的？我们请斯宾塞太太带一个男孩。难道孤儿院里连一个男孩也没有？
        - id: ch01-b27
          speaker: anne
          text: 男孩多得很呢。可是斯宾塞太太说得特别清楚，说你们要的是一个十一岁左右的女孩。院长也觉得我合适。我当时高兴极了，昨晚整整一夜都没睡着。
        - id: ch01-b28
          speaker: narrator
          text: 说到这里，安妮责怪地转向马修。
        - id: ch01-b29
          speaker: anne
          text: 您为什么不在车站就告诉我，你们根本不想要我，然后把我留在那里呢？要是没看见喜悦的洁白之路和闪光之湖，我现在也不会这么难过。
          emotion: sad
        - id: ch01-b30
          speaker: marilla
          text: 她说的这些到底是什么意思？
        - id: ch01-b31
          speaker: matthew
          text: 她……她只是提到我们路上说过的几句话。我先出去安顿母马。玛丽拉，我回来时就吃晚饭吧。
        - id: ch01-b32
          speaker: narrator
          text: 马修匆匆出去了。玛丽拉继续盘问安妮。
        - id: ch01-b33
          speaker: marilla
          text: 斯宾塞太太这次除了你，还从孤儿院带了谁过来？
        - id: ch01-b34
          speaker: anne
          text: 她给自己带了莉莉·琼斯。莉莉才五岁，人长得非常漂亮，还有一头栗褐色的头发。如果我也那么漂亮，也有栗褐色的头发，您会不会留下我？
        - id: ch01-b35
          speaker: marilla
          text: 不会。我们需要男孩，是为了帮马修干农活。女孩帮不上我们的忙。把帽子摘下来，我把它和旅行包放到门厅桌上。
        - id: ch01-b36
          speaker: narrator
          text: 安妮顺从地摘下帽子。过了一会儿，马修回来了，三个人坐下吃晚饭。安妮却一口也吃不下。她勉强咬了几口黄油面包，又拿叉子碰了碰花边小玻璃碟里的海棠果酱，到底还是没吃下多少。
        - id: ch01-b37
          speaker: marilla
          text: 你怎么什么也不吃？
        - id: ch01-b38
          speaker: narrator
          text: 玛丽拉严厉地看着她，仿佛不吃饭是个很严重的缺点。安妮长长地叹了一口气。
        - id: ch01-b39
          speaker: anne
          text: 我真的吃不下。我已经在绝望的深渊里了。您掉进绝望的深渊时，还能吃得下东西吗？
          emotion: sad
        - id: ch01-b40
          speaker: marilla
          text: 我从来没掉进过什么绝望的深渊，所以不知道。
        - id: ch01-b41
          speaker: anne
          text: 从来没有吗？那您试没试过想象自己掉进去了？
        - id: ch01-b42
          speaker: marilla
          text: 没有，我也没想象过。
        - id: ch01-b43
          speaker: anne
          text: 那您肯定不明白这种滋味。人在绝望的深渊里，喉咙会堵着一个硬疙瘩，什么也咽不下去，连巧克力焦糖都不行。两年前我吃过一颗，真是好吃极了。后来我常梦见自己有一大堆巧克力焦糖，可每次刚要吃就醒了。您可别因为我吃不下而生气。桌上的东西都很好吃，可我现在实在咽不下去。
        - id: ch01-b44
          speaker: matthew
          text: 我看她只是累了。玛丽拉，最好让她早点上床睡觉。
        - id: ch01-b45
          speaker: narrator
          text: 马修从马棚回来以后，这是头一回开口。其实，玛丽拉也一直在想该让安妮睡在哪儿。她原本在厨房楼上的房间铺了一张小床，是给那个盼来的男孩准备的。那里又整齐又干净，可让女孩睡进去，似乎不太合适。客房当然不能给一个来历还没弄清楚的孤儿。想来想去，只剩下东山墙那间房了。
        - id: ch01-b46
          speaker: narrator
          text: 玛丽拉点起蜡烛，叫安妮跟她上楼。安妮没精打采地跟在后面，经过门厅时拿上自己的帽子和旅行毯包。门厅干净得吓人。等她走进那间小小的山墙屋，才发现这里更是干净得叫人害怕。玛丽拉把蜡烛放到三条腿的三角桌上，又替她掀开床铺。
        - id: ch01-b47
          speaker: marilla
          text: 你应该带了睡衣吧？
        - id: ch01-b48
          speaker: narrator
          text: 安妮点点头。
        - id: ch01-b49
          speaker: anne
          text: 我有两件，都是孤儿院院长做的，可每一件都窄小得吓人。孤儿院的东西不够分，衣服只好做得又窄又小，至少我们那所穷孤儿院是这样。我最讨厌这样的睡衣了。不过，穿着它也一样能做梦，就像穿着那种领口有花边、长长拖到脚边的漂亮睡衣。想到这一点，还能得到一点安慰。
        - id: ch01-b50
          speaker: marilla
          text: 那就赶紧脱衣服上床。过几分钟我来拿蜡烛。可不能让你自己吹灭，我怕你一不小心把房子烧了。
        - id: ch01-b51
          speaker: narrator
          text: 玛丽拉走后，安妮凄凉地打量着房间。刷白的墙空空荡荡，直愣愣地瞪着人。安妮觉得，墙壁一定也在为自己的空荡发疼。地板同样光秃秃的，正中间只有一张圆形编织地垫，那样式她从来没见过。屋子一角放着一张高高的老式床，四根深色床柱不算高，柱头车成圆形。另一角是那张三角桌，桌上摆着一个胖胖的红丝绒针垫，硬得连最大胆的针扎上去都要折回针尖。上方还挂着一面六英寸宽、八英寸高的小镜子。
        - id: ch01-b52
          speaker: narrator
          text: 床和桌子中间有一扇窗，窗上的白色细布花边冷冰冰的。对面摆着盥洗架。整间屋子说不出的僵硬，让安妮从骨髓里打了个寒战。她抽噎着匆匆脱掉衣服，换上窄小的睡衣，一头扑到床上。她把脸埋进枕头，又将被子拉过头顶。玛丽拉上来取蜡烛时，只看见那些窄小的衣物乱糟糟地散在地板上，床铺仿佛刚经历过一场风暴。除此之外，根本瞧不出房里还有一个人。
        - id: ch01-b53
          speaker: narrator
          text: 玛丽拉慢慢捡起安妮的衣服，把它们整齐地放到一把端正的黄椅子上。接着，她拿起蜡烛走到床边，语气有点别扭，却并不冷酷。
        - id: ch01-b54
          speaker: marilla
          text: 晚安。
        - id: ch01-b55
          speaker: narrator
          text: 安妮苍白的脸和一双大眼睛忽然从被子上方冒了出来，快得叫人吃惊。
        - id: ch01-b56
          speaker: anne
          text: 您明明知道，这肯定是我一生中最糟糕的一夜，怎么还能说它是“好”晚呢？
          emotion: sad
        - id: ch01-b57
          speaker: narrator
          text: 安妮责怪完，又一头钻进被子，彻底看不见了。玛丽拉慢慢下楼，回到厨房洗晚饭留下的碗碟。马修正在抽烟，这准是他心里不安的记号。他平时很少抽，因为玛丽拉把抽烟看成一种肮脏的习惯，一向坚决反对。只有到了实在难受的时候，马修才非抽不可。碰上这种时候，玛丽拉也会装作没看见。她知道，一个男人总得找个地方放一放自己的情绪。
        - id: ch01-b58
          speaker: marilla
          text: 这回可真乱成一团了。只托人捎话，不亲自跑一趟，果然会出岔子。准是理查德·斯宾塞家里把话传错了。明天咱们当中必须有一个驾车过去，找斯宾塞太太问个清楚。至于这个女孩，只能送回孤儿院。
          emotion: angry
        - id: ch01-b59
          speaker: matthew
          text: 是啊，我想只能这样了。
        - id: ch01-b60
          speaker: marilla
          text: 你只是“想”吗？这还有什么不能肯定的？
        - id: ch01-b61
          speaker: matthew
          text: 唔，这孩子其实挺不错。她一心盼着留在这里，现在再把她送回去，总觉得有点可惜。
        - id: ch01-b62
          speaker: marilla
          text: 马修·卡思伯特，你不会真想说，我们应该把她留下吧！
          emotion: surprised
        - id: ch01-b63
          speaker: narrator
          text: 哪怕马修说他很想倒立，玛丽拉也不会比现在更吃惊。马修被逼着说清自己的意思，浑身都不自在，说起话来也结结巴巴。
        - id: ch01-b64
          speaker: matthew
          text: 唔，不，我想也不是……不完全是那个意思。我只是觉得，大概确实不能指望我们留下她。
        - id: ch01-b65
          speaker: marilla
          text: 那还用说。留下她能给我们帮什么忙？
        - id: ch01-b66
          speaker: matthew
          text: 可也许，我们能给她帮上一点忙。
        - id: ch01-b67
          speaker: narrator
          text: 这句话来得又突然又意外。
        - id: ch01-b68
          speaker: marilla
          text: 马修·卡思伯特，我看你是被那孩子迷住了！别想瞒我，你明明就想留下她。
        - id: ch01-b69
          speaker: matthew
          text: 唔，她真是个挺有意思的小家伙。你要是听见她从车站一路说回来的那些话，就明白了。
        - id: ch01-b70
          speaker: marilla
          text: 她当然很能说，这一点我一眼就看出来了。可这算不上什么优点，我不喜欢话太多的孩子。我本来就不想要孤女，就算想要，也不会挑她这样的。她身上有些地方，我实在弄不明白。不行，必须马上把她送回原来的地方。
        - id: ch01-b71
          speaker: matthew
          text: 农活可以雇一个法裔男孩来帮我。把她留下，她还能陪着你。
        - id: ch01-b72
          speaker: marilla
          text: 我不缺人陪，也绝不会留下她。
        - id: ch01-b73
          speaker: matthew
          text: 唔，那当然按你说的办，玛丽拉。我去睡了。
        - id: ch01-b74
          speaker: narrator
          text: 马修站起来，收好烟斗，上床去了。等玛丽拉把碗碟全部收好，她也皱紧眉头，上床去了。楼上的东山墙里，那个孤独、渴望着爱、身边一个朋友也没有的孩子，独自哭着，最后在泪水中睡着了。
