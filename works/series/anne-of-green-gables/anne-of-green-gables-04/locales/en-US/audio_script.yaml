  chapters:
    - id: ch01
      title: Morning at Green Gables
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            Anne woke in broad daylight and sat up in bed, confused. Cheerful sunshine poured through the window. Beyond the glass, something white and feathery moved against patches of blue sky. For one lovely moment, she could not remember where she was. A delicious thrill came first, as though something wonderful had happened. Then the terrible memory returned. This was Green Gables, and they did not want her because she was not a boy.
        - id: ch01-b02
          speaker: narrator
          text: >-
            But morning had come, and outside her window stood a cherry tree in full bloom. Anne leaped out of bed and hurried across the room. The window creaked and resisted when she pushed it up. It had been shut for a long time, and once it opened, it stuck there without any help.
        - id: ch01-b03
          speaker: narrator
          text: >-
            Anne dropped to her knees and looked out at the June morning, her eyes shining with delight. How could any place be so beautiful? Even if she could not really stay, she could pretend for a while that she belonged there. Green Gables gave her imagination room to roam.
        - id: ch01-b04
          speaker: narrator
          text: >-
            The great cherry tree grew so close that its branches tapped against the house. Blossoms covered it so thickly that hardly a leaf showed. Apple trees filled the orchard on one side of the house and cherry trees filled the other. Both orchards were showered with blooms, and yellow dandelions sprinkled the grass. In the garden below, lilac trees were purple with flowers. Their rich, almost dizzying sweetness floated up to the window on the morning breeze.
        - id: ch01-b05
          speaker: narrator
          text: >-
            Beyond the garden, a green field thick with clover sloped toward the hollow. A brook ran there among scores of slender white birches. Ferns, moss, and all kinds of inviting woodland things grew beneath them. Farther off rose a soft green hill of spruce and fir. Through a gap in the trees, Anne could see the gray gable of the little house she had noticed across the Lake of Shining Waters. To the left stood the big barns. Past them, beyond the low green fields, she caught one sparkling blue glimpse of the sea.
        - id: ch01-b06
          speaker: narrator
          text: >-
            Anne's beauty-loving eyes lingered over every part of the view. She took it in hungrily. The poor child had spent her life looking at so many ugly places, but this was as lovely as anything she had ever dreamed. She knelt there, lost in it all, until a hand on her shoulder made her jump. Marilla had entered without the small dreamer hearing a sound.
        - id: ch01-b07
          speaker: marilla_cuthbert
          text: It's time to get dressed.
        - id: ch01-b08
          speaker: narrator
          text: >-
            Marilla truly had no idea how to talk to this child. She knew it, and the feeling made her uncomfortable. So her voice came out crisp and sharp even when she did not mean to be unkind. Anne rose from the window and took a long breath.
        - id: ch01-b09
          speaker: anne_shirley
          text: Oh, isn't it all wonderful?
          emotion: happy
        - id: ch01-b10
          speaker: narrator
          text: She swept a hand toward the whole bright world outside.
        - id: ch01-b11
          speaker: marilla_cuthbert
          text: >-
            That tree is big, and it blooms well enough. But the cherries are no good. They're small and wormy.
        - id: ch01-b12
          speaker: anne_shirley
          text: >-
            Oh, I don't mean only the tree. It is radiantly lovely, of course. It blooms as if it truly means to. But I mean everything. The garden, the orchards, the brook, the woods, this whole dear world. Don't mornings like this make you love the world? I can hear the brook laughing from up here. Brooks are so cheerful. They laugh all the time. I've even heard them laughing under the ice in winter. I'm so glad Green Gables has a brook. Maybe you think it shouldn't matter when you aren't going to keep me, but it does. Even if I never see it again, I'll remember that brook. If there weren't one, I'd always feel there ought to be. I'm not in the depths of despair this morning. I never can be in the morning. Aren't mornings splendid? Still, I am very sad. I was pretending that you wanted me after all, and that I would stay here forever. It comforted me while I could believe it. The worst part of imagining is having to stop. That's when it hurts.
          emotion: sad
        - id: ch01-b13
          speaker: marilla_cuthbert
          text: >-
            Never mind all that. Get dressed and come downstairs. Breakfast is ready. Wash your face, comb your hair, leave the window open, and fold the bedclothes back over the foot of the bed. Hurry now.
        - id: ch01-b14
          speaker: narrator
          text: >-
            Anne could hurry when she chose. Ten minutes later she was downstairs. Her clothes were neatly on, her face was washed, and her hair had been brushed and braided. A warm feeling of satisfaction filled her. She was sure she had done everything Marilla asked. In fact, she had forgotten to turn back the bedclothes.
        - id: ch01-b15
          speaker: anne_shirley
          text: >-
            I'm quite hungry this morning. The world doesn't feel as much like a howling wilderness as it did last night. I'm glad the sun is shining, though I like rainy mornings too. Every kind of morning is interesting, don't you think? You never know what the day will bring, so there's so much to imagine. But sunshine does make it easier to stay cheerful when you're suffering, and I have a great deal to suffer through. It's exciting to read about sorrow and picture yourself being brave. When the sorrow is really yours, it isn't nearly as nice, is it?
        - id: ch01-b16
          speaker: narrator
          text: Anne slipped into the chair Marilla had set out for her.
        - id: ch01-b17
          speaker: marilla_cuthbert
          text: For pity's sake, be quiet. You talk far too much for a little girl.
        - id: ch01-b18
          speaker: narrator
          text: >-
            Anne obeyed so completely that her long silence soon made Marilla uneasy. A quiet Anne seemed like something against nature. Matthew was silent too, but that was perfectly natural for him, and breakfast went on without conversation.
        - id: ch01-b19
          speaker: narrator
          text: >-
            As the meal continued, Anne drifted farther into her thoughts. She ate without noticing the food. Her wide eyes stayed fixed on the sky outside the window, though she did not seem to see it. Marilla grew more nervous. She had the uncomfortable sense that Anne's body sat at the table while her spirit floated somewhere high in a distant cloudland on the wings of imagination. Who could want such a child around the house?
        - id: ch01-b20
          speaker: narrator
          text: >-
            And yet Matthew, of all people, did want her. Marilla could tell that he wanted to keep Anne every bit as much as he had the night before, and he would go right on wanting it. That was Matthew's way. Once an idea took hold of him, he clung to it with astonishing, silent stubbornness. Because he never argued it out, his stubbornness was ten times harder to resist.
        - id: ch01-b21
          speaker: narrator
          text: When breakfast ended, Anne returned from her daydream and offered to wash the dishes.
        - id: ch01-b22
          speaker: marilla_cuthbert
          text: Do you know how to wash them properly?
        - id: ch01-b23
          speaker: anne_shirley
          text: >-
            Fairly well. I'm better at caring for children because I've had so much practice. It's a shame there aren't any children here for me to look after.
        - id: ch01-b24
          speaker: marilla_cuthbert
          text: >-
            I have all the child-caring I need right now. You're trouble enough by yourself, and I don't know what we're going to do with you. Matthew is being perfectly ridiculous.
        - id: ch01-b25
          speaker: anne_shirley
          text: >-
            I think he's lovely. He's so sympathetic. He never minded how much I talked. I think he even liked it. The moment I saw him, I knew he was a kindred spirit.
        - id: ch01-b26
          speaker: marilla_cuthbert
          text: >-
            If by kindred spirits you mean you're both peculiar, then I suppose you are. Go ahead and wash the dishes. Use plenty of hot water and dry them thoroughly. I have enough work this morning. This afternoon, I must drive to White Sands and speak to Mrs. Spencer. You'll come along, and we'll decide what to do with you. When the dishes are done, go upstairs and make your bed.
        - id: ch01-b27
          speaker: narrator
          text: >-
            Marilla kept a sharp eye on Anne and saw that she handled the dishes neatly enough. The bed was another matter. Anne had never learned the art of wrestling with a feather mattress. Still, she managed somehow to make it and smooth it down. Then Marilla, wanting her out of the way, said she could go outdoors and amuse herself until dinner.
        - id: ch01-b28
          speaker: narrator
          text: >-
            Anne flew toward the door, her face bright and her eyes glowing. Right at the threshold, she stopped short. She spun around, came back, and sat beside the table. A moment before, she had looked ready to burst into the sunshine. Now the light vanished from her face as suddenly as if someone had clapped an extinguisher over it.
        - id: ch01-b29
          speaker: marilla_cuthbert
          text: What's wrong now?
        - id: ch01-b30
          speaker: anne_shirley
          text: >-
            I don't dare go outside. If I can't stay, I mustn't fall in love with Green Gables. And if I meet all the trees and flowers, and the orchard and brook, I won't be able to help loving them. It already hurts enough. I want to go so badly. Everything seems to call, "Anne, Anne, come out. We want someone to play with." But I shouldn't. There's no use loving things when you have to be torn away from them, is there? And it is so hard not to love them. When I thought I would live here, I was happy because there would be so many things to love, with nothing to stop me. But that little dream is over. I've accepted my fate now, and going outside might make me stop accepting it. What is the geranium on the windowsill called?
          emotion: sad
        - id: ch01-b31
          speaker: marilla_cuthbert
          text: It's an apple-scented geranium.
        - id: ch01-b32
          speaker: anne_shirley
          text: >-
            Oh, I don't mean what kind it is. I mean its own name, the one you gave it. Didn't you name it? Then may I? Let me think. Bonny would suit it. May I call it Bonny while I'm here? Please say I may.
        - id: ch01-b33
          speaker: marilla_cuthbert
          text: Goodness, I don't care. But why would anyone name a geranium?
        - id: ch01-b34
          speaker: anne_shirley
          text: >-
            I like things to have names, even geraniums. It makes them feel more like people. Maybe it hurts a geranium's feelings to be called nothing but a geranium. You wouldn't want everyone to call you "woman" all the time. So I'll call this one Bonny. I named the cherry tree outside my window too. It's the Snow Queen because it's so white. It won't stay in bloom forever, of course, but I can imagine it does.
        - id: ch01-b35
          speaker: narrator
          text: Marilla retreated to the cellar for potatoes, muttering to herself.
        - id: ch01-b36
          speaker: marilla_cuthbert
          text: >-
            I've never seen or heard anyone like her. Matthew was right about one thing. She is interesting. I'm already wondering what she'll say next. She'll put a spell on me too, just as she has on Matthew. That look he gave me when he went out repeated everything from last night. I wish he would talk like other men. Then I could answer him and argue some sense into him. But how do you argue with a man who only looks at you?
        - id: ch01-b37
          speaker: narrator
          text: >-
            By the time Marilla returned from the cellar with the potatoes, Anne had slipped into another daydream. She sat with her chin in her hands and her eyes on the sky, unaware of everything around her. Marilla left her there until the early dinner was ready and set on the table.
        - id: ch01-b38
          speaker: marilla_cuthbert
          text: Matthew, I can take the mare and buggy this afternoon, can't I?
        - id: ch01-b39
          speaker: narrator
          text: >-
            Matthew nodded and gave Anne a wistful look. Marilla caught it.
        - id: ch01-b40
          speaker: marilla_cuthbert
          text: >-
            I'm going to White Sands to settle this. Anne will come with me. Mrs. Spencer can probably arrange to send her straight back to Nova Scotia. I'll leave your tea ready, and I'll be home in time to milk the cows.
        - id: ch01-b41
          speaker: narrator
          text: >-
            Matthew still said nothing. Marilla felt she had wasted every word and every breath. Nothing was more aggravating than a man who refused to talk back, unless it was a woman who did the same.
        - id: ch01-b42
          speaker: narrator
          text: >-
            When the time came, Matthew hitched the sorrel mare to the buggy. Marilla and Anne climbed in together and set off for White Sands. Matthew walked ahead and opened the yard gate for them. The buggy rolled slowly through. As it passed him, he spoke without looking as though his words were meant for no one in particular.
        - id: ch01-b43
          speaker: matthew_cuthbert
          text: >-
            Little Jerry Buote from the Creek came by this morning. I told him I thought I'd hire him for the summer.
        - id: ch01-b44
          speaker: narrator
          text: >-
            Marilla made no reply. Instead, she gave the unlucky sorrel such a fierce crack with the whip that the plump mare, unused to such treatment, tore indignantly down the lane at a frightening speed. The buggy bounced along behind her. Marilla glanced back once and saw that aggravating Matthew leaning over the gate, watching them go with that same wistful look.
