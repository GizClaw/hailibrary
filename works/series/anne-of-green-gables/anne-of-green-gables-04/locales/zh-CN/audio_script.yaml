audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖从容，带着细腻而机智的讲述感
        timbre: 清澈柔和
        pace: 舒缓而有变化
        pitch: 中音
    anne:
      display_name: 安妮
      tts:
        delivery: 热切灵动，想法接连涌出，真挚而富于想象
        timbre: 清亮稚嫩
        pace: 明快，动情处自然放慢
        pitch: 中高音
    matthew:
      display_name: 马修
      tts:
        delivery: 腼腆温厚，说话迟缓而谨慎
        timbre: 低沉柔和
        pace: 缓慢
        pitch: 中低音
    marilla:
      display_name: 玛丽拉
      tts:
        delivery: 干脆严谨，言语直截了当，偶尔透出克制的温情
        timbre: 清晰沉稳
        pace: 中等
        pitch: 中音
  chapters:
    - id: ch01
      title: 第四章　绿山墙的早晨
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 安妮醒来时，天已经大亮。她坐起身，迷迷糊糊地望着窗子。明快的阳光直泻进来，窗外还有一团洁白轻柔的东西迎风摇摆，枝叶晃开时，便露出一小片蓝天。
        - id: ch01-b02
          speaker: narrator
          text: 一时之间，她竟想不起自己在哪里。心里先掠过一阵甜蜜的惊喜，像是有什么美好的事等着她。紧接着，她全想起来了。这里是绿山墙，可他们不想要她，因为她不是男孩。
        - id: ch01-b03
          speaker: narrator
          text: 不过，清晨就在眼前。没错，窗外确实有一棵开满花的樱桃树。安妮一下跳下床，几步穿过房间，奔过去推窗。窗框又沉又涩，吱嘎作响，像是很久没打开了，事实也正是这样。她费力把它推上去，窗框紧紧卡住，连支撑都不用。
        - id: ch01-b04
          speaker: narrator
          text: 安妮跪在窗前，望进六月的早晨，双眼亮得发光。这里真美，真是个可爱的地方。就算她不能留下，也可以想象自己会留下。眼前的一切，足够她尽情想象。
        - id: ch01-b05
          speaker: narrator
          text: 一棵高大的樱桃树紧挨着房子，枝条轻轻碰着墙。满树都是花，密得几乎找不到叶子。屋子两旁各有果园，一边是苹果树，一边是樱桃树，同样铺满繁花。草地上点着蒲公英。下方的花园里，丁香开成一片紫色，浓甜的香气乘着晨风，一直飘进窗口。
        - id: ch01-b06
          speaker: narrator
          text: 花园再往下，是一片长满三叶草的绿色田野，一路斜向低处的小溪。几十棵白桦轻盈地立在灌木丛里，让人不由得想到蕨草、苔藓，还有林子里一切好玩的东西。更远的山坡上长满云杉和冷杉。树林中间露出一道空隙，恰好能看见一面灰色的山墙。那就是安妮隔着闪光之湖见过的小屋。
        - id: ch01-b07
          speaker: narrator
          text: 左边是几座大谷仓。越过谷仓，目光沿着低缓的绿色田野一路向下，远远还能看见一抹闪亮的蓝色海面。安妮舍不得移开那双爱美的眼睛，贪婪地把每一处景色全收进去。这个可怜的孩子一生中见过太多难看的地方，而这里，美得和她做过的最好的梦一样。
        - id: ch01-b08
          speaker: narrator
          text: 她一直跪在那里，完全沉进四周的美景里，除了眼前这份美，世上的其他事都忘光了。忽然，一只手搭上她的肩。小梦想家吓了一跳，原来玛丽拉已经无声无息地进了屋，站在她身后。
        - id: ch01-b09
          speaker: marilla
          text: 你该把衣服穿好了。
        - id: ch01-b10
          speaker: narrator
          text: 玛丽拉其实不知道该怎么和这个孩子说话。这份不知所措让她很不自在，所以一开口就又短又硬，尽管她并不想显得那么冷淡。安妮站起来，深深吸了一口气，又伸手指向外面整个明亮的世界。
        - id: ch01-b11
          speaker: anne
          text: 您看，这一切是不是美妙极了？
          emotion: happy
        - id: ch01-b12
          speaker: marilla
          text: 那棵树倒是挺大，花也开得多，可它结的果子从来不怎么样，又小又有虫。
        - id: ch01-b13
          speaker: anne
          text: 我说的可不只是树。它当然很美，简直亮得耀眼，而且它开花时那么认真，好像非要把花开到最好不可。可我说的是花园、果园、小溪和树林，是这整个又大又可爱的世界。这样的早晨，您难道不会一下子爱上全世界吗？
        - id: ch01-b14
          speaker: anne
          text: 我在这里都听得见小溪的笑声。您发现没有，小溪总是特别快活？它们一直在笑，冬天结了冰，我还能听见冰下面的笑声。我真高兴绿山墙旁边有一条小溪。哪怕你们不留下我，哪怕我再也看不到它，我也会记得这里有一条小溪。要是没有，我反而会老想着，这里明明该有一条才对。
        - id: ch01-b15
          speaker: anne
          text: 今天早上我没有掉进绝望的深渊。早晨一来，我就没办法绝望了。世上有早晨，多了不起呀。不过，我心里还是很难过。刚才我想象，你们真正想要的其实就是我，我会永远住在这里。那阵想象还在的时候，我觉得安慰极了。可想象总有停下来的时候，那才是最糟的。因为一停下来，心里就会疼。
          emotion: sad
        - id: ch01-b16
          speaker: narrator
          text: 玛丽拉终于等到一个能插话的空隙。
        - id: ch01-b17
          speaker: marilla
          text: 赶紧穿衣服，下楼吃早饭，别再想那些了。脸要洗，头发要梳。窗子开着就行，再把床单被子掀到床尾。动作快一点。
        - id: ch01-b18
          speaker: narrator
          text: 安妮真快起来，也能快得很像样。十分钟后，她已经穿戴整齐地下楼了。衣服穿得妥妥帖帖，头发梳过，还编好了，脸也洗得干干净净。她心里有种舒舒服服的满足，以为玛丽拉交代的事全做完了。其实，她偏偏忘了把床单被子掀到床尾。
        - id: ch01-b19
          speaker: anne
          text: 今天早上我真饿。这个世界不像昨晚那样，是一片哭号的荒野了。我很高兴太阳出来了，不过我也很喜欢下雨的早晨。每一种早晨都有意思，您不觉得吗？因为谁也不知道这一天会发生什么，可以想象的事多着呢。
        - id: ch01-b20
          speaker: anne
          text: 当然，今天不下雨还是很好。天一晴，人就容易打起精神，忍住自己的苦难。我觉得自己有不少苦难要忍受。读书时看到别人受苦，再想象自己英勇地熬过去，倒是很不错。可苦难真的落到自己头上，就没那么好了，对不对？
        - id: ch01-b21
          speaker: marilla
          text: 求你闭一会儿嘴吧。你这么小的姑娘，话实在太多了。
        - id: ch01-b22
          speaker: narrator
          text: 安妮立刻听话地闭上嘴，而且一声也不再出。她安静得太彻底，玛丽拉反而紧张起来，仿佛身边有件事不大正常。马修也没有开口，不过这对他再正常不过。于是，三个人默默吃着早饭。
        - id: ch01-b23
          speaker: narrator
          text: 饭吃到一半，安妮的心思越飘越远。她机械地吃着东西，两只大眼睛始终盯住窗外的天空，一眨不眨，却又像什么都没看见。这让玛丽拉更加不安。她觉得，这个怪孩子的身子虽然坐在桌边，灵魂却乘着想象的翅膀，飞进了遥远而轻盈的云乡。谁会愿意让这样的孩子住在家里呢？
        - id: ch01-b24
          speaker: narrator
          text: 偏偏马修想留下她，实在叫人想不通。玛丽拉知道，他今天还和昨晚一样想，而且会一直想下去。马修一旦拿定主意，就会默不作声地守着，执拗得惊人。他越不说话，这份坚持越有力量，比说出口还要厉害十倍。
        - id: ch01-b25
          speaker: narrator
          text: 早饭结束，安妮终于回过神来，主动说自己可以洗碗。
        - id: ch01-b26
          speaker: marilla
          text: 你能把碗洗好吗？
        - id: ch01-b27
          speaker: anne
          text: 洗得还不错。不过，我照看孩子更在行，我做过好多这样的事。真可惜，您这里没有孩子给我照看。
        - id: ch01-b28
          speaker: marilla
          text: 我眼下可不想再多照看一个孩子。你一个已经够叫人操心了。我还不知道该拿你怎么办。马修简直荒唐得很。
        - id: ch01-b29
          speaker: anne
          text: 可我觉得他特别可爱。他很能体谅别人。我说那么多话，他一点也不嫌烦，好像还挺爱听。我第一眼看见他，就知道我们两个人的灵魂是相通的。
        - id: ch01-b30
          speaker: marilla
          text: 要是你说的灵魂相通就是这个意思，那你们确实一样古怪。行了，你来洗碗。热水要用足，每只碗都得擦干。今天上午我有不少事，下午还要去白沙找斯宾塞太太。你也跟我去，咱们把你的事定下来。洗完碗，上楼铺床。
        - id: ch01-b31
          speaker: narrator
          text: 玛丽拉一直用锐利的眼睛盯着整个过程，发现安妮洗碗还算利落。铺床就差一些了。安妮从没学过怎么和羽毛褥垫较劲，不过她总算设法把床铺完，还把表面抹平了。玛丽拉为了不让她在跟前碍事，便让她到屋外自己玩，午饭时再回来。
        - id: ch01-b32
          speaker: narrator
          text: 安妮满脸放光，飞快地跑到门口。可她刚站上门槛，就猛地停住了。她转过身，又一路走回来，在桌边坐下。刚才那片光彩一下全灭了，像被人罩上了灯罩。再开口时，她活像一位甘愿舍弃世间所有欢乐的殉道者。
        - id: ch01-b33
          speaker: marilla
          text: 现在又出了什么事？
        - id: ch01-b34
          speaker: anne
          text: 我不敢出去。如果不能留在这里，我就不该爱上绿山墙。可我只要走出去，认识那些花、那些树，还有果园和小溪，就一定会爱上它们。现在已经够难受了，我不能再让自己更难受。
          emotion: sad
        - id: ch01-b35
          speaker: anne
          text: 我真的特别想出去。外面每样东西都像在喊我：“安妮，快来呀。安妮，我们想要一个玩伴。”可还是别去了。明知道自己非离开不可，又何必爱上这里呢？偏偏不去爱一样东西，又是那么难。先前以为能住下时，我有多高兴呀。我以为会有那么多东西等着我去爱，再也没有谁能拦住我。
        - id: ch01-b36
          speaker: anne
          text: 可那个短短的梦已经过去了。现在，我已经接受了自己的命运，所以不能出去，免得待会儿又不肯接受了。对了，请问窗台上那盆天竺葵叫什么名字？
        - id: ch01-b37
          speaker: marilla
          text: 那是苹果香叶天竺葵。
        - id: ch01-b38
          speaker: anne
          text: 我不是问它是哪一种。我是问，您自己给它取过什么名字。您没取吗？那让我取一个，好不好？叫邦妮就不错。我还在这里的时候，可以管它叫邦妮吗？求您答应吧！
        - id: ch01-b39
          speaker: marilla
          text: 天哪，随便你。可是给天竺葵取名字，到底有什么用？
        - id: ch01-b40
          speaker: anne
          text: 我喜欢每样东西都有个能叫的名字，就算它只是一盆天竺葵。名字就像一个能握住的把手，有了它，这些东西就更像人了。要是大家只管它叫“天竺葵”，您怎么知道它不会伤心？要是别人永远不叫您的名字，只叫您“女人”，您肯定也不高兴。所以，它就叫邦妮了。
        - id: ch01-b41
          speaker: anne
          text: 今天早上，我也给卧室窗外的樱桃树取了名字。它那么白，我就叫它白雪皇后。它当然不会一直开花，可我们能想象它一直开着呀，对不对？
        - id: ch01-b42
          speaker: narrator
          text: 玛丽拉一边嘟囔，一边退到地窖里拿土豆。她嘴里虽然埋怨，心里却已经承认，马修说得没错，这孩子确实很有意思。
        - id: ch01-b43
          speaker: marilla
          text: 我活了这么多年，从没见过，也没听说过这样的孩子。不过，她还真有点意思，马修这话说得没错。我都开始好奇，她接下来又会说出什么了。她也快给我施上魔法了，马修早就中了她的魔法。
        - id: ch01-b44
          speaker: marilla
          text: 他刚才出门时看我的那一眼，把昨晚那些话又说了一遍。真希望他和别的男人一样，肯把话全讲出来。别人至少可以和他争一争，叫他讲点道理。可一个男人只用眼睛看着你，你还能怎么办？
        - id: ch01-b45
          speaker: narrator
          text: 玛丽拉从地窖走了一趟回来时，安妮又出了神。她双手托着下巴，眼睛望着天空。玛丽拉让她一直坐在那里，直到早早的午饭全摆上桌。
        - id: ch01-b46
          speaker: marilla
          text: 马修，今天下午我可以用那匹母马和轻便马车吧？
        - id: ch01-b47
          speaker: narrator
          text: 马修点点头，又恋恋不舍地看向安妮。玛丽拉正好截住他的目光，立刻沉下脸，把接下来的安排一句句说给他听。
        - id: ch01-b48
          speaker: marilla
          text: 我要驾车去白沙，把这件事彻底解决。我会带上安妮。斯宾塞太太多半能马上安排人，把她送回新斯科舍。我先把你的晚饭摆出来，挤牛奶以前就会回来。
        - id: ch01-b49
          speaker: narrator
          text: 马修依然不说话。玛丽拉只觉得自己白白浪费了那么多话，连喘的那些气也全浪费了。世上最让人生气的，就是一个无论如何也不肯回嘴的男人。除非，对面是个无论如何也不肯回嘴的女人。
        - id: ch01-b50
          speaker: narrator
          text: 到了时候，马修把栗色母马套上车，玛丽拉带着安妮出发了。他替她们打开院门。马车从身边慢慢驶过时，他开了口，听起来仿佛这句话不是特意说给任何人听的。
        - id: ch01-b51
          speaker: matthew
          text: 溪边那个小杰里·博特今天早上来过。我告诉他，我想雇他干一个夏天的活。
        - id: ch01-b52
          speaker: narrator
          text: 玛丽拉一句话也没回，却凶狠地抽了那匹倒霉的栗色母马一鞭。胖母马从来没受过这种对待，又惊又气，立刻沿着小路飞奔起来，快得叫人害怕。轻便马车一路上下颠簸，玛丽拉只回头望了一次。那个气人的马修还俯身靠在院门上，满眼不舍地望着她们越走越远。
