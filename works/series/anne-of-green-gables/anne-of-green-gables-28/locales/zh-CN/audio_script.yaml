audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖机敏，带着含蓄的幽默讲述
        timbre: 清澈柔和
        pace: 舒展而富有变化
        pitch: medium
    anne:
      display_name: 安妮
      tts:
        delivery: 热烈敏感，想象丰富，情绪来得真切而迅速
        timbre: 明亮清脆的少女声
        pace: 偏快，激动时连贯奔涌
        pitch: medium-high
    diana:
      display_name: 戴安娜
      tts:
        delivery: 亲切真诚，对朋友满怀关心
        timbre: 柔和甜润的少女声
        pace: 自然适中
        pitch: medium-high
    ruby:
      display_name: 鲁比
      tts:
        delivery: 娇弱敏感，容易紧张受惊
        timbre: 轻细的少女声
        pace: 稍快，害怕时发颤
        pitch: high
    jane:
      display_name: 简
      tts:
        delivery: 实在利落，偶尔一本正经地兴奋
        timbre: 清爽的少女声
        pace: 明快适中
        pitch: medium
    gilbert:
      display_name: 吉尔伯特
      tts:
        delivery: 坦率自信，认真时带一点少年人的羞怯
        timbre: 清朗的少年声
        pace: 自然利落
        pitch: medium
    marilla:
      display_name: 玛丽拉
      tts:
        delivery: 严厉务实，关切藏在克制的话语里
        timbre: 稳定清晰的中年女声
        pace: 从容直接
        pitch: medium-low
    matthew:
      display_name: 马修
      tts:
        delivery: 腼腆温厚，说话轻而真诚
        timbre: 低沉朴实的中年男声
        pace: 缓慢迟疑
        pitch: low
  chapters:
    - id: ch01
      title: 第二十八章　倒霉的百合少女
      blocks:
        - id: ch01-b01
          speaker: diana
          text: 安妮，你当然得扮伊莱恩。我可没有那个胆量，一个人躺在船里漂到下游去。
        - id: ch01-b02
          speaker: ruby
          text: 我也没有那个胆量。要是平底船上有两三个人，大家都可以坐起来，我倒不怕漂下去，那样还很好玩。可要我一个人躺在那里装死？我实在做不到，我准会真的吓死。
          emotion: fearful
        - id: ch01-b03
          speaker: jane
          text: 这事当然很浪漫，可我知道自己肯定躺不住。隔一会儿，我就会探起身来，看看自己漂到了哪儿，有没有漂得太远。你也知道，安妮，那样一来整场戏的效果就全毁了。
        - id: ch01-b04
          speaker: anne
          text: 可让一个红头发的姑娘扮伊莱恩，不是太可笑了吗？我不怕漂，也很想扮她，可这事到底不合适。该让鲁比来，她的皮肤那么白，又有一头漂亮的金色长发。诗里不是说，伊莱恩灿烂的长发流水般披散吗？她是百合少女，红头发的人怎么能做百合少女？
        - id: ch01-b05
          speaker: diana
          text: 你的皮肤和鲁比一样白。再说，自从头发剪短，它的颜色已经深多了。
        - id: ch01-b06
          speaker: anne
          text: 哦，你真的这么觉得吗？我自己有时候也这样想过，可我一直不敢问别人，生怕人家告诉我根本没变。戴安娜，你说它现在能不能叫作赤褐色了？
          emotion: happy
        - id: ch01-b07
          speaker: diana
          text: 当然能叫赤褐色。我觉得它现在的颜色真的很漂亮，配上这些又短又柔亮的卷发，尤其好看。
        - id: ch01-b08
          speaker: narrator
          text: 戴安娜赞赏地望着安妮那一头柔亮的短卷发。卷发簇拥在头顶，一条黑天鹅绒带把它们拢住，还在一旁打了个俏皮的蝴蝶结。几个姑娘正站在果园坡下的池塘边。岸旁伸出一片白桦环绕的小岬角，尖端搭着一座探进水里的木台，供人钓鱼、猎鸭。鲁比和简来陪戴安娜过仲夏的下午，安妮也过来和她们一起玩。
        - id: ch01-b09
          speaker: narrator
          text: 那个夏天，安妮和戴安娜大半的玩耍时光都在池塘边和池塘上。她们从前的悠闲谷已经没了。贝尔先生在春天狠心砍掉了后牧场上的那一圈树，安妮还坐在树桩间哭过一场。她哭的时候，也不是完全没留意这一幕有多浪漫。不过，她很快就安慰了自己。十三岁、眼看就十四岁的大姑娘，已经不该再玩过家家那种孩子气的游戏，池塘附近还有更迷人的事。趴在桥上钓鳟鱼很有趣，她们也学会了划巴里先生猎鸭用的平底小艇，可以自己在水上来来去去。
        - id: ch01-b10
          speaker: narrator
          text: 把伊莱恩的故事演出来，是安妮的主意。前一年冬天，她们在学校学过丁尼生的那首诗。教育督学把它列进了爱德华王子岛学校的英文课程，于是大家分析它、解析它的语法，把整首诗七拆八解，几乎没留下一点意味。可百合少女、兰斯洛特、桂妮薇儿和亚瑟王，倒全成了她们心里的真人。安妮暗暗遗憾，只恨自己没生在卡美洛。她认定，那个时代远比现在浪漫。
        - id: ch01-b11
          speaker: narrator
          text: 姑娘们早就发现，只要从木台把平底船推出去，水流便会带着它穿过桥洞，最后搁浅在下游的另一片岬角。那片岬角正从池塘的弯处伸进水里。她们已经用这个办法漂过许多回，每一次都由水流把船稳稳送到那里。要演伊莱恩，实在再方便不过。
        - id: ch01-b12
          speaker: anne
          text: 好吧，我来扮伊莱恩。鲁比扮亚瑟王，简扮桂妮薇儿，戴安娜一定得扮兰斯洛特。不过开头时，你们先扮伊莱恩的父亲和哥哥。那个年老的哑仆只好省掉，我一躺下，平底船就容不下第二个人了。我们还得用最黑的丝绸，从头到尾蒙住这条船。戴安娜，你妈妈那条旧黑披肩正合适。
        - id: ch01-b13
          speaker: narrator
          text: 安妮让步得并不情愿。演主角当然会让她满心欢喜，可她那份艺术感觉偏偏要求扮相必须合宜，她又认定自己的红头发使这件事绝无可能。黑披肩取来后，安妮把它铺在船上，躺进船底，闭上眼，双手交叠在胸前。
        - id: ch01-b14
          speaker: ruby
          text: 她看着真的像死了。白桦树的影子还在她那张苍白的小脸上晃来晃去，我心里直发毛。姑娘们，我们这样演真的没问题吗？林德太太说过，所有演戏的把戏都是坏透了的罪过。
          emotion: fearful
        - id: ch01-b15
          speaker: anne
          text: 鲁比，别提林德太太。伊莱恩的故事发生在她出生的几百年前，你把气氛全毁了。简，还是你来安排吧。死人还在说话，实在不像样。
        - id: ch01-b16
          speaker: narrator
          text: 简马上接过了指挥。没有金线织成的锦缎，她就拿黄色日本绉纱的旧钢琴披巾当盖毯。眼下也找不到白百合，她便把一枝高挑的蓝鸢尾放进安妮交叠的一只手里。这样布置出来的效果，实在挑不出毛病。
        - id: ch01-b17
          speaker: jane
          text: 这下准备好了。我们先亲吻她安静的眉头。戴安娜说“姐姐，永别了”，鲁比说“永别了，亲爱的姐姐”。一定要说得很悲伤。安妮，你还得笑一点儿。诗里的伊莱恩躺着，唇边仿佛带着微笑。对，就是这样。现在推船吧。
        - id: ch01-b18
          speaker: narrator
          text: 平底船被推了出去，途中狠狠擦过一根埋在水里的旧木桩。戴安娜、简和鲁比只等到水流把船带住，看着它朝桥洞漂去，就转身飞跑。她们穿过树林，越过大路，赶到下游岬角，要在那里分别变成兰斯洛特、桂妮薇儿和亚瑟王，做好迎接百合少女的准备。
        - id: ch01-b19
          speaker: narrator
          text: 开头几分钟，安妮随着水流缓缓漂去，尽情陶醉在这浪漫的场面里。可很快，一件毫不浪漫的事发生了。船漏水了。“伊莱恩”慌忙爬起来，捡起金色盖毯和最黑的丝绸丧布，目瞪口呆地看着水从船底的大裂缝里直往上涌。刚才那根尖木桩刮掉了钉在船上的填缝木条。安妮不知道原因，却很快明白自己危险了。照这个速度，船还没漂到下游岬角，就会灌满水沉下去。偏偏船桨全留在了木台上。
        - id: ch01-b20
          speaker: narrator
          text: 她倒抽一口气，短短地尖叫了一声，可岸上的任何人都没有听见。她的脸一直白到了嘴唇，头脑却没有乱。眼下还剩一个机会，仅仅一个。
        - id: ch01-b21
          speaker: anne
          text: 我真的吓坏了，艾伦太太。船一点点漂向桥，水却一刻不停地上涨，那一段路简直有好几年那么长。我非常认真地祷告，可我没有闭眼。因为我知道，上帝要救我，只有一个办法，就是让船漂得离一根桥桩够近，让我能爬上去。那些桥桩只是老树干，上面有许多树瘤，也有砍剩的旧枝杈。我该祷告，也得睁眼盯紧机会，好好尽我自己的一份力。
          emotion: fearful
        - id: ch01-b22
          speaker: anne
          text: 我就一遍遍地说：“亲爱的上帝，请让船靠近一根桥桩，剩下的事由我来做。”那种时候，谁还顾得上把祷词说漂亮呢？我的祷告真的得到了回应。船撞上一根桥桩，贴在那里停了一会儿。我把披巾和披肩甩上肩，手脚并用地爬到一截老天特意留下的大树杈上。可我抱着那根湿滑的旧桥桩，上不去，也下不来。那个姿势一点儿都不浪漫，可刚从水底的坟墓边逃开，人是不会想什么浪漫的。我先满怀感激地祷告了一番，接着只管牢牢抱住。要回到干地上，看来还得靠人来救我。
        - id: ch01-b23
          speaker: narrator
          text: 平底船穿过桥洞，随即沉进河道中央。下游岬角上的鲁比、简和戴安娜亲眼看着船消失，都认定安妮也沉了下去。她们脸白得像床单，被这场惨剧吓得僵住片刻，随后扯开嗓子尖叫，发疯似的往树林上方狂奔。她们过大路时，甚至没停下来朝桥那边看上一眼。安妮拼命守住脚下那点岌岌可危的落脚处，既看到了飞奔的身影，也听到了尖叫。救兵应该快来了，可她挂在桥桩上，实在难受极了。
        - id: ch01-b24
          speaker: narrator
          text: 时间一点点过去。对这位倒霉的百合少女来说，每一分钟都像一个钟头。人怎么还不来？姑娘们去了哪里？会不会一个个全都晕倒了？会不会根本没人来？要是她累得浑身僵痛，再也抱不住呢？安妮望着下方邪恶的碧绿深水，长长的暗影像油一样在水里晃动。她打了个寒战，想象力开始替她编出种种可怕的结局。
        - id: ch01-b25
          speaker: narrator
          text: 就在她觉得手臂和手腕痛得再也撑不了片刻时，吉尔伯特·布莱思划着哈蒙·安德鲁斯家的小艇，从桥下过来了。他随意往上一瞧，却惊讶万分地看见一张苍白的小脸正低头望着自己。那双灰眼睛明明吓得睁得老大，望向他时却仍带着十足的轻蔑。
        - id: ch01-b26
          speaker: gilbert
          text: 安妮·雪莉！你怎么会挂在那上面？
          emotion: surprised
        - id: ch01-b27
          speaker: narrator
          text: 吉尔伯特没等回答，便把船划近桥桩，朝安妮伸出手。事情到了这一步，她已经别无选择，只得拉着吉尔伯特·布莱思的手，手脚并用地爬进小艇。她浑身湿脏，气冲冲地坐在船尾，怀里还抱着滴水的黑披肩和湿透的绉纱。到了这副模样，想保持尊严可真是难上加难。
        - id: ch01-b28
          speaker: gilbert
          text: 安妮，究竟出了什么事？
        - id: ch01-b29
          speaker: anne
          text: 我们刚才在演伊莱恩。我得坐着船漂到卡美洛——我是说，坐着平底船。可是船开始漏水，我只好从船里爬到桥桩上。姑娘们都去找人搭救了。劳驾你把我划回小木台，可以吗？
        - id: ch01-b30
          speaker: narrator
          text: 吉尔伯特依言拿起船桨，把安妮划回小木台。船一靠岸，安妮便摆明了不肯接受他的帮助，自己轻巧地跳上了岸。
        - id: ch01-b31
          speaker: anne
          text: 非常感谢。
        - id: ch01-b32
          speaker: narrator
          text: 安妮高傲地道了谢，随即转身就要离开。可吉尔伯特也从船里跳了出来。他似乎还有非说不可的话，于是伸手拉住她的胳膊，不让她就这样走掉。
        - id: ch01-b33
          speaker: gilbert
          text: 安妮，先别走。我们就不能和好吗？那次拿你的头发开玩笑，我真的很对不起。我并不是故意要惹你生气，只不过想说句玩笑话。再说，那已经是很久以前的事了。你的头发现在真的漂亮极了，我说的全是真心话。我们做朋友吧。
        - id: ch01-b34
          speaker: narrator
          text: 安妮犹豫了一瞬。在她那受尽冒犯的尊严底下，一种从未有过的感觉忽然醒了。吉尔伯特的淡褐色眼睛里，一半羞怯，一半热切，那神情竟让她觉得很好。她的心奇怪地猛跳一下。可是，旧日委屈的苦涩立刻涌上来。两年前那场旧事鲜明得像刚发生在昨天。他叫她“胡萝卜”，还害她在全校面前受罚。大人也许觉得这份怨气和它的缘由一样可笑，可时间丝毫没把它冲淡。安妮恨吉尔伯特·布莱思。她绝不原谅他。
        - id: ch01-b35
          speaker: anne
          text: 不能。吉尔伯特·布莱思，我永远不会跟你做朋友。我也不想跟你做朋友！
          emotion: angry
        - id: ch01-b36
          speaker: gilbert
          text: 那就算了！安妮·雪莉，我以后再也不会求你和好了。我也根本不在乎！
          emotion: angry
        - id: ch01-b37
          speaker: narrator
          text: 吉尔伯特气得脸颊发红，跳进小艇，每一桨都划得又快又倔。安妮沿着陡峭的蕨草小路，在枫树下往上走。她的头抬得很高，心里却升起一股奇怪的悔意，几乎希望自己刚才换一个回答。他的确狠狠羞辱过她，可是……总而言之，安妮觉得，若能坐下来痛痛快快哭上一场，准会轻松许多。惊吓过去以后，方才吊在桥桩上的酸痛和紧张一起涌了上来，她实在心乱得厉害。
        - id: ch01-b38
          speaker: narrator
          text: 半路上，简和戴安娜发疯似的朝池塘跑来。她们先赶到果园坡，却没有找到人，巴里夫妇都出去了。到了那里，鲁比终于歇斯底里发作，只能留下来自己慢慢恢复。简和戴安娜又冲过闹鬼的树林，跨过小溪，一路飞奔到绿山墙。可那里还是没人。玛丽拉去了卡莫迪，马修正在后面的田里收干草。
        - id: ch01-b39
          speaker: diana
          text: 哦，安妮！我们以为你已经淹死了！是我们让你扮伊莱恩的，我们觉得自己简直成了杀人凶手。鲁比还犯了歇斯底里，留在果园坡那边。哦，安妮，你到底是怎么逃出来的？
          emotion: happy
        - id: ch01-b40
          speaker: narrator
          text: 戴安娜几乎整个人扑到安妮颈间，一边大口喘气，一边因为放心和欢喜哭个不停。
        - id: ch01-b41
          speaker: anne
          text: 我从漏水的船里爬上了一根桥桩。后来吉尔伯特·布莱思划着安德鲁斯先生家的小艇经过，他看见了我，把我从桥桩上接下来，又送回了岸上。
        - id: ch01-b42
          speaker: jane
          text: 他这样做可真了不起！哎呀，这件事不是太浪漫了吗？出了这样的事，你以后当然会跟他说话了。
        - id: ch01-b43
          speaker: anne
          text: 我当然不会！还有，简·安德鲁斯，我再也不想听见“浪漫”这个词。姑娘们，害你们吓成这样，我真的非常抱歉。这全是我的错。我敢肯定，自己一出生就碰上了一颗倒霉星。无论做什么，我总会害自己，或是害最亲爱的朋友陷进麻烦。戴安娜，我们还把你爸爸的平底船弄丢了。我有个预感，以后大人再也不会让我们到池塘上划船了。
        - id: ch01-b44
          speaker: narrator
          text: 这一次，安妮的预感竟比预感通常能达到的程度还要准确。这个下午发生的每一件事传到大人耳中以后，巴里家和卡思伯特家全都惊骇不已。平底船沉了，安妮又差点儿落水，几个姑娘还为了求救跑遍了果园坡和绿山墙，这些事哪一件都小不了。
        - id: ch01-b45
          speaker: marilla
          text: 安妮，你究竟什么时候才会懂事？
        - id: ch01-b46
          speaker: narrator
          text: 安妮已经躲进东山墙房间，在无人打扰的清静里痛痛快快哭了一场。眼泪安抚了她紧绷的神经，也卸下了惊吓过后的疲惫。等她再出来时，平日那股乐观又快活的劲儿已经回来了。
        - id: ch01-b47
          speaker: anne
          text: 哦，我想自己会懂事的，玛丽拉。而且我觉得，自己如今比从前任何时候都更有希望变得懂事。
        - id: ch01-b48
          speaker: marilla
          text: 我可一点儿也看不出来，你倒仔细说说这是怎么回事？
        - id: ch01-b49
          speaker: anne
          text: 因为我今天又学到了一条宝贵的新教训。自从来到绿山墙，我一直在犯错误，可每一次都会治好我的一个大缺点。紫水晶胸针让我不再乱碰不属于我的东西，闹鬼的树林让我不再任由想象力跑得没边，搽剂蛋糕让我做饭时不敢粗心，染头发又治好了虚荣。现在我已经不再想自己的头发和鼻子了，至少很少想。
        - id: ch01-b50
          speaker: anne
          text: 今天的错误呢，会治好我过分浪漫的毛病。我已经得出结论了，在埃文利想过得浪漫，根本没有用。几百年前，在塔楼林立的卡美洛，浪漫大概很容易，可如今这个时代已经没人赏识它了。玛丽拉，我很有把握，你很快就会看到我在这方面大有长进。
        - id: ch01-b51
          speaker: marilla
          text: 我真希望如此。
        - id: ch01-b52
          speaker: narrator
          text: 玛丽拉用半信半疑的口气说完，就走了出去。整个谈话里，马修始终默默坐在自己惯常的角落，没有插一句嘴。直到这时，他才来到安妮身边，把一只手轻轻放在她的肩上。他压低声音，腼腆地开了口。
        - id: ch01-b53
          speaker: matthew
          text: 安妮，别把你的浪漫全都丢掉。心里留下一点儿浪漫，是件好事。当然，不能留得太多。可还是留一点儿吧，安妮，留下一点儿。
