  chapters:
    - id: ch01
      title: The Lily Maid
      blocks:
        - id: ch01-b01
          speaker: diana_barry
          text: "Anne, of course you have to be Elaine. I'd never be brave enough to float down the pond like that."
        - id: ch01-b02
          speaker: ruby_gillis
          text: "Neither would I. I like drifting in the flat when two or three of us can sit up together. But lying there pretending to be dead? I'd be so scared I really would die."
          emotion: fearful
        - id: ch01-b03
          speaker: jane_andrews
          text: "It would be romantic, but I couldn't lie still. I'd keep sitting up to see where I was and whether I'd floated too far. That would ruin the whole scene."
        - id: ch01-b04
          speaker: anne_shirley
          text: "But a redheaded Elaine is absurd. I'm not afraid to float down, and I would dearly love to play her. Even so, it doesn't look right. Ruby should be Elaine. She's fair, and she has that beautiful long golden hair. Remember? Elaine had all her bright hair streaming down, and she was the lily maid. Now, a red-haired girl simply cannot be a lily maid."
        - id: ch01-b05
          speaker: diana_barry
          text: "Your skin is every bit as fair as Ruby's. And your hair is much darker than it was before you cut it."
        - id: ch01-b06
          speaker: anne_shirley
          text: "Do you honestly think so? I've wondered about that, but I was afraid to ask in case somebody said it wasn't true. Diana, could you call it auburn now?"
          emotion: happy
        - id: ch01-b07
          speaker: diana_barry
          text: "Yes, and I think it's very pretty."
        - id: ch01-b08
          speaker: narrator
          text: "Diana looked admiringly at the short, silky curls gathered around Anne's head. A jaunty black velvet ribbon and bow held them in place. The four girls stood beside the pond below Orchard Slope. A little point of land, fringed with birch trees, reached out from the bank. At its tip stood a small wooden platform built over the water for fishermen and duck hunters. Ruby and Jane had come to spend that midsummer afternoon with Diana, and Anne had joined them to play."
        - id: ch01-b09
          speaker: narrator
          text: "That summer, Anne and Diana had spent most of their playtime on the pond or beside it. Idlewild was only a memory now. In the spring, Mr. Bell had mercilessly cut down their little circle of trees in his back pasture. Anne had sat among the stumps and cried, though even then she kept one eye on the romance of the occasion. She soon took comfort in remembering that girls of thirteen, nearly fourteen, were far too old for childish things like playhouses. The pond offered much more fascinating adventures. They could fish for trout from the bridge, and they had learned to row themselves around in the little flat-bottomed dory Mr. Barry kept for duck shooting."
        - id: ch01-b10
          speaker: narrator
          text: "Anne had suggested acting out the story of Elaine. The girls had studied Tennyson's poem at school the winter before because the Superintendent of Education had put it in the English course for every Prince Edward Island school. They had analyzed it, parsed it, and pulled it to pieces in every possible way. It was a wonder any meaning remained for them at all. Even so, the fair lily maid, Lancelot, Guinevere, and King Arthur had become very real people in their minds. Anne was secretly consumed by regret that she had not been born in Camelot. She often said those old days were far more romantic than the present."
        - id: ch01-b11
          speaker: narrator
          text: "Everyone loved Anne's plan. They already knew that a flat pushed from the landing would follow the current under the bridge and come ashore on a curved point farther down the pond. They had drifted that way many times. It seemed perfect for Elaine's voyage."
        - id: ch01-b12
          speaker: anne_shirley
          text: "Very well, I'll be Elaine. Ruby, you must be King Arthur. Jane will be Guinevere, and Diana will be Lancelot. Before that, though, you must all play Elaine's father and brothers. We can't include the old silent servant. There isn't room for two people in the flat when one of them has to lie down. We need to cover the whole barge in blackest samite. Diana, your mother's old black shawl will be exactly right."
        - id: ch01-b13
          speaker: narrator
          text: "They fetched the shawl and spread it over the flat. Anne lay on the bottom with her eyes closed and her hands folded across her chest."
        - id: ch01-b14
          speaker: ruby_gillis
          text: "She really does look dead. Girls, this frightens me. Are we sure we should do it? Mrs. Lynde says all playacting is terribly wicked."
          emotion: fearful
        - id: ch01-b15
          speaker: anne_shirley
          text: "Ruby, don't mention Mrs. Lynde. She won't be born for hundreds of years, and you're spoiling the scene. Jane, take charge. Elaine can't keep giving orders when she's dead."
        - id: ch01-b16
          speaker: narrator
          text: "Jane took charge at once. They had no cloth of gold for a coverlet, so an old piano scarf made of yellow Japanese crepe had to serve. There was no white lily, either. A tall blue iris placed in Anne's folded hand looked splendid enough."
        - id: ch01-b17
          speaker: jane_andrews
          text: "There, she's ready. We have to kiss her quiet forehead. Diana, say, 'Sister, farewell forever.' Ruby, you say, 'Farewell, sweet sister.' Make it as sorrowful as you can. Anne, please smile just a little. Elaine looked as if she were smiling. Yes, that's right. Now push the flat away."
        - id: ch01-b18
          speaker: narrator
          text: "They shoved the flat from the landing. As it moved, its bottom scraped hard across an old stake buried in the water. Diana, Jane, and Ruby waited only until the current caught the boat and carried it toward the bridge. Then they raced through the woods, crossed the road, and hurried to the lower point. There they would become Lancelot, Guinevere, and the King, ready to receive the lily maid."
    - id: ch02
      title: The Leaking Barge
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: "For several minutes, Anne drifted slowly along and enjoyed the romance of her situation to the fullest. Then something happened that was not romantic at all. The flat began to leak. Within moments, Elaine had to scramble to her feet, gather up her cloth-of-gold coverlet and her blackest samite, and stare helplessly at a wide crack in the bottom of the barge. Water was pouring straight through it. The sharp stake at the landing had torn away the strip of batting nailed beneath the flat, though Anne did not know that. She did not need long to understand the danger. At that rate, the boat would fill and sink long before the current carried it to the lower point. She looked for the oars. They were back at the landing."
        - id: ch02-b02
          speaker: narrator
          text: "Anne gave one short, gasping scream, but nobody heard her. Her face went white. Still, she kept her head. She had one chance, and only one."
        - id: ch02-b03
          speaker: anne_shirley
          text: "I was terribly frightened, Mrs. Allan. The flat seemed to take years to reach the bridge, and the water kept rising every second. I prayed as earnestly as I could, but I didn't close my eyes. I knew God could save me by letting the flat come close enough to a bridge pile for me to climb onto it. The piles are old tree trunks, you know, with knots and broken branches all over them."
          emotion: fearful
        - id: ch02-b04
          speaker: anne_shirley
          text: "I knew I should pray, but I also had to watch and do my part. So I kept saying, 'Dear God, please bring the flat close to a pile, and I'll do the rest.' When you're in danger, you don't spend time making your prayer sound beautiful. Mine was answered. The flat struck a pile and stayed there for one moment. I threw the scarf and shawl over my shoulder and climbed onto a big branch stub that was there just when I needed it."
        - id: ch02-b05
          speaker: anne_shirley
          text: "Then I was hanging on to that slippery old pile with no way to go up or down. It wasn't romantic in the least, but I wasn't thinking about romance after nearly drowning. I thanked God right away. Then I put all my attention into holding tight, because I knew I would probably need a person to get me back to land."
        - id: ch02-b06
          speaker: narrator
          text: "The empty flat passed beneath the bridge and promptly sank in the middle of the stream. Ruby, Jane, and Diana were already waiting on the lower point, ready to welcome Elaine. They saw the boat vanish before their eyes and never doubted that Anne had gone down with it. For one frozen moment, they stood as white as sheets, struck still by the horror of it. Then they screamed at the tops of their voices and tore back through the woods. They crossed the main road without once pausing to look toward the bridge. Anne saw their flying figures and heard their cries from her narrow perch. She knew help would come soon. Until it did, her position was miserably uncomfortable."
        - id: ch02-b07
          speaker: narrator
          text: "The minutes crawled by. Each one felt like an hour to the unlucky lily maid. Why had no one come? Where had the girls gone? What if all three of them had fainted? What if nobody came at all? What if her arms grew so tired and cramped that she could no longer hold on? Anne looked down at the wicked green water below her. Long, oily shadows wavered in its depths, and she shivered. With nothing to do but cling there and wait, her imagination began offering one gruesome possibility after another."
        - id: ch02-b08
          speaker: narrator
          text: "At last, just when the pain in her arms and wrists seemed impossible to bear for another second, Gilbert Blythe rowed beneath the bridge in Harmon Andrews's dory."
    - id: ch03
      title: Under the Bridge
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: "Gilbert looked up. To his great surprise, a small white face was staring down at him. Anne's gray eyes were frightened, but they were scornful, too."
        - id: ch03-b02
          speaker: gilbert_blythe
          text: "Anne Shirley! What in the world are you doing up there?"
          emotion: surprised
        - id: ch03-b03
          speaker: narrator
          text: "He did not wait for her answer. He pulled the dory close to the pile and held out his hand. There was no other way down. Holding Gilbert's hand, Anne scrambled from the slippery pile into the boat. Wet, muddy, and furious, she settled in the stern with both arms full of dripping black shawl and soaked yellow crepe. Under those circumstances, looking dignified was nearly impossible."
        - id: ch03-b04
          speaker: gilbert_blythe
          text: "Anne, what happened?"
        - id: ch03-b05
          speaker: narrator
          text: "Gilbert picked up the oars. Anne answered in a cold voice without looking at him."
        - id: ch03-b06
          speaker: anne_shirley
          text: "We were acting out Elaine, and I was supposed to drift down to Camelot in the barge. I mean, in the flat. It started leaking, so I climbed onto the pile. The other girls went for help. Please row me to the landing."
        - id: ch03-b07
          speaker: narrator
          text: "Gilbert did as she asked. At the landing, Anne refused his help and sprang lightly onto the bank."
        - id: ch03-b08
          speaker: anne_shirley
          text: "Thank you very much."
        - id: ch03-b09
          speaker: narrator
          text: "She turned away with her head high. Gilbert jumped out of the boat and caught her arm before she could leave."
        - id: ch03-b10
          speaker: gilbert_blythe
          text: "Anne, wait. Can't we finally be friends? I'm truly sorry I teased you about your hair. I didn't mean to hurt you. I only thought it was a joke, and it happened such a long time ago. Your hair is really pretty now. I mean it. Please, let's be friends."
        - id: ch03-b11
          speaker: narrator
          text: "For one moment, Anne hesitated. Beneath all her wounded pride, she became aware of the half-shy, half-eager look in Gilbert's hazel eyes. It was somehow very good to see, and her heart gave one quick, strange beat. But the bitterness of her old grievance stiffened her uncertain resolve. The schoolroom scene from two years before returned as clearly as if it had happened yesterday. Gilbert had called her Carrots and brought disgrace on her before the whole school. Older people might have laughed at both the cause and the resentment, but time had not softened Anne's anger at all. She hated Gilbert Blythe. She would never forgive him."
        - id: ch03-b12
          speaker: anne_shirley
          text: "No. I will never be your friend, Gilbert Blythe. I don't want to be."
          emotion: angry
        - id: ch03-b13
          speaker: gilbert_blythe
          text: "Fine! I'll never ask you again, Anne Shirley. And I don't care!"
          emotion: angry
        - id: ch03-b14
          speaker: narrator
          text: "Gilbert's cheeks burned with angry color. He leaped into the dory and rowed away with quick, defiant strokes. Anne started up the steep little path beneath the maples and ferns. She kept her head very high, yet she could not escape an odd feeling of regret. She almost wished she had given Gilbert a different answer. He had insulted her terribly, of course, but still... She could not quite finish that thought. Altogether, Anne felt that sitting down for a good cry would be a relief. The fright, the painful clinging, and now the release from danger had left her shaken and worn out."
    - id: ch04
      title: The Girls Return
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: "Halfway up the path, Anne met Jane and Diana racing back toward the pond. They were as close to complete panic as two girls could be. At Orchard Slope, they had found no one to help because Mr. and Mrs. Barry were both away. By then Ruby had fallen into hysterics. They left her there to recover as best she could, then flew through the Haunted Wood, crossed the brook, and hurried on to Green Gables. No one was home there, either. Marilla had gone to Carmody, while Matthew was far away making hay in the back field."
        - id: ch04-b02
          speaker: diana_barry
          text: "Oh, Anne! We thought you had drowned. We felt like murderers because we were the ones who made you play Elaine. And Ruby is back there in hysterics. Oh, Anne, how did you ever get away?"
          emotion: happy
        - id: ch04-b03
          speaker: narrator
          text: "Diana threw her arms around Anne's neck and cried with relief and joy. Anne answered wearily."
        - id: ch04-b04
          speaker: anne_shirley
          text: "I climbed onto one of the bridge piles. Then Gilbert Blythe came by in Mr. Andrews's dory and took me to shore."
        - id: ch04-b05
          speaker: jane_andrews
          text: "Anne, that was splendid of him! Why, the whole thing is so romantic. Of course you'll speak to Gilbert after this."
        - id: ch04-b06
          speaker: anne_shirley
          text: "I certainly will not. And Jane Andrews, I never want to hear the word romantic again. Girls, I'm terribly sorry I frightened you so much. This was all my fault. I feel certain I must have been born under an unlucky star. Everything I do ends with me or my dearest friends in some kind of trouble. Now we've gone and lost your father's flat, Diana. I have a strong feeling we won't be allowed to row on the pond anymore."
          emotion: angry
        - id: ch04-b07
          speaker: narrator
          text: "Anne's feeling proved unusually accurate. When the Barry and Cuthbert families heard what had happened that afternoon, both households were thoroughly alarmed."
    - id: ch05
      title: A Little Romance
      blocks:
        - id: ch05-b01
          speaker: marilla_cuthbert
          text: "Anne, are you ever going to have any sense?"
        - id: ch05-b02
          speaker: anne_shirley
          text: "Oh, yes, Marilla. I really think I will. My chances of becoming sensible look better now than they ever have before."
        - id: ch05-b03
          speaker: narrator
          text: "Anne had enjoyed a good cry alone in the east gable. It had settled her nerves and brought back her usual cheerfulness."
        - id: ch05-b04
          speaker: marilla_cuthbert
          text: "I don't see why you think so."
        - id: ch05-b05
          speaker: anne_shirley
          text: "Because I learned an important new lesson today. Ever since I came to Green Gables, I've kept making mistakes. But each mistake has helped cure me of one serious fault. The trouble with the amethyst brooch taught me not to meddle with things that aren't mine. What happened in the Haunted Wood taught me not to let my imagination run away with me. The liniment cake mistake taught me to be careful when I cook, and dyeing my hair cured my vanity. I hardly ever think about my hair or my nose now. Well, not very often."
        - id: ch05-b06
          speaker: anne_shirley
          text: "And today's mistake will cure me of being too romantic. I've decided there's no use trying to be romantic in Avonlea. Perhaps it worked in Camelot, with all its towers, hundreds of years ago. But people don't appreciate romance now. You will soon see a great improvement in me, Marilla. I'm sure of it."
        - id: ch05-b07
          speaker: marilla_cuthbert
          text: "I certainly hope I do."
        - id: ch05-b08
          speaker: narrator
          text: "Marilla sounded doubtful and clearly did not share Anne's confidence. Matthew, meanwhile, had been sitting silently in his usual corner and listening to it all without saying a word. He waited until Marilla had gone out of the room. Then he came over, put one hand gently on Anne's shoulder, and spoke to her in a shy whisper."
        - id: ch05-b09
          speaker: matthew_cuthbert
          text: "Don't give up all your romance, Anne. A little is good. Not too much, of course. But keep some of it, Anne. Keep a little."
