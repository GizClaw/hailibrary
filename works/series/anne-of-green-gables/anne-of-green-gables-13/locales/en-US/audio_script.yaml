audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm, observant, and gently amused
        timbre: clear and rounded
        pace: measured
        pitch: medium
    anne_shirley:
      display_name: Anne Shirley
      tts:
        delivery: vivid, earnest, and eagerly imaginative
        timbre: clear and youthful
        pace: lively
        pitch: medium-high
    marilla_cuthbert:
      display_name: Marilla Cuthbert
      tts:
        delivery: firm, practical, and restrained
        timbre: clear and mature
        pace: steady
        pitch: medium-low
  chapters:
    - id: ch01
      title: The Delights of Anticipation
      blocks:
        - id: ch01-b01
          speaker: marilla_cuthbert
          text: "It's time Anne came in to do her sewing. She stayed with Diana more than half an hour past the time I gave her. Now she's sitting on the woodpile, talking to Matthew as fast as she can, though she knows she should be working. And naturally, he's listening like a complete ninny. The stranger her talk gets, the more he seems to enjoy it. Anne Shirley! Come inside this minute. Do you hear me?"
        - id: ch01-b02
          speaker: narrator
          text: "Outside, the yellow August afternoon seemed half asleep in the heat. Marilla tapped sharply on the west window. Anne came flying in from the yard. Her eyes shone, her cheeks were lightly pink, and her loose hair streamed behind her in a bright wave."
        - id: ch01-b03
          speaker: anne_shirley
          text: "Oh, Marilla, we're having a Sunday school picnic next week! It'll be in Mr. Harmon Andrews's field, close to the Lake of Shining Waters. Mrs. Bell, the superintendent's wife, and Mrs. Rachel Lynde are going to make ice cream. Just think, Marilla. Ice cream! Oh, may I go?"
        - id: ch01-b04
          speaker: marilla_cuthbert
          text: "Take a look at the clock, Anne. What time did I tell you to come in?"
        - id: ch01-b05
          speaker: anne_shirley
          text: "Two o'clock. But isn't the picnic wonderful? Please say I can go. I've never been to one. I've dreamed about picnics, but I've never actually—"
        - id: ch01-b06
          speaker: marilla_cuthbert
          text: "Yes, I said two, and now it's quarter to three. Why didn't you do as you were told?"
        - id: ch01-b07
          speaker: anne_shirley
          text: "I truly meant to, Marilla. You can't imagine how fascinating Idlewild is. And of course I had to tell Matthew about the picnic. He's such a sympathetic listener. Please, can I go?"
        - id: ch01-b08
          speaker: marilla_cuthbert
          text: "You'll have to learn to resist Idle-whatever-you-call-it. When I give you a time, I mean that time, not thirty minutes later. And don't stop to talk with sympathetic listeners along the way. As for the picnic, yes, you may go. You attend Sunday school. I'm not likely to keep you home while all the other girls go."
        - id: ch01-b09
          speaker: anne_shirley
          text: "But Diana says everyone has to bring a basket of food. You know I can't cook, Marilla. I could bear going without puffed sleeves, but going without a basket would be terribly humiliating. I've worried about it ever since Diana told me."
        - id: ch01-b10
          speaker: marilla_cuthbert
          text: "Then you can stop worrying. I'll bake enough to fill a basket for you."
        - id: ch01-b11
          speaker: anne_shirley
          text: "Oh, dear, good Marilla! You're so kind to me. Thank you so very much!"
          emotion: happy
        - id: ch01-b12
          speaker: narrator
          text: "When Anne had finally run out of ohs, she threw her arms around Marilla and joyfully kissed her thin cheek. In all Marilla's life, no child had ever chosen to kiss her face before. That sudden, startling sweetness swept through her again. Secretly, Anne's quick affection pleased her enormously. That was probably why her answer came out so rough."
        - id: ch01-b13
          speaker: marilla_cuthbert
          text: "There, that's enough of this kissing foolishness. I'd much rather see you obey properly. I do mean to teach you to cook one of these days. But you're so scatterbrained that I've been waiting for you to settle down and grow a little steadier. Cooking takes all your attention. You can't stop halfway through and let your mind wander over the whole world. Now get your patchwork. Finish your square before tea."
        - id: ch01-b14
          speaker: anne_shirley
          text: "I do not like patchwork. Some kinds of sewing might be pleasant, but patchwork gives your imagination no room at all. You sew one tiny seam, then another, and it never feels as if you're getting anywhere. Still, I'd rather be Anne of Green Gables, sewing patchwork, than be Anne anywhere else with nothing but play to do. I only wish sewing patches passed as quickly as playing with Diana does."
        - id: ch01-b15
          speaker: narrator
          text: "With a mournful sigh, Anne found her workbasket and sat down in front of a small pile of red and white diamonds."
        - id: ch01-b16
          speaker: anne_shirley
          text: "Oh, Marilla, Diana and I have the most elegant times. I have to supply most of the imagination, but I'm quite capable of that. In every other way, Diana is perfect. You know that strip of land across the brook, the one that runs up between our farm and Mr. Barry's? It belongs to Mr. William Bell. In one corner there's a little circle of white birches. It's the most romantic place."
        - id: ch01-b17
          speaker: anne_shirley
          text: "That's where Diana and I made our playhouse. We call it Idlewild. Isn't that a poetical name? It took me quite a while to invent it. I stayed awake for nearly a whole night. Then, just when I was falling asleep, the name came to me like an inspiration. Diana was enraptured when she heard it."
        - id: ch01-b18
          speaker: anne_shirley
          text: "We've arranged the house beautifully. You will come see it, won't you, Marilla? We use great big stones covered in moss for seats. Then we laid boards from one tree to another to make shelves, and all our dishes sit on them. The dishes are broken, of course, but imagining them whole is the easiest thing in the world. We have one especially lovely piece of plate with a spray of red and yellow ivy painted on it. That belongs in the parlor, beside the fairy glass."
        - id: ch01-b19
          speaker: anne_shirley
          text: "The fairy glass is as lovely as a dream. Diana found it in the woods behind their chicken house. It's filled with rainbows, tiny young rainbows that haven't grown up yet. Her mother said it broke off an old hanging lamp. But we like to imagine the fairies lost it during a ball one night, so fairy glass is what we call it. Matthew is going to build us a table, too."
        - id: ch01-b20
          speaker: anne_shirley
          text: "And we've named the little round pool over in Mr. Barry's field Willowmere. I found that name in the book Diana lent me. What a thrilling book, Marilla! The heroine had five men in love with her. I'd be perfectly content with one. Wouldn't you? She was very beautiful, and she had to endure the most terrible troubles. She could faint with no effort at all. I'd love to know how to faint. Wouldn't you, Marilla? It seems so romantic."
        - id: ch01-b21
          speaker: anne_shirley
          text: "But I'm really very healthy, even though I'm so thin. I do believe I may be getting a little fatter. Don't you think so? Every morning when I wake up, I inspect my elbows to see if any dimples are beginning to appear. Diana is getting a new dress with sleeves that stop at the elbows. She'll wear it to the picnic."
        - id: ch01-b22
          speaker: anne_shirley
          text: "Oh, I hope the weather stays fine next Wednesday. I don't think I could stand it if something kept me from the picnic. I suppose I would survive, but the sadness would last my whole life. Even a hundred picnics afterward couldn't make up for missing this one. There will be boats on the Lake of Shining Waters. And ice cream, as I told you. I've never tasted it. Diana tried to describe it, but I believe ice cream is beyond imagination."
        - id: ch01-b23
          speaker: marilla_cuthbert
          text: "Anne, you've talked without stopping for ten full minutes by the clock. Now, just to satisfy my curiosity, let's see whether you can hold your tongue for the same amount of time."
        - id: ch01-b24
          speaker: narrator
          text: "Anne did as Marilla asked and held her tongue for the full ten minutes. For the rest of that week, though, she talked about the picnic, thought about it, and dreamed about it. Rain came on Saturday. Anne worked herself into a frenzy, afraid it would keep raining right through Wednesday and spoil the picnic. Marilla made her sew an extra patchwork square to settle her nerves."
        - id: ch01-b25
          speaker: narrator
          text: "On Sunday, as they walked home from church, Anne told Marilla that a chill of excitement had passed over her when the minister announced the picnic from the pulpit."
        - id: ch01-b26
          speaker: anne_shirley
          text: "Marilla, the thrill ran all the way up and down my back! Until that moment, I don't think I truly believed the picnic would happen. I was afraid I might have imagined it. But if a minister says something from the pulpit, you simply have to believe him."
        - id: ch01-b27
          speaker: marilla_cuthbert
          text: "You care too fiercely about the things you want, Anne. I'm afraid life has a great many disappointments waiting for you."
        - id: ch01-b28
          speaker: anne_shirley
          text: "Oh, Marilla, looking forward to something is half the pleasure. Maybe the thing itself won't happen. But no one can take away the fun you had expecting it. Mrs. Lynde says, 'Blessed are the people who expect nothing, because they won't be disappointed.' But I think expecting nothing would be worse than disappointment."
        - id: ch01-b29
          speaker: narrator
          text: "That day, as always, Marilla had worn her amethyst brooch to church. She wore it every Sunday. Leaving it behind would have felt almost sinful to her, every bit as bad as forgetting her Bible or the dime she put in the collection. The brooch was the possession she valued most. An uncle who went to sea had first given it to Marilla's mother. Later, her mother left it to Marilla."
        - id: ch01-b30
          speaker: narrator
          text: "It was an old-fashioned oval brooch. A braid of her mother's hair lay in the center, surrounded by a border of very fine amethysts. Marilla knew so little about precious stones that she never realized how fine they truly were. She only knew they were beautiful. Though she couldn't see them above her good brown satin dress, she was always pleasantly aware of their violet gleam at her throat."
        - id: ch01-b31
          speaker: narrator
          text: "The first time Anne saw the brooch, she was struck with delighted admiration."
        - id: ch01-b32
          speaker: anne_shirley
          text: "Oh, Marilla, what an elegant brooch! How can you possibly listen to the sermon or the prayers while you're wearing it? I know I couldn't. Amethysts are so lovely. They're what I once imagined diamonds would look like. Before I'd ever seen a diamond, I read about them and pictured beautiful purple stones that shimmered."
        - id: ch01-b33
          speaker: anne_shirley
          text: "Then one day I saw a real diamond in a lady's ring, and the disappointment made me cry. It was lovely, of course, but it wasn't my idea of a diamond at all. May I hold your brooch for just one minute, Marilla? Do you suppose amethysts could be the souls of good violets?"
