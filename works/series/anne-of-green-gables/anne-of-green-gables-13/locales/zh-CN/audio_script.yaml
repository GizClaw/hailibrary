audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖从容，带着细腻而机智的讲述感
        timbre: 清澈柔和
        pace: 舒缓而有变化
        pitch: 中音
    anne:
      display_name: 安妮
      tts:
        delivery: 热切灵动，想法接连涌出，真挚而富于想象
        timbre: 清亮稚嫩
        pace: 明快，动情处自然放慢
        pitch: 中高音
    marilla:
      display_name: 玛丽拉
      tts:
        delivery: 干脆严谨，言语直截了当，偶尔透出克制的温情
        timbre: 清晰沉稳
        pace: 中等
        pitch: 中音
  chapters:
    - id: ch01
      title: 第十三章　期待的喜悦
      blocks:
        - id: ch01-b01
          speaker: marilla
          text: >-
            安妮早就该回来做针线活了。她在戴安娜那里多玩了半个多钟头，现在还坐在柴堆上跟马修说个不停。明知道有活儿要做，还只顾着说。马修也像个傻瓜似的，听得那么入迷。她的话越多，念头越古怪，他反倒越高兴。安妮·雪莉，你马上进来，听见没有！
        - id: ch01-b02
          speaker: narrator
          text: >-
            玛丽拉说着，先看了钟，又望向西窗外。金黄的八月午后热得发困，万物都静静打着盹儿。她在窗上急促地敲了几下，安妮立刻从院子里飞奔进来。女孩跑得气喘吁吁，眼睛亮闪闪的，脸颊微微发红，散开的头发像一道明亮的瀑布，飘在身后。她刚冲进屋，就急着把消息说出来。
        - id: ch01-b03
          speaker: anne
          text: >-
            玛丽拉，下星期要办主日学校野餐会了！地点就在哈蒙·安德鲁斯先生的田里，离闪光之湖特别近。贝尔校长太太和蕾切尔·林德太太还会做冰淇淋。您想想，那可是冰淇淋呀！我能去吗？
          emotion: happy
        - id: ch01-b04
          speaker: marilla
          text: >-
            先劳驾你看看钟。我叫你几点回来？
        - id: ch01-b05
          speaker: anne
          text: >-
            两点。可野餐会的消息多棒呀！求您让我去吧。我从来没参加过野餐会，只在梦里梦见过，我从来没有……
        - id: ch01-b06
          speaker: marilla
          text: >-
            我说的是两点，现在已经两点三刻了。你为什么不听我的话？
        - id: ch01-b07
          speaker: anne
          text: >-
            我真的打定主意，要准时回来的。可“闲逸之乡”实在太迷人了。再说，我当然得把野餐会的消息告诉马修。他特别懂得体谅人，也特别会听人说话。玛丽拉，我到底能不能去？
        - id: ch01-b08
          speaker: marilla
          text: >-
            那你就得学会不受那个什么“闲逸”的诱惑。我说几点，就是几点，不是半个钟头以后。路上也不用停下来，跟会体谅人的听众讲个没完。野餐会嘛，你当然能去。你也是主日学校的学生，别的女孩都去，我怎么会单单不许你去。
        - id: ch01-b09
          speaker: anne
          text: >-
            可是，戴安娜说，每个人都得带一篮吃的。您知道我不会做饭。参加野餐会时没有泡泡袖，我还能忍受，可要是没有篮子，我真会羞得抬不起头。自从听戴安娜说了，这件事就一直压在我心上。
        - id: ch01-b10
          speaker: marilla
          text: >-
            那就别再发愁了。我会烤好吃的，给你装满一篮子。
        - id: ch01-b11
          speaker: anne
          text: >-
            哦，玛丽拉，您真好，您对我实在太好了。我太感谢您了！
          emotion: happy
        - id: ch01-b12
          speaker: narrator
          text: >-
            这一连串的“哦”总算说完，安妮扑进玛丽拉怀里，欢天喜地地亲了亲她略显蜡黄的脸颊。玛丽拉活到现在，还是头一回有孩子主动把嘴唇贴到她脸上。那股突然涌来的甜蜜，又让她心头一颤。其实她对安妮这一下冲动的亲昵喜欢极了。大概正是为了遮掩这份欢喜，她说出口的话才格外生硬。
        - id: ch01-b13
          speaker: marilla
          text: >-
            好了，好了，别亲个没完。我更愿意看你老老实实听话。过些日子，我会开始教你做饭。可你这么没定性，我得先看看你能不能稳重一点。做饭的时候，脑子得留在眼前，不能做到一半就让念头满世界乱跑。现在拿出拼布，下午茶以前缝好一块。
        - id: ch01-b14
          speaker: narrator
          text: >-
            安妮愁眉苦脸地找出针线篮，对着那一小堆红白菱形布片叹了口气，这才坐下来动手。
        - id: ch01-b15
          speaker: anne
          text: >-
            我偏偏不喜欢拼布。有些针线活也许挺有趣，可拼布根本容不下想象。你只能缝完一小道，再缝一小道，好像永远也到不了头。不过，我还是宁愿做住在绿山墙、缝着拼布的安妮，也不愿做住在别处、除了玩什么也不用干的安妮。只可惜，缝布片时，时间过得不像我和戴安娜玩的时候那么快。
        - id: ch01-b16
          speaker: anne
          text: >-
            玛丽拉，我们玩得可高雅了。大部分想象得由我提供，不过这点事难不住我。戴安娜在其他方面全都十全十美。您记得小溪那边那块地吧？它一直伸进我们家和巴里先生家的农场之间，属于威廉·贝尔先生。就在一个角落里，有一小圈白桦树，浪漫得不得了。我们的游戏屋就在那里，名字叫“闲逸之乡”。是不是很有诗意？为了想出这个名字，我差不多熬了整整一夜。快睡着时，它忽然像灵感一样来了。戴安娜听见以后，喜欢得要命。
        - id: ch01-b17
          speaker: anne
          text: >-
            屋子已经收拾得很漂亮了，您一定要来看，好不好？长满青苔的大石头就是椅子，架在一棵树和另一棵树之间的木板就是搁板，我们把所有餐具都摆在上面。它们虽然全是破的，可想象成完整的，一点儿也不难。有块盘子碎片尤其美，上面画着一枝红黄相间的常春藤，我们把它摆在客厅里。仙女玻璃也放在那里。它美得像一场梦，是戴安娜从她们家鸡舍后面的树林里找到的。玻璃里全是彩虹，而且都是还没长大的小彩虹。
        - id: ch01-b18
          speaker: anne
          text: >-
            戴安娜的妈妈说，那是她们从前用过的一盏吊灯上摔下来的。可要是把它想成仙女们有天夜里举行舞会时弄丢的，不是有趣多了吗？所以我们叫它仙女玻璃。马修还要给我们做桌子。巴里先生田里有个圆圆的小水塘，我们取名叫“柳树潭”。这个名字来自戴安娜借我的一本书。那本书真惊险，女主人公有五个情人。我只要一个就够了，您也会满足吧？她非常美，还受了好多磨难，而且想晕就能晕，一点儿也不费劲。我也好想学会晕倒，您不想吗？那多浪漫呀。
        - id: ch01-b19
          speaker: anne
          text: >-
            可我虽然这么瘦，身体实在太好了。不过，我好像正在长胖。您也觉得是吧？我每天早晨一起床，都要看看胳膊肘，瞧瞧那里有没有长出小肉窝。戴安娜在做一条肘袖的新裙子，准备穿去野餐会。真希望下星期三是晴天。万一出了什么事，让我去不成，我简直承受不了。我想自己总能活下来，可这会让我伤心一辈子。以后哪怕参加一百次野餐会，也补不了错过这一次的遗憾。
        - id: ch01-b20
          speaker: anne
          text: >-
            野餐会还有闪光之湖上的小船，当然也有冰淇淋。我一次都没尝过。戴安娜想告诉我那是什么味道，可我猜，有些东西就是怎么想也想不出来，冰淇淋准是其中一样。
        - id: ch01-b21
          speaker: marilla
          text: >-
            安妮，你看着钟，已经一口气说了整整十分钟。现在我倒想看看，你能不能也安静十分钟。
        - id: ch01-b22
          speaker: narrator
          text: >-
            安妮当真照玛丽拉的意思，把嘴闭了十分钟。可这个星期剩下的日子里，她说的是野餐会，想的是野餐会，梦见的还是野餐会。星期六下了雨，她生怕这场雨一直下到星期三，再越过星期三不停，急得快要发狂。玛丽拉只好叫她多缝一块拼布，用这办法让她定定神。
        - id: ch01-b23
          speaker: narrator
          text: >-
            到了星期日，从教堂回家的路上，安妮把一个秘密般的感受告诉玛丽拉。牧师站在讲坛上宣布野餐会时，她竟然激动得全身都凉了。
        - id: ch01-b24
          speaker: anne
          text: >-
            玛丽拉，那股战栗顺着我的背脊来回跑！直到那一刻，我才真的相信野餐会会举行。先前我总怕那只是自己想象出来的。可牧师从讲坛上说出的话，人就非信不可了。
        - id: ch01-b25
          speaker: marilla
          text: >-
            你总是把整颗心全放在一件事上。我怕你这一辈子，会遇上许许多多的失望。
        - id: ch01-b26
          speaker: narrator
          text: >-
            玛丽拉叹了口气。安妮一听，却立刻大声说出了自己的道理。
        - id: ch01-b27
          speaker: anne
          text: >-
            可是，期待一件事，本身就占了一半的快乐。也许最后没能得到，但谁也不能阻止你享受等待它的快乐。林德太太说，什么也不期待的人有福了，因为他们不会失望。可在我看来，什么都不期待，比失望还糟糕。
        - id: ch01-b28
          speaker: narrator
          text: >-
            那天，玛丽拉和往常一样，戴着紫水晶胸针去教堂。她每回去教堂都要戴上它。若是不戴，她会觉得简直是对神圣之事不敬，就像去教堂时忘了带《圣经》，或者忘了带捐献用的十分钱一样糟糕。
        - id: ch01-b29
          speaker: narrator
          text: >-
            这枚胸针是她最珍爱的东西。玛丽拉的一位舅舅常年在海上奔波，他把胸针送给了她母亲，母亲后来又留给了她。胸针是老式的椭圆形，中间嵌着一绺母亲的头发，周围镶了一圈极细小的紫水晶。玛丽拉不懂宝石，也不知道这些水晶有多精美，可她觉得它们非常漂亮。胸针别在上好的棕色缎子裙领口上。她低头看不见，却总能感觉到喉间那一点紫色微光，心里也随之欢喜起来。
        - id: ch01-b30
          speaker: narrator
          text: >-
            安妮第一次见到这枚胸针，就被它迷住了，满心都是又惊又喜的赞叹。
        - id: ch01-b31
          speaker: anne
          text: >-
            玛丽拉，这枚胸针太漂亮了！您戴着它的时候，怎么还能专心听布道、做祷告呢？要是我戴着，我肯定办不到。紫水晶真可爱，和我从前想象中的钻石一模一样。那是很久以前，我还一次都没见过钻石，只在书里读到过。我总想知道它们究竟是什么样子，还一直以为，钻石就该是美丽的、闪着微光的紫色宝石。
        - id: ch01-b32
          speaker: anne
          text: >-
            后来有一天，我在一位太太的戒指上看见真正的钻石，失望得哭了。当然，那颗钻石也很漂亮，可它根本不是我想象的样子。您能把胸针给我拿一分钟吗？玛丽拉，您说紫水晶会不会是善良的紫罗兰的灵魂？
