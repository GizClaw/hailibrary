audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖从容，带着细腻而机智的讲述感
        timbre: 清澈柔和
        pace: 舒缓而有变化
        pitch: 中音
    anne:
      display_name: 安妮
      tts:
        delivery: 热切灵动，想法接连涌出，真挚而富于想象
        timbre: 清亮稚嫩
        pace: 明快，动情处自然放慢
        pitch: 中高音
    marilla:
      display_name: 玛丽拉
      tts:
        delivery: 干脆严谨，言语直截了当，偶尔透出克制的温情
        timbre: 清晰沉稳
        pace: 中等
        pitch: 中音
    rachel:
      display_name: 雷切尔太太
      tts:
        delivery: 直率强势，爱下判断，话里带着不容置疑的笃定
        timbre: 饱满厚实
        pace: 中等偏快
        pitch: 中低音
  chapters:
    - id: ch01
      title: 第九章　雷切尔·林德太太大惊失色
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 安妮来到绿山墙整整两个星期以后，林德太太才登门察看她。说句公道话，这次耽搁不能怪雷切尔太太。自从上回离开绿山墙，她就害了一场又凶又不合时令的流感，只能一直关在家里。这位太太平时很少生病，还明明白白地瞧不起那些常生病的人。不过她坚称，流感跟世上任何疾病都不一样，只能看作上天特意降下的磨难。医生一准她把脚踏出家门，她立刻赶往绿山墙。关于马修和玛丽拉收养的那个孤儿，埃文利已经传遍了各种故事和猜测，她早就憋着一肚子的好奇，非得亲眼看看不可。
        - id: ch01-b02
          speaker: narrator
          text: 这两个星期，安妮把每一刻清醒的时光都用得有滋有味。庄园周围每一棵树、每一丛灌木，她都已经熟悉了。她还发现苹果园下方有条小径，穿过一整片林地，一直向前延伸。安妮沿着小径探到最远的尽头，看过弯弯曲曲的溪水和小桥，走过冷杉矮林和野樱桃枝搭成的拱门，也钻进长满蕨草的角落，探过枫树与花楸掩映的一条条岔路。一路上每一次曲折变化，都叫她欣喜不已。
        - id: ch01-b03
          speaker: narrator
          text: 她还跟洼地里的泉水交了朋友。那真是一眼奇妙的泉水，又深又清，冷得沁骨。泉边铺满光滑的红砂石，四周还簇拥着一大丛一大丛棕榈叶似的水蕨，把泉眼围在当中。越过泉水再往前看，就是一座横跨溪流的原木桥。
        - id: ch01-b04
          speaker: narrator
          text: 安妮踏着雀跃的步子过桥，登上林木茂密的小山。冷杉和云杉又直又密，林下永远笼着暮色。那里开满纤巧的“六月铃”，那是林间最羞怯也最芬芳的花。还有几朵苍白轻盈的繁缕，像去年花朵留下的精灵。游丝在树间闪着银光，连冷杉的枝条和穗子都仿佛在亲切地同她说话。
        - id: ch01-b05
          speaker: narrator
          text: 这些令人心醉的探险，全是在准许安妮玩耍的零碎半小时里完成的。她把每一次新发现都说给马修和玛丽拉听，几乎要把他们念叨聋了。马修当然从不抱怨，只是一声不响地听着，脸上始终带着享受的微笑。玛丽拉也容她这样叽叽喳喳，直到发现自己竟听得太有兴趣，才会猛然警醒，赶紧用一句简短的命令叫安妮住口。
        - id: ch01-b06
          speaker: narrator
          text: 雷切尔太太来的时候，安妮正在果园里。她随自己的心意漫步在丰茂轻颤的草丛间，草叶上到处洒着夕阳的红光。这样一来，雷切尔太太便有了绝好的机会，可以把自己的病从头到尾讲个痛快。她兴致勃勃地描述每一处疼痛、每一下脉搏，享受得那么明显，听得玛丽拉暗想，就连流感大概也会带来一点补偿。等所有病情细节终于耗尽，她才说起这次登门真正的来意。
        - id: ch01-b07
          speaker: rachel
          text: 我最近听到了一些关于你和马修的怪事。
        - id: ch01-b08
          speaker: marilla
          text: 我想，你再吃惊也比不上我当初。不过，我现在已经渐渐缓过来了。
        - id: ch01-b09
          speaker: rachel
          text: 闹出这种差错实在太糟了。你们就不能把她送回去吗？
        - id: ch01-b10
          speaker: marilla
          text: 本来可以，可我们决定留下她。马修喜欢她，我也得承认，我自己也喜欢她。她当然有毛病，不过这家已经像换了个样。那孩子的确聪明伶俐。
        - id: ch01-b11
          speaker: narrator
          text: 玛丽拉看出雷切尔太太不赞成，一开口便说得比自己原先打算的多。
        - id: ch01-b12
          speaker: rachel
          text: 你这可是给自己揽下了天大的责任。你从没带过孩子，对她本人和她真正的性情又了解多少？这样的孩子以后会长成什么样，谁猜得出来。不过玛丽拉，我可绝不是来给你泄气的。
        - id: ch01-b13
          speaker: marilla
          text: 我一点也没泄气。我决定要做的事，就不会再改。你大概想见见安妮，我叫她进来。
        - id: ch01-b14
          speaker: narrator
          text: 不一会儿，安妮跑进屋来。她刚在果园里尽兴游逛过，脸上还亮着欢喜的光。可屋里突然多了个陌生人，她的欢喜一下变成羞怯，只好慌慌张张地停在门内。仔细一看，她的模样确实有些古怪。她还穿着孤儿院带来的短小紧身毛料裙，裙子下面，两条细腿长得很不相称。雀斑似乎比从前更多，也更显眼。风把她没戴帽子的头发吹得乱蓬蓬的，颜色亮得扎眼，那头发从来没显得这么红过。
        - id: ch01-b15
          speaker: rachel
          text: 嗯，他们挑中你，肯定不是因为你好看。玛丽拉，她瘦得吓人，长得也真难看。过来，孩子，让我好好看看。老天爷，谁见过这么多雀斑？头发还红得像胡萝卜！过来，我叫你过来。
        - id: ch01-b16
          speaker: narrator
          text: 雷切尔太太就是那种广受欢迎、令人愉快的人。她向来自豪于有话直说，不管会不会得罪谁。安妮也确实过来了，不过绝不是她料想的那种方式。安妮一步蹿过厨房，站到她面前。孩子气得满脸通红，嘴唇发颤，细瘦的身子从头抖到脚。
        - id: ch01-b17
          speaker: anne
          text: 我恨你！我恨你，我恨你，我恨你！你凭什么说我又瘦又丑？凭什么说我满脸雀斑，还是红头发？你这个粗鲁、无礼、没有心肝的女人！
          emotion: angry
        - id: ch01-b18
          speaker: narrator
          text: 安妮每喊一声恨，就把脚跺得更重。玛丽拉吓得失声叫她，可她毫不退缩。她昂着头，双眼喷火，两手握成拳，愤怒仿佛一团气焰，从全身腾腾冒出来。
        - id: ch01-b19
          speaker: anne
          text: 你凭什么那样说我？别人要是那样说你，你会喜欢吗？要是有人说你又胖又笨，脑子里连一丁点儿想象力都没有，你受得了吗？就算这些话伤你的心，我也不管！我就希望它们伤你的心。你伤我，比托马斯太太那个喝醉酒的丈夫从前伤得还厉害。我永远不会原谅你，永远，永远！
          emotion: angry
        - id: ch01-b20
          speaker: narrator
          text: 安妮又重重跺了两脚。
        - id: ch01-b21
          speaker: rachel
          text: 谁见过这么大的脾气！
          emotion: surprised
        - id: ch01-b22
          speaker: marilla
          text: 安妮，回你的房间去。待在那里，等我上楼。
        - id: ch01-b23
          speaker: narrator
          text: 安妮放声大哭，冲到过道门前，用力一摔，震得门廊外墙上的铁皮器具都哐啷作响。她像一阵旋风，穿过过道奔上楼。楼上传来又一声闷响，东山墙房间的门也被狠狠关上了。
        - id: ch01-b24
          speaker: rachel
          text: 玛丽拉，要把那样的孩子教养成人，我可一点也不羡慕你。
        - id: ch01-b25
          speaker: narrator
          text: 玛丽拉张了张嘴，本想道歉或辩解，可出口的话连她自己都吃了一惊。
        - id: ch01-b26
          speaker: marilla
          text: 雷切尔，你不该拿她的长相取笑她。
        - id: ch01-b27
          speaker: rachel
          text: 玛丽拉·卡斯伯特，你不会是在替她刚才那场可怕的发作撑腰吧？
          emotion: angry
        - id: ch01-b28
          speaker: marilla
          text: 我不是替她开脱。她确实太不像话，我得好好训她。可我们也得体谅她，从来没人教过她是非对错。而且雷切尔，你刚才对她的确太刻薄了。
        - id: ch01-b29
          speaker: narrator
          text: 玛丽拉原本只想说要体谅安妮，可最后那句话，她实在忍不住非加上不可。说完，她又为自己竟会替安妮说话暗暗吃惊。雷切尔太太听了，带着尊严受损的神气站了起来。
        - id: ch01-b30
          speaker: rachel
          text: 好吧，我明白了。以后在你面前说话，我得万分小心。毕竟那些不知从哪个鬼地方领来的孤儿，她们细腻的心情比什么都重要。哦，我没生气，你不用担心。我太替你难过，心里哪还有地方容得下怒气？以后有这个孩子叫你受的。你要肯听我的劝，虽然我看你不会听，尽管我亲手养大了十个孩子，还埋葬过两个，那你说的这顿教训，就该用一根分量足的白桦条来给。对这种孩子，那才是最有效、最听得懂的话。依我看，她的脾气倒跟她那头红发十分相配。
        - id: ch01-b31
          speaker: rachel
          text: 晚安，玛丽拉。希望你还会像从前那样常去看我。不过，要是我来这里就会这样被人扑上来辱骂，你别指望我很快再登门。这种事，我这辈子还是头一回碰上。
        - id: ch01-b32
          speaker: narrator
          text: 雷切尔太太说完便一阵风似的走了。当然，一个走路总是摇摇摆摆的胖女人，到底能不能“一阵风似的”离去，还很难说。玛丽拉板着无比严肃的脸，朝东山墙的房间去了。
        - id: ch01-b33
          speaker: narrator
          text: 上楼时，玛丽拉不安地琢磨着该怎么办。刚才那场风波着实叫她惊慌。安妮偏偏当着雷切尔·林德太太的面发这么大的脾气，实在糟糕透了。可她忽然发现了一件叫自己惭愧的事。比起安妮性情里暴露出的严重缺点，她似乎更为刚才丢了脸而难堪。这份心思像是在责备她，叫她很不自在。
        - id: ch01-b34
          speaker: narrator
          text: 那么，该怎么罚安妮呢？雷切尔太太好心建议用白桦条。她自己的孩子都能用火辣辣的亲身经历证明，那东西的确有效。可玛丽拉一点也不喜欢这个主意。她不相信自己真能下手鞭打一个孩子。不行，必须另想一种惩罚，好让安妮真正明白自己的过错有多严重。
        - id: ch01-b35
          speaker: narrator
          text: 玛丽拉进屋时，安妮正脸朝下趴在床上，哭得伤心欲绝。她连脚上的泥靴子已经踩脏了干净床罩都没有察觉。玛丽拉先用并不算严厉的声音叫了她一声，可安妮没有回答。于是玛丽拉又叫了一遍，这回语气严厉得多。
        - id: ch01-b36
          speaker: marilla
          text: 安妮，马上从床上下来，听我说话。
        - id: ch01-b37
          speaker: narrator
          text: 安妮扭动着下了床，僵直地坐到床边的椅子上。她的脸哭得又肿又花，双眼固执地盯着地板。
        - id: ch01-b38
          speaker: marilla
          text: 看看你今天做的事。安妮，你不觉得羞耻吗？
        - id: ch01-b39
          speaker: anne
          text: 她没权利说我丑，也没权利说我是红头发。
        - id: ch01-b40
          speaker: marilla
          text: 你也没权利大发雷霆，更不该那样跟她说话。我真为你害臊，害臊透了。我原本盼着你在林德太太面前表现得懂事有礼，你却叫我丢尽了脸。我实在想不通，她不过说你头发红、长得不好看，你为什么就要发那么大的火？这些话，你自己平日不是也常常挂在嘴边吗？
        - id: ch01-b41
          speaker: anne
          text: 可自己说和听别人说，完全是两回事！你也许知道那是真的，心里还是会希望别人不完全这么想。我知道您一定觉得我的脾气糟透了，可我实在忍不住。她说那些话时，我心里有一股东西猛地冲上来，堵住了喉咙。我非冲她发作不可。
          emotion: sad
        - id: ch01-b42
          speaker: marilla
          text: 你今天可真出了大风头。林德太太以后到处都有故事可讲了，她也一定会讲。安妮，你那样发脾气，实在太可怕。
        - id: ch01-b43
          speaker: anne
          text: 要是有人当着您的面，说您又瘦又丑，您想想会是什么滋味。
          emotion: sad
        - id: ch01-b44
          speaker: narrator
          text: 安妮的恳求忽然唤醒了玛丽拉的一段旧记忆。那时她还很小，曾亲耳听见一位姑妈对另一位说，可惜这孩子长得这么黑，这么难看。那句话一直扎在她心里。直到玛丽拉一天天活到整整五十岁，那段记忆里的刺才终于不再让她疼。
        - id: ch01-b45
          speaker: marilla
          text: 我不是说林德太太那样讲你完全应该。雷切尔说话太直，可这不能成为你胡闹的借口。她是陌生人，是长辈，又是我的客人。凭这三条，你也该尊重她。你既粗鲁又放肆，所以你必须去她家，告诉她你后悔乱发脾气，请她原谅你。
        - id: ch01-b46
          speaker: anne
          text: 我永远也做不到。玛丽拉，您怎么罚我都行。把我关进又黑又湿、住满蛇和癞蛤蟆的地牢，只给我面包和水，我也绝不抱怨。可是，我不能请林德太太原谅我。
        - id: ch01-b47
          speaker: marilla
          text: 我们没有把人关进阴暗潮湿地牢的习惯，何况埃文利也没有多少这种地方。可你必须向林德太太道歉，非去不可。除非你肯告诉我你愿意，否则就一直待在房间里。
        - id: ch01-b48
          speaker: anne
          text: 那我只好永远待在这里了。因为我不能说自己后悔对她讲那些话。我根本不后悔。我很后悔惹您生气，可我很高兴对她说了那一番话。说出来真痛快。我明明不后悔，怎么能说后悔呢？我甚至连假想自己后悔都做不到。
          emotion: sad
        - id: ch01-b49
          speaker: marilla
          text: 也许明天早上，你的想象力就会好使一点。你有整整一夜反省自己，也该把心思转到正路上了。你说过，只要我们让你留在绿山墙，你就会努力做个特别好的孩子。可你今晚的表现，一点儿也不像。
        - id: ch01-b50
          speaker: narrator
          text: 玛丽拉留下这句话，让它像一支回马箭，刺痛安妮那颗风雨交加的心。她自己下楼回到厨房，满心烦恼，连灵魂都不得安宁。她恼自己，并不比恼安妮少。因为每次想起雷切尔太太方才那张目瞪口呆的脸，她的嘴角就会不由自主地抽动，心里还会冒出一股很想笑的冲动。玛丽拉十分清楚，这股笑意实在太不应该了。
