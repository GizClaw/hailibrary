  chapters:
    - id: ch01
      title: Two Weeks at Green Gables
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            Anne had been at Green Gables for two weeks before Mrs. Rachel Lynde finally came to inspect her. To be fair, Mrs. Rachel could not have come sooner. A severe and untimely case of grippe had kept her indoors ever since her last visit to Green Gables. She was hardly ever sick herself, and she had very little patience with people who were. But she insisted that grippe was unlike any other illness on earth. It could only be one of Providence's special trials. The moment her doctor said she could set foot outside, she hurried straight to Green Gables. All kinds of stories and guesses about Matthew and Marilla's orphan had spread through Avonlea, and Mrs. Rachel was bursting to see the girl for herself.
        - id: ch01-b02
          speaker: narrator
          text: >-
            Anne had filled every waking minute of those two weeks. By now she knew every tree and shrub around Green Gables. Below the apple orchard, she had found a lane that opened into a belt of woods. She followed it all the way to the end and explored every delightful turn. A brook appeared, then a bridge. The path slipped past a little grove of firs and under an arch of wild cherry. It curved into corners thick with fern, while side paths branched away among maple trees and mountain ash.
        - id: ch01-b03
          speaker: narrator
          text: >-
            Down in the hollow, Anne made friends with the spring. Its deep, clear water was icy cold. Smooth red stones circled it, along with great sprays of water fern that looked almost like palms. Beyond the spring, a log bridge crossed the brook.
        - id: ch01-b04
          speaker: narrator
          text: >-
            Across that bridge, Anne's dancing feet carried her over a wooded hill. The firs and spruces grew straight and close together there, keeping the woods in constant twilight. Hardly any flowers grew in that dim place. But tiny June bells appeared by the thousands, the shyest and sweetest blooms in the woods. A few pale starflowers floated among them like the spirits of last year's blossoms. Fine webs shone between the trees like silver thread. As Anne passed, the fir branches and tassels seemed to speak to her as friends.
        - id: ch01-b05
          speaker: narrator
          text: >-
            Anne made these joyful voyages whenever she was given a little time to play. Then she told Matthew and Marilla so much about every discovery that they were nearly talked deaf. Matthew never complained. He listened with a quiet smile of pleasure. Marilla allowed the chatter until she caught herself getting interested. Then she quickly told Anne to hold her tongue.
    - id: ch02
      title: Mrs. Rachel Comes to Call
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            Anne was roaming wherever she pleased through the orchard when Mrs. Rachel arrived. The thick grass trembled around her, splashed with the red light of evening. With Anne outside, Mrs. Rachel had plenty of time to tell Marilla the complete story of her illness. She described every ache and every beat of her pulse with such clear enjoyment that Marilla began to think even grippe might bring some rewards. Only when Mrs. Rachel had used up every medical detail did she come to the true reason for her visit.
        - id: ch02-b02
          speaker: rachel_lynde
          text: I've heard some astonishing things about you and Matthew.
        - id: ch02-b03
          speaker: marilla_cuthbert
          text: You can't be any more astonished than I was. I'm beginning to get over it now.
        - id: ch02-b04
          speaker: rachel_lynde
          text: It was a shame that mistake happened. Couldn't you have sent the girl back?
        - id: ch02-b05
          speaker: marilla_cuthbert
          text: >-
            We could have, I suppose, but we chose not to. Matthew has taken a liking to her. I like her too, though I know she has her faults. The whole house already feels different with her in it. She's a very bright little thing.
        - id: ch02-b06
          speaker: narrator
          text: >-
            Marilla had meant to say much less. But she saw the disapproval on Mrs. Rachel's face, and the words kept coming.
        - id: ch02-b07
          speaker: rachel_lynde
          text: >-
            You've taken on a tremendous responsibility, especially when you've never raised children. I suppose you know very little about her or what sort of nature she really has. No one can tell how a child like that may turn out. Still, I'm certainly not trying to discourage you, Marilla.
        - id: ch02-b08
          speaker: marilla_cuthbert
          text: >-
            I'm not discouraged. Once I decide to do something, I don't change my mind. I expect you'd like to meet Anne. I'll call her inside.
        - id: ch02-b09
          speaker: narrator
          text: >-
            Anne soon came running in, her face still shining with all the pleasure of roaming through the orchard. Then she saw the unexpected stranger. Her delight disappeared into embarrassment, and she stopped in confusion just inside the door. She certainly was an odd-looking little girl. Her short, tight dress was the same rough one she had worn from the asylum, and her thin legs seemed far too long beneath it. Her freckles looked darker and more noticeable than ever. She had worn no hat outside, and the wind had tossed her hair into a brilliant red disorder.
        - id: ch02-b10
          speaker: rachel_lynde
          text: >-
            Well, one thing is certain. They didn't choose you for your looks. Marilla, she's terribly thin and plain. Come closer, child, and let me see you properly. Good gracious, has anyone ever seen so many freckles? And that hair is as red as carrots! Come here when I tell you.
        - id: ch02-b11
          speaker: narrator
          text: >-
            Mrs. Rachel was proud of saying exactly what she thought, no matter who heard it. Anne did come closer, but not in the way Mrs. Rachel expected. In one leap, she crossed the kitchen. Her face burned red, her lips shook, and her whole narrow body trembled with anger.
    - id: ch03
      title: Anne's Temper
      blocks:
        - id: ch03-b01
          speaker: anne_shirley
          text: >-
            I hate you! I hate you, I hate you, I hate you! How dare you call me thin and ugly? How dare you talk about my freckles and my red hair? You're rude and cruel, and you don't care about anyone's feelings!
          emotion: angry
        - id: ch03-b02
          speaker: narrator
          text: >-
            Anne stamped harder each time she said she hated Mrs. Rachel.
        - id: ch03-b03
          speaker: marilla_cuthbert
          text: Anne!
          emotion: surprised
        - id: ch03-b04
          speaker: narrator
          text: >-
            But Anne faced Mrs. Rachel without backing down. Her head was high, her eyes blazed, and both hands were clenched tight. Her whole body seemed surrounded by the heat of her fierce anger.
        - id: ch03-b05
          speaker: anne_shirley
          text: >-
            What gave you the right to say those things about me? Would you like someone to say such things about you? What if I told you that you're fat and clumsy and probably haven't one bit of imagination? I don't care if that hurts you. I hope it does! You hurt me worse than anyone ever has, even Mrs. Thomas's husband when he was drunk. I'll never forgive you. Never, never!
          emotion: angry
        - id: ch03-b06
          speaker: narrator
          text: Anne stamped twice more.
        - id: ch03-b07
          speaker: rachel_lynde
          text: Has anyone ever witnessed such a temper?
          emotion: surprised
        - id: ch03-b08
          speaker: marilla_cuthbert
          text: Anne, go to your room. Stay there until I come upstairs.
        - id: ch03-b09
          speaker: narrator
          text: >-
            Anne burst into tears. She rushed through the hall door and slammed it so hard that the tins hanging outside on the porch rattled along with it. Then she tore through the hall and flew upstairs like a whirlwind. A second, quieter slam from above told them that the door of the east gable had shut with just as much force.
        - id: ch03-b10
          speaker: rachel_lynde
          text: Marilla, I certainly don't envy you the work of raising that child.
        - id: ch03-b11
          speaker: narrator
          text: >-
            Marilla opened her mouth, meaning to apologize or smooth things over. Instead, she heard herself say something that surprised her then and for years afterward.
        - id: ch03-b12
          speaker: marilla_cuthbert
          text: Rachel, you shouldn't have mocked her looks.
        - id: ch03-b13
          speaker: rachel_lynde
          text: >-
            Marilla Cuthbert! Are you actually defending that terrible fit of temper we just saw?
          emotion: angry
        - id: ch03-b14
          speaker: marilla_cuthbert
          text: >-
            No, I'm not excusing it. Anne behaved very badly, and I'll speak to her about it. But we have to allow for the fact that no one has taught her how to behave. And Rachel, you really were too harsh with her.
        - id: ch03-b15
          speaker: narrator
          text: >-
            Marilla could not stop herself from adding that last part. She was surprised at herself all over again. Mrs. Rachel rose with offended dignity.
        - id: ch03-b16
          speaker: rachel_lynde
          text: >-
            I see I'll have to watch every word I say here now. Apparently the delicate feelings of an orphan from goodness knows where must come before everything else. Oh, I'm not angry, Marilla. Don't trouble yourself about that. I feel far too sorry for you to be angry. That girl will give you plenty of trouble. You won't take my advice, of course, but I've raised ten children and buried two. When you give her that talk, use a good birch switch. That's the sort of language a child like her will understand. Her temper is every bit as red as her hair.
        - id: ch03-b17
          speaker: rachel_lynde
          text: >-
            Good evening, Marilla. I hope you'll still visit me as often as you always have. But don't expect me to come back here soon if I may be attacked and insulted like this. Nothing like it has ever happened to me before.
        - id: ch03-b18
          speaker: narrator
          text: >-
            With that, Mrs. Rachel swept out of the house, if a stout woman who always waddled could truly be said to sweep. Marilla turned toward the east gable with a very serious face.
    - id: ch04
      title: The Apology
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            As Marilla climbed the stairs, she worried over what to do. The whole scene had shocked her. Of all the people in Avonlea, why did Anne have to show that temper in front of Mrs. Rachel Lynde? Then an uncomfortable thought caught Marilla and seemed to scold her. She felt more humiliated that Rachel had witnessed the scene than sorry to discover such a serious fault in Anne's nature. She was ashamed of that, too. But how should she punish Anne? Mrs. Rachel's pleasant suggestion of a birch switch did not appeal to Marilla, though every one of Rachel's own children could have given painful evidence that it worked. Marilla did not believe she could whip a child. No, she would have to find another kind of punishment that made Anne understand just how serious her offense had been.
        - id: ch04-b02
          speaker: narrator
          text: >-
            Marilla found Anne facedown on the bed, crying bitterly. Anne had not even noticed that her muddy boots were on the clean bedspread.
        - id: ch04-b03
          speaker: marilla_cuthbert
          text: Anne.
        - id: ch04-b04
          speaker: narrator
          text: Anne did not answer. Marilla spoke again, this time more sternly.
        - id: ch04-b05
          speaker: marilla_cuthbert
          text: Anne, get off that bed right now and listen to me.
        - id: ch04-b06
          speaker: narrator
          text: >-
            Anne slid down and sat stiffly on a chair. Her face was swollen and streaked with tears, and she stared stubbornly at the floor.
        - id: ch04-b07
          speaker: marilla_cuthbert
          text: That was a fine way to behave. Aren't you ashamed of yourself?
        - id: ch04-b08
          speaker: anne_shirley
          text: She had no right to call me ugly and redheaded.
        - id: ch04-b09
          speaker: marilla_cuthbert
          text: >-
            And you had no right to lose your temper and speak to her that way. I was completely ashamed of you. I wanted you to be polite to Mrs. Lynde, and instead you disgraced me. Why should you fly into such a rage because she called you plain and red-haired? You say those things about yourself often enough.
        - id: ch04-b10
          speaker: anne_shirley
          text: >-
            But it's completely different when someone else says them! You can know something is true and still hope other people don't quite see it. I suppose you think my temper is dreadful. I couldn't stop it, though. When she said those things, something rose up inside me and choked me. I had to burst out at her.
          emotion: sad
        - id: ch04-b11
          speaker: marilla_cuthbert
          text: >-
            Well, you made quite a spectacle of yourself. Mrs. Lynde will have a wonderful story to spread everywhere, and you can be sure she'll spread it. Losing your temper like that was dreadful, Anne.
        - id: ch04-b12
          speaker: anne_shirley
          text: Just imagine how you'd feel if someone looked you in the face and called you thin and ugly.
          emotion: sad
        - id: ch04-b13
          speaker: narrator
          text: >-
            An old memory came back to Marilla. When she was a very small child, she had heard one aunt tell another what a pity it was that Marilla was such a dark, homely little thing. Marilla was fifty now, and only then had the sting finally gone out of those words.
        - id: ch04-b14
          speaker: marilla_cuthbert
          text: >-
            I won't say Mrs. Lynde was right to speak to you as she did. Rachel can be much too outspoken.
        - id: ch04-b15
          speaker: narrator
          text: Marilla's voice had softened, but she was not finished.
        - id: ch04-b16
          speaker: marilla_cuthbert
          text: >-
            That does not excuse your behavior. She was a stranger, an older person, and my guest. Those are three very good reasons to treat her respectfully. You were rude and disrespectful. So you will go to Mrs. Lynde, tell her you're sorry you lost your temper, and ask her to forgive you.
        - id: ch04-b17
          speaker: anne_shirley
          text: >-
            I can never do that. Punish me any other way you want. Lock me in a dark, wet dungeon full of snakes and toads. Give me nothing but bread and water, and I won't complain. But I cannot ask Mrs. Lynde to forgive me.
        - id: ch04-b18
          speaker: marilla_cuthbert
          text: >-
            We don't make a practice of locking people in dark, wet dungeons. For one thing, there aren't many dungeons in Avonlea. But you must apologize to Mrs. Lynde. You will stay in this room until you're ready to tell me you'll do it.
        - id: ch04-b19
          speaker: anne_shirley
          text: >-
            Then I'll have to stay here forever. I can't tell Mrs. Lynde I'm sorry for what I said. How could I, when I'm not sorry? I'm sorry I upset you, but I'm glad I said every bit of it to her. It felt wonderfully satisfying. I can't claim to be sorry when I'm not, can I? I can't even imagine being sorry.
          emotion: sad
        - id: ch04-b20
          speaker: marilla_cuthbert
          text: >-
            Perhaps your imagination will work better by morning. You'll have all night to think about your conduct and put yourself in a better frame of mind. You promised to try very hard to be good if we kept you at Green Gables. I can't say you looked as if you were trying very hard tonight.
        - id: ch04-b21
          speaker: narrator
          text: >-
            Marilla left those final words behind to trouble Anne's stormy heart and went back down to the kitchen. She was deeply worried and upset. She was also just as angry with herself as she was with Anne. Every time she remembered the completely stunned look on Mrs. Rachel's face, the corners of her mouth twitched with amusement. Marilla knew perfectly well that laughing would be wrong. Still, she could not stop wanting to do it.
