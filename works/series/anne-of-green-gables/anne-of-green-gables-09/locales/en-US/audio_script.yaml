audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm, observant, and gently amused
        timbre: clear and rounded
        pace: measured
        pitch: medium
    anne_shirley:
      display_name: Anne Shirley
      tts:
        delivery: vivid, earnest, and eagerly imaginative
        timbre: clear and youthful
        pace: lively
        pitch: medium-high
    marilla_cuthbert:
      display_name: Marilla Cuthbert
      tts:
        delivery: firm, practical, and restrained
        timbre: clear and mature
        pace: steady
        pitch: medium-low
    rachel_lynde:
      display_name: Mrs. Rachel Lynde
      tts:
        delivery: outspoken, assured, and sharply inquisitive
        timbre: full and mature
