audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖机智，叙事细腻而自然
        timbre: 清澈柔和的成年女声
        pace: 从容，随情节轻快变化
        pitch: 中音
    anne:
      display_name: 安妮
      tts:
        delivery: 想象丰富，热烈真挚，情绪来得快而鲜明
        timbre: 清亮灵动的少女声
        pace: 偏快，动情时一气呵成
        pitch: 中高音
    marilla:
      display_name: 玛丽拉
      tts:
        delivery: 务实克制，话语干脆，偶尔透出藏起的温情
        timbre: 稳重略低的成年女声
        pace: 稍慢而利落
        pitch: 中低音
    diana:
      display_name: 戴安娜
      tts:
        delivery: 亲切真诚，关心朋友时急切而坦率
        timbre: 甜润柔和的少女声
        pace: 自然，着急时稍快
        pitch: 中高音
    josie:
      display_name: 乔西
      tts:
        delivery: 好胜尖刻，说话直冲冲，带着挑衅
        timbre: 明亮偏尖的少女声
        pace: 稍快而干脆
        pitch: 中高音
    carrie:
      display_name: 卡丽
      tts:
        delivery: 活泼好奇，受惊时带着孩子气的慌张
        timbre: 清脆稚嫩的少女声
        pace: 轻快，慌乱时急促
        pitch: 高音
    mrs_barry:
      display_name: 巴里太太
      tts:
        delivery: 关切而果断，遇事迅速镇定下来
        timbre: 温厚清晰的成年女声
        pace: 适中偏快
        pitch: 中音
  chapters:
    - id: ch01
      title: 第二十三章　安妮为荣誉付出代价
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 安妮这一回竟平安度过了两个多星期。擦剂蛋糕那场风波过去将近一个月，也该有件新麻烦找上她了。至于小差错，那可不算。她曾经心不在焉，把一盆脱脂牛奶倒进食品间的毛线篮子，忘了猪食桶才是它该去的地方。她也曾一边幻想一边走路，径直踏出独木桥，掉进小溪。这些事都小得不值一提。
        - id: ch01-b02
          speaker: narrator
          text: 去牧师住宅喝茶一星期后，戴安娜·巴里办了一场聚会。安妮特意告诉玛丽拉，这场聚会人数很少，而且客人全是挑过的，只有她们班上的女孩子。
        - id: ch01-b03
          speaker: anne
          text: 放心吧，玛丽拉，只请了我们班的女孩。人很少，都是精心选过的。
        - id: ch01-b04
          speaker: narrator
          text: 大家玩得很好，一直没出岔子。吃过茶点以后，她们来到巴里家的花园，所有游戏都玩得有点腻了，正等着一件有趣的淘气事自己送上门。很快，她们开始玩起了“激将”。
        - id: ch01-b05
          speaker: narrator
          text: 那阵子，埃文利的孩子最爱玩这个。先是男孩子互相激，后来女孩子也跟着玩。那个夏天，孩子们只因别人说一句“你敢不敢”，便做出数不清的傻事。把这些事全写下来，足够装满一本书。
        - id: ch01-b06
          speaker: narrator
          text: 卡丽·斯隆先激鲁比·吉利斯爬前门那棵高大的老柳树。树上到处是肥胖的绿毛虫，鲁比怕得要命。她也怕扯破新细棉布裙，回家挨母亲责骂。可她还是利落地爬到了指定的位置，反倒让卡丽很失望。接下来，乔西·派叫简·安德鲁斯只用左腿，绕花园跳一整圈，中途不能停，右脚也不能落地。简很勇敢地跳起来，可到了第三个拐角就撑不住了，只能认输。
        - id: ch01-b07
          speaker: narrator
          text: 乔西赢了以后，得意得实在有些过分。安妮便激她走过花园东边的木板围墙。别以为在墙顶走路容易，那既要技巧，也要脑袋镇定、脚下稳当。乔西虽然不大讨人喜欢，偏偏天生会走围墙，而且练得非常熟。她轻轻松松走过巴里家的围墙，仿佛这种小事根本不值得拿来激她。
        - id: ch01-b08
          speaker: narrator
          text: 其他女孩都吃过走围墙的苦，很明白乔西这一下有多难，只好不大情愿地称赞她。乔西红光满面地跳下来，得意地瞥了安妮一眼。安妮把两条红辫子一甩。
        - id: ch01-b09
          speaker: anne
          text: 不过是一堵又低又窄的木板围墙，走几步有什么了不起？我在玛丽斯维尔认识一个女孩，她连屋脊都能走。
        - id: ch01-b10
          speaker: josie
          text: 我才不信。谁也不可能在屋脊上走。反正你肯定做不到。
        - id: ch01-b11
          speaker: anne
          text: 你说我做不到？
        - id: ch01-b12
          speaker: josie
          text: 那就走给我看呀！我现在就激你爬上去，从巴里先生家厨房的屋脊上走过去。
        - id: ch01-b13
          speaker: narrator
          text: 安妮的脸一下白了。可在她看来，自己根本没有第二条路。她朝房子走去，厨房屋顶旁边恰好靠着一架梯子。五年级的女孩们看着她走过去，又兴奋又害怕，不约而同地惊叫出声。
        - id: ch01-b14
          speaker: narrator
          text: 女孩们一齐叫了出来。那声音里，一半是兴奋，一半是害怕。
        - id: ch01-b15
          speaker: diana
          text: 安妮，千万别去！你会摔下来送命的。乔西爱说什么就让她说吧，激别人去做这么危险的事，本来就不公平。
          emotion: fearful
        - id: ch01-b16
          speaker: anne
          text: 我一定得去，我的荣誉全在这件事上。戴安娜，我要么走过那道屋脊，要么就死在上面。要是我真的死了，那枚珍珠珠子戒指留给你。
        - id: ch01-b17
          speaker: narrator
          text: 所有人都屏住呼吸。安妮爬上梯子，登上屋脊，直起身子，在危险的落脚处稳住平衡，然后迈开了脚。她晕乎乎地觉得，自己离地面实在太高，高得很不舒服。平日总能帮她渡过难关的想象力，这会儿对走屋脊也没有多少用处。不过，她还是成功走了好几步。
        - id: ch01-b18
          speaker: narrator
          text: 接着，灾难来了。安妮身子摇晃起来，脚下失去平衡。她先绊了一下，又踉跄几步，终于倒在屋顶上，顺着晒得发烫的斜面一路滑下去，轰的一声，跌进屋檐下纠缠成团的五叶地锦里。事情发生得太快，底下那一圈吓呆的女孩还没来得及一齐发出惊恐的尖叫。
        - id: ch01-b19
          speaker: narrator
          text: 要是安妮从爬上去的那一边掉下来，戴安娜当场就能继承那枚戒指。幸亏她落在另一边。那里的屋顶伸出来盖住门廊，屋檐离地面很近，摔下来没那么危险。尽管如此，女孩们还是发疯似的绕到房后。只有鲁比站在原地，仿佛脚下生了根，吓得歇斯底里地哭叫起来。
        - id: ch01-b20
          speaker: narrator
          text: 戴安娜她们赶到屋后，看见安妮躺在一片被砸坏的五叶地锦中，脸色惨白，身子一动不动。戴安娜扑通跪到她身边。
        - id: ch01-b21
          speaker: diana
          text: 安妮，你摔死了吗？亲爱的安妮，求你跟我说一句话！告诉我，你到底有没有摔死？
          emotion: fearful
        - id: ch01-b22
          speaker: narrator
          text: 安妮晕晕乎乎地坐了起来，所有女孩都松了一大口气，乔西尤其如此。乔西平日没有多少想象力，这会儿却已经看见自己往后一辈子都背着一个可怕的名声，说她害得安妮·雪莉小小年纪便惨死了。
        - id: ch01-b23
          speaker: anne
          text: 我没死，戴安娜。不过，我想我已经失去知觉了。
        - id: ch01-b24
          speaker: carrie
          text: 你哪儿失去知觉了？安妮，到底是哪儿呀？
        - id: ch01-b25
          speaker: narrator
          text: 安妮还没回答，巴里太太就赶来了。安妮一看见她，赶忙撑着身子想站起来，脚踝却猛地一疼。她短促地叫了一声，又跌坐回去。
        - id: ch01-b26
          speaker: mrs_barry
          text: 出什么事了？你伤着哪儿了？
        - id: ch01-b27
          speaker: anne
          text: 我的脚踝。戴安娜，请你去找你父亲，让他送我回家吧。我绝对走不回去了。简连绕花园单脚跳一圈都办不到，我更不可能用一只脚跳那么远。
        - id: ch01-b28
          speaker: narrator
          text: 玛丽拉正在果园采夏苹果，忽然看见巴里先生走过独木桥，沿着山坡上来。巴里太太走在他身边，后面跟着一长队小姑娘。巴里先生怀里抱着安妮，她的头软软地靠在他肩上。
        - id: ch01-b29
          speaker: narrator
          text: 就在那一刻，玛丽拉突然看清了自己的心。恐惧一下刺进心底，她终于明白，安妮对自己有多么重要。从前，她会承认自己喜欢安妮，甚至很疼爱她。可直到她惊慌地冲下山坡，才知道这个孩子比世上任何东西都珍贵。
        - id: ch01-b30
          speaker: marilla
          text: 巴里先生，她到底怎么了？
          emotion: fearful
        - id: ch01-b31
          speaker: narrator
          text: 玛丽拉脸色发白，浑身发抖。这个一向沉着又理智的女人，许多年都没有这样慌乱过。安妮听见她的声音，自己抬起了头。
        - id: ch01-b32
          speaker: anne
          text: 玛丽拉，别吓得太厉害。我在屋脊上走路，后来掉下来了。脚踝大概只是扭伤。不过我原本可能摔断脖子呢，咱们还是看看好的一面吧。
        - id: ch01-b33
          speaker: marilla
          text: 我答应让你参加聚会的时候，就该料到你准会闹出这种事。巴里先生，请把她抱进屋，放到沙发上。老天，这孩子昏过去了！
        - id: ch01-b34
          speaker: narrator
          text: 玛丽拉正因为放下心来，声音反而又尖又凶。她说得没错，伤处的疼痛压倒了安妮，她彻底失去了知觉。安妮一直盼着有朝一日能昏倒，这下又有一个愿望彻底实现了。
        - id: ch01-b35
          speaker: narrator
          text: 马修匆匆从收割庄稼的田里回来，马上又被派去请医生。医生过了一阵赶到，检查后发现伤势比大家原先想的严重。安妮的脚踝不是扭伤，而是骨折了。
        - id: ch01-b36
          speaker: narrator
          text: 当天夜里，玛丽拉走进东山墙房间。一个脸色苍白的女孩躺在床上，用可怜巴巴的声音迎接她。
        - id: ch01-b37
          speaker: anne
          text: 玛丽拉，你难道一点都不可怜我吗？
          emotion: sad
        - id: ch01-b38
          speaker: marilla
          text: 这场祸明明是你自己闯的。
        - id: ch01-b39
          speaker: narrator
          text: 玛丽拉猛地拉下窗帘，又点亮了一盏灯。
        - id: ch01-b40
          speaker: anne
          text: 就因为全是我的错，你才更应该可怜我呀。一想到不能怪别人，我心里就特别难受。要是有人能替我担一点责任，我肯定会好过得多。可如果别人激你去走屋脊，你会怎么做？
        - id: ch01-b41
          speaker: marilla
          text: 我会站在又稳又结实的地上，随他们怎么激。简直荒唐！
        - id: ch01-b42
          speaker: narrator
          text: 安妮叹了一口气。
        - id: ch01-b43
          speaker: anne
          text: 你意志坚定，玛丽拉，我可没有。我一想到乔西会瞧不起我就受不了。要是不去，她会拿这件事压我一辈子。我已经受了这么重的罚，你就别再生我的气了。昏倒根本不像我想的那么好受，医生替我接脚踝的时候也疼得可怕。
          emotion: sad
        - id: ch01-b44
          speaker: anne
          text: 六七个星期里，我哪儿也去不了，还会错过新来的女老师。等我回学校，她都不再是新老师了。还有吉——算了，班上每一个人都会超过我。哦，我真是个苦命的人！只要你不生气，我会努力勇敢地忍受这一切。
          emotion: sad
        - id: ch01-b45
          speaker: marilla
          text: 好了，我没有生你的气。你这孩子确实不走运，可说到底，吃苦头的还是你自己。来，多少吃一点晚饭吧。
        - id: ch01-b46
          speaker: anne
          text: 幸好我有这么丰富的想象力！它一定能帮我好好熬过去。那些没有想象力的人要是摔断了骨头，该怎么过日子呢，玛丽拉？
        - id: ch01-b47
          speaker: narrator
          text: 后来那七个星期漫长又乏味，安妮一次又一次地庆幸自己有想象力。不过，她并不是只靠想象过日子。来看她的人很多，从来没有一天例外。每天至少有一个学校里的女孩登门，给她送花、送书，再把埃文利孩子们那个小世界里的所有新闻讲给她听。
        - id: ch01-b48
          speaker: narrator
          text: 终于有一天，安妮第一次能一瘸一拐地穿过房间了。她十分幸福地叹了一口气。
        - id: ch01-b49
          speaker: anne
          text: 大家待我真好，玛丽拉。躺着养伤当然不舒服，可也有好的一面。到了这时候，你才知道自己有多少朋友。连贝尔督学都来看我了！他其实是个很不错的人，当然算不上知音，可我现在很喜欢他。我也特别后悔以前批评他的祷告。
          emotion: happy
        - id: ch01-b50
          speaker: anne
          text: 我现在相信，他祷告时句句都是真心的，只是说久了，听起来才像没放在心上。只要稍微用点心，他一定改得掉。我已经给了他一个很明白的暗示，还告诉他，我为了让自己私下的小祷告有意思，花了多大力气。
        - id: ch01-b51
          speaker: anne
          text: 他也把小时候摔断脚踝的事讲给我听了。贝尔督学居然也当过小男孩，想起来实在奇怪。连我的想象力都办不到。我一试着想他小时候的样子，眼前还是主日学校里的贝尔督学，灰色络腮胡和眼镜一样不少，只是个头缩小了。
        - id: ch01-b52
          speaker: anne
          text: 可要想象艾伦太太小时候，那就容易极了。她一共来看过我十四次！一位牧师太太有那么多事要忙，还能来十四次，这难道不值得骄傲吗？而且她来探望病人时特别开朗，从不说这全是我自己的错，也不说希望我能从此变成更好的女孩。
          emotion: happy
        - id: ch01-b53
          speaker: anne
          text: 林德太太每次来都会这么说。听她那口气，她也许盼着我变好，心里却不相信我真能做到。连乔西也来看我了。我尽量客客气气地招待她，因为她一定后悔激我走屋脊。要是我死了，她这一辈子都得背着沉重又阴暗的悔恨。
        - id: ch01-b54
          speaker: anne
          text: 戴安娜才是真正忠实的朋友。她每天都来，让我躺在枕头上的日子不那么寂寞。可我还是好想回学校！新老师的事听起来太让人兴奋了，女孩们都说她好得不得了。戴安娜说，她有最可爱的金色鬈发，眼睛特别迷人，衣服也漂亮极了。她的泡泡袖比埃文利任何人的都大。
        - id: ch01-b55
          speaker: anne
          text: 每隔一个星期五下午，她就让大家表演背诵。每个人都得背一篇东西，或者参加一段对话。想想都觉得美妙！乔西说她讨厌这些，那只是因为她没有多少想象力。戴安娜、鲁比和简正在排《一次晨间拜访》，下星期五就要演。
          emotion: happy
        - id: ch01-b56
          speaker: anne
          text: 不表演的那些星期五，斯泰西小姐会带大家去树林里过“野外”日，观察蕨类、花朵和鸟儿。每天早晚，他们还会做体操。林德太太说，她从没听过学校里搞这些花样，全怪他们请了一个女老师。可我觉得这一定棒极了。我相信，斯泰西小姐会是我的知音。
          emotion: happy
        - id: ch01-b57
          speaker: marilla
          text: 有一件事倒很清楚，安妮。你从巴里家屋顶摔下来，舌头可一点都没伤着。
