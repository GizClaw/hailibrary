  chapters:
    - id: ch01
      title: Anne Comes to Grief in an Affair of Honor
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: "Anne did manage to live through the next two weeks. In fact, nearly a month passed after the liniment cake before she got into any fresh trouble worth mentioning. She did absentmindedly pour a pan of skim milk into a basket of yarn balls instead of the pigs' bucket. And once, while lost in a daydream, she walked right off the log bridge and into the brook. But those were only little mistakes. They hardly counted."
        - id: ch01-b02
          speaker: narrator
          text: "One week after Anne's tea at the manse, Diana Barry gave a party."
        - id: ch01-b03
          speaker: anne_shirley
          text: "It will be small and select, Marilla. Just the girls from our class."
        - id: ch01-b04
          speaker: narrator
          text: "The girls had a wonderful time, and nothing went wrong until after tea. By then they were out in the Barry garden. They had grown tired of their games and were ready for any tempting bit of mischief that came along. Before long, someone suggested playing dares."
        - id: ch01-b05
          speaker: narrator
          text: "Daring was the latest fashion among Avonlea's children that summer. The boys had started it, but the girls soon joined in. If anyone had written down every foolish thing the children did because someone dared them, it would have filled a whole book."
        - id: ch01-b06
          speaker: narrator
          text: "Carrie Sloane began by daring Ruby Gillis to climb to a certain spot in the huge old willow by the front door. Ruby was deathly afraid of the fat green caterpillars crawling all over the tree. She was also afraid of what her mother would say if she tore her new muslin dress. Still, she climbed up quickly and completed the dare, much to Carrie's annoyance."
        - id: ch01-b07
          speaker: narrator
          text: "Next, Josie Pye dared Jane Andrews to hop all the way around the garden on her left foot. Jane was not allowed to stop or touch her right foot to the ground. She made a brave attempt, but at the third corner she gave up and admitted defeat. Josie celebrated more proudly than good manners allowed. So Anne decided to challenge her. She dared Josie to walk along the top of the board fence on the east side of the garden."
        - id: ch01-b08
          speaker: narrator
          text: "Walking on a board fence takes far more balance and skill than you might think, unless you've tried it yourself. Josie might have lacked some qualities that make a person well liked, but she had a natural talent for walking fences, and she had practiced it too. She crossed the Barry fence as casually as if such a tiny feat were hardly worth calling a dare. The other girls admired her, though they did it reluctantly. They knew how hard fence walking was from their own painful attempts."
        - id: ch01-b09
          speaker: narrator
          text: "Josie climbed down, glowing with victory, and shot Anne a challenging look. Anne tossed her red braids."
        - id: ch01-b10
          speaker: anne_shirley
          text: "Walking on a little low board fence isn't all that amazing. I knew a girl in Marysville who could walk along the ridge of a roof."
        - id: ch01-b11
          speaker: josie_pye
          text: "I don't believe you. Nobody could walk along a roof ridge. You certainly couldn't."
        - id: ch01-b12
          speaker: anne_shirley
          text: "Oh, couldn't I?"
        - id: ch01-b13
          speaker: josie_pye
          text: "Then prove it. I dare you to climb up and walk along the ridge of Mr. Barry's kitchen roof."
        - id: ch01-b14
          speaker: narrator
          text: "Anne went pale. Even so, she believed there was only one possible answer. She headed toward the house, where a ladder rested against the kitchen roof. Every girl in the fifth class cried out at once. Some were thrilled. The others were horrified."
        - id: ch01-b15
          speaker: diana_barry
          text: "Please don't do it, Anne! You could fall and be killed. Forget what Josie said. No one should dare another person to do something so dangerous."
          emotion: fearful
        - id: ch01-b16
          speaker: anne_shirley
          text: "I have to do it. My honor is at stake. I'll walk that ridgepole, Diana, or die trying. If I am killed, you may have my pearl bead ring."
        - id: ch01-b17
          speaker: narrator
          text: "In breathless silence, Anne climbed the ladder and reached the ridgepole. She stood upright on that uncertain footing and began to walk. She felt dizzy and far too high above the ground. Up there, imagination was no help at all. Still, she took several steps before disaster struck. Anne swayed. She lost her balance, stumbled, and fell. She slid down the hot, sun-baked roof, crashed over the edge, and tore through the Virginia creeper below. It all happened before the terrified girls could scream together."
        - id: ch01-b18
          speaker: narrator
          text: "If Anne had fallen from the side where she had climbed up, Diana probably would have inherited that pearl bead ring at once. Luckily, Anne fell on the other side. There, the roof sloped over the porch and came so close to the ground that the fall was much less dangerous. Even so, Diana and the girls raced wildly around the house. Only Ruby stayed behind. She stood frozen in place, then went into hysterics. The others found Anne lying pale and limp among the crushed and broken Virginia creeper."
        - id: ch01-b19
          speaker: diana_barry
          text: "Anne, are you dead? Oh, Anne, dear Anne! Please say something. Just tell me whether you're dead!"
          emotion: fearful
        - id: ch01-b20
          speaker: narrator
          text: "To everyone's enormous relief, Anne slowly sat up. Josie was especially relieved. Though she had little imagination, she had already pictured herself going through life marked as the girl responsible for Anne Shirley's early and tragic death. Anne was still dizzy when she answered."
        - id: ch01-b21
          speaker: anne_shirley
          text: "No, Diana, I'm not dead. But I think I've been knocked unconscious."
        - id: ch01-b22
          speaker: carrie_sloane
          text: "Where? Oh, Anne, where were you knocked unconscious?"
        - id: ch01-b23
          speaker: narrator
          text: "Before Anne could explain, Mrs. Barry arrived. Anne tried to scramble up when she saw her, but she dropped back with a sharp little cry."
        - id: ch01-b24
          speaker: mrs_barry
          text: "What happened? Where are you hurt?"
        - id: ch01-b25
          speaker: anne_shirley
          text: "My ankle. Oh, Diana, please find your father and ask him to carry me home. I know I can't walk that far. And if Jane couldn't hop around the garden, I'm sure I couldn't hop all the way home on one foot."
        - id: ch01-b26
          speaker: narrator
          text: "Marilla was in the orchard gathering summer apples when she saw Mr. Barry cross the log bridge and come up the slope. Mrs. Barry walked beside him, and a whole line of little girls followed. Mr. Barry carried Anne in his arms, with her head resting limply against his shoulder."
        - id: ch01-b27
          speaker: narrator
          text: "In that moment, Marilla understood something she had never understood before. Fear stabbed straight through her heart, and she knew what Anne had come to mean to her. Marilla would have admitted that she liked the girl. She might even have said she was very fond of her. But as she ran wildly down the slope, she knew Anne was dearer to her than anything else on earth."
        - id: ch01-b28
          speaker: marilla_cuthbert
          text: "Mr. Barry, what happened to her?"
          emotion: fearful
        - id: ch01-b29
          speaker: narrator
          text: "Marilla was pale and shaking. It had been many years since anyone had seen sensible, self-controlled Marilla so frightened. Anne lifted her head and answered for herself."
        - id: ch01-b30
          speaker: anne_shirley
          text: "Don't be too frightened, Marilla. I was walking along the ridgepole and fell off. I think I sprained my ankle. But I could have broken my neck, so let's look at the bright side."
        - id: ch01-b31
          speaker: marilla_cuthbert
          text: "I should have known you'd do something like this when I let you go to that party. Bring her inside, Mr. Barry, and put her on the sofa. Mercy, the child has fainted!"
        - id: ch01-b32
          speaker: narrator
          text: "Marilla's sharpness came from pure relief. And she was right about Anne. The pain had overwhelmed her, and one more of Anne's wishes had come true. She had fainted dead away."
        - id: ch01-b33
          speaker: narrator
          text: "Matthew was quickly called in from the harvest field and sent straight for the doctor. When the doctor arrived, he found that Anne's injury was worse than everyone had thought. Her ankle was broken."
        - id: ch01-b34
          speaker: narrator
          text: "That night, Marilla went up to the east gable. Anne lay in bed with a pale face, and her voice sounded pitiful."
        - id: ch01-b35
          speaker: anne_shirley
          text: "Aren't you terribly sorry for me, Marilla?"
        - id: ch01-b36
          speaker: marilla_cuthbert
          text: "It was your own fault."
        - id: ch01-b37
          speaker: narrator
          text: "Marilla pulled down the window blind and lit a lamp."
        - id: ch01-b38
          speaker: anne_shirley
          text: "That's exactly why you ought to feel sorry for me. Knowing it was all my fault makes it much worse. If I could blame someone else, I'd feel so much better. But tell me, Marilla, what would you have done if someone dared you to walk a ridgepole?"
        - id: ch01-b39
          speaker: marilla_cuthbert
          text: "I'd have kept both feet on solid ground and let them keep daring me. What foolishness!"
        - id: ch01-b40
          speaker: narrator
          text: "Anne sighed."
        - id: ch01-b41
          speaker: anne_shirley
          text: "But you have such a strong mind, Marilla, and I don't. I couldn't stand the thought of Josie Pye laughing at me. She would have bragged about it for the rest of my life. I've been punished so much already that you don't need to be very cross. Fainting isn't nice at all. And it hurt dreadfully when the doctor set my ankle."
        - id: ch01-b42
          speaker: anne_shirley
          text: "I can't walk around for six or seven weeks. I'll miss the new lady teacher, and by the time I return, she won't be new anymore. And Gil—everybody will pass me in class. Oh, I'm the most afflicted person! Still, I'll try to suffer bravely if you won't be cross with me, Marilla."
          emotion: sad
        - id: ch01-b43
          speaker: marilla_cuthbert
          text: "There, there, I'm not cross. You certainly are an unlucky child. But you're the one who has to suffer for it, just as you said. Now try to eat some supper."
        - id: ch01-b44
          speaker: anne_shirley
          text: "Isn't it lucky that I have such a good imagination? I expect it will carry me through wonderfully. What do people without imagination do when they break a bone, Marilla?"
        - id: ch01-b45
          speaker: narrator
          text: "During the seven slow weeks that followed, Anne had plenty of reasons to be grateful for her imagination. But she did not have to depend on it alone. Visitors came often. Every day, at least one of the schoolgirls stopped by with flowers or books and told Anne all the latest news from Avonlea's young people."
        - id: ch01-b46
          speaker: narrator
          text: "At last, the day came when Anne could limp across the floor for the first time. She gave a happy sigh and began telling Marilla how kind everyone had been."
        - id: ch01-b47
          speaker: anne_shirley
          text: "Everyone has been so good to me, Marilla. Being laid up isn't pleasant, but there is a bright side. You discover just how many friends you have. Even Superintendent Bell came to see me, and he's really a fine man. He isn't a kindred spirit, of course, but I like him. Now I feel terribly sorry that I criticized his prayers. I believe he truly means them. He's only gotten into the habit of saying them as though he doesn't. He could change that if he made a little effort."
        - id: ch01-b48
          speaker: anne_shirley
          text: "I gave him a very clear hint. I told him how hard I work to make my own private prayers interesting. Then he told me about breaking his ankle when he was a boy. Can you imagine Superintendent Bell ever being a boy? Even my imagination can't manage it. Whenever I try, I picture him exactly as he looks in Sunday school, with gray whiskers and spectacles, only smaller. Mrs. Allan is easy to imagine as a little girl."
        - id: ch01-b49
          speaker: anne_shirley
          text: "Mrs. Allan has visited me fourteen times. Isn't that something to be proud of, when a minister's wife has so many demands on her time? She's such a cheerful visitor too. She never says the accident was my own fault and hopes it will make me a better girl. Mrs. Lynde said that every time she came. And she said it in a way that made me think she might hope I'd improve, but she didn't really believe I would."
        - id: ch01-b50
          speaker: anne_shirley
          text: "Even Josie Pye visited me. I treated her as politely as I could because I think she regretted daring me to walk the ridgepole. If I had died, she would have carried a dark burden of guilt for the rest of her life. And Diana has been a faithful friend. She's come every day to cheer me while I lie here alone."
        - id: ch01-b51
          speaker: anne_shirley
          text: "Oh, but I'll be so glad to return to school! I've heard the most exciting things about the new teacher. All the girls think she's perfectly sweet. Diana says Miss Stacy has beautiful fair curls and fascinating eyes. She dresses wonderfully, and her sleeves puff out more than anyone else's in Avonlea."
          emotion: happy
        - id: ch01-b52
          speaker: anne_shirley
          text: "Every other Friday afternoon, Miss Stacy holds recitations. Everyone has to perform a piece or act in a dialogue. Just thinking about it is glorious! Josie says she hates it, but that's because she has so little imagination. Diana, Ruby Gillis, and Jane Andrews are preparing a dialogue called 'A Morning Visit' for next Friday."
        - id: ch01-b53
          speaker: anne_shirley
          text: "On the Fridays without recitations, Miss Stacy takes everyone into the woods for a field day. They study ferns and flowers and birds. The class even does physical exercises every morning and evening. Mrs. Lynde says she has never heard of such behavior and blames it all on having a woman teacher. But I think it sounds splendid. I believe Miss Stacy may be a kindred spirit."
          emotion: happy
        - id: ch01-b54
          speaker: marilla_cuthbert
          text: "Well, one thing is obvious, Anne. Falling off the Barry roof didn't hurt your tongue at all."
