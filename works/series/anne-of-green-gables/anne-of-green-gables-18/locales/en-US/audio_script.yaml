  chapters:
    - id: ch01
      title: A Quiet Night at Green Gables
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: "Great events can turn on very small things. Nobody would have guessed that a Canadian Premier's decision to include Prince Edward Island in his political tour would affect little Anne Shirley at Green Gables. But it did. The Premier came to Charlottetown one January to speak to his loyal supporters, along with any opponents who cared to attend the huge meeting. Most of Avonlea supported his party. On the night of the speech, nearly all the men and many of the women traveled the thirty miles into town. Mrs. Rachel Lynde went too. She was a passionate politician and belonged to the other side, but she was sure the rally could hardly manage without her. She took her husband, Thomas, who would be useful for looking after the horse, and brought Marilla along. Marilla had a secret interest in politics herself. Since this might be her only chance to see a real, living Premier, she eagerly took it. That left Anne and Matthew to keep house until the next day."
        - id: ch01-b02
          speaker: narrator
          text: "While Marilla and Mrs. Rachel enjoyed the meeting, Anne and Matthew had the bright Green Gables kitchen to themselves. A fire glowed in the old Waterloo stove. Blue-white frost sparkled on the windows. Matthew dozed over the Farmers' Advocate on the sofa, and Anne sat at the table, forcing herself through her lessons. Again and again, she looked toward a thrilling new book Jane Andrews had lent her. Her fingers longed to grab it. But if she read instead of studying, Gilbert Blythe would beat her in class tomorrow. She turned her back on the book and tried to forget it existed."
        - id: ch01-b03
          speaker: anne_shirley
          text: "Matthew, did you study geometry when you were in school?"
        - id: ch01-b04
          speaker: narrator
          text: "Matthew woke with a start."
        - id: ch01-b05
          speaker: matthew_cuthbert
          text: "Well now, no. I didn't."
        - id: ch01-b06
          speaker: anne_shirley
          text: "I wish you had. Then you could truly understand how I feel. You can't properly sympathize with someone if you've never studied geometry. It's putting a cloud over my entire life. I'm such a dunce at it."
          emotion: sad
        - id: ch01-b07
          speaker: matthew_cuthbert
          text: "Well now, I don't know about that. Seems to me you're good at everything. Mr. Phillips told me at Blair's store last week that you're the smartest student in school and you're making rapid progress. Those were his exact words. Some folks say Teddy Phillips isn't much of a teacher, but I reckon he's all right."
        - id: ch01-b08
          speaker: narrator
          text: "In Matthew's eyes, anyone who praised Anne was all right."
        - id: ch01-b09
          speaker: anne_shirley
          text: "I'd do much better at geometry if he would stop changing the letters. I memorize a proposition, and then he draws it on the board with different letters from the book. It mixes me all up. Don't you think that's a mean advantage for a teacher to take? We're studying agriculture too. At last I know why the roads are red, which is a great comfort. I wonder if Marilla and Mrs. Lynde are having a good time. Mrs. Lynde says Canada is going to the dogs because of the way Ottawa is running things. She calls it a dreadful warning to the voters. She says everything would change if women could vote. Which way do you vote, Matthew?"
        - id: ch01-b10
          speaker: matthew_cuthbert
          text: "Conservative."
        - id: ch01-b11
          speaker: narrator
          text: "Matthew answered at once. Voting Conservative was almost part of his religion."
        - id: ch01-b12
          speaker: anne_shirley
          text: "Then I'm a Conservative too. I'm glad, because Gil... because some boys at school are Grits. I think Mr. Phillips is a Grit as well. Prissy Andrews's father is one, and Ruby Gillis says a man who's courting must always agree with the girl's mother about religion and her father about politics. Is that really true?"
        - id: ch01-b13
          speaker: matthew_cuthbert
          text: "Well now, I don't know."
        - id: ch01-b14
          speaker: anne_shirley
          text: "Did you ever court anyone, Matthew?"
        - id: ch01-b15
          speaker: matthew_cuthbert
          text: "Well now, no. I don't suppose I ever did."
        - id: ch01-b16
          speaker: narrator
          text: "Matthew had certainly never considered doing such a thing in his entire life. Anne rested her chin in her hands and thought it over."
        - id: ch01-b17
          speaker: anne_shirley
          text: "It sounds rather interesting, doesn't it? Ruby says she'll have ever so many beaus when she grows up and keep them all wild about her. That would be too exciting for me. I'd rather have one beau who was in his right mind. Ruby knows a great deal about these matters because she has so many older sisters. Mrs. Lynde says the Gillis girls marry as fast as hot cakes sell. Mr. Phillips visits Prissy Andrews nearly every evening. He claims he's helping with her lessons. But Miranda Sloane is studying for Queen's too, and she needs far more help because she's much stupider than Prissy. He never goes to help Miranda at night. There are so many things in this world I don't understand, Matthew."
        - id: ch01-b18
          speaker: matthew_cuthbert
          text: "Well now, I can't say I understand them all myself."
        - id: ch01-b19
          speaker: anne_shirley
          text: "I suppose I'd better finish my lessons. I won't open Jane's book until I'm done, but the temptation is terrible. I can see it perfectly even with my back turned. Jane cried herself sick over it. I love a book that makes me cry. I'll lock it in the sitting-room jam closet and give you the key. You must not hand it back, even if I beg on my knees. People say to resist temptation, but it's much easier when you can't get the key. Then may I bring up some russet apples from the cellar? Wouldn't you like some?"
        - id: ch01-b20
          speaker: matthew_cuthbert
          text: "Well now, I reckon I would."
        - id: ch01-b21
          speaker: narrator
          text: "Matthew never ate russets, but he knew Anne loved them."
    - id: ch02
      title: Diana's Frightening News
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: "Anne came proudly up from the cellar carrying a plate of apples. At that moment, feet raced over the icy boardwalk. The kitchen door burst open, and Diana Barry rushed in. Her face was white, she could hardly breathe, and a shawl had been thrown around her head. Anne was so startled that she dropped her candle and the plate. Candle, apples, and plate crashed down the cellar stairs. Marilla found them the next day, stuck in melted grease, and thanked heaven the house had not burned down."
        - id: ch02-b02
          speaker: anne_shirley
          text: "Diana, what's happened? Has your mother finally changed her mind?"
          emotion: surprised
        - id: ch02-b03
          speaker: diana_barry
          text: "Oh, Anne, please hurry! Minnie May is terribly sick with croup. Young Mary Joe says so, and Mother and Father are in town. There's nobody to fetch the doctor. Minnie May is getting worse, and Mary Joe has no idea what to do. Oh, Anne, I'm so frightened!"
          emotion: fearful
        - id: ch02-b04
          speaker: narrator
          text: "Matthew said nothing. He grabbed his cap and coat, slipped past Diana, and disappeared into the dark yard. Anne hurried into her jacket and hood."
        - id: ch02-b05
          speaker: anne_shirley
          text: "He's harnessing the sorrel mare so he can ride to Carmody for the doctor. I know it as surely as if he told me. Matthew and I are kindred spirits, so I can understand his thoughts without any words."
        - id: ch02-b06
          speaker: diana_barry
          text: "I don't think the doctor will be in Carmody. Dr. Blair went to town, and Dr. Spencer probably did too. Young Mary Joe has never seen croup before, and Mrs. Lynde is away. Oh, Anne!"
          emotion: fearful
        - id: ch02-b07
          speaker: anne_shirley
          text: "Don't cry, Di. I know just what to do for croup. Remember, Mrs. Hammond had twins three times. Looking after three sets of twins gives a person plenty of experience, and every one of them got croup regularly. Wait while I get the ipecac. You may not have any at your house. There, let's go."
          emotion: calm
        - id: ch02-b08
          speaker: narrator
          text: "The girls ran out hand in hand. They hurried through Lover's Lane and over the hard-crusted field beyond because the snow was too deep along the shorter path through the woods. Anne truly felt sorry for Minnie May and understood how serious the danger was. Still, she could not help feeling the romance of racing through the night. Best of all, she was sharing that mystery and danger once more with the kindred spirit from whom she had been separated for so long."
        - id: ch02-b09
          speaker: narrator
          text: "It was a clear, frozen night, black with shadows and silver with snowy hills. Large stars shone over the quiet fields. Dark pointed fir trees rose here and there, their branches dusted with snow while the wind whistled through them. To Anne, it was wonderful to skim through all that mystery and beauty beside her beloved friend."
    - id: ch03
      title: Through the Anxious Night
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: "Three-year-old Minnie May was very ill. She tossed feverishly on the kitchen sofa, and her harsh breathing could be heard all through the house. Young Mary Joe, the broad-faced French girl from the creek whom Mrs. Barry had hired to stay with the children, was completely lost. She could neither decide what to do nor carry it out if she had thought of it. Anne took charge at once."
        - id: ch03-b02
          speaker: anne_shirley
          text: "It is croup, and she's quite sick, though I've seen worse. First, we need plenty of hot water. Diana, there's barely a cup in this kettle! I've filled it now. Mary Joe, put more wood in the stove. I don't want to offend you, but anyone with imagination might have thought of that already. I'll undress Minnie May and get her into bed. Diana, please find some soft flannel cloths. First of all, I'm giving her some ipecac."
        - id: ch03-b03
          speaker: narrator
          text: "Minnie May strongly objected to the medicine, but Anne had not cared for three pairs of twins for nothing. She made sure the ipecac went down. And it went down not just once, but many times during that long, worried night. Anne and Diana worked patiently over the suffering child without giving up. Young Mary Joe was honestly anxious to do everything she could, even though she had been helpless when Anne arrived. Under Anne's direction, she kept the fire roaring and heated more water than a whole hospital full of babies with croup would have needed."
        - id: ch03-b04
          speaker: narrator
          text: "Matthew finally arrived with a doctor at three in the morning. He had been forced to travel all the way to Spencervale to find one. By then, the worst danger had passed. Minnie May was much better and sleeping deeply. Anne told the doctor what had happened."
        - id: ch03-b05
          speaker: anne_shirley
          text: "I came terribly close to losing hope. She kept getting worse until she was sicker than any of the Hammond twins, even the last pair. I truly thought she would choke to death. I used every drop of ipecac in the bottle. When I gave her the final dose, I said something to myself. I couldn't say it to Diana or Mary Joe because they were worried enough already, but I had to let my feelings out somehow. I told myself, 'This is the last lingering hope, and I fear it is a vain one.' Then, about three minutes later, she coughed up the phlegm and began improving at once. You'll have to imagine how relieved I was, doctor. Words cannot express it. Some things simply cannot be put into words."
        - id: ch03-b06
          speaker: doctor
          text: "Yes, I know."
        - id: ch03-b07
          speaker: narrator
          text: "The doctor nodded and studied Anne as if he had a few thoughts about her that words could not express. Later, however, he expressed them clearly to Mr. and Mrs. Barry."
        - id: ch03-b08
          speaker: doctor
          text: "That little red-haired girl at the Cuthberts' is as clever as they come. She saved your baby's life. I would have arrived too late. For a child her age, she has astonishing skill and presence of mind. And you should have seen her eyes while she explained the case. I've never seen anything like them."
    - id: ch04
      title: A Winter Morning and Wonderful News
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: "Anne went home through the marvelous white-frosted morning. Her eyes were heavy from missing a night's sleep, but she talked tirelessly to Matthew as they crossed the long white field and passed beneath the glittering fairy arch made by the maples of Lover's Lane."
        - id: ch04-b02
          speaker: anne_shirley
          text: "Oh, Matthew, what a wonderful morning! Doesn't the world look like something God just imagined for His own pleasure? Those trees seem so delicate that one breath could blow them away. Pouf! I'm so glad I live in a world with white frost. Aren't you? And now I'm thankful Mrs. Hammond had three pairs of twins. Without them, I might not have known how to save Minnie May. I'm sorry I was ever cross with Mrs. Hammond for having twins. But, oh, Matthew, I'm so sleepy. I can't possibly go to school. My eyes would never stay open, and I'd be terribly stupid. Still, I hate missing it. Gil... some of the others will reach the head of the class. It's so hard to climb back up, though the harder it is, the more satisfying it feels when you succeed. Don't you think so?"
        - id: ch04-b03
          speaker: narrator
          text: "Matthew looked at Anne's small white face and the dark shadows beneath her eyes."
        - id: ch04-b04
          speaker: matthew_cuthbert
          text: "Well now, you'll manage. Go straight to bed and sleep well. I'll take care of all the chores."
        - id: ch04-b05
          speaker: narrator
          text: "Anne did go to bed, leaving Matthew to handle every chore as he had promised. She slept so deeply and for so long that the winter afternoon was already white and rosy when she woke. By then, Marilla had returned from Charlottetown and was sitting in the kitchen with her knitting. Anne came downstairs and immediately asked about the great event she had missed."
        - id: ch04-b06
          speaker: anne_shirley
          text: "Did you see the Premier? What did he look like, Marilla?"
        - id: ch04-b07
          speaker: marilla_cuthbert
          text: "Well, it wasn't his looks that made him Premier. That man had quite a nose. But he certainly knows how to speak. He made me proud to be a Conservative. Rachel Lynde is a Liberal, of course, so she couldn't find any use for him. Your dinner is waiting in the oven. Get some blue plum preserves from the pantry too. You must be hungry. Matthew told me what happened last night. It's a good thing you knew what to do. I wouldn't have known, since I've never seen croup. Now eat before you start talking. I can see you're bursting with speeches, but they'll keep."
        - id: ch04-b08
          speaker: narrator
          text: "Marilla had something important to tell Anne, but she did not say it yet. She knew exactly what would happen. The excitement would carry Anne straight out of the ordinary world of food, appetite, and dinner. So she waited while Anne ate. Only after Anne had finished her dish of blue plum preserves did Marilla finally share the news."
        - id: ch04-b09
          speaker: marilla_cuthbert
          text: "Mrs. Barry came by this afternoon. She wanted to see you, but I wouldn't wake you. She says you saved Minnie May's life. She's very sorry about the currant wine, and now she understands you never meant to make Diana drunk. She hopes you'll forgive her and be friends with Diana again. You may visit this evening if you want. Diana caught a bad cold last night and can't leave the house. And Anne Shirley, don't go flying into the air!"
        - id: ch04-b10
          speaker: narrator
          text: "The warning was needed. Anne sprang up looking so joyful that she seemed ready to float away."
        - id: ch04-b11
          speaker: anne_shirley
          text: "Oh, Marilla, may I go this very minute without washing my dishes? I'll wash them when I come back, but I cannot fasten myself to something as unromantic as dishes at a thrilling moment like this!"
        - id: ch04-b12
          speaker: marilla_cuthbert
          text: "Yes, yes, go on. Anne Shirley, have you lost your senses? Come back and put something on! I might as well shout at the wind. She's run off without a cap or a wrap. Look at her racing through the orchard with her hair flying. It'll be a wonder if she doesn't catch her death of cold."
    - id: ch05
      title: Perfectly Happy
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: "Anne danced home over the snowy ground in the purple winter twilight. Far to the southwest, the great evening star shimmered like a pearl. The sky around it was pale gold and airy rose above gleaming white fields and the dark hollows where spruce trees grew. Somewhere among the snowy hills, sleigh bells sent their clear little chimes through the frozen air. They sounded like fairy music. Yet they were no sweeter than the song filling Anne's heart and spilling from her lips as she came home."
        - id: ch05-b02
          speaker: anne_shirley
          text: "Marilla, you are looking at a perfectly happy person. I am perfectly happy, even with my red hair. At this moment, my soul has risen above red hair. Mrs. Barry kissed me and cried. She told me how sorry she was and said she could never repay me. I was dreadfully embarrassed. But I answered as politely as I could, 'I have no hard feelings toward you, Mrs. Barry. I assure you again that I never meant to intoxicate Diana, and from now on, I shall cover the past with the mantle of oblivion.' Wasn't that a dignified thing to say, Marilla?"
        - id: ch05-b03
          speaker: anne_shirley
          text: "I felt as if I were heaping coals of fire on Mrs. Barry's head. Diana and I spent a lovely afternoon together. Her aunt in Carmody taught her a new fancy crochet stitch, and she showed it to me. No one else in Avonlea knows it. We made a solemn promise never to teach it to anybody. Diana gave me a beautiful card with a wreath of roses and a poem. It said, 'If you love me as I love you, nothing but death can part us two.'"
        - id: ch05-b04
          speaker: anne_shirley
          text: "And it's true, Marilla. We're going to ask Mr. Phillips if we may sit together at school again. Gertie Pye can sit with Minnie Andrews. We had an elegant tea. Mrs. Barry brought out her finest china, just as if I were a real guest. Oh, what a thrill that gave me! Nobody had ever used their best china for me before. We ate fruitcake, pound cake, doughnuts, and two kinds of preserves. Then Mrs. Barry asked if I took tea and said, 'Pa, why don't you pass Anne the biscuits?' It must be wonderful to grow up if merely being treated like a grown-up feels so nice."
        - id: ch05-b05
          speaker: marilla_cuthbert
          text: "I'm not so sure about that."
        - id: ch05-b06
          speaker: narrator
          text: "Marilla gave a short sigh."
        - id: ch05-b07
          speaker: anne_shirley
          text: "Well, when I grow up, I will always speak to little girls as if they were grown up too. And I will never laugh when they use big words. I know from painful experience how much that hurts. After tea, Diana and I made taffy. It wasn't very good, probably because neither of us had made it before. Diana buttered the plates and left me to stir. I forgot what I was doing and burned it. Then we put it outside on the platform to cool, and the cat walked across one plate, so we had to throw that part away. But making it was splendid fun."
        - id: ch05-b08
          speaker: anne_shirley
          text: "When I left, Mrs. Barry invited me to visit as often as I could. Diana stood at the window and blew kisses until I reached Lover's Lane. Marilla, I truly feel like praying tonight. I'm going to make up a special brand-new prayer in honor of this wonderful day."
