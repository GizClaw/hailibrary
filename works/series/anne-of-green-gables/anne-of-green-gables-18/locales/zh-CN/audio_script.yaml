audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖机智，叙事细腻而自然
        timbre: 清澈柔和的成年女声
        pace: 从容，随情节轻快变化
        pitch: 中音
    anne:
      display_name: 安妮
      tts:
        delivery: 想象丰富，热烈真挚，情绪来得快而鲜明
        timbre: 清亮灵动的少女声
        pace: 偏快，动情时一气呵成
        pitch: 中高音
    diana:
      display_name: 戴安娜
      tts:
        delivery: 诚恳温柔，朴实中带着少女的羞怯
        timbre: 柔润甜美的少女声
        pace: 适中
        pitch: 中高音
    marilla:
      display_name: 玛丽拉
      tts:
        delivery: 务实克制，话语干脆，偶尔透出藏起的温情
        timbre: 稳重略低的成年女声
        pace: 稍慢而利落
        pitch: 中低音
    matthew:
      display_name: 马修
      tts:
        delivery: 温厚迟缓，说话犹豫而真诚
        timbre: 低沉柔和
        pace: 舒缓
        pitch: 中低音
    doctor:
      display_name: 医生
      tts:
        delivery: 沉着专业，判断明确，态度亲切
        timbre: 清晰稳健的成年男声
        pace: 中等
        pitch: 中低音
  chapters:
    - id: ch01
      title: 第十八章　安妮前来救急
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 世上的大事，总会和许多小事缠在一起。加拿大一位总理决定把爱德华王子岛列入政治巡回，看起来怎么也不会影响绿山墙小安妮·雪莉的命运。可事情偏偏就这样发生了。
        - id: ch01-b02
          speaker: narrator
          text: 那是一月。总理要在夏洛特敦规模盛大的万人大会上发表演说，拥护他的人自然要听，愿意到场的反对者也能来。埃文利人大多支持总理，大会那晚，村里几乎所有男人和不少女人都赶去了三十英里外的城里。雷切尔·林德太太虽然属于反对党，却是个热心到发烫的政治迷。她绝不相信少了自己，大会还能顺利开成，于是带上丈夫托马斯去照料马匹，又邀玛丽拉同行。玛丽拉暗地里也关心政治，想到自己也许再没机会亲眼看见一位活生生的总理，立刻答应了。她把绿山墙交给安妮和马修，要到第二天才回来。
        - id: ch01-b03
          speaker: narrator
          text: 玛丽拉和雷切尔太太在大会上尽兴时，安妮和马修独享着绿山墙温暖明亮的厨房。老式滑铁卢炉里火光正旺，蓝白色的霜花亮在窗玻璃上。马修坐在沙发上，手里摊着《农民之友》，困得直点头。安妮坐在桌边，带着一股悲壮的决心苦读功课，可目光总忍不住飘向时钟架。那里放着简·安德鲁斯当天刚借她的新书。简保证，那本书一定会带来数不清的惊险和刺激。安妮的手指都痒了，只想立刻伸过去拿书。可那样一来，明天在课堂上得胜的就是吉尔伯特·布莱思。她只好转过背去，努力假装那本书根本不在那里。
        - id: ch01-b04
          speaker: anne
          text: 马修，你上学时学过几何吗？
        - id: ch01-b05
          speaker: narrator
          text: 马修猛地从瞌睡里惊醒。
        - id: ch01-b06
          speaker: matthew
          text: 这个嘛，没有。我没学过。
        - id: ch01-b07
          speaker: anne
          text: 真希望你学过。这样你才能体谅我呀。没学过几何的人，根本没法真正体谅学几何的人。它让我的整个生活都蒙上了阴影。我实在太笨了，马修。
        - id: ch01-b08
          speaker: matthew
          text: 这个嘛，我可不这么看。你学什么都挺好的。上星期在卡莫迪的布莱尔商店里，菲利普斯先生还告诉我，你是全校最聪明的学生，正在飞快进步。“飞快进步”，这就是他的原话。有人说泰迪·菲利普斯不会教书，可我觉得他挺好。
        - id: ch01-b09
          speaker: narrator
          text: 谁肯夸安妮，马修都会觉得那个人挺好。
        - id: ch01-b10
          speaker: anne
          text: 要是菲利普斯先生不总把字母换掉，我一定能学得好些。我把命题全背熟了，他画到黑板上，却偏偏不用书里那些字母，害得我一下就糊涂了。老师这样占学生的便宜，不是太卑鄙了吗？我们还学了农业，我终于知道路为什么是红色的，心里可安慰了。不知道玛丽拉和林德太太玩得怎么样。林德太太说，照渥太华那些人的做法，加拿大早晚会完蛋，选民们可得把这当成一个可怕的警告。她还说，只要女人能投票，一切很快就会有可喜的变化。马修，你投哪个党？
        - id: ch01-b11
          speaker: matthew
          text: 我投保守党。
        - id: ch01-b12
          speaker: narrator
          text: 马修回答得毫不迟疑。支持保守党，是他信仰的一部分。
        - id: ch01-b13
          speaker: anne
          text: 那我也支持保守党。我真高兴，因为吉……因为学校里有几个男孩子是自由党人。我猜菲利普斯先生也是，因为普里西·安德鲁斯的父亲就是自由党人。鲁比·吉利斯说，男人追求姑娘时，宗教一定要赞同姑娘的母亲，政治一定要赞同姑娘的父亲。真是这样吗？
        - id: ch01-b14
          speaker: matthew
          text: 这个嘛，我可不知道。
        - id: ch01-b15
          speaker: anne
          text: 那你追求过姑娘吗，马修？
        - id: ch01-b16
          speaker: matthew
          text: 这个嘛，没有。我想我没追求过。
        - id: ch01-b17
          speaker: narrator
          text: 马修这一辈子，当然连这种念头也没有过。安妮用双手托住下巴，认真想了想。
        - id: ch01-b18
          speaker: anne
          text: 追求姑娘一定挺有意思的，对不对？鲁比说，她长大后要同时吊住好多追求者，让每个人都为她神魂颠倒。可那也太刺激了，我宁可只要一个头脑清醒的人。她有好几个大姐姐，所以特别懂这些事。林德太太说，吉利斯家的姑娘们就像刚出炉的热饼，一个接一个都叫人抢走了。菲利普斯先生几乎每天晚上都去看普里西，说是帮她温习。可米兰达·斯隆也在准备女王学院的考试，而且她比普里西笨多了，明明更需要辅导，菲利普斯先生却从来不去。这个世界上，我弄不明白的事实在太多了，马修。
        - id: ch01-b19
          speaker: matthew
          text: 这个嘛，我自己也没全弄明白。
        - id: ch01-b20
          speaker: anne
          text: 好吧，我得做完功课才行。在那以前，我绝不翻开简的新书。可它实在太诱人了。哪怕背对着它，我还是看得清清楚楚。简说，她读那本书哭得大病了一场。我最爱能把人读哭的书了。我还是把它锁进起居室的果酱柜，把钥匙交给你吧。功课没做完以前，你千万别还给我，就算我跪下来求你也不行。人人都说要抵抗诱惑，可要是根本拿不到钥匙，抵抗起来容易多了。然后我下地窖拿几个锈衣苹果，好不好？你也想吃一个吧？
        - id: ch01-b21
          speaker: matthew
          text: 这个嘛，我倒是想吃一个。
        - id: ch01-b22
          speaker: narrator
          text: 马修从来不吃锈衣苹果，只是知道安妮喜欢。安妮端着满满一盘苹果，得意地从地窖出来。外面结冰的木板路上突然响起急促的脚步，厨房门随即猛地打开。戴安娜·巴里冲进来，脸色煞白，喘得说不出话，头上胡乱裹着一条披肩。安妮吓得松了手。盘子、蜡烛和苹果一起滚下地窖梯子，乒乒乓乓响成一片。第二天，玛丽拉才在梯子底下找到它们，全陷在融化的蜡油里。她收拾时只庆幸一件事，那就是房子没有烧起来。
        - id: ch01-b23
          speaker: anne
          text: 戴安娜，到底怎么了？你母亲终于答应让我们来往了吗？
        - id: ch01-b24
          speaker: diana
          text: 安妮，快跟我走！米妮·梅病得很厉害，她得了哮吼。小玛丽·乔说……爸爸妈妈又进城了，家里没人能去请医生。米妮·梅越来越糟，小玛丽·乔根本不知道怎么办。安妮，我真的好怕！
          emotion: fearful
        - id: ch01-b25
          speaker: narrator
          text: 马修什么也没问。他拿起帽子和外套，从戴安娜身边走过，很快消失在黑暗的院子里。安妮也赶紧戴好风帽，穿上外套。
        - id: ch01-b26
          speaker: anne
          text: 他去套栗色母马了，要赶到卡莫迪请医生。他不必开口，我也完全知道。马修和我是灵魂相通的知己，不用说话，我就能明白他的心思。
        - id: ch01-b27
          speaker: diana
          text: 可他在卡莫迪也许找不到医生。布莱尔医生进城了，我想斯宾塞医生也去了。小玛丽·乔从没见过哮吼，林德太太又不在。安妮，我们怎么办？
          emotion: fearful
        - id: ch01-b28
          speaker: anne
          text: 别哭，戴。我清楚该怎么治哮吼。你忘了吗？哈蒙德太太生过三对双胞胎。照料过六个孩子，当然会积下许多经验，他们又常常得哮吼。等我拿上吐根酊，你们家未必有。好了，我们快走。
        - id: ch01-b29
          speaker: narrator
          text: 两个小姑娘手拉着手奔出去。林间近路的雪积得太深，已经没法走了。她们只好穿过恋人小径，再越过后面那片冻得硬邦邦的田野。安妮真心替米妮·梅担忧，可她也没有错过眼前情形里的浪漫。更甜蜜的是，经过这么久的疏远，她终于又能和知己一起经历这场浪漫了。
        - id: ch01-b30
          speaker: narrator
          text: 夜空清澈，寒意刺骨。阴影黑得像墨，雪坡却泛着银光。大星星照着寂静的田野，尖顶的冷杉东一棵、西一棵，黑沉沉地立着。枝头撒满雪粉，风穿过树间，吹出呼呼的哨音。安妮和知心朋友轻快地跑过这片神秘又美丽的天地，只觉得妙不可言。
        - id: ch01-b31
          speaker: narrator
          text: 三岁的米妮·梅果然病得很重。她发着烧，在厨房沙发上焦躁不安地翻动，嘶哑的呼吸声传遍了整座房子。小玛丽·乔是巴里太太出门前雇来照看孩子的法国姑娘，住在小溪那边，丰满结实，长着一张宽脸。此刻她既无助又茫然，完全想不出该做什么。即便真想到了办法，恐怕也没有能力去做。安妮却立刻动起手来，又熟练，又果断。
        - id: ch01-b32
          speaker: anne
          text: 米妮·梅确实得了哮吼。病得很重，不过我见过更严重的。我们先要准备很多热水。戴安娜，水壶里怎么连一杯水都没有？好了，我已经装满了。玛丽·乔，你往炉子里添木柴。我不想伤你的心，可你只要稍微有点想象力，早该想到这一点。现在我来给米妮·梅脱衣服，把她抱上床。戴安娜，你找几块柔软的法兰绒布。我先喂她一剂吐根酊。
        - id: ch01-b33
          speaker: narrator
          text: 米妮·梅一点也不肯喝吐根酊，可安妮毕竟没有白白带大三对双胞胎。药终究还是喂了下去。那个夜晚又漫长又叫人揪心，一剂药喂完，又喂下一剂。两个小姑娘守着正在受苦的米妮·梅，始终耐心照料她。小玛丽·乔也真心想尽一份力。她把炉火烧得轰轰作响，不停地热水，热出的水多得惊人。就算一家医院里全是得了哮吼的婴儿，恐怕也用不了那么多。
        - id: ch01-b34
          speaker: narrator
          text: 凌晨三点，马修终于带回一位医生。他一路赶到斯宾塞维尔，才找到了人。可最危险的关头已经过去，米妮·梅好了许多，正在沉睡。
        - id: ch01-b35
          speaker: anne
          text: 我差一点就要绝望了。她越来越严重，比哈蒙德家的双胞胎任何一回都病得厉害，连最小的那对也没这么糟。我真的以为她会噎死。瓶里的吐根酊全用完了，一滴也没剩。喂下最后一剂时，我只敢对自己说，不能告诉戴安娜和小玛丽·乔，她们已经够担心了。可我非说出来不可，不然心里受不了。我说：“这是迟迟不肯消逝的最后一线希望，可我恐怕，它终究只是妄想。”没想到三分钟左右，她就把痰咳出来，马上开始好转。医生，你只能自己想象我有多宽慰，因为那种感觉根本说不出来。有些事就是没法用语言表达，对吧？
        - id: ch01-b36
          speaker: doctor
          text: 是的，我知道。
        - id: ch01-b37
          speaker: narrator
          text: 医生点点头，望着安妮，仿佛也在想一些说不出口的事。可是后来见到巴里夫妇，他还是把那些想法说了出来。
        - id: ch01-b38
          speaker: doctor
          text: 卡斯伯特家那个红头发的小姑娘，真是机灵透了。是她救了这孩子的命。我赶到时再开始救治，早就迟了。她这么小，却有那样的本事，还那么沉着，简直叫人难以相信。她向我讲病情时的那双眼睛，我这辈子也没见过。
        - id: ch01-b39
          speaker: narrator
          text: 那个冬日的早晨奇妙极了，天地结满洁白的霜。安妮一夜没睡，眼皮沉得厉害，可她的嘴一点也不觉得累。跟马修回家时，他们先走过一片长长的白色田野，又穿过恋人小径。小径两旁的枫树挂满冰霜，在头顶连成一座闪闪发亮的仙境拱廊。安妮就这样一路说个不停。
        - id: ch01-b40
          speaker: anne
          text: 马修，这个早晨多美呀！整个世界好像是上帝刚刚想出来的，只为了让自己开心，你说是不是？那些树轻得仿佛我吹口气，就能把它们吹走。噗！我真高兴自己活在一个会结白霜的世界里。你也高兴吧？现在我也很庆幸哈蒙德太太生了三对双胞胎。要不然，我也许根本不知道怎么救米妮·梅。从前我因为她生双胞胎而生气，现在真后悔。可我实在太困了，今天不能去上学。我肯定睁不开眼睛，脑子也会变笨。可我又不愿意待在家里，因为吉……因为有些人会升到全班第一。掉下去容易，再爬上去可难了。不过事情越难，等你成功时就越满足，对不对？
        - id: ch01-b41
          speaker: narrator
          text: 马修看着她苍白的小脸，还有眼下深深的黑影。
        - id: ch01-b42
          speaker: matthew
          text: 这个嘛，我想你能应付得来。只管上床好好睡一觉，家里的杂活都由我来做。
        - id: ch01-b43
          speaker: narrator
          text: 安妮果真上床睡了。她睡得又久又沉，醒来走进厨房时，白里透红的冬日下午已经过去大半。玛丽拉早已回家，正坐在那里织东西。
        - id: ch01-b44
          speaker: anne
          text: 你见到总理了吗？玛丽拉，他长得什么样？
        - id: ch01-b45
          speaker: marilla
          text: 他可不是凭长相当上总理的。那个鼻子，真不知道是怎么长的！不过他的确会演说。我都为自己是保守党人感到骄傲了。雷切尔·林德是自由党人，当然觉得他一无是处。你的饭在烤箱里，自己到食品间拿些蓝李子酱。我看你饿坏了。马修已经告诉我昨夜的事。幸好你懂得该怎么办，我从没见过哮吼，要是我在那里，也想不出主意。好了，先别忙着说。等你吃完饭，肚子里那些话再倒出来也不迟。
        - id: ch01-b46
          speaker: narrator
          text: 玛丽拉还有一件重要的事想告诉安妮，却没有立刻开口。她很清楚，只要这个消息一说出来，安妮就会兴奋得整个人飘起来，彻底离开食欲和正餐这些实际琐事能够到达的地方。于是她耐心等着。直到安妮把那一小碟蓝李子全吃完，她才终于开口。
        - id: ch01-b47
          speaker: marilla
          text: 巴里太太下午来过。她想见你，我没叫醒你。她说是你救了米妮·梅，也很后悔为了红醋栗酒那件事那样对你。现在她明白了，你不是故意把戴安娜灌醉的。她希望你原谅她，也愿意让你和戴安娜重新做好朋友。你想去的话，今晚就能过去。戴安娜昨夜着凉，得了重感冒，不能出门。安妮·雪莉，看在老天的分上，你可别飞到天上去。
        - id: ch01-b48
          speaker: narrator
          text: 这句警告并不多余。安妮猛地跳起来，整个人都像要飘到空中，心里的火焰照亮了她的脸。
        - id: ch01-b49
          speaker: anne
          text: 玛丽拉，我能现在就去吗？碗可以先不洗吗？我回来一定洗，可在这么激动人心的时刻，我实在不能把自己拴在洗碗这种一点也不浪漫的事情上。
          emotion: happy
        - id: ch01-b50
          speaker: marilla
          text: 行了，快去吧。安妮·雪莉，你疯了吗？马上回来穿件衣服！算了，我还不如喊风回来。她连帽子和外套都没穿。瞧她冲过果园，头发全飘在后面。要是没冻出一场要命的病，那才算老天保佑。
        - id: ch01-b51
          speaker: narrator
          text: 紫色的冬日暮光里，安妮踏过一处又一处积雪，舞蹈似的回来了。遥远的西南方，天空铺着淡金色和空灵的玫瑰色。下方是一片片发亮的白色雪地，中间夹着幽暗的云杉谷。一颗黄昏之星在那里闪耀，光辉灿烂得像珍珠。雪丘之间响起一串串雪橇铃，清脆的声音穿过寒冷空气，仿佛小精灵敲响的钟。可那音乐再甜美，也比不过安妮心里和唇边的歌。
        - id: ch01-b52
          speaker: anne
          text: 玛丽拉，现在站在你面前的，是一个完完全全幸福的人。我幸福极了，对，哪怕我的头发还是红的。这会儿，我的灵魂已经不在乎红头发了。巴里太太亲了我，还哭着说她太对不起我，永远也报答不了我。我窘迫极了，只好尽量客气地回答：“巴里太太，我一点也不怨恨您。我郑重保证，我绝不是故意让戴安娜喝醉的。从今以后，我会用遗忘的斗篷盖住过去。”这番话说得很有尊严，是不是？
          emotion: happy
        - id: ch01-b53
          speaker: anne
          text: 我觉得自己简直是在把炭火堆到巴里太太头上。后来我和戴安娜度过了一个美妙的下午。她教我一种新奇又漂亮的钩针织法，是卡莫迪的姨妈教她的。整个埃文利只有我们两个人会。我们还郑重发誓，绝不告诉别人。戴安娜又送给我一张漂亮的卡片，上面画着玫瑰花环，还写着诗：“若你爱我，正如我爱你，唯有死亡能将你我分离。”
        - id: ch01-b54
          speaker: anne
          text: 这首诗写得千真万确。我们要请菲利普斯先生准许我们重新坐在一起，让格蒂·派伊去跟米妮·安德鲁斯同桌。我们还吃了一顿特别雅致的茶点。巴里太太把家里最好的瓷器拿出来，真的把我当客人一样招待。那感觉叫我激动得说不出来。以前从没有人为了我，特意用家里最好的瓷器。桌上有水果蛋糕、磅蛋糕、炸面圈和两种果酱。巴里太太还问我喝不喝茶，又对巴里先生说：“孩子他爸，怎么不把饼干递给安妮？”只是被人当成大人，感觉就这么美好。真正长大以后，一定更幸福吧？
        - id: ch01-b55
          speaker: marilla
          text: 那可不一定。
        - id: ch01-b56
          speaker: narrator
          text: 玛丽拉轻轻叹了一口气。
        - id: ch01-b57
          speaker: anne
          text: 不管怎样，等我长大了，一定会把小姑娘也当大人那样交谈。她们用了大词，我绝不会笑。从我那些难过的经历来看，那真的很伤人。吃过茶点，我和戴安娜做了太妃糖。做得不大好，大概因为我们谁也没做过。她去给盘子涂黄油，叫我搅糖。我一转眼忘了，糖就烧焦了。我们又把糖放到门廊上晾凉，一只猫从其中一个盘子上踩过去，那一盘只好扔掉。不过做糖本身有趣极了。回家时，巴里太太叫我以后有空就去玩。戴安娜站在窗口，不停朝我飞吻，一直送我走到恋人小径。玛丽拉，我向你保证，今晚我真想祷告。为了纪念今天，我要想一篇崭新的、特别的祷词。
          emotion: happy
