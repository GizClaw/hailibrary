audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖机智，叙事细腻而自然
        timbre: 清澈柔和的成年女声
        pace: 从容，随情节轻快变化
        pitch: 中音
    anne:
      display_name: 安妮
      tts:
        delivery: 想象丰富，热烈真挚，情绪来得快而鲜明
        timbre: 清亮灵动的少女声
        pace: 偏快，动情时一气呵成
        pitch: 中高音
    marilla:
      display_name: 玛丽拉
      tts:
        delivery: 务实克制，话语干脆，偶尔透出藏起的温情
        timbre: 稳重略低的成年女声
        pace: 稍慢而利落
        pitch: 中低音
    matthew:
      display_name: 马修
      tts:
        delivery: 腼腆温厚，说话简短而真诚
        timbre: 低沉柔和的成年男声
        pace: 缓慢而略有停顿
        pitch: 低音
  chapters:
    - id: ch01
      title: 第二十四章　斯泰西小姐和学生们筹办音乐会
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 安妮终于能回学校了，这时十月又来到埃文利。这个十月满是红色和金色。温润的清晨，淡雾铺满山谷，紫的、白的、银的、粉的、烟蓝的，好像秋之精灵刚把它们倒进去，等着太阳慢慢吸干。露水很重，田野像银布一样闪光。多干的树林里，洼地堆满落叶，一脚踩下去，便响起清脆的沙沙声。白桦小径顶上罩着黄叶，路边的蕨草已经枯成褐色。
        - id: ch01-b02
          speaker: narrator
          text: 空气清冽爽快，小姑娘们也受了鼓舞，一个个轻快又情愿地赶去学校，半点不像蜗牛。安妮重新坐到戴安娜身边的小棕书桌旁，心里别提多快活了。鲁比·吉利斯隔着过道朝她点头，卡丽·斯隆从前面传字条，朱莉娅·贝尔从后排递来一块口香糖。她削好铅笔，把图画卡片摆进书桌，幸福地深吸一口气。生活真是有意思极了。
        - id: ch01-b03
          speaker: narrator
          text: 新老师斯泰西小姐，也成了安妮真诚而有益的朋友。她聪慧开朗，又很体贴，既能得到学生的喜爱，也能把他们心智和品性里最好的一面带出来。安妮在她的影响下，就像一朵花舒展开来。每天回家，她都要把学校里的功课和志向讲给马修与玛丽拉听。马修听得满心赞赏，玛丽拉却总要挑剔几句。
        - id: ch01-b04
          speaker: anne
          text: 玛丽拉，我真是全心全意地爱斯泰西小姐。她那么有淑女风范，声音又甜美。每次她叫我的名字，我立刻就能感觉到，她心里拼的肯定是带E的Anne。今天下午我们表演背诵了。你要是能来听我背《苏格兰女王玛丽》就好了！我把整个灵魂都放进去了。回家路上，鲁比说，我念到“如今奔向父亲怀抱，我的女儿心就此别了”那一句时，她浑身的血都凉了。
          emotion: happy
        - id: ch01-b05
          speaker: matthew
          text: 嗯，改天你到谷仓里，也给我背一遍吧。
        - id: ch01-b06
          speaker: anne
          text: 我当然愿意。不过在谷仓里，肯定没有在学校背得好。全校的人都坐在面前，屏住呼吸，等着听你的每一个字，那才激动呢。我想，我一定没法让你的血也凉下来。
        - id: ch01-b07
          speaker: marilla
          text: 林德太太倒是说，上星期五看见男孩子们爬到贝尔山的大树顶上掏乌鸦窝，她的血都凉了。斯泰西小姐还鼓励他们这么干，我真不知道她是怎么想的。
        - id: ch01-b08
          speaker: anne
          text: 可我们研究自然，需要一个乌鸦窝呀。那天是野外日。玛丽拉，野外日棒极了，斯泰西小姐什么都讲得特别明白。每次我们还要写作文，而且我的作文写得最好。
        - id: ch01-b09
          speaker: marilla
          text: 自己说这种话，也太自负了。还是让老师来夸你吧。
        - id: ch01-b10
          speaker: anne
          text: 可那本来就是老师说的呀，玛丽拉。我一点也不自负。我的几何那么差，哪还能自负？不过我现在也渐渐看懂一点了，斯泰西小姐讲得真清楚。可我永远不会擅长几何，这么一想，人自然就谦逊了。
        - id: ch01-b11
          speaker: anne
          text: 我最喜欢写作文。平常我们可以自己选题，下星期却要写一位非凡人物。世上的非凡人物那么多，实在很难选。一个人如果非常了不起，死后还有别人写文章谈论他，那该多美妙！我也真想成为那样的人。
        - id: ch01-b12
          speaker: anne
          text: 等我长大，也许会当一名受过专门训练的护士，跟着红十字会去战场，做一位仁慈的使者。当然，我也可能去国外传教。那一定很浪漫，可传教士得非常善良，这一点恐怕会拦住我。对了，我们每天还做体操呢。体操能让姿态更优美，也能帮助消化。
        - id: ch01-b13
          speaker: marilla
          text: 帮助什么鬼！
        - id: ch01-b14
          speaker: narrator
          text: 玛丽拉真心认为这些全是胡闹。可到了十一月，斯泰西小姐提出一个新计划，野外日、背诵表演和那些扭来扭去的体操，立刻全被比了下去。她要埃文利学校的学生筹办一场音乐会，在圣诞节晚上到礼堂演出，筹些钱为学校买一面旗子。这个目的很可嘉，学生们也个个赞成，节目马上开始准备。
        - id: ch01-b15
          speaker: narrator
          text: 所有准演员都兴奋得不得了，其中又数安妮·雪莉最兴奋。虽然玛丽拉不赞成，她还是把整颗心都扑了进去。在玛丽拉看来，这件事彻头彻尾都是蠢事。
        - id: ch01-b16
          speaker: marilla
          text: 这只会把胡闹塞进你们脑袋，还占掉本来该念书的时间。我不赞成孩子办音乐会，更不赞成你们为了排练到处跑。弄到最后，一个个都变得虚荣又冒失，只知道往外跑。
        - id: ch01-b17
          speaker: anne
          text: 可我们的目的很高尚呀，玛丽拉。一面旗子能培养大家的爱国精神。
        - id: ch01-b18
          speaker: marilla
          text: 胡扯！你们哪想过多少爱国。说到底，不过是想痛痛快快玩一场。
        - id: ch01-b19
          speaker: anne
          text: 既能爱国又能玩得开心，不是更好吗？筹办音乐会真的很有意思。我们要唱六首合唱曲，戴安娜会独唱。我参加两出对白表演，一出是《制止闲话协会》，一出是《仙后》。男孩子也有一出对白。我还得背诵两篇作品呢。一想到这儿我就发抖，可那种抖很愉快，让人心里怦怦直跳。
          emotion: happy
        - id: ch01-b20
          speaker: anne
          text: 最后还有《信仰、希望与慈爱》的造型表演。戴安娜、鲁比和我都会披着白衣，垂下长发。我扮演希望，要把手这样合起来，再抬眼向上望。背诵得去阁楼里练。你听见我呻吟可别害怕，其中一篇要求我呻吟得肝肠寸断。要发出真正有艺术水准的呻吟，可难了。
        - id: ch01-b21
          speaker: anne
          text: 乔西·派没拿到想要的角色，正生闷气。她居然想演仙后！哪有仙后像她那么胖？仙后当然得苗条。简·安德鲁斯演女王，我是她的伴娘之一。乔西说，红头发的仙女跟胖仙女一样荒唐，不过我才不让自己在意她的话。
        - id: ch01-b22
          speaker: anne
          text: 我会在头发上戴一圈白玫瑰，鲁比把她的舞鞋借给我，因为我自己没有。仙女当然要穿舞鞋。谁能想象仙女穿着靴子，尤其是包铜鞋头的靴子呢？我们还要拿匍匐生长的云杉枝装饰礼堂，用冷杉枝拼出格言，再点缀粉红色的薄纸玫瑰。
        - id: ch01-b23
          speaker: anne
          text: 等观众都坐好了，我们两人一排走进礼堂，艾玛·怀特会在风琴上弹进行曲。哦，玛丽拉，我知道你不像我这么热心，可你总该希望你的小安妮大放光彩吧？
        - id: ch01-b24
          speaker: marilla
          text: 我只希望你规规矩矩的。等这场忙乱结束，你终于肯收心，我就谢天谢地了。你现在满脑子都是对白、呻吟和造型表演，什么用也没有。你那条舌头说了这么多话，居然还没彻底说坏，简直是奇迹。
        - id: ch01-b25
          speaker: narrator
          text: 安妮叹了一口气，转身去了后院。西边的天空是苹果绿色，一弯新月透过光秃秃的白杨枝，把清辉洒下来。马修正在院里劈柴。安妮在木墩上坐好，把音乐会的事全讲给他听。至少这一次，她知道眼前这位听众一定懂得欣赏，也一定会体谅她。
        - id: ch01-b26
          speaker: matthew
          text: 嗯，我看这场音乐会准会很不错。你也一定能把自己的节目演好。
        - id: ch01-b27
          speaker: narrator
          text: 马修低头看着安妮热切又活泼的小脸，朝她微笑，安妮也笑着望向他。他们俩是最要好的朋友。马修常常暗自庆幸，管教安妮完全是玛丽拉的责任，用不着他操心。要是这份责任落在自己身上，他准会不断发愁，不知道该顺着心意，还是该尽所谓的责任。
        - id: ch01-b28
          speaker: narrator
          text: 现在可好，他想怎么“宠坏安妮”都行。这是玛丽拉的说法。不过，这样的安排也没有多坏。有时，一点真心的赏识带给人的好处，并不比世上所有认真尽责的管教少。
