  chapters:
    - id: ch01
      title: Miss Stacy and Her Pupils Get Up a Concert
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: "By the time Anne was ready to return to school, October had come again. It was a glorious month, red and gold. The mornings were mellow, and soft mist filled the valleys in shades of amethyst, pearl, silver, rose, and smoky blue, as though autumn had poured it there for the sun to drink away. Heavy dew made the fields shine like silver cloth. Dry leaves lay in great heaps in the hollows among the many-stemmed trees, ready to crunch under running feet. The Birch Path had a roof of yellow leaves, with brown, withered ferns along the sides."
        - id: ch01-b02
          speaker: narrator
          text: "There was such a sharp, fresh tang in the air that the girls hurried cheerfully to school, moving as quickly and willingly as no snails ever did. Anne was delighted to sit at her little brown desk beside Diana again. Ruby Gillis nodded from across the aisle. Carrie Sloane passed notes up the room, and Julia Bell sent a piece of chewing gum forward from the back seat. Anne sharpened her pencil, arranged her picture cards in her desk, and drew a long, happy breath. Life was certainly very interesting."
        - id: ch01-b03
          speaker: narrator
          text: "In Miss Stacy, the new teacher, Anne found another true and helpful friend. Miss Stacy was young, bright, and understanding. She had the happy gift of winning her pupils' affection and keeping it. She also knew how to bring out the best in their minds and characters. Under her wholesome influence, Anne opened like a flower. At home, she gave admiring Matthew and critical Marilla glowing reports about every lesson, every goal, and all the work they did at school."
        - id: ch01-b04
          speaker: anne_shirley
          text: "I love Miss Stacy with my whole heart, Marilla. She's so ladylike, and her voice is lovely. When she says my name, I just know she's spelling Anne with an E. We had recitations today. I wish you could've heard me perform 'Mary, Queen of Scots.' I put my whole soul into it. On the way home, Ruby said the way I spoke the line about my father's arm and bidding my woman's heart farewell made her blood run cold."
        - id: ch01-b05
          speaker: matthew_cuthbert
          text: "Well now, maybe you could perform it for me in the barn one day."
        - id: ch01-b06
          speaker: anne_shirley
          text: "Of course I will. But I know I won't do it as well. It's much more exciting when a whole school is listening to every word. I don't think I could make your blood run cold."
        - id: ch01-b07
          speaker: marilla_cuthbert
          text: "Mrs. Lynde said her blood ran cold last Friday when she saw the boys climbing to the tops of those big trees on Bell's hill for crow nests. I can't understand Miss Stacy encouraging that."
        - id: ch01-b08
          speaker: anne_shirley
          text: "But we needed a crow's nest for nature study. It happened on our field afternoon. Those afternoons are wonderful, Marilla, and Miss Stacy explains everything so well. We have to write compositions about them, and mine are the best."
        - id: ch01-b09
          speaker: marilla_cuthbert
          text: "Then you're being very vain by saying it yourself. Let your teacher say it."
        - id: ch01-b10
          speaker: anne_shirley
          text: "But she did say it, Marilla. And truly, I'm not vain. How could I be when I'm such a dunce at geometry? I am starting to understand it a little because Miss Stacy makes it so clear. Still, I'll never be good at it, and that keeps me humble."
        - id: ch01-b11
          speaker: anne_shirley
          text: "I do love writing compositions. Usually we choose our own subjects, but next week we have to write about a remarkable person. How can anyone choose when so many remarkable people have lived? Imagine being remarkable enough for people to write compositions about you after you're dead. I'd dearly love that."
        - id: ch01-b12
          speaker: anne_shirley
          text: "When I grow up, perhaps I'll become a trained nurse and go with the Red Cross to a battlefield as a messenger of mercy. Unless I become a foreign missionary instead. That would be very romantic, but missionaries have to be very good, and that could be a problem. We do physical culture exercises every day too. They're supposed to make you graceful and help your digestion."
        - id: ch01-b13
          speaker: marilla_cuthbert
          text: "Help your digestion, fiddlesticks!"
        - id: ch01-b14
          speaker: narrator
          text: "Marilla honestly thought it was all nonsense."
        - id: ch01-b15
          speaker: narrator
          text: "Then November came, and Miss Stacy proposed something so exciting that field afternoons, recitation Fridays, and physical culture exercises all seemed dull beside it. The Avonlea pupils would put on a concert in the hall on Christmas night. The money would help pay for a flag for the schoolhouse. Every pupil welcomed the idea, and preparations began at once. No future performer was more excited than Anne. She gave the concert her whole heart, even though Marilla disapproved of everything about it."
        - id: ch01-b16
          speaker: marilla_cuthbert
          text: "It's putting nonsense in your heads and taking time away from your lessons. I don't approve of children giving concerts and running off to rehearsals. It makes them vain and bold, and teaches them to gad about."
        - id: ch01-b17
          speaker: anne_shirley
          text: "But it's for such a worthy purpose. A school flag will encourage patriotism, Marilla."
        - id: ch01-b18
          speaker: marilla_cuthbert
          text: "Nonsense. Patriotism is the last thing any of you are thinking about. You only want to enjoy yourselves."
        - id: ch01-b19
          speaker: anne_shirley
          text: "Well, isn't it all right to enjoy yourself while being patriotic? It really is lovely, planning a concert. We're doing six choruses, and Diana has a solo. I'm in two dialogues, 'The Society for the Suppression of Gossip' and 'The Fairy Queen.' The boys have a dialogue too, and I have two recitations. Just thinking about them makes me tremble, but it's the pleasant, thrilling kind of trembling."
        - id: ch01-b20
          speaker: anne_shirley
          text: "At the very end, we're making a tableau called 'Faith, Hope and Charity.' Diana, Ruby, and I will wear white draperies with our hair flowing down. I'm Hope. I'll clasp my hands like this and lift my eyes."
        - id: ch01-b21
          speaker: anne_shirley
          text: "I'm going to rehearse my recitations in the attic, so don't worry if you hear groaning. One of them needs a heartbreaking groan, and making a truly artistic groan is very difficult."
        - id: ch01-b22
          speaker: anne_shirley
          text: "Josie Pye is sulking because she didn't get the role she wanted. She wanted to play the fairy queen. That would've been ridiculous. Whoever heard of a fairy queen as fat as Josie? Fairy queens have to be slender. Jane Andrews is the queen, and I'm one of her maids of honor."
        - id: ch01-b23
          speaker: anne_shirley
          text: "Josie says a red-haired fairy is just as ridiculous as a fat one, but I won't let what she says bother me. I'll wear white roses in my hair, and Ruby Gillis is lending me her slippers because I don't own any. Fairies need slippers, you know. Can you picture one in boots, especially boots with copper toes?"
        - id: ch01-b24
          speaker: anne_shirley
          text: "We'll decorate the hall with trailing spruce and words made from fir, with pink tissue-paper roses tucked into them. After the audience sits down, we'll all march in two by two while Emma White plays a march on the organ. Oh, Marilla, I know you aren't as excited as I am. But don't you hope your little Anne does something wonderful?"
        - id: ch01-b25
          speaker: marilla_cuthbert
          text: "I only hope you'll behave yourself. I'll be very glad when this fuss is finished and you can settle down again. You're no good for anything now, with your head full of dialogues, groans, and tableaux. I'm amazed your tongue isn't completely worn out."
        - id: ch01-b26
          speaker: narrator
          text: "Anne sighed and went into the backyard. A young new moon shone through the bare poplar branches, set against an apple-green western sky. Matthew was splitting wood. Anne settled on a chopping block and told him all about the concert, certain that this time she had found a listener who would understand and approve."
        - id: ch01-b27
          speaker: matthew_cuthbert
          text: "Well now, I reckon it'll be a fine concert. And I expect you'll do your part just right."
        - id: ch01-b28
          speaker: narrator
          text: "Matthew smiled at Anne's bright, eager little face, and she smiled back. They were the best of friends. Many times, Matthew thanked his lucky stars that raising Anne was Marilla's duty alone. If it had been his responsibility, he would often have worried about choosing between what he wanted to do and what duty required. As things stood, he was free to spoil Anne as much as he pleased, as Marilla called it. And perhaps that arrangement was not so bad. Sometimes a little appreciation can do as much good as all the careful upbringing in the world."
