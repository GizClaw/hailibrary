  chapters:
    - id: ch01
      title: An Empty Kitchen
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: "One evening in late April, Marilla walked home from an Aid meeting and knew at last that winter was gone. Spring can lift even the oldest and saddest heart, though Marilla was not one to examine her feelings. She probably thought her mind was busy with the Aid, its missionary box, and the new carpet for the vestry room. Beneath those thoughts, though, she felt the whole countryside waking. Red fields smoked into pale purple mist under the sinking sun. Long, pointed fir shadows crossed the meadow beyond the brook. Crimson buds showed on the still maples beside a pool smooth as a mirror. Hidden life stirred under the gray earth, and the deep gladness of spring made Marilla's sober steps quicker and lighter."
        - id: ch01-b02
          speaker: narrator
          text: "She looked fondly at Green Gables through its web of trees. The windows caught the sun and flashed it back in little sparks. As she picked her way along the damp lane, she thought how satisfying it was to be going home to a brisk wood fire and a tea table neatly set. Before Anne came, Aid meeting evenings had ended in a cold, cheerless house."
        - id: ch01-b03
          speaker: narrator
          text: "So when Marilla entered the kitchen and found the fire completely out, with Anne nowhere in sight, she was both disappointed and annoyed. There wasn't even a sign that Anne had begun the meal. Anne had been told to have tea ready at five. Now Marilla had to hurry out of her second-best dress and make the meal before Matthew came in from plowing. She attacked the kindling with a carving knife and far more force than the job required. Matthew arrived and waited patiently in his corner for tea."
        - id: ch01-b04
          speaker: marilla_cuthbert
          text: "I'll deal with Miss Anne when she gets home. She's probably roaming around with Diana, writing stories or practicing some foolish dialogue, without one thought for the time or her chores. This has to stop, and stop quickly. I don't care if Mrs. Allan says she's the brightest, sweetest child she ever knew. Anne may be bright and sweet, but her head is packed with nonsense. The moment she outgrows one strange idea, another takes its place."
          emotion: angry
        - id: ch01-b05
          speaker: marilla_cuthbert
          text: "Listen to me. I'm saying exactly what made me so angry with Rachel Lynde at the Aid today. I was glad Mrs. Allan defended Anne. If she hadn't, I'd have said something much too sharp to Rachel in front of everyone. Anne has plenty of faults, and I won't deny them, but I'm raising her. Rachel isn't. Rachel would find fault with the Angel Gabriel himself if he lived in Avonlea."
        - id: ch01-b06
          speaker: marilla_cuthbert
          text: "Even so, Anne had no right to leave when I told her to stay home and mind the house. For all her faults, she's never been disobedient or untrustworthy before. I'm truly sorry if she has become so now."
        - id: ch01-b07
          speaker: narrator
          text: "Matthew was patient, sensible, and, most of all, hungry. Experience had taught him that Marilla finished her work faster if nobody interrupted while she talked out her anger. Still, he finally spoke."
        - id: ch01-b08
          speaker: matthew_cuthbert
          text: "Well now, I don't know. Maybe you're judging her too quickly, Marilla. Don't call Anne untrustworthy until you're certain she disobeyed. There may be an explanation. Anne's always been mighty good at explaining things."
        - id: ch01-b09
          speaker: marilla_cuthbert
          text: "She isn't here, and I told her to stay. She'll have a hard time explaining that well enough for me. Of course you'd defend her, Matthew. But I'm the one raising her, not you."
        - id: ch01-b10
          speaker: narrator
          text: "Darkness fell before supper was ready. Still Anne did not hurry over the log bridge or up Lover's Lane, breathless and sorry for neglecting her work. Marilla grimly washed the dishes and put them away. Then she needed a candle for the cellar, so she went up to the east gable to borrow the one usually kept on Anne's table. She lit it, turned around, and saw Anne lying facedown on the bed with her face buried in the pillows."
        - id: ch01-b11
          speaker: marilla_cuthbert
          text: "Mercy on us! Anne, have you been asleep?"
          emotion: surprised
        - id: ch01-b12
          speaker: anne_shirley
          text: "No."
        - id: ch01-b13
          speaker: narrator
          text: "The answer came muffled through the pillows. Marilla hurried over to the bed, suddenly anxious."
        - id: ch01-b14
          speaker: marilla_cuthbert
          text: "Then are you sick?"
        - id: ch01-b15
          speaker: narrator
          text: "Anne shrank deeper into the pillows as if she wanted to hide from every human eye forever."
        - id: ch01-b16
          speaker: anne_shirley
          text: "No. But please go away, Marilla, and don't look at me. I'm in the depths of despair. I don't care anymore who comes first in class, who writes the best composition, or who sings in the Sunday school choir. Those things don't matter now. I don't think I'll ever be able to go anywhere again. My whole career is over. Please go away, and don't look at me."
          emotion: sad
        - id: ch01-b17
          speaker: marilla_cuthbert
          text: "Well, did anyone ever hear such a thing? Anne Shirley, what in the world is wrong? What have you done? Get up this minute and tell me. This minute, I said. There now. What is it?"
        - id: ch01-b18
          speaker: narrator
          text: "In miserable obedience, Anne slid down to the floor."
        - id: ch01-b19
          speaker: anne_shirley
          text: "Look at my hair, Marilla."
          emotion: sad
        - id: ch01-b20
          speaker: narrator
          text: "Marilla raised the candle and carefully studied the heavy masses of hair falling down Anne's back. Something about it was very strange indeed."
        - id: ch01-b21
          speaker: marilla_cuthbert
          text: "Anne Shirley, what have you done to your hair? Why, it's green!"
          emotion: surprised
        - id: ch01-b22
          speaker: narrator
          text: "Green was the nearest name for it, if that color belonged anywhere on earth. It was a dull, bronzy green, made more dreadful by streaks of the old red showing through. Marilla had never seen anything so grotesque."
        - id: ch01-b23
          speaker: anne_shirley
          text: "Yes, it's green. I used to think nothing could be worse than red hair. Now I know green hair is ten times worse. Oh, Marilla, you can't imagine how completely miserable I am."
          emotion: sad
        - id: ch01-b24
          speaker: marilla_cuthbert
          text: "I can't imagine how you got yourself into this mess, but I intend to find out. Come down to the kitchen. It's too cold up here. Then tell me exactly what you did. I knew something strange was coming. You haven't been in a scrape for more than two months, so another one was bound to arrive. Now, what did you do to your hair?"
    - id: ch02
      title: The Peddler's Promise
      blocks:
        - id: ch02-b01
          speaker: anne_shirley
          text: "I dyed it."
        - id: ch02-b02
          speaker: marilla_cuthbert
          text: "Dyed it? You dyed your hair? Anne Shirley, didn't you know that was wicked?"
          emotion: surprised
        - id: ch02-b03
          speaker: anne_shirley
          text: "I knew it was a little wicked. But I thought a little wickedness would be worth it if I could get rid of red hair. I counted the cost, Marilla. And I planned to be extra good in other ways to make up for it."
        - id: ch02-b04
          speaker: marilla_cuthbert
          text: "Well, if I'd decided hair dye was worth the wickedness, I would at least have chosen a respectable color. I certainly wouldn't have made my hair green."
        - id: ch02-b05
          speaker: anne_shirley
          text: "But I never meant it to be green! If I was going to be wicked, I meant to get something from it. He promised it would make my hair a beautiful raven black. He was absolutely certain. How could I doubt him? I know how it hurts when people doubt your word. Mrs. Allan says we should never suspect someone of lying unless we have proof. I have proof now. Green hair is enough proof for anyone. But I didn't have it then, so I believed every single word."
        - id: ch02-b06
          speaker: marilla_cuthbert
          text: "Who promised you? Who are you talking about?"
        - id: ch02-b07
          speaker: anne_shirley
          text: "The peddler who came this afternoon. I bought the dye from him."
        - id: ch02-b08
          speaker: marilla_cuthbert
          text: "Anne Shirley, how many times have I told you not to let one of those Italian peddlers into the house? I don't believe in encouraging them to come around at all."
        - id: ch02-b09
          speaker: anne_shirley
          text: "I didn't let him inside. I remembered what you said. I went out, shut the door carefully, and looked through his things on the step. And he wasn't Italian. He was a German Jew. He had a huge box of fascinating things. He said he was working hard to earn enough money to bring his wife and children over from Germany. He spoke about them with such feeling that it touched my heart. I wanted to buy something and help such a worthy cause."
        - id: ch02-b10
          speaker: anne_shirley
          text: "Then I suddenly noticed the hair dye. The peddler guaranteed it would turn any hair a lovely raven black and never wash out. In one instant, I pictured myself with beautiful black hair. I couldn't resist. The bottle cost seventy-five cents, and I had only fifty cents left from my chicken money. But I think he had a very kind heart. He said he'd let me have it for fifty cents because it was me, and at that price he was almost giving it away."
        - id: ch02-b11
          speaker: anne_shirley
          text: "So I bought it. As soon as he left, I came up here and put it on with an old hairbrush, just as the directions said. I used every drop. Oh, Marilla, when I saw the horrible color, I was sorry I'd been wicked. I've been sorry every moment since."
          emotion: sad
        - id: ch02-b12
          speaker: marilla_cuthbert
          text: "I hope your repentance does some good. Perhaps now you can see where vanity has led you. Goodness knows how we'll fix this. First, you'd better wash your hair thoroughly and see whether that helps."
        - id: ch02-b13
          speaker: narrator
          text: "Anne scrubbed her hair hard with soap and water. She washed and rinsed it with all the force she could manage. It did no more good than if she'd been trying to scrub away its original red. The peddler had told the truth about one thing. His dye would not wash out, whatever else he had lied about."
        - id: ch02-b14
          speaker: anne_shirley
          text: "Oh, Marilla, what can I do? I'll never live this down. People had almost forgotten my other mistakes. They hardly remember the liniment cake, getting Diana drunk, or losing my temper with Mrs. Lynde. But no one will forget this. Everyone will think I'm not respectable. Oh, Marilla, 'what a tangled web we weave when first we practice to deceive.' It's poetry, but it's true. And Josie Pye will laugh so hard! I cannot face Josie Pye. I am the unhappiest girl on Prince Edward Island."
          emotion: sad
        - id: ch02-b15
          speaker: narrator
          text: "Anne remained unhappy for an entire week. She went nowhere and washed her hair every day. Outside Green Gables, only Diana knew the terrible secret. Diana solemnly promised never to tell, and she kept that promise."
    - id: ch03
      title: The Only Way
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: "At the end of the week, Marilla gave her decision."
        - id: ch03-b02
          speaker: marilla_cuthbert
          text: "There's no use washing it again, Anne. If ever there was a dye that stayed put, this is it. We'll have to cut your hair off. There is no other choice. You can't go outside looking as you do now."
        - id: ch03-b03
          speaker: narrator
          text: "Anne's lips trembled, but she knew Marilla had spoken the bitter truth. With a gloomy sigh, she went to fetch the scissors."
        - id: ch03-b04
          speaker: anne_shirley
          text: "Please cut it all off right away, Marilla, so it will be over. Oh, my heart feels broken. This is such an unromantic kind of suffering. Girls in books lose their hair after a fever, or they sell it to raise money for some noble deed. I don't think I'd mind nearly as much if I lost mine in a way like that. But there's nothing comforting about having it cut off because you dyed it a dreadful color. Is there?"
          emotion: sad
        - id: ch03-b05
          speaker: anne_shirley
          text: "I plan to cry the whole time you're cutting, as long as it doesn't get in your way. It all seems so tragic."
          emotion: sad
        - id: ch03-b06
          speaker: narrator
          text: "Anne did cry while Marilla cut, just as she had promised. Later, she went upstairs and faced the looking glass with a quiet, hopeless feeling. Marilla had done the job thoroughly. Every trace of the green had to go, so she'd cropped Anne's hair as close as she could. The result was not becoming, to put it kindly. Anne turned the glass straight toward the wall."
        - id: ch03-b07
          speaker: anne_shirley
          text: "I will never, ever look at myself again until my hair grows back!"
          emotion: angry
        - id: ch03-b08
          speaker: narrator
          text: "Then, all at once, she turned the glass around again."
        - id: ch03-b09
          speaker: anne_shirley
          text: "Yes, I will look. That can be my penance for doing wrong. Every time I come into my room, I'll look at myself and see how ugly I am. I won't imagine the ugliness away, either. I never thought I could be vain about my hair, especially when it was red. But now I know I was. It was long and thick and curly, and I cared about that. I suppose something dreadful will happen to my nose next."
    - id: ch04
      title: A Scarecrow and a Snood
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: "Anne's cropped head caused a sensation at school the following Monday. Everyone noticed it. To her relief, though, no one guessed the real reason it had been cut. Even Josie Pye failed to discover the truth, though she made sure to tell Anne that she looked exactly like a scarecrow. That evening, Anne told Marilla all about it. Marilla was lying on the sofa after one of her headaches."
        - id: ch04-b02
          speaker: anne_shirley
          text: "I didn't answer when Josie called me a scarecrow. I decided her insult was part of my punishment, so I ought to endure it patiently. It is hard when someone tells you that you look like a scarecrow. I very much wanted to say something sharp in return. But I didn't. I only gave her one scornful look, and then I forgave her. Forgiving people makes you feel wonderfully virtuous, doesn't it?"
        - id: ch04-b03
          speaker: anne_shirley
          text: "From now on, I'm going to use all my energy to be good. I will never try to be beautiful again. Of course being good is better. I know it is. But sometimes it's very difficult to believe something even while you know it's true. I honestly want to be good, Marilla. I want to be like you and Mrs. Allan and Miss Stacy, and grow up to make you proud of me."
        - id: ch04-b04
          speaker: anne_shirley
          text: "Diana says that when my hair starts growing, I should tie a black velvet ribbon around my head with a bow on one side. She thinks it will look very becoming. I'm going to call it a snood. That sounds so romantic. But am I talking too much, Marilla? Is it making your head hurt?"
        - id: ch04-b05
          speaker: marilla_cuthbert
          text: "My head is better now. It was terribly bad this afternoon, though. These headaches keep getting worse. I'll have to speak to a doctor about them. As for your chatter, I suppose I don't mind it. I've grown so used to hearing it."
        - id: ch04-b06
          speaker: narrator
          text: "That was Marilla's way of saying she liked to listen to Anne."
