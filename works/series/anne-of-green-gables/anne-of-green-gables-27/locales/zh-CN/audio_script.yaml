audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖机智，叙事细腻而自然
        timbre: 清澈柔和的成年女声
        pace: 从容，随情节轻快变化
        pitch: 中音
    anne:
      display_name: 安妮
      tts:
        delivery: 想象丰富，热烈真挚，情绪来得快而鲜明
        timbre: 清亮灵动的少女声
        pace: 偏快，动情时一气呵成
        pitch: 中高音
    marilla:
      display_name: 玛丽拉
      tts:
        delivery: 务实克制，话语干脆，偶尔透出藏起的温情
        timbre: 稳重略低的成年女声
        pace: 稍慢而利落
        pitch: 中低音
    matthew:
      display_name: 马修
      tts:
        delivery: 寡言温厚，说话迟缓而体贴
        timbre: 低沉朴实的成年男声
        pace: 缓慢，常带短暂停顿
        pitch: 低音
  chapters:
    - id: ch01
      title: 春日晚归
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 四月快要过去的一天傍晚，玛丽拉参加完互助会，独自往家走。她忽然感到冬天真的走远了，心里也跟着涌起一阵欢喜。春天就是这样，无论一个人年老还是年轻，忧愁还是快活，总能把这份喜悦送进他的心里。
        - id: ch01-b02
          speaker: narrator
          text: 玛丽拉向来不爱琢磨自己的心思和感受。她大概以为，脑子里装的全是互助会、寄往传教区的物资箱，还有教堂议事室那张待换的新地毯。其实，在这些念头底下，另有一份朦胧而和谐的感受。她看见了夕阳中的红土地。田野正往淡紫色的暮霭里冒着轻烟，溪水那边的草地上拖着冷杉又长又尖的影子。明镜般的林中池塘四周，枫树安静地立着，枝头已经有了深红的蓓蕾。
        - id: ch01-b03
          speaker: narrator
          text: 整个世界都醒过来了，连灰暗的泥土底下也有隐秘的脉搏在跳。春意遍布大地，那股深沉而原始的欢悦，使这位端庄的中年妇人不由得加快了脚步。
        - id: ch01-b04
          speaker: narrator
          text: 绿山墙从纵横交错的树枝间露出来，窗玻璃接住阳光，又闪回几点灿烂的光。玛丽拉满怀亲爱地望着它，小心走过湿漉漉的路。想到家里该有噼啪燃烧的柴火，茶桌也会摆得整整齐齐，她觉得十分满足。安妮来以前，每逢互助会的晚上，她回到家面对的只有冷清，哪里有如今这样的舒适。
        - id: ch01-b05
          speaker: narrator
          text: 可她一进厨房，却发现炉火已经熄得漆黑，安妮也不见人影。玛丽拉满心期待的舒适全落了空，自然又失望又恼火。她明明嘱咐过，五点钟一定要准备好茶点。马修眼看就要耕地回来，她只得赶紧换下那件次好的衣裳，亲自动手做饭。
        - id: ch01-b06
          speaker: marilla
          text: 等安妮小姐回来，我非好好管教她不可。她准是跟戴安娜跑到哪儿闲逛去了。不是写故事，就是排演对白，再不然又在做什么没头没脑的傻事。她一点儿也不记得时间，更不记得自己的本分。这种毛病必须立刻刹住。
          emotion: angry
        - id: ch01-b07
          speaker: narrator
          text: 玛丽拉一边说，一边用切肉刀削引火木片，手上的狠劲远远超过了需要。马修已经回来，坐在角落里耐心等饭。
        - id: ch01-b08
          speaker: marilla
          text: 艾伦太太说她是自己见过最聪明、最可爱的孩子，那又怎么样？她是够聪明，也够可爱，可满脑子胡思乱想。才改掉一个怪毛病，转眼又冒出另一个。哎呀，瞧我！今天在互助会上，林德太太说的就是这套话，我还气得不得了。
        - id: ch01-b09
          speaker: marilla
          text: 幸亏艾伦太太替安妮说话。不然，我准会当着大家的面，把林德太太顶得下不来台。安妮的毛病当然多，我可没想否认。可教养她的是我，不是林德太太。就算大天使加百列住在埃文利，她也照样挑得出错来。
        - id: ch01-b10
          speaker: marilla
          text: 不过，我让安妮今天下午留在家里照看一切，她就不该扔下家跑掉。从前她再怎么淘气，我也没觉得她不听话，或者靠不住。如今她真变成这样，我实在难过。
        - id: ch01-b11
          speaker: narrator
          text: 马修有耐心，也有智慧，尤其还饿着肚子。他从往日的经验里学会了，最好让玛丽拉把怒气一口气说完。只要没人不合时宜地争辩，耽误她手里的活儿，她反而能更快把饭做好。
        - id: ch01-b12
          speaker: matthew
          text: 这个嘛，我也说不好。玛丽拉，也许你下结论太早了。还没弄清她是不是真的违背了你的话，先别说她靠不住。兴许这件事能解释清楚。安妮可是最会解释的。
        - id: ch01-b13
          speaker: marilla
          text: 我叫她留在家里，她现在却不在。我倒想听听，她要怎么解释才能让我满意。马修，我早知道你会护着她。可教养她的是我，不是你。
        - id: ch01-b14
          speaker: narrator
          text: 晚饭做好时，天已经黑了。安妮没有气喘吁吁地跑过圆木桥，也没有满脸悔意地从情人小径赶回来，仿佛终于想起自己忘了本分。玛丽拉沉着脸洗完碗碟，又一一收好。她要去地窖，便上东山墙房间拿安妮桌上的蜡烛。蜡烛一点亮，她转过身，竟发现安妮就在床上，脸朝下埋进了枕头。
    - id: ch02
      title: 变绿的头发
      blocks:
        - id: ch02-b01
          speaker: marilla
          text: 我的老天！安妮，你一直在睡觉吗？
          emotion: surprised
        - id: ch02-b02
          speaker: anne
          text: 没有。
        - id: ch02-b03
          speaker: marilla
          text: 那你是病了吗？
        - id: ch02-b04
          speaker: narrator
          text: 玛丽拉焦急地走到床边。安妮反而更深地缩进枕头，仿佛恨不得永远藏起来，再也不让世上的人看见。
        - id: ch02-b05
          speaker: anne
          text: 我没病。可是求你出去吧，玛丽拉，别看我。我已经掉进绝望的深渊了。现在谁考全班第一，谁的作文写得最好，谁在主日学校唱诗班里唱歌，我全不在乎。那些事已经一点儿也不重要，因为我大概永远不能出门见人了。我的一生都完了。求你走吧，别看我。
          emotion: sad
        - id: ch02-b06
          speaker: marilla
          text: 谁听过这种话？安妮·雪莉，你到底出了什么事？你又做了什么？马上起来告诉我。现在就起来！好了，究竟怎么了？
        - id: ch02-b07
          speaker: narrator
          text: 安妮绝望而顺从地从床上滑到地板上。
        - id: ch02-b08
          speaker: anne
          text: 玛丽拉，你看看我的头发。
          emotion: sad
        - id: ch02-b09
          speaker: narrator
          text: 玛丽拉举高蜡烛，仔细去看那一大蓬披在安妮背后的浓发。它的样子确实古怪得很。
        - id: ch02-b10
          speaker: marilla
          text: 安妮·雪莉，你对头发做了什么？怎么会变成绿色！
          emotion: surprised
        - id: ch02-b11
          speaker: narrator
          text: 如果那还能算是世上的一种颜色，它的确可以叫作绿。那是一种暗淡、古怪、泛着青铜色的绿，中间还东一道、西一道地露着原先的红。红绿夹杂，不但没有好看一点，反而把整头头发衬得更加吓人。玛丽拉活了这么多年，从没见过如此荒唐难看的头发。
        - id: ch02-b12
          speaker: anne
          text: 是啊，它绿了。我从前以为，没有什么比红头发更糟。现在才知道，绿头发要糟十倍。玛丽拉，你根本想不到我有多悲惨。
          emotion: sad
        - id: ch02-b13
          speaker: marilla
          text: 我确实不知道你怎么弄成了这样，不过一定要问清楚。跟我下楼去，楼上太冷，厨房里暖和些。把你干的事从头到尾告诉我。你已经两个多月没闯祸，我早就在等下一桩怪事了。现在说吧，你对头发做了什么？
        - id: ch02-b14
          speaker: anne
          text: 我把它染了。
        - id: ch02-b15
          speaker: marilla
          text: 染了？你竟然染头发！安妮·雪莉，你不知道这是很不应该的事吗？
          emotion: surprised
        - id: ch02-b16
          speaker: anne
          text: 我知道，这有一点儿不应该。可只要能摆脱红头发，我觉得做一点儿坏事也值得。我把代价盘算过了。再说，我本来打算在别的事情上格外乖，好把这一点补回来。
        - id: ch02-b17
          speaker: marilla
          text: 好吧，如果我觉得头发非染不可，至少会选一种像样的颜色，绝不会把它染绿。
        - id: ch02-b18
          speaker: anne
          text: 可我没想染成绿色呀。就算要做坏事，我也希望这件坏事有点用处。那个小贩说，染完以后会是漂亮的乌黑色。他明明白白保证过，我怎么能怀疑呢？别人不信我说的话是什么滋味，我最清楚。艾伦太太也说过，没有证据，就不该怀疑别人撒谎。
        - id: ch02-b19
          speaker: anne
          text: 现在我有证据了。这头绿发给谁看，谁都会相信证据够足。可那时我什么证据也没有，只好把他说的每一个字都当真。
        - id: ch02-b20
          speaker: marilla
          text: 是谁说的？你到底在说谁？
        - id: ch02-b21
          speaker: anne
          text: 今天下午来的那个小贩。染发水就是从他那里买的。
        - id: ch02-b22
          speaker: marilla
          text: 安妮·雪莉，我说过多少次，不许让那些意大利人进屋？我一点儿也不赞成招惹他们到附近来。
        - id: ch02-b23
          speaker: anne
          text: 我没让他进屋。我记得你的话，所以自己走出去，小心地关上门，只在台阶上看他的货。再说，他不是意大利人，他是个德国犹太人。他有一只大箱子，里面全是有趣的东西。他说自己拼命挣钱，是为了把妻子和孩子从德国接来。他说得那么动情，我一下子就心软了，想买点东西帮他实现这个很值得赞许的愿望。
        - id: ch02-b24
          speaker: anne
          text: 接着，我忽然看见那瓶染发水。他说，无论什么头发，用它一染，保准变成漂亮的乌黑色，而且洗也洗不掉。只一眨眼，我就仿佛看见自己有了一头乌黑美丽的头发。那诱惑根本没法抵挡。
        - id: ch02-b25
          speaker: anne
          text: 一瓶要七十五美分，可我卖小鸡的钱只剩五十美分。我觉得那小贩心肠很好，因为他说，看在是我的份上，五十美分就卖了，简直跟白送一样。我买下来，等他一走，就上楼照说明用旧发刷抹在头发上。整整一瓶全用光了。
        - id: ch02-b26
          speaker: anne
          text: 玛丽拉，等我看见头发变成这种可怕的颜色，我立刻后悔做了坏事。从那时候起，我一直都在后悔。
          emotion: sad
        - id: ch02-b27
          speaker: marilla
          text: 我希望你这番后悔能有点用，也希望你终于睁开眼睛，看清虚荣把你带到了什么地方。老天知道这事该怎么办。眼下能做的第一件事，就是把头发好好洗一遍，看看有没有一点用。
        - id: ch02-b28
          speaker: narrator
          text: 安妮用肥皂和清水，使足了劲搓了又搓，可颜色一点儿没变。无论她费多大力气，那股怪绿还是牢牢留在头发上。就算她洗的是原先那头红发，结果也不会有半点儿不同。那个小贩说这染料洗不掉，倒确实没有撒谎。至于他说的其他话可不可信，那就是另一回事了。
        - id: ch02-b29
          speaker: anne
          text: 玛丽拉，我该怎么办？这件事会跟着我一辈子，大家永远也不会忘。以前那些错，他们差不多都忘了。放了搽剂的蛋糕，把戴安娜灌醉，还有冲着林德太太发脾气。可这一次，他们准会觉得我不是个体面人。
          emotion: sad
        - id: ch02-b30
          speaker: anne
          text: “起初存心去欺骗，终将织成乱麻团。”这虽然是诗，却说得一点儿也没错。还有乔西·派，她不知会笑成什么样！玛丽拉，我没法去面对她。我是整个爱德华王子岛上最不幸的姑娘。
          emotion: sad
    - id: ch03
      title: 虚荣的惩罚
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 安妮的不幸足足持续了一个星期。她哪里也不去，每天都洗头，可那股可怕的绿色丝毫不肯退去。外人里只有戴安娜知道这个致命的秘密。戴安娜郑重答应绝不泄露，而且她的确守住了承诺。一星期过去，玛丽拉终于作出了决定。
        - id: ch03-b02
          speaker: marilla
          text: 没用的，安妮。再没有比这更牢的染料了。你的头发必须剪掉，别无办法。顶着现在这个样子，你不能出去见人。
        - id: ch03-b03
          speaker: narrator
          text: 安妮的嘴唇颤抖起来。可她心里也明白，玛丽拉说的是无情的事实。再舍不得那头长发，也没有第二条路可走。她只好凄凉地叹口气，转身去把剪刀拿来。
        - id: ch03-b04
          speaker: anne
          text: 请你马上剪吧，玛丽拉，赶紧把它了结。我觉得自己的心都碎了。偏偏这场苦难一点儿也不浪漫。书里的姑娘不是因为发高烧失去头发，就是把头发卖掉，用钱去做一件善事。如果是那样，我肯定不会像现在这么伤心。
          emotion: sad
        - id: ch03-b05
          speaker: anne
          text: 可我只是因为把头发染成了可怕的颜色，才不得不剪掉。这里面一点儿值得安慰的地方也没有，对不对？你剪的时候，我打算一直哭，只要不妨碍你动剪刀就好。这件事实在太悲惨了。
          emotion: sad
        - id: ch03-b06
          speaker: narrator
          text: 安妮果然边剪边哭。后来，她上楼对着镜子一看，反而绝望得平静下来。玛丽拉下手十分彻底，也实在不得不把她的头发贴着头皮，尽可能剪短。安妮那头又长又浓的卷发全没了。即使把话说得再客气，剪完的模样也绝不好看。安妮立刻转过镜子，让它面朝墙壁。
        - id: ch03-b07
          speaker: anne
          text: 在头发长出来以前，我再也、再也不看自己了！
          emotion: angry
        - id: ch03-b08
          speaker: narrator
          text: 可她才说完，又忽然把镜子转了回来。
        - id: ch03-b09
          speaker: anne
          text: 不，我还是要看。这就算我做坏事的苦修。每次走进房间，我都要照镜子，看看自己究竟有多难看。我也绝不靠想象，把这副样子从心里赶走。
        - id: ch03-b10
          speaker: anne
          text: 我从来不知道，自己竟然会为头发虚荣。它明明是红色的，我却还是很在乎，因为它又长、又浓、又卷。我猜，下一个要遭殃的就是我的鼻子了。
        - id: ch03-b11
          speaker: narrator
          text: 下一个星期一，安妮顶着剪短的头发走进学校，果然在同学中引起了轰动。叫她松一口气的是，没有人猜到真正的原因，连乔西·派也没猜到。不过，乔西当然不会错过挖苦她的机会，特意告诉安妮，她看上去活像一个十足的稻草人。
        - id: ch03-b12
          speaker: narrator
          text: 当天晚上，玛丽拉的头痛又犯了，正躺在沙发上。安妮便把学校里的事悄悄说给她听。
        - id: ch03-b13
          speaker: anne
          text: 乔西说我像稻草人，我一句话也没回。因为我想，这是惩罚的一部分，我应该耐心忍受。被人说成稻草人可真不好受，我特别想回敬她一句，可我忍住了。我只用十分轻蔑的眼神扫了她一下，然后就原谅了她。
        - id: ch03-b14
          speaker: anne
          text: 原谅别人的时候，人会觉得自己非常高尚，是不是？从今往后，我要把所有力气都拿来做个好孩子，再也不想办法变漂亮。当然，做好孩子更重要，这一点我知道。可有时候，一件事明明知道是真的，却还是很难真正相信。
        - id: ch03-b15
          speaker: anne
          text: 我真的想变好，像你、艾伦太太和斯泰西小姐那样。等我长大了，我也想让你觉得骄傲。戴安娜说，等头发长起来一些，我可以在头上系一条黑天鹅绒带子，在一边打个蝴蝶结。她觉得一定很好看。我要管它叫发网，听起来多浪漫。
        - id: ch03-b16
          speaker: anne
          text: 不过，玛丽拉，我是不是说得太多了？你的头更疼了吗？
        - id: ch03-b17
          speaker: marilla
          text: 我的头现在已经好些了，今天下午倒是疼得非常厉害。这些头痛一次比一次重，我得去找医生看看。至于你这样不停地说话，我倒不怎么觉得烦。我已经听惯了。
        - id: ch03-b18
          speaker: narrator
          text: 这就是玛丽拉表达自己喜欢听安妮说话的方式。
