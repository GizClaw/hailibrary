  chapters:
    - id: ch01
      title: The Winter at Queen's
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: "Anne's homesickness faded, and her weekend trips home helped more than anything. While the weather stayed open, the Avonlea students took the new branch train to Carmody every Friday night. Diana and several other young people usually met them there. Then everyone walked to Avonlea together, laughing along the way. Those Friday evening wanderings were the best and dearest hours of Anne's week. They crossed the autumn hills through crisp golden air, with the lights of home twinkling ahead."
        - id: ch01-b02
          speaker: narrator
          text: "Gilbert Blythe nearly always walked beside Ruby Gillis and carried her satchel. Ruby had grown into a very handsome young woman, and she considered herself every bit as grown-up as she looked. She wore her skirts as long as her mother allowed. In town she pinned up her hair, though she had to let it down again at home. Her eyes were large and bright blue. Her complexion was brilliant, and her figure was plump and striking. Ruby laughed often. She was cheerful and easy-tempered, and she openly enjoyed every pleasant thing that came her way."
        - id: ch01-b03
          speaker: jane_andrews
          text: "Ruby doesn't seem at all like someone Gilbert would choose."
        - id: ch01-b04
          speaker: narrator
          text: "Jane whispered this to Anne. Anne agreed, but not even the Avery scholarship could have persuaded her to say so. Still, she couldn't help imagining how pleasant it would be to have a friend like Gilbert. They could joke and talk, and share ideas about books, their studies, and the things they hoped to do. Anne knew Gilbert had ambitions. Ruby didn't seem like someone who would enjoy discussing those very much."
        - id: ch01-b05
          speaker: narrator
          text: "There was nothing romantic in Anne's thoughts about Gilbert. When she thought of boys at all, she simply saw the possibility of good comrades. If she and Gilbert had been friends, she wouldn't have minded how many other friends he had or who walked beside him. Anne had a gift for friendship, and she had plenty of girl friends. Yet she had begun to sense that a boy's friendship might add something different. It might give her new ways to think about companionship and new points of view for judging things."
        - id: ch01-b06
          speaker: narrator
          text: "Anne couldn't have explained her feelings so neatly herself. What she did imagine was Gilbert walking home with her from the train. As they crossed the crisp fields and followed the ferny side roads, they could have talked about the new world opening around them. They could have shared their hopes and ambitions, and had many lively, interesting conversations. Gilbert was clever and had thoughts of his own. He meant to take the best he could from life and give his best back to it."
        - id: ch01-b07
          speaker: narrator
          text: "Ruby told Jane that she understood only about half of what Gilbert said. He sounded just like Anne Shirley whenever Anne fell into one of her thoughtful moods. As far as Ruby was concerned, there was no fun in troubling over books and ideas when nobody made you do it. Frank Stockley had much more spirit and energy. Then again, he wasn't nearly as handsome as Gilbert. Ruby truly couldn't decide which boy she liked better."
        - id: ch01-b08
          speaker: narrator
          text: "At the Academy, Anne slowly gathered a small circle of friends who were thoughtful, imaginative, and ambitious like her. She soon became close to Stella Maynard, the rose-red girl, and Priscilla Grant, the dream girl. Pale, delicate-looking Priscilla turned out to be overflowing with mischief, pranks, and fun. Stella, with her vivid face and black eyes, carried a heart full of wistful dreams and fancies. They were as light and rainbow-bright as Anne's own."
        - id: ch01-b09
          speaker: narrator
          text: "After the Christmas holidays, the Avonlea students stopped going home on Fridays. They settled down to serious work instead. By then, every Queen's scholar had found a place in the class, and each group had taken on a character of its own. Everyone accepted certain facts. The competition for the medal had almost certainly come down to three students: Gilbert Blythe, Anne Shirley, and Lewis Wilson. The Avery scholarship was harder to predict. Any one of six students might win it. As for the bronze medal in mathematics, everyone considered that prize already won by a funny little country boy with a round, bumpy forehead and a patched coat."
        - id: ch01-b10
          speaker: narrator
          text: "Ruby Gillis was the most beautiful girl in the Academy that year. In the Second Year classes, Stella Maynard was judged the prettiest, though a small and very determined group favored Anne Shirley. Those who claimed to understand fashion agreed that Ethel Marr wore her hair in the finest styles. Jane Andrews was plain, hardworking, and conscientious, and she took the honors in domestic science. Even Josie Pye became famous in her own way. She had the sharpest tongue of any young woman at Queen's. Altogether, Miss Stacy's former pupils more than held their own in the larger world of the Academy."
        - id: ch01-b11
          speaker: narrator
          text: "Anne worked steadily and hard. Her rivalry with Gilbert remained as fierce as it had been at the Avonlea school, though the rest of the class knew nothing about it. Somehow, the bitterness had disappeared. Anne no longer wanted to win simply so Gilbert would lose. Now she wanted the proud feeling of earning a victory over a worthy opponent. Winning would still be wonderful, but she no longer believed life would be unbearable if she failed."
        - id: ch01-b12
          speaker: narrator
          text: "Lessons didn't keep the students from enjoying themselves. Anne spent many free hours at Beechwood. She usually ate Sunday dinner there and went to church with Miss Barry. Miss Barry admitted that she was growing old, but her black eyes were still bright and her tongue had lost none of its force. She never turned its sharp edge on Anne, who remained one of the critical old lady's greatest favorites."
        - id: ch01-b13
          speaker: miss_josephine_barry
          text: "That Anne girl keeps getting better. Other girls tire me out because they're always so annoyingly alike. Anne has as many shades as a rainbow, and whichever shade you're seeing is the prettiest one. She may not be as entertaining as she was as a child, but she makes me love her. I appreciate people who do that. It saves me the effort of making myself love them."
        - id: ch01-b14
          speaker: narrator
          text: "Then spring arrived before anyone quite realized it. Out in Avonlea, pink Mayflowers peeked from the dry barrens where wreaths of snow still lingered. A mist of new green covered the woods and valleys. In Charlottetown, though, the exhausted students at Queen's could think and talk about only one thing: examinations."
        - id: ch01-b15
          speaker: anne_shirley
          text: "I can hardly believe the term is nearly finished. Last fall, the time ahead looked so long. We had a whole winter of lessons and classes before us. Now our exams are waiting next week. Sometimes I feel as if those exams mean everything. But then I see the great buds swelling on the chestnut trees and the hazy blue air at the ends of the streets. After that, the exams don't seem nearly so important."
        - id: ch01-b16
          speaker: narrator
          text: "Jane, Ruby, and Josie had stopped by, and none of them agreed. The coming exams were always terribly important to them, far more important than chestnut buds or the soft haze of May. Anne could afford to dismiss the exams now and then because she was certain to pass. But the other girls truly believed their whole futures depended on the results. They couldn't look at the matter so calmly."
        - id: ch01-b17
          speaker: jane_andrews
          text: "I've lost seven pounds in two weeks. Telling me not to worry won't help. I'm going to worry. At least worrying feels as if you're doing something. Imagine going to Queen's all winter and spending so much money, only to fail and come home without my license. That would be dreadful."
        - id: ch01-b18
          speaker: josie_pye
          text: "Well, I don't care. If I fail this year, I'll simply return next year. My father can pay for it. Anne, Frank Stockley heard Professor Tremaine say that Gilbert Blythe is certain to take the medal. He also said Emily Clay will probably win the Avery scholarship."
        - id: ch01-b19
          speaker: anne_shirley
          text: "That news may upset me tomorrow, Josie, but it honestly doesn't right now. I know the violets are coming out purple down in the hollow below Green Gables. Little ferns are pushing up their heads in Lovers' Lane. As long as that's happening, winning the Avery doesn't seem to matter so very much. I've done all I could, and I'm beginning to understand the joy of the strife. Trying and winning is best, but trying and failing comes next."
          emotion: happy
        - id: ch01-b20
          speaker: anne_shirley
          text: "Girls, let's stop talking about exams. See that arch of pale green sky above the houses? Just imagine how it must look over the deep purple beech woods behind Avonlea."
        - id: ch01-b21
          speaker: ruby_gillis
          text: "And Jane, have you decided on your commencement dress?"
        - id: ch01-b22
          speaker: narrator
          text: "Ruby's practical question brought answers from Jane and Josie at the same moment. Soon all three were talking about fashions instead. Anne heard none of it. She rested her elbows on the windowsill, laid her soft cheek against her clasped hands, and gazed beyond the city's roofs and steeples. Her eyes were full of visions as she watched the glorious dome of the sunset sky."
        - id: ch01-b23
          speaker: narrator
          text: "Anne wove dreams of a possible future from all the golden hope of youth. Everything that lay Beyond belonged to her, with rosy possibilities waiting in the years ahead. Each coming year was a rose of promise, ready to be woven into a crown that would never fade."
