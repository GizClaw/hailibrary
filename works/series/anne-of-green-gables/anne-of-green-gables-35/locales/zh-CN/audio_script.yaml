audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖机敏，带着含蓄的幽默讲述
        timbre: 清澈柔和
        pace: 舒展而富有变化
        pitch: medium
    anne:
      display_name: 安妮
      tts:
        delivery: 热烈敏感，想象丰富，情绪来得真切而迅速
        timbre: 明亮清脆的少女声
        pace: 偏快，激动时连贯奔涌
        pitch: medium-high
    miss_barry:
      display_name: 巴里小姐
      tts:
        delivery: 阅历丰富，判断笃定，关怀中带着讲究
        timbre: 清晰端雅的老年女声
        pace: 从容适中
        pitch: medium
    josie:
      display_name: 乔西
      tts:
        delivery: 自负刻薄，炫耀时轻快而毫不自觉
        timbre: 尖亮的少女声
        pace: 偏快
        pitch: high
    jane:
      display_name: 简
      tts:
        delivery: 坦率务实，想到什么就直说
        timbre: 清亮朴实的少女声
        pace: 自然明快
        pitch: medium-high
    ruby:
      display_name: 露比
      tts:
        delivery: 活泼好奇，带着少女的轻柔与热心
        timbre: 甜润明亮的少女声
        pace: 自然适中
        pitch: medium-high
  chapters:
    - id: ch01
      title: 第三十五章　女王学院的冬天
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 安妮不再那么想家了。每到周末都能回去一趟，这份思乡之苦自然消得快。天气还没冷到不能出门时，埃文利的学生每逢星期五晚上就坐上新开的支线火车，到卡莫迪下车。戴安娜和几个年轻人往往已经等在那里。大伙儿凑成热热闹闹的一群，一路走回埃文利。秋天的山野罩着金色的光，空气清冽，远处家家户户的灯火不停闪烁。安妮最珍爱这样的星期五傍晚。对她来说，这就是一星期里最好的时光。
        - id: ch01-b02
          speaker: narrator
          text: 吉尔伯特·布莱思几乎每次都陪着露比·吉利斯走，还替她拿书包。露比已经长成十分漂亮的姑娘。她觉得自己确实长大了，就一心要让外表也显得同样成熟。母亲肯让裙子放多长，她就穿多长。在城里，她会把头发盘起来，回家后却必须放下。她有明亮的蓝眼睛，红润的脸庞和丰满惹眼的身材。她笑声很多，开朗又随和，生活给她什么乐趣，她都会坦然享受。
        - id: ch01-b03
          speaker: jane
          text: 可我总觉得，吉尔伯特不会喜欢她这样的姑娘。
        - id: ch01-b04
          speaker: narrator
          text: 简把这话悄悄告诉安妮，安妮心里也赞同。可哪怕有人拿艾弗里奖学金来换，她也绝不会承认。她只是忍不住想，要是吉尔伯特能成为自己的朋友，那该多好。他们可以一起开玩笑，一起聊天，还能谈书本、功课和各自的志向。安妮知道吉尔伯特有志向，可露比似乎不是能陪他好好谈这些事情的人。
        - id: ch01-b05
          speaker: narrator
          text: 安妮可没有因此生出什么儿女情思。她偶尔想起男孩子，也只觉得他们可能成为不错的伙伴。假如她和吉尔伯特是朋友，他另有多少朋友，又陪谁走路，她都不会介意。安妮很会交朋友，身边从来不缺女伴。不过她模模糊糊地感到，能有一位男性朋友也很好。那会让她更明白友谊的样子，看人看事时，眼光也能更宽一些。当然，这些道理，她自己还说不清楚。
        - id: ch01-b06
          speaker: narrator
          text: 她只是会想，假如有一天，吉尔伯特陪她从火车站走回家，两人穿过凉爽的田野，再沿着长满蕨草的小路往前走，他们准能聊得又快活又有趣。四周有一个新世界正在展开，他们可以谈这个世界，也谈自己的希望和志向。吉尔伯特很聪明，凡事都有自己的想法。他决心从生活里得到最好的，也把自己最好的一面交给生活。
        - id: ch01-b07
          speaker: narrator
          text: 可露比私下对简说，吉尔伯特讲的话，她一半都听不懂。他一旦认真想起事情，说话就跟安妮一模一样。又没人逼着他们读书，何必还要操心那些东西呢？露比觉得，那一点也不好玩。弗兰克·斯托克利倒是有派头，也更有冲劲。可他的相貌连吉尔伯特的一半都赶不上。露比左想右想，还是决定不了自己更喜欢谁。
        - id: ch01-b08
          speaker: narrator
          text: 在学院里，安妮也慢慢有了自己的小圈子。那些朋友和她一样，喜欢思考，富于想象，又怀着远大的志向。她很快就同两位姑娘亲近起来。一位是“红玫瑰姑娘”斯特拉·梅纳德，另一位是“梦中姑娘”普里西拉·格兰特。普里西拉脸色苍白，看上去空灵又安静，实际上满肚子都是淘气点子，最喜欢恶作剧和玩闹。黑眼睛的斯特拉明艳活泼，心里却装着无数惆怅的梦想。那些幻想像空气一样轻，像彩虹一样美，和安妮的幻想十分相像。
        - id: ch01-b09
          speaker: narrator
          text: 圣诞假期结束后，埃文利的学生不再星期五回家了。他们安定下来，开始拼命用功。这时，女王学院的学生都已经在众人中找准了自己的位置，每个班也显出了固定的性格。许多事情，大家心里都有了定论。争夺奖章的人差不多只剩三个，吉尔伯特·布莱思、安妮·雪莉和刘易斯·威尔逊。艾弗里奖学金就难说了，足足有六个人可能获奖。至于数学铜质奖章，大家都当它已经归了一个乡下来的小男孩。那孩子胖乎乎的，额头凹凸不平，外套还打着补丁，模样很是滑稽。
        - id: ch01-b10
          speaker: narrator
          text: 这一届最漂亮的姑娘是露比·吉利斯。二年级班里，公认的美人是斯特拉·梅纳德，不过也有一小群眼光挑剔的人把票投给安妮。懂行的人一致认为，埃塞尔·马尔的发式最时髦。相貌平常、做事踏实又认真的简·安德鲁斯，在家政课上拿到了第一。甚至连乔西·派伊也有一项无人能及的本事，她是全学院说话最尖刻的姑娘。看来，史黛西小姐从前教过的学生，到了这片更大的天地，也都站稳了脚跟。
        - id: ch01-b11
          speaker: narrator
          text: 安妮一直用功，而且十分踏实。她和吉尔伯特仍在暗中较劲，劲头不比在埃文利学校时小，只是班上别人都不知道。可是，这场竞争里的怨气不见了。安妮想赢，已经不是为了打败吉尔伯特。她想凭自己的本事，堂堂正正胜过一位出色的对手。这样的胜利，才真叫人骄傲。赢了当然值得，可即使输了，她也不再以为人生会就此变得无法忍受。
        - id: ch01-b12
          speaker: narrator
          text: 功课之外，学生们依然能找到开心的时候。安妮有空常去山毛榉庄，星期日多半在那里吃饭，再陪巴里小姐去教堂。巴里小姐承认自己老了，可她的黑眼睛还亮得很，说起刻薄话来，也照旧锋利。不过这份锋利从不对着安妮。挑剔的老太太始终把安妮当作自己最喜欢的人。
        - id: ch01-b13
          speaker: miss_barry
          text: 安妮这姑娘一直在变好。别的姑娘我看不了多久就会厌烦，她们从头到尾总是一个样，实在叫人气恼。可安妮像一道彩虹，有多少种颜色，就有多少副模样。而且每种颜色刚出现时，都比别的颜色更美。她也许不像小时候那么逗人了，可她会让我爱上她。我就喜欢这种能叫我爱上的人，省得还要费力逼自己去爱她们。
        - id: ch01-b14
          speaker: narrator
          text: 几乎没人察觉，春天就已经到了。埃文利郊外，枯黄的荒地上还积着几道残雪，五月花已经露出粉红的颜色。树林和山谷间，也浮起一层淡淡的“绿雾”。然而在夏洛特敦，女王学院的学生被功课压得透不过气。他们想来想去，说来说去，心里只有考试。
        - id: ch01-b15
          speaker: anne
          text: 真想不到，这学期眼看就要结束了。去年秋天望过去，觉得前面好长啊，整整一个冬天都要上课、用功。可现在呢，下星期就要考试了。姑娘们，有时候我觉得，考试简直比什么都重要。可我一看见栗树上的花苞越长越大，再看看街道尽头那片蒙着雾的蓝天，就觉得考试其实没那么了不起，连原来的一半都不如。
        - id: ch01-b16
          speaker: narrator
          text: 简、露比和乔西正好来找安妮，三个人谁也不能同意。她们认为，眼前的考试每时每刻都至关紧要，比栗树花苞和五月的薄雾重要得多。安妮至少肯定能及格，当然可以偶尔把考试看得轻一点。可她们真心相信，自己的整个前途都压在考试上。既然如此，又怎么可能轻松地看待它呢？
        - id: ch01-b17
          speaker: jane
          text: 这两个星期，我已经瘦了七磅。你们叫我别发愁也没有用，我就是会发愁。其实发愁也有一点好处，心里发愁的时候，好像自己正在设法做点什么。我来女王学院读了一个冬天，家里又花了这么多钱。最后要是拿不到教师执照，那才叫可怕呢。
          emotion: sad
        - id: ch01-b18
          speaker: josie
          text: 我可不担心。今年通不过，明年再来就是了，我爸爸又不是供不起。安妮，弗兰克·斯托克利说，特里梅因教授已经讲了，奖章肯定归吉尔伯特·布莱思，艾弗里奖学金多半会让艾米莉·克莱拿走。
        - id: ch01-b19
          speaker: anne
          text: 乔西，到了明天，这消息可能真会让我不好受。可眼下，只要想到绿山墙下面的洼地里已经开满紫罗兰，情人小径上的小蕨草也都把脑袋探出来了，我就觉得，拿不拿得到艾弗里奖学金，其实没有多大关系。我已经尽了全力，也渐渐懂得了什么叫“奋斗的喜悦”。努力之后赢了，当然最好。仅次于它的，就是努力之后没有赢。
        - id: ch01-b20
          speaker: anne
          text: 姑娘们，别谈考试了！你们看看，房屋上面有一道淡绿色的天空。再想一想，它罩在埃文利后面那片紫黑色的山毛榉林上，会有多美。
        - id: ch01-b21
          speaker: ruby
          text: 简，毕业典礼那天，你准备穿什么衣服？
        - id: ch01-b22
          speaker: narrator
          text: 简和乔西一起抢着回答，谈话就这样转了弯，顺着时装的话题流了下去。安妮一句也没听。她把手肘放在窗台上，双手交握，柔软的脸颊就贴在手上。她眼中全是幻想，越过城里的屋顶和尖塔，望着夕阳映照下那片壮丽的天空。青春的乐观像一缕缕金线，在她心里织出或许会到来的未来。远方的一切都属于她。未来的岁月藏着无数可能，透出玫瑰般的光。每一年都是一朵许诺的玫瑰，终有一天，会编成一顶永不凋谢的花冠。
