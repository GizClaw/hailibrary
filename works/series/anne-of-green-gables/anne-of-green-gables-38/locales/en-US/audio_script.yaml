  chapters:
    - id: ch01
      title: The Bend in the Road
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: "Marilla went to town the next day and came home that evening. Anne had been visiting Diana at Orchard Slope. When she returned, she found Marilla at the kitchen table with her head resting on one hand. The sight of her sitting there so limp and defeated sent a chill through Anne."
        - id: ch01-b02
          speaker: anne_shirley
          text: "Marilla, are you terribly tired?"
        - id: ch01-b03
          speaker: marilla_cuthbert
          text: "Yes. No. I don't know. I suppose I'm tired, but that isn't what's troubling me."
        - id: ch01-b04
          speaker: anne_shirley
          text: "Did the eye doctor examine you? What did he tell you?"
        - id: ch01-b05
          speaker: marilla_cuthbert
          text: "He says I must stop reading and sewing, and give up every kind of work that strains my eyes. I must wear the glasses he gave me, and I must be careful not to cry. If I do all that, my sight may not get worse, and the headaches may stop. If I don't, he says I'll be completely blind within six months. Blind, Anne. Think of that!"
          emotion: fearful
        - id: ch01-b06
          speaker: narrator
          text: "Anne gave one quick cry of dismay. Then she fell silent. For a moment, she could not make herself speak. When the words came, she forced them out bravely, though her voice caught."
        - id: ch01-b07
          speaker: anne_shirley
          text: "Please don't think about the worst. He did give you hope. If you're careful, you won't lose your sight. And if those glasses take away your headaches, that will mean a great deal."
          emotion: calm
        - id: ch01-b08
          speaker: marilla_cuthbert
          text: "It doesn't feel like much hope to me. What will I have to live for if I can't read, sew, or do any useful work? I might as well be blind already, or dead. And how am I supposed to keep from crying when I get lonely? But talking won't help. I'd be grateful for a cup of tea. I'm worn out. And don't tell anyone yet. I couldn't bear having people come here to ask questions, pity me, and talk it all over."
          emotion: sad
        - id: ch01-b09
          speaker: narrator
          text: "After Marilla had eaten, Anne persuaded her to go to bed. Then Anne climbed to the east gable and sat alone by her window in the dark. She let the tears come, and her heart felt heavy. The night after she first came home, she had sat in that same place overflowing with hope and joy. Back then, the future had seemed bright with promise. Now everything had changed so sadly that Anne felt years older. Still, before she went to bed, peace returned to her heart, and a smile touched her lips. She had looked her duty straight in the face without turning away. When duty is met honestly and bravely, it becomes a friend."
        - id: ch01-b10
          speaker: narrator
          text: "A few afternoons later, Marilla came slowly in from the front yard. She had been talking with a caller, Mr. Sadler from Carmody. Anne knew him by sight, and she wondered what he had said to leave such a look on Marilla's face."
        - id: ch01-b11
          speaker: anne_shirley
          text: "What did Mr. Sadler come about?"
        - id: ch01-b12
          speaker: narrator
          text: "Marilla sat by the window and looked at Anne. Tears stood in her eyes despite the doctor's warning, and her voice broke."
        - id: ch01-b13
          speaker: marilla_cuthbert
          text: "He heard I'm planning to sell Green Gables. He wants to buy it."
          emotion: sad
        - id: ch01-b14
          speaker: anne_shirley
          text: "Sell it? Sell Green Gables? Marilla, you can't mean that!"
          emotion: surprised
        - id: ch01-b15
          speaker: marilla_cuthbert
          text: "I don't see any other choice. I've considered everything. With strong eyes, I could stay and manage the place with a good hired man. But I can't do that now. I may go blind, and even if I don't, I won't be able to run the farm. I never thought I'd have to sell my own home. Still, if I keep it, everything will fall further behind until no one wants it. All our money was in that bank, and Matthew signed some notes last fall that still have to be paid. Mrs. Lynde thinks I should sell and board somewhere. With her, I suppose. The farm won't bring much because it's small and the buildings are old, but I expect it would support me. At least your scholarship provides for you. I'm only sorry you won't have a home for your vacations, but you'll find some way to manage."
          emotion: sad
        - id: ch01-b16
          speaker: narrator
          text: "Marilla could hold back no longer. She covered her face and wept."
        - id: ch01-b17
          speaker: anne_shirley
          text: "You are not selling Green Gables."
        - id: ch01-b18
          speaker: marilla_cuthbert
          text: "I wish I didn't have to, Anne. But you can see how things stand. I can't live here alone. The trouble and loneliness would drive me out of my mind, and I'd lose my sight. I'm sure of it."
          emotion: sad
        - id: ch01-b19
          speaker: anne_shirley
          text: "You won't be alone. I'll stay with you. I'm not going to Redmond."
        - id: ch01-b20
          speaker: narrator
          text: "Marilla raised her worn face from her hands and stared at Anne."
        - id: ch01-b21
          speaker: marilla_cuthbert
          text: "Not going to Redmond? Anne, what are you saying?"
          emotion: surprised
        - id: ch01-b22
          speaker: anne_shirley
          text: "Exactly what I mean. I decided the night after you came home from town. After all you've done for me, you couldn't truly expect me to leave you alone in this trouble. I've spent the week making plans. Mr. Barry wants to rent the farm next year, so that part won't trouble you. I'm going to teach. I've applied for the Avonlea school, though I don't expect it because the trustees have promised it to Gilbert Blythe. But Mr. Blair told me last night that I can have the Carmody school. It won't be as close or convenient, but I can live here and drive there and back when the weather is warm. In winter, I can still come home on Fridays, and we'll keep a horse for the trip. I've worked it all out. I'll read aloud to you and keep your spirits up. You won't be lonely or bored. The two of us will make a warm, happy home right here."
        - id: ch01-b23
          speaker: narrator
          text: "Marilla listened as if she were dreaming."
        - id: ch01-b24
          speaker: marilla_cuthbert
          text: "I know I could manage if you stayed. But I can't allow you to give up your future for me. It would be dreadful."
        - id: ch01-b25
          speaker: anne_shirley
          text: "That's nonsense! It isn't a sacrifice. Nothing would hurt me more than losing Green Gables. We have to keep this dear old place. I've made my decision. I'm staying, and I'm going to teach. You needn't worry about me at all."
          emotion: happy
        - id: ch01-b26
          speaker: marilla_cuthbert
          text: "But all your ambitions..."
        - id: ch01-b27
          speaker: anne_shirley
          text: "I still have every bit of my ambition. I've only given it a new purpose. I'll become a good teacher, and I'll help save your eyesight. Besides, I can study here at home and take a small college course by myself. Oh, I have dozens of plans. I've been shaping every one of them all week. I'll give my best to this life, and I believe life will give its best back to me. When I left Queen's, the future looked like a straight road stretching ahead for miles and miles. I thought I could see where it led. Now the road has a bend. I can't see what waits beyond it, but I choose to believe the best is there. That bend has a wonder of its own. I keep imagining the road beyond it. There may be green beauty, soft checkered light and shadow, new views, new loveliness, and more curves and hills and valleys farther on."
        - id: ch01-b28
          speaker: marilla_cuthbert
          text: "I still don't feel right letting you give up the scholarship."
        - id: ch01-b29
          speaker: anne_shirley
          text: "You can't stop me. I'm sixteen and a half, and Mrs. Lynde once said I'm as stubborn as a mule. Please don't pity me, Marilla. I don't want pity, and I have no need of it. Just thinking of staying at dear Green Gables makes my heart glad. No one could love this place as you and I do. That's why we must keep it."
          emotion: happy
        - id: ch01-b30
          speaker: marilla_cuthbert
          text: "You blessed girl. You've given me a new life. I suppose I should insist that you go to college, but I know I can't do it, so I won't try. Somehow, I'll make this up to you."
          emotion: happy
        - id: ch01-b31
          speaker: narrator
          text: "Word soon spread through Avonlea that Anne Shirley had given up college and meant to stay home and teach. People had plenty to say about it. Most of them knew nothing about Marilla's eyes, so they thought Anne was foolish. Mrs. Allan understood. She told Anne plainly that she approved, and her words brought tears of pleasure to the girl's eyes. Good Mrs. Lynde understood too. One evening, she found Anne and Marilla sitting at the front door in the warm, sweet summer dusk. They liked to sit there as twilight settled over Green Gables. White moths moved through the garden, and the scent of mint filled the damp air. Mrs. Rachel settled her solid figure onto the stone bench beside the door. Tall pink and yellow hollyhocks grew behind it. She let out a long breath that sounded both tired and relieved."
        - id: ch01-b32
          speaker: rachel_lynde
          text: "My, it feels good to sit down. I've been standing all day, and two feet have quite a job carrying two hundred pounds. Marilla, you should be grateful you aren't fat. Now, Anne, I hear you've dropped your plan to attend college. I'm glad of it. You already have all the education a woman can comfortably carry. I don't approve of girls going to college with men and packing their heads with Latin, Greek, and such nonsense."
        - id: ch01-b33
          speaker: anne_shirley
          text: "I'm going to study Latin and Greek anyway, Mrs. Lynde. I'll take my Arts course here at Green Gables and learn everything I would have learned at college."
        - id: ch01-b34
          speaker: narrator
          text: "Mrs. Lynde threw up her hands in horror."
        - id: ch01-b35
          speaker: rachel_lynde
          text: "Anne Shirley, you'll work yourself to death!"
          emotion: surprised
        - id: ch01-b36
          speaker: anne_shirley
          text: "Not at all. I'll flourish. I won't overdo it. As Josiah Allen's wife says, I'll be moderate. There will be plenty of time during the long winter evenings, and I've never cared for fancy needlework. Besides, I'll be teaching at Carmody."
        - id: ch01-b37
          speaker: rachel_lynde
          text: "No, you won't. You'll teach here in Avonlea. The trustees have decided to give you the school."
        - id: ch01-b38
          speaker: narrator
          text: "Anne sprang to her feet."
        - id: ch01-b39
          speaker: anne_shirley
          text: "Mrs. Lynde! But I thought they had promised it to Gilbert Blythe!"
          emotion: surprised
        - id: ch01-b40
          speaker: rachel_lynde
          text: "They had. But when Gilbert learned you'd applied, he went to the trustees at their school meeting last night. He withdrew his application and told them to accept yours. He'll teach at White Sands instead. He knew you wanted to stay near Marilla, of course. It was a very kind and thoughtful thing to do, and a real sacrifice too. He'll have to pay for his room and meals at White Sands, and everyone knows he must earn his own way through college. So the trustees chose you. I was delighted when Thomas came home and told me."
        - id: ch01-b41
          speaker: anne_shirley
          text: "I don't think I should accept. It doesn't seem right to let Gilbert give up so much for me."
        - id: ch01-b42
          speaker: rachel_lynde
          text: "It's too late to prevent him now. He's already signed papers with the White Sands trustees, so refusing the school wouldn't do him any good. Naturally you'll take the Avonlea school. You'll manage perfectly well, especially now that there won't be any Pyes among your pupils. Josie was the last, and a good thing too. Avonlea school has had one Pye or another for twenty years. I suppose their mission in life was to remind schoolteachers that this earth is not their true home. Bless my heart, what's all that blinking and flashing over at the Barry gable?"
        - id: ch01-b43
          speaker: anne_shirley
          text: "Diana is signaling for me to come over. We still keep our old custom. Please excuse me while I see what she needs."
        - id: ch01-b44
          speaker: narrator
          text: "Anne raced down the clover slope like a deer and vanished among the fir shadows of the Haunted Wood. Mrs. Lynde watched her go with an indulgent look."
        - id: ch01-b45
          speaker: rachel_lynde
          text: "In some ways, she's still very much a child."
        - id: ch01-b46
          speaker: marilla_cuthbert
          text: "And in other ways, she's far more of a woman."
        - id: ch01-b47
          speaker: narrator
          text: "For one brief moment, Marilla sounded as crisp as she once had. But crispness no longer defined her. That night, Mrs. Lynde put the change plainly to Thomas."
        - id: ch01-b48
          speaker: rachel_lynde
          text: "Marilla Cuthbert has mellowed. That's exactly what has happened."
        - id: ch01-b49
          speaker: narrator
          text: "The next evening, Anne went to the little Avonlea graveyard. She placed fresh flowers on Matthew's grave and watered the Scotch rosebush. She stayed until dusk, comforted by the peace of the quiet place. Poplar leaves rustled like low, friendly voices, and grass whispered as it grew freely among the graves. By the time Anne finally left, sunset had passed. She walked down the long hill toward the Lake of Shining Waters, with all of Avonlea spread before her in a dreamlike glow, a home of ancient peace. The fresh air seemed to have crossed fields of honey-sweet clover. Lights began to twinkle here and there among the trees around the farmhouses. Beyond them, the sea lay purple under the mist, sending out its haunting, endless murmur. Soft colors filled the western sky, and the still pond held every one of them in even gentler shades. The loveliness of the whole scene thrilled Anne. She gratefully opened the gates of her soul and let it in."
        - id: ch01-b50
          speaker: anne_shirley
          text: "Dear old world, you are so lovely. I'm glad to be alive in you."
          emotion: happy
        - id: ch01-b51
          speaker: narrator
          text: "Halfway down the hill, a tall boy came whistling through the gate of the Blythe place. It was Gilbert. When he recognized Anne, his whistle stopped. He politely lifted his cap and would have walked past without a word, but Anne stopped and held out her hand. Her cheeks were scarlet."
        - id: ch01-b52
          speaker: anne_shirley
          text: "Gilbert, I want to thank you for giving me the school. What you did was very generous, and I want you to know how much I appreciate it."
        - id: ch01-b53
          speaker: narrator
          text: "Gilbert eagerly took her hand."
        - id: ch01-b54
          speaker: gilbert_blythe
          text: "It wasn't especially generous. I was glad to have the chance to help you, even in a small way. Can we be friends now? Have you truly forgiven me for what I did all those years ago?"
        - id: ch01-b55
          speaker: narrator
          text: "Anne laughed and tried to pull her hand away, but Gilbert held on."
        - id: ch01-b56
          speaker: anne_shirley
          text: "I forgave you that day by the pond landing, though I didn't realize it then. I was such a stubborn little goose. I might as well confess everything. I've regretted my stubbornness ever since."
        - id: ch01-b57
          speaker: gilbert_blythe
          text: "Then we'll be the very best of friends. We were meant to be friends, Anne, and you've fought fate long enough. I'm sure we can help each other in all sorts of ways. You do plan to continue studying, don't you? I do too. Come on. I'll walk home with you."
          emotion: happy
        - id: ch01-b58
          speaker: narrator
          text: "When Anne entered the kitchen, Marilla gave her a curious look."
        - id: ch01-b59
          speaker: marilla_cuthbert
          text: "Who came up the lane with you?"
        - id: ch01-b60
          speaker: anne_shirley
          text: "Gilbert Blythe. I met him on Barry's hill."
        - id: ch01-b61
          speaker: narrator
          text: "Anne was annoyed to feel herself blushing. Marilla smiled dryly."
        - id: ch01-b62
          speaker: marilla_cuthbert
          text: "I didn't know you and Gilbert were friendly enough to spend half an hour talking at the gate."
        - id: ch01-b63
          speaker: anne_shirley
          text: "We weren't friends before. We were very good enemies. But we've decided it makes much more sense to be good friends from now on. Was it truly half an hour? It felt like only a few minutes. We do have five years of missed conversations to make up for."
        - id: ch01-b64
          speaker: narrator
          text: "That night, Anne sat at her window for a long time, with a deep, happy contentment for company. The wind purred softly through the cherry branches, and little breaths of mint rose around her. Stars twinkled above the pointed fir trees in the hollow. Across the old gap between their homes, Diana's light gleamed."
        - id: ch01-b65
          speaker: narrator
          text: "Anne's horizons had drawn closer since the night she came home from Queen's. The path placed before her feet might be narrow now, but she knew flowers of quiet happiness would bloom all along it. The joy of sincere work would be hers. So would worthy hopes and the happiness of friendship with someone who understood her. Nothing could ever rob Anne of her birthright of imagination or the ideal world she carried in her dreams. And ahead of her, there would always be the bend in the road."
        - id: ch01-b66
          speaker: anne_shirley
          text: "God's in his heaven. All's right with the world."
          emotion: calm
