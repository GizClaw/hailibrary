audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖机敏，带着含蓄的幽默讲述
        timbre: 清澈柔和
        pace: 舒展而富有变化
        pitch: medium
    anne:
      display_name: 安妮
      tts:
        delivery: 热烈敏感，想象丰富，情绪来得真切而迅速
        timbre: 明亮清脆的少女声
        pace: 偏快，激动时连贯奔涌
        pitch: medium-high
    marilla:
      display_name: 玛丽拉
      tts:
        delivery: 严厉务实，关切藏在克制的话语里
        timbre: 稳定清晰的中年女声
        pace: 从容直接
        pitch: medium-low
    mrs_lynde:
      display_name: 林德太太
      tts:
        delivery: 阅历丰富，直率果断，沉痛时语气郑重
        timbre: 饱满清晰的中老年女声
        pace: 稳健适中
        pitch: medium-low
    gilbert:
      display_name: 吉尔伯特
      tts:
        delivery: 坦率自信，认真时带一点少年人的羞怯
        timbre: 清朗的少年声
        pace: 自然利落
        pitch: medium
  chapters:
    - id: ch01
      title: 第三十八章　路的转弯处
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 第二天，玛丽拉进了城，傍晚才回来。安妮跟戴安娜去了果园坡，回家后才看见玛丽拉坐在厨房桌边，一手托着头。她的身子软软地塌在那里，一动也不动。那副颓然无力的样子让安妮心里一冷。她从没见过这样的玛丽拉。
        - id: ch01-b02
          speaker: anne
          text: 玛丽拉，你是不是累坏了？
        - id: ch01-b03
          speaker: marilla
          text: 是……不是……我也不知道。大概是累了吧，可我一直没顾上想。不是因为这个。
        - id: ch01-b04
          speaker: anne
          text: 你见到眼科专家了吗？他怎么说？
        - id: ch01-b05
          speaker: marilla
          text: 见到了。他给我检查了眼睛。他说，我不能再读书，不能再做针线，也不能做任何费眼睛的活儿。我还得忍住不哭，戴上他配的眼镜。这样，我的眼睛也许不会继续坏下去，头痛也能治好。可我要是不照办，不出六个月就会彻底失明。瞎了啊，安妮！你想想吧！
          emotion: fearful
        - id: ch01-b06
          speaker: narrator
          text: 安妮惊叫了一声，随后沉默了整整一分钟。她觉得自己根本说不出话。终于，她强撑起勇气开了口，声音却还是哽咽的。
        - id: ch01-b07
          speaker: anne
          text: 玛丽拉，别去想最坏的结果。医生毕竟给了你希望。只要你当心，就不会完全失明。要是眼镜还能治好头痛，那也是件大好事。
          emotion: calm
        - id: ch01-b08
          speaker: marilla
          text: 我可不觉得这算什么希望。不能读书，不能做针线，也不能干那些活儿，我活着还有什么意思？那还不如瞎了，或者死了。医生还叫我别哭，可我一寂寞起来，哪里忍得住。算了，再说也没有用。给我倒杯茶吧，我会很感激的。我实在累垮了。眼下先别把这事告诉别人，至少等一阵子再说。我受不了大家跑来问长问短，又是同情，又是围着这件事议论不休。
          emotion: sad
        - id: ch01-b09
          speaker: narrator
          text: 玛丽拉吃过东西，安妮好不容易劝她上床休息。随后，安妮独自回到东山墙房间，在黑暗里坐到窗边。陪着她的只有泪水，还有那颗沉甸甸的心。回家那晚，她也曾坐在这里。那时，未来像玫瑰一样明亮，仿佛处处都许诺着美好，她心里装满希望和快乐。如今不过几天，她却觉得像是过了许多年。
        - id: ch01-b10
          speaker: narrator
          text: 可是到了睡前，安妮唇边有了微笑，心里也安静下来。她终于清楚地明白接下来该做什么，也愿意勇敢地去做。她鼓起勇气，正面望着自己的责任，发现责任原来是一位朋友。只要人肯坦然迎上去，责任一向都会成为朋友。
        - id: ch01-b11
          speaker: narrator
          text: 几天后的一个下午，玛丽拉从前院慢慢走进屋来。刚才她在那里见了一位客人，安妮认出那是卡莫迪的萨德勒。看着玛丽拉的脸色，安妮不禁猜想，他到底说了什么。
        - id: ch01-b12
          speaker: anne
          text: 玛丽拉，萨德勒先生来做什么？
        - id: ch01-b13
          speaker: narrator
          text: 玛丽拉在窗边坐下，望着安妮。医生明明不准她哭，她眼里却含着泪，连声音也碎了。
        - id: ch01-b14
          speaker: marilla
          text: 他听说我要卖掉绿山墙，想把它买下来。
          emotion: sad
        - id: ch01-b15
          speaker: anne
          text: 买下来？买绿山墙？玛丽拉，你不会真的要卖掉绿山墙吧！
          emotion: surprised
        - id: ch01-b16
          speaker: marilla
          text: 安妮，我不知道还能怎么办。我已经把一切从头到尾想过了。要是眼睛还好，我可以请个能干的长工，自己留在这里，勉强把农场操持下去。可现在不行。我也许会彻底失明，就算没有，我也不适合再管这些事。我从没想过，自己活着竟会等到不得不卖掉家园的这一天。可再拖下去，光景只会越来越差，最后连买主都没有。我们的每一分钱都投进那家银行了，马修去年秋天还签了几张票据要还。林德太太劝我卖掉农场，找个地方寄宿。我想，她是说住到她家去。农场地方小，房子又旧，卖不了多少，不过那些钱该够我生活。幸好你有奖学金，往后总算有了着落。只是放假时，你再也没有一个家可以回了。我很难过，可你总能想办法安顿好的。
          emotion: sad
        - id: ch01-b17
          speaker: narrator
          text: 玛丽拉再也撑不住，伤心地哭了起来。
        - id: ch01-b18
          speaker: anne
          text: 你不能卖掉绿山墙。
        - id: ch01-b19
          speaker: marilla
          text: 安妮，我也不愿意卖。可你自己看得明白。我不能一个人住在这里。烦恼和孤单会把我逼疯，我的眼睛也一定会坏掉。
          emotion: sad
        - id: ch01-b20
          speaker: anne
          text: 你不用一个人住。我会陪着你。我不去雷德蒙德了。
        - id: ch01-b21
          speaker: narrator
          text: 玛丽拉从双手间抬起憔悴的脸，盯着安妮。
        - id: ch01-b22
          speaker: marilla
          text: 不去雷德蒙德？你到底是什么意思？
          emotion: surprised
        - id: ch01-b23
          speaker: anne
          text: 就是我说的意思。我不接受奖学金。你从城里回来的那天晚上，我就决定了。你为我做了那么多，如今你遇上难处，我怎么可能把你一个人留下？这些日子我一直在想，也一直在安排。现在就把计划全说给你听。巴里先生想把农场租一年，你不用再操心农场。我要去教书。我申请了这里的学校，不过我想自己得不到，因为校董大概已经答应了吉尔伯特·布莱思。卡莫迪学校可以要我，布莱尔先生昨晚在店里亲口说的。那里当然不如埃文利方便，也没有这么称心，但我可以住在家里。天气暖和时，我自己驾车往返。到了冬天，每逢星期五我也能回来。我们留一匹马就行。我全都计划好了。我还会读书给你听，想办法让你开心。你不会无聊，也不会孤单。我们两个人守着这个家，一样能过得舒适又幸福。
        - id: ch01-b24
          speaker: narrator
          text: 玛丽拉一声不响地听着这一切，只觉得眼前的一切都像一场梦。
        - id: ch01-b25
          speaker: marilla
          text: 安妮，只要你留在这里，我当然能把日子过好。可我不能让你为了我作出这么大的牺牲。那太可怕了。
        - id: ch01-b26
          speaker: anne
          text: 胡说！这才不是牺牲。再没有什么比放弃绿山墙更糟，也没有什么会让我更难过。我们一定得保住这个亲爱的老地方。我已经决定了。我不去雷德蒙德，我要留在这里教书。你一点儿也不用替我担心。
          emotion: happy
        - id: ch01-b27
          speaker: marilla
          text: 可是你的志向怎么办？还有那些计划呢？
        - id: ch01-b28
          speaker: anne
          text: 我的志向一点儿也没变，只是换了目标。我要做个好老师，还要保住你的眼睛。我也会在家自学，自己给自己上一套大学课程。我有几十个计划呢，这一个星期都在琢磨。我要把自己最好的东西交给这里的生活，我相信，生活也会把最好的东西还给我。
        - id: ch01-b29
          speaker: anne
          text: 离开女王学院时，我觉得未来像一条笔直的路，在眼前一直伸向很远的地方。如今，路上出现了一个转弯。我不知道弯道那边有什么，可我愿意相信，最好的东西就在那里。那个转弯自有一种迷人的地方。弯道后面的路会怎么延伸？那里会有怎样青翠灿烂的树木，怎样柔和斑驳的光影？还会有怎样的新景色、新美景，前方又有怎样的曲折、山丘和谷地？
        - id: ch01-b30
          speaker: marilla
          text: 我还是觉得，不该让你放弃奖学金。
        - id: ch01-b31
          speaker: anne
          text: 可你阻止不了我。我已经十六岁半了，而且林德太太说过，我“倔得像头骡子”。玛丽拉，别可怜我。我不喜欢被人可怜，也根本用不着。一想到能留在亲爱的绿山墙，我打心眼里高兴。世上没有谁能像你和我一样爱它，所以我们一定得保住它。
          emotion: happy
        - id: ch01-b32
          speaker: marilla
          text: 你这个上天赐给我的好姑娘！你简直给了我一条新生命。照理说，我该硬下心来逼你上大学。可我知道自己办不到，也就不试了。不过，安妮，我一定会补偿你的。
        - id: ch01-b33
          speaker: narrator
          text: 安妮·雪莉放弃上大学，打算留在家乡教书。消息传遍埃文利以后，人们议论纷纷。大多数好心人不知道玛丽拉眼睛的事，都觉得安妮犯了傻。艾伦太太却不这么想。她亲口说了许多赞许的话，让安妮欢喜得眼里含满泪水。善良的林德太太也不觉得她傻。
        - id: ch01-b34
          speaker: narrator
          text: 一天傍晚，林德太太来到绿山墙。安妮和玛丽拉正坐在前门口，四周笼着夏夜温暖芬芳的暮色。每当黄昏降临，白色飞蛾便会在花园里扑飞，薄荷的气息也会弥漫在带露水的空气中。她们很喜欢在这样的时候坐在那里。
        - id: ch01-b35
          speaker: narrator
          text: 林德太太长长吐了口气，把结实沉重的身子安顿在门旁的石凳上，显得又疲惫，又如释重负。长凳后面，一排高高的蜀葵开着粉红和黄色的花。
        - id: ch01-b36
          speaker: mrs_lynde
          text: 说真的，我现在只要能坐下就高兴。我站着忙了整整一天，两只脚驮着两百磅走来走去，可真不轻松。玛丽拉，不发胖是天大的福气，你可要懂得珍惜。安妮，我听说你不打算上大学了。知道以后，我可高兴了。你现在学到的知识，已经够一个女人舒舒服服过日子。我可不赞成姑娘跟男人一起上大学，把拉丁文、希腊文，还有那些乱七八糟的东西，全都塞进脑袋里。
        - id: ch01-b37
          speaker: anne
          text: 可我还是要学拉丁文和希腊文。我就在绿山墙读完文科课程，大学里该学什么，我一样也不落。
        - id: ch01-b38
          speaker: narrator
          text: 林德太太吓得双手一举，仿佛听见了什么大逆不道的话。
        - id: ch01-b39
          speaker: mrs_lynde
          text: 安妮·雪莉，你会把自己活活累死的。
          emotion: fearful
        - id: ch01-b40
          speaker: anne
          text: 才不会呢，我会越学越有精神。我不会做得太过头。就像“乔赛亚·艾伦的妻子”说的，我会做得“刚刚适中”。漫长的冬夜里，我有大把空闲，而且我对精巧的针线活一点儿天分也没有。你知道，我要去卡莫迪教书。
        - id: ch01-b41
          speaker: mrs_lynde
          text: 我可不知道。我只知道，你要在埃文利教书了。校董们已经决定把学校交给你。
        - id: ch01-b42
          speaker: anne
          text: 林德太太！怎么会？我以为他们已经答应吉尔伯特·布莱思了！
          emotion: surprised
        - id: ch01-b43
          speaker: mrs_lynde
          text: 原本是答应了。可吉尔伯特听说你也申请了，就去找校董。他们昨晚正好在学校开事务会议。吉尔伯特撤回了自己的申请，还提议让校董接受你的。他说，他要去白沙镇教书。他当然知道你有多想留在玛丽拉身边。我得说，他这事办得又体贴又厚道，就是这么回事。也真肯牺牲。去白沙镇，他得自己付食宿费，可谁都知道，他还得靠自己挣钱上大学。校董们就这样决定要你了。昨晚托马斯回家告诉我，可把我高兴坏了。
        - id: ch01-b44
          speaker: anne
          text: 我觉得自己不该接受。我是说，我不该让吉尔伯特为了我作出这么大的牺牲。
        - id: ch01-b45
          speaker: mrs_lynde
          text: 如今你也拦不住他。他已经和白沙镇的校董签了文书，你再拒绝，对他也没有一点儿好处。你当然得接下这所学校。派伊家已经没有孩子来上学，你往后会顺顺当当。乔西是最后一个，她走了可真是件大好事。过去二十年，埃文利学校里总有这个或那个派伊家的孩子。我猜他们一辈子的使命，就是不断提醒老师，人间并不是他们的家。我的老天，巴里家山墙那边一直挤眉弄眼、闪个不停，那到底是什么？
        - id: ch01-b46
          speaker: anne
          text: 是戴安娜在发信号，叫我过去。我们还一直照着从前的老办法做呢。请原谅，我得跑过去看看她有什么事。
        - id: ch01-b47
          speaker: narrator
          text: 安妮像小鹿一样飞奔下长满三叶草的斜坡，转眼就消失在闹鬼森林浓密的冷杉树影里。林德太太一直望着她的背影，目光里满是疼爱。
        - id: ch01-b48
          speaker: mrs_lynde
          text: 她有些地方还很有孩子气。
        - id: ch01-b49
          speaker: marilla
          text: 可在另一些地方，她已经更像个女人了。
        - id: ch01-b50
          speaker: narrator
          text: 玛丽拉说这话时，短暂地恢复了从前那种干脆尖锐。可这已经不再是她最鲜明的性情。当天晚上，林德太太对托马斯说得很明白。
        - id: ch01-b51
          speaker: mrs_lynde
          text: 玛丽拉·卡思伯特的心可变柔软了。就是这么回事。
        - id: ch01-b52
          speaker: narrator
          text: 第二天傍晚，安妮去了埃文利的小墓地。她把新鲜的花放在马修坟上，又给那株苏格兰玫瑰浇了水。她喜欢这个小地方的平和与宁静，一直留到暮色降临。白杨树发出沙沙声，像朋友在身边压低声音，亲切地说着话。野草在一座座坟墓间自在生长，也仿佛在轻轻私语。
        - id: ch01-b53
          speaker: narrator
          text: 等安妮终于离开墓园，走下通往闪光之湖的长坡，太阳已经落了。眼前的埃文利沉在梦一样的余晖里，仿佛“古老宁静栖居的地方”。空气清新，好像有一阵风刚从蜜甜的三叶草田上吹过。各家屋舍的树木间，点点灯火一盏接一盏亮起来。更远的地方就是大海，朦胧而幽紫。永不停息的涛声传过来，听得人魂牵梦萦。西天铺满柔和交融的绚丽色彩，池塘把这一切映成更轻柔的层层光影。眼前所有的美深深震动了安妮的心。她满怀感激地敞开灵魂，让这一切流进心里。
        - id: ch01-b54
          speaker: anne
          text: 亲爱的老世界，你是这么美丽。我真高兴，自己能活在你的怀抱里。
          emotion: happy
        - id: ch01-b55
          speaker: narrator
          text: 走到半山腰，一个高个子少年吹着口哨，从布莱思家宅前的大门里走出来。是吉尔伯特。他认出安妮，唇边的口哨声立刻停了。他彬彬有礼地抬帽致意，本来打算一句话也不说，就这样走过去。可是安妮停下脚步，向他伸出了手。
        - id: ch01-b56
          speaker: anne
          text: 吉尔伯特，谢谢你把学校让给我。你真的太好了。我想让你知道，我很感激。
        - id: ch01-b57
          speaker: narrator
          text: 安妮的双颊红得发烫。吉尔伯特热切地握住了她伸来的手。
        - id: ch01-b58
          speaker: gilbert
          text: 这根本算不上我有多好，安妮。能替你做这一点小事，我很高兴。从现在起，我们能做朋友了吗？你真的原谅我从前犯的错了？
        - id: ch01-b59
          speaker: narrator
          text: 安妮笑了。她想把手抽回来，却没有成功。
        - id: ch01-b60
          speaker: anne
          text: 在池塘码头那一天，我就已经原谅你了，只是当时自己还不知道。我那时真是只固执的小傻鹅。我一直……反正不妨把话全说出来。从那以后，我一直很后悔。
        - id: ch01-b61
          speaker: gilbert
          text: 我们会成为最好的朋友。安妮，我们生来就该做好朋友，你和命运作对得已经够久了。我知道，我们能在许多事情上互相帮助。你还会继续学习，对不对？我也会。来吧，我送你回家。
          emotion: happy
        - id: ch01-b62
          speaker: narrator
          text: 安妮终于回到绿山墙，走进厨房时，玛丽拉好奇地看着她。
        - id: ch01-b63
          speaker: marilla
          text: 刚才是谁和你一起从小路走回来的？
        - id: ch01-b64
          speaker: anne
          text: 吉尔伯特·布莱思。我在巴里家的山坡上遇见他。
        - id: ch01-b65
          speaker: narrator
          text: 安妮发现自己竟然脸红了，心里不免有点恼火。玛丽拉干巴巴地笑了。
        - id: ch01-b66
          speaker: marilla
          text: 我可不知道，你和吉尔伯特已经要好到能在大门口站上半个钟头，说个不停了。
        - id: ch01-b67
          speaker: anne
          text: 我们以前并不要好，我们一直是很好的敌人。不过我们已经决定，以后做很好的朋友要明智得多。我们真的说了半个钟头吗？我觉得才过了几分钟。可是你也明白，玛丽拉，我们有整整五年没说的话，得慢慢补回来呢。
        - id: ch01-b68
          speaker: narrator
          text: 那天夜里，安妮久久坐在窗边，心中有一种快乐的满足陪伴着她。风在樱桃树枝间轻轻呜鸣，像猫儿发出柔软的呼噜声。薄荷的香气从下面一阵阵飘上来。星星在洼地里尖尖的冷杉树梢上闪烁，戴安娜的灯光透过那道旧缺口，远远亮着。
        - id: ch01-b69
          speaker: narrator
          text: 自从离开女王学院回来的那一夜，安妮眼前的天地已经收窄了。可就算摆在脚下的道路从此变得狭窄，她也知道，宁静幸福的花朵仍会一路开放。真诚劳动带来的喜悦、值得追求的理想，还有心意相投的友谊，这些都会属于她。谁也夺不走她与生俱来的想象力，更夺不走那个由梦想筑成的理想世界。何况，路上永远还有那个转弯处。
        - id: ch01-b70
          speaker: anne
          text: 上帝安居天庭，世间一切安好。
