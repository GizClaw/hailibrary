audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖从容，带着细腻而机智的讲述感
        timbre: 清澈柔和
        pace: 舒缓而有变化
        pitch: 中音
    anne:
      display_name: 安妮
      tts:
        delivery: 热切灵动，想法接连涌出，真挚而富于想象
        timbre: 清亮稚嫩
        pace: 明快，动情处自然放慢
        pitch: 中高音
    marilla:
      display_name: 玛丽拉
      tts:
        delivery: 干脆严谨，言语直截了当，偶尔透出克制的温情
        timbre: 清晰沉稳
        pace: 中等
        pitch: 中音
    diana:
      display_name: 戴安娜
      tts:
        delivery: 亲切坦率，语气实际，待朋友温柔热诚
        timbre: 圆润清甜
        pace: 中等偏快
        pitch: 中高音
    mrs_barry:
      display_name: 巴里太太
      tts:
        delivery: 严厉冷淡，认定一件事后不轻易动摇
        timbre: 结实冷峻
        pace: 中等
        pitch: 中音
  chapters:
    - id: ch01
      title: 十月里的邀请
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            十月里的绿山墙美极了。洼地的白桦黄得像阳光，果园后的枫树红得又浓又亮。夹道的野樱桃换上深红和青铜绿，田野躺在新长的青草间晒太阳。安妮看着满眼的颜色，整个人都陶醉了。
        - id: ch01-b02
          speaker: narrator
          text: >-
            星期六早晨，她抱着一大捧艳丽的树枝，像跳舞一样进了屋。
        - id: ch01-b03
          speaker: anne
          text: >-
            啊，玛丽拉，我真庆幸自己住在一个有十月的世界里！要是九月一过，马上就是十一月，那该多可怕。您看看这些枫枝，心里难道不会一颤，再颤好几下吗？我要拿它们装点房间。
          emotion: happy
        - id: ch01-b04
          speaker: marilla
          text: >-
            净是些会弄得到处脏兮兮的东西。安妮，你塞进房间的野东西已经够多了。卧室是用来睡觉的。
        - id: ch01-b05
          speaker: anne
          text: >-
            可卧室也是用来做梦的呀。屋里摆着漂亮东西，梦也会好看得多。我要把树枝插进旧蓝水罐，摆到桌上。
        - id: ch01-b06
          speaker: marilla
          text: >-
            那就小心点，别让叶子掉满楼梯。今天下午我要去卡莫迪参加妇女互助会，天黑前大概回不来。你得给马修和杰里预备晚饭。这次可别等人都坐到桌边，才记起还没沏茶。
        - id: ch01-b07
          speaker: anne
          text: >-
            我那次居然忘了，实在太糟糕了。可那天下午，我一直忙着给紫罗兰谷想名字，脑子再也放不下别的事。马修一句也没怪我。他自己沏了茶，还说晚一点没关系。我就在旁边给他讲仙女故事，所以他一点也不觉得等得久。那个故事可美了！我忘了原来的结尾，就自己编了一个。马修说，他根本听不出我是从哪儿接着编的。
        - id: ch01-b08
          speaker: marilla
          text: >-
            就算你半夜忽然想爬起来吃正餐，马修也会说没什么不对。这回你可得把心放在正事上。还有一件事。我也不知道答应你算不算明智，说不定只会让你更心不在焉。不过，你可以请戴安娜来陪你过下午，再留下喝茶。
        - id: ch01-b09
          speaker: narrator
          text: >-
            安妮把两只手一下合在胸前。
        - id: ch01-b10
          speaker: anne
          text: >-
            啊，玛丽拉，这太美妙了！原来您还是有想象力的，不然怎么会知道我多盼望这件事呢？那感觉一定特别像大人。有客人在，我绝不会忘记沏茶。那我能用玫瑰花苞茶具吗？
          emotion: happy
        - id: ch01-b11
          speaker: marilla
          text: >-
            当然不能！你明知道，只有牧师或互助会的人来了，我才用那套餐具。摆旧棕色茶具就行。不过你可以开那只黄色小罐，吃里面的樱桃果酱。那果酱好像已经开始发酵，也该吃掉了。再切点水果蛋糕，拿些曲奇和姜饼。
        - id: ch01-b12
          speaker: anne
          text: >-
            我都看见自己坐在桌子上首倒茶了。我还要问戴安娜要不要糖！我明明知道她不要，可招待客人当然得装作不知道，再劝她多吃一块水果蛋糕，多添一点果酱。啊，光是想一想，我心里就觉得奇妙极了。她来了，我能带她去客房脱帽子，再去客厅坐吗？
          emotion: happy
        - id: ch01-b13
          speaker: marilla
          text: >-
            不行，起居室足够你们用了。前几天教堂联谊会还剩半瓶覆盆子甜酒，就在起居室壁橱第二层。你们喜欢的话，下午可以喝一点，配块曲奇。马修要运土豆上船，喝茶时多半回不来。
        - id: ch01-b14
          speaker: narrator
          text: >-
            安妮飞奔下洼地，跑过树精的水泡，又沿云杉小径冲上果园坡，请戴安娜来喝茶。玛丽拉驾车去卡莫迪后不久，戴安娜就到了。她穿着第二好的裙子，完全是一副正式赴茶会的样子。平时她总不敲门，直接跑进厨房，这次却端端正正地敲了前门。
        - id: ch01-b15
          speaker: narrator
          text: >-
            安妮也穿了第二好的衣裳，规规矩矩地来开门。两个姑娘一本正经地握手，仿佛从来不认识。她们就这样别别扭扭地庄重着。戴安娜先去东山墙房间脱帽子，又在起居室里并好脚尖，坐足了十分钟。
        - id: ch01-b16
          speaker: anne
          text: >-
            你母亲近来好吗？
        - id: ch01-b17
          speaker: narrator
          text: >-
            安妮问得礼貌极了，就好像那天早晨没看见巴里太太精神十足地摘苹果。
        - id: ch01-b18
          speaker: diana
          text: >-
            她很好，谢谢。卡思伯特先生今天下午是在给“百合沙洲”运土豆吧？
        - id: ch01-b19
          speaker: narrator
          text: >-
            可就在上午，戴安娜还坐过马修的马车，去哈蒙·安德鲁斯先生家。
        - id: ch01-b20
          speaker: anne
          text: >-
            是的。今年我们家的土豆收成很好。希望你们家的也不错。
        - id: ch01-b21
          speaker: diana
          text: >-
            还不错，谢谢。你们已经摘了很多苹果吗？
        - id: ch01-b22
          speaker: anne
          text: >-
            啊，多极了！戴安娜，我们去果园摘红甜苹果吧。玛丽拉说，树上剩下的都归我们吃。她真是个慷慨的人。她还准我们喝茶时吃水果蛋糕和樱桃果酱。可把招待客人的东西先说出来很失礼，所以我不能告诉你，她还准我们喝什么。我只能说，名字开头是“覆盆”两个字，颜色鲜红。我最喜欢鲜红的饮料了。红色的东西喝起来，好像比别的颜色甜一倍。你不觉得吗？
          emotion: happy
    - id: ch02
      title: 鲜红的饮料
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            果园里的大树枝伸展开来，被沉甸甸的果实压得一直垂到地面，实在招人喜欢。两个姑娘在那里待了大半个下午。草地一角躲过了霜，还是绿油油的，温和的秋日阳光久久照在那里。她们坐在草上吃苹果，嘴里的话一刻也没停。
        - id: ch02-b02
          speaker: narrator
          text: >-
            戴安娜带来了一肚子学校新闻。她如今非得跟格蒂·派伊同桌，烦透了。格蒂总把铅笔弄得吱吱响，听得戴安娜浑身发冷。鲁比·吉利斯用一颗魔法石子，把疣全弄没了。这事千真万确。石子是溪边的老玛丽·乔给她的，先拿它擦疣，等新月升起，再从左肩后面扔出去，疣就会消失。
        - id: ch02-b03
          speaker: narrator
          text: >-
            还有人把查理·斯隆和埃姆·怀特的名字写在门廊墙上，埃姆气坏了。萨姆·博尔特在课堂上顶撞菲利普斯先生，挨了一顿抽。他父亲跑到学校警告先生，再碰自己的孩子一下试试。玛蒂·安德鲁斯添了一顶红风帽，还有一件带流苏的蓝色交叠上衣。她为了这身打扮摆出的架子，简直叫人恶心。
        - id: ch02-b04
          speaker: narrator
          text: >-
            莉齐·赖特也不理梅米·威尔逊了，因为梅米那位成年的姐姐，抢走了莉齐那位成年姐姐的心上人。学校里人人都很想安妮，盼着她回去。然后，戴安娜说到了吉尔伯特·布莱思——
        - id: ch02-b05
          speaker: narrator
          text: >-
            安妮一点也不想听吉尔伯特的消息。她连忙跳起来，提议回屋喝覆盆子甜酒。
        - id: ch02-b06
          speaker: narrator
          text: >-
            安妮在起居室食品柜的第二层找了又找，没找到甜酒。她四处搜了一遍，才在最高一层的最里面发现那只瓶子。她把瓶子放上托盘，又摆了一只大玻璃杯。
        - id: ch02-b07
          speaker: anne
          text: >-
            戴安娜，你自己倒吧。我刚才吃了那么多苹果，现在什么也喝不下。
        - id: ch02-b08
          speaker: narrator
          text: >-
            戴安娜给自己倒了满满一杯。她先欣赏了一会儿那鲜红的颜色，才很文雅地一小口一小口喝起来。
        - id: ch02-b09
          speaker: diana
          text: >-
            安妮，这覆盆子甜酒真好喝。我以前都不知道它这么好喝。
          emotion: happy
        - id: ch02-b10
          speaker: anne
          text: >-
            你喜欢就好，想喝多少都可以。我要去厨房把火拨旺点。一个人当家，要惦记的事情可真多，对不对？
        - id: ch02-b11
          speaker: narrator
          text: >-
            安妮从厨房回来时，戴安娜正在喝第二杯。安妮又热情地劝了好几回，戴安娜没怎么推辞，接着喝了第三杯。每一杯都倒得满满的，而这饮料的味道，确实好极了。
        - id: ch02-b12
          speaker: diana
          text: >-
            这是我喝过最好喝的甜酒。比林德太太做的强多了，她还总夸自己的呢。这跟她做的，味道一点也不像。
          emotion: happy
        - id: ch02-b13
          speaker: anne
          text: >-
            玛丽拉做的当然比林德太太做的好。玛丽拉做饭可有名了，她现在也在教我。不过我跟你说，做饭实在太难。它一点想象的余地也不给人，规矩说什么，你就只能一步不差地照着做。
        - id: ch02-b14
          speaker: anne
          text: >-
            上回我烤蛋糕，竟然忘了放面粉。那时候我正在想一个关于我们俩的绝妙故事。你得了天花，病得快要死了，所有人都丢下你，只有我勇敢地来到床边，把你照料得活了过来。后来我也染上天花，死了，埋在墓园那几棵白杨树下。
        - id: ch02-b15
          speaker: anne
          text: >-
            你就在我的墓旁种了一丛玫瑰，每天用眼泪浇它，永远、永远也忘不了那个为你牺牲生命的少年朋友。啊，那个故事太悲惨了！我一边拌蛋糕，一边哭得像下雨。可我把面粉忘了，蛋糕当然失败得惨不忍睹。蛋糕里少了面粉，怎么能行呢？玛丽拉气坏了，我一点也不怪她。我真叫她操心。
        - id: ch02-b16
          speaker: anne
          text: >-
            上星期的布丁酱也害她丢尽了脸。星期二正餐吃葡萄干布丁，还剩半只布丁和满满一罐酱汁。玛丽拉说，剩下的够再吃一顿，让我拿到食品柜里，把盖子盖好。我真的一心想盖严实。可是端进去的时候，我正想象自己是一位修女。我当然是新教徒，可我在故事里成了天主教徒，因为心碎了，就戴上头巾，躲进修道院。
        - id: ch02-b17
          speaker: anne
          text: >-
            结果，我把盖布丁酱的事忘得干干净净。第二天早晨忽然想起来，我赶紧冲进食品间。戴安娜，你尽力想象一下吧。一只老鼠淹死在布丁酱里！我当时有多害怕呀！我用勺子把它捞出来，扔到院子里，又换了三遍水洗那把勺子。
        - id: ch02-b18
          speaker: anne
          text: >-
            玛丽拉去挤牛奶了，我本来想着等她回来，就问问能不能把酱汁喂猪。可她一回来，我又在想自己是个霜精灵，穿过树林，把叶子变成红色或黄色，随它们喜欢。于是我又忘了布丁酱，玛丽拉还打发我去摘苹果。
        - id: ch02-b19
          speaker: anne
          text: >-
            偏偏那天上午，斯宾塞维尔的切斯特·罗斯先生和太太来了。他们两位都特别讲究，罗斯太太尤其讲究。玛丽拉叫我进去时，正餐已经摆好，大家也坐下了。我拼命让自己显得礼貌又端庄。就算我长得不漂亮，也希望罗斯太太看得出我是个有淑女风度的小姑娘。
        - id: ch02-b20
          speaker: anne
          text: >-
            一切都很顺利，直到我看见玛丽拉走进来。她一只手端着葡萄干布丁，另一只手提着那罐重新热过的酱汁。戴安娜，那一刻太可怕了！我一下全想起来，猛地站起来，尖声喊：“玛丽拉，那布丁酱绝对不能吃！里面淹死过一只老鼠，我先前忘了告诉您！”
        - id: ch02-b21
          speaker: anne
          text: >-
            就算我活到一百岁，也忘不了那一刻。罗斯太太只管盯着我看，我羞得恨不得钻进地板。她把家里料理得那么完美，会怎么看我们呢？玛丽拉的脸红得像火，可当时一个字也没说。她把布丁和酱汁端出去，换了一碟草莓果酱回来。
        - id: ch02-b22
          speaker: anne
          text: >-
            她甚至还请我吃，可我一口也咽不下。那感觉，就像有人把烧红的炭一块块堆到我头上。罗斯太太一走，玛丽拉就狠狠训了我一顿。咦，戴安娜，你怎么了？
    - id: ch03
      title: 没喝成的茶
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            戴安娜摇摇晃晃地站起来，马上又坐了回去，两手捂住脑袋。
        - id: ch03-b02
          speaker: diana
          text: >-
            我……我难受得厉害。我……我得马上回家。
        - id: ch03-b03
          speaker: anne
          text: >-
            啊，茶还没喝呢，你可不能现在回家！我马上就去准备，这就沏茶。
          emotion: surprised
        - id: ch03-b04
          speaker: diana
          text: >-
            我得回家。
        - id: ch03-b05
          speaker: narrator
          text: >-
            戴安娜的神情有些迟钝，口气却很坚决。
        - id: ch03-b06
          speaker: anne
          text: >-
            那至少让我给你拿点吃的。吃一点水果蛋糕和樱桃果酱吧。你先在沙发上躺一会儿，很快就会好起来。你到底哪里不舒服？
        - id: ch03-b07
          speaker: diana
          text: >-
            我得回家。
        - id: ch03-b08
          speaker: narrator
          text: >-
            除了这句话，她什么也不肯说。安妮怎么劝都没有用。
        - id: ch03-b09
          speaker: anne
          text: >-
            我从没听说客人连茶也不喝就回家的。啊，戴安娜，你该不会真的要出天花了吧？要真是那样，我一定去照料你，绝不会丢下你。不过我真希望，你至少喝过茶再走。你究竟怎么不舒服？
          emotion: sad
        - id: ch03-b10
          speaker: diana
          text: >-
            我头晕得厉害。
        - id: ch03-b11
          speaker: narrator
          text: >-
            她走起路来果然晕晕乎乎。安妮眼里含着失望的泪，替她拿来帽子，一直送到巴里家院子的栅栏边。接着，安妮一路哭回绿山墙，把剩下的饮料伤心地放回食品柜，又给马修和杰里预备晚饭。先前那股当家待客的兴致，已经一点也不剩了。
        - id: ch03-b12
          speaker: narrator
          text: >-
            第二天是星期日，从早到晚一直下着倾盆大雨，安妮一步也没离开绿山墙。星期一下午，玛丽拉叫她去林德太太家办事。没过多久，安妮就沿着小路飞奔回来，眼泪不停地往下滚。她冲进厨房，一头扑到沙发上，仿佛世上再没有比她更痛苦的人。
        - id: ch03-b13
          speaker: marilla
          text: >-
            安妮，这次又怎么了？但愿你没又对林德太太说什么无礼的话。
        - id: ch03-b14
          speaker: narrator
          text: >-
            安妮没有回答，只是哭得更凶，声音也更大了。
        - id: ch03-b15
          speaker: marilla
          text: >-
            安妮·雪莉，我问话的时候，你就得回答。马上坐起来，告诉我为什么哭。
        - id: ch03-b16
          speaker: narrator
          text: >-
            安妮坐起身来，简直成了悲剧本身。
        - id: ch03-b17
          speaker: anne
          text: >-
            林德太太今天去过巴里家。巴里太太气坏了！她说，星期六是我把戴安娜灌醉了，还让她那样丢人地回家。她说我一定是个坏透了、邪恶透了的小姑娘，以后永远、永远也不准戴安娜再跟我玩。啊，玛丽拉，悲痛已经把我彻底压垮了。
          emotion: sad
        - id: ch03-b18
          speaker: narrator
          text: >-
            玛丽拉目瞪口呆地看着她，好一会儿才找回声音。
        - id: ch03-b19
          speaker: marilla
          text: >-
            你把戴安娜灌醉了？安妮，到底是你疯了，还是巴里太太疯了？你给她喝了什么？
          emotion: surprised
        - id: ch03-b20
          speaker: anne
          text: >-
            只有覆盆子甜酒。我从来不知道那东西也能让人喝醉，哪怕像戴安娜那样，一口气喝下三大杯。啊，这听上去太像托马斯太太的丈夫了！可我真的不是故意的。
          emotion: sad
        - id: ch03-b21
          speaker: marilla
          text: >-
            醉个鬼！
        - id: ch03-b22
          speaker: narrator
          text: >-
            玛丽拉大步走向起居室的食品柜。架上摆着一只瓶子，她一眼就认出来了。那是她酿了三年的黑醋栗酒。玛丽拉的黑醋栗酒在埃文利很有名，只是有些格外严厉的人很不赞成，巴里太太正是其中之一。
        - id: ch03-b23
          speaker: narrator
          text: >-
            这时玛丽拉才记起来，她根本没照自己说的那样，把覆盆子甜酒放在食品柜里，而是把它拿到地窖去了。她拎着酒瓶回到厨房，拼命想忍住，可脸上的肌肉还是一下下抽动。
        - id: ch03-b24
          speaker: marilla
          text: >-
            安妮，你招惹麻烦的本事可真不小。你给戴安娜喝的不是覆盆子甜酒，是黑醋栗酒。你自己就没尝出味道不一样？
        - id: ch03-b25
          speaker: anne
          text: >-
            我一口都没尝。我以为那就是覆盆子甜酒。我只想好好地……好好地招待她。戴安娜后来难受得厉害，只好回家。巴里太太告诉林德太太，她醉得什么都不知道。她母亲问她怎么了，她只会傻笑，后来倒头睡了好几个钟头。她母亲闻见她呼出来的气味，才知道她喝醉了。昨天她头痛得特别厉害。巴里太太气极了，说什么也不信我不是有意的。
          emotion: sad
        - id: ch03-b26
          speaker: marilla
          text: >-
            不管杯子里是什么，她一口气贪喝三大杯，她母亲倒更该为了这个罚她。就算真是覆盆子甜酒，那么大的杯子喝上三杯，也足够叫她难受。现在，那些因为我酿黑醋栗酒就处处反对我的人，总算抓到好把柄了。
        - id: ch03-b27
          speaker: marilla
          text: >-
            其实三年前，听说牧师不赞成以后，我就再没酿过。留下这一瓶，只是预备生病时用。好了，孩子，别哭了。我看这事不能怪你，虽说闹成这样，我也很遗憾。
        - id: ch03-b28
          speaker: anne
          text: >-
            我不能不哭。我的心都碎了。玛丽拉，天上的星宿全在跟我作对。戴安娜和我永远分开了。我们第一次立下友谊誓言时，我怎么会想到有今天呢？
          emotion: sad
    - id: ch04
      title: 说不清的误会
      blocks:
        - id: ch04-b01
          speaker: marilla
          text: >-
            别说傻话。等巴里太太明白这事不能怪你，自然会改变主意。她大概以为你是为了恶作剧，或者因为别的蠢念头，故意给戴安娜喝酒。今晚你最好去她家，把事情从头到尾说清楚。
        - id: ch04-b02
          speaker: anne
          text: >-
            一想到要面对戴安娜那位受到伤害的母亲，我的勇气就全没了。玛丽拉，还是您替我去吧。您比我有威严得多，她也许肯听您的话。
        - id: ch04-b03
          speaker: marilla
          text: >-
            好吧，我去。别再哭了，安妮，事情会解决的。
        - id: ch04-b04
          speaker: narrator
          text: >-
            玛丽拉想了想，也觉得由自己去更明智。可是，当她从果园坡回来时，已经不再相信事情会解决了。安妮一直守着她，一见那个人影，立刻跑到门廊口迎上去。
        - id: ch04-b05
          speaker: anne
          text: >-
            啊，玛丽拉，我一看您的脸，就知道一点用也没有。巴里太太还是不肯原谅我吗？
          emotion: sad
        - id: ch04-b06
          speaker: marilla
          text: >-
            巴里太太！我从没见过那么不讲道理的女人。我告诉她，这从头到尾就是一场误会，根本不能怪你，可她偏不肯信。她还没完没了地拿我的黑醋栗酒说事，说我总声称那酒不可能对任何人有一点影响。
          emotion: angry
        - id: ch04-b07
          speaker: marilla
          text: >-
            我也干脆告诉她，黑醋栗酒本来就不是让人一次喝三大杯的。要是我管教的孩子这么贪嘴，我准会结结实实揍她一顿，让她清醒过来。
          emotion: angry
        - id: ch04-b08
          speaker: narrator
          text: >-
            玛丽拉气冲冲地转身进了厨房，把一颗万分苦恼的小小心灵独自留在门廊。过了一会儿，安妮没戴帽子，一个人走进寒冷的秋日暮色。她已经下定决心，稳稳地穿过枯黄的苜蓿地，跨过圆木桥，又走进云杉林。
        - id: ch04-b09
          speaker: narrator
          text: >-
            一弯苍白的小月亮低低挂在西边树林上空，替她照着路。巴里太太听见怯生生的敲门声，过来打开门。门阶上站着一个求情的小姑娘，嘴唇发白，目光恳切。
        - id: ch04-b10
          speaker: narrator
          text: >-
            巴里太太的脸立刻冷了下来。她的喜欢和厌恶一向都很强烈，生起气来也冷冰冰、阴沉沉的，这样的怒气最难平息。公平地说，她确实相信安妮存心使坏，故意把戴安娜灌醉。她也真怕女儿继续跟这样的孩子来往，会受到坏影响。
        - id: ch04-b11
          speaker: mrs_barry
          text: >-
            你来做什么？
        - id: ch04-b12
          speaker: narrator
          text: >-
            安妮把两只手合在一起。
        - id: ch04-b13
          speaker: anne
          text: >-
            啊，巴里太太，请您原谅我。我不是故意要……要让戴安娜喝醉的。我怎么可能做那种事呢？请您想一想，假如您是个可怜的孤儿，被好心人收养，在全世界只有一个知心朋友，您会故意把她灌醉吗？
          emotion: sad
        - id: ch04-b14
          speaker: anne
          text: >-
            我真的一直以为那是覆盆子甜酒。求求您，别说以后再也不许戴安娜跟我玩。要是您这样做，我这一辈子都会被悲哀的乌云罩住。
          emotion: sad
        - id: ch04-b15
          speaker: narrator
          text: >-
            这番话要是说给善良的林德太太听，她转眼就会心软。可巴里太太半点也没被打动，反倒更生气了。安妮满口大词，还配着戏剧般的手势，这叫她怀疑孩子是在取笑自己。于是，她冷酷地开了口。
        - id: ch04-b16
          speaker: mrs_barry
          text: >-
            我看，你不是个适合跟戴安娜来往的小姑娘。你最好回家去，好好管住自己。
        - id: ch04-b17
          speaker: narrator
          text: >-
            安妮的嘴唇颤抖起来。
        - id: ch04-b18
          speaker: anne
          text: >-
            那您能不能让我最后见戴安娜一面，跟她告别？
          emotion: sad
        - id: ch04-b19
          speaker: mrs_barry
          text: >-
            戴安娜跟她父亲去卡莫迪了。
        - id: ch04-b20
          speaker: narrator
          text: >-
            巴里太太说完便转身进屋，关上了门。
    - id: ch05
      title: 最后的希望
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: >-
            安妮回到绿山墙时，已经被绝望压得平静下来。
        - id: ch05-b02
          speaker: anne
          text: >-
            我最后一点希望也破灭了。我亲自去见巴里太太，可她待我非常无礼。玛丽拉，我看她绝不是一位有教养的女人。现在除了祈祷，再也没有别的办法。可我也不大相信祈祷能有什么用。因为我觉得，就算上帝亲自出手，碰上巴里太太这样固执的人，也不会有多少办法。
          emotion: sad
        - id: ch05-b03
          speaker: marilla
          text: >-
            安妮，你不该说这种话。
        - id: ch05-b04
          speaker: narrator
          text: >-
            玛丽拉努力压住那股不该有的笑意，却吃惊地发现，自己越压越想笑。果然，到了晚上，她把整件事讲给马修听时，还是为了安妮的苦难开怀大笑起来。
        - id: ch05-b05
          speaker: narrator
          text: >-
            可临睡前，玛丽拉悄悄走进东山墙房间。她看见安妮哭着睡着了，脸上便露出一种少有的温柔。她拨开孩子泪痕斑斑的脸上一绺散发，低声说了一句话。
        - id: ch05-b06
          speaker: marilla
          text: >-
            可怜的小家伙。
        - id: ch05-b07
          speaker: narrator
          text: >-
            接着，她俯下身，轻轻吻了吻枕上那发烫的面颊。
