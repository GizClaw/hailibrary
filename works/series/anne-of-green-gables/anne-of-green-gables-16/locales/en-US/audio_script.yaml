  chapters:
    - id: ch01
      title: An Invitation to Tea
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: "October was beautiful at Green Gables. The birches down in the hollow turned as golden as sunshine. Behind the orchard, the maples were royal crimson. Along the lane, the wild cherry trees wore their loveliest shades of dark red and bronzy green. Out in the open, the fields rested in the sun amid the new growth that followed the harvest. Everywhere Anne looked, she found color, and she delighted in all of it."
        - id: ch01-b02
          speaker: narrator
          text: "One Saturday morning, she danced into the house with her arms full of splendid branches."
        - id: ch01-b03
          speaker: anne_shirley
          text: "Oh, Marilla, I'm so glad I live in a world with Octobers! Wouldn't it be terrible to go straight from September to November? Look at these maple branches. Don't they give you a thrill? Several thrills? I'm going to decorate my room with them."
          emotion: happy
        - id: ch01-b04
          speaker: marilla_cuthbert
          text: "They're messy things. You already fill your room with far too much stuff from outdoors. Bedrooms are meant for sleeping."
        - id: ch01-b05
          speaker: anne_shirley
          text: "They're meant for dreaming too. It's much easier to dream when a room has pretty things in it. I'll put the branches in the old blue jug on my table."
        - id: ch01-b06
          speaker: marilla_cuthbert
          text: "Then don't scatter leaves all over the stairs. I'm going to an Aid Society meeting in Carmody this afternoon, and I probably won't be home before dark. You'll have to make supper for Matthew and Jerry. Remember, don't put the tea on until you sit down to eat. Last time you forgot."
        - id: ch01-b07
          speaker: anne_shirley
          text: "I know. It was dreadful of me. But I was trying to name Violet Vale that afternoon, and there wasn't room in my mind for anything else. Matthew never scolded me. He made the tea himself and said we could wait. I told him a lovely fairy story while it brewed, so the time didn't seem long at all. I forgot the real ending and made one up, but Matthew said he couldn't tell where I joined it."
        - id: ch01-b08
          speaker: marilla_cuthbert
          text: "Matthew would approve if you decided to serve dinner at midnight. Keep your mind on your work this time. And I'm not sure this is wise, because it may make you more scatterbrained than ever, but you may invite Diana over for the afternoon and have her stay for tea."
        - id: ch01-b09
          speaker: narrator
          text: "Anne clasped her hands."
        - id: ch01-b10
          speaker: anne_shirley
          text: "Oh, Marilla, how perfectly lovely! You really can imagine things, or you never would have known how much I've wanted this. It will feel so grown-up. I certainly won't forget the tea when I have company. May I use the rosebud tea set?"
          emotion: happy
        - id: ch01-b11
          speaker: marilla_cuthbert
          text: "Certainly not. The rosebud set is only for the minister or the Aid ladies. Use the old brown one. You may open the little yellow jar of cherry preserves, though. They need using before they start to ferment. Cut some fruitcake too, and serve cookies and snaps."
        - id: ch01-b12
          speaker: anne_shirley
          text: "I can see myself sitting at the head of the table, pouring the tea and asking Diana if she takes sugar. I know she doesn't, of course, but I'll ask as if I had no idea. Then I'll urge her to have another piece of fruitcake and a second helping of preserves. Just thinking about the whole thing gives me such a wonderful feeling. May I take her to the spare room to remove her hat when she arrives? And after that, may we sit in the parlor?"
        - id: ch01-b13
          speaker: marilla_cuthbert
          text: "No. The sitting room is good enough for you. There's half a bottle of raspberry cordial left from the church social. It's on the second shelf of the sitting-room closet. You and Diana may have some with a cookie this afternoon. Matthew will likely be late for tea because he's hauling potatoes to the ship."
        - id: ch01-b14
          speaker: narrator
          text: "Anne flew down through the hollow, past the Dryad's Bubble, and up the spruce path to Orchard Slope to deliver the invitation. Soon after Marilla drove away, Diana arrived in her second-best dress, looking exactly as a girl should when invited to tea. Usually she ran straight into the kitchen without knocking. This time she gave a proper knock at the front door. Anne, also wearing her second best, opened it just as properly. The girls shook hands as solemnly as strangers who had never met. Anne took Diana upstairs to leave her hat in the east gable. Then they sat in the sitting room for ten whole minutes, keeping their toes carefully in position. Only after that did their strange formality begin to wear off."
        - id: ch01-b15
          speaker: anne_shirley
          text: "How is your mother?"
        - id: ch01-b16
          speaker: narrator
          text: "Anne spoke as though she hadn't seen Mrs. Barry picking apples that very morning in perfect health."
        - id: ch01-b17
          speaker: diana_barry
          text: "She's very well, thank you. I suppose Mr. Cuthbert is hauling potatoes to the Lily Sands this afternoon?"
        - id: ch01-b18
          speaker: narrator
          text: "Diana had ridden in Matthew's cart that morning and knew perfectly well that he was."
        - id: ch01-b19
          speaker: anne_shirley
          text: "Yes. Our potato crop is very good this year. I hope your father's is good too."
        - id: ch01-b20
          speaker: diana_barry
          text: "It's fairly good, thank you. Have you picked many apples yet?"
        - id: ch01-b21
          speaker: narrator
          text: "Anne forgot all about being dignified and sprang to her feet."
        - id: ch01-b22
          speaker: anne_shirley
          text: "Oh, ever so many! Let's get some Red Sweetings from the orchard. Marilla says we can have every apple left on the tree. She's very generous. We're having fruitcake and cherry preserves for tea. It isn't polite to tell company what you'll serve, so I won't tell you about the drink. I'll only say its name starts with R and C, and it's bright red. Red drinks taste twice as good as any other color, don't you think?"
    - id: ch02
      title: The Bright Red Drink
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: "The orchard was too delightful to leave. Great branches, heavy with fruit, swept all the way down toward the ground. The girls found a grassy corner where the frost had spared the green and the mellow autumn sunlight still lingered warmly. They sat there most of the afternoon, eating apples and talking as fast as they could manage."
        - id: ch02-b02
          speaker: narrator
          text: "Diana had plenty of school news. She had been made to sit beside Gertie Pye, and she hated it. Gertie squeaked her pencil constantly, and the sound made Diana's blood run cold. Ruby Gillis had charmed away every one of her warts. It was true, Diana insisted. Old Mary Joe from the Creek had given Ruby a magic pebble. Ruby rubbed it over the warts, then threw it behind her left shoulder when the moon was new. After that, the warts all disappeared. Charlie Sloane's name had appeared beside Em White's on the porch wall, and Em was furious about it. Sam Boulter had talked back to Mr. Phillips in class, so the teacher whipped him. Then Sam's father came down to the school and dared Mr. Phillips ever to lay a hand on one of his children again. Mattie Andrews had a new red hood and a blue crossover with tassels. The airs she put on over those clothes were perfectly sickening. Lizzie Wright had stopped speaking to Mamie Wilson. Mamie's grown-up sister had taken the attention of the young man who had been courting Lizzie's grown-up sister. And everyone at school missed Anne terribly and wished she would come back. Then Diana began to mention Gilbert Blythe—"
        - id: ch02-b03
          speaker: narrator
          text: "Anne did not want to hear about Gilbert Blythe. She jumped up and suggested they go inside for raspberry cordial."
        - id: ch02-b04
          speaker: narrator
          text: "There was no bottle on the second shelf of the sitting-room closet. After searching, Anne found one far back on the top shelf. She put it on a tray with a glass and carried it to the table."
        - id: ch02-b05
          speaker: anne_shirley
          text: "Please help yourself, Diana. I don't think I'll have any. After all those apples, I don't feel like drinking it now."
        - id: ch02-b06
          speaker: narrator
          text: "Diana filled the glass, admired the bright red color, and took a dainty sip."
        - id: ch02-b07
          speaker: diana_barry
          text: "Anne, this raspberry cordial is wonderful. I never knew it could taste so good."
        - id: ch02-b08
          speaker: anne_shirley
          text: "I'm so glad you like it. Have as much as you want. I need to stir up the fire. Keeping house puts so many responsibilities on your mind, doesn't it?"
        - id: ch02-b09
          speaker: narrator
          text: "When Anne returned from the kitchen, Diana was drinking a second glass. Anne urged her to have a third, and Diana offered no real objection. The glasses were filled generously, and the bright red drink was certainly delicious."
        - id: ch02-b10
          speaker: diana_barry
          text: "It's the nicest I've ever tasted. It's much better than Mrs. Lynde's, though she brags about hers all the time. It doesn't taste anything like hers."
        - id: ch02-b11
          speaker: anne_shirley
          text: "Of course Marilla's cordial would be better than Mrs. Lynde's. Marilla is a famous cook. She's trying to teach me, but I assure you, cooking is terribly hard for me. There's so little room for imagination. You can't let your mind wander or invent anything. You simply have to follow the rules. The last time I made a cake, I forgot to put in the flour."
        - id: ch02-b12
          speaker: anne_shirley
          text: "I was imagining a beautiful story about us. You were terribly sick with smallpox, and everyone abandoned you. I bravely stayed beside you and nursed you back to life. Then I caught smallpox and died. They buried me under the poplar trees in the graveyard, and you planted a rosebush on my grave. You watered it with your tears and never forgot the friend who gave her life for you. It was so sad that I cried right into the cake batter. But I forgot the flour, and the cake was a complete failure. Flour is very important in a cake."
        - id: ch02-b13
          speaker: anne_shirley
          text: "Marilla was cross, and I can't blame her. I'm a great trial to her. Last week, the pudding sauce was even worse. On Tuesday we had plum pudding, and half the pudding and a whole pitcher of sauce were left. Marilla told me to cover them and put them in the pantry. I truly meant to. But while I carried in the sauce, I imagined I was a nun taking the veil because her heart was broken. I'm a Protestant, of course, but in the story I was Catholic. I forgot the cover completely."
        - id: ch02-b14
          speaker: anne_shirley
          text: "The next morning I remembered and ran to the pantry. Diana, can you imagine my horror? A mouse had drowned in the pudding sauce! I lifted it out with a spoon, threw it into the yard, and washed the spoon in three different waters. Marilla was milking. I planned to ask if I should feed the sauce to the pigs. But when she came in, I was pretending to be a frost fairy, turning the trees red or yellow, whichever color they wanted. I forgot the sauce again, and Marilla sent me to pick apples."
        - id: ch02-b15
          speaker: anne_shirley
          text: "That same morning, Mr. and Mrs. Chester Ross came over from Spencervale. You know how stylish they are, especially Mrs. Ross. When Marilla called me in, dinner was ready and everyone was already sitting at the table. I tried to be perfectly polite and dignified. I wanted Mrs. Ross to think I was a ladylike little girl, even if I'm not pretty. Everything went well until Marilla came in. She had the plum pudding in one hand and the pitcher of warmed-up sauce in the other. Then I remembered everything. I stood straight up in my place and cried, 'Marilla, don't use that sauce! A mouse drowned in it, and I forgot to tell you.'"
        - id: ch02-b16
          speaker: anne_shirley
          text: "I'll remember that awful moment even if I live to be a hundred. Mrs. Ross just stared at me. She's such a perfect housekeeper, and I could only imagine what she thought of us. I wanted to sink right through the floor. Marilla went red as fire, but she didn't say one word then. She carried out the pudding and sauce and brought strawberry preserves instead. She even offered me some, but I couldn't swallow a bite. It felt like she was piling burning coals on my head. After the Rosses left, Marilla gave me a terrible scolding. Why, Diana, what's wrong?"
        - id: ch02-b17
          speaker: narrator
          text: "Diana rose unsteadily, then dropped back into her chair with both hands pressed to her head."
        - id: ch02-b18
          speaker: diana_barry
          text: "I—I'm terribly sick. I—I have to go home now."
        - id: ch02-b19
          speaker: anne_shirley
          text: "You can't go before tea! I'll make it right away. I'll put the kettle on this minute."
          emotion: surprised
        - id: ch02-b20
          speaker: diana_barry
          text: "I have to go home."
        - id: ch02-b21
          speaker: narrator
          text: "Her voice was dull, but she was determined."
        - id: ch02-b22
          speaker: anne_shirley
          text: "Then let me pack you something. Take some fruitcake and cherry preserves. Or lie on the sofa until you feel better. Where do you feel sick?"
        - id: ch02-b23
          speaker: diana_barry
          text: "I have to go home."
        - id: ch02-b24
          speaker: narrator
          text: "Anne pleaded, but Diana would say nothing more."
        - id: ch02-b25
          speaker: anne_shirley
          text: "I've never heard of a guest leaving without tea. Diana, could you really be coming down with smallpox? If you are, I'll nurse you. You can depend on me. I'll never desert you. But I do wish you'd stay through tea. Where do you feel sick?"
        - id: ch02-b26
          speaker: diana_barry
          text: "I'm terribly dizzy."
        - id: ch02-b27
          speaker: narrator
          text: "She certainly walked that way, weaving as she went. With tears of disappointment in her eyes, Anne fetched Diana's hat and walked beside her as far as the Barry yard fence. Then Anne cried all the way back to Green Gables. She sadly returned what remained of the supposed raspberry cordial to the pantry. After that, she made supper for Matthew and Jerry exactly as she had been told, but all the pleasure had gone out of keeping house."
    - id: ch03
      title: A Terrible Accusation
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: "The next day was Sunday. Rain poured in torrents from dawn until dusk, and Anne never once left Green Gables. On Monday afternoon, Marilla sent her on an errand to Mrs. Lynde's. Anne was back in a remarkably short time. She raced up the lane with tears streaming down her cheeks, burst into the kitchen, and threw herself face down on the sofa in complete misery."
        - id: ch03-b02
          speaker: marilla_cuthbert
          text: "What has happened now, Anne? I hope you haven't been rude to Mrs. Lynde again."
        - id: ch03-b03
          speaker: narrator
          text: "Anne gave no answer at all. There were only more tears and louder, stormier sobs."
        - id: ch03-b04
          speaker: marilla_cuthbert
          text: "Anne Shirley, when I ask you something, I expect an answer. Sit up right now and tell me why you're crying."
        - id: ch03-b05
          speaker: narrator
          text: "Anne sat up looking like tragedy itself."
        - id: ch03-b06
          speaker: anne_shirley
          text: "Mrs. Lynde visited Mrs. Barry today, and Mrs. Barry was in a terrible state. She says I got Diana drunk on Saturday and sent her home in a disgraceful condition. She says I must be a truly wicked girl, and she'll never let Diana play with me again. Oh, Marilla, I'm completely overcome with sorrow."
          emotion: sad
        - id: ch03-b07
          speaker: narrator
          text: "Marilla stared at her in utter amazement. At last she found her voice."
        - id: ch03-b08
          speaker: marilla_cuthbert
          text: "You got Diana drunk? Either you or Mrs. Barry has lost all sense. What in the world did you give her?"
          emotion: surprised
        - id: ch03-b09
          speaker: anne_shirley
          text: "I gave her nothing but raspberry cordial. I never dreamed cordial could make anyone drunk, not even after three large glasses like Diana had. Oh, Marilla, saying it aloud sounds so much like Mrs. Thomas's husband. But I didn't mean to get her drunk. I never meant for any of it to happen."
        - id: ch03-b10
          speaker: marilla_cuthbert
          text: "Drunk, fiddlesticks!"
        - id: ch03-b11
          speaker: narrator
          text: "Marilla marched straight to the sitting-room pantry. The bottle on the shelf was one she recognized at once. It held her three-year-old homemade currant wine. Marilla was famous for that wine in Avonlea, although some of the stricter neighbors, including Mrs. Barry, strongly disapproved of it. At the same moment, Marilla remembered her mistake. She had put the raspberry cordial down in the cellar instead of leaving it in the pantry as she'd told Anne. She returned to the kitchen with the wine bottle in her hand. In spite of herself, the corners of her mouth twitched."
        - id: ch03-b12
          speaker: marilla_cuthbert
          text: "Anne, you have a real gift for finding trouble. You served Diana currant wine, not raspberry cordial. Couldn't you tell the difference?"
        - id: ch03-b13
          speaker: anne_shirley
          text: "I didn't taste it. I was sure it was cordial. I only wanted to be a good hostess. Diana became terribly sick and had to go home. Mrs. Barry told Mrs. Lynde that Diana was completely drunk. When her mother asked what was wrong, Diana laughed foolishly, fell asleep, and stayed asleep for hours. Mrs. Barry smelled her breath and understood. Diana had a dreadful headache all day Sunday. Her mother is furious. She'll never believe I didn't do it deliberately."
        - id: ch03-b14
          speaker: marilla_cuthbert
          text: "She ought to punish Diana for being greedy enough to drink three glasses of anything. Three of those big tumblers would make her sick even if it were only cordial. And now everyone who objects to my currant wine will use this against me. I haven't made any for three years, not since I learned the minister disapproved. I kept that bottle only for medicine. There, child, stop crying. I don't see how this was your fault, though I'm sorry it happened."
        - id: ch03-b15
          speaker: anne_shirley
          text: "I have to cry. My heart is broken. The stars in their courses fight against me, Marilla. Diana and I are separated forever. When we promised eternal friendship, I never imagined it would end like this."
          emotion: sad
        - id: ch03-b16
          speaker: marilla_cuthbert
          text: "Don't be foolish. Mrs. Barry will change her mind when she knows you weren't to blame. She probably thinks you did it as some silly joke. Go up this evening and explain everything."
        - id: ch03-b17
          speaker: anne_shirley
          text: "I don't have the courage to face Diana's injured mother. Please go for me, Marilla. You're much more dignified. She's more likely to listen to you."
        - id: ch03-b18
          speaker: marilla_cuthbert
          text: "All right, I will. That's probably wiser. Now stop crying. It will turn out fine."
    - id: ch04
      title: Mrs. Barry Will Not Listen
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: "By the time Marilla returned from Orchard Slope, she had completely changed her mind about everything turning out fine. Anne had been watching for her. The instant Marilla came into sight, Anne flew to the porch door to meet her."
        - id: ch04-b02
          speaker: anne_shirley
          text: "Oh, Marilla, I can tell by your face. It did no good. Mrs. Barry won't forgive me, will she?"
          emotion: sad
        - id: ch04-b03
          speaker: marilla_cuthbert
          text: "Mrs. Barry indeed! Of all the unreasonable women I've ever met, she is the worst. I told her plainly that the whole thing was a mistake and that you weren't at fault, but she simply refused to believe me. Then she made the most of the chance to lecture me about my currant wine. She reminded me that I've always said it couldn't have the least effect on anyone. I told her just as plainly that currant wine was never meant to be swallowed three tumblers at a time. If a child under my care were greedy enough to do that, I'd sober her up with a good spanking."
          emotion: angry
        - id: ch04-b04
          speaker: narrator
          text: "Marilla swept into the kitchen, deeply upset, and left one miserable, distracted little soul standing behind her on the porch. After a while, Anne stepped outside without a hat. The autumn dusk was cold. Still, she had made up her mind, and she walked steadily across the dry clover field, over the log bridge, and up through the spruce grove. A small pale moon hung low above the western woods and lit her way."
        - id: ch04-b05
          speaker: narrator
          text: "Anne knocked timidly at the Barry door. Mrs. Barry opened it and found a white-lipped child on the step, her eyes wide and pleading. Mrs. Barry's face hardened at once. She had strong prejudices and strong dislikes, and once she formed an opinion, she held to it. Her anger was cold and sullen, which made it especially hard to overcome. To be fair, she truly believed Anne had made Diana drunk out of deliberate spite. She was honestly anxious to protect her little daughter from any further friendship with such a child."
        - id: ch04-b06
          speaker: mrs_barry
          text: "What do you want?"
        - id: ch04-b07
          speaker: narrator
          text: "Anne clasped her hands."
        - id: ch04-b08
          speaker: anne_shirley
          text: "Oh, Mrs. Barry, please forgive me. I never meant to intoxicate Diana. How could I? Imagine you were a poor orphan girl adopted by kind people, and you had only one bosom friend in the whole world. Would you get her drunk on purpose? I thought it was raspberry cordial. I was absolutely certain. Please don't forbid Diana to play with me. If you do, you'll cover my whole life with a dark cloud of sorrow."
        - id: ch04-b09
          speaker: narrator
          text: "That speech would have softened kind Mrs. Lynde's heart in an instant. It had no such effect on Mrs. Barry. Instead, it made her even more irritated. She distrusted Anne's grand words and dramatic gestures, and she imagined the child was making fun of her. Her answer came out cold and cruel."
        - id: ch04-b10
          speaker: mrs_barry
          text: "I don't consider you a suitable friend for Diana. Go home and learn to behave yourself."
        - id: ch04-b11
          speaker: narrator
          text: "Anne's lips trembled."
        - id: ch04-b12
          speaker: anne_shirley
          text: "May I see Diana once, just to say goodbye?"
          emotion: sad
        - id: ch04-b13
          speaker: mrs_barry
          text: "Diana went to Carmody with her father."
        - id: ch04-b14
          speaker: narrator
          text: "Mrs. Barry went inside and closed the door. Anne returned to Green Gables, calm because she had no hope left."
    - id: ch05
      title: Poor Little Soul
      blocks:
        - id: ch05-b01
          speaker: anne_shirley
          text: "My last hope is gone. I went to Mrs. Barry myself, and she treated me very rudely. Marilla, I do not think she is a well-bred woman. There's nothing left to do but pray, and I don't have much hope even for that. I don't believe God Himself can do very much with someone as stubborn as Mrs. Barry."
        - id: ch05-b02
          speaker: marilla_cuthbert
          text: "Anne, you mustn't say things like that."
        - id: ch05-b03
          speaker: narrator
          text: "Marilla rebuked Anne while struggling against a most improper urge to laugh. She was dismayed to discover that the urge kept growing stronger instead of fading away. In fact, when she told Matthew the whole story that night, she did laugh heartily over all of Anne's troubles."
        - id: ch05-b04
          speaker: narrator
          text: "But before going to bed, Marilla quietly slipped into the east gable. There she found that Anne had cried herself to sleep. At the sight of the sleeping child, an unfamiliar softness came over Marilla's face."
        - id: ch05-b05
          speaker: marilla_cuthbert
          text: "Poor little soul."
          emotion: sad
        - id: ch05-b06
          speaker: narrator
          text: "She lifted a loose curl from Anne's tear-stained face. Then she bent down and kissed the flushed cheek resting on the pillow."
