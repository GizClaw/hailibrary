audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm, observant, and gently amused
        timbre: clear and rounded
        pace: measured
        pitch: medium
    anne_shirley:
      display_name: Anne Shirley
      tts:
        delivery: vivid, earnest, and eagerly imaginative
        timbre: clear and youthful
        pace: lively
        pitch: medium-high
    marilla_cuthbert:
      display_name: Marilla Cuthbert
      tts:
        delivery: firm, practical, and restrained
        timbre: clear and mature
        pace: steady
        pitch: medium-low
    matthew_cuthbert:
      display_name: Matthew Cuthbert
      tts:
        delivery: shy, gentle, and quietly sincere
        timbre: soft and weathered
        pace: unhurried
        pitch: low
    rachel_lynde:
      display_name: Mrs. Rachel Lynde
      tts:
        delivery: outspoken, assured, and sharply inquisitive
        timbre: full and mature
        pace: deliberate
        pitch: medium
  chapters:
    - id: ch01
      title: A Silent Day at Green Gables
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            Marilla said nothing to Matthew about the trouble that evening. But Anne was still refusing to give in the next morning, and her empty place at breakfast had to be explained. So Marilla told Matthew everything, making sure he understood just how badly Anne had behaved.
        - id: ch01-b02
          speaker: matthew_cuthbert
          text: >-
            Well, Rachel Lynde needed someone to put her in her place. She's always meddling and gossiping.
        - id: ch01-b03
          speaker: marilla_cuthbert
          text: >-
            Matthew Cuthbert, I can't believe you said that. Anne's behavior was dreadful, and now you're defending her. Next you'll tell me she shouldn't be punished at all.
          emotion: surprised
        - id: ch01-b04
          speaker: matthew_cuthbert
          text: >-
            Well now, no, not quite. I suppose she needs a little punishment. Just don't be too hard on her, Marilla. She's never had anyone to teach her what's right. You are going to feed her, aren't you?
        - id: ch01-b05
          speaker: marilla_cuthbert
          text: >-
            Have you ever known me to starve anyone into behaving? She'll get every meal, and I'll take the food upstairs myself. But she's staying there until she agrees to apologize to Mrs. Lynde. That's final, Matthew.
          emotion: angry
        - id: ch01-b06
          speaker: narrator
          text: >-
            Breakfast, dinner, and supper were all very quiet because Anne still would not yield. After each meal, Marilla carried a well-filled tray to the east gable herself. Later she brought it down again, and it never looked much emptier than before. When the last tray came back that evening, Matthew watched it anxiously. He could not tell whether Anne had eaten anything at all.
    - id: ch02
      title: Matthew Goes Upstairs
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            That evening, Marilla went to the back pasture for the cows. Matthew had been lingering near the barns, watching for his chance. As soon as she was gone, he slipped into the house like a burglar and crept upstairs.
        - id: ch02-b02
          speaker: narrator
          text: >-
            Matthew usually moved between the kitchen and his small bedroom off the hall. When the minister came to tea, he sometimes ventured uneasily into the parlor or sitting room. But he had not been upstairs in his own house for four years, not since the spring when he helped Marilla paper the spare bedroom.
        - id: ch02-b03
          speaker: narrator
          text: >-
            He tiptoed down the hall and waited outside the east gable for several minutes. At last, he found enough courage to tap softly, open the door, and peek inside.
        - id: ch02-b04
          speaker: narrator
          text: >-
            Anne sat in the yellow chair by the window, looking sadly into the garden. She seemed so small and unhappy that Matthew's heart hurt for her. He closed the door gently and went to her on tiptoe.
        - id: ch02-b05
          speaker: matthew_cuthbert
          text: Anne, how are you getting along up here?
        - id: ch02-b06
          speaker: narrator
          text: Anne gave him a faint smile.
        - id: ch02-b07
          speaker: anne_shirley
          text: >-
            I'm doing fairly well. I imagine things, and that helps the time go by. It is lonely, of course. But I suppose I should get used to being lonely.
          emotion: sad
        - id: ch02-b08
          speaker: narrator
          text: >-
            She smiled bravely again, facing what she imagined would be long years of lonely imprisonment. Matthew remembered why he had come. Marilla might return at any moment, so he had to speak before it was too late.
        - id: ch02-b09
          speaker: matthew_cuthbert
          text: >-
            Well now, Anne, wouldn't it be better to do it and get it over with? You'll have to sooner or later. Marilla is terribly determined. You should do it right away and be done with it.
        - id: ch02-b10
          speaker: anne_shirley
          text: You mean I should apologize to Mrs. Lynde?
        - id: ch02-b11
          speaker: matthew_cuthbert
          text: >-
            Yes, apologize. That's the word I wanted. Just settle the whole thing somehow.
        - id: ch02-b12
          speaker: anne_shirley
          text: >-
            I could do it for you, I suppose. I really am sorry now, so that part would be true. I wasn't sorry at all last night. I was angry through and through, and I stayed angry the whole night. I woke up three times, and every time I was still furious. But by morning, the anger was gone. It left me feeling terribly empty, and I was so ashamed of myself.
        - id: ch02-b13
          speaker: anne_shirley
          text: >-
            Still, I couldn't bear to go tell Mrs. Lynde. It would be so humiliating. I decided I would stay locked in this room forever instead. But I'd do anything for you, Matthew, if you truly want me to.
        - id: ch02-b14
          speaker: matthew_cuthbert
          text: >-
            Of course I do. It's terribly lonely downstairs without you. Go settle things with her. There's a good girl.
        - id: ch02-b15
          speaker: anne_shirley
          text: >-
            All right. As soon as Marilla comes in, I'll tell her I've repented.
        - id: ch02-b16
          speaker: matthew_cuthbert
          text: >-
            That's right, Anne. But don't tell Marilla I spoke to you. She might think I was interfering, and I promised I wouldn't do that.
        - id: ch02-b17
          speaker: anne_shirley
          text: >-
            Wild horses couldn't drag your secret out of me. Though how could wild horses drag a secret out of anyone?
        - id: ch02-b18
          speaker: narrator
          text: >-
            But Matthew had already gone, frightened by how well his plan had worked. He hurried all the way to the farthest corner of the horse pasture. If Marilla came looking for him, he did not want her to suspect what he had been doing upstairs.
        - id: ch02-b19
          speaker: narrator
          text: >-
            When Marilla came inside, she was pleasantly surprised to hear a sad little voice calling her name over the banisters.
        - id: ch02-b20
          speaker: anne_shirley
          text: Marilla?
        - id: ch02-b21
          speaker: marilla_cuthbert
          text: Well?
        - id: ch02-b22
          speaker: anne_shirley
          text: >-
            I'm sorry I lost my temper and said those rude things. I'm willing to go apologize to Mrs. Lynde.
        - id: ch02-b23
          speaker: marilla_cuthbert
          text: All right. I'll take you there after the milking.
        - id: ch02-b24
          speaker: narrator
          text: >-
            Marilla answered crisply, hiding her relief. She had begun to wonder what on earth she would do if Anne never gave in.
    - id: ch03
      title: Anne Makes Her Apology
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            After the milking, Marilla and Anne set off down the lane. Marilla walked straight and triumphant. Anne drooped beside her, looking thoroughly miserable. But halfway to Mrs. Lynde's house, Anne's misery vanished as if by magic. She raised her head and stepped lightly along, her eyes fixed on the sunset sky. A quiet excitement seemed to shine from her face.
        - id: ch03-b02
          speaker: narrator
          text: >-
            Marilla did not approve of the change. Anne certainly did not look like the humble, sorry child Marilla meant to bring before the offended Mrs. Lynde.
        - id: ch03-b03
          speaker: marilla_cuthbert
          text: What are you thinking about, Anne?
        - id: ch03-b04
          speaker: anne_shirley
          text: I'm imagining exactly what I'll say to Mrs. Lynde.
        - id: ch03-b05
          speaker: narrator
          text: >-
            That answer should have satisfied Marilla, but it did not. Something about her punishment seemed to be going wrong. Anne had no business looking so dreamy and radiant.
        - id: ch03-b06
          speaker: narrator
          text: >-
            Anne kept that glow until they stood before Mrs. Lynde, who was knitting by her kitchen window. Then it disappeared. Her whole face became mournful and repentant. Before anyone spoke, Anne suddenly dropped to her knees in front of the astonished woman and held out both hands beseechingly.
        - id: ch03-b07
          speaker: anne_shirley
          text: >-
            Oh, Mrs. Lynde, I am more sorry than I can possibly say. Even if I used every word in a whole dictionary, it still wouldn't be enough. You'll have to imagine the rest of my sorrow. I behaved terribly to you, and I disgraced my dear friends Matthew and Marilla. They were kind enough to let me stay at Green Gables even though I'm not the boy they wanted.
        - id: ch03-b08
          speaker: anne_shirley
          text: >-
            I've been wicked and ungrateful. I deserve to be punished and turned away by every respectable person forever. You told me the truth, and it was wicked of me to lose my temper over it. Everything you said was true. My hair is red. I am freckled and skinny and ugly.
        - id: ch03-b09
          speaker: anne_shirley
          text: >-
            What I said about you was true too, but I never should have said it aloud. Oh, Mrs. Lynde, please, please forgive me. If you refuse, it will bring a lifetime of sorrow to a poor little orphan girl. You wouldn't do that to her, would you, even if she does have a dreadful temper? Oh, I'm certain you wouldn't. Please say that you forgive me, Mrs. Lynde.
          emotion: sad
        - id: ch03-b10
          speaker: narrator
          text: >-
            Anne clasped her hands, bowed her head, and waited for judgment.
        - id: ch03-b11
          speaker: narrator
          text: >-
            There was no mistaking the sincerity in Anne's trembling voice. Both Marilla and Mrs. Lynde heard it clearly. But Marilla also realized with dismay that Anne was enjoying every moment of this deep humiliation. Anne had thrown herself into the apology so completely that lowering herself had become a positive pleasure. What had happened to the wholesome punishment Marilla had planned so proudly?
        - id: ch03-b12
          speaker: narrator
          text: >-
            Mrs. Lynde did not notice any of that. She only saw a very thorough apology, and all her resentment melted away. For all her meddling, she had a kindly heart.
        - id: ch03-b13
          speaker: rachel_lynde
          text: >-
            There now, child, get up. Of course I forgive you. I suppose I was too hard on you myself. I'm an outspoken woman, and you'll simply have to learn not to mind me.
        - id: ch03-b14
          speaker: rachel_lynde
          text: >-
            Your hair certainly is terribly red. But I went to school with a girl whose hair was every bit as red as yours when she was young. By the time she grew up, it had turned into a beautiful auburn. I wouldn't be surprised at all if yours did the same.
        - id: ch03-b15
          speaker: narrator
          text: Anne stood up and let out a long breath.
        - id: ch03-b16
          speaker: anne_shirley
          text: >-
            Oh, Mrs. Lynde, you've given me hope! I'll always think of you as my benefactor. I could bear anything if I knew my hair would be beautiful auburn when I grew up. Don't you think it would be much easier to behave well with auburn hair?
        - id: ch03-b17
          speaker: anne_shirley
          text: >-
            May I sit on the bench under the apple trees while you talk to Marilla? There's much more room for imagining out in the garden.
        - id: ch03-b18
          speaker: rachel_lynde
          text: >-
            Mercy, yes. Run along. You may pick a bunch of those white June lilies in the corner if you'd like.
        - id: ch03-b19
          speaker: narrator
          text: >-
            Once the door closed behind Anne, Mrs. Lynde rose briskly to light a lamp.
        - id: ch03-b20
          speaker: rachel_lynde
          text: >-
            She really is a strange little thing. Take this chair, Marilla. It's more comfortable than yours. I keep that one for the hired boy.
        - id: ch03-b21
          speaker: rachel_lynde
          text: >-
            Yes, she's odd, but there's something appealing about her after all. I understand better why you and Matthew kept her, and I don't feel nearly as sorry for you now. She may turn out well enough.
        - id: ch03-b22
          speaker: rachel_lynde
          text: >-
            Of course, she expresses herself in a peculiar and rather forceful way. She'll probably grow out of that now that she's living among civilized people. And yes, her temper is quick. Still, a child who flares up fast and cools down fast usually isn't sly or deceitful. I can't abide a sly child. All things considered, Marilla, I rather like her.
    - id: ch04
      title: The Road Home
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            When Marilla was ready to leave, Anne came out of the sweet-smelling orchard twilight with an armful of white narcissi. As they walked down the lane, she spoke with pride.
        - id: ch04-b02
          speaker: anne_shirley
          text: >-
            I made a very good apology, didn't I? Since I had to do it, I thought I should do it as thoroughly as possible.
        - id: ch04-b03
          speaker: marilla_cuthbert
          text: You certainly did it thoroughly.
        - id: ch04-b04
          speaker: narrator
          text: >-
            The memory of the apology almost made Marilla laugh, which dismayed her. She also had an uneasy feeling that Anne ought to be scolded for apologizing too well. But of course, that was ridiculous. So she settled the matter with her conscience by speaking as severely as she could.
        - id: ch04-b05
          speaker: marilla_cuthbert
          text: >-
            I hope you won't need to make many more apologies like that. From now on, you must try to control your temper.
        - id: ch04-b06
          speaker: anne_shirley
          text: >-
            That wouldn't be so difficult if people stopped teasing me about my looks. Other things don't make me lose my temper. But I'm so tired of hearing about my hair that I boil right over. Do you think it really might turn into beautiful auburn when I'm grown?
        - id: ch04-b07
          speaker: marilla_cuthbert
          text: >-
            You think far too much about your appearance. I'm afraid you're a very vain little girl.
        - id: ch04-b08
          speaker: anne_shirley
          text: >-
            How can I be vain when I know I'm plain? I love beautiful things, and I hate seeing something unattractive when I look in the mirror. It makes me sad, just as every ugly thing does. I feel sorry for it because it isn't beautiful.
        - id: ch04-b09
          speaker: marilla_cuthbert
          text: Pretty behavior is what makes a person pretty.
        - id: ch04-b10
          speaker: anne_shirley
          text: >-
            People have told me that before, but I'm not sure I believe it. Oh, don't these flowers smell wonderful? It was so kind of Mrs. Lynde to give them to me. I don't feel angry with her anymore. Apologizing and being forgiven leaves you feeling so warm and comfortable, doesn't it?
        - id: ch04-b11
          speaker: anne_shirley
          text: >-
            Look how bright the stars are tonight. If you could live on one, which would you choose? I'd live on that big, clear, beautiful one over the dark hill.
        - id: ch04-b12
          speaker: marilla_cuthbert
          text: Anne, please stop talking.
        - id: ch04-b13
          speaker: narrator
          text: >-
            Marilla was completely worn out from trying to follow Anne's thoughts as they spun from one thing to another. Anne obeyed her and said nothing more until they turned into the lane that led home.
        - id: ch04-b14
          speaker: narrator
          text: >-
            A playful little wind came down the lane to meet them, carrying the spicy smell of young ferns wet with dew. High among the shadows, a cheerful kitchen light shone through the trees of Green Gables. Anne suddenly moved close to Marilla and slipped her hand into the older woman's hard palm.
        - id: ch04-b15
          speaker: anne_shirley
          text: >-
            It's wonderful to be going home and know that it truly is home. I already love Green Gables. I've never loved any place before because no other place ever felt like home. Oh, Marilla, I'm so happy. I could pray this very minute, and it wouldn't feel hard at all.
          emotion: happy
        - id: ch04-b16
          speaker: narrator
          text: >-
            At the touch of that thin little hand in her own hard palm, something warm and sweet rose in Marilla's heart. It may have been a beat of the motherhood she had missed. The feeling was so unfamiliar and tender that it unsettled her. She quickly tried to bring herself back to her usual calm by teaching Anne a moral.
        - id: ch04-b17
          speaker: marilla_cuthbert
          text: >-
            If you're a good girl, you'll always be happy. And saying your prayers should never be difficult.
        - id: ch04-b18
          speaker: anne_shirley
          text: >-
            Saying prayers isn't quite the same as truly praying. But now I'm going to imagine I'm the wind blowing through the tops of those trees. When I grow tired of the trees, I'll float gently down through the ferns. Then I'll fly into Mrs. Lynde's garden and make the flowers dance.
        - id: ch04-b19
          speaker: anne_shirley
          text: >-
            After that, I'll sweep across the clover field and blow over the Lake of Shining Waters until it ripples into tiny sparkling waves. A wind has so much room for imagination! So I won't talk anymore right now, Marilla.
        - id: ch04-b20
          speaker: marilla_cuthbert
          text: Thank goodness for that.
