audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖从容，带着细腻而机智的讲述感
        timbre: 清澈柔和
        pace: 舒缓而有变化
        pitch: 中音
    anne:
      display_name: 安妮
      tts:
        delivery: 热切灵动，想法接连涌出，真挚而富于想象
        timbre: 清亮稚嫩
        pace: 明快，动情处自然放慢
        pitch: 中高音
    matthew:
      display_name: 马修
      tts:
        delivery: 腼腆温厚，说话迟缓而谨慎
        timbre: 低沉柔和
        pace: 缓慢
        pitch: 中低音
    marilla:
      display_name: 玛丽拉
      tts:
        delivery: 干脆严谨，言语直截了当，偶尔透出克制的温情
        timbre: 清晰沉稳
        pace: 中等
        pitch: 中音
    rachel:
      display_name: 雷切尔太太
      tts:
        delivery: 直率强势，爱下判断，话里带着不容置疑的笃定
        timbre: 饱满厚实
        pace: 中等偏快
        pitch: 中低音
  chapters:
    - id: ch01
      title: 第十章　安妮的道歉
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 当天晚上，玛丽拉没向马修提那场风波。可到了第二天早晨，安妮还是不肯让步，也没有下楼吃饭。玛丽拉只好把事情原原本本告诉马修，还特意让他明白，安妮这回错得有多严重。
        - id: ch01-b02
          speaker: matthew
          text: 雷切尔·林德挨一顿训也不坏。她这个老太太，平日就是爱管闲事，还总搬弄是非。
        - id: ch01-b03
          speaker: narrator
          text: 马修原想安慰玛丽拉，谁知这句话反倒叫她吃了一惊。
        - id: ch01-b04
          speaker: marilla
          text: 马修·卡斯伯特，你竟然替安妮说话！她做得有多不像话，你明明知道。照这样下去，你是不是还要说，她根本不该受罚？
        - id: ch01-b05
          speaker: matthew
          text: 呃，那倒也不是。她是该受一点儿罚。可你别罚得太重，玛丽拉。她从前没有人教过她呀。你会给她饭吃的，是不是？
        - id: ch01-b06
          speaker: marilla
          text: 你几时听说过我拿饿肚子逼人学好？一日三餐照常，我会亲自送上楼。不过，她什么时候肯向林德太太道歉，什么时候才能下来。这件事就这么定了。
        - id: ch01-b07
          speaker: narrator
          text: 那天的早饭、午饭和晚饭，全都吃得静悄悄的。安妮始终没有松口。每顿饭后，玛丽拉都会把盛得满满的托盘送到东山墙房间，再把几乎没动过的饭菜端下来。晚饭的托盘最后一次下楼时，马修忧心地盯着那些食物，怎么也看不出它们少了多少。他不知道，安妮究竟吃过一点儿没有。
        - id: ch01-b08
          speaker: narrator
          text: 傍晚，玛丽拉去后面的牧场赶牛。一直在谷仓边徘徊、留神观望的马修，立刻像个做贼的人一样溜进屋，悄悄上了楼。平常，他仿佛总会自然地回到厨房和过道旁自己的小卧室。只有牧师来喝茶时，他才偶尔冒险走进客厅或起居室，而且每回都浑身不自在。至于自家的楼上，自从四年前那个春天帮玛丽拉给客房贴壁纸以后，他一次也没去过。
        - id: ch01-b09
          speaker: narrator
          text: 马修踮着脚走过过道，在安妮门外站了好几分钟。等勇气总算攒够了，他才用手指轻轻敲门，推开一条缝，往里面看。
        - id: ch01-b10
          speaker: narrator
          text: 安妮坐在窗边的黄椅子上，伤心地望着花园。她看上去那么瘦小，又那么不快活，马修心里顿时难受起来。他轻轻掩上门，踮着脚走到她身旁。
        - id: ch01-b11
          speaker: matthew
          text: 安妮，你还过得去吗？
        - id: ch01-b12
          speaker: narrator
          text: 他把声音压得很低，像是怕谁听见。安妮勉强笑了笑。
        - id: ch01-b13
          speaker: anne
          text: 还过得去。我想象了好多事情，时间就没那么难熬了。当然，这里很寂寞。不过，我也该早点习惯寂寞。
          emotion: sad
        - id: ch01-b14
          speaker: narrator
          text: 安妮又勇敢地笑了一下，仿佛已经准备好独自熬过今后漫长的岁月。马修忽然想起，得趁玛丽拉回来以前，赶快说明来意。
        - id: ch01-b15
          speaker: matthew
          text: 我说，安妮，你还是照她说的做，把这事了结了吧。早晚都躲不过去。玛丽拉一旦拿定主意，那决心可大得吓人。你就马上去办，好不好？
        - id: ch01-b16
          speaker: anne
          text: 您是叫我向林德太太道歉吗？
        - id: ch01-b17
          speaker: matthew
          text: 对，道歉，就是这个词。跟她把话说开，让这件事过去。我想说的就是这个。
        - id: ch01-b18
          speaker: anne
          text: 要是为了您，我想我能去。我现在说后悔，已经是真话了，因为我确实后悔了。昨晚可不是这样。那时我一点儿也不后悔，从心里一直气到外面，整整一夜都没消气。我夜里醒了三次，每次醒来还是气得要命。可到了今早，那股气忽然没了。气一消，心里却空得可怕，我也觉得自己很丢脸。只是，要我亲自去把这些告诉林德太太，实在太难堪了。我已经决定，宁可永远关在这里，也不肯去。不过，只要您真的希望，我愿意为您做任何事。
        - id: ch01-b19
          speaker: matthew
          text: 我当然希望你去。楼下少了你，寂寞得很。去把事情说开吧，这才是好孩子。
        - id: ch01-b20
          speaker: anne
          text: 那好吧。玛丽拉一回来，我就告诉她，我已经悔过了。
        - id: ch01-b21
          speaker: matthew
          text: 对，这就对了。不过千万别说是我来劝你的。玛丽拉会以为我横插一手，可我答应过不插手。
        - id: ch01-b22
          speaker: anne
          text: 就算野马来拖，也别想从我嘴里拖出这个秘密。可是，野马究竟怎么从一个人嘴里把秘密拖出来呢？
        - id: ch01-b23
          speaker: narrator
          text: 马修已经走了。他被自己的成功吓了一跳，赶忙逃到马匹牧场最远的角落，免得玛丽拉猜出他做过什么。玛丽拉回家时，听见楼梯栏杆上方传来一声哀哀的呼唤，心里不禁一喜。
        - id: ch01-b24
          speaker: anne
          text: 玛丽拉，我想跟您说话。
        - id: ch01-b25
          speaker: marilla
          text: 什么事？
        - id: ch01-b26
          speaker: anne
          text: 我后悔自己发了脾气，还说了无礼的话。我愿意去把这些告诉林德太太。
        - id: ch01-b27
          speaker: marilla
          text: 很好。挤完牛奶，我带你去。
        - id: ch01-b28
          speaker: narrator
          text: 玛丽拉回答得十分干脆，没有露出半点轻松。其实她一直在发愁，要是安妮永远不肯认错，自己究竟该怎么办。她简直想不出天底下还能有什么办法。
        - id: ch01-b29
          speaker: narrator
          text: 挤完牛奶，两人沿着小路出发了。玛丽拉挺直腰背，满面胜利。安妮却低着头，垂头丧气，连步子也拖拖沓沓。可走到半路，她的沮丧忽然像中了魔法一样消失了。她抬起头，脚步轻快起来，眼睛一刻也不离开晚霞，脸上还浮起一股压低了却藏不住的兴奋。玛丽拉看着很不满意。要去见受了冒犯的林德太太，安妮就该像个温顺悔过的孩子，不该是这副神采飞扬的模样。
        - id: ch01-b30
          speaker: marilla
          text: 安妮，你又在想什么？
        - id: ch01-b31
          speaker: anne
          text: 我在想象，等会儿该对林德太太说些什么。
        - id: ch01-b32
          speaker: narrator
          text: 这个回答本来应该叫玛丽拉满意，可她总觉得，自己安排的惩罚正在什么地方走偏。一个受罚的孩子，哪能像安妮这样心醉神迷、满脸放光呢？
        - id: ch01-b33
          speaker: narrator
          text: 安妮一路保持着那副神情，直到她们站在林德太太面前。林德太太正坐在厨房窗边织毛活。安妮脸上的光彩立刻消失，换成了满脸哀伤的悔意。还没等谁说话，她突然跪在吃惊的雷切尔太太面前，伸出双手，苦苦哀求。
        - id: ch01-b34
          speaker: anne
          text: 林德太太，我真的万分后悔。就算把整本字典里的词全用光，我也说不完心里的懊悔，您只能自己想象了。我那样对您，实在太不像话。我还让马修和玛丽拉丢了脸。他们明知道我不是男孩，还是肯让我留在绿山墙，对我这么好。我却又坏又忘恩负义，活该受罚，活该永远被体面人赶出去。您说的是实话，我还为此大发脾气，真是太坏了。我的头发就是红的，脸上有雀斑，人又瘦又丑。您说的每一个字都是真的。我对您说的话也是真的，可我不该说出口。求求您原谅我吧。您不会忍心让一个可怜的孤儿女孩为这件事难过一辈子，对不对？哪怕她的脾气坏得吓人，您也不会这样做。我知道您不会。请您亲口说，您原谅我了吧。
          emotion: sad
        - id: ch01-b35
          speaker: narrator
          text: 安妮紧紧握住双手，低下头，等候林德太太的裁决。她的真诚不用怀疑，每个音调都透着真心，玛丽拉和林德太太都听出来了。可是玛丽拉也惊愕地看出，安妮竟在享受自己这番低头受辱。她把自己贬得越彻底，就越沉醉其中。玛丽拉原先还为自己想出了一项有益的惩罚而暗暗得意，如今惩罚到哪里去了？安妮分明把它变成了一种实实在在的乐趣。
        - id: ch01-b36
          speaker: narrator
          text: 好心的林德太太没有看透这些。她只看到安妮把歉道得十分彻底，心里那点怨气便全消了。她虽然爱管闲事，心肠倒是善良的。
        - id: ch01-b37
          speaker: rachel
          text: 好了，好了，快起来吧，孩子。我当然原谅你。说起来，我对你也确实有点儿太严厉。不过我这人说话一向直，你只管别往心里去。你的头发红得厉害，这是谁也否认不了的。可是我从前认识一个女孩，其实还跟她一起上过学。她小时候的头发一点儿也不比你的逊色，红得一模一样。等她长大，头发却慢慢变深，成了很漂亮的赤褐色。要是你的头发将来也这样变，我可一点儿都不会吃惊，一点儿也不会。
        - id: ch01-b38
          speaker: narrator
          text: 安妮站起来，长长地舒了一口气。
        - id: ch01-b39
          speaker: anne
          text: 林德太太，您给了我希望，我会永远把您当作恩人。只要想到长大后能有一头漂亮的赤褐色头发，无论要我忍受什么，我都受得了。一个人的头发要是漂亮的赤褐色，做个好孩子也会容易得多，您觉得呢？现在，您和玛丽拉说话的时候，我能不能到花园里去，坐在苹果树下的长凳上？那里可供想象的余地大多了。
          emotion: happy
        - id: ch01-b40
          speaker: rachel
          text: 哎呀，当然可以，去吧。你要愿意，还可以摘一束角落里的白色六月百合。
        - id: ch01-b41
          speaker: narrator
          text: 安妮走进花园，门在她身后合上。林德太太随即麻利地站起身来，准备把屋里的灯点亮。
        - id: ch01-b42
          speaker: rachel
          text: 她真是个古怪的小东西。玛丽拉，你坐这把椅子，它舒服些。你坐的那把，我只留给雇来的小伙子。不错，那孩子是怪，可不知怎么，也挺招人喜欢。我现在不像先前那样惊讶你和马修为什么留下她了，也没那么替你们发愁。她也许会长成一个不错的人。她说话的方式当然有点儿古怪，怎么说呢，稍微太有冲劲了些。不过，她现在住进了文明人中间，这毛病大概会慢慢改掉。她的脾气也来得快，可这样反倒叫人放心。火一下烧起来，很快又灭了，这种孩子多半不会偷偷耍心眼骗人。老天保佑，我最怕心眼多的孩子。总的说来，玛丽拉，我还挺喜欢安妮。
        - id: ch01-b43
          speaker: narrator
          text: 玛丽拉准备回家时，安妮从果园芬芳的暮色里走出来，怀里抱着一大束白水仙。两人重新踏上小路，朝绿山墙走去。安妮想起自己的那番表现，忍不住得意起来。
        - id: ch01-b44
          speaker: anne
          text: 我的歉道得很不错，是不是？既然非道不可，我想还不如把它道得彻底一点儿。
        - id: ch01-b45
          speaker: marilla
          text: 的确够彻底的。
        - id: ch01-b46
          speaker: narrator
          text: 玛丽拉想起刚才的场面，发现自己竟有些想笑，心里很不安。她甚至隐隐觉得，安妮把歉道得这么好，自己应该训她几句。可这念头实在太荒唐了。最后，她只好跟自己的良心折中一下，板起脸说了一句严厉的话。
        - id: ch01-b47
          speaker: marilla
          text: 我希望你以后别再有机会道这样的歉了。安妮，从现在起，你得学着管住脾气。
        - id: ch01-b48
          speaker: anne
          text: 只要别人不拿我的长相取笑，管住脾气也不难。别的事不会叫我发火。可大家总拿我的头发说事，我实在受够了，一听见心里就沸腾起来。您说，我长大以后，头发真的会变成漂亮的赤褐色吗？
        - id: ch01-b49
          speaker: marilla
          text: 你不该总惦记自己的长相。安妮，恐怕你这个小姑娘太爱虚荣了。
        - id: ch01-b50
          speaker: anne
          text: 我明明知道自己长得不好看，怎么还会虚荣呢？我喜欢一切美丽的东西，也讨厌照镜子时看见一个不美的自己。那会让我特别伤心，就像看见世上任何难看的东西一样。我总会可怜它，因为它没能长得美。
        - id: ch01-b51
          speaker: marilla
          text: 一个人美不美，要看她做得美不美。
        - id: ch01-b52
          speaker: anne
          text: 以前也有人这么对我说，可我不大相信。哦，这些水仙花多香啊！林德太太愿意送花给我，她真好。我现在一点儿也不怪她了。道过歉又得到原谅，心里真是又温暖又舒服，对不对？今晚的星星多亮啊！要是能住在一颗星星上，您会挑哪一颗？我想住在那座黑山上方，那颗又大又亮的星星上。
        - id: ch01-b53
          speaker: marilla
          text: 安妮，求你闭一会儿嘴吧。
        - id: ch01-b54
          speaker: narrator
          text: 玛丽拉为了跟上安妮那些回旋飞转的念头，已经累得筋疲力尽。安妮果然安静下来，直到她们拐进自家的小路。一阵小小的流浪风沿路迎面吹来，带着露水沾湿的嫩蕨那辛香的气息。远处高高的暗影里，绿山墙厨房的灯光穿过树林，暖暖地、欢快地亮着。安妮忽然贴近玛丽拉，把自己瘦小的手塞进她那只粗硬的掌心。
        - id: ch01-b55
          speaker: anne
          text: 走在回家的路上，又知道那里真的是家，这种感觉太美好了。我已经爱上绿山墙了。从前我没有爱过任何地方，也没有一个地方像家。玛丽拉，我真幸福。现在就算让我祷告，我也不会觉得难。
          emotion: happy
        - id: ch01-b56
          speaker: narrator
          text: 那只瘦小的手碰着自己的掌心，玛丽拉心里涌起一股温暖又愉快的感情。也许，那正是她错失多年的母爱，忽然轻轻跳动了一下。可这种甜蜜的滋味，她从未习惯过。正因为陌生，反倒叫她慌乱起来。她赶紧教训安妮几句，想让自己的心情恢复往日那份平静。
        - id: ch01-b57
          speaker: marilla
          text: 只要你做个好孩子，就会一直快乐。安妮，祷告从来都不该是一件难事。
        - id: ch01-b58
          speaker: anne
          text: 背祷告词和真正祷告，不完全是一回事。不过，我现在要想象自己就是树梢上的风。等我吹腻了那些树，就来到下面，在蕨草间轻轻摇荡。然后，我会飞进林德太太的花园，让花儿全都跳起舞来。接着，我猛地掠过苜蓿田，再吹过闪光之湖，把湖面吹出一道道闪亮的小波纹。风能给人留下那么多想象的余地！所以，玛丽拉，我现在不再说话了。
        - id: ch01-b59
          speaker: marilla
          text: 感谢老天。
