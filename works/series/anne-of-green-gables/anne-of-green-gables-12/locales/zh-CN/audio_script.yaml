audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖从容，带着细腻而机智的讲述感
        timbre: 清澈柔和
        pace: 舒缓而有变化
        pitch: 中音
    anne:
      display_name: 安妮
      tts:
        delivery: 热切灵动，想法接连涌出，真挚而富于想象
        timbre: 清亮稚嫩
        pace: 明快，动情处自然放慢
        pitch: 中高音
    marilla:
      display_name: 玛丽拉
      tts:
        delivery: 干脆严谨，言语直截了当，偶尔透出克制的温情
        timbre: 清晰沉稳
        pace: 中等
        pitch: 中音
    mrs_barry:
      display_name: 巴里太太
      tts:
        delivery: 亲切而有主见，话语利落，带着严格母亲的分寸
        timbre: 明朗坚定
        pace: 中等
        pitch: 中音
    diana:
      display_name: 戴安娜
      tts:
        delivery: 爽朗坦率，开口常带笑意，友善而自然
        timbre: 甜润清亮
        pace: 轻快
        pitch: 中高音
    matthew:
      display_name: 马修
      tts:
        delivery: 腼腆温厚，话少而真诚
        timbre: 低沉柔和
        pace: 缓慢
        pitch: 中低音
  chapters:
    - id: ch01
      title: 第十二章　庄严的誓言与承诺
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            又过了好几天，到了星期五，玛丽拉才听说安妮那顶鲜花帽子的事。她刚从林德太太家回来，就把安妮叫来，要问个清楚。
        - id: ch01-b02
          speaker: marilla
          text: >-
            安妮，蕾切尔太太说，你上星期日竟把蔷薇和毛茛插得满帽子都是，就那样去了教堂。你怎么想得出这种怪花样？那副样子可真够好看的！
          emotion: angry
        - id: ch01-b03
          speaker: anne
          text: >-
            哦，我知道粉红和黄色不衬我……
        - id: ch01-b04
          speaker: marilla
          text: >-
            谁管颜色衬不衬！不管什么颜色，把花插到帽子上就够可笑了。你这孩子真会气人！
          emotion: angry
        - id: ch01-b05
          speaker: anne
          text: >-
            可我还是不懂。花戴在帽子上，怎么就比别在衣服上更可笑？那里有好多女孩把花束别在衣服上，这有什么分别呢？
        - id: ch01-b06
          speaker: narrator
          text: >-
            安妮想谈道理，玛丽拉却守着眼前这件明明白白的事，绝不肯跟她绕进那些说不清的大道理里。
        - id: ch01-b07
          speaker: marilla
          text: >-
            不许顶嘴。这种事傻透了，以后再不准做。蕾切尔太太说，你那样走进教堂，她羞得恨不能钻到地板底下。她挤不过去，等能叫你摘花时已经晚了，大家早就议论开了。人家当然会以为是我不懂事，才让你那样打扮着出门。
        - id: ch01-b08
          speaker: anne
          text: >-
            哦，真对不起。我根本没想到您会介意。蔷薇和毛茛那么娇美，我只觉得戴在帽子上一定很好看。别的女孩也在帽子上戴假花呀。恐怕我以后会给您添很多麻烦。也许您该把我送回孤儿院。那当然太可怕了，我一定受不了，说不定还会得肺痨，毕竟我已经这么瘦了。可是，那也比一直叫您为难好。
          emotion: sad
        - id: ch01-b09
          speaker: narrator
          text: >-
            眼泪涌上了安妮的眼睛。玛丽拉见自己把孩子弄哭，反倒有些恼自己。
        - id: ch01-b10
          speaker: marilla
          text: >-
            胡说，我没想把你送回孤儿院。我只要你像别的女孩一样守规矩，别总惹人笑。别哭了，我有个好消息。戴安娜·巴里今天下午回来了。我要去向巴里太太借裙样，你愿意的话，就跟我去认识戴安娜。
        - id: ch01-b11
          speaker: narrator
          text: >-
            安妮立刻站起来，双手紧紧握在胸前，脸上的泪珠还亮晶晶的。她正在缝边的擦碗巾滑到地上，她连看都没看见。
        - id: ch01-b12
          speaker: anne
          text: >-
            哦，玛丽拉，我害怕了！这件事真的来了，我才发现自己怕得要命。要是她不喜欢我怎么办？那会是我一生中最悲惨的失望。
          emotion: fearful
        - id: ch01-b13
          speaker: marilla
          text: >-
            别慌成这样。还有，你别总用那些长得吓人的词，小女孩说起来怪滑稽的。戴安娜大概会喜欢你，可你得过她母亲那一关。她母亲要是不喜欢你，戴安娜再喜欢也没用。她若听说你冲蕾切尔太太发脾气，又戴着毛茛去教堂，还不知道会怎么想。你得有礼貌、守规矩，别再冒出什么吓人的话。老天，你居然真在发抖！
        - id: ch01-b14
          speaker: narrator
          text: >-
            安妮当真抖个不停，脸色苍白，整张小脸绷得紧紧的。
        - id: ch01-b15
          speaker: anne
          text: >-
            玛丽拉，要是您正要去见一个盼望成为知心朋友的女孩，又怕她母亲不喜欢您，您也会激动呀。
        - id: ch01-b16
          speaker: narrator
          text: >-
            她一边说，一边赶紧去拿帽子，随后跟玛丽拉抄近路去了果园坡。两人越过小溪，又爬上长满冷杉的山坡。玛丽拉一敲门，巴里太太便来到厨房门口。她个子高挑，有一双黑眼睛和一头黑发，嘴角看着十分坚决。大家都知道，她管教自己的孩子一向很严。
        - id: ch01-b17
          speaker: mrs_barry
          text: >-
            你好，玛丽拉，快进来。这就是你收养的小姑娘吧？
        - id: ch01-b18
          speaker: marilla
          text: >-
            是的，她叫安妮·雪莉。
        - id: ch01-b19
          speaker: anne
          text: >-
            安妮的名字末尾有一个e。
        - id: ch01-b20
          speaker: narrator
          text: >-
            安妮又紧张又激动，连气都喘不匀，可这件大事绝不能叫人误会。巴里太太不知是没听见，还是没弄懂，只同她握了握手，接着和蔼地问候她。
        - id: ch01-b21
          speaker: mrs_barry
          text: >-
            你好吗？
        - id: ch01-b22
          speaker: anne
          text: >-
            谢谢您，太太。我身体很好，只是心里乱得厉害。玛丽拉，这句话不算吓人吧？
        - id: ch01-b23
          speaker: narrator
          text: >-
            安妮说得一本正经，末了还凑向玛丽拉，自以为压低了声音，其实屋里人人都听得见。戴安娜原本在沙发上看书，客人进门时便放下了。她很漂亮，有母亲一样的黑眼睛和黑头发，面颊红润，脸上还带着从父亲那里继承来的快活神情。
        - id: ch01-b24
          speaker: mrs_barry
          text: >-
            这是我女儿戴安娜。戴安娜，你带安妮去花园看看那些花吧，这总比一直盯着书，把眼睛看坏了强。她读得实在太多了，可她父亲偏偏帮着她、纵着她，我怎么也管不住。她一天到晚都埋头看书。现在总算有了玩伴，也许能叫她多到户外走走。
        - id: ch01-b25
          speaker: narrator
          text: >-
            两个女孩来到花园，隔着一丛艳丽的卷丹，羞答答地互相望着。夕阳从西边深色的老冷杉间照过来，把整座园子染得温柔醇厚。
        - id: ch01-b26
          speaker: narrator
          text: >-
            巴里家的花园茂密得像一片花的荒野。换作平常，安妮早已看得心醉。可今天关系着她的命运，她哪还顾得上。巨大的老柳树和高高的冷杉围在四周，树荫下长满喜阴的花。镶着蛤蜊壳的小路又直又整齐，纵横穿过花坛，像一条条湿润的红丝带。花坛里，老式花卉挤挤挨挨地盛开着。
        - id: ch01-b27
          speaker: narrator
          text: >-
            那里有粉红的荷包牡丹和深红的大牡丹，有洁白芬芳的水仙，也有带刺的苏格兰蔷薇。粉、蓝、白三色的耧斗菜旁边，开着淡紫的肥皂草。青蒿、条纹草和薄荷成丛生长，紫色的亚当与夏娃、黄水仙，还有一大片白花草木樨，也开得旺盛。草木樨纤细的花穗又香又轻，像羽毛一样。鲜红的闪电花越过洁白端庄的麝香花，伸出火焰似的尖矛。阳光在这里舍不得离开，蜜蜂低声嗡鸣，连风也受了诱惑，只肯在花叶间呼噜着、沙沙地慢慢打转。
        - id: ch01-b28
          speaker: anne
          text: >-
            哦，戴安娜，你觉得自己能不能喜欢我一点？只要喜欢到愿意做我的知心朋友就够了。
        - id: ch01-b29
          speaker: narrator
          text: >-
            安妮终于问了出来。她双手紧紧地握在一起，声音低得几乎听不见。戴安娜却笑了，她向来都是先笑，然后才说话。
        - id: ch01-b30
          speaker: diana
          text: >-
            我想当然能。我真高兴你搬到绿山墙来了，以后有人陪我玩，一定很有趣。附近没有别的女孩住得够近，我的妹妹们又都太小，谁也陪不了我。
          emotion: happy
        - id: ch01-b31
          speaker: anne
          text: >-
            那你愿意起誓，永远永远做我的朋友吗？
        - id: ch01-b32
          speaker: narrator
          text: >-
            戴安娜听了，大吃一惊。
        - id: ch01-b33
          speaker: diana
          text: >-
            可是发誓非常邪恶呀。
          emotion: surprised
        - id: ch01-b34
          speaker: anne
          text: >-
            哦，我说的不是那一种。发誓其实有两种呢。
        - id: ch01-b35
          speaker: diana
          text: >-
            我怎么只听说过一种？
        - id: ch01-b36
          speaker: anne
          text: >-
            真的还有一种，而且一点也不邪恶。我的意思是，很庄严地起誓，认真地许下承诺。
        - id: ch01-b37
          speaker: diana
          text: >-
            那我愿意。可是该怎么起誓呢？
        - id: ch01-b38
          speaker: narrator
          text: >-
            戴安娜这才松了口气。安妮郑重地握住她的手。
        - id: ch01-b39
          speaker: anne
          text: >-
            我们要这样手拉着手。本来还该站在流动的水上面，不过，我们可以想象这条小路就是流水。我先念：我庄严起誓，只要日月长存，我就永远忠于我的知心朋友戴安娜·巴里。现在轮到你，把我的名字放进去。
        - id: ch01-b40
          speaker: narrator
          text: >-
            戴安娜照样念完了这份“誓言”，开头笑了一次，念到结尾又笑了一次。
        - id: ch01-b41
          speaker: diana
          text: >-
            安妮，你真是个古怪的女孩。我以前就听说你古怪。不过，我想自己一定会很喜欢你。
          emotion: happy
        - id: ch01-b42
          speaker: narrator
          text: >-
            玛丽拉和安妮回家时，戴安娜一直把她们送到圆木桥。两个女孩挽着彼此的胳膊，一路亲密地走在一起。到了溪边，她们才依依不舍地分开，临别前还许下好些承诺，一遍遍约定第二天下午要一起玩。
        - id: ch01-b43
          speaker: marilla
          text: >-
            怎么样，你找到自己的同道中人了吗？
        - id: ch01-b44
          speaker: narrator
          text: >-
            她们正穿过绿山墙的花园。安妮幸福地叹了口气，丝毫没有听出玛丽拉是在挖苦她。
        - id: ch01-b45
          speaker: anne
          text: >-
            找到了！玛丽拉，就在这一刻，我是整个爱德华王子岛上最幸福的女孩。今晚我一定心甘情愿地好好祷告。明天，戴安娜和我要在威廉·贝尔先生的白桦林里搭游戏屋。柴房里的碎瓷片能给我吗？她的生日在二月，我的在三月，这种巧合是不是奇妙极了？
          emotion: happy
        - id: ch01-b46
          speaker: anne
          text: >-
            她要借我一本精彩得不得了、也刺激得不得了的书，还要带我去看树林深处的稻百合。戴安娜的眼睛多有灵气呀，我也真想有那样的眼睛。她会教我唱《榛树谷里的内莉》，还要送我一幅画挂在房里。画上有位穿淡蓝丝裙的可爱女士，是推销缝纫机的人送给她的。我也好想有东西送给戴安娜。
          emotion: happy
        - id: ch01-b47
          speaker: anne
          text: >-
            我比她高一英寸，她却比我胖好多。她说自己想瘦些，因为瘦了更优雅，可我怕她只是想安慰我。以后我们还要去海边捡贝壳。我们已经说好，把圆木桥下的泉水叫作“树仙的水泡”。这个名字是不是优雅极了？我读过一个故事，里面的泉水就叫这个名字。我想，树仙大概是长大了的仙女。
          emotion: happy
        - id: ch01-b48
          speaker: marilla
          text: >-
            我只盼着你别把戴安娜说个半死。还有，你做这些打算时可别忘了，不能整天玩，连大半天也不行。你有活儿要干，必须先把活儿做完。
        - id: ch01-b49
          speaker: narrator
          text: >-
            安妮的幸福已经盛得满满的，马修又让它溢了出来。他刚刚结束一趟去卡莫迪商店的行程，回到家里，便腼腆地从口袋里取出一个小纸包，递给安妮，同时带着一副求玛丽拉别见怪的神情，朝她望了一眼。
        - id: ch01-b50
          speaker: matthew
          text: >-
            我听你说喜欢巧克力糖，就给你买了一些。
        - id: ch01-b51
          speaker: marilla
          text: >-
            哼，这会把她的牙和肚子都吃坏。好了，孩子，别那么失望。既然马修已经买来了，你就吃吧。他还不如买薄荷糖，那个健康些。不过，不许一次全吃光，免得把自己吃病了。
        - id: ch01-b52
          speaker: anne
          text: >-
            哦，我当然不会。我今晚只吃一颗，好吗？剩下的能分一半给戴安娜吗？只要送她一些，留给我的那一半吃起来也会甜上两倍。我终于有东西可以送她了，这真叫人快活！
          emotion: happy
        - id: ch01-b53
          speaker: narrator
          text: >-
            后来，安妮回到了东山墙房间。玛丽拉这才对马修说起心里话。
        - id: ch01-b54
          speaker: marilla
          text: >-
            有一点我得替这孩子说句公道话，她不小气，这很好。小孩子所有的毛病里，我最厌恶小气。天哪，她才来了三个星期，感觉却像一直住在这儿。我都想不出家里没有她会是什么样子。
        - id: ch01-b55
          speaker: marilla
          text: >-
            马修，别摆出那副“我早说过吧”的神情。女人这么做已经够糟了，男人这样更叫人受不了。我承认，自己很庆幸当初答应把她留下，也越来越喜欢她了。不过你可别拿这件事来挤对我，马修·卡斯伯特。
