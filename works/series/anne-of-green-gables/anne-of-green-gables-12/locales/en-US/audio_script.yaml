  chapters:
    - id: ch01
      title: The Flower-Wreathed Hat
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            Marilla did not hear about Anne's flower-covered church hat until the following Friday. When she came home from Mrs. Lynde's, she called Anne to explain herself.
        - id: ch01-b02
          speaker: marilla_cuthbert
          text: >-
            Anne, Mrs. Rachel tells me you went to church last Sunday with roses and buttercups all over your hat. Whatever made you do something so ridiculous? You must have been quite a sight!
          emotion: angry
        - id: ch01-b03
          speaker: anne_shirley
          text: Oh. I know pink and yellow don't look good on me.
        - id: ch01-b04
          speaker: marilla_cuthbert
          text: >-
            The colors have nothing to do with it! Putting flowers on your hat at all was ridiculous. Anne, you can be the most aggravating child.
          emotion: angry
        - id: ch01-b05
          speaker: anne_shirley
          text: >-
            But why is it any sillier to wear flowers on a hat than on a dress? Lots of the girls had bouquets pinned to their dresses. How is that different?
        - id: ch01-b06
          speaker: narrator
          text: >-
            Marilla had no intention of leaving solid facts behind and following Anne into an argument about ideas.
        - id: ch01-b07
          speaker: marilla_cuthbert
          text: >-
            Don't talk back to me. What you did was very foolish, and I never want to catch you doing it again. Mrs. Rachel says she wanted the floor to swallow her when you came in. She couldn't reach you in time to make you take the flowers off, and people talked about it terribly. Naturally, they'll think I was foolish enough to send you out looking like that.
          emotion: angry
        - id: ch01-b08
          speaker: anne_shirley
          text: >-
            Oh, I'm so sorry. I never dreamed you would mind. The roses and buttercups were so sweet and pretty, and I thought they would look lovely on my hat. Other girls had artificial flowers on theirs. I'm afraid I'll be a dreadful trial to you. Perhaps you should send me back to the asylum. It would be awful, and I don't think I could bear it. I'd probably go into consumption, thin as I am. But even that would be better than being a burden to you.
          emotion: sad
        - id: ch01-b09
          speaker: narrator
          text: >-
            Tears filled Anne's eyes. Marilla was annoyed with herself for making the child cry.
        - id: ch01-b10
          speaker: marilla_cuthbert
          text: >-
            Nonsense. I certainly don't want to send you back. I only want you to behave like other girls and stop making yourself look ridiculous. Now, don't cry. I have some news. Diana Barry came home this afternoon. I'm going over to borrow a skirt pattern from Mrs. Barry, and you may come meet Diana if you like.
        - id: ch01-b11
          speaker: narrator
          text: >-
            Anne sprang up and clasped her hands. Tears still shone on her cheeks, and the dish towel she had been hemming fell unnoticed to the floor.
        - id: ch01-b12
          speaker: anne_shirley
          text: >-
            Oh, Marilla, now that the moment is here, I'm frightened. What if she doesn't like me? That would be the most tragic disappointment of my whole life.
          emotion: fearful
        - id: ch01-b13
          speaker: marilla_cuthbert
          text: >-
            Don't work yourself into a state. And I wish you wouldn't use such enormous words. They sound strange coming from a little girl. Diana will probably like you well enough. Her mother is the one you need to please. Diana's opinion won't help if Mrs. Barry disapproves of you. If she's heard how you shouted at Mrs. Lynde, or about those buttercups on your hat, I don't know what she'll think. Be polite. Behave yourself. And please don't make any of your startling speeches. Goodness, child, you're actually trembling!
        - id: ch01-b14
          speaker: narrator
          text: Anne really was trembling. Her face had gone pale and tight.
        - id: ch01-b15
          speaker: anne_shirley
          text: >-
            You'd be excited too, Marilla, if you were about to meet a girl you hoped would be your bosom friend, especially when her mother might not approve of you.
        - id: ch01-b16
          speaker: narrator
          text: Anne hurried away to get her hat.
    - id: ch02
      title: A Visit to Orchard Slope
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            They took the shortcut to Orchard Slope, crossing the brook and climbing through the fir-covered hill. Mrs. Barry answered Marilla's knock at the kitchen door. She was tall, with black hair, black eyes, and a very determined mouth. Everyone knew she was strict with her children.
        - id: ch02-b02
          speaker: mrs_barry
          text: >-
            How are you, Marilla? Come inside. I suppose this is the little girl you've adopted?
        - id: ch02-b03
          speaker: marilla_cuthbert
          text: Yes, this is Anne Shirley.
        - id: ch02-b04
          speaker: anne_shirley
          text: Anne with an E.
        - id: ch02-b05
          speaker: narrator
          text: >-
            Anne could hardly breathe for nerves, but she was determined to make that important point clear. Mrs. Barry either did not hear or did not understand. She simply shook Anne's hand and spoke kindly.
        - id: ch02-b06
          speaker: mrs_barry
          text: How are you?
        - id: ch02-b07
          speaker: anne_shirley
          text: >-
            My body is well, thank you, ma'am, though my spirit is rather rumpled.
        - id: ch02-b08
          speaker: narrator
          text: Then Anne whispered to Marilla, loudly enough for everyone to hear.
        - id: ch02-b09
          speaker: anne_shirley
          text: That wasn't startling, was it, Marilla?
        - id: ch02-b10
          speaker: narrator
          text: >-
            Diana sat reading on the sofa. She dropped her book when the visitors came in. She was a very pretty girl, with her mother's dark eyes and hair, rosy cheeks, and the merry look she had inherited from her father.
        - id: ch02-b11
          speaker: mrs_barry
          text: >-
            This is my daughter, Diana. Diana, why don't you take Anne into the garden and show her the flowers? That will be better than wearing out your eyes over that book.
        - id: ch02-b12
          speaker: narrator
          text: As the girls went outside, Mrs. Barry turned to Marilla.
        - id: ch02-b13
          speaker: mrs_barry
          text: >-
            She reads far too much, and I can't stop her because her father encourages it. Her nose is always in a book. I'm glad she may have a playmate now. Perhaps Anne will get her outdoors more often.
        - id: ch02-b14
          speaker: narrator
          text: >-
            The girls stopped in the garden beside a clump of brilliant tiger lilies and looked shyly at each other. The mellow light of sunset streamed between the dark old fir trees.
        - id: ch02-b15
          speaker: narrator
          text: >-
            At any ordinary time, Anne would have been enchanted by the Barry garden. Flowers ran wild inside a ring of huge willows and tall firs. Shade-loving plants grew under the trees, while neat paths edged with clamshells crossed the ground like damp red ribbons.
        - id: ch02-b16
          speaker: narrator
          text: >-
            The beds overflowed with old-fashioned flowers. There were rosy bleeding-hearts and deep crimson peonies, fragrant white narcissi and sweet, thorny Scotch roses. Pink, blue, and white columbines grew near pale lilac Bouncing Bets. Southernwood, ribbon grass, and mint crowded together. Purple Adam-and-Eve, daffodils, and feathery white sweet clover filled the spaces between. Scarlet lightning thrust fiery spears above neat white musk-flowers. Sunshine lingered there. Bees hummed, and the breeze seemed happy to stay among the leaves.
    - id: ch03
      title: The Solemn Promise
      blocks:
        - id: ch03-b01
          speaker: anne_shirley
          text: >-
            Oh, Diana, do you think you might like me just a little? Enough to be my bosom friend?
        - id: ch03-b02
          speaker: narrator
          text: >-
            Anne clasped her hands and spoke almost in a whisper. Diana laughed, as she always did before she answered.
        - id: ch03-b03
          speaker: diana_barry
          text: >-
            I think I can. I'm very glad you've come to Green Gables. It'll be wonderful to have someone nearby to play with. No other girl lives close enough, and my sisters are too little.
          emotion: happy
        - id: ch03-b04
          speaker: anne_shirley
          text: Will you swear to be my friend forever and ever?
        - id: ch03-b05
          speaker: narrator
          text: Diana looked shocked.
        - id: ch03-b06
          speaker: diana_barry
          text: But it's terribly wicked to swear.
          emotion: surprised
        - id: ch03-b07
          speaker: anne_shirley
          text: Oh, I don't mean that kind of swearing. There are two kinds, you know.
        - id: ch03-b08
          speaker: diana_barry
          text: I only know one kind.
        - id: ch03-b09
          speaker: anne_shirley
          text: >-
            There really is another one, and it isn't wicked at all. It means making a solemn vow and promise.
        - id: ch03-b10
          speaker: diana_barry
          text: Oh, that's all right, then. What do we do?
        - id: ch03-b11
          speaker: anne_shirley
          text: >-
            First, we join hands like this. We really ought to stand over running water, but we can imagine the path is a stream. I'll say the vow first. I solemnly promise to be faithful to my bosom friend, Diana Barry, for as long as the sun and moon shall endure. Now you say it with my name.
        - id: ch03-b12
          speaker: narrator
          text: Diana repeated the solemn promise, laughing at the beginning and the end.
        - id: ch03-b13
          speaker: diana_barry
          text: >-
            You really are a queer girl, Anne. I'd heard that about you already. But I believe I'm going to like you very much.
        - id: ch03-b14
          speaker: narrator
          text: >-
            When it was time for Marilla and Anne to leave, Diana walked with them as far as the log bridge. The girls kept their arms around each other all the way. At the brook they parted, after making promise upon promise about spending the next afternoon together.
    - id: ch04
      title: A Cup Full of Happiness
      blocks:
        - id: ch04-b01
          speaker: marilla_cuthbert
          text: Well, did Diana turn out to be a kindred spirit?
        - id: ch04-b02
          speaker: narrator
          text: >-
            They were climbing through the Green Gables garden. Anne heard no hint of teasing in Marilla's question.
        - id: ch04-b03
          speaker: anne_shirley
          text: >-
            Oh, yes. Marilla, at this very moment, I'm the happiest girl on Prince Edward Island. I'll say my prayers gladly tonight, I promise. Tomorrow, Diana and I are building a playhouse in Mr. William Bell's birch grove. May I have those broken pieces of china in the woodshed?
          emotion: happy
        - id: ch04-b04
          speaker: anne_shirley
          text: >-
            Diana's birthday is in February, and mine is in March. Isn't that an amazing coincidence? She's lending me a book that she says is perfectly splendid and terribly exciting. She knows a place deep in the woods where rice lilies grow, and she's going to show it to me.
          emotion: happy
        - id: ch04-b05
          speaker: anne_shirley
          text: >-
            Don't you think Diana's eyes are full of soul? I wish mine were. She's going to teach me a song called “Nelly in the Hazel Dell.” And she'll give me a beautiful picture for my room. It shows a lovely lady in a pale blue silk dress, and Diana got it from a sewing-machine agent. I only wish I had something to give her.
          emotion: happy
        - id: ch04-b06
          speaker: anne_shirley
          text: >-
            I'm an inch taller than Diana, but she's much plumper. She says she'd like to be thin because it's more graceful, though I suspect she only said that to spare my feelings. Someday we'll go to the shore and gather shells. We've decided to call the spring beside the log bridge the Dryad's Bubble. Isn't that an elegant name? I once read about a spring called that. I think a dryad is a sort of grown-up fairy.
          emotion: happy
        - id: ch04-b07
          speaker: marilla_cuthbert
          text: >-
            I only hope you don't talk Diana to death. And remember, Anne, all these plans don't mean you'll play every minute, or even most of the time. You'll still have chores, and the work comes first.
        - id: ch04-b08
          speaker: narrator
          text: >-
            Anne's cup of happiness was already full. Then Matthew came home from the store in Carmody and made it overflow. With a shy glance at Marilla, he pulled a small package from his pocket and gave it to Anne.
        - id: ch04-b09
          speaker: matthew_cuthbert
          text: I heard you say you liked chocolate candies, so I brought you some.
        - id: ch04-b10
          speaker: marilla_cuthbert
          text: >-
            Humph. They'll ruin her teeth and upset her stomach. Oh, don't look so miserable, child. You may eat them, since Matthew went and bought them. He should have brought peppermints. They're better for you. Just don't make yourself sick by eating them all tonight.
        - id: ch04-b11
          speaker: anne_shirley
          text: >-
            Oh, I won't! I'll eat only one tonight, Marilla. May I give half to Diana? My half will taste twice as sweet if I can share the rest with her. It's wonderful to have something I can give her.
          emotion: happy
        - id: ch04-b12
          speaker: narrator
          text: Later, after Anne had gone up to her gable room, Marilla spoke to Matthew.
        - id: ch04-b13
          speaker: marilla_cuthbert
          text: >-
            I'll give the child credit for one thing. She isn't selfish. I'm glad of that, because nothing bothers me more than a stingy child. My goodness, she's only been here three weeks, but it feels as though she's always belonged here. I can't imagine the house without her now.
        - id: ch04-b14
          speaker: narrator
          text: Matthew gave Marilla a look that said he had known it all along.
        - id: ch04-b15
          speaker: marilla_cuthbert
          text: >-
            Don't you look at me like that, Matthew. An “I told you so” is bad enough from a woman, but no one can stand it from a man. I'll admit I'm glad I agreed to keep Anne, and I'll admit I'm growing fond of her. But don't you dare rub it in, Matthew Cuthbert.
