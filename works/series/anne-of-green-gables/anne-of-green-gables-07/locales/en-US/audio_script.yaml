audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm, observant, and gently amused
        timbre: clear and rounded
        pace: measured
        pitch: medium
    anne_shirley:
      display_name: Anne Shirley
      tts:
        delivery: vivid, earnest, and eagerly imaginative
        timbre: clear and youthful
        pace: lively
        pitch: medium-high
    marilla_cuthbert:
      display_name: Marilla Cuthbert
      tts:
        delivery: firm, practical, and restrained
        timbre: clear and mature
        pace: steady
        pitch: medium-low
    matthew_cuthbert:
      display_name: Matthew Cuthbert
      tts:
        delivery: shy, gentle, and quietly sincere
        timbre: soft and weathered
        pace: unhurried
        pitch: low
  chapters:
    - id: ch01
      title: Getting Ready for Bed
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            When Marilla took Anne upstairs that night, she spoke stiffly. She had noticed the clothes Anne had tossed across the floor the night before, and she meant to correct the habit at once.
        - id: ch01-b02
          speaker: marilla_cuthbert
          text: >-
            Anne, last night you left your clothes scattered all over the floor. I won't allow such untidy habits. When you take something off, fold it neatly and put it on the chair. I have no use for little girls who can't keep things neat.
        - id: ch01-b03
          speaker: anne_shirley
          text: >-
            Last night I was so upset that I never thought about my clothes. I'll fold them properly tonight. They made us do that at the asylum too, but I often forgot. I was always in such a hurry to get quietly into bed and imagine things.
        - id: ch01-b04
          speaker: marilla_cuthbert
          text: >-
            If you're going to stay here, you'll have to remember. There, that's much better. Now say your prayers and get into bed.
        - id: ch01-b05
          speaker: anne_shirley
          text: I don't ever say prayers.
        - id: ch01-b06
          speaker: narrator
          text: Marilla stared at her in horrified surprise.
        - id: ch01-b07
          speaker: marilla_cuthbert
          text: >-
            Anne, what do you mean? Didn't anyone teach you to pray? God expects little girls to say their prayers. Surely you know who God is.
          emotion: surprised
        - id: ch01-b08
          speaker: anne_shirley
          text: >-
            God is a spirit, infinite, eternal, and unchangeable in His being, wisdom, power, holiness, justice, goodness, and truth.
        - id: ch01-b09
          speaker: narrator
          text: Anne delivered the answer quickly and without a pause. Marilla looked relieved.
        - id: ch01-b10
          speaker: marilla_cuthbert
          text: >-
            Thank goodness you know something. You're not a complete heathen, after all. Where did you learn that?
        - id: ch01-b11
          speaker: anne_shirley
          text: >-
            At Sunday school in the asylum. We had to learn the whole catechism. I rather liked it because some of the words sound so splendid. Infinite, eternal, and unchangeable. Don't they sound grand? They roll along like a great organ playing. It isn't quite poetry, I suppose, but it sounds almost like poetry, doesn't it?
        - id: ch01-b12
          speaker: marilla_cuthbert
          text: >-
            We're discussing prayers, Anne, not poetry. Don't you understand that it's terribly wicked to go to bed without praying? I'm afraid you're a very bad little girl.
    - id: ch02
      title: How Anne Would Pray
      blocks:
        - id: ch02-b01
          speaker: anne_shirley
          text: >-
            You might find it easier to be good if you didn't have red hair. People without red hair have no idea how much trouble it causes. Mrs. Thomas said God made my hair red on purpose, and ever since then I haven't cared for Him. Besides, I was always too tired at night to bother with prayers. You can't look after twins all day and still be expected to pray at bedtime. Honestly, do you think you can?
        - id: ch02-b02
          speaker: narrator
          text: >-
            Marilla decided Anne's religious education had to begin immediately. There was clearly no time to waste.
        - id: ch02-b03
          speaker: marilla_cuthbert
          text: As long as you live under my roof, Anne, you will say your prayers.
        - id: ch02-b04
          speaker: anne_shirley
          text: >-
            Of course I will, if that's what you want. I'd do anything to please you. You'll have to tell me what to say tonight, though. Once I'm in bed, I'll think up a lovely prayer I can use from then on. Now that I consider it, making one could be very interesting.
          emotion: happy
        - id: ch02-b05
          speaker: marilla_cuthbert
          text: You have to kneel down.
        - id: ch02-b06
          speaker: narrator
          text: Marilla felt awkward as she said it. Anne knelt beside her and gazed solemnly up at her face.
        - id: ch02-b07
          speaker: anne_shirley
          text: >-
            Why do people have to kneel when they pray? I know what I'd do if I truly wanted to pray. I'd go alone into a huge field, or deep into the woods. Then I'd look up and up and up into that beautiful blue sky, where the blueness seems to go on forever. I wouldn't have to say anything. I'd simply feel a prayer. Well, I'm ready now. What should I say?
        - id: ch02-b08
          speaker: narrator
          text: >-
            Now Marilla was more uncomfortable than ever. She had meant to teach Anne the little bedtime prayer, “Now I lay me down to sleep.” But Marilla did have the beginnings of a sense of humor, which meant she could tell when something did not fit. That simple prayer belonged to little children in white nightgowns, saying it at their mothers' knees. It did not fit this freckled, bewitching girl. Anne knew nothing of God's love because she had never felt it through human love.
        - id: ch02-b09
          speaker: marilla_cuthbert
          text: >-
            You're old enough to make your own prayer, Anne. Thank God for the blessings you have, and humbly ask Him for the things you want.
    - id: ch03
      title: Anne's First Prayer
      blocks:
        - id: ch03-b01
          speaker: anne_shirley
          text: I'll do my best.
        - id: ch03-b02
          speaker: narrator
          text: Anne buried her face in Marilla's lap and began.
        - id: ch03-b03
          speaker: anne_shirley
          text: >-
            Gracious heavenly Father... That's how the ministers begin in church, so it must be all right for a private prayer too, mustn't it?
        - id: ch03-b04
          speaker: narrator
          text: Anne lifted her head for a moment, then went on.
        - id: ch03-b05
          speaker: anne_shirley
          text: >-
            Gracious heavenly Father, thank you for the White Way of Delight, the Lake of Shining Waters, Bonny, and the Snow Queen. I am extremely grateful for all of them. Those are the only blessings I can think of right now. There are so many things I want that naming every one would take far too long, so I'll give you the two most important. Please let me stay at Green Gables. And please let me grow up to be good-looking. I remain, yours respectfully, Anne Shirley.
        - id: ch03-b06
          speaker: anne_shirley
          text: >-
            Was that all right? If I'd had more time to plan it, I could have made it much more flowery.
        - id: ch03-b07
          speaker: narrator
          text: >-
            Marilla nearly collapsed. Only one thought saved her. Anne had not meant to be disrespectful. She simply knew nothing about spiritual matters. Marilla tucked her into bed and silently vowed to teach her a proper prayer the next day. She was carrying the light toward the door when Anne called her back.
        - id: ch03-b08
          speaker: anne_shirley
          text: >-
            I just remembered something. I should have ended with “Amen” instead of “yours respectfully,” shouldn't I? That's what ministers say. I forgot, but I knew a prayer needed some kind of ending, so I used the other one. Do you think it will matter?
        - id: ch03-b09
          speaker: marilla_cuthbert
          text: >-
            I... I don't think it will. Now be a good child and go to sleep. Good night.
        - id: ch03-b10
          speaker: anne_shirley
          text: Tonight I can say good night with a clear conscience.
        - id: ch03-b11
          speaker: narrator
          text: Anne settled luxuriously among her pillows.
    - id: ch04
      title: Marilla's New Responsibility
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            Marilla retreated downstairs to the kitchen. Once there, she planted the candle firmly on the table and turned a hard glare on Matthew.
        - id: ch04-b02
          speaker: marilla_cuthbert
          text: >-
            Matthew Cuthbert, it is high time somebody adopted that child and taught her something. She's almost a complete heathen. Can you believe she'd never said a prayer in her life until tonight? Tomorrow I'll borrow the Peep of the Day books from the manse. And the moment I can make her some suitable clothes, she is going to Sunday school. I can see I'll have my hands full. Well, nobody gets through life without some trouble. Mine has been easy enough until now, but I suppose my turn has come, and I'll simply have to make the best of it.
