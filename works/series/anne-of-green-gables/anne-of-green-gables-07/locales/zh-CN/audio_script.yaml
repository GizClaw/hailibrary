audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖从容，带着细腻而机智的讲述感
        timbre: 清澈柔和
        pace: 舒缓而有变化
        pitch: 中音
    anne:
      display_name: 安妮
      tts:
        delivery: 热切灵动，想法接连涌出，真挚而富于想象
        timbre: 清亮稚嫩
        pace: 明快，动情处自然放慢
        pitch: 中高音
    marilla:
      display_name: 玛丽拉
      tts:
        delivery: 干脆严谨，言语直截了当，偶尔透出克制的温情
        timbre: 清晰沉稳
        pace: 中等
        pitch: 中音
  chapters:
    - id: ch01
      title: 第七章　安妮做祷告
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 那天晚上，玛丽拉领安妮上楼睡觉。她一开口，语气还是硬邦邦的。
        - id: ch01-b02
          speaker: marilla
          text: 安妮，我昨晚看见你把脱下来的衣服扔得满地都是。这习惯太邋遢，我绝不允许。往后脱一件，就叠好一件，再整齐地放到椅子上。我可不喜欢不爱整洁的小姑娘。
        - id: ch01-b03
          speaker: anne
          text: 昨晚我心里难受得厉害，根本没顾上衣服。今晚一定好好叠。从前孤儿院也总叫我们这样做，可我有一半时候都会忘记。我一心只想赶快钻进被窝，安安静静躺下来想象各种事情。
        - id: ch01-b04
          speaker: marilla
          text: 你要留在这里，就得记牢些。嗯，这回才像样。现在做祷告，然后上床睡觉。
        - id: ch01-b05
          speaker: anne
          text: 可我从来不做祷告。
        - id: ch01-b06
          speaker: narrator
          text: 玛丽拉又震惊又骇然，直直地望着安妮。
        - id: ch01-b07
          speaker: marilla
          text: 安妮，你说什么？从来没人教你祷告吗？上帝希望小姑娘向他祷告。你总该知道上帝是谁吧？
          emotion: surprised
        - id: ch01-b08
          speaker: anne
          text: 上帝是灵。他的本体、智慧、权能、圣洁、公义、恩慈和信实，都是无限、永恒、永不改变的。
        - id: ch01-b09
          speaker: narrator
          text: 安妮不假思索，答得又快又流利。玛丽拉听完，这才稍稍松了口气。
        - id: ch01-b10
          speaker: marilla
          text: 谢天谢地，看来你还知道一点，不算十足的异教徒。这是在哪里学来的？
        - id: ch01-b11
          speaker: anne
          text: 在孤儿院的主日学校。他们让我们背整本教理问答，我还挺喜欢呢。有些词多壮丽呀。无限、永恒、永不改变。念起来声势浩大，像一架大风琴在演奏。它大概不能算诗，可听起来很像，对不对？
          emotion: happy
        - id: ch01-b12
          speaker: marilla
          text: 我们现在不谈诗，安妮，谈的是祷告。你不知道，每晚不祷告，是很邪恶、很可怕的事吗？恐怕你是个很坏的小姑娘。
        - id: ch01-b13
          speaker: anne
          text: 要是您也有一头红发，就会知道学坏比学好容易多了。没有红头发的人，根本不懂什么叫烦恼。托马斯太太说，上帝是故意把我的头发造得这么红的。从那以后，我就再也不喜欢他了。
        - id: ch01-b14
          speaker: anne
          text: 再说，我每晚都累得要命，哪还有心思祷告。一个人得照看一对双胞胎，您总不能还指望她祷告吧？说真的，您觉得能吗？
        - id: ch01-b15
          speaker: narrator
          text: 听到这里，玛丽拉立刻认定，安妮的宗教教育必须马上开始。眼下的情形再明白不过，一刻也不能耽搁。
        - id: ch01-b16
          speaker: marilla
          text: 只要你住在我的屋檐下，就必须做祷告。
        - id: ch01-b17
          speaker: anne
          text: 当然啦，既然您希望我做，我就做。只要能让您满意，我什么都肯做。不过这一次，您得教我该说什么。等我钻进被窝以后，我会自己想出一篇真正美好的祷告，以后每晚都念。现在仔细想想，这件事一定挺有趣的。
        - id: ch01-b18
          speaker: marilla
          text: 你得跪下来。
        - id: ch01-b19
          speaker: narrator
          text: 玛丽拉说这话时很窘。安妮在她膝边跪下来，神情严肃地仰起脸看着她。
        - id: ch01-b20
          speaker: anne
          text: 人为什么非得跪着祷告呢？要是我真心想祷告，我会独自去一片辽阔的田野，或者走进很深很深的树林。我会一直抬头，望上去，望上去，望进那片可爱的蓝天。它蓝得好像永远也没有尽头。然后，我心里自然就会生出一篇祷告。好啦，我准备好了。该说什么？
        - id: ch01-b21
          speaker: narrator
          text: 玛丽拉更窘了。她本想教安妮念那篇小孩子熟悉的祷词，“现在我要躺下安眠”。可她多少懂一点幽默，也懂得什么话该用在什么地方。那篇简单而神圣的小祷词，属于穿着白睡衣的童年，属于孩子依偎在母亲膝前、口齿不清地轻声念诵的时刻。它实在不适合眼前这个满脸雀斑、像小巫婆一样的姑娘。
        - id: ch01-b22
          speaker: narrator
          text: 安妮不懂，也不在意上帝的爱。因为从来没有人用人间的爱，让她明白那份爱是什么。
        - id: ch01-b23
          speaker: marilla
          text: 你已经大到可以自己祷告了。先为你得到的福分感谢上帝，再谦卑地求他赐给你想要的东西。
        - id: ch01-b24
          speaker: anne
          text: 好吧，我会尽力。仁慈的天父。牧师在教堂里都这么说，私下祷告时这样说，大概也没错吧？
        - id: ch01-b25
          speaker: narrator
          text: 安妮把脸埋进玛丽拉的裙子里，又忽然抬起头问了这一句。停了一会儿，她重新把脸埋下去，接着往下说。
        - id: ch01-b26
          speaker: anne
          text: 仁慈的天父，感谢您赐给我白色喜悦之路、闪光之湖、邦妮和白雪皇后。我真的非常非常感激。这会儿我能想到要感谢您的福分，只有这些了。
        - id: ch01-b27
          speaker: anne
          text: 至于我想要的东西，实在多得数也数不清，一个个说出来会花很久。所以我只提最重要的两件。请让我留在绿山墙，也请让我长大以后变得漂亮。我谨此致以，您恭敬的，安妮·雪莉。
        - id: ch01-b28
          speaker: anne
          text: 好啦，我做得对不对？要是再多给我一点时间想想，我本来能说得华丽得多。
        - id: ch01-b29
          speaker: narrator
          text: 安妮急切地站起来。可怜的玛丽拉险些彻底垮掉。幸好她及时想到，这篇离奇的祷告并不是有意不敬，只是因为安妮对信仰一无所知。玛丽拉这才勉强撑住。她替孩子掖好被子，心里发誓，第二天无论如何也要教她一篇祷词。她拿起灯正要离开房间，安妮又叫住了她。
        - id: ch01-b30
          speaker: anne
          text: 我刚想起来，最后不该说“您恭敬的”，应该照牧师那样说“阿门”，对不对？我忘了，可又觉得祷告总得有个结尾，才用了那一句。您说，这会有妨碍吗？
        - id: ch01-b31
          speaker: marilla
          text: 我……我想不会。现在做个好孩子，睡觉吧。晚安。
        - id: ch01-b32
          speaker: anne
          text: 今晚我总算可以问心无愧地说一声晚安了。
          emotion: happy
        - id: ch01-b33
          speaker: narrator
          text: 安妮舒舒服服地偎进一堆枕头里。玛丽拉一言不发地退回厨房，把蜡烛稳稳放在桌上，然后狠狠瞪着马修。
        - id: ch01-b34
          speaker: marilla
          text: 马修·卡斯伯特，真该有人收养这孩子，好好教她一点东西了。她简直就快是个十足的异教徒。你能相信吗？她这一辈子从没做过祷告，直到今晚才头一回做！
        - id: ch01-b35
          speaker: marilla
          text: 明天我要去牧师家借《初晓》那套书。还得尽快给她做几件合适的衣服，让她去上主日学校。看来以后有得我忙了。
        - id: ch01-b36
          speaker: marilla
          text: 唉，唉，人活在世上，总躲不过自己该受的那份操心。我到现在为止，日子一直过得相当轻松，可我的时候终于来了。我想，往后也只能尽量把事情做好。
