audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖机智，叙事细腻而自然
        timbre: 清澈柔和的成年女声
        pace: 从容，随情节轻快变化
        pitch: 中音
    anne:
      display_name: 安妮
      tts:
        delivery: 想象丰富，热烈真挚，情绪来得快而鲜明
        timbre: 清亮灵动的少女声
        pace: 偏快，动情时一气呵成
        pitch: 中高音
    marilla:
      display_name: 玛丽拉
      tts:
        delivery: 务实克制，话语干脆，偶尔透出藏起的温情
        timbre: 稳重略低的成年女声
        pace: 稍慢而利落
        pitch: 中低音
  chapters:
    - id: ch01
      title: 第二十二章　安妮应邀去喝茶
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 八月的一个黄昏，安妮从邮局一路跑回绿山墙。温暖的阳光落在小径上，树影懒懒地横在地面。她却跳着舞穿过这一切，活像一个被风送来的小精灵。她满身都是兴奋，眼睛亮得出奇，脸上的每一处都闪着光。
        - id: ch01-b02
          speaker: marilla
          text: 瞧你那双眼睛，都快从脑袋里蹦出来了。这回又是为什么？难不成你又找到一位知音了？
        - id: ch01-b03
          speaker: anne
          text: 不是知音。可是玛丽拉，你猜发生了什么？艾伦太太请我明天下午去牧师住宅喝茶！她把信留在邮局等我去拿。你看看信封，上面写着“绿山墙，安妮·雪莉小姐收”。从来没有人叫过我“小姐”，我看到时心里猛地一跳。这封信我要永远留着，跟我最珍爱的宝贝放在一起。
          emotion: happy
        - id: ch01-b04
          speaker: marilla
          text: 艾伦太太早就告诉过我，她要轮流请主日学校班里的学生喝茶。别为了这事兴奋得浑身发热。安妮，你得学会沉着一点。
        - id: ch01-b05
          speaker: narrator
          text: 可要安妮沉着，就得先把她的天性整个换掉。她就像是用灵气、火焰和露珠做成的，快乐也好，痛苦也好，一落进她心里，分量总会变成三倍。玛丽拉看得出，这个冲动的灵魂将来会被人生的高低起伏撞得很疼。她却还不明白，安妮感受快乐的力量也同样强大，也许那些快乐足以抵偿苦痛。
        - id: ch01-b06
          speaker: narrator
          text: 所以玛丽拉觉得，自己非得把安妮训练得平静稳重不可。这差不多等于叫浅溪上的阳光别再跳舞，实在既不可能，也不合安妮的性情。她的希望或计划一旦落空，整个人就掉进悲苦的深渊。可愿望一实现，她又会飞上令人眩晕的欢乐高处。玛丽拉常常沮丧地承认，自己的训练没什么成效。
        - id: ch01-b07
          speaker: narrator
          text: 她甚至快要绝望了。这个流落世间的小姑娘，恐怕永远也变不成她理想中那个端庄规矩的女孩。不过有件事，玛丽拉自己也没有想到。比起那个想象出来的模范孩子，她其实更喜欢眼前这个本来的安妮。
        - id: ch01-b08
          speaker: narrator
          text: 当天夜里，安妮愁得一句话也说不出。马修看见风转向东北，担心第二天会下雨。屋外白杨叶发出的沙沙声，听着像雨点落个不停。海湾那浑厚的轰鸣从远方传来，带着奇异而又久久不散的节奏。平日安妮最喜欢听，今晚却只觉得那是暴风雨和灾难的预告。她那么盼望一个晴天，于是觉得这个夜晚永远也过不完。
        - id: ch01-b09
          speaker: narrator
          text: 可凡事都有尽头，就连去牧师住宅喝茶前的长夜也一样。马修的预言没有应验，第二天一早，天空晴朗极了。安妮的心也跟着飞到了最高处。她站在水槽边洗早餐的碗碟，快活得几乎盛不下自己。
        - id: ch01-b10
          speaker: anne
          text: 玛丽拉，我今天心里有一种说不出的感觉，害得我看见谁都喜欢。你不知道我有多快活！要是这种心情能一直留下来就好了。假如每天都有人请我喝茶，我觉得自己肯定能成为模范孩子。
          emotion: happy
        - id: ch01-b11
          speaker: anne
          text: 可今天也是个非常郑重的日子，我越想越不安。要是我表现得不合规矩呢？我从没去牧师住宅喝过茶，不知道那些礼节是不是全都懂。来到绿山墙以后，我一直在读《家庭先驱报》的礼仪专栏，可我还是怕自己做傻事，也怕忘记该做的事。如果有样东西实在太好吃，特别特别想再来一份，添第二次还算有礼貌吗？
        - id: ch01-b12
          speaker: marilla
          text: 你的麻烦就在这里，总是只顾着想自己。别再琢磨自己会不会出错，只想想艾伦太太吧。怎么做能让她觉得高兴舒服，你就怎么做。
        - id: ch01-b13
          speaker: narrator
          text: 玛丽拉难得说出一句这样简明又实在的劝告。安妮听完，马上懂了。
        - id: ch01-b14
          speaker: anne
          text: 你说得对，玛丽拉。我一定试试，完全不去想自己。
        - id: ch01-b15
          speaker: narrator
          text: 看来那次拜访很顺利，安妮没有严重违反任何礼节。黄昏时，她带着满心幸福回到家。高高的天空一眼望不到边，藏红花色和玫瑰色的云霞在上面铺开。她坐到厨房门外的红砂岩大石板上，把疲倦的鬈发脑袋枕在玛丽拉的方格布裙上，欢欢喜喜地讲起了下午的经历。
        - id: ch01-b16
          speaker: narrator
          text: 凉风从西边长满冷杉的山岭吹下来，越过一片片收获的田野，在白杨树间打着呼哨。果园上空亮着一颗清澈的星。情人小径那边，萤火虫穿过蕨丛，在沙沙响的树枝间忽隐忽现。安妮望着这一切，觉得风、星光和萤火虫不知怎么缠在了一起，变成了一种说不出口的甜美和迷人。
        - id: ch01-b17
          speaker: anne
          text: 玛丽拉，今天真是迷人极了！我觉得自己没有白活这一辈子。哪怕以后再也没有人请我去牧师住宅喝茶，这种感觉也不会消失。我刚到门口，艾伦太太就来接我。她穿着淡粉红色的蝉翼纱裙，裙上全是漂亮的褶边，袖子刚到手肘。她看上去简直像天使。
          emotion: happy
        - id: ch01-b18
          speaker: anne
          text: 我真想长大以后做一位牧师太太。牧师不大在意世俗的东西，也许就不会嫌我的头发红。可牧师太太得天生善良，我永远也不会是那种人，看来想也没用。有些人生下来就会做好人，我属于另一种。林德太太说，我浑身都是原罪。无论我怎样努力，都比不上那些天生善良的人，简直像学几何一样难。不过，我已经那么努力了，这总该算一点吧？
        - id: ch01-b19
          speaker: anne
          text: 艾伦太太就是天生善良的人，我爱她爱得不得了。有的人像马修和艾伦太太，你一见面就能爱上，根本不用费劲。还有些人像林德太太，你必须非常努力才能爱她。你知道自己应该爱，因为她懂得多，又热心替教会做事。可你得不停提醒自己，不然一转眼就忘了。
        - id: ch01-b20
          speaker: anne
          text: 今天还有个白沙主日学校的小姑娘也来喝茶，名字叫洛蕾塔·布拉德利。她很不错，虽说还算不上知音，确实是个挺好的姑娘。那顿茶点讲究极了，我想我也把礼节守得很好。后来艾伦太太弹琴唱歌，还叫洛蕾塔和我一起唱。
        - id: ch01-b21
          speaker: anne
          text: 艾伦太太说我嗓子不错，以后一定要去主日学校唱诗班。只要想想这件事，我就激动得不得了。我一直想像戴安娜那样参加唱诗班，又怕这份荣誉永远轮不到我。
          emotion: happy
        - id: ch01-b22
          speaker: anne
          text: 洛蕾塔很早就走了。今晚白沙旅馆有一场盛大的音乐会，她姐姐要上台朗诵。她说，旅馆里的美国人每两周办一场音乐会，为夏洛特敦医院募捐，还会请不少白沙的人上台。洛蕾塔觉得，总有一天也会有人请她朗诵。我听了，只能满怀敬意地望着她。
        - id: ch01-b23
          speaker: anne
          text: 她走以后，我和艾伦太太说了好多心里话。我把什么都讲了，托马斯太太、那对双胞胎、凯蒂·莫里斯、维奥莱塔，还有我怎么来到绿山墙，也讲了几何带给我的烦恼。你能相信吗，玛丽拉？艾伦太太说，她以前学几何也是个笨蛋。这句话给了我好大的勇气。
        - id: ch01-b24
          speaker: anne
          text: 我正要离开时，林德太太来了。玛丽拉，你猜她带来了什么消息？学校董事已经请到新老师了，而且是位女老师！她叫穆丽尔·斯泰西小姐。这个名字听起来多浪漫呀。
        - id: ch01-b25
          speaker: anne
          text: 林德太太说，埃文利以前从来没有女老师，突然这样改变很危险。可我觉得有位女老师一定好极了。离开学还有两个星期，我简直不知道该怎么熬过去。我现在就急着想见到她！
