audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm, observant, and gently amused
        timbre: clear and rounded
        pace: measured
        pitch: medium
    anne_shirley:
      display_name: Anne Shirley
      tts:
        delivery: vivid, earnest, and eagerly imaginative
        timbre: clear and youthful
        pace: lively
        pitch: medium-high
    marilla_cuthbert:
      display_name: Marilla Cuthbert
      tts:
        delivery: firm, practical, and restrained
        timbre: clear and mature
        pace: steady
        pitch: medium-low
  chapters:
    - id: ch01
      title: Anne Is Invited Out to Tea
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: "Anne came back from the post office fairly dancing up the lane. The August evening was all soft sunshine and slow shadows, and she looked like a little sprite blown along by the wind. Excitement seemed to wrap around her. It shone in her eyes and lit up her whole face."
        - id: ch01-b02
          speaker: marilla_cuthbert
          text: "Now what has your eyes nearly popping out of your head? Have you found another kindred spirit?"
        - id: ch01-b03
          speaker: anne_shirley
          text: "No, Marilla, but just guess what happened! I've been invited to tea at the manse tomorrow afternoon. Mrs. Allan left a letter for me at the post office. Look at the envelope. It says, 'Miss Anne Shirley, Green Gables.' No one ever called me 'Miss' before. It gave me such a thrill! I'm going to keep it forever with my dearest treasures."
          emotion: happy
        - id: ch01-b04
          speaker: marilla_cuthbert
          text: "Mrs. Allan told me she planned to invite each member of her Sunday school class to tea. There's no need to work yourself into such a state. You must learn to take things calmly, child."
        - id: ch01-b05
          speaker: narrator
          text: "But Anne could no more take things calmly than she could change her whole nature. She was made of spirit and fire and dew. Every joy and every sorrow reached her with three times its usual force. Marilla knew it, and the thought troubled her a little. Life's ups and downs might be hard on a heart so quick to leap. What Marilla did not quite understand was that Anne's great gift for delight could make up for a great deal."
        - id: ch01-b06
          speaker: narrator
          text: "Marilla believed it was her duty to train Anne into a quiet, even-tempered little girl. That suited Anne about as well as stillness suited a sunbeam dancing in the shallow brook. Marilla had to admit she was making very little progress. When one of Anne's precious hopes fell apart, Anne plunged into the deepest misery. When a hope came true, she flew straight to the heights of happiness. Marilla was nearly ready to give up on turning this wandering child into her model of prim manners and proper behavior. She would never have admitted that she liked Anne much better exactly as she was."
        - id: ch01-b07
          speaker: narrator
          text: "That night, Anne went to bed too miserable to speak. Matthew had said the wind was coming around from the northeast, and he feared rain the next day. Every rustle of the poplar leaves sounded to Anne like pattering rain. Usually she loved the far-off roar of the gulf and its deep, haunting rhythm. Tonight it sounded like a warning of storms and disaster to a little girl who desperately wanted fine weather. Morning seemed as though it would never come."
        - id: ch01-b08
          speaker: narrator
          text: "Still, everything ends eventually, even the night before tea at the manse. Matthew's prediction proved wrong. The morning was clear, and Anne's spirits rose as high as they could go. While she washed the breakfast dishes, love for the whole world bubbled out of her."
        - id: ch01-b09
          speaker: anne_shirley
          text: "Oh, Marilla, something inside me makes me love everyone I see today. I feel so wonderfully good! Wouldn't it be lovely if the feeling could last? I believe I could become a model child if someone invited me to tea every day. But this is a solemn occasion too, and I'm terribly anxious. What if I don't behave properly? I've never had tea at a manse. I've studied the etiquette column in the Family Herald ever since I came here, but I may not know every rule. What if I do something foolish, or forget something important? If you wanted a second helping very much, would it be polite to take one?"
        - id: ch01-b10
          speaker: marilla_cuthbert
          text: "Your trouble is that you're thinking far too much about yourself. Think about Mrs. Allan instead, and about what would make the visit pleasant for her."
        - id: ch01-b11
          speaker: narrator
          text: "For once, Marilla had offered a short piece of excellent advice. Anne understood it at once."
        - id: ch01-b12
          speaker: anne_shirley
          text: "You're right, Marilla. I'll try not to think about myself at all."
        - id: ch01-b13
          speaker: narrator
          text: "Anne must have made it through the visit without breaking any serious rule of etiquette. She came home in the twilight looking perfectly blessed. Above her, the high sky glowed with long trails of rose and saffron cloud. She sat on the broad red sandstone step by the kitchen door, rested her tired curly head in Marilla's gingham-covered lap, and happily told her everything."
        - id: ch01-b14
          speaker: narrator
          text: "A cool wind swept across the long harvest fields from the fir-covered western hills, then whistled through the poplars. One bright star hung above the orchard. Fireflies flickered through Lover's Lane, appearing and vanishing among the ferns and rustling branches. As Anne watched them, the wind and the star and the fireflies seemed to weave themselves together into something too sweet and enchanting for words."
        - id: ch01-b15
          speaker: anne_shirley
          text: "Oh, Marilla, it was the most fascinating afternoon! Now I know I haven't lived for nothing. Even if no one ever invites me to tea at a manse again, I'll always feel that way. Mrs. Allan met me right at the door. She had on the sweetest pale pink organdy dress, with dozens of ruffles and sleeves that came to her elbows. She looked just like an angel."
          emotion: happy
        - id: ch01-b16
          speaker: anne_shirley
          text: "I think I might like to be a minister's wife when I grow up. A minister may not care about my red hair, because he shouldn't be thinking about worldly things like that. Of course, a minister's wife would have to be good by nature, and I never will be, so there's probably no use imagining it. Some people are born good, and some aren't. I'm one of the ones who aren't. Mrs. Lynde says I'm full of original sin."
        - id: ch01-b17
          speaker: anne_shirley
          text: "No matter how hard I try, I can't be as successful at goodness as people who come by it naturally. I suppose it's a lot like geometry. But surely trying so hard ought to count for something, don't you think? Mrs. Allan is naturally good. I love her with all my heart. Some people, like Matthew and Mrs. Allan, are easy to love the instant you meet them."
        - id: ch01-b18
          speaker: anne_shirley
          text: "Then there are people like Mrs. Lynde, and loving them takes a great deal of effort. You know you ought to love them because they know so much and work so hard for the church. But you have to remind yourself over and over, or you'll forget."
        - id: ch01-b19
          speaker: anne_shirley
          text: "Another girl came to tea from the White Sands Sunday school. Her name was Lauretta Bradley. She was very nice, though she wasn't exactly a kindred spirit. We had an elegant tea, and I'm almost sure I followed the rules of etiquette. Afterward, Mrs. Allan played and sang. Then she had Lauretta and me sing too."
        - id: ch01-b20
          speaker: anne_shirley
          text: "Mrs. Allan says I have a good voice, Marilla! She says I must sing in the Sunday school choir from now on. Just the thought of it thrilled me. I've wanted so much to sing in the choir like Diana does, but I was afraid I'd never be worthy of such an honor."
          emotion: happy
        - id: ch01-b21
          speaker: anne_shirley
          text: "Lauretta had to leave early. There's a big concert at the White Sands Hotel tonight, and her sister is reciting in it. Lauretta says the American guests hold a concert every two weeks to raise money for the Charlottetown hospital. They invite lots of people from White Sands to recite. She expects they'll ask her someday. I could only stare at her in wonder."
        - id: ch01-b22
          speaker: anne_shirley
          text: "After Lauretta left, Mrs. Allan and I had a real heart-to-heart talk. I told her everything. I told her about Mrs. Thomas, the twins, Katie Maurice, Violetta, coming to Green Gables, and all my trouble with geometry. And can you believe it? Mrs. Allan said she was a dunce at geometry too. You can't imagine how much that encouraged me."
        - id: ch01-b23
          speaker: anne_shirley
          text: "Mrs. Lynde arrived at the manse just before I came home, and listen to this, Marilla. The trustees have hired a new teacher, and she's a woman! Her name is Miss Muriel Stacy. Isn't that a wonderfully romantic name? Mrs. Lynde says Avonlea has never had a woman teacher before, and she thinks it's a dangerous new idea."
        - id: ch01-b24
          speaker: anne_shirley
          text: "I think having a lady teacher will be splendid. I honestly don't know how I'll survive the next two weeks until school starts. I can hardly wait to see her."
          emotion: happy
