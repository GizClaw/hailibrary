audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖机智，叙事细腻而自然
        timbre: 清澈柔和的成年女声
        pace: 从容，随情节轻快变化
        pitch: 中音
    anne:
      display_name: 安妮
      tts:
        delivery: 想象丰富，热烈真挚，情绪来得快而鲜明
        timbre: 清亮灵动的少女声
        pace: 偏快，动情时一气呵成
        pitch: 中高音
    diana:
      display_name: 戴安娜
      tts:
        delivery: 诚恳温柔，朴实中带着少女的羞怯
        timbre: 柔润甜美的少女声
        pace: 适中
        pitch: 中高音
    marilla:
      display_name: 玛丽拉
      tts:
        delivery: 务实克制，话语干脆，偶尔透出藏起的温情
        timbre: 稳重略低的成年女声
        pace: 稍慢而利落
        pitch: 中低音
    mrs_allan:
      display_name: 艾伦太太
      tts:
        delivery: 明朗亲切，善解人意，安慰人时真诚柔和
        timbre: 温润明亮的年轻女声
        pace: 舒缓自然
        pitch: 中音
  chapters:
    - id: ch01
      title: 第二十一章　调味品的新花样
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 六月的最后一天，安妮放学回到绿山墙。她把书和石板搁到厨房桌上，眼睛哭得通红，手里那块手帕也早已湿透了。
        - id: ch01-b02
          speaker: anne
          text: 哎呀，这世上总是在相逢，又总是在告别，林德太太说得真对。玛丽拉，幸亏我今天多带了一块手帕。我早就预感到会用上它。
        - id: ch01-b03
          speaker: marilla
          text: 我以前可不知道，你这样舍不得菲利普斯先生。他不过是要走了，你竟哭得非用两块手帕不可。
        - id: ch01-b04
          speaker: anne
          text: 我哭大概不是因为真有那么舍不得他，而是因为大家全哭了。鲁比·吉利斯先哭起来的。她明明一直说讨厌菲利普斯先生，可他一站起来讲告别辞，她的眼泪马上就来了。接着姑娘们一个一个，全都哭了。
        - id: ch01-b05
          speaker: anne
          text: 我拼命想忍住，玛丽拉。我提醒自己，他罚过我跟吉——跟一个男生坐在一起。他还把我的名字漏写了一个“e”，说我是他见过最不懂几何的笨蛋，笑过我的拼字，也没少挖苦我。可这些事忽然全不管用了，我也只好哭。
        - id: ch01-b06
          speaker: anne
          text: 简·安德鲁斯念叨了整整一个月，说他走了才好，她绝不会哭。可到头来，她哭得比谁都厉害。她没想到自己会哭，连手帕都没带，只好向哥哥借。男生们当然没哭。那场面真是太叫人心碎了。菲利普斯先生还没开口多久，教室里已经到处都是抽泣声。
        - id: ch01-b07
          speaker: anne
          text: 菲利普斯先生的告别辞可感人了。他开头就说：“我们分别的时刻已经到了。”连他自己眼里也有泪。我想起从前上课讲话，在石板上画他的像，还拿他和普里西开玩笑，心里又难过又后悔。我真希望自己像明妮·安德鲁斯一样，一直是个模范学生，不必受良心责备。
        - id: ch01-b08
          speaker: anne
          text: 放学路上，我们一路都在哭。眼看大家快缓过来了，卡丽·斯隆就又念一句“我们分别的时刻已经到了”，我们便重新哭起来。她每隔几分钟就来一次，所以谁也高兴不起来。我现在还很难过。不过，前面有两个月的假期，人也没法一直绝望到底，是不是？
        - id: ch01-b09
          speaker: anne
          text: 而且我们碰见了刚从车站来的新牧师夫妇。就算我正为菲利普斯先生伤心，也难免会对新牧师有一点兴趣呀。他太太很漂亮，却没有美得像王后。我想，牧师娶一位有王后般美貌的太太，也许会给别人立下坏榜样。
        - id: ch01-b10
          speaker: anne
          text: 林德太太就说，新桥那位牧师太太穿得太时髦，榜样很不好。咱们这位新牧师太太穿的是蓝色薄棉布衣裳，鼓袖特别好看，帽子上还有玫瑰。简觉得牧师太太穿鼓袖太贪恋俗世。我可没说这么不厚道的话，因为我知道一心盼望鼓袖是什么滋味。何况她才做牧师太太不久，还没有完全习惯这份身份，我们应该宽容她一些，对不对？牧师住宅收拾好以前，他们会一直寄住在林德太太家。
        - id: ch01-b11
          speaker: narrator
          text: 当天傍晚，玛丽拉也去了林德太太家。她说是去还去年冬天借的绗被架。要是心里还藏着一点想看看新客人的念头，她也并不孤单。那天晚上，林德太太借出去的许多东西，连她以为再也收不回来的，都由借主亲手送了回来。埃文利难得有新鲜事。一位带着太太的新牧师，当然值得大家名正言顺地好奇一番。
        - id: ch01-b12
          speaker: narrator
          text: 从前的本特利牧师在埃文利待了十八年。安妮觉得他唯一的大毛病，就是没有想象力。他来时是鳏夫，离开时依旧是鳏夫，尽管闲话年年都要替他物色一位妻子，而且每年说的对象还不一样。二月里，他辞去牧职。教民们舍不得这位相处多年的老人。虽然他不大会讲道，十八年的情分却不是假的。
        - id: ch01-b13
          speaker: narrator
          text: 从那以后，许多候选牧师和临时代牧轮流来试讲，埃文利教堂着实热闹了一阵。他们能不能留下，要听教会长辈的评判。不过，卡思伯特家的长椅一角，还有个端端正正坐着的红头发小姑娘，也把每个人评量了一遍。安妮总会同马修细谈自己的见解，玛丽拉却坚持不议论任何牧师。
        - id: ch01-b14
          speaker: anne
          text: 史密斯先生肯定不合适，马修。林德太太嫌他不会讲道，我却觉得他最大的毛病是没有想象力，跟本特利先生一样。特里先生又想象得太过头，连他自己都管不住，简直像我编闹鬼林那次。而且林德太太说，他的神学见解不纯正。
        - id: ch01-b15
          speaker: anne
          text: 格雷沙姆先生为人很好，信仰也虔诚，可笑话讲得太多，大家竟在教堂里笑起来。他这样不够庄重，牧师总得有几分庄重吧？马歇尔先生倒很有魅力，可林德太太特意打听过，他既没结婚，也没订婚。埃文利不能请年轻的单身牧师，因为他可能娶教会里的姑娘，那就会惹麻烦。林德太太真是个想得长远的人，对不对，马修？
        - id: ch01-b16
          speaker: anne
          text: 所以他们选了艾伦先生，我很高兴。他讲道有意思，祷告也像是真心想说那些话，不只是因为天天都在做，早已成了习惯。林德太太盘问过所有教义要点，确认他的神学没有问题。她也认识艾伦太太娘家的人，知道他们家十分体面，女人又都善于持家。照她的说法，丈夫教义纯正，妻子会管家，正好组成最理想的牧师家庭。至于艾伦先生不够完美，一年只出七百五十美元，大家也不能要求更多了。
        - id: ch01-b17
          speaker: narrator
          text: 艾伦夫妇年轻和善，蜜月还没过完。他们真心热爱自己选定的终身事业，满怀美好而崇高的愿望。埃文利从一开始就向他们敞开了心。村里的老人和孩子全都从心里喜欢牧师的坦率开朗，也十分敬重他的远大理想。他的太太聪慧温柔，把牧师住宅照管起来。安妮更是一见艾伦太太就全心喜欢上了她。她确信，自己又遇见了一位知音。
        - id: ch01-b18
          speaker: anne
          text: 艾伦太太简直太可爱了！她现在教我们那一班，而且教得特别好。她说，总由老师问问题，对学生不公平。这正是我一直以来的想法。她让我们随便问，于是我问了好多。玛丽拉，我很会提问题的。
        - id: ch01-b19
          speaker: marilla
          text: 这个我绝对相信。
        - id: ch01-b20
          speaker: anne
          text: 除了我，只有鲁比问了一个。她问夏天会不会办主日学校野餐会。那天明明讲的是但以理落进狮子坑，她的问题跟课上一点关系也没有，我觉得问得不太合适。可艾伦太太只是笑着说，她想应该会办。
        - id: ch01-b21
          speaker: anne
          text: 她笑起来真美，脸上有两个精巧极了的酒窝。我也想要酒窝。现在我已经不像刚来时那么瘦，可酒窝还是没有。要是有了，我也许就更能感化别人向善了。艾伦太太说，我们应该时时努力，让别人也变得更好。她不论讲什么，都让人听着那么舒服。
        - id: ch01-b22
          speaker: anne
          text: 我以前从不知道，信仰也能让人这样快活。我一直以为它有些忧郁，可艾伦太太一点也不忧郁。要是能做一个像她那样的基督徒，我很愿意。贝尔校长那样的，我就不想做。
        - id: ch01-b23
          speaker: marilla
          text: 这样说贝尔先生太不像话。他是个真正的好人。
        - id: ch01-b24
          speaker: anne
          text: 他当然好，可他好像没从这件事里得到一点快活。换作我，我会高兴得整天唱歌跳舞。艾伦太太大概年纪太大，不适合再唱歌跳舞，牧师太太那样做也不庄重。可是我能感觉到，她很庆幸自己是个基督徒。就算不做基督徒也能上天堂，她照样会选择做一个。
        - id: ch01-b25
          speaker: marilla
          text: 咱们也该请艾伦夫妇来喝茶了。除了这里，他们差不多哪里都去过。下星期三不错。可是别告诉马修。他一知道客人要来，那天准找借口躲出去。本特利先生他早已习惯了，可要认识新牧师就难得很，更别说还要面对一位新牧师太太。
        - id: ch01-b26
          speaker: anne
          text: 我一定保密，像死人那样一个字也不说。不过玛丽拉，那天让我做一个蛋糕，好不好？我想为艾伦太太做点事。现在我的蛋糕已经做得不错了。
        - id: ch01-b27
          speaker: marilla
          text: 那你就做一个夹层蛋糕吧。
        - id: ch01-b28
          speaker: narrator
          text: 接下来的星期一和星期二，绿山墙忙得不可开交。请牧师夫妇喝茶是件严肃的大事，玛丽拉决心让一切都妥妥当当，绝不肯被埃文利哪位主妇比下去。安妮更是又兴奋又快活。星期二黄昏，她和戴安娜坐在树精之泉旁的大红石头上。两人用蘸了香脂冷杉树脂的小树枝拨动泉水，水里便漾出一道道彩虹。安妮把这两天的忙碌和整份菜单，从头到尾数给朋友听。
        - id: ch01-b29
          speaker: anne
          text: 除了我明早要做的蛋糕，还有玛丽拉临近茶点时才烤的小圆饼，别的全准备好了。这两天我们真是忙极了。请牧师一家喝茶，责任有多重大呀。我以前从没经历过这样的事。你该看看食品间，简直壮观得不得了。
        - id: ch01-b30
          speaker: anne
          text: 我们备了鸡肉冻、冷牛舌、红黄两种果冻、鲜奶油、柠檬派、樱桃派、三种小甜饼、水果蛋糕、磅蛋糕和夹层蛋糕。还有玛丽拉出了名的黄李子果酱，她平时舍不得拿出来，专门留给牧师吃。另外就是刚才说过的小圆饼。面包既有新烤的，也有放过的，免得牧师消化不好，不能吃新面包。你说，这么多东西摆出来，该有多好看！
        - id: ch01-b31
          speaker: anne
          text: 林德太太说牧师们大多消化不良。不过艾伦先生做牧师还不算久，身体大概还没来得及受影响。我一想到夹层蛋糕就浑身发冷。要是它做坏了呢？昨晚我还梦见一个可怕的妖怪，它顶着一个大夹层蛋糕当脑袋，追得我到处跑。
        - id: ch01-b32
          speaker: diana
          text: 放心吧，一定会做好。两个星期前，我们在悠闲谷吃过你做的蛋糕。我分到的那一块，味道好极了。
        - id: ch01-b33
          speaker: anne
          text: 可蛋糕偏有一种坏脾气。你越是急着把它做好，它就越可能坏掉。我只能信赖上天，再仔细记住一定要放面粉。上次那种错误，我可不会再犯了。快看，戴安娜，这道彩虹多美！等我们走了，树精会不会从藏身的地方出来，把水里的彩虹捡起来，披在肩上当一条围巾？
        - id: ch01-b34
          speaker: diana
          text: 你知道世上并没有树精。
        - id: ch01-b35
          speaker: narrator
          text: 戴安娜的母亲已经听说闹鬼林的事，还狠狠生了一场气。从那以后，戴安娜不敢再跟着安妮放纵想象，也不再模仿她那些飞得太远的念头。如今哪怕只相信无害的树精，她也觉得最好谨慎一点，不该再助长这种心思。
        - id: ch01-b36
          speaker: anne
          text: 可是想象她真的存在，一点也不难。每天睡前，我都会望出窗外，猜她是不是正坐在泉边，把泉水当镜子，梳理长发。有时早晨起来，我还去露水里找她的脚印。戴安娜，千万别连树精也不相信了。
        - id: ch01-b37
          speaker: narrator
          text: 星期三一早，安妮随着日出起了床。她兴奋得根本睡不着。昨晚把小树枝放进泉水时，她在水里摆弄了太久，因此患了很重的伤风。可除非得的是不折不扣的肺炎，否则谁也休想叫她放下做蛋糕的念头。早饭后，她马上动手，仔细照着食谱一样样放进去。等蛋糕终于送进烤箱，炉门也关好了，她才长长出了一口气。
        - id: ch01-b38
          speaker: anne
          text: 这一次，我肯定什么都没忘。玛丽拉，你说它能发起来吗？我用的是新罐子里的发酵粉，可万一它不好呢？林德太太说，现在什么都掺假，谁也不能保证发酵粉可靠。政府本该管管，可她说只要保守党执政，咱们这辈子都等不到。要是蛋糕发不起来怎么办？
        - id: ch01-b39
          speaker: marilla
          text: 就算没有这个蛋糕，吃的东西也多得很。
        - id: ch01-b40
          speaker: narrator
          text: 安妮担心了半天，蛋糕偏偏发得很好。出炉时又轻又松，活像一团金色泡沫。安妮高兴得双颊通红，在每一层中间抹上红宝石般晶亮的果冻，再小心把蛋糕合好。她站在那里端详自己的成果，心里的画面已经清楚极了。艾伦太太会尝上一口，露出喜欢的神情，说不定吃完以后还会再要一块。
        - id: ch01-b41
          speaker: anne
          text: 玛丽拉，今天当然要用最好的茶具吧？我能拿蕨叶和野玫瑰来装饰桌子吗？
        - id: ch01-b42
          speaker: marilla
          text: 我看全是没用的花样。桌上真正要紧的是食物，不是那些装饰。
        - id: ch01-b43
          speaker: anne
          text: 巴里太太就装饰过桌子，牧师还夸得特别文雅呢。他说，那桌饭菜不光让嘴巴有福，连眼睛也跟着享福。
        - id: ch01-b44
          speaker: narrator
          text: 安妮这句话颇有一点小小的机灵。玛丽拉本来就不愿输给巴里太太，更不愿输给别人。
        - id: ch01-b45
          speaker: marilla
          text: 那就随你吧。只要给盘子和食物留够地方。
        - id: ch01-b46
          speaker: narrator
          text: 玫瑰和蕨叶多得很，安妮又天生有艺术眼光，于是使出浑身解数，把茶桌装点得美极了。她一心要让巴里太太家的桌子再也比不上这一张。艾伦夫妇一坐下来，看到眼前的景象，便一同赞叹不已。
        - id: ch01-b47
          speaker: marilla
          text: 这些都是安妮布置的。
        - id: ch01-b48
          speaker: narrator
          text: 玛丽拉说得一脸严肃，却很公道。艾伦太太赞许地对安妮一笑，安妮觉得，人间简直承受不了这样大的幸福。马修原本害羞紧张得厉害，玛丽拉已经拿他没办法了，安妮却不知用了什么法子，硬是把他哄到了桌边。他穿着最好的衣裳，系着白领，竟和牧师谈得很有些意思。至于艾伦太太，他始终没敢同她说一个字。这也实在不能强求。
        - id: ch01-b49
          speaker: narrator
          text: 整顿茶点一直欢快得像婚礼钟声，直到安妮的夹层蛋糕传上桌。艾伦太太先前已经尝过一大堆各式各样的食物，多得叫人眼花，因此本来不想再吃。玛丽拉看见安妮脸上的失望，便笑着劝她。
        - id: ch01-b50
          speaker: marilla
          text: 这一块你可一定要尝。安妮专门为你做的。
        - id: ch01-b51
          speaker: mrs_allan
          text: 那我当然得尝一尝。
        - id: ch01-b52
          speaker: narrator
          text: 艾伦太太笑着拿了一块厚厚的三角蛋糕，牧师和玛丽拉也各拿一块。她咬下一口，脸上忽然闪过十分古怪的神情。可她体贴地一个字也没说，只管一口接一口地吃。玛丽拉看见她的表情，立刻觉得事情不对，连忙尝了尝自己盘里的蛋糕。
        - id: ch01-b53
          speaker: marilla
          text: 安妮·雪莉！你到底在这个蛋糕里放了什么？
          emotion: surprised
        - id: ch01-b54
          speaker: anne
          text: 我只放了食谱上写的东西。玛丽拉，难道味道不对吗？
        - id: ch01-b55
          speaker: marilla
          text: 何止不对，简直难吃得可怕。艾伦先生，千万别再吃了。安妮，你自己尝尝。你拿什么调的味？
        - id: ch01-b56
          speaker: anne
          text: 香草精，就只放了香草精。哦，玛丽拉，准是发酵粉出了问题。我早就怀疑那一罐发——
        - id: ch01-b57
          speaker: marilla
          text: 别胡扯发酵粉了！去把那只香草精瓶子拿给我。
        - id: ch01-b58
          speaker: narrator
          text: 安妮冲进食品间，又拿着一只小瓶子跑回来。瓶里还剩一些棕色液体，泛黄的标签上写着“上等香草精”。玛丽拉拔开瓶塞，凑过去闻了闻。
        - id: ch01-b59
          speaker: marilla
          text: 天哪，安妮，你用来调味的根本不是香草精，是止痛搽剂！上星期搽剂瓶摔破了，我怕浪费，便把剩下的搽剂倒进了一只用空的香草精瓶。这件事也有一半是我的错，我本来该提醒你。可看在老天分上，你拿起瓶子时怎么就没先闻一闻呢？
          emotion: surprised
        - id: ch01-b60
          speaker: narrator
          text: 两重耻辱一齐压下来，安妮顿时哭成了泪人。
        - id: ch01-b61
          speaker: anne
          text: 我闻不出来，我的伤风太重了！
          emotion: sad
        - id: ch01-b62
          speaker: narrator
          text: 她说完便逃上楼，冲进山墙房间，扑倒在床上伤心痛哭，任谁也安慰不了。过了一会儿，楼梯上传来轻轻的脚步，有人走进房间。安妮没有抬头，还以为来的是玛丽拉。
        - id: ch01-b63
          speaker: anne
          text: 玛丽拉，我的名声这一辈子都毁了，再也洗不掉这个耻辱。事情肯定会传开，埃文利的事情从来瞒不住。戴安娜会来问蛋糕怎么样，我只能把真相告诉她。以后无论我走到哪里，大家都会指着我说，瞧，她就是那个用止痛搽剂给蛋糕调味的姑娘。
          emotion: sad
        - id: ch01-b64
          speaker: anne
          text: 吉——学校里的男生会永远拿这件事笑我。玛丽拉，你要还有一点基督徒的慈悲心，就别叫我现在下楼洗碗。等客人走了，我会洗，可我再也没脸见艾伦太太。她或许以为我想毒死她。林德太太说过，她认识一个孤儿，曾经想毒死收养自己的恩人。
          emotion: sad
        - id: ch01-b65
          speaker: anne
          text: 不过，止痛搽剂其实没有毒，它本来就是可以内服的，只是不能放进蛋糕。至少艾伦太太没有真的中毒。玛丽拉，你能不能替我把这点说清楚？请你告诉她，我绝没有要毒害她。
          emotion: sad
        - id: ch01-b66
          speaker: mrs_allan
          text: 你何不自己起来，把这件事告诉我呢？
        - id: ch01-b67
          speaker: narrator
          text: 安妮一下子跳了起来。站在床边的竟是艾伦太太，她正含笑看着安妮。
        - id: ch01-b68
          speaker: mrs_allan
          text: 亲爱的小姑娘，别再这样哭了。你瞧，这不过是个好笑的小差错，换作别人也可能犯。
          emotion: calm
        - id: ch01-b69
          speaker: narrator
          text: 可安妮脸上的悲痛实在太深，艾伦太太看着，心里真有些不安。
        - id: ch01-b70
          speaker: anne
          text: 不会的，只有我才会犯这种错。我原本那么想为你做一个好吃的蛋糕。
          emotion: sad
        - id: ch01-b71
          speaker: mrs_allan
          text: 我知道，亲爱的。你的好意，你花的心思，我全都明白。哪怕蛋糕做得再成功，我也不会比现在更感激你。好了，别哭了。跟我下楼，让我看看你的花园吧。卡思伯特小姐说，你有一块自己的小园地。我很喜欢花，正想去瞧瞧。
          emotion: calm
        - id: ch01-b72
          speaker: narrator
          text: 安妮让艾伦太太牵着下了楼，也终于得到了安慰。她一边走，一边暗暗庆幸，上天让艾伦太太成为自己的知音，实在太好了。后来再没人提起那只搽剂蛋糕。等客人离开时，安妮回想这场茶会，发现尽管闹出了那样可怕的意外，整晚仍比她原先敢想的愉快得多。可只要一想到那个蛋糕，她还是深深叹了一口气。
        - id: ch01-b73
          speaker: anne
          text: 玛丽拉，一想到明天是新的一天，那一天里还没有犯过任何错误，真让人高兴，是不是？
        - id: ch01-b74
          speaker: marilla
          text: 我敢保证，明天照样少不了你的错误。我从没见过谁像你这样会闯祸。
        - id: ch01-b75
          speaker: anne
          text: 我当然知道。可你有没有发现，我还有一点很叫人振作？同一种错误，我绝不会犯两次。
        - id: ch01-b76
          speaker: marilla
          text: 可你总能闯出新的祸，这一点也没多大用处。
        - id: ch01-b77
          speaker: anne
          text: 你还没明白吗？一个人能犯的错误总有个数目。等我把它们全犯过一遍，就再也没有错误可犯了。这样一想，心里多安慰呀。
        - id: ch01-b78
          speaker: marilla
          text: 你还是把那个蛋糕拿去喂猪吧。那东西根本不是人能吃的，连杰里·布特也不行。
