  chapters:
    - id: ch01
      title: A New Departure in Flavorings
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: "On the last day of June, Anne came into the kitchen with red eyes and a sorrowful face. School was over, and Mr. Phillips was leaving. She set her slate and books on the table and wiped her face with a handkerchief that was already very wet."
        - id: ch01-b02
          speaker: anne_shirley
          text: "Dear me, this world is all meetings and partings, just as Mrs. Lynde says. Wasn't it lucky I took an extra handkerchief to school today, Marilla? I had a feeling I would need it."
          emotion: sad
        - id: ch01-b03
          speaker: marilla_cuthbert
          text: "I never knew you cared so much for Mr. Phillips that you'd need two handkerchiefs because he's leaving."
        - id: ch01-b04
          speaker: anne_shirley
          text: "I don't think I cried because I cared so much for him. I cried because everyone else did. Ruby Gillis started it. She's always said she hated Mr. Phillips, but the minute he stood up to say goodbye, she burst into tears. Then every girl began crying, one after another."
        - id: ch01-b05
          speaker: anne_shirley
          text: "I tried not to, Marilla. I remembered when he made me sit with Gil... with a boy. I remembered how he left the e off my name, called me hopeless at geometry, laughed at my spelling, and said all those sarcastic things. None of it helped. I had to cry too."
        - id: ch01-b06
          speaker: anne_shirley
          text: "Jane Andrews had spent a whole month saying she'd be glad when he left and would never shed a tear. She cried more than any of us. She hadn't expected to need a handkerchief and didn't bring one, so she had to borrow her brother's. The boys didn't cry, of course."
        - id: ch01-b07
          speaker: anne_shirley
          text: "Oh, it was heartbreaking. Mr. Phillips gave such a beautiful speech. He began, 'The time has come for us to part.' Even he had tears in his eyes. I felt terribly sorry for every time I talked in class, drew pictures of him on my slate, or made fun of him and Prissy. I wished I'd been a model student like Minnie Andrews, with nothing on my conscience."
        - id: ch01-b08
          speaker: anne_shirley
          text: "All the girls cried the whole way home. Whenever we started to cheer up, Carrie Sloane would say, 'The time has come for us to part,' and off we'd go again. I really am sad, Marilla. Still, you can't stay in the very depths of despair when two months of vacation are waiting for you, can you?"
        - id: ch01-b09
          speaker: anne_shirley
          text: "Besides, we met the new minister and his wife coming from the station. Even while I felt so awful about Mr. Phillips, I couldn't help being a little interested in a new minister. His wife is very pretty. She isn't exactly majestic-looking, of course. I suppose a minister shouldn't have a truly majestic-looking wife, because it might set a bad example. Mrs. Lynde says the minister's wife in Newbridge sets a very bad example by dressing too fashionably."
        - id: ch01-b10
          speaker: anne_shirley
          text: "Mrs. Allan wore blue muslin with lovely puffed sleeves and roses on her hat. Jane Andrews thought puffed sleeves were too worldly for a minister's wife. I didn't say anything so unkind, because I know how it feels to long for puffed sleeves. And Mrs. Allan hasn't been a minister's wife very long. We should make allowances. She and Mr. Allan will stay with Mrs. Lynde until the manse is ready."
        - id: ch01-b11
          speaker: narrator
          text: "That evening, Marilla went to Mrs. Lynde's. She said she was only returning the quilting frames she'd borrowed the winter before. If she also hoped to hear about the Allans, nearly everyone in Avonlea shared her curiosity. All kinds of things Mrs. Lynde had lent came home that night. Some had been gone so long that she had never expected to see them again. In a quiet country settlement where excitement was rare, a new minister with a wife was a perfectly proper object of interest."
        - id: ch01-b12
          speaker: narrator
          text: "The old minister, Mr. Bentley, had served Avonlea for eighteen years. He'd arrived a widower and stayed one, though the gossips matched him with one woman or another almost every year. He resigned in February and left the village. His people were sorry to lose their good old minister. He wasn't much of a speaker, but after so many years together, they loved him in spite of his faults."
        - id: ch01-b13
          speaker: narrator
          text: "After that, the church heard one visiting preacher after another. Some came as candidates, while others filled in for a Sunday, and each man preached on trial. The older men and women listened closely and decided whether he passed or failed. But a small red-haired girl who sat meekly in the corner of the Cuthbert pew formed opinions of her own. She gave Matthew a full report every time. Marilla refused on principle to criticize ministers in any way."
        - id: ch01-b14
          speaker: anne_shirley
          text: "I don't think Mr. Smith would have worked, Matthew. Mrs. Lynde says he spoke badly, but his greatest problem was the same as Mr. Bentley's. He had no imagination. Mr. Terry had too much imagination. His ran away with him, the way mine did over the Haunted Wood. Mrs. Lynde says his theology wasn't sound either."
        - id: ch01-b15
          speaker: anne_shirley
          text: "Mr. Gresham was a very good and religious man, but he told too many funny stories. He made people laugh in church, and a minister needs some dignity, doesn't he, Matthew? I thought Mr. Marshall was very attractive. But Mrs. Lynde made special inquiries and found out he wasn't married or even engaged. She said a young unmarried minister might marry someone in the congregation and cause trouble. She's wonderfully farsighted, isn't she?"
        - id: ch01-b16
          speaker: anne_shirley
          text: "I'm so glad they chose Mr. Allan. His sermon held my attention, and when he prayed, he sounded as if he meant every word. He didn't sound like a man praying only because he always does it. Mrs. Lynde says he isn't perfect, but we can't expect a perfect minister for seven hundred and fifty dollars a year. She questioned him on every point, so she knows his theology is sound."
        - id: ch01-b17
          speaker: anne_shirley
          text: "She knows Mrs. Allan's family too. They're all respectable, and every woman among them keeps a good house. Mrs. Lynde says a man with sound beliefs and a woman who keeps house well are the ideal minister's family."
        - id: ch01-b18
          speaker: narrator
          text: "Mr. and Mrs. Allan were young, pleasant, and still on their honeymoon. They believed deeply in the work they'd chosen and brought all kinds of good and beautiful hopes to it. Avonlea opened its heart to them at once. Young and old liked the frank, cheerful minister with his high ideals. They also liked the bright, gentle little woman who became mistress of the manse. Anne fell for Mrs. Allan immediately and with her whole heart. Here was another kindred spirit."
        - id: ch01-b19
          speaker: anne_shirley
          text: "Mrs. Allan is absolutely lovely. She's teaching our class, and she's wonderful at it. The first thing she said was that teachers shouldn't ask all the questions. That's exactly what I've always believed. She told us we could ask her anything we wanted, so I asked ever so many questions. I'm very good at questions, Marilla."
          emotion: happy
        - id: ch01-b20
          speaker: marilla_cuthbert
          text: "That I can believe."
        - id: ch01-b21
          speaker: anne_shirley
          text: "No one else asked anything except Ruby Gillis. Ruby wanted to know if we'd have a Sunday school picnic this summer. I didn't think that was a very suitable question because it had nothing to do with our lesson. We were studying Daniel in the lions' den. But Mrs. Allan only smiled and said she thought we would have a picnic. She has the loveliest smile, with such exquisite dimples in her cheeks."
        - id: ch01-b22
          speaker: anne_shirley
          text: "I wish I had dimples, Marilla. I'm not nearly as thin as when I first came here, but I still don't have any. Maybe dimples would help me influence people for good. Mrs. Allan says we should always try to do that. She made everything sound so pleasant. I never knew religion could be cheerful. I always thought it was rather gloomy. I'd like to be a Christian if I could be one like Mrs. Allan. I wouldn't want to be one like Superintendent Bell."
        - id: ch01-b23
          speaker: marilla_cuthbert
          text: "You shouldn't talk that way about Mr. Bell. He's a truly good man."
          emotion: angry
        - id: ch01-b24
          speaker: anne_shirley
          text: "Oh, I know he's good. He just doesn't seem to find any joy in it. If I could be good, I'd dance and sing all day because I was so glad. Mrs. Allan is probably too old to dance and sing, and it wouldn't be dignified for a minister's wife anyway. But I can feel that she's happy to be a Christian. She'd choose to be one even if she could get to heaven without it."
        - id: ch01-b25
          speaker: marilla_cuthbert
          text: "We ought to invite Mr. and Mrs. Allan to tea soon. They've visited almost everyone but us. Next Wednesday would do. Don't tell Matthew, though. If he hears they're coming, he'll find a reason to be gone. He got used to Mr. Bentley, but meeting a new minister will be hard for him. A new minister's wife will frighten him half to death."
        - id: ch01-b26
          speaker: anne_shirley
          text: "I'll keep the secret as closely as the dead. Oh, Marilla, may I bake a cake for them? I'd love to do something for Mrs. Allan, and I can make a fairly good cake now."
        - id: ch01-b27
          speaker: marilla_cuthbert
          text: "You may make a layer cake."
        - id: ch01-b28
          speaker: narrator
          text: "Green Gables was busy all Monday and Tuesday. Having the minister and his wife to tea was serious and important work, and Marilla was determined that no housekeeper in Avonlea would outdo her. Anne was wild with excitement and delight. On Tuesday evening, she told Diana every detail. The girls sat in the twilight on the big red stones beside the Dryad's Bubble. They dipped little twigs in fir balsam, touched them to the spring, and made rainbows on the water."
        - id: ch01-b29
          speaker: anne_shirley
          text: "Everything is ready, Diana, except the cake I'll bake tomorrow morning and the baking powder biscuits Marilla will make right before tea. We've had two very busy days. Inviting a minister's family is such a responsibility, and I've never done anything like it. You should see the pantry. It's magnificent."
        - id: ch01-b30
          speaker: anne_shirley
          text: "We'll have jellied chicken and cold tongue, red jelly and yellow jelly, whipped cream, lemon pie, cherry pie, three kinds of cookies, fruit cake, pound cake, layer cake, and the baking powder biscuits I mentioned. There will be new bread and old bread too, in case the minister has trouble digesting new bread. And Marilla is opening her famous yellow plum preserves. She keeps those especially for ministers."
        - id: ch01-b31
          speaker: anne_shirley
          text: "Mrs. Lynde says ministers have weak digestion, though I don't think Mr. Allan has been a minister long enough for it to affect him. But when I think of my layer cake, I turn cold. What if it isn't good? Last night I dreamed a dreadful goblin chased me everywhere, and it had a huge layer cake for a head."
          emotion: fearful
        - id: ch01-b32
          speaker: diana_barry
          text: "It'll turn out well. Remember the piece you brought to Idlewild two weeks ago? It was perfectly delicious."
        - id: ch01-b33
          speaker: anne_shirley
          text: "Yes, but cakes seem to go wrong at the very moment you most need them to be right. I'll have to trust Providence and make sure I put in the flour. Oh, Diana, look at that beautiful rainbow! Do you think the dryad will come out when we leave and wear it as a scarf?"
        - id: ch01-b34
          speaker: diana_barry
          text: "You know dryads aren't real."
        - id: ch01-b35
          speaker: narrator
          text: "Diana's mother had found out about the Haunted Wood and had been very angry. Since then, Diana had stayed away from any more flights of imagination like Anne's. She didn't think it was wise to encourage herself to believe even in harmless dryads."
        - id: ch01-b36
          speaker: anne_shirley
          text: "But imagining her is so easy. Every night before bed, I look from my window and wonder if she's sitting here, using the spring as a mirror while she combs her hair. In the morning, I sometimes search the dew for her footprints. Oh, Diana, please don't stop believing in the dryad!"
        - id: ch01-b37
          speaker: narrator
          text: "Anne was up at sunrise on Wednesday because she was too excited to sleep. Dipping twigs and playing in the spring the evening before had given her a terrible head cold. Still, nothing short of pneumonia could have cooled her interest in cooking that morning. After breakfast, she carefully mixed her cake. At last she put the pan inside the oven, shut the door, and let out a long breath."
        - id: ch01-b38
          speaker: anne_shirley
          text: "I'm certain I remembered everything this time, Marilla. But do you think it will rise? What if the baking powder is bad? I used some from the new can. Mrs. Lynde says you can't trust baking powder these days because everything gets mixed with cheap ingredients. She thinks the government should do something about it, but says we'll never see a Tory government take action. Marilla, what if my cake stays flat?"
        - id: ch01-b39
          speaker: marilla_cuthbert
          text: "We'll have more than enough food without it."
        - id: ch01-b40
          speaker: narrator
          text: "The cake did rise. It came from the oven as light and airy as golden foam. Anne flushed with delight. She put the layers together with ruby-colored jelly and admired the result. In her imagination, Mrs. Allan was already eating a slice. Perhaps she would like it so much that she would ask for a second piece."
        - id: ch01-b41
          speaker: anne_shirley
          text: "You'll use the best tea set, won't you, Marilla? May I decorate the table with ferns and wild roses?"
        - id: ch01-b42
          speaker: marilla_cuthbert
          text: "That's all foolishness. The food is what matters, not fancy decorations."
        - id: ch01-b43
          speaker: anne_shirley
          text: "Mrs. Barry decorated her table, and the minister gave her a lovely compliment. He said it pleased the eyes as much as the taste."
        - id: ch01-b44
          speaker: narrator
          text: "Anne knew exactly which argument to use."
        - id: ch01-b45
          speaker: marilla_cuthbert
          text: "Oh, do what you like. Just leave enough room for the dishes and food."
        - id: ch01-b46
          speaker: narrator
          text: "Marilla had no intention of being outdone by Mrs. Barry or anyone else. Anne gave the decorations everything she had. There were plenty of roses and ferns, and she had an artistic eye for arranging them. She made the tea table so beautiful that when the minister and his wife sat down, they both exclaimed over it together."
        - id: ch01-b47
          speakers: [mr_allan, mrs_allan]
          ensemble: duo
          text: "How lovely!"
        - id: ch01-b48
          speaker: marilla_cuthbert
          text: "Anne arranged it."
        - id: ch01-b49
          speaker: narrator
          text: "Marilla gave Anne credit for the decorations, even if she did it rather grimly. Mrs. Allan turned an approving smile on Anne. To Anne, that smile felt like almost more happiness than anyone in this world could bear."
        - id: ch01-b50
          speaker: narrator
          text: "Matthew was at the table too. Only Anne and goodness knew how she'd coaxed him into joining the party. He had been so shy and nervous that Marilla had given him up in despair. Anne had taken charge and somehow succeeded. Now he sat there in his best clothes and a white collar. He even managed a respectable and fairly interesting conversation with the minister. He never said one word to Mrs. Allan, but perhaps that was too much to expect."
        - id: ch01-b51
          speaker: narrator
          text: "Everything went merrily, as smoothly as a wedding bell, until Anne's layer cake was passed around. Mrs. Allan had already been served a bewildering variety of food, so she declined it. Marilla saw the disappointment on Anne's face and spoke with a smile."
        - id: ch01-b52
          speaker: marilla_cuthbert
          text: "Oh, you must try this cake, Mrs. Allan. Anne baked it especially for you."
        - id: ch01-b53
          speaker: mrs_allan
          text: "Then I certainly must taste it."
        - id: ch01-b54
          speaker: narrator
          text: "Mrs. Allan laughed and helped herself to a plump triangular slice. Mr. Allan and Marilla took pieces too. Mrs. Allan put one bite in her mouth, and a very strange look crossed her face. She didn't say a word. Instead, she steadily went on eating it. Marilla caught that peculiar expression and quickly tasted her own cake."
        - id: ch01-b55
          speaker: marilla_cuthbert
          text: "Anne Shirley! What in the world did you put in this cake?"
          emotion: surprised
        - id: ch01-b56
          speaker: anne_shirley
          text: "Only what the recipe told me to use, Marilla. Oh, is something wrong with it?"
          emotion: fearful
        - id: ch01-b57
          speaker: marilla_cuthbert
          text: "Wrong? It's horrible. Mr. Allan, please don't eat it. Anne, taste it yourself. What did you use for flavoring?"
        - id: ch01-b58
          speaker: narrator
          text: "Anne tasted the cake. Her face turned scarlet with shame."
        - id: ch01-b59
          speaker: anne_shirley
          text: "Vanilla. I only used vanilla. Oh, Marilla, the baking powder must be bad. I was worried about that baking powder when I..."
        - id: ch01-b60
          speaker: marilla_cuthbert
          text: "Nonsense about the baking powder! Bring me the vanilla bottle you used."
        - id: ch01-b61
          speaker: narrator
          text: "Anne rushed to the pantry and came back with a small bottle. It was partly full of brown liquid, and its faded yellow label said, 'Best Vanilla.' Marilla took the bottle from her, pulled out the cork, and smelled what was inside."
        - id: ch01-b62
          speaker: marilla_cuthbert
          text: "Mercy on us, Anne! You flavored the cake with anodyne liniment. I broke the liniment bottle last week and poured what was left into an empty vanilla bottle. I should have warned you, so this is partly my fault. But why in the world didn't you smell it first?"
          emotion: surprised
        - id: ch01-b63
          speaker: narrator
          text: "The ruined cake was bad enough. Learning that she'd filled it with liniment was a second disgrace, and it was too much for Anne. She dissolved into tears right there."
        - id: ch01-b64
          speaker: anne_shirley
          text: "I couldn't smell it. My cold was too bad!"
          emotion: sad
        - id: ch01-b65
          speaker: narrator
          text: "Anne couldn't bear the double disgrace. She fled from the room and ran all the way to her gable chamber. There she threw herself onto the bed and cried like someone who refused to be comforted. After a while, a light step sounded on the stairs. Someone came into the room, but Anne kept her face down and didn't look up."
        - id: ch01-b66
          speaker: anne_shirley
          text: "Oh, Marilla, I'm disgraced forever. I'll never live this down. Everyone in Avonlea will hear about it. Things like this always spread. Diana will ask how my cake turned out, and I'll have to tell her the truth. People will always point me out as the girl who put anodyne liniment in a cake. Gil... all the boys at school will laugh about it forever."
          emotion: sad
        - id: ch01-b67
          speaker: anne_shirley
          text: "Oh, Marilla, if you have any Christian pity, please don't make me go downstairs to wash the dishes. I'll wash them after the minister and his wife leave, but I can never face Mrs. Allan again. She might think I meant to poison her. Mrs. Lynde knows an orphan girl who tried to poison the person who took her in."
          emotion: sad
        - id: ch01-b68
          speaker: anne_shirley
          text: "The liniment isn't poisonous, though. You're supposed to take it inside your body, just not in cake. Please tell Mrs. Allan that, Marilla."
          emotion: sad
        - id: ch01-b69
          speaker: mrs_allan
          text: "Why don't you get up and tell her yourself?"
        - id: ch01-b70
          speaker: narrator
          text: "The merry voice made Anne fly upright. It wasn't Marilla at all. Mrs. Allan stood beside the bed and watched her with laughing eyes. But Anne's tragic face truly troubled her, and the laughter gave way to real concern."
        - id: ch01-b71
          speaker: mrs_allan
          text: "My dear little girl, please don't cry this way. It was only a funny mistake, and anyone could have made it."
          emotion: calm
        - id: ch01-b72
          speaker: anne_shirley
          text: "No, it takes me to make a mistake like that. And I wanted the cake to be so nice for you, Mrs. Allan."
          emotion: sad
        - id: ch01-b73
          speaker: mrs_allan
          text: "I know you did, dear. Your kindness and thoughtfulness mean just as much to me as they would if the cake had been perfect. Now dry your tears and come downstairs with me. Show me your flower garden. Miss Cuthbert says you have a little garden plot of your own, and I would love to see it. Flowers interest me very much."
          emotion: calm
        - id: ch01-b74
          speaker: narrator
          text: "Anne allowed Mrs. Allan to lead her downstairs, and she let herself be comforted. As she went, Anne thought it was truly providential that Mrs. Allan was a kindred spirit. No one said another word about the liniment cake. By the time the guests went home, Anne had enjoyed the evening far more than anyone could have expected after such a dreadful accident. Even so, once they were gone, she gave a deep sigh."
        - id: ch01-b75
          speaker: anne_shirley
          text: "Marilla, isn't it lovely to remember that tomorrow is a new day, with no mistakes in it yet?"
        - id: ch01-b76
          speaker: marilla_cuthbert
          text: "You can be sure you'll make plenty before it's over. I've never known anyone who could match you for mistakes, Anne."
        - id: ch01-b77
          speaker: anne_shirley
          text: "Yes, I know that very well. But haven't you noticed one hopeful thing about me? I never make the same mistake twice."
        - id: ch01-b78
          speaker: marilla_cuthbert
          text: "That doesn't help much when you keep finding new ones."
        - id: ch01-b79
          speaker: anne_shirley
          text: "But don't you see? One person can only make so many different mistakes. Once I've made all of them, I'll finally be finished. That's a very comforting thought."
        - id: ch01-b80
          speaker: marilla_cuthbert
          text: "You'd better take that cake out to the pigs. No person should eat it, not even Jerry Boute."
