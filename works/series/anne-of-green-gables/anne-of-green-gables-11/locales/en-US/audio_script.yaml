  chapters:
    - id: ch01
      title: Anne's Impressions of Sunday-school
      blocks:
        - id: ch01-b01
          speaker: marilla_cuthbert
          text: Well, what do you think of them?
        - id: ch01-b02
          speaker: narrator
          text: >-
            Anne stood in the east gable, looking solemnly at three new dresses spread across the bed. One was snuff-brown gingham. A peddler had offered it the summer before, and Marilla bought it because it seemed so sturdy. Another was black-and-white checked sateen that she found at a bargain counter that winter. The third was a stiff print in an ugly shade of blue, bought that very week in Carmody.
        - id: ch01-b03
          speaker: narrator
          text: >-
            Marilla had sewn them all herself, and all three looked exactly alike. Each had a plain skirt gathered tightly to a plain waist, with sleeves just as plain and as tight as sleeves could be.
        - id: ch01-b04
          speaker: anne_shirley
          text: I'll imagine that I like them.
        - id: ch01-b05
          speaker: marilla_cuthbert
          text: >-
            I don't want you imagining anything. I can see perfectly well that you don't like them. What's wrong with them? They're neat and clean and new, aren't they?
          emotion: angry
        - id: ch01-b06
          speaker: anne_shirley
          text: Yes.
        - id: ch01-b07
          speaker: marilla_cuthbert
          text: Then why don't you like them?
        - id: ch01-b08
          speaker: anne_shirley
          text: They're... they're not pretty.
        - id: ch01-b09
          speaker: marilla_cuthbert
          text: >-
            Pretty! I never meant to make you pretty dresses. I don't believe in pampering vanity, Anne, and you may as well learn that now. These are good, sensible, useful dresses, without frills or fancy trimmings, and they're all you're getting this summer. The brown gingham and blue print are for school, once you start going. The sateen is for church and Sunday school. I expect you to keep every one of them clean and neat, and you had better not tear them. After those skimpy old dresses you've been wearing, you ought to be grateful for almost anything.
        - id: ch01-b10
          speaker: anne_shirley
          text: >-
            Oh, I am grateful. But I'd be so much more grateful if just one dress had puffed sleeves. They're fashionable now. Marilla, wearing puffed sleeves would give me such a thrill.
        - id: ch01-b11
          speaker: marilla_cuthbert
          text: >-
            Then you'll have to go without the thrill. I had no cloth to waste on puffed sleeves, and they look ridiculous anyway. Plain, sensible sleeves are much better.
        - id: ch01-b12
          speaker: anne_shirley
          text: >-
            But I'd rather look ridiculous along with everyone else than look plain and sensible all by myself.
          emotion: sad
        - id: ch01-b13
          speaker: marilla_cuthbert
          text: >-
            Of course you would. Now hang those dresses carefully in the closet. Then sit down and learn your Sunday-school lesson. Mr. Bell gave me a quarterly for you, and you're going tomorrow.
        - id: ch01-b14
          speaker: narrator
          text: Marilla disappeared downstairs in a temper. Left alone, Anne clasped her hands and gazed sadly at the dresses.
        - id: ch01-b15
          speaker: anne_shirley
          text: >-
            I hoped there might be a white dress with puffed sleeves. I prayed for one, though I didn't really expect that to work. God probably doesn't have time to worry about one little orphan girl's dress, so I knew I had to depend on Marilla. At least I can pretend one is snow-white muslin, trimmed with beautiful lace and three puffs on each sleeve.
          emotion: sad
        - id: ch01-b16
          speaker: narrator
          text: >-
            The next morning, Marilla felt a sick headache coming on and could not go to Sunday school with Anne.
        - id: ch01-b17
          speaker: marilla_cuthbert
          text: >-
            Stop at Mrs. Lynde's and go with her. She'll put you in the proper class. Behave yourself, and stay for the church service afterward. Ask Mrs. Lynde to show you our pew. Here's a cent for the collection. No staring and no fidgeting. When you get home, I expect you to tell me the text.
        - id: ch01-b18
          speaker: narrator
          text: >-
            Anne set off looking perfectly respectable in the stiff black-and-white sateen. The dress was a decent length, and no one could have called it skimpy. Somehow, though, it made every sharp corner and angle of her thin body stand out. Her new sailor hat was small, flat, shiny, and painfully plain. That was another disappointment. Anne had secretly allowed herself to dream of ribbons and flowers.
        - id: ch01-b19
          speaker: narrator
          text: >-
            Halfway down the lane, nature supplied the missing decorations. Anne came upon a golden frenzy of buttercups tossing in the wind and a glorious spread of wild roses. She promptly gathered both by the handful and wound a heavy pink-and-yellow wreath around her hat. Whatever anyone else might think of the result, Anne was satisfied. She walked brightly down the road, carrying her flower-crowned red head very proudly.
        - id: ch01-b20
          speaker: narrator
          text: >-
            Mrs. Lynde had already left when Anne reached her house. Anne was not discouraged. She continued to church alone and found a crowd of little girls in the porch. They wore cheerful whites, blues, and pinks, and every one of them stared curiously at the stranger with the extraordinary flowers on her head.
        - id: ch01-b21
          speaker: narrator
          text: >-
            The Avonlea girls had heard odd stories about Anne. Mrs. Lynde said she had a dreadful temper. Jerry Buote, the hired boy at Green Gables, said she was always talking to herself, or to trees and flowers, as if she were crazy. The girls watched her and whispered behind their quarterlies. Not one of them came over to be friendly, either then or after the opening exercises, when Anne joined Miss Rogerson's class.
        - id: ch01-b22
          speaker: narrator
          text: >-
            Miss Rogerson was a middle-aged woman who had taught a Sunday-school class for twenty years. Her teaching method never varied. She read a printed question from the quarterly, then peered sternly over its edge at the particular girl she thought should answer. Her gaze settled on Anne very often. Thanks to Marilla's drilling, Anne replied promptly each time, though it was doubtful that she understood much about either the question or its answer.
        - id: ch01-b23
          speaker: narrator
          text: >-
            Anne decided she did not like Miss Rogerson. She felt miserable. Every other girl in the class had puffed sleeves, and without puffed sleeves, life hardly seemed worth living.
        - id: ch01-b24
          speaker: marilla_cuthbert
          text: Well, how did you like Sunday school?
        - id: ch01-b25
          speaker: narrator
          text: >-
            By the time Anne came home, the pink-and-yellow wreath had wilted. She had taken it off and thrown it away in the lane, so Marilla was spared any knowledge of Anne's remarkable church hat for the time being.
        - id: ch01-b26
          speaker: anne_shirley
          text: I didn't like it at all. It was horrid.
        - id: ch01-b27
          speaker: marilla_cuthbert
          text: Anne Shirley!
        - id: ch01-b28
          speaker: narrator
          text: >-
            Anne sank into the rocking chair with a long sigh. She kissed a leaf on Bonny, then waved to a fuchsia in bloom.
        - id: ch01-b29
          speaker: anne_shirley
          text: >-
            They might have been lonely while I was gone. Now, about Sunday school. I behaved exactly as you told me. Mrs. Lynde wasn't home, but I went right on by myself. I entered the church with all the other little girls. During the opening exercises, I sat tucked into the corner of a pew beside the window.
        - id: ch01-b30
          speaker: anne_shirley
          text: >-
            Mr. Bell's prayer went on and on. I would have been terribly tired before he finished, except the window looked over the Lake of Shining Waters. I watched it and imagined wonderful things instead.
        - id: ch01-b31
          speaker: marilla_cuthbert
          text: >-
            You had no business doing that. You should have listened to Mr. Bell.
        - id: ch01-b32
          speaker: anne_shirley
          text: >-
            But he wasn't speaking to me. He was speaking to God, and he didn't sound very interested in what he was saying. Maybe he thought God was too far away. There was a long line of white birches leaning over the lake. Sunlight came through them and reached far, far down into the water. Oh, Marilla, it was like a beautiful dream! It gave me such a thrill that I whispered, "Thank you for it, God," two or three times.
        - id: ch01-b33
          speaker: marilla_cuthbert
          text: You didn't say it out loud, did you?
        - id: ch01-b34
          speaker: anne_shirley
          text: >-
            Oh, no. I said it under my breath. At last Mr. Bell finished, and they sent me to the classroom with Miss Rogerson. There were nine other girls, and every one of them had puffed sleeves. I tried to pretend mine were puffed too, but I couldn't. Why was it so easy in the east gable, when I was alone, and so hard beside girls with real puffs?
        - id: ch01-b35
          speaker: marilla_cuthbert
          text: >-
            You shouldn't have been thinking about sleeves in Sunday school. You should have paid attention to the lesson. I hope you knew it.
        - id: ch01-b36
          speaker: anne_shirley
          text: >-
            Oh, yes. I answered plenty of questions. Miss Rogerson asked so many, though. It hardly seemed fair that she got to ask all of them. I wanted to ask her several things, but I didn't think she was a kindred spirit, so I kept quiet.
        - id: ch01-b37
          speaker: anne_shirley
          text: >-
            Then all the other girls recited a paraphrase. Miss Rogerson asked whether I knew one too. I had to tell her I didn't, but I offered to recite "The Dog at His Master's Grave" if she wanted. It's in the Third Royal Reader. It isn't truly a religious poem, but it's so sad and melancholy that it might as well be. Miss Rogerson said that wouldn't do at all. She told me to learn the nineteenth paraphrase for next Sunday instead.
        - id: ch01-b38
          speaker: anne_shirley
          text: >-
            I read it during church, and it's splendid. Two lines especially give me a thrill. "Quick as the slaughtered squadrons fell, in Midian's evil day." I don't know what "squadrons" or "Midian" means, but it sounds so tragic. I can hardly wait to recite it next Sunday. I'll practice all week.
          emotion: happy
        - id: ch01-b39
          speaker: anne_shirley
          text: >-
            After Sunday school, Mrs. Lynde was too far away, so I asked Miss Rogerson to show me your pew. I sat as still as I could. The text was Revelation, chapter three, verses two and three. It was very long. If I were a minister, I'd choose short, snappy texts.
        - id: ch01-b40
          speaker: anne_shirley
          text: >-
            The sermon was terribly long too. I suppose the minister had to make it match such a long text. He wasn't the least bit interesting. I think his real trouble is that he doesn't have enough imagination. So I didn't listen to very much of the sermon. I simply let my thoughts go wherever they wanted, and I thought of the most surprising things.
        - id: ch01-b41
          speaker: narrator
          text: >-
            Marilla felt helpless. She knew all of this ought to be sternly corrected, yet she could hardly manage it. Some of Anne's remarks were the very thoughts Marilla had kept buried for years, especially her thoughts about the minister's sermons and Mr. Bell's prayers. She had never once given those opinions a voice. Now every secret, unspoken criticism seemed to have taken on a visible, accusing shape. It stood before her in the person of this outspoken little piece of neglected humanity.
