audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖从容，带着细腻而机智的讲述感
        timbre: 清澈柔和
        pace: 舒缓而有变化
        pitch: 中音
    anne:
      display_name: 安妮
      tts:
        delivery: 热切灵动，想法接连涌出，真挚而富于想象
        timbre: 清亮稚嫩
        pace: 明快，动情处自然放慢
        pitch: 中高音
    marilla:
      display_name: 玛丽拉
      tts:
        delivery: 干脆严谨，言语直截了当，偶尔透出克制的温情
        timbre: 清晰沉稳
        pace: 中等
        pitch: 中音
  chapters:
    - id: ch01
      title: 第十一章　安妮对主日学校的印象
      blocks:
        - id: ch01-b01
          speaker: marilla
          text: 好了，你觉得这些衣服怎么样？
        - id: ch01-b02
          speaker: narrator
          text: 安妮站在东山墙房间里，神情严肃地看着床上的三条新裙子。一条是鼻烟色方格棉布做的。去年夏天，一个小贩上门兜售，玛丽拉见那块布很耐穿，一时动心便买了下来。黑白格子的棉缎，是她冬天从廉价柜台淘来的。还有一块布，是这星期在卡莫迪一家商店买的，又硬又挺，蓝得很难看。裙子全是玛丽拉亲手缝的，式样也完全相同。朴素的裙身紧紧打着褶，接在朴素的上衣上。袖子跟衣身一样朴素，而且窄得不能再窄。
        - id: ch01-b03
          speaker: anne
          text: 我会想象自己喜欢它们的。
        - id: ch01-b04
          speaker: marilla
          text: 我可不要你想象。哦，我看出来了，你根本不喜欢！这些裙子哪里不好？不整洁吗？不干净吗？不是新的吗？
        - id: ch01-b05
          speaker: anne
          text: 都是。可是，它们不漂亮。
        - id: ch01-b06
          speaker: marilla
          text: 漂亮！我可没打算给你置办漂亮裙子。我不赞成娇惯人的虚荣心。这些衣服结实、合宜、耐穿，也没有乱七八糟的花边。今年夏天，你就只有这三条。棕色方格裙和蓝印花裙留着上学，棉缎裙穿去教堂和主日学校。你得保持整洁，别把它们扯破。想想你从前那几件又窄又薄的毛料衣裳，如今得到什么都该感激。
        - id: ch01-b07
          speaker: anne
          text: 我真的很感激。可是，您要是肯把其中一条做成泡泡袖，我会感激得更多。现在最时兴的就是泡泡袖呀。玛丽拉，只要穿一次那样的裙子，我的心都会激动得发颤。
        - id: ch01-b08
          speaker: marilla
          text: 那你只好不发颤了。我没有布料可以浪费在泡泡袖上。那种袖子看着可笑，我还是喜欢朴素又合宜的。
        - id: ch01-b09
          speaker: anne
          text: 可要是大家都显得可笑，我宁愿跟大家一起可笑，也不愿只有我一个人朴素又合宜。
          emotion: sad
        - id: ch01-b10
          speaker: marilla
          text: 果然是你会说的话！把裙子仔细挂进衣橱，再坐下来学主日学校的功课。我从贝尔先生那里给你拿了季刊，明天你就去主日学校。
        - id: ch01-b11
          speaker: narrator
          text: 玛丽拉气冲冲地下楼去了。安妮双手紧握，望着那三条裙子。
        - id: ch01-b12
          speaker: anne
          text: 我一直盼着里面会有一条白色的泡泡袖裙子。我还为它祷告过，可正因为祷告过，我本来也没抱太大希望。上帝大概没工夫操心一个孤儿小姑娘的裙子，这件事只能指望玛丽拉。好在我还能想象，其中一条是雪白的细棉布裙，镶着漂亮的蕾丝边，袖子上鼓着三层泡泡。
          emotion: sad
        - id: ch01-b13
          speaker: narrator
          text: 第二天早晨，偏头痛发作前的种种征兆出现了，玛丽拉只得留在家里，不能陪安妮去主日学校。
        - id: ch01-b14
          speaker: marilla
          text: 你先去找林德太太，她会领你进该去的班。记住，举止要规矩。散了以后留下来听讲道，再请她指给你看咱们家的座位。这一分钱拿去捐献。别盯着人看，也别乱动。回家以后，把经文告诉我。
        - id: ch01-b15
          speaker: narrator
          text: 安妮出门时，从头到脚都无可挑剔，身上穿着硬挺的黑白格棉缎裙。裙子的长度很得体，也绝不能说窄小，却偏偏把她瘦削身材上的每一处棱角都衬了出来。那顶簇新的小水手帽又扁又亮，朴素到了极点，也让她失望透顶。她本来偷偷盼着帽子上能有丝带和鲜花。还没走到大路，鲜花就有了。走到小路一半，风吹得金黄的毛茛翻腾起舞，野蔷薇也开得绚丽无比。安妮一见，立刻毫不吝惜地摘来许多花，给帽子编上一圈沉甸甸的花环。不管别人怎么看，她自己十分满意。她顶着那颗缀满粉红与金黄花朵的红脑袋，骄傲地昂着头，轻快地沿路走去。
        - id: ch01-b16
          speaker: narrator
          text: 到了林德太太家，她才发现人已经走了。安妮并没泄气，独自继续向教堂走。门廊里站着一群小姑娘，身上的白衣、蓝衣和粉衣，都多少带着些鲜艳装饰。她们好奇地盯着这个突然出现的陌生女孩，也盯着她头上那件异乎寻常的装饰。阿冯利的姑娘们早就听过安妮的怪事。林德太太说她脾气坏得吓人。绿山墙的雇工杰里·布奥特则说，她总是一个人说个不停，不是自言自语，就是像个疯姑娘一样跟花草树木说话。女孩们望着她，躲在季刊后面窃窃私语。开场仪式结束以后，安妮进了罗杰森小姐的班。可从门廊到教室，始终没有一个人主动来亲近她。
        - id: ch01-b17
          speaker: narrator
          text: 罗杰森小姐是位中年女士，已经教了二十年主日学校。她的教法很简单，就是照着季刊念出印好的问题，再从书页上方严厉地望向某个女孩，表示这个问题该由她回答。她常常望向安妮。多亏玛丽拉事先反复操练，安妮每次都答得很快。至于那些问题和答案，她到底懂了多少，那就很难说了。
        - id: ch01-b18
          speaker: narrator
          text: 安妮觉得自己大概不会喜欢罗杰森小姐，心里难受极了。更糟的是，班上每一个小姑娘都穿着泡泡袖，偏偏只有她一个人没有。安妮甚至觉得，没有泡泡袖，人生简直不值得一过。
        - id: ch01-b19
          speaker: marilla
          text: 嗯，主日学校怎么样？
        - id: ch01-b20
          speaker: narrator
          text: 安妮回到绿山墙以前，帽子上的花环已经枯了。她在小路上把它扔掉，倒让玛丽拉暂时免于知道那回事。
        - id: ch01-b21
          speaker: anne
          text: 我一点儿也不喜欢。糟透了。
        - id: ch01-b22
          speaker: marilla
          text: 安妮·雪莉！
        - id: ch01-b23
          speaker: narrator
          text: 安妮长长叹了口气，在摇椅上坐下。她先亲了亲邦妮的一片叶子，又郑重地向那株盛开的倒挂金钟挥了挥手。
        - id: ch01-b24
          speaker: anne
          text: 我不在的时候，它们也许会寂寞。现在说主日学校吧。我照您的话做了，规矩得很。林德太太已经走了，我就自己去教堂。开场仪式的时候，我跟许多女孩坐在一起，正好坐在长椅靠窗的角落。贝尔先生的祷告长得吓人。要不是有那扇窗，我准会在他祷告完以前累坏。窗外就是闪光之湖，我望着湖，想了好多美妙的事。
        - id: ch01-b25
          speaker: marilla
          text: 你不该胡思乱想，应该听贝尔先生祷告。
        - id: ch01-b26
          speaker: anne
          text: 可他又不是在跟我说话。他是在跟上帝说话，而且听起来，连他自己都没多大兴致。我想，他大概觉得上帝离得太远了。湖边垂着长长一排白桦树，阳光从枝叶间一直落下去，落呀，落呀，落进很深很深的水里。哦，玛丽拉，那简直像一场美丽的梦！我的心都为之一颤，只好轻声说了两三遍：“上帝，谢谢您让我看见这一切。”
        - id: ch01-b27
          speaker: marilla
          text: 但愿你没大声说出来。
        - id: ch01-b28
          speaker: anne
          text: 没有，我只是悄悄说的。后来贝尔先生总算祷告完了，有人叫我跟罗杰森小姐的班一起进教室。班上还有九个女孩，她们全穿着泡泡袖。我拼命想象自己的袖子也是鼓起来的，可就是不行。为什么呢？我独自在东山墙房间里时，明明一下就能想出来。可到了那里，身边的人穿着货真价实的泡泡袖，想象就难极了。
        - id: ch01-b29
          speaker: marilla
          text: 在主日学校里，你不该惦记袖子，应该专心听课。但愿你会背功课。
        - id: ch01-b30
          speaker: anne
          text: 当然会，我还答了好多问题。罗杰森小姐问得可多了。全由她来问，我觉得一点儿也不公平。我也有好多问题想问她，可我没敢问，因为我觉得她不像我的知音。后来，别的女孩都背了一首《诗篇》改写诗。她问我会不会，我说不会。不过，她要是愿意，我可以背《主人墓前的狗》。那首诗收在《皇家第三读本》里，虽不算真正的宗教诗，却那么忧伤，那么凄凉，也差不多够资格了。可她说那不行，还叫我下星期日背第十九首改写诗。后来我在教堂里把它读了一遍，它好极了，尤其有两行，真叫我心里发颤。
        - id: ch01-b31
          speaker: anne
          text: 杀戮之师何其速，米甸恶日尽倾覆。
        - id: ch01-b32
          speaker: anne
          text: 我不知道“师”是什么意思，也不知道“米甸”是什么，可听起来悲壮极了。我都等不及下星期日去背它了，这一星期我要天天练。主日学校散了以后，林德太太坐得太远，我便请罗杰森小姐指给我看咱们家的座位。我一直坐得尽可能安静。经文是《启示录》第三章第二、第三节，长得很。假如我是牧师，就会挑些短小有力的。讲道也长得吓人，大概是为了配上那么长的经文。我觉得牧师一点儿也没意思。他的问题就是想象力不够。我没怎么听，只让思绪到处跑，结果想出了好多最最惊人的事。
        - id: ch01-b33
          speaker: narrator
          text: 玛丽拉无可奈何地觉得，这一大篇话实在该受到严厉责备。偏偏安妮说的有些事，特别是贝尔先生的祷告和牧师的讲道，正是她自己多年来藏在心底、从没说出口的真实想法。有这个无法否认的事实拦着，这叫她怎么训斥呢？那些隐秘的、难以启齿的挑剔念头，仿佛忽然在眼前这个直言不讳、从小没人照料的小不点儿身上有了形状，正站在那里反过来责问她。
