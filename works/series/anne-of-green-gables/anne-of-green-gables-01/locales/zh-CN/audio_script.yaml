audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖从容，带着细腻而机智的讲述感
        timbre: 清澈柔和
        pace: 舒缓而有变化
        pitch: 中音
    rachel:
      display_name: 雷切尔太太
      tts:
        delivery: 精明爽直，语气笃定，关切中总带着评判
        timbre: 响亮清晰
        pace: 中等偏快
        pitch: 中高音
    marilla:
      display_name: 玛丽拉
      tts:
        delivery: 干脆克制，务实严谨，偶尔透出不动声色的幽默
        timbre: 清冷结实
        pace: 中等
        pitch: 中低音
  chapters:
    - id: ch01
      title: 第一章　雷切尔·林德太太大吃一惊
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 雷切尔·林德太太的家，正好坐落在埃文利大路沉进一片小洼地的地方。洼地四周长满桤木和倒挂金钟，一条小溪从中穿过。溪水来自很远的老卡思伯特家林地深处。听说它流过树林时，一路拐来绕去，冲得又急又响，幽暗的水潭和飞瀑里藏着数不清的秘密。可一到林德洼地，它便安静下来，规规矩矩地往前流。说来也难怪，就算是一条溪，经过雷切尔太太门前，恐怕也不敢失了体面。它大概知道，她正坐在窗边，用那双锐利的眼睛盯着路上的一切。无论是人、小溪，还是孩子，只要哪里有一点古怪，她非把来龙去脉弄清楚不可。
        - id: ch01-b02
          speaker: narrator
          text: 埃文利有些人只顾打听邻居，连自己的日子都耽误了。雷切尔太太可不一样。她精明能干，自家的事样样妥帖，别人的事也一件没落下。她是出了名的好主妇，手脚又快，活儿又漂亮。缝纫会要她主持，主日学校靠她帮忙，教会的妇女救济会和海外传教后援会也少不了她。忙成这样，她仍能在厨房窗前一坐几个钟头，一边织那种棉经线床罩，一边看着洼地里那条大路。她已经织了十六条，村里的主妇每次说起这个数目，神情都不由得郑重起来。
        - id: ch01-b03
          speaker: narrator
          text: 那条路穿过洼地，再弯弯曲曲地爬上远处的红土陡坡。埃文利在一片伸进圣劳伦斯湾的三角形小半岛上，两边都是水。谁想进村或出村，都得走这条山路，自然也就逃不过雷切尔太太那双什么都看得见的眼睛。
        - id: ch01-b04
          speaker: narrator
          text: 六月初的一天下午，她照旧坐在窗前。暖暖的阳光照进屋里。斜坡下的果园开满粉白的花，像披了一身新娘的霞衣，蜜蜂在花间嗡嗡飞着。她的丈夫托马斯是个温顺瘦小的男人，村里人提起他，总说是“雷切尔·林德的丈夫”。这时，他正在谷仓那边的田里播晚熟芜菁籽。马修·卡思伯特也该在绿山墙远处那块红色大田里做同样的事。雷切尔太太对此清楚得很。前一天傍晚，她亲耳听见马修在卡莫迪的威廉·J.布莱尔商店里对彼得·莫里森这么说。当然，是彼得先问他的。马修活了这么久，从来不会主动告诉别人自己的事。
        - id: ch01-b05
          speaker: narrator
          text: 可就在这个忙碌的下午，三点半钟，马修竟驾着车安安稳稳地穿过洼地，朝山坡上去了。他不但戴了白领，还穿着最体面的衣服，一看就是要离开埃文利。车上套的又是那匹栗色母马，说明他要去的地方还不近。马修究竟要上哪儿去？为什么去？
        - id: ch01-b06
          speaker: narrator
          text: 如果换作村里别的男人，雷切尔太太把零零碎碎的线索拼起来，多半早就猜中了。偏偏马修很少出门，这回准是碰上了紧急又反常的事。他天生腼腆，最怕见生人。只要一个地方可能逼得他开口说话，他都恨不得躲得远远的。如今他穿戴齐整，还驾车出了门，实在少见。雷切尔太太想来想去，怎么也想不通，整个下午的兴致全毁了。
        - id: ch01-b07
          speaker: rachel
          text: 喝完茶，我得去一趟绿山墙，问问玛丽拉，马修到底去了哪儿，又去做什么。这个时候，他不会进城，更从来不去串门。就算芜菁籽没了，也用不着换上好衣服，驾车去买。马走得不快，那也不可能是去请医生。一定是昨晚以后出了什么事，他今天才会动身。唉，我真叫这事弄糊涂了。马修今天为什么离开埃文利？要是不问个明白，我一分钟也安不下心，连良心都过不去。
        - id: ch01-b08
          speaker: narrator
          text: 雷切尔太太终于拿定了主意。茶一喝完，她便出了门。
        - id: ch01-b09
          speaker: narrator
          text: 路其实不远。卡思伯特兄妹那座宽大的房子藏在果园里，从林德洼地沿大路往上，还不到四分之一英里。只是通往房子的车道很长，走起来要多费些脚程。马修的父亲跟儿子一样沉默怕生。当年买下这片地，他把房子盖得离人群能有多远就有多远，差一点就缩进了森林。绿山墙立在开垦地的尽头，直到现在，从大路上也只能勉强看见。埃文利其他人家都亲亲热热地挨着大路，雷切尔太太可不觉得，躲在绿山墙这种地方也算过日子。
        - id: ch01-b10
          speaker: rachel
          text: 这哪能叫过日子，顶多算待在这儿。马修和玛丽拉两个人躲得这么偏，难怪性子都有些古怪。树又不能陪人说话。当然啦，天知道，要是树真算伴儿，这儿倒是不缺。反正我还是爱看见人。他们好像也挺知足，大概是住惯了吧。人什么都能习惯，连上绞架都能习惯。那个爱尔兰人不是这么说的吗？
        - id: ch01-b11
          speaker: narrator
          text: 她沿着青草丛生、车辙深陷的车道快步往前，两旁开着野蔷薇。说完这番话，她也走进了绿山墙的后院。院子鲜绿又整齐，一边站着一棵巨大的老垂柳，另一边的伦巴第杨排得端端正正。地上没有一根落下的树枝，也找不到一块碍眼的石子。真要有，也绝不会漏过雷切尔太太的眼睛。她暗自认定，玛丽拉扫院子的次数，恐怕跟扫屋子一样多。在这片地上吃饭，准不会吞下俗话里说的那一斗土中的一小撮。
        - id: ch01-b12
          speaker: narrator
          text: 雷切尔太太干脆地敲了敲厨房门，听见里面答应一声，便自己走了进去。绿山墙的厨房本来很讨人喜欢，只是收拾得太干净，叫人浑身不自在，简直像一间从没人用过的客厅。屋里有东西两扇窗。六月金黄柔和的阳光从西窗照满后院。东窗爬满藤蔓，绿荫后面，左边果园里的樱桃树白得像雪，还能望见洼地小溪旁低头轻摆的白桦。
        - id: ch01-b13
          speaker: narrator
          text: 玛丽拉·卡思伯特每次坐下，总选东窗边的位置。她向来不大信任阳光，觉得它太爱跳舞，也太不负责任，跟这个必须认真对待的世界不太合拍。此刻她就在窗边织毛线，身后的桌上已经摆好晚餐。雷切尔太太还没来得及关严房门，心里已经把桌上的东西数了一遍。三只盘子，说明玛丽拉正等马修带个人回来喝茶。可桌上都是平常的餐具，吃的也只有海棠果酱和一种蛋糕，客人显然不是什么要紧人物。那马修为什么戴白领，又为什么套栗色母马？一向安静、从不藏秘密的绿山墙，忽然出了这么件怪事，雷切尔太太简直要被绕晕了。
        - id: ch01-b14
          speaker: marilla
          text: 晚上好，雷切尔。今天天气真不错，是不是？坐吧。你们家里人都好吗？
        - id: ch01-b15
          speaker: narrator
          text: 玛丽拉和雷切尔太太的关系，如果非得起个名字，只能叫友谊。她们脾气截然不同，却一直相处得不错，也许正是因为彼此差得太远。玛丽拉又高又瘦，全身都是棱角，找不到一点圆润的地方。乌黑的头发已经夹了灰丝，总是在脑后紧紧绾成小髻，再用两根铁丝发夹气势汹汹地横插过去。她看起来见识不算多，对自己的良心又十分严格，事实也确实如此。不过，她的嘴角藏着一点难得的意味。只要再明显一点点，也许就能称作幽默感了。
        - id: ch01-b16
          speaker: rachel
          text: 我们都好。不过今天看见马修出门，我还真有点担心。是不是你身体不舒服，他赶着去请医生了？
        - id: ch01-b17
          speaker: narrator
          text: 玛丽拉的嘴角微微动了一下。她早知道雷切尔一定会上门。马修这么没头没脑地驾车出去，邻居那份好奇心怎么受得住？
        - id: ch01-b18
          speaker: marilla
          text: 不是，我好得很，就是昨天头疼得厉害。马修去了布莱特河。我们从新斯科舍一家孤儿院领了个男孩，他今晚坐火车来，马修去接他。
        - id: ch01-b19
          speaker: narrator
          text: 就算玛丽拉说，马修去布莱特河接一只澳大利亚来的袋鼠，雷切尔太太也不会更吃惊。她结结实实地哑了五秒。她怎么也不能相信玛丽拉会拿这事开玩笑，可眼下又几乎只能这么想。
        - id: ch01-b20
          speaker: rachel
          text: 玛丽拉，你说的是真的？
          emotion: surprised
        - id: ch01-b21
          speaker: marilla
          text: 当然是真的。
        - id: ch01-b22
          speaker: narrator
          text: 玛丽拉说得再自然不过，好像从新斯科舍的孤儿院领个男孩，是埃文利每个经营得当的农场到了春天都会办的事。雷切尔太太只觉得脑子挨了一记重击，所有念头都变成了一个个惊叹号。一个男孩！玛丽拉和马修要收养一个男孩！还是从孤儿院来的！这个世界真是彻底颠倒了。从今往后，恐怕再没有什么能让她吃惊了。
        - id: ch01-b23
          speaker: rachel
          text: 你们怎么会想到要这么做？
        - id: ch01-b24
          speaker: narrator
          text: 这件大事竟没人来问她的意见，她当然非反对不可。
        - id: ch01-b25
          speaker: marilla
          text: 我们想这件事有一阵子了，其实整整想了一个冬天。圣诞节前，亚历山大·斯宾塞太太来过一趟，说她打算等到春天，从霍普顿那边的孤儿院领个小姑娘。她有个表亲住在那里，她也亲自去看过，对那家孤儿院很了解。从那以后，我和马修就时不时地商量这件事。
        - id: ch01-b26
          speaker: marilla
          text: 我们想要个男孩。你也知道，马修年纪大了，已经六十岁，手脚不如从前灵便，心脏还常常不舒服。现在想雇个帮工，实在难得很。这一带除了那些年纪不大、又不怎么机灵的法国小子，根本找不到别人。好不容易雇来一个，刚教会他一点活儿，他也习惯了家里的做法，转头就去了龙虾罐头厂，或者干脆跑到美国。
        - id: ch01-b27
          speaker: marilla
          text: 一开始，马修说可以领一个从英国来的儿童移民，我当场就拒绝了。我跟他说，那些孩子也许没什么不好，我不是说他们不好。可我不要伦敦街头长大的野孩子，至少也得找个本地出生的。无论领谁都有风险，不过要是个土生土长的加拿大孩子，我心里能踏实一点，晚上也睡得安稳些。
        - id: ch01-b28
          speaker: marilla
          text: 后来我们决定，等斯宾塞太太去接她的小姑娘，就请她顺便替我们挑一个。上星期听说她要走了，我们托卡莫迪理查德·斯宾塞家的人捎了话，请她带回一个十岁或十一岁左右的男孩，要聪明伶俐，看着也有出息。这个年纪正合适，已经能马上帮着干些杂活，又还小，来得及好好教养。我们会给他一个好家，也会送他上学。
        - id: ch01-b29
          speaker: marilla
          text: 今天，邮差从车站带来了斯宾塞太太的电报。她说他们今晚坐五点半的火车到。所以马修才去了布莱特河。她会让那孩子在那里下车，自己还得继续坐到白沙车站。
        - id: ch01-b30
          speaker: narrator
          text: 雷切尔太太一向以有话直说为荣。她费了好一番力气，总算定下神，接受了这个惊人的消息。接着，她便当真直说了。
        - id: ch01-b31
          speaker: rachel
          text: 好吧，玛丽拉，我就明明白白告诉你。你们这回干了件天大的傻事，风险实在太大。你根本不知道会领回来什么样的孩子。一个完全陌生的孩子进了家门，你却不知道他脾气怎么样，父母是什么人，也不知道他以后会变成什么样。
        - id: ch01-b32
          speaker: rachel
          text: 就在上星期，我还从报纸上看到，岛西边有一对夫妻从孤儿院领了个男孩。结果那孩子半夜放火烧房子，还是故意放的，差点把他们两口子烧死在床上。我还听说过另一个养子，他总在鸡蛋上吸个洞，把里面偷吃掉，怎么教都改不了。你们要是先来问我就好了。可你偏偏没问，玛丽拉。要是问了，我一定会说，看在老天的分上，千万别动这个念头。
        - id: ch01-b33
          speaker: narrator
          text: 这一大篇劝慰，听起来很像约伯那些朋友说的话。不过玛丽拉没有生气，似乎也没有被吓住。她手里的毛线针还是稳稳地动着。
        - id: ch01-b34
          speaker: marilla
          text: 雷切尔，我承认，你说的不是全没道理。我自己也犹豫过。可是马修一心想这么做，我看得出来，所以只好答应。他很少会对一件事这么坚持。既然他终于拿定一次主意，我总觉得应该依着他。
        - id: ch01-b35
          speaker: marilla
          text: 至于风险，人活在世上，差不多做什么都有风险。照你这么说，自己生孩子也一样是在冒险，因为孩子长大以后，并不见得个个都好。再说，新斯科舍就在本岛旁边，我们又不是从英国或美国领一个回来。那孩子跟我们总不会差得太远。
        - id: ch01-b36
          speaker: rachel
          text: 唉，但愿一切顺顺当当吧。可他以后要是放火烧了绿山墙，或者往井里放了士的宁，你可别说我没有提醒过你。听说新不伦瑞克就出过这种事。孤儿院来的孩子往井里下毒，害得全家人痛苦得不得了，最后全死了。不过，那回倒是个女孩。
        - id: ch01-b37
          speaker: narrator
          text: 她嘴上说着但愿顺利，那语气却把满心痛苦的疑虑全露了出来。
        - id: ch01-b38
          speaker: marilla
          text: 我们领的又不是女孩。我从没想过领个女孩回来。亚历山大·斯宾塞太太居然真要这么做，连我都觉得吃惊。不过，只要她自己拿定了主意，就算要把整座孤儿院的孩子都领回家，她也不会退缩。
        - id: ch01-b39
          speaker: narrator
          text: 玛丽拉说得仿佛往井里下毒是女孩才有的本事，领个男孩便不必操心。雷切尔太太很想留下，亲眼看看马修带回来的孤儿。可她一算，至少还得等整整两个钟头，便决定沿大路去罗伯特·贝尔家，把这个消息告诉他们。这件事一定会在埃文利掀起从未有过的轰动，而雷切尔太太最喜欢的，正是亲手掀起轰动。于是她起身告辞。玛丽拉多少松了口气，因为听完雷切尔那一番悲观的话，她心里的怀疑和害怕又冒了出来。
        - id: ch01-b40
          speaker: narrator
          text: 雷切尔太太一直走到车道上，确定自己安安全全地离开了绿山墙，这才出了声。
        - id: ch01-b41
          speaker: rachel
          text: 哎呀，从古到今哪有过这种事！我简直像在做梦。唉，那个可怜的小家伙，我真替他难过。马修和玛丽拉根本不懂孩子，却准会要求他比自己的祖父还要聪明稳重。还不知道他到底有没有过祖父呢。
        - id: ch01-b42
          speaker: rachel
          text: 一想到绿山墙里要住进一个孩子，我就觉得怪吓人的。那里从来没有过孩子。那所房子刚盖好时，马修和玛丽拉就已经长大成人了。看看他们现在的样子，真难相信他们小时候也当过孩子。不管别人给我什么，我都不愿落到那个孤儿的处境里。天哪，我可真同情他。
        - id: ch01-b43
          speaker: narrator
          text: 雷切尔太太心事重重，对着路边的野蔷薇说完了这些话。可就在那一刻，那个孩子正耐心等在布莱特河车站。要是雷切尔太太能看见，她的同情一定会更深，也会更沉。
