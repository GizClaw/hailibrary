audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm, observant, and gently amused
        timbre: clear and rounded
        pace: measured
        pitch: medium
    rachel_lynde:
      display_name: Mrs. Rachel Lynde
      tts:
        delivery: brisk, emphatic, and confidently inquisitive
        timbre: sturdy and bright
        pace: lively
        pitch: medium
    marilla_cuthbert:
      display_name: Marilla Cuthbert
      tts:
        delivery: practical, direct, and dryly understated
        timbre: firm and clear
        pace: steady
        pitch: medium-low
  chapters:
    - id: ch01
      title: Lynde's Hollow
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            Mrs. Rachel Lynde lived where the main road through Avonlea dipped into a little hollow. Alders and ladies' eardrops grew along its edges, and a brook ran through it from the woods around the old Cuthbert place. Up in those woods, people said, the brook rushed headlong through secret pools and little waterfalls. It had dark places and a wild course there. By the time it reached Lynde's Hollow, though, it had become a quiet, well-behaved stream. After all, not even a brook could pass Mrs. Rachel's door without minding its manners. She was usually at her window, watching everything that went by, from brooks and children on up. If anything looked odd or out of place, she would never let the matter rest. She would keep asking questions until she had uncovered every reason behind it.
        - id: ch01-b02
          speaker: narrator
          text: >-
            Some people follow their neighbors' affairs only by neglecting their own. Mrs. Rachel managed both. Her housework was always finished and finished well. She ran the Sewing Circle, helped with Sunday school, and supported both the Church Aid Society and the Foreign Missions Auxiliary. Even so, she spent hours at her kitchen window knitting cotton-warp quilts. She had made sixteen, a number Avonlea housekeepers mentioned with awe. All the while, she watched the main road cross the hollow and climb the steep red hill beyond.
        - id: ch01-b03
          speaker: narrator
          text: >-
            Avonlea lay on a small triangular piece of land that reached into the Gulf of St. Lawrence, with water on two sides. Anyone entering or leaving had to travel that hill road. They also had to pass, without knowing it, under Mrs. Rachel's all-seeing eye.
    - id: ch02
      title: Matthew on the Road
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            One warm, bright afternoon in early June, Mrs. Rachel sat in her usual place. Sunlight streamed warmly through the window. Below the house, the orchard slope was covered in pink-white blossoms, and countless bees hummed over them. Beyond the barn, Thomas Lynde was planting his late turnip seed on the hillside field. He was a meek little man whom the people of Avonlea called not Thomas, but "Rachel Lynde's husband."
        - id: ch02-b02
          speaker: narrator
          text: >-
            Matthew Cuthbert should have been planting turnips too, over in the big red field beside the brook at Green Gables. Mrs. Rachel knew because she had heard him tell Peter Morrison so the night before, at William J. Blair's store in Carmody. Peter must have asked him. Matthew had never been known to offer information on his own.
        - id: ch02-b03
          speaker: narrator
          text: >-
            Yet at half past three, right in the middle of a busy afternoon, Matthew came driving calmly through the hollow and up the hill. He wore his best suit and a white collar, sure signs that he was leaving Avonlea. He had also hitched the sorrel mare to the buggy, which meant a fairly long trip. Everything about the sight called for an explanation. Where could he be going? And why?
        - id: ch02-b04
          speaker: narrator
          text: >-
            With almost any other man in Avonlea, Mrs. Rachel could have fitted the clues together and made a good guess. Matthew was different. He hardly ever left home. He was painfully shy and hated going among strangers or anywhere he might have to talk. Seeing him dressed up and riding in a buggy was rare enough to mean that something urgent and unusual had happened. Mrs. Rachel thought and thought, but found no answer. Her afternoon was ruined.
        - id: ch02-b05
          speaker: rachel_lynde
          text: >-
            After tea, I'll go over to Green Gables and ask Marilla where he's gone and what this is about. Matthew doesn't usually go to town now, and he never pays visits. If he needed more turnip seed, he wouldn't put on his best clothes and take the buggy. And he wasn't driving nearly fast enough to fetch a doctor. Something must have happened since last night. I can't make sense of it, and I won't have one peaceful minute until I find out what sent him away from Avonlea today.
    - id: ch03
      title: The Road to Green Gables
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            So after tea, Mrs. Rachel set off. The Cuthberts' large, rambling house stood barely a quarter mile up the road, tucked among its orchard trees, though the long lane made the walk farther. Matthew's father had been just as shy and quiet as Matthew. When he founded the farm, he had put the house as far from other people as he could without moving right into the woods. Green Gables still stood at the far edge of the cleared land. From the main road, you could barely see it. All the other Avonlea homes sat openly along that road, close enough to seem sociable. Mrs. Rachel did not consider the Cuthberts' hidden place a proper place to live.
        - id: ch03-b02
          speaker: rachel_lynde
          text: >-
            That's not living. That's only staying somewhere. No wonder Matthew and Marilla are both a little peculiar, shut away back here by themselves. Trees don't make much company, though goodness knows they have enough of them. I'd rather look at people. They seem satisfied, I suppose, but they've had time to get used to it. A person can get used to anything, even being hanged, as the Irishman said.
        - id: ch03-b03
          speaker: narrator
          text: >-
            Mrs. Rachel followed the deeply rutted grassy lane between wild rosebushes and stepped into the backyard. It was intensely green, tidy, and exact. Great old willows lined one side, and straight Lombardy poplars lined the other. Not one loose stick or stone lay anywhere. Mrs. Rachel would certainly have spotted it if one had. She privately believed that Marilla swept the yard as often as she swept the house. You could have eaten your dinner from that ground without swallowing your full peck of dirt.
    - id: ch04
      title: Three Plates on the Table
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            Mrs. Rachel knocked sharply at the kitchen door and went in when Marilla called to her. The Green Gables kitchen was a pleasant room, or it would have been if its painful cleanliness had not made it look like a parlor no one used. Windows faced east and west. Soft June sunlight poured through the western one from the backyard. Through the eastern one, partly covered by tangled vines, you could see white cherry blossoms in the orchard and slim birches nodding in the hollow by the brook.
        - id: ch04-b02
          speaker: narrator
          text: >-
            This was where Marilla Cuthbert sat, on the rare occasions when she sat at all. She never quite trusted sunshine. It seemed too lively and careless for a world that ought to be taken seriously. Now she was knitting, with the supper table ready behind her.
        - id: ch04-b03
          speaker: narrator
          text: >-
            Before Mrs. Rachel had even shut the door, she had noticed everything on that table. Three plates were set out, so Marilla expected Matthew to bring someone home for supper. But they were using the everyday dishes. The food included only crab-apple preserves and one kind of cake. Whoever was coming could not be important company. That answer only made the puzzle worse. Why had Matthew worn his white collar? Why had he taken the sorrel mare? All this mystery at quiet, ordinary Green Gables was making Mrs. Rachel dizzy.
        - id: ch04-b04
          speaker: marilla_cuthbert
          text: >-
            Good evening, Rachel. Fine evening, isn't it? Sit down, won't you? How is everybody at home?
        - id: ch04-b05
          speaker: narrator
          text: >-
            Marilla and Mrs. Rachel had always shared something that could best be called friendship, whether in spite of their differences or because of them. Marilla was tall, thin, and all angles, without a curve about her. Her dark hair, streaked with gray, was pulled into a hard little knot with two wire pins thrust through it as if they meant business. She had seen little of the world and possessed a strict conscience. Still, there was something about her mouth that might have become a sense of humor if it had been given a little more room to grow.
        - id: ch04-b06
          speaker: rachel_lynde
          text: >-
            We're all doing well enough. But when I saw Matthew leave today, I wondered if you might be sick. I thought perhaps he was headed for the doctor's.
        - id: ch04-b07
          speaker: narrator
          text: >-
            Marilla's lips twitched. She understood perfectly. She had expected Rachel to appear, because the unexplained sight of Matthew driving away was more than her neighbor's curiosity could bear.
        - id: ch04-b08
          speaker: marilla_cuthbert
          text: >-
            No, I'm all right, though I did have a bad headache yesterday. Matthew has gone to Bright River. We're taking in a little boy from an orphan asylum in Nova Scotia, and his train arrives tonight.
        - id: ch04-b09
          speaker: narrator
          text: >-
            Marilla might as well have said that Matthew had gone to Bright River to collect a kangaroo from Australia. Mrs. Rachel could not have been more amazed. For five full seconds she had no words at all. Marilla could not possibly be teasing her, but Rachel nearly had to believe she was.
        - id: ch04-b10
          speaker: rachel_lynde
          text: Are you truly serious, Marilla?
          emotion: surprised
        - id: ch04-b11
          speaker: marilla_cuthbert
          text: Of course I am.
        - id: ch04-b12
          speaker: narrator
          text: >-
            Marilla spoke as if bringing boys from Nova Scotia orphan asylums were ordinary spring work on every well-run Avonlea farm. Mrs. Rachel felt the news strike her like a blow. Her thoughts came in exclamation points. A boy! Marilla and Matthew Cuthbert, of all people, adopting a boy! From an orphan asylum! The world had turned upside down. After this, nothing could ever surprise her again.
        - id: ch04-b13
          speaker: rachel_lynde
          text: What in the world made you think of doing that?
        - id: ch04-b14
          speaker: narrator
          text: >-
            She strongly disapproved. The decision had been made without anyone asking for her advice, so naturally she had to.
    - id: ch05
      title: Marilla Explains
      blocks:
        - id: ch05-b01
          speaker: marilla_cuthbert
          text: >-
            We've been considering it for a while now. All winter, really. Before Christmas, Mrs. Alexander Spencer came by and said she planned to get a little girl from the asylum in Hopeton this spring. Her cousin lives there, and Mrs. Spencer has visited, so she knows the place. Matthew and I have talked it over now and then ever since. We decided on a boy.
        - id: ch05-b02
          speaker: marilla_cuthbert
          text: >-
            Matthew is getting older. He's sixty now, and he isn't as quick as he used to be. His heart gives him a great deal of trouble. And you know how nearly impossible it is to hire help. All we can find are those foolish half-grown French boys. Just when you've taught one something and got him used to your way of doing things, he runs off to a lobster cannery or to the States.
        - id: ch05-b03
          speaker: marilla_cuthbert
          text: >-
            Matthew first thought we might take one of the Home boys, but I said no to that. They may be perfectly fine. I'm not claiming otherwise. Still, I don't want a London street boy. At least let me have a child born here. Whoever comes will be a risk, but I'll rest easier at night if he's Canadian.
        - id: ch05-b04
          speaker: marilla_cuthbert
          text: >-
            In the end, we asked Mrs. Spencer to choose one for us when she went for her girl. Last week we heard that she was going, so we sent word through Richard Spencer's family in Carmody. We asked for a bright, promising boy around ten or eleven. That seemed the best age. He'll be old enough to help with chores right away, but still young enough for us to raise properly. We intend to give him a good home and send him to school.
        - id: ch05-b05
          speaker: marilla_cuthbert
          text: >-
            Mrs. Alexander Spencer sent us a telegram today. The mail carrier brought it from the station. She and the boy will arrive on the five-thirty train tonight, so Matthew has gone to meet him at Bright River. Mrs. Spencer will leave the boy there and continue on to White Sands herself.
        - id: ch05-b06
          speaker: narrator
          text: >-
            Mrs. Rachel took pride in saying exactly what she thought. Once she had adjusted herself to this astonishing news, that was what she did. She had not been asked for advice before the decision. That made it all the more necessary, in her mind, to give her opinion now.
        - id: ch05-b07
          speaker: rachel_lynde
          text: >-
            Marilla, I'll be plain with you. This is a terribly foolish thing to do, and it's dangerous too. You have no idea what you're bringing home. You're letting a strange child into your house without knowing anything about him. You don't know his nature, who his parents were, or what sort of person he'll become.
        - id: ch05-b08
          speaker: rachel_lynde
          text: >-
            Why, just last week the newspaper told about a couple west of the Island who took in a boy from an orphan asylum. In the middle of the night, he deliberately set their house on fire. They were almost burned alive in their beds. And I know of another adopted boy who sucked the eggs. Nothing they tried could stop him. If you had asked me, and you did not, I would have begged you not to consider this.
        - id: ch05-b09
          speaker: narrator
          text: >-
            This comfort, which was about as cheering as anything Job's friends had offered him, did not upset or frighten Marilla. She kept right on knitting.
        - id: ch05-b10
          speaker: marilla_cuthbert
          text: >-
            I won't say you're entirely wrong, Rachel. I've worried about it myself. But Matthew wanted this very badly. I could tell. He so rarely sets his heart on anything that when he does, I feel I ought to give way.
        - id: ch05-b11
          speaker: marilla_cuthbert
          text: >-
            As for danger, nearly everything people do in this world has some risk. Even having children of your own is a risk. They don't always grow up well. Besides, Nova Scotia is close to the Island. We aren't bringing him from England or the States. He can't be so very different from us.
    - id: ch06
      title: Mrs. Rachel Spreads the News
      blocks:
        - id: ch06-b01
          speaker: rachel_lynde
          text: >-
            Well, I hope everything works out. But if he burns Green Gables to the ground or puts strychnine in the well, remember that I warned you. I heard about an orphan child in New Brunswick who poisoned a well, and the entire family died in terrible pain. Though that child happened to be a girl.
        - id: ch06-b02
          speaker: narrator
          text: >-
            Her voice made it quite clear how little hope she had that anything would work out.
        - id: ch06-b03
          speaker: marilla_cuthbert
          text: >-
            Well, ours isn't a girl. I would never consider raising one. I don't know what Mrs. Alexander Spencer is thinking. Then again, if the idea came to her, she wouldn't hesitate to adopt the whole asylum.
        - id: ch06-b04
          speaker: narrator
          text: >-
            Marilla said it as though poisoning wells were a talent found only in girls, and therefore no danger at all with a boy.
        - id: ch06-b05
          speaker: narrator
          text: >-
            Mrs. Rachel would have liked to stay and see Matthew return with the orphan from Nova Scotia. But he would not be home for at least another two hours. She decided she could put that time to better use. She would go up the road to Robert Bell's and tell him the news. Nothing in Avonlea could cause a greater stir, and Mrs. Rachel dearly loved being the person who caused one. So she took her leave. Marilla was rather relieved to see her go, because Rachel's gloomy warnings had begun to wake all her doubts and fears again.
        - id: ch06-b06
          speaker: rachel_lynde
          text: >-
            Well! Of all the things that have ever happened or ever could happen! I truly feel as if I must be dreaming. And I do feel sorry for that poor child. Matthew and Marilla know nothing about children. They'll expect him to have more sense and steadiness than his own grandfather, assuming he ever had one, which I doubt.
        - id: ch06-b07
          speaker: rachel_lynde
          text: >-
            Somehow, the thought of a child at Green Gables feels unnatural. There has never been one there. Matthew and Marilla were already grown when the new house was built, if either of them ever was a child. Looking at them, that's hard to believe. I wouldn't trade places with that orphan for anything. My, how I pity him.
        - id: ch06-b08
          speaker: narrator
          text: >-
            Mrs. Rachel poured out these thoughts to the wild rosebushes as she walked down the lane. But at that very moment, a child was waiting patiently at Bright River station. If Mrs. Rachel could have seen that child, her pity would have gone deeper still.
