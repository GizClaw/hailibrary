audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖机敏，带着含蓄的幽默讲述
        timbre: 清澈柔和
        pace: 舒展而富有变化
        pitch: medium
    anne:
      display_name: 安妮
      tts:
        delivery: 热烈敏感，想象丰富，情绪来得真切而迅速
        timbre: 明亮清脆的少女声
        pace: 偏快，激动时连贯奔涌
        pitch: medium-high
    diana:
      display_name: 戴安娜
      tts:
        delivery: 亲切真诚，对朋友满怀关心
        timbre: 柔和甜润的少女声
        pace: 自然适中
        pitch: medium-high
    moody:
      display_name: 穆迪·斯珀吉翁
      tts:
        delivery: 腼腆拘谨，偶尔会因激动脱口而出
        timbre: 稚嫩厚实的少年声
        pace: 自然适中
        pitch: medium
    matthew:
      display_name: 马修
      tts:
        delivery: 腼腆温厚，说话轻而真诚
        timbre: 低沉朴实的中年男声
        pace: 缓慢迟疑
        pitch: low
    marilla:
      display_name: 玛丽拉
      tts:
        delivery: 严厉务实，关切藏在克制的话语里
        timbre: 稳定清晰的中年女声
        pace: 从容直接
        pitch: medium-low
    rachel:
      display_name: 蕾切尔太太
      tts:
        delivery: 快言快语，自信挑剔又不失热心
        timbre: 响亮结实的中年女声
        pace: 明快连贯
        pitch: medium
  chapters:
    - id: ch01
      title: 第三十二章　录取名单公布了
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 六月底，学期结束了，史黛西小姐在埃文利学校任教的日子也到了尽头。那天傍晚，安妮和戴安娜走在回家的路上，心情格外沉重。她们眼睛通红，手帕湿透。这足以证明，史黛西小姐的临别赠言有多么感人，大概不亚于三年前同样情形下菲利普斯先生说的那番话。走到云杉山脚，戴安娜回头望着校舍，深深叹了口气。
        - id: ch01-b02
          speaker: diana
          text: 真像所有事情都结束了，是不是？
          emotion: sad
        - id: ch01-b03
          speaker: anne
          text: 你再难过，也赶不上我的一半。我连手帕上一块干地方都找不到。明年冬天你还会回来，可我大概要永远离开这所亲爱的老学校了。当然，那得看我运气够不够好。
          emotion: sad
        - id: ch01-b04
          speaker: diana
          text: 可学校再也不会和从前一样。史黛西小姐不在，你不在，简和鲁比多半也不回来。我只好一个人坐了。跟你同桌以后，我可受不了换成别人。安妮，我们以前多快活啊！一想到那些日子全过去了，真叫人难受。
          emotion: sad
        - id: ch01-b05
          speaker: narrator
          text: 两颗大泪珠顺着戴安娜的鼻翼滚了下来。
        - id: ch01-b06
          speaker: anne
          text: 你不哭，我就能停。可我刚把手帕收起来，一见你眼里又有泪，自己马上也哭了。林德太太不是说过吗？高兴不起来，也要尽量高兴一点。反正我明年说不定还得回来。这回我又明明白白地知道，自己肯定考不过了。最近这种时候多得真吓人。
        - id: ch01-b07
          speaker: diana
          text: 可史黛西小姐出的考试，你明明考得特别好呀。
        - id: ch01-b08
          speaker: anne
          text: 那些考试不会叫我紧张。真正的入学考试可不一样，我一想起来，心口就又冷又乱颤。偏偏我的号码还是十三，乔西·派伊说这数字特别不吉利。我一点也不迷信，也知道号码不会影响成绩，可我还是希望它别是十三。
          emotion: fearful
        - id: ch01-b09
          speaker: diana
          text: 真希望我也能和你一起进城，那一定有趣极了。不过，你晚上是不是得拼命温书？
        - id: ch01-b10
          speaker: anne
          text: 不行。史黛西小姐叫我们保证，一本书也不翻。她说再看只会又累又糊涂。我们该出去走走，别想考试，还得早睡。劝得很好，可好劝告往往最难照办。普里西·安德鲁斯参加入学考试时，每晚都熬过半夜，拼命温书。我本来也决定，至少要熬得和她一样晚。幸好你约瑟芬姑婆肯让我住在山毛榉山庄，她真好。
        - id: ch01-b11
          speaker: diana
          text: 你进城后会给我写信吧？
        - id: ch01-b12
          speaker: anne
          text: 星期二晚上就写，我会告诉你第一天考得怎么样。
        - id: ch01-b13
          speaker: diana
          text: 那我星期三就守在邮局，哪里也不去。
        - id: ch01-b14
          speaker: narrator
          text: 下个星期一，安妮进了城。到了星期三，戴安娜果然照约定守在邮局，也果然等到了她的信。安妮先写道，最亲爱的戴安娜，现在是星期二晚上，我正坐在山毛榉山庄的书房里给你写信。
        - id: ch01-b15
          speaker: anne
          text: 昨晚我独自待在房里，寂寞得可怕，真希望你在这里。我答应史黛西小姐不拼命温书，只好忍着。可忍住不翻历史书，跟从前功课没做完时忍住不看故事一样难。
        - id: ch01-b16
          speaker: anne
          text: 今天早晨，史黛西小姐来接我。我们去学院时，又叫上简、鲁比和乔西。鲁比的手冷得像冰。乔西说我准是一夜没睡，就算考进去，身体也受不住师范课程那份苦。直到现在，我有时还是觉得，自己根本没学会喜欢乔西·派伊！
        - id: ch01-b17
          speaker: anne
          text: 学院里来了几十名学生，都是从岛上各处赶来的。头一个看见的是穆迪·斯珀吉翁。他坐在台阶上，不停地念叨。简问他在干什么，他说自己一遍遍背乘法表，是为了稳住神经，还求我们千万别打断。只要停一会儿，他就会害怕，会把学过的东西全忘掉。只有乘法表能把那些知识牢牢放在原来的位置上。
        - id: ch01-b18
          speaker: anne
          text: 分好考场以后，史黛西小姐只好离开了。我和简坐在一起，她镇定得让我羡慕。像简这样善良、沉稳又明理的人，根本不用背乘法表。我却一直在想，自己的脸上是不是把心里的感受全露出来了，教室另一头的人会不会也听得见我的心怦怦直跳。这时，一个男人走进来，开始分发英文试卷。我一接过卷子，双手马上变得冰凉，脑袋也天旋地转。
        - id: ch01-b19
          speaker: anne
          text: 那种可怕的感觉只持续了一瞬间。戴安娜，我就像四年前问玛丽拉能不能留在绿山墙时一样害怕。接着，我脑子里突然清楚了，心也重新跳起来。我忘了说，刚才它已经完全停了！因为我看得出，这份卷子总还有题目是我能做的。
        - id: ch01-b20
          speaker: anne
          text: 中午我们回去吃饭，下午考历史。卷子很难，那些年代把我弄得一团糟，不过今天大概还算不错。可是明天要考几何！我非得使出全部意志，才能忍住不翻《欧几里得》。要是乘法表有用，我准会从现在背到明早。
          emotion: fearful
        - id: ch01-b21
          speaker: anne
          text: 晚上我去看其他姑娘，路上碰见穆迪失魂落魄地到处乱走。他认定自己历史没过，说他生来就是叫父母失望的。他还说，明早就坐火车回家，反正当木匠总比当牧师容易。我好好劝了他一阵，叫他一定留下来考完，要不然就太对不起史黛西小姐了。有时我也想做男孩，可一看见穆迪，我就庆幸自己是女孩，更庆幸不是他的妹妹。
        - id: ch01-b22
          speaker: anne
          text: 我赶到她们寄宿的地方时，鲁比正在歇斯底里地哭。她刚发现自己在英文卷上犯了个可怕的错误。等她终于缓过来，我们一起走到城里，吃了冰激凌。那时候，我们真希望你也在身边。哦，戴安娜，要是几何考试已经结束该多好！不过，林德太太一定会说，不管我几何及不及格，太阳照样会升起来，也照样会落下。这话是没错，却一点也安慰不了我。要是几何没及格，我倒宁愿太阳别再升起了！永远爱你的，安妮。
        - id: ch01-b23
          speaker: narrator
          text: 几何考试和其他各科考试，都在该结束的时候一一结束了。星期五傍晚，安妮终于回到家。她虽然有些疲惫，神情里却带着一种经过磨炼后的胜利。她进门时，戴安娜正在绿山墙等她。两个姑娘一见面，简直像分别了好几年。
        - id: ch01-b24
          speaker: diana
          text: 亲爱的老朋友，你终于回来了！你进城以后，我觉得都过了一辈子。快告诉我，你考得怎么样？
          emotion: happy
        - id: ch01-b25
          speaker: anne
          text: 除了几何，我想都还不错。几何过没过，我一点把握也没有，还有种毛骨悚然的预感，觉得准没过。可回来真好！绿山墙就是全世界最亲爱、最美丽的地方。
        - id: ch01-b26
          speaker: diana
          text: 其他人呢？
        - id: ch01-b27
          speaker: anne
          text: 姑娘们都说自己肯定没过，可我觉得她们其实答得不错。乔西还说，几何卷简单得连十岁孩子都会做。穆迪·斯珀吉翁仍然认定自己的历史没过，查理也说自己代数没过。可我们现在根本什么都不知道，只能等录取名单公布。名单还要整整两个星期才出来。你想想，我们得在这种悬念里活上两个星期！真希望我能一觉睡过去，等一切结束了再醒来。
        - id: ch01-b28
          speaker: narrator
          text: 戴安娜知道，问吉尔伯特考得如何也是白问，只叫安妮别担心，说她一定能通过。
        - id: ch01-b29
          speaker: anne
          text: 要是不能排在前面，我宁可根本没考过。
        - id: ch01-b30
          speaker: narrator
          text: 戴安娜完全明白她的意思。要是安妮不能胜过吉尔伯特·布莱思，这场成功就不完整，还会带着苦味。考试期间，安妮为了这个目标用尽了每一分力气，吉尔伯特也一样。他们在街上迎面碰见过十几次，每次都擦肩而过，谁也不肯表示认得对方。每遇见一次，安妮就把头昂得更高一点，也更真切地后悔，当初吉尔伯特求和时，自己为什么没有答应。可同时，她也更坚决地发誓，一定要在考试中胜过他。
        - id: ch01-b31
          speaker: narrator
          text: 安妮知道，埃文利的年轻人全在猜他们两个谁会得第一。她甚至知道，吉米·格洛弗和内德·赖特为了这个问题打了赌，乔西·派伊则一口咬定，第一名毫无疑问会是吉尔伯特。安妮觉得，要是自己输了，那份羞辱一定承受不了。
        - id: ch01-b32
          speaker: narrator
          text: 不过，安妮希望考出好成绩，还有一个更高尚的理由。她想为了马修和玛丽拉考到前面去，尤其是为了马修。马修一直认定，她一定能胜过全岛的人。安妮觉得，就算做最狂野的梦，也不该妄想这样的事。她只热切地盼着自己至少能进入前十，好让马修那双慈爱的棕眼睛，因为她取得的成绩闪出骄傲的光。为了那些一点想象力也没有的方程式和动词变位，她已经耐着性子苦读了那么久。若能看见马修眼里的那道光，就是最甜蜜的回报。
        - id: ch01-b33
          speaker: narrator
          text: 两个星期快过去时，安妮也开始守在邮局。简、鲁比和乔西心神不宁地陪着她。姑娘们用发抖的手翻开夏洛特敦的日报，心里又冷又沉，滋味不比参加考试的那一星期好受。查理和吉尔伯特也一样来等消息，并不觉得这样做有什么丢脸。只有穆迪坚决躲得远远的。
        - id: ch01-b34
          speaker: moody
          text: 我可没胆量站在那里，硬着头皮看报纸。我就在家等，等谁忽然跑来告诉我，到底过了没有。
          emotion: fearful
        - id: ch01-b35
          speaker: narrator
          text: 整整三个星期过去，录取名单还是没有消息。安妮觉得，这样一直绷紧神经，自己实在撑不了多久了。她吃不下饭，对埃文利的大小事情也没了兴趣。林德太太说，教育总监是保守党人，办事还能有什么指望。马修看见安妮脸色越来越苍白，对什么都不在意，每天下午从邮局回来时，脚步也一天比一天沉。他竟开始认真考虑，下次选举是不是该投自由党一票。
        - id: ch01-b36
          speaker: narrator
          text: 终于有一天傍晚，消息来了。安妮坐在敞开的窗前，暂时忘了考试的痛苦和世间所有烦恼，尽情感受夏日黄昏的美。下方的花园送来花朵呼吸般的甜香，白杨被风拨动，沙沙低语。冷杉上方的东天映着西边的晚霞，染上一层淡淡的粉红。安妮正出神地想，色彩的精灵会不会就是这个模样，忽然看见戴安娜从冷杉林间飞奔而来。她越过原木桥，冲上斜坡，手里挥舞着一张报纸。
        - id: ch01-b37
          speaker: narrator
          text: 安妮猛地站起身，立刻明白了。录取名单公布了！她头晕目眩，心跳得胸口发疼，一步也挪不动。仿佛等了一个钟头，戴安娜才冲过走廊，激动得连门也没敲，就闯进房间。
        - id: ch01-b38
          speaker: diana
          text: 安妮，你考过了！还是第一名！你和吉尔伯特并列第一，可你的名字排在前面。哦，我真为你骄傲！
          emotion: happy
        - id: ch01-b39
          speaker: narrator
          text: 戴安娜把报纸往桌上一扔，自己也扑到安妮床上。她喘得上气不接下气，再也说不出话。安妮急着点灯，却碰翻了火柴盒。她的双手抖得厉害，白白划掉六根火柴，才总算把灯点着。接着，她一把抓起报纸。是真的，她通过了考试。两百个人的名单上，她的名字就在最顶端。单凭这一刻，活着就值得了。
        - id: ch01-b40
          speaker: diana
          text: 你考得太棒了！爸爸不到十分钟前才从亮河带回报纸。它随下午的火车来的，邮差要明天才送到。我一看见名单，就发疯似的跑过来。你们全通过了，一个也不少。穆迪也过了，不过历史要补考。简、鲁比和查理都排在中间，成绩不错。乔西只多三分才过，可她准会摆出第一名的派头。史黛西小姐该多高兴啊！
          emotion: happy
        - id: ch01-b41
          speaker: diana
          text: 安妮，看见自己的名字排在最前面，到底是什么感觉？换成我，早欢喜得发疯了。我现在都快疯了，你却像春天的黄昏一样，又平静又凉爽。
          emotion: happy
        - id: ch01-b42
          speaker: anne
          text: 我只是心里光芒万丈，晃得说不出话。有一百句话想说，却找不到一个合适的词。我做梦也没想到会这样。不，我想过一次！我只敢战战兢兢地问自己，要是得了第一呢？因为觉得自己能胜过全岛，实在太虚荣，也太狂妄了。
          emotion: surprised
        - id: ch01-b43
          speaker: anne
          text: 对不起，戴安娜，我得离开一下。我要马上跑到田里告诉马修，然后我们沿着路去，把好消息告诉其他人。
          emotion: happy
        - id: ch01-b44
          speaker: narrator
          text: 她们赶到谷仓下面的干草地。马修正在把干草盘成垛。正巧，林德太太也站在路边篱笆旁，和玛丽拉说话。
        - id: ch01-b45
          speaker: anne
          text: 哦，马修，我考过了，还得了第一！或者说，是两个第一名里的一个。我没有自高自大，可我真心感激。
          emotion: happy
        - id: ch01-b46
          speaker: matthew
          text: 瞧吧，我早就说过。我就知道，你轻轻松松就能胜过他们所有人。
          emotion: happy
        - id: ch01-b47
          speaker: marilla
          text: 安妮，我得承认，你考得相当不错。
          emotion: happy
        - id: ch01-b48
          speaker: narrator
          text: 玛丽拉嘴上只肯说安妮考得相当不错。她极力不让蕾切尔那双挑剔的眼睛看出，自己心里究竟有多骄傲。可这位好心的蕾切尔太太，却一点也不打算掩饰自己的赞许。
        - id: ch01-b49
          speaker: rachel
          text: 她当然考得好，我可不会吝啬这句称赞。安妮，你给关心你的人争了气，我们大家都为你骄傲。
          emotion: happy
        - id: ch01-b50
          speaker: narrator
          text: 那天晚上，安妮又去了牧师住宅，和艾伦太太认真谈了一会儿，这才给美好的夜晚画上句点。回家以后，她跪在敞开的窗边，沐浴在大片皎洁的月光里，轻声祈祷。那是发自心底的感恩和向往。她感谢已经过去的一切，又怀着敬意，为自己的未来祈求。后来，她枕着洁白的枕头睡去。梦境明丽、光洁而美好，正是一颗少女心所能盼望的模样。
