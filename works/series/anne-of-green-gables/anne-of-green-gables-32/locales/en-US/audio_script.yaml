  chapters:
    - id: ch01
      title: Farewell to Avonlea School
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: "At the end of June, the school term ended, and so did Miss Stacy's time as Avonlea's teacher. Anne and Diana walked home that evening in a very sober mood. Their red eyes and damp handkerchiefs showed how deeply Miss Stacy's farewell had touched them. It had been every bit as moving as Mr. Phillips's farewell three years before. At the foot of the spruce hill, Diana looked back at the schoolhouse and gave a long sigh."
        - id: ch01-b02
          speaker: diana_barry
          text: "It feels as if everything is ending, doesn't it?"
          emotion: sad
        - id: ch01-b03
          speaker: anne_shirley
          text: "You shouldn't feel nearly as bad as I do. You'll come back next winter, but if I'm lucky, I've left our dear old school forever."
          emotion: sad
        - id: ch01-b04
          speaker: narrator
          text: "Anne searched her handkerchief, but there wasn't one dry spot left."
        - id: ch01-b05
          speaker: diana_barry
          text: "It won't be the same at all. Miss Stacy will be gone, and so will you, Jane, and probably Ruby. I'll have to sit by myself. I couldn't stand having anyone else for a deskmate after you. We've had such wonderful times, Anne. It's awful to think they're over."
          emotion: sad
        - id: ch01-b06
          speaker: narrator
          text: "Two large tears slipped down beside Diana's nose."
        - id: ch01-b07
          speaker: anne_shirley
          text: "If you'd stop crying, maybe I could stop too. Every time I put my handkerchief away, your eyes fill up and I start all over again. Mrs. Lynde says that if you can't be cheerful, you should be as cheerful as you can. Anyway, I may be back next year. This is another one of those times when I know I won't pass. They're happening far too often."
        - id: ch01-b08
          speaker: diana_barry
          text: "But you did beautifully on Miss Stacy's examinations."
        - id: ch01-b09
          speaker: anne_shirley
          text: "Those didn't make me nervous. When I think about the real examinations, I get a horrible cold flutter around my heart. And my number is thirteen. Josie Pye says that's terribly unlucky. I am not superstitious, and I know a number can't change anything. Still, I wish mine weren't thirteen."
          emotion: fearful
        - id: ch01-b10
          speaker: diana_barry
          text: "I wish I were going with you. We'd have the most elegant time. I suppose you'll spend every evening cramming, though."
        - id: ch01-b11
          speaker: anne_shirley
          text: "No. Miss Stacy made us promise not to open a book. She says studying now would only tire and confuse us. We're supposed to walk outside, forget the examinations, and go to bed early. It's good advice, but good advice is usually hard to follow. Prissy Andrews told me she stayed up half the night, every night, cramming as hard as she could during her Entrance week. I'd made up my mind to stay up at least that late too. It was so kind of your Aunt Josephine to invite me to Beechwood while I'm in town."
        - id: ch01-b12
          speaker: diana_barry
          text: "You'll write to me while you're there, won't you?"
        - id: ch01-b13
          speaker: anne_shirley
          text: "I'll write Tuesday night and tell you about the first day."
        - id: ch01-b14
          speaker: diana_barry
          text: "Then I'll haunt the post office on Wednesday."
    - id: ch02
      title: A Letter from Beechwood
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: "Anne went to town the next Monday. On Wednesday, just as promised, Diana haunted the post office and found a letter waiting for her. Anne had written it Tuesday night in the library at Beechwood."
        - id: ch02-b02
          speaker: anne_shirley
          text: "Dearest Diana, last night I felt horribly lonely in my room. I wished you were here. I couldn't cram because I had promised Miss Stacy, but keeping away from my history book was as hard as leaving a story unread before my lessons were finished."
        - id: ch02-b03
          speaker: anne_shirley
          text: "Miss Stacy came for me this morning. We picked up Jane, Ruby, and Josie, and then went to the Academy. Ruby's hands were as cold as ice. Josie told me I looked as if I hadn't slept and said I wasn't strong enough for the teacher's course, even if I passed. Sometimes I wonder whether I've made any progress at all in learning to like Josie Pye."
        - id: ch02-b04
          speaker: anne_shirley
          text: "Students had come to the Academy from all over the Island. There were scores of them. The first person we saw was Moody Spurgeon, sitting on the steps and muttering to himself. Jane asked what on earth he was doing. He begged her not to interrupt him. He was repeating the multiplication table to steady his nerves. If he stopped, even for a moment, he became frightened and forgot everything he had ever learned. Somehow, the multiplication table kept all the other facts in their proper places."
        - id: ch02-b05
          speaker: anne_shirley
          text: "Miss Stacy had to leave after we were sent to our rooms. Jane sat beside me, perfectly calm. She certainly didn't need the multiplication table. I wondered if everyone could see how frightened I felt, or hear my heart pounding across the room."
        - id: ch02-b06
          speaker: anne_shirley
          text: "Then a man came in and began handing out the English examination papers. My hands turned cold, and my head spun when I picked mine up. For one dreadful moment, I felt exactly as I did four years ago when I asked Marilla if I could stay at Green Gables. Then my mind cleared. My heart started beating again. I forgot to mention that it had stopped completely. At least I knew I could make something of that English paper."
        - id: ch02-b07
          speaker: anne_shirley
          text: "We went home for dinner at noon, then came back for history. That paper was difficult, and I got terribly mixed up over the dates. Still, I think I did fairly well today. Tomorrow is geometry, Diana. Just thinking about it takes all my determination not to open Euclid. If the multiplication table could help, I'd recite it until morning."
          emotion: fearful
        - id: ch02-b08
          speaker: anne_shirley
          text: "This evening I went to see the other girls. On the way, I found Moody wandering around in despair. He was certain he'd failed history. He said he had been born to disappoint his parents and ought to take the morning train home. Being a carpenter would be easier than being a minister anyway. I cheered him up and persuaded him to stay until the end, because leaving would be unfair to Miss Stacy. I've sometimes wished I were a boy, but whenever I see Moody, I'm glad I'm a girl and not his sister."
        - id: ch02-b09
          speaker: anne_shirley
          text: "Ruby was in hysterics at the boardinghouse. She had discovered a terrible mistake on her English paper. Once she recovered, we went uptown for ice cream. We wished so much that you were with us."
        - id: ch02-b10
          speaker: anne_shirley
          text: "Oh, Diana, if only geometry were finished! Still, Mrs. Lynde would say the sun will keep rising and setting whether I fail geometry or not. It's true, but it isn't comforting. If I fail, I think I'd rather the sun didn't keep going at all. Yours devotedly, Anne."
    - id: ch03
      title: Three Weeks of Waiting
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: "The geometry examination came and went in its proper time, and so did all the others. Anne returned home Friday evening. She was tired, but she carried a quiet, humbled sense of victory. Diana was waiting at Green Gables. The two girls greeted each other as if Anne had been away for years instead of a few days."
        - id: ch03-b02
          speaker: diana_barry
          text: "You darling, it's wonderful to have you home! It feels like you've been gone forever. Oh, Anne, how did you do?"
          emotion: happy
        - id: ch03-b03
          speaker: anne_shirley
          text: "Pretty well, I think, except in geometry. I truly don't know whether I passed that. I have a dreadful crawling feeling that I didn't. But it is so good to be home. Green Gables is the dearest, loveliest place in the world."
        - id: ch03-b04
          speaker: diana_barry
          text: "And how did everyone else do?"
        - id: ch03-b05
          speaker: anne_shirley
          text: "The girls all say they failed, but I think they did quite well. Josie says the geometry was so easy that a ten-year-old could do it. Moody still believes he failed history, and Charlie says he failed algebra. None of us knows anything until the pass list comes out, and that won't happen for two weeks. Imagine living with this suspense for a whole fortnight! I wish I could sleep until it's over."
        - id: ch03-b06
          speaker: narrator
          text: "Diana knew there was no point in asking about Gilbert Blythe."
        - id: ch03-b07
          speaker: diana_barry
          text: "You'll pass. I'm sure you will, so please don't worry."
        - id: ch03-b08
          speaker: anne_shirley
          text: "I'd rather fail completely than pass without placing near the top."
        - id: ch03-b09
          speaker: narrator
          text: "Diana understood exactly what Anne meant. To Anne, success would taste bitter and incomplete if Gilbert finished ahead of her. Both of them had strained every nerve during the examinations. A dozen times, they had passed each other on the street without the smallest sign of recognition. Each time, Anne lifted her head a little higher. She wished more strongly that she had accepted Gilbert's offer of friendship when he made it, and she became more determined to beat him in the examinations."
        - id: ch03-b10
          speaker: narrator
          text: "Every junior student in Avonlea was wondering which of them would place first. Anne even knew that Jimmy Glover and Ned Wright had made a bet on the answer. Josie Pye had declared there was no doubt in the world that Gilbert would win. With all of Avonlea watching, Anne felt the humiliation of losing would be unbearable."
        - id: ch03-b11
          speaker: narrator
          text: "But Anne had another, nobler reason to do well. She wanted a high place for Matthew and Marilla, especially Matthew. He had told her that he was sure she would beat the whole Island. Anne knew it was foolish to hope for that, even in her wildest dreams. Still, she longed with all her heart to finish among the first ten. Then she could see Matthew's kind brown eyes shine with pride in what she had done. That would be a sweet reward for all her hard work and all those patient hours spent digging through dull equations and conjugations."
        - id: ch03-b12
          speaker: narrator
          text: "At the end of two weeks, Anne began haunting the post office too. Jane, Ruby, and Josie went with her. Their hands shook as they opened the Charlottetown papers, and their hearts seemed to sink just as they had during examination week. Charlie and Gilbert came as well. Only Moody Spurgeon stayed firmly away."
        - id: ch03-b13
          speaker: moody_spurgeon
          text: "I don't have the courage to walk in there and calmly search a newspaper. I'll wait until someone finds me and tells me all at once whether I passed."
        - id: ch03-b14
          speaker: narrator
          text: "Three weeks passed, and still there was no list. Anne felt she truly could not endure the strain much longer. She lost her appetite, and all the everyday news of Avonlea stopped interesting her. Mrs. Lynde wanted to know what else anyone could expect with a Tory superintendent of education in charge. Matthew noticed Anne's pale face, her lack of interest, and the slow steps that carried her home from the post office each afternoon. He began seriously wondering if he ought to vote Grit at the next election."
    - id: ch04
      title: The Pass List Is Out
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: "Then, one evening, the news arrived. Anne sat at her open window and, for a while, forgot examinations and every other care. She breathed in the summer dusk. The garden below smelled sweet with flowers, and the poplars whispered and rustled. Above the firs, the eastern sky glowed faintly pink with light from the west. Anne was wondering whether the spirit of color might look like that when Diana came flying through the firs, over the log bridge, and up the slope. A newspaper fluttered in her hand."
        - id: ch04-b02
          speaker: narrator
          text: "Anne jumped to her feet. She knew at once what the paper held. The pass list was out. Her head spun, and her heart pounded so hard it hurt. She could not take a single step toward Diana. It seemed to take an hour for her friend to cross the distance. Then Diana raced down the hall and burst into the room without even knocking, far too excited to remember."
        - id: ch04-b03
          speaker: diana_barry
          text: "Anne, you passed! You came first. You and Gilbert tied, but your name is above his. Oh, I'm so proud of you!"
          emotion: happy
        - id: ch04-b04
          speaker: narrator
          text: "Diana threw the paper onto the table and herself onto Anne's bed. She was too breathless to say another word. Anne tried to light the lamp. Her shaking hands knocked over the match safe, and she used half a dozen matches before she succeeded. Then she seized the paper and looked for herself. Yes, she had passed. There was Anne Shirley at the very top of a list of two hundred names. That moment was worth living for."
        - id: ch04-b05
          speaker: diana_barry
          text: "You did splendidly, Anne! Father brought the paper from Bright River less than ten minutes ago. It arrived on the afternoon train, so it won't reach our post office until tomorrow. The moment I saw the list, I ran over here like a wild thing. Every one of you passed, even Moody, though he has to make up history. Jane and Ruby are about halfway up, and Charlie did well too. Josie passed by only three marks, but she'll act as if she came first. Won't Miss Stacy be delighted? Anne, you haven't said one word. You're just sitting there with stars in your eyes."
          emotion: happy
        - id: ch04-b06
          speaker: diana_barry
          text: "What does it feel like to see your name at the head of a list like that? I'd go wild with happiness. I'm almost wild now, and you're as cool and quiet as a spring evening."
        - id: ch04-b07
          speaker: anne_shirley
          text: "Inside, I'm completely dazzled. I have a hundred things to say, but I can't find the words. I never dreamed this would happen. Well, I did once. Just once, I let myself wonder, what if I came first? Even thinking it made me tremble. It seemed vain to imagine I could lead the Island. Excuse me for a moment, Diana. I have to run to the field and tell Matthew. After that, we'll go up the road and share the news with everyone else."
          emotion: happy
        - id: ch04-b08
          speaker: narrator
          text: "They hurried to the hayfield below the barn, where Matthew was coiling hay. As luck would have it, Mrs. Lynde stood at the lane fence talking to Marilla."
        - id: ch04-b09
          speaker: anne_shirley
          text: "Oh, Matthew, I passed! I'm first, or tied for first. I don't mean to be vain. I'm thankful."
          emotion: happy
        - id: ch04-b10
          speaker: matthew_cuthbert
          text: "Well now, I've always said you could do it. I knew you'd beat them all easily."
          emotion: happy
        - id: ch04-b11
          speaker: marilla_cuthbert
          text: "I must say, you've done very well, Anne."
        - id: ch04-b12
          speaker: narrator
          text: "Marilla tried to hide her enormous pride from Mrs. Rachel's sharp eye, but Mrs. Lynde had no wish to hide hers."
        - id: ch04-b13
          speaker: rachel_lynde
          text: "She certainly has done well, and I'm happy to say so. Anne, you're a credit to all your friends. Every one of us is proud of you."
          emotion: happy
        - id: ch04-b14
          speaker: narrator
          text: "Anne ended that wonderful evening with a serious little talk with Mrs. Allan at the manse. Later, she knelt beside her open window in a wide pool of moonlight. Her prayer came straight from her heart. She gave thanks for everything that had brought her to this night, and she asked reverently for guidance in the future. When she finally slept on her white pillow, her dreams were as fair, bright, and beautiful as any young girl could wish."
