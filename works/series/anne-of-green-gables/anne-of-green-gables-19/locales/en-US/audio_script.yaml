  chapters:
    - id: ch01
      title: Five Flashes at the Window
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: "One February evening, Anne came racing down from the east gable, quite out of breath."
        - id: ch01-b02
          speaker: anne_shirley
          text: "Marilla, may I run over to Diana's for just one minute?"
        - id: ch01-b03
          speaker: marilla_cuthbert
          text: "Why do you need to go wandering around after dark? You walked home from school with Diana. Then you stood in the snow talking for another half hour. I don't see how you can need to see her again already."
        - id: ch01-b04
          speaker: anne_shirley
          text: "But Diana needs to see me. She has something terribly important to tell me."
        - id: ch01-b05
          speaker: marilla_cuthbert
          text: "And how could you possibly know that?"
        - id: ch01-b06
          speaker: anne_shirley
          text: "She signaled from her window. We put a candle on the sill and pass cardboard in front of it to make flashes. Each number means something different. I thought of the whole system myself."
        - id: ch01-b07
          speaker: marilla_cuthbert
          text: "I don't doubt that. Next thing I know, you'll burn the curtains down with this signaling foolishness."
        - id: ch01-b08
          speaker: anne_shirley
          text: "We're very careful, and it's fascinating. Two flashes ask if you're there. Three mean yes, and four mean no. Five mean, 'Come as soon as you can. I have something important to tell you.' Diana flashed five times, Marilla. I can hardly stand not knowing."
        - id: ch01-b09
          speaker: marilla_cuthbert
          text: "Then you can stop suffering. Go, but be home in exactly ten minutes."
        - id: ch01-b10
          speaker: narrator
          text: "Anne remembered the limit and came back on time. No one will ever know what it cost her to squeeze Diana's important news into ten short minutes. Still, she had made excellent use of every second, and she rushed in ready to tell Marilla all of it."
        - id: ch01-b11
          speaker: anne_shirley
          text: "Oh, Marilla, just think! Tomorrow is Diana's birthday. Mrs. Barry says I may go home with Diana after school and spend the night. Her cousins are coming from Newbridge in a big pung sleigh for the Debating Club concert. They'll take us too, if you'll let me go. You will, won't you? I'm so excited!"
          emotion: happy
        - id: ch01-b12
          speaker: marilla_cuthbert
          text: "You can settle down, because you're not going. You belong in your own bed. And that club concert is foolishness. Little girls shouldn't be out at places like that."
        - id: ch01-b13
          speaker: anne_shirley
          text: "But the Debating Club is perfectly respectable."
        - id: ch01-b14
          speaker: marilla_cuthbert
          text: "I didn't say it wasn't. But you're not starting a habit of running off to concerts and staying out half the night. I'm surprised Mrs. Barry is letting Diana go."
        - id: ch01-b15
          speaker: anne_shirley
          text: "This is a special occasion. Diana gets only one birthday a year. Prissy Andrews is going to recite 'Curfew Must Not Ring Tonight.' It's such a moral piece that hearing it must do me good. The choir will sing four sad, beautiful songs that are almost hymns. Even the minister is giving an address, and that's practically a sermon. Please, Marilla, can't I go?"
          emotion: sad
        - id: ch01-b16
          speaker: marilla_cuthbert
          text: "You heard my answer. Take off your boots and go to bed. It's after eight."
        - id: ch01-b17
          speaker: anne_shirley
          text: "There's one last thing. Mrs. Barry said Diana and I could sleep in the spare-room bed. Just imagine your little Anne being given such an honor."
        - id: ch01-b18
          speaker: marilla_cuthbert
          text: "You'll have to live without that honor. Go upstairs, and I don't want another word."
        - id: ch01-b19
          speaker: narrator
          text: "Anne went upstairs with tears rolling down her cheeks. Matthew had seemed sound asleep on the lounge through the whole conversation. Now he opened his eyes."
        - id: ch01-b20
          speaker: matthew_cuthbert
          text: "Well now, Marilla, I think you should let Anne go."
        - id: ch01-b21
          speaker: marilla_cuthbert
          text: "I don't. Which one of us is raising this child, Matthew? You or me?"
        - id: ch01-b22
          speaker: matthew_cuthbert
          text: "Well now, you are."
        - id: ch01-b23
          speaker: marilla_cuthbert
          text: "Then don't interfere."
        - id: ch01-b24
          speaker: matthew_cuthbert
          text: "I'm not interfering. A man can have his own opinion, and mine is that Anne should go."
        - id: ch01-b25
          speaker: marilla_cuthbert
          text: "You'd send her to the moon if she asked. I might allow the visit, but I don't approve of that concert. She'll catch cold coming out of the hot hall, fill her head with excitement, and be unsettled for a week. I know Anne and what is good for her better than you do."
        - id: ch01-b26
          speaker: matthew_cuthbert
          text: "I still think you should let her go."
        - id: ch01-b27
          speaker: narrator
          text: "Matthew repeated his opinion with quiet firmness. Building an argument was not his gift, but once he had formed an opinion, he could hold on to it forever. Marilla gave a helpless gasp and escaped into silence. Yet Matthew had not finished. The next morning, Anne was washing the breakfast dishes in the pantry when he paused on his way out to the barn and tried once more."
        - id: ch01-b28
          speaker: matthew_cuthbert
          text: "I think Anne should go, Marilla."
        - id: ch01-b29
          speaker: narrator
          text: "For one moment, Marilla's face said things too fierce to repeat. Then she gave in."
        - id: ch01-b30
          speaker: marilla_cuthbert
          text: "All right. She may go, since nothing else will satisfy you."
        - id: ch01-b31
          speaker: narrator
          text: "Anne flew out of the pantry with the wet dishcloth still in her hand."
        - id: ch01-b32
          speaker: anne_shirley
          text: "Oh, Marilla! Please say those wonderful words again!"
          emotion: happy
        - id: ch01-b33
          speaker: marilla_cuthbert
          text: "Once is enough. This is Matthew's doing, and I'm taking no responsibility for it. If you catch pneumonia in a strange bed or outside that hot hall at midnight, blame him. Anne Shirley, you're dripping greasy dishwater all over my floor. I never saw such carelessness."
        - id: ch01-b34
          speaker: anne_shirley
          text: "I know I'm a great trial, Marilla. I make so many mistakes. But think how many mistakes I might make and don't. I'll scrub those spots with sand before school. Oh, my heart was set on that concert. I've never been to one, and I feel so left out when the other girls talk about them. You didn't know how that felt, but Matthew did. He understands me. It's wonderful to be understood."
        - id: ch01-b35
          speaker: narrator
          text: "Anne was much too excited to do herself justice at school that morning. Gilbert Blythe outspelled her in class and left her far behind in mental arithmetic. On any ordinary day, such a defeat would have deeply humiliated her. But the concert and the spare-room bed were waiting ahead, so even Gilbert's victories could not spoil her happiness. She and Diana talked about the evening almost without stopping. Under a stricter teacher than Mr. Phillips, the two of them would certainly have landed in serious disgrace."
        - id: ch01-b36
          speaker: narrator
          text: "Anne could hardly have endured the school day if she had been forbidden to go, because everyone talked of nothing but the concert. The Debating Club met every two weeks through the winter and had already given several small entertainments for free. This one would be different. It was the grand affair, with admission set at ten cents to raise money for the library. Avonlea's young people had practiced for weeks. The students were especially interested because so many older brothers and sisters would be performing. Everyone at school over nine years old expected to be there. Everyone, that is, except Carrie Sloane. Her father shared Marilla's ideas about young girls attending concerts at night. Carrie wept into her grammar book all afternoon and felt that life was not worth living."
    - id: ch02
      title: A Night of Thrills
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: "For Anne, the real excitement began the moment school ended. From there it rose higher and higher, until it burst into pure joy at the concert itself. First came a tea that Anne considered perfectly elegant. Then came the delicious business of dressing in Diana's little upstairs room. Diana arranged the front of Anne's hair in the fashionable new pompadour style. Anne tied Diana's bows with the special touch she had for making them sit just right. They experimented with one arrangement after another for the hair at the back of their heads, trying at least half a dozen before they could be satisfied. At last they stood ready, both with scarlet cheeks and eyes glowing from excitement."
        - id: ch02-b02
          speaker: narrator
          text: "Anne could not help one small pang when she compared their clothes. Diana had a jaunty fur cap and a smart little jacket. Anne wore a plain black tam and a shapeless homemade coat of gray cloth, with sleeves that felt much too tight. For a moment, the difference hurt. Then Anne remembered in time that she possessed an imagination. Whatever her real coat looked like, her imagination could make the evening beautiful, and she put that faithful gift to work."
        - id: ch02-b03
          speaker: narrator
          text: "Soon Diana's cousins, the Murrays from Newbridge, arrived in the big pung sleigh. Everyone crowded in among the straw and furry robes, and they set off for the hall. Anne reveled in every moment of that drive. The runners slipped over roads as smooth as satin, while crisp snow sang beneath them. A magnificent sunset burned across the sky. Around its splendor, the snowy hills and deep-blue water of the Gulf of St. Lawrence formed a vast bowl of pearl and sapphire, filled to the brim with wine and fire. From every direction came the delicate tinkle of sleigh bells and bursts of faraway laughter. To Anne, the laughter sounded like the merriment of wood elves hidden in the winter evening."
        - id: ch02-b04
          speaker: anne_shirley
          text: "Oh, Diana, isn't this exactly like a beautiful dream? Do I look the same as I always do? I feel so different inside that it seems as though everyone ought to see it on my face."
          emotion: happy
        - id: ch02-b05
          speaker: diana_barry
          text: "You look awfully nice. Your cheeks have the loveliest color."
        - id: ch02-b06
          speaker: narrator
          text: "One of Diana's cousins had just complimented her, so Diana felt it was only right to pass one along."
        - id: ch02-b07
          speaker: narrator
          text: "That night's program became a whole series of thrills for Anne. As she later told Diana, every new thrill was even more thrilling than the one before it. Prissy Andrews appeared in a new pink silk waist, with a string of pearls around her smooth white throat and real carnations tucked into her hair. A whisper had gone through Avonlea that Mr. Phillips sent all the way to town for those flowers. When Prissy reached the part in her recitation where she climbed a slimy ladder with not one ray of light around her, Anne shivered in luxurious sympathy. Later, the choir sang 'Far Above the Gentle Daisies.' Anne lifted her eyes to the ceiling and gazed as though it had been painted all over with angels."
        - id: ch02-b08
          speaker: narrator
          text: "Then Sam Sloane explained and acted out 'How Sockery Set a Hen.' The selection was rather worn out, even by Avonlea standards. Anne laughed so freely that the people sitting near her began to laugh too, more because her delight was catching than because Sam's performance was funny. Mr. Phillips followed with Mark Antony's speech over the dead body of Caesar. He delivered it in the most heart-stirring tones he could manage, looking toward Prissy Andrews at the end of every sentence. By the time he finished, Anne felt she could leap to her feet and begin a mutiny on the spot, if only one Roman citizen would step forward to lead her."
        - id: ch02-b09
          speaker: narrator
          text: "Only one performance failed to interest her. Gilbert Blythe stood to recite 'Bingen on the Rhine.' Anne opened Rhoda Murray's library book and read until he finished. Then she sat stiff and still while Diana clapped until her hands tingled."
    - id: ch03
      title: The Catastrophe in the Spare Room
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: "It was eleven o'clock when they reached home. Anne and Diana had enjoyed as much excitement as two girls could wish for, but the sweetest pleasure was still ahead. They could talk over every part of the evening together. Everyone in the house seemed to be asleep. The rooms were dark and perfectly quiet. The girls tiptoed into the parlor, a long, narrow room with the spare-room door opening from it. The last embers of a fire glowed in the grate, giving the room a pleasant warmth and a dim light."
        - id: ch03-b02
          speaker: diana_barry
          text: "Let's change our clothes in here. It's so warm."
        - id: ch03-b03
          speaker: anne_shirley
          text: "Wasn't it a glorious evening? Imagine standing up there and reciting. Do you think they'll ever ask us, Diana?"
        - id: ch03-b04
          speaker: diana_barry
          text: "Of course they will, once we're among the older students. They always need reciters. Gilbert performs often, and he's only two years older. Anne, how could you act as if you didn't hear him? When he said, 'There's another, not a sister,' he looked straight at you."
        - id: ch03-b05
          speaker: anne_shirley
          text: "Diana, you are my dearest friend, but even you may not speak to me about that person. Are you ready? Let's race and see who reaches the bed first."
        - id: ch03-b06
          speaker: narrator
          text: "The suggestion appealed to Diana at once. The two small figures in white flew down the length of the parlor, rushed through the spare-room doorway, and bounded onto the bed at exactly the same moment. Then something moved beneath them. A gasp came from under the covers, followed by a cry. A muffled voice spoke from the darkness."
        - id: ch03-b07
          speaker: miss_josephine_barry
          text: "Merciful goodness!"
          emotion: surprised
        - id: ch03-b08
          speaker: narrator
          text: "Anne and Diana could never explain afterward how they got off that bed or out of the spare room. The moments between the muffled cry and their escape vanished completely from both their memories. They only knew that after one frantic rush they found themselves upstairs. There they stood on tiptoe, shivering from cold and fright."
        - id: ch03-b09
          speaker: anne_shirley
          text: "Who was that? What was under the covers?"
          emotion: fearful
        - id: ch03-b10
          speaker: diana_barry
          text: "It was Aunt Josephine! Oh, Anne, how did she get there? She'll be furious. This is dreadful, truly dreadful. But have you ever known anything so funny?"
        - id: ch03-b11
          speaker: anne_shirley
          text: "Who is Aunt Josephine?"
        - id: ch03-b12
          speaker: diana_barry
          text: "She's Father's aunt from Charlottetown. She's terribly old, at least seventy, and I don't believe she was ever a little girl. We expected her to visit, but not yet. She's very prim and proper, and she'll scold us horribly. We'll have to sleep with Minnie May now, and she kicks more than you can imagine."
        - id: ch03-b13
          speaker: narrator
          text: "Miss Josephine Barry did not come down for the early breakfast. Mrs. Barry smiled kindly at the girls."
        - id: ch03-b14
          speaker: mrs_barry
          text: "Did you enjoy yourselves last night? I meant to stay awake and tell you Aunt Josephine had arrived, so you would need to sleep upstairs. But I was tired and fell asleep. I hope you didn't disturb her, Diana."
        - id: ch03-b15
          speaker: narrator
          text: "Diana wisely kept silent. Across the breakfast table, she and Anne exchanged secret smiles filled with guilt and amusement. Anne hurried home as soon as the meal was over. She remained happily unaware of the disturbance that soon shook the Barry household. She learned nothing about it until late that afternoon, when Marilla sent her down to Mrs. Lynde's on an errand."
    - id: ch04
      title: Anne Takes the Blame
      blocks:
        - id: ch04-b01
          speaker: mrs_lynde
          text: "So you and Diana nearly scared poor old Miss Barry to death last night? Mrs. Barry stopped here on her way to Carmody, and she's terribly worried. Josephine Barry woke in a dreadful temper, and her temper is no small matter. She won't speak to Diana at all."
        - id: ch04-b02
          speaker: anne_shirley
          text: "It wasn't Diana's fault. I was the one who suggested the race to the bed."
          emotion: sad
        - id: ch04-b03
          speaker: mrs_lynde
          text: "I knew it! I knew that idea came from your head. And now you've caused a fine amount of trouble. Miss Barry came intending to stay for a month. Instead, she declares she won't remain another day and plans to return to town tomorrow, Sunday or not. She would have left today if the family had been able to take her. She had promised to pay for a whole quarter of Diana's music lessons. Now she is determined to do nothing at all for a girl she considers a tomboy. I expect they had a lively time at Orchard Slope this morning. The Barrys are upset. Miss Barry is rich, and they would naturally rather stay on her good side. Mrs. Barry didn't put it in those words when she visited, but I'm a good judge of human nature."
        - id: ch04-b04
          speaker: anne_shirley
          text: "Why am I so unlucky, Mrs. Lynde? I keep falling into scrapes, and then I pull my best friends into them too. These are people I'd give my heart's blood for. Why does it always happen?"
          emotion: sad
        - id: ch04-b05
          speaker: mrs_lynde
          text: "Because you're careless and impulsive. You never pause to think. The moment an idea comes, you say it or do it."
        - id: ch04-b06
          speaker: anne_shirley
          text: "But that's what makes an idea wonderful. It flashes into your mind and feels so exciting that you have to let it out. If you stop and think, the whole thing is spoiled. Haven't you ever felt that way?"
        - id: ch04-b07
          speaker: narrator
          text: "Mrs. Lynde had not. She shook her head with great wisdom."
        - id: ch04-b08
          speaker: mrs_lynde
          text: "You must learn to think first. The saying you need is, 'Look before you leap.' Especially before you leap into a spare-room bed."
        - id: ch04-b09
          speaker: narrator
          text: "Mrs. Lynde laughed comfortably at her own small joke, but Anne remained thoughtful. She could see nothing funny in the situation. To her eyes, the trouble at Orchard Slope had become very serious indeed. When she left Mrs. Lynde's house, she chose the path across the hard-crusted fields. Diana was waiting and met her at the kitchen door."
        - id: ch04-b10
          speaker: anne_shirley
          text: "Was your aunt terribly angry?"
        - id: ch04-b11
          speaker: diana_barry
          text: "Yes. She was almost dancing with rage. You should have heard her scold. She called me the worst-behaved girl she'd ever met and said my parents ought to be ashamed of how they raised me. She refuses to stay. I don't care about that, but Mother and Father do."
        - id: ch04-b12
          speaker: anne_shirley
          text: "Why didn't you tell them the idea was mine?"
        - id: ch04-b13
          speaker: diana_barry
          text: "As if I would do that! I'm not a tattletale, Anne Shirley. Besides, I did just as much jumping as you."
        - id: ch04-b14
          speaker: anne_shirley
          text: "Then I'll go in and tell her myself."
        - id: ch04-b15
          speaker: narrator
          text: "Diana stared at her."
        - id: ch04-b16
          speaker: diana_barry
          text: "Anne Shirley, you can't mean it. Why, she'll eat you alive!"
          emotion: surprised
        - id: ch04-b17
          speaker: anne_shirley
          text: "Please don't make me more frightened than I already am. I'd rather walk toward a cannon. But I have to do this. It was my idea, so I must confess. Fortunately, I've had plenty of practice confessing."
          emotion: fearful
        - id: ch04-b18
          speaker: diana_barry
          text: "She's in the sitting room. Go in if you want. I wouldn't dare, and I don't think it will help at all."
        - id: ch04-b19
          speaker: narrator
          text: "Encouraged in this doubtful fashion, Anne went to face the lion in her den. She crossed to the closed sitting-room door with all the determination she could gather. Her feet carried her there firmly enough, but when she raised her hand, the knock she gave was very faint. A sharp voice answered at once."
        - id: ch04-b20
          speaker: miss_josephine_barry
          text: "Come in."
        - id: ch04-b21
          speaker: narrator
          text: "Miss Josephine Barry sat beside the fire. She was thin, prim, and rigid, and she drove her knitting needles along as fiercely as if the yarn itself had offended her. Her anger had not cooled at all. Her eyes snapped behind their gold-rimmed glasses. She swung around in her chair, plainly expecting to see Diana. Instead, she found a white-faced little girl whose great eyes were filled with a strange mixture of shrinking terror and desperate courage."
        - id: ch04-b22
          speaker: miss_josephine_barry
          text: "Who are you?"
        - id: ch04-b23
          speaker: anne_shirley
          text: "I'm Anne from Green Gables, and I've come to confess, if you please."
          emotion: fearful
        - id: ch04-b24
          speaker: miss_josephine_barry
          text: "Confess to what?"
        - id: ch04-b25
          speaker: anne_shirley
          text: "Jumping on you was my fault. I suggested the race. Diana would never have thought of it by herself. She is a very ladylike girl, Miss Barry, so it isn't fair to blame her."
        - id: ch04-b26
          speaker: miss_josephine_barry
          text: "Oh, isn't it? Diana certainly did her share of the jumping. Such behavior in a respectable home!"
          emotion: angry
        - id: ch04-b27
          speaker: anne_shirley
          text: "We only meant to have fun. Now that we've apologized, I do think you should forgive us. At least forgive Diana and let her have her music lessons. She wants them with all her heart, and I know what it's like to want something that much and lose it. If someone must be angry, choose me. People were cross with me so often when I was younger that I can bear it better than Diana."
        - id: ch04-b28
          speaker: narrator
          text: "As Anne spoke, much of the sharpness left the old lady's eyes. It was slowly replaced by a sparkle of amused interest. Miss Barry was no longer quite as angry as she looked, but she kept her voice stern."
        - id: ch04-b29
          speaker: miss_josephine_barry
          text: "Having fun is no excuse. Girls never behaved that way when I was young. You have no idea what it's like to finish a long, exhausting journey, fall sound asleep, and wake when two great girls come crashing down on top of you."
        - id: ch04-b30
          speaker: anne_shirley
          text: "I don't know, but I can imagine. It must have been terribly upsetting. Still, we have a side too. Could you imagine being us for a moment, Miss Barry? We had no idea anyone was in that bed. You frightened us nearly to death. It was awful. Then we lost the chance to sleep in the spare room after we'd been promised. Perhaps spare rooms are ordinary to you. But imagine being a little orphan girl who had never been given such an honor before."
        - id: ch04-b31
          speaker: narrator
          text: "By the time Anne finished, every trace of the old lady's anger had gone. Miss Barry actually laughed. Diana was waiting outside in the kitchen, silent with anxiety and listening for any sound from the sitting room. When she heard her aunt's laugh, she gave a great gasp of relief."
        - id: ch04-b32
          speaker: miss_josephine_barry
          text: "My imagination may be rusty. It has been a long time since I used it. Perhaps your claim to sympathy is as good as mine. It depends on which side you see. Come sit here and tell me about yourself."
        - id: ch04-b33
          speaker: anne_shirley
          text: "I'm very sorry, but I can't. I would enjoy it because you seem interesting, and you might even be a kindred spirit, though you don't look much like one. But I must go home to Miss Marilla Cuthbert. She is a very kind lady who took me in and is trying to raise me properly. The work is discouraging, so please don't blame her because I jumped on the bed. Before I leave, will you forgive Diana and stay in Avonlea as long as you planned?"
        - id: ch04-b34
          speaker: miss_josephine_barry
          text: "I believe I might, if you promise to visit and talk with me sometimes."
    - id: ch05
      title: A Kindred Spirit After All
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: "That evening, Miss Barry gave Diana a silver bangle bracelet. Then she told the grown members of the family that she had unpacked her valise."
        - id: ch05-b02
          speaker: miss_josephine_barry
          text: "I've decided to stay so I can know that Anne-girl better. She amuses me, and at my age, amusing people are rare."
        - id: ch05-b03
          speaker: narrator
          text: "When Marilla heard the story, she had only one comment, and it was meant for Matthew."
        - id: ch05-b04
          speaker: marilla_cuthbert
          text: "I told you so."
        - id: ch05-b05
          speaker: narrator
          text: "Miss Barry stayed for the whole month she had planned, and then stayed beyond it. She was a more agreeable guest than usual because Anne kept her in good humor. Anne visited and talked with her, just as she had promised. Before long, the unlikely pair became firm friends. At last Miss Barry prepared to leave Avonlea. Before she went away, she made Anne a promise."
        - id: ch05-b06
          speaker: miss_josephine_barry
          text: "Remember this, Anne-girl. When you visit town, you are coming to see me. And I'll let you sleep in my very sparest spare-room bed."
        - id: ch05-b07
          speaker: anne_shirley
          text: "Miss Barry really was a kindred spirit, Marilla. You wouldn't guess by looking at her. Sometimes you know at once, the way I did with Matthew. Other times it takes a while. I don't believe kindred spirits are as rare as I once thought. Isn't it splendid to discover there are so many in the world?"
