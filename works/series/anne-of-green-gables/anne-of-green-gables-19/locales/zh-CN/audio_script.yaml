audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖机智，叙事细腻而自然
        timbre: 清澈柔和的成年女声
        pace: 从容，随情节轻快变化
        pitch: 中音
    anne:
      display_name: 安妮
      tts:
        delivery: 想象丰富，热烈真挚，情绪来得快而鲜明
        timbre: 清亮灵动的少女声
        pace: 偏快，动情时一气呵成
        pitch: 中高音
    diana:
      display_name: 戴安娜
      tts:
        delivery: 诚恳温柔，朴实中带着少女的羞怯
        timbre: 柔润甜美的少女声
        pace: 适中
        pitch: 中高音
    marilla:
      display_name: 玛丽拉
      tts:
        delivery: 务实克制，话语干脆，偶尔透出藏起的温情
        timbre: 稳重略低的成年女声
        pace: 稍慢而利落
        pitch: 中低音
    matthew:
      display_name: 马修
      tts:
        delivery: 温厚迟缓，说话犹豫而真诚
        timbre: 低沉柔和
        pace: 舒缓
        pitch: 中低音
    josephine:
      display_name: 约瑟芬·巴里小姐
      tts:
        delivery: 古板犀利，阅历深厚，兴味来时藏不住幽默
        timbre: 清脆偏薄的老年女声
        pace: 稍慢而有力
        pitch: 中音
    mrs_barry:
      display_name: 巴里太太
      tts:
        delivery: 端庄和善，说话周全自然
        timbre: 柔和稳重的成年女声
        pace: 适中
        pitch: 中音
    mrs_lynde:
      display_name: 林德太太
      tts:
        delivery: 直率笃定，爱下判断，严厉中带着诙谐
        timbre: 洪亮结实的成年女声
        pace: 稍快
        pitch: 中音
  chapters:
    - id: ch01
      title: 第十九章　一场音乐会、一场灾祸和一次忏悔
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 二月里一个晚上，安妮从东山墙房间一路跑下来，累得直喘气。她只想去戴安娜家待一小会儿，玛丽拉却不明白，天都黑了，她还有什么非去不可的理由。两个姑娘刚一起放学，回家以后又站在雪里足足聊了半个钟头。那两张嘴从头到尾叽叽喳喳，没有停过一刻。在玛丽拉看来，安妮怎么也不至于这么快又非见戴安娜不可。
        - id: ch01-b02
          speaker: anne
          text: 可这回是戴安娜想见我。她一定有非常重要的事要说。
        - id: ch01-b03
          speaker: marilla
          text: 你怎么会知道？
        - id: ch01-b04
          speaker: anne
          text: 她刚从窗口给我打了信号。我们把蜡烛放在窗台上，再用硬纸板挡住烛光。闪不同的次数，就代表不同的话。这个办法是我想出来的。
        - id: ch01-b05
          speaker: marilla
          text: 我一猜就是。照这样下去，你们迟早会拿这套蠢信号把窗帘点着。
        - id: ch01-b06
          speaker: anne
          text: 我们真的很小心，而且好玩极了。两下是问“你在吗”，三下是“在”，四下是“不在”。五下就是“快过来，我有要紧的事告诉你”。她刚刚闪了五下。我不知道是什么事，心里难受得不得了。
        - id: ch01-b07
          speaker: marilla
          text: 那你不必再难受了。去吧，不过十分钟内必须回来。
        - id: ch01-b08
          speaker: narrator
          text: 安妮记住了玛丽拉的话，果真在十分钟内赶回绿山墙。世上大概没有人能知道，让她把戴安娜那件重大消息的讨论硬塞进十分钟里，究竟付出了多大代价。她一定还有许多话没来得及说。不过，那短短十分钟里的每一分每一秒，她都用得十分充分。
        - id: ch01-b09
          speaker: anne
          text: 玛丽拉，你猜是什么事？明天是戴安娜的生日！巴里太太准许我放学后跟她回家，还能在那里住一晚。她那些住在新桥镇的表兄弟姐妹会坐一辆大平底雪橇过来。他们要去礼堂听明晚辩论会办的音乐会，还会带上戴安娜和我。当然，得先有你的准许。你会答应的，对不对？我真是兴奋极了。
        - id: ch01-b10
          speaker: marilla
          text: 那就赶快平静下来，因为你不能去。你应该睡在自己家里。那种音乐会也是胡闹，小姑娘根本不该晚上往那里跑。
        - id: ch01-b11
          speaker: anne
          text: 辩论会一定是很正经的团体呀。
        - id: ch01-b12
          speaker: marilla
          text: 我没说它不正经。可我不能让你从此到处听音乐会，半夜还不回家。巴里太太肯让戴安娜去，我已经够吃惊了。
        - id: ch01-b13
          speaker: anne
          text: 可这是特别的日子。戴安娜一年只有一次生日，生日又不是常常都有的。普里西·安德鲁斯要朗诵《今夜钟声不得鸣响》。那么有教益的作品，我听了准会得到许多好处。唱诗班还要唱四首优美动人的悲歌，差不多和赞美诗一样好。还有，牧师也会参加。真的，他会发表演讲。那几乎和听一次布道没有分别。玛丽拉，求你让我去吧。
          emotion: sad
        - id: ch01-b14
          speaker: marilla
          text: 我的话你已经听见了。脱掉靴子，上床去。都过八点了。
        - id: ch01-b15
          speaker: anne
          text: 我只再说最后一件事。巴里太太答应让我们睡客房里的床。你想想，你的小安妮被请去睡客房，该是多大的荣幸。
        - id: ch01-b16
          speaker: marilla
          text: 这份荣幸你得放弃了。去睡觉，别再说了。
        - id: ch01-b17
          speaker: narrator
          text: 安妮的眼泪顺着脸颊滚下来。她伤心地上了楼。刚才整段谈话里，马修仿佛一直躺在沙发上熟睡，这时却忽然睁开眼睛，坚决表示应该让安妮去。玛丽拉立刻问他，这孩子究竟是谁在管教。马修老实承认是玛丽拉。玛丽拉便叫他别插手。可马修认为，一个人有自己的意见并不算插手，而他的意见并没有改变。
        - id: ch01-b18
          speaker: matthew
          text: 这个嘛，我还是觉得，你应该让安妮去。
        - id: ch01-b19
          speaker: marilla
          text: 只要她忽然动了念头，哪怕她想去月亮上，你大概也会答应。我或许肯让她在戴安娜家住一晚，可音乐会不行。她到了那里，多半会染上感冒，还会装回满脑子的胡思乱想和兴奋劲儿。接下来整整一个星期，她都安静不了。我比你更懂这个孩子是什么性情，也更清楚什么对她有好处。
        - id: ch01-b20
          speaker: narrator
          text: 马修不擅长争辩，却最会紧紧守住自己的意见。他把那句话坚定地重复了一遍。玛丽拉无可奈何地吸了口气，只好躲进沉默里。第二天早上，安妮正在食品间清洗早餐用过的碗碟。马修出门去牲口棚，经过玛丽拉身边时停了一下，又把同一句话送到她耳边。
        - id: ch01-b21
          speaker: matthew
          text: 这个嘛，玛丽拉，你应该让安妮去。
        - id: ch01-b22
          speaker: narrator
          text: 玛丽拉的脸色有一瞬间简直没法形容。最后，她还是向无可避免的事投降了。
        - id: ch01-b23
          speaker: marilla
          text: 好吧，她可以去。既然不答应，你就怎么也不会满意。
        - id: ch01-b24
          speaker: narrator
          text: 安妮握着还在滴水的洗碗布，从食品间飞奔出来，请玛丽拉再说一遍那句蒙福的话。
        - id: ch01-b25
          speaker: marilla
          text: 这种话说一遍就够了。这是马修做的主，我可不管。你要是睡了别人家的床，或是半夜从热烘烘的礼堂出来，结果染上肺炎，千万别来怪我。去怪马修。安妮·雪莉，你还拿着那块洗碗布呢。油腻的水已经滴得满地都是了。我从没见过这么粗心的孩子。
        - id: ch01-b26
          speaker: anne
          text: 我知道自己总给你添麻烦，也犯了许多错。可你想想，还有那么多我本来可能犯的错，我都没有犯呢。我会上学前拿些沙子来，把这些水印擦得干干净净。我一心盼着去听音乐会。我这辈子从来没有听过音乐会。同学们在学校里谈起那些节目，我总觉得自己被落在了外面。你不知道那是什么滋味，马修却知道。马修懂我，玛丽拉。被人懂得的感觉真好。
        - id: ch01-b27
          speaker: narrator
          text: 那天上午，安妮兴奋得没法专心，功课当然也没发挥出真本事。吉尔伯特在拼写课上胜过她，心算时更把她远远甩在后面。换在平时，这份屈辱一定难以忍受。可她一想到音乐会和客房里的床，心里就好过多了。她和戴安娜整天不停地谈这件事。要是老师比菲利普斯先生更严厉一些，她们准会因为讲话遭到可怕的惩罚。
        - id: ch01-b28
          speaker: narrator
          text: 那天全校只谈一件事。安妮觉得，如果自己不能去音乐会，简直连这一天都熬不过去。埃文利辩论会整个冬天每两周聚一次，也办过几场小型的免费演出。这次却是要收十美分门票的大场面，收入会用来资助图书馆。年轻人已经排练了几个星期。学生们的哥哥姐姐又有不少人要上台，所以大家尤其关心。学校里九岁以上的孩子，个个都指望着去。只有卡丽·斯隆去不成。她父亲和玛丽拉想的一样，不赞成小姑娘晚上听音乐会。卡丽整个下午对着语法书流泪，觉得人生再没有活下去的价值。
        - id: ch01-b29
          speaker: narrator
          text: 安妮的兴奋从放学开始，一路越升越高，到了音乐会上，终于变成轰然炸开的狂喜。她们先吃了顿“雅致极了的茶点”，再到戴安娜的小房间里打扮。戴安娜替安妮梳出新式的蓬巴杜发型，安妮帮戴安娜系出最漂亮的蝴蝶结。两人又把脑后的头发换了至少六种梳法。最后，她们红着脸颊，亮着眼睛，总算准备好了。
        - id: ch01-b30
          speaker: narrator
          text: 当然，看看戴安娜俏丽的皮帽和神气的小夹克，再看看自己的朴素黑圆帽，还有那件家里做的灰呢外套，安妮心里还是疼了一下。她的外套没有一点好看的样子，袖子也紧巴巴的。好在她及时想起，自己拥有想象力。遇到这种时候，正好可以把它拿出来用。
        - id: ch01-b31
          speaker: narrator
          text: 新桥镇的默里一家随后到了。所有人挤进那辆大平底雪橇，坐在稻草和厚厚的毛皮毯子之间。安妮一路陶醉，看着雪橇飞快驶向礼堂。道路像缎子一样光滑，滑板压过积雪，发出清脆的碎响。晚霞灿烂，积雪的山峦和圣劳伦斯湾深蓝的海水环绕着这片光辉，像一只珍珠与蓝宝石砌成的大碗，碗里盛满了美酒和火焰。四面八方都响着雪橇铃和远方的笑声，仿佛林中精灵也出来欢闹。
        - id: ch01-b32
          speaker: anne
          text: 戴安娜，这一切像不像一场美丽的梦？我看起来还和平常一样吗？我心里变得这么不同，总觉得脸上也一定看得出来。
        - id: ch01-b33
          speaker: diana
          text: 你好看极了，脸色也特别漂亮。
        - id: ch01-b34
          speaker: narrator
          text: 戴安娜刚从一个表亲那里听来一句赞美，觉得自己也应该把赞美送给别人。至于安妮，那晚的节目在她心里简直是一串接一串的激动，而且后一个总比前一个更加激动。普里西穿着崭新的粉红丝绸上衣，光滑洁白的颈间挂着一串珍珠，头发上还簪着真康乃馨。大家悄悄传说，那些花是菲利普斯先生特意从城里买来送给她的。普里西念到自己“攀上湿滑的梯子，四下漆黑，不见一线光明”，安妮带着一种既满足又投入的同情，跟着她浑身直打哆嗦。
        - id: ch01-b35
          speaker: narrator
          text: 唱诗班唱起《远在温柔的雏菊之上》，安妮一直仰望天花板，仿佛那里真的画满了天使。萨姆·斯隆一边讲解，一边表演《索克里怎样叫母鸡孵蛋》，她笑得附近的人也跟着发笑。其实，那个节目即使在埃文利也已经演旧了。大家发笑，更多是受了安妮的感染。等菲利普斯先生对着恺撒的尸体，用最激动人心的声音朗诵马克·安东尼的演说，而且每念完一句就看普里西一眼，安妮觉得只要有一个罗马公民带头，自己当场就能站起来参加暴动。
        - id: ch01-b36
          speaker: narrator
          text: 整场节目里只有一个环节不能打动她。吉尔伯特·布莱思上台朗诵《莱茵河畔的宾根》，安妮立刻拿起罗达·默里从图书馆借来的书，一直低头读到他全部念完。随后，戴安娜热烈鼓掌，拍得两只手都发麻了。安妮却把身子挺得笔直，僵硬地坐在那里，连动也没有动一下。
        - id: ch01-b37
          speaker: narrator
          text: 十一点，她们才回到家。两人已经玩得心满意足，可还有一种格外甜美的快乐等着她们，那就是把整晚的事从头到尾再谈一遍。屋里的人似乎都睡了，四下一片黑暗和寂静。她们踮着脚走进狭长的客厅。客房的门开在一旁，壁炉里只剩一点暗红的余火，屋子仍旧暖融融的，也有一片朦胧的微光。
        - id: ch01-b38
          speaker: diana
          text: 就在这里脱衣服吧，这里真暖和。
        - id: ch01-b39
          speaker: anne
          text: 今晚多快活呀！站在台上朗诵一定美妙极了。戴安娜，以后会不会也有人请我们登台？
        - id: ch01-b40
          speaker: diana
          text: 当然会，总有一天会的。他们经常请高年级的学生朗诵。吉尔伯特就常常上台，他也只比我们大两岁。安妮，他朗诵时，你怎么能装作没听见？他念到“还有另一个人，却不是姐妹”那一句，低下头，眼睛正直直望着你呢。
        - id: ch01-b41
          speaker: anne
          text: 戴安娜，你是我的知心朋友，可就算是你，也不能在我面前说起那个人。你换好睡衣了吗？我们来比赛，看谁先上床。
        - id: ch01-b42
          speaker: narrator
          text: 戴安娜一听就喜欢上了这个主意。两个穿着白睡衣的小姑娘立刻飞跑起来，越过长长的客厅，冲进客房，又在同一个瞬间蹦上了床。就在身体落下的那一刻，她们身下有什么东西忽然动了。紧接着，床上传出一声喘息，一声惊叫，还有一句闷在被子里的话。
        - id: ch01-b43
          speaker: josephine
          text: 仁慈的老天爷呀！
          emotion: surprised
        - id: ch01-b44
          speaker: narrator
          text: 后来，安妮和戴安娜自己也始终弄不明白，她们究竟是怎么跳下那张床，又怎么冲出客房的。她们只记得自己没命地狂奔了一阵。等回过神来，两个人已经到了楼梯那里，浑身冷得发抖，也吓得发抖，只敢踮着脚悄悄往楼上走。
        - id: ch01-b45
          speaker: anne
          text: 那是谁？不，那到底是什么？
          emotion: fearful
        - id: ch01-b46
          speaker: diana
          text: 是约瑟芬姑婆。真不知道她怎么会睡在那里。她准会气疯的。事情太可怕了，实在太可怕了。可是，安妮，你以前见过这么好笑的事吗？
        - id: ch01-b47
          speaker: anne
          text: 约瑟芬姑婆是谁？
        - id: ch01-b48
          speaker: diana
          text: 她是我父亲的姑妈，住在夏洛特敦。她老得吓人，至少七十岁了。我根本不相信她也当过小女孩。我们知道她要来住些日子，可没想到她来得这么早。她规矩特别大，什么事都要端端正正的，我知道她一定会狠狠骂我们。现在我们只能跟米妮·梅一起睡了。你根本想不到她睡觉时踢人有多厉害。
        - id: ch01-b49
          speaker: narrator
          text: 第二天一早，约瑟芬小姐没有下楼吃早饭。巴里太太还不知道夜里究竟发生了什么，只当两个小姑娘平安睡在客房里，因此照常和善地朝她们笑了笑。
        - id: ch01-b50
          speaker: mrs_barry
          text: 昨晚玩得开心吗？我本想等你们回来，告诉你们约瑟芬姑妈已经到了，你们得去楼上睡。可我实在太累，先睡着了。戴安娜，你们没有吵醒她吧？
        - id: ch01-b51
          speaker: narrator
          text: 戴安娜谨慎地闭紧嘴巴，没有回答，只和安妮隔着桌子偷偷交换了一个心虚又好笑的微笑。安妮吃完早餐便匆匆回了家，所以巴里家接下来闹起的那场风波，她始终幸福地一无所知。直到傍晚，她替玛丽拉办事去了林德太太家，这才听说事情有多严重。
        - id: ch01-b52
          speaker: mrs_lynde
          text: 听说你和戴安娜昨晚差点吓死可怜的巴里老小姐？巴里太太几分钟前才来过，她要去卡莫迪，心里正为这件事发愁。约瑟芬·巴里今早起床时气坏了。她发起脾气可不是玩笑，我可以告诉你。她连一句话都不肯跟戴安娜说。
        - id: ch01-b53
          speaker: anne
          text: 不是戴安娜的错，是我提议比赛，看谁先跳上床。
        - id: ch01-b54
          speaker: mrs_lynde
          text: 我就知道主意出在你这里。现在麻烦可大了。她原本要住一个月，如今连一天都不肯多待，哪怕明天是星期日，也非回城不可。要是今天有人能送，她今天就走了。她还答应过替戴安娜付一个季度的音乐课学费，现在也不肯付了，说自己什么也不会给这样一个野丫头。今早他们家准闹得热火朝天。巴里一家当然难过。她很有钱，他们总想和她好好相处。巴里太太没明说，不过我看人一向很准。
        - id: ch01-b55
          speaker: anne
          text: 我怎么这么不走运？我自己不断闯祸，还总把最好的朋友也拖进来。我愿意为他们流尽心血呀。林德太太，为什么我老是这样？
          emotion: sad
        - id: ch01-b56
          speaker: mrs_lynde
          text: 因为你又粗心又冲动。你从来不停下来想一想。脑子里冒出什么，你立刻就要说，立刻就要做。
        - id: ch01-b57
          speaker: anne
          text: 可那正是最好的地方。一个念头忽然闪进来，叫人兴奋得不得了，当然非说出来不可。停下来想，反而把它毁了。你真的从没这样过吗？
        - id: ch01-b58
          speaker: narrator
          text: 林德太太老成地摇摇头。没有，她从来不曾这样。
        - id: ch01-b59
          speaker: mrs_lynde
          text: 你得学会多想一会儿。最适合你的老话是“三思而后行”。特别是往客房床上跳以前。
        - id: ch01-b60
          speaker: narrator
          text: 林德太太为这个不轻不重的笑话舒舒服服地笑了起来。安妮却仍旧满怀心事，一点也笑不出来。这件事在她眼里实在太严重了。离开林德太太家，她没有回绿山墙，而是踏过一片片冻硬的田地，直接去了果园坡。戴安娜已经等在厨房门口。
        - id: ch01-b61
          speaker: anne
          text: 你姑婆是不是气坏了？
        - id: ch01-b62
          speaker: diana
          text: 是啊。她简直气得跳起舞来，骂得可凶了。她说我是她见过最没规矩的女孩，还说爸爸妈妈把我教成这样，真应该感到羞耻。她说自己一天也不肯再住。我当然一点都不在乎，可爸爸妈妈非常在乎。
        - id: ch01-b63
          speaker: anne
          text: 你为什么不告诉他们，主意是我出的？
        - id: ch01-b64
          speaker: diana
          text: 我怎么可能告密？何况我和你一样有错。
        - id: ch01-b65
          speaker: anne
          text: 那我自己进去告诉她。
        - id: ch01-b66
          speaker: diana
          text: 安妮·雪莉，你不会真的要去吧？她会把你生吞了！
        - id: ch01-b67
          speaker: anne
          text: 别再吓我了。我宁可走到大炮口前，可我必须去。这是我的错，我得忏悔。幸好这种事我已经很有经验了。
          emotion: fearful
        - id: ch01-b68
          speaker: diana
          text: 她就在起居室。你想去就去吧，我可不敢。我也不信你能劝动她。
        - id: ch01-b69
          speaker: narrator
          text: 有了这番鼓励，安妮便去洞穴里面对狮子。也就是说，她鼓起勇气，坚定地走到起居室门前，又轻轻敲了敲门。里面马上响起一句尖利的“进来”。约瑟芬小姐又瘦又古板，腰背挺得笔直。她坐在炉火旁，手里的毛线也织得气势汹汹。她的怒气一点也没消，金边眼镜后面的双眼仍在冒火。她原以为戴安娜来了，猛地转过椅子，却看见一个脸色苍白的小姑娘。那双大眼睛里，拼命鼓起的勇气和退缩的恐惧混在一起，几乎都要满溢出来。
        - id: ch01-b70
          speaker: josephine
          text: 你是谁？
        - id: ch01-b71
          speaker: anne
          text: 我是绿山墙的安妮。如果您肯听，我是来忏悔的。
        - id: ch01-b72
          speaker: josephine
          text: 忏悔什么？
        - id: ch01-b73
          speaker: anne
          text: 昨晚跳到您身上的事，全怪我。是我想出比赛的主意。戴安娜自己绝不会想到这种事，她很有淑女风范。所以，只责怪她是不公平的。
        - id: ch01-b74
          speaker: josephine
          text: 哦，是吗？我看她至少也跳了自己那一份。在正经人家里闹成这样！
          emotion: angry
        - id: ch01-b75
          speaker: anne
          text: 我们真的只是闹着玩。现在我们已经道歉了，我觉得您应该原谅我们。不管怎样，请您原谅戴安娜，也让她继续上音乐课。她一心盼着学音乐。我太明白那种滋味了，一个人特别想要一样东西，却偏偏得不到。您要是非得生谁的气，就生我的气吧。我小时候常常惹人生气，早已经习惯了，所以我比戴安娜更受得住。
        - id: ch01-b76
          speaker: narrator
          text: 安妮说到这里，约瑟芬小姐眼中的怒火已经淡了许多，取而代之的是一点觉得有趣的笑意。她显然开始想听听这个奇特的小姑娘还会说些什么，不过开口时，她的神情和语气依然十分严厉。
        - id: ch01-b77
          speaker: josephine
          text: “闹着玩”不是借口。我小时候，小姑娘从不玩这种把戏。赶了那么远的路，好不容易睡熟，却被两个大姑娘砰地压下来，你不知道那是什么感受。
        - id: ch01-b78
          speaker: anne
          text: 我的确不知道，可我能想象。被这样吵醒一定非常难受。不过，事情也有我们这一面。您有想象力吗？如果有，请把自己放到我们的位置上。我们根本不知道床上有人，您差点把我们吓死。我们当时的感觉真的太可怕了。还有，明明有人答应让我们睡客房，最后却不能睡了。您大概早就习惯睡客房了。可请您想想，要是您是个从来没有享受过这种荣幸的孤儿小姑娘，心里会是什么滋味呢？
        - id: ch01-b79
          speaker: narrator
          text: 这下，约瑟芬小姐眼里最后一点怒火也消失了。她竟真的笑出了声。戴安娜正在外面的厨房里一声不响地等着，急得连气都不敢喘。听见起居室传出笑声，她终于长长松了口气。
        - id: ch01-b80
          speaker: josephine
          text: 我的想象力恐怕已经生锈了，毕竟太久没有用过它。也许你们要求同情的理由，和我的一样充分。事情就是这样，全看我们从哪一面去想。来，坐到这里，给我讲讲你自己的事。
        - id: ch01-b81
          speaker: anne
          text: 很抱歉，我不能留下。我真的很愿意和您谈谈，因为您看起来是位很有趣的女士。虽然从外表上不大看得出来，可您甚至可能是个知音。不过，我有责任回到玛丽拉·卡斯伯特小姐那里。她是位非常仁慈的女士，收养了我，想把我好好教养成人。她已经尽了最大的努力，只是这项工作很叫人灰心。请您千万别因为我跳上了床，就责怪玛丽拉。走以前，我只想知道，您会不会原谅戴安娜，也会不会照原来的打算，在埃文利住满那些日子。
        - id: ch01-b82
          speaker: josephine
          text: 好吧，只要你肯偶尔过来陪我说说话，让我再多听听你的故事，我想我也许会原谅戴安娜，也会照原来的打算留下。
        - id: ch01-b83
          speaker: narrator
          text: 当天晚上，约瑟芬小姐送给戴安娜一只银手镯。她还特意告诉巴里家的大人，自己的旅行袋已经打开，里面的东西都取出来了。这也就是说，她不打算第二天回城了。
        - id: ch01-b84
          speaker: josephine
          text: 我已经拿定主意，要照原来的计划住下来了。我这样做，只是想多了解了解那个安妮丫头。她能逗我开心，也让我很想再听她说话。到了我这个年纪，一个能真正逗人开心的人，可不是常常遇得到的。
        - id: ch01-b85
          speaker: narrator
          text: 玛丽拉听完这件事，只说了一句“我早就说过了”。这句话是特意说给马修听的。约瑟芬小姐不但住满了原定的一个月，还多住了些时候。安妮常常去陪她，让她一直保持好心情，她也就成了一个比平常更随和、更好相处的客人。老太太和小姑娘渐渐成了亲密的朋友。等约瑟芬小姐终于要离开埃文利时，她还特意叮嘱安妮。
        - id: ch01-b86
          speaker: josephine
          text: 你这个安妮丫头，可要记住了。以后只要进城，一定得来找我，也一定得住在我那里。到时候，我会让你睡我家最最客气、最最体面的那间客房。
        - id: ch01-b87
          speaker: anne
          text: 玛丽拉，巴里小姐到底还是个知音。只看她的外表，你绝不会想到这一点，可她的确就是。她不像马修那样，一眼就能看出来。和她相处一阵子以后，你才会慢慢明白。知音原来没有我从前以为的那么稀少。发现这个世界上竟然有这么多知音，实在太美妙了。
