audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm, observant, and gently amused
        timbre: clear and rounded
        pace: measured
        pitch: medium
    anne_shirley:
      display_name: Anne Shirley
      tts:
        delivery: vivid, earnest, and eagerly imaginative
        timbre: clear and youthful
        pace: lively
        pitch: medium-high
    marilla_cuthbert:
      display_name: Marilla Cuthbert
      tts:
        delivery: firm, practical, and restrained
        timbre: clear and mature
        pace: steady
        pitch: medium-low
  chapters:
    - id: ch01
      title: The Shore Road
      blocks:
        - id: ch01-b01
          speaker: anne_shirley
          text: >-
            You know, I've decided to enjoy this drive. I've learned that you can almost always enjoy something if you make up your mind firmly enough. You do have to be very firm about it. While we're driving, I won't think about going back to the asylum. I'll think only about the drive. Oh, look! One little early wild rose is blooming. Isn't it lovely? It must be glad to be a rose. I wish roses could talk. I'm sure they'd have beautiful things to tell us. And pink is the most enchanting color in the world, don't you think? I love it, but redheaded people can't wear pink, even in their imaginations. Have you ever known anyone whose red hair changed to another color when she grew up?
        - id: ch01-b02
          speaker: marilla_cuthbert
          text: >-
            No, I can't say I have. And I don't think yours is likely to change either.
        - id: ch01-b03
          speaker: narrator
          text: Anne sighed.
        - id: ch01-b04
          speaker: anne_shirley
          text: >-
            Well, there goes another hope. “My life is a perfect graveyard of buried hopes.” I found that sentence in a book, and whenever I'm disappointed, I say it to comfort myself.
        - id: ch01-b05
          speaker: marilla_cuthbert
          text: I don't see anything comforting about it.
        - id: ch01-b06
          speaker: anne_shirley
          text: >-
            But it sounds so beautifully romantic, as if I were the heroine of a book. I adore romantic things, and what could be more romantic than a graveyard full of buried hopes? I'm rather glad to have one. Are we crossing the Lake of Shining Waters today?
        - id: ch01-b07
          speaker: marilla_cuthbert
          text: >-
            If you mean Barry's pond, no. We're taking the road along the shore.
        - id: ch01-b08
          speaker: anne_shirley
          text: >-
            The shore road. That sounds lovely. Is it as nice as its name? The moment you said it, a picture flashed into my mind. White Sands is a pretty name too, though not as pretty as Avonlea. Avonlea sounds like music. How far is White Sands?
        - id: ch01-b09
          speaker: marilla_cuthbert
          text: >-
            Five miles. Since you're plainly determined to talk, you can make yourself useful and tell me what you know about yourself.
        - id: ch01-b10
          speaker: anne_shirley
          text: >-
            Oh, the things I know about myself aren't worth telling. Let me tell you what I imagine about myself instead. That would be much more interesting.
        - id: ch01-b11
          speaker: marilla_cuthbert
          text: >-
            I don't want imaginings. Give me the plain facts, starting at the beginning. Where were you born, and how old are you?
        - id: ch01-b12
          speaker: narrator
          text: Anne gave a small sigh and resigned herself to the plain facts.
        - id: ch01-b13
          speaker: anne_shirley
          text: >-
            I turned eleven last March, and I was born in Bolingbroke, Nova Scotia. My father was Walter Shirley. He taught at Bolingbroke High School, and my mother, Bertha Shirley, taught there too. Walter and Bertha are lovely names, aren't they? I'm so glad my parents had nice ones. Imagine the disgrace of having a father called Jedediah.
        - id: ch01-b14
          speaker: marilla_cuthbert
          text: >-
            A person's name doesn't matter as long as he behaves properly.
        - id: ch01-b15
          speaker: narrator
          text: Marilla felt it was her duty to offer that sound and useful lesson. Anne considered it.
        - id: ch01-b16
          speaker: anne_shirley
          text: >-
            I'm not sure. A book says a rose would smell just as sweet by any other name, but I've never believed it. A rose couldn't be quite as nice if you called it a thistle or a skunk cabbage. I suppose Father could still have been a good man if his name were Jedediah, but the name would have been a burden.
    - id: ch02
      title: Anne's Early Years
      blocks:
        - id: ch02-b01
          speaker: anne_shirley
          text: >-
            Mother stopped teaching when she married Father. Mrs. Thomas said one husband was responsibility enough. She also said my parents were like two babies and as poor as church mice. They lived in a tiny yellow house in Bolingbroke. I've never seen it, but I've pictured it thousands of times. There must have been honeysuckle around the parlor window, lilacs in the front yard, and lilies of the valley just inside the gate. And every window had muslin curtains. Muslin curtains make a house look so special.
        - id: ch02-b02
          speaker: anne_shirley
          text: >-
            I was born in that house. Mrs. Thomas said I was the homeliest baby she'd ever seen, all skinny and tiny and mostly eyes. But Mother thought I was perfectly beautiful. A mother ought to be a better judge than a woman who only came in to scrub, shouldn't she? I'm glad Mother was pleased with me. It would hurt terribly to think I'd disappointed her, because she didn't live long after I was born.
          emotion: sad
        - id: ch02-b03
          speaker: anne_shirley
          text: >-
            She died of a fever when I was three months old. I wish she'd lived long enough for me to remember calling her Mother. It must be so sweet to say that word. Father died of fever four days later. Then I was an orphan, and according to Mrs. Thomas, everyone was at a loss over what to do with me. Nobody wanted me even then. That seems to be my fate.
          emotion: sad
        - id: ch02-b04
          speaker: anne_shirley
          text: >-
            My parents had both come from far away, and everyone knew they had no living relatives. At last Mrs. Thomas took me, even though she was poor and her husband drank. She said she raised me by hand. Does being raised by hand make a person supposed to be better than everyone else? Whenever I was naughty, she'd remind me in such a hurt voice that she'd raised me that way.
        - id: ch02-b05
          speaker: anne_shirley
          text: >-
            The Thomases moved from Bolingbroke to Marysville, and I stayed with them until I was eight. They had four children, all younger than I was, and I helped care for every one of them. Believe me, four little children take a great deal of looking after. There was always so much for me to do.
        - id: ch02-b06
          speaker: anne_shirley
          text: >-
            Then Mr. Thomas fell under a train and was killed. His mother offered to take Mrs. Thomas and the children, but she didn't want me. Once again, Mrs. Thomas said she didn't know what to do with me. Mrs. Hammond lived up the river, and she came down and offered to take me because I was useful with children. So I went to live with her in a little clearing surrounded by tree stumps.
        - id: ch02-b07
          speaker: anne_shirley
          text: >-
            It was terribly lonely there. I don't think I could have borne it without my imagination. Mr. Hammond ran a little sawmill, and Mrs. Hammond had eight children. She had twins three times in a row. I like babies in reasonable amounts, but three sets of twins are too many. When the last two arrived, I told Mrs. Hammond so very firmly. I used to get dreadfully tired from carrying them around.
        - id: ch02-b08
          speaker: anne_shirley
          text: >-
            I lived with the Hammonds for more than two years. Then Mr. Hammond died, and Mrs. Hammond gave up the house. She sent her children to different relatives and moved to the United States. No one would take me, so I had to go to the asylum in Hopeton. They didn't want me there either. They said they were already overcrowded, but they had to accept me. I stayed four months, until Mrs. Spencer came.
        - id: ch02-b09
          speaker: narrator
          text: >-
            Anne ended with another sigh, though this one sounded relieved. It was plain that she did not like talking about all those years in a world where no one had wanted her.
    - id: ch03
      title: What Marilla Heard
      blocks:
        - id: ch03-b01
          speaker: marilla_cuthbert
          text: Did you ever attend school?
        - id: ch03-b02
          speaker: narrator
          text: Marilla turned the sorrel mare onto the shore road.
        - id: ch03-b03
          speaker: anne_shirley
          text: >-
            Not very much. I went for a while during my last year with Mrs. Thomas. Up the river, the school was too far away to walk to in winter, and summer was vacation. That meant I could only attend in spring and fall. Of course, I went to school at the asylum.
        - id: ch03-b04
          speaker: anne_shirley
          text: >-
            I read quite well, and I know ever so much poetry by heart. I can recite “The Battle of Hohenlinden,” “Edinburgh after Flodden,” and “Bingen on the Rhine.” I know a great deal of “The Lady of the Lake,” too, and most of James Thomson's “The Seasons.” Don't you love poems that send a shivery feeling up and down your back? The Fifth Reader has one called “The Downfall of Poland,” and it is thrilling from beginning to end. I wasn't in the Fifth Reader myself. I was only in the Fourth, but the older girls lent me their books.
        - id: ch03-b05
          speaker: marilla_cuthbert
          text: Were Mrs. Thomas and Mrs. Hammond good to you?
        - id: ch03-b06
          speaker: narrator
          text: >-
            Marilla glanced sideways at Anne. The child's sensitive face suddenly turned bright red, and embarrassment showed plainly across it.
        - id: ch03-b07
          speaker: anne_shirley
          text: >-
            Oh... they meant to be. I know they tried to be as good and kind as they could. And when someone means to treat you well, it doesn't hurt quite so much when they aren't always kind. They had so many troubles of their own. It must be very hard to live with a husband who drinks, and three sets of twins must be terribly hard too. Don't you think so? But I'm sure they meant to be good to me.
        - id: ch03-b08
          speaker: narrator
          text: >-
            Marilla asked nothing else. Anne fell silent and drank in the shore road with delight. Marilla guided the sorrel without paying much attention to where they were going. Her thoughts had turned inward.
        - id: ch03-b09
          speaker: narrator
          text: >-
            For the first time, pity stirred in her heart for Anne. Beneath the girl's careful answers, Marilla could see what her life had truly been. She had known hard work, poverty, neglect, and very little love. No wonder the hope of a real home had made her so happy. It seemed a shame that the child had to be sent away.
        - id: ch03-b10
          speaker: narrator
          text: >-
            What if Marilla gave in to Matthew's strange wish and let Anne stay? Matthew certainly had his heart set on it. And Anne seemed like a pleasant child who was willing to learn.
        - id: ch03-b11
          speaker: marilla_cuthbert
          text: >-
            She talks far too much, but perhaps she could learn not to. At least she isn't rude or common when she talks. She has good manners. Her parents were probably respectable people.
    - id: ch04
      title: The Sea and White Sands
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            The shore road was wild, wooded, and lonely. Thick scrub firs grew along the right side. Years of wrestling with winds from the gulf had never broken their spirit. On the left, steep cliffs of red sandstone crowded close to the track. In some places, a less dependable horse than the steady sorrel might have frightened everyone in the carriage.
        - id: ch04-b02
          speaker: narrator
          text: >-
            Far below lay piles of rocks smoothed by the surf and little sandy coves set with pebbles like jewels from the ocean. Beyond them, the blue sea shimmered. Gulls wheeled overhead, and their wings flashed silver in the sunlight.
        - id: ch04-b03
          speaker: narrator
          text: For a long while, Anne could only stare in wide-eyed silence. At last, she spoke.
        - id: ch04-b04
          speaker: anne_shirley
          text: >-
            Isn't the sea marvelous? When I lived in Marysville, Mr. Thomas once hired an express wagon and took all of us to the shore for the day. It was ten miles away. I loved every minute, even though I had to mind the children the whole time. For years afterward, I went back to that day in my happiest dreams. But this shore is even nicer than the one at Marysville.
          emotion: happy
        - id: ch04-b05
          speaker: anne_shirley
          text: >-
            And look at those wonderful gulls! Would you want to be one? I think I would, if I couldn't be a human girl. Imagine waking at sunrise, sweeping down over the water, and flying above that beautiful blue sea all day. Then at night, you'd return to your nest. I can almost feel myself doing it. Please, what is that big house ahead?
        - id: ch04-b06
          speaker: marilla_cuthbert
          text: >-
            That's the White Sands Hotel. Mr. Kirke owns it, but the season hasn't started yet. A great many Americans stay there in summer. They think this shore suits them perfectly.
        - id: ch04-b07
          speaker: anne_shirley
          text: >-
            I was afraid it might be Mrs. Spencer's house. I don't want to arrive there. Somehow, reaching it will feel like the end of everything.
          emotion: sad
