audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖从容，带着细腻而机智的讲述感
        timbre: 清澈柔和
        pace: 舒缓而有变化
        pitch: 中音
    anne:
      display_name: 安妮
      tts:
        delivery: 热切灵动，想法接连涌出，真挚而富于想象
        timbre: 清亮稚嫩
        pace: 明快，动情处自然放慢
        pitch: 中高音
    marilla:
      display_name: 玛丽拉
      tts:
        delivery: 干脆严谨，言语直截了当，偶尔透出克制的温情
        timbre: 清晰沉稳
        pace: 中等
        pitch: 中音
  chapters:
    - id: ch01
      title: 第五章　安妮的身世
      blocks:
        - id: ch01-b01
          speaker: anne
          text: 您知道吗，我决定一路上都要开开心心的。照我的经验，只要真下定决心，一件事差不多总能变得有意思。不过，这个决心一定得非常坚定才行。坐车的时候，我不去想回孤儿院，只想眼前这一路。
        - id: ch01-b02
          speaker: anne
          text: 快看，那边已经开了一朵早早的野玫瑰！多可爱呀。它能做一朵玫瑰，一定很高兴吧？要是玫瑰会说话，该有多好。它们准能讲出许多美妙的事。粉红色也是世上最迷人的颜色，可我偏偏不能穿。红头发的人不能穿粉红色，连在想象里也不行。您见过谁小时候头发红，长大以后却变了颜色吗？
        - id: ch01-b03
          speaker: marilla
          text: 没有，我不记得见过。你的头发大概也不会变。
        - id: ch01-b04
          speaker: narrator
          text: 玛丽拉说得毫不留情。安妮叹了一口气。
        - id: ch01-b05
          speaker: anne
          text: 好吧，我又失去了一个希望。“我的一生，就是一片埋葬了希望的墓园。”这是我在书上读来的。每次遇到失望的事，我都会念一遍，让自己好受些。
          emotion: sad
        - id: ch01-b06
          speaker: marilla
          text: 我可听不出这句话哪里能让人好受。
        - id: ch01-b07
          speaker: anne
          text: 它听起来又优美又浪漫呀，好像我成了书里的女主人公。我最爱浪漫的事了。还有什么能比一座埋满破灭希望的墓园更浪漫呢？我甚至庆幸自己也有一座。对了，我们今天会从闪光之湖上经过吗？
        - id: ch01-b08
          speaker: marilla
          text: 如果你说的是巴里家的池塘，那就不经过。我们走滨海路。
        - id: ch01-b09
          speaker: anne
          text: 滨海路，听起来真美。它是不是和这个名字一样好看？您刚说出口，我心里一下就出现了一幅画。白沙这个名字也不错，不过还是比不上埃文利。埃文利念起来简直像音乐。白沙离这里多远？
        - id: ch01-b10
          speaker: marilla
          text: 五英里。反正你非说话不可，那就说点有用的，讲讲你自己的事情。
        - id: ch01-b11
          speaker: anne
          text: 我真正知道的那些事一点也不好听。要是您肯听我想象出来的身世，那可有趣多了。
        - id: ch01-b12
          speaker: marilla
          text: 我不要听想象，只要事实。从最开头讲。你在哪儿出生？今年多大？
        - id: ch01-b13
          speaker: narrator
          text: 安妮轻轻叹气，只好收起想象，老老实实去讲那些干巴巴的事实。
        - id: ch01-b14
          speaker: anne
          text: 今年三月，我满十一岁了。我出生在新斯科舍的博林布鲁克。父亲叫沃尔特·雪莉，在博林布鲁克中学教书。母亲叫伯莎·雪莉。沃尔特和伯莎多好听呀！我真庆幸他们的名字都很好。要是父亲叫杰迪代亚之类的名字，不是很丢脸吗？
        - id: ch01-b15
          speaker: narrator
          text: 玛丽拉觉得，这时候应该教给她一条正经又实用的道理。
        - id: ch01-b16
          speaker: marilla
          text: 只要一个人品行端正，他叫什么都不要紧。
        - id: ch01-b17
          speaker: anne
          text: 我不大相信。书上说，玫瑰无论换成什么名字，闻起来还是一样香。可要是玫瑰叫蓟草，或者臭菘，它一定不会这么可爱。就算父亲名叫杰迪代亚，他仍然能做个好人，但这个名字肯定会叫他一辈子受累。
        - id: ch01-b18
          speaker: anne
          text: 母亲原来也在中学教书，和父亲结婚以后就不教了。毕竟，光照料一个丈夫就够费心了。托马斯太太说，他们俩简直是一对没长大的孩子，还穷得像教堂里的老鼠。他们住在博林布鲁克一幢特别小的黄房子里，小得不能再小了。
        - id: ch01-b19
          speaker: anne
          text: 我从没见过那幢房子，可我想过它成千上万次。客厅窗外准爬着金银花，前院有丁香，进门就是铃兰。每扇窗上还应该挂着细棉布窗帘。窗帘会让一幢房子显得很有气派。我就是在那里出生的。
        - id: ch01-b20
          speaker: anne
          text: 托马斯太太说，我是她见过最难看的婴儿。那时我又瘦又小，浑身好像只剩一双眼睛。可母亲觉得我美极了。做母亲的总比一个上门擦洗打扫的穷女人更会看自己的孩子，对不对？不管怎样，我真高兴母亲对我很满意。要是知道自己曾让她失望，我会难过死的。
        - id: ch01-b21
          speaker: anne
          text: 可她没能活多久。我才三个月，她就发烧去世了。我真希望她能多活一阵，至少让我记得自己叫过她“妈妈”。能亲口叫她一声妈妈，一定特别甜蜜，您不觉得吗？四天后，父亲也因为发烧去世了。于是，我成了孤儿。
          emotion: sad
        - id: ch01-b22
          speaker: anne
          text: 托马斯太太说，大家都不知道该拿我怎么办。那时候就没有人想要我，这似乎就是我的命。父母是从远方来的，也没有在世的亲人。最后，托马斯太太收留了我，虽然她家很穷，丈夫还总喝醉。她就这样亲手把我拉扯大。
        - id: ch01-b23
          speaker: anne
          text: 您说，被人“亲手拉扯大”的孩子，是不是应该比别人更好？每次我淘气，托马斯太太都会责问我，她既然亲手把我养大，我怎么还会这么坏。
        - id: ch01-b24
          speaker: anne
          text: 后来，托马斯先生和太太从博林布鲁克搬到玛丽斯维尔，我跟他们一直住到八岁。托马斯家有四个孩子比我小，我得帮忙照看。他们可真够人忙的。后来，托马斯先生掉到火车底下去世了。他母亲愿意接走托马斯太太和孩子们，却不愿意收留我。
        - id: ch01-b25
          speaker: anne
          text: 托马斯太太又束手无策，不知道该怎样安置我。这时，住在河上游的哈蒙德太太来了。她知道我会照料小孩，就愿意带我走。我跟她住进一块满是树桩的小林间空地，那里孤单极了。要不是我会想象，我相信自己根本熬不下去。
        - id: ch01-b26
          speaker: anne
          text: 哈蒙德先生在那里经营一座小锯木厂，哈蒙德太太总共有八个孩子。她接连三次都生了双胞胎。我喜欢孩子，但也得有个限度，连续三次都是双胞胎，实在太多了。最后一对出生时，我很坚决地对哈蒙德太太说过这话。那阵子，我每天抱着孩子走来走去，累得要命。
        - id: ch01-b27
          speaker: anne
          text: 我在河上游跟哈蒙德太太住了两年多。哈蒙德先生去世以后，她就把家散了。她把孩子一个个交给各处的亲戚，自己去了美国。还是没人肯收留我，所以我只能去霍普顿孤儿院。孤儿院也嫌那里已经挤得满满当当，不想要我，可他们最后还是不得不收下。我在那里待了四个月，后来斯宾塞太太来了。
        - id: ch01-b28
          speaker: narrator
          text: 安妮终于说完，又长长地叹了一声。这回，她是在松一口气。这个世界一直没有人想要她。很明显，她一点也不愿意回想自己在这样的世界里经历过什么。
        - id: ch01-b29
          speaker: marilla
          text: 你以前上过学吗？
        - id: ch01-b30
          speaker: narrator
          text: 玛丽拉一边追问，一边让栗色母马转上滨海路。
        - id: ch01-b31
          speaker: anne
          text: 上得不多。住在托马斯太太家的最后一年，我去过一阵。后来住到河上游，学校太远，冬天走不到，夏天又放假，我只能春秋两季去。当然，在孤儿院时我一直上学。
        - id: ch01-b32
          speaker: anne
          text: 我读书读得不错，还会背好多诗，像《霍恩林登之战》《弗洛登战役后的爱丁堡》《莱茵河畔的宾根》。我也会《湖上夫人》里的许多段，还有詹姆斯·汤姆森《四季》里的大半部分。
        - id: ch01-b33
          speaker: anne
          text: 那种让人整个脊背一阵阵发颤的诗，您难道不喜欢吗？第五册读本里的《波兰的覆亡》，从头到尾，每一句都让人激动。我其实只读到第四册，不过那些大姑娘常把第五册借给我看。
        - id: ch01-b34
          speaker: marilla
          text: 托马斯太太和哈蒙德太太，她们对你好吗？
        - id: ch01-b35
          speaker: narrator
          text: 玛丽拉从眼角悄悄看着安妮。安妮迟疑了。她那张敏感的小脸一下涨得通红，神情也变得很窘迫。
        - id: ch01-b36
          speaker: anne
          text: 她们是想对我好的。我知道，她们真想尽可能待我好，待我和气。别人只要有这份心，就算他们没有每一次都做到，你也不会那么在意。她们都有许多烦恼。丈夫酗酒，一定很难过日子。接连生三对双胞胎，也一定让人受不了，对不对？不管怎样，我相信她们是真心想善待我。
        - id: ch01-b37
          speaker: narrator
          text: 玛丽拉没有再问。安妮也不再说话，只管望着滨海路，默默沉醉在沿途的景色中。玛丽拉心不在焉地赶着栗色母马，心里却想得很深。她忽然开始可怜身边这个孩子。
        - id: ch01-b38
          speaker: narrator
          text: 安妮过的是怎样一种既匮乏又无人疼爱的生活啊。她的日子只有没完没了的劳作、贫穷和忽视。那些苦处，她一句也没有明说。可玛丽拉精明得很，已经从她讲述的字缝里听出了真相。难怪一听说可能拥有真正的家，安妮会那么欢喜。如今又非把她送回去不可，实在可怜。
        - id: ch01-b39
          speaker: narrator
          text: 玛丽拉心里冒出一个念头。要不，就由着马修那阵说不清的心血来潮，让安妮留下？马修已经铁了心，而这个小姑娘看着也乖巧懂事，应该是个教得好的孩子。或许，真可以让她留下。
        - id: ch01-b40
          speaker: marilla
          text: 她的话确实太多，不过也许能慢慢教她改掉。她说出口的那些话倒不粗鲁，也没有什么俚俗的腔调。她举止还挺像个体面的姑娘。看来，她的父母多半都是很好的人。
        - id: ch01-b41
          speaker: narrator
          text: 滨海路两旁树木丛生，荒僻又寂静。右手边，矮小的冷杉密密挤在一起。它们和海湾刮来的大风斗了好多年，精神却一点没垮。左手边是陡峭的红砂岩悬崖，有些地方紧贴着车道。幸好栗色母马性子稳。换一匹不那么稳当的马，只怕车上的人一路都要提心吊胆。
        - id: ch01-b42
          speaker: narrator
          text: 悬崖下面堆着海浪磨圆的礁石，礁石之间偶尔露出小小的沙湾。湾里铺着一颗颗卵石，就像大海亲手镶进去的珠宝。再往外，就是一望无际的大海。蔚蓝的水面闪闪发亮，海鸥从上空飞过，翅膀迎着阳光，闪出一片银白。
        - id: ch01-b43
          speaker: narrator
          text: 安妮睁大眼睛，安静了好一阵，终于从眼前的美景里醒过神来。
        - id: ch01-b44
          speaker: anne
          text: 大海真了不起，您不觉得吗？以前住在玛丽斯维尔时，托马斯先生雇过一辆运货马车，把我们所有人带到十英里外的海边玩了一天。虽然我整天都得照看孩子，那天的每一刻还是很快活。后来好多年，我总在幸福的梦里把那一天重新过一遍。
        - id: ch01-b45
          speaker: anne
          text: 可这里的海岸比玛丽斯维尔的更美。那些海鸥多神气！您愿意变成海鸥吗？要是不能做个女孩，我倒很愿意。每天太阳一升起来，就俯冲到海面上，再飞出去，整天掠过那片可爱的蔚蓝。到了晚上，又一路飞回自己的巢里。您说，那样是不是很好？啊，我简直能看见自己正在这么飞了。
          emotion: happy
        - id: ch01-b46
          speaker: anne
          text: 请问，前面那幢大房子是什么地方？
        - id: ch01-b47
          speaker: marilla
          text: 那是白沙旅馆，柯克先生经营的。不过，现在度假季还没开始。每年夏天都有一大群美国人来这里住，他们都觉得这一带的海岸再合适不过。
        - id: ch01-b48
          speaker: anne
          text: 我刚才真怕那是斯宾塞太太家。我不想走到那里。不知为什么，我觉得一到那里，一切就全结束了。
          emotion: sad
