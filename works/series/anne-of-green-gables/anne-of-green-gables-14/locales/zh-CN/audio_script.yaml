audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖从容，带着细腻而机智的讲述感
        timbre: 清澈柔和
        pace: 舒缓而有变化
        pitch: 中音
    anne:
      display_name: 安妮
      tts:
        delivery: 热切灵动，想法接连涌出，真挚而富于想象
        timbre: 清亮稚嫩
        pace: 明快，动情处自然放慢
        pitch: 中高音
    marilla:
      display_name: 玛丽拉
      tts:
        delivery: 干脆严谨，言语直截了当，偶尔透出克制的温情
        timbre: 清晰沉稳
        pace: 中等
        pitch: 中音
    matthew:
      display_name: 马修
      tts:
        delivery: 温厚迟缓，说话犹豫而真诚
        timbre: 低沉柔和
        pace: 舒缓
        pitch: 中低音
  chapters:
    - id: ch01
      title: 第十四章　安妮的坦白
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            野餐会前的星期一傍晚，玛丽拉从楼上下来，脸上满是忧色。安妮坐在干干净净的桌边剥豌豆，还卖力地唱着《榛树谷的内莉》。她唱得有声有色，看来戴安娜确实教得不错。玛丽拉走到这个小人儿面前，问起了一件东西。
        - id: ch01-b02
          speaker: marilla
          text: >-
            安妮，你见过我的紫水晶胸针吗？昨天晚上从教堂回来，我记得把它插进针垫了，可现在怎么也找不到。
        - id: ch01-b03
          speaker: anne
          text: >-
            我……我下午见过。那时您去了妇女互助会。我经过您的房门，看见胸针在针垫上，就进去看了看。
        - id: ch01-b04
          speaker: marilla
          text: >-
            你动过它没有？
        - id: ch01-b05
          speaker: anne
          text: >-
            动……动过。我拿起来别在胸口，只想瞧瞧自己戴着它是什么样子。
        - id: ch01-b06
          speaker: marilla
          text: >-
            你根本不该碰。小姑娘随便动别人的东西，很不应该。你先是不该走进我的房间，后来又不该拿不属于你的胸针。你到底把它放在哪儿了？
        - id: ch01-b07
          speaker: anne
          text: >-
            我放回五斗柜上了，连一分钟都没戴满。玛丽拉，我真的不是故意要乱动东西。当时我没想到，进您的房间试戴胸针是不对的。现在我懂了，以后绝不会再犯。这一点我倒很好，同一件坏事从来不会做两次。
        - id: ch01-b08
          speaker: marilla
          text: >-
            你没有放回去。五斗柜上根本没有胸针。安妮，你一定把它带出去了，或者做了别的什么。
        - id: ch01-b09
          speaker: anne
          text: >-
            我真的放回去了。我只是想不起来，究竟插在针垫上，还是搁进了瓷碟。可我敢肯定，我放回去了。
        - id: ch01-b10
          speaker: marilla
          text: >-
            我再去仔细找一遍。你真放回去了，它就一定还在那里。要是找不到，那我就知道你没放。就这么简单。
        - id: ch01-b11
          speaker: narrator
          text: >-
            玛丽拉决意公公平平地再找一次。她回到房里，不光搜了五斗柜，连每个可能放着胸针的地方也没漏下。可哪里都没有。回到厨房以后，她告诉安妮，胸针真的不见了。照安妮自己的说法，她是最后碰过胸针的人。玛丽拉要她马上讲实话，逼问她是不是把胸针带出房间，又在外面弄丢了。
        - id: ch01-b12
          speaker: anne
          text: >-
            我没有。我从来没把胸针拿出您的房间，这句话千真万确。就算要押我上断头台，我也不会改口。不过，我其实不太清楚断头台是什么。反正，事情就是这样，玛丽拉。
        - id: ch01-b13
          speaker: narrator
          text: >-
            安妮那句“事情就是这样”，不过是为了把话说得更有分量。玛丽拉听着，却觉得她在故意反抗。
        - id: ch01-b14
          speaker: marilla
          text: >-
            安妮，你在撒谎，我知道你在撒谎。除非你肯把实话全说出来，否则不要再开口。回房间去，等你愿意坦白了再出来。
          emotion: angry
        - id: ch01-b15
          speaker: anne
          text: >-
            那我把豌豆带上去剥吗？
        - id: ch01-b16
          speaker: marilla
          text: >-
            不用，我自己会剥完。照我说的去做。
        - id: ch01-b17
          speaker: narrator
          text: >-
            安妮走后，玛丽拉一边干晚上的活，一边越想越乱。胸针那么贵重，要是安妮真给弄丢了怎么办？更叫她难受的是，事实明明已经摆在眼前，安妮却还不承认。偏偏那张脸看起来又那么天真。
        - id: ch01-b18
          speaker: narrator
          text: >-
            她不安地剥着豌豆，怎么想都觉得，没有什么事会比眼前这件更糟。安妮大概不是想偷，只是拿去玩，或者帮她把想象变得更真。可自从安妮进过那间屋，直到玛丽拉晚上进去，中间没有别人来过。胸针又确实没了。一定是孩子弄丢以后怕受罚，才不敢承认。想到安妮会偷偷摸摸，还会说假话，玛丽拉觉得这比丢了胸针更可怕，也比安妮发脾气严重得多。家里养着一个不能信任的孩子，那份责任实在沉重。只要安妮肯说实话，别的事反倒没那么难办。
        - id: ch01-b19
          speaker: narrator
          text: >-
            那天晚上，玛丽拉一次次回房寻找，每次都空着手出来。睡前她又去东山墙房间问了安妮，仍旧一无所获。安妮坚持说不知道胸针在哪里，她越否认，玛丽拉越认定她知道。第二天早晨，玛丽拉把整件事告诉了马修。马修吃了一惊，也迷惑极了。他还不肯这么快就怀疑安妮，可眼前的情形确实对她不利。
        - id: ch01-b20
          speaker: matthew
          text: >-
            你真能肯定，胸针没有掉到五斗柜后面？
        - id: ch01-b21
          speaker: marilla
          text: >-
            我挪开了柜子，抽屉也一个个拿出来，所有缝隙和角落全看过。胸针就是没了。那个孩子拿了它，又撒了谎。这件丑事明明白白，我们还是正眼看它吧，马修·卡思伯特。
        - id: ch01-b22
          speaker: narrator
          text: >-
            马修愁眉苦脸地问她准备怎么办，心里却庆幸这事归玛丽拉管。这一回，他实在不想插手。
        - id: ch01-b23
          speaker: marilla
          text: >-
            她得一直待在房里，等她肯坦白再说。上回这个办法很管用。要是她说出把胸针带到了哪里，也许还能找回来。不管找不找得到，她都必须受重罚。
        - id: ch01-b24
          speaker: matthew
          text: >-
            嗯，那你只好罚她了。记住，这件事可不归我管。是你自己叫我别插手的。
        - id: ch01-b25
          speaker: narrator
          text: >-
            马修拿起帽子走了，玛丽拉觉得所有人都丢下了自己，连林德太太也不能去请教。她神色严肃地走进东山墙房间，出来时脸色更沉。安妮还是不肯坦白，一遍遍坚持自己没有拿胸针。孩子显然哭过，玛丽拉心里一疼，又硬把那点怜惜压了下去。两个人就这样僵持着。挨到晚上，玛丽拉用自己的话说，已经彻底“累垮了”。
        - id: ch01-b26
          speaker: marilla
          text: >-
            安妮，只要你一天不坦白，就一天别想离开这间屋。你趁早拿定主意。
        - id: ch01-b27
          speaker: anne
          text: >-
            可野餐会明天就要开始了！玛丽拉，您不会连野餐会也不让我去吧？只放我出去一个下午，好不好？回来以后，不管要我在这里待多久，我都会高高兴兴地待着。可我一定得去。
        - id: ch01-b28
          speaker: marilla
          text: >-
            你不坦白，就不能去野餐会，也不能去任何地方。
        - id: ch01-b29
          speaker: anne
          text: >-
            哦，玛丽拉！
          emotion: surprised
        - id: ch01-b30
          speaker: narrator
          text: >-
            玛丽拉已经出门，把房门关上了。
        - id: ch01-b31
          speaker: narrator
          text: >-
            星期三的早晨明亮又晴朗，像是特意替野餐会订做的。鸟儿在绿山墙四周歌唱。花园里的圣母百合吐出一阵阵香气，跟着无形的风，从门窗飘进厅堂和房间，仿佛送来祝福的精灵。洼地里的白桦树快乐地挥着手，好像正等安妮从东山墙窗口向它们道早安。可窗口没有安妮。玛丽拉送早饭上楼时，只见她端正地坐在床上，脸色苍白，嘴唇抿得紧紧的，一双眼睛闪着坚决的光。
        - id: ch01-b32
          speaker: anne
          text: >-
            玛丽拉，我已经准备好坦白了。
        - id: ch01-b33
          speaker: narrator
          text: >-
            玛丽拉听见这句话，立刻放下手里的早餐托盘。她的办法又一次成功了，这次的胜利却苦得很。
        - id: ch01-b34
          speaker: marilla
          text: >-
            啊，那么你说吧，安妮。我听着。
        - id: ch01-b35
          speaker: anne
          text: >-
            紫水晶胸针是我拿的，就像您说的那样。我走进房间时，本来没想带走它。可胸针别在我身上实在太美了，我抵挡不了那个诱惑。我想到，要是戴着它去闲逸之乡，假装自己是科迪莉亚·菲茨杰拉德小姐，该有多激动人心。有真正的紫水晶胸针帮忙，我当然更容易想象。戴安娜和我会拿野蔷薇果串项链，可野蔷薇果哪里比得上紫水晶呢？所以，我把胸针拿走了。
        - id: ch01-b36
          speaker: anne
          text: >-
            我本来想赶在您回来以前放回去，还故意绕着大路走，好让自己能在外面多待一会儿。走过闪光之湖上的桥时，我摘下胸针，想再看一眼。它在阳光下闪得那么美！后来我靠在桥边，它忽然从指头间滑了出去，就这样，一直往下，往下，往下。它闪着紫色的光，永远沉进了闪光之湖底。玛丽拉，这就是我能做出的最好的坦白了。
        - id: ch01-b37
          speaker: narrator
          text: >-
            玛丽拉的怒火一下又烧了起来。这个孩子拿走她最珍爱的紫水晶胸针，还把它弄丢了，现在居然安安静静地坐在那里，把事情的经过一件件背出来。她的神情那么平静，脸上看不出一点内疚，也没有半点后悔。这让玛丽拉越想越气。
        - id: ch01-b38
          speaker: marilla
          text: >-
            安妮，这件事太可怕了。我从没听说过比你更坏的女孩。
          emotion: angry
        - id: ch01-b39
          speaker: anne
          text: >-
            是啊，我想我就是那么坏。我知道自己必须受罚，处罚我也是您的责任。您能不能现在就罚完？我还想去野餐会，不愿意心里一直压着这件事。
          emotion: calm
        - id: ch01-b40
          speaker: marilla
          text: >-
            你居然还想着野餐会！安妮·雪莉，你今天不能去。这就是你的惩罚。凭你做下的事情，这处罚还远远不够重！
          emotion: angry
        - id: ch01-b41
          speaker: anne
          text: >-
            不能去野餐会？可您答应过我！玛丽拉，我非去不可。我就是为了去才肯坦白的。除了不让我去，您怎么罚都行。求求您，让我去吧。您想想冰淇淋呀，说不定我以后再也没有机会尝到了。
          emotion: fearful
        - id: ch01-b42
          speaker: narrator
          text: >-
            安妮一下从床上跳起来，死死抓住玛丽拉的手不放。她不住地恳求，说自己正是为了野餐会才作了坦白，怎么处罚都行，只求别夺走野餐会。玛丽拉硬起心肠，把她紧抓着的手拨开。
        - id: ch01-b43
          speaker: marilla
          text: >-
            不用求我。你不能去野餐会，这事已经定了。一个字也不许再说。
        - id: ch01-b44
          speaker: narrator
          text: >-
            安妮终于明白，玛丽拉不会改变主意。她紧紧扣住双手，尖叫一声，接着脸朝下扑在床上，一边哭，一边翻滚，彻底陷进了失望和绝望里。玛丽拉喘着气，赶忙离开房间。她觉得这个孩子不是疯了，就是坏透了，神志清醒的孩子绝不会这样。也许蕾切尔一开始就是对的。可她既然已经把手扶上了犁，就绝不会回头。
        - id: ch01-b45
          speaker: narrator
          text: >-
            那真是一个阴沉的上午。玛丽拉狠着劲儿干活，没事可做时，就去刷门廊的地板和奶房的搁板。其实这两处根本不用刷，需要发泄的是她自己。后来，她又到院子里耙地。午饭做好，她站在楼梯口叫安妮。一张满是泪痕的小脸从栏杆上方露出来，神情悲惨得不得了。
        - id: ch01-b46
          speaker: marilla
          text: >-
            安妮，下来吃午饭。
        - id: ch01-b47
          speaker: anne
          text: >-
            我不想吃，玛丽拉，我什么也咽不下去。我的心已经碎了。总有一天，您会为了弄碎我的心受到良心责备，不过我原谅您。到了那一天，请您记住，我已经原谅您了。也请您别再叫我吃饭，尤其别让我吃咸肉煮青菜。人正在伤心时，这道菜实在太不浪漫了。
          emotion: sad
        - id: ch01-b48
          speaker: narrator
          text: >-
            玛丽拉又气又恼，回到厨房，把自己的苦恼从头到尾都说给马修听。马修一方面觉得应该讲公道，另一方面又忍不住同情安妮。他觉得这份同情似乎不大应该，夹在两头，也难受极了。他看着盘里毫不浪漫的咸肉煮青菜，仿佛也觉得这种饭菜不适合感情上的大危机。
        - id: ch01-b49
          speaker: matthew
          text: >-
            嗯，她不该拿胸针，也不该编故事骗人。可她还那么小，又是个那么有意思的小家伙。她这么盼着野餐会，你不许她去，会不会太重了一点？
        - id: ch01-b50
          speaker: marilla
          text: >-
            马修·卡思伯特，你这话真叫我吃惊。我还觉得自己罚得太轻了呢。最让我担心的是，她根本没有明白自己错得多厉害。要是真心后悔，事情还不至于这么糟。你也没明白，只顾着在心里替她找借口。我全看得出来。
        - id: ch01-b51
          speaker: matthew
          text: >-
            可她毕竟还小。总该多体谅一点吧，玛丽拉。你知道，以前从来没人好好教过她。
        - id: ch01-b52
          speaker: marilla
          text: >-
            那她现在有人教了。
        - id: ch01-b53
          speaker: narrator
          text: >-
            这句话即使没能说服马修，也叫他再没话说。那顿午饭吃得愁云惨雾。只有雇来的男孩杰里·比奥特还挺快活，玛丽拉甚至觉得，他的快活简直是在存心冒犯自己。
        - id: ch01-b54
          speaker: narrator
          text: >-
            洗完碗，发好面，又喂过鸡，玛丽拉想起一件事。星期一下午从妇女互助会回家时，她脱下最好的黑蕾丝披肩，曾看见上面裂了一小道口子。现在正好去补一补。披肩装在衣箱的盒子里。玛丽拉刚把它提起来，一缕阳光穿过窗外茂密的藤蔓，照在披肩上钩住的东西上。那东西有许多小切面，闪着紫罗兰色的光。玛丽拉倒吸一口气，一把抓了过去。那正是紫水晶胸针，搭扣挂在一根蕾丝线上，摇摇晃晃地悬在那里！
        - id: ch01-b55
          speaker: marilla
          text: >-
            我的老天和良心哪，这到底是怎么回事？我以为胸针沉在巴里家的池塘底下，它却好端端地挂在这里。那孩子为什么说自己拿走又弄丢了？绿山墙怕不是中了魔。我想起来了，星期一下午脱下披肩时，我把它放在五斗柜上停了一会儿。胸针一定是那时不知怎么钩上去的。唉！
          emotion: surprised
        - id: ch01-b56
          speaker: narrator
          text: >-
            玛丽拉拿着胸针，立刻去了东山墙房间。安妮已经哭得再也哭不出来，正垂头丧气地坐在窗边。
        - id: ch01-b57
          speaker: marilla
          text: >-
            安妮·雪莉，我刚从黑蕾丝披肩上找到了胸针。现在请你告诉我，早晨讲的那一大串胡话究竟是什么意思。
        - id: ch01-b58
          speaker: anne
          text: >-
            是您说的，不坦白就一直把我关在房里。可我一定得去野餐会，所以只好决定坦白。昨天晚上躺下以后，我编了一份坦白，还尽量让它有意思一点。我反复背了好多遍，免得今天忘记。结果您还是不让我去，我花的那些工夫全都白费了。
        - id: ch01-b59
          speaker: narrator
          text: >-
            玛丽拉忍不住笑了，可她的良心也狠狠刺了她一下。
        - id: ch01-b60
          speaker: marilla
          text: >-
            安妮，你可真叫人没办法！不过，我现在明白，是我错了。从前我从没发现你撒过谎，这次不应该怀疑你的话。当然，为没做过的事情作假坦白也很不对，而且错得很。可你是被我逼到这一步的。只要你肯原谅我，我也原谅你。我们把这件事扯平，从头开始。现在快去准备野餐会吧。
        - id: ch01-b61
          speaker: narrator
          text: >-
            安妮像火箭一样跳了起来。
        - id: ch01-b62
          speaker: anne
          text: >-
            玛丽拉，现在还来得及吗？
          emotion: surprised
        - id: ch01-b63
          speaker: marilla
          text: >-
            来得及，才两点。大家应该刚刚到齐，离下午茶还有一个钟头。快去洗脸、梳头，换上格子布裙。我给你装一篮吃的，家里烤好的东西很多。再让杰里套上栗色马，赶车送你过去。
        - id: ch01-b64
          speaker: anne
          text: >-
            哦，玛丽拉！五分钟前，我难过得希望自己从来没有出生。现在就算让我跟天使交换位置，我都不肯！
          emotion: happy
        - id: ch01-b65
          speaker: narrator
          text: >-
            安妮说着便飞奔到盥洗架前，立刻开始收拾自己。当天晚上，她终于回到绿山墙。那时，她既快活得彻底，也累得彻底，整个人像沉浸在幸福之中，那种满足简直没法用话形容。
        - id: ch01-b66
          speaker: anne
          text: >-
            玛丽拉，我今天玩得太“绝妙”了！这是我刚学会的新词，是听玛丽·艾丽斯·贝尔说的。您不觉得它特别传神吗？什么都好极了。下午茶丰盛得不得了，后来哈蒙·安德鲁斯先生又带我们去闪光之湖划船，每次坐六个人。
          emotion: happy
        - id: ch01-b67
          speaker: anne
          text: >-
            简·安德鲁斯差点掉进湖里。她探出身子摘睡莲，幸亏安德鲁斯先生及时抓住她的腰带，不然她准会掉下去，也许还会淹死。我真希望差点淹死的人是我。那会是多浪漫的经历呀，以后还能讲成一个激动人心的故事。我们也吃到了冰淇淋。那种味道，我实在找不出话来形容。玛丽拉，我向您保证，简直妙不可言。
          emotion: happy
        - id: ch01-b68
          speaker: narrator
          text: >-
            那天晚上，玛丽拉坐在袜子篮边，把整件事讲给马修听。
        - id: ch01-b69
          speaker: marilla
          text: >-
            我愿意承认，这次是我错了，不过我也学到了教训。每次想到安妮那份“坦白”，我就想笑。她说的确实是假话，照理不该觉得好笑。可不知为什么，这总不像她真拿了胸针又不承认那么糟。再说，不管怎么讲，这件事本来就是我逼出来的。那个孩子有些地方真叫人摸不透，可我相信，她最后会长成一个好姑娘。有一点倒可以肯定，只要她住在哪个家里，那个家就永远不会无聊。
