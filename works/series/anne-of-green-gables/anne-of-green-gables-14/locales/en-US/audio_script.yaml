audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm, observant, and gently amused
        timbre: clear and rounded
        pace: measured
        pitch: medium
    anne_shirley:
      display_name: Anne Shirley
      tts:
        delivery: vivid, earnest, and eagerly imaginative
        timbre: clear and youthful
        pace: lively
        pitch: medium-high
    marilla_cuthbert:
      display_name: Marilla Cuthbert
      tts:
        delivery: firm, practical, and restrained
        timbre: clear and mature
        pace: steady
        pitch: medium-low
    matthew_cuthbert:
      display_name: Matthew Cuthbert
      tts:
        delivery: gentle, hesitant, and quietly sympathetic
        timbre: soft and weathered
        pace: unhurried
        pitch: low
  chapters:
    - id: ch01
      title: The Missing Brooch
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: "On Monday evening, two days before the picnic, Marilla came downstairs looking troubled. Anne sat at the spotless kitchen table, shelling peas and singing Nelly of the Hazel Dell with all the feeling Diana had taught her."
        - id: ch01-b02
          speaker: marilla_cuthbert
          text: "Anne, have you seen my amethyst brooch? I thought I put it in my pincushion when I came home from church yesterday, but now I can't find it anywhere."
        - id: ch01-b03
          speaker: anne_shirley
          text: "I... I saw it this afternoon while you were at the Aid Society. I was going past your door, and there it was on the cushion. So I went in to look at it."
        - id: ch01-b04
          speaker: marilla_cuthbert
          text: "Did you touch it?"
        - id: ch01-b05
          speaker: anne_shirley
          text: "Y-e-e-s. I picked it up and pinned it on my dress, just to see how it looked."
        - id: ch01-b06
          speaker: marilla_cuthbert
          text: "You had no right to do that. Meddling is very wrong. You shouldn't have gone into my room, and you certainly shouldn't have touched something that wasn't yours. Where did you put it?"
        - id: ch01-b07
          speaker: anne_shirley
          text: "I put it back on the bureau. I only wore it for a minute. Truly, Marilla, I didn't mean to meddle. I didn't stop to think that going in and trying it on was wrong. Now I understand, and I'll never do it again. That's one good thing about me. I never do the same naughty thing twice."
        - id: ch01-b08
          speaker: marilla_cuthbert
          text: "You did not put it back. It isn't anywhere on the bureau. You must have taken it out of the room, or done something with it."
        - id: ch01-b09
          speaker: anne_shirley
          text: "I did put it back. I can't remember whether I stuck it in the pincushion or laid it in the china tray, but I know I returned it."
        - id: ch01-b10
          speaker: narrator
          text: "Anne answered quickly, almost pertly, Marilla thought. Still, Marilla meant to be fair."
        - id: ch01-b11
          speaker: marilla_cuthbert
          text: "I'll look once more. If you put it back, it will still be there. If it isn't, then I'll know you didn't."
        - id: ch01-b12
          speaker: narrator
          text: "Marilla searched her room from top to bottom. She checked the bureau and every other place where the brooch might have gone. It was nowhere. She returned to the kitchen."
        - id: ch01-b13
          speaker: marilla_cuthbert
          text: "Anne, the brooch is gone. You admit you were the last person to touch it. Tell me the truth right now. Did you take it away and lose it?"
        - id: ch01-b14
          speaker: anne_shirley
          text: "No, I did not. I never took that brooch out of your room. That's the truth, even if I were led to the block for it, though I'm not quite sure what a block is. So there, Marilla."
        - id: ch01-b15
          speaker: narrator
          text: "Anne looked straight into Marilla's angry eyes. She meant so there only to make her claim stronger. Marilla heard defiance in it instead."
        - id: ch01-b16
          speaker: marilla_cuthbert
          text: "I believe you're telling me a lie, Anne. In fact, I know you are. Don't say another word unless you're ready to tell the whole truth. Go to your room and stay there until you confess."
          emotion: angry
        - id: ch01-b17
          speaker: anne_shirley
          text: "Should I take the peas with me?"
        - id: ch01-b18
          speaker: marilla_cuthbert
          text: "No. I'll finish them. Now do as I told you."
        - id: ch01-b19
          speaker: narrator
          text: "After Anne left, Marilla went through her chores with a deeply troubled mind. The brooch was valuable. What if Anne had lost it? Worse still, how could the child deny taking it when everything pointed to her? And she had looked so innocent."
        - id: ch01-b20
          speaker: narrator
          text: "As Marilla nervously shelled peas, her thoughts went round and round. Of all the things that might have happened, she could hardly imagine one she would have disliked more. She didn't believe Anne had meant to steal the brooch. Most likely she had borrowed it to play with, or to help one of her imagined adventures feel real. Then she had lost it and grown afraid to admit what she had done because she expected punishment. No one else had entered the room between Anne's visit and Marilla's search. To Marilla, the answer seemed plain. The brooch was certainly gone, and Anne must have taken it. But the thought that Anne might be sly and untruthful upset Marilla more than losing the brooch. It felt even worse than Anne's terrible fit of temper. How could she be responsible for a child she couldn't trust? If Anne had only told the truth, Marilla felt she could have borne the rest."
        - id: ch01-b21
          speaker: narrator
          text: "At intervals all evening, Marilla returned to her room and searched again. She looked in every place she could think of, but the brooch never appeared. At bedtime, she went to the east gable and questioned Anne once more. Nothing changed. Anne kept saying she knew nothing about the missing brooch, and each denial only made Marilla more certain that she did."
    - id: ch02
      title: A Confession for the Picnic
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: "The next morning, Marilla told Matthew the whole story. He was bewildered. He couldn't give up his faith in Anne so quickly, though he had to admit the facts looked bad."
        - id: ch02-b02
          speaker: matthew_cuthbert
          text: "Are you sure it didn't fall behind the bureau?"
        - id: ch02-b03
          speaker: marilla_cuthbert
          text: "I moved the bureau, took out the drawers, and searched every crack and corner. The brooch is gone. That child took it and lied about it. It's an ugly truth, Matthew Cuthbert, but we'd better face it."
        - id: ch02-b04
          speaker: matthew_cuthbert
          text: "Well now, what do you mean to do?"
        - id: ch02-b05
          speaker: narrator
          text: "Matthew asked with a gloomy look, secretly grateful that Marilla had to handle the problem. This time, he had no wish to interfere."
        - id: ch02-b06
          speaker: marilla_cuthbert
          text: "She'll remain in her room until she confesses. Once she tells us where she took it, perhaps we can find it. Either way, she'll need a serious punishment."
        - id: ch02-b07
          speaker: matthew_cuthbert
          text: "Then you'll have to punish her. I want it remembered that you warned me not to interfere."
        - id: ch02-b08
          speaker: narrator
          text: "Matthew reached for his hat, leaving Marilla to feel that everyone had deserted her. She couldn't even ask Mrs. Lynde for advice. Marilla climbed to the east gable with a grave face and came away looking graver than before. Anne would not confess. Again and again, she insisted she had never taken the brooch. Marilla could see that the child had been crying. She felt a stab of pity, but firmly pushed it down. The hours passed without any change, and by night Marilla was worn out."
        - id: ch02-b09
          speaker: marilla_cuthbert
          text: "You'll stay in this room until you confess, Anne. You may as well make up your mind to it."
        - id: ch02-b10
          speaker: anne_shirley
          text: "But the picnic is tomorrow! You won't stop me from going, will you, Marilla? Please let me out just for the afternoon. Afterward, I'll stay here as long as you want, and I'll do it cheerfully. But I have to go to that picnic."
        - id: ch02-b11
          speaker: marilla_cuthbert
          text: "You won't go to a picnic or anywhere else until you've confessed."
        - id: ch02-b12
          speaker: anne_shirley
          text: "Oh, Marilla!"
          emotion: fearful
        - id: ch02-b13
          speaker: narrator
          text: "Marilla left and closed the door."
        - id: ch02-b14
          speaker: narrator
          text: "Wednesday morning was so bright and lovely that it seemed made especially for the picnic. Birds sang all around Green Gables. The Madonna lilies in the garden sent out soft breaths of perfume. Unseen breezes carried the scent through open doors and windows, then let it wander along the halls and into the rooms like a blessing. Down in the hollow, the birches waved joyful hands, as though they were waiting for Anne's usual morning greeting from the east gable. But Anne was not at her window."
        - id: ch02-b15
          speaker: narrator
          text: "When Marilla carried up breakfast, she found Anne sitting straight on her bed. The child looked pale and determined. Her lips were pressed tight, and her eyes gleamed."
        - id: ch02-b16
          speaker: anne_shirley
          text: "Marilla, I'm ready to confess."
        - id: ch02-b17
          speaker: narrator
          text: "Marilla set down the tray. Her method had worked again, but this victory tasted bitter."
        - id: ch02-b18
          speaker: marilla_cuthbert
          text: "All right. Tell me what you have to say."
        - id: ch02-b19
          speaker: anne_shirley
          text: "I took the amethyst brooch, just as you said. I didn't plan to take it when I went into your room. But it looked so beautiful when I pinned it on my dress that I was overcome by a temptation I couldn't resist. I thought how perfectly thrilling it would be to wear it to Idlewild and pretend I was Lady Cordelia Fitzgerald. It's so much easier to imagine you're Lady Cordelia when you're wearing a real amethyst brooch. Diana and I make necklaces out of roseberries, but what are roseberries compared with amethysts?"
        - id: ch02-b20
          speaker: anne_shirley
          text: "So I took it. I meant to return it before you came home, and I walked the long way around by the road so I'd have more time. On the bridge over the Lake of Shining Waters, I took the brooch off for one more look. How it shone in the sunlight! Then I leaned over the bridge, and it slipped right through my fingers. Down it went, sparkling purple all the way, until it sank forever under the Lake of Shining Waters. That's the best confession I can give you, Marilla."
        - id: ch02-b21
          speaker: narrator
          text: "Anne spoke as though she were reciting a lesson. Anger flooded Marilla again. Her treasured brooch was lost, and Anne calmly told the story without looking sorry at all."
        - id: ch02-b22
          speaker: marilla_cuthbert
          text: "Anne, this is dreadful. You are the wickedest girl I have ever heard of."
          emotion: angry
        - id: ch02-b23
          speaker: anne_shirley
          text: "Yes, I suppose I am. I know you have to punish me. It's your duty, Marilla. Could you please do it right away? Then I can go to the picnic without the punishment hanging over me."
        - id: ch02-b24
          speaker: marilla_cuthbert
          text: "The picnic? You will not go today, Anne Shirley. Missing it will be your punishment, and that isn't nearly severe enough for what you've done."
        - id: ch02-b25
          speaker: narrator
          text: "Anne jumped up and grabbed Marilla's hand."
        - id: ch02-b26
          speaker: anne_shirley
          text: "Not go? But you promised I could! Marilla, I must go. That's why I confessed. Punish me any other way you want, but please don't keep me from the picnic. Think of the ice cream! I may never get another chance to taste it."
        - id: ch02-b27
          speaker: marilla_cuthbert
          text: "Begging won't help. You are not going, and that is final. Don't say another word."
        - id: ch02-b28
          speaker: narrator
          text: "Marilla pulled her hands free. Anne knew there was no changing her mind. She clasped her own hands, let out a piercing shriek, and threw herself face down on the bed. She cried and twisted in complete despair."
        - id: ch02-b29
          speaker: marilla_cuthbert
          text: "For the land's sake! I believe this child is crazy. No sensible child would carry on this way. If she isn't crazy, then she's thoroughly bad. Oh dear, perhaps Rachel was right from the beginning. But I've put my hand to the plow, and I won't turn back now."
          emotion: surprised
    - id: ch03
      title: The Truth in the Black Lace Shawl
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: "It was a miserable morning. Marilla worked with fierce energy. When she ran out of necessary chores, she scrubbed the porch floor and the dairy shelves, though neither one needed it. Marilla needed it. Then she raked the yard."
        - id: ch03-b02
          speaker: narrator
          text: "At dinnertime, Marilla stood at the foot of the stairs and called. Anne's tear-streaked face appeared above the banisters."
        - id: ch03-b03
          speaker: marilla_cuthbert
          text: "Come down and eat your dinner, Anne."
        - id: ch03-b04
          speaker: anne_shirley
          text: "I don't want any dinner. I couldn't eat. My heart is broken. Someday your conscience will trouble you for breaking it, Marilla, but I forgive you. When that day comes, remember that I forgave you. Please don't ask me to eat, especially not boiled pork and greens. They're so terribly unromantic when a person is suffering."
          emotion: sad
        - id: ch03-b05
          speaker: narrator
          text: "Marilla went back to the kitchen in exasperation and poured out her troubles to Matthew. He was caught between his sense of fairness and his forbidden sympathy for Anne. It made him miserable. He knew taking the brooch and lying about it were wrong. Yet it was hard for him to forget how small Anne was, or how fiercely she had longed for this one picnic."
        - id: ch03-b06
          speaker: matthew_cuthbert
          text: "Well now, she shouldn't have taken the brooch or made up stories about it. Still, she's such a little thing, and such an interesting little thing. Don't you think keeping her from the picnic is a bit hard, when she cares so much about going?"
        - id: ch03-b07
          speaker: narrator
          text: "Matthew looked sadly at his pork and greens, as if he agreed with Anne that they were no meal for a time of deep feeling."
        - id: ch03-b08
          speaker: marilla_cuthbert
          text: "Matthew Cuthbert, you amaze me. I've been much too easy on her. What worries me most is that she doesn't seem to understand how wrong she was. It would be different if she were truly sorry. And you don't understand it either. You're forever making excuses for her. I can see it."
        - id: ch03-b09
          speaker: matthew_cuthbert
          text: "Well now, she is very little. We ought to make some allowance for her. You know she's never had anyone bring her up properly."
        - id: ch03-b10
          speaker: marilla_cuthbert
          text: "She has someone doing it now."
        - id: ch03-b11
          speaker: narrator
          text: "That answer silenced Matthew, even if it didn't persuade him. Dinner stayed gloomy. Jerry Buote, the hired boy, was the only cheerful person at the table, and Marilla took his good spirits almost as a personal insult."
        - id: ch03-b12
          speaker: narrator
          text: "After washing the dishes, setting the bread sponge, and feeding the hens, Marilla remembered a small tear in her best black lace shawl. She had noticed it on Monday afternoon, when she took the shawl off after coming home from the Ladies' Aid. Now she decided to mend it. The shawl lay carefully folded in a box inside her trunk."
        - id: ch03-b13
          speaker: narrator
          text: "As Marilla lifted the shawl, sunlight streamed through the thick vines around the window. It struck something caught in the lace. Violet light flashed from tiny shining surfaces. Marilla gasped and snatched it up. Her amethyst brooch was hanging by its clasp from a thread of the shawl."
        - id: ch03-b14
          speaker: marilla_cuthbert
          text: "Dear life and heart, what can this mean? Here's my brooch, safe and sound, when I thought it was at the bottom of Barry's pond. Why did that girl say she took it and lost it? I believe Green Gables must be bewitched. Wait. When I took this shawl off on Monday, I laid it on the bureau for a moment. The brooch must have caught in the lace. Well!"
          emotion: surprised
        - id: ch03-b15
          speaker: narrator
          text: "Brooch in hand, Marilla went straight to the east gable. Anne had no tears left. She sat sadly beside the window."
        - id: ch03-b16
          speaker: marilla_cuthbert
          text: "Anne Shirley, I found my brooch hanging from my black lace shawl. Now tell me what that long tale you gave me this morning was all about."
        - id: ch03-b17
          speaker: anne_shirley
          text: "You said you'd keep me here until I confessed, so I decided to confess because I had to get to the picnic. I made up a confession in bed last night and tried to make it as interesting as possible. I practiced it over and over so I wouldn't forget. But then you wouldn't let me go anyway, so all that work was wasted."
        - id: ch03-b18
          speaker: narrator
          text: "Marilla couldn't help laughing. At the same time, her conscience stung her."
        - id: ch03-b19
          speaker: marilla_cuthbert
          text: "Anne, there is no one else like you. But I was wrong, and I see that now. I had never caught you telling a lie, so I shouldn't have doubted your word. It was still wrong to confess to something you hadn't done. Very wrong. But I pushed you into it. If you'll forgive me, I'll forgive you, and we'll begin again with everything even. Now get ready for the picnic."
        - id: ch03-b20
          speaker: narrator
          text: "Anne shot to her feet like a rocket."
        - id: ch03-b21
          speaker: anne_shirley
          text: "Oh, Marilla, are we too late?"
          emotion: surprised
        - id: ch03-b22
          speaker: marilla_cuthbert
          text: "No. It's only two o'clock. Everyone will hardly be gathered yet, and tea won't be served for another hour. Wash your face, comb your hair, and put on your gingham dress. I'll pack a basket. There's plenty of baking in the house. Then Jerry can hitch up the sorrel and drive you to the picnic grounds."
        - id: ch03-b23
          speaker: anne_shirley
          text: "Oh, Marilla! Five minutes ago, I was so miserable that I wished I'd never been born. Now I wouldn't trade places with an angel!"
          emotion: happy
    - id: ch04
      title: A Scrumptious Time
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: "That night, Anne came home to Green Gables completely tired and completely happy. She seemed wrapped in a happiness too great for words."
        - id: ch04-b02
          speaker: anne_shirley
          text: "Oh, Marilla, I had a perfectly scrumptious time! Scrumptious is a new word I learned today. Mary Alice Bell used it. Isn't it wonderfully expressive? Everything was lovely. We had a splendid tea. Then Mr. Harmon Andrews took us rowing on the Lake of Shining Waters, six at a time."
          emotion: happy
        - id: ch04-b03
          speaker: anne_shirley
          text: "Jane Andrews almost fell out of the boat. She leaned over to pick water lilies, and Mr. Andrews caught her by the sash just in time. Otherwise, she probably would have fallen in and drowned. I wish it had been me. Nearly drowning would be such a romantic experience and such a thrilling story to tell."
        - id: ch04-b04
          speaker: anne_shirley
          text: "And we had the ice cream! I have no words good enough for that ice cream, Marilla. I promise you, it was sublime."
          emotion: happy
        - id: ch04-b05
          speaker: narrator
          text: "Later that evening, Marilla sat with her basket of stockings and told Matthew the entire story, from the missing brooch to Anne's remarkable confession and the truth hidden in the lace shawl."
        - id: ch04-b06
          speaker: marilla_cuthbert
          text: "I'm willing to admit I made a mistake, and I've learned from it. I have to laugh whenever I remember Anne's confession, though perhaps I shouldn't. It was a lie, after all. Somehow, it doesn't seem as bad as the lie I thought she'd told, and I'm responsible for driving her to it. That child can be very hard to understand. Still, I believe she'll turn out all right. One thing is certain. Any house with Anne in it will never be dull."
