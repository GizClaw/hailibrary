cover_prompt: |-
  A wordless cover scene on Prince Edward Island in the late nineteenth century shows Anne Shirley arriving at Green Gables in spring. Anne is a thin eleven-year-old girl with vivid red hair in two long braids, eager gray-green eyes, freckles, a plain brown traveling dress, and a battered carpetbag. Matthew Cuthbert, a shy older farmer with a grizzled beard, dark suit, and broad felt hat, stands beside a horse-drawn buggy as Anne gazes toward the white farmhouse with green shutters. Anne's delighted forward step into the orchard is the focal action, with apple blossoms, red earth, and distant fields surrounding her. Use a welcoming eye-level three-quarter view and leave a broad area of pale evening sky above the farmhouse roof. Keep clothing, transport, and architecture accurate to rural 1870s Canada and independent of television or film adaptations. No readable text, letters, numbers, labels, logos, captions, speech bubbles, signatures, or watermarks.
