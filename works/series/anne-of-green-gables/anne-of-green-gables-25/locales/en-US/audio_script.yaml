  chapters:
    - id: ch01
      title: What Matthew Noticed
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: "Matthew was having a miserable ten minutes. One cold, gray December evening, he came into the kitchen at twilight and sat by the woodbox to pull off his heavy boots. He had no idea that Anne and several school friends were practicing The Fairy Queen in the sitting room. Soon the girls streamed through the hall into the kitchen, laughing and talking. They never noticed Matthew. With one boot in his hand and the bootjack in the other, he drew back shyly into the shadows and watched them put on their caps and jackets and chatter about the concert."
        - id: ch01-b02
          speaker: narrator
          text: "Anne stood among them with the same bright eyes and lively manner, yet something about her was different. Matthew felt sure it was a difference that should not be there. Her face was brighter, her eyes were bigger and more starry, and her features were finer than the others. Even shy, unobservant Matthew had learned to notice that much. But none of those things troubled him. So what was it?"
        - id: ch01-b03
          speaker: narrator
          text: "The question stayed with him after the girls went arm in arm down the long, frozen lane and Anne turned to her books. He could not ask Marilla. She would probably sniff and say the only difference was that the other girls sometimes stopped talking while Anne never did. Matthew knew that would not help."
        - id: ch01-b04
          speaker: narrator
          text: "That evening he reached for his pipe, much to Marilla's disgust, and spent two hours smoking and thinking. At last the answer came. Anne did not dress like the other girls."
        - id: ch01-b05
          speaker: narrator
          text: "The longer he considered it, the more certain he became. Since Anne had arrived at Green Gables, Marilla had dressed her in plain, dark dresses, every one made from the same unchanging pattern. Matthew knew almost nothing about clothing or fashion. Knowing that fashion existed was about the limit of his knowledge. Still, he could see that Anne's sleeves looked nothing like the sleeves the other girls wore. He remembered the little group around her that evening, all dressed brightly in red, blue, pink, and white waists. Why did Marilla always make Anne look so plain and sober beside them?"
        - id: ch01-b06
          speaker: narrator
          text: "Of course Marilla must be right. She knew best and was raising Anne, no doubt for some wise reason Matthew could not understand. But surely one pretty dress would do no harm, something like Diana Barry wore. He would give Anne one for Christmas, only two weeks away. That could hardly count as interfering. Satisfied, Matthew put away his pipe and went to bed while Marilla opened every door to air out the house."
    - id: ch02
      title: Matthew Goes Shopping
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: "The very next evening, Matthew drove to Carmody, determined to buy the dress, get the ordeal over with, and be done. He felt certain it would be no small trial. There were things he could buy quite well, and he could be a shrewd bargainer when he understood the goods. A girl's dress was another matter entirely. The moment he tried to buy one, he knew he would be helpless before the shopkeeper."
        - id: ch02-b02
          speaker: narrator
          text: "After a great deal of thought, he chose Samuel Lawson's store instead of William Blair's. The Cuthberts had always shopped at Blair's. It was nearly as serious a tradition as attending the Presbyterian church and voting Conservative. But Blair's two daughters often served customers, and Matthew dreaded them. He could manage if he knew exactly what he needed and could point to it. A dress required explanations and advice, so he needed a man behind the counter. Samuel Lawson or his son would surely wait on him."
        - id: ch02-b03
          speaker: narrator
          text: "Unfortunately, Samuel had recently hired a lady clerk. Lucilla Harris was his wife's niece, a very stylish young woman with a huge drooping pompadour, big rolling brown eyes, and a wide, dazzling smile. Her clothes were exceedingly smart. Several bracelets glittered, rattled, and chimed whenever she moved her hands. Matthew was utterly confused just to find her there, and the bracelets finished off every sensible thought in his head."
        - id: ch02-b04
          speaker: lucilla_harris
          text: "Good evening, Mr. Cuthbert. What can I get for you?"
        - id: ch02-b05
          speaker: narrator
          text: "She tapped both hands briskly on the counter."
        - id: ch02-b06
          speaker: matthew_cuthbert
          text: "Have you got any... any... well now, any garden rakes?"
        - id: ch02-b07
          speaker: narrator
          text: "Miss Harris looked surprised. Anyone would, when a man asked for a garden rake in the middle of December."
        - id: ch02-b08
          speaker: lucilla_harris
          text: "There may be one or two left upstairs in the lumber room. I'll go check."
        - id: ch02-b09
          speaker: narrator
          text: "While she was gone, Matthew gathered his scattered wits and prepared to try again. She returned carrying a rake."
        - id: ch02-b10
          speaker: lucilla_harris
          text: "Will there be anything else tonight, Mr. Cuthbert?"
        - id: ch02-b11
          speaker: narrator
          text: "Matthew seized all the courage he had."
        - id: ch02-b12
          speaker: matthew_cuthbert
          text: "Well now, since you mention it, I might as well take... that is, look at... buy some hayseed."
        - id: ch02-b13
          speaker: narrator
          text: "Miss Harris had heard people call Matthew Cuthbert odd. Now she decided he was completely crazy."
        - id: ch02-b14
          speaker: lucilla_harris
          text: "We only carry hayseed in the spring. There isn't any here now."
        - id: ch02-b15
          speaker: matthew_cuthbert
          text: "Oh, certainly. Certainly. Just as you say."
        - id: ch02-b16
          speaker: narrator
          text: "The unhappy man grabbed the rake and hurried for the door. At the threshold, he remembered he had not paid and turned miserably back. While Miss Harris counted his change, he gathered himself for one last desperate attempt."
        - id: ch02-b17
          speaker: matthew_cuthbert
          text: "Well now, if it isn't too much trouble, I might as well... I'd like to see some sugar."
        - id: ch02-b18
          speaker: lucilla_harris
          text: "White or brown?"
        - id: ch02-b19
          speaker: matthew_cuthbert
          text: "Oh... well now... brown."
        - id: ch02-b20
          speaker: lucilla_harris
          text: "The barrel is over there. Brown is the only kind we have."
        - id: ch02-b21
          speaker: narrator
          text: "Her bracelets shook as she pointed. Beads of sweat stood on Matthew's forehead."
        - id: ch02-b22
          speaker: matthew_cuthbert
          text: "I'll... I'll take twenty pounds."
        - id: ch02-b23
          speaker: narrator
          text: "Matthew drove halfway home before he felt like himself again. The visit had been a gruesome experience. Still, he thought it served him right for committing the heresy of shopping at a strange store after all those years at William Blair's. At home, he slipped the useless December rake into the tool house where no one would see it. The twenty pounds of sugar could not be hidden so easily, so he carried that inside to Marilla."
        - id: ch02-b24
          speaker: marilla_cuthbert
          text: "Brown sugar! What made you buy so much? I only use that for a hired man's porridge or black fruitcake. Jerry's gone, and my cake was baked long ago. This isn't even good sugar. It's coarse and dark. William Blair doesn't usually sell anything like it."
          emotion: surprised
        - id: ch02-b25
          speaker: matthew_cuthbert
          text: "I... I thought it could come in handy sometime."
        - id: ch02-b26
          speaker: narrator
          text: "Then Matthew escaped."
    - id: ch03
      title: A Christmas Surprise
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: "Once Matthew thought the matter through, he knew a woman would have to handle the dress. He could never face another attempt like the one at Lawson's. Marilla was impossible too. He felt certain she would throw cold water on the whole plan before it began. That left Mrs. Lynde. There was no other woman anywhere in Avonlea whom Matthew would have dared to ask for advice on such a subject. He went to her, and the capable Mrs. Lynde promptly took the entire problem out of his tired hands."
        - id: ch03-b02
          speaker: rachel_lynde
          text: "Choose a dress for Anne? Why, of course. I'm going to Carmody tomorrow, so I'll see to it. Did you have anything particular in mind? No? Then I'll use my own judgment. A rich brown would suit Anne, and William Blair has some lovely new gloria cloth. Would you like me to sew it too? If Marilla made it, Anne might discover the surprise. I'll do it. Sewing is no trouble to me. My niece Jenny Gillis is just about Anne's size, so I can fit it to her."
        - id: ch03-b03
          speaker: matthew_cuthbert
          text: "Well now, I'm much obliged. And... I don't know... but sleeves are made differently these days, aren't they? If it isn't asking too much, I'd like them done the new way."
        - id: ch03-b04
          speaker: rachel_lynde
          text: "Puffed sleeves? Certainly. Don't worry about another thing, Matthew. I'll make it in the very latest style."
        - id: ch03-b05
          speaker: narrator
          text: "After Matthew left, Mrs. Lynde continued the conversation with herself."
        - id: ch03-b06
          speaker: rachel_lynde
          text: "It'll be a pleasure to see that poor child in something decent for once. Marilla dresses her ridiculously, and I've nearly told her so a dozen times. I've kept quiet because Marilla doesn't want advice. She thinks she knows more about raising children than I do, even though she's an old maid. That's always how it is. People who've raised children know that no single strict method works for every child. People who haven't think it's as simple as arithmetic. Put down three numbers, follow the rule, and out comes the correct answer. But children aren't arithmetic, and that's Marilla Cuthbert's mistake."
        - id: ch03-b07
          speaker: rachel_lynde
          text: "I suppose she wants those plain clothes to teach Anne humility. They're more likely to teach her envy and discontent. That child must notice how different she looks beside the other girls. Marilla means well, but flesh and blood won't behave like a sum written on a slate. A girl isn't an answer you can get by following one fixed rule. But imagine Matthew noticing the clothes too! That man is finally waking up after sleeping for more than sixty years."
        - id: ch03-b08
          speaker: narrator
          text: "For the next two weeks, Marilla knew Matthew had something on his mind. He looked mysterious and sometimes grinned to himself, but she could not guess his secret. The answer came on Christmas Eve, when Mrs. Lynde carried the finished dress up to Green Gables. On the whole, Marilla behaved fairly well. Mrs. Lynde explained very diplomatically that Matthew had asked her to sew it because Anne might discover the gift too soon if Marilla made it. Marilla listened, though she very likely distrusted that explanation."
        - id: ch03-b09
          speaker: marilla_cuthbert
          text: "So this is why Matthew has looked so mysterious and grinned to himself for two weeks. I knew he was planning some foolishness. Anne didn't need another dress. I made her three warm, practical ones this fall. Anything more is pure extravagance. Those sleeves alone have enough cloth for a whole waist. You'll only pamper her vanity, Matthew, and she's already as vain as a peacock."
        - id: ch03-b10
          speaker: marilla_cuthbert
          text: "Well, I hope she's satisfied now. She's wanted those silly sleeves ever since they appeared, though she never mentioned them again after the first time. The puffs keep getting larger and more absurd. They're as big as balloons now. Next year, anyone wearing them will have to turn sideways to get through a door."
        - id: ch03-b11
          speaker: narrator
          text: "Christmas morning opened on a beautiful white world. December had been so mild that everyone expected a green Christmas. Then just enough snow fell softly overnight to transform Avonlea. Anne looked from her frosted gable window in delight. The firs in the Haunted Wood were feathery and wonderful. Pearl outlined the birches and wild cherry trees. The plowed fields stretched away in snowy dimples, and the crisp air had a glorious bite. Anne ran downstairs singing until her voice echoed through Green Gables."
        - id: ch03-b12
          speaker: anne_shirley
          text: "Merry Christmas, Marilla! Merry Christmas, Matthew! Isn't this a lovely Christmas? I'm so glad it's white. Any other kind doesn't feel real. I don't like green Christmases. They aren't green at all, only ugly faded brown and gray. Why does anyone call them green? Why... Matthew, is that for me? Oh, Matthew!"
          emotion: surprised
        - id: ch03-b13
          speaker: narrator
          text: "Matthew had shyly opened the paper wrappings and held up the dress, glancing nervously at Marilla as if he expected her to object at any moment. She pretended to be completely occupied with filling the teapot. Even so, she watched the scene from the corner of her eye with real interest. Anne took the dress and gazed at it in reverent silence. It was beautiful. The soft brown gloria had all the rich gloss of silk. The skirt was finished with delicate frills and rows of gathering. The waist had been carefully tucked in the newest fashion, and a little ruffle of airy lace circled the neck. But the sleeves were the crowning glory. Long fitted cuffs reached the elbows. Above them rose two splendid puffs, divided by more rows of gathering and tied with bows of brown silk ribbon."
        - id: ch03-b14
          speaker: matthew_cuthbert
          text: "That's your Christmas present, Anne. Why... why, don't you like it? Well now... well now."
        - id: ch03-b15
          speaker: narrator
          text: "Anne's eyes had suddenly filled with tears. She laid the dress over a chair and clasped her hands."
        - id: ch03-b16
          speaker: anne_shirley
          text: "Like it? Oh, Matthew! It's absolutely exquisite. I could never thank you enough. Just look at those sleeves! This must be a wonderful dream."
          emotion: happy
        - id: ch03-b17
          speaker: marilla_cuthbert
          text: "Well, breakfast is ready. I still don't think you needed the dress, Anne, but Matthew bought it, so take good care of it. Mrs. Lynde left you a brown hair ribbon to match. Come sit down now."
        - id: ch03-b18
          speaker: anne_shirley
          text: "How can I eat breakfast? Breakfast seems so ordinary at a moment like this. I'd rather look at my dress. I'm so thankful puffed sleeves are still in fashion. If they had gone out before I owned any, I don't think I would've ever gotten over it. I never would've felt completely satisfied. And giving me the ribbon was so kind of Mrs. Lynde."
        - id: ch03-b19
          speaker: anne_shirley
          text: "I feel as if I ought to become a very good girl. Moments like this make me sorry I'm not a model child, and I always promise myself I'll be one from now on. Somehow, when an irresistible temptation comes along, keeping those promises is hard. But after this, I'm truly going to try harder."
    - id: ch04
      title: The Concert
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: "After the ordinary breakfast, Diana appeared on the white log bridge down in the hollow, a cheerful little figure in a crimson coat. Anne raced down the slope to meet her."
        - id: ch04-b02
          speaker: anne_shirley
          text: "Merry Christmas, Diana! Oh, what a wonderful Christmas this is. I have something magnificent to show you. Matthew gave me the loveliest dress, and the sleeves! I couldn't have imagined anything prettier."
          emotion: happy
        - id: ch04-b03
          speaker: diana_barry
          text: "And I have another present for you. Here, take this box. Aunt Josephine sent us a huge package full of things, and this one is yours. I would've brought it last night, but it arrived after dark. I still don't feel comfortable walking through the Haunted Wood at night."
        - id: ch04-b04
          speaker: narrator
          text: "Anne lifted the lid. On top was a card that read, For the Anne-girl, and Merry Christmas. Beneath it lay the daintiest pair of kid slippers, with beaded toes, satin bows, and sparkling buckles."
        - id: ch04-b05
          speaker: anne_shirley
          text: "Oh, Diana, this is too much. I have to be dreaming."
          emotion: surprised
        - id: ch04-b06
          speaker: diana_barry
          text: "I'd call it providential. Now you don't need Ruby's slippers. They're two sizes too big, and imagine how terrible a shuffling fairy would sound. Josie Pye would love that. And listen, Rob Wright walked Gertie Pye home after practice the night before last. Can you believe it?"
        - id: ch04-b07
          speaker: narrator
          text: "Every Avonlea student spent that Christmas Day in a fever of excitement. The hall still had to be decorated, and then everyone had to gather for one final grand rehearsal. That evening the concert was a clear and undeniable success. The little hall was crowded. The audience filled every available place, and all the young performers did excellently well. Yet Anne stood out as the bright particular star of the night. Even envy itself, appearing in the form of Josie Pye, did not dare deny that Anne had triumphed."
        - id: ch04-b08
          speaker: narrator
          text: "Afterward, Anne and Diana walked home beneath a dark sky full of stars."
        - id: ch04-b09
          speaker: anne_shirley
          text: "Wasn't it a brilliant evening?"
          emotion: happy
        - id: ch04-b10
          speaker: diana_barry
          text: "Everything went very well. We must've earned at least ten dollars. And Mr. Allan is sending a report about the concert to the Charlottetown newspapers."
        - id: ch04-b11
          speaker: anne_shirley
          text: "Diana, will our names truly appear in print? Just thinking about it gives me a thrill. Your solo was perfectly elegant. When the audience asked for another, I felt even prouder than you did. I kept thinking, that's my own dear bosom friend receiving such an honor."
        - id: ch04-b12
          speaker: diana_barry
          text: "Your recitations made everyone applaud, Anne. That sad one was wonderful."
        - id: ch04-b13
          speaker: anne_shirley
          text: "Oh, I was terribly nervous. When Mr. Allan announced my name, I honestly don't know how I stood up or reached the platform. It felt as if a million eyes were staring at me, and every one of them could see straight through me. For one awful moment, I was certain I couldn't speak the first word. Then I remembered my beautiful puffed sleeves, and they gave me courage. I knew I had to live up to those sleeves, Diana. I couldn't disgrace a dress like that by failing."
        - id: ch04-b14
          speaker: anne_shirley
          text: "Once I began, my voice sounded very far away, and I felt like a parrot. Thank goodness I practiced so often in the attic, or I never could've finished. Was my groan good?"
        - id: ch04-b15
          speaker: diana_barry
          text: "Oh yes. You groaned beautifully."
        - id: ch04-b16
          speaker: anne_shirley
          text: "I saw old Mrs. Sloane wiping her eyes when I sat down. Knowing I'd touched someone's heart was splendid. Taking part in a concert is so romantic, isn't it? This really has been an unforgettable occasion."
        - id: ch04-b17
          speaker: diana_barry
          text: "The boys' dialogue was good too. Gilbert Blythe was splendid. Anne, the way you treat Gil is terribly mean. And I have to tell you something. After the fairy dialogue, you ran off the stage and one of your roses fell from your hair. I saw Gil pick it up and put it in his breast pocket. There. You're such a romantic person, you ought to like that."
        - id: ch04-b18
          speaker: anne_shirley
          text: "Whatever that person chooses to do means nothing to me. I never give him a single thought, Diana."
    - id: ch05
      title: By the Kitchen Fire
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: "That night, after Anne went to bed, Marilla and Matthew sat for a while beside the kitchen fire. It was the first concert either of them had attended in twenty years."
        - id: ch05-b02
          speaker: matthew_cuthbert
          text: "Well now, I reckon our Anne performed as well as any of them."
        - id: ch05-b03
          speaker: narrator
          text: "His voice was full of pride."
        - id: ch05-b04
          speaker: marilla_cuthbert
          text: "Yes, she did. She's a bright child, Matthew, and she looked very nice too. I've opposed this concert business, but I suppose there was no real harm in it after all. I was proud of Anne tonight, though I don't intend to tell her."
        - id: ch05-b05
          speaker: matthew_cuthbert
          text: "Well now, I was proud, and I told her before she went upstairs. We ought to think about what we can do for her one of these days, Marilla. Before long, she'll need more than the Avonlea school can give her."
        - id: ch05-b06
          speaker: marilla_cuthbert
          text: "There's plenty of time for that. She won't be thirteen until March. Still, tonight it struck me that she's becoming quite a big girl. I hadn't thought about it until I saw her up there with the others. Mrs. Lynde made the dress a little too long, and that made Anne look especially tall. She learns quickly, and she ought to have the chance to keep learning. I suppose the best thing we can do will be to send her to Queen's Academy after a while. But we don't need to say anything to her about it for another year or two."
        - id: ch05-b07
          speaker: matthew_cuthbert
          text: "Well now, thinking it over now and then won't hurt. Things like that turn out better when they've had plenty of thought."
