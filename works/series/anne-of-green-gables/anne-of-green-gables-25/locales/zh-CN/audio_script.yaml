audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖机智，叙事细腻而自然
        timbre: 清澈柔和的成年女声
        pace: 从容，随情节轻快变化
        pitch: 中音
    anne:
      display_name: 安妮
      tts:
        delivery: 想象丰富，热烈真挚，情绪来得快而鲜明
        timbre: 清亮灵动的少女声
        pace: 偏快，动情时一气呵成
        pitch: 中高音
    marilla:
      display_name: 玛丽拉
      tts:
        delivery: 务实克制，话语干脆，偶尔透出藏起的温情
        timbre: 稳重略低的成年女声
        pace: 稍慢而利落
        pitch: 中低音
    matthew:
      display_name: 马修
      tts:
        delivery: 腼腆温厚，说话简短而真诚
        timbre: 低沉柔和的成年男声
        pace: 缓慢而略有停顿
        pitch: 低音
    lucilla_harris:
      display_name: 露西拉·哈里斯
      tts:
        delivery: 爽快殷勤，待客熟练，困惑时仍保持礼貌
        timbre: 明亮利落的年轻女声
        pace: 轻快清楚
        pitch: 中高音
    mrs_lynde:
      display_name: 林德太太
      tts:
        delivery: 热心果断，见解鲜明，话里带着爽利的评判
        timbre: 饱满有力的成年女声
        pace: 稳健流畅
        pitch: 中音
    diana:
      display_name: 戴安娜
      tts:
        delivery: 亲切诚恳，活泼中带着务实
        timbre: 柔和清甜的少女声
        pace: 自然轻快
        pitch: 中高音
  chapters:
    - id: ch01
      title: 马修发现了那处不同
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 十二月一个阴冷灰暗的傍晚，暮色已经落下来，马修在厨房里度过了很不好受的十分钟。他刚走进来，坐到柴箱旁脱那双厚靴子，压根不知道安妮正和一群女同学在客厅排练《仙后》。没过多久，姑娘们一边欢笑，一边叽叽喳喳地说着话，成群穿过门厅，涌进厨房。谁也没看见他。
        - id: ch01-b02
          speaker: narrator
          text: 马修一手拿靴子，一手拿脱靴器，害羞地缩进柴箱后的暗影里。他就在那里看着她们戴帽子、穿外套，兴高采烈地谈音乐会和对白表演。安妮站在伙伴中间，眼睛明亮，神采飞扬。可马修忽然觉得，她跟其他姑娘有个地方不一样，而且这种差别不该有。
        - id: ch01-b03
          speaker: narrator
          text: 安妮的脸更明艳，眼睛更大，也更像星星，五官比别的姑娘秀气。这些细微的地方，连羞怯又不善观察的马修都已经学会留意了。但真正让他不安的不是这些。那十分钟过去，姑娘们挽着胳膊走过那条冻得硬邦邦的长巷，安妮也回到书本前，那个问题却久久不肯放过马修。究竟是哪儿不同呢？
        - id: ch01-b04
          speaker: narrator
          text: 他没法去问玛丽拉。她一定会哼一声，说别的姑娘偶尔还肯闭嘴，安妮却从来不肯。这样的回答能帮上什么忙？那天晚上，马修只好一边抽烟，一边想，弄得玛丽拉满心厌恶。两个钟头过去，他总算明白了。
        - id: ch01-b05
          speaker: narrator
          text: 安妮穿得和别的姑娘不一样。自从来到绿山墙，她一直穿着玛丽拉做的深色衣裙，朴素得很，式样也件件相同。马修几乎不懂什么叫时装，却看得出安妮的袖子和别人完全两样。那晚围着她的女孩们，上衣有红有蓝，有粉有白，样样鲜亮。为什么玛丽拉总让安妮穿得那么素，那么老气？
        - id: ch01-b06
          speaker: narrator
          text: 玛丽拉当然最懂得怎样教养安妮，背后也许有某种明智而又叫人猜不透的道理。可只让孩子拥有一件像戴安娜常穿的漂亮衣裳，总不会有害处。马修决定由自己送她一件。圣诞节只差两个星期，一件漂亮的新衣裳正好可以当礼物，也不能说是他不该管却偏要插手。想到这里，他满意地收起烟斗，上床睡了。玛丽拉却把所有的门打开，好让满屋烟气散出去。
    - id: ch02
      title: 一把园耙和二十磅红糖
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 第二天傍晚，马修就动身去卡莫迪买衣裳。他想赶紧熬过这一关，早些把事情办完。他心里很清楚，这绝不是什么小考验。平常有些东西他很会买，讲起价来也不差，可一旦要给姑娘挑衣裳，他便只能听凭店员摆布。
        - id: ch02-b02
          speaker: narrator
          text: 卡斯伯特兄妹向来只去威廉·布莱尔的铺子。这件事几乎和去长老会做礼拜、投票支持保守党一样，关系着他们的良心。可布莱尔的两个女儿常在柜台后待客，马修怕极了她们。若是事先清楚自己要什么，只要指着那件东西说买，他还能勉强应付。如今这件事既要解释又要商量，他非找个男店员不可。劳森的店里总会是塞缪尔本人或者他的儿子待客。于是，马修决定破一次例。
        - id: ch02-b03
          speaker: narrator
          text: 马修哪里知道，劳森最近扩充生意，刚请了一位女店员。她叫露西拉·哈里斯，是劳森太太的外甥女，还是个非常时髦招摇的年轻姑娘。高高的蓬松头发垂向额前，棕色大眼睛滴溜溜地转，笑容又灿烂又铺张，叫人看得眼花。她衣着十分入时，手腕上还戴了好几只镯子，两只手每动一下，镯子便跟着闪光，叮叮当当响个不停。马修一看见她便窘得不知如何是好。镯子再一响，他的神智顿时散得干干净净。
        - id: ch02-b04
          speaker: lucilla_harris
          text: 晚上好，卡斯伯特先生。您想买点什么？
        - id: ch02-b05
          speaker: matthew
          text: 你们这儿有没有……有没有……嗯，比方说，园子里用的耙子？
        - id: ch02-b06
          speaker: narrator
          text: 十二月过到一半，竟有人来买园耙，哈里斯小姐自然十分惊讶。
        - id: ch02-b07
          speaker: lucilla_harris
          text: 我想还剩下一两把，不过都在楼上的杂物间。我去找找看。
        - id: ch02-b08
          speaker: narrator
          text: 趁她上楼寻找耙子，马修赶紧把四散的神智一点点收回来，鼓起勇气准备再试一次。哈里斯小姐拿着耙子回到柜台，仍旧笑吟吟地问他今晚还要不要别的东西。马修只好把自己的勇气捧在双手里，勉强开了口。
        - id: ch02-b09
          speaker: matthew
          text: 嗯，既然你问了，我不妨再拿点……我是说，看看……买一点牧草种子。
        - id: ch02-b10
          speaker: narrator
          text: 哈里斯小姐早听说马修·卡斯伯特性情古怪。听完这句话，她认定他已经彻底疯了。
        - id: ch02-b11
          speaker: lucilla_harris
          text: 牧草种子只有春天才卖。现在店里一点也没有。
        - id: ch02-b12
          speaker: matthew
          text: 哦，当然，当然。你说没有，那自然就是没有。
        - id: ch02-b13
          speaker: narrator
          text: 可怜的马修抓起耙子就往门口逃。到了门槛，他才想起自己还没付钱，只得满脸痛苦地转回柜台。哈里斯小姐替他一枚枚数找零时，他又把剩下的全部精神振作起来，准备作最后一次拼死尝试。
        - id: ch02-b14
          speaker: matthew
          text: 嗯，要是不太麻烦，我还想……我想看看糖。
        - id: ch02-b15
          speaker: lucilla_harris
          text: 您要白糖，还是红糖？
        - id: ch02-b16
          speaker: matthew
          text: 哦……那么，就要红糖吧。
        - id: ch02-b17
          speaker: lucilla_harris
          text: 那边有一桶。我们现在只有那一种。
        - id: ch02-b18
          speaker: narrator
          text: 她抬手一指，镯子又叮叮当当地响起来。马修的额头冒出一颗颗汗珠。
        - id: ch02-b19
          speaker: matthew
          text: 我……我要二十磅。
        - id: ch02-b20
          speaker: narrator
          text: 马车走到回家路的一半，马修才重新找回自己。这场经历实在可怕。他觉得这也是活该，谁让他违背老规矩，做出跑进一家陌生铺子这种离经叛道的事。到家以后，他偷偷把那把毫无用处的耙子藏进工具房，二十磅红糖却只能拿进屋交给玛丽拉。
        - id: ch02-b21
          speaker: marilla
          text: 红糖！你到底着了什么魔，买这么多回来？你明明知道，除了给雇工煮粥和做黑色水果蛋糕，我根本不用它。杰里已经走了，今年的蛋糕我也早就做好了。这糖又粗又黑，一点也不好。威廉·布莱尔平常可不会卖这种货色。
        - id: ch02-b22
          speaker: matthew
          text: 我……我只是想，说不定以后什么时候能用得上。
        - id: ch02-b23
          speaker: narrator
          text: 话一说完，马修就逃走了。
    - id: ch03
      title: 林德太太接过了这件事
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 马修静下心来重新想了想，认定这桩难题非得由一个女人解决。玛丽拉绝对不行，她准会立刻给这个计划泼冷水。整个埃文利，除了林德太太，再没有哪个女人是马修敢开口请教的。于是他登门去找她。那位好心的太太一听完，马上把事情从这个备受折磨的男人手里接了过去。
        - id: ch03-b02
          speaker: mrs_lynde
          text: 你要我替你挑一件衣裳送给安妮？当然行。我明天正要去卡莫迪。你没有特别想要的样子，那就让我拿主意吧。浓郁的棕色一定很衬安妮，威廉·布莱尔刚进的格罗丽亚丝毛织物也很漂亮。
        - id: ch03-b03
          speaker: mrs_lynde
          text: 我索性替她做出来。若是叫玛丽拉来做，安妮准会提前发现，惊喜也就没了，你担心的就是这个吧？这真是一点也不麻烦，我本来就喜欢做针线。我照我外甥女珍妮·吉利斯的身量裁就好。论身材，她和安妮简直像一个豆荚里的两颗豆子。
        - id: ch03-b04
          speaker: matthew
          text: 嗯，那可真是太感谢了。还有……我也不大懂，不过如今的袖子，好像和过去不一样。要是不会给你添太多麻烦，我希望袖子也按新式样做。
        - id: ch03-b05
          speaker: mrs_lynde
          text: 你是说泡泡袖吧？当然可以。马修，从现在起你一点也不用再操心，我一定把袖子照眼下最新、最时兴的式样做出来。
        - id: ch03-b06
          speaker: narrator
          text: 马修走后，林德太太心里可痛快了。那可怜的孩子终于能穿上一件像样的衣裳。玛丽拉给安妮做的衣服实在可笑，她早有十几次想把这话明明白白地说出来。可她看得出玛丽拉不想听人劝，还自认为比旁人更懂得怎么教养孩子，所以才一直忍住没说。
        - id: ch03-b07
          speaker: narrator
          text: 林德太太想，事情向来就是这样。真正养过孩子的人都知道，世上根本没有一种死板办法，能放在每个孩子身上都合适。偏偏没养过的，才会把事情看得像三数法一样简单，仿佛照规矩把三项数字一摆，答案就一定正确。可有血有肉的人不能归进算术里。这正是玛丽拉·卡斯伯特弄错的地方。
        - id: ch03-b08
          speaker: narrator
          text: 玛丽拉也许想用朴素衣裳教安妮谦逊，结果却更可能让孩子心里生出嫉妒和不满。安妮每天和同伴在一起，不可能感觉不到自己的衣裳和别人不同。最叫林德太太惊奇的是，马修居然也看出来了。那个仿佛沉睡了六十多年的男人，如今总算醒了。
        - id: ch03-b09
          speaker: narrator
          text: 接下来的两个星期，玛丽拉一直看得出马修心里藏着事，却猜不出是什么。到了圣诞前夜，林德太太把新衣裳送来，谜底终于揭开。她很圆滑地解释说，马修只怕玛丽拉亲手做衣裳时让安妮提前发现，毁掉这份惊喜。玛丽拉多半不相信这套说辞，但总的说来，她的反应还算不错，也算宽容。
        - id: ch03-b10
          speaker: marilla
          text: 原来你这两个星期神神秘秘，还总对着自己发笑，就是为了这个。我早知道你在忙什么傻事。安妮根本不缺衣裳。秋天我才给她做了三件，件件暖和、结实又实用，再多一件就是彻头彻尾的浪费。我敢说，光这两只袖子的料子，恐怕就够做一件上衣了。
        - id: ch03-b11
          speaker: marilla
          text: 马修，你们这样只会把她的虚荣心越宠越大。她如今已经像孔雀那么爱美。好吧，但愿这回她总算能满足。打从这种傻袖子流行起来，她就一心想要一双，只是头一回提过以后，再也没有说出口。那些泡泡越做越大，也越来越可笑，如今简直像气球。到了明年，谁要还穿它，进门恐怕都得侧着身子才行。
    - id: ch04
      title: 白色圣诞节的礼物
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 圣诞节清晨，天地变成了美丽的白色。这个十二月一直很温和，人们原以为要过一个没有雪的绿色圣诞节。没想到夜里悄悄落下一层薄雪，不多不少，分量刚刚好，竟把整个埃文利都变了模样。
        - id: ch04-b02
          speaker: narrator
          text: 安妮满眼欢喜地从结霜的山墙窗户往外看。闹鬼森林里的冷杉披着羽毛似的白雪，显得神奇又美丽。白桦和野樱桃树勾出珍珠色的轮廓。犁过的田野铺满了雪，上面尽是浅浅的小窝。空气又冷又清脆，叫人精神振奋。安妮一路唱着歌跑下楼，歌声在绿山墙里来回回荡。
        - id: ch04-b03
          speaker: anne
          text: 圣诞快乐，玛丽拉！圣诞快乐，马修！今天真美，我太高兴下雪了。没有雪的圣诞节好像根本不是真的。人们还叫它绿色圣诞节，可它一点也不绿，只有褪了色的棕色和灰色。咦，马修，你手里那个是给我的吗？哦，马修！
          emotion: happy
        - id: ch04-b04
          speaker: narrator
          text: 马修不好意思地拆开层层包纸，把衣裳举起来，又带着歉意看了玛丽拉一眼。玛丽拉假装专心往茶壶里装茶叶，仿佛一点也瞧不上这事，眼角却一直偷偷望着。
        - id: ch04-b05
          speaker: narrator
          text: 安妮接过衣裳，怀着近乎敬畏的心情看了半天，一句话也说不出来。柔软的棕色格罗丽亚丝毛料泛着绸缎般的光，裙摆有精巧的荷叶边和细密褶裥，上衣按照最时兴的样子捏出繁复细褶，领口还围了一圈轻柔透明的蕾丝。最美的却是那双袖子。长长的紧袖口上面鼓起两层漂亮泡泡，中间隔着一排排褶裥和棕色丝带结。它们就是整件衣裳最荣耀的王冠。
        - id: ch04-b06
          speaker: matthew
          text: 这是给你的圣诞礼物，安妮。怎么了？你不喜欢吗？
        - id: ch04-b07
          speaker: narrator
          text: 安妮的眼睛忽然盛满泪水。她把衣裳轻轻放在椅背上，双手紧紧合在胸前。
        - id: ch04-b08
          speaker: anne
          text: 喜欢？哦，马修，它美得简直没法形容！我怎么谢你也谢不够。你看看这些袖子！我觉得自己一定是在做一场幸福的梦。
          emotion: happy
        - id: ch04-b09
          speaker: marilla
          text: 好了，好了，先吃早饭。安妮，我还是得说，你并不需要新衣裳。不过马修既然已经送了，你就得好好爱惜。林德太太还留了一根棕色发带，颜色正好跟衣裳相配。现在快坐下来吧。
        - id: ch04-b10
          speaker: anne
          text: 我哪还吃得下早饭呀？在这么激动人心的时候，早饭实在太平凡了。我宁愿只看着这件衣裳，让眼睛对着它好好吃一顿。幸亏泡泡袖还没过时。以前我总觉得，要是自己还没穿过，它们就不再流行了，我一定一辈子也不能释怀，心里永远少了一份满足。
        - id: ch04-b11
          speaker: anne
          text: 林德太太还送我发带，她真好。我现在觉得，自己非得做一个特别好的姑娘不可。每到这种时候，我都遗憾自己不是模范小姑娘，还会下定决心，以后一定要变成那样的人。可是不知道为什么，一碰上难以抗拒的诱惑，决心就不容易守住。不过从今天起，我真的要比从前格外努力。
        - id: ch04-b12
          speaker: narrator
          text: 平凡的早饭结束以后，戴安娜来了。她穿着鲜红色长大衣，像个活泼的小红点，正从洼地里的白色圆木桥上走过。安妮飞奔下坡去迎她。
        - id: ch04-b13
          speaker: anne
          text: 圣诞快乐，戴安娜！这个圣诞节好得不得了。我有一件最棒的东西给你看。马修送了我一条特别美的衣裙，尤其是那双袖子，我连想都想不出更漂亮的了。
          emotion: happy
        - id: ch04-b14
          speaker: diana
          text: 我这儿还有东西要送你呢。喏，给你这个盒子。约瑟芬姑婆给我们寄来一个大箱子，里面装了好多好多东西，这一份就是你的。昨晚箱子天黑以后才到，不然我早就送来了。现在叫我夜里一个人穿过闹鬼森林，我总觉得心里很不自在。
        - id: ch04-b15
          speaker: narrator
          text: 安妮打开盒子，悄悄往里面看。最上面有张卡片，写着送给安妮姑娘，祝圣诞快乐。卡片底下是一双精巧得不能再精巧的小山羊皮舞鞋，鞋尖缀着细小的珠子，还装饰着缎带蝴蝶结和闪闪发亮的搭扣。
        - id: ch04-b16
          speaker: anne
          text: 戴安娜，这实在太多了。我一定还在做梦。
          emotion: surprised
        - id: ch04-b17
          speaker: diana
          text: 我觉得这是上天特意安排的。你不用借鲁比的鞋了，这真是万幸，那双鞋比你的脚大了整整两号。仙女要是拖着脚在台上走路，听起来可太糟了，乔西·派准会高兴得不得了。对了，告诉你一件事。前天晚上排练完，罗布·赖特竟然陪格蒂·派一起回家了。你听过比这更不得了的事吗？
        - id: ch04-b18
          speaker: narrator
          text: 那一天，埃文利所有学生都兴奋得发烧。他们要装饰礼堂，还要进行最后一次盛大彩排。
    - id: ch05
      title: 音乐会的明星
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 晚上的音乐会如期举行，取得了公认的成功。小小的礼堂里挤满观众，每一个表演者都发挥得十分出色。可那一晚最耀眼、最与众不同的明星还是安妮。连化身成乔西·派的嫉妒心，也不敢否认这一点。
        - id: ch05-b02
          speaker: narrator
          text: 音乐会全部结束后，安妮和戴安娜肩并肩走在回家的路上。头顶的夜空一片漆黑，星星却格外明亮，安妮满足地叹了一口气。
        - id: ch05-b03
          speaker: anne
          text: 戴安娜，今晚是不是光彩极了？一切都结束了，我还是觉得像在梦里一样。
          emotion: happy
        - id: ch05-b04
          speaker: diana
          text: 每一样都很顺利。我猜我们至少筹到了十块钱。艾伦先生还要把音乐会的报道寄给夏洛特敦的报纸。
        - id: ch05-b05
          speaker: anne
          text: 我们真的会在报纸上看到自己的名字吗？只是想一想，我就激动得浑身发颤。戴安娜，你的独唱特别优雅。大家请你再唱一遍时，我简直比你自己还骄傲。我当时就在心里说，正在受到这份礼遇的人，正是我最亲爱的知心朋友。
        - id: ch05-b06
          speaker: diana
          text: 可你的背诵让全场都喝彩了。那篇悲伤的作品尤其精彩。
        - id: ch05-b07
          speaker: anne
          text: 我当时紧张得要命。艾伦先生念出我的名字以后，我都不知道自己究竟是怎么站起来，又怎么走上了台。仿佛有一百万双眼睛盯着我，还一直穿过衣服，看进我身体里面。那一刻实在太可怕了，我真以为自己一个字也说不出来。
          emotion: fearful
        - id: ch05-b08
          speaker: anne
          text: 后来我想起自己漂亮的泡泡袖，勇气就回来了。我知道，我一定得配得上这双袖子，绝不能让它们失望。于是我终于开口，可那声音仿佛从很远很远的地方飘过来，我听着自己只像一只鹦鹉。幸亏我在阁楼里把每一篇都练过那么多遍，不然绝对撑不到最后。告诉我，我的呻吟还好吗？
        - id: ch05-b09
          speaker: diana
          text: 当然好，你呻吟得美极了。
        - id: ch05-b10
          speaker: anne
          text: 我坐下时，看见老斯隆太太正在擦眼泪。想到自己的表演真的打动了一颗心，实在太美妙了。能参加一场音乐会，多么浪漫呀！今晚真是个值得永远记住的场合。
          emotion: happy
        - id: ch05-b11
          speaker: diana
          text: 男孩子的对白表演也很好，尤其是吉尔伯特·布莱思，简直棒极了。安妮，我真觉得你对吉尔实在太刻薄了。听我告诉你，演完仙女对白，你从台上跑下去时，头发上掉了一朵玫瑰。我亲眼看见吉尔把它捡起来，放进了胸前的口袋。你那么浪漫，听见这种事总该高兴吧？
        - id: ch05-b12
          speaker: anne
          text: 那个人做什么都跟我没关系。戴安娜，我连一点心思也不会浪费在他身上。
        - id: ch05-b13
          speaker: narrator
          text: 那天晚上，安妮已经上楼睡下，玛丽拉和马修却仍在厨房的炉火旁坐了一阵。他们刚刚一起去听了那场演出。对两个人来说，这也是个很不寻常的夜晚，因为他们已经有整整二十年没去听过一场音乐会了。
        - id: ch05-b14
          speaker: matthew
          text: 嗯，我看咱们安妮演得不比谁差。
        - id: ch05-b15
          speaker: marilla
          text: 的确不差。她是个聪明孩子，马修，今晚看起来也很漂亮。我原先一直不大赞成筹办这个音乐会，可现在想想，它到底没有什么真正的坏处。不管怎么说，我今晚也为安妮感到骄傲，只是我可不会把这句话告诉她。
        - id: ch05-b16
          speaker: matthew
          text: 我也为她骄傲，而且她上楼以前，我已经亲口说给她听了。玛丽拉，往后总有一天，我们得好好想想还能为她做些什么。我看她慢慢长大以后，需要的学问恐怕不只是埃文利学校能教的那些。
        - id: ch05-b17
          speaker: marilla
          text: 现在想还早得很。她到明年三月才满十三岁。不过今晚看着她，我也忽然觉得，她已经快长成大姑娘了。林德太太把衣裳做长了一点，更显得安妮个子高。她学东西很快，我想，再过一阵，我们能为她做的最好安排，就是送她去女王学院。不过这件事一两年内还不用提。
        - id: ch05-b18
          speaker: matthew
          text: 嗯，偶尔先想一想总没有坏处。这种事多想些时候，准会更好。
