audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖机敏，带着含蓄的幽默讲述
        timbre: 清澈柔和
        pace: 舒展而富有变化
        pitch: medium
    anne:
      display_name: 安妮
      tts:
        delivery: 热烈敏感，想象丰富，情绪来得真切而迅速
        timbre: 明亮清脆的少女声
        pace: 偏快，激动时连贯奔涌
        pitch: medium-high
    marilla:
      display_name: 玛丽拉
      tts:
        delivery: 严厉务实，关切藏在克制的话语里
        timbre: 稳定清晰的中年女声
        pace: 从容直接
        pitch: medium-low
    stacy:
      display_name: 史黛西小姐
      tts:
        delivery: 开明亲切，鼓励学生时真诚有力
        timbre: 清亮温和的青年女声
        pace: 清晰适中
        pitch: medium
    josie:
      display_name: 乔西·派
      tts:
        delivery: 直截了当，问话时毫不迟疑
        timbre: 清脆略尖的少女声
        pace: 稍快
        pitch: medium-high
    moody:
      display_name: 穆迪·斯珀吉翁
      tts:
        delivery: 腼腆拘谨，偶尔会因激动脱口而出
        timbre: 稚嫩厚实的少年声
        pace: 自然适中
        pitch: medium
    rachel:
      display_name: 蕾切尔太太
      tts:
        delivery: 快言快语，自信挑剔又不失热心
        timbre: 响亮结实的中年女声
        pace: 明快连贯
        pitch: medium
  chapters:
    - id: ch01
      title: 第三十章　女王学院班成立了
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 十一月的暮色已经沉沉落下，把绿山墙整个围住了。玛丽拉把手里的针线活放到膝上，靠着椅背歇一歇。她的眼睛又酸又累。近来，这种疲倦来得越来越频繁，她模模糊糊地想着，下次进城也许真该请人看看，给自己换一副眼镜了。天色已经接近全黑，厨房里还没有点灯，唯一的亮光来自炉中一跳一跳的红色火焰。
        - id: ch01-b02
          speaker: narrator
          text: 安妮盘腿坐在炉前的小毯子上。她原先在读书，书已经掉到了地上。现在，她望着枫木燃起的明亮火光，嘴边带着笑，思绪早飞进了梦里。那火仿佛把一百个夏天的阳光都熬了出来。雾和彩虹在她眼前搭起闪亮的空中城堡，云端的历险一件接着一件，每一件都胜利收场，也没有一件像现实中的历险那样给她招来麻烦。
        - id: ch01-b03
          speaker: narrator
          text: 玛丽拉静静看着安妮。只有在炉光和暗影交织的屋子里，她才肯让眼里的温柔露出来。把爱说出口，把爱明白地放在脸上，她始终学不会。可她的确深深地爱着这个纤细的灰眼睛女孩，而且越不表露，那份爱就藏得越深。她甚至怕自己太纵容安妮。她隐隐觉得，把整颗心这样系在一个凡人身上，似乎有些不该。于是，她对安妮反而比对一个不那么亲爱的孩子更严，也更挑剔，像是在无意中为这份过深的爱赎罪。
        - id: ch01-b04
          speaker: narrator
          text: 安妮哪里知道这些。她偶尔会难过地想，玛丽拉真难讨好，也不太懂得体谅她。可一想到玛丽拉给了自己多少，她马上又责怪自己，不许自己再想下去。
        - id: ch01-b05
          speaker: marilla
          text: 安妮，今天下午你跟戴安娜出去的时候，史黛西小姐来过。
        - id: ch01-b06
          speaker: narrator
          text: 安妮猛地醒过神来，带着一声叹息，从幻想的世界回到了厨房。
        - id: ch01-b07
          speaker: anne
          text: 史黛西小姐来过？我没在家，太可惜了。玛丽拉，你怎么没叫我？我和戴安娜只是在闹鬼森林里。现在的树林美极了。蕨草、光滑的叶子和蔓越橘全睡着啦，好像有人拿落叶当毯子，把它们盖好，让它们一直睡到春天。我想，一定是上个月夜里，一个围彩虹围巾的灰衣小仙女踮着脚来做的。
        - id: ch01-b08
          speaker: anne
          text: 戴安娜可不肯多说。她妈妈上次骂我们在林子里想出幽灵，把她的想象力伤得很重，简直摧残了。林德太太也说默特尔·贝尔是个遭到摧残的人。我问鲁比为什么，她猜是默特尔的心上人变了心。鲁比总想着年轻男人，年纪越大还越厉害。年轻男人本身没什么不好，可不能什么事都把他们扯进来呀。
        - id: ch01-b09
          speaker: anne
          text: 戴安娜和我正在认真考虑，要不要互相发誓永远不结婚。我们可以做两个好脾气的老姑娘，永远住在一起。她还没拿定主意，因为她觉得，嫁给一个狂野、英俊又邪恶的年轻人，再把他改造成好人，也许是更高尚的选择。我们如今常谈严肃的问题。我们都觉得自己比以前大了许多，再说那些小孩子的话已经不合身份。快十四岁了，多么庄严啊。
        - id: ch01-b10
          speaker: anne
          text: 上星期三，史黛西小姐把十几岁的姑娘都带到小溪边。她说，这个年纪养成什么习惯、有什么理想，一定要格外小心。到了二十岁，人的品格就成形了，一生的根基也打好了。根基不稳，就盖不起真正有价值的东西。戴安娜和我放学回家时，把这件事仔细商量了一遍，心情庄严得不得了。我们决定处处小心，养成体面的习惯，尽量多学东西，也尽量明白事理。这样等我们二十岁，品格就能好好长成。可二十岁听起来又老又成熟，真叫人害怕。对了，史黛西小姐到底来做什么？
        - id: ch01-b11
          speaker: marilla
          text: 这正是我要说的，只要你肯让我插进一句话。她来谈你的事。
        - id: ch01-b12
          speaker: anne
          text: 我的事？啊，我知道了！我真想过要告诉你，老老实实说出来，可后来偏偏忘了。昨天下午我本该学加拿大历史，却在学校里读简·安德鲁斯借给我的《宾虚》。午饭时间我一直在看，上课铃响时，故事刚好到了战车比赛。我急得发疯，非要知道结果不可。虽然我确信宾虚一定会赢，因为他要是不赢，故事就没有诗意的正义了。所以我把历史书摊在课桌上，又把《宾虚》藏在桌子和膝盖之间。这样看起来，我像是在专心读加拿大历史，其实一直在下面享受《宾虚》。
        - id: ch01-b13
          speaker: anne
          text: 我看得太入迷，根本没发现史黛西小姐沿着过道走来。忽然一抬头，她已经站在课桌旁，低头看着我，那失望的神情让我羞愧得不知怎么办。偏偏这时，我又听见乔西在一旁咯咯偷笑。史黛西小姐当时只收走了书，一个字也没说。到了课间，她才把我留在教室里谈话。她说我有两处做得很错。第一，我把本该用来学习的时间浪费掉了。第二，我拿历史书作掩护，让老师以为我在读历史，其实却在看故事，这就是欺骗。我从没想到自己的做法也算骗人，明白过来以后吓坏了，哭着请她原谅，还保证绝不再犯。
        - id: ch01-b14
          speaker: anne
          text: 那时我才懂得，自己不只是贪看故事，还骗了老师。我又震惊又难过，哭得很厉害，求史黛西小姐原谅。我甚至愿意罚自己一星期不碰《宾虚》，连战车比赛的结果也不看。可她说不用这样处罚我，还马上原谅了我。既然如此，她后来又跑来告诉你，我觉得似乎不太厚道。
          emotion: sad
        - id: ch01-b15
          speaker: marilla
          text: 她压根儿没提这件事。你这是自己心虚。故事书本来就不该带去学校，而且你读的小说已经够多了。我小时候连小说都不许看一眼。
        - id: ch01-b16
          speaker: anne
          text: 《宾虚》宗教意味那么浓，怎么能把它叫作普通小说？当然，它的确太刺激，不适合拿来作星期日的读物，所以我只在平日读。现在我不管拿到什么书，都要先听史黛西小姐或艾伦太太的意见。只有她们认定那本书适合一个十三岁又九个月的姑娘，我才会打开来看。这是史黛西小姐要我答应的事。
        - id: ch01-b17
          speaker: anne
          text: 有一次，她看见我读鲁比借来的《闹鬼大厅的骇人秘密》。那本书又迷人又吓人，读起来简直叫人全身的血都凝住了。她说那书又愚蠢又有害，请我不要再读下去，以后也别碰同类的书。我答应不读别的同类小说并不难，可故事读到一半，连结局都不知道就把书还回去，真是痛苦极了。不过，我对史黛西小姐的爱经受住了考验，我还是还了。只要真心想让某个人满意，人能做到的事可真多。
        - id: ch01-b18
          speaker: marilla
          text: 那我还是点灯干活吧。你显然不想听她说了什么。比起别的事，你更喜欢听自己的嘴说个不停。
        - id: ch01-b19
          speaker: anne
          text: 我想听，真的想听！我保证一个字也不再说。我知道自己话多，也一直在认真地改。虽说我说出口的已经太多，可你要知道我有多少话想说又忍住了，多少也该夸夸我吧。求你告诉我，玛丽拉。
        - id: ch01-b20
          speaker: marilla
          text: 史黛西小姐打算把高年级里准备考女王学院的学生组成一个班。每天放学以后，她会再给他们上一小时课。她来问我和马修，愿不愿意让你参加。你怎么想？想去女王学院，取得教师资格吗？
        - id: ch01-b21
          speaker: anne
          text: 玛丽拉！这是我一生的梦想。好吧，准确地说，是我最近半年的梦想。鲁比和简开始谈入学考试以后，我就一直盼着，可我以为根本没有可能，才什么也没说。我很想做老师。但学费会不会贵得可怕？安德鲁斯先生说，普里西读完花了一百五十美元，而且她的几何还不笨呢。
          emotion: surprised
        - id: ch01-b22
          speaker: marilla
          text: 钱的事不用你操心。我和马修收养你时就说好，要尽我们所能把你带大，让你好好念书。一个姑娘不论将来需不需要自己谋生，都该学到足以养活自己的本事。只要我和马修还在，绿山墙永远是你的家。可这个世界总有想不到的变化，谁也不能预知将来。提前作好准备，总不会错。所以，你愿意的话，就参加这个班。
        - id: ch01-b23
          speaker: narrator
          text: 安妮立刻直起身，跪在炉前的小毯子上，双手紧紧合在一起。接着，她一下搂住玛丽拉的腰，认真地仰起脸，望进玛丽拉的眼睛。
        - id: ch01-b24
          speaker: anne
          text: 谢谢你，玛丽拉。我真不知道该怎样感谢你和马修。我一定尽全力用功，让你们为我骄傲。不过先说好，几何别指望太高。别的功课只要肯下功夫，我想自己不会落在后面。
          emotion: happy
        - id: ch01-b25
          speaker: marilla
          text: 你大概会学得不错。史黛西小姐说你聪明，也肯用功。不过别走到另一个极端，读书读得不要命。离入学考试还有一年半，用不着着急。史黛西小姐说，早点开始，把基础打扎实就好。
        - id: ch01-b26
          speaker: narrator
          text: 史黛西小姐究竟怎样夸过安妮，玛丽拉无论如何也不肯照实转述。她可不愿把这孩子的虚荣心惯大。
        - id: ch01-b27
          speaker: anne
          text: 有了人生目标，我以后一定比从前更爱学习。艾伦先生说，每个人都该先找到一个高尚的目标，再忠实地追求它。做史黛西小姐那样的老师，当然算高尚吧？我觉得教师是非常崇高的职业。
          emotion: happy
        - id: ch01-b28
          speaker: narrator
          text: 女王学院班很快成立了。吉尔伯特、安妮、鲁比、简、乔西、查理和穆迪都加入了，戴安娜却没有。她父母不打算送她去女王学院。安妮觉得这简直是一场灾难。自从米妮·梅得喉头炎的那个夜晚，她和戴安娜做什么都没有分开过。现在，大家第一次走上了不同的路。
        - id: ch01-b29
          speaker: narrator
          text: 第一次放学后补课时，戴安娜跟别人慢慢走出校门，要独自经过白桦小径和紫罗兰谷回家。安妮费了好大的力气才留在座位上，没有冲动地追着好友跑出去。她喉咙里像堵着一团东西，只好赶紧举起拉丁文语法书，把脸藏在书页后面，遮住眼里的泪。她绝不能让吉尔伯特或乔西看见自己哭。
        - id: ch01-b30
          speaker: anne
          text: 玛丽拉，看着戴安娜独自离开时，我真的尝到了死亡的苦味，就像艾伦先生上星期讲道时说的。要是她也准备入学考试，能和我一起留下来，那该有多好。可林德太太说，我们活在一个不完美的世界里，事情不可能样样都完美。她有时实在不算一个会安慰人的人，可也不能否认，她说出来的许多话确实很对。
          emotion: sad
        - id: ch01-b31
          speaker: anne
          text: 这个班还是很有意思的。简和鲁比最大的志向就是做教师。鲁比打算毕业后只教两年，然后结婚。简却要教一辈子，永远不结婚。她说教书有薪水，丈夫不但不给钱，你想从鸡蛋和黄油的钱里拿一点，他还会抱怨。简大概真有惨痛经验，林德太太说她爸爸脾气古怪，比撇了两遍油的稀奶还刻薄。
        - id: ch01-b32
          speaker: anne
          text: 乔西说，她进学院只为受教育，反正不用自己养活自己。她还说，靠施舍生活的孤儿当然得拼命往上爬。穆迪要当牧师。林德太太说，他的名字摆在那里，也只能当牧师。我这样想也许不太好，可他那张又大又胖的脸、小蓝眼睛和向外支着的耳朵，实在不像牧师。不过长大后也许会显得有学问些。
        - id: ch01-b33
          speaker: anne
          text: 查理想从政，当国会议员。林德太太说他不会成功，因为斯隆家的人都太老实，如今只有无赖才能在政界混出头。
        - id: ch01-b34
          speaker: marilla
          text: 吉尔伯特·布莱思将来想做什么？
        - id: ch01-b35
          speaker: anne
          text: 我恰好不知道他有什么人生志向。当然，也可能他根本没有。
        - id: ch01-b36
          speaker: narrator
          text: 安妮说这句话时满脸轻蔑，随后打开了自己的《恺撒传》。她和吉尔伯特的竞争已经公开了。从前，这场较量多少是安妮一个人在用力，吉尔伯特并没有同样认真地回应。现在谁都看得出，他也下定决心要拿全班第一。他是个足以让安妮拿出全部本领迎战的对手。其他同学早已默默承认，他们两个比全班都高出一筹，压根儿不曾梦想过要参与这场竞争。
        - id: ch01-b37
          speaker: narrator
          text: 自从池塘边那一天，安妮拒绝听吉尔伯特请求原谅以后，吉尔伯特除了在功课上和她较量，再也没有用任何方式表示自己看得见安妮·雪莉。他照样跟其他姑娘聊天说笑，跟她们交换书籍和谜题，也会一起讨论功课和将来的打算。有时祈祷会或辩论社散了，他还会陪这个姑娘或那个姑娘走一段回家的路。可轮到安妮，他就像根本看不见她。在吉尔伯特的世界里，安妮·雪莉仿佛完全不存在。安妮这才亲自尝到，被人这样彻底无视，滋味一点也不好受。
        - id: ch01-b38
          speaker: narrator
          text: 她一次次昂着头告诉自己，她才不在乎。可在那颗任性又敏感的小小女孩心里，她明白那不是真话。她确实在乎，而且如果闪光之湖边的机会能够重来，她一定会给出完全不同的回答。更糟的是，她忽然发现，从前那股怨恨偏在最需要支撑自己的时候消失了。这叫她暗自慌张。她努力回忆当天的每件事和每一种感受，想重新生起那种痛快的怒气，却怎么也办不到。那点怒火最后一次闪动，早已留在池塘边。她没有察觉的时候，就已经原谅，也已经忘记。可现在太迟了。
        - id: ch01-b39
          speaker: narrator
          text: 不过，谁也别想看出她有多后悔，多希望自己当初没有那么骄傲、那么可恶。就连戴安娜也不能知道。安妮决定，把感情埋进最深的遗忘里。她的确做到了，而且藏得极其成功。吉尔伯特或许不像表面上那样冷淡，可他完全看不出安妮被自己的报复刺痛，不能用这个念头安慰自己。他唯一的一点可怜安慰，是安妮也一次又一次毫不留情、毫无道理地冷落查理·斯隆。
        - id: ch01-b40
          speaker: narrator
          text: 除了这件烦心事，那个冬天过得充实又愉快。对安妮来说，日子像穿在一年这条项链上的金珠，一颗接一颗，轻快地滑了过去。她每天都快活、热切，对身边的一切满怀兴趣。有新的功课等着她学，有新的荣誉等着她去争，也总有叫人舍不得放下的好书可读。她还要为主日学校唱诗班练习新曲子。每逢星期六，又有一个愉快的下午，可以去牧师住宅陪艾伦太太。仿佛只过了一转眼，春天已经重返绿山墙，整个世界也重新开满了花。
        - id: ch01-b41
          speaker: narrator
          text: 春色一浓，读书便少了几分滋味。别的孩子早已散进绿荫小路、枝叶繁茂的林间捷径和穿过草地的小道，女王学院班却得留在教室里。他们眼巴巴地望着窗外，渐渐觉得拉丁文动词和法文练习再也没有清冽冬日里的那股新鲜劲儿。就连安妮和吉尔伯特也拖慢了脚步，不再像先前那样热心。学期一结束，快乐的假期带着玫瑰色铺展在眼前，老师和学生都由衷地高兴。
        - id: ch01-b42
          speaker: stacy
          text: 这一年，你们的功课做得很好，应该好好享受假期。去户外尽情玩，多攒些健康、力气和志气，留给明年用。入学考试前的最后一年，才是真正需要拼力气的时候。
        - id: ch01-b43
          speaker: josie
          text: 史黛西小姐，您明年还回来吗？
        - id: ch01-b44
          speaker: narrator
          text: 乔西问话从来不怕冒失。这一回，同学们都暗暗感激她。谁也不敢亲口问，却人人都想知道。学校里早有传言，说史黛西小姐的家乡请她去分级学校任教，她明年不会回来了。全班屏住呼吸，等着她的回答。
        - id: ch01-b45
          speaker: stacy
          text: 我想，我会回来。我原本考虑过另一所学校，可已经决定留在埃文利。说实话，我太牵挂这里的学生了，实在舍不得离开。我会陪着你们，一直到考完为止。
        - id: ch01-b46
          speaker: moody
          text: 好哇！
          emotion: happy
        - id: ch01-b47
          speaker: narrator
          text: 穆迪从没让感情这样冲破过拘谨。后来整整一星期，每次想起自己这声欢呼，他都会难为情得脸红。
        - id: ch01-b48
          speaker: anne
          text: 我真是太高兴了，亲爱的史黛西小姐。您要是明年不回来，那简直可怕得叫人不敢想。要是这里换了一位别的老师，我恐怕连继续学下去的心都没有了。
          emotion: happy
        - id: ch01-b49
          speaker: narrator
          text: 那天晚上回到家，安妮把全部课本整整齐齐地叠进阁楼的一只旧箱子。她锁好箱盖，又把钥匙扔进了装毯子的箱子里。
        - id: ch01-b50
          speaker: anne
          text: 整个假期里，我连课本的封面都不看一眼。这一学期我已经用尽了所有力气。那本几何，我翻来覆去地钻研，第一册里的每一条命题都能背出来，哪怕题目把字母换掉，也一样难不住我。如今，一切讲道理、求实际的事情都让我厌倦。整个夏天，我要让想象力尽情撒野。别担心，玛丽拉，我只会让它在合理的范围里撒野。
        - id: ch01-b51
          speaker: anne
          text: 这个夏天我一定要真正痛快地玩，也许这是我还能做小女孩的最后一个夏天。林德太太说，我明年要是还照今年这样拼命长高，就非穿上长裙不可。她说我现在全身上下，好像只剩两条腿和一双眼睛在长。等我穿上长裙，就会觉得自己的举止必须配得上裙子，凡事都得庄严稳重。恐怕到了那时，连相信小仙女也不合适了。所以今年夏天，我要全心全意地相信她们。
        - id: ch01-b52
          speaker: anne
          text: 假期一定很热闹。鲁比快办生日宴会了，还有主日学校野餐和下个月的传教音乐会。巴里先生也答应找个晚上，带我和戴安娜去白沙旅馆吃晚餐。你知道，那里的正餐是在晚上吃。简去年夏天去过一次。她说旅馆里亮着电灯，到处摆着鲜花，女客们都穿着漂亮礼服，放眼望去简直光彩夺目。那是她第一次窥见上流社会的生活，她说自己一直到死也不会忘记。
        - id: ch01-b53
          speaker: narrator
          text: 第二天下午，蕾切尔太太来问，玛丽拉星期四为什么没去妇女互助会。玛丽拉若是缺席，大家就知道绿山墙出了事。
        - id: ch01-b54
          speaker: marilla
          text: 星期四，马修的心脏病又重重发作了一次，我不放心把他一个人留下。现在已经没事了，可近来发作得比从前频繁，我实在担心。医生说，他一定要小心，尽量别激动。这一条倒不难，马修一辈子也没四处寻找过刺激。可医生还说，他不能再干太重的活。要马修别干活，跟要他别呼吸一样难。蕾切尔，把外衣脱下来吧。你留下喝茶？
        - id: ch01-b55
          speaker: rachel
          text: 既然你这样坚持，那我就留下吧。
        - id: ch01-b56
          speaker: narrator
          text: 其实，蕾切尔太太从来没打算马上离开。她把这句话说得像是自己勉强答应了玛丽拉。随后，她和玛丽拉舒舒服服地坐进客厅，安妮去准备茶点，还烤出一盘热腾腾的小圆饼。那些饼又轻又白，就连最会挑毛病的蕾切尔太太也找不到可以批评的地方。夕阳西下时，玛丽拉一路陪她走到了小路尽头。
        - id: ch01-b57
          speaker: rachel
          text: 我不得不承认，安妮现在真成了一个聪明能干的姑娘。她平常一定能替你做许多事，给你帮了大忙。
        - id: ch01-b58
          speaker: marilla
          text: 可不是。她如今做事稳重，也真正靠得住。以前我总担心，她一辈子也改不掉那些冒冒失失、想起什么就做什么的毛病。可现在她已经改过来了。如今不论是什么事，只要交到安妮手里，我都敢放心。
        - id: ch01-b59
          speaker: rachel
          text: 三年前我头一次到这里见她时，绝想不到她会变得这样好。老天保佑，我哪能忘掉她那场惊天动地的坏脾气。那天晚上我一回家，就对托马斯说，你等着看吧，玛丽拉·卡斯伯特早晚要后悔自己走了这一步。可事实证明我错了，而且我真高兴自己错了。我可不是那种无论怎样也不肯承认自己犯过错的人。谢天谢地，那从来不是我的作风。
        - id: ch01-b60
          speaker: rachel
          text: 不过，当初看错她也不能全怪我。世上哪有那么古怪、那么出人意料、那么叫人摸不透的小妖精？管别的孩子有用的规矩，放到她身上全不灵，谁也不能照普通办法猜中她。这三年她进步得惊人，尤其是模样，变化真大。她已经长成一个真正漂亮的姑娘了，只是我自己不大偏爱脸色苍白、眼睛又太大的类型。我更喜欢戴安娜或鲁比那种红润鲜明的长相。鲁比尤其亮眼，一眼看去十分出众。
        - id: ch01-b61
          speaker: rachel
          text: 可奇怪的是，安妮和她们站在一起，明明没有她们一半漂亮，却会把她们衬得俗气又张扬。我也说不清到底为什么。鲁比她们就像开得又大又艳的红牡丹，安妮却像她自己常说的白色六月百合，也就是水仙花。两种花单看各有各的模样，可一旦摆在一起，那些硕大的红牡丹反而显得颜色太浓，开得太满，处处都过了头。就是那么回事。
