  chapters:
    - id: ch01
      title: Miss Stacy's Visit
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: "Marilla laid her knitting across her lap and leaned back in her chair. Her eyes were tired again. She thought vaguely that the next time she went to town, she really must see about having her glasses changed. Lately, her eyes seemed to grow tired more and more often."
        - id: ch01-b02
          speaker: narrator
          text: "November twilight had settled around Green Gables, and the kitchen was nearly dark. The only light came from the red flames dancing in the stove. Anne sat curled up cross-legged on the hearthrug, watching the cheerful glow. The maple wood seemed to hold the sunshine of a hundred summers, and now all that warmth was shining out into the room."
        - id: ch01-b03
          speaker: narrator
          text: "Anne had been reading, but her book had slipped unnoticed to the floor. She was dreaming now, with a smile on her parted lips. Bright castles rose out of the mist and rainbows of her lively imagination. In that cloud world, one wonderful, thrilling adventure followed another. They always ended in triumph, too. None of them ever landed her in the scrapes that came with real life."
        - id: ch01-b04
          speaker: narrator
          text: "Marilla watched her with a tenderness she would never have allowed anyone to see in brighter light. She had never learned how to show love easily in words or open looks. Yet she had learned to love this slim, gray-eyed girl, and the feeling ran all the deeper because Marilla kept it hidden. That very love made her afraid of being too indulgent. Sometimes she even felt it might be wrong to set her heart so completely on another person. Without knowing it, she seemed to do penance by being stricter with Anne and quicker to find fault than she would have been if Anne mattered less."
        - id: ch01-b05
          speaker: narrator
          text: "Anne had no idea how much Marilla loved her. Now and then, she sadly thought Marilla was very hard to please and did not offer much sympathy or understanding. But Anne always stopped herself and felt ashamed of the thought, because she remembered all she owed Marilla."
        - id: ch01-b06
          speaker: marilla_cuthbert
          text: "Anne, Miss Stacy stopped by this afternoon while you were out with Diana."
        - id: ch01-b07
          speaker: narrator
          text: "Anne came back from her dream world with a start and a sigh."
        - id: ch01-b08
          speaker: anne_shirley
          text: "She did? Oh, I'm sorry I missed her. Why didn't you call me? Diana and I were only in the Haunted Wood. It's beautiful there now. The ferns and the shiny leaves and the crackerberries have all gone to sleep. It looks as if someone tucked them under a leaf blanket until spring."
        - id: ch01-b09
          speaker: anne_shirley
          text: "I think a little gray fairy in a rainbow scarf did it. She must have tiptoed through on the last moonlit night. Diana didn't have much to say about that. She still remembers how her mother scolded her for imagining ghosts in the Haunted Wood. It had a terrible effect on Diana's imagination. It blighted it."
        - id: ch01-b10
          speaker: anne_shirley
          text: "Mrs. Lynde says Myrtle Bell is blighted, too. I asked Ruby Gillis what had blighted Myrtle, and Ruby thought it was because her young man left her. Ruby thinks of nothing but young men. The older she gets, the worse she gets. Young men are all right in their proper place, but there's no need to drag them into everything, is there?"
        - id: ch01-b11
          speaker: anne_shirley
          text: "Diana and I are seriously considering a promise never to marry. We'd be pleasant old maids and live together forever. Diana isn't quite decided. She thinks it might be nobler to marry a wild, daring, wicked young man and reform him. We discuss serious subjects a great deal now, you know. We feel so much older than we used to be that childish talk doesn't seem suitable anymore. Being almost fourteen is such a solemn thing, Marilla."
        - id: ch01-b12
          speaker: anne_shirley
          text: "Last Wednesday, Miss Stacy took all the girls in their teens down to the brook. She told us to be very careful about the habits and ideals we form now. By twenty, she said, our characters will be developed, and the foundation of our whole future will be laid. If the foundation is weak, we can never build anything worthwhile on it."
        - id: ch01-b13
          speaker: anne_shirley
          text: "Diana and I talked the whole matter over on the way home from school. We felt extremely serious. We decided to be very careful, learn all we can, form respectable habits, and be as sensible as possible. Then our characters should be properly developed by the time we're twenty. It's terrifying to think of being twenty, Marilla. It sounds so fearfully old and grown-up. But what did Miss Stacy want this afternoon?"
        - id: ch01-b14
          speaker: marilla_cuthbert
          text: "That's what I'm trying to tell you, if you'll ever let me get a word in. She came to talk about you."
        - id: ch01-b15
          speaker: narrator
          text: "Anne looked frightened. Then her face turned red as an explanation burst out of her."
        - id: ch01-b16
          speaker: anne_shirley
          text: "Oh, I know why! I honestly meant to tell you, but I forgot. Yesterday, Miss Stacy caught me reading Ben Hur when I was supposed to study Canadian history. Jane Andrews lent it to me. I read it at noon, and just when I reached the chariot race, school started again. I had to know how it ended. I was sure Ben Hur ought to win, because anything else wouldn't be poetical justice."
        - id: ch01-b17
          speaker: anne_shirley
          text: "So I opened my history on the desk and hid Ben Hur between the desk and my knee. I looked as if I were studying history, but I was really lost in the story. I never saw Miss Stacy coming down the aisle. Then I looked up, and there she was, staring at me so reproachfully. I felt horribly ashamed, especially when Josie Pye started giggling."
        - id: ch01-b18
          speaker: anne_shirley
          text: "Miss Stacy took Ben Hur away, but she didn't say a word then. At recess, she kept me in and explained that I'd done two wrong things. First, I had wasted time that belonged to my studies. Second, I'd tried to deceive my teacher by making a storybook look like my history. Until that moment, I truly hadn't understood that what I was doing was deceitful. It shocked me."
        - id: ch01-b19
          speaker: anne_shirley
          text: "I cried terribly and begged her forgiveness. I promised never to do it again. I even offered not to look at Ben Hur for a whole week, not even to learn who won the race. She said that punishment wasn't necessary, and she forgave me freely. So it doesn't seem very kind if she came here and told you after all."
          emotion: sad
        - id: ch01-b20
          speaker: marilla_cuthbert
          text: "Miss Stacy never said one word about it. This is nothing but your guilty conscience. You shouldn't bring storybooks to school in the first place. You read too many novels as it is. When I was young, I wasn't even allowed to look at one."
        - id: ch01-b21
          speaker: anne_shirley
          text: "But how can you call Ben Hur a novel when it's really such a religious book? Of course, it may be a little too exciting to count as proper Sunday reading, so I only read it on weekdays. And now I never read any book at all unless Miss Stacy or Mrs. Allan says it's suitable for a girl of thirteen and three-quarters. Miss Stacy made me promise that."
        - id: ch01-b22
          speaker: anne_shirley
          text: "She once found me with a book Ruby lent me called The Lurid Mystery of the Haunted Hall. It was so fascinating and frightening that it nearly froze the blood in my veins. Miss Stacy said it was silly and unhealthy, and asked me never to read it or anything like it again. I didn't mind promising about other books. But returning that one without finding out the ending was agony. Still, my love for Miss Stacy passed the test. I gave it back. It's amazing what you can do when you truly want to please someone."
        - id: ch01-b23
          speaker: marilla_cuthbert
          text: "Well, I suppose I'll light the lamp and get back to work. You plainly don't care what Miss Stacy came to say. You'd rather listen to yourself talk."
        - id: ch01-b24
          speaker: anne_shirley
          text: "Oh, I do care! I won't say one more word. I know I talk too much, and I'm truly trying to stop. I may say far too many things, but if you knew how many more I want to say and hold back, you'd give me some credit. Please tell me, Marilla."
        - id: ch01-b25
          speaker: marilla_cuthbert
          text: "Miss Stacy plans to form a class for her advanced students who want to take the entrance examination for Queen's. She'll teach them for an extra hour after school. She came to ask Matthew and me whether we'd like you to join. What do you think, Anne? Would you like to attend Queen's and qualify as a teacher?"
        - id: ch01-b26
          speaker: narrator
          text: "Anne rose onto her knees and clasped her hands."
        - id: ch01-b27
          speaker: anne_shirley
          text: "Oh, Marilla! It's been my life's dream. Well, my dream for the past six months, ever since Ruby and Jane began talking about the Entrance. I never mentioned it because I thought there was no use. I would love to teach. But won't it cost an awful lot? Mr. Andrews spent a hundred and fifty dollars putting Prissy through, and Prissy wasn't bad at geometry."
          emotion: surprised
        - id: ch01-b28
          speaker: marilla_cuthbert
          text: "You don't need to worry about the cost. When Matthew and I took you in, we decided to do the best we could for you and give you a good education. I believe every girl should be prepared to earn her own living, whether she ever has to or not. You'll always have a home at Green Gables as long as Matthew and I are here. Still, no one knows what may happen in this uncertain world, and it's just as well to be ready. You may join the Queen's class if you want to."
        - id: ch01-b29
          speaker: narrator
          text: "Anne threw her arms around Marilla's waist and looked earnestly into her face."
        - id: ch01-b30
          speaker: anne_shirley
          text: "Thank you, Marilla. I'm so grateful to you and Matthew. I'll work as hard as I can and do my very best to make you proud. I should warn you not to expect too much in geometry. But if I work hard, I think I can hold my own in everything else."
          emotion: happy
        - id: ch01-b31
          speaker: marilla_cuthbert
          text: "I expect you'll manage well enough. Miss Stacy says you're bright and hardworking. But you needn't rush to the other extreme and wear yourself out over your books. There's no hurry. You won't be ready to try the Entrance for another year and a half. Miss Stacy says it's wise to begin in good time and make sure you're thoroughly grounded."
        - id: ch01-b32
          speaker: narrator
          text: "Marilla would never have repeated all the praise Miss Stacy had given Anne. In her mind, that would only encourage vanity."
        - id: ch01-b33
          speaker: anne_shirley
          text: "I'll care more about my studies than ever now, because I have a purpose in life. Mr. Allan says everyone ought to have a purpose and follow it faithfully. Of course, he says we must first be sure it's worthy. Wanting to teach like Miss Stacy is a worthy purpose, isn't it? I think teaching is a very noble profession."
          emotion: happy
    - id: ch02
      title: The Queen's Class
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: "Before long, the Queen's class was officially organized. Gilbert Blythe, Anne Shirley, Ruby Gillis, Jane Andrews, Josie Pye, Charlie Sloane, and Moody Spurgeon MacPherson all joined it. Diana Barry did not. Her parents had no intention of sending her to Queen's, and to Anne, that felt like nothing less than a disaster."
        - id: ch02-b02
          speaker: narrator
          text: "Anne and Diana had shared everything since the night Minnie May had croup. But on the first evening of extra lessons, Diana walked slowly out with the other students. She would go home alone by the Birch Path and Violet Vale. It took all Anne's strength to stay in her seat instead of leaping up and running after her dearest friend. A lump rose in her throat. She quickly lifted her Latin grammar and hid the tears in her eyes behind its pages. Not for anything in the world would she let Gilbert Blythe or Josie Pye see her crying."
        - id: ch02-b03
          speaker: anne_shirley
          text: "Oh, Marilla, when I watched Diana leave alone, I truly felt I'd tasted the bitterness of death, just as Mr. Allan said in Sunday's sermon. If only she were studying for the Entrance, too! It would have been splendid. But Mrs. Lynde says we can't have everything perfect in an imperfect world. She isn't always comforting, but she does say a great many true things."
          emotion: sad
        - id: ch02-b04
          speaker: anne_shirley
          text: "I think the class will be extremely interesting, though. Jane and Ruby only want to become teachers. That's as high as their ambitions go. Ruby says she'll teach for two years and then get married. Jane plans to teach all her life and never marry. She says a school pays you a salary, while a husband pays you nothing and growls when you ask for some of the egg-and-butter money."
        - id: ch02-b05
          speaker: anne_shirley
          text: "Jane must be speaking from sad experience. Mrs. Lynde says her father is a dreadful old crank and meaner than second skimmings. Josie says she's going to college only for the education, because she won't need to support herself. According to Josie, it's different for orphans living on charity. They have to work hard."
        - id: ch02-b06
          speaker: anne_shirley
          text: "Moody Spurgeon wants to be a minister. Mrs. Lynde says he couldn't be anything else with a name like his. I hope it isn't wicked, but the thought of Moody as a minister makes me laugh. He has such a funny big face, tiny blue eyes, and ears that stick out like flaps. Maybe he'll look more intellectual when he's older."
        - id: ch02-b07
          speaker: anne_shirley
          text: "Charlie Sloane wants to enter politics and become a member of Parliament. Mrs. Lynde says he'll never succeed because every Sloane is honest, and these days only rascals get ahead in politics."
        - id: ch02-b08
          speaker: marilla_cuthbert
          text: "And what does Gilbert Blythe mean to become?"
        - id: ch02-b09
          speaker: narrator
          text: "Anne was opening her Caesar when Marilla asked."
        - id: ch02-b10
          speaker: anne_shirley
          text: "I wouldn't know what Gilbert Blythe's purpose in life is, assuming he has one."
          emotion: disgusted
        - id: ch02-b11
          speaker: narrator
          text: "The rivalry between Gilbert and Anne was open now. Once, Anne had been the only one treating it as a contest. That had changed. No one could doubt that Gilbert was every bit as determined to stand first in class as she was. Anne had finally met an opponent worthy of her best effort. Everyone else in the Queen's class quietly accepted that those two were ahead. The others never even dreamed of trying to compete with them."
        - id: ch02-b12
          speaker: narrator
          text: "Ever since Anne refused to hear his apology beside the pond, Gilbert had acted as though she did not exist. The rivalry was the one exception. He joked and talked with the other girls. He traded books and puzzles with them, discussed lessons and plans, and sometimes walked home with one of them after prayer meeting or the Debating Club. But he ignored Anne Shirley completely. Anne discovered that being ignored was not pleasant."
        - id: ch02-b13
          speaker: narrator
          text: "She could toss her head and tell herself she did not care, but it did no good. Deep inside her stubborn little heart, she knew she cared very much. If she could return to that moment by the Lake of Shining Waters, she would answer Gilbert very differently. To her secret alarm, the old resentment she had nursed for so long was gone just when she most needed its power to keep her strong."
        - id: ch02-b14
          speaker: narrator
          text: "Anne tried to remember every detail of that day and summon the old satisfying fury. It was no use. Its last little flame had died beside the pond. Without noticing when it happened, she had forgiven Gilbert and forgotten the insult. Now it was too late."
        - id: ch02-b15
          speaker: narrator
          text: "Still, Gilbert must never guess how sorry she was, or how much she wished she had not been so proud and horrid. Nobody could know, not even Diana. Anne decided, in her own grand words, to hide her feelings in deepest oblivion. And she succeeded completely. Gilbert, who might not have been as indifferent as he appeared, could not comfort himself by believing Anne regretted her scorn. His only poor comfort was seeing her snub Charlie Sloane again and again, without mercy and without the least cause."
    - id: ch03
      title: A Year of Work
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: "Apart from that, winter passed in a pleasant circle of duties and study. For Anne, the days slipped by like golden beads on the necklace of the year. She was happy, eager, and interested. There were lessons to master and honors to win, wonderful books to read, and new pieces to practice for the Sunday school choir. Saturdays brought happy afternoons with Mrs. Allan at the manse. Then, almost before Anne knew what had happened, spring returned to Green Gables and the whole world was in bloom once more."
        - id: ch03-b02
          speaker: narrator
          text: "Once spring arrived, studying lost a little of its charm. The Queen's class stayed behind in school while everyone else scattered down green lanes, through leafy woodland shortcuts, and across meadow paths. The students gazed longingly through the windows. Latin verbs and French exercises had somehow lost the sharp flavor and excitement they had carried in the crisp winter weather. Even Anne and Gilbert began to lag and lose interest. Teacher and students were equally glad when the term ended and the bright vacation days stretched invitingly ahead."
        - id: ch03-b03
          speaker: miss_stacy
          text: "You've all worked well this year, and you've earned a cheerful vacation. Enjoy every moment you can outdoors. Build up plenty of health, energy, and ambition for next year. You'll need them. Next year is the real struggle, the last one before the Entrance."
        - id: ch03-b04
          speaker: josie_pye
          text: "Will you be here again next year, Miss Stacy?"
        - id: ch03-b05
          speaker: narrator
          text: "Josie never hesitated to ask a question, no matter what it was. This time, everyone was grateful to her. None of the others dared ask Miss Stacy, though every one of them was desperate to know. For some time, troubling rumors had been racing through the school. People said Miss Stacy had been offered a job in the graded school of her own home district and planned to accept it. The whole Queen's class held its breath and waited for her answer."
        - id: ch03-b06
          speaker: miss_stacy
          text: "Yes, I believe I will be. I did consider another school, but I've decided to return to Avonlea. The truth is, I've grown so interested in all of you that I couldn't bring myself to leave. I'll stay and help you through the Entrance."
        - id: ch03-b07
          speaker: moody_spurgeon
          text: "Hurrah!"
          emotion: happy
        - id: ch03-b08
          speaker: narrator
          text: "Moody Spurgeon had never let his feelings carry him away like that before. His own shout left him deeply uncomfortable. For an entire week afterward, he blushed with embarrassment every time he remembered it."
        - id: ch03-b09
          speaker: anne_shirley
          text: "Oh, I'm so glad! Dear Miss Stacy, it would be dreadful if you didn't return. I don't think I'd have the heart to keep studying if we had another teacher."
          emotion: happy
        - id: ch03-b10
          speaker: narrator
          text: "That night, Anne took every schoolbook to the attic. She stacked them in an old trunk, locked it, and tossed the key into the blanket box."
        - id: ch03-b11
          speaker: anne_shirley
          text: "I won't so much as look at a schoolbook during vacation. I've worked as hard as I possibly could all term. I've studied that geometry until I can repeat every proposition in the first book from memory, even when somebody changes the letters. I'm tired of everything sensible. This summer, I'm going to let my imagination run wild."
        - id: ch03-b12
          speaker: anne_shirley
          text: "Oh, you don't have to worry, Marilla. I'll only let my imagination run wild within reasonable limits. But I want one truly good, joyful summer, because it may be my last summer as a little girl. Mrs. Lynde says if I keep stretching out next year the way I have this year, I'll need to put on longer skirts. She says I'm turning into nothing but legs and eyes."
        - id: ch03-b13
          speaker: anne_shirley
          text: "Once I wear long skirts, I'll have to live up to them and act very dignified. I'm afraid believing in fairies won't be proper anymore. So this summer, I'll believe in them with my whole heart."
        - id: ch03-b14
          speaker: anne_shirley
          text: "Our vacation should be very exciting. Ruby Gillis will have a birthday party soon. Next month brings the Sunday school picnic and the missionary concert. And Mr. Barry says he'll take Diana and me to dinner at the White Sands Hotel one evening. They really serve dinner in the evening there."
        - id: ch03-b15
          speaker: anne_shirley
          text: "Jane Andrews went there last summer. She says the electric lights were dazzling, with flowers everywhere and lady guests in beautiful dresses. Jane called it her first glimpse of high life. She says she'll remember it until the day she dies."
    - id: ch04
      title: Mrs. Lynde Changes Her Mind
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: "The next afternoon, Mrs. Lynde came to find out why Marilla had missed Thursday's Aid meeting. Whenever Marilla failed to appear at an Aid meeting, everyone knew something must be wrong at Green Gables."
        - id: ch04-b02
          speaker: marilla_cuthbert
          text: "Matthew had one of his bad heart spells on Thursday, and I didn't feel right leaving him. Oh, he's all right again now. But these spells come more often than they used to, Rachel, and I worry about him. The doctor says he must be careful to avoid excitement. That part is easy enough. Matthew doesn't go around looking for excitement, and he never did. But he's not supposed to do any very heavy work, either, and you might as well tell him to stop breathing as tell him not to work. Come in and take off your things. You'll stay for tea, won't you?"
        - id: ch04-b03
          speaker: rachel_lynde
          text: "Well, since you're insisting, I suppose I might as well stay."
        - id: ch04-b04
          speaker: narrator
          text: "Mrs. Rachel had never intended to do anything else. She and Marilla settled comfortably in the parlor together. Meanwhile, Anne prepared the tea and baked a batch of hot biscuits. They came out so light and white that even Mrs. Rachel could find nothing at all to criticize."
        - id: ch04-b05
          speaker: narrator
          text: "At sunset, Marilla walked with Mrs. Rachel to the end of the lane."
        - id: ch04-b06
          speaker: rachel_lynde
          text: "I have to admit, Anne has grown into a truly capable girl. She must be an enormous help to you."
        - id: ch04-b07
          speaker: marilla_cuthbert
          text: "She is. She's steady and dependable now. I used to fear she'd never outgrow those scatterbrained ways of hers, but she has. These days, I'd trust Anne with anything."
        - id: ch04-b08
          speaker: rachel_lynde
          text: "That first day I came here, three years ago, I never would have guessed she'd turn out so well. Goodness gracious, will I ever forget the fit she threw that day? When I got home that night, I said to Thomas, 'Mark my words, Thomas. Marilla Cuthbert will live to regret the step she's taken.'"
        - id: ch04-b09
          speaker: rachel_lynde
          text: "But I was wrong, and I'm glad to say so. I'm not one of those people who can never admit a mistake. Thank goodness, that has never been my way. I certainly judged Anne wrongly. Still, it was understandable. No one had ever seen such a strange, surprising little witch of a child. You couldn't figure her out by any of the rules that worked for other children."
        - id: ch04-b10
          speaker: rachel_lynde
          text: "It's nothing short of remarkable how much she's changed in these three years, especially in her looks. She's become a very pretty girl. Now, I can't say that pale, big-eyed sort of beauty is my own favorite. I prefer more color and sparkle, like Diana Barry or Ruby Gillis. Ruby's looks are certainly very showy."
        - id: ch04-b11
          speaker: rachel_lynde
          text: "And yet, when Anne stands with those girls, something happens. I can't quite explain it. She isn't half as handsome as they are, but somehow she makes them look ordinary and overdone. It's like putting those white June lilies she calls narcissus beside great big red peonies. That's exactly what it's like."
