  chapters:
    - id: ch01
      title: Dressing for the Concert
      blocks:
        - id: ch01-b01
          speaker: diana_barry
          text: "You should wear the white organdy. Definitely."
        - id: ch01-b02
          speaker: narrator
          text: "Diana and Anne were in the east gable room. Outside, a yellow-green twilight rested beneath a clear blue sky. The moon was rising over the Haunted Wood, turning from pale to shining silver. Sleepy birds called, playful breezes stirred, and distant voices and laughter floated through the summer air. But Anne's blind was down and her lamp was lit. Choosing her clothes for the evening was serious business."
        - id: ch01-b03
          speaker: narrator
          text: "The room had changed greatly since Anne's first night at Green Gables four years earlier. Back then, its bareness had seemed to sink right into her bones, making the place feel cold and terribly unwelcome. The changes came little by little. Marilla saw them happening and gave in with only mild resistance, until the east gable had become a sweet, delicate room any young girl might love."
        - id: ch01-b04
          speaker: narrator
          text: "Anne had never gotten the rose-covered velvet carpet or pink silk curtains she'd once dreamed about. She had grown, and her dreams had grown with her, so she probably no longer mourned those early wishes. Now there was pretty matting on the floor and pale green curtains that softened the tall window and fluttered whenever a breeze wandered in. Instead of gold and silver tapestry, apple-blossom paper covered the walls. Mrs. Allan had given her several good pictures. Miss Stacy's photograph held the place of honor, and Anne always kept fresh flowers on the little shelf beneath it. Tonight, white lilies gave the room the faintest perfume, almost like the dream of a fragrance."
        - id: ch01-b05
          speaker: narrator
          text: "There was no mahogany furniture, either. Instead, Anne had a white bookcase packed with books, a cushioned wicker chair, a dressing table trimmed in white muslin, and a low white bed. An old gilt mirror from the spare room hung above the table, decorated with pink Cupids and purple grapes."
        - id: ch01-b06
          speaker: narrator
          text: "Anne was getting ready for a concert at the White Sands Hotel. The hotel guests had arranged it to raise money for the Charlottetown hospital, gathering every amateur performer they could find nearby. Bertha Sampson and Pearl Clay would sing a duet. Milton Clark had a violin solo. Winnie Adella Blair would sing a Scottish ballad. Laura Spencer and Anne Shirley would each recite."
        - id: ch01-b07
          speaker: narrator
          text: "Once, Anne would have called this an epoch in her life. She was thrilled in that delicious way that makes every moment sparkle. Matthew was almost bursting with pride that his Anne had been invited. Marilla was nearly as proud, though she would have died before admitting it. Instead, she said it wasn't proper for so many young people to go racing off to the hotel without a responsible adult. Anne and Diana were riding with Jane Andrews and Jane's brother Billy in their two-seated buggy, and other Avonlea boys and girls were going too. Visitors were expected from town, and the performers would be served supper after the concert."
        - id: ch01-b08
          speaker: anne_shirley
          text: "Do you truly think the organdy is the better choice? My blue flowered muslin is prettier, and it's certainly more fashionable."
        - id: ch01-b09
          speaker: diana_barry
          text: "But the organdy looks much better on you. It's soft and frilly, and it falls so nicely. The muslin is stiff and makes you look much too dressed up. The organdy looks as if it belongs on you."
        - id: ch01-b10
          speaker: narrator
          text: "Anne sighed, but she gave in. Diana was becoming known for her excellent taste, and people often asked her advice about clothes. Diana herself looked especially pretty that night in wild-rose pink, a color Anne could never wear. Since Diana wasn't performing, though, she treated her own appearance as a small matter. All her time and care went into Anne. She declared that, for the honor of Avonlea, Anne must be dressed, combed, and decorated as perfectly as a queen."
        - id: ch01-b11
          speaker: diana_barry
          text: "Pull that ruffle out a little more. There. Let me tie your sash, and then we'll do your slippers. I'll make two thick braids and tie them halfway up with big white bows. No, don't pull a curl over your forehead. Leave that soft part showing. No other hairstyle suits you as well. Mrs. Allan says you look like a Madonna that way. And I'll put this little white rose behind your ear. My bush had only one, and I saved it for you."
        - id: ch01-b12
          speaker: anne_shirley
          text: "Should I wear my pearl beads? Matthew brought them home from town last week. I know he'd love to see me wearing them."
        - id: ch01-b13
          speaker: narrator
          text: "Diana tilted her dark head, pursed her lips, and studied Anne carefully. At last she approved. The pearls were tied around Anne's slim white throat."
        - id: ch01-b14
          speaker: diana_barry
          text: "You look so stylish, Anne. It's the way you carry your head, I suppose, or maybe your figure. I'm nothing but a dumpling. I always feared it, and now I know. I guess I'll simply have to accept it."
        - id: ch01-b15
          speaker: anne_shirley
          text: "But you have those beautiful dimples. They're like tiny dents in cream. I've given up hoping for dimples myself. That dream will never come true, but so many others have that I really shouldn't complain. Am I ready now?"
        - id: ch01-b16
          speaker: diana_barry
          text: "Completely ready. Come look at our performer, Marilla. Doesn't she look lovely?"
        - id: ch01-b17
          speaker: narrator
          text: "Marilla stood in the doorway. Her hair was grayer than it used to be, and she was still as thin and angular as ever, but her face had softened over the years. She answered with a sound halfway between a sniff and a grunt."
        - id: ch01-b18
          speaker: marilla_cuthbert
          text: "She looks neat and proper, and I like her hair that way. But she'll probably spoil that dress in the dust and dew before she gets there. It's too thin for a damp night. Organdy is the least practical cloth in the world, and I told Matthew so when he bought it. Talking to him is no use these days. He used to listen to me. Now he buys anything for Anne, and the Carmody clerks know it. They only have to call something pretty and fashionable, and out comes his money. Keep your skirt away from the wheel, Anne, and wear your warm jacket."
        - id: ch01-b19
          speaker: narrator
          text: "Marilla marched downstairs. Secretly, she was thinking how sweet Anne looked, with one moonbeam running from her forehead to her crown. She wished she could go hear her girl recite."
        - id: ch01-b20
          speaker: anne_shirley
          text: "Do you suppose the night really is too damp for this dress?"
        - id: ch01-b21
          speaker: diana_barry
          text: "Not at all. It's a perfect night, and there won't be any dew. Just look at the moonlight."
        - id: ch01-b22
          speaker: narrator
          text: "Diana raised the blind, and Anne came to the window beside her."
        - id: ch01-b23
          speaker: anne_shirley
          text: "I'm so glad this window faces the sunrise. Every morning I can watch the light climb over the long hills and shine between the pointed fir trees. It never looks the same twice. I feel as if that first sunlight washes my soul clean. Oh, Diana, I love this room so much. I don't know how I'll manage without it when I leave for town next month."
        - id: ch01-b24
          speaker: diana_barry
          text: "Please don't talk about leaving tonight. Thinking about it makes me miserable, and I want to enjoy this evening. What are you reciting? Are you nervous?"
          emotion: sad
        - id: ch01-b25
          speaker: anne_shirley
          text: "Not even a little. I've performed in public so many times that it doesn't bother me now. I'm going to do 'The Maiden's Vow.' It's terribly sad. Laura Spencer chose something funny, but I'd rather make people cry than laugh."
        - id: ch01-b26
          speaker: diana_barry
          text: "And what will you do when they call you back for another?"
        - id: ch01-b27
          speaker: anne_shirley
          text: "They won't even think of calling me back."
        - id: ch01-b28
          speaker: narrator
          text: "Anne did secretly hope they would. She could already picture herself telling Matthew about it over breakfast the next morning. Then wheels sounded outside. Billy and Jane had arrived, and the girls hurried down."
    - id: ch02
      title: The Dazzling Hotel
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: "Billy Andrews insisted that Anne sit beside him in front, so she climbed up reluctantly. She would much rather have been in back with the girls, free to laugh and talk as much as she pleased. Billy wasn't much help with either. He was a large, heavy, unexcitable young man of twenty, with a round face that showed almost nothing and a painful lack of talent for conversation. But he admired Anne enormously. The thought of driving to White Sands with that slim, upright figure beside him filled him with pride."
        - id: ch02-b02
          speaker: narrator
          text: "Anne managed to enjoy the ride anyway. She talked over her shoulder to the girls and now and then offered Billy a polite remark so he wouldn't feel forgotten. He would grin and chuckle, then think of an answer after it was much too late to say it. The night itself invited happiness. Buggies filled the road to the hotel, all traveling in the same direction, and laughter as clear as silver rang and rang again along the way."
        - id: ch02-b03
          speaker: narrator
          text: "The hotel shone with light from top to bottom. Ladies from the concert committee met the party, and one of them led Anne to the performers' dressing room. Members of a Charlottetown symphony club filled the room. Among them, Anne suddenly felt shy, frightened, and painfully country-bred."
        - id: ch02-b04
          speaker: narrator
          text: "At Green Gables, her dress had looked delicate and pretty. Here, among all the shimmering silk and rustling lace, it seemed too simple and far too plain. Her pearls looked like nothing beside the diamonds worn by a large, handsome woman nearby. And how poor her one tiny white rose must look next to the rich greenhouse flowers on the other dresses. Anne put away her hat and jacket, then slipped miserably into a corner and tried to make herself small. She wanted more than anything to be back in her quiet white room at Green Gables."
        - id: ch02-b05
          speaker: narrator
          text: "Things felt even worse when Anne was brought onto the platform in the great concert hall. Electric lights dazzled her eyes, while the heavy perfume and steady murmur of the crowd left her confused. She wished she could sit with Diana and Jane. They were far away at the back and seemed to be having a wonderful time. Instead, Anne was squeezed between a stout woman in pink silk and a tall girl in a white lace dress whose face seemed to look down on everyone."
        - id: ch02-b06
          speaker: narrator
          text: "Every so often, the pink lady turned and examined Anne through her eyeglasses until Anne felt she might scream. The girl in white lace spoke loudly to her neighbor about all the country bumpkins and rustic beauties in the audience. She lazily predicted great amusement from the local performers. Anne decided she would hate that girl forever."
        - id: ch02-b07
          speaker: narrator
          text: "To make matters worse, a professional performer named Mrs. Evans was staying at the hotel and had agreed to recite. She was slender and dark-eyed. Her wonderful gray gown shimmered like woven moonlight, and jewels gleamed at her neck and in her dark hair. Her voice could bend itself into every feeling, and she spoke with astonishing power. The audience went wild."
        - id: ch02-b08
          speaker: narrator
          text: "For a while Anne forgot herself and listened with shining eyes. The instant Mrs. Evans finished, Anne covered her face with both hands. She could never follow a performance like that. Never. How had she ever imagined she could recite? If only she were home at Green Gables."
          
        - id: ch02-b09
          speaker: narrator
          text: "And then, at the worst possible moment, the announcer called Anne's name. The girl in white lace gave a small, startled movement that looked almost guilty, but Anne neither saw it nor could have understood the compliment hidden in it. Somehow she stood and walked dizzily to the front. Her face had gone so pale that Diana and Jane gripped each other's hands in the audience."
        - id: ch02-b10
          speaker: narrator
          text: "Stage fright swept over Anne and took away every bit of strength she had. She had performed many times, but never before a crowd like this one. Everything around her was strange, brilliant, and confusing. Rows of women in evening gowns watched her. Critical faces seemed to rise everywhere. The whole room glittered with wealth and culture. It was nothing like the plain benches at the Avonlea Debating Club, filled with the ordinary, friendly faces of neighbors who wanted her to do well."
        - id: ch02-b11
          speaker: narrator
          text: "These people would show no mercy, Anne thought. Maybe they were waiting to laugh at the little country performer, just like the girl in white lace. Shame and misery closed around her. Her knees shook. Her heart fluttered, and she felt faint. She could not speak a single word. In another moment she would run from the platform, even though she believed the humiliation would follow her for the rest of her life."
    - id: ch03
      title: Anne Takes the Stage
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: "Then Anne's wide, frightened eyes found Gilbert Blythe at the back of the room. He was leaning forward with a smile that seemed proud and mocking. In truth, Gilbert wasn't mocking her at all. He was enjoying the whole evening, and especially the picture Anne made in front of the palms, slender and white, with her thoughtful face."
        - id: ch03-b02
          speaker: narrator
          text: "Josie Pye sat beside him, and her expression really was proud and mocking. Anne never noticed Josie. She wouldn't have cared if she had. She drew a deep breath and lifted her head. Courage and determination flashed through her like an electric shock. She would not fail in front of Gilbert Blythe. He would never get the chance to laugh at her. Never."
        - id: ch03-b03
          speaker: narrator
          text: "Her fear and nervousness disappeared as suddenly as they had come. Anne began 'The Maiden's Vow.' Her clear, sweet voice carried all the way to the farthest corner of the room without one shake or break. The terrible helpless moment had released something in her. Now that she had herself under control again, every feeling in the piece came alive. She recited better than she ever had before."
        - id: ch03-b04
          speaker: narrator
          text: "Honest applause burst out when she finished. Anne returned to her seat, blushing with shyness and delight. The stout woman in pink seized her hand and shook it warmly."
        - id: ch03-b05
          speaker: pink_lady
          text: "My dear, that was splendid! I've been crying like a baby. Truly, I have. Listen to them. They want you again, and they won't stop until you go back!"
          emotion: happy
        - id: ch03-b06
          speaker: anne_shirley
          text: "Oh, I can't. But I have to, don't I? Matthew will be disappointed if I don't. He told me they would ask for another."
        - id: ch03-b07
          speaker: pink_lady
          text: "Then you mustn't disappoint Matthew."
        - id: ch03-b08
          speaker: narrator
          text: "The pink lady laughed. Anne went back smiling, blushing, and bright-eyed. This time she gave a funny little piece with such charm that the audience loved her even more. For the rest of the evening, one small success followed another."
        - id: ch03-b09
          speaker: narrator
          text: "After the concert, the lady in pink took Anne under her care. She turned out to be married to an American millionaire, and she introduced Anne to everyone she knew. Everyone treated Anne kindly. Mrs. Evans herself came over and talked with her. The professional performer praised Anne's charming voice and told her she had interpreted both selections beautifully. After all her cruel remarks about country talent, even the girl in white lace offered Anne a small, lazy compliment."
        - id: ch03-b10
          speaker: narrator
          text: "Supper was served in the hotel's large, beautifully decorated dining room. Because they had come with Anne, Diana and Jane were invited to share it too. Billy, however, was nowhere to be found. He had fled in deadly fear that someone might give him just such an invitation. But when the evening was finally over, he was waiting outside with the horses and buggy. The three girls came out laughing together into the calm white moonlight. Anne took a long, deep breath and looked beyond the dark fir branches into the clear sky."
        - id: ch03-b11
          speaker: narrator
          text: "How good it felt to be outdoors again, in the clean and quiet night. Everything seemed vast and still and wonderful. The sea murmured in the distance, and the dark cliffs stood like grim giants guarding an enchanted shore."
    - id: ch04
      title: Rich in Moonlight
      blocks:
        - id: ch04-b01
          speaker: jane_andrews
          text: "Wasn't tonight wonderful? I wish I were a rich American. I'd spend every summer at a hotel, wear jewels and low-cut gowns, and eat ice cream and chicken salad every single day. That would be much more fun than teaching school. Anne, your recitation was marvelous, though at first I thought you'd never start. I liked it better than Mrs. Evans's."
        - id: ch04-b02
          speaker: anne_shirley
          text: "Oh, Jane, you mustn't say that. It sounds foolish. Mrs. Evans is a professional, and I'm only a schoolgirl who happens to recite fairly well. I'm perfectly happy if people simply enjoyed mine."
        - id: ch04-b03
          speaker: diana_barry
          text: "I have a compliment for you, Anne. I think it was one, judging by the way the man said it. At least part of it was. An American sat behind Jane and me. He looked so romantic, with black hair and black eyes. Josie says he's a famous artist, and that her mother's cousin in Boston married a man who once went to school with him."
        - id: ch04-b04
          speaker: diana_barry
          text: "We heard him ask who the girl with the splendid Titian hair was. He said he wanted to paint your face. There, Anne! But what in the world is Titian hair?"
        - id: ch04-b05
          speaker: anne_shirley
          text: "It means plain red hair when you translate it. Titian was a famous artist who enjoyed painting red-haired women."
          emotion: happy
        - id: ch04-b06
          speaker: jane_andrews
          text: "Did you see all those diamonds? They nearly blinded me. Wouldn't you love to be rich?"
        - id: ch04-b07
          speaker: anne_shirley
          text: "But we are rich. Why, we have sixteen whole years to our credit, we're as happy as queens, and every one of us has at least some imagination. Look at the sea, girls. It's all silver and shadow and visions of things we can't see. Even if we owned millions of dollars and ropes and ropes of diamonds, we couldn't enjoy its beauty any more than we do right now."
        - id: ch04-b08
          speaker: anne_shirley
          text: "You wouldn't trade places with any of those women if you truly could. Would you want to be that girl in white lace, wearing a sour expression forever as if she'd been born with her nose turned up at the world? Or the lady in pink? She's kind and pleasant, but so short and stout that she hardly has a figure at all. Or even Mrs. Evans, with that terribly sad look in her eyes? She must have been deeply unhappy once to have eyes like that. You know you wouldn't, Jane Andrews."
        - id: ch04-b09
          speaker: jane_andrews
          text: "I'm not completely sure. I think diamonds could comfort a person quite a lot."
        - id: ch04-b10
          speaker: anne_shirley
          text: "Well, I don't want to be anyone except myself, even if diamonds never comfort me at all. I'm content to be Anne of Green Gables with my string of pearls. Matthew put as much love into those beads as anyone ever put into the pink lady's jewels."
