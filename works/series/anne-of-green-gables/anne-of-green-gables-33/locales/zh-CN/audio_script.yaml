audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖机敏，带着含蓄的幽默讲述
        timbre: 清澈柔和
        pace: 舒展而富有变化
        pitch: medium
    anne:
      display_name: 安妮
      tts:
        delivery: 热烈敏感，想象丰富，情绪来得真切而迅速
        timbre: 明亮清脆的少女声
        pace: 偏快，激动时连贯奔涌
        pitch: medium-high
    diana:
      display_name: 戴安娜
      tts:
        delivery: 亲切真诚，对朋友满怀关心
        timbre: 柔和甜润的少女声
        pace: 自然适中
        pitch: medium-high
    marilla:
      display_name: 玛丽拉
      tts:
        delivery: 严厉务实，关切藏在克制的话语里
        timbre: 稳定清晰的中年女声
        pace: 从容直接
        pitch: medium-low
    jane:
      display_name: 简
      tts:
        delivery: 坦率务实，想到什么就直说
        timbre: 清亮朴实的少女声
        pace: 自然明快
        pitch: medium-high
    pink_lady:
      display_name: 粉红衣裙的太太
      tts:
        delivery: 热情爽朗，待人亲切而毫不拘束
        timbre: 丰满明亮的成年女声
        pace: 稍快，兴奋时微微气喘
        pitch: medium
  chapters:
    - id: ch01
      title: 第三十三章　旅馆音乐会
      blocks:
        - id: ch01-b01
          speaker: diana
          text: 安妮，今晚无论如何也得穿那条白色蝉翼纱裙。
        - id: ch01-b02
          speaker: narrator
          text: 戴安娜说得斩钉截铁。她们正在东山墙的房间里梳妆。窗外刚入暮，黄绿色的暮光温柔地笼着大地，天空湛蓝无云。闹鬼的树林上方，一轮圆月正从苍白变成明亮的银色。倦鸟轻声啼叫，微风来去嬉闹，远处还飘来人声和笑声。可安妮已经放下窗帘，点起了灯。今晚这番打扮，可是一件大事。
        - id: ch01-b03
          speaker: narrator
          text: 四年前的那个夜晚，这间屋子还空荡得冷人心骨。那股拒人于外的寒意，几乎钻进了安妮的灵魂深处。后来，各样东西一点一点添了进来。玛丽拉嘴上无奈，心里却也都默许。如今，这里早已换了模样，成了少女最喜欢的甜美雅致的小窝。
        - id: ch01-b04
          speaker: narrator
          text: 安妮小时候梦想过一张缀满粉红玫瑰的天鹅绒地毯，还有粉红丝绸窗帘。那些当然没有出现，不过她的梦想也跟着年岁一起长大了，大概并不觉得遗憾。现在，地上铺着漂亮草席，淡绿色细纱帘让高窗显得柔和，还会被偶尔闯进来的风轻轻吹动。苹果花墙纸上挂着艾伦太太送的几幅好画。史黛西小姐的照片摆在最重要的位置，安妮坚持在下面的小托架上常放鲜花。今晚是一枝白百合，香气淡得像花香做的一场梦。
        - id: ch01-b05
          speaker: narrator
          text: 房里当然没有安妮曾经向往的红木家具，却有一只漆白的书架，里面装满了书。还有铺着软垫的藤摇椅，围着白色细棉纱边的梳妆台。客房里那面别致的旧镜子也搬来了，拱形的镀金镜框上画着胖乎乎的粉红小爱神和一串串紫葡萄。低矮的白床也安安静静地待在一旁。
        - id: ch01-b06
          speaker: narrator
          text: 安妮要去白沙旅馆参加音乐会。旅馆的客人们为了替夏洛特敦医院募捐，发起了这场演出，还把附近各地能找到的业余人才全都请来助阵。白沙浸礼会唱诗班的伯莎·桑普森和珀尔·克莱要唱二重唱，新桥的米尔顿·克拉克独奏小提琴，卡莫迪的温妮·阿德拉·布莱尔唱苏格兰歌谣。斯彭塞维尔的劳拉·斯宾塞和埃文利的安妮·雪莉，则要登台朗诵。
        - id: ch01-b07
          speaker: narrator
          text: 用从前安妮的话说，这简直是她生命里的新纪元。她满心都是兴奋，浑身甜甜地发颤。马修觉得，旅馆请他的安妮去朗诵，是了不得的荣耀。他骄傲得简直上了第七重天。玛丽拉心里的骄傲其实也差不多，只是她宁死也不肯承认。她嘴上只说，一群年轻人没有稳重可靠的大人陪着，就这样跑去旅馆，实在不大合宜。
        - id: ch01-b08
          speaker: narrator
          text: 安妮和戴安娜会坐简·安德鲁斯与她哥哥比利的双排座马车去，埃文利还有好些姑娘和小伙子同行。那天还会有一批客人从城里赶来。等演出结束以后，主办方还要设晚宴，专门款待参加演出的演员们。
        - id: ch01-b09
          speaker: anne
          text: 你真的觉得蝉翼纱裙最好吗？它好像没有蓝花细棉纱裙漂亮，也没有那条时髦。
        - id: ch01-b10
          speaker: diana
          text: 可它更衬你呀。料子柔软，有褶边，穿上又贴身。细棉纱裙太硬，显得你打扮过了头。这一条倒像是从你身上长出来的。
        - id: ch01-b11
          speaker: narrator
          text: 安妮叹口气，还是听了她的。戴安娜已经有了会打扮的名声，大家遇到穿衣的问题，都很信服她的眼光。她自己穿着一条可爱的野玫瑰粉红裙子，也十分漂亮。这种颜色，却是安妮一辈子也不敢碰的。不过戴安娜不上台，所以她今晚好不好看并不是头等大事。她把全部心思都放在安妮身上，还发誓，为了埃文利的体面，安妮从裙子到头发，再到每一样装饰，全都要合乎女王的品位。
        - id: ch01-b12
          speaker: diana
          text: 把褶边再拉出来一点。对，就是这样。来，我替你系腰带，再穿上鞋。头发编成两条粗辫子，编到一半系白色的大蝴蝶结。额前不许抽卷发，只留柔顺的中分。你这样梳最好看，艾伦太太也说，你像圣母像呢。我再把这朵白蔷薇别在你耳后。花丛里只开了这一朵，我特意给你留的。
        - id: ch01-b13
          speaker: anne
          text: 我要不要戴珍珠项链？马修上星期进城给我买的。他一定想看我戴着。
        - id: ch01-b14
          speaker: narrator
          text: 戴安娜抿着嘴，把黑发的脑袋歪到一边，认真看了半晌，最后同意了。珍珠便系上安妮纤细洁白的脖颈。
        - id: ch01-b15
          speaker: diana
          text: 安妮，你身上有一种气派，连昂头的样子都很有风度。大概是因为你身材好。我却像一只圆面团。我一直怕自己真是这样，现在总算确定了。看来只好认命啦。
        - id: ch01-b16
          speaker: anne
          text: 可你有那么好看的酒窝，像奶油上按出的两个小窝。我已经不指望自己的酒窝梦会成真了。不过，我有那么多梦想都实现了，也不该抱怨。现在全好了吗？
        - id: ch01-b17
          speaker: diana
          text: 全好了。玛丽拉，快来看看我们的朗诵家。她是不是漂亮极了？
        - id: ch01-b18
          speaker: narrator
          text: 玛丽拉正好站到门口。她仍旧瘦削多棱角，头发比从前更灰，脸色却柔和多了。听见戴安娜问，她只从鼻子里哼咕了一声。
        - id: ch01-b19
          speaker: marilla
          text: 看起来倒是干净得体，头发也梳得不错。不过一路过去，既有尘土又有露水，这裙子恐怕要毁了。潮湿的夜晚穿它还嫌太薄。蝉翼纱本来就是世上最不经穿的料子，马修买的时候我就对他说过。可如今跟他说什么也没用。从前他还听我的劝，现在却只管给安妮买东西。卡莫迪的店员都知道，什么东西都能塞给他。只要说一件东西又漂亮又时髦，他马上就会把钱掏出来。安妮，当心裙摆别碰到车轮，暖和的外套也要穿上。
        - id: ch01-b20
          speaker: narrator
          text: 玛丽拉大步下楼，心里却骄傲地想着，安妮看上去多甜美。她额头到发顶之间，仿佛照着一缕月光。玛丽拉只遗憾自己不能去听她的姑娘朗诵。
        - id: ch01-b21
          speaker: anne
          text: 我的裙子会不会真的嫌潮？
        - id: ch01-b22
          speaker: diana
          text: 一点也不潮。今晚好得不能再好，根本不会有露水。你看看月光。
        - id: ch01-b23
          speaker: anne
          text: 真高兴我的窗子朝东。每天早晨，看太阳从长长的山丘上升起，再穿过尖尖的冷杉梢，那景象每次都是新的。我觉得自己的灵魂也浸在最初的阳光里，洗得干干净净。戴安娜，我太爱这间小屋了。下个月进城以后，没有它陪着，我真不知道该怎么过。
        - id: ch01-b24
          speaker: diana
          text: 今晚别说你要走。一想这件事我就难过，我还想今晚好好开心呢。你准备朗诵什么？会紧张吗？
        - id: ch01-b25
          speaker: anne
          text: 一点也不。我当众朗诵过那么多次，早就不怕了。我选了《少女的誓言》，它特别哀婉。劳拉要朗诵逗笑的作品，可我更愿意把人说哭。
        - id: ch01-b26
          speaker: diana
          text: 要是大家叫你再来一篇呢？
        - id: ch01-b27
          speaker: anne
          text: 他们做梦也不会请我再来。
        - id: ch01-b28
          speaker: narrator
          text: 安妮嘴上这么说，心里却偷偷盼着大家真的会请她再来一篇。她甚至已经看见了第二天早餐时的情景，看见自己坐在桌边，把这件事从头到尾说给马修听。就在这时，屋外传来了比利和简那辆马车的车轮声。
        - id: ch01-b29
          speaker: anne
          text: 他们来了。快走吧。
        - id: ch01-b30
          speaker: narrator
          text: 比利坚持让安妮坐在前排。她只好不情愿地爬上去，心里更想在后面和姑娘们坐在一起。那样，她就能想笑便尽情笑，想聊便尽情聊。可比利身上，无论笑声还是话语都少得可怜。他已经二十岁，又高又胖，性情迟钝，圆脸上没有多少表情，更不幸的是，他几乎没有一点谈话的本领。他却非常仰慕安妮。想到一路去白沙时，那道纤细挺拔的身影就坐在自己身边，他骄傲得整个人都像鼓了起来。
        - id: ch01-b31
          speaker: narrator
          text: 安妮只好回头和姑娘们聊天，偶尔也客气地跟比利说一句。比利每次都咧嘴傻笑，可等他终于想好回答，开口的时候早就过去了。尽管如此，安妮还是设法享受了这段路程。那本来就是个叫人快活的夜晚。去旅馆的路上挤满马车，每一辆都朝着同一个方向赶去，银铃般清脆的笑声在路上来回飘荡。
        - id: ch01-b32
          speaker: narrator
          text: 到了白沙旅馆，只见整座楼从楼顶到楼下灯火通明。委员会的太太们迎上来，其中一位把安妮领进演员化妆室。那里坐满夏洛特敦交响乐会的成员，安妮一下觉得自己又羞怯，又胆怯，浑身都透着乡下气。她的裙子在东山墙房里明明那么精致雅致，现在夹在闪光作响的丝绸和花边中，却朴素得寒酸。她的珍珠怎能和身旁那位高大漂亮的太太满身的钻石相比？耳后唯一的小白蔷薇，放在别人佩戴的温室鲜花旁，也显得可怜极了。安妮收起帽子和外套，难过地缩到角落里，只想回到绿山墙那间白色的小屋。
        - id: ch01-b33
          speaker: narrator
          text: 不久，安妮坐上了宽敞音乐厅的舞台，情形变得更糟。电灯晃得她睁不开眼，浓浓的香水味和四下的嗡嗡声让她头晕。她真希望自己能坐进观众席，和戴安娜、简待在一起。她们远远坐在后排，看起来正快活。安妮却被夹在两个女人中间。一边是穿粉红绸裙的胖太太，不时把脸正正地转过来，隔着夹鼻眼镜仔细打量她，看得安妮几乎想叫出声。另一边是穿白花边裙的高个姑娘，神情十分傲慢。她一直用人人都听得见的声音，向邻座谈论观众席里的乡巴佬和村姑，还懒洋洋地等着看本地演员闹出多大的笑话。安妮觉得，自己会恨她一辈子。
        - id: ch01-b34
          speaker: narrator
          text: 对安妮来说，更不走运的是，旅馆里偏偏住着一位职业朗诵家，她也答应登台。那女人身姿轻盈，眼睛乌黑，一袭奇妙的灰裙闪动着光，像是用月光织成。她颈间和黑发上都缀着宝石。她的声音变化万千，表现力也非同寻常。观众听完简直为她疯狂。安妮起初忘了自己，也忘了自己的烦恼，听得入了神，双眼亮晶晶的。可朗诵一结束，她猛地用双手捂住脸。听过这样的表演以后，自己怎么可能上台？她怎么会以为自己也能朗诵呢？她只想马上回到绿山墙去。
        - id: ch01-b35
          speaker: narrator
          text: 偏偏就在这最糟糕的时刻，台上叫到了安妮的名字。她也不知道自己是怎么站起来的，只觉得头晕目眩，脚下发飘，就这样走到了台前。白花边姑娘惊讶地动了一下，像是有点心虚。她没料到眼前这个乡下姑娘竟会登台，那反应其实藏着一句微妙的赞美。可安妮既没看见，也不会明白。她的脸白得吓人。戴安娜和简坐在下面，看得紧张极了，只能紧紧握住彼此的手。
        - id: ch01-b36
          speaker: narrator
          text: 安妮彻底怯场了。她以前常当众朗诵，却从没面对过这样的观众。眼前的一切都让她失去了力气。那一排排穿晚礼服的太太小姐，一张张挑剔的面孔，还有满屋由财富与教养汇成的气氛，全都陌生又耀眼。这里和辩论社太不一样了。那里只有朴素的长凳，坐着熟悉而友善的亲友和邻居。这里的人却可能毫不留情。说不定，他们也像白花边姑娘一样，正等着取笑她这个乡下人的表演。
        - id: ch01-b37
          speaker: narrator
          text: 安妮羞愧又痛苦，觉得自己既没有希望，也没有办法。她双膝发抖，心口扑腾乱跳，一阵可怕的眩晕压了上来。她一个字也说不出。下一刻，她就要转身逃下台去。她明明知道，只要真的逃走，那份屈辱从此就会跟着她一辈子，可她也顾不得了。
        - id: ch01-b38
          speaker: narrator
          text: 可她那双因惊恐而睁大的眼睛，忽然在后排看见了吉尔伯特。他正探身向前，脸上带着笑。安妮立刻认定，那笑容既得意又嘲弄。其实根本不是那么回事。吉尔伯特只是欣赏整场演出，也尤其欣赏棕榈树前的安妮。她身穿白裙，身形纤细，脸庞清秀脱俗，的确像一幅动人的画。乔西坐在吉尔伯特身边，是他驾车带来的。她脸上倒真的带着得意和嘲弄。不过安妮没有看见她，就算看见了也不会在乎。
        - id: ch01-b39
          speaker: narrator
          text: 安妮深深吸了一口气，骄傲地扬起头。勇气和决心像一阵电流，立刻传遍全身。她绝不能在吉尔伯特·布莱思面前失败，更不能让他有机会嘲笑自己。永远不能。她的恐惧和紧张一下消失了。她开始朗诵，清澈甜美的声音稳稳传到大厅最远的角落，自始至终没有颤抖，也没有停顿。她完全找回了镇定。刚才那阵可怕的无力，反而激出一股力量，让她发挥得比从前任何一次都好。
        - id: ch01-b40
          speaker: narrator
          text: 朗诵结束后，真诚的掌声一阵阵响起来。安妮回到座位时，脸涨得通红，又羞怯，又欢喜。先前一直打量她的粉红衣裙胖太太立刻转过身，使劲握住她的手，热情地连连摇晃。
        - id: ch01-b41
          speaker: pink_lady
          text: 亲爱的，你朗诵得太好了。我真的哭得像个小娃娃。听，他们在叫你再来一个，非请你回去不可！
          emotion: happy
        - id: ch01-b42
          speaker: anne
          text: 我不能再去了。可是，我又必须去，不然马修会失望。他早就说过，大家会叫我再来一个。
        - id: ch01-b43
          speaker: pink_lady
          text: 那就别让马修失望。
        - id: ch01-b44
          speaker: narrator
          text: 粉红衣裙的太太笑了。安妮也终于笑着站起来。她脸上还泛着红，清亮的眼睛闪闪发光，脚步轻快地回到台前。这一次，她朗诵的是一篇别致又有趣的小作品，逗得观众越发喜欢她。刚才那场几乎把她击倒的怯场已经过去。接下来无论走到哪里，都有人赞赏她、亲切地同她说话。那天晚上剩下的时光，完全成了她小小的凯旋。
        - id: ch01-b45
          speaker: narrator
          text: 音乐会结束后，安妮才知道，粉红衣裙的太太原来是一位美国百万富翁的妻子。她把安妮护在身边，带着她四处介绍给所有人认识，而每个人都对安妮很亲切。职业朗诵家埃文斯太太也亲自过来聊天，说安妮的嗓音十分迷人，对两篇作品的诠释也很优美。就连那个先前满口乡巴佬和村姑的白花边姑娘，也懒洋洋地送了她一句称赞。
        - id: ch01-b46
          speaker: narrator
          text: 晚宴设在装饰得富丽堂皇的大餐厅。戴安娜和简因为陪安妮前来，也受邀入席。只有比利到处都找不到。原来他怕得要命，生怕有人也请自己赴宴，早就逃之夭夭了。不过一切结束以后，他仍驾着马车等在外面。三个姑娘欢欢喜喜地走出旅馆，回到宁静洁白的月光里。安妮深深吸了一口气，抬头望着冷杉暗沉的枝条之外，那片清澈无云的天空。
        - id: ch01-b47
          speaker: narrator
          text: 终于又从灯光、香气和人声里走出来，回到纯净安静的夜色中，真好。天地显得那么辽阔，那么安宁，又那么奇妙。海水低沉的呢喃穿过整片夜色，远方的悬崖渐渐没入黑暗，仿佛一群冷峻的巨人，守着被魔法笼罩的海岸。
        - id: ch01-b48
          speaker: jane
          text: 今晚是不是好得不能再好了？我真希望自己是个有钱的美国人。那样就能整个夏天住旅馆，戴珠宝，穿低领裙，每天都吃冰激凌和鸡肉沙拉。肯定比教书有趣多了。安妮，你朗诵得太棒啦。开头我还以为你永远也说不出话呢。我觉得你比埃文斯太太还好。
          emotion: happy
        - id: ch01-b49
          speaker: anne
          text: 简，千万别那么说，听着太傻了。我不可能比埃文斯太太好。她是职业朗诵家，我只是个有一点朗诵天分的女学生。大家觉得我还不错，我就已经很满足了。
        - id: ch01-b50
          speaker: diana
          text: 安妮，我有一句赞美要转告你。至少他说话的口气听着像赞美，其中一部分肯定是。简和我后面坐着一个美国人，头发和眼睛都黑得像煤，长得可浪漫了。乔西说他是个大名鼎鼎的画家，她母亲在波士顿的表亲嫁了一个男人，那人从前还和他一起上过学呢。
        - id: ch01-b51
          speaker: diana
          text: 我和简都听见他说，台上那个有一头绚丽提香色头发的姑娘是谁？她那张脸，我真想画下来。听见了吧？不过，提香色头发到底是什么意思？
        - id: ch01-b52
          speaker: anne
          text: 翻成普通话，大概就是普普通通的红头发。提香是位很有名的画家，他喜欢画红头发的女人。
        - id: ch01-b53
          speaker: jane
          text: 你们看见那些太太戴的钻石了吗？简直亮得眼睛都要睁不开了。姑娘们，要是你们也能变得那么有钱，难道不会喜欢吗？
        - id: ch01-b54
          speaker: anne
          text: 我们本来就很富有呀。我们才十六岁，幸福得像女王，而且多多少少都有想象力。看看那片海吧，那里有银光，有暗影，还有一切看不见的事物留下的幻景。哪怕我们有几百万块钱，脖子上戴着一串又一串钻石，也不可能从这片美景里多得到一点快乐。
        - id: ch01-b55
          speaker: anne
          text: 就算真能变，你也不会想做那些人。难道你想变成白花边姑娘，一辈子满脸尖酸，好像一出生就在对全世界翘鼻子？还是变成那位粉红衣裙的太太？她虽然亲切，却又矮又胖，简直没有身段。就连埃文斯太太也不行。她眼睛里有那么深的哀伤，一定曾经非常不幸，才会留下那样的眼神。简·安德鲁斯，你明明知道自己不愿意！
        - id: ch01-b56
          speaker: jane
          text: 我也不能说自己完全确定。反正我觉得，一个人要是有钻石陪着，准能得到不少安慰。
        - id: ch01-b57
          speaker: anne
          text: 我可不想做除了自己以外的任何人，就算这辈子都没有钻石来安慰我。我很满足做绿山墙的安妮，戴着自己的这串珍珠项链。我知道，马修送我珍珠的时候，把他的爱也放了进来。这份爱绝不会比粉红衣裙太太那些珠宝里带着的少。
