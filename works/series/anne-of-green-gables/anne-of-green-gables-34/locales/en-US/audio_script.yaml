  chapters:
    - id: ch01
      title: A Queen's Girl
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: "The next three weeks kept everyone at Green Gables busy. Anne was getting ready to leave for Queen's, which meant sewing, planning, and talking over one detail after another. Her new clothes were plentiful and pretty because Matthew made sure of it. For once, Marilla didn't object to a single thing he bought or proposed. Then one evening, she came up to the east gable with her arms full of delicate pale green cloth."
        - id: ch01-b02
          speaker: marilla_cuthbert
          text: "Anne, I brought you material for a nice light dress. You don't truly need another one. You already have plenty of pretty waists. Still, you might want something dressy if you're invited to a party or somewhere else in town at night. Jane and Ruby and Josie all have what they call evening dresses, and I won't have you falling behind them. Mrs. Allan helped me choose this in town last week. We'll ask Emily Gillis to sew it. She has excellent taste, and nobody can match the way her dresses fit."
        - id: ch01-b03
          speaker: anne_shirley
          text: "Oh, Marilla, it's beautiful! Thank you so much. I don't think you should be this kind to me. Every day, you're making it harder for me to leave."
          emotion: happy
        - id: ch01-b04
          speaker: narrator
          text: "Emily made the green dress with every tuck, frill, and bit of shirring her good taste would allow. One evening Anne put it on for Matthew and Marilla, then performed The Maiden's Vow in the kitchen. Her face shone and every movement was graceful. As Marilla watched, she remembered the night Anne first came to Green Gables. She could see that strange, frightened child again, dressed in a dreadful yellow-brown wincey dress with heartbreak showing through her tears. The memory brought tears to Marilla's eyes, too."
        - id: ch01-b05
          speaker: anne_shirley
          text: "Why, Marilla, my recitation made you cry!"
          emotion: happy
        - id: ch01-b06
          speaker: narrator
          text: "Anne bent over Marilla's chair and brushed her cheek with a quick butterfly kiss."
        - id: ch01-b07
          speaker: anne_shirley
          text: "I call that a complete triumph."
          emotion: happy
        - id: ch01-b08
          speaker: marilla_cuthbert
          text: "It wasn't your poem that made me cry. I was thinking about the little girl you used to be. I found myself wishing you could have stayed little, strange ways and all. Now you're grown, and you're going away. In that dress you look so tall and stylish, so different somehow. You hardly look as if you belong in Avonlea. Thinking about it all made me lonesome."
          emotion: sad
        - id: ch01-b09
          speaker: narrator
          text: "Anne settled onto Marilla's gingham-covered lap. She held Marilla's lined face between her hands and looked into her eyes with grave tenderness."
        - id: ch01-b10
          speaker: anne_shirley
          text: "Marilla, I haven't changed. Not deep down. I've only been pruned back and grown new branches. The real me in here is just the same. It won't matter where I go or how different I may look. In my heart, I'll always be your little Anne. I'll love you and Matthew and dear Green Gables more every day of my life."
        - id: ch01-b11
          speaker: narrator
          text: "Anne pressed her young cheek to Marilla's faded one, then reached over to pat Matthew's shoulder. Marilla would have given almost anything to speak her feelings as Anne could. But nature and a lifetime of habit stood in her way. All she could do was wrap her arms tightly around her girl and hold her close, wishing she would never have to let go."
        - id: ch01-b12
          speaker: narrator
          text: "Matthew's eyes looked suspiciously damp. He rose and went outside. Beneath the stars in the blue summer night, he crossed the yard in an agitated walk and stopped by the gate under the poplars."
        - id: ch01-b13
          speaker: matthew_cuthbert
          text: "Well now, I don't suppose she's been spoiled much after all. Seems my speaking up once in a while never did any harm. She's clever and pretty, and she's loving, too. That's worth more than everything else. She's been a blessing to us. There was never a luckier mistake than the one Mrs. Spencer made, if it really was luck. No, I don't believe it was. It was Providence. The Almighty knew we needed her."
        - id: ch01-b14
          speaker: narrator
          text: "At last, the day came for Anne to leave for town. She and Matthew drove away on a fine September morning. Her good-bye with Diana was full of tears. Marilla kept her own farewell practical and tearless. Afterward, Diana wiped her face and went to a beach picnic at White Sands with some cousins from Carmody. She managed to enjoy herself fairly well. Marilla attacked one unnecessary chore after another and worked fiercely all day. Her heartache was the bitter kind that burns and gnaws because no ready tears will wash it away."
        - id: ch01-b15
          speaker: narrator
          text: "That night, Marilla went to bed knowing far too clearly that the little gable room at the end of the hall was empty. No vivid young life filled it now. No soft breathing stirred the quiet. Marilla buried her face in her pillow and sobbed for her girl. Later, when she had grown calm enough to think, the force of her own grief frightened her. Surely, she told herself, it must be terribly wicked to carry on so over any sinful human creature."
        - id: ch01-b16
          speaker: narrator
          text: "Anne and the other Avonlea students reached town with barely enough time to hurry to the Academy. Their first day swept by pleasantly in a rush of excitement. They met the other students, learned to recognize the professors, and were sorted into classes. On Miss Stacy's advice, Anne chose the Second Year course. Gilbert Blythe chose it, too. If they succeeded, they could earn First Class teaching licenses in one year instead of two. They would also face much harder work. Jane, Ruby, Josie, Charlie, and Moody Spurgeon felt no such push of ambition. They settled for the Second Class course."
        - id: ch01-b17
          speaker: narrator
          text: "A pang of loneliness caught Anne when she sat among fifty students in her new classroom. The only one she knew was the tall, brown-haired boy across the room. Given the strained way she knew Gilbert, that wasn't much comfort. Even so, she was truly glad he was in her class. Their old rivalry could continue. Without it, Anne would hardly have known what to do with herself."
        - id: ch01-b18
          speaker: anne_shirley
          text: "I wouldn't feel right without that rivalry. Gilbert looks terribly determined. I suppose he's deciding this very minute that he'll win the medal. What a splendid chin he has! How did I never notice it? I only wish Jane and Ruby had tried for First Class, too. Once I know people, I probably won't feel quite so much like a cat in a strange attic. I wonder which girls will become my friends. That's an interesting thing to imagine. I promised Diana that no girl at Queen's could ever be as dear to me as she is. Still, I have plenty of second-best affection to give away."
        - id: ch01-b19
          speaker: anne_shirley
          text: "I like that brown-eyed girl in the crimson waist. She looks so bright and rosy. And look at the pale, fair girl by the window. Her hair is lovely, and she looks as if she understands dreams. I'd like to know them both. I want to know them well enough to walk with my arm around their waists and call them by nicknames. But right now, I don't know them. They don't know me, either, and they probably don't especially want to. Oh, this is lonely!"
          emotion: sad
        - id: ch01-b20
          speaker: narrator
          text: "At twilight that evening, Anne felt lonelier still in her boarding-house bedroom. The other girls had relatives in town who could take them in, but Anne did not. Miss Josephine Barry had offered her a room, yet Beechwood stood too far from the Academy. Instead, Miss Barry found a boarding house and promised Matthew and Marilla that it suited Anne perfectly."
        - id: ch01-b21
          speaker: miss_josephine_barry
          text: "The woman who runs it is a gentlewoman whose family has lost its money. Her husband was a British officer, and she is very particular about her boarders. Anne won't meet anyone objectionable in that house. The food is good, the Academy is nearby, and the neighborhood is quiet."
        - id: ch01-b22
          speaker: narrator
          text: "Every word of that might have been true. In fact, it all turned out to be true. But none of it helped when Anne's first terrible wave of homesickness came over her. She looked miserably around the narrow room. The wallpaper was dull, the walls had no pictures, and there was only a small iron bed and an empty bookcase. A painful lump rose in her throat as she remembered her white room at Green Gables."
        - id: ch01-b23
          speaker: narrator
          text: "At home, she could feel the great green stillness waiting outdoors. Sweet peas grew in the garden. Moonlight fell across the orchard, the brook ran below the slope, and spruce branches moved in the night wind. Above it all stretched a huge sky full of stars. Through the gap in the trees, a light shone from Diana's window. Here, Anne had none of that. Beyond this window lay a hard street. Telephone wires crossed the sky. Unknown footsteps passed below, and a thousand city lights shone on the faces of strangers. Anne knew she was about to cry, and she fought it."
        - id: ch01-b24
          speaker: anne_shirley
          text: "I will not cry. It's foolish and weak. Oh, there's the third tear splashing beside my nose, and more are coming. I have to think of something funny. But everything funny I know belongs to Avonlea, and that only makes it worse. Four tears. Five. I'm going home next Friday, but Friday feels a hundred years away. Matthew must be almost home now, and Marilla will be standing at the gate, watching down the lane for him. Six. Seven. Eight. Oh, counting is useless! In another moment they'll come pouring out. I can't cheer myself up, and I don't want to. Being miserable feels better."
          emotion: sad
        - id: ch01-b25
          speaker: narrator
          text: "The tears would surely have poured out if Josie Pye hadn't appeared just then. Anne was so happy to see a familiar face that she forgot how little she and Josie had ever liked each other. Tonight, anyone connected with Avonlea was welcome, even a Pye."
        - id: ch01-b26
          speaker: anne_shirley
          text: "I'm honestly so glad you came up."
          emotion: happy
        - id: ch01-b27
          speaker: josie_pye
          text: "You've been crying. I suppose you're homesick. Some people have so little control over themselves that way. I'm certainly not going to be homesick. Town is far too much fun after dull old Avonlea. I don't know how I stood living there for so long. And you really shouldn't cry, Anne. It turns your nose and eyes red, and then you look red all over."
        - id: ch01-b28
          speaker: josie_pye
          text: "I had a perfectly wonderful day at the Academy. Our French professor is an absolute darling. That mustache of his would make your heart turn somersaults. Do you have anything to eat? I'm truly starving. Ah, I knew Marilla would send you with plenty of cake. That's why I stopped by. Otherwise, I would have gone to hear the band in the park with Frank Stockley. He stays at my boarding house, and he's great fun."
        - id: ch01-b29
          speaker: josie_pye
          text: "Frank noticed you in class today and asked me about the red-haired girl. I told him you were an orphan the Cuthberts adopted and that nobody really knew much about your life before then."
        - id: ch01-b30
          speaker: narrator
          text: "Anne began to wonder whether being alone with her tears might be better than having Josie for company. Then Jane and Ruby arrived, each proudly wearing an inch of Queen's ribbon in purple and scarlet on her coat. Josie wasn't speaking to Jane at the time, so she quieted down and became much less troublesome."
        - id: ch01-b31
          speaker: jane_andrews
          text: "Well, I feel as if several months have passed since this morning. I should be home studying Virgil. That dreadful old professor assigned us twenty lines for tomorrow. But I couldn't make myself study tonight. Anne, I believe I see signs of tears. If you cried, please admit it. You'll give me back my self-respect. I was crying freely before Ruby came along. I don't mind being silly quite so much when someone else is being silly, too. Is that cake? You will give me just a tiny piece, won't you? Thank you. It tastes exactly like Avonlea."
        - id: ch01-b32
          speaker: narrator
          text: "Ruby spotted the Queen's calendar on the table."
        - id: ch01-b33
          speaker: ruby_gillis
          text: "Anne, are you planning to compete for the gold medal?"
        - id: ch01-b34
          speaker: narrator
          text: "Anne blushed and admitted that she was considering it."
        - id: ch01-b35
          speaker: josie_pye
          text: "Oh, that reminds me. Queen's is getting an Avery scholarship after all. The news came today. Frank Stockley told me. His uncle is on the board of governors, you know. They'll make the announcement at the Academy tomorrow."
        - id: ch01-b36
          speaker: narrator
          text: "An Avery scholarship! Anne's heart began to beat faster. In an instant, her ambition reached toward a wider horizon. Until Josie spoke, Anne's highest goal had been a First Class provincial teaching license at the end of the year, and perhaps the medal. Now she could see herself winning the scholarship, studying for an Arts degree at Redmond College, and graduating in a cap and gown. The vision formed before the echo of Josie's words had faded. The scholarship was for English, and Anne felt she had stepped onto ground that truly belonged to her."
        - id: ch01-b37
          speaker: narrator
          text: "A wealthy manufacturer from New Brunswick had died and left part of his fortune to fund many scholarships. They would go to high schools and academies across the Maritime Provinces according to each school's standing. For a long time, nobody knew whether Queen's would receive one. Now the decision had been made. At the end of the year, the graduate with the highest marks in English and English Literature would receive two hundred and fifty dollars each year for four years at Redmond College. It was no wonder Anne went to bed that night with tingling cheeks."
        - id: ch01-b38
          speaker: anne_shirley
          text: "If hard work can win that scholarship, then I'll win it. Wouldn't Matthew be proud if I earned a B.A.? Oh, having ambitions is wonderful. I'm so glad I have so many. And the best part is that they never seem to end. The moment you reach one ambition, you can already see another sparkling even higher. It makes life so interesting."
          emotion: happy
