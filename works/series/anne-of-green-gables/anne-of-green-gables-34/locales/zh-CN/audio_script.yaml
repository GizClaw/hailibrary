audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖机敏，带着含蓄的幽默讲述
        timbre: 清澈柔和
        pace: 舒展而富有变化
        pitch: medium
    anne:
      display_name: 安妮
      tts:
        delivery: 热烈敏感，想象丰富，情绪来得真切而迅速
        timbre: 明亮清脆的少女声
        pace: 偏快，激动时连贯奔涌
        pitch: medium-high
    marilla:
      display_name: 玛丽拉
      tts:
        delivery: 严厉务实，关切藏在克制的话语里
        timbre: 稳定清晰的中年女声
        pace: 从容直接
        pitch: medium-low
    matthew:
      display_name: 马修
      tts:
        delivery: 腼腆迟缓，真挚的感情藏在朴素话语里
        timbre: 温厚略显沙哑的老年男声
        pace: 缓慢，常有思量后的停顿
        pitch: low
    miss_barry:
      display_name: 巴里小姐
      tts:
        delivery: 阅历丰富，判断笃定，关怀中带着讲究
        timbre: 清晰端雅的老年女声
        pace: 从容适中
        pitch: medium
    josie:
      display_name: 乔西
      tts:
        delivery: 自负刻薄，炫耀时轻快而毫不自觉
        timbre: 尖亮的少女声
        pace: 偏快
        pitch: high
    jane:
      display_name: 简
      tts:
        delivery: 坦率务实，想到什么就直说
        timbre: 清亮朴实的少女声
        pace: 自然明快
        pitch: medium-high
    ruby:
      display_name: 露比
      tts:
        delivery: 活泼好奇，带着少女的轻柔与热心
        timbre: 甜润明亮的少女声
        pace: 自然适中
        pitch: medium-high
  chapters:
    - id: ch01
      title: 第三十四章　女王学院的姑娘
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 接下来的三个星期，绿山墙忙个不停。安妮快要去女王学院了，衣服要缝，事情要商量，要安排的行装更是一件接一件。马修替她置办得又齐全又漂亮。这一次，不管他想买什么，玛丽拉竟然一句反对的话也没有。一天傍晚，她甚至抱着一大匹淡雅的浅绿色衣料，亲自上了东山墙的房间。
        - id: ch01-b02
          speaker: marilla
          text: 安妮，这料子给你做一条轻软漂亮的裙子。你大概并不缺衣裳，好看的上衣已经不少了。不过你住在城里，晚上万一有人请你参加聚会，总得有件真正讲究的衣服。听说简、露比和乔西都有了她们所谓的晚礼服，我不能让你比她们差。上星期我请艾伦太太帮着在城里挑了这匹料子。再找埃米莉·吉利斯来做，她眼光好，衣服也裁得最合身。
        - id: ch01-b03
          speaker: anne
          text: 玛丽拉，这料子太美了，谢谢你！你真的不该对我这么好。你越是这样，我就越舍不得离开。
        - id: ch01-b04
          speaker: narrator
          text: 埃米莉使出浑身本领，在绿裙子上添满细褶、荷叶边和抽褶。一天晚上，安妮特意穿给马修和玛丽拉看，还站在厨房里为他们朗诵《少女的誓言》。玛丽拉看着那张神采飞扬的脸，看着安妮优美地抬手转身，思绪忽然回到她初来绿山墙的那个夜晚。那时，她还是个古怪又惊惶的孩子，穿着可笑的黄褐色哔叽裙，泪汪汪的眼睛里满是心碎。往事浮上来，玛丽拉眼里也有了泪光。
        - id: ch01-b05
          speaker: anne
          text: 哎呀，玛丽拉，我竟然把你朗诵哭了。这可算得上真正的胜利！
          emotion: happy
        - id: ch01-b06
          speaker: narrator
          text: 安妮快活地俯下身，在玛丽拉脸上轻轻亲了一下，像蝴蝶落过似的。玛丽拉却怎么也不肯承认，几句诗能叫自己软弱到掉眼泪。
        - id: ch01-b07
          speaker: marilla
          text: 我不是听你的诗听哭的。我只是想起你从前那个小姑娘的样子。我真希望你能一直那么小，哪怕还保留那些古怪脾气也好。可你现在长大了，又要离开。穿上这条裙子，你看起来那么高挑，那么时髦，简直像变了个人，不再属于埃文利了。我把这些一想，心里就觉得空落落的。
          emotion: sad
        - id: ch01-b08
          speaker: narrator
          text: 安妮喊了一声玛丽拉，立刻坐到她铺着格子布的膝头。她双手捧住玛丽拉布满皱纹的脸，认真又温柔地望着她。
        - id: ch01-b09
          speaker: anne
          text: 我一点也没变，真的。我只是修掉了几根旁枝，又长出了些新枝。藏在心里的那个我，还是原来的样子。无论以后去了哪里，外表变了多少，我永远都是你的安妮小姑娘。我会一辈子一天比一天更爱你，更爱马修，也更爱亲爱的绿山墙。
          emotion: calm
        - id: ch01-b10
          speaker: narrator
          text: 安妮把年轻光润的脸颊贴在玛丽拉衰老的脸上，又伸手拍了拍马修的肩膀。玛丽拉真希望自己也能像安妮一样，把心里的感情说出来。可是她一向不会。她只能紧紧搂住自己的姑娘，温柔地抱在怀里，盼着永远不必放她走。
        - id: ch01-b11
          speaker: narrator
          text: 马修眼里也泛起了可疑的湿意。他起身走出屋子，穿过星光下的院子，来到白杨树下的大门边。蓝色的夏夜很安静，他心里却翻腾不止。
        - id: ch01-b12
          speaker: matthew
          text: 嗯，她到底没让我们惯坏。我偶尔插一手，看来也没惹什么祸。她聪明，漂亮，还有情有义，这才比什么都强。她是老天赐给我们的福气。斯宾塞太太那个错误，要真是碰巧，那也是世上最幸运的碰巧。可我不信。一定是上天知道我们需要她，才把她送来的。
        - id: ch01-b13
          speaker: narrator
          text: 安妮进城的日子终于到了。九月一个晴朗的早晨，她和马修坐车出发。她流着泪告别戴安娜。玛丽拉这一边，至少表面上没有掉泪，只把该交代的事一一说清。安妮走后，戴安娜擦干眼泪，跟卡莫迪来的几个表亲去了白沙滩野餐，后来倒也玩得颇为开心。玛丽拉却凶猛地扑进一大堆根本不必做的活计里，整整一天没有停手。
        - id: ch01-b14
          speaker: narrator
          text: 她心里的痛最苦不过。那疼痛一直灼烧，一直啃噬，又没有痛快的眼泪能把它冲走。直到夜里上床时，她才清清楚楚地意识到，走廊尽头那间带山墙的小屋空了。里面再没有鲜活的年轻生命，也听不见轻柔的呼吸。玛丽拉把脸埋进枕头，为自己的姑娘放声痛哭。后来稍稍平静，她又被自己的哭法吓住了。为一个有罪的凡人哀恸成这样，在她看来，实在邪恶得很。
        - id: ch01-b15
          speaker: narrator
          text: 安妮和埃文利的其他学生进了城，刚好赶得及匆匆去学院报到。第一天在兴奋中飞快地过去。他们认识一张张新面孔，把所有教授的模样认了个大概，再按照各自选修的课程分班编组。史黛西小姐建议安妮直接修第二学年的课程，安妮也正想这样做。吉尔伯特·布莱思同样选了这条路。要是成功，他们只用一年就能考取一级教师执照，不必花两年。当然，这也意味着他们得做多得多、难得多的功课。简、露比、乔西、查理和穆迪·斯普吉恩没有这份雄心，修读二级课程就很满足了。
        - id: ch01-b16
          speaker: narrator
          text: 安妮坐在五十名学生中间，忽然觉得孤单。满屋子的人，她只认识对面那个高个子、棕头发的男孩。可照她和吉尔伯特如今的关系，认识他也没有多少用。话虽如此，能跟他分在同一班，她其实很高兴。两人从前的竞争可以继续下去了。要是没有这场竞争，安妮恐怕还真不知道该怎么办。
        - id: ch01-b17
          speaker: anne
          text: 要是没有他跟我竞争，我准会浑身不自在。吉尔伯特看起来下了好大的决心。他一定正在暗暗决定要赢得奖章。瞧他那下巴，多漂亮呀，我以前怎么从没发现？要是简和露比也来读一级课程就好了。等我认识了大家，大概就不会再像一只钻进陌生阁楼的猫了吧。
        - id: ch01-b18
          speaker: anne
          text: 不知道这些姑娘里，谁会成为我的朋友，猜一猜还挺有意思。我答应过戴安娜，不管多喜欢女王学院的哪个姑娘，也绝不会让她跟戴安娜一样亲近。不过我心里还有好多仅次一等的感情，可以分给别人。那个棕眼睛、穿深红上衣的姑娘，看起来鲜活得像一朵红玫瑰。还有窗边那个白净的金发姑娘。她头发真美，一定很懂得做梦。
        - id: ch01-b19
          speaker: anne
          text: 我想好好认识她们，熟到可以搂着腰一起散步，还能彼此叫小名。可现在我不认识她们，她们也不认识我，大概也没有特别想认识我。唉，真孤单啊！
          emotion: sad
        - id: ch01-b20
          speaker: narrator
          text: 那天黄昏，安妮独自待在寄宿舍里那间临走廊的小卧室，心里更孤单了。其他姑娘在城里都有亲戚照应，愿意把她们接到家里，安妮却不能跟任何一个人同住。约瑟芬·巴里小姐倒很想让安妮住进山毛榉庄，可那里离学院实在太远，每天往返根本行不通。于是她另找了一家寄宿舍，还向马修和玛丽拉再三保证，这地方最适合安妮。
        - id: ch01-b21
          speaker: miss_barry
          text: 经营寄宿舍的是一位家道中落的淑女。她丈夫从前当过英国军官，挑选房客十分谨慎。安妮住在她家，绝不会碰见什么不三不四的人。那里的饭菜不错，离学院也近，周围还很安静。
        - id: ch01-b22
          speaker: narrator
          text: 后来证明，这些话句句都对。可安妮第一次被思乡的痛苦抓住时，它们一点用也没有。她凄凉地打量小小的房间。墙纸暗淡，墙上没有画，只有一张小铁床和一只空书架。她想起绿山墙那间属于自己的白色小屋，喉咙顿时哽住了。在那里，只要知道屋外有一大片青翠安静的天地，她心里就会生出十分熟悉的欢喜。花园里长着香豌豆，月光落在果园里。山坡下有小溪，溪水那边的云杉枝迎着夜风摇摆。头顶是满天繁星，戴安娜窗口的灯光会从树木间远远照过来。
        - id: ch01-b23
          speaker: narrator
          text: 可在这里，那些东西全都没有。窗外只有坚硬的街道。密密的电话线遮住天空，陌生人的脚步来来去去，无数盏灯照着无数张陌生的脸。安妮知道自己快要哭了，拼命想忍住。
        - id: ch01-b24
          speaker: anne
          text: 我才不哭。哭又傻，又软弱。可第三滴眼泪已经落到鼻子旁边了，后面还有呢！我得想件好笑的事，让它们停下来。偏偏所有好笑的事都跟埃文利有关，一想只会更难过。第四滴，第五滴。下星期五我就回家，可那一天简直还要等上一百年。
          emotion: sad
        - id: ch01-b25
          speaker: anne
          text: 马修这会儿快到家了。玛丽拉一定站在大门口，顺着小路等他回来。第六滴，第七滴，第八滴。唉，数也没用了，眼泪马上就要全涌出来。我高兴不起来，也根本不想高兴。还是伤心更痛快！
          emotion: sad
        - id: ch01-b26
          speaker: narrator
          text: 要不是乔西·派伊正在这时走进来，安妮准会大哭一场。她看见一张熟悉的面孔，高兴得忘了自己和乔西向来并不亲近。此刻，只要来自埃文利，哪怕是派伊家的人，也一样叫她欢迎。
        - id: ch01-b27
          speaker: anne
          text: 你能上来看我，我真高兴。
        - id: ch01-b28
          speaker: josie
          text: 你刚才哭过吧？我猜你是想家了。有些人碰到这种事，就是一点自制力也没有。我可不打算想家。从那个死气沉沉的老埃文利来到城里，这里快活多了。我真不知道自己怎么在那里熬了那么久。安妮，你可不该哭。鼻子和眼睛一红，你看起来就从头到脚全是红的，多难看呀。
        - id: ch01-b29
          speaker: josie
          text: 我今天在学院里过得痛快极了。我们的法语教授简直可爱得不得了，那两撇胡子能叫你的心怦怦乱跳。你这里有吃的吗？我快饿死了。哈，我早猜到玛丽拉会给你塞一大堆蛋糕，所以才过来。不然我就跟弗兰克·斯托克利去公园听乐队了。他和我住在同一家寄宿舍，人可时髦了。
        - id: ch01-b30
          speaker: josie
          text: 他今天在班里注意到了你，还问那个红头发姑娘是谁。我告诉他，你是卡斯伯特家收养的孤儿。至于你被收养以前是什么来历，谁也不大清楚。
        - id: ch01-b31
          speaker: narrator
          text: 安妮听着听着，不禁怀疑，也许独自待着流眼泪，反倒比乔西陪在身边更好受。幸好简和露比随即来了。她们的外套上各别着一英寸长的女王学院校色丝带，一条紫色，一条猩红色，两个人都骄傲得很。乔西眼下正和简绝交，只好暂时闭嘴，也就没有那么讨厌了。
        - id: ch01-b32
          speaker: jane
          text: 唉，从早晨到现在，我觉得自己简直活过了好多个月亮。我本该在家读维吉尔。那个讨厌的老教授留了二十行，明天就要开始学。可我今晚怎么也静不下心。安妮，依我看，你脸上好像还有泪痕。要是哭过，你可一定要承认。露比来以前，我也痛痛快快地哭了一场。只要还有别人也犯傻，我就不那么介意自己是个傻瓜了。
        - id: ch01-b33
          speaker: jane
          text: 这是蛋糕吗？给我一小小块，好不好？谢谢。吃起来真是地道的埃文利味道。
        - id: ch01-b34
          speaker: narrator
          text: 露比看见桌上放着女王学院的课程手册，便想起了一个问题。
        - id: ch01-b35
          speaker: ruby
          text: 安妮，你是不是想争取金质奖章？
        - id: ch01-b36
          speaker: anne
          text: 我的确在考虑。
        - id: ch01-b37
          speaker: josie
          text: 这倒提醒我了。女王学院到底还是会分到一个艾弗里奖学金，消息今天刚到。弗兰克·斯托克利告诉我的。他叔叔是学院理事会成员，你们都知道。明天学院就会正式宣布。
        - id: ch01-b38
          speaker: narrator
          text: 艾弗里奖学金！安妮的心跳快了起来。她的雄心像中了魔法，忽然伸向更远的地方。听到消息以前，她最高的目标不过是在年底拿到省颁一级教师执照，或许再赢得奖章。可乔西的话音还没消散，她已经看见自己赢得奖学金，进入雷德蒙德学院攻读文科，最后穿着学位袍，戴着方帽毕业。奖学金比试的正是英语。安妮觉得，自己总算踏进了最熟悉、最擅长的天地。
        - id: ch01-b39
          speaker: narrator
          text: 原来，新不伦瑞克一位富有的制造商去世后，留下部分财产，专门设立了许多奖学金。这些名额会按照各校成绩，分给海洋诸省的中学和学院。女王学院能不能分到一个，原本一直没有定论，如今总算确定了。年底时，英语和英国文学总成绩最高的毕业生会得到这项奖学金。进入雷德蒙德学院以后，四年里每年都有二百五十元。难怪安妮那天上床时，两颊还兴奋得直发烫。
        - id: ch01-b40
          speaker: anne
          text: 只要努力能办到，我一定要赢得那份奖学金。要是我成了文学士，马修该多么骄傲啊！有志向真是太美妙了，我很高兴自己有这么多志向。而且它们永远没有尽头，这才是最好的地方。每当你实现一个，就会看见另一个在更高处闪闪发光。这样一来，人生多有意思呀！
          emotion: happy
