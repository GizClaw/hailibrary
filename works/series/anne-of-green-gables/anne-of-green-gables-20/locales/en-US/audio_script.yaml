audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm, observant, and gently amused
        timbre: clear and rounded
        pace: measured
        pitch: medium
    anne_shirley:
      display_name: Anne Shirley
      tts:
        delivery: vivid, earnest, and eagerly imaginative
        timbre: clear and youthful
        pace: lively
        pitch: medium-high
    marilla_cuthbert:
      display_name: Marilla Cuthbert
      tts:
        delivery: firm, practical, and restrained
        timbre: clear and mature
        pace: steady
        pitch: medium-low
  chapters:
    - id: ch01
      title: Mayflowers and Violets
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: "Spring came back to Green Gables at last. It was the beautiful, changeable Canadian spring, slow to arrive and never quite willing to stay. Through April and May, one sweet, fresh, chilly day followed another. Sunsets glowed pink, and everywhere the earth seemed to wake and grow again. Red buds covered the maples in Lover's Lane. Little curled ferns rose around the Dryad's Bubble. Far up in the barrens behind Mr. Silas Sloane's place, Mayflowers opened beneath their brown leaves like tiny pink and white stars. One golden afternoon, all the schoolchildren went to gather them. They came home through the clear, echoing twilight with flowers overflowing from their arms and baskets."
        - id: ch01-b02
          speaker: anne_shirley
          text: "I feel so sorry for people who live where there aren't any Mayflowers. Diana says they may have something even better, but what could possibly be better than Mayflowers, Marilla? She says people can't miss them if they've never known them. That's the saddest part, though. Imagine never knowing Mayflowers and not even missing them. It would be tragic. Do you know what I think they are? I think they're the souls of all the flowers that died last summer, and this is their heaven."
        - id: ch01-b03
          speaker: anne_shirley
          text: "We had a splendid time today. We ate our lunch in a big mossy hollow beside an old well. It was such a romantic place. Charlie Sloane dared Arty Gillis to jump over the well, and of course Arty did it. He would never refuse a dare. None of us would. Daring people is very fashionable at school now."
        - id: ch01-b04
          speaker: anne_shirley
          text: "Mr. Phillips gave every Mayflower he found to Prissy Andrews. I heard him tell her, 'Sweets to the sweet.' He found that in a book, I'm sure, but at least it proves he has some imagination. Someone offered me Mayflowers too, and I refused them with scorn. I can't say who it was. I've promised that person's name will never cross my lips."
        - id: ch01-b05
          speaker: anne_shirley
          text: "We made Mayflower wreaths and wore them on our hats. Then, when it was time to go home, we marched down the road two by two. We carried our bouquets, wore our wreaths, and sang 'My Home on the Hill.' Oh, Marilla, it was thrilling! Everyone at Mr. Silas Sloane's house ran out to look, and every person we passed stopped and stared after us. We caused a real sensation."
          emotion: happy
        - id: ch01-b06
          speaker: marilla_cuthbert
          text: "I'm not surprised. What a lot of silly carrying-on."
        - id: ch01-b07
          speaker: narrator
          text: "The Mayflowers faded, and then the violets came. They filled Violet Vale with purple. Each morning on her way to school, Anne walked among them slowly, with shining eyes, as though the valley were holy ground."
        - id: ch01-b08
          speaker: anne_shirley
          text: "When I walk through here, Diana, I truly don't care whether Gil... whether anyone beats me in class. But the moment I'm back at school, I care just as much as I ever did. There are so many different Annes inside me. Maybe that's why I'm always getting into trouble. Life would be much easier if there were only one Anne, but it wouldn't be nearly as interesting."
    - id: ch02
      title: One Year at Green Gables
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: "One evening in June, the orchards were pink with blossoms again. Frogs sang sweet, silvery songs in the marshes at the head of the Lake of Shining Waters. The air smelled of clover fields and fir woods. Anne sat beside her gable window. She had been studying, but the light had faded until she could no longer see her book. Now she gazed past the branches of the Snow Queen, white with blossoms once more, and drifted into a waking dream."
        - id: ch02-b02
          speaker: narrator
          text: "Almost nothing in the little room had changed. Its walls were still white. The pincushion was still hard. The stiff yellow chairs stood as straight as ever. And yet the room itself felt completely different. Anne's bright, living spirit seemed to fill it. That spirit lived in more than her schoolbooks, dresses, and ribbons, or even the cracked blue pitcher of apple blossoms on the table. All her waking and sleeping dreams seemed to have become visible. They covered the bare room with thin, splendid curtains of rainbow and moonlight."
        - id: ch02-b03
          speaker: narrator
          text: "Marilla came briskly in, carrying Anne's freshly ironed school aprons. She laid them over a chair, sat down, and gave a short sigh. A headache had troubled her all afternoon. The pain was gone now, but she still felt weak and worn out. Anne looked at her with clear, sympathetic eyes."
        - id: ch02-b04
          speaker: anne_shirley
          text: "Oh, Marilla, I truly wish I could have had your headache for you. I would have borne it gladly if it spared you."
        - id: ch02-b05
          speaker: marilla_cuthbert
          text: "You did your share by handling the work and letting me rest. You managed fairly well, too, with fewer mistakes than usual. Of course, Matthew's handkerchiefs didn't need starch. And when most people put a pie in the oven to warm for dinner, they take it out once it's hot and eat it. They don't leave it there until it's burned to a crisp. Apparently, you have your own way of doing things."
        - id: ch02-b06
          speaker: narrator
          text: "A headache always left Marilla in a sharp and sarcastic mood."
        - id: ch02-b07
          speaker: anne_shirley
          text: "Oh, I'm so sorry. I never thought of the pie again after I put it in the oven, though I had a feeling something was missing from the dinner table. This morning, when you left me in charge, I promised myself I wouldn't imagine a single thing. I meant to keep my mind on plain facts. And I did very well until the pie went into the oven."
          emotion: sad
        - id: ch02-b08
          speaker: anne_shirley
          text: "Then I couldn't resist imagining that I was an enchanted princess locked in a lonely tower, while a handsome knight rode to rescue me on a coal-black horse. That's why I forgot the pie. I didn't realize I'd starched the handkerchiefs either. While I ironed, I was trying to name a new island Diana and I found up the brook."
        - id: ch02-b09
          speaker: anne_shirley
          text: "It is the loveliest place, Marilla. Two maple trees grow there, and the brook runs all around it. Finally I thought of the perfect name: Victoria Island. We discovered it on the Queen's birthday, and Diana and I are both very loyal. But I really am sorry about the pie and the handkerchiefs. I wanted to be especially good today, because today is an anniversary. Do you remember what happened a year ago?"
        - id: ch02-b10
          speaker: marilla_cuthbert
          text: "No. I can't think of anything special."
        - id: ch02-b11
          speaker: anne_shirley
          text: "Marilla, this is the day I came to Green Gables. I could never forget it. That day changed my whole life, though I suppose it wouldn't feel as important to you. I've lived here for a year now, and I've been so happy. I've had troubles, of course, but people can get past their troubles. Marilla, do you wish you hadn't kept me?"
        - id: ch02-b12
          speaker: narrator
          text: "Marilla sometimes wondered how she had ever lived at Green Gables before Anne came."
        - id: ch02-b13
          speaker: marilla_cuthbert
          text: "No, I can't say that I'm sorry. Not exactly sorry. If your lessons are finished, run over to the Barrys' and ask Mrs. Barry to lend me Diana's apron pattern."
    - id: ch03
      title: Through the Haunted Wood
      blocks:
        - id: ch03-b01
          speaker: anne_shirley
          text: "Oh... but it's too dark."
          emotion: fearful
        - id: ch03-b02
          speaker: marilla_cuthbert
          text: "Too dark? It's only twilight. You've gone over there after dark often enough before."
        - id: ch03-b03
          speaker: anne_shirley
          text: "I'll go first thing tomorrow morning. I'll get up at sunrise and go then, Marilla."
        - id: ch03-b04
          speaker: marilla_cuthbert
          text: "Anne Shirley, what idea have you put into your head this time? I need the pattern tonight so I can cut out your new apron. Go now, and be quick about it."
        - id: ch03-b05
          speaker: anne_shirley
          text: "Then I'll have to take the road."
        - id: ch03-b06
          speaker: narrator
          text: "Anne picked up her hat, but she did it very slowly."
        - id: ch03-b07
          speaker: marilla_cuthbert
          text: "Take the road and waste half an hour? You'll do no such thing."
        - id: ch03-b08
          speaker: anne_shirley
          text: "I can't go through the Haunted Wood, Marilla!"
          emotion: fearful
        - id: ch03-b09
          speaker: narrator
          text: "Marilla stared at her."
        - id: ch03-b10
          speaker: marilla_cuthbert
          text: "The Haunted Wood? Have you lost your senses? What in the world is the Haunted Wood?"
          emotion: surprised
        - id: ch03-b11
          speaker: anne_shirley
          text: "The spruce woods across the brook."
          emotion: fearful
        - id: ch03-b12
          speaker: marilla_cuthbert
          text: "Nonsense. There is no haunted wood anywhere. Who has been filling your head with that foolishness?"
        - id: ch03-b13
          speaker: anne_shirley
          text: "Nobody told us. Diana and I imagined it ourselves. Everything around here seemed so ordinary, and we wanted something more exciting. We started in April. A haunted wood is terribly romantic, and we chose the spruce grove because it's so dark and gloomy. We've imagined the most dreadful things there."
        - id: ch03-b14
          speaker: anne_shirley
          text: "A white lady walks beside the brook at about this time every night. She twists her hands and cries and moans. Whenever someone in the family is going to die, she appears. Then there's the ghost of a little murdered child near the corner by Idlewild. It creeps up behind you and puts cold fingers on your hand, just like this. Oh, even thinking about it makes me shiver."
          emotion: fearful
        - id: ch03-b15
          speaker: anne_shirley
          text: "A man without a head stalks back and forth along the path, too. Skeletons glare through the branches. Marilla, nothing could make me walk through the Haunted Wood after dark now. I know white shapes would reach from behind the trees and seize me."
          emotion: fearful
        - id: ch03-b16
          speaker: narrator
          text: "Marilla had listened in speechless amazement. At last she found her voice."
        - id: ch03-b17
          speaker: marilla_cuthbert
          text: "I never heard anything like it! Anne Shirley, are you telling me you actually believe all this wicked nonsense you invented yourself?"
          emotion: surprised
        - id: ch03-b18
          speaker: anne_shirley
          text: "I don't exactly believe it. I mean, I don't believe it during the day. But after dark, everything is different. Night is when ghosts come out."
          emotion: fearful
        - id: ch03-b19
          speaker: marilla_cuthbert
          text: "Ghosts do not exist, Anne."
        - id: ch03-b20
          speaker: anne_shirley
          text: "But they must, Marilla. I know respectable people who have seen them. Charlie Sloane says his grandmother saw his grandfather bringing the cows home one night, even though he'd been buried for a whole year. Charlie's grandmother would never make up a story. She's a very religious woman."
        - id: ch03-b21
          speaker: anne_shirley
          text: "And one night, Mrs. Thomas's father was chased all the way home by a lamb made of fire. Its head was cut off and hanging by one strip of skin. He knew it was his brother's spirit, warning him that he would die in nine days. Well, he didn't die then, but he did die two years later. So you see, the warning really did come true. And Ruby Gillis says..."
        - id: ch03-b22
          speaker: marilla_cuthbert
          text: "Anne Shirley, that's enough. I never want to hear you talk this way again. I've always wondered where that imagination of yours might lead, and now I see. I will not allow this sort of thing. You are going straight to the Barrys', through the spruce grove. Perhaps that will teach you a lesson. And I don't want to hear one more word about haunted woods from that head of yours."
        - id: ch03-b23
          speaker: narrator
          text: "Anne pleaded and cried, and she meant every word. Her imagination had escaped her control. After nightfall, she was truly terrified of the spruce grove. But Marilla would not change her mind. She marched the shrinking young ghost-seer down to the spring. Then she ordered Anne across the bridge and into the shadowy home of all those wailing ladies and headless spirits."
        - id: ch03-b24
          speaker: anne_shirley
          text: "Oh, Marilla, how can you be so cruel? What would you do if some white creature grabbed me and carried me away?"
          emotion: fearful
        - id: ch03-b25
          speaker: marilla_cuthbert
          text: "I'll take that chance. You know I mean what I say. This will cure you of putting ghosts where they don't belong. Now march."
        - id: ch03-b26
          speaker: narrator
          text: "So Anne marched. Or rather, she stumbled across the bridge and crept up the awful, dim path beyond it, shivering all the way. She never forgot that walk. Now she bitterly regretted letting her imagination run so freely. Every shadow seemed to hide one of the goblins she had invented. In her mind, they reached out cold, fleshless hands for the frightened little girl who had imagined them into life."
        - id: ch03-b27
          speaker: narrator
          text: "A loose strip of white birch bark blew out of a hollow and skittered over the brown ground. Anne's heart seemed to stop. Two old branches rubbed together with a long, low wail, and beads of sweat broke out on her forehead. Bats swooped above her in the darkness like the wings of creatures from some other world."
        - id: ch03-b28
          speaker: narrator
          text: "At last Anne reached Mr. William Bell's field. She raced across it as though a whole army of white shapes were chasing her. By the time she reached the Barrys' kitchen door, she was so breathless she could barely ask for the apron pattern. Diana was away, so Anne had no reason to stay. She would have to face the terrible journey back at once."
        - id: ch03-b29
          speaker: narrator
          text: "Anne returned through the woods with her eyes tightly shut. She would rather crash headfirst into a branch than see one of those white shapes. Finally, she stumbled over the log bridge and reached the other side. One long, trembling breath of relief escaped her."
        - id: ch03-b30
          speaker: marilla_cuthbert
          text: "Well? Nothing caught you, I see."
        - id: ch03-b31
          speaker: anne_shirley
          text: "Oh, Mar... Marilla, from now on I'll be c-c-content with ordinary places."
          emotion: fearful
