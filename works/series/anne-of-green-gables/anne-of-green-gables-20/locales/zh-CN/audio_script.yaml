audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖机智，叙事细腻而自然
        timbre: 清澈柔和的成年女声
        pace: 从容，随情节轻快变化
        pitch: 中音
    anne:
      display_name: 安妮
      tts:
        delivery: 想象丰富，热烈真挚，情绪来得快而鲜明
        timbre: 清亮灵动的少女声
        pace: 偏快，动情时一气呵成
        pitch: 中高音
    diana:
      display_name: 戴安娜
      tts:
        delivery: 诚恳温柔，朴实中带着少女的羞怯
        timbre: 柔润甜美的少女声
        pace: 适中
        pitch: 中高音
    marilla:
      display_name: 玛丽拉
      tts:
        delivery: 务实克制，话语干脆，偶尔透出藏起的温情
        timbre: 稳重略低的成年女声
        pace: 稍慢而利落
        pitch: 中低音
  chapters:
    - id: ch01
      title: 第二十章　想象力误入歧途
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 春天又回到了绿山墙。加拿大的春天美丽又任性，总是来得很迟，还要在四月和五月里慢慢流连。那些日子清甜、明净，带着一点寒意。粉红的晚霞天天落下，草木也一天天上演复苏和生长的奇迹。情人小径的枫树冒了红芽，树精之泉旁钻出一株株卷叶的小蕨。远在塞拉斯·斯隆家后面的荒地上，五月花藏在褐叶底下，像一颗颗粉白而芬芳的星星。一个金灿灿的下午，全校男孩女孩都去采花。直到清澈的暮色降临，四野响起回声，他们才抱着满怀的花，提着满篮的花，带着这份美丽的战利品回家。
        - id: ch01-b02
          speaker: anne
          text: 那些地方要是没有五月花，住在那里的人真可怜。戴安娜说，他们也许有更好的花。可哪里会有比五月花更好的东西呢，玛丽拉？她还说，人家没见过五月花，自然不会想念。可这才是最叫人伤心的呀！不知道五月花是什么模样，偏偏连想念它都不会，那简直是一场悲剧。玛丽拉，我觉得这些花一定是去年夏天死去的花儿的灵魂，这片荒地就是它们的天堂。
        - id: ch01-b03
          speaker: anne
          text: 我们今天玩得痛快极了。午饭是在一口老井边吃的，那里有个铺满苔藓的大洼地，别提多浪漫了。查理·斯隆激阿蒂·吉利斯跳过那口井，阿蒂果然跳了，因为他绝不肯认输。学校里谁也不肯，眼下用激将法可时兴了。菲利普斯先生把自己采到的五月花全送给普里西·安德鲁斯，还说“甜花赠甜人”。那句话一定是从书里学来的，不过总算证明他有一点想象力。
        - id: ch01-b04
          speaker: anne
          text: 也有人送我五月花，我却轻蔑地拒绝了。我发过誓，绝不让那个人的名字从嘴里溜出来，所以不能告诉你。后来我们编了花环，戴在帽子上。回家时，大家两人一排，手里捧着花束，头上戴着花环，一路唱《我在山上的家》。那感觉真叫人激动。塞拉斯·斯隆全家都跑出来看。路上遇见的人也停下脚步，盯着我们的背影瞧。我们可真轰动了一番！
        - id: ch01-b05
          speaker: marilla
          text: 净做些傻事，难怪人家都盯着看！
        - id: ch01-b06
          speaker: narrator
          text: 五月花谢了，紫罗兰接着铺满山谷，把那里染成一片紫色。安妮每天上学走过紫罗兰谷，脚步放得轻而庄重，眼神也满是敬意，就像正走在圣地上。
        - id: ch01-b07
          speaker: anne
          text: 戴安娜，我走在这里的时候，根本不在乎吉——不在乎班上有谁超过我。可一回到学校，一切马上又不同了，我还是像以前一样在乎。我身体里一定住着好多好多不同的安妮，所以才这么会惹麻烦。要是我身体里只有一个安妮，日子会舒服得多，可也不会有现在一半有趣。
        - id: ch01-b08
          speaker: narrator
          text: 到了六月，一个傍晚，果园又开满粉红的花。闪光湖尽头的沼泽里，青蛙唱得像银铃一样甜。苜蓿田和香脂冷杉林的气味，也一起飘进空气。安妮坐在山墙房间的窗边。她刚才还在温习功课，可天色一点点暗下来，书上的字已经看不清了。于是她越过白雪皇后缀满花朵的枝条，睁大眼睛望着远处，出了神。
        - id: ch01-b09
          speaker: narrator
          text: 那间小屋实实在在的样子还是从前那样。墙照旧雪白，针垫照旧硬邦邦，几把黄椅子照旧僵直地站着。可屋子的气质全变了。这里有了一种鲜活、跃动的新性情，仿佛弥漫在每一个角落。它并不依附于女学生的书本、衣裙和丝带，也不依附于桌上那只插满苹果花的裂纹蓝水罐。安妮醒着和睡着时做过的所有梦，仿佛都化成了看得见却摸不着的彩虹和月光，给光秃秃的屋子披上一层绚丽的薄纱。
        - id: ch01-b10
          speaker: narrator
          text: 过了一会儿，玛丽拉拿着安妮刚熨好的几条上学围裙，快步走了进来。她把围裙搭在椅背上，短短叹了口气，坐下歇息。下午她又犯了头痛。疼痛虽然已经退去，人却还是虚软乏力。用她自己的话说，就是累垮了。安妮看着她，清澈的眼睛里都是怜惜。
        - id: ch01-b11
          speaker: anne
          text: 玛丽拉，我真想替你头痛。只要能替你受这份罪，我一定高高兴兴地忍着。
        - id: ch01-b12
          speaker: marilla
          text: 你替我做活，让我休息，也算尽了心。今天干得还过得去，错也比平常少。虽说马修的手帕根本用不着上浆。还有，别人把馅饼放进烤箱热一热，等它热了，就会拿出来当晚饭吃。不会一直留在里面，烤成一块焦炭。看起来，你偏有自己的做法。
        - id: ch01-b13
          speaker: narrator
          text: 玛丽拉每回头痛过后，说话总会多几分挖苦。
        - id: ch01-b14
          speaker: anne
          text: 真对不起！馅饼放进去以后，我一直到现在才想起来。可吃饭的时候，我凭直觉就觉得桌上少了什么。早上你把家里的事交给我，我明明下定决心，绝不展开想象，只把心思放在实实在在的事情上。开始我做得很好。可馅饼一进烤箱，就有一股抵挡不住的诱惑抓住了我。我忍不住去想，自己是一位中了魔法的公主，被关在孤零零的高塔上。有个英俊骑士骑着乌黑的骏马，正飞奔着赶来救我。馅饼就是这么忘掉的。
        - id: ch01-b15
          speaker: anne
          text: 我也不知道自己给手帕上了浆。熨衣服时，我满脑子都在替一座新岛取名字。戴安娜和我在上游发现了它。岛上有两棵枫树，溪水从四面围着它，迷人极了。后来我突然想到，我们是在女王生日那天发现它的，叫维多利亚岛再合适不过。戴安娜和我都是非常忠诚的臣民。不过馅饼和手帕的事，我真的很抱歉。我今天特别想做个好孩子，因为今天是个周年纪念日。你记得去年的今天发生过什么吗？
        - id: ch01-b16
          speaker: marilla
          text: 不记得。那天有什么特别的事吗？
        - id: ch01-b17
          speaker: anne
          text: 去年的今天，我来到了绿山墙。我永远不会忘，那是我一生的转折点。当然，对你来说，它也许没有这么重要。我已经在这里住了整整一年，而且一直过得非常幸福。当然，我也有过自己的烦恼，不过人总能把烦恼熬过去。玛丽拉，你后悔当初把我留下来吗？
        - id: ch01-b18
          speaker: narrator
          text: 玛丽拉有时也会暗暗纳闷，安妮来到绿山墙以前，自己到底是怎么过日子的。
        - id: ch01-b19
          speaker: marilla
          text: 不，我不能说后悔。也不算后悔。你要是做完功课，就去一趟巴里家，问巴里太太肯不肯把戴安娜的围裙样子借给我。
        - id: ch01-b20
          speaker: anne
          text: 可是——可是天太黑了！
          emotion: fearful
        - id: ch01-b21
          speaker: marilla
          text: 太黑？现在不过是黄昏。比这更黑的时候，你也不知去过多少回了。
        - id: ch01-b22
          speaker: anne
          text: 我明天一早去。太阳一出来，我就起床过去。
        - id: ch01-b23
          speaker: marilla
          text: 安妮·雪莉，你脑袋里又装了什么？我今晚就要照那个样子裁新围裙。现在就去，动作快点。
        - id: ch01-b24
          speaker: anne
          text: 那我只好绕大路走了。
        - id: ch01-b25
          speaker: marilla
          text: 绕大路要白白浪费半个钟头，我可不答应。你就从近路过去。
        - id: ch01-b26
          speaker: anne
          text: 我不能穿过闹鬼林，玛丽拉！
          emotion: fearful
        - id: ch01-b27
          speaker: narrator
          text: 玛丽拉愣住了，只管瞪着安妮，一时说不出话来。
        - id: ch01-b28
          speaker: marilla
          text: 闹鬼林？你疯了吗？天底下哪个地方叫这个名字？
        - id: ch01-b29
          speaker: anne
          text: 就是溪水那边的云杉林。
        - id: ch01-b30
          speaker: marilla
          text: 胡说八道！无论什么地方，都不可能有闹鬼的树林。是谁拿这种话来哄你的？
        - id: ch01-b31
          speaker: anne
          text: 没有人。是戴安娜和我想象出来的。这里每个地方都太平常了，我们就编了这个故事取乐。四月份开始的。闹鬼的树林多浪漫呀！我们挑那片云杉林，就是因为里面阴森森的。我们还想出了好多吓人的东西。每天晚上差不多这个时候，有个白衣女人会沿着溪边走。她绞着双手，不停哀号。只要谁家里快有人去世，她就会出现。
        - id: ch01-b32
          speaker: anne
          text: 悠闲谷那边的角落，还有一个被杀害的小孩的鬼魂。他会从背后悄悄爬过来，把冰冷的手指搭在你手上。只要想一想，我就会发抖。小路上还有一个无头男人来回走动，树枝间还藏着骷髅，狠狠盯着人。现在天黑以后，无论如何我都不肯走进闹鬼林。我敢肯定，会有白色的东西从树后伸出来，一把抓住我。
          emotion: fearful
        - id: ch01-b33
          speaker: marilla
          text: 这种话真是闻所未闻！安妮·雪莉，难道你真的相信自己编出的那些邪门东西？
          emotion: surprised
        - id: ch01-b34
          speaker: anne
          text: 也不能说我真的相信。至少白天的时候，我是不信的。可是天一黑就完全不同了，玛丽拉。鬼都是那个时候才出来走动的。
          emotion: fearful
        - id: ch01-b35
          speaker: marilla
          text: 世上压根儿没有鬼这种东西，安妮。
        - id: ch01-b36
          speaker: anne
          text: 可是真的有！我认识亲眼见过鬼的人，他们都是品行端正的人。查理·斯隆说，他祖父下葬整整一年以后，他祖母有天晚上还看见祖父赶着牛群回家。查理的祖母绝不会编瞎话，她是个很虔诚的人。
        - id: ch01-b37
          speaker: anne
          text: 托马斯太太的父亲也遇到过。他有一晚被一只浑身冒火的羔羊追到家。那只羊的脑袋已经掉了，只剩一条皮连着。他说那一定是他兄弟的魂灵，是来警告他九天之内就要死。他当时没死，可两年以后死了。所以那件事果然是真的。还有鲁比·吉利斯说——
        - id: ch01-b38
          speaker: marilla
          text: 安妮·雪莉，以后不许再让我听见你这样讲话。我早就怀疑，你那副想象力未必是什么好东西。要是最后只闹成这样，我绝不会让你继续下去。现在就去巴里家，而且必须穿过云杉林。让这件事给你好好上一课。以后也不许再编什么闹鬼林。
          emotion: angry
        - id: ch01-b39
          speaker: narrator
          text: 安妮尽管又哭又求，玛丽拉还是不肯改变主意。安妮是真的害怕。那副想象力已经挣脱管束，太阳落山以后，她一想到云杉林，就怕得要命。可玛丽拉铁了心。她把这个畏畏缩缩的见鬼人一直押到泉边，命令她立刻从桥上过去，径直走进前面那片幽暗的林子，去面对她自己编出来的哀号白衣女人和无头幽灵。
        - id: ch01-b40
          speaker: anne
          text: 玛丽拉，你怎么能这么狠心？要是真有个白东西把我抓走了，你心里会怎么想？
          emotion: fearful
        - id: ch01-b41
          speaker: marilla
          text: 这个险我敢冒。你知道，我说出口的话从来算数。我非治好你这到处想出鬼怪的毛病不可。走吧。
        - id: ch01-b42
          speaker: narrator
          text: 安妮只好走了。更确切地说，她跌跌撞撞地过了桥，又浑身发颤地踏上前面那条阴森可怕的小路。那一程，她一辈子也没有忘记。她曾经任由想象力四处驰骋，现在悔得苦不堪言。那些亲手想出的妖魔就躲在四周的每一片阴影里，伸出冰冷而没有血肉的手，想要抓住这个把它们召到世上、如今又吓得魂不附体的小姑娘。
        - id: ch01-b43
          speaker: narrator
          text: 一条白桦树皮被风从洼地里卷起来，在树林褐色的地面上飘过，吓得她的心差点停跳。两根老树枝互相摩擦，拖出一声长长的哀号，安妮额头上立刻冒出一颗颗汗珠。蝙蝠从她头顶的黑暗里俯冲而过，那一双双翅膀，就像来自另一个世界的怪物。
        - id: ch01-b44
          speaker: narrator
          text: 到了威廉·贝尔先生的田地，安妮飞奔着穿了过去，好像身后正有一支白色怪物的大军追赶。她冲到巴里家的厨房门口，已经喘得上气不接下气，连借围裙样子的话都几乎说不出来。偏偏戴安娜不在，她连多待一会儿的借口都没有。那条可怕的路，她只能硬着头皮再走一次。
        - id: ch01-b45
          speaker: narrator
          text: 可怕的归途就在眼前，安妮只好再次上路。这一回，她干脆闭紧眼睛往前冲。哪怕撞上树枝，把脑袋撞破，也比睁眼看见什么白色的东西强。最后，她终于跌跌撞撞地过了圆木桥，这才长长吸进一口气。身子还在发抖，心总算放下了。
        - id: ch01-b46
          speaker: marilla
          text: 怎么样？一路回来，没有什么东西从林子里伸出手，把你抓走吧？
        - id: ch01-b47
          speaker: anne
          text: 玛——玛丽拉，往——往后，我只要平——平平常常的地方，就心——心满意足了。
          emotion: fearful
