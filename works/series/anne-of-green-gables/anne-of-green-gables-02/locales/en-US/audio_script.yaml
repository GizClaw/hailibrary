audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm, observant, and gently amused
        timbre: clear and rounded
        pace: measured
        pitch: medium
    matthew_cuthbert:
      display_name: Matthew Cuthbert
      tts:
        delivery: shy, hesitant, and quietly kind
        timbre: soft and weathered
        pace: unhurried
        pitch: low
    anne_shirley:
      display_name: Anne Shirley
      tts:
        delivery: vivid, earnest, and eagerly imaginative
        timbre: clear and youthful
        pace: lively
        pitch: medium-high
    stationmaster:
      display_name: Stationmaster
      tts:
        delivery: brisk, practical, and casually amused
        timbre: crisp and sturdy
        pace: quick
        pitch: medium
  chapters:
    - id: ch01
      title: The Road to Bright River
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            Matthew Cuthbert and the sorrel mare jogged comfortably along the eight-mile road to Bright River. It was a lovely drive between snug farms, with a patch of fragrant fir woods here and a hollow full of blooming wild plum there. Apple orchards sweetened the air. The meadows rolled away toward a horizon softened by pearl and purple mist, and the little birds sang as if this were the one summer day in the whole year.
        - id: ch01-b02
          speaker: narrator
          text: >-
            Matthew enjoyed the ride in his own quiet way. The only uncomfortable moments came when he passed women and had to nod. On Prince Edward Island, you were expected to greet everyone you met on the road, whether you knew them or not.
        - id: ch01-b03
          speaker: narrator
          text: >-
            Other than Marilla and Mrs. Rachel, women frightened Matthew. To him, they were mysterious creatures, and he always suspected they were secretly laughing at him. Perhaps some of them were. He did look unusual. He had a clumsy, stooping figure, long iron-gray hair that touched his shoulders, and a full soft brown beard he had worn since he was twenty. In fact, he had looked much the same at twenty as he did at sixty, only with less gray.
        - id: ch01-b04
          speaker: narrator
          text: >-
            When he reached Bright River, there was no train in sight. Thinking he was early, Matthew tied the mare in the yard of the little hotel and crossed to the station house. The long platform was almost empty. The only living creature he could see was a girl sitting on a pile of shingles at the far end. Matthew barely noticed that she was a girl before edging past as quickly as he could without looking at her.
        - id: ch01-b05
          speaker: narrator
          text: >-
            If he had looked, he would have seen how tightly she held herself and how eagerly she watched. She was waiting for someone, and since waiting was all she could do, she was doing it with every bit of herself.
        - id: ch01-b06
          speaker: narrator
          text: >-
            The stationmaster was locking the ticket office before going home to supper. Matthew asked whether the five-thirty train would arrive soon.
        - id: ch01-b07
          speaker: stationmaster
          text: >-
            The five-thirty came and went half an hour ago. It did leave a passenger for you, though. A little girl. She's sitting out there on the shingles. I asked her to wait in the ladies' room, but she said she'd rather stay outside because there was more room for imagination. She's quite a character.
        - id: ch01-b08
          speaker: matthew_cuthbert
          text: >-
            But I wasn't expecting a girl. I came for a boy. Mrs. Alexander Spencer was supposed to bring him from Nova Scotia.
          emotion: surprised
        - id: ch01-b09
          speaker: narrator
          text: The stationmaster whistled.
        - id: ch01-b10
          speaker: stationmaster
          text: >-
            Then somebody made a mistake. Mrs. Spencer got off with that girl and left her with me. She said you and your sister were adopting her from an orphan asylum and that you'd come along for her. That's everything I know. I certainly don't have any other orphans hidden around the station.
        - id: ch01-b11
          speaker: matthew_cuthbert
          text: I don't understand.
        - id: ch01-b12
          speaker: narrator
          text: >-
            Matthew wished Marilla were there to handle it.
        - id: ch01-b13
          speaker: stationmaster
          text: >-
            You'd better ask the girl. She can probably explain, and she certainly knows how to talk. Maybe they ran out of the kind of boys you ordered.
        - id: ch01-b14
          speaker: narrator
          text: >-
            Hungry for his supper, the stationmaster walked jauntily away. Poor Matthew was left with something harder than facing a lion in its den. He had to walk up to a strange girl, an orphan girl, and ask why she wasn't a boy. Groaning inside, he turned and shuffled down the platform toward her.
    - id: ch02
      title: The Girl on the Platform
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            The girl had watched Matthew ever since he passed her. Now she kept her eyes fixed on him. He still refused to look at her, but anyone else would have seen a thin child of about eleven in a short, tight, ugly yellowish-gray wincey dress. A faded brown sailor hat sat above two thick braids that hung down her back. The hair was unmistakably red. Her small white face was covered in freckles. Her mouth was large, and so were her eyes, which could look green or gray depending on the light and her mood.
        - id: ch02-b02
          speaker: narrator
          text: >-
            A more careful observer might also have noticed her sharp, determined chin, her sweet and expressive mouth, her broad forehead, and the life and spirit shining in those great eyes. Such an observer would have known there was no ordinary soul inside this stray little girl. Shy Matthew Cuthbert, however, was much too frightened of her to see any of that.
        - id: ch02-b03
          speaker: narrator
          text: >-
            Luckily for Matthew, he did not have to speak first. As soon as the girl was sure he meant to come to her, she stood. One thin brown hand clutched the handle of a shabby old carpetbag. She held the other hand out to him.
        - id: ch02-b04
          speaker: anne_shirley
          text: >-
            You must be Mr. Matthew Cuthbert from Green Gables. I'm so glad to see you! I was starting to worry you weren't coming, and I kept imagining all the things that might have stopped you. If you hadn't come tonight, I was going to walk down the track to that big wild cherry tree by the bend and sleep in it. I wouldn't have been scared at all. Imagine sleeping among all those white blossoms in the moonlight. It would be like living in marble halls, wouldn't it? And I was sure you'd come for me in the morning.
        - id: ch02-b05
          speaker: narrator
          text: >-
            Matthew awkwardly took her skinny little hand in his. Right then, he decided what to do. He could not tell a child with such glowing eyes that there had been a mistake. He would take her home and leave that job to Marilla. Whatever had gone wrong, the girl could not be abandoned at Bright River anyway. Questions and explanations could wait until Matthew was safely back at Green Gables.
        - id: ch02-b06
          speaker: matthew_cuthbert
          text: >-
            Sorry I'm late. Come along now. The horse is over in the hotel yard. Here, let me take your bag.
        - id: ch02-b07
          speaker: anne_shirley
          text: >-
            Oh, I can carry it. It isn't heavy, even with everything I own inside. The trouble is, the handle comes off unless you hold it exactly right, and I know how to do it. It is a terribly old carpetbag. I'm so glad you came, even though sleeping in the cherry tree might have been lovely.
        - id: ch02-b08
          speaker: anne_shirley
          text: >-
            We have a long drive, don't we? Mrs. Spencer said it was eight miles, and I'm glad because I love riding. I can hardly believe I'm going to live with you and really belong to you. I've never truly belonged to anyone before. The asylum was the worst of all. I was there only four months, but that was plenty. You were never an orphan in an asylum, so you couldn't possibly know what it's like. It's worse than anything you could imagine.
        - id: ch02-b09
          speaker: anne_shirley
          text: >-
            Mrs. Spencer said it was wicked to talk that way. I didn't mean to be wicked, though. It's easy to be wicked without knowing, isn't it? The people there were good to us. There just wasn't much room for imagination, except when you imagined things about the other orphans.
        - id: ch02-b10
          speaker: anne_shirley
          text: >-
            Sometimes I imagined that the girl beside me was really the daughter of a belted earl. A cruel nurse had stolen her from her parents when she was a baby, then died before she could confess. I used to lie awake at night making up stories like that because there was no time during the day. Maybe that's why I'm so thin. I am terribly thin, don't you think? There's hardly a scrap of flesh on my bones. I love imagining that I'm round and plump, with dimples in my elbows.
        - id: ch02-b11
          speaker: narrator
          text: >-
            She finally stopped, partly because she had run out of breath and partly because they had reached the buggy. She did not say another word until they were outside the village, heading down a steep little hill. The road had been cut deep into the soft earth. Banks rose several feet above them, edged with white birches and wild cherry trees in bloom.
    - id: ch03
      title: Imagination on the Road
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            A branch of wild plum brushed the buggy. The girl reached out and broke off a spray of blossoms.
        - id: ch03-b02
          speaker: anne_shirley
          text: >-
            Isn't it beautiful? See that tree leaning over the bank, all white and lacy? What does it remind you of?
        - id: ch03-b03
          speaker: matthew_cuthbert
          text: Well now, I don't know.
        - id: ch03-b04
          speaker: anne_shirley
          text: >-
            A bride, of course. She's dressed all in white, with a lovely misty veil around her. I've never actually seen a bride, but I can imagine exactly what one would look like. I don't suppose I'll ever be a bride myself. I'm so homely that no one would marry me, unless perhaps a foreign missionary who wasn't very particular.
        - id: ch03-b05
          speaker: anne_shirley
          text: >-
            But I do hope I'll own a white dress someday. That would be my greatest earthly happiness. I simply adore pretty clothes, and I can't remember ever having a pretty dress in my life. Of course, that gives me all the more to look forward to, doesn't it? Until then, I can imagine I'm dressed as beautifully as anyone could be.
        - id: ch03-b06
          speaker: anne_shirley
          text: >-
            This morning I was ashamed to leave the asylum in this horrible old wincey dress. Every orphan had to wear one. A merchant in Hopeton gave the asylum three hundred yards of wincey last winter. Some people said he donated it because he couldn't sell it, but wouldn't you rather believe he did it out of kindness?
        - id: ch03-b07
          speaker: anne_shirley
          text: >-
            On the train, I felt sure everyone was staring at me and feeling sorry for me. So I imagined I was wearing the most beautiful pale blue silk dress. If you're going to imagine, you might as well imagine something worthwhile. I added a huge hat covered in flowers and nodding feathers, a gold watch, kid gloves, and elegant boots. That cheered me up at once, and I enjoyed the trip to the Island with all my might.
        - id: ch03-b08
          speaker: anne_shirley
          text: >-
            I didn't get seasick on the boat, and neither did Mrs. Spencer, though she usually does. She said she was too busy watching me to make sure I didn't fall overboard. She claimed she'd never seen anyone prowl around the way I did. But if my prowling kept her from being seasick, then it was a mercy I prowled, wasn't it? I wanted to see every single thing there was to see on that boat because I didn't know if I'd ever get another chance.
        - id: ch03-b09
          speaker: anne_shirley
          text: >-
            Oh, look at all those cherry trees in bloom! This Island must be the bloomiest place anywhere. I already love it, and I'm so happy I'm going to live here. People always said Prince Edward Island was the prettiest place in the world. I used to imagine I lived here, but I never truly expected it to happen. Isn't it wonderful when something you've imagined comes true?
        - id: ch03-b10
          speaker: anne_shirley
          text: >-
            And these red roads are so strange. When the train left Charlottetown and they started flashing past, I asked Mrs. Spencer why they were red. She said she didn't know and begged me not to ask another question. She claimed I'd already asked a thousand. I suppose I had, but how can anyone learn without asking? So what does make the roads red?
        - id: ch03-b11
          speaker: matthew_cuthbert
          text: Well now, I don't know.
        - id: ch03-b12
          speaker: anne_shirley
          text: >-
            Then I'll have to find out someday. Isn't it splendid to think how many things are waiting to be discovered? It makes me glad to be alive because the world is so interesting. If we knew everything about everything already, it wouldn't be half as interesting. There'd be no room left for imagination, would there?
        - id: ch03-b13
          speaker: anne_shirley
          text: >-
            Am I talking too much? People say I do. Would you rather have quiet? If you ask me to stop, I will. I really can stop when I decide to, though it isn't easy.
        - id: ch03-b14
          speaker: narrator
          text: >-
            To his own surprise, Matthew was enjoying himself. Like many quiet people, he liked a talkative companion who did all the talking and did not expect him to keep up his share. Still, he had never imagined enjoying the company of a little girl. He found women difficult enough, and he thought girls were worse. The well-behaved Avonlea girls would edge past him timidly, peeking sideways as if he might swallow them in one bite if they dared to speak.
        - id: ch03-b15
          speaker: narrator
          text: >-
            This freckled little witch was nothing like them. Matthew's slower mind could barely keep pace with one quick thought after another, but he decided that he rather liked her chatter. She asked so little from him except that he listen. In his usual shy way, he answered.
        - id: ch03-b16
          speaker: matthew_cuthbert
          text: Talk all you want. I don't mind a bit.
        - id: ch03-b17
          speaker: anne_shirley
          text: >-
            Oh, I'm so glad! I can tell you and I are going to get along beautifully. It's such a relief to talk when you want to without hearing that children should be seen and not heard. People have told me that a million times, if they've told me once. They laugh because I use big words too, but when you have big ideas, don't you need big words to express them?
          emotion: happy
        - id: ch03-b18
          speaker: matthew_cuthbert
          text: Well now, that sounds reasonable.
        - id: ch03-b19
          speaker: anne_shirley
          text: >-
            Mrs. Spencer said my tongue must be hung in the middle, but it isn't. It's firmly attached at one end. She told me your home is called Green Gables. I asked her every question I could think of, and she said trees grow all around it. That made me happier than ever. I just love trees.
        - id: ch03-b20
          speaker: anne_shirley
          text: >-
            There were hardly any trees at the asylum. Only a few poor tiny ones out front, each shut inside a little whitewashed cage. They looked like orphans too. Seeing them always made me want to cry. I used to tell them, "Oh, you poor little things. If you were out in a great big wood, with other trees all around, little mosses and June bells at your roots, a brook nearby, and birds singing in your branches, you could grow. But you can't grow where you are. I know exactly how you feel, little trees."
        - id: ch03-b21
          speaker: anne_shirley
          text: >-
            I was sorry to leave them this morning. You really can become attached to things like that. Is there a brook near Green Gables? I forgot to ask Mrs. Spencer.
        - id: ch03-b22
          speaker: matthew_cuthbert
          text: Well now, yes. There's one just below the house.
        - id: ch03-b23
          speaker: anne_shirley
          text: >-
            Imagine that! One of my dreams has always been to live near a brook, though I never expected it to happen. Dreams don't often come true, do they? Wouldn't it be lovely if they did? Right now I feel almost perfectly happy. I can't feel completely and perfectly happy because... well, what color would you call this?
        - id: ch03-b24
          speaker: narrator
          text: >-
            She pulled one long, shining braid over her shoulder and held it up for Matthew to inspect. He knew very little about the shades of a lady's hair, but this answer was obvious.
        - id: ch03-b25
          speaker: matthew_cuthbert
          text: It's red, isn't it?
        - id: ch03-b26
          speaker: narrator
          text: >-
            The braid fell from her hand. Her sigh seemed to rise from her toes and carry every sorrow in the world with it.
        - id: ch03-b27
          speaker: anne_shirley
          text: >-
            Yes, it's red. Now you see why I can't be perfectly happy. No one with red hair could be. I don't mind the other things nearly as much, not the freckles, the green eyes, or how skinny I am. I can imagine all of those away. I can give myself a lovely rose-leaf complexion and beautiful violet eyes that shine like stars.
          emotion: sad
        - id: ch03-b28
          speaker: anne_shirley
          text: >-
            But I cannot imagine away the red hair. I do my very best. I tell myself it's glorious black hair, black as a raven's wing. All the time, I still know it's only plain red, and that breaks my heart. It will be my lifelong sorrow. I once read about a girl with a lifelong sorrow, though hers wasn't red hair. Her hair was pure gold, rippling back from her alabaster brow. What is an alabaster brow? I could never find out. Can you tell me?
          emotion: sad
        - id: ch03-b29
          speaker: matthew_cuthbert
          text: Well now, I'm afraid I don't.
        - id: ch03-b30
          speaker: narrator
          text: >-
            Matthew was beginning to feel dizzy. It reminded him of the one time, in his reckless youth, when another boy had talked him onto a merry-go-round at a picnic.
        - id: ch03-b31
          speaker: anne_shirley
          text: >-
            Whatever an alabaster brow is, it must be something lovely, because that girl in the novel was divinely beautiful. Have you ever imagined what it would feel like to be divinely beautiful?
        - id: ch03-b32
          speaker: matthew_cuthbert
          text: Well now, no. I can't say I have.
        - id: ch03-b33
          speaker: anne_shirley
          text: >-
            I have, many times. If you could choose, would you rather be divinely beautiful, dazzlingly clever, or angelically good?
        - id: ch03-b34
          speaker: matthew_cuthbert
          text: Well now, I... I don't rightly know.
        - id: ch03-b35
          speaker: anne_shirley
          text: >-
            Neither do I. I can never choose. It hardly matters, since I probably won't be any of them. I certainly won't be angelically good. Mrs. Spencer says... Oh, Mr. Cuthbert! Oh, Mr. Cuthbert! Oh, Mr. Cuthbert!
          emotion: surprised
    - id: ch04
      title: The White Way of Delight
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            That was not what Mrs. Spencer had said. Anne had not fallen from the buggy, and Matthew had done nothing alarming. They had simply turned a bend and entered the Avenue.
        - id: ch04-b02
          speaker: narrator
          text: >-
            People in Newbridge called it the Avenue. It was a stretch of road four or five hundred yards long, planted years before by an eccentric old farmer. Huge apple trees reached over it from both sides, their wide branches joining above the road. Snowy blossoms made one long, fragrant roof. Beneath those boughs, the air had turned purple with twilight. Far ahead, a piece of the painted sunset glowed through the opening like a great rose window at the end of a cathedral aisle.
        - id: ch04-b03
          speaker: narrator
          text: >-
            The beauty left Anne speechless. She leaned back in the buggy with her thin hands clasped in front of her and her face lifted in wonder toward all that white splendor. Even after the buggy left the Avenue and rolled down the long hill toward Newbridge, she neither spoke nor moved. Her face still held that rapt look. She stared west into the glowing sunset as if splendid visions were marching across the sky.
        - id: ch04-b04
          speaker: narrator
          text: >-
            They drove straight through busy Newbridge. Dogs barked at them, little boys shouted, and curious faces watched from windows, but Anne stayed silent through it all. Another three miles slipped away behind them without a word from her. Clearly, she could be just as energetic and determined about silence as she was about talking.
        - id: ch04-b05
          speaker: matthew_cuthbert
          text: >-
            I suppose you're tired and hungry. We don't have far to go now. Just one more mile.
        - id: ch04-b06
          speaker: narrator
          text: >-
            Anne came back from her thoughts with a deep sigh. Her eyes still looked dreamy, as though her mind had wandered far away by starlight.
        - id: ch04-b07
          speaker: anne_shirley
          text: >-
            Mr. Cuthbert, what was that white place we just drove through?
        - id: ch04-b08
          speaker: matthew_cuthbert
          text: >-
            Well now, you must mean the Avenue. It's a sort of pretty place.
        - id: ch04-b09
          speaker: anne_shirley
          text: >-
            Pretty isn't the right word. Beautiful isn't enough either. It was wonderful, truly wonderful. It's the first thing I've ever seen that imagination couldn't improve at all. It satisfied something right here inside me. It gave me a strange little ache, but somehow it was a pleasant ache. Have you ever felt an ache like that, Mr. Cuthbert?
        - id: ch04-b10
          speaker: matthew_cuthbert
          text: Well now, I don't remember ever feeling one.
        - id: ch04-b11
          speaker: anne_shirley
          text: >-
            I feel it whenever I see something royally beautiful. But they shouldn't call that place the Avenue. That name means nothing. It ought to be... let me think... the White Way of Delight. Isn't that much more imaginative?
        - id: ch04-b12
          speaker: anne_shirley
          text: >-
            Whenever I dislike a name, I make up a better one and use it in my own thoughts. At the asylum there was a girl named Hepzibah Jenkins, but I always called her Rosalia DeVere in my imagination. Everyone else can say the Avenue. To me, it will always be the White Way of Delight.
        - id: ch04-b13
          speaker: anne_shirley
          text: >-
            Is home truly only another mile away? I'm glad, but I'm sorry too. This drive has been so lovely, and I'm always sorry when lovely things end. Something even more pleasant might come afterward, of course, but you can never be sure. So often, the next thing isn't as pleasant. At least, that has been my experience.
        - id: ch04-b14
          speaker: anne_shirley
          text: >-
            Still, I'm glad we're nearly home. I can't remember ever having a real home. Just thinking that I'm finally going to one brings back that pleasant ache. Oh, look! Isn't that pretty?
        - id: ch04-b15
          speaker: narrator
          text: >-
            From the top of the hill they could see a pond below. It was so long and winding that it nearly looked like a river. A bridge crossed its middle. Beyond its lower end, a band of amber sand hills stood between the water and the dark blue gulf. The pond shone with ever-changing shades of crocus, rose, and pale, airy green, along with delicate colors no one had ever found names for.
        - id: ch04-b16
          speaker: narrator
          text: >-
            Above the bridge, the pond reached into groves of fir and maple. Their wavering shadows made the clear water look dark. Here and there, a wild plum bent from the bank like a girl in white tiptoeing toward her own reflection. Frogs sang a clear, sweet, mournful chorus from the marsh at the head of the pond. On the far slope, a little gray house peeped around a white apple orchard. Though night had not quite arrived, one window already shone with light.
        - id: ch04-b17
          speaker: matthew_cuthbert
          text: That's Barry's pond.
        - id: ch04-b18
          speaker: anne_shirley
          text: >-
            Oh, I don't like that name either. I'll call it... the Lake of Shining Waters. Yes, that's exactly right. I can tell because it gives me a thrill. Whenever I find the perfect name, I feel a thrill. Do you ever get one?
        - id: ch04-b19
          speaker: narrator
          text: Matthew considered the question.
        - id: ch04-b20
          speaker: matthew_cuthbert
          text: >-
            Well now, yes. Seeing those ugly white grubs turn up in the cucumber beds always gives me a kind of thrill. I can't stand the sight of them.
        - id: ch04-b21
          speaker: anne_shirley
          text: >-
            I don't believe that's quite the same sort. Do you? Grubs and lakes of shining waters don't have much in common. Why does everyone call it Barry's pond?
        - id: ch04-b22
          speaker: matthew_cuthbert
          text: >-
            I reckon it's because Mr. Barry lives in that house. His place is called Orchard Slope. You could see Green Gables from here if that big bush weren't in the way. We have to cross the bridge and follow the road around, though, so it's nearly half a mile yet.
        - id: ch04-b23
          speaker: anne_shirley
          text: >-
            Does Mr. Barry have any girls? Not tiny girls. I mean girls about my age.
        - id: ch04-b24
          speaker: matthew_cuthbert
          text: He has one who's about eleven. Her name is Diana.
        - id: ch04-b25
          speaker: narrator
          text: Anne drew in a long breath.
        - id: ch04-b26
          speaker: anne_shirley
          text: Diana. What a perfectly lovely name!
        - id: ch04-b27
          speaker: matthew_cuthbert
          text: >-
            Well now, I don't know about that. It sounds a little too heathenish to me. I'd rather have Jane or Mary, or another sensible name. A schoolmaster was boarding with the Barrys when she was born. They let him choose, and he named her Diana.
        - id: ch04-b28
          speaker: anne_shirley
          text: >-
            I wish a schoolmaster like that had been nearby when I was born.
    - id: ch05
      title: Almost Home
      blocks:
        - id: ch05-b01
          speaker: anne_shirley
          text: >-
            Oh, here we are at the bridge. I'm going to squeeze my eyes shut tight. Bridges always frighten me. I can't help imagining that just as we reach the middle, the whole thing might fold up like a jackknife and pinch us inside it. That's why I always close my eyes.
        - id: ch05-b02
          speaker: anne_shirley
          text: >-
            But when I think we're nearly in the middle, I have to peek. If the bridge really did fold up, I'd want to see it happen. Listen to that wonderful rumbling! The rumble is my favorite part. Isn't it splendid that the world has so many things to enjoy?
        - id: ch05-b03
          speaker: anne_shirley
          text: >-
            There, we're across. Now I can look back. Good night, dear Lake of Shining Waters. I always say good night to things I love, just as I do to people. I think they like hearing it. The water looks as though it's smiling at me.
        - id: ch05-b04
          speaker: narrator
          text: >-
            They climbed the next hill and rounded a corner.
        - id: ch05-b05
          speaker: matthew_cuthbert
          text: We're nearly there now. Green Gables is over...
        - id: ch05-b06
          speaker: anne_shirley
          text: >-
            Oh, don't show me! Let me find it myself. I'm sure I can guess.
        - id: ch05-b07
          speaker: narrator
          text: >-
            Anne caught his half-raised arm and shut her eyes so she could not follow his gesture. Then she opened them and searched. They stood on the crest of a hill. The sun had been down for a while, but the soft afterlight still showed the land clearly. A dark church spire rose in the west against a marigold sky. Below lay a little valley. Beyond it, snug farms dotted a long slope that rose gently into the distance.
        - id: ch05-b08
          speaker: narrator
          text: >-
            Her eyes moved quickly from one home to the next, full of eagerness and longing. At last they settled on a house far to the left, set well back from the road. Blossoming trees made it glow faintly white in the twilight, with the dark woods gathered around it. High above, in the spotless southwestern sky, a great crystal-white star shone over the house like a lamp of guidance and promise.
        - id: ch05-b09
          speaker: anne_shirley
          text: That's the one, isn't it?
        - id: ch05-b10
          speaker: narrator
          text: >-
            She pointed, and Matthew gave the sorrel mare an excited slap with the reins.
        - id: ch05-b11
          speaker: matthew_cuthbert
          text: >-
            Well now, you found it! Though I reckon Mrs. Spencer told you enough about the place to recognize it.
        - id: ch05-b12
          speaker: anne_shirley
          text: >-
            No, she truly didn't. What she said could have described almost any of those farms. I didn't know what Green Gables would look like. The moment I saw that one, though, I felt it was home.
        - id: ch05-b13
          speaker: anne_shirley
          text: >-
            Oh, it feels as though I must be dreaming. My arm is probably black and blue from the elbow up because I've pinched it so often today. Every little while, a horrible, sickening feeling would come over me. I'd be terrified that none of this was real, that it was all a dream, so I'd pinch myself to make sure I was awake.
        - id: ch05-b14
          speaker: anne_shirley
          text: >-
            Then I realized that even if it was a dream, I should keep dreaming as long as possible. So I stopped pinching. But it is real. We're almost home.
        - id: ch05-b15
          speaker: narrator
          text: >-
            Anne gave a happy, wondering sigh and fell silent again. Matthew shifted uneasily. He was grateful that Marilla, not he, would have to tell this lonely child that the home she longed for could not be hers after all.
        - id: ch05-b16
          speaker: narrator
          text: >-
            The buggy crossed Lynde's Hollow. It was dark there, though not dark enough to keep Mrs. Rachel from spotting them from her usual place at the window. They climbed the hill and turned into Green Gables' long lane. By the time they reached the house, Matthew was shrinking from the coming revelation with a strength of feeling he did not understand.
        - id: ch05-b17
          speaker: narrator
          text: >-
            He was no longer thinking about himself or Marilla, or about all the trouble the mistake would probably cause them. He could only think about Anne's disappointment. The thought of that joyful, rapt light going out in her eyes made him feel as though he were helping to kill something innocent. It was the same terrible feeling that came over him whenever he had to kill a lamb, a calf, or any other harmless little creature.
        - id: ch05-b18
          speaker: narrator
          text: >-
            The yard was dark when they entered. All around them, the poplar leaves rustled softly like silk. Matthew lifted Anne down from the buggy.
        - id: ch05-b19
          speaker: anne_shirley
          text: >-
            Listen to the trees talking in their sleep. They must be having such lovely dreams.
        - id: ch05-b20
          speaker: narrator
          text: >-
            Anne held tight to the carpetbag that carried everything she owned and followed Matthew into the house.
