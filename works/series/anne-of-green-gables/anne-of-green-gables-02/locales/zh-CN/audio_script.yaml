audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖从容，带着细腻而机智的讲述感
        timbre: 清澈柔和
        pace: 舒缓而有变化
        pitch: 中音
    anne:
      display_name: 安妮
      tts:
        delivery: 热切灵动，想法接连涌出，真挚而富于想象
        timbre: 清亮稚嫩
        pace: 明快，动情处自然放慢
        pitch: 中高音
    matthew:
      display_name: 马修
      tts:
        delivery: 腼腆温厚，说话迟缓而谨慎
        timbre: 低沉柔和
        pace: 缓慢
        pitch: 中低音
    stationmaster:
      display_name: 站长
      tts:
        delivery: 爽快利落，略带随口打趣的意味
        timbre: 明朗结实
        pace: 中等偏快
        pitch: 中音
  chapters:
    - id: ch01
      title: 第二章　马修·卡思伯特大吃一惊
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 马修·卡思伯特驾着栗色母马，舒舒服服地走完了去布莱特河的八英里路。沿途尽是安适的农庄。有时，马车会穿过一小片飘着清香的冷杉林。有时，路边又会出现一处洼地，野李树披着轻纱一样的花。苹果园送来的香气甜甜的，草地一路伸向远方，最后融进珍珠色和紫色的薄雾。小鸟儿也唱个不停，仿佛这一日就是全年唯一的夏日。
        - id: ch01-b02
          speaker: narrator
          text: 马修用自己的方式享受着这段路程。只有遇到女人的时候，他才会不自在，因为在爱德华王子岛，不管认识不认识，路上碰见了都该点头问候。
        - id: ch01-b03
          speaker: narrator
          text: 除了玛丽拉和雷切尔太太，马修怕所有的女人。他总觉得这些神秘的人会在背后笑他。也许真有人笑过，因为他看起来确实有些古怪。他身材笨拙，背微微驼着，铁灰色的长发垂到肩头，脸上留着浓密柔软的棕色胡子。他从二十岁起就蓄着这把胡子。说来也怪，他二十岁时几乎就是六十岁的模样，只是头发还没这么灰。
        - id: ch01-b04
          speaker: narrator
          text: 到了布莱特河，马修没有看见火车。他以为自己来早了，就把马拴在小旅馆的院子里，走向车站。长站台上几乎一个人也没有，只有尽头坐着一个小姑娘，身下是一摞屋顶木瓦。放眼望去，她简直是那里唯一的活物。马修只注意到那是个姑娘，便侧着身子赶紧溜了过去，看都没敢看她。如果他肯看一眼，就会发现她坐得笔直，浑身绷得紧紧的，神情里全是期待。眼下除了等候，她什么也做不了，于是她就用上全部力气，一心一意地等。
        - id: ch01-b05
          speaker: narrator
          text: 办事利落的站长正锁上售票处，准备回家吃晚饭。马修在门口碰见他，便走过去，问五点半的火车是不是快到了。
        - id: ch01-b06
          speaker: stationmaster
          text: 五点半那班车早到了，半个钟头前就开走啦。不过，有位乘客是来找你的，一个小姑娘。她就在外面那摞木瓦上。我让她去女候车室，她很郑重地告诉我，还是外面好，因为更有想象的余地。依我看，这孩子可真够特别的。
        - id: ch01-b07
          speaker: matthew
          text: 可我不是来接姑娘的。我等的是一个男孩，他应该在这儿。亚历山大·斯宾塞太太答应从新斯科舍把他带来。
          emotion: surprised
        - id: ch01-b08
          speaker: narrator
          text: 站长听完，吹了一声口哨。
        - id: ch01-b09
          speaker: stationmaster
          text: 那准是哪里出了错。斯宾塞太太带着这姑娘下车，把她交给我，还说你和你妹妹要从孤儿院收养她，你一会儿就会来。别的我就不知道了。反正这附近再没有哪个孤儿让我藏起来。
        - id: ch01-b10
          speaker: matthew
          text: 我实在弄不明白。
        - id: ch01-b11
          speaker: narrator
          text: 马修束手无策，真希望玛丽拉就在身边，可以替他处理这个局面。
        - id: ch01-b12
          speaker: stationmaster
          text: 你去问问那姑娘吧。她肯定能把事情说清楚，至少她绝不会没话讲。也许你们要的那种男孩正巧缺货了。
        - id: ch01-b13
          speaker: narrator
          text: 饿着肚子的站长轻快地走了。可怜的马修却得去做一件比闯进狮子窝还难的事。他得走到一个陌生的孤儿姑娘面前，问她为什么不是男孩。马修心里直叫苦，只好转过身，拖着脚步慢慢朝她走去。
        - id: ch01-b14
          speaker: narrator
          text: 那姑娘从马修经过时就一直看着他。马修没看她，就算看了，大概也看不出她真正是什么样的人。普通人会先看见一个十一岁上下的孩子，穿着一条黄灰色毛呢裙，短得很，紧得很，也难看得很。她戴着褪色的棕色水手帽，帽子下面垂着两条又粗又长的辫子。那头发是再明显不过的红色。她的脸小而苍白，瘦瘦的，长满雀斑。嘴很大，眼睛也很大，随着光线和心情，有时像绿色，有时又像灰色。
        - id: ch01-b15
          speaker: narrator
          text: 可要是眼光特别好，还会看出更多东西。她的下巴又尖又分明，大眼睛里满是精神和活力，嘴唇温柔而且表情丰富，额头宽阔饱满。这样的人也许会明白，这个无家可归的瘦小姑娘，身体里住着一个一点也不平凡的灵魂。偏偏羞怯的马修还怕她怕得不得了。
        - id: ch01-b16
          speaker: narrator
          text: 好在马修不用先开口，这让他免去了最难熬的折磨。姑娘一看出他是来找自己的，立刻站起来。一只晒成褐色的瘦手紧抓着破旧过时的旅行毯包，另一只手已经伸到了他面前。
        - id: ch01-b17
          speaker: anne
          text: 您一定是绿山墙的马修·卡思伯特先生吧？见到您真好。我刚才都担心您不来了，还想了好多会把您耽搁住的事情。要是今晚等不到您，我就沿着铁轨走到拐弯处那棵大野樱桃树下，爬上去睡一夜。我才不会害怕呢。月光照着满树白花，睡在那里一定很美，对不对？我可以想象自己住进了大理石宫殿。就算您今晚不来，我也相信您明天早上一定会来接我。
          emotion: happy
        - id: ch01-b18
          speaker: narrator
          text: 马修笨手笨脚地握住那只瘦瘦的小手，就在这时拿定了主意。他没法告诉这个眼睛发亮的孩子，说事情弄错了。他要先带她回家，再让玛丽拉开口。不管出了什么差错，总不能把孩子留在布莱特河。至于那些问题，还是等他安全回到绿山墙以后再解释吧。
        - id: ch01-b19
          speaker: matthew
          text: 对不起，我来晚了。走吧，马在那边院子里。把包交给我。
        - id: ch01-b20
          speaker: anne
          text: 哦，我自己拿得动，一点也不重。虽然我所有的家当都在里面，它还是不重。可是提的姿势稍微不对，包带就会掉下来，还是让我拿吧，只有我知道该怎么提。这个旅行毯包实在太旧了。您能来接我，我真高兴，虽然睡在野樱桃树上一定也不错。我们要坐很久的马车吧？斯宾塞太太说有八英里。我最喜欢坐马车了。一想到从今以后我要和您一起生活，成为您家里的人，真是太奇妙了。我从来没有真正属于过谁。
        - id: ch01-b21
          speaker: anne
          text: 孤儿院是最糟糕的地方。我只住了四个月，可那已经太久了。您一定没在孤儿院里当过孤儿，所以不会明白那是什么滋味。那比您能想象的一切都糟。斯宾塞太太说，我这样讲话很坏，可我并没想做坏事。不知不觉就做了坏事，实在很容易，对不对？孤儿院里的人其实都很好，只是那里没有多少东西可以让人想象。除了别的孤儿，几乎什么也没有。
        - id: ch01-b22
          speaker: anne
          text: 替她们想象身世倒挺有趣。比如，坐在身边的姑娘也许是一位束带伯爵的亲生女儿。小时候，一个狠心的保姆把她从父母身边偷走，还没来得及坦白就死了。我过去常常在夜里躺着想这些故事，因为白天根本没有空。也许我就是这样才瘦成现在的样子。我是不是瘦得吓人？骨头上简直没有肉。我可喜欢想象自己白白胖胖，连胳膊肘上都有小酒窝。
        - id: ch01-b23
          speaker: narrator
          text: 安妮终于停了下来。一来她说得喘不过气，二来他们已经走到马车旁。此后，她一句话也没说，直到马车出了村子，沿一座陡峭的小山往下走。那段路深深陷进松软的泥土，两边的堤岸比他们的头还高。岸上开着野樱桃花，细长的白桦也立在花丛间。
        - id: ch01-b24
          speaker: narrator
          text: 一枝野李花擦过车身。安妮伸手折下一枝。
        - id: ch01-b25
          speaker: anne
          text: 它多美呀！那棵树从岸上探出来，浑身雪白，还像镶着花边。它让您想起什么？
        - id: ch01-b26
          speaker: matthew
          text: 这个嘛，我可不知道。
        - id: ch01-b27
          speaker: anne
          text: 当然是一位新娘呀。她穿着一身白衣，蒙着又轻又美的薄纱。我没见过新娘，可我能想出她的模样。我自己大概永远做不了新娘。我这么难看，谁会愿意娶我呢？除非是一位去国外传教的传教士，也许那样的人不会太挑剔。不过，我真希望有一天能穿上一条白裙子。那就是我在人世间能想到的最高幸福。我实在太爱漂亮衣裳了。
        - id: ch01-b28
          speaker: anne
          text: 从我记事起，就没有穿过一条漂亮裙子。这样也好，我才有值得盼望的东西。我还可以想象自己穿得华丽极了。今天离开孤儿院时，我只能穿这条又旧又难看的毛呢裙，羞得不得了。所有孤儿都穿这种衣服。去年冬天，霍普顿有个商人捐了三百码毛呢。有人说，那是因为布卖不出去，可我宁愿相信他只是好心。您也愿意这么相信吧？
        - id: ch01-b29
          speaker: anne
          text: 上火车的时候，我觉得所有人都在看我、可怜我。我马上想象自己穿着最美的浅蓝色丝裙。既然要想，当然该想些真正值得想的东西。我还想象自己戴着一顶大帽子，上面全是花，长羽毛一颤一颤的。我手腕上有一块金表，手上戴着小羊皮手套，脚上穿着漂亮靴子。这样一想，我立刻高兴了，来岛上的一路都过得很快活。
        - id: ch01-b30
          speaker: anne
          text: 坐船时我一点也没晕。斯宾塞太太也没晕，虽然她平常总会晕船。她说，她得一直盯住我，免得我掉进海里，根本没有工夫难受。她还说，从没见过谁像我这样到处乱钻。不过，我这样做让她没晕船，也算是一件好事吧？而且我想看遍船上所有能看的东西，因为谁知道以后还有没有机会。
        - id: ch01-b31
          speaker: anne
          text: 哦，前面又有那么多开花的樱桃树！这座岛简直到处都是花。我已经喜欢上这里了，也太高兴自己要住在这里了。我总听说爱德华王子岛是全世界最美的地方，也常常想象自己住在岛上，可从没真觉得梦想会成真。想象变成真的，真叫人快活，对不对？不过，这里的红土路可真奇怪。
        - id: ch01-b32
          speaker: anne
          text: 我们在夏洛特敦上了火车，红色的路从窗外一条条闪过去。我问斯宾塞太太，为什么路是红色的。她说不知道，还求我看在老天的分上别再问了。她说我大概已经问了一千个问题。也许真有那么多吧，可是不问，又怎么能弄明白事情呢？所以，这些路到底为什么是红的？
        - id: ch01-b33
          speaker: matthew
          text: 这个嘛，我可不知道。
        - id: ch01-b34
          speaker: anne
          text: 那就留到以后再弄明白吧。一想到世上有那么多事等着我们去发现，不是很美妙吗？我一想就觉得活着真好，这个世界太有趣了。要是什么都知道，它就没这么有趣，也没有地方留给想象了，对不对？可是，我是不是说得太多了？别人总这样讲我。要是您不愿意听，我就不说了。我只要真下定决心，是能停下来的，虽然会很难。
        - id: ch01-b35
          speaker: narrator
          text: 出乎马修自己的意料，他听得很愉快。许多沉默的人都喜欢健谈的人，只要对方愿意把话全说完，不要求他们接得上就好。不过，马修从没料到，自己会喜欢一个小姑娘陪着。在他看来，女人已经够让人害怕，小姑娘简直还要糟糕。埃文利那些教养良好的女孩总会怯生生地从他身旁溜过，还斜着眼偷看，仿佛只要她们敢说一个字，他就会一张嘴把她们整个吞掉。
        - id: ch01-b36
          speaker: narrator
          text: 可这个满脸雀斑的小妖精完全不一样。她的想法转得飞快，马修迟钝的脑子追起来很吃力，可他确实有点喜欢听她说个不停。于是，他像平常一样害羞地回答了她。
        - id: ch01-b37
          speaker: matthew
          text: 哦，你想说多少就说多少吧。我不在意。
        - id: ch01-b38
          speaker: anne
          text: 啊，我真高兴。我知道我们一定会相处得很好。想说话的时候可以说，不会有人教训我，说什么孩子只能让大人看见，不能让大人听见，真叫人松了一口气。别人对我说过这句话，就算没有一百万次，也差不多了。大家还笑我爱用大词。可是心里有很大的想法，就得用很大的词来表达，对不对？
          emotion: happy
        - id: ch01-b39
          speaker: matthew
          text: 这个嘛，听着很有道理。
        - id: ch01-b40
          speaker: anne
          text: 斯宾塞太太说，我的舌头一定吊在正中间。可才不是呢，它明明牢牢长在一头。她告诉我，你们家叫绿山墙。我把那里的事问了个遍。她说房子四周都是树，我听了更高兴。我实在太爱树了。孤儿院旁边连一棵像样的树也没有。门口只有几棵可怜巴巴、丁点儿大的树，外面还围着刷白的小笼子。它们看起来也像孤儿一样，我每次看见都想哭。
        - id: ch01-b41
          speaker: anne
          text: 我常对那些小树说，你们真可怜。要是住在一大片树林里，周围全是别的树，根上长着青苔和六月铃花，附近流着小溪，鸟儿在枝头唱歌，你们一定能长大。可是在孤儿院门口，你们长不大。我完全明白你们是什么感受。今天早上离开它们时，我真舍不得。人会对这样的东西产生感情，对不对？对了，绿山墙附近有没有小溪？我忘了问斯宾塞太太。
        - id: ch01-b42
          speaker: matthew
          text: 这个嘛，有一条，就在房子下面。
        - id: ch01-b43
          speaker: anne
          text: 您想想！住在小溪边，一直是我的梦想。我本来从没指望它能实现。梦想很少成真，是不是？要是都能实现就好了。可我现在已经差不多完全幸福了。还不能真正完全幸福，因为……嗯，您觉得这个是什么颜色？
        - id: ch01-b44
          speaker: narrator
          text: 安妮把一条乌亮的长辫子甩过瘦削的肩头，举到马修面前。马修从来不懂得分辨女士头发的色泽，可这一回实在没什么好猜的。
        - id: ch01-b45
          speaker: matthew
          text: 是红色，对吧？
        - id: ch01-b46
          speaker: narrator
          text: 安妮松开辫子，长长叹了一口气。那口气仿佛从脚趾尖一直涌了上来，还把千秋万世所有的忧愁都带了出来。
        - id: ch01-b47
          speaker: anne
          text: 是的，是红色。现在您知道我为什么不能完全幸福了。长着红头发的人，谁也不可能完全幸福。雀斑、绿眼睛、瘦骨伶仃，这些我都不太在意，因为我能想象它们消失。我可以想象自己的脸像玫瑰花瓣一样好看，还有一双紫罗兰色的眼睛，像星星那样亮。可是这头红发，我怎么也想象不掉。
          emotion: sad
        - id: ch01-b48
          speaker: anne
          text: 我真的尽力了。我会告诉自己，我的头发现在是辉煌的黑色，像乌鸦的翅膀一样黑。可是心里一直知道，它只是普普通通的红色。这真让我心碎。它会成为我一生的哀愁。我在小说里读过一个姑娘，她也有一生的哀愁，不过不是红头发。她那纯金色的头发，从雪花石膏般的额头上卷向后面。雪花石膏般的额头是什么样子？我一直没弄懂。您能告诉我吗？
          emotion: sad
        - id: ch01-b49
          speaker: matthew
          text: 这个嘛，恐怕我也不能。
        - id: ch01-b50
          speaker: narrator
          text: 马修已经有点头晕了。他想起自己年轻莽撞的时候，曾被另一个男孩哄上野餐会里的旋转木马。现在的感觉就和那一回差不多。
        - id: ch01-b51
          speaker: anne
          text: 不管那是什么，一定很美，因为小说里的姑娘美得像天仙。您想过吗？美得像天仙会是什么感觉？
        - id: ch01-b52
          speaker: matthew
          text: 这个嘛，没有。我没想过。
        - id: ch01-b53
          speaker: anne
          text: 我倒常常想。如果可以挑，您愿意美得像天仙，聪明得光彩夺目，还是善良得像天使？
        - id: ch01-b54
          speaker: matthew
          text: 这个嘛，我……我也说不准。
        - id: ch01-b55
          speaker: anne
          text: 我也说不准，永远都选不出来。可其实也没多大关系，我大概一样也成不了。善良得像天使，我是肯定做不到的。斯宾塞太太说……哦，卡思伯特先生！哦，卡思伯特先生！！哦，卡思伯特先生！！！
          emotion: surprised
        - id: ch01-b56
          speaker: narrator
          text: 这可不是斯宾塞太太说的话。安妮并没有一头栽下马车，马修也根本没做出什么惊人的举动。他们只是沿着路走过一道弯，眼前忽然出现了新桥村人所说的“大道”。
        - id: ch01-b57
          speaker: narrator
          text: 大道足有四五百码长。许多年前，一位古怪的老农夫在路旁种下高大而舒展的苹果树。如今枝叶在路顶完全合拢，撑起了一座拱门。雪白芬芳的花从头顶一路铺过去，树下的空气浸在紫色的暮光里。远远望去，尽头的一片晚霞灿然发亮，就像教堂长廊尽头巨大的玫瑰花窗。
        - id: ch01-b58
          speaker: narrator
          text: 这样的美让安妮说不出话来。她靠在马车里，瘦瘦的双手交握在身前，仰起脸，满心陶醉地望着头顶那片灿烂的雪白。马车驶出大道，又沿着长坡走向新桥村，她始终不动，也不开口。她仍旧带着心醉神迷的神情，远远望向西边的落日。她眼睛里的幻景仿佛正排着华丽的队伍，从那片霞光灿烂的天幕前经过。
        - id: ch01-b59
          speaker: narrator
          text: 新桥村热闹得很。狗追着马车叫，小男孩朝他们起哄，好奇的脸从一扇扇窗口探出来。安妮还是沉默。又走过三英里，她仍没说一句话。看起来，她一旦用心沉默，也能和用心说话时一样彻底。
        - id: ch01-b60
          speaker: matthew
          text: 我猜你又累又饿了。不过，我们已经快到了，只剩下一英里。
        - id: ch01-b61
          speaker: narrator
          text: 马修实在想不到别的理由，只能把她长久的安静归到疲倦和饥饿上。安妮深深叹了一口气，从遐想中回来。她用一双梦一般的眼睛望着马修，好像灵魂刚才跟着星光，去很远的地方漫游了一圈。
        - id: ch01-b62
          speaker: anne
          text: 卡思伯特先生，我们刚才走过的那个地方，就是那片雪白的地方，叫什么名字？
        - id: ch01-b63
          speaker: matthew
          text: 这个嘛，你说的一定是大道。那里确实有几分好看。
        - id: ch01-b64
          speaker: anne
          text: 好看？这个词不对。美丽也不对，它们都远远不够。那里太奇妙了，真的太奇妙了。那是我见过的第一样东西，连想象也没法让它变得更好。它让我的这里得到了满足。
        - id: ch01-b65
          speaker: narrator
          text: 安妮把一只手按在胸前。
        - id: ch01-b66
          speaker: anne
          text: 这里隐隐地痛，感觉怪怪的，可又是一种很愉快的痛。卡思伯特先生，您有过这样的感觉吗？
        - id: ch01-b67
          speaker: matthew
          text: 这个嘛，我不记得有过。
        - id: ch01-b68
          speaker: anne
          text: 每次看见真正壮丽的美景，我都会这样。可那么可爱的地方，不该只叫大道。这个名字一点意思也没有。它应该叫……让我想想……喜悦的洁白之路。这个名字是不是很有想象力？每当我不喜欢一个地方或一个人的名字，我就替他们想一个新的，以后心里只用新名字叫他们。
        - id: ch01-b69
          speaker: anne
          text: 孤儿院里有个姑娘叫赫普西芭·詹金斯，可我一直把她想成罗莎莉娅·德维尔。别人可以继续说大道，我却永远要叫它喜悦的洁白之路。我们真的只差一英里就到家了吗？我又高兴，又舍不得。这一路太愉快了，而愉快的事结束时，我总会难过。后面也许还有更愉快的事，可谁也不知道。照我的经历来看，后面的事常常没有那么好。
        - id: ch01-b70
          speaker: anne
          text: 不过，一想到要到家，我还是很高兴。从我有记忆起，就没有过一个真正的家。现在光是想到自己就要回到真真正正的家，胸口又开始愉快地痛了。哦，快看，那边多美呀！
          emotion: happy
        - id: ch01-b71
          speaker: narrator
          text: 马车越过山顶，下方出现了一座池塘。它又长又弯，看着几乎像一条河。桥横在池塘中央。从桥边一直到池塘下端，有一道琥珀色的沙丘，把池水和远处深蓝的海湾分开。整片水面流转着绚丽的光彩，有番红花的淡紫、玫瑰的粉红，还有空灵的浅绿。另一些颜色一闪便过去，变化得让人捉摸不住，世上还没有人替它们取过名字。
        - id: ch01-b72
          speaker: narrator
          text: 桥上方的池水伸进冷杉和枫树围成的树林，在摇动的树影里显得幽暗又清澈。岸边不时有野李树俯向水面，像一个穿白衣的姑娘，踮起脚看自己的倒影。池塘尽头的沼泽里，青蛙唱得清亮，听来既哀婉又甜美。对面的山坡上，灰色小屋从雪白的苹果园后面探出脸。天还没有全黑，一扇窗里已经亮起了灯。
        - id: ch01-b73
          speaker: matthew
          text: 那就是巴里家的池塘。
        - id: ch01-b74
          speaker: anne
          text: 哦，这个名字我也不喜欢。我要叫它……闪光之湖。对，这才是它的名字。我知道，因为这个名字让我浑身颤了一下。每当我找到一个再合适不过的名字，就会有这样的感觉。有什么东西也会让您发颤吗？
        - id: ch01-b75
          speaker: narrator
          text: 马修认真想了一会儿。
        - id: ch01-b76
          speaker: matthew
          text: 这个嘛，也有。每回在黄瓜地里挖出那种难看的白蛴螬，我就会发颤。我很讨厌它们的样子。
        - id: ch01-b77
          speaker: anne
          text: 哦，那恐怕不是同一种感觉。您觉得会一样吗？蛴螬和闪光之湖，好像怎么也扯不到一起。可是，为什么别人管这里叫巴里家的池塘？
        - id: ch01-b78
          speaker: matthew
          text: 我想，是因为巴里先生住在上边那座房子里。他家叫果园坡。要不是后面那片大灌木挡住了，现在就能看见绿山墙。不过，我们还得过桥，再沿路绕过去，所以差不多还有半英里。
        - id: ch01-b79
          speaker: anne
          text: 巴里先生有没有女儿？不用很小，和我差不多大就好。
        - id: ch01-b80
          speaker: matthew
          text: 他有一个十一岁左右的女儿，叫戴安娜。
        - id: ch01-b81
          speaker: anne
          text: 哦！这个名字真是美极了！
          emotion: happy
        - id: ch01-b82
          speaker: matthew
          text: 这个嘛，我倒不觉得。听起来异教味儿重得吓人。我宁愿叫简，或者玛丽，这种名字才正经。不过，戴安娜出生时，巴里家住着一位寄宿的校长。他们让校长取名字，他就叫她戴安娜。
        - id: ch01-b83
          speaker: anne
          text: 真希望我出生时，身边也住着这样一位校长。哦，我们上桥了。我要紧紧闭上眼睛。我每次过桥都害怕，总忍不住想，走到正中间时，桥也许会像折叠刀一样突然合拢，把我们夹在里面。所以我会闭上眼睛。可是，我觉得快到桥中央时，又一定要睁开。因为桥要是真合拢了，我会想亲眼看着它合拢。
        - id: ch01-b84
          speaker: anne
          text: 听这轰隆隆的声音，多好玩呀！我一直很喜欢过桥时这阵轰隆声。世上有这么多值得喜欢的东西，真是太好了，对不对？好啦，我们已经过桥了。我要回头看看。晚安，亲爱的闪光之湖。我总会向心爱的东西说晚安，就像对人一样。我想它们会喜欢的。您看，那片水好像正在冲我微笑。
        - id: ch01-b85
          speaker: narrator
          text: 马车上了对面的山坡，又绕过一道弯。马修抬起手，正要指向远处。
        - id: ch01-b86
          speaker: matthew
          text: 我们快到家了。绿山墙就在那边……
        - id: ch01-b87
          speaker: anne
          text: 哦，别告诉我！让我自己猜。我一定能猜对。
        - id: ch01-b88
          speaker: narrator
          text: 她一把抓住马修抬起的手臂，紧闭双眼，不让自己看见他指的方向。随后，她睁开眼睛，向四周望去。他们正在山顶。太阳已经落下，可柔和的余晖还照亮着四野。西边，一座深色的教堂尖顶立在橙黄的天空前。脚下是小小的山谷，山谷另一边，平缓的长坡慢慢升高，舒适的农舍散落在坡上。
        - id: ch01-b89
          speaker: narrator
          text: 安妮的目光急切地从一座房子飞向下一座，眼神里满是渴望。最后，她望向左边远处的一所房子。它远离大路，藏在林木的暮色里，开花的树丛朦胧地泛着白光。房子上方，西南天空澄澈无瑕。一颗晶莹雪白的大星星在那里闪耀，像一盏指路的灯，也像一个光明的许诺。
        - id: ch01-b90
          speaker: anne
          text: 就是那里，对不对？
        - id: ch01-b91
          speaker: narrator
          text: 她伸手指过去。马修高兴地用缰绳轻轻拍了拍栗色母马。
        - id: ch01-b92
          speaker: matthew
          text: 这个嘛，你猜对了！不过，我想斯宾塞太太一定跟你讲过它的样子，所以你才能认出来。
        - id: ch01-b93
          speaker: anne
          text: 没有，她真的没讲。她说的那些话，用来形容这里大多数人家都可以。我根本不知道绿山墙长什么样。可我一看见它，就觉得那里是我的家。哦，这一切简直像一场梦。您知道吗？我今天把自己掐了太多次，胳膊从肘弯往上一定全青了。
        - id: ch01-b94
          speaker: anne
          text: 过一会儿，我心里就会冒出一阵又难受又可怕的感觉，生怕这一切全是梦。我只好掐自己，看看它是不是真的。后来，我忽然想到，就算只是一场梦，也该尽量多梦一会儿，所以才不掐了。可现在这一切是真的，我们马上就到家了。
          emotion: happy
        - id: ch01-b95
          speaker: narrator
          text: 安妮满足地叹了一声，又安静下来。马修却不安地动了动。他庆幸最后要开口的人是玛丽拉，不是自己。这个无依无靠的孩子如此盼望一个家，可玛丽拉将不得不告诉她，这个家并不属于她。
        - id: ch01-b96
          speaker: narrator
          text: 马车穿过林德洼地时，天已经很黑，不过还没有黑到能逃过雷切尔太太那扇窗。她照旧守在那里，把他们看得清清楚楚。随后，他们上了山，拐进绿山墙长长的车道。离房子越近，马修越想逃开那个即将到来的时刻。他自己都不明白，为什么会这样难受。他想的不是玛丽拉，也不是自己，更不是这场错误会带来多少麻烦。他只想着安妮会有多么失望。
        - id: ch01-b97
          speaker: narrator
          text: 只要想到她眼里那道喜悦的光就要熄灭，马修便觉得，自己仿佛也要帮忙杀死某种珍贵的东西。这种感觉就像他不得不宰杀一只羔羊、一头牛犊，或任何无辜的小生命时一样，让他很不好受。
        - id: ch01-b98
          speaker: narrator
          text: 马车转进院子，四周已经完全黑了。白杨叶在他们身边轻轻摩擦，发出丝绸般的沙沙声。马修把安妮抱下车。
        - id: ch01-b99
          speaker: anne
          text: 听，树木正在睡梦里说话。它们一定在做很美的梦！
        - id: ch01-b100
          speaker: narrator
          text: 安妮紧紧提着那只旅行毯包。包里装着她在世上的全部家当。她就这样跟着马修走进了屋子。
