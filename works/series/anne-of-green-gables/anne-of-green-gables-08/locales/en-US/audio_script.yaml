audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm, observant, and gently amused
        timbre: clear and rounded
        pace: measured
        pitch: medium
    anne_shirley:
      display_name: Anne Shirley
      tts:
        delivery: vivid, earnest, and eagerly imaginative
        timbre: clear and youthful
        pace: lively
        pitch: medium-high
    marilla_cuthbert:
      display_name: Marilla Cuthbert
      tts:
        delivery: firm, practical, and restrained
        timbre: clear and mature
        pace: steady
        pitch: medium-low
  chapters:
    - id: ch01
      title: The Answer at Last
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            For reasons of her own, Marilla kept her decision to herself until the next afternoon. All morning she gave Anne one task after another and watched her closely as the work was done. By noon, Marilla had learned quite a bit. Anne was bright and obedient. She was ready to work and quick to learn. Her one serious fault seemed to be daydreaming in the middle of a task. Once her thoughts wandered, she forgot the work completely until a sharp scolding, or some small disaster, brought her firmly back to earth.
        - id: ch01-b02
          speaker: narrator
          text: >-
            After Anne washed the dinner dishes, she faced Marilla as if she could not wait another second. Her thin body shook, her face went red, and her wide eyes looked almost black. She clasped her hands tight.
        - id: ch01-b03
          speaker: anne_shirley
          text: >-
            Oh, please, Miss Cuthbert, tell me whether you're sending me away. I've tried to wait patiently all morning, but I can't stand not knowing any longer. It feels dreadful. Please tell me.
          emotion: fearful
        - id: ch01-b04
          speaker: marilla_cuthbert
          text: >-
            You didn't scald the dishcloth in clean hot water the way I told you. Go do that before you ask anything else.
        - id: ch01-b05
          speaker: narrator
          text: >-
            Anne took care of the dishcloth. Then she came back and fixed her pleading eyes on Marilla. This time Marilla had no excuse to put off the answer.
        - id: ch01-b06
          speaker: marilla_cuthbert
          text: >-
            I suppose I may as well tell you. Matthew and I have decided to keep you. That is, you can stay if you try to be a good little girl and show that you're grateful. Why, child, what's the matter?
        - id: ch01-b07
          speaker: anne_shirley
          text: >-
            I'm crying, and I don't know why. I'm as glad as I can be, but glad isn't nearly a big enough word. I was glad about the White Way and the cherry blossoms. This is more than glad. I'm so happy! I'll try terribly hard to be good. It may be uphill work, because Mrs. Thomas always said I was desperately wicked, but I'll do my very best. Why am I crying?
          emotion: happy
        - id: ch01-b08
          speaker: marilla_cuthbert
          text: >-
            I suppose you're crying because you're excited and all worked up. Sit in that chair and try to settle yourself. I'm afraid you laugh and cry much too easily. Yes, you may stay here, and we'll try to do right by you. You must go to school, of course. But vacation begins in only two weeks, so there is no sense in starting now. You can begin when school opens again in September.
        - id: ch01-b09
          speaker: anne_shirley
          text: >-
            What should I call you? Must I always say Miss Cuthbert, or may I call you Aunt Marilla?
        - id: ch01-b10
          speaker: marilla_cuthbert
          text: >-
            No. Call me Marilla, plain and simple. I'm not used to Miss Cuthbert, and hearing it all the time would make me nervous.
        - id: ch01-b11
          speaker: anne_shirley
          text: But saying only Marilla sounds dreadfully disrespectful.
        - id: ch01-b12
          speaker: marilla_cuthbert
          text: >-
            It won't be disrespectful if you speak respectfully. Everyone in Avonlea calls me Marilla, young and old. Only the minister says Miss Cuthbert, and even he forgets sometimes.
        - id: ch01-b13
          speaker: anne_shirley
          text: >-
            I'd so love to call you Aunt Marilla. I've never had an aunt, or any relative at all, not even a grandmother. It would make me feel that I truly belonged to you. Couldn't I please call you that?
        - id: ch01-b14
          speaker: marilla_cuthbert
          text: No. I'm not your aunt, and people shouldn't be called names that aren't theirs.
        - id: ch01-b15
          speaker: anne_shirley
          text: We could imagine you were my aunt.
        - id: ch01-b16
          speaker: marilla_cuthbert
          text: I couldn't.
        - id: ch01-b17
          speaker: anne_shirley
          text: Don't you ever imagine that things are different from the way they really are?
        - id: ch01-b18
          speaker: marilla_cuthbert
          text: No.
        - id: ch01-b19
          speaker: narrator
          text: Anne took a long breath.
        - id: ch01-b20
          speaker: anne_shirley
          text: Oh, Miss... Marilla, think how much you're missing!
        - id: ch01-b21
          speaker: marilla_cuthbert
          text: >-
            I don't believe in pretending things are different from what they truly are. When the Lord places us in certain circumstances, He doesn't mean for us to imagine them away. And that reminds me. Go into the sitting room and bring me the illustrated card from the mantel. Be sure your feet are clean, and don't let any flies in. The Lord's Prayer is printed on that card. You'll spend your spare time this afternoon learning it by heart. There will be no more praying like what I heard last night.
    - id: ch02
      title: Lost in a Picture
      blocks:
        - id: ch02-b01
          speaker: anne_shirley
          text: >-
            I suppose my prayer was very awkward, but I'd never practiced before. You couldn't truly expect someone to pray very well on her very first try, could you? After I went to bed, I made up a splendid prayer, just as I promised you I would. It was almost as long as a minister's prayer and very poetic. But would you believe it? When I woke this morning, I couldn't remember one word. I'm afraid I may never make another one as good. Somehow, things never seem quite as wonderful when you think them out a second time. Have you ever noticed that?
        - id: ch02-b02
          speaker: marilla_cuthbert
          text: >-
            Here's something for you to notice. When I tell you to do something, obey me right away. Don't stand there talking about it. Go and do as I asked.
        - id: ch02-b03
          speaker: narrator
          text: >-
            Anne hurried into the sitting room across the hall, but she did not come back. Marilla waited ten minutes. Then she put down her knitting and marched after her with a grim look. Anne stood perfectly still before a bright picture hanging between the two windows. Her eyes were full of dreams. Outside, the light filtered through green vines and white-flowered apple trees. It fell over the spellbound little figure until she seemed to glow with a strange radiance.
        - id: ch02-b04
          speaker: marilla_cuthbert
          text: Anne, what in the world are you thinking about?
        - id: ch02-b05
          speaker: narrator
          text: Anne started and returned to earth. She pointed at the picture, called Christ Blessing Little Children.
        - id: ch02-b06
          speaker: anne_shirley
          text: >-
            I was imagining I was one of those children. I was the girl in the blue dress, standing alone in the corner as if she belonged to no one, just like me. She looks lonely and sad, doesn't she? I don't think she had a father or mother of her own. She wanted a blessing too, so she crept shyly along the outside of the crowd. She hoped no one would notice her except Him. I know exactly how she felt. Her heart must have pounded, and her hands must have gone cold, the way mine did when I asked if I could stay. She was afraid He wouldn't notice her. But He probably did, don't you think? I imagined her moving a little closer, and then a little closer again, until at last she stood right beside Him. Then He looked at her and laid His hand on her hair. Oh, what a rush of joy must have gone through her! I only wish the artist hadn't made Him look so sorrowful. All His pictures look that way, if you've noticed. I don't believe He really could have looked so sad, because then the children would have been afraid of Him.
        - id: ch02-b07
          speaker: marilla_cuthbert
          text: >-
            Anne, you mustn't speak that way. It's irreverent. Positively irreverent.
        - id: ch02-b08
          speaker: narrator
          text: Anne stared in amazement.
        - id: ch02-b09
          speaker: anne_shirley
          text: But I felt completely reverent. I truly didn't mean anything disrespectful.
          emotion: surprised
        - id: ch02-b10
          speaker: marilla_cuthbert
          text: >-
            No, I suppose you didn't mean it. Still, it doesn't sound right to speak so familiarly about sacred things. And there is something else you must remember. When I send you for something, bring it straight back. Don't stand mooning and imagining in front of pictures. Now take the card to the kitchen. Sit in the corner and learn the prayer by heart.
    - id: ch03
      title: The Prayer and a Possible Friend
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            Anne stood the card against the pitcher of apple blossoms she had picked for the dinner table. Marilla had looked doubtful about those flowers, but had said nothing. With her chin in her hands, Anne studied the prayer in silence for several minutes.
        - id: ch03-b02
          speaker: anne_shirley
          text: >-
            I like this prayer. It's beautiful. I've heard it once before. The superintendent of the asylum Sunday school said it, but I didn't like it then. His voice cracked, and he prayed so mournfully that I was sure he thought prayer was a disagreeable duty. It isn't poetry, but it gives me exactly the same feeling poetry does. “Our Father who art in heaven, hallowed be Thy name.” That sounds just like a line of music. Oh, I'm so glad you thought of making me learn it, Miss... Marilla.
          emotion: happy
        - id: ch03-b03
          speaker: marilla_cuthbert
          text: Learn it, then, and stop talking.
        - id: ch03-b04
          speaker: narrator
          text: >-
            Anne leaned toward the apple blossoms and kissed one soft pink bud. Then she studied hard for another few minutes.
        - id: ch03-b05
          speaker: anne_shirley
          text: Marilla, do you think I'll ever have a bosom friend in Avonlea?
        - id: ch03-b06
          speaker: marilla_cuthbert
          text: A what kind of friend?
        - id: ch03-b07
          speaker: anne_shirley
          text: >-
            A bosom friend. Someone truly close, a kindred spirit I can trust with everything in my soul. I've dreamed about meeting her my whole life. I never believed it would happen, but now so many of my dearest dreams have suddenly come true. Maybe this one can too. Do you think it might?
        - id: ch03-b08
          speaker: marilla_cuthbert
          text: >-
            Diana Barry lives at Orchard Slope, and she's about your age. She's a very nice girl. Perhaps she can play with you when she comes home. Right now she's visiting her aunt in Carmody. Mind your behavior, though. Mrs. Barry is particular, and she won't allow Diana to play with a girl who isn't good and well behaved.
        - id: ch03-b09
          speaker: narrator
          text: Anne peered through the blossoms, her eyes shining with interest.
        - id: ch03-b10
          speaker: anne_shirley
          text: >-
            What does Diana look like? Her hair isn't red, is it? Oh, I hope it isn't. Having red hair myself is bad enough. I couldn't bear for my bosom friend to have it too.
        - id: ch03-b11
          speaker: marilla_cuthbert
          text: >-
            Diana is very pretty. She has black hair, black eyes, and rosy cheeks. She's also clever and good, which matters more than being pretty.
        - id: ch03-b12
          speaker: narrator
          text: >-
            Marilla was as fond of morals as the Duchess in Wonderland. She firmly believed that every remark made to a child who was being brought up ought to have a moral fastened to it. Anne let this particular moral pass right by. She saw only the delightful possibilities ahead.
        - id: ch03-b13
          speaker: anne_shirley
          text: >-
            I'm so glad she's pretty! Since I can never be beautiful myself, the next best thing would be a beautiful bosom friend.
    - id: ch04
      title: Katie Maurice and Violetta
      blocks:
        - id: ch04-b01
          speaker: anne_shirley
          text: >-
            When I lived with Mrs. Thomas, she had a bookcase with glass doors in the sitting room. There weren't any books inside. She kept her best china there, and her preserves whenever she had any preserves to keep. One glass door was broken. Mr. Thomas smashed it one night when he'd been drinking a little. But the other door was whole. I used to look into it and pretend my reflection was another little girl who lived behind the glass. I named her Katie Maurice, and we became very close. I could talk to her for hours, especially on Sundays, and tell her absolutely everything.
        - id: ch04-b02
          speaker: anne_shirley
          text: >-
            Katie was the comfort and consolation of my life. We imagined the bookcase was enchanted. If I could only discover the right spell, I could open the door and step straight into the room where Katie lived, instead of finding Mrs. Thomas's shelves of preserves and china. Katie would take my hand and lead me out into a marvelous land of flowers, sunshine, and fairies. We would live happily there forever. It broke my heart to leave her when I went to Mrs. Hammond's. It hurt Katie terribly too. I know it did, because she was crying when she kissed me goodbye through the glass door.
        - id: ch04-b03
          speaker: anne_shirley
          text: >-
            There was no bookcase at Mrs. Hammond's house. But a little way up the river, I found a long, narrow green valley. The loveliest echo lived there. It repeated every word I said, even if I didn't raise my voice at all. So I imagined the echo was a little girl named Violetta. We became great friends, and I loved her almost as much as Katie. Not quite as much, but almost. On the night before I went to the asylum, I said goodbye to Violetta. Oh, her goodbye came back to me in such sad, sad tones. I had grown so attached to her that I couldn't bring myself to imagine another bosom friend at the asylum, even if the place had offered any room for imagining.
        - id: ch04-b04
          speaker: marilla_cuthbert
          text: >-
            It's probably just as well there was no room for it. I don't approve of such carryings-on. You seem to half believe the things you imagine. It will be good for you to have a real, living friend who can drive such nonsense out of your head. But don't let Mrs. Barry hear you talking about Katie Maurice and Violetta. She may think you tell made-up stories as if they were true.
        - id: ch04-b05
          speaker: anne_shirley
          text: >-
            Oh, I won't. I couldn't tell everyone about them. Their memories are much too sacred. I wanted you to know, though. Oh, look! A big bee just fell out of an apple blossom. Imagine living inside an apple blossom and falling asleep while the wind rocked you. If I weren't a human girl, I'd like to be a bee and live among flowers.
        - id: ch04-b06
          speaker: marilla_cuthbert
          text: >-
            Yesterday you wanted to be a seagull. You certainly change your mind quickly. I told you to learn the prayer, not talk. But you can't seem to stop when anyone is listening. Go upstairs and learn it in your room.
        - id: ch04-b07
          speaker: anne_shirley
          text: I nearly know it already. There's only the last line left.
        - id: ch04-b08
          speaker: marilla_cuthbert
          text: >-
            That doesn't matter. Do as you're told. Go finish learning it properly, and stay upstairs until I call you to help with tea.
        - id: ch04-b09
          speaker: anne_shirley
          text: May I take the apple blossoms to keep me company?
        - id: ch04-b10
          speaker: marilla_cuthbert
          text: >-
            No. You don't need your room cluttered with flowers. You should have left those blossoms on the tree in the first place.
        - id: ch04-b11
          speaker: anne_shirley
          text: >-
            I wondered about that too. Picking them shortens their lovely lives, and I wouldn't want to be picked if I were a blossom. But the temptation was irresistible. What do you do when you meet an irresistible temptation?
        - id: ch04-b12
          speaker: marilla_cuthbert
          text: Anne, did you hear me tell you to go upstairs?
        - id: ch04-b13
          speaker: narrator
          text: Anne sighed and withdrew to the east gable. She sat down beside the window.
    - id: ch05
      title: Anne of Green Gables
      blocks:
        - id: ch05-b01
          speaker: anne_shirley
          text: >-
            There, I know the prayer. I learned the last sentence on the stairs. Now I'll imagine things into this room, and they'll stay imagined forever. The floor has a white velvet carpet covered in pink roses. Pink silk curtains hang at the windows. Gold and silver brocade covers the walls. All the furniture is mahogany. I've never seen mahogany, but it sounds so luxurious.
        - id: ch05-b02
          speaker: anne_shirley
          text: >-
            This chair is really a couch piled high with gorgeous silk cushions, pink and blue and crimson and gold. I'm lying on it gracefully. I can see myself in a splendid great mirror on the wall. I am tall and regal, and I wear a long gown of white lace. There is a pearl cross on my breast and there are pearls in my hair. My hair is as dark as midnight, and my skin has a clear ivory paleness. My name is Lady Cordelia Fitzgerald. No, it isn't. I can't make that feel real.
        - id: ch05-b03
          speaker: narrator
          text: >-
            Anne danced over to the little mirror. Her pointed, freckled face and solemn gray eyes looked back.
        - id: ch05-b04
          speaker: anne_shirley
          text: >-
            You're only Anne of Green Gables. I always see you exactly as you are whenever I try to become Lady Cordelia. But being Anne of Green Gables is a million times better than being Anne of nowhere in particular, isn't it?
          emotion: happy
        - id: ch05-b05
          speaker: narrator
          text: >-
            She leaned forward and kissed her reflection. Then she went to the open window.
        - id: ch05-b06
          speaker: anne_shirley
          text: >-
            Good afternoon, dear Snow Queen. Good afternoon, dear birch trees in the hollow. And good afternoon, dear gray house on the hill. I wonder whether Diana will become my bosom friend. I hope she will. I'll love her very much. But I must never forget Katie Maurice and Violetta. They'd be hurt if I did, and I never want to hurt anyone's feelings, not even a little bookcase girl or a little echo girl. I'll remember them and send them a kiss every day.
        - id: ch05-b07
          speaker: narrator
          text: >-
            Anne blew two light kisses from her fingertips, out past the cherry blossoms. Then she rested her chin in her hands and drifted away on a luxurious sea of daydreams.
