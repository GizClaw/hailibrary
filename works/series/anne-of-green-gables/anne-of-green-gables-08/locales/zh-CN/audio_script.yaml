audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖从容，带着细腻而机智的讲述感
        timbre: 清澈柔和
        pace: 舒缓而有变化
        pitch: 中音
    anne:
      display_name: 安妮
      tts:
        delivery: 热切灵动，想法接连涌出，真挚而富于想象
        timbre: 清亮稚嫩
        pace: 明快，动情处自然放慢
        pitch: 中高音
    marilla:
      display_name: 玛丽拉
      tts:
        delivery: 干脆严谨，言语直截了当，偶尔透出克制的温情
        timbre: 清晰沉稳
        pace: 中等
        pitch: 中音
  chapters:
    - id: ch01
      title: 第八章　安妮的教养开始了
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 玛丽拉自有她的道理。直到第二天下午，她才打算告诉安妮，安妮可以留在绿山墙。整个上午，她不断给孩子安排活儿，还用锐利的目光盯着她做。到了中午，玛丽拉已经看明白了。安妮聪明听话，肯干，也学得快。她最严重的毛病，是做事做到一半，常常一头掉进白日梦，忘得干干净净。非要挨上一顿严厉的训，或是闯出祸来，她才会猛然跌回现实。
        - id: ch01-b02
          speaker: narrator
          text: 午餐后的碗碟一洗完，安妮忽然转身站到玛丽拉面前。看她的神情，仿佛已经下了狠心，今天无论如何也要知道最坏的结果。她瘦小的身子从头抖到脚，脸涨得通红，眼睛睁得那么大，几乎成了黑色。她紧紧绞住双手，声音里满是哀求。
        - id: ch01-b03
          speaker: anne
          text: 求求您了，卡斯伯特小姐，您到底要不要把我送走？整个上午我一直忍着，可再不知道答案，我真的受不了了。这滋味太可怕。请您告诉我吧。
          emotion: fearful
        - id: ch01-b04
          speaker: marilla
          text: 我让你用干净的热水烫洗碗布，你还没做。先去把碗布烫好，再来问别的问题。
        - id: ch01-b05
          speaker: narrator
          text: 安妮只好去收拾洗碗布。做完以后，她又回到玛丽拉跟前，恳求的眼睛一刻也不离开玛丽拉的脸。到了这一步，玛丽拉再也找不到借口继续拖延解释了。
        - id: ch01-b06
          speaker: marilla
          text: 好吧，也该告诉你了。马修和我决定把你留下。当然，你得努力做个好孩子，也要懂得感恩。哎呀，孩子，你这是怎么了？
        - id: ch01-b07
          speaker: anne
          text: 我在哭，可我也不知道为什么，真是奇怪。我已经高兴得不能再高兴了。不，“高兴”这个词根本不对。看见白色喜悦之路和樱花时，我是高兴。可这件事比高兴还要多得多。我太幸福了！我一定努力做个特别好的孩子。我想这会很难，托马斯太太总说我坏得无可救药。不过，我会尽最大的努力。可您知道我为什么会哭吗？
          emotion: happy
        - id: ch01-b08
          speaker: marilla
          text: 大概是你太激动，整个人都乱了。坐到椅子上，先平静下来。你实在太容易哭，也太容易笑。不错，你可以留下，我们会尽力把你教养好。你还必须去上学。不过两个星期以后就放假了，现在入学没什么必要，等九月重新开学再去。
        - id: ch01-b09
          speaker: anne
          text: 那我该怎么称呼您？总叫卡斯伯特小姐吗？我能不能叫您玛丽拉姨妈？
        - id: ch01-b10
          speaker: marilla
          text: 不能，就叫玛丽拉。我不习惯别人叫我卡斯伯特小姐，听见了会浑身不自在。
        - id: ch01-b11
          speaker: anne
          text: 可是只叫玛丽拉，听起来太不尊敬了。
        - id: ch01-b12
          speaker: marilla
          text: 只要你的口气尊敬，就没什么不尊敬的。埃文利不论老少，人人都叫我玛丽拉。只有牧师叫我卡斯伯特小姐，还得等他想起来才叫。
        - id: ch01-b13
          speaker: anne
          text: 我真想叫您玛丽拉姨妈。我从来没有过姨妈，也没有任何亲人，连祖母都没有。这样叫，我就会觉得自己真的属于您。就让我叫您玛丽拉姨妈，好不好？
        - id: ch01-b14
          speaker: marilla
          text: 不行。我不是你的姨妈，也不赞成用不属于一个人的称呼去叫她。
        - id: ch01-b15
          speaker: anne
          text: 那我们可以想象您是我的姨妈呀。
        - id: ch01-b16
          speaker: marilla
          text: 我想象不来。
        - id: ch01-b17
          speaker: anne
          text: 您从来不把事情想成和现实不一样的样子吗？
        - id: ch01-b18
          speaker: marilla
          text: 从来不。
        - id: ch01-b19
          speaker: narrator
          text: 安妮睁大了眼睛，长长吸了一口气。
        - id: ch01-b20
          speaker: anne
          text: 哦，卡斯……玛丽拉，您错过了多少东西呀！
          emotion: surprised
        - id: ch01-b21
          speaker: marilla
          text: 我不赞成把事情想成和现实不同的样子。上帝让我们处在什么境遇里，就不是让我们靠想象逃开的。说到这个，我想起一件事。你去起居室，先把脚弄干净，别放苍蝇进来。壁炉台上有张带图画的卡片，把它拿来。上面写着《主祷文》。今天下午有空，你就把它背熟。昨晚那样的祷告，以后不许再做。
        - id: ch01-b22
          speaker: anne
          text: 昨晚我一定做得很笨拙，可我从来没有练习过呀。一个人第一次祷告，总不能一下就做得很好，对不对？昨晚我上床以后，照答应您的那样，想出了一篇了不起的祷告。它差不多和牧师的祷告一样长，又特别有诗意。可今天早上一醒，我连一个字也记不得了。恐怕我再也想不出那么好的一篇。一件事第二次想出来，总不如第一次好。您有没有发现过？
        - id: ch01-b23
          speaker: marilla
          text: 倒有一件事该让你发现。我叫你做什么，就要你立刻照办。别一动不动站在那里，没完没了地讲。现在去，照我说的做。
        - id: ch01-b24
          speaker: narrator
          text: 安妮马上去了过道那边的起居室，可她一去就没了踪影。十分钟过去，玛丽拉放下手里的针织活，沉着脸大步找了过去。安妮正站在两扇窗子中间的画前，一动也不动，眼里闪着梦幻的光。屋外有苹果树，也有层层叠叠的藤蔓。阳光从枝叶间滤进来，白一片，绿一片，落在那个看得出神的小小身影上，仿佛带着几分不属于人间的光。
        - id: ch01-b25
          speaker: marilla
          text: 安妮，你到底在想什么？
        - id: ch01-b26
          speaker: narrator
          text: 安妮吓了一跳，这才从梦里醒来。她指向那幅色彩鲜艳的画。画名叫《基督为小孩子祝福》。
        - id: ch01-b27
          speaker: anne
          text: 我在想这幅画。我刚才想象自己也是那些孩子中的一个，就是角落里穿蓝裙子的小姑娘。她独自站在一边，好像不属于任何人，和我一样。您看，她是不是又孤单又难过？我猜她也没有自己的爸爸妈妈。可她也想得到祝福，所以就羞怯地从人群外面靠近，只盼谁也别注意她，除了他。
        - id: ch01-b28
          speaker: anne
          text: 我完全知道她是什么感受。她的心一定跳得很快，双手也一定冰凉，就像我问您能不能留下时那样。她害怕他没看见自己。可他多半看见了，您说呢？我一直在想后来的事。她一点点挪近，最后来到他身边。他会看着她，把手放在她头发上。哦，那时该有多么强烈的喜悦流过她全身！
        - id: ch01-b29
          speaker: anne
          text: 不过，我真希望画家没有把他画得这么忧伤。您要是留意过，就知道他的画像都是这样。可我不相信他本人真会那么悲伤，不然孩子们一定会怕他。
        - id: ch01-b30
          speaker: marilla
          text: 安妮，你不能这样谈论这些事。这是不敬，实在太不敬了。
        - id: ch01-b31
          speaker: narrator
          text: 玛丽拉说完，心里还在纳闷，安妮讲了这么长一大篇，自己怎么直到现在才出声打断。安妮却惊奇得睁圆了眼睛，完全不明白错在哪里。
        - id: ch01-b32
          speaker: anne
          text: 怎么会呢？我心里明明尊敬得不得了。我绝对没有不敬的意思。
          emotion: surprised
        - id: ch01-b33
          speaker: marilla
          text: 我想你不是故意的，可把这些事说得这么随便，听着总不合适。还有，我让你拿东西，你就得马上拿来，不许对着画发呆，想东想西。记住。拿好卡片，立刻回厨房。现在坐到角落里，把祷文背下来。
        - id: ch01-b34
          speaker: narrator
          text: 安妮把卡片支在一只水罐旁。罐子里插满苹果花，是她特意摘来装饰午餐桌的。玛丽拉一直不大赞成这份装饰，却只斜眼瞧过几回，什么也没说。安妮双手托着下巴，专心看起卡片。好几分钟里，她竟然一直没出声。
        - id: ch01-b35
          speaker: anne
          text: 我喜欢这篇祷文，真美。以前我听过一次，是孤儿院主日学校的校长念的。可那时我不喜欢。他的嗓子又尖又哑，祷告时还那么悲伤，害我以为他觉得祷告是一件讨厌的差事。这不是诗，却让我有和读诗一样的感觉。“我们在天上的父，愿人都尊你的名为圣。”听着就像一句乐曲。哦，我真高兴您想到让我学这个，卡斯……玛丽拉。
          emotion: happy
        - id: ch01-b36
          speaker: marilla
          text: 那就好好学，别再说话。
        - id: ch01-b37
          speaker: narrator
          text: 安妮把装苹果花的瓶子轻轻斜过来，在一只粉红杯盏似的花苞上吻了一下，又认真学了一阵。
        - id: ch01-b38
          speaker: anne
          text: 玛丽拉，您觉得我在埃文利会有一个知心朋友吗？
        - id: ch01-b39
          speaker: marilla
          text: 一……一个什么朋友？
        - id: ch01-b40
          speaker: anne
          text: 知心朋友，就是非常亲密的朋友。她会和我心灵相通，我能把灵魂最深处的一切都告诉她。我一辈子都梦想遇见这样的人。以前我从没当真，可现在，我那么多最美好的梦一下都成真了，也许这个梦也会成真。您觉得可能吗？
        - id: ch01-b41
          speaker: marilla
          text: 果园坡那边住着黛安娜·巴里，年纪和你差不多。她是个很不错的小姑娘。等她回来，也许可以陪你玩。她现在去卡莫迪的姨妈家做客了。不过，你得留意自己的举止。巴里太太非常挑剔。不是又乖又好的小姑娘，她不会让黛安娜跟人家一起玩。
        - id: ch01-b42
          speaker: narrator
          text: 安妮隔着苹果花望着玛丽拉，眼睛里顿时亮起兴奋的光。
        - id: ch01-b43
          speaker: anne
          text: 黛安娜长什么样？她不是红头发吧？哦，但愿不是。我自己有一头红发已经够糟了，要是知心朋友也是红头发，我可绝对受不了。
        - id: ch01-b44
          speaker: marilla
          text: 黛安娜很漂亮。她有黑眼睛、黑头发，还有红润的脸蛋。她也很乖，很聪明，这比漂亮更要紧。
        - id: ch01-b45
          speaker: narrator
          text: 玛丽拉和《爱丽丝漫游奇境》里的公爵夫人一样爱讲道理。她坚信，对一个正在受教养的孩子说话，每一句后面都该钉上一条训诫。可安妮随手就把训诫拨到了一边。她只抓住了前面那个叫人欢喜的可能。
        - id: ch01-b46
          speaker: anne
          text: 她漂亮，我真是太高兴了。自己能长得漂亮当然最好，可这在我身上不可能。那接下来最好的事，就是有一个漂亮的知心朋友。
        - id: ch01-b47
          speaker: anne
          text: 我住在托马斯太太家时，她的起居室里有一只带玻璃门的书柜。里面一本书也没有，放的是她最好的瓷器，还有果酱，当然，要那时候有果酱可放才行。一扇门坏了，是托马斯先生有一晚喝得有点醉，亲手砸坏的。另一扇却是好的。我常把玻璃里的影子想成住在里面的小姑娘。我叫她凯蒂·莫里斯，我们亲密极了。
        - id: ch01-b48
          speaker: anne
          text: 我能和她说上好几个钟头，星期天尤其如此，什么都会告诉她。凯蒂就是我一生的安慰。我们还假装书柜中了魔法。只要我知道那句咒语，就能打开柜门，走进凯蒂住的房间，而不是一头撞进摆着瓷器和果酱的架子里。凯蒂会牵着我的手，带我去一个奇妙的地方。那里到处是鲜花、阳光和仙子，我们会永远幸福地住下去。
        - id: ch01-b49
          speaker: anne
          text: 后来我要搬去哈蒙德太太家，离开凯蒂让我心都碎了。她也难过极了，我知道，因为她隔着书柜门吻我道别时，分明在哭。哈蒙德太太家没有书柜。不过，从她家沿河往上走一点，有一道狭长的绿色山谷。世上最可爱的回声就住在那里。哪怕你说得很轻，它也会把每个字送回来。
        - id: ch01-b50
          speaker: anne
          text: 我便想象那回声是一个叫维奥莱塔的小姑娘。我们成了很好的朋友。我爱她几乎和爱凯蒂一样多，还差一点点，真的只差一点点。去孤儿院的前一晚，我向维奥莱塔告别。哦，她送回来的那声告别，听着那么悲伤，那么悲伤。我实在舍不得她。后来到了孤儿院，就算那里还有地方容得下想象，我也不忍心再想出一个知心朋友了。
          emotion: sad
        - id: ch01-b51
          speaker: marilla
          text: 依我看，没有倒正好。我不赞成这些古怪的事。你简直连自己想象出来的东西都信了一半。最好让你交一个活生生的朋友，把这些胡思乱想赶出脑袋。不过，别让巴里太太听见你说什么凯蒂·莫里斯和维奥莱塔，不然她会当你在撒谎。
        - id: ch01-b52
          speaker: anne
          text: 我不会告诉她的。她们的回忆太神圣了，我不能对谁都说。不过，我想让您知道她们。哦，您看，一只大蜜蜂刚从苹果花里滚出来！住在苹果花里该多美呀。风摇着花朵的时候，就睡在里面。如果我不是人类的小姑娘，我愿意做一只蜜蜂，住在花丛里。
        - id: ch01-b53
          speaker: marilla
          text: 昨天你还想做海鸥呢。我看你真是三心二意。我叫你背祷文，不是让你说个不停。只要有人肯听，你就闭不上嘴。上楼回房间去，在那里学。
        - id: ch01-b54
          speaker: anne
          text: 可我已经差不多全会了，只剩最后一句。
        - id: ch01-b55
          speaker: marilla
          text: 那也一样。照我说的做。回房间把它好好学完，等我叫你下来帮忙准备茶点，你才能出来。
        - id: ch01-b56
          speaker: anne
          text: 我能把苹果花带去陪我吗？
        - id: ch01-b57
          speaker: marilla
          text: 不能。别拿花把房间弄得乱七八糟。你一开始就该让它们留在树上。
        - id: ch01-b58
          speaker: anne
          text: 我当时也有一点这么想。我觉得不该摘下它们，害它们美丽的生命变短。如果我是一朵苹果花，也不愿被人摘走。可那个诱惑实在无法抗拒。您遇到无法抗拒的诱惑时，会怎么办？
        - id: ch01-b59
          speaker: marilla
          text: 安妮，你听见我叫你回房间了吗？
        - id: ch01-b60
          speaker: narrator
          text: 安妮叹了口气，退回东山墙的房间，在窗边坐下。
        - id: ch01-b61
          speaker: anne
          text: 好了，祷文我已经会了。刚才上楼时，我把最后一句也背下来了。现在，我要把各种东西想象进这间屋子，让它们永远留在这里。地上铺着白天鹅绒地毯，上面开满粉红玫瑰。窗前挂着粉红丝绸窗帘，墙上垂着金银锦缎帷幔，家具全是桃花心木的。我从没见过桃花心木，可这个名字听起来真华贵。
        - id: ch01-b62
          speaker: anne
          text: 这里有一张长沙发，堆满绚丽的丝绸靠垫，有粉红的、蓝的、深红的，还有金色的。我正优雅地斜倚在上面。墙上挂着一面华丽的大镜子，我能看见自己。我身材高挑，有王后般的威仪，穿着曳地的白蕾丝长裙。胸前戴着珍珠十字架，头发里也缀满珍珠。我的头发像午夜那么黑，皮肤是清澈的象牙白。我的名字是科迪莉亚·菲茨杰拉德小姐。不，不是。我没法把这件事想得像真的。
        - id: ch01-b63
          speaker: narrator
          text: 她轻快地跑到那面小镜子前，凑近了仔细端详。镜子里，一张尖尖的雀斑脸和一双严肃的灰眼睛，也正一眨不眨地看着她。
        - id: ch01-b64
          speaker: anne
          text: 你只是绿山墙的安妮。每次我想象自己是科迪莉亚小姐，看见的总还是你，就是现在这个样子。不过，做绿山墙的安妮，可比做一个不知属于哪里的安妮好上一百万倍，对不对？
          emotion: happy
        - id: ch01-b65
          speaker: narrator
          text: 安妮俯下身，亲昵地吻了吻镜中的自己，又走到敞开的窗前。
        - id: ch01-b66
          speaker: anne
          text: 亲爱的白雪皇后，下午好。亲爱的山谷里的白桦树，也祝你们下午好。还有山顶上那座亲爱的灰房子，下午好。我不知道黛安娜会不会成为我的知心朋友。我希望会，我也会非常爱她。
        - id: ch01-b67
          speaker: anne
          text: 可我绝不能彻底忘记凯蒂·莫里斯和维奥莱塔。我要是忘了，她们会多伤心呀。我不愿伤害任何人的感情，哪怕是书柜里的小姑娘，或是回声里的小姑娘。我一定记着她们，每天都送给她们一个吻。
        - id: ch01-b68
          speaker: narrator
          text: 安妮从指尖吹出两个轻飘飘的吻。它们越过窗前的樱花，飞向远处。接着，她双手托着下巴，惬意地漂进了一片白日梦的海洋。
