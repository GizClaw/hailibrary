audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm, observant, and gently amused
        timbre: clear and rounded
        pace: measured
        pitch: medium
    anne_shirley:
      display_name: Anne Shirley
      tts:
        delivery: vivid, earnest, and eagerly imaginative
        timbre: clear and youthful
        pace: lively
        pitch: medium-high
    marilla_cuthbert:
      display_name: Marilla Cuthbert
      tts:
        delivery: firm, practical, and restrained
        timbre: clear and mature
        pace: steady
        pitch: medium-low
    diana_barry:
      display_name: Diana Barry
      tts:
        delivery: friendly, sensible, and warmly expressive
        timbre: bright and youthful
        pace: natural
        pitch: medium-high
  chapters:
    - id: ch01
      title: Ten Minutes for an Eternal Farewell
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: "The next afternoon, Anne sat sewing patchwork by the kitchen window. She happened to look outside and saw Diana down by the Dryad's Bubble, motioning to her in secret. Anne was out the door in an instant. She flew down to the hollow with surprise and hope shining in her eyes. Then she saw Diana's miserable face, and the hope disappeared."
        - id: ch01-b02
          speaker: anne_shirley
          text: "Your mother hasn't changed her mind?"
          emotion: sad
        - id: ch01-b03
          speaker: narrator
          text: "Diana sadly shook her head."
        - id: ch01-b04
          speaker: diana_barry
          text: "No. Oh, Anne, she says I can never play with you again. I cried and cried. I told her none of it was your fault, but she wouldn't listen. It took forever to persuade her to let me come say good-bye. She gave me ten minutes, and she's watching the clock."
          emotion: sad
        - id: ch01-b05
          speaker: anne_shirley
          text: "Ten minutes is hardly enough for an eternal farewell. Diana, promise me faithfully that you'll never forget the friend of your youth, even when dearer friends are holding you close."
          emotion: sad
        - id: ch01-b06
          speaker: diana_barry
          text: "I promise. I'll never have another bosom friend. I don't want one. I could never love anyone the way I love you."
          emotion: sad
        - id: ch01-b07
          speaker: narrator
          text: "Anne clasped her hands."
        - id: ch01-b08
          speaker: anne_shirley
          text: "Oh, Diana, do you really love me?"
          emotion: surprised
        - id: ch01-b09
          speaker: diana_barry
          text: "Of course I do. Didn't you know?"
        - id: ch01-b10
          speaker: narrator
          text: "Anne took a long breath."
        - id: ch01-b11
          speaker: anne_shirley
          text: "No. I knew you liked me, but I never dreamed you loved me. I didn't think anyone could. Nobody has loved me for as long as I can remember. Oh, this is wonderful! That light will shine forever on the dark path where I have to walk without you. Please, Diana, say it one more time."
        - id: ch01-b12
          speaker: diana_barry
          text: "I love you devotedly, Anne. I always will. You can be certain of that."
        - id: ch01-b13
          speaker: narrator
          text: "Diana spoke firmly. Anne held out her hand with great solemnity."
        - id: ch01-b14
          speaker: anne_shirley
          text: "And I shall always love thee, Diana. In the years ahead, your memory will shine like a star above my lonely life, just as it did in that last story we read. Will you give me one lock of your jet-black hair? I shall treasure it forever."
        - id: ch01-b15
          speaker: narrator
          text: "Anne's touching words made Diana's tears flow again, but Diana wiped them away and returned to practical matters."
        - id: ch01-b16
          speaker: diana_barry
          text: "Do you have anything to cut it with?"
        - id: ch01-b17
          speaker: anne_shirley
          text: "Yes. Luckily, my patchwork scissors are in my apron pocket."
        - id: ch01-b18
          speaker: narrator
          text: "Anne solemnly snipped off one of Diana's curls."
        - id: ch01-b19
          speaker: anne_shirley
          text: "Fare thee well, my beloved friend. From now on, we must live side by side as strangers. But my heart will always remain faithful to thee."
          emotion: sad
        - id: ch01-b20
          speaker: narrator
          text: "Anne watched until Diana was out of sight. Whenever Diana turned back, Anne raised one hand in a sorrowful farewell. Then Anne went home. For the moment, that beautifully romantic parting had comforted her more than a little."
        - id: ch01-b21
          speaker: anne_shirley
          text: "It's all over, Marilla. I'll never have another friend. I'm worse off than I was before, because I don't even have Katie Maurice or Violetta now. Even if I did, it wouldn't be the same. Little dream girls aren't enough once you've had a real friend."
          emotion: sad
        - id: ch01-b22
          speaker: anne_shirley
          text: "Diana and I had the most moving farewell down by the spring. The memory will always be sacred to me. I used the saddest words I could think of, and I said 'thou' and 'thee.' Those words are so much more romantic than 'you.'"
        - id: ch01-b23
          speaker: anne_shirley
          text: "Diana gave me a lock of her hair. I'll sew it into a little bag and wear it around my neck for the rest of my life. Please make sure it's buried with me, because I don't believe I'll live very long. When Mrs. Barry sees me lying there cold and dead, perhaps she'll regret what she's done and allow Diana to attend my funeral."
        - id: ch01-b24
          speaker: marilla_cuthbert
          text: "As long as you can talk this much, I don't think grief is likely to kill you."
    - id: ch02
      title: Back to School
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: "The following Monday, Anne surprised Marilla. She came downstairs with her book basket tucked between her arm and her hip, and her lips pressed into a determined line."
        - id: ch02-b02
          speaker: anne_shirley
          text: "I'm going back to school. It's all I have left in life now that my friend has been cruelly torn away. At school, I can at least look at her and think about the days we've lost."
        - id: ch02-b03
          speaker: marilla_cuthbert
          text: "You'd do better to think about your lessons and arithmetic."
        - id: ch02-b04
          speaker: narrator
          text: "Marilla hid how pleased she was with this change."
        - id: ch02-b05
          speaker: marilla_cuthbert
          text: "If you're returning to school, I don't want to hear about any more slates broken over people's heads or any other foolishness. Behave yourself and do exactly what your teacher says."
        - id: ch02-b06
          speaker: anne_shirley
          text: "I'll try to be a model pupil. I don't expect it will be much fun. Mr. Phillips calls Minnie Andrews a model pupil, and she hasn't one spark of imagination or life. She's dull and slow and never seems to enjoy anything. Still, I'm so depressed now that being like her may come easily."
        - id: ch02-b07
          speaker: anne_shirley
          text: "I'm taking the road. I couldn't walk the Birch Path all by myself. If I did, I would cry the bitterest tears."
          emotion: sad
        - id: ch02-b08
          speaker: narrator
          text: "Everyone welcomed Anne back with open arms. The other children had missed her imagination in their games. They had missed her voice when they sang and her dramatic way of reading books aloud at dinner hour."
        - id: ch02-b09
          speaker: narrator
          text: "During Testament reading, Ruby Gillis secretly passed her three blue plums. Ella May MacPherson gave her a huge yellow pansy cut from a flower catalog. Decorations like that were highly prized on the desks at Avonlea school. Sophia Sloane offered to teach Anne an elegant new knitted-lace pattern that was perfect for trimming aprons. Katie Boulter gave her a perfume bottle to hold the water for her slate."
        - id: ch02-b10
          speaker: narrator
          text: "Julia Bell carefully copied a verse for Anne onto pale pink paper with scalloped edges. The verse said that when twilight lowered its curtain and pinned it with a star, Anne should remember she had a friend, no matter how far that friend might wander."
        - id: ch02-b11
          speaker: anne_shirley
          text: "It's so lovely to be appreciated."
          emotion: happy
        - id: ch02-b12
          speaker: narrator
          text: "Anne gave Marilla a blissful sigh when she told her about it that night."
    - id: ch03
      title: Gifts and Secret Notes
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: "The girls weren't the only students who showed their appreciation. After dinner hour, Anne returned to the seat Mr. Phillips had assigned her beside the model pupil, Minnie Andrews. A large, juicy strawberry apple was waiting on her desk. Anne picked it up and was just about to bite into it. Then she remembered something. The only strawberry apples in Avonlea grew in the old Blythe orchard, across the Lake of Shining Waters."
        - id: ch03-b02
          speaker: narrator
          text: "She dropped the apple as though it were burning hot. Then she made a great show of wiping her fingers on her handkerchief. The apple stayed untouched on her desk until the next morning. Little Timothy Andrews swept the school and lit its fire, and he claimed the apple as one of the small rewards of the job."
        - id: ch03-b03
          speaker: narrator
          text: "Charlie Sloane sent Anne a slate pencil after dinner hour too. It was splendidly wrapped in striped red and yellow paper, and it had cost two cents instead of the usual one. This gift received a kinder welcome. Anne graciously accepted it and gave Charlie a smile. That smile carried the lovestruck boy straight to the seventh heaven. He made so many terrible mistakes in dictation that Mr. Phillips kept him after school to write the work over."
        - id: ch03-b04
          speaker: narrator
          text: "Still, Anne's little triumph was spoiled. Diana Barry sat beside Gertie Pye and gave her no gift, no sign of friendship, not even a smile. Diana's silence made Anne notice her more than all the other children's attention."
        - id: ch03-b05
          speaker: anne_shirley
          text: "I think Diana might have smiled at me just once."
          emotion: sad
        - id: ch03-b06
          speaker: narrator
          text: "Anne mourned over it to Marilla that night. But the following morning, someone passed Anne a small package and a note folded into the most astonishing twists."
        - id: ch03-b07
          speaker: diana_barry
          text: "Dear Anne, Mother says I mustn't play with you or even talk to you at school. It isn't my fault, so please don't be angry with me. I love you every bit as much as I did before. I miss you terribly, because I have no one to tell all my secrets to, and I don't like Gertie Pye at all."
          emotion: sad
        - id: ch03-b08
          speaker: diana_barry
          text: "I made you one of the new bookmarks from red tissue paper. They're very fashionable now, and only three girls at school know how to make them. Whenever you look at it, remember your true friend, Diana Barry."
        - id: ch03-b09
          speaker: narrator
          text: "Anne read the note and kissed the bookmark. She immediately sent her answer across to the other side of the school."
        - id: ch03-b10
          speaker: anne_shirley
          text: "My own darling Diana, of course I'm not angry because you have to obey your mother. Our spirits can still talk together. I shall treasure your beautiful gift forever. Minnie Andrews is a very nice little girl, even though she has no imagination. But once I have been Diana's bosom friend, I cannot become Minnie's."
        - id: ch03-b11
          speaker: anne_shirley
          text: "Please forgive the mistakes. My spelling isn't very good yet, though it has improved a great deal. Yours until death parts us, Anne or Cordelia Shirley. And here's a postscript. Tonight, I shall sleep with your letter beneath my pillow. A. or C. S."
        - id: ch03-b12
          speaker: narrator
          text: "Marilla expected trouble now that Anne was attending school again. Yet no trouble came. Perhaps some of Minnie's model-pupil spirit rubbed off on Anne. Whatever the reason, from then on she got along very well with Mr. Phillips."
    - id: ch04
      title: Anne and Gilbert Compete
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: "Anne threw her whole heart into her lessons. She was determined that Gilbert Blythe would not beat her in any subject. Before long, everyone could see the rivalry between them. Gilbert treated it as a friendly contest. Anne did not. She held a grudge with the same fierce strength that she gave to love."
        - id: ch04-b02
          speaker: narrator
          text: "She would never admit that she meant to compete with Gilbert. Admitting that would mean admitting he existed, and Anne stubbornly refused to do that. But the competition went on all the same, and first place passed back and forth between them."
        - id: ch04-b03
          speaker: narrator
          text: "One day Gilbert stood at the head of the spelling class. The next day Anne tossed her long red braids and spelled him down. One morning Gilbert finished every arithmetic problem correctly, and his name went onto the blackboard's honor roll. The following evening, Anne wrestled desperately with decimals so that she could take first place the next morning."
        - id: ch04-b04
          speaker: narrator
          text: "Then came one dreadful day when they tied. Their names appeared together on the board. To Anne, it felt nearly as bad as being spoken to directly. Her humiliation was plain to see, and so was Gilbert's pleasure."
        - id: ch04-b05
          speaker: narrator
          text: "At the end of every month, the school held written examinations. Waiting for those results was almost unbearable. In the first month, Gilbert finished three marks ahead. In the second, Anne beat him by five. But even that victory was spoiled for her. Gilbert warmly congratulated her in front of the whole school. Anne would have enjoyed winning much more if her defeat had hurt him."
    - id: ch05
      title: An Interesting World
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: "Mr. Phillips may not have been a very good teacher. Still, a student as firmly determined to learn as Anne was bound to make progress under almost any teacher. By the end of the term, both Anne and Gilbert moved up into the fifth class. They were allowed to begin the first lessons in what everyone called 'the branches.' That meant Latin, geometry, French, and algebra."
        - id: ch05-b02
          speaker: narrator
          text: "Then Anne met geometry, and geometry defeated her completely."
        - id: ch05-b03
          speaker: anne_shirley
          text: "It's perfectly dreadful, Marilla. I'm sure I'll never understand any part of it. Geometry leaves no room at all for imagination. Mr. Phillips says I'm the worst dunce he's ever taught in that subject. And Gil—I mean, some of the others—are so clever at it. It's terribly humiliating."
          emotion: sad
        - id: ch05-b04
          speaker: anne_shirley
          text: "Even Diana understands it better than I do, but I don't mind losing to Diana. We may have to meet like strangers now, but I still love her with an inextinguishable love. Sometimes, thinking about her makes me very sad."
          emotion: sad
        - id: ch05-b05
          speaker: anne_shirley
          text: "But truly, Marilla, no one can stay sad for very long when the world is such an interesting place, can they?"
