audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖机智，叙事细腻而自然
        timbre: 清澈柔和的成年女声
        pace: 从容，随情节轻快变化
        pitch: 中音
    anne:
      display_name: 安妮
      tts:
        delivery: 想象丰富，热烈真挚，情绪来得快而鲜明
        timbre: 清亮灵动的少女声
        pace: 偏快，动情时一气呵成
        pitch: 中高音
    diana:
      display_name: 戴安娜
      tts:
        delivery: 诚恳温柔，朴实中带着少女的羞怯
        timbre: 柔润甜美的少女声
        pace: 适中
        pitch: 中高音
    marilla:
      display_name: 玛丽拉
      tts:
        delivery: 务实克制，话语干脆，偶尔透出藏起的温情
        timbre: 稳重略低的成年女声
        pace: 稍慢而利落
        pitch: 中低音
  chapters:
    - id: ch01
      title: 第十七章　生活有了新寄托
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 第二天下午，安妮正在厨房窗边缝拼布。她无意间望出去，看见戴安娜站在树精的水泡旁，神神秘秘地朝她招手。安妮转眼就冲出屋子，飞奔到洼地里。她眼中又惊讶，又满怀希望。可是看到戴安娜垂头丧气的脸，那点希望立刻灭了。
        - id: ch01-b02
          speaker: anne
          text: 你母亲还是不肯回心转意？
        - id: ch01-b03
          speaker: narrator
          text: 安妮喘着气问。戴安娜伤心地摇了摇头。
        - id: ch01-b04
          speaker: diana
          text: 不肯。安妮，她说以后再也不准我跟你玩了。我一直哭，也告诉她这不是你的错，可怎么说都没用。我求了好久，她才准我下来跟你告别。她只让我待十分钟，还在家里看着钟计时呢。
          emotion: sad
        - id: ch01-b05
          speaker: anne
          text: 要作永远的告别，十分钟怎么够呢？戴安娜，你一定要答应我。将来无论有多么亲爱的朋友拥你入怀，都永远不要忘记我这个少年时代的朋友，好吗？
          emotion: sad
        - id: ch01-b06
          speaker: diana
          text: 我一定答应。我也永远不会再有别的知心朋友，我根本不想要。除了你，我不可能这样爱别人。
          emotion: sad
        - id: ch01-b07
          speaker: anne
          text: 戴安娜，你真的爱我吗？
          emotion: surprised
        - id: ch01-b08
          speaker: diana
          text: 当然是真的。你难道一直不知道？
        - id: ch01-b09
          speaker: narrator
          text: 安妮深深吸了一口气。
        - id: ch01-b10
          speaker: anne
          text: 我不知道。我当然觉得你喜欢我，可我从来不敢盼望你会爱我。我一直以为，这世上不会有人爱我。从我记事起，就没有人爱过我。可现在，这太美妙了！往后我走在与你分离的幽暗路上，这一线光会永远照着我。戴安娜，你再说一遍吧。
        - id: ch01-b11
          speaker: diana
          text: 安妮，我一心一意地爱你，以后也会永远爱你。你尽管相信我。
        - id: ch01-b12
          speaker: anne
          text: 我也会永远爱你，戴安娜。就像我们上回读的故事里写的，往后的岁月中，你的回忆会像一颗星，照耀我孤独的一生。临别以前，你愿不愿意剪下一绺乌黑的秀发给我，让我永远珍藏？
        - id: ch01-b13
          speaker: narrator
          text: 安妮庄严地伸出手。她那番话说得太动人，戴安娜刚擦掉的眼泪又流了下来。不过，戴安娜很快想到了最实际的问题。
        - id: ch01-b14
          speaker: diana
          text: 你有剪头发的东西吗？
        - id: ch01-b15
          speaker: anne
          text: 有。幸好拼布剪刀就在我的围裙口袋里。
        - id: ch01-b16
          speaker: narrator
          text: 安妮郑重地剪下戴安娜的一绺卷发。
        - id: ch01-b17
          speaker: anne
          text: 永别了，我挚爱的朋友。从今以后，我们住得这么近，却只能像陌生人一样。可是我的心永远忠于你。
          emotion: sad
        - id: ch01-b18
          speaker: narrator
          text: 安妮站在那里，一直望到戴安娜消失。戴安娜每次回头，她都悲伤地挥手。回到屋里时，这场浪漫的告别倒让她暂时得到了不少安慰。
        - id: ch01-b19
          speaker: anne
          text: 一切都结束了。我再也不会有朋友。现在连凯蒂·莫里斯和维奥莱塔也没有，我比从前还可怜。就算她们还在，也不能代替真正的朋友。戴安娜和我在泉边作了一场感人至深的告别，我会永远珍藏这段神圣的回忆。我用了最悲切的话，还特意换上古雅的称呼，那可比平常的说法浪漫多了。她送我一绺头发，我要缝进小袋子，一辈子挂在脖子上。等我死了，请您把它跟我一起埋葬。我觉得自己活不了多久。也许巴里太太看见我冰冷地躺在那里，会后悔自己做过的事，还会准许戴安娜参加我的葬礼。
          emotion: sad
        - id: ch01-b20
          speaker: marilla
          text: 安妮，只要你还能这样说个不停，我看你就不会悲伤而死。
        - id: ch01-b21
          speaker: narrator
          text: 到了下一个星期一，安妮挎着书篮走下楼，篮子抵在腰边，嘴唇抿成一条坚决的直线。玛丽拉看了很惊讶。
        - id: ch01-b22
          speaker: anne
          text: 我要回学校。朋友已经被无情地从我身边夺走，生活里只剩这件事可做了。到了学校，我还能远远望着她，回想那些已经过去的日子。
        - id: ch01-b23
          speaker: marilla
          text: 你还是多想想功课和算术吧。既然回学校，以后就别再拿石板砸别人的脑袋，也别闹出别的乱子。规矩一点，老师让你做什么就做什么。
        - id: ch01-b24
          speaker: narrator
          text: 玛丽拉嘴上这样说，心里却很高兴事情有了这个转机。
        - id: ch01-b25
          speaker: anne
          text: 我会尽量做个模范学生。不过那一定没多少乐趣。菲利普斯先生说米妮·安德鲁斯是模范学生，可她一点想象力和活气也没有，总是又乏味又迟钝，从来不会痛快地玩。好在我现在这么消沉，也许很容易就能变成她那样。我要绕大路去，绝不能独自走白桦小径。不然我一定会流下悲苦的眼泪。
        - id: ch01-b26
          speaker: narrator
          text: 安妮回到学校，大家都张开双臂般热烈欢迎她。游戏里少了她的想象力，唱歌时少了她的声音，就连午饭时间大声读书，也少不了她那股演戏般的本领。读《圣经》时，鲁比·吉利斯偷偷塞给她三颗蓝李子。埃拉·梅·麦克弗森送她一朵硕大的黄色三色堇，那是从花卉目录封面上剪下来的。在埃文利学校，这种书桌装饰可是宝贝。索菲娅·斯隆愿意教她一种漂亮的蕾丝新织法，最适合镶在围裙上。凯蒂·博尔特送她一只香水瓶，用来装擦石板的水。朱莉娅·贝尔还在淡粉色纸上工工整整地抄了一首诗，纸边剪成了扇贝花样。
        - id: ch01-b27
          speaker: narrator
          text: 诗上写着：“赠安妮。当暮色垂下帘幕，又用星星将它别住，请记得你有一位朋友，哪怕她已漂泊到远处。”
        - id: ch01-b28
          speaker: anne
          text: 受到大家的珍视，真是太美好了。
          emotion: happy
        - id: ch01-b29
          speaker: narrator
          text: 那天晚上，安妮陶醉地这样告诉玛丽拉。可珍视她的不只有女孩子。午饭后，她回到菲利普斯先生安排的新座位，准备跟那位模范学生米妮·安德鲁斯同桌，却发现桌上有一只又大又鲜美的草莓苹果。安妮一把拿起来，正准备咬上一口，突然记起整个埃文利只有一个地方长这种苹果，就是闪光之湖另一边的布莱思家老果园。
        - id: ch01-b30
          speaker: narrator
          text: 她马上把苹果扔下，像扔掉一块烧红的炭，还特意掏出手帕擦了擦碰过苹果的手指。苹果原封不动地在桌上躺了一整天。第二天早晨，替学校打扫和生火的小蒂莫西·安德鲁斯把它拿走，当成了自己的额外报酬。查理·斯隆午饭后托人送来的石笔却走运得多。那支笔花里胡哨地裹着红黄条纹纸，普通石笔只要一分钱，它却值两分。安妮大方地收下，还回赠查理一个微笑。那个痴心的少年欢喜得仿佛升上了第七重天，听写时错得一塌糊涂，放学后被菲利普斯先生留下重写。
        - id: ch01-b31
          speaker: narrator
          text: 然而有两句诗说，凯撒的盛大行列少了布鲁图斯的雕像，反倒更让人想起罗马最出色的儿郎。安妮的情形也一样。戴安娜跟格蒂·派伊坐在一起，没给她任何表示。这一处明摆着的空缺，让她小小的胜利也苦了起来。
        - id: ch01-b32
          speaker: anne
          text: 戴安娜至少可以对我笑一下呀。
          emotion: sad
        - id: ch01-b33
          speaker: narrator
          text: 安妮晚上向玛丽拉诉苦。可第二天早晨，一张折得又怪又复杂的便条和一个小包裹，从教室另一边传到了她手上。
        - id: ch01-b34
          speaker: diana
          text: 亲爱的安妮，妈妈说我不能跟你玩，在学校也不能跟你讲话。这不是我的错，你别生我的气。我还是跟从前一样爱你。我特别想念把所有秘密都告诉你的时候，也一点都不喜欢格蒂·派伊。我用红色薄纸给你做了一个新式书签。现在这种书签特别时髦，学校里只有三个女孩子会做。你看到它时，请记得你忠实的朋友，戴安娜·巴里。
        - id: ch01-b35
          speaker: narrator
          text: 安妮读完信，亲了亲书签，马上写了一封回信，又传回教室另一边。
        - id: ch01-b36
          speaker: anne
          text: 我最亲爱的戴安娜，你必须听母亲的话，我当然不会生气。我们的心灵依然可以相通。你这份可爱的礼物，我会永远珍藏。米妮·安德鲁斯是个很好的小姑娘，虽然她没有想象力。可是做过戴安娜的汁心朋友，我就不能再做米妮的了。写错字请你原谅，因为我的拼写还不太好，虽然已经大有近步。永远属于你，直到死亡将我们分开，安妮或科迪莉亚·雪莉。又及，今晚我要把你的信放在枕头底下睡觉。安，或，科，雪。
        - id: ch01-b37
          speaker: narrator
          text: 安妮重新上学，玛丽拉悲观地认定她又会闯祸，早已做好了应付麻烦的准备，可是什么事也没有发生。也许安妮从米妮·安德鲁斯那里沾了一点模范学生的精神。至少从那以后，她跟菲利普斯先生相处得很不错。安妮把全部心思都放在学习上，下定决心，任何一门功课都不能输给吉尔伯特·布莱思。两个人的竞争很快变得十分明显。
        - id: ch01-b38
          speaker: narrator
          text: 吉尔伯特一直只是善意地比试，安妮可不完全一样。她记仇时执拗得很，实在不值得夸奖。她有多热烈地爱，也会多强烈地恨。她绝不肯承认自己要跟吉尔伯特争功课，因为这就等于承认吉尔伯特确实存在，而她偏要把他当作空气。可是较量明明就在进行，第一名总在他们两人之间换来换去。
        - id: ch01-b39
          speaker: narrator
          text: 有时吉尔伯特站在拼写班最前面，有时安妮一甩长长的红辫子，就把他拼了下去。一天早晨，吉尔伯特把算术题全部做对，名字登上黑板的荣誉榜。第二天，安妮经过前一晚跟小数的拼命苦战，又抢走了第一。最可怕的一次，两个人竟然并列，名字肩并肩写在一起。那简直像公开刊登了一则引人注意的启事。安妮有多难堪，吉尔伯特就有多高兴。
        - id: ch01-b40
          speaker: narrator
          text: 每个月底笔试，等待成绩更叫人受不了。第一个月，吉尔伯特领先三分。第二个月，安妮反过来赢了五分。可吉尔伯特当着全校同学的面，真心诚意地向她道贺，害得这场胜利一点也不痛快。要是他也尝到了失败的刺痛，安妮会觉得甜美得多。
        - id: ch01-b41
          speaker: narrator
          text: 菲利普斯先生也许算不上一位好老师，可安妮这样铁了心要学习的学生，不管碰上哪一种老师都很难不取得进步。学期结束时，她和吉尔伯特一起顺利升入五班，可以开始接触所谓的各门学科了，也就是拉丁文、几何、法文和代数。可一碰到几何，安妮就遭遇了自己的滑铁卢。
        - id: ch01-b42
          speaker: anne
          text: 这东西真是可怕透了，玛丽拉。我肯定永远也弄不明白。几何一点都不给想象力留地方。菲利普斯先生说，我是他见过最不会学几何的笨蛋。吉……我是说，其他有些人却聪明极了。太叫人难堪了。
        - id: ch01-b43
          speaker: anne
          text: 连戴安娜都学得比我好。不过输给她，我一点也不在意。虽然我们现在见面只能当陌生人，我还是怀着永不熄灭的爱爱着她。想起她来，我有时会很伤心。可是，玛丽拉，在这么有趣的世界里，人总不能一直伤心下去，对不对？
