audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖机敏，带着含蓄的幽默讲述
        timbre: 清澈柔和
        pace: 舒展而富有变化
        pitch: medium
    anne:
      display_name: 安妮
      tts:
        delivery: 热烈敏感，想象丰富，情绪来得真切而迅速
        timbre: 明亮清脆的少女声
        pace: 偏快，激动时连贯奔涌
        pitch: medium-high
    matthew:
      display_name: 马修
      tts:
        delivery: 腼腆迟缓，真挚的感情藏在朴素话语里
        timbre: 温厚略显沙哑的老年男声
        pace: 缓慢，常有思量后的停顿
        pitch: low
    marilla:
      display_name: 玛丽拉
      tts:
        delivery: 严厉务实，关切藏在克制的话语里
        timbre: 稳定清晰的中年女声
        pace: 从容直接
        pitch: medium-low
    diana:
      display_name: 戴安娜
      tts:
        delivery: 亲切真诚，对朋友满怀关心
        timbre: 柔和甜润的少女声
        pace: 自然适中
        pitch: medium-high
    mrs_lynde:
      display_name: 林德太太
      tts:
        delivery: 阅历丰富，直率果断，沉痛时语气郑重
        timbre: 饱满清晰的中老年女声
        pace: 稳健适中
        pitch: medium-low
    mrs_allan:
      display_name: 艾伦太太
      tts:
        delivery: 温柔通透，以体谅而笃定的语气开导人
        timbre: 柔和沉静的年轻女声
        pace: 从容舒缓
        pitch: medium
  chapters:
    - id: ch01
      title: 第三十七章　名为死亡的收割者
      blocks:
        - id: ch01-b01
          speaker: marilla
          text: 马修——马修——你怎么了？马修，你不舒服吗？
          emotion: fearful
        - id: ch01-b02
          speaker: narrator
          text: 玛丽拉说得又急又慌。安妮抱着满怀白水仙从门厅进来，正好看见马修站在门廊入口。他手里捏着折起的报纸，面孔扭曲，灰白得吓人。从此过了很久，安妮一看见白水仙，或是闻到它的香气，心里都无法喜欢。她丢下花，和玛丽拉一同扑过去。可她们还没赶到，马修已经横倒在门槛上。
        - id: ch01-b03
          speaker: marilla
          text: 他昏过去了。安妮，快去叫马丁！快，快！他在谷仓。
          emotion: fearful
        - id: ch01-b04
          speaker: narrator
          text: 长工马丁刚从邮局赶车回来，马上动身请医生。他经过果园坡，又请巴里夫妇赶去绿山墙。林德太太恰好在那里办事，也跟着来了。几人进门时，安妮和玛丽拉正慌乱地设法唤醒马修。
        - id: ch01-b05
          speaker: narrator
          text: 林德太太轻轻推开她们，先摸马修的脉搏，再把耳朵贴到他的心口。她悲伤地望向两张焦急的脸，泪水涌进眼睛。
        - id: ch01-b06
          speaker: mrs_lynde
          text: 唉，玛丽拉，我想……我们已经没什么能为他做的了。
          emotion: sad
        - id: ch01-b07
          speaker: anne
          text: 林德太太，你不是以为……你不可能以为马修已经……已经……
          emotion: fearful
        - id: ch01-b08
          speaker: narrator
          text: 那个可怕的字，安妮怎么也说不出口。她一阵恶心，脸色变得惨白。
        - id: ch01-b09
          speaker: mrs_lynde
          text: 孩子，是的，恐怕就是这样。你看看他的脸吧。等你见过许多次这种神情，就会知道那是什么意思了。
          emotion: sad
        - id: ch01-b10
          speaker: narrator
          text: 安妮望着马修静止的脸。死亡这位伟大来客，已经在上面留下了印记。
        - id: ch01-b11
          speaker: narrator
          text: 医生赶来后，说马修当即就离世了，大概没有受苦，死因很可能是突然受到沉重打击。答案就在那张报纸里。马丁早晨从邮局带回了它，马修倒下时还握在手中。报上说，阿比银行倒闭了。
        - id: ch01-b12
          speaker: narrator
          text: 噩耗很快传遍埃文利。整整一天，亲友邻里挤满绿山墙。他们怀着善意来来往往，为死者，也为活着的人料理事情。羞怯寡言的马修·卡思伯特，平生第一次成了所有人关注的中心。死亡洁白而庄严的光辉落在他身上，使他与众人不同，仿佛戴上了冠冕。
        - id: ch01-b13
          speaker: narrator
          text: 宁静的夜色轻轻落下来，绿山墙这座老屋也沉寂了。马修躺在客厅的棺木里。灰白的长发围着安详的脸，唇边还留着一点慈爱的笑，好像只是在睡梦里看见了什么快乐的事。四周摆着芬芳古雅的花。那些花是他母亲新婚时亲手种在老宅花园里的。马修一直暗暗爱着它们，却从来没有对人说过。安妮亲手把花采来，又一朵朵放在他身边。她苍白的脸上，那双没有泪水的眼睛因痛苦而灼灼发亮。这是她最后能为马修做的一件事。
        - id: ch01-b14
          speaker: narrator
          text: 那晚，巴里夫妇和林德太太都留了下来。戴安娜走进东山墙房间时，安妮正站在窗前。
        - id: ch01-b15
          speaker: diana
          text: 安妮，今晚要不要我陪你睡？
        - id: ch01-b16
          speaker: anne
          text: 谢谢你，戴安娜。我说想一个人待着，你一定不会误会。我不是害怕。事情发生以后，我一刻也没有独处过，所以现在很想独自静一静。我想让四周一点声音也没有，好试着弄明白这件事。可我就是弄不明白。有时候，我觉得马修不可能死。另一些时候，我又觉得他仿佛已经死去很久了，我心里这股可怕的钝痛也已经痛了很久。
          emotion: sad
        - id: ch01-b17
          speaker: narrator
          text: 戴安娜没能完全明白。玛丽拉的悲恸汹涌而出，冲破了天生的矜持和一生的习惯，倒比安妮这种没有眼泪的痛苦容易懂。可戴安娜仍体贴地离开了，让安妮独自守着悲伤，度过她的第一个长夜。
        - id: ch01-b18
          speaker: narrator
          text: 安妮盼着独处以后，眼泪就会来。她那么爱马修，马修又对她那么好，她却一滴泪也流不出，这实在太可怕了。昨晚夕阳下，他还陪她走过一段路，如今却躺在楼下昏暗的房间里，额上覆着令人畏惧的安宁。安妮跪在黑暗的窗前祈祷，望着群山那边的星星，仍然没有流泪。只有那股钝重的悲苦，一阵又一阵疼着。白天的痛苦和惊乱耗尽了她的力气，她终于睡着了。
        - id: ch01-b19
          speaker: narrator
          text: 夜里，安妮醒来。四周又静又黑，白天的一切忽然像悲哀的浪潮一样淹没了她。她看见马修昨晚在院门边朝她微笑，又听见了他的声音。
        - id: ch01-b20
          speaker: matthew
          text: 我的姑娘——我的姑娘，叫我骄傲的姑娘。
        - id: ch01-b21
          speaker: narrator
          text: 这一次，眼泪终于来了。安妮哭得肝肠寸断。玛丽拉听见声音，悄悄走进来安慰她。
        - id: ch01-b22
          speaker: marilla
          text: 好了，好了，别这样哭，亲爱的。再哭也不能让他回来。这样哭……是不对的。今天我也明白，可那时候我就是忍不住。他一直是那么善良、那么好的哥哥。不过，上帝自有最好的安排。
          emotion: sad
        - id: ch01-b23
          speaker: anne
          text: 就让我哭吧，玛丽拉。眼泪不像刚才那股钝痛一样折磨我。陪我待一会儿，用胳膊搂着我，就这样。我没法让戴安娜留下。她那么好，那么体贴，可这不是她的悲伤。她在这悲伤外面，走不到离我心够近的地方，没法安慰我。这是我们的悲伤，你的，也是我的。玛丽拉，没有马修，我们该怎么办？
          emotion: sad
        - id: ch01-b24
          speaker: marilla
          text: 我们还有彼此，安妮。要是你不在这里，要是你从来没有来过，我真不知道该怎么办。我知道自己也许一直对你有点严厉，有点冷硬。可你千万不要以为，我不像马修那样爱你。趁现在说得出口，我一定得告诉你。我从来都不容易说出心里的话，可到了这种时候，反倒容易些了。我爱你，就像爱自己的亲生骨肉。自从你来到绿山墙，你就是我的欢乐，也是我的安慰。
          emotion: sad
        - id: ch01-b25
          speaker: narrator
          text: 两天以后，人们抬着马修越过他住了一生的门槛，让他离开耕种过的田地、深爱的果园，还有亲手栽下的树。随后，埃文利又恢复了往日的平静。连绿山墙的一切也渐渐回到旧有的轨道。每天该做的活儿照样有人做，每个人该尽的本分也照样完成，日子看起来和从前没有两样。可所有熟悉的事物里，从此永远都藏着失去马修的痛。
        - id: ch01-b26
          speaker: narrator
          text: 安妮第一次经历悲伤，觉得这一切近乎残酷。没有马修，他们怎么还能照旧生活？可当她看见冷杉后升起的朝阳，看见花园里淡粉色的花苞慢慢打开，从前那股喜悦仍会忽然涌进心里。戴安娜来看她，她依然觉得快活。听见戴安娜那些欢喜的话，看着她活泼的样子，安妮还是会微笑，甚至笑出声来。这个开满鲜花、充满爱和友谊的美丽世界，并没有失去取悦她的想象、震动她心灵的力量。生活仍用许多急切的声音呼唤她。发现这些时，安妮甚至又羞愧，又后悔。
        - id: ch01-b27
          speaker: narrator
          text: 一天傍晚，她和艾伦太太在牧师住宅的花园里散步，终于说起这份心事。
        - id: ch01-b28
          speaker: anne
          text: 马修已经走了，可这些事还是会让我快乐。我总觉得，这好像是对他不忠。我时时刻刻都想念他，可是艾伦太太，世界和生活在我眼里仍旧那么美，那么有意思。今天戴安娜说了句有趣的话，我发现自己竟然笑了。事情刚发生时，我还以为自己永远不会再笑。现在真的笑出来，又觉得自己不应该笑。
          emotion: sad
        - id: ch01-b29
          speaker: mrs_allan
          text: 马修在这里的时候，喜欢听见你笑，也喜欢知道你能从身边美好的事物里得到快乐。如今他不过是离开了，还是愿意看见你这样。大自然在安慰我们，我们不该把自己的心关起来。不过，我懂你的感觉。深爱的人不在身边，不能再和我们分享快乐了，我们就不愿相信还有什么能让自己高兴。等我们重新对生活有了兴趣，甚至会觉得自己辜负了这份悲伤。
          emotion: calm
        - id: ch01-b30
          speaker: anne
          text: 今天下午，我去墓地，在马修坟前种了一株玫瑰。那是小白苏格兰玫瑰的枝条，很久以前，他母亲从苏格兰带来的。马修最喜欢这种花。带刺的枝头上，玫瑰那么小，又那么香。能把它种在坟边，我很欣慰，好像带它去陪伴马修，就是做了一件会让他高兴的事。我希望天堂里也有这样的玫瑰。也许，那些被他爱过许多个夏天的小白玫瑰，它们的灵魂全都在那里迎接他。我得回家了。玛丽拉一个人在家，每到黄昏都会寂寞。
          emotion: sad
        - id: ch01-b31
          speaker: mrs_allan
          text: 等你再次离家上大学，她恐怕会更寂寞。
        - id: ch01-b32
          speaker: narrator
          text: 安妮没有回答。她向艾伦太太道过晚安，独自沿着回家的路一步一步慢慢走回绿山墙。玛丽拉正独自坐在前门台阶上，安妮走过去，紧挨着她坐下。身后的门敞开着，一枚粉红色的大海螺稳稳抵住门。它光滑的内壁曲曲折折，隐约映着海上落日的色彩。
        - id: ch01-b33
          speaker: narrator
          text: 安妮摘了几枝淡黄色的金银花，插在头发里。每当她一动，甜美的幽香就从头顶飘下来，仿佛空中送来的祝福。她很喜欢这香气。
        - id: ch01-b34
          speaker: marilla
          text: 你不在时，斯宾塞医生来过了。他说那位专家明天进城，坚持让我去检查眼睛。我想还是去一趟，赶快把这事了结。要是那人真能配一副合适的眼镜，我可要谢天谢地了。马丁得赶车送我。你一个人留在家里，不会介意吧？还有衣服要熨，面包和点心也要烤。
        - id: ch01-b35
          speaker: anne
          text: 我一个人完全没问题，戴安娜会过来陪我。我一定把熨烫和烘焙都做得漂漂亮亮。你不用担心我会把手帕浆得硬邦邦，或者把擦伤药油当香料放进蛋糕。
        - id: ch01-b36
          speaker: narrator
          text: 玛丽拉笑了。
        - id: ch01-b37
          speaker: marilla
          text: 那时候的你可真会出岔子，安妮。你老是闯祸，我以前真觉得你像中了邪。还记得你染头发那一回吗？
        - id: ch01-b38
          speaker: anne
          text: 当然记得，我永远也忘不了。现在想起从前那么为头发发愁，我偶尔也会笑。不过不会笑得太厉害，因为那时候，这确实是个非常真实的烦恼。我真为头发和雀斑吃尽了苦头。如今雀斑没了，人们也都很好心，说我的头发是赤褐色。只有乔西·派伊不肯这么说。昨天她特地告诉我，她觉得我的头发比从前更红，或许是黑裙子把它衬得更红。她还问，一头红发的人能不能习惯自己的头发。玛丽拉，我差不多已经决定，不再逼自己喜欢乔西·派伊了。我付出过从前一定会称为英勇的努力，可乔西·派伊偏偏就是叫人喜欢不起来。
        - id: ch01-b39
          speaker: marilla
          text: 乔西是派伊家的人，生得讨人厌，她也没办法。我猜这种人在世上总有点用处，可我实在说不出是什么用，就像我说不出蓟草有什么用一样。乔西要去教书吗？
        - id: ch01-b40
          speaker: anne
          text: 不，她明年还要回女王学院。穆迪·斯珀吉翁和查理·斯隆也回去。简和露比要教书，两个人都找到学校了。简在新桥村，露比在西边的一个地方。
        - id: ch01-b41
          speaker: marilla
          text: 吉尔伯特·布莱思也要教书，对吧？
        - id: ch01-b42
          speaker: anne
          text: 对，他也要教书。
        - id: ch01-b43
          speaker: marilla
          text: 他长得真不错。上星期日我在教堂见到他，个子那么高，已经很有男子汉的样子了。他很像他父亲年轻的时候。约翰·布莱思当年是个好小伙子，我们曾经是很要好的朋友。大家还说他是我的意中人呢。
        - id: ch01-b44
          speaker: narrator
          text: 安妮立刻来了兴致，抬头望着玛丽拉。
        - id: ch01-b45
          speaker: anne
          text: 啊，玛丽拉，后来出了什么事？你们为什么没有……
          emotion: surprised
        - id: ch01-b46
          speaker: marilla
          text: 我们吵了一架。他来求我原谅，我却不肯。我原本打算过些时候就原谅他，可我那时又气又别扭，想先惩罚他一下。他再也没回来。布莱思家的人个个都傲得很。不过，我心里一直有点后悔。我总希望当初有机会时，就已经原谅了他。
        - id: ch01-b47
          speaker: anne
          text: 原来你的生命里，也有过一小段浪漫故事。
        - id: ch01-b48
          speaker: marilla
          text: 是啊，我想也可以这么说。光看我的样子，你想不到吧？可一个人究竟有过什么，从外表永远看不出来。大家都忘了我和约翰的事，连我自己也忘了。可是上星期日一看见吉尔伯特，那些往事全都回来了。
