  chapters:
    - id: ch01
      title: The Reaper Whose Name Is Death
      blocks:
        - id: ch01-b01
          speaker: marilla_cuthbert
          text: "Matthew! Matthew, what's wrong? Are you sick?"
          emotion: fearful
        - id: ch01-b02
          speaker: narrator
          text: "Marilla's alarm came out in sharp, broken words. Anne entered the hall carrying an armful of white narcissus. It would be a long time before she could bear their sight or smell again. She saw Matthew in the porch doorway with a folded paper in one hand. His face looked strangely drawn and gray. Anne dropped the flowers and rushed toward him with Marilla, but they were too late. Matthew fell across the threshold before they could reach him."
        - id: ch01-b03
          speaker: marilla_cuthbert
          text: "He's fainted. Anne, get Martin! Hurry! He's at the barn!"
          emotion: fearful
        - id: ch01-b04
          speaker: narrator
          text: "Martin, the hired man, had just returned from the post office. He left at once to fetch the doctor. On his way, he stopped at Orchard Slope and asked Mr. and Mrs. Barry to come. Mrs. Lynde happened to be there on an errand, so she came too. They found Anne and Marilla desperately trying to bring Matthew back to consciousness. Mrs. Lynde gently moved them aside, felt for his pulse, and listened over his heart. Then she looked up at their anxious faces. Tears filled her eyes."
        - id: ch01-b05
          speaker: rachel_lynde
          text: "Oh, Marilla. I don't believe there's anything we can do for him."
          emotion: sad
        - id: ch01-b06
          speaker: anne_shirley
          text: "Mrs. Lynde, you don't mean... You can't mean Matthew is..."
          emotion: fearful
        - id: ch01-b07
          speaker: narrator
          text: "Anne went pale and sick. She could not say the terrible word."
        - id: ch01-b08
          speaker: rachel_lynde
          text: "I'm afraid I do, child. Look at his face. Once you've seen that look as many times as I have, you know what it means."
          emotion: sad
        - id: ch01-b09
          speaker: narrator
          text: "Anne looked at Matthew's still face and saw the seal of the Great Presence. The doctor arrived and said that death had come at once and had probably caused no pain. A sudden shock was the likely cause. They found the reason in the paper Matthew had been holding, the one Martin had brought from the post office that morning. It announced that the Abbey Bank had failed."
        - id: ch01-b10
          speaker: narrator
          text: "News traveled quickly through Avonlea. All day, friends and neighbors filled Green Gables. They came and went on kind errands, helping the people who grieved and caring for the man they had lost. For the first time, shy and quiet Matthew Cuthbert stood at the center of everyone's thoughts. In life, he had always stayed in the background. Now the white majesty of death had touched him and set him apart like a crowned man."
        - id: ch01-b11
          speaker: narrator
          text: "Night settled softly over Green Gables, and the old house grew still. Matthew lay in his coffin in the parlor. His long gray hair framed his peaceful face, and a small, kindly smile rested there, as if he were only asleep and dreaming pleasant dreams. Flowers surrounded him. They were sweet, old-fashioned blooms his mother had planted in the garden when she first came there as a bride. Matthew had always loved them quietly, without ever saying so. Anne had gathered them for him. Her face was white, and her anguished eyes could not cry. It was the last thing she could do for Matthew."
        - id: ch01-b12
          speaker: narrator
          text: "The Barrys and Mrs. Lynde stayed that night. Diana went up to the east gable, where Anne stood at her window."
        - id: ch01-b13
          speaker: diana_barry
          text: "Anne, dear, would you like me to sleep here with you tonight?"
        - id: ch01-b14
          speaker: anne_shirley
          text: "Thank you, Diana. I know you'll understand, but I need to be alone. I'm not frightened. I just haven't had one minute by myself since it happened. I need silence. I need to try to understand that it's real, because I can't. Sometimes it feels impossible that Matthew could be dead. Then it feels as though he's been gone forever, and this awful, heavy ache has always been inside me."
          emotion: sad
        - id: ch01-b15
          speaker: narrator
          text: "Diana did not fully understand. Marilla's grief had burst through every wall built by her reserved nature and lifelong habits. That storm of feeling made more sense to Diana than Anne's dry-eyed suffering. Still, she left with kindness and let Anne face her first lonely watch with sorrow."
        - id: ch01-b16
          speaker: narrator
          text: "Anne hoped she would cry once she was alone. It frightened her that no tears would come for Matthew, whom she had loved so deeply and who had always been so good to her. Only last evening he had walked beside her at sunset. Now he lay in the shadowed room below with that dreadful peace across his forehead. She could hardly understand how one evening could stand so close to the other. Anne knelt at her dark window and prayed beneath the stars beyond the hills. Still there were no tears. There was only the same dull misery, aching and aching, until the day's pain and excitement wore her out and she fell asleep."
        - id: ch01-b17
          speaker: narrator
          text: "She woke during the night, surrounded by darkness and silence. The memory of the day swept over her like a wave of sorrow. She saw Matthew smiling as he had when they parted at the gate the evening before. She heard him say, 'My girl. My girl that I'm proud of.' At last, the tears came. Anne wept with all her heart, and Marilla heard her. She slipped into the room to comfort her."
        - id: ch01-b18
          speaker: marilla_cuthbert
          text: "There, there, dearie. Don't cry so hard. It can't bring him back. It isn't right to cry this way. I knew that today, though I couldn't stop myself then. He was always such a good, kind brother to me. But God knows best."
          emotion: sad
        - id: ch01-b19
          speaker: anne_shirley
          text: "Please let me cry, Marilla. The tears don't hurt the way that ache did. Stay with me a little while and keep your arm around me, just like this. I couldn't ask Diana to stay. She's kind and dear, but this isn't her sorrow. She's outside it, so she couldn't get close enough to my heart to help. This sorrow belongs to us, yours and mine. Oh, Marilla, how will we live without him?"
          emotion: sad
        - id: ch01-b20
          speaker: marilla_cuthbert
          text: "We still have each other, Anne. I don't know what I'd do if you weren't here, or if you'd never come at all. I know I've been strict with you, and maybe harsh sometimes. But never think I loved you less than Matthew did. I want to say it now, while I can. Speaking what's in my heart has never been easy for me, though sorrow makes it easier. I love you as dearly as if you were my own flesh and blood. You've brought me joy and comfort from the day you came to Green Gables."
          emotion: sad
        - id: ch01-b21
          speaker: narrator
          text: "Two days later, they carried Matthew Cuthbert through the doorway of his home for the last time. They took him away from the fields he had worked, the orchards he had loved, and the trees he had planted. Then Avonlea returned to its usual quiet. Even at Green Gables, life slipped back into its old pattern. Meals had to be made, work had to be finished, and every duty came at its regular time. Yet every familiar thing carried the ache of loss."
        - id: ch01-b22
          speaker: narrator
          text: "Grief was new to Anne, and she thought it was almost sad that life could continue in the same way without Matthew. At first, the thought brought her shame and regret. A sunrise behind the firs could still fill her with the old gladness. So could the pale pink buds opening in the garden. Diana's visits still pleased her, and Diana's merry talk could still make her smile and laugh. The beautiful world of blossoms, love, and friendship had lost none of its power over her imagination or her heart. Life kept calling to her in many insistent voices. One evening, Anne tried to explain this to Mrs. Allan in the manse garden."
        - id: ch01-b23
          speaker: anne_shirley
          text: "It feels disloyal to Matthew when anything makes me happy now. I miss him every moment. And yet the world still seems beautiful, and life still seems interesting. Diana said something funny today, and I laughed. When Matthew died, I thought I'd never laugh again. Somehow, it feels as if I shouldn't."
          emotion: sad
        - id: ch01-b24
          speaker: mrs_allan
          text: "When Matthew was with you, he loved hearing you laugh. He loved knowing that the good things around you made you happy. He's only away now, and he still wants that for you. We shouldn't close our hearts to the comfort nature gives us. But I do understand. When someone we love can no longer share our happiness, we resent anything that pleases us. As our interest in life returns, it can feel as though we're betraying our grief."
        - id: ch01-b25
          speaker: anne_shirley
          text: "I planted a rosebush on Matthew's grave this afternoon. It came from the little white Scotch rose his mother brought from Scotland long ago. Those were his favorite roses, so small and sweet on their thorny stems. Planting it beside him made me glad. It felt like something he would want me to do. I hope he has roses like them in heaven. Maybe the souls of all the little white roses he loved through so many summers were waiting to meet him. I need to go home now. Marilla is alone, and twilight makes her lonely."
        - id: ch01-b26
          speaker: mrs_allan
          text: "I'm afraid she'll be even lonelier when you leave for college again."
        - id: ch01-b27
          speaker: narrator
          text: "Anne did not answer. She said good night and walked slowly home to Green Gables. Marilla sat alone on the front steps, and Anne lowered herself beside her. Behind them, the open door was held by a large pink conch shell. Its smooth inner curves seemed to hold the colors of a sunset over the sea. Anne picked a few pale yellow sprays of honeysuckle and tucked them into her hair. Whenever she moved, their delicate fragrance drifted above her like a blessing carried on the air."
        - id: ch01-b28
          speaker: marilla_cuthbert
          text: "Doctor Spencer came while you were out. The specialist will be in town tomorrow, and the doctor insists I have my eyes examined. I suppose I should get it over with. I'll be very thankful if this man can find glasses that truly suit my eyes. You won't mind being here alone, will you? Martin has to drive me, and the ironing and baking still need doing."
        - id: ch01-b29
          speaker: anne_shirley
          text: "I'll be fine. Diana will come keep me company, and I'll do the ironing and baking perfectly. You don't need to worry that I'll starch the handkerchiefs or put liniment in the cake."
        - id: ch01-b30
          speaker: narrator
          text: "Marilla laughed."
        - id: ch01-b31
          speaker: marilla_cuthbert
          text: "You certainly made enough mistakes in those days. You were always landing in some scrape. Sometimes I truly thought you were possessed. Do you remember dyeing your hair?"
        - id: ch01-b32
          speaker: anne_shirley
          text: "I could never forget that. I can laugh a little now when I remember how much my hair used to trouble me, but not too much. It was a very real misery then. My hair and freckles caused me terrible suffering. The freckles really are gone, and people kindly call my hair auburn now. Everyone except Josie Pye, that is. Yesterday she said it looked redder than ever, or perhaps my black dress made it look that way. Then she asked whether red-haired people ever grow used to it. Marilla, I think I've nearly given up trying to like Josie. Once I would have called my effort heroic, but Josie Pye simply refuses to be likable."
        - id: ch01-b33
          speaker: marilla_cuthbert
          text: "Josie is a Pye, so she can't help being unpleasant. I suppose people like that must serve some purpose in the world. But I no more understand their purpose than I understand the purpose of thistles. Is Josie going to teach?"
        - id: ch01-b34
          speaker: anne_shirley
          text: "No. She's returning to Queen's next year, and so are Moody Spurgeon and Charlie Sloane. Jane and Ruby will teach. They both have schools already. Jane's is at Newbridge, and Ruby's is somewhere out west."
        - id: ch01-b35
          speaker: marilla_cuthbert
          text: "Gilbert Blythe is going to teach too, isn't he?"
        - id: ch01-b36
          speaker: anne_shirley
          text: "Yes."
        - id: ch01-b37
          speaker: marilla_cuthbert
          text: "He's a fine-looking young man. I saw him at church last Sunday. He's grown so tall and manly. He reminds me of his father at the same age. John Blythe was a good boy. We were very close once. People used to call him my beau."
        - id: ch01-b38
          speaker: anne_shirley
          text: "Marilla! What happened? Why didn't you..."
          emotion: surprised
        - id: ch01-b39
          speaker: marilla_cuthbert
          text: "We quarreled. He asked me to forgive him, and I refused. I meant to forgive him later, but I was angry and stubborn. I wanted to punish him first. He never asked again. The Blythes were always very proud and independent. I've been sorry about it ever since. I often wished I'd forgiven him while I had the chance."
          emotion: sad
        - id: ch01-b40
          speaker: anne_shirley
          text: "Then you had a little romance in your life too."
        - id: ch01-b41
          speaker: marilla_cuthbert
          text: "I suppose you could call it that. You wouldn't guess it by looking at me, would you? But you can never know a person's story from the outside. Everyone else forgot about John and me. I'd forgotten too, until I saw Gilbert last Sunday. Then it all came back."
