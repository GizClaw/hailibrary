  chapters:
    - id: ch01
      title: The Story Club Is Formed
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: "The younger people of Avonlea had a hard time settling back into ordinary life. Anne felt it most of all. After sipping excitement for weeks, everything seemed terribly dull. Could she really return to the quiet pleasures she'd enjoyed before the concert? At first, she told Diana she didn't think she could."
        - id: ch01-b02
          speaker: anne_shirley
          text: "Diana, I'm certain life will never be the same as it was in those old days. Maybe I'll adjust after a while, but I think concerts spoil people for everyday life. That must be why Marilla disapproves of them. She's so sensible. I suppose being sensible is much better for a person, but I don't truly want to be sensible myself. Sensible people are terribly unromantic, and I couldn't bear that."
          emotion: sad
        - id: ch01-b03
          speaker: anne_shirley
          text: "Mrs. Lynde says I'll never be sensible, though you never can tell. Right now, I feel as if I might grow into it after all. Maybe that's only because I'm tired. I stayed awake for ages last night, imagining the whole concert again and again. That's one wonderful thing about an occasion like that. Looking back on it is so lovely."
        - id: ch01-b04
          speaker: narrator
          text: "Before long, the Avonlea school returned to its usual ways and interests. The concert did leave a few marks behind. Ruby Gillis and Emma White had quarreled over which of their seats should come first on the platform. They no longer sat at the same desk, and their promising three-year friendship was over. Josie Pye told Bessie Wright that Julia Bell's bow before her recitation looked like a chicken jerking its head. Bessie passed the remark to Julia, and Julia refused to speak to Josie for three months."
        - id: ch01-b05
          speaker: narrator
          text: "None of the Sloanes wanted anything to do with the Bells. The Bells had complained that the Sloanes were given far too much to do in the program. The Sloanes answered that the Bells couldn't even perform their own small part properly. Then Moody Spurgeon MacPherson said Anne put on airs during her recitations. Charlie Sloane fought him for saying it, and Moody was beaten. After that, Moody's sister Ella May refused to speak to Anne for the rest of the winter. Aside from those little troubles, work in Miss Stacy's small kingdom ran smoothly and regularly."
        - id: ch01-b06
          speaker: narrator
          text: "The winter weeks passed. The weather was unusually mild, with so little snow that Anne and Diana could take the Birch Path to school nearly every day. On Anne's birthday, they skipped along it, talking as always but watching and listening carefully too. Miss Stacy had said they would soon write about a winter walk in the woods, so they needed to notice things."
        - id: ch01-b07
          speaker: anne_shirley
          text: "Just think, Diana. I'm thirteen today. I can hardly believe I'm in my teens at last. When I woke up this morning, I felt as if everything ought to be different. You've already been thirteen for a whole month, so it can't feel as wonderfully new to you. To me, it makes life seem much more interesting. In only two more years I'll be truly grown up. It's a great comfort to know that then I can use big words without people laughing at me."
          emotion: surprised
        - id: ch01-b08
          speaker: diana_barry
          text: "Ruby Gillis says she'll have a beau the moment she turns fifteen."
        - id: ch01-b09
          speaker: anne_shirley
          text: "Ruby thinks about nothing except beaus. She even likes it when someone puts her name in a take-notice, no matter how angry she pretends to be. Oh, that was unkind. Mrs. Allan says we mustn't make uncharitable remarks, but they escape before you can stop them, don't they? I can't mention Josie Pye without saying something unkind, so I don't mention her at all. You may have noticed."
        - id: ch01-b10
          speaker: anne_shirley
          text: "I'm trying to be as much like Mrs. Allan as I possibly can because I think she's perfect. Mr. Allan thinks so too. Mrs. Lynde says he practically worships the ground she walks on, and she doesn't believe a minister should care so much for any mortal person. But even ministers are human. They have besetting sins like everyone else. Mrs. Allan and I had a fascinating talk about those sins last Sunday afternoon. There are only a few subjects that are proper to discuss on Sundays, and that's one of them. My own besetting sin is imagining too much and forgetting my duties. I'm working very hard to overcome it. Now that I'm truly thirteen, perhaps I'll do better."
        - id: ch01-b11
          speaker: diana_barry
          text: "Four more years, and we can wear our hair up. Alice Bell is only sixteen and already wears hers that way. I think that's ridiculous. I'm waiting until I'm seventeen."
        - id: ch01-b12
          speaker: anne_shirley
          text: "If my nose were as crooked as Alice Bell's, I wouldn't... No, I won't finish that. What I nearly said was extremely unkind. Besides, I was comparing her nose with mine, and that's vanity. I've thought far too much about my nose ever since I heard that compliment about it long ago. Still, remembering it is a real comfort. Oh, look, Diana! There's a rabbit! We must remember that for our composition about the woods. I truly think they're every bit as lovely in winter as they are in summer. Everything is so white and quiet, as if the woods were sleeping and dreaming beautiful dreams."
        - id: ch01-b13
          speaker: diana_barry
          text: "I won't mind that composition. I can write about the woods. But the story due Monday is awful. Imagine Miss Stacy asking us to invent one entirely by ourselves!"
        - id: ch01-b14
          speaker: anne_shirley
          text: "Why, that's as easy as blinking."
        - id: ch01-b15
          speaker: diana_barry
          text: "It's easy when you have an imagination. What would you do if you'd been born without one? I suppose you've already finished your story."
        - id: ch01-b16
          speaker: narrator
          text: "Anne nodded. She tried not to look proudly pleased with herself, but she failed completely."
        - id: ch01-b17
          speaker: anne_shirley
          text: "I wrote it Monday night. It's called The Jealous Rival, or In Death Not Divided. Marilla called it stuff and nonsense, but Matthew said it was fine. That's the kind of critic I prefer. It's such a sweet, sad story that I cried like a child while writing it."
        - id: ch01-b18
          speaker: anne_shirley
          text: "It's about two beautiful girls from the same village who are utterly devoted friends. Their names are Cordelia Montmorency and Geraldine Seymour. Cordelia is a regal brunette, with a crown of midnight hair and dark, flashing eyes. Geraldine is a queenly blonde. Her hair looks like spun gold, and her soft, velvety eyes are purple."
        - id: ch01-b19
          speaker: diana_barry
          text: "I've never seen anyone with purple eyes."
        - id: ch01-b20
          speaker: anne_shirley
          text: "Neither have I. I imagined them because I wanted something unusual. Geraldine also has an alabaster brow. I finally learned what that means. That's one benefit of being thirteen. You know so much more than you did at twelve."
        - id: ch01-b21
          speaker: diana_barry
          text: "So what happened to Cordelia and Geraldine?"
        - id: ch01-b22
          speaker: narrator
          text: "Diana was beginning to care quite a bit about what happened to them."
        - id: ch01-b23
          speaker: anne_shirley
          text: "They grew up side by side, becoming more beautiful every year, until they were sixteen. Then Bertram DeVere came to their own village and fell in love with fair Geraldine. One day, the horse pulling her carriage ran away. Bertram saved her life, and Geraldine fainted in his arms. The carriage had been smashed to pieces, so he carried her all the way home. It was a full three miles."
        - id: ch01-b24
          speaker: anne_shirley
          text: "The proposal was difficult to imagine because I had no experience to guide me. I asked Ruby Gillis what she knew about proposals. With so many married sisters, I thought she must be an authority. Ruby once hid in the hall pantry while Malcolm Andres proposed to her sister Susan. Malcolm told Susan that his father had put the farm in his own name. Then he said, 'What do you say, darling pet? Should we get hitched this fall?' Susan answered, 'Yes. No. I don't know. Let me think.' And just like that, the two of them were engaged."
        - id: ch01-b25
          speaker: anne_shirley
          text: "That sort of proposal wasn't nearly romantic enough for me, so I had to invent one as well as I could. I made it very flowery and poetic. Bertram went down on his knees, even though Ruby says men don't do that anymore. Geraldine accepted him with a speech that filled a whole page. I worked terribly hard on that speech and rewrote it five times. I consider it my masterpiece. Bertram gave her both a diamond ring and a ruby necklace. Since he was enormously rich, he promised they would travel through Europe on their wedding tour."
        - id: ch01-b26
          speaker: anne_shirley
          text: "But then dark shadows fell across their path. Cordelia was secretly in love with Bertram. When Geraldine showed her the ring and necklace and announced the engagement, Cordelia became furious. Her love for Geraldine turned into bitter hatred. She swore Geraldine would never marry Bertram, though she kept pretending to be her friend."
        - id: ch01-b27
          speaker: anne_shirley
          text: "One evening, the two girls stood on a bridge above a wild, rushing stream. Cordelia thought they were completely alone. She gave a cruel, mocking laugh and pushed Geraldine over the edge. But Bertram had seen everything. He plunged straight into the current, crying, 'I will save you, my peerless Geraldine!' Sadly, he had forgotten that he couldn't swim. He and Geraldine drowned while clasped in each other's arms."
        - id: ch01-b28
          speaker: anne_shirley
          text: "Their bodies washed ashore soon afterward. They were laid together in one grave, and their funeral was most magnificent, Diana. A funeral makes the end of a story so much more romantic than a wedding does. As for Cordelia, she went mad with remorse and was locked away in an asylum. I thought that was a wonderfully poetic punishment for her terrible crime."
        - id: ch01-b29
          speaker: diana_barry
          text: "Oh, how perfectly lovely! I can't understand how you invent such exciting things all by yourself. I wish my imagination were as good as yours."
          emotion: happy
        - id: ch01-b30
          speaker: narrator
          text: "Diana clearly belonged to Matthew's school of critics."
        - id: ch01-b31
          speaker: anne_shirley
          text: "It could be, if you'd practice using it. Diana, I've just had an idea! Let's start our own story club and write stories for practice. I'll help until you can manage alone. Miss Stacy says we should develop our imaginations. We only have to do it properly. I told her about the Haunted Wood, and she said we'd gone about that in entirely the wrong way."
          emotion: happy
        - id: ch01-b32
          speaker: narrator
          text: "That was how the story club began. At first, it belonged only to Anne and Diana. Soon they invited Jane Andrews, Ruby Gillis, and one or two other girls who felt their imaginations needed practice. No boys were allowed to join, although Ruby offered the opinion that admitting them would make everything more exciting. The rules required every member to produce one new story every week."
        - id: ch01-b33
          speaker: anne_shirley
          text: "It's wonderfully interesting, Marilla. Each girl has to read her story aloud, and then all of us discuss it. We're carefully saving every one so our descendants can read them someday. We each write under a pen name. Mine is Rosamond Montmorency. All the girls write quite well. Ruby is rather sentimental and includes far too much romance. Too much is worse than too little, you know. Jane leaves romance out entirely because reading it aloud makes her feel so silly. Her stories are extremely sensible."
        - id: ch01-b34
          speaker: anne_shirley
          text: "Diana puts far too many murders into her stories. She says that most of the time she can't decide what to do with her characters, so she kills them to get rid of them. Usually I have to give everyone ideas about what to write. That isn't difficult for me because I have millions of ideas."
        - id: ch01-b35
          speaker: marilla_cuthbert
          text: "This story-writing is your most foolish scheme yet. You'll fill your heads with nonsense and waste time you should spend studying. Reading stories is bad enough. Writing them is worse."
        - id: ch01-b36
          speaker: anne_shirley
          text: "But we're very careful to give every story a moral, Marilla. I insist on it. All the good people receive rewards, and all the bad ones get the punishment they deserve. I'm sure that must have a healthy effect. The moral is the most important part. Mr. Allan says so. I read one of my stories to him and Mrs. Allan, and they both agreed that its moral was excellent. They only laughed in all the wrong places. I prefer it when people cry. Jane and Ruby nearly always cry when I reach the most pathetic parts."
        - id: ch01-b37
          speaker: anne_shirley
          text: "Diana wrote to Aunt Josephine about our club, and Aunt Josephine asked us to send her some stories. We carefully copied four of our very best and mailed them. Miss Barry wrote back that she'd never read anything so amusing in her life. That confused us because every story was terribly sad and almost everyone died. Still, I'm glad she enjoyed them. It proves our club is doing some good in the world. Mrs. Allan says that should be our purpose in everything we do. I truly try to make it mine, but when I'm having fun, I forget so often."
        - id: ch01-b38
          speaker: anne_shirley
          text: "I hope I'll be a little like Mrs. Allan when I grow up. Marilla, do you think there's any chance of that?"
        - id: ch01-b39
          speaker: marilla_cuthbert
          text: "Not a very large one. I'm certain Mrs. Allan was never as silly and forgetful as you are."
        - id: ch01-b40
          speaker: anne_shirley
          text: "No, but she wasn't always as good as she is now. She told me herself. She said she was a dreadful mischief as a girl and was forever getting into trouble. Hearing that encouraged me so much. Is it very wicked of me to feel encouraged when I learn that other people have been bad or mischievous too? Mrs. Lynde says it is. She says she's always shocked to hear that anyone was ever naughty, even when they were very small children."
        - id: ch01-b41
          speaker: anne_shirley
          text: "Mrs. Lynde once heard a minister admit that, as a boy, he stole a strawberry tart from his aunt's pantry. She never respected him again. I wouldn't feel that way. I'd think confessing was noble. And it would encourage boys who do naughty things and regret them. They could know they might still grow up to be ministers. That's how I would feel, Marilla."
        - id: ch01-b42
          speaker: marilla_cuthbert
          text: "What I feel right now is that you should've washed those dishes by this time. Your chattering has put you half an hour behind. Learn to work first and talk afterward."
