audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖机智，叙事细腻而自然
        timbre: 清澈柔和的成年女声
        pace: 从容，随情节轻快变化
        pitch: 中音
    anne:
      display_name: 安妮
      tts:
        delivery: 想象丰富，热烈真挚，情绪来得快而鲜明
        timbre: 清亮灵动的少女声
        pace: 偏快，动情时一气呵成
        pitch: 中高音
    marilla:
      display_name: 玛丽拉
      tts:
        delivery: 务实克制，话语干脆，偶尔透出藏起的温情
        timbre: 稳重略低的成年女声
        pace: 稍慢而利落
        pitch: 中低音
    diana:
      display_name: 戴安娜
      tts:
        delivery: 亲切诚恳，活泼中带着务实
        timbre: 柔和清甜的少女声
        pace: 自然轻快
        pitch: 中高音
  chapters:
    - id: ch01
      title: 音乐会留下的余波
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 音乐会结束以后，埃文利的孩子们很难重新习惯平淡日子。安妮尤其觉得，自己连续几星期都在一口口品尝兴奋，如今再看什么都乏味得很。音乐会以前那些安静的乐趣，仿佛已经隔了很远。她甚至告诉戴安娜，自己大概再也回不到从前了。
        - id: ch01-b02
          speaker: anne
          text: 戴安娜，我敢肯定，生活再也不会跟那些古老的日子一样了。也许过些时候我能习惯，可音乐会会把人惯坏，叫人过不惯平常生活。我想玛丽拉就是因此不赞成它。她那么明白事理，想必明白事理确实好得多。可那样的人一点也不浪漫，所以我并不真想变成那样。
        - id: ch01-b03
          speaker: anne
          text: 林德太太说，我绝对没有变得明白事理的危险。可谁知道以后会怎样呢？我现在就觉得，自己长大后也许能做到。当然，这也可能只是因为我累了。昨晚我很久都睡不着，只好把音乐会从头到尾一遍遍地想。这样的盛会最好的一点，就是以后回想起来还是那么美。
        - id: ch01-b04
          speaker: narrator
          text: 安妮说起那些古老的日子，口气悲伤得仿佛它们至少在五十年前。不过，时间久了，她还是重新习惯了。埃文利学校也回到旧轨道，大家又关心起原来的事情。只是音乐会留下的痕迹，并没有马上消失。
        - id: ch01-b05
          speaker: narrator
          text: 鲁比·吉利斯和艾玛·怀特为了台上座位谁该排在前面吵了一架，从此不再同桌。那段维持了三年、原本很有希望的好友情，就这样完了。乔西·派告诉贝茜·赖特，朱莉娅·贝尔起身背诵时行礼的样子，像只猛然伸缩脖子的鸡。贝茜又把话传给朱莉娅，乔西和朱莉娅便足足三个月不肯跟对方说话。
        - id: ch01-b06
          speaker: narrator
          text: 贝尔家嫌斯隆家在节目里占得太多，斯隆家便回敬道，贝尔家连自己那一点节目都演不好。两家从此谁也不肯理谁。后来，穆迪·斯普真·麦克弗森说安妮背诵时装腔作势，查理·斯隆为这话跟他打了一架，还把他揍了一顿。于是，穆迪的妹妹埃拉·梅整个冬天都不理安妮。除去这些小得微不足道的摩擦，斯泰西小姐的小王国仍旧平稳有序。
        - id: ch01-b07
          speaker: narrator
          text: 冬日一星期一星期地过去。这一年天气格外温和，雪也很少，安妮和戴安娜几乎每天都能走白桦小径上学。安妮生日那天，两个人又脚步轻快地走在小径上。她们嘴里虽说个不停，眼睛和耳朵却始终留心四周。斯泰西小姐说，她们很快要写一篇《冬日林中漫步》，既然如此，现在就非得仔细观察沿途的一切不可。
        - id: ch01-b08
          speaker: anne
          text: 戴安娜，想想看，我今天已经十三岁了。我简直不敢相信自己进了十几岁的年纪。今早一醒来，我就觉得周围的一切都该变得不一样。你已经十三岁整整一个月，所以不会像我这么新鲜。十三岁让生活一下子有趣多了。再过两年，我就真的长大了。到那时，我说那些大词也不会再有人笑，这可真叫我安慰。
        - id: ch01-b09
          speaker: diana
          text: 鲁比·吉利斯说，她一到十五岁就要交个男朋友。
        - id: ch01-b10
          speaker: anne
          text: 鲁比除了男朋友，脑袋里什么也没有。有人把她的名字写在引人注意的小广告上，她嘴里装得气极了，其实心里别提多高兴。不过，这样说人太刻薄了。艾伦太太说，我们绝不能讲刻薄话。可这种话常常还没等你想清楚，就已经溜出来了，对不对？
        - id: ch01-b11
          speaker: anne
          text: 我一提乔西·派就会说刻薄话，所以我干脆不提她。你也许已经发现了。我尽可能学艾伦太太，因为她十全十美，艾伦先生也这么想。林德太太说，他简直崇拜她脚下踩过的土地。她觉得牧师对一个凡人用这么深的感情，不大合宜。可就算牧师也是人，也会跟大家一样，特别容易犯某种罪。
        - id: ch01-b12
          speaker: anne
          text: 上星期日下午，我跟艾伦太太谈起这种容易犯的罪，聊得特别有意思。星期天适合谈的话题只有几样，这正好算一样。我的毛病是想象得太多，却忘了该做的事。我正拼命改呢。现在我真的十三岁了，也许能改得更好。
        - id: ch01-b13
          speaker: diana
          text: 再过四年，我们就能把头发盘起来了。艾丽斯·贝尔才十六岁，已经盘起头发，可我觉得那样很可笑。我要等到十七岁。
        - id: ch01-b14
          speaker: anne
          text: 要是我的鼻子像艾丽斯·贝尔那么歪，我才不会……算了，我不说了。刚才那句话太刻薄。而且我拿她的鼻子和自己的比较，也太虚荣。自从很久以前听人夸过我的鼻子，我恐怕总在想着它，可那个夸奖确实叫我很安慰。
        - id: ch01-b15
          speaker: anne
          text: 戴安娜，快看，那边有只兔子！我们可以把它写进林中作文。我觉得冬天的树林跟夏天一样可爱。四周那么白，那么静，仿佛树木都睡着了，正在做美丽的梦。
    - id: ch02
      title: 安妮的凄美杰作
      blocks:
        - id: ch02-b01
          speaker: diana
          text: 等轮到那篇作文，我倒不担心。树林我还写得来，可星期一要交的那篇真可怕。斯泰西小姐竟然叫我们凭空编一个故事！
        - id: ch02-b02
          speaker: anne
          text: 哎呀，那不是跟眨眼一样容易吗？
        - id: ch02-b03
          speaker: diana
          text: 你有想象力，当然觉得容易。可要是一个人生下来就没有想象力，她能怎么办？我猜你早就写完了吧？
        - id: ch02-b04
          speaker: narrator
          text: 安妮点点头。她拼命不让自己显得洋洋自得，却失败得十分彻底。
        - id: ch02-b05
          speaker: anne
          text: 上星期一晚上我就写好了，题目叫《嫉妒的情敌，又名：至死不分离》。玛丽拉听完，说全是胡说八道。马修却说写得很棒。我就喜欢马修这种批评家。这是个又悲伤又甜美的故事，我写的时候哭得像个孩子。
        - id: ch02-b06
          speaker: anne
          text: 故事里有两位美女，科迪莉娅·蒙莫朗西和杰拉尔丁·西摩。她们住在同一个村子，感情深得不得了。科迪莉娅是位高贵的黑发美人，头上围着午夜般乌黑的秀发，深色眼睛闪闪发亮。杰拉尔丁则像金发女王，头发好似金丝，眼睛是天鹅绒般的紫色。
        - id: ch02-b07
          speaker: diana
          text: 可我从来没见过紫眼睛的人。
        - id: ch02-b08
          speaker: anne
          text: 我也没见过，是我自己想的。我总得写点不同寻常的东西。杰拉尔丁还有一块雪花石膏般的额头。如今我已经弄清那到底是什么样了。十三岁的好处就在这里，比起十二岁的时候，你懂得多多了。
        - id: ch02-b09
          speaker: diana
          text: 那么，科迪莉娅和杰拉尔丁后来怎么样了？
        - id: ch02-b10
          speaker: narrator
          text: 戴安娜已经开始惦记两位姑娘的命运。安妮便接着往下讲。
        - id: ch02-b11
          speaker: anne
          text: 她们一同长大，越长越美，到了十六岁，伯特伦·德维尔来到了她们的家乡村庄。他立刻爱上美丽的杰拉尔丁。后来，杰拉尔丁乘坐的马车失控狂奔，是伯特伦救了她的命。她昏倒在他怀里，那辆马车又已经摔得粉碎，他只好一路抱着她走了三英里，才把她送回家。
        - id: ch02-b12
          speaker: anne
          text: 最难想的是求婚那一段，因为我自己毫无经验，根本没有什么可以借鉴。我只好去问鲁比，男人到底是怎么求婚的。她有那么多姐姐已经出嫁，我想她很可能是这方面的权威。鲁比说，马尔科姆·安德烈斯向她姐姐苏珊求婚时，她正躲在门厅的食物储藏间偷听。
        - id: ch02-b13
          speaker: anne
          text: 马尔科姆先说，他爸爸已经把农场过到他名下。接着他就问，小宝贝儿，咱们今年秋天结成一对怎么样？苏珊回答，好，不，我不知道，让我想想。就这么几句话，两个人已经订婚了。可我觉得，这样一点也不浪漫，只好尽力自己想象。
        - id: ch02-b14
          speaker: anne
          text: 我把求婚写得又华丽又有诗意，还让伯特伦单膝跪下，虽然鲁比说现在没人这么做了。杰拉尔丁用整整一页的讲话答应了他。为了写好那番话，我费了许多心思，前后一共重写五遍，简直把它看成自己的杰作。伯特伦送给她一枚钻戒和一条红宝石项链，还答应婚后带她去欧洲旅行，因为他富有得不得了。
        - id: ch02-b15
          speaker: anne
          text: 可是，唉，他们脚下的道路很快笼上阴影。原来科迪莉娅也在暗中爱着伯特伦。杰拉尔丁把订婚的消息告诉她以后，她简直气得发狂，特别是亲眼看到那枚钻戒和红宝石项链。从前对杰拉尔丁的深厚爱意全变成了刻骨仇恨。她发誓，绝不让杰拉尔丁嫁给伯特伦，表面上却还像从前一样，装作她最好的朋友。
        - id: ch02-b16
          speaker: anne
          text: 一天傍晚，她们站在一座桥上，桥下是汹涌的急流。科迪莉娅以为四下无人，便狂野而嘲弄地冷笑三声，把杰拉尔丁推下了桥。可伯特伦亲眼看见这一切。他大喊，要救自己举世无双的杰拉尔丁，立刻纵身跳进急流。
        - id: ch02-b17
          speaker: anne
          text: 不幸的是，他忘了自己不会游泳。两个人紧紧抱在一起，全都淹死了。尸体不久便被冲上岸，人们把他们葬进同一个墓穴，还办了一场极其隆重的葬礼。戴安娜，故事以葬礼收尾，比以婚礼收尾浪漫多了。
        - id: ch02-b18
          speaker: anne
          text: 至于科迪莉娅，她因为悔恨而发疯，后来被关进精神病院。我觉得，这正是对她的罪行最有诗意的报应。
        - id: ch02-b19
          speaker: diana
          text: 这故事实在美得不得了！安妮，我真不明白，你怎么能只凭自己的脑袋，想出这么惊心动魄的事。我真希望自己的想象力也能这么好。
          emotion: happy
        - id: ch02-b20
          speaker: narrator
          text: 说到批评故事，戴安娜显然属于马修那一派。
        - id: ch02-b21
          speaker: anne
          text: 只要肯培养，你的想象力也会变好。我刚想出一个办法。我们成立一个只属于自己的故事会，每个人都写故事练习。在你能独立写出来以前，我会帮你。斯泰西小姐也说，我们应该培养想象力。不过一定得用正确的方法。我把闹鬼森林的事告诉她，她说我们那次用错了办法。
    - id: ch03
      title: 故事会成立了
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 故事会就这样成立了。起初，会员只有安妮和戴安娜，很快又有简·安德鲁斯、鲁比·吉利斯，还有另外一两个觉得自己需要培养想象力的姑娘加入。男孩子一概不能参加，尽管鲁比认为，把他们收进来一定会更刺激。会里还有一条严格的规矩，每位会员每星期必须写出一个故事。
        - id: ch03-b02
          speaker: anne
          text: 玛丽拉，这件事实在太有意思了。每个姑娘都得把自己的故事大声读出来，然后大家一起讨论。我们会把所有故事郑重地珍藏起来，将来留给自己的后代阅读。每个人还要用笔名写作，我的笔名叫罗莎蒙德·蒙莫朗西。姑娘们都写得相当不错。
        - id: ch03-b03
          speaker: anne
          text: 鲁比的故事太多愁善感，里面放了太多谈情说爱。你知道，这种事写得太多，比写得太少还糟。简却从来不写爱情。她说，要是当着大家的面把那种话大声读出来，自己会难为情得不得了。她写的故事总是特别合情合理。
        - id: ch03-b04
          speaker: anne
          text: 戴安娜写的凶杀案又太多。她说，很多时候她不知道该怎么安排那些人物，只好把他们全杀掉，省得再操心。我差不多每次都得告诉她们写什么，不过这不难，我脑袋里有几百万个主意。
        - id: ch03-b05
          speaker: marilla
          text: 我看，写故事是你们到现在做过的最愚蠢的事。你们会把满脑袋塞满胡说八道，还浪费本该用来温习功课的时间。读故事已经够糟，自己写更糟。
        - id: ch03-b06
          speaker: anne
          text: 可我们每篇都很小心地放进寓意。这一点是我坚持的。所有好人最后都会得到奖赏，所有坏人也一定受到恰如其分的惩罚。我敢肯定，这会产生有益的影响。寓意才是故事里最要紧的东西，艾伦先生也这么说。
        - id: ch03-b07
          speaker: anne
          text: 我念过一个故事给艾伦先生和艾伦太太听。他们都说寓意好极了，只是总在不该笑的地方笑。我更喜欢听众哭。故事到了悲惨的地方，简和鲁比几乎每次都会哭。
        - id: ch03-b08
          speaker: anne
          text: 戴安娜写信把故事会告诉约瑟芬姑婆，她回信要我们寄几篇给她。我们便从所有作品里挑出最好的四篇，仔细抄好，寄了过去。约瑟芬·巴里小姐回信说，她这一生从没读过这么逗人的东西。这可让我们有点迷惑，因为四篇故事明明都非常悲惨，里面差不多每个人都死了。
        - id: ch03-b09
          speaker: anne
          text: 不过巴里小姐喜欢它们，我还是很高兴。这证明我们的故事会确实正在替世界做一点好事。艾伦太太说，我们无论做什么，都该把为世界做好事当成目标。我真的很努力，只是一玩得开心就常常忘记。等我长大以后，希望自己能有一点像艾伦太太。玛丽拉，你觉得还有这种可能吗？
        - id: ch03-b10
          speaker: marilla
          text: 要我说，可能性不算太大。我敢肯定，艾伦太太小时候绝不像你这么傻里傻气，还总是丢三落四。
        - id: ch03-b11
          speaker: anne
          text: 可她也不是从小就像现在这么好。这是她亲口告诉我的。她说自己小时候淘气得吓人，总是闯进各种麻烦里。我听完以后，心里一下子受到很大鼓舞。玛丽拉，听见别人以前又坏又淘气，我就觉得有希望，这是不是很邪恶？林德太太说，这当然是。
        - id: ch03-b12
          speaker: anne
          text: 林德太太说，不管一个人那时候有多小，只要听说他曾经淘气，她总会震惊。她有一回听见一位牧师坦白，说自己小时候从姑妈的食物储藏间偷过一块草莓馅饼。从那以后，她再也不能尊敬那位牧师。
        - id: ch03-b13
          speaker: anne
          text: 可我不会那么想。我会觉得，他肯承认这件事，实在很高尚。如今那些做过淘气事，心里又很后悔的小男孩，听了也会受到鼓舞。即使小时候犯过错，他们长大后照样可能当上牧师。玛丽拉，我会这样想。
        - id: ch03-b14
          speaker: marilla
          text: 安妮，我现在心里想的是，那些碟子早就该洗完了。你只顾站在这里说个不停，已经比该用的时间多花了半个钟头。先学会好好干活，再学说话。
