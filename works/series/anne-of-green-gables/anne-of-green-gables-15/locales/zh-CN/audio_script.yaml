audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖从容，带着细腻而机智的讲述感
        timbre: 清澈柔和
        pace: 舒缓而有变化
        pitch: 中音
    anne:
      display_name: 安妮
      tts:
        delivery: 热切灵动，想法接连涌出，真挚而富于想象
        timbre: 清亮稚嫩
        pace: 明快，动情处自然放慢
        pitch: 中高音
    marilla:
      display_name: 玛丽拉
      tts:
        delivery: 干脆严谨，言语直截了当，偶尔透出克制的温情
        timbre: 清晰沉稳
        pace: 中等
        pitch: 中音
    diana:
      display_name: 戴安娜
      tts:
        delivery: 亲切坦率，语气实际，待朋友温柔热诚
        timbre: 圆润清甜
        pace: 中等偏快
        pitch: 中高音
    mr_phillips:
      display_name: 菲利普斯先生
      tts:
        delivery: 自负刻板，训话时故作庄严，讥讽时冷硬
        timbre: 清晰偏薄
        pace: 中等
        pitch: 中音
    gilbert:
      display_name: 吉尔伯特
      tts:
        delivery: 顽皮自信，认错时坦率而诚恳
        timbre: 明朗的少年音
        pace: 明快
        pitch: 中音
    ruby:
      display_name: 鲁比
      tts:
        delivery: 活泼敏感，容易激动
        timbre: 清脆稚嫩
        pace: 偏快
        pitch: 中高音
    charlie:
      display_name: 查理
      tts:
        delivery: 朴直腼腆，反应真切
        timbre: 稍显稚气的少年音
        pace: 中等
        pitch: 中音
    josie:
      display_name: 乔西
      tts:
        delivery: 尖刻好胜，带着不加掩饰的得意
        timbre: 清亮偏尖
        pace: 中等偏快
        pitch: 中高音
    rachel:
      display_name: 林德太太
      tts:
        delivery: 笃定健谈，评议事情时条理十足
        timbre: 饱满明亮
        pace: 中等偏快
        pitch: 中音
  chapters:
    - id: ch01
      title: 美丽的上学路
      blocks:
        - id: ch01-b01
          speaker: anne
          text: >-
            今天真美啊！能活着碰上这样的日子，实在太幸福了，你说是不是？那些还没出生的人错过了今天，我都替他们可惜。他们以后当然也会遇见好日子，可再也不是今天了。还有，我们每天上学都能走这么美的路，多好呀！
          emotion: happy
        - id: ch01-b02
          speaker: diana
          text: >-
            是比大路好多了。大路晒得热烘烘的，到处都是灰。
        - id: ch01-b03
          speaker: narrator
          text: >-
            戴安娜说得很实在。她探头看着午餐篮，心里还在算另一件实在的事。篮子里安安稳稳地躺着三只覆盆子馅饼，每一只都汁水饱满，馋人得很。可学校里有十个女孩，真正分到每个人嘴里的，究竟能有几口呢？
        - id: ch01-b04
          speaker: narrator
          text: >-
            埃文利学校的女孩们每天都把各自带来的午餐凑到一起，大家共同分享。谁要是一个人吞下三只馅饼，或者只肯分给自己最要好的朋友，就会永远落下“小气得要命”的名声。可把三只馅饼分给十个人，每个人真正吃到嘴里的那一点儿，恐怕也只够把馋虫勾起来。
        - id: ch01-b05
          speaker: narrator
          text: >-
            安妮和戴安娜的上学路确实很美。安妮觉得，再好的想象力也不能把它变得更好了。绕大路太不浪漫。她们偏要走情人小径，经过柳池、紫罗兰谷，再穿过白桦小径。
        - id: ch01-b06
          speaker: narrator
          text: >-
            情人小径从绿山墙的果园下面伸出去，一直钻进树林，通到卡思伯特农场尽头。人们从这里赶牛去后面的牧场，冬天也从这里往家运柴。安妮来到绿山墙还不满一个月，就替它取好了名字。
        - id: ch01-b07
          speaker: anne
          text: >-
            倒不是真有一对对情人从那里走。是我和戴安娜读的书里有一条情人小径，我们也想有一条。这个名字多美，多浪漫呀！光靠想象，我们又不能真的把情人变到路上来。我喜欢那条小径，因为在那里，心里想什么都能大声说，谁也不会骂你疯疯癫癫。
        - id: ch01-b08
          speaker: narrator
          text: >-
            每天早晨，安妮独自走到小溪边，戴安娜在那里等她。两个姑娘一起走进枫枝搭成的拱廊，沿着小径向前。
        - id: ch01-b09
          speaker: anne
          text: >-
            枫树最爱跟人交朋友了。它们一直在你耳边沙沙地讲话，还悄悄告诉你秘密。
        - id: ch01-b10
          speaker: narrator
          text: >-
            到了乡野小桥，她们离开小径，穿过巴里家后面的田地，走过柳池。再往前，就是紫罗兰谷。那是安德鲁·贝尔先生的大树林里，一小片微微凹下去的绿地。
        - id: ch01-b11
          speaker: anne
          text: >-
            现在当然一朵紫罗兰也没有。可是戴安娜说，春天会开出几百万朵。哦，玛丽拉，您只要想一想，不就看见了吗？我光是想象都激动得喘不过气。“紫罗兰谷”是我起的名字。戴安娜说，给地方取好听的名字，没有人比得过我。能有一件事特别拿手，也很不错吧？
        - id: ch01-b12
          speaker: anne
          text: >-
            白桦小径倒是戴安娜起的。她想取名字，我就让给她了。不过，我敢说自己一定能想出一个比“白桦小径”更有诗意的。这个名字太普通，谁都想得出来。可那条小径，的确是世上最美的地方之一。
        - id: ch01-b13
          speaker: narrator
          text: >-
            安妮说得没错。就算是别人偶然走进去，也会觉得那里美极了。狭窄弯曲的小径顺着长坡一路向下，穿过贝尔先生的树林。阳光从一层层翡翠色的叶子间筛下来，干净得像钻石的心。路边一路长着纤细幼嫩的白桦，树干雪白，柔软的枝条轻轻伸展。蕨草、繁缕花、野铃兰和一簇簇鲜红的御膳莓密密挤在两旁。
        - id: ch01-b14
          speaker: narrator
          text: >-
            空气里总飘着一股好闻的辛香，鸟鸣像乐声一样落下来，头顶的林风也在树叶间低声说笑。只要安安静静地走，有时还能看见兔子从眼前蹦过小路。不过，要等安妮和戴安娜这样安静，怕是一百年也遇不上一次。到了谷底，小径接上大路。再沿着大路爬过那道云杉山坡，学校就在眼前了。
        - id: ch01-b15
          speaker: narrator
          text: >-
            埃文利学校是一座刷得雪白的房子，屋檐压得低低的，窗子却很宽。教室里摆着结实又舒服的老式书桌，每张桌子的盖子都能掀开。桌面上刻满了三代学生留下的姓名缩写，还有谁也说不清意思的神秘符号。校舍远离大路，后面有一片幽暗的冷杉林，林边还流着一条小溪。孩子们早晨把牛奶瓶泡进溪水，到午饭时再取出来，牛奶喝着还是又凉又新鲜。
        - id: ch01-b16
          speaker: narrator
          text: >-
            九月一日，玛丽拉看着安妮第一天去学校，心里藏着不少忧虑。这个孩子跟别人太不一样了。她能跟同学相处好吗？上课时，她究竟怎么管得住自己的舌头？没想到，事情比玛丽拉担心的顺利。那天傍晚，安妮兴高采烈地回到绿山墙，一进门就迫不及待地宣布了自己的看法。
        - id: ch01-b17
          speaker: anne
          text: >-
            我想，我会喜欢这所学校。不过那位老师，我可不怎么瞧得上。他总是卷自己的胡子，还对普丽茜·安德鲁斯眉来眼去。普丽茜已经十六岁了，正准备考入学考试，明年要去夏洛特敦的女王学院。蒂莉·博尔特说，老师迷她迷得不得了。
        - id: ch01-b18
          speaker: anne
          text: >-
            普丽茜的皮肤特别好，棕色卷发也梳得很漂亮。她坐在后排长凳上，老师也常坐过去，说是给她讲功课。可鲁比说，她看见老师往普丽茜的石板上写了什么。普丽茜看完，脸红得像甜菜，还咯咯直笑。鲁比才不信那跟功课有关系。
        - id: ch01-b19
          speaker: marilla
          text: >-
            安妮·雪莉，以后别再让我听见你这样议论老师。你去学校是学习，不是挑老师的毛病。他总有些东西能教你，你只管认真学。从今天起，不许再把他的闲话带回家，我不会纵着你这么做。希望你今天守规矩了。
        - id: ch01-b20
          speaker: anne
          text: >-
            我当然守规矩了，而且没您想得那么难。我和戴安娜坐在一起，座位就在窗边，还能望见闪光之湖。学校里有好多可爱的女孩，午饭时大家玩得特别开心。能和这么多女孩一起玩，真好。当然，我最喜欢的永远是戴安娜。我简直崇拜她。
        - id: ch01-b21
          speaker: anne
          text: >-
            我的功课比大家差得太远了。她们都读第五册，我还在读第四册，想想真丢脸。不过我很快就发现，她们谁也没有我这么会想象。今天上了阅读、地理、加拿大历史和听写。菲利普斯先生说我的拼写糟透了，还把石板举起来给全班看。上面全是他画的记号，我难堪得要命。他对新学生原本可以客气一点儿。
        - id: ch01-b22
          speaker: anne
          text: >-
            鲁比给了我一个苹果。索菲娅借我一张粉红卡片，上面写着“我可以送你回家吗”，明天我得还给她。蒂莉还让我戴了一下午她的珠子戒指。阁楼上旧针垫里的珍珠，我能拿几颗给自己做戒指吗？还有，简说米妮听见普丽茜告诉萨拉，我的鼻子长得很好看。这是我一辈子头一次听见别人夸我，感觉实在太奇妙了。玛丽拉，我的鼻子真的好看吗？我知道您会说实话。
        - id: ch01-b23
          speaker: marilla
          text: >-
            你的鼻子还算过得去。
        - id: ch01-b24
          speaker: narrator
          text: >-
            玛丽拉心里其实觉得，那只鼻子漂亮得很。可她绝没有说出来的打算。那已经是三个星期以前的事了，此后一直风平浪静。如今，在这个清爽的九月早晨，安妮和戴安娜轻快地走下白桦小径。她们大概是整个埃文利最快乐的两个小姑娘。
        - id: ch01-b25
          speaker: diana
          text: >-
            我猜吉尔伯特·布莱思今天会来。他整个夏天都在新不伦瑞克看表亲，星期六晚上才回来。安妮，他长得可帅了，还特别爱逗女孩，简直要把我们折腾死。
        - id: ch01-b26
          speaker: narrator
          text: >-
            听戴安娜的口气，比起没人来折腾，她好像更愿意让吉尔伯特折腾。
        - id: ch01-b27
          speaker: anne
          text: >-
            吉尔伯特·布莱思？门廊墙上写着他和朱莉娅·贝尔的名字，上面还写着很大的“请注意”，就是他吗？
        - id: ch01-b28
          speaker: diana
          text: >-
            就是他。不过我敢说，他才没有那么喜欢朱莉娅。我亲耳听见他说，他是数着朱莉娅脸上的雀斑背乘法表的。
        - id: ch01-b29
          speaker: anne
          text: >-
            哦，求你别提雀斑。我自己已经长了这么多，你还当着我说这个，太不体贴了。再说，把一个男孩和一个女孩的名字并排写在墙上，还叫人“请注意”，真是天底下最傻的事。我倒想看看，谁敢把我的名字跟哪个男孩写在一起。当然，反正也不会有人写。
        - id: ch01-b30
          speaker: narrator
          text: >-
            安妮叹了口气。她并不想让自己的名字出现在墙上，可一想到根本没人愿意写，心里还是有一点受打击。
        - id: ch01-b31
          speaker: diana
          text: >-
            别说傻话。那只是闹着玩儿。你也别太肯定，自己的名字永远不会出现在墙上。查理·斯隆可迷你了。他还告诉他妈妈，听清楚，是告诉他妈妈，说你是学校里最聪明的女孩。聪明总比漂亮好。
        - id: ch01-b32
          speaker: anne
          text: >-
            才不好呢。我宁可漂亮，也不想聪明。我讨厌查理·斯隆，眼睛鼓鼓的男孩，我可受不了。戴安娜·巴里，要是有人把我的名字和他的写在一起，我这一辈子都不会好过。不过，要是能一直拿全班第一，确实很叫人开心。
        - id: ch01-b33
          speaker: diana
          text: >-
            吉尔伯特从今天起也跟你同班。他向来都是第一。别看他快十四岁了，也只读第四册。四年前他爸爸生病，得去阿尔伯塔休养，他也跟去了。他们在那里住了三年，吉尔回来以前几乎没上过学。现在你想稳坐第一，可没那么容易了。
        - id: ch01-b34
          speaker: anne
          text: >-
            那才好呢。班里都是九岁、十岁的孩子，我赢了也没什么可骄傲。昨天拼“沸腾”，我升到了第一。原先第一是乔西·派伊，可她偷看书。菲利普斯先生没发现，他正忙着看普丽茜呢，可我看得清清楚楚。我冷冰冰地瞪了乔西一眼，她的脸一下红得像甜菜，最后还是拼错了。
        - id: ch01-b35
          speaker: diana
          text: >-
            派伊家的女孩个个都会作弊。昨天格蒂·派伊还把她的牛奶瓶塞进我在溪里的位置。你听说过这么过分的事吗？我现在已经不理她了。
        - id: ch01-b36
          speaker: narrator
          text: >-
            说着，两个人翻过栅栏，踏上了大路。
    - id: ch02
      title: 胡萝卜
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            菲利普斯先生在教室后面给普丽茜讲拉丁文时，戴安娜悄悄碰了碰安妮。
        - id: ch02-b02
          speaker: diana
          text: >-
            安妮，过道对面那个就是吉尔伯特·布莱思。快看看他，看你是不是也觉得他很帅。
        - id: ch02-b03
          speaker: narrator
          text: >-
            安妮一望过去，正好把他看得清清楚楚。吉尔伯特全神贯注地把鲁比·吉利斯那条长长的金发辫别在椅背上。他个子高，一头棕色卷发，淡褐色的眼睛里全是顽皮，嘴角歪着逗人的笑。
        - id: ch02-b04
          speaker: narrator
          text: >-
            没一会儿，鲁比站起来，要把算术题拿给老师看。她猛地跌回座位，轻轻尖叫一声，还以为头发要被连根扯掉了。全班都回头看她。菲利普斯先生狠狠瞪了一眼，鲁比吓得哭起来。吉尔伯特早把别针藏好，摆出世上最严肃的样子读历史。等教室安静下来，他却朝安妮滑稽地眨了一下眼。
        - id: ch02-b05
          speaker: anne
          text: >-
            你说得没错，吉尔伯特·布莱思是挺好看的。可他也太冒失了，居然对一个不认识的女孩眨眼，真没礼貌。
        - id: ch02-b06
          speaker: narrator
          text: >-
            真正的风波到了下午才开始。菲利普斯先生待在教室后面的角落，给普丽茜讲代数。其他学生差不多爱做什么就做什么。有人吃青苹果，有人说悄悄话，有人在石板上画画，还有人给蟋蟀套上细绳，让它们在过道里拉车。
        - id: ch02-b07
          speaker: narrator
          text: >-
            吉尔伯特想尽办法，要安妮看他一眼。偏偏安妮早把他忘得干干净净，连其他同学也不记得了。她托着下巴，望着西窗外露出的一小片蓝色湖水，整个人已经走进了绚丽的梦。除了自己的幻景，她什么也听不见，什么也看不见。
        - id: ch02-b08
          speaker: narrator
          text: >-
            吉尔伯特从没碰过这种事。他费力想叫一个女孩注意自己，她竟一点反应也没有。这个红头发、尖下巴、大眼睛的雪莉姑娘，跟学校里所有女孩都不一样。她非看他不可。
        - id: ch02-b09
          speaker: narrator
          text: >-
            吉尔伯特隔着过道伸出手，捏住安妮红辫子的末梢，直直拉出一臂远，又故意换成尖细的声音。
        - id: ch02-b10
          speaker: gilbert
          text: >-
            胡萝卜！胡萝卜！
        - id: ch02-b11
          speaker: narrator
          text: >-
            这一回，安妮狠狠看了他。她不光是看。她猛地站起来，刚才那些明亮的幻想顿时摔得粉碎。她怒视着吉尔伯特，眼里先闪起愤怒的火，紧接着又涌满同样愤怒的泪。
        - id: ch02-b12
          speaker: anne
          text: >-
            你这个又刻薄又讨厌的男孩！你怎么敢这样！
          emotion: angry
        - id: ch02-b13
          speaker: narrator
          text: >-
            啪的一声，安妮抡起石板，狠狠砸在吉尔伯特头上。石板当场裂开一道贯穿两边的缝。裂的是石板，不是吉尔伯特的脑袋。
        - id: ch02-b14
          speakers: [ruby, charlie, josie]
          ensemble: chorus
          text: >-
            哦！
          emotion: surprised
        - id: ch02-b15
          speaker: narrator
          text: >-
            埃文利学校的孩子向来爱看热闹，这一场尤其精彩。大家又惊讶又兴奋，齐齐叫出了声。戴安娜倒吸一口气。鲁比本来就容易激动，这时索性又哭起来。汤米·斯隆张着嘴，只顾盯着眼前这场风波，连他那队套着细绳的蟋蟀全逃走了也不知道。菲利普斯先生大步走下过道，一只手重重按在安妮肩上。
        - id: ch02-b16
          speaker: mr_phillips
          text: >-
            安妮·雪莉，这是怎么回事？
          emotion: angry
        - id: ch02-b17
          speaker: narrator
          text: >-
            安妮一句也不答。要她当着全校的人说，吉尔伯特叫她“胡萝卜”，实在不是血肉之躯能忍受的事。吉尔伯特倒勇敢地开了口。
        - id: ch02-b18
          speaker: gilbert
          text: >-
            是我不好，菲利普斯先生。我先捉弄了她。
        - id: ch02-b19
          speaker: narrator
          text: >-
            菲利普斯先生根本不理他。
        - id: ch02-b20
          speaker: mr_phillips
          text: >-
            看到我的学生发这么大的脾气，还故意报复别人，实在让我遗憾。既然进了我的班，就该改掉这些坏毛病。安妮，到讲台上来，站在黑板前，一直站到下午放学。
        - id: ch02-b21
          speaker: narrator
          text: >-
            听到这种处罚，安妮宁可挨一顿鞭子。羞辱像鞭子一样抽在她敏感的心上。她脸色发白，嘴唇紧紧闭着，却还是照做了。菲利普斯先生拿起粉笔，在她头顶的黑板上写了两句话。
        - id: ch02-b22
          speaker: mr_phillips
          text: >-
            安·雪莉的脾气非常坏。安·雪莉必须学会管住自己的脾气。
        - id: ch02-b23
          speaker: narrator
          text: >-
            写完以后，他又大声念了一遍，好让初级班那些看不懂手写字的孩子也听明白。那天下午剩下的时间，安妮一直站在那里，头上悬着那两句话。她没有哭，也没有低下头。怒火烧得太旺，反倒撑着她熬过了一阵又一阵羞辱带来的痛苦。
        - id: ch02-b24
          speaker: narrator
          text: >-
            她双颊通红，眼里全是怨愤。戴安娜同情地望着她，查理·斯隆气愤地朝她点头，乔西·派伊露出不怀好意的笑，可安妮对谁都不退缩。至于吉尔伯特，她一眼也不看。她再也不会看他，也永远不跟他说话了。
        - id: ch02-b25
          speaker: narrator
          text: >-
            放学后，安妮高高昂着红头发的脑袋，大步走出教室。吉尔伯特在门廊口拦住了她。
        - id: ch02-b26
          speaker: gilbert
          text: >-
            安妮，对不起。我不该拿你的头发开玩笑。我是真心道歉的。别一辈子都生我的气，好吗？
        - id: ch02-b27
          speaker: narrator
          text: >-
            安妮轻蔑地从他身边掠过。她不看他，也不让自己显出听见了的样子。回家路上，戴安娜终于轻声开口。她一半在责怪，一半又很佩服。要是换成自己，她觉得无论如何也拒绝不了吉尔伯特的恳求。
        - id: ch02-b28
          speaker: diana
          text: >-
            哦，安妮，你怎么能这样对他呢？
        - id: ch02-b29
          speaker: anne
          text: >-
            我永远不会原谅吉尔伯特·布莱思。还有，菲利普斯先生把我名字里的一个e漏掉了。戴安娜，那块铁已经刺进我的灵魂了。
          emotion: angry
        - id: ch02-b30
          speaker: narrator
          text: >-
            戴安娜完全不懂那句话，可她知道，一定有什么可怕的事发生了。
        - id: ch02-b31
          speaker: diana
          text: >-
            吉尔伯特只是拿你的头发开玩笑，你别这么在意。他对每个女孩都这样。他嫌我的头发太黑，叫过我十几次乌鸦。我可从没听说他向别的女孩道过歉。
        - id: ch02-b32
          speaker: anne
          text: >-
            乌鸦和胡萝卜怎么能一样？戴安娜，吉尔伯特·布莱思把我的感情伤得痛彻心扉。
          emotion: sad
        - id: ch02-b33
          speaker: narrator
          text: >-
            要是后面没再出事，这场风波也许会慢慢平息，安妮的心也不会一直痛下去。可事情一旦开了头，常常就会一件接着一件。
    - id: ch03
      title: 只有安妮受罚
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            埃文利的学生午休时常翻过山坡，穿过贝尔先生的大牧场，到他的云杉林里挖树胶。在那里，他们盯得见埃本·赖特的房子，菲利普斯先生就寄住在他家。一看见老师出门，孩子们才往学校飞跑。可是树林回学校的路，比赖特先生家的小路长了大约三倍。他们往往跑得气喘吁吁，还是要迟到三分钟。
        - id: ch03-b02
          speaker: narrator
          text: >-
            第二天，菲利普斯先生那阵时有时无的整顿劲头忽然又冒了出来。回家吃午饭前，他郑重向全班宣布，等他回来时，所有学生都必须坐在自己的座位上。谁敢迟到，谁就要接受处罚。
        - id: ch03-b03
          speaker: narrator
          text: >-
            所有男孩和几个女孩照旧去了贝尔先生的云杉林。每个人都真心打算只待一小会儿，挖够嚼一口的树胶就立刻离开。可树林太诱人，那些黄色的树胶粒也太诱人。大家一边挖，一边磨蹭，不知不觉越走越远。到最后，吉米·格洛弗已经站在一棵古老大云杉的顶端。他高声喊出老师来了，大家才猛然想起，原来时间已经过去了那么久。
        - id: ch03-b04
          speaker: narrator
          text: >-
            留在地上的女孩最先跑，总算刚好赶回教室，一秒也没剩。男孩们得从树上匆匆扭下来，所以回来得更晚。安妮根本没有挖树胶。她正在树林最远的一头闲逛，没腰的蕨丛围着她。她轻轻哼歌，头上戴着繁缕百合编的花环，像幽暗林地里一个野性的小女神，因此落在所有人后面。
        - id: ch03-b05
          speaker: narrator
          text: >-
            不过安妮跑得像小鹿一样快。她从树林那一头一路飞奔，竟恶作剧般地在学校门口追上男孩们，跟他们一起挤成一团，气喘吁吁地涌进教室。就在这时，菲利普斯先生正好在挂帽子。
        - id: ch03-b06
          speaker: narrator
          text: >-
            老师短暂的整顿热情已经过去。他不愿费事处罚十几个学生，可话既然说出了口，为了不让自己食言，又不得不做点什么。于是他朝教室里四处看了看，要挑一个替罪羊，目光一下落在安妮身上。她刚跌坐到座位上，还喘得上气不接下气，早忘了头上的百合花环。花环歪歪挂在一只耳朵上，让她看起来格外散乱不羁。
        - id: ch03-b07
          speaker: mr_phillips
          text: >-
            安妮·雪莉，既然你这么爱跟男孩们待在一起，今天下午我就让你如愿。把头上的花摘下来，坐到吉尔伯特·布莱思旁边去。
        - id: ch03-b08
          speaker: narrator
          text: >-
            男孩们偷偷笑起来。戴安娜心疼得脸色发白。她替安妮摘下花环，又用力握了握她的手。安妮呆呆看着老师，整个人仿佛变成了石头。
        - id: ch03-b09
          speaker: mr_phillips
          text: >-
            安妮，你听见我说话了吗？
        - id: ch03-b10
          speaker: anne
          text: >-
            听见了，先生。可我没想到，您真的要我那么做。
        - id: ch03-b11
          speaker: mr_phillips
          text: >-
            我当然是认真的。现在就照我说的做。
        - id: ch03-b12
          speaker: narrator
          text: >-
            他仍用那种讥讽的腔调说话。所有孩子都讨厌那腔调，安妮尤其受不了。它像鞭梢一样，正抽在她的伤口上。有一瞬间，她看起来真想违抗。可她也明白，自己没有别的选择。于是她傲然站起来，跨过过道，在吉尔伯特旁边坐下，接着把脸深深埋进书桌上的双臂里。
        - id: ch03-b13
          speaker: narrator
          text: >-
            鲁比看见了她低头前的脸。放学路上，鲁比告诉大家，自己从没见过那样一张脸，白得吓人，上面还冒着可怕的小红点。
        - id: ch03-b14
          speaker: narrator
          text: >-
            对安妮来说，这简直是世界末日。十几个同样迟到的人里只罚她一个，已经够糟。让她跟一个男孩坐在一起，更加糟糕。那个男孩偏偏还是吉尔伯特，这就像在伤口上又撒了一把盐，实在忍无可忍。羞耻、愤怒和屈辱在她的整个身心里不停翻滚。她觉得自己承受不了，也根本不必勉强去试。
        - id: ch03-b15
          speaker: narrator
          text: >-
            开头，别的学生都在看她，低声议论，咯咯地笑，还彼此推搡。可安妮始终不肯抬头。吉尔伯特也只顾演算一道道分数题，仿佛全部心思都放在题目上，而且只放在题目上。没过多久，大家各忙各的，也就把安妮忘了。
        - id: ch03-b16
          speaker: narrator
          text: >-
            历史班出去上课时，安妮本该起身，可她动也不动。菲利普斯先生叫全班以前，正写几句“献给普丽西拉”的诗，脑子里还惦记着一个怎么也押不上的韵，竟没发现少了安妮。
        - id: ch03-b17
          speaker: narrator
          text: >-
            有一回，趁别人都没留意，吉尔伯特从书桌里拿出一颗粉红色的心形糖，上面用金字写着“你真甜”。他把糖悄悄塞进安妮弯着的手臂下面。安妮马上站起来，用两根指尖小心拈起那颗粉红心，丢到地上，再用鞋跟碾成粉末。然后，她又趴回原来的姿势，还是不肯看吉尔伯特一眼。
        - id: ch03-b18
          speaker: narrator
          text: >-
            放学后，安妮大步走回自己的书桌，故意把里面的东西一样样拿出来。课本、写字簿、钢笔、墨水、《圣经》和算术书，全都整整齐齐地堆在那块裂开的石板上。直到两人走上大路，戴安娜才敢问她。
        - id: ch03-b19
          speaker: diana
          text: >-
            安妮，你为什么把所有东西都带回家？
        - id: ch03-b20
          speaker: anne
          text: >-
            因为我再也不来上学了。
        - id: ch03-b21
          speaker: narrator
          text: >-
            戴安娜倒抽一口气，瞪着安妮，想知道她是不是当真。
        - id: ch03-b22
          speaker: diana
          text: >-
            玛丽拉会答应让你待在家里吗？
        - id: ch03-b23
          speaker: anne
          text: >-
            她一定得答应。我再也不到这个人教的学校来了。
        - id: ch03-b24
          speaker: diana
          text: >-
            哦，安妮，你这样太狠心了。那我怎么办？菲利普斯先生准会让我和讨厌的格蒂·派伊坐一起。她现在正好一个人坐，我知道老师会这么安排的。回来上学吧，安妮。
          emotion: sad
        - id: ch03-b25
          speaker: anne
          text: >-
            戴安娜，为了你，世上的事我差不多什么都肯做。要是对你有一点好处，就算有人把我撕成一块一块，我也愿意。可这件事真的不行。求你别再劝了，你这样会把我的灵魂折磨得支离破碎。
          emotion: sad
        - id: ch03-b26
          speaker: diana
          text: >-
            可你会错过好多好玩的事。我们准备在溪边盖一座最漂亮的新房子。下星期还要玩球，你从来没玩过，真的特别刺激。大家还要学一首新歌，简已经开始练了。艾丽斯下星期会带一本新的《潘西》来，我们要坐在溪边，一人一章轮流朗读。安妮，你最喜欢大声读故事了。
          emotion: sad
        - id: ch03-b27
          speaker: narrator
          text: >-
            这些话一点也没动摇安妮。她已经下定决心，绝不再去菲利普斯先生教的学校。回到家，她把这个决定告诉了玛丽拉。
    - id: ch04
      title: 不再回学校
      blocks:
        - id: ch04-b01
          speaker: marilla
          text: >-
            胡说八道。
        - id: ch04-b02
          speaker: anne
          text: >-
            这才不是胡说。玛丽拉，您还不懂吗？我受到了侮辱。
        - id: ch04-b03
          speaker: marilla
          text: >-
            什么侮辱不侮辱的！明天照常上学去。
        - id: ch04-b04
          speaker: anne
          text: >-
            哦，不。我不会回去了，玛丽拉。我会在家念功课，也会尽力做一个最听话的孩子。只要能办到，我连嘴巴都一直闭紧。可是我向您保证，我绝不会再回学校。
        - id: ch04-b05
          speaker: narrator
          text: >-
            玛丽拉从安妮的小脸上，看见了一种近乎顽固不化的神情。她知道，要把这股犟劲儿压下去，准得大费一番周章。于是，她很明智地停了下来，暂时没有再说下去。
        - id: ch04-b06
          speaker: narrator
          text: >-
            玛丽拉打算晚上找蕾切尔谈谈。现在跟安妮讲道理没有用，这孩子还在气头上。而且只要她打定主意，恐怕能犟得吓人。照安妮讲的情况看，菲利普斯先生处理这件事确实太蛮横，可玛丽拉绝不能当着她的面这么说。林德太太送过十个孩子去学校，总该懂得一些门道。何况到了这时候，她多半早已听说了整件事。
        - id: ch04-b07
          speaker: narrator
          text: >-
            玛丽拉找到林德太太时，她像平常一样，又勤快又快活，手里正绗着被子。
        - id: ch04-b08
          speaker: marilla
          text: >-
            我想，你应该知道我为什么来吧。
        - id: ch04-b09
          speaker: narrator
          text: >-
            玛丽拉说这话时有些难为情。林德太太点了点头。
        - id: ch04-b10
          speaker: rachel
          text: >-
            我猜，是为了安妮在学校闹出的那场风波。蒂莉·博尔特放学路过我这里，已经把事情都说了。
        - id: ch04-b11
          speaker: marilla
          text: >-
            我真不知道该拿她怎么办。她咬死了不肯再去学校。我从没见过哪个孩子能气成这样。她刚开始上学，我就在等着出事。我早知道，不可能一直这么顺利。她太敏感，也太容易激动。蕾切尔，你说我该怎么办？
        - id: ch04-b12
          speaker: rachel
          text: >-
            既然你来问我，玛丽拉，要是换成我，开头会顺着她一点儿。我看这一次，是菲利普斯先生做错了。当然，这话不能说给孩子听。昨天安妮发了脾气，老师处罚她，没有错。可今天不一样。迟到的人全都该罚，不能只挑安妮一个。
        - id: ch04-b13
          speaker: rachel
          text: >-
            再说，为了惩罚一个女孩，就叫她跟男孩坐在一起，我也不赞成。那样不成体统。蒂莉气坏了，从头到尾都替安妮说话。她还说，班里的学生全都站在安妮这一边，觉得老师这样处罚很不公平。说来真怪，安妮在孩子们中间好像很受欢迎。我原先可没想到，她会这么快就跟大家相处得这样好。
        - id: ch04-b14
          speaker: marilla
          text: >-
            这么说，你真觉得我该让她留在家里？
          emotion: surprised
        - id: ch04-b15
          speaker: rachel
          text: >-
            对。只要她自己不提，我就一句学校的事也不说。你放心，不出一两个星期，她的气准会消。到时候谁也不用劝，她自己就想回去了。可你现在硬逼她去，天知道她又会冒出什么怪念头，发多大的脾气，只会添更多麻烦。越不把这事当回事，越好。
        - id: ch04-b16
          speaker: rachel
          text: >-
            她少去几天，也耽误不了多少功课。菲利普斯先生根本不会教书，班里让他管得一团糟。年纪小的学生，他一点不管，只顾着教那几个要考女王学院的大孩子。要不是他叔叔当校董，他绝不可能再教一年。他叔叔还不是普通校董，是那个说了算的人，另外两个全都听他的。说真的，这座岛上的教育再这样下去，我都不知道会变成什么样。
        - id: ch04-b17
          speaker: narrator
          text: >-
            林德太太说完，郑重地摇了摇头。看她脸上的神情，仿佛只要让她来掌管全省的教育制度，事情一定会办得好得多。
    - id: ch05
      title: 秋暮里的眼泪
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: >-
            玛丽拉采纳了林德太太的办法。从那以后，再也没人对安妮提回学校的事。安妮留在家里念功课、做家务，也在寒凉的紫色秋暮里跟戴安娜玩耍。
        - id: ch05-b02
          speaker: narrator
          text: >-
            可她在路上碰见吉尔伯特，或在主日学校见到他，总会带着冰冷的轻蔑从他身边走过。吉尔伯特显然一心想跟她和好，却怎么也融不开那层寒冰。就连戴安娜亲自出面替他说情，也完全没有用。安妮分明已经下定决心，要恨吉尔伯特·布莱思一辈子，而且丝毫没有动摇。
        - id: ch05-b03
          speaker: narrator
          text: >-
            她有多恨吉尔伯特，就有多爱戴安娜。安妮那颗热烈的小小心灵，无论爱谁还是恨谁，都不会只付出一点点，感情总是同样强烈。一天傍晚，玛丽拉提着满满一篮苹果从果园回来，看见安妮独自坐在东窗边，在渐渐浓起来的暮色里伤心地哭。
        - id: ch05-b04
          speaker: marilla
          text: >-
            安妮，这一次又怎么了？
        - id: ch05-b05
          speaker: anne
          text: >-
            是为了戴安娜。玛丽拉，我太爱她了，没有她，我根本活不下去。可我清清楚楚地知道，等我们长大，她一定会嫁人，然后离开我。到时候我该怎么办？我恨她将来的丈夫，我简直恨死他了。
          emotion: sad
        - id: ch05-b06
          speaker: anne
          text: >-
            我已经把所有事都想出来了，连婚礼上的每一件事都看见了。戴安娜穿着雪白的礼服，戴着头纱，美丽又高贵，像一位王后。我给她做伴娘，也穿着漂亮的泡泡袖裙子。可是我脸上虽然在笑，里面却藏着一颗正在破碎的心。然后，我就得跟戴安娜告……别……
          emotion: sad
        - id: ch05-b07
          speaker: narrator
          text: >-
            说到这里，安妮再也说不下去，哭得越发伤心。玛丽拉赶紧转过身，想藏住不断抽动的嘴角，可一点用也没有。她跌坐在离自己最近的一把椅子上，忽然爆发出一阵响亮的笑声。玛丽拉平时几乎从不这样开怀大笑。马修正从院子里走过，听见笑声，惊得停下脚步。他几时听玛丽拉这样笑过？
        - id: ch05-b08
          speaker: marilla
          text: >-
            好了，安妮·雪莉。你要是非得借件烦恼来发愁，看在老天的分上，也借一件离现在近一点儿的吧。你的想象力确实够丰富，这一点，我现在总算相信了。
