  chapters:
    - id: ch01
      title: The Loveliest Way to School
      blocks:
        - id: ch01-b01
          speaker: anne_shirley
          text: "What a wonderful day! Isn't it good just to be alive today? I feel sorry for everyone who hasn't been born yet, because they'll miss it. They'll have fine days of their own, but they'll never have this one. And having such a beautiful walk to school makes it even better, doesn't it?"
          emotion: happy
        - id: ch01-b02
          speaker: diana_barry
          text: "It's much nicer than taking the road. The road is so hot and dusty."
        - id: ch01-b03
          speaker: narrator
          text: "Diana peeked into her lunch basket while she spoke. She was trying to work out how many bites each of ten girls would get from three juicy raspberry tarts. The Avonlea schoolgirls always shared their lunches. A girl who ate three tarts by herself, or even shared them with only her best friend, would be called terribly mean forever. Still, dividing three tarts ten ways gave everyone just enough to want more."
        - id: ch01-b04
          speaker: narrator
          text: "Anne and Diana truly did have a beautiful walk. Anne thought even imagination couldn't improve it. The main road was hopelessly ordinary. Their route led through Lover's Lane, past Willowmere and Violet Vale, then down the Birch Path. That was romance."
        - id: ch01-b05
          speaker: narrator
          text: "Lover's Lane began below the Green Gables orchard and ran deep into the woods at the far end of the Cuthbert farm. Cows took that path to the back pasture, and wagons hauled wood along it in winter. Before Anne had lived at Green Gables for a month, she'd given it its new name."
        - id: ch01-b06
          speaker: anne_shirley
          text: "No lovers actually walk there, Marilla. But Diana and I are reading a magnificent book with a Lover's Lane in it, and we wanted one too. It's such a romantic name. We can't imagine the lovers into the lane, you know. I like it because I can think out loud there and nobody calls me crazy."
        - id: ch01-b07
          speaker: narrator
          text: "Each morning, Anne walked alone to the brook, where Diana met her. Together they followed the lane beneath an arch of maple leaves."
        - id: ch01-b08
          speaker: anne_shirley
          text: "Maples are such friendly trees. They're always whispering and rustling to you."
        - id: ch01-b09
          speaker: narrator
          text: "At a little wooden bridge, the girls left the lane. They crossed Mr. Barry's back field, passed Willowmere, and came to Violet Vale, a green hollow beneath Mr. Andrew Bell's great woods."
        - id: ch01-b10
          speaker: anne_shirley
          text: "There aren't any violets now, Marilla, but Diana says millions grow there in spring. Can't you almost see them? It takes my breath away. I named it Violet Vale, and Diana says nobody can beat me at finding fancy names. It's nice to be clever at something. Diana named the Birch Path because she wanted to. I let her, though I could have thought of something more poetic. Anybody could come up with Birch Path. But it is one of the prettiest places in the world."
        - id: ch01-b11
          speaker: narrator
          text: "Other people who happened upon the Birch Path agreed with Anne. It was narrow and winding, and it curled down a long hill through Mr. Bell's woods. Sunlight passed through so many green layers overhead that it reached the ground as clear and perfect as the heart of a diamond. Slender young birches bordered the entire path, with smooth white trunks and graceful branches. Ferns, starflowers, wild lilies of the valley, and bright red pigeonberries grew thickly beside them. The air always smelled wonderfully spicy. Birds sang nearby, while the wind murmured and laughed in the branches overhead. Now and then, a quiet walker might see a rabbit skip across the path. Anne and Diana managed to be that quiet about once in a blue moon. Down in the valley, the path met the main road. From there, the school was only a short climb up the spruce hill."
        - id: ch01-b12
          speaker: narrator
          text: "Avonlea school was a low, whitewashed building with wide windows and eaves close to the ground. Inside stood comfortable, sturdy desks of the old-fashioned kind, with lids that opened and shut. Three generations of schoolchildren had carved their initials and mysterious little signs all over those lids. The building sat well back from the road. Behind it, a dark fir wood sheltered a brook. Each morning, the children carried their bottles of milk to the water and left them there, cool and sweet, until lunchtime."
        - id: ch01-b13
          speaker: narrator
          text: "On Anne's first school day in September, Marilla watched her leave with worries she kept to herself. Anne was certainly unusual. Would the other children accept her? And could Anne possibly stay quiet through lessons? That evening, Anne came home delighted, and Marilla learned that school had gone better than she feared."
        - id: ch01-b14
          speaker: anne_shirley
          text: "I believe I'll like school here. I don't care much for the teacher, though. He's always twisting his mustache and looking fondly at Prissy Andrews. She's practically grown up. She's sixteen, and next year she'll take the entrance exam for Queen's Academy in Charlottetown. Tillie Boulter says Mr. Phillips is completely in love with her. Prissy has a beautiful complexion and curly brown hair, and she puts it up so elegantly. She sits on the long back seat, and Mr. Phillips sits there most of the time. He claims he's explaining her lessons. But Ruby Gillis saw him write something on Prissy's slate. Prissy turned as red as a beet and giggled when she read it. Ruby doesn't think it was about schoolwork at all."
        - id: ch01-b15
          speaker: marilla_cuthbert
          text: "Anne Shirley, I don't want to hear you speak about your teacher that way again. You go to school to learn, not to criticize him. He can certainly teach you something, so mind your own lessons. And don't come home carrying tales about him. I won't encourage that. Were you well behaved?"
        - id: ch01-b16
          speaker: anne_shirley
          text: "I certainly was. It wasn't nearly as hard as you might expect. I sit beside Diana, right by the window, and we can see the Lake of Shining Waters. There are so many nice girls, and we had marvelous fun at lunchtime. I love having lots of girls to play with, though Diana will always be my favorite. I adore her. I'm terribly behind everyone else. They're in the fifth reader, and I'm only in the fourth. It's rather disgraceful. But none of them has an imagination like mine. I discovered that right away."
        - id: ch01-b17
          speaker: anne_shirley
          text: "We studied reading, geography, Canadian history, and dictation. Mr. Phillips called my spelling disgraceful and held up my slate for everyone to see all the mistakes. I was terribly embarrassed. He could have been more polite to a stranger. Ruby gave me an apple. Sophia Sloane lent me a beautiful pink card that says, 'May I see you home?' I have to return it tomorrow. Tillie let me wear her bead ring all afternoon. May I use the pearl beads from that old pincushion in the attic to make a ring?"
        - id: ch01-b18
          speaker: anne_shirley
          text: "Oh, and Jane Andrews told me Minnie MacPherson heard Prissy Andrews tell Sara Gillis that I have a very pretty nose. That's the first compliment I've ever had. You can't imagine how strange it felt. Marilla, is my nose truly pretty? I know you'll be honest."
        - id: ch01-b19
          speaker: marilla_cuthbert
          text: "Your nose is fine."
        - id: ch01-b20
          speaker: narrator
          text: "Privately, Marilla thought Anne's nose was remarkably pretty. She had no intention of giving Anne the pleasure of hearing it. That first school day was three weeks behind them now, and everything had gone smoothly since. On this crisp September morning, Anne and Diana skipped lightly down the Birch Path. There could hardly have been two happier girls anywhere in Avonlea."
    - id: ch02
      title: Carrots
      blocks:
        - id: ch02-b01
          speaker: diana_barry
          text: "I expect Gilbert Blythe will be at school today. He's been in New Brunswick visiting his cousins all summer, and he only got home Saturday night. He's awfully handsome, Anne. And he teases girls dreadfully. He makes our lives miserable."
        - id: ch02-b02
          speaker: narrator
          text: "Diana sounded as if a little torment from Gilbert might be better than none at all."
        - id: ch02-b03
          speaker: anne_shirley
          text: "Gilbert Blythe? Is that the name written beside Julia Bell's on the porch wall, with 'Take Notice' over it?"
        - id: ch02-b04
          speaker: diana_barry
          text: "Yes, but I'm certain he doesn't like Julia all that much. I heard him say he learned his multiplication tables by counting her freckles."
        - id: ch02-b05
          speaker: anne_shirley
          text: "Please don't mention freckles when I have so many. It isn't kind. And those take-notices about boys and girls are perfectly silly. I'd like to see anyone dare put my name beside a boy's. Not that anyone ever would."
        - id: ch02-b06
          speaker: narrator
          text: "Anne sighed. She didn't really want her name on the wall, but knowing no one would write it there was rather humiliating. Diana's dark eyes and glossy hair had won so many schoolboy hearts that her name appeared in half a dozen take-notices."
        - id: ch02-b07
          speaker: diana_barry
          text: "Don't be silly. It's only a joke. And your name may appear there yet. Charlie Sloane is completely taken with you. He even told his mother that you're the smartest girl in school. His own mother, Anne! Being smart is better than being pretty."
        - id: ch02-b08
          speaker: anne_shirley
          text: "No, it isn't. I'd much rather be pretty than clever. And I cannot stand Charlie Sloane. His eyes bulge. If somebody paired my name with his, I would never recover, Diana Barry. Still, I do enjoy being at the top of the class."
        - id: ch02-b09
          speaker: diana_barry
          text: "Gilbert will be in your class now, and he's accustomed to coming first. He's almost fourteen, but he's only in the fourth reader. Four years ago his father got sick and went to Alberta for his health. Gilbert went with him and hardly attended school for three years. Now that he's back, keeping first place won't be so easy for you."
        - id: ch02-b10
          speaker: anne_shirley
          text: "Good. I couldn't be truly proud of beating children who are only nine or ten. Yesterday I moved up by spelling 'ebullition.' Josie Pye was first, but she looked in her book. Mr. Phillips missed it because he was watching Prissy Andrews, but I saw. I gave Josie the coldest, most scornful look I could manage. She went red as a beet and misspelled the word anyway."
        - id: ch02-b11
          speaker: diana_barry
          text: "Every Pye girl cheats. Yesterday Gertie Pye put her milk bottle in my place in the brook. Can you believe it? I won't speak to her now."
          emotion: angry
        - id: ch02-b12
          speaker: narrator
          text: "They climbed the fence by the main road and went on to school. Later, while Mr. Phillips listened to Prissy Andrews recite Latin at the back of the room, Diana leaned close to Anne."
        - id: ch02-b13
          speaker: diana_barry
          text: "That's Gilbert Blythe across the aisle. Look at him and tell me he isn't handsome."
        - id: ch02-b14
          speaker: narrator
          text: "Anne looked, and she had plenty of time to study him. Gilbert was secretly fastening Ruby Gillis's long yellow braid to the back of her seat with a pin. He was a tall boy with curly brown hair, mischievous hazel eyes, and a mouth already bent into a teasing smile. A moment later, Ruby stood to carry a math problem to the teacher. The pinned braid pulled her backward, and she fell into her seat with a little scream. She thought her hair had been torn out by the roots. Every face turned toward her. Mr. Phillips stared so sternly that Ruby began to cry. By then Gilbert had hidden the pin. He bent over his history book with the most serious expression in the world. When the excitement finally died away, he looked straight at Anne and gave her a wink so ridiculous that no words could have described it."
        - id: ch02-b15
          speaker: anne_shirley
          text: "Your Gilbert Blythe is handsome, but he's far too bold. A boy shouldn't wink at a girl he doesn't know."
        - id: ch02-b16
          speaker: narrator
          text: "The real trouble waited until afternoon. Mr. Phillips stayed in the back corner, explaining an algebra problem to Prissy Andrews. With his attention elsewhere, the rest of the students did almost anything they pleased. Some ate green apples. Others whispered, drew pictures on their slates, or drove crickets tied to strings up and down the aisle. Gilbert tried again and again to make Anne look his way, but he failed completely. At that moment she had forgotten that Gilbert existed. She had forgotten every other child in Avonlea school too. With her chin resting in her hands, she gazed through the west window at one blue glimpse of the Lake of Shining Waters. Her mind was far away in a splendid dreamland, where she could see and hear nothing but her own wonderful imaginings."
        - id: ch02-b17
          speaker: narrator
          text: "Gilbert wasn't used to working for a girl's attention and getting none. The red-haired Shirley girl, with her pointed chin and extraordinary eyes, was going to look at him. He reached across the aisle, lifted the end of her long braid, and held it out."
        - id: ch02-b18
          speaker: gilbert_blythe
          text: "Carrots! Carrots!"
        - id: ch02-b19
          speaker: narrator
          text: "Anne looked then. She leaped to her feet as her lovely daydream shattered. Her eyes flashed, and angry tears quickly drowned the fire in them."
        - id: ch02-b20
          speaker: anne_shirley
          text: "You hateful, cruel boy! How dare you?"
          emotion: angry
        - id: ch02-b21
          speaker: narrator
          text: "Thwack! Anne brought her slate down on Gilbert's head and split the slate clean across. Gilbert's head survived. Avonlea school loved a scene, and this was an excellent one."
        - id: ch02-b22
          speakers: [student_1, student_2, student_3]
          ensemble: chorus
          text: "Oh!"
          emotion: surprised
        - id: ch02-b23
          speaker: narrator
          text: "The children sounded horrified and delighted at once. Diana gasped. Ruby began to cry again, and Tommy Sloane stared so hard that all his harnessed crickets escaped. Mr. Phillips marched down the aisle and put a heavy hand on Anne's shoulder."
        - id: ch02-b24
          speaker: mr_phillips
          text: "Anne Shirley, explain yourself. What does this mean?"
          emotion: angry
        - id: ch02-b25
          speaker: narrator
          text: "Anne said nothing. She could not tell the whole school that Gilbert had called her carrots. Gilbert answered for her."
        - id: ch02-b26
          speaker: gilbert_blythe
          text: "It was my fault, Mr. Phillips. I was teasing her."
        - id: ch02-b27
          speaker: narrator
          text: "Mr. Phillips ignored him."
        - id: ch02-b28
          speaker: mr_phillips
          text: "I am very sorry to see one of my pupils show such a vicious temper. Anne, stand on the platform in front of the blackboard for the rest of the afternoon."
        - id: ch02-b29
          speaker: narrator
          text: "He spoke as though being his pupil should have removed every bad feeling from an imperfect child. Anne would rather have been whipped. Her face went white and still, but she obeyed. Mr. Phillips took a piece of chalk and wrote above her head. Then he read the words aloud, even for the youngest children who couldn't read handwriting."
        - id: ch02-b30
          speaker: mr_phillips
          text: "Ann Shirley has a very bad temper. Ann Shirley must learn to control her temper."
        - id: ch02-b31
          speaker: narrator
          text: "Anne stood beneath those words for the whole long afternoon. She didn't cry, and she never lowered her head. The anger inside her was still hot enough to hold her upright through every painful moment of shame. With resentful eyes and cheeks blazing red, she faced Diana's sympathetic gaze, Charlie Sloane's angry nods, and Josie Pye's spiteful smiles. Gilbert might as well not have been in the room. Anne refused even to turn her eyes toward him. She would never look at him again. She would never speak to him either."
        - id: ch02-b32
          speaker: narrator
          text: "When class was dismissed, Anne marched out with her red head high. Gilbert caught up with her at the porch door."
        - id: ch02-b33
          speaker: gilbert_blythe
          text: "Anne, I'm terribly sorry I teased you about your hair. I truly am. Please don't stay angry forever."
        - id: ch02-b34
          speaker: narrator
          text: "Anne swept past without looking at him or showing that she'd heard. On the road, Diana spoke with both reproach and admiration. She knew she could never have resisted such an apology."
        - id: ch02-b35
          speaker: diana_barry
          text: "Oh, Anne, how could you ignore him?"
        - id: ch02-b36
          speaker: anne_shirley
          text: "I will never forgive Gilbert Blythe. And Mr. Phillips left the e off my name. The iron has entered my soul, Diana."
        - id: ch02-b37
          speaker: narrator
          text: "Diana had no idea what that meant, but she understood it was dreadful."
        - id: ch02-b38
          speaker: diana_barry
          text: "Try not to mind what Gilbert said about your hair. He teases every girl. He calls me a crow because my hair is black. He's done it a dozen times, and I've never heard him apologize before."
        - id: ch02-b39
          speaker: anne_shirley
          text: "Being called a crow is nothing like being called carrots. Gilbert Blythe has wounded my feelings excruciatingly, Diana."
    - id: ch03
      title: A Second Humiliation
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: "The quarrel might have faded if no new trouble had followed. But once events begin, they often keep coming. At noon, the Avonlea students often crossed the hill and Mr. Bell's broad pasture to gather spruce gum in his grove. From among the trees, they could keep watch on Eben Wright's house, where Mr. Phillips boarded. The instant they saw their teacher come outside, they raced back toward the schoolhouse. Unfortunately, their route was about three times longer than Mr. Wright's lane. That meant they often burst through the school door out of breath and gasping, about three minutes too late."
        - id: ch03-b02
          speaker: narrator
          text: "The next day, Mr. Phillips felt a sudden urge to improve the school. Before leaving for dinner, he warned that every student must be seated when he returned. Latecomers would be punished."
        - id: ch03-b03
          speaker: narrator
          text: "All the boys and several girls went to the spruce grove as usual. Every one of them fully intended to stay only long enough to pick a single chew of gum. But spruce groves have a way of making people linger, and those yellow drops of gum were hard to resist. The children picked a little more, wandered a little farther, and let the minutes slip past. As usual, the first thing that reminded them how late it was came from Jimmy Glover, high in the top of a great old spruce."
        - id: ch03-b04
          speaker: jimmy_glover
          text: "The master's coming!"
        - id: ch03-b05
          speaker: narrator
          text: "The girls who were standing on the ground got away first. They reached the schoolhouse with no more than a second to spare. The boys came later because they had to hurry down from the trees. Anne was last of everyone. She hadn't been picking gum at all. She had wandered happily to the far end of the grove, where the ferns rose to her waist. She sang softly to herself with a wreath of rice lilies on her hair, looking like some wild spirit who belonged to those shadowy places. Luckily, Anne could run like a deer. She raced after the boys, caught them at the door, and was swept inside among them just as Mr. Phillips began to hang up his hat."
        - id: ch03-b06
          speaker: narrator
          text: "By then, Mr. Phillips's brief desire to reform the school had passed. He didn't want the trouble of punishing a dozen students. Still, he'd made a threat in front of everyone, so he had to do something to keep his word. He looked around for one person to blame and settled on Anne. She had dropped into her seat and was still gasping for breath. The forgotten wreath hung crookedly over one ear, which made her look especially wild and untidy."
        - id: ch03-b07
          speaker: mr_phillips
          text: "Anne Shirley, you seem to enjoy the boys' company, so you may have more of it this afternoon. Remove those flowers and go sit beside Gilbert Blythe."
        - id: ch03-b08
          speaker: narrator
          text: "The boys snickered. Diana turned pale with pity. She pulled the wreath from Anne's hair and squeezed her hand. Anne stared at Mr. Phillips like a stone figure."
        - id: ch03-b09
          speaker: mr_phillips
          text: "Did you hear me, Anne?"
        - id: ch03-b10
          speaker: anne_shirley
          text: "Yes, sir. But I didn't think you could truly mean it."
        - id: ch03-b11
          speaker: mr_phillips
          text: "I most certainly do. Obey me now."
        - id: ch03-b12
          speaker: narrator
          text: "His scornful voice struck Anne in the sorest place. Every child in the room hated that tone, but Anne hated it most of all. For one moment, she looked ready to refuse him. Then she understood there was no escape. She rose with as much dignity as she could, crossed the aisle, sat beside Gilbert, and buried her face in her folded arms on the desk. Ruby Gillis caught one glimpse before it disappeared. On the way home, Ruby told everyone she'd honestly never seen anything like Anne's face. It was terribly white, she said, with frightening little spots of red."
        - id: ch03-b13
          speaker: narrator
          text: "To Anne, the world had ended. Being chosen for punishment from a dozen equally guilty students was bad enough. Being sent to sit beside a boy made it worse. But that boy was Gilbert Blythe, and this final insult went beyond anything she thought she could bear. She felt that trying to endure it would be useless. Shame, anger, and humiliation seemed to boil through every part of her."
        - id: ch03-b14
          speaker: narrator
          text: "At first, the other students stared, whispered, giggled, and nudged one another. Anne never raised her head, while Gilbert worked at fractions as if nothing else existed. Soon the class lost interest. When the history students were called, Anne should have joined them, but she stayed where she was. Mr. Phillips had been writing verses to Priscilla and was still hunting for a rhyme, so he never noticed."
        - id: ch03-b15
          speaker: narrator
          text: "Once, when no one was watching, Gilbert took a little pink candy heart from his desk. A gold message on it read, 'You are sweet.' He quietly slipped the heart under Anne's bent arm. Anne rose from her seat. Holding the candy delicately between the very tips of her fingers, she dropped it on the floor and ground it into powder beneath her heel. Then she sat down, buried her face once more, and never gave Gilbert so much as a glance."
        - id: ch03-b16
          speaker: narrator
          text: "At the end of school, Anne returned to her own desk. Very deliberately, she removed everything inside it. Books, writing tablet, pen and ink, Testament, and arithmetic book all went into a neat pile on her cracked slate. Diana waited until they were safely on the road before asking why."
        - id: ch03-b17
          speaker: diana_barry
          text: "Anne, why are you carrying all your school things home?"
        - id: ch03-b18
          speaker: anne_shirley
          text: "Because I'm never coming back to school."
        - id: ch03-b19
          speaker: narrator
          text: "Diana gasped and studied Anne's face to see whether she meant it."
        - id: ch03-b20
          speaker: diana_barry
          text: "Will Marilla allow you to stay home?"
        - id: ch03-b21
          speaker: anne_shirley
          text: "She'll have to. I will never return to that man's school."
        - id: ch03-b22
          speaker: diana_barry
          text: "Oh, Anne, that's so mean! What will happen to me? Mr. Phillips will make me sit with horrible Gertie Pye because her seat is empty. I know he will. Please come back."
          emotion: sad
        - id: ch03-b23
          speaker: anne_shirley
          text: "Diana, I'd do almost anything on earth for you. I'd let someone tear me apart if it would help you. But I cannot do this, so please stop asking. You're tearing at my very soul."
          emotion: sad
        - id: ch03-b24
          speaker: diana_barry
          text: "Think of everything you'll miss. We're going to build the most beautiful new playhouse by the brook. Next week we'll play ball, and you've never tried it. It's tremendously exciting. We're learning a new song too. Jane Andrews is practicing it already. And Alice Andrews will bring a new Pansy book next week. We'll sit by the brook and take turns reading chapters aloud. You love reading aloud, Anne."
          emotion: sad
        - id: ch03-b25
          speaker: narrator
          text: "Nothing changed Anne's mind. She would not return to Mr. Phillips's school. As soon as she reached home, she told Marilla."
        - id: ch03-b26
          speaker: marilla_cuthbert
          text: "Nonsense."
        - id: ch03-b27
          speaker: anne_shirley
          text: "It is not nonsense. Can't you understand, Marilla? I've been insulted."
        - id: ch03-b28
          speaker: marilla_cuthbert
          text: "Insulted, fiddlesticks. You'll attend school tomorrow like always."
        - id: ch03-b29
          speaker: anne_shirley
          text: "No. I'm not going back. I'll study my lessons here. I'll be as good as possible and stay quiet all the time, if such a thing is possible. But I assure you, I will not return to school."
        - id: ch03-b30
          speaker: narrator
          text: "Marilla saw something very much like unshakable stubbornness in Anne's small face. Changing the girl's mind would be difficult. Wisely, Marilla decided to say no more just then. Instead, she would visit Rachel that evening. There was no use reasoning with Anne while she was so upset, and Marilla had begun to suspect that the girl could be terribly stubborn once she fixed on an idea. As far as Marilla could tell from Anne's story, Mr. Phillips had handled the whole affair rather badly. It would never do to admit that in front of Anne. Rachel had already sent ten children to school, so she ought to understand such problems. Besides, Marilla felt certain the entire story had reached Rachel before now."
    - id: ch04
      title: Mrs. Rachel's Advice
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: "Marilla found Mrs. Rachel Lynde working cheerfully and busily on her quilts. Marilla felt a little awkward as she began."
        - id: ch04-b02
          speaker: marilla_cuthbert
          text: "I suppose you already know why I've come."
        - id: ch04-b03
          speaker: narrator
          text: "Mrs. Rachel nodded."
        - id: ch04-b04
          speaker: mrs_rachel_lynde
          text: "This is about Anne's trouble at school, I expect. Tillie Boulter stopped here on her way home and told me everything."
        - id: ch04-b05
          speaker: marilla_cuthbert
          text: "I don't know what to do with Anne. She insists she won't go back. I've never seen a child so upset. I expected trouble from the day she started. Things were going much too smoothly to last. She's so sensitive. What would you do, Rachel?"
        - id: ch04-b06
          speaker: narrator
          text: "Mrs. Rachel loved being asked for advice, and she answered pleasantly."
        - id: ch04-b07
          speaker: mrs_rachel_lynde
          text: "Well, since you asked for my advice, Marilla, I'd give Anne a little time and let her have her way at first. I believe Mr. Phillips was wrong. Naturally, we can't go around telling the children that. He was right to punish Anne yesterday for giving in to her temper, of course. But what happened today was entirely different. Every student who arrived late deserved the same punishment Anne received. And I don't approve of making girls sit beside boys as a punishment. It simply isn't proper. Tillie was truly furious about it. She told me she defended Anne from beginning to end, and said all the other students took Anne's side too. Somehow that girl has become very popular with them. I never expected her to fit in nearly so well."
        - id: ch04-b08
          speaker: marilla_cuthbert
          text: "Do you honestly think I should let her remain at home?"
          emotion: surprised
        - id: ch04-b09
          speaker: mrs_rachel_lynde
          text: "Yes, I do. I wouldn't say another word about school until Anne brings it up herself. You can depend on this, Marilla. In a week or so, she'll cool down and be quite ready to return on her own. But if you force her back immediately, goodness knows what strange fit or tantrum she'll have next. She may create more trouble than ever. In my opinion, the less fuss you make over the matter, the better it will go."
        - id: ch04-b10
          speaker: mrs_rachel_lynde
          text: "Besides, Anne won't miss much teaching while she's away. Mr. Phillips is no teacher at all. The way he keeps order in that school is disgraceful. He neglects the younger children and gives nearly all his time to the older students he's preparing for Queen's Academy. He would never have received the position for another year if his uncle hadn't been a trustee. In truth, that uncle acts like the only trustee, because he leads the other two around by the nose. I declare, I truly don't know what education on this Island is coming to."
        - id: ch04-b11
          speaker: narrator
          text: "Mrs. Rachel shook her head with deep concern. The gesture seemed to say that if only she had charge of education across the province, every school on the Island would be managed much better."
    - id: ch05
      title: Borrowed Trouble
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: "Marilla followed Mrs. Rachel's advice. She never said another word to Anne about returning to school. Anne studied her lessons at home, finished her chores, and played with Diana in the cool purple evenings of autumn. But whenever she met Gilbert on the road or came across him at Sunday school, she passed him with icy contempt. His obvious wish to make peace did nothing to thaw her. Even Diana tried to bring the two of them together, but every effort failed. Anne had clearly made up her mind to hate Gilbert Blythe for the rest of her life."
        - id: ch05-b02
          speaker: narrator
          text: "Anne hated Gilbert with all her heart, but she loved Diana with all the love in her passionate little heart. Her likes and dislikes were equally fierce. One twilight, Marilla came in from the orchard carrying a basket of apples. She found Anne sitting alone by the east window, crying as if her heart would break."
        - id: ch05-b03
          speaker: marilla_cuthbert
          text: "Anne, whatever is wrong now?"
        - id: ch05-b04
          speaker: anne_shirley
          text: "It's Diana. I love her so much, Marilla. I could never live without her. But someday we'll grow up, and Diana will marry somebody. Then she'll go away and leave me. What will I do? I hate her husband already. I hate him furiously."
          emotion: sad
        - id: ch05-b05
          speaker: anne_shirley
          text: "I've imagined the whole wedding. Diana will wear snowy white clothes and a veil. She'll look as beautiful and royal as a queen. I'll be her bridesmaid in a lovely dress with puffed sleeves. I'll smile, but underneath, my heart will be breaking. And then I'll have to tell Diana good-bye-e-e..."
          emotion: sad
        - id: ch05-b06
          speaker: narrator
          text: "Anne could say no more. She broke down completely, and her sobs grew harder and more bitter. Marilla turned away quickly to hide the twitch at the corner of her mouth, but it was useless. She dropped into the nearest chair and burst into such loud, hearty, and unusual laughter that Matthew stopped in amazement as he crossed the yard outside. When had he ever heard Marilla laugh like that before?"
        - id: ch05-b07
          speaker: marilla_cuthbert
          text: "Anne Shirley, if you insist on borrowing trouble, at least borrow something closer to home. You certainly do have an imagination."
