audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm, observant, and gently amused
        timbre: clear and rounded
        pace: measured
        pitch: medium
    anne_shirley:
      display_name: Anne Shirley
      tts:
        delivery: vivid, earnest, and eagerly imaginative
        timbre: clear and youthful
        pace: lively
        pitch: medium-high
    marilla_cuthbert:
      display_name: Marilla Cuthbert
      tts:
        delivery: firm, practical, and restrained
        timbre: clear and mature
        pace: steady
        pitch: medium-low
    matthew_cuthbert:
      display_name: Matthew Cuthbert
      tts:
        delivery: gentle, hesitant, and quietly reassuring
        timbre: soft and weathered
        pace: unhurried
        pitch: low
  chapters:
    - id: ch01
      title: A Golden Summer
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: "Anne had the good summer she had wished for, and she enjoyed every bit of it. She and Diana practically lived outdoors. They wandered through Lover's Lane, visited the Dryad's Bubble, and spent long happy hours at Willowmere and on Victoria Island. Marilla raised no objection to any of their roaming."
        - id: ch01-b02
          speaker: narrator
          text: "Early in the vacation, the Spencervale doctor happened to meet Anne at a patient's house. He was the same doctor who had come when Minnie May had croup. He looked Anne over carefully, tightened his mouth, shook his head, and sent Marilla a warning. She was to keep her redheaded girl outdoors all summer and away from books until there was more spring in her step."
        - id: ch01-b03
          speaker: narrator
          text: "That message thoroughly frightened Marilla. She heard in it a warning that Anne might die of consumption unless every word was obeyed. So, when it came to freedom and fun, Anne had the finest summer of her life. She walked and rowed, picked berries, and dreamed as much as she pleased. By September her eyes were bright, her step was lively enough to satisfy any doctor, and her heart was full of energy and ambition again."
        - id: ch01-b04
          speaker: narrator
          text: "Anne brought her books down from the attic and greeted them like old friends."
        - id: ch01-b05
          speaker: anne_shirley
          text: "I feel ready to study with all my might. Oh, you dear old books, I'm so glad to see your honest faces again. Yes, even yours, geometry. I've had a perfectly beautiful summer, Marilla. Now I feel like the strong man in Mr. Allan's sermon, rejoicing to run a race. Doesn't he preach magnificent sermons?"
        - id: ch01-b06
          speaker: anne_shirley
          text: "Mrs. Lynde says he improves every day, and soon some city church will snatch him away. Then Avonlea will have to train another brand-new minister. But why meet trouble before it comes? We ought to enjoy Mr. Allan while we have him. If I were a man, I think I'd become a minister. A minister can do so much good if his theology is sound. Imagine preaching a splendid sermon and stirring everyone's heart!"
        - id: ch01-b07
          speaker: anne_shirley
          text: "Why aren't women allowed to be ministers, Marilla? Mrs. Lynde was shocked when I asked her. She said there might be women ministers in the States, but she was thankful Canada hadn't come to that, and she hoped it never would. I can't see why. Women would make splendid ministers. Whenever there's a social or a church tea or money to be raised, the women do all the work. Mrs. Lynde can pray every bit as well as Superintendent Bell. With a little practice, I don't doubt she could preach, too."
        - id: ch01-b08
          speaker: marilla_cuthbert
          text: "Yes, I believe she could. Rachel does plenty of preaching without an official title. With her watching over Avonlea, hardly anyone gets a chance to go wrong."
        - id: ch01-b09
          speaker: anne_shirley
          text: "Marilla, there's something I need to tell you, and I want to know what you think. It troubles me terribly on Sunday afternoons, when I think especially hard about such things. I truly want to be good. When I'm with you, or Mrs. Allan, or Miss Stacy, I want to do everything that would please you and win your approval."
        - id: ch01-b10
          speaker: anne_shirley
          text: "But when I'm with Mrs. Lynde, I usually feel desperately wicked. I want to go straight out and do the very thing she says I mustn't do. The temptation feels impossible to resist. Why do you suppose that happens? Does it mean I'm truly bad and unregenerate?"
        - id: ch01-b11
          speaker: narrator
          text: "Marilla considered the question with a doubtful look. Then she laughed."
        - id: ch01-b12
          speaker: marilla_cuthbert
          text: "If it does, then I must be unregenerate, too. Rachel often has exactly that effect on me. Sometimes I think she could do more good if she didn't nag people so much about being good. There ought to be a special commandment against nagging. Still, I shouldn't say that. Rachel is a good Christian woman who means well. Avonlea has no kinder soul, and she never avoids her share of the work."
        - id: ch01-b13
          speaker: anne_shirley
          text: "I'm so glad you understand. That's very encouraging. I won't worry quite so much about it now. Of course, some new worry will probably take its place. Questions keep appearing as fast as I settle them. When you're beginning to grow up, there are so many things to consider and decide. Figuring out what is right keeps me busy all the time. Growing up is a serious business, isn't it?"
        - id: ch01-b14
          speaker: anne_shirley
          text: "But I have you and Matthew and Mrs. Allan and Miss Stacy to help me, so I ought to grow up successfully. If I don't, it will be my own fault. I only get one chance. If I grow up wrong, I can't go back and start again. And I've grown two inches this summer. Mr. Gillis measured me at Ruby's party. I'm very glad you made my new dresses longer."
        - id: ch01-b15
          speaker: anne_shirley
          text: "That dark green dress is so pretty, and it was sweet of you to add the flounce. I know I didn't truly need it. Still, flounces are very stylish this fall, and Josie Pye has them on every dress. I'm sure I'll study better because of mine. Deep in my mind, I'll feel so comfortable knowing that flounce is there."
        - id: ch01-b16
          speaker: marilla_cuthbert
          text: "Well, that comfortable feeling must be worth something."
    - id: ch02
      title: The Entrance Ahead
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: "Miss Stacy returned to the Avonlea school and found her pupils eager to begin again. The Queen's class worked hardest of all. At the end of the coming year, already casting a shadow across their path, waited the Entrance examination. Whenever they thought of it, their hearts seemed to drop into their shoes. What if they failed?"
        - id: ch02-b02
          speaker: narrator
          text: "That question haunted Anne through the winter, even on Sunday afternoons. It pushed nearly every moral and theological worry out of her mind. In her bad dreams, she stared miserably at the Entrance pass list. Gilbert Blythe's name shone at the very top, while Anne Shirley's name was nowhere to be found."
        - id: ch02-b03
          speaker: narrator
          text: "Even so, it was a cheerful winter, full and busy, and it flew past. Schoolwork was as interesting as ever, and the old class rivalry was just as absorbing. Before Anne's eager eyes, whole new worlds of thought and feeling seemed to open. Fresh fields of knowledge invited her forward. Each new height only showed her a higher one beyond it."
        - id: ch02-b04
          speaker: narrator
          text: "Much of that came from Miss Stacy's careful, open-minded guidance. She taught her class to think, explore, and discover things for themselves. She even encouraged them to leave the familiar paths now and then. That shocked Mrs. Lynde and the school trustees, who looked with deep suspicion on any change to the old ways."
        - id: ch02-b05
          speaker: narrator
          text: "Anne's life grew in other ways, too. Marilla remembered the doctor's orders and no longer refused every invitation. The Debating Club flourished and held several concerts. There were one or two parties that felt almost grown-up. Winter brought sleigh rides and more skating parties than anyone could want."
        - id: ch02-b06
          speaker: narrator
          text: "All the while, Anne kept growing. She shot up so quickly that one day Marilla stood beside her and discovered, to her amazement, that Anne was taller."
        - id: ch02-b07
          speaker: marilla_cuthbert
          text: "Why, Anne, look how tall you've grown!"
          emotion: surprised
        - id: ch02-b08
          speaker: narrator
          text: "A sigh followed the words. Marilla felt a strange regret for every inch Anne had gained. Somehow, the child she had learned to love had disappeared. In her place stood a tall girl of fifteen, with serious eyes, thoughtful brows, and a proud little lift to her head. Marilla loved this girl just as much as she had loved the child. Still, she felt a quiet, sorrowful sense of loss."
        - id: ch02-b09
          speaker: narrator
          text: "That night, Anne went to prayer meeting with Diana. Marilla sat alone in the winter twilight and gave in to the weakness of a good cry. Matthew came through the door carrying a lantern and caught her. He looked so alarmed that Marilla had to laugh through her tears."
        - id: ch02-b10
          speaker: marilla_cuthbert
          text: "I was thinking about Anne. She's become such a big girl, and next winter she'll probably be away from us. I'm going to miss her terribly."
          emotion: sad
        - id: ch02-b11
          speaker: narrator
          text: "To Matthew, Anne was still, and always would be, the eager little girl he had brought home from Bright River four years earlier."
        - id: ch02-b12
          speaker: matthew_cuthbert
          text: "She'll be able to come home quite often. By then, the branch railroad should reach Carmody."
        - id: ch02-b13
          speaker: marilla_cuthbert
          text: "It won't be the same as having her here every day. Oh, there's no use explaining. Men simply don't understand these things."
          emotion: sad
    - id: ch03
      title: Growing Up
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: "Anne was changing in ways that had nothing to do with height. For one thing, she grew much quieter. Perhaps she thought even more and dreamed just as much, but she did not talk nearly so often. Marilla noticed that, too."
        - id: ch03-b02
          speaker: marilla_cuthbert
          text: "You don't chatter half as much as you once did, Anne, and you hardly use any of those enormous words anymore. What's happened to you?"
        - id: ch03-b03
          speaker: narrator
          text: "Anne blushed and gave a little laugh. She let her book fall and gazed dreamily through the window. Outside, thick red buds were opening on the creeper, drawn out by the warm spring sunshine. Anne pressed one finger thoughtfully into her chin."
        - id: ch03-b04
          speaker: anne_shirley
          text: "I don't know. I simply don't want to talk as much now. It feels nicer to keep dear, beautiful thoughts tucked inside your heart like treasures. Then no one can laugh at them or wonder why you have them. Somehow, I don't want to use big words anymore, either. That's almost a shame, isn't it? Now I'm finally big enough to use them properly."
        - id: ch03-b05
          speaker: anne_shirley
          text: "Being almost grown-up is fun in certain ways, but it isn't the kind of fun I imagined. There's so much to learn and do and think about that big words only get in the way. Besides, Miss Stacy says short words are stronger and better. She makes us write our essays as simply as we can."
        - id: ch03-b06
          speaker: anne_shirley
          text: "That was terribly hard at first. I was used to squeezing in every fine, impressive word I could remember, and I could remember a great many. But now I've gotten used to simple writing. I can see how much better it is."
        - id: ch03-b07
          speaker: marilla_cuthbert
          text: "And what happened to your story club? You haven't mentioned it for ages."
        - id: ch03-b08
          speaker: anne_shirley
          text: "The story club doesn't exist anymore. We had no time for it, and I think we'd grown tired of it anyway. All those stories about love and murder and people running away to be married and mysterious secrets were rather silly. Miss Stacy still asks us to write stories for composition practice, but they have to be about things that might truly happen to us here in Avonlea."
        - id: ch03-b09
          speaker: anne_shirley
          text: "She examines our work very sharply, and she makes us examine it, too. I never dreamed my compositions had so many faults until I began hunting for them myself. I was so ashamed that I wanted to stop writing altogether. But Miss Stacy said I could become a good writer if I trained myself to be my own strictest critic. So that's what I'm trying to do."
        - id: ch03-b10
          speaker: marilla_cuthbert
          text: "There are only two months left before the Entrance. Do you think you'll pass?"
        - id: ch03-b11
          speaker: narrator
          text: "Anne shivered."
        - id: ch03-b12
          speaker: anne_shirley
          text: "I don't know. One moment I think I'll manage, and the next I'm horribly afraid. We've all worked hard, and Miss Stacy has trained us thoroughly. We still might fail. Each of us has one great stumbling block. Mine is geometry, of course. Jane struggles with Latin. Ruby and Charlie have trouble with algebra, and Josie's is arithmetic. Moody Spurgeon says he can feel in his bones that English history will be his downfall."
        - id: ch03-b13
          speaker: anne_shirley
          text: "In June, Miss Stacy is going to give us practice examinations just as difficult as the Entrance. She'll mark them just as strictly, too, so we'll know what to expect. I wish the whole thing were finished, Marilla. It follows me everywhere. Sometimes I wake in the middle of the night and wonder what I'll do if I fail."
          emotion: fearful
        - id: ch03-b14
          speaker: marilla_cuthbert
          text: "Why, you'd go back to school next year and try once more."
        - id: ch03-b15
          speaker: anne_shirley
          text: "I don't think I'd have the courage. Failing would be such a disgrace, especially if Gil... if everyone else passed. And examinations make me so nervous that I could ruin the whole thing. I wish I had Jane Andrews's nerves. Nothing ever upsets her."
          emotion: fearful
        - id: ch03-b16
          speaker: narrator
          text: "Anne sighed. Outside, the spring world seemed to be casting a spell over her. The blue, breezy day called through the window, and green shoots rose invitingly in the garden. Anne pulled her gaze away and bent firmly over her book. Other springs would come. But in that moment, she was certain that if she failed the Entrance, she would never recover enough to enjoy them."
