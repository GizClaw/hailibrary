audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖机敏，带着含蓄的幽默讲述
        timbre: 清澈柔和
        pace: 舒展而富有变化
        pitch: medium
    anne:
      display_name: 安妮
      tts:
        delivery: 热烈敏感，想象丰富，情绪来得真切而迅速
        timbre: 明亮清脆的少女声
        pace: 偏快，激动时连贯奔涌
        pitch: medium-high
    marilla:
      display_name: 玛丽拉
      tts:
        delivery: 严厉务实，关切藏在克制的话语里
        timbre: 稳定清晰的中年女声
        pace: 从容直接
        pitch: medium-low
    matthew:
      display_name: 马修
      tts:
        delivery: 腼腆温厚，说话轻而真诚
        timbre: 低沉朴实的中年男声
        pace: 缓慢迟疑
        pitch: low
    doctor:
      display_name: 斯宾塞谷医生
      tts:
        delivery: 专业果断，嘱咐病情时严肃直接
        timbre: 清晰沉稳的成年男声
        pace: 简洁适中
        pitch: medium-low
  chapters:
    - id: ch01
      title: 第三十一章　小溪与大河交汇之处
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 安妮如愿过了一个好好休养的夏天，每一天都玩得尽兴。她和戴安娜几乎整天待在户外，把情人小径、树精之泉、柳池和维多利亚岛的乐趣享了个遍。玛丽拉也不拦她四处游荡。假期刚开始时，斯宾塞谷的医生在一位病人家里遇见安妮。就是米妮·梅患喉头炎那晚赶来诊治的那一位。他锐利地看了安妮一会儿，抿住嘴，摇摇头，随后托人给玛丽拉带去一句话。
        - id: ch01-b02
          speaker: doctor
          text: 让你家那个红头发姑娘整个夏天都待在户外。别让她看书，等她走路重新有了轻快劲儿再说。
        - id: ch01-b03
          speaker: narrator
          text: 这句医嘱把玛丽拉吓得彻底清醒了。她仿佛从中读到了安妮会因肺痨送命的判决，认定要是不一丝不苟地照办，连命也保不住。这样一来，安妮在自由和玩耍上，倒拥有了有生以来最灿烂的夏天。她想走多远就走多远，想划多久的船就划多久，还尽情采浆果、做美梦。九月来临时，她双眼明亮，精神十足，脚步轻快得医生一定会满意，心里也重新有了志向和热情。
        - id: ch01-b04
          speaker: anne
          text: 我现在真想使出全副力气读书。哦，我的老朋友们，又看见你们这些诚实的面孔，真叫人高兴。对，几何，连看见你我也高兴。玛丽拉，这个夏天实在美极了。如今我满心欢喜，就像艾伦先生上星期日说的，勇士欢然奔路。他讲道是不是精彩极了？
          emotion: happy
        - id: ch01-b05
          speaker: anne
          text: 林德太太说，艾伦先生每天都在进步。没准哪天城里一座教堂就把他一口吞走，只留下我们重新调教一个没经验的新牧师。不过，何必预先去迎接烦恼呢？趁艾伦先生还在，我们好好珍惜他就行了。我要是男人，也许会去当牧师。只要神学信得正，牧师就能引人向善。在讲坛上讲出精彩的道，拨动听众的心，那一定激动人心。
        - id: ch01-b06
          speaker: anne
          text: 玛丽拉，女人为什么不能当牧师？我问林德太太，她吓坏了，说那简直有伤风化。她相信美国也许真有女牧师，还说好在加拿大没到那一步，但愿永远也别到。可我就是不明白。女人一定能做很出色的牧师。联谊会、教堂茶会，还有所有募款的活动，最后不都是女人动手办起来的吗？林德太太祷告绝不会比贝尔主日学校校长差。只要练一练，她讲道准也不差。
        - id: ch01-b07
          speaker: marilla
          text: 我也相信她能。她平日里没有名分的道已经讲得够多了。有蕾切尔监督，埃文利谁也没多少机会走上歪路。
        - id: ch01-b08
          speaker: anne
          text: 玛丽拉，我有件事想告诉你，还想听听你的看法。每逢星期日下午，我想到这些问题，就烦恼得不得了。我真的想做个好人。跟你、艾伦太太或史黛西小姐在一起时，我尤其想变好，只想做你们赞许的事。可跟林德太太在一起，我常常觉得自己坏透了，只想去做她叫我千万别做的事。那诱惑简直抵挡不住。你说，我为什么会这样？难道我本来就很坏，还没有洗心革面？
          emotion: sad
        - id: ch01-b09
          speaker: narrator
          text: 玛丽拉迟疑地看了她片刻，忽然笑了。
        - id: ch01-b10
          speaker: marilla
          text: 要是你真坏得无可救药，我大概也一样。蕾切尔常常也让我生出那种念头。照你的说法，她要是不总唠叨着逼人学好，反而更能引人向善。十诫之外，真该再加一条，专门禁止唠叨。不过我不该这么说。蕾切尔是个虔诚善良的基督徒，用心也好。埃文利再没有比她更热心的人，该做的事她从来不推。
        - id: ch01-b11
          speaker: anne
          text: 原来你也有同样的感觉，这可太叫人宽心了。以后我不会再为这件事那么发愁。不过，别的烦恼一定还会来。那些叫人困惑的问题总是一个接一个，刚解决一个，后面马上又冒出来。一个人开始长大，就有那么多事需要思量，还得判断怎样做才对。长大真严肃，对不对？
        - id: ch01-b12
          speaker: anne
          text: 可我有你、马修、艾伦太太和史黛西小姐这样的朋友，理应好好地长大。要是没长好，准是我自己的错。机会只有一次，要是没长成一个好大人，也不能退回去重新来过。这个夏天我长高了两英寸。鲁比办聚会时，吉利斯先生替我量的。幸好你把新裙子做长了一些。那条墨绿色的真漂亮，你还给它加了荷叶边。
        - id: ch01-b13
          speaker: anne
          text: 我知道荷叶边不是非有不可，可今年秋天特别时兴，乔西的每条裙子上都有。我有了自己的荷叶边，读书一定也会更用功。只要想到它，心里就舒舒服服的。
        - id: ch01-b14
          speaker: marilla
          text: 心里有这份舒坦，也算值得。
        - id: ch01-b15
          speaker: narrator
          text: 史黛西小姐回到埃文利学校，学生们又都盼着用功。女王学院班尤其摩拳擦掌，准备迎战。因为来年年底，那场人人叫作入学考试的大事，已经在前路投下了阴影。一想到万一考不过，大家的心就直往鞋底里沉。整个冬天，这个念头缠住了安妮清醒的每一刻，就连星期日下午也不放过，道德和神学难题几乎全被挤走。她一做噩梦，就会看见入学考试的录取名单。吉尔伯特·布莱思的名字赫然排在榜首，自己的名字却哪里也找不到。
        - id: ch01-b16
          speaker: narrator
          text: 不过，那仍是一个热闹、忙碌又快乐的冬天，转眼便飞了过去。功课和从前一样有趣，同学之间的竞争也一样叫人投入。安妮那双热切的眼睛望出去，仿佛看见思想、感情与志向的新天地正一一展开，还有一片片新鲜迷人、从未走进过的知识原野。正是山后又见山峰起，越过群山，阿尔卑斯层层现。
        - id: ch01-b17
          speaker: narrator
          text: 这大半要归功于史黛西小姐细心、得体又开明的引导。她让学生自己思考、探索和发现，还鼓励他们离开前人走惯的老路。这份大胆足以让林德太太和校董们很吃惊，因为他们一向信不过偏离旧有教学办法的新花样，见了心里就犯嘀咕。
        - id: ch01-b18
          speaker: narrator
          text: 安妮的生活也不只有功课，她在人情交往上也渐渐开阔起来。玛丽拉始终记着斯宾塞谷医生的嘱咐，不再拦她偶尔出去参加活动。辩论社办得十分兴旺，还举行了好几场音乐会。有一两次聚会，已经很像成年人的社交场合。坐雪橇出游和滑冰嬉戏，更是多得数不过来。
        - id: ch01-b19
          speaker: narrator
          text: 就在这些忙碌的日子里，安妮不停地往高里长。一天，她和玛丽拉并肩站着，玛丽拉忽然发现，这姑娘竟然已经高过自己了。
        - id: ch01-b20
          speaker: marilla
          text: 哎呀，安妮，你怎么长得这么高了！
          emotion: surprised
        - id: ch01-b21
          speaker: narrator
          text: 玛丽拉说完，轻轻叹了口气。安妮多长出来的这几英寸，竟叫她生出奇异的惆怅。那个她渐渐学会去爱的孩子，不知不觉已经消失了。眼前站着的是一个十五岁的高挑姑娘，双眼严肃，眉宇间有了沉思，微微昂起的小脑袋又透着骄傲。玛丽拉爱现在的安妮，一点不亚于爱从前那个孩子。可她仍清清楚楚地觉得，自己失去了什么。那份失落很古怪，也沉沉地压在心上。
        - id: ch01-b22
          speaker: narrator
          text: 那天晚上，安妮和戴安娜去参加祈祷会。玛丽拉独自坐在冬日的暮色里，终于由着自己哭了一场。马修提灯进来，正好撞见，顿时惊慌得不知怎么办。看见他那副样子，玛丽拉含着眼泪笑了出来。
        - id: ch01-b23
          speaker: marilla
          text: 我刚才在想安妮。她已经长成这么大的姑娘，明年冬天多半还要离开我们。我会想她想得难受的。
          emotion: sad
        - id: ch01-b24
          speaker: matthew
          text: 她可以常常回家。到那时，通往卡莫迪的铁路支线也该修好了。
          emotion: calm
        - id: ch01-b25
          speaker: narrator
          text: 可在马修眼里，安妮如今是，将来也永远是四年前那个六月的傍晚，他从亮河带回家的热切小姑娘。
        - id: ch01-b26
          speaker: marilla
          text: 可那终究不像她天天住在家里。算了，你们男人不会懂这种事！
          emotion: sad
        - id: ch01-b27
          speaker: narrator
          text: 玛丽拉决意不听安慰，只想尽情享用这一刻的悲伤。安妮的变化却不只在个子上，那些看不见的改变也一样真切。首先，她安静了许多。也许她比从前想得更多，做的梦还是一样多，可话的确少了。玛丽拉自然也留意到了。
        - id: ch01-b28
          speaker: marilla
          text: 安妮，你现在说的话连从前的一半都不到，那些大词也少用了一大半。你这是怎么了？
        - id: ch01-b29
          speaker: narrator
          text: 安妮脸上一红，轻轻笑了。她放下书，出神地看向窗外。春日阳光正引诱着藤蔓，一颗颗饱满的红芽都绽开了。
        - id: ch01-b30
          speaker: anne
          text: 我也不知道，就是不那么想说话了。那些亲爱又美丽的念头，还是留在心里当珍宝更好。我不喜欢别人笑它们，或拿它们当稀奇看。还有那些大词，我现在也不想用了。倒真有点可惜。如今我终于长大到可以使用它们，只要我愿意。
        - id: ch01-b31
          speaker: anne
          text: 快要长大，有些地方是挺有趣，可不是我从前想的那种趣味。要学、要做、要想的事情太多，根本没工夫顾那些大词。史黛西小姐还说，短小的词更有力，也更好。她要求我们的文章尽可能简单。刚开始真难，我早习惯把能想到的漂亮大词统统塞进去，而且我能想到的大词可多了。现在我习惯了，也看出简单的确好得多。
        - id: ch01-b32
          speaker: marilla
          text: 你们的故事会怎么样了？我很久没听你提起。
        - id: ch01-b33
          speaker: anne
          text: 故事会已经没有了。我们没时间，而且大概也写腻了。总写爱情、谋杀、私奔和神秘事件，实在傻气。史黛西小姐有时让我们写故事来练作文，可她只准我们写那些可能发生在埃文利、发生在自己生活里的事。她批评得很严格，还叫我们自己挑自己的毛病。
        - id: ch01-b34
          speaker: anne
          text: 我亲自去找以后，才知道自己的文章竟有那么多毛病。我羞愧得简直想放弃。可史黛西小姐说，只要练习做自己最严厉的批评者，我就能学会把文章写好。所以我正在努力。
        - id: ch01-b35
          speaker: marilla
          text: 离入学考试只剩两个月了。你觉得自己能考过吗？
        - id: ch01-b36
          speaker: narrator
          text: 安妮不由得打了个寒战。
        - id: ch01-b37
          speaker: anne
          text: 我不知道。有时我觉得准没问题，转眼又怕得要命。我们一直很用功，史黛西小姐也训练得很扎实，可还是可能考不过。每个人都有自己的绊脚石。我的当然是几何，简的是拉丁文，鲁比和查理的是代数，乔西的是算术。穆迪·斯珀吉翁说，他从骨头里就感觉得到，自己会栽在英国史上。
          emotion: fearful
        - id: ch01-b38
          speaker: anne
          text: 史黛西小姐打算在六月给我们考试，题目跟正式入学考试一样难，分数也一样严格，好让我们心里有个底。我真希望这一切早就结束了。考试一直缠着我。有时半夜醒来，我会忍不住想，要是没考过，我该怎么办。
          emotion: fearful
        - id: ch01-b39
          speaker: marilla
          text: 那就明年接着上学，再考一次。
        - id: ch01-b40
          speaker: anne
          text: 我想自己不会有勇气再来一次。考试失败太丢人了，尤其要是吉——要是别人都考过了。而且我一考试就紧张，很可能把一切弄糟。真希望我能像简·安德鲁斯那么稳，什么也吓不着她。
          emotion: fearful
        - id: ch01-b41
          speaker: narrator
          text: 安妮叹了口气，硬把目光从窗外迷人的春光中收回来。那是一个微风与碧空都在招手的日子，花园里一片片新绿也正破土而出，处处都在召唤她。可她还是毅然把头埋进书里。以后当然还会有别的春天，但安妮深信，如果这次没通过入学考试，她一定会一蹶不振，再也没有心情享受那些春天了。
