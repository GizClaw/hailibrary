audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖机敏，带着含蓄的幽默讲述
        timbre: 清澈柔和
        pace: 舒展而富有变化
        pitch: medium
    anne:
      display_name: 安妮
      tts:
        delivery: 热烈敏感，想象丰富，情绪来得真切而迅速
        timbre: 明亮清脆的少女声
        pace: 偏快，激动时连贯奔涌
        pitch: medium-high
    diana:
      display_name: 戴安娜
      tts:
        delivery: 亲切真诚，对朋友满怀关心
        timbre: 柔和甜润的少女声
        pace: 自然适中
        pitch: medium-high
    josephine:
      display_name: 约瑟芬·巴里小姐
      tts:
        delivery: 古板犀利，阅历深厚，兴味来时藏不住幽默
        timbre: 清脆偏薄的老年女声
        pace: 稍慢而有力
        pitch: 中音
    marilla:
      display_name: 玛丽拉
      tts:
        delivery: 严厉务实，关切藏在克制的话语里
        timbre: 稳定清晰的中年女声
        pace: 从容直接
        pitch: medium-low
  chapters:
    - id: ch01
      title: 第二十九章　安妮生命中的新纪元
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 九月的一天傍晚，安妮从后牧场赶着牛群回家，走进了情人小径。林间的空地盛满宝石红的夕照，小径上也不时亮起一片红光。可枫树底下已经暗了，冷杉间浮着清澈的紫色暮霭，像一杯轻盈的酒。风在树梢里穿行。要说世上最甜美的音乐，恐怕再没有什么比得上冷杉林中的晚风。
        - id: ch01-b02
          speaker: narrator
          text: 牛群安安静静地往前走，安妮跟在后面，梦游似的高声背诵《马米恩》的战争诗篇。去年冬天，史黛西小姐叫全班把它背得滚瓜烂熟。那些奔腾的诗句，还有诗里长矛交击的声音，总能让安妮满心激荡。念到“顽强的矛兵仍坚守不退，密不透光的黑森林牢不可摧”时，她索性闭上眼睛，想象自己也站在那一圈英雄当中。
        - id: ch01-b03
          speaker: narrator
          text: 再睁开眼，戴安娜正从巴里家田地的门里走来，神情郑重得不得了。安妮一眼就知道她带来了新闻，却偏偏不肯让自己显得急着打听。
        - id: ch01-b04
          speaker: anne
          text: 戴安娜，你看今晚，多像一场紫色的梦。活着真让人高兴。每天早晨，我都觉得早晨才是最美的。可是傍晚一来，我又觉得还是傍晚更美。
        - id: ch01-b05
          speaker: diana
          text: 今晚是很好。不过，安妮，我有个天大的消息。你来猜，给你三次机会。
        - id: ch01-b06
          speaker: anne
          text: 夏洛特·吉利斯还是决定在教堂里结婚了，对不对？艾伦太太还要请我们去布置教堂！
        - id: ch01-b07
          speaker: diana
          text: 不对。她的未婚夫不肯。以前从来没有人在那座教堂结婚，他觉得那样看着太像办丧事。真讨厌，本来一定很好玩。你再猜。
        - id: ch01-b08
          speaker: anne
          text: 那么，是简的妈妈终于答应给她办生日宴会了？
        - id: ch01-b09
          speaker: narrator
          text: 戴安娜只摇了摇头，乌黑的眼睛笑得闪闪发亮。
        - id: ch01-b10
          speaker: anne
          text: 我实在猜不出了。除非……昨晚祈祷会结束以后，是穆迪·斯珀吉翁·麦克弗森送你回的家。真是他吗？
        - id: ch01-b11
          speaker: diana
          text: 才不是！就算那个讨厌鬼真送了我，我也不会拿这件事来炫耀。我早知道你猜不着。妈妈今天收到了约瑟芬姑婆的信。姑婆请你和我下星期二进城，住在她家里，还要带我们去看博览会！
        - id: ch01-b12
          speaker: narrator
          text: 安妮一下子站不稳了，只好靠住身边的一棵枫树。
        - id: ch01-b13
          speaker: anne
          text: 戴安娜，你说的是真的吗？可玛丽拉多半不会答应。她会说，不能纵着我到处乱跑。上星期简请我坐她们家的双排座马车，去白沙旅馆听美国音乐会，玛丽拉就这么说。她还说，我该在家温习功课，简也该这样。我失望得心都碎了，晚上连祷告也不肯做。后来我后悔了，半夜又爬起来补做了一次。
        - id: ch01-b14
          speaker: diana
          text: 让妈妈去问玛丽拉吧。妈妈开口，她答应的可能就大多了。安妮，要是她肯让你去，我们一定会玩得一辈子也忘不了。我还从没看过博览会呢。听别的姑娘说她们进城有多好玩，真叫人生气。简和鲁比已经去过两回，今年居然还要去。
        - id: ch01-b15
          speaker: anne
          text: 在知道自己到底能不能去以前，我一点也不想这件事。要是先盼了半天，后来又去不成，我可受不了。不过，万一能去，我的新外套正好赶得上。玛丽拉原来说，旧外套再穿一个冬天也够了，我已经有了新裙子，应该知足。可那条海军蓝的新裙子真的很漂亮，式样也很时髦。
        - id: ch01-b16
          speaker: anne
          text: 现在玛丽拉给我做裙子，总会做得时髦些。她说，绝不能再让马修跑去请林德太太做衣裳。我真高兴。穿着时髦的衣裳，人也比较容易变好，至少我会这样。天生善良的人大概不在乎衣裳。可马修坚持让我添件新外套，玛丽拉便买了漂亮的蓝色细呢，送到卡莫迪，请一位真正的裁缝来做。星期六晚上就能拿回来。
        - id: ch01-b17
          speaker: anne
          text: 我努力不去想象，星期天穿着新衣、戴着新帽走过教堂过道会是什么样子，因为我怕这样想不对。可那个画面偏要自己钻进脑子。我的帽子太漂亮了，是马修在卡莫迪给我买的。那种蓝丝绒小帽眼下最流行，上面还有金绳和流苏。你的新帽子也很雅致，特别衬你。上星期天看见你走进教堂，我一想到最亲爱的朋友就是你，心里骄傲极了。戴安娜，我们老想着衣裳，是不是很不对？玛丽拉说这罪过很大。可这个话题真的很有趣，对吧？
        - id: ch01-b18
          speaker: narrator
          text: 玛丽拉答应了。大家约好，下星期二由巴里先生送两个姑娘进城。夏洛特敦足足有三十英里远，巴里先生又想当天往返，他们非得天不亮就出发不可。安妮却只觉得欢喜。星期二，她在日出以前便起了床。从窗口望去，闹鬼森林的冷杉后面，东方天空一片银白，没有一丝云。果园坡的西山墙也亮着灯，原来戴安娜同样早早醒来了。
        - id: ch01-b19
          speaker: narrator
          text: 马修生好火，玛丽拉下楼时，安妮已经穿戴整齐，连早餐都准备好了。可她自己实在太兴奋，一口也吃不下。饭后，她戴上俏丽的新帽，穿好新外套，越过小溪，穿过冷杉林，急急忙忙赶到果园坡。巴里先生和戴安娜等在那里，一行人很快上了路。
        - id: ch01-b20
          speaker: narrator
          text: 车程很长，可安妮和戴安娜享受着每一分钟。清晨的红光慢慢爬过收割后的田野，马车在湿润的道路上辘辘前行。空气又清新又凉爽，烟蓝的薄雾在山谷中盘旋，再轻轻飘离山坡。他们一会儿穿过树林，看见枫树挂起鲜红的旗帜。一会儿又过了桥，那种熟悉的、又怕又喜欢的感觉，叫安妮浑身一紧。
        - id: ch01-b21
          speaker: narrator
          text: 道路有时沿着港湾转弯，经过一簇被风雨染灰的渔舍。有时又爬上山岗，让人望见大片起伏的高地和雾蓝的天空。不论走到哪里，都有新鲜事可以谈。将近中午时，他们终于到了城里，找到山毛榉庄。那幢气派的老宅远离街道，静静藏在绿榆和枝叶舒展的山毛榉之间。巴里小姐亲自来到门口，那双锐利的黑眼睛里闪着笑。
        - id: ch01-b22
          speaker: josephine
          text: 你这个安妮丫头，总算肯来看我了。老天，孩子，你怎么长得这么高！我看你已经比我高啦。你也比从前漂亮多了。不过，这件事不用我说，你自己大概早就知道。
        - id: ch01-b23
          speaker: anne
          text: 我真的一点也不知道。我只知道雀斑不像从前那么多了，光是这一点就很值得感恩。我可从没敢指望别的地方也会变好。巴里小姐，您觉得我漂亮些了，我真高兴。
          emotion: happy
        - id: ch01-b24
          speaker: narrator
          text: 后来，安妮告诉玛丽拉，巴里小姐的家“华丽非凡”。老太太去照看午餐，把两个乡下姑娘留在客厅里。她们望着那满屋的富丽陈设，简直不知道手脚该往哪里放。
        - id: ch01-b25
          speaker: diana
          text: 这里像不像宫殿？我以前从没进过约瑟芬姑婆的家，根本不知道有这么气派。真想让朱莉娅·贝尔也来看看。她老是拿她妈妈的客厅向人摆架子。
        - id: ch01-b26
          speaker: anne
          text: 天鹅绒地毯，还有丝绸窗帘！戴安娜，我以前做梦都想见到这些。可现在真的坐在这里，我反倒不大自在了。屋里塞满了东西，每一样都这么华丽，想象力根本没地方施展。你瞧，贫穷也有好处。家里没有的东西，全可以靠想象得到。
        - id: ch01-b27
          speaker: narrator
          text: 后来的许多年里，安妮和戴安娜都用这次城中旅行来标记岁月。那几天从开始到结束，每一刻都装满了欢乐。星期三，巴里小姐带她们去了博览会场，整整玩了一天。
        - id: ch01-b28
          speaker: anne
          text: 玛丽拉，博览会精彩极了，我从没想到会有这么有趣的地方。哪个展区最好，我实在选不出来。我最喜欢的大概是马匹、鲜花和手工艺品。乔西·派织的花边得了一等奖，我真心替她高兴。而且，我也为自己能替她高兴而高兴。这不是说明我正在变好吗？哈蒙·安德鲁斯先生的格拉文斯坦苹果得了二等奖，贝尔先生养的猪得了一等奖。
        - id: ch01-b29
          speaker: anne
          text: 戴安娜说，一个主日学校的负责人靠养猪得奖，实在荒唐。可我看不出哪里荒唐。她说，以后每逢听见贝尔先生一本正经地祷告，她准会想起那头猪。克拉拉·路易丝·麦克弗森的画也得了奖，林德太太做的黄油和奶酪拿了一等奖。埃文利在会上真够出风头的。那天林德太太也在那里。在成千上万的陌生人中间看见她，我才知道自己原来这么喜欢她。那里人多得让我觉得自己渺小极了。
        - id: ch01-b30
          speaker: anne
          text: 巴里小姐还带我们上看台看赛马。林德太太不肯去。她说赛马可憎得很，自己又是教会成员，有责任留在外面，给别人做个好榜样。不过，看台上挤着那么多人，少了她一个，谁也不会发现。我想，我也不该常看赛马，那东西实在太迷人。戴安娜激动得要拿十分钱跟我打赌，说红马一定赢。我不信，可我还是拒绝了。因为我想把所有事情都讲给艾伦太太听，而打赌这件事显然不能告诉她。
        - id: ch01-b31
          speaker: anne
          text: 一件事要是不能告诉牧师太太，做了总是不对。跟牧师太太做朋友，就像多了一份良心。我很庆幸自己没有赌，因为红马真的赢了，我本来会输掉十分钱。你看，美德本身果然就是奖赏。我们还看见有人坐着气球升上天空。我也真想试试，那一定刺激极了。那里还有人卖命运。交十分钱，一只小鸟就会替你叼出自己的命运。巴里小姐给了我和戴安娜每人十分钱，让我们都算了一回。
        - id: ch01-b32
          speaker: anne
          text: 我的命运说，我会嫁给一个皮肤黝黑、非常有钱的男人，还会漂洋过海，搬到别处去住。后来，每看见一个黑皮肤的男人，我都仔细打量一番，可谁也不大讨我喜欢。反正现在就开始找他，大概也太早了。玛丽拉，那一天我一辈子也不会忘。晚上明明累极了，却睡不着。巴里小姐照约定让我们住进客房。房间漂亮是漂亮，可睡在里面并不像我从前想象的那么奇妙。
        - id: ch01-b33
          speaker: anne
          text: 我现在渐渐懂了，这就是长大最糟糕的地方。小时候拼命想要的东西，等真正得到以后，连原先的一半美妙也没有。
        - id: ch01-b34
          speaker: narrator
          text: 星期四，两个姑娘坐车游览了公园。到了晚上，巴里小姐又带她们去音乐学院听音乐会。一位著名的首席女歌唱家将在那里演唱。对安妮来说，那个夜晚简直是一场闪闪发亮的欢乐幻梦。
        - id: ch01-b35
          speaker: anne
          text: 哦，玛丽拉，那种美妙根本没法形容。我激动得连话也说不出，你想想就知道有多厉害了。我只是坐在那里，入了迷似的一声不响。塞利茨基夫人美极了，穿着白缎礼服，身上戴着钻石。可她一开始唱，我就再也顾不上想别的了。我真的说不清那是什么感受。那一刻，我觉得从今以后，做一个好人再也不会困难了。
        - id: ch01-b36
          speaker: anne
          text: 那感觉就像我抬头望着星星。眼泪涌进了眼睛，可它们全是幸福的眼泪。音乐会结束时，我难过极了。我告诉巴里小姐，我再也不知道该怎么回到平凡的生活。她说，去街对面的餐馆吃一份冰淇淋，也许能帮上忙。这办法听着太平淡了，可它居然真的有效。冰淇淋好吃极了。半夜十一点还坐在外面吃冰淇淋，既美妙，又有一点放纵。
        - id: ch01-b37
          speaker: anne
          text: 戴安娜说，她一定是天生就适合城市生活。巴里小姐问我怎么想，我说，必须认真考虑以后才能回答。上床以后，我真的仔细想了。睡觉以前最容易把事情想明白。最后我发现，自己不是为城市生活而生的，而且我很庆幸。偶尔一次，半夜十一点坐在灯火辉煌的餐馆里吃冰淇淋，当然很不错。可要是每晚都这样，我宁可十一点时已经在东山墙房间里睡熟了。
        - id: ch01-b38
          speaker: anne
          text: 那时，就算在梦里，我也隐约知道窗外星光闪耀，小溪对岸的冷杉林里有风吹过。第二天早饭时，我把这些告诉巴里小姐，她又笑了。无论我说什么，她总会笑，哪怕我说得再严肃。我不大喜欢这样，因为我根本没想逗她。不过，她确实是位最好客的女士，把我们招待得像王族一样。
        - id: ch01-b39
          speaker: narrator
          text: 星期五，回家的日子到了。巴里先生赶车进城，来接两个姑娘。巴里小姐送她们到门口。
        - id: ch01-b40
          speaker: josephine
          text: 好啦，但愿你们这几天玩得还算愉快。
        - id: ch01-b41
          speaker: diana
          text: 我们玩得快活极了。
        - id: ch01-b42
          speaker: josephine
          text: 那么你呢，安妮丫头？
        - id: ch01-b43
          speaker: anne
          text: 每一分钟我都过得很快乐。
        - id: ch01-b44
          speaker: narrator
          text: 安妮忽然搂住老太太的脖子，在她满是皱纹的脸颊上亲了一下。戴安娜绝不敢这样做，见安妮如此大胆，不免有些惊骇。巴里小姐却非常高兴。她站在门廊上，一直望到马车消失，才叹着气走回大房子。少了那两个鲜活的年轻生命，屋里显得格外冷清。
        - id: ch01-b45
          speaker: narrator
          text: 说实话，巴里小姐一向很自私。除了自己，她不大关心别人。她看重谁，只因为那人对她有用，或是能逗她开心。安妮能逗她笑，自然很得她喜欢。可这一次，老太太想起的已经不只是那些古怪有趣的话。她想起安妮鲜活的热情、毫不遮掩的情感、惹人怜爱的小动作，也想起那双眼睛和嘴唇里的甜美。
        - id: ch01-b46
          speaker: josephine
          text: 当初听说玛丽拉·卡斯伯特从孤儿院领养了一个女孩，我还以为她真是老糊涂了。现在看来，她这件事办得并不坏。要是我家里也能一直有个安妮这样的孩子，我一定会变得更好，也会活得更快乐。
        - id: ch01-b47
          speaker: narrator
          text: 安妮和戴安娜觉得，回家的路和来时一样愉快。不，还要更愉快些，因为她们知道，路的尽头有家在等着。马车经过白沙，转上沿海道路时，太阳已经落下。远处，埃文利的山岭在藏红花色的天空下显出深暗的轮廓。身后，月亮正从海里升起来，清辉把整片大海照得灿烂，像是换了一个模样。
        - id: ch01-b48
          speaker: narrator
          text: 道路弯弯曲曲，每一处小海湾都闪着跳动的波光。海浪轻轻冲上下面的岩石，发出唰唰的声音。强劲清新的风里，满是海水辛烈的气息。
        - id: ch01-b49
          speaker: anne
          text: 哦，活着真好。能够回家，也真好。
          emotion: happy
        - id: ch01-b50
          speaker: narrator
          text: 安妮走过小溪上的独木桥时，绿山墙厨房的灯光仿佛朝她亲切地眨眼，欢迎她回家。敞开的门里透出炉火温暖的红光，横穿过清冷的秋夜。她快活地跑上山坡，冲进厨房。桌上已经摆好了热腾腾的晚餐。玛丽拉把手里的针线活叠了起来。
        - id: ch01-b51
          speaker: marilla
          text: 这么说，你回来啦？
        - id: ch01-b52
          speaker: anne
          text: 回来了。哦，回家的感觉真好！我简直想把家里的每一样东西都亲一遍，连钟也不放过。玛丽拉，那是一只烤鸡！你不会是特意为我做的吧？
          emotion: happy
        - id: ch01-b53
          speaker: marilla
          text: 就是给你做的。坐了这么远的车，我想你一定饿了，该吃点真正可口的东西。快把外衣脱掉。马修一回来，我们就吃晚饭。我得承认，看见你回来，我真高兴。你不在的这四天，家里冷清得吓人。我这辈子还没觉得哪四天这么漫长过。
        - id: ch01-b54
          speaker: narrator
          text: 晚饭以后，安妮坐在炉火前。马修在一边，玛丽拉在另一边，她把这几天的经历从头到尾，详详细细地讲给他们听。讲完最后一件事，她幸福地作了总结。
        - id: ch01-b55
          speaker: anne
          text: 我玩得好极了。我觉得，这趟旅行在我的生命里开启了一个新纪元。不过，所有经历中最美好的，还是回家。
          emotion: happy
