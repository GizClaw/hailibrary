  chapters:
    - id: ch01
      title: News in Lover's Lane
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: "One September evening, Anne brought the cows home through Lover's Lane. Ruby sunset light filled every opening in the woods and spilled across parts of the path. Most of the lane lay in maple shadow, while a clear violet dusk gathered under the firs. The wind moved high in their branches, making the sweetest evening music in the world."
        - id: ch01-b02
          speaker: narrator
          text: "The cows wandered peacefully ahead. Anne followed in a dream, reciting the battle passage from Marmion that Miss Stacy had made the class memorize the winter before. She thrilled to its racing lines and the imagined clash of spears. At the words about the stubborn spearmen and their dark, unbroken wall, she stopped and closed her eyes. For a moment, she could picture herself standing in that heroic circle."
        - id: ch01-b03
          speaker: narrator
          text: "When Anne opened her eyes, Diana was coming through the gate from the Barry field. She looked so full of importance that Anne knew at once there was news. Still, Anne refused to seem too curious."
        - id: ch01-b04
          speaker: anne_shirley
          text: "Diana, doesn't this evening feel like a purple dream? It makes me so glad I'm alive. Every morning I decide mornings are best, and then evening comes and seems even lovelier."
          emotion: happy
        - id: ch01-b05
          speaker: diana_barry
          text: "It is a lovely evening. But Anne, I have wonderful news! Try to guess. I'll give you three chances."
          emotion: happy
        - id: ch01-b06
          speaker: anne_shirley
          text: "Charlotte Gillis is getting married in the church after all, and Mrs. Allan wants us to decorate it!"
        - id: ch01-b07
          speaker: diana_barry
          text: "No. Charlotte's beau still won't agree. Since nobody has ever married there, he says it would feel too much like a funeral. It's terribly mean of him, because decorating it would be such fun. Guess again."
        - id: ch01-b08
          speaker: anne_shirley
          text: "Is Jane's mother letting her give a birthday party?"
        - id: ch01-b09
          speaker: narrator
          text: "Diana shook her head, and her black eyes danced with amusement."
        - id: ch01-b10
          speaker: anne_shirley
          text: "Then I can't imagine what it is. Unless Moody Spurgeon MacPherson walked you home from prayer meeting last night. Did he?"
        - id: ch01-b11
          speaker: diana_barry
          text: "Certainly not! And if that horrid boy had, I wouldn't be bragging about it. I knew you'd never guess. Mother got a letter from Aunt Josephine today. She wants you and me to come to town next Tuesday and stay with her for the Exhibition. There!"
        - id: ch01-b12
          speaker: narrator
          text: "Anne had to lean against a maple tree for support."
        - id: ch01-b13
          speaker: anne_shirley
          text: "Oh, Diana, is that really true? I'm afraid Marilla won't allow it. She'll say she can't encourage me to go gadding about. That's what she said last week when Jane asked me to ride with them to the American concert at the White Sands Hotel. I wanted to go so badly, but Marilla said Jane and I would both be better off studying at home. I was so heartbroken that I refused to say my prayers that night. Then I repented, got up in the middle of the night, and said them after all."
        - id: ch01-b14
          speaker: diana_barry
          text: "We'll have Mother ask Marilla. She'll be much more likely to say yes to her. And if she does, we'll have the best time of our lives! I've never seen an Exhibition. It is so aggravating when the other girls talk about going. Jane and Ruby have already been twice, and they're going again this year."
        - id: ch01-b15
          speaker: anne_shirley
          text: "I refuse to think about it until I know I may go. If I let myself hope and then Marilla says no, I couldn't bear it. Still, if I do go, my new coat will be ready. Marilla thought the old one could last another winter, since I'm already getting a new dress. The dress is lovely, Diana. It's navy blue and very fashionable. Marilla makes my dresses fashionable now because she won't have Matthew asking Mrs. Lynde to make them."
        - id: ch01-b16
          speaker: anne_shirley
          text: "I'm so thankful. Being good is much easier when your clothes are fashionable. It is for me, anyway. Naturally good people may not notice the difference. Matthew insisted I needed a coat, so Marilla bought beautiful blue broadcloth, and a real dressmaker in Carmody is sewing it. It will be finished Saturday night. I keep trying not to picture myself walking down the church aisle on Sunday in my new suit and cap. I'm afraid it isn't right, but the picture slips into my mind anyway."
        - id: ch01-b17
          speaker: anne_shirley
          text: "My cap is beautiful too. Matthew bought it when we went to Carmody. It's blue velvet, the kind everyone is wearing, with gold cord and tassels. Your new hat is elegant, Diana, and it looks so becoming on you. When you entered church last Sunday, I felt proud all over because you were my dearest friend. Do you think it's wrong that we care so much about clothes? Marilla calls it very sinful. But clothes are such an interesting subject, aren't they?"
    - id: ch02
      title: The Road to Town
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: "Marilla did give Anne permission, and they arranged for Mr. Barry to take the girls the next Tuesday. Charlottetown was thirty miles away, and he meant to drive home again that same day, so they had to leave very early. Anne considered that part of the pleasure. On Tuesday she rose before sunrise. The eastern sky beyond the Haunted Wood was silver and cloudless, promising fine weather. Through the trees, a light shone in the west gable of Orchard Slope. Diana was awake too."
        - id: ch02-b02
          speaker: narrator
          text: "Anne was dressed before Matthew lit the fire. She even had breakfast ready when Marilla came downstairs, though she was far too excited to eat any herself. Afterward she put on her smart new jacket and cap, hurried across the brook, and climbed through the firs to Orchard Slope. Mr. Barry and Diana were waiting, and soon all three were on their way."
        - id: ch02-b03
          speaker: narrator
          text: "The drive was long, but Anne and Diana loved every minute. They rattled over damp roads while early red sunlight crept across the harvested fields. The air felt fresh and crisp. Blue-gray mist curled through the valleys and drifted away from the hills. Their road passed through woods where the first maples flew scarlet leaves like banners. It crossed bridges that gave Anne her old shiver of fear and pleasure. Then it followed a harbor past little weathered fishing huts, or climbed hills with wide views of rolling land and hazy blue sky. Wherever the road took them, the girls found plenty to talk about."
        - id: ch02-b04
          speaker: narrator
          text: "It was nearly noon when they reached Charlottetown and found Beechwood. The handsome old house stood well back from the street among green elms and spreading beech trees. Miss Barry welcomed them at the door, her sharp black eyes twinkling."
        - id: ch02-b05
          speaker: miss_barry
          text: "So you've finally come to visit me, Anne-girl. Goodness, child, look how you've grown! Why, you're taller than I am. And you're much prettier than you used to be, though I expect you already know that."
        - id: ch02-b06
          speaker: anne_shirley
          text: "No, I truly didn't know! My freckles aren't as bad as they once were, and I'm very grateful for that. But I never dared hope anything else had improved. I'm so glad you think it has, Miss Barry."
          emotion: happy
        - id: ch02-b07
          speaker: narrator
          text: "Miss Barry went to see about dinner and left the girls in the parlor. The house was furnished with what Anne later called great magnificence. Those two country girls felt shy and small amid all that splendor."
        - id: ch02-b08
          speaker: diana_barry
          text: "Doesn't this look exactly like a palace? I've never been inside Aunt Josephine's house before. I had no idea it was this grand. I wish Julia Bell could see it. She's always putting on such airs about her mother's parlor."
        - id: ch02-b09
          speaker: anne_shirley
          text: "A velvet carpet and silk curtains! I've always dreamed about rooms like this. But you know, Diana, I don't think they make me very comfortable after all. Everything is so crowded and splendid that there's nothing left for the imagination to do. That's one comfort in being poor. You have so much more room to imagine things."
        - id: ch02-b10
          speaker: narrator
          text: "For years afterward, Anne and Diana measured time from that visit to town. From beginning to end, it was packed with delights."
    - id: ch03
      title: A Day at the Exhibition
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: "On Wednesday, Miss Barry took the girls to the Exhibition grounds. They stayed the entire day. Later, Anne poured the whole adventure out to Marilla."
        - id: ch03-b02
          speaker: anne_shirley
          text: "Oh, Marilla, it was wonderful! I never knew there could be so many interesting things in one place. I can't even decide which part I liked best. Perhaps the horses, and the flowers, and the fancywork."
          emotion: happy
        - id: ch03-b03
          speaker: anne_shirley
          text: "Josie Pye won first prize for her knitted lace. I was honestly glad for her. And I was glad that I could be glad, if you understand me. Surely being pleased when Josie succeeds proves I'm becoming a better person, doesn't it?"
        - id: ch03-b04
          speaker: anne_shirley
          text: "Mr. Harmon Andrews won second prize for Gravenstein apples, and Mr. Bell won first prize for a pig. Diana thought a Sunday-school superintendent winning a pig prize was ridiculous. I can't see why it should be. Can you? She says she'll always remember that pig now whenever he prays in such a solemn way."
        - id: ch03-b05
          speaker: anne_shirley
          text: "Clara Louise MacPherson won a prize for painting. Mrs. Lynde took first prize for her homemade butter and cheese. Avonlea did very well, didn't it? Mrs. Lynde was there that day too. Until I saw her familiar face among all those strangers, I never realized how fond I really am of her."
        - id: ch03-b06
          speaker: anne_shirley
          text: "There were thousands and thousands of people, Marilla. Being among so many made me feel terribly small. Miss Barry took us into the grandstand to watch the horse races, but Mrs. Lynde refused to go. She called horse racing wicked. Since she belongs to the church, she believed it was her duty to set an example by staying away. There were so many people in the grandstand, though, that I don't think anyone noticed her example."
        - id: ch03-b07
          speaker: anne_shirley
          text: "I probably shouldn't watch races very often myself. They're much too exciting. Diana got carried away and offered to bet me ten cents that the red horse would win. I didn't think it had a chance, but I wouldn't bet. I wanted to tell Mrs. Allan everything afterward, and I knew I couldn't tell her I'd gambled. If you can't tell the minister's wife about something, you shouldn't do it. Having Mrs. Allan for a friend is almost like having an extra conscience."
        - id: ch03-b08
          speaker: anne_shirley
          text: "And I'm very glad I refused, because the red horse did win. I would have lost my ten cents. So virtue gave me its own reward right away."
        - id: ch03-b09
          speaker: anne_shirley
          text: "We watched a man rise into the sky in a balloon. I'd dearly love to try that. It must be thrilling! Then we found a man selling fortunes. For ten cents, his little bird would choose your fortune. Miss Barry gave Diana and me a dime apiece so we could hear ours."
          emotion: happy
        - id: ch03-b10
          speaker: anne_shirley
          text: "My fortune said I'd marry a rich man with a dark complexion and go across the water to live. Afterward I examined every dark-haired man I saw, very carefully. I didn't much care for any of them. Besides, I suppose I don't need to start watching for him just yet."
        - id: ch03-b11
          speaker: anne_shirley
          text: "It was a day I'll never forget. I became so tired that night I couldn't sleep. Miss Barry kept her promise and put us in the spare room. It was a beautiful room, but sleeping there wasn't as wonderful as I used to imagine. That's the sad part of growing up, and I'm beginning to understand it. By the time you finally get the things you longed for as a child, they aren't half as marvelous as you expected."
    - id: ch04
      title: Music and Ice Cream
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: "On Thursday the girls went driving in the park. That evening, Miss Barry took them to the Academy of Music, where a famous prima donna was singing. For Anne, the whole night shone like a dazzling dream."
        - id: ch04-b02
          speaker: anne_shirley
          text: "Marilla, I simply can't describe it. I was so overcome that I couldn't talk at all. That should tell you how extraordinary it was. I just sat there, perfectly silent and completely enchanted."
          emotion: happy
        - id: ch04-b03
          speaker: anne_shirley
          text: "Madame Selitsky looked beautiful in white satin and diamonds. But the instant she began to sing, I forgot about her dress and everything else. I don't know how to explain what the music did to me. It seemed as though being good could never be difficult again. I felt the same way I do when I gaze up at the stars. Tears filled my eyes, but they were the happiest tears."
          emotion: happy
        - id: ch04-b04
          speaker: anne_shirley
          text: "When the concert ended, I was so sorry. I told Miss Barry I couldn't imagine how I was supposed to return to ordinary life. She suggested that an ice cream at the restaurant across the street might help. It sounded terribly ordinary, but to my surprise, it worked."
        - id: ch04-b05
          speaker: anne_shirley
          text: "The ice cream was delicious. Sitting in a bright restaurant and eating it at eleven o'clock at night felt delightfully wild. Diana decided she must have been born for city life. Miss Barry asked what I thought, but I told her a question that important required serious consideration."
        - id: ch04-b06
          speaker: anne_shirley
          text: "I considered it after I went to bed, because bedtime is the very best time to think things through. And I decided I wasn't born for city life. I'm glad I wasn't. Once in a while, it's lovely to eat ice cream in a brilliant restaurant at eleven at night. But if I had to choose my ordinary life, I'd rather be asleep in the east gable at eleven. Even while I'm sleeping, I somehow know the stars are outside and the wind is moving through the firs across the brook."
        - id: ch04-b07
          speaker: anne_shirley
          text: "I told Miss Barry my decision at breakfast, and she laughed. She laughs at nearly everything I say, even when I'm being completely solemn. I didn't exactly like that, because I wasn't trying to amuse her. Still, she is wonderfully hospitable, and she treated us like royalty."
    - id: ch05
      title: The Best Part of All
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: "Friday was the day to go home, and Mr. Barry drove into town to collect the girls. Miss Barry said goodbye at the door."
        - id: ch05-b02
          speaker: miss_barry
          text: "Well, I hope the two of you enjoyed your visit."
        - id: ch05-b03
          speaker: diana_barry
          text: "Oh, we certainly did."
          emotion: happy
        - id: ch05-b04
          speaker: miss_barry
          text: "And what about you, Anne-girl?"
        - id: ch05-b05
          speaker: anne_shirley
          text: "I loved every single minute of it."
          emotion: happy
        - id: ch05-b06
          speaker: narrator
          text: "Anne impulsively threw both arms around the old woman's neck and kissed her wrinkled cheek. Diana would never have dared to take such a liberty, and she stared in alarm. Miss Barry, however, was delighted. She stood on the veranda and watched until the buggy disappeared. Then she returned to her large house with a sigh. Without those two fresh young lives, it felt very lonely."
        - id: ch05-b07
          speaker: narrator
          text: "Miss Barry had always been rather selfish. She cared little for anyone but herself and valued people mostly when they were useful or entertaining. Anne had entertained her, so the girl had quickly risen in her favor. Yet now Miss Barry thought less about Anne's unusual speeches. She remembered Anne's bright enthusiasm, the feelings anyone could read on her face, her sweet little ways, and the kindness in her eyes and lips."
        - id: ch05-b08
          speaker: miss_barry
          text: "When I heard Marilla Cuthbert had adopted an orphan girl, I thought she was an old fool. But I suppose she didn't make such a mistake after all. If I had a child like Anne living here, I'd be both happier and better."
        - id: ch05-b09
          speaker: narrator
          text: "Anne and Diana enjoyed the journey home as much as the journey to town. In fact, it was even sweeter because home waited at the end. The sun was setting when they passed White Sands and turned onto the shore road. Ahead of them, the Avonlea hills stood dark against a saffron sky. Behind them, the moon rose from the sea, and its light made the water shine and change."
        - id: ch05-b10
          speaker: narrator
          text: "Every small cove beside the winding road sparkled with dancing ripples. Below, waves brushed the rocks with a gentle swish. The strong, cool air carried the sharp scent of the sea."
        - id: ch05-b11
          speaker: anne_shirley
          text: "Oh, it is so good to be alive, and so good to be on my way home."
          emotion: happy
        - id: ch05-b12
          speaker: narrator
          text: "Anne crossed the log bridge over the brook. Up ahead, the kitchen lamp at Green Gables seemed to wink a friendly welcome. Firelight poured through the open doorway, spreading a warm red glow into the cold autumn night. Anne ran happily up the hill and into the kitchen. A hot supper was waiting on the table."
        - id: ch05-b13
          speaker: marilla_cuthbert
          text: "So, you're home again?"
        - id: ch05-b14
          speaker: narrator
          text: "Marilla folded her knitting."
        - id: ch05-b15
          speaker: anne_shirley
          text: "Yes, and coming home feels wonderful! I could kiss every single thing, even the clock. Marilla, is that a broiled chicken? You didn't cook it especially for me, did you?"
          emotion: happy
        - id: ch05-b16
          speaker: marilla_cuthbert
          text: "I did. After that long drive, I expected you'd be hungry and want something tasty. Now take off your things. We'll eat as soon as Matthew comes in. And I will say I'm glad you're back. This house has been fearfully lonely without you. I never knew four days could last so long."
        - id: ch05-b17
          speaker: narrator
          text: "After supper, Anne sat by the fire between Matthew and Marilla and told them the complete story of her visit."
        - id: ch05-b18
          speaker: anne_shirley
          text: "I've had the most splendid time, and I feel as if this visit has begun a whole new age in my life. But coming home was the very best part of it all."
          emotion: happy
