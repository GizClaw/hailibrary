  chapters:
    - id: ch01
      title: The Mistake at White Sands
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            Marilla and Anne reached White Sands at last. Mrs. Spencer lived in a large yellow house by the cove. When she opened the door, her kind face showed both surprise and pleasure.
        - id: ch01-b02
          speaker: mrs_spencer
          text: >-
            Well, well! You're about the last people I expected today, but I'm truly glad to see you. Will you put the horse in? And Anne, how are you?
        - id: ch01-b03
          speaker: anne_shirley
          text: I'm doing about as well as anyone could expect, thank you.
        - id: ch01-b04
          speaker: narrator
          text: >-
            Anne did not smile. It was as though something cold and deadly had settled over her.
        - id: ch01-b05
          speaker: marilla_cuthbert
          text: >-
            We'll stay long enough to rest the mare, but I told Matthew we'd be home early. Mrs. Spencer, there's been a strange mistake, and I came to find out how it happened. Matthew and I sent word that you were to bring us a boy from the asylum, ten or eleven years old. We gave that message to your brother Robert.
        - id: ch01-b06
          speaker: mrs_spencer
          text: >-
            Marilla Cuthbert, you can't mean it! Robert passed the message through his daughter Nancy, and Nancy said you wanted a girl. Isn't that what she told us, Flora Jane?
          emotion: surprised
        - id: ch01-b07
          speaker: flora_jane
          text: Yes, Miss Cuthbert. That is exactly what Nancy said.
        - id: ch01-b08
          speaker: mrs_spencer
          text: >-
            I'm terribly sorry. This is awful, but you can see it wasn't my fault. I did the best I could, and I truly thought I was doing what you asked. Nancy is so careless. I've had to give her a good scolding many times for not paying attention.
          emotion: sad
        - id: ch01-b09
          speaker: marilla_cuthbert
          text: >-
            The fault was ours. We should have come ourselves instead of letting an important message travel from one person to another. Still, the mistake has been made, and now we have to put it right. Can Anne go back to the asylum? They'll take her back, won't they?
        - id: ch01-b10
          speaker: mrs_spencer
          text: >-
            I expect they would take her back, but sending her there may not be necessary at all. Mrs. Peter Blewett was here yesterday. She told me she wished she'd asked me to bring a little girl for her too, someone who could help around the house. She has such a large family, you know, and she can hardly find enough help. Anne might be exactly the girl she needs. Why, I'd call the whole thing positively providential.
        - id: ch01-b11
          speaker: narrator
          text: >-
            Marilla did not see anything providential about it. Here was a simple way to get the unwanted orphan off her hands, yet she felt no gratitude at all.
        - id: ch01-b12
          speaker: narrator
          text: >-
            She knew Mrs. Peter Blewett by sight. The woman was small and painfully thin, with a sour face. Marilla had heard plenty about her too. People said Mrs. Blewett worked everyone hard and drove them harder. Servant girls who had left her house told frightening stories about her temper, her stinginess, and her rude, quarrelsome children. The thought of leaving Anne to Mrs. Blewett's tender mercies troubled Marilla's conscience.
        - id: ch01-b13
          speaker: marilla_cuthbert
          text: All right. Let's go inside and talk it over.
    - id: ch02
      title: Mrs. Blewett Comes Calling
      blocks:
        - id: ch02-b01
          speaker: mrs_spencer
          text: >-
            And would you look at that! Mrs. Peter is coming up the lane this very minute. What wonderful luck. We can settle everything right away.
        - id: ch02-b02
          speaker: narrator
          text: >-
            Mrs. Spencer hurried everyone through the hall and into the parlor. The room felt deathly cold. Its dark green blinds had been shut so tightly and for so long that the air seemed to have lost every bit of warmth it once had.
        - id: ch02-b03
          speaker: mrs_spencer
          text: >-
            Take the armchair, Miss Cuthbert. Anne, sit on this ottoman and keep still. Give me your hats. Flora Jane, put the kettle on. Good afternoon, Mrs. Blewett! We were just saying how fortunate it is that you came by. Mrs. Blewett, this is Miss Cuthbert. Please excuse me for one moment. I forgot to tell Flora Jane to get the buns out of the oven.
        - id: ch02-b04
          speaker: narrator
          text: >-
            Mrs. Spencer pulled up the blinds and whisked away. Anne sat without speaking, her hands locked tight in her lap. She could not stop staring at Mrs. Blewett. Was she really going to be handed over to this woman with the sharp face and sharper eyes? A lump rose in Anne's throat, and her eyes began to sting painfully. She feared she could not hold the tears back much longer. Then Mrs. Spencer came bustling in again, flushed and cheerful. She looked ready to consider any problem, whether it concerned the body, the mind, or the spirit, and settle it immediately.
        - id: ch02-b05
          speaker: mrs_spencer
          text: >-
            Mrs. Blewett, it turns out there was a mistake about this little girl. I was told Mr. and Miss Cuthbert wanted to adopt a girl, but they had actually asked for a boy. If you still feel the way you did yesterday, I believe Anne would suit you perfectly.
        - id: ch02-b06
          speaker: narrator
          text: Mrs. Blewett looked Anne over from her head all the way down to her feet.
        - id: ch02-b07
          speaker: mrs_blewett
          text: What's your name, and how old are you?
        - id: ch02-b08
          speaker: narrator
          text: >-
            Anne shrank back and answered in a shaky voice. This time, she did not dare explain that her name ended with an e.
        - id: ch02-b09
          speaker: anne_shirley
          text: I'm Anne Shirley, and I'm eleven.
          emotion: fearful
        - id: ch02-b10
          speaker: mrs_blewett
          text: >-
            Hmph. There's not much of you, is there? Still, you look wiry, and sometimes wiry girls are the best workers. If I take you, you'll have to behave. You'll be quick, respectful, and good, and you'll earn every bite you eat. I suppose I might as well take her, Miss Cuthbert. The baby has been terribly fussy, and looking after him has worn me out. I can bring her home with me right now, if you want.
        - id: ch02-b11
          speaker: narrator
          text: >-
            Marilla looked at Anne. The child's face had gone pale, and it held a silent misery. She looked like a helpless little creature caught once more in the very trap she had escaped. Marilla knew that if she ignored that wordless appeal, it would trouble her for the rest of her life. Besides, she did not like Mrs. Blewett. Could she really hand such a sensitive, high-strung child over to this woman? No. Marilla could not take that responsibility.
        - id: ch02-b12
          speaker: marilla_cuthbert
          text: >-
            I'm not sure about that. I never said Matthew and I had made a final decision against keeping her. To tell the truth, Matthew would like her to stay. I only came here to learn how the mistake happened. I'd better take Anne home and discuss it with him, because I shouldn't decide without consulting him. If we decide not to keep her, we'll bring her here tomorrow night or send her over. If we don't, then you'll know she's staying with us. Will that do, Mrs. Blewett?
        - id: ch02-b13
          speaker: mrs_blewett
          text: I suppose it will have to.
        - id: ch02-b14
          speaker: narrator
          text: >-
            As Marilla spoke, it was as if sunrise slowly spread across Anne's face. Her despair disappeared first. Then hope brought a little color back to her cheeks, and her eyes grew deep and bright as morning stars. She looked completely transformed.
        - id: ch02-b15
          speaker: narrator
          text: >-
            A moment later, Mrs. Spencer and Mrs. Blewett left the room to hunt for a recipe Mrs. Blewett had come to borrow. Anne jumped up and flew across the room to Marilla.
        - id: ch02-b16
          speaker: anne_shirley
          text: >-
            Oh, Miss Cuthbert, did you truly say you might let me stay at Green Gables? Did you really say it? Or did I only imagine it?
          emotion: surprised
        - id: ch02-b17
          speaker: narrator
          text: >-
            She spoke in a breathless whisper, as if saying the words aloud might break that glorious possibility.
        - id: ch02-b18
          speaker: marilla_cuthbert
          text: >-
            Anne, you'd better learn to control that imagination if you can't tell what's real from what isn't. Yes, you heard me say exactly that, and nothing more. We haven't decided yet. We may still let Mrs. Blewett take you. She needs your help far more than I do.
        - id: ch02-b19
          speaker: anne_shirley
          text: >-
            I'd rather go back to the asylum than live with her. She looks just like a... like a gimlet!
          emotion: fearful
        - id: ch02-b20
          speaker: narrator
          text: >-
            Marilla had to hide a smile, because she knew Anne ought to be scolded for saying such a thing.
        - id: ch02-b21
          speaker: marilla_cuthbert
          text: >-
            You should be ashamed of speaking that way about a lady you've never met before. Go sit down again. Be quiet, hold your tongue, and behave properly.
        - id: ch02-b22
          speaker: anne_shirley
          text: >-
            I'll try to do anything and be anything you want, if you'll only keep me.
        - id: ch02-b23
          speaker: narrator
          text: Anne went meekly back to the ottoman.
    - id: ch03
      title: Marilla Makes Up Her Mind
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            When Marilla and Anne returned to Green Gables that evening, Matthew was waiting in the lane. Marilla had noticed him wandering up and down there from some distance away, and she had already guessed what brought him out. The relief on his face was plain when he saw that she had at least brought Anne home with her. Still, Marilla said nothing to him about what had happened. She waited until they were both in the yard behind the barn, busy milking the cows. Only then did she briefly tell him Anne's history and explain how the meeting with Mrs. Spencer had ended.
        - id: ch03-b02
          speaker: matthew_cuthbert
          text: >-
            I wouldn't hand over even a dog I cared about to that Blewett woman.
          emotion: angry
        - id: ch03-b03
          speaker: narrator
          text: Matthew spoke with more force than usual.
        - id: ch03-b04
          speaker: marilla_cuthbert
          text: >-
            I don't care for her ways either. But our choices are to send Anne to her or keep the girl ourselves. Since you clearly want her here, I suppose I'm willing too. Or perhaps I have to be. I've considered it so much that the idea doesn't feel strange anymore. It seems almost like a duty. I've never raised a child, especially not a girl, and I expect I'll make a dreadful mess of it. But I'll do the best I can. As far as I'm concerned, Matthew, Anne may stay.
        - id: ch03-b05
          speaker: narrator
          text: Matthew's shy face glowed with delight.
        - id: ch03-b06
          speaker: matthew_cuthbert
          text: >-
            Well now, I thought you'd come around to seeing it that way, Marilla. She's such an interesting little thing.
          emotion: happy
        - id: ch03-b07
          speaker: marilla_cuthbert
          text: >-
            It would matter more if she were a useful little thing. I'll see to it that she learns to be useful. And listen, Matthew. You are not to interfere with the way I train her. An old maid may not know much about raising a child, but she likely knows more than an old bachelor does. Leave Anne to me. If I fail, then you can step in.
        - id: ch03-b08
          speaker: matthew_cuthbert
          text: >-
            All right, all right, Marilla. You can manage things your way. Just be as good and kind to her as you can without spoiling her. I have a feeling she'll do anything for you, once she comes to love you.
        - id: ch03-b09
          speaker: narrator
          text: >-
            Marilla sniffed. That showed exactly what she thought of Matthew's opinions about girls and women. Then she picked up the pails and went to the dairy.
        - id: ch03-b10
          speaker: narrator
          text: >-
            As she strained the milk into the creamers, Marilla decided not to tell Anne that night. The girl would be so excited she would never sleep.
        - id: ch03-b11
          speaker: marilla_cuthbert
          text: >-
            Marilla Cuthbert, you've certainly gotten yourself into something now. Did you ever think the day would come when you'd adopt an orphan girl? That's surprising enough. But the greatest surprise is that Matthew started it all, when he's always been so terribly afraid of little girls. Well, we've agreed to try it, and goodness only knows what will come of it.
