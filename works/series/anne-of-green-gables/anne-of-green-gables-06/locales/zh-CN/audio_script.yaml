audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖从容，带着细腻而机智的讲述感
        timbre: 清澈柔和
        pace: 舒缓而有变化
        pitch: 中音
    anne:
      display_name: 安妮
      tts:
        delivery: 热切灵动，想法接连涌出，真挚而富于想象
        timbre: 清亮稚嫩
        pace: 明快，动情处自然放慢
        pitch: 中高音
    marilla:
      display_name: 玛丽拉
      tts:
        delivery: 干脆严谨，言语直截了当，偶尔透出克制的温情
        timbre: 清晰沉稳
        pace: 中等
        pitch: 中音
    mrs_spencer:
      display_name: 斯宾塞太太
      tts:
        delivery: 热心爽快，忙忙碌碌，凡事都要立刻张罗妥当
        timbre: 饱满和善
        pace: 稍快
        pitch: 中高音
    flora_jane:
      display_name: 弗洛拉·简
      tts:
        delivery: 认真直率，回答清楚肯定
        timbre: 年轻明亮
        pace: 中等
        pitch: 中高音
    mrs_blewett:
      display_name: 布卢伊特太太
      tts:
        delivery: 尖刻强硬，盘问般干脆，不留温情
        timbre: 干涩锐利
        pace: 偏快
        pitch: 中高音
    matthew:
      display_name: 马修
      tts:
        delivery: 腼腆温厚，话不多，关键处朴实而坚定
        timbre: 低沉柔和
        pace: 舒缓
        pitch: 低音
  chapters:
    - id: ch01
      title: 第六章　玛丽拉拿定主意
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 她们总算按时到了白沙湾。斯宾塞太太住在一幢宽大的黄房子里。她迎到门口，那张和善的脸上，一半是惊讶，一半是欢迎。
        - id: ch01-b02
          speaker: mrs_spencer
          text: 哎呀，我今天怎么也没料到你们会来！不过见到你们，我可真高兴。你们要把马牵进去吧？安妮，你好吗？
          emotion: surprised
        - id: ch01-b03
          speaker: anne
          text: 就眼下的情形来说，我还过得去。谢谢您。
          emotion: sad
        - id: ch01-b04
          speaker: narrator
          text: 安妮脸上一丝笑意也没有，仿佛整个人都叫寒霜打蔫了。
        - id: ch01-b05
          speaker: marilla
          text: 我们待一会儿，让母马歇歇，不过我答应马修要早些回去。斯宾塞太太，这中间不知出了什么怪差错，我就是来查清楚的。我和马修请你从孤儿院带个男孩来，还特意托你哥哥罗伯特转告你，我们要的是十岁或十一岁的男孩。
        - id: ch01-b06
          speaker: mrs_spencer
          text: 玛丽拉·卡斯伯特，不会吧！罗伯特托他女儿南希把话捎给我，她明明说你们要的是个女孩。弗洛拉·简，她不是这么说的吗？
          emotion: surprised
        - id: ch01-b07
          speaker: narrator
          text: 斯宾塞太太慌忙向刚走上台阶的女儿求证。
        - id: ch01-b08
          speaker: flora_jane
          text: 她确实是这么说的，卡斯伯特小姐。
        - id: ch01-b09
          speaker: mrs_spencer
          text: 我真是万分抱歉。这件事太糟了，可确实不是我的错呀。我已经尽力照你们的嘱咐办了。南希那孩子冒失得很，我常常因为她粗心大意，狠狠数落她。
        - id: ch01-b10
          speaker: marilla
          text: 是我们自己不好。这么要紧的话，本该亲自来告诉你，不该让人一个接一个地捎口信。现在错已经出了，只能想法纠正。我们能把这孩子送回孤儿院吗？他们会收回她吧？
        - id: ch01-b11
          speaker: mrs_spencer
          text: 我想会的。不过，我看不必送她回去。彼得·布卢伊特太太昨天来过。她还后悔没托我带个小姑娘回来帮忙呢。她家人口多，又难雇到人，安妮正适合她。我说，这简直是上天特意安排的。
        - id: ch01-b12
          speaker: narrator
          text: 玛丽拉脸上可看不出她相信这事跟上天有什么关系。眼前明明突然来了一个再好不过的机会，可以把这个不受欢迎的孤儿从自己手里送出去，可不知为什么，她心里竟然连一点感激也没有。
        - id: ch01-b13
          speaker: narrator
          text: 玛丽拉只见过布卢伊特太太几面。那女人身材矮小，满脸刻薄相，瘦得浑身骨头上没有一丝多余的肉。可关于她的传闻，玛丽拉听过不少。人们都说，她不但自己拼命干，也拼命驱使别人干活。被她辞退的女佣还讲过不少吓人的事，说她脾气暴躁，出手吝啬，家里那群孩子又无礼，又爱吵架。一想到要把安妮交到这个女人的“温柔照料”之下，玛丽拉的良心就隐隐不安。
        - id: ch01-b14
          speaker: marilla
          text: 好吧，我进去坐坐，我们把这件事商量一下。
        - id: ch01-b15
          speaker: mrs_spencer
          text: 哎呀，彼得太太偏偏这会儿从小路上来了！这可真巧，事情马上就能定下来。
          emotion: surprised
        - id: ch01-b16
          speaker: narrator
          text: 斯宾塞太太一面说，一面忙着把客人领过前厅，带进客厅。一股逼人的寒气立刻迎面袭来。深绿色的百叶窗严严实实地关了太久，仿佛屋里的空气也被它们过滤了不知多少年，早已失去了从前有过的每一丝暖意。
        - id: ch01-b17
          speaker: mrs_spencer
          text: 卡斯伯特小姐，请坐扶手椅。安妮，你坐到软凳上，不许乱动。帽子给我吧。弗洛拉·简，去把水烧上。下午好，布卢伊特太太。您来得正是时候。我来介绍一下，这位是卡斯伯特小姐。请等我一会儿，我忘了叫弗洛拉·简把圆面包拿出烤炉了。
        - id: ch01-b18
          speaker: narrator
          text: 斯宾塞太太拉起百叶窗，又风风火火地走了。安妮默默坐在软凳上，双手紧紧绞在膝头，像着了魔似的盯着布卢伊特太太。难道她真要被交给这个尖脸、利眼的女人照管？她的喉头慢慢堵起一个硬块，眼睛也刺痛得厉害。她开始害怕，自己再也忍不住眼泪了。就在这时，斯宾塞太太回来了。她满面红光，喜气洋洋，仿佛世上无论身体、头脑还是灵魂上的难题，只要交给她稍微想一想，她都能立刻料理妥当。
        - id: ch01-b19
          speaker: mrs_spencer
          text: 布卢伊特太太，这个小姑娘的事出了差错。我原以为卡斯伯特先生和小姐要收养一个女孩，别人确实是这么告诉我的。可他们原来要的是男孩。要是您还跟昨天一样想找个小姑娘，我看她正合适。
        - id: ch01-b20
          speaker: narrator
          text: 布卢伊特太太把安妮从头到脚飞快地扫了一遍。
        - id: ch01-b21
          speaker: mrs_blewett
          text: 你几岁？叫什么名字？
        - id: ch01-b22
          speaker: anne
          text: 我叫安妮·雪莉，今年十一岁。
          emotion: fearful
        - id: ch01-b23
          speaker: narrator
          text: 安妮畏缩着，连名字该怎样拼写也不敢提了。
        - id: ch01-b24
          speaker: mrs_blewett
          text: 哼！看你这副样子，可没多少分量，不过还算结实。说不定结实的孩子最好使。我要是收下你，你就得听话、勤快、懂礼貌。你吃我的饭，就得干活来挣，别想有别的说法。卡斯伯特小姐，我看不如替你把她领走。家里那个小娃娃闹得厉害，我照看他都快累垮了。你愿意的话，我现在就带她回家。
        - id: ch01-b25
          speaker: narrator
          text: 玛丽拉看看安妮。孩子脸色惨白，满面无声的凄苦，就像一只无依无靠的小生灵，好不容易从罗网里逃出去，如今又发现自己落回了陷阱。玛丽拉的心软了。她忽然确信，要是自己拒绝这张脸上的哀求，那目光准会一直缠着她，直到她离开人世。何况，她也不喜欢布卢伊特太太。把这么敏感、这么容易紧张的孩子交给那种女人，她实在担不起这个责任。
        - id: ch01-b26
          speaker: marilla
          text: 这个嘛，我还说不准。我没说马修和我已经彻底决定不留下她。其实，马修倒很想留下她。我今天只是来弄清楚，这个差错怎么会发生。还是先把她带回家，再跟马修商量吧。没问过他的意见，我不该擅自决定。要是我们不留她，明晚就把她送来，或者叫人带来。要是没送，你就知道她会留在我们家。这样行吗？
        - id: ch01-b27
          speaker: mrs_blewett
          text: 看来，也只能这样了。
          emotion: disgusted
        - id: ch01-b28
          speaker: narrator
          text: 玛丽拉说这番话的时候，一轮朝阳正从安妮脸上渐渐升起。绝望的神情先退去了，接着泛出一抹微弱的希望。她的眼睛越来越深，越来越亮，像清晨的星星。方才还凄苦无助的孩子，转眼间整个人都变了样。
        - id: ch01-b29
          speaker: narrator
          text: 过了一会儿，斯宾塞太太陪布卢伊特太太出去找一份食谱。安妮一下跳起来，飞奔到玛丽拉身边。她不敢大声说话，仿佛声音稍微一响，就会把眼前的希望震碎。
        - id: ch01-b30
          speaker: anne
          text: 卡斯伯特小姐，您刚才真的说，也许会让我留在绿山墙吗？您真的说了吗？还是我只是想象您说过？
          emotion: surprised
        - id: ch01-b31
          speaker: marilla
          text: 安妮，要是你连真事和想象都分不清，最好学着管住你的想象力。是的，你确实听见我那么说了，也只说了这些。事情还没定，最后我们说不定还是会让布卢伊特太太带你走。她显然比我更需要你。
        - id: ch01-b32
          speaker: anne
          text: 我宁可回孤儿院，也不愿跟她住。她看上去活像一把钻子。
          emotion: fearful
        - id: ch01-b33
          speaker: narrator
          text: 玛丽拉差点笑出来，可她觉得这种话非训斥不可，只好把笑意压下去。
        - id: ch01-b34
          speaker: marilla
          text: 你这么小的姑娘，竟然这样议论一位素不相识的太太，真该害臊。回去安静坐好，闭上嘴，拿出好孩子的样子来。
          emotion: angry
        - id: ch01-b35
          speaker: anne
          text: 只要您肯留下我，您要我做什么，要我成为什么样的人，我都会努力。
        - id: ch01-b36
          speaker: narrator
          text: 安妮果然温顺地走回去，在那张软凳上重新坐好。
        - id: ch01-b37
          speaker: narrator
          text: 傍晚回到绿山墙时，马修在小路上迎着她们走来。玛丽拉远远看见他在那里来回徘徊，就猜到了他的用意。马修发现她至少把安妮带了回来，脸上顿时露出如释重负的神情。玛丽拉早料到会这样，却一个字也没对他提。直到两人来到谷仓后面的院子里，一边挤牛奶，她才简短说起安妮从前过的日子，也讲了自己去见斯宾塞太太以后，事情有了什么结果。
        - id: ch01-b38
          speaker: matthew
          text: 就算是我喜欢的一条狗，我也不会交给那个布卢伊特女人。
          emotion: angry
        - id: ch01-b39
          speaker: marilla
          text: 我也不喜欢她那副做派。可眼下只有两个办法，不是把安妮交给她，就是我们自己留下。既然你看起来这么想要她，我大概也愿意，或者说，不得不愿意。我把这件事翻来覆去想了许久，现在已经多少习惯这个念头了。把她留下，似乎也算是我们的责任。
        - id: ch01-b40
          speaker: marilla
          text: 我从没养育过孩子，更别说女孩，没准会弄得一塌糊涂。不过我会尽力。就我这边来说，马修，她可以留下。
        - id: ch01-b41
          speaker: narrator
          text: 听见这句话，马修那张一向腼腆的脸，一下子因抑制不住的喜悦而容光焕发。
        - id: ch01-b42
          speaker: matthew
          text: 嗯，我就知道你最后也会这么想，玛丽拉。她真是个有意思的小家伙。
          emotion: happy
        - id: ch01-b43
          speaker: marilla
          text: 你要是能说她是个有用的小家伙，那才更要紧。不过，我会把教她成为有用的人，当作自己的责任。还有，马修，你可不许插手干涉我的办法。老姑娘也许不大懂怎样养孩子，可我猜，总比老光棍懂得多。所以，你只管让我来管教她。等我真的失败了，你再来插手也不迟。
        - id: ch01-b44
          speaker: matthew
          text: 好了，好了，玛丽拉，全照你的意思办。只是，在不把她宠坏的前提下，你要尽可能对她好些，也和气些。我总觉得，她是那种只要能让她爱上你，就什么都能教会她、什么事都能让她做好的孩子。
          emotion: calm
        - id: ch01-b45
          speaker: narrator
          text: 玛丽拉从鼻子里哼了一声，表明她根本不信马修对于女人和女孩能有什么高明见解。随后，她提起装满牛奶的奶桶，径直走向乳品间。
        - id: ch01-b46
          speaker: marilla
          text: 今晚先不告诉她能留下。她准会兴奋得整夜合不上眼。玛丽拉·卡斯伯特，你这回可真把自己套进去了。从前哪想得到，有一天你会收养一个孤女？这已经够叫人吃惊了，可更叫人吃惊的是，背后推动这一切的竟然是马修。他一向像是怕极了小女孩。不管怎样，我们已经决定试一试，至于以后会有什么结果，那就只有天知道了。
