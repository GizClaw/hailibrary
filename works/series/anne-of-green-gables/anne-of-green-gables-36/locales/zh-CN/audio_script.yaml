audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖机敏，带着含蓄的幽默讲述
        timbre: 清澈柔和
        pace: 舒展而富有变化
        pitch: medium
    anne:
      display_name: 安妮
      tts:
        delivery: 热烈敏感，想象丰富，情绪来得真切而迅速
        timbre: 明亮清脆的少女声
        pace: 偏快，激动时连贯奔涌
        pitch: medium-high
    jane:
      display_name: 简
      tts:
        delivery: 坦率务实，想到什么就直说
        timbre: 清亮朴实的少女声
        pace: 自然明快
        pitch: medium-high
    male_student:
      display_name: 男学生
      tts:
        delivery: 青春爽朗，欢呼时热烈响亮
        timbre: 清亮有力的少年声
        pace: 明快
        pitch: medium
    male_student_2:
      display_name: 另一名男学生
      tts:
        delivery: 青春爽朗，随同伙伴热烈欢呼
        timbre: 清亮饱满的少年声
        pace: 明快
        pitch: medium
    matthew:
      display_name: 马修
      tts:
        delivery: 腼腆迟缓，真挚的感情藏在朴素话语里
        timbre: 温厚略显沙哑的老年男声
        pace: 缓慢，常有思量后的停顿
        pitch: low
    marilla:
      display_name: 玛丽拉
      tts:
        delivery: 严厉务实，关切藏在克制的话语里
        timbre: 稳定清晰的中年女声
        pace: 从容直接
        pitch: medium-low
    miss_barry:
      display_name: 巴里小姐
      tts:
        delivery: 阅历丰富，判断笃定，关怀中带着讲究
        timbre: 清晰端雅的老年女声
        pace: 从容适中
        pitch: medium
    diana:
      display_name: 戴安娜
      tts:
        delivery: 亲切真诚，对朋友满怀关心
        timbre: 柔和甜润的少女声
        pace: 自然适中
        pitch: medium-high
  chapters:
    - id: ch01
      title: 第三十六章　荣耀与梦想
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 女王学院公布全部考试成绩的那天早晨，安妮和简一同往学校走。简笑得很轻松。考试已经过去，她也确信自己至少能及格，别的便不放在心上。她没有高得惊人的志向，也就不必承受志向带来的不安。可人在世上得到任何东西，都要付出代价。志向固然值得拥有，换取它的却是勤奋、克制、焦虑和灰心。安妮脸色苍白，一路无话。再等十分钟，她就会知道奖章和艾弗里奖学金各归谁所有。眼下看来，十分钟以后的光阴，简直都不能叫作时间。
        - id: ch01-b02
          speaker: jane
          text: 你总会拿到其中一个。学院要是不给你，那也太不公平了。
        - id: ch01-b03
          speaker: anne
          text: 我根本不指望艾弗里奖学金，人人都说会给艾米莉·克莱。我也不敢当着那么多人的面走到布告栏前看成绩。我要直接躲进女生更衣室。简，你替我看完就赶快来告诉我。看在我们多年友情的分上，一刻也别耽搁。要是我没拿到，你就明说，千万别绕着弯子安慰我，更不许同情我。你一定得答应。
        - id: ch01-b04
          speaker: narrator
          text: 简郑重答应了，可这个承诺并没有用武之地。两人刚走上学院门前的台阶，就看见大厅里全是男生。他们把吉尔伯特·布莱思高高抬在肩上，放开嗓门欢呼。
        - id: ch01-b05
          speakers: [male_student, male_student_2]
          ensemble: duo
          text: 为奖章得主布莱思喝彩！
        - id: ch01-b06
          speaker: narrator
          text: 那一刻，失败和失望狠狠刺痛了安妮。原来自己输了，吉尔伯特赢了。马修该多么难过，他一直相信得奖的人会是她。
        - id: ch01-b07
          speaker: narrator
          text: 可紧接着，人群里又有人高声喊了起来。
        - id: ch01-b08
          speaker: male_student
          text: 为艾弗里奖学金得主雪莉小姐欢呼三声！
          emotion: happy
        - id: ch01-b09
          speaker: narrator
          text: 四周顿时响起热烈的喝彩。安妮和简慌忙逃进女生更衣室，简激动得直喘气。
        - id: ch01-b10
          speaker: jane
          text: 安妮，我真为你骄傲！这也太好了！
          emotion: happy
        - id: ch01-b11
          speaker: narrator
          text: 姑娘们马上围住了她们。安妮站在一群欢笑祝贺的人中间，肩膀让人拍了又拍，手被使劲握住，整个人被推着、拉着、抱着。好不容易，她才凑到简耳边说出一句话。
        - id: ch01-b12
          speaker: anne
          text: 马修和玛丽拉知道了，一定会高兴极了！我得马上写信回家。
          emotion: happy
        - id: ch01-b13
          speaker: narrator
          text: 下一件大事是毕业典礼，地点就在学院的大礼堂。台上有人发表演说，有人宣读文章，也有人唱歌，毕业证书、奖品和奖章则一项接一项，当着所有人的面颁了出去。马修和玛丽拉也坐在台下。可从典礼开始到结束，他们眼里看着、耳里听着的，只有台上的一个学生。那是个身穿淡绿色衣裙的高个子姑娘，脸颊微微发红，眼睛像星星一样亮。她读了全场最好的文章，四周的人都指着她低声议论，说她正是艾弗里奖学金的得主。
        - id: ch01-b14
          speaker: narrator
          text: 安妮读完以后，马修终于说出了进礼堂以来的第一句话。
        - id: ch01-b15
          speaker: matthew
          text: 玛丽拉，你一定很庆幸当初把她留下了吧？
        - id: ch01-b16
          speaker: marilla
          text: 我庆幸又不是今天才开始的。马修·卡思伯特，你偏爱把明摆着的事再说一遍。
        - id: ch01-b17
          speaker: narrator
          text: 巴里小姐坐在他们后面。她往前一探身，用阳伞捅了捅玛丽拉的后背。
        - id: ch01-b18
          speaker: miss_barry
          text: 你不为安妮这姑娘骄傲吗？反正我骄傲得很。
          emotion: happy
        - id: ch01-b19
          speaker: narrator
          text: 当天晚上，安妮便跟着马修和玛丽拉回了埃文利。从四月以后，她一直没有回家，如今一天也不愿再等。苹果花开了，整个世界都显得清新又年轻。戴安娜已经等在绿山墙。走进自己的白色房间，安妮看看四周，幸福地长长吸了一口气。玛丽拉还在窗台上放了一盆盛开的月季。
        - id: ch01-b20
          speaker: anne
          text: 戴安娜，回家真好！尖尖的冷杉又映在粉红的天上，果园雪白雪白，老白雪皇后也还在那里。薄荷的气味多香呀！还有这朵月季，它简直把一首歌、一个希望和一篇祈祷全装在一起了。能再见到你，也真好！
          emotion: happy
        - id: ch01-b21
          speaker: diana
          text: 我还当你已经更喜欢斯特拉·梅纳德了。乔西·派伊亲口告诉我的。她说你完全给斯特拉迷住了。
        - id: ch01-b22
          speaker: narrator
          text: 安妮笑着抓起花束里已经凋谢的“六月百合”，朝戴安娜丢过去。
        - id: ch01-b23
          speaker: anne
          text: 斯特拉是世上最可爱的姑娘，只有一个人比她更可爱，那就是你。我现在比从前更爱你，还有一肚子话要讲。不过此刻只坐着看看你，我就已经很快乐了。我大概是真的累了。用功使我累，胸怀大志也使我累。明天我要去果园，在草地上躺足两个钟头，脑子里什么也不想。
        - id: ch01-b24
          speaker: diana
          text: 安妮，你做得太出色了。既然拿到了艾弗里奖学金，你就不去教书了吧？
        - id: ch01-b25
          speaker: anne
          text: 不去了，九月我就上雷德蒙德大学。多么奇妙啊！先过三个金灿灿的假期月份，到时候，我准会重新攒满一整套志向。简和露比要去教书。我们每个人都通过了考试，连穆迪·斯珀吉翁和乔西·派伊也不例外，这不是很棒吗？
          emotion: happy
        - id: ch01-b26
          speaker: diana
          text: 新桥村的校董已经把学校给简了。吉尔伯特·布莱思也得去教书。他父亲终究供不起他明年上大学，所以他准备自己挣钱，供自己读完。要是埃姆斯小姐离开，我想埃文利的学校就会归他。
        - id: ch01-b27
          speaker: narrator
          text: 安妮听了，心里忽然又惊讶又失落。她原本不知道这些，一直以为吉尔伯特也会去雷德蒙德。那场不断催她向前的竞争要是停了，她该怎么办？哪怕将来进的是男女同校的大学，前面还有真正的学位可以争取，没有这个既像朋友又像敌人的对手，功课恐怕还是会变得平淡，少掉许多滋味。
        - id: ch01-b28
          speaker: narrator
          text: 第二天吃早饭时，安妮猛然发现马修的气色很不好。跟一年前相比，他的头发分明白了许多。等马修出门，她才迟疑着开口。
        - id: ch01-b29
          speaker: anne
          text: 玛丽拉，马修的身体真的还好吗？
        - id: ch01-b30
          speaker: marilla
          text: 不，他并不好。今年春天，他的心脏真发作过好几回，可还是一点活儿也不肯少做。我一直担心得很。好在最近好些了，我们也雇到了一个可靠的长工。我就盼着他肯歇一歇，把身体养回来。现在你到家了，也许他真会好起来。你总能叫他高兴。
          emotion: sad
        - id: ch01-b31
          speaker: narrator
          text: 安妮越过桌子，伸出双手捧住玛丽拉的脸。
        - id: ch01-b32
          speaker: anne
          text: 可你看起来也不够好，玛丽拉。你这么疲倦，准是一直干活太辛苦。我已经回家了，你必须休息。只要把今天留给我，让我去看看那些亲爱的老地方，再找一找从前的梦想。明天起就换你偷懒，所有活儿都交给我。
        - id: ch01-b33
          speaker: narrator
          text: 玛丽拉带着疼爱，朝她的姑娘笑了。
        - id: ch01-b34
          speaker: marilla
          text: 不是活儿的问题，是我的头。如今眼睛后面常常疼。斯宾塞医生替我折腾了好几副眼镜，还是没有用。六月底有位出名的眼科医生要到岛上来，医生坚持要我去看。我看非去不可了，现在读书、做针线都很难受。
        - id: ch01-b35
          speaker: marilla
          text: 不过安妮，你在女王学院确实做得漂亮。一年就拿到一级教师执照，又赢得艾弗里奖学金。林德太太说，人一骄傲就要栽跟头。她根本不信女人该受高等教育，还说那会让女人没法尽自己的本分。我可一个字也不信。说到蕾切尔，我倒想起来了。你最近有没有听说阿比银行的消息？
        - id: ch01-b36
          speaker: anne
          text: 我听人说，那家银行不太稳当。为什么问这个？
        - id: ch01-b37
          speaker: marilla
          text: 蕾切尔也这么说。上星期她来过一趟，说外面已经有人议论。马修很不放心，因为我们一分一厘的积蓄都存在那里。我当初就想把钱存进储蓄银行，可老阿比先生是父亲的老朋友，父亲一辈子也都把钱存在他那里。马修觉得，只要银行由老阿比掌管，谁都可以放心。
        - id: ch01-b38
          speaker: anne
          text: 可他这些年应该只是挂名的负责人。他已经很老了，真正管银行的是他的几个侄子。
        - id: ch01-b39
          speaker: marilla
          text: 所以蕾切尔一说，我就要马修马上把钱全取出来。他只说会想一想。偏偏罗素先生昨天又告诉他，银行稳当得很。
        - id: ch01-b40
          speaker: narrator
          text: 那一天，安妮回到户外天地的怀抱，过得无比美好。她一生都没有忘记它。阳光明亮而金黄，四处那么美，没有一片阴影，花朵也开得慷慨。她把一天里好几个丰盈的钟头留给果园，又走访了树精之泉、柳池和紫罗兰谷。她还去了牧师住宅，和艾伦太太畅快地谈了许久。傍晚时，安妮陪马修穿过情人小径，到后面的牧场赶牛。夕阳给整座树林披上荣光，温暖灿烂的光线从西边群山的豁口流下来。马修低着头，步子很慢。安妮身姿修长挺拔，只好收住自己富有弹性的轻快脚步，迁就着他的速度，陪他慢慢往前走。
        - id: ch01-b41
          speaker: anne
          text: 马修，你今天又累着自己了。为什么不能把事情放轻松一点呢？
        - id: ch01-b42
          speaker: matthew
          text: 唉，我好像不会轻松。我只是老了，却总忘记自己已经老了。我这辈子一直卖力干活，要倒下的话，也宁可倒在活儿上。
        - id: ch01-b43
          speaker: anne
          text: 要是我真是你们当初想接来的那个男孩，现在就能帮你许多忙，想出一百种办法让你少受些累。只为了能帮你，我都恨不得自己当初是个男孩。
          emotion: sad
        - id: ch01-b44
          speaker: matthew
          text: 安妮，我宁愿要你，也不要十二个男孩。你一定记住，十二个也换不了你。再说，拿到艾弗里奖学金的难道是男孩吗？那是个姑娘，是我的姑娘，是让我骄傲的姑娘。
        - id: ch01-b45
          speaker: narrator
          text: 马修轻轻拍了拍她的手，腼腆地一笑，随后走进院子。那天夜里，安妮把那抹笑容带回了房间。她在敞开的窗前坐了很久，一遍遍回想过去，也静静梦想未来。窗外，白雪皇后在月光下泛着朦胧的银白。果园坡那边的沼泽里，青蛙正放声歌唱。空气里浮着芬芳的静谧，整个夜晚银光闪烁，安宁又美丽。安妮永远没有忘记这一切。那是悲伤碰到她的生命以前，最后一个平静的夜晚。生命一旦被那只冰冷却能净化灵魂的手触碰过，就再也不会和从前完全一样了。
