audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 从容而清醒，带一点克制的诙谐
        timbre: 温厚清晰
        pace: 舒缓有致
        pitch: 中低
    lassie:
      display_name: 善良的姑娘
      tts:
        delivery: 温柔诚恳，受苦时仍显纯真坚韧
        timbre: 年轻柔亮
        pace: 中等
        pitch: 中高
    brother:
      display_name: 哥哥
      tts:
        delivery: 勤恳直率，对妹妹怀着深切关爱
        timbre: 年轻清朗
        pace: 中等
        pitch: 中
    stepmother:
      display_name: 继母
      tts:
        delivery: 虚伪狠毒，哄骗时故作自然
        timbre: 干涩低沉
        pace: 中等
        pitch: 中低
    stepsister:
      display_name: 继姐
      tts:
        delivery: 乖戾粗暴，开口便带着不耐烦
        timbre: 尖锐生硬
        pace: 偏快
        pitch: 中高
    first_head:
      display_name: 第一颗脑袋
      tts:
        delivery: 怪异而郑重，宣告赠礼时清楚有力
        timbre: 空洞苍老
        pace: 偏慢
        pitch: 中低
    second_head:
      display_name: 第二颗脑袋
      tts:
        delivery: 怪异而冷静，话语简短分明
        timbre: 沙哑单薄
        pace: 偏慢
        pitch: 中
    third_head:
      display_name: 第三颗脑袋
      tts:
        delivery: 阴森直接，判决时不留余地
        timbre: 粗粝低哑
        pace: 中等
        pitch: 低
    king:
      display_name: 国王
      tts:
        delivery: 威严急切，愤怒与惊喜都坦率强烈
        timbre: 洪亮厚实
        pace: 中等
        pitch: 中低
    kitchen_maid:
      display_name: 厨娘
      tts:
        delivery: 朴实机敏，见到奇事时小心而惊奇
        timbre: 明净柔和
        pace: 中等
        pitch: 中
  chapters:
    - id: ch01
      title: 水潭里的三颗脑袋
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 从前有个鳏夫，前妻给他留下了一儿一女。两个孩子心地善良，也十分亲爱。后来，父亲又娶了个寡妇。新妻子带来的女儿和她母亲一样，又丑又坏。从那天起，兄妹俩在家里无论躲到哪个角落，都再没有安生日子。哥哥觉得，与其留下来受苦，不如到外面闯荡，靠自己挣一口饭吃。他走了很久，最后来到一位国王的宫殿，在马车夫手下找到差事。他勤快又麻利，把马匹照料得干干净净，匹匹皮毛都亮得发光。
        - id: ch01-b02
          speaker: narrator
          text: 留在家里的妹妹却越发受苦。继母和继姐不管她走到哪儿、做什么，都追着责骂，对她没有一句好话。家里所有重活全压在她身上。她从早忙到晚，吃的东西还少得可怜，一天里连一个时辰的安宁也没有。
        - id: ch01-b03
          speaker: narrator
          text: 一天，她们叫姑娘去溪边打水。一颗丑得吓人的脑袋忽然从潭里冒出来。
        - id: ch01-b04
          speaker: first_head
          text: 姑娘，替我洗洗吧。
        - id: ch01-b05
          speaker: lassie
          text: 好，我很愿意替你洗。
        - id: ch01-b06
          speaker: narrator
          text: 姑娘动手把它擦洗干净，虽然这活儿实在恶心。刚洗完，第二颗更丑的脑袋又浮了上来。
        - id: ch01-b07
          speaker: second_head
          text: 姑娘，也替我梳梳头吧。
        - id: ch01-b08
          speaker: lassie
          text: 好，我很愿意替你梳。
        - id: ch01-b09
          speaker: narrator
          text: 姑娘耐心解开那团纠结的乱发。才梳好，第三颗脑袋又冒了出来。它比前两颗加在一起还丑陋可怕。
        - id: ch01-b10
          speaker: third_head
          text: 姑娘，亲我一下！
        - id: ch01-b11
          speaker: lassie
          text: 好，我亲你。
        - id: ch01-b12
          speaker: narrator
          text: 姑娘真的俯下身亲了它。她心里觉得，这件事比自己一生做过的任何活儿都难受，却还是答应了。三颗脑袋随即凑在一起，叽叽咕咕地商量，该怎样报答这个温柔善良的姑娘。
        - id: ch01-b13
          speaker: first_head
          text: 我要让她成为世上最美的姑娘，像明亮的白昼一样好看。
        - id: ch01-b14
          speaker: second_head
          text: 她每梳一次头，头发里就会掉出金子。
        - id: ch01-b15
          speaker: third_head
          text: 她每说一句话，嘴里也会落下金子。
        - id: ch01-b16
          speaker: narrator
          text: 姑娘回到家，果然美得像明亮的白昼，浑身都放着光彩。继母和继姐看见她这副模样，已经气得越发凶狠。等她一开口，一枚枚金币又从嘴里落下来，两个人更是恼恨得发疯。继母把姑娘一直赶进猪圈，说那些金子东西只配待在那里。至于让姑娘再踏进家门，她连听都不肯听。
    - id: ch02
      title: 恶毒姑娘的报应
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 没多久，继母也叫亲生女儿去溪边打水。她刚到潭边，第一颗脑袋就浮了出来。
        - id: ch02-b02
          speaker: first_head
          text: 姑娘，替我洗洗吧。
        - id: ch02-b03
          speaker: stepsister
          text: 让魔鬼替你洗！
          emotion: angry
        - id: ch02-b04
          speaker: narrator
          text: 第二颗脑袋跟着冒了出来。
        - id: ch02-b05
          speaker: second_head
          text: 姑娘，替我梳梳头吧。
        - id: ch02-b06
          speaker: stepsister
          text: 让魔鬼替你梳！
          emotion: angry
        - id: ch02-b07
          speaker: narrator
          text: 它沉下去以后，第三颗脑袋浮出了水面。
        - id: ch02-b08
          speaker: third_head
          text: 姑娘，亲我一下。
        - id: ch02-b09
          speaker: stepsister
          text: 让魔鬼亲你吧，你这张猪嘴！
          emotion: disgusted
        - id: ch02-b10
          speaker: narrator
          text: 三颗脑袋又凑在一起，叽叽咕咕地商量，这回该怎样处置眼前这个恶毒乖戾的姑娘。最后它们一致决定，让她长出四厄尔长的鼻子、三厄尔长的嘴脸，额头正中再顶一丛松枝。以后只要她一开口，嘴里就会掉出灰烬。
        - id: ch02-b11
          speaker: narrator
          text: 她提着水桶回到家，隔着门便朝母亲大喊。
        - id: ch02-b12
          speaker: stepsister
          text: 快开门！
        - id: ch02-b13
          speaker: stepmother
          text: 乖女儿，你自己开呀。
        - id: ch02-b14
          speaker: stepsister
          text: 我的鼻子挡住了，根本够不着门！
        - id: ch02-b15
          speaker: narrator
          text: 母亲只好亲自出来开门。她一看见女儿变成这副模样，立刻尖叫起来，又是哭喊，又是哀号。可不管她怎样悲痛，女儿脸上的长鼻子、长嘴脸和那丛松枝仍旧好端端地待着，连一点也没有缩短。
    - id: ch03
      title: 画像与湖上的骗局
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 在国王马厩当差的哥哥，离家时带走了一幅妹妹的小画像。每天早晚，他都跪在画前，向我主祈祷，求主庇佑他深爱的妹妹。别的马夫听见祷告声，便从他房门的钥匙孔往里偷看。他们见到哥哥跪在画像前，就到处说他私藏了一尊偶像，每天早晚都要跪拜。最后，他们还跑到国王面前，请国王亲眼去瞧。
        - id: ch03-b02
          speaker: narrator
          text: 国王起初不肯相信。可马夫们不停劝说，叫他只需亲眼看上一眼。国王终于踮着脚走到房门边。透过钥匙孔，他看见小伙子跪在墙上的画像前，双手紧紧合在一起，正专心祷告。
        - id: ch03-b03
          speaker: king
          text: 把门打开！
        - id: ch03-b04
          speaker: narrator
          text: 小伙子没有听见。国王又喊一遍，他仍沉浸在祷告里。
        - id: ch03-b05
          speaker: king
          text: 我叫你开门！是我，国王要进来！
          emotion: angry
        - id: ch03-b06
          speaker: narrator
          text: 小伙子这才猛地跳起，跑去开门。慌乱中，他把藏起画像的事忘得一干二净。国王进屋以后，一眼看见画上的女子，便像被锁链缚住一样定在原地，连一步也挪不开。画像实在美得叫他神魂颠倒。
        - id: ch03-b07
          speaker: king
          text: 整个世上，再没有比她更美的女子。
          emotion: surprised
        - id: ch03-b08
          speaker: narrator
          text: 小伙子说，画中人是自己的妹妹。她即便没有画像更美，也绝不会更难看。
        - id: ch03-b09
          speaker: king
          text: 她果真这样美，我就娶她做王后。你立刻回家接她，一路不许耽搁。
        - id: ch03-b10
          speaker: narrator
          text: 小伙子答应尽快赶回，马上离开王宫动身了。他到家接妹妹时，继母和继姐却说，她们无论如何也必须同行。善良的姑娘只带上一匣金子和小狗小弗洛，这两样东西便是母亲留给她的全部遗物。四个人走了一程，来到一片必须渡过的湖。上船以后，哥哥坐在船尾掌舵，继母和两个姑娘坐在前面的船头。船在水上走了很久很久，他们终于远远看见了陆地。
        - id: ch03-b11
          speaker: brother
          text: 看见那边的白沙岸了吗？我们就在那里下船。
        - id: ch03-b12
          speaker: lassie
          text: 哥哥刚才说了什么？
        - id: ch03-b13
          speaker: stepmother
          text: 他说，你该把匣子扔进湖里。
        - id: ch03-b14
          speaker: lassie
          text: 既然是哥哥吩咐的，我就照做。
        - id: ch03-b15
          speaker: narrator
          text: 她把匣子抛进了水里。船又往前走了一段，哥哥再次指向湖对岸。
        - id: ch03-b16
          speaker: brother
          text: 瞧，那就是我们要去的城堡。
        - id: ch03-b17
          speaker: lassie
          text: 哥哥又说什么了？
        - id: ch03-b18
          speaker: stepmother
          text: 他说，你现在得把小狗扔下去。
        - id: ch03-b19
          speaker: narrator
          text: 姑娘听了，伤心得哭起来。小弗洛是世上她最珍爱的东西，要她亲手把小狗扔下船，心里实在痛苦万分。可到了最后，她仍旧相信哥哥的吩咐，把小弗洛抛进了湖中。
        - id: ch03-b20
          speaker: lassie
          text: 哥哥既然这样说，我只好照办。可是天知道，把你扔下去，我的心有多痛啊，小弗洛。
          emotion: sad
        - id: ch03-b21
          speaker: narrator
          text: 船继续前行，离岸边越来越近。
        - id: ch03-b22
          speaker: brother
          text: 看，国王正从岸上走下来迎接我们。
        - id: ch03-b23
          speaker: lassie
          text: 哥哥这回说什么？
        - id: ch03-b24
          speaker: stepmother
          text: 他说，你得赶快跳进湖里。
        - id: ch03-b25
          speaker: narrator
          text: 姑娘听完，伤心地哭泣哀叹起来。可她从没想过继母会撒下这样的谎，仍旧相信那是哥哥亲口说的话。既然哥哥吩咐她这样做，她便觉得自己应当听从，于是从船头纵身跳进了湖。
    - id: ch04
      title: 蓬头新娘
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 一行人到了王宫。国王一看见新娘那四厄尔长的鼻子、三厄尔长的嘴脸，还有额头正中那丛松枝，吓得魂都快没了。可是婚礼的一切早已准备齐全，酒已酿好，饼已烤好，满堂宾客都坐着等候新娘。国王实在无路可退，只能不论好坏都娶下这个丑陋的新娘。他气成这样，谁也不会怪他。可他的怒火全落到了哥哥头上，便命人把小伙子扔进爬满毒蛇的深坑。
        - id: ch04-b02
          speaker: narrator
          text: 婚礼后的第一个星期四，半夜里，一位美丽女子走进王宫厨房。她柔声恳求睡在那里的厨娘，把梳子借给自己用一用。拿到梳子以后，她一下下梳起头发，金子便从发间纷纷落下。那条小狗小弗洛也回到了她身边，这时正紧紧跟在她脚后。
        - id: ch04-b03
          speaker: lassie
          text: 小弗洛，快跑出去看看，天是不是快亮了。
        - id: ch04-b04
          speaker: narrator
          text: 她先后三次派小弗洛出去，问的都是同一句话。第三次小狗回来时，已经到了晨光将要露出来的时候。女子不能再留下去，临走前便唱起一首歌。
        - id: ch04-b05
          speaker: lassie
          text: 可憎啊，丑陋的蓬头新娘，睡在国王左边暖洋洋。我却睡在沙石上，哥哥身上毒蛇忙，这一切竟无人泪落一行。
          emotion: sad
        - id: ch04-b06
          speaker: lassie
          text: 我还会来两次，以后就再也不来了。
        - id: ch04-b07
          speaker: narrator
          text: 第二天早晨，厨娘把亲眼看见、亲耳听见的事全告诉了国王。国王决定下个星期四亲自守在厨房，看看她说的是真是假。可到了那一夜，不管他怎样揉眼睛、强撑精神，都抵不过蓬头新娘不停的哼唱。美丽女子进来时，国王已经睡熟，还打起了鼾。她又像上次那样借来梳子，梳到金子从发间落下，再三次派小弗洛出去看天色。东方泛灰时，她唱完同一首歌，又说：
        - id: ch04-b08
          speaker: lassie
          text: 我还会再来一次，以后就再也不来了。
    - id: ch05
      title: 真正的新娘
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 第三个星期四，国王再次守候。他叫两个男人从左右托住自己的胳膊，只要他打瞌睡，就使劲把他推醒。另外又派两个人看守蓬头新娘。可夜越来越深，蓬头新娘一开口哼唱，国王的眼睛仍旧不停地眨，脑袋也一点点垂到了肩上。
        - id: ch05-b02
          speaker: narrator
          text: 美丽女子走进厨房，又借来梳子。金子从她发间纷纷落下。她三次叫小弗洛出去看天色。第三次，东方已经泛白，她唱出了那首歌。
        - id: ch05-b03
          speaker: lassie
          text: 可憎啊，丑陋的蓬头新娘，睡在国王左边暖洋洋。我却睡在沙石上，哥哥身上毒蛇忙，这一切竟无人泪落一行。
          emotion: sad
        - id: ch05-b04
          speaker: lassie
          text: 从此以后，我再也不回来了。
        - id: ch05-b05
          speaker: narrator
          text: 她说完便朝门口走。托着国王的两个人赶紧合拢他的双手，再把一把小刀塞进他掌中。也不知他们怎样使的力，总算让刀尖划破了女子的小指，鲜血流了出来。
        - id: ch05-b06
          speaker: narrator
          text: 真正的新娘立刻得到解救，国王也从沉睡中醒了。她把事情从头到尾讲给国王听，说清继母和继姐在船上怎样欺骗了自己。国王听完，马上派人去蛇坑救出她哥哥。坑里的毒蛇爬满四周，竟没有伤他分毫。继母和她的女儿却被扔了进去，替代了他。
        - id: ch05-b07
          speaker: narrator
          text: 国王终于摆脱了丑陋的蓬头新娘，迎来一位像白昼一样明丽的王后。他心里有多欢喜，谁也说不尽。真正的婚礼隆重举行，消息传遍七个王国。国王和王后乘车去教堂，小弗洛也坐在车里。接受祝福以后，他们又一同回来。从那以后，我便再也没见过他们了。
