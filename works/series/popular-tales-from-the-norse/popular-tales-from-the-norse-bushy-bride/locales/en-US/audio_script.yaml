  chapters:
    - id: ch01
      title: The Three Heads
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Once upon a time, a widower had a son and a daughter from his first marriage. They were good children, and they loved each other dearly. Later, their father married a widow who had a daughter of her own. The widow and her daughter were both ugly and cruel. From the day they entered the house, the two stepchildren could find no peace.
        - id: ch01-b02
          speaker: narrator
          text: At last, the boy decided to go out into the world and earn his own bread. After wandering for a while, he reached a king's palace and found work under the coachman. He was quick and willing, and he kept the horses so clean and sleek that their coats shone.
        - id: ch01-b03
          speaker: narrator
          text: His sister stayed at home, where the stepmother and stepsister treated her worse than ever. They were always after her. Wherever she went and whatever she tried to do, they scolded and snarled. They forced all the hardest work upon her from early morning until late at night. For all that labor, she got nothing but harsh words and very little food. The poor girl never had an hour of peace.
        - id: ch01-b04
          speaker: narrator
          text: One day, they sent her to the burn for water. As she reached the pool, an ugly head rose out of it and spoke.
        - id: ch01-b05
          speaker: first_head
          text: Lassie, will you wash me?
        - id: ch01-b06
          speaker: true_bride
          text: Yes. I'll gladly wash you.
        - id: ch01-b07
          speaker: narrator
          text: She washed and scrubbed the ugly head, though she found the work nasty. As soon as she finished, a second head rose from the pool, uglier than the first.
        - id: ch01-b08
          speaker: second_head
          text: Lassie, brush my hair for me.
        - id: ch01-b09
          speaker: true_bride
          text: Yes. I'll gladly brush it.
        - id: ch01-b10
          speaker: narrator
          text: She took the tangled locks in her hands and worked through them. It was far from pleasant. When she had finished, a third head rose from the water. This one was more ugly and loathsome than the other two together.
        - id: ch01-b11
          speaker: third_head
          text: Lassie, give me a kiss!
        - id: ch01-b12
          speaker: true_bride
          text: Yes, I'll kiss you.
        - id: ch01-b13
          speaker: narrator
          text: She did, though it seemed the worst task she had ever faced. Then the three heads began talking together. What should they give this kind and gentle girl?
        - id: ch01-b14
          speaker: first_head
          text: Let her be the prettiest lassie in the world, as fair as the bright day.
        - id: ch01-b15
          speaker: second_head
          text: Whenever she brushes her hair, let gold fall from it.
        - id: ch01-b16
          speaker: third_head
          text: Whenever she speaks, let gold fall from her mouth.
        - id: ch01-b17
          speaker: narrator
          text: When the girl returned home, she was as lovely and bright as the day itself. Her stepmother and stepsister grew crosser the moment they saw her. Their anger only worsened when she began to talk and golden guineas dropped from her mouth. The stepmother flew into such a rage that she chased the girl out to the pigsty. She declared that the pigsty was the proper place for all that golden nonsense. As for letting the girl come into the house, she would not hear of it.
    - id: ch02
      title: The Stepmother's Daughter
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: Before long, the stepmother sent her own daughter to the burn for water. The girl reached the edge with her buckets, and the first head rose from the pool.
        - id: ch02-b02
          speaker: first_head
          text: Lassie, will you wash me?
        - id: ch02-b03
          speaker: bushy_bride
          text: Let the Devil wash you.
        - id: ch02-b04
          speaker: narrator
          text: The first head sank, and the second one appeared.
        - id: ch02-b05
          speaker: second_head
          text: Lassie, brush my hair for me.
        - id: ch02-b06
          speaker: bushy_bride
          text: Let the Devil brush you.
        - id: ch02-b07
          speaker: narrator
          text: The second head went down, and the third rose in its place.
        - id: ch02-b08
          speaker: third_head
          text: Lassie, give me a kiss.
        - id: ch02-b09
          speaker: bushy_bride
          text: Let the Devil kiss you, you pig-snout.
        - id: ch02-b10
          speaker: narrator
          text: The three heads began chattering together again. They asked one another what they should do to a girl who was so spiteful and cross-grained. Soon they all agreed. Her nose would be four ells long, her snout would be three ells long, and a pine bush would stand right in the middle of her forehead. Every time she opened her mouth to speak, ashes would tumble out.
        - id: ch02-b11
          speaker: narrator
          text: She carried her buckets home and bawled for her mother.
        - id: ch02-b12
          speaker: bushy_bride
          text: Mother, open the door!
        - id: ch02-b13
          speaker: stepmother
          text: Open it yourself, my darling girl.
        - id: ch02-b14
          speaker: bushy_bride
          text: I can't reach it. My nose is in the way.
        - id: ch02-b15
          speaker: narrator
          text: Her mother came outside, took one look, and began screaming and groaning. It did no good. The long nose, the snout, and the pine bush did not grow one bit smaller for all her grief.
    - id: ch03
      title: The Picture at the Palace
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: The brother who worked in the King's stable carried a small picture he had drawn of his sister. Every morning and evening, he knelt before it and prayed to Our Lord for the sister he loved so dearly.
        - id: ch03-b02
          speaker: narrator
          text: The other grooms heard him praying and wondered what he was doing. They peeped through the keyhole of his room and saw him on his knees before the picture. Then they went about telling people that the boy knelt before an idol every morning and every evening. At last, they carried their tale to the King. They begged His Majesty to look through the keyhole himself, so he could see exactly what the boy did.
        - id: ch03-b03
          speaker: narrator
          text: The King did not believe them at first, but they finally persuaded him. He crept on tiptoe to the door and looked inside. There was the boy, kneeling with clasped hands before the picture on the wall.
        - id: ch03-b04
          speaker: king
          text: Open this door!
        - id: ch03-b05
          speaker: narrator
          text: The boy was too deep in prayer to hear. The King called again, louder this time, but still the boy did not answer.
        - id: ch03-b06
          speaker: king
          text: Open the door, I say! It is your King, and I want to come in!
          emotion: angry
        - id: ch03-b07
          speaker: narrator
          text: The boy jumped up, ran to the door, and unlocked it. In his hurry, he forgot to hide the picture. The King stepped inside and saw it. He stopped as if chains held him to the spot, because the woman in the picture was so lovely.
        - id: ch03-b08
          speaker: king
          text: There cannot be another woman this beautiful anywhere in the wide world.
        - id: ch03-b09
          speaker: narrator
          text: The boy explained that the picture was of his sister and that, if anything, she was even prettier than he had drawn her.
        - id: ch03-b10
          speaker: king
          text: If your sister is truly so lovely, then I will make her my queen.
        - id: ch03-b11
          speaker: narrator
          text: The King ordered him to leave for home that very minute. He was to bring his sister back and spend no more time than he must upon the road. The boy promised to make all the haste he could. Then he left the palace and started home.
    - id: ch04
      title: Across the Lake
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: When the brother reached home to fetch his sister, the stepmother and stepsister declared that they must go too. So all four of them set out together. The good girl took a casket in which she kept the gold that fell from her hair and mouth. She also brought her little dog, whose name was Little Flo. The casket and the dog were all that her own mother had left her.
        - id: ch04-b02
          speaker: narrator
          text: After traveling for a while, they came to a lake they had to cross. The brother took the helm. The stepmother and the two girls sat together in the bow, and they sailed on for a long, long way. At last, land came into sight.
        - id: ch04-b03
          speaker: brother
          text: Do you see that white shore ahead? That is where we'll land.
        - id: ch04-b04
          speaker: narrator
          text: He pointed across the water. His sister turned to the stepmother.
        - id: ch04-b05
          speaker: true_bride
          text: What did my brother say?
        - id: ch04-b06
          speaker: stepmother
          text: He said you must throw your casket into the lake.
        - id: ch04-b07
          speaker: true_bride
          text: If my brother says I must, then I will.
        - id: ch04-b08
          speaker: narrator
          text: She threw the casket overboard. They sailed a little farther, and the brother pointed across the lake again.
        - id: ch04-b09
          speaker: brother
          text: Look. There is the castle we're going to.
        - id: ch04-b10
          speaker: true_bride
          text: What did my brother say?
        - id: ch04-b11
          speaker: stepmother
          text: He says you must throw Little Flo overboard now.
        - id: ch04-b12
          speaker: narrator
          text: The girl wept bitterly. Little Flo was the dearest thing she had in the world. At last, she lifted him over the side.
        - id: ch04-b13
          speaker: true_bride
          text: If my brother says I must, then I will. But heaven knows how it hurts me to throw you over, Little Flo.
          emotion: sad
        - id: ch04-b14
          speaker: narrator
          text: The boat sailed on. Once more, the brother pointed toward the shore.
        - id: ch04-b15
          speaker: brother
          text: There is the King, coming down to meet us.
        - id: ch04-b16
          speaker: true_bride
          text: What did my brother say?
        - id: ch04-b17
          speaker: stepmother
          text: He says you must hurry and throw yourself overboard.
        - id: ch04-b18
          speaker: narrator
          text: The girl cried and moaned. Yet she believed that, if her brother had told her to do it, she ought to obey. So she leaped into the lake.
        - id: ch04-b19
          speaker: narrator
          text: The others reached the palace without her. When the King saw the dreadful bride with her nose four ells long, her snout three ells long, and a pine bush growing from her forehead, he was frightened out of his wits. Yet everything for the wedding stood ready. The brewing and baking were done, and all the guests were already sitting there, waiting for the bride. The King felt he could not escape the marriage. He had to take her for better or worse.
        - id: ch04-b20
          speaker: narrator
          text: He was furious at the trick that had been played on him. He ordered the brother thrown into a pit filled with snakes.
    - id: ch05
      title: The Lady at Midnight
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: On the first Thursday night after the wedding, at about midnight, a lovely lady entered the palace kitchen. The kitchen maid slept there, and the lady asked her very sweetly if she might borrow a brush. The maid lent her one. The lady began to brush her long hair, and with every stroke, gold dropped down around her. Little Flo had come into the kitchen too, and the small dog stayed close at her heel.
        - id: ch05-b02
          speaker: true_bride
          text: Run outside, Little Flo, and see whether day will come soon.
        - id: ch05-b03
          speaker: narrator
          text: Little Flo ran out to look, then came back. The lady sent him a second time, and then a third. By the third time, the hour had come when dawn first begins to peep. The lady could stay no longer. She turned to leave the kitchen, and as she went, she sang.
        - id: ch05-b04
          speaker: true_bride
          text: Out on you, ugly Bushy Bride, lying so warm by the King's left side, while I sleep on sand and gravel, and adders creep over my brother, all without a tear.
          emotion: sad
        - id: ch05-b05
          speaker: true_bride
          text: I will come twice more, and then never again.
          emotion: sad
        - id: ch05-b06
          speaker: narrator
          text: The next morning, the kitchen maid told the King everything she had seen and heard.
        - id: ch05-b07
          speaker: king
          text: Next Thursday night, I will keep watch in the kitchen myself and learn whether this is true.
        - id: ch05-b08
          speaker: narrator
          text: As soon as darkness fell the next Thursday, the King went out to the kitchen and joined the kitchen maid. He meant to watch all night. He rubbed his eyes and did everything he could to keep himself awake, but nothing helped. Bushy Bride chanted and sang until his eyelids closed. So when the lovely lady entered the kitchen, the King lay there fast asleep and snoring.
        - id: ch05-b09
          speaker: narrator
          text: Just as before, the lady borrowed a brush from the maid. She drew it through her hair until gold dropped all around her. She sent Little Flo outside once, twice, and then a third time to find out whether day would soon come. As soon as the dawn began to turn gray, she sang the very same sorrowful words. Then she told them this would happen only once more, and she went away.
        - id: ch05-b10
          speaker: true_bride
          text: I will come once more, and then never again.
          emotion: sad
    - id: ch06
      title: The True Bride
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: On the third Thursday night, the King said he would keep watch once more. This time, he made better plans. He stationed one man under each of his arms. Whenever his eyes began to close, they were to shake him and jog him awake. He also set two more men to keep watch over Bushy Bride.
        - id: ch06-b02
          speaker: narrator
          text: As the night wore on, Bushy Bride began her chanting and singing. The King's eyes flickered shut, and his head sank onto his shoulders. Then the lovely lady entered. She borrowed the brush, and gold dropped from her hair as she brushed it.
        - id: ch06-b03
          speaker: true_bride
          text: Run outside, Little Flo, and see whether day will come soon.
        - id: ch06-b04
          speaker: narrator
          text: She sent Little Flo three times. On the third trip, the eastern sky began to turn gray. Then she sang once more.
        - id: ch06-b05
          speaker: true_bride
          text: Out on you, ugly Bushy Bride, lying so warm by the King's left side, while I sleep on sand and gravel, and adders creep over my brother, all without a tear.
          emotion: sad
        - id: ch06-b06
          speaker: true_bride
          text: Now I will never come back.
          emotion: sad
        - id: ch06-b07
          speaker: narrator
          text: With that, she moved toward the door. The two men holding the King clenched his hands together and pushed a knife into his grasp. Somehow or other, they guided his sleeping hands far enough for the blade to cut the lady's little finger. The moment it drew blood, the true bride was set free from whatever held her. At that same moment, the King woke.
        - id: ch06-b08
          speaker: narrator
          text: She told him the whole story of how her stepmother and stepsister had deceived her. The King immediately had her brother lifted from the snake pit. The adders had not harmed him at all. Then the stepmother and her daughter were thrown into the pit in his place.
        - id: ch06-b09
          speaker: narrator
          text: No one can say how glad the King was to be rid of ugly Bushy Bride and to have a queen as lovely and bright as the day itself. Their true wedding was held, and people spoke of it across seven kingdoms.
        - id: ch06-b10
          speaker: narrator
          text: The King and Queen rode to church in their coach, with Little Flo inside beside them. After the blessing, they drove home again. And after that, I saw nothing more of them.
