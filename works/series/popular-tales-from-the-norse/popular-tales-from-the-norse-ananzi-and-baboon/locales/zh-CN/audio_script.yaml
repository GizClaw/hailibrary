audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 从容而清醒，带一点克制的诙谐
        timbre: 温厚清晰
        pace: 舒缓有致
        pitch: 中低
    ananzi:
      display_name: 阿南西
      tts:
        delivery: 得意健谈，夸耀时理直气壮
        timbre: 明亮灵活
        pace: 中等
        pitch: 中高
    baboon:
      display_name: 狒狒
      tts:
        delivery: 圆滑多话，得意时轻快，遇险时慌张
        timbre: 灵活偏亮
        pace: 稍快
        pitch: 中高
    doctor:
      display_name: 医生
      tts:
        delivery: 沉着明白，说话简洁笃定
        timbre: 平稳清晰
        pace: 中等偏慢
        pitch: 中
  chapters:
    - id: ch01
      title: 谁更肥
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 一天，阿南西和狒狒为了谁更肥，争得不可开交。阿南西认定自己很肥，狒狒却说他才是更肥的那个。阿南西想了个比试的办法。他们生起一堆火，约好轮流吊在火前，看看谁滴下来的油更多。
        - id: ch01-b02
          speaker: narrator
          text: 狒狒先把阿南西吊起来。等了半天，一滴油也没落下来。接着轮到阿南西把狒狒吊在火前。没多久，狒狒身上的油就滴了下来，闻着香极了。阿南西忍不住割下一片肉。
        - id: ch01-b03
          speaker: ananzi
          text: 哎呀，狒狒兄弟，你还真是肥得很哪。
        - id: ch01-b04
          speaker: narrator
          text: 狒狒没有回答。
        - id: ch01-b05
          speaker: ananzi
          text: 行，你不说话也罢。今天我就把你吃得一点不剩。
        - id: ch01-b06
          speaker: narrator
          text: 阿南西说到做到，果真把狒狒整个吃了下去。
    - id: ch02
      title: 肚子里的狒狒
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 谁知那些狒狒肉进了阿南西的肚子，又一块块拼在了一起。狒狒在里面把他扯来扯去，闹得他一刻也不得安生。阿南西实在熬不住，只好去看医生。
        - id: ch02-b02
          speaker: doctor
          text: 这几天什么也别吃。等你饿够了，就拿一根熟香蕉举在嘴边。狒狒也会饿，他一闻见香蕉，一定会跑来吃。到时，他就会从你嘴里跑出来。
        - id: ch02-b03
          speaker: narrator
          text: 阿南西照办了。他饿了自己几天，又找来一根香蕉。可是香蕉刚放到嘴边，他自己先受不住了，一口就把香蕉吃掉。狒狒当然没能出来，仍在肚里把他折腾得东倒西歪。阿南西没办法，只得再去找医生。
    - id: ch03
      title: 香蕉治病
      blocks:
        - id: ch03-b01
          speaker: doctor
          text: 这回交给我，很快就能治好你。
        - id: ch03-b02
          speaker: narrator
          text: 医生拿过一根香蕉，举到阿南西嘴边。没过多久，狒狒果然跳起来抓香蕉，顺势从阿南西嘴里跑了出去。阿南西终于摆脱了他，心里高兴极了。
        - id: ch03-b03
          speaker: narrator
          text: 直到今天，狒狒还是最爱吃香蕉。
