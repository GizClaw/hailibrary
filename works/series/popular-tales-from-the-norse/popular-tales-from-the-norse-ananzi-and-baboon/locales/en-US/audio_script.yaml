audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: thoughtful and gently wry
        timbre: warm and clear
        pace: measured
        pitch: medium
    ananzi:
      display_name: Ananzi
      tts:
        delivery: crafty and self-assured
        timbre: light and wiry
        pace: lively
        pitch: medium-high
  chapters:
    - id: ch01
      title: Who Was Fattest?
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: One day, Ananzi and Baboon got into an argument over which of them was fattest. Ananzi was certain he was fat, but Baboon insisted he was fatter. Ananzi suggested a test. They would build a fire, hang themselves in front of it, and see who dripped the most fat.
        - id: ch01-b02
          speaker: narrator
          text: Baboon hung Ananzi over the fire first. Not a drop of fat came from him. Then Ananzi hung Baboon there, and before long, Baboon's fat began to drip.
    - id: ch02
      title: Baboon in Ananzi's Belly
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: It smelled so good that Ananzi sliced off a piece of Baboon.
        - id: ch02-b02
          speaker: ananzi
          text: Oh, Brother Baboon, you truly are fat!
        - id: ch02-b03
          speaker: narrator
          text: Baboon said nothing.
        - id: ch02-b04
          speaker: ananzi
          text: Speak or don't speak. I'm going to eat every bit of you today.
        - id: ch02-b05
          speaker: narrator
          text: And that was exactly what Ananzi did. But inside his stomach, all the pieces of Baboon joined back together. Baboon pulled Ananzi around so badly that Ananzi could not rest. At last, he had to visit a doctor.
    - id: ch03
      title: The Banana
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: The doctor told Ananzi to go without food for several days. Then he must hold a ripe banana to his mouth. Baboon would be hungry. Once he smelled the banana, he would rush up to eat it and run straight out through Ananzi's mouth.
        - id: ch03-b02
          speaker: narrator
          text: Ananzi starved himself, found a banana, and followed the doctor's instructions. But the moment he held it to his mouth, his own hunger was too much for him. He ate the banana himself.
        - id: ch03-b03
          speaker: narrator
          text: So Baboon stayed where he was and kept pulling Ananzi about. Soon Ananzi had no choice but to return to the doctor.
    - id: ch04
      title: The Doctor's Cure
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: The doctor told Ananzi he would soon put things right. This time, the doctor took the banana and held it to Ananzi's mouth. Before long, Baboon leaped up to grab it and ran out through Ananzi's mouth.
        - id: ch04-b02
          speaker: narrator
          text: Ananzi was very glad to be rid of him.
        - id: ch04-b03
          speaker: narrator
          text: And baboons still like bananas to this very day.
