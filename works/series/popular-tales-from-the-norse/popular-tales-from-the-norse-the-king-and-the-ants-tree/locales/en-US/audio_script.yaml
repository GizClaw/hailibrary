audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: thoughtful and gently wry
        timbre: warm and clear
        pace: measured
        pitch: medium
    ananzi:
      display_name: Ananzi
      tts:
        delivery: sly and self-assured
        timbre: light and crisp
        pace: lively
        pitch: medium-high
    king:
      display_name: King
      tts:
        delivery: formal and commanding
        timbre: deep and resonant
        pace: measured
        pitch: low
  chapters:
    - id: ch01
      title: The King's Challenge
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: There once was a King with a beautiful daughter. An Ant's tree stood in his kingdom, and he announced a challenge to anyone who wished to marry her.
        - id: ch01-b02
          speaker: king
          text: Cut down that Ant's tree without brushing away the ants, and you shall marry my daughter.
        - id: ch01-b03
          speaker: narrator
          text: Many people tried. But the ants fell upon them and stung them, so each one had to brush the ants away. A watcher always saw it happen, and every challenger failed.
    - id: ch02
      title: Ananzi Takes the Axe
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: Then Ananzi took his turn. The King sent his son to watch, and they showed Ananzi the tree.
        - id: ch02-b02
          speaker: ananzi
          text: Why, this is easy. I know I can cut it down.
        - id: ch02-b03
          speaker: narrator
          text: They handed him the axe, and he began to chop.
    - id: ch03
      title: What the Watcher Saw
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: With every blow, Ananzi shook and brushed himself. All the while, he called out to the King's son.
        - id: ch03-b02
          speaker: ananzi
          text: Did you see that? You may think I'm brushing myself, but I'm not.
        - id: ch03-b03
          speaker: narrator
          text: Ananzi kept this up until the tree fell. The boy believed he had only been pretending to brush himself. So the King had to give Ananzi his daughter in marriage.
