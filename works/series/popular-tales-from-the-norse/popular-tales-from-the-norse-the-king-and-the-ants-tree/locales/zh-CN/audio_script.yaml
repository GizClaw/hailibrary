audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 从容而清醒，带一点克制的诙谐
        timbre: 温厚清晰
        pace: 舒缓有致
        pitch: 中低
    ananzi:
      display_name: 阿南西
      tts:
        delivery: 得意健谈，夸耀时理直气壮
        timbre: 明亮灵活
        pace: 中等
        pitch: 中高
  chapters:
    - id: ch01
      title: 国王的许诺
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 从前，一位国王有个美丽的女儿。他的领地里有棵蚂蚁树。国王说，谁能砍倒它，又不伸手拂掉身上的蚂蚁，谁就能娶公主。
    - id: ch02
      title: 没人砍得倒的树
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 许多人前来尝试。可斧头一落，蚂蚁也纷纷落到他们身上，叮得他们不得不伸手去拂。结果没一个人成功。
        - id: ch02-b02
          speaker: narrator
          text: 每次都有人守在旁边，看他们有没有拂蚂蚁。
    - id: ch03
      title: 阿南西的办法
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 后来阿南西也来了，国王派王子盯着他。有人领他到树前，他看一眼，满不在乎地说。
        - id: ch03-b02
          speaker: ananzi
          text: 嗨，不就是砍倒这棵树吗？这事我准能办到。
        - id: ch03-b03
          speaker: narrator
          text: 他们递给阿南西一把斧头。他挥起斧子砍树，每砍一下，就先抖抖身子，再伸手往身上拂。手上一边拂，嘴里还一边不停地念叨。
        - id: ch03-b04
          speaker: ananzi
          text: 瞧见我刚才的动作了吗？你一定以为我在拂自己的身子。其实呀，我可没有。
        - id: ch03-b05
          speaker: narrator
          text: 阿南西就这么一斧接一斧，直到大树轰然倒下。王子一直以为他只是在装模作样，并不是真的往身上拂。国王只好认账，把女儿嫁给了阿南西。
