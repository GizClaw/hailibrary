audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 从容而清醒，带一点克制的诙谐
        timbre: 温厚清晰
        pace: 舒缓有致
        pitch: 中低
    rich_peter:
      display_name: 货郎富彼得
      tts:
        delivery: 精明专横，贪念一起便急躁强硬
        timbre: 厚实而略显粗粝
        pace: 中等偏快
        pitch: 中低
    peters_wife:
      display_name: 彼得的妻子
      tts:
        delivery: 顺从谨慎，说话朴实直接
        timbre: 柔和清楚
        pace: 中等
        pitch: 中等
    stargazer_1:
      display_name: 观星人甲
      tts:
        delivery: 郑重明确，不受威逼利诱
        timbre: 沉静清亮
        pace: 舒缓
        pitch: 中等
    stargazer_2:
      display_name: 观星人乙
      tts:
        delivery: 冷静笃定，语气简洁
        timbre: 清晰平稳
        pace: 舒缓
        pitch: 中低
    stargazer_3:
      display_name: 观星人丙
      tts:
        delivery: 严肃克制，带一点不耐烦
        timbre: 略显苍老
        pace: 中等偏慢
        pitch: 低
    birth_mother:
      display_name: 少年的生母
      tts:
        delivery: 质朴坚决，悲伤时仍有韧劲
        timbre: 温暖而略带沙哑
        pace: 中等
        pitch: 中等
    birth_father:
      display_name: 少年的生父
      tts:
        delivery: 劳苦务实，遇到利诱时迟疑而现实
        timbre: 低沉朴厚
        pace: 中等偏慢
        pitch: 低
    foster_miller:
      display_name: 养父磨坊主
      tts:
        delivery: 慈爱坦率，说话稳重诚恳
        timbre: 苍老温厚
        pace: 舒缓
        pitch: 低
    foster_millers_wife:
      display_name: 养母磨坊主夫人
      tts:
        delivery: 爽快温暖，惊喜溢于言表
        timbre: 柔和明亮
        pace: 中等
        pitch: 中等
    lad:
      display_name: 磨坊主的儿子
      tts:
        delivery: 诚恳勇敢，遇事镇定而不失年轻人的爽朗
        timbre: 清朗结实
        pace: 中等
        pitch: 中等
    robber:
      display_name: 强盗
      tts:
        delivery: 粗豪机敏，嘲弄中带着仗义
        timbre: 粗粝洪亮
        pace: 中等偏快
        pitch: 中低
    water_king:
      display_name: 清水井国王
      tts:
        delivery: 威严中带着恳切，说话端正
        timbre: 浑厚清晰
        pace: 中等
        pitch: 中低
    daughter_king:
      display_name: 寻女儿的国王
      tts:
        delivery: 庄重忧心，提起女儿时格外恳切
        timbre: 深沉温厚
        pace: 中等偏慢
        pitch: 低
    queen:
      display_name: 王后
      tts:
        delivery: 端庄谨慎，秘密被提及时慌忙压低声音
        timbre: 圆润清晰
        pace: 中等
        pitch: 中等
    ferryman:
      display_name: 老摆渡人
      tts:
        delivery: 疲惫直率，抱怨时带着急躁
        timbre: 苍老粗哑
        pace: 中等偏慢
        pitch: 低
    princess:
      display_name: 公主
      tts:
        delivery: 善良机敏，在危险中压住恐惧
        timbre: 清柔而坚韧
        pace: 中等
        pitch: 中等偏高
    dragon:
      display_name: 深渡口恶龙
      tts:
        delivery: 粗暴多疑，困倦时越说越暴躁
        timbre: 低沉浑浊
        pace: 中等偏慢
        pitch: 低
  chapters:
    - id: ch01
      title: 星星里的婚事
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 从前有个走街串巷的货郎，人们都叫他富彼得。他常年背着货箱四处做买卖，挣下的钱越来越多，终于成了富翁。富彼得有个女儿，疼得像宝贝一样。每逢有人上门求亲，他总觉得对方配不上女儿，三言两语便把人家打发走。这样的日子过了很久，后来竟再没人登门。眼看一年又一年过去，他这才害怕起来，只怕女儿会一辈子嫁不出去。
        - id: ch01-b02
          speaker: rich_peter
          text: 咱们闺女这么有钱，怎么没人再来求亲？她如今有钱，将来还会更有钱，人人都不想娶她才怪。我要去问问观星人，看她命里该嫁给谁。
        - id: ch01-b03
          speaker: peters_wife
          text: 这种事，观星人怎么会知道呢？
        - id: ch01-b04
          speaker: rich_peter
          text: 他们当然知道！天底下的事，他们从星星里都看得见。
        - id: ch01-b05
          speaker: narrator
          text: 彼得带上一大袋钱去见观星人，请他们好好看看星星，找出女儿未来的丈夫。观星人望了又望，却说什么也没看见。彼得不肯罢休，一再央求他们看仔细，说只要肯讲实话，他一定重重酬谢。他们只好再察看一遍，终于说，彼得的女儿注定要嫁给山下磨坊里那个刚出生的男孩。彼得付了一百块钱，带着答案回家，心里却觉得可笑极了。自己的女儿，怎么能嫁给一个才出世、家里又这样穷的孩子？于是，他对妻子说出了一个主意。
        - id: ch01-b06
          speaker: rich_peter
          text: 你说，他们肯不肯把那男孩卖给我？只要买来，我马上就能除掉他。
        - id: ch01-b07
          speaker: peters_wife
          text: 我看他们会肯的，你知道，他们家穷得很。
        - id: ch01-b08
          speaker: narrator
          text: 彼得来到磨坊，问孩子的母亲愿不愿拿一大笔钱换走儿子。
        - id: ch01-b09
          speaker: birth_mother
          text: 不行！多少钱我也不卖。
        - id: ch01-b10
          speaker: rich_peter
          text: 这有什么不肯的？你们眼下连肚子都快填不饱，多养一个孩子，日子也不会更好过。
        - id: ch01-b11
          speaker: narrator
          text: 母亲为这个儿子满心骄傲，怎么也舍不得他。可磨坊主回家以后，彼得又把买孩子的话说了一遍，还答应出六百块钱。有了这笔钱，夫妻俩就能买一座自己的农庄，不必再替别人磨粮食，也不必在河里缺水、磨坊停工时挨饿。磨坊主觉得这桩买卖划算，最后说服了妻子。母亲眼看孩子被带走，哭得泣不成声。彼得安慰她，说孩子会受到很好的照顾，不过夫妻俩必须答应，从此永远不能打听他的下落。他还谎称自己要把孩子远远送往异国，让他学习外邦语言。
        - id: ch01-b12
          speaker: narrator
          text: 彼得把男孩带回家，叫木匠做了一只齐整漂亮的小箱子，再用沥青封得滴水不漏。他把孩子放进去，锁上箱盖，扔进河里，让水流把箱子带走。
        - id: ch01-b13
          speaker: rich_peter
          text: 这下我总算摆脱他了。
        - id: ch01-b14
          speaker: narrator
          text: 箱子顺流漂了很远，进了另一座磨坊的引水渠，卡住水轮的轴，磨坊一下停了。磨坊主出来查看，把箱子捞上岸。中午回家时，他把这件怪事告诉妻子。
        - id: ch01-b15
          speaker: foster_miller
          text: 今天有只箱子漂进引水渠，把磨坊都卡停了。你猜里面究竟是什么？
        - id: ch01-b16
          speaker: foster_millers_wife
          text: 马上就能知道。钥匙还插在锁眼里呢，转一下吧。
        - id: ch01-b17
          speaker: narrator
          text: 夫妻俩转动钥匙，掀开箱盖，里面竟躺着一个他们从没见过的漂亮孩子。两人又惊又喜，立刻愿意把孩子留下，像亲生儿子一样抚养。他们一直没有儿女，如今年纪也大了，原本早已不指望这辈子还能有个孩子。
    - id: ch02
      title: 被改掉的书信
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 过了一阵，富彼得见女儿仍旧无人求娶，又带着重金去找观星人，问女儿究竟要嫁给谁。
        - id: ch02-b02
          speakers: [stargazer_1, stargazer_2, stargazer_3]
          ensemble: chorus
          text: 我们早已告诉过你，她会嫁给山下那个磨坊主的儿子。
        - id: ch02-b03
          speaker: rich_peter
          text: 你们说得或许没错，可那孩子已经死了。要是能说出她如今该嫁给谁，我情愿再给两百块钱。
        - id: ch02-b04
          speaker: narrator
          text: 观星人又看了一遍星象，这回全都动了气。
        - id: ch02-b05
          speakers: [stargazer_1, stargazer_2, stargazer_3]
          ensemble: chorus
          text: 从前我们怎么说，现在还是怎么说。她会嫁给磨坊主的儿子，就是那个被你扔进河里、想要害死的孩子。他活得好好的，正在下游很远的一座磨坊里。
          emotion: angry
        - id: ch02-b06
          speaker: narrator
          text: 彼得为这个消息付了两百块钱，一路上又开始琢磨怎样除掉男孩。他一回到家，马上赶往观星人所说的磨坊。这时男孩已经长成俊秀少年，也受过了坚信礼。他每天在磨坊里走动，帮着年迈的养父做这做那，成了一个顶有用的帮手。
        - id: ch02-b07
          speaker: rich_peter
          text: 那边那个小伙子，你能不能让给我？
        - id: ch02-b08
          speaker: foster_miller
          text: 不能。我把他当亲生儿子养大，他也没辜负我。如今我老了，干不动活，他正是磨坊里的好帮手。
        - id: ch02-b09
          speaker: rich_peter
          text: 我也老了，正想找个人学我的生意。你若把他交给我，我就给你六百块钱。你可以买座农庄，安安稳稳过完后半辈子。
        - id: ch02-b10
          speaker: narrator
          text: 磨坊主听见这个价钱，终于答应让彼得带走少年。两人各自背着货箱和货物，到远近各地行商，后来住进大森林边的一家客店。从那里穿过森林抄近路，离彼得家并不太远。彼得便叫少年替他送一封信回家，还吩咐少年转告妻子，信里写的事，她一定要立刻照办。可那封信的真正命令，是让妻子马上架起一大堆柴，点着火，把少年扔进去烧死。若不照办，彼得回来就要亲手活活烧死她。
        - id: ch02-b11
          speaker: narrator
          text: 少年把信插在帽带底下，独自走进森林。天色渐暗时，他在很深很远的地方发现一所房子，进去以后，却连一个人影也没见到。其中一间屋子里正好铺着床，他便横身躺下，很快睡着了，还把帽子拉下来盖住脸。可这里其实住着十二个强盗。强盗们回来，看见一个陌生少年睡在床上，全都纳闷他是谁。一个强盗走上前，从帽带下抽出那封信，拆开读了起来。
        - id: ch02-b12
          speaker: robber
          text: 哈！原来是货郎彼得写的。那咱们就捉弄他一次。这样俊秀的少年，叫那个老吝啬鬼害死可太可惜了。
        - id: ch02-b13
          speaker: narrator
          text: 强盗们另写了一封信，趁少年还在熟睡，把它重新塞回帽带下。新信吩咐彼得的妻子一收到信，就马上为女儿和少年操办婚礼。她还要给他们马匹、牲口和全套家用物件，让小两口搬进彼得在山坡下的农庄，从此自立门户。信的末尾还威胁说，若等彼得回来还没把一切办好，她一定会吃苦头。
        - id: ch02-b14
          speaker: narrator
          text: 第二天，强盗们放少年上路。少年回到彼得家，把信交给女主人，还替彼得亲切问候她，请她尽快把信里的事情办妥。
        - id: ch02-b15
          speaker: peters_wife
          text: 看来你一路上表现得很好，他现在才会这样写。你们动身时，他还恨你恨得发狂，只愁想不到法子除掉你呢。
        - id: ch02-b16
          speaker: narrator
          text: 她当场让少年和女儿成婚，把马匹、牲口和家用物件都给了他们，又让小两口住进山坡下的农庄。
        - id: ch02-b17
          speaker: narrator
          text: 没过多久，彼得结束行商回到家。他一进门，头一件事就是追问妻子，有没有照自己那封信上的吩咐，把事情办妥。
        - id: ch02-b18
          speaker: peters_wife
          text: 办了，办了！我也觉得奇怪，可我哪敢不照办。
        - id: ch02-b19
          speaker: narrator
          text: 彼得接着追问女儿在哪里。
        - id: ch02-b20
          speaker: peters_wife
          text: 你还会不知道？她当然住在山坡下的农庄里，这不是你亲笔写的吗？
        - id: ch02-b21
          speaker: narrator
          text: 彼得听妻子讲完事情的来龙去脉，又拿过那封信亲眼查看，这才明白原来的命令早已被人掉了包。他气得几乎要炸开，一刻也不肯停留，拔腿冲上山坡下的农庄，去找那对已经成婚的年轻夫妻。
        - id: ch02-b22
          speaker: rich_peter
          text: 好吧，就算你已经娶了我女儿。可你想留住她，就得去找深渡口恶龙，从他尾巴上拔三根羽毛给我。谁有那三根羽毛，想要什么都能得到。
        - id: ch02-b23
          speaker: lad
          text: 可我要到哪里去找他？
        - id: ch02-b24
          speaker: rich_peter
          text: 我怎么知道？那是你该操心的事，不是我的。
    - id: ch03
      title: 通往恶龙城堡的路
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 少年鼓起勇气上路。走了一程，他来到一位国王的宫殿。
        - id: ch03-b02
          speaker: lad
          text: 我进去问问吧。这样的大人物见多识广，也许知道恶龙住在哪里。
        - id: ch03-b03
          speaker: narrator
          text: 国王问他从哪里来，又要去哪里。
        - id: ch03-b04
          speaker: lad
          text: 我要去找深渡口恶龙，从他尾巴上拔三根羽毛。只可惜我还不知道上哪儿找他。
        - id: ch03-b05
          speaker: water_king
          text: 那你可得带上好运气。我从没听说谁去找他以后还能回来。你若见到他，请替我问问，为什么我的井里总没有清水。我掏了一次又一次，连一滴清水也出不来。
        - id: ch03-b06
          speaker: lad
          text: 好，我一定替您问。
        - id: ch03-b07
          speaker: narrator
          text: 少年留在宫里享用了最好的饭食，离开时又得到了钱和干粮。当天傍晚，他来到另一位国王的宫殿。刚走进厨房，国王就从客厅出来，问他从哪里来，要去做什么。
        - id: ch03-b08
          speaker: lad
          text: 我要去找深渡口恶龙，从他尾巴上拔三根羽毛。
        - id: ch03-b09
          speaker: daughter_king
          text: 那你可得带上好运气。我也从没听说谁去找他以后能回来。你若见到他，请替我问问，我那失踪多年的女儿到底在哪里。我四处找过，还让全国每座教堂都宣告她的名字，可谁也没有她的消息。
        - id: ch03-b10
          speaker: lad
          text: 好，我会牢牢记住。
        - id: ch03-b11
          speaker: narrator
          text: 少年也在这座宫殿里吃了最好的饭食，离开时照样得到钱和干粮。又一个傍晚，他来到第三位国王的宫殿。这回走进厨房的是王后。她问少年从哪里来，要去做什么。
        - id: ch03-b12
          speaker: lad
          text: 我要去找深渡口恶龙，从他尾巴上拔三根羽毛。
        - id: ch03-b13
          speaker: queen
          text: 那你最好多带些好运气。我没听说谁到了他那里还能回来。不过你若见到他，请替我问问，我丢失的金钥匙要去哪里找。
        - id: ch03-b14
          speaker: lad
          text: 好，我一定替您问。
        - id: ch03-b15
          speaker: narrator
          text: 少年离开宫殿，继续向前赶路。不久，一条宽阔的大河挡住去路。他站在岸边看着河水，心里拿不定主意，不知道该设法渡到对岸，还是沿着河岸一直往下走。这时候，一个驼背老人慢慢来到他跟前，开口问他要去哪里。
        - id: ch03-b16
          speaker: lad
          text: 我要去找深渡口恶龙，只盼有人告诉我，他究竟在哪里。
        - id: ch03-b17
          speaker: ferryman
          text: 我可以告诉你。我一直在这里来来回回，把要去见恶龙的人背到对岸。他就住在那里。你爬上山，便能看见他的城堡。要是有机会跟他说话，请替我问问，我还得在这里背人渡河多久。
        - id: ch03-b18
          speaker: lad
          text: 我一定替你问。
        - id: ch03-b19
          speaker: narrator
          text: 驼背老人让少年伏在自己背上，一步步把他送到河对岸。少年谢过老人，独自爬上山。到了高处，他果然看见了恶龙的城堡，于是径直走进大门。城堡里没有别人，只有一位公主，孤零零地和恶龙住在一起。
        - id: ch03-b20
          speaker: princess
          text: 好朋友，你一个基督徒怎么敢来这里？自从我到了这儿，还没有别人来过。你快走吧！恶龙一回家就会闻到你的气味，一口把你吞掉。那会让我伤心死的。
          emotion: fearful
        - id: ch03-b21
          speaker: lad
          text: 不，不！没从他尾巴上拔到三根羽毛以前，我不能离开。
        - id: ch03-b22
          speaker: princess
          text: 你不可能拿到羽毛的，还是快走吧。
          emotion: fearful
        - id: ch03-b23
          speaker: narrator
          text: 少年不肯走。他一定要等恶龙回来，取得羽毛，也问出那几个问题的答案。
        - id: ch03-b24
          speaker: princess
          text: 你既然这样坚决，我就想办法帮你。先试试看，你能不能举起墙上挂的那把剑。
        - id: ch03-b25
          speaker: narrator
          text: 少年用尽力气，连让剑动一下都办不到。
        - id: ch03-b26
          speaker: princess
          text: 我就知道。来，先喝一口这个瓶里的东西。
        - id: ch03-b27
          speaker: narrator
          text: 少年喝完坐了一会儿，再去试剑，这回勉强能让它动一动。
        - id: ch03-b28
          speaker: princess
          text: 你还要再喝一口。也趁现在告诉我，你来这里究竟要办什么事。
        - id: ch03-b29
          speaker: narrator
          text: 少年又喝了一口，把一路上接受的托付全告诉了公主。第一位国王反复掏井，却怎么也得不到清水。第二位国王寻找失踪多年的女儿，连全国的教堂都问遍了。王后不知把一串金钥匙丢在了哪里。最后，老摆渡人还想知道，自己究竟要在河边来回背人多久。少年说完以后，再握住剑柄，已经能把剑举起来了。等他又喝下一口，甚至可以把那把剑挥舞自如。
        - id: ch03-b30
          speaker: princess
          text: 现在钻到床底下去，不然恶龙会杀了你。天快黑了，他很快就回来。你躺着别动，免得被他发现。我们上床以后，我会替你问那几个问题。你要仔细记住他的回答，一直等到恶龙熟睡，再悄悄爬出来拿剑。他一起身，你就一剑砍掉他的脑袋，同时拔下三根羽毛。要不然，他会亲手把羽毛全扯掉，不让任何人得到它们的好处。
    - id: ch04
      title: 公主的四个梦
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 少年钻到床底下。不久，恶龙回来了。
        - id: ch04-b02
          speaker: dragon
          text: 好重的一股基督徒肉味。
        - id: ch04-b03
          speaker: princess
          text: 刚才有只乌鸦叼着一根人骨头飞来，落在屋顶上。你闻到的准是那个味儿。
        - id: ch04-b04
          speaker: dragon
          text: 想来也就是了。
        - id: ch04-b05
          speaker: narrator
          text: 公主若无其事地摆上晚饭。等她和恶龙吃完，两人便上床睡觉，少年仍旧一动不动地藏在下面。躺了一会儿，公主开始翻来覆去，像是怎么也不能安睡。忽然，她一下坐起身来，接连叫了两声。
        - id: ch04-b06
          speaker: princess
          text: 哎呀，我睡不安稳，还做了个特别古怪的梦。
        - id: ch04-b07
          speaker: dragon
          text: 你梦见什么了？说来听听。
        - id: ch04-b08
          speaker: princess
          text: 我梦见一位国王来问你，他要怎样做，井里才能冒出清水。
        - id: ch04-b09
          speaker: dragon
          text: 这种事，他自己就该想出来。把井掏开，再挖走井底那截腐烂的老树桩，清水马上就会涌出来。现在别动了，也别再做梦。
        - id: ch04-b10
          speaker: narrator
          text: 公主安静了一会儿，又翻来覆去，最后猛地坐起来叫了两声。
        - id: ch04-b11
          speaker: dragon
          text: 这回又怎么了？
        - id: ch04-b12
          speaker: princess
          text: 我一点儿也睡不安稳，又做了个特别古怪的梦。
        - id: ch04-b13
          speaker: dragon
          text: 你今晚的梦可真多。这回梦见什么？
        - id: ch04-b14
          speaker: princess
          text: 我梦见一位国王来问你，他那个失踪多年的女儿究竟去了哪里。
        - id: ch04-b15
          speaker: dragon
          text: 你就是他的女儿，可他这辈子再也见不到你。现在安静些，让我睡一会儿。再做梦，我就打断你的肋骨。
          emotion: angry
        - id: ch04-b16
          speaker: narrator
          text: 没过多久，公主又翻来覆去，接着坐起身叫了两声。恶龙被吵醒后暴躁得发狂，几乎要气炸了。
        - id: ch04-b17
          speaker: dragon
          text: 什么，你又来了？这回到底怎么回事？
          emotion: angry
        - id: ch04-b18
          speaker: princess
          text: 别生气，我受不了你发火。可我又做了个特别古怪的梦。
          emotion: fearful
        - id: ch04-b19
          speaker: dragon
          text: 让你的梦见鬼去吧！这一次又梦见什么？
          emotion: angry
        - id: ch04-b20
          speaker: princess
          text: 我梦见一位王后来问你，她丢失的金钥匙要去哪里找。
        - id: ch04-b21
          speaker: dragon
          text: 她只要去自己心里明白的那次躺过的地方，在那片灌木丛里找，很快就会找到。现在别再做梦，让我安静睡觉。
        - id: ch04-b22
          speaker: narrator
          text: 他们又睡了一会儿。公主还是不安稳，最后再次尖叫起来。恶龙怒不可遏，眼睛里都迸出了火星。
        - id: ch04-b23
          speaker: dragon
          text: 非得让我拧断你的脖子，你才肯老实吗？这回又怎么了？
          emotion: angry
        - id: ch04-b24
          speaker: princess
          text: 别这么生气，我受不了。可我又做了个特别古怪的梦。
          emotion: fearful
        - id: ch04-b25
          speaker: dragon
          text: 天哪，我从没听说过这样的梦，简直没完没了。说吧，这次又梦见什么？
          emotion: angry
        - id: ch04-b26
          speaker: princess
          text: 我梦见渡口的摆渡人来问你，他还要守在那里背人渡河多久。
        - id: ch04-b27
          speaker: dragon
          text: 那个蠢货！只要他乐意，早就能自由。下次有人来过河，他只须把那人扔进水里，再叫那人接替他背人渡河，直到别人放那人自由。这样他就解脱了。现在别再做梦，不然我会狠狠收拾你。
          emotion: angry
    - id: ch05
      title: 三根羽毛和四个答案
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 公主终于不再惊醒恶龙，让他继续睡下去。四周安静以后，躲在床底的少年听见恶龙打起鼾来，这才悄悄爬出。还没等天亮，恶龙就起了身。可他的两只脚才刚刚落地，少年已经抓起那把剑，一剑砍掉他的脑袋，紧接着从恶龙尾巴上拔下三根羽毛。
        - id: ch05-b02
          speaker: narrator
          text: 少年和公主见恶龙已死，欢喜极了。他们在城堡里收拾起金子、银子、钱币和珍宝，凡是力所能及的，全都带在身上，然后一起走下山。来到渡口，两人把城堡里发生的事和恶龙说过的话都讲给摆渡人听。事情实在太多，听得他脑子发乱，竟忘了追问自己的答案。直到他把两人送过河，看见他们将要离开，才忽然想起来。
        - id: ch05-b03
          speaker: ferryman
          text: 喂，那位先生！我托你问恶龙的事，你到底问了吗？
        - id: ch05-b04
          speaker: lad
          text: 问了。恶龙说，下次有人要过河，你得把那人扔到河中央，叫他接替你来回背人渡河，直到有人放他自由。这样你就能解脱了。
        - id: ch05-b05
          speaker: ferryman
          text: 啊，你真该倒霉！要是早些告诉我，你自己就能放我自由了。
          emotion: angry
        - id: ch05-b06
          speaker: narrator
          text: 两人来到第一座宫殿，王后马上问少年有没有向恶龙打听金钥匙。
        - id: ch05-b07
          speaker: lad
          text: 问了。恶龙说，您得去自己心里明白的那一天躺过的地方，到那片灌木丛里找。
        - id: ch05-b08
          speaker: queen
          text: 嘘！一个字也别再说。
          emotion: fearful
        - id: ch05-b09
          speaker: narrator
          text: 王后听完答案，马上给了少年一百块钱。少年和公主继续赶路，来到第二座宫殿。那位国王迎上来，问少年有没有替他向恶龙打听女儿的下落。
        - id: ch05-b10
          speaker: lad
          text: 问了。您看，站在这里的就是您的女儿。
        - id: ch05-b11
          speaker: narrator
          text: 国王终于见到失踪多年的女儿，欢喜得不得了。他本想把公主嫁给少年，再把半个王国也送给他。可是少年早已成婚，不能再娶公主。国王便换了一种报答，给了他两百块钱、马车和马匹，还有他能够带走的一切金银。
        - id: ch05-b12
          speaker: narrator
          text: 到了第三座宫殿，国王亲自迎出来，问少年有没有替他向恶龙询问水井的事。
        - id: ch05-b13
          speaker: lad
          text: 问了。恶龙说，您要把井掏开，挖走井底那截腐烂的老树桩，井里就会有充足的清水。
        - id: ch05-b14
          speaker: narrator
          text: 国王听到答案，给了少年三百块钱。所有受托的事都办完了，少年这才带着公主动身回家。一路上，他满载各位国王赏赐的金银，又穿着华美的衣裳，浑身上下闪闪发亮。等他回到故乡，如今的财富已经远远超过货郎富彼得。
    - id: ch06
      title: 富彼得的渡船
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: 少年把三根羽毛交给彼得。彼得亲眼看见以后，再也找不出一句话反对女儿的这桩婚事。可他随即注意到少年带回的金银和华美衣裳，贪心又冒了出来，马上追问恶龙的城堡里是不是还剩下许多财宝。
        - id: ch06-b02
          speaker: lad
          text: 当然还多着呢。那里的财宝远比我能带走的多，多得可以装满许多匹马。您要是想去，尽管放心，剩下的一定够您拿。
        - id: ch06-b03
          speaker: narrator
          text: 少年把路线讲得清清楚楚，让彼得一路上用不着向任何人问路。
        - id: ch06-b04
          speaker: lad
          text: 不过，那些马最好留在河的这一边。老摆渡人自然会把您稳稳当当地背过去。
        - id: ch06-b05
          speaker: narrator
          text: 彼得听得心里发痒，立刻带上大量食物，又牵了许多匹准备用来驮财宝的马，朝恶龙的城堡出发。到了那条大河边，他照少年嘱咐的，把所有马匹留在这一边的岸上。老摆渡人果然让彼得伏在背上，开始向对岸走。可走到河心附近，他忽然把彼得扔进了水中央。
        - id: ch06-b06
          speaker: ferryman
          text: 现在由你留在这里，来回背人渡河，直到有人放你自由。
        - id: ch06-b07
          speaker: narrator
          text: 除非已经有人放他自由，否则直到今天，货郎富彼得还在那里来来回回，背着人渡河呢。
