  chapters:
    - id: ch01
      title: The Lady in the Wood
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Once, far away in a great wood, there lived a poor husband and wife. They had a pretty baby girl, but they had no money for the parson's fee and did not know how they could have her christened.
        - id: ch01-b02
          speaker: narrator
          text: One day the father went from house to house, looking for someone who would stand for the child and pay the fee. Everyone was willing to stand, but no one would pay. He had searched all day and was walking home when a lovely lady met him. She was finely dressed and looked wonderfully kind. She offered to have the baby christened, but afterward she would keep the child as her own.
        - id: ch01-b03
          speaker: father
          text: I must ask my wife before I give you an answer.
        - id: ch01-b04
          speaker: narrator
          text: He went home and told his wife what had happened.
        - id: ch01-b05
          speaker: mother
          text: No. I won't agree to that.
        - id: ch01-b06
          speaker: narrator
          text: The next day he tried again. He begged and pleaded, but still no one would help if paying the fee was part of it. Toward evening, the same lovely lady met him and made the same offer. When he told his wife, she gave him a different answer.
        - id: ch01-b07
          speaker: mother
          text: Try once more tomorrow. If nobody will stand for our baby then, we must let the lady do as she asks. She seems so kind and good.
        - id: ch01-b08
          speaker: narrator
          text: On the third day, the father found no one willing to help. That evening he met the lady again, and he gave his word that she could have the baby if she had the child christened at the font.
        - id: ch01-b09
          speaker: narrator
          text: The next morning, the lady came to their home with two men who would serve as godfathers. She carried the baby to church, where the little girl was christened. Then the lady took her home. The child lived there for several years, and her foster-mother was always kind and friendly to her.
    - id: ch02
      title: The Three Forbidden Rooms
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: When the lassie was old enough to know right from wrong, her foster-mother prepared to leave on a journey. She showed the girl certain rooms before she went.
        - id: ch02-b02
          speaker: godmother
          text: You may go anywhere in the house except the rooms I have shown you.
        - id: ch02-b03
          speaker: narrator
          text: But the lassie could not resist. She opened one forbidden door just a crack, and pop! Out flew a Star.
        - id: ch02-b04
          speaker: narrator
          text: Her foster-mother came home and saw that the Star was gone. She was deeply vexed. She grew angry with the girl and threatened to send her away. The child cried and begged so hard that at last she was allowed to stay.
        - id: ch02-b05
          speaker: narrator
          text: After a while, the foster-mother had to take another journey. Before leaving, she warned the lassie not to enter the two rooms she had never seen. The girl promised to be careful. Yet once she was alone, she wondered and wondered what the second room held. At last she eased the door open for one little peek, and pop! Out flew the Moon.
        - id: ch02-b06
          speaker: narrator
          text: When her foster-mother returned and found the Moon gone, she was very downcast.
        - id: ch02-b07
          speaker: godmother
          text: You must leave me now. I cannot let you stay any longer.
          emotion: sad
        - id: ch02-b08
          speaker: narrator
          text: The lassie wept bitterly and begged with all her heart to be forgiven. This time too, her foster-mother let her remain.
        - id: ch02-b09
          speaker: narrator
          text: Some time later, the foster-mother went away once more. By then the lassie was half grown. Her foster-mother warned her most earnestly not to enter the third room or even peep inside.
        - id: ch02-b10
          speaker: narrator
          text: For a while after she was left alone, the lassie wandered about the house. Then she grew weary, and the thought came to her that it would be great fun to peek into that room. She remembered her foster-mother and told herself not to do it. But when the thought returned, she could hold back no longer. Whatever happened, she would look. She opened the door the tiniest bit, and pop! Out flew the Sun.
        - id: ch02-b11
          speaker: narrator
          text: Her foster-mother came back and saw that the Sun had escaped. It cut her to the heart.
        - id: ch02-b12
          speaker: godmother
          text: There is nothing else I can do. You must go, and I will not allow you to stay with me again.
          emotion: sad
        - id: ch02-b13
          speaker: narrator
          text: The lassie cried until she had no tears left. She begged as sweetly as she could, but nothing helped.
        - id: ch02-b14
          speaker: godmother
          text: No. I must punish you. You may choose. You can be the loveliest woman in the world and lose your speech, or you can keep your speech and become the ugliest of all women. Whichever you choose, you must leave me.
        - id: ch02-b15
          speaker: lassie
          text: I would rather be lovely.
        - id: ch02-b16
          speaker: narrator
          text: In that instant she became wondrously beautiful, but from that day on she could not speak.
    - id: ch03
      title: The Face in the Spring
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: The lassie left her foster-mother and wandered through a great wood. The farther she walked, the farther away the end of the forest seemed. When evening came, she climbed a tall tree that grew over a spring and settled there to sleep for the night.
        - id: ch03-b02
          speaker: narrator
          text: A castle stood close by. Early each morning, a maid came from the castle to draw water from that spring for the Prince's tea. When she looked into the water, she saw a lovely face reflected there. She thought it was her own. At once she threw down her pitcher, ran home, and tossed her head.
        - id: ch03-b03
          speaker: first_maid
          text: If I am as pretty as that, I am much too good to fetch water.
        - id: ch03-b04
          speaker: narrator
          text: So another maid was sent to the spring. The very same thing happened. She saw the beautiful face, believed it was hers, and hurried back.
        - id: ch03-b05
          speaker: second_maid
          text: I am far too pretty and too good to carry water for the Prince.
        - id: ch03-b06
          speaker: narrator
          text: Then the Prince went to see what all this meant. He reached the spring and saw the lovely image in the water too, but he looked up at once. There sat the lassie in the tree above him. He coaxed her down and took her home.
        - id: ch03-b07
          speaker: narrator
          text: In time, the Prince decided to make her his queen because she was so beautiful. His mother, the old Queen, opposed the marriage.
        - id: ch03-b08
          speaker: old_queen
          text: She cannot speak. For all we know, she may be a wicked witch.
        - id: ch03-b09
          speaker: narrator
          text: But the Prince would not be satisfied until he had married the lassie.
    - id: ch04
      title: The Three Children
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: After they had lived together for a while, the young Queen was going to have a child. When the time came, the Prince placed a strong watch around her. But as the baby was born, every guard fell into a deep sleep.
        - id: ch04-b02
          speaker: narrator
          text: The foster-mother appeared. She cut the baby's little finger and touched the Queen's mouth with the blood.
        - id: ch04-b03
          speaker: godmother
          text: Now you will grieve as I grieved when you let out the Star.
        - id: ch04-b04
          speaker: narrator
          text: With those words, the foster-mother carried the baby away. When the watchers awoke, they saw the blood and believed the Queen had eaten her own child. The old Queen wanted her burned alive. The Prince loved his wife so dearly that he pleaded until she was spared, though it was very hard to win her freedom.
        - id: ch04-b05
          speaker: narrator
          text: When the young Queen was to have a second child, the Prince set a watch twice as strong as the first. Yet the same thing happened again. Everyone fell asleep, and the foster-mother came for the baby.
        - id: ch04-b06
          speaker: godmother
          text: Now you will grieve as I grieved when you let out the Moon.
        - id: ch04-b07
          speaker: narrator
          text: While her foster-mother was there, the Queen could speak. She begged and pleaded and wept, but it did no good. The foster-mother carried the child away.
        - id: ch04-b08
          speaker: narrator
          text: Once again, the old Queen demanded that she be burned. Once again, the Prince found a way to save her.
        - id: ch04-b09
          speaker: narrator
          text: Before the third child was born, the Prince set a watch three times as strong as the first. Still, everything happened just as before. The guards slept. The foster-mother came, took the baby, cut its little finger, and smeared the Queen's mouth with the blood.
        - id: ch04-b10
          speaker: godmother
          text: Now you will grieve as I grieved when you let out the Sun.
        - id: ch04-b11
          speaker: narrator
          text: This time, the Prince could no longer save his wife. She was to be burned.
    - id: ch05
      title: The Godmother Returns
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: They were leading the young Queen to the stake when suddenly her foster-mother appeared with all three children. She led two by the hand and carried the third in her arms. She came straight to the Queen.
        - id: ch05-b02
          speaker: godmother
          text: Here are your children. You may have them back now. I am the Virgin Mary. The grief you have suffered is the grief I felt when you let out the Sun, the Moon, and the Star. Your punishment is over. From this day on, you will have your speech again.
        - id: ch05-b03
          speaker: narrator
          text: How glad the Queen and Prince were, anyone may imagine, but no one can tell.
        - id: ch05-b04
          speaker: narrator
          text: They were always happy after that, and from that day forward, even the Prince's mother was very fond of the young Queen.
