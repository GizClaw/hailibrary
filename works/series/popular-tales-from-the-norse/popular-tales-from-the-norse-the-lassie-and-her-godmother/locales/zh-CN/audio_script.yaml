audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 从容而清醒，带一点克制的诙谐
        timbre: 温厚清晰
        pace: 舒缓有致
        pitch: 中低
    father:
      display_name: 父亲
      tts:
        delivery: 老实温和，困窘时带着恳切
        timbre: 朴厚低沉
        pace: 中等
        pitch: 中低
    mother:
      display_name: 母亲
      tts:
        delivery: 质朴直率，爱女心切
        timbre: 温暖清亮
        pace: 中等
        pitch: 中等
    godmother:
      display_name: 教母
      tts:
        delivery: 平静端庄，责备时严厉而克制
        timbre: 柔和深沉
        pace: 中等偏慢
        pitch: 中等
    lassie:
      display_name: 姑娘
      tts:
        delivery: 年轻柔婉，哀求时真切急迫
        timbre: 清澈柔和
        pace: 中等
        pitch: 中等偏高
    maid_one:
      display_name: 第一个女仆
      tts:
        delivery: 得意自负，说话干脆
        timbre: 明亮清脆
        pace: 中等偏快
        pitch: 中等偏高
    maid_two:
      display_name: 第二个女仆
      tts:
        delivery: 骄傲轻慢，语气理所当然
        timbre: 清亮偏薄
        pace: 中等
        pitch: 中等偏高
    prince:
      display_name: 王子
      tts:
        delivery: 温和坚定，面对压力时沉着执着
        timbre: 明朗坚实
        pace: 中等
        pitch: 中等偏低
    old_queen:
      display_name: 老王后
      tts:
        delivery: 威严多疑，发怒时冷硬果断
        timbre: 低沉锐利
        pace: 中等偏慢
        pitch: 中低
  chapters:
    - id: ch01
      title: 善良夫人的条件
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 从前，在一片大森林的遥远深处，住着一对穷夫妻。他们生下一个漂亮的女儿，却连请牧师给孩子受洗的钱也拿不出来。父亲只好出门求人，希望有人肯做孩子的教父母，也替他们付清费用。他走了一整天。家家都乐意答应做教父母，可一听还得出钱，就没人肯了。
        - id: ch01-b02
          speaker: narrator
          text: 回家路上，他遇见一位衣着华贵的美丽夫人。她看起来和善极了，愿意替孩子安排洗礼，条件是洗礼过后，要把孩子带回去归她抚养。父亲说，这得先问妻子。他回到家，把事情原原本本讲了一遍。
        - id: ch01-b03
          speaker: mother
          text: 不行！
        - id: ch01-b04
          speaker: narrator
          text: 第二天，父亲又从一家走到另一家。他求了又求，还是没人肯一面做教父母，一面支付费用。傍晚回家的路上，那位夫人又出现了。她依旧温柔可亲，也提出了同样的条件。父亲回家一说，妻子终于松了口。要是明天仍找不到别人，那就答应她吧，毕竟她看上去那么善良。
        - id: ch01-b05
          speaker: narrator
          text: 第三天，父亲又奔走了一天，依旧无人相助。傍晚再次遇见夫人时，他终于许下诺言。只要她肯让孩子在圣水盘前受洗，就把孩子交给她。第二天一早，夫人带着两位教父来到这对夫妻家中，亲手抱着婴儿前往教堂，完成了洗礼。此后，小姑娘便住进她家。好几年过去，养母一直待她亲切慈爱。
    - id: ch02
      title: 飞走的星月太阳
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 姑娘长到懂事的年纪，养母有一天要出门远行。临走前，她把家里几间屋子指给姑娘看。
        - id: ch02-b02
          speaker: godmother
          text: 整座房子你都可以去，只有我刚才指的那几间屋子，绝不能进去。
        - id: ch02-b03
          speaker: narrator
          text: 养母说完便走了。姑娘独自留在家里，到底没忍住。她把一扇门悄悄推开一点，只听“砰”的一声，一颗星星飞了出去。养母回来发现星星不见了，气得厉害，不但责骂养女，还扬言要把她赶出去。姑娘哭着一再恳求，这才获准留下。
        - id: ch02-b04
          speaker: narrator
          text: 过了一阵，养母又要远行。她叮嘱姑娘，剩下两间从没进过的屋子也不能碰。姑娘答应会当心。可一个人留在家里，她总想着第二间屋里究竟有什么。最后，好奇心压过了承诺。门刚开了一道缝，又是“砰”的一声，月亮飞走了。
        - id: ch02-b05
          speaker: narrator
          text: 养母回来看见这一切，伤心得要姑娘离开，再也不能和她住在一起。姑娘哭得那样悲切，又诚心请求宽恕，养母终于又让她留了下来。
        - id: ch02-b06
          speaker: narrator
          text: 又过了一些日子，养母第三次出门。姑娘已经长到半大，她再三叮嘱，第三间屋子连偷看也不行。起初，姑娘还记着这番话。可独自在房里转久了，她忽然觉得，往第三间屋子里瞧上一眼一定很有意思。她想起养母，告诉自己不该看。那念头第二次冒出来时，她却再也抵挡不住。
        - id: ch02-b07
          speaker: narrator
          text: 不管有什么后果，她都一定要看。门才推开小小一条缝，“砰”的一声，太阳也飞了出去。养母回来，心都碎了。她说，这一次再没有办法留下姑娘。姑娘哭干了眼泪，苦苦哀求，可什么也改变不了。
        - id: ch02-b08
          speaker: godmother
          text: 不行，我非罚你不可。不过让你自己选。你可以成为世上最美的女人，从此一句话也说不了。你也可以保住声音，却成为天下最丑的女人。不论怎么选，你都得离开我。
        - id: ch02-b09
          speaker: lassie
          text: 那我宁愿拥有美貌。
        - id: ch02-b10
          speaker: narrator
          text: 转眼间，姑娘变得美丽无双，也从此成了哑巴。
    - id: ch03
      title: 泉水里的美丽面孔
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 姑娘离开养母，在无边无际的森林里走啊走。她走得越远，森林的尽头仿佛退得越远。天黑时，她爬上一棵高树，在枝头安顿好自己，准备在那里过夜。这棵树伸展在一眼泉水上方，不远处还坐落着一座城堡。
        - id: ch03-b02
          speaker: narrator
          text: 每天清晨，城堡里都会派女仆来这里打水，好给王子沏茶。第一个女仆低头一看，泉水里映着一张美丽的脸。她不知道树上有人，还以为那是自己。于是，她扔下水罐，跑回城堡，得意地扬起了头。
        - id: ch03-b03
          speaker: maid_one
          text: 我长得这么漂亮，哪还能让我去打水？那也太委屈我了。
        - id: ch03-b04
          speaker: narrator
          text: 城堡只好换另一个女仆来。她也在水里看见姑娘的面容，也把那当成了自己的脸。
        - id: ch03-b05
          speaker: maid_two
          text: 我又漂亮又高贵，才不该替王子到泉边打水。
        - id: ch03-b06
          speaker: narrator
          text: 王子听得莫名其妙，便亲自来查看。他也先看见了水里的影子，却马上抬起头，发现树上坐着一位美丽的姑娘。王子温言劝她从树上下来，把她带回了自己的家。最后，他认定这样美丽的姑娘正该做自己的王后。可他的母亲还在世，怎么也不同意这门婚事。
        - id: ch03-b07
          speaker: old_queen
          text: 她一句话也不会说，说不定还是个邪恶的女巫。
        - id: ch03-b08
          speaker: narrator
          text: 王子却下定了决心，非娶她不可。两人共同生活了一段日子，年轻的王后有了身孕。
    - id: ch04
      title: 三个被带走的孩子
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 第一个孩子临产时，王子派了许多守卫守在王后身边。可孩子刚出生，所有人就一起沉沉睡去。养母悄然来到房中，割破婴儿的小手指，把血涂在王后嘴边。
        - id: ch04-b02
          speaker: godmother
          text: 你放走星星时，我有多伤心，现在你也该尝尝这样的痛苦。
          emotion: sad
        - id: ch04-b03
          speaker: narrator
          text: 养母说完，抱走了婴儿。守卫们醒来，看见王后嘴边的鲜血，都以为她吃掉了自己的孩子。老王后坚持要将她活活烧死。王子舍不得妻子，苦苦求情，费尽力气才救下她。
        - id: ch04-b04
          speaker: narrator
          text: 王后第二次临产时，守卫增加到头一次的两倍之多，可同样的事还是发生了。所有人再次沉沉睡去，养母又割破婴儿的手指，把血涂在王后嘴边，随后带走了孩子。
        - id: ch04-b05
          speaker: godmother
          text: 你放走月亮时，我有多伤心，现在你也该尝尝这样的痛苦。
          emotion: sad
        - id: ch04-b06
          speaker: narrator
          text: 养母在场时，王后原本能够开口。她哭着哀求，一遍遍请求宽恕，却毫无用处。老王后又要把她烧死，王子再次想方设法保住了她。
        - id: ch04-b07
          speaker: narrator
          text: 第三个孩子将要出生时，王子派出的守卫是头一次的三倍。可他们还是全睡着了。养母来到王后身边，抱走婴儿，也割破孩子的小手指，把血抹在王后嘴边。
        - id: ch04-b08
          speaker: godmother
          text: 你放走太阳时，我心里是什么滋味，现在你也该明白了。
          emotion: sad
        - id: ch04-b09
          speaker: narrator
          text: 这一次，王子再也救不了妻子。老王后一定要处死她，年轻的王后终于被押往火刑柱。
    - id: ch05
      title: 火刑柱前的真相
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 就在众人带着年轻的王后走向火刑柱时，养母忽然出现了。三个孩子都跟在她身边，两个由她牵着，最小的一个抱在怀里。她径直走到年轻的王后面前。
        - id: ch05-b02
          speaker: godmother
          text: 你的孩子都在这里，现在我把他们还给你。我就是圣母玛利亚。你这些日子有多悲伤，当初你放走太阳、月亮和星星时，我也同样悲伤。你已经为自己的过错受了惩罚，从今以后，你又能开口说话了。
        - id: ch05-b03
          speaker: narrator
          text: 王后和王子有多么欢喜，谁都想象得到，却没有人说得出来。从此，他们一直幸福地生活在一起。就连王子的母亲，也从那一天起深深喜爱上了年轻的王后。
