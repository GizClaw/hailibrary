audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 从容而清醒，带一点克制的诙谐
        timbre: 温厚清晰
        pace: 舒缓有致
        pitch: 中低
    gudbrand:
      display_name: 古德布兰
      tts:
        delivery: 朴实随和，凡事想得开，说话不紧不慢
        timbre: 厚实温暖
        pace: 中等偏缓
        pitch: 中低
    wife:
      display_name: 古德布兰的妻子
      tts:
        delivery: 热情爽朗，句句真心，越说越有兴致
        timbre: 明亮温暖
        pace: 中等
        pitch: 中等
    neighbor:
      display_name: 邻居
      tts:
        delivery: 直率而多疑，带着看热闹的意味
        timbre: 清楚结实
        pace: 中等
        pitch: 中等
  chapters:
    - id: ch01
      title: 山坡上的夫妻
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 从前有个人名叫古德布兰。他的农庄远在一座山坡上，所以人们都叫他山坡上的古德布兰。
        - id: ch01-b02
          speaker: narrator
          text: 古德布兰和妻子的日子过得很和美，两人又格外合得来。丈夫不论做什么，妻子都觉得做得再好不过，世上没有什么比得上。只要是他着手做的事，她总是欢欢喜喜。他们住的是自家的田庄，箱底压着一百块钱，院里的牛栏里还拴着两头母牛。
        - id: ch01-b03
          speaker: narrator
          text: 有一天，妻子跟古德布兰商量起来。
        - id: ch01-b04
          speaker: wife
          text: 亲爱的，我想咱们该牵一头牛进城卖掉。这样手头就有现钱了。咱们日子过得这么殷实，也该像别人一样备些现钱。箱底那一百块可不能拆散了花，我也实在想不出，咱们为什么需要两头牛。卖掉一头还有个好处，我往后只要照料一头牛，不必再给两头牛喂料、铺草、饮水了。
        - id: ch01-b05
          speaker: narrator
          text: 古德布兰听完，觉得妻子讲的全是好道理，马上牵着一头牛出发，到城里去卖。可他在城里转了一番，竟然没有一个人肯买他的牛。
        - id: ch01-b06
          speaker: gudbrand
          text: 好吧，不打紧。最坏也不过牵着牛回家。家里有牛棚，也有拴牛的绳子。再说，回去的路总不会比来的路更远。
        - id: ch01-b07
          speaker: narrator
          text: 说完，他便牵着牛，一步一晃地往家走。
    - id: ch02
      title: 一路交换
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 没走多远，古德布兰遇见一个要卖马的人。他想，有一匹马总比有一头牛好，就拿牛换了马。再往前走一点，他碰见一个人赶着一头肥猪。他又想，肥猪总比马好，于是拿马换了猪。
        - id: ch02-b02
          speaker: narrator
          text: 后来，他遇见一个牵山羊的人，觉得山羊胜过猪，就拿猪换了那人的山羊。接着他走了好一阵，遇见一个带绵羊的人。他觉得绵羊怎么也比山羊强，便又交换了一次。过了一会儿，他碰见一个带鹅的人，于是拿绵羊换了鹅。又走了很久很久，他才遇见一个带公鸡的人，便把鹅换成了公鸡。
        - id: ch02-b03
          speaker: gudbrand
          text: 公鸡肯定比鹅强。
        - id: ch02-b04
          speaker: narrator
          text: 可他继续往前走时，天色已经很晚了。古德布兰饿得厉害，只好用一个先令卖掉公鸡，再拿那笔钱买了食物填肚子。
        - id: ch02-b05
          speaker: gudbrand
          text: 保住性命，总比留着公鸡强。
        - id: ch02-b06
          speaker: narrator
          text: 吃过以后，他继续往家走。到了离自己家最近的那位邻居门前，他转身进屋，打算在那里歇一歇。
    - id: ch03
      title: 一百块钱的赌约
      blocks:
        - id: ch03-b01
          speaker: neighbor
          text: 怎么样，这一趟进城顺利吗？
        - id: ch03-b02
          speaker: gudbrand
          text: 不好不坏吧。运气说不上好，我也不怪它。
        - id: ch03-b03
          speaker: narrator
          text: 古德布兰把一路上的事从头到尾讲了一遍。
        - id: ch03-b04
          speaker: neighbor
          text: 哎呀，这还用说吗？你一到家，准会挨妻子一顿好骂。愿上天保佑你吧，无论给我什么，我也不愿落到你的处境里。
        - id: ch03-b05
          speaker: gudbrand
          text: 我看事情原本还可能更糟。至于我这回做得对不对，先放在一边。我有一位那么好的妻子，无论我做什么，她从来不说半句责怪的话。
        - id: ch03-b06
          speaker: neighbor
          text: 得了吧。你这么说，我可还是不信。
        - id: ch03-b07
          speaker: gudbrand
          text: 那咱们打个赌怎么样？我家箱底有一百块钱。你也拿一百块出来，敢不敢赌？
        - id: ch03-b08
          speaker: narrator
          text: 邻居马上答应了这场赌约。古德布兰便在他家待到傍晚。眼看天色一点点暗下来，两人一同来到古德布兰家。照两人商定的办法，邻居站在门外偷听，古德布兰独自进屋去见妻子。
        - id: ch03-b09
          speaker: gudbrand
          text: 晚上好！
        - id: ch03-b10
          speaker: wife
          text: 晚上好！哎呀，是你回来了吗？感谢上帝！
        - id: ch03-b11
          speaker: narrator
          text: 回来的果然是丈夫。妻子高兴过后，便问他这一趟进城，事情到底办得怎么样。
    - id: ch04
      title: 牛换成了什么
      blocks:
        - id: ch04-b01
          speaker: gudbrand
          text: 唉，只能说不好不坏，没什么可夸口的。城里没有人肯买那头牛，所以我拿它换了一匹马。
        - id: ch04-b02
          speaker: wife
          text: 换成马啦？这事办得真好，打心眼儿里谢谢你！咱们家境这么好，也能像别人一样坐车去教堂了。咱们若想养马，当然有资格弄一匹来。孩子，快出去，把马安顿好。
        - id: ch04-b03
          speaker: gudbrand
          text: 哎，可我没把马带回来。我又走了一段，拿它换了一头猪。
        - id: ch04-b04
          speaker: wife
          text: 想想看！换作我，也会跟你做得一模一样。真是千恩万谢！往后家里能存些熏肉，来了客人就有东西招待。咱们要马做什么？别人只会说咱们骄傲起来了，连去教堂都不肯走路。孩子，快出去，把猪安顿到猪圈里。
        - id: ch04-b05
          speaker: gudbrand
          text: 可是猪也没了。我又往前走了一点，拿它换了一头奶山羊。
        - id: ch04-b06
          speaker: wife
          text: 上帝保佑，什么事都叫你办得这么妥当！现在想一想，我要猪做什么？人家只会指着咱们说，瞧那一家子，把自己有的东西全吃光了。现在有了山羊，我既有奶，又有奶酪，山羊本身还留着。孩子，快出去，把山羊安顿好。
        - id: ch04-b07
          speaker: gudbrand
          text: 不过山羊也不在我手里。我再往前走了些，把它换成了一头很好的绵羊。
        - id: ch04-b08
          speaker: wife
          text: 不会吧！你办的每件事都那么称我的心，简直像我也一路跟着你似的。咱们要山羊做什么？真养了它，我一天倒有一半工夫要花在爬山上，只为了把它赶下来。绵羊就不同了，既有羊毛做衣服，家里又有鲜肉吃。孩子，快出去，把绵羊安顿好。
    - id: ch05
      title: 妻子的最后一句话
      blocks:
        - id: ch05-b01
          speaker: gudbrand
          text: 可绵羊也没了。我又走了一段，拿它换了一只鹅。
        - id: ch05-b02
          speaker: wife
          text: 谢谢你，谢谢你！我从心底里感谢你！我要绵羊做什么？家里没有纺车，也没有梳毛梳，我更不愿为了裁剪、做样子、缝衣裳操那么多心。咱们一直都是买衣服穿，以后也照旧买就好。现在我有盼了许多回的烤鹅吃，还有鹅绒可以装进我的小枕头。孩子，快出去，把鹅安顿好。
        - id: ch05-b03
          speaker: gudbrand
          text: 哎，可鹅也不在了。我拿它换了一只公鸡。
        - id: ch05-b04
          speaker: wife
          text: 哎呀，什么事都叫你想到了，换作我也会这么办！一只公鸡，想想看，它简直抵得上一座八日钟。每天早晨四点，它一打鸣，咱们就能早早起身干活。咱们要鹅做什么？我根本不会烤鹅。至于枕头，用棉草来填也一样。孩子，快出去，把公鸡安顿好。
        - id: ch05-b05
          speaker: gudbrand
          text: 可到头来，公鸡也没带回来。我走着走着，饿得像个猎人，只好用一个先令把它卖了，不然就要活活饿死。
        - id: ch05-b06
          speaker: wife
          text: 谢天谢地，幸好你卖了！你不管做什么，总是正合我的心意。咱们要公鸡做什么？咱们是自己的主人，想在床上躺到多晚，就能躺到多晚。感谢上天，让你平平安安回到我身边。你什么事都办得这么好，有了你，我既不需要公鸡，也不需要鹅，猪和牛更是一头也不需要。
        - id: ch05-b07
          speaker: narrator
          text: 妻子的话说完以后，古德布兰这才走到门边，一把打开门，对一直等在外面的邻居说道。
        - id: ch05-b08
          speaker: gudbrand
          text: 怎么样，现在还有什么话说？那一百块钱是不是归我了？
        - id: ch05-b09
          speaker: narrator
          text: 邻居把这一切听得清清楚楚，再也没有什么可争辩的，只得承认古德布兰确实赢了这场赌约。
