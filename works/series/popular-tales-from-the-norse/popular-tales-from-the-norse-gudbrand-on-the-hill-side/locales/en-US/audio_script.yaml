audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: thoughtful and gently wry
        timbre: warm and clear
        pace: measured
        pitch: medium
    gudbrand:
      display_name: Gudbrand
      tts:
        delivery: easygoing and cheerfully certain
        timbre: warm and rustic
        pace: unhurried
        pitch: medium-low
    goodwife:
      display_name: Goodwife
      tts:
        delivery: affectionate and warmly enthusiastic
        timbre: clear and homely
        pace: lively
        pitch: medium
    neighbour:
      display_name: Neighbour
      tts:
        delivery: skeptical and blunt
        timbre: dry and sturdy
        pace: measured
        pitch: medium-low
    child:
      display_name: Child
      tts:
        delivery: attentive and willing
        timbre: light and youthful
        pace: natural
        pitch: high
  chapters:
    - id: ch01
      title: Gudbrand and His Goodwife
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Long ago, there lived a man named Gudbrand. His farm stood far, far away on a hillside, and that was why everyone called him Gudbrand on the Hill-side.
        - id: ch01-b02
          speaker: narrator
          text: Gudbrand and his goodwife were wonderfully happy together. They understood each other so well that she thought everything he did was the finest thing in the world. Whatever he turned his hand to, she was glad of it. They owned their farm, kept a hundred dollars at the bottom of a chest, and had two cows tied in a stall in the farmyard.
        - id: ch01-b03
          speaker: goodwife
          text: Dear, I think we ought to take one cow into town and sell her. Then we'd have some money ready to use, as well-to-do people should. We mustn't break into the hundred dollars in the chest, and we really don't need two cows. It would save work, too. I'd only have one cow to feed, bed down, and water instead of two.
        - id: ch01-b04
          speaker: narrator
          text: Gudbrand thought his wife had spoken good sense. He set out at once, leading the cow into town. But once he got there, not a single person would buy her.
        - id: ch01-b05
          speaker: gudbrand
          text: Well, never mind. The worst that can happen is that I take my cow home again. I have a stall and a tether for her, and the road home is no longer than the road here.
        - id: ch01-b06
          speaker: narrator
          text: So Gudbrand started home, toddling along with his cow.
    - id: ch02
      title: The Trades Along the Road
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: Before he had gone far, he met a man with a horse for sale. Gudbrand decided that a horse was better than a cow, so he traded with the man.
        - id: ch02-b02
          speaker: narrator
          text: A little farther along, he met a man driving a fat pig. A fat pig seemed better than a horse, so Gudbrand traded again. Then he met a man with a goat. A goat seemed better than a pig, and he made another trade.
        - id: ch02-b03
          speaker: narrator
          text: He walked on for a good while before meeting a man with a sheep. Gudbrand thought a sheep was better than a goat, so the sheep became his. Later, he met a man with a goose and gave the sheep in exchange for it.
        - id: ch02-b04
          speaker: narrator
          text: After a long, long walk, Gudbrand met a man carrying a cock.
        - id: ch02-b05
          speaker: gudbrand
          text: Surely a cock is better than a goose.
        - id: ch02-b06
          speaker: narrator
          text: So he traded the goose for the cock. By then the day was nearly over, and Gudbrand was terribly hungry. He sold the cock for a shilling and spent the money on food.
        - id: ch02-b07
          speaker: gudbrand
          text: Saving my life is always better than keeping a cock.
    - id: ch03
      title: A Wager at the Neighbour's House
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: Gudbrand kept walking toward home until he reached the house of his nearest neighbour. There he stopped in for a visit.
        - id: ch03-b02
          speaker: neighbour
          text: Well, how did you get on in town?
        - id: ch03-b03
          speaker: gudbrand
          text: So-so. I can't praise my luck, but I can't blame it either.
        - id: ch03-b04
          speaker: narrator
          text: Then Gudbrand told him the whole story, from beginning to end.
        - id: ch03-b05
          speaker: neighbour
          text: Oh, you'll get a fine scolding when your wife hears this. Heaven help you! I wouldn't want to be in your shoes.
        - id: ch03-b06
          speaker: gudbrand
          text: It could have gone much worse. Whether I did right or wrong, my goodwife is so kind that she never speaks against anything I do.
        - id: ch03-b07
          speaker: neighbour
          text: I hear you, but I don't believe a word of it.
        - id: ch03-b08
          speaker: gudbrand
          text: Then shall we bet on it? I have a hundred dollars at the bottom of my chest. Will you put up a hundred of your own?
        - id: ch03-b09
          speaker: narrator
          text: The neighbour agreed. Gudbrand stayed until evening, when darkness began to fall. Then the two men went to his house. The neighbour waited outside the door to listen while Gudbrand went in to meet his wife.
    - id: ch04
      title: What the Goodwife Said
      blocks:
        - id: ch04-b01
          speaker: gudbrand
          text: Good evening!
        - id: ch04-b02
          speaker: goodwife
          text: Good evening! Oh, is that you? Thank heaven you're home.
          emotion: happy
        - id: ch04-b03
          speaker: narrator
          text: It was indeed Gudbrand. His wife asked how things had gone in town.
        - id: ch04-b04
          speaker: gudbrand
          text: Only so-so. There's not much to boast about. No one in town would buy the cow, so I traded her for a horse.
        - id: ch04-b05
          speaker: goodwife
          text: A horse! How good of you. Thank you with all my heart! We're well-to-do enough to drive to church like other people. If we want a horse, we have every right to own one. Child, run out and put the horse away.
          emotion: happy
        - id: ch04-b06
          speaker: gudbrand
          text: Ah, but I don't have the horse now. Farther along the road, I traded it for a pig.
        - id: ch04-b07
          speaker: goodwife
          text: Just think! You did exactly what I would have done. A thousand thanks! Now I can serve bacon when people visit. What would we do with a horse? Folks would only say we'd grown too proud to walk to church. Child, run out and put the pig in the sty.
          emotion: happy
        - id: ch04-b08
          speaker: gudbrand
          text: I don't have the pig either. A little farther on, I traded it for a milking goat.
        - id: ch04-b09
          speaker: goodwife
          text: Bless us, how well you manage everything! Now that I think of it, what would I do with a pig? People would point at us and say, "There they go, eating up everything they own." A goat is far better. I'll have milk and cheese, and still keep the goat. Child, run out and put her away.
          emotion: happy
        - id: ch04-b10
          speaker: gudbrand
          text: No, I haven't got the goat either. Farther along, I traded it for a fine sheep.
        - id: ch04-b11
          speaker: goodwife
          text: You don't say! You do everything to please me, just as if I'd been beside you. What would we want with a goat? I'd lose half my time climbing the hills to fetch it down. A sheep will give us wool for clothes, and fresh meat too. Child, run out and put the sheep away.
          emotion: happy
        - id: ch04-b12
          speaker: gudbrand
          text: I don't have the sheep any more than the others. After another stretch of road, I traded it for a goose.
        - id: ch04-b13
          speaker: goodwife
          text: Thank you, thank you with all my heart! What would I do with a sheep? I have no spinning wheel or carding comb, and I don't want the trouble of cutting and sewing clothes. We can buy them as we always have. Now I'll have the roast goose I've wanted so often, and down for my little pillow as well. Child, run out and put the goose away.
          emotion: happy
        - id: ch04-b14
          speaker: gudbrand
          text: Ah, but I don't have the goose either. Farther on, I traded it for a cock.
        - id: ch04-b15
          speaker: goodwife
          text: Dear me, you think of everything, just as I would! A cock is as good as an eight-day clock. It crows at four every morning, so we'll be up and moving in good time. What would we do with a goose? I don't know how to cook one, and I can fill my pillow with cotton grass. Child, run out and put the cock away.
          emotion: happy
        - id: ch04-b16
          speaker: gudbrand
          text: But in the end, I didn't keep the cock. I went a little farther and grew as hungry as a hunter. I had to sell it for a shilling so I wouldn't starve.
        - id: ch04-b17
          speaker: goodwife
          text: Thank heaven you did! Whatever you do is always just what I would want. What would we do with a cock? We're our own masters. We can stay in bed as long as we like in the morning. I'm only thankful to have you home safely. You do everything so well that I need neither cock nor goose, neither pigs nor cows.
          emotion: happy
        - id: ch04-b18
          speaker: narrator
          text: Then Gudbrand opened the door to the neighbour waiting outside.
        - id: ch04-b19
          speaker: gudbrand
          text: Well, what do you say now? Have I won the hundred dollars?
        - id: ch04-b20
          speaker: narrator
          text: The neighbour had to admit that Gudbrand had won.
