  chapters:
    - id: ch01
      title: Gudbrand and His Goodwife
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Long ago, there lived a man named Gudbrand. His farm stood far, far away on a hillside, and that was why everyone called him Gudbrand on the Hill-side.
        - id: ch01-b02
          speaker: narrator
          text: Gudbrand and his goodwife were wonderfully happy together. They understood each other so well that she thought everything he did was the finest thing in the world. Whatever he turned his hand to, she was glad of it. They owned their farm, kept a hundred dollars at the bottom of a chest, and had two cows tied in a stall in the farmyard.
        - id: ch01-b03
          speaker: goodwife
          text: Dear, I think we ought to take one cow into town and sell her. Then we'd have some money ready to use, as well-to-do people should. We mustn't break into the hundred dollars in the chest, and we really don't need two cows. It would save work, too. I'd only have one cow to feed, bed down, and water instead of two.
        - id: ch01-b04
          speaker: narrator
          text: Gudbrand thought his wife had spoken good sense. He set out at once, leading the cow into town. But once he got there, not a single person would buy her.
        - id: ch01-b05
          speaker: gudbrand
          text: Well, never mind. The worst that can happen is that I take my cow home again. I have a stall and a tether for her, and the road home is no longer than the road here.
        - id: ch01-b06
          speaker: narrator
          text: So Gudbrand started home, toddling along with his cow.
    - id: ch02
      title: The Trades Along the Road
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: Before he had gone far, he met a man with a horse for sale. Gudbrand decided that a horse was better than a cow, so he traded with the man.
        - id: ch02-b02
          speaker: narrator
          text: A little farther along, he met a man driving a fat pig. A fat pig seemed better than a horse, so Gudbrand traded again. Then he met a man with a goat. A goat seemed better than a pig, and he made another trade.
        - id: ch02-b03
          speaker: narrator
          text: He walked on for a good while before meeting a man with a sheep. Gudbrand thought a sheep was better than a goat, so the sheep became his. Later, he met a man with a goose and gave the sheep in exchange for it.
        - id: ch02-b04
          speaker: narrator
          text: After a long, long walk, Gudbrand met a man carrying a cock.
        - id: ch02-b05
          speaker: gudbrand
          text: Surely a cock is better than a goose.
        - id: ch02-b06
          speaker: narrator
          text: So he traded the goose for the cock. By then the day was nearly over, and Gudbrand was terribly hungry. He sold the cock for a shilling and spent the money on food.
        - id: ch02-b07
          speaker: gudbrand
          text: Saving my life is always better than keeping a cock.
    - id: ch03
      title: A Wager at the Neighbour's House
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: Gudbrand kept walking toward home until he reached the house of his nearest neighbour. There he stopped in for a visit.
        - id: ch03-b02
          speaker: neighbour
          text: Well, how did you get on in town?
        - id: ch03-b03
          speaker: gudbrand
          text: So-so. I can't praise my luck, but I can't blame it either.
        - id: ch03-b04
          speaker: narrator
          text: Then Gudbrand told him the whole story, from beginning to end.
        - id: ch03-b05
          speaker: neighbour
          text: Oh, you'll get a fine scolding when your wife hears this. Heaven help you! I wouldn't want to be in your shoes.
        - id: ch03-b06
          speaker: gudbrand
          text: It could have gone much worse. Whether I did right or wrong, my goodwife is so kind that she never speaks against anything I do.
        - id: ch03-b07
          speaker: neighbour
          text: I hear you, but I don't believe a word of it.
        - id: ch03-b08
          speaker: gudbrand
          text: Then shall we bet on it? I have a hundred dollars at the bottom of my chest. Will you put up a hundred of your own?
        - id: ch03-b09
          speaker: narrator
          text: The neighbour agreed. Gudbrand stayed until evening, when darkness began to fall. Then the two men went to his house. The neighbour waited outside the door to listen while Gudbrand went in to meet his wife.
    - id: ch04
      title: What the Goodwife Said
      blocks:
        - id: ch04-b01
          speaker: gudbrand
          text: Good evening!
        - id: ch04-b02
          speaker: goodwife
          text: Good evening! Oh, is that you? Thank heaven you're home.
          emotion: happy
        - id: ch04-b03
          speaker: narrator
          text: Yes, it was Gudbrand. Once he was inside, his wife wanted to know how everything had gone for him in town.
        - id: ch04-b04
          speaker: gudbrand
          text: Oh, only so-so. There's not much to boast about. When I reached town, no one would buy the cow. So, you see, I traded her for a horse instead.
        - id: ch04-b05
          speaker: goodwife
          text: A horse! How good of you. Thank you with all my heart! We're well-to-do people, and people like us ought to be able to drive to church just as others do. And if we choose to keep a horse of our own, surely we have every right to get one. Child, run outside and put the horse safely away.
          emotion: happy
        - id: ch04-b06
          speaker: gudbrand
          text: Ah, but you see, I don't have the horse after all. When I'd gone a little farther along the road, I traded it for a pig.
        - id: ch04-b07
          speaker: goodwife
          text: Well, think of that! You did exactly what I would have done myself. A thousand thanks! Now I can keep a nice piece of bacon in the house and set it before people whenever they come to see me. What would we want with a horse anyway? People would only say we'd grown so proud that we couldn't even walk to church anymore. Child, run outside and settle the pig in the sty.
          emotion: happy
        - id: ch04-b08
          speaker: gudbrand
          text: But I don't have the pig either. When I'd gone a little farther, I traded it for a milking goat.
        - id: ch04-b09
          speaker: goodwife
          text: Bless us, how well you manage everything! Now that I think about it, what would I ever do with a pig? People would only point at us and say, "Look at those two. They're eating up everything they own." No, a goat is far better. I'll get both milk and cheese from her, and I'll still have the goat besides. Child, run outside and put the goat away.
          emotion: happy
        - id: ch04-b10
          speaker: gudbrand
          text: No, but I haven't got the goat either. A little farther down the road, I traded it and got a fine sheep instead.
        - id: ch04-b11
          speaker: goodwife
          text: You don't say! Why, you do everything to please me, just as if I'd been walking there beside you. What would we want with a goat? If I had one, I'd lose half my time climbing up the hills to find it and bring it down again. No, a sheep is much better. I'll have wool to make clothing, and we'll have fresh meat in the house too. Child, run outside and put the sheep safely away.
          emotion: happy
        - id: ch04-b12
          speaker: gudbrand
          text: But I don't have the sheep any more than I have the rest. After I'd gone another stretch along the road, I traded it for a goose.
        - id: ch04-b13
          speaker: goodwife
          text: Thank you, thank you with all my heart! What would I ever do with a sheep? I have no spinning wheel and no carding comb, so I couldn't even prepare the wool. And I certainly don't want all the worry and trouble of cutting cloth, shaping it, and sewing our clothes myself. We can go on buying clothes just as we always have. But now I'll have the roast goose I've longed for so often. Besides that, I'll have plenty of soft goose down to stuff into my little pillow. Child, run outside and put the goose safely away.
          emotion: happy
        - id: ch04-b14
          speaker: gudbrand
          text: Ah, but I don't have the goose either. When I'd gone a little farther along the road, I traded it for a cock.
        - id: ch04-b15
          speaker: goodwife
          text: Dear me, how you think of everything, just as I would have done myself! A cock, just imagine that! Why, having one is as good as owning an eight-day clock. It will crow at four o'clock every morning, and then we'll always be able to get up and start our work in good time. What would we do with a goose? I don't even know how to cook one properly. And as for my little pillow, I can easily fill that with soft cotton grass instead. Child, run outside and put the cock safely away.
          emotion: happy
        - id: ch04-b16
          speaker: gudbrand
          text: But after all, I haven't got the cock. When I'd gone a little farther, I became as hungry as a hunter. I was forced to sell the cock for a shilling because I was afraid I might starve.
        - id: ch04-b17
          speaker: goodwife
          text: Thank heaven you did! Whatever you do is always exactly what I would want. What would we ever do with the cock? We're our own masters, surely. We can lie in bed for as long as we like in the morning. I only thank heaven that I have you safely home again. You do everything so well that I want neither cock nor goose, neither pigs nor cows.
          emotion: happy
        - id: ch04-b18
          speaker: narrator
          text: At that, Gudbrand opened the door. His neighbour was still standing outside, and he had heard it all.
        - id: ch04-b19
          speaker: gudbrand
          text: Well then, what do you say now? Have I won the hundred dollars?
        - id: ch04-b20
          speaker: narrator
          text: There was nothing else the neighbour could say. He had to admit that Gudbrand had won the wager.
