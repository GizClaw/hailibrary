  chapters:
    - id: ch01
      title: The Warning
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Once upon a time, there were three sisters and one little brother. All three sisters were proud. One was very beautiful, and she disliked her brother because she thought he was dirty.
        - id: ch01-b02
          speaker: narrator
          text: When the beautiful sister was about to marry, her brother begged their mother to stop the wedding. He was certain the man would kill his sister, because he knew the man's house was full of bones. Their mother told her daughter exactly what the boy feared.
        - id: ch01-b03
          speaker: beautiful_sister
          text: I won't listen to a word from that dirty little scrub.
        - id: ch01-b04
          speaker: narrator
          text: She refused to believe him, and the wedding went ahead.
    - id: ch02
      title: The Comb by the Sea
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: The family agreed that one sister would stay with their mother, while the other would travel with the bride. So the husband and the two sisters set out together. At the beach, the husband picked up a beautiful tortoiseshell comb and gave it to his bride.
        - id: ch02-b02
          speaker: narrator
          text: They climbed into his boat and rowed over the sea. When they reached his home, there stood their little brother. The comb had turned into him. His sisters were astonished, but they were not glad to see him. The husband secretly decided to kill the boy without telling his wife.
        - id: ch02-b03
          speaker: narrator
          text: That night, the brother told the husband where his mother always made him sleep.
        - id: ch02-b04
          speaker: brother
          text: At home, Mother always puts me to bed in the blacksmith's shop.
        - id: ch02-b05
          speaker: narrator
          text: So the husband sent him to sleep in the smithy.
    - id: ch03
      title: The Boy Who Would Not Sleep
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: In the middle of the night, the man got up. He meant to kill them all, and went into the smithy to heat his irons. The boy sprang up the moment he entered.
        - id: ch03-b02
          speaker: husband
          text: Boy, what's wrong with you?
        - id: ch03-b03
          speaker: brother
          text: When I'm at home, Mother gives me two bags of gold to rest my head on.
        - id: ch03-b04
          speaker: narrator
          text: The man said the boy could have them. He fetched two bags of gold and told him to sleep. But the boy gave him a warning first.
        - id: ch03-b05
          speaker: brother
          text: Remember this. If you hear me snoring, I'm not asleep. When I stop snoring, then I'm asleep.
        - id: ch03-b06
          speaker: narrator
          text: The boy lay down and began to snore. While the sound went on, the man worked the bellows. The instant it stopped, he pulled his irons from the fire, and the boy leaped up again.
        - id: ch03-b07
          speaker: husband
          text: Why, what's the matter? Can't you sleep?
        - id: ch03-b08
          speaker: brother
          text: No. At home, Mother always gives me four bags of money to lie on.
        - id: ch03-b09
          speaker: narrator
          text: The man brought him four bags of money. Once more, the boy explained about his snoring. Once more, he lay down and snored while the man blew the bellows. As soon as the snoring ceased, the man drew out his irons. Up jumped the boy, and down dropped the irons.
        - id: ch03-b10
          speaker: husband
          text: Now what's wrong? Why can't you sleep?
        - id: ch03-b11
          speaker: brother
          text: At home, Mother always gives me two bushels of corn.
        - id: ch03-b12
          speaker: narrator
          text: The man brought the corn and ordered him back to sleep. Again the boy snored. Again the man pumped the bellows until the sound stopped, then took out his irons. The boy jumped up yet again.
        - id: ch03-b13
          speaker: husband
          text: What is it this time?
        - id: ch03-b14
          speaker: brother
          text: At home, Mother always goes to the river with a sieve and brings me water.
    - id: ch04
      title: The Escape
      blocks:
        - id: ch04-b01
          speaker: husband
          text: Very well, I'll go. But first I must speak to my cock.
        - id: ch04-b02
          speaker: narrator
          text: The man told the cock to crow if it saw anyone moving in the house. The cock promised, and the man left for the river.
        - id: ch04-b03
          speaker: narrator
          text: When the boy was sure the man had gone far enough, he rose and fed some corn to the cock. Then he woke his sisters and showed them all the bones in the house. The sisters were terrified.
        - id: ch04-b04
          speaker: narrator
          text: The boy lifted the two bags of gold onto his shoulders and told his sisters to follow. At the bay, he put them and the gold into the boat. Then he left them there and hurried back for the four bags of money.
        - id: ch04-b05
          speaker: narrator
          text: As he left the house, he emptied the bags of corn for the cock. The bird was so busy eating that it forgot to crow until the boat was far away.
    - id: ch05
      title: Home Again
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: When the man returned, the house was empty. He ran to the river and found that his boat was gone. He had no way to chase them.
        - id: ch05-b02
          speaker: narrator
          text: Back at their own shore, the boy turned the boat over and smashed it until it could never be used again. Then he took his sisters home and told their mother everything that had happened.
        - id: ch05-b03
          speaker: narrator
          text: From then on, his sisters loved him. They all lived happily together ever after, and they are living so still, if they are not dead.
