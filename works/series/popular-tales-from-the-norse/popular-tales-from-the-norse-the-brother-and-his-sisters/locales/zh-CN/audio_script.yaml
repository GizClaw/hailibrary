audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 从容而清醒，带一点克制的诙谐
        timbre: 温厚清晰
        pace: 舒缓有致
        pitch: 中低
    brother:
      display_name: 弟弟
      tts:
        delivery: 机灵坚定，遇到危险仍沉着应对
        timbre: 清亮稚嫩
        pace: 中等偏快
        pitch: 中高
    beautiful_sister:
      display_name: 漂亮姐姐
      tts:
        delivery: 骄傲任性，说话毫不客气
        timbre: 明亮而冷淡
        pace: 中等
        pitch: 中高
    husband:
      display_name: 姐夫
      tts:
        delivery: 表面随和，暗地阴狠，渐渐失去耐心
        timbre: 粗重低沉
        pace: 中等偏慢
        pitch: 低
  chapters:
    - id: ch01
      title: 不祥的婚事
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 从前，有三姐妹和一个弟弟。三个姐姐都很骄傲，其中最漂亮的那个尤其嫌弃弟弟，总说他身上脏。后来，她要出嫁了。弟弟却认定这门亲事万万不行。他知道新郎家里堆满白骨，便苦苦求母亲拦住姐姐，还说那个男人一定会杀了她。母亲把警告转告给女儿，女儿却根本不信。
        - id: ch01-b02
          speaker: beautiful_sister
          text: 那个脏兮兮的小邋遢鬼爱说什么就说什么，我才不听他的！
        - id: ch01-b03
          speaker: narrator
          text: 她还是嫁了过去。家里留下一个姐姐陪母亲，另一个姐姐则陪新娘上路。到了海滩，新郎捡到一把漂亮的玳瑁梳子，便送给新娘。他们乘船划过大海，来到新郎家中。可一进门，大家竟看见弟弟也在这里，谁也没有料到他会跟来。原来，那把梳子已经变成了他。姐姐们见了他很不高兴，丈夫也暗暗决定，要瞒着妻子杀死这个男孩。
        - id: ch01-b04
          speaker: narrator
          text: 到了晚上，弟弟说，自己在家从来都睡铁匠铺。男人听了，正好把他安排进自家的打铁铺。
    - id: ch02
      title: 打铁铺里的呼噜
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 半夜，男人悄悄起床。他想把他们全都杀掉，便走进打铁铺，准备那些要用的铁家伙。谁知他刚进去，弟弟马上跳了起来。
        - id: ch02-b02
          speaker: husband
          text: 小子，你怎么了？
        - id: ch02-b03
          speaker: brother
          text: 我在家睡觉，母亲总要拿两袋金子给我枕头。没有金子，我睡不着。
        - id: ch02-b04
          speaker: narrator
          text: 男人只好取来两袋金子，催他快睡。
        - id: ch02-b05
          speaker: brother
          text: 你要记清楚。听见我打呼噜，我其实还醒着。等呼噜声停了，我才是真的睡着。
        - id: ch02-b06
          speaker: narrator
          text: 弟弟躺下，很快响起了呼噜。男人听着呼噜声，只管拉风箱。声音一停，他立刻从火里取出烧红的铁家伙。可就在这时，弟弟又跳了起来。
        - id: ch02-b07
          speaker: husband
          text: 你到底怎么回事？怎么还睡不着？
        - id: ch02-b08
          speaker: brother
          text: 还是睡不着。我在家时，母亲总让我躺在四袋钱上面。
    - id: ch03
      title: 一次又一次
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 男人答应照办，又取来四袋钱。弟弟重新讲了一遍呼噜声的规矩，随后躺下打起呼噜。男人继续拉风箱。等四周安静下来，他又从火里拿出铁家伙，弟弟却再次跳起身。男人一惊，手里的东西都掉了。
        - id: ch03-b02
          speaker: husband
          text: 怎么又起来了？这回你为什么还是睡不着？
        - id: ch03-b03
          speaker: brother
          text: 在家睡觉，母亲还总要给我两蒲式耳谷子。
        - id: ch03-b04
          speaker: narrator
          text: 男人又答应了，把两蒲式耳谷子搬来，叫他赶紧睡。呼噜声又响起来，男人便接着拉风箱。声音刚停，他再次拿起铁家伙，弟弟也再次跳了起来。
        - id: ch03-b05
          speaker: husband
          text: 这一次又少了什么？
        - id: ch03-b06
          speaker: brother
          text: 我母亲每晚还要带一只筛子去河边，给我打水回来。
        - id: ch03-b07
          speaker: husband
          text: 好，我去就是了。不过临走之前，我得先吩咐那只公鸡。
        - id: ch03-b08
          speaker: narrator
          text: 男人命令公鸡，只要看见屋里有人走动，就马上打鸣。公鸡答应下来，男人这才带着筛子去了河边。
    - id: ch04
      title: 逃回家去
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 弟弟估摸男人已经走远，马上起来，抓些谷子喂公鸡。他叫醒两个姐姐，让她们看清屋里那累累白骨。姐姐们这才吓坏了。弟弟扛起两袋金子，叫她们赶快跟上。他把两个姐姐和金子送上停在海湾的船，让她们留在那里等着，自己又返回屋里，把四袋钱全都取了回来。
        - id: ch04-b02
          speaker: narrator
          text: 离开前，他把剩下的谷子全倒给公鸡。公鸡忙着啄食，早把打鸣的事忘在脑后。等它终于想起来，姐弟三人已经逃得远远的了。
        - id: ch04-b03
          speaker: narrator
          text: 男人回到家，屋里早已空无一人。他追到河边，发现自己的船也没了，只能眼看着他们逃走。
        - id: ch04-b04
          speaker: narrator
          text: 姐弟三人回到故乡。上岸以后，弟弟把船翻过来，砸得稀烂，再也不能使用。他带着姐姐们回到母亲身边，把整件事从头到尾讲了一遍。从此，姐姐们都疼爱这个弟弟，一家人永远快快乐乐地生活在一起。要是他们还没有死，如今想必仍是如此。
