audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 从容而清醒，带一点克制的诙谐
        timbre: 温厚清晰
        pace: 舒缓有致
        pitch: 中低
    grizzel:
      display_name: 格里泽尔
      tts:
        delivery: 执拗直率，嗓门洪亮，凡事非要问个明白
        timbre: 粗亮有力
        pace: 中等偏快
        pitch: 中高
    widower:
      display_name: 鳏夫
      tts:
        delivery: 不动声色，暗藏摆脱纠缠后的得意
        timbre: 平实偏低
        pace: 中等
        pitch: 中低
    thief_1:
      display_name: 小偷甲
      tts:
        delivery: 谨慎急躁，压低声音时十分紧张
        timbre: 干涩偏细
        pace: 快
        pitch: 中
    thief_2:
      display_name: 小偷乙
      tts:
        delivery: 胆小机警，遇险便慌忙催促
        timbre: 短促偏亮
        pace: 快
        pitch: 中高
    turnip_farmer:
      display_name: 芜菁地农夫
      tts:
        delivery: 乡野直率，害怕时慌不择言
        timbre: 结实洪亮
        pace: 中等偏快
        pitch: 中
    goodwife:
      display_name: 农妇
      tts:
        delivery: 务实利落，说话一针见血
        timbre: 清楚稳实
        pace: 中等
        pitch: 中
    maid:
      display_name: 牧师家的女佣
      tts:
        delivery: 恭敬周到
        timbre: 清亮柔和
        pace: 中等
        pitch: 中高
  chapters:
    - id: ch01
      title: 格里泽尔认不出自己
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 从前，有个鳏夫，家里雇着一位名叫格里泽尔的女管家。格里泽尔一心想嫁给他，天天从早缠到晚。鳏夫烦得走投无路，只盼能把她打发走。
        - id: ch01-b02
          speaker: narrator
          text: 割完干草、还没收庄稼的时候，两人有一天出门拔麻。格里泽尔一边干活，一边想着自己长得多漂亮，做事又多能干。成熟麻籽气味浓烈，熏得她头昏眼花，最后倒进麻田，沉沉睡着了。
        - id: ch01-b03
          speaker: narrator
          text: 鳏夫等的正是这个机会。他拿来一把剪刀，绕着格里泽尔，把她的裙摆齐齐剪短。接着，他又在她全身上下先抹牛油，再涂煤烟，连脸也不放过。等他停手时，格里泽尔已经比魔鬼本人还难看。她睡醒以后，低头看看衣裙，又摸摸自己的脸，竟连自己也认不出了。
        - id: ch01-b04
          speaker: grizzel
          text: 这会是我吗？不，不，绝不可能！我从来没有这么丑过。这一定就是魔鬼本人吧？
          emotion: surprised
        - id: ch01-b05
          speaker: narrator
          text: 她决定回去问个明白，于是敲响了主人的门。
        - id: ch01-b06
          speaker: grizzel
          text: 老爹，你们家的格里茜今天在家吗？
        - id: ch01-b07
          speaker: widower
          text: 在啊，在啊。我们的格里茜好端端地待在家里呢。
        - id: ch01-b08
          speaker: narrator
          text: 鳏夫巴不得就此摆脱她，当然不会说出真相。
        - id: ch01-b09
          speaker: grizzel
          text: 好吧，好吧！既然她在家，那我肯定不是格里泽尔。
        - id: ch01-b10
          speaker: narrator
          text: 她悄悄走了。要说谁最高兴，那自然是她的主人。
    - id: ch02
      title: 羊圈里的大嗓门
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 格里泽尔离开主人家，独自走了一阵，来到一片大森林，迎面遇上两个小偷。她一看便觉得这两人正合心意。既然自己是魔鬼，小偷当然最适合给魔鬼做伴。可那两个小偷想的恰恰相反。他们看见这个乌黑的怪物，还以为恶魔亲自来捉人，吓得转身就逃。
        - id: ch02-b02
          speaker: narrator
          text: 格里泽尔腿长脚快，没多久便追上了他们。
        - id: ch02-b03
          speaker: grizzel
          text: 你们若是去偷东西，就让我一起去吧。我能帮忙，这附近的路我全熟。
        - id: ch02-b04
          speaker: narrator
          text: 两个小偷一听，觉得她倒是个好帮手，总算不怕了。他们说正想偷一只羊，只是不知道哪里有羊可偷。
        - id: ch02-b05
          speaker: grizzel
          text: 这有什么难的？我从前在林子那边一户农家做过很久的女佣。就算夜里黑得伸手不见五指，我也找得到羊圈。
        - id: ch02-b06
          speaker: narrator
          text: 两个小偷听得喜出望外。三个人到了那户农家，商量好让小偷守在外面，格里泽尔进羊圈赶出一只羊，他们看见羊便一把捉住。羊圈偏偏紧靠着农夫睡觉的那间屋子。格里泽尔轻手轻脚，小心翼翼地爬了进去。可她才站稳，立刻朝外面扯开嗓门喊起来。
        - id: ch02-b07
          speaker: grizzel
          text: 你们要阉羊还是母羊？这里多得很，随便挑呀！
        - id: ch02-b08
          speakers: [thief_1, thief_2]
          ensemble: duo
          text: 嘘，嘘！只管挑一只又肥又壮的。
        - id: ch02-b09
          speaker: grizzel
          text: 好，好！可到底要阉羊还是母羊？阉羊还是母羊？这里多得很呀！
        - id: ch02-b10
          speakers: [thief_1, thief_2]
          ensemble: duo
          text: 小声点！肥壮的就行。阉羊母羊都一样！
        - id: ch02-b11
          speaker: grizzel
          text: 可你们还是没说，到底要阉羊还是母羊——阉羊还是母羊？
        - id: ch02-b12
          speakers: [thief_1, thief_2]
          ensemble: duo
          text: 闭嘴！随便抓一只肥羊，我们根本不在乎！
          emotion: angry
        - id: ch02-b13
          speaker: narrator
          text: 这阵吵闹惊醒了农夫。他只穿着衬衣便跑出来。小偷们拔腿就逃，格里泽尔紧追在后，还把农夫撞得四脚朝天。
        - id: ch02-b14
          speaker: grizzel
          text: 等等，小伙子们！等等呀！
        - id: ch02-b15
          speaker: narrator
          text: 农夫只看见一个乌黑的怪物，吓得几乎站不住，以为魔鬼钻进了羊圈。他急忙叫醒全家，人人坐下来读经祷告。因为他听说，这样就能把魔鬼赶走。
    - id: ch03
      title: 母鹅、公鹅和一屋食物
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 第二天夜里，小偷们又想偷一只肥鹅，仍叫格里泽尔带路。到了鹅圈，她进去赶鹅，他们留在外面接。格里泽尔熟悉这地方，小偷们以为这一次准能得手。可她才踏进圈里，响亮的问话便传了出来。
        - id: ch03-b02
          speaker: grizzel
          text: 你们要母鹅还是公鹅？这里可以随便挑呀！
        - id: ch03-b03
          speakers: [thief_1, thief_2]
          ensemble: duo
          text: 嘘！只选一只又肥又壮的。
        - id: ch03-b04
          speaker: grizzel
          text: 好，好！可你们要母鹅还是公鹅？母鹅还是公鹅？
        - id: ch03-b05
          speakers: [thief_1, thief_2]
          ensemble: duo
          text: 肥的就行，公母都一样。求你闭上嘴吧！
        - id: ch03-b06
          speaker: narrator
          text: 格里泽尔和两个小偷还在争，一只鹅先嘎嘎叫了，另一只也跟着叫。转眼间，满圈的鹅全都醒来，一边嘎嘎乱叫，一边嘶嘶怒鸣。农夫听见这阵喧闹，赶紧跑出来查看。小偷们一溜烟逃走，格里泽尔紧追在后。她原本就腿长，裙子又被剪得短短的，跑起来毫无牵绊。农夫只瞧见乌黑的身影飞快远去，又认定那是魔鬼。
        - id: ch03-b07
          speaker: grizzel
          text: 等一等，小伙子们！你们早说清楚要母鹅还是公鹅，不就好了吗？
        - id: ch03-b08
          speaker: narrator
          text: 小偷们哪里肯停。农夫则召来全家老小，一起读经祷告。对他们来说，那是魔鬼，绝不会有错。
        - id: ch03-b09
          speaker: narrator
          text: 第三天晚上，格里泽尔和两个小偷都饿得不知如何是好。他们商量以后，打算到森林边一户富农的储藏室偷些吃的。三个人虽然一起到了那里，小偷们却不敢亲自冒险，只让格里泽尔登上通往储藏室的台阶。她负责从里面把食物递出来，他们留在下面接。
        - id: ch03-b10
          speaker: narrator
          text: 格里泽尔进去一看，储藏室里样样都有，鲜肉、腌肉、香肠，还有燕麦饼。两个小偷压低声音，求她千万别再出声，只管随便扔些食物下来。他们还提醒她，这两个晚上大家一口东西没偷到，已经倒霉透顶。可格里泽尔听归听，还是非要问个清楚。
        - id: ch03-b11
          speaker: grizzel
          text: 你们要鲜肉、腌肉、香肠，还是燕麦饼？瞧瞧，这张燕麦饼多漂亮！喜欢什么就拿什么，这里多得很，随便挑呀！
        - id: ch03-b12
          speaker: narrator
          text: 她的声音几乎能震破人的脑袋。富农被吵醒，跑出来查看。小偷们撒腿便跑。富农还在望着他们，乌黑丑陋的格里泽尔忽然从台阶上冲了下来。
        - id: ch03-b13
          speaker: grizzel
          text: 等一等！等一等，小伙子们！喜欢什么就拿什么，这里多得很呀！
        - id: ch03-b14
          speaker: narrator
          text: 富农听说过邻居前两晚的遭遇，一看这个怪物，便以为魔鬼真的出来了。他开始读经祷告。没过多久，整个教区的人都跟着读经祷告，因为大家相信，念经能把魔鬼赶走。
    - id: ch04
      title: 芜菁地里的魔鬼
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 到了星期六晚上，两个小偷想偷一只肥公羊，留着星期日吃午饭。他们已经饿了好几天，确实该找点吃的。可这一次，说什么也不肯带格里泽尔。他们说，她那张嘴只会招来晦气。
        - id: ch04-b02
          speaker: narrator
          text: 星期日早晨，格里泽尔还在四处走动，等着小偷回来。她已经整整三天没有吃东西，饿得实在受不了，只好自己找吃的。她走进一片芜菁地，拔起地里的芜菁充饥。
        - id: ch04-b03
          speaker: narrator
          text: 地主人起床后心里不踏实，想去看看自己的芜菁。他穿上裤子，越过山脚下的沼泽。来到田边，他看见一个乌黑的东西在地里走来走去，还不断拔他的芜菁，马上断定那就是魔鬼。
        - id: ch04-b04
          speaker: narrator
          text: 农夫看清那团黑影以后，哪里还敢往前？他飞奔回家，告诉全家人，魔鬼正在芜菁地里拔芜菁。这个消息把一屋子人吓得魂不附体。大家商量了半天，认定眼下最好的办法，就是派人去请牧师，让牧师把魔鬼缚住。
        - id: ch04-b05
          speaker: goodwife
          text: 今天可是星期日早晨，你肯定请不来牧师。他要么还在床上，要么已经起床背讲道词了。
        - id: ch04-b06
          speaker: turnip_farmer
          text: 别担心。我答应送他一大块肥肥的牛犊腰肉，他一定马上就来。
        - id: ch04-b07
          speaker: narrator
          text: 农夫赶到牧师家，牧师果然还没起床。女佣请他先到客厅等候，自己跑上楼去通报。
        - id: ch04-b08
          speaker: maid
          text: 某某农夫正在楼下，想跟您说句话。
        - id: ch04-b09
          speaker: narrator
          text: 牧师一听来的是这样一位体面人，立刻下了床。他连衣服也没换，就穿着拖鞋、戴着睡帽下楼见客。农夫把来意从头说了一遍，告诉他魔鬼跑进了自家的芜菁地。只要牧师肯跟他去一趟，把那个魔鬼缚住，他一定送上一大块肥肥的牛犊腰肉作为酬谢。
        - id: ch04-b10
          speaker: narrator
          text: 牧师当然愿意。他叫马夫备鞍，自己准备穿衣服。
        - id: ch04-b11
          speaker: turnip_farmer
          text: 不，不，神父！魔鬼不会等我们太久。现在错过了，谁知道以后还能上哪儿找它？牧师大人就照现在这样，马上走吧。
    - id: ch05
      title: 沼泽中央
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 牧师只好跟农夫上路，脚上仍是拖鞋，头上仍戴着睡帽。两人走到沼泽边，地面湿得很，牧师穿着拖鞋根本过不去。农夫便把他背起来，小心地从一个草墩踏到另一个草墩。
        - id: ch05-b02
          speaker: narrator
          text: 走到沼泽中央，格里泽尔发现了他们。她以为两个小偷回来了，背上驮的正是他们答应去偷的公羊。
        - id: ch05-b03
          speaker: grizzel
          text: 肥不肥？肥不肥？
        - id: ch05-b04
          speaker: narrator
          text: 她这一喊，整座森林都响起了回声。
        - id: ch05-b05
          speaker: turnip_farmer
          text: 魔鬼才知道他是肥是瘦，我可不知道！你真想弄清楚，就自己过来看吧！
          emotion: fearful
        - id: ch05-b06
          speaker: narrator
          text: 农夫听见这话，顿时吓破了胆，猛地把牧师从背上掀了下去。牧师头朝下，直栽进湿软的泥沼，农夫自己却拔腿逃了。至于那位牧师，要是他还没爬出来，我猜，他如今仍躺在那里呢。
