audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: thoughtful and gently wry
        timbre: warm and clear
        pace: measured
        pitch: medium
    lion:
      display_name: Lion
      tts:
        delivery: confident and watchful
        timbre: deep and resonant
        pace: measured
        pitch: low
    goat:
      display_name: Goat
      tts:
        delivery: clever and composed
        timbre: warm and clear
        pace: steady
        pitch: medium
    baboon:
      display_name: Baboon
      tts:
        delivery: wary and quick-talking
        timbre: wiry and animated
        pace: lively
        pitch: medium-high
  chapters:
    - id: ch01
      title: Friends in the Wood
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: A Lion had a Goat for his wife. One day, Goat went to market. While she was away, Lion walked into the wood and met Baboon.
        - id: ch01-b02
          speaker: narrator
          text: Baboon was afraid Lion might eat him, so he quickly made friends and invited Lion home. But Lion saw a chance of his own. He invited Baboon to his house instead, to meet his little ones.
    - id: ch02
      title: The Little Goats
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: When they reached the house, Baboon looked at the children.
        - id: ch02-b02
          speaker: baboon
          text: Why, Lion, you have plenty of little goats here.
        - id: ch02-b03
          speaker: lion
          text: Yes. They are my children.
        - id: ch02-b04
          speaker: baboon
          text: If those are your children, they are still little goats. And little goats make very good meat.
        - id: ch02-b05
          speaker: lion
          text: Quiet now. Their mother will be home soon. Then we'll see.
        - id: ch02-b06
          speaker: narrator
          text: The little goats acted as though they had heard nothing. Then they went out to meet their mother and told her all that had happened.
        - id: ch02-b07
          speaker: goat
          text: Go back home and pay no attention to them. I'll be there soon, and I'll take care of Baboon.
    - id: ch03
      title: Baboon's Blood
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: Goat bought some molasses at the market and carried it home.
        - id: ch03-b02
          speaker: lion
          text: You're back. What news do you bring?
        - id: ch03-b03
          speaker: goat
          text: Oh, wonderful news. Here, taste this.
        - id: ch03-b04
          speaker: narrator
          text: Lion tasted the molasses.
        - id: ch03-b05
          speaker: lion
          text: This is very good. It tastes like honey.
        - id: ch03-b06
          speaker: goat
          text: That's baboon's blood. They killed a baboon today. Its blood is running down the street, and everyone is carrying some away.
        - id: ch03-b07
          speaker: lion
          text: Hush. There's a baboon right here in the house. We'll have him.
        - id: ch03-b08
          speaker: narrator
          text: The moment Baboon heard that, he rushed away. By the time Lion and Goat looked for him, he was gone. He never went near them again, and that is how the little goats were saved.
