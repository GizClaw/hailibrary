  chapters:
    - id: ch01
      title: The Christmas Bargain
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            Once, a long, long time ago, there were two brothers. One was rich, and the other was poor. On Christmas Eve, the poor brother had not one crumb of meat or bread in his house. So he went to the rich brother and asked, in God's name, for something with which to keep Christmas. The rich brother had helped him before, and he was not glad to see him again.
        - id: ch01-b02
          speaker: rich_brother
          text: If you'll do exactly what I tell you, I'll give you a whole side of bacon.
        - id: ch01-b03
          speaker: narrator
          text: The poor brother promised to do anything and thanked him heartily.
        - id: ch01-b04
          speaker: rich_brother
          text: Here's the bacon. Now go straight to Hell.
        - id: ch01-b05
          speaker: poor_brother
          text: I gave my word, so I must keep it.
        - id: ch01-b06
          speaker: narrator
          text: >-
            He took the bacon and set off. He walked all day. At dusk, he saw a place shining with a very bright light.
        - id: ch01-b07
          speaker: poor_brother
          text: Perhaps this is the place.
        - id: ch01-b08
          speaker: narrator
          text: >-
            He turned off the road. The first person he saw was a very old man with a long white beard. The old man stood in an outhouse, chopping wood for the Christmas fire.
        - id: ch01-b09
          speaker: poor_brother
          text: Good evening.
        - id: ch01-b10
          speaker: old_man
          text: Good evening to you. Where are you going so late?
        - id: ch01-b11
          speaker: poor_brother
          text: I'm going to Hell, if only I can find the way.
        - id: ch01-b12
          speaker: old_man
          text: >-
            Then you're nearly there, because this is Hell. Once you go inside, everyone will want to buy your bacon. Meat is scarce down there. But don't sell it for anything except the hand mill behind the door. When you come out, I'll show you how to use it. That mill can grind almost anything.
        - id: ch01-b13
          speaker: narrator
          text: >-
            The poor brother thanked him for the advice, went to the Devil's door, and gave it a mighty knock.
    - id: ch02
      title: The Hand Mill
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            Inside, everything happened just as the old man had said. Devils large and small swarmed around the poor brother like ants around an anthill. Every one of them tried to offer more than the others for his bacon.
        - id: ch02-b02
          speaker: poor_brother
          text: >-
            My old wife and I ought to eat this bacon for our Christmas dinner. Still, you all want it so badly that I suppose I'll have to give it up. But I'll make only one bargain. In return, I want that hand mill behind the door.
        - id: ch02-b03
          speaker: narrator
          text: >-
            At first, the Devil would not even consider the bargain. He argued over the price and tried every way he could to make the poor brother accept something else. But the man stood by what he had said. At last, the Devil had to give up the hand mill.
        - id: ch02-b04
          speaker: narrator
          text: >-
            Out in the yard, the poor brother asked the old woodcutter to show him how the mill worked. Once he had learned, he thanked the old man and hurried home. Even so, the clock had struck twelve on Christmas Eve before he reached his door.
        - id: ch02-b05
          speaker: poor_brothers_wife
          text: >-
            Where in the world have you been? I've sat here for hours, waiting and watching. We haven't even two sticks to put together under the Christmas porridge.
        - id: ch02-b06
          speaker: poor_brother
          text: >-
            I couldn't come home sooner. First I had to go a long way for one thing, and then for another. But now, just wait and see.
        - id: ch02-b07
          speaker: narrator
          text: >-
            He set the mill on the table. First, he told it to grind out lights. Then came a tablecloth, meat, ale, and one good Christmas dish after another, until they had everything they could wish for. He only had to name a thing, and the mill ground it out. His wife watched in wonder, blessing her good fortune. Again and again she asked where he had found such a marvelous mill, but he would not tell her.
        - id: ch02-b08
          speaker: poor_brother
          text: >-
            It doesn't matter where I got it. You can see it's a good mill, and its millstream never freezes. That's enough.
        - id: ch02-b09
          speaker: narrator
          text: >-
            He ground enough meat, drink, and treats to last until Twelfth Day. On the third day, he invited all his friends and relatives to a great feast.
    - id: ch03
      title: Herrings and Broth
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            When the rich brother saw the feast on the table and all the food stored away, he became wild with spite. He could not bear to see his brother own anything.
        - id: ch03-b02
          speaker: rich_brother
          text: >-
            On Christmas Eve, he was so desperate that he came begging me for a bite of food in God's name. Now look at him! He's feasting like a count or a king.
        - id: ch03-b03
          speaker: narrator
          text: Then he turned on his brother.
        - id: ch03-b04
          speaker: rich_brother
          text: Where in Hell's name did you get all this wealth?
        - id: ch03-b05
          speaker: poor_brother
          text: From behind the door.
        - id: ch03-b06
          speaker: narrator
          text: >-
            The owner of the mill did not want to reveal his secret. But later that evening, after drinking a little too much, he could hide it no longer. He brought out the mill.
        - id: ch03-b07
          speaker: poor_brother
          text: There. This is what made me rich.
        - id: ch03-b08
          speaker: narrator
          text: >-
            He made the mill grind one thing after another. The rich brother saw it work and set his heart on owning it. After a great deal of coaxing, he bought it for three hundred dollars. But as part of the bargain, the poor brother could keep it until the hay harvest. He meant to use those months to grind enough meat and drink to last for years. So the mill never had a chance to grow rusty. When haymaking time came, the rich brother took it home. The poor brother made sure not to teach him how to use it.
        - id: ch03-b09
          speaker: narrator
          text: >-
            The mill arrived at the rich brother's house in the evening. The next morning, he sent his wife to toss hay in the field while the mowers cut the grass. He said he would stay home and prepare dinner. As noon drew near, he put the mill on the kitchen table.
        - id: ch03-b10
          speaker: rich_brother
          text: Grind herrings and broth. Grind them well, and grind them fast.
        - id: ch03-b11
          speaker: narrator
          text: >-
            The mill began to grind. Herrings and broth filled every dish, then every tub, and then spread across the kitchen floor. The rich brother twisted and turned the mill, trying to stop it. Nothing worked. Still it ground on. Soon the broth rose so high that he was nearly drowned.
        - id: ch03-b12
          speaker: narrator
          text: >-
            He flung open the kitchen door and escaped into the parlor, but the flood followed him. Before long, that room was full too. Getting through the stream to the latch of the outside door nearly cost him his life. At last, he pulled the door open and ran down the road. Behind him came a stream of herrings and broth, roaring like a waterfall as it swept over the whole farm.
        - id: ch03-b13
          speaker: narrator
          text: >-
            Out in the field, his wife had been tossing hay. Dinner seemed very late.
        - id: ch03-b14
          speaker: rich_brothers_wife
          text: >-
            The master hasn't called us home, but we may as well go. Perhaps he's having trouble boiling the broth and would be glad of my help.
        - id: ch03-b15
          speaker: narrator
          text: >-
            The men agreed, and they all strolled toward home. They had gone only a little way up the hill when they met herrings, broth, and bread, all rushing and splashing together in a stream. The master ran ahead of it for his life. As he passed them, he shouted.
        - id: ch03-b16
          speaker: rich_brother
          text: >-
            I wish every one of you had a hundred throats! But watch yourselves, or you'll drown in the broth!
        - id: ch03-b17
          speaker: narrator
          text: >-
            He raced to his brother's house as if the Evil One were chasing him. There he begged his brother, in God's name, to take back the mill at once.
        - id: ch03-b18
          speaker: rich_brother
          text: If it grinds for one more hour, herrings and broth will swallow the whole parish!
          emotion: fearful
        - id: ch03-b19
          speaker: narrator
          text: >-
            The poor brother refused to take it back until the rich brother paid him another three hundred dollars.
    - id: ch04
      title: The Golden House
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            So the poor brother recovered both the mill and the money. Before long, he built a farmhouse much finer than his brother's. The mill ground so much gold that he covered the house with golden plates. The farm stood beside the sea, and the golden house gleamed far out over the water.
        - id: ch04-b02
          speaker: narrator
          text: >-
            Sailors could see the golden house shining from far out at sea. Everyone who passed that way came ashore to see the rich man who lived there and to look at his wonderful mill. Word of it traveled farther and farther, until there was no one who had not heard the story of what it could do.
        - id: ch04-b03
          speaker: narrator
          text: One day, a skipper came to see the mill. His first question was whether it could grind salt.
        - id: ch04-b04
          speaker: poor_brother
          text: Salt? Of course it can grind salt. It can grind anything.
        - id: ch04-b05
          speaker: narrator
          text: >-
            At once, the skipper decided he must own the mill, whatever it cost. With a mill like that, he thought he could be free of his long voyages over stormy seas to fetch cargoes of salt. At first, the owner would not hear of selling it. But the skipper begged and pleaded so earnestly that at last he gave in. The skipper had to pay many, many thousands of dollars.
        - id: ch04-b06
          speaker: narrator
          text: >-
            The skipper hoisted the mill onto his back and hurried away with it. He was afraid the owner might change his mind and call him back. Because of that, he never stopped to ask how the mill worked or how to make it stop. He boarded his ship as quickly as he could, cast off, and sailed away.
    - id: ch05
      title: Why the Sea Is Salt
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: >-
            When the ship was well out at sea, the skipper brought the mill onto the deck.
        - id: ch05-b02
          speaker: skipper
          text: Grind salt. Grind it well, and grind it fast.
        - id: ch05-b03
          speaker: narrator
          text: >-
            The mill began to grind, and salt poured from it like water. Soon the ship was full. The skipper wanted the mill to stop, but no matter which way he turned it or how hard he tried, nothing helped. The mill kept grinding. The heap of salt climbed higher and higher, until at last the ship sank.
        - id: ch05-b04
          speaker: narrator
          text: >-
            The mill still lies at the bottom of the sea, grinding away to this very day.
        - id: ch05-b05
          speaker: narrator
          text: And that is why the sea is salt.
