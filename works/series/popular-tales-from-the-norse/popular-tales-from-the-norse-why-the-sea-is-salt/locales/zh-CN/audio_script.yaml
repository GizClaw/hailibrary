audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 从容而清醒，带一点克制的诙谐
        timbre: 温厚清晰
        pace: 舒缓有致
        pitch: 中低
    poor_brother:
      display_name: 穷兄弟
      tts:
        delivery: 朴实守信，困顿中仍有机敏
        timbre: 温和略粗
        pace: 中等
        pitch: 中低
    rich_brother:
      display_name: 富兄弟
      tts:
        delivery: 刻薄贪婪，得意时张扬，慌乱时急促
        timbre: 尖硬有力
        pace: 稍快
        pitch: 中
    old_man:
      display_name: 白胡子老人
      tts:
        delivery: 沉稳神秘，指点时清楚直接
        timbre: 苍老低沉
        pace: 缓慢
        pitch: 低
    poor_brothers_wife:
      display_name: 穷兄弟的妻子
      tts:
        delivery: 直率操心，惊奇时仍朴实自然
        timbre: 成熟温暖
        pace: 中等
        pitch: 中
    rich_brothers_wife:
      display_name: 富兄弟的妻子
      tts:
        delivery: 务实爽快，带一点不紧不慢的调侃
        timbre: 明亮结实
        pace: 中等
        pitch: 中
    skipper:
      display_name: 船长
      tts:
        delivery: 果断急切，带着常年行船人的粗豪
        timbre: 洪亮粗粝
        pace: 稍快
        pitch: 中低
  chapters:
    - id: ch01
      title: 下地狱去
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 从前，很久很久以前，有兄弟二人，一个富，一个穷。圣诞节前夜，穷兄弟家里连一点肉屑和一小块面包都没有。他只好去求哥哥，看在上帝的分上，给点东西让他过节。这已经不是哥哥头一回接济他了。哥哥见他上门，当然没什么好脸色，不过还是开出了条件。
        - id: ch01-b02
          speaker: rich_brother
          text: 你照我的吩咐办，我就给你整整一大块熏肉。
        - id: ch01-b03
          speaker: narrator
          text: 穷兄弟满口答应，还一个劲儿道谢。
        - id: ch01-b04
          speaker: rich_brother
          text: 行，熏肉拿去。现在径直下地狱吧。
        - id: ch01-b05
          speaker: poor_brother
          text: 我答应了，就一定得办到。
        - id: ch01-b06
          speaker: narrator
          text: 他把那一大块熏肉扛在身上，就这样上了路。他走了整整一天。等黄昏降临，终于来到一处地方，看见前方亮着一片灿烂的火光。
        - id: ch01-b07
          speaker: poor_brother
          text: 说不定就是这儿。
        - id: ch01-b08
          speaker: narrator
          text: 他拐到一旁，看见一位老得不能再老的老人。老人拖着长长的白胡子，正在外屋里劈柴，预备生起圣诞节的炉火。
        - id: ch01-b09
          speaker: poor_brother
          text: 晚上好。
        - id: ch01-b10
          speaker: old_man
          text: 你也晚上好。这么晚了，你上哪儿去？
        - id: ch01-b11
          speaker: poor_brother
          text: 唉，我要下地狱，可我不知道路怎么走。
        - id: ch01-b12
          speaker: old_man
          text: 那你没走错多远，这里就是地狱。进去以后，里面的家伙准会争着买你的熏肉，地狱里可缺肉了。记住，除非他们拿门后那盘手磨来换，不然绝不能卖。等你出来，我教你怎么使它。那盘磨差不多什么都磨得出来。
        - id: ch01-b13
          speaker: narrator
          text: 穷兄弟听完这番指点，连忙向老人道谢。随后，他扛着熏肉走到魔鬼门前，砰砰砰地用力敲响了门。
    - id: ch02
      title: 神奇的手磨
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 门里的情形，果然全让老人说中了。大大小小的魔鬼像蚂蚁围住蚁丘，一窝蜂涌上来，争着抬价买熏肉。
        - id: ch02-b02
          speaker: poor_brother
          text: 按说，我和家里的老太婆该留着这块肉做圣诞晚餐。既然你们这么想要，我只好让出来。不过我不要别的，只要那边门后的手磨。
        - id: ch02-b03
          speaker: narrator
          text: 魔鬼起初连这样的买卖都不肯听，只管跟他讨价还价。穷兄弟却守住自己说过的话，一句也不松口。到头来，魔鬼只得交出手磨。穷兄弟来到院里，请那位劈柴老人教他怎样使它。学会以后，他再次道谢，急急忙忙往家赶。可等他赶到自家门前时，圣诞夜的钟声还是已经敲过十二下了。
        - id: ch02-b04
          speaker: poor_brothers_wife
          text: 你到底跑到哪儿去了？我一小时又一小时地坐在这儿等，灶下连两根煮圣诞粥的柴火都没有！
        - id: ch02-b05
          speaker: poor_brother
          text: 我实在没法早回来。先得走好远办这件事，接着又要办那件事。不过现在，你等着瞧吧。
        - id: ch02-b06
          speaker: narrator
          text: 他把手磨放上桌，先让它磨出灯火，又让它磨出桌布，接着是肉、麦酒，还有各种过圣诞节的好吃食。只要开口吩咐，想要什么，手磨就磨出什么。妻子站在旁边，看得又惊又喜，只觉得老天待她不薄。她一遍又一遍追问，这样神奇的手磨究竟从哪儿来，可丈夫就是不肯说。
        - id: ch02-b07
          speaker: poor_brother
          text: 从哪儿来的都一样。你看，它好用得很，带动它的溪水也永远不会结冰。知道这些就够啦。
        - id: ch02-b08
          speaker: narrator
          text: 他又磨出足够吃到主显节的肉、酒和美食。第三天，他请来所有亲朋好友，摆下盛宴。富兄弟看见满桌佳肴，又看见贮藏室里的存货，嫉妒得发了狂。他最受不了的，就是弟弟有了好东西。
        - id: ch02-b09
          speaker: rich_brother
          text: 圣诞节前夜，他还穷得走投无路，看在上帝的分上求我给一口吃的。现在倒摆起宴席，弄得自己像伯爵、国王一样。见鬼，你到底从哪儿得来这么多财物？
        - id: ch02-b10
          speaker: poor_brother
          text: 我是从门后面得来的。
        - id: ch02-b11
          speaker: narrator
          text: 穷兄弟不想泄露秘密。可是那晚他多喝了几口，终于守不住话，搬出了手磨。
        - id: ch02-b12
          speaker: poor_brother
          text: 喏，你看，让我发这笔财的就是它。
        - id: ch02-b13
          speaker: narrator
          text: 他当着哥哥的面，让手磨磨出各式各样的东西。哥哥看过以后，铁了心要把它弄到手。费尽口舌央求，他终于如愿，却得付三百块钱，而且要等到割干草时才能拿走。弟弟心想，要是把磨留到那时候，就能叫它磨出足够吃好几年的肉和酒。所以在交出去以前，手磨一直忙个不停，根本没有闲着生锈。割草季一到，哥哥拿走了手磨，弟弟却特意没教他怎样使它。
    - id: ch03
      title: 鲱鱼和肉汤
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 富兄弟傍晚把手磨搬回家。第二天早晨，他让妻子去草场翻晒干草，自己留在家里预备午饭。快到饭点时，他把手磨放在厨房桌上。
        - id: ch03-b02
          speaker: rich_brother
          text: 给我磨鲱鱼和肉汤，又快又好地磨！
        - id: ch03-b03
          speaker: narrator
          text: 手磨马上动了起来，不停地磨出鲱鱼和肉汤。先把所有盘子都装满，又把所有木桶装满，接着连厨房地板也全盖住了。富兄弟对着手磨又扭又转，手指不停摆弄，可不管怎么试，手磨都停不下来。肉汤很快越涨越高，眼看就要淹死他了。他推开厨房门，赶紧冲进客厅。没过多久，客厅也灌满了。他冒着生命危险，隔着滚滚的肉汤才摸到大门门闩。等门终于打开，他冲上大路拼命逃走。鲱鱼和肉汤汇成一股洪流，紧追在他身后，像瀑布一样轰隆隆地漫过整座农庄。
        - id: ch03-b04
          speaker: narrator
          text: 草场上，妻子等午饭等了很久，终于开口了。
        - id: ch03-b05
          speaker: rich_brothers_wife
          text: 主人没叫，我们也该回去了。也许他煮肉汤觉得费劲，正想让我去帮忙呢。
        - id: ch03-b06
          speaker: narrator
          text: 割草人都很乐意，便慢悠悠往家走。才走到半山坡，他们就迎面撞见鲱鱼、肉汤和面包混成的洪流，奔腾翻滚，四处飞溅。主人正在前面拼命逃。他从大家身边冲过去，扯开嗓子喊道：
        - id: ch03-b07
          speaker: rich_brother
          text: 但愿老天让你们每个人都长出一百张嘴！当心啊，别淹死在肉汤里！
        - id: ch03-b08
          speaker: narrator
          text: 他仿佛有恶魔追着脚后跟，一路奔到弟弟家，看在上帝的分上苦苦哀求，要弟弟立刻收回手磨。
        - id: ch03-b09
          speaker: rich_brother
          text: 它再磨一个钟头，整个教区都要让鲱鱼和肉汤吞掉了！
          emotion: fearful
        - id: ch03-b10
          speaker: narrator
          text: 弟弟却说，哥哥得当场再付三百块钱，他才肯收。于是穷兄弟既拿回手磨，又得了钱。
    - id: ch04
      title: 海边的金屋
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 没过多久，穷兄弟就盖起一座农庄，比哥哥住的漂亮得多。他让手磨磨出许多金子，把整座房子都贴上金片。农庄就在海边，金屋闪闪发亮，光芒越过海面，离得很远都能看见。凡是从附近驶过的船只，都要靠岸停一停。船上的人既想看看金屋里的富翁，也想亲眼瞧瞧那盘神奇的手磨。手磨的名声就这样越传越远，到后来，已经没人没听说过它了。
        - id: ch04-b02
          speaker: narrator
          text: 有一天，一位船长来看手磨。他一开口就问，这东西能不能磨出盐。
        - id: ch04-b03
          speaker: poor_brother
          text: 磨盐？当然能。它什么都磨得出来。
        - id: ch04-b04
          speaker: narrator
          text: 船长一听，立刻说无论花多少钱，他都非买下手磨不可。他心里盘算着，只要有了它，以后就再也不用冒着风浪，横渡遥远的大海去运盐了。主人起先连卖都不肯卖。可船长一遍遍苦苦央求，他最后只好答应。为了这盘手磨，船长付出了成千上万块钱。
        - id: ch04-b05
          speaker: narrator
          text: 船长把手磨往背上一扛，生怕主人改变主意，转身就急匆匆地走了。他连该怎样使手磨都没有工夫问，一路赶到船边，飞快登船，随即扬帆出海。
    - id: ch05
      title: 海水为什么是咸的
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 船驶出很远以后，船长把手磨搬到甲板上。
        - id: ch05-b02
          speaker: skipper
          text: 给我磨出盐来，又快又好地磨！
        - id: ch05-b03
          speaker: narrator
          text: 白花花的盐立刻像水一样往外倾泻。整条船装满以后，船长想让手磨停下来。可不管往哪个方向扭，也不管怎么摆弄，都没有用。手磨只管磨个不停，盐堆越积越高。最后，船沉进了海里。
        - id: ch05-b04
          speaker: narrator
          text: 那盘手磨至今还躺在海底，一刻不停地磨着。这就是海水为什么是咸的。
