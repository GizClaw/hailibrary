audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: thoughtful and gently wry
        timbre: warm and clear
        pace: measured
        pitch: medium
    hen:
      display_name: Henny-Penny
      tts:
        delivery: earnest and quick-thinking
        timbre: bright and clear
        pace: lively
        pitch: medium-high
    cock:
      display_name: Cocky-Locky
      tts:
        delivery: friendly and trusting
        timbre: crisp and resonant
        pace: moderate
        pitch: medium
    duck:
      display_name: Ducky-Lucky
      tts:
        delivery: curious and agreeable
        timbre: rounded and reedy
        pace: moderate
        pitch: medium
    goose:
      display_name: Goosey-Poosey
      tts:
        delivery: sociable and direct
        timbre: full and slightly nasal
        pace: measured
        pitch: medium-low
    fox:
      display_name: Foxy-Cocksy
      tts:
        delivery: smooth and slyly persuasive
        timbre: soft and dusky
        pace: unhurried
        pitch: medium-low
  chapters:
    - id: ch01
      title: The Dream in the Oak Tree
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Once upon a time, a Hen flew up into an oak tree and settled there for the night. While she slept, she dreamed that the world would come to an end unless she reached the Dovrefell. The moment she woke, she jumped down from the tree and started on her way. Before she had gone far, she met a Cock.
        - id: ch01-b02
          speaker: hen
          text: Good morning, Cocky-Locky.
        - id: ch01-b03
          speaker: cock
          text: Good morning, Henny-Penny. Where are you going so early?
        - id: ch01-b04
          speaker: hen
          text: I'm on my way to the Dovrefell, so the world won't come to an end.
        - id: ch01-b05
          speaker: cock
          text: Who told you that, Henny-Penny?
        - id: ch01-b06
          speaker: hen
          text: I dreamed it last night while I was sitting in the oak tree.
        - id: ch01-b07
          speaker: cock
          text: Then I'll come with you.
        - id: ch01-b08
          speaker: narrator
          text: The Hen and the Cock walked on together. After a good while, they met a Duck.
        - id: ch01-b09
          speaker: cock
          text: Good morning, Ducky-Lucky.
        - id: ch01-b10
          speaker: duck
          text: Good morning, Cocky-Locky. Where are you two going so early?
        - id: ch01-b11
          speaker: cock
          text: I'm going to the Dovrefell, so the world won't come to an end.
        - id: ch01-b12
          speaker: duck
          text: And who told you that, Cocky-Locky?
        - id: ch01-b13
          speaker: cock
          text: Henny-Penny told me.
        - id: ch01-b14
          speaker: duck
          text: Then who told you, Henny-Penny?
        - id: ch01-b15
          speaker: hen
          text: I dreamed it last night while I was sitting in the oak tree.
        - id: ch01-b16
          speaker: duck
          text: I'll come along too.
        - id: ch01-b17
          speaker: narrator
          text: So the three of them set off together. A little farther along, they met a Goose.
        - id: ch01-b18
          speaker: duck
          text: Good morning, Goosey-Poosey.
        - id: ch01-b19
          speaker: goose
          text: Good morning, Ducky-Lucky. Where are all of you going so early?
        - id: ch01-b20
          speaker: duck
          text: I'm going to the Dovrefell, so the world won't come to an end.
        - id: ch01-b21
          speaker: goose
          text: Who told you that, Ducky-Lucky?
        - id: ch01-b22
          speaker: duck
          text: Cocky-Locky did.
        - id: ch01-b23
          speaker: goose
          text: And who told you, Cocky-Locky?
        - id: ch01-b24
          speaker: cock
          text: Henny-Penny did.
        - id: ch01-b25
          speaker: goose
          text: Henny-Penny, how do you know it's true?
        - id: ch01-b26
          speaker: hen
          text: I dreamed it last night while I was sitting in the oak tree, Goosey-Poosey.
        - id: ch01-b27
          speaker: goose
          text: Then I'll come with you.
    - id: ch02
      title: Foxy-Cocksy's Invitation
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: They all went on together. After they had walked for a while, a Fox came toward them.
        - id: ch02-b02
          speaker: goose
          text: Good morning, Foxy-Cocksy.
        - id: ch02-b03
          speaker: fox
          text: Good morning, Goosey-Poosey.
        - id: ch02-b04
          speaker: goose
          text: Where are you going, Foxy-Cocksy?
        - id: ch02-b05
          speaker: fox
          text: Where are you going yourself, Goosey-Poosey?
        - id: ch02-b06
          speaker: goose
          text: I'm going to the Dovrefell, so the world won't come to an end.
        - id: ch02-b07
          speaker: fox
          text: Who told you that, Goosey-Poosey?
        - id: ch02-b08
          speaker: goose
          text: Ducky-Lucky told me.
        - id: ch02-b09
          speaker: fox
          text: Who told you, Ducky-Lucky?
        - id: ch02-b10
          speaker: duck
          text: Cocky-Locky did.
        - id: ch02-b11
          speaker: fox
          text: And who told you, Cocky-Locky?
        - id: ch02-b12
          speaker: cock
          text: Henny-Penny did.
        - id: ch02-b13
          speaker: fox
          text: Henny-Penny, how do you know?
        - id: ch02-b14
          speaker: hen
          text: Last night, I dreamed that the world would come to an end if we didn't reach the Dovrefell. I was sitting in the oak tree when I dreamed it.
        - id: ch02-b15
          speaker: fox
          text: What nonsense! The world won't end just because you don't go there. Come home with me instead. My den is warm, and we'll have a fine time there.
        - id: ch02-b16
          speaker: narrator
          text: So the Hen, the Cock, the Duck, and the Goose followed the Fox home to his den. Once they were inside, the Fox piled plenty of fuel on the fire. Before long, every one of his guests began to feel very sleepy.
    - id: ch03
      title: A Nasty Smell
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: The Duck and the Goose made themselves comfortable in a corner. The Cock and the Hen flew up and perched on a post. Soon the Duck and the Goose were fast asleep. Then the Fox picked up the Goose, laid him on the glowing embers, and roasted him.
        - id: ch03-b02
          speaker: narrator
          text: The strong smell of roast meat reached the Hen. Still half asleep, she sprang up to a higher peg.
        - id: ch03-b03
          speaker: hen
          text: Faugh, what a nasty smell! What a nasty smell!
          emotion: disgusted
        - id: ch03-b04
          speaker: fox
          text: Oh, that's nothing. The smoke is only blowing back down the chimney. Go to sleep again, and don't say another word.
        - id: ch03-b05
          speaker: narrator
          text: The Hen settled down and fell asleep once more.
    - id: ch04
      title: Out Through the Chimney
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: The Fox had scarcely swallowed the Goose when he did the very same thing to the Duck. He laid the Duck on the embers and roasted him for another tasty bite. The Hen woke again and jumped to a still higher peg.
        - id: ch04-b02
          speaker: hen
          text: Faugh, what a nasty smell! What a nasty smell!
          emotion: disgusted
        - id: ch04-b03
          speaker: narrator
          text: This time, the Hen opened her eyes properly. She saw that the Fox had eaten both the Goose and the Duck. At once, she flew to the highest peg and peeped out through the chimney.
        - id: ch04-b04
          speaker: hen
          text: Well, well! Look at all those lovely geese flying over there!
        - id: ch04-b05
          speaker: narrator
          text: Reynard ran outside to catch himself a fat goose for roasting. While he was gone, the Hen woke the Cock and told him what had happened to Goosey-Poosey and Ducky-Lucky. Then Cocky-Locky and Henny-Penny flew out through the chimney.
        - id: ch04-b06
          speaker: narrator
          text: And if they never reached the Dovrefell, then surely the whole world must have come to an end.
