audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 从容而清醒，带一点克制的诙谐
        timbre: 温厚清晰
        pace: 舒缓有致
        pitch: 中低
    hen:
      display_name: 佩妮母鸡
      tts:
        delivery: 认真热心，遇到危险时机敏果断
        timbre: 明亮轻柔
        pace: 中等偏快
        pitch: 中高
    cock:
      display_name: 洛基公鸡
      tts:
        delivery: 爽快直率，带着乡野动物的质朴
        timbre: 清亮有力
        pace: 中等
        pitch: 中
    duck:
      display_name: 拉基鸭子
      tts:
        delivery: 好奇随和，说话干脆
        timbre: 圆润清脆
        pace: 中等
        pitch: 中
    goose:
      display_name: 波西大鹅
      tts:
        delivery: 热情爽朗，问话时一本正经
        timbre: 宽厚响亮
        pace: 中等偏慢
        pitch: 中低
    fox:
      display_name: 科克西狐狸
      tts:
        delivery: 狡猾圆滑，哄骗时故作亲切
        timbre: 低沉柔滑
        pace: 舒缓
        pitch: 中低
  chapters:
    - id: ch01
      title: 橡树上的梦
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 从前，有只母鸡飞到橡树上，在枝头过夜。那天夜里，她做了一个梦。梦里说，除非她赶到多夫勒山，否则世界就会毁灭。母鸡醒来，立刻跳下树，踏上了路。走了一阵，她碰见一只公鸡。
        - id: ch01-b02
          speaker: hen
          text: 早安，洛基公鸡。
        - id: ch01-b03
          speaker: cock
          text: 早安，佩妮母鸡。天还这么早，你要去哪儿？
        - id: ch01-b04
          speaker: hen
          text: 我要去多夫勒山，这样世界才不会毁灭。
        - id: ch01-b05
          speaker: cock
          text: 佩妮母鸡，这件事是谁告诉你的？
        - id: ch01-b06
          speaker: hen
          text: 昨晚我待在橡树上，梦见了这件事。
        - id: ch01-b07
          speaker: cock
          text: 那我也和你一起去。
        - id: ch01-b08
          speaker: narrator
          text: 好啦，他们结伴往前走。走出去好一阵，路上又来了一只鸭子。
        - id: ch01-b09
          speaker: cock
          text: 早安，拉基鸭子。
        - id: ch01-b10
          speaker: duck
          text: 早安，洛基公鸡。这么早，你要往哪儿走？
        - id: ch01-b11
          speaker: cock
          text: 我要去多夫勒山，免得世界毁灭。
        - id: ch01-b12
          speaker: duck
          text: 洛基公鸡，这是谁告诉你的？
        - id: ch01-b13
          speaker: cock
          text: 是佩妮母鸡告诉我的。
        - id: ch01-b14
          speaker: duck
          text: 佩妮母鸡，那又是谁告诉你的？
        - id: ch01-b15
          speaker: hen
          text: 昨晚我坐在橡树上，在梦里知道的。
        - id: ch01-b16
          speaker: duck
          text: 那我跟你们一块儿去。
    - id: ch02
      title: 队伍越来越长
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 于是，他们三个一同上路。没走多久，又遇见了一只鹅。
        - id: ch02-b02
          speaker: duck
          text: 早安，波西大鹅。
        - id: ch02-b03
          speaker: goose
          text: 早安，拉基鸭子。你们这么早要去哪儿？
        - id: ch02-b04
          speaker: duck
          text: 我要去多夫勒山，好让世界躲过毁灭。
        - id: ch02-b05
          speaker: goose
          text: 拉基鸭子，这是谁告诉你的？
        - id: ch02-b06
          speaker: duck
          text: 是洛基公鸡告诉我的。
        - id: ch02-b07
          speaker: goose
          text: 洛基公鸡，又是谁告诉你的？
        - id: ch02-b08
          speaker: cock
          text: 是佩妮母鸡告诉我的。
        - id: ch02-b09
          speaker: goose
          text: 佩妮母鸡，你怎么知道这件事？
        - id: ch02-b10
          speaker: hen
          text: 波西大鹅，我昨晚坐在橡树上，梦见了这件事。
        - id: ch02-b11
          speaker: goose
          text: 那我也跟你们一起走。
        - id: ch02-b12
          speaker: narrator
          text: 四个伙伴又走了一段。就在这时，一只狐狸迎面走来。
        - id: ch02-b13
          speaker: goose
          text: 早安，科克西狐狸。
        - id: ch02-b14
          speaker: fox
          text: 早安，波西大鹅。
        - id: ch02-b15
          speaker: goose
          text: 科克西狐狸，你要到哪儿去？
        - id: ch02-b16
          speaker: fox
          text: 先说说你吧，波西大鹅，你又要去哪儿？
        - id: ch02-b17
          speaker: goose
          text: 我要去多夫勒山，不然世界就会毁灭。
        - id: ch02-b18
          speaker: fox
          text: 波西大鹅，是谁把这事告诉你的？
        - id: ch02-b19
          speaker: goose
          text: 是拉基鸭子告诉我的。
        - id: ch02-b20
          speaker: fox
          text: 拉基鸭子，是谁告诉你的？
        - id: ch02-b21
          speaker: duck
          text: 是洛基公鸡告诉我的。
        - id: ch02-b22
          speaker: fox
          text: 洛基公鸡，又是谁告诉你的？
        - id: ch02-b23
          speaker: cock
          text: 是佩妮母鸡告诉我的。
        - id: ch02-b24
          speaker: fox
          text: 佩妮母鸡，你又是怎么知道的？
        - id: ch02-b25
          speaker: hen
          text: 昨晚我坐在橡树上，梦见要是我们不到多夫勒山去，世界就会毁灭。
        - id: ch02-b26
          speaker: fox
          text: 这都是胡说。你们不去那里，世界也好好的。还是跟我回洞里吧。那里暖暖和和，过得又快活，可比赶路强多了。
    - id: ch03
      title: 狐狸洞里的气味
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 大家听了狐狸的话，跟着他回到洞里。狐狸一进门就添了许多柴火，洞里越来越暖，烘得客人们一个个睁不开眼。
        - id: ch03-b02
          speaker: narrator
          text: 鸭子和鹅在角落里安顿下来，公鸡和母鸡却飞到一根柱子上。等鹅和鸭子睡熟，狐狸抓起鹅，把他放在余火上烤熟了。浓浓的烤肉味飘上来，母鸡半睡半醒，赶紧跳到更高的一根木栓上。
        - id: ch03-b03
          speaker: hen
          text: 呸，好难闻的气味！好难闻的气味！
          emotion: disgusted
        - id: ch03-b04
          speaker: fox
          text: 哎呀，别瞎说。只是烟囱里的烟倒灌下来罢了。快睡吧，别再出声。
        - id: ch03-b05
          speaker: narrator
          text: 母鸡听完，又睡着了。狐狸刚把鹅吞下肚，就用同样的办法来收拾鸭子。他把鸭子放在余火上烤熟，准备当作一顿美餐。母鸡再次醒来，又往更高的一根木栓跳去。
        - id: ch03-b06
          speaker: hen
          text: 呸，好难闻的气味！好难闻的气味！
          emotion: disgusted
        - id: ch03-b07
          speaker: narrator
          text: 这一回，母鸡睁开了眼睛。她看得清清楚楚，狐狸已经把鹅和鸭子都吃掉了。她赶紧飞到最高的木栓上，牢牢站住，再从那里仰头窥望烟囱外面。
    - id: ch04
      title: 从烟囱逃走
      blocks:
        - id: ch04-b01
          speaker: hen
          text: 哎呀，哎呀，你快看！那边飞着好大一群肥鹅呢。
        - id: ch04-b02
          speaker: narrator
          text: 狐狸雷纳德一听，拔腿就冲出洞去，想抓一只肥鹅回来烤着吃。趁他不在，母鸡叫醒公鸡，把波西大鹅和拉基鸭子的遭遇一五一十告诉了他。随后，洛基公鸡和佩妮母鸡从烟囱里飞了出去。
        - id: ch04-b03
          speaker: narrator
          text: 后来，他们要是没能赶到多夫勒山，世界准是早就完蛋啦。
