audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 从容而清醒，带一点克制的诙谐
        timbre: 温厚清晰
        pace: 舒缓有致
        pitch: 中低
    queen:
      display_name: 王后
      tts:
        delivery: 身份尊贵，情绪直率，忧愁时低沉，动怒时严厉
        timbre: 成熟柔润
        pace: 中等
        pitch: 中
    beggar_girl:
      display_name: 讨饭女孩
      tts:
        delivery: 年幼却笃定，毫不畏缩
        timbre: 清脆稚嫩
        pace: 中等偏快
        pitch: 中高
    beggar_woman:
      display_name: 讨饭的老妇人
      tts:
        delivery: 老练谨慎，酒后才松口
        timbre: 苍老沙哑
        pace: 舒缓
        pitch: 中低
    tatterhood:
      display_name: 破帽姑娘
      tts:
        delivery: 果断勇敢，带着不容置疑的自信和爽朗机智
        timbre: 年轻明亮
        pace: 中等偏快
        pitch: 中
    palace_messenger:
      display_name: 王宫使者
      tts:
        delivery: 恭敬谨慎，见到奇景时难掩惊讶
        timbre: 清晰稳重
        pace: 中等
        pitch: 中
    prince:
      display_name: 王子
      tts:
        delivery: 起初勉强而消沉，惊喜后逐渐明朗
        timbre: 年轻温和
        pace: 中等偏慢
        pitch: 中低
  chapters:
    - id: ch01
      title: 两朵花
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 从前，有一位国王和一位王后。他们没有孩子，王后为此终日伤心，觉得偌大的王宫又冷清又寂寞，几乎没有一刻快活。
        - id: ch01-b02
          speaker: queen
          text: 要是我们有孩子，这座王宫就有生气了。
          emotion: sad
        - id: ch01-b03
          speaker: narrator
          text: 王后走遍国土，发现上帝把孩子赐给了家家户户，连最穷苦的茅屋也不例外。她无论走到哪里，总听见主妇们数落自家的小家伙，这件事做错了，那件事也不对。王后听着，心想，自己若也能像别的母亲一样，该多好啊。后来，国王和王后收养了一个陌生的小姑娘，把她接进王宫，常伴在身边。孩子做得好，他们就疼爱她，做错了，也把她当亲生女儿一样管教。
        - id: ch01-b04
          speaker: narrator
          text: 一天，养女跑到王宫庭院里玩金苹果。一个讨饭的老妇人恰好带着女儿经过。两个孩子很快成了朋友，一起把金苹果抛来抛去。王后坐在宫里的窗前看见了，便敲敲玻璃，把养女叫上楼。养女马上往回走，讨饭女孩也跟着她。两个孩子手拉着手，一同进了王后的内室。王后一见便训斥那位小小姐。
        - id: ch01-b05
          speaker: queen
          text: 你是有身份的小姐，怎么能到处乱跑，跟一个衣衫褴褛的小乞丐玩？
          emotion: angry
        - id: ch01-b06
          speaker: narrator
          text: 王后要把讨饭女孩赶下楼。
        - id: ch01-b07
          speaker: beggar_girl
          text: 您要是知道我母亲有多大本领，就不会赶我了。只要她愿意，就能让您生下孩子。
        - id: ch01-b08
          speaker: narrator
          text: 王后不肯相信，追问她究竟是什么意思。小姑娘说，只要母亲愿意，就能办成这件事。她坚持自己句句属实，还请王后尽管试试，看能不能让母亲答应。于是，王后叫她下楼把母亲请来。老妇人刚进房间，王后便问她知不知道女儿说了什么。她对此一无所知。
        - id: ch01-b09
          speaker: queen
          text: 她说，只要你肯帮忙，我就能有孩子。
        - id: ch01-b10
          speaker: beggar_woman
          text: 堂堂王后，不该听讨饭丫头胡说。
        - id: ch01-b11
          speaker: narrator
          text: 老妇人说完，大步走出了房间。王后发了火，又想把小姑娘赶走，可孩子还是一口咬定，自己说的每一个字都是真的。
        - id: ch01-b12
          speaker: beggar_girl
          text: 给我母亲一点酒吧。等她喝高兴了，自然会想出办法帮您。
        - id: ch01-b13
          speaker: narrator
          text: 王后愿意一试，便又把老妇人请上楼来，让她想喝多少葡萄酒和蜜酒就喝多少。没过多久，老妇人的舌头果然活泛起来。王后便再次问起先前那件事。
        - id: ch01-b14
          speaker: beggar_woman
          text: 我也许真有个办法。睡觉以前，叫人送两桶水进来。您用两桶水洗过身子，再把水泼到床底。第二天早晨，床下会长出两朵花，一朵美，一朵丑。吃掉美的，千万把丑的留下。最后这句话可别忘了。
        - id: ch01-b15
          speaker: narrator
          text: 老妇人就是这样交代的。王后果然照办了。她叫人送来两桶水，每一桶都用来洗过身子，再把水全倒在床下。第二天一早，她往床下一看，那里果真立着两朵花。一朵又脏又丑，叶子乌黑。另一朵鲜亮、美丽又可爱，她从没见过这样的花，马上把它吃了。可这朵美丽的花味道实在太甜，王后怎么也忍不住，连丑的那朵也吃下去，还想，多吃一朵，想来也不会有什么好处或坏处。
    - id: ch02
      title: 破帽姑娘与女巫
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 果然，过了一阵，王后临盆了。头一个生下来的女孩手里就拿着木勺，还骑在山羊背上。她模样又丑又可怕，才来到世上便放声大叫。
        - id: ch02-b02
          speaker: tatterhood
          text: 妈妈！
        - id: ch02-b03
          speaker: queen
          text: 我要真是你妈妈，愿上帝赐我恩典，让我改过自新。
        - id: ch02-b04
          speaker: tatterhood
          text: 别难过。我后面很快还会来一个，她长得比我好看。
        - id: ch02-b05
          speaker: narrator
          text: 过了一会儿，王后果然又生下一个女儿。这孩子又美又甜，从来没有人见过这样可爱的婴儿，王后自然满意极了。姐姐总是又丑又邋遢，耳边垂着一顶碎成布条的兜帽，大家便叫她破帽姑娘。王后简直不忍看她，乳母们也想把她单独关在一个房间里。可无论妹妹在哪里，她就一定在哪里，谁也休想分开她们。
        - id: ch02-b06
          speaker: narrator
          text: 姐妹俩长到半大那年的圣诞前夜，王后内室外面的长廊里忽然响起骇人的碰撞和喧闹。破帽姑娘便问，走廊外那阵劈里啪啦的声音到底是怎么回事。
        - id: ch02-b07
          speaker: queen
          text: 没什么，不值得问。
        - id: ch02-b08
          speaker: narrator
          text: 破帽姑娘不肯罢休，非要弄明白。王后只好说，是一群山怪和女巫来这里过圣诞了。破帽姑娘当即要出去赶走它们。众人怎么劝，怎么求她别去招惹山怪，也拦不住她。临走前，她恳求王后守紧每一道门，务必关得严严实实，连一条小缝都不能开。
        - id: ch02-b09
          speaker: narrator
          text: 她拿着木勺冲进长廊，追打那些老妖婆，要把它们一扫而空。外面闹得天翻地覆，从来没人听过这样的动静。整座王宫又吱嘎又呻吟，仿佛每一处榫头、每一根梁木都要被扯散。至于事情怎么发生的，我也说不清。可不知怎的，一扇门偏偏开了条小缝。妹妹只想看看姐姐应付得怎么样，便探出一点点脑袋。忽听“啪”的一声，一个老女巫猛地蹿来，割走她的头，又把牛犊脑袋安在她肩上。公主四脚着地跑回房里，只会像牛犊一样哞哞叫。
        - id: ch02-b10
          speaker: narrator
          text: 破帽姑娘回来，看见妹妹成了这副模样，气得把所有人都骂了一遍。她怪大家没有好好守门，还问他们，因为这番粗心大意，妹妹如今变成了一头牛犊，他们还有什么话可说。
        - id: ch02-b11
          speaker: tatterhood
          text: 不管怎样，我得试试看，能不能把她救回来。
        - id: ch02-b12
          speaker: narrator
          text: 她向国王要了一艘物资充足、装备齐全的船，却不肯带船长，也不肯带水手。她说，要独自带着妹妹出海。谁也拦不住她，最后只能由着她去。
        - id: ch02-b13
          speaker: narrator
          text: 破帽姑娘扬帆启程，把船一直驶到女巫居住的陆地下面。来到上岸的地方，她叫妹妹安安静静留在船上，自己骑着山羊奔向城堡。长廊的一扇窗开着，妹妹的头正挂在窗框上。她纵着山羊跃过窗口，跳进长廊，一把夺下那颗头，转身就跑。女巫们全追出来，想把头抢回去。它们密密麻麻围上来，像一群蜜蜂，也像一窝蚂蚁。山羊一面喷鼻子、喘粗气，一面用角猛顶。破帽姑娘挥动木勺，把女巫打得东倒西歪。它们没有办法，只好放弃。
        - id: ch02-b14
          speaker: narrator
          text: 破帽姑娘终于带着妹妹的头回到船上。她取下妹妹肩头的牛犊脑袋，把妹妹自己的头重新安好。妹妹立刻恢复了从前的女孩模样。做完这一切，姐妹俩再次扬帆，越过漫长的海路，航行了很久很久，最后来到一个陌生国王的领土。
    - id: ch03
      title: 两桩婚事
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 那里的国王是个鳏夫，只有一个儿子。他看见这艘陌生的帆船，便派人到海滩上打听船从哪里来，又是谁的。使者来到岸边一看，船上一个人也没有，只有破帽姑娘骑着山羊，在甲板上一圈又一圈飞奔，蓬乱的头发迎风飘扬。使者们见了都惊讶不已，问船上是不是还有别人。
        - id: ch03-b02
          speaker: tatterhood
          text: 还有我的妹妹。
        - id: ch03-b03
          speaker: palace_messenger
          text: 能请她也出来，让我们见见吗？
        - id: ch03-b04
          speaker: tatterhood
          text: 不行。除非国王亲自来，谁也别想见她。
        - id: ch03-b05
          speaker: narrator
          text: 她说完，又骑着山羊在甲板上飞驰，震得船板咚咚响。使者回宫，把在船边看到和听到的事都禀报了。国王立刻动身赶来，要亲眼看看这个骑山羊的姑娘。等他到了岸边，破帽姑娘领出妹妹。那姑娘又美丽又温柔，国王站在那里，一见便爱得神魂颠倒。他把姐妹俩都接进王宫，还想娶妹妹做王后。
        - id: ch03-b06
          speaker: tatterhood
          text: 不行。除非您的儿子愿意娶我，否则您也不能娶我妹妹。
        - id: ch03-b07
          speaker: narrator
          text: 你自然想得到，王子哪里愿意娶破帽姑娘这样一个丑丫头。可国王和宫里所有人轮番劝他，最后，他还是让步了，许下诺言，要娶她做王后。这桩婚事实在违背他的心愿，他成了一个愁苦的人。
        - id: ch03-b08
          speaker: narrator
          text: 众人酿酒烤饼，忙着筹办两桩婚礼。等一切准备妥当，大家便要到教堂去。王子觉得，这恐怕是他一生走过最难熬的一趟礼拜路。国王先和自己的新娘乘车出发。她美丽又华贵，路上的人都停下脚步，目送她远去，直到再也看不见。后面，王子骑着马，破帽姑娘骑着山羊小跑，手里还攥着木勺。王子的模样不像去参加婚礼，倒像去参加葬礼，而且还是自己的葬礼。他一声不吭，只管满面悲愁地赶路。
    - id: ch04
      title: 婚礼路上的变化
      blocks:
        - id: ch04-b01
          speaker: tatterhood
          text: 你为什么一句话也不说？
        - id: ch04-b02
          speaker: prince
          text: 我能说些什么呢？
          emotion: sad
        - id: ch04-b03
          speaker: tatterhood
          text: 至少问问我，为什么骑着这只丑山羊吧。
        - id: ch04-b04
          speaker: prince
          text: 那你为什么要骑这么丑的山羊？
        - id: ch04-b05
          speaker: tatterhood
          text: 它是丑山羊吗？你看错了。这可是所有新娘骑过的马里，最气派的一匹。
        - id: ch04-b06
          speaker: narrator
          text: 转眼间，那只山羊变成了一匹骏马，是王子平生见过最漂亮的马。
        - id: ch04-b07
          speaker: narrator
          text: 两人又往前走了一段，王子还是和先前一样愁苦，半个字也说不出来。破帽姑娘再次问他为什么不说话，他只回答，自己不知道该说什么。
        - id: ch04-b08
          speaker: tatterhood
          text: 那就问问我，为什么手里拿着这把丑木勺。
        - id: ch04-b09
          speaker: prince
          text: 你为什么要拿着那把丑木勺？
        - id: ch04-b10
          speaker: tatterhood
          text: 它是丑木勺吗？你再瞧瞧。这可是所有新娘拿过的魔杖里，最美的一根银魔杖。
        - id: ch04-b11
          speaker: narrator
          text: 转眼间，木勺变成一根耀眼的银魔杖。它亮得晃眼，太阳的光芒也在上面闪闪发亮。
        - id: ch04-b12
          speaker: narrator
          text: 他们又往前走了一段。王子依旧满怀悲伤，仍然一句话也没有。过了一会儿，破帽姑娘再次问他为什么不说话，又叫他问问，自己为什么戴着那顶丑陋的灰帽子。
        - id: ch04-b13
          speaker: prince
          text: 你为什么戴着那顶又灰又丑的帽子？
        - id: ch04-b14
          speaker: tatterhood
          text: 它是丑帽子吗？才不是呢。这可是所有新娘戴过的王冠里，最明亮的一顶金王冠。
        - id: ch04-b15
          speaker: narrator
          text: 话音刚落，那顶灰帽子当场变成了一顶金王冠。
        - id: ch04-b16
          speaker: narrator
          text: 他们又走了很长一段路。王子愁苦极了，还是默不作声地坐在马上。新娘再次问他为什么不说话，又叫他问最后一个问题，为什么她的脸这样丑，这样灰白。
        - id: ch04-b17
          speaker: prince
          text: 唉，你的脸为什么这么丑，还灰白灰白的？
          emotion: sad
        - id: ch04-b18
          speaker: tatterhood
          text: 我丑？你以为我妹妹漂亮，可我比她还要漂亮十倍。
        - id: ch04-b19
          speaker: narrator
          text: 王子再看她时，只见她美得世上无双。他觉得，天下从来没有这样美丽的女子。打那以后，我想王子一定找回了自己的舌头，再也不会一句话也不说，垂着脑袋赶路了。
    - id: ch05
      title: 喝不完的喜酒
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 于是，他们痛痛快快喝了很久的喜酒。婚礼过后，王子和国王各自带着新娘，动身前往两位公主父亲的王宫。那里又摆下一场婚宴，大家再一次开怀畅饮，喝了很久很久。欢乐仿佛永远不会结束。你要是赶紧跑去国王的王宫，我敢说，那儿说不定还给你留着一滴婚宴上的麦酒呢。
