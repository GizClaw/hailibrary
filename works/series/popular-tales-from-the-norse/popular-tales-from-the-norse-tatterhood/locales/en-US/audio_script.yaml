  chapters:
    - id: ch01
      title: The Queen and the Two Flowers
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Once upon a time, there lived a king and queen who had no children. The Queen grieved over it so deeply that she hardly knew a happy hour. She went through the palace mourning how empty and lonely it felt.
        - id: ch01-b02
          speaker: queen
          text: If only we had children, this palace would be full of life.
          emotion: sad
        - id: ch01-b03
          speaker: narrator
          text: Wherever the Queen traveled in her kingdom, she found families blessed with children, even in the poorest huts. She heard mothers scolding their little ones for one piece of mischief after another. To the Queen, even that sounded wonderful. She longed to have a child to praise for doing well and correct for doing wrong. At last, the King and Queen brought a strange little girl into the palace to raise. They would keep her close, love her when she did well, and scold her when she did wrong, just as if she were their own.
        - id: ch01-b04
          speaker: narrator
          text: One day, their foster daughter ran into the palace yard to play with a golden apple. An old beggar woman passed by with a little girl of her own. Soon the two children were fast friends, tossing the apple back and forth. The Queen saw them from her window and tapped on the glass for her foster daughter to come upstairs. The child obeyed, and the beggar girl came too. They entered the Queen's room hand in hand.
        - id: ch01-b05
          speaker: queen
          text: A young lady like you should not run about with a ragged beggar child.
        - id: ch01-b06
          speaker: narrator
          text: The Queen tried to send the beggar girl away.
        - id: ch01-b07
          speaker: beggar_girl
          text: You would not drive me out if you knew what my mother could do.
        - id: ch01-b08
          speaker: narrator
          text: The Queen demanded to know exactly what she meant. The girl explained that her mother had the power to give the Queen children, if only she chose to use it. The Queen could hardly believe such a claim. Still, the girl stood by every word and urged her to put the old woman to the test. So the Queen sent her downstairs to fetch her mother.
        - id: ch01-b09
          speaker: queen
          text: Do you know what your daughter has been saying?
        - id: ch01-b10
          speaker: beggar_wife
          text: No, I know nothing about it.
        - id: ch01-b11
          speaker: queen
          text: She says you can help me have children, if you are willing.
        - id: ch01-b12
          speaker: beggar_wife
          text: A queen should not listen to the foolish tales of a beggar girl.
        - id: ch01-b13
          speaker: narrator
          text: With that, the beggar woman strode from the room. The Queen grew angry and once more tried to turn the girl out, but the child insisted she had told the truth.
        - id: ch01-b14
          speaker: beggar_girl
          text: Give my mother something to drink. Once she grows merry, she will find a way to help you.
        - id: ch01-b15
          speaker: narrator
          text: The Queen was ready to try anything. She called the beggar woman back and treated both mother and daughter to all the wine and mead they wished. Before long, the old woman grew merry and her tongue began to wag. Then the Queen came out with the same question once again.
        - id: ch01-b16
          speaker: beggar_wife
          text: Perhaps I do know one way. Before bed one evening, have two pails of water brought to you. Wash yourself in both, then pour the water beneath your bed. In the morning, you will find two flowers there, one beautiful and one ugly. Eat the beautiful flower, but leave the ugly one standing. Whatever you do, do not forget that last part.
        - id: ch01-b17
          speaker: narrator
          text: That evening, the Queen followed the old woman's instructions. She had two pails brought to her room, washed herself in each one, and poured the water beneath her bed. When she looked there the next morning, two flowers had sprung up. One was foul and ugly, with black leaves. The other was brighter and lovelier than any flower she had ever seen. She ate the beautiful one at once. It tasted so sweet that she could not stop herself. Though she had been warned, she ate the ugly flower too. Surely, she thought, one more flower could neither help nor harm her very much.
    - id: ch02
      title: Tatterhood and the Witches
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: In time, the Queen gave birth. Her first child was a girl who held a wooden spoon and rode upon a goat. She was ragged and ugly, and the moment she entered the world, she cried out.
        - id: ch02-b02
          speaker: tatterhood
          text: Mamma!
        - id: ch02-b03
          speaker: queen
          text: If I am your mamma, may God give me grace to mend my ways.
          emotion: surprised
        - id: ch02-b04
          speaker: tatterhood
          text: Do not be sorry. Another girl will soon follow me, and she will be much prettier.
        - id: ch02-b05
          speaker: narrator
          text: Soon the Queen had a second daughter. She was so fair and sweet that no one had ever seen a lovelier child, and the Queen was delighted with her. The elder twin was called Tatterhood. She was always ugly and ragged, and a torn hood hung down around her ears. The Queen could scarcely stand to look at her. The nurses tried shutting her away in a room, but it did no good. Wherever the younger twin went, Tatterhood had to be there too. No one could keep the sisters apart.
        - id: ch02-b06
          speaker: narrator
          text: Years passed. On a Christmas Eve, when the twins were half grown, a terrible clatter rose in the gallery outside the Queen's room. Things dashed and crashed in the passage so loudly that no one could ignore them. Tatterhood demanded to know what was making such a noise.
        - id: ch02-b07
          speaker: queen
          text: Oh, it is nothing worth asking about.
        - id: ch02-b08
          speaker: narrator
          text: Tatterhood would not let the matter rest until she knew the whole truth. At last, the Queen admitted that a pack of Trolls and witches had come to celebrate Christmas in the gallery. Tatterhood declared that she would go out and drive them away. Everyone begged and pleaded with her to leave the creatures alone, but she was determined to face them.
        - id: ch02-b09
          speaker: tatterhood
          text: Keep every door tightly shut while I am gone. Do not let even one open a crack.
        - id: ch02-b10
          speaker: narrator
          text: Tatterhood went out with her wooden spoon and began hunting the hags and sweeping them away. The gallery filled with a noise unlike anything ever heard before. The whole palace creaked and groaned as though every beam and joint were being torn loose.
        - id: ch02-b11
          speaker: narrator
          text: No one could say how it happened, but one door opened the tiniest crack. The younger sister peeped out to see how Tatterhood was doing. She put her head just through the gap. Pop! An old witch sprang up, tore off the girl's head, and set a calf's head upon her shoulders instead. The Princess ran back into the room on all fours, mooing like a calf.
        - id: ch02-b12
          speaker: narrator
          text: When Tatterhood returned and saw what had happened, she scolded everyone in the room. She was furious that, after her warning, they had kept such poor watch over the doors. She made them look at the result of their carelessness. Her own sister had been changed into a calf.
        - id: ch02-b13
          speaker: tatterhood
          text: Still, I will see whether I can set her free.
    - id: ch03
      title: The Witches' Castle
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: Tatterhood went to the King and asked for a ship, fully fitted and stocked with everything the sisters would need. She refused both captain and sailors. No one else was to come. She meant to sail away alone with her sister. The King tried to hold her back, but Tatterhood had made up her mind. At last, they let her have her way.
        - id: ch03-b02
          speaker: narrator
          text: Tatterhood sailed straight to the land where the witches lived. At the landing place, she ordered her sister to remain quietly aboard. Then she mounted her goat and rode to the witches' castle.
        - id: ch03-b03
          speaker: tatterhood
          text: Stay right here on the ship until I return.
        - id: ch03-b04
          speaker: narrator
          text: A gallery window stood open at the castle, and there, hanging from its frame, was her sister's own head. Tatterhood drove her goat through the window, seized the head, and raced away with it.
        - id: ch03-b05
          speaker: narrator
          text: The witches poured through the castle after her, trying to seize the head again. They crowded around Tatterhood and her goat as thickly as a swarm of bees or a nest of ants. But the goat snorted and puffed. He charged them and butted them with his horns, while Tatterhood beat and banged at them with her wooden spoon. Together, they forced a way through, and at last the whole pack of witches had to give up the chase.
        - id: ch03-b06
          speaker: narrator
          text: Tatterhood reached the ship safely. She lifted the calf's head from her sister's shoulders and put the girl's own head back in its place. At once, her sister became the girl she had been before. Then Tatterhood sailed on and on until they reached the realm of a foreign king.
    - id: ch04
      title: A Bargain for Two Brides
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: The king of that country was a widower with one son. When he saw the strange sail, he sent messengers down to the shore to learn where the ship had come from and who owned it.
        - id: ch04-b02
          speaker: narrator
          text: The messengers found no living soul in sight except Tatterhood. She was racing around and around the deck on her goat, with her tangled hair streaming in the wind. The palace men stared in amazement.
        - id: ch04-b03
          speakers: [messenger_1, messenger_2]
          ensemble: duo
          text: Is there no one else aboard this ship?
          emotion: surprised
        - id: ch04-b04
          speaker: tatterhood
          text: Yes. My sister is here with me.
        - id: ch04-b05
          speaker: narrator
          text: They asked to see the sister as well, but Tatterhood refused.
        - id: ch04-b06
          speaker: tatterhood
          text: No one may see her unless the King comes here himself.
        - id: ch04-b07
          speaker: narrator
          text: Then she galloped on until the deck thundered beneath her goat. The servants returned to the palace and told the King everything they had seen and heard. He immediately set out to see the girl who rode around on a goat.
        - id: ch04-b08
          speaker: narrator
          text: When the King reached the ship, Tatterhood brought out her sister. The girl was so beautiful and gentle that the King fell deeply in love with her on the spot. He took both sisters back to his palace and asked to make the younger one his queen. Tatterhood would not agree.
        - id: ch04-b09
          speaker: tatterhood
          text: You cannot have my sister unless your son agrees to take me as his queen.
        - id: ch04-b10
          speaker: narrator
          text: The Prince was deeply unwilling to marry someone he thought so ugly. But the King and everyone else in the palace reasoned with him and pressed him to accept the bargain. At last, he gave in. He gave his word that he would take Tatterhood for his queen, though the promise went sorely against his wishes. From then on, he was a doleful young man.
    - id: ch05
      title: The Ride to the Wedding
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: Preparations began at once. The palace kitchens brewed and baked for the double wedding. When everything was ready, the two couples dressed for the ceremony and set out from the palace for the church. The others saw a grand wedding procession. To the Prince, it felt like the dreariest journey to church he had ever made.
        - id: ch05-b02
          speaker: narrator
          text: The King rode first with his bride. She looked so lovely and grand that people stopped all along the road to watch her pass. They stared until she disappeared from sight. Behind them rode the Prince on horseback. Tatterhood trotted beside him on her goat, clutching her wooden spoon. The Prince looked as if he were riding to his own burial. He hung his head and said nothing.
        - id: ch05-b03
          speaker: tatterhood
          text: Why will you not speak to me?
        - id: ch05-b04
          speaker: prince
          text: What is there for me to say?
        - id: ch05-b05
          speaker: tatterhood
          text: You could ask why I am riding such an ugly goat.
        - id: ch05-b06
          speaker: prince
          text: Then why are you riding that ugly goat?
        - id: ch05-b07
          speaker: tatterhood
          text: Ugly? This is the finest horse that ever carried a bride.
        - id: ch05-b08
          speaker: narrator
          text: In an instant, the goat became a horse, finer than any the Prince had ever seen. They rode farther, but the Prince remained just as gloomy and silent. Tatterhood asked once more why he would not talk. He said he could think of nothing to say.
        - id: ch05-b09
          speaker: tatterhood
          text: At least ask why I carry this ugly spoon in my hand.
        - id: ch05-b10
          speaker: prince
          text: Why are you carrying that ugly spoon?
        - id: ch05-b11
          speaker: tatterhood
          text: Ugly? This is the loveliest silver wand a bride ever carried.
        - id: ch05-b12
          speaker: narrator
          text: At once, the spoon became a silver wand. It shone so brightly that sunlight flashed from it. Still they rode on, and still the Prince said nothing. After a while, Tatterhood told him what to ask next.
        - id: ch05-b13
          speaker: tatterhood
          text: Ask me why I wear this ugly gray hood upon my head.
        - id: ch05-b14
          speaker: prince
          text: Why do you wear that ugly gray hood?
        - id: ch05-b15
          speaker: tatterhood
          text: Ugly? This is the brightest golden crown a bride ever wore.
        - id: ch05-b16
          speaker: narrator
          text: The hood became a crown that very moment. They traveled a long way after that, yet the Prince sat as silent and sorrowful as before. Tatterhood asked again why he would not speak. This time, she told him to ask why her face looked so ugly and gray.
        - id: ch05-b17
          speaker: prince
          text: Ah, why is your face so ugly and ashen gray?
        - id: ch05-b18
          speaker: tatterhood
          text: I, ugly? You think my sister is beautiful, but I am ten times more beautiful than she is.
        - id: ch05-b19
          speaker: narrator
          text: The Prince turned and looked at his bride. Tatterhood had become so lovely that he thought no woman in all the world could equal her. The sorrow left him then. After that, no one would be surprised if he found his tongue at last and stopped riding with his head bowed down.
    - id: ch06
      title: The Bridal Feasts
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: The two couples drank long and deeply from the bridal cup. Afterward, the King and Prince set out with their brides for the palace of the princesses' father.
        - id: ch06-b02
          speaker: narrator
          text: There they held another wedding feast, and once again everyone drank long and deeply. The merrymaking seemed as if it would never end.
        - id: ch06-b03
          speaker: narrator
          text: If you hurry to the King's palace, I daresay you may still find one last drop of bridal ale waiting for you.
