  chapters:
    - id: ch01
      title: The White Bear at the Window
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            Once there was a poor farmer with so many children that he could hardly find enough food or clothing for them. They were all pretty children. But the youngest daughter was the prettiest of all, and her loveliness seemed to have no end.
        - id: ch01-b02
          speaker: narrator
          text: >-
            Late one Thursday evening in the fall, the weather turned wild. The night was cruelly dark. Rain beat down, the wind blew hard, and the cottage walls shook. The whole family sat around the fire, each busy with some little task. Then something tapped three times on the windowpane. The father went outside to see what it was, and there stood a great White Bear.
        - id: ch01-b03
          speaker: white_bear_prince
          text: Good evening to you.
        - id: ch01-b04
          speaker: father
          text: And a good evening to you.
        - id: ch01-b05
          speaker: white_bear_prince
          text: >-
            Will you give me your youngest daughter? If you do, I will make you as rich as you are poor now.
        - id: ch01-b06
          speaker: narrator
          text: >-
            The farmer would have liked those riches very much. Still, he thought he ought to speak to his daughter first. He went inside and told the family that a great White Bear was waiting outdoors. The Bear had promised to make them rich if he could have the youngest daughter.
        - id: ch01-b07
          speaker: lassie
          text: No! I will not go!
          emotion: angry
        - id: ch01-b08
          speaker: narrator
          text: >-
            Nothing could make her give another answer. So her father went back out and agreed that the White Bear would return the next Thursday evening. By then, he would have his answer. During the week the father kept talking to his daughter. He told her about the riches the family would have and how comfortable her own life would be. At last she changed her mind. She washed and mended her rags, made herself as neat as she could, and prepared to leave. Packing did not take her long.
        - id: ch01-b09
          speaker: narrator
          text: >-
            The next Thursday evening, the White Bear came for her. She climbed onto his back with her bundle, and away they went. After they had traveled a little way, he spoke.
        - id: ch01-b10
          speaker: white_bear_prince
          text: Are you afraid?
        - id: ch01-b11
          speaker: lassie
          text: No, I am not.
        - id: ch01-b12
          speaker: white_bear_prince
          text: >-
            Then hold tight to my shaggy coat. As long as you do that, there is nothing to fear.
        - id: ch01-b13
          speaker: narrator
          text: >-
            She rode for a long, long time, holding tightly to the Bear's shaggy coat. At last they reached a great steep hill. The White Bear knocked against its rocky face, and a door opened before them. They went through it and entered a castle. Room after room shone with light. Silver and gold gleamed everywhere she looked. A table stood ready for them, laid with everything they needed, and the whole place was as grand as any place could be. The White Bear gave her a silver bell. Whenever she wanted anything, he told her, she had only to ring it. Whatever she needed would come at once.
    - id: ch02
      title: A Promise at Home
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            After the lassie had eaten and drunk, the evening grew late and the long journey made her sleepy. She rang the silver bell. Almost before she touched it, she found herself in a bedchamber. The bed was fair and white, with silk pillows, silk curtains, and golden fringe. Everything else in the room was made of gold or silver.
        - id: ch02-b02
          speaker: narrator
          text: >-
            She went to bed and put out the light. Then a man entered and lay down beside her. He was the White Bear, who cast off his animal shape at night. But she never saw him. He always came after the light was out and left again before dawn.
        - id: ch02-b03
          speaker: narrator
          text: >-
            For a while, they lived happily. Then the lassie became quiet and sad. She spent every day alone, and she longed to see her father, her mother, and all her brothers and sisters. One day the White Bear asked what she was missing. She told him how lonely and dreary the castle felt, and how much it hurt that she could not visit her family.
        - id: ch02-b04
          speaker: white_bear_prince
          text: >-
            Perhaps we can cure your sadness. But you must promise me one thing. Do not speak with your mother alone. Talk to her only when the others are there to hear. She will take your hand and try to lead you into a room by yourselves. You must not go, or you will bring bad luck upon us both.
        - id: ch02-b05
          speaker: narrator
          text: >-
            On Sunday the White Bear came and said it was time to visit her parents. She sat on his back, and they traveled far and long. At last they reached a fine house. Her brothers and sisters were playing outside, and everything looked so lovely that it was a joy to see.
        - id: ch02-b06
          speaker: white_bear_prince
          text: >-
            Your father and mother live here now. Remember what I told you. If you forget, you will make us both unlucky.
        - id: ch02-b07
          speaker: lassie
          text: I will remember. I promise.
        - id: ch02-b08
          speaker: narrator
          text: >-
            When she reached the house, the White Bear turned around and left her there. The moment she went inside, her father, mother, brothers, and sisters gathered around her. Their joy seemed to have no end. They could not find enough words to thank her for all she had done for them. Now they had every good thing they could wish for, and they lived as comfortably as anyone could hope. One after another, they asked how she was getting on and what her life was like in the castle.
        - id: ch02-b09
          speaker: narrator
          text: >-
            She told them that it was a very good place to live and that she had everything she wanted. Whatever else she said did not tell them much. After dinner, though, events unfolded just as the White Bear had warned. Her mother tried to take her upstairs for a private talk, but the lassie refused.
        - id: ch02-b10
          speaker: lassie
          text: Whatever we need to discuss can wait. We can talk later.
        - id: ch02-b11
          speaker: narrator
          text: >-
            Somehow, her mother finally persuaded her. The lassie told the whole story. Each night after she put out the light, a man lay beside her. He always left before daybreak, so she had never seen him. She wished desperately to know what he looked like. She also told her mother how she wandered alone all day and how dull and lonely it was.
        - id: ch02-b12
          speaker: mother
          text: >-
            My goodness! You may be sleeping beside a Troll. I will show you how to see him. Take this little piece of candle and hide it inside your dress. When he is asleep, light it and look at him. But be careful. Do not spill any tallow on him.
        - id: ch02-b13
          speaker: narrator
          text: >-
            The lassie took the candle and hid it. As evening came, the White Bear returned to carry her away. When they had traveled a little way, he asked whether everything had happened as he had foretold.
        - id: ch02-b14
          speaker: lassie
          text: I cannot say that it did not.
        - id: ch02-b15
          speaker: white_bear_prince
          text: >-
            Then listen carefully. If you followed your mother's advice, you have brought bad luck upon us both. Everything that has passed between us will come to nothing.
        - id: ch02-b16
          speaker: lassie
          text: I did not follow her advice.
    - id: ch03
      title: The Candle and the Curse
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            Back at the castle, the night began just as every other night had. The lassie went to bed, and the man came to lie beside her. At midnight, when she heard that he was asleep, she rose and struck a light. She lit the candle and held it over him. There before her was the loveliest Prince anyone could hope to see.
        - id: ch03-b02
          speaker: narrator
          text: >-
            She fell so deeply in love with him at that very moment that she felt she had to kiss him. She bent down and did so. But as she kissed him, three hot drops of tallow fell onto his shirt. The Prince woke at once.
        - id: ch03-b03
          speaker: white_bear_prince
          text: >-
            What have you done? Now you have brought sorrow upon us both. If you had waited only one more year, I would have been free. My stepmother bewitched me, so that I must be a White Bear by day and a man by night. Now every bond between us is broken, and I must leave you and go to her. She lives in a castle east of the sun and west of the moon. A Princess with a nose three ells long lives there too, and now I must marry her.
          emotion: sad
        - id: ch03-b04
          speaker: narrator
          text: >-
            The lassie wept bitterly, but nothing could be changed. He had to go.
        - id: ch03-b05
          speaker: lassie
          text: Can I not go with you?
          emotion: sad
        - id: ch03-b06
          speaker: white_bear_prince
          text: No, you cannot.
        - id: ch03-b07
          speaker: lassie
          text: >-
            Then tell me how to get there. I will search until I find you. Surely you can let me do that.
        - id: ch03-b08
          speaker: white_bear_prince
          text: >-
            You may search. But there is no road to that place. It lies east of the sun and west of the moon, and you will never find your way there.
        - id: ch03-b09
          speaker: narrator
          text: >-
            The next morning she opened her eyes and found that everything had vanished. The Prince was gone, and so was the castle with all its bright rooms of gold and silver. She lay on a small patch of green ground in the middle of a dark, thick forest. Beside her was the same poor bundle of rags she had brought when she first left her old home.
        - id: ch03-b10
          speaker: narrator
          text: >-
            She rubbed the sleep from her eyes and cried until she had no tears left. Then she started walking. For many, many days she traveled on, until she came to a high rocky crag.
    - id: ch04
      title: Three Gifts for the Journey
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            Beneath the crag sat an old woman, tossing a golden apple as she played with it. The lassie asked whether she knew the way to the Prince who lived with his stepmother in the castle east of the sun and west of the moon. She explained that he was meant to marry the Princess whose nose was three ells long.
        - id: ch04-b02
          speaker: first_old_woman
          text: How did you learn about him? Are you the lassie who should have had the Prince?
        - id: ch04-b03
          speaker: lassie
          text: Yes, I am.
        - id: ch04-b04
          speaker: first_old_woman
          text: >-
            So it is you. I only know that he lives in the castle east of the sun and west of the moon. You may reach it late, or you may never reach it at all. Still, you can borrow my horse and ride to my next neighbor. Perhaps she can tell you more. When you arrive, tap the horse beneath the left ear and ask him to go home. And take this golden apple with you.
        - id: ch04-b05
          speaker: narrator
          text: >-
            The lassie mounted the horse and rode for a long, long time. At last she reached another crag. Beneath it sat a second old woman, holding a golden carding comb. Again the lassie asked for the way to the castle east of the sun and west of the moon.
        - id: ch04-b06
          speaker: second_old_woman
          text: >-
            I know no more than the first woman did. The castle lies east of the sun and west of the moon, and you may reach it late or never. But you may ride my horse to the next neighbor. Perhaps she knows all about it. When you get there, tap the horse beneath the left ear and ask him to go home.
        - id: ch04-b07
          speaker: narrator
          text: >-
            The second old woman gave her the golden carding comb as well, saying that perhaps she would find a use for it. The lassie tapped the first horse beneath the left ear and sent him home. Then she climbed onto the next horse. She rode far, far away, over a road that seemed to have no end. It was a weary journey, but at last she came to a third great crag. Beneath it sat a third old woman, spinning at a golden spinning wheel. The lassie asked once more about the Prince and the castle that lay east of the sun and west of the moon.
        - id: ch04-b08
          speaker: third_old_woman
          text: Are you the lassie who should have had the Prince?
        - id: ch04-b09
          speaker: lassie
          text: Yes, I am.
        - id: ch04-b10
          speaker: narrator
          text: >-
            This old woman knew no better than the other two. All she could say was that the castle lay east of the sun and west of the moon.
        - id: ch04-b11
          speaker: third_old_woman
          text: >-
            You may reach it late, or you may never reach it. I will lend you my horse. Ride to the East Wind and ask him. Perhaps he knows that country and can blow you there. When you reach his house, tap the horse beneath the left ear, and he will trot home by himself.
        - id: ch04-b12
          speaker: narrator
          text: >-
            Then the third old woman gave her the golden spinning wheel. She too said it might prove useful. The lassie rode onward for many days. It was a long, tiring journey, but at last she reached the house of the East Wind.
    - id: ch05
      title: The Four Winds
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: >-
            The lassie asked the East Wind if he knew the way to the Prince who lived east of the sun and west of the moon. The East Wind had often heard of the Prince and the castle, but he did not know the road. He had never blown that far.
        - id: ch05-b02
          speaker: east_wind
          text: >-
            If you wish, I will take you to my brother, the West Wind. He is much stronger than I am. Perhaps he knows the way. Climb onto my back, and I will carry you to him.
        - id: ch05-b03
          speaker: narrator
          text: >-
            The lassie climbed onto his back, and they swept along at a brisk pace. At the West Wind's house, the East Wind explained that this was the lassie who should have had the Prince in the castle east of the sun and west of the moon. She had set out to find him, and they hoped the West Wind could tell her how to reach the castle.
        - id: ch05-b04
          speaker: west_wind
          text: >-
            No, I have never blown that far. But I can carry you to our brother, the South Wind. He is far stronger than either of us, and his wings have traveled far and wide. Perhaps he can help you. Climb onto my back.
        - id: ch05-b05
          speaker: narrator
          text: >-
            She mounted the West Wind's back, and before very long they reached the South Wind. The West Wind asked whether his brother knew the road to the castle. He told him that the lassie was the one who should have had the Prince who lived there.
        - id: ch05-b06
          speaker: south_wind
          text: >-
            Truly? So this is the lassie! I have stormed through most places in my time, but even I have never blown so far. I will carry you to our brother, the North Wind. He is the oldest and strongest of us all. If he does not know the place, no one in the world can tell you. Get onto my back, and I will take you there.
        - id: ch05-b07
          speaker: narrator
          text: >-
            The lassie climbed onto his back. The South Wind flew from his house at a splendid speed, and the journey did not take long. But the North Wind was so wild and ill-tempered that they felt his cold gusts while they were still far away.
        - id: ch05-b08
          speaker: north_wind
          text: What do you two want here?
          emotion: angry
        - id: ch05-b09
          speaker: narrator
          text: >-
            His roar reached them from afar and sent an icy shiver through them.
        - id: ch05-b10
          speaker: south_wind
          text: >-
            There is no need for such harsh words. I am your brother, the South Wind. This is the lassie who should have had the Prince from the castle east of the sun and west of the moon. She is searching for him. Have you ever been there? Can you show her the way?
        - id: ch05-b11
          speaker: north_wind
          text: >-
            Yes, I know where it is. Once in my life, I blew an aspen leaf all the way there. Afterward I was so tired that I could not raise a puff for many days. If you truly mean to go, and you are not afraid to travel with me, climb onto my back. I will see if I can blow you there.
        - id: ch05-b12
          speaker: lassie
          text: >-
            I will go with all my heart. I must reach that castle if there is any way at all. No matter how wildly you fly, I will not be afraid.
        - id: ch05-b13
          speaker: north_wind
          text: >-
            Very well. You must sleep here tonight. If we are to reach the castle, we will need the whole day for the journey.
        - id: ch05-b14
          speaker: narrator
          text: >-
            Early the next morning, the North Wind woke her. He puffed himself up until he grew so huge that he was dreadful to see. Then they flew high into the air, as if they would not stop before the end of the world.
        - id: ch05-b15
          speaker: narrator
          text: >-
            Far below them, the storm tore down long stretches of forest and many houses. When it swept out over the great sea, ships sank by the hundred. The North Wind and the lassie flew on and on, covering a distance no one could believe, yet the sea still stretched beneath them. Little by little, the North Wind grew exhausted. His breath failed until he could scarcely force out one more puff. His great wings began to droop. They sank lower and lower over the water, until the crests of the waves broke over his heels.
        - id: ch05-b16
          speaker: north_wind
          text: Are you afraid now?
        - id: ch05-b17
          speaker: lassie
          text: No, I am not.
        - id: ch05-b18
          speaker: narrator
          text: >-
            Land was not far away. With the last of his strength, the North Wind flung her onto the shore beneath the windows of the castle east of the sun and west of the moon. He was so weak and worn out that he had to remain there for many days before he could make his way home.
    - id: ch06
      title: Three Nights at the Castle
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: >-
            The next morning, the lassie sat beneath a castle window and began to play with the golden apple. The first person she saw was the long-nosed Princess who was going to marry the Prince. The Princess pushed open the window and looked down.
        - id: ch06-b02
          speaker: long_nosed_princess
          text: Lassie, what do you want for that golden apple?
        - id: ch06-b03
          speaker: lassie
          text: It is not for sale, not for gold and not for money.
        - id: ch06-b04
          speaker: long_nosed_princess
          text: >-
            If gold and money will not buy it, then what will? Name the price you want.
        - id: ch06-b05
          speaker: lassie
          text: >-
            Let me go to the Prince who lives here and stay with him tonight. If you allow that, the apple is yours.
        - id: ch06-b06
          speaker: narrator
          text: >-
            The Princess agreed. She took the golden apple, and that night the lassie was led to the Prince's bedchamber. But the Prince was fast asleep. The lassie called his name, shook him, and wept over him. Nothing she tried could wake him. At the first light of morning, the long-nosed Princess came in and drove her from the room.
        - id: ch06-b07
          speaker: narrator
          text: >-
            That day the lassie sat once more beneath the castle windows. This time she worked with the golden carding comb. The long-nosed Princess wanted it and asked its price.
        - id: ch06-b08
          speaker: lassie
          text: >-
            You cannot buy it with gold or money. But if I may spend tonight with the Prince, you may have the comb.
        - id: ch06-b09
          speaker: narrator
          text: >-
            The Princess accepted the bargain. Yet when the lassie reached the Prince, he was again sunk in a deep sleep. She called to him, shook him, wept, and begged him to wake, but she could not stir him. As soon as the first gray light appeared, the long-nosed Princess chased her away.
        - id: ch06-b10
          speaker: narrator
          text: >-
            On the third day, the lassie sat outside and spun at the golden spinning wheel. The Princess saw it through the window and wanted that treasure too. Once again, she asked what it would cost.
        - id: ch06-b11
          speaker: lassie
          text: >-
            I will not sell it for gold or money. Let me be alone with the Prince tonight, and the spinning wheel is yours.
        - id: ch06-b12
          speaker: long_nosed_princess
          text: You may go to him tonight. I am glad to make that bargain.
        - id: ch06-b13
          speaker: narrator
          text: >-
            Now some Christian people had been carried away to that castle and held there. Their room was next to the Prince's. For two nights they had heard a woman in his room, crying, pleading, and calling to him. They told the Prince what they had heard.
        - id: ch06-b14
          speaker: narrator
          text: >-
            That evening, the long-nosed Princess brought the Prince his usual drink. He guessed that it was meant to make him sleep. He pretended to swallow it, then tossed it over his shoulder. So when the lassie entered his room for the third time, she found him wide awake. She told him the whole story of her journey and how she had finally reached him.
        - id: ch06-b15
          speaker: white_bear_prince
          text: >-
            You have come just in time. Tomorrow is meant to be my wedding day, but I will not marry the long-nosed Princess now. You are the only woman in the world who can free me. I will ask my bride to prove what she can do by washing the shirt with the three tallow stains. She will agree because she does not know that you made those marks. Only Christian hands can do that work, not a pack of Trolls. I will declare that the woman who washes the shirt clean is the only bride I will take. Then I will call for you.
        - id: ch06-b16
          speaker: narrator
          text: >-
            All through that night, the Prince and the lassie were filled with joy and love.
    - id: ch07
      title: The Shirt White as Snow
      blocks:
        - id: ch07-b01
          speaker: narrator
          text: >-
            The next day was to have been the wedding day. Before anything else began, the Prince spoke.
        - id: ch07-b02
          speaker: white_bear_prince
          text: First I want to see what my bride is able to do.
        - id: ch07-b03
          speaker: troll_stepmother
          text: Yes, of course. Let her show you gladly.
        - id: ch07-b04
          speaker: white_bear_prince
          text: >-
            I have a fine shirt that I want to wear for my wedding. Somehow it has three spots of tallow on it, and they must be washed away. I have sworn that I will marry no woman except the one who can make this shirt clean. If my bride cannot do that, she is not worth having.
        - id: ch07-b05
          speaker: narrator
          text: >-
            The Trolls thought this would be easy, so they agreed. The long-nosed Princess began to wash as hard as she could. But the more she rubbed and scrubbed, the larger the three spots became.
        - id: ch07-b06
          speaker: troll_stepmother
          text: You do not know how to wash. Give the shirt to me.
        - id: ch07-b07
          speaker: narrator
          text: >-
            The Troll stepmother took the shirt. Before she had worked on it for long, it looked worse than ever. She rubbed it, wrung it, and scrubbed it, but the stains only spread. The shirt grew darker and uglier in her hands.
        - id: ch07-b08
          speaker: narrator
          text: >-
            Then all the other Trolls tried. The longer they washed, the blacker the shirt became. At last it looked as though it had been dragged through a chimney.
        - id: ch07-b09
          speaker: white_bear_prince
          text: >-
            Not one of you is worth a straw at washing. There is a poor lassie sitting outside, and I would wager that she can wash better than all of you together. Lassie, come in!
        - id: ch07-b10
          speaker: narrator
          text: The lassie came into the room.
        - id: ch07-b11
          speaker: white_bear_prince
          text: Do you think you can wash this shirt clean?
        - id: ch07-b12
          speaker: lassie
          text: I do not know for certain, but I think I can.
        - id: ch07-b13
          speaker: narrator
          text: >-
            She took the shirt and dipped it into the water. Almost at once, it became as white as driven snow, and then whiter still.
        - id: ch07-b14
          speaker: white_bear_prince
          text: Yes. You are the lassie I will marry.
          emotion: happy
        - id: ch07-b15
          speaker: narrator
          text: >-
            The Troll stepmother flew into such a rage that she burst on the spot. The long-nosed Princess burst after her, and then every other Troll did the same. At least, no one has heard a word about any of them since.
        - id: ch07-b16
          speaker: narrator
          text: >-
            The Prince and his true Princess freed all the poor Christian people who had been carried away and shut inside the castle. They gathered up all its silver and gold and took it with them. Then they traveled as far away as they could from the castle that lay east of the sun and west of the moon.
