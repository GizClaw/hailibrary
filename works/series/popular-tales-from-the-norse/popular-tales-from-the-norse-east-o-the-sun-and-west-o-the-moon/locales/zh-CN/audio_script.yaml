audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 从容而清醒，带一点克制的诙谐
        timbre: 温厚清晰
        pace: 舒缓有致
        pitch: 中低
    farmer:
      display_name: 庄稼汉
      tts:
        delivery: 朴实急切，面对富贵时藏不住心动
        timbre: 粗实温厚
        pace: 中等
        pitch: 中低
    girl:
      display_name: 姑娘
      tts:
        delivery: 真挚坚韧，起初迟疑，历经磨难后更加坚定
        timbre: 年轻清亮
        pace: 中等
        pitch: 中高
    white_bear_prince:
      display_name: 白熊王子
      tts:
        delivery: 温和克制，作为白熊时沉稳，恢复人身后深情而果断
        timbre: 清朗深厚
        pace: 稍慢
        pitch: 中低
    mother:
      display_name: 母亲
      tts:
        delivery: 关切多疑，说起主意时笃定而急切
        timbre: 成熟温暖
        pace: 中等
        pitch: 中
    first_old_woman:
      display_name: 第一位老太婆
      tts:
        delivery: 慈祥坦率，话里带着对远路的忧虑
        timbre: 苍老柔和
        pace: 舒缓
        pitch: 中低
    second_old_woman:
      display_name: 第二位老太婆
      tts:
        delivery: 和善实在，虽无答案仍愿尽力相助
        timbre: 苍老清晰
        pace: 舒缓
        pitch: 中低
    third_old_woman:
      display_name: 第三位老太婆
      tts:
        delivery: 沉静明断，指路时耐心而笃定
        timbre: 苍老温厚
        pace: 稍慢
        pitch: 中低
    east_wind:
      display_name: 东风
      tts:
        delivery: 轻快热心，说话像一阵不断向前的风
        timbre: 明亮轻盈
        pace: 稍快
        pitch: 中高
    west_wind:
      display_name: 西风
      tts:
        delivery: 爽快有力，答话直接，不拖泥带水
        timbre: 宽厚响亮
        pace: 中等
        pitch: 中
    south_wind:
      display_name: 南风
      tts:
        delivery: 豪爽热诚，见多识广却不夸张
        timbre: 饱满温暖
        pace: 中等
        pitch: 中低
    north_wind:
      display_name: 北风
      tts:
        delivery: 暴烈粗犷，承诺相助后显出可靠与刚强
        timbre: 冰冷雄浑
        pace: 忽缓忽急
        pitch: 低
    long_nosed_princess:
      display_name: 长鼻子公主
      tts:
        delivery: 贪求任性，讨价还价时急不可耐
        timbre: 尖细清晰
        pace: 稍快
        pitch: 高
    stepmother:
      display_name: 王子的继母
      tts:
        delivery: 傲慢自负，遇到难题仍强作笃定
        timbre: 苍老冷硬
        pace: 中等
        pitch: 中低
  chapters:
    - id: ch01
      title: 风雨中的白熊
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 从前，有个穷庄稼汉，家里儿女很多，吃的和穿的却少得可怜，怎么也不够分。孩子们个个生得漂亮，最小的女儿尤其美，美得简直说不尽。
        - id: ch01-b02
          speaker: narrator
          text: 深秋一个星期四的傍晚，天已经很晚了。外面风雨大作，四下黑得吓人，小屋被吹打得直发颤。一家人围着火，各自做着手里的活。忽然，窗玻璃上传来三下敲击声。父亲出门一看，门外竟站着一头大得惊人的白熊。
        - id: ch01-b03
          speaker: white_bear_prince
          text: 晚上好！
        - id: ch01-b04
          speaker: farmer
          text: 也祝你晚上好。
        - id: ch01-b05
          speaker: white_bear_prince
          text: 你愿意把小女儿交给我吗？只要你答应，我就让你富起来，再也不用过这样的穷日子。
        - id: ch01-b06
          speaker: narrator
          text: 庄稼汉当然盼着发财，可这件事总要问过女儿。他回到屋里，把门外的情形告诉全家，说大白熊正在等答复，只要得到小女儿，就会让他们富得不得了。
        - id: ch01-b07
          speaker: girl
          text: 不，我不去！
        - id: ch01-b08
          speaker: narrator
          text: 不管家人怎么劝，她都不改口。庄稼汉只好去告诉白熊，下个星期四傍晚再来听答复。接下来的几天，他一遍遍劝女儿，讲全家会得到多少财富，也讲她往后能过上多好的日子。姑娘终于改变了主意。她把破衣裳洗净补好，尽量收拾整齐，准备上路。她本来就没有多少行李可带。
        - id: ch01-b09
          speaker: narrator
          text: 到了下一个星期四，白熊果然来接她。姑娘带上小包袱，骑到熊背上，一起离开了家。走了一段路，白熊开口问她。
        - id: ch01-b10
          speaker: white_bear_prince
          text: 你怕吗？
        - id: ch01-b11
          speaker: girl
          text: 不，我不怕。
        - id: ch01-b12
          speaker: white_bear_prince
          text: 那就抓紧我的长毛，别的什么都不用怕。
        - id: ch01-b13
          speaker: narrator
          text: 白熊驮着姑娘走了很远很远，最后来到一座又高又陡的山下。它朝山壁敲了一下，山上立刻开出一扇门。他们进去以后，姑娘发现里面是一座城堡。数不清的房间灯火通明，到处闪着金银的光，桌上早已摆满饭菜，真是富丽堂皇。白熊交给她一只银铃，告诉她，不论想要什么，只要摇一下铃，东西马上就会送来。
    - id: ch02
      title: 黑暗中的王子
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 姑娘吃饱喝足，天也晚了。一路走了这么远，她困得很，想上床休息，便摇响银铃。手才碰到铃，她就进了一间卧房。床铺又白又美，任谁见了都想躺下睡一觉。床上有丝绸枕头、丝绸帷幔，还有金色流苏，房里的东西不是金的，就是银的。
        - id: ch02-b02
          speaker: narrator
          text: 姑娘上床吹灭灯以后，一个男人走进来，躺在她身边。原来白熊每到夜里都会脱下兽形，变回人身。可他总等熄灯以后才来，天亮以前就离开，所以姑娘从没见过他。
        - id: ch02-b03
          speaker: narrator
          text: 他们和和美美地过了一阵。后来，姑娘越来越沉默，也越来越忧伤。白天只有她一个人，她很想回去看看父母和兄弟姐妹。有一天，白熊问她还缺什么。她说，城堡里实在太冷清，自己到不了亲人身边，所以心里又愁苦又寂寞。
        - id: ch02-b04
          speaker: white_bear_prince
          text: 好吧，这事也许有办法。不过你得答应我，绝不能单独跟母亲说话，只能当着其他人的面谈。她会拉你的手，想领你进一间屋子私下说话。千万别跟她去，不然我们两个都要遭殃。
        - id: ch02-b05
          speaker: narrator
          text: 到了一个星期日，白熊来告诉姑娘，现在可以回家探望了。她还是骑在熊背上，跟它走了很远很远。最后，他们来到一座华美的大宅前。她的兄弟姐妹正在屋外跑着玩，四周样样都很美，看着就让人高兴。
        - id: ch02-b06
          speaker: white_bear_prince
          text: 你父母现在住在这里。别忘了我嘱咐你的话，不然我们两个都会倒霉。
        - id: ch02-b07
          speaker: girl
          text: 不会的，老天保佑，我绝不会忘。
        - id: ch02-b08
          speaker: narrator
          text: 姑娘进了宅子，白熊转身离开。一家人见到她，高兴得没个尽头。他们围着她又看又问，觉得不论怎样感谢她为全家做的一切都还不够。如今家里想要什么就有什么，吃穿再也不缺，日子好得不能再好。父母和兄弟姐妹都急着知道，她在城堡里究竟过得怎么样。
        - id: ch02-b09
          speaker: narrator
          text: 姑娘只说自己过得很好，要什么有什么。她还说了别的话，不过谁也没听出真相，她也没让家人问出多少。下午吃过饭，事情果然照白熊说的发生了。母亲要带她去卧房单独谈，她记着嘱咐，不肯上楼。
        - id: ch02-b10
          speaker: girl
          text: 咱们要说的话，以后再说也不迟。
        - id: ch02-b11
          speaker: narrator
          text: 可母亲不知用了什么办法，还是说动了女儿。姑娘只好从头讲起，说每天夜里，等她上床熄灯，就会有个男人进来，睡在她身旁。天没亮，他便早早走了，她从来没见过他的脸。她为这件事一直难过，很想亲眼看他一次。何况白天只有自己在城堡里走来走去，日子沉闷、凄凉，又寂寞。
        - id: ch02-b12
          speaker: mother
          text: 哎呀，每晚睡在你身边的，没准是个山怪！我教你一个办法，让你看清他的模样。我给你一小截蜡烛，你藏在怀里带回去。等他睡熟，再把蜡烛点亮。可一定要小心，千万别让烛油滴到他身上。
        - id: ch02-b13
          speaker: narrator
          text: 姑娘接过蜡烛，藏在怀里。夜幕降临以后，白熊来接她回城堡。走了一段路，它问她，家里发生的事是不是全都和自己说的一样。
        - id: ch02-b14
          speaker: girl
          text: 嗯，我不能说不是。
        - id: ch02-b15
          speaker: white_bear_prince
          text: 那你要记住，如果听了母亲的主意，我们两个都会遭殃，从前的一切也会全没了。
        - id: ch02-b16
          speaker: girl
          text: 没有，我没有听她的主意。
    - id: ch03
      title: 三滴烛油
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 回到城堡，姑娘上了床，一切还和往常一样。那个男人走进来，躺在她身旁。到了深夜，姑娘听出他已经睡熟，便起身取火，点亮藏着的蜡烛，把光照到他脸上。这一看，她才发现，世上再没有比他更俊美的王子。
        - id: ch03-b02
          speaker: narrator
          text: 姑娘顿时深深爱上了他，觉得自己非立刻亲他一下不可。她俯身吻了王子，谁知这一吻让三滴滚烫的烛油落在他的衬衣上。王子一下惊醒了。
        - id: ch03-b03
          speaker: white_bear_prince
          text: 你做了什么？现在我们两个都被你害苦了！只要你再坚持一年，我就能重获自由。我的继母给我下了魔法，让我白天变成白熊，只有夜里才能做人。如今我们之间的牵系全断了，我必须离开你，回到她那里。她住的城堡在太阳东边、月亮西边。那里还有个公主，鼻子足足有三厄尔长，现在我非娶她不可。
          emotion: sad
        - id: ch03-b04
          speaker: narrator
          text: 姑娘不停地哭，怎么也不愿接受。可事情已经无法挽回，王子非走不可。她问自己能不能跟他一起去，王子说不行。
        - id: ch03-b05
          speaker: girl
          text: 那你告诉我该往哪里走。我一定会去找你，这总可以吧？
        - id: ch03-b06
          speaker: white_bear_prince
          text: 你当然可以来找。可那里根本没有路。它在太阳东边、月亮西边，你永远也找不到。
        - id: ch03-b07
          speaker: narrator
          text: 第二天早晨，姑娘醒来一看，王子不见了，整座城堡也不见了。她独自躺在一小片绿草地上，周围全是阴森茂密的树林。身边只有她当初从穷家带来的破衣包袱。
        - id: ch03-b08
          speaker: narrator
          text: 姑娘揉掉睡意，哭到再也哭不动，这才站起来上路。她走了许多许多天，来到一座高高的峭壁下。那里坐着一个老太婆，正把一只金苹果抛来抛去。姑娘问她，知不知道怎么去找王子。他和继母住在太阳东边、月亮西边的城堡里，很快就要娶那个鼻子足有三厄尔长的公主。
        - id: ch03-b09
          speaker: first_old_woman
          text: 你怎么知道他的事？难道你就是本来该嫁给他的姑娘？
        - id: ch03-b10
          speaker: girl
          text: 是的，就是我。
        - id: ch03-b11
          speaker: first_old_woman
          text: 原来真是你。我只知道他住在太阳东边、月亮西边的城堡里。你想走到那里，不知要等到哪一天，也许永远都到不了。不过我可以借你一匹马，你骑它去找我的下一个邻居，她或许知道。到了那里，就拿鞭子在马的左耳下面抽一下，让它自己回家。先等等，这只金苹果也送给你，也许能派上用场。
        - id: ch03-b12
          speaker: narrator
          text: 姑娘骑上马，走了很久很久，来到另一座峭壁下面。她照着嘱咐，在马的左耳下抽了一鞭，让它自己回家。那里也坐着一个老太婆，手里拿着一把金梳棉梳。姑娘又把王子、继母和长鼻子公主的事说了一遍，问通往太阳东边、月亮西边那座城堡的路该怎么走。可老太婆除了城堡的名字，别的也不知道。
        - id: ch03-b13
          speaker: second_old_woman
          text: 你想走到那里，不知要等到哪一天，也许永远都到不了。不过我把马借给你，你去问问我的下一个邻居，她说不定知道全部的事。到了那里，就在马的左耳下面抽一鞭，让它自己回来。这把金梳棉梳也带上吧，也许以后用得着。
        - id: ch03-b14
          speaker: narrator
          text: 姑娘又骑马走过遥远的路，一路疲惫不堪，终于来到第三座高大的峭壁下。她又在马的左耳下面抽了一鞭，马便转身回家。第三个老太婆坐在那里，正用一架金纺车纺线。姑娘还是问她，怎样才能找到王子，那座城堡究竟在哪里。她得到的依旧是同样的回答。
        - id: ch03-b15
          speaker: third_old_woman
          text: 你就是本来该嫁给王子的姑娘吗？
        - id: ch03-b16
          speaker: girl
          text: 是的，就是我。
        - id: ch03-b17
          speaker: narrator
          text: 这位老太婆也不比前两位知道得多。她只听过“太阳东边，月亮西边”这个名字，除此之外一无所知。
        - id: ch03-b18
          speaker: third_old_woman
          text: 你想走到那里，不知要等到哪一天，也许永远都到不了。不过我可以借你一匹马。依我看，你最好去问东风，它也许熟悉那一带，还能把你吹过去。见到东风以后，就在马的左耳下面抽一鞭，它会自己小跑回来。这架金纺车也送给你，也许你会用上。
    - id: ch04
      title: 四方的风
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 姑娘骑马又走了许多许多天，累得筋疲力尽，终于来到东风的家。她在马的左耳下面抽了一鞭，让它小跑着回到老太婆那里。随后，她问东风，知不知道怎么去找那位住在太阳东边、月亮西边的王子。东风说，自己常听人提起城堡和王子，却从没吹到那么远，并不知道路。
        - id: ch04-b02
          speaker: east_wind
          text: 你要是愿意，我可以带你去找我的兄弟西风。它比我有力气，也许知道该怎么走。坐到我背上来，我驮你过去。
        - id: ch04-b03
          speaker: narrator
          text: 姑娘坐上东风的背，他们飞快地赶到西风家，一路快得简直像没有花多少时间。进了西风的家，东风告诉兄弟，自己带来的正是本来该嫁给那位王子的姑娘。她为了寻找王子一路走到这里，想知道西风能不能带她去那座城堡。
        - id: ch04-b04
          speaker: west_wind
          text: 不，我也从没吹到那么远。不过你愿意的话，我可以带你去找我们的兄弟南风。它比我们两个都强壮，扇着翅膀到过许多远方，也许能告诉你。坐到我背上来，我带你去见它。
        - id: ch04-b05
          speaker: narrator
          text: 姑娘坐上西风的背，朝南风家赶去。这一路也没用多长时间。到了那里，西风问南风，知不知道太阳东边、月亮西边的城堡怎么走，还告诉它，身旁这位就是本来该嫁给城堡里那位王子的姑娘。
        - id: ch04-b06
          speaker: south_wind
          text: 什么，原来就是她！这些年来，我差不多什么地方都去过，可也没吹到过那么远。你若愿意，我可以带你去见兄弟北风。它年纪最大，力气也最强。要是连它都不知道，那世上再没人能告诉你了。坐到我背上来，我驮你过去。
        - id: ch04-b07
          speaker: narrator
          text: 姑娘坐上南风的背。南风一出门就飞奔起来，路上同样没耽搁多久。他们来到北风家，还隔着老远，北风身上的寒气已经一阵阵冲过来。它脾气又凶又暴，远远就怒吼起来，冰冷的声音冻得他们浑身一颤。
        - id: ch04-b08
          speaker: north_wind
          text: 活见鬼！你们两个跑来干什么？
          emotion: angry
        - id: ch04-b09
          speaker: south_wind
          text: 好了，别骂得这么难听。我是你兄弟南风。这位姑娘本来该嫁给太阳东边、月亮西边那座城堡里的王子。她一心想再找到他，所以来问你去没去过那里，知不知道路。
        - id: ch04-b10
          speaker: north_wind
          text: 我当然知道。有一回，我把一片白杨叶吹到了那里，可那一趟累得我好多天连一口气也吹不出来。你要是真非去不可，又敢跟我走，我就让你坐在背上，试试能不能把你吹过去。
        - id: ch04-b11
          speaker: narrator
          text: 姑娘满心愿意。不管用什么办法，她都一定要去。就算北风飞得再疯狂，她也绝不害怕。
        - id: ch04-b12
          speaker: north_wind
          text: 那好。不过你今晚得睡在这里。要赶到那座城堡，我们需要整整一天。
    - id: ch05
      title: 海上的长路
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 第二天一早，北风叫醒姑娘，开始鼓足力气。它越胀越大，变得又粗又壮，模样吓人极了。接着，他们一下冲进高空，像是再也不会停，要一直飞到世界尽头。
        - id: ch05-b02
          speaker: narrator
          text: 他们飞过大地，暴风在脚下拔倒一片又一片树林，掀翻许多房屋。风势扫过茫茫大海，又让成百上千艘船沉了下去。他们呼啸着一路向前，谁也想不到究竟飞了多远。脚下始终只有望不到边的大海。
        - id: ch05-b03
          speaker: narrator
          text: 北风越来越累，喘得几乎连一丝风都吹不出来。它的翅膀越垂越低，最后贴近海面，浪尖已经打到它的脚后跟。
        - id: ch05-b04
          speaker: north_wind
          text: 你怕吗？
        - id: ch05-b05
          speaker: girl
          text: 不，我不怕。
        - id: ch05-b06
          speaker: narrator
          text: 幸好陆地已经不远了，远处已经能够看见城堡。北风拼尽最后一点力气，把姑娘抛上岸，让她落在太阳东边、月亮西边那座城堡的窗下。北风自己却累得虚弱极了，只能在那里休息许多天，才攒够力气回家。
        - id: ch05-b07
          speaker: narrator
          text: 第二天早晨，姑娘坐在城堡窗下，拿出金苹果，在手里抛着玩。她最先见到的人，就是那个马上要嫁给王子的长鼻子公主。
        - id: ch05-b08
          speaker: long_nosed_princess
          text: 姑娘，你的金苹果怎么卖？
        - id: ch05-b09
          speaker: girl
          text: 给我再多金银，我也不卖。
        - id: ch05-b10
          speaker: long_nosed_princess
          text: 金银都买不到，那你到底想换什么？价钱由你说。
        - id: ch05-b11
          speaker: girl
          text: 今晚让我去见住在这里的王子，单独陪他一夜，我就把苹果给你。
        - id: ch05-b12
          speaker: long_nosed_princess
          text: 可以，这事办得到。
        - id: ch05-b13
          speaker: narrator
          text: 公主拿走了金苹果。到了夜里，姑娘走进王子的卧房，却见他睡得沉沉的。她一遍遍呼唤，又不停摇晃他，时而伤心痛哭。可不论怎么做，她都唤不醒王子。第二天刚亮，长鼻子公主就赶来，把她重新赶了出去。
        - id: ch05-b14
          speaker: narrator
          text: 白天，姑娘再次坐到城堡窗下，用金梳棉梳梳起羊毛。长鼻子公主又来问她，梳子要怎么卖。
        - id: ch05-b15
          speaker: girl
          text: 给多少金银都不卖。只要你今晚还让我去见王子，陪他一夜，这把梳子就归你。
        - id: ch05-b16
          speaker: narrator
          text: 公主答应了，拿走那把金梳棉梳。可姑娘到了卧房，王子仍然沉睡不醒。她不停地喊，不停地摇，哭着求着，还是唤不回他的神智。东方才露出第一线灰白的晨光，长鼻子公主就闯进来，又把姑娘赶了出去。
    - id: ch06
      title: 王子醒来了
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: 第三天白天，姑娘坐在城堡外的窗下，用金纺车纺线。长鼻子公主看中了这件宝物，推开窗户问她要拿什么来换。
        - id: ch06-b02
          speaker: girl
          text: 金银再多也不卖。今晚让我去见里面的王子，单独陪他一夜，我就把纺车送给你。
        - id: ch06-b03
          speaker: long_nosed_princess
          text: 可以，我答应你。
        - id: ch06-b04
          speaker: narrator
          text: 公主痛痛快快地拿走了金纺车。可城堡里还关着一些被掳来的基督徒，他们住的房间紧挨着王子的卧房。前两个夜晚，他们都听见一个女人在里面哭泣、恳求，一次又一次地呼唤王子。于是，他们把这件事告诉了他。
        - id: ch06-b05
          speaker: narrator
          text: 那天傍晚，长鼻子公主照旧送来一杯催眠酒。王子装作喝了，却把酒泼到肩后。他已经猜出，这一定是让人昏睡的酒。等姑娘走进卧房，终于看见王子清醒地等在那里。她把自己怎样走过漫长的路、一路来到城堡的经过，全都告诉了他。
        - id: ch06-b06
          speaker: white_bear_prince
          text: 啊，你来得正是时候。明天就是婚礼，可我绝不会娶长鼻子。世上只有你能救我出去。我会说，先得看看未来的新娘有多大本事，再让她洗一件衬衣，上面就是你滴下的三点烛油。她肯定会答应，因为她不知道烛油是你滴的。可这件事只有基督徒做得到，那些山怪一个也办不到。所以我会说，除了能洗掉烛油的人，我谁也不娶。到时候，我再叫你进来试试。
        - id: ch06-b07
          speaker: narrator
          text: 于是，整整一夜都充满了欢喜和爱意。
    - id: ch07
      title: 白得像新雪
      blocks:
        - id: ch07-b01
          speaker: narrator
          text: 第二天，婚礼就要举行了，王子却先开了口。
        - id: ch07-b02
          speaker: white_bear_prince
          text: 在成婚以前，我想先看看新娘到底有多大本事。
        - id: ch07-b03
          speaker: stepmother
          text: 当然可以！
        - id: ch07-b04
          speaker: white_bear_prince
          text: 我有一件很好的衬衣，本来想在婚礼上穿，可不知怎么沾了三点烛油，一定得洗干净。我已经发过誓，除了能洗掉烛油的女人，我谁也不娶。连这点事都办不到，我还娶她做什么？
        - id: ch07-b05
          speaker: narrator
          text: 大家都说这算不了什么，当场答应下来。长鼻子公主使出全身力气，又搓又洗，可她越是用力，三点污迹反而越变越大。
        - id: ch07-b06
          speaker: stepmother
          text: 唉，你根本不会洗，拿来让我试！
        - id: ch07-b07
          speaker: narrator
          text: 衬衣到了老太婆手里，很快就比先前还糟。她使劲搓，用力拧，又不停刷洗，可污迹只会越变越大，颜色越来越黑，衬衣也越来越难看。
        - id: ch07-b08
          speaker: narrator
          text: 接着，其他山怪全来动手。可他们洗得越久，衬衣就越黑，最后整件衣服黑得像刚从烟囱里拿出来一样。
        - id: ch07-b09
          speaker: white_bear_prince
          text: 哈，你们连一根稻草都不值，连件衬衣也洗不干净。外面坐着一个讨饭姑娘，我敢说，她一个人比你们这一大群更会洗。姑娘，进来！
        - id: ch07-b10
          speaker: narrator
          text: 姑娘走进来了。王子把那件已经黑透的衬衣拿给她看。
        - id: ch07-b11
          speaker: white_bear_prince
          text: 姑娘，你能把这件衬衣洗干净吗？
        - id: ch07-b12
          speaker: girl
          text: 我也不知道，不过我想，我能洗好。
        - id: ch07-b13
          speaker: narrator
          text: 姑娘接过衬衣，几乎才刚把它浸进水里，衣服就白得像刚落下的新雪，甚至比雪还要洁白。
        - id: ch07-b14
          speaker: white_bear_prince
          text: 对，你才是我要娶的姑娘。
          emotion: happy
        - id: ch07-b15
          speaker: narrator
          text: 王子的继母听见这句话，气得当场炸裂。长鼻子公主也跟着炸裂，随后，那一大群山怪全都炸裂了。至少从那以后，我再没听到过他们的半点消息。
        - id: ch07-b16
          speaker: narrator
          text: 至于王子和姑娘，他们释放了所有被掳来、关在城堡里的可怜基督徒，又带走全部金银，尽可能远地离开了那座位于太阳东边、月亮西边的城堡。
