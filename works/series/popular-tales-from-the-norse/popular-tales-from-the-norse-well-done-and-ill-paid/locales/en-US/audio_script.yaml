audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: thoughtful and gently wry
        timbre: warm and clear
        pace: measured
        pitch: medium
    eric:
      display_name: Eric
      tts:
        delivery: honest and easily worried
        timbre: plain and sturdy
        pace: moderate
        pitch: medium
    bear:
      display_name: Bear
      tts:
        delivery: threatening but quick to panic
        timbre: deep and heavy
        pace: measured
        pitch: low
    fox:
      display_name: Fox
      tts:
        delivery: clever and confidently playful
        timbre: bright and nimble
        pace: lively
        pitch: medium-high
    old_dame:
      display_name: Old Dame
      tts:
        delivery: sharp and practical
        timbre: weathered and firm
        pace: brisk
        pitch: medium
  chapters:
    - id: ch01
      title: The Bear's Bargain
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Once upon a time, a man named Eric drove his horse and sledge into the woods to fetch fuel. Before he could bring the firewood home, he met a Bear.
        - id: ch01-b02
          speaker: bear
          text: Hand over your horse, or by summer I'll strike every one of your sheep dead.
        - id: ch01-b03
          speaker: eric
          text: Heaven help me! We haven't one stick of firewood at home. Please let me take back this load, or we'll freeze to death. I'll bring you the horse tomorrow morning.
        - id: ch01-b04
          speaker: narrator
          text: The Bear agreed to let him carry the firewood home. That was their bargain. But once again, he warned Eric that if he failed to return, all his sheep would be dead by summer. Eric loaded the wood onto the sledge and rattled toward home. As you may imagine, he was not at all pleased with the bargain he had made. While he was still worrying over it, a Fox met him on the road.
        - id: ch01-b05
          speaker: fox
          text: What's wrong with you? Why do you look so miserable?
        - id: ch01-b06
          speaker: eric
          text: I met a Bear farther up in the woods. I had to promise I'd bring Dobbin back tomorrow at this very hour. If the Bear doesn't get him, he says he'll tear all my sheep to death before summer.
        - id: ch01-b07
          speaker: fox
          text: Is that all? Give me your fattest wether, and I'll soon get you out of this trouble. Just wait and see.
        - id: ch01-b08
          speaker: narrator
          text: Eric promised the Fox his fattest wether. He gave his word and swore he would keep it too.
        - id: ch01-b09
          speaker: fox
          text: Tomorrow, when you bring Dobbin to the Bear, I'll make a great clatter in that heap of stones. When the Bear asks what the noise is, tell him it's Peter the Marksman, the finest shot in the world. After that, you'll have to do your part.
    - id: ch02
      title: Peter the Marksman
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: The next day Eric set out with Dobbin, just as he had promised. He came back to the same place in the woods and met the Bear. Then, right on time, something began making a great clatter in the heap of stones nearby.
        - id: ch02-b02
          speaker: bear
          text: Hush! What's that noise?
        - id: ch02-b03
          speaker: eric
          text: Why, that must be Peter the Marksman coming through the woods. He's the best shot in the whole world. I'd know him anywhere from the sound of his voice.
        - id: ch02-b04
          speaker: fox
          text: Eric! Have you seen any bears around there?
        - id: ch02-b05
          speaker: bear
          text: Tell him no!
          emotion: fearful
        - id: ch02-b06
          speaker: eric
          text: No, I haven't seen a single bear.
        - id: ch02-b07
          speaker: fox
          text: Then what's that thing standing beside your sledge?
        - id: ch02-b08
          speaker: bear
          text: Say I'm an old fir stump.
          emotion: fearful
        - id: ch02-b09
          speaker: eric
          text: Oh, that's nothing but an old fir stump.
        - id: ch02-b10
          speaker: fox
          text: In my country, we roll fir stumps onto our sledges. If you can't manage it alone, I'll come and help you.
        - id: ch02-b11
          speaker: bear
          text: Tell him you can do it yourself, and roll me onto the sledge.
          emotion: fearful
        - id: ch02-b12
          speaker: eric
          text: No, thank you. I can manage it perfectly well by myself.
        - id: ch02-b13
          speaker: narrator
          text: Eric bent to the task and rolled the great heavy Bear onto the sledge, just as though he really were a fir stump.
        - id: ch02-b14
          speaker: fox
          text: Where I come from, we always tie fir stumps down tightly on our sledges. Do you want me to come and help?
        - id: ch02-b15
          speaker: bear
          text: Say you can do it, and tie me down tight. Hurry!
          emotion: fearful
        - id: ch02-b16
          speaker: eric
          text: No, thanks. I can handle that on my own.
        - id: ch02-b17
          speaker: narrator
          text: Eric took every rope he had and wound them around the Bear. He pulled each one tight and tied it fast. By the time he finished, the Bear could not stir so much as a single paw.
        - id: ch02-b18
          speaker: fox
          text: We always drive our axes into fir stumps in my country. It helps us guide them down the steep slopes.
        - id: ch02-b19
          speaker: bear
          text: Pretend to drive your axe into me. Go on!
          emotion: fearful
        - id: ch02-b20
          speaker: narrator
          text: The Bear expected Eric only to pretend. But Eric took up his axe and struck for real. With one blow, he split the Bear's skull, and the Bear was dead in an instant. That was how the Fox set Dobbin free. Afterward, Eric and the Fox were great friends and on the very best of terms.
    - id: ch03
      title: A Promise at the Farm
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: When they came near the farm, the Fox stopped.
        - id: ch03-b02
          speaker: fox
          text: I don't care to go all the way home with you. I can't say I like your dogs. I'll wait here while you fetch the wether. Be sure you choose a fine, fat one.
        - id: ch03-b03
          speaker: narrator
          text: Eric assured the Fox that he would choose a good fat wether. He thanked him warmly for all his help, then went home and put Dobbin safely in the stable. After that, he started across the farmyard toward the sheepfold.
        - id: ch03-b04
          speaker: old_dame
          text: Where are you off to now?
        - id: ch03-b05
          speaker: eric
          text: I'm only going to fetch a fat wether for that clever Fox. He saved Dobbin for us, and I gave him my word.
        - id: ch03-b06
          speaker: old_dame
          text: A wether for that thieving Fox? Not one of ours will he get! We already have Dobbin safe, and we got the Bear into the bargain. I'll wager the Fox has stolen more of our geese than a wether is worth. And even if he hasn't stolen them yet, he certainly will. No, take two of your fastest hounds, put them in a sack, and turn them loose on him. Then perhaps we'll be rid of that robber Reynard.
        - id: ch03-b07
          speaker: narrator
          text: Eric thought the old dame's plan was good advice. So he chose two fleet red hounds, put both of them into a sack, and carried it away to the place where the Fox was waiting.
    - id: ch04
      title: Well Done and Ill Paid
      blocks:
        - id: ch04-b01
          speaker: fox
          text: Did you bring the wether?
        - id: ch04-b02
          speaker: eric
          text: Yes. Come and take it.
        - id: ch04-b03
          speaker: narrator
          text: The Fox came forward to claim his promised reward. Eric opened the sack as if the wether were inside, untied it, and let both hounds loose after him.
        - id: ch04-b04
          speaker: fox
          text: HUF! The old saying is true. Well done is often ill paid. And now I see the truth of another saying too. The worst foes are those of one's own house!
          emotion: surprised
        - id: ch04-b05
          speaker: narrator
          text: That was what the Fox cried as he made one great spring and ran for his life. Behind him came the two red, fox-colored hounds, racing close at his heels.
