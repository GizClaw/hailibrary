audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 从容而清醒，带一点克制的诙谐
        timbre: 温厚清晰
        pace: 舒缓有致
        pitch: 中低
    eric:
      display_name: 埃里克
      tts:
        delivery: 朴实厚道，遇事略显迟疑
        timbre: 温和粗朴
        pace: 中等
        pitch: 中低
    bear:
      display_name: 熊
      tts:
        delivery: 蛮横威吓，危急时慌忙催促
        timbre: 粗重低沉
        pace: 稍慢
        pitch: 低
    fox:
      display_name: 狐狸
      tts:
        delivery: 机灵笃定，语气里带着狡黠
        timbre: 明亮灵活
        pace: 稍快
        pitch: 中高
    wife:
      display_name: 老伴
      tts:
        delivery: 泼辣果断，说话干脆利落
        timbre: 清晰有力
        pace: 稍快
        pitch: 中
  chapters:
    - id: ch01
      title: 林中的交易
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 从前有个男人。有一天，他赶着雪橇进林子拉柴，半路遇见了一头熊。
        - id: ch01-b02
          speaker: bear
          text: 把马交给我，不然等到夏天，我就把你的羊全打死。
        - id: ch01-b03
          speaker: eric
          text: 老天保佑！我家里连一根柴也没有。你先让我拉一车回家吧，要不然我们一家都会冻死。明天早晨，我一定把马带来。
        - id: ch01-b04
          speaker: narrator
          text: 熊答应了。男人可以先把柴拉回家，不过条件已经说定，明早必须带着马回来。熊又警告他，要是敢失约，入夏之前，他的羊一只也别想活。男人装好木柴，赶着雪橇叮叮当当地回家。你想也知道，这桩交易可没法叫人高兴。他一路满面愁容，就在这时，一只狐狸迎面走来。
        - id: ch01-b05
          speaker: fox
          text: 你这是怎么了？干吗愁眉苦脸的？
        - id: ch01-b06
          speaker: eric
          text: 你既然想知道，我就告诉你。我在那边林子里碰见一头熊，只好答应明天还是这个时辰，把马送回来给他。要是他得不到马，就要在夏天以前撕死我所有的羊。
        - id: ch01-b07
          speaker: fox
          text: 嗐，我还以为多大的事！你答应把最肥的阉公羊给我，我马上就能帮你脱身。你只管等着瞧。
        - id: ch01-b08
          speaker: narrator
          text: 埃里克答应了，还发誓绝不反悔。
        - id: ch01-b09
          speaker: fox
          text: 明天你牵着马去见熊，我就藏进那边那堆石头，弄得哗啦哗啦响。熊要是问那是什么声音，你就说那是神枪手彼得，他的枪法世上第一。再往后，你就自己见机行事。
    - id: ch02
      title: 神枪手彼得
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 第二天，男人果然牵着马动身了。他刚见到熊，那堆石头里便哗啦哗啦响了起来。
        - id: ch02-b02
          speaker: bear
          text: 嘘！那是什么声音？
        - id: ch02-b03
          speaker: eric
          text: 那当然是神枪手彼得。他的枪法天下第一，我一听他的声音就认出来了。
        - id: ch02-b04
          speaker: fox
          text: 埃里克，这附近有没有熊？
        - id: ch02-b05
          speaker: bear
          text: 快告诉他，你没看见熊！
        - id: ch02-b06
          speaker: eric
          text: 没有，我没见到什么熊。
        - id: ch02-b07
          speaker: fox
          text: 那么，你雪橇旁边站着的是什么？
        - id: ch02-b08
          speaker: bear
          text: 你就说，那是个老冷杉树桩。
        - id: ch02-b09
          speaker: eric
          text: 那只是个老冷杉树桩。
        - id: ch02-b10
          speaker: fox
          text: 在我们那儿，碰上这种冷杉树桩，都要把它滚到雪橇上。你要是一个人弄不动，我这就过来搭把手。
        - id: ch02-b11
          speaker: bear
          text: 快说你自己行，再把我滚上雪橇。
        - id: ch02-b12
          speaker: eric
          text: 不劳你过来，我一个人应付得了。
        - id: ch02-b13
          speaker: narrator
          text: 说着，埃里克便把熊滚上了雪橇。
        - id: ch02-b14
          speaker: fox
          text: 在我们那儿，这种冷杉树桩装上雪橇以后，总得用绳子牢牢捆住。你要是忙不过来，要不要我过去帮你？
        - id: ch02-b15
          speaker: bear
          text: 快说不用，再拿绳子把我牢牢绑住。
        - id: ch02-b16
          speaker: eric
          text: 多谢，我自己捆得好。
        - id: ch02-b17
          speaker: narrator
          text: 埃里克把带来的绳子全拿出来，一圈又一圈，将熊捆得结结实实。等他停手时，熊连一只爪子也动不了了。
        - id: ch02-b18
          speaker: fox
          text: 在我们那一带，遇到这种冷杉树桩，还总要拿斧头砍进去。这样拉着雪橇下陡坡时，才能更好地掌握方向。
        - id: ch02-b19
          speaker: bear
          text: 你装装样子，把斧头往我身上砍吧。
        - id: ch02-b20
          speaker: narrator
          text: 埃里克抄起斧头，一下劈开了熊的脑袋。熊当场倒在雪橇上，再也一动不动，转眼就断了气。打那以后，埃里克和狐狸成了最要好的朋友，两人相处得再好不过。
    - id: ch03
      title: 好心没好报
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 可他们快走到农庄时，狐狸停了下来。
        - id: ch03-b02
          speaker: fox
          text: 我就不跟你一直走到家门口了，老实说，我不太喜欢你家的狗。我在这里等，你去把答应我的公绵羊牵来。记住，一定要挑只又肥又好的。
        - id: ch03-b03
          speaker: narrator
          text: 埃里克满口答应，说自己一定照办，又好好谢过狐狸。回到家，他先把马儿安顿好，接着便朝羊圈走去。
        - id: ch03-b04
          speaker: wife
          text: 你这是要去哪儿？
        - id: ch03-b05
          speaker: eric
          text: 我只是去羊圈牵一只肥公羊，送给那只聪明的狐狸。是他帮忙救了咱们的马儿，我亲口答应过，要用一只公绵羊报答他。
        - id: ch03-b06
          speaker: wife
          text: 你还真要送？那偷东西的狐狸一只羊也别想拿走！咱们不是已经保住了马吗，还白得了一头熊。我敢说，他从咱家偷走的鹅，早就不止一只公绵羊的价钱。就算以前没偷过，往后也准会偷。不行！把两只跑得最快的猎狗装进口袋，带去放出来追他。说不定这回就能摆脱那个贼狐狸。
        - id: ch03-b07
          speaker: narrator
          text: 埃里克听完，觉得老伴说得很有道理。他挑出两只跑得飞快的红毛猎狗，把它们装进袋子，背着袋子去见狐狸。
        - id: ch03-b08
          speaker: fox
          text: 公绵羊带来了吗？
        - id: ch03-b09
          speaker: eric
          text: 带来了，你过来拿吧。
        - id: ch03-b10
          speaker: narrator
          text: 埃里克把狐狸叫到近前，随即解开袋口。两只猎狗一下蹿了出去。狐狸一看不对，猛地跳开，撒腿便逃。
        - id: ch03-b11
          speaker: fox
          text: 呼！老话说得真对，好心常常没好报！现在我也明白了，最坏的敌人，原来都出在自己家里。
        - id: ch03-b12
          speaker: narrator
          text: 狐狸一边喊出这两句老话，一边没命地飞奔。他回头一看，两只红毛猎狗正在身后紧追不舍。
