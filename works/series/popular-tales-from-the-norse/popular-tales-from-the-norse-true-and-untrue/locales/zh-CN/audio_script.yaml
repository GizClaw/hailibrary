audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 从容而清醒，带一点克制的诙谐
        timbre: 温厚清晰
        pace: 舒缓有致
        pitch: 中低
    "true":
      display_name: 诚实
      tts:
        delivery: 坦荡温和，受苦时仍守住分寸
        timbre: 清朗朴实
        pace: 平稳
        pitch: 中
    untrue:
      display_name: 虚假
      tts:
        delivery: 油滑刻薄，得意时咄咄逼人
        timbre: 尖薄干涩
        pace: 稍快
        pitch: 中高
    bear:
      display_name: 棕熊
      tts:
        delivery: 威严沉着，话语有领头者的分量
        timbre: 粗厚低沉
        pace: 缓慢
        pitch: 低
    wolf:
      display_name: 灰腿狼
      tts:
        delivery: 笃定直接，语气略显冷峻
        timbre: 沙哑结实
        pace: 适中
        pitch: 中低
    fox:
      display_name: 滑头狐狸
      tts:
        delivery: 机敏圆滑，话里带着轻巧的盘算
        timbre: 明亮纤细
        pace: 灵活
        pitch: 中高
    hare:
      display_name: 长耳兔
      tts:
        delivery: 细声谨慎，开口时略带羞怯
        timbre: 轻柔细亮
        pace: 稍快
        pitch: 高
    king:
      display_name: 英格兰国王
      tts:
        delivery: 有君王的威势，喜怒都直截了当
        timbre: 洪亮厚实
        pace: 适中
        pitch: 中低
    attendant_1:
      display_name: 侍从甲
      tts:
        delivery: 警醒利落，喊话清楚有力
        timbre: 清亮
        pace: 快
        pitch: 中
    attendant_2:
      display_name: 侍从乙
      tts:
        delivery: 警醒利落，喊话清楚有力
        timbre: 扎实
        pace: 快
        pitch: 中低
  chapters:
    - id: ch01
      title: 兄弟上路
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 从前有兄弟两个，哥哥叫诚实，弟弟叫虚假。诚实心地正直，待谁都好。虚假却满嘴谎话，心眼也坏，谁都不敢信他。母亲守寡以后，家里穷得过不下去。等两个儿子长大，她只好让他们出门，各自到世上找活路。兄弟俩一人背着一只小口袋，里面装着不多的一点食物，就这样走了。
        - id: ch01-b02
          speaker: narrator
          text: 他们走了一整天。傍晚到了林子里，两人坐在一棵倒下的树上，拿出干粮。这一路走下来，他们饿得厉害，这时候不管吃什么，都觉得香甜。
        - id: ch01-b03
          speaker: untrue
          text: 咱们先吃你袋里的吧。等你的吃光了，再吃我的。你要是同意，就这么办。
        - id: ch01-b04
          speaker: narrator
          text: 诚实痛快地答应了。两个人开始吃，虚假只管把最好的塞进自己嘴里，剩给哥哥的尽是烤焦的硬皮和碎渣。
        - id: ch01-b05
          speaker: narrator
          text: 第二天，早饭吃的还是诚实带的东西，午饭也一样。到了这时，他的口袋已经空了。他们一直走到深夜，又该吃东西了。诚实想从弟弟的口袋里拿一点，虚假却马上拒绝，说那是自己的食物，只够一个人吃。
        - id: ch01-b06
          speaker: "true"
          text: 可我袋里还有吃的那会儿，你每一顿都跟着吃了呀。
        - id: ch01-b07
          speaker: untrue
          text: 你倒真会说！是你自己犯蠢，看着人家吃光你的东西也不拦。现在后悔也晚了，你就坐在这儿挨饿吧，没别的办法。
        - id: ch01-b08
          speaker: "true"
          text: 好吧。你叫虚假，天性也是虚假。你从前这样，这辈子永远都会这样。
        - id: ch01-b09
          speaker: narrator
          text: 虚假听了，气得暴跳起来。他扑向哥哥，挖掉了哥哥的两只眼睛。
        - id: ch01-b10
          speaker: untrue
          text: 现在你再看啊！你还能分得清谁真谁假吗，你这只瞎秃鹫！
          emotion: angry
        - id: ch01-b11
          speaker: narrator
          text: 骂完这句话，虚假跑了，只留下哥哥一个人。可怜的诚实双眼已瞎，只能在茂密的林子里摸索着走。他孤零零的，连该往哪边去也几乎不知道。忽然，他摸到一棵枝叶繁盛的大椴树，便想爬上去坐一夜，免得被野兽伤害。
        - id: ch01-b12
          speaker: "true"
          text: 等鸟儿唱起来，我就知道天亮了。到时候，我再摸索着往前走。
        - id: ch01-b13
          speaker: narrator
          text: 他爬上椴树，刚坐了没多久，就听见有人来到树下，弄出一阵响动。随后又来了几个。从彼此问候的声音里，他听出来了。来的是棕熊、灰腿狼、滑头狐狸和长耳兔，他们要在这里过圣约翰节前夜。
    - id: ch02
      title: 椴树下的秘密
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 四只野兽在树下吃吃喝喝，快活了一阵。吃完以后，它们闲聊起来。到最后，狐狸先提了一件事。
        - id: ch02-b02
          speaker: fox
          text: 咱们都坐在这儿了，不如每人说一个秘密，怎么样？
        - id: ch02-b03
          speaker: narrator
          text: 大家都赞成，觉得一定很有趣。棕熊第一个开口。你想也猜得到，在这群野兽中，它就是大王。
        - id: ch02-b04
          speaker: bear
          text: 英格兰国王的眼睛坏得很，一码以外的东西，他几乎什么也看不清。只要他清早来到这棵椴树下，趁叶子上的露水还没干，用露水擦擦眼睛，视力马上就能恢复，跟从前一模一样。
        - id: ch02-b05
          speaker: wolf
          text: 一点没错！英格兰国王还有个女儿，又聋又哑。要是国王知道我的秘密，很快也能把她治好。去年，公主领圣餐的时候，有一小块圣餐面包从她嘴里掉出来，让一只大癞蛤蟆吞了。只要挖开教堂圣坛前的地板，就能在圣坛围栏下面找到那只癞蛤蟆。面包到现在还卡在它喉咙里。剖开癞蛤蟆，取出面包，让公主吃下去，她就能像别人一样说话，也能听见声音。
        - id: ch02-b06
          speaker: fox
          text: 你说得对。不过英格兰国王要是知道我的秘密，王宫里就不会缺水了。他家宫院那块大石头下面，藏着一眼清得不能再清的泉水，只是他不知道该往那里挖。
        - id: ch02-b07
          speaker: hare
          text: 英格兰国王有全国最好的果园，可园里连一颗野苹果也不结。那是因为有一条沉重的金链，绕着果园埋了整整三圈。只要把金链挖出来，全国再也找不到收成那么好的果园了。
        - id: ch02-b08
          speaker: fox
          text: 我想你说得一点也没错。不过天太晚了，咱们还是各自回家吧。
        - id: ch02-b09
          speaker: narrator
          text: 于是，野兽们一同离开了。
        - id: ch02-b10
          speaker: narrator
          text: 它们走后，诚实在树上睡着了。黎明时，鸟儿开始歌唱，他也醒了。他摘下叶子，用上面的露水擦了擦眼睛。果然，两只眼睛一下就好了，和被虚假挖掉以前一模一样。
    - id: ch03
      title: 王宫里的泉水与露水
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 诚实径直去了英格兰国王的王宫，请国王给自己一份差事，当场就得到了。有一天，国王走进宫院，来回走了一阵，想从水泵里打些水喝。天气很热，他渴得厉害。可仆人倒来的水又浑又脏，还带着臭味。国王一见，恼火极了。
        - id: ch03-b02
          speaker: king
          text: 我走遍全国，也找不出谁家院里的水比我的更糟！我还专门铺了水管，翻过山，从很远的地方把水引来呢。
          emotion: angry
        - id: ch03-b03
          speaker: "true"
          text: 陛下，那倒很可能。不过您只要给我几个人，让他们帮我挖起院子中央的大石头，很快就能见到又多又好的水。
        - id: ch03-b04
          speaker: narrator
          text: 国王当然愿意。他们把大石头彻底搬开，又向下挖了一会儿。一股清泉猛地喷向空中，水又足又清，简直像从喷水管里涌出来的。整个英格兰，再也没有比这更清澈的水了。
        - id: ch03-b05
          speaker: narrator
          text: 过了不久，国王又来到宫院。忽然，一只大鹰追着他养的小鸡飞过来。侍从们拍着手，一齐大喊。
        - id: ch03-b06
          speakers: [attendant_1, attendant_2]
          ensemble: duo
          text: 它飞到那边了！它飞到那边了！
        - id: ch03-b07
          speaker: narrator
          text: 国王抓起枪，想把鹰打下来，可他的眼睛看不了那么远，心里难过万分。
        - id: ch03-b08
          speaker: king
          text: 但愿上天送来一个人，告诉我怎样治好眼睛！再这样下去，我怕自己很快就要彻底瞎了！
          emotion: sad
        - id: ch03-b09
          speaker: "true"
          text: 陛下，我现在就能把药方告诉您。
        - id: ch03-b10
          speaker: narrator
          text: 诚实接着讲了自己怎样治好双眼。你想也猜得到，就在当天下午，国王动身去了那棵椴树。第二天一早，他把叶上的露水擦在眼睛上，双眼立刻痊愈。从那以后，国王最看重的人就是诚实。无论留在国内，还是出门远行，国王都要诚实陪在身边。
        - id: ch03-b11
          speaker: narrator
          text: 一天，两个人在果园里散步。国王望着那些树，又说起了心中的烦恼。
        - id: ch03-b12
          speaker: king
          text: 我真是想不明白，怎么也想不明白！全英格兰没有谁在果园上花的钱比我更多，可这些树偏偏连一颗野苹果也不结。
        - id: ch03-b13
          speaker: "true"
          text: 这不难办。只要您把绕着果园盘了三圈的东西送给我，再派些人帮我挖出来，您的果园自然会结满果子。
        - id: ch03-b14
          speaker: narrator
          text: 国王高兴地答应了。诚实叫人动手挖，最后挖出了一整条金链。这么一来，诚实成了富翁，甚至比国王还要富有。国王却仍旧十分满意，因为从此以后，果园里果实累累，树枝一直压到地面。那样香甜的苹果和梨，从来没有人吃过。
    - id: ch04
      title: 公主与婚宴
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 又有一天，国王和诚实边走边谈，公主正好从他们身旁经过。国王一看见女儿，神情便黯淡下来。
        - id: ch04-b02
          speaker: king
          text: 这么美丽的一位公主，却不能说话，也听不见声音。你说，这多可惜啊！
          emotion: sad
        - id: ch04-b03
          speaker: "true"
          text: 是很可惜。不过，她的病有办法治好。
        - id: ch04-b04
          speaker: narrator
          text: 国王听了，喜出望外，立刻答应诚实，只要能让公主恢复正常，就把女儿嫁给他，还拿半个王国作陪嫁。诚实带着几个人走进教堂，挖出了蹲在圣坛围栏下面的癞蛤蟆。他剖开癞蛤蟆，拿出那块面包，交给国王的女儿吃下。从那一刻起，公主就能开口说话，像平常人一样交谈了。
        - id: ch04-b05
          speaker: narrator
          text: 诚实马上就要迎娶公主。人们开始准备婚宴，那么盛大的宴席，从来没有人见过。消息很快传遍了全国。婚礼舞正跳得热闹时，一个年轻乞丐走了进来，向人讨一口吃的。他衣服破烂，模样凄惨，人人见了都在胸前画十字。诚实却一眼认出来了。这个乞丐正是弟弟虚假。
        - id: ch04-b06
          speaker: "true"
          text: 你还认得我吗？
        - id: ch04-b07
          speaker: untrue
          text: 我这种人，怎么可能见过您这样了不起的大老爷？
        - id: ch04-b08
          speaker: "true"
          text: 你当然见过我。去年的今天，就是你挖掉了我的两只眼睛。你叫虚假，天性也是虚假。从前我这样说，今天我还是这样说。不过，你到底是我的弟弟，我会给你一些食物。吃完以后，你可以去找去年我坐过的那棵椴树。要是听见了什么能给你带来好处的事，那就算你的运气。
    - id: ch05
      title: 虚假重返椴树
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 虚假听一遍就明白了。他心里盘算起来。
        - id: ch05-b02
          speaker: untrue
          text: 诚实只在那棵椴树上坐了一夜，就捞到这么多好处。一年之内，他都成了半个英格兰的国王。那我能得到多少好处啊？
        - id: ch05-b03
          speaker: narrator
          text: 于是，虚假动身进了林子，也爬上那棵椴树。他坐了没多久，野兽们就像上次一样，全来到树下，吃吃喝喝，欢度圣约翰节前夜。等它们吃完，狐狸又提议大家讲秘密。虚假赶紧竖起耳朵，拼命去听，简直连耳朵都快掉下来了。可是棕熊满脸不高兴，只在喉咙里低低地咆哮。
        - id: ch05-b04
          speaker: bear
          text: 去年我们说的话，已经让人泄露出去了。所以今天，不管知道什么，我们一个字也不会再说。
          emotion: angry
        - id: ch05-b05
          speaker: narrator
          text: 野兽们互道晚安，随后各自散去。虚假仍旧和从前一样，什么也没有多知道。
        - id: ch05-b06
          speaker: narrator
          text: 因为他叫虚假，天性也同样虚假。
