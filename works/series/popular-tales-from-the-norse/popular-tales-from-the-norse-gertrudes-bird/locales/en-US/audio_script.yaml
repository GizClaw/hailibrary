audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: thoughtful and gently wry
        timbre: warm and clear
        pace: measured
        pitch: medium
    gertrude:
      display_name: Gertrude
      tts:
        delivery: blunt and grudging
        timbre: mature and firm
        pace: measured
        pitch: medium
    lord:
      display_name: Our Lord
      tts:
        delivery: grave and commanding
        timbre: deep and clear
        pace: unhurried
        pitch: medium-low
  chapters:
    - id: ch01
      title: The Hungry Travelers
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Long ago, when our Lord and Saint Peter walked the earth, they came to the home of an old woman named Gertrude. She was baking, with a red cap on her head. The travelers had come a long way, and both were hungry. Our Lord pleaded with her for a bannock, just enough to ease their hunger.
        - id: ch01-b02
          speaker: gertrude
          text: Yes, you may have one.
        - id: ch01-b03
          speaker: narrator
          text: Gertrude pinched off a tiny piece of dough and rolled it out. But the more she rolled, the more it grew, until it covered the whole griddle.
    - id: ch02
      title: Every Bannock Too Big
      blocks:
        - id: ch02-b01
          speaker: gertrude
          text: No, that one is far too big. You cannot have it.
        - id: ch02-b02
          speaker: narrator
          text: So she pinched off an even smaller bit of dough. She rolled it out, and it covered the griddle too. Gertrude decided that bannock was also too big to give away.
        - id: ch02-b03
          speaker: narrator
          text: She tried a third time with a piece so tiny it could hardly be seen. Yet once again, the bannock spread across the whole griddle.
        - id: ch02-b04
          speaker: gertrude
          text: I cannot give you anything after all. You will have to go hungry. Every one of these bannocks is too big.
    - id: ch03
      title: Gertrude's Punishment
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: Our Lord grew angry with her.
        - id: ch03-b02
          speaker: lord
          text: You cared so little for me that you would not spare one morsel of food. This will be your punishment. You shall become a bird and search for your meals between the bark and the tree trunk. You shall never have a drop to drink unless it rains.
          emotion: angry
        - id: ch03-b03
          speaker: narrator
          text: He had barely spoken the last word when Gertrude changed into a great black woodpecker, the bird people call Gertrude's bird. She flew straight from her kneading trough and up the chimney.
    - id: ch04
      title: Gertrude's Bird
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: Even now, you may see her flying about. The red cap is still on her head, while her body is black from the soot in the chimney. She hacks and taps at the trees to find her food. She is always thirsty, so when rain is on the way, she whistles and watches for a drop to cool her tongue.
