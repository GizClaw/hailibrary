  chapters:
    - id: ch01
      title: The Silver Knife
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Once there was an old wife who sat baking. She had a little son, so plump and so fond of good things that everyone called him Buttercup. She also had a dog named Goldtooth. As she baked, Goldtooth suddenly began to bark.
        - id: ch01-b02
          speaker: mother
          text: Run outside, Buttercup, dear, and see what Goldtooth is barking at.
        - id: ch01-b03
          speaker: narrator
          text: Buttercup ran out. In a moment he came rushing back with a cry.
        - id: ch01-b04
          speaker: buttercup
          text: Oh, Heaven help us! A huge witch is coming. She's carrying her head under one arm, and she has a bag on her back!
          emotion: fearful
        - id: ch01-b05
          speaker: mother
          text: Quick, get under the kneading trough and hide.
        - id: ch01-b06
          speaker: narrator
          text: Buttercup hid, and in walked the old hag.
        - id: ch01-b07
          speaker: hag
          text: Good day to you.
        - id: ch01-b08
          speaker: mother
          text: God bless you.
        - id: ch01-b09
          speaker: hag
          text: Is Buttercup home today?
        - id: ch01-b10
          speaker: mother
          text: No, he isn't. He's in the woods with his father, hunting ptarmigan.
        - id: ch01-b11
          speaker: hag
          text: What a plague! I brought him a lovely little silver knife.
        - id: ch01-b12
          speaker: buttercup
          text: Pip, pip! I'm right here!
        - id: ch01-b13
          speaker: narrator
          text: Out he came from under the trough.
        - id: ch01-b14
          speaker: hag
          text: My back is old and stiff. You'll have to crawl into the bag and get the knife yourself.
        - id: ch01-b15
          speaker: narrator
          text: As soon as Buttercup was deep inside, the hag tossed the bag over her back and strode away. After she had carried him quite a distance, she grew tired.
        - id: ch01-b16
          speaker: hag
          text: How much farther is it to Snoring?
        - id: ch01-b17
          speaker: buttercup
          text: Half a mile.
        - id: ch01-b18
          speaker: narrator
          text: The hag set the bag beside the road. She went off alone into the woods and lay down to sleep. While she slept, Buttercup used his knife to cut a hole in the bag. He crawled out, stuffed a great fir-tree root in his place, and ran home to his mother. When the hag reached her own house and opened the bag, she found the root. You can imagine how furious she was.
    - id: ch02
      title: The Silver Spoon
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: The next day, the old wife sat baking again. Just as before, Goldtooth began to bark.
        - id: ch02-b02
          speaker: mother
          text: Go and look, Buttercup, my boy. See what Goldtooth is barking at.
        - id: ch02-b03
          speaker: narrator
          text: The moment Buttercup stepped outside, he cried out.
        - id: ch02-b04
          speaker: buttercup
          text: Well, I never! That ugly old creature is coming back, with her head under her arm and a big bag on her back!
          emotion: surprised
        - id: ch02-b05
          speaker: mother
          text: Under the kneading trough, quickly. Hide yourself.
        - id: ch02-b06
          speaker: narrator
          text: Buttercup ducked out of sight, and the hag came in.
        - id: ch02-b07
          speaker: hag
          text: Good day! Is Buttercup home today?
        - id: ch02-b08
          speaker: mother
          text: I'm sorry, but he isn't. He's in the woods with his father, hunting ptarmigan.
        - id: ch02-b09
          speaker: hag
          text: How tiresome! I have a beautiful little silver spoon for him.
        - id: ch02-b10
          speaker: buttercup
          text: Pip, pip! Here I am!
        - id: ch02-b11
          speaker: narrator
          text: Buttercup crept out.
        - id: ch02-b12
          speaker: hag
          text: My back is terribly stiff. Crawl into the bag and take the spoon out yourself.
        - id: ch02-b13
          speaker: narrator
          text: Once Buttercup was well inside, the hag swung the bag onto her shoulders. She hurried toward home as fast as she could, but after a good long way she became weary.
        - id: ch02-b14
          speaker: hag
          text: How far is Snoring from here?
        - id: ch02-b15
          speaker: buttercup
          text: A mile and a half.
        - id: ch02-b16
          speaker: narrator
          text: Again the hag put down the bag and went into the woods for a nap. While she slept, Buttercup cut his way out and replaced himself with a great stone. Back home, the witch built a roaring fire, set a large pot over it, and prepared to boil Buttercup. She lifted the bag, ready to tip the boy into the pot. Instead, the stone crashed through the pot's bottom. All the water poured over the hearth and put out the fire. The hag flew into a dreadful rage.
        - id: ch02-b17
          speaker: hag
          text: Next time he won't trick me, no matter how heavy he makes himself!
          emotion: angry
    - id: ch03
      title: The Silver Fork
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: On the third day, everything began just as it had twice before. Goldtooth barked, and Buttercup's mother called to him.
        - id: ch03-b02
          speaker: mother
          text: Please run out and see what our dog is barking at.
        - id: ch03-b03
          speaker: narrator
          text: Buttercup went out, but soon came hurrying back.
        - id: ch03-b04
          speaker: buttercup
          text: Heaven save us! The old hag is coming again, with her head under her arm and a sack on her back!
          emotion: fearful
        - id: ch03-b05
          speaker: mother
          text: Jump under the kneading trough and hide.
        - id: ch03-b06
          speaker: narrator
          text: He hid. The hag stepped through the door.
        - id: ch03-b07
          speaker: hag
          text: Good day! Is Buttercup at home today?
        - id: ch03-b08
          speaker: mother
          text: How kind of you to ask, but he's in the woods with his father, hunting ptarmigan.
        - id: ch03-b09
          speaker: hag
          text: Oh, what a bother! I've brought him such a beautiful little silver fork.
        - id: ch03-b10
          speaker: buttercup
          text: Pip, pip! Here I am!
        - id: ch03-b11
          speaker: narrator
          text: Once more, Buttercup came out from under the trough.
        - id: ch03-b12
          speaker: hag
          text: My back is so stiff. You must crawl into the sack and fetch the fork yourself.
        - id: ch03-b13
          speaker: narrator
          text: When Buttercup was safely inside, the hag heaved the sack across her shoulders and hurried away. This time she never stopped to sleep. She carried Buttercup straight home. It was Sunday when they arrived.
        - id: ch03-b14
          speaker: hag
          text: Take Buttercup, kill him, and boil him properly before I return. I'm going to church to invite my guests to dinner.
        - id: ch03-b15
          speaker: narrator
          text: The hag left for church, and everyone else in the house went too. Her daughter was supposed to kill Buttercup, but she had no idea how to begin.
        - id: ch03-b16
          speaker: buttercup
          text: Wait. I'll show you exactly what to do. Put your head down on the chopping block, and then you'll see.
        - id: ch03-b17
          speaker: narrator
          text: The foolish girl laid her head on the block. Buttercup seized an axe and chopped it off as easily as if she were a chicken. He placed her head in the bed, put her body into the pot, and boiled it well. Then he climbed onto the roof. He dragged the fir-tree root and the stone up after him, setting one above the door and the other at the top of the chimney.
