audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 从容而清醒，带一点克制的诙谐
        timbre: 温厚清晰
        pace: 舒缓有致
        pitch: 中低
    buttercup:
      display_name: 毛茛儿
      tts:
        delivery: 贪嘴机灵，遇险时镇定大胆
        timbre: 圆润清亮
        pace: 中等偏快
        pitch: 中高
    mother:
      display_name: 毛茛儿的母亲
      tts:
        delivery: 朴实慈爱，答话沉着自然
        timbre: 温暖厚实
        pace: 中等
        pitch: 中
    troll_witch:
      display_name: 老巫婆
      tts:
        delivery: 狡猾凶狠，恼怒时尖厉暴躁
        timbre: 苍老沙哑
        pace: 中等
        pitch: 中低
    witch_husband:
      display_name: 老巫婆的丈夫
      tts:
        delivery: 粗鲁贪婪，说话直来直去
        timbre: 低沉粗粝
        pace: 中等
        pitch: 低
  chapters:
    - id: ch01
      title: 银质小刀
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 从前有个老太婆，常坐在家里烤饼。她有个小儿子，长得圆滚滚、胖乎乎，见了好吃的就挪不开眼，大家便叫他毛茛儿。家里还养着一条名叫金牙的狗。一天，老太婆正在烤饼，金牙突然叫了起来。
        - id: ch01-b02
          speaker: mother
          text: 好孩子，出去瞧瞧，金牙在冲什么叫呢？
        - id: ch01-b03
          speaker: narrator
          text: 毛茛儿听了母亲的话，跑到外面。一看清来人，他马上又冲回屋里，扯着嗓子喊了起来。
        - id: ch01-b04
          speaker: buttercup
          text: 老天保佑！有个又高又大的老巫婆来了！她把脑袋夹在胳膊下面，背上还背着一只口袋！
          emotion: fearful
        - id: ch01-b05
          speaker: mother
          text: 快躲到揉面槽底下去！
        - id: ch01-b06
          speaker: narrator
          text: 毛茛儿才藏好，老巫婆就进了门。
        - id: ch01-b07
          speaker: troll_witch
          text: 日安！你们家毛茛儿今天不在吗？
        - id: ch01-b08
          speaker: mother
          text: 愿上帝保佑你。他不在，跟父亲到林子里打松鸡去了。
        - id: ch01-b09
          speaker: troll_witch
          text: 真倒霉。我带来一把顶漂亮的银质小刀，本想送给他呢。
        - id: ch01-b10
          speaker: buttercup
          text: 吱吱！我在这儿！
        - id: ch01-b11
          speaker: narrator
          text: 毛茛儿从揉面槽底下钻了出来。
        - id: ch01-b12
          speaker: troll_witch
          text: 我年纪大了，腰背僵得弯不下去。你自己钻进口袋拿吧。
        - id: ch01-b13
          speaker: narrator
          text: 毛茛儿一直钻到口袋深处。老巫婆见他进去了，立刻收紧袋口，把口袋甩上背，大步朝家走。走了好一阵，她渐渐觉得累了。
        - id: ch01-b14
          speaker: troll_witch
          text: 离打呼噜还有多远？
        - id: ch01-b15
          speaker: buttercup
          text: 半英里。
        - id: ch01-b16
          speaker: narrator
          text: 老巫婆把口袋放在路边，独自钻进树林，躺下来睡觉。毛茛儿趁这个工夫，用手里的小刀割开袋子。他从洞里爬出来，又找来一大截冷杉树根，塞回口袋，然后飞快地跑回母亲身边。老巫婆睡醒以后重新上路。等她回到家，打开口袋一看，里面哪有孩子，只有一截树根，顿时大发雷霆。
    - id: ch02
      title: 银质小勺
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 第二天，母亲又坐在家里烤饼。就在这时，金牙又像前一天那样，对着屋外叫个不停。
        - id: ch02-b02
          speaker: mother
          text: 毛茛儿，出去看看金牙发现了什么。
        - id: ch02-b03
          speaker: buttercup
          text: 真是活见鬼！那个丑陋的老妖怪又来了，还是把脑袋夹在胳膊底下，背着一只大口袋！
          emotion: surprised
        - id: ch02-b04
          speaker: mother
          text: 快躲进揉面槽底下！
        - id: ch02-b05
          speaker: troll_witch
          text: 日安！毛茛儿今天在家吗？
        - id: ch02-b06
          speaker: mother
          text: 真不巧，他又跟父亲到林子里打松鸡了。
        - id: ch02-b07
          speaker: troll_witch
          text: 太扫兴了。我有一把漂亮的银质小勺，正想送给他。
        - id: ch02-b08
          speaker: buttercup
          text: 吱吱！我在这儿！
        - id: ch02-b09
          speaker: narrator
          text: 毛茛儿听见有礼物，又从揉面槽底下爬了出来。老巫婆仍说自己腰背僵硬，弯不下去，叫他钻进口袋找勺子。毛茛儿一直钻到袋子深处。老巫婆马上把口袋甩上肩头，迈开双腿，能走多快就走多快。可走出很远，她还是累了。
        - id: ch02-b10
          speaker: troll_witch
          text: 离打呼噜还有多远？
        - id: ch02-b11
          speaker: buttercup
          text: 一英里半。
        - id: ch02-b12
          speaker: narrator
          text: 老巫婆把口袋放在路上，又独自走进树林，想睡上一会儿。她一睡着，毛茛儿便在口袋上割开一个洞，悄悄钻出来，再搬来一块大石头塞进去。老巫婆回家后，在炉膛里生起熊熊大火，架上一口大锅，把煮毛茛儿要用的东西全都备好。她提起口袋，满以为这回能把毛茛儿倒进锅里。谁知落下来的却是那块大石头。石头扑通一声砸穿锅底，热水全漏出来，炉火也被浇灭了。
        - id: ch02-b13
          speaker: troll_witch
          text: 气死我了！下一回，就算他把自己变得再重，也别想再骗我！
          emotion: angry
    - id: ch03
      title: 第三只口袋
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 到了第三天，一切又照前两回的样子发生了。金牙突然叫起来，母亲便让毛茛儿出去看看，问问这条狗究竟在冲什么叫。毛茛儿出了门，很快又叫喊着跑回来。
        - id: ch03-b02
          speaker: buttercup
          text: 老天保佑！老巫婆又来了，脑袋还夹在胳膊下面，背上还是那只口袋！
          emotion: fearful
        - id: ch03-b03
          speaker: mother
          text: 快钻到揉面槽下面藏好！
        - id: ch03-b04
          speaker: troll_witch
          text: 日安！你们家毛茛儿今天在吗？
        - id: ch03-b05
          speaker: mother
          text: 多谢你惦记。可他不在，跟父亲到林子里打松鸡去了。
        - id: ch03-b06
          speaker: troll_witch
          text: 真扫兴。我带来一把顶漂亮的银质小叉，本想给他的。
        - id: ch03-b07
          speaker: buttercup
          text: 吱吱！我在这儿！
        - id: ch03-b08
          speaker: narrator
          text: 毛茛儿第三次从揉面槽下面爬了出来。老巫婆又说自己的腰背僵得弯不下去，让他钻进口袋取叉子。毛茛儿一直钻到袋子深处，她马上把口袋甩过肩头，尽力快步朝家走。这一次，她没有半路钻进树林睡觉，而是一直把毛茛儿背回了家。那天正好是星期日。
        - id: ch03-b09
          speaker: troll_witch
          text: 你把毛茛儿宰了，好好煮熟等我回来。我去教堂，请客人们来吃饭。
        - id: ch03-b10
          speaker: narrator
          text: 老巫婆把这话交代给女儿，便和家里其他人一起去了教堂，还要在那里请客人们来吃饭。女儿独自留在家中，本该杀掉毛茛儿，再把他煮熟。可她左看右看，根本不知道该怎么下手。
        - id: ch03-b11
          speaker: buttercup
          text: 先别忙，我来教你。把脑袋搁在砧板上，你马上就知道该怎么做了。
        - id: ch03-b12
          speaker: narrator
          text: 傻姑娘真把脑袋放了上去。毛茛儿抓起斧头，像宰小鸡一样，一下砍掉了她的头。他把脑袋放在床上，把身子扔进锅里，煮得香喷喷的。接着，他爬上屋顶，把前两回用过的冷杉树根和石头也拖上去，一个架在门楣上，一个放在烟囱顶。
    - id: ch04
      title: 女儿肉汤
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 一家人从教堂回来，看见床上露着女儿的脑袋，都以为她正在那里睡觉。谁也没有叫醒她。他们闻见锅里的香味，便走到炉边，想先尝尝肉汤煮得怎么样。
        - id: ch04-b02
          speaker: troll_witch
          text: 好喝，凭良心说！毛茛儿肉汤真不错！
          emotion: happy
        - id: ch04-b03
          speaker: buttercup
          text: 好喝，凭良心说！女儿肉汤真不错！
        - id: ch04-b04
          speaker: narrator
          text: 毛茛儿躲在烟囱里接话，可谁也没理他。老巫婆的丈夫跟她一样坏透了，也拿起勺子尝了一口。
        - id: ch04-b05
          speaker: witch_husband
          text: 好喝，凭良心说！毛茛儿肉汤真不错！
          emotion: happy
        - id: ch04-b06
          speaker: buttercup
          text: 好喝，凭良心说！女儿肉汤真不错！
        - id: ch04-b07
          speaker: narrator
          text: 这回，他们都听见了。大家越想越奇怪，不知道究竟是谁在烟囱里喋喋不休，便一齐跑到屋外查看。他们刚跨出门，毛茛儿就从屋顶推下冷杉树根和大石头，把他们个个砸得脑袋开花。等屋里再也没有坏人，他便走进去，拿走所有金银，回到母亲身边，从此成了富翁。
