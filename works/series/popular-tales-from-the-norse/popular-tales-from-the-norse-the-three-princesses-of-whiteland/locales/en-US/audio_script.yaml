  chapters:
    - id: ch01
      title: The Fisherman's Promise
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Once there was a fisherman who lived near a palace and caught fish for the king's table. One day, no matter what bait he used or how he cast his line, he could not catch even the smallest fish. Late in the day, a head rose from the water and spoke to him.
        - id: ch01-b02
          speaker: water_head
          text: Promise me whatever your wife carries beneath her girdle, and you will catch all the fish you need.
        - id: ch01-b03
          speaker: narrator
          text: The fisherman boldly agreed. He had no idea that his wife was expecting a child. After making the promise, he caught plenty of fish of every kind, just as the head had said. That night, he went home and told his wife about the strange bargain and how it had brought him all those fish. She began to weep and moan. She was quite beside herself over the promise her husband had made.
        - id: ch01-b04
          speaker: fisher_wife
          text: I am carrying a baby beneath my girdle.
          emotion: sad
        - id: ch01-b05
          speaker: narrator
          text: Word of their trouble soon reached the castle. When the king heard why the woman was grieving, he sent word that he would care for the child and try to save him.
        - id: ch01-b06
          speaker: narrator
          text: In time, the fisherman's wife had a boy. The king took him in at once and raised him as his own son. When the boy had grown into a young man, he begged to go fishing with his father. The king refused at first, but the lad wanted it so much that he finally got his way.
        - id: ch01-b07
          speaker: narrator
          text: Father and son fished all day without trouble. They had landed at night when the lad remembered that he had left his handkerchief behind. He stepped back into the boat to find it. At once the boat raced away, with the water roaring beneath its bow. He pulled against it with the oars, but nothing helped. The boat carried him through the whole night, until he reached a white shore far, far away.
    - id: ch02
      title: The Princesses in the Earth
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: The lad went ashore. After he had walked a little way, he met a very old man with a long white beard.
        - id: ch02-b02
          speaker: young_king
          text: What is this land called?
        - id: ch02-b03
          speaker: old_man
          text: This is Whiteland. Where have you come from, and what do you mean to do here?
        - id: ch02-b04
          speaker: narrator
          text: The lad told him the whole story.
        - id: ch02-b05
          speaker: old_man
          text: I see. Walk a little farther along this shore, and you will find three princesses buried in the earth up to their necks. The eldest will call sweetly and beg you to help her. The second will do the same. Do not go to either one. Hurry past as though you can neither see nor hear them. Go to the third princess and do whatever she asks. Follow that advice, and good luck will be yours.
        - id: ch02-b06
          speaker: narrator
          text: The first princess called to him and pleaded sweetly, but he passed as though he had not seen her. He did the same when he reached the second. Then he went straight to the third.
        - id: ch02-b07
          speaker: youngest_princess
          text: If you do as I tell you, you may choose any one of us.
        - id: ch02-b08
          speaker: narrator
          text: He readily agreed. She explained that three Trolls had buried the princesses there. Before that, they had lived in the castle among the trees.
        - id: ch02-b09
          speaker: youngest_princess
          text: Go into the castle and let each Troll whip you for one night, one night for each of us. If you endure all three nights, you will set us free.
        - id: ch02-b10
          speaker: narrator
          text: The lad said he would try.
        - id: ch02-b11
          speaker: youngest_princess
          text: Two lions guard the gate. Walk straight between them, and they will not hurt you. Inside, go to the little dark room and make your bed. A Troll will come to whip you. There is a flask hanging on the wall. Rub its ointment wherever the lash strikes, and you will be sound again. Beside the flask hangs a sword. Take it and kill the Troll.
    - id: ch03
      title: Three Nights in the Castle
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: The lad followed every word. He walked right between the two lions as though he had not seen them. They did him no harm. He entered the little dark room, made his bed, and lay down to sleep. That first night, a Troll came with three heads and three rods. It whipped him cruelly, but he endured the beating until the Troll had finished. Then he took down the flask and rubbed the ointment over every place the lashes had struck. Once he was sound again, he seized the sword and killed the Troll.
        - id: ch03-b02
          speaker: narrator
          text: When he went outside the next morning, the three princesses had risen from the earth as far as their waists.
        - id: ch03-b03
          speaker: narrator
          text: On the second night, the same thing happened again. This time the Troll had six heads and carried six rods. It whipped the lad far more cruelly than the first Troll had done. Still, he endured it, healed himself with the ointment, and killed the Troll with the sword. When he went out the next morning, the princesses had risen farther. Only their legs below the knees remained in the earth.
        - id: ch03-b04
          speaker: narrator
          text: On the third night, a Troll arrived with nine heads and nine rods. It whipped and flogged the lad until he fainted. Then it lifted him and hurled him against the wall. The blow shook down the flask. It fell upon him and broke, spilling the ointment all over his body. In an instant, he was strong and whole again.
        - id: ch03-b05
          speaker: narrator
          text: He wasted no time. He seized the sword and killed the Troll. The next morning, all three princesses stood before him, completely free of the earth. He chose the youngest as his queen, and for a time they lived happily together.
    - id: ch04
      title: The Two Wishes
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: At last, the young king began to long for home and wanted to visit his parents. His queen disliked the idea. But his heart was set on going, and he longed for it so deeply that she could not hold him back.
        - id: ch04-b02
          speaker: youngest_princess
          text: You must promise me one thing. Do only what your father asks of you. Do not do what your mother wants.
        - id: ch04-b03
          speaker: narrator
          text: He gave his promise. Then she gave him a ring that would grant its wearer two wishes. He wished himself home. When he appeared there, his parents could hardly believe what a grand man their son had become.
        - id: ch04-b04
          speaker: narrator
          text: After he had stayed a few days, his mother wanted him to visit the palace and show the king what a fine man he was now. His father objected.
        - id: ch04-b05
          speaker: fisherman
          text: No, do not let him go. If he visits the palace, we will lose all our joy in him again.
        - id: ch04-b06
          speaker: narrator
          text: His mother kept begging and pleading until the young king finally went. At the palace, his clothes and bearing were finer than the other king's. The king did not care for that at all.
        - id: ch04-b07
          speaker: king
          text: Very impressive. But you can see my queen with your own eyes, while I cannot see yours. In fact, I doubt she is as beautiful as mine.
        - id: ch04-b08
          speaker: young_king
          text: If only she were standing here! Then you would see for yourself what she is like.
        - id: ch04-b09
          speaker: narrator
          text: The moment he spoke, his queen appeared before them. She was full of sorrow.
        - id: ch04-b10
          speaker: youngest_princess
          text: Why did you forget my warning? Why did you refuse to listen to your father? Now I must go home, and you have used both your wishes.
          emotion: sad
        - id: ch04-b11
          speaker: narrator
          text: She wove a ring bearing her name into his hair. Then she wished herself home and vanished.
    - id: ch05
      title: The Search for Whiteland
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: The young king was brokenhearted. Day after day, he went about thinking of nothing but how he might return to his queen. At last, he decided there was only one thing to do. He would travel out into the world, ask everyone he met, and see whether anyone could tell him where Whiteland lay.
        - id: ch05-b02
          speaker: narrator
          text: After going a great distance, he came to a high hill. There he met the lord of all the beasts of the woods. Whenever this man blew his horn, every beast came home to him. The young king asked whether he knew the way to Whiteland.
        - id: ch05-b03
          speaker: lord_beasts
          text: I do not know, but I will ask my beasts.
        - id: ch05-b04
          speaker: narrator
          text: The lord of the beasts sounded his horn. From all through the woods, the animals came home and gathered before him. He asked whether any one of them knew where Whiteland lay, but not a single beast could answer.
        - id: ch05-b05
          speaker: lord_beasts
          text: Take these snowshoes. They will carry you to my brother, who lives hundreds of miles away and rules all the birds in the air. Ask him. When you reach his house, turn the shoes around so their toes point back this way. They will return home by themselves.
        - id: ch05-b06
          speaker: narrator
          text: The young king put on the snowshoes. When he reached the brother's house, he turned their toes as instructed, and they sped home alone. Then he asked the lord of the birds about Whiteland.
        - id: ch05-b07
          speaker: narrator
          text: The lord of the birds blew a blast on his horn and called every bird in the air. He asked them all about Whiteland, but none knew the way. Long, long after the rest had arrived, an old eagle finally came home. The eagle had been away for ten whole years, but even after all those travels, it knew no more about Whiteland than the other birds did.
        - id: ch05-b08
          speaker: lord_birds
          text: Then borrow my snowshoes. They will take you hundreds of miles to my brother, the lord of all the fish in the sea. Ask him. And remember to turn the shoes around when you arrive.
        - id: ch05-b09
          speaker: narrator
          text: The young king thanked him warmly and put on the snowshoes. They carried him all the way to the home of the man who ruled the fish in the sea. As soon as he arrived, he remembered the warning and turned the toes around. The shoes raced home on their own, just like the first pair. Then the young king once more asked where Whiteland lay.
        - id: ch05-b10
          speaker: narrator
          text: The lord of the fish sounded his horn, but no fish could answer. At last, an old pike came from so far away that calling him home took a great deal of work.
        - id: ch05-b11
          speaker: old_pike
          text: Do I know Whiteland? Of course I do. I was the cook there for ten years, and I am returning tomorrow. The queen of Whiteland has lost her king, and now she is going to marry another husband.
    - id: ch06
      title: The Brothers' Treasures
      blocks:
        - id: ch06-b01
          speaker: lord_fish
          text: Then let me give you some advice. On a moor nearby, three brothers have spent a hundred years fighting over a hat, a cloak, and a pair of boots. Whoever owns all three can become invisible and wish himself anywhere he chooses. Tell them you must try the things before you can judge which brother should own them.
        - id: ch06-b02
          speaker: narrator
          text: The young king thanked him and found the brothers on the moor.
        - id: ch06-b03
          speaker: young_king
          text: What is all this fighting about? You have been quarreling here long enough. Let me try these things, and afterward I will decide who should have them.
        - id: ch06-b04
          speaker: narrator
          text: The brothers gladly agreed. But as soon as the young king had the hat, cloak, and boots, he spoke again.
        - id: ch06-b05
          speaker: young_king
          text: The next time we meet, I will give you my judgment.
        - id: ch06-b06
          speaker: narrator
          text: With that, he wished himself away. As he traveled through the air, he caught up with the North Wind.
        - id: ch06-b07
          speaker: north_wind
          text: Where are you going?
        - id: ch06-b08
          speaker: young_king
          text: To Whiteland.
        - id: ch06-b09
          speaker: narrator
          text: Then the young king told the North Wind everything that had happened.
        - id: ch06-b10
          speaker: north_wind
          text: You travel faster than I do. You can go straight ahead, while I must blow around every bend and corner. When you reach Whiteland, stand on the steps beside the door. I will come roaring in as if I mean to tear down the castle. The prince who plans to marry your queen will come outside to see what is wrong. Grab him by the collar and throw him out. I will take care of the rest and carry him away.
    - id: ch07
      title: The Rightful Wedding
      blocks:
        - id: ch07-b01
          speaker: narrator
          text: The young king reached Whiteland and did exactly as the North Wind had told him. He took his place on the stairs beside the castle door and waited. Then the North Wind came storming and roaring in. It seized the castle walls as though it meant to blow the whole place down, and the building shook again and again. At last, the prince who was to marry the queen came outside to see what was happening.
        - id: ch07-b02
          speaker: narrator
          text: The young king seized him by the collar and threw him out the door. The North Wind swept him up and carried him away.
        - id: ch07-b03
          speaker: narrator
          text: With the prince gone, the young king entered the castle. At first, his queen did not recognize him. His long wandering and grief had left him thin and pale. Then he showed her the ring, and she was as glad as glad could be.
        - id: ch07-b04
          speaker: narrator
          text: So the rightful wedding was held, and its fame spread far and wide.
