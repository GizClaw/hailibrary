audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 从容而清醒，带一点克制的诙谐
        timbre: 温厚清晰
        pace: 舒缓有致
        pitch: 中低
    fisherman:
      display_name: 渔夫
      tts:
        delivery: 朴实直率，遇事容易冲动
        timbre: 粗朴厚实
        pace: 中等
        pitch: 中低
    water_head:
      display_name: 水中怪客
      tts:
        delivery: 阴沉简短，带着不容反悔的意味
        timbre: 湿冷低哑
        pace: 缓慢
        pitch: 低
    fisher_wife:
      display_name: 渔夫妻子
      tts:
        delivery: 质朴真切，忧伤时气息发颤
        timbre: 柔和清亮
        pace: 中等
        pitch: 中等
    young_king:
      display_name: 年轻的国王
      tts:
        delivery: 勇敢诚恳，历经磨难后更显坚定
        timbre: 明朗坚实
        pace: 中等
        pitch: 中等偏低
    palace_king:
      display_name: 王宫里的国王
      tts:
        delivery: 起初仁厚关切，后来显出好胜与傲气
        timbre: 饱满庄重
        pace: 中等偏慢
        pitch: 中低
    old_man:
      display_name: 白胡子老人
      tts:
        delivery: 沉着慈祥，叮嘱时清楚有力
        timbre: 苍老温厚
        pace: 舒缓
        pitch: 低
    youngest_princess:
      display_name: 三公主
      tts:
        delivery: 温柔而坚定，伤心时仍保持克制
        timbre: 清澈柔韧
        pace: 中等偏慢
        pitch: 中等
    beasts_master:
      display_name: 百兽之主
      tts:
        delivery: 豪爽稳重，乐于相助
        timbre: 洪亮宽厚
        pace: 中等
        pitch: 低
    birds_master:
      display_name: 飞鸟之主
      tts:
        delivery: 爽朗耐心，说话干脆
        timbre: 清朗开阔
        pace: 中等
        pitch: 中等
    fish_master:
      display_name: 海鱼之主
      tts:
        delivery: 沉稳机敏，出主意时胸有成竹
        timbre: 深沉圆润
        pace: 中等偏慢
        pitch: 低
    old_pike:
      display_name: 老梭子鱼
      tts:
        delivery: 老练爽快，语气颇为自信
        timbre: 沙哑浑厚
        pace: 中等
        pitch: 中低
    north_wind:
      display_name: 北风
      tts:
        delivery: 豪迈响亮，话语像风声一样起伏
        timbre: 雄浑有穿透力
        pace: 中等偏快
        pitch: 低
  chapters:
    - id: ch01
      title: 海上的诺言
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 从前，有个渔夫住在王宫附近，天天打鱼供国王吃。有一天，他从早忙到晚，鱼饵换了，钓法也换了，鱼钩上却连一条小鲱鱼都没有。天快黑时，水面忽然冒出一颗脑袋。
        - id: ch01-b02
          speaker: water_head
          text: 把你妻子腰带底下怀着的东西给我，我就让你捕到足够的鱼。
        - id: ch01-b03
          speaker: narrator
          text: 渔夫不知道妻子已经怀了孩子，想也没想就答应了。果然，打那以后，各种各样的鱼接连上钩，很快便装满了船。晚上回到家，他把自己怎样许下诺言、又怎样捕到满船鱼，全都说了出来。妻子一听，哭得几乎失了魂。
        - id: ch01-b04
          speaker: fisher_wife
          text: 我腰带底下怀着的，是我们的孩子啊！
          emotion: sad
        - id: ch01-b05
          speaker: narrator
          text: 消息很快传进王宫。国王听说这位母亲为什么伤心，便派人告诉她，孩子出生后由他照管，他会设法把孩子救下来。
        - id: ch01-b06
          speaker: narrator
          text: 一月又一月过去，渔夫妻子终于生下一个男孩。国王立刻把孩子接进宫，当亲生儿子一般抚养。男孩渐渐长成少年，有一天，他一心想跟父亲出海捕鱼。国王起初怎么也不答应，可少年再三请求，最后还是如愿去了。
        - id: ch01-b07
          speaker: narrator
          text: 父子俩在海上待了一整天，直到晚上靠岸，一直平安无事。少年上岸后才想起手帕还在船里，便转身去取。谁知他刚踏上船，船就猛地离开岸边，飞快地冲向大海。船头下水声轰鸣，他使尽力气划桨，也挡不住船往前走。
        - id: ch01-b08
          speaker: narrator
          text: 船整整走了一夜，最后把他送到遥远的白色海滩。少年上岸走了不久，遇见一位年纪很老、白胡子很长的老人。
        - id: ch01-b09
          speaker: young_king
          text: 老人家，这片国土叫什么名字？
        - id: ch01-b10
          speaker: old_man
          text: 这里是白国。孩子，你从哪里来，又要去做什么？
        - id: ch01-b11
          speaker: narrator
          text: 少年把自己的遭遇从头到尾说了一遍。老人听完，便给他指点前路。
        - id: ch01-b12
          speaker: old_man
          text: 沿着海滩再往前走，你会看见三位公主埋在土里，只有脑袋露在外面。大公主会软语求你救她，二公主也一样。你谁也别理，只管快步走过，就当没看见、没听见。到了三公主面前，你要过去，照她说的做。这样你才会交好运。
    - id: ch02
      title: 城堡里的三个夜晚
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 少年继续沿海滩往前走。大公主果然娇声求他过去，他却看也不看，径直从她身边走过。二公主也向他求救，他同样没有停步。直到第三位公主面前，他才走了过去。
        - id: ch02-b02
          speaker: youngest_princess
          text: 只要你肯照我的话去做，我们姐妹当中，你喜欢哪一个，就可以娶哪一个。
        - id: ch02-b03
          speaker: narrator
          text: 少年当即答应。三公主告诉他，她们原本住在树林深处的城堡里，是三个山怪把她们埋进了土中。
        - id: ch02-b04
          speaker: youngest_princess
          text: 你得走进那座城堡，为我们姐妹三个，一夜对付一个山怪，让它们用鞭子打你。只要熬过这三个夜晚，我们就能重获自由。
        - id: ch02-b05
          speaker: young_king
          text: 我愿意试一试。
        - id: ch02-b06
          speaker: youngest_princess
          text: 城堡门口站着两头狮子。你从它们正中间一直走过去，它们不会伤你。里面有一间阴暗的小屋，你进去铺床躺下，山怪就会来。墙上挂着一瓶药膏，鞭子打伤哪里，你就往哪里抹，伤口马上会好。瓶子旁边还有一把剑。等山怪打完，拿剑杀了它。
        - id: ch02-b07
          speaker: narrator
          text: 少年照三公主的叮嘱，目不斜视地从两头狮子中间穿过，走进小屋躺了下来。第一夜，一个三头山怪来了，手里拿着三根鞭子。它狠狠抽打少年，少年咬牙忍到最后，才取下药瓶，把药膏抹遍伤处。伤一好，他立刻抓起墙上的剑，杀死了山怪。
        - id: ch02-b08
          speaker: narrator
          text: 第二天早晨，他走出城堡，看见三位公主已经从土里露出了腰身。
        - id: ch02-b09
          speaker: narrator
          text: 第二夜，来的山怪有六颗脑袋，拿着六根鞭子，打得比头一个凶狠得多。少年还是撑到它打完，用药膏治好伤，又拿宝剑杀死了它。次日清晨，三位公主已经脱身到了膝盖。
        - id: ch02-b10
          speaker: narrator
          text: 第三夜，九头山怪带着九根鞭子来了。它不停地抽打少年，直打得他昏死过去，又把他举起来，狠狠摔向墙壁。墙上的药瓶被震落，砸在少年身上，瓶子碎了，药膏全洒在他身上。他一下又恢复了力气，伤口也全好了。
        - id: ch02-b11
          speaker: narrator
          text: 少年立刻拿起宝剑，杀死九头山怪。第二天早上，他走出城堡，看见三位公主终于完完整整地站在地面上。他选择最小的公主做王后，两人安乐地生活了很久。
    - id: ch03
      title: 用尽的两个愿望
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 日子久了，年轻的国王越来越思念父母，想回故乡看看。王后不愿让他走，可他一心盼着回家，怎么也留不住。最后，王后只得让步。
        - id: ch03-b02
          speaker: youngest_princess
          text: 你一定要答应我，只做你父亲求你做的事。母亲想让你做的事，千万不要做。
        - id: ch03-b03
          speaker: narrator
          text: 年轻的国王答应了。王后交给他一枚戒指，戴着它的人可以许两个愿望。他立刻许下第一个愿望，回到了故乡。父母见儿子成了这样气派非凡的人，惊讶得看也看不够。
        - id: ch03-b04
          speaker: narrator
          text: 他在家住了几天，母亲便要他进宫，让从前养育他的国王看看，他如今有多么出色。父亲听了，赶忙阻拦。
        - id: ch03-b05
          speaker: fisherman
          text: 不行，别让他进宫！他这一去，我们这次又留不住他了。
        - id: ch03-b06
          speaker: narrator
          text: 可母亲一遍遍央求，年轻的国王最终还是去了。进宫以后，他的衣着和仪仗处处胜过王宫里的国王。那位国王看在眼里，心中很不痛快。
        - id: ch03-b07
          speaker: palace_king
          text: 你这一身的确很神气。可你看得到我的王后，我却连你的王后长什么样都不知道。我可不相信，她会比我的王后更漂亮。
        - id: ch03-b08
          speaker: young_king
          text: 但愿上天让她现在就站在这里，好叫你亲眼看看她的模样。
        - id: ch03-b09
          speaker: narrator
          text: 这句话刚出口，王后便出现在众人面前。可是她没有半点欢喜，脸上只有深深的愁苦。
        - id: ch03-b10
          speaker: youngest_princess
          text: 你为什么不记住我的话，也不听你父亲的劝告？现在我必须回家了，而你的两个愿望也全都用完了。
          emotion: sad
        - id: ch03-b11
          speaker: narrator
          text: 她把一枚刻着自己名字的戒指编进丈夫的头发，随即许愿回家，转眼便消失了。年轻的国王伤透了心。此后，他一天接一天地苦苦思量，该怎样才能回到王后身边。
        - id: ch03-b12
          speaker: young_king
          text: 我就出去试试看。也许有人能告诉我，白国究竟在哪里。
    - id: ch04
      title: 询问百兽与飞鸟
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 年轻的国王走遍四方，逢人便打听白国的下落。他走了很远很远，来到一座高山，遇见了统领林中百兽的人。那人只要吹响号角，所有野兽都会从林中回到他身边。年轻的国王便问他可知道白国的方向。
        - id: ch04-b02
          speaker: beasts_master
          text: 我不知道，不过可以替你问问我的野兽。
        - id: ch04-b03
          speaker: narrator
          text: 百兽之主吹响号角，把所有野兽召到山上，逐一问它们有没有谁知道白国在哪里。可是，连一头知道的也没有。于是，他拿出一双雪鞋送给年轻的国王。
        - id: ch04-b04
          speaker: beasts_master
          text: 穿上这双鞋，它会把你带到我兄弟家。他住在几百英里以外，统领天上所有飞鸟，你去问他吧。到了以后，把鞋尖转过来朝向这里，雪鞋就会自己回家。
        - id: ch04-b05
          speaker: narrator
          text: 年轻的国王穿上雪鞋，转眼便到了飞鸟之主的住处。他按照嘱咐调转鞋尖，那双鞋果然自行离去，回到了百兽之主那里。
        - id: ch04-b06
          speaker: narrator
          text: 听完他的询问，飞鸟之主也吹响号角，把天上的飞鸟全部召来。可是问遍群鸟，还是没有谁知道白国。其他鸟儿早已到齐，一只老鹰却过了很久才飞来。它一去整整十年，仍旧说不出白国在什么地方。
        - id: ch04-b07
          speaker: birds_master
          text: 看来我的飞鸟也帮不上忙。我借你一双雪鞋，它会带你去见我兄弟。他住在几百英里外，统领海里所有的鱼。你去问问他，可别忘了把鞋尖掉转回来。
        - id: ch04-b08
          speaker: narrator
          text: 年轻的国王连声道谢，再次穿上雪鞋。到了海鱼之主的住处，他转过鞋尖，目送它们像上一双那样自己回家，然后又问起白国。
    - id: ch05
      title: 老梭子鱼的消息
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 海鱼之主吹响号角，把鱼群召来，可谁也说不清白国在哪里。最后，一条老梭子鱼才远远赶来。它离得实在太远，海鱼之主费了好大的劲，才把它召回身边。
        - id: ch05-b02
          speaker: old_pike
          text: 白国？我当然知道！我在那里当了十年厨子，明天还得回去。白国的国王不在家，王后正准备嫁给另一个丈夫。
        - id: ch05-b03
          speaker: narrator
          text: 海鱼之主听见这个消息，马上想出了一个办法。
        - id: ch05-b04
          speaker: fish_master
          text: 这附近有片荒原，三个兄弟已经在那里站了一百年。他们一直争一顶帽子、一件斗篷和一双靴子。谁拿到这三件宝物，谁就能隐去身形，还能想去哪里就去哪里。你告诉他们，先让你试试宝物，你再替他们裁决东西归谁。
        - id: ch05-b05
          speaker: narrator
          text: 年轻的国王谢过海鱼之主，赶到那片荒原。三兄弟果然还站在那里，为三件宝物争斗不休。
        - id: ch05-b06
          speaker: young_king
          text: 你们为什么一直站在这里争个没完？把这三件东西交给我试试，我来判断它们到底该归谁。
        - id: ch05-b07
          speaker: narrator
          text: 三兄弟很乐意让他评断，便把帽子、斗篷和靴子全交给了他。宝物刚一到手，年轻的国王便开了口。
        - id: ch05-b08
          speaker: young_king
          text: 下次再见时，我会告诉你们我的裁决。
        - id: ch05-b09
          speaker: narrator
          text: 说完，他许愿离开，立刻从荒原消失了。
    - id: ch06
      title: 北风相助
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: 年轻的国王从空中飞快赶路，不久便追上了北风。
        - id: ch06-b02
          speaker: north_wind
          text: 你这是要上哪儿去？
        - id: ch06-b03
          speaker: young_king
          text: 我要去白国。
        - id: ch06-b04
          speaker: narrator
          text: 接着，他把自己经历的一切都讲给北风听。
        - id: ch06-b05
          speaker: north_wind
          text: 你比我走得快，因为你能一直向前，我却得吹过每一道弯，绕过每一个角。到了白国，你就站在大门旁的台阶上。我会呼啸着闯进去，像要把整座城堡吹倒一样。那个想娶你王后的王子一定会出来查看。你揪住他的衣领，把他扔出门外。接下来交给我，看我把不把他卷走！
        - id: ch06-b06
          speaker: narrator
          text: 年轻的国王先到白国，按照北风的话站在台阶上。没过多久，北风咆哮着冲来，抓住城堡的墙壁猛力摇撼，整座城堡都震动起来。那位王子果然走出门，想看看发生了什么事。
        - id: ch06-b07
          speaker: narrator
          text: 王子刚一露面，年轻的国王就揪住他的衣领，把他扔了出去。北风随即卷起王子，呼啸着将他带走。从此，那个王子再也没有回来。
        - id: ch06-b08
          speaker: narrator
          text: 情敌被北风带走以后，年轻的国王走进城堡。王后起初没有认出他，因为他一路漂泊了那么远，又日夜承受着悲伤，早已变得苍白而消瘦。直到他拿出那枚刻着她名字的戒指，王后才认出自己的丈夫，心里欢喜到了极点。
        - id: ch06-b09
          speaker: narrator
          text: 于是，他们举行了那场本就属于两人的婚礼。婚礼的盛名传遍远近，也传到了四面八方。
