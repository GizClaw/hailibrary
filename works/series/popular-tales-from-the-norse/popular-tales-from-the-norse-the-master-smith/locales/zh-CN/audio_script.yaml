audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 从容而清醒，带一点克制的诙谐
        timbre: 温厚清晰
        pace: 舒缓有致
        pitch: 中低
    smith:
      display_name: 铁匠
      tts:
        delivery: 自负大胆，善于狡辩，话里常带戏弄
        timbre: 粗犷结实
        pace: 中等偏快
        pitch: 中低
    lord:
      display_name: 主
      tts:
        delivery: 平静庄重，不疾不徐
        timbre: 温暖深沉
        pace: 舒缓
        pitch: 中低
    st_peter:
      display_name: 圣彼得
      tts:
        delivery: 正直严肃，劝诫时直截了当
        timbre: 清晰稳重
        pace: 中等
        pitch: 中
    devil:
      display_name: 魔鬼
      tts:
        delivery: 骄横急躁，受困时惊慌恼怒
        timbre: 沙哑有力
        pace: 中等偏快
        pitch: 中低
    tailor:
      display_name: 裁缝
      tts:
        delivery: 谨慎谦卑，带着赶路的气喘
        timbre: 单薄清亮
        pace: 中等偏快
        pitch: 中高
    gatekeeper:
      display_name: 守门人
      tts:
        delivery: 奉命行事，简短谨慎
        timbre: 低沉清楚
        pace: 中等
        pitch: 中低
  chapters:
    - id: ch01
      title: 门上的大师
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 从前，主和圣彼得还常在人间行走。有一天，他们来到一间铁匠铺。铺里的铁匠跟魔鬼做过一笔交易。七年之后，魔鬼可以把他带走。在这七年里，他却要成为手艺胜过世上一切大师的大师。两边都在契约上签了名。为此，铁匠在门上写了一行斗大的字：“一切大师之上的大师住在这里。”
        - id: ch01-b02
          speaker: narrator
          text: 主从铁匠铺门前经过，看见那行夸口的大字，便走进铺子，问铁匠究竟是什么人。
        - id: ch01-b03
          speaker: smith
          text: 门上不是写着吗？自己看。要是你不识字，就等个人来念给你听吧。
        - id: ch01-b04
          speaker: narrator
          text: 主还来不及回答，有人牵来一匹马，请铁匠给马钉掌。主便问，能不能让他来试试。
        - id: ch01-b05
          speaker: smith
          text: 你想试就试。就算钉得再糟，我也能替你收拾好。
        - id: ch01-b06
          speaker: narrator
          text: 主走到外面，卸下一条马腿，放进炉里，把马掌烧得通红。随后，他翘起马掌两端，锉平钉头，弯牢钉尖，再把那条腿完好无损地安回马身上。做好一条，他又卸下另一条前腿。接着是两条后腿，先右后左，也一一照样料理。四条腿全部安回去时，铁匠一直站在旁边看着。
        - id: ch01-b07
          speaker: smith
          text: 看来，你这铁匠当得还不算坏。
        - id: ch01-b08
          speaker: lord
          text: 哦，你也这么想？
        - id: ch01-b09
          speaker: narrator
          text: 不久，铁匠的母亲来到铺里，叫儿子回家吃饭。她已经老得不能再老，背上拱着难看的大驼峰，脸上尽是皱纹，每走一步都十分吃力。
        - id: ch01-b10
          speaker: lord
          text: 这一次，你可看仔细了。
        - id: ch01-b11
          speaker: narrator
          text: 主把老妇人放进炉中。等他再把人从炉里取出来时，那个衰老驼背的母亲不见了。他竟从炉火中锻出一位美丽的年轻姑娘。
        - id: ch01-b12
          speaker: smith
          text: 好吧，我还是刚才那句话，你的手艺确实不坏。虽说门上明明写着，我才是一切大师之上的大师，可我也得说句实话。人只要还活着，总有没学会的东西。
        - id: ch01-b13
          speaker: narrator
          text: 说完，铁匠便离开铺子，回家吃饭去了。
    - id: ch02
      title: 学来的新手艺
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 吃过饭，铁匠刚刚回到铺子，又有一个人骑着马赶来，请他给马钉掌。
        - id: ch02-b02
          speaker: smith
          text: 眨眼就能做好。我刚学会一种新办法，白天短的时候最省事。
        - id: ch02-b03
          speaker: narrator
          text: 铁匠嫌一条一条来回折腾太麻烦，干脆又砍又剁，把四条马腿一次全卸下来。接着，他照着主的样子，把马腿塞进炉里，压上一大堆煤，还催伙计们使劲拉风箱。事情果然坏到了不出所料的地步。四条马腿全烧成了灰，铁匠只好赔给客人一匹马。
        - id: ch02-b04
          speaker: narrator
          text: 铁匠并不怎么在意。正巧一个讨饭的老妇人从路上经过，他心想，下一回运气总该好些。于是他抓住老妇人，把她放进炉里。任凭老妇人怎样哭求饶命，也没能叫他停手。
        - id: ch02-b05
          speaker: smith
          text: 你老糊涂了，不知道什么对自己好。用不了多久，我就把你变成漂亮姑娘，还一分钱都不收。
        - id: ch02-b06
          speaker: narrator
          text: 可怜的老妇人也没能变成姑娘。她的下场跟那四条马腿一样糟。
        - id: ch02-b07
          speaker: lord
          text: 这件事，你做得实在太坏了。
        - id: ch02-b08
          speaker: smith
          text: 反正不会有多少人来找这个老妇人，我敢保证。不过门上既然写得清清楚楚，魔鬼却不肯照约定让我真有那份本事，那才叫不像话。
        - id: ch02-b09
          speaker: lord
          text: 如果我赐你三个愿望，你要许什么？
        - id: ch02-b10
          speaker: smith
          text: 让我试试，你马上就知道。
        - id: ch02-b11
          speaker: narrator
          text: 主答应赐给他三个愿望。
        - id: ch02-b12
          speaker: smith
          text: 第一，只要我叫谁爬上铺子墙边的梨树，他就得待在树上，直到我准他下来。第二，只要我请谁坐进铺里的安乐椅，他就得坐到我准他起身。第三，只要我叫谁钻进衣袋里的钢铁钱袋，他就得留在里面，直到我放他出来。
        - id: ch02-b13
          speaker: st_peter
          text: 你许的都是恶人的愿望。第一个愿望，本该求上帝赐你恩典和眷顾。
        - id: ch02-b14
          speaker: smith
          text: 那么高的东西，我可不敢求。
        - id: ch02-b15
          speaker: narrator
          text: 铁匠不敢求更高的福分。主和圣彼得听他说完，便向他告别，离开铁匠铺，继续走自己的路去了。
    - id: ch03
      title: 梨树和安乐椅
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 一年接着一年过去。七年期满，魔鬼按照契约来接铁匠。他没有走进铺子，只把鼻子探进门里。
        - id: ch03-b02
          speaker: devil
          text: 你准备好了吗？
        - id: ch03-b03
          speaker: smith
          text: 等我敲好这根十便士大钉的钉头。你赶路赶得又饿又渴吧？先爬上梨树摘个梨吃。
        - id: ch03-b04
          speaker: narrator
          text: 魔鬼道了谢，爬上梨树。
        - id: ch03-b05
          speaker: smith
          text: 我刚刚重新盘算过。这块铁硬得要命，钉头至少还要敲四年才能敲好。所以这四年里，你可下不来了。就坐在树上，好好歇歇筋骨吧。
        - id: ch03-b06
          speaker: narrator
          text: 魔鬼一听，便连求带告，求得嗓子都像一枚银币那么薄。可是已经坐在树上，他就非待在那里不可。最后，他只好以名誉担保，答应四年期满之前绝不再来。铁匠这才开口准他下树。
        - id: ch03-b07
          speaker: narrator
          text: 四年终于过去，魔鬼又来到铁匠铺，要把铁匠带走。
        - id: ch03-b08
          speaker: devil
          text: 这回总准备好了吧？那颗钉头怎么也该敲完了。
        - id: ch03-b09
          speaker: smith
          text: 钉头倒是已经敲好了，可你还是早来了那么一丁点儿。钉尖还没有完全磨利，我活了这么久，从没碰过这么硬得要命的铁。你先坐进安乐椅歇歇吧，走了这么远的路，你一定累坏了。
        - id: ch03-b10
          speaker: devil
          text: 那就多谢了。
        - id: ch03-b11
          speaker: narrator
          text: 魔鬼一屁股坐进安乐椅。可他刚刚坐舒服，铁匠又说，自己转念一想，这钉尖还得再磨四年。魔鬼起初好声好气地央求铁匠放他起来，后来越想越怒，又骂又威胁。铁匠却始终赔着不是，说全怪这块铁硬得要命。再说，魔鬼只是安安静静坐在安乐椅里，并不算受苦。四年一满，他保证一刻也不多留，马上放人。
        - id: ch03-b12
          speaker: narrator
          text: 魔鬼怎么也挣脱不了，只得再次拿名誉担保，答应四年期满以前绝不来接铁匠。
        - id: ch03-b13
          speaker: smith
          text: 好了，现在我准你从椅子上起来。赶快去办你自己的事吧。
        - id: ch03-b14
          speaker: narrator
          text: 魔鬼拔腿就跑，能跑多快便跑多快。
    - id: ch04
      title: 钢铁钱袋
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 又过了整整四年，魔鬼第三次来接铁匠。他还是把鼻子探进铺门，高声叫了起来。
        - id: ch04-b02
          speaker: devil
          text: 这回你肯定准备好了。
        - id: ch04-b03
          speaker: smith
          text: 好了，随时能走。不过我一直在想，人们都说魔鬼想变多小就能变多小，这话是真的吗？
        - id: ch04-b04
          speaker: devil
          text: 上帝知道，当然是真的。
        - id: ch04-b05
          speaker: smith
          text: 原来真是这样。那就劳驾你钻进我的钢铁钱袋，替我看看袋底到底牢不牢。实话说，我正担心赶路时盘缠会从底下漏出去。
        - id: ch04-b06
          speaker: devil
          text: 我很乐意。
        - id: ch04-b07
          speaker: narrator
          text: 魔鬼答应得痛快，眨眼间把自己缩得小小的，钻进钱袋。可他才刚进去，铁匠就啪地扣紧了袋扣。
        - id: ch04-b08
          speaker: devil
          text: 袋子四处都又紧又牢。
        - id: ch04-b09
          speaker: smith
          text: 听你亲口这么说，我就放心了。不过老话讲，欲速则不达，又说事先有了防备，才不会遇事慌张。我还是把这些链环稍微焊在一起吧，这样才更稳妥。
        - id: ch04-b10
          speaker: narrator
          text: 他把钱袋放进炉中，烧得通红。
        - id: ch04-b11
          speaker: devil
          text: 嗷！嗷！你疯了吗？我还在袋子里！
          emotion: fearful
        - id: ch04-b12
          speaker: smith
          text: 我当然知道你在里面。可是我也帮不了你，因为还有一句老话正好说，打铁一定要趁热。
        - id: ch04-b13
          speaker: narrator
          text: 铁匠并不理会。他抄起大锤，把烧红的钱袋放到铁砧上，举起锤子，使出全身力气一下接一下砸下去。
        - id: ch04-b14
          speaker: devil
          text: 嗷！嗷！嗷！好朋友，求你快放我出去吧！只要你放了我，我以后再也不会靠近你，更不会来找你了！
          emotion: fearful
        - id: ch04-b15
          speaker: smith
          text: 好吧，链环已经焊牢了，你可以出来了。
        - id: ch04-b16
          speaker: narrator
          text: 铁匠觉得链环已经焊得差不多了，这才解开袋扣，准魔鬼出来。魔鬼一钻出钱袋便仓皇逃走。他只顾拼命向前跑，连一次头也没敢回。
    - id: ch05
      title: 天堂与地狱之间
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 后来，铁匠忽然想到，自己把魔鬼变成仇敌，实在做了件蠢事。天堂多半不肯收他，如今他又得罪了地狱的主人，到头来恐怕两边都没有他的住处。
        - id: ch05-b02
          speaker: narrator
          text: 他决定马上去试试，看看天堂或地狱究竟有没有一处容得下他。与其一直拖着，不如尽早把事情弄清。铁匠把大锤扛上肩，走了好长一段路，来到天堂与地狱分路的岔口。在那里，他赶上一个拿着熨斗、一路小跑的裁缝。
        - id: ch05-b03
          speaker: smith
          text: 日安。你要到哪里去？
        - id: ch05-b04
          speaker: tailor
          text: 去天堂，只要他们肯放我进去。你又要去哪儿？
        - id: ch05-b05
          speaker: smith
          text: 哦，看来咱们走的不是一条路。我已经打定主意，先去地狱碰碰运气。毕竟魔鬼和我早年就认识，还很熟悉彼此。
        - id: ch05-b06
          speaker: narrator
          text: 两人互道一声再会，各走一边。铁匠身强体壮，脚程远比裁缝快，很快便把他甩在后面。不久，铁匠来到地狱门前。他叫来守门人，请他去告诉魔鬼，门外有人想同他说句话。
        - id: ch05-b07
          speaker: devil
          text: 去问问外面的人是谁。
        - id: ch05-b08
          speaker: narrator
          text: 守门人依照吩咐来到门外，问铁匠是谁。铁匠没有直接回答，只请他回去给魔鬼带个口信。
        - id: ch05-b09
          speaker: smith
          text: 请替我向魔鬼问好。告诉他，那个钢铁钱袋的主人来了，他自然会明白是谁。再请你好好求他，马上放我进去吧。我在铁匠铺干活干到中午，随后又走了这么远的路。
        - id: ch05-b10
          speaker: narrator
          text: 守门人把话送到魔鬼那里。魔鬼一听来的是钢铁钱袋的主人，立刻命令守门人回去，把地狱大门上的九道锁一道不落地全锁好。
        - id: ch05-b11
          speaker: devil
          text: 最好再添一把大锁！他只要进来，准会把地狱闹个底朝天！
          emotion: fearful
        - id: ch05-b12
          speaker: narrator
          text: 铁匠看见他们忙着给大门上闩，知道地狱不会给他住处，只好转身往回走。他回到岔路口，改走裁缝去过的那条路。白白来回跑了这么远，他心里正恼火，于是迈开大步，使出全身力气追赶。
        - id: ch05-b13
          speaker: narrator
          text: 他赶到天堂门前时，圣彼得正把门打开一点点。那道缝刚够饿得半死的裁缝侧身溜进去，铁匠却还差六七步。眼看门就要关了，他知道一刻也不能耽搁。他双手抓起大锤，对准门缝猛掷过去，正好在裁缝缩进去时，把锤子扔进了天堂门内。
        - id: ch05-b14
          speaker: narrator
          text: 天堂的门既然还开着一道缝，铁匠要是没有趁这个机会跟进去，那我可真不知道，他后来究竟上哪儿去了。
