  chapters:
    - id: ch01
      title: The Master over All Masters
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            Once, in the days when our Lord and St Peter walked the earth, they came to a smith's house. The smith had made a bargain with the Devil. For seven years he would be the finest master of his trade, and when those years were over, the Devil would have him. Both had signed their names to it. Over the forge door, the smith had put up great letters that said, "Here dwells the Master over all Masters."
        - id: ch01-b02
          speaker: narrator
          text: Our Lord saw the words, went inside, and asked the smith who he was.
        - id: ch01-b03
          speaker: smith
          text: >-
            Read the sign over the door. Unless you can't read, of course. Then you'll have to wait for someone to help you.
        - id: ch01-b04
          speaker: narrator
          text: >-
            Before our Lord could answer, a man arrived with a horse and asked the smith to shoe it.
        - id: ch01-b05
          speaker: lord
          text: Will you let me shoe the horse?
        - id: ch01-b06
          speaker: smith
          text: >-
            Try if you like. You can't do such a bad job that I won't be able to put it right.
        - id: ch01-b07
          speaker: narrator
          text: >-
            Our Lord went outside and took off one of the horse's legs. He laid it in the furnace and heated the shoe red-hot. Then he turned up the ends of the shoe, filed down the heads of the nails, and clenched their points. When that was done, he put the leg back on the horse, safe and sound. Next he took the other front leg and did the same thing. Then came the hind legs, the far one first and the near one after it. Each went into the furnace. Each shoe was heated and shaped, and every nail was filed and clenched before the leg went safely back in place. Through it all, the smith stood nearby and watched.
        - id: ch01-b08
          speaker: smith
          text: You're not such a poor smith after all.
        - id: ch01-b09
          speaker: lord
          text: Oh, is that what you think?
        - id: ch01-b10
          speaker: narrator
          text: >-
            Soon the smith's mother came to the forge to call him home for dinner. She was very old. Her back was bent into an ugly crook, her face was wrinkled, and she could barely crawl along.
        - id: ch01-b11
          speaker: smiths_mother
          text: Come home now. Your dinner is ready.
        - id: ch01-b12
          speaker: lord
          text: Watch carefully now.
        - id: ch01-b13
          speaker: narrator
          text: >-
            Our Lord laid the old woman in the furnace and smithied her into a lovely young maiden.
        - id: ch01-b14
          speaker: smith
          text: >-
            Well, I'll say it again. You're not such a poor smith after all. My sign still says, "Here dwells the Master over all Masters." Even so, a man keeps learning as long as he lives.
        - id: ch01-b15
          speaker: narrator
          text: With that, the smith went home and ate his dinner.
    - id: ch02
      title: The Smith Tries the New Craft
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            Just after dinner, the smith returned to his forge. Another man rode up and asked to have his horse shod.
        - id: ch02-b02
          speaker: smith
          text: >-
            I'll finish it in the blink of an eye. I've just learned a new way to shoe a horse, and it's a fine method when the days are short.
        - id: ch02-b03
          speaker: narrator
          text: >-
            The smith began cutting and hacking until he had all four legs off the horse. He could not see why anyone should fuss back and forth, first with one leg and then another. He put all the legs into the furnace just as he had seen our Lord do. Then he heaped on a great load of coal and made his mates pump the bellows with all their strength. But the work went exactly as you might suppose. The four legs burned away to ashes, and the smith had to pay the owner for his horse.
        - id: ch02-b04
          speaker: narrator
          text: >-
            He did not trouble much over that. Just then, an old beggar woman came along the road, and the smith thought he might have better luck this time. He put her into the furnace, though she begged and prayed for her life.
        - id: ch02-b05
          speaker: beggar_woman
          text: Please, sir, spare me! Let me go!
          emotion: fearful
        - id: ch02-b06
          speaker: smith
          text: >-
            You're too old to know what's best for you. In no time at all, I'll make you a lovely young maiden. And I won't charge you a penny.
        - id: ch02-b07
          speaker: narrator
          text: But the poor woman fared no better than the horse's legs.
        - id: ch02-b08
          speaker: lord
          text: That was badly done, and I mean it.
        - id: ch02-b09
          speaker: smith
          text: >-
            Well, I doubt many people will come asking for her. But shame on the Devil if this is how he keeps the promise written over my door.
        - id: ch02-b10
          speaker: lord
          text: If I gave you three wishes, what would you choose?
        - id: ch02-b11
          speaker: smith
          text: Give me the chance, and you'll soon find out.
        - id: ch02-b12
          speaker: narrator
          text: So our Lord granted him three wishes.
        - id: ch02-b13
          speaker: smith
          text: >-
            First, if I ask anyone to climb the pear tree beside my forge wall, let that person stay there until I say they may come down. Second, if I ask anyone to sit in the easy chair inside my workshop, let that person stay there until I say they may rise. And last, if I ask anyone to crawl into the steel purse in my pocket, let that person stay inside until I give leave to come out.
        - id: ch02-b14
          speaker: st_peter
          text: >-
            Those are wicked wishes. Your first wish should have been for God's grace and goodwill.
        - id: ch02-b15
          speaker: smith
          text: I didn't dare aim as high as that.
        - id: ch02-b16
          speaker: narrator
          text: Then our Lord and St Peter said goodbye and went on their way.
    - id: ch03
      title: The Pear Tree and the Easy Chair
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            The years rolled by. When the agreed time was over, the Devil came to claim the smith.
        - id: ch03-b02
          speaker: devil
          text: Are you ready?
        - id: ch03-b03
          speaker: narrator
          text: The Devil had only poked his nose through the forge door.
        - id: ch03-b04
          speaker: smith
          text: >-
            I only need to finish hammering the head of this tenpenny nail. While you wait, climb the pear tree and pick yourself a pear. You must be hungry and thirsty after your journey.
        - id: ch03-b05
          speaker: narrator
          text: The Devil thanked him for the offer and climbed the tree.
        - id: ch03-b06
          speaker: smith
          text: >-
            Good. But now that I think about it, this iron is so terribly hard that the nail head will take me at least four years. You can't come down until then, so you may as well sit there and rest your bones.
        - id: ch03-b07
          speaker: narrator
          text: >-
            The Devil begged and pleaded until his voice grew as thin as a silver penny. He begged for nothing more than permission to climb down. It did no good. There he was, and there he had to remain. At last he gave his word of honor that he would not return until the four years named by the smith had passed.
        - id: ch03-b08
          speaker: devil
          text: Let me down, and I swear I won't return before the four years are over!
        - id: ch03-b09
          speaker: smith
          text: Very well. You may come down now.
        - id: ch03-b10
          speaker: narrator
          text: >-
            Four years later, the Devil came back to fetch the smith.
        - id: ch03-b11
          speaker: devil
          text: >-
            Surely you're ready now. You've had long enough to hammer that nail head.
        - id: ch03-b12
          speaker: smith
          text: >-
            The head is finished, yes. But you've arrived just a little too soon. I still have to sharpen the point. I've never worked such terribly hard iron in my life. Sit in my easy chair and rest while I finish. You must be tired after traveling so far.
        - id: ch03-b13
          speaker: devil
          text: Thank you kindly.
        - id: ch03-b14
          speaker: narrator
          text: >-
            The Devil dropped into the chair and made himself comfortable. Then the smith said that, on second thought, sharpening the point would take another four years.
        - id: ch03-b15
          speaker: narrator
          text: >-
            At first the Devil begged very sweetly to be released from the chair. When that failed, he grew furious and began to threaten and scold. The smith went on making excuses all the while. He said it was entirely the fault of the iron, which was so terribly hard. Besides, the Devil was not so badly treated when all he had to do was sit quietly in an easy chair. The smith promised to let him out at the very minute the four years ended.
        - id: ch03-b16
          speaker: devil
          text: Let me out of this chair! If you don't, you'll be sorry!
          emotion: angry
        - id: ch03-b17
          speaker: narrator
          text: >-
            There was nothing the Devil could do. He had to give his word of honor not to fetch the smith until four more years had passed.
        - id: ch03-b18
          speaker: smith
          text: There now. You may get up and be about your business.
        - id: ch03-b19
          speaker: narrator
          text: The Devil ran away as fast as his legs could carry him.
    - id: ch04
      title: The Steel Purse
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            When those four years were over, the Devil came once more. He poked his nose through the forge door and called to the smith.
        - id: ch04-b02
          speaker: devil
          text: This time, I know you must be ready.
        - id: ch04-b03
          speaker: smith
          text: >-
            Ready, yes. We can leave whenever you like. But there's one thing I've stood here wondering about. Is it true that the Devil can make himself as small as he pleases?
        - id: ch04-b04
          speaker: devil
          text: God knows it's perfectly true.
        - id: ch04-b05
          speaker: smith
          text: >-
            So it is true! Then please crawl into my steel purse and check whether the bottom is sound. To tell the truth, I'm afraid my traveling money might fall out.
        - id: ch04-b06
          speaker: devil
          text: Gladly.
        - id: ch04-b07
          speaker: narrator
          text: >-
            The Devil was willing to prove his power. In an instant, he made himself tiny and crept into the steel purse. He had scarcely gone all the way inside when the smith snapped the clasp shut behind him.
        - id: ch04-b08
          speaker: devil
          text: It's sound and tight everywhere.
        - id: ch04-b09
          speaker: smith
          text: >-
            Very good. I'm glad to hear it. But haste makes waste, and it's best to be prepared. For safety, I'll weld these links together a little.
        - id: ch04-b10
          speaker: narrator
          text: The smith laid the purse in the furnace and heated it red-hot.
        - id: ch04-b11
          speaker: devil
          text: Ow! Ow! Are you mad? Don't you know I'm inside this purse?
          emotion: fearful
        - id: ch04-b12
          speaker: smith
          text: >-
            Yes, I know. But I can't help it. As the old saying goes, you must strike while the iron is hot.
        - id: ch04-b13
          speaker: narrator
          text: >-
            The smith picked up his sledgehammer, put the purse on the anvil, and struck it with all his might.
        - id: ch04-b14
          speaker: devil
          text: Ow! Ow! Ow! Dear friend, let me out, and I'll never come near you again!
          emotion: fearful
        - id: ch04-b15
          speaker: smith
          text: >-
            Very well. I think the links are properly welded now. You may come out.
        - id: ch04-b16
          speaker: narrator
          text: >-
            He opened the clasp, and the Devil fled so fast that he never once looked behind him.
    - id: ch05
      title: The Roads to Hell and Heaven
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: >-
            Some time later, the smith began to think he had been foolish to make an enemy of the Devil.
        - id: ch05-b02
          speaker: smith
          text: >-
            They probably won't take me into the kingdom of Heaven. And since I've quarreled with the ruler of Hell, I may have nowhere to live at all.
        - id: ch05-b03
          speaker: narrator
          text: >-
            He decided that the best thing was to try for a place in either Hell or Heaven. He would do it at once instead of putting it off, so he could learn exactly how matters stood. With that settled, he threw his sledgehammer over his shoulder and set out on the road.
        - id: ch05-b04
          speaker: narrator
          text: >-
            After a long way, he reached a crossroads. One path led to the kingdom of Heaven, and the other led to Hell. There he caught up with a tailor who was hurrying along with his pressing iron in his hand.
        - id: ch05-b05
          speaker: smith
          text: Good day. Where are you going in such a hurry?
        - id: ch05-b06
          speaker: tailor
          text: >-
            To the kingdom of Heaven, if they'll let me in. Where are you going?
        - id: ch05-b07
          speaker: smith
          text: >-
            Then we aren't taking the same road. I'll try Hell first. The Devil and I have known each other for a long time.
        - id: ch05-b08
          speaker: narrator
          text: >-
            They said goodbye and went their separate ways. The smith was a strong, sturdy man, and he covered the ground far faster than the tailor. It was not long before he stood at the gates of Hell. He called for the watchman and ordered him to tell the Devil that someone outside wanted a word with him.
        - id: ch05-b09
          speaker: devil
          text: Go and ask who he is.
        - id: ch05-b10
          speaker: narrator
          text: The watchman came out and put the question to the smith.
        - id: ch05-b11
          speaker: hell_watch
          text: Who are you?
        - id: ch05-b12
          speaker: smith
          text: >-
            Give the Devil my greetings. Tell him it's the smith who owns that purse he remembers. Ask him kindly to let me in at once. I worked at my forge until noon, and I've walked a long way since then.
        - id: ch05-b13
          speaker: narrator
          text: >-
            The watchman carried the message inside. As soon as the Devil heard who was waiting, he gave a sharp order.
        - id: ch05-b14
          speaker: devil
          text: >-
            Go back and fasten all nine locks on the gates. Put on a padlock too. If that smith gets inside, he'll turn all Hell upside down!
          emotion: fearful
        - id: ch05-b15
          speaker: narrator
          text: The smith watched them bolt the gates.
        - id: ch05-b16
          speaker: smith
          text: >-
            Well, it's plain that I won't find lodging here. I may as well try my luck in the kingdom of Heaven.
        - id: ch05-b17
          speaker: narrator
          text: >-
            He turned around and walked all the way back to the crossroads. From there he took the path the tailor had followed toward Heaven. He was cross at having gone so far backward and forward for no good at all, so he strode along with all his strength.
        - id: ch05-b18
          speaker: narrator
          text: >-
            He reached Heaven's gate just as St Peter opened it a tiny way, barely wide enough for the half-starved tailor to slip through. The smith was still six or seven strides away.
        - id: ch05-b19
          speaker: smith
          text: There's no time to lose now.
        - id: ch05-b20
          speaker: narrator
          text: >-
            He gripped his sledgehammer and hurled it through the narrow opening just as the tailor slipped inside.
        - id: ch05-b21
          speaker: narrator
          text: >-
            And if the smith did not get in while the door stood ajar, then I do not know what became of him.
