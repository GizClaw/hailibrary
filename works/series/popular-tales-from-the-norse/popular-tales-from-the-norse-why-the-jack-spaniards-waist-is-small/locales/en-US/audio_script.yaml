audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: thoughtful and gently wry
        timbre: warm and clear
        pace: measured
        pitch: medium
    ananzi:
      display_name: Ananzi
      tts:
        delivery: proudly boastful
        timbre: light and lively
        pace: moderate
        pitch: medium
    mosquito:
      display_name: Mosquito
      tts:
        delivery: quick and competitive
        timbre: thin and bright
        pace: brisk
        pitch: high
  chapters:
    - id: ch01
      title: Why the Jack-Spaniard's Waist Is Small
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: One day, Ananzi and Mosquito were talking, and each began to brag about his father's crops.
        - id: ch01-b02
          speaker: ananzi
          text: My father has never grown a crop like this in all his life!
        - id: ch01-b03
          speaker: mosquito
          text: I'm sure my father's crop is bigger. Why, one yam we dug up was as big as my leg!
        - id: ch01-b04
          speaker: narrator
          text: Jack-Spaniard found that so funny that he laughed and laughed, until his waist broke right in two. And that is why the Jack-Spaniard's waist is so small.
