audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 从容而清醒，带一点克制的诙谐
        timbre: 温厚清晰
        pace: 舒缓有致
        pitch: 中低
    ananzi:
      display_name: 阿南西
      tts:
        delivery: 得意健谈，夸耀时理直气壮
        timbre: 明亮灵活
        pace: 中等
        pitch: 中高
    mosquito:
      display_name: 蚊子
      tts:
        delivery: 不甘示弱，语气轻快而笃定
        timbre: 轻细清晰
        pace: 中等偏快
        pitch: 高
  chapters:
    - id: ch01
      title: 比谁家的收成好
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 有一天，阿南西和蚊子凑在一起聊天。说着说着，他们比起了各自父亲田里的收成。
        - id: ch01-b02
          speaker: ananzi
          text: 我父亲今年的收成好极了，他这辈子都没见过这么好的年景。
        - id: ch01-b03
          speaker: mosquito
          text: 我敢说，我父亲的收成更好。我们挖出的一根薯蓣，足有我的腿那么粗呢。
    - id: ch02
      title: 笑断了腰
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 西班牙蜂听了，觉得实在好笑。他笑个不停，竟把腰笑断成了两截。
    - id: ch03
      title: 细腰的来历
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 所以呀，西班牙蜂的腰才会这么细。
