audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 从容而清醒，带一点克制的诙谐
        timbre: 温厚清晰
        pace: 舒缓有致
        pitch: 中低
  chapters:
    - id: ch01
      title: 第一版说明
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 阿斯比约恩森和穆两位先生搜集了《挪威民间故事集》，既保留了故事的鲜活，也忠实记下了原貌。过去十五年里，译者断断续续地把这些故事译了出来，每次相隔很久。说起这一点，只是为了说明，本书的文风和语调也许并不处处相同。译者自己虽然没有察觉，眼光敏锐的批评家或许看得出来。其中的《神偷》，早在一八五一年十一月就登上了《布莱克伍德杂志》。这次得到杂志主人的许可，才重新收入本书。
        - id: ch01-b02
          speaker: narrator
          text: 有几位朋友真心关照译者，他们的情意，译者很看重。这些朋友觉得，有些情节可能会冒犯英国读者，便劝他改一改，写得柔和一点。没能照办，译者很觉遗憾。可这件事，他确实不能让步。这种翻译有多少价值，全看它是否忠实、是否真实。谁要是明知原貌如何，却偏要更改、淡化，谁就和那“以苦为甜、以甜为苦”的人犯了同样的过错。
        - id: ch01-b03
          speaker: narrator
          text: 至少，译者相信自己没有犯下这种过错。有些读者开头也许会觉得被冒犯了。可要是肯读一读前面的《导言》，看看那里怎样解释这些故事，也许就会明白，把它们写得温和，只会毁掉这些民间传说。到那时，除了心智最幼稚的读者，谁也无法领略它们本来的意味。至于那些第一眼看来骇人的东西，说到底，其实也不那么骇人。
        - id: ch01-b04
          speaker: narrator
          text: 再往下，译者就不该自己评论这番工作做得怎样了。不过，请读者记得，这里也是一座中了魔法的花园。任何人胆敢摘下一朵花，都得冒着掉脑袋的危险。明白了这一点，再怀着宽容温厚的心来读这本书，你便成了译者最盼望遇见的那种“宽厚读者”。等到书读完，译者和读者也就能带着最好的情分彼此告别。
