audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: thoughtful and gently wry
        timbre: warm and clear
        pace: measured
        pitch: medium
  chapters:
    - id: ch01
      title: Notice to the First Edition
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            These translations come from the Norske Folkeeventyr, the collection made with such freshness and faithfulness by Asbjörnsen and Moe. The Translator worked on them at different times, with long pauses between them, over the past fifteen years. He mentions this only because a careful reader may notice changes in style or tone, though the Translator himself is not aware of any. One tale, The Master Thief, has appeared before. It was printed in Blackwood's Magazine in November 1851, and it is reprinted here with the kind permission of the magazine's Proprietors.
        - id: ch01-b02
          speaker: narrator
          text: >-
            Some friends, whose good will matters greatly to the Translator, asked him to change or soften parts of these tales that they thought might shock English readers. He is sorry that he could not follow their advice. But he felt he had no power to do so. A work like this has value only when it is faithful and true. Anyone who deliberately changes or softens it is as guilty as the man who puts bitter in place of sweet, and sweet in place of bitter.
        - id: ch01-b03
          speaker: narrator
          text: >-
            At least the Translator believes he is free of that guilt. Some readers may feel offended at first. But if they take the trouble to read the Introduction that comes before the tales and explains them, perhaps they will see matters differently. Softening the stories would have spoiled these popular traditions for everyone but the most childish readers. And the things that seemed shocking at first may turn out not to be very shocking after all.
        - id: ch01-b04
          speaker: narrator
          text: >-
            As for the way the work itself has been done, it would not be right for the Translator to praise it. He asks the reader to remember instead that this book, too, is an enchanted garden. Anyone who dares to pluck a flower there does so at the peril of his head. Then, if the reader approaches the book with mercy and tenderness, he will become what the Translator most longs to find: a gentle reader. Translator and reader will part on the best of terms.
