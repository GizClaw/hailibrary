audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 从容而清醒，带一点克制的诙谐
        timbre: 温厚清晰
        pace: 舒缓有致
        pitch: 中低
    husband:
      display_name: 丈夫
      tts:
        delivery: 粗暴急躁，忙乱时越来越慌张
        timbre: 粗重有力
        pace: 中等偏快
        pitch: 中低
    wife:
      display_name: 老伴
      tts:
        delivery: 泼辣果断，说话干脆利落
        timbre: 清晰有力
        pace: 稍快
        pitch: 中
  chapters:
    - id: ch01
      title: 夫妻换活儿
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 从前有个男人，脾气又臭又凶。妻子在家里做什么，他都觉得不对。割草季节里的一天傍晚，他一回家就骂个不停，还龇牙瞪眼，把屋里闹得不得安宁。
        - id: ch01-b02
          speaker: wife
          text: 亲爱的，别发这么大的火。明天咱俩换换活儿，好不好？我出去跟大家割草，你留在家里照看屋子，料理家务。
          emotion: calm
        - id: ch01-b03
          speaker: narrator
          text: 丈夫一听，觉得这个安排好极了，当即答应下来。第二天一早，老伴扛着镰刀去了草场，跟割草的人一起干活。男人则留在家里，接手了所有家务。
    - id: ch02
      title: 越忙越乱
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 他先动手搅黄油。才搅了一会儿，口就渴了，于是下到地窖，想从麦酒桶里接点酒喝。他刚敲开桶塞，正要安上龙头，忽然听见楼上的猪闯进了厨房。他抓着龙头冲上台阶，生怕猪撞翻搅乳桶。可惜已经晚了。猪把桶拱倒，站在流了满地的奶油里，又乱拱，又哼哼。
        - id: ch02-b02
          speaker: narrator
          text: 男人气疯了，早把地窖里的酒桶忘到了脑后。他追着猪冲出门，在门外一把逮住它，狠狠踹了一脚。猪倒在地上，像是当场死了。
        - id: ch02-b03
          speaker: narrator
          text: 直到这时，他才瞧见手里还攥着酒龙头，猛然想起地窖里的麦酒。等他跑回去，桶里已经连一滴酒也没剩下。
        - id: ch02-b04
          speaker: narrator
          text: 男人进了奶房，发现剩下的奶油还够装满搅乳桶，便重新搅了起来。午饭总得有黄油。可搅着搅着，他又想起奶牛还关在牛棚里。太阳都升得老高了，牛一早上没吃一口，也没喝一滴。
        - id: ch02-b05
          speaker: narrator
          text: 草地太远，他懒得把牛赶过去，便打起了屋顶的主意。那座房子铺着草皮屋顶，草长得正好。屋后又紧挨一道陡坡，只要搭块木板，他觉得很容易就能把牛领上去。
        - id: ch02-b06
          speaker: narrator
          text: 可搅乳桶怎么办呢？家里的小娃娃还在地上爬来爬去。
        - id: ch02-b07
          speaker: husband
          text: 我一走开，这孩子准会把桶撞翻。
        - id: ch02-b08
          speaker: narrator
          text: 于是，他把搅乳桶背在背上，带出了屋。放牛上屋顶之前，还得先给它喝水。他提起水桶来到井边，刚一弯腰，背后桶里的奶油便顺着肩头全淌下来，一股脑儿掉进了井里。
    - id: ch03
      title: 烟囱和粥锅
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 午饭时候眼看就要到了，黄油却连影子也没有。男人只好先煮粥。他往锅里盛满水，吊到火上。紧接着，他又担心奶牛会从屋顶摔下来，不是跌断腿，就是摔断脖子，只得爬上去拴牛。
        - id: ch03-b02
          speaker: narrator
          text: 他把绳子的一头系在牛脖子上，另一头从烟囱里垂下去，捆住自己的大腿。这边，锅里的水已经开了，那边，燕麦还没磨。他赶忙下来，使劲磨起燕麦。
        - id: ch03-b03
          speaker: narrator
          text: 可就在他忙得不可开交时，奶牛到底还是从屋顶摔了下去。绳子猛地一扯，把男人拽进烟囱，死死卡在里面。奶牛呢，吊在半面墙高的地方，上不着天，下不着地，晃来晃去。它既上不去，也下不来。
        - id: ch03-b04
          speaker: narrator
          text: 老伴在草场上等了七长七宽，始终没听见丈夫来叫大伙儿回家吃饭。最后，她觉得实在等得够久了，便自己往家走。
        - id: ch03-b05
          speaker: narrator
          text: 到家一看，奶牛正吊在危险的半空。她赶紧跑上去，挥起镰刀，一下割断了绳子。绳子刚断，丈夫便从烟囱里直坠下来。
        - id: ch03-b06
          speaker: narrator
          text: 等老伴走进厨房，只见丈夫头朝下，倒栽在那口粥锅里。
