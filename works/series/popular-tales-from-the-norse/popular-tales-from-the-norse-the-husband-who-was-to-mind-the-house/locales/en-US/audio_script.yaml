audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: thoughtful and gently wry
        timbre: warm and clear
        pace: measured
        pitch: medium
    husband:
      display_name: Husband
      tts:
        delivery: gruff and quick-tempered
        timbre: rough and sturdy
        pace: brisk
        pitch: medium-low
    wife:
      display_name: Wife
      tts:
        delivery: patient and practical
        timbre: warm and steady
        pace: moderate
        pitch: medium
  chapters:
    - id: ch01
      title: A Change of Work
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Once upon a time, there was a man who was always cross and bad-tempered. Whatever his wife did around the house, he thought she had done it wrong. One evening during haymaking, he came home scolding and swearing. He bared his teeth and made a great fuss.
        - id: ch01-b02
          speaker: wife
          text: My dear, please don't be so angry. Tomorrow, why don't we trade jobs? I'll go to the hayfield and mow with the others, and you can stay home and take care of the house.
          emotion: calm
        - id: ch01-b03
          speaker: narrator
          text: The husband thought that would suit him very well, and he gladly agreed. Early the next morning, his wife carried a scythe over her shoulder, joined the mowers in the field, and began to mow. Her husband stayed behind to do the housework.
    - id: ch02
      title: The Ale and the Pig
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: First, he set about churning butter. After a while, he grew thirsty, so he went down to the cellar to tap a barrel of ale. He had just knocked out the bung and was fitting the tap when he heard the pig in the kitchen overhead.
        - id: ch02-b02
          speaker: narrator
          text: Afraid the pig would knock over the churn, he raced up the cellar steps as fast as he could, with the tap still in his hand. But he was too late. The churn lay on its side, and cream was running all across the kitchen floor while the pig rooted and grunted in the middle of it.
        - id: ch02-b03
          speaker: narrator
          text: The sight made him so furious that he forgot the open ale barrel. He rushed at the pig and caught it just outside the door. Then he kicked it so hard that the poor creature fell there as if dead.
        - id: ch02-b04
          speaker: narrator
          text: Only then did he notice the tap in his hand. He hurried back to the cellar, but every drop of ale had already poured out of the barrel.
    - id: ch03
      title: The Cow on the Roof
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: He found enough cream in the dairy to fill the churn once more. They needed butter for dinner, so he started churning again. Before long, he remembered the cow. She was still shut in the byre without food or water, though the sun was already high.
        - id: ch03-b02
          speaker: narrator
          text: The meadow seemed too far away. Then he thought of the roof. It was covered with sod, and a fine crop of grass grew on top. The house stood close against a steep hillside at the back. He laid a plank from the hill to the thatch and led the cow across to graze.
        - id: ch03-b03
          speaker: narrator
          text: Still, he did not dare leave the churn behind. His little baby was crawling on the floor, and he was sure the child would upset it. He strapped the churn to his back and went out. Then he decided the cow should have water before she began to graze.
        - id: ch03-b04
          speaker: narrator
          text: He picked up a bucket and bent over the well. At once, all the cream spilled from the churn, ran down his shoulders, and fell straight into the water.
    - id: ch04
      title: Between Heaven and Earth
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: Dinner was drawing near, and he still had no butter. He decided to make porridge instead. He filled a pot with water, hung it over the fire, and left it to heat.
        - id: ch04-b02
          speaker: narrator
          text: Then he began to worry that the cow might fall from the roof and break her legs or her neck. He climbed up to tie her securely. One end of the rope went around the cow's neck. He slipped the other end down the chimney and tied it around his own thigh.
        - id: ch04-b03
          speaker: narrator
          text: He had to hurry now. The water was starting to boil, and the oatmeal still needed grinding. So he began turning the mill as fast as he could.
        - id: ch04-b04
          speaker: narrator
          text: While he was hard at work, the cow tumbled off the roof. The rope jerked the husband straight up the chimney, where he stuck fast. Outside, the cow hung halfway down the wall, swinging between heaven and earth. She could not get down, and she could not climb back up.
    - id: ch05
      title: Dinner at Last
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: Out in the hayfield, the wife waited seven lengths and seven breadths for her husband to call everyone home to dinner. No call came. At last, she decided she had waited long enough and headed home.
        - id: ch05-b02
          speaker: narrator
          text: When she arrived, she saw the cow dangling in that dreadful place. She ran up with her scythe and cut the rope in two.
        - id: ch05-b03
          speaker: narrator
          text: Down came her husband through the chimney. And when his wife stepped into the kitchen, there he was, standing on his head in the porridge pot.
