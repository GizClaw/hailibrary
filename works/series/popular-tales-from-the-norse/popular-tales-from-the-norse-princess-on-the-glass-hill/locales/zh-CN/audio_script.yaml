audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 从容而清醒，带一点克制的诙谐
        timbre: 温厚清晰
        pace: 舒缓有致
        pitch: 中低
    father:
      display_name: 父亲
      tts:
        delivery: 务实严肃，说话干脆
        timbre: 粗厚沉稳
        pace: 中等
        pitch: 中低
    eldest_brother:
      display_name: 大哥
      tts:
        delivery: 自负刻薄，爱夸耀也爱嘲弄
        timbre: 洪亮偏硬
        pace: 中等偏快
        pitch: 中等
    second_brother:
      display_name: 二哥
      tts:
        delivery: 傲慢轻佻，嘲笑时尖酸
        timbre: 清亮偏薄
        pace: 中等偏快
        pitch: 中高
    boots:
      display_name: 小靴子
      tts:
        delivery: 朴实镇定，机敏中带着不动声色的幽默
        timbre: 年轻温暖
        pace: 中等偏缓
        pitch: 中等
    king:
      display_name: 国王
      tts:
        delivery: 威严直接，裁断时郑重有力
        timbre: 饱满厚重
        pace: 中等偏缓
        pitch: 低
    princess:
      display_name: 公主
      tts:
        delivery: 真挚含蓄，心愿里带着热切
        timbre: 柔和明亮
        pace: 中等
        pitch: 中高
  chapters:
    - id: ch01
      title: 年年消失的青草
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 从前，有个人在高高的山坡上拥有一片草场。草场离家很远，他在那里盖了一座谷仓，好把收来的干草堆进去。可是近一两年，谷仓里根本没收进多少草。每到圣约翰节前夜，青草正长得又青又密，第二天却被啃得贴了地皮，就像夜里来过整整一群羊。头一年如此，第二年又是如此。这个人眼看一季季的干草全没了，终于受够了。他有三个儿子，最小的照例被人叫作小靴子。
        - id: ch01-b02
          speaker: father
          text: 今年的圣约翰节前夜，你们必须有一个睡到远处草场的谷仓里去。要是再让那些草像前两年一样连根带叶地被吃光，那可实在荒唐。无论谁去，都得睁大眼睛，好好守着。
        - id: ch01-b03
          speaker: narrator
          text: 大儿子立刻答应下来，还让父亲尽管相信他。他认定，不管来的是人，是牲口，哪怕是魔鬼本尊，也别想偷走一根草。傍晚，他去了谷仓，躺下睡觉。夜深不久，忽然一阵轰隆巨响，大地猛地震动，连四壁和屋顶都在摇晃、呻吟、吱嘎作响。他一跃而起，撒腿便逃，一直飞奔回家也没敢回头看上一眼。第二天，青草照旧被吃得精光。
        - id: ch01-b04
          speaker: narrator
          text: 又过一年，父亲说，不能再让远处草场的青草这样年年白白丢掉，必须有人走一趟，而且要仔细看守。这一次二儿子愿意碰碰运气。他来到草场，也像哥哥先前那样躺进谷仓。可夜越来越深，地下传来比去年圣约翰节前夜更可怕的轰鸣和震动。二儿子一听就吓坏了，拔腿便跑，像是在跟人拼命赛跑。
        - id: ch01-b05
          speaker: narrator
          text: 第三年轮到小靴子。两个哥哥一见他准备出门，便笑着挖苦他。
        - id: ch01-b06
          speakers: [eldest_brother, second_brother]
          ensemble: duo
          text: 守干草的差事可太适合你了！你这辈子除了坐在炉灰里烤火，还干过什么呀？
        - id: ch01-b07
          speaker: narrator
          text: 小靴子根本不把他们的闲话放在心上。傍晚，他迈着沉重的步子爬上山坡，来到远处草场的谷仓里躺下。大约过了一个钟头，整座谷仓忽然呻吟起来，到处都在吱嘎乱响，那声音听着实在叫人胆寒。
        - id: ch01-b08
          speaker: boots
          text: 要是只有这么厉害，我还受得住。
        - id: ch01-b09
          speaker: narrator
          text: 过了一会儿，又是一阵巨响，大地跟着震颤，碎草都飞到了他的耳边。
        - id: ch01-b10
          speaker: boots
          text: 要是后面没有更厉害的，我想我也能熬过去。
        - id: ch01-b11
          speaker: narrator
          text: 紧接着，第三阵轰鸣来了，大地第三次震动。小靴子觉得墙壁和屋顶都快砸到头上了。可震动终于停下，四周静得像死亡一般。
        - id: ch01-b12
          speaker: boots
          text: 我敢说，它还会再来。
        - id: ch01-b13
          speaker: narrator
          text: 然而它没有再来。四下始终一片死寂。小靴子躺了一会儿，忽然听见门外有响动，像是一匹马正站在谷仓旁边嚼草。他悄悄走到门边，从一道缝隙往外看。那里果真站着一匹马，吃得正香。那匹马又高大，又肥壮，又神气，小靴子平生从没见过这样的骏马。草地上还放着鞍子、辔头和一整副骑士的黄铜铠甲，亮得连光线都从上面闪出来。
        - id: ch01-b14
          speaker: boots
          text: 哈，原来是你吃光了我家的干草！这回我可要治住你。
        - id: ch01-b15
          speaker: narrator
          text: 他一点时间也没耽搁，从火绒盒里取出火镰，往马身上一抛。马立刻一步也动不了，还温顺得任他摆布。小靴子骑上马，把它带到一个无人知晓的地方，在那里安顿好，然后才回了家。哥哥们见到他，马上笑着问他这一夜守得怎么样。
        - id: ch01-b16
          speakers: [eldest_brother, second_brother]
          ensemble: duo
          text: 就算你有胆子走到草场，也没敢在谷仓里待多久吧？
        - id: ch01-b17
          speaker: boots
          text: 我一直躺到太阳升起来，什么也没看见，什么也没听见。那座谷仓到底有什么可怕的，竟能把你们俩吓成那样？
        - id: ch01-b18
          speakers: [eldest_brother, second_brother]
          ensemble: duo
          text: 你倒真会讲。草场守成什么样，我们自己去看！
        - id: ch01-b19
          speaker: narrator
          text: 他们跑到草场，只见青草仍旧又密又深，和前一晚毫无两样。
    - id: ch02
      title: 银马与金马
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 下一个圣约翰节前夜，同样的事情又重演了。两个哥哥谁也不敢再到远处的草场看守，小靴子却照样走进谷仓。先是一次轰响和震动，又来一次更猛烈的，接着还有第三次。这一年的动静比去年大得多。随后，周围忽然又静得像死亡一般。门外传来了嚼草声，小靴子便悄悄走到门边，从缝隙往外看。你猜他看见了什么？另一匹马正紧贴着墙站在那里，使足力气大嚼特嚼。它比第一匹更俊美，也更肥壮，背上有鞍，颈上有辔头，身旁还放着一整副骑士的银甲，华美得叫人再也想不出更好的来。
        - id: ch02-b02
          speaker: boots
          text: 哈，这回是你来吞我家的干草了！我马上让你再也捣不了乱。
        - id: ch02-b03
          speaker: narrator
          text: 他从火绒盒里取出火镰，把它抛过马头。那匹马便像小羊一样站着不动。小靴子也骑上这匹马，来到那个不为人知的藏身处，把它留在第一匹马身旁，这才回家。
        - id: ch02-b04
          speaker: eldest_brother
          text: 你准又要说，今年草场里的草也长得好极了吧？
        - id: ch02-b05
          speaker: boots
          text: 没错，确实长得很好。
        - id: ch02-b06
          speaker: narrator
          text: 哥哥们飞跑去看，青草果然仍旧又密又深。可他们对小靴子的口气还是一点儿也不和善。
        - id: ch02-b07
          speaker: narrator
          text: 第三年的圣约翰节前夜，两个哥哥依旧不敢躺进谷仓守草。先前那一夜的惊吓早已钻进他们心里，怎么也甩不掉。小靴子却又去了。长话短说，发生的事情跟前两次一样。三次震动接连袭来，一次比一次可怕。最后那一下，震得他在谷仓两面墙之间来回蹦跳。等一切骤然安静下来，四周又静得像死亡一般。他躺了一会儿，听见外面有东西正在用力扯草，便再次来到门缝边偷看。门外站着第三匹马，比前两匹大得多，也肥壮得多。
        - id: ch02-b08
          speaker: boots
          text: 哈，又是你来吃我家的干草！我这就叫你停下来。
        - id: ch02-b09
          speaker: narrator
          text: 小靴子一把抓起火镰，把它抛过马颈。转眼间，那匹马就像被钉在地上一样，只能任他摆布。他骑着马，把它送到另外两匹马那里，随后才回家。哥哥们照旧拿他取乐，说光看他的模样，就知道他把草守得有多好，因为他简直像是在梦游。他们又讲了许多刻薄话。小靴子一句也不理，只让他们亲自去看看。草场上的青草仍和前两次一样，长得茂密又深厚。
    - id: ch03
      title: 玻璃山下的第一天
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 小靴子住的国家里有一位国王。国王有个女儿。他宣布，自己只会把公主嫁给能够骑上玻璃山的人。王宫旁边那座山高得惊人，整座山通体是玻璃，像冰面一样光滑溜滑。公主要坐在最高的山顶，膝上放着三只金苹果。谁能骑到那里，把三只金苹果带走，谁就能娶公主，还能得到半个王国。国王把告示贴满了国内每一座教堂的大门，也把消息传到了许多别的王国。
        - id: ch03-b02
          speaker: narrator
          text: 公主美得叫每一个见过她的人，不管愿不愿意，都会深深爱上她。王子和骑士们听说这件事，自然全都盼着把公主和半个王国一起赢到手。他们穿着最华贵的衣裳，骑着昂首腾跃的骏马，从世界各处赶来。没有一个人怀疑，最后获胜的一定是自己，而且只会是自己。
        - id: ch03-b03
          speaker: narrator
          text: 国王定下的比试之日终于到了。玻璃山下挤满了王子和骑士，望上一眼便叫人头晕目眩。国内凡是还爬得动的人也全都赶来了，因为大家都想亲眼瞧瞧，最后赢得公主的究竟是谁。小靴子的两个哥哥随着人群出发，却明明白白地不准他跟着。他们嫌这个怪胎替人刷鞋，又在灰坑里筛煤渣，弄得浑身又脏又黑，怕别人看见他们走在一起，会连他们也一同笑话。
        - id: ch03-b04
          speaker: boots
          text: 随你们吧。我一个人也能去，是成是败，我自己担着。
        - id: ch03-b05
          speaker: narrator
          text: 到了山下，王子和骑士们正拼命策马冲坡，跑得匹匹马口吐白沫。可马蹄一踏上玻璃便往下滑，没有谁能前进一两码。这也难怪，那座山光滑得像一整片玻璃，又陡得像房屋的墙壁。人人都想娶到公主，再得到半个王国，只好一次次冲上去，再一次次滑下来。翻来覆去，结果始终一样。最后，马匹累得几乎抬不起一条腿，汗水混着白沫不断往下滴。骑士们只能承认失败，不再尝试。
        - id: ch03-b06
          speaker: narrator
          text: 国王正想宣布第二天重新比试，看看大家的运气会不会好些，一位骑士忽然骑马赶来。那匹马雄壮非凡，在场的人一辈子也没见过它的同类。骑士穿着黄铜铠甲，马衔着明亮的黄铜嚼子，阳光从上面反射出来。众人纷纷叫他别白费力气，说他去了也不会有好结果。他却全不理会，径直冲上山坡，轻轻松松骑到了三分之一高的地方，然后才掉转马头。
        - id: ch03-b07
          speaker: narrator
          text: 公主从没见过这么俊美的骑士。望着他往上骑，她默默祈愿。
        - id: ch03-b08
          speaker: princess
          text: 但愿上天保佑，让他一直骑到山顶，再从另一边下去。
        - id: ch03-b09
          speaker: narrator
          text: 见骑士开始折返，公主朝他抛下一只金苹果。苹果顺着玻璃山一路滚下去，恰好落进他的鞋里。骑士一下山便飞驰而去，谁也没看清他去了哪里。当天傍晚，所有王子和骑士都要依次来到国王面前，好让骑得最高、得到苹果的人把它拿出来。可一个又一个人走过，没有谁拿得出任何东西。
        - id: ch03-b10
          speaker: narrator
          text: 到了晚上，两个哥哥也回到家。他们说起当天骑马上山的场面，便滔滔不绝，仿佛那个长故事怎么讲也讲不完。
        - id: ch03-b11
          speakers: [eldest_brother, second_brother]
          ensemble: duo
          text: 起先谁也上不了一步。后来有个穿黄铜铠甲的骑士来了，马鞍和辔头也亮得隔一英里都看得见。那才叫会骑马！他到了三分之一高的地方。只要愿意，他准能登顶，可他大概觉得今天已经够了，就掉头下来了。
        - id: ch03-b12
          speaker: boots
          text: 我真想亲眼看看他。要是能看见就好了。
        - id: ch03-b13
          speakers: [eldest_brother, second_brother]
          ensemble: duo
          text: 你还想看？你也配跟那样的贵人待在一起吗？还是坐回你的灰堆里去吧！
    - id: ch04
      title: 银甲骑士
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 第二天，哥哥们又急着出发。小靴子再次请求和他们一起去看比试，可两人说他实在太丑、太脏，不管小靴子怎样恳求，他们都不肯带他同行。
        - id: ch04-b02
          speaker: boots
          text: 好吧。我要去，就自己去。我可不怕。
        - id: ch04-b03
          speaker: narrator
          text: 山下的王子和骑士又开始冲坡。这一次，他们当然早有准备，把马蹄钉得又尖又利，可还是没有用。马匹冲上去又滑下来，滑下来又重新冲上去，没有谁能走出一码。等到所有马都累得一条腿也挪不动，众人才不得不放弃。国王本想宣布后天做最后一次比试，好再给他们一个机会，却忽然决定多等一会儿，看看黄铜骑士今天会不会出现。
        - id: ch04-b04
          speaker: narrator
          text: 黄铜骑士始终没有来，另一位骑士却忽然出现了。他胯下的骏马远比昨天那匹更加俊美雄壮。骑士披着银甲，马也配着银鞍和银辔头。太阳照上去，远远就能看见光芒流转闪烁。众人再次冲他大喊，叫他勒马回头，不要尝试上山，免得一切辛苦都白费。他一句也不理，径直冲上玻璃山，一直到了三分之二高的地方，才拨转马头下来。
        - id: ch04-b05
          speaker: narrator
          text: 说实话，公主更喜欢这位银甲骑士，胜过前一天穿黄铜铠甲的那一位。她坐在山顶，一心盼着他能一直骑上来，再从另一边下去。可他已经折返了。公主只好把第二只金苹果朝他抛去，苹果沿着山坡滚下，落进骑士的鞋里。他一下玻璃山就飞奔而去，快得谁也没看清他去了哪里。
        - id: ch04-b06
          speaker: narrator
          text: 到了傍晚，众人再次依次走到国王和公主面前，好让得到金苹果的人把它拿出来。可是他们一个接一个走过，却还是没人拿得出苹果。两个哥哥回家以后，又讲起当天的全部经过，说所有人怎样冲坡，又怎样一次次失败，没有一个人能上去。
        - id: ch04-b07
          speakers: [eldest_brother, second_brother]
          ensemble: duo
          text: 最后来的是一位银甲骑士，连马鞍和辔头也都是银的。那才叫真正会骑马！他一直到了三分之二高才回头。那个人确实了不起，公主把第二只金苹果抛给了他。
        - id: ch04-b08
          speaker: boots
          text: 我也真想看看他。要是能亲眼见到就好了。
        - id: ch04-b09
          speakers: [eldest_brother, second_brother]
          ensemble: duo
          text: 说得真好听。也许你觉得他的银甲，就跟你成天拨弄的炉灰一样亮吧？你这个脏东西！
    - id: ch05
      title: 金甲骑士登上山顶
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 第三天发生的事和前两天一样。小靴子又求哥哥们带他去看热闹，两人还是不肯答应。玻璃山下依旧没人能向上走出一码。所有人都在等待银甲骑士，可既没有看见他，也没有听到他的消息。最后，一位骑士骑着世间无双的骏马出现了。他身披金甲，马配金鞍和金辔头。那一身装束明亮得不可思议，阳光照在上面，隔着一英里也能看见灿烂的光。
        - id: ch05-b02
          speaker: narrator
          text: 王子和骑士们全都看呆了，惊叹于他的威风，连劝他别试都顾不上。他直冲山坡，轻轻松松飞驰而上。公主甚至还没来得及盼望他登顶，他已经来到山巅，从她膝上取走第三只金苹果。接着他掉转马头，骑下玻璃山。才一落到山脚，他便全速飞驰，转眼消失得无影无踪。
        - id: ch05-b03
          speaker: narrator
          text: 晚上，两个哥哥回到家。你想也知道，他们又把当天的比试讲成了一段没完没了的长故事。他们说起每一个人的尝试，尤其花了许多工夫谈论那位身披黄金铠甲的骑士。
        - id: ch05-b04
          speakers: [eldest_brother, second_brother]
          ensemble: duo
          text: 那才叫会骑马！整个世界也找不出比他更威风的骑士。
        - id: ch05-b05
          speaker: boots
          text: 我真想看看他。要是能亲眼看见就好了。
        - id: ch05-b06
          speakers: [eldest_brother, second_brother]
          ensemble: duo
          text: 他的铠甲，可比你成天拨来挖去的火红煤块亮多了。你这个又脏又讨厌的东西！
    - id: ch06
      title: 三只金苹果
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: 第二天，所有王子和骑士都要从国王和公主面前走过。大概头一晚实在太迟，来不及这样做，只好等到这时再找拿到苹果的人。队伍里先是王子，后是骑士。他们一个接一个走上前去，可从头到尾，仍旧没有人能拿出第三只金苹果。
        - id: ch06-b02
          speaker: king
          text: 苹果一定在某个人手里。我们全都亲眼看见，有个人骑上山，把它带走了。
        - id: ch06-b03
          speaker: narrator
          text: 国王于是下令，凡是在这个王国里的人，都必须来到王宫，看看到底谁能拿出苹果。众人一个接一个赶来，却谁也没有金苹果。过了很久，小靴子的两个哥哥最后才到。国王见他们排在所有人后面，便问他们，国内是不是还有什么人没有来。
        - id: ch06-b04
          speakers: [eldest_brother, second_brother]
          ensemble: duo
          text: 有，我们还有个弟弟。不过苹果绝不会在他手上。这三天，他一步也没离开过灰坑。
        - id: ch06-b05
          speaker: king
          text: 那也没关系。让他和别人一样到王宫来。
        - id: ch06-b06
          speaker: narrator
          text: 国王既然下了命令，小靴子只好离开一直待着的灰坑，跟着人来到王宫，站到国王和公主面前。
        - id: ch06-b07
          speaker: king
          text: 金苹果在你手里吗？快说！
        - id: ch06-b08
          speaker: boots
          text: 是的，金苹果都在我这里。看，第一只在这里，第二只也在这里，第三只同样在这里。
        - id: ch06-b09
          speaker: narrator
          text: 小靴子从口袋里取出三只金苹果，一只接一只摆在众人眼前。同时，他脱掉那身沾满煤灰的破衣裳。闪闪发亮的金甲露了出来，他就这样站在国王、公主和所有人面前。
        - id: ch06-b10
          speaker: king
          text: 好！我把女儿嫁给你，再给你半个王国。公主和王国，你全都配得上。
        - id: ch06-b11
          speaker: narrator
          text: 众人立刻开始筹备婚礼。小靴子娶了公主，婚宴上自然是一片欢腾，你尽可以想象那场面有多么热闹。宾客们虽然谁也骑不上玻璃山，快活起来倒是谁也不输。我要说的只有一句。要是他们到今天还没有停止宴饮，那他们准还在那里继续热闹着呢。
