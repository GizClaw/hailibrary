  chapters:
    - id: ch01
      title: The Meadow on St. John's Night
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            Once there was a man with a meadow high on a hillside. A barn stood there to hold his hay, though it had held very little for the past two years. Each St. John's night, when the grass was deepest and greenest, something ate it right down to the ground. By morning, the meadow looked as though a whole flock of sheep had grazed there all night.
        - id: ch01-b02
          speaker: narrator
          text: >-
            After losing the hay twice, the man had had enough. He had three sons, and the youngest was called Boots. Their father told them that one son must sleep in the barn on the next St. John's night and keep a sharp watch. He would not lose every root and blade again.
        - id: ch01-b03
          speaker: eldest_brother
          text: >-
            I'll watch it. No man, beast, or fiend will take a blade of our grass if I can help it.
        - id: ch01-b04
          speaker: narrator
          text: >-
            That evening, the eldest son went to the barn and lay down. Later in the night, a terrible clatter began. The earth shook, and the walls and roof groaned and creaked. The young man sprang up and ran. He never looked back until he reached home. By morning, the hay was gone again.
        - id: ch01-b05
          speaker: narrator
          text: >-
            When St. John's night came the following year, the father said they could not keep losing the meadow this way. This time the second son went to watch. He lay down in the barn just as his brother had, but as the night wore on, the ground began to rumble and quake even more fiercely than before. Fear took hold of him, and he raced home as fast as he could.
        - id: ch01-b06
          speaker: narrator
          text: >-
            The next year, it was Boots's turn. As he prepared to leave, his brothers laughed at him.
        - id: ch01-b07
          speakers: [eldest_brother, second_brother]
          ensemble: duo
          text: >-
            You're the perfect one to guard the hay! You've done nothing all your life but sit in the ashes and warm yourself by the fire.
        - id: ch01-b08
          speaker: narrator
          text: >-
            Boots paid no attention to their chatter. At evening he trudged up the hillside, entered the barn, and lay down. About an hour later, the whole barn began to groan and creak. It was dreadful to hear.
        - id: ch01-b09
          speaker: boots
          text: If this is as bad as it gets, I can bear it well enough.
        - id: ch01-b10
          speaker: narrator
          text: >-
            Soon there came another crash and another earthquake. The straw flew around Boots's ears.
        - id: ch01-b11
          speaker: boots
          text: If it gets no worse than this, I believe I can hold out.
        - id: ch01-b12
          speaker: narrator
          text: >-
            Then came a third rumble and a third earthquake. Boots thought the walls and roof would fall on his head. But the shaking passed, and everything around him grew still as death.
        - id: ch01-b13
          speaker: boots
          text: I expect it'll come again.
        - id: ch01-b14
          speaker: narrator
          text: >-
            It did not. After Boots had waited a while, he heard what sounded like a horse outside the barn door, cropping the grass. He crept to the door and peered through a crack. There stood the biggest, fattest, finest horse he had ever seen. Beside it lay a saddle, a bridle, and a full suit of brass armor, all gleaming in the light.
        - id: ch01-b15
          speaker: boots
          text: >-
            Ah, so you're the one eating our hay. I'll put a stop to that.
        - id: ch01-b16
          speaker: narrator
          text: >-
            Boots pulled the steel from his tinderbox and threw it over the horse. At once, the animal lost the power to move and became so tame that Boots could handle it as he pleased. He mounted and rode to a hiding place no one knew. He left the horse there and went home.
        - id: ch01-b17
          speaker: narrator
          text: His brothers laughed and asked how his night had gone.
        - id: ch01-b18
          speaker: eldest_brother
          text: >-
            You can't have stayed in the barn long, even if you were brave enough to reach the field.
        - id: ch01-b19
          speaker: boots
          text: >-
            I stayed there until sunrise and saw and heard nothing. I can't imagine what frightened you both so badly.
        - id: ch01-b20
          speaker: second_brother
          text: That's a fine tale. We'll see how well you guarded the meadow.
        - id: ch01-b21
          speaker: narrator
          text: >-
            The brothers hurried up the hill. The grass stood as deep and thick as it had the night before.
    - id: ch02
      title: The Silver and Golden Horses
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            On the next St. John's eve, neither elder brother dared watch the meadow, but Boots went again. Three times the barn clattered and the ground shook, and each shock was worse than the last. Then the night became still as death. Boots heard something chewing outside and looked through the crack in the door.
        - id: ch02-b02
          speaker: narrator
          text: >-
            A second horse stood close against the wall, chewing the grass with all its might. It was finer and fatter than the first. It wore a silver saddle and bridle, and beside it lay a splendid suit of silver armor.
        - id: ch02-b03
          speaker: boots
          text: So you're gobbling up our hay. I'll soon stop you.
        - id: ch02-b04
          speaker: narrator
          text: >-
            Again Boots threw his tinderbox steel over the horse. It stood as meek and still as a lamb. He rode it to the secret place where he kept the brass horse, then returned home.
        - id: ch02-b05
          speaker: eldest_brother
          text: I suppose you'll claim there's another fine crop in the meadow.
        - id: ch02-b06
          speaker: boots
          text: There certainly is.
        - id: ch02-b07
          speaker: narrator
          text: >-
            His brothers ran to look. The grass was thick and deep, just as it had been the year before, though they gave Boots no kinder words for it.
        - id: ch02-b08
          speaker: narrator
          text: >-
            When the third St. John's eve arrived, the elder brothers were still too frightened to enter the barn. Boots went without fear. Once more, three earthquakes struck, each harder than the one before. The last tossed him from one barn wall to the other. Then everything fell silent.
        - id: ch02-b09
          speaker: narrator
          text: >-
            After a while, Boots heard something tugging at the grass. Through the door crack, he saw a third horse, far bigger and fatter than either of the others.
        - id: ch02-b10
          speaker: boots
          text: >-
            So you're the one who comes to eat our hay. I'll put a stop to it now.
        - id: ch02-b11
          speaker: narrator
          text: >-
            He threw the steel over the horse's neck. In an instant it stood as if nailed to the ground, ready to do whatever Boots wished. He rode it to the hiding place with the other two, then went home.
        - id: ch02-b12
          speaker: narrator
          text: >-
            His brothers mocked him as before. They said he looked as though he were walking in his sleep, and they added many other spiteful things. Boots ignored them and only told them to see the meadow for themselves. When they did, the grass stood as fine and deep as it had the two years before.
    - id: ch03
      title: The Challenge of the Glass Hill
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            The king of that country had a daughter, and he would give her only to a man who could ride over the glass hill beside the palace. It was a very high hill, smooth and slippery as ice. The Princess would sit at the very top with three golden apples in her lap. Whoever rode up and took all three would marry her and receive half the kingdom.
        - id: ch03-b02
          speaker: narrator
          text: >-
            The king posted the challenge on every church door in his realm and announced it in many other kingdoms. The Princess was so lovely that everyone who saw her fell deeply in love. Princes and knights came from every part of the world on prancing horses, dressed in their finest clothes. Each was certain that he alone would win her.
        - id: ch03-b03
          speaker: narrator
          text: >-
            On the appointed day, so many princes and knights gathered beneath the hill that the sight made one's head whirl. Everyone in the country who could manage the journey came to see who would win the Princess.
        - id: ch03-b04
          speaker: narrator
          text: >-
            Boots's two older brothers joined the crowd, but they refused to take him. They said that people would laugh if they were seen with a dirty fellow covered in soot from cleaning their shoes and sifting ashes.
        - id: ch03-b05
          speaker: boots
          text: >-
            Very well. It makes no difference to me. I can go alone and answer for myself.
        - id: ch03-b06
          speaker: narrator
          text: >-
            At the glass hill, the princes and knights drove their horses until the animals foamed with sweat. It did no good. The moment a hoof touched the hill, it slipped. No rider climbed more than a yard or two. The slope was as smooth as a sheet of glass and as steep as a house wall.
        - id: ch03-b07
          speaker: narrator
          text: >-
            Still they rode and slipped, then tried and slipped again, because each wanted the Princess and half the kingdom. At last their horses could hardly lift a leg, and the riders had to stop.
        - id: ch03-b08
          speaker: narrator
          text: >-
            The king was about to announce another trial for the next day when a new knight appeared. He rode a magnificent horse and wore armor of brass. His horse's saddle and bit were brass too, and they shone in the sun. No one there had ever seen such a steed.
        - id: ch03-b09
          speakers: [prince_1, prince_2, prince_3]
          ensemble: chorus
          text: >-
            Save yourself the trouble! No one can ride up that hill!
        - id: ch03-b10
          speaker: narrator
          text: >-
            The knight ignored them. He urged his horse onto the glass and rode up as though it were nothing. When he had climbed one third of the hill, he turned and came down again.
        - id: ch03-b11
          speaker: narrator
          text: >-
            The Princess thought she had never seen so lovely a knight. As he climbed, she wished with all her heart that he might reach the top and ride down the other side.
        - id: ch03-b12
          speaker: princess
          text: If only he would come all the way up and pass over the hill.
        - id: ch03-b13
          speaker: narrator
          text: >-
            When he turned back, she threw one golden apple after him. It rolled down and dropped into his shoe. At the foot of the hill, the knight galloped away so quickly that no one knew where he had gone.
        - id: ch03-b14
          speaker: narrator
          text: >-
            That evening, every knight and prince passed before the king. The rider who had climbed the hill was to show the apple the Princess had thrown. One man followed another, but none had an apple.
    - id: ch04
      title: The Knight in Brass
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            That evening, Boots's brothers came home with a long tale about the trial.
        - id: ch04-b02
          speaker: eldest_brother
          text: >-
            At first, not one rider could climb even a single stride. Then a knight came in brass armor, with a shining brass saddle and bridle. The sun flashed from them a mile away.
        - id: ch04-b03
          speaker: second_brother
          text: >-
            Now there was a man who could ride! He went a third of the way up. He could have reached the top if he'd wanted, but perhaps he thought that was enough for one day.
        - id: ch04-b04
          speaker: narrator
          text: Boots sat in his usual place by the fire, with his feet among the cinders.
        - id: ch04-b05
          speaker: boots
          text: Oh, I wish I could have seen him.
        - id: ch04-b06
          speaker: eldest_brother
          text: >-
            You do, do you? Just look at you in those ashes. You're fit company for a grand lord, aren't you?
        - id: ch04-b07
          speaker: narrator
          text: >-
            The next day, the brothers prepared to return. Boots asked to go with them this time, but they would not have him at any price. They called him too ugly and filthy.
        - id: ch04-b08
          speaker: boots
          text: >-
            All right. If I go, I'll go alone. I'm not afraid of that.
        - id: ch04-b09
          speaker: narrator
          text: >-
            At the hill, the princes and knights tried again. They had sharpened their horses' shoes, but nothing had changed. They rode and slipped until their horses were too worn out to move. Not one climbed even a yard.
        - id: ch04-b10
          speaker: narrator
          text: >-
            The king considered making the next day their final chance. Then he decided to wait a little longer in case the brass knight returned. The brass knight never appeared. Instead, another rider came on a horse even finer than the first. This knight wore silver armor, and his horse had a silver saddle and bridle. Sunlight flashed from them far across the land.
        - id: ch04-b11
          speakers: [prince_1, prince_2, prince_3]
          ensemble: chorus
          text: >-
            Stop there! Don't waste your strength. You'll never make it up!
        - id: ch04-b12
          speaker: narrator
          text: >-
            The silver knight paid them no attention. He rode straight onto the hill and climbed two thirds of the way. Then he wheeled his horse around and came down.
        - id: ch04-b13
          speaker: narrator
          text: >-
            The Princess liked him even better than the knight in brass. She wished he would reach the very top and pass down the far side.
        - id: ch04-b14
          speaker: princess
          text: Oh, if only he could come all the way up.
        - id: ch04-b15
          speaker: narrator
          text: >-
            But when he turned, she threw her second golden apple after him. It rolled into his shoe. As soon as he reached the ground, he vanished at such speed that no one saw where he went.
        - id: ch04-b16
          speaker: narrator
          text: >-
            That evening, the riders filed before the king and Princess once more. No one could produce the second apple.
    - id: ch05
      title: The Knight in Silver
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: >-
            When Boots's brothers returned home, they described every failed attempt and the splendid rider who had come last.
        - id: ch05-b02
          speaker: second_brother
          text: >-
            At the end, a knight arrived in silver armor. His horse wore a silver saddle and bridle. He was a marvelous rider. He climbed two thirds of the hill before he turned back.
        - id: ch05-b03
          speaker: eldest_brother
          text: >-
            He was a fine fellow, and the Princess threw him her second golden apple.
        - id: ch05-b04
          speaker: boots
          text: Oh, I wish I could have seen him too.
        - id: ch05-b05
          speaker: second_brother
          text: >-
            That's a good one. Perhaps you think his silver armor shone like those ashes you're always poking through, you filthy creature.
        - id: ch05-b06
          speaker: narrator
          text: >-
            On the third day, Boots again asked to join them, and again his brothers refused. At the hill, every prince and knight failed to climb even a yard. The crowd waited for the silver knight, but there was no sign of him.
        - id: ch05-b07
          speaker: narrator
          text: >-
            At last, a rider came on a horse so magnificent that no one had ever seen its equal. The knight wore golden armor, and his saddle and bridle were gold as well. They shone so brightly that the sunlight gleamed from them a mile away.
        - id: ch05-b08
          speaker: narrator
          text: >-
            The princes and knights were too amazed by his splendor even to warn him away. The golden knight charged straight at the hill. He swept up the glass as if it were level ground, so quickly that the Princess had no time even to wish that he might reach her.
        - id: ch05-b09
          speaker: narrator
          text: >-
            The moment he gained the top, he took the third golden apple from the Princess's lap. Then he turned his horse and rode down again. At the bottom, he galloped away at full speed and disappeared from sight.
        - id: ch05-b10
          speaker: narrator
          text: >-
            By the time the trial ended, it was too late for all the riders to pass before the king. Boots's brothers came home full of stories about the day's events, and most of all about the knight in gold.
        - id: ch05-b11
          speaker: eldest_brother
          text: >-
            Now that was a man who could ride! You won't find a grander knight anywhere in the world.
        - id: ch05-b12
          speaker: boots
          text: Oh, I wish I could have seen him.
        - id: ch05-b13
          speaker: second_brother
          text: >-
            His armor shone far brighter than the coals you're always digging through, you dirty creature.
    - id: ch06
      title: The Three Golden Apples
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: >-
            The next day, all the princes and knights were summoned before the king and the Princess. The man who had taken the third apple was to bring it forward. First came the princes, then the knights, one after another. Not one of them could show the golden apple.
        - id: ch06-b02
          speaker: king
          text: >-
            Someone must have it. We all saw a man ride to the top and carry it away.
        - id: ch06-b03
          speaker: narrator
          text: >-
            So the king ordered every man in the kingdom to come to the palace and show whether he had the apple. They arrived one by one, and still the apple did not appear. At last, Boots's two brothers came. They were the final men in the kingdom to present themselves.
        - id: ch06-b04
          speaker: king
          text: Is there anyone else in the kingdom who hasn't come before me?
        - id: ch06-b05
          speaker: eldest_brother
          text: >-
            Yes, we have one brother. But he never took the apple. He hasn't left the ash pit on any of the three days.
        - id: ch06-b06
          speaker: king
          text: That makes no difference. He must come to the palace like everyone else.
        - id: ch06-b07
          speaker: narrator
          text: So Boots was brought before the king.
        - id: ch06-b08
          speaker: king
          text: Well, then. Do you have the golden apple? Tell me plainly.
        - id: ch06-b09
          speaker: boots
          text: >-
            Yes, I do. Here is the first. Here is the second. And here is the third.
        - id: ch06-b10
          speaker: narrator
          text: >-
            Boots drew all three golden apples from his pocket. At the same moment, he cast off his soot-stained rags and stood before them in his gleaming golden armor.
        - id: ch06-b11
          speaker: king
          text: >-
            Yes! You shall marry my daughter and have half my kingdom. You have fairly earned them both.
          emotion: happy
    - id: ch07
      title: The Wedding Feast
      blocks:
        - id: ch07-b01
          speaker: narrator
          text: >-
            The wedding preparations began, and Boots took the Princess as his wife. There was great merrymaking at the bridal feast. After all, though the guests could not ride up the glass hill, they certainly knew how to celebrate.
        - id: ch07-b02
          speaker: narrator
          text: >-
            And if they have not stopped their merrymaking by now, then they are still at it.
