  chapters:
    - id: ch01
      title: The Dun Bull
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Once upon a time, a widowed King had one daughter. She was kind, clever, and so lovely that no princess in the world could match her. For a long while the King mourned the Queen he had loved. At last he grew tired of living alone and married another widowed queen, who also had one daughter. This girl was as bad and ugly as the Princess was good and lovely.
        - id: ch01-b02
          speaker: narrator
          text: The new Queen and her daughter could not bear the Princess's beauty and goodness. They watched her with jealous eyes. But while the King was home, they did not dare hurt her, because he loved her dearly. Then war broke out with another king, and he rode away to battle at the head of his army.
        - id: ch01-b03
          speaker: narrator
          text: As soon as he was gone, the Queen believed she could do whatever she pleased. She starved and beat the Princess and hunted her through every corner of the house. Nothing seemed too cruel. Soon she decided even the poorest thing indoors was too good for the girl, and sent her out to herd the cattle day after day in the woods and on the bare hills.
        - id: ch01-b04
          speaker: narrator
          text: The Princess was given little or nothing to eat. She grew thin and pale and spent her days weeping. Among the cattle was a great dun-colored bull. He always kept his coat sleek, and he often came close enough for her to stroke him. One day he found her sobbing and asked why she was so unhappy. She only wept harder.
        - id: ch01-b05
          speaker: dun_bull
          text: You don't have to tell me. I know the Queen treats you cruelly and means to starve you. But you needn't worry about food. There is a cloth inside my left ear. Spread it out, and you may have as many dishes as you wish.
        - id: ch01-b06
          speaker: narrator
          text: The Princess took out the cloth and laid it on the grass. At once it served the finest food anyone could want, along with wine, mead, and sweet cake. Before long she was plump and rosy again. The Queen and her scrawny daughter turned blue and yellow with spite.
        - id: ch01-b07
          speaker: narrator
          text: The Queen could not understand how the girl looked so well on such poor rations. Thinking a servant must be feeding her, she sent a maid to follow her into the woods. The maid watched the Princess take the cloth from the Bull's ear, spread it out, and feast on all the good things it produced. Then she went home and told the Queen everything.
        - id: ch01-b08
          speaker: narrator
          text: Just then the King returned victorious from the war. Joy filled the palace, and no one rejoiced more than his daughter. The Queen pretended to be ill instead. She paid the doctor well to declare that only the flesh of the Dun Bull could cure her.
        - id: ch01-b09
          speaker: narrator
          text: The Princess and everyone in the palace begged the doctor to name some other cure. They were all fond of the Bull and said there was no other like him in the land. But the doctor insisted. The Bull had to be killed.
        - id: ch01-b10
          speaker: narrator
          text: The Princess went sorrowfully down to the cowshed. The Bull stood with his head hanging low, and she began to weep over him.
        - id: ch01-b11
          speaker: dun_bull
          text: Why are you crying?
        - id: ch01-b12
          speaker: katie
          text: My father has come home, but the Queen is pretending to be sick. She paid the doctor to say that nothing can cure her except your flesh. Now they mean to slaughter you.
          emotion: sad
        - id: ch01-b13
          speaker: dun_bull
          text: If they kill me first, they will soon kill you too. If you agree, we must leave together tonight.
        - id: ch01-b14
          speaker: narrator
          text: The Princess hated the thought of leaving her father, but staying with the Queen seemed worse. She promised to come. That night, after everyone was asleep, she slipped down to the Bull. He carried her away on his back as fast as he could run.
        - id: ch01-b15
          speaker: narrator
          text: At cockcrow, the people came to slaughter the Bull and found him gone. When the King rose, his daughter was missing too. He sent messengers in every direction and had their disappearance announced in every parish church, but no one had seen them.
    - id: ch02
      title: The Three Enchanted Woods
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: Meanwhile, the Bull carried the Princess through many lands. One day they reached a great copper wood. Its trees and branches, its leaves and flowers, and everything within it were made of copper.
        - id: ch02-b02
          speaker: dun_bull
          text: When we enter this wood, be careful not to touch even one leaf. A three-headed Troll owns this place, and if you touch anything, both our lives will be in danger.
        - id: ch02-b03
          speaker: katie
          text: I'll be very careful. I won't touch a thing.
        - id: ch02-b04
          speaker: narrator
          text: She leaned from side to side to avoid the boughs and gently pushed them away with her hands. But the wood was so thick that it was almost impossible to pass through. For all her care, she tore off one copper leaf and found it in her hand.
        - id: ch02-b05
          speaker: dun_bull
          text: Oh, what have you done? Now I must fight for both our lives. Whatever happens, keep that leaf safe.
        - id: ch02-b06
          speaker: narrator
          text: At the edge of the wood, a Troll with three heads came running toward them.
        - id: ch02-b07
          speaker: three_headed_troll
          text: Who has dared to touch my wood?
          emotion: angry
        - id: ch02-b08
          speaker: dun_bull
          text: This wood belongs as much to me as it does to you.
        - id: ch02-b09
          speaker: three_headed_troll
          text: Then we'll fight and settle whose it is!
          emotion: angry
        - id: ch02-b10
          speaker: dun_bull
          text: Have it your way.
        - id: ch02-b11
          speaker: narrator
          text: They charged each other and fought for their lives. The Bull butted with his head, drove with his horns, and kicked with all his strength. The Troll answered every blow with one of his own. Neither would give way. The struggle lasted the whole day before the Bull finally mastered him. By then the Bull was covered in wounds, utterly worn out, and so weak that he could barely lift one leg.
        - id: ch02-b12
          speaker: narrator
          text: They rested there for a day. The Bull told the Princess to take the horn of ointment from the Troll's belt and rub it over him. She did, and his strength returned. The next day they went on.
        - id: ch02-b13
          speaker: narrator
          text: Then they traveled on for many, many days. After a long, long time they came to a silver wood. Every tree and branch, every leaf and flower, and everything the Princess could see was made of silver.
        - id: ch02-b14
          speaker: dun_bull
          text: For heaven's sake, take great care here. Don't touch anything, not even a single leaf. A six-headed Troll owns this wood, and I don't think I can defeat him.
        - id: ch02-b15
          speaker: katie
          text: I promise I'll watch closely and touch nothing you want me to avoid.
        - id: ch02-b16
          speaker: narrator
          text: The silver wood was close and dense, and they could scarcely force a way through it. The Princess was as careful as anyone could be. She leaned first to one side and then the other, trying to miss each bough, and used her hands to ease the branches aside. Still they struck her across the eyes at every turn. For all her care, one caught against her, and she tore off a silver leaf.
        - id: ch02-b17
          speaker: dun_bull
          text: Oh, what have you done now? I must fight for our lives again. This Troll has six heads and twice the strength of the first. Keep that leaf safe and don't lose it.
        - id: ch02-b18
          speaker: narrator
          text: At that moment the six-headed Troll appeared.
        - id: ch02-b19
          speaker: six_headed_troll
          text: Who is touching my wood?
          emotion: angry
        - id: ch02-b20
          speaker: dun_bull
          text: It is mine as much as yours.
        - id: ch02-b21
          speaker: six_headed_troll
          text: We'll fight over that!
          emotion: angry
        - id: ch02-b22
          speaker: dun_bull
          text: As you please.
        - id: ch02-b23
          speaker: narrator
          text: The Bull rushed straight at him. He gored out the Troll's eyes and drove his horns right through the great body until its entrails burst out. Yet the Troll was almost a match for him and kept fighting. For three whole days they battled before the Bull finally gored the life out of him.
        - id: ch02-b24
          speaker: narrator
          text: The Bull was left weak and wretched, with blood streaming from all his wounds. He could hardly move one limb. At his bidding, the Princess took the ointment horn hanging from the Troll's belt and rubbed him all over with it. His life and strength began to return, but even the ointment could not make him ready at once. They stayed there for a full week before he was strong enough to travel.
        - id: ch02-b25
          speaker: narrator
          text: When they set out, the Bull was still unwell and moved slowly. The Princess offered to walk because she was young and light-footed, but he would not allow it. She had to ride on his back.
        - id: ch02-b26
          speaker: narrator
          text: After a long journey through many lands, they reached a wood of pure gold. Gold dropped from every twig, and every tree, bough, flower, and leaf shone golden.
        - id: ch02-b27
          speaker: narrator
          text: Once again the Bull warned her not to touch anything. A nine-headed Troll owned this wood, and he was larger and stronger than the first two together. The Bull feared he could not beat him. The Princess promised to take care.
        - id: ch02-b28
          speaker: narrator
          text: This wood was thicker than the silver one, and it closed in more tightly with every step. Deeper and deeper they went, until the Princess thought there could be no path through at all. Terrified that she might break something, she bent and twisted this way and that. She pushed the boughs aside with her hands, but they struck her across the eyes until she could not see what she was grasping. Before she knew how it had happened, a golden apple lay in her hand.
        - id: ch02-b29
          speaker: narrator
          text: She burst into tears and tried to throw it away, but the Bull comforted her as well as he could and told her to guard it. He knew a terrible struggle lay ahead and doubted how it would end.
        - id: ch02-b30
          speaker: narrator
          text: Then the nine-headed Troll appeared. He was so hideous that the Princess hardly dared look at him.
        - id: ch02-b31
          speaker: nine_headed_troll
          text: Who is touching my wood?
          emotion: angry
        - id: ch02-b32
          speaker: dun_bull
          text: It belongs to me as much as it belongs to you.
        - id: ch02-b33
          speaker: nine_headed_troll
          text: We'll fight and see about that!
          emotion: angry
        - id: ch02-b34
          speaker: dun_bull
          text: Just as you choose.
        - id: ch02-b35
          speaker: narrator
          text: They rushed together, and the battle was so dreadful that the Princess nearly fainted at the sight. The Bull gored out the Troll's eyes and drove his horns again and again through the huge body until its entrails tumbled out. The Troll fought with all his might. Whenever the Bull managed to gore one head to death, the other heads bent over it and breathed life into it again.
        - id: ch02-b36
          speaker: narrator
          text: So the battle went on through one day and the next. It lasted an entire week before the Bull at last destroyed every head and no breath could revive them. Then he lay utterly spent and wretched. He could not move a foot, and his whole body was one great wound. He was too weak even to ask for the ointment, but the Princess remembered. She took the horn from the Troll's belt and rubbed him with it anyway.
        - id: ch02-b37
          speaker: narrator
          text: Little by little, the Bull came back to himself. They rested there for three weeks before he was able to go on.
    - id: ch03
      title: Katie Woodencloak
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: They moved on at a snail's pace, for the Bull was still weak and said they had a little farther to go. The Princess stayed on his back as he carried her over one high hill after another and through more thick woods. After a long while they left the trees behind and climbed onto the open fells.
        - id: ch03-b02
          speaker: dun_bull
          text: Can you see anything?
        - id: ch03-b03
          speaker: katie
          text: Nothing but the sky and the wild hillside.
        - id: ch03-b04
          speaker: narrator
          text: They climbed higher, where the ground grew smoother and the view opened before them.
        - id: ch03-b05
          speaker: dun_bull
          text: What can you see now?
        - id: ch03-b06
          speaker: katie
          text: There's a little castle very far away.
        - id: ch03-b07
          speaker: dun_bull
          text: It isn't as little as it looks.
        - id: ch03-b08
          speaker: narrator
          text: They kept moving toward the distant castle for a long, long time. At last they reached a great heap of stones. Beyond it, a spur of the hillside rose like a sheer wall of rock across their way.
        - id: ch03-b09
          speaker: dun_bull
          text: And what do you see now?
        - id: ch03-b10
          speaker: katie
          text: The castle is close now, and it's much, much bigger.
        - id: ch03-b11
          speaker: dun_bull
          text: That is where you must go. Beneath the castle you'll find a pigsty and a cloak made from strips of wood. Put it on, go to the castle, call yourself Katie Woodencloak, and ask for work.
        - id: ch03-b12
          speaker: dun_bull
          text: Before you leave me, take your penknife and cut off my head. Skin me, roll up my hide, and place it beneath that rock wall. Put the copper leaf, the silver leaf, and the golden apple under the hide. A stick stands beside the rock. Whenever you need something, strike the wall with it.
        - id: ch03-b13
          speaker: narrator
          text: At first the Princess would not hear of doing such a thing. She could not raise a knife against the faithful creature who had fed her, saved her, and carried her so far. But the Bull said this was the only thanks he wanted for all he had done, and at last she could not deny him. Though it broke her heart, she hacked and cut with her little knife until his head and hide came free. Then she rolled the hide and laid it under the rock wall, with the copper leaf, the silver leaf, and the golden apple safely beneath it.
        - id: ch03-b14
          speaker: narrator
          text: When everything was done, she walked toward the pigsty, sobbing and weeping the whole way. There she found the cloak made from strips of wood and put it over herself. Hidden inside it, she went up to the palace. She entered the kitchen, asked if there was any work for her, and told them her name was Katie Woodencloak.
        - id: ch03-b15
          speaker: cook
          text: You may work here in the scullery and wash the dishes. The last girl has just left. But I expect you'll leave as soon as you tire of the place.
        - id: ch03-b16
          speaker: katie
          text: No, I won't leave.
        - id: ch03-b17
          speaker: narrator
          text: Katie stayed in the scullery. She behaved well, worked hard, and washed everything they gave her with a ready hand. The following Sunday, guests from elsewhere were expected at the palace. When someone had to carry water upstairs for the Prince's bath, Katie asked for permission to do it.
        - id: ch03-b18
          speakers: [kitchen_maid_1, kitchen_maid_2]
          ensemble: duo
          text: What could you possibly do up there? Do you think the Prince wants to look at such a fright?
        - id: ch03-b19
          speaker: narrator
          text: Katie kept asking until they let her go. As she climbed the stairs, the strips of her wooden cloak clattered loudly. The Prince came out to see who it was.
        - id: ch03-b20
          speaker: prince
          text: Who are you?
        - id: ch03-b21
          speaker: katie
          text: I was bringing water for Your Royal Highness's bath.
        - id: ch03-b22
          speaker: prince
          text: Do you really think I would use water brought by you?
        - id: ch03-b23
          speaker: narrator
          text: With that, he threw the water over her.
    - id: ch04
      title: The Lady at Church
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: Katie had to endure the insult and the soaking. Even so, she asked permission to attend church, which stood close to the palace, and they allowed her to go. Before she went there, she returned to the rock. The stick was still standing where the Bull had shown her. Katie took it and struck the face of the rock, and a man appeared at once.
        - id: ch04-b02
          speaker: man_at_rock
          text: What do you wish for?
        - id: ch04-b03
          speaker: katie
          text: I have permission to hear the priest preach, but I have no clothes fit for church.
        - id: ch04-b04
          speaker: narrator
          text: The man brought her a dress as bright as the copper wood, along with a horse and saddle. Katie put on the shining clothes and rode to church. She looked so lovely and grand that everyone wondered who the unknown lady could be. Once the service began, hardly anyone listened to the priest. Their eyes kept turning toward her instead. The Prince fell deeply in love and did not look away from her for a single moment.
        - id: ch04-b05
          speaker: narrator
          text: When the service ended and Katie walked out, the Prince ran after her and held the church door open. One of her gloves caught in the door, and he took hold of it. Katie kept going and mounted her horse. The Prince hurried up once more, carrying the glove, and asked what country she came from.
        - id: ch04-b06
          speaker: katie
          text: I come from Bath.
        - id: ch04-b07
          speaker: narrator
          text: The Prince drew out her glove to return it, but Katie spoke before he could hand it over.
        - id: ch04-b08
          speaker: katie
          text: Bright before and dark behind, clouds come rolling on the wind. Let this Prince never see where my good steed carries me.
        - id: ch04-b09
          speaker: narrator
          text: The clouds rolled in, and she rode away without her glove. The Prince could not see where her horse had gone. He had never seen anything like that glove, and he longed to find its owner. He traveled and asked questions far and wide, searching for the land the proud lady had named. But no one he met could tell him where Bath lay.
        - id: ch04-b10
          speaker: narrator
          text: The next Sunday, someone had to carry a towel to the Prince. Katie asked to take it.
        - id: ch04-b11
          speaker: katie
          text: Please, may I carry the towel upstairs?
        - id: ch04-b12
          speakers: [kitchen_maid_1, kitchen_maid_2]
          ensemble: duo
          text: Why should you go? You remember what happened last time.
        - id: ch04-b13
          speaker: narrator
          text: Katie would not give up. She asked and pleaded until at last they agreed. Then she ran up the stairs, and her wooden cloak made a great clatter with every step. The noise brought the Prince out. As soon as he saw that it was Katie, he snatched the towel from her hands and flung it back into her face.
        - id: ch04-b14
          speaker: prince
          text: Get out, you ugly Troll! Do you think I'd use a towel touched by your filthy fingers?
          emotion: disgusted
        - id: ch04-b15
          speaker: narrator
          text: The Prince left for church. Katie asked to go too.
        - id: ch04-b16
          speakers: [kitchen_maid_1, kitchen_maid_2]
          ensemble: duo
          text: What business do you have at church? That black, ugly wooden cloak is all you own.
        - id: ch04-b17
          speaker: katie
          text: The priest preaches so bravely, and his words do me so much good.
        - id: ch04-b18
          speaker: narrator
          text: Again Katie would not be discouraged. She kept asking and pleading until they finally let her go. She hurried to the rock, struck it with the stick, and told the man what she needed. This time he gave her a dress far finer than the first. Silver covered it, and it shone just like the silver wood. He also brought a noble horse with a silver bit and a saddlecloth embroidered all over in silver.
        - id: ch04-b19
          speaker: narrator
          text: The people were still gathered in the churchyard when she arrived. Everyone wondered who she could be. The Prince hurried forward and offered to hold her horse while she dismounted.
        - id: ch04-b20
          speaker: katie
          text: There's no need. My horse is so well trained that he stands when I tell him and comes when I call.
        - id: ch04-b21
          speaker: narrator
          text: Katie jumped lightly down without his help, and the horse stood exactly as she had said. Then everyone went inside. The priest began his sermon, but there was scarcely a soul in the church who truly listened. They spent far too much time looking at Katie, and the Prince fell even more deeply in love than he had the first Sunday.
        - id: ch04-b22
          speaker: narrator
          text: When the service ended, the Prince approached as she was about to mount and asked where she came from.
        - id: ch04-b23
          speaker: katie
          text: I come from Towelland.
        - id: ch04-b24
          speaker: narrator
          text: Katie dropped her riding whip. As the Prince bent to pick it up, she spoke her charm.
        - id: ch04-b25
          speaker: katie
          text: Bright before and dark behind, clouds come rolling on the wind. Let this Prince never see where my good steed carries me.
        - id: ch04-b26
          speaker: narrator
          text: At once Katie and her horse were gone from his sight. The Prince could not tell where she had gone or which road she had taken. Once again he traveled far and wide, this time asking everyone about a country called Towelland. No one had ever heard of it or could show him where it lay. At last the Prince had to make the best of losing her again.
        - id: ch04-b27
          speaker: narrator
          text: On the third Sunday, someone needed to bring the Prince a comb. Katie asked to carry it upstairs. The others reminded her how badly the last visit had gone and scolded her for wanting to stand before him again. In their eyes she was still a black and ugly fright inside that clattering wooden cloak. Katie would not stop asking, though, and at last they let her take the comb.
        - id: ch04-b28
          speaker: narrator
          text: Once again the wooden strips clattered all the way up the stairs. The Prince came out at the sound. He took the comb from Katie, threw it straight back at her, and ordered her to be gone as quickly as she could. After the Prince set off for church, Katie returned to the kitchen and begged for permission to go too.
        - id: ch04-b29
          speakers: [kitchen_maid_1, kitchen_maid_2]
          ensemble: duo
          text: Why would you go there looking so dirty and black, with no proper clothes? If the Prince or anyone else sees you, all of us may suffer for it.
        - id: ch04-b30
          speaker: katie
          text: They will have better things to do than look at me.
        - id: ch04-b31
          speaker: narrator
          text: Katie kept begging and praying until they gave permission. Then she went once more to the rock and struck it with the stick. The man appeared and brought her a dress far grander than either of the others. It was made almost entirely of pure gold and studded with diamonds. He also brought a noble horse. Its bit was golden, and its saddlecloth was richly embroidered in gold.
        - id: ch04-b32
          speaker: narrator
          text: At the church, the priest and all the people stood outside waiting for her. The Prince ran up to hold her horse.
        - id: ch04-b33
          speaker: katie
          text: No, thank you. My horse is so well trained that he stands when I tell him.
        - id: ch04-b34
          speaker: narrator
          text: Everyone hurried inside, and the priest climbed into the pulpit. Yet no one listened to a word he said. They were too busy staring at the unknown lady and wondering where she came from. The Prince had fallen farther in love than on either of the other Sundays. He had no eyes, ears, or thought for anything but Katie, and could only sit and gaze at her.
        - id: ch04-b35
          speaker: narrator
          text: Before the service ended, the Prince had a small barrel of pitch poured across the church porch. He hoped the beautiful lady would need his help to cross it. Katie did not hesitate. She planted one foot right in the middle of the sticky pitch and sprang across. But when she landed, one of her golden shoes had been pulled from her foot and was stuck fast behind her.
        - id: ch04-b36
          speaker: narrator
          text: As she mounted, the Prince ran out with the shoe and asked where she came from.
        - id: ch04-b37
          speaker: katie
          text: I come from Combland.
        - id: ch04-b38
          speaker: narrator
          text: When he tried to return the golden shoe, Katie spoke once more.
        - id: ch04-b39
          speaker: katie
          text: Bright before and dark behind, clouds come rolling on the wind. Let this Prince never see where my good steed carries me.
        - id: ch04-b40
          speaker: narrator
          text: Again the clouds rolled in, and Katie vanished before he could follow. The Prince still had no idea where she had gone. He traveled wearily through the world, asking everywhere for the country named Combland, but not one person could tell him where to find it. Only the golden shoe remained to prove the mysterious lady had been there.
    - id: ch05
      title: The Golden Shoe
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: At last the Prince stopped searching for the vanished country and sent a proclamation through every town and district. He would marry the woman whose foot fitted the golden shoe. Women came from every side and of every kind. Some were fair, some ugly, and each was eager to try. Yet foot after foot proved too large. Not one woman could put the tiny shoe on.
        - id: ch05-b02
          speaker: narrator
          text: The search went on for a long, long time. At last Katie's wicked stepmother arrived at the palace with her daughter. Somehow the daughter managed to put on the golden shoe. But she was ugly and looked so unpleasant that the Prince could hardly bear the thought of marrying her. He had given his word, though, and meant to keep it even against his will.
        - id: ch05-b03
          speaker: narrator
          text: Even so, the wedding feast was prepared. The girl was dressed as a bride, and they set out for church. On the way, a little bird perched in a tree and sang.
        - id: ch05-b04
          speaker: little_bird
          text: A bit off her heel, and a bit off her toe. Katie Woodencloak's tiny shoe is full of blood, that's all I know.
        - id: ch05-b05
          speaker: narrator
          text: The wedding party stopped and looked closely at the shoe. Then they saw that the little bird had told the truth. The girl had cut away part of her heel and part of her toe to force her foot inside, and now blood was pouring from the golden shoe.
    - id: ch06
      title: The True Princess
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: Then every maid and woman in the palace was called upstairs to try the golden shoe. One after another they pushed and squeezed, but it fitted none of them at all.
        - id: ch06-b02
          speaker: prince
          text: Where is Katie Woodencloak?
        - id: ch06-b03
          speaker: narrator
          text: The Prince understood the speech of birds and remembered the little bird's song.
        - id: ch06-b04
          speakers: [kitchen_maid_1, kitchen_maid_2]
          ensemble: duo
          text: Katie try it? There's no point in bringing her here. Her legs are as thick as a horse's.
        - id: ch06-b05
          speaker: prince
          text: Perhaps they are. But everyone else has tried, so Katie may try as well.
        - id: ch06-b06
          speaker: prince
          text: Katie!
        - id: ch06-b07
          speaker: narrator
          text: Katie tramped upstairs, and her wooden cloak rattled like a whole regiment of dragoons charging toward them.
        - id: ch06-b08
          speakers: [kitchen_maid_1, kitchen_maid_2]
          ensemble: duo
          text: Go on, try the shoe. Perhaps you'll become a princess too!
        - id: ch06-b09
          speaker: narrator
          text: The maids laughed at her. Katie picked up the golden shoe and slipped her foot into it with ease. Then she cast off the wooden cloak.
        - id: ch06-b10
          speaker: narrator
          text: There she stood in her golden dress, shining so brightly that sunlight flashed from it. On her other foot was the matching golden shoe.
        - id: ch06-b11
          speaker: narrator
          text: The Prince knew her at once. This was the shining lady he had watched through three Sundays, the woman whose country he had searched for in vain. He was so happy that he ran to Katie, put his arms around her, and kissed her. Then he heard that the scullery maid was truly a King's daughter, and his joy grew greater still. The palace prepared the wedding feast again, this time for the true bride, and the Prince and Katie were married.
        - id: ch06-b12
          speaker: narrator
          text: Snip, snip, snover, this story's over.
