audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 从容而清醒，带一点克制的诙谐
        timbre: 温厚清晰
        pace: 舒缓有致
        pitch: 中低
    princess:
      display_name: 凯蒂
      tts:
        delivery: 温柔坚韧，受苦时克制，面对刁难时沉着
        timbre: 清澈柔和
        pace: 中等
        pitch: 中高
    dun_bull:
      display_name: 褐牛
      tts:
        delivery: 忠厚稳重，危急时果断有力
        timbre: 低沉浑厚
        pace: 中等偏慢
        pitch: 低
    troll_three:
      display_name: 三头巨怪
      tts:
        delivery: 粗暴蛮横，怒吼般说话
        timbre: 粗砺洪亮
        pace: 中等偏慢
        pitch: 低
    troll_six:
      display_name: 六头巨怪
      tts:
        delivery: 凶狠傲慢，声音带着逼人的威势
        timbre: 厚重沙哑
        pace: 中等偏慢
        pitch: 低
    troll_nine:
      display_name: 九头巨怪
      tts:
        delivery: 骇人暴烈，每句话都像雷鸣
        timbre: 极低沉而洪亮
        pace: 缓慢
        pitch: 低
    cook:
      display_name: 厨娘
      tts:
        delivery: 直爽利落，带一点不耐烦
        timbre: 明快结实
        pace: 中等偏快
        pitch: 中
    maid_1:
      display_name: 女仆甲
      tts:
        delivery: 尖刻爱取笑人，说话轻快
        timbre: 清亮
        pace: 中等偏快
        pitch: 中高
    maid_2:
      display_name: 女仆乙
      tts:
        delivery: 随声附和，语气轻慢
        timbre: 轻细
        pace: 中等
        pitch: 中高
    maid_3:
      display_name: 女仆丙
      tts:
        delivery: 好事多嘴，嘲弄时夸张
        timbre: 明亮偏尖
        pace: 偏快
        pitch: 高
    prince:
      display_name: 王子
      tts:
        delivery: 年轻高傲，倾心时急切热诚
        timbre: 清朗有力
        pace: 中等
        pitch: 中
    rock_man:
      display_name: 石壁中的男人
      tts:
        delivery: 恭敬简洁，沉着可靠
        timbre: 平稳温和
        pace: 中等偏慢
        pitch: 中低
    little_bird:
      display_name: 小鸟
      tts:
        delivery: 清脆明白，歌唱时带警示意味
        timbre: 轻盈清亮
        pace: 中等
        pitch: 高
  chapters:
    - id: ch01
      title: 褐牛的秘密
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 从前，一位国王失去了心爱的王后。王后给他留下一个独生女儿，既聪明又善良，模样也美丽，普天之下再找不出第二个。国王为王后悲伤了很久，后来实在厌倦了孤身生活，便娶了一位同样守寡的王后。新王后也带来一个独生女儿，可那姑娘和公主恰恰相反。公主有多善良、聪慧、美丽，她就有多恶毒、愚笨、丑陋。母女俩嫉妒公主，只因国王疼爱女儿，他在家时，她们还不敢伤害她。
        - id: ch01-b02
          speaker: narrator
          text: 后来，国王和另一位国王打起仗来，率领大军出征。继母没了顾忌，想做什么就做什么。她不但不给公主饭吃，还动手打她，在宫里的每个角落追着她欺负。到最后，她觉得什么东西给公主都太好，干脆把公主赶出去放牛。公主跟着牛群走遍树林和荒山，几乎什么也吃不到。她越来越瘦，脸色一天比一天苍白，时时都在伤心落泪。
        - id: ch01-b03
          speaker: narrator
          text: 牛群里有一头高大的褐牛，总把皮毛收拾得干干净净，也常走过来让公主抚摸。一天，公主又坐着哭，褐牛来到她面前，问她为何这样难过。公主没有回答，只顾流泪。
        - id: ch01-b04
          speaker: dun_bull
          text: 你不说，我也全知道。王后待你狠毒，眼看就要把你饿死。不过，吃的不用发愁。我的左耳朵里藏着一块布，你把它拿出来铺开，想吃多少道菜，就有多少道菜。
        - id: ch01-b05
          speaker: narrator
          text: 公主照他说的做了，取出那块布，铺在草地上。瞧，转眼之间，上面便摆出了世上最可口的菜肴，还有葡萄酒、蜂蜜酒和香甜的糕饼。公主从此不再挨饿。没过多久，她重新长起了肉，身子丰满，脸色红润，肌肤也恢复了雪白，气得王后和她那干瘦得像根柴的女儿脸上一阵青、一阵黄。
        - id: ch01-b06
          speaker: narrator
          text: 王后怎么也想不通，公主吃着那么差的饭，怎么反倒越来越好看。她认定宫里的仆人偷偷送食物，便叫一个女仆跟进树林暗中察看。女仆躲在那里，看见公主从褐牛耳朵里取出布，铺到草地上，也看见布上摆出满满的美味。公主吃得十分欢喜。女仆回宫以后，便把所见的一切都告诉了王后。
        - id: ch01-b07
          speaker: narrator
          text: 这时，国王打败了交战的那位国王，带着胜利回到宫里。整座王宫一片欢腾，公主尤其高兴。王后却装病躺下，花重金收买医生，要他说只有吃到褐牛的肉，她的病才能治好。公主和宫里众人都追问有没有别的办法，又苦苦替褐牛求情，因为大家都喜欢他，还说全国再没有这样好的牛。可医生坚持非宰不可，别的东西都治不了王后。
        - id: ch01-b08
          speaker: narrator
          text: 公主听见褐牛非死不可，伤心得不得了。她独自来到牛棚，只见褐牛也站在那里，低垂着头，满脸沮丧。他仿佛早已知道自己的命运。公主一看见他那副模样，便忍不住对着他哭了起来。
        - id: ch01-b09
          speaker: dun_bull
          text: 你为什么哭？
        - id: ch01-b10
          speaker: narrator
          text: 公主告诉他，父王已经回来，王后买通医生，硬说非吃他的肉不能痊愈，他马上就要被宰了。
        - id: ch01-b11
          speaker: dun_bull
          text: 他们先杀了我，很快也会要你的命。你若肯听我的，咱们今天夜里就离开这里。
        - id: ch01-b12
          speaker: narrator
          text: 公主自然舍不得父亲，想到要离开他，心里很不好受。可是一想到继续留在宫里，和狠毒的王后一起生活，她又更加难以忍受。最后，她答应夜里一定来找褐牛。等宫里人人都上床睡下，她悄悄溜进牛棚，骑到褐牛背上。褐牛立刻撒开四蹄，以最快的速度逃离了庄园。
        - id: ch01-b13
          speaker: narrator
          text: 第二天鸡叫时，人们起床来宰牛，走进牛棚一看，褐牛已经不见了。国王起来寻找女儿，公主也没了踪影。他派使者到四面八方搜寻，还叫人在每个教区的教堂里宣告这件事，却没有谁见过他们。此时，褐牛正驮着公主穿过一个又一个国度。一天，他们来到一片辽阔的铜树林。无论树干、枝条、叶子还是花朵，那里的一切全由铜做成。
    - id: ch02
      title: 三片奇异的树林
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 进树林以前，褐牛先叮嘱公主。
        - id: ch02-b02
          speaker: dun_bull
          text: 千万别碰这里的一片叶子。树林属于一个三头巨怪，只要碰了一点东西，你我就都完了。
        - id: ch02-b03
          speaker: narrator
          text: 公主答应得好好的，说自己一定什么也不碰。她确实万分小心，在牛背上一会儿朝这边侧身，一会儿朝那边躲闪，避开横生的枝条，又用手轻轻把挡路的树枝拨开。可树林实在太密，几乎没有路可走。任凭她怎样小心，最后还是不知怎么扯下一片铜叶，握在了手里。
        - id: ch02-b04
          speaker: dun_bull
          text: 哎呀，你这下做了什么！现在只好拼个你死我活。那片叶子可要收好。
        - id: ch02-b05
          speaker: narrator
          text: 他们刚走到树林尽头，三头巨怪便飞奔而来。
        - id: ch02-b06
          speaker: troll_three
          text: 是谁碰了我的树林？
          emotion: angry
        - id: ch02-b07
          speaker: dun_bull
          text: 这片树林是你的，也是我的。
        - id: ch02-b08
          speaker: troll_three
          text: 那就摔一跤，看看它到底归谁！
          emotion: angry
        - id: ch02-b09
          speaker: dun_bull
          text: 随你的便。
        - id: ch02-b10
          speaker: narrator
          text: 他们猛扑上去，打成一团。褐牛使出浑身力气，又顶又刺又踢，巨怪也毫不示弱，招招还击。足足打了一整天，褐牛才占了上风，可他已经遍体鳞伤，精疲力尽，连一条腿也几乎抬不起来。他们只得留在原地歇上一天。公主取下挂在巨怪腰带上的药膏角，给褐牛全身涂药。药膏一涂，褐牛才重新恢复精神。
        - id: ch02-b11
          speaker: narrator
          text: 第二天，他们重新上路。走过许多许多天，眼前出现一片银树林。这里的树木、枝叶、花朵，也全由银子做成。
        - id: ch02-b12
          speaker: dun_bull
          text: 看在老天的分上，这次千万要小心。什么也别碰，连一片叶子也不能摘。树林属于一个六头巨怪，我怕自己敌不过他。
        - id: ch02-b13
          speaker: princess
          text: 我一定当心。你不许碰的东西，我一样也不碰。
        - id: ch02-b14
          speaker: narrator
          text: 可银树林又密又挤，他们走进去以后，几乎寸步难行。公主已经小心得不能再小心。她一会儿往左侧身，一会儿往右躲闪，还用手把枝条拨到旁边，可树枝还是不停抽打她的眼睛。她费尽心思，到底还是不小心扯下了一片银叶。
        - id: ch02-b15
          speaker: dun_bull
          text: 哎呀，你又做了什么！这回只能拼命了。六头巨怪比上一个强大一倍。把叶子收好，千万别丢。
        - id: ch02-b16
          speaker: narrator
          text: 话音刚落，六头巨怪就到了。
        - id: ch02-b17
          speaker: troll_six
          text: 是谁碰了我的树林？
          emotion: angry
        - id: ch02-b18
          speaker: dun_bull
          text: 这片树林是你的，也是我的。
        - id: ch02-b19
          speaker: troll_six
          text: 那就摔一跤，看看它到底归谁！
          emotion: angry
        - id: ch02-b20
          speaker: dun_bull
          text: 随你的便。
        - id: ch02-b21
          speaker: narrator
          text: 褐牛猛冲过去，顶瞎巨怪的眼睛，又用双角一直刺穿他的身体，连肚肠也涌了出来。可六头巨怪与他几乎不相上下。双方整整打了三天三夜，褐牛才终于把巨怪顶死。褐牛自己也虚弱不堪，动一动四肢都艰难，满身伤口里鲜血直流。公主拿下挂在巨怪腰带上的药膏角，把药涂遍他的身体，他这才苏醒过来。他们又停在那里休息整整一个星期，褐牛才攒够力气继续赶路。
        - id: ch02-b22
          speaker: narrator
          text: 再次出发时，褐牛的身体仍旧不好，起初走得很慢。公主想节省时间，说自己年轻，脚步又轻，完全可以下来步行，褐牛却不答应，坚持让她坐回背上。他们就这样走过许多国度，走了很久很久，公主一点也不知道要去哪里。后来，前方出现一片壮丽的金树林。金子从每根细枝上滴落，所有树干、枝条、叶子和花朵全是纯金。
        - id: ch02-b23
          speaker: narrator
          text: 褐牛又警告公主，树林属于一个九头巨怪。那怪物比前两个合起来还要高大强壮，他恐怕无法取胜。公主保证绝不碰任何东西。可金树林比前两片更密，越往深处走越难通行。到了后来，她简直觉得没有路了。她吓得在牛背上不停扭转躲闪，用手拨开枝条，可树枝仍不断抽打她的眼睛。她看不清双手抓住了什么。回过神来时，一只金苹果已经握在了手里。
        - id: ch02-b24
          speaker: narrator
          text: 公主看见手里的金苹果，后悔得放声大哭，抬手就想把它扔掉。褐牛却叫她一定收好，又尽力说些话来安慰她。可他自己心里明白，这将是一场极其艰苦的恶战，连他也不知道最后会有什么结果。九头巨怪就在这时出现了。他的模样丑陋得如此可怕，叫公主连抬眼看他也几乎不敢。
        - id: ch02-b25
          speaker: troll_nine
          text: 是谁碰了我的树林？
          emotion: angry
        - id: ch02-b26
          speaker: dun_bull
          text: 这片树林是你的，也是我的。
        - id: ch02-b27
          speaker: troll_nine
          text: 那就摔一跤，看看它到底归谁！
          emotion: angry
        - id: ch02-b28
          speaker: dun_bull
          text: 随你的便。
        - id: ch02-b29
          speaker: narrator
          text: 他们扑向对方，打得无比惨烈，公主看着那幅景象，几乎吓得昏死过去。褐牛顶瞎巨怪的眼睛，又用双角一次次刺穿他的身子，连肚肠都滚了出来。九头巨怪却仍旧勇猛。每当褐牛顶死一个脑袋，其余的脑袋就重新给它吹入生命。双方足足打了整整一个星期，褐牛才把九个脑袋全部杀死。他自己也彻底耗尽了力气，一步也动不了，全身没有一处不是伤，连一句话都说不出来。
        - id: ch02-b30
          speaker: narrator
          text: 公主没有等他吩咐，主动从巨怪腰带上取下药膏角，替他涂遍全身。褐牛这才一点一点苏醒过来。可他的伤势实在太重，两人只好躺在原地，足足休息了三个星期，他才终于恢复到能够继续赶路。
    - id: ch03
      title: 石壁下的告别
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 他们终于离开金树林，可褐牛说前面还有一小段路。由于伤势未愈，他们走得像蜗牛一样慢。就这样，他们越过一座又一座高山，穿过一片又一片密林，过了好一阵，终于来到辽阔的荒山上。
        - id: ch03-b02
          speaker: dun_bull
          text: 你看见什么了吗？
        - id: ch03-b03
          speaker: princess
          text: 我只看见天空和荒山。
        - id: ch03-b04
          speaker: narrator
          text: 他们爬得更高，山势渐渐平缓，视野也开阔了。
        - id: ch03-b05
          speaker: dun_bull
          text: 现在看见什么了吗？
        - id: ch03-b06
          speaker: princess
          text: 看见了，远处有一座小小的城堡。
        - id: ch03-b07
          speaker: dun_bull
          text: 它可不小。
        - id: ch03-b08
          speaker: narrator
          text: 很久以后，他们来到一座巨大的石冢前，一道山脊像墙一样横在路上。
        - id: ch03-b09
          speaker: dun_bull
          text: 现在又看见什么了？
        - id: ch03-b10
          speaker: princess
          text: 城堡就在附近，而且比刚才看起来大多了。
        - id: ch03-b11
          speaker: dun_bull
          text: 你就要到那里去。城堡下面有一座猪圈，你要住在那里。那里放着一件薄木板做成的木斗篷。披上它，去城堡说自己叫木斗篷凯蒂，再求一份差事。
        - id: ch03-b12
          speaker: dun_bull
          text: 不过在走以前，你要用小刀割下我的头，再剥下我的皮。把牛皮卷好，放到那边石壁脚下，铜叶、银叶和金苹果都压在皮下面。石壁旁立着一根木棍。以后想要什么，就用它敲一敲石壁。
        - id: ch03-b13
          speaker: narrator
          text: 公主起初怎么也不肯做这样的事。褐牛却说，他为她做了这么多事，只要这个作为回报。她实在无法拒绝。尽管悲痛得心都要裂开，她还是拿起小刀，在这头高大的牛身上一下下割砍，直到割下他的头，剥下他的皮。随后，她把牛皮卷好，放在石壁脚下，又把铜叶、银叶和金苹果都藏到牛皮下面。
        - id: ch03-b14
          speaker: narrator
          text: 公主做完这一切，一路抽泣流泪，来到城堡下面的猪圈。她在那里找到那件薄木板做成的斗篷，披到身上，走进王宫的厨房。她说自己名叫木斗篷凯蒂，请求留在这里做事。先前在洗碗间干活的姑娘刚刚离开，厨娘正缺人手，便答应收下她，让她负责洗刷碗碟。
        - id: ch03-b15
          speaker: cook
          text: 不过我敢说，你哪天待腻了，也会像上一个姑娘那样走掉。
        - id: ch03-b16
          speaker: princess
          text: 不，我一定不会走。
        - id: ch03-b17
          speaker: narrator
          text: 凯蒂果然留在洗碗间，规规矩矩，碗碟洗得也十分麻利。下一个星期日，王宫里要来一些外客，人人都忙着准备。凯蒂听说要把洗澡水送给王子，便请求让她亲自送上楼去。厨房里的其他女仆一听，全都笑话她。
        - id: ch03-b18
          speakers: [maid_1, maid_2, maid_3]
          ensemble: chorus
          text: 你去那里有什么用？就你这副丑模样，王子还愿意看你吗？
        - id: ch03-b19
          speaker: narrator
          text: 凯蒂一再恳求，终于获准上楼。木斗篷一路哐啷作响，王子听见声音，走了出来。
        - id: ch03-b20
          speaker: prince
          text: 请问你是谁？
        - id: ch03-b21
          speaker: princess
          text: 我是来给殿下送洗澡水的。
        - id: ch03-b22
          speaker: prince
          text: 你真以为我会用你送来的水？
        - id: ch03-b23
          speaker: narrator
          text: 说完，王子把洗澡水全泼在她身上。凯蒂只得忍下这番羞辱，随后又请求去附近的教堂。她也得到了准许。不过，出发以前，她先来到石壁前，找到褐牛说过的那根木棍，在石壁上敲了敲。一个男人立刻从里面走出来。
        - id: ch03-b24
          speaker: rock_man
          text: 您有什么吩咐？
        - id: ch03-b25
          speaker: princess
          text: 我获准去教堂听牧师讲道，可我没有能穿去的衣服。
        - id: ch03-b26
          speaker: narrator
          text: 男人拿出一条亮如铜树林的裙子，还备好一匹马和一副马鞍。凯蒂穿戴整齐，骑马来到教堂。她看起来那样美丽，那样高贵，人人都在猜她究竟是谁。大家只顾着看她，几乎没人听牧师讲了什么。至于王子，他已经深深爱上了她，整个礼拜中，目光一刻也不肯从她身上移开。
        - id: ch03-b27
          speaker: narrator
          text: 散场时，凯蒂刚走出教堂，王子便追上去，替她扶住大门。她的一只手套被门夹住，就这样落到了王子手里。凯蒂走出去骑上马，王子又赶到她面前，问她究竟从哪里来。
        - id: ch03-b28
          speaker: princess
          text: 我从泼水乡来。前方明亮，身后幽暗，云团乘风，滚滚而来。别叫这位王子看见，我的骏马带我去哪里。
        - id: ch03-b29
          speaker: narrator
          text: 王子取出手套，正想还给凯蒂，她念完咒语，便骑着骏马消失了。王子从没见过那样的手套。他走遍远近各地，到处打听那位高傲地骑马离去、连手套也没有拿的贵妇所说的泼水乡，却没有一个人知道它在哪里。
    - id: ch04
      title: 银裙与金鞋
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 又一个星期日，有人要给王子送毛巾。凯蒂请求让她送上去。
        - id: ch04-b02
          speakers: [maid_1, maid_2, maid_3]
          ensemble: chorus
          text: 你去有什么用？上一次的下场，你难道忘了吗？
        - id: ch04-b03
          speaker: narrator
          text: 凯蒂一直恳求，终于拿到了毛巾。她跑上楼梯，木斗篷响个不停。王子走出来，一见是她，便夺过毛巾，朝她脸上扔去。
        - id: ch04-b04
          speaker: prince
          text: 滚开，你这个丑陋的巨怪！你的脏手碰过的毛巾，我怎么会用？
          emotion: angry
        - id: ch04-b05
          speaker: narrator
          text: 王子随后动身去教堂，凯蒂也请求让她前去。众人问她去教堂能做什么，又嘲笑她除了一件又黑又丑的木斗篷，根本没有能穿出门的衣服。凯蒂却说，那位牧师讲道讲得实在好，每次听过以后，心里都十分受用。她不肯放弃，求了又求，终于得到准许。
        - id: ch04-b06
          speaker: narrator
          text: 凯蒂再次来到石壁前，用木棍敲响石壁。男人走出来，给她一条比上次漂亮得多的裙子。裙上覆满银饰，闪耀得如同银树林。他又给她一匹骏马，配着银线绣成的马鞍毯和银嚼子。她到教堂时，人们还站在教堂墓园里。人人都惊叹她的美丽，猜不出她究竟是谁。王子很快迎上来，想在她下马时替她牵住坐骑。
        - id: ch04-b07
          speaker: princess
          text: 不必麻烦。我的马训练得很好，我让它站住，它就不会动。我一叫，它就会回来。
        - id: ch04-b08
          speaker: narrator
          text: 众人走进教堂，可几乎没人听牧师说话，人人只顾看她。王子比上一次陷得更深。讲道结束，凯蒂正要上马，王子又问她从哪里来。
        - id: ch04-b09
          speaker: princess
          text: 我从毛巾乡来。
        - id: ch04-b10
          speaker: narrator
          text: 她说着让马鞭落到地上。王子弯腰去捡，她便念起咒语。
        - id: ch04-b11
          speaker: princess
          text: 前方明亮，身后幽暗，云团乘风，滚滚而来。别叫这位王子看见，我的骏马带我去哪里。
        - id: ch04-b12
          speaker: narrator
          text: 咒语念完，她又在转眼之间消失了。王子站起身时，已经看不出她究竟去了哪里。此后，他走遍远近各地，到处寻找她口中的毛巾乡，可问遍所有人，谁也不知道那是什么地方。王子没有别的办法，只好暂时作罢。
        - id: ch04-b13
          speaker: narrator
          text: 到了第三个星期日，有人要给王子送梳子。凯蒂又请求让她上楼。女仆们提醒她前两次受过的羞辱，还骂她披着黑乎乎的木斗篷，丑得吓人，竟然也想出现在王子面前。凯蒂始终不肯罢休，终于获准把梳子送去。她哐哐啷啷地走上楼，王子出来接过梳子，立刻朝她扔来，又叫她以最快的速度滚开。
        - id: ch04-b14
          speaker: narrator
          text: 王子去了教堂，凯蒂也想去。众人说她又脏又黑，连一件能见人的衣服也没有。若被王子或别人看见，大家都会受罚。凯蒂说别人自有事情可做，不会盯着她看。她不断恳求，终于又出了门。
        - id: ch04-b15
          speaker: narrator
          text: 事情和前两次一样。凯蒂来到石壁前，用木棍敲了敲。石壁里的男人走出来，给她一条比前两条更华美的裙子。裙子几乎全由纯金制成，上面镶满闪亮的钻石。他还给她一匹高贵的骏马，配着金线绣成的马鞍毯和金子做的嚼子。
        - id: ch04-b16
          speaker: narrator
          text: 凯蒂抵达教堂时，牧师和所有人都站在墓园里等她。王子跑来想替她牵马，她自己跳了下来。
        - id: ch04-b17
          speaker: princess
          text: 不，谢谢。我的马训练得很好，我一声吩咐，它就会站着不动。
        - id: ch04-b18
          speaker: narrator
          text: 众人匆匆进了教堂。牧师登上讲坛，谁也没听进去一个字。大家只顾猜她来自哪里。王子比前两次爱得更深，眼睛、耳朵和心思再也容不下别的，只会坐在那里望着她。
        - id: ch04-b19
          speaker: narrator
          text: 讲道结束时，王子早叫人在门廊里倒了一小桶沥青，打算趁凯蒂过不去时上前扶她。凯蒂却丝毫不在乎，一脚踏进沥青中央，再纵身跳到对面。只是她的一只金鞋牢牢粘在里面，没有跟出来。等她走出教堂，骑上骏马，王子已经飞奔到她面前，又问她从哪里来。
        - id: ch04-b20
          speaker: princess
          text: 我从梳子乡来。
        - id: ch04-b21
          speaker: narrator
          text: 王子正想递还金鞋，凯蒂又念起咒语。
        - id: ch04-b22
          speaker: princess
          text: 前方明亮，身后幽暗，云团乘风，滚滚而来。别叫这位王子看见，我的骏马带我去哪里。
        - id: ch04-b23
          speaker: narrator
          text: 王子手里拿着金鞋，还是看不出凯蒂去了哪里。他在世界各地奔波了很久，到处打听梳子乡，吃尽了寻找的辛苦，却没有一个人知道那个地方。最后，他只得换一个办法，命人在所有地方宣告：无论是什么女子，只要她的脚能够穿上这只金鞋，他便娶她为妻。
    - id: ch05
      title: 木斗篷下的公主
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 听见王子的宣告，各地来了无数女子，各种身份、各种模样都有，有美的，也有丑的。可没有一个人的脚小到能穿进金鞋。过了很久，凯蒂的恶毒继母竟带着女儿来了。金鞋穿在那姑娘脚上正合适，可她又丑又叫人厌恶。王子打心底里不愿娶她，只因自己已经许过诺言，才勉强认下这门婚事。
        - id: ch05-b02
          speaker: narrator
          text: 尽管王子满心不愿，宫里还是备起了婚宴。人们给那姑娘穿上新娘的衣服，又用首饰把她从头到脚装点起来。可就在迎亲的队伍骑着马前往教堂时，一只小鸟飞来，停在路旁的一棵树上，对着众人唱了起来。
        - id: ch05-b03
          speaker: little_bird
          text: 脚后跟削掉一块，脚趾头也削掉一块。木斗篷凯蒂的小金鞋，如今盛满了血。
        - id: ch05-b04
          speaker: narrator
          text: 众人听了歌，连忙停下来查看。小鸟果然说中了。那姑娘为了穿进金鞋，削掉了脚后跟和脚趾头，鲜血正从鞋里不停涌出来。于是，王宫里所有女仆和女人都被叫上楼来，一个接一个试穿金鞋，可鞋子还是谁也穿不上。
        - id: ch05-b05
          speaker: prince
          text: 木斗篷凯蒂在哪里？
        - id: ch05-b06
          speaker: narrator
          text: 王子听得懂鸟儿的歌声，也一直记着小鸟唱过的话。
        - id: ch05-b07
          speakers: [maid_1, maid_2, maid_3]
          ensemble: chorus
          text: 她也配想这件事？叫她来根本没用，她的腿粗得像马腿。
        - id: ch05-b08
          speaker: prince
          text: 也许你们说得对。不过别人全都试过了，让凯蒂也试试吧。
        - id: ch05-b09
          speaker: prince
          text: 凯蒂，到这里来！
        - id: ch05-b10
          speaker: narrator
          text: 王子的喊声穿过门口。凯蒂听见了，便踏着沉重的脚步走上楼来。她身上的木斗篷一路哐啷作响，那阵势仿佛不是一个姑娘上楼，而是一整个骑兵团正在冲锋。
        - id: ch05-b11
          speakers: [maid_1, maid_2, maid_3]
          ensemble: chorus
          text: 来呀，你也试试这只鞋，也做一回公主吧！
        - id: ch05-b12
          speaker: narrator
          text: 女仆们一边说，一边围着她嘲笑戏弄。凯蒂没有理会，只拿起那只金鞋，把脚轻轻松松地穿了进去。接着，她脱下木斗篷，站在众人面前。她身上正穿着那条光芒四射的金裙子，明亮得连阳光也在她身上闪耀。再看她的另一只脚，那里正穿着与这只金鞋成对的另一只。
        - id: ch05-b13
          speaker: narrator
          text: 王子终于认出她就是三次来到教堂的贵妇，欢喜得不得了。他立刻跑上前，一把抱住凯蒂，又亲了她一下。等听说凯蒂原来也是一位国王的女儿，他心里更加高兴。原先准备好的婚宴终于迎来了真正的新娘，宴席随即开场。故事也到了这里。
        - id: ch05-b14
          speaker: narrator
          text: 剪一剪，翻一翻，这个故事讲完啦。
