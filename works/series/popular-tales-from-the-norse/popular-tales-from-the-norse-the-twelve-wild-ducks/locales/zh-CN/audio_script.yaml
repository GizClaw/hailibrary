audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 从容而清醒，带一点克制的诙谐
        timbre: 温厚清晰
        pace: 舒缓有致
        pitch: 中低
    queen_mother:
      display_name: 王后
      tts:
        delivery: 温柔却容易被忧愁压住，话里带着深深的悔意
        timbre: 成熟柔和
        pace: 中等偏缓
        pitch: 中等
    troll_witch:
      display_name: 山怪老巫婆
      tts:
        delivery: 冷硬笃定，仿佛每句话都是无法更改的判词
        timbre: 苍老干涩
        pace: 缓慢
        pitch: 低
    snow_white_rosy_red:
      display_name: 白雪红霞
      tts:
        delivery: 真挚坚韧，年轻的声音里藏着长久的忧伤
        timbre: 清澈柔韧
        pace: 中等
        pitch: 中高
    eldest_prince:
      display_name: 大王子
      tts:
        delivery: 威严急烈，受苦太久而心怀怨愤
        timbre: 年轻厚实
        pace: 稍快
        pitch: 中低
    youngest_prince:
      display_name: 小王子
      tts:
        delivery: 善良坦率，遇到不公时坚定直言
        timbre: 年轻明净
        pace: 中等
        pitch: 中等
    prince_two:
      display_name: 二王子
      tts:
        delivery: 质朴沉稳，带着久经磨难的克制
        timbre: 年轻清朗
        pace: 中等
        pitch: 中等
    prince_three:
      display_name: 三王子
      tts:
        delivery: 诚恳直接，说话干净利落
        timbre: 年轻温厚
        pace: 中等
        pitch: 中等
    young_king:
      display_name: 年轻国王
      tts:
        delivery: 温和果断，悲痛时仍保留君王的庄重
        timbre: 明朗沉稳
        pace: 中等偏缓
        pitch: 中低
    old_queen:
      display_name: 老王后
      tts:
        delivery: 尖刻阴冷，嫉妒时咄咄逼人
        timbre: 苍老锐利
        pace: 中等
        pitch: 中高
  chapters:
    - id: ch01
      title: 白雪上的血
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 从前，有位王后在一个冬日乘雪橇出门。雪刚下过，她才走了一小段路，鼻子忽然流血，只好下车，靠在篱笆旁。她看着鲜红的血落在白雪上，又想起自己有十二个儿子，却连一个女儿也没有，心里冒出一个念头。
        - id: ch01-b02
          speaker: queen_mother
          text: 我要是能有个女儿，皮肤像雪一样白，脸颊像血一样红，那十二个儿子以后怎样，我都不在乎。
        - id: ch01-b03
          speaker: narrator
          text: 她的话刚说完，一名山怪老巫婆就站到了面前。
        - id: ch01-b04
          speaker: troll_witch
          text: 你会得到一个女儿。她会像雪一样白，也会像血一样红。可是，你的儿子们要归我。女婴受洗以前，你还可以暂时留着他们。
        - id: ch01-b05
          speaker: narrator
          text: 到了日子，王后果然生下一个女儿。她像雪一样白，像血一样红，正如老巫婆所说。大家便给她取名叫白雪红霞。宫廷上下欢喜得不得了，王后更是满心幸福。可她始终记得对老巫婆的承诺，于是请来银匠，为十二位王子各打一把银匙，又多打一把，留给白雪红霞。
        - id: ch01-b06
          speaker: narrator
          text: 公主刚刚受洗，十二位王子就变成了十二只野鸭，一起飞走。从那以后，再没有人见过他们。他们飞得无影无踪，也一直没有回来。
        - id: ch01-b07
          speaker: narrator
          text: 白雪红霞一天天长大，变成一位高挑美丽的姑娘。可她常常莫名忧愁，谁也猜不透她究竟少了什么。一天傍晚，王后想起失去的儿子，自己也难过起来，便问女儿为何总是不开心。
        - id: ch01-b08
          speaker: queen_mother
          text: 女儿，你心里到底缺什么？只要你告诉我，不管是什么，我都会给你。
        - id: ch01-b09
          speaker: snow_white_rosy_red
          text: 宫里太冷清了，我觉得好孤单。别人都有兄弟姐妹，只有我一个亲人也没有。我就是为这个难过。
          emotion: sad
        - id: ch01-b10
          speaker: queen_mother
          text: 你原本有哥哥。我的十二个儿子，全都是你的哥哥。可是为了得到你，我把他们送走了。
          emotion: sad
        - id: ch01-b11
          speaker: narrator
          text: 王后把当年的事一五一十全都讲了。白雪红霞听完，再也坐不安稳。无论王后说什么、做什么，又怎样流着泪求她留下，她都认定哥哥们遭难全是自己的过错，坚持要去找他们。最后，王后只好答应。公主离开王宫，独自走进茫茫世界。她不停地向前走，走得那么远，叫人简直不敢相信这样年轻的姑娘能有那么多力气。
    - id: ch02
      title: 森林里的十二张床
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 有一天，白雪红霞走进一片大得没有尽头的森林。她累得走不动了，便坐在长满青苔的土墩上睡着。梦里，她越走越深入森林，最后找到一间小木屋，哥哥们全在那里。她猛然醒来，看见绿苔上正有一条被人踩白的小路，通向森林深处。
        - id: ch02-b02
          speaker: narrator
          text: 她沿着小路走了很久，眼前真的出现了一间小木屋，和梦中的一模一样。屋里没有人，却摆着十二张床、十二把椅子和十二把匙子。样样都是十二件。她好些年没有这么欢喜过，一眼便猜出哥哥们住在这里。
        - id: ch02-b03
          speaker: narrator
          text: 她马上生好火，扫净屋子，铺好十二张床，又做好晚饭，尽力把小屋收拾得整整齐齐。所有饭菜和活计都忙完以后，她吃了自己的那份饭，钻到最小的哥哥床下躲好，却把那把银匙忘在桌上。
        - id: ch02-b04
          speaker: narrator
          text: 她刚刚躺下，空中就响起一阵扑啦啦的振翅声。十二只野鸭一齐掠进屋门，刚越过门槛，便全都变回了十二位王子。
        - id: ch02-b05
          speakers: [eldest_prince, youngest_prince, prince_two, prince_three]
          ensemble: chorus
          text: 屋里真暖和！愿上天保佑替我们生火，还为我们做好晚饭的人。
        - id: ch02-b06
          speaker: narrator
          text: 王子们一人拿起一把属于自己的银匙，正准备吃饭。可是，十二个人全都拿完以后，桌上竟然还剩一把。它跟其余的匙子实在太相像，谁也看不出有什么分别。
        - id: ch02-b07
          speakers: [eldest_prince, youngest_prince, prince_two, prince_three]
          ensemble: chorus
          text: 这是妹妹的匙子。匙子既然在这里，她一定也没有走远。
        - id: ch02-b08
          speaker: eldest_prince
          text: 要是妹妹真的来了，就把她杀掉。我们吃过的苦，全是因她而起。
          emotion: angry
        - id: ch02-b09
          speaker: narrator
          text: 白雪红霞躺在床下，一句话也没有漏听。
        - id: ch02-b10
          speaker: youngest_prince
          text: 不行。为了这件事杀她太不公道了。我们的苦难不是她造成的。一定要怪，就该怪母亲。
        - id: ch02-b11
          speaker: narrator
          text: 王子们上上下下，把屋里屋外翻了个遍，又逐一查看所有床底。到了小王子的床前，他们终于找到白雪红霞，把她从床下拉了出来。大王子再次坚持要杀她，她却恳切地为自己求情。
        - id: ch02-b12
          speaker: snow_white_rosy_red
          text: 求求你们，别杀我！我找了整整三年才找到这里。只要能让你们恢复自由，就算要我的命，我也愿意。
          emotion: fearful
        - id: ch02-b13
          speakers: [eldest_prince, youngest_prince, prince_two, prince_three]
          ensemble: chorus
          text: 既然你愿意救我们，我们就留下你的性命。这件事，你确实办得到。
        - id: ch02-b14
          speaker: snow_white_rosy_red
          text: 那就告诉我该怎么做吧。不管有多难，我都会做。
        - id: ch02-b15
          speakers: [eldest_prince, youngest_prince, prince_two, prince_three]
          ensemble: chorus
          text: 你要采来蓟草绒，把它梳好，纺成线，再织成布。然后为我们做十二件外套、十二件衬衫和十二条领巾，一人一套。做这些事的时候，你不能说话，不能笑，也不能哭。只要坚持到最后，我们就能恢复自由。
        - id: ch02-b16
          speaker: snow_white_rosy_red
          text: 可是，要做这么多衣服和领巾，我到哪里才能找到足够的蓟草绒？
        - id: ch02-b17
          speakers: [eldest_prince, youngest_prince, prince_two, prince_three]
          ensemble: chorus
          text: 跟我们来，我们这就带你去看。
        - id: ch02-b18
          speaker: narrator
          text: 他们把公主领到一片辽阔的荒野。那里到处是蓟草，随着风不停点头。蓟草绒在阳光下飘来飘去，亮得像空中的游丝。白雪红霞从没见过这么多，立刻尽力采集起来。
        - id: ch02-b19
          speaker: narrator
          text: 晚上回到木屋，她又梳理绒毛，把它纺成细线。这样的日子过了很久。她每天采绒、梳绒、纺线，还替哥哥们做饭、铺床。傍晚，野鸭扑着翅膀回来，一进门便成为王子。清晨，他们又飞出去，整整一天都是野鸭。
    - id: ch03
      title: 沉默的新王后
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 后来有一天，白雪红霞又到荒野上采蓟草绒。如果我没记错，那正是她最后一次去那里。统治这片国土的年轻国王出来打猎，骑马经过荒野，远远看见了她。
        - id: ch03-b02
          speaker: narrator
          text: 国王停下马，想知道这位美丽姑娘为什么独自在荒野里采绒毛。他问她叫什么，可她不能回答。得不到半点回答，国王越发惊奇，也越来越喜欢她。最后，他无论如何都要带她回城堡成亲，便命仆人抱她上马。
        - id: ch03-b03
          speaker: narrator
          text: 白雪红霞急得绞着双手，一面比画，一面指着装有针线活的袋子。国王明白她一定要带走那些东西，就命手下把袋子捎在马后。等他们照办，她才一点点安下心。年轻国王既英俊又聪明，照顾她时温柔又耐心，就像医生照顾病人一样。
        - id: ch03-b04
          speaker: narrator
          text: 可两人回到王宫以后，国王的继母老王后一看见白雪红霞，便因为她太美而妒火中烧。她马上去找国王。
        - id: ch03-b05
          speaker: old_queen
          text: 你难道还没看明白？你捡回来的这个东西，还想娶她做妻子，她分明就是个巫婆！她不会说话，不会笑，也不会哭，这还不够清楚吗？
          emotion: angry
        - id: ch03-b06
          speaker: narrator
          text: 年轻国王一点也不在乎继母说了什么，仍旧筹办婚礼，娶了白雪红霞。两人婚后过得又幸福又荣耀。可白雪红霞始终没有忘记自己的诺言，仍旧一针一线缝着哥哥们的衬衫。
        - id: ch03-b07
          speaker: narrator
          text: 快到一年时，她生下一个小王子。老王后心里的嫉妒变得更加恶毒。一天深夜，她趁白雪红霞熟睡，偷偷抱走婴儿，把他扔进满是毒蛇的深坑。接着，她割破年轻王后的手指，把血抹在她嘴上，径直去见国王。
        - id: ch03-b08
          speaker: old_queen
          text: 你自己去看吧，看看你娶来的究竟是什么东西。她把亲生孩子吃掉了。
        - id: ch03-b09
          speaker: narrator
          text: 国王心里像压了一块巨石，差点流下眼泪。
        - id: ch03-b10
          speaker: young_king
          text: 我亲眼看见她嘴上的血，恐怕这是真的。可我相信她不会再做一次。这回，我饶她不死。
          emotion: sad
        - id: ch03-b11
          speaker: narrator
          text: 第二年还没过完，白雪红霞又生下一个儿子。同样的事情再次发生。越来越嫉妒、越来越狠毒的老王后照旧趁她熟睡，抱走孩子，扔进满是毒蛇的深坑。她再次割破白雪红霞的手指，把血抹到她嘴上，又跑去指控她吃了孩子。国王的悲伤深得叫人无法想象。
        - id: ch03-b12
          speaker: young_king
          text: 眼前的证据让我不能不信。不过，我还是相信她不会再犯。这一次，我仍然留下她的性命。
          emotion: sad
        - id: ch03-b13
          speaker: narrator
          text: 第三年还没过完，白雪红霞生下一个女儿。她睡着时，老王后也把这个孩子偷走，扔进毒蛇坑。接着，老王后割破她的手指，在她嘴上抹好血，再次去找国王。
        - id: ch03-b14
          speaker: old_queen
          text: 这回你总该相信我了。她是个恶毒透顶的巫婆，连第三个孩子都被她吃了。
          emotion: angry
        - id: ch03-b15
          speaker: narrator
          text: 国王悲伤到了极点。他觉得自己再也不能饶恕白雪红霞，只好下令架起柴堆，把她活活烧死。
    - id: ch04
      title: 火堆旁的十二套衣服
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 柴堆已经烧得熊熊作响，人们正要把白雪红霞推上火去。她忽然打起手势，请他们拿十二块木板，围着火堆一块块摆好。随后，她把哥哥们的十二条领巾、十二件衬衫和十二件外套，一套套放到木板上。小王子的衬衫还缺一只左袖，她实在来不及做完。
        - id: ch04-b02
          speaker: narrator
          text: 衣服刚放好，空中便响起一阵巨大的振翅声。十二只野鸭越过森林，从天而降。每只鸭子都用嘴一口衔起属于自己的衣服，又带着衣服飞走了。
        - id: ch04-b03
          speaker: old_queen
          text: 你看，我说她是巫婆，一点也没错！赶快烧死她，再拖下去，柴火就要烧光了。
          emotion: angry
        - id: ch04-b04
          speaker: young_king
          text: 木柴还有很多，不怕烧完。我再等一会儿。我想亲眼看看，这件事最后会怎样。
        - id: ch04-b05
          speaker: narrator
          text: 国王还在说话，十二位王子已经骑马赶来。他们个个高大英俊，谁见了都要称赞。只有小王子的左臂没有变回来，仍旧是一只野鸭的翅膀。
        - id: ch04-b06
          speakers: [eldest_prince, youngest_prince, prince_two, prince_three]
          ensemble: chorus
          text: 这里出了什么事？
        - id: ch04-b07
          speaker: young_king
          text: 我的王后就要被烧死。她是个巫婆，还吃了自己的孩子。
        - id: ch04-b08
          speakers: [eldest_prince, youngest_prince, prince_two, prince_three]
          ensemble: chorus
          text: 她没有吃掉孩子。妹妹，你现在可以开口了。你让我们恢复自由，救了我们的性命。快把真相说出来，也救救你自己。
        - id: ch04-b09
          speaker: narrator
          text: 白雪红霞终于开口，把一切从头到尾讲了出来。每次她生下孩子，国王的继母老王后都会趁她夜里熟睡，偷偷溜进房里，抱走婴儿，割破她的小指，再把鲜血抹到她嘴上。十二位王子随即领着国王来到蛇坑。
        - id: ch04-b10
          speaker: narrator
          text: 三个孩子正在坑里，和蝰蛇、癞蛤蟆一起玩耍。他们可爱极了，任谁走遍天下，也不会再见到更美的孩子。
        - id: ch04-b11
          speaker: narrator
          text: 国王立刻叫人把孩子全都救上来。随后，他去见继母，问她该怎样惩罚一个狠心陷害无辜王后和三个可爱婴儿的女人。
        - id: ch04-b12
          speaker: old_queen
          text: 应该把她牢牢绑在十二匹没有驯服的烈马中间，让每匹马都分走一份。
        - id: ch04-b13
          speaker: young_king
          text: 你已经为自己说出了判决。现在，这刑罚就落在你身上。
        - id: ch04-b14
          speaker: narrator
          text: 邪恶的老王后马上被牢牢绑在十二匹没有驯服的烈马中间，每匹马都分去了她的一份。国王则带着白雪红霞、三个孩子和十二位王子，一起回到白雪红霞父母身边，把他们身上发生的所有事全部讲了出来。
        - id: ch04-b15
          speaker: narrator
          text: 整个王国到处都是欢笑。人们庆贺白雪红霞终于得救，也庆贺她让十二位哥哥重获自由。
