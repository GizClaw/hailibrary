audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 从容而清醒，带一点克制的诙谐
        timbre: 温厚清晰
        pace: 舒缓有致
        pitch: 中低
    boots:
      display_name: 阿斯凯拉德
      tts:
        delivery: 机灵坦然，温和中透着自信
        timbre: 清亮柔和
        pace: 中等
        pitch: 中
    elder_brother_1:
      display_name: 大哥
      tts:
        delivery: 傲慢自得，说话盛气凌人
        timbre: 偏厚而明亮
        pace: 中等
        pitch: 中低
    elder_brother_2:
      display_name: 二哥
      tts:
        delivery: 势利轻慢，总爱附和兄长
        timbre: 略尖而清晰
        pace: 中等偏快
        pitch: 中高
    innkeeper_1:
      display_name: 第一位客店老板
      tts:
        delivery: 急躁粗鲁，带着压不住的火气
        timbre: 粗实
        pace: 中等偏快
        pitch: 中低
    innkeeper_wife_1:
      display_name: 第一位老板娘
      tts:
        delivery: 热切直率，毫不掩饰自己的喜欢
        timbre: 饱满温暖
        pace: 中等偏快
        pitch: 中
    innkeeper_2:
      display_name: 第二位客店老板
      tts:
        delivery: 刻薄暴躁，斥责时又快又硬
        timbre: 干涩有力
        pace: 快
        pitch: 中低
    innkeeper_wife_2:
      display_name: 第二位老板娘
      tts:
        delivery: 热情大胆，赞叹起来忘乎所以
        timbre: 明亮圆润
        pace: 中等偏快
        pitch: 中高
    innkeeper_3:
      display_name: 第三位客店老板
      tts:
        delivery: 凶巴巴而气急败坏
        timbre: 粗哑紧绷
        pace: 快
        pitch: 中低
    innkeeper_wife_3:
      display_name: 第三位老板娘
      tts:
        delivery: 痴迷热烈，说到俊俏小伙便满心欢喜
        timbre: 柔亮丰润
        pace: 中等
        pitch: 中高
    guard_1:
      display_name: 卫兵甲
      tts:
        delivery: 见多识广却爱把奇闻到处传扬
        timbre: 清楚结实
        pace: 中等
        pitch: 中
    guard_2:
      display_name: 卫兵乙
      tts:
        delivery: 好奇健谈，遇见怪事便惊叹不已
        timbre: 明亮偏薄
        pace: 中等偏快
        pitch: 中高
    princess:
      display_name: 公主
      tts:
        delivery: 起初任性执着，后来温柔而情意真切
        timbre: 清澈柔美
        pace: 中等偏慢
        pitch: 中高
    king:
      display_name: 国王
      tts:
        delivery: 威严务实，对女儿又有几分无奈宠爱
        timbre: 浑厚沉稳
        pace: 舒缓
        pitch: 低
  chapters:
    - id: ch01
      title: 三兄弟的愿望
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 从前有兄弟三人。我也说不清他们碰上了什么好运，反正每个人都能随心许一个愿，愿意许什么都行。两个哥哥想都没多想。他们希望以后每次把手伸进口袋，都能摸出一枚钱来。
        - id: ch01-b02
          speakers: [elder_brother_1, elder_brother_2]
          ensemble: duo
          text: 一个人想要多少钱就有多少钱，还怕不能出人头地吗？
        - id: ch01-b03
          speaker: narrator
          text: 小弟弟阿斯凯拉德却觉得，自己能许一个更好的愿。他希望以后遇见的每个女人，只要看他一眼，就会爱上他。你们很快就会知道，这个愿望比黄金和财物强得多。
        - id: ch01-b04
          speaker: narrator
          text: 愿望许完，两个哥哥要出门闯荡。阿斯凯拉德也想跟着去，可哥哥们一口拒绝了。
        - id: ch01-b05
          speakers: [elder_brother_1, elder_brother_2]
          ensemble: duo
          text: 我们走到哪里，人家都会把我们当伯爵、当国王。你呢？一个钱也没有，以后也不会有。谁会理睬你这个饿死鬼？
        - id: ch01-b06
          speaker: boots
          text: 就算这样，我还是想跟你们走。两位大老爷吃剩的盘子里，也许会留下一口好东西给我呢。
        - id: ch01-b07
          speaker: narrator
          text: 阿斯凯拉德再三央求，哥哥们才勉强答应，不过他只能跟在后面给他们当仆人。
        - id: ch01-b08
          speaker: narrator
          text: 走了一两天，他们来到一家客店。有钱的两个哥哥下了车，大鱼大肉、鸡鸭、美酒，凡是好的全都点来。可怜的阿斯凯拉德却留在外面，看守两位大人物的行李。他在院里来来回回，闲晃了一阵。老板娘从窗口瞧见楼上绅士的仆人，立刻觉得自己一辈子也没见过这么俊的小伙。她看了又看，越看越舍不得移开眼睛。
        - id: ch01-b09
          speaker: innkeeper_1
          text: 见鬼！你趴在窗口看什么？还不快去瞧瞧乳猪烤好了没有！今天店里来了贵客，你忘了吗？
          emotion: angry
        - id: ch01-b10
          speaker: innkeeper_wife_1
          text: 那两个废物有什么稀罕？不满意就让他们滚。你快来看院里的小伙子！我这辈子从没见过这么俊的人。咱们请他进来吃点东西吧，他的日子看着可不好过。
        - id: ch01-b11
          speaker: innkeeper_1
          text: 你原本就没多少脑子，现在连那一点儿也丢光了吗？回厨房看火去，别再盯着陌生男人！
          emotion: angry
        - id: ch01-b12
          speaker: narrator
          text: 老板娘没有办法，只好回厨房照看饭菜。丈夫既不准她请院里的小伙进门，也不准她拿东西款待他。可她心里仍旧惦记着阿斯凯拉德。正要把乳猪穿上烤叉时，她找了个借口跑到院里，当场送给他一把剪刀。这把剪刀会自己在空中裁剪，只要咔嚓几下，就能剪出人们见过的最漂亮的衣裳。无论是丝绸还是缎子，凡是华美的料子，样样都有。
        - id: ch01-b13
          speaker: innkeeper_wife_1
          text: 这把剪刀给你，因为你实在太俊了。
          emotion: happy
        - id: ch01-b14
          speaker: narrator
          text: 两个哥哥把烤的、煮的全塞进肚子，这才坐车上路。阿斯凯拉德仍旧站在车后，给他们当仆人。他们走了很远，来到第二家客店。哥哥们下车进屋，却嫌弟弟身无分文，还是不许他进去，只叫他留在院里守住行李。
        - id: ch01-b15
          speakers: [elder_brother_1, elder_brother_2]
          ensemble: duo
          text: 要是有人问起，就说你服侍的是两位外国王子。
    - id: ch02
      title: 三位老板娘的礼物
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 到了第二家客店，同样的事情又发生了。阿斯凯拉德在院子里闲站着，老板娘从窗口看见他，也像第一位老板娘一样，马上爱上了他。她站在那里一直看，总觉得怎么也看不够。老板正拿着两位王子点的一样东西，匆匆从屋里走过。
        - id: ch02-b02
          speaker: innkeeper_2
          text: 别像母牛瞪着谷仓门那样发呆！把东西拿进厨房，看好煮鱼锅。没看见店里来了贵客吗？
          emotion: angry
        - id: ch02-b03
          speaker: innkeeper_wife_2
          text: 我才不稀罕那两个废物。他们嫌不好，就吃自己带来的东西。你过来看看院里的人呀！我从没见过这么俊的小伙。咱们请他进来吃一点吧，他瞧着多可怜。
        - id: ch02-b04
          speaker: innkeeper_wife_2
          text: 哎呀，他可真招人喜欢！真招人喜欢！
          emotion: happy
        - id: ch02-b05
          speaker: narrator
          text: 第二位老板比第一位更生气。他听见妻子一句接一句夸奖陌生小伙，火气直往上冒，连推带搡地把她赶回厨房。
        - id: ch02-b06
          speaker: innkeeper_2
          text: 你那点脑子已经丢得一干二净了！滚进厨房去，不许再盯着小伙子看！
          emotion: angry
        - id: ch02-b07
          speaker: narrator
          text: 老板娘怕自己的丈夫，只好回去照看煮鱼锅，也不敢明着款待阿斯凯拉德。可她站在炉边添火时，还是找了个借口偷偷跑进院子，送给他一块桌布。这块布只要铺开，桌上就会自己摆满能想到的最好菜肴。
        - id: ch02-b08
          speaker: innkeeper_wife_2
          text: 这块桌布给你，因为你长得这么俊。
          emotion: happy
        - id: ch02-b09
          speaker: narrator
          text: 哥哥们把店里的吃食和酒水尝了个遍，又掏出硬邦邦的钱币付清账，这才重新出发。阿斯凯拉德照旧站在马车后头给他们当仆人。马车走出很远，两个哥哥又觉得饿了。他们便投进第三家客店，一进门就把自己想得出的最好、最贵的东西点了个遍。
        - id: ch02-b10
          speakers: [elder_brother_1, elder_brother_2]
          ensemble: duo
          text: 我们是两位出门游历的国王。我们的钱就像青草，割掉一茬，还会再长一茬。
        - id: ch02-b11
          speaker: narrator
          text: 老板一听，赶紧又烤又焙又煮。饭菜的香味，连不怎么近的邻居家都闻得到。他忙得团团转，要把两位国王想吃的全端上桌。阿斯凯拉德还是只能在外面看车。
        - id: ch02-b12
          speaker: narrator
          text: 同样的故事又来了一遍。第三位老板娘走到窗口，看见仆人守在马车旁边。她从没见过这样俊俏的小伙，看了又看，越看越觉得他漂亮。老板端着两位国王点的一道珍馐，急匆匆从屋里跑过。一见妻子痴痴望着外头，他说起话来一点也不客气。
        - id: ch02-b13
          speaker: innkeeper_3
          text: 贵客就在店里，你还有空站着发呆？马上回厨房，看好你的蛋奶糕！
          emotion: angry
        - id: ch02-b14
          speaker: innkeeper_wife_3
          text: 那两个人不值得我费心。他们等不及，就别吃蛋奶糕。你快来看看院里的小伙子！我从没见过这么漂亮的人。请他进来，让他吃点好的吧。哎呀，他多招人疼！多招人疼呀！
          emotion: happy
        - id: ch02-b15
          speaker: innkeeper_3
          text: 你一辈子都这么轻佻，到现在还不改！再不去看蛋奶糕，我就叫你知道厉害！
          emotion: angry
        - id: ch02-b16
          speaker: narrator
          text: 老板气得手脚都不知道该往哪里放。老板娘知道丈夫容不得半点胡闹，只好尽快跑回炉边，照看蛋奶糕。可她站在火旁时，还是偷偷溜进院子，送给阿斯凯拉德一只酒龙头。
        - id: ch02-b17
          speaker: innkeeper_wife_3
          text: 只要轻轻一转，无论你想喝蜂蜜酒、葡萄酒，还是白兰地，流出来的都是最上等的。这只龙头给你，因为你太俊了。
          emotion: happy
    - id: ch03
      title: 乞丐岛上的盛宴
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 两个哥哥吃喝到再也装不下，便继续赶路，阿斯凯拉德又站在车后给他们当仆人。他们驾车到处游历，终于来到一座王宫。哥哥们自称是两位皇帝的儿子。他们钱多得花不完，衣裳又华丽得老远都会发亮，自然受到盛情款待。国王把他们留在宫里，给他们安排房间，怎么巴结都觉得不够周到。
        - id: ch03-b02
          speaker: narrator
          text: 阿斯凯拉德还穿着离家时的那身破衣，口袋里一个钱也没有。国王的卫兵把他抓起来，划船送到一座岛上。凡是来到王宫的乞丐和无赖，一向都被送去那里。国王不愿让这些肮脏家伙坏了宫里的兴致，每天只给他们送去一点勉强吊住性命的食物。两个哥哥明明看见弟弟被卫兵划船送走，却巴不得甩掉他，半点也不理会。
        - id: ch03-b03
          speaker: narrator
          text: 阿斯凯拉德一上岛，就拿剪刀朝空中咔嚓咔嚓剪起来。剪刀剪出人们所能想象的最漂亮的衣裳，绫罗绸缎，无所不有。岛上的乞丐很快个个穿戴华贵，连国王和宫里的宾客也比不上。接着，他又取出桌布铺开，让这些可怜的乞丐有了吃食。那天乞丐岛上摆出的盛宴，连王宫里都从来不曾有过。
        - id: ch03-b04
          speaker: boots
          text: 我敢说，你们也都渴了吧。
        - id: ch03-b05
          speaker: narrator
          text: 他拿出酒龙头，轻轻一转，让每个乞丐都有酒喝。那样好的啤酒和蜂蜜酒，国王一生也没尝过。
        - id: ch03-b06
          speaker: narrator
          text: 第二天早晨，王宫的人照旧划船送来粥锅底刮下的残渣和削掉的奶酪皮。可怜虫们平日就靠这些过活，如今却连尝也不肯尝。送饭的人正在纳闷，再看清他们的衣裳，更是吃惊。他们还以为这些人至少也是皇帝或教皇，自己一定划错了岛。可他们再三打量，这里分明还是原来的乞丐岛。
        - id: ch03-b07
          speaker: narrator
          text: 他们很快猜到，眼前这番华贵排场，一定是昨天送来的小伙子带来的。一回王宫，他们马上把事情禀报给国王，说那个年轻人把所有乞丐都打扮得无比华丽，衣裳上的珠宝简直要往下掉。
        - id: ch03-b08
          speakers: [guard_1, guard_2]
          ensemble: duo
          text: 我们送去的粥和奶酪，他们连碰都不碰。如今一个个可骄傲啦！
        - id: ch03-b09
          speaker: narrator
          text: 还有一个人打听到，阿斯凯拉德有一把神奇的剪刀。
        - id: ch03-b10
          speaker: guard_1
          text: 他只要对着空中剪几下，出来的全是绫罗绸缎！
          emotion: surprised
        - id: ch03-b11
          speaker: narrator
          text: 公主听见以后便坐立不安，非要亲眼看看那个小伙子，还有那把能从空中剪出绫罗绸缎的剪刀。她觉得，这样的剪刀实在值得拥有。只要有了它，自己想要多少华服都能得到。她一遍又一遍央求国王，国王只好派出使者，把剪刀的主人从岛上召进宫。
        - id: ch03-b12
          speaker: narrator
          text: 阿斯凯拉德来到王宫。公主问他是否真有那样的剪刀，又问他愿不愿意卖给她。阿斯凯拉德说，剪刀确实有，却绝不肯卖。他把剪刀从口袋里掏出来，朝空中剪了又剪。一条条绫罗绸缎立刻在他身边飞舞。
        - id: ch03-b13
          speaker: princess
          text: 不行，这把剪刀你一定要卖给我。价钱随你开，我非得到它不可。
        - id: ch03-b14
          speaker: narrator
          text: 阿斯凯拉德说，这样的剪刀再也找不到第二把，出多少钱都不卖。他们站在那里讨价还价，公主正好有工夫细细看清他的模样。她也像那三位老板娘一样，觉得自己从没见过这么俊美的小伙，于是从头又求了一遍。几百块、再多几百块钱都不要紧，只要能换到剪刀就好。
        - id: ch03-b15
          speaker: boots
          text: 我不卖。不过，若准我今夜睡在公主卧房门边的地板上，我就把剪刀送给她。我绝不会伤害她。她若害怕，可以派两个人守在房里。
        - id: ch03-b16
          speaker: narrator
          text: 公主欣然答应。为了那把剪刀，她什么条件都肯接受。那一夜，阿斯凯拉德睡在卧房门边的地板上，两个人也守在房内。公主却没怎么休息。本该入睡的时候，她总忍不住睁眼看阿斯凯拉德。她才把眼睛闭上一会儿，下一刻又偷偷望向他。这个小伙在她眼里实在太俊了。
    - id: ch04
      title: 公主的三次交换
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 第二天早晨，阿斯凯拉德又被划船送回乞丐岛。王宫的人照旧送来粥渣和奶酪皮，仍然没有一个乞丐肯尝。送饭的人比上次更加惊讶。有人又打听到，先前拥有剪刀的小伙子还有一块桌布。那块布只要铺开，上面就会摆满他想要的一切美味。那人一回王宫，马上把消息说了出来。
        - id: ch04-b02
          speaker: guard_2
          text: 那些热腾腾的烤肉和香甜的蛋奶糕，就连国王宫里也没见过！
          emotion: surprised
        - id: ch04-b03
          speaker: narrator
          text: 公主听说后马上告诉国王，又求了一遍又一遍。国王实在没有办法，只好再次派出使者，把桌布的主人从岛上召来。公主无论如何也要得到那块布，愿意拿成堆的黄金和大片森林交换。可不管她出多高的价钱，阿斯凯拉德还是不卖。
        - id: ch04-b04
          speaker: boots
          text: 若准我今夜躺在公主床边的长凳上，我就把桌布送给她。她若害怕，尽管派四个人守在房里。
        - id: ch04-b05
          speaker: narrator
          text: 公主答应了这个条件。那天夜里，阿斯凯拉德躺在她床边的长凳上，四个人留在房里守着。公主前一夜已经没睡多少，这一夜睡得更少，几乎连一刻也没有合眼。她从天黑一直清醒地躺到天亮，只顾看着那个俊美的小伙。到头来，她还觉得这个夜晚实在太短。
        - id: ch04-b06
          speaker: narrator
          text: 第二天早晨，阿斯凯拉德又得回乞丐岛。公主实在舍不得他，因为只要他在身边，她就满心欢喜。可这件事再怎么央求也没有用。他非得去岛上，谁也改变不了。王宫的人又把粥渣和奶酪皮送给乞丐，这回连看也没有人肯看。送饭的人倒不再觉得奇怪，只是人人都纳闷，为什么一个口渴的也没有。
        - id: ch04-b07
          speaker: narrator
          text: 就在这时，一个卫兵打听到，先前拥有剪刀和桌布的小伙子还有一只酒龙头。只要轻轻转一下，就能流出最难得的啤酒、蜂蜜酒和葡萄酒。他一回宫，还是和前两次一样管不住嘴。无论身份高低，他逢人便讲那只龙头，讲它能多么轻易地放出各样美酒。
        - id: ch04-b08
          speaker: guard_1
          text: 我从没在王宫里喝过那么好的蜂蜜酒和啤酒。就连蜂蜜和糖浆，也没有它们甜！
          emotion: surprised
        - id: ch04-b09
          speaker: narrator
          text: 公主听见后，又一心想得到酒龙头，也很乐意同宝物的主人做交易。她再次去见国王，求他把先前拥有剪刀和桌布的小伙子召来，说那人如今又有一件值得换到手的宝物。国王一听，那只龙头轻轻一转就能放出世间最好的啤酒和葡萄酒，马上派出了使者。
        - id: ch04-b10
          speaker: narrator
          text: 阿斯凯拉德又进了宫。公主问他是否真有一只酒龙头，能变出传闻中的那些美酒。阿斯凯拉德说，背心口袋里确实装着那样一只龙头。可公主一心想买，他却还是像前两次那样回答。无论她怎样恳求，他都不卖，就算拿半个王国交换也不卖。
        - id: ch04-b11
          speaker: boots
          text: 若准我今夜睡在公主床上，就躺在被子外面，我便把酒龙头送给她。我不会伤害她。她若害怕，可以派八个人守在房里。
        - id: ch04-b12
          speaker: princess
          text: 不，不用派人了。我现在已经很了解他。
        - id: ch04-b13
          speaker: narrator
          text: 那一夜，阿斯凯拉德便睡在公主床上，和她并排躺着，不过人在被子外面。前两个夜晚，公主已经睡得很少，这一夜睡得更少。她整整一夜都合不上眼，从天黑一直睁着眼到天亮，只管看着身边的阿斯凯拉德。
    - id: ch05
      title: 最好的愿望
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 第二天早晨，公主起床以后，众人又要把阿斯凯拉德划船送回岛上。她赶紧请他们暂且等一等，自己飞跑去见国王。她软语央求父亲准她嫁给阿斯凯拉德。她实在太爱这个小伙了，若不能同他成婚，活着也没有意思。
        - id: ch05-b02
          speaker: king
          text: 好吧，好吧！你既然非嫁给他不可，那就嫁吧。一个人有这些宝物，也和你一样富有。
        - id: ch05-b03
          speaker: narrator
          text: 阿斯凯拉德就这样娶了公主，又得到半个王国。等国王去世以后，另外半个王国也会归他。从此一切顺顺当当。至于那两个从来没有好好待过他的哥哥，阿斯凯拉德也没有忘记。他把他们赶走，送去了乞丐岛。
        - id: ch05-b04
          speaker: boots
          text: 你们在岛上也许能想明白，究竟是口袋里装满钱的人过得好，还是所有女人见了都会爱上的人过得好。
        - id: ch05-b05
          speaker: narrator
          text: 说句实话，我也不觉得他们整天在乞丐岛上走来走去，一枚又一枚地从口袋里掏钱，会对他们有多大帮助。所以，阿斯凯拉德若一直没把他们接走，他们直到今天还在那里走来走去。口袋里虽然不缺钱，吃的却仍是奶酪皮和粥锅底刮下来的残渣呢。
