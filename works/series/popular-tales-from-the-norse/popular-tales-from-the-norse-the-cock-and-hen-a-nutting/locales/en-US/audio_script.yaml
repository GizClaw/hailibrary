  chapters:
    - id: ch01
      title: A Nutshell in Her Throat
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Once upon a time, the Cock and his mate, Dame Partlet, went into the hazel wood to gather nuts. A nutshell caught in Dame Partlet's throat. She fell onto her back and lay there, beating her wings.
        - id: ch01-b02
          speaker: narrator
          text: The Cock hurried away to find water. When he reached the Spring, he begged for help.
        - id: ch01-b03
          speaker: cock
          text: Dear Spring, please spare one drop of water for Dame Partlet. My mate is in the hazel wood, close to death.
          emotion: fearful
        - id: ch01-b04
          speaker: spring
          text: I won't give you any water until you bring me some leaves.
        - id: ch01-b05
          speaker: narrator
          text: So the Cock ran to the Linden tree.
        - id: ch01-b06
          speaker: cock
          text: Dear Linden, please give me a few leaves. The Spring will trade water for them, and I must carry that water to Dame Partlet. My mate is lying close to death in the hazel wood.
          emotion: fearful
        - id: ch01-b07
          speaker: linden
          text: You may have no leaves until you bring me a red ribbon edged with gold.
        - id: ch01-b08
          speaker: narrator
          text: Then the Cock ran to the Virgin Mary.
        - id: ch01-b09
          speaker: cock
          text: Dear Virgin Mary, please give me a red ribbon with a golden edge. The Linden will trade leaves for it, and the Spring will trade water for those leaves. I need the water for Dame Partlet, my mate, who is close to death in the hazel wood.
          emotion: fearful
        - id: ch01-b10
          speaker: virgin_mary
          text: I will give you no red ribbon until you bring me a pair of shoes.
    - id: ch02
      title: The Chain Grows Longer
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: The Cock ran on until he found the Shoemaker.
        - id: ch02-b02
          speaker: cock
          text: Dear Shoemaker, please give me a pair of shoes. I'll carry the shoes to the Virgin Mary, and she'll give me a red ribbon. I'll take the red ribbon to the Linden, and the Linden will give me leaves. Then I'll bring the leaves to the Spring, and the Spring will give me water for Dame Partlet, my mate, who is close to death in the hazel wood.
          emotion: fearful
        - id: ch02-b03
          speaker: shoemaker
          text: I won't give you shoes until you bring me some bristles.
        - id: ch02-b04
          speaker: narrator
          text: So the Cock ran to the Sow.
        - id: ch02-b05
          speaker: cock
          text: Dear Sow, please give me some bristles. I'll take the bristles to the Shoemaker, and he'll give me shoes. I'll give the shoes to the Virgin Mary, and she'll give me a red ribbon. I'll carry the ribbon to the Linden, and the Linden will give me leaves. Then I'll bring the leaves to the Spring, and the Spring will give me water. That water must go to Dame Partlet, my mate, who is close to death in the hazel wood.
          emotion: fearful
        - id: ch02-b06
          speaker: sow
          text: You won't get any bristles from me until you bring me corn.
        - id: ch02-b07
          speaker: narrator
          text: The Cock ran next to the Thresher.
        - id: ch02-b08
          speaker: cock
          text: Dear Thresher, please give me some corn. I'll carry the corn to the Sow, and she'll give me bristles. I'll take the bristles to the Shoemaker, and he'll give me shoes. I'll bring the shoes to the Virgin Mary, and she'll give me a red ribbon. I'll give the ribbon to the Linden and get leaves, then give the leaves to the Spring and get water. I'll carry that water to Dame Partlet, my mate, who is close to death in the hazel wood.
          emotion: fearful
        - id: ch02-b09
          speaker: thresher
          text: I will give you no corn until you bring me a bannock.
        - id: ch02-b10
          speaker: narrator
          text: Then the Cock hurried to the Baker's Wife.
        - id: ch02-b11
          speaker: cock
          text: Dear Mrs. Baker, please give me a bannock. I'll take the bannock to the Thresher, and he'll give me corn. I'll carry the corn to the Sow, and she'll give me bristles. I'll bring the bristles to the Shoemaker, and he'll give me shoes. I'll give the shoes to the Virgin Mary and get a red ribbon. I'll carry the ribbon to the Linden and get leaves, then bring the leaves to the Spring and get water. Then I'll give the water to Dame Partlet, my mate, who is close to death in the hazel wood.
          emotion: fearful
        - id: ch02-b12
          speaker: bakers_wife
          text: You may have no bannock until you bring me some wood.
        - id: ch02-b13
          speaker: narrator
          text: So the Cock ran to the Woodcutter.
        - id: ch02-b14
          speaker: cock
          text: Dear Woodcutter, please give me some wood. I'll take the wood to the Baker's Wife, and she'll give me a bannock. I'll carry the bannock to the Thresher, and he'll give me corn. I'll bring the corn to the Sow, and she'll give me bristles. I'll take the bristles to the Shoemaker, and he'll give me shoes. I'll give the shoes to the Virgin Mary and get a red ribbon. I'll carry the ribbon to the Linden and get leaves, then give the leaves to the Spring and get water. Then I'll take the water to Dame Partlet, my mate, who is close to death in the hazel wood.
          emotion: fearful
        - id: ch02-b15
          speaker: woodcutter
          text: I won't give you wood until you bring me an axe.
        - id: ch02-b16
          speaker: narrator
          text: The Cock ran farther on to the Smith.
        - id: ch02-b17
          speaker: cock
          text: Dear Smith, please give me an axe. I'll take the axe to the Woodcutter, and he'll give me wood. I'll carry the wood to the Baker's Wife, and she'll give me a bannock. I'll give the bannock to the Thresher and get corn, then give the corn to the Sow and get bristles. The Shoemaker will give me shoes for the bristles. The Virgin Mary will give me a red ribbon for the shoes. The Linden will give me leaves for the ribbon, and the Spring will give me water for the leaves. I must carry that water to Dame Partlet, my mate, who is close to death in the hazel wood.
          emotion: fearful
        - id: ch02-b18
          speaker: smith
          text: You won't get an axe from me until you bring me charcoal.
    - id: ch03
      title: The Kind Charcoal Burner
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: At last, the Cock ran to the Charcoal Burner.
        - id: ch03-b02
          speaker: cock
          text: Dear Charcoal Burner, please give me a little charcoal. I'll give the charcoal to the Smith, and he'll give me an axe. I'll take the axe to the Woodcutter, and he'll give me wood. The Baker's Wife will give me a bannock for the wood. I'll give the bannock to the Thresher and get corn. The Sow will give me bristles for the corn, and the Shoemaker will give me shoes for the bristles. I'll take the shoes to the Virgin Mary and get a red ribbon. I'll carry the ribbon to the Linden and get leaves, then bring the leaves to the Spring and get water. At last, I can take that water to Dame Partlet, my mate, who is close to death in the hazel wood.
          emotion: fearful
        - id: ch03-b03
          speaker: narrator
          text: The Charcoal Burner took pity on the Cock and gave him a piece of charcoal. At once, the whole chain began to run backward. The Smith got his charcoal and handed over the axe. The Woodcutter took the axe and gave up the wood. The Baker's Wife received the wood and passed along a bannock. The Thresher took the bannock and supplied the corn. The Sow got the corn and gave the Cock her bristles. The Shoemaker accepted the bristles and handed him the shoes. The Virgin Mary took the shoes and gave him the red ribbon. The Linden received its red ribbon with the golden edge and gave him leaves. The Spring took the leaves and gave the Cock one drop of water.
        - id: ch03-b04
          speaker: narrator
          text: The Cock carried that drop to Dame Partlet, still lying close to death in the hazel wood. He gave her the water, and she became well again.
