audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 从容而清醒，带一点克制的诙谐
        timbre: 温厚清晰
        pace: 舒缓有致
        pitch: 中低
    cock:
      display_name: 公鸡
      tts:
        delivery: 恳切急迫，说话利落而执着
        timbre: 明亮清晰
        pace: 中等偏快
        pitch: 中高
    spring:
      display_name: 泉水
      tts:
        delivery: 冷静干脆，不紧不慢
        timbre: 清亮流动
        pace: 中等
        pitch: 中
    linden:
      display_name: 椴树
      tts:
        delivery: 庄重坚定，语气不容商量
        timbre: 轻柔而带沙沙质感
        pace: 舒缓
        pitch: 中低
    virgin_mary:
      display_name: 圣母玛利亚
      tts:
        delivery: 安详直接，语气清楚
        timbre: 清澈柔和
        pace: 舒缓
        pitch: 中
    shoemaker:
      display_name: 鞋匠
      tts:
        delivery: 实在利落，公事公办
        timbre: 干爽灵活
        pace: 中等
        pitch: 中
    sow:
      display_name: 母猪
      tts:
        delivery: 直截了当，沉着稳定
        timbre: 浑厚朴实
        pace: 舒缓
        pitch: 低
    thresher:
      display_name: 打谷人
      tts:
        delivery: 朴实坚定，毫不含糊
        timbre: 粗粝结实
        pace: 中等
        pitch: 中低
    bakers_wife:
      display_name: 面包师太太
      tts:
        delivery: 麻利实际，口气爽快
        timbre: 温暖成熟
        pace: 中等
        pitch: 中
    woodcutter:
      display_name: 樵夫
      tts:
        delivery: 粗犷直接，回答干脆
        timbre: 强健沧桑
        pace: 中等
        pitch: 低
    smith:
      display_name: 铁匠
      tts:
        delivery: 爽直有力，受挫后急躁恼火
        timbre: 粗厚响亮
        pace: 中等
        pitch: 中低
    charcoal_burner:
      display_name: 烧炭人
      tts:
        delivery: 心地厚道，寡言温和
        timbre: 低柔醇厚
        pace: 舒缓
        pitch: 中低
  chapters:
    - id: ch01
      title: 榛子壳卡住了
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 从前，公鸡和妻子芭特莱太太一起到榛树林里采榛子。谁知一片榛子壳卡进了芭特莱太太的喉咙。她仰面倒在地上，两只翅膀不停地扑腾。
        - id: ch01-b02
          speaker: narrator
          text: 公鸡急忙去找水。他跑到泉水边，开口央求起来。
        - id: ch01-b03
          speaker: cock
          text: 亲爱的泉水好朋友，求你给我一滴水吧！我要拿去救芭特莱太太。她是我的妻子，现在倒在榛树林里，眼看就要没命了。
          emotion: fearful
        - id: ch01-b04
          speaker: spring
          text: 想从我这里拿水，你得先给我送几片叶子来。
        - id: ch01-b05
          speaker: narrator
          text: 公鸡只得赶往椴树那里。
        - id: ch01-b06
          speaker: cock
          text: 亲爱的椴树好朋友，请给我几片叶子！我把叶子交给泉水，它才肯给我水。我得拿水去救芭特莱太太。她倒在榛树林里，已经命悬一线了。
          emotion: fearful
        - id: ch01-b07
          speaker: linden
          text: 先给我找来一条镶金边的红丝带，我才会把叶子给你。
        - id: ch01-b08
          speaker: narrator
          text: 公鸡又跑去找圣母玛利亚。
        - id: ch01-b09
          speaker: cock
          text: 仁慈的圣母玛利亚，请给我一条镶金边的红丝带！我拿丝带换椴树的叶子，再拿叶子换泉水的一滴水。有了水，我才能救我的妻子芭特莱太太。她倒在榛树林里，眼看就活不成了。
          emotion: fearful
        - id: ch01-b10
          speaker: virgin_mary
          text: 你先拿一双鞋子来，我才会把红丝带给你。
    - id: ch02
      title: 越来越长的交换
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 公鸡接着跑去找鞋匠。
        - id: ch02-b02
          speaker: cock
          text: 亲爱的鞋匠好朋友，请给我一双鞋！鞋子能换来圣母玛利亚的红丝带，丝带能换椴树的叶子，叶子又能换泉水的一滴水。我要把水送给妻子芭特莱太太。她倒在榛树林里，命都快保不住了。
          emotion: fearful
        - id: ch02-b03
          speaker: shoemaker
          text: 那你先给我找些猪鬃来，不然我可没有鞋子给你。
        - id: ch02-b04
          speaker: narrator
          text: 公鸡立刻去找母猪。
        - id: ch02-b05
          speaker: cock
          text: 亲爱的母猪好朋友，请给我一些猪鬃！我用猪鬃换鞋匠的鞋，再用鞋换红丝带，用丝带换叶子，用叶子换水。那滴水得赶紧送到榛树林里，救我的妻子芭特莱太太。她已经快没命了。
          emotion: fearful
        - id: ch02-b06
          speaker: sow
          text: 给我带些谷粒来，我才肯把猪鬃给你。
        - id: ch02-b07
          speaker: narrator
          text: 于是，公鸡又急匆匆地跑到打谷人那里。
        - id: ch02-b08
          speaker: cock
          text: 亲爱的打谷人好朋友，请给我一些谷粒！我把谷粒给母猪，母猪就给我猪鬃。我把猪鬃给鞋匠，鞋匠就给我鞋。我再把鞋交给圣母玛利亚，换来红丝带。红丝带能从椴树那里换来叶子，叶子又能从泉水那里换来一滴水。我的妻子芭特莱太太还倒在榛树林里，正等着这滴水救命呢。
          emotion: fearful
        - id: ch02-b09
          speaker: thresher
          text: 你得先拿一张烤饼来，我才给你谷粒。
        - id: ch02-b10
          speaker: narrator
          text: 公鸡马上赶去找面包师的妻子。
        - id: ch02-b11
          speaker: cock
          text: 亲爱的面包师太太，请给我一张烤饼！我把烤饼给打谷人，打谷人就给我谷粒。把谷粒给母猪，母猪就给我猪鬃。把猪鬃给鞋匠，鞋匠就给我鞋。鞋交给圣母玛利亚，能换来红丝带。红丝带交给椴树，能换来叶子。叶子交给泉水，才能换到水。我的妻子芭特莱太太倒在榛树林里，已经到了生死关头。
          emotion: fearful
        - id: ch02-b12
          speaker: bakers_wife
          text: 先给我送些木柴来，我才会给你烤饼。
        - id: ch02-b13
          speaker: narrator
          text: 公鸡不敢耽搁，又跑去找樵夫。
        - id: ch02-b14
          speaker: cock
          text: 亲爱的樵夫好朋友，请给我一些木柴！我把木柴给面包师太太，她就给我烤饼。烤饼给打谷人，能换来谷粒。谷粒给母猪，能换来猪鬃。猪鬃给鞋匠，能换来鞋。接着，我把鞋交给圣母玛利亚，把换来的红丝带交给椴树，再把椴树的叶子送到泉水那里，这才拿得到水。我要靠这滴水救妻子芭特莱太太。她还倒在榛树林里，眼看就要没命了。
          emotion: fearful
        - id: ch02-b15
          speaker: woodcutter
          text: 给我拿一把斧头来，我才会把木柴给你。
        - id: ch02-b16
          speaker: narrator
          text: 公鸡只好再跑去找铁匠。
        - id: ch02-b17
          speaker: cock
          text: 亲爱的铁匠好朋友，请给我一把斧头！我把斧头给樵夫，樵夫就给我木柴。把木柴给面包师太太，她就给我烤饼。再把烤饼给打谷人，就能换来谷粒。母猪拿到谷粒，会给我猪鬃。鞋匠拿到猪鬃，会给我鞋。圣母玛利亚拿到鞋，会给我红丝带。椴树拿到红丝带，会给我叶子。泉水拿到叶子，才会给我水。我的妻子芭特莱太太还在榛树林里等着这滴救命水。
          emotion: fearful
        - id: ch02-b18
          speaker: smith
          text: 先给我拿木炭来，不然别想从我这里得到斧头。
    - id: ch03
      title: 一滴救命水
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 公鸡终于跑到了烧炭人那里。
        - id: ch03-b02
          speaker: cock
          text: 亲爱的烧炭人好朋友，请给我一点木炭！我把木炭交给铁匠，铁匠就给我斧头。把斧头交给樵夫，樵夫就给我木柴。把木柴交给面包师太太，她就给我烤饼。接着，烤饼交给打谷人，能换来谷粒。谷粒交给母猪，能换来猪鬃。猪鬃交给鞋匠，能换来鞋。鞋交给圣母玛利亚，能换来红丝带。红丝带交给椴树，能换来叶子。最后把叶子交给泉水，才能换到一滴水。我得把水带回榛树林，救我那快没命的妻子芭特莱太太。
          emotion: fearful
        - id: ch03-b03
          speaker: narrator
          text: 烧炭人可怜公鸡，给了他一小块木炭。这条长长的交换就倒着动了起来。铁匠收下木炭，交出斧头。樵夫得了斧头，交出木柴。面包师太太收下木柴，给了公鸡一张烤饼。打谷人拿到烤饼，交出谷粒。母猪吃到谷粒，给了他猪鬃。鞋匠收下猪鬃，拿出一双鞋。圣母玛利亚得了鞋，交出镶金边的红丝带。椴树系上红丝带，给了公鸡几片叶子。泉水收下叶子，终于给了他一滴水。
        - id: ch03-b04
          speaker: narrator
          text: 公鸡带着那滴水赶回榛树林。芭特莱太太还躺在那里，已经命悬一线。公鸡把水喂给她，她便完全好了。
