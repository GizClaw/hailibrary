audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 从容而清醒，带一点克制的诙谐
        timbre: 温厚清晰
        pace: 舒缓有致
        pitch: 中低
    little_peter:
      display_name: 小彼得
      tts:
        delivery: 机灵沉着，说话总像心里早有主意
        timbre: 年轻清朗
        pace: 中等
        pitch: 中
    big_peter:
      display_name: 大彼得
      tts:
        delivery: 粗暴自负，贪心时格外急切
        timbre: 粗厚有力
        pace: 中等偏快
        pitch: 中低
    farm_wife:
      display_name: 农妇
      tts:
        delivery: 表面客气，心虚时尖利慌张
        timbre: 成熟女声
        pace: 中等偏快
        pitch: 中高
    farmer:
      display_name: 男主人
      tts:
        delivery: 直率好客，听见奇事便满心好奇
        timbre: 浑厚朴实
        pace: 中等
        pitch: 中低
    priest:
      display_name: 牧师
      tts:
        delivery: 平日装腔作势，遇险时惊慌急促
        timbre: 圆润偏亮
        pace: 中等偏快
        pitch: 中
    skipper:
      display_name: 船长
      tts:
        delivery: 脾气急躁，求饶时干脆直接
        timbre: 洪亮粗粝
        pace: 偏快
        pitch: 中低
    drover:
      display_name: 赶羊人
      tts:
        delivery: 质朴轻信，满怀向往
        timbre: 清亮朴实
        pace: 中等
        pitch: 中
    big_peters_wife:
      display_name: 大彼得的妻子
      tts:
        delivery: 贪心而信以为真，语气急切
        timbre: 成熟女声
        pace: 中等
        pitch: 中
  chapters:
    - id: ch01
      title: 一张小牛皮
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 从前有兄弟两个，碰巧都叫彼得。人们只好管哥哥叫大彼得，弟弟叫小彼得。父亲去世以后，大彼得娶了个有钱的妻子。小彼得留在母亲身边，靠家里的产业过日子。等他长大，分到了遗产，大彼得便不许他再住老屋、吃用母亲的家当，叫他到外面自谋生路。
        - id: ch01-b02
          speaker: narrator
          text: 小彼得觉得这主意不坏，便买下一匹好马，又装上一车黄油和奶酪，进城做买卖。可他卖了货，转手就把钱换成白兰地、葡萄酒和啤酒。回家以后，他天天过节一般饮酒取乐，请老朋友和邻居喝酒，别人也回请他。钱没花完，欢乐就没散。等最后一枚先令也花掉，钱袋里一个子儿都不剩，他才又回到老母亲家，带回来的东西只有一头小牛。
        - id: ch01-b03
          speaker: narrator
          text: 春天一到，小彼得把牛犊放出去，让它到大彼得的草地上吃草。大彼得气得一击打死了它。小彼得剥下牛皮，挂在浴房里，等它被烟火熏得干透，再卷起来塞进口袋。他带着这张皮走遍乡间，到处叫卖。可不管走到哪里，人们都只管笑，说谁会需要一张烟熏的小牛皮。他就这样走了很远，终于来到一座农庄，上门求借宿一夜。
        - id: ch01-b04
          speaker: farm_wife
          text: 不成，不成。我丈夫去了山上的夏牧场，家里只有我。你先去问隔壁吧。要是他们也不收留你，你再回来。不管怎样，总得有个屋顶让你过夜。
        - id: ch01-b05
          speaker: narrator
          text: 小彼得经过客厅窗外，看见一个牧师正陪农妇饮酒取乐。农妇给他端上麦酒、白兰地，还有满满一大碗蛋奶羹。牧师刚坐下要吃喝，丈夫却偏偏回来了。农妇听见他走进过道，立刻忙开了。她把蛋奶羹塞到厨房炉栅下面，把麦酒和白兰地藏进地窖，再将牧师锁进屋里一口大箱子。这一切，小彼得站在窗外看得清清楚楚。
        - id: ch01-b06
          speaker: narrator
          text: 等男主人进了屋，小彼得才走到门前，再问一回能否借宿。
        - id: ch01-b07
          speaker: farmer
          text: 当然可以。快进来，坐到桌边吃点东西。
        - id: ch01-b08
          speaker: narrator
          text: 小彼得把牛皮也带进来，放在脚边。坐了一会儿，他忽然对着牛皮低声嘀咕。
        - id: ch01-b09
          speaker: little_peter
          text: 你又在说什么？就不能安静一会儿吗？
        - id: ch01-b10
          speaker: farmer
          text: 你在跟谁讲话？
        - id: ch01-b11
          speaker: little_peter
          text: 没什么，只是这张牛皮里藏着一位预言姑娘。
        - id: ch01-b12
          speaker: farmer
          text: 她预言了什么？
        - id: ch01-b13
          speaker: little_peter
          text: 她说，炉栅下面明明放着一碗蛋奶羹，谁也不能说没有。
        - id: ch01-b14
          speaker: farmer
          text: 随她怎么说吧。我家足足一年零一天没做过蛋奶羹了。
        - id: ch01-b15
          speaker: narrator
          text: 小彼得请他去看一眼。男主人一看，果然找到了。两个人便拿来享用。正吃得快活，小彼得又冲牛皮咕哝起来。
        - id: ch01-b16
          speaker: little_peter
          text: 嘘！你怎么还不闭嘴？
        - id: ch01-b17
          speaker: farmer
          text: 预言姑娘这回又说了什么？
        - id: ch01-b18
          speaker: little_peter
          text: 她说，地窖的活板门下面放着白兰地和麦酒，这事谁也否认不了。
        - id: ch01-b19
          speaker: farmer
          text: 她以前就算从没错过，这次也一定错了！我都想不起家里哪天有过白兰地和麦酒。
        - id: ch01-b20
          speaker: little_peter
          text: 你去看看不就知道了。
        - id: ch01-b21
          speaker: narrator
          text: 男主人去地窖一看，酒果然都在。他喝得别提多高兴了。
    - id: ch02
      title: 箱子里的牧师
      blocks:
        - id: ch02-b01
          speaker: farmer
          text: 你买这个预言姑娘花了多少钱？无论你开多少价，我都要买下来。
        - id: ch02-b02
          speaker: little_peter
          text: 她是父亲留给我的，倒没花我什么钱。说实话，我不太舍得。不过，你若拿客厅里那口旧箱子来换，我就把她交给你。
        - id: ch02-b03
          speaker: farm_wife
          text: 那箱子锁着呢，钥匙也早丢了！
          emotion: fearful
        - id: ch02-b04
          speaker: little_peter
          text: 没有钥匙也不碍事，我就要它。
        - id: ch02-b05
          speaker: narrator
          text: 买卖很快谈成。钥匙虽然没有，男主人却找来一根绳子，帮小彼得把箱子抬到背上。小彼得就这样背着它，一步一顿地走了。走过一程，他来到一座桥上。桥下的河水奔腾直泻，浪花翻涌，吼声震耳，就连整座桥也被冲得发颤。
        - id: ch02-b06
          speaker: little_peter
          text: 唉，都是那白兰地害的！我这才知道自己喝得太多了。我要不是醉昏了头，怎么会拿预言姑娘换来这口沉箱子？算了，现在就把它扔进河里。
        - id: ch02-b07
          speaker: narrator
          text: 他一边说，一边解起绳子。箱子里立刻有人大叫。
        - id: ch02-b08
          speaker: priest
          text: 哎哟！看在上帝的分上，快放我出去！这里面是一位牧师，性命就攥在你手里啊！
          emotion: fearful
        - id: ch02-b09
          speaker: little_peter
          text: 这准是魔鬼，故意装成牧师来骗我。你变牧师也好，变教堂执事也好，我照样把你扔下去。
        - id: ch02-b10
          speaker: priest
          text: 不要啊！我真是本堂牧师。我去那位农妇家，是为了照管她的灵魂。她丈夫脾气粗野，她才把我藏进箱子。我的衣袋里有一块金表、一块银表。你放我出来，两块表都给你，我再付八百元！
          emotion: fearful
        - id: ch02-b11
          speaker: little_peter
          text: 哎呀，里面还真是牧师大人吗？
        - id: ch02-b12
          speaker: narrator
          text: 小彼得这才捡起一块石头，把箱盖砸得粉碎。牧师连忙爬出来，急急忙忙往自己的教区住宅逃去。他跑得又快又轻，毕竟金表、银表和八百元都不在身上，再没有那些东西把他压得沉甸甸了。
        - id: ch02-b13
          speaker: narrator
          text: 小彼得回到家，马上去找哥哥。
        - id: ch02-b14
          speaker: little_peter
          text: 今天市场上的小牛皮可值钱了。
        - id: ch02-b15
          speaker: big_peter
          text: 你那张破皮能卖几个钱？
        - id: ch02-b16
          speaker: little_peter
          text: 它值多少，我就卖了多少。总共八百元。要是牛皮更大、更厚实，还能卖两倍呢。
        - id: ch02-b17
          speaker: narrator
          text: 小彼得把八百元亮给哥哥看。大彼得听完，马上宰掉自家所有母牛和小牛，带着一张张牛皮进城。到了市场，制革匠问他要什么价。他张口就说，小皮每张八百元，越大越厚的还要一级一级往上涨。市场上的人全笑疯了，只管拿他取乐。他们说他根本不该来这里，最好去疯人院，兴许还能谈成一笔更好的买卖。
        - id: ch02-b18
          speaker: narrator
          text: 大彼得这才明白事情的原委，知道自己中了弟弟的计。回家以后，他嘴里没有一句好话，又是咒骂，又是赌誓，说当晚一定要一斧头劈死小彼得。弟弟站在一旁，把这些话全听见了。夜深后，他和母亲躺在一张床上，便说自己冷得快要结冰，请母亲和他换个位置，或许靠墙更暖和。母亲答应了。
        - id: ch02-b19
          speaker: narrator
          text: 不久，大彼得提着斧头，悄悄摸到床边。他一斧落下，砍掉的却是母亲的头。
    - id: ch03
      title: 市场上的老婆婆
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 第二天早晨，小彼得走进哥哥的起居室。
        - id: ch03-b02
          speaker: little_peter
          text: 愿上天教你改过，救你脱罪。你竟砍掉了咱们母亲的头。治安官要是听说你这样对待母亲应得的养老家产，恐怕不会高兴。
        - id: ch03-b03
          speaker: narrator
          text: 大彼得一听见治安官，顿时吓坏了。他求弟弟看在上帝的分上，千万别把这件事说出去。只要小彼得肯闭口不谈，他就付八百元。小彼得收下钱，把母亲的头重新安到身上，再把她放到一架手拉雪橇上，一路拖去了市场。他让母亲端端正正坐在那里，两条胳膊各挎一篮苹果，两只手也各拿着一个。
        - id: ch03-b04
          speaker: narrator
          text: 一个船长走过来，以为她是卖苹果的老婆婆，便问一个便士能买几个苹果。老妇人没回答。他又问一次，还是一个字也听不见。
        - id: ch03-b05
          speaker: skipper
          text: 我问你，一个便士到底能买几个？
          emotion: angry
        - id: ch03-b06
          speaker: narrator
          text: 船长第三次扯着嗓子问，老妇人仍坐得笔直，像是什么也看不见、什么也听不见。他一下火冒三丈，朝她耳朵下面狠狠打了一掌。她的头就骨碌碌滚过了市场。小彼得立刻从旁边蹿出来，哭得捶胸顿足，悲声哀号。他说船长给了老母亲致命一击，自己非让这个凶手吃尽苦头不可。
        - id: ch03-b07
          speaker: skipper
          text: 好朋友，求你别把这件事说出去。我给你八百元。
        - id: ch03-b08
          speaker: narrator
          text: 两人就这样和解了。小彼得带着钱回到家，又把它拿给哥哥看。
        - id: ch03-b09
          speaker: little_peter
          text: 今天市场上，老婆子卖得可真贵。我把母亲卖了八百元。你瞧，钱都在这里。
        - id: ch03-b10
          speaker: big_peter
          text: 幸亏你告诉了我。
        - id: ch03-b11
          speaker: narrator
          text: 大彼得还有一个年老的继母。他以为自己也找到了发财门路，马上把她杀掉，大步赶去市场出售。可邻居们听说他竟四处兜售死人的尸体，全都嚷着要把他交给治安官。大彼得费了九牛二虎之力，才从这场麻烦里逃脱。
        - id: ch03-b12
          speaker: narrator
          text: 大彼得回家后，恨弟弟恨得发疯。他说这回绝不宽恕小彼得，当场就要取他的命。
        - id: ch03-b13
          speaker: little_peter
          text: 好吧，好吧。人人早晚都得走这条路，今天到明天，也只隔着一夜。既然我现在非走不可，就请你答应一件事。把我装进那只口袋，带去扔进河里吧。
    - id: ch04
      title: 通往乐园的口袋
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 大彼得对这个请求毫无异议。他把弟弟塞进口袋，扎好袋口，扛起来便往河边走。可还没走出多远，他忽然想起有件要紧东西落在家里，非回去取不可。他把装着弟弟的口袋放在路旁，转身走了。就在这时，一个赶羊人领着一大群肥壮的绵羊走来。口袋里的小彼得听见动静，立刻放开嗓门，一遍又一遍地高喊。
        - id: ch04-b02
          speaker: little_peter
          text: 到天国去，到乐园去！到天国去，到乐园去！
        - id: ch04-b03
          speaker: drover
          text: 能不能准我也跟你一起去？
        - id: ch04-b04
          speaker: little_peter
          text: 当然可以。你只要解开袋口，替我钻进来，很快就能到了。我留在这里等下一回也没什么。不过，你得不停地喊我方才喊的话，不然就去不了那个地方。
        - id: ch04-b05
          speaker: narrator
          text: 赶羊人解开口袋，放出小彼得，自己钻了进去。小彼得重新扎紧袋口。赶羊人躺在里面，反反复复喊着同一句话。
        - id: ch04-b06
          speaker: drover
          text: 到天国去，到乐园去！到天国去，到乐园去！
        - id: ch04-b07
          speaker: narrator
          text: 小彼得把赶羊人稳稳装在袋里，自己丝毫没有耽搁，赶着那群肥羊立刻上路，很快便走出老远。大彼得取了东西回来，看也没看就扛起口袋。他带着赶羊人穿过乡野，直奔那条河。赶羊人始终坐在袋里，一路高喊着小彼得教给他的话。
        - id: ch04-b08
          speaker: drover
          text: 到天国去，到乐园去！到天国去，到乐园去！
        - id: ch04-b09
          speaker: big_peter
          text: 好啊，好啊。这回你自己去找路吧。
        - id: ch04-b10
          speaker: narrator
          text: 大彼得把口袋抛进激流，便转身回家。谁知走在路上，他竟追上了小彼得。弟弟好端端地走在前面，还赶着一大群肥羊。大彼得几乎不敢相信自己的眼睛。他追上去再三询问，小彼得到底怎么从河里逃了出来，又从什么地方弄来这么多好羊。
        - id: ch04-b11
          speaker: little_peter
          text: 哥哥，你把我扔下河，可真帮了我一个大忙。我像石头一样沉到河底，那里到处都是羊群，成千上万，一群比一群大。你瞧，这些羊毛不就是证据吗？
        - id: ch04-b12
          speaker: big_peter
          text: 好，幸亏你把这事告诉我。
    - id: ch05
      title: 河底的羊群
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 大彼得一心只想着河底成千上万的羊，立刻飞奔回家，拉着妻子来到河边。他找来一只口袋，自己钻了进去，又催妻子赶紧把袋口扎牢，从桥上把他扔进水里。
        - id: ch05-b02
          speaker: big_peter
          text: 我要下去赶一群羊。要是我耽搁太久，你觉得我一个人拢不住它们，就跳下来帮忙。听见了吗？
        - id: ch05-b03
          speaker: big_peters_wife
          text: 好，可千万别在河底待得太久。我这会儿一心只盼着亲眼瞧见那些羊呢。
        - id: ch05-b04
          speaker: narrator
          text: 妻子站在桥上等了一阵，可水面一直没有动静。后来，她心想丈夫在河底或许真遇见了许多羊，一个人没法把羊群拢到一起。既然他已经叫她下去帮忙，她便也纵身跳进河里，追他去了。
        - id: ch05-b05
          speaker: narrator
          text: 就这样，小彼得摆脱了他们所有人。大彼得留下的农庄和田地由他继承，马匹与牲畜也全归了他。除此以外，他口袋里还有从前赚来的钱，足够再买些产奶的母牛，一头头拴进自己的牛棚。
