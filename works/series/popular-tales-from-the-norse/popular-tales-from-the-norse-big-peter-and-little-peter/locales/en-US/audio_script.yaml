  chapters:
    - id: ch01
      title: The Calfskin
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Once upon a time there were two brothers, and both were named Peter. The elder one was called Big Peter, and the younger was called Little Peter. After their father died, Big Peter married a woman with plenty of money. Little Peter stayed with his mother and lived on what she had until he was grown.
        - id: ch01-b02
          speaker: narrator
          text: When Little Peter came into his inheritance, Big Peter told him he could no longer stay in the old house and use up their mother's means. He ought to go out into the world, Big Peter said, and do something for himself.
        - id: ch01-b03
          speaker: narrator
          text: Little Peter thought that sounded reasonable. He bought a fine horse, loaded it with butter and cheese, and set out for town. He sold everything there. Then he used the money to buy brandy, wine, and beer and carried it all home. From that moment, every day became a holiday. He feasted and made merry with his old friends and neighbors. He treated them, they treated him in return, and the fun lasted exactly as long as his money did.
        - id: ch01-b04
          speaker: narrator
          text: Once his last shilling was gone and his purse was empty, Little Peter returned to his mother with nothing but a calf. In spring he let the calf graze in Big Peter's meadow. Big Peter grew so cross that he killed it with one blow.
        - id: ch01-b05
          speaker: narrator
          text: Little Peter skinned the calf and hung the hide in the bathhouse until it was thoroughly dry. Then he rolled it up, stuffed it in a sack, and walked from place to place through the countryside, trying to find a buyer. Wherever he offered it, people only laughed at him. They told him plainly that they had no need for a smoked calfskin.
        - id: ch01-b06
          speaker: narrator
          text: After a long walk, he reached a farm and asked if he might stay the night.
        - id: ch01-b07
          speaker: goody
          text: No, I can't lodge you. My husband is up at the hillside pasture, and I'm alone here. Try the next farm. If they won't take you, though, come back. One way or another, you must have a roof tonight.
        - id: ch01-b08
          speaker: narrator
          text: As Little Peter passed the parlor window, he saw a priest inside making merry with the Goody. She had served him ale, brandy, and a great bowl of custard. The priest had only just sat down when the husband came home.
        - id: ch01-b09
          speaker: narrator
          text: The moment the Goody heard her husband in the passage, she moved quickly. She pushed the great bowl of custard under the kitchen grate and carried the ale and brandy down to the cellar. As for the priest, she shut him inside a great chest and locked it. Little Peter stood outside and watched every bit of this. Once the husband was safely indoors, Peter went to the door and asked again for a night's lodging.
        - id: ch01-b10
          speaker: farmer
          text: Why, of course we'll take you in. Come sit at the table and have something to eat.
        - id: ch01-b11
          speaker: narrator
          text: Little Peter sat down with the calfskin at his feet. After a while, he bent toward it and began to mutter.
        - id: ch01-b12
          speaker: little_peter
          text: What's that you're saying? Can't you keep quiet?
        - id: ch01-b13
          speaker: farmer
          text: Who are you talking to?
        - id: ch01-b14
          speaker: little_peter
          text: Oh, it's only a fortune-telling maiden I carry in my calfskin.
        - id: ch01-b15
          speaker: farmer
          text: And what fortune is she telling you?
        - id: ch01-b16
          speaker: little_peter
          text: She says there's a bowl of custard under the grate, and no one can deny it.
        - id: ch01-b17
          speaker: farmer
          text: She can tell all the fortunes she likes, but there hasn't been custard in this house for a year and a day.
        - id: ch01-b18
          speaker: narrator
          text: Peter asked him to look anyway. The farmer did, and there stood the bowl. Soon they were enjoying the custard together. Then Peter muttered to the calfskin once more.
        - id: ch01-b19
          speaker: little_peter
          text: Hush now! Must you keep chattering?
        - id: ch01-b20
          speaker: farmer
          text: What does your fortune-teller say this time?
        - id: ch01-b21
          speaker: little_peter
          text: She says there's brandy and ale under the trapdoor leading to the cellar. No one can say otherwise.
        - id: ch01-b22
          speaker: farmer
          text: If she's never been wrong before, she's wrong now. Brandy and ale? I can't remember the last time we had either one here.
        - id: ch01-b23
          speaker: little_peter
          text: Just take a look.
        - id: ch01-b24
          speaker: narrator
          text: The farmer looked, and sure enough, he found the drink. You can imagine how merry he became.
        - id: ch01-b25
          speaker: farmer
          text: What did you pay for that fortune-telling maiden? I must have her, whatever the price.
        - id: ch01-b26
          speaker: little_peter
          text: My father left her to me, so she cost me little. I don't much want to part with her. Still, you may have her if you give me that old chest in the parlor.
        - id: ch01-b27
          speaker: goody
          text: The chest is locked, and the key is lost!
          emotion: fearful
        - id: ch01-b28
          speaker: little_peter
          text: Then I'll take it without the key.
        - id: ch01-b29
          speaker: narrator
          text: The bargain was soon made. Peter took a rope in place of the key, and the farmer helped fasten the chest onto his back. Then Peter went trudging away with it.
    - id: ch02
      title: The Chest on the Bridge
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: Before long, Little Peter came to a bridge. Beneath it, a river rushed headlong, leaping and foaming with such a roar that the bridge shook.
        - id: ch02-b02
          speaker: little_peter
          text: Ah, that brandy! I can feel I've had too much. Why am I dragging this chest around? If I hadn't been drunk and foolish, I'd never have traded away my fortune-teller for it. Into the river it goes, right now.
        - id: ch02-b03
          speaker: narrator
          text: He began untying the rope.
        - id: ch02-b04
          speaker: priest
          text: Oh! Please, for God's sake, let me out! The priest's life is in danger. I'm the man inside this chest!
          emotion: fearful
        - id: ch02-b05
          speaker: little_peter
          text: This must be the Devil himself, trying to fool me by pretending to be a priest. Priest or clerk, into the river you go.
        - id: ch02-b06
          speaker: priest
          text: No, no! I truly am the parish priest. I was visiting the Goody for the health of her soul. Her husband is a rough, wild man, so she had to hide me here. I have a gold watch and a silver watch in my pocket. Take them both, and eight hundred dollars besides, if you'll only set me free.
          emotion: fearful
        - id: ch02-b07
          speaker: little_peter
          text: Well now, is it really your reverence after all?
        - id: ch02-b08
          speaker: narrator
          text: Peter picked up a stone and knocked the lid of the chest to pieces. The priest climbed out and hurried away to his parsonage as fast as he could go. He traveled both quickly and lightly, for the gold watch, the silver watch, and eight hundred dollars no longer weighed him down.
        - id: ch02-b09
          speaker: narrator
          text: Little Peter went home too and found his brother.
        - id: ch02-b10
          speaker: little_peter
          text: Calfskins sold very well at market today.
        - id: ch02-b11
          speaker: big_peter
          text: And what did you get for that ragged hide of yours?
        - id: ch02-b12
          speaker: little_peter
          text: About what it was worth. Mine brought eight hundred dollars. Larger, stronger calfskins sold for twice as much.
        - id: ch02-b13
          speaker: narrator
          text: Little Peter showed him the money.
        - id: ch02-b14
          speaker: big_peter
          text: I'm glad you told me.
        - id: ch02-b15
          speaker: narrator
          text: Big Peter went straight out and slaughtered every cow and calf he owned. Then he loaded up all their skins and hides and set off along the road to town. At the market, the tanners came to ask what he wanted for them. Big Peter demanded eight hundred dollars for each small skin, and a higher price for every larger hide.
        - id: ch02-b16
          speaker: narrator
          text: Everyone laughed and mocked him. They told him he had come to the wrong place and might find a better bargain at the madhouse. Big Peter soon understood that Little Peter had tricked him.
        - id: ch02-b17
          speaker: narrator
          text: When he came home, there was nothing gentle in his voice. He swore that he would strike Little Peter dead that very night. Little Peter heard every word.
    - id: ch03
      title: The Old Woman at Market
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: That night, Little Peter went to bed beside his mother. After some time had passed, he asked her to change places with him. He said he was nearly frozen and thought it might be warmer next to the wall. His mother agreed.
        - id: ch03-b02
          speaker: narrator
          text: A little later, Big Peter crept to the bedside with an axe in his hand. With one blow, he cut off his mother's head.
        - id: ch03-b03
          speaker: narrator
          text: The next morning, Little Peter walked into his brother's sitting room.
        - id: ch03-b04
          speaker: little_peter
          text: Heaven help you! You've chopped off our mother's head. The Sheriff won't be pleased when he hears this is how you pay her widow's share.
        - id: ch03-b05
          speaker: narrator
          text: Big Peter was terrified. He begged his brother, for God's sake, to keep quiet. If Little Peter said nothing about what he knew, Big Peter promised him eight hundred dollars.
        - id: ch03-b06
          speaker: narrator
          text: Little Peter swept up the money. Then he put his mother's head back in place on her body, laid her on a hand-sledge, and pulled her all the way to market. Once there, he sat her upright as though she were selling fruit. He hung a basket of apples from each arm and placed an apple in each of her hands.
        - id: ch03-b07
          speaker: narrator
          text: After a while, a skipper came along. Taking her for an apple seller, he stopped beside her.
        - id: ch03-b08
          speaker: skipper
          text: Are those apples for sale? How many can I have for a penny?
        - id: ch03-b09
          speaker: narrator
          text: The old woman did not answer. The skipper asked again, but she never said a word.
        - id: ch03-b10
          speaker: skipper
          text: How many apples do I get for a penny?
        - id: ch03-b11
          speaker: narrator
          text: He shouted the question a third time, louder than before. Still the old woman sat bolt upright and never moved, as if she could neither see him nor hear a word he said. The skipper flew into a rage and struck her under the ear. At once, her head came loose and rolled away across the marketplace.
        - id: ch03-b12
          speaker: narrator
          text: At once, Little Peter bounded forward. He wept and wailed and threatened to make the skipper suffer for killing his old mother.
        - id: ch03-b13
          speaker: skipper
          text: Dear friend, please keep this to yourself. Say nothing, and I'll give you eight hundred dollars.
          emotion: fearful
        - id: ch03-b14
          speaker: narrator
          text: So they settled the matter between them. Little Peter returned home and spoke to his brother.
        - id: ch03-b15
          speaker: little_peter
          text: Old women brought a fine price at market today. I got eight hundred dollars for Mother. Look for yourself.
        - id: ch03-b16
          speaker: narrator
          text: He showed Big Peter the money.
        - id: ch03-b17
          speaker: big_peter
          text: I'm glad I found that out.
        - id: ch03-b18
          speaker: narrator
          text: Now, Big Peter had an old stepmother of his own. Without waiting, he killed her and strode off to sell her, just as he thought Little Peter had sold their mother. But people soon heard how he was going about trying to sell a dead body. The neighbors wanted to seize him and hand him over to the Sheriff, and he only just managed to struggle free of the trouble.
        - id: ch03-b19
          speaker: narrator
          text: He came home furious with Little Peter and threatened to kill him there and then. There would be no mercy, he said. Little Peter must die.
    - id: ch04
      title: The Sack by the Road
      blocks:
        - id: ch04-b01
          speaker: little_peter
          text: Well, well. We all have to take that road someday, and only one night lies between today and tomorrow. If I must go now, I ask just one thing. Put me into that sack over there and throw me in the river.
        - id: ch04-b02
          speaker: narrator
          text: Big Peter had no objection at all. He stuffed Little Peter into the hanging sack, tied it up, and set off toward the river. He had not carried him very far when he remembered something he had forgotten at home. It was something he had to fetch, so he set the sack down beside the road and went back for it.
        - id: ch04-b03
          speaker: narrator
          text: Just then, a man came driving a fine, fat flock of sheep. From inside the sack, Little Peter began roaring the same words again and again.
        - id: ch04-b04
          speaker: little_peter
          text: To Kingdom Come, to Paradise! To Kingdom Come, to Paradise!
        - id: ch04-b05
          speaker: drover
          text: May I have leave to go with you?
        - id: ch04-b06
          speaker: little_peter
          text: Of course. Untie the sack and climb in instead of me. You'll soon be there. I don't mind waiting here until next time. But you must keep shouting the words you heard me use, or you won't reach the right place.
        - id: ch04-b07
          speaker: narrator
          text: The drover untied the sack and took Little Peter's place. Peter tied it again, and the man began to call out.
        - id: ch04-b08
          speaker: drover
          text: To Kingdom Come, to Paradise! To Kingdom Come, to Paradise!
        - id: ch04-b09
          speaker: narrator
          text: He kept faithfully to those words. Once the drover was secure in the sack, Little Peter lost no time. He took the flock and drove it away, soon leaving a good stretch of road behind him.
        - id: ch04-b10
          speaker: narrator
          text: Meanwhile, Big Peter returned. He lifted the sack onto his shoulders and carried it across the countryside toward the river. All the way, the drover inside kept shouting.
        - id: ch04-b11
          speaker: drover
          text: To Kingdom Come, to Paradise! To Kingdom Come, to Paradise!
        - id: ch04-b12
          speaker: big_peter
          text: Yes, yes. Now find the way there for yourself.
        - id: ch04-b13
          speaker: narrator
          text: With that, Big Peter threw the sack into the rushing stream.
    - id: ch05
      title: Sheep Beneath the River
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: After throwing the sack into the stream, Big Peter started home. Before long, whom should he overtake but his own brother, walking along and driving that fine flock of sheep ahead of him. Big Peter could scarcely believe his eyes. He asked how Little Peter had ever climbed out of the river and where all those sheep had come from.
        - id: ch05-b02
          speaker: little_peter
          text: Ah, you did me a true brotherly kindness when you threw me in. I sank straight to the bottom like a stone, and there I saw flocks of sheep. You'd hardly believe how many thousands wander down there, each flock larger than the last. Just look at these fleeces!
        - id: ch05-b03
          speaker: big_peter
          text: Well, I'm very glad you told me.
        - id: ch05-b04
          speaker: narrator
          text: Big Peter ran home to his wife and made her come with him to the river. He climbed into a sack and told her to tie it quickly and throw him over the bridge.
        - id: ch05-b05
          speaker: big_peter
          text: I'm going down for a flock of sheep. If I'm gone too long, and you think I can't manage the flock alone, jump in and help me. Do you hear?
        - id: ch05-b06
          speaker: big_peters_wife
          text: Don't stay away too long. I have my heart set on seeing those sheep.
        - id: ch05-b07
          speaker: narrator
          text: She stood waiting for a while. Then she thought her husband might be having trouble keeping the flock together, so she jumped into the river after him.
        - id: ch05-b08
          speaker: narrator
          text: And that was how Little Peter was rid of them all. With Big Peter and his wife gone, Little Peter became the heir. The farm and all its fields came to him, and so did the horses and cattle. Besides all that, he still had money in his pocket, enough to buy milk cows of his own and tether them in his own barn.
