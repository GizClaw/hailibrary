      display_name: Narrator
      tts:
        delivery: thoughtful and gently wry
        timbre: warm and clear
        pace: measured
        pitch: medium
    king:
      display_name: The King
      tts:
        delivery: commanding and fatherly
        timbre: deep and resonant
        pace: measured
        pitch: low
    boots:
      display_name: Boots
      tts:
        delivery: humble and openhearted
        timbre: youthful and clear
        pace: moderate
        pitch: medium
    brother_1:
      display_name: Eldest Brother
      tts:
        delivery: proud and dismissive
        timbre: firm and youthful
        pace: brisk
        pitch: medium-low
    brother_2:
      display_name: Second Brother
      tts:
        delivery: smug and impatient
        timbre: bright and sharp
        pace: brisk
        pitch: medium
    brother_3:
      display_name: Third Brother
      tts:
        delivery: scornful and certain
        timbre: youthful and dry
