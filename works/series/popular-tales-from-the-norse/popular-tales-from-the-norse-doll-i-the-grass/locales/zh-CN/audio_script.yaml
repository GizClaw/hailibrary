audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 从容而清醒，带一点克制的诙谐
        timbre: 温厚清晰
        pace: 舒缓有致
        pitch: 中低
    king:
      display_name: 国王
      tts:
        delivery: 威严果断，说话不容商量
        timbre: 浑厚沉稳
        pace: 中等
        pitch: 低
    brother_1:
      display_name: 大王子
      tts:
        delivery: 傲慢轻蔑，惯于带头发话
        timbre: 清晰偏硬
        pace: 中等
        pitch: 中低
    brother_2:
      display_name: 二王子
      tts:
        delivery: 随声附和，语气冷淡
        timbre: 明亮干脆
        pace: 中等
        pitch: 中
    brother_3:
      display_name: 三王子
      tts:
        delivery: 不耐烦，带着讥讽
        timbre: 略显粗哑
        pace: 中等偏快
        pitch: 中低
    boots:
      display_name: 小靴子
      tts:
        delivery: 真诚直率，失意时低落，欢喜时轻快
        timbre: 年轻清朗
        pace: 中等
        pitch: 中
    little_lass:
      display_name: 白衣小姑娘
      tts:
        delivery: 亲切轻盈，带着神秘感
        timbre: 纤细清亮
        pace: 舒缓
        pitch: 高
    doll_i_the_grass:
      display_name: 草中娃
      tts:
        delivery: 温柔大方，遇事从容自若
        timbre: 柔和清澈
        pace: 舒缓
        pitch: 中高
  chapters:
    - id: ch01
      title: 十二位王子去寻新娘
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 从前，有一位国王，膝下有十二个儿子。等王子们长大成人，国王就把他们叫到跟前，要他们各自出门寻找新娘。
        - id: ch01-b02
          speaker: king
          text: 你们到外面的世界去，每人都要带一位妻子回来。可她得能在一天里纺好线，织成布，再缝出一件衬衫。不然，我可不认她做儿媳。
        - id: ch01-b03
          speaker: narrator
          text: 国王给每个儿子一匹马，又给了他们一身新铠甲。十二位王子骑马出发了。可他们还没走多远，哥哥们便嫌弃起最小的弟弟小靴子。
        - id: ch01-b04
          speakers: [brother_1, brother_2, brother_3]
          ensemble: chorus
          text: 别让小靴子跟我们走。他什么本事也没有，带着他有什么用！
        - id: ch01-b05
          speaker: narrator
          text: 小靴子只得留在后面。他不知道该怎么办，也不知道还能往哪儿去，心里越想越难过。他下了马，坐进高高的草丛里哭起来。
        - id: ch01-b06
          speaker: narrator
          text: 过了一会儿，身旁的一簇草忽然摇了起来，一个雪白的小东西从草里钻出，慢慢向他走近。小靴子定睛一看，原来是个漂亮的小姑娘，只是小得出奇。
        - id: ch01-b07
          speaker: little_lass
          text: 你愿不愿意跟我到地底下去，见见草中娃？
        - id: ch01-b08
          speaker: boots
          text: 我当然愿意。我这就跟你去。
        - id: ch01-b09
          speaker: narrator
          text: 小靴子跟着小姑娘下到地底。草中娃正坐在一把椅子上。她又美丽又神气，一见小靴子，便问起他的来意。
        - id: ch01-b10
          speaker: doll_i_the_grass
          text: 你要往哪儿去？出门又是为了什么事？
        - id: ch01-b11
          speaker: boots
          text: 我们一共有十二兄弟。父王给了我们马匹和铠甲，要我们到世界各处去找妻子。谁能在一天里纺线、织布，再缝好一件衬衫，谁才是他肯要的儿媳。
        - id: ch01-b12
          speaker: boots
          text: 可只要你现在答应做我的妻子，我就一步也不再往前走了！
        - id: ch01-b13
          speaker: narrator
          text: 草中娃很愿意。她马上动手纺线、织布，又把衬衫缝了出来。只是那件衬衫实在太小，小得只有这么——长。
    - id: ch02
      title: 银汤匙落进水中
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 小靴子带着小衬衫回到家。要把它拿出来时，他瞧着那小小的一团，自己都有些难为情。国王看过以后，却答应让他娶草中娃为妻。
        - id: ch02-b02
          speaker: king
          text: 你可以娶她为妻。
        - id: ch02-b03
          speaker: narrator
          text: 小靴子满心欢喜，赶去接他那小小的心上人。他到了草中娃那里，想把她抱上马，让她坐在自己身前。草中娃却不肯这样走。
        - id: ch02-b04
          speaker: doll_i_the_grass
          text: 我要坐在银汤匙里赶路。我有两匹白色的小马，它们会拉着我走。
        - id: ch02-b05
          speaker: narrator
          text: 于是两人出发了。小靴子骑着自己的马，草中娃坐进银汤匙。为她拉车的两匹小白马，原来是两只雪白的小老鼠。草中娃实在太小，小靴子生怕一不留神骑马踩到她，一路都走在大路的另一边。
        - id: ch02-b06
          speaker: narrator
          text: 走了一段，他们来到一片宽阔的水边。小靴子的马忽然受了惊，猛地闪向路的另一边，一下撞翻了银汤匙。草中娃从汤匙里滚出来，跌进了水中。
        - id: ch02-b07
          speaker: narrator
          text: 小靴子不知道该怎样把她救上来，伤心得不得了。没过多久，一位男水妖从水里浮上来，身边还带着草中娃。她安然无恙，却已经长得和寻常人一般大小，比从前还要美丽。
        - id: ch02-b08
          speaker: narrator
          text: 这一次，小靴子让草中娃坐在自己身前，两人共骑一匹马回了家。
    - id: ch03
      title: 草中娃的婚宴
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 小靴子到家时，哥哥们也全都回来了，每个人身边都带着一位心上人。可这些女子一个比一个丑陋、肮脏、邪恶。她们一路只顾互相争打，别的什么也没有做。
        - id: ch03-b02
          speaker: narrator
          text: 她们还戴着一种涂满焦油和烟灰的帽子。雨水从帽子上流下来，把焦油和烟灰淌得满脸都是。这样一来，她们就变得比原先更丑，也更叫人厌恶了。
        - id: ch03-b03
          speaker: narrator
          text: 哥哥们见到小靴子和他美丽的心上人，个个嫉妒得要命。国王却为他们俩欢喜极了。他把其他人全都赶了出去，只留下小靴子和草中娃举办婚宴。
        - id: ch03-b04
          speaker: narrator
          text: 从此以后，他们和和美美地生活了很久很久。要是他们还没有死，那么直到今天，他们一定还活着呢。
