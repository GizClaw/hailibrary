audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 从容而清醒，带一点克制的诙谐
        timbre: 温厚清晰
        pace: 舒缓有致
        pitch: 中低
    widow:
      display_name: 寡妇
      tts:
        delivery: 疲惫而坚忍，对儿子说话时带着不舍
        timbre: 柔和沧桑
        pace: 偏慢
        pitch: 中
    lad:
      display_name: 小伙子
      tts:
        delivery: 爽直冲动，历经磨炼后更显沉着
        timbre: 年轻清亮
        pace: 中等
        pitch: 中高
    troll:
      display_name: 陌生人
      tts:
        delivery: 克制阴沉，威胁时冷酷逼人
        timbre: 低沉厚重
        pace: 偏慢
        pitch: 低
    horse:
      display_name: 黑马
      tts:
        delivery: 睿智果断，发号施令时沉稳有力
        timbre: 深沉洪亮
        pace: 舒缓
        pitch: 低
    kitchen_maid:
      display_name: 厨房女仆
      tts:
        delivery: 挑剔尖刻，说话毫不客气
        timbre: 明亮锐利
        pace: 偏快
        pitch: 中高
    cook:
      display_name: 厨子
      tts:
        delivery: 粗声粗气，脾气急躁
        timbre: 浑厚粗粝
        pace: 偏快
        pitch: 中低
    coachman:
      display_name: 马车夫
      tts:
        delivery: 务实冷淡，语气简短
        timbre: 干涩结实
        pace: 中等
        pitch: 中低
    gardener:
      display_name: 园丁
      tts:
        delivery: 实在随和，偶尔带一点干巴巴的打趣
        timbre: 温和朴厚
        pace: 舒缓
        pitch: 中低
    princess:
      display_name: 公主
      tts:
        delivery: 温柔而有主见，感情真挚
        timbre: 清澈柔美
        pace: 中等
        pitch: 中高
    princess_maid:
      display_name: 公主的侍女
      tts:
        delivery: 轻声谨慎，行动利落
        timbre: 轻柔清亮
        pace: 中等
        pitch: 中高
    king:
      display_name: 国王
      tts:
        delivery: 威严强硬，动怒时不容分辩
        timbre: 宽厚有力
        pace: 中等
        pitch: 低
    gaoler:
      display_name: 狱卒
      tts:
        delivery: 本分直接，照章办事
        timbre: 粗朴沉稳
        pace: 中等
        pitch: 中低
    king_man_1:
      display_name: 国王的手下甲
      tts:
        delivery: 喧闹刻薄，嘲笑时毫不收敛
        timbre: 粗亮
        pace: 偏快
        pitch: 中
    king_man_2:
      display_name: 国王的手下乙
      tts:
        delivery: 粗鲁起哄，口气张扬
        timbre: 沙哑响亮
        pace: 偏快
        pitch: 中低
    prince:
      display_name: 王子
      tts:
        delivery: 高贵坦诚，重获自由后满怀感激
        timbre: 饱满清朗
        pace: 舒缓
        pitch: 中低
  chapters:
    - id: ch01
      title: 陌生人的四间屋子
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 从前有个寡妇，穷得实在过不下去。她独自把儿子养到行过坚信礼，终于有一天，只得告诉孩子，家里再也供不起他的饭了。
        - id: ch01-b02
          speaker: widow
          text: 孩子，你已经长大了。往后得出去找活儿，自己挣饭吃了。
        - id: ch01-b03
          speaker: narrator
          text: 小伙子就这样离开家，走进外面的世界。走了一两天，迎面来了个陌生人，问他要到哪里去。
        - id: ch01-b04
          speaker: lad
          text: 我想到外面碰碰运气，找个能干活儿的地方。
        - id: ch01-b05
          speaker: troll
          text: 那就来替我做事，怎么样？
        - id: ch01-b06
          speaker: lad
          text: 好啊。替你做，替别人做，反正都一样。
        - id: ch01-b07
          speaker: troll
          text: 跟着我，你的日子会很好过。只要陪着我就行，别的什么也不用做。
        - id: ch01-b08
          speaker: narrator
          text: 小伙子便住进了陌生人的屋子。那里顿顿都有肥美的食物，也有上好的饮料，活儿却少得几乎没有。照理说，这样的日子再舒服不过。可有件事很奇怪。小伙子在那里住了那么久，偌大一座屋子里，竟从来没见过另一个活人。
        - id: ch01-b09
          speaker: narrator
          text: 一天，陌生人说自己要离开八天，让小伙子独自看家。不过临走前，他指了指四间屋子。
        - id: ch01-b10
          speaker: troll
          text: 这四扇门，你一扇也不许开。你敢走进去，等我回来，就拿命来偿。
        - id: ch01-b11
          speaker: lad
          text: 放心吧，我绝不会进去。
        - id: ch01-b12
          speaker: narrator
          text: 可陌生人才走了三四天，小伙子就受不了啦。他推开第一扇门，四下看了个遍。屋里只有门上方的一块搁板，上面搁着一根荆棘条。
        - id: ch01-b13
          speaker: lad
          text: 嘿，就为了这么一根破树枝，也不许我看？
        - id: ch01-b14
          speaker: narrator
          text: 第八天，陌生人回到家，第一件事就是盘问那四间屋子。
        - id: ch01-b15
          speaker: troll
          text: 你当然哪一间也没进去，对不对？
        - id: ch01-b16
          speaker: lad
          text: 对，对，我一扇门也没开。
        - id: ch01-b17
          speaker: troll
          text: 是吗？我去看一眼就知道了。
        - id: ch01-b18
          speaker: narrator
          text: 他径直走进第一间屋子，立刻发现小伙子撒了谎。
        - id: ch01-b19
          speaker: troll
          text: 你明明来过这里。现在，你的命归我了。
          emotion: angry
        - id: ch01-b20
          speaker: narrator
          text: 小伙子又是哀求，又是讨饶，好话说了一箩筐，总算没丢性命。不过，陌生人还是结结实实揍了他一顿。奇怪的是，打过也就算了。往后的日子照旧，两个人居然又像从前一样要好。
        - id: ch01-b21
          speaker: narrator
          text: 不久，陌生人又要出门，这次一走十四天。他说，第一间屋子现在随便进，其余三间仍旧不许碰。小伙子忍到第八天，还是走进了第二间屋。那里也只有门上的搁板，上面放着一块大石头和一罐水。
        - id: ch01-b22
          speaker: lad
          text: 这里根本没什么见不得人的东西嘛。
        - id: ch01-b23
          speaker: narrator
          text: 陌生人回来又问他有没有进屋，小伙子照旧否认。可谎话很快被揭穿了。
        - id: ch01-b24
          speaker: troll
          text: 这一次我不会再饶你。你非死不可。
          emotion: angry
        - id: ch01-b25
          speaker: narrator
          text: 小伙子再次拼命求饶，终于又保住了命，可这回，他身上的皮肉能挨多少鞭子，陌生人就打了多少下。等到伤势完全好转，他的日子还是和从前一样轻松。他和陌生人之间也像什么都没发生过，又成了好朋友。
        - id: ch01-b26
          speaker: narrator
          text: 后来，陌生人第三次出门，说要离开三个星期。临走时，他警告小伙子，踏进第三间屋就一定活不成。小伙子熬过十四天，还是悄悄推开了门。屋里只有地板上的一扇活门。活门下面，一口巨大的铜锅正在沸腾，锅底却没有火。
        - id: ch01-b27
          speaker: lad
          text: 我就试试看，这锅里的东西到底烫不烫。
        - id: ch01-b28
          speaker: narrator
          text: 他伸进一根手指，蘸了蘸锅里的汤汁。再抽出来时，瞧啊，整根手指竟镀满了金子。他拼命刮，又用力擦，那层金子就是不掉，只好拿破布紧紧裹住。陌生人回来，一看见那根手指便追问出了什么事。小伙子撒谎说，自己不小心割开了一道很深的口子。可那人伸手扯掉破布，一眼就看穿了真相。他本想立刻杀人，小伙子哭求不止，才改成一顿毒打。小伙子被打得整整卧床三天。后来，陌生人从墙上取下一只药罐，拿里面的东西在他身上一抹。他转眼便恢复得完好如初，身上再也没有一点伤。
    - id: ch02
      title: 黑马与逃亡
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 再后来，陌生人要出门整整一个月。他临走时说，第四间屋绝不能进，进去就别想活命。小伙子忍了两三个星期，最后还是溜了进去。
        - id: ch02-b02
          speaker: narrator
          text: 屋里有一匹高大的黑马，独自拴在马厩中。它面前的食槽装满了烧红的煤，尾巴后面倒放着一捆干草。小伙子觉得完全弄反了，便挪开煤，把草放到黑马面前。
        - id: ch02-b03
          speaker: horse
          text: 你肯给我吃的，可见心肠不坏，我一定救你出去。巨怪要是回来撞见你，你马上就会没命。
        - id: ch02-b04
          speaker: horse
          text: 到楼上这间屋子的正上方去。那里挂着许多铠甲。别碰那些亮闪闪的，只拿最锈的一副。剑和马鞍也一样，全都挑最破旧的。
        - id: ch02-b05
          speaker: narrator
          text: 小伙子走到楼上，果真挑了最锈的铠甲、最锈的剑和最破的马鞍。他把这些东西一股脑儿搬下楼，沉重的分量压得他够呛。回来以后，黑马又叫他脱去衣服，到第三间屋里去，跳进那口不停沸腾的铜锅，好好洗个澡。
        - id: ch02-b06
          speaker: lad
          text: 真跳进去，我出来以后恐怕要难看得吓死人。
        - id: ch02-b07
          speaker: narrator
          text: 嘴上这么说，他还是照办了。洗完这个澡，小伙子变得英俊光洁，皮肤像牛奶和鲜血一样红白分明，力气也比从前大了许多。
        - id: ch02-b08
          speaker: horse
          text: 感觉和以前不一样了吗？
        - id: ch02-b09
          speaker: lad
          text: 是不一样了。
        - id: ch02-b10
          speaker: horse
          text: 那就试试把我举起来。
        - id: ch02-b11
          speaker: narrator
          text: 小伙子果真轻松举起了黑马，挥起那把剑也像挥动羽毛一样轻巧。
        - id: ch02-b12
          speaker: horse
          text: 给我套上马鞍，你自己穿好铠甲。再拿上荆棘条、石头、水罐和药罐。东西齐了，我们立刻逃走。
        - id: ch02-b13
          speaker: narrator
          text: 小伙子翻身上马，他们疾驰而去，快得连路是怎么走的都说不清。跑了一阵，黑马听见身后有动静，让小伙子回头看。
        - id: ch02-b14
          speaker: lad
          text: 后面追来一大群人，少说也有二十个。
        - id: ch02-b15
          speaker: horse
          text: 没错，是巨怪带着手下追来了。
        - id: ch02-b16
          speaker: narrator
          text: 追兵越赶越近，眼看就要追上他们。
        - id: ch02-b17
          speaker: horse
          text: 把荆棘条越过肩头，扔到我们身后。一定扔远些，别落在我背上。
        - id: ch02-b18
          speaker: narrator
          text: 荆棘条一落地，身后猛然长起一片浓密的荆棘林，枝条交错得连一点缝隙也没有。小伙子和黑马一路向前，跑了很久很久。巨怪一伙却只好掉头回家，找来砍伐的工具，再一点点劈开荆棘，才能继续追赶。过了很久，黑马又叫小伙子回头。
        - id: ch02-b19
          speaker: lad
          text: 他们又来了！人数多得能挤满一座大教堂。
        - id: ch02-b20
          speaker: horse
          text: 巨怪找来了更多帮手。快把石头远远扔到我后面。
        - id: ch02-b21
          speaker: narrator
          text: 石头刚一落下，一座黑压压的岩石大山便从地上拔起，把道路堵得严严实实。巨怪只得再次折返回家，找来能够开山凿石的工具。趁他们在岩石间挖路，小伙子和黑马已经向前跑出很远。可黑马再叫他回头时，后面的追兵已经像整支军队一样多。他们在阳光下闪闪发亮，仍旧紧追不舍。
        - id: ch02-b22
          speaker: horse
          text: 这次巨怪把所有手下都带来了。把水罐扔出去，小心，一滴也别溅到我身上。
        - id: ch02-b23
          speaker: narrator
          text: 小伙子已经万分小心，仍有一滴水落在黑马腰侧。身后霎时铺开一片又大又深的湖。就因为溅中了那一滴水，黑马发现自己落在了远离岸边的湖心。它奋力向前游，最后还是平安踏上了陆地。巨怪们来到湖边，竟一个个趴下来喝水，想把整座湖都吞进肚子。他们不停地喝啊喝，直到肚皮再也盛不下，最后全都胀破了。
        - id: ch02-b24
          speaker: horse
          text: 好了，他们再也追不上来了。
    - id: ch03
      title: 苔藓假发下的秘密
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 走了很久，他们来到林中一块绿地。黑马指着一棵巨大的空心椴树，让小伙子把铠甲兵器和它的鞍辔全藏进去，再穿回破衣服。
        - id: ch03-b02
          speaker: horse
          text: 用冷杉苔藓给自己做顶假发，然后到附近的王宫求份差事。以后需要我，就回来摇一摇缰绳，我会立刻赶来。
        - id: ch03-b03
          speaker: narrator
          text: 小伙子一一照做。苔藓假发才戴上，他就变得又丑又苍白，看起来可怜极了，谁也认不出原来的模样。他先到王宫厨房，想替厨子搬柴挑水。厨房女仆一看见他便皱起眉头。
        - id: ch03-b04
          speaker: kitchen_maid
          text: 你戴着这么难看的假发做什么？快摘掉！厨房里可不能留着这样吓人的家伙。
          emotion: disgusted
        - id: ch03-b05
          speaker: lad
          text: 不能摘。我的脑袋有些毛病，必须戴着它。
        - id: ch03-b06
          speaker: cook
          text: 脑袋有毛病，还想挨着食物做事？去找马车夫吧，你只配打扫马厩。
          emotion: angry
        - id: ch03-b07
          speaker: narrator
          text: 马车夫也逼他摘假发，听到同样的回答，便把他推给了园丁。
        - id: ch03-b08
          speaker: coachman
          text: 到园子里挖土去吧，那才是适合你的活儿。
        - id: ch03-b09
          speaker: narrator
          text: 园丁总算收留了他。可是其他仆人都不愿跟他睡在一间屋里，他只得独自住到凉亭的台阶底下。那座凉亭架在高高的梁柱上，通往门口的楼梯也很高。小伙子在楼梯下面找来几块草皮，给自己铺成一张床，就在那里勉强过夜。
        - id: ch03-b10
          speaker: narrator
          text: 过了一阵，一天太阳刚升起，小伙子摘下苔藓假发，站在那里洗脸。假发下面的他漂亮极了。公主从窗口看见，觉得世上再没有比他更英俊的人。她问园丁，他为什么睡在台阶下面。
        - id: ch03-b11
          speaker: gardener
          text: 因为别的仆人都嫌弃他，谁也不愿意跟他睡一屋。
        - id: ch03-b12
          speaker: princess
          text: 今晚叫他上楼，睡在我卧房里面的门边。这样过一夜，别人以后就不会再排斥他了。
        - id: ch03-b13
          speaker: narrator
          text: 园丁把公主的话传给小伙子，他一听就不肯答应。
        - id: ch03-b14
          speaker: lad
          text: 我怎么能睡进公主的卧房？人们马上就会说，我和她之间有私情。
        - id: ch03-b15
          speaker: gardener
          text: 是啊，你长得这么英俊，确实该害怕别人这样说。
        - id: ch03-b16
          speaker: lad
          text: 好吧。既然公主一定要我去，那我只好去了。
        - id: ch03-b17
          speaker: narrator
          text: 当天晚上，小伙子沿着高高的台阶上楼。他一路跺脚，把每一级台阶都踩得咚咚作响。旁人连忙求他放轻些，千万别让国王听见。他终于进了公主的卧房，在门里面躺下来，才合上眼睛，立刻就响起了呼噜声。
        - id: ch03-b18
          speaker: princess
          text: 你轻轻走过去，把他头上的假发拿下来。
        - id: ch03-b19
          speaker: narrator
          text: 侍女蹑手蹑脚走过去，手才碰到假发，小伙子便伸出双手死死护住，说什么也不肯给她。接着，他重新躺好，又打起了呼噜。公主悄悄朝侍女使了个眼色。侍女第二次走近，猛地一扯，终于把苔藓假发拿走了。躺在那里的小伙子英俊极了，脸庞红白相映，正是公主在清晨阳光下见过的模样。
        - id: ch03-b20
          speaker: narrator
          text: 从此，小伙子每晚都睡在公主卧房里。消息很快传到国王耳中。国王气得差点杀掉小伙子，最后将他投入囚塔，又把女儿锁在房中，日夜不准出门。公主无论怎么为两个人哀求，都只能叫父亲更加愤怒。
    - id: ch04
      title: 没有人认识的勇士
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 后来，另一个国王要来夺取这片王国，国内爆发了战争。国王不得不带兵迎敌。囚塔里的小伙子听见消息，托狱卒替他求一副铠甲、一把剑，也准他上战场。
        - id: ch04-b02
          speaker: narrator
          text: 狱卒把话传到以后，在场的人全都笑了。他们怂恿国王给小伙子一套穿坏的旧铠甲，好让大家看看，这样一个可怜虫到了战场上会闹出什么笑话。国王果真答应了。小伙子不但拿到一套破铠甲，还分到一匹衰老残废的驽马。那匹马只有三条腿能走，第四条软绵绵地拖在地上。
        - id: ch04-b03
          speaker: narrator
          text: 大军才离开王宫不远，小伙子和驽马便陷在泥沼里。他一边用马刺催马，一边不停地叫喊。
        - id: ch04-b04
          speaker: lad
          text: 驾！快走啊，驾！
        - id: ch04-b05
          speaker: narrator
          text: 国王的手下一个个从他身旁骑过，看见他这副狼狈相，全都放声大笑，还不停拿他取乐。等最后一个人也走远，小伙子立刻离开驽马，奔到空心椴树下。他换上那副锈迹斑斑的真正铠甲，拿好宝剑，再摇一摇缰绳。黑马转眼便赶到了。
        - id: ch04-b06
          speaker: horse
          text: 你拿出全部本领，我也使出全部力气。
        - id: ch04-b07
          speaker: narrator
          text: 等他们来到战场，两军已经打了起来，国王眼看就要落败。小伙子一头冲进敌军最密集的地方，立刻把对方打得节节后退，最后四散逃跑。国王和部下怎么也猜不出这位援军是谁。他们无法靠近跟他说话，战斗一结束，他就不见了。
        - id: ch04-b08
          speaker: narrator
          text: 众人回去时，又看见小伙子坐在泥沼里，对着三条腿的驽马乱扎马刺。
        - id: ch04-b09
          speakers: [king_man_1, king_man_2]
          ensemble: duo
          text: 快瞧啊，那个傻瓜居然还困在那里！
        - id: ch04-b10
          speaker: narrator
          text: 第二天，大军出征时，小伙子还坐在泥沼中，仍在催那匹走不动的驽马。大家又拿他取笑，一路笑着骑了过去。等四周没人，他便再次跑到椴树旁，换上铠甲，召来黑马，赶赴战场。战况和第一天一样。神秘勇士再次救了国王，可没有一个人能靠近他说句话。当然也没有谁想到，那位勇士正是他们刚刚取笑的小伙子。
        - id: ch04-b11
          speaker: narrator
          text: 当晚回宫时，众人见小伙子仍坐在那匹驽马上，又一次哄然大笑。一个人为了寻开心，甚至搭弓朝他射了一箭，正中他的腿。小伙子痛得放声哭叫，听起来实在叫人心碎。国王见了，便从身上取出自己的手帕，朝小伙子扔过去，让他先把伤口包扎起来。
        - id: ch04-b12
          speaker: narrator
          text: 第三天，众人再度出征，他依然坐在那匹驽马上。
        - id: ch04-b13
          speaker: lad
          text: 驾！你倒是快走啊！
        - id: ch04-b14
          speakers: [king_man_1, king_man_2]
          ensemble: duo
          text: 随他去吧！他大概非在那里饿死不可！
        - id: ch04-b15
          speaker: narrator
          text: 他们笑得几乎从马背上摔下来。人一走远，小伙子又奔向椴树。这一次，他恰好在最危急的时刻冲进战场，还亲手杀死敌国国王。敌军失去国王，战争立刻结束了。
        - id: ch04-b16
          speaker: narrator
          text: 战斗过后，国王发现神秘勇士腿上缠着自己的手帕，马上认出了他。众人兴高采烈地簇拥着小伙子回宫。公主从窗口望见，欢喜得简直无法形容。
        - id: ch04-b17
          speaker: princess
          text: 是他！我的真心爱人回来了！
          emotion: happy
        - id: ch04-b18
          speaker: narrator
          text: 小伙子拿出从巨怪屋里带走的药罐，把药膏抹在自己受伤的腿上，箭伤立刻消失了。随后，他又走到每一名伤兵身边，逐个替他们擦药。只是一转眼，所有伤口都愈合了，人人又恢复了健康。
    - id: ch05
      title: 黑马的真身
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 小伙子终于娶了公主，还得到半壁江山，成了年轻的国王。婚礼那天，他来到马厩看望黑马，却见老朋友低垂双耳，神情沉重，连面前的谷物也不肯吃。他连忙问黑马出了什么事。
        - id: ch05-b02
          speaker: horse
          text: 我已经帮你走到了今天。现在，我不愿再活下去了。拔出剑，砍下我的头吧。
        - id: ch05-b03
          speaker: lad
          text: 不，我绝不会杀你。你想要什么，我都可以给你。以后你只管安安稳稳地休息。
        - id: ch05-b04
          speaker: horse
          text: 你若不肯照办，我总能想出办法取你的性命。到时候可别怪我。
        - id: ch05-b05
          speaker: narrator
          text: 年轻的国王没有别的办法，只得举起宝剑。他心里难过，不忍看见剑锋落下，便把脸转到一旁。黑马的头才落地，原来站着黑马的地方，竟出现了一位无比英俊的王子。
        - id: ch05-b06
          speaker: lad
          text: 你究竟从哪里来的？
          emotion: surprised
        - id: ch05-b07
          speaker: prince
          text: 我就是刚才那匹黑马。其实，我是你昨天杀死的那个国王所统治的国家的国王。是他给我套上巨怪的外形，又把我卖给了那个巨怪。如今他死了，我终于能收回自己的国家。以后你我各自为王，两国相邻，但永远不会彼此开战。
        - id: ch05-b08
          speaker: narrator
          text: 后来的日子里，他们果然从未彼此开战，也没有让战火烧到对方的国土。从那以后，两国一直相安无事。两位国王一生都是朋友，还常常越过两国的边界，到对方的王国去做客。
