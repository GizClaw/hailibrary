  chapters:
    - id: ch01
      title: The Twelve Lost Princesses
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Once upon a time, a king had twelve daughters whom he loved so dearly that he always kept them near him. Each day at noon, though, the king took a nap while the Princesses went walking. One day they went out as usual, but they never came home.
        - id: ch01-b02
          speaker: narrator
          text: Grief spread across the whole land, and the king grieved most of all. He sent messengers through his own realm and every realm nearby. Their names were called in every church, and bells rang for them from every steeple. Still, no one could say where they had gone. It seemed certain that witchcraft had carried them away.
        - id: ch01-b03
          speaker: narrator
          text: The news traveled over towns, across the countryside, and through many lands. At last it reached a faraway king who had twelve sons. When the Princes heard what had happened, they begged their father to let them search for the missing Princesses. He feared he might lose his sons too, but they knelt before him and pleaded until he gave his consent.
        - id: ch01-b04
          speaker: narrator
          text: Their father prepared a ship and made Ritter Red its captain, for Ritter Red knew the sea well. The Princes sailed for years, stopping at every shore they reached. Everywhere they hunted for the Princesses and asked whether anyone had seen them. No matter how far they traveled, they could neither see nor hear a trace of the missing sisters.
        - id: ch01-b05
          speaker: narrator
          text: Only a few days remained before seven full years had passed when a violent storm struck. The weather grew so foul that they feared they would never reach land again. For nearly three days, everyone worked to save the ship, and no one got a wink of sleep. Near the end of the third day, the wind suddenly dropped. The sea became perfectly still, and the exhausted men fell asleep in an instant. Only the youngest Prince could find no rest.
        - id: ch01-b06
          speaker: narrator
          text: As he paced the deck, the ship drifted close to a little island. A small dog ran along the shore, barking toward the ship as if it wanted to come aboard. The Prince whistled and tried to coax it closer, but the dog only barked and snarled more fiercely.
        - id: ch01-b07
          speaker: narrator
          text: The Prince thought the poor creature must have come from a ship wrecked in the storm. It seemed a shame to leave the dog there to starve. He did not think he could lower the boat alone, and he would not wake men who slept so soundly merely for a dog. Yet the weather stayed calm and still. At last he made up his mind.
        - id: ch01-b08
          speaker: youngest_prince
          text: Whatever happens, I must go ashore and save that dog.
        - id: ch01-b09
          speaker: narrator
          text: To his surprise, the boat was easy to launch. He rowed to the island and approached the dog, but whenever he reached for it, it sprang aside. He followed until, before he knew it, he stood inside a magnificent castle. At once the dog changed into a lovely Princess. Beside her sat a man so huge and ugly that the Prince nearly lost his senses with fear.
        - id: ch01-b10
          speaker: troll_prince
          text: You do not need to fear me. I know why you are here. You and your eleven brothers are searching for the twelve lost Princesses, and I know where they are. My lord and master holds them. He has twelve heads, and each Princess sits in her own chair, combing one head. You have sailed for seven years, and you must sail for seven more before you reach them. You are welcome to stay here and marry my daughter, but first you must kill my master. He is cruel to every one of us, and we are all weary of him. When he is dead, I shall rule in his place. First, though, see if you can swing this sword.
        - id: ch01-b11
          speaker: narrator
          text: A rusty old sword hung on the wall. The Prince took hold of it, but he could barely move it.
        - id: ch01-b12
          speaker: troll_prince
          text: Take a drink from this flask.
        - id: ch01-b13
          speaker: narrator
          text: After one drink, the Prince could move the sword. After a second, he could lift it. After a third, he swung it as easily as if it had always belonged to him.
        - id: ch01-b14
          speaker: troll_prince
          text: When you return to the ship, hide the sword well inside your berth. Do not let Ritter Red catch sight of it. He is not strong enough to wield it, but envy will make him turn against you and try to take your life. When the next seven years have only three days left, everything will happen again. Another great storm will come, and when it is over, everyone else will grow sleepy. Then take the sword and row ashore.
        - id: ch01-b15
          speaker: troll_prince
          text: All kinds of guards will stand outside the castle. There will be wolves, bears, and lions, but do not fear them. Every one of them will come and crouch at your feet. Inside, you will find my master asleep in a splendid room, dressed in all his finest clothes. The twelve Princesses will be sitting around him in their chairs, combing his twelve heads. You can guess how little they like that work. Signal them to move away, then cut off the heads one after another as quickly as you can. If he wakes and sets his eyes on you, he will swallow you alive.
    - id: ch02
      title: The Twelve-Headed Troll
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: The youngest Prince carried the sword back to the ship, remembering every warning. His companions still slept and snored, so he hid the sword in his berth before anyone saw it. When the wind began to rise again, he woke them and said they should not waste such a fine breeze. No one guessed he had ever left the ship.
        - id: ch02-b02
          speaker: narrator
          text: Seven more years passed, all but three days. Just as the Troll Prince had foretold, a terrible storm and foul weather blew for those final three days. When the storm had spent itself, everyone except the youngest Prince grew sleepy and went to rest. He took the hidden sword, rowed to shore, and walked toward the castle. The wolves, bears, and lions offered no harm. Every guard fell at his feet.
        - id: ch02-b03
          speaker: narrator
          text: In the castle chamber, the twelve-headed Troll King slept. Around him sat the twelve Princesses, each combing one of his heads. The Prince motioned for them to move away. They pointed at the Troll and urgently waved him back, but he kept signaling that they must leave. Then they understood that he had come to free them.
        - id: ch02-b04
          speaker: narrator
          text: One by one, the Princesses stole softly out of the way. As quickly as each one moved clear, the Prince struck off the head she had been combing. He went on until all twelve heads were gone. Then the Troll's blood poured across the floor like a great brook.
        - id: ch02-b05
          speaker: narrator
          text: The Prince returned to the ship and hid the sword again. He could not move the enormous body alone, so he woke the others and demanded their help.
        - id: ch02-b06
          speaker: youngest_prince
          text: You should be ashamed to lie here snoring. I found the Princesses and freed them from the Troll.
        - id: ch02-b07
          speaker: narrator
          text: His brothers only laughed. They said he had slept as soundly as they had and dreamed the whole adventure. If anyone was brave enough to rescue the Princesses, they claimed, it would surely be one of them. But the youngest Prince told them everything that had happened.
        - id: ch02-b08
          speaker: narrator
          text: They followed him ashore. First they saw the brook of blood, then the castle, the dead Troll with his twelve severed heads, and at last the Princesses themselves. The sight made it plain that the youngest Prince had spoken the truth. With everyone helping, they carried the huge body and all the heads away and threw them into the sea.
        - id: ch02-b09
          speaker: narrator
          text: Everyone rejoiced, and no one more than the Princesses. They were free from sitting there all day, combing the Troll's hair. The castle held silver, gold, and all kinds of precious things, so the company loaded the ship with as much treasure as it could carry. Then all twelve Princes and all twelve Princesses went aboard and sailed away together.
        - id: ch02-b10
          speaker: narrator
          text: Once they were out at sea, the Princesses remembered that their gold crowns were still in a chest at the castle. They longed to have them back, but no one wished to return. At last the youngest Prince offered to go.
        - id: ch02-b11
          speaker: youngest_prince
          text: I have faced enough danger already that I can face this too. Lower the sail and wait here while I fetch the crowns.
        - id: ch02-b12
          speaker: narrator
          text: They promised they would wait. But as soon as the Prince had rowed beyond their sight, Ritter Red spoke. He wanted to command the company and marry the youngest Princess himself.
        - id: ch02-b13
          speaker: ritter_red
          text: There is no sense in waiting. You know he will never return. The king placed this voyage under my command, and now you will all say that I rescued the Princesses. Anyone who tells a different tale will die.
        - id: ch02-b14
          speaker: narrator
          text: The Princes knew Ritter Red meant his threat. None dared oppose his command, so they raised the sail and left their youngest brother behind.
    - id: ch03
      title: Big Bird Dan
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: Meanwhile, the youngest Prince returned to the castle and found the chest holding all twelve gold crowns. It was heavy, but at last he dragged it down to his boat and pushed away from shore. When he reached the place where the ship should have been, the sea was empty. He searched the horizon, but there was not a sail in sight. He soon understood what had happened. There was no hope of catching the ship in a rowboat, so he turned back toward the island.
        - id: ch03-b02
          speaker: narrator
          text: He feared spending the night alone in the castle, but there was no other house on the island. He gathered his courage, locked every door and gate, then lay down in a room where a bed had been prepared. He felt both miserable and afraid. After he had been there a while, the walls and roof began to creak, groan, and shake as if the whole castle were being torn apart.
        - id: ch03-b03
          speaker: narrator
          text: All at once, something crashed down close beside his bed with the weight of a whole cartload of hay. Then everything went still again. After a while, a voice spoke in the darkness and told him not to be afraid.
        - id: ch03-b04
          speaker: bird_dan
          text: Here am I, the Big Bird Dan, come to help you all I can. When morning comes, bring me four barrels of rye from the barn. I must fill my crop at breakfast, or I can do nothing for you.
          emotion: calm
        - id: ch03-b05
          speaker: narrator
          text: When morning came, the Prince saw that the creature beside him was an enormous bird. One feather at the back of its neck was as thick and long as a half-grown spruce tree. Remembering the night's command, he went down to the barn and brought back four full barrels of rye. Big Bird Dan swallowed every grain until his great crop was filled.
        - id: ch03-b06
          speaker: bird_dan
          text: Hang the chest of crowns on one side of my neck. Put enough gold and silver on the other side to balance it. Then climb onto my back and hold tightly to the feather at my neck.
        - id: ch03-b07
          speaker: narrator
          text: Away they flew, so fast that the wind whistled behind them. Before long, they caught up with the ship and passed it. The Prince wanted to go aboard and recover the sword hidden in his berth. He feared someone might discover it, for the Troll Prince had warned him that no one must see it. Big Bird Dan would not allow him to go near the ship.
        - id: ch03-b08
          speaker: bird_dan
          text: Ritter Red will never find the sword. If you board that ship, he will try to kill you, because he means to marry the youngest Princess. Do not worry about her. Every night she sleeps with a naked sword beside her.
        - id: ch03-b09
          speaker: narrator
          text: After a long, long flight, they reached the island where the Troll Prince lived. The welcome there could not have been warmer. The Troll Prince scarcely knew how to reward the man who had killed his cruel lord and master. He gave him royal honor among the Trolls. If the youngest Prince had wished it, he could easily have married the Troll's daughter and received half the kingdom as well.
        - id: ch03-b10
          speaker: narrator
          text: But the Prince had set his heart on the youngest of the twelve Princesses. He could find no peace, and again and again he begged to chase after her ship. The Troll King urged him to wait a little longer. The ship still had nearly seven years of sailing ahead before it could reach home.
        - id: ch03-b11
          speaker: troll_prince
          text: You need not fear for the youngest Princess. She sleeps with a naked sword beside her every night. If you doubt me, board the ship when it passes our island. You can see for yourself and bring back the sword too. I may as well have it again.
        - id: ch03-b12
          speaker: narrator
          text: When the ship finally came by, another great storm rose. The Prince went aboard while everyone slept. Each Princess lay beside her Prince except the youngest, who lay alone with a naked sword by her side. Ritter Red slept on the floor beside her bed. The Prince took his hidden sword and rowed ashore without being seen.
    - id: ch04
      title: The Iron Boat
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: Still the Prince could not rest. He kept asking to leave. At last, with only three weeks remaining before the seven years ended, the Troll King agreed.
        - id: ch04-b02
          speaker: troll_prince
          text: Since you will not stay with us, prepare to go. I will lend you my iron boat. It sails by itself when you say, "Boat, boat, go on!"
        - id: ch04-b03
          speaker: troll_prince
          text: You will find an iron club inside. When the ship appears ahead, lift the club a little. A strong fair wind will keep everyone too busy to notice you. Lift it again when you draw alongside, and a storm will give them even more to do. Once you pass them, lift it a third time. Each time, set it down carefully, or the storm will wreck both vessels.
        - id: ch04-b04
          speaker: troll_prince
          text: When you reach land, unload the boat, turn it around, and push it off. Then say, "Boat, boat, go back home!"
        - id: ch04-b05
          speaker: narrator
          text: Before he left, the Trolls gave the Prince gold, silver, and many other costly things. They also packed the clothes and linen that the Troll Princess had spent all those long years sewing and weaving for him. By the time everything was aboard, he was far richer than any of his brothers.
        - id: ch04-b06
          speaker: youngest_prince
          text: Boat, boat, go on!
        - id: ch04-b07
          speaker: narrator
          text: The iron boat shot away at once. When the Prince saw the ship straight ahead, he raised the club a little, and a powerful fair wind sprang up behind it. Everyone aboard became so busy with the sudden speed that they forgot to look around. As the iron boat drew alongside, he raised the club again. A wild storm broke over the ship. White foam flew around it, and great waves rolled across the deck. The sailors had all they could do to keep the vessel safe.
        - id: ch04-b08
          speaker: narrator
          text: After he passed the ship, the Prince lifted the club a third time. The wind and storm grew fiercer still, leaving no one a moment to study the little iron boat. The Prince reached land long before the ship did. He unloaded all his goods, turned the boat around, and pushed it away.
        - id: ch04-b09
          speaker: youngest_prince
          text: Boat, boat, go back home!
        - id: ch04-b10
          speaker: narrator
          text: The boat sped off toward the Troll King's island.
        - id: ch04-b11
          speaker: narrator
          text: The Prince dressed himself as a sailor. Perhaps the Troll King had advised him, or perhaps the idea was his own. No one can say. He went to a miserable little hut where an old woman lived. There he told her that he had sailed aboard a great ship until it was wrecked in the storm. He claimed that he was the only soul who had reached shore, then asked for shelter for himself and a place to store the goods he had saved.
        - id: ch04-b12
          speaker: old_woman
          text: Mercy on me! How could I give anyone a room? Just look at this place. I do not even own a bed for myself, much less one for a guest.
          emotion: surprised
        - id: ch04-b13
          speaker: narrator
          text: The sailor said he needed only a roof and did not care where he slept. He was so grateful for the little she had that the old woman could not turn him away. That afternoon he brought his belongings to the hut.
        - id: ch04-b14
          speaker: narrator
          text: The old woman was always eager for a scrap of news she could carry around the neighborhood. At once she asked who he was, where he had come from, where he was going, what he carried, and what business had brought him there. Most of all, she wanted to know whether he had heard anything about the twelve Princesses who had vanished more years ago than anyone could count. Her questions seemed endless.
        - id: ch04-b15
          speaker: youngest_prince
          text: That dreadful weather has left me ill, and my head aches too badly to answer. Let me rest for a few days after all my work in the storm. When I recover, you may hear whatever you wish to know.
    - id: ch05
      title: News from a Shipwrecked Sailor
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: The very next day, the old woman started questioning him again. The sailor still complained that his head ached and his thoughts were muddled. Even so, he let slip just enough to show that he knew something about the Princesses.
        - id: ch05-b02
          speaker: narrator
          text: The old woman rushed off to tell every gossip and chatterbox nearby. Soon one visitor after another came running to the hut. Had he seen the Princesses? Were they already on their way? How soon would they arrive? The questions went on and on. The sailor kept groaning over his aching head after the storm, as though he could barely gather enough strength to speak.
        - id: ch05-b03
          speaker: youngest_prince
          text: If the great storm did not sink them, they should reach this shore within a fortnight, perhaps sooner. I cannot promise they are still alive. I saw them before the storm, and their ship may have gone down since then.
        - id: ch05-b04
          speaker: narrator
          text: One of the old gossips ran straight to the palace with the story. She reported that a sailor in the old woman's hut had seen the Princesses and expected them home within a fortnight, perhaps even a week. When the king heard that, he immediately sent a messenger. The sailor must come to the palace and tell the news himself.
        - id: ch05-b05
          speaker: youngest_prince
          text: I do not see how I can go. I have nothing fit to wear before a king.
        - id: ch05-b06
          speaker: narrator
          text: But the king insisted that the man must come. Rich clothes or poor ones made no difference when this sailor alone could bring news of his daughters. So the disguised Prince went to the palace at last and stood before the king. The king asked him directly whether it was true that he had seen anything of the Princesses.
        - id: ch05-b07
          speaker: youngest_prince
          text: Aye, I have certainly seen them, but I cannot tell you whether they still live. The weather was so terrible when I last saw them that my own ship was wrecked. If they survived, they should be safely home within a fortnight, perhaps sooner.
        - id: ch05-b08
          speaker: narrator
          text: The king nearly lost his senses for joy. When the time named by the sailor drew near, he rode down to the shore in great state and waited to meet his daughters. At last the ship appeared and sailed into harbor, carrying the twelve Princes, the twelve Princesses, and Ritter Red.
        - id: ch05-b09
          speaker: narrator
          text: Gladness swept over the whole land as the ship came into harbor. No one rejoiced more than the old king, who had his daughters back at last. The eleven elder Princesses were merry too. But the youngest Princess wept and remained sorrowful. She was expected to marry Ritter Red because he claimed that he had freed all twelve sisters and killed the Troll.
        - id: ch05-b10
          speaker: princesses_king
          text: Why are you not happy like your sisters? You are free from the Troll, and Ritter Red will be your husband. What reason can you have to grieve now?
        - id: ch05-b11
          speaker: narrator
          text: The youngest Princess dared not answer her father. Ritter Red had threatened to take the life of anyone who told the truth about how the rescue had really happened.
    - id: ch06
      title: The Gold Crowns
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: One day, while the Princesses were busy sewing and stitching their wedding clothes, a man entered in a great sailor's cloak with a peddler's pack on his back. He asked whether they wished to buy something fine for the wedding. When he opened the pack, they saw many costly wares made of gold and silver.
        - id: ch06-b02
          speaker: narrator
          text: The Princesses gathered around to examine the wares one after another, then they studied the peddler himself. They could not shake the feeling that they had seen both the man and many of his costly treasures before.
        - id: ch06-b03
          speaker: youngest_princess
          text: A man with so many beautiful things must own something even more precious, something that would suit us better than these.
        - id: ch06-b04
          speaker: youngest_prince
          text: Perhaps I do.
        - id: ch06-b05
          speakers: [eldest_princess, second_princess, third_princess]
          ensemble: chorus
          text: Hush! Remember what Ritter Red promised he would do!
          emotion: fearful
        - id: ch06-b06
          speaker: narrator
          text: Some time later, the Princesses sat together looking out the window. The King's son returned, wrapped in the same great sea cloak and carrying the heavy chest of gold crowns on his back. He brought it into the palace hall and unlocked it before them. The moment the lid rose, each Princess knew her own crown again.
        - id: ch06-b07
          speaker: youngest_princess
          text: The man who freed us should receive the reward he deserves. Ritter Red did not save us. This man brought back our gold crowns, and he is the one who set us free.
        - id: ch06-b08
          speaker: narrator
          text: The Prince threw off the sailor's cloak. There he stood in the costly clothes the Troll Princess had made, finer and grander than anyone else in the hall. With the crowns before him and his youngest daughter speaking at last, the old king ordered Ritter Red put to death.
        - id: ch06-b09
          speaker: narrator
          text: Then true joy filled the palace at last. Each Prince took his own bride, and such a wedding followed that the celebration was heard of and talked about throughout twelve kings' realms.
