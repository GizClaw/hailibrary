audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 从容而清醒，带一点克制的诙谐
        timbre: 温厚清晰
        pace: 舒缓有致
        pitch: 中低
    youngest_prince:
      display_name: 小王子
      tts:
        delivery: 勇敢坦率，年轻而坚定
        timbre: 清朗坚实
        pace: 中等
        pitch: 中
    troll_prince:
      display_name: 山怪王子
      tts:
        delivery: 粗声直言，沉稳而有分量
        timbre: 低沉粗粝
        pace: 舒缓
        pitch: 低
    ritter_red:
      display_name: 红骑士
      tts:
        delivery: 强横阴险，命令时冷酷逼人
        timbre: 硬朗阴沉
        pace: 中等
        pitch: 中低
    big_bird_dan:
      display_name: 大鸟丹
      tts:
        delivery: 洪亮爽快，可靠而不慌不忙
        timbre: 宽厚有力
        pace: 中等
        pitch: 低
    old_woman:
      display_name: 老太婆
      tts:
        delivery: 好奇健谈，反应快而絮叨
        timbre: 苍老明亮
        pace: 中等偏快
        pitch: 中高
    old_king:
      display_name: 老国王
      tts:
        delivery: 威严中带着深切的父爱
        timbre: 苍劲厚重
        pace: 舒缓
        pitch: 低
    youngest_princess:
      display_name: 小公主
      tts:
        delivery: 温柔坚定，忧伤时克制，伸张真相时果断
        timbre: 清澈柔和
        pace: 中等
        pitch: 中高
    princess_1:
      display_name: 大公主
      tts:
        delivery: 谨慎急切，声音清楚
        timbre: 成熟柔和
        pace: 中等
        pitch: 中
    princess_2:
      display_name: 二公主
      tts:
        delivery: 紧张克制，言语简短
        timbre: 清亮
        pace: 中等偏快
        pitch: 中高
    princess_3:
      display_name: 三公主
      tts:
        delivery: 小心警觉，语气轻而急
        timbre: 柔和明净
        pace: 中等偏快
        pitch: 中
  chapters:
    - id: ch01
      title: 十二位失踪的公主
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 从前有位国王，膝下有十二个女儿。他疼爱她们，恨不得时时刻刻都让她们守在身边。可每天正午，国王睡午觉时，公主们总会出去散步。有一天，她们出门以后忽然全都不见了，再也没有回来。举国上下都沉浸在悲伤里，最伤心的当然是国王。
        - id: ch01-b02
          speaker: narrator
          text: 国王派出一批又一批使者，让他们走遍本国和周围的王国。他命人在所有教堂里宣告女儿们的名字，还让每一座钟楼都为她们鸣钟。可公主们像是从世上消失了，再也没有回来。没有一个人知道她们遭遇了什么。事情看来再明白不过，她们一定是被什么妖术掳走了。
        - id: ch01-b03
          speaker: narrator
          text: 消息越过乡野和城镇，传到许多国家之外。远方另一位国王恰好有十二个儿子。王子们听说那十二位公主失踪了，都请求父王准他们一同出门寻找。国王怕儿子们也从此一去不回，起初怎么也不肯答应。十二个王子便一齐跪在他面前，苦苦央求了很久。父王最后实在拗不过他们，只得放行。
        - id: ch01-b04
          speaker: narrator
          text: 国王为儿子们备好一艘船，又派熟悉海上事务的红骑士担任船长。他们航行了很久很久。每到一处海岸，王子们便登岸寻找，到处询问失踪公主的下落，可他们什么也没听见，什么也没找到。离出航整整七年只差几天时，海上忽然刮起猛烈的风暴。天气坏得可怕，众人以为自己再也靠不了岸。他们连续三天拼命操船，谁也没能合一下眼。
        - id: ch01-b05
          speaker: narrator
          text: 第三天快结束时，风势终于缓了下来。方才还翻腾不休的海面，一下子静得不能再静。众人被连日的劳作和恶劣天气折腾得筋疲力尽，转眼便沉沉睡去。只有最小的王子怎么也得不到安歇，始终毫无睡意，只好独自在甲板上来回走动。
        - id: ch01-b06
          speaker: narrator
          text: 船慢慢漂到一座小岛旁。岛上跑着一条小狗，冲着船又吠又叫，看起来一心想要上船。小王子走到那一侧甲板，吹口哨唤它，又温声哄它靠近。谁知他越哄，小狗叫得越凶，还冲他龇牙低吼。王子猜它是从一艘在风暴里遇难的船上逃来的，不忍心让它留在荒岛上活活饿死。可他一个人似乎放不下小艇。其他人又睡得太熟，他也不愿只为一条狗把大家叫醒。海面偏偏静极了，他思量再三，终于下定决心。
        - id: ch01-b07
          speaker: youngest_prince
          text: 不管怎样，我一定得上岸救下那条狗。
        - id: ch01-b08
          speaker: narrator
          text: 动起手来，放下小艇竟比他想的容易。王子独自划到岸边，走向那条小狗。可每当他伸手快要捉住它，小狗便敏捷地往旁边一跳。王子追了一次又一次，根本没有留意自己走到了哪里。等他回过神来，已经站在一座宏伟的城堡里。就在这时，小狗忽然变成了美丽的公主。长凳上还坐着一个又高大又丑陋的男人，王子一看见他，吓得几乎丢了魂。
        - id: ch01-b09
          speaker: troll_prince
          text: 你不必害怕。我知道你为何而来。你们十二个王子在寻找失踪的十二位公主。她们落在我主人手里，每人坐在一把椅子上，替他梳理一颗脑袋，因为他一共长着十二颗头。你们已经航行七年，还要再走七年才能找到她们。
        - id: ch01-b10
          speaker: narrator
          text: 那人的嗓音粗哑得可怕。他越说不必害怕，王子反而越怕。
        - id: ch01-b11
          speaker: troll_prince
          text: 你可以留在这里，娶我的女儿。不过你得先杀掉我的主人。他待我们十分残酷，我们早就受够了。他一死，我就接替他做国王。现在先试试，你能不能挥动墙上那把剑。
        - id: ch01-b12
          speaker: narrator
          text: 小王子握住那把锈迹斑斑的旧剑，却连挪动它都十分勉强。
        - id: ch01-b13
          speaker: troll_prince
          text: 喝一口这瓶里的酒。
        - id: ch01-b14
          speaker: narrator
          text: 王子喝下一口，便能挪动剑。第二口下肚，他把剑举了起来。喝完第三口，他挥动那把剑，就像挥自己的佩剑一样轻松。
        - id: ch01-b15
          speaker: troll_prince
          text: 回船以后，把剑藏进铺位，千万别让红骑士看见。他没有挥剑的本领，却会嫉恨你，设法要你的命。等下一个七年只剩三天，今天的事会重演。风暴过去，所有人都会昏昏欲睡。你带剑划到岸边，会看见狼、熊和狮子守着一座城堡。别怕，它们都会伏在你脚下。
        - id: ch01-b16
          speaker: troll_prince
          text: 走进大厅，你会看见我的主人穿着华服，坐在那里熟睡。十二位公主各守着一颗脑袋，替他梳头。你让她们躲开，立刻把十二颗头一颗接一颗砍下来。动作一定要快。他若醒来看见你，就会把你活活吞掉。
    - id: ch02
      title: 十二颗脑袋
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 王子带剑回船，把它藏进铺位。其他人还在呼呼大睡，谁也不知道他离开过。风重新吹起，他便叫醒大家，说这么好的风可不能睡过去。
        - id: ch02-b02
          speaker: narrator
          text: 又过了将近七年，离七年期满只剩三天。一场风暴果然持续了整整三日。等风浪平息，其他人全去歇息，小王子却带剑划向岸边。狼、熊和狮子纷纷伏在他脚下，他顺利走进城堡。
        - id: ch02-b03
          speaker: narrator
          text: 山怪国王正在华美的大厅里熟睡。十二位公主每人坐在一把椅子上，各自替他梳理一颗脑袋。小王子挥手让她们躲开。公主们却指着山怪，拼命示意他快逃。他再三打手势，她们终于明白，这个人是来救自己的。
        - id: ch02-b04
          speaker: narrator
          text: 公主一个接一个，蹑手蹑脚地退到一旁。每让开一位，小王子便赶紧砍掉一颗脑袋，不给山怪醒来的机会。最后一颗头落地，鲜血像一条大溪般奔涌而出。王子这才划回大船，把宝剑重新藏好。他知道自己一个人搬不动山怪的尸身，心想，这回总该让其他人也出一份力了，于是才去叫醒众人。
        - id: ch02-b05
          speaker: youngest_prince
          text: 你们还在这里呼呼大睡！我已经找到十二位公主，还把她们从山怪手里救出来了。快起来帮忙吧。
        - id: ch02-b06
          speaker: narrator
          text: 众人只管嘲笑他，说他睡得和大家一样沉，不过做梦梦见自己成了英雄。要是真有人能救公主，也更可能是他们中的某一个。小王子只得把经过全说出来。
        - id: ch02-b07
          speaker: narrator
          text: 他们跟着小王子登岸。众人先看见鲜血汇成的大溪，接着看见城堡、山怪的尸身、滚落的十二颗脑袋，还有获救的十二位公主。这些证据摆在眼前，他们才知道小王子说的句句是真。于是所有人一齐动手，把尸体和脑袋扔进海里。人人都欢喜快乐，最高兴的自然是公主们，因为她们终于不用整天坐在那里，替山怪一颗又一颗地梳头了。
        - id: ch02-b08
          speaker: narrator
          text: 城堡里堆满金银和贵重物品，众人能拿多少便拿多少，直到整艘船都装满了。随后，十二个王子和十二位公主一同启航。船驶出一段路，公主们才想起，她们刚才太高兴，竟把自己的金冠忘在城堡里了。那些金冠全放在一只大箱子里，她们实在舍不得丢下。可其他人谁也不愿返回那座城堡，只有小王子愿意再跑一趟。
        - id: ch02-b09
          speaker: youngest_prince
          text: 我已经冒过那么大的险，再回去取金冠也不算什么。你们收起船帆，就在这里等我回来。
        - id: ch02-b10
          speaker: narrator
          text: 众人满口答应。等小王子划得看不见了，一心想当首领、又想娶小公主的红骑士便露出了真面目。
        - id: ch02-b11
          speaker: ritter_red
          text: 不必再等，他绝不会回来。国王早已把航行的大权交给我，开船还是停船都由我决定。你们必须说，是我救了公主。谁敢说出真相，我就要他的命。
          emotion: angry
        - id: ch02-b12
          speaker: narrator
          text: 其余王子不敢违抗红骑士，只得扬帆离去。与此同时，小王子已经划回岸边。他走进城堡，找到装着金冠的大箱子，好不容易才把它拖到小艇上，又用力推船离岸。可他划到原先停船的地方，放眼一看，大船竟已无影无踪。他四下寻找，连一点帆影也看不到，很快便明白发生了什么。凭这条小艇不可能追上他们，他只得掉头返回岛上。
    - id: ch03
      title: 大鸟丹
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 小王子害怕独自在城堡过夜，可附近没有别的屋子。他鼓起勇气，锁紧所有门，在一间铺好床的屋子里躺下。过了一会儿，墙壁和屋顶开始咯吱作响，呻吟震颤，仿佛整座城堡正被撕成碎片。他越发惊恐。
        - id: ch03-b02
          speaker: narrator
          text: 忽然，有个东西轰然落在床边，听来像一整车干草从天而降。四周重新安静下来。随后，一个声音叫他不要害怕。
        - id: ch03-b03
          speaker: big_bird_dan
          text: 大鸟丹，大鸟丹，愿把你的难来担。
        - id: ch03-b04
          speaker: big_bird_dan
          text: 明早醒来，你先去谷仓给我搬四桶黑麦。我得把它们全装进嗉囊当早饭，不然什么也做不了。
        - id: ch03-b05
          speaker: narrator
          text: 天亮后，小王子睁开眼睛，果然看见一只大得吓人的鸟。它后颈上生着一根羽毛，粗细和长短都像一棵还没长成的云杉。王子按照吩咐下到谷仓，一趟趟搬来四桶黑麦，又把这些粮食全塞进大鸟丹的嗉囊，给它吃了一顿惊人的早饭。
        - id: ch03-b06
          speaker: big_bird_dan
          text: 把金冠箱挂在我脖子一边，另一边再挂上同样重的金银。然后爬到我背上，牢牢抓住后颈这根羽毛。
        - id: ch03-b07
          speaker: narrator
          text: 小王子爬到大鸟丹背上，双手紧紧抓住那根巨大的羽毛。大鸟腾空而起，飞得疾风在他们身后呼啸。它速度惊人，没过多久便追上并越过了那艘大船。小王子想起自己的宝剑还藏在铺位里。他牢牢记得山怪的警告，担心有人偶然发现，便想登船把剑取回。大鸟丹却不肯让他去。
        - id: ch03-b08
          speaker: big_bird_dan
          text: 放心，红骑士看不见那把剑。你若上船，他倒会想办法杀掉你，因为他铁了心要娶小公主。不过你也不必为她担心。她每天夜里，都把一把出鞘的剑放在身旁。
        - id: ch03-b09
          speaker: narrator
          text: 他们飞了很久很久，终于来到山怪王子居住的岛上。山怪王子热烈地欢迎小王子，怎么亲近、怎么款待都嫌不够。小王子替他杀死了残暴的主人，他实在不知该怎样感谢才好，便立小王子做山怪们的国王。只要小王子愿意，他还能轻而易举地娶山怪公主，得到半个王国。
        - id: ch03-b10
          speaker: narrator
          text: 可他一心牵挂十二位公主中最小的那一位，总想动身追赶。山怪国王劝他耐心等待，因为大船离故乡还有将近七年的航程。
        - id: ch03-b11
          speaker: troll_prince
          text: 小公主每夜都把出鞘的剑放在床边，你不必为她忧心。你若不信，等大船经过这里，亲自上去看一眼，也顺便把那把剑取回来。它也该还给我了。
        - id: ch03-b12
          speaker: narrator
          text: 大船经过时，海上又起了风暴。小王子登船，只见所有人都睡着了。每位公主都躺在自己的王子身边，只有小公主独自睡着，床边放着出鞘的剑。红骑士躺在她床旁的地板上。小王子拿走宝剑，划回岛上，谁也没发现他来过。
    - id: ch04
      title: 自航的铁船
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 小王子还是安不下心，三番五次要求离开。第二个七年快要结束，只剩三个星期时，山怪国王终于答应了。
        - id: ch04-b02
          speaker: troll_prince
          text: 既然你不肯留下，现在就准备出发吧。我把自航的铁船借给你。你坐进去，只要说“小船，小船，向前走”，它便会启程。
        - id: ch04-b03
          speaker: troll_prince
          text: 船里还有一根铁棒。看见大船就在前方时，把它稍稍抬起，那边就会刮起强劲的顺风，船上的人会忙得顾不上你。来到大船旁边，再抬一次，他们便会遇上恶风和风暴。等你超过他们，第三次抬起铁棒。
        - id: ch04-b04
          speaker: troll_prince
          text: 每次抬起以后，一定要把铁棒轻轻放回去。不然风暴会猛烈得让两艘船一同沉没。你上岸以后，把铁船掉转方向，推离岸边，再说“小船，小船，回家去”，不必为它操心。
        - id: ch04-b05
          speaker: narrator
          text: 王子动身时，山怪们送给他许多金银珍宝，还有山怪公主在漫长岁月里为他缝制、织造的衣服和亚麻布。他已经比任何一个哥哥都富有了。
        - id: ch04-b06
          speaker: youngest_prince
          text: 小船，小船，向前走！
        - id: ch04-b07
          speaker: narrator
          text: 铁船立刻飞驰起来。看见大船就在正前方，小王子第一次抬起铁棒。那艘船顿时遇上强劲的顺风，众人忙着让船乘风疾驶，完全忘了向他这边看。铁船来到大船旁边，他再次抬起铁棒。霎时间恶风袭来，风暴骤起。白色的浪沫绕着船身飞舞，滚滚巨浪直冲过甲板。船上的人光顾着对付眼前的险情，哪里还有工夫盯着一艘小铁船。
        - id: ch04-b08
          speaker: narrator
          text: 等铁船超过大船，王子第三次抬起铁棒，又照着叮嘱把它轻轻放回原处。风暴变得更加凶猛，谁也没空留意他，更看不清他的模样。他远远早于大船抵达陆地，搬下所有财物，把铁船掉转方向，推离岸边。
        - id: ch04-b09
          speaker: youngest_prince
          text: 小船，小船，回家去！
        - id: ch04-b10
          speaker: narrator
          text: 铁船自行离去了。小王子把自己装扮成水手。这主意是山怪国王教的，还是他自己想出来的，讲故事的人可说不准。他来到一间破旧小屋，让屋里的老太婆相信，自己原是一艘遇难大船上的穷水手，只有他活着上了岸。他还请求老太婆收留自己和抢救下来的财物。
        - id: ch04-b11
          speaker: old_woman
          text: 上天搭救我吧！我哪有地方借给别人住？你看看这间屋子，我自己连张床都没有，哪里还能给你一张？
          emotion: surprised
        - id: ch04-b12
          speaker: narrator
          text: 水手回答说，没有床也无所谓。只要有个屋顶遮身，睡在哪里都一样。他连这样简陋的住处也感激不尽，老太婆听了，实在不好意思再把他赶出去。当天下午，他便来来回回，把自己带上岸的东西全搬进了这间破屋。
    - id: ch05
      title: 穷水手的消息
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 老太婆最爱打听新鲜消息，好跑出去四处传讲。她立刻问起水手是谁，从哪里来，要去哪里，带着什么，又要办什么事。她还追问，失踪多年的十二位公主，他是否听到过她们的消息。除此之外，她又问了一大串，讲出来只会白白耽误时间。
        - id: ch05-b02
          speaker: youngest_prince
          text: 我经历了那么可怕的风暴，现在身体虚弱，头也疼得厉害，实在答不了。让我安静休息几天吧。等我缓过来，你想知道什么，我都会告诉你。
        - id: ch05-b03
          speaker: narrator
          text: 第二天一早，老太婆又来追问。水手仍捂着脑袋，说自己还没清醒，却不经意漏出一两句话，让她听出他确实知道公主们的消息。老太婆一溜烟跑去告诉附近所有爱闲聊的人。没多久，人们便一个接一个赶来，问他见没见过公主，她们是不是在路上，又会不会很快回来。
        - id: ch05-b04
          speaker: narrator
          text: 水手继续为风暴后的头疼直哼哼，只透露说，只要公主们没在大风暴中遇难，大约两星期内，甚至更早，她们便会靠岸。他曾经见过她们，可后来她们也可能已经沉了船，所以他不敢断定她们是否活着。
        - id: ch05-b05
          speaker: narrator
          text: 一个爱嚼舌头的老太婆把消息送进王宫，说小屋里住着一个见过公主的水手，她们再过两星期，或许一个星期便会回家。国王马上派使者叫水手进宫。
        - id: ch05-b06
          speaker: youngest_prince
          text: 我怎么能去呢？我连一身能穿到国王面前的衣服都没有。
        - id: ch05-b07
          speaker: narrator
          text: 国王传话说，无论水手穿得华贵还是寒酸，他都非来不可。再没有别人能带来女儿们的消息。水手只得来到王宫。国王问他，是否当真见过公主。
        - id: ch05-b08
          speaker: youngest_prince
          text: 我确实见过她们，却不知道她们现在是否活着。我最后看见她们时，天气坏得可怕，我们自己的船也在风暴中沉没了。只要她们还活着，不出两星期，或许更早，她们就能平安回家。
        - id: ch05-b09
          speaker: narrator
          text: 老国王听完，欢喜得几乎失去常态。到了水手所说的日子，他带着盛大的仪仗，乘车赶往海岸迎接。没过多久，大船果然载着十二个王子、十二位公主和红骑士驶进港口。消息传开，举国上下到处都是笑声和欢呼。老国王终于找回了失散多年的女儿，他的欢喜更胜过所有人。
        - id: ch05-b10
          speaker: narrator
          text: 十一位年长的公主也兴高采烈，只有小公主不断哭泣，整天闷闷不乐。红骑士声称，是他杀死山怪、救出所有公主，而她将要嫁给这个骗子。老国王看在眼里，很不满意。他问女儿，姐姐们都那样快活，她为什么偏偏愁眉不展。如今她已经逃出山怪的魔掌，又能嫁给红骑士这样出色的丈夫，哪里还有什么可伤心的？小公主却一个字也不敢回答。红骑士早已扬言，无论是谁，只要说出事情的真相，他便会取走那个人的性命。
    - id: ch06
      title: 金冠作证
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: 有一天，公主们正忙着裁剪布料、穿针引线，为婚礼缝制衣裳。一个男人走了进来。他披着宽大的水手斗篷，背后还背着货郎的包袱。他问公主们，是否愿意买些适合婚礼的漂亮东西。包袱里有各色货物，也有许多金银珍宝。公主们一样样看过他的货物，又仔细看看这个人，总觉得眼前的面孔和其中许多宝物，自己从前都曾经见过。
        - id: ch06-b02
          speaker: youngest_princess
          text: 一个人既然有这么多好东西，一定还有比这些更珍贵、也更适合我们的东西。
        - id: ch06-b03
          speaker: youngest_prince
          text: 也许我确实有。
        - id: ch06-b04
          speakers: [princess_1, princess_2, princess_3]
          ensemble: chorus
          text: 嘘！别忘了红骑士说过什么！
          emotion: fearful
        - id: ch06-b05
          speaker: narrator
          text: 过了一阵，公主们坐在窗边向外望。那个男人再次出现了，身上仍披着宽大的水手斗篷，背后还驮着那只沉重的大箱子。他一路来到王宫，走进公主们所在的大厅，当着她们的面打开箱盖。箱子里正是那些失而复得的金冠，十二位公主一眼便各自认出了属于自己的那一顶。
        - id: ch06-b06
          speaker: youngest_princess
          text: 救我们的人，理应得到他应有的酬报。那个人不是红骑士，而是把金冠送回来的这个人。真正救出我们的人就是他。
        - id: ch06-b07
          speaker: narrator
          text: 小王子脱下水手斗篷，站在那里，比其余所有人都更英俊、更华贵。真相终于大白。老国王下令处死红骑士。
        - id: ch06-b08
          speaker: narrator
          text: 直到这时，王宫里才有了真真正正的欢喜。十二位王子各自娶了自己的新娘。那场婚礼盛大得不得了，足足十二个王国都听见了婚礼的消息，人人都在谈论这件事。
