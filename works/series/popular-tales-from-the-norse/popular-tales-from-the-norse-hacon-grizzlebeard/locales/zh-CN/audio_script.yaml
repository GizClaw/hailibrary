audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 从容而清醒，带一点克制的诙谐
        timbre: 温厚清晰
        pace: 舒缓有致
        pitch: 中低
    princess:
      display_name: 公主
      tts:
        delivery: 起初骄横尖刻，历经困苦后变得直率而谦卑
        timbre: 年轻清亮
        pace: 中等
        pitch: 中高
    hacon:
      display_name: 哈康·灰胡子
      tts:
        delivery: 沉着机敏，扮作乞丐时粗朴，显露身份时威严
        timbre: 年轻浑厚
        pace: 中等
        pitch: 中低
  chapters:
    - id: ch01
      title: 傲慢的公主
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 从前，有一位公主，又骄傲又刻薄。不管谁来求婚，她都觉得配不上自己。她把求婚的人一个个嘲笑够了，再赶出王宫。可她实在美貌，尽管心眼这样坏，前来求婚的人还是接连不断。
        - id: ch01-b02
          speaker: narrator
          text: 一天，哈康·灰胡子王子也来了。头一个晚上，公主就命宫廷小丑割掉他一匹马的耳朵，又把另一匹马的嘴角割到耳根。第二天，王子驾车出门，公主站在门廊上看着他。
        - id: ch01-b03
          speaker: princess
          text: 哎呀，我可从没见过这样的怪事！这里的北风真厉害，把一匹马的耳朵吹没了。另一匹马在旁边看呆了，嘴巴竟一直咧到了耳根！
        - id: ch01-b04
          speaker: narrator
          text: 她放声大笑，转身跑回屋里，“砰”地关上大门。王子只好驾车离开。回去的路上，他暗暗打定主意，总有一天，要叫这位公主也尝尝被人捉弄的滋味。
        - id: ch01-b05
          speaker: narrator
          text: 过了些日子，王子戴上一把苔藓做的大胡子，披上宽大的毛皮斗篷，装成一个乞丐。他向金匠买来一架金纺车，坐在公主窗下，用锉刀修修这里，又转动那里。纺车还不大好使，也缺一只架子。
        - id: ch01-b06
          speaker: narrator
          text: 早晨，公主推开窗子，问他肯不肯卖掉金纺车。
        - id: ch01-b07
          speaker: hacon
          text: 这架纺车不卖。不过，你若准我今晚睡在你卧房门外，我就把它送给你。
        - id: ch01-b08
          speaker: narrator
          text: 公主一听，觉得再划算不过。反正只是让一个乞丐睡在卧房门外，隔着一道门，能有什么危险？于是她欢欢喜喜收下了金纺车。到了夜里，哈康果然躺在门外，一点儿也没有越过约定的地方。可夜越来越深，寒气也越来越重，他渐渐冻得受不住了。
        - id: ch01-b09
          speaker: hacon
          text: 呼噜噜噜噜！太冷啦，快让我进去吧！
        - id: ch01-b10
          speaker: princess
          text: 我看你真是疯透了。
        - id: ch01-b11
          speaker: hacon
          text: 哎哟，呼噜噜噜噜！冷得刺骨，求你放我进去吧！
        - id: ch01-b12
          speaker: princess
          text: 嘘，住嘴！父王要是知道屋里有个男人，我可就倒大霉了。
        - id: ch01-b13
          speaker: hacon
          text: 我都快冻死了！只让我进去躺在地板上，行不行？
        - id: ch01-b14
          speaker: narrator
          text: 哈康一遍遍哀求，公主怕声音惊动父王，实在没有别的办法，只好把门打开。他进屋后也不多说，照约定躺在冰冷的地板上，很快便睡得像个陀螺似的沉。
    - id: ch02
      title: 三件金器
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 又过了一阵，哈康带着纺车架来到窗下，仍旧拿锉刀修个不停。公主听见声音，推窗问他手里是什么。
        - id: ch02-b02
          speaker: hacon
          text: 不过是殿下那架金纺车的架子。我想，你既然有了纺车，也许还想把架子配上。
        - id: ch02-b03
          speaker: narrator
          text: 公主问他要多少钱，他却说架子同纺车一样不卖。只要公主准他第二天夜里睡在卧房地板上，架子就归她。公主答应了，却叮嘱他不许发抖，更不许再叫“呼噜噜”。哈康满口保证。可到了深夜，他还是抖个不停，还问能不能挪到公主床边。
        - id: ch02-b04
          speaker: narrator
          text: 为了不让国王听见动静，公主又让了步。哈康便躺在床边的地板上，睡得香甜极了。
        - id: ch02-b05
          speaker: narrator
          text: 隔了很久，哈康才再次露面。这回他带来一只金绕线器，还是坐在窗下锉个不停。公主听见以后，又来问他肯不肯卖。
        - id: ch02-b06
          speaker: hacon
          text: 花钱买不到。你若准我今晚睡在卧房里，把头枕在床架上，我就白送给你。
        - id: ch02-b07
          speaker: narrator
          text: 公主想得到金绕线器，于是第三次答应了，条件仍是他必须安安静静，半点声音也不能发出。哈康说自己一定尽力。可等夜色深下来，寒意又缠住了他。他浑身不停打颤，连牙齿都咯咯作响。
        - id: ch02-b08
          speaker: hacon
          text: 呼噜噜噜噜！冷得要命！让我上床暖和一小会儿吧！
        - id: ch02-b09
          speaker: princess
          text: 上床？你一定是疯了！
        - id: ch02-b10
          speaker: hacon
          text: 呼噜噜噜噜！就让我上床吧！
        - id: ch02-b11
          speaker: princess
          text: 看在上帝的分上，别出声！父王若知道这里有个男人，一定会当场杀了我。
          emotion: fearful
        - id: ch02-b12
          speaker: narrator
          text: 可哈康还是一声接一声地嚷着要上床，一边抖得整间屋子都像在摇晃。公主怕父王听见，只得再次让步，让他钻进被窝。他这一晚睡得又香又舒服。没过多久，公主生下一个孩子。国王得知这件事，顿时勃然大怒，气得几乎要把母亲和婴孩一同杀死。
        - id: ch02-b13
          speaker: narrator
          text: 就在这时，哈康又装成乞丐，仿佛碰巧路过一样，踏着沉重的步子走进王宫，在厨房坐下。公主一看见他，立刻求他相救。
        - id: ch02-b14
          speaker: princess
          text: 上帝怜悯我吧！你给我招来了大祸，父王简直要气炸了。求你带我回家，让我跟着你吧！
          emotion: fearful
        - id: ch02-b15
          speaker: hacon
          text: 你这样娇养大的姑娘，哪肯跟我走？我只有一间原木小屋。我连自己都勉强养活，哪里还有东西给你吃？
        - id: ch02-b16
          speaker: princess
          text: 吃得到也好，吃不到也好，我都不在乎。只要让我跟你走。再留在这里，父王一定会要我的命。
          emotion: fearful
    - id: ch03
      title: 乞丐的小屋
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 公主终于获准跟这个她口中的乞丐离开王宫。他们没有车马，只能一步一步往前走，走了很远很远。公主从小娇生惯养，实在不善于徒步赶路。好不容易走出父王的国土，踏进另一片领地，她望着四周，忍不住问这里归谁。
        - id: ch03-b02
          speaker: hacon
          text: 你一定要知道的话，这里是哈康·灰胡子的领地。
        - id: ch03-b03
          speaker: princess
          text: 原来是他的！当初只要我肯，本来可以嫁给他。那样我就不用像个乞丐婆一样四处走路了。
        - id: ch03-b04
          speaker: narrator
          text: 此后，他们每走一段路，就会看见新的景象。有时是宏伟的城堡，有时是大片树林，还有围起来的美丽园囿。公主每一次都要问主人是谁，乞丐也每一次都给出同样的回答，说那是哈康·灰胡子的产业。一路看下来，她才知道王子的领地多么辽阔。她越听越伤心，越走越懊悔，怪自己当初为什么没有选中这样一个人。
        - id: ch03-b05
          speaker: narrator
          text: 最后，他们来到一座王宫附近。乞丐说宫里有人认识他，也许能替公主找份活儿，叫两人有口饭吃。他在林边搭起一间简陋的小屋，一家人就住在那里。每天，他都说自己进王宫替厨子劈柴挑水。傍晚回来时，他只带几块残肉。三个人靠这点食物生活，当然远远不够。
        - id: ch03-b06
          speaker: hacon
          text: 明天我留在家里照看孩子。你得去王宫，王子吩咐你试着烤面包。
        - id: ch03-b07
          speaker: princess
          text: 我去烤面包？我根本不会，一辈子也没做过这种事！
        - id: ch03-b08
          speaker: hacon
          text: 不会就看别人怎么做，慢慢学。王子叫你去，你非去不可。走的时候，还得替我偷些面包。不过别叫王子看见，他后脑勺上也长着眼睛呢。
        - id: ch03-b09
          speaker: princess
          text: 可我不会偷东西。
        - id: ch03-b10
          speaker: hacon
          text: 偷东西也能学。你知道，我们总是吃不饱。
        - id: ch03-b11
          speaker: narrator
          text: 公主上路以后，哈康等她走远，立刻抄近路飞奔到王宫，远远赶在她前面。他脱掉乞丐的破衣，摘下苔藓假胡子，重新换上王子的华服。公主来到烘焙房，轮到她干活时，就仔细看别人怎么烤。她也照乞丐的吩咐偷偷拿面包，一直把两只衣袋都塞得鼓鼓囊囊。傍晚，她正准备回小屋，王子忽然叫住了众人。
        - id: ch03-b12
          speaker: hacon
          text: 我们不大了解哈康·灰胡子的这个老婆子。最好查一查，看她有没有顺手拿走什么。
        - id: ch03-b13
          speaker: narrator
          text: 王子亲自动手，把公主每只衣袋都翻了一遍，又仔细搜遍她全身。等那些面包全被找出来，他立刻装出勃然大怒的样子，大声斥责，闹得烘焙房里所有人都不得安宁。公主既羞愧又害怕，忍不住哭了起来。
        - id: ch03-b14
          speaker: princess
          text: 是那个乞丐逼我做的，我没有办法！
        - id: ch03-b15
          speaker: hacon
          text: 本该狠狠惩罚你。不过看在那个乞丐的分上，这回饶了你。
        - id: ch03-b16
          speaker: narrator
          text: 公主走远后，哈康赶紧脱下王子的华服，重新披上那件破旧的兽皮斗篷，戴好苔藓假胡子，再抄近路跑回林边的小屋。公主到家时，他已经坐在那里，怀里抱着孩子，正忙着哄他。她又气又难过，说这是自己头一次偷东西，也一定是最后一次，随后把烘焙房里的遭遇和王子说过的话全讲给了他。
    - id: ch04
      title: 一次又一次
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 几天以后，哈康傍晚回家，又说自己第二天要照看孩子，因为王宫要杀一头猪，公主必须去帮忙灌香肠。
        - id: ch04-b02
          speaker: princess
          text: 我去灌香肠？香肠我吃过不少，可我一辈子连一根都没做过！
        - id: ch04-b03
          speaker: narrator
          text: 哈康说，王子既然发了话，她只能去。不会做，就照着别人学。他还叫她偷些香肠。公主想起上回的事，怎么也不肯。
        - id: ch04-b04
          speaker: hacon
          text: 偷也能学。谁知道呢，也许这回你的运气会好些。
        - id: ch04-b05
          speaker: narrator
          text: 公主走后，他照旧抄近路换上王子的华服。公主看着众人杀猪，又跟着大家灌香肠，最后把衣袋塞得满满的。傍晚，王子又下令搜查这个上回手脚不干净的乞丐婆。
        - id: ch04-b06
          speaker: narrator
          text: 他从衣袋里找出香肠，又闹得天翻地覆，还威胁要叫治安官来，把公主关进囚笼。公主伤心地哭起来。
        - id: ch04-b07
          speaker: princess
          text: 愿上帝赐福殿下，求您放过我吧！是那个乞丐逼我干的。
          emotion: sad
        - id: ch04-b08
          speaker: hacon
          text: 你本该为此吃些苦头。不过看在那个乞丐的分上，这次也饶了你。
        - id: ch04-b09
          speaker: narrator
          text: 公主离开后，哈康再次脱下华服，披回兽皮斗篷，戴上假胡子，又抄近路奔回林边。等公主拖着脚步走到小屋，他早已坐在那里等着。公主把杀猪、灌香肠、遭人搜查的经过全告诉他，还斩钉截铁地发誓，不管他说什么，这都一定是最后一次。
        - id: ch04-b10
          speaker: narrator
          text: 过了些日子，哈康说王子要结婚，可新娘病着，裁缝不能量尺寸。公主和新娘身材一样，所以王子叫她去代量。等裁缝剪礼服时，她还得拿走最大的几块碎料，带回家给哈康做背心。
        - id: ch04-b11
          speaker: princess
          text: 不，我不能偷！你明明知道，上回已经闹成了什么样。
        - id: ch04-b12
          speaker: hacon
          text: 那就学着偷吧。说不定这回运气会好一点。
        - id: ch04-b13
          speaker: narrator
          text: 公主觉得这件事糟糕透了，可王子已经发话，她还是只能前去。裁缝替她量完尺寸，她没有离开，只站在旁边看他裁剪新娘的礼服。等最大的碎料落下来，她便赶紧扫到手里，一块块塞进衣袋。临走时，王子果然又命人搜查。布料一找出来，他便气得不停跺脚，厉声责骂。公主一边流泪，一边求他原谅，说这回仍是乞丐逼她做的。
        - id: ch04-b14
          speaker: hacon
          text: 你本该受罚。不过还是看在那个乞丐的分上，饶你这一回。
        - id: ch04-b15
          speaker: narrator
          text: 事情仍和前两次一样。公主回到小屋，乞丐已经在那里等着了。
        - id: ch04-b16
          speaker: princess
          text: 老天救救我吧！你总逼我做坏事，迟早会害死我。王子气得要命，还说要叫治安官来，把我关进囚笼！
          emotion: fearful
    - id: ch05
      title: 真正的婚礼
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 又过了一段日子，哈康傍晚回到小屋，带来了王子的又一道命令。
        - id: ch05-b02
          speaker: hacon
          text: 王子叫你去王宫替新娘成婚，老婆子。新娘还病得起不了床，他却不肯推迟婚礼。他说你们长得太像，谁也认不出来。明天你得准备好出发。
        - id: ch05-b03
          speaker: princess
          text: 我看你和王子都疯了！你们觉得我这样子配代替新娘吗？好好看看我，世上还有比我更难看的乞丐婆吗？
        - id: ch05-b04
          speaker: hacon
          text: 王子吩咐你去，你就得去。
        - id: ch05-b05
          speaker: narrator
          text: 公主知道反抗也没有用，只能再次来到王宫。宫里的人给她换上最华美的衣裳。谁也想不到那个疲惫的乞丐婆会变得这样光彩照人，世上再没有哪位公主能比她更美。迎亲的队伍簇拥着她来到教堂，她就在那里站在新娘的位置上，举行了婚礼。
        - id: ch05-b06
          speaker: narrator
          text: 一行人从教堂回到王宫，真正的婚宴随即开始。宫里处处是歌声、舞声和欢笑，人人都沉浸在喜庆之中。公主正同王子跳舞，忽然透过窗子看见远处闪起一道亮光。她转头仔细望去，才发现林边那间住了许多日子的小屋，已经整个烧起来，化成了一团明亮的火焰。
        - id: ch05-b07
          speaker: princess
          text: 啊！乞丐、孩子，还有小屋！
          emotion: fearful
        - id: ch05-b08
          speaker: narrator
          text: 她尖叫一声，眼看就要昏过去。这时，王子终于开口了。
        - id: ch05-b09
          speaker: hacon
          text: 乞丐就在这里，孩子也在那里。至于那间小屋，只管让它烧吧。
        - id: ch05-b10
          speaker: narrator
          text: 公主这才认出，眼前的王子正是一路陪着自己的乞丐，也是当初前来求婚的哈康·灰胡子。从这一刻起，真正的欢笑和喜庆才开始。至于后来怎样，我再也没有听说过他们的消息。
