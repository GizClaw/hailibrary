audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: thoughtful and gently wry
        timbre: warm and clear
        pace: measured
        pitch: medium
    princess:
      display_name: Princess
      tts:
        delivery: proud and quick, softening through hardship
        timbre: bright and clear
        pace: moderate
        pitch: medium-high
    hacon_grizzlebeard:
      display_name: Hacon Grizzlebeard
      tts:
        delivery: shrewd and assured, with a playful edge
        timbre: resonant and warm
        pace: moderate
        pitch: medium-low
  chapters:
    - id: ch01
      title: The Proud Princess
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            Once there was a princess so proud and saucy that no suitor was good enough for her. She mocked every one and sent him away. Yet new suitors kept coming to the palace, because, wicked as she was, she was very beautiful.
        - id: ch01-b02
          speaker: narrator
          text: >-
            One day, a prince named Hacon Grizzlebeard came to woo her. On his first night there, the Princess ordered the king's fool to cut the ears from one of Hacon's horses and slit the other horse's mouth all the way back to its ears. The next day, when Hacon came out to drive away, she stood watching from the porch.
        - id: ch01-b03
          speaker: princess
          text: >-
            Well, I have never seen anything like it! The sharp north wind must have blown one horse's ears clean off. And the other stared with its mouth open so long that its jaws split right back to its ears!
          emotion: happy
        - id: ch01-b04
          speaker: narrator
          text: >-
            She roared with laughter, ran inside, and slammed the door behind her. Hacon drove home, thinking that one day he would pay her back.
        - id: ch01-b05
          speaker: narrator
          text: >-
            Before long, he made himself a great beard of moss and covered his clothes with a heavy fur cloak. In that disguise, he looked like any wandering beggar. He went to a goldsmith and bought a golden spinning wheel. Then he carried it to the palace and sat beneath the Princess's window, filing the wheel and turning it this way and that. It was not quite ready to work, and besides, it still needed a stand.
        - id: ch01-b06
          speaker: narrator
          text: >-
            In the morning, the Princess opened her window and asked whether the beggar would sell the golden spinning wheel.
        - id: ch01-b07
          speaker: hacon_grizzlebeard
          text: >-
            No, it isn't for sale. But let me sleep outside your bedroom door tonight, and the wheel is yours.
        - id: ch01-b08
          speaker: narrator
          text: >-
            The Princess thought that was a fine bargain. Surely there could be no harm in letting him sleep outside her door. She took the wheel, and that night Hacon lay down where they had agreed. As the hours passed, though, he began to freeze.
        - id: ch01-b09
          speaker: hacon_grizzlebeard
          text: >-
            Hutetutetutetu! It is so cold out here. Please let me come in.
        - id: ch01-b10
          speaker: princess
          text: You must have lost your senses.
        - id: ch01-b11
          speaker: hacon_grizzlebeard
          text: >-
            Oh, hutetutetutetu! The cold is bitter. Please, let me inside.
        - id: ch01-b12
          speaker: princess
          text: >-
            Hush! Be quiet. If my father finds out there is a man in the house, I will be in terrible trouble.
        - id: ch01-b13
          speaker: hacon_grizzlebeard
          text: >-
            Hutetutetutetu! I am nearly frozen. Just let me lie on the floor inside.
        - id: ch01-b14
          speaker: narrator
          text: >-
            There was no other way to stop the noise, so she let him in. Hacon stretched out on the floor and slept as soundly as a top.
    - id: ch02
      title: Three Golden Gifts
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            Some time later, Hacon returned with the stand for the spinning wheel. He sat beneath the Princess's window and filed at it, since it was not yet ready to use. When she heard him, she opened the window and asked what he had brought.
        - id: ch02-b02
          speaker: hacon_grizzlebeard
          text: >-
            Oh, it is only the stand for the spinning wheel your royal highness bought. Since you have the wheel, I thought you might want its stand as well.
        - id: ch02-b03
          speaker: princess
          text: What do you want for it?
        - id: ch02-b04
          speaker: narrator
          text: >-
            The stand was no more for sale than the wheel had been. Hacon would not take money for it. But he said she could have it if he might sleep on her bedroom floor the next night. The Princess wanted the matching stand, so she agreed. She warned him that he must lie still. There could be no shivering, no cries of "hutetu," and no other noise. Hacon gave her a fair promise that he would behave.
        - id: ch02-b05
          speaker: narrator
          text: >-
            But late that night, he began to shake with cold and asked to move closer, onto the floor beside her bed. Again, the Princess had to agree, or the king might hear him. Hacon lay beside the bed and slept as soundly as a top.
        - id: ch02-b06
          speaker: narrator
          text: >-
            A long while passed before Hacon returned. This time he carried a golden wool-winder and sat filing it beneath her window. Once again, the Princess heard him, came to the window, and asked how he was and whether he would sell it.
        - id: ch02-b07
          speaker: hacon_grizzlebeard
          text: >-
            Money cannot buy this. But if I may sleep in your room tonight with my head resting on your bedstead, you may have it for nothing.
        - id: ch02-b08
          speaker: narrator
          text: >-
            The Princess agreed, provided he gave his word to keep quiet. He said he would do his best. But as the night went on, he shook so hard that his teeth began to chatter.
        - id: ch02-b09
          speaker: hacon_grizzlebeard
          text: >-
            Hutetutetutetu! It is bitterly cold. Oh, please let me get into bed and warm myself for a little while.
        - id: ch02-b10
          speaker: princess
          text: >-
            Get into bed? You must be out of your mind!
          emotion: surprised
        - id: ch02-b11
          speaker: hacon_grizzlebeard
          text: Hutetutetutetu! Please let me into the bed. Hutetutetutetu!
        - id: ch02-b12
          speaker: princess
          text: >-
            Hush, for heaven's sake! If Father learns there is a man in here, I will be in a dreadful state. I am sure he will kill me where I stand.
          emotion: fearful
        - id: ch02-b13
          speaker: hacon_grizzlebeard
          text: Hutetutetutetu! Let me into the bed.
        - id: ch02-b14
          speaker: narrator
          text: >-
            He kept shivering until the whole room seemed to shake. There was no help for it. She let him into the bed, and there he slept soundly and softly.
        - id: ch02-b15
          speaker: narrator
          text: >-
            A little while afterward, the Princess had a child. The king flew into such a rage that he nearly killed both mother and baby. Just then, Hacon Grizzlebeard happened to come tramping past again. Still dressed as a beggar, he went into the kitchen and sat down.
        - id: ch02-b16
          speaker: princess
          text: >-
            Oh, may God have mercy on me for the trouble you have brought! Father is beside himself with rage. Please let me go home with you.
          emotion: fearful
        - id: ch02-b17
          speaker: hacon_grizzlebeard
          text: >-
            I am sure you are far too finely raised to follow me. I own nothing but a hut made of logs. I hardly know how I could feed you when I can barely find food for myself.
        - id: ch02-b18
          speaker: princess
          text: >-
            I do not care how you find food, or whether you find any. Only let me stay with you. If I remain here, my father will surely take my life.
          emotion: fearful
        - id: ch02-b19
          speaker: narrator
          text: >-
            So the Princess received permission to go with the man she called the beggar. Taking the baby with them, they set out together. They walked a long, long way. The Princess was a poor traveler on foot, but still they kept on. At last they crossed the border of her father's kingdom and entered another land. Then she asked who owned the country around them.
        - id: ch02-b20
          speaker: hacon_grizzlebeard
          text: Since you must know, it belongs to Hacon Grizzlebeard.
        - id: ch02-b21
          speaker: princess
          text: >-
            Truly? I could have married him if I had wished. Then I would not be wandering about as a beggar's wife.
          emotion: sad
        - id: ch02-b22
          speaker: narrator
          text: >-
            Whenever they passed great castles, forests, or parks, she asked who owned them. Each time the answer was the same. They belonged to Hacon Grizzlebeard. The Princess grew more and more sorry that she had refused the man with such broad lands.
    - id: ch03
      title: Bread from the Palace
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            At last they reached a palace where the beggar said people knew him. He thought he could find work for her there, so they would have something to live on. He built them a cabin beside the woods, and that poor little place became their home. Each day, he claimed to go to the palace to chop wood and carry water for the cook. In the evening, he came back with a few scraps of meat. There was never much, and what he brought did not last long.
        - id: ch03-b02
          speaker: hacon_grizzlebeard
          text: >-
            Tomorrow I will stay here and care for the baby. You must go to the palace. The Prince says you are to try your hand at baking.
        - id: ch03-b03
          speaker: princess
          text: >-
            Me, bake? I cannot bake. I have never done it in my life.
        - id: ch03-b04
          speaker: hacon_grizzlebeard
          text: >-
            You must go because the Prince has ordered it. If you cannot bake, watch the others and learn. And when you leave, steal some bread for me.
        - id: ch03-b05
          speaker: princess
          text: I cannot steal.
        - id: ch03-b06
          speaker: hacon_grizzlebeard
          text: >-
            You can learn that too. We have very little to eat. Just make sure the Prince does not see you, because he has eyes in the back of his head.
        - id: ch03-b07
          speaker: narrator
          text: >-
            Once she was well on her way, Hacon took a shortcut and reached the palace far ahead of her. He cast off his rags and mossy beard and put on his princely robes.
        - id: ch03-b08
          speaker: narrator
          text: >-
            The Princess worked her turn in the bakehouse. She also obeyed Hacon and packed her pockets full of stolen bread. When evening came and she was ready to leave, the Prince spoke.
        - id: ch03-b09
          speaker: hacon_grizzlebeard
          text: >-
            We know very little about this old wife of Hacon Grizzlebeard. We had better see whether she is carrying anything away.
        - id: ch03-b10
          speaker: narrator
          text: >-
            He pushed his hands into every one of her pockets, searched her all over, and found the stolen bread. Then he flew into a rage. He scolded so fiercely that everyone around him had a miserable time of it. The Princess could do nothing but weep and mourn.
        - id: ch03-b11
          speaker: princess
          text: >-
            The beggar told me to do it. I could not help myself.
          emotion: sad
        - id: ch03-b12
          speaker: hacon_grizzlebeard
          text: >-
            You deserve a harsh punishment. Still, for the beggar's sake, I will forgive you this once.
        - id: ch03-b13
          speaker: narrator
          text: >-
            After she had gone, Hacon changed back into his fur cloak and false beard. He hurried by the shortcut and reached the cabin first. When the Princess arrived, she found him tending the baby.
        - id: ch03-b14
          speaker: princess
          text: >-
            You made me do something that went against my heart. I had never stolen before, and I never will again.
        - id: ch03-b15
          speaker: narrator
          text: >-
            Then she told the beggar exactly what had happened at the bakehouse, how the Prince had searched her, and what he had said when he let her go.
    - id: ch04
      title: Sausages and Silk
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: A few days later, Hacon came home from the palace in the evening.
        - id: ch04-b02
          speaker: hacon_grizzlebeard
          text: >-
            Tomorrow I must stay here with the baby. They are going to slaughter a pig at the palace, and you must help make the sausages.
        - id: ch04-b03
          speaker: princess
          text: >-
            Me, make sausages? I cannot do that. I have eaten plenty of them, but I have never made even one.
        - id: ch04-b04
          speaker: narrator
          text: >-
            But the Prince had ordered it, so she had to go. Hacon told her to copy the other workers. He also ordered her to steal some sausages for him.
        - id: ch04-b05
          speaker: princess
          text: >-
            No, I cannot steal them. You know what happened last time.
        - id: ch04-b06
          speaker: hacon_grizzlebeard
          text: >-
            You can learn. Who knows? Perhaps you will have better luck this time.
        - id: ch04-b07
          speaker: narrator
          text: >-
            Again, Hacon waited until she was on her way. Then he raced by the shortcut, reached the palace first, and exchanged his cloak and false beard for his royal clothes. He was standing in the kitchen when she arrived.
        - id: ch04-b08
          speaker: narrator
          text: >-
            The Princess stood with the others while the pig was slaughtered. She watched how they worked, then helped them make the sausages. She also did as Hacon had told her. One sausage after another went into her pockets until they were full. But that evening, just as she was ready to leave for the cabin, the Prince stopped her.
        - id: ch04-b09
          speaker: hacon_grizzlebeard
          text: >-
            This beggar's wife had sticky fingers last time. Let us see whether she has carried anything off again.
        - id: ch04-b10
          speaker: narrator
          text: >-
            He searched her pockets and found the sausages. Once more, he stormed and shouted. He threatened to call the constable and have her locked in the cage.
        - id: ch04-b11
          speaker: princess
          text: >-
            God bless your royal highness, please let me go! The beggar made me do it.
          emotion: fearful
        - id: ch04-b12
          speaker: hacon_grizzlebeard
          text: >-
            You should pay dearly for this. But for the beggar's sake, I will forgive you.
        - id: ch04-b13
          speaker: narrator
          text: >-
            When she left, Hacon changed back into the beggar's clothes and ran home by the shortcut. He reached the cabin before her and was waiting there when she arrived. The Princess told him the whole story, from the search to the threat of the cage. Then she swore, through thick and thin, that this was the last time he would ever make her do such a thing.
        - id: ch04-b14
          speaker: narrator
          text: >-
            A little later, Hacon returned from the palace with another message.
        - id: ch04-b15
          speaker: hacon_grizzlebeard
          text: >-
            Our Prince is going to be married, but his bride is ill, so the tailor cannot measure her for the wedding gown. The Prince says you are the same height and shape. You must go to the palace and be measured in her place. Afterward, stay near the tailor. When he cuts the gown, snatch the largest scraps and bring them home for me to make a waistcoat.
        - id: ch04-b16
          speaker: princess
          text: >-
            No, I cannot steal. You know what happened before.
        - id: ch04-b17
          speaker: hacon_grizzlebeard
          text: Then you can learn. Perhaps this time your luck will change.
        - id: ch04-b18
          speaker: narrator
          text: >-
            The Princess thought it was a wicked plan, but still she went and did as she was told. At the palace, she stood in the sick bride's place while the tailor took every measurement he needed. She remained nearby when he began cutting out the wedding gown. As the pieces fell, she swept up all the largest scraps of fine cloth and stuffed them into her pockets. Then, just as she started to leave, the Prince spoke again.
        - id: ch04-b19
          speaker: hacon_grizzlebeard
          text: >-
            We should see whether this old woman has been light-fingered again.
        - id: ch04-b20
          speaker: narrator
          text: >-
            He searched her pockets and found the cloth. He stamped about and scolded furiously while she wept.
        - id: ch04-b21
          speaker: princess
          text: >-
            Oh, please forgive me. The beggar ordered me to do it, and I could not help myself.
          emotion: sad
        - id: ch04-b22
          speaker: hacon_grizzlebeard
          text: >-
            You deserve to suffer for this. Yet for the beggar's sake, I will forgive you.
        - id: ch04-b23
          speaker: narrator
          text: >-
            Everything happened just as before. Hacon changed his clothes, took the shortcut, and was back at the cabin when she arrived.
        - id: ch04-b24
          speaker: princess
          text: >-
            Heaven help me! You will be the death of me, always driving me to wickedness. The Prince was so terribly angry that he threatened me with both the constable and the cage.
          emotion: fearful
    - id: ch05
      title: The Bride at the Palace
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: Some time afterward, Hacon came home to the cabin at evening.
        - id: ch05-b02
          speaker: hacon_grizzlebeard
          text: >-
            Now the Prince says you must go to the palace and take the bride's place, old lass. She is still ill in bed, but he refuses to delay the wedding. He says you look so much like her that no one can tell you apart. You must be ready to go tomorrow.
        - id: ch05-b03
          speaker: princess
          text: >-
            I think both you and the Prince have lost your minds. Do I look fit to stand in for a bride? Look at me! Could any beggar's wife look worse?
        - id: ch05-b04
          speaker: hacon_grizzlebeard
          text: The Prince has ordered you to go, and go you must.
        - id: ch05-b05
          speaker: narrator
          text: >-
            Once more, there was no help for it. The Princess had to go. She left the poor cabin behind and made her way to the palace. There, the servants dressed her in the wedding clothes. By the time they had finished, she looked so splendid that no princess had ever looked finer.
        - id: ch05-b06
          speaker: narrator
          text: >-
            The whole wedding party traveled to the church, and there the Princess stood in for the missing bride. When everyone returned, the palace filled with dancing and merriment. She found herself in the middle of the celebration, dancing with the Prince himself. Then a gleam of light caught her eye through the window. She looked out and saw the little cabin beside the woods, blazing from end to end in one bright flame.
        - id: ch05-b07
          speaker: princess
          text: >-
            Oh! The beggar, the baby, and the cabin!
          emotion: fearful
        - id: ch05-b08
          speaker: narrator
          text: She cried out and nearly fainted.
        - id: ch05-b09
          speaker: hacon_grizzlebeard
          text: >-
            Here is the beggar, and there is the baby. Let the cabin burn.
        - id: ch05-b10
          speaker: narrator
          text: >-
            Then she recognized Hacon Grizzlebeard and understood that the Prince and the beggar were the same man. After that, the true joy and merriment began in earnest. And from that day to this, I have never heard another thing about them.
