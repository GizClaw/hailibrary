audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: thoughtful and gently wry
        timbre: warm and clear
        pace: measured
        pitch: medium
    bear:
      display_name: Bear
      tts:
        delivery: earnest and trusting
        timbre: deep and rounded
        pace: unhurried
        pitch: low
    fox:
      display_name: Fox
      tts:
        delivery: sly and smoothly persuasive
        timbre: light and nimble
        pace: brisk
        pitch: medium-high
  chapters:
    - id: ch01
      title: The Fox and His Fish
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: One day, Bear met Fox slinking along with a whole string of fish. Fox had stolen every one of them.
        - id: ch01-b02
          speaker: bear
          text: Where did you get all those fish?
        - id: ch01-b03
          speaker: fox
          text: Oh, my Lord Bruin! I've been fishing, and this is what I caught.
    - id: ch02
      title: Fox Explains How to Fish
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: Bear wanted to learn how to fish too, so he asked Fox to tell him what to do.
        - id: ch02-b02
          speaker: fox
          text: Why, it's easy for you. You'll learn in no time. Go out on the ice, cut a hole, and put your tail down into the water. Then keep it there for as long as you can.
        - id: ch02-b03
          speaker: fox
          text: If your tail starts to sting a little, don't worry. That only means the fish are biting. The longer you wait, the more fish you'll catch. Then yank your tail out all at once. Pull it hard and sideways.
    - id: ch03
      title: Bear's Stumpy Tail
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: Bear did exactly as Fox had told him. He left his tail in the hole for a long, long time, until it froze fast in the ice.
        - id: ch03-b02
          speaker: narrator
          text: Then Bear gave his tail one hard sideways pull. It snapped right off.
        - id: ch03-b03
          speaker: narrator
          text: And that is why Bruin still goes about with a stumpy tail today.
