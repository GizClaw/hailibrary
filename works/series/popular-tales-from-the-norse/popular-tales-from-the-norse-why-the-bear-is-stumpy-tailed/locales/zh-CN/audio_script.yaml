audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 从容而清醒，带一点克制的诙谐
        timbre: 温厚清晰
        pace: 舒缓有致
        pitch: 中低
    bear:
      display_name: 熊
      tts:
        delivery: 憨直认真，容易相信别人
        timbre: 低沉厚实
        pace: 偏缓
        pitch: 低
    fox:
      display_name: 狐狸
      tts:
        delivery: 圆滑机灵，故作恭敬，暗藏捉弄
        timbre: 清脆灵活
        pace: 中等偏快
        pitch: 中等偏高
  chapters:
    - id: ch01
      title: 偷来的鱼
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 有一天，熊遇见了狐狸。狐狸正鬼鬼祟祟地往前走，身后还拖着一串偷来的鱼。
        - id: ch01-b02
          speaker: bear
          text: 这些鱼是哪儿来的？
        - id: ch01-b03
          speaker: fox
          text: 哎呀，熊大人！我刚刚去钓鱼了，这一串全是我钓上来的。
    - id: ch02
      title: 狐狸教钓鱼
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 熊一听，也想学会钓鱼，就请狐狸把办法教给他。
        - id: ch02-b02
          speaker: fox
          text: 这对您可太容易了，一会儿就能学会。先走到冰面上，凿开一个窟窿，再把尾巴伸进水里。接下来就一直泡着，能坚持多久就坚持多久。要是尾巴有点刺痛，千万别管，那正是鱼儿在咬您的尾巴。泡得越久，鱼就越多。到了最后，猛一下把尾巴拔出来，记住要斜着朝旁边拽，还得用足力气！
    - id: ch03
      title: 短尾巴
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 熊真的照着狐狸的办法去做了。他把尾巴泡在冰窟窿里，等了很久很久。渐渐地，尾巴牢牢冻在了冰里。
        - id: ch03-b02
          speaker: narrator
          text: 熊忽然使足力气，斜着往旁边一拽。只听啪的一声，尾巴断了，只剩下一截。
        - id: ch03-b03
          speaker: narrator
          text: 所以直到今天，熊走来走去，身后也只有一截短尾巴。
