audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 从容而清醒，带一点克制的诙谐
        timbre: 温厚清晰
        pace: 舒缓有致
        pitch: 中低
    goody:
      display_name: 大娘
      tts:
        delivery: 爽快直率，发怒时干脆利落
        timbre: 朴实明亮
        pace: 中等
        pitch: 中等
    bruin:
      display_name: 大熊
      tts:
        delivery: 憨直粗犷，嗓门响亮
        timbre: 粗厚浑沉
        pace: 中等偏慢
        pitch: 低
    wolf:
      display_name: 狼
      tts:
        delivery: 直接急切，带着野兽般的低吼
        timbre: 沙哑低沉
        pace: 中等
        pitch: 低
    fox:
      display_name: 狐狸
      tts:
        delivery: 机灵讨巧，唱叫时清亮悦耳
        timbre: 轻巧清亮
        pace: 中等偏快
        pitch: 中高
  chapters:
    - id: ch01
      title: 大熊来应征
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 从前，有个女人想找人替她看管牲口，便出门去雇牧人。走在路上，她先碰见了一头熊。
        - id: ch01-b02
          speaker: bruin
          text: 大娘，你这是往哪儿去？
        - id: ch01-b03
          speaker: goody
          text: 我要去找个牧人，替我照看牲口。
        - id: ch01-b04
          speaker: bruin
          text: 那就雇我呀，我可以给你当牧人。
        - id: ch01-b05
          speaker: goody
          text: 雇你也行，不过得看你会不会招呼牲口。你先叫一声，让我听听。
        - id: ch01-b06
          speaker: bruin
          text: 我是这样叫的，嗷——嗷——！
        - id: ch01-b07
          speaker: narrator
          text: 大熊这一嗓子吼得又粗又沉。女人才听了一声，就知道不能把牲口交给他。
        - id: ch01-b08
          speaker: goody
          text: 不行，不行！我不能雇你。
        - id: ch01-b09
          speaker: narrator
          text: 她丢下大熊，继续沿着路往前走。
    - id: ch02
      title: 狼也不合适
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 没走多远，女人又遇见了一匹狼。
        - id: ch02-b02
          speaker: wolf
          text: 大娘，你要上哪儿去？
        - id: ch02-b03
          speaker: goody
          text: 我要去雇个牧人。
        - id: ch02-b04
          speaker: wolf
          text: 何必再找呢？让我替你放牧吧。
        - id: ch02-b05
          speaker: goody
          text: 那你得先让我听听，你是怎么招呼牲口的。
        - id: ch02-b06
          speaker: wolf
          text: 我这样招呼，呜——呜——！
        - id: ch02-b07
          speaker: narrator
          text: 狼只会发出低沉的呜呜声，女人听了也不肯雇他。
        - id: ch02-b08
          speaker: goody
          text: 不成，你也干不了我的活儿。
        - id: ch02-b09
          speaker: narrator
          text: 她没有停留，又往前赶路去了。
    - id: ch03
      title: 狐狸当上牧人
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 女人又走了好一阵，这回遇见了一只狐狸。
        - id: ch03-b02
          speaker: fox
          text: 大娘，你这是上哪儿去呀？
        - id: ch03-b03
          speaker: goody
          text: 我正要去雇个牧人。
        - id: ch03-b04
          speaker: fox
          text: 让我来吧。我很愿意替你看管牲口。
        - id: ch03-b05
          speaker: goody
          text: 可以呀。不过你先叫一声牲口，让我听听你的本事。
        - id: ch03-b06
          speaker: fox
          text: 你听我叫，嘀儿——嗒儿——嗬啰——！
        - id: ch03-b07
          speaker: narrator
          text: 狐狸这一声唱得清清亮亮，听起来可悦耳了。女人听完，当场便答应雇他。
        - id: ch03-b08
          speaker: goody
          text: 好，就雇你了。往后我的牲口都交给你照看。
        - id: ch03-b09
          speaker: narrator
          text: 就这样，狐狸成了她家的牧人。
    - id: ch04
      title: 狐狸的白尾巴尖
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 狐狸上工第一天，就把女人的山羊全吃了。第二天，他又吃光了绵羊。到了第三天，连牛也一头不剩。那天傍晚，狐狸回到家，女人便问起所有牲口的下落。
        - id: ch04-b02
          speaker: goody
          text: 我的牲口呢？你把它们弄到哪儿去了？
        - id: ch04-b03
          speaker: fox
          text: 它们呀，脑壳在溪水里，身子在树林里。
        - id: ch04-b04
          speaker: narrator
          text: 那时，大娘正在搅奶油。她听完狐狸的话，决定亲自出去找找牲口。她前脚一走，狐狸后脚便钻进搅乳桶，把里面的奶油吃得干干净净。
        - id: ch04-b05
          speaker: narrator
          text: 大娘回来一看，气得不得了。桶里只剩下一小团奶油，她一把抓起来，朝逃跑的狐狸扔了过去。奶油不偏不倚，正好粘在狐狸的尾巴尖上。从那以后，狐狸的尾巴梢就一直是白的。
