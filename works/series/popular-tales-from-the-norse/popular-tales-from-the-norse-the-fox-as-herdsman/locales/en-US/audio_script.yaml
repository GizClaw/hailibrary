audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: thoughtful and gently wry
        timbre: warm and clear
        pace: measured
        pitch: medium
    woman:
      display_name: The Woman
      tts:
        delivery: practical and plainspoken
        timbre: warm and sturdy
        pace: measured
        pitch: medium
    bear:
      display_name: Bear
      tts:
        delivery: blunt and hopeful
        timbre: deep and rough
        pace: slow
        pitch: low
    wolf:
      display_name: Wolf
      tts:
        delivery: eager and direct
        timbre: lean and gravelly
        pace: measured
        pitch: medium-low
    fox:
      display_name: Fox
      tts:
        delivery: smooth and self-assured
        timbre: bright and clear
        pace: lively
        pitch: medium-high
  chapters:
    - id: ch01
      title: Choosing a Herdsman
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            Once there was a woman who set out to hire someone to tend her animals. Before long, she met a bear.
        - id: ch01-b02
          speaker: bear
          text: Where are you going, Goody?
        - id: ch01-b03
          speaker: woman
          text: I'm looking for a herdsman.
        - id: ch01-b04
          speaker: bear
          text: Then why not hire me?
        - id: ch01-b05
          speaker: woman
          text: Perhaps I will. But first, let me hear how you call the flock.
        - id: ch01-b06
          speaker: bear
          text: Ow, ow!
        - id: ch01-b07
          speaker: narrator
          text: >-
            As soon as the woman heard that rough, growling call, she knew the bear would never do as her herdsman.
        - id: ch01-b08
          speaker: woman
          text: No, no. I won't hire you.
        - id: ch01-b09
          speaker: narrator
          text: She went on her way. A little farther along, she met a wolf.
        - id: ch01-b10
          speaker: wolf
          text: Where are you going, Goody?
        - id: ch01-b11
          speaker: woman
          text: I'm on my way to hire a herdsman.
        - id: ch01-b12
          speaker: wolf
          text: Why don't you take me?
        - id: ch01-b13
          speaker: woman
          text: I might, if you can call the flock. Let's hear you do it.
        - id: ch01-b14
          speaker: wolf
          text: Uh, uh!
        - id: ch01-b15
          speaker: woman
          text: No, no. You'll never do for me.
        - id: ch01-b16
          speaker: narrator
          text: >-
            The woman left the wolf behind and walked on. After she had gone a while longer, she met a fox.
        - id: ch01-b17
          speaker: fox
          text: Where are you going, Goody?
        - id: ch01-b18
          speaker: woman
          text: I'm just going to find a herdsman.
        - id: ch01-b19
          speaker: fox
          text: Why not make me your herdsman?
        - id: ch01-b20
          speaker: woman
          text: Well, I could. Show me how you call the flock.
        - id: ch01-b21
          speaker: fox
          text: Dil-dal-holom!
        - id: ch01-b22
          speaker: narrator
          text: The fox sang it out in a fine, clear voice.
        - id: ch01-b23
          speaker: woman
          text: Yes, I'll have you for my herdsman.
        - id: ch01-b24
          speaker: narrator
          text: And with that, she put the fox in charge of all her animals.
    - id: ch02
      title: Three Days with the Flock
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            On his first day as herdsman, the fox ate every one of the woman's goats. On the second day, he finished off all her sheep. And on the third day, he ate all her cattle too.
        - id: ch02-b02
          speaker: narrator
          text: >-
            When the fox came home that evening, the woman wanted to know what had become of every flock she owned.
        - id: ch02-b03
          speaker: woman
          text: What have you done with all my flocks?
        - id: ch02-b04
          speaker: fox
          text: Their skulls are in the stream, and their bodies are in the woods.
    - id: ch03
      title: The Cream and the Fox's Tail
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            The woman was standing at her churn when the fox told her this. She thought she had better go and see what had happened to her flock, so she stepped outside.
        - id: ch03-b02
          speaker: narrator
          text: >-
            While she was gone, the fox crept into the churn and ate the cream. When the woman came back and saw what he had done, she flew into a rage.
        - id: ch03-b03
          speaker: narrator
          text: >-
            The fox ran off. The woman snatched up the tiny bit of cream that remained and hurled it after him. A dab struck the very end of his tail.
        - id: ch03-b04
          speaker: narrator
          text: >-
            And that is why, to this day, the fox has a white tip on his brush.
