audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: thoughtful and gently wry
        timbre: warm and clear
        pace: measured
        pitch: medium
    husband:
      display_name: The Husband
      tts:
        delivery: eager and self-important
        timbre: firm and rustic
        pace: measured
        pitch: medium-low
    wife:
      display_name: The Wife
      tts:
        delivery: brisk and showy
        timbre: bright and sturdy
        pace: lively
        pitch: medium
    daughter:
      display_name: The Daughter
      tts:
        delivery: prim and put-upon
        timbre: light and clear
        pace: measured
        pitch: medium-high
  chapters:
    - id: ch01
      title: The Wooer Comes to the Farm
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            Once there was a young man who went looking for a wife. In time, his search brought him to a farmhouse. The family who lived there had next to nothing, but when the wooer stepped inside, they were determined to look prosperous.
        - id: ch01-b02
          speaker: narrator
          text: The husband had one new sleeve on his coat.
        - id: ch01-b03
          speaker: husband
          text: Please, sit down. The house is terribly dusty.
        - id: ch01-b04
          speaker: narrator
          text: >-
            He began wiping every bench and table with that new sleeve. All the while, he kept his other arm hidden behind his back.
    - id: ch02
      title: The Wife's New Shoe
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            The wife had one new shoe. She stamped and slid that shoe against the stools and chairs as she went around the room.
        - id: ch02-b02
          speaker: wife
          text: What a mess this house is! Nothing is where it belongs!
        - id: ch02-b03
          speaker: narrator
          text: Then the husband and wife called for their daughter to come downstairs and set everything straight.
    - id: ch03
      title: The Daughter's New Cap
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            Their daughter had a new cap. She poked her head through the doorway and kept nodding, first to one side, then to the other.
        - id: ch03-b02
          speaker: daughter
          text: Well, I can't be in every place at the same time.
        - id: ch03-b03
          speaker: narrator
          text: Oh yes, the wooer had found himself a very prosperous household indeed.
