audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 从容而清醒，带一点克制的诙谐
        timbre: 温厚清晰
        pace: 舒缓有致
        pitch: 中低
    husband:
      display_name: 丈夫
      tts:
        delivery: 殷勤做作，急着显摆
        timbre: 朴实偏厚
        pace: 中等
        pitch: 中低
    wife:
      display_name: 妻子
      tts:
        delivery: 忙乱夸张，刻意装腔
        timbre: 清亮结实
        pace: 中等偏快
        pitch: 中高
    daughter:
      display_name: 女儿
      tts:
        delivery: 自以为忙碌，语气理直气壮
        timbre: 年轻清脆
        pace: 中等
        pitch: 中高
  chapters:
    - id: ch01
      title: 求亲来到农家
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 从前，有个小伙子出门求亲，想给自己寻一位妻子。他一路去过不少地方，有一天来到一户农家。这家人穷得几乎和叫花子一样。可是求亲人一进门，他们偏要让客人相信，自家的日子过得很宽裕。那家的丈夫刚给外套接上了一只新袖子。
        - id: ch01-b02
          speaker: husband
          text: 快请坐吧。只是我们这屋里的灰尘，实在多得吓人。
    - id: ch02
      title: 一只袖子和一只鞋
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 丈夫说完，便拿那只新袖子四处擦起来。长凳也擦，桌子也抹。至于另一只胳膊，他从头到尾都藏在背后，不肯露出来。
        - id: ch02-b02
          speaker: narrator
          text: 妻子呢，刚刚添了一只新鞋。她也忙着显摆，穿着那只鞋在凳脚和椅脚上又跺又蹭。
        - id: ch02-b03
          speaker: wife
          text: 你瞧，家里怎么乱成这样！没有一样东西放对了地方！
    - id: ch03
      title: 一顶新帽子
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 夫妻俩随后高声叫女儿下楼，让她把屋子收拾一下。可女儿也有自己的新东西。她刚得了一顶新帽子，便只把脑袋探进门里，一会儿往左点，一会儿往右点，点个没完。
        - id: ch03-b02
          speaker: daughter
          text: 要我说，我又不能一下子把每个地方都照顾到呀。
        - id: ch03-b03
          speaker: narrator
          text: 可不是嘛，可不是嘛！这位求亲人找到的，果真是一户阔绰人家。
