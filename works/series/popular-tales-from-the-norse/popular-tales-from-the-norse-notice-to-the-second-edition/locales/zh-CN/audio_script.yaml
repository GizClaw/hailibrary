audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 从容而清醒，带一点克制的诙谐
        timbre: 温厚清晰
        pace: 舒缓有致
        pitch: 中低
  chapters:
    - id: ch01
      title: 第二版说明
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 第一版的故事已经卖完了，读者又盼着第二版问世。译者想，正好趁这次机会再添十三篇，把阿斯比约恩森和穆编的那部故事集全部译完。《导言》也该充实一下，补进一些新材料，再把第一版里只勾了个轮廓的几处问题说得更透彻些。
        - id: ch01-b02
          speaker: narrator
          text: 这本书很受欢迎，各方还写来了许多亲切而有见地的评论，译者似乎应该在这里回应几句。尽责不一定总叫人愉快，这件事做起来倒毫无苦处。因为他读到的评论没有一篇例外，都让他确信，自己祈求遇见“宽厚”读者的愿望当真实现了。至于第一版对民间故事的起源和流传提出的那些看法，他希望大家原谅他的直率。直到现在，他仍没找到充分的理由去改变，甚至稍稍修正它们。支持这些看法的人已经说了很多。反对意见只有一两处，语气很和善，也很有风趣，却没能动摇他经过多年钻研才郑重写下的信念。更何况，那些把一生献给这门学问的研究者，也用考证和赞同支持着这些判断。
        - id: ch01-b03
          speaker: narrator
          text: 如今，译者又到了第二次向读者告别的时候。他要学一学书中某篇故事里的好教母，不许好孩子去读全书最后两篇。不过，两人的处境不大一样。养女一回来，教母就发现了她做过的事。可要是哪个坏孩子不听译者的话，他是永远不会知道的。即使这样，他还是希望读这本书的好孩子都记住，违背禁令就是不对，没人发现也不会让过错少上一分。说完这些，他要向孩子们道别了。他相信，没有哪个好孩子敢朝那两个房间里偷看。听了警告还偏要探头进去，也许真会看见什么叫自己吃惊的东西。
        - id: ch01-b04
          speaker: narrator
          text: 有位成年读者要问了：“既然这样，为什么还把它们印出来？”因为这本书不只给孩子看，也给成年人看。只要你睁着眼睛在世上走过一小段路，就会发现，比这更叫人吃惊的事到处都有，甚至每天都能碰见。还因为那两篇故事的精神并不败坏道德，它们本身也很有价值，能让人了解当时的风俗和传统，所以实在不该删掉。少了它们，挪威原作的篇目便不完整，也就不能说所有故事都已经译出。还有一个同样重要的理由。译者厌恶给任何作品编什么“家庭洁本”，无论是“家庭版《圣经》”，还是家庭版莎士比亚。明明有那么多美好的内容可读，有些人却专挑粗俗或放纵的字句，盯住不放，越看越起劲。这就好比有人读《圣经》，每次都只翻《利未记》；又好比有人手里的莎士比亚，总会自己摊开在《泰尔亲王佩里克里斯》那一页。这样的读者，译者可不欢迎。
