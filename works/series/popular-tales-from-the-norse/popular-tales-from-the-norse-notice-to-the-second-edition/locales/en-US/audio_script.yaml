audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: thoughtful and gently wry
        timbre: warm and clear
        pace: measured
        pitch: medium
    grown_reader:
      display_name: Grown Reader
      tts:
        delivery: curious and direct
        timbre: clear and mature
        pace: moderate
        pitch: medium
  chapters:
    - id: ch01
      title: Notice to the Second Edition
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            The first edition of these tales has sold out, and readers have asked for a second. So the Translator has added thirteen tales. With them, his translation of Asbjörnsen and Moe's collection is complete. He has also strengthened the Introduction, adding new material and developing several points that the first edition only touched on.
        - id: ch01-b02
          speaker: narrator
          text: >-
            The book was welcomed so kindly that he feels almost bound to say something about the many thoughtful and able reviews it received. A duty is not always pleasant, but this one gives him no pain. Every review he has seen, without exception, shows that his prayer for gentle readers was fully answered.
        - id: ch01-b03
          speaker: narrator
          text: >-
            He hopes he may be forgiven for saying that he has found no good reason to change, or even soften, any of the views he gave in the first edition about where popular tales began and how they spread. Other writers have said much in support of those views. In one or two cases, critics have argued against them with perfect kindness and good humor. Yet their arguments have not outweighed convictions formed carefully through years of study, especially when those convictions are supported by the research of people who have devoted their lives to this field.
        - id: ch01-b04
          speaker: narrator
          text: >-
            Now, before the Translator says good-bye to his readers for the second time, he means to follow the example of the good godmother in one of these tales. He forbids all good children to read the final two tales in the book.
        - id: ch01-b05
          speaker: narrator
          text: >-
            There is one difference between the Translator and the godmother. She discovered what her foster daughter had done as soon as the girl returned. The Translator will never know if some naughty child disobeys him. Even so, he hopes every good child who reads this book will remember that breaking a command is just as wrong when no one finds out. And so he says good-bye, certain that no good child will dare to look into those two rooms. Anyone who peeps inside after this warning may see something shocking.
        - id: ch01-b06
          speaker: grown_reader
          text: Then why include those tales at all?
        - id: ch01-b07
          speaker: narrator
          text: >-
            Because the book is for grown readers as well as children. If you have gone even a little way into the world with your eyes open, you must have seen things far more shocking every day. The spirit of these tales is not immoral. They also have real value because they show old customs and traditions, so they could not properly be omitted. And they complete the set of Norse originals, leaving none untranslated.
        - id: ch01-b08
          speaker: narrator
          text: >-
            Last, but certainly not least, the Translator cannot stand family versions of anything, whether they are called Family Bibles or Family Shakespeares. Some readers have a great store of beauty before them, yet choose only a coarse passage or a free expression and linger over it. They are like people who read the Bible but always turn to Leviticus, or whose Shakespeare falls open by itself at Pericles, Prince of Tyre.
        - id: ch01-b09
          speaker: narrator
          text: The Translator does not want readers of that kind.
