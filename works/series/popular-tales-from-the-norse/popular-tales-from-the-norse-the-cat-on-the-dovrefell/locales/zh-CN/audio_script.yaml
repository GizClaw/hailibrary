audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 从容而清醒，带一点克制的诙谐
        timbre: 温厚清晰
        pace: 舒缓有致
        pitch: 中低
    traveler:
      display_name: 赶路人
      tts:
        delivery: 坦然坚定，不慌不忙
        timbre: 朴实沉稳
        pace: 中等
        pitch: 中低
    halvor:
      display_name: 哈尔沃
      tts:
        delivery: 直爽诚恳，玩笑时镇定自若
        timbre: 厚实明亮
        pace: 中等
        pitch: 中等
    little_troll:
      display_name: 小山怪
      tts:
        delivery: 顽皮尖刻，受惊时慌张急促
        timbre: 尖细清脆
        pace: 中等偏快
        pitch: 高
    troll_in_woods:
      display_name: 林中的山怪
      tts:
        delivery: 隔着远处高声喊叫，胆怯又戒备
        timbre: 粗哑空阔
        pace: 中等
        pitch: 中低
  chapters:
    - id: ch01
      title: 圣诞前夜来借宿
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 从前，芬马克有个人捉到一头大白熊，准备把它献给丹麦国王。圣诞前夜，他走到多弗山，来到哈尔沃的小屋，想替自己和白熊找个过夜的地方。
        - id: ch01-b02
          speaker: halvor
          text: 我说的若有半句假话，老天就别保佑我！可今晚真不能留你。每年圣诞前夜，都会有一大群山怪下山来。它们闹得我们只能搬出去，连自己的屋子都住不成，更别说借给客人了。
        - id: ch01-b03
          speaker: traveler
          text: 原来只是这件事。那你放心把屋子借给我吧。白熊睡在炉子底下，我睡侧屋就行。
        - id: ch01-b04
          speaker: narrator
          text: 赶路人一再恳求，哈尔沃终于答应了。屋里人全都搬出去以前，还照旧给山怪备下盛宴。桌子摆得整整齐齐，上面有米粥、碱水煮鱼、香肠，也有各样好吃的，丰盛得和别的宴席没有两样。
    - id: ch02
      title: 小猫咪发威
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 食物刚刚摆好，山怪们便来了。有的高大，有的矮小。有的拖着长尾巴，有的没有尾巴，还有几个长着老长的鼻子。它们围着桌子大吃大喝，酒一杯杯地喝，每样菜都要尝尝。
        - id: ch02-b02
          speaker: narrator
          text: 一个小山怪忽然看见炉子底下躺着白熊。它用叉子戳起一截香肠，走过去，把香肠一直送到白熊鼻子前，尖声逗它。
        - id: ch02-b03
          speaker: little_troll
          text: 小猫咪，要不要吃点香肠呀？
        - id: ch02-b04
          speaker: narrator
          text: 白熊猛地站起来，怒吼一声，追着山怪们冲出屋门。无论大的小的，一个也没敢留下。
    - id: ch03
      title: 七只更凶的小猫
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 转眼到了第二年的圣诞前夜。那天下午，哈尔沃正在林子里砍过节要烧的木柴。他料想山怪们今年还会来。正干得起劲，忽然听见林中有个声音远远喊他。
        - id: ch03-b02
          speaker: troll_in_woods
          text: 哈尔沃！哈尔沃！
        - id: ch03-b03
          speaker: halvor
          text: 哎，我在这儿。
        - id: ch03-b04
          speaker: troll_in_woods
          text: 你那只大猫，现在还在你家吗？
        - id: ch03-b05
          speaker: halvor
          text: 当然在。它正躺在家里的炉子底下呢。而且呀，它已经生了七只小猫。每一只都比它们的娘更大，也更凶。
        - id: ch03-b06
          speaker: troll_in_woods
          text: 哎呀！那我们再也不去你家了！
          emotion: fearful
        - id: ch03-b07
          speaker: narrator
          text: 林子深处的山怪果然守信。从那以后，它们再也没到多弗山的哈尔沃家吃过圣诞粥。
