audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 从容而清醒，带一点克制的诙谐
        timbre: 温厚清晰
        pace: 舒缓有致
        pitch: 中低
    old_dame:
      display_name: 老太太
      tts:
        delivery: 操心而执拗，话里带着穷苦人家的直率
        timbre: 苍老温厚
        pace: 中等
        pitch: 中低
    eldest_daughter:
      display_name: 大女儿
      tts:
        delivery: 爽直坚决，拒绝时毫不含糊
        timbre: 清亮成熟
        pace: 中等
        pitch: 中
    second_daughter:
      display_name: 二女儿
      tts:
        delivery: 谨慎本分，遇事说话干脆
        timbre: 柔和清晰
        pace: 中等
        pitch: 中
    youngest_daughter:
      display_name: 小女儿
      tts:
        delivery: 沉着机敏，表面温顺，心里自有主意
        timbre: 年轻明亮
        pace: 中等
        pitch: 中高
    voice_in_rock:
      display_name: 岩缝里的声音
      tts:
        delivery: 神秘反复，像从山腹深处传来
        timbre: 空远清晰
        pace: 稍慢
        pitch: 中高
    hill_man:
      display_name: 山怪
      tts:
        delivery: 粗暴多疑，得意时笨拙，发怒时震耳欲聋
        timbre: 低沉粗粝
        pace: 中等
        pitch: 低
  chapters:
    - id: ch01
      title: 母鸡跑进山里了
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 从前，有个年老的寡妇带着三个女儿，远离人烟，住在一座山坡底下。她穷得很，家里除了那只母鸡，再没有别的牲畜。可她把这只鸡看得比眼珠子还宝贵。母鸡整天跟在脚边咯咯叫，她也整天围着母鸡打转。可有一天，母鸡忽然不见了。老太太走出门，绕着小屋找了一圈又一圈，嘴里不停地唤着，还是怎么也唤不回来。
        - id: ch01-b02
          speaker: old_dame
          text: 你出去找找咱们的母鸡。不管它躲到哪里，哪怕钻进山肚子里，也得把它捉回来。
        - id: ch01-b03
          speaker: narrator
          text: 大女儿很愿意去。她出了门，来来回回走了许多地方，一路寻找，一路呼唤，却始终不见母鸡。眼看就要放弃，岩石缝里忽然传出一个声音。
        - id: ch01-b04
          speaker: voice_in_rock
          text: 你家的母鸡跑进山里啦！你家的母鸡跑进山里啦！
        - id: ch01-b05
          speaker: narrator
          text: 大女儿觉得奇怪，便走进石缝，想看个究竟。谁知一只脚才踏进去，就踩中一道活板门，深深地坠下去，直落到地底的一座洞府。到了下面，她穿过一间又一间屋子，每一间都比前一间华美。来到最里面那间，一个又高大又丑陋的山怪迎了上来。
        - id: ch01-b06
          speaker: hill_man
          text: 你愿意做我的心上人吗？
        - id: ch01-b07
          speaker: eldest_daughter
          text: 不，我不愿意！我只想回到地面，去找那只丢失的母鸡。
        - id: ch01-b08
          speaker: narrator
          text: 大女儿无论如何也不肯跟他好，只想尽快回到地面，再去寻找母鸡。山怪顿时大发雷霆，一把举起她，拧断她的脖子，把脑袋和身子一并扔进地窖。
        - id: ch01-b09
          speaker: narrator
          text: 这一切发生的时候，母亲还坐在家里等着。她等了又等，大女儿始终没有回来。又过了好一阵，既没听见女儿的声音，也没看见她的影子，只好叫二女儿出去找姐姐。
        - id: ch01-b10
          speaker: old_dame
          text: 你去看看姐姐怎么了，顺路也唤一唤咱们的母鸡。
        - id: ch01-b11
          speaker: narrator
          text: 二女儿只得上路。她四处寻找，四处呼唤，也在岩缝前听见那句奇怪的话。她走过去查看，同样穿过活板门，深深地落进地下洞府。她从一间屋走到另一间屋，到了最里面，山怪问她愿不愿意做他的心上人。她不肯，只想回到地面，继续找那只丢失的母鸡。山怪发了怒，又拧断她的脖子，把脑袋和身子扔进地窖。
        - id: ch01-b12
          speaker: narrator
          text: 老太太等二女儿，横等七回，竖等七回，还是没有一点消息。她只好对小女儿开口。
        - id: ch01-b13
          speaker: old_dame
          text: 这回你非走一趟不可。丢了母鸡已经够傻，要是连两个姐姐也丢了，那就更傻了。去找找她们，顺便再唤一唤母鸡。
        - id: ch01-b14
          speaker: narrator
          text: 原来到了这时候，老太太心里还惦记着她的鸡。小女儿也很愿意去。她到处寻找姐姐，又一路呼唤母鸡，可既看不见她们，也听不到半点动静。最后，她同样来到岩石缝前。
        - id: ch01-b15
          speaker: voice_in_rock
          text: 你家的母鸡跑进山里啦！你家的母鸡跑进山里啦！
    - id: ch02
      title: 山怪的心上人
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 小女儿觉得这声音古怪，也走进岩缝看个究竟，结果同样从活板门直落到洞府。到了下面，她从一间屋走到另一间屋，每一间都比前一间华丽。她一点也不害怕，只管慢慢地四处察看。东瞧瞧，西看看，她忽然发现通往地窖的门。低头一望，两个姐姐竟都死在下面。她刚把门砰的一声合上，山怪就来了。
        - id: ch02-b02
          speaker: hill_man
          text: 你愿意做我的心上人吗？
        - id: ch02-b03
          speaker: youngest_daughter
          text: 我一百个愿意。
        - id: ch02-b04
          speaker: narrator
          text: 她已经看明白姐姐们为何送了命。山怪听见她答应，却高兴极了，立刻拿来世上最漂亮的衣裳。从此不论衣服还是别的东西，姑娘想要什么，只要开口就能得到。竟然有人肯做他的心上人，山怪欢喜得不得了。过了一阵，有一天，姑娘显得格外伤心，比平日更加垂头丧气。山怪便问她究竟出了什么事，为什么这样闷闷不乐。
        - id: ch02-b05
          speaker: youngest_daughter
          text: 我不能回家看母亲，心里难过。她一定缺吃少喝，身边又一个人也没有。
          emotion: sad
        - id: ch02-b06
          speaker: hill_man
          text: 我不能让你回去。不过你把吃的喝的装进口袋，我替你送给她。
        - id: ch02-b07
          speaker: narrator
          text: 姑娘连声道谢。她先往袋底塞进许多金银，再在金银上面盖一点食物。口袋装好以后，她特意叮嘱山怪，路上千万不许偷看。山怪答应下来，背着口袋出发。姑娘留在洞府里，隔着活板门的一道缝隙往外看。果然，没走多远，山怪就嫌口袋太沉。
        - id: ch02-b08
          speaker: hill_man
          text: 我得看看，这里面到底装了什么。
        - id: ch02-b09
          speaker: narrator
          text: 他正要解开袋口，山里的姑娘马上朝他喊起来。
        - id: ch02-b10
          speaker: youngest_daughter
          text: 你在做什么，我全看见啦！你在做什么，我全看见啦！
        - id: ch02-b11
          speaker: hill_man
          text: 见鬼，你还真看得见！你这双眼睛也太尖了！
          emotion: surprised
        - id: ch02-b12
          speaker: narrator
          text: 山怪把口袋重新甩到肩上，再也不敢偷看，只好老老实实继续赶路。他一路背到寡妇的小屋，到了门前，便把沉甸甸的口袋从门口扔进去。
        - id: ch02-b13
          speaker: hill_man
          text: 这是你女儿送来的吃食和饮料。她什么都不缺。
        - id: ch02-b14
          speaker: narrator
          text: 姑娘又在山里住了很久。一天，一只公山羊忽然从活板门掉下来。山怪看见这个不速之客，顿时气得要命。
        - id: ch02-b15
          speaker: hill_man
          text: 谁叫你来的？你这长胡子的畜生！
          emotion: angry
        - id: ch02-b16
          speaker: narrator
          text: 他一把抓起公山羊，拧断它的脖子，又把脑袋和身子一并扔进地窖。
        - id: ch02-b17
          speaker: youngest_daughter
          text: 你为什么要杀它？我本来可以留它在这里陪我玩。
        - id: ch02-b18
          speaker: hill_man
          text: 别为这点事难过。我马上就能让它重新活过来。
        - id: ch02-b19
          speaker: narrator
          text: 山怪取下墙上挂着的一只瓶子，把公山羊的脑袋安回身上，再用瓶里的药膏往断口一抹。公山羊立刻恢复原样，又和先前一样活蹦乱跳起来。姑娘在一旁，把每一步都看得清清楚楚。
        - id: ch02-b20
          speaker: youngest_daughter
          text: 哈，原来这只瓶子真是个难得的宝贝。
    - id: ch03
      title: 口袋里的秘密
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 姑娘又耐心等了一阵，终于等到山怪出门。她马上从地窖抱出大姐，把姐姐的脑袋安回肩上，再照山怪救活山羊的办法，用瓶里的药膏往断口一抹。转眼之间，大姐就活了。姑娘把她藏进口袋，再在上面放一点食物。山怪一回来，她便请他再去给母亲送一趟。
        - id: ch03-b02
          speaker: youngest_daughter
          text: 亲爱的朋友，母亲一定又饥又渴，还孤零零的没人陪。劳烦你把这点吃的送去，可千万别看口袋里面。
        - id: ch03-b03
          speaker: narrator
          text: 山怪答应替她送去，也保证绝不偷看。可走出一小段路，他就觉得袋子沉得吓人。再往前走了一阵，他又动了偷看的念头。
        - id: ch03-b04
          speaker: hill_man
          text: 不管会怎样，我非看看不可。她眼睛再尖，也看不到这么远。
        - id: ch03-b05
          speaker: narrator
          text: 山怪刚要解开袋口，藏在里面的大女儿就喊了起来。
        - id: ch03-b06
          speaker: eldest_daughter
          text: 你在做什么，我全看见啦！你在做什么，我全看见啦！
        - id: ch03-b07
          speaker: hill_man
          text: 见鬼，你还真看得见！你的眼睛可真够尖的。
          emotion: surprised
        - id: ch03-b08
          speaker: narrator
          text: 他一直以为说话的是留在山里的姑娘，于是连瞧一眼也不敢，只管用最快的速度赶路。他把口袋一直背到姑娘母亲家，到了小屋门前，又从门里扔了进去。
        - id: ch03-b09
          speaker: hill_man
          text: 这是你女儿送来的吃食和饮料。她什么都不缺。
        - id: ch03-b10
          speaker: narrator
          text: 又过了很久，姑娘用同样的办法救二姐。她把姐姐的脑袋安回肩上，抹上瓶里的药膏，让她重新活过来，再把她藏进口袋。这一回，她还把口袋能装下的金银全塞了进去，只在最上面盖了少许食物。
        - id: ch03-b11
          speaker: youngest_daughter
          text: 亲爱的朋友，请你再给我母亲送一点吃的。记住，不许往口袋里看。
        - id: ch03-b12
          speaker: narrator
          text: 山怪很乐意照她的意思去办，也保证绝不偷看。可没走多久，他就觉得口袋沉得吓人。再走一阵，他已经被压得摇摇晃晃，几乎迈不动步子。他只好把袋子放下，正要解开绳子朝里面看，藏在里面的二女儿大声喊道：
        - id: ch03-b13
          speaker: second_daughter
          text: 你在做什么，我全看见啦！你在做什么，我全看见啦！
        - id: ch03-b14
          speaker: hill_man
          text: 见鬼，你还真看得见！你这双眼睛可真够尖的。
          emotion: surprised
        - id: ch03-b15
          speaker: narrator
          text: 山怪再也不敢偷看，只好尽可能加快脚步，把口袋径直背到姑娘母亲那里。到了小屋门前，他又把袋子从门口扔了进去。
        - id: ch03-b16
          speaker: hill_man
          text: 这是你女儿送来的食物。她什么都不缺。
    - id: ch04
      title: 稻草姑娘
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 姑娘又在山里住了很久。一天，山怪打定主意，要在外面待上一整天。她便装成有气无力、病恹恹的样子，撅着嘴，不停地发愁。
        - id: ch04-b02
          speaker: youngest_daughter
          text: 夜里十二点以前，你回来也没用。我病得厉害，那时候以前肯定预备不好晚饭。
        - id: ch04-b03
          speaker: narrator
          text: 等山怪走得远远的，姑娘往自己的几件衣服里塞满稻草，把这个稻草姑娘竖在壁炉旁边的角落，手里插上一把扫帚。远远看去，真像她本人站在那里。随后，她偷偷逃回家，又请来一名神枪手，让他留在母亲的小屋里。
        - id: ch04-b04
          speaker: narrator
          text: 钟敲十二点前后，山怪回来了。他一进门，就朝稻草姑娘要东西吃。
        - id: ch04-b05
          speaker: hill_man
          text: 给我拿点吃的来。
        - id: ch04-b06
          speaker: narrator
          text: 稻草姑娘一个字也没回答。
        - id: ch04-b07
          speaker: hill_man
          text: 我叫你拿吃的来！我都快饿死了。
        - id: ch04-b08
          speaker: narrator
          text: 她还是一句话也不说。
        - id: ch04-b09
          speaker: hill_man
          text: 给我拿吃的来！把耳朵打开，听清楚我说的话，不然我可要叫你醒醒了！
          emotion: angry
        - id: ch04-b10
          speaker: narrator
          text: 稻草姑娘依旧一动不动。山怪顿时暴跳如雷，抬手狠狠扇了她一巴掌，稻草一下飞得满屋都是。他这才明白自己上了当，连忙到处搜寻。最后，他跑进地窖，发现两个姐姐也不见了，马上弄清了事情的原委。他拔腿朝小屋追去，一路吼着：
        - id: ch04-b11
          speaker: hill_man
          text: 看我怎么收拾她！
          emotion: angry
        - id: ch04-b12
          speaker: narrator
          text: 山怪刚赶到小屋，守在里面的神枪手就朝他放了一枪。山怪把枪声当成雷声，吓得不敢进门，只好转身往回飞奔，双腿能跑多快就跑多快。谁知就在他赶到活板门前的那一刻，太阳升起来了。山怪砰的一声，整个炸裂开来。
        - id: ch04-b13
          speaker: narrator
          text: 唉，要是有人知道那道活板门究竟在哪里，我敢说，底下一定还堆着一大堆金子和银子呢！
