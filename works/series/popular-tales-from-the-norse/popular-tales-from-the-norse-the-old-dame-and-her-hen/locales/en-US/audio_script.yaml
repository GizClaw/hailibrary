  chapters:
    - id: ch01
      title: The Hen Inside the Hill
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            Once there was an old widow who lived far from everyone else, beneath a hillside, with her three daughters. She was terribly poor. The only animal she owned was one hen, and she treasured it like the apple of her eye. The hen was forever cackling at her heels, and the widow was forever running after it. Then one day the hen vanished. The old dame searched all around the cottage, looking and calling, but the bird was gone and would not come back.
        - id: ch01-b02
          speaker: old_dame
          text: >-
            You must go and find our hen. We have to bring her back, even if you must fetch her out of the hill itself.
        - id: ch01-b03
          speaker: narrator
          text: >-
            The eldest daughter willingly set out. She walked this way and that, searching everywhere and calling for the hen. Still she found nothing. She was just about to give up the whole search when she heard someone calling from a cleft in the rock.
        - id: ch01-b04
          speaker: voice_in_the_cleft
          text: >-
            Your hen goes tripping inside the hill! Your hen goes tripping inside the hill!
        - id: ch01-b05
          speaker: narrator
          text: >-
            She stepped into the cleft to find out what was calling. She had hardly put one foot inside when a trapdoor gave way beneath her. Down she fell, deep, deep into an underground vault. When she reached the bottom, she passed through many rooms, and each one was finer than the last. In the innermost room of all, a great ugly man of the hill-folk came toward her.
        - id: ch01-b06
          speaker: man_of_the_hill
          text: >-
            Will you be my sweetheart?
        - id: ch01-b07
          speaker: eldest_daughter
          text: >-
            No, I will not! I want nothing from you. I only want to get above ground and find our lost hen.
        - id: ch01-b08
          speaker: narrator
          text: >-
            She would not have him at any price. The Man of the Hill flew into a rage. He seized her, wrung off her head, and threw her head and body into the cellar.
        - id: ch01-b09
          speaker: narrator
          text: >-
            Meanwhile, her mother sat at home, waiting and waiting. No daughter returned. The old dame waited a little longer, but she neither heard nor saw anything of her. At last she sent out her middle daughter to see what had happened to her sister.
        - id: ch01-b10
          speaker: old_dame
          text: >-
            And while you're out, call for our hen as well.
        - id: ch01-b11
          speaker: narrator
          text: >-
            The same thing happened to the second sister. She searched and called until she heard the voice coming from the rocky cleft.
        - id: ch01-b12
          speaker: voice_in_the_cleft
          text: >-
            Your hen goes tripping inside the hill! Your hen goes tripping inside the hill!
        - id: ch01-b13
          speaker: narrator
          text: >-
            Wondering what the strange voice could be, she went inside to see. She too dropped through the trapdoor, deep, deep into the vault. At the bottom she crossed one room after another until the Man of the Hill met her in the innermost room of all.
        - id: ch01-b14
          speaker: man_of_the_hill
          text: >-
            Will you be my sweetheart?
        - id: ch01-b15
          speaker: second_daughter
          text: >-
            No, I won't. Let me above ground again. I must look for our lost hen.
        - id: ch01-b16
          speaker: narrator
          text: >-
            Again the Man of the Hill grew angry. He wrung off her head and cast her head and body into the cellar.
        - id: ch01-b17
          speaker: narrator
          text: >-
            The old dame waited seven lengths and seven breadths, yet saw and heard nothing of her second daughter. Then she turned to the youngest.
        - id: ch01-b18
          speaker: old_dame
          text: >-
            Now you truly must go and look for your sisters. Losing the hen was foolish enough, but losing both your sisters would be more foolish still. You can call for the hen while you're there.
        - id: ch01-b19
          speaker: narrator
          text: >-
            Even then, the old dame's heart was set on that hen.
    - id: ch02
      title: The Youngest Daughter
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            The youngest daughter set off at once. She walked up and down, looking for her sisters and calling the hen, but she could neither see nor hear any of them. At last she reached the cleft in the rock. There she heard something calling.
        - id: ch02-b02
          speaker: voice_in_the_cleft
          text: >-
            Your hen goes tripping inside the hill! Your hen goes tripping inside the hill!
        - id: ch02-b03
          speaker: narrator
          text: >-
            That seemed very strange, so she went closer to discover what it was. Down she fell through the trapdoor, deep, deep into the vault. When she reached the bottom, she moved from room to room, and every room was grander than the one before. But she felt no fear at all. She took her time and looked closely around her. While peeping into this place and that, she noticed the trapdoor to the cellar. She opened it, looked down, and saw both her sisters lying dead below. She had only just slammed the door shut when the Man of the Hill appeared.
        - id: ch02-b04
          speaker: man_of_the_hill
          text: >-
            Will you be my sweetheart?
        - id: ch02-b05
          speaker: youngest_daughter
          text: >-
            With all my heart.
        - id: ch02-b06
          speaker: narrator
          text: >-
            She had understood very well what had happened to her sisters, and that was why she answered as she did. Her answer delighted the Man of the Hill. He brought her the finest clothes in the world. She had only to ask for something, whether clothes or anything else she wanted, and he gave it to her. He was overjoyed that anyone would agree to be his sweetheart.
        - id: ch02-b07
          speaker: narrator
          text: >-
            After she had lived there for a while, she seemed more sad and downcast than usual one day. The Man of the Hill asked what troubled her.
        - id: ch02-b08
          speaker: youngest_daughter
          text: >-
            Oh, it's because I can't visit my mother. I know she has hardly any food or drink, and there's no one with her.
          emotion: sad
        - id: ch02-b09
          speaker: man_of_the_hill
          text: >-
            I can't allow you to visit her. But fill a sack with food and drink, and I'll carry it to her myself.
        - id: ch02-b10
          speaker: youngest_daughter
          text: >-
            Yes, thank you. I'll do that.
        - id: ch02-b11
          speaker: narrator
          text: >-
            At the bottom of the sack, the girl packed a great deal of gold and silver. She covered it with a little food, then told the Man of the Hill the sack was ready.
        - id: ch02-b12
          speaker: youngest_daughter
          text: >-
            You must promise not to look inside.
        - id: ch02-b13
          speaker: narrator
          text: >-
            He promised and started away. The girl watched him through a crack in the trapdoor. After he had walked some distance, he stopped.
        - id: ch02-b14
          speaker: man_of_the_hill
          text: >-
            This sack is terribly heavy. I'll have a look and see what's in it.
        - id: ch02-b15
          speaker: narrator
          text: >-
            He was about to loosen the sack when the girl called after him.
        - id: ch02-b16
          speaker: youngest_daughter
          text: >-
            I see what you're doing! I see what you're doing!
        - id: ch02-b17
          speaker: man_of_the_hill
          text: >-
            The deuce you do! You must have amazingly sharp eyes.
          emotion: surprised
        - id: ch02-b18
          speaker: narrator
          text: >-
            He swung the sack back over his shoulder and did not dare try to look again. He carried it all the way to the widow's cottage. When he arrived, he tossed the heavy sack in through the cottage door.
        - id: ch02-b19
          speaker: man_of_the_hill
          text: >-
            Here's food and drink from your daughter. She has everything she needs.
    - id: ch03
      title: The Flask on the Wall
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            The girl stayed inside the hill for a good while longer. Then one day a billy goat tumbled through the trapdoor.
        - id: ch03-b02
          speaker: man_of_the_hill
          text: >-
            Who asked you to come here, you long-bearded beast?
          emotion: angry
        - id: ch03-b03
          speaker: narrator
          text: >-
            In a dreadful rage, the Man of the Hill snatched up the goat, wrung off its head, and threw it into the cellar.
        - id: ch03-b04
          speaker: youngest_daughter
          text: >-
            Oh, why did you do that? The goat could have kept me company down here.
        - id: ch03-b05
          speaker: man_of_the_hill
          text: >-
            There's no need to look so miserable. I can bring the billy goat back to life in no time.
        - id: ch03-b06
          speaker: narrator
          text: >-
            A flask hung against the wall. The Man of the Hill took it down, set the billy goat's head back on its body, and rubbed the joined place with some ointment from the flask. At once the goat sprang back to life, as well and lively as it had ever been.
        - id: ch03-b07
          speaker: youngest_daughter
          text: >-
            Ho, ho! That flask is worth having.
        - id: ch03-b08
          speaker: narrator
          text: >-
            Some time later, she waited until the Man of the Hill was away. Then she brought her eldest sister from the cellar. She placed the head back on the sister's shoulders and rubbed on the ointment, exactly as she had seen him do with the goat. In a moment, her sister came back to life. The girl hid her inside a sack and spread a little food over her. As soon as the Man of the Hill returned, she spoke to him.
        - id: ch03-b09
          speaker: youngest_daughter
          text: >-
            Dear friend, please take my mother another little bit of food. The poor woman must be hungry and thirsty, and she's all alone. But remember, you mustn't look in the sack.
        - id: ch03-b10
          speaker: narrator
          text: >-
            He agreed to carry it, and once more he promised not to look. After walking a little way, he felt how terribly heavy the sack was. A little farther on, he began talking to himself.
        - id: ch03-b11
          speaker: man_of_the_hill
          text: >-
            Whatever happens, I have to see what's in here. Her eyes may be sharp, but she can't see me from all this way off.
        - id: ch03-b12
          speaker: narrator
          text: >-
            Just as he reached for the string, the eldest sister called from inside the sack.
        - id: ch03-b13
          speaker: eldest_daughter
          text: >-
            I see what you're doing! I see what you're doing!
        - id: ch03-b14
          speaker: man_of_the_hill
          text: >-
            The deuce you do! Those eyes of yours must be fearfully sharp.
          emotion: surprised
        - id: ch03-b15
          speaker: narrator
          text: >-
            All the while, he thought the voice belonged to the youngest daughter back inside the hill. He no longer cared to risk even one peep into the sack. Instead, he carried it straight to the girl's mother as fast as he could. At the cottage door, he flung the sack inside and shouted.
        - id: ch03-b16
          speaker: man_of_the_hill
          text: >-
            Here's food and drink from your daughter. She has everything she needs.
    - id: ch04
      title: The Second Sister Comes Home
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            After she had spent another long stretch of time inside the hill, the girl did the same for her second sister. She fitted the head to the sister's shoulders, rubbed on the ointment from the flask, and restored her to life. Then she put her sister in the sack. This time, she also packed in all the gold and silver the sack could carry, with only a little food laid over the top.
        - id: ch04-b02
          speaker: youngest_daughter
          text: >-
            Dear friend, you really must hurry to my mother with a little more food. And be sure you don't look inside the sack.
        - id: ch04-b03
          speaker: narrator
          text: >-
            The Man of the Hill readily agreed to do as she wished. He gave his word that he would not look. But before he had gone far, the sack began to feel terribly heavy. Farther down the road, he could scarcely stagger beneath its weight. At last he set it on the ground and was just about to untie the string and look inside.
        - id: ch04-b04
          speaker: second_daughter
          text: >-
            I see what you're doing! I see what you're doing!
        - id: ch04-b05
          speaker: man_of_the_hill
          text: >-
            The deuce you do! You must have very sharp eyes indeed.
          emotion: surprised
        - id: ch04-b06
          speaker: narrator
          text: >-
            Once again he dared not look. He made all the haste he could and carried the sack straight to the girl's mother. At the cottage door, he threw it inside and roared.
        - id: ch04-b07
          speaker: man_of_the_hill
          text: >-
            Here's food from your daughter. She has everything she needs.
    - id: ch05
      title: The Straw Girl
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: >-
            The youngest daughter remained in the hill a good while longer. Then one day the Man of the Hill decided to go out until night. The girl pretended to be ill and unhappy. She pouted and complained.
        - id: ch05-b02
          speaker: youngest_daughter
          text: >-
            Don't come home before midnight. I feel so sick and poorly that I can't have your supper ready any sooner.
        - id: ch05-b03
          speaker: narrator
          text: >-
            Once the Man of the Hill was well away, she filled some of her clothes with straw. She propped the straw girl beside the chimney and put a broom in its hand, so it looked as though she were standing there herself. Then she slipped away to her mother's cottage and brought in a sharpshooter to stay with them.
        - id: ch05-b04
          speaker: narrator
          text: >-
            At about twelve o'clock, the Man of the Hill came home. He spoke first to the figure by the chimney.
        - id: ch05-b05
          speaker: man_of_the_hill
          text: >-
            Bring me something to eat.
        - id: ch05-b06
          speaker: narrator
          text: >-
            The straw girl said nothing.
        - id: ch05-b07
          speaker: man_of_the_hill
          text: >-
            I said, bring me something to eat! I'm nearly starving.
          emotion: angry
        - id: ch05-b08
          speaker: narrator
          text: >-
            Still she gave him no answer.
        - id: ch05-b09
          speaker: man_of_the_hill
          text: >-
            Bring me something to eat! You'd better open your ears and listen, or I'll wake you up myself!
          emotion: angry
        - id: ch05-b10
          speaker: narrator
          text: >-
            The figure stood as still as before. The Man of the Hill flew into a rage and struck it such a slap across the face that straw scattered all through the room. Then he knew he had been tricked. He began hunting everywhere for the girl. At last he searched the cellar and found that both her sisters were gone as well. Now he understood how the whole trick had worked, and he raced toward the cottage.
        - id: ch05-b11
          speaker: man_of_the_hill
          text: >-
            I'll soon make her pay for this!
          emotion: angry
        - id: ch05-b12
          speaker: narrator
          text: >-
            But when he reached the cottage, the sharpshooter fired his gun. The Man of the Hill thought the great sound was thunder, and he dared not go inside the house. He turned for home and fled as fast as his legs could carry him. But just as he reached the trapdoor, the sun rose, and the Man of the Hill burst.
        - id: ch05-b13
          speaker: narrator
          text: >-
            Oh, if only someone knew where that trapdoor was. I dare say there's still a whole heap of gold and silver down there.
