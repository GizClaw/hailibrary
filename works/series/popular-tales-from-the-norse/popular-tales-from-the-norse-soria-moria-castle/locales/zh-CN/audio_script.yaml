  chapters:
    - id: ch01
      title: 通往第一座城堡
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 从前，一对穷苦夫妻有个儿子，名叫哈尔沃。他从小什么活也不肯干，只爱坐在炉边扒拉灰烬。父母送他出去学过一门又一门手艺，他每次只待一两天，就从师傅那里逃回家，重新坐到壁炉前拨弄余烬。
        - id: ch01-b02
          speaker: narrator
          text: 有一天，一位船长来到这里，问哈尔沃愿不愿跟他出海，到陌生的国度开开眼界。哈尔沃很喜欢这个主意，没多久便收拾好东西，上了船。
        - id: ch01-b03
          speaker: narrator
          text: 他们航行了多久，谁也说不清。后来，一场大风暴迎头袭来，把船吹得偏离航路。等风暴过去，海面重新安静，众人发现自己停在一片陌生海岸旁。船上的人没有一个认得这是什么地方。偏偏海面连一丝风也没有，船想走也走不了，只好困在那里。
        - id: ch01-b04
          speaker: halvor
          text: 让我上岸看看吧。我宁可出去走走，也不想躺在这里睡觉。
        - id: ch01-b05
          speaker: skipper
          text: 你看看自己这副样子，怎么出去见人？浑身上下只剩这些破布条了。
        - id: ch01-b06
          speaker: narrator
          text: 哈尔沃怎么也不改主意。船长只好准他上岸，又再三叮嘱，只要风一起，必须马上回来。哈尔沃走进一片美丽富饶的土地，所到之处都是大片平坦的麦田和肥美的草地，却始终不见一个活人。后来风已经起来了，他仍觉得自己没看够，想再往前走走，看看能不能找到住在这里的人。
        - id: ch01-b07
          speaker: narrator
          text: 走了一阵，他来到一条宽阔的大道上。路面又平又滑，连鸡蛋也能一路滚过去。哈尔沃顺着大道一直走到傍晚。远处出现一座巨大的城堡，在最后的阳光里闪闪发亮。他没有带半点食物，又整整走了一天，早已饿得前胸贴后背。可是城堡越来越近，他心里的害怕也越来越重。
        - id: ch01-b08
          speaker: narrator
          text: 城堡的厨房里燃着熊熊大火。哈尔沃走进去一看，金器银器摆得到处都是，富丽堂皇得叫他目瞪口呆。他这辈子从没见过这样的厨房，可里面依然没有半个人影。他站在那里等了好一会儿，也没人出来。最后，他推开一扇门，看见一位公主独自坐在里面，手里正摇着纺车。
        - id: ch01-b09
          speaker: eldest_princess
          text: 哎呀，竟有基督徒来到这里！快逃吧，不然山怪会把你一口吞掉。他就住在这里，长着三颗脑袋。
          emotion: fearful
        - id: ch01-b10
          speaker: halvor
          text: 三颗脑袋算什么？他就是再多长四颗，我也想看看他究竟是什么模样。我没做坏事，绝不会逃。你先给我找点吃的吧，我快饿死了。
        - id: ch01-b11
          speaker: narrator
          text: 哈尔沃吃饱以后，公主让他试着挥动墙上的宝剑。他连剑也拿不起来。
        - id: ch01-b12
          speaker: eldest_princess
          text: 喝一口剑旁边那只瓶子里的酒。山怪每次用剑以前，都会先喝上一口。
        - id: ch01-b13
          speaker: narrator
          text: 哈尔沃喝了一口，立刻便能轻松挥剑。他正盼着山怪快来，门外就响起沉重的喘息声。哈尔沃赶紧躲到门后。
        - id: ch01-b14
          speaker: three_headed_troll
          text: 呼特图！好浓的基督徒血腥味！
        - id: ch01-b15
          speaker: halvor
          text: 不错，这味道马上就要叫你吃苦头了。
        - id: ch01-b16
          speaker: narrator
          text: 哈尔沃话一出口，便挥起宝剑，接连砍掉山怪所有的脑袋。公主终于重获自由，欢喜得一会儿唱，一会儿跳。可是高兴到一半，她忽然想起自己的两个姐妹，她们还各自被山怪关在遥远的城堡里。
        - id: ch01-b17
          speaker: eldest_princess
          text: 要是我的姐妹也能重获自由，那该多好！
        - id: ch01-b18
          speaker: halvor
          text: 她们在哪里？
        - id: ch01-b19
          speaker: narrator
          text: 公主把姐妹们的遭遇全告诉了哈尔沃。一个被山怪掳到五十英里外的城堡，另一个又被另一只山怪掳走，住处还要再远五十英里。哈尔沃答应去救她们。不过动身以前，大公主先请他帮忙，把眼前这具丑陋的山怪尸首弄出屋去。
    - id: ch02
      title: 三位公主重获自由
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 哈尔沃喝过神酒以后力大无穷，很快便搬走尸首，把屋子收拾得干干净净。他和大公主快快乐乐地过了一晚。第二天天刚蒙蒙亮，他又出发了，一路又走又跑，整天不肯歇息。第一次望见第二座城堡，他心里稍稍有些害怕，因为它比第一座更加宏伟。可这里仍旧不见活人。他穿过空荡荡的厨房，脚步不停，径直走进屋里。
        - id: ch02-b02
          speaker: middle_princess
          text: 这里已经很久没来过基督徒了。你快照原路逃走吧！这儿的山怪有六颗脑袋，他会把你活活吞下去。
          emotion: fearful
        - id: ch02-b03
          speaker: halvor
          text: 他就是再多六颗脑袋，我也不走。
        - id: ch02-b04
          speaker: narrator
          text: 二公主再三劝他，哈尔沃仍不害怕，只说自己赶了一天路，非得先吃饱喝足不可。公主给他拿来食物，等他吃完，又催他赶快离开。
        - id: ch02-b05
          speaker: halvor
          text: 我没做坏事，也没什么可怕的。我不会走。
        - id: ch02-b06
          speaker: middle_princess
          text: 山怪才不管你做没做坏事。他抓人从来不讲道理。既然你不肯走，就试试能不能挥动那把剑吧。
        - id: ch02-b07
          speaker: narrator
          text: 哈尔沃还是拿不动剑。公主让他喝一口旁边瓶里的酒，这一回，他也能挥动宝剑了。就在这时，山怪回来了。他的身躯又高又胖，必须侧着才能挤进门。
        - id: ch02-b08
          speaker: six_headed_troll
          text: 呼特图！好浓的基督徒血腥味！
        - id: ch02-b09
          speaker: narrator
          text: 山怪刚探进第一颗脑袋，哈尔沃便一剑砍下。后面的脑袋一颗颗伸进门，也一颗颗落到地上。二公主欣喜若狂，可转眼又想起了仍受困的姐妹，不由得把心愿说了出来。哈尔沃觉得救出她们并不难，恨不得马上动身。可他还得帮助二公主清理山怪的尸首，只能等第二天早晨再走。
        - id: ch02-b10
          speaker: narrator
          text: 第三座城堡路途遥远，哈尔沃必须快步疾走，一路飞奔，才能赶在天黑前到达。将近黄昏，他终于看见城堡，它比前两座更加富丽宏伟。这一回，哈尔沃已经一点也不害怕了。他穿过厨房，径直走进城堡，看见一位美得无法形容的公主。她说，自己来到这里以后，从没见过一个基督徒。
        - id: ch02-b11
          speaker: youngest_princess
          text: 自从我来到这里，就没见过一个基督徒。你快走吧，不然山怪会把你活活吞掉。他长着九颗脑袋！
          emotion: fearful
        - id: ch02-b12
          speaker: halvor
          text: 就算他再长九颗，又再长九颗，我也不走。他爱什么时候来，就什么时候来吧。
        - id: ch02-b13
          speaker: narrator
          text: 小公主一再恳求，哈尔沃却稳稳站在炉前。她只得把山怪的剑交给他，让他喝一口瓶里的酒。很快，山怪便横冲直撞地回来了。他比另外两只更加高大，也得侧着身子才能进门。
        - id: ch02-b14
          speaker: nine_headed_troll
          text: 呼特图！好浓的基督徒血腥味！
        - id: ch02-b15
          speaker: narrator
          text: 哈尔沃立刻砍掉第一颗脑袋，又接连砍掉其余的。最后一颗最为坚硬。虽然他知道自己力气足够，还是费了平生最大的工夫，才终于把它斩落。
        - id: ch02-b16
          speaker: narrator
          text: 九头山怪死后，三姐妹全都来到这座名叫索里亚莫里亚的城堡。她们终于团聚，一生从没这样欢喜快活过。三位公主都喜欢哈尔沃，哈尔沃也喜欢她们。她们让他在姐妹中任选一位做新娘，而三姐妹当中，最喜欢他的正是小公主。
    - id: ch03
      title: 戒指带来的相逢与离别
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 过了一阵，哈尔沃忽然变得有些反常。他整天闷闷不乐，走来走去也不大说话。公主们问他还缺什么，是不是已经厌倦这里，不愿再和她们住下去。哈尔沃说，他当然喜欢这里。城堡里什么都有，而且样样都有富余，他的日子过得再好不过。可不知为什么，他实在思念家乡。父母还在人世，他无论如何都想再见他们一面。
        - id: ch03-b02
          speakers: [eldest_princess, middle_princess, youngest_princess]
          ensemble: chorus
          text: 只要听从我们的劝告，你就能平安回家，也能毫发无损地回来。
        - id: ch03-b03
          speaker: narrator
          text: 哈尔沃答应把她们的话牢牢记住。公主们给他换上华服，从头到脚打扮得像一位王子，又在他手指上戴了枚神奇的戒指。有了它，他想到哪里，就能立刻到达哪里。她们反复叮嘱，千万不可摘下戒指，也不可说出她们的名字。只要违背一条，他的一切英勇事迹便会化为乌有，从此再也见不到她们。
        - id: ch03-b04
          speaker: halvor
          text: 要是我此刻就在家里，那该多好。
        - id: ch03-b05
          speaker: narrator
          text: 话音刚落，哈尔沃还没弄清发生了什么，就已经站在父母的小屋门前。天色将晚，老两口看见一位衣着华贵、气度不凡的老爷走进来，吓得连忙鞠躬行礼。哈尔沃问能否留宿一夜，他们却说家里什么也没有，实在招待不了这样的贵客，还指给他看不远处农庄的烟囱。
        - id: ch03-b06
          speakers: [father, mother]
          ensemble: duo
          text: 您还是去不远处的农庄吧。那里有吃有喝，什么都不缺。我们家连把椅子也拿不出来。
        - id: ch03-b07
          speaker: halvor
          text: 我明早再去。今晚让我留下吧，再不济，我可以坐在壁炉角落里。
        - id: ch03-b08
          speaker: narrator
          text: 老两口找不出理由再反对，只得答应。哈尔沃在炉边坐下，舒展开从前那副懒洋洋的身子，像小时候一样拨弄灰烬。三个人东一句、西一句，说起许多家长里短。老两口讲了这桩，又讲了那桩，哈尔沃听了一阵，才像不经意似的问起，他们从前是否有过孩子。
        - id: ch03-b09
          speakers: [father, mother]
          ensemble: duo
          text: 从前有个儿子，名叫哈尔沃。可他不知流落到哪里去了，我们连他是死是活也不知道。
          emotion: sad
        - id: ch03-b10
          speaker: halvor
          text: 你们瞧，会不会就是我呢？
        - id: ch03-b11
          speaker: mother
          text: 让我看看。我家的哈尔沃又懒又笨，从不肯做一点事，衣服也是一块破布勾着另一块。你这样体面的人，怎么可能是他？
        - id: ch03-b12
          speaker: narrator
          text: 后来，母亲走到炉边拨旺火苗。火光照亮哈尔沃的脸，他坐在那里拨灰的模样，和从前一模一样。她终于认出了自己的儿子。
        - id: ch03-b13
          speaker: mother
          text: 啊！原来真是你，哈尔沃！
          emotion: surprised
        - id: ch03-b14
          speaker: narrator
          text: 老两口欢喜得不得了，像是再也高兴不完。哈尔沃只得把离家后的经历一五一十说给他们听。母亲又爱他，又为他骄傲，怎么也不肯让这件事就此过去，非要带他去农庄，给那些从前瞧不起他的姑娘看看。她先跑去告诉大家，自己的哈尔沃回来了，如今神气得活脱脱像位王子。
        - id: ch03-b15
          speakers: [farm_girl_1, farm_girl_2]
          ensemble: duo
          text: 说得倒好听！我们敢打赌，他还是从前那个衣衫褴褛的穷小子。
        - id: ch03-b16
          speaker: narrator
          text: 姑娘们刚说完，哈尔沃正好走进来。她们吃了一惊，竟忘了炉边还放着正在缝补的裙衫，只穿贴身衬衣便跑了出去。等她们重新穿好衣服回来，一个个羞得满脸通红，几乎不敢看哈尔沃。从前，她们在这个穷小子面前总是又骄傲又神气。
        - id: ch03-b17
          speaker: halvor
          text: 你们一直以为自己漂亮体面，谁也比不上。可在我救出的大公主面前，你们只像挤奶女工。二公主更加美丽。我的心上人小公主，却比太阳和月亮加在一起还美。要是她此刻就在这里，你们才算真正开了眼。
        - id: ch03-b18
          speaker: narrator
          text: 哈尔沃刚说完，三位公主便凭空站在眼前。他这才想起她们的告诫，心里懊悔万分，可已经来不及了。农庄赶紧摆下盛宴，殷勤款待三位公主。她们却不愿留在那里，坚持下山去看望哈尔沃的父母，又说动身前想先到外面四处走走。
        - id: ch03-b19
          speaker: narrator
          text: 哈尔沃陪着她们离开农庄。庄外不远处有一片宽阔的大湖，水边铺着一片可爱的绿草坡。三位公主说，坐在这里歇歇脚，静静望着湖面，一定十分惬意。于是四个人在草坡上坐了下来。过了一会儿，小公主望着哈尔沃，说想替他梳一会儿头发。
        - id: ch03-b20
          speaker: narrator
          text: 哈尔沃答应了，把头枕在小公主腿上。她慢慢梳理着他漂亮的头发，没过多久，哈尔沃便沉沉睡去。小公主等他睡熟，轻轻取下他指间那枚能实现愿望的戒指，又拿出另一枚戒指，悄悄戴回原处。
        - id: ch03-b21
          speaker: youngest_princess
          text: 姐姐们，都挨紧我！但愿我们立刻回到索里亚莫里亚城堡。
        - id: ch03-b22
          speaker: narrator
          text: 哈尔沃醒来以后，马上明白自己失去了三位公主。他放声痛哭，伤心得谁也安慰不了。不论父母说什么，他都不肯留在家里，还是坚持向二老告别。他说，若找不回公主，活着也没有意思，父母恐怕再也见不到他了。
    - id: ch04
      title: 月亮与西风
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 哈尔沃还剩三百元钱。他把钱全装进口袋，独自出发寻找公主。走了一阵，他碰见一个男人牵着一匹很不错的马。哈尔沃觉得骑马总比步行快，便拦下马主人，问他愿不愿意出售，又问他想卖多少钱。
        - id: ch04-b02
          speaker: horse_seller
          text: 说实话，我原本没想卖它。不过价钱合适，也不是不行。这匹马不值多少钱，骑起来倒不错，就是拉不动东西。轮流驮你和行囊，它还是办得到的。
        - id: ch04-b03
          speaker: narrator
          text: 两人最后谈妥价钱。哈尔沃把行囊放到马背上，就这样走一程、骑一程，自己和行囊轮换着让马驮。夜里，他来到一片碧绿的原野，在一棵大树的根旁坐下。他解开缰绳，让马自由吃草，自己没有躺下睡觉，只从行囊里拿出食物吃了一顿。天刚破晓，他又匆匆上路。
        - id: ch04-b04
          speaker: narrator
          text: 他在广阔的森林里走走骑骑，骑骑走走，一整天不肯歇息。树木之间散落着许多明亮的绿地，在林荫下闪着可爱的光。可哈尔沃既不知道自己身在何处，也不知道该往哪里去。只有来到一片绿地，马低头吃上几口草，他也打开行囊匆匆吃点东西时，才肯停上一会儿。随后他又立刻赶路，那片森林却仿佛永远没有尽头。
        - id: ch04-b05
          speaker: narrator
          text: 第二天黄昏，树林深处终于亮起一点灯光。哈尔沃盼着那里有人，能让他暖暖身子，再吃上一口，好歹保住这条命。他走近一看，灯光来自一间破破烂烂的小屋。透过窗户，他看见屋里住着一对年迈至极的夫妻。两人满头灰发，活像一双灰鸽子。老妇人的鼻子更是长得不得了。她坐在壁炉旁，竟拿那只鼻子当火钩，伸进炉膛里拨弄火苗。
        - id: ch04-b06
          speaker: halvor
          text: 晚上好。
        - id: ch04-b07
          speaker: old_wife
          text: 晚上好。可你到这里来做什么？这地方已经一百多年没来过基督徒了。
        - id: ch04-b08
          speaker: narrator
          text: 哈尔沃讲了自己的经历，又问她知不知道去索里亚莫里亚城堡的路。
        - id: ch04-b09
          speaker: old_wife
          text: 我不知道。不过月亮出来了，她照得到天下万物，我来替你问问。
        - id: ch04-b10
          speaker: narrator
          text: 月亮又圆又亮，升到树梢上方。老妇人走到屋外，仰头放声呼喊。
        - id: ch04-b11
          speaker: old_wife
          text: 月亮啊，月亮！你知道去索里亚莫里亚城堡的路吗？
        - id: ch04-b12
          speaker: moon
          text: 不知道。上回我照到那里时，恰好有一片云挡在面前。
        - id: ch04-b13
          speaker: old_wife
          text: 再等一会儿，西风很快就来。他吹遍每一个角落，一定知道。对了，你竟然还带着一匹马！快把这可怜的小东西放进围场，别让它在门口饿死。
        - id: ch04-b14
          speaker: old_wife
          text: 你愿不愿拿马换一双旧靴子？穿上它，一步就能跨出二十英里。有了这双靴子，你也能更快赶到城堡。
        - id: ch04-b15
          speaker: narrator
          text: 哈尔沃立刻答应交换。老妇人得到那匹马，欢喜得想又蹦又跳。她说，这下自己也能骑马去教堂了，想想看，那该多好！哈尔沃心里一刻也安定不下来，马上便想穿上靴子赶路。老妇人却说用不着着急，让他先躺在长凳上睡一觉。家里虽然没有床，她会替他守着，等西风到来便叫醒他。
        - id: ch04-b16
          speaker: narrator
          text: 过了一阵，西风怒吼着赶来，吹得墙壁嘎吱作响。老妇人赶紧跑到屋外。
        - id: ch04-b17
          speaker: old_wife
          text: 西风啊，西风！这里有人要去索里亚莫里亚城堡，你能给他带路吗？
        - id: ch04-b18
          speaker: west_wind
          text: 那条路我熟得很。我正要去吹干婚礼用的衣裳。他若跑得够快，就跟我一起来吧。
        - id: ch04-b19
          speaker: narrator
          text: 哈尔沃一听，立刻冲出小屋。西风告诉他，若真想跟上，就得把两条腿尽量迈开。话一说完，西风便呼啸着出发了。他越过田野和篱笆，翻过高山与荒岭，速度快得惊人。哈尔沃穿着一步二十英里的靴子，仍得使尽全力奔跑，才勉强没有被落在后面。
        - id: ch04-b20
          speaker: west_wind
          text: 我不能再陪你了。我还要去掀倒一片云杉林，然后才去漂洗场吹干衣裳。你沿着山脚走，会看见许多洗衣服的姑娘。从那里到城堡已经不远了。
        - id: ch04-b21
          speaker: narrator
          text: 哈尔沃很快遇见那些姑娘。她们正等着西风来吹干婚礼的衣裳，便问他有没有看见西风。
        - id: ch04-b22
          speaker: halvor
          text: 看见了。他只是去掀倒一片云杉林，很快就来。请告诉我，索里亚莫里亚城堡该怎么走？
        - id: ch04-b23
          speaker: narrator
          text: 洗衣姑娘替他指明道路。哈尔沃继续向城堡走去。
    - id: ch05
      title: 索里亚莫里亚城堡的婚宴
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 洗衣姑娘替哈尔沃指路以后，他终于来到了索里亚莫里亚城堡。那里正在筹办婚礼，宾客和马匹挤得到处都是，多得让人看一眼便头晕目眩。哈尔沃一路追赶西风，穿过灌木、荆棘和沼泽，衣服早已撕得破破烂烂。他怕旁人看见自己的模样，一直躲在不起眼的地方，不肯现身。直到婚宴的最后一天，也就是新娘就要嫁给别人的那一天，他才从藏身处走出来。
        - id: ch05-b02
          speaker: narrator
          text: 按照当时的规矩，席上所有人都要举杯祝福新郎新娘，祝他们幸福美满。接着，负责斟酒的人还得代新人回敬席上的每一个人。无论骑士还是侍从，谁也不能漏下。酒杯就这样沿着长桌一路传过来，最后终于轮到了穿着破衣、躲在末席的哈尔沃。
        - id: ch05-b03
          speaker: narrator
          text: 哈尔沃照规矩举杯祝福新人。喝酒时，他悄悄把自己睡在湖边时，小公主替他戴上的那枚戒指丢进杯里。随后，他请斟酒人代自己向新娘问候，再把这只酒杯亲手送到她面前。小公主接过杯子，一眼便看见了杯底的戒指。她再也坐不住，立刻从宴席间站起身来。
        - id: ch05-b04
          speaker: youngest_princess
          text: 什么样的人最有资格娶我们姐妹中的一个？是救我们脱离苦海的人，还是现在坐在我身边充当新郎的人？
        - id: ch05-b05
          speakers: [wedding_guest_1, wedding_guest_2]
          ensemble: duo
          text: 当然是救你们的人，这件事只有一个答案！
        - id: ch05-b06
          speaker: narrator
          text: 宾客们的意见完全一致，没有一个人认为冒牌新郎更有资格。哈尔沃听见众人的回答，再也不用躲藏。他马上脱下身上的乞丐破衣，换上为婚礼准备的华服，以真正新郎的模样站到众人面前。小公主一眼便认出了他。
        - id: ch05-b07
          speaker: youngest_princess
          text: 好呀，真正的那个人到底还是来了！
          emotion: happy
        - id: ch05-b08
          speaker: narrator
          text: 小公主当即把冒牌新郎扔出窗外，终于和真正救出自己、一路历尽艰辛归来的哈尔沃举行了婚礼。
