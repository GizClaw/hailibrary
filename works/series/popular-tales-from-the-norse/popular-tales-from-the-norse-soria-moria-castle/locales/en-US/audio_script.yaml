  chapters:
    - id: ch01
      title: The Road to the First Castle
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Once upon a time, a poor couple had a son named Halvor. From the time he was small, he would do no work at all. He only sat by the hearth and poked through the ashes. His parents sent him out to learn one trade after another. Each time, he stayed a day or two, ran away from his master, and came home to the cinders.
        - id: ch01-b02
          speaker: narrator
          text: One day a skipper came by. He asked whether Halvor would like to sail with him and see strange lands. Halvor liked that idea very much, and he was soon ready to leave.
        - id: ch01-b03
          speaker: narrator
          text: No one could say how long they sailed. At last a great storm struck them. When it passed and the sea grew still, the sailors found themselves beside a coast none of them knew. There was no wind, so the ship could go no farther.
        - id: ch01-b04
          speaker: halvor
          text: Let me go ashore and look around. I'd rather walk than lie here sleeping.
        - id: ch01-b05
          speaker: skipper
          text: Are you fit to meet anyone looking like that? Those rags are the only clothes you have.
        - id: ch01-b06
          speaker: narrator
          text: Halvor would not give up, and at last the skipper let him go. He warned the boy to return as soon as the wind began to blow.
        - id: ch01-b07
          speaker: narrator
          text: Halvor found a lovely country. Broad, level fields of grain and rich meadows lay everywhere, but he could not catch sight of a living soul. The wind began to rise, just as the skipper had warned. Still, Halvor felt he had not seen nearly enough. He wanted to walk a little farther and find out whether anyone lived in that beautiful land.
        - id: ch01-b08
          speaker: narrator
          text: Before long he reached a broad, high road. It was so smooth that an egg could have rolled along it. He followed it until evening. Far away, he saw a great castle shining in the last rays of the sun.
        - id: ch01-b09
          speaker: narrator
          text: He had walked all day without food, and he was hungry as a hunter. Yet the closer he came to the castle, the more frightened he grew. A great fire blazed in its kitchen. Inside stood silver vessels and golden ones, finer than anything he had ever seen. But still there was no one there.
        - id: ch01-b10
          speaker: narrator
          text: Halvor stood in the splendid kitchen for a while, expecting someone to appear. No one did. At last he opened a door. In the room beyond it, a Princess sat alone, spinning at her wheel.
        - id: ch01-b11
          speaker: eldest_princess
          text: No, no! Can a Christian man truly have come here? Go while you can, unless you want the Troll to eat you. He lives here, and he has three heads.
          emotion: surprised
        - id: ch01-b12
          speaker: halvor
          text: Three heads or seven, it makes no difference to me. I'd like to see what sort of creature he is. I won't leave when I've done nothing wrong. But please give me food, because I'm nearly starving.
        - id: ch01-b13
          speaker: narrator
          text: The Princess fed him until he was full. Then she asked him to try the sword hanging on the wall. Halvor could not swing it. He could not even lift it.
        - id: ch01-b14
          speaker: eldest_princess
          text: Take a drink from the flask beside it. The Troll always drinks from that flask before he uses the sword.
        - id: ch01-b15
          speaker: narrator
          text: Halvor drank. In a moment, the sword felt light in his hands. Now he was ready for the Troll. Just then the creature came home, puffing and blowing, and Halvor slipped behind the door.
        - id: ch01-b16
          speaker: three_headed_troll
          text: HUTETU! I smell the blood of a Christian man!
          emotion: angry
        - id: ch01-b17
          speaker: halvor
          text: And that smell will cost you dearly.
        - id: ch01-b18
          speaker: narrator
          text: With one sweep after another, Halvor cut off all three heads.
        - id: ch01-b19
          speaker: narrator
          text: The Princess was free. She danced and sang for joy. Then she suddenly remembered her sisters.
        - id: ch01-b20
          speaker: eldest_princess
          text: If only my sisters could be free as well.
          emotion: sad
        - id: ch01-b21
          speaker: halvor
          text: Where are they?
        - id: ch01-b22
          speaker: narrator
          text: One sister, she explained, had been carried to a castle fifty miles away by another Troll. The third sister was held by a Troll in a castle fifty miles beyond that.
        - id: ch01-b23
          speaker: eldest_princess
          text: First, please help me get this horrible carcass out of the house.
        - id: ch01-b24
          speaker: narrator
          text: Halvor was so strong after drinking from the flask that he carried everything away and soon had the castle clean and tidy. He and the Princess passed a good and happy evening together. But he did not forget her sisters. At the first grey light of morning, he set out for the next castle.
    - id: ch02
      title: Three Trolls and Three Princesses
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: Halvor rested nowhere. He ran and walked all day. When the second castle came into sight, its splendor made him a little afraid. It was far grander than the first, and here too he saw no living soul. He crossed the kitchen and went straight into the house.
        - id: ch02-b02
          speaker: middle_princess
          text: No, no! Has a Christian man really come here? I don't know how many years I've been here, but I have never seen one in all that time. Leave as fast as you came. The Troll who lives here has six heads.
          emotion: surprised
        - id: ch02-b03
          speaker: halvor
          text: I won't go, even if he has six more.
        - id: ch02-b04
          speaker: middle_princess
          text: He'll pick you up and swallow you alive.
          emotion: fearful
        - id: ch02-b05
          speaker: narrator
          text: Halvor would not move. He said he did not fear the Troll, but after his long journey he was half starved and needed food and drink. The Princess gave him all he wanted. Then she urged him once more to leave.
        - id: ch02-b06
          speaker: halvor
          text: No. I've harmed no one, and I have nothing to fear.
        - id: ch02-b07
          speaker: middle_princess
          text: The Troll won't stop to ask whether you've done wrong. He'll seize you without leave or law. Since you refuse to go, try the sword over there. It's the one he carries to war.
        - id: ch02-b08
          speaker: narrator
          text: Halvor could not swing the sword. The Princess told him to drink from the flask beside it. As soon as he did, he could wield the blade.
        - id: ch02-b09
          speaker: narrator
          text: At that moment the Troll returned. He was so broad and heavy that he had to turn sideways to enter the doorway.
        - id: ch02-b10
          speaker: six_headed_troll
          text: HUTETU! I smell the blood of a Christian man!
          emotion: angry
        - id: ch02-b11
          speaker: narrator
          text: The instant the first head appeared, Halvor cut it off. He struck down each of the others as it came through.
        - id: ch02-b12
          speaker: narrator
          text: The Princess was overjoyed to be free. Then she remembered her sisters and said aloud how much she wished they could be rescued too. Halvor thought that could easily be done, and he wanted to start for the third castle at once. But first the Princess needed his help. Together they had to get the six-headed Troll's great carcass out of the way, and that work kept him there until morning.
        - id: ch02-b13
          speaker: narrator
          text: The third castle lay a long way off. Halvor walked fast and ran hard all day, and near nightfall he saw it. It was finer and grander than either of the others. This time he felt no fear. He walked through the kitchen and straight inside.
        - id: ch02-b14
          speaker: narrator
          text: There sat the youngest Princess. She was so beautiful that there seemed no end to her loveliness. Like her sisters, she said no Christian person had come there since her capture.
        - id: ch02-b15
          speaker: youngest_princess
          text: Please go away. If you stay, the Troll will swallow you alive. He has nine heads.
          emotion: fearful
        - id: ch02-b16
          speaker: halvor
          text: He could have nine more, and nine beyond those, and I still would not leave.
        - id: ch02-b17
          speaker: narrator
          text: Halvor planted himself before the stove. The Princess begged him again and again to escape before the Troll ate him.
        - id: ch02-b18
          speaker: halvor
          text: Let him come whenever he likes.
        - id: ch02-b19
          speaker: narrator
          text: She gave him the Troll's sword and told him to drink from the flask so he would have strength to use it.
        - id: ch02-b20
          speaker: narrator
          text: Then the Troll came tearing home, puffing and blowing. He was much larger than the other two and had to turn sideways to pass through the door.
        - id: ch02-b21
          speaker: nine_headed_troll
          text: HUTETU! I smell the blood of a Christian man!
          emotion: angry
        - id: ch02-b22
          speaker: narrator
          text: As the first head entered, Halvor cut it off. Then he struck down all the rest. The ninth head was tougher than any of them. It took the hardest work he had ever done, though he knew he had strength enough.
        - id: ch02-b23
          speaker: narrator
          text: The three Princesses gathered in that castle, which was called Soria Moria Castle. Never in their lives had they been so glad or so happy. All three were fond of Halvor, and Halvor was fond of them. They told him he might choose whichever sister he loved best for his bride. The youngest Princess cared for him more deeply than either of the others did.
    - id: ch03
      title: Halvor Goes Home
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: For a time, they all lived happily at Soria Moria Castle. Then Halvor began to act strangely. He wandered from room to room looking troubled, and he became dull and silent. The Princesses saw the change and asked what he lacked. They wondered whether he had grown tired of the castle and no longer wished to live with them.
        - id: ch03-b02
          speaker: halvor
          text: I do like it here. We have more than enough, and I couldn't be better cared for. But my father and mother are still alive. I long to go home and see them.
        - id: ch03-b03
          speakers: [eldest_princess, middle_princess, youngest_princess]
          ensemble: chorus
          text: You may go there and return here without harm, as long as you follow our advice.
        - id: ch03-b04
          speaker: narrator
          text: Halvor promised to obey. They dressed him until he looked as grand as a king's son. Then they placed a ring on his finger. With that ring, he could wish himself from one place to another.
        - id: ch03-b05
          speakers: [eldest_princess, middle_princess, youngest_princess]
          ensemble: chorus
          text: Never take off the ring, and never speak our names. If you do, all your good fortune will end, and you will never see us again.
        - id: ch03-b06
          speaker: halvor
          text: If only I were standing at home now, I would be glad.
        - id: ch03-b07
          speaker: narrator
          text: At once, Halvor found himself outside his parents' cottage. It was dusk. When the old couple saw a stately lord entering, they were frightened and began bowing low.
        - id: ch03-b08
          speaker: halvor
          text: May I stay here tonight?
        - id: ch03-b09
          speakers: [father, mother]
          ensemble: duo
          text: We cannot lodge you, my lord. We don't have any of the things a gentleman like you needs. Go to the farm nearby. You can see its chimneys, and they have plenty of everything.
        - id: ch03-b10
          speaker: narrator
          text: Halvor insisted on staying. His parents insisted that the farmer could give him food and drink, while they did not even own a chair fit for him.
        - id: ch03-b11
          speaker: halvor
          text: I won't go there until morning. Please let me remain here tonight. If there's nowhere else, I can sit in the chimney corner.
        - id: ch03-b12
          speaker: narrator
          text: They could not object to that. Halvor sat beside the hearth and began stirring the ashes, just as he had done when he lived there as a lazy boy.
        - id: ch03-b13
          speaker: narrator
          text: They talked about one thing and another. At last Halvor asked whether the couple had ever had children.
        - id: ch03-b14
          speakers: [father, mother]
          ensemble: duo
          text: We once had a son named Halvor. We don't know where he wandered, or whether he is alive or dead.
          emotion: sad
        - id: ch03-b15
          speaker: halvor
          text: Could I be that son?
        - id: ch03-b16
          speaker: mother
          text: Let me look at you. I would know him well enough. Our Halvor was lazy and slow, and he never did a thing. His clothes were so ragged that one scrap seemed to hold up the next. No, there was never any sign that he could become a fine gentleman like you.
        - id: ch03-b17
          speaker: narrator
          text: A little later, his mother went to stir the fire. The flames lit Halvor's face as he sat poking in the ashes, exactly as he had in the old days. She knew him at once.
        - id: ch03-b18
          speaker: mother
          text: Oh! Halvor, is it really you after all?
          emotion: surprised
        - id: ch03-b19
          speaker: narrator
          text: His parents' joy had no end. They embraced the son they had believed lost, and Halvor had to tell them how he had sailed away, found the castles, and won his fine clothes and fortune. His mother listened with more pride and affection than she could contain. Nothing would satisfy her except taking him straight to the nearby farm. The girls there had always looked down on her ragged, lazy son, and now she meant to show them what he had become.
        - id: ch03-b20
          speaker: narrator
          text: She hurried ahead and announced that her Halvor had come home. Now the girls would see how grand he was, because he looked exactly like a king's son.
        - id: ch03-b21
          speakers: [farm_girl_1, farm_girl_2]
          ensemble: duo
          text: That's a fine story. We expect he's still the same ragged beggar boy he always was.
        - id: ch03-b22
          speaker: narrator
          text: Just then Halvor walked into the farmhouse dressed like a prince. The girls had been sitting by the hearth, mending their clothes, and the sight of him took them completely by surprise. They forgot the garments lying beside the fire and ran outside in their underclothes. When they finally came back into the room, they were deeply ashamed. They scarcely dared look at Halvor, because they remembered how proudly and haughtily they had always treated him.
        - id: ch03-b23
          speaker: halvor
          text: You always thought no one could match how pretty and neat you were. But beside the eldest Princess I rescued, you would look like milkmaids. The middle sister is lovelier still. And the youngest, my sweetheart, is fairer than the sun and moon. If only she were here, then you would see for yourselves.
        - id: ch03-b24
          speaker: narrator
          text: The words were hardly out of his mouth before all three Princesses stood there. Halvor remembered their warning too late, and sorrow filled him.
        - id: ch03-b25
          speaker: narrator
          text: The people at the farm quickly prepared a great feast for the three Princesses. They brought out the best they had and treated the sisters with every honor. But the Princesses had no wish to remain at the farm.
        - id: ch03-b26
          speakers: [eldest_princess, middle_princess, youngest_princess]
          ensemble: chorus
          text: We want to visit your father and mother. Let us go outside first and look around.
        - id: ch03-b27
          speaker: narrator
          text: Halvor went with them. Just beyond the farm they came to a great lake. A lovely green bank lay beside the water, and the Princesses chose to rest there and look across the lake.
        - id: ch03-b28
          speaker: youngest_princess
          text: Halvor, let me comb your hair for a while.
        - id: ch03-b29
          speaker: narrator
          text: Halvor laid his head in her lap. As she combed his hair, he soon fell fast asleep. The youngest Princess slipped the wishing ring from his finger and replaced it with another.
        - id: ch03-b30
          speaker: youngest_princess
          text: Hold tightly to me, sisters. Now I wish we were all in Soria Moria Castle.
        - id: ch03-b31
          speaker: narrator
          text: When Halvor woke, the green bank beside the lake was empty. He knew at once that he had lost the Princesses. He wept and wailed until everyone tried to comfort him, but nothing they said could ease his grief. His father and mother begged him to remain at home. Halvor would not stay. He said farewell and warned them that they were not likely to see him again. Unless he could find the Princesses, he no longer thought life worth living.
    - id: ch04
      title: The Moon and the West Wind
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: Halvor still had three hundred dollars. He put the money in his pocket and set out. After he had walked some distance, he met a man leading a decent horse and asked to buy it.
        - id: ch04-b02
          speaker: horse_seller
          text: To tell the truth, I never meant to sell him. Still, if we can agree on a price, perhaps I might.
        - id: ch04-b03
          speaker: halvor
          text: How much do you want for him?
        - id: ch04-b04
          speaker: horse_seller
          text: I paid little for him, and he isn't worth much. He's a good riding horse, but he cannot pull. He is strong enough to carry you and your knapsack by turns, though.
        - id: ch04-b05
          speaker: narrator
          text: At last they settled on a price. Halvor put his knapsack on the horse. For the rest of the day, he walked for a while and then rode for a while.
        - id: ch04-b06
          speaker: narrator
          text: That night he reached a green plain where a great tree stood alone. He sat down among its roots and let the horse wander loose to feed. Halvor did not lie down to sleep. He opened his knapsack, took out a meal, and waited impatiently for morning. At the first pale light of dawn, he packed his things and started again. His need to find Soria Moria Castle would give him no rest.
        - id: ch04-b07
          speaker: narrator
          text: All that day, Halvor rode for a while and walked for a while through a vast forest. Between the trees lay green spots and open glades that shone bright and lovely in the light. He had no idea where he was, and he could not tell whether he was going toward the castle or away from it. He allowed himself no more rest than the moments when his horse cropped a mouthful of grass. When they reached one of the green clearings, he ate a quick bite from his knapsack. Then they pressed on, walking and riding by turns, while the forest seemed to stretch on without end.
        - id: ch04-b08
          speaker: narrator
          text: At dusk on the following day, Halvor saw a light gleaming through the trees.
        - id: ch04-b09
          speaker: halvor
          text: If only someone lives there. Perhaps I can warm myself and get enough food to keep body and soul together.
        - id: ch04-b10
          speaker: narrator
          text: The light came from a miserable little hut. Through the window he saw a very old couple, both as grey as doves. The old wife's nose was so long that she used it as a poker while she sat stirring the fire.
        - id: ch04-b11
          speaker: halvor
          text: Good evening.
        - id: ch04-b12
          speaker: old_wife
          text: Good evening. But what could bring you here? No Christian person has passed this way in more than a hundred years.
        - id: ch04-b13
          speaker: narrator
          text: Halvor told the old wife who he was and how the Princesses had vanished from beside the lake. He explained that he had left his parents and traveled through the forest because he meant to reach Soria Moria Castle. Then he asked whether she knew any road that would take him there.
        - id: ch04-b14
          speaker: old_wife
          text: No, I don't know it. But look, the Moon is rising. I'll ask her. She shines on everything, so she may know.
        - id: ch04-b15
          speaker: narrator
          text: When the Moon stood bright above the treetops, the old wife hurried outside and called up to her.
        - id: ch04-b16
          speaker: old_wife
          text: Moon, Moon! Can you tell me the way to Soria Moria Castle?
        - id: ch04-b17
          speaker: moon
          text: No, I cannot. The last time I shone there, a cloud stood in front of me.
        - id: ch04-b18
          speaker: old_wife
          text: Wait a little longer, Halvor. The West Wind will come soon. He blows around every corner, so he is sure to know the way.
        - id: ch04-b19
          speaker: narrator
          text: Then the old wife noticed the horse waiting outside.
        - id: ch04-b20
          speaker: old_wife
          text: You brought a horse too? Turn the poor creature loose in our yard. Don't leave him at the door to starve. Better yet, trade him to me. I have an old pair of boots that cover twenty miles in every stride. Take them for the horse, and you'll reach Soria Moria Castle much sooner.
        - id: ch04-b21
          speaker: narrator
          text: Halvor agreed at once. The old wife was so pleased to own the horse that she nearly danced for joy.
        - id: ch04-b22
          speaker: old_wife
          text: Now I can ride to church. Think of that!
          emotion: happy
        - id: ch04-b23
          speaker: narrator
          text: Halvor wanted to leave immediately, but the old wife told him not to hurry.
        - id: ch04-b24
          speaker: old_wife
          text: Lie on the bench and sleep. We have no bed to offer, but I'll watch and wake you when the West Wind comes.
        - id: ch04-b25
          speaker: narrator
          text: After a while, the West Wind came roaring and howling through the forest. The walls creaked and groaned. The old wife ran outside again.
        - id: ch04-b26
          speaker: old_wife
          text: West Wind, West Wind! Do you know the way to Soria Moria Castle? There is someone here who wants to go.
        - id: ch04-b27
          speaker: west_wind
          text: I know it well. I'm going there now to dry the clothes for a wedding. If he is quick enough, he may come with me.
        - id: ch04-b28
          speaker: narrator
          text: Halvor ran outside in his twenty-mile boots.
        - id: ch04-b29
          speaker: west_wind
          text: Stretch your legs if you mean to keep up with me.
        - id: ch04-b30
          speaker: narrator
          text: Away the West Wind rushed, and Halvor sprang after him. They crossed open fields and leaped over hedges. They hurried up hills, over high ground, and down again. The boots carried Halvor twenty miles with every stride, but even with their magic he had to stretch his legs and work hard to keep the West Wind in sight.
        - id: ch04-b31
          speaker: west_wind
          text: I cannot stay with you any longer. Before I reach the bleaching ground, I must go tear down a strip of spruce forest. Keep beside this hill. You will find some girls washing clothes, and from there Soria Moria Castle is not far.
        - id: ch04-b32
          speaker: narrator
          text: Before long, Halvor reached the women who were washing the wedding clothes.
        - id: ch04-b33
          speaker: washerwoman
          text: Have you seen the West Wind? He is supposed to come and dry these clothes for the wedding.
        - id: ch04-b34
          speaker: halvor
          text: Yes, I saw him. He has only gone to tear down a strip of spruce forest, so he should be here soon. Now please tell me the way to Soria Moria Castle.
        - id: ch04-b35
          speaker: narrator
          text: The washerwomen pointed out the road, and Halvor followed it toward the castle.
    - id: ch05
      title: The Right Bridegroom
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: When Halvor reached Soria Moria Castle, he found it crowded with people and horses. There were so many guests and animals that simply looking at them made him dizzy. His race behind the West Wind had taken him through bushes, thorny thickets, and deep bogs. His clothes now hung from him in rags. Looking like a beggar, he kept himself to one side where no one would notice him. He waited there until the last day, when the wedding feast was to take place.
        - id: ch05-b02
          speaker: narrator
          text: On that last day, everyone gathered for the bridal feast. When the proper moment came, the guests raised their cups according to custom. They drank to the bride and the man seated beside her, wishing the pair happiness and good fortune. After that, the cupbearer carried the cup around and drank to all the guests in return. He went first among the knights and then among the squires. Halvor, hidden in his torn clothes, came last of all.
        - id: ch05-b03
          speaker: narrator
          text: Halvor drank to the bridal pair. As he did, he dropped into his glass the ring that the youngest Princess had placed on his finger beside the lake. Then he asked the cupbearer to carry the glass to the bride with his greeting.
        - id: ch05-b04
          speaker: narrator
          text: The moment the Princess saw the ring, she rose from the table.
        - id: ch05-b05
          speaker: youngest_princess
          text: Which man deserves one of us? The man who set us free, or the man sitting here beside me as bridegroom?
        - id: ch05-b06
          speakers: [wedding_guest_1, wedding_guest_2]
          ensemble: duo
          text: There can be only one answer. The man who set you free is the worthy one.
        - id: ch05-b07
          speaker: narrator
          text: When Halvor heard their answer, he quickly threw off his beggar's rags and dressed himself as a bridegroom.
        - id: ch05-b08
          speaker: youngest_princess
          text: Yes, yes! Here is the right man after all.
          emotion: happy
        - id: ch05-b09
          speaker: narrator
          text: She tossed the other bridegroom out of the window. Then the youngest Princess held her wedding with Halvor.
