audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 从容而清醒，带一点克制的诙谐
        timbre: 温厚清晰
        pace: 舒缓有致
        pitch: 中低
    annie:
      display_name: 小安妮
      tts:
        delivery: 朴实坚定，不卑不亢
        timbre: 清澈柔和
        pace: 中等偏缓
        pitch: 中高
    prince:
      display_name: 王子
      tts:
        delivery: 自信直接，疑惑或发怒时仍吐字清楚
        timbre: 明朗沉稳
        pace: 中等
        pitch: 中低
    stone:
      display_name: 石头
      tts:
        delivery: 冷静笃定，回答简短而毫不含糊
        timbre: 低沉坚实
        pace: 舒缓
        pitch: 低
  chapters:
    - id: ch01
      title: 路上等候的姑娘
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 从前，有位国王养的鹅实在太多，只好专门雇个姑娘看守照料。姑娘名叫安妮，大家便叫她“牧鹅姑娘安妮”。那时候，一位英格兰王子离开家乡，四处求亲。王子一路走来，安妮就坐在了他必经的地方。
        - id: ch01-b02
          speaker: prince
          text: 小安妮，你怎么一个人坐在这儿？
        - id: ch01-b03
          speaker: annie
          text: 是呀。我在这儿一针接一针，一块补丁摞一块补丁。今天，我等的是英格兰的王子。
        - id: ch01-b04
          speaker: prince
          text: 那你可别指望能得到他。
        - id: ch01-b05
          speaker: annie
          text: 不。要是命里该我得到他，到头来他就一定是我的。
        - id: ch01-b06
          speaker: narrator
          text: 画师们奉命走遍各国各地，把最美丽的公主一一画下来，让王子从中挑选。王子越看越中意其中一位，便亲自去寻找她，一心想娶她为妻。等公主答应做他的心上人，他又快活，又欢喜。
    - id: ch02
      title: 床边那块石头
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 你还得知道，王子随身带着一块无所不知的石头，每晚都把它放在床边。第一位公主来了以后，小安妮特意提醒她，要是从前有过心上人，或者另有不愿让王子知道的牵挂，最好不要踩到床边那块石头。
        - id: ch02-b02
          speaker: annie
          text: 你一踩上去，它就会把你的事全告诉王子。
        - id: ch02-b03
          speaker: narrator
          text: 公主听完，愁得不知如何是好。她想来想去，只好央求安妮当晚替自己上床，先躺在王子身边。等王子睡得正熟，安妮再悄悄出来，换公主进去。这样，王子第二天早晨醒来，身边躺着的仍是自己真正的新娘。
        - id: ch02-b04
          speaker: narrator
          text: 公主答应了，这件事就这样办了。当晚，牧鹅姑娘安妮走进房间，一脚踩上石头，王子听见动静，立刻开口询问。
        - id: ch02-b05
          speaker: prince
          text: 是谁上了我的床？
        - id: ch02-b06
          speaker: stone
          text: 是一位纯洁清白的姑娘。
        - id: ch02-b07
          speaker: narrator
          text: 王子和安妮躺下睡了。夜深以后，公主进来，悄悄换走了安妮。第二天早晨，该起床了，王子又问石头。
        - id: ch02-b08
          speaker: prince
          text: 刚才是谁从我的床上下去了？
        - id: ch02-b09
          speaker: stone
          text: 一个已经生过三个孩子的女人。
        - id: ch02-b10
          speaker: narrator
          text: 王子一听，哪里还肯娶她。他马上把公主打发回家，又找了另一个心上人。可他动身去探望那姑娘时，小安妮又抢先来到路上，坐在他必经的地方等着。
        - id: ch02-b11
          speaker: prince
          text: 牧鹅姑娘小安妮，你又一个人坐在这儿？
        - id: ch02-b12
          speaker: annie
          text: 是呀。我坐在这儿，一针接一针，一块补丁摞一块补丁。今天，我等的是英格兰的王子。
        - id: ch02-b13
          speaker: prince
          text: 啊，你还是别指望得到他了。
        - id: ch02-b14
          speaker: narrator
          text: 安妮没有说出口，心里却仍旧认定，要是命里该她得到王子，到头来王子就一定是她的。这一回，事情从头到尾又照原样发生了。只不过第二天早晨，新娘下床时，石头说她已经生过六个孩子。王子同样不肯娶她，把她赶回了家。
    - id: ch03
      title: 戒指留下的记号
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 王子还想再试一次，看看世上到底有没有纯洁无瑕的姑娘。他走遍许多国家，到处寻找，终于遇到一位自以为可以信任的人。可在去探望她的路上，牧鹅姑娘小安妮第三次抢先到了那里，仍旧坐在他必经的地方。
        - id: ch03-b02
          speaker: prince
          text: 牧鹅姑娘小安妮，你还是独自坐在这儿吗？
        - id: ch03-b03
          speaker: annie
          text: 是呀。我在这儿一针接一针，一块补丁摞一块补丁。今天，我等的是英格兰的王子。
        - id: ch03-b04
          speaker: prince
          text: 你不能指望得到他。
        - id: ch03-b05
          speaker: annie
          text: 不。要是命里该我得到他，到头来他就一定是我的。
        - id: ch03-b06
          speaker: narrator
          text: 第三位公主来了。安妮也提醒她，要是从前有过心上人，或者藏着别的事，不想让王子知道，就不要踩床边那块石头。
        - id: ch03-b07
          speaker: annie
          text: 那块石头，什么都会告诉王子。
        - id: ch03-b08
          speaker: narrator
          text: 公主听得满脸通红，心也沉了下去。原来她和前两位一样，也不是个规矩人。她同样央求安妮当晚代替自己，先去躺在王子身边。等王子睡得正熟，她再来接替安妮。这样第二天早晨天一亮，真正的新娘仍会躺在王子身旁。
        - id: ch03-b09
          speaker: narrator
          text: 她们照计划行事。安妮踩上石头，王子又问起来。
        - id: ch03-b10
          speaker: prince
          text: 是谁上了我的床？
        - id: ch03-b11
          speaker: stone
          text: 是一位纯洁清白的姑娘。
        - id: ch03-b12
          speaker: narrator
          text: 两人躺下歇息。到了后半夜，王子取出一枚戒指，紧紧套在安妮的手指上，叫她怎么也摘不下来。他早就看出事情不对，想留下一个记号，以后好认出真正的姑娘。
        - id: ch03-b13
          speaker: narrator
          text: 王子睡熟后，公主进来，把安妮赶到猪圈，自己躺到了她的位置上。第二天早晨，王子照旧问石头。
        - id: ch03-b14
          speaker: prince
          text: 是谁从我的床上下去了？
        - id: ch03-b15
          speaker: stone
          text: 一个已经生过九个孩子的女人。
    - id: ch04
      title: 命里写定的王后
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 王子听见回答，顿时大发雷霆，当场把第三位公主也赶走了。他实在想不通，便追问石头，那几位踩过它的公主到底是怎么回事。石头这才把一切告诉他，说公主们怎样骗了他，又怎样让牧鹅姑娘小安妮代替自己前来。
        - id: ch04-b02
          speaker: narrator
          text: 这一次，王子不愿再出半点差错。他亲自来到安妮坐着照看鹅群的地方，想当面看看她手上有没有那枚戒指。他心里想，要是戒指果真在她手上，最好立刻把她带走，娶她做自己的王后。
        - id: ch04-b03
          speaker: narrator
          text: 王子来到放鹅的地方，一眼就发现，安妮的一根手指上缠着一小块布。那个样子很不寻常，他马上问安妮为什么把手指包了起来。
        - id: ch04-b04
          speaker: annie
          text: 哎呀，我不小心把手指割得很深。
        - id: ch04-b05
          speaker: narrator
          text: 王子非看不可，安妮偏不肯解开。王子抓住她的手指，安妮用力往回抽。两人一拉一扯，布条掉了下来。王子终于认出了自己的戒指。
        - id: ch04-b06
          speaker: narrator
          text: 王子把安妮带回王宫，送给她许多华美的衣裳和服饰。后来，两人举行了一场婚宴。就这样，牧鹅姑娘小安妮到底还是嫁给了英格兰国王的儿子。只因为命里早就写定，她就该得到他。
