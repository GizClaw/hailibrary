  chapters:
    - id: ch01
      title: Annie Waits for the Prince
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Once upon a time, a king owned so many geese that he needed a girl to watch over them. Her name was Annie, so everyone called her Annie the Goose-girl.
        - id: ch01-b02
          speaker: narrator
          text: Now an English prince had gone out in search of a bride. As he came along, Annie sat down right in his path.
        - id: ch01-b03
          speaker: prince
          text: Are you sitting here all by yourself, little Annie?
        - id: ch01-b04
          speaker: annie
          text: Yes. Here I sit, sewing stitch to stitch and patch to patch. Today I'm waiting for the prince of England.
        - id: ch01-b05
          speaker: prince
          text: You shouldn't expect to marry him.
        - id: ch01-b06
          speaker: annie
          text: No, but if I'm meant to have him, then I'll have him in the end.
        - id: ch01-b07
          speaker: narrator
          text: Artists were sent through every land and kingdom to paint the fairest princesses, so the prince could choose among them. One likeness pleased him greatly. He went to find that princess, and he was delighted when she became his sweetheart.
    - id: ch02
      title: The Knowing Stone
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: The prince kept a stone beside his bed, and that stone knew everything. When the princess arrived, Annie warned her about it. If she had loved anyone before, or had some secret she wanted to keep from the prince, she must not step on that stone.
        - id: ch02-b02
          speaker: annie
          text: If you step on it, the stone will tell him all about you.
        - id: ch02-b03
          speaker: narrator
          text: The princess was terribly troubled. She asked Annie to take her place in the prince's bed that night. Once he was sound asleep, Annie would leave and the princess would slip in. Then, when morning came, the prince would find the proper bride beside him.
        - id: ch02-b04
          speaker: first_princess
          text: Please lie beside the prince in my place tonight. When he's fast asleep, I'll come in and take your place. In the morning, he'll wake beside his true bride.
        - id: ch02-b05
          speaker: narrator
          text: And that is what they did. Annie stepped onto the stone as she came to the bed, and the prince questioned it.
        - id: ch02-b06
          speaker: prince
          text: Who is stepping into my bed?
        - id: ch02-b07
          speaker: magic_stone
          text: A maiden, pure and bright.
        - id: ch02-b08
          speaker: narrator
          text: Annie and the prince lay down to sleep. Later that night, the princess came and took Annie's place.
        - id: ch02-b09
          speaker: narrator
          text: In the morning, as they rose, the prince asked the stone once more.
        - id: ch02-b10
          speaker: prince
          text: Who is stepping out of my bed?
        - id: ch02-b11
          speaker: magic_stone
          text: A woman who has had three children.
        - id: ch02-b12
          speaker: narrator
          text: When the prince heard that, he refused to marry her. He sent her home and chose another sweetheart.
    - id: ch03
      title: The Second Bride
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: On his way to visit his new sweetheart, the prince found Annie sitting in his path again.
        - id: ch03-b02
          speaker: prince
          text: Are you sitting here all alone again, little Annie the Goose-girl?
        - id: ch03-b03
          speaker: annie
          text: Yes. Here I sit, sewing stitch to stitch and patch to patch. Today I'm waiting for the prince of England.
        - id: ch03-b04
          speaker: prince
          text: Oh, you shouldn't expect to marry him.
        - id: ch03-b05
          speaker: annie
          text: No, but if I'm meant to have him, then I'll have him in the end.
        - id: ch03-b06
          speaker: narrator
          text: Then the same thing happened all over again. Annie warned the second princess about the stone, and the princess asked Annie to take her place for the first part of the night.
        - id: ch03-b07
          speaker: second_princess
          text: Lie down beside him for me. Once he's asleep, I'll come and take your place.
        - id: ch03-b08
          speaker: narrator
          text: At bedtime, the stone called Annie pure and bright. But when the bride rose the next morning, it said she had already borne six children.
        - id: ch03-b09
          speaker: magic_stone
          text: This woman has had six children.
        - id: ch03-b10
          speaker: narrator
          text: The prince would not marry her either, and he sent her away. Still, he decided to try once more. He searched far and wide through many lands until he found a princess he believed he could trust.
    - id: ch04
      title: The Ring in the Night
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: When the prince set out to see this third princess, Annie the Goose-girl placed herself in his way once again.
        - id: ch04-b02
          speaker: prince
          text: Are you sitting here all alone, little Annie the Goose-girl?
        - id: ch04-b03
          speaker: annie
          text: Yes. Here I sit, sewing stitch to stitch and patch to patch. Today I'm waiting for the prince of England.
        - id: ch04-b04
          speaker: prince
          text: You shouldn't expect to marry him.
        - id: ch04-b05
          speaker: annie
          text: No, but if I'm meant to have him, then I'll have him in the end.
        - id: ch04-b06
          speaker: narrator
          text: When the third princess came, Annie gave her the same warning. If she had ever had another sweetheart, or had anything else to hide from the prince, she must not step on the stone beside his bed.
        - id: ch04-b07
          speaker: annie
          text: That stone tells the prince everything.
        - id: ch04-b08
          speaker: narrator
          text: The princess turned red and looked miserable, for she had been just as untruthful as the others. She asked Annie to lie beside the prince in her place. When he was sound asleep, the princess would take over, so he would wake with the proper bride beside him.
        - id: ch04-b09
          speaker: third_princess
          text: Please take my place tonight. When the prince is fast asleep, I'll come in and lie beside him. Then he'll find his true bride there at daybreak.
        - id: ch04-b10
          speaker: narrator
          text: So Annie stepped onto the stone and went to the prince's bed.
        - id: ch04-b11
          speaker: prince
          text: Who is stepping into my bed?
        - id: ch04-b12
          speaker: magic_stone
          text: A maiden, pure and bright.
        - id: ch04-b13
          speaker: narrator
          text: They lay down to rest. Later in the night, the prince slipped a ring onto Annie's finger. It fitted so tightly that she could not pull it off. He knew something was wrong, and he wanted a mark that would help him recognize the right woman.
        - id: ch04-b14
          speaker: narrator
          text: After the prince fell asleep, the princess came in. She drove Annie out to the pigsty and lay down in her place.
        - id: ch04-b15
          speaker: narrator
          text: The next morning, as they got up, the prince put his question to the stone.
        - id: ch04-b16
          speaker: prince
          text: Who is stepping out of my bed?
        - id: ch04-b17
          speaker: magic_stone
          text: A woman who has had nine children.
        - id: ch04-b18
          speaker: narrator
          text: The prince flew into a terrible rage and drove the princess away at once. Then he asked the stone to explain what had happened with all three brides. He could make no sense of it.
        - id: ch04-b19
          speaker: prince
          text: Tell me what happened with those princesses. I don't understand any of this.
        - id: ch04-b20
          speaker: narrator
          text: The stone told him that each princess had deceived him by sending Annie the Goose-girl to take her place.
    - id: ch05
      title: The Goose-girl Becomes a Bride
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: The prince wanted to be certain, so he went down to the place where Annie tended the geese. He meant to look for the ring. If she wore it, he thought, he should take her as his queen at once.
        - id: ch05-b02
          speaker: narrator
          text: As soon as he reached her, he saw a scrap of cloth wrapped around one of her fingers. He asked why she had covered it.
        - id: ch05-b03
          speaker: prince
          text: Why have you tied that cloth around your finger?
        - id: ch05-b04
          speaker: annie
          text: Oh, I cut myself very badly.
        - id: ch05-b05
          speaker: narrator
          text: The prince insisted on seeing the finger, but Annie would not remove the cloth. He took hold of her finger, and she tried to pull away. Between them, the cloth came loose. Then the prince saw his ring and knew it at once.
        - id: ch05-b06
          speaker: narrator
          text: He brought Annie to the palace and gave her splendid clothes to wear. After that, they held their wedding feast.
        - id: ch05-b07
          speaker: narrator
          text: And so little Annie the Goose-girl married the prince of England after all, because it was written that she should have him.
