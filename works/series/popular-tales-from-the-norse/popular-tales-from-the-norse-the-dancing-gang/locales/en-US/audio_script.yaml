audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: thoughtful and gently wry
        timbre: warm and clear
        pace: measured
        pitch: medium
    crayfish:
      display_name: Crayfish
      tts:
        delivery: musical and mesmerizing
        timbre: crisp and bright
        pace: lilting
        pitch: medium-high
  chapters:
    - id: ch01
      title: Music at the River
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Once, a water carrier went to the river. She dipped in her calabash and brought up a crayfish.
        - id: ch01-b02
          speaker: narrator
          text: The crayfish beat his claws on the calabash and played a beautiful tune. The girl began to dance, and she could not stop.
    - id: ch02
      title: One After Another
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: The driver of the gang wondered why she had not returned. He sent another woman to look for her. When she arrived, she began to dance too.
        - id: ch02-b02
          speaker: narrator
          text: The driver sent a third person. She heard the music and began dancing too, while the crayfish sang.
        - id: ch02-b03
          speaker: crayfish
          text: Vaitsi, Vaitsi, O sulli Van. Stay for us, stay for us. How long will you stay for us?
        - id: ch02-b04
          speaker: narrator
          text: Then the driver sent another and another, until he had sent the whole gang.
    - id: ch03
      title: Dancing into the Night
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: At last, the driver went himself. He found the whole gang dancing, and soon he was dancing too.
        - id: ch03-b02
          speaker: narrator
          text: They all danced until night. Then the crayfish went back into the water.
        - id: ch03-b03
          speaker: narrator
          text: And if they have not finished dancing, they are dancing still.
