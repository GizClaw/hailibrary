audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 从容而清醒，带一点克制的诙谐
        timbre: 温厚清晰
        pace: 舒缓有致
        pitch: 中低
    crayfish:
      display_name: 小龙虾
      tts:
        delivery: 欢快灵巧，歌唱时富有节拍感
        timbre: 清亮轻巧
        pace: 轻快
        pitch: 中高
  chapters:
    - id: ch01
      title: 葫芦瓢里的乐声
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 从前，有个送水姑娘去河边打水。她拿葫芦瓢往河里一舀，竟捞上来一只小龙虾。
        - id: ch01-b02
          speaker: narrator
          text: 小龙虾举起双螯，在葫芦瓢上敲出一支动听的曲子。姑娘听着听着，两只脚就跳起舞来，再也停不住了。
    - id: ch02
      title: 全队都跳了起来
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 领队左等右等，不见她回来，就叫另一个姑娘去找。可那姑娘一到河边，也跳起舞来。领队又派去一个，结果她听见乐声，也立刻加入了舞步。小龙虾还唱着歌。
        - id: ch02-b02
          speaker: crayfish
          text: 瓦伊齐，瓦伊齐，哦，苏利·万。等等我们，等等我们，你还要等我们多久？
        - id: ch02-b03
          speaker: narrator
          text: 领队一个接一个地派人去，最后，全队都被他派到了河边。
    - id: ch03
      title: 跳到夜里
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 领队没了办法，只好自己去瞧。他赶到河边，看见大家都在跳，自己的脚也跟着动起来，怎么都停不了。
        - id: ch03-b02
          speaker: narrator
          text: 这一伙人就这样一直跳到了夜里。小龙虾终于回到水中。至于他们呢，要是那场舞还没跳完，直到今天，准还在那里跳个不停。
