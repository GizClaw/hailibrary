        pitch: medium-high
  chapters:
    - id: ch01
      title: The Last Doukana
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Once there was a very poor man who lived with his wife and their many children. The man was so lazy that he did nothing to help them. His poor wife did everything she could for the family.
        - id: ch01-b02
          speaker: narrator
          text: In the nearby wood stood a Doukana Tree heavy with fruit. Each day, the man went there and ate some, but he never carried any home. He kept eating until only two Doukanas remained. He ate one and left the last for another day.
        - id: ch01-b03
          speaker: narrator
          text: The next day, that final fruit hung too high to reach from the ground. The man climbed the tree, and the Doukana dropped down. As soon as he climbed down, it jumped back up. He tried again and again, until he was worn out.
    - id: ch02
      title: The Dog Runs Away
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: The man asked every animal that passed to help him, but each one had an excuse. They all had work to do. The horse explained why it could not stop.
        - id: ch02-b02
          speaker: horse
          text: I have my own work waiting. If I don't do it, I won't have any grass to eat.
        - id: ch02-b03
          speaker: narrator
          text: The donkey only brayed. At last, a dog came along. The man begged and begged for its help.
        - id: ch02-b04
          speaker: dog
          text: All right. I'll help you.
        - id: ch02-b05
          speaker: narrator
          text: The man climbed the tree, and down jumped the Doukana. The dog snatched it up and ran away with it. The man was furious. He chased the dog, but the dog only ran faster, and the man could not catch it.
        - id: ch02-b06
          speaker: narrator
          text: When the dog saw the man coming after it, it raced to the seashore. There it scratched a hole and buried its whole body, leaving only its nose above the ground.
    - id: ch03
      title: The Nose in the Ground
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: Soon the man reached the same spot. He noticed the nose sticking out of the earth.
        - id: ch03-b02
          speaker: man
          text: I've never seen ground with a nose!
          emotion: surprised
        - id: ch03-b03
          speaker: narrator
          text: He grabbed the nose and pulled until the dog came out. Then he squeezed the dog with all his strength, trying to make it give up the Doukana.
        - id: ch03-b04
          speaker: narrator
          text: And that is why dogs have such small bodies to this very day.
