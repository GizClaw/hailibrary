audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: thoughtful and gently wry
        timbre: warm and clear
        pace: measured
        pitch: medium
    man:
      display_name: Man
      tts:
        delivery: lazy and easily frustrated
        timbre: earthy and rough
        pace: measured
        pitch: medium-low
    horse:
      display_name: Horse
      tts:
        delivery: practical and brisk
        timbre: strong and clear
        pace: steady
        pitch: medium-low
    dog:
      display_name: Dog
      tts:
        delivery: willing but sly
        timbre: bright and nimble
