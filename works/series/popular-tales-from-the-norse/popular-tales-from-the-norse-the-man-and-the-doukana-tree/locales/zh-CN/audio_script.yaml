audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 从容而清醒，带一点克制的诙谐
        timbre: 温厚清晰
        pace: 舒缓有致
        pitch: 中低
    man:
      display_name: 男人
      tts:
        delivery: 懒散贪嘴，着急时执拗又气恼
        timbre: 粗厚朴实
        pace: 中等
        pitch: 中低
    dog:
      display_name: 狗
      tts:
        delivery: 爽快机灵，说话简短利落
        timbre: 清亮灵活
        pace: 稍快
        pitch: 中高
  chapters:
    - id: ch01
      title: 树上最后一颗果子
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 从前，有一对穷苦夫妻，家里的孩子又多。妻子为了全家，能做什么就做什么。丈夫却懒得很，半点忙也不肯帮。
        - id: ch01-b02
          speaker: narrator
          text: 附近的林子里有一棵杜卡纳树，结了满树果子。男人天天跑去摘着吃，可一次也没往家里带。他不停地吃，树上终于只剩两颗。他吃掉一颗，把另一颗留到了第二天。
        - id: ch01-b03
          speaker: narrator
          text: 第二天，男人发现最后那颗果子长得太高，只得爬上树。可他刚爬上去，果子就落到了地上。他才回到地面，果子又跳回树上。他上上下下折腾了不知多少回，累得再也爬不动了。
    - id: ch02
      title: 狗衔走了果子
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 男人只好向路过的动物求助。可大家都有借口，也都有自己的事。马说它得干活，不然便没有草吃。驴子只是冲他咴咴叫了几声。最后，一条狗走了过来，男人苦苦地求它帮忙。
        - id: ch02-b02
          speaker: dog
          text: 好，我来帮你。
        - id: ch02-b03
          speaker: narrator
          text: 男人又爬上树，杜卡纳果果然跳回地面。狗一口衔住果子，撒腿就跑。男人气得在后面猛追，可狗越跑越快，他根本追不上。
        - id: ch02-b04
          speaker: narrator
          text: 狗看见男人还追在后头，就跑到海边，刨开一个洞，把自己埋了进去。地面上只露着它的鼻子。
    - id: ch03
      title: 地上长出的鼻子
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 不久，男人也追到了海边。他一眼看见地面上的那只鼻子，忍不住叫了起来。
        - id: ch03-b02
          speaker: man
          text: 我可从没见过地上还会长鼻子！
        - id: ch03-b03
          speaker: narrator
          text: 男人一把抓住鼻子，使劲往外拔，终于把狗整个拖了出来。接着，他拼尽力气挤压狗的身子，非要它交出杜卡纳果不可。
        - id: ch03-b04
          speaker: narrator
          text: 所以直到今天，狗的身子还是那么小。
