audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 从容而清醒，带一点克制的诙谐
        timbre: 温厚清晰
        pace: 舒缓有致
        pitch: 中低
    eldest_son:
      display_name: 大儿子
      tts:
        delivery: 起初自信，失败后满腹怨气
        timbre: 年轻粗朴
        pace: 中等
        pitch: 中
    second_son:
      display_name: 二儿子
      tts:
        delivery: 固执自信，说话直截了当
        timbre: 年轻清晰
        pace: 中等
        pitch: 中
    boots:
      display_name: 灰小子
      tts:
        delivery: 朴实沉着，带着不声张的勇气
        timbre: 年轻温暖
        pace: 中等
        pitch: 中
    king:
      display_name: 国王
      tts:
        delivery: 威严急躁，发怒时不容争辩
        timbre: 饱满有力
        pace: 中等
        pitch: 中低
    old_hag:
      display_name: 老妖婆
      tts:
        delivery: 哄诱亲热，声音里藏着尖刻
        timbre: 干涩苍老
        pace: 偏慢
        pitch: 中低
    father:
      display_name: 父亲
      tts:
        delivery: 忧心务实，语气疲惫
        timbre: 低沉温和
        pace: 中等
        pitch: 低
    mother:
      display_name: 母亲
      tts:
        delivery: 焦急疼惜，劝说时恳切
        timbre: 柔和疲惫
        pace: 中等
        pitch: 中
    eldest_foal:
      display_name: 大马驹
      tts:
        delivery: 郑重坚定，说话有分量
        timbre: 年轻清亮
        pace: 中等
        pitch: 中低
    second_foal:
      display_name: 二马驹
      tts:
        delivery: 诚恳直接，语气认真
        timbre: 年轻清晰
        pace: 中等
        pitch: 中
    third_foal:
      display_name: 三马驹
      tts:
        delivery: 诚恳直接，语气明快
        timbre: 年轻明亮
        pace: 中等
        pitch: 中
    youngest_foal:
      display_name: 小马驹
      tts:
        delivery: 耐心警醒，鼓励人时温和笃定
        timbre: 年轻温暖
        pace: 中等
        pitch: 中高
  chapters:
    - id: ch01
      title: 国王的七匹马驹
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 从前，森林深处住着一对穷夫妻。他们的破屋实在不像个家。一家人靠什么过日子，我说不清，只知道他们吃了上顿愁下顿，想填饱肚子也得拼命干活。夫妻俩有三个儿子。最小的那个自然叫灰小子，因为他成天躺在炉边，除了拨弄灰烬，几乎什么也不做。
        - id: ch01-b02
          speaker: narrator
          text: 有一天，大儿子决定出门谋生。父母答应以后，他走了整整一天，直到黄昏才来到一座王宫。国王正站在台阶上，看见他便问要去哪里。
        - id: ch01-b03
          speaker: eldest_son
          text: 我正在四处找活儿干。
        - id: ch01-b04
          speaker: king
          text: 那就替我看守七匹马驹。你得跟住它们一整天，晚上告诉我，它们究竟吃什么、喝什么。办得到，你就娶公主，再拿走半壁江山。办不到，我便从你背上割下三道肉条。听明白了吗？
        - id: ch01-b05
          speaker: narrator
          text: 小伙子觉得，这差事实在容易。第二天天刚亮，马车夫便把七匹马驹放了出去。它们一下子跑远了，翻山越岭，穿过灌木和沼泽。小伙子拼命追在后面，跑得满头大汗。没过多久，他便累了。再勉强跑上一阵，他已经受够了。就在这时，前面出现一道岩缝，一个老妖婆正坐在里面，用纺锤纺线。
        - id: ch01-b06
          speaker: old_hag
          text: 来呀，我的俊小子。过来把头枕在我膝上，让我给你梳梳头。
        - id: ch01-b07
          speaker: narrator
          text: 小伙子巴不得歇一歇，马上坐到老妖婆身边，把头枕上她的膝盖。他懒洋洋地伸开四肢，任她梳了一整天。等天快黑了，他才想起该走了。
        - id: ch01-b08
          speaker: eldest_son
          text: 反正回王宫也没有用。我还是直接回家吧。
        - id: ch01-b09
          speaker: old_hag
          text: 别急，等到天黑。马驹还会从这里回来。到时候你跟着它们跑回去，谁也不会知道你在我这里躺了一整天。
        - id: ch01-b10
          speaker: narrator
          text: 天黑以后，马驹果然又从岩缝前经过。老妖婆递给小伙子一瓶水和一块草皮，叫他跟着它们跑回王宫。她还教他对国王撒谎，说这两样正是马驹吃喝的东西。小伙子全都照办了。等他回到王宫，国王早已在那里等他。
        - id: ch01-b11
          speaker: king
          text: 你一整天都好好看住它们了吗？
        - id: ch01-b12
          speaker: eldest_son
          text: 那当然。
        - id: ch01-b13
          speaker: king
          text: 那就说说看，它们吃什么，喝什么？
        - id: ch01-b14
          speaker: eldest_son
          text: 这块草皮是它们吃的，这瓶水是它们喝的。
        - id: ch01-b15
          speaker: narrator
          text: 他把两样东西举到国王面前。国王一看就知道，这小伙子压根没有好好看守马驹，顿时大发雷霆。他命人先从小伙子背上割下三道鲜红的肉条，再把盐用力揉进伤口，随后当场将人赶出王宫，一路赶回家去。小伙子终于走到破屋时是什么脸色，你大概想得到。
        - id: ch01-b16
          speaker: eldest_son
          text: 我出门找过一回差事，这辈子再也不去了。
    - id: ch02
      title: 二儿子碰碰运气
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 第二天，二儿子说，他也想到外面碰碰运气。
        - id: ch02-b02
          speakers: [father, mother]
          ensemble: duo
          text: 不行！先看看你哥哥的背吧！
        - id: ch02-b03
          speaker: narrator
          text: 二儿子怎么也不肯听。他一再坚持，父母最后只好让他上路。他走了整整一天，也来到那座王宫。国王站在台阶上问他去哪里。听说他在找差事，国王便让他看守七匹马驹，还说明赏赐和惩罚都与哥哥那次一样。二儿子觉得自己准能办成。他相信，只要跟住马驹，就一定能查清它们吃什么、喝什么，于是当场接下差事。次日天色还是灰蒙蒙的，马车夫便放出马驹。它们又翻山越岭地飞奔起来，二儿子在后面追了很久，跑得又热又累。最后，他也来到那道岩缝，看见老妖婆拿着纺锤坐在那里。
        - id: ch02-b04
          speaker: old_hag
          text: 来呀，我的俊小子。坐到这里，让我替你梳梳头。
        - id: ch02-b05
          speaker: narrator
          text: 二儿子觉得这个主意好极了。他丢下马驹，在岩缝里坐坐躺躺，舒展着懒骨头，整整歇了一天。马驹天黑回来时，老妖婆同样给他一瓶水和一块草皮。她让他把这当作马驹吃喝的证据，他便拿着两样东西去见国王。
        - id: ch02-b06
          speaker: king
          text: 现在，你能说出我的马驹吃什么、喝什么了吗？
        - id: ch02-b07
          speaker: second_son
          text: 这块草皮是它们吃的，这瓶水是它们喝的。
        - id: ch02-b08
          speaker: narrator
          text: 国王哪里会上第二次当。他又气得火冒三丈，命人从二儿子背上割下三道鲜红的肉条，在伤口里撒上盐，当场把他赶回家。二儿子一路忍着疼痛回到破屋，把自己怎样接下差事，又怎样受罚的经过告诉了一家人。
        - id: ch02-b09
          speaker: second_son
          text: 找差事这种事，我试过一次就够了。以后再也别想让我去。
    - id: ch03
      title: 灰小子出发
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 到了第三天，灰小子说，他也要去看守那七匹马驹。两个哥哥听了，立刻嘲笑起来。
        - id: ch03-b02
          speakers: [eldest_son, second_son]
          ensemble: duo
          text: 我们都落得那么惨，你倒觉得自己能办成？真是笑话！你只会躺着拨灰，还做过什么？
        - id: ch03-b03
          speaker: boots
          text: 我为什么不能去？这个念头已经钻进脑袋里，我赶也赶不走。
        - id: ch03-b04
          speaker: narrator
          text: 哥哥们一路取笑，老父母也苦苦相劝，可灰小子就是不肯改变主意。大家拿他没办法，只得让他出门。他独自走了整整一天，直到黄昏才来到王宫。国王依旧站在台阶上，看见他便开口询问。
        - id: ch03-b05
          speaker: king
          text: 你要去哪里？
        - id: ch03-b06
          speaker: boots
          text: 我四处走走，想打听一份差事。
        - id: ch03-b07
          speaker: king
          text: 你是从什么地方来的？
        - id: ch03-b08
          speaker: narrator
          text: 国王雇人以前，总要先问问底细。灰小子说了自己的来处，也坦白告诉国王，前两天看守马驹的正是他的两个哥哥。接着，他请求第二天也去试一回。
        - id: ch03-b09
          speaker: king
          text: 呸！你既然是那两个无赖的弟弟，想来也没什么用。我已经受够你们这种人了！
          emotion: angry
        - id: ch03-b10
          speaker: boots
          text: 可我大老远都走到这里了。让我也试一次，又有什么妨碍？
        - id: ch03-b11
          speaker: king
          text: 好吧。你要是非想让人剥掉背上的皮，我当然可以成全你。
        - id: ch03-b12
          speaker: boots
          text: 比起剥皮，我还是更想娶公主。
        - id: ch03-b13
          speaker: narrator
          text: 次日天刚蒙蒙亮，马车夫又把七匹马驹放了出来。它们冲过山谷和灌木，也冲过一片片沼泽，灰小子始终紧追不放。跑了许久，他来到老妖婆纺线的岩缝前。
        - id: ch03-b14
          speaker: old_hag
          text: 来呀，我的俊小子。让我替你梳梳头。
        - id: ch03-b15
          speaker: boots
          text: 你倒是来抓我呀！有本事就来呀！
        - id: ch03-b16
          speaker: narrator
          text: 灰小子嘴里答着，脚下半点没停。他连跑带跳，紧紧抓住一匹马驹的尾巴，一转眼便把岩缝、老妖婆和她那把梳子全甩在身后。他始终没有松开马驹。等大家跑出很远，最小的马驹才回过头来，对他说话了。
        - id: ch03-b17
          speaker: youngest_foal
          text: 小伙子，上来骑着我吧。我们还有很长的路要走。
        - id: ch03-b18
          speaker: narrator
          text: 灰小子跳上它的背。马驹们带着他，不停地走啊走，一直走到很远的地方。
    - id: ch04
      title: 白桦树后的大剑
      blocks:
        - id: ch04-b01
          speaker: youngest_foal
          text: 你现在能看见什么吗？
        - id: ch04-b02
          speaker: boots
          text: 什么也看不见。
        - id: ch04-b03
          speaker: narrator
          text: 他们继续赶路，又一直走了好一阵。
        - id: ch04-b04
          speaker: youngest_foal
          text: 这会儿呢？前面有东西了吗？
        - id: ch04-b05
          speaker: boots
          text: 还是没有。
        - id: ch04-b06
          speaker: narrator
          text: 他们走得更远了。到底走出多远，就连我也说不上来。小马驹又问了一遍。
        - id: ch04-b07
          speaker: youngest_foal
          text: 现在看见了吗？
        - id: ch04-b08
          speaker: boots
          text: 看见了。那里有一样白色的东西，像一根又高又粗的白桦树干。
        - id: ch04-b09
          speaker: youngest_foal
          text: 我们要进的就是那根树干。
        - id: ch04-b10
          speaker: narrator
          text: 马驹们来到白桦树干前。最大的那匹把树干推开，下面竟露出一扇门。门后有间小屋，里面只有一个小壁炉和一两条长凳，几乎是空的。不过，门背后还挂着一把锈迹斑斑的大剑，旁边放着一只小罐子。
        - id: ch04-b11
          speakers: [eldest_foal, second_foal, third_foal, youngest_foal]
          ensemble: chorus
          text: 拿起那把剑试试。你能挥动它吗？
        - id: ch04-b12
          speaker: narrator
          text: 灰小子试过了，可那把剑根本不听使唤。马驹们叫他喝罐里的东西。他先喝一口，再喝一口，又喝了第三口。喝完以后，大剑在他手中轻得像什么似的，想怎么挥便怎么挥。
        - id: ch04-b13
          speakers: [eldest_foal, second_foal, third_foal, youngest_foal]
          ensemble: chorus
          text: 现在，把剑带在身边。到了你成婚那天，用它砍下我们七个的脑袋。这样，我们便能重新变回王子。我们都是公主的哥哥。只要你说出我们吃喝的东西，就会娶到她。是一个丑陋的巨怪施了魔法，才把我们变成马驹。砍完以后，记得把每个脑袋放到原来那副身子的尾巴旁边。只有这样，魔法才会失去力量。
        - id: ch04-b14
          speaker: narrator
          text: 灰小子答应照办。他记住了婚礼那天要砍下七个脑袋，也记住了每个脑袋该放在哪里。他带着大剑离开那间小屋，又骑上小马驹，随着大家继续向前。白桦树干越来越远，他们又赶了很久的路。
    - id: ch05
      title: 河对岸的教堂
      blocks:
        - id: ch05-b01
          speaker: youngest_foal
          text: 你看见什么了吗？
        - id: ch05-b02
          speaker: boots
          text: 没有。
        - id: ch05-b03
          speaker: narrator
          text: 他们又走了好一程。
        - id: ch05-b04
          speaker: youngest_foal
          text: 现在呢？
        - id: ch05-b05
          speaker: boots
          text: 还是看不见。
        - id: ch05-b06
          speaker: narrator
          text: 他们翻山越岭，又走过不知多少里路。小马驹再次开口询问。
        - id: ch05-b07
          speaker: youngest_foal
          text: 这回总该看见什么了吧？
        - id: ch05-b08
          speaker: boots
          text: 看见了。远处有一道蓝色的东西。
        - id: ch05-b09
          speaker: youngest_foal
          text: 那是一条河。我们得从河上过去。
        - id: ch05-b10
          speaker: narrator
          text: 河上横着一座又长又气派的大桥。马驹们带灰小子走过长桥，到了对岸以后，仍旧不停地往前赶。走了很远很远，前面的景色才有了一点变化。小马驹又问灰小子，这回是否看见了什么。
        - id: ch05-b11
          speaker: boots
          text: 这次有了。远处有一样黑色的东西，看上去像教堂的尖顶。
        - id: ch05-b12
          speaker: youngest_foal
          text: 那里就是我们要去的地方。
        - id: ch05-b13
          speaker: narrator
          text: 七匹马驹走进教堂墓园，马上变成了七位王子。他们一个个衣着华美，浑身闪闪发亮。王子们走进教堂，灰小子也跟在后面。祭坛前站着一位牧师，他把面包和葡萄酒分给王子们，又把手按在他们头上，为他们祝福。仪式结束以后，王子们先后走出教堂。灰小子也一道离开，不过他走时还带上了一小瓶葡萄酒和一片圣饼。
        - id: ch05-b14
          speaker: narrator
          text: 七位王子刚踏进墓园，立刻又成了马驹。灰小子骑上最小那匹，大家沿着来路返回。这一回，它们跑得比来时快得多。他们先冲过河上的大桥，接着飞奔过藏着小屋的白桦树干，最后从老妖婆纺线的岩缝旁一闪而过。速度实在太快，灰小子没听清老妖婆在身后尖叫些什么。不过，他听到的那几声已经足以说明，她简直气疯了。
    - id: ch06
      title: 真正的答案
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: 回到王宫时，天差不多全黑了。国王亲自站在台阶上等着他们。
        - id: ch06-b02
          speaker: king
          text: 你今天确实好好看住马驹了吗？
        - id: ch06-b03
          speaker: boots
          text: 我已经尽了全力。
        - id: ch06-b04
          speaker: king
          text: 那就告诉我，它们吃什么，喝什么？
        - id: ch06-b05
          speaker: narrator
          text: 灰小子取出圣饼和那瓶葡萄酒，送到国王面前。
        - id: ch06-b06
          speaker: boots
          text: 圣饼是它们吃的，葡萄酒是它们喝的。
        - id: ch06-b07
          speaker: king
          text: 对，这一回你确实看守得很好。公主可以嫁给你，我的半壁江山也归你。
        - id: ch06-b08
          speaker: narrator
          text: 这件婚事就此定了下来，宫里马上开始筹备。国王亲自吩咐下去，一定要把婚宴办得盛大无比，好让远近所有人都谈论这场喜事。
    - id: ch07
      title: 婚宴上的七位王子
      blocks:
        - id: ch07-b01
          speaker: narrator
          text: 婚礼那天，大家在宴席旁一一落座。正要开席时，新郎忽然站了起来。他告诉众人，自己忘了一件东西，非得亲自取回来不可。说完，他便离开婚宴大厅，独自走到七匹马驹所在的马厩。
        - id: ch07-b02
          speaker: narrator
          text: 灰小子完全照它们教的去做。他举起那把锈迹斑斑的大剑，从最大的马驹开始，依次砍下七个脑袋。每砍下一个，他都把脑袋放在原来那副身子的尾巴旁边。等他做完，七匹马驹果然全都恢复人形，重新成了王子。
        - id: ch07-b03
          speaker: narrator
          text: 灰小子带七位王子一起回到婚宴大厅。国王看见失散的儿子们全都恢复了原形，高兴得又亲灰小子，又拍他的背。新娘发现七个哥哥都摆脱了魔法，欢喜更胜从前，也更加爱自己的丈夫。
        - id: ch07-b04
          speaker: king
          text: 半壁江山已经给了你。等我死后，另一半也由你继承。我的儿子们重新做回王子，自然有本事替自己挣来土地和财富。
        - id: ch07-b05
          speaker: narrator
          text: 你大概也猜得到，那场婚礼上处处都是欢声笑语。
        - id: ch07-b06
          speaker: narrator
          text: 我也去了，可谁都没想起照顾可怜的我。我只分到一小块涂了黄油的面包。刚把它放在炉子上，面包就焦了，黄油也流了个精光。到头来，我连最小的一点面包屑都没吃着。
        - id: ch07-b07
          speaker: narrator
          text: 你说，这是不是太不像话了？
