audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: thoughtful and gently wry
        timbre: warm and clear
        pace: measured
        pitch: medium
    hen:
      display_name: Hen
      tts:
        delivery: insistent and complaining
        timbre: light and clucking
        pace: lively
        pitch: high
    cock:
      display_name: Cock
      tts:
        delivery: confident and hearty
        timbre: bright and ringing
        pace: measured
        pitch: medium-high
  chapters:
    - id: ch01
      title: Year After Year
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: The cock and hen spoke in the notes of their own calls.
        - id: ch01-b02
          speaker: hen
          text: Every year, you promise me shoes. Year after year, you say it, but I still have none!
    - id: ch02
      title: Henny Penny
      blocks:
        - id: ch02-b01
          speaker: cock
          text: You'll get your shoes. Don't worry, Henny Penny!
    - id: ch03
      title: Barefoot
      blocks:
        - id: ch03-b01
          speaker: hen
          text: I lay one egg after another, but I still have to walk around barefoot!
        - id: ch03-b02
          speaker: cock
          text: Then take your eggs to the tryst and buy yourself some shoes. You needn't go barefoot any longer!
