audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: thoughtful and gently wry
        timbre: warm and clear
        pace: measured
        pitch: medium
    quanqua:
      display_name: Quanqua
      tts:
        delivery: crafty and evasive
        timbre: nimble and dry
        pace: measured
        pitch: medium
    atoukama:
      display_name: Atoukama
      tts:
        delivery: practical and forthright
        timbre: clear and grounded
        pace: steady
        pitch: medium
    ananzi:
      display_name: Ananzi
      tts:
        delivery: sly and self-assured
        timbre: light and crisp
        pace: lively
        pitch: medium-high
  chapters:
    - id: ch01
      title: The Ox at the River
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Quanqua was a clever fellow, with a large house full of meat. Whenever anyone asked him a question, he answered, “Quan? Qua?” That meant, “How? What?” And so everyone called him Quanqua.
        - id: ch01-b02
          speaker: narrator
          text: One day, Quanqua met Atoukama, Ananzi's wife. She was driving an ox, but it refused to walk. Quanqua helped her, and they managed well enough until they reached a river. There the ox would not enter the water.
        - id: ch01-b03
          speaker: atoukama
          text: Quanqua, help me drive this ox across the river.
        - id: ch01-b04
          speaker: quanqua
          text: Quan? Qua? How? What?
        - id: ch01-b05
          speaker: narrator
          text: That was the only answer she could get from him. At last, Atoukama lost her patience.
        - id: ch01-b06
          speaker: atoukama
          text: Oh, you stupid fellow! You're no help at all. Stay here and watch the ox while I go and find someone who can drive it across.
          emotion: angry
        - id: ch01-b07
          speaker: narrator
          text: Then she went away to fetch Ananzi.
    - id: ch02
      title: The Tail in the Ground
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: As soon as Atoukama was gone, Quanqua killed the ox and hid it from Ananzi. First, he cut off its tail. He dug a hole near the riverbank, pushed the tail partway into the earth, and left the tip showing.
        - id: ch02-b02
          speaker: narrator
          text: When Quanqua saw Ananzi coming, he seized the tail and began to tug. He acted as if he were trying to pull the whole ox out of the hole.
        - id: ch02-b03
          speaker: narrator
          text: Ananzi ran up as fast as he could and pulled at the tail with all his strength. Over he went, straight into the river. But he kept hold of the tail and somehow made his way across the water.
        - id: ch02-b04
          speaker: ananzi
          text: You lazy fellow! You couldn't even look after the ox. You won't get one bit of this tail.
          emotion: angry
        - id: ch02-b05
          speaker: narrator
          text: And off Ananzi went with it. Once he was completely out of sight, Quanqua carried the hidden ox home and made himself a very good dinner.
    - id: ch03
      title: White Yams and Red
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: The next day, Quanqua went to Ananzi's house and asked him to share the tail. Quanqua had plenty of yams, but no meat. They agreed to cook together in one pot. Quanqua would add white yams, while Ananzi would add the tail and red yams.
        - id: ch03-b02
          speaker: narrator
          text: When it was time to fill the pot, Quanqua put in a great heap of white yams. Ananzi dropped in just one tiny red cush-cush yam.
        - id: ch03-b03
          speaker: quanqua
          text: Will that one little yam really be enough for you?
        - id: ch03-b04
          speaker: ananzi
          text: Oh, that's plenty. I don't eat very much.
        - id: ch03-b05
          speaker: narrator
          text: The pot boiled. When they lifted the cover and sat down to divide the food, not one white yam could be found. The little cush-cush yam had dyed every one of them red. Ananzi claimed all the yams as his own, and Quanqua had to be satisfied with whatever Ananzi chose to give him.
    - id: ch04
      title: The Test of Heat
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: After they had finished eating, the two fellows decided to find out which of them could bear heat better. They heated two irons, and Ananzi was to try first on Quanqua.
        - id: ch04-b02
          speaker: narrator
          text: But Ananzi made attempt after attempt without ever bringing the iron close. By the time he was ready, it had gone cold.
        - id: ch04-b03
          speaker: narrator
          text: Then Quanqua took his turn. He pulled the other iron straight from the fire and thrust it right down Ananzi's throat.
