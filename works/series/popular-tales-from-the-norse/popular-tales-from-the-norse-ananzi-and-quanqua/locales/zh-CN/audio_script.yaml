audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 从容而清醒，带一点克制的诙谐
        timbre: 温厚清晰
        pace: 舒缓有致
        pitch: 中低
    ananzi:
      display_name: 阿南西
      tts:
        delivery: 得意健谈，夸耀时理直气壮
        timbre: 明亮灵活
        pace: 中等
        pitch: 中高
    quanqua:
      display_name: 宽夸
      tts:
        delivery: 机灵滑头，装糊涂时故意含混
        timbre: 清亮圆滑
        pace: 中等
        pitch: 中
    atoukama:
      display_name: 阿图卡玛
      tts:
        delivery: 爽直利落，失去耐心时毫不客气
        timbre: 清晰坚实
        pace: 中等
        pitch: 中
  chapters:
    - id: ch01
      title: 河边的牛尾
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 宽夸是个聪明家伙。他有一所大房子，里面装满各种肉食。可不管别人问什么，他总用自己的名字应声。“宽？夸？”听起来正是“怎么？什么？”于是，大家都叫他宽夸。
        - id: ch01-b02
          speaker: narrator
          text: 一天，宽夸在路上遇见阿南西的妻子阿图卡玛。她赶着一头牛，可那头牛就是不肯走。宽夸上前帮忙，两人一路还算顺利。到了河边，牛又停住了，怎么也不肯下水。
        - id: ch01-b03
          speaker: atoukama
          text: 宽夸，快帮我把牛赶过河去。
        - id: ch01-b04
          speaker: quanqua
          text: 你问我怎么赶？要我做什么？
        - id: ch01-b05
          speaker: narrator
          text: 阿图卡玛问了又问，得到的还是那一声声“宽？夸？”她终于失去了耐心。
        - id: ch01-b06
          speaker: atoukama
          text: 唉，你这个笨家伙，半点用处也没有！留在这里看好牛，我去叫人来帮忙。
          emotion: angry
        - id: ch01-b07
          speaker: narrator
          text: 阿图卡玛去找阿南西了。她刚走，宽夸就杀掉那头牛，把它整个藏了起来，免得让阿南西看见。他先割下牛尾，又在河岸边挖了个洞，把牛尾塞进去一截，只露出一点尾巴尖。
        - id: ch01-b08
          speaker: narrator
          text: 远远望见阿南西过来，宽夸抓住牛尾，使劲往外拉，假装整头牛就在洞里。阿南西赶忙跑上前，用尽力气跟着一扯，自己却一头栽进河中。他紧紧抓着牛尾没放，好不容易才到了对岸。
        - id: ch01-b09
          speaker: ananzi
          text: 你这个懒家伙，连牛都看不好！这条牛尾一点也不分给你。
          emotion: angry
        - id: ch01-b10
          speaker: narrator
          text: 阿南西拿着牛尾走了。等他彻底没了踪影，宽夸才把藏好的牛带回家，美美地吃了一顿。
    - id: ch02
      title: 一锅红山药
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 第二天，宽夸来到阿南西家，向他讨些牛尾。他说，自己山药很多，却一点肉也没有。两人便约好合用一口锅。宽夸拿白山药，阿南西拿牛尾和红山药。
        - id: ch02-b02
          speaker: narrator
          text: 到了下锅的时候，宽夸放进一大堆白山药。阿南西却只丢进去一小块红色的库什库什山药。宽夸看着那一小块，问他这就够了吗。
        - id: ch02-b03
          speaker: ananzi
          text: 噢，足够了！我吃不了多少。
    - id: ch03
      title: 消失的白山药
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 锅煮开以后，两人揭开盖子，坐下来要分各自的食物。可他们翻来找去，一块白山药也找不到。那小小的红山药，早把所有白山药都染红了。
        - id: ch03-b02
          speaker: narrator
          text: 阿南西说，红山药当然全归自己。宽夸倒也乐得接过阿南西愿意分给他的那一份。
    - id: ch04
      title: 谁最经得住烫
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 吃过东西，两人还要比比谁更经得住烫。他们把两根铁条放进火里烧热，先让阿南西拿一根在宽夸身上试。
        - id: ch04-b02
          speaker: narrator
          text: 阿南西试了一次又一次，却始终不敢把铁条凑近宽夸。还没等他下手，铁条已经凉了。
        - id: ch04-b03
          speaker: narrator
          text: 接着轮到宽夸。他从火里抽出另一根铁条，径直捅进了阿南西的喉咙。
