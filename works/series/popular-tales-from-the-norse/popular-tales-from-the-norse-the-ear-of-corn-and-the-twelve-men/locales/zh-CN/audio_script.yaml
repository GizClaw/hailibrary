audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 从容而清醒，带一点克制的诙谐
        timbre: 温厚清晰
        pace: 舒缓有致
        pitch: 中低
    ananzi:
      display_name: 阿南西
      tts:
        delivery: 得意健谈，夸耀时理直气壮
        timbre: 明亮灵活
        pace: 中等
        pitch: 中高
    mourner:
      display_name: 送葬男子
      tts:
        delivery: 低落克制，回答简短
        timbre: 沉静微哑
        pace: 缓慢
        pitch: 中低
  chapters:
    - id: ch01
      title: 一穗玉米
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 这个故事的开头残缺不全。
        - id: ch01-b02
          speaker: ananzi
          text: 陛下，只要给我一穗玉米，我就能给您带回十二个壮汉。
        - id: ch01-b03
          speaker: narrator
          text: 国王给了他一穗玉米，阿南西拿着它上了路。走到一户人家，他请求住上一夜，主人答应了。
        - id: ch01-b04
          speaker: narrator
          text: 第二天天刚亮，阿南西把玉米穗扔到门外，任凭鸡群去啄，自己又钻回去睡觉。等他再起来，便装模作样地到处寻找。当然，他怎么也找不到了。
        - id: ch01-b05
          speaker: ananzi
          text: 一定是你们的鸡把我的玉米吃了。不给我家里最好的公鸡，这事就不算完。
        - id: ch01-b06
          speaker: narrator
          text: 主人没有办法，只得把最好的公鸡赔给他。阿南西提着公鸡走了一天，夜里又到另一户人家借宿。主人想把鸡关进鸡舍，他却不肯。
        - id: ch01-b07
          speaker: ananzi
          text: 不行，我的公鸡得睡在羊圈里。
        - id: ch01-b08
          speaker: narrator
          text: 主人照他说的做了。到了半夜，阿南西悄悄爬起来，杀死公鸡，把它扔回羊圈，然后回房睡觉。次日要走时，他发现公鸡死了，别的赔偿一概不要，非得拿走主人家最好的一只羊。主人只好答应。
    - id: ch02
      title: 从公鸡到小母牛
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 阿南西带着羊走了一整天，天黑时来到一个村子，又找到地方住下。村民要把这只羊赶进羊群里，他还是摇头。
        - id: ch02-b02
          speaker: ananzi
          text: 我的羊不能睡羊圈，得跟牛关在一起。
        - id: ch02-b03
          speaker: narrator
          text: 村民便把羊送进牛栏。半夜，阿南西起身杀掉它，随后又若无其事地睡了。第二天早晨，他去牵羊，见羊已经死了，便向村民索要他们最好的小母牛。
        - id: ch02-b04
          speaker: ananzi
          text: 不把最好的小母牛赔给我，我就回去禀告国王，让国王带兵来攻打你们。
        - id: ch02-b05
          speaker: narrator
          text: 村民只想赶快送走这个麻烦，痛痛快快地交出了小母牛。阿南西牵着牛，又走了差不多一整天。
    - id: ch03
      title: 黑暗里的妹妹
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 快到傍晚时，阿南西遇见一支送葬的队伍。他问是谁去世了。
        - id: ch03-b02
          speaker: mourner
          text: 是我的妹妹。
        - id: ch03-b03
          speaker: narrator
          text: 阿南西竟想把死者要走。送葬的人起先怎么也不肯，可他一个劲儿地央求，还愿意交出小母牛来换。最后，他们同意了。阿南西扛着尸体继续赶路，直到天黑，来到一座大城。
        - id: ch03-b04
          speaker: narrator
          text: 他走进一户人家，说自己和妹妹想借宿一夜。妹妹累得一步也走不动，只好由他背着。要是主人肯收留他们，兄妹俩一定十分感激。主人听了，便让他们进屋。
        - id: ch03-b05
          speaker: ananzi
          text: 我妹妹受不了亮光，请让我们待在一间黑屋子里吧。
        - id: ch03-b06
          speaker: narrator
          text: 主人把他们带进一间没有灯的房间。旁人离开以后，阿南西坐到桌边的长凳上，让“妹妹”紧挨着自己，还伸出一只胳膊把她撑住。主人送来两盘晚饭，他把一盘摆在“妹妹”面前，又将她的手放进盘里，自己却把两份饭全吃了。
        - id: ch03-b07
          speaker: narrator
          text: 要睡觉时，阿南西又提出一个请求。妹妹会犯病，他想让她睡进十二个壮汉的房间。万一她夜里发作，那些人能按住她，也不会吵醒屋里其他人。主人答应了。
        - id: ch03-b08
          speaker: narrator
          text: 阿南西抱着尸体进了那间房，说妹妹累得睡着了，便把她放到床上。他嘱咐十二个男人千万别惊动她，自己转身去隔壁睡觉。
    - id: ch04
      title: 十二个壮汉
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 到了半夜，那十二个人闻见一股难闻的恶臭，纷纷叫嚷起来。他们想把那个女人弄醒。一个人先打了她一下，另一个人也跟着动手。到最后，十二个人谁都打过她。隔壁闹得这样厉害，阿南西却始终不理。
        - id: ch04-b02
          speaker: narrator
          text: 第二天早晨，阿南西走进房间来接“妹妹”。见她已经死了，他马上说，是那些男人把她杀死的。
        - id: ch04-b03
          speaker: ananzi
          text: 你们害死了我妹妹，必须把这十二个人全赔给我。少一个也不行！
        - id: ch04-b04
          speaker: narrator
          text: 城里人不肯答应。他们不相信十二个人个个都参与了杀人。可是，那些男人承认，每个人的确打过她一下。阿南西于是紧紧咬住这一点，绝不肯让步。
        - id: ch04-b05
          speaker: narrator
          text: 最后，他把十二个壮汉全都带走，交给了国王。
