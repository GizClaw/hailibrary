  chapters:
    - id: ch01
      title: The Ear of Corn
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: The beginning of this tale has not come down to us perfectly. It starts with Ananzi making the King a promise.
        - id: ch01-b02
          speaker: ananzi
          text: Give me one ear of corn, and I will bring you twelve strong men.
        - id: ch01-b03
          speaker: narrator
          text: The King gave him the corn, and Ananzi set out. After a time, he reached a house.
        - id: ch01-b04
          speaker: ananzi
          text: Will you give me a place to sleep tonight?
        - id: ch01-b05
          speaker: first_host
          text: Yes, you may stay here.
        - id: ch01-b06
          speaker: narrator
          text: Very early the next morning, Ananzi threw the corn outside to the fowls, then went back to bed. Later, he got up and pretended he could not find it.
        - id: ch01-b07
          speaker: ananzi
          text: Your fowls must have eaten my corn. I will not be satisfied unless you give me the best cock you have.
        - id: ch01-b08
          speaker: narrator
          text: They had to give him their best cock, and away he went.
    - id: ch02
      title: The Cock and the Sheep
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: He traveled all day. At night, another household gave him lodging and prepared to put his cock in the fowl-house.
        - id: ch02-b02
          speaker: ananzi
          text: No. My cock must spend the night in the sheep pen.
        - id: ch02-b03
          speaker: narrator
          text: So they put the cock in with the sheep. At midnight, Ananzi got up, killed the cock, tossed it back into the pen, and returned to bed.
        - id: ch02-b04
          speaker: narrator
          text: In the morning, he found the cock dead. He refused every offer but one of the finest sheep.
        - id: ch02-b05
          speaker: ananzi
          text: Nothing else will do. You must give me one of your best sheep for my cock.
        - id: ch02-b06
          speaker: narrator
          text: The household gave him the sheep, and he went on his way.
    - id: ch03
      title: The Sheep and the Heifer
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: He walked until nightfall and reached a village. He was given lodging, but when the villagers tried to put his sheep with theirs, he stopped them.
        - id: ch03-b02
          speaker: ananzi
          text: No. This sheep must sleep with the cattle.
        - id: ch03-b03
          speaker: narrator
          text: They did as he said. In the middle of the night, Ananzi got up and killed the sheep. Then he went back to bed.
        - id: ch03-b04
          speaker: narrator
          text: The next morning, he found the sheep dead and demanded the village's best young cow.
        - id: ch03-b05
          speaker: ananzi
          text: You must give me your best heifer for this sheep. If you refuse, I will tell the King. He will come here and make war on you.
        - id: ch03-b06
          speaker: narrator
          text: Glad to be rid of him, the villagers handed over the heifer.
    - id: ch04
      title: The Funeral
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: Ananzi led the heifer away. Toward evening, he met a funeral procession.
        - id: ch04-b02
          speaker: ananzi
          text: Whose funeral is this?
        - id: ch04-b03
          speaker: funeral_man
          text: She was my sister.
        - id: ch04-b04
          speaker: narrator
          text: Ananzi asked for the dead woman. The men refused, but he kept begging and offered them the heifer.
        - id: ch04-b05
          speaker: ananzi
          text: Please let me take her. I will give you this heifer for her.
        - id: ch04-b06
          speaker: funeral_man
          text: Very well. We will accept the heifer.
        - id: ch04-b07
          speaker: narrator
          text: Ananzi carried the body away. After dark, he reached a large town and begged at a house for shelter.
        - id: ch04-b08
          speaker: ananzi
          text: My sister is so tired that I have had to carry her. We would be grateful if you let us rest here tonight.
        - id: ch04-b09
          speaker: town_host
          text: You may both stay here for the night.
        - id: ch04-b10
          speaker: narrator
          text: Once they were inside, Ananzi made another request.
        - id: ch04-b11
          speaker: ananzi
          text: Please let us sit in the dark. My sister cannot bear the light.
        - id: ch04-b12
          speaker: narrator
          text: They were left alone in a dark room. Ananzi sat on a bench by the table, with the woman beside him and his arm holding her upright.
        - id: ch04-b13
          speaker: narrator
          text: When two plates of supper arrived, Ananzi put one before his sister and placed her hand in it. Then he ate from both plates.
    - id: ch05
      title: The Twelve Strong Men
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: At bedtime, Ananzi asked to put his sister in a room where twelve strong men slept.
        - id: ch05-b02
          speaker: ananzi
          text: My sister sometimes has fits. If one comes on tonight, those twelve men can hold her. Then she will not wake everyone else in the house.
        - id: ch05-b03
          speaker: narrator
          text: The household agreed. Ananzi carried the woman into the room in his arms.
        - id: ch05-b04
          speaker: ananzi
          text: She is so tired that she has fallen asleep. Please do not disturb her.
        - id: ch05-b05
          speaker: narrator
          text: He laid her on a bed and slept in the next room. At midnight, a horrible smell woke the men. They called out and tried to wake the woman. One struck her, then another, until all twelve had hit her. Ananzi heard the noise but took no notice.
        - id: ch05-b06
          speakers: [man_1, man_2, man_3]
          ensemble: chorus
          text: Wake up! Wake up!
        - id: ch05-b07
          speaker: narrator
          text: In the morning, Ananzi found his sister dead. He declared that the men had killed her and demanded all twelve.
        - id: ch05-b08
          speaker: ananzi
          text: You have killed my sister. I must have the twelve men in payment for her.
        - id: ch05-b09
          speaker: narrator
          text: The townspeople refused, not believing all twelve had killed her. Then the men confessed.
        - id: ch05-b10
          speakers: [man_1, man_2, man_3]
          ensemble: chorus
          text: Each one of us gave her a blow.
        - id: ch05-b11
          speaker: narrator
          text: Ananzi accepted nothing less than all twelve. He took them to the King and handed them over.
