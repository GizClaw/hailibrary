  chapters:
    - id: ch01
      title: The Belt at the Crossroads
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Once there was an old beggar-woman who went out begging with her little son. When her bag was full, they started home across the hills. Partway up, they found a small blue belt lying where two paths crossed. The lad asked if he might pick it up.
        - id: ch01-b02
          speaker: mother
          text: No. There may be witchcraft in it.
        - id: ch01-b03
          speaker: narrator
          text: She threatened him until he followed her. A little farther on, the lad said he needed to step off the road for a moment, so his mother sat on a tree stump to wait. Once the woods hid him from her, he raced back to the crossroads. He took the belt and tied it around his waist. At once, he felt strong enough to lift the whole hill.
        - id: ch01-b04
          speaker: narrator
          text: He was gone a long time, and his mother was furious when he returned.
        - id: ch01-b05
          speaker: mother
          text: You waste as much time as you please! Night is coming, and you know we must cross the hill before dark.
          emotion: angry
        - id: ch01-b06
          speaker: narrator
          text: They tramped on until they were halfway across. Then the old woman grew tired and stopped beneath a bush.
        - id: ch01-b07
          speaker: lad
          text: Dear Mother, while you rest, may I climb that high crag and look for signs of people nearby?
        - id: ch01-b08
          speaker: narrator
          text: She let him go. From the top, he saw a light shining in the north, and he hurried down to tell her.
        - id: ch01-b09
          speaker: lad
          text: We should keep going, Mother. There must be a house nearby. I can see a bright light just north of us.
        - id: ch01-b10
          speaker: narrator
          text: She shouldered her bag, and they set off. Soon a steep spur of the hill rose straight across their path.
        - id: ch01-b11
          speaker: mother
          text: I knew it! We cannot go another step. What a fine place this will be to sleep!
        - id: ch01-b12
          speaker: narrator
          text: The lad tucked the bag under one arm and his mother under the other. Then he ran straight up the crag with both of them.
        - id: ch01-b13
          speaker: lad
          text: Now can you see it? We are close to a house. Look at that bright light!
        - id: ch01-b14
          speaker: narrator
          text: His mother said no Christian folk lived in that forest. She knew every part of it, near and far. They would not find a living soul until they crossed the ridge and went down the other side. The light, she said, must belong to Trolls. Still, they went on. Before long, a great house stood before them, painted red from end to end.
        - id: ch01-b15
          speaker: mother
          text: What good does that do us? We cannot go inside. Trolls live here.
          emotion: fearful
        - id: ch01-b16
          speaker: lad
          text: Don't talk that way. We have to go in. Where lights are burning, there must be people.
        - id: ch01-b17
          speaker: narrator
          text: The lad opened the door, and his mother followed. At the sight of a huge man sitting on a bench, a man at least twenty feet tall, she fainted.
        - id: ch01-b18
          speaker: lad
          text: Good evening, Grandfather!
        - id: ch01-b19
          speaker: troll
          text: I have sat here for three hundred years, and no one has ever called me Grandfather before.
        - id: ch01-b20
          speaker: narrator
          text: The lad sat beside him and chatted as if they had known each other for years.
        - id: ch01-b21
          speaker: troll
          text: What has happened to your mother? I think she fainted. You had better see to her.
        - id: ch01-b22
          speaker: narrator
          text: The lad caught hold of his mother and dragged her along the hall floor. That woke her. She kicked, scratched, and flung herself about before settling on a pile of firewood in the corner. She was so frightened that she hardly dared look at either of them.
        - id: ch01-b23
          speaker: narrator
          text: After a while, the lad asked if they might stay for the night.
        - id: ch01-b24
          speaker: troll
          text: Yes, certainly.
        - id: ch01-b25
          speaker: narrator
          text: They talked again until the lad grew hungry and asked whether their host could give them food as well as a bed.
        - id: ch01-b26
          speaker: troll
          text: Of course. We can find something for you to eat.
        - id: ch01-b27
          speaker: narrator
          text: The huge man rose and threw six loads of dry pine onto the fire. The old woman grew more terrified than ever.
        - id: ch01-b28
          speaker: mother
          text: Oh, now he means to roast us alive!
          emotion: fearful
        - id: ch01-b29
          speaker: narrator
          text: When the wood had burned to glowing coals, the man strode out.
        - id: ch01-b30
          speaker: mother
          text: Heaven help us! How can you be so bold? Don't you see that we have fallen among Trolls?
          emotion: fearful
        - id: ch01-b31
          speaker: lad
          text: Nonsense. Even if they are Trolls, that need not hurt us.
        - id: ch01-b32
          speaker: narrator
          text: Soon the man returned, carrying the largest, fattest ox the lad had ever seen. He struck it once with his fist just beneath the ear, and the ox dropped dead on the floor. Then he gathered all four legs into his hands and lifted the whole animal onto the glowing coals. He rolled it this way and that until it was brown all over the outside.
        - id: ch01-b33
          speaker: narrator
          text: From a cupboard, he fetched a great silver dish. It was so wide that when he laid the ox upon it, not one piece hung over the edge. He put the dish on the table, went down to the cellar, and returned with a cask of wine. He knocked out the top and set the cask beside the ox. Last of all came two knives, each one six feet long. Only then did he tell his guests to sit down and eat.
        - id: ch01-b34
          speaker: narrator
          text: The lad sat down first, with his mother creeping after him. She whimpered and wondered how she could ever manage such a knife. Her son seized one without hesitation. He carved slices from the ox's thigh and laid them before her. When they had eaten enough, he took the cask in both hands and lowered it to the floor. Even there, the rim stood too high for his mother. He lifted her up and held her while she drank. For his own turn, he scrambled onto the cask and hung headfirst over the rim, like a cat, until he had drunk his fill.
        - id: ch01-b35
          speaker: narrator
          text: When he had quenched his thirst, he put the cask back on the table. He thanked their host for the meal and made his frightened mother thank him too. Then the lad returned to the bench and began chatting again.
        - id: ch01-b36
          speaker: troll
          text: Well, I had better get a little supper myself.
        - id: ch01-b37
          speaker: narrator
          text: The Troll ate the whole ox, horns, hoofs, and all. He drained every drop from the cask and sat down again.
        - id: ch01-b38
          speaker: troll
          text: I am not sure what to do about beds. I have only one bed and a cradle. You could sleep in the cradle, and your mother could take the bed.
        - id: ch01-b39
          speaker: lad
          text: Thank you. That will suit us very well.
        - id: ch01-b40
          speaker: narrator
          text: He undressed and lay in the cradle, though it was as large as a four-poster bed. The old woman had to follow the Troll to the other bed, nearly senseless with fear. The lad decided not to sleep. He would lie still and listen through the night.
    - id: ch02
      title: Three Plans Against the Lad
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: Before long, the Troll began talking to the old woman.
        - id: ch02-b02
          speaker: troll
          text: You and I could live very happily here if we could only get rid of your son.
        - id: ch02-b03
          speaker: mother
          text: Do you know how to deal with him? Is that what you have in mind?
        - id: ch02-b04
          speaker: troll
          text: That will be easy enough, or at least I can try. Stay here and keep house for me for a few days. I will take the boy up the hill to quarry cornerstones, and then I will roll a great rock down on him.
        - id: ch02-b05
          speaker: narrator
          text: The lad heard every word. Next day the Troll asked the old woman to keep house for him. Later, he took a great iron crowbar and invited the lad up the hill to quarry stone. The lad gladly went.
        - id: ch02-b06
          speaker: narrator
          text: After they split several stones, the Troll told the lad to climb down below and inspect the rock for cracks. While the boy stood beneath him, the Troll heaved and pried with his crowbar until he was exhausted. At last, he tore an entire crag from its bed. It thundered straight toward the place where the lad was standing. But the lad raised his hands and held the crag above him long enough to step aside. Then he let it roll harmlessly past.
        - id: ch02-b07
          speaker: lad
          text: Ah, now I understand. You meant to crush me to death. This time you go below and look for cracks. I will stand above.
        - id: ch02-b08
          speaker: narrator
          text: The Troll did not dare refuse. The lad rolled down a great rock, and it fell on the Troll and broke one of his thighs.
        - id: ch02-b09
          speaker: lad
          text: Well, you are in a sorry state now.
        - id: ch02-b10
          speaker: narrator
          text: He strode down the hillside, lifted the rock, and set the Troll free. Since the Troll could not walk, the lad hoisted him onto his back and carried him home. He ran as fast as a horse, and the rough ride shook the broken thigh at every step. The Troll screamed and shrieked as though a knife were cutting into him. When they reached the house, the Troll had to be put straight to bed, where he lay in misery.
        - id: ch02-b11
          speaker: narrator
          text: That night the Troll again asked the old woman how they could get rid of the lad.
        - id: ch02-b12
          speaker: mother
          text: If you cannot think of a way, neither can I.
        - id: ch02-b13
          speaker: troll
          text: Wait. I keep twelve lions in a garden. If they caught the boy, they would soon tear him apart.
        - id: ch02-b14
          speaker: narrator
          text: The old woman offered to pretend she was ill and say that only lion's milk could cure her. The lad lay awake and heard it all. In the morning, his mother claimed she would never recover without that milk.
        - id: ch02-b15
          speaker: lad
          text: Then I fear you will be ill for a long while, Mother. I have no idea where to find lion's milk.
        - id: ch02-b16
          speaker: troll
          text: Lion's milk is easy to find if we can find a man brave enough to fetch it. My brother has twelve lions in a garden. Take the key and milk them if you dare.
        - id: ch02-b17
          speaker: narrator
          text: The lad took the key and a milking pail and set out. As soon as he unlocked the garden gate and stepped inside, all twelve lions rose on their hind legs. They stood there roaring at him, ready to spring. The lad chose the biggest one. He caught it by both front paws, swung it around, and dashed it against tree stumps and stones. He kept on until there was nothing left of that lion but the two paws in his hands.
        - id: ch02-b18
          speaker: narrator
          text: The other eleven lions were so frightened that they crept to his feet like dogs. They followed him everywhere. When he returned to the house, they lay outside with their forepaws across the sill.
        - id: ch02-b19
          speaker: lad
          text: You will soon be well, Mother. I brought you the lion's milk.
        - id: ch02-b20
          speaker: narrator
          text: The lad had milked only a single drop into the pail. From his bed, the Troll swore the whole tale was a lie. The boy was not the sort of man who could ever milk lions, he said. When the lad heard that, he dragged the Troll out of bed and threw open the door. All eleven lions rose at once and fastened onto the Troll. They would not release him until the lad ordered them to let go.
        - id: ch02-b21
          speaker: narrator
          text: That night the Troll tried once more.
        - id: ch02-b22
          speaker: troll
          text: I cannot see how to get rid of this boy. He is terribly strong. Can you think of anything?
        - id: ch02-b23
          speaker: mother
          text: No. If you have no answer, I certainly have none.
        - id: ch02-b24
          speaker: troll
          text: I have two brothers in a castle, and each is twelve times stronger than I am. That is why they drove me out to this farm. Around their castle is an orchard. Anyone who eats its apples sleeps for three days and three nights. If the boy goes for that fruit, he will surely taste it. Once he falls asleep, my brothers will tear him apart.
        - id: ch02-b25
          speaker: narrator
          text: The old woman said she would pretend to be sick again and claim that only those apples could make her well. The lad heard this plan too.
        - id: ch02-b26
          speaker: narrator
          text: In the morning, his mother did nothing but groan and sigh. She said she could never recover without an apple from the orchard beside the brothers' castle, but there was no one she could send.
        - id: ch02-b27
          speaker: narrator
          text: The lad offered to leave that very moment. All eleven lions went with him. When he reached the orchard, he climbed into an apple tree and ate as much fruit as he could hold. The moment his feet touched the ground again, the enchanted sleep overcame him. He lay there without stirring, while the lions gathered into a tight ring around him and kept watch.
        - id: ch02-b28
          speaker: narrator
          text: On the third day, the Troll's two brothers came to the orchard. They did not wear the shape of men. They charged in snorting like horses that ate human flesh. When they saw the sleeping lad, they roared out a challenge. Who had dared come there? They would tear the intruder so small that no scrap of him would remain.
        - id: ch02-b29
          speaker: narrator
          text: The lions sprang up and tore the Trolls to bits. The ground looked like a scattered dung heap. Then the lions lay down around the lad once more.
    - id: ch03
      title: The Castle and the Princess
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: The lad slept through the fight and did not wake until late that afternoon. He pushed himself onto his knees and rubbed the last of the enchanted sleep from his eyes. Hoofprints covered the ground around him, and the orchard bore the marks of a terrible struggle. He could not imagine what had taken place while he slept.
        - id: ch03-b02
          speaker: narrator
          text: As he approached the castle, a maiden who had watched everything leaned from a window.
        - id: ch03-b03
          speaker: princess
          text: You should be thankful you missed that fight. If you had been awake, you would have lost your life.
        - id: ch03-b04
          speaker: lad
          text: Me, lose my life? I don't think so.
        - id: ch03-b05
          speaker: narrator
          text: She begged him to come inside and speak with her, for she had not seen another Christian since she was brought to that place. But when she opened the castle door, the eleven lions pressed forward behind him. The sight of them frightened her so badly that she screamed. The lad stopped the lions and made them lie outside while he entered alone.
        - id: ch03-b06
          speaker: narrator
          text: The two talked for a long while. The lad asked why someone so lovely lived with such ugly Trolls.
        - id: ch03-b07
          speaker: princess
          text: I never chose to live with them. They took me by force. I am the daughter of the King of Arabia.
        - id: ch03-b08
          speaker: narrator
          text: They talked on and on. At last, she asked the lad to decide what would become of her. Should she return to her own country, or would he take her as his wife? He answered that of course he would marry her. She would not need to go home.
        - id: ch03-b09
          speaker: narrator
          text: As they explored the castle, they entered a great hall. Two enormous swords belonging to the Trolls hung high on the wall.
        - id: ch03-b10
          speaker: princess
          text: I wonder whether you are strong enough to use one of those swords.
        - id: ch03-b11
          speaker: lad
          text: Me? It would be a poor thing if I could not handle one of them.
        - id: ch03-b12
          speaker: narrator
          text: He stacked two or three chairs, one on top of another, and jumped onto them. Even then, he could reach the larger sword only with his fingertips. He flicked it upward, sent it spinning into the air, and caught it neatly by the hilt. As he leaped down, he struck the floor with such force that the entire hall shook. After that, he tucked the enormous sword under his arm and carried it wherever he went.
        - id: ch03-b13
          speaker: narrator
          text: They lived at the castle for a while. Then the Princess decided she must go home and tell her parents what had happened to her. They loaded a ship, and she sailed away.
        - id: ch03-b14
          speaker: narrator
          text: After she sailed, the lad wandered through the castle for a while. Then he suddenly remembered that he had not come there seeking a bride or a sword. He had been sent to fetch apples for his mother's health. He told himself that the old woman could not have been very ill and must surely be well by now. Even so, he thought he ought to go back and see. When he reached the red house, both his mother and the Troll looked fresh and hearty.
        - id: ch03-b15
          speaker: lad
          text: What miserable creatures you are, living in this wretched hut! Come to my castle, and you will see what a grand fellow I have become.
        - id: ch03-b16
          speaker: narrator
          text: They readily agreed. On the way, his mother asked how he had become so strong.
        - id: ch03-b17
          speaker: lad
          text: If you must know, my strength comes from the blue belt we found on the hillside when we were begging.
        - id: ch03-b18
          speaker: mother
          text: Do you still have it?
        - id: ch03-b19
          speaker: lad
          text: Yes. It is tied around my waist.
        - id: ch03-b20
          speaker: mother
          text: May I see it?
        - id: ch03-b21
          speaker: lad
          text: Yes, you may.
        - id: ch03-b22
          speaker: narrator
          text: He opened his waistcoat and shirt to show her. She seized the belt with both hands, tore it away, and wrapped it around her fist.
        - id: ch03-b23
          speaker: mother
          text: Now what should I do with a wretch like you? One blow would dash out your brains!
          emotion: angry
        - id: ch03-b24
          speaker: troll
          text: That death is far too good for him. First burn out his eyes, and then set him adrift in a little boat.
        - id: ch03-b25
          speaker: narrator
          text: The lad begged them to spare him, and his tears ran freely, but neither one listened. They burned out his eyes, placed him in a little boat, and sent him drifting out to sea. The eleven lions plunged into the water and swam behind him. At last, they caught the boat and pulled it ashore on an island. There they lifted the blind lad out and laid him beneath a fir tree.
        - id: ch03-b26
          speaker: narrator
          text: The lions hunted game for him. They plucked birds and made him a bed of down. But he remained blind and had to eat the meat raw.
        - id: ch03-b27
          speaker: narrator
          text: One day, the largest lion began chasing a hare that was blind. The hare could not choose its path. It ran straight over roots and stones until it struck a fir stump headfirst. The blow sent it tumbling across the field and into a spring. When the hare climbed out of the water, its eyes were clear. It saw the lion and escaped with its life.
        - id: ch03-b28
          speaker: narrator
          text: The lion understood. It dragged the lad to the spring and dipped him completely beneath the water. His sight returned.
        - id: ch03-b29
          speaker: narrator
          text: At the shore, the lad signaled for the lions to lie close together like a raft. He stood on their backs while they swam him to the mainland. Once ashore, he hid them quietly in a birch grove.
        - id: ch03-b30
          speaker: narrator
          text: Then he crept toward the castle like a thief, hoping to lay hands on his belt. At the outer door, he bent and looked through the keyhole. There it was, hanging over a door inside the kitchen. The room stood empty. He eased the door open, slipped softly across the floor, and reached up for the belt. The moment it was fastened around him again, he stopped hiding. He kicked and stamped as wildly as a madman, and the noise brought his mother rushing into the room.
        - id: ch03-b31
          speaker: mother
          text: My dear, my own darling boy! Please give the belt back to me.
        - id: ch03-b32
          speaker: lad
          text: No, thank you. Now you will receive the very sentence you gave me.
        - id: ch03-b33
          speaker: narrator
          text: He carried out that sentence at once. When the old Troll heard, he hurried in and begged sweetly not to be killed.
        - id: ch03-b34
          speaker: lad
          text: You may live, but you will suffer the same punishment you gave me.
        - id: ch03-b35
          speaker: narrator
          text: He burned out the Troll's eyes and set him adrift at sea in a little boat. No lions followed the Troll.
    - id: ch04
      title: The Voyage to Arabia
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: Now the lad was alone. He longed for the Princess until he could bear it no longer, and his whole heart was set on finding her. He loaded four ships and sailed for Arabia.
        - id: ch04-b02
          speaker: narrator
          text: At first they had fair winds and fine weather. After some time, the wind died beneath a rocky island, and all four ships had to wait. The sailors went ashore and wandered about to pass the time. There they found an enormous egg, nearly as big as a small house. They gathered heavy stones and knocked the egg about from every side. No matter how hard they struck, they could not make the smallest crack in its shell.
        - id: ch04-b03
          speaker: narrator
          text: Hearing the noise, the lad came with his sword. The egg looked easy enough to break. One stroke split it open, and out stepped a chick as large as an elephant.
        - id: ch04-b04
          speaker: lad
          text: We have done a terrible thing. This may cost every one of us our lives. If a strong wind comes, can you reach Arabia within twenty-four hours?
        - id: ch04-b05
          speakers: [sailor_1, sailor_2, sailor_3]
          ensemble: chorus
          text: Yes, we can do it.
        - id: ch04-b06
          speaker: narrator
          text: A fine wind rose, and the crews put every sail to work. They reached Arabia in twenty-three hours, one hour sooner than the lad had demanded. The moment they landed, he sent all the sailors into a sandhill. They dug themselves in up to their eyes, leaving only enough of their faces uncovered to watch the ships. The lad and his captains chose a different hiding place. They climbed a high crag and crouched beneath a fir tree.
        - id: ch04-b07
          speaker: narrator
          text: Before long, a gigantic bird darkened the sky. In its claws, it carried an entire island. The bird flew over the anchored fleet and released its burden. The island crashed onto the four ships and drove every one beneath the sea. Then the bird wheeled toward the sandhill. It hovered over the buried sailors and beat its wings so fiercely that the blast nearly swept their heads from their shoulders.
        - id: ch04-b08
          speaker: narrator
          text: When the bird swept past the fir, the force spun the lad around. He was ready with his sword. One stroke brought the bird down dead.
        - id: ch04-b09
          speaker: narrator
          text: The lad went into the city. Everyone there rejoiced because the king's daughter had returned. Yet the king had hidden her himself and promised her hand to whoever could find her, even though she was already betrothed.
        - id: ch04-b10
          speaker: narrator
          text: In the street, the lad met a man selling white bearskins. He bought one and wrapped himself inside it until he looked like a great white bear. One of his captains fastened an iron chain to the disguise and led him through the city. Whenever the captain gave a command, the bear danced, leaped, and played some new trick. Crowds followed them, for no one had ever seen such a performance.
        - id: ch04-b11
          speaker: narrator
          text: Word reached the king that the city had never seen such fun. This white bear danced and capered at every command. A messenger ordered the captain to bring it straight to the castle.
        - id: ch04-b12
          speaker: narrator
          text: At court, everyone shrank back. They had never seen a beast like this one, and no one wanted it near. The captain assured them there was only one danger. The bear was gentle unless someone laughed at it. If anyone mocked it, the animal would tear that person to pieces. When the king heard the warning, he turned to the whole court and ordered every person there to keep a solemn face.
        - id: ch04-b13
          speaker: narrator
          text: While the bear performed, a maid entered and began laughing and mocking it. The bear sprang at her and tore her until hardly a scrap of her remained. The court wailed, and the captain wailed louder than anyone.
        - id: ch04-b14
          speaker: king
          text: Nonsense. She was only a maid, and this is more my concern than yours.
        - id: ch04-b15
          speaker: narrator
          text: By the time the show ended, night had fallen.
        - id: ch04-b16
          speaker: king
          text: It is too late for you to leave now. The bear had better sleep here.
        - id: ch04-b17
          speaker: captain
          text: Perhaps it could sleep by the kitchen fire.
        - id: ch04-b18
          speaker: king
          text: No. It shall sleep up here on pillows and cushions.
        - id: ch04-b19
          speaker: narrator
          text: Servants brought a great heap of pillows and cushions for the bear. The captain received a bed in a side room.
    - id: ch05
      title: The White Bear at Midnight
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: At midnight, the king returned in secret. He carried a lamp in one hand and a great bunch of keys in the other. Taking the white bear's chain, he led it out of the sleeping castle. They passed along gallery after gallery. The king unlocked doors, crossed room after room, climbed one staircase and descended the next. At last, the twisting way brought them to a pier that stretched far out into the sea.
        - id: ch05-b02
          speaker: narrator
          text: Along the pier stood a strange arrangement of posts and pins. The king hauled at one post, lifted another, and pushed different pins into place. At last, the dark water stirred. A little house rose from beneath the sea and floated to the edge of the pier. That was where the king had hidden his daughter. She was so precious to him that he meant to keep her where no seeker could ever discover her.
        - id: ch05-b03
          speaker: narrator
          text: Leaving the bear outside, the king went in and told the Princess about its dancing and tricks.
        - id: ch05-b04
          speaker: princess
          text: I am afraid of it. I dare not even look at that bear.
          emotion: fearful
        - id: ch05-b05
          speaker: king
          text: There is no danger as long as you do not laugh.
        - id: ch05-b06
          speaker: narrator
          text: The king kept reassuring her until she agreed to look. They brought the bear inside and locked the door behind it. Once again, the disguised lad danced and played every trick the captain had taught the court to expect. Just when the performance was at its height, the Princess's maid forgot the warning and burst out laughing. The bear flew at her and tore her to pieces. At that sight, the Princess began to cry and sob.
        - id: ch05-b07
          speaker: king
          text: What nonsense, making such a fuss over a maid! I will find you another one just as good. The bear should stay until morning. I will not lead it through all those galleries and stairways again tonight.
        - id: ch05-b08
          speaker: princess
          text: If the bear sleeps here, I certainly will not.
        - id: ch05-b09
          speaker: narrator
          text: Just then, the bear curled beside the stove and lay still. At last, they decided the Princess would stay too, with a lamp burning.
        - id: ch05-b10
          speaker: narrator
          text: As soon as the king was safely gone, the white bear lifted its head and spoke. It begged the Princess to undo the collar around its neck. Terror swept over her, and she nearly fainted where she stood. But she reached toward the bear, felt through the thick white hide, and found the fastening. The instant the collar came loose, the bear seized its own head and pulled it off.
        - id: ch05-b11
          speaker: narrator
          text: The Princess recognized the lad, and her joy had no end. She wanted to tell her father that her rescuer had returned.
        - id: ch05-b12
          speaker: lad
          text: No. I will win you once again.
        - id: ch05-b13
          speaker: narrator
          text: In the morning, they heard the king rattling the posts outside. The lad put the hide back on and lay beside the stove.
        - id: ch05-b14
          speaker: king
          text: Did the bear lie quietly through the night?
        - id: ch05-b15
          speaker: princess
          text: Indeed it did. It never once turned over or even stretched.
        - id: ch05-b16
          speaker: narrator
          text: The king raised the house again and led the bear back through every stairway, room, and gallery. At the castle, the captain took charge of the chain and led the animal away. Once they were out of sight, the lad threw off the white hide. He went straight to a tailor and ordered a complete suit of clothes worthy of a prince. When every piece had been fitted, he dressed himself, returned to the palace, and told the king that he wished to search for the Princess.
    - id: ch06
      title: The Last Hour
      blocks:
        - id: ch06-b01
          speaker: king
          text: Many men have wanted the same thing. Every one of them lost his life. If you fail to find her within twenty-four hours, you must forfeit yours too.
        - id: ch06-b02
          speaker: narrator
          text: The lad knew the terms and accepted them. If he failed, that was his own affair. A band played sweet music in the castle, and lovely maidens were ready to dance. So the lad joined them and danced as though the twenty-four hours did not trouble him at all.
        - id: ch06-b03
          speaker: narrator
          text: After twelve hours had passed, the king spoke to him.
        - id: ch06-b04
          speaker: king
          text: I truly pity you. You are making no effort to search, and you will surely lose your life.
        - id: ch06-b05
          speaker: lad
          text: Nonsense. While I am alive, I still have hope. There is plenty of time.
        - id: ch06-b06
          speaker: narrator
          text: He kept dancing until only one hour remained. Then he said he was ready to begin looking.
        - id: ch06-b07
          speaker: king
          text: There is no use starting now. Your time is gone.
        - id: ch06-b08
          speaker: lad
          text: Light your lamp and bring out that large bunch of keys. Follow wherever I lead. I still have a full hour.
        - id: ch06-b09
          speaker: narrator
          text: The lad followed the same path the king had taken during the night. He made the king unlock door after door until they reached the pier that ran into the sea.
        - id: ch06-b10
          speaker: king
          text: I tell you, this is useless. Your time is over, and this pier leads nowhere but the sea.
        - id: ch06-b11
          speaker: lad
          text: I still have five minutes.
        - id: ch06-b12
          speaker: narrator
          text: He pulled the posts and pushed the pins until the little house rose to the surface.
        - id: ch06-b13
          speaker: king
          text: Now your time is over! Headsman, come and cut off his head!
          emotion: angry
        - id: ch06-b14
          speaker: lad
          text: Not yet. Stop! Three minutes remain. Bring the key and let me into this house.
        - id: ch06-b15
          speaker: narrator
          text: The king fumbled among his keys to waste the final moments. At last, he claimed he had no key.
        - id: ch06-b16
          speaker: lad
          text: If you have no key, I have one of my own.
        - id: ch06-b17
          speaker: narrator
          text: He kicked the door, and it flew inward in splinters. The Princess met him at the entrance and told her father that this was the man who had rescued her, and the man she loved.
        - id: ch06-b18
          speaker: narrator
          text: And so she married him. That is how a beggar boy came to wed the daughter of the King of Arabia.
