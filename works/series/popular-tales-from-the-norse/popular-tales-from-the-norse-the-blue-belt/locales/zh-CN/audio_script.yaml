audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 从容而清醒，带一点克制的诙谐
        timbre: 温厚清晰
        pace: 舒缓有致
        pitch: 中低
    boy:
      display_name: 男孩
      tts:
        delivery: 坦率勇敢，胸有成竹，说话干脆
        timbre: 清亮结实
        pace: 中等
        pitch: 中等偏高
    mother:
      display_name: 男孩的母亲
      tts:
        delivery: 世故尖刻，胆小时慌乱，算计时压低声音
        timbre: 干涩苍老
        pace: 中等偏快
        pitch: 中等偏高
    troll:
      display_name: 山怪
      tts:
        delivery: 粗鲁沉重，心怀恶意，受挫时气急败坏
        timbre: 低沉浑厚
        pace: 偏缓
        pitch: 低
    princess:
      display_name: 阿拉伯公主
      tts:
        delivery: 温柔端庄，受惊时急促，作出决定时坚定
        timbre: 明亮柔和
        pace: 中等
        pitch: 中等偏高
    sailor:
      display_name: 水手
      tts:
        delivery: 爽快直接，回答简短有力
        timbre: 粗犷清楚
        pace: 中等
        pitch: 中等
    captain:
      display_name: 船长
      tts:
        delivery: 沉着机敏，表演时一本正经
        timbre: 稳重清晰
        pace: 中等
        pitch: 中低
    king:
      display_name: 阿拉伯国王
      tts:
        delivery: 威严固执，催逼时急躁响亮
        timbre: 洪亮厚实
        pace: 中等
        pitch: 中低
  chapters:
    - id: ch01
      title: 山坡上的蓝腰带
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 从前，有个讨饭的老婆子带着小儿子出门乞讨。口袋装满以后，她便领着孩子翻山回家。母子俩走上山坡，在两条小路交会的地方看见一条小小的蓝腰带。男孩很想捡起来，便问母亲可不可以。
        - id: ch01-b02
          speaker: mother
          text: 不行。那东西说不定带着妖法。
          emotion: fearful
        - id: ch01-b03
          speaker: narrator
          text: 她连吓带骂，逼着儿子继续赶路。走了一段，男孩借口要离开小路一会儿。母亲坐在树墩上等，他却钻进她看不见的林子，转身跑回岔路口，捡起蓝腰带系在身上。就在那一刻，他觉得自己力大无穷，仿佛连整座山都举得起来。
        - id: ch01-b04
          speaker: narrator
          text: 男孩回去得太晚，母亲大发脾气，骂他只管耽误工夫，明知道天快黑了，他们还得赶在入夜前翻过山去。两人接着走。到了半山腰，老婆子已经累坏，只好在灌木下面歇脚。
        - id: ch01-b05
          speaker: boy
          text: 好妈妈，您先歇一歇。我能不能爬上那座高崖，看看附近有没有人家？
        - id: ch01-b06
          speaker: narrator
          text: 母亲答应了。男孩爬到崖顶，看见北边不远处亮着灯，马上跑下来报信。
        - id: ch01-b07
          speaker: boy
          text: 妈妈，咱们快走吧。北边有一盏明灯，离得很近，那里一定有房子。
        - id: ch01-b08
          speaker: narrator
          text: 老婆子扛起口袋，同他一起出发。没走多远，一道陡峭的山脊横在路上。
        - id: ch01-b09
          speaker: mother
          text: 我早就知道！这下再也走不动了。今晚咱们可有一张好床睡啦！
          emotion: angry
        - id: ch01-b10
          speaker: narrator
          text: 男孩一边胳膊夹起口袋，另一边胳膊夹起母亲，径直奔上陡崖。他指着前面的灯光，要母亲好好看看，他们已经离房子很近了。
        - id: ch01-b11
          speaker: narrator
          text: 可老婆子认定那里住的不是基督徒，而是山怪。附近的森林，无论远近她都熟悉得很。她说，只有彻底翻过山梁，再从另一边下去，才可能碰见活人。可母子俩还是迎着灯光向前。走了不多一会儿，一座大房子出现在眼前，从墙壁到门窗，全都漆成了红色。
        - id: ch01-b12
          speaker: mother
          text: 来了也没用。这里住的是山怪，咱们不敢进去。
          emotion: fearful
        - id: ch01-b13
          speaker: boy
          text: 别这么说。灯光这样亮，里面一定有人。咱们非进去不可。
        - id: ch01-b14
          speaker: narrator
          text: 男孩推门进去，母亲跟在身后。门才打开，她就昏倒了。长凳上坐着一个又高又壮的巨人，足有二十英尺高。
        - id: ch01-b15
          speaker: boy
          text: 晚上好，爷爷！
        - id: ch01-b16
          speaker: troll
          text: 我在这里坐了三百年，还从没有人进来叫过我爷爷。
        - id: ch01-b17
          speaker: narrator
          text: 男孩就在巨人身旁坐下，谈天说地，那副自在的样子，简直像两人已经做了多年的老朋友。聊了一阵，巨人问他母亲到底怎么了，看样子像是昏了过去，最好赶快照料一下。男孩走过去抓住老婆子，拖着她沿地板穿过大厅。这一拖把她弄醒了。她又踢又抓，浑身乱扭，最后一屁股坐到角落的一堆柴火上。她实在吓得厉害，几乎不敢抬头看任何人的脸。
    - id: ch02
      title: 山怪的晚餐
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 男孩问能不能借宿一夜，巨人一口答应。他们继续闲谈，男孩很快饿了，又问这里有没有吃的。
        - id: ch02-b02
          speaker: troll
          text: 当然有。吃的也能弄到。
        - id: ch02-b03
          speaker: narrator
          text: 巨人站起来，把六大车干燥的松脂木扔进火里。老婆子见火越烧越旺，更加害怕。
        - id: ch02-b04
          speaker: mother
          text: 完了，他要把咱们活活烤熟啦！
          emotion: fearful
        - id: ch02-b05
          speaker: narrator
          text: 木柴烧成红炭，巨人大步出门去了。老婆子求上天保佑，又埋怨儿子胆子太大，竟看不出他们已经落进山怪窝里。
        - id: ch02-b06
          speaker: boy
          text: 胡说八道。就算真进了山怪窝，也没什么要紧。
        - id: ch02-b07
          speaker: narrator
          text: 巨人很快牵回一头男孩从未见过的肥壮公牛。他只朝牛耳朵下面打了一拳，公牛便倒在地板上死了。他抓起牛的四条腿，把整头牛放到红炭上，翻来转去，一直烤到外皮焦黄。随后，他从橱柜里端出一个硕大的银盘，把牛盛在上面。那只盘子大得出奇，整头牛没有一处垂到盘沿外。巨人又下到地窖，搬来一大桶葡萄酒，敲掉桶盖，把酒桶和两把各有六英尺长的刀摆上桌，这才请母子俩坐下吃晚饭。
        - id: ch02-b08
          speaker: narrator
          text: 男孩先走到桌旁，老婆子战战兢兢地跟在后面。她望着两把巨刀，呜呜咽咽，只愁自己怎么使得动。男孩却抓起一把，从牛腿上切下一片片肉，放到母亲面前。两人吃过一些，他用双手捧起酒桶，把它搬到地板上。桶沿还是太高，母亲踮起脚也够不到，他便一把将她举起，托到桶边喝酒。轮到自己时，他爬上酒桶，像猫一样倒挂在里面，喝了个痛快。解渴以后，他又把酒桶举回桌上，谢过巨人的美餐，也叫母亲过来道谢。老婆子怕得要命，可又不敢不听，只好向主人谢了又谢。
        - id: ch02-b09
          speaker: troll
          text: 好啦，我也该吃一点晚饭了。
        - id: ch02-b10
          speaker: narrator
          text: 巨人走到桌边，把整头公牛连蹄子带犄角全吃了，又喝干一桶酒，才回长凳坐下。他说家里只有一张床和一只摇篮，男孩可以睡摇篮，母亲睡床。
        - id: ch02-b11
          speaker: boy
          text: 多谢您，这样再好不过。
        - id: ch02-b12
          speaker: narrator
          text: 那只摇篮其实有一张四柱大床那么大。男孩躺进去，却不肯睡。他要醒着听听深夜会发生什么。母亲则吓得魂不附体，只得跟巨人去了睡房。夜深以后，巨人压低声音，同老婆子商量起来。
        - id: ch02-b13
          speaker: troll
          text: 只要能摆脱你这个儿子，咱们俩住在这里，该过得多快活。
        - id: ch02-b14
          speaker: mother
          text: 你已经想到怎么收拾他了吗？
        - id: ch02-b15
          speaker: troll
          text: 再容易不过。我留你在这里照管几天家务，再带他上山开凿墙角石。等他到了下面，我就滚下一块巨石，把他砸死。
        - id: ch02-b16
          speaker: narrator
          text: 这些话，男孩全听见了。第二天，山怪果然请老婆子留下，又拿起大铁撬棍，邀男孩上山凿石头。男孩痛快地答应。两人劈开几块石头以后，山怪叫他到下面查看裂缝，自己在高处拼命撬动一整块山岩。巨石滚向男孩，他一把托住，等闪到旁边，才松手让它继续滚下去。
        - id: ch02-b17
          speaker: boy
          text: 原来你想把我压死。现在换你到下面看裂缝，我站在上面。
        - id: ch02-b18
          speaker: narrator
          text: 山怪不敢违抗。男孩从高处推下一块巨石，砸断了山怪的一条大腿。他走下去，说山怪的情形实在凄惨，又抬起石头把他救出来。随后，男孩把山怪背回家。他跑得像马一样快，颠得背上的山怪又喊又叫，仿佛有人拿刀捅他。回家以后，山怪只能躺在床上，狼狈极了。
    - id: ch03
      title: 狮奶和魔苹果
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 到了夜里，山怪和老婆子又商量怎样除掉男孩。
        - id: ch03-b02
          speaker: mother
          text: 你都想不出办法，我就更想不出了。
        - id: ch03-b03
          speaker: troll
          text: 我在一座园子里养了十二头狮子。只要把那小子骗进去，狮子转眼就能撕碎他。
        - id: ch03-b04
          speaker: narrator
          text: 老婆子说，她可以装病，声称只有狮奶才能治好自己。男孩躺在外面，又把计划听得一清二楚。第二天一早，母亲果然说自己病得比看上去还重，这辈子若喝不到狮奶，就再也好不了了。
        - id: ch03-b05
          speaker: boy
          text: 那您怕是要病很久了，妈妈。我实在不知道到哪里去找狮奶。
        - id: ch03-b06
          speaker: troll
          text: 狮奶倒多的是，只怕没人敢去取。我哥哥的园子里有十二头狮子。你若敢给它们挤奶，我就把钥匙给你。
        - id: ch03-b07
          speaker: narrator
          text: 男孩接过钥匙，提上挤奶桶，大步来到那座园子。他才打开门走进去，十二头狮子便全用后腿站起来，张牙舞爪，冲着他震天咆哮。男孩迎上去，一把抓住最大的那头，握着它的两只前爪四处拖动，把它一次又一次摔向树墩和石块，最后只剩下两只前爪。其余十一头狮子看到这一幕，吓得再也不敢吼叫。它们慢慢爬到男孩面前，像一群挨训的狗似的伏在他脚边。从那以后，无论男孩往哪里走，十一头狮子都紧紧跟着。回到家，它们整整齐齐卧在屋外，还把前爪搭在门槛上。
        - id: ch03-b08
          speaker: boy
          text: 妈妈，您很快就会好啦。狮奶已经取来了。
        - id: ch03-b09
          speaker: narrator
          text: 桶里其实只有一滴奶。躺在床上的山怪却一口咬定这是谎话，说男孩绝没有给狮子挤奶的本事。男孩硬把他赶下床，猛地拉开房门。十一头狮子扑住山怪，直到男孩喝令，它们才肯松口。
        - id: ch03-b10
          speaker: narrator
          text: 当晚，山怪和老婆子又一次密谋。
        - id: ch03-b11
          speaker: troll
          text: 这小子强得太可怕，我真不知道怎么除掉他。你也想不出办法吗？
        - id: ch03-b12
          speaker: mother
          text: 你都不知道怎么办，我怎么会知道？
        - id: ch03-b13
          speaker: troll
          text: 我有两个哥哥住在城堡里，力气是我的十二倍。就是因为他们，我才被赶到这座田庄。城堡外有一片苹果园，谁吃了那些苹果，谁就会睡上三天三夜。只要叫这小子去摘果子，他一定忍不住尝一个。等他睡着，我哥哥就会把他撕碎。
        - id: ch03-b14
          speaker: narrator
          text: 老婆子说，她会再装一次病，说自己一心想吃那些苹果，不吃就永远好不了。男孩还是听见了全部计划。第二天，母亲只会呻吟叹气，说除非尝到城堡旁果园里的苹果，否则必定病死，可又没人能替她去取。
        - id: ch03-b15
          speaker: narrator
          text: 男孩立刻出发，十一头狮子跟着他来到果园。他爬上苹果树，能吃多少就吃多少。刚落地，他便沉沉睡去，狮子围着他卧成一圈。第三天，山怪的两个哥哥来了。它们没有人形，倒像两匹吃人的骏马，喷着鼻息，要把闯入者撕得一块不剩。
        - id: ch03-b16
          speaker: narrator
          text: 狮子们猛扑上去，把两个山怪撕成了细碎的小块。地上一片狼藉，仿佛有人把一整堆粪撒得到处都是。它们消灭山怪以后，又回到男孩身旁卧下。男孩一直睡到第三天下午很晚才醒。他慢慢跪起身，揉去眼里的睡意，看到周围满是陌生的蹄印，不禁猜想，自己沉睡时这里到底出了什么事。他朝城堡走去，一个少女从窗口探出头来。刚才发生的一切，她全都看见了。
        - id: ch03-b17
          speaker: princess
          text: 你真该谢天谢地。幸好没有卷进方才那场恶斗，不然一定会送命。
        - id: ch03-b18
          speaker: boy
          text: 我会送命？我看没什么好怕的。
        - id: ch03-b19
          speaker: narrator
          text: 少女请男孩进来陪她说说话。自从被带到城堡，她再也没有见过一个基督徒。房门一开，十一头狮子也想跟着主人进去。少女吓得尖叫，男孩只好吩咐它们卧在屋外。两人坐下来，谈了很久很久。男孩问，这么美丽的姑娘，为什么甘愿和那些丑陋的山怪住在一起。少女说，她从来不曾愿意，这一切全都违背她的心意。山怪用强力把她掳来，而她原是阿拉伯国王的女儿。两人又谈了许久。最后，公主请男孩作出选择，是送她回到父母身边，还是把她娶来做妻子。
        - id: ch03-b20
          speaker: narrator
          text: 男孩当然愿意娶她，也不肯让她回去。两人走遍城堡，来到一座大厅，看见两个山怪的两柄巨剑高高挂在墙上。
        - id: ch03-b21
          speaker: princess
          text: 不知道你算不算男子汉，能不能挥动其中一柄剑。
        - id: ch03-b22
          speaker: boy
          text: 我吗？我要是连一柄也挥不动，那才是笑话。
        - id: ch03-b23
          speaker: narrator
          text: 男孩把两三把椅子摞起来，跳上去用指尖挑起最大的剑，再在半空握住剑柄。他落到地上，顺势一剑砍向地面，震得整座大厅摇晃。从此，那柄巨剑一直被他夹在胳膊下，走到哪里都带着。
    - id: ch04
      title: 背叛与复明
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 两人在城堡住了一阵。公主想回去见父母，也让他们知道自己的下落。于是他们装好一艘船，公主独自启程。她走后，男孩闲逛了一阵，才想起自己原是来给母亲取治病的东西。他知道那老婆子多半早已无病无痛，却还是决定回去看她。
        - id: ch04-b02
          speaker: narrator
          text: 回到田庄，山怪和母亲果然都精神十足。男孩笑他们住在破茅屋里实在可怜，请两人跟他去城堡，看看他如今有多了不起。他们马上答应。走在路上，母亲问儿子为什么会有这样大的力气。
        - id: ch04-b03
          speaker: boy
          text: 您非知道不可的话，我就告诉您。力量来自那条蓝腰带，就是咱们讨饭时在山坡上看见的那一条。
        - id: ch04-b04
          speaker: narrator
          text: 母亲问他腰带还在不在，又说想亲眼看看。男孩告诉她，腰带就在身上。他拉开背心和衬衣，把它露出来。老婆子猛地用两手抓住腰带，一把扯下，紧紧缠到自己拳头上。
        - id: ch04-b05
          speaker: mother
          text: 现在我该怎么处置你这个坏东西？我只要打上一拳，就能叫你脑浆迸裂！
          emotion: angry
        - id: ch04-b06
          speaker: troll
          text: 这么死太便宜这恶棍了。咱们先烧瞎他的眼睛，再把他放进小船，让他在海上漂流。
        - id: ch04-b07
          speaker: narrator
          text: 男孩苦苦哀求，眼泪直流，可母亲和山怪丝毫不肯心软。他们烧瞎了他的眼睛，把他放进一条小船，推到海上任它漂走。十一头狮子却没有抛下主人。它们一个接一个跳进海里，一直游在小船后面。最后，狮子们追上漂流的小船，牢牢咬住船沿，把它拖到一座岛上。它们把失明的男孩安置在一棵枞树下，每天捕来野兽给他吃，还拔下鸟儿柔软的羽毛，替他铺成一张厚厚的羽绒床。可男孩双眼看不见，也没有火，只能把狮子送来的兽肉生吃下去。
        - id: ch04-b08
          speaker: narrator
          text: 有一天，最大的狮子追赶一只瞎眼野兔。野兔看不见路，一头撞上枞树桩，翻着跟头滚过田野，落进一眼泉水。它从泉里爬出来时，两眼忽然看清了道路，就这样逃过一劫。狮子明白过来，立刻拖着男孩来到泉边，把他从头到脚浸进水里。男孩的眼睛也复明了。
        - id: ch04-b09
          speaker: narrator
          text: 眼睛复明以后，男孩走到海边，用手势叫十一头狮子一头挨着一头，紧紧靠在一起，排成一张活的木筏。他站上狮背，狮子们驮着他游过海水，一直游回大陆。男孩上岸走进一片白桦林，让狮子们安安静静地卧在那里等候。他独自摸到城堡，像个贼似的放轻脚步，想找机会夺回腰带。来到门外，他贴着钥匙孔朝厨房里看，果然发现蓝腰带挂在一道门的上方。屋里一个人也没有。他轻轻推门，蹑手蹑脚地穿过地板，一把抓住腰带，重新系好。神力回到身上的那一刻，他再也不用躲藏，立刻又踢又跺，弄出震天的动静。母亲听见声音，马上冲了出来。
        - id: ch04-b10
          speaker: mother
          text: 心肝呀，我的宝贝儿子！把腰带还给妈妈吧。
        - id: ch04-b11
          speaker: boy
          text: 真是多谢您的好意。现在轮到您受一遍判给我的刑罚了。
        - id: ch04-b12
          speaker: narrator
          text: 男孩当场照办。老山怪听见动静，跑进来甜言蜜语地苦苦求饶，只求男孩别打死自己。
        - id: ch04-b13
          speaker: boy
          text: 我饶你一命，不过，你得受一遍你叫我受的刑罚。
        - id: ch04-b14
          speaker: narrator
          text: 男孩烧瞎山怪的眼睛，又把他放进小船，任他漂向海上。可山怪身后没有一头狮子跟随。
    - id: ch05
      title: 巨鸟的复仇
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 男孩又成了孤零零的一个人。他走到哪里都在想念公主，越想越难忍，终于决定出海寻找她。他装好四艘船，朝阿拉伯驶去。起初海上风和日丽，后来船队被逆风困在一座岩石岛旁。水手们上岸消磨时间，发现一只几乎有小房子那么大的蛋。他们拿大石头轮番去砸，怎么也敲不破。
        - id: ch05-b02
          speaker: narrator
          text: 水手们砸蛋的声音传得很远。男孩听见喧闹，提着从城堡带来的巨剑走过来，想看看大家究竟在忙什么。见到那只大蛋，他觉得劈开蛋壳再容易不过。男孩举剑只砍了一下，巨蛋便从中间裂开，里面钻出一只大象般巨大的雏鸟。直到这时，他才意识到，那只蛋绝不是无主之物。
        - id: ch05-b03
          speaker: boy
          text: 咱们闯祸了。这件事可能会要了所有人的命。要是有顺风，你们能不能在二十四小时里赶到阿拉伯？
        - id: ch05-b04
          speaker: sailor
          text: 能。只要顺风，我们一定办得到。
        - id: ch05-b05
          speaker: narrator
          text: 船队乘风出发，二十三个小时就抵达阿拉伯。男孩让水手们钻进沙丘，把身体埋到眼睛，只露出双眼看着船只。他和船长们爬上高崖，躲在一棵枞树下面。
        - id: ch05-b06
          speaker: narrator
          text: 不久，天空中出现一只大得可怕的鸟，利爪下面竟抓着一整座岛。它飞到海湾上空，松开爪子，把岛重重砸向船队，四艘船眨眼间全沉进海底。毁掉船只以后，巨鸟又扑向藏人的沙丘，用力扇动双翼。卷起的狂风险些把水手们的脑袋从肩上刮走。接着，它从枞树旁呼啸而过，风力之猛，吹得男孩原地转了整整一个身。可男孩早已握着巨剑戒备。巨鸟刚靠近，他便挥出一剑，把它砍落下来，当场杀死。
    - id: ch06
      title: 白熊进宫
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: 男孩进了城。国王找回女儿，人人都很欢喜，可他又亲自把公主藏到了无人知晓的地方，还宣称无论谁能找到她，就把她嫁给那个人，根本不管公主早已同救命恩人订了婚。男孩走在街上，看见有人出售白熊皮，便买下一整张，严严实实披在身上。他请一个船长拿起铁链，装作牵熊人，自己则四肢着地跟着进城。到了热闹的街道，他扮成白熊耍起把戏，叫跳就跳，叫蹦就蹦，吩咐什么便做什么，把满城的人逗得前仰后合。
        - id: ch06-b02
          speaker: narrator
          text: 国王听说城里来了前所未见的白熊，马上派人把它召进王宫。宫里人见到猛兽，全都害怕。船长告诉他们，只要不嘲笑白熊，就没有危险。谁若发笑，白熊便会把谁撕碎。国王于是下令，所有人都不准笑。
        - id: ch06-b03
          speaker: narrator
          text: 白熊的表演越来越热闹。就在这时，国王的一个女仆走进来。她忘了禁令，对着白熊又笑又嘲弄。男孩立刻装作野兽发怒的模样，猛扑上去，把她撕得只剩几片破衣。满宫的人顿时乱了，人人都为女仆哀号，假装牵熊的船长更是哭得最响，仿佛他比谁都后悔带来这头猛兽。
        - id: ch06-b04
          speaker: king
          text: 胡说八道。她不过是个女仆。再说，这件事也该我比你更难过。
        - id: ch06-b05
          speaker: narrator
          text: 表演结束时，夜已经很深。国王说现在离开也没有用，白熊最好留在宫里过夜。
        - id: ch06-b06
          speaker: captain
          text: 可以让它睡在厨房炉火旁的壁炉里。
        - id: ch06-b07
          speaker: king
          text: 不行。它就睡在上面，还要给它枕头和靠垫。
        - id: ch06-b08
          speaker: narrator
          text: 众人搬来一大堆枕头靠垫，也在旁边的房间给船长铺了床。到了半夜，国王提着灯，拿着一大串钥匙，把白熊带走。他穿过一条条长廊、一扇扇门和一间间屋子，上楼又下楼，最后来到伸向海中的长堤。
        - id: ch06-b09
          speaker: narrator
          text: 国王走到长堤尽头，开始拨弄那些柱子和插销。他把这一根拔起，又把另一根按下，推推拉拉忙了好一阵，一座小屋才从海里浮到水边。原来公主就被藏在里面。国王实在太疼爱女儿，为了不让任何人找到她，才把她安置在这座秘密小屋。他让白熊等在门外，自己先进去，把白熊在王宫里如何跳舞、如何耍把戏，全都讲给公主听。公主害怕得连看也不敢看。国王再三劝说，只要她不发笑，那头熊绝不会伤害她。
        - id: ch06-b10
          speaker: narrator
          text: 白熊被带进小屋，房门随即从里面锁上。它按照国王的吩咐，又跳起舞，又耍起在王宫表演过的把戏。公主起初一直忍住不笑，可她身旁的女仆看到最热闹的地方，还是笑出了声。男孩立刻扑过去，把这个女仆也撕成碎片。公主眼看侍女死在面前，又惊又悲，忍不住哭泣抽噎起来。
        - id: ch06-b11
          speaker: king
          text: 不过死了个女仆，值得这样大惊小怪吗？我再给你找一个同样好的。白熊今晚留在这里吧，我可不想再领着它走过那些长廊和楼梯。
        - id: ch06-b12
          speaker: princess
          text: 要是它睡在这里，我绝不留下。
          emotion: fearful
        - id: ch06-b13
          speaker: narrator
          text: 白熊却蜷起身子，安静地卧在火炉旁。最后大家商定，公主也留在屋里，整夜点着一盏灯。国王刚走远，白熊便求公主解开它的颈圈。她吓得几乎昏倒，还是伸手摸到了颈圈。刚一解开，白熊便脱下熊头。公主认出男孩，欢喜得说不出话，马上想把父亲叫来。
        - id: ch06-b14
          speaker: boy
          text: 先别告诉他。我要再凭自己的本事赢得你一次。
        - id: ch06-b15
          speaker: narrator
          text: 第二天一早，他们听见国王在屋外拨弄柱子和插销。男孩马上披回熊皮，卧到火炉旁。
        - id: ch06-b16
          speaker: king
          text: 怎么样，它一直老实吗？
        - id: ch06-b17
          speaker: princess
          text: 老实极了。它整夜连身也没翻，腿也没伸一下。
        - id: ch06-b18
          speaker: narrator
          text: 回到王宫，船长牵走白熊。男孩脱掉熊皮，请裁缝做了一身王子才配穿的衣服。换好衣裳，他来到国王面前，说自己要寻找公主。
    - id: ch07
      title: 最后一个小时
      blocks:
        - id: ch07-b01
          speaker: king
          text: 想找她的人，你不是第一个。那些人全都送了命。谁要是不能在二十四小时内找到她，谁就得交出性命。
        - id: ch07-b02
          speaker: narrator
          text: 男孩回答，这些规矩自己全知道。他仍旧愿意试一试，若在限期内找不到公主，丢掉性命也是自己的事。国王答应以后，王宫里的乐队奏起悦耳的曲子，许多美丽的姑娘走来陪客人跳舞。男孩像是把寻找公主的事忘得一干二净，只顾跟着音乐尽情舞蹈。十二个小时过去了，他既没有询问线索，也没有离开舞厅一步。
        - id: ch07-b03
          speaker: king
          text: 我打心眼儿里可怜你。你根本不会找人，这回一定要送命了。
        - id: ch07-b04
          speaker: boy
          text: 胡说！只要人还活着，就还有希望。身上还有一口气，就没有什么可怕。时间多得很。
        - id: ch07-b05
          speaker: narrator
          text: 男孩仍旧不慌不忙地继续跳舞，直到只剩最后一个小时，才终于宣布要开始寻找公主。
        - id: ch07-b06
          speaker: king
          text: 现在才找也没用了。时间已经到了。
        - id: ch07-b07
          speaker: boy
          text: 点上您的灯，拿出那一大串钥匙。我要往哪里走，您就跟到哪里。咱们还剩整整一个小时。
        - id: ch07-b08
          speaker: narrator
          text: 男孩一刻也没有迟疑，循着头天夜里国王带白熊走过的道路向前。他穿过一条又一条长廊，走过一间又一间屋子，还记得哪里该上楼，哪里该下楼。每遇到一道锁住的门，他就叫跟在后面的国王拿钥匙打开。这样一路走下去，两人终于来到那道伸向海中的长堤。
        - id: ch07-b09
          speaker: king
          text: 我说过，这样找没有用。时间到了，这条路只会把你带进海里。
        - id: ch07-b10
          speaker: boy
          text: 还剩五分钟。
        - id: ch07-b11
          speaker: narrator
          text: 男孩一边说，一边推拉柱子和插销。藏着公主的小屋慢慢浮上水面。
        - id: ch07-b12
          speaker: king
          text: 时间到了！刽子手，过来砍掉他的脑袋！
          emotion: angry
        - id: ch07-b13
          speaker: boy
          text: 不，先等等！还有三分钟。拿出钥匙，让我进这间屋子。
        - id: ch07-b14
          speaker: narrator
          text: 国王站在那里，慢吞吞地翻找钥匙，故意拖延时间。最后，他说自己没有开门的钥匙。
        - id: ch07-b15
          speaker: boy
          text: 您没有，我有。
        - id: ch07-b16
          speaker: narrator
          text: 男孩抬脚猛踢，一脚把房门踹成碎片，木屑朝屋里散了一地。公主在门口迎住他，告诉父亲，这就是救她的人，也是她一心要嫁的人。于是公主终于嫁给男孩。那个讨饭的孩子，就这样娶到了阿拉伯国王的女儿。
