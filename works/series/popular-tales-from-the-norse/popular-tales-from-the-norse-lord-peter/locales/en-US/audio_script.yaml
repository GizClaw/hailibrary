  chapters:
    - id: ch01
      title: Peter's Inheritance
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Once upon a time, a poor couple had three sons and almost nothing else in the world. No one remembers the names of the two older boys, but the youngest was called Peter. When their father and mother died, the brothers had to divide what remained. All they found was a porridge pot, a griddle, and a cat.
        - id: ch01-b02
          speaker: narrator
          text: The eldest had first choice, and he took the pot.
        - id: ch01-b03
          speaker: eldest_brother
          text: Whenever I lend this pot to someone making porridge, they'll surely let me scrape out what's left.
        - id: ch01-b04
          speaker: narrator
          text: So the eldest brother reasoned. The second brother chose the griddle, thinking that anyone who borrowed it would give him a scrap of dough for a bannock. That left Peter no choice at all. If he wanted anything, it had to be the cat.
        - id: ch01-b05
          speaker: peter
          text: Lending out a cat won't earn me much. If she gets a drop of milk, she'll want every bit herself. Still, I'd better take her with me. I couldn't leave her here to wander about and starve.
        - id: ch01-b06
          speaker: narrator
          text: The three brothers went out to seek their fortunes, each taking a different road. Peter had not gone far when the Cat spoke to him.
        - id: ch01-b07
          speaker: cat
          text: You spared me from starving in that old cottage, so now I'll do you a good turn. I'm going into the woods to catch a fine, fat animal. Take it to the palace you can see over there and tell the King it's a small gift. When he asks who sent it, say, "Who else could it be but Lord Peter?"
    - id: ch02
      title: Gifts for the King
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: Peter did not wait long. The Cat came back from the woods riding on a reindeer's head, right between its horns.
        - id: ch02-b02
          speaker: cat
          text: Go straight to the King's palace, or I'll claw out your eyes.
        - id: ch02-b03
          speaker: narrator
          text: Whether the reindeer liked it or not, it had to obey. Peter led it into the palace kitchen.
        - id: ch02-b04
          speaker: peter
          text: I've brought the King a little present, if he won't think it beneath him.
        - id: ch02-b05
          speaker: narrator
          text: The King came into the kitchen. The moment he saw the fine, plump reindeer, he was delighted.
        - id: ch02-b06
          speaker: king
          text: My dear fellow, who in the world has sent me such a splendid gift?
        - id: ch02-b07
          speaker: peter
          text: Why, who else would send it but Lord Peter?
        - id: ch02-b08
          speaker: king
          text: Lord Peter? Lord Peter! Please tell me where he lives.
        - id: ch02-b09
          speaker: narrator
          text: The King felt ashamed not to know such a great lord. But Peter refused to tell him. His master had forbidden it, and he dared not disobey. The King gave him money to drink Lord Peter's health and sent his master many thanks.
        - id: ch02-b10
          speaker: narrator
          text: The next day, the Cat went into the woods again. This time she leaped onto a red deer's head, settled between its horns, and forced it toward the palace. Once more, Peter brought the animal into the kitchen.
        - id: ch02-b11
          speaker: peter
          text: Here is another small present for the King, if it pleases him to accept it.
        - id: ch02-b12
          speaker: narrator
          text: The King was even happier with the red deer than he had been with the reindeer. Again he asked who had sent such a fine gift.
        - id: ch02-b13
          speaker: peter
          text: Lord Peter sent it, of course.
        - id: ch02-b14
          speaker: narrator
          text: When the King asked where Lord Peter lived, he got the same answer as before. Peter was forbidden to say. So the King gave him another heavy purse to drink his master's health.
        - id: ch02-b15
          speaker: narrator
          text: On the third day, the Cat brought an elk. Peter led it into the palace kitchen and offered it as another little present. The King hurried in. When he saw the magnificent elk, he was so pleased he hardly knew which leg to stand on. He gave Peter far more money than before, at least a hundred dollars. Now he meant to discover where Lord Peter lived. He questioned the lad again and again.
        - id: ch02-b16
          speaker: peter
          text: I dare not tell you, Your Majesty. My master has strictly forbidden it.
        - id: ch02-b17
          speaker: king
          text: Then ask Lord Peter to come and visit me.
        - id: ch02-b18
          speaker: peter
          text: Yes, Your Majesty. I'll carry him your invitation.
    - id: ch03
      title: Lord Peter Visits the Palace
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: Out in the palace yard, Peter found the Cat waiting for him.
        - id: ch03-b02
          speaker: peter
          text: Now you've landed me in real trouble. The King wants me to visit him, and all I have to wear are these rags on my back.
        - id: ch03-b03
          speaker: cat
          text: Don't worry about that. In three days you'll have a coach, horses, and clothes so splendid that gold drops from them. Then you can visit the King properly. But remember this. Whatever you see in his palace, tell him you own something even finer and grander. Don't forget.
        - id: ch03-b04
          speaker: peter
          text: I won't forget. You can count on me.
        - id: ch03-b05
          speaker: narrator
          text: Three days later, the Cat returned with horses, a coach, fine clothes, and everything Peter needed. It was as grand as anything anyone had ever seen. Peter set off in the coach while the Cat ran beside it.
        - id: ch03-b06
          speaker: narrator
          text: The King welcomed Lord Peter graciously. Yet each time he offered Peter something or showed him one of his treasures, Peter said it was all very well, but he had much finer things at home. The King did not seem to believe him. Peter would not change his story, and at last the King grew too angry to bear another word.
        - id: ch03-b07
          speaker: king
          text: I'll go home with you now and see whether you truly own all these finer things. If you've told me a pack of lies, then Heaven help you. That's all I have to say.
          emotion: angry
        - id: ch03-b08
          speaker: narrator
          text: Peter went back to the Cat in dismay.
        - id: ch03-b09
          speaker: peter
          text: Here's another fine mess you've made for me. The King is coming home with me, and I don't think my home will be very easy to find.
        - id: ch03-b10
          speaker: cat
          text: Never mind. I'll run ahead, and you only have to drive after me.
        - id: ch03-b11
          speaker: narrator
          text: Away they went. Peter followed his Cat, and behind his coach came the King with all his court.
    - id: ch04
      title: The Riches Along the Road
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: After they had traveled a good way, they reached a great flock of splendid sheep. Their wool hung so long that it nearly brushed the ground. The Cat hurried to the boy who watched them. She carried a silver spoon taken from the King's palace.
        - id: ch04-b02
          speaker: cat
          text: When the King asks, tell him this flock belongs to Lord Peter. Do that, and I'll give you this silver spoon.
        - id: ch04-b03
          speaker: narrator
          text: The shepherd boy was quite willing to earn the silver spoon. Soon the King and his company drove up, and the King stared at the sheep.
        - id: ch04-b04
          speaker: king
          text: I've never seen such a large and beautiful flock in all my life. Tell me, my lad, who owns it?
        - id: ch04-b05
          speaker: shepherd
          text: Who could own it but Lord Peter?
        - id: ch04-b06
          speaker: narrator
          text: A little farther on, they came to an enormous herd of fine brindled cattle. Every cow was so sleek that the sunlight shone from its hide. The Cat found the cowherd and showed him a silver ladle, also taken from the palace.
        - id: ch04-b07
          speaker: cat
          text: Say that this herd belongs to Lord Peter when the King asks you, and this silver ladle is yours.
        - id: ch04-b08
          speaker: cowherd
          text: Gladly. I'll do it with all my heart.
        - id: ch04-b09
          speaker: narrator
          text: The King was amazed when he reached the fat, handsome cattle. Never before had he seen a herd like it, and he asked the cowherd who owned them.
        - id: ch04-b10
          speaker: cowherd
          text: Why, they belong to Lord Peter. Who else would own them?
        - id: ch04-b11
          speaker: narrator
          text: Still farther on stood a vast drove of horses, finer than any you could imagine. There were six of every color, bay, black, brown, and chestnut. The Cat offered their keeper a silver drinking cup that she had taken from the palace.
        - id: ch04-b12
          speaker: cat
          text: When the King asks, tell him all these horses belong to Lord Peter. Then I'll give you this silver cup.
        - id: ch04-b13
          speaker: horse_keeper
          text: Yes, I'll gladly say so.
        - id: ch04-b14
          speaker: narrator
          text: The King came up and marveled at the grand drove. He said he had never seen such perfectly matched horses. Then he asked the keeper who owned all the blacks, bays, browns, and chestnuts.
        - id: ch04-b15
          speaker: horse_keeper
          text: Who else could they belong to but Lord Peter?
    - id: ch05
      title: The Silver Castle
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: When they had gone much farther, they came to a castle. First they passed through a gate of tin, then one of silver, and finally one of gold. The castle itself was silver. It shone so dazzlingly white in the sun that looking at it hurt their eyes.
        - id: ch05-b02
          speaker: narrator
          text: They entered, and the Cat told Peter to claim the castle as his home. Inside, it was even grander than it looked from the road. Everything was made of pure gold, from the chairs and tables to the benches. The King searched all through the castle, upstairs and down. By the time he had seen it all, he looked ashamed and downcast.
        - id: ch05-b03
          speaker: king
          text: It's true. Lord Peter has finer things than I have in every way. No one could deny it.
        - id: ch05-b04
          speaker: narrator
          text: The King wanted to leave for home at once. Peter persuaded him to stay for supper, though all through the meal the King remained sour and surly.
        - id: ch05-b05
          speaker: narrator
          text: While they sat at the table, the Troll who owned the castle returned. He struck the door with a tremendous blow.
        - id: ch05-b06
          speaker: troll
          text: Who's in there, eating my meat and drinking my mead like a pack of swine?
          emotion: angry
        - id: ch05-b07
          speaker: narrator
          text: The moment the Cat heard him, she ran down to the gate.
        - id: ch05-b08
          speaker: cat
          text: Wait there, and I'll explain how a farmer gets his winter rye into the ground.
        - id: ch05-b09
          speaker: narrator
          text: Then she began a story about winter rye, and she made it last a very long time.
        - id: ch05-b10
          speaker: cat
          text: First, you see, the farmer plows the field. Then he spreads dung over it. After that he plows it once more, and then he harrows it.
        - id: ch05-b11
          speaker: narrator
          text: On and on she talked, adding one step after another, until at last the sun rose.
        - id: ch05-b12
          speaker: cat
          text: Oh, look behind you! There's such a lovely lady standing there.
        - id: ch05-b13
          speaker: narrator
          text: The Troll turned around. Of course, the instant he saw the sun, he burst.
    - id: ch06
      title: The Cat's Last Request
      blocks:
        - id: ch06-b01
          speaker: cat
          text: All of this belongs to you now, Lord Peter. You must cut off my head. That's the only payment I ask for everything I've done.
        - id: ch06-b02
          speaker: peter
          text: No, never! I won't do such a thing, and that's final.
        - id: ch06-b03
          speaker: cat
          text: If you refuse, I'll claw your eyes out. See if I don't.
        - id: ch06-b04
          speaker: narrator
          text: Peter had no choice, though it went sorely against his will. He cut off the Cat's head. At that very moment, she became the loveliest Princess anyone had ever seen, and Peter fell in love with her at once.
        - id: ch06-b05
          speaker: princess
          text: All this greatness was mine in the beginning. Then a Troll put a spell on me and turned me into the Cat who lived in your father and mother's cottage. Now you may choose whether to take me as your queen. This whole realm is yours, and you are its king.
        - id: ch06-b06
          speaker: narrator
          text: Well, there was little doubt that Lord Peter wanted the Princess for his queen. Their wedding lasted eight full days, with a great feast besides.
        - id: ch06-b07
          speaker: narrator
          text: When the feast was over, I stayed no longer with Lord Peter and his lovely queen. So I can tell you nothing more about them.
