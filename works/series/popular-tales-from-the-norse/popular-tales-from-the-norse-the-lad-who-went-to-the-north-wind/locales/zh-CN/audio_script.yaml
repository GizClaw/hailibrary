audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 从容而清醒，带一点克制的诙谐
        timbre: 温厚清晰
        pace: 舒缓有致
        pitch: 中低
    lad:
      display_name: 小伙子
      tts:
        delivery: 朴实直率，遇到不公时倔强坚定
        timbre: 清亮结实
        pace: 中等
        pitch: 中
    mother:
      display_name: 母亲
      tts:
        delivery: 谨慎务实，凡事要亲眼验证
        timbre: 温和略显衰弱
        pace: 舒缓
        pitch: 中
    north_wind:
      display_name: 北风
      tts:
        delivery: 爽直有力，声势粗犷而不凶恶
        timbre: 浑厚洪亮
        pace: 中等偏慢
        pitch: 低
    landlord:
      display_name: 老板
      tts:
        delivery: 精明贪婪，挨打后惊慌求饶
        timbre: 粗实偏紧
        pace: 中等偏快
        pitch: 中低
  chapters:
    - id: ch01
      title: 被北风卷走的面粉
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 从前，有个年老的寡妇，膝下只有一个儿子。她身体虚弱，家里又穷，只好让儿子去粮仓取些面粉回来做饭。
        - id: ch01-b02
          speaker: narrator
          text: 小伙子捧着面粉走出粮仓，刚要下台阶，北风忽然呼呼刮来，一口卷走面粉，扬到半空。小伙子只得回粮仓再取一些。可他刚走上外面的台阶，北风又呼地卷走了面粉。小伙子试到第三回，面粉仍旧被北风带走了。
        - id: ch01-b03
          speaker: narrator
          text: 小伙子气坏了。他觉得北风这样欺负人，实在不像话，便决定找到北风，叫他把面粉还回来。
        - id: ch01-b04
          speaker: narrator
          text: 他就这样上了路。北风家远得很，小伙子走啊走啊，走了很久，终于找到了那里。
        - id: ch01-b05
          speaker: lad
          text: 您好！也谢谢您昨天到我们家去做客。
        - id: ch01-b06
          speaker: narrator
          text: 北风开口了，嗓音又响又粗。
        - id: ch01-b07
          speaker: north_wind
          text: 你好！也谢谢你来看我。你想要什么？
        - id: ch01-b08
          speaker: lad
          text: 我想请您把卷走的面粉还给我。我们本来就没多少吃的。您若连仅剩的一点儿也卷走，我们就只能饿死了。
        - id: ch01-b09
          speaker: north_wind
          text: 你的面粉不在我这里。不过，你既然这么缺吃的，我就送你一块桌布。只要念一句咒语，它就会把你想要的各样好菜全都摆出来。
        - id: ch01-b10
          speaker: north_wind
          text: 桌布，桌布，快铺开，各样好菜端上来！
    - id: ch02
      title: 神奇的桌布
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 小伙子拿到桌布，心里十分满意。可回家的路太远，一天走不完，他便投宿在半路的一家客店。大家正要坐下吃晚饭时，他把桌布铺到角落的一张桌子上，当众念起咒语。
        - id: ch02-b02
          speaker: lad
          text: 桌布，桌布，快铺开，各样好菜端上来！
        - id: ch02-b03
          speaker: narrator
          text: 话音刚落，桌布便照他的吩咐，摆出满桌菜肴。站在旁边的人无不称奇，老板娘尤其眼热。到了深更半夜，人人都睡熟了，她悄悄拿走那块神奇的桌布，换上一块模样相同的。可这块假的，连一片干面包也端不出来。
        - id: ch02-b04
          speaker: narrator
          text: 小伙子醒来以后，并不知道桌布已经被换了。他拿上那块假的继续赶路，当天便回到家，兴冲冲地告诉母亲，他见到了北风。
        - id: ch02-b05
          speaker: lad
          text: 北风这个人真不错。他送了我这块桌布。我只要叫它铺开，再端上各样好菜，想吃什么就能有什么。
        - id: ch02-b06
          speaker: mother
          text: 你说得再真，我也得亲眼看见才信。
        - id: ch02-b07
          speaker: narrator
          text: 小伙子赶紧搬出一张桌子，把桌布铺在上面，当着母亲的面念出那句咒语。
        - id: ch02-b08
          speaker: lad
          text: 桌布，桌布，快铺开，各样好菜端上来！
        - id: ch02-b09
          speaker: narrator
          text: 桌布一动不动，连一片干面包也没有端出来。
        - id: ch02-b10
          speaker: lad
          text: 没别的办法，我只好再去找北风。
    - id: ch03
      title: 会吐金币的公羊
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 小伙子再次走过漫长的路。下午很晚时，他才来到北风住的地方。
        - id: ch03-b02
          speaker: lad
          text: 晚上好！
        - id: ch03-b03
          speaker: north_wind
          text: 晚上好！
        - id: ch03-b04
          speaker: lad
          text: 您卷走了我家的面粉，我来讨个公道。您送我的桌布，连一个钱也不值。
        - id: ch03-b05
          speaker: north_wind
          text: 我这里没有你的面粉。不过，那边有一只公羊，它吐出来的全是金币。你只要对它念一句咒语。
        - id: ch03-b06
          speaker: north_wind
          text: 公羊，公羊，快撒钱！
        - id: ch03-b07
          speaker: narrator
          text: 小伙子觉得这只公羊可真是件宝贝。可路途太远，当天还是赶不到家，他便又去先前住过的那家客店过夜。
        - id: ch03-b08
          speaker: narrator
          text: 他还没向店里要任何东西，就先照北风的话试了试公羊，果然灵验。老板看见这只公羊真能吐出金币，立刻觉得它了不得。等小伙子睡着，他牵来另一只不会吐金币的公羊，偷偷把两只羊调换了。
        - id: ch03-b09
          speaker: narrator
          text: 第二天一早，小伙子牵着假公羊离开客店。回到家，他马上去找母亲。
        - id: ch03-b10
          speaker: lad
          text: 北风到底还是个痛快人。这回他送了我一只公羊。我只要说“公羊，公羊，快撒钱”，它就会吐出一枚枚金币。
        - id: ch03-b11
          speaker: mother
          text: 这种话，我非得亲眼看到金币出来才信。
        - id: ch03-b12
          speaker: lad
          text: 公羊，公羊，快撒钱！
        - id: ch03-b13
          speaker: narrator
          text: 可那只公羊就算吐出了什么，也绝不是钱。
        - id: ch03-b14
          speaker: narrator
          text: 小伙子只得再去找北风。这一次，他狠狠数落了北风一顿，说那只公羊一点用也没有。北风既然卷走了他家的面粉，就必须赔还面粉，给他一个公道。
    - id: ch04
      title: 会打人的旧棍子
      blocks:
        - id: ch04-b01
          speaker: north_wind
          text: 我再没有别的东西能给你了，只有那边角落里的一根旧棍子。不过，它可不寻常。你只要叫它动手，它就会一直打下去，直到你亲口叫它停下。
        - id: ch04-b02
          speaker: north_wind
          text: 棍子，棍子，给我打！棍子，棍子，快停下！
        - id: ch04-b03
          speaker: narrator
          text: 回家的路依旧很长，这天晚上，小伙子又住进那家客店。桌布和公羊究竟是怎么回事，他心里已经猜到了几分。于是他一进店就躺在长凳上，闭上眼睛，装作睡熟，故意打起鼾来。
        - id: ch04-b04
          speaker: narrator
          text: 老板一看这根棍子，就知道它一定也有妙用。他到处找来一根模样相同的，听见小伙子鼾声大作，便悄悄走过去，想把两根棍子调换。可他的手刚要碰到那根旧棍子，小伙子忽然大喊起来。
        - id: ch04-b05
          speaker: lad
          text: 棍子，棍子，给我打！
        - id: ch04-b06
          speaker: narrator
          text: 棍子立刻追着老板打，怎么也不肯停。老板被打得从椅子上跳过桌子，又从桌子上跳过长凳，一边拼命躲闪，一边又叫又嚷。
        - id: ch04-b07
          speaker: landlord
          text: 哎哟！哎哟！快叫它停下，不然我会被活活打死！你的桌布和那只公羊，我都还给你！
          emotion: fearful
        - id: ch04-b08
          speaker: narrator
          text: 小伙子觉得老板挨的打已经够多了。
        - id: ch04-b09
          speaker: lad
          text: 棍子，棍子，快停下！
    - id: ch05
      title: 讨回公道
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 棍子终于停住。小伙子从老板那里拿回真正的桌布，把它揣进口袋。他一手提着棍子，又找来一根绳子，套住公羊的角，牵着它一路回家去了。
        - id: ch05-b02
          speaker: narrator
          text: 就这样，小伙子终于为被北风卷走的面粉讨回了公道。
