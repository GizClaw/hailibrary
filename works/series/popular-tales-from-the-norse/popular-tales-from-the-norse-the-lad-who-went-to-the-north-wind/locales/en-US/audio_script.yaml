audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: thoughtful and gently wry
        timbre: warm and clear
        pace: measured
        pitch: medium
    lad:
      display_name: Lad
      tts:
        delivery: straightforward and determined
        timbre: youthful and clear
        pace: moderate
        pitch: medium-high
    north_wind:
      display_name: North Wind
      tts:
        delivery: forceful and blunt
        timbre: loud and gruff
        pace: measured
        pitch: low
    mother:
      display_name: Mother
      tts:
        delivery: skeptical and plainspoken
        timbre: frail and warm
        pace: unhurried
        pitch: medium
    landlord:
      display_name: Landlord
      tts:
        delivery: calculating and blustering
        timbre: rough and full
        pace: moderate
        pitch: medium-low
  chapters:
    - id: ch01
      title: The Stolen Meal
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Once upon a time, an old widow lived with her only son. She was poor and weak, so the lad had to climb into the storehouse and fetch the meal for their cooking. He had just stepped outside and started down when the North Wind came puffing and blowing. It swept up the meal and carried it away through the air.
        - id: ch01-b02
          speaker: narrator
          text: The lad went back for more. The moment he stepped out again, the North Wind returned and blew that meal away too. Then it happened a third time. Now the lad was very angry. It was too hard that the North Wind should treat him this way. He decided to find the wind and demand his meal back.
        - id: ch01-b03
          speaker: narrator
          text: Off he went. The road was long, and he walked on and on until at last he reached the North Wind's house.
        - id: ch01-b04
          speaker: lad
          text: Good day, and thank you for visiting us yesterday.
        - id: ch01-b05
          speaker: north_wind
          text: GOOD DAY! AND THANK YOU FOR VISITING ME! WHAT DO YOU WANT?
        - id: ch01-b06
          speaker: narrator
          text: The North Wind's voice was loud and gruff.
        - id: ch01-b07
          speaker: lad
          text: I came to ask for the meal you took from me on the storehouse steps. We have very little to live on. If you keep snatching away the little food we have, we'll starve.
        - id: ch01-b08
          speaker: north_wind
          text: I don't have your meal. But if your need is so great, I'll give you a cloth. It will bring you anything you want. Just say, "Cloth, spread yourself and serve every kind of good dish!"
    - id: ch02
      title: The Magic Cloth
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: The lad was delighted with the cloth. But the journey home took more than a day, so he stopped for the night at an inn. When everyone was about to sit down to supper, he laid the cloth on a table in the corner.
        - id: ch02-b02
          speaker: lad
          text: Cloth, spread yourself and serve every kind of good dish!
        - id: ch02-b03
          speaker: narrator
          text: No sooner had he spoken than the cloth obeyed. Everyone there thought it was marvelous, and no one admired it more than the landlady. In the dead of night, after they were all fast asleep, she took the lad's cloth. She left another one in its place that looked exactly the same, though it could not serve even a scrap of dry bread.
        - id: ch02-b04
          speaker: narrator
          text: In the morning, the lad picked up the false cloth and continued on his way. That day he reached home.
        - id: ch02-b05
          speaker: lad
          text: I've been to the North Wind's house, Mother, and he's a good fellow after all. He gave me this cloth. Whenever I tell it to spread itself and serve every kind of good dish, it gives me any food I want.
        - id: ch02-b06
          speaker: mother
          text: That may all be true, but seeing is believing. I won't believe it until I see it.
        - id: ch02-b07
          speaker: narrator
          text: The lad quickly pulled out a table and laid the cloth across it.
        - id: ch02-b08
          speaker: lad
          text: Cloth, spread yourself and serve every kind of good dish!
        - id: ch02-b09
          speaker: narrator
          text: The cloth did not serve so much as one piece of dry bread.
        - id: ch02-b10
          speaker: lad
          text: Then there's nothing else to do. I must go back to the North Wind.
        - id: ch02-b11
          speaker: narrator
          text: And away he went.
    - id: ch03
      title: The Golden Ram
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: It was late afternoon when the lad reached the North Wind's home again.
        - id: ch03-b02
          speaker: lad
          text: Good evening!
        - id: ch03-b03
          speaker: north_wind
          text: Good evening!
        - id: ch03-b04
          speaker: lad
          text: I want what you owe me for the meal you took. That cloth you gave me isn't worth a penny.
        - id: ch03-b05
          speaker: north_wind
          text: I don't have your meal. But take that ram over there. It makes golden ducats whenever you say, "Ram, ram, make money!"
        - id: ch03-b06
          speaker: narrator
          text: The lad thought that sounded splendid. Once again, it was too late to reach home, so he spent the night at the same inn. Before he ordered anything, he tested the North Wind's promise.
        - id: ch03-b07
          speaker: lad
          text: Ram, ram, make money!
        - id: ch03-b08
          speaker: narrator
          text: The ram did exactly as promised. When the landlord saw the golden ducats, he knew this was a remarkable animal. As soon as the lad fell asleep, the landlord brought in another ram, one that could make no gold at all, and exchanged them.
        - id: ch03-b09
          speaker: narrator
          text: The next morning, the lad set off with the wrong ram. When he arrived home, he went straight to his mother.
        - id: ch03-b10
          speaker: lad
          text: The North Wind really is a fine fellow. This time he gave me a ram that makes golden ducats. All I have to say is, "Ram, ram, make money!"
        - id: ch03-b11
          speaker: mother
          text: That may all be true, but I won't believe such a tale until I see those ducats.
        - id: ch03-b12
          speaker: lad
          text: Ram, ram, make money!
        - id: ch03-b13
          speaker: narrator
          text: The ram may have made something, but it certainly did not make money.
    - id: ch04
      title: The Old Stick
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: So the lad returned to the North Wind once more. This time he gave the wind a fierce scolding. The ram was useless, he said, and he still demanded what was owed for the meal.
        - id: ch04-b02
          speaker: north_wind
          text: Well, I have nothing left to give you except that old stick in the corner. But this is no ordinary stick. Say, "Stick, stick, lay on!" and it will keep striking until you say, "Stick, stick, now stop!"
        - id: ch04-b03
          speaker: narrator
          text: The road was still too long to travel in one day, so the lad stopped at the same inn for a third night. By now, he had a good idea what had happened to the cloth and the ram. He lay down on a bench at once and began to snore as though he were sound asleep.
    - id: ch05
      title: His Rights at Last
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: The landlord could easily see that the old stick must be valuable. He found another one that looked like it. Then, when he heard the lad snoring, he crept over to make the exchange. Just as the landlord reached for the magic stick, the lad shouted.
        - id: ch05-b02
          speaker: lad
          text: Stick, stick, lay on!
        - id: ch05-b03
          speaker: narrator
          text: At once the stick began beating the landlord. It chased him over chairs, tables, and benches while he yelled and roared.
        - id: ch05-b04
          speaker: landlord
          text: Oh my! Oh my! Tell the stick to stop, or it will beat me to death! I'll give back your cloth and your ram!
          emotion: fearful
        - id: ch05-b05
          speaker: narrator
          text: When the lad thought the landlord had taken enough of a beating, he gave the order.
        - id: ch05-b06
          speaker: lad
          text: Stick, stick, now stop!
        - id: ch05-b07
          speaker: narrator
          text: Then the lad put the cloth in his pocket. With the stick in his hand and the ram following on a cord tied around its horns, he went home. And that was how he finally got his rights for the meal he had lost.
