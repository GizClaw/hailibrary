cover_prompt: |-
  A wordless cover scene in a high Norwegian mountain valley shows three sturdy goats crossing a narrow wooden bridge above a clear rushing stream while a shaggy troll watches from beneath the timbers. The smallest goat steps lightly toward a green summer pasture, the middle goat waits among gray rocks, and the largest goat lowers broad curved horns as it advances with calm courage. Dark spruce woods, steep blue-gray peaks, a turf-roofed farmstead, and a distant waterfall establish a timeless rural Scandinavian setting. The great goat's firm crossing is the focal action, while the troll remains surprised and comical rather than frightening. Use a low view from beside the stream, with the bridge forming a strong diagonal toward the sunlit valley and broad calm sky left open at the top. Keep the animals, wooden bridge, clothing glimpsed near the distant farm, and landscape grounded in preindustrial Norwegian country life, independent of film or animation designs. No readable text, letters, numbers, labels, logos, captions, speech bubbles, signatures, or watermarks.
