audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: thoughtful and gently wry
        timbre: warm and clear
        pace: measured
        pitch: medium
    fish:
      display_name: Fish
      tts:
        delivery: tender and mysterious
        timbre: soft and resonant
        pace: unhurried
        pitch: medium-low
  chapters:
    - id: ch01
      title: The Secret at the River
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Once, a girl went to the river to fetch water. She always stayed so long that the others decided to watch her.
        - id: ch01-b02
          speaker: narrator
          text: One day, they followed her. At the river, she spoke some words that the teller has forgotten. A fish rose from the water and talked with her. She did not want to leave him, because he was her sweetheart.
        - id: ch01-b03
          speaker: narrator
          text: The next day, they returned to see whether the fish would appear. They repeated the girl's words, and the fish came up at once. They caught him, took him home, and cooked him for dinner.
        - id: ch01-b04
          speaker: narrator
          text: They saved a portion for the girl and gave it to her when she came in.
    - id: ch02
      title: The Voice and the Heart
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: While the girl was eating, she heard a voice.
        - id: ch02-b02
          speaker: fish
          text: Do you know what you are eating? I am the one who talked with you so many times. Look in the pig's tub, and you will find my heart there.
        - id: ch02-b03
          speaker: narrator
          text: The voice told her to take the heart, wrap it in a handkerchief, and carry it to the river.
        - id: ch02-b04
          speaker: fish
          text: When you reach the river, you will see three stones in the water. Stand on the middle one, then dip the handkerchief into the water three times.
    - id: ch03
      title: Beneath the Water
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: The girl obeyed. She wrapped the heart in a handkerchief and carried it to the river.
        - id: ch03-b02
          speaker: narrator
          text: She saw three stones in the water. Standing on the middle one, she dipped the handkerchief three times.
        - id: ch03-b03
          speaker: narrator
          text: Suddenly, she sank beneath the water and was carried down to a beautiful place. There she found her sweetheart in his true form, no longer a fish.
        - id: ch03-b04
          speaker: narrator
          text: She lived there happily with him forever.
        - id: ch03-b05
          speaker: narrator
          text: And that is why there are mermaids in the water.
