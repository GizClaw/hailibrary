audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 从容而清醒，带一点克制的诙谐
        timbre: 温厚清晰
        pace: 舒缓有致
        pitch: 中低
    fish:
      display_name: 鱼
      tts:
        delivery: 温柔而神秘，话语中带着深情
        timbre: 柔和深沉
        pace: 舒缓
        pitch: 中低
  chapters:
    - id: ch01
      title: 河边的秘密
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 从前，有个女孩常去河边打水。可她每次都迟迟不肯回家。家里人便决定跟去看个究竟。
        - id: ch01-b02
          speaker: narrator
          text: 一天，他们悄悄跟到河边。女孩说了几句话，可讲故事的人已经不记得她说了什么。话音刚落，一条鱼便浮上水面，跟她聊了起来。女孩舍不得走，因为这条鱼就是她的心上人。
        - id: ch01-b03
          speaker: narrator
          text: 第二天，家里人照着女孩的话说了一遍，想看看鱼会不会来。鱼立刻浮了上来。他们捉住它，拿回家做成晚饭，还留下一份，等女孩回来吃。
    - id: ch02
      title: 鱼儿的心
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 女孩回来吃起那份鱼，忽然听见一个声音。
        - id: ch02-b02
          speaker: fish
          text: 你知道自己吃的是谁吗？就是我呀，那个常常陪你说话的人。去猪食槽里看看吧，我的心就在那里。
        - id: ch02-b03
          speaker: narrator
          text: 那声音又告诉她，要取出那颗心，用手帕包好，再带到河边去。
        - id: ch02-b04
          speaker: fish
          text: 到了河边，你会看见水里有三块石头。站到中间那块上面，把包着心的手帕在水里浸三次。
    - id: ch03
      title: 水下的归宿
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 女孩全都照做了。她从猪食槽里取出那颗心，用手帕包起来，带到了河边。
        - id: ch03-b02
          speaker: narrator
          text: 水里果然有三块石头。她站上中间那一块，把手帕浸了三次。就在这时，她忽然沉进水里，被带到一个美丽的地方。
        - id: ch03-b03
          speaker: narrator
          text: 在那里，女孩又见到了自己的心上人。他已经恢复本来的模样，不再是一条鱼。从此，女孩和他永远幸福地生活在一起。
        - id: ch03-b04
          speaker: narrator
          text: 这便是水中为什么会有美人鱼。
