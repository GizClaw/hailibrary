audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 从容而清醒，带一点克制的诙谐
        timbre: 温厚清晰
        pace: 舒缓有致
        pitch: 中低
    bear:
      display_name: 熊
      tts:
        delivery: 憨厚直率，问话时一本正经
        timbre: 浑厚温暖
        pace: 舒缓
        pitch: 低
    fox:
      display_name: 狐狸
      tts:
        delivery: 狡黠圆滑，答话时煞有介事
        timbre: 清亮灵活
        pace: 中等偏快
        pitch: 中高
  chapters:
    - id: ch01
      title: 藏起来的黄油
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 从前，熊和狐狸合伙买了一小桶黄油。他们想把黄油留到圣诞节再吃，就将木桶藏在一丛茂密的云杉底下。
        - id: ch01-b02
          speaker: narrator
          text: 两个家伙走开一段路，在洒满阳光的坡地上躺下来睡觉。过了一会儿，狐狸忽然爬起身，抖了抖毛，对着远处高声答应起来。
        - id: ch01-b03
          speaker: fox
          text: 来啦！
        - id: ch01-b04
          speaker: narrator
          text: 狐狸一溜烟跑到木桶边，吃掉了整整三分之一的黄油。等他回来，熊发现他的肚子已经撑得圆滚滚的，便问他刚才去了哪儿。
        - id: ch01-b05
          speaker: fox
          text: 怎么，你不知道吗？有人请我参加洗礼宴去了。
        - id: ch01-b06
          speaker: bear
          text: 原来是这样。那么，那个孩子叫什么名字？
        - id: ch01-b07
          speaker: fox
          text: 他叫“刚开头”。
    - id: ch02
      title: 三场洗礼宴
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 熊和狐狸再次躺下。没过多久，狐狸又跳起来，冲远处高喊一声。
        - id: ch02-b02
          speaker: fox
          text: 来啦！
        - id: ch02-b03
          speaker: narrator
          text: 他又跑到木桶那里，狠狠吃了一大块黄油。回来以后，熊照旧问他去了哪里。
        - id: ch02-b04
          speaker: fox
          text: 哎呀，你还没猜出来？我又去参加洗礼宴了。
        - id: ch02-b05
          speaker: bear
          text: 那么，这一回的孩子叫什么？
        - id: ch02-b06
          speaker: fox
          text: 他叫“吃一半”。
        - id: ch02-b07
          speaker: narrator
          text: 熊觉得这个名字实在古怪，可他没琢磨多久，便张着嘴打起哈欠，很快又睡着了。狐狸才躺了一会儿，就第三次跳起来，照旧高声答应着，奔向藏黄油的地方。这一回，他将桶里的黄油吃得一干二净。
        - id: ch02-b08
          speaker: narrator
          text: 狐狸回来以后，又说自己受邀参加洗礼宴去了。熊便问起这第三个孩子的名字。
        - id: ch02-b09
          speaker: fox
          text: 他叫“舔到底”。
    - id: ch03
      title: 谁才是小偷
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 后来，他们又躺下睡了很久。等到该去看看黄油时，两个家伙才发现，木桶已经空空如也。熊一口咬定是狐狸偷吃的，狐狸反过来怪熊。两个都说，对方趁自己睡着时去过木桶那里。
        - id: ch03-b02
          speaker: fox
          text: 好啦，我们很快就能查出是谁吃了黄油。咱们躺到太阳底下睡一觉，醒来以后，谁的嘴边和脸颊最油，谁就是小偷。
        - id: ch03-b03
          speaker: narrator
          text: 熊愿意接受这个检验。他心里明白，自己连一口黄油也没有尝过，便放下心来，在阳光下睡着了。
        - id: ch03-b04
          speaker: narrator
          text: 狐狸却悄悄溜到木桶边，从一道裂缝里找到一小块粘住的黄油。他蹑手蹑脚地回来，把黄油抹在熊的嘴边和两颊上，然后也躺下来，装作什么都没发生。
        - id: ch03-b05
          speaker: narrator
          text: 等他们醒来，阳光早把黄油晒化了，熊的胡须上满是油光。这样一来，吃掉黄油的当然是熊。除了他，还能是谁呢？
