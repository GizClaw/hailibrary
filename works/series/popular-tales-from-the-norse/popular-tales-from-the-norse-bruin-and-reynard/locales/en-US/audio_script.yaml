audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: thoughtful and gently wry
        timbre: warm and clear
        pace: measured
        pitch: medium
    bruin:
      display_name: Bruin
      tts:
        delivery: trusting and plainspoken
        timbre: deep and full
        pace: unhurried
        pitch: low
    reynard:
      display_name: Reynard
      tts:
        delivery: sly and smoothly persuasive
        timbre: light and nimble
        pace: moderate
        pitch: medium
  chapters:
    - id: ch01
      title: Three Christenings
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Once, Bruin the Bear and Reynard the Fox bought a small barrel of butter together. They meant to save it for Yule, so they hid it beneath a thick spruce bush.
        - id: ch01-b02
          speaker: narrator
          text: Then they walked a little way off and stretched out on a sunny bank to sleep. After a while, Reynard rose, shook himself, and called out, "Yes!"
        - id: ch01-b03
          speaker: narrator
          text: He ran straight to the barrel and ate a good third of the butter. When he returned, his belly looked so round that Bruin asked where he had been.
        - id: ch01-b04
          speaker: reynard
          text: Why, didn't you know? I was invited to a christening feast.
        - id: ch01-b05
          speaker: bruin
          text: Oh, were you? And what did they name the baby?
        - id: ch01-b06
          speaker: reynard
          text: They named the baby Just-Begun.
        - id: ch01-b07
          speaker: narrator
          text: They settled down again. Before long, Reynard sprang up, called, "Yes!" and hurried back to the barrel. This time he ate another large share.
        - id: ch01-b08
          speaker: narrator
          text: When Reynard came back, Bruin once more asked where he had gone.
        - id: ch01-b09
          speaker: reynard
          text: Well, wouldn't you know it? I was invited to another christening.
        - id: ch01-b10
          speaker: bruin
          text: And what was this baby called?
        - id: ch01-b11
          speaker: reynard
          text: This one was called Half-Eaten.
        - id: ch01-b12
          speaker: narrator
          text: Bruin thought that was a very strange name. But soon he began to yawn, opened his jaws wide, and fell asleep.
        - id: ch01-b13
          speaker: narrator
          text: Reynard did just what he had done twice before. He jumped up, shouted, "Yes!" and ran to the barrel. This time, he licked it completely clean.
        - id: ch01-b14
          speaker: narrator
          text: When he returned, he claimed there had been yet another christening. Bruin asked the baby's name.
        - id: ch01-b15
          speaker: reynard
          text: They called this baby Licked-to-the-Bottom.
    - id: ch02
      title: The Empty Barrel
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: Bruin and Reynard lay down once more and slept for a long time. At last, the time came to visit the barrel and look at their butter.
        - id: ch02-b02
          speaker: narrator
          text: They found the barrel empty. Bruin blamed Reynard, and Reynard blamed Bruin. Each one said the other must have eaten the butter while he slept.
        - id: ch02-b03
          speaker: reynard
          text: There's an easy way to find out which of us ate it. We'll lie here in the sunshine. When we wake up, the thief will be the one with grease all over his cheeks and jaws.
        - id: ch02-b04
          speaker: narrator
          text: Bruin was quite willing to face that test. In his heart, he knew he had never tasted so much as a bit of the butter. With nothing to worry about, he lay down in the sun and went to sleep.
    - id: ch03
      title: Grease on Bruin's Whiskers
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: Reynard slipped away to the barrel. A little butter was still caught in a crack, and he scraped it out. Then he crept back and smeared it across Bruin's cheeks and jaws.
        - id: ch03-b02
          speaker: narrator
          text: After that, Reynard lay down and went to sleep as though nothing had happened.
        - id: ch03-b03
          speaker: narrator
          text: By the time they woke, the sunshine had melted the butter. Bruin's whiskers were covered in grease. And so, after all, Bruin was judged to have eaten the butter, and no one else.
