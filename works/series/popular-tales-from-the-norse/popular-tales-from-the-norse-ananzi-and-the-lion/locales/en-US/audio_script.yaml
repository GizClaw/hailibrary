  chapters:
    - id: ch01
      title: The Fish on Shore
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Once, Ananzi thought up a scheme. In town, he bought a great many firkins of fat, sacks, and balls of string, along with one enormous frying pan. Then he went down to the bay, blew a shell, and summoned Green Eel, the head fish of the sea.
        - id: ch01-b02
          speaker: ananzi
          text: The King sent me with a message. Bring every fish onto the shore. He wants to give you all new life.
        - id: ch01-b03
          speaker: narrator
          text: Green Eel agreed and swam away to call the others. While he was gone, Ananzi lit a fire, brought out the fat, and made his frying pan ready.
        - id: ch01-b04
          speaker: narrator
          text: The fish came out of the water one after another. Ananzi caught each one and dropped it into the pan. At last, Green Eel came ashore. But he was so slippery that Ananzi could not hold him, and he escaped back into the sea.
        - id: ch01-b05
          speaker: narrator
          text: Ananzi fried all the fish he had caught, packed them into the sacks, hoisted the sacks onto his back, and started toward the mountains.
    - id: ch02
      title: Lion Follows the Sacks
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: Before he had gone far, Ananzi met Lion.
        - id: ch02-b02
          speaker: lion
          text: Well, Brother Ananzi, where have you been? I haven't seen you in a long while.
        - id: ch02-b03
          speaker: ananzi
          text: I've been traveling here and there.
        - id: ch02-b04
          speaker: lion
          text: Then what are you carrying in those sacks?
        - id: ch02-b05
          speaker: ananzi
          text: Oh, these are my mother's bones. She's been dead for forty-eleven years, and I've been told I mustn't keep her here. I'm taking her deep into the mountains to bury her.
        - id: ch02-b06
          speaker: narrator
          text: The two went their separate ways. But after a little while, Lion stopped to think.
        - id: ch02-b07
          speaker: lion
          text: Ananzi is a terrible rogue. I expect he's hiding something in those sacks, and he doesn't want me to see it. I'll follow him.
        - id: ch02-b08
          speaker: narrator
          text: Lion followed carefully, always staying out of Ananzi's sight.
        - id: ch02-b09
          speaker: narrator
          text: In the woods, Ananzi set down the sacks, took out one fish, and began to eat. A fly appeared.
        - id: ch02-b10
          speaker: ananzi
          text: I can't eat any more. Someone must be close by.
        - id: ch02-b11
          speaker: narrator
          text: He tied up the sack and went farther into the mountains. There he set the sacks down again and ate two fish. No fly appeared.
        - id: ch02-b12
          speaker: ananzi
          text: No one is near this time.
        - id: ch02-b13
          speaker: narrator
          text: So he reached for more. He had eaten about half a dozen fish when Lion came up behind him.
        - id: ch02-b14
          speaker: lion
          text: Well, Brother Ananzi. That was quite a story you told me.
        - id: ch02-b15
          speaker: ananzi
          text: Oh, Brother Lion, I'm glad you're here! Forget that little tale and sit down. I was only having fun.
        - id: ch02-b16
          speaker: narrator
          text: Lion sat down and started eating. Before Ananzi had finished two fish, Lion had emptied a whole sack. Ananzi muttered under his breath.
        - id: ch02-b17
          speaker: ananzi
          text: What a greedy fellow. He's eating every one of my fish.
        - id: ch02-b18
          speaker: lion
          text: What did you say, sir?
        - id: ch02-b19
          speaker: ananzi
          text: I said you're not eating nearly fast enough.
        - id: ch02-b20
          speaker: narrator
          text: Ananzi was afraid Lion might eat him too.
    - id: ch03
      title: The Test of Strength
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: They kept eating, but Ananzi wanted revenge.
        - id: ch03-b02
          speaker: ananzi
          text: Which one of us would you say is stronger?
        - id: ch03-b03
          speaker: lion
          text: Why, I am stronger, of course.
        - id: ch03-b04
          speaker: ananzi
          text: Then let's tie each other to this tree. That will show us who's stronger.
        - id: ch03-b05
          speaker: narrator
          text: They agreed that Lion would tie Ananzi first. Lion used very fine string and left it loose. Ananzi twisted two or three times, and the string snapped.
        - id: ch03-b06
          speaker: narrator
          text: Now it was Ananzi's turn. He brought out a very strong cord.
        - id: ch03-b07
          speaker: lion
          text: Don't bind me tightly. I didn't tie you tightly.
        - id: ch03-b08
          speaker: ananzi
          text: Oh, no. Of course I won't.
        - id: ch03-b09
          speaker: narrator
          text: But Ananzi pulled the cord as tight as he possibly could. Then he told Lion to break free. Lion struggled again and again, but he could not move.
        - id: ch03-b10
          speaker: narrator
          text: Ananzi saw his chance. He took a big stick and beat Lion with it. Then he walked away and left Lion tied to the tree. He was afraid that if he set Lion free, Lion would kill him.
    - id: ch04
      title: Miss Nancy and the Trees
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: One morning, a woman named Miss Nancy went into the woods to gather callalou, a kind of spinach. As she walked, she heard a voice.
        - id: ch04-b02
          speaker: lion
          text: Good morning, Miss Nancy!
        - id: ch04-b03
          speaker: narrator
          text: She could not tell who had spoken. She looked toward the voice and saw Lion tied to the tree.
        - id: ch04-b04
          speaker: miss_nancy
          text: Good morning, Mr. Lion. What are you doing there?
        - id: ch04-b05
          speaker: lion
          text: That fellow Ananzi tied me to this tree. Will you please set me free?
        - id: ch04-b06
          speaker: miss_nancy
          text: No. I'm afraid you'll kill me if I do.
          emotion: fearful
        - id: ch04-b07
          speaker: narrator
          text: Lion gave his word that he would not hurt her, but Miss Nancy still did not trust him. He begged her again and again.
        - id: ch04-b08
          speaker: lion
          text: If I try to eat you, may every tree cry shame on me.
        - id: ch04-b09
          speaker: narrator
          text: At last, Miss Nancy agreed. But the moment she untied Lion, he came toward her to eat her. He had gone so many days without food that he was ravenous.
        - id: ch04-b10
          speakers: [tree_1, tree_2, tree_3]
          ensemble: chorus
          text: Shame! Shame on you!
          emotion: angry
        - id: ch04-b11
          speaker: narrator
          text: The trees cried out at once, and Lion could not eat Miss Nancy. She hurried away as fast as she could, and Lion found his way home.
    - id: ch05
      title: The Dinner and the Chase
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: At home, Lion told his wife and children everything that had happened and explained how Miss Nancy had saved his life. The family decided to hold a great dinner and invite her.
        - id: ch05-b02
          speaker: narrator
          text: Ananzi heard about the dinner and wanted to go. He visited Miss Nancy and told her to take him along as her child, but she refused.
        - id: ch05-b03
          speaker: ananzi
          text: I can make myself look like a very little child. Then you can bring me with you.
        - id: ch05-b04
          speaker: narrator
          text: At last, Miss Nancy agreed. Ananzi gave her one more instruction.
        - id: ch05-b05
          speaker: ananzi
          text: If they ask what kind of pap your baby eats, tell them the baby doesn't eat pap. Say the baby eats the same food as everyone else.
        - id: ch05-b06
          speaker: narrator
          text: So they went to Lion's house, ate a very good dinner, and started home again. But one of Lion's sons felt that something was wrong. He spoke to his father.
        - id: ch05-b07
          speaker: lion_son
          text: I'm sure that baby was Ananzi.
        - id: ch05-b08
          speaker: narrator
          text: Lion set off after them. Before he caught up, Ananzi asked Miss Nancy to put him down so he could run. She did, and Ananzi raced through the woods with Lion close behind.
        - id: ch05-b09
          speaker: narrator
          text: When Ananzi saw Lion gaining on him, he changed himself into an old man carrying a bundle of wood on his head. Lion soon reached him.
        - id: ch05-b10
          speaker: ananzi
          text: Good morning, Mr. Lion.
        - id: ch05-b11
          speaker: lion
          text: Good morning, old gentleman.
        - id: ch05-b12
          speaker: ananzi
          text: What are you chasing after now?
        - id: ch05-b13
          speaker: narrator
          text: Lion asked whether he had seen Ananzi pass that way.
        - id: ch05-b14
          speaker: ananzi
          text: No, I haven't seen him. That fellow Ananzi is forever meddling with someone. What trouble has he caused this time?
        - id: ch05-b15
          speaker: narrator
          text: Lion told the old man what had happened.
        - id: ch05-b16
          speaker: ananzi
          text: There's no point in following him any farther. You'll never catch him now.
        - id: ch05-b17
          speaker: narrator
          text: Lion wished the old man good day, turned around, and went home.
