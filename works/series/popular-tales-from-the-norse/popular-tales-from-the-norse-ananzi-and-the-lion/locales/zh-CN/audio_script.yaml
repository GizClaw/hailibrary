audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 从容而清醒，带一点克制的诙谐
        timbre: 温厚清晰
        pace: 舒缓有致
        pitch: 中低
    ananzi:
      display_name: 阿南西
      tts:
        delivery: 得意健谈，夸耀时理直气壮
        timbre: 明亮灵活
        pace: 中等
        pitch: 中高
    lion:
      display_name: 狮子
      tts:
        delivery: 威严直爽，受骗后带着压不住的恼意
        timbre: 浑厚有力
        pace: 中等偏慢
        pitch: 低
    miss_nancy:
      display_name: 南希小姐
      tts:
        delivery: 谨慎善良，说话朴实坚定
        timbre: 柔和清晰
        pace: 中等
        pitch: 中
    tree_1:
      display_name: 第一棵树
      tts:
        delivery: 严正响亮，斥责时毫不含糊
        timbre: 粗粝低沉
        pace: 中等
        pitch: 低
    tree_2:
      display_name: 第二棵树
      tts:
        delivery: 严正响亮，斥责时毫不含糊
        timbre: 清脆坚实
        pace: 中等
        pitch: 中
    tree_3:
      display_name: 第三棵树
      tts:
        delivery: 严正响亮，斥责时毫不含糊
        timbre: 苍老浑厚
        pace: 中等偏慢
        pitch: 低
  chapters:
    - id: ch01
      title: 海湾里的骗局
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 从前有一回，阿南西想出了一条计策。他进城买回许多小桶油脂、许多口袋和线团，还带回一口大得出奇的煎锅。随后，他走到海湾，吹响海螺，把海里的鱼头领绿鳗叫了过来。
        - id: ch01-b02
          speaker: ananzi
          text: 国王让我来传话。你得把所有的鱼都带上岸，他要赐给大家新的生命。
        - id: ch01-b03
          speaker: narrator
          text: 绿鳗答应下来，转身去召集鱼群。阿南西马上生起火，取出油脂，把煎锅架好。鱼儿一条接一条钻出水面，他就出来一条捉一条，随手扔进锅里。轮到鱼头领时，绿鳗浑身滑溜溜的，阿南西怎么抓也抓不牢，终于让他逃回了水里。
        - id: ch01-b04
          speaker: narrator
          text: 阿南西把煎好的鱼全装进口袋，背在身上，向山里走去。刚走出不远，他就遇见了狮子。
        - id: ch01-b05
          speaker: lion
          text: 阿南西兄弟，你这些日子去哪儿了？我可有好久没见到你啦。
        - id: ch01-b06
          speaker: ananzi
          text: 我到各处游历去了。
        - id: ch01-b07
          speaker: lion
          text: 那你背上装的又是什么？
        - id: ch01-b08
          speaker: ananzi
          text: 噢，是我母亲的骨头。她死了四十又十一年，人家说不能再把她留在这里，所以我正要带她到深山里安葬。
        - id: ch01-b09
          speaker: narrator
          text: 两人分开以后，狮子越想越不对劲。
        - id: ch01-b10
          speaker: lion
          text: 阿南西是个大骗子。他准是背了什么好东西，不想让我看见。我得悄悄跟上去。
        - id: ch01-b11
          speaker: narrator
          text: 狮子一路小心躲藏，始终没让阿南西瞧见。
    - id: ch02
      title: 狮子吃鱼
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 进了树林，阿南西放下口袋，拿出一条鱼吃起来。一只苍蝇忽然飞到旁边。
        - id: ch02-b02
          speaker: ananzi
          text: 附近一定有人，我不能再吃了。
        - id: ch02-b03
          speaker: narrator
          text: 他把口袋扎好，继续往山里走。走到更深的地方，他又放下口袋，取出两条鱼吃掉。这次一只苍蝇也没来。
        - id: ch02-b04
          speaker: ananzi
          text: 这附近没人，可以放心吃了。
        - id: ch02-b05
          speaker: narrator
          text: 他又拿出几条鱼。可才吃了五六条，狮子就赶到了。
        - id: ch02-b06
          speaker: lion
          text: 好啊，阿南西兄弟，你刚才编的故事可真漂亮！
        - id: ch02-b07
          speaker: ananzi
          text: 狮子兄弟，你来了我真高兴！别管我刚才说过什么，快来坐下吧。我只是在闹着玩。
        - id: ch02-b08
          speaker: narrator
          text: 狮子坐下来就吃。阿南西连两条鱼都没吃完，他已经把整整一口袋扫了个精光。阿南西在心里抱怨起来。
        - id: ch02-b09
          speaker: ananzi
          text: 真是个贪吃鬼，快把我的鱼全吃光了。
        - id: ch02-b10
          speaker: lion
          text: 先生，你刚才说什么？
        - id: ch02-b11
          speaker: ananzi
          text: 我是说，你吃得还不够快呢。
        - id: ch02-b12
          speaker: narrator
          text: 阿南西生怕狮子把自己也吞下去，只好这样回答。他们继续吃，可阿南西已经盘算着怎样报复。
        - id: ch02-b13
          speaker: ananzi
          text: 你觉得咱们两个谁的力气更大？
        - id: ch02-b14
          speaker: lion
          text: 当然是我，这还用问吗？
        - id: ch02-b15
          speaker: ananzi
          text: 那咱们轮流把对方绑到树上，看看究竟谁更强。
    - id: ch03
      title: 绑在树上的狮子
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 他们说好让狮子先动手。狮子用一根细线绑住阿南西，并没有收紧。阿南西左右扭了两三下，线立刻断了。
        - id: ch03-b02
          speaker: narrator
          text: 接着轮到阿南西。他拿出来的却是一根非常结实的绳子。
        - id: ch03-b03
          speaker: lion
          text: 你可不能绑得太紧，我刚才也没有用力绑你。
        - id: ch03-b04
          speaker: ananzi
          text: 噢，那当然，我怎么会绑紧呢？
        - id: ch03-b05
          speaker: narrator
          text: 可阿南西嘴上答应着，手里却使出全身力气，把狮子捆得紧紧的。绑好以后，他叫狮子自己挣开。
        - id: ch03-b06
          speaker: narrator
          text: 狮子一次又一次地挣扎，却全是白费力气。阿南西知道自己的机会到了，便抄起一根大木棍，把狮子狠狠打了一顿，然后丢下他走了。阿南西不敢松开绳子，因为他怕狮子脱身以后会杀掉自己。
        - id: ch03-b07
          speaker: narrator
          text: 一天早晨，南希小姐到树林里采卡拉卢菜，也就是菠菜。路上，她忽然听见有人向她问好。
        - id: ch03-b08
          speaker: lion
          text: 早上好，南希小姐！
        - id: ch03-b09
          speaker: narrator
          text: 南希小姐一时分辨不出是谁，循着声音望去，才发现狮子被牢牢绑在树上。
        - id: ch03-b10
          speaker: miss_nancy
          text: 早上好，狮子先生。你怎么会待在那儿？
        - id: ch03-b11
          speaker: lion
          text: 都怪阿南西那个家伙，是他把我绑在树上的。你能替我解开吗？
        - id: ch03-b12
          speaker: miss_nancy
          text: 我不能放你。万一你一脱身就杀了我呢？
        - id: ch03-b13
          speaker: narrator
          text: 狮子保证自己绝不会伤害她，可南希小姐还是不敢相信。狮子只好再三央求。
        - id: ch03-b14
          speaker: lion
          text: 要是我真的想吃你，就让所有的树一起骂我不知羞耻。
        - id: ch03-b15
          speaker: narrator
          text: 南希小姐终于同意了。谁知绳子刚解开，狮子就扑向她，想把她吃掉。他已经许多天没有进食，早就饿得发狂。就在这时，四周的树一齐喊了起来。
        - id: ch03-b16
          speakers: [tree_1, tree_2, tree_3]
          ensemble: chorus
          text: 羞！羞！
        - id: ch03-b17
          speaker: narrator
          text: 狮子没法再吃南希小姐。她飞快地逃走了，狮子也自己找路回了家。
    - id: ch04
      title: 盛宴上的小娃娃
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 狮子回到家，把自己的遭遇全讲给妻子和孩子们听，也告诉他们，是南希小姐救了他的命。全家决定办一场盛宴，请南希小姐来做客。
        - id: ch04-b02
          speaker: narrator
          text: 阿南西听到这个消息，也想去吃这顿饭。他找到南希小姐，非要她把自己当作孩子带进去。
        - id: ch04-b03
          speaker: miss_nancy
          text: 不行，我不能带你去。
        - id: ch04-b04
          speaker: ananzi
          text: 我能变成一个很小很小的孩子。这样一来，你就能带上我了。
        - id: ch04-b05
          speaker: narrator
          text: 南希小姐最后答应下来。阿南西又仔细叮嘱她。
        - id: ch04-b06
          speaker: ananzi
          text: 要是他们问你的娃娃吃什么糊糊，你一定要说，这孩子不吃糊糊，大家吃什么，他就吃什么。
        - id: ch04-b07
          speaker: narrator
          text: 他们就这样去了狮子家，美美地吃了一顿，随后一起往回走。可是，狮子的一个儿子总觉得那个娃娃有问题。他告诉父亲，那一定是阿南西。狮子一听，马上追了出去。
    - id: ch05
      title: 头顶木柴的老头
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 狮子还没有赶上他们，阿南西就求南希小姐把他放到地上，好让他逃跑。南希小姐照他说的做了。阿南西拔腿冲进树林，狮子紧紧追在后面。
        - id: ch05-b02
          speaker: narrator
          text: 眼看狮子越来越近，阿南西摇身变成一个老头，头上还顶着一捆木柴。狮子追到跟前时，老头主动开了口。
        - id: ch05-b03
          speaker: ananzi
          text: 早上好，狮子先生。
        - id: ch05-b04
          speaker: lion
          text: 早上好，老先生。
        - id: ch05-b05
          speaker: ananzi
          text: 你这回是在追什么呀？
        - id: ch05-b06
          speaker: narrator
          text: 狮子问这位老头，有没有看到阿南西从这里跑过去。
        - id: ch05-b07
          speaker: ananzi
          text: 没看见。阿南西那个家伙总爱去招惹别人。这一次，他又闯了什么祸？
        - id: ch05-b08
          speaker: narrator
          text: 狮子把整件事说了一遍。老头听完，劝他别再追了。
        - id: ch05-b09
          speaker: ananzi
          text: 你再追下去也没有用，永远都抓不到他的。
        - id: ch05-b10
          speaker: narrator
          text: 狮子只好向老头道别，转过身，独自回家去了。
