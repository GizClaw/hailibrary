  chapters:
    - id: ch01
      title: The Lassie Goes Out into the World
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Once there was a poor man who lived in a hut far away in the wood. He earned his living by shooting. His only daughter was very pretty. She had lost her mother as a child, and when she was half grown, she decided to go out into the world and earn her own bread.
        - id: ch01-b02
          speaker: father
          text: Well, lassie, it's true you've learned nothing here except how to pluck birds and roast them. Still, you may as well try to earn your bread.
        - id: ch01-b03
          speaker: narrator
          text: The girl set off to find a place. Before long, she came to a palace and found work there. The queen liked her so much that all the other maids grew envious. They told the queen that the lassie claimed she could spin a pound of flax in twenty-four hours. Now, the queen was a great housewife, and good work mattered dearly to her.
        - id: ch01-b04
          speaker: queen
          text: If you said you could do it, then you must. But you may take a little more time if you need it.
        - id: ch01-b05
          speaker: narrator
          text: The poor lassie did not dare admit that she had never spun in her life. She only asked for a room of her own. The queen gave her one, and a wheel and the flax were carried in. The girl sat there weeping, with no idea what to do. She tugged the wheel one way, then another. She twisted it and turned it, but it was hopeless. She had never even seen a spinning wheel before.
    - id: ch02
      title: The Flax and the First Aunt
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: All at once, an old woman came into the room.
        - id: ch02-b02
          speaker: first_aunt
          text: What is troubling you, child?
        - id: ch02-b03
          speaker: lassie
          text: Ah, there's no use telling you. You could never help me.
        - id: ch02-b04
          speaker: first_aunt
          text: You can't be sure of that. Perhaps I can help after all.
        - id: ch02-b05
          speaker: narrator
          text: The lassie thought it over. The old woman might not be able to help, but there was no harm in telling her. So she explained that the other servants had claimed she could spin a pound of flax in twenty-four hours.
        - id: ch02-b06
          speaker: lassie
          text: And now, poor wretch that I am, I'm shut in here to spin this whole heap in a day and a night. I've never even seen a spinning wheel in all my life!
        - id: ch02-b07
          speaker: first_aunt
          text: Never mind, child. Promise to call me Aunt on the happiest day of your life, and I'll spin the flax for you. You can go and lie down to sleep.
        - id: ch02-b08
          speaker: narrator
          text: The lassie gladly agreed. She went away and slept. When she woke the next morning, every bit of flax lay spun upon the table. The yarn was so clean, fine, and even that no one had ever seen its equal. The queen was delighted and valued the lassie more than ever.
        - id: ch02-b09
          speaker: narrator
          text: That only made the other maids more envious. This time, they told the queen that the lassie claimed she could weave all the yarn in twenty-four hours.
        - id: ch02-b10
          speaker: queen
          text: Since you said you can do it, you must try. If you cannot finish in twenty-four hours, I won't be too hard on you. You may take a little longer.
        - id: ch02-b11
          speaker: narrator
          text: Again, the lassie did not dare say no. She asked for a room to herself and said she would try. Once inside, she sat sobbing, with no idea where to begin. Then a second old woman came in.
    - id: ch03
      title: The Linen and the Shirts
      blocks:
        - id: ch03-b01
          speaker: second_aunt
          text: What is troubling you, child?
        - id: ch03-b02
          speaker: narrator
          text: At first, the lassie would not answer. At last, she told the old woman the whole cause of her grief.
        - id: ch03-b03
          speaker: second_aunt
          text: There, there. Don't worry. Promise to call me Aunt on the happiest day of your life, and I'll weave the yarn for you. Now go and lie down to sleep.
        - id: ch03-b04
          speaker: narrator
          text: The lassie was glad to agree. She went away and lay down to sleep. When she woke, a finished piece of linen lay on the table. It was woven so neatly and closely that no cloth could have been finer. She picked it up and ran down to the queen. The queen was delighted with the beautiful linen and prized the lassie more than ever.
        - id: ch03-b05
          speaker: narrator
          text: The other maids grew more bitter still. They could think of nothing but finding another tale to tell about her. At last, they told the queen that the lassie claimed she could turn the linen into shirts in twenty-four hours. The queen answered as she had before. If the lassie had said she could do it, then she must do it.
        - id: ch03-b06
          speaker: narrator
          text: Everything happened just as before. The lassie did not dare admit that she could not sew. Once again, she was shut in a room by herself, where she sat in tears and misery. Then a third old woman came to her.
        - id: ch03-b07
          speaker: third_aunt
          text: Promise to call me Aunt on the happiest day of your life, and I'll sew all the shirts for you. Then you can go and lie down to sleep.
        - id: ch03-b08
          speaker: lassie
          text: Yes, I promise. I'll gladly call you Aunt on that happy day.
        - id: ch03-b09
          speaker: narrator
          text: The lassie did as the old woman told her and went to sleep. In the morning, she found that all the linen had been made into shirts. No one had ever seen such beautiful sewing. The shirts were even marked and ready to wear. When the queen saw them, she was so pleased that she clapped her hands.
        - id: ch03-b10
          speaker: queen
          text: Never in my life have I owned such sewing, or even seen anything like it!
          emotion: happy
        - id: ch03-b11
          speaker: narrator
          text: From that day, the queen loved the lassie as dearly as her own children.
        - id: ch03-b12
          speaker: queen
          text: If you would like the Prince for your husband, you shall have him. You'll never need to hire women to work for you, because you can spin, weave, and sew everything yourself.
        - id: ch03-b13
          speaker: narrator
          text: The lassie was pretty, and the Prince was glad to marry her, so the wedding soon arrived.
    - id: ch04
      title: Three Guests at the Feast
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: Just as the Prince was about to sit beside his bride at the wedding feast, an ugly old woman came in. Her nose was so long that it must have measured three ells.
        - id: ch04-b02
          speaker: narrator
          text: The bride rose, curtsied to her, and offered a greeting.
        - id: ch04-b03
          speaker: lassie
          text: Good day, Auntie.
        - id: ch04-b04
          speaker: prince
          text: Is that Auntie really your aunt?
          emotion: surprised
        - id: ch04-b05
          speaker: lassie
          text: Yes, she is.
        - id: ch04-b06
          speaker: prince
          text: Then she had better join us at the feast.
        - id: ch04-b07
          speaker: narrator
          text: The old woman sat down with them. To tell the truth, the Prince and everyone else thought she was a loathsome woman to have beside them. Just then, a second ugly old woman came in. Her back was so broad and humped that she could barely squeeze through the door. The bride sprang up at once.
        - id: ch04-b08
          speaker: lassie
          text: Good day, Auntie.
        - id: ch04-b09
          speaker: prince
          text: Is this woman your aunt as well?
        - id: ch04-b10
          speakers: [lassie, second_aunt]
          ensemble: duo
          text: Yes, she is.
        - id: ch04-b11
          speaker: prince
          text: If that's so, she should sit with us at the feast too.
        - id: ch04-b12
          speaker: narrator
          text: They had scarcely taken their seats when a third ugly old woman entered. Her eyes were as large as saucers, red and bleary, and gruesome to look at. Again, the bride jumped to her feet.
        - id: ch04-b13
          speaker: lassie
          text: Good day, Auntie.
        - id: ch04-b14
          speaker: narrator
          text: The Prince invited this aunt to sit down too, though he was far from pleased.
        - id: ch04-b15
          speaker: prince
          text: Heaven protect me from aunts like these!
        - id: ch04-b16
          speaker: narrator
          text: After he had sat there for a while, he could no longer keep his thoughts to himself.
        - id: ch04-b17
          speaker: prince
          text: How can my bride be such a lovely lassie when her aunts are all so loathsome and misshapen?
    - id: ch05
      title: Why the Aunts Looked So Strange
      blocks:
        - id: ch05-b01
          speaker: first_aunt
          text: I'll tell you exactly how it happened. I was every bit as good-looking when I was her age. But I spent all my time sitting over my spinning, poking and nodding. My nose stretched and stretched until it became as long as you see it now.
        - id: ch05-b02
          speaker: second_aunt
          text: And ever since I was young, I have shuffled backward and forward over my loom. That's how my back became as broad and humped as it is today.
        - id: ch05-b03
          speaker: third_aunt
          text: As for me, I have spent every day and night sewing and staring, then staring and sewing, ever since I was little. That is why my eyes are so ugly and red. Nothing can help them now.
        - id: ch05-b04
          speaker: prince
          text: Well, well! I'm lucky I learned the truth. If spinning, weaving, and sewing can make people so ugly and loathsome, then my bride shall never do any of them for the rest of her life.
