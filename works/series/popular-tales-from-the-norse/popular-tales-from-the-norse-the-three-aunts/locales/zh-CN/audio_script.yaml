audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 从容而清醒，带一点克制的诙谐
        timbre: 温厚清晰
        pace: 舒缓有致
        pitch: 中低
    father:
      display_name: 父亲
      tts:
        delivery: 老实温和，困窘时带着恳切
        timbre: 朴厚低沉
        pace: 中等
        pitch: 中低
    lassie:
      display_name: 姑娘
      tts:
        delivery: 年轻柔婉，哀求时真切急迫
        timbre: 清澈柔和
        pace: 中等
        pitch: 中等偏高
    old_queen:
      display_name: 老王后
      tts:
        delivery: 威严多疑，发怒时冷硬果断
        timbre: 低沉锐利
        pace: 中等偏慢
        pitch: 中低
    prince:
      display_name: 王子
      tts:
        delivery: 温和坚定，面对压力时沉着执着
        timbre: 明朗坚实
        pace: 中等
        pitch: 中等偏低
    first_aunt:
      display_name: 第一位姨妈
      tts:
        delivery: 慈和爽快，解释时坦然直白
        timbre: 苍老而清亮
        pace: 中等偏慢
        pitch: 中等
    second_aunt:
      display_name: 第二位姨妈
      tts:
        delivery: 亲切利落，说话朴实干脆
        timbre: 苍老浑厚
        pace: 中等
        pitch: 中低
    third_aunt:
      display_name: 第三位姨妈
      tts:
        delivery: 温厚笃定，语气不慌不忙
        timbre: 苍老柔和
        pace: 中等偏慢
        pitch: 中等偏低
  chapters:
    - id: ch01
      title: 王宫里的难题
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 从前，森林深处住着一个穷猎人。他和女儿住在一间小屋里。姑娘小时候就没了母亲，如今已经长到半大，出落得十分漂亮。她想去外面的世界，靠自己挣钱生活。
        - id: ch01-b02
          speaker: father
          text: 好吧，姑娘。你在家只学会了拔鸟毛、烤鸟肉，别的什么也不会。不过你就去试试吧，或许真能挣到饭吃。
        - id: ch01-b03
          speaker: narrator
          text: 姑娘出门走了一阵，来到一座王宫，找到了一份差事。王后很喜欢她，别的女仆便都妒忌她。她们知道王后最看重家务做得好，就去告状，说姑娘夸过口，一天一夜能纺完一磅亚麻。
        - id: ch01-b04
          speaker: old_queen
          text: 这话真是你说的？既然说出口，就得把它做到。不过你要是需要，我可以再多给你一点时间。
        - id: ch01-b05
          speaker: narrator
          text: 姑娘其实从没纺过线，可她不敢承认，只求王后给她一间单独的屋子。王后答应了，让人送来纺车和亚麻。姑娘坐在屋里，不停地伤心流泪。她把纺车推过来，拉过去，怎么摆弄也弄不明白。她这一生连纺车都没见过。
        - id: ch01-b06
          speaker: narrator
          text: 她正发愁，一位老妇人忽然走了进来。
        - id: ch01-b07
          speaker: first_aunt
          text: 孩子，你这是怎么了？
        - id: ch01-b08
          speaker: lassie
          text: 唉，告诉您也没用，您帮不了我的。
        - id: ch01-b09
          speaker: first_aunt
          text: 那倒未必。说不定我正好有办法。
        - id: ch01-b10
          speaker: narrator
          text: 姑娘想，反正告诉她也没有什么妨碍，便把女仆们怎样四处造谣，还有王后怎样命她纺完亚麻，全都讲了出来。
        - id: ch01-b11
          speaker: lassie
          text: 现在我被关在这里，一天一夜之内非得纺完这一大堆。可我从小到大，连纺车是什么样都不知道呀。
        - id: ch01-b12
          speaker: first_aunt
          text: 好了，孩子，别再发愁。只要你答应我，在你一生最幸福的那天叫我一声姨妈，我就替你纺完这些亚麻。你出去好好睡一觉吧。
        - id: ch01-b13
          speaker: narrator
          text: 姑娘巴不得有人相助，马上答应了。她出去躺下，很快睡着了。
    - id: ch02
      title: 两位姨妈的帮助
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 第二天早晨，姑娘醒来一看，所有亚麻都纺好了，整整齐齐地放在桌上。纱线又细又匀，从来没人见过这样好的纱。王后欢喜极了，也更加看重姑娘。
        - id: ch02-b02
          speaker: narrator
          text: 女仆们却越发妒忌。她们又去告诉王后，说姑娘还夸口能在一天一夜里，把自己纺的纱织成布。王后还是那句话。说过了就必须做到，要是一天一夜不够，也可以再宽限一些时间。
        - id: ch02-b03
          speaker: narrator
          text: 姑娘依然不敢承认自己不会，只求王后再给她一间单独的屋子，让她试试看。进了屋，她又抽抽搭搭地哭起来，完全不知道该怎么办。这时，第二位老妇人走了进来。
        - id: ch02-b04
          speaker: second_aunt
          text: 孩子，你为什么哭呀？
        - id: ch02-b05
          speaker: narrator
          text: 姑娘起先不肯开口。老妇人再问下去，她最后还是把自己的苦恼从头到尾说了一遍。
        - id: ch02-b06
          speaker: second_aunt
          text: 好了，好了，别发愁。你只要答应我，在你一生最幸福的那天叫我一声姨妈，我就替你把纱织成布。现在出去躺下睡觉吧。
        - id: ch02-b07
          speaker: narrator
          text: 姑娘满口答应，出去睡了。等她醒来，那匹布已经织好，密密齐齐地放在桌上，再没有比这更好的布了。她拿起来，飞快地跑下楼去见王后。王后见了十分高兴，从此越发看重她。
        - id: ch02-b08
          speaker: narrator
          text: 别的女仆却恨得更深，整天琢磨还能怎样告她一状。最后，她们对王后说，姑娘还声称一天一夜就能把这匹布做成衬衫。事情又和前两次一样。王后仍要她做到，也照旧答应多给些时间。姑娘不敢说自己不会缝衣服，又被独自关进一间屋子，只能坐在那里伤心流泪。
        - id: ch02-b09
          speaker: narrator
          text: 这时，第三位老妇人走了进来，答应替姑娘解围。
        - id: ch02-b10
          speaker: third_aunt
          text: 只要你答应我，在你一生最幸福的那天叫我一声姨妈，我就替你把衬衫全缝好。你答应了，就出去安心睡一觉吧。
        - id: ch02-b11
          speaker: narrator
          text: 姑娘高兴还来不及，立刻答应下来，照老妇人说的出去睡了。
    - id: ch03
      title: 最幸福的一天
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 第二天早晨，姑娘醒来时，那匹布已经变成一件件衬衫，全都整齐地摆在桌上。针脚漂亮得无人见过，每件衬衫还绣好了记号，拿起来就能穿。王后一见这手艺，喜欢得拍起手来。
        - id: ch03-b02
          speaker: old_queen
          text: 这样的针线活儿，我这辈子别说拥有，就连见也没见过。
        - id: ch03-b03
          speaker: narrator
          text: 从此，王后疼爱姑娘，就像疼爱自己的孩子。
        - id: ch03-b04
          speaker: old_queen
          text: 现在只要你肯嫁给王子，他就是你的丈夫。以后也不用再雇女工了，纺纱、织布、缝衣服，你全都能自己做。
        - id: ch03-b05
          speaker: narrator
          text: 姑娘长得漂亮，王子也愿意娶她，婚礼很快就举行了。王子正要和新娘一起入席享用婚宴，一个丑陋的老太婆走了进来。她有一只长得吓人的鼻子。我敢说，那鼻子足足有三厄尔长。
        - id: ch03-b06
          speaker: narrator
          text: 新娘立刻站起来，屈膝向她行礼。
        - id: ch03-b07
          speaker: lassie
          text: 姨妈，您好。
        - id: ch03-b08
          speaker: prince
          text: 这位姨妈，是我新娘的姨妈吗？
        - id: ch03-b09
          speakers: [lassie, first_aunt]
          ensemble: duo
          text: 是的，她就是。
        - id: ch03-b10
          speaker: prince
          text: 既然这样，也请姨妈坐下来，和我们一起赴宴吧。
        - id: ch03-b11
          speaker: narrator
          text: 不过说实话，王子和其他人都觉得，让这样一位难看得叫人作呕的女人坐在身边，实在很不好受。
        - id: ch03-b12
          speaker: narrator
          text: 就在这时，第二个丑陋的老太婆来了。她的背又宽又驼，费了好大力气才挤进门。新娘一下子跳起来，向她问候。
        - id: ch03-b13
          speaker: lassie
          text: 姨妈，您好！
        - id: ch03-b14
          speaker: narrator
          text: 王子又问她是不是新娘的姨妈。
        - id: ch03-b15
          speakers: [lassie, second_aunt]
          ensemble: duo
          text: 是的，她就是。
        - id: ch03-b16
          speaker: narrator
          text: 王子听了，便请她也坐下来赴宴。
        - id: ch03-b17
          speaker: narrator
          text: 大家刚坐稳，第三个丑陋的老太婆又走了进来。她的眼睛大得像两只碟子，红肿发炎，还不停流泪，看起来可怕极了。新娘再次跳起来迎接她。
        - id: ch03-b18
          speaker: lassie
          text: 姨妈，您好！
        - id: ch03-b19
          speaker: narrator
          text: 王子也请她入席，心里却一点也不高兴。他只盼着，上天可别让自己的新娘再冒出这样的姨妈。
    - id: ch04
      title: 三位姨妈的模样
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 众人坐了一会儿，王子再也忍不住心里的疑问。
        - id: ch04-b02
          speaker: prince
          text: 我实在想不通。我的新娘这么美丽，怎么会有几位姨妈长得这样难看，身体还变成了这副模样？
        - id: ch04-b03
          speaker: first_aunt
          text: 我来告诉你这是怎么回事。我像她这么大时，也和她一样漂亮。可是我总得低着头，伸长脖子坐在那里纺纱。纺着纺着，我的鼻子越拉越长，最后就成了你现在看到的样子。
        - id: ch04-b04
          speaker: second_aunt
          text: 再说我吧。我从年轻时起，就整天坐在织布机前，跟着梭子来来回回地挪。日子一久，我的背越来越宽，也越来越驼，最后变成了这样。
        - id: ch04-b05
          speaker: third_aunt
          text: 还有我。我从小就坐着缝东西，眼睛总得睁得大大的。白天缝，夜里也缝。我的眼睛这才变得又红又难看，到现在也治不好了。
    - id: ch05
      title: 王子的禁令
      blocks:
        - id: ch05-b01
          speaker: prince
          text: 原来是这样！幸好我及时知道了。既然这些活儿会把人变得这么丑陋可怕，我的新娘这辈子都不许再纺纱、织布，也不许再缝衣服。
