audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 从容而清醒，带一点克制的诙谐
        timbre: 温厚清晰
        pace: 舒缓有致
        pitch: 中低
    princess:
      display_name: 公主
      tts:
        delivery: 骄傲好胜，说起大话来理直气壮
        timbre: 年轻清亮
        pace: 中等
        pitch: 中高
    boots:
      display_name: 靴子小子
      tts:
        delivery: 朴实机灵，说起大话来一本正经
        timbre: 年轻明朗
        pace: 从容
        pitch: 中等
  chapters:
    - id: ch01
      title: 谁能赢过公主
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 从前，一位国王有个女儿。这位公主最会编瞎话，近处远处都找不出第二个像她的人。国王只好传下话来：谁能说出一长串瞎话，叫公主亲口说出“这是瞎话”，谁就能娶她，还能得到半个王国。
        - id: ch01-b02
          speaker: narrator
          text: 人们纷纷跑来碰运气。公主和半个王国，谁不想要呢？可公主平日里就以编瞎话为乐。他们说得再离奇，公主也只当耳边风。所有人都灰溜溜地走了。
        - id: ch01-b03
          speaker: narrator
          text: 后来，兄弟三人也来试了。两个哥哥先去，可他们跟先前那些人一样，谁也没能赢。最后，老三靴子小子出发了。他在农场院子里见到公主，开口就向她问好。
        - id: ch01-b04
          speaker: boots
          text: 早上好。你什么也没给我，我还是先谢谢你吧。
        - id: ch01-b05
          speaker: princess
          text: 早上好。你也一样，用不着谢。
        - id: ch01-b06
          speaker: narrator
          text: 公主说完，马上拿眼前的农场院子夸起口来。
        - id: ch01-b07
          speaker: princess
          text: 你家肯定没有我们这么气派的院子。两个牧羊人站在院子两头，同时吹响羊角号，可谁也听不见对方的号声。
        - id: ch01-b08
          speaker: boots
          text: 那还是我们家的院子更大。一头母牛在这头怀上牛犊，等它走到那头，刚好就该生了。
    - id: ch02
      title: 越吹越大
      blocks:
        - id: ch02-b01
          speaker: princess
          text: 是吗？我信。不过，你家绝没有我们那头公牛大。两个人坐在它两只角上，拿着二十英尺长的量尺，都碰不到对方。
        - id: ch02-b02
          speaker: boots
          text: 这也算大？我们家的公牛才叫大呢。两个人各坐一只牛角，对着那头拼命吹大号，还是听不见对方。
        - id: ch02-b03
          speaker: princess
          text: 好吧，我也信。可你家的牛奶总没我们多。我们把每头牛的奶都挤进大木桶，再把一只只木桶抬回屋里，倒进更大的桶，才做得出那么大的奶酪。
        - id: ch02-b04
          speaker: boots
          text: 原来你们才挤这么一点。我们把牛奶挤进大桶，用车拉回去，再倒进酿酒的大槽。做出来的奶酪，跟一幢大房子一样大。
        - id: ch02-b05
          speaker: boots
          text: 我们还养了一匹棕灰色的母马，专门替我们把奶酪踩紧。有一回，它跌进奶酪里，一下就没影了。我们吃了整整七年，才在奶酪里又碰见它。那匹马还活得好好的，又踢又跳呢。
    - id: ch03
      title: 一直编到天堂
      blocks:
        - id: ch03-b01
          speaker: boots
          text: 后来，我要赶那匹马去磨坊。走着走着，它的脊梁骨忽然断成两截。可这难不倒我。我砍了一棵云杉小树，塞进它身体里，就当作新的脊梁骨。以后我们养着它的日子里，它一直用的都是这根脊梁骨。
        - id: ch03-b02
          speaker: boots
          text: 可云杉还在长。它越长越高，最后都顶到了天上。我顺着树干一直往上爬，竟然爬进了天堂。圣母马利亚正坐在那里，把海上的泡沫纺成猪鬃绳。
        - id: ch03-b03
          speaker: boots
          text: 这时，云杉树突然齐刷刷地折断了，我想顺原路返回地上，可再也下不去。圣母马利亚便放下一根猪鬃绳，让我顺着它滑下去。我一路滑啊滑，最后竟直直掉进一个狐狸洞。
        - id: ch03-b04
          speaker: boots
          text: 你猜我在狐狸洞里看见了谁？我母亲和你父王正坐在里面，两个人都在缝鞋。我才走进去，我母亲就打了你父王一个结结实实的耳光，打得他两边的胡须都卷了起来。
        - id: ch03-b05
          speaker: princess
          text: 这是瞎话！我父王一辈子从没做过这种事！
        - id: ch03-b06
          speaker: narrator
          text: 这句话终于从公主嘴里说出来了。就这样，靴子小子娶了公主，还得到了半个王国。
