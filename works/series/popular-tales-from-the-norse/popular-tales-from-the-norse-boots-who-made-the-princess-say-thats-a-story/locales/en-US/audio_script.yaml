audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: thoughtful and gently wry
        timbre: warm and clear
        pace: measured
        pitch: medium
    boots:
      display_name: Boots
      tts:
        delivery: quick-witted and matter-of-fact
        timbre: clear and youthful
        pace: lively
        pitch: medium
    princess:
      display_name: Princess
      tts:
        delivery: confident and keenly competitive
        timbre: bright and poised
        pace: lively
        pitch: medium-high
  chapters:
    - id: ch01
      title: The King's Challenge
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            Once there was a king with a daughter who told the most dreadful tall tales. No one for miles around could match her. So the king announced a challenge. Any man who could tell enough lies to make her say, “That's a story,” would marry her and receive half the kingdom too.
        - id: ch01-b02
          speaker: narrator
          text: >-
            As you might expect, many men came to try their luck. They all wanted the Princess, and they were just as eager for the kingdom. One after another, they offered up their finest strings of lies. Every one of them cut a sorry figure. The Princess was so used to telling wild stories that their lies went in one ear and out the other.
        - id: ch01-b03
          speaker: narrator
          text: >-
            Three brothers came to take their turn as well. The two older brothers went first. Each tried to outdo the Princess, but neither fared any better than the men before them. At last, the third brother, Boots, set out. He found the Princess in the farmyard.
        - id: ch01-b04
          speaker: boots
          text: Good morning, and thanks for nothing.
        - id: ch01-b05
          speaker: princess
          text: Good morning to you, and the same thanks in return.
    - id: ch02
      title: The Farmyard and the Ox
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: Then the Princess began her tale.
        - id: ch02-b02
          speaker: princess
          text: >-
            I know your farmyard can't be as fine as ours. If two shepherds stand at opposite ends and blow their ram's horns, neither one can hear the other.
        - id: ch02-b03
          speaker: boots
          text: >-
            Oh, can't it? Our yard is much bigger. A cow can start across when her calf is on the way, and she still won't reach the other end before the calf is born.
        - id: ch02-b04
          speaker: princess
          text: >-
            I'm sure that's so. But look at our ox over there. You have none as large as him. Two men can sit on his horns and still be too far apart to touch, even with a twenty-foot ruler.
        - id: ch02-b05
          speaker: boots
          text: >-
            Is that all? Our ox is so huge that two men can sit on his horns, each blowing a great mountain trumpet, and neither can hear the other.
        - id: ch02-b06
          speaker: princess
          text: >-
            I'm sure that's so too. But you certainly don't have as much milk as we do. We fill great pails, carry them inside, and pour them into great tubs. That's how we make our enormous cheeses.
    - id: ch03
      title: The Cheese and the Mare
      blocks:
        - id: ch03-b01
          speaker: boots
          text: >-
            Oh, is that how you do it? We milk our cows straight into great tubs. Then we load the tubs onto carts, drive them inside, and empty them into huge brewing vats. Our cheeses come out as big as houses.
        - id: ch03-b02
          speaker: boots
          text: >-
            We once had a dun-colored mare who trampled the cheese firm while we made it. One day she fell right in, and we lost her. We ate from that cheese for seven years. Then, deep inside it, we found a great dun mare alive and kicking.
        - id: ch03-b03
          speaker: boots
          text: >-
            Later, I was driving that mare to the mill when her backbone snapped in two. That didn't trouble me. I took a young spruce tree and put it in her for a new backbone. She kept that backbone for as long as we had her.
        - id: ch03-b04
          speaker: boots
          text: >-
            But the spruce grew into such a tall tree that I climbed it all the way to heaven. Up there, I saw the Virgin Mary spinning sea foam into ropes made of pig bristles.
        - id: ch03-b05
          speaker: boots
          text: >-
            Just then, the spruce snapped, and I had no way down. So the Virgin Mary lowered me on one of those ropes. I slid straight into a fox's hole. And who was sitting there, mending shoes? My mother and your father.
        - id: ch03-b06
          speaker: boots
          text: >-
            The moment I arrived, my mother boxed your father's ear so hard that his whiskers curled.
    - id: ch04
      title: That's a Story
      blocks:
        - id: ch04-b01
          speaker: princess
          text: >-
            That's a story! My father never did such a thing in all his life!
        - id: ch04-b02
          speaker: narrator
          text: >-
            And so Boots won the Princess for his wife, along with half the kingdom.
