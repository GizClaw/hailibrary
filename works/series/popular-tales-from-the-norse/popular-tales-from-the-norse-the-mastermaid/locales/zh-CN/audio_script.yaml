audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 从容而清醒，带一点克制的诙谐
        timbre: 温厚清晰
        pace: 舒缓有致
        pitch: 中低
    prince:
      display_name: 小王子
      tts:
        delivery: 年轻爽朗，机灵中带着几分自信
        timbre: 清亮温暖
        pace: 中等偏快
        pitch: 中等
    giant:
      display_name: 巨人
      tts:
        delivery: 粗暴威严，发怒时像低沉的咆哮
        timbre: 粗厚浑沉
        pace: 中等偏慢
        pitch: 低
    mastermaid:
      display_name: 能干姑娘
      tts:
        delivery: 聪慧坚定，危急时沉着利落
        timbre: 清澈柔韧
        pace: 中等
        pitch: 中高
    fire_man:
      display_name: 火光人
      tts:
        delivery: 简短直接，带着幽暗的威势
        timbre: 干燥沙哑
        pace: 中等偏慢
        pitch: 低
    blood_drop_1:
      display_name: 第一滴血
      tts:
        delivery: 微弱而清楚，像远处传来的回声
        timbre: 轻细空灵
        pace: 缓慢
        pitch: 高
    blood_drop_2:
      display_name: 第二滴血
      tts:
        delivery: 微弱而清楚，像远处传来的回声
        timbre: 轻细空灵
        pace: 缓慢
        pitch: 高
    blood_drop_3:
      display_name: 第三滴血
      tts:
        delivery: 微弱而清楚，像远处传来的回声
        timbre: 轻细空灵
        pace: 缓慢
        pitch: 高
    bride_sister:
      display_name: 新娘的妹妹
      tts:
        delivery: 表面亲切，话里暗藏诱导
        timbre: 甜润轻柔
        pace: 中等
        pitch: 中高
    officer:
      display_name: 警官
      tts:
        delivery: 殷勤自负，受苦时狼狈急切
        timbre: 厚实明亮
        pace: 中等
        pitch: 中低
    lawyer:
      display_name: 律师
      tts:
        delivery: 讲究体面，热切中带着夸张
        timbre: 清晰圆润
        pace: 中等偏快
        pitch: 中等
    sheriff:
      display_name: 郡长
      tts:
        delivery: 自负豪爽，嗓门洪亮
        timbre: 粗厚饱满
        pace: 中等偏慢
        pitch: 低
    messenger:
      display_name: 信使
      tts:
        delivery: 恭敬利落，吐字清楚
        timbre: 明亮清晰
        pace: 中等
        pitch: 中等
  chapters:
    - id: ch01
      title: 禁止打开的房门
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 从前有位国王，膝下有好几个儿子，究竟有几个，我也说不准。最小的王子怎么也不肯安分待在家里，一心要出去闯荡。国王被他磨了许久，只好放他走。王子赶了几天路，一天夜里来到巨人的家，就留下来替巨人做工。
        - id: ch01-b02
          speaker: narrator
          text: 第二天早晨，巨人要出去放山羊。他吩咐王子把马厩打扫干净，还说做完以后，一整天都不用再干别的活儿。
        - id: ch01-b03
          speaker: giant
          text: 你可要知道，像我这么宽厚的主人不多见。不过，交给你的活儿必须做好。还有，你住的屋子后面那几间房，一间也不许进。你敢进去，我就要你的命。
        - id: ch01-b04
          speaker: prince
          text: 听起来，我找的主人还真够宽厚的。
        - id: ch01-b05
          speaker: narrator
          text: 王子在屋里来回踱步，一边走，一边哼歌。他觉得打扫马厩用不了多久，时间还多得很，晚些动手也不迟。可那几扇不许打开的门就在屋后，越想越让他好奇。巨人这样严厉地拦着，里面一定藏着什么不愿让他看见的东西。
        - id: ch01-b06
          speaker: prince
          text: 我偷偷看一眼，准有意思。他越不让我进去，越说明里面藏着怕人看见的东西。
        - id: ch01-b07
          speaker: narrator
          text: 他推开第一扇门。墙边的钩子上吊着一口锅，锅里不停翻滚，下面却连一点火也没有。王子把一绺头发浸进去，再拿出来时，那绺头发竟像铜铸的一样。
        - id: ch01-b08
          speaker: prince
          text: 好一锅精美的汤！谁要喝上一口，怕是连喉咙都要变得金贵了。
        - id: ch01-b09
          speaker: narrator
          text: 他接着进了第二间房。那里也挂着一口没有火却咕嘟沸腾的锅。
        - id: ch01-b10
          speaker: prince
          text: 这一锅，我也不妨试试看。
        - id: ch01-b11
          speaker: narrator
          text: 他把另一绺头发放进锅里，抽出来一看，头发已经变成了银色。
        - id: ch01-b12
          speaker: prince
          text: 连我父王家也没有这么贵重的汤。不过，汤究竟好不好，还得尝过味道才知道。
        - id: ch01-b13
          speaker: narrator
          text: 王子又走进第三间房。第三口锅也在沸腾。他把一绺头发浸进去，拿出来时，头发已经镀上了金，亮得直闪光。
        - id: ch01-b14
          speaker: prince
          text: 老太婆总说一桩不如一桩，我看分明是一桩胜过一桩。他在这里煮金子，下一间又会煮什么呢？
        - id: ch01-b15
          speaker: narrator
          text: 反正已经看了三间，他索性要看个究竟。第四间房里没有锅，只有一位公主坐在长凳上。王子这一生，从没见过这样美丽的人。
        - id: ch01-b16
          speaker: mastermaid
          text: 老天啊！你跑到这里来做什么？
          emotion: surprised
        - id: ch01-b17
          speaker: prince
          text: 我昨天刚来，在这里做工。
        - id: ch01-b18
          speaker: mastermaid
          text: 做工？但愿老天保佑你，让你还能活着离开。
          emotion: fearful
        - id: ch01-b19
          speaker: prince
          text: 我倒觉得这主人挺宽厚。今天他只让我扫马厩，扫完就没事了。
        - id: ch01-b20
          speaker: mastermaid
          text: 可你准备怎么扫？照平常的办法，你铲出去一叉，里面就会多出十叉。听我的，把草叉倒过来，用叉柄往外抛，粪便自己就会飞出去。
        - id: ch01-b21
          speaker: prince
          text: 原来他打的是这个主意。
        - id: ch01-b22
          speaker: narrator
          text: 那一天，王子一直留在公主身边。两人东一句西一句，很快就亲密起来，认定了彼此，还说好要结为夫妻，一同逃离巨人。王子给巨人做工的第一天，就这样一点也不显得漫长。快到傍晚时，公主才提醒他，得赶在巨人回来以前把活儿做完。
        - id: ch01-b23
          speaker: narrator
          text: 王子到了马厩，先像父王家的仆人那样挥动草叉。还不到一分钟，粪便就多得让他无处落脚。他赶紧把草叉倒过来，改用叉柄。转眼之间，马厩干净得像刚刷洗过。他回到自己的房间，又踱着步，哼起歌来。
        - id: ch01-b24
          speaker: narrator
          text: 不久，巨人赶着山羊回来了。
        - id: ch01-b25
          speaker: giant
          text: 马厩扫干净了吗？
        - id: ch01-b26
          speaker: prince
          text: 扫好了，主人。里里外外都收拾妥当了。
        - id: ch01-b27
          speaker: giant
          text: 我这就去看看。
        - id: ch01-b28
          speaker: narrator
          text: 巨人低声咆哮着，大步走进马厩。里面果然和王子说的一模一样。
        - id: ch01-b29
          speaker: giant
          text: 我一看就知道，你跟我的能干姑娘说过话。凭你自己的脑袋，可想不出这种聪明办法。
        - id: ch01-b30
          speaker: prince
          text: 能干姑娘？主人，那是什么东西？我倒真想见识一下。
        - id: ch01-b31
          speaker: giant
          text: 好吧，好吧。你很快就会见到她。
    - id: ch02
      title: 烈火骏马
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 第二天，巨人又要赶着山羊出门。他让王子把山坡上的马牵回来，说事情办完，一整天便可以歇着。
        - id: ch02-b02
          speaker: giant
          text: 你得记住，我这个主人很宽厚。可是，你若敢走进昨天说的那些房间，我就把你的脑袋拧下来。
        - id: ch02-b03
          speaker: narrator
          text: 巨人赶着羊群走了。
        - id: ch02-b04
          speaker: prince
          text: 你确实宽厚得很。不过，我还是要进去跟能干姑娘说说话。说不定她很快就是我的，不再是你的了。
        - id: ch02-b05
          speaker: narrator
          text: 王子进了公主的房间。公主问他，今天又领了什么差事。
        - id: ch02-b06
          speaker: prince
          text: 没什么吓人的，只要上山把他的马牵回来。
        - id: ch02-b07
          speaker: mastermaid
          text: 那你准备怎么做？
        - id: ch02-b08
          speaker: prince
          text: 骑回一匹马能有多难？比它性子更烈的马，我大概也骑过。
        - id: ch02-b09
          speaker: mastermaid
          text: 可没那么容易。你一走近，它的鼻孔就会像焦油桶一样喷出烈火。把门后那个马嚼子带上。等它迎面冲来，你就扔进它嘴里。这样，它马上会温顺下来，随你摆布。
        - id: ch02-b10
          speaker: narrator
          text: 王子答应照办，可他又在能干姑娘身边待了一整天。两人说来说去，总离不开同一件事。他们要是能逃离巨人，结成夫妻，该有多么幸福。到了傍晚，若不是姑娘提醒，王子早把山坡和马都忘光了。
        - id: ch02-b11
          speaker: narrator
          text: 他取下墙角的马嚼子，跑上山去。没多久，那匹马便张着大嘴冲了过来，鼻孔里烈火滚滚，果然像焦油桶着了火。王子没有慌。他看准马嘴张开的时机，一把将马嚼子迎面扔了进去。马立刻安静下来，温顺得像只羔羊。接下来便容易了。王子骑着它回家，把它安顿在马厩里，又回到自己的房间哼歌去了。
        - id: ch02-b12
          speaker: narrator
          text: 傍晚，巨人赶着山羊回来，第一句话便问起那匹马。
        - id: ch02-b13
          speaker: giant
          text: 你把山坡上的马牵回来了吗？
        - id: ch02-b14
          speaker: prince
          text: 牵回来了，主人。我从没骑过这么好的马。我径直把它骑回来，已经稳稳当当地拴好了。
        - id: ch02-b15
          speaker: giant
          text: 我马上去看。
        - id: ch02-b16
          speaker: narrator
          text: 巨人跑进马厩，那匹马果然站在那里。
        - id: ch02-b17
          speaker: giant
          text: 你准跟我的能干姑娘说过话。靠你自己，绝想不出这样的办法。
        - id: ch02-b18
          speaker: prince
          text: 昨天是能干姑娘，今天还是能干姑娘。哎呀，主人，你为什么不把那东西拿给我看看？这一辈子，哪怕只看上一眼也好啊。
        - id: ch02-b19
          speaker: giant
          text: 哦，你只想看一眼？那你很快就会见到了。
    - id: ch03
      title: 地狱里的火税
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 第三天黎明，巨人又赶着山羊往树林里去。
        - id: ch03-b02
          speaker: giant
          text: 今天，你得去地狱替我取回火税。办完这件事，剩下的一天都归你。你看，我这个主人多么宽厚。
        - id: ch03-b03
          speaker: prince
          text: 真是个宽厚主人！你也许宽厚，派给我的活儿可不轻松。我还是去找能干姑娘吧，她多半知道该怎么办。
        - id: ch03-b04
          speaker: narrator
          text: 王子来到公主房里，把取火税的差事告诉了她。
        - id: ch03-b05
          speaker: mastermaid
          text: 那你准备怎么去取？
        - id: ch03-b06
          speaker: prince
          text: 这就得请你教我了。我从没去过地狱。就算找到路，也不知道该讨多少火税。
        - id: ch03-b07
          speaker: mastermaid
          text: 你到那边山坡下的峭壁去，拿起放在那里的木棒，朝石壁敲一下。会有个浑身冒火光的人出来。你说明来意。他要问取多少，你一定要回答，只取自己背得动的那么多。
        - id: ch03-b08
          speaker: narrator
          text: 王子答应记牢，却又陪了能干姑娘一整天。天色渐渐晚了，姑娘催他赶快动身，否则他怕是能在那里坐到今天。
        - id: ch03-b09
          speaker: narrator
          text: 王子来到峭壁前，拿起木棒，重重敲向石壁。岩石随即裂开，一个满脸火光的人走了出来，眼睛和鼻孔里都迸着火星。
        - id: ch03-b10
          speaker: fire_man
          text: 你来干什么？
        - id: ch03-b11
          speaker: prince
          text: 我替巨人来取火税。
        - id: ch03-b12
          speaker: fire_man
          text: 你要多少？
        - id: ch03-b13
          speaker: prince
          text: 我只要自己背得动的那么多。
        - id: ch03-b14
          speaker: fire_man
          text: 幸好你没说要一匹马驮得动的分量。跟我进来，我把火税交给你。
        - id: ch03-b15
          speaker: narrator
          text: 王子跟他走进岩洞。里面一堆又一堆，全是金银，多得像砂石坑里的石子。王子没有贪多，也没有少拿。他装了满满一包，分量不多不少，恰好是自己能背动的重量。随后，他背着袋子离开岩洞，赶回巨人家。傍晚巨人赶着山羊回来时，王子早已坐在自己的房里，像前几个晚上那样哼起歌来。
        - id: ch03-b16
          speaker: giant
          text: 你去地狱取回我的火税了吗？
          emotion: angry
        - id: ch03-b17
          speaker: prince
          text: 当然去了，主人。
        - id: ch03-b18
          speaker: giant
          text: 东西放在哪里？
        - id: ch03-b19
          speaker: prince
          text: 袋子就在那边的长凳上。
        - id: ch03-b20
          speaker: giant
          text: 我这就看看。
        - id: ch03-b21
          speaker: narrator
          text: 巨人走到长凳前，解开塞得鼓鼓的袋子。金子和银子立刻滚了一地。
        - id: ch03-b22
          speaker: giant
          text: 我看得出来，你跟我的能干姑娘说过话。你要真见过她，我就把你的脑袋拧下来。
        - id: ch03-b23
          speaker: prince
          text: 又是能干姑娘！前天说，昨天说，今天还在说。我只想看看她究竟是什么东西。我可太想见识一下了。
        - id: ch03-b24
          speaker: giant
          text: 好吧，好吧。等到明天，我亲自带你去见她。
        - id: ch03-b25
          speaker: prince
          text: 多谢主人。不过，这准是你在拿我寻开心。
    - id: ch04
      title: 越过大海
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 第二天，巨人果然把王子带到能干姑娘面前。
        - id: ch04-b02
          speaker: giant
          text: 现在，割断他的喉咙，把他放进那口大锅里煮。汤煮好了，再叫醒我。
        - id: ch04-b03
          speaker: narrator
          text: 巨人说完，便躺在长凳上睡着了。他鼾声震天，像雷声在群山之间滚过。
        - id: ch04-b04
          speaker: narrator
          text: 能干姑娘拿起刀，只在王子的小指头上划了一下，让三滴血落到一张三脚凳上。接着，她把破布、鞋底和能找到的垃圾全扔进锅里。她又取出一只箱子，装满碾碎的金子，带上一块盐、一瓶挂在门后的水、一只金苹果和两只金鸡，便和王子飞快逃走。
        - id: ch04-b05
          speaker: narrator
          text: 两人赶到海边，坐上一条船，渡海而去。至于那条船从哪里来，我可从没听人讲过。
        - id: ch04-b06
          speaker: narrator
          text: 巨人沉睡了好一阵，伸了伸身子，眼睛都没睁开。
        - id: ch04-b07
          speaker: giant
          text: 还要多久才煮好？
        - id: ch04-b08
          speaker: blood_drop_1
          text: 才刚刚开始。
        - id: ch04-b09
          speaker: narrator
          text: 巨人把那声音当成能干姑娘的回答，又沉沉睡去。过了很久，他翻了个身，仍旧迷迷糊糊。
        - id: ch04-b10
          speaker: giant
          text: 听见我说话了吗？到底还要多久？
        - id: ch04-b11
          speaker: blood_drop_2
          text: 已经煮好一半了。
        - id: ch04-b12
          speaker: narrator
          text: 巨人又睡着了。几个钟头以后，他舒展着那把老骨头，再次叫喊起来。
        - id: ch04-b13
          speaker: giant
          text: 怎么还没煮好？
        - id: ch04-b14
          speaker: blood_drop_3
          text: 火候刚刚好。
        - id: ch04-b15
          speaker: narrator
          text: 巨人这才起身，揉着眼睛四处寻找。能干姑娘不见踪影，不管他怎样大声呼唤，都没人答应。
        - id: ch04-b16
          speaker: giant
          text: 没什么，她大概只是出去一会儿。
        - id: ch04-b17
          speaker: narrator
          text: 巨人拿起汤匙去尝锅里的汤，尝到的却只有鞋底、破布和一堆乱七八糟的东西。它们全煮烂了，稠的稀的再也分不出来。巨人一看就明白，王子和能干姑娘已经逃走。他顿时气得连哪条腿该站在地上都不知道，拔腿便追，跑得背后风声呼啸。可他追了没多久，便被大海挡住，再也迈不过去。
        - id: ch04-b18
          speaker: giant
          text: 不要紧，这个难不住我。叫我的吸水怪来就是了。
        - id: ch04-b19
          speaker: narrator
          text: 巨人唤来吸水怪。那家伙弯下腰，咕咚、咕咚、咕咚，接连喝了三大口。海水一下降了许多，巨人已经能望见船上的王子和能干姑娘。
        - id: ch04-b20
          speaker: mastermaid
          text: 快，把那块盐扔进海里。
        - id: ch04-b21
          speaker: narrator
          text: 王子将盐抛了出去。盐块立刻长成一座高耸入云的大山，横在海面上。巨人过不去，吸水怪也没法再靠近海水。
        - id: ch04-b22
          speaker: giant
          text: 不要紧！这个我也有办法。
          emotion: angry
        - id: ch04-b23
          speaker: narrator
          text: 他又叫来钻山怪，命令它把这座高山凿穿，好让吸水怪从洞里爬过去，再把海水喝下去。两个怪物忙了起来，眼看刚刚凿出一个洞，吸水怪正凑过去准备下口，能干姑娘便让王子打开带来的瓶子，往海中倒进一两滴水。
        - id: ch04-b24
          speaker: narrator
          text: 转眼间，大海又涨得像原先一样满。吸水怪还没来得及喝上一口，王子和能干姑娘已经登上陆地，终于逃出了巨人的手掌。
    - id: ch05
      title: 苹果带来的遗忘
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 两人商量好，要去王子父亲的宫殿。可王子说什么也不肯让能干姑娘步行。他觉得，让心上人走进宫去，既有失她的身份，也丢自己的体面。
        - id: ch05-b02
          speaker: prince
          text: 你在这里等我十分钟。我回家牵来父王马厩里的七匹马。这里离宫里不远，我很快就回来。无论如何，我不能让你走着去见父王。
        - id: ch05-b03
          speaker: mastermaid
          text: 唉，求你别把我一个人留下。你只要回到宫里，就会把我忘得干干净净。我知道你一定会忘。
          emotion: sad
        - id: ch05-b04
          speaker: prince
          text: 我怎么可能忘记你？我们一起经历了这么多，我又这么爱你。
        - id: ch05-b05
          speaker: narrator
          text: 可王子怎么劝也不肯改变主意，非要回去取马车和七匹马。能干姑娘只好答应，却再三叮嘱他。
        - id: ch05-b06
          speaker: mastermaid
          text: 回到家以后，不要停下来跟任何人问好，直接去马厩套车，马上回来。大家一定会围住你，你只当没看见。最要紧的是，什么也别吃。你一旦吃了东西，我们两个都要遭殃。
        - id: ch05-b07
          speaker: narrator
          text: 王子一件件答应下来，心里却还是认定，自己绝不可能忘了她。
        - id: ch05-b08
          speaker: narrator
          text: 他刚回到宫中，正赶上一个哥哥要办婚宴。新娘和亲朋也才到，众人一下子围住王子，问个不停，还拉他进宫。王子装作没看见，径直进了马厩，牵出马来套车。
        - id: ch05-b09
          speaker: narrator
          text: 大家劝不动，便把婚宴上的好酒好菜全端到外面。王子一口也不肯尝，只顾着赶快套好马。最后，新娘的妹妹把一个苹果滚过院子，正好送到他的脚边。
        - id: ch05-b10
          speaker: bride_sister
          text: 好吧，别的东西你都不吃，那至少咬一口苹果。赶了这么远的路，你一定又饿又渴。
        - id: ch05-b11
          speaker: narrator
          text: 王子低头看见苹果，终于还是把它捡了起来。他只咬了一口。可那一口才刚刚咽下去，能干姑娘就从他的记忆里消失了。他也忘了自己为什么匆匆套车，更忘了海边还有一个人正等着他回去。
        - id: ch05-b12
          speaker: prince
          text: 哎，我准是疯了。我套这辆马车干什么？
        - id: ch05-b13
          speaker: narrator
          text: 他把马送回马厩，跟着众人走进宫殿。没过多久，大家便说定了，他将迎娶这位把苹果滚给他的姑娘。
        - id: ch05-b14
          speaker: narrator
          text: 能干姑娘独自坐在海边，从早等到晚，等了又等，王子始终没有回来。她知道自己的担心已经成真。最后，她只得离开海岸，独自往前走。走过一段路，她来到王宫附近的一片矮树林。林子里孤零零地立着一间小屋，她便进去向屋主求宿。
        - id: ch05-b15
          speaker: narrator
          text: 屋主是个老太婆，脾气乖戾，开口便骂人。起初，她死活不肯收留能干姑娘。姑娘说尽好话，又答应付一大笔租金，她才勉强点头。
        - id: ch05-b16
          speaker: narrator
          text: 小屋又黑又脏，简直像个猪圈。能干姑娘说，得稍微收拾一下，好让她们住的屋子看起来也像别人的家。老太婆连这件事也不乐意，听完便龇牙咧嘴，满脸不高兴。姑娘不理会她的坏脸色，只管动手收拾。
        - id: ch05-b17
          speaker: narrator
          text: 能干姑娘打开随身带来的那箱金子，抓出一两把撒进火里。金子很快熔化，在炉中咕嘟咕嘟地翻滚冒泡。随后，金液漫出壁炉，流向小屋的每一个角落。眨眼之间，这座原本又黑又脏的小屋，里里外外全镀上了金，隔着矮树林也能看见它闪闪发亮。
        - id: ch05-b18
          speaker: narrator
          text: 老太婆一看金子沸腾，吓得像有魔鬼在后面追，拼命往外逃。她冲出门时忘了低头，一头撞上门楣，折断脖子，当场送了命。
    - id: ch06
      title: 三位求婚者
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: 第二天早晨，一位警官从矮树林旁经过。他看见林中有座小屋金光闪闪，几乎不敢相信自己的眼睛。等他走进屋，看见里面坐着的美丽姑娘，更是惊讶得不得了。他立刻爱得神魂颠倒，苦苦求她嫁给自己。
        - id: ch06-b02
          speaker: mastermaid
          text: 可是，你有很多钱吗？
        - id: ch06-b03
          speaker: officer
          text: 钱不用担心，我还是有些家底的。
        - id: ch06-b04
          speaker: narrator
          text: 警官回家取钱。傍晚，他扛来一个足有半蒲式耳大的钱袋，放到长凳上。能干姑娘见他这样有钱，便答应嫁给他。可是，两人才刚上床，她忽然说得再起来一次。
        - id: ch06-b05
          speaker: mastermaid
          text: 我忘记给炉子添火了。
        - id: ch06-b06
          speaker: officer
          text: 求你别下床，我来照料炉火。
        - id: ch06-b07
          speaker: narrator
          text: 警官一跃而起，转眼就站到了炉边。
        - id: ch06-b08
          speaker: mastermaid
          text: 等你拿住火铲，就告诉我一声。
        - id: ch06-b09
          speaker: officer
          text: 好了，我已经拿住了。
        - id: ch06-b10
          speaker: mastermaid
          text: 愿上帝让你握住火铲，也让火铲握住你。愿你不停把滚烫的煤炭铲到自己身上，直到天亮。
        - id: ch06-b11
          speaker: narrator
          text: 警官整夜站在炉旁，一铲接一铲，把火红滚烫的煤炭堆到自己身上。火铲不肯放开他，他也停不下手。无论他怎样哭喊，怎样苦苦哀求，那些煤炭一点也不会变凉，只管落到他身上。
        - id: ch06-b12
          speaker: narrator
          text: 天一亮，他总算能扔掉火铲，一刻也不敢多留，拔腿便逃，像是魔鬼或法警正在后面追赶。一路碰见他的人全瞪大眼睛看他。他疯了似的又蹦又跳，那副惨相，就算被剥了皮再鞣一遍，也不会更糟。人人都想知道他究竟遇上了什么事，他却觉得实在丢脸，死也不肯说自己去过哪里。
        - id: ch06-b13
          speaker: narrator
          text: 又过一天，一位律师路过金屋。他转进去打听屋主是谁，一见能干姑娘，爱得比警官还厉害，当场急急忙忙地向她求婚。
        - id: ch06-b14
          speaker: narrator
          text: 能干姑娘仍问他有没有很多钱。律师说自己颇为富裕，还要拿出证据。他回家一趟，傍晚带来一个鼓鼓囊囊的钱袋。我想，那袋子足有一整蒲式耳大。他把钱放在长凳上，能干姑娘便答应嫁给他。
        - id: ch06-b15
          speaker: narrator
          text: 两人刚上床，能干姑娘说自己忘了关门廊的门，得起身把门关好。
        - id: ch06-b16
          speaker: lawyer
          text: 什么，让你去关门，我却躺在这里？那怎么行。你躺着，我去。
        - id: ch06-b17
          speaker: narrator
          text: 律师一下跳起来，像鼓面上的豌豆似的蹦进门廊。
        - id: ch06-b18
          speaker: mastermaid
          text: 等你握住门闩，就告诉我。
        - id: ch06-b19
          speaker: lawyer
          text: 我已经握住了。
        - id: ch06-b20
          speaker: mastermaid
          text: 那么，愿上帝让你握着门，也让门握住你。愿它把你从这面墙甩到那面墙，一刻不停，直到天亮。
        - id: ch06-b21
          speaker: narrator
          text: 那一夜，律师跳了一场从没跳过的华尔兹，往后他也绝不会想再跳一回。他先把门使劲往前拉，接着门又猛地把他向后拖。他就这样一刻也停不下来，从门廊这边的墙角撞到另一边，又从另一边撞回来，来来回回，几乎被活活撞死。
        - id: ch06-b22
          speaker: narrator
          text: 起初，律师气得破口大骂。撞得实在受不住以后，他又改口哀求，不停地祷告。可那扇门一概不理，只管牢牢抓着他，直到天明才肯松手。他立刻逃走，把整袋钱留作一夜的住宿费，连求婚都忘得干干净净。他一路回头，只怕那扇房门会跳着舞追来。
        - id: ch06-b23
          speaker: narrator
          text: 路上的人都看得目瞪口呆。律师像疯子一样又蹦又跳。就算他整夜跟一群公羊顶脑袋，也不会比这副模样更惨。
        - id: ch06-b24
          speaker: narrator
          text: 第三天，郡长经过矮树林，也看见了那座金屋。他进去打听谁住在里面，刚看清能干姑娘的模样，便开口求婚。
        - id: ch06-b25
          speaker: narrator
          text: 姑娘还是同样回答，有很多钱就嫁，没有便请他趁早离开。郡长说自己很富裕，马上回家取钱。傍晚，他扛来一个比律师那只更大的钱袋，至少有一蒲式耳半，重重放到长凳上。两人很快说定了婚事。
        - id: ch06-b26
          speaker: narrator
          text: 他们才刚上床，能干姑娘便说，自己忘了把草地上的小牛赶进牛棚，必须起来一趟。郡长指天发誓，绝不能让她去。他身材又粗又胖，却像小猫一样轻巧地跳下床。
        - id: ch06-b27
          speaker: mastermaid
          text: 好吧。等你抓住小牛尾巴，只管告诉我。
        - id: ch06-b28
          speaker: sheriff
          text: 现在，我抓住了。
        - id: ch06-b29
          speaker: mastermaid
          text: 愿上帝让你抓着小牛的尾巴，也让小牛的尾巴抓住你。愿你们一起周游世界，直到天亮。
        - id: ch06-b30
          speaker: narrator
          text: 这下，你大概能想到郡长得把双腿张得多开。小牛拖着他冲上高地，又奔下低洼，一路翻山越谷。郡长骂得越凶，小牛便跑得越快，跳得越高。
        - id: ch06-b31
          speaker: narrator
          text: 天亮时，可怜的郡长已经精疲力尽，几乎连气都喘不上来。牛尾巴一松开，他高兴得什么也顾不得了，连那只大钱袋和其他东西都抛在脑后。他毕竟是个大人物，回去时走得比律师和警官慢一些，路人便有更多时间站在路旁盯着他看。
        - id: ch06-b32
          speaker: narrator
          text: 我得说，大家把这时间用得很充分。郡长跟小牛跳过那场舞以后，衣裳已经撕得稀烂，模样实在吓人。
    - id: ch07
      title: 金苹果唤回记忆
      blocks:
        - id: ch07-b01
          speaker: narrator
          text: 第二天就是宫里定好的婚期。大王子要和自己的新娘坐车去教堂，给巨人做过工的小王子，也要和新娘的妹妹一同前往。众人刚上马车，一根挽具栓突然断了。
        - id: ch07-b02
          speaker: narrator
          text: 他们接连做了至少三根新的，不论换什么木料，一装上就断。时间一点点过去，谁也去不了教堂，众人全都垂头丧气。受邀参加婚礼的警官忽然想起，矮树林里住着一位姑娘。
        - id: ch07-b03
          speaker: officer
          text: 去向她借那把添炉火的火铲柄吧。我敢说，那东西一定经得住。
        - id: ch07-b04
          speaker: narrator
          text: 众人立刻派出一名信使，请他客客气气地向姑娘问好，再借来警官所说的火铲。
        - id: ch07-b05
          speaker: messenger
          text: 姑娘，宫里托我向您致意，想借您的火铲柄一用。
        - id: ch07-b06
          speaker: mastermaid
          text: 可以，拿去吧。
        - id: ch07-b07
          speaker: narrator
          text: 于是，他们有了一根怎么也不会断的挽具栓。可马车才要动，底板又忽然散了。众人只好重做底板，不管钉上多少钉子，也不管换什么木料，每次刚装好，车一动，底板便啪地裂成两半。
        - id: ch07-b08
          speaker: narrator
          text: 这回，大家比先前更加狼狈。律师也在婚礼上，他便说起矮树林中的姑娘。
        - id: ch07-b09
          speaker: lawyer
          text: 去借她门廊那扇门的一半。我知道，那块门板一定能牢牢撑住。
        - id: ch07-b10
          speaker: narrator
          text: 众人再次派人去请求，很快借来了半扇镀金的门。马车底板总算结实了，谁知这次却轮到马匹拉不动车。
        - id: ch07-b11
          speaker: narrator
          text: 车前明明已经套着六匹马，他们又加到八匹、十匹，最后足足十二匹。可套上的马越多，车夫抽得越狠，那辆马车反倒越是一寸不动。时间不停过去，天色已经很晚。宫里上上下下都愁眉苦脸，因为婚礼定在今天，他们非去教堂不可，眼下却像永远也到不了那里。
        - id: ch07-b12
          speaker: narrator
          text: 最后，郡长也说起金屋里的姑娘。
        - id: ch07-b13
          speaker: sheriff
          text: 只要借来她的小牛，我知道它准能拉动马车，哪怕车子重得像一座山。
        - id: ch07-b14
          speaker: narrator
          text: 大家听了都觉得，坐着一头小牛拉的车去教堂，实在荒唐可笑。可是，除了这个办法，他们已经什么也做不了。于是，信使第三次前往金屋。这一回，他以国王的名义客客气气地问候能干姑娘，请求借用郡长说的那头小牛。姑娘根本没打算拒绝。
        - id: ch07-b15
          speaker: mastermaid
          text: 可以，把它牵去吧。
        - id: ch07-b16
          speaker: narrator
          text: 众人把小牛套在群马前面，等着看它有没有本事。马车猛地冲了出去，翻过高地，跌进低洼，又越过树桩和石块。车里的人颠得几乎喘不过气，一会儿落到地上，一会儿飞到半空。
        - id: ch07-b17
          speaker: narrator
          text: 好不容易到了教堂，小牛却还不停下。它像一只飞转的纺锤，拉着马车绕教堂一圈又一圈地狂奔。车上的人费了好大力气，才一个个爬下马车，走进教堂。回宫时还是同样的路，只是小牛跑得比先前更快。大家几乎还没意识到已经出发，马车就停在了宫门口。
        - id: ch07-b18
          speaker: narrator
          text: 众人坐下吃饭以后，小王子说，应该把借给他们火铲柄、门板和小牛的姑娘请进宫来。
        - id: ch07-b19
          speaker: prince
          text: 要不是她借来这三样东西，我们现在还困在这里呢。
        - id: ch07-b20
          speaker: narrator
          text: 国王也觉得这样才公平，便派出五名最得力的侍从，请他们替自己问候那位姑娘，邀她进宫赴宴。
        - id: ch07-b21
          speaker: messenger
          text: 姑娘，国王向您致意，请您赏光进宫用餐。
        - id: ch07-b22
          speaker: mastermaid
          text: 也代我向国王致意。请告诉他，他若尊贵得不能来见我，我也同样尊贵，不能去见他。
        - id: ch07-b23
          speaker: narrator
          text: 国王只好亲自来到金屋。这样一来，能干姑娘什么也没多说，便跟他进了宫。国王觉得，她绝不像表面看起来那么简单，于是把她安排在最尊贵的席位，就坐在小王子身旁。
        - id: ch07-b24
          speaker: narrator
          text: 大家在桌边坐了一会儿，能干姑娘取出从巨人那里带来的金苹果、金公鸡和金母鸡，摆在自己面前。两只金鸡立刻互相啄打起来，争抢那只金苹果。
        - id: ch07-b25
          speaker: prince
          text: 哦，快看！它们为了那只苹果，争得多厉害。
          emotion: surprised
        - id: ch07-b26
          speaker: mastermaid
          text: 是啊。当初我们在山坡上一同生活时，也这样拼尽力气，终于挣脱出来，逃走了。
        - id: ch07-b27
          speaker: narrator
          text: 这句话一出口，苹果带来的魔法立刻破了。王子望着身边的姑娘，终于认出她就是自己曾经深爱、又留在海边的人。那些一起经历过的事也全回到了记忆里。你可以想见，他此刻有多么欢喜。
        - id: ch07-b28
          speaker: narrator
          text: 至于那个把苹果滚给王子的女巫，王子命人把她拴在二十四匹马中间，撕得粉碎，连一小块也没有留下。
        - id: ch07-b29
          speaker: narrator
          text: 随后，王子和能干姑娘才真正热热闹闹地办起婚礼。警官、律师和郡长也都留在宴席上。他们虽然还浑身僵痛，脚底发酸，却照样和兴致最高的人一起尽情庆贺。
