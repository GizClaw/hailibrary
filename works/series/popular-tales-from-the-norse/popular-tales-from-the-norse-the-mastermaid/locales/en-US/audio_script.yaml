  chapters:
    - id: ch01
      title: The Giant's Three Tasks
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            Once there was a king with several sons. How many, I cannot say. But the youngest could find no peace at home. He wanted nothing so much as to go out into the world and try his luck. At last, his father gave him leave to go.
        - id: ch01-b02
          speaker: narrator
          text: >-
            After traveling for several days, the Prince came one night to a Giant's house. The Giant hired him as a servant. The next morning, as the Giant went out to herd his goats, he gave the Prince his first task.
        - id: ch01-b03
          speaker: giant
          text: >-
            Clean out the stable. Once that is done, you may rest for the day. You see, you have found yourself an easy master. But whatever I set you, you must do well. And stay out of every room beyond the one where you slept. If you enter any of them, I'll take your life.
        - id: ch01-b04
          speaker: prince
          text: >-
            An easy master, indeed. There is plenty of time to clean one stable.
        - id: ch01-b05
          speaker: narrator
          text: >-
            He paced the room, singing to himself. Still, he could not stop thinking about those forbidden doors.
        - id: ch01-b06
          speaker: prince
          text: >-
            It would be fine fun to take one little look. He must be hiding something he does not want me to see.
        - id: ch01-b07
          speaker: narrator
          text: >-
            In the first room, a pot hung from a hook and boiled without any fire beneath it. The Prince wondered what was inside. He dipped in a lock of his hair, and the hair came out looking like copper.
        - id: ch01-b08
          speaker: prince
          text: >-
            What a delicate broth! A taste of that must make a man's throat look grand inside.
        - id: ch01-b09
          speaker: narrator
          text: >-
            In the second room, another pot bubbled over no fire at all. He tried it with another lock of hair, and this one came out silver.
        - id: ch01-b10
          speaker: prince
          text: >-
            We never had broth this rich at my father's house. Though I suppose the taste is what matters.
        - id: ch01-b11
          speaker: narrator
          text: >-
            A third pot hung boiling in the next room. When he dipped in another lock, it came out golden, and the light gleamed from it.
        - id: ch01-b12
          speaker: prince
          text: >-
            An old wife might say, "Worse and worse," but I say, "Better and better." If he boils gold here, what can he be boiling beyond that door?
        - id: ch01-b13
          speaker: narrator
          text: >-
            He opened the fourth door. There was no pot inside. A Princess sat on a bench, and she was lovelier than anyone he had ever seen.
        - id: ch01-b14
          speaker: mastermaid
          text: >-
            In Heaven's name, what are you doing here?
          emotion: fearful
        - id: ch01-b15
          speaker: prince
          text: >-
            I came yesterday. The Giant hired me.
        - id: ch01-b16
          speaker: mastermaid
          text: >-
            Hired you? Then Heaven help you escape.
        - id: ch01-b17
          speaker: prince
          text: >-
            I think the work is easy enough. I only have to clean the stable, and then my day is done.
        - id: ch01-b18
          speaker: mastermaid
          text: >-
            And how will you clean it? If you work as other people do, ten forkfuls will fall in for every one you throw out. Turn the pitchfork upside down. Work with the handle, and all the dung will fly out by itself.
        - id: ch01-b19
          speaker: prince
          text: >-
            That sounds exactly like something he would arrange.
        - id: ch01-b20
          speaker: narrator
          text: >-
            The two spent the day together. They soon became dear friends and decided they would marry. So that first day passed quickly. Near evening, the Mastermaid reminded him to finish his work before the Giant returned.
        - id: ch01-b21
          speaker: narrator
          text: >-
            At the stable, the Prince first tried working as the grooms did at his father's palace. Before a minute had passed, so much dung had fallen in that there was scarcely room for him to stand. Then he turned the fork over and tossed with the handle. In a moment, the stable was as clean as if it had been scoured.
        - id: ch01-b22
          speaker: narrator
          text: >-
            He went back to his own room and began to sing. Soon the Giant came home with his goats.
        - id: ch01-b23
          speaker: giant
          text: Have you cleaned the stable?
        - id: ch01-b24
          speaker: prince
          text: Yes, master. Everything is neat and right.
        - id: ch01-b25
          speaker: giant
          text: I will see that for myself.
        - id: ch01-b26
          speaker: narrator
          text: >-
            The Giant strode to the stable and found it just as the Prince had said.
        - id: ch01-b27
          speaker: giant
          text: >-
            You have been talking to my Mastermaid. You never found that knowledge in your own head.
        - id: ch01-b28
          speaker: prince
          text: >-
            Mastermaid? What sort of creature is that, master? I would be very glad to see one.
        - id: ch01-b29
          speaker: giant
          text: Never mind. You will see her soon enough.
        - id: ch01-b30
          speaker: narrator
          text: >-
            The next morning, before leaving with the goats, the Giant told the Prince to bring home his horse from the hillside. After that, he said, the Prince could rest.
        - id: ch01-b31
          speaker: giant
          text: >-
            Remember, you have an easy master. But enter those forbidden rooms, and I'll wring your head off.
        - id: ch01-b32
          speaker: prince
          text: >-
            Easy indeed! Even so, I am going to visit your Mastermaid. Perhaps she will belong to me before long, instead of you.
        - id: ch01-b33
          speaker: narrator
          text: >-
            He went straight to her, and she asked what work the Giant had given him that day.
        - id: ch01-b34
          speaker: prince
          text: >-
            Nothing frightening. I only need to fetch his horse from the hillside.
        - id: ch01-b35
          speaker: mastermaid
          text: How do you mean to bring it home?
        - id: ch01-b36
          speaker: prince
          text: >-
            There is no great trick to riding a horse. I have ridden wilder ones before.
        - id: ch01-b37
          speaker: mastermaid
          text: >-
            This horse will not be so easy. When you come near, fire and flame will pour from its nostrils like a burning tar barrel. Take the bit hanging behind that door. When the horse rushes at you, throw it straight into its jaws. Then it will become so tame that you can do whatever you please with it.
        - id: ch01-b38
          speaker: narrator
          text: >-
            The Prince promised to remember. Then he stayed with the Mastermaid all day, talking about one thing after another. Again and again, they came back to how happy they could be together, far away from the Giant.
        - id: ch01-b39
          speaker: narrator
          text: >-
            He would have forgotten the horse completely if she had not warned him that evening was near. He took the bit and ran up the hill. Soon the horse charged toward him with fire streaming from its nostrils. The Prince waited until its jaws opened, then threw the bit into its mouth. At once, it stood as quiet as a lamb.
        - id: ch01-b40
          speaker: narrator
          text: >-
            He rode it home, put it safely in the stable, and returned to his room to sing. At evening, the Giant came back.
        - id: ch01-b41
          speaker: giant
          text: Did you bring my horse down from the hill?
        - id: ch01-b42
          speaker: prince
          text: >-
            I did, master. I have never ridden a better horse. I brought him straight home and put him safely away.
        - id: ch01-b43
          speaker: giant
          text: I will soon find out whether that is true.
        - id: ch01-b44
          speaker: narrator
          text: >-
            He ran to the stable, and there stood the horse.
        - id: ch01-b45
          speaker: giant
          text: >-
            You have spoken to my Mastermaid. You could not have thought of this alone.
        - id: ch01-b46
          speaker: prince
          text: >-
            Yesterday it was this Mastermaid, and today it is the same tale. Why not show me the thing? I should like to see it once in my life.
        - id: ch01-b47
          speaker: giant
          text: If that is all you want, you will see her soon enough.
        - id: ch01-b48
          speaker: narrator
          text: >-
            At dawn on the third day, the Giant prepared to leave with his goats once more.
        - id: ch01-b49
          speaker: giant
          text: >-
            Today you must go to Hell and collect my fire-tax. When that is done, you may rest all day. You know what an easy master you have.
        - id: ch01-b50
          speaker: prince
          text: >-
            Easy master! You may call yourself easy, but the tasks are hard enough. I had better ask your Mastermaid what to do.
        - id: ch01-b51
          speaker: narrator
          text: >-
            He went to her and told her he had been ordered to fetch the fire-tax.
        - id: ch01-b52
          speaker: mastermaid
          text: How will you manage that?
        - id: ch01-b53
          speaker: prince
          text: >-
            You must tell me. I have never been to Hell. Even if I knew the road, I would not know how much tax to ask for.
        - id: ch01-b54
          speaker: mastermaid
          text: >-
            Go to the steep rock beneath the hillside. Pick up the club lying there and strike the face of the rock. Someone shining with fire will come out. Tell him why you have come. When he asks how much you want, say, "As much as I can carry."
        - id: ch01-b55
          speaker: narrator
          text: >-
            The Prince promised to say exactly that. Again he stayed with her until evening, and again she had to send him off before the Giant returned. At the steep rock, he lifted the club and struck a mighty blow. The rock opened. Out came someone with a shining face and sparks flying from his eyes and nostrils.
        - id: ch01-b56
          speaker: fire_keeper
          text: What do you want?
        - id: ch01-b57
          speaker: prince
          text: The Giant sent me to collect his fire-tax.
        - id: ch01-b58
          speaker: fire_keeper
          text: How much will you take?
        - id: ch01-b59
          speaker: prince
          text: I want no more than I can carry.
        - id: ch01-b60
          speaker: fire_keeper
          text: >-
            You are lucky you did not ask for a whole horse-load. Come inside the rock, and you shall have your tax.
        - id: ch01-b61
          speaker: narrator
          text: >-
            Inside lay heaps of gold and silver, piled like stones in a gravel pit. The Prince received the largest load he could carry and took it home. When the Giant returned that evening, the Prince was singing in his room as before.
        - id: ch01-b62
          speaker: giant
          text: Did you go to Hell for my fire-tax?
        - id: ch01-b63
          speaker: prince
          text: Yes, master, I did.
        - id: ch01-b64
          speaker: giant
          text: Where did you put it?
        - id: ch01-b65
          speaker: prince
          text: The sack is standing on that bench.
        - id: ch01-b66
          speaker: narrator
          text: >-
            The Giant untied the sack. It was packed so tightly that gold and silver spilled onto the floor.
        - id: ch01-b67
          speaker: giant
          text: >-
            I can see that you have talked to my Mastermaid. If you have, I will wring your head off.
          emotion: angry
        - id: ch01-b68
          speaker: prince
          text: >-
            Mastermaid again! You have spoken of her for three days now. I only wish I knew what sort of thing she was.
        - id: ch01-b69
          speaker: giant
          text: Wait until tomorrow. I will take you to her myself.
        - id: ch01-b70
          speaker: prince
          text: Thank you kindly, master. Though I expect you are only joking.
    - id: ch02
      title: Escape from the Giant
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            The next day, the Giant led the Prince into the Mastermaid's room.
        - id: ch02-b02
          speaker: giant
          text: >-
            Cut his throat and boil him in the great pot you know. Call me when the broth is ready.
        - id: ch02-b03
          speaker: narrator
          text: >-
            Then the Giant lay down on a bench and fell asleep. His snores sounded like thunder rolling over the hills.
        - id: ch02-b04
          speaker: narrator
          text: >-
            The Mastermaid nicked the Prince's little finger with a knife and let three drops of blood fall onto a three-legged stool. She filled the pot with old rags, worn shoe soles, and every bit of rubbish she could gather.
        - id: ch02-b05
          speaker: narrator
          text: >-
            Next, she packed a chest with ground gold. From behind the door, she took a lump of salt and a flask of water. She also carried off a golden apple and two golden chickens. Then she and the Prince fled from the Giant's house as fast as they could.
        - id: ch02-b06
          speaker: narrator
          text: >-
            Before long they reached the sea and sailed across it. Where they found their ship, I have never heard.
        - id: ch02-b07
          speaker: narrator
          text: >-
            After the Giant had slept for some time, he stretched on the bench and called toward the pot.
        - id: ch02-b08
          speaker: giant
          text: Will it be ready soon?
        - id: ch02-b09
          speaker: first_blood_drop
          text: It has only just begun.
        - id: ch02-b10
          speaker: narrator
          text: >-
            Believing he had heard the Mastermaid, the Giant went back to sleep. A long while later, he stirred again. He was still too drowsy to look up.
        - id: ch02-b11
          speaker: giant
          text: Did you hear me? Will it be ready soon?
        - id: ch02-b12
          speaker: second_blood_drop
          text: It is half done.
        - id: ch02-b13
          speaker: narrator
          text: >-
            The Giant rolled onto his other side and slept for many more hours. At last, his old bones began to move and stretch.
        - id: ch02-b14
          speaker: giant
          text: Is it still not done?
        - id: ch02-b15
          speaker: third_blood_drop
          text: It is cooked to a turn.
        - id: ch02-b16
          speaker: narrator
          text: >-
            The Giant rose and rubbed his eyes. He could not see who had answered him. He searched for the Mastermaid and called her name, but no one replied.
        - id: ch02-b17
          speaker: giant
          text: She must have stepped outside for a moment.
        - id: ch02-b18
          speaker: narrator
          text: >-
            He took a spoon to taste the broth. Instead of the Prince, he found boiled rags, shoe soles, and rubbish, all mixed so thoroughly that he could not tell the thick from the thin. Then he understood what had happened. He grew so furious he hardly knew which foot to stand on.
        - id: ch02-b19
          speaker: narrator
          text: >-
            He raced after the Prince and the Mastermaid until the wind whistled behind him. But when he reached the water, he could go no farther.
        - id: ch02-b20
          speaker: giant
          text: >-
            Never mind. I know how to cure this. I only need to call my stream-sucker.
        - id: ch02-b21
          speaker: narrator
          text: >-
            The stream-sucker came, bent down, and swallowed the water in three great gulps. The sea fell so low that the Giant could see the Prince and the Mastermaid sailing away.
        - id: ch02-b22
          speaker: mastermaid
          text: Throw the lump of salt overboard now.
        - id: ch02-b23
          speaker: narrator
          text: >-
            The Prince cast it into the sea. At once, it rose into a mountain so high that it blocked the Giant's path. Even the stream-sucker could do nothing more.
        - id: ch02-b24
          speaker: giant
          text: Never mind! There is a cure for this as well.
        - id: ch02-b25
          speaker: narrator
          text: >-
            He called his hill-borer to cut a tunnel through the mountain. The hill-borer made a hole, and the stream-sucker crept through, ready to drink again.
        - id: ch02-b26
          speaker: mastermaid
          text: Pour one or two drops from the flask into the sea.
        - id: ch02-b27
          speaker: narrator
          text: >-
            The Prince did so, and the sea filled to its old level. Before the stream-sucker could swallow another mouthful, the ship reached land. The Prince and the Mastermaid were safe from the Giant.
    - id: ch03
      title: The Forgotten Mastermaid
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            They decided to go to the palace of the Prince's father. But the Prince thought it would be unseemly for his sweetheart to walk there, and unseemly for him to let her.
        - id: ch03-b02
          speaker: prince
          text: >-
            Wait here for ten minutes while I fetch the coach and the seven horses from my father's stable. The palace is close, and I will soon return. I cannot let my sweetheart walk there.
        - id: ch03-b03
          speaker: mastermaid
          text: >-
            Please do not leave me. Once you enter the palace, you will forget me completely. I know you will.
          emotion: fearful
        - id: ch03-b04
          speaker: prince
          text: >-
            How could I forget you? We have been through so much together, and I love you dearly.
        - id: ch03-b05
          speaker: narrator
          text: >-
            Nothing could change his mind. He was determined to bring the coach and seven horses, while she waited beside the sea. At last, the Mastermaid had to let him go. But first, she warned him carefully.
        - id: ch03-b06
          speaker: mastermaid
          text: >-
            When you reach home, do not stop even to greet anyone. Go straight to the stable, harness the horses, and drive back as quickly as you can. Everyone will crowd around you, but act as though you cannot see them. Above all, do not taste one bite of food. If you do, grief will come to us both.
        - id: ch03-b07
          speaker: narrator
          text: >-
            The Prince promised everything. In his heart, he thought there was no danger at all that he could forget her.
        - id: ch03-b08
          speaker: narrator
          text: >-
            Just then, one of his brothers was preparing for his wedding feast. The bride and all her family had arrived at the palace. They surrounded the Prince as soon as he came home, asking question after question and urging him to enter. He behaved as if he saw no one. He went straight to the stable, brought out the horses, and began to harness them.
        - id: ch03-b09
          speaker: narrator
          text: >-
            When they could not persuade him to come inside, they carried food and drink into the yard. They offered him the finest dishes prepared for the feast. He would not touch a crumb. He kept working as fast as he could.
        - id: ch03-b10
          speaker: narrator
          text: >-
            At last, the bride's sister rolled an apple across the yard toward him.
        - id: ch03-b11
          speaker: brides_sister
          text: >-
            If you refuse everything else, surely you can take one bite of this. After such a long journey, you must be hungry and thirsty.
        - id: ch03-b12
          speaker: narrator
          text: >-
            The Prince picked up the apple and bit into it. That very moment, he forgot the Mastermaid. He forgot that he was supposed to drive back for her.
        - id: ch03-b13
          speaker: prince
          text: >-
            I must have lost my senses. Why am I standing here with a coach and horses?
          emotion: surprised
        - id: ch03-b14
          speaker: narrator
          text: >-
            He returned the horses to their stalls and went into the palace with the others. Before long, it was agreed that he would marry the bride's sister, the same woman who had rolled him the apple.
        - id: ch03-b15
          speaker: narrator
          text: >-
            Meanwhile, the Mastermaid sat by the shore. She waited and waited, but the Prince did not return. At last, she walked inland. Near the king's palace, she found a little hut standing alone in a thicket.
        - id: ch03-b16
          speaker: narrator
          text: >-
            An old woman owned the hut, and she was as ill-tempered and sharp-tongued as anyone could be. At first, she refused to give the Mastermaid a room. Gentle words and a high rent finally changed her answer.
        - id: ch03-b17
          speaker: narrator
          text: >-
            The hut was as dark and dirty as a pigsty. The Mastermaid said she would brighten it so that it looked like other homes inside. The old woman bared her teeth and grumbled, but the Mastermaid paid no attention.
        - id: ch03-b18
          speaker: narrator
          text: >-
            She opened her chest of ground gold and tossed several handfuls into the fire. The gold melted, bubbled out of the grate, and spread over the entire hut until it shone inside and out.
        - id: ch03-b19
          speaker: narrator
          text: >-
            When the gold began to boil, the old woman took fright and rushed for the door as though the Evil One were chasing her. She forgot to duck beneath the lintel. Her head struck it so hard that her neck broke, and that was the end of her.
    - id: ch04
      title: Three Bags of Money
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            The next morning, the Constable passed through the thicket. He could scarcely believe his eyes when he saw the golden hut gleaming among the trees. He was more amazed still when he stepped inside and saw the lovely maiden. He fell in love at once and begged her to marry him.
        - id: ch04-b02
          speaker: mastermaid
          text: Do you have much money?
        - id: ch04-b03
          speaker: narrator
          text: >-
            The Constable said he was comfortably off. He went home to fetch his wealth, then returned that evening with a half-bushel sack and placed it on the bench.
        - id: ch04-b04
          speaker: mastermaid
          text: Since you are so rich, I will marry you.
        - id: ch04-b05
          speaker: narrator
          text: >-
            They had hardly gone to bed when the Mastermaid remembered something.
        - id: ch04-b06
          speaker: mastermaid
          text: I must get up. I forgot to make up the fire.
        - id: ch04-b07
          speaker: constable
          text: Stay where you are. I will tend the fire.
        - id: ch04-b08
          speaker: narrator
          text: >-
            He sprang out of bed and hurried to the hearth.
        - id: ch04-b09
          speaker: mastermaid
          text: Tell me as soon as you are holding the shovel.
        - id: ch04-b10
          speaker: constable
          text: I have it in my hands now.
        - id: ch04-b11
          speaker: mastermaid
          text: >-
            Then may God grant that you hold the shovel, and the shovel hold you, while you heap burning coals over yourself until morning.
        - id: ch04-b12
          speaker: narrator
          text: >-
            All night, the Constable stood at the hearth and shoveled hot coals over himself. He begged, prayed, and wept, but the coals grew no cooler. At daybreak, the spell released the shovel. The Constable threw it down and fled as if the Evil One or the bailiff were at his heels.
        - id: ch04-b13
          speaker: narrator
          text: >-
            Everyone he passed stared at him. He leaped and twisted like a madman and looked as though he had been flayed and tanned. They wondered what had happened, but he was too ashamed to tell anyone where he had spent the night.
        - id: ch04-b14
          speaker: narrator
          text: >-
            On the following day, the Attorney saw the golden hut shining in the thicket. He went inside to learn who owned it. The moment he saw the Mastermaid, he fell even more deeply in love than the Constable had and began wooing her in great haste.
        - id: ch04-b15
          speaker: mastermaid
          text: Do you have a good deal of money?
        - id: ch04-b16
          speaker: narrator
          text: >-
            The Attorney assured her that he was not poor. To prove it, he went home for his money. That evening, he came back with a great heavy sack, a whole bushel by the look of it, and set it on the bench.
        - id: ch04-b17
          speaker: narrator
          text: >-
            It was agreed that he would marry her, and they went to bed. Then the Mastermaid suddenly recalled that the porch door was still open.
        - id: ch04-b18
          speaker: mastermaid
          text: I forgot to fasten the porch door. I must get up and shut it for the night.
        - id: ch04-b19
          speaker: attorney
          text: >-
            You cannot do that while I lie here. Stay in bed. I will close it.
        - id: ch04-b20
          speaker: narrator
          text: >-
            He jumped up like a pea bouncing on a drum and rushed into the porch.
        - id: ch04-b21
          speaker: mastermaid
          text: Tell me when you have the door-latch in your hand.
        - id: ch04-b22
          speaker: attorney
          text: I am holding it now.
        - id: ch04-b23
          speaker: mastermaid
          text: >-
            Then may God grant that you hold the door, and the door hold you, while you travel from wall to wall until daybreak.
        - id: ch04-b24
          speaker: narrator
          text: >-
            The Attorney danced all night, though it was no dance he would ever wish to repeat. First he dragged the door forward, then the door flung him back. It dashed him from one corner of the porch to the other until he was nearly battered to death.
        - id: ch04-b25
          speaker: narrator
          text: >-
            At first he cursed and swore. Then he begged and prayed. The door cared only for holding him until dawn. The instant it let go, the Attorney ran. He left his money as payment for the night and forgot all about marriage. To tell the truth, he feared the door might dance after him.
        - id: ch04-b26
          speaker: narrator
          text: >-
            Those who saw him stared with open mouths. He too moved like a madman, and he looked as if he had spent the whole night butting heads with a flock of rams.
        - id: ch04-b27
          speaker: narrator
          text: >-
            On the third day, the Sheriff came that way. He noticed the golden hut, turned aside, and began proposing marriage almost as soon as he saw the Mastermaid.
        - id: ch04-b28
          speaker: mastermaid
          text: >-
            If you have plenty of money, I will marry you. If you do not, you may go about your business.
        - id: ch04-b29
          speaker: narrator
          text: >-
            The Sheriff said he was well supplied. He went home and returned at evening with a sack larger than the Attorney's, at least a bushel and a half. He put it on the bench, and the marriage was soon settled.
        - id: ch04-b30
          speaker: narrator
          text: >-
            They had barely gone to bed when the Mastermaid said she had left the calf in the meadow and must bring it into the stall. The Sheriff swore that she would do no such thing. Though he was stout and heavy, he leaped up as quickly as a kitten.
        - id: ch04-b31
          speaker: mastermaid
          text: Tell me when you have taken hold of the calf's tail.
        - id: ch04-b32
          speaker: sheriff
          text: I have hold of it now.
        - id: ch04-b33
          speaker: mastermaid
          text: >-
            Then may God grant that you hold the calf's tail, and the calf's tail hold you, while the two of you travel around the world until dawn.
        - id: ch04-b34
          speaker: narrator
          text: >-
            The Sheriff had to stretch his legs then. The calf carried him over high ground and low, across hills and through valleys. The more he cursed and swore, the faster it ran and jumped.
        - id: ch04-b35
          speaker: narrator
          text: >-
            By dawn, the Sheriff was nearly out of breath. He was so thankful to release the tail that he forgot his sack of money and everything else. Being a great man, he walked away more slowly than the Constable and Attorney had. That only gave people more time to stare at his torn and tattered clothes, and they made excellent use of it.
    - id: ch05
      title: The Wild Ride to Church
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: >-
            The next day was set for the palace wedding. The eldest brother would ride to church with his bride. The younger Prince, who had served the Giant, would ride with the bride's sister.
        - id: ch05-b02
          speaker: narrator
          text: >-
            They had climbed into the coach and were ready to leave when a trace-pin snapped. The servants made at least three replacements, using every kind of wood they could find. Each new pin broke as well. The hours passed, no one could reach the church, and everyone grew downhearted.
        - id: ch05-b03
          speaker: constable
          text: >-
            A maiden lives in the thicket over there. If she lends you the handle of the shovel she uses for her fire, I know it will hold.
        - id: ch05-b04
          speaker: narrator
          text: >-
            The Constable had been invited to the wedding, so he was there to give this advice. A messenger was sent at once. He politely asked the maiden to lend them her shovel handle. She agreed, and at last they had a trace-pin that would not break.
        - id: ch05-b05
          speaker: narrator
          text: >-
            They were about to start when the bottom of the coach fell apart. They built another as well as they could. They drove in nail after nail and tried one sort of wood after another. Every time they fitted the new bottom and began to move, it split in two. Now they were worse off than before.
        - id: ch05-b06
          speaker: attorney
          text: >-
            A maiden lives in that thicket. If she would lend you one half of her porch door, I am certain it would hold together.
        - id: ch05-b07
          speaker: narrator
          text: >-
            The Attorney was at the wedding too, as you might expect. Another courteous message went to the golden hut, asking to borrow the porch door. The Mastermaid sent it at once. With that door beneath them, the coach held firm.
        - id: ch05-b08
          speaker: narrator
          text: >-
            But now the six horses could not pull it. They harnessed eight horses, then ten, then twelve. The more horses they added and the harder the coachman whipped, the more stubbornly the coach stayed in place. The day was slipping away. Everyone at the palace was miserable. They had to reach the church, but it seemed they never would.
        - id: ch05-b09
          speaker: sheriff
          text: >-
            A maiden lives in the gilded hut over there. If she lends you her calf, I know it can pull this coach, even if the coach is as heavy as a mountain.
        - id: ch05-b10
          speaker: narrator
          text: >-
            They all thought a calf would look ridiculous in front of a wedding coach. Still, there was nothing else to do. For the third time, a messenger went to the hut. In the King's name, he politely asked to borrow the calf. The Mastermaid did not refuse this request either.
        - id: ch05-b11
          speaker: narrator
          text: >-
            They harnessed the calf ahead of all the horses and waited to see what it could do. Away the coach flew, over hills and hollows, stumps and stones. The passengers could scarcely catch their breath. One moment they were on the ground, and the next they were high in the air.
        - id: ch05-b12
          speaker: narrator
          text: >-
            At the church, the calf raced round and round the building like a spinning wheel. The wedding party struggled out of the coach and into the church. The journey home was just the same, only faster. They were back at the palace almost before they knew they had left the church.
    - id: ch06
      title: The Golden Apple
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: >-
            When everyone sat down to dinner, the Prince who had served the Giant spoke to the others.
        - id: ch06-b02
          speaker: prince
          text: >-
            We should invite the maiden who lent us the shovel handle, the porch door, and the calf. Without those three things, we would still be stuck here.
        - id: ch06-b03
          speaker: narrator
          text: >-
            The King agreed that this was fair. He sent five of his finest men to the gilded hut. They carried his greetings and asked the maiden to dine at the palace.
        - id: ch06-b04
          speaker: mastermaid
          text: >-
            Give the King my greetings. Tell him that if he is too grand to come to me, then I am too grand to go to him.
        - id: ch06-b05
          speaker: narrator
          text: >-
            So the King had to visit the hut himself. Then the Mastermaid went with him willingly. He could see that she was more than she appeared, so he gave her the highest seat at the table, beside the youngest bridegroom.
        - id: ch06-b06
          speaker: narrator
          text: >-
            After they had been sitting there for a while, the Mastermaid brought out the golden apple and the golden cock and hen she had taken from the Giant. She set them on the table. At once, the two golden birds began pecking and fighting over the apple.
        - id: ch06-b07
          speaker: prince
          text: Look at them! See how those two are struggling for the apple.
          emotion: surprised
        - id: ch06-b08
          speaker: mastermaid
          text: >-
            Yes. That is how the two of us struggled to escape when we were together beneath the hillside.
        - id: ch06-b09
          speaker: narrator
          text: >-
            At those words, the spell broke. The Prince knew the Mastermaid again, and his joy was as great as you can imagine.
        - id: ch06-b10
          speaker: narrator
          text: >-
            As for the witch who had rolled him the apple, she was torn apart between twenty-four horses until nothing remained of her. Then the true wedding went on in earnest. The Constable, the Attorney, and the Sheriff were still stiff and footsore, but they celebrated as heartily as anyone there.
