  chapters:
    - id: ch01
      title: The Six Princes
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            Once there was a king with seven sons. He loved them so dearly that he could never bear to have all seven away at once. One of them always had to stay beside him.
        - id: ch01-b02
          speaker: narrator
          text: >-
            When the princes were grown, the six eldest were to set out and find brides. The king kept his youngest son, Boots, at home with him. His brothers were supposed to bring a princess back for Boots as well. The king gave the six the finest clothes anyone had ever seen. They were so splendid that the light gleamed from them a long way off. Each prince also received a horse worth many hundreds of dollars. Then the six rode away together.
        - id: ch01-b03
          speaker: narrator
          text: >-
            They traveled to many palaces and met many princesses. At last they reached the palace of a king with six daughters. The brothers had never seen six king's daughters so lovely. Each prince began courting one of them, and each princess became his sweetheart. Then all twelve started for home. But the brothers were head over heels in love. They were thinking so much about their own sweethearts that they completely forgot their promise to bring a bride back for Boots.
        - id: ch01-b04
          speaker: narrator
          text: >-
            Partway home, they passed a steep hillside that rose like a wall. The Giant lived there. He came out, looked straight at them, and turned every prince and every princess to stone.
        - id: ch01-b05
          speaker: narrator
          text: >-
            Back at the palace, the king waited and waited. The longer he waited, the longer his sons stayed away. At last his grief was so great that he said he would never be glad again.
        - id: ch01-b06
          speaker: king
          text: >-
            If I did not still have you, Boots, I would not wish to live. Losing your brothers has filled me with sorrow.
          emotion: sad
        - id: ch01-b07
          speaker: boots
          text: >-
            Father, I've been thinking. Let me go and find them.
        - id: ch01-b08
          speaker: king
          text: >-
            No, no! I will never give you leave. You would stay away too.
          emotion: fearful
        - id: ch01-b09
          speaker: narrator
          text: >-
            But Boots had made up his mind. He begged and pleaded until the king had to let him go. There was only one horse left, an old broken-down jade, because the six princes and their followers had taken all the others. Boots did not care. He sprang onto the sorry old horse.
        - id: ch01-b10
          speaker: boots
          text: >-
            Farewell, Father. Don't worry. I'll come back, and I may well bring all six of my brothers with me.
        - id: ch01-b11
          speaker: narrator
          text: And with that, Boots rode away.
    - id: ch02
      title: Three Friends on the Road
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            After riding for a while, Boots came upon a Raven lying in the road. It was too starved to move aside and could only flap its wings.
        - id: ch02-b02
          speaker: raven
          text: >-
            Dear friend, please give me a little food. When your need is greatest, I will help you in return.
        - id: ch02-b03
          speaker: boots
          text: >-
            I don't have much, and I can't see how you could ever help me. Still, you plainly need it, so I can spare a little.
        - id: ch02-b04
          speaker: narrator
          text: >-
            Boots shared the little food he had brought, giving some of it to the starving Raven. Then he mounted his old horse again and went on down the road.
        - id: ch02-b05
          speaker: narrator
          text: >-
            A little farther on, he reached a brook. There he saw a great Salmon stranded on a dry patch beside the running water. The fish dashed itself about again and again, but it could not get back into the stream by itself.
        - id: ch02-b06
          speaker: salmon
          text: >-
            Dear friend, push me into the stream. When your need is greatest, I will help you in return.
        - id: ch02-b07
          speaker: boots
          text: >-
            I doubt your help will amount to much, but I can't leave you here to choke.
        - id: ch02-b08
          speaker: narrator
          text: He shoved the Salmon into the stream and continued on his way.
        - id: ch02-b09
          speaker: narrator
          text: >-
            Boots traveled a long, long way. Then he met a Wolf so hungry that it could only crawl along the road on its belly.
        - id: ch02-b10
          speaker: wolf
          text: >-
            Dear friend, let me eat your horse. I am so hungry that the wind whistles through my ribs. I have eaten nothing for two whole years.
        - id: ch02-b11
          speaker: boots
          text: >-
            No, that cannot be. First I had to give my food to a Raven. Then I had to push a Salmon back into the water. Now you want my horse! If I give it up, I'll have nothing to ride.
        - id: ch02-b12
          speaker: wolf
          text: >-
            You can help me, dear friend. Ride on my back instead, and when your need is greatest, I will help you.
        - id: ch02-b13
          speaker: boots
          text: >-
            I don't expect much help from you either. But you may have the horse, since your need is so great.
        - id: ch02-b14
          speaker: narrator
          text: >-
            Boots let the Wolf eat his horse. When the Wolf had finished, Boots took the horse's bit and fitted it between the Wolf's jaws. Then he laid the saddle across the Wolf's back and climbed on. With a whole horse inside him, the Wolf had become wonderfully strong. He bounded down the road as if carrying Boots were nothing at all. Never in his life had the prince ridden so fast.
        - id: ch02-b15
          speaker: wolf
          text: >-
            A little farther on, I will show you the Giant's house.
    - id: ch03
      title: Inside the Giant's House
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: Before long, they reached the steep hillside.
        - id: ch03-b02
          speaker: wolf
          text: >-
            Here is the Giant's house. Those are your six brothers, turned to stone, and beside them are their six brides. See that door farther on? You must go through it.
        - id: ch03-b03
          speaker: boots
          text: >-
            No, I don't dare go inside. The Giant will kill me.
          emotion: fearful
        - id: ch03-b04
          speaker: wolf
          text: >-
            He won't. Inside you will find a Princess. She will tell you how to put an end to him. Just be sure you do exactly as she says.
        - id: ch03-b05
          speaker: narrator
          text: >-
            Boots went through the door, though the truth is that he was terribly afraid. For the moment, the Giant was away from home. Boots searched inside and found the Princess sitting in one of the rooms, exactly as the Wolf had promised. He had visited no palaces like his brothers, but he knew at once that he had never set eyes on so lovely a princess.
        - id: ch03-b06
          speaker: princess
          text: >-
            Heaven help you! Where have you come from? This will surely cost you your life. No one can kill the Giant who lives here, because he has no heart in his body.
          emotion: fearful
        - id: ch03-b07
          speaker: boots
          text: >-
            Well, I'm here now, so I may as well try. I mean to free my brothers outside, even though they have been turned to stone. And I will try to save you too.
        - id: ch03-b08
          speaker: princess
          text: >-
            If you are determined to try, then let us see whether we can make a plan. Creep beneath that bed over there. Listen closely to everything the Giant and I say, and please lie as still as a mouse while he is here.
        - id: ch03-b09
          speaker: narrator
          text: Boots had barely hidden himself under the bed when the Giant came home.
        - id: ch03-b10
          speaker: giant
          text: >-
            Ha! I smell Christian blood in this house!
          emotion: angry
        - id: ch03-b11
          speaker: princess
          text: >-
            Yes, I know what you smell. A magpie flew over the house carrying a man's bone, and it let the bone fall down the chimney. I hurried as fast as I could to get it out again. Still, no matter how quickly one works, a smell like that does not vanish at once.
        - id: ch03-b12
          speaker: narrator
          text: >-
            The Giant asked no more. When night came, he and the Princess went to bed. After they had been lying there a while, she spoke.
        - id: ch03-b13
          speaker: princess
          text: >-
            There is something I would dearly like to ask, if only I dared.
        - id: ch03-b14
          speaker: giant
          text: What do you want to ask?
        - id: ch03-b15
          speaker: princess
          text: >-
            Since you don't carry your heart inside you, where do you keep it?
        - id: ch03-b16
          speaker: giant
          text: >-
            That is none of your business. But if you must know, my heart lies under the doorstep.
        - id: ch03-b17
          speaker: boots
          text: >-
            Aha! Then we will soon see if we can find it.
    - id: ch04
      title: The Giant's Secrets
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            The Giant rose cruelly early the next morning and strode off to the wood. He had hardly left the house before Boots came out from hiding. He and the Princess lifted the doorstep, dug beneath it, and searched all around. They dug deeper and hunted longer, but the more they searched, the more certain it became that no heart was hidden there.
        - id: ch04-b02
          speaker: princess
          text: >-
            He has tricked us this time. We will try him once more.
        - id: ch04-b03
          speaker: narrator
          text: >-
            The Princess gathered all the prettiest flowers she could find. She and Boots put the doorstep carefully back in its proper place, and then she scattered the flowers across it. When the day was nearly over and the Giant was due home, Boots crawled beneath the bed again. He had just settled there when the Giant came through the door and began sniffing the air.
        - id: ch04-b04
          speaker: giant
          text: >-
            My eyes and limbs! I smell Christian blood in here!
          emotion: angry
        - id: ch04-b05
          speaker: princess
          text: >-
            I know. A magpie brought a man's bone in its bill and dropped it down the chimney. I got it out as quickly as I could. That must be what you smell.
        - id: ch04-b06
          speaker: narrator
          text: >-
            The Giant said nothing more about the smell. Soon he noticed the flowers around the doorstep and asked who had put them there.
        - id: ch04-b07
          speaker: princess
          text: I did, of course.
        - id: ch04-b08
          speaker: giant
          text: And what is all this supposed to mean?
        - id: ch04-b09
          speaker: princess
          text: >-
            I am so fond of you. Once I knew your heart lay there, I could not help covering the place with flowers.
        - id: ch04-b10
          speaker: giant
          text: >-
            Is that so? Well, my heart does not lie there at all.
        - id: ch04-b11
          speaker: narrator
          text: >-
            That evening, when they had gone to bed, the Princess told the Giant again how much she wanted to know where he kept his heart.
        - id: ch04-b12
          speaker: giant
          text: >-
            If you insist on knowing, it is in the cupboard against the wall.
        - id: ch04-b13
          speaker: narrator
          text: >-
            Under the bed, Boots heard the answer, and he and the Princess thought they would soon put it to the test. Early the next morning, the Giant strode away to the wood. As soon as he was out of sight, they opened the cupboard and began hunting for his heart. They searched every part of it, but the longer they looked, the less hope they had of finding anything.
        - id: ch04-b14
          speaker: princess
          text: We will try him one last time.
        - id: ch04-b15
          speaker: narrator
          text: >-
            She decorated the cupboard with flowers and garlands. Before the Giant returned, Boots slipped under the bed once more. In came the Giant, sniffing.
        - id: ch04-b16
          speaker: giant
          text: >-
            My eyes and limbs! There is Christian blood in this house!
          emotion: angry
        - id: ch04-b17
          speaker: princess
          text: >-
            A little while ago, a magpie flew in with a man's bone and dropped it down the chimney. I hurried to get it out of the house. After all my trouble, its smell must still be here.
        - id: ch04-b18
          speaker: narrator
          text: >-
            The Giant accepted her story and said nothing more about the smell. A little later, however, he noticed that the cupboard against the wall was covered with flowers and garlands. He demanded to know who had decorated it. The Princess answered that, of course, she was the one who had done it.
        - id: ch04-b19
          speaker: giant
          text: What is the meaning of this foolishness?
        - id: ch04-b20
          speaker: princess
          text: >-
            I am so fond of you that I had to decorate the place where your heart lies.
        - id: ch04-b21
          speaker: giant
          text: How could you be silly enough to believe that?
        - id: ch04-b22
          speaker: princess
          text: >-
            How could I help believing it when you were the one who told me?
        - id: ch04-b23
          speaker: giant
          text: >-
            You goose! You will never reach the place where my heart is hidden.
        - id: ch04-b24
          speaker: princess
          text: >-
            Even so, it would make me so happy to know where it truly lies.
        - id: ch04-b25
          speaker: narrator
          text: The poor Giant could hold out no longer.
        - id: ch04-b26
          speaker: giant
          text: >-
            Far, far away, there is a lake. In the lake lies an island, and on the island stands a church. Inside the church is a well. A duck swims in that well. Inside the duck is an egg, and inside that egg lies my heart, my darling!
    - id: ch05
      title: The Island and the Church
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: >-
            At gray dawn the next morning, the Giant strode away to the wood.
        - id: ch05-b02
          speaker: boots
          text: >-
            Now I must leave too, if only I can find the way.
        - id: ch05-b03
          speaker: narrator
          text: >-
            Boots and the Princess said a long, long farewell. Then he stepped outside the Giant's door and found the Wolf standing there, waiting for him. Boots told Graylegs everything that had happened inside the house, including where the Giant had hidden his heart. He wanted to ride to the church and find the well, but he had no idea which way to go.
        - id: ch05-b04
          speaker: wolf
          text: >-
            Jump onto my back. I will soon find the way.
        - id: ch05-b05
          speaker: narrator
          text: >-
            Boots jumped onto the Wolf's back, and away they flew so fast that the wind whistled after them. Over hedges and across fields they raced. They climbed hills, swept down into valleys, and kept traveling for many, many days. At long last, they came to the distant lake that the Giant had described.
        - id: ch05-b06
          speaker: narrator
          text: >-
            The island lay out in the water, and Boots could not see any way to cross the lake. The Wolf told him there was nothing to fear. Boots only had to stay on his back and hold tight. Graylegs jumped straight into the lake, struck out through the water, and carried the prince safely across to the island.
        - id: ch05-b07
          speaker: narrator
          text: >-
            They reached the church, but its keys hung high above them at the very top of the tower. At first Boots had no idea how to bring them down.
        - id: ch05-b08
          speaker: wolf
          text: Call on the Raven.
        - id: ch05-b09
          speaker: narrator
          text: >-
            Boots called, and the Raven came in an instant. It flew to the top of the tower and fetched the keys. Boots unlocked the church and went inside.
        - id: ch05-b10
          speaker: narrator
          text: >-
            Inside the church, Boots found the well. A duck was swimming back and forth across the water, exactly as the Giant had said. Boots stood beside the well and coaxed it for a long time. At last it came close enough for him to grasp it in one hand. But just as he lifted the duck from the water, it dropped the egg. Down the egg fell, all the way to the bottom of the well. Boots was beside himself. After coming so far, how could he ever get it out again?
        - id: ch05-b11
          speaker: wolf
          text: Now you must call on the Salmon.
        - id: ch05-b12
          speaker: narrator
          text: >-
            The prince called to the Salmon. It came and brought the egg up from the bottom of the well.
    - id: ch06
      title: The Heart in the Egg
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: The Wolf told Boots to squeeze the egg. The moment he did, the Giant screamed.
        - id: ch06-b02
          speaker: wolf
          text: Squeeze it again.
        - id: ch06-b03
          speaker: narrator
          text: >-
            Boots squeezed once more. Far away, the Giant screamed even more pitifully than before. He begged and pleaded as sweetly as he could. He promised to do every single thing the prince wished, if only Boots would spare him and not squeeze his heart in two.
        - id: ch06-b04
          speaker: wolf
          text: >-
            Tell him you will spare his life if he restores your six brothers and their brides, the ones he turned to stone.
        - id: ch06-b05
          speaker: narrator
          text: >-
            The Giant agreed at once. He changed the six stone brothers back into living princes, and their brides back into princesses.
        - id: ch06-b06
          speaker: wolf
          text: Now crush the egg in two.
        - id: ch06-b07
          speaker: narrator
          text: >-
            Boots crushed the egg to pieces, and at that very moment the Giant burst.
    - id: ch07
      title: The Seven Sons Return
      blocks:
        - id: ch07-b01
          speaker: narrator
          text: >-
            Once the Giant was gone, Boots rode on the Wolf's back to the house in the hillside. There stood all six of his brothers, alive and merry, with their brides beside them.
        - id: ch07-b02
          speaker: narrator
          text: >-
            Boots went inside the hillside to fetch his own bride. Then the seven couples all set out for the king's palace.
        - id: ch07-b03
          speaker: narrator
          text: >-
            You can imagine the old king's joy when he saw all seven sons come home, each with a bride.
        - id: ch07-b04
          speaker: king
          text: >-
            After all, Boots has brought home the loveliest bride of them all. He shall sit at the head of the table, with her beside him.
          emotion: happy
        - id: ch07-b05
          speaker: narrator
          text: >-
            The king sent out word and called everyone to a great wedding feast. The merriment was both loud and long. And if they have not finished feasting, why, they are still at it.
