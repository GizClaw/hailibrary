audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: thoughtful and gently wry
        timbre: warm and clear
        pace: measured
        pitch: medium
    boots:
      display_name: Boots
      tts:
        delivery: quick-witted and matter-of-fact
        timbre: clear and youthful
        pace: lively
        pitch: medium
    king:
      display_name: King
      tts:
        delivery: loving and dignified, weighted by sorrow
        timbre: mature and resonant
        pace: measured
        pitch: low
    raven:
      display_name: Raven
      tts:
        delivery: pleading but alert
        timbre: dry and bright
        pace: quick
        pitch: medium-high
    salmon:
      display_name: Salmon
      tts:
        delivery: urgent and courteous
        timbre: smooth and clear
        pace: medium
        pitch: medium
    wolf:
      display_name: Graylegs
      tts:
        delivery: shrewd, loyal, and assured
        timbre: rough and deep
        pace: steady
        pitch: low
    princess:
      display_name: Princess
