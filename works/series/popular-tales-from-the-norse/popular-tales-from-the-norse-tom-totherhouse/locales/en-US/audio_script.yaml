audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: thoughtful and gently wry
        timbre: warm and clear
        pace: measured
        pitch: medium
    goody:
      display_name: The Goody
      tts:
        delivery: sharp and quick-changing
        timbre: mature and bright
        pace: brisk
        pitch: medium-high
    husband:
      display_name: The Husband
      tts:
        delivery: easygoing and trusting
        timbre: mellow and sturdy
        pace: unhurried
        pitch: medium-low
    lad:
      display_name: The Lad
      tts:
        delivery: clever and boldly playful
        timbre: youthful and clear
        pace: lively
        pitch: medium
  chapters:
    - id: ch01
      title: The Ten-Dollar Wager
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Once upon a time, there lived a woman whose husband was deaf. He was a good, easygoing man. Perhaps that was why she cared more for the young fellow next door, Tom Totherhouse. The lad who worked for her husband could see plainly that something was going on between them. One day, he challenged the woman.
        - id: ch01-b02
          speaker: lad
          text: Mother, will you wager ten dollars that I can make you reveal your own shame?
        - id: ch01-b03
          speaker: goody
          text: Yes, I will.
        - id: ch01-b04
          speaker: narrator
          text: So they made the wager. One day, the lad and the deaf man were threshing in the barn when the lad saw Tom Totherhouse arrive to visit the Goody. He said nothing. Then, well before dinner, he faced the barn door and shouted.
        - id: ch01-b05
          speaker: lad
          text: Halloa!
        - id: ch01-b06
          speaker: narrator
          text: The husband had paid no attention to what the lad was doing.
        - id: ch01-b07
          speaker: husband
          text: What? Is it time to go home already?
        - id: ch01-b08
          speaker: lad
          text: Yes, we'd better go. Mother's calling us.
        - id: ch01-b09
          speaker: narrator
          text: When they reached the passage, the lad began to cough and clear his throat, giving the Goody a chance to send Tom away. But when the men entered the room, a whole bowl of custards stood on the table.
        - id: ch01-b10
          speaker: husband
          text: Well, well, Mother! Are we having custards today?
          emotion: surprised
        - id: ch01-b11
          speaker: goody
          text: Yes, dear, you are.
        - id: ch01-b12
          speaker: narrator
          text: Yet she looked as sour as unripe fruit and as cross as could be. The men ate and drank every bit of the good food, then went back to work. Once they were gone, the Goody spoke to Tom.
        - id: ch01-b13
          speaker: goody
          text: The devil take that nosy lad! This was all his fault. Hurry away now, and I'll bring you a snack down in the meadow between meals.
          emotion: angry
        - id: ch01-b14
          speaker: narrator
          text: The lad had stayed outside in the passage, listening to every word.
    - id: ch02
      title: A Snack in the Meadow
      blocks:
        - id: ch02-b01
          speaker: lad
          text: Father, I think we should go down to the hollow and mend our fence. The wind has blown it over, and the neighbors' pigs may get in and root up our meadow.
        - id: ch02-b02
          speaker: husband
          text: Aye, aye. Let's go and see to it.
        - id: ch02-b03
          speaker: narrator
          text: The good, easy man always did as he was told. Half the afternoon passed. Then the Goody came sneaking into the meadow with something hidden beneath her apron.
        - id: ch02-b04
          speaker: husband
          text: Well, Mother, this can't be you again! Are we getting a snack between meals too?
          emotion: surprised
        - id: ch02-b05
          speaker: goody
          text: Yes, yes, you are.
        - id: ch02-b06
          speaker: narrator
          text: This time, she looked even more sour and furious than before. But the men made merry. They stuffed themselves with bannocks and butter, and even had a drop of brandy.
        - id: ch02-b07
          speaker: lad
          text: Shall I take a snack over to Tom Totherhouse, Mother? I'll wager he hasn't had a bite between meals.
        - id: ch02-b08
          speaker: goody
          text: Oh, yes, do! There's a good fellow.
        - id: ch02-b09
          speaker: narrator
          text: All at once, the Goody turned as mild as milk. The lad set off. As he walked, he broke a bannock into bits and dropped the crumbs here and there along the way.
    - id: ch03
      title: Tom Takes to His Heels
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: When the lad reached Tom Totherhouse, he gave him a warning.
        - id: ch03-b02
          speaker: lad
          text: You'd better watch yourself. Our old master has found out that you visit the Goody far too often. He won't put up with it anymore. He's sworn to bury his axe in you the moment he sees you.
        - id: ch03-b03
          speaker: narrator
          text: Tom was so frightened that he hardly knew where to turn. The lad left him and went back to his master.
        - id: ch03-b04
          speaker: lad
          text: Something's wrong with Tom's plow. He's asking if you'd kindly take your axe over and see whether you can fix it.
        - id: ch03-b05
          speaker: narrator
          text: The husband picked up his axe and went. Tom Totherhouse had barely caught sight of him when he ran off as fast as his legs could carry him. The husband turned the plow this way and that, examining it from every side. He could find nothing wrong, so he started home. Along the path, he stopped to gather the pieces of bannock the lad had dropped.
    - id: ch04
      title: The Wager Is Won
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: His wife stood in the meadow watching him. She wondered and wondered what her husband could be picking up. The lad offered an answer.
        - id: ch04-b02
          speaker: lad
          text: Oh, I know. Master must be gathering stones. He's noticed how often Tom Totherhouse runs over here, and he won't stand for it anymore. Now he's sworn to stone Mother to death.
        - id: ch04-b03
          speaker: narrator
          text: Away flew the Goody, as fast as her legs could carry her. When the husband reached the place where she had been standing, he asked the lad about her.
        - id: ch04-b04
          speaker: husband
          text: What in the world is Mother running after now?
        - id: ch04-b05
          speaker: lad
          text: Oh, perhaps the house is on fire!
        - id: ch04-b06
          speaker: narrator
          text: So the husband ran after her, with the Goody racing ahead. As she ran, she shrieked back at him.
        - id: ch04-b07
          speaker: goody
          text: Ah! Ah! Don't stone me to death! Please don't stone me! I give you my word that I'll never let Tom Totherhouse come near me again!
          emotion: fearful
        - id: ch04-b08
          speaker: lad
          text: Now the ten dollars are mine!
        - id: ch04-b09
          speaker: narrator
          text: And so they were.
