audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 从容而清醒，带一点克制的诙谐
        timbre: 温厚清晰
        pace: 舒缓有致
        pitch: 中低
    farmhand:
      display_name: 帮工
      tts:
        delivery: 机灵大胆，捉弄人时一本正经
        timbre: 清亮利落
        pace: 中等偏快
        pitch: 中
    husband:
      display_name: 丈夫
      tts:
        delivery: 厚道随和，问话时憨直认真
        timbre: 浑厚朴实
        pace: 舒缓
        pitch: 低
    goody:
      display_name: 农妇
      tts:
        delivery: 泼辣善变，心虚时急躁尖利
        timbre: 明亮有力
        pace: 中等
        pitch: 中高
    tom_totherhouse:
      display_name: 邻家汤姆
      tts:
        delivery: 质朴直白，受惊时慌张急促
        timbre: 清朗结实
        pace: 中等
        pitch: 中
  chapters:
    - id: ch01
      title: 十块钱的赌约
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 从前，有个农妇，嫁给了一个耳朵很背的丈夫。丈夫厚道又随和，可也正因为他这么老实，农妇反倒看上了隔壁的小伙子。大家都叫那人“邻家汤姆”。
        - id: ch01-b02
          speaker: narrator
          text: 聋丈夫家里有个帮工，一眼就瞧出了两人的秘密。一天，他找到农妇，要跟她打个赌。
        - id: ch01-b03
          speaker: farmhand
          text: 大娘，咱们赌十块钱怎么样？我能让你自己把丑事说出来，你信不信？
        - id: ch01-b04
          speaker: goody
          text: 赌就赌，我有什么不敢的！
        - id: ch01-b05
          speaker: narrator
          text: 于是，这十块钱的赌约就算定下了。后来有一天，帮工和聋丈夫在谷仓里打谷。他看见邻家汤姆进屋去找农妇，却一个字也没说。离午饭还早，他忽然转过身，对着谷仓门口大喊了一声。
        - id: ch01-b06
          speaker: farmhand
          text: 哎——！我们这就回去！
        - id: ch01-b07
          speaker: husband
          text: 怎么，这就要回家了吗？
        - id: ch01-b08
          speaker: narrator
          text: 丈夫根本没留意帮工刚才在做什么。
        - id: ch01-b09
          speaker: farmhand
          text: 是啊，得回去了。大娘在叫咱们呢。
    - id: ch02
      title: 两顿意外的美食
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 两人一进过道，帮工就又清嗓子又咳嗽，特意给农妇报信，好让她把汤姆藏起来。等他们走进屋，桌上已经摆着满满一大碗蛋奶糕。
        - id: ch02-b02
          speaker: husband
          text: 哎呀呀，老婆子，今天咱们还有蛋奶糕吃？
        - id: ch02-b03
          speaker: goody
          text: 有啊，亲爱的，当然有。
        - id: ch02-b04
          speaker: narrator
          text: 可农妇的脸比生果汁还酸，脾气也硬得像两根棍子。丈夫和帮工却把好吃好喝的全都一扫而光，随后又回去干活。
        - id: ch02-b05
          speaker: goody
          text: 那个鼻子尖得要命的小子，真该让魔鬼抓走！全是他坏了事。汤姆，你赶快走。我待会儿带些点心，到草地里找你。
        - id: ch02-b06
          speaker: narrator
          text: 农妇不知道，帮工就在过道外边，把这番话听得清清楚楚。
        - id: ch02-b07
          speaker: farmhand
          text: 老爹，洼地那边的篱笆让风吹倒了。咱们还是去修好吧，不然邻居家的猪一闯进来，准会把草地拱烂。
        - id: ch02-b08
          speaker: husband
          text: 对，对，那咱们就去修吧。
        - id: ch02-b09
          speaker: narrator
          text: 这个厚道人向来听人劝。下午过了一半，农妇果然偷偷溜进草地，围裙底下还藏着东西。
        - id: ch02-b10
          speaker: husband
          text: 哎呀呀，老婆子，你今天真不像平常！咱们两顿饭中间，居然也有点心吃吗？
        - id: ch02-b11
          speaker: goody
          text: 有，有，你们当然有。
        - id: ch02-b12
          speaker: narrator
          text: 她的脸色比先前更酸，火气也更大。可丈夫和帮工吃得高高兴兴，薄饼抹着黄油，只管往肚里塞，另外还喝了一口白兰地。
        - id: ch02-b13
          speaker: farmhand
          text: 大娘，我也给邻家汤姆送些点心去吧？我敢说，他到现在还什么都没吃呢。
        - id: ch02-b14
          speaker: goody
          text: 好哇，快去吧。你真是个好小伙！
        - id: ch02-b15
          speaker: narrator
          text: 农妇一下变得温顺极了，简直柔得像牛奶。
    - id: ch03
      title: 一把斧头和一地碎饼
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 帮工往汤姆家走去，一路把一块薄饼掰碎，将碎屑零零落落地撒在身后。见到汤姆以后，他马上压低了声音。
        - id: ch03-b02
          speaker: farmhand
          text: 你可要当心。我们家老公鸡发现你总去找大娘，已经气得再也忍不下去了。他还发了誓，只要见到你，就一斧头劈下来。
        - id: ch03-b03
          speaker: narrator
          text: 汤姆顿时吓得六神无主，连该往哪儿躲都不知道。帮工却回到了主人身边。
        - id: ch03-b04
          speaker: farmhand
          text: 老爹，汤姆的犁好像坏了。他想请您带上斧头去看看，能不能帮他修好。
        - id: ch03-b05
          speaker: narrator
          text: 丈夫果真提起斧头去找汤姆。汤姆才望见他，就转身飞奔而去。丈夫把那张犁翻过来、转过去，从各面看了又看，却没发现半点毛病，只好回家。
        - id: ch03-b06
          speaker: narrator
          text: 走在路上，他看见帮工刚才撒下的薄饼碎片，便弯腰一块块捡起来。农妇站在草地里瞧了半天，越看越奇怪，不知道丈夫究竟在拾什么。
        - id: ch03-b07
          speaker: farmhand
          text: 啊，我知道了。老爷一定是在捡石头。他早就发现邻家汤姆常往这里跑，再也受不了啦。如今他发了誓，要拿石头把大娘活活砸死。
        - id: ch03-b08
          speaker: narrator
          text: 农妇一听，撒腿就跑，使出了全身的力气。
    - id: ch04
      title: 丑事自己说了出来
      blocks:
        - id: ch04-b01
          speaker: husband
          text: 老婆子这是怎么啦？她又在追什么？
        - id: ch04-b02
          speaker: narrator
          text: 丈夫走到农妇刚才站的地方，满心不解地问帮工。
        - id: ch04-b03
          speaker: farmhand
          text: 哎呀，说不定家里的房子着火了！
        - id: ch04-b04
          speaker: narrator
          text: 丈夫听了，也赶紧追上去。农妇在前面逃，丈夫在后面追。跑着跑着，农妇尖声叫了起来。
        - id: ch04-b05
          speaker: goody
          text: 啊！别拿石头砸死我！求你别砸死我！我向你保证，以后再也不让邻家汤姆靠近我了！
          emotion: fearful
        - id: ch04-b06
          speaker: farmhand
          text: 这下，十块钱可归我啦！
        - id: ch04-b07
          speaker: narrator
          text: 那十块钱，果然归了帮工。
