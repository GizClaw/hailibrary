audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 从容而清醒，带一点克制的诙谐
        timbre: 温厚清晰
        pace: 舒缓有致
        pitch: 中低
    boots:
      display_name: 靴子小子
      tts:
        delivery: 好奇坦率，不慌不忙，始终带着认真劲儿
        timbre: 年轻清朗
        pace: 中等
        pitch: 中高
    peter:
      display_name: 彼得
      tts:
        delivery: 自负而爱讥讽，言语干脆
        timbre: 年轻厚实
        pace: 中等偏快
        pitch: 中低
    paul:
      display_name: 保罗
      tts:
        delivery: 跟随哥哥起哄，口气轻慢
        timbre: 年轻清晰
        pace: 中等偏快
        pitch: 中
    axe:
      display_name: 斧头
      tts:
        delivery: 沉着有力，像等候已久的老伙计
        timbre: 坚实浑厚
        pace: 偏慢
        pitch: 低
    spade:
      display_name: 铁锹
      tts:
        delivery: 朴直稳重，回答简短笃定
        timbre: 粗粝厚实
        pace: 偏慢
        pitch: 中低
    walnut:
      display_name: 核桃
      tts:
        delivery: 安静悠然，仿佛伴着细水说话
        timbre: 轻柔圆润
        pace: 舒缓
        pitch: 中
    king:
      display_name: 国王
      tts:
        delivery: 威严急切，愤怒与惊喜都坦率强烈
        timbre: 洪亮厚实
        pace: 中等
        pitch: 中低
  chapters:
    - id: ch01
      title: 国王的两桩难题
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 从前，有个穷人养了三个儿子，老大彼得，老二保罗，老三约翰。约翰年纪最小，自然就是靴子小子。要问这个父亲除了三个儿子还有什么家当，那可真是一样也说不出来。他穷得连两个铜板都凑不齐。于是，他一遍又一遍地告诉儿子们，大家非得到外面的世界去闯荡，设法自己挣饭吃不可。留在家里，除了活活饿死，再没有别的指望。
        - id: ch01-b02
          speaker: narrator
          text: 离他们的小屋不远，就是国王的宫殿。王宫窗前长着一棵大橡树，树干粗壮，树冠也大得惊人，把照进宫殿的光挡得严严实实。国王答应，谁能砍倒它，就赏给谁许许多多银元。可谁也没有那么大的本事。这棵树古怪得很，树干上每砍掉一块木屑，原处立刻长出两块，越砍反倒越结实。
        - id: ch01-b03
          speaker: narrator
          text: 国王还叫人挖过一口井，想让井水够吃上一整年。他的邻国都有井，偏偏他的王宫没有，他觉得很丢脸。于是他又许下钱财货物，请人替他挖一口终年有水的井。可是王宫坐落在高高的山顶，人们才挖下几英寸，就碰到了整块的硬岩石，谁也没办法继续往下挖。
        - id: ch01-b04
          speaker: narrator
          text: 国王铁了心，一定要办成这两件事。他命人在全国所有教堂里广发告示：谁能砍倒庭院里的橡树，再挖出一口终年有水的井，谁就娶走公主，还能分到半个王国。这个消息传遍四方，许多人都来碰运气。可他们任凭斧劈刀砍、锹挖镐刨，都没有半点用处。橡树越砍越高大粗壮，岩石也丝毫不肯松动。
        - id: ch01-b05
          speaker: narrator
          text: 后来，三兄弟也商量着去试一试。父亲听见以后，一句反对的话也没有，马上答应了。他想，就算儿子们得不到公主和半个王国，路上或许也能遇到一位好主人，谋到一份差事。只要他们能养活自己，他就心满意足。于是，彼得、保罗和靴子小子一起离开了家。
    - id: ch02
      title: 会自己砍树的斧头
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 三兄弟走了没多远，来到一片冷杉林旁。树林一边是陡峭的山坡。正走着，他们忽然听见高处传来一下又一下的劈砍声。
        - id: ch02-b02
          speaker: boots
          text: 上面是什么东西，一直砍个不停？
        - id: ch02-b03
          speakers: [peter, paul]
          ensemble: duo
          text: 你怎么什么都要瞎琢磨？山坡上有个樵夫砍树，这有什么稀奇？
        - id: ch02-b04
          speaker: boots
          text: 我还是上去瞧瞧，看清楚到底是什么。
        - id: ch02-b05
          speakers: [peter, paul]
          ensemble: duo
          text: 你这么孩子气，就上去好好学点本事吧！
        - id: ch02-b06
          speaker: narrator
          text: 靴子小子根本不理会哥哥的嘲笑，只管循着声音爬上陡坡。等他来到响声传出的地方，你猜他看见了什么？没有樵夫，只有一把斧头独自立在一棵冷杉前，正一下接一下地劈砍树干。
        - id: ch02-b07
          speaker: boots
          text: 日安！原来是你独自在这儿砍树呀？
        - id: ch02-b08
          speaker: axe
          text: 是我。我在这里劈呀砍呀，已经等了你好久好久。
        - id: ch02-b09
          speaker: boots
          text: 那好，我总算来了。
        - id: ch02-b10
          speaker: narrator
          text: 他拿起斧头，把它从斧柄上卸下来，随后连斧头带斧柄一起塞进背囊。等他回到坡下，两个哥哥立刻围上来，讥笑起他来。
        - id: ch02-b11
          speakers: [peter, paul]
          ensemble: duo
          text: 你在山坡上找到了什么古怪玩意儿？
        - id: ch02-b12
          speaker: boots
          text: 没什么，我们听见的只是一把斧头。
    - id: ch03
      title: 岩顶的铁锹与溪头的核桃
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 他们又走了一程，来到一面陡峭的岩壁下。岩顶传来挖土铲石的声响。
        - id: ch03-b02
          speaker: boots
          text: 这回岩顶上又是什么东西在挖呀铲呀？
        - id: ch03-b03
          speakers: [peter, paul]
          ensemble: duo
          text: 你又开始自作聪明了。难道你从没听过啄木鸟在空树干上又凿又啄吗？
        - id: ch03-b04
          speaker: boots
          text: 好吧，可我还是想上去看看。弄清楚了，总是件有意思的事。
        - id: ch03-b05
          speaker: narrator
          text: 靴子小子动身攀上岩壁，哥哥们留在下面不停取笑他。他一点也不在意，只顾往上爬。快到岩顶时，你猜他看见了什么？那里根本没有啄木鸟，只有一把铁锹独自立着，正不停地挖呀刨呀。
        - id: ch03-b06
          speaker: boots
          text: 日安！原来是你独自在这里挖土呀？
        - id: ch03-b07
          speaker: spade
          text: 是我。为了等你，我已经在这里挖了许多个漫长的日子。
        - id: ch03-b08
          speaker: boots
          text: 好，我来了。
        - id: ch03-b09
          speaker: narrator
          text: 他拿起铁锹，把它从锹柄上敲下来，连同锹柄一起收进背囊，然后顺着岩壁爬下去，又回到哥哥们身边。
        - id: ch03-b10
          speakers: [peter, paul]
          ensemble: duo
          text: 说吧，你在岩顶看见什么稀世奇珍了？
        - id: ch03-b11
          speaker: boots
          text: 只是一把铁锹。刚才就是它在响。
        - id: ch03-b12
          speaker: narrator
          text: 三个人继续赶路，后来走到一条小溪边。长途跋涉以后，他们都口渴了，便俯下身喝水。
        - id: ch03-b13
          speaker: boots
          text: 这么多水，是从什么地方流出来的呢？
        - id: ch03-b14
          speakers: [peter, paul]
          ensemble: duo
          text: 你的脑子准有毛病！再这样瞎琢磨，你很快就要疯了。溪水当然是从地下的泉眼冒出来的，这还用问吗？
        - id: ch03-b15
          speaker: boots
          text: 我知道水会从泉眼里冒出来，可我还是想亲眼看看这条溪的源头。
        - id: ch03-b16
          speaker: narrator
          text: 两个哥哥在身后大喊，不许他再去，可谁也拦不住他。他沿着溪边一路向上，越走越高，溪水也变得越来越细。最后，他又往前走了一小段。你猜他看见了什么？原来是一颗大核桃躺在那里，水正从核桃的小孔里涓涓流出。
        - id: ch03-b17
          speaker: boots
          text: 日安！原来是你躺在这里，独自不停地淌水呀？
        - id: ch03-b18
          speaker: walnut
          text: 是我。为了等你，我已经在这里流了许多个漫长的日子。
        - id: ch03-b19
          speaker: boots
          text: 好，我来了。
        - id: ch03-b20
          speaker: narrator
          text: 靴子小子从地上抓起一团苔藓，严严实实地堵住核桃的小孔，不让水继续流出来。随后，他把核桃装进背囊，转身沿着溪边飞快跑回哥哥们身边。
        - id: ch03-b21
          speakers: [peter, paul]
          ensemble: duo
          text: 你弄清水从哪里来了？那一定是难得一见的奇景吧！
        - id: ch03-b22
          speaker: boots
          text: 其实没什么，水不过是从一个小孔里流出来的。
        - id: ch03-b23
          speaker: narrator
          text: 哥哥们听完，又笑起来，拿他寻了好一阵开心。可靴子小子还是丝毫不在意。
        - id: ch03-b24
          speaker: boots
          text: 不管怎么说，我亲眼看过了，还挺有意思。
    - id: ch04
      title: 两个哥哥的运气
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 三兄弟继续往前，终于来到王宫。此时，全国上下的人都知道，只要砍树挖井，便能娶到公主，还能得到半个王国。因此，前来碰运气的人多得数也数不清。可每个人砍下一块木屑，树干上就长出两块。来尝试的人越多，树长得越厉害，如今已经有原来两倍粗、两倍大了。
        - id: ch04-b02
          speaker: narrator
          text: 国王这时又定下一条惩罚。谁敢尝试却砍不倒橡树，就要被割掉两只耳朵，再流放到一座荒岛。两个哥哥听了也没有被吓住，还认定自己一定能成功。彼得年纪最大，先拿起斧头去砍。可他的运气和前面所有人一模一样。每砍掉一块木屑，原处照样长出两块。国王的仆从立刻抓住他，割掉他的两只耳朵，把他送上荒岛。
        - id: ch04-b03
          speaker: narrator
          text: 接下来轮到保罗碰碰运气。他才砍了两三斧，人们已经亲眼看见橡树越长越大。国王的仆从也抓住他，割掉双耳，把他送到荒岛。他们还故意把保罗的耳朵割得更短，说他明明看见了哥哥的下场，本该从中吸取教训。
        - id: ch04-b04
          speaker: narrator
          text: 最后，靴子小子走上前去。国王因为他的两个哥哥而迁怒于他。
        - id: ch04-b05
          speaker: king
          text: 你非要变成一只带记号的羊，那我们现在就割掉你的耳朵，也省得你白费力气。
          emotion: angry
        - id: ch04-b06
          speaker: boots
          text: 请让我先试一试吧。
        - id: ch04-b07
          speaker: narrator
          text: 国王准许了。靴子小子从背囊里拿出斧头，重新安好斧柄。
    - id: ch05
      title: 靴子小子的奖赏
      blocks:
        - id: ch05-b01
          speaker: boots
          text: 斧头，砍吧！
        - id: ch05-b02
          speaker: narrator
          text: 斧头马上自己劈砍起来，一下接着一下，木屑朝四面飞去。这一回，树干上再也没有长出新的木块。没过多久，那棵遮天蔽日的大橡树便轰然倒下。
        - id: ch05-b03
          speaker: narrator
          text: 树砍倒以后，靴子小子又从背囊里取出铁锹，重新安好锹柄。
        - id: ch05-b04
          speaker: boots
          text: 铁锹，挖吧！
        - id: ch05-b05
          speaker: narrator
          text: 铁锹立刻自己挖呀刨呀，坚硬的土地挡不住它，整块的岩石也挡不住它。泥土和石头碎片飞得到处都是。你想也知道，没过多久，一口井便挖好了。
        - id: ch05-b06
          speaker: narrator
          text: 等井有了他想要的宽度和深度，靴子小子拿出核桃，把它放在井的一角，再拔掉塞住小孔的苔藓。
        - id: ch05-b07
          speaker: boots
          text: 核桃，流吧！
        - id: ch05-b08
          speaker: narrator
          text: 水立刻从核桃的小孔里流出来，起先还涓涓细淌，接着越流越多，最后涌成了一股清泉。只过了一小会儿，整口井就灌得满满当当，水一直涨到了井沿。
        - id: ch05-b09
          speaker: narrator
          text: 就这样，靴子小子砍倒了遮住王宫阳光的大橡树，又在庭院里挖出一口终年有水的井。国王兑现诺言，把公主嫁给他，又分给他半个王国。
        - id: ch05-b10
          speaker: narrator
          text: 至于彼得和保罗，幸亏他们已经没有耳朵了。要不然，从早到晚，每时每刻，他们都会听见人人议论说：靴子小子爱琢磨东、琢磨西，脑子可一点也不糊涂。
