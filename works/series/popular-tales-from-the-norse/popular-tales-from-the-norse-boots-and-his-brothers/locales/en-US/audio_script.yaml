  chapters:
    - id: ch01
      title: The King's Two Tasks
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Once upon a time, a poor man had three sons named Peter, Paul, and John. John was called Jack, or Boots, because he was the youngest. Those three boys were about all their father had. He did not own even two pennies to rub together. Again and again, he told his sons they would have to go out into the world and earn their bread. There was nothing for them to hope for at home. If they stayed, they would only starve.
        - id: ch01-b02
          speaker: narrator
          text: Not far from their cottage stood the king's palace. Right outside its windows, a great oak had grown so broad and strong that it shut out all the light. The King offered a great many dollars to anyone who could cut it down. But whenever a woodman struck off one chip, two more grew in its place. No one could master the tree.
        - id: ch01-b03
          speaker: narrator
          text: The King also wanted a well that would hold water all year. All his neighbors had wells, while he had none, and he thought that shameful. He promised money and goods to anyone who could dig one. Yet the palace stood high on a hill. After only a few inches, every digger struck solid rock.
        - id: ch01-b04
          speaker: narrator
          text: The King was determined to have both things done. So a message went out through every church in the kingdom. Whoever felled the oak in the palace courtyard and dug a well that held water all year would marry the Princess and receive half the kingdom.
        - id: ch01-b05
          speaker: narrator
          text: Men came from everywhere to try their luck. They hacked and chopped at the tree. They dug and shoveled at the hill. Nothing helped. The oak only grew broader and stronger with every stroke, and the rock did not soften at all. One day, the three brothers decided they would try too. Their father had no objection. Even if they won neither the Princess nor the kingdom, perhaps they might find a place with a good master along the way. That was all their father wanted for them. The moment they told him they meant to go to the palace, he said yes. So Peter, Paul, and Jack left their home together.
    - id: ch02
      title: The Axe in the Fir Wood
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: Before they had gone far, they reached a fir wood beside a steep hillside. As they walked, they heard the sound of chopping high among the trees.
        - id: ch02-b02
          speaker: jack
          text: I wonder what's chopping away up there.
        - id: ch02-b03
          speakers: [peter, paul]
          ensemble: duo
          text: There you go with your clever wondering again. What could it be but a woodcutter chopping on the hillside?
        - id: ch02-b04
          speaker: jack
          text: Even so, I'd like to go and see.
        - id: ch02-b05
          speakers: [peter, paul]
          ensemble: duo
          text: If you must act like a child, go on up and take a lesson!
        - id: ch02-b06
          speaker: narrator
          text: Jack paid no attention to what they said. He climbed the steep slope, following the chopping sound through the trees. When he finally reached the spot, there was no woodcutter at all. An axe stood by itself at the trunk of a fir. It kept on hacking and hewing without anyone holding it.
        - id: ch02-b07
          speaker: jack
          text: Good day! So you're up here chopping all by yourself?
        - id: ch02-b08
          speaker: axe
          text: Yes. I've been standing here, hacking and hewing for a long, long while, waiting for you.
        - id: ch02-b09
          speaker: jack
          text: Well, here I am at last.
        - id: ch02-b10
          speaker: narrator
          text: Jack took hold of the axe and pulled the iron head from its wooden haft. He tucked both pieces safely into his wallet. Then he climbed all the way down the hillside to his brothers. The moment he returned, Peter and Paul began laughing and jeering at him.
        - id: ch02-b11
          speakers: [peter, paul]
          ensemble: duo
          text: So what strange and wonderful thing did you find up on the hill?
        - id: ch02-b12
          speaker: jack
          text: Oh, it was only an axe making that noise.
    - id: ch03
      title: The Spade on the Rock
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: The brothers went on until they passed beneath a steep shoulder of rock. From somewhere above came the sound of digging and shoveling.
        - id: ch03-b02
          speaker: jack
          text: Now I wonder what's digging away at the top of that rock.
        - id: ch03-b03
          speakers: [peter, paul]
          ensemble: duo
          text: More clever wondering! Haven't you ever heard a woodpecker pecking at a hollow tree?
        - id: ch03-b04
          speaker: jack
          text: Well, I think it would be fun to find out what it really is.
        - id: ch03-b05
          speaker: narrator
          text: Off Jack went to climb the rock while Peter and Paul stayed below, laughing and making fun of him. He did not care in the least. He kept climbing toward the sound. When he came close to the top, he saw a spade standing there all alone. With no one holding its handle, it went on digging and delving into the ground.
        - id: ch03-b06
          speaker: jack
          text: Good day! So you're standing here and digging all by yourself?
        - id: ch03-b07
          speaker: spade
          text: That's exactly what I'm doing. I've been at it for many a long day, waiting for you.
        - id: ch03-b08
          speaker: jack
          text: Well, here I am.
        - id: ch03-b09
          speaker: narrator
          text: Jack took the spade and knocked the iron blade from its handle. He put both parts into his wallet, just as he had done with the axe. Then he made his way back down the rock to Peter and Paul.
        - id: ch03-b10
          speakers: [peter, paul]
          ensemble: duo
          text: What rare and marvelous thing did you see at the top of the rock?
        - id: ch03-b11
          speaker: jack
          text: Nothing more than a spade. That's what we heard.
    - id: ch04
      title: The Walnut and the Brook
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: After another long stretch of road, the brothers came to a brook. All three were thirsty, so they lay beside the water to drink.
        - id: ch04-b02
          speaker: jack
          text: I wonder where all this water comes from.
        - id: ch04-b03
          speakers: [peter, paul]
          ensemble: duo
          text: Have you lost your senses? If you aren't mad already, all this wondering will soon make you so. Everyone knows a brook rises from a spring in the ground!
        - id: ch04-b04
          speaker: jack
          text: Maybe so, but I still want to see where this brook begins.
        - id: ch04-b05
          speaker: narrator
          text: His brothers shouted after him, but Jack went on in spite of them. Nothing they said could stop him. He followed the brook farther and farther uphill. As he climbed, the stream grew smaller and smaller beside him. At last, a little way ahead, he found the place where it began. A great walnut lay there, and all the water was trickling from a hole in its shell.
        - id: ch04-b06
          speaker: jack
          text: Good day! So you're lying here, letting the water run out all by yourself?
        - id: ch04-b07
          speaker: walnut
          text: Yes, I am. I've been trickling and running here for many a long day, waiting for you.
        - id: ch04-b08
          speaker: jack
          text: Well, here I am.
        - id: ch04-b09
          speaker: narrator
          text: Jack picked up a lump of moss and pressed it into the hole. Once the opening was plugged, no more water could run out. He lifted the great walnut, put it into his wallet with the axe and spade, and hurried back down the brook to his brothers.
        - id: ch04-b10
          speakers: [peter, paul]
          ensemble: duo
          text: Well, did you discover where the water comes from? It must have been a remarkable sight!
        - id: ch04-b11
          speaker: jack
          text: It was only a hole with water running out of it.
        - id: ch04-b12
          speaker: narrator
          text: Once again, they laughed and made fun of him. Jack did not mind in the least.
        - id: ch04-b13
          speaker: jack
          text: At least I had the fun of seeing it.
    - id: ch05
      title: The Brothers Try Their Luck
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: A little farther on, the brothers reached the king's palace. By then, everyone in the kingdom had heard the promise. All a man had to do was fell the great oak and dig the King's well, and he would win the Princess and half the realm. So many people had already come to try that the oak was now twice as broad and strong as it had been at first. For every chip their axes cut away, two new chips had grown in its place.
        - id: ch05-b02
          speaker: narrator
          text: The King had finally set a punishment. Anyone who tried and failed would have both ears clipped off and be sent to a barren island. That did not frighten the two older brothers. They were certain they could bring down the tree.
        - id: ch05-b03
          speaker: narrator
          text: Peter was the eldest, so he claimed the first turn. He began striking the oak with his axe, certain he could bring it down. But the same thing happened to him as to every woodman before. Each time he cut one chip from the trunk, two grew back in its place. The king's men soon seized him. They clipped off both his ears and carried him away to the barren island.
        - id: ch05-b04
          speaker: narrator
          text: Paul still meant to try his own luck. He stepped forward and took his turn. After only two or three strokes, everyone could see the oak growing larger. The king's men seized him too. They clipped his ears even closer than Peter's because, they said, Paul ought to have learned a lesson from his brother. Then they sent him out to the same barren island.
        - id: ch05-b05
          speaker: narrator
          text: Now it was Jack's turn. The King was angry with him on account of his brothers.
        - id: ch05-b06
          speaker: king
          text: If you're determined to look like a marked sheep, we can clip your ears now and save you the trouble of trying.
          emotion: angry
        - id: ch05-b07
          speaker: jack
          text: I'd rather have my chance first.
        - id: ch05-b08
          speaker: narrator
          text: The King allowed it. Jack drew the axe from his wallet and fitted the head back onto its haft.
    - id: ch06
      title: Jack's Three Wonders
      blocks:
        - id: ch06-b01
          speaker: jack
          text: Hew away!
        - id: ch06-b02
          speaker: narrator
          text: At Jack's command, the axe went straight to work by itself. It hewed so quickly that chips flew through the air in every direction. This time, none of them grew back. The axe kept chopping, and before long, the mighty oak came crashing down.
        - id: ch06-b03
          speaker: narrator
          text: When the tree was felled, Jack took out the spade and fixed it to its handle.
        - id: ch06-b04
          speaker: jack
          text: Dig away!
        - id: ch06-b05
          speaker: narrator
          text: The spade obeyed at once. It dug and delved by itself, biting through the ground where every other tool had failed. Earth flew from the hole, and even the solid rock burst out in splinters. The spade did not stop until the well was as wide and as deep as Jack wanted it.
        - id: ch06-b06
          speaker: narrator
          text: Then Jack brought out the walnut. He set it in one corner of the well and pulled away the plug of moss.
        - id: ch06-b07
          speaker: jack
          text: Trickle and run!
        - id: ch06-b08
          speaker: narrator
          text: The walnut began to trickle and run, just as Jack told it. First the water slipped from the little hole. Then it gushed out in a steady stream and spread across the bottom of the well. It rose higher and higher until, in a short while, the whole well was full to the brim.
        - id: ch06-b09
          speaker: narrator
          text: Jack had cut down the oak that shaded the palace and dug a well in the courtyard. Just as the King had promised, he received the Princess and half the kingdom.
        - id: ch06-b10
          speaker: narrator
          text: As for Peter and Paul, perhaps it was lucky they had lost their ears. Otherwise, hour after hour and day after day, they would have heard everyone say that Jack had not been so foolish after all when he went off wondering.
