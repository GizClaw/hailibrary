audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 从容而清醒，带一点克制的诙谐
        timbre: 温厚清晰
        pace: 舒缓有致
        pitch: 中低
    boots:
      display_name: 小靴子
      tts:
        delivery: 朴实镇定，机敏中带着不动声色的幽默
        timbre: 年轻温暖
        pace: 中等偏缓
        pitch: 中等
    princess:
      display_name: 公主
      tts:
        delivery: 尖刻好胜，恼怒时语速急促
        timbre: 年轻清亮
        pace: 中等偏快
        pitch: 中高
  chapters:
    - id: ch01
      title: 谁能叫公主住口
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 从前有个国王，他有一位公主。这位公主骂起人来没完没了，一张嘴快得谁也拦不住。国王只好向全国宣布，不管是谁，只要有本事叫她住口，就能娶她为妻，还能得到半壁江山。
        - id: ch01-b02
          speaker: narrator
          text: 三兄弟听见这个消息，都决定去试试运气。两个哥哥自认最聪明，抢先去了王宫。可他们哪里是公主的对手，不但没能叫她住口，反倒挨了一顿好打。
    - id: ch02
      title: 路上捡来的东西
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 轮到最小的弟弟小靴子出发了。他走了没多远，见路上有一道柳条箍，便捡了起来。再走一程，他又捡到一片破盘子。接着是一只死喜鹊，一根弯曲的公羊角，还有一根正好能跟它配成一对的羊角。
        - id: ch02-b02
          speaker: narrator
          text: 最后，小靴子穿过王宫旁边的田野。那里有人正在往外倒粪，他又从地上捡起一片磨破的鞋底。就这样，他带着一路收集来的东西走进王宫，站到了公主面前。
    - id: ch03
      title: 公主没话说了
      blocks:
        - id: ch03-b01
          speaker: boots
          text: 日安。
        - id: ch03-b02
          speaker: narrator
          text: 小靴子向公主问好，公主回话时却皱起了脸。
        - id: ch03-b03
          speaker: princess
          text: 日安。
        - id: ch03-b04
          speaker: boots
          text: 我带来一只喜鹊，能在这里把它煮熟吗？
        - id: ch03-b05
          speaker: princess
          text: 就怕它下了锅会裂开。
        - id: ch03-b06
          speaker: boots
          text: 那不怕。我把这道柳条箍套上去，它就裂不开了。
        - id: ch03-b07
          speaker: narrator
          text: 他说着，取出了路上捡来的柳条箍。
        - id: ch03-b08
          speaker: princess
          text: 可它肚里的油会全流出来。
        - id: ch03-b09
          speaker: boots
          text: 那我拿这个在下面接住。
        - id: ch03-b10
          speaker: narrator
          text: 小靴子又把那片破盘子亮给她看。
        - id: ch03-b11
          speaker: princess
          text: 你说话怎么老是拐弯抹角的？叫人怎么抓得住你？
        - id: ch03-b12
          speaker: boots
          text: 我的意思一点儿也不弯。真正弯的是它。
        - id: ch03-b13
          speaker: narrator
          text: 说完，他举起那根弯曲的羊角。
        - id: ch03-b14
          speaker: princess
          text: 嘿！我长这么大，还从没见过能跟这东西配得上的。
        - id: ch03-b15
          speaker: boots
          text: 那你现在就见到了。跟它配对的在这儿呢。
        - id: ch03-b16
          speaker: narrator
          text: 小靴子从身上掏出了第二根羊角。
        - id: ch03-b17
          speaker: princess
          text: 我看你就是来胡说八道，非要把我的舌头磨破才甘心！
          emotion: angry
        - id: ch03-b18
          speaker: boots
          text: 我可没想磨破你的舌头。真正磨破的是这个。
        - id: ch03-b19
          speaker: narrator
          text: 他取出最后一样东西，那片磨破的鞋底。公主气得厉害，嗓子彻底没了声，再也吐不出半个字。
        - id: ch03-b20
          speaker: boots
          text: 这下，你归我啦。
        - id: ch03-b21
          speaker: narrator
          text: 于是，小靴子娶了公主，也得到了国王的半壁江山。
