audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: thoughtful and gently wry
        timbre: warm and clear
        pace: measured
        pitch: medium
    boots:
      display_name: Boots
      tts:
        delivery: quick-witted and cheerfully confident
        timbre: youthful and clear
        pace: lively
        pitch: medium
    princess:
      display_name: Princess
      tts:
        delivery: sharp and impatient
        timbre: bright and cutting
        pace: brisk
        pitch: medium-high
  chapters:
    - id: ch01
      title: The King's Challenge
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Once there was a king with a daughter who scolded everyone. Her tongue ran so fast that no one could stop her. At last, the king announced that any man who could silence the Princess might marry her and receive half the kingdom as well.
        - id: ch01-b02
          speaker: narrator
          text: Three brothers heard the news and decided to try their luck. The two older brothers went first because they believed they were the clever ones. But neither could manage the Princess, and both came away soundly thrashed.
    - id: ch02
      title: What Boots Found
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: Then Boots, the youngest brother, set out. Before he had gone far, he saw an ozier band lying in the road and picked it up. Farther along, he found a piece of broken plate and took that too.
        - id: ch02-b02
          speaker: narrator
          text: Next he came upon a dead magpie. After that, he found a crooked ram's horn, and a little later he found the horn that matched it. At last he crossed the fields beside the king's palace. Dung was being pitched out there, and in it lay a worn-out shoe sole. Boots picked that up as well.
        - id: ch02-b03
          speaker: narrator
          text: Carrying every one of his odd discoveries, Boots entered the palace and stood before the Princess.
    - id: ch03
      title: The Princess Has No Answer
      blocks:
        - id: ch03-b01
          speaker: boots
          text: Good day to you.
        - id: ch03-b02
          speaker: narrator
          text: The Princess pulled a sour face.
        - id: ch03-b03
          speaker: princess
          text: Good day.
        - id: ch03-b04
          speaker: boots
          text: Could I have my magpie cooked here?
        - id: ch03-b05
          speaker: princess
          text: It will probably burst.
        - id: ch03-b06
          speaker: boots
          text: Oh, that won't be a problem. I'll tie this ozier band around it.
        - id: ch03-b07
          speaker: narrator
          text: He brought out the band for her to see.
        - id: ch03-b08
          speaker: princess
          text: All the fat will run out.
        - id: ch03-b09
          speaker: boots
          text: Then I'll catch it in this.
        - id: ch03-b10
          speaker: narrator
          text: He showed her the broken piece of plate.
        - id: ch03-b11
          speaker: princess
          text: Your words twist and turn so much that no one can tell what you mean.
        - id: ch03-b12
          speaker: boots
          text: My words aren't crooked. But this certainly is.
        - id: ch03-b13
          speaker: narrator
          text: Up came one of the crooked ram's horns.
        - id: ch03-b14
          speaker: princess
          text: Well! In all my life, I've never seen anything to match that.
          emotion: surprised
        - id: ch03-b15
          speaker: boots
          text: Why, here's its match right now.
        - id: ch03-b16
          speaker: narrator
          text: And he produced the other ram's horn.
        - id: ch03-b17
          speaker: princess
          text: I suppose you came here to wear out my tongue with all this nonsense.
        - id: ch03-b18
          speaker: boots
          text: No, I didn't. But this is worn out.
        - id: ch03-b19
          speaker: narrator
          text: He pulled out the old shoe sole. The Princess was so furious that she had lost her voice, and not one word came from her.
        - id: ch03-b20
          speaker: boots
          text: Now you're mine.
        - id: ch03-b21
          speaker: narrator
          text: And so Boots married the Princess and received half the kingdom.
