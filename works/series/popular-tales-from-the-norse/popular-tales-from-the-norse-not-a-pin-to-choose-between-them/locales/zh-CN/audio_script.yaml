audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 从容而清醒，带一点克制的诙谐
        timbre: 温厚清晰
        pace: 舒缓有致
        pitch: 中低
    man:
      display_name: 男人
      tts:
        delivery: 朴实直接，遇事机敏，讥讽时不动声色
        timbre: 粗厚明朗
        pace: 中等
        pitch: 中低
    wife:
      display_name: 妻子
      tts:
        delivery: 自以为有主意，糊涂中透着认真
        timbre: 朴实圆润
        pace: 中等偏快
        pitch: 中等
    butcher:
      display_name: 屠夫
      tts:
        delivery: 精明圆滑，表面爽快，暗藏捉弄
        timbre: 结实低沉
        pace: 中等
        pitch: 中低
    sun_goody:
      display_name: 运阳光的大嫂
      tts:
        delivery: 忙乱又诚恳，对自己的办法深信不疑
        timbre: 明亮朴实
        pace: 中等偏快
        pitch: 中等偏高
    shirt_goody:
      display_name: 做衬衫的大嫂
      tts:
        delivery: 笃定强硬，做事不知轻重
        timbre: 响亮坚实
        pace: 中等
        pitch: 中等
    shirt_husband:
      display_name: 试衬衫的丈夫
      tts:
        delivery: 痛苦慌张，说话带着夸张的哀号
        timbre: 沙哑单薄
        pace: 偏快
        pitch: 中等偏高
    farm_goody:
      display_name: 农庄大嫂
      tts:
        delivery: 热心轻信，谈起第二任丈夫时格外关切
        timbre: 柔和饱满
        pace: 中等
        pitch: 中等
    peter_third:
      display_name: 第三任彼得
      tts:
        delivery: 急躁直率，却同样容易受骗
        timbre: 粗哑有力
        pace: 中等偏快
        pitch: 中低
  chapters:
    - id: ch01
      title: 卖牛的妻子
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 从前有一对夫妻，想在田里播种，却没有种粮，也拿不出钱来买。家里只剩一头母牛，丈夫本想把牛赶进城卖掉，再用卖牛的钱换种子。可妻子怕他拿了钱去喝酒，怎么也不放心。最后，她自己牵牛上路，还带上了一只母鸡。
        - id: ch01-b02
          speaker: narrator
          text: 快进城时，她遇见一个屠夫。屠夫看了看那头牛，开口问她。
        - id: ch01-b03
          speaker: butcher
          text: 大嫂，这头牛你卖吗？
        - id: ch01-b04
          speaker: wife
          text: 当然卖呀。
        - id: ch01-b05
          speaker: butcher
          text: 你打算卖多少钱？
        - id: ch01-b06
          speaker: wife
          text: 牛要五先令。不过呢，这只母鸡你得出十英镑买。
        - id: ch01-b07
          speaker: butcher
          text: 那好办。牛我出五先令，鸡就不要了。等你进了城，还愁卖不掉一只鸡吗？
        - id: ch01-b08
          speaker: narrator
          text: 妻子果真用五先令卖掉了牛。可她走遍城里，也没人肯花十英镑买那只又老又瘦、肉还硬的母鸡。没办法，她又找回屠夫。
        - id: ch01-b09
          speaker: wife
          text: 老板，我什么办法都试过了，这只鸡就是卖不出去。你买了我的牛，也得把鸡收下才行。
        - id: ch01-b10
          speaker: butcher
          text: 行啊，跟我来吧，我们慢慢商量。
        - id: ch01-b11
          speaker: narrator
          text: 屠夫让她吃肉，又不停劝她喝酒。他灌了她许多白兰地，她很快就醉得晕头转向，连自己在做什么也不知道，倒头便沉沉睡去。屠夫趁机把她整个人往焦油桶里一蘸，再放到羽毛堆上滚了一身。她醒来一看，从头到脚都粘满羽毛，怎么也想不明白自己出了什么事。
        - id: ch01-b12
          speaker: wife
          text: 这到底是不是我？不对，这绝不会是我，准是一只从没见过的大怪鸟。可怎么才能弄清楚呢？有了！回家以后，要是牛犊肯舔我，特雷也不冲我叫，那就说明还是我。
        - id: ch01-b13
          speaker: narrator
          text: 她才穿过自家大门，狗特雷便对着这个怪物狂叫不止，简直像满院子都是骗子和强盗。
        - id: ch01-b14
          speaker: wife
          text: 哎呀，我就知道。这肯定不是我。
        - id: ch01-b15
          speaker: narrator
          text: 她又去找牛犊。可牛犊一闻到浓烈的焦油味，全躲开了，谁也不肯舔她。
        - id: ch01-b16
          speaker: wife
          text: 果然不是我。看来我真是一只外国来的怪鸟。
        - id: ch01-b17
          speaker: narrator
          text: 她爬上储藏棚的屋顶，把胳膊当成翅膀，使劲扑腾，正准备飞走。丈夫看见了，拿着猎枪冲出来，举枪瞄准她。
        - id: ch01-b18
          speaker: wife
          text: 别开枪！千万别开枪！是我呀！
          emotion: fearful
        - id: ch01-b19
          speaker: man
          text: 要真是你，就别像山羊一样杵在屋顶上。下来吧，我倒要听听你怎么解释。
        - id: ch01-b20
          speaker: narrator
          text: 妻子只好从屋顶爬下来，却连一个先令也拿不出。屠夫付给她的那枚五先令银币，早被她在醉得神志不清时扔掉了。丈夫听完她从卖牛到变成怪鸟的全部经历，气坏了。
        - id: ch01-b21
          speaker: man
          text: 你不但没变聪明，反倒比以前蠢了整整一倍！
          emotion: angry
        - id: ch01-b22
          speaker: narrator
          text: 他决定离开妻子。除非能找到三个和她同样愚蠢的女人，否则再也不回家。
    - id: ch02
      title: 用筛子运阳光
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 男人慢慢上了路。没走多远，他看见一个大嫂拿着空筛子，在新盖的木屋里来回奔忙。每次进门，她都用围裙盖住筛子，像是里面盛着什么。进屋以后，她再把筛子翻扣在地板上。
        - id: ch02-b02
          speaker: man
          text: 大嫂，你这样跑进跑出，是在忙什么？
        - id: ch02-b03
          speaker: sun_goody
          text: 我想运一点阳光进来。可筛子在外面明明装满了阳光，一进屋，不知怎么又空了。我从前那间屋子亮堂得很，也不用这样费劲。谁要能让这间屋子也照进太阳，我愿意送他三百块钱。
        - id: ch02-b04
          speaker: man
          text: 家里有斧头吗？给我一把，我很快就能让阳光进屋。
        - id: ch02-b05
          speaker: narrator
          text: 原来木匠盖房时忘了留窗户，怪不得屋里一片昏暗。男人拿过斧头，在木墙上劈出几扇窗。阳光立刻自己照进屋里，根本用不着筛子来运。大嫂高高兴兴地付给他三百块钱。
        - id: ch02-b06
          speaker: man
          text: 这就找到第一个了。
    - id: ch03
      title: 没有领口的衬衫
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 男人接着赶路。过了一阵，他听见一所房子里传出吓人的惨叫，便进去看个究竟。一个大嫂正拿洗衣槌狠敲丈夫的脑袋，而丈夫的头上套着一件没有领口的衬衫。
        - id: ch03-b02
          speaker: man
          text: 大嫂，你再这样打下去，可要把丈夫打死了！
        - id: ch03-b03
          speaker: shirt_goody
          text: 我不是要打死他。我得给这件衬衫弄出一个洞，好让他的脖子穿过去。
        - id: ch03-b04
          speaker: narrator
          text: 丈夫一直在衬衫底下尖声哀号。
        - id: ch03-b05
          speaker: shirt_husband
          text: 老天保佑所有试穿新衬衫的人吧！谁能教我妻子换个办法开领口，我马上给他三百块钱！
        - id: ch03-b06
          speaker: man
          text: 给我一把剪刀，我一眨眼就能解决。
        - id: ch03-b07
          speaker: narrator
          text: 男人拿起剪刀，咔嚓几下便剪出了领口，然后收下三百块钱，继续往前走。
        - id: ch03-b08
          speaker: man
          text: 这是第二个。
    - id: ch04
      title: 天堂庄来的客人
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 最后，男人来到一座农庄，想进去歇歇脚。女主人迎上来问他。
        - id: ch04-b02
          speaker: farm_goody
          text: 先生，您是从哪儿来的？
        - id: ch04-b03
          speaker: man
          text: 我从天堂庄来。
        - id: ch04-b04
          speaker: narrator
          text: 男人自家的农庄，名字正是天堂庄。可女主人听见这三个字，一下子激动起来。
        - id: ch04-b05
          speaker: farm_goody
          text: 天堂庄？真的吗？那您肯定认识我的第二任丈夫彼得。他已经去世了，愿上帝让他的灵魂安息。
        - id: ch04-b06
          speaker: narrator
          text: 这位大嫂先后嫁过三个丈夫。第一任和第三任在她眼里都是坏人，所以她认定，只有第二任丈夫上了天堂。
        - id: ch04-b07
          speaker: man
          text: 认识，当然认识。我和他熟得很。
        - id: ch04-b08
          speaker: farm_goody
          text: 那个可怜人现在过得好不好？
        - id: ch04-b09
          speaker: man
          text: 只能算勉强活着吧。他每天挨家挨户讨饭，没东西吃，身上连一块遮体的布也没有。钱就更别提了，他一个六便士都拿不出来。
        - id: ch04-b10
          speaker: farm_goody
          text: 天哪，他怎么能穷成这样！楼上明明还放着满满一柜旧衣服，都是他留下的。那边还有一大箱钱呢。劳您把这些都捎给他吧，我再给您一匹马和一辆车。马也送给他，他坐车四处去，就不用一家一家走得那么辛苦了。
        - id: ch04-b11
          speaker: narrator
          text: 大嫂让男人把旧衣服装了满满一车，又搬上那只沉甸甸的钱箱，里面全是亮闪闪的银元。她还拿出许多吃的喝的，任他享用。等想要的东西全到手，男人便跳上马车，赶着黑马离开了。
        - id: ch04-b12
          speaker: man
          text: 第三个也找到了。
        - id: ch04-b13
          speaker: narrator
          text: 大嫂的第三任丈夫正在附近犁地。他看见陌生人赶走自家的马车，连忙回去问妻子，那人究竟是谁。
        - id: ch04-b14
          speaker: farm_goody
          text: 原来你问他呀。他从天堂来，说我亲爱的第二任丈夫彼得在那里受苦，每天讨饭，没有衣服，也没有钱。我就把彼得留下的衣服和那箱银元，全托他带去了。
        - id: ch04-b15
          speaker: narrator
          text: 第三任丈夫立刻明白，妻子受了骗。他给自己的马套上鞍，飞奔着追了出去。前面的男人见他越追越近，便把马车赶进路边的灌木丛。他从拉车的马尾上拔下一把毛，跑到林子里的小土坡上，把马尾毛绑在一棵白桦树上。随后，他躺在树下，眼睛一眨不眨地望着天空。
    - id: ch05
      title: 谁也不比谁聪明
      blocks:
        - id: ch05-b01
          speaker: man
          text: 哎呀呀，我真是活见鬼了！这样的怪事，我一辈子也没见过！
          emotion: surprised
        - id: ch05-b02
          speaker: narrator
          text: 第三任彼得刚好骑马赶到。他站着观察了好一会儿，怎么也想不通这人为何躺在地上。
        - id: ch05-b03
          speaker: peter_third
          text: 你躺在这儿，究竟盯着什么看？
        - id: ch05-b04
          speaker: man
          text: 我从没见过这种事！刚才有个人骑着一匹黑马，笔直飞上天堂去了。你看，马尾巴还挂在白桦树上呢。再往天上看，那匹黑马就在上面。
        - id: ch05-b05
          speaker: narrator
          text: 彼得看看男人，又抬头看看天空。
        - id: ch05-b06
          speaker: peter_third
          text: 我只看得见树上的一把马尾毛，天上根本没有黑马。
        - id: ch05-b07
          speaker: man
          text: 你站的位置不对，当然看不见。躺到我这里来，笔直盯住天空，眼睛千万别移开。只要这样看下去，该看见的自然会出现。
        - id: ch05-b08
          speaker: narrator
          text: 第三任彼得果真躺到那人刚才的位置，仰面死死盯着天空，一刻也不敢移开眼睛，身子也不敢乱动。他盯了又盯，直到两只眼睛都流出泪来。天堂庄来的男人趁这个机会牵走他的马，翻身骑上去，连那匹马和藏在灌木丛里的马车一起带走了。
        - id: ch05-b09
          speaker: narrator
          text: 马蹄在大路上轰隆作响，彼得这才跳起来。看见自己的马也被骗走，他慌得没了主意。等他终于想到该追，早已经来不及了。
        - id: ch05-b10
          speaker: narrator
          text: 彼得垂头丧气地回到农庄。妻子问他，那匹马去了哪里。他只好回答。
        - id: ch05-b11
          speaker: peter_third
          text: 我也把马送给那个人了，让他带给你的第二任丈夫。彼得坐着马车挨家挨户讨饭，实在太不像样。现在他可以卖掉马车，再买一辆四轮轿式马车，以后出门就体面多了。
        - id: ch05-b12
          speaker: farm_goody
          text: 真要好好谢谢你！我以前怎么没发现，你竟然这么好心。
        - id: ch05-b13
          speaker: narrator
          text: 那个男人带着六百块钱、满车衣服和一箱银元回了家。他一看，自家的田已经犁好，种子也全播下去了。他开口就问妻子，种粮是从哪里弄来的。
        - id: ch05-b14
          speaker: wife
          text: 我总听人说，种什么就收什么。所以，我把北方朋友寄存在咱们家的盐全撒进地里了。等下一场雨，它们肯定会长得很好。
        - id: ch05-b15
          speaker: man
          text: 你从前就蠢，这辈子也聪明不了。不过现在没关系了，外面那些人也不比你好多少。你们谁也不比谁强。
