  chapters:
    - id: ch01
      title: The Cow, the Hen, and the Feathers
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Once there was a man and his wife who wanted to sow their fields. They had no seed corn, and no money to buy any. All they had was a cow, so the man was to take her into town, sell her, and use the money for seed.
        - id: ch01-b02
          speaker: narrator
          text: But when the time came, his wife was afraid he would spend the money on drink. She would not let him go. Instead, she set off with the cow herself, taking a hen along too.
        - id: ch01-b03
          speaker: narrator
          text: Near town, she met a butcher.
        - id: ch01-b04
          speaker: butcher
          text: Are you selling that cow, Goody?
        - id: ch01-b05
          speaker: wife
          text: Yes, I certainly am.
        - id: ch01-b06
          speaker: butcher
          text: Then what are you asking for her?
        - id: ch01-b07
          speaker: wife
          text: I must have five shillings for the cow. But you can have the hen for ten pounds.
        - id: ch01-b08
          speaker: butcher
          text: Very well. I don't need the hen, and you should have no trouble selling her once you reach town. But I'll take the cow and pay your five shillings for her.
        - id: ch01-b09
          speaker: narrator
          text: She sold him the cow for five shillings. But no one in town would pay ten pounds for a lean, tough old hen. So back she went to the butcher.
        - id: ch01-b10
          speaker: wife
          text: I've tried everything, master, but no one will buy this hen. Since you took the cow, you'll have to take her too.
        - id: ch01-b11
          speaker: butcher
          text: Come along, then. We'll see what can be done.
        - id: ch01-b12
          speaker: narrator
          text: The butcher gave her meat and drink, and poured her so much brandy that she no longer knew what she was doing. Soon she was fast asleep. While she slept, he dipped her in a barrel of tar and laid her on a heap of feathers.
        - id: ch01-b13
          speaker: narrator
          text: When she woke, feathers covered her from head to foot. She looked at herself and could not understand what had happened or what sort of creature she had become.
        - id: ch01-b14
          speaker: wife
          text: Can this be me? No, it can't be. I must be some great strange bird. But how can I find out? I know! If the calves lick me, and our dog Tray doesn't bark when I get home, then I really am myself.
        - id: ch01-b15
          speaker: narrator
          text: The moment Tray saw the strange creature coming through the gate, he barked as if every rogue and robber in the world had rushed into the yard.
        - id: ch01-b16
          speaker: wife
          text: Oh, dear. Just as I thought. This surely can't be me.
        - id: ch01-b17
          speaker: narrator
          text: She went into the straw yard. The calves smelled the strong tar and would not lick her.
        - id: ch01-b18
          speaker: wife
          text: No, no, I can't be myself. I must be some strange bird from far away.
        - id: ch01-b19
          speaker: narrator
          text: So she crept onto the roof of the storehouse and began flapping her arms as though they were wings. She had decided she was a bird, and now she was ready to fly away. Her husband saw her up there, came outside with his rifle, and took aim.
        - id: ch01-b20
          speaker: wife
          text: Don't shoot! Don't shoot! It's only me!
          emotion: fearful
        - id: ch01-b21
          speaker: husband
          text: If that's you, stop standing on the roof like a goat. Come down here and explain yourself.
        - id: ch01-b22
          speaker: narrator
          text: She crawled down from the roof and told her husband the whole story. But she had no money to show him. The butcher had paid her with a five-shilling crown, and she had thrown it away while she was drunk. The cow was gone, the money was gone, and she had brought home no seed corn.
        - id: ch01-b23
          speaker: husband
          text: You're twice as silly as you were before.
          emotion: angry
        - id: ch01-b24
          speaker: narrator
          text: He was so angry that he decided to leave her. He would not come home until he had found three other Goodies as foolish as his own wife.
    - id: ch02
      title: A Cottage Without Sunlight
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: Off he went. Before long, he saw a woman running in and out of a newly built wooden cottage with an empty sieve. Each time she ran inside, she covered the sieve with her apron as if it held something, then tipped it over onto the floor.
        - id: ch02-b02
          speaker: husband
          text: What are you doing, Goody?
        - id: ch02-b03
          speaker: sun_goody
          text: I'm carrying a little sunshine indoors. Outside, I catch the sun in my sieve. But when I come in and empty it, the sun is gone. My old cottage had plenty of light, and I never carried any in at all. If someone could bring the sun into this cottage, I'd gladly pay three hundred dollars.
        - id: ch02-b04
          speaker: husband
          text: Do you have an axe? Give it to me, and I'll bring the sunshine in.
        - id: ch02-b05
          speaker: narrator
          text: The carpenters had built the new cottage without a single window. The man took the axe and cut openings through the wooden walls. At once, the sunlight came inside without any help from the sieve. The woman gladly paid him three hundred dollars.
        - id: ch02-b06
          speaker: husband
          text: There's the first one.
    - id: ch03
      title: The New Shirt
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: Farther on, he passed a house filled with terrible screams and bellows. He went inside to see what was happening. A woman had pulled a new shirt over her husband's head, but the shirt had no opening for his neck. While the poor man shouted, she kept pounding him on the head with a heavy wooden beetle, trying to drive him through the cloth.
        - id: ch03-b02
          speaker: husband
          text: Goody, are you trying to beat your husband to death?
        - id: ch03-b03
          speaker: shirt_goody
          text: No. I only need to make a hole for his neck to come through.
        - id: ch03-b04
          speaker: shirt_husband
          text: Heaven help anyone who tries on a new shirt! If somebody can show my wife a better way to open the neck, I'll gladly pay three hundred dollars.
        - id: ch03-b05
          speaker: husband
          text: Give me a pair of scissors. I'll do it in a moment.
        - id: ch03-b06
          speaker: narrator
          text: He took the scissors and snipped a hole for the man's neck. Then he collected three hundred dollars and continued on his way.
        - id: ch03-b07
          speaker: husband
          text: There's the second one.
    - id: ch04
      title: A Visitor from Paradise Place
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: At last, the man reached a farm and decided to rest. When he entered the house, the mistress greeted him.
        - id: ch04-b02
          speaker: farm_mistress
          text: Where have you come from, master?
        - id: ch04-b03
          speaker: husband
          text: I've come from Paradise Place.
        - id: ch04-b04
          speaker: narrator
          text: Paradise Place was only the name of his own farm. The woman, however, thought he meant heaven. She had been married three times. Her first and third husbands had been bad, so she had decided that only Peter, her second husband, had gone to heaven.
        - id: ch04-b05
          speaker: farm_mistress
          text: Paradise Place! Then you must know my second husband, Peter. He's dead and gone, God rest his soul.
          emotion: surprised
        - id: ch04-b06
          speaker: husband
          text: Oh, yes. I know him very well.
        - id: ch04-b07
          speaker: farm_mistress
          text: And how is my poor dear Peter getting along?
        - id: ch04-b08
          speaker: husband
          text: Not very well. He begs from door to door. He has no food, no clothes worth wearing, and not a penny to his name.
        - id: ch04-b09
          speaker: farm_mistress
          text: Mercy on me! He shouldn't be going about like that when he left so much here. Upstairs, there's a cupboard full of his old clothes, and over there is a large chest full of money.
          emotion: surprised
        - id: ch04-b10
          speaker: farm_mistress
          text: Please take it all to him. You may use a horse and cart to carry it. Peter can keep the horse and ride on the cart as he goes from house to house. Then he won't have to walk.
        - id: ch04-b11
          speaker: narrator
          text: The woman loaded the old clothes onto the cart, along with the heavy chest full of shining dollars. She gave the man all the meat and drink he wanted as well. Once he had everything, he climbed onto the cart, took the reins, and drove away from the farm.
        - id: ch04-b12
          speaker: husband
          text: There's the third one.
        - id: ch04-b13
          speaker: narrator
          text: The woman's third husband had been plowing in a nearby field. He saw a stranger leaving the farm with the black horse and cart. He hurried home to ask his wife about it.
        - id: ch04-b14
          speaker: third_husband
          text: Who was that man driving away with the black horse?
        - id: ch04-b15
          speaker: farm_mistress
          text: Oh, him? He came from Paradise. He told me my dear second husband, Peter, is in a dreadful state. Poor Peter has to beg from house to house without clothes or money.
        - id: ch04-b16
          speaker: farm_mistress
          text: So I sent him Peter's old clothes and the money chest with all the dollars inside.
        - id: ch04-b17
          speaker: narrator
          text: Her third husband understood at once what had happened. He saddled his riding horse and galloped after the stranger.
    - id: ch05
      title: The Black Horse in the Sky
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: He soon came close behind the cart. The man from Paradise Place saw him coming and drove the cart into a thicket beside the road. He pulled a handful of hair from the cart horse's tail and tied it to a birch on a small rise in the woods. Then he lay beneath it, staring up at the sky.
        - id: ch05-b02
          speaker: husband
          text: Well, if that isn't the strangest thing I've ever seen!
        - id: ch05-b03
          speaker: narrator
          text: The third husband rode up and stopped. For a while, he only watched the man lying under the birch and peering into the sky. He could not imagine what had come over him.
        - id: ch05-b04
          speaker: third_husband
          text: Why are you lying there staring upward?
        - id: ch05-b05
          speaker: husband
          text: I've never seen anything like it! A man has gone straight up to heaven on a black horse. Look, the horse's tail is still caught in that birch. You can see the black horse high in the sky.
        - id: ch05-b06
          speaker: narrator
          text: The third husband looked at the man, then looked into the sky.
        - id: ch05-b07
          speaker: third_husband
          text: All I see is horsehair hanging from the birch. I don't see anything else.
        - id: ch05-b08
          speaker: husband
          text: You can't see it from where you're standing. Lie down here and look straight up. Whatever you do, keep your eyes fixed on the sky. Then you'll see it.
        - id: ch05-b09
          speaker: narrator
          text: The third husband lay in the very spot and stared straight upward. He never took his eyes from the sky, even when they filled with tears. While he kept looking, the man from Paradise Place quietly took the riding horse, jumped onto its back, and rode away with both horses and the cart.
        - id: ch05-b10
          speaker: narrator
          text: Then hoofbeats thundered along the road. The third husband sprang up and found the man gone with his riding horse. By the time he understood the trick and thought of running after him, both horses and the cart were far beyond his reach.
        - id: ch05-b11
          speaker: narrator
          text: He returned home feeling very low. His wife asked what he had done with the riding horse.
        - id: ch05-b12
          speaker: third_husband
          text: I gave that horse to the man for Peter too. It didn't seem right for Peter to sit in a cart and jolt from house to house. Now he can sell the cart and buy himself a coach.
        - id: ch05-b13
          speaker: farm_mistress
          text: Thank you with all my heart! I never knew you could be so kind.
          emotion: happy
    - id: ch06
      title: Not a Pin to Choose Between Them
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: At last, the man reached home. He had six hundred dollars from the first two women, along with the cartload of clothes, the chest of money, and both horses from the farm. When he looked across his land, he saw that every field had already been plowed and sown. The first thing he asked his wife was where she had found the seed corn.
        - id: ch06-b02
          speaker: wife
          text: I've always heard that people reap whatever they sow. So I planted the salt our friends from the north left with us. If it rains, I think it will grow very nicely.
        - id: ch06-b03
          speaker: husband
          text: You are foolish, and foolish you will be all your life. But it makes no difference now. The others are no wiser than you. There isn't a pin to choose between you.
