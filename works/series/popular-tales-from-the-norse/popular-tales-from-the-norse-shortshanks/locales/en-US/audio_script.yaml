  chapters:
    - id: ch01
      title: The Twin Brothers
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Once there was a poor couple living in a hut that was nearly falling down. Hunger filled the place. They had no food and no wood for the fire. Yet every year another child was born to them. As they waited for the next baby, the husband went about grumbling that a family could have too many of God's gifts. When the birth drew near, he set off into the woods for fuel.
        - id: ch01-b02
          speaker: father
          text: I won't stay to see the little screamer. I'll hear him asking for food soon enough.
        - id: ch01-b03
          speaker: narrator
          text: Once he was gone, his wife gave birth to a beautiful boy. The baby looked around the room the moment he entered the world.
        - id: ch01-b04
          speaker: shortshanks
          text: Dear Mother, give me some clothes my brothers have outgrown and enough food for a few days. I'll go into the world and seek my fortune. I can see you have children enough already.
        - id: ch01-b05
          speaker: mother
          text: God help you, my son! You can't do that. You're much too young.
        - id: ch01-b06
          speaker: narrator
          text: The tiny boy kept begging until she gave him a few old rags and a little bundle of food. Then he marched cheerfully out into the wide world. He had barely left when his mother gave birth to another boy. This baby also looked around at once.
        - id: ch01-b07
          speaker: king_sturdy
          text: Dear Mother, give me some of my brother's old clothes and food for a few days. I'll go and find my twin. You have enough children to care for already.
        - id: ch01-b08
          speaker: mother
          text: God help you, my poor little boy! You're far too small. You can't possibly go.
        - id: ch01-b09
          speaker: narrator
          text: But he pleaded until he too got some ragged clothes and a bundle of food. Off he went like a grown man. Before long he saw his brother far ahead and called for him to wait.
        - id: ch01-b10
          speaker: king_sturdy
          text: Hey! Slow down! You're racing along so fast, you didn't even wait to meet your youngest brother before leaving home.
        - id: ch01-b11
          speaker: narrator
          text: The elder boy stopped. When the younger caught up and explained who he was, he had another idea.
        - id: ch01-b12
          speaker: king_sturdy
          text: Let's sit here and see what Mother packed for us.
        - id: ch01-b13
          speaker: narrator
          text: They shared their food and soon became great friends. Farther on, they reached a brook running through a green meadow. The younger said they had left so quickly that no one had named them, so they might as well name each other there.
        - id: ch01-b14
          speaker: shortshanks
          text: What name will you give me?
        - id: ch01-b15
          speaker: king_sturdy
          text: And what would you like to be called?
        - id: ch01-b16
          speaker: shortshanks
          text: My name will be Shortshanks. What will yours be?
        - id: ch01-b17
          speaker: king_sturdy
          text: Call me King Sturdy.
        - id: ch01-b18
          speaker: narrator
          text: So they christened one another in the brook and walked on. At a crossroads they chose separate ways, only to meet again before half a mile had passed. They parted once more, and the roads brought them together again. The same thing happened a third time. At last one chose the east and the other the west. Before they parted, the elder brother gave a warning.
        - id: ch01-b19
          speaker: king_sturdy
          text: If trouble ever overwhelms you, call my name three times and I'll come to help. But don't call unless you have no other hope.
        - id: ch01-b20
          speaker: shortshanks
          text: If that's the rule, I doubt we'll meet again for a long while.
        - id: ch01-b21
          speaker: narrator
          text: They said goodbye. Shortshanks went east, and King Sturdy went west.
    - id: ch02
      title: Three Gifts
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: After traveling alone for some time, Shortshanks met an ancient, crooked old woman with only one eye. He snatched that eye away.
        - id: ch02-b02
          speaker: first_hag
          text: Oh! Where has my eye gone?
          emotion: surprised
        - id: ch02-b03
          speaker: shortshanks
          text: What will you give me if I return it?
        - id: ch02-b04
          speaker: first_hag
          text: I'll give you a sword that can drive off an army, no matter how large it is.
        - id: ch02-b05
          speaker: shortshanks
          text: Hand it over, then.
        - id: ch02-b06
          speaker: narrator
          text: She gave him the sword and got her eye back. Later he met another ancient, crooked woman with one eye. Before she noticed him, he stole hers too.
        - id: ch02-b07
          speaker: second_hag
          text: Oh! Whatever happened to my eye?
          emotion: surprised
        - id: ch02-b08
          speaker: shortshanks
          text: What will you trade me for it?
        - id: ch02-b09
          speaker: second_hag
          text: A ship that can sail on fresh water and salt water, and cross high hills and deep valleys.
        - id: ch02-b10
          speaker: shortshanks
          text: Very well. Give it to me.
        - id: ch02-b11
          speaker: narrator
          text: The woman handed him a ship small enough to fit in his pocket, and he returned her eye. Much later, he met a third ancient, one-eyed woman with a crooked back. He stole her eye as well. She screamed and demanded to know where it had gone.
        - id: ch02-b12
          speaker: shortshanks
          text: What will you give me to have your eye again?
        - id: ch02-b13
          speaker: third_hag
          text: I'll teach you how to brew a hundred lasts of malt in one stroke.
        - id: ch02-b14
          speaker: narrator
          text: She taught him the art, he gave back her eye, and each went on alone.
        - id: ch02-b15
          speaker: narrator
          text: Soon Shortshanks decided to test his tiny ship. He put in one foot, then the other. With the first foot it began to grow. By the time the second was aboard, it was as large as any ship at sea.
        - id: ch02-b16
          speaker: shortshanks
          text: Away you go, over fresh water and salt water, over high hills and deep valleys. Don't stop until you reach the king's palace.
        - id: ch02-b17
          speaker: narrator
          text: The ship flew through the air as swiftly as a bird. It did not stop until it came down a little below the king's palace. People watching from the palace windows had seen Shortshanks sailing toward them. They were so amazed that everyone ran down to discover who could be traveling through the air in a ship. While they were on their way, Shortshanks stepped ashore. The instant he left the ship, it shrank to the same tiny size it had been when the old woman gave it to him, and he slipped it back into his pocket. So when the people arrived, all they found was a ragged little boy standing by the strand. The king asked where he had come from. Shortshanks said he did not know, and he could not tell them how he had reached that place. There he stood, and that was all they could get from him. Then he begged so sweetly for a place in the palace that their hearts softened. He said that if there were no better work for him, he could carry wood and water for the kitchen maid. They gave him leave to stay.
    - id: ch03
      title: The Three Ogres
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: When Shortshanks entered the palace, he saw black cloth hanging everywhere, over the walls and roof, inside and out. He asked the kitchen maid why the whole place was in mourning.
        - id: ch03-b02
          speaker: kitchen_maid
          text: Haven't you heard? Long ago, the king's daughter was promised to three ogres. One of them is coming for her next Thursday evening. Ritter Red claims he can free her, but only God knows whether he can. That's why everyone is grieving.
        - id: ch03-b03
          speaker: narrator
          text: On Thursday evening, Ritter Red led the Princess to the strand, where the Ogre was to meet her. He was supposed to stay and protect her. But the moment she sat down, he climbed a great tree and hid among its branches. She begged him not to leave her.
        - id: ch03-b04
          speaker: ritter_red
          text: Better for one person to die than two.
        - id: ch03-b05
          speaker: narrator
          text: Meanwhile, Shortshanks asked the kitchen maid if he might go to the strand for a little while.
        - id: ch03-b06
          speaker: kitchen_maid
          text: Why would you go down there? You have no business at the strand.
        - id: ch03-b07
          speaker: shortshanks
          text: Please let me go, dear friend. I'd like to run down and play with the other children for a while.
        - id: ch03-b08
          speaker: kitchen_maid
          text: All right, off you go. But be back before I put the supper porridge on the fire and set the roast on the spit. And bring me a good armful of wood.
        - id: ch03-b09
          speaker: narrator
          text: Shortshanks promised to remember every instruction and ran down to the strand. He reached the very place where the Princess was sitting just as the Ogre came tearing toward them in his ship. The vessel drove on so fiercely that the wind roared and howled behind it. The Ogre was so tall and broad that it was dreadful to look at him, and five heads rose from his shoulders.
        - id: ch03-b10
          speaker: five_headed_ogre
          text: Fire and flame!
          emotion: angry
        - id: ch03-b11
          speaker: shortshanks
          text: Fire and flame to you too!
        - id: ch03-b12
          speaker: five_headed_ogre
          text: Do you know how to fight?
        - id: ch03-b13
          speaker: shortshanks
          text: If I don't, I can learn.
        - id: ch03-b14
          speaker: narrator
          text: The Ogre raised the great, thick iron club in his fist and struck at Shortshanks. The blow crashed into the ground with such force that earth and stones flew five yards into the air.
        - id: ch03-b15
          speaker: shortshanks
          text: My, that was quite a blow. Now let me show you one of mine.
        - id: ch03-b16
          speaker: narrator
          text: Shortshanks drew the old woman's sword and struck. All five heads went flying across the sand. The Princess leaped and danced because she was saved.
        - id: ch03-b17
          speaker: younger_princess
          text: Come and rest. You can sleep with your head in my lap for a while.
          emotion: happy
        - id: ch03-b18
          speaker: narrator
          text: Shortshanks lay down with his head in her lap and fell asleep. While he rested, the Princess spread a tinsel robe over him. Ritter Red stayed hidden until he saw that there was nothing left to fear. Then he crept down from the tree and went to the Princess. He threatened her until she promised to tell everyone that he had saved her life. If she refused, he said he would kill her on the spot. After that, he cut out the Ogre's lungs and tongue and wrapped them in his handkerchief. He led the Princess back to the palace as though he had defeated the monster himself. The king knew no limit to the honors he gave Ritter Red. From then on, the supposed hero sat at the king's right hand every day at dinner.
        - id: ch03-b19
          speaker: narrator
          text: Before returning to the kitchen, Shortshanks went aboard the Ogre's ship. He found a whole heap of gold and silver rings, each as large as a hoop. He loaded himself with them and trotted toward the palace as fast as he could. When the kitchen maid saw so much gold and silver in the ragged boy's arms, she was startled and afraid. She could not imagine where he had found such treasure, and she worried that he had not come by it honestly.
        - id: ch03-b20
          speaker: kitchen_maid
          text: Dear Shortshanks, where in the world did you get all that gold and silver?
        - id: ch03-b21
          speaker: shortshanks
          text: I went home for a while. These hoops had fallen from some old pails, so I brought them to you.
        - id: ch03-b22
          speaker: narrator
          text: Once she heard they were a gift for her, she thanked him, and the two were friends again.
        - id: ch03-b23
          speaker: narrator
          text: On the next Thursday evening, the same sorrow filled the palace again. Ritter Red declared that since he had saved the Princess from one ogre, it would be a poor thing if he could not save her from another. He led her down to the strand as boldly as a lion. Yet he did no more against the second Ogre than he had against the first. As soon as the time came to watch for the monster, Ritter Red climbed into his tree and hid among the branches.
        - id: ch03-b24
          speaker: ritter_red
          text: Better for one person to die than two.
        - id: ch03-b25
          speaker: narrator
          text: Shortshanks again begged leave to visit the strand.
        - id: ch03-b26
          speaker: kitchen_maid
          text: What business could you possibly have down there?
        - id: ch03-b27
          speaker: shortshanks
          text: Please, dear friend. I want to play with the other children for a little while.
        - id: ch03-b28
          speaker: narrator
          text: The kitchen maid gave him leave after he promised two things. He must be back by the time the roast needed turning, and he must bring a large bundle of wood with him. Shortshanks had barely reached the shore when the second Ogre came tearing along in his ship. The wind howled and roared all around him. He was twice as large as the first Ogre, and ten heads sat upon his shoulders.
        - id: ch03-b29
          speaker: ten_headed_ogre
          text: Fire and flame!
          emotion: angry
        - id: ch03-b30
          speaker: shortshanks
          text: Fire and flame to you too!
        - id: ch03-b31
          speaker: ten_headed_ogre
          text: Can you fight?
        - id: ch03-b32
          speaker: shortshanks
          text: If I can't, I can learn.
        - id: ch03-b33
          speaker: narrator
          text: The Ogre brought down an even larger iron club, and earth and stones flew ten yards high.
        - id: ch03-b34
          speaker: shortshanks
          text: My, that was a proper blow. Now watch what mine can do.
        - id: ch03-b35
          speaker: narrator
          text: Shortshanks gripped the sword he had won from the old woman. With one stroke, he cut off all ten of the Ogre's heads and sent them dancing away over the sand. Once more the Princess invited her rescuer to lie down and rest with his head in her lap. Shortshanks fell asleep there, and while he slept, she spread a silver robe over him.
        - id: ch03-b36
          speaker: narrator
          text: Ritter Red watched from the branches until he saw that no danger remained. Then he crept down, threatened the Princess, and forced her to give her word that she would say he had freed her. He cut the lungs and tongue from the fallen Ogre, wrapped them in his handkerchief, and led the Princess back to the palace. Mirth and joy filled every room. The king was at his wits' end trying to think of enough honors and favors for Ritter Red.
        - id: ch03-b37
          speaker: narrator
          text: Shortshanks again visited the defeated Ogre's ship and took a whole armful of gold and silver rings. When he returned to the palace, the kitchen maid clapped her hands in wonder and asked where he had found so much treasure. Shortshanks said he had gone home for a while. The rings, he claimed, were only hoops that had fallen from some old pails. He had gathered them up for his friend the kitchen maid. Once she heard they were meant for her, she asked no more questions.
    - id: ch04
      title: The Golden Robe
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: On the third Thursday evening, everything happened just as it had twice before. Black cloth covered the whole palace, and everyone went about mourning and weeping. Ritter Red said he could not understand why they were so afraid. He had freed the Princess from two ogres, he boasted, and he could certainly free her from a third. He led her down to the strand as if he meant every word. But when the hour of the Ogre's arrival drew near, Ritter Red crept into the same tree and hid himself. The Princess begged and pleaded with him to stay beside her, but nothing she said could move him.
        - id: ch04-b02
          speaker: ritter_red
          text: Better for one person to die than two.
        - id: ch04-b03
          speaker: narrator
          text: Shortshanks asked the kitchen maid for permission to go down to the strand again.
        - id: ch04-b04
          speaker: kitchen_maid
          text: What keeps drawing you down there?
        - id: ch04-b05
          speaker: narrator
          text: He pleaded until she agreed, on condition that he return when the roast had to be turned. Shortshanks reached the shore just as the third Ogre arrived with the wind roaring behind him. He was far larger than the others and had fifteen heads.
        - id: ch04-b06
          speaker: fifteen_headed_ogre
          text: Fire and flame!
          emotion: angry
        - id: ch04-b07
          speaker: shortshanks
          text: Fire and flame to you too!
        - id: ch04-b08
          speaker: fifteen_headed_ogre
          text: Can you fight?
        - id: ch04-b09
          speaker: shortshanks
          text: If I can't, I can learn.
        - id: ch04-b10
          speaker: fifteen_headed_ogre
          text: Then I'll teach you soon enough!
          emotion: angry
        - id: ch04-b11
          speaker: narrator
          text: His iron club struck so hard that earth and stones flew fifteen yards into the air.
        - id: ch04-b12
          speaker: shortshanks
          text: My, that was quite a blow. Now you'll see one of mine.
        - id: ch04-b13
          speaker: narrator
          text: Shortshanks took a firm hold on his sword and struck. With that single blow, all fifteen of the Ogre's heads flew from his shoulders and went dancing away over the sand. The third and last Ogre was dead. The Princess knew she was finally free from all three monsters. She blessed Shortshanks and thanked him again and again for saving her life.
        - id: ch04-b14
          speaker: younger_princess
          text: Rest with your head in my lap for a while.
        - id: ch04-b15
          speaker: narrator
          text: While he slept, she covered him with a golden robe. When he woke, she asked how they could make everyone know that he was her true rescuer.
        - id: ch04-b16
          speaker: shortshanks
          text: Ritter Red will lead you home and claim that he saved you. He expects to marry you and receive half the kingdom. On the wedding day, they'll ask whom you want as cupbearer. Choose the ragged boy who carries wood and water for the kitchen maid. When I pour the wine, I'll spill one drop on Ritter Red's plate and none on yours. He'll strike me, and it will happen three times. On the third, say, "Shame on you for striking my heart's darling! He set me free, and he is the one I'll marry."
        - id: ch04-b17
          speaker: narrator
          text: Once their plan was settled, Shortshanks ran back toward the palace as he had done after the other battles. Before returning to the kitchen, he climbed aboard the third Ogre's ship. There he found a great heap of gold and silver, along with precious stones. He gathered what he could carry and brought the kitchen maid another huge armful of gold and silver rings.
        - id: ch04-b18
          speaker: narrator
          text: Ritter Red watched from his hiding place until he was certain every danger had passed. Then he crept down and threatened the Princess once again. She was forced to promise that she would name him as the man who had saved her. Ritter Red led her back to the palace and accepted all the praise. The honors he had received before were nothing beside what the king gave him now. The king could think of nothing except how to reward the man he believed had saved his daughter from all three ogres. He declared that the marriage and the gift of half the kingdom were settled.
        - id: ch04-b19
          speaker: narrator
          text: On the wedding day, the Princess asked for the ragged kitchen boy as her cupbearer.
        - id: ch04-b20
          speaker: ritter_red
          text: Why would you bring that filthy beggar boy in here?
          emotion: disgusted
        - id: ch04-b21
          speaker: narrator
          text: The Princess had a will of her own. She insisted that the ragged boy must pour her wine, and that she would accept no one else. At last, she got her way. Everything then happened exactly as she and Shortshanks had arranged. He filled their cups and spilled one drop of wine on Ritter Red's plate, while not a drop touched hers. Ritter Red grew angry and struck him. When the first blow landed, the rags Shortshanks had worn in the kitchen fell away. Shortshanks served them again, spilled another drop on Ritter Red's plate, and received a second blow. This time the tinsel robe fell from him. At the third spill, Ritter Red struck him once more. The silver robe dropped away, and Shortshanks stood before them in the golden robe, gleaming and glittering in the light.
        - id: ch04-b22
          speaker: younger_princess
          text: Shame on you for striking my heart's darling! He saved me, and he is the one I'll marry!
          emotion: angry
        - id: ch04-b23
          speaker: narrator
          text: Ritter Red cursed and swore that he was the true rescuer. The king spoke up.
        - id: ch04-b24
          speaker: king
          text: The man who saved my daughter must have some proof.
        - id: ch04-b25
          speaker: narrator
          text: Ritter Red claimed that he had proof and ran at once to fetch his handkerchief, with the lungs and tongues wrapped inside. Shortshanks went for all the gold, silver, jewels, and other precious things he had carried from the ogres' ships. Each man laid his tokens before the king and waited for his judgment.
        - id: ch04-b26
          speaker: king
          text: Whoever owns such stores of gold, silver, and diamonds must have slain the ogres and taken their treasure. Riches like these can come from nowhere else.
        - id: ch04-b27
          speaker: narrator
          text: The truth could no longer be hidden. Ritter Red was seized and thrown into a pit filled with snakes. The king declared that Shortshanks would marry the Princess and receive half the kingdom, just as he had promised to the man who saved her.
    - id: ch05
      title: Beneath the Sea
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: One day, after the truth about Ritter Red had been settled, Shortshanks and the king went out walking together. As they walked, Shortshanks asked the king whether he had any children besides the younger Princess.
        - id: ch05-b02
          speaker: king
          text: I had another daughter, but an ogre carried her away when no one could save her. You are to marry one daughter. If you can free the other, you may marry her too, and I'll give you the other half of my kingdom.
        - id: ch05-b03
          speaker: shortshanks
          text: I may as well try. I'll need an iron cable five hundred fathoms long, five hundred men, and enough food to feed them for fifteen weeks. It will be a long voyage.
        - id: ch05-b04
          speaker: king
          text: You shall have all of it. But I fear there isn't a ship in my kingdom large enough to carry such a load.
        - id: ch05-b05
          speaker: shortshanks
          text: If that's the only trouble, I have a ship of my own.
        - id: ch05-b06
          speaker: narrator
          text: With that, Shortshanks pulled from his pocket the ship he had received from the old one-eyed woman. The king looked at the tiny thing and laughed because he thought the whole business must be a joke. Shortshanks only asked him to gather everything he had requested. Then the king would soon see whether he was joking. The iron cable, the five hundred men, and fifteen weeks of food were all brought together. Shortshanks told them to put the cable aboard first. But no one man was strong enough to lift it, and the ship was so small that there was no room for more than one man to stand around it at a time.
        - id: ch05-b07
          speaker: narrator
          text: Shortshanks took hold of one end of the cable himself. He laid one iron link in the ship, then another. As each link went aboard, the little vessel grew larger and larger beneath it. Shortshanks kept feeding in the cable until the ship had grown to an enormous size. By then there was more than enough room for the whole cable, all five hundred men, their food for fifteen weeks, and Shortshanks as well.
        - id: ch05-b08
          speaker: shortshanks
          text: Away we go, over fresh water and salt water, over high hills and deep valleys. Don't stop until we reach the king's daughter.
        - id: ch05-b09
          speaker: narrator
          text: At once the ship set off over land and sea, and the wind whistled behind it. It sailed far, far away, carrying all five hundred men and the heavy cable. At last, when there was nothing around them but sea, the ship came to a complete stop in the middle of the water.
        - id: ch05-b10
          speaker: shortshanks
          text: We've made it this far. Getting back will be another matter.
        - id: ch05-b11
          speaker: narrator
          text: He tied one end of the cable around his waist and spoke to the men.
        - id: ch05-b12
          speaker: shortshanks
          text: I must go to the bottom. When I tug hard on the cable, pull with all your strength. If you don't, your lives will be lost along with mine.
        - id: ch05-b13
          speaker: narrator
          text: With those words, Shortshanks leaped overboard and dived. The yellow waves rose and curled around him in a swirling eddy. He sank and sank, with the iron cable trailing behind him, until at last he reached the bottom of the sea. There he saw a great rock rising before him, and in the rock was a door. Shortshanks opened it and stepped inside. Beyond the door, he found the king's elder daughter sitting alone and sewing. The moment she saw him, she clasped her hands together and cried out.
        - id: ch05-b14
          speaker: elder_princess
          text: Thank God! You're the first Christian man I've seen since I came here.
          emotion: surprised
        - id: ch05-b15
          speaker: shortshanks
          text: That's good, because I've come to take you home.
        - id: ch05-b16
          speaker: elder_princess
          text: You'll never manage it. If the Ogre sees you, he'll kill you where you stand.
          emotion: fearful
        - id: ch05-b17
          speaker: shortshanks
          text: I'm glad you mentioned him. I'd very much like to meet this Ogre. Where is he?
        - id: ch05-b18
          speaker: narrator
          text: The Princess told him that the Ogre was away searching for someone who could brew a hundred lasts of malt in one stroke. He meant to hold a great feast, and anything less than that enormous amount of drink would not be enough for all his guests.
        - id: ch05-b19
          speaker: shortshanks
          text: I can do that.
        - id: ch05-b20
          speaker: elder_princess
          text: If only he weren't so quick-tempered, I could tell him about you. I'm afraid he'll tear you apart before I can explain. Wait, I know. Hide in that side room, and we'll take our chance.
          emotion: fearful
        - id: ch05-b21
          speaker: narrator
          text: Shortshanks followed her advice and slipped into the side room. He had barely hidden himself when the Ogre returned and came inside.
        - id: ch05-b22
          speaker: sea_ogre
          text: Huf! I smell the horrible blood of a Christian man!
          emotion: disgusted
        - id: ch05-b23
          speaker: elder_princess
          text: You do smell it. A bird flew over with a Christian man's bone in its beak and dropped it down the chimney. I hurried to throw it out, but the smell must still be here.
        - id: ch05-b24
          speaker: sea_ogre
          text: Ah, that would explain it.
        - id: ch05-b25
          speaker: narrator
          text: The Ogre accepted her story. Then the Princess asked whether he had managed to find anyone who could brew a hundred lasts of malt with one stroke.
        - id: ch05-b26
          speaker: sea_ogre
          text: No. I can't find anyone who knows how.
        - id: ch05-b27
          speaker: elder_princess
          text: A man came here earlier and said he could do it.
        - id: ch05-b28
          speaker: sea_ogre
          text: What wisdom! Why did you let him leave when you knew he was exactly the man I needed?
          emotion: angry
        - id: ch05-b29
          speaker: elder_princess
          text: I didn't let him leave. Father's temper can be hot, so I hid him in the side room. If you found no one else, he's still here.
        - id: ch05-b30
          speaker: sea_ogre
          text: Then bring him in.
        - id: ch05-b31
          speaker: narrator
          text: At the Ogre's command, Shortshanks stepped out of the side room and came before him. The Ogre looked him over and asked whether it was really true that he could brew a hundred lasts of malt in one stroke.
        - id: ch05-b32
          speaker: shortshanks
          text: Yes, I can.
        - id: ch05-b33
          speaker: sea_ogre
          text: Then I was lucky to catch you. Start at once, and heaven help you if the ale isn't strong enough.
          emotion: angry
        - id: ch05-b34
          speaker: shortshanks
          text: Don't worry. It will have plenty of sting.
        - id: ch05-b35
          speaker: narrator
          text: Shortshanks began the work at once and brewed without making any fuss. But in the midst of it, he suddenly stopped and called out that something was wrong.
        - id: ch05-b36
          speaker: shortshanks
          text: I need more ogres to help. The ones here aren't nearly strong enough.
        - id: ch05-b37
          speaker: narrator
          text: The Ogre brought in more helpers. Still Shortshanks demanded others, until a whole swarm of ogres crowded around the brewing. With so many hands, the work went forward quickly. When the sweet wort was ready, every ogre was eager to taste it. The great Ogre drank first, and then all his kith and kin took their turns. But Shortshanks had brewed the wort with such strength that the moment each ogre tasted it, down that ogre fell, dead like a fly. One after another they dropped until not a single one remained alive. Only a vile old ogress was left. She was bedridden and lay in the chimney corner, too frail to join the others at the copper.
        - id: ch05-b38
          speaker: shortshanks
          text: You poor old creature. You may as well taste the wort with the others.
        - id: ch05-b39
          speaker: narrator
          text: Shortshanks took a scoop and dipped it deep into the bottom of the copper. He carried the drink to the old ogress and made sure she tasted it. She died like all the others, and that was the end of the entire pack.
    - id: ch06
      title: The Two Brides
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: With the ogres gone, Shortshanks stood in their dwelling and looked around him. His eye fell on a great chest. He took it and filled it to the top with gold and silver. Then he fastened the iron cable around himself, the elder Princess, and the heavy chest so that none of them would be left behind. Shortshanks gave the cable a strong tug. Far above, the five hundred men felt his signal and hauled with all their strength. They pulled Shortshanks, the Princess, and the treasure up through the sea and brought them safely aboard the ship.
        - id: ch06-b02
          speaker: shortshanks
          text: Away we go, over fresh water and salt water, over high hills and deep valleys. Don't stop until we reach the king's palace.
        - id: ch06-b03
          speaker: narrator
          text: The ship turned at once and held its course for home. It sped over the water while the yellow waves foamed around its sides. At last, the people in the palace saw the great vessel sailing toward them. They wasted no time. Songs and music greeted the travelers as they came ashore, and everyone welcomed Shortshanks with joy. The king was happier than anyone, because the daughter he had lost had finally been brought home to him.
        - id: ch06-b04
          speaker: narrator
          text: Before long, however, Shortshanks became downhearted. Both princesses wanted him for a husband, and he would marry no one but the younger sister, the one he had rescued first. Still, he wanted to do something that would please the elder sister. He walked back and forth, thinking hard about what he should do. Then King Sturdy came into his mind. The twin brothers looked so alike that no one could tell one from the other. Shortshanks thought he could give the elder Princess and half the kingdom to his brother. One princess and one half of the kingdom were quite enough for him.
        - id: ch06-b05
          speaker: narrator
          text: As soon as the plan occurred to him, Shortshanks went outside the palace and called for King Sturdy. No one came. He remembered their agreement and called a second time, raising his voice, but still his brother did not appear. Then Shortshanks called "King Sturdy" for the third time, shouting the name with all his might. In that very moment, his twin stood before him.
        - id: ch06-b06
          speaker: king_sturdy
          text: Didn't I tell you not to call unless you were in desperate need? There isn't even a gnat here to hurt you!
          emotion: angry
        - id: ch06-b07
          speaker: narrator
          text: King Sturdy struck him so hard across the ear that Shortshanks tumbled head over heels on the grass.
        - id: ch06-b08
          speaker: shortshanks
          text: Shame on you for hitting so hard! First I won a princess and half the kingdom. Then I won another princess and the other half. I meant to give you one princess and half the kingdom. What sense is there in striking me for that?
        - id: ch06-b09
          speaker: narrator
          text: King Sturdy listened and understood that Shortshanks had called because he wanted to share everything he had won. He immediately begged his brother to forgive the blow. The quarrel ended there, and the twins were soon as good friends as they had ever been.
        - id: ch06-b10
          speaker: shortshanks
          text: We look so much alike that no one can tell us apart. Change clothes with me and go into the palace. The princesses will think you're me. Whichever one kisses you first will be your wife, and I'll marry the other.
        - id: ch06-b11
          speaker: narrator
          text: Shortshanks proposed this because he knew that the elder king's daughter was the bigger and stronger of the two, and he could guess how the choice would go. King Sturdy was willing enough to try. The brothers exchanged clothes, and King Sturdy walked into the palace dressed as Shortshanks. When he entered the princesses' chamber, both sisters mistook him for his twin. They ran toward him at the same time, each eager to kiss him first. But the elder Princess used her greater strength. She pushed her younger sister aside, threw both arms around King Sturdy's neck, and gave him the first kiss.
        - id: ch06-b12
          speaker: narrator
          text: In that way, King Sturdy received the elder Princess for his wife, while Shortshanks married the younger Princess he had always chosen. The palace made ready for their wedding. It was such a grand celebration that its fame spread far beyond the kingdom, until people were talking about it in seven kingdoms.
