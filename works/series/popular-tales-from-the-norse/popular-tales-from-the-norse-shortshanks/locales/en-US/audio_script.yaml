  chapters:
    - id: ch01
      title: The Twin Brothers
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Once there was a poor couple living in a hut that was nearly falling down. Hunger filled the place. They had no food and no wood for the fire. Yet every year another child was born to them. As they waited for the next baby, the husband went about grumbling that a family could have too many of God's gifts. When the birth drew near, he set off into the woods for fuel.
        - id: ch01-b02
          speaker: father
          text: I won't stay to see the little screamer. I'll hear him asking for food soon enough.
        - id: ch01-b03
          speaker: narrator
          text: Once he was gone, his wife gave birth to a beautiful boy. The baby looked around the room the moment he entered the world.
        - id: ch01-b04
          speaker: shortshanks
          text: Dear Mother, give me some clothes my brothers have outgrown and enough food for a few days. I'll go into the world and seek my fortune. I can see you have children enough already.
        - id: ch01-b05
          speaker: mother
          text: God help you, my son! You can't do that. You're much too young.
        - id: ch01-b06
          speaker: narrator
          text: The tiny boy kept begging until she gave him a few old rags and a little bundle of food. Then he marched cheerfully out into the wide world. He had barely left when his mother gave birth to another boy. This baby also looked around at once.
        - id: ch01-b07
          speaker: king_sturdy
          text: Dear Mother, give me some of my brother's old clothes and food for a few days. I'll go and find my twin. You have enough children to care for already.
        - id: ch01-b08
          speaker: mother
          text: God help you, my poor little boy! You're far too small. You can't possibly go.
        - id: ch01-b09
          speaker: narrator
          text: But he pleaded until he too got some ragged clothes and a bundle of food. Off he went like a grown man. Before long he saw his brother far ahead and called for him to wait.
        - id: ch01-b10
          speaker: king_sturdy
          text: Hey! Slow down! You're racing along so fast, you didn't even wait to meet your youngest brother before leaving home.
        - id: ch01-b11
          speaker: narrator
          text: The elder boy stopped. When the younger caught up and explained who he was, he had another idea.
        - id: ch01-b12
          speaker: king_sturdy
          text: Let's sit here and see what Mother packed for us.
        - id: ch01-b13
          speaker: narrator
          text: They shared their food and soon became great friends. Farther on, they reached a brook running through a green meadow. The younger said they had left so quickly that no one had named them, so they might as well name each other there.
        - id: ch01-b14
          speaker: shortshanks
          text: What name will you give me?
        - id: ch01-b15
          speaker: king_sturdy
          text: And what would you like to be called?
        - id: ch01-b16
          speaker: shortshanks
          text: My name will be Shortshanks. What will yours be?
        - id: ch01-b17
          speaker: king_sturdy
          text: Call me King Sturdy.
        - id: ch01-b18
          speaker: narrator
          text: So they christened one another in the brook and walked on. At a crossroads they chose separate ways, only to meet again before half a mile had passed. They parted once more, and the roads brought them together again. The same thing happened a third time. At last one chose the east and the other the west. Before they parted, the elder brother gave a warning.
        - id: ch01-b19
          speaker: king_sturdy
          text: If trouble ever overwhelms you, call my name three times and I'll come to help. But don't call unless you have no other hope.
        - id: ch01-b20
          speaker: shortshanks
          text: If that's the rule, I doubt we'll meet again for a long while.
        - id: ch01-b21
          speaker: narrator
          text: They said goodbye. Shortshanks went east, and King Sturdy went west.
    - id: ch02
      title: Three Gifts
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: After traveling alone for some time, Shortshanks met an ancient, crooked old woman with only one eye. He snatched that eye away.
        - id: ch02-b02
          speaker: first_hag
          text: Oh! Where has my eye gone?
          emotion: surprised
        - id: ch02-b03
          speaker: shortshanks
          text: What will you give me if I return it?
        - id: ch02-b04
          speaker: first_hag
          text: I'll give you a sword that can drive off an army, no matter how large it is.
        - id: ch02-b05
          speaker: shortshanks
          text: Hand it over, then.
        - id: ch02-b06
          speaker: narrator
          text: She gave him the sword and got her eye back. Later he met another ancient, crooked woman with one eye. Before she noticed him, he stole hers too.
        - id: ch02-b07
          speaker: second_hag
          text: Oh! Whatever happened to my eye?
          emotion: surprised
        - id: ch02-b08
          speaker: shortshanks
          text: What will you trade me for it?
        - id: ch02-b09
          speaker: second_hag
          text: A ship that can sail on fresh water and salt water, and cross high hills and deep valleys.
        - id: ch02-b10
          speaker: shortshanks
          text: Very well. Give it to me.
        - id: ch02-b11
          speaker: narrator
          text: The woman handed him a ship small enough to fit in his pocket, and he returned her eye. Much later, he met a third ancient, one-eyed woman with a crooked back. He stole her eye as well. She screamed and demanded to know where it had gone.
        - id: ch02-b12
          speaker: shortshanks
          text: What will you give me to have your eye again?
        - id: ch02-b13
          speaker: third_hag
          text: I'll teach you how to brew a hundred lasts of malt in one stroke.
        - id: ch02-b14
          speaker: narrator
          text: She taught him the art, he gave back her eye, and each went on alone.
        - id: ch02-b15
          speaker: narrator
          text: Soon Shortshanks decided to test his tiny ship. He put in one foot, then the other. With the first foot it began to grow. By the time the second was aboard, it was as large as any ship at sea.
        - id: ch02-b16
          speaker: shortshanks
          text: Away you go, over fresh water and salt water, over high hills and deep valleys. Don't stop until you reach the king's palace.
        - id: ch02-b17
          speaker: narrator
          text: The ship flew as swiftly as a bird and landed below the palace. People watching from the windows hurried down in amazement. Before they arrived, Shortshanks stepped ashore, and the ship shrank small enough for his pocket. The people found only a ragged little boy by the water. The king asked where he came from, but Shortshanks said he did not know and could not explain how he had arrived. He begged for work in the palace and offered to carry wood and water for the kitchen maid. His plea touched them, and they let him stay.
    - id: ch03
      title: The Three Ogres
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: When Shortshanks entered the palace, he saw black cloth hanging everywhere, over the walls and roof, inside and out. He asked the kitchen maid why the whole place was in mourning.
        - id: ch03-b02
          speaker: kitchen_maid
          text: Haven't you heard? Long ago, the king's daughter was promised to three ogres. One of them is coming for her next Thursday evening. Ritter Red claims he can free her, but only God knows whether he can. That's why everyone is grieving.
        - id: ch03-b03
          speaker: narrator
          text: On Thursday evening, Ritter Red led the Princess to the strand, where the Ogre was to meet her. He was supposed to stay and protect her. But the moment she sat down, he climbed a great tree and hid among its branches. She begged him not to leave her.
        - id: ch03-b04
          speaker: ritter_red
          text: Better for one person to die than two.
        - id: ch03-b05
          speaker: narrator
          text: Meanwhile, Shortshanks asked the kitchen maid if he might go to the strand for a little while.
        - id: ch03-b06
          speaker: kitchen_maid
          text: Why would you go down there? You have no business at the strand.
        - id: ch03-b07
          speaker: shortshanks
          text: Please let me go, dear friend. I'd like to run down and play with the other children for a while.
        - id: ch03-b08
          speaker: kitchen_maid
          text: All right, off you go. But be back before I put the supper porridge on the fire and set the roast on the spit. And bring me a good armful of wood.
        - id: ch03-b09
          speaker: narrator
          text: Shortshanks promised and ran to the strand. Just as he reached the Princess, the Ogre came tearing along in his ship, with the wind roaring behind him. He was terribly tall and broad, and five heads rose from his shoulders.
        - id: ch03-b10
          speaker: five_headed_ogre
          text: Fire and flame!
          emotion: angry
        - id: ch03-b11
          speaker: shortshanks
          text: Fire and flame to you too!
        - id: ch03-b12
          speaker: five_headed_ogre
          text: Do you know how to fight?
        - id: ch03-b13
          speaker: shortshanks
          text: If I don't, I can learn.
        - id: ch03-b14
          speaker: narrator
          text: The Ogre swung the thick iron club in his fist. Earth and stones flew five yards into the air where it struck.
        - id: ch03-b15
          speaker: shortshanks
          text: My, that was quite a blow. Now let me show you one of mine.
        - id: ch03-b16
          speaker: narrator
          text: Shortshanks drew the old woman's sword and struck. All five heads went flying across the sand. The Princess leaped and danced because she was saved.
        - id: ch03-b17
          speaker: younger_princess
          text: Come and rest. You can sleep with your head in my lap for a while.
          emotion: happy
        - id: ch03-b18
          speaker: narrator
          text: While Shortshanks slept, she covered him with a tinsel robe. Once Ritter Red saw that the danger was gone, he crept down from the tree. He threatened to kill the Princess unless she said that he had saved her. Then he cut out the Ogre's lungs and tongue, wrapped them in his handkerchief, and led her home. The king showered him with honors and seated him at his right hand every day at dinner.
        - id: ch03-b19
          speaker: narrator
          text: Shortshanks boarded the Ogre's ship first. He gathered gold and silver rings as large as hoops and hurried back to the palace. The sight of them frightened the kitchen maid. She feared he had stolen them.
        - id: ch03-b20
          speaker: kitchen_maid
          text: Dear Shortshanks, where in the world did you get all that gold and silver?
        - id: ch03-b21
          speaker: shortshanks
          text: I went home for a while. These hoops had fallen from some old pails, so I brought them to you.
        - id: ch03-b22
          speaker: narrator
          text: Once she heard they were a gift for her, she thanked him, and the two were friends again.
        - id: ch03-b23
          speaker: narrator
          text: The next Thursday brought the same sorrow. Ritter Red boasted that after saving the Princess once, he could surely save her again. He led her boldly to the strand. But when the second Ogre was due, Ritter Red climbed back into his tree.
        - id: ch03-b24
          speaker: ritter_red
          text: Better for one person to die than two.
        - id: ch03-b25
          speaker: narrator
          text: Shortshanks again begged leave to visit the strand.
        - id: ch03-b26
          speaker: kitchen_maid
          text: What business could you possibly have down there?
        - id: ch03-b27
          speaker: shortshanks
          text: Please, dear friend. I want to play with the other children for a little while.
        - id: ch03-b28
          speaker: narrator
          text: She let him go after he promised to return when the roast needed turning and to bring back a large bundle of wood. He had barely reached the shore when the Ogre's ship tore in through the howling wind. This Ogre was twice the size of the first, with ten heads.
        - id: ch03-b29
          speaker: ten_headed_ogre
          text: Fire and flame!
          emotion: angry
        - id: ch03-b30
          speaker: shortshanks
          text: Fire and flame to you too!
        - id: ch03-b31
          speaker: ten_headed_ogre
          text: Can you fight?
        - id: ch03-b32
          speaker: shortshanks
          text: If I can't, I can learn.
        - id: ch03-b33
          speaker: narrator
          text: The Ogre brought down an even larger iron club, and earth and stones flew ten yards high.
        - id: ch03-b34
          speaker: shortshanks
          text: My, that was a proper blow. Now watch what mine can do.
        - id: ch03-b35
          speaker: narrator
          text: One sweep of the sword cut off all ten heads and sent them dancing across the sand. The Princess invited Shortshanks to sleep with his head in her lap. As he slept, she laid a silver robe over him.
        - id: ch03-b36
          speaker: narrator
          text: Ritter Red waited until all danger had passed, then came down and forced the Princess to name him as her rescuer. He took the Ogre's lungs and tongue and brought her home. The palace rang with joy, and the king could hardly think of enough honors to give him.
        - id: ch03-b37
          speaker: narrator
          text: Shortshanks gathered another armful of gold and silver rings from the Ogre's ship. The kitchen maid clapped her hands when she saw them and asked where they came from. He gave the same tale about hoops from old pails at home and said they were for her.
    - id: ch04
      title: The Golden Robe
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: On the third Thursday, black cloth covered the palace again, and everyone wept. Ritter Red claimed there was no reason to fear. He said that after freeing the Princess from two ogres, he could free her from a third. Yet when the hour came, he hid in the tree once more. The Princess pleaded with him in vain.
        - id: ch04-b02
          speaker: ritter_red
          text: Better for one person to die than two.
        - id: ch04-b03
          speaker: narrator
          text: Shortshanks asked the kitchen maid for permission to go down to the strand again.
        - id: ch04-b04
          speaker: kitchen_maid
          text: What keeps drawing you down there?
        - id: ch04-b05
          speaker: narrator
          text: He pleaded until she agreed, on condition that he return when the roast had to be turned. Shortshanks reached the shore just as the third Ogre arrived with the wind roaring behind him. He was far larger than the others and had fifteen heads.
        - id: ch04-b06
          speaker: fifteen_headed_ogre
          text: Fire and flame!
          emotion: angry
        - id: ch04-b07
          speaker: shortshanks
          text: Fire and flame to you too!
        - id: ch04-b08
          speaker: fifteen_headed_ogre
          text: Can you fight?
        - id: ch04-b09
          speaker: shortshanks
          text: If I can't, I can learn.
        - id: ch04-b10
          speaker: fifteen_headed_ogre
          text: Then I'll teach you soon enough!
          emotion: angry
        - id: ch04-b11
          speaker: narrator
          text: His iron club struck so hard that earth and stones flew fifteen yards into the air.
        - id: ch04-b12
          speaker: shortshanks
          text: My, that was quite a blow. Now you'll see one of mine.
        - id: ch04-b13
          speaker: narrator
          text: Shortshanks swung his sword once. All fifteen heads flew off and went dancing over the sand. At last the Princess was free from all three ogres. She blessed Shortshanks and thanked him for saving her life.
        - id: ch04-b14
          speaker: younger_princess
          text: Rest with your head in my lap for a while.
        - id: ch04-b15
          speaker: narrator
          text: While he slept, she covered him with a golden robe. When he woke, she asked how they could make everyone know that he was her true rescuer.
        - id: ch04-b16
          speaker: shortshanks
          text: Ritter Red will lead you home and claim that he saved you. He expects to marry you and receive half the kingdom. On the wedding day, they'll ask whom you want as cupbearer. Choose the ragged boy who carries wood and water for the kitchen maid. When I pour the wine, I'll spill one drop on Ritter Red's plate and none on yours. He'll strike me, and it will happen three times. On the third, say, "Shame on you for striking my heart's darling! He set me free, and he is the one I'll marry."
        - id: ch04-b17
          speaker: narrator
          text: Shortshanks hurried back toward the palace, but first he boarded the Ogre's ship. He took gold, silver, and precious stones, and gave the kitchen maid one more great armful of rings.
        - id: ch04-b18
          speaker: narrator
          text: Ritter Red came down only when the danger was gone. Again, he threatened the Princess until she promised to call him her rescuer. He led her home, and the king honored him more richly than ever. The king declared that Ritter Red would marry his daughter and receive half the kingdom.
        - id: ch04-b19
          speaker: narrator
          text: On the wedding day, the Princess asked for the ragged kitchen boy as her cupbearer.
        - id: ch04-b20
          speaker: ritter_red
          text: Why would you bring that filthy beggar boy in here?
          emotion: disgusted
        - id: ch04-b21
          speaker: narrator
          text: The Princess insisted that no one else would pour her wine, and at last she got her way. Shortshanks spilled a drop on Ritter Red's plate but none on hers. Ritter Red struck him. The first blow knocked away the kitchen rags. At the second spill and blow, the tinsel robe fell away. At the third, the silver robe dropped, and Shortshanks stood gleaming in gold.
        - id: ch04-b22
          speaker: younger_princess
          text: Shame on you for striking my heart's darling! He saved me, and he is the one I'll marry!
          emotion: angry
        - id: ch04-b23
          speaker: narrator
          text: Ritter Red cursed and swore that he was the true rescuer. The king spoke up.
        - id: ch04-b24
          speaker: king
          text: The man who saved my daughter must have some proof.
        - id: ch04-b25
          speaker: narrator
          text: Ritter Red fetched the handkerchief containing the ogres' lungs and tongues. Shortshanks brought out the gold, silver, jewels, and precious things from their ships. Both men placed their tokens before the king.
        - id: ch04-b26
          speaker: king
          text: Whoever owns such stores of gold, silver, and diamonds must have slain the ogres and taken their treasure. Riches like these can come from nowhere else.
        - id: ch04-b27
          speaker: narrator
          text: Ritter Red was thrown into a pit filled with snakes. Shortshanks was promised the Princess and half the kingdom.
