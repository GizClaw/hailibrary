audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 从容而清醒，带一点克制的诙谐
        timbre: 温厚清晰
        pace: 舒缓有致
        pitch: 中低
    good_stepdaughter:
      display_name: 勤快的继女
      tts:
        delivery: 善良勤快，答话朴实真诚
        timbre: 清亮柔和
        pace: 中等
        pitch: 中高
    bad_stepdaughter:
      display_name: 懒惰的继女
      tts:
        delivery: 懒散自负，任性时尖刻不耐烦
        timbre: 清脆偏硬
        pace: 中等偏快
        pitch: 中高
    hedge:
      display_name: 树篱
      tts:
        delivery: 谦和恳切，帮助人时机敏可靠
        timbre: 轻柔沙沙
        pace: 中等偏慢
        pitch: 中
    cow:
      display_name: 母牛
      tts:
        delivery: 温厚诚恳，忍受不适时略显吃力
        timbre: 浑厚柔和
        pace: 舒缓
        pitch: 中低
    wether:
      display_name: 公绵羊
      tts:
        delivery: 老实亲切，说话直截了当
        timbre: 温暖略粗
        pace: 中等
        pitch: 中
    apple_tree:
      display_name: 苹果树
      tts:
        delivery: 温和有礼，危急时果断催促
        timbre: 清润沉静
        pace: 中等偏慢
        pitch: 中
    troll_witch:
      display_name: 老巫婆
      tts:
        delivery: 刁钻多疑，恼怒时尖厉凶狠
        timbre: 苍老沙哑
        pace: 中等
        pitch: 中低
    bird_1:
      display_name: 小鸟甲
      tts:
        delivery: 灵巧明快，歌唱般提示
        timbre: 清脆轻盈
        pace: 中等偏快
        pitch: 高
    bird_2:
      display_name: 小鸟乙
      tts:
        delivery: 灵巧明快，歌唱般提示
        timbre: 清脆圆润
        pace: 中等偏快
        pitch: 中高
    bird_3:
      display_name: 小鸟丙
      tts:
        delivery: 灵巧明快，歌唱般提示
        timbre: 细亮活泼
        pace: 中等偏快
        pitch: 高
  chapters:
    - id: ch01
      title: 井下的绿草地
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 从前有一对再婚的夫妻，各自带着一个女儿。女人的女儿又笨又懒，什么也不会做。男人的女儿却手脚麻利，样样能干。可她再怎么努力，继母也不满意。继母和继姐妹一心只想赶走她。
        - id: ch01-b02
          speaker: narrator
          text: 一天，两个姑娘到井边纺线。懒姑娘分到的是亚麻，勤快姑娘手里却只有难纺的猪鬃。懒姑娘望着她，先开了口。
        - id: ch01-b03
          speaker: bad_stepdaughter
          text: 你平时手脚是挺快，可要比一场纺线，我一点儿也不怕你。
        - id: ch01-b04
          speaker: narrator
          text: 她们说好，谁的线先断，谁就下井。两人坐在那里，不停地纺啊纺，越纺越起劲。偏偏勤快姑娘手里的猪鬃线先断了。她不能反悔，只得下到井里。谁知到了井底，她不但没有摔伤，眼前还铺开了一片碧绿美丽的草地，一眼望不到边。
        - id: ch01-b05
          speaker: narrator
          text: 她走了一会儿，遇到一道挡路的树篱。
        - id: ch01-b06
          speaker: hedge
          text: 好姑娘，跨过去时轻一点儿，别重重踩我。你肯爱惜我，以后我也会帮你。
        - id: ch01-b07
          speaker: narrator
          text: 姑娘放轻脚步，小心跨过树篱，几乎没碰到一根细枝。再向前走，她看见一头漂亮的花斑母牛。母牛又大又壮，角上挂着奶桶，乳房涨得圆鼓鼓的。
        - id: ch01-b08
          speaker: cow
          text: 请替我挤挤奶吧，我实在涨得难受。你尽管喝，喝剩的奶浇在我的蹄子上。以后我会帮你的。
        - id: ch01-b09
          speaker: narrator
          text: 姑娘答应下来。她的手才碰到乳头，奶便直往桶里喷。她喝到不再口渴，把余下的奶全浇在母牛四只蹄子上，又将空奶桶好好挂回牛角。继续上路不久，一只大公绵羊迎面走来。它的羊毛又厚又长，一直拖在地上，走过哪里就把哪里的脏东西带上。一把大剪刀正挂在它的一只角上。
        - id: ch01-b10
          speaker: wether
          text: 请替我剪掉这些长毛吧。它们走到哪里就勾住哪里，天一热，更闷得我喘不过气。剪下来的毛，你想拿多少都行，把其余的绕在我脖子上。往后我会报答你的。
        - id: ch01-b11
          speaker: narrator
          text: 公绵羊自己卧在姑娘膝上，一动不动。姑娘仔细剪完，连一点儿皮也没伤着。她取了需要的羊毛，把剩下的绕好，便接着赶路。
        - id: ch01-b12
          speaker: narrator
          text: 前面有棵结满果子的苹果树，所有枝条都被压弯了，树干边靠着一根细长的竿子。
        - id: ch01-b13
          speaker: apple_tree
          text: 好姑娘，帮我摘掉苹果，让枝条直起腰来吧。够不到的可以拿竿子打，只求你下手轻些。你尽管吃，吃剩的整齐放在树根边。往后我也会帮你。
        - id: ch01-b14
          speaker: narrator
          text: 姑娘先用手摘下所有够得着的苹果，再拿起竿子，轻轻打落高处的果子。她挑了几个吃，一直吃到饱，把其余苹果整整齐齐地围着树根摆好。随后，她上路走啊走，走了很远很远，才来到一座大农庄。这里住着一个山怪老太婆和她的女儿。姑娘走进门，问她们愿不愿意雇自己做工。
        - id: ch01-b15
          speaker: troll_witch
          text: 别费心了。我们用过的女佣多得很，可一个中用的也没有。
        - id: ch01-b16
          speaker: narrator
          text: 姑娘再三恳求，只想得到一次试用的机会。老太婆终于答应了。
    - id: ch02
      title: 小鸟的歌
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 老太婆先递给姑娘一只筛子，叫她去打水。用筛子怎么装得住水呢？姑娘觉得奇怪，还是照样走到井边。这时，小鸟们唱了起来。
        - id: ch02-b02
          speakers: [bird_1, bird_2, bird_3]
          ensemble: chorus
          text: 糊上泥，塞进草！糊上泥，塞进草！
        - id: ch02-b03
          speaker: narrator
          text: 姑娘依歌声堵住筛眼，果然把水带回了屋。老巫婆看见装着水的筛子，马上尖声叫起来。
        - id: ch02-b04
          speaker: troll_witch
          text: 这个办法绝不是你自己想出来的！
          emotion: surprised
        - id: ch02-b05
          speaker: narrator
          text: 接着，老巫婆叫她去牛棚铲粪、挤奶。姑娘到了那里，才发现粪叉又长又重。她使出力气也挪不动，更不用说拿它干活了。姑娘望着满地牛粪，完全不知道该怎么办。小鸟又唱歌告诉她，只要拿扫帚柄挑出一点儿，其余的牛粪就会跟着飞出去。她依言一试，扫帚柄才刚动起来，整座牛棚顿时干净得像认真扫过又洗过。
        - id: ch02-b06
          speaker: narrator
          text: 可挤奶也不容易。那些母牛又踢又跳，谁也靠近不了。外面再次响起小鸟的歌。
        - id: ch02-b07
          speakers: [bird_1, bird_2, bird_3]
          ensemble: chorus
          text: 挤一小滴，给一小口，让小鸟儿润润喉。
        - id: ch02-b08
          speaker: narrator
          text: 姑娘费力挤出一点点奶，先送给小鸟。所有母牛立刻站稳了。它们不踢，不跳，连腿也不抬，安安静静让她挤满了奶桶。老巫婆一见她提奶进来，又嚷了起来。
        - id: ch02-b09
          speaker: troll_witch
          text: 这也不是你自己想出来的！拿上这团黑羊毛，把它给我洗成白的！
        - id: ch02-b10
          speaker: narrator
          text: 姑娘从来没见过，也没听说过，有谁能把黑羊毛洗成白色，这回真是一点儿办法也没有。可她没有争辩，更没有抱怨，只抱着那团黑羊毛回到井边。小鸟又唱起来，叫她把羊毛浸进旁边的大木桶。她照着做了。黑羊毛一浸进去，再拿出来时，已经白得像刚落下的雪。
        - id: ch02-b11
          speaker: troll_witch
          text: 真是活见鬼！你什么都会，再留几天，准要成我的心头大患。拿了工钱，赶快离开这里！
          emotion: angry
        - id: ch02-b12
          speaker: narrator
          text: 老巫婆拿出红、绿、蓝三只匣子，叫姑娘任选一只当工钱。姑娘正不知道怎么挑，小鸟们唱出了答案。
        - id: ch02-b13
          speakers: [bird_1, bird_2, bird_3]
          ensemble: chorus
          text: 红的别拿，绿的莫要，就选那只蓝匣才好。上面三个小十字排成行，我们见过记得牢。
        - id: ch02-b14
          speaker: narrator
          text: 姑娘听从小鸟，拿起有三个小十字的蓝匣。
        - id: ch02-b15
          speaker: troll_witch
          text: 那你就倒霉去吧！等着瞧，我一定叫你为这个选择付出代价！
          emotion: angry
    - id: ch03
      title: 四位朋友
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 姑娘刚要离开，老巫婆便朝她射出一根烧得通红的铁条。好在小鸟早已告诉她如何提防。她立刻闪到门后，把身子藏好，铁条擦了过去，没有打中她。姑娘不敢停留，抱紧蓝匣，一刻也不停，一路能走多快就走多快。来到苹果树旁，她忽然听见身后的大路轰隆作响。老巫婆和她的女儿到底还是追来了。姑娘又惊又怕，一时完全不知道该往哪里躲。
        - id: ch03-b02
          speaker: apple_tree
          text: 快到我的枝条下面躲起来！她们抓住你，就会抢走匣子，把你活活撕碎。别怕，我来帮你。
        - id: ch03-b03
          speaker: narrator
          text: 姑娘才藏好，老巫婆母女便赶到了。
        - id: ch03-b04
          speaker: troll_witch
          text: 苹果树，你见过一个姑娘从这里跑过去吗？
        - id: ch03-b05
          speaker: apple_tree
          text: 见过。她一个钟头前就跑过去了，现在早已远得追不上啦。
        - id: ch03-b06
          speaker: narrator
          text: 老巫婆听信了苹果树，只得转身回家。姑娘从枝条底下出来，继续赶路。可她才走到公绵羊附近，身后的大路便又响起那阵可怕的轰隆声。她吓得停住脚步，不知怎么办才好。她心里很清楚，一定是老巫婆回家以后越想越不甘心，又改变主意追来了。
        - id: ch03-b07
          speaker: wether
          text: 快藏到我的羊毛底下。她们就看不见你，也抢不走匣子，更不能把你撕碎。
        - id: ch03-b08
          speaker: narrator
          text: 老巫婆气势汹汹地冲到跟前。
        - id: ch03-b09
          speaker: troll_witch
          text: 绵羊，你见过一个姑娘从这里跑过去吗？
        - id: ch03-b10
          speaker: wether
          text: 一个钟头前见过。可她跑得太快，你们追不上了。
        - id: ch03-b11
          speaker: narrator
          text: 老巫婆又回去了。姑娘走到母牛那里，身后第三次传来轰响。
        - id: ch03-b12
          speaker: cow
          text: 快藏到我的乳房下面。老太婆要是找到你，会抢走匣子，再把你活活撕碎。
        - id: ch03-b13
          speaker: narrator
          text: 没过多久，老巫婆果然追到母牛面前。
        - id: ch03-b14
          speaker: troll_witch
          text: 母牛，你见过一个姑娘经过这里吗？
        - id: ch03-b15
          speaker: cow
          text: 一个钟头前见过。她跑得飞快，如今已经远得很，你们追不上啦。
        - id: ch03-b16
          speaker: narrator
          text: 老巫婆第三次转身回家。姑娘从母牛身下出来，又走了很远很远。眼看离树篱不远了，那阵可怕的轰响竟又从身后逼近。姑娘听得心惊胆战。她知道，老太婆和她的女儿回去以后，又一次改变了主意。这一回，她们正沿着大路直追过来。
        - id: ch03-b17
          speaker: hedge
          text: 快钻到我的枝条下面，她们就看不到你。不然，她们会夺走匣子，把你活活撕碎。
        - id: ch03-b18
          speaker: narrator
          text: 姑娘赶紧藏好。老巫婆来到树篱前，开口盘问。
        - id: ch03-b19
          speaker: troll_witch
          text: 树篱，你见过一个姑娘从这里经过吗？
        - id: ch03-b20
          speaker: hedge
          text: 没有，我一个姑娘也没见过。
        - id: ch03-b21
          speaker: narrator
          text: 树篱的话甜得像嘴里含着融化的黄油，枝条却悄悄向四面伸展开来，越长越高，越变越大，谁看了都不敢随便跨过去。老巫婆无路可走，只好再次回家。
        - id: ch03-b22
          speaker: narrator
          text: 勤快姑娘终于回到家。她如今收拾得干干净净，又利落，又精神，任谁看了都觉得喜欢。继母和继姐妹见了，心里却比从前更加怨恨。她们仍旧不许姑娘住进屋里，反而把她赶到猪圈，说往后那里就是她的家。姑娘没有灰心，把肮脏的猪圈一点点刷洗得一尘不染，这才坐下来打开蓝匣，想看看自己究竟得了什么工钱。
        - id: ch03-b23
          speaker: narrator
          text: 锁刚打开，金银和美丽的宝物便不断涌出来，挂满四面墙壁。最后，那座猪圈比最华丽的王宫还要富丽。继母母女过来一看，惊得险些从自己的皮囊里跳出来，连忙追问井下是什么地方。
        - id: ch03-b24
          speaker: good_stepdaughter
          text: 你们看看这份工钱，不就知道了吗？那样的人家，那样的女主人，世上再也找不到第二个。
    - id: ch04
      title: 第二个姑娘
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 懒姑娘看见这一切，也打定主意要出去做工，给自己挣回一只同样装满金子的匣子。两姐妹再次坐到井边纺线。这一回，懒姑娘拿的是难纺的猪鬃，勤快姑娘拿的是亚麻。她们仍旧照原先的规矩来，谁的线先断，谁就下井。你想也知道，没过多久，猪鬃线果然断了。于是，懒姑娘被扔进井里。
        - id: ch04-b02
          speaker: narrator
          text: 她也平安落到那片碧绿草地上。走到树篱前，树篱仍旧好声相求。
        - id: ch04-b03
          speaker: hedge
          text: 姑娘，跨过去时请轻一点儿。你不踩疼我，往后我会帮你的。
        - id: ch04-b04
          speaker: bad_stepdaughter
          text: 不过是一捆破树枝，我为什么要管你？
        - id: ch04-b05
          speaker: narrator
          text: 她又跺又踩，直踩得枝条咔嚓断裂，呻吟不止。再往前，她遇见奶胀得快要裂开的母牛。
        - id: ch04-b06
          speaker: cow
          text: 请替我挤奶吧。你想喝多少都行，只要把剩下的浇在我的蹄子上。以后我会帮助你。
        - id: ch04-b07
          speaker: narrator
          text: 懒姑娘把奶挤出来，一直喝到再也喝不下。桶里什么也没剩，她自然没往牛蹄上浇。她还把奶桶扔下山坡，扭头就走。
        - id: ch04-b08
          speaker: narrator
          text: 接下来，她看见公绵羊拖着一身长毛走来。
        - id: ch04-b09
          speaker: wether
          text: 好姑娘，请帮我剪剪毛吧。你想拿多少都可以，把剩下的绕在我脖子上。以后我会报答你。
        - id: ch04-b10
          speaker: narrator
          text: 她剪得漫不经心，在可怜的绵羊身上割出几块大伤口，又把剪下的羊毛全部带走。
        - id: ch04-b11
          speaker: narrator
          text: 苹果树也重新结满果子，被压弯了身子。
        - id: ch04-b12
          speaker: apple_tree
          text: 请帮我摘下苹果，让枝条直起来吧。用竿子时轻一点儿。你可以尽管吃，把剩下的整齐放在树根旁。以后我会帮你的。
        - id: ch04-b13
          speaker: narrator
          text: 她先摘下离自己最近的果子，够不着的便举起竿子狠命抽打。她根本不管苹果树疼不疼，也不管自己下手多重，打断、扯落了好几根大树枝。接着，她只顾挑苹果吃，一直吃到肚子再也装不下。至于剩余的果子，她既没有收拢，也没有摆好，只随手乱扔在树下。
        - id: ch04-b14
          speaker: narrator
          text: 懒姑娘来到老巫婆的农庄，也开口求一份差事。老太婆说，再也不要女佣了。从前来的不是毫无用处，就是聪明过头，骗走了她的好东西。可懒姑娘怎么也不肯离开，非要留下。
        - id: ch04-b15
          speaker: troll_witch
          text: 既然你不肯走，那就试试看吧。不过，你得先证明自己还有一点儿用处。
    - id: ch05
      title: 红匣子的工钱
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 第一件差事还是用筛子打水。懒姑娘在井里舀了又舀，可水一进筛子，立刻漏得干干净净。小鸟们唱起了歌。
        - id: ch05-b02
          speakers: [bird_1, bird_2, bird_3]
          ensemble: chorus
          text: 糊上泥，塞进草！糊上泥，塞进草！
        - id: ch05-b03
          speaker: narrator
          text: 她不听歌，反而抓起泥块乱扔，把小鸟赶得远远的。最后，她只能提着空筛子回去，挨了老巫婆一顿臭骂。
        - id: ch05-b04
          speaker: narrator
          text: 接着，她要去牛棚打扫、挤奶。她心里只觉得，自己这样的人，哪里该做这种又脏又臭的活。可她还是进了牛棚。那把粪叉实在太大，她推不动，提不起，根本没法使用。小鸟把告诉她继姐妹的办法又说了一遍。只要用扫帚柄挑出一点儿牛粪，其余的就会自己飞走。可她拿起扫帚柄，唯一做的事就是朝小鸟扔过去。
        - id: ch05-b05
          speaker: narrator
          text: 母牛又踢又撞。她好不容易挤出一点奶，奶桶立刻又被踢翻。小鸟们再次唱道。
        - id: ch05-b06
          speakers: [bird_1, bird_2, bird_3]
          ensemble: chorus
          text: 挤一小滴，给一小口，让小鸟儿润润喉。
        - id: ch05-b07
          speaker: narrator
          text: 她不但不肯分一滴奶，还对着母牛连打带踹，抓起手边一切能拿动的东西去砸小鸟。牛棚里又是踢撞，又是叫嚷，闹得简直没法看。到头来，牛粪没铲出去多少，奶也没挤成。她空着手回到屋中，不但挨了老巫婆一顿臭骂，还结结实实吃了一顿打。老巫婆又叫她把黑羊毛洗白，可这一件差事，她照样没有办成。
        - id: ch05-b08
          speaker: narrator
          text: 老巫婆受够了，便摆出红、绿、蓝三只匣子。她说，这个女佣根本不值得留下，不过可以任挑一只匣子作工钱。小鸟们最后一次唱起来。
        - id: ch05-b09
          speakers: [bird_1, bird_2, bird_3]
          ensemble: chorus
          text: 红的别拿，绿的莫要，就选那只蓝匣才好。上面三个小十字排成行，我们见过记得牢。
        - id: ch05-b10
          speaker: narrator
          text: 懒姑娘一点儿也不理会，伸手就拿走最惹眼的红匣子。她一路平平安安地回了家，没有任何人追赶。
        - id: ch05-b11
          speaker: narrator
          text: 她母亲高兴得快要跳起来。母女俩立刻把匣子放到壁炉边，认定里面全是纯金纯银。她们甚至盘算着，要让墙壁和屋顶也像猪圈一样镀满金光。
        - id: ch05-b12
          speaker: narrator
          text: 可匣子一打开，哪里有什么金银？从里面翻滚出来的，只有癞蛤蟆、青蛙和蛇。更糟的事还在后面。从那以后，懒姑娘每一次张嘴，都会蹦出一只癞蛤蟆或一条蛇。人能想到的种种害虫，也一个接一个从她嘴里掉出来。它们在屋里越聚越多，到最后，整座房子都叫她弄得再也住不了人。
        - id: ch05-b13
          speaker: narrator
          text: 这就是她去老巫婆家做工挣来的全部报酬。
