audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 从容而清醒，带一点克制的诙谐
        timbre: 温厚清晰
        pace: 舒缓有致
        pitch: 中低
  chapters:
    - id: ch01
      title: 起源
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: |-
            本书里的许多故事，读者一听便会觉得熟悉。它们原是育儿室里流传的童话，是老妈妈一代代讲下来的旧谈。煤气灯亮起来，蒸汽机响起来，这些声音却慢慢沉寂了。英国保姆凭记忆给孩子讲故事，已经是很久以前的事。后来人们读到的，多半是佩罗的《鹅妈妈故事集》和奥尔努瓦夫人的《仙女故事集》的英译本。那些经过路易十四时代装扮的故事，束紧腰身，踩着高跟鞋，好像一个朴素的乡下姑娘被塞进伦敦剧院闷人的空气里，处处不自在。灰姑娘、美女与野兽、小红帽和蓝胡子，就这样披上外国衣裳回到英国。《仙女故事大全》又把它们同辛巴达和阿拉丁混在一起。那时的人不讲考据，各国各时代的传统一齐吹来，纠缠得像一磅亚麻，等着姑娘在一天之内纺成匀整的线。翻译再笨，也不能完全毁掉民间故事天生的美。可英国人已经忘了，这些故事本来也生在自己的土地上。他们花钱买回自己的孩子，只因为孩子换了一身异国衣裳。更没有人想到，童话不只是消遣，它也有历史，也能成为学问。

            十八世纪已经有人发现，阿尔卑斯山以北的民间传统，常同古典神话遥相呼应。可当时希腊文和拉丁文像两位暴君，拿着学究的戒尺管辖一切语言。每逢俗语里出现相似故事，人们便认定是卑微的方言笨拙地抄了古典作品。直到拿破仑战争快结束时，图林根出现了雅各布·格林。他替本国语言挣脱古典语言的压制，也替整个日耳曼语族争取被遗忘的古老继承权。他的《日耳曼语法》证明，从冰岛到英格兰的日耳曼方言同古典语言地位平等。《日耳曼法律古制》说明伦巴第人、法兰克人和哥特人的法典并非野蛮习俗。他研究中世纪德国诗人的著作，也让戈特弗里德、沃尔弗拉姆、哈特曼和瓦尔特等人重新站到同时代大作家身旁。至于《日耳曼神话学》《列那狐》，以及他同弟弟威廉合编的《德国民间故事集》，更让育儿室里的虚构和老妇人的闲谈，成了成年人值得倾注精力的研究。
        - id: ch01-b02
          speaker: narrator
          text: |-
            这篇导言涉及的地域太广，读者只能接受研究所得的结果，不能要求每一步都摆在眼前。说得家常些，汤已经端上桌，就别再查看熬汤的牛骨。近代东方与西方的语言学、神话学已经相遇，彼此扶持，缺了哪一边都不能理解另一边。格林一派在欧洲的工作，先由昂克蒂尔－迪佩龙等人在印度和法国的发现打开道路，又得到威廉·琼斯、科尔布鲁克等人的推进，后来同威尔逊、葆朴、拉森和马克斯·缪勒的研究汇合。印欧语言同梵语有亲缘，已经成为这门学问的根本信条。

            一个民族最早而可靠的历史，就是它的语言史。不懂一国的语言，便不能真正懂它的文学。研究语言，又必然走进历史。英格兰的语言和文学里，有凯尔特、罗马、撒克逊、挪威和罗曼的成分。这件事本身就在催促我们追问，那些在土地和言语里留下印记的民族从哪里来，又经历过什么。比较语言学研究的不是一门孤立的语言，而是整个家族，再把它们引回共同中心。它们曾从那里像阳光一样向外散开。若同样的工作能遍及所有语系，人类起源的问题也许会得到完整答案。在早于文字历史的年代，一个种族的历史只能是语言的历史。后来分成无数支流的河水，那时还在同一条河床里流淌。

            我们的祖先来自东方，来自中亚那片通常称为伊朗的平原。年代既查不清，也无需查清。在地质所显示的无穷岁月面前，迁徙早一百年或晚一千年并无分别。“伊朗”属于耕种和犁田的人，“图兰”则是骑马游牧者的家园。什么迫使祖先离乡，也不必强求答案。也许是饥荒或内争，也许是冒险的首领不甘故土狭窄。总之，一支人向西走到大西洋和北冰洋，另一支向东越过山隘，穿过五河平原，进入印度。西去的人成为凯尔特人、希腊人、罗马人、日耳曼人和斯拉夫人。他们发展社会、道德、文学、艺术、科学与哲学，也在争斗中用文明、商业和宗教把世界连在一起。他们坚韧，却能适应环境，也愿意接受外来影响，再把它发展开来。
        - id: ch01-b03
          speaker: narrator
          text: |-
            东方的一支走得不远，进入印度以后安定下来。他们不像西方的弟弟那样忙于行动，而是坐下来思想，渐渐沉入来世与玄想。《吠陀》里，他们已经显出哲人之邦的面貌。马克斯·缪勒把印度人的心灵比作温室植物，颜色鲜艳，香气浓郁，开花结果又早又多，却不能像橡树那样在风雨里扎进真实泥土，把枝条伸向真实天空。种姓和仪式后来使这种生活更加凝固。希罗多德听过他们，亚历山大见过他们，罗马和东罗马同他们贸易，葡萄牙人重新发现他们，英国人又统治他们。可他们始终保持着同欧洲人的血缘。高地士兵和印度兵交战时，谁也不会想到，两人的面孔和头发虽迥然不同，祖先却曾在中亚同出一家。

            我们为什么要重视这一支留下的记录？因为他们的语言离东西两支分开以前的共同语言极近。西迁者一路遭遇不同民族，语言不断改变，也吸收许多外来成分。一支经波斯和小亚细亚成为希腊人，主流继续进入意大利成为拉丁人。另一支从里海与黑海之间经过，越过巴尔干和喀尔巴阡，成为日耳曼人，并把较早西迁的凯尔特人逐渐挤到山地和海岛。还有一支走得更北、更东，后来以斯拉夫人的身份进入历史。各族的语言看起来不同，却都保留共同起源的证据。印度人因长久守住旧传统，使梵语大体保存了原始语言的形态。没有梵语，比较语言学的太阳便不会升起。过去学者硬从希腊文、拉丁文或闪米特语言里寻找欧洲诸语的祖先，带来的不是古典语言的专制，就是凭偶然相似而生的荒唐推论。

            所以，希腊人、拉丁人、凯尔特人、日耳曼人和斯拉夫人原本都是亲族。他们从东方走来，把另一批亲族留在身后。几千年过去，东方与西方的语言和传统依旧彼此呼应。这条证据已经足够清楚，他们确实出自同一个祖系。
    - id: ch02
      title: 流传
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: |-
            确立了东西方的大体亲缘以后，题目便缩成两件事。一件是一般的民间故事，另一件是本书所收的挪威故事。欧洲各民族共有许多故事根基，这不只是有趣，也为共同起源增添证据。旧日古典派把相似之处一概说成抄袭希腊和罗马，如今也不能再坚持这种说法。不同民族长期接触，当然会彼此吸收传统，正如语言会互相借词。可雅利安民间传统里还有成百上千的相似，它们像北极光横过北天。若全说成一个部族抄另一个部族，就像乡民看见极光，以为有人纵火，急忙推出水车灭火一样可笑。《神偷》的情节既见于梵文故事，也见于希罗多德，还流传在德国、意大利和佛兰德。人物和细节处处随当地环境变化，更像各民族拿共同材料独立加工，而不是彼此照抄。

            威廉·退尔射苹果就是显眼的例子。瑞士人相信这壮举发生在一三〇七年，可神射手奉暴君之命，从孩子头顶射落目标的故事，远在退尔以前已经出现。十二世纪的萨克索把它写给帕尔纳托基，十三世纪的萨迦把它写给埃吉尔。《圣奥拉夫萨迦》里，国王命恩德里迪射儿子头顶的写字板。恩德里迪担心伤到孩子，在母亲和妹妹恳求下拒绝发箭，只得认输改宗。哈拉尔国王也命赫明格射弟弟头顶的榛子。后来德国魔法师、英国歌谣英雄、突厥人、蒙古人和从未读过书的萨莫耶德游牧民，都有自己的神射故事。它本是许多民族共有的远古旧传，后来才像花环一样戴到退尔头上。

            威尔士名犬盖勒特的故事也是如此。忠诚动物从狼、熊或蛇口中救下孩子，却被主人误杀，守护者有时是狗，有时是水獭或黄鼠狼。它见于印度故事、阿拉伯故事、《七贤师》和中世纪拉丁文作品。蒙塔尔吉斯之犬也属于这类古老传说。它们像一道闪电照亮整个天空，任何一支民族都不能独占。共同故事在各地又各有面貌，就像一家姐妹。她们有父母留下的相貌，却有不同的身形、眼睛、性情与才智。也可以说，民间故事是民族做的梦。一百个人看过同一件事，睡去以后会梦出一百幅图景。民族的心灵也把自己的历史重新梦过，把远古信仰、恐惧、悲苦和光荣的碎片，同昨天的事情拼在一起，再把魔镜里扭曲的影子当作真实历史。
        - id: ch02-b02
          speaker: narrator
          text: |-
            古典抄袭论衰落以后，又有人把所有西方故事都说成东方书本的译本。他们认定来源只有两条。一条从梵文《五卷书》经过巴列维文、阿拉伯文、希伯来文，最后进入卡普阿的约翰所译《人生指南》，也就是《卡里来与笛木乃》的传承。另一条是《七贤师的故事》，它也有波斯、阿拉伯和希伯来版本，最后以拉丁文进入欧洲。即使把这两部书里的一切都让给抄袭论，仍有无数故事、片段、意象和词语不在其中，却同时存在于东方与西方。

            《故事海》里，普特拉卡王遇到两个人争一只碗、一根手杖和一双鞋。鞋能飞，手杖指向哪里便能变出东西，碗能送来想吃的食物。普特拉卡劝他们赛跑，两个傻瓜一跑开，他便穿鞋拿走宝物，飞进云端。这个故事不在那两条所谓传播路线的源书里，而且《故事海》直到近代才被西方认识。可本书《白国的三位公主》中，国王也遇到三个为帽子、斗篷和靴子争了一百年的兄弟。他提出代为试用裁断，拿到东西便离开。鞑靼、瓦拉几亚和蒙古故事也有隐身衣帽、神奇靴子与魔杖。挪威的桌布、公羊、棍子、剪刀和龙头，英国杰克的七里靴，《尼伯龙根之歌》里齐格弗里德从争产者手中得到的黑暗斗篷，也都保存着同样碎片。共同骨架始终是继承人争宝，请更聪明或更强的人裁决，结果宝物被裁决者取走。

            就算一个寓言同时见于印度原作和欧洲译本，也不能证明它只靠翻译来到西方。伊索寓言里有些故事同《五卷书》相同，可早在翻译出现以前，四世纪希腊演说家已经讲过狮子、狐狸和公牛的寓言。传统更可能沿远古迁徙的道路传递。人对人，民族对民族，时代对时代，一路说下去。近代语言学沿着这条旧路回望东方，才找到共同语言与共同信仰的摇篮。
        - id: ch02-b03
          speaker: narrator
          text: |-
            民间故事也能为更大的问题作证，也就是人类是否共有起源。有些相似自然会在各地独立产生。人都看见相近的自然现象，也经历相近日常生活，便可能编出近似故事。可一种现象若在遥远两地都得到十分独特的解释，情形就不同了。挪威故事解释熊为什么只有短尾。狐狸骗它把尾巴伸进冰窟，坐到冻牢，再猛力一拔，尾巴就断了。非洲博尔努的故事解释鬣狗为什么没尾巴。黄鼠狼骗它把尾巴伸进洞里，说要系上肉，其实用木棍把尾巴钉住。鬣狗用力拉，终于扯断尾巴。一个适应北方冰雪，一个适应非洲陷阱，具体办法不同，根基却罕见地相同。这不像简单摹仿，反倒说明传统很古老。

            《一千零一夜》讲过一个能听懂兽语的人。他因牛驴谈话发笑，妻子逼问原因，公鸡便劝他用棍子教训妻子。意大利、塞尔维亚和博尔努都有变体。博尔努故事里，一个男人听懂飞鸟、鬣狗、马和老鼠的话。妻子以为他嘲笑自己的独眼，后来又逼他说出为何因老鼠发笑。他终于泄露秘密，第二天就失去本领。故事还加上一句不公平的训诫，说男人若把心事告诉女人，上帝便会惩罚他。幸好故事到此为止，不然照别处变体发展，保住本领的丈夫就要伤害妻子。

            贝专纳人的《两兄弟》，同欧洲故事乃至古埃及纸莎草上的故事相互呼应。西印度群岛的黑人从非洲带去动物史诗、许愿树、受姐姐轻视却战胜巨怪的瘦小孩子，还有替可怕人头洗净污垢而受奖赏的善良女人。来自印度的蒙古故事，又像把两篇挪威故事拼在一起。如此众多的对应，只有一种理论能够说明。全人类像是出自东方栽下的同一株祖木。它不断分枝，把语言的果实和歌谣故事的花朵，伸向大地最遥远的角落。
    - id: ch03
      title: 挪威神话
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: |-
            现在来看雅利安民族中一个特殊支系。共同的传统到了他们手里，长成了我们所说的挪威民间故事。日耳曼其他各支的神话常有争议，某位神在法兰克人、盎格鲁－撒克逊人或哥特人那里究竟占什么位置，也很难说清。挪威神话却保存得格外完整。一来，挪威人定居冰岛以后，语言和文学珍宝没有散失。二来，他们很晚才皈依基督教。于是，两部《埃达》、早期萨迦和萨克索笔下仍能让我们看清异教挪威人的整个信仰。自然力量先受崇拜，后来成为一位至高神，再发展成多神体系。新旧各层在《埃达》里交叠，却仍分辨得出。

            奥丁和阿萨神族住在阿斯加德。那里位于米德加德中央，也就是早期英国诗歌里的“中土”，是神与人的居所。群山挡住古老敌人，大海绕着大地，海外便是霜巨人与怪物所居的乌特加德。那些古老自然力量被新神赶下王座，因此像泰坦仇恨朱庇特一样仇恨阿萨神。双方有时来往宴饮，真正的关系却始终是战争。神与霜巨人争斗，人也同巨怪为敌。巨怪像缩小的霜巨人，力量和身量远胜常人，智慧与创造却不及人。他们住在荒蛮山地，也许还保存着古老原住民族退入险地的记忆。

            这些神必须不断行动，才能留在人们心中。印度神话有无穷化身，朱庇特冒险不断，奥丁也走遍世界，反复同霜巨人较量。索尔系上力量腰带，戴好铁手套，挥动那柄砸碎无数巨人头骨的锤子。挪威诸神其实就是放大了的挪威人。他们勇敢、坚忍、果决，爱冒险，也明知劫数必来，仍然抗争。到了诸神黄昏，恶狼挣脱锁链，环绕世界的巨蛇翻腾而起，阿萨神和敌手会在最后一战里一同毁灭。

            诸神的冒险、争执和命运，都唱进《老埃达》的歌谣。歌声严峻、明白而雄伟。歌中还有全族传诵的英雄与女武神。赫尔吉、西格蒙德、辛菲约特利、西格尔德、西格妮、布伦希尔德和古德伦，全都围绕着沃尔松格一族的悲剧。故事从一份不义之财的诅咒开始，也在诅咒中结束。爱情、错配的婚姻、嫉妒、背叛、谋杀和复仇，把每一个卷入其中的人，连亲生骨肉都拖向毁灭。这便是《沃尔松格传说》的主题。后来的《尼伯龙根之歌》，远不及它古老、质朴和宏伟。
        - id: ch03-b02
          speaker: narrator
          text: |-
            沃尔松格一族把祖先追溯到奥丁。奥丁生西吉，西吉生雷里尔，雷里尔又生沃尔松格。沃尔松格的大厅中央长着一株橡树，树干穿过屋顶，枝条伸向空中。一次盛宴上，他的女儿西格妮将要嫁给哥特兰国王西格盖尔。忽然，一个独眼老人走进大厅。他赤着脚，穿亚麻长袜，披条纹斗篷，戴宽檐软帽。他举剑一击，把剑直插进橡树，直到剑柄没入树身。他说，在座哪一个男子能拔出这把剑，剑就归谁，而且谁也找不到更好的兵刃。

            众人轮番尝试，剑却纹丝不动。轮到沃尔松格最勇敢的儿子西格蒙德，剑立刻顺从地离开树干。这便是名剑格拉姆。西格蒙德为了它同妹夫争执，后来沃尔松格战死，他和十个兄弟也被俘。兄弟们全被杀死，只有西格蒙德由姐姐西格妮救出，藏进森林。他和既是儿子又是外甥的辛菲约特利曾化成狼人，在林中经历许多狂野冒险。等辛菲约特利长大，两人放火烧死背信弃义的西格盖尔和全部随从，为父兄报了仇。

            西格蒙德夺回王国，直到年老才战死。他在战场上正要取胜，一个独眼、披蓝斗篷、戴软帽的战士持矛迎面而来。西格蒙德举起格拉姆砍向长矛，宝剑顿时断成两截。他认出对方正是当年赐剑的奥丁，也知道自己的好运已经用尽。他拒绝医治，顺从奥丁的意志，死在年轻妻子约尔迪丝怀里。约尔迪丝当时已有身孕，后来在丹麦国王亚尔普雷克的宫中生下西格尔德。这个孩子由国王的铁匠雷金抚养，长成沃尔松格族最俊美强壮的人。

            雷金是个侏儒。他天天催西格尔德建立功业，替自己杀死恶龙法夫纳。法夫纳、雷金和奥特原是兄弟，父亲叫赖德马尔。一次，奥丁、洛基和海尼尔旅行到河边，看见一只水獭闭着眼吃鲑鱼。洛基一石头打死水獭，还夸口一击得了鱼肉和兽肉。夜里，三位神来到赖德马尔家借宿，把猎物拿了出来。赖德马尔却认出死去的正是儿子奥特，便叫雷金和法夫纳绑住他们。

            诸神答应赔偿。赖德马尔剥下水獭皮，要他们在皮囊里装满黄金，外面也用黄金盖严，不能露出一根毛。洛基便去黑暗精灵的住处取金。他在溪中捉住侏儒安德瓦里，逼他交出岩石中的全部财宝。安德瓦里只求留下一个能不断生出财富的戒指，洛基也不肯答应。侏儒于是诅咒戒指，说谁拥有它，谁就会遭祸。洛基反倒觉得这样更好。

            奥丁看中戒指，先把它留下，把其他黄金交给赖德马尔。水獭皮里外都盖满以后，仍有一根灰毛露着。赖德马尔坚持要遮住它，奥丁只得交出戒指。诸神获释时，洛基又把诅咒念了一遍。灾祸很快到来。雷金向父亲讨一份黄金，遭到拒绝，便同法夫纳杀死父亲。法夫纳又独占财宝，威胁雷金快走，自己化作恶龙，盘在闪光荒原守着黄金。雷金逃走以后，便一心要养子替他杀龙。

            雷金先后给西格尔德铸了两把剑，都被一击打断。西格尔德斥责这些剑同雷金全族一样靠不住，又向母亲要来格拉姆的断片。雷金把名剑重新铸好。新剑能劈开铁砧，也能斩断水流送到刃口的一绺羊毛。雷金又催他杀法夫纳，西格尔德却先去找洪丁王的儿子们，为父亲复仇。亚尔普雷克借给他兵力，奥丁替他引路，他击溃仇敌，杀死所有兄弟，这才回来面对恶龙。

            西格尔德带着格拉姆，骑上奥丁替他挑选的良驹格拉尼，在恶龙去河边饮水的路上挖了一个坑。法夫纳从头顶经过时，他从坑中刺死了恶龙。雷金赶来，要他烤熟法夫纳的心作为赔偿，自己喝饱龙血便躺下睡觉。西格尔德烤心时伸手试了试，手指被烫伤，便放进口中。恶龙的生命之血一碰舌头，他忽然听懂了鸟语。燕子们告诉他，吃下龙心便会成为世上最聪明的人，而雷金正准备欺骗他。它们劝他先杀雷金，独占黄金。西格尔德照做了。他吃下龙心，骑着格拉尼进入法夫纳巢穴，取出全部财宝。
        - id: ch03-b03
          speaker: narrator
          text: |-
            从此，西格尔德成了北方歌谣最宠爱的英雄。歌中赞美他的金棕色卷发、赤褐胡须、宽阔前额和明亮得少有人敢直视的双眼。他身材高大，佩着格拉姆走过成熟的黑麦田，剑鞘尖端刚好擦过麦穗。他机敏而有远见，最喜欢帮助别人、完成壮举、夺取敌人的财富，再慷慨赠给朋友。他是活人中最勇敢的人，不知道恐惧是什么。

            他骑行到一座孤山，看见烈火环绕一所屋子。除了格拉尼，没有马敢穿过火焰。除了西格尔德，也没有人能稳坐在跃火的格拉尼背上。屋里躺着一个全身披甲的美丽姑娘。她是女武神布伦希尔德，因为任性地把胜利给了错误的一方，被奥丁用睡眠刺扎进斗篷，罚她沉睡在火焰里，直到一个敢骑马穿火的男子来释放她并娶她为妻。布伦希尔德醒来，把符文和智慧教给西格尔德。两人庄严发誓相爱，随后西格尔德继续上路。

            他来到法兰克国王久基的大厅。久基的妻子格里姆希尔德精通黑魔法，儿子是贡纳尔和赫格尼，继子是古托姆，女儿是美丽的古德伦。西格尔德本想回去接布伦希尔德，可格里姆希尔德希望他娶自己的女儿，便煮了一剂遗忘药。西格尔德喝下以后忘了誓言，同贡纳尔、赫格尼结为兄弟，又娶了古德伦。

            后来，久基替贡纳尔求婚，选中的偏偏是仍在火焰中等待的布伦希尔德。她已经宣告，谁能穿过烈火，谁就能娶她。贡纳尔的马在火前退缩，格里姆希尔德便用魔法让西格尔德和贡纳尔互换容貌与兵甲。西格尔德骑格拉尼跃过火焰，替贡纳尔赢得了布伦希尔德。当夜，他把格拉姆横放在两人中间。次日清晨，他又从法夫纳宝藏中取出安德瓦里的戒指，作为晨礼送给她，自己收下她回赠的戒指。西格尔德回去恢复原貌，贡纳尔便领走布伦希尔德。婚后，遗忘药失效，西格尔德终于想起自己的誓言，却知道已经太迟，只能沉默。

            一天，布伦希尔德和古德伦到河里洗头。两人争着站到上游，都说自己的丈夫更勇敢。布伦希尔德说，贡纳尔敢穿过火焰，西格尔德连试也不敢。古德伦却拿出戒指，揭穿当日穿火的其实是西格尔德。布伦希尔德沉默着回家。她对西格尔德的爱重新涌起，又因受骗而变成仇恨。她逼贡纳尔替自己雪耻。贡纳尔和赫格尼已经同西格尔德结成兄弟，不能亲手背誓，便用咒术和劝诱驱使古托姆行凶。

            深夜里，古德伦仍抱着西格尔德，古托姆却来到床前，一剑刺穿英雄。西格尔德挣扎着把格拉姆掷向逃走的凶手。利刃把古托姆从腰间斩成两段，头落在门外，脚跟留在屋里。复仇完成以后，布伦希尔德的爱又回来了。西格尔德被放上柴堆时，她唱出预言之歌，讲述将来的灾祸，又命人把自己放在他身旁，中间仍隔着格拉姆。她就这样同旧日爱人一起去了瓦尔哈拉。安德瓦里的诅咒应验了。

            古德伦疲惫地流浪一阵，后来接受兄弟为丈夫之死所作的赔偿，嫁给布伦希尔德的哥哥、匈人王阿特利。阿特利既痛恨久基的儿子欺骗妹妹，又索取西格尔德留下的黄金。他无法正面取胜，便假意请贡纳尔和赫格尼赴宴，再把他们擒住。赫格尼被活活剜出心脏，脸上仍带着笑。贡纳尔被扔进毒蛇坑，仍用琴声催眠群蛇，直到一条蛇扑向胸口，把他咬死。兄弟们早已把宝藏沉入莱茵河，秘密也随他们消失。

            替兄弟复仇的责任落在古德伦身上。她杀死自己同阿特利所生的两个儿子，让丈夫吃下他们的肉，又用儿子的头骨盛血给他喝。阿特利熟睡以后，她和赫格尼的儿子一起杀死他，放火烧毁大厅。她投海自尽，大海却不肯收留她，把她送到约纳克王的国土。约纳克娶她为妻，两人生下索尔利、哈姆迪尔和埃尔普。古德伦同西格尔德的女儿斯万希尔德也留在她身边，长成世间最美的女子。

            哥特王赫尔曼纳里克听说斯万希尔德的美貌，派儿子兰德维尔替自己求婚。奸人比基却劝王子自己娶她，随即又向国王告密。赫尔曼纳里克下令绞死儿子。兰德维尔临死前拔光猎鹰的羽毛送给父亲。国王看见便明白，一个年老无子的君王，正像无羽的鹰一样无法保护国家。他急忙阻止行刑，却已经晚了。后来他又策马踏死斯万希尔德。

            古德伦让三个儿子替妹妹复仇，并给他们刀剑砍不破的铠甲。三人本该趁国王睡着时，一个砍手，一个断足，一个取头。可是索尔利和哈姆迪尔嫌埃尔普帮不上忙，半路争吵起来，竟杀死了弟弟。后来索尔利绊倒，用手撑住身体，才明白手确实能帮助脚。两人袭击赫尔曼纳里克，砍掉他的手脚，国王却还能呼喊部下。一个独眼老人指点众人用石头砸死兄弟。索尔利和哈姆迪尔就这样倒下，不久古德伦也死了。沃尔松格与尼弗龙的故事至此结束。
        - id: ch03-b04
          speaker: narrator
          text: |-
            真实说明祖先的古老信仰，并不妨碍我们看见希腊神话的辉煌。希腊神话有一个难得的优势，它走完了自己的历程，在新信仰到来以前便渐渐衰老。日耳曼异教却在最旺盛的时候被基督教突然打断。旧神从神位跌落，有些成为恶魔，有些藏进圣徒传说和民间故事。它们并未消失，只是换了名字和衣裳。

            奥丁本是大父，也是风暴、战争、智慧和诗歌之神。他在神话中骑着八足马斯莱普尼尔，率领亡灵疾驰天空。基督教到来以后，这支队伍变成午夜狂猎。人们仍听见风中马蹄和猎犬的声音，只是昔日神圣的首领如今成了受诅咒的猎手。在德国，他可能叫沃坦，在别处又被说成该隐、希律、亚瑟王，甚至某个作恶的地主。名字随地方改变，狂猎的古老骨架却没有改变。

            民间故事里，也能看见神祇降格后的踪影。独眼老人、神秘旅客、忽然出现又消失的骑手，常带着奥丁的影子。索尔则留下巨锤、力量腰带和同巨人较量的故事。旧神的宝物也散落在童话中。能自行挥舞的剑、永远顺风的神船、带来力量的腰带、不断生出财富的戒指，都从神话进入了寻常人的冒险。神话像一片根扎得极深的树林。树干也许被砍倒，根却仍在地下生长，一代代抽出新的枝条。
    - id: ch04
      title: 挪威民间故事
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: |-
            挪威人的神话和它的衰亡已经说清了。他们从东方带来共同传统，定居斯堪的纳维亚以后，又在少受外界影响的山谷里经历异教、罗马教会和路德宗。直到今天，挪威和瑞典山谷中的农民仍保留着质朴的农家生活。因此，这些直到近年才被搜集记录的故事，理应忠实映照民族半自觉的心声。故事里既有对东方故土朦胧的回忆，也有大迁徙以后的历史。异教神披上基督教圣徒的衣裳，正说明一个民族容易改变信仰的形式，却很难改变自己的本性。

            神话最常讲诸神化作凡人来到世间。他们或为了冒险，或为了试探人心，混在旅客中干预人事。古希腊人不敢拒绝陌生人，因为来客也许是乔装的神。宙斯、波塞冬和赫耳墨斯会一同受人款待，朱庇特与墨丘利也曾因菲莱蒙和鲍西丝的热情接待，警告老夫妇洪水将临。印度神话里，梵天和毗湿奴四处游历。《埃达》中则是奥丁、洛基、海尼尔，或索尔、夏尔菲和洛基。有时奥丁独自化成骑手，夜里投宿铁匠家，请主人替马钉掌。这样的旧传一听便使人想起《铁匠大师》。

            进入基督教时代，游历人间的神换成蒙福的主和圣彼得。《铁匠大师》《格特鲁德之鸟》看似基督教故事，骨子里却仍是异教传统。德国传说中的圣彼得常急躁又滑稽，像善变的洛基。挪威故事倒让他保住了圣徒品格。行走人间的也有女神。奥丁之妻弗丽嘉、爱与丰饶女神芙蕾雅，以及纺织命运的三位诺恩女神，都曾受人敬畏。中世纪以后，这份敬爱转到圣母玛利亚身上。古女神的王冠成了圣母柔和的光环，她以母亲、纺织女和救苦女子的形象出现。《姑娘和教母》里的圣母守护太阳、月亮和群星，仁慈助人，也会惩罚过错，再给人和解与宽恕。

            奥丁不只赐战场上的胜利，一切好礼也来自他和阿萨神族。古老语言用“愿望”这个词容纳全部福佑。那不是空空地盼望，而是理想真正实现，是一位有手足、有眼光、会劳作、会思考、会收养孩子的神圣施予者。《埃达》称奥丁为奥斯基，也就是愿望之神。愿望石能揭示秘密财宝，愿望风是称心的顺风，愿望子是合意的养子，愿望女则是替奥丁挑选阵亡者的女武神。

            神们还有各自的精选宝物。奥丁的长矛投向哪一方，哪一方便获胜。索尔的锤子能毁灭巨人，使誓言神圣，掷出后还会自己飞回。他的力量腰带一系上，神力便增加一半。弗雷有自行挥舞的剑，还有一艘能容纳全体阿萨神和武器的船。船帆升起，不管去哪里都有顺风。不用时又能像一块布那样叠起，放进口袋。奥丁的戒指每夜滴出十二枚新戒指。伊敦的苹果让诸神重返青春。埃吉尔的头盔使敌人胆寒，弗罗迪的磨盘则能磨出主人所要的一切。

            这些宝物在童话里仍随处可见。《矮脚汉》中，三个共用一只眼睛的驼背老妇送出一把能使大军败逃的剑，又送出能越山过海、可放进口袋、展开却容得下五百人的神船。独眼奥丁、三位诺恩和老巫婆已经混在了一起。《最好的愿望》里，有能从空中剪出华服的剪刀，有铺开便出现佳肴的桌布，也有流出蜂蜜酒和葡萄酒的龙头。《去找北风的小伙子》里的桌布、公羊和棍子，《白国的三位公主》里的戒指，《蓝腰带》里使男孩强壮得能举起山的腰带，也都属于同一家族。凯尔特人的愿望帽、罗马人的丰饶角、印度人的愿望牛和愿望树、芬兰人的桑波，以及各地无数神奇杯盏、戒指和宝剑，都在向那位赐予善物的古老神祇致敬。
        - id: ch04-b02
          speaker: narrator
          text: |-
            人类还总愿意相信，世间曾有一个和平丰饶的黄金时代。挪威人说，弗罗迪统治时，黄金多得像面粉，臂环整年放在大路上也无人拾取，田地不用播种便长出庄稼。可这份和平由两个巨人女奴芬雅和门雅推磨得来。弗罗迪逼她们日夜转动格罗蒂磨盘，只准休息到听完一声杜鹃叫，或唱完一支歌。磨盘本可磨出推磨人选择的一切，此前一直磨出黄金与和平。两个姑娘苦苦求他怜悯，弗罗迪却充耳不闻。巨人的性情终于发作，她们不再磨和平，改磨烈火和战争。当天夜里，海盗米辛杀死弗罗迪，夺走磨盘，又逼她们在海上磨盐。盐装满船舱，船便沉入海底。米辛、姑娘和磨盘全沉了，所以海水直到今天仍是咸的。《海水为什么是咸的》最能证明古老传统有多么顽强。

            基督教把魔鬼的观念从东方带到北方。北方神话原有黑暗力量，却没有一个与全能之神正面对立的堕落天使。赫尔虽然统治酷寒的尼弗尔海姆，接纳病死和老死的人，却不是专门折磨亡灵的恶魔。她的床叫忧愁，盘子叫饥饿，刀叫饿殍。她一半皮肤发蓝，一半仍是人的肉色，严酷阴森，却只收留没有战死的人。倒在战场或海浪中的勇者去奥丁的瓦尔哈拉，去赫尔那里的人并非邪恶，只是不幸。

            基督教驱逐旧神以后，赫尔由一个人变成一个地方，成了受诅者受苦的地狱。东方人畏惧酷热，所以基督教地狱烈火熊熊。北方人最怕没有火的严寒，他们原来的赫尔却冰冷。两种观念交在一起，女神的名字留下，火焰也占满地狱。可民间传统仍记得旧模样。《海水为什么是咸的》说，穷弟弟拿着腌肉走了一整天，黄昏看见一片亮火。他遇到一个白胡子老人正在外屋劈圣诞节烧的柴。老人告诉他，这里就是地狱，里面的人会抢着买腌肉，因为地狱很少有肉。可他只能拿门后的手磨来换。这样一个缺柴少肉的地狱，仍带着赫尔旧厅堂的气息。

            《铁匠大师》的结尾也一样。故事开头的救世主和圣彼得，取代了奥丁和另一位异教神。铁匠既失去上天堂的希望，又同地狱主人吵过架，死后便无处可去。魔鬼叫守卫锁好地狱门上的九把锁，再添一把挂锁。那九把锁，正像赫尔掌管的九个世界。故事一半属于基督教，一半仍活在异教暮色中。魔鬼每次出现，也不像诡计深沉的大敌，更像一个力大而头脑简单的古代巨人。他总被狡猾无赖骗过，最后宁可付出任何代价，也不肯让那人进入地狱。

            古女神没有被圣母吸收的力量，则进入另一条暗流。中世纪人说，狄安娜、贝尔塔、霍尔达、希罗底、萨提娅或丰饶夫人，会在夜间带领女子乘风而行。这些名字底下，仍能认出弗丽嘉和芙蕾雅。霍尔达、萨提娅和丰饶夫人的名字，本来就是仁慈、满足和丰盛。长长的午夜队伍、秘密宴席、主持的善夫人，以及她脚步所到之处的富足，都属于古老女神。传说还说，大地的三分之一、第三个孩子或第三个灵魂归她，因为芙蕾雅本来就有从战场取走一半死者的权利。
        - id: ch04-b03
          speaker: narrator
          text: |-
            女神一旦被看作邪恶力量的首领，我们便走到了巫术面前。几乎每个时代、每个民族都相信巫术，而女巫总比男巫多。早年女人是女祭司，也是采药人。她们知道植物的功效，会纺亚麻、制绷带、裹伤口，还会刻符文、唱咒语、替伤者拔箭。男人忙着耕作、狩猎、交易和打仗，学问、医药、占卜和咒术便落在女人手里。同一双手可以治伤，也可能下毒。同一个声音可以唱减轻痛苦的符文，也可能念出恶咒。诺恩女神与丑巫之间，本来只隔一步。基督教到来以后，却把女神、女武神、女祭司和占卜者一同抛进不洁的深渊。

            起初，有些神学家还用常识看待这种迷信。一位老妇坚持说，自己随善夫人的队伍进入神父家，看见他赤身睡着，还替他盖好被子。神父问门都锁着，她怎么进去。老妇说她们不怕门锁。神父便把她带进教堂圣坛，锁上门，用牧杖打她，要她自己出去。她当然办不到。神父这才放她回家，让她明白那些经历只是空梦。

            后来教会势力增长，异端受到迫害，巫术也同秘密集会混在一起。黑暗王子走到前面，善夫人退入阴影。十三世纪以后，迫害狂热从法国和意大利传进日耳曼地区。到十五世纪，《女巫之槌》和教会审讯把恐惧推到顶峰。宗教改革也没有终止暴行。欧洲人把魔鬼想得太真实，猎巫案便一再沿着同样的路发展。被告先否认，受刑以后承认，随后翻供，再受刑，再承认，并被迫指控别人。到了火刑柱前，她常说一切供词都是假的，人们却认定这是恶魔仍在控制她。

            这些审判有一个本可使迫害者清醒的事实。无论女巫被说成同恶魔有多少勾结，从没有谁因此得到财富和地位。她们仍同黑猫一起，在贫穷悲惨里过完一生。德国谚语说，女巫每过七年，也只多三个半便士。伟大的爱与丰饶女神芙蕾雅，出行时原由猫拉车。她的信徒最后却变成英国村庄里带着黑猫的老女巫。

            十六世纪的迷信席卷欧洲，北方也没有幸免。瑞典人说女巫午夜骑往黑山布洛库拉。丹麦传说她们聚在特罗姆瑟或冰岛赫克拉山，挪威人则说她们去多弗勒山。这些故事当然留下巫术痕迹。《女大师》的女巫嫂嫂用苹果迷惑王子，最后被二十四匹马撕碎。《姑娘和教母》的老王后诬告哑女吃了亲生孩子，想把她当女巫烧死。《太阳以东，月亮以西》的继母把王子变形。《蓬发新娘》里的恶母女施法催国王入睡，最后被投入蛇坑。《十二只野鸭》的恶继母也几乎让白雪红玫死在火中。巨怪和女巫时常混在一起，可北方传统仍把两者分开。
        - id: ch04-b04
          speaker: narrator
          text: |-
            人变成野兽，是这些故事另一个醒目的特征。神能变形，是神力的一部分。雅典娜可以化成鹰或燕子，奥丁化鹰飞走，洛基则化成马或鸟。人能在特定条件下变成野兽的信念，也极其古老。希罗多德听说，黑海一带的涅乌里人每年会化狼几天，再恢复人形。罗马作家佩特罗尼乌斯还讲过一个完整的翻皮者故事。

            尼科罗斯同一名士兵在月光下经过墓地。士兵忽然脱光衣服，绕着衣服撒尿，接着化成狼，嚎叫着跑进树林。尼科罗斯想拿走衣服，却发现衣物已经变成石头。他吓得拔剑乱砍空气，直到跑到心上人的庄园。那里的人告诉他，一头狼刚闯进农场，咬死牲口，逃跑时被奴隶用长矛刺中脖子。天亮以后，尼科罗斯回到墓地，只看见地上的血。回家时，那名士兵正躺在床上，脖子流血，医生替他包扎。尼科罗斯从此认定他是翻皮者，再也不肯同他一起吃饭。

            狼人信仰传遍欧洲，也自然来到北方。《沃尔松格萨迦》明说西格蒙德和辛菲约特利会化成狼人。布伦希尔德和女武神则能披上天鹅羽衣。狼皮或羽衣可以穿脱，谁拿走脱下的外形，谁便控制变形者。后来英雄的能力降成巫术。人们说，套上狼皮腰带，甚至被狼皮手套扇一耳光，便会化成狼，在森林里停留九天，或三年、七年、九年。

            挪威人还特别相信人能化熊。熊是百兽之王，力量和聪慧都令人敬畏。芬兰人和拉普人自古被视为最厉害的巫师，据说他们能随意变熊。一头熊若格外凶猛，人们便说那不可能是基督徒熊。奥弗登教区有一头熊咬死许多马和人，最后被杀时，身上竟找到熊皮腰带，人们便把它当作人化熊的证据。

            《天气天空农夫》里，自愿变形的古老观念仍很清楚。那个农夫带着马、雪橇和男孩飞走，自称东西南北处处是家，遥远住处周围遍地死尸，还会化成鹰。他其实像一个降为恶魔的古神。多数童话中的变形却并非自愿。《太阳以东，月亮以西》的白熊是遭继母施术的王子。《寡妇之子》的马也是被人变形的王子。《彼得大人》里，猫原是被巨怪施法、又被夺走土地的公主。《七匹马驹》和《十二只野鸭》里的王子们，也因轻率许诺而变成马驹和野鸭。小妹妹来不及缝完最后一件衬衣的左袖，所以最小的弟弟恢复人形时，左臂仍是一只鸭翅膀。
        - id: ch04-b05
          speaker: narrator
          text: |-
            动物在这些故事里不只是变形的人，也保留着远古宗教的光辉。熊、狼、野猪、鹰、天鹅、蛇和小鸟都曾同神祇相连。基督教削弱旧信仰以后，人们仍觉得动物懂得人所不知道的秘密。它们会报恩，会预告危险，也会在关键时刻给英雄指路。故事中的好人愿意分食物给鸟兽，因此得到帮助。坏人粗暴驱赶它们，便错过救命的忠告。

            听懂鸟语的本领尤其古老。俗话说“一只小鸟告诉我的”，正是这份信仰留下的回声。民间歌谣保护鹪鹩、知更鸟和燕子的巢。有时一个人生来便懂鸟语，有时要吃下蛇或龙的肉才得到本领。西格尔德无意尝到法夫纳的心血，才听懂头顶燕子的歌，得知雷金要害他。童话里，小鸟也常把秘密告诉经受考验的姑娘，或提醒王子金鞋里正在涌出鲜血。

            接下来是巨人和巨怪。现代挪威传统对这两个名字分得不严，早先巨怪泛指超自然存在，巨人则更像一族愚钝多过邪恶的生灵。他们身量巨大，力气无边，任性全靠蛮力，最后也常被自己的重量压垮。人们起初还把古老智慧、传统知识和经验诀窍归给他们。他们像一个时代已经过去的原始民族，保存旧经验，却不会运用来改变未来。他们回头看得见过去，向前却看不见将来。没人招惹时，他们随和简单。一旦发怒，蛮力便狂暴发作。灵巧的敌人只需躲开一次次重拳，等他们耗尽气力，理智便取得胜利。

            巨人和阿萨神虽然注定在诸神黄昏决战，平时却会通婚、互访、设宴。索尔是巨人最凶恶的敌手，也偶尔同他们友好相见。巨怪同人类来往更多，脾气也更坏，更会有计划地作恶。基督教到来以后，阿萨神、霜巨人、巫师和古老自然力量都被混进“邪门”的一类，凡图谋害人的超自然力量便统称巨怪。因此，有些故事里的巨怪仍像随和的古霜巨人，笨拙得让人同情。有些却接近女巫或魔鬼，怀着固定的恶意。

            地道的巨怪住在森林山岭，也住在岩山深处。他们会去教堂，也吃人、粥和香肠，并不总是存心残忍，只是不懂别的活法。他们掳走人类孩子，守着地下矿物和金银。白天走进阳光照不透的黑森林，黄昏回洞穴，饱餐后鼾睡整夜。他们最怕太阳。只要正眼看见阳光，便会爆裂。这也保留着神话意义。北方旧教的神是快乐而明亮的力量，巨怪则属于雾霭与幽暗，受不了巴德尔明亮的脸，也受不了索尔雷电的一闪。

            从历史看，巨人与巨怪也许保存着一个敌对种族受压迫、退入森林山岭的记忆。人们把芬兰人和拉普人看作会施巫术的古老居民。他们没有固定住所，从一片森林走到另一片森林，憎恨农耕破坏猎场。传说中，巨人女儿捧着犁、马和农夫，称它们为漂亮玩具。母亲却命她立刻放回去，因为这些东西一来，巨人一族便必须搬走。另一个巨人看见人，把他们叫作蚯蚓。同伴却说，这些蚯蚓有一天会把巨人吃掉。巨怪不会酿酒、洗衣，也掌握不了耕种。人类的生活方式正是他们无法抵挡的力量。
        - id: ch04-b06
          speaker: narrator
          text: |-
            四方风也在故事里化成人形。北风最年长、最强壮，也最粗暴，可他终究是个亲切善良的好汉。《太阳以东，月亮以西》中，其他风都没有力量把姑娘送到城堡。北风只请她别害怕，好好休息，随后吸进所能容纳的全部空气，吹起风暴，带她上路。《去找北风的小伙子》中，他不能归还吹走的面粉，却给小伙子三件远胜损失的宝物。他像希腊的玻瑞阿斯，也像《埃达》里坐在世界尽头的鹰形巨人。那巨人每拍一次翅膀，吹向人类的风便由此而来。

            这些痕迹足以说明，挪威古老宗教仍乔装活在民间故事中。早期萨迦也偶尔说起牧人所讲的继母故事，或国王的孩子怎样受继母折磨。其实，即使没有这些文字证据，故事本身也已经足够。读过沃尔松格传说的人，会认出童话里同王子和姑娘说话的小鸟从哪里来。看到公主每夜放在身边的出鞘宝剑，也会想起西格尔德穿火以后，横在自己和布伦希尔德之间的格拉姆。神话的根埋得很深，它在本民族的故事里一代代抽出新枝。这比任何外部证据都更有力地证明，传统早已存在。
    - id: ch05
      title: 结论
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: |-
            最后只需看看这些故事里的男女。各民族讲故事都有自己的笔法。印度故事像热带森林，笔直的树干上挂满意象藤网。阿拉伯故事优雅，喜欢用教训点题，再添比喻和插曲。意大利故事明亮轻快。法国故事已经离开森林、田野和山岭，走进贵妇闺房，满屋玫瑰粉和香水，听不见鸟叫，也闻不到野花和松林。瑞典故事拘谨，像编年史。德国故事质朴热诚，滑稽多过幽默，像一位中产老妇用清楚、丰满、低沉的声音讲述。苏格兰故事虽少，语调和风格却不逊于任何故事集。它们同挪威故事相似，是因为苏格兰低地的讲述者本来就是挪威人的后裔。

            挪威故事大胆、直率，而且真正幽默。每遇到困难和危险，挪威人的古老性情便显出来。他们尽量把事情处理好，面对敌人仍不失从容。语言有时粗俗，因为这是挪威自耕农，是“粗麻衣之家”的故事。他们直话直说，点的是牛油灯，不是蜡烛。可没有哪个故事集整体格调更纯洁，道德的大界线也没有这样分明。它对人性的总看法善良而温厚。《山坡上的古德布兰》写婚姻幸福尤其动人。妻子对丈夫的温情压过一切考虑。两性之间也很公平，丈夫和妻子谁做错了事，都会受到应得的惩罚。

            故事里有一种人物反复出现。我们姑且叫他“小靴子”。挪威语称他阿斯克菲斯，也就是在灰里拨弄、把火吹旺的人，通常指家中最小的儿子。他其实是灰姑娘的弟弟。姐姐们把脏活推给灰姑娘，哥哥们也把苦活推给他。他常是三兄弟中最小的那个，受彼得和保罗这样的哥哥轻视嘲弄。可他内心有深沉的力量和天赋，善良力量也总对这些品质微笑。

            哥哥们失败以后，只有小靴子守得住谷仓，驯得服骏马，骑得上玻璃山，最后赢得公主和半个王国。他从垃圾箱和煤窖起步。别人劳动时，他坐在灰堆边，看似又脏又懒，心里却知道自己的时候终会到来。机会出现，他便束好腰带，迎向壮举。事情做成以后，他仍把功劳藏起来，回到厨房火边，直到相认的时刻。污垢和破衣随即落下，他穿着王袍站起来，终于被承认为王。这个形象让一个道理变得可见。谦逊、忍耐和能力即使受尽骄傲无能之人的贬低，最后仍会得到报偿。
        - id: ch05-b02
          speaker: narrator
          text: |-
            女性人物通常不如男性鲜明，因为这些故事多用男子气概的口吻讲出。但《女大师》《破衣帽姑娘》《两个继姐妹》《太阳以东，月亮以西》《蓬发新娘》和《十二只野鸭》，仍塑造出真正动人的姑娘。她聪明善良，乐于助人，常为了别人忘记自己。她会轻轻跨过篱笆，挤牛奶，剪羊毛，替苹果树减轻枝头重负。她替一颗可怕的人头洗净梳好，甚至亲吻它。她相信别人的话，即使因此受冤受伤。她舍弃珍爱的一切，有时甚至准备牺牲自己，只因为别人骗她说，这是哥哥的心愿。

            善良力量也向她微笑。她听懂小鸟的话，知道该选哪一只匣子。考验过去以后，场景忽然改变，她得到辉煌奖赏，恶继母和丑女儿则迎来自己的命运。《灰胡子哈康》里的公主起初骄傲傲慢，报应降临时，读者觉得痛快。她后来为一个乞丐舍弃一切，随他而去，受尽苦难，读者又渐渐心软。她哭着喊起乞丐、婴儿和茅屋时，我们也替她难过。王子终于表明身份，说乞丐就在这里，婴儿也在那里，茅屋尽管烧掉，我们又同她一起欢喜。

            故事对各种职业也各有态度。教会没有受到多少敬重。劳伦斯神父被神偷骗得狼狈不堪，《灰鹅姑娘》里的神父也被扔进湿泥炭地。法律由警官、律师和治安官几个可怕人物代表，同样受到毫不温柔的嘲弄。只有一个职业得到一句好话。《十二只野鸭》说，国王对白雪红玫像医生一样温柔善良。这里说的不是法律博士，而是真正医治人的医生。这个常被轻视、其实高贵的职业，就凭一句话赢得了教会和法律都没能从民心取得的敬意。当然，《木斗篷凯蒂》也骂过贪钱的医生，所以故事并不盲目偏爱任何人。
        - id: ch05-b03
          speaker: narrator
          text: |-
            导言该结束了，免得它像恶狼吞掉奥丁一样，把故事本身也吞掉。前面至少已经说明，育儿室童话也有自己的学问。研究还可以无穷无尽地走下去，像一段每转过一个弯便出现新风景的旅程。民间神话是一座远未采尽的矿。在英国，它几乎还没有人开采。

            人们担心，搜集英国传统的时机已经过去。蒸汽机和印刷机是不是把启蒙做得太彻底，使故事像巨人败在奥丁和阿萨神面前一样消失了？挪威本身却提醒我们，不可太早绝望。挪威人的子孙也曾以为本国故事很少，后来却发现它们仍如此鲜活丰满。一次搜集失败，问题也许在寻找传统的人，并不在传统本身。

            这类故事很难搜集。民族珍宝常藏在年老衰弱的女人心里，她们很难相信来访者真有兴趣，总怕别人只是来嘲笑。民心像一株敏感的植物，粗鲁一碰，叶片便羞怯地合上。叶子一旦闭合，再想让苍老嘴唇吐露记忆里的秘密就很难了。故事仍在那里，像传统的暗流。受过教育的人只看见信仰的明亮表层，常忘记下面还有什么。偶尔机缘把暗处东西抛上水面，学校督察便会惊讶，普通民众心里竟还留着这些奇异形状。

            英国人不能说自己不迷信。一个多世纪以来，人们不断宣告全国再也没人相信女巫、男巫和鬼魂。牧师压制它们，哲学家也告诉世界这些迷信多么荒唐。可就在不久前，斯塔福德郡一次审判还找出许多证人。他们坚信巫术，也宣誓相信幽灵犬和巫师。这足以证明，中部各郡的传统远未绝迹。蒸汽、自然哲学和教会既然让坏东西留下这么多，但愿好东西也仍与它们一同存在。愿英国自己的格林终会出现，继续钱伯斯在苏格兰开始的工作，从某位盎格鲁－撒克逊的老妈妈口中，找回一些英国曾同整个雅利安民族共有的故事。
        - id: ch05-b04
          speaker: narrator
          text: |-
            阿斯比约恩森和穆搜集这些挪威故事时，温柔与技巧无人能比。英译本也希望保住原作的一点温情和美。可没有去过故事生长的地方，没有熟悉那里热诚质朴的人民，无论怎样形容，都很难体会原作的清新真实。挪威语和英语在词汇结构上其实十分接近，真正缺少的不是语言，而是自然本身的面貌，以及仰望自然的民族性格。

            那里有恒久明净的蓝天，有曲折深嵌、波光闪耀的峡湾，有桀骜的河流和直泻的瀑布。陡峭山坡接着绵长山脊，尖峰锐利地升起，冰川悬垂，积雪终年不化。无尽松林高高耸立，银桦的细干穿插其间。林中有绿地、曲折山谷和高原湖泊。驼鹿轰然冲过，驯鹿飞奔，熊无所畏惧，猞猁敏捷，狼却羞怯。天空还有鹰，水上有天鹅和海鸟。

            夏日的暮色整夜不散，自然的许多声调从远处合成音乐。白昼渐短时，北极光灿烂闪动。秋雪风暴亮得使人目盲，冬季的霜寒却叫人精神振奋。最快乐的是坐雪橇飞过平滑冰面。钉着锐掌的马拉着轻橇全速前进，穿过青翠云杉林，又沿着咯吱作响的积雪冲下陡坡。这一切合在一起，才成为挪威独有的自然。

            在这样的自然中，生活着诚实刚健的人。他们不属于城镇，而属于山谷和群岭。他们自由不屈，牢牢守住自己的位置。这个国家没有老爷太太，只有质朴的男人和女人。勇敢的男子、美丽的女子守着祖先传统，记忆像本土精钢制成的忠实明镜，映照全族走过的历史。当这样的民族遇见这样的山河，制成故事的材料便齐全了，凿刻民族形象的活岩也已经摆在眼前。

            我们的介绍到这里结束。现在可以放下笔，把读者和故事留给彼此。
