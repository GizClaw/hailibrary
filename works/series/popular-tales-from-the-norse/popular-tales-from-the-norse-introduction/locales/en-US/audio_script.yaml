  chapters:
    - id: ch01
      title: Origin
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            Even a careless reader will notice that many tales in this book rest on the same foundations as stories heard in childhood. They belong to the old nursery, when nurses still passed tales from mouth to mouth. In England that living voice had long been silent. Readers knew Cinderella, Beauty and the Beast, Little Red Riding Hood, Blue Beard, Sinbad, and Aladdin mostly through polished French collections that mixed ages and countries together. Translation could not destroy the beauty of the traditions, but people forgot that some were native growths. Few imagined that nursery tales might have a history, or even a science, of their own. When a northern tradition resembled a Greek or Roman myth, scholars simply assumed that the common language had copied the classics.
        - id: ch01-b02
          speaker: narrator
          text: >-
            Near the end of the wars against Napoleon, Jacob Grimm rose in Germany to defend the dignity of everyday speech. His grammar showed the kinship and worth of the Teutonic languages. His work on old law and medieval poets restored subjects dismissed as barbarous. Above all, his mythology, Reynard the Fox, and the tales he published with his brother William turned nursery fictions into evidence about the early history of a whole family of peoples.
        - id: ch01-b03
          speaker: narrator
          text: >-
            This introduction crosses too much ground to show every step of the argument. The listener must sometimes accept the soup without asking to see every bone from which it was boiled. The study of Eastern and Western languages and myths now supports itself on both sides. The discoveries of Anquetil du Perron, Sir William Jones, Colebrooke, Wilson, Bopp, Lassen, Max Müller, Grimm, and others established the relationship between Sanskrit and the Indo-European languages. A nation's earliest trustworthy history is the history of its tongue. England's own Celtic, Roman, Saxon, Norse, and Romance elements preserve the marks of the peoples who crossed the island. Comparative study follows whole families of languages back toward a common center, like rays returning to the sun.
        - id: ch01-b04
          speaker: narrator
          text: >-
            The argument given here places the common ancestors of the Aryan peoples in ancient Iran. One movement went west until its branches became Celts, Greeks, Romans, Teutons, and Slavonians. Another moved through Afghanistan and the Five Rivers into India. The western peoples changed with new lands, neighbors, struggles, and borrowed words. The eastern branch preserved old language and tradition with extraordinary firmness. Its Sanskrit records therefore became the key that earlier scholars had lacked when they tried, often wildly, to derive European speech from Greek, Latin, or Hebrew.
        - id: ch01-b05
          speaker: narrator
          text: >-
            The author contrasts the two branches as brothers in a tale. The younger went into the world, acted, adapted, and rose to power. The elder settled in India and turned toward contemplation. The Vedas show a people of philosophers, rich in thought but withdrawn from practical history. That judgment carries the prejudices of the author's own age, yet it leads to his central point. However different the later peoples became, their records preserve a language close to the speech used before the separation.
        - id: ch01-b06
          speaker: narrator
          text: >-
            The westward streams probably divided along several roads. One passed through Persia and Asia Minor toward Greece and Italy. Another moved between the Caspian and Black Seas, across the Balkans and Carpathians, and became the broad Teutonic stock, pressing upon earlier Celtic settlers. A more northerly stream appeared later as the Slavonians. Their descendants often called one another's speech barbarous, yet every tongue carried signs of the same origin. Greek, Latin, Celt, Teuton, and Slav all came from the East as kin, leaving kin behind. Thousands of years later, language and tradition still bore witness to that common stock.
    - id: ch02
      title: Diffusion
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            With that relationship established, the question narrows to popular tales in general and these Norse tales in particular. Shared plots are not merely amusing coincidences. They form another link between East and West. Contact with older peoples certainly allowed words and traditions to pass from one group to another. But the countless likenesses across Aryan storytelling cannot all be explained as one nation copying another. The Master Thief appears in Sanskrit, Greek, German, Italian, and Flemish forms, yet every people reshaped it for its own place and temper.
        - id: ch02-b02
          speaker: narrator
          text: >-
            Consider William Tell's shot. The archer ordered by a tyrant to shoot an object from a child's head appears before Tell in Saxo's story of Palnatoki, in the Wilkina Saga, in tales of Saint Olof, King Harold and Hemingr, Puncher of the Upper Rhine, and William of Cloudesly. Turks, Mongolians, and Samoyeds knew it too. The early Swiss chronicles say nothing about Tell's feat. The old story gathered around his name because a grateful people naturally crowns a beloved champion with remembered deeds.
        - id: ch02-b03
          speaker: narrator
          text: >-
            The faithful hound Gellert belongs to the same wandering inheritance. Elsewhere a wolf, bear, or snake threatens the child, while an otter, weasel, or dog saves it and is wrongly killed. Versions occur in the Panchatantra, the Hitopadesa, Bidpai, the Seven Wise Masters, the Gesta Romanorum, and medieval English. Such tales are like sisters from one house. They share a family likeness, yet each has her own face and mind. They are also like national dreams. Many people dream about the same ancient experience, but every dream bears the sleeper's character and mixes old belief with yesterday's event.
        - id: ch02-b04
          speaker: narrator
          text: >-
            A newer copying theory traced Western tales entirely through two translated collections, Calila and Dimna and the Story of the Seven Sages. Let everything actually found in those books be granted to translation. Many close parallels remain outside both roads. In Somadeva's Sea of Streams of Story, King Putraka meets two men fighting over flying shoes, a staff that raises whatever it points at, and a bowl that supplies any food. He proposes a race, then takes the treasures and flies away. In the Norse Three Princesses of Whiteland, a king meets brothers fighting over a hat, cloak, and boots that grant invisibility and travel. He offers to judge after trying them, then wishes himself away. Tartar, Wallachian, and Mongolian stories repeat the contest with their own marvelous objects. Norse tales scatter the same pieces among magic cloths, sticks, scissors, taps, and boots. The Nibelungen story gives Siegfried the treasure and cloak after heirs ask him to divide their hoard.
        - id: ch02-b05
          speaker: narrator
          text: >-
            Even when a fable appears in an Indian collection, translation need not have been its only road west. Aesop and Indian books share the lion, fox, and bull centuries before those translations. Tradition could have traveled with the earliest migration itself, carried from person to person and age to age. Common sights may inspire similar stories independently. A very peculiar explanation is different. The Norse bear loses his tail because the fox tricks him into freezing it in an ice hole. In Bornou, a weasel ties a hyena's tail inside a pit and urges him to pull until it breaks. The setting changes from northern ice fishing to an African trap, but cunning causes the same strange injury.
        - id: ch02-b06
          speaker: narrator
          text: >-
            The Arabian Nights tells of a man who understands animals, laughs at their speech, and faces his wife's demand to know why. Straparola, Serbia, and Bornou preserve altered forms. African, Egyptian, West Indian, Mongolian, German, and Norse traditions likewise share brothers, wishing trees, despised youngest children, helpful or rejected acts, trolls, giants, and hidden lives. The author sees these not as late copies but as fruit borne by branches of one ancient human stock. Language and story spread together from the East to the farthest parts of the earth.
    - id: ch03
      title: Norse Mythology
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            Norse belief is unusually visible because Iceland preserved its language and books, and because conversion came late. The Eddas, sagas, and Saxo let us see a mythology that elsewhere survives only in fragments. Odin and the Aesir dwell in Asgard at the center of Midgard. Sea circles the human world, and beyond it lies Utgard, home of Frost Giants and monsters. Gods and giants sometimes visit under truce, but their true relation is war. Among people, Trolls stand as smaller frost giants, stronger than humans but poorer in wit.
        - id: ch03-b02
          speaker: narrator
          text: >-
            The Norse gods carry the character of their worshippers. Odin travels, tests his wit, and narrowly escapes old foes. Thor crosses the sea with belt, iron gloves, and hammer to battle giants. All face the doom of Ragnarök, when wolf and world-serpent break loose and gods and enemies destroy one another. Their songs preserve bravery, endurance, adventure, and the will to struggle though defeat is certain. Heroes and shield-maidens join them in Valhalla, and the greatest heroic cycle is the tale of Volsungs and Niflungs, beginning and ending under the curse of stolen gold.
        - id: ch03-b03
          speaker: narrator
          text: >-
            Volsung's hall grew around a great oak. At Signy's wedding, a one-eyed stranger drove a sword into its trunk and promised it to whoever could draw it. Only Sigmund succeeded. Treachery killed Volsung and most of his sons, but Signy saved Sigmund. After vengeance and many wild deeds, Sigmund grew old. In his final battle, a one-eyed warrior met his sword with a spear. Gram broke, and Sigmund knew Odin had withdrawn the gift. His wife Hjordis carried the unborn Sigurd to Denmark.
        - id: ch03-b04
          speaker: narrator
          text: >-
            Regin raised Sigurd and urged him to kill the dragon Fafnir. The treasure had begun when Loki killed an otter that was really Regin's brother. Odin, Loki, and Haenir paid the family with gold taken from the dwarf Andvari. Odin had to surrender even Andvari's last ring, and the dwarf cursed the hoard. Regin and Fafnir killed their father for it. Fafnir then drove Regin away and guarded everything in a dragon's shape. Regin reforged Gram from its broken pieces. Sigurd first avenged his father, then dug a pit beneath Fafnir's path and killed the dragon. While roasting its heart for Regin, he burned his finger, tasted the blood, and understood birds. They warned that Regin meant betrayal. Sigurd killed him, ate the heart, and took the hoard.
        - id: ch03-b05
          speaker: narrator
          text: >-
            Sigurd rode through a wall of flame and woke Brynhildr, the Valkyrie whom Odin had condemned to sleep. They pledged themselves to each other. At King Giuki's hall, Grimhildr gave Sigurd a drink of forgetfulness. He forgot Brynhildr, married Gudrun, and became brother to Gunnar and Hogni. When Gunnar sought Brynhildr, only Sigurd and his horse could cross the fire. Magic gave Sigurd Gunnar's shape. He won Brynhildr for Gunnar, laid Gram between them at night, and gave her Andvari's ring. After Gunnar's wedding, Sigurd remembered everything but remained silent.
        - id: ch03-b06
          speaker: narrator
          text: >-
            At the river, Gudrun revealed the deception by showing the ring. Brynhildr's love turned to hatred. Gunnar and Hogni would not break their sworn brotherhood openly, so they drove Guttorm to murder Sigurd in bed. Dying, Sigurd threw Gram and cut Guttorm in two. Brynhildr's love returned too late. She joined Sigurd on the funeral fire. The curse continued. Atli lured Gunnar and Hogni to their deaths for the gold. Gudrun avenged them by killing her sons by Atli, serving their flesh to him, killing him, and burning his hall. The sea refused her attempt to drown. She married Jonakr and later sent their sons to avenge Svanhild, her daughter by Sigurd, whom Hermanaric had trampled to death. The brothers killed Erp on the road, then discovered too late that his part was necessary. They wounded Hermanaric but could not silence him, and his men stoned them. Gudrun's death ended the line.
        - id: ch03-b07
          speaker: narrator
          text: >-
            Greek myth reached polished beauty before it faded. Norse myth remained rough and melancholy because Christianity interrupted its growth. Yet rough truth may be better than polished falsehood. Its highest god was a father who welcomed brave children home, and beside him stood a mother who taught peaceful arts. The old northern respect for women helped shape later devotion to the Virgin. There is no need to love Greek or Norse belief alone. Both open different fields of beauty.
        - id: ch03-b08
          speaker: narrator
          text: >-
            Conversion in Denmark, Norway, Iceland, and Sweden took more than three centuries and depended on compromise as well as force. Kings, missionaries, chiefs, and common people struggled. Olof Tryggvason used hostages. Saint Olof tried to drive people to the cross. Thangbrand answered objections with combat. In Iceland, private heathen rites survived for a time. Churches and crosses rose where sacred trees, wells, and burial places already drew worshippers. Old songs and processions continued beneath Christian names.
        - id: ch03-b09
          speaker: narrator
          text: >-
            The gods lost honor before they lost power. Odin's splendid ride through storm, battle, and hunt became the Wild Hunt of ghosts and damned souls. His name survived in Sweden, while Denmark spoke of King Waldemar, Norway of Asgard's Car, Germany of Woden or other hunters, France of the Grand Huntsman, and England of Arthur, Herne, and local night riders. Christianity degraded Odin and the Aesir into beings mingled with giants and Trolls. Later, a corrupt and worldly church absorbed stories it could not destroy and retold old divine journeys about Christ and the saints.
    - id: ch04
      title: Norse Popular Tales
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            Norway's isolation allowed old tradition to remain unusually clear. Its tales were only recently collected, yet they preserve the people's half-conscious memory. Gods who once visited mortals reappear under Christian names. Christ and Saint Peter take the places once held by Odin and his companions, while Saint Peter sometimes carries Loki's sharp comic temper. Frigga, Freyja, and the Norns leave traces in the helpful Virgin Mary, who spins, protects, punishes, forgives, and guards sun, moon, and stars.
        - id: ch04-b02
          speaker: narrator
          text: >-
            Odin was also Wish, not merely an empty longing but desire fulfilled and good freely given. Myth gave the gods chosen things: Odin's victorious spear and multiplying ring, Thor's hammer and strength-belt, Freyr's self-wielding sword and folding ship, Freyja's necklace, Idun's apples, and the sea giant's terrifying helm. Their descendants fill the tales. Shortshanks gains a conquering sword and a pocket-sized ship that carries five hundred men. Other heroes find self-spreading cloths, food-making vessels, magic taps, traveling boots, a belt of strength, and a stone that tells secrets. The same hope appears in Celtic caps, Roman horns, Greek and Indian animals and trees, Finnish Sampo, and household luck throughout Europe.
        - id: ch04-b03
          speaker: narrator
          text: >-
            The old dream of a golden age survives in Frodi's peace, when crops grew unsown and gold lay untouched on the road. But Frodi forced the giant maidens Fenja and Menja to grind his magic mill with almost no rest. They stopped grinding peace and gold and ground out fire and war. The sea-rover Mysing killed Frodi and carried away the mill. At sea he ordered the women to grind salt and would not let them stop. The ship sank under it, and that is why the sea is salt.
        - id: ch04-b04
          speaker: narrator
          text: >-
            The Christian Devil was foreign to early northern belief. Norse Hel was a stern goddess of a cold realm for those who died of illness or age, not a tormentor of the wicked. Christianity turned her name into a fiery place of punishment. Yet tales still picture Hell as needing Christmas firewood and lacking meat. Their Devil often behaves less like the subtle enemy of Christian teaching than like a strong, hostile, easily fooled giant. The Master Smith even meets nine locked gates, one for each of Hel's old worlds.
        - id: ch04-b05
          speaker: narrator
          text: >-
            Powers not transferred to the Virgin darkened into stories of Diana, Holda, Herodias, and the Good Lady leading women through the night. Women had once been healers, rune readers, priestesses, and keepers of plant knowledge. The same skills could be feared as poison, false prophecy, and witchcraft. Church persecution joined old superstition to a newly powerful Devil. From the fourteenth through seventeenth centuries, torture produced the same grim pattern of denial, confession, accusation, renewed denial, and death. Catholic and Protestant lands both took part. Northern tales still show witches, though many may preserve older heathen magic rather than the learned frenzy of witch trials.
        - id: ch04-b06
          speaker: narrator
          text: >-
            Transformation is another ancient inheritance. Gods everywhere take animal shape, and people long believed that humans could become wolves, bears, birds, and other creatures. Classical writers tell of turnskins. Norse tradition gives wolfskins to Sigmund and Sinfjötli and swan forms to Valkyries. Later belief made such changes the work of magic. In the tales, Farmer Weathersky changes himself, while bewitched princes become a white bear, a horse, foals, or wild ducks, and a princess becomes the cat called Lord Peter. Sometimes one unfinished sleeve leaves a restored brother with a duck's wing for an arm.
        - id: ch04-b07
          speaker: narrator
          text: >-
            Animals also have stories of their own. The Beast Epic grew from close attention to nature, not merely from satire or a lesson. Aesop preserved only late, moralized remains of a much older cycle. Related animal tales range from India to Africa, Mongolia, New Zealand, the West Indies, Serbia, and Norway. In the North, Bear is strong, honorable, and slow. Fox is clever and deceitful. Wolf is fierce and foolish. Their contests explain tails, bargains, stolen butter, and changing fortunes with the lively truth of creatures observed at close quarters.
        - id: ch04-b08
          speaker: narrator
          text: >-
            Trolls preserve the older giants. They own treasure and strength but lack human invention. They build, carry, and threaten, yet heroes defeat them through tools, farming knowledge, and wit. Fire, smithcraft, ships, and agriculture belong to humankind. A cat can keep a giant listening all night merely by explaining the many steps of raising winter rye. The winds appear as four brothers. The North Wind is oldest, roughest, and strongest, but also generous. He carries the girl beyond the reach of his brothers and repays the lad whose meal he scattered.
        - id: ch04-b09
          speaker: narrator
          text: >-
            Written sagas mention the stepmother stories told by shepherds, but internal evidence is stronger. Speaking birds recall Sigurd's taste of dragon blood. A princess who sleeps beside a naked sword recalls Gram between Sigurd and Brynhildr. These are living shoots from deep mythic roots, renewed from age to age in popular storytelling.
    - id: ch05
      title: Conclusion
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: >-
            Each people's tales have their own manner. Indian stories carry a tropical growth of imagery. Arab tales are elegant and pointed. Italian tales move brightly and quickly. French stories seem perfumed and indoors. Swedish ones can sound like chronicles. German tales are simple, hearty, and comic. Scottish stories stand among the best, and their likeness to Norwegian tales reflects the Norse ancestry of Lowland Scots rather than the late import of one particular story.
        - id: ch05-b02
          speaker: narrator
          text: >-
            The Norse tales are bold, direct, and truly humorous. Trouble brings out the habit of facing an enemy with a good expression and making the best of things. Their language belongs to working country people, yet their general tone is remarkably clean, their moral sense steady, and their view of human nature kind. Gudbrand's wife values love above every foolish bargain. Other tales balance foolish wives with the husband who fails disastrously when he minds the house.
        - id: ch05-b03
          speaker: narrator
          text: >-
            Their recurring hero is Boots, the youngest son who pokes among the ashes while his brothers mock him. Sweden has Pinkel, Germany has Dummling, and England has Jack the Giant Killer. But Norse Boots starts lower, among dust and coal. He waits because he knows his strength will have its hour. When his brothers fail, he watches the barn, tames the horse, rides the glass hill, wins the princess, and returns quietly to the ashes until recognition comes. Then rags fall away and the despised boy stands in royal clothing. He gives form to the hope that modesty, endurance, and ability will receive their reward.
        - id: ch05-b04
          speaker: narrator
          text: >-
            The women are less strongly drawn overall, but the Mastermaid and Tatterhood equal any hero. Other girls are bright, generous, and ready to forget themselves for someone else. One treats hedge, cow, sheep, tree, and even a loathsome head with kindness. Another sacrifices what she loves because she believes it is her brother's wish. Good powers help them understand birds and choose rightly. Hacon Grizzlebeard's proud princess changes through hardship and affection into a faithful wife, and her reunion moves us because she had first given us reason to condemn her pride.
        - id: ch05-b05
          speaker: narrator
          text: >-
            Priests, constables, attorneys, and sheriffs fare poorly in these tales. Popular humor takes revenge on both Roman superstition and strict Lutheran severity, and it mocks the law's solemn officers. Medicine receives one rare compliment when a king is called as soft and kind as a doctor, though another doctor accepts money from a wicked queen. No profession escapes entirely.
        - id: ch05-b06
          speaker: narrator
          text: >-
            It is time to stop before the introduction swallows the tales as the Wolf was meant to swallow Odin. Nursery stories do have a science. Their study could continue without end, because every turn reveals another view. England may have waited too long. Steam and print may have driven away tales as Odin drove away giants. Yet Norway was also thought poor in stories until patient collectors found them fresh and plentiful. The difficulty may lie with collectors who cannot persuade old storytellers that their memories will be treated with respect. Popular tradition closes at ridicule like a sensitive plant.
        - id: ch05-b07
          speaker: narrator
          text: >-
            Educated people may declare witches and ghosts extinct while courts still uncover witnesses who believe in both. If older fears remain, perhaps older beauty remains with them. England may yet find its own Grimm. Asbjörnsen and Moe gathered Norway's tales with tenderness and skill. Translation can carry some of their beauty, but not the whole country behind them: blue sky, winding fjords, waterfalls, steep fells, glaciers, snow, pine and birch, elk and reindeer, bear, lynx, wolf, eagles, swans, summer twilight, northern lights, autumn storms, winter frost, and sledges rushing through spruce woods.
        - id: ch05-b08
          speaker: narrator
          text: >-
            In that landscape lives an honest and independent country people, brave men and fair women who keep the traditions of their ancestors. Their memory reflects the history of their race like native steel. When such a people and such a land meet, we have the living rock from which these national tales were cut. The introduction can end here. The reader and the tales may now be left together.
    - id: ch06
      title: Tales from the Norse
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: And now the tales from the Norse begin.
