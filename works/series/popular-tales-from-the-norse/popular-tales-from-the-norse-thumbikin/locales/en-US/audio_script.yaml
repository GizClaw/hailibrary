audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: thoughtful and gently wry
        timbre: warm and clear
        pace: measured
        pitch: medium
    thumbikin:
      display_name: Thumbikin
      tts:
        delivery: bright and mischievous
        timbre: tiny and clear
        pace: lively
        pitch: high
  chapters:
    - id: ch01
      title: A Bride for Thumbikin
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Once upon a time, a woman had an only son. He was no taller than her thumb, so they called him Thumbikin.
        - id: ch01-b02
          speaker: narrator
          text: When he was old enough to know right from wrong, his mother told him it was high time he thought of taking a wife. He should go out and find himself a bride.
        - id: ch01-b03
          speaker: narrator
          text: Thumbikin was delighted. They made the carriage ready and set off, with his mother carrying him tucked inside her bosom. Their journey would take them to a palace, where an enormously big Princess lived.
        - id: ch01-b04
          speaker: narrator
          text: They had not traveled far when Thumbikin vanished. His mother searched everywhere. She shouted his name and wept, but she could not find him.
        - id: ch01-b05
          speaker: thumbikin
          text: Pip, pip! Here I am!
        - id: ch01-b06
          speaker: narrator
          text: He had hidden in the horse's mane. Out he came, and his mother made him promise not to hide from her again.
    - id: ch02
      title: Now You See Him, Now You Don't
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: They drove a little farther, and Thumbikin disappeared once more. Again his mother searched and called. Again she wept. But he was gone, and this time he stayed gone.
        - id: ch02-b02
          speaker: thumbikin
          text: Pip, pip!
        - id: ch02-b03
          speaker: narrator
          text: At last she heard him laughing and tittering, though she still could not see where he was.
        - id: ch02-b04
          speaker: thumbikin
          text: Pip, pip! Why, here I am now!
        - id: ch02-b05
          speaker: narrator
          text: Thumbikin popped out of the horse's ear. His mother made him give his word once more that he would stop hiding.
        - id: ch02-b06
          speaker: narrator
          text: Yet they had scarcely gone any farther when he vanished for a third time. He simply could not help himself. His mother hunted for him, cried, and called him by name. The more she searched, the less chance she had of finding him.
        - id: ch02-b07
          speaker: thumbikin
          text: Pip, pip! Here I am, then!
        - id: ch02-b08
          speaker: narrator
          text: His voice sounded so dull and muffled that she could not tell where it came from. She kept searching while Thumbikin kept calling out and chuckling.
        - id: ch02-b09
          speaker: thumbikin
          text: Pip! Here I am!
        - id: ch02-b10
          speaker: narrator
          text: All at once, the horse snorted. Out flew Thumbikin. He had crawled right up one of its nostrils.
        - id: ch02-b11
          speaker: narrator
          text: His mother could see that he simply could not stop hiding. She knew no other way to manage him, so she put him into a bag.
    - id: ch03
      title: The Wedding Feast
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: When they reached the palace, the match was quickly settled. The Princess thought Thumbikin was a pretty little fellow, and before long the wedding day arrived.
        - id: ch03-b02
          speaker: narrator
          text: At the wedding feast, Thumbikin sat beside the Princess. But his seat was worse than useless. He could not reach the tabletop when it was time to eat. If the Princess had not lifted him onto the table, he would not have tasted a single bite.
        - id: ch03-b03
          speaker: narrator
          text: As long as the food came on a plate, all went well. Then a great bowl of porridge arrived. Even from the tabletop, Thumbikin could not reach over its rim.
        - id: ch03-b04
          speaker: narrator
          text: He soon found a way around that. He climbed up and perched on the lip of the bowl.
    - id: ch04
      title: The Butter in the Bowl
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: In the very middle of the porridge sat a pat of melting butter. Thumbikin wanted to dip his porridge into it, but it was still too far away. So he climbed down and took a seat right at the butter's edge.
        - id: ch04-b02
          speaker: narrator
          text: Just then, the Princess came along with a great spoonful of porridge and reached to dip it into the butter. Alas, the spoon came too close to Thumbikin and knocked him over.
        - id: ch04-b03
          speaker: narrator
          text: He tumbled in over head and ears, and there in the melted butter, Thumbikin drowned.
