audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 从容而清醒，带一点克制的诙谐
        timbre: 温厚清晰
        pace: 舒缓有致
        pitch: 中低
    thumbikin:
      display_name: 拇指娃
      tts:
        delivery: 淘气机灵，藏起来时忍不住暗自得意
        timbre: 细小清亮
        pace: 中等偏快
        pitch: 高
  chapters:
    - id: ch01
      title: 藏进马鬃里
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 从前，有个女人，膝下只有一个儿子。那孩子还没有人的大拇指高，所以大家都叫他拇指娃。
        - id: ch01-b02
          speaker: narrator
          text: 等拇指娃长到懂事的年纪，母亲对他说，他也该想想娶妻的事了，得出门找个新娘。拇指娃听了高兴极了。母子俩备好车马，动身去一座王宫。那里住着一位高大得吓人的公主。母亲把小小的拇指娃揣在怀里，可车子才走了一小段，他就不见了。母亲四下寻找，扯着嗓子叫他，急得直掉眼泪。她一处又一处地找，还是不见他的踪影。
        - id: ch01-b03
          speaker: thumbikin
          text: 吱，吱，我在这儿呢！
        - id: ch01-b04
          speaker: narrator
          text: 原来，拇指娃躲进了马鬃里。他钻出来以后，只好答应母亲，再也不这样胡闹。
    - id: ch02
      title: 怎么找也找不到
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 可车子又走了一段，拇指娃竟然再次不见了。母亲到处找他，一边呼唤，一边流泪。拇指娃却始终不肯露面。
        - id: ch02-b02
          speaker: thumbikin
          text: 吱，吱，我在这儿呢！
        - id: ch02-b03
          speaker: narrator
          text: 母亲听见他在暗处咯咯笑，却无论如何也找不到他。过了一会儿，拇指娃终于自己现了身。
        - id: ch02-b04
          speaker: thumbikin
          text: 吱，吱，我就在这儿！
        - id: ch02-b05
          speaker: narrator
          text: 他从马耳朵里钻了出来，又向母亲保证，再也不会藏起来。谁知车子没走多远，他又没影了。这个小家伙实在忍不住不藏。母亲找啊，哭啊，一遍遍叫他的名字，可她越找，越找不着。
        - id: ch02-b06
          speaker: thumbikin
          text: 吱，吱，我在这儿呢！
        - id: ch02-b07
          speaker: narrator
          text: 这回，他的声音又低又闷，像隔着什么东西传出来。母亲继续寻找，拇指娃就一遍遍喊着自己在这里，还偷偷笑个不停。忽然，那匹马打了个响鼻，竟把他喷了出来。原来，拇指娃钻进了马的一只鼻孔里。
        - id: ch02-b08
          speaker: narrator
          text: 母亲终于抓住他，把他装进一只袋子。她已经看明白了，这孩子就是忍不住要藏起来，除了这样，实在没有别的办法。
    - id: ch03
      title: 婚宴上的黄油
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 母子俩到了王宫，亲事很快就说成了。公主觉得拇指娃是个俊俏的小人儿，没过多久，两人便举行了婚礼。
        - id: ch03-b02
          speaker: narrator
          text: 婚宴开席时，拇指娃坐在公主身旁。可他的座位有还不如没有，因为他根本够不着桌面。若不是公主把他抱到桌上，他连一口东西也吃不到。
        - id: ch03-b03
          speaker: narrator
          text: 食物盛在盘子里时，拇指娃吃得挺顺利。后来，桌上端来一大碗粥，碗沿高得他够不着。他很快想出办法，爬上去坐到了碗沿上。
        - id: ch03-b04
          speaker: narrator
          text: 碗中央还有一大块正在融化的黄油。拇指娃想把粥蘸进黄油里，可离得太远，于是又走过去，坐到融化的黄油边上。偏偏这时，公主舀起满满一大勺粥，也要往黄油里蘸。她这一勺挨拇指娃太近，一下把他碰翻了。
        - id: ch03-b05
          speaker: narrator
          text: 唉！拇指娃头朝下栽进黄油，整个人都没了进去，就这样淹死在融化的黄油里。
