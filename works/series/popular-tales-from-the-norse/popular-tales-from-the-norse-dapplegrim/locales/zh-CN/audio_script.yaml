audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 从容而清醒，带一点克制的诙谐
        timbre: 温厚清晰
        pace: 舒缓有致
        pitch: 中低
    lad:
      display_name: 年轻人
      tts:
        delivery: 直率坚定，遇到刁难时坦白而不失勇气
        timbre: 年轻清亮
        pace: 中等
        pitch: 中高
    brother_1:
      display_name: 大哥
      tts:
        delivery: 冷淡现实，说话不留情面
        timbre: 坚实干涩
        pace: 中等
        pitch: 中
    brother_2:
      display_name: 二哥
      tts:
        delivery: 冷淡现实，口吻粗直
        timbre: 宽厚低沉
        pace: 中等
        pitch: 中低
    brother_3:
      display_name: 三哥
      tts:
        delivery: 冷淡现实，语气短促
        timbre: 清脆偏薄
        pace: 中等
        pitch: 中高
    dapplegrim:
      display_name: 斑灰
      tts:
        delivery: 沉着自信，遇到险阻也毫不慌乱
        timbre: 深沉洪亮
        pace: 从容
        pitch: 低
    king:
      display_name: 国王
      tts:
        delivery: 威严浮夸，主意常被身边人左右
        timbre: 饱满有力
        pace: 从容
        pitch: 中低
    princess:
      display_name: 公主
      tts:
        delivery: 清楚真诚，危急时语气恳切
        timbre: 明亮柔和
        pace: 中等
        pitch: 中高
  chapters:
    - id: ch01
      title: 斑灰长大了
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 从前，一对富有的夫妇养育了十二个儿子。最小的儿子长大后，再也不愿留在家里。他想去外面的世界闯一闯，看看自己的运气。父母劝他，家里的日子已经很好，留下来才稳妥。可他安不下心，非走不可。父母只好答应。他一路走到一座王宫，在那里求得了一份差事。
        - id: ch01-b02
          speaker: narrator
          text: 这个国家只有一位公主，却被山怪掳进了山中。国王失去了唯一的孩子，全国也跟着悲伤。国王公开许诺，谁能救回公主，谁就能娶她，还能分到半壁江山。很多人试过，没有一个人办得到。
        - id: ch01-b03
          speaker: narrator
          text: 年轻人在宫里待了一年左右，想念起父母，便回家探望。等他赶到家，父母已经去世，哥哥们也分光了两位老人留下的财物。他什么都没有得到。
        - id: ch01-b04
          speaker: lad
          text: 父母留下的东西，难道一点儿也没有我的份吗？
        - id: ch01-b05
          speakers: [brother_1, brother_2, brother_3]
          ensemble: chorus
          text: 你在外面游荡了那么久，谁知道你还活着？山上倒有十二匹母马没分。你愿意拿它们当自己的那份，就全牵走吧。
        - id: ch01-b06
          speaker: narrator
          text: 年轻人觉得这样就很好。他谢过哥哥，上山找到那十二匹母马。每匹母马身边都有一匹小马驹，其中一匹身旁还多了一匹高大的斑灰马驹。它的毛又光又滑，在太阳下闪闪发亮。
        - id: ch01-b07
          speaker: lad
          text: 小家伙，你长得可真漂亮。
        - id: ch01-b08
          speaker: dapplegrim
          text: 我当然漂亮。你把另外十二匹马驹都杀掉，让我再喝一年十二匹母马的奶。等到明年，你就知道我能长得多高大、多精神了。
        - id: ch01-b09
          speaker: narrator
          text: 年轻人真的照办，把十二匹马驹杀掉，随后独自回了家。整整一年以后，他才重新登上那座山。斑灰已经肥壮了许多，光亮的皮毛映着太阳，好像在自己发光。它的个头也大得惊人，年轻人抓住马鬃，费了好大力气才骑到背上。再看四周，十二匹母马身边，又各自多了一匹新生的马驹。
        - id: ch01-b10
          speaker: lad
          text: 让你喝十二匹母马的奶，果然没有白费。你已经够大，该跟我走了。
        - id: ch01-b11
          speaker: dapplegrim
          text: 还不行。我得再留一年。把这十二匹马驹也杀掉，让我继续喝所有母马的奶。到了明年夏天，再来看看我吧。
        - id: ch01-b12
          speaker: narrator
          text: 年轻人又照办了。再过一年，他回到山上。每匹母马又带着一匹马驹，斑灰却已经高得让他摸不到马鬃顶。那一身皮毛迎着太阳，亮得晃眼。
        - id: ch01-b13
          speaker: lad
          text: 去年你就很神气，今年更了不得。国王的马厩里也没有这样的马。这一次，你非跟我走不可。
        - id: ch01-b14
          speaker: dapplegrim
          text: 再等最后一年。还是杀掉十二匹马驹，把所有母马留给我。明年夏天，你再来接我。
        - id: ch01-b15
          speaker: narrator
          text: 年轻人第三次答应了。他杀掉那些马驹，又回家等了一年。第二年上山时，眼前的斑灰让他看呆了。他从没想过，一匹马能长得这么高、这么壮、四肢这么结实。斑灰不得不屈起四条腿，把整个身子贴在地面上。可它哪怕已经伏平，年轻人还是费了很大力气，才终于爬上它的背。那身皮毛又平整又光滑，像一面明亮的镜子。日光落在上面，立刻反射出耀眼的光。
        - id: ch01-b16
          speaker: narrator
          text: 这一回，斑灰愿意离开了。年轻人骑着它回去，哥哥们又拍手又在胸前画十字。他们从没听说过，更没亲眼见过这样的马。
        - id: ch01-b17
          speaker: lad
          text: 给它打最结实的马掌，再找来最华贵的鞍子和缰绳。山上的十二匹母马，还有它们今年生的十二匹马驹，全都送给你们。
        - id: ch01-b18
          speaker: narrator
          text: 哥哥们很乐意做这笔交换，马上替他张罗起来。他们找来最好的铁匠，给斑灰钉上一副强韧无比的马掌。斑灰从山间跑过，蹄下的石块都会高高飞向天空。他们又找来一副金鞍和一条金缰绳。年轻人骑在马背上赶路时，那副鞍具一路闪着金光，隔着很远也看得清清楚楚。
        - id: ch01-b19
          speaker: dapplegrim
          text: 咱们去王宫。到了以后，别忘了替我要一间好马厩，还要可靠的好草料。
        - id: ch01-b20
          speaker: narrator
          text: 年轻人答应绝不会忘。他骑着斑灰离开哥哥家，没过多久便赶到王宫。国王正站在台阶上，远远看见这一人一马，盯着他们看了又看。
        - id: ch01-b21
          speaker: king
          text: 我活了这么久，从没见过这样的人和这样的马！
          emotion: surprised
        - id: ch01-b22
          speaker: narrator
          text: 年轻人请求到宫里做事。国王高兴得几乎要在台阶上跳起舞来，宫里人便答应，也许能给他安排一个职位。
        - id: ch01-b23
          speaker: lad
          text: 那么，我的马必须有一间好马厩，还得吃上好的草料。
        - id: ch01-b24
          speaker: narrator
          text: 国王答应让斑灰吃草甸上割来的干草，还有新鲜燕麦，想吃多少就吃多少。为了安顿这匹巨大的骏马，其他骑士只好把自己的马一匹匹牵出去。最后，宽敞的马厩里只剩下斑灰，整间屋子都归它使用。
    - id: ch02
      title: 山怪洞里的公主
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 没过多久，宫里人便开始嫉妒年轻人。他们恨不得害他，只是一直不敢动手。后来，他们终于想出一个办法。他们对国王说，年轻人曾经夸口，只要自己愿意，随时都能从山怪手里救出公主。
        - id: ch02-b02
          speaker: narrator
          text: 国王把年轻人召来，把自己听见的那番话当面说给他听，还命令他兑现这句所谓的豪言。要是救回公主，国王就忠实地遵守诺言，把女儿和半壁江山给他。可要是救不回来，年轻人便得为失败送命。年轻人一遍又一遍解释，自己从没夸过这样的海口。可国王连一句也不肯听。到最后，他实在没有退路，只能答应去试一试。
        - id: ch02-b03
          speaker: narrator
          text: 年轻人满心忧愁地走进马厩。斑灰一看见他，便问出了什么事。他把经过全部讲了一遍，说自己根本找不到出路。
        - id: ch02-b04
          speaker: lad
          text: 我怎么可能从山怪手里救出公主呢？这件事根本办不到。
          emotion: sad
        - id: ch02-b05
          speaker: dapplegrim
          text: 也不一定。我会帮你闯过这一关。先替我钉一副牢靠的马掌。去要十磅铁、十二磅钢，再找两个铁匠，一个抡锤，一个扶稳。
        - id: ch02-b06
          speaker: narrator
          text: 国王答应了这个请求。铁、钢和两名铁匠都准备妥当，斑灰很快钉好一副结实的马掌。年轻人骑着它冲出宫院，身后扬起一片尘土。
        - id: ch02-b07
          speaker: narrator
          text: 他们来到关押公主的山下，才看清最大的难处。山怪把公主藏在高处的洞穴里，洞口下面是一道陡直的石壁。那座山好像被竖着放在地面上，石壁像房子的墙一样笔直，又像整片玻璃一样光滑，根本没有落脚的地方。第一次往上冲，斑灰只爬了一小段，两条前腿就滑了。一人一马轰然跌回山脚，响声像雷一样滚过整座山。
        - id: ch02-b08
          speaker: narrator
          text: 第二次，斑灰冲得更高，可一条前腿又打了滑。一人一马再次坠下，那声巨响，就像山坡整个塌了下来。
        - id: ch02-b09
          speaker: dapplegrim
          text: 这一次，该让他们看看咱们真正的本事了。
        - id: ch02-b10
          speaker: narrator
          text: 斑灰第三次冲向石壁。新钉的马掌一次次撞上岩石，四周的碎石一直飞向高空。这一次，它的蹄子牢牢抓住石面，一口气冲到了山顶。年轻人半点也没有停，骑着斑灰直冲进洞。他从山怪身边掠过，一把抱起公主，把她横放在鞍桥前面，随即转身冲出洞穴，飞奔下山。那一切快得惊人。山怪连从地上站起来都来不及，公主已经离开了山洞。
        - id: ch02-b11
          speaker: narrator
          text: 回到王宫，国王看见女儿平安归来，当然欢喜得不得了。可宫里那些人也不知说了些什么，竟又让国王恼起年轻人来。年轻人把公主带进大厅，向国王行礼。
        - id: ch02-b12
          speaker: king
          text: 你救回了我的女儿，我自然会赏你。
          emotion: angry
        - id: ch02-b13
          speaker: lad
          text: 她既是你的女儿，也该成为我的妻子。你答应过的事，总该算数吧？
        - id: ch02-b14
          speaker: king
          text: 既然答应了，我当然会把她嫁给你。不过，你得先让阳光照进我的王宫大厅。
    - id: ch03
      title: 阳光照进大厅
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 大厅窗外紧挨着一道高高的石岭。岭上的阴影遮住所有窗子，一缕阳光也透不进来。
        - id: ch03-b02
          speaker: lad
          text: 这件事不在我们的约定里。可我看得出来，争辩也没用。为了娶到公主，我只好再试一次。
        - id: ch03-b03
          speaker: narrator
          text: 年轻人回到马厩，把新的要求告诉斑灰。斑灰觉得这件事不难，只需要再钉一副新马掌。还是十磅铁、十二磅钢，还是两个铁匠，一个抡锤，一个扶稳。
        - id: ch03-b04
          speaker: narrator
          text: 年轻人把需要的东西一样样讨来。国王碍于脸面，实在没法拒绝。两个铁匠动手忙碌，给斑灰钉好一副威力惊人的新马掌。年轻人跃上马背，他们再次离开宫院。斑灰来到石岭前，纵身一跳，整道山岭便往地下沉了十五厄尔。它向前奔跑，一下接一下沿着山岭跳过去。等他们走到尽头，高耸的岩石已经完全沉没，国王连一点儿石头都看不见了。
        - id: ch03-b05
          speaker: narrator
          text: 阳光终于照进了大厅。年轻人回去问国王，这回公主是不是该嫁给自己了。可宫里人又来撺掇，国王的主意再次变了。
        - id: ch03-b06
          speaker: king
          text: 我当然会把她嫁给你，从没想过反悔。不过，你还得替新娘找一匹去教堂时骑的马，必须和新郎的坐骑一样华贵。
        - id: ch03-b07
          speaker: narrator
          text: 年轻人提醒国王，他先前根本没提过这项条件，自己明明已经赢得公主。国王却坚持不肯让步，还说如果他找不到这样的马，就要取他的性命。
        - id: ch03-b08
          speaker: narrator
          text: 年轻人愁眉苦脸地来到马厩，把这项难办的新任务，还有失败后的下场，都告诉了斑灰。
        - id: ch03-b09
          speaker: lad
          text: 这一次可太难了。整个世界也找不出另一匹能和你相比的马。
          emotion: sad
        - id: ch03-b10
          speaker: dapplegrim
          text: 我倒有一个对手，不过它住在地狱里，找起来确实不容易。咱们还是去试试。先给我重钉马掌，用十磅铁和十二磅钢。要两个铁匠，一个抡锤，一个扶稳，还要把马掌的尖头和边角全磨利。再带上十二袋黑麦、十二袋大麦、十二头宰好的牛。别丢下牛皮，每张皮上都要钉一千二百枚尖钉。最后，再准备一大桶焦油。
        - id: ch03-b11
          speaker: narrator
          text: 年轻人向国王讨要斑灰列出的所有东西。国王还是不好意思拒绝，只得把东西全部给他。
    - id: ch04
      title: 地狱来的对手
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 年轻人带齐这批古怪的行装，骑着斑灰离开王宫。十二袋黑麦、十二袋大麦、十二头牛、钉满尖钉的牛皮，还有那一大桶焦油，全都跟着他们上了路。他们翻过一座又一座山岭，穿过一片又一片荒原。走了很远很远以后，斑灰忽然开口。
        - id: ch04-b02
          speaker: dapplegrim
          text: 你听见什么了吗？
        - id: ch04-b03
          speaker: lad
          text: 天上有很可怕的嘶嘶声，还有一大片扑簌声。我听着有点害怕。
          emotion: fearful
        - id: ch04-b04
          speaker: dapplegrim
          text: 那是林中的野鸟。它们是来拦咱们的。把粮袋割开几个洞，让粮食漏出去。鸟儿只顾着吃，就会忘记咱们。
        - id: ch04-b05
          speaker: narrator
          text: 年轻人拔刀割开粮袋，黑麦和大麦立刻从袋口往外流，一路撒得到处都是。林中野鸟从四面八方飞来，密密麻麻地围住他们，翅膀遮得日光都暗了。可鸟儿一看见满地粮食，就把拦路的任务抛在脑后。它们纷纷落到地面，有的低头啄食，有的用爪子乱刨，吃着吃着还彼此争抢起来。斑灰和年轻人从它们身边经过，鸟儿连看也不看，自然没有伤到他们。
        - id: ch04-b06
          speaker: narrator
          text: 他们继续翻山越谷，穿过沙丘和荒野。后来，斑灰又竖起双耳，问年轻人听见了什么。
        - id: ch04-b07
          speaker: lad
          text: 树林四周全是咆哮和嚎叫，声音太吓人了，我心里直发慌。
          emotion: fearful
        - id: ch04-b08
          speaker: dapplegrim
          text: 那是森林里的猛兽，也是来堵咱们的。把十二头牛扔给它们。有了牛肉可抢，它们就顾不上咱们了。
        - id: ch04-b09
          speaker: narrator
          text: 年轻人把十二头牛的尸体一头接一头扔在路上。熊、狼、狮子，还有林中各种凶猛野兽，全都咆哮着追了出来。可它们一看见牛肉，便停下脚步，扑上去争抢。野兽互相撕咬，谁也不肯退让，直打得鲜血成河。至于斑灰和年轻人，它们早就忘得干干净净，再也没有追上来。
        - id: ch04-b10
          speaker: narrator
          text: 斑灰跑得飞快，脚下的草根本来不及生长。他们一路越过一片又一片陌生景色。斑灰忽然发出一声长嘶。
        - id: ch04-b11
          speaker: dapplegrim
          text: 你听见了吗？
        - id: ch04-b12
          speaker: lad
          text: 很远很远的地方，好像有匹小马驹在大声嘶叫。
        - id: ch04-b13
          speaker: dapplegrim
          text: 隔着这么远，声音还这样响，那可不是小马，一定已经长大了。
        - id: ch04-b14
          speaker: narrator
          text: 又赶了一段路，越过一两处不同的景色，斑灰第二次长嘶起来。
        - id: ch04-b15
          speaker: dapplegrim
          text: 现在仔细听。你又听见什么了？
        - id: ch04-b16
          speaker: lad
          text: 这一回，听起来像是一匹成年马在叫。
        - id: ch04-b17
          speaker: dapplegrim
          text: 没错。很快你还会听见一次，到时候就知道它的嗓门有多厉害。
        - id: ch04-b18
          speaker: narrator
          text: 他们继续向前。斑灰第三次长嘶，还没来得及问，荒原另一边的山坡就传来一声嘶鸣。那声音震动山野，年轻人以为山岭和岩石都要裂开了。
        - id: ch04-b19
          speaker: dapplegrim
          text: 它来了！快把钉满尖钉的牛皮披到我身上，把焦油桶放在平地，再爬上那棵高大的云杉。它的鼻孔会喷火，焦油桶马上就会烧起来。你看清火焰。火往上升，就是我占上风。火往下落，就是我输了。要是我快赢了，就取下我的缰绳，套到它头上。这样它就会驯服。
        - id: ch04-b20
          speaker: narrator
          text: 年轻人赶紧把十二张钉满尖钉的牛皮一层层披在斑灰身上，又把焦油桶留在平地，自己爬到云杉高处。他刚刚坐稳，那匹陌生的马便从荒原上飞奔而来。它的两只鼻孔向外喷着烈火，火舌一碰焦油桶，整桶焦油立刻熊熊燃烧。两匹马迎面撞在一起，咬着、踢着，前蹄后蹄全用上了。它们每一次扑打，脚下的石块都飞向天空。尘土和乱石来回翻滚，年轻人一会儿能看见它们，一会儿又什么也看不见。
        - id: ch04-b21
          speaker: narrator
          text: 两匹马打了很久，焦油桶上的火焰终于开始往上升。陌生的马每咬一口，每踢一蹄，碰到的都是牛皮里密密麻麻的尖钉。它伤不到斑灰，自己却越来越难支撑，最后不得不低头认输。年轻人一看见斑灰占了上风，马上从树上爬下来。他取下斑灰的缰绳，迅速套到陌生马的头上。方才还鼻喷烈火、凶猛无比的马，一下子变得温顺。哪怕只用捆包裹的细线，也能把它牵走。
        - id: ch04-b22
          speaker: narrator
          text: 更奇妙的是，这匹马也是斑灰色，和斑灰长得一模一样，谁也分不清它们。年轻人骑上新驯服的马，老斑灰不戴缰绳，跟在旁边跑。他们回到王宫时，国王正站在院子里。
        - id: ch04-b23
          speaker: lad
          text: 请你分一分，哪匹是我刚抓来驯服的，哪匹是我原来的马。要是你分不出来，你的女儿这回该堂堂正正地嫁给我了吧？
        - id: ch04-b24
          speaker: narrator
          text: 国王绕着两匹马，上上下下、前前后后地看。无论看哪一根毛，两匹马都完全相同。他只好承认，自己分不出来。
        - id: ch04-b25
          speaker: king
          text: 你替我的女儿找到了这样华贵的婚礼坐骑，我真心愿意把她嫁给你。不过还得再比试一次，看看你们是不是命中注定。她先藏两回，你再藏两回。你能找到她，她却找不到你，那就证明你注定该娶她。
        - id: ch04-b26
          speaker: lad
          text: 这还是不在原来的约定里。可既然非试不可，那就试吧。
    - id: ch05
      title: 最后的捉迷藏
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 公主先把自己变成一只鸭子，在王宫旁边的池塘里游来游去。年轻人跑进马厩，请斑灰告诉他公主藏在哪里。
        - id: ch05-b02
          speaker: dapplegrim
          text: 拿上你的枪，到池塘边去。瞄准水面上那只鸭子，她自然会出来。
        - id: ch05-b03
          speaker: narrator
          text: 年轻人抄起枪赶到池边，举枪瞄准那只鸭子。
        - id: ch05-b04
          speaker: lad
          text: 正好，我来朝这只鸭子开一枪。
        - id: ch05-b05
          speaker: princess
          text: 别开枪，亲爱的朋友！是我！
          emotion: fearful
        - id: ch05-b06
          speaker: narrator
          text: 年轻人第一次找到了公主。第二回，她变成一只面包，和另外四只面包一起摆在桌上。五只面包一模一样，谁也看不出哪只才是她。年轻人又去请教斑灰。
        - id: ch05-b07
          speaker: dapplegrim
          text: 磨快一把面包刀，到国王的厨房去。碗柜上放着四只面包，你装作要切开左边数第三只，很快就能找到她。
        - id: ch05-b08
          speaker: narrator
          text: 年轻人立刻来到厨房，找来最大的一把面包刀，磨得锋利。他抓住左边数第三只面包，把刀放上去，好像要把它切成两半。
        - id: ch05-b09
          speaker: lad
          text: 我来从这只面包上切一片。
        - id: ch05-b10
          speaker: princess
          text: 别切，亲爱的朋友！是我！
          emotion: fearful
        - id: ch05-b11
          speaker: narrator
          text: 这样，年轻人两回都找到了她。接下来该他藏了。第一回，他按照斑灰的办法，把自己变成一只蜱虫，躲进斑灰的左鼻孔。公主上上下下找遍各处，最后来到马厩。她想走进斑灰的马栏，斑灰却又咬又踢，吓得她不敢靠近。她只好认输。
        - id: ch05-b12
          speaker: princess
          text: 我找不到你。你自己出来吧。
        - id: ch05-b13
          speaker: narrator
          text: 话音刚落，年轻人眨眼便站在马厩的地面上。第二回，他又听从斑灰的安排，把自己变成一块泥土，塞进斑灰左前蹄的马蹄和马掌之间。
        - id: ch05-b14
          speaker: narrator
          text: 公主从楼上找到楼下，又从屋里找到屋外，能看的角落全都看过，最后又走进马厩。这一次，斑灰没有咬她，也没有踢她，安安静静地让她来到身旁。公主绕着它仔细查看，从高处一直看到低处，连马栏里的缝隙也不肯放过。可她偏偏没法查看马蹄底下。斑灰四条腿站得像岩石一样稳，她既不能推开它，也抬不起它的蹄子。年轻人就藏在那么近的地方，公主还是找不到。
        - id: ch05-b15
          speaker: princess
          text: 我肯定找不到你了。你还是自己现身吧。
        - id: ch05-b16
          speaker: narrator
          text: 公主刚说完，年轻人便出现在她身旁，和她一起站在马厩里。
        - id: ch05-b17
          speaker: lad
          text: 现在，你的确该嫁给我了。你和父王都看见了，我命中注定要娶你。
        - id: ch05-b18
          speaker: king
          text: 看来命中确实如此。那就照命运的安排办吧。
        - id: ch05-b19
          speaker: narrator
          text: 大家终于认认真真筹办起婚礼，这一回是动真格的，一点儿时间也没有耽搁。到了去教堂的那一天，年轻人骑上斑灰，公主骑上那匹与斑灰一模一样的马。两匹神驹并肩飞驰，速度这样快，你尽可以想见，这对新人没用多久便赶到了教堂。
