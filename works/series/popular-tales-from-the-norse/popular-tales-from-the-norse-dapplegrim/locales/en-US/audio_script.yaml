  chapters:
    - id: ch01
      title: The Making of Dapplegrim
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Once upon a time, a rich couple had twelve sons. When the youngest was grown, he said he would not stay at home any longer. He meant to go out into the world and seek his fortune. His father and mother told him he had a good life where he was and would be wiser to stay. But he could not rest. He had to go, and at last they gave him leave. After walking a long way, he reached a king's palace. There he asked for a place in the royal household, and he got one.
        - id: ch01-b02
          speaker: narrator
          text: That king had only one child, a daughter, and a Troll had carried her away into a hill. The king and all his people mourned for her. He promised the Princess and half the kingdom to anyone who could free her. Many tried, but no one could do it.
        - id: ch01-b03
          speaker: narrator
          text: The lad stayed at the palace for a year or so. Then he longed to see his father and mother again, and he went home. But while he had been away, both of them had died. His brothers had already divided everything the old couple owned. By the time the youngest returned, there was nothing left for him.
        - id: ch01-b04
          speaker: lad
          text: Am I to have no share at all of our parents' things?
        - id: ch01-b05
          speakers: [brother_1, brother_2, brother_3]
          ensemble: chorus
          text: You wandered away for so long that no one knew whether you were alive. Still, twelve mares on the hill haven't been divided. You may take those as your share.
        - id: ch01-b06
          speaker: narrator
          text: The lad was content with that. He thanked them and climbed the hill. Each mare had a foal beside her, and one mare also had a large dapple-gray foal. Its coat was so sleek that it shone in the sun.
        - id: ch01-b07
          speaker: lad
          text: You're a fine little fellow.
        - id: ch01-b08
          speaker: dapplegrim
          text: I am. But kill the other twelve foals and let me drink from all the mares for another year. Then you'll see how big and sleek I become.
        - id: ch01-b09
          speaker: narrator
          text: The lad agreed. He killed the twelve foals and went home. When he climbed the hill again the next year, he found the dapple foal fat and sleek, with sunlight shining from his coat. The horse had grown so large that the lad had a hard time getting onto his back. And each of the twelve mares had another foal beside her.
        - id: ch01-b10
          speaker: lad
          text: Letting you drink from all twelve mares has paid off. You're big enough to come with me now.
        - id: ch01-b11
          speaker: dapplegrim
          text: No. I must stay one more year. Kill these twelve foals too, and let me drink from every mare until summer. Then you'll see what I become.
        - id: ch01-b12
          speaker: narrator
          text: The lad did as the colt asked. A year later, every mare had another foal, and the dapple colt had grown so tall that the lad could not reach his crest to feel how fat he was. His coat gleamed in the sunshine.
        - id: ch01-b13
          speaker: lad
          text: You were grand last year, but now there's no horse like you, not even in the king's stable. This time you must come with me.
        - id: ch01-b14
          speaker: dapplegrim
          text: I must stay for one last year. Kill the twelve foals again and let me have the mares. Come back when summer arrives.
        - id: ch01-b15
          speaker: narrator
          text: Once more, the lad killed the foals and went home. When he climbed the hill the following year, the sight of Dapple astonished him. He had never imagined a horse could grow so tall, so heavy, and so strong. Dapple had to lie down on all fours before the lad could even try to mount him. Getting onto his back was hard work, though the great horse lay flat. His coat was so smooth and sleek that the sunbeams flashed from it like light from a mirror.
        - id: ch01-b16
          speaker: narrator
          text: This time Dapple went willingly. When the lad rode home, his brothers clapped their hands and crossed themselves. They had never seen or heard of such a horse.
        - id: ch01-b17
          speaker: lad
          text: Give my horse the strongest shoes you can find, and bring me the finest saddle and bridle. In return, you may keep the twelve mares on the hill and all twelve of this year's foals.
        - id: ch01-b18
          speaker: narrator
          text: His brothers gladly agreed to the trade. They found the best smithing they could and fitted the horse with wonderfully strong shoes. Whenever he moved across the hills, stones flew high into the air behind him. They also brought a golden saddle and a golden bridle. Both gleamed and glittered so brightly that they could be seen from far away.
        - id: ch01-b19
          speaker: dapplegrim
          text: Now we'll ride to the king's palace. Remember to ask for a good stable and good feed for me.
        - id: ch01-b20
          speaker: narrator
          text: The lad promised he would remember and would not forget. Then he rode away from his brothers' house. With such a horse beneath him, the journey did not take long. When he reached the palace, the king was standing on the steps. He stared and stared at the man and horse coming toward him.
        - id: ch01-b21
          speaker: king
          text: Never in my life have I seen a man and horse like these!
          emotion: surprised
        - id: ch01-b22
          speaker: narrator
          text: The lad asked for a place in the household, and the king was so pleased he nearly danced there on the steps. They told him there might be a place for him.
        - id: ch01-b23
          speaker: lad
          text: Then my horse must have a proper stable and feed I can trust.
        - id: ch01-b24
          speaker: narrator
          text: The king promised all the meadow hay and oats Dapplegrim could eat. Every knight had to lead his horse outside so Dapplegrim could have the whole stable to himself.
    - id: ch02
      title: The Princess in the Hill
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: Before long, everyone else in the king's household grew jealous of the lad. There was no end to the harm they would have done him if only they had dared. At last they found a way to use the king against him. They told the king that the lad had boasted he was strong enough to free the Princess from the Troll whenever he chose.
        - id: ch02-b02
          speaker: narrator
          text: The king summoned the lad and repeated what he had heard. Now, the king said, the lad must do what he had claimed. If he rescued the Princess, the king would faithfully keep his promise and give him the Princess and half the kingdom. If he failed, he would be killed. Again and again, the lad said he had never made such a boast. It did no good. The king would not even listen, and in the end the lad had to say he would try.
        - id: ch02-b03
          speaker: narrator
          text: He went to the stable with a heavy heart. Dapplegrim saw his misery and asked what was wrong. The lad told him everything and said he saw no way through it.
        - id: ch02-b04
          speaker: lad
          text: Freeing the Princess is impossible.
          emotion: sad
        - id: ch02-b05
          speaker: dapplegrim
          text: Perhaps not. I'll see you through, but first I need strong shoes. Ask for ten pounds of iron and twelve pounds of steel. Have one smith hammer while another holds.
        - id: ch02-b06
          speaker: narrator
          text: The king granted the request. The two smiths shod Dapplegrim well with iron and steel, and the lad rode out of the courtyard in a cloud of dust.
        - id: ch02-b07
          speaker: narrator
          text: At last they came to the hill where the Troll had hidden the Princess. The difficulty was reaching the cave. Its entrance lay above a sheer wall of rock that stood straight up like the wall of a house and was as smooth as a sheet of glass. On the first attempt, Dapplegrim climbed only a little way before both front legs slipped. Horse and rider crashed back down, and the sound rolled over the hill like thunder.
        - id: ch02-b08
          speaker: narrator
          text: On the second attempt, they climbed higher. Then one front leg slipped, and they came down with a crash like a landslide.
        - id: ch02-b09
          speaker: dapplegrim
          text: This time, we must show what we're made of.
        - id: ch02-b10
          speaker: narrator
          text: Dapplegrim charged the wall a third time. His new shoes struck hard, and stones flew high toward the sky around them. This time they reached the top. The lad did not slow down. He galloped straight into the Troll's cave, caught up the Princess, and swung her across the front of his saddle. Then he raced out and down the hill before the Troll had time even to get onto his feet. That was how the Princess was freed.
        - id: ch02-b11
          speaker: narrator
          text: When they returned to the palace, the king was both happy and glad to have his daughter back. Anyone could believe that. Yet somehow the people at court worked on him until he was angry with the lad after all. The lad brought the Princess into the hall and bowed before the king. Then the king spoke to him.
        - id: ch02-b12
          speaker: king
          text: You have my thanks for freeing my daughter.
          emotion: angry
        - id: ch02-b13
          speaker: lad
          text: Then she should be mine as well as yours. I trust that you keep your word.
        - id: ch02-b14
          speaker: king
          text: You shall have her, since I promised. But first, you must make the sun shine into my palace hall.
    - id: ch03
      title: Sunlight in the Hall
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: A steep ridge stood close outside the windows. Its shadow covered the hall, and not one ray of sunlight could enter.
        - id: ch03-b02
          speaker: lad
          text: That was never part of our bargain. But I see that arguing won't help. I'll try, because I mean to have the Princess.
        - id: ch03-b03
          speaker: narrator
          text: The lad went down to the stable and told Dapplegrim exactly what the king demanded. Dapplegrim thought the task could be done easily. First, though, he would have to be shod again. The new shoes would need ten pounds of iron and twelve pounds of steel, with two smiths at the work, one to hammer and the other to hold.
        - id: ch03-b04
          speaker: narrator
          text: The lad asked for everything Dapplegrim needed, and the king was too ashamed to refuse. The smiths made the horse a mighty new set of shoes. Then the lad jumped onto his back, and away they went. Each time Dapplegrim leaped, the ridge sank fifteen ells deeper into the earth. He leaped again and again along its whole length, until there was not a piece of the ridge left for the king to see.
        - id: ch03-b05
          speaker: narrator
          text: When the lad returned to the palace, sunlight was shining freely into the hall. He asked the king whether the Princess belonged to him now, since no one could deny that he had completed the task. But once again, the others at court stirred up the king and made him resist.
        - id: ch03-b06
          speaker: king
          text: Of course you shall have her. I never meant otherwise. But first, you must find a horse for the bride to ride to church, one every bit as grand as the bridegroom's.
        - id: ch03-b07
          speaker: narrator
          text: The lad protested that the king had never said one word about another horse. He believed he had fairly earned the Princess already. But the king held to his demand. More than that, he declared that if the lad could not find such a horse, the lad would lose his life.
        - id: ch03-b08
          speaker: narrator
          text: Down in the stable, the lad sadly told Dapplegrim about the new task and its deadly price.
        - id: ch03-b09
          speaker: lad
          text: This won't be easy. There isn't another horse like you anywhere in the world.
          emotion: sad
        - id: ch03-b10
          speaker: dapplegrim
          text: I do have a match, though finding him won't be easy. He lives in Hell. Still, we'll try. Ask the king for new shoes made with ten pounds of iron and twelve pounds of steel. Have one smith hammer and one hold, and make every point and edge sharp. We also need twelve sacks of rye, twelve sacks of barley, twelve slaughtered oxen, and all twelve hides. Each hide must have twelve hundred spikes driven through it. Last of all, bring a large barrel of tar.
        - id: ch03-b11
          speaker: narrator
          text: The lad asked for everything Dapplegrim had named. Again the king was too ashamed to refuse, so the lad received it all.
    - id: ch04
      title: Dapplegrim's Match
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: The lad climbed onto Dapplegrim's back, and they rode away from the palace with all their strange supplies. They traveled far and farther over hills and open heath. Only after they had covered a great distance did Dapplegrim speak.
        - id: ch04-b02
          speaker: dapplegrim
          text: Do you hear anything?
        - id: ch04-b03
          speaker: lad
          text: There's a terrible hissing and rustling above us. I'm beginning to feel afraid.
          emotion: fearful
        - id: ch04-b04
          speaker: dapplegrim
          text: Those are all the wild birds of the wood. They've been sent to stop us. Cut holes in the grain sacks. The grain will keep them so busy that they'll forget us.
        - id: ch04-b05
          speaker: narrator
          text: The lad cut holes in the sacks, and rye and barley streamed out on every side as they rode. Every wild bird in the wood came flying around them. The flock grew so thick that it shut out the sunlight. But as soon as the birds saw the grain, they forgot why they had come. They dropped to the ground to peck and scratch, and soon they were fighting among themselves. They forgot Dapplegrim and the lad completely and did them no harm.
        - id: ch04-b06
          speaker: narrator
          text: The lad and Dapplegrim rode on and on, far across mountains and valleys, over sand hills and wide moors. After another long stretch of road, Dapplegrim pricked up his ears and listened to the woods around them.
        - id: ch04-b07
          speaker: dapplegrim
          text: What do you hear now?
        - id: ch04-b08
          speaker: lad
          text: There's an ugly roaring and howling all through the wood. It frightens me.
          emotion: fearful
        - id: ch04-b09
          speaker: dapplegrim
          text: Those are the wild beasts, sent to stop us. Throw out the twelve ox carcasses. That will occupy them, and they'll forget all about us.
        - id: ch04-b10
          speaker: narrator
          text: The lad threw out all twelve carcasses. Then the wild beasts of the wood came rushing after them. There were bears, wolves, lions, and savage animals of every kind. But when they found the carcasses, they stopped chasing the travelers and fought one another for the meat. They fought until blood ran in streams. Dapplegrim and the lad passed entirely from their minds.
        - id: ch04-b11
          speaker: narrator
          text: Dapplegrim raced on, carrying the lad through one landscape after another. At last he gave a great neigh.
        - id: ch04-b12
          speaker: dapplegrim
          text: Did you hear anything?
        - id: ch04-b13
          speaker: lad
          text: I heard what sounded like a colt neighing very far away.
        - id: ch04-b14
          speaker: dapplegrim
          text: Then that colt is fully grown. His neigh carries a long way.
        - id: ch04-b15
          speaker: narrator
          text: They traveled farther, until the land around them had changed once or twice. Dapplegrim neighed again.
        - id: ch04-b16
          speaker: dapplegrim
          text: Listen now. What do you hear?
        - id: ch04-b17
          speaker: lad
          text: This time it sounds like a full-grown horse.
        - id: ch04-b18
          speaker: dapplegrim
          text: Yes. You'll hear him once more soon, and then you'll know what a voice he has.
        - id: ch04-b19
          speaker: narrator
          text: Once more they traveled on and on, passing through yet another change of country. Then Dapplegrim stopped and neighed for the third time. Before he could ask the lad what he heard, an answer came rolling across the heather-covered hillside. It was such a tremendous neigh that the lad thought the hills and rocks themselves would split apart.
        - id: ch04-b20
          speaker: dapplegrim
          text: He's here! Quickly, cover me with the spiked ox hides, put the tar barrel on the open ground, and climb that tall spruce tree. Fire will burst from his nostrils and set the tar alight. Watch the flame. If it rises, I'm winning. If it falls, I'm losing. Once you see me win, take off my bridle and throw it over his head. Then he'll be tame.
        - id: ch04-b21
          speaker: narrator
          text: The lad worked quickly. He spread all twelve ox hides over Dapplegrim, with their thousands of spikes pointing outward. He rolled the tar barrel onto the open ground and climbed well up into the great spruce. He had barely settled there when a horse came galloping over the plain. Fire flashed from both its nostrils, and the flames caught the tar barrel at once.
        - id: ch04-b22
          speaker: narrator
          text: Dapplegrim and the strange horse fell upon each other, and stones flew high toward the sky around them. They bit, struck with their front hooves, and kicked with their hind legs. Sometimes the lad could see the fighters through the smoke and flying dust, and sometimes he could not. At last the flame above the tar began to rise. Wherever the strange horse tried to bite or kick Dapplegrim, he met the spikes in the hides. In the end he could bear no more and had to yield.
        - id: ch04-b23
          speaker: narrator
          text: As soon as the lad saw that Dapplegrim was winning, he hurried down from the spruce. He took the bridle from Dapplegrim and threw it over the strange horse's head. The fierce creature changed at once. Now he was so tame that someone could have held him with a piece of packing thread.
        - id: ch04-b24
          speaker: narrator
          text: And what do you think? The new horse was dappled too. He looked so much like Dapplegrim that no one could tell them apart. The lad mounted the horse he had just tamed and rode back to the palace, while Dapplegrim ran free beside him. The king was waiting in the yard.
        - id: ch04-b25
          speaker: lad
          text: Can you tell which horse I caught and tamed, and which one belonged to me before? If you can't, then your daughter is fairly mine.
        - id: ch04-b26
          speaker: narrator
          text: The king walked around the pair and examined them closely. He looked high and low, then studied them from the front and from behind. But there was not one hair on the first horse that did not seem to be in the very same place on the second.
        - id: ch04-b27
          speaker: king
          text: No, I cannot tell them apart. You have found my daughter a splendid wedding horse, so she shall be yours gladly. Still, there must be one final test to see if you're fated to have her. She will hide twice, and then you will hide twice. If you find her both times and she cannot find you, then you shall marry her.
        - id: ch04-b28
          speaker: lad
          text: That wasn't in our bargain either. But if it must be done, we'll try.
    - id: ch05
      title: The Hiding Game
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: The Princess went away to hide first. For her first hiding place, she changed herself into a duck and floated on a pond close to the palace. Nothing about the bird revealed who she was. But the lad went straight down to the stable and asked Dapplegrim what the Princess had done with herself.
        - id: ch05-b02
          speaker: dapplegrim
          text: Take your gun to the edge of the pond. Aim at the duck swimming there, and she'll soon reveal herself.
        - id: ch05-b03
          speaker: narrator
          text: The lad took his gun to the pond and aimed at the duck.
        - id: ch05-b04
          speaker: lad
          text: I think I'll take a shot at this duck.
        - id: ch05-b05
          speaker: princess
          text: No, dear friend, don't shoot! It's me!
          emotion: fearful
        - id: ch05-b06
          speaker: narrator
          text: So the lad found the Princess the first time. For her second hiding place, she changed herself into a loaf of bread. She lay on a table among four other loaves, and she looked so exactly like the rest that no one could have pointed out which loaf was different.
        - id: ch05-b07
          speaker: narrator
          text: The lad returned to Dapplegrim and said the Princess had hidden again and he had no idea where she was.
        - id: ch05-b08
          speaker: dapplegrim
          text: Sharpen a good bread knife. In the king's kitchen, you'll find four loaves on the dresser. Pretend you're going to cut the third loaf from the left in half. You'll find her soon enough.
        - id: ch05-b09
          speaker: narrator
          text: The lad hurried down to the king's kitchen. He found the largest bread knife he could lay his hands on and began sharpening it. Then he went to the dresser, counted to the third loaf from the left, took hold of it, and set the knife against it as though he meant to cut it cleanly in two.
        - id: ch05-b10
          speaker: lad
          text: I'll cut myself a slice from this loaf.
        - id: ch05-b11
          speaker: princess
          text: Please don't cut! It's me!
          emotion: fearful
        - id: ch05-b12
          speaker: narrator
          text: So he found her twice. Then it was his turn to hide. He and Dapplegrim had planned so well that finding him would not be easy. First, the lad changed into a tick and hid inside Dapplegrim's left nostril.
        - id: ch05-b13
          speaker: narrator
          text: The Princess searched for him everywhere, looking high and low through the palace and its grounds. At last she came to the stable and tried to enter Dapplegrim's stall. But the horse snapped with his teeth and kicked out so fiercely that she dared not go near him. She searched as long as she could, but she did not find the lad.
        - id: ch05-b14
          speaker: princess
          text: I can't find you, so you'll have to show yourself.
        - id: ch05-b15
          speaker: narrator
          text: In an instant, the lad stood on the stable floor. For his second hiding place, Dapplegrim told him what to do. The lad changed into a clod of earth and wedged himself between Dapplegrim's left front hoof and its shoe.
        - id: ch05-b16
          speaker: narrator
          text: Again the Princess searched up and down, indoors and out, and everywhere she could think to look. At last she came into the stable and approached Dapplegrim's stall. This time he allowed her to come right up to him. She searched him high and low, but she could not look beneath his hoof. Dapplegrim stood on all four feet as firmly as a rock, and the Princess could not find the lad.
        - id: ch05-b17
          speaker: princess
          text: You'll have to come out. I'm certain I can't find you.
        - id: ch05-b18
          speaker: narrator
          text: As she spoke, the lad appeared beside her on the stable floor. He addressed both the Princess and her father.
        - id: ch05-b19
          speaker: lad
          text: Now you truly are mine. You can see that I'm fated to have you.
        - id: ch05-b20
          speaker: king
          text: Yes, that is your fate, and so it must be.
        - id: ch05-b21
          speaker: narrator
          text: Then they began preparing the wedding in earnest, and no one wasted any time. When everything was ready, the lad mounted Dapplegrim, and the Princess mounted Dapplegrim's match. With horses like those beneath them, you may be sure they did not take long to reach the church.
