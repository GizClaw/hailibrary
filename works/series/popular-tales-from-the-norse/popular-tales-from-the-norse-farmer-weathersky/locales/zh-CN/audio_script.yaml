audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 从容而清醒，带一点克制的诙谐
        timbre: 温厚清晰
        pace: 舒缓有致
        pitch: 中低
    father:
      display_name: 杰克的父亲
      tts:
        delivery: 老实憨厚，遇事容易慌张
        timbre: 粗朴温和
        pace: 中等
        pitch: 中低
    mother:
      display_name: 杰克的母亲
      tts:
        delivery: 坚决爽利，认准的事绝不松口
        timbre: 清晰有力
        pace: 中等偏快
        pitch: 中
    jack:
      display_name: 杰克
      tts:
        delivery: 聪明机敏，危急时仍沉着直接
        timbre: 年轻清亮
        pace: 中等
        pitch: 中高
    farmer_weathersky:
      display_name: 风云农夫
      tts:
        delivery: 神秘强横，发怒时声势骇人
        timbre: 浑厚阴沉
        pace: 从容
        pitch: 低
    hag_1:
      display_name: 大姐巫婆
      tts:
        delivery: 古怪直率，受到礼遇便十分欢喜
        timbre: 苍老沙哑
        pace: 舒缓
        pitch: 中低
    hag_2:
      display_name: 二姐巫婆
      tts:
        delivery: 古怪直率，语气干脆
        timbre: 苍老偏尖
        pace: 舒缓
        pitch: 中
    hag_3:
      display_name: 小妹巫婆
      tts:
        delivery: 古怪而果断，发号施令毫不含糊
        timbre: 苍老坚实
        pace: 舒缓
        pitch: 中低
    eagle:
      display_name: 老鹰
      tts:
        delivery: 可靠警觉，赶路时简短利落
        timbre: 高亢有力
        pace: 中等
        pitch: 中低
    lassie:
      display_name: 姑娘
      tts:
        delivery: 善良率真，见到不平便脱口而出
        timbre: 年轻柔和
        pace: 中等
        pitch: 中高
    princess:
      display_name: 公主
      tts:
        delivery: 聪慧果断，危急时也能稳住心神
        timbre: 明亮柔和
        pace: 中等
        pitch: 中高
    king:
      display_name: 国王
      tts:
        delivery: 威严急躁，发怒时不容争辩
        timbre: 饱满有力
        pace: 中等
        pitch: 中低
  chapters:
    - id: ch01
      title: 师傅中的师傅
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 从前，有对夫妇只生了一个儿子，名叫杰克。母亲觉得孩子已经长大，早该到外面的世界学一门手艺了，便催丈夫带他去找师傅。
        - id: ch01-b02
          speaker: mother
          text: 学什么都由你们，可他拜的师傅必须有真本事，得把他教成师傅中的师傅。
        - id: ch01-b03
          speaker: narrator
          text: 她把吃食和一卷烟草装进袋里，送父子俩上路。他们一位师傅接一位师傅地问过去。人人都说，自己能把杰克教得和自己一样好。可要让徒弟胜过师傅，谁也不敢答应。父亲找不到合适的人，只好领着儿子回家，把听来的话告诉妻子。
        - id: ch01-b04
          speaker: mother
          text: 我说过的话不会改。再出去找，非找到那样的师傅不可。
        - id: ch01-b05
          speaker: narrator
          text: 她这次装了更多吃食，又放进去一卷烟草。父子俩只得再次出发。他们走了一阵，踏上一片冰面。这时，一匹黑马拉着雪橇，飞快地迎面驰来。赶车人勒住马，问他们这是要上哪儿去。父亲叹了口气，把妻子那条难办的要求说了出来。
        - id: ch01-b06
          speaker: farmer_weathersky
          text: 这不是正好吗？我要收的就是这种徒弟。小伙子，上车！
        - id: ch01-b07
          speaker: narrator
          text: 杰克刚爬到后座，只听耳边“嗖”的一声。黑马四蹄腾空，雪橇也离开冰面，载着赶车人和杰克一直冲上天空。
        - id: ch01-b08
          speaker: father
          text: 等一等！你叫什么？住在哪里？
        - id: ch01-b09
          speaker: farmer_weathersky
          text: 东南西北都是我的家，我叫风云农夫。一年零一天以后，你再回到这片冰面上找我。到了那一天，我会告诉你，这孩子当徒弟合不合我的意。
        - id: ch01-b10
          speaker: narrator
          text: 雪橇越飞越远，转眼消失。父亲独自回家，妻子立刻追问儿子的下落。他只好承认，除了看见他们飞上天，自己什么也不知道。儿子去了哪里，他说不出。学徒要当到哪一天，他也没问明白。母亲听完，马上又装好一袋吃食和一卷烟草，把丈夫赶出家门，叫他无论如何也要把儿子找回来。
    - id: ch02
      title: 三姐妹与老鹰
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 父亲走进一片望不到边的大森林。他走了整整一天，身边始终只有树木。天黑以后，远处忽然亮起一大片光。他朝着亮光走了很久，终于看见岩石下面有间小屋。屋外站着一个老巫婆。她的鼻子长得出奇，竟伸进井里，替她把水打上来。
        - id: ch02-b02
          speaker: father
          text: 晚上好，老妈妈。能让我借宿一夜吗？
        - id: ch02-b03
          speaker: hag_1
          text: 几百年没人叫过我老妈妈了。不过，你不能住下。
        - id: ch02-b04
          speaker: narrator
          text: 父亲没有离开。他取出烟草，点起烟斗，请她吸了一口，又送上一撮鼻烟。老巫婆快活极了，当场跳起舞来，终于答应留他过夜。第二天早晨，父亲问起风云农夫。老巫婆虽然没听过这个名字，却掌管世上所有四足走兽。她吹响笛子，把它们全都召到屋前，一个一个地问。可是，没有一只走兽知道风云农夫住在哪里。
        - id: ch02-b05
          speaker: hag_1
          text: 我们一共有三姐妹。我虽然不知道，另外两位也许听说过他。你坐我的马拉雪橇去找下一位吧。她住得很远，走最近的路也有三百英里，不过天黑前能赶到。
        - id: ch02-b06
          speaker: narrator
          text: 父亲坐上雪橇，赶了三百英里，天黑时来到第二所屋子。第二个老巫婆也站在门外，用长鼻子从井里汲水。她听见父亲叫自己老妈妈，虽然有些高兴，却还是不肯留客。父亲照旧点起烟斗，请她吸一口，又把一大撮鼻烟放在她手背上。她乐得又蹦又跳，这才让他住下。第二天，她吹响笛子，把海里所有的鱼召回来逐一询问，结果仍旧没有消息。
        - id: ch02-b07
          speaker: hag_2
          text: 现在只剩我们的小妹了。也许她知道风云农夫的消息。她住在六百英里外，你借我的马和雪橇去赶路，黄昏时就能到她家。
        - id: ch02-b08
          speaker: narrator
          text: 父亲又坐雪橇走了六百英里，黄昏时到了第三所屋子。第三个老巫婆站在炉前，正拿又长又结实的鼻子拨弄火炭。她起初也不留客。父亲让她吸了一口烟，又给了她满满一手背的鼻烟，她顿时高兴得跳起舞来。第二天，她听说父亲要找风云农夫，便用笛声召集天上的飞鸟。鸟儿一只接一只地落下来，最后只少了老鹰。过了好一会儿，老鹰才摇摇晃晃飞回家。
        - id: ch02-b09
          speaker: hag_3
          text: 你既然刚从风云农夫那里回来，就给这个人带路。
        - id: ch02-b10
          speaker: eagle
          text: 先让我吃饱，再歇一夜。那地方太远，我现在连地面都快飞不起来了。
        - id: ch02-b11
          speaker: narrator
          text: 老鹰吃得饱饱的，又休息了一整夜。第二天，老巫婆从它尾巴上拔下一根羽毛，把父亲放进空出来的位置。老鹰驮着他离开，一刻不停地向前飞。它飞了又飞，直到半夜才落在风云农夫家外面。院子四周横七竖八躺着一堆堆尸体，屋里却鼾声四起，所有人都睡得死沉。
        - id: ch02-b12
          speaker: eagle
          text: 外面那些尸体再多，你也别理。走进屋以后，径直去桌边拉开抽屉，取出三粒面包屑。听见谁的鼾声最响，就从那个人头上拔三根头发。放心，这点动静惊不醒他。
        - id: ch02-b13
          speaker: narrator
          text: 父亲摸进屋里，从桌子抽屉拿了三粒面包屑。他循着最响的鼾声走去，从那人头上拔下一根头发。风云农夫低吼一声，却没有醒。第二根也是一样。等第三根拔下来，那声咆哮震得父亲以为屋顶和墙壁都要裂开，可风云农夫还是继续打鼾。父亲溜到院里，在马厩门前被一块灰色巨石绊住。他搬开石头，捡起下面的三片木屑，再敲响厩门。门自己开了。他丢下三粒面包屑，一只野兔跑来吞吃，父亲趁机将它捉住。老鹰让他再拔三根尾羽，把野兔、巨石、木屑和他自己全放进空位。
        - id: ch02-b14
          speaker: narrator
          text: 老鹰驮着这么多东西飞出很远，落在岩石上歇气。它让父亲回头看看。父亲望见一群乌鸦正从远处赶来。老鹰马上重新起飞。过了一阵，它又问身后的情形。那群乌鸦已经紧紧贴在他们后面。
        - id: ch02-b15
          speaker: eagle
          text: 不能再让它们靠近了。快把你从风云农夫头上拔下的三根头发扔下去！
        - id: ch02-b16
          speaker: narrator
          text: 三根头发刚一落下，便化作一大群渡鸦，迎面冲向乌鸦，把它们赶回老家。老鹰继续飞，飞累了又落在一块石头上。父亲起初只看见远处有个模糊的影子。等老鹰再次询问时，风云农夫已经追到他们脚后跟。
        - id: ch02-b17
          speaker: eagle
          text: 他已经追上来了。快丢下从灰色巨石底下拿到的那三片木屑！
        - id: ch02-b18
          speaker: narrator
          text: 三片木屑一碰地面，便长成一片又高又密的森林。风云农夫过不去，只好转身回家拿斧头，再一棵棵砍出通路。趁着这段工夫，老鹰已经飞出很远，最后落在一棵杉树上休息。父亲朝后望去，先是说不准远处有没有东西。老鹰赶紧再飞。没过多久，风云农夫又逼近了。
        - id: ch02-b19
          speaker: eagle
          text: 他又追到后面了。现在，把你在马厩门口搬开的那块灰色巨石扔下去！
        - id: ch02-b20
          speaker: narrator
          text: 巨石落地，立刻化作一座高得吓人的大山。风云农夫只得在山腹凿出通路。凿到一半，他忽然绊倒，摔断了一条腿，只好一瘸一拐回去修补。老鹰这才平安飞到父亲家，连同那只野兔一起落地。父亲抱起野兔，直奔教堂墓地，抓起基督徒坟地上的泥土撒在它身上。眨眼之间，野兔不见了，杰克又好端端站在父亲面前。
    - id: ch03
      title: 三次集市
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 母亲见儿子平安回来，自然欢喜得不得了。可欢喜过后，她仍旧放不下那件事。杰克出去这么久，到底学会了什么？他是不是真的成了师傅中的师傅？她非要儿子拿出证明才肯安心。等集市的日子到了，杰克把自己变成一匹漂亮的枣红马，让父亲牵进城去卖。
        - id: ch03-b02
          speaker: jack
          text: 开价一百块钱就行。来买我的一定是风云农夫。收了钱，千万把笼头留下，不然我就再也逃不掉了。
        - id: ch03-b03
          speaker: narrator
          text: 到了集市，一个马贩子径直走来，盯着枣红马看个不停。他正是风云农夫。价钱谈妥以后，他当场付了一百块钱。可父亲刚把钱装进口袋，马贩子便伸手来要笼头。
        - id: ch03-b04
          speaker: father
          text: 不成，不成！我们谈好的买卖里，可没算上这只笼头。我家还有别的马，明天也要牵进城来，这个笼头不能给你。
        - id: ch03-b05
          speaker: narrator
          text: 父亲说家里还有马，明天进城时仍要用这个笼头。马贩子只好牵着马离开。可他们没走多远，枣红马便恢复成杰克，转身跑掉。等父亲回到家，杰克早已坐在壁炉旁等着他。
        - id: ch03-b06
          speaker: narrator
          text: 第二天，杰克化作一匹棕马，让父亲开价两百块钱。他事先说明，买主不但会照价付钱，还会请父亲喝酒。别的都不怕，只怕酒喝下去，父亲忘了笼头。事情果真一件不差。父亲收了两百块钱，也喝了一杯。买卖双方要分手时，他费了好大劲才想起笼头，赶紧取下来。买主牵马走上大路，杰克很快又变回自己。父亲到家时，他仍旧已经坐在壁炉旁。
        - id: ch03-b07
          speaker: narrator
          text: 第三天，同样的买卖又要做一次。杰克这回变成一匹黑马。他告诉父亲，风云农夫会出三百块钱，还会拿出许多酒肉，把卖马人的肚子塞得满满的。
        - id: ch03-b08
          speaker: jack
          text: 不管你吃多少、喝多少，一定记得拿掉笼头。忘了这件事，我就得一辈子跟着风云农夫。
        - id: ch03-b09
          speaker: father
          text: 不会，不会，你尽管放心。我这回无论吃多少、喝多少，都绝不会忘记那只笼头。
        - id: ch03-b10
          speaker: narrator
          text: 可到了集市，风云农夫付完三百块钱，便一杯接一杯地劝酒。父亲又吃又喝，到最后醉得什么也想不起来，眼睁睁让风云农夫连马带笼头一起牵走。走出一段路，风云农夫自己又想喝一杯白兰地。他在黑马鼻子下面放了一桶烧得通红的铁钉，又故意把一筛燕麦摆到马尾后面，让马闻得到却吃不着。然后，他把缰绳挂上钩子，独自进了客店。
        - id: ch03-b11
          speaker: narrator
          text: 黑马被热气逼得难受极了，只能不断跺蹄、刨地、喷鼻，还一次次直立起来。就在这时，一个姑娘从客店里走出来。她看看马鼻子下的红钉，又看看后面的燕麦，觉得这样折磨牲口实在太残忍。
        - id: ch03-b12
          speaker: lassie
          text: 哎呀，可怜的小家伙，你的主人怎么这样残忍？他把烧红的铁钉放在你面前，却把燕麦摆在你身后。让我把缰绳放下来，你好歹能转身吃几口燕麦。
        - id: ch03-b13
          speaker: farmer_weathersky
          text: 我这就来抓你！
          emotion: angry
        - id: ch03-b14
          speaker: narrator
          text: 风云农夫冲出门时，姑娘已经解开缰绳，好让马转身吃燕麦。黑马趁机甩掉笼头，纵身跳进鸭塘，入水便变成一条小鱼。风云农夫紧跟着跳下去，化作一条大梭鱼，张嘴追赶。杰克猛然跃出水面，又变成一只鸽子。风云农夫也不肯罢休，马上化作一只鹰，追着鸽子一次次扑击。
    - id: ch04
      title: 公主的戒指
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 鸽子拼命逃，鹰就在身后紧追。恰好一位公主站在王宫窗口，看见了这场凶险的追逐。她瞧见那只可怜的鸽子一次次躲开利爪，连忙探出身子朝它呼喊。
        - id: ch04-b02
          speaker: princess
          text: 可怜的鸽子！你要是明白我的心意，就快从窗口飞进来！
        - id: ch04-b03
          speaker: narrator
          text: 鸽子听懂了，立刻穿过窗口，飞进公主房间。它一落地便恢复成杰克。杰克把自己怎样拜师、怎样逃走，又怎样被风云农夫追到这里，全都讲给公主听。
        - id: ch04-b04
          speaker: princess
          text: 那你变成一枚金戒指，戴到我的手上。他就碰不到你了。
        - id: ch04-b05
          speaker: jack
          text: 这样躲不住。他会让国王生病，再装成唯一能治病的人。到时候，他要的酬劳一定是这枚戒指。
        - id: ch04-b06
          speaker: princess
          text: 我就说，这是母亲留给我的，谁也别想拿走。
        - id: ch04-b07
          speaker: narrator
          text: 杰克还是照她的主意，变成一枚金戒指，牢牢套在公主手上。风云农夫一时无法下手。可不久以后，国王果然病倒了。全国的医生轮番前来，没有一个治得好。最后，风云农夫出现，说只有自己能够救国王。至于酬劳，他别的什么也不要，只要公主手上的那枚金戒指。国王马上派使者去取。公主回答说，那是母亲留给自己的遗物，绝不能交出去。
        - id: ch04-b08
          speaker: king
          text: 不管戒指是谁留下的，我都必须拿到！
          emotion: angry
        - id: ch04-b09
          speaker: princess
          text: 父王，您再生气也没有用。这枚戒指牢牢套在手上，我怎么也摘不下来。您若非要不可，恐怕只能连我的手指一起拿走了。
        - id: ch04-b10
          speaker: farmer_weathersky
          text: 这有什么难的？只要让我亲手试一试，我马上就能替你把戒指摘下来。
        - id: ch04-b11
          speaker: princess
          text: 不必了，我自己来。
        - id: ch04-b12
          speaker: narrator
          text: 公主没有让他碰自己的手。她快步走到炉边，把炉灰抹在手指上。戒指顿时滑落，一头掉进灰堆，再也找不见了。风云农夫知道杰克就藏在那里，立刻化作一只公鸡。它把脑袋埋进炉灰，又用爪子刨，又用尖嘴啄，一心要找到那枚戒指。没过多久，灰尘已经盖到它耳朵边，整颗脑袋都灰蒙蒙的。
    - id: ch05
      title: 风云农夫的结局
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 公鸡只顾埋头翻找，却没发现灰里的戒指已经悄悄变回杰克。风云农夫还在刨灰，杰克又摇身一变，化作一只狐狸。狐狸猛地扑上前去，没给公鸡留下半点逃跑的机会，一口便咬掉了它的脑袋。
        - id: ch05-b02
          speaker: narrator
          text: 风云农夫再也没有变成别的东西，也没能继续追赶杰克。所以，他就算真有恶魔附体，如今也一切都结束了。
