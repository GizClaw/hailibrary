  chapters:
    - id: ch01
      title: Master Above All Masters
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Once upon a time, a man and his wife had one son, named Jack. The old dame decided it was time for him to go out into the world and learn a trade, so she sent her husband away with him.
        - id: ch01-b02
          speaker: old_dame
          text: Whatever you do, bind him to someone who can teach him to be master above all masters.
        - id: ch01-b03
          speaker: narrator
          text: She packed food and a roll of tobacco in a bag, and off they went. They visited master after master, asking each one to take Jack as an apprentice. Every master gave them the same answer. He could teach the lad until Jack was as skilled as he was, but he could never make the boy more skillful than his teacher. At last, father and son went home with that answer.
        - id: ch01-b04
          speaker: old_dame
          text: I don't care what trade he learns. I mean what I said. You must find someone who can teach him to be master above all masters.
        - id: ch01-b05
          speaker: narrator
          text: She packed more food and another roll of tobacco, and sent them out again. After they had walked for some time, they came onto the ice. A man in a sledge came whisking toward them behind a black horse.
        - id: ch01-b06
          speaker: farmer_weathersky
          text: Where are you going?
        - id: ch01-b07
          speaker: father
          text: I'm looking for a good master to teach my son a trade. But my old dame comes of such fine folk that she insists he must be taught to be master above all masters.
        - id: ch01-b08
          speaker: farmer_weathersky
          text: Then you've met the very man you need. I'm looking for an apprentice like him. Up behind me, lad!
        - id: ch01-b09
          speaker: narrator
          text: Jack climbed aboard. In a flash, the driver, boy, horse, and sledge flew straight up into the air.
        - id: ch01-b10
          speaker: father
          text: No, wait! You haven't told me your name or where you live!
          emotion: surprised
        - id: ch01-b11
          speaker: farmer_weathersky
          text: I'm at home in the north and south, and in the east and west. My name is Farmer Weathersky. Come back here in a year and a day, and I'll tell you whether I like the boy.
        - id: ch01-b12
          speaker: narrator
          text: Then they sped away through the sky and vanished. When the father returned alone, his wife demanded to know where Jack was.
        - id: ch01-b13
          speaker: father
          text: Heaven knows, because I surely don't. They went up into the air.
        - id: ch01-b14
          speaker: narrator
          text: He told her about the stranger, the black horse, and the sledge that had risen into the sky. He could not say where Jack had gone. Worse still, he had never found out when the apprenticeship would end. When his wife heard that, she packed him another bag of food, gave him another roll of tobacco, and sent him off once more to find their son.
    - id: ch02
      title: The Three Sisters
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: The father walked until he reached a great wood. It stretched on and on, and he spent the whole day crossing it. After dark, he saw a strong light and made his way toward it. Long afterward, he came to a little hut beneath a rock. Outside stood an old hag, drawing water from a well with her nose, for it was long enough to reach.
        - id: ch02-b02
          speaker: father
          text: Good evening, mother.
        - id: ch02-b03
          speaker: first_hag
          text: Good evening to you. It has been hundreds of years since anyone called me mother.
        - id: ch02-b04
          speaker: father
          text: May I stay here tonight?
        - id: ch02-b05
          speaker: first_hag
          text: No, you may not.
        - id: ch02-b06
          speaker: narrator
          text: The man took out his tobacco, lit his pipe, and offered her a puff and a pinch of snuff. That pleased her so much that she danced for joy and finally let him spend the night.
        - id: ch02-b07
          speaker: narrator
          text: In the morning, he asked about Farmer Weathersky.
        - id: ch02-b08
          speaker: first_hag
          text: I've never heard of him. But I rule all the four-footed beasts. Perhaps one of them knows.
        - id: ch02-b09
          speaker: narrator
          text: She had a pipe that could call the beasts, and she played until all the four-footed creatures came home to her. One by one, she asked whether they knew the way to Farmer Weathersky. Not one of them had heard of him or knew where he lived.
        - id: ch02-b10
          speaker: first_hag
          text: There are three sisters of us. Perhaps one of the others knows where he lives. Take my horse and sledge. Her house is at least three hundred miles away by the shortest road, but you'll reach it tonight.
        - id: ch02-b11
          speaker: narrator
          text: The man set out and reached the second house that night. Another old hag stood at the door, drawing water from the well with her long nose.
        - id: ch02-b12
          speaker: father
          text: Good evening, mother.
        - id: ch02-b13
          speaker: second_hag
          text: Good evening to you. No one has called me mother for hundreds of years.
        - id: ch02-b14
          speaker: father
          text: Could I lodge here tonight?
        - id: ch02-b15
          speaker: second_hag
          text: No.
        - id: ch02-b16
          speaker: narrator
          text: Again the man lit his pipe. He gave her a puff and laid a good pinch of snuff on the back of her hand. She jumped and danced with delight, and then allowed him to stay. After the night had passed, he asked her about Farmer Weathersky.
        - id: ch02-b17
          speaker: second_hag
          text: I've never heard of him. I rule all the fish in the sea, though. One of them may know something.
        - id: ch02-b18
          speaker: narrator
          text: She played her own pipe and called home all the fish in the sea. She asked every one of them about the man the father sought. Not a single fish had heard of Farmer Weathersky or knew anything about him.
        - id: ch02-b19
          speaker: second_hag
          text: Well, there is still our third sister. She may know. She lives six hundred miles away, but take my horse and sledge and you'll be there by nightfall.
        - id: ch02-b20
          speaker: narrator
          text: At nightfall, the man reached the third house. There an old hag stood before the grate, stirring the fire with her nose. It was both long and tough.
        - id: ch02-b21
          speaker: father
          text: Good evening, mother.
        - id: ch02-b22
          speaker: third_hag
          text: Good evening to you. It has been hundreds of years since anyone called me mother.
        - id: ch02-b23
          speaker: father
          text: Will you let me stay here tonight?
        - id: ch02-b24
          speaker: third_hag
          text: No.
        - id: ch02-b25
          speaker: narrator
          text: The father brought out his tobacco once again. He lit his pipe and gave her enough snuff to cover the whole back of her hand. She danced for joy and let him stay. In the morning, he asked where Farmer Weathersky lived.
        - id: ch02-b26
          speaker: third_hag
          text: I've never heard of him. But I rule the birds of the air. I'll call them home and ask them.
        - id: ch02-b27
          speaker: narrator
          text: She played her pipe and gathered the birds, but the Eagle was missing. A little later, he came flying home. He said he had just returned from Farmer Weathersky. The hag ordered him to guide the man there.
        - id: ch02-b28
          speaker: eagle
          text: I must eat first, and I need to rest until tomorrow. I've flown so far that I can hardly lift myself from the ground.
        - id: ch02-b29
          speaker: narrator
          text: The Eagle ate his fill and rested well. Then the old hag pulled one feather from his tail and put the man in its place. The Eagle took flight. He flew and flew, but they did not reach Farmer Weathersky's house until midnight.
    - id: ch03
      title: The Hare in the Stable
      blocks:
        - id: ch03-b01
          speaker: eagle
          text: You'll see heaps of dead bodies outside, but pay no attention to them. Everyone indoors is sleeping so deeply that waking them will be hard. Go straight to the table drawer and take three crumbs of bread. When you hear someone snoring loudly, pull three feathers from his head. Even that won't wake him.
        - id: ch03-b02
          speaker: narrator
          text: The man followed the Eagle's instructions. He took three crumbs from the drawer. Then he found the loud snorer and pulled the first feather from his head.
        - id: ch03-b03
          speaker: farmer_weathersky
          text: Oof! What a pull that was!
        - id: ch03-b04
          speaker: narrator
          text: It was Farmer Weathersky. He growled, but did not wake. The man pulled a second feather.
        - id: ch03-b05
          speaker: farmer_weathersky
          text: Oof! There's another hard pull!
        - id: ch03-b06
          speaker: narrator
          text: Still he slept. When the man pulled the third feather, Farmer Weathersky roared so fiercely that the man thought the roof and walls would fly apart. Yet the sleeper never opened his eyes.
        - id: ch03-b07
          speaker: narrator
          text: The Eagle told the father what to do next. Out in the yard, the man stumbled over a large gray stone beside the stable door. He bent down, lifted the heavy stone, and found three chips of wood hidden beneath it. He picked up all three. Then he knocked on the stable door, and the door swung open by itself. Inside the stable, he scattered the three bread crumbs on the ground. A hare came out to eat them. As soon as it had eaten, the man caught it and held it fast.
        - id: ch03-b08
          speaker: eagle
          text: Now pull three feathers from my tail. Put the hare, the stone, the wooden chips, and yourself where those feathers were. Then I'll carry all of you home.
        - id: ch03-b09
          speaker: narrator
          text: The man did so, and the Eagle flew away with them all.
    - id: ch04
      title: The Flight Home
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: After they had traveled a long way, the Eagle landed on a rock to rest.
        - id: ch04-b02
          speaker: eagle
          text: Can you see anything behind us?
        - id: ch04-b03
          speaker: father
          text: Yes. A flock of crows is flying after us.
        - id: ch04-b04
          speaker: eagle
          text: Then we had better move.
        - id: ch04-b05
          speaker: narrator
          text: The Eagle took off again. After a while, he asked the man to look once more.
        - id: ch04-b06
          speaker: father
          text: The crows are close behind us now.
        - id: ch04-b07
          speaker: eagle
          text: Drop the three feathers you pulled from Farmer Weathersky's head.
        - id: ch04-b08
          speaker: narrator
          text: The man let the three feathers fall through the air. The moment he dropped them, they became a whole flock of ravens. The ravens swept upon the pursuing crows and drove them all the way home again. With the danger behind them, the Eagle flew on and carried the man far away. At last, when he needed another rest, he settled on a stone.
        - id: ch04-b09
          speaker: eagle
          text: Do you see anything now?
        - id: ch04-b10
          speaker: father
          text: I'm not certain. I think something is coming, very far away.
        - id: ch04-b11
          speaker: eagle
          text: We had better keep going.
        - id: ch04-b12
          speaker: narrator
          text: They took flight again. Some time later, the Eagle asked him to look behind them.
        - id: ch04-b13
          speaker: father
          text: Yes, he's right at our heels now.
        - id: ch04-b14
          speaker: eagle
          text: Let the wooden chips fall, the ones you found beneath the gray stone at the stable door.
        - id: ch04-b15
          speaker: narrator
          text: The man dropped them. In an instant, they grew into a tall, thick wood. Farmer Weathersky had to turn back for an axe before he could cut his way through. While he was chopping, the Eagle flew ever so far. When he grew tired, he landed on a fir tree.
        - id: ch04-b16
          speaker: eagle
          text: Is there anything behind us?
        - id: ch04-b17
          speaker: father
          text: I can't be sure, but I think I can glimpse something far away.
        - id: ch04-b18
          speaker: eagle
          text: Then we'd best be off.
        - id: ch04-b19
          speaker: narrator
          text: Away he flew as fast as he could. After a time, he asked again.
        - id: ch04-b20
          speaker: father
          text: Yes! He's close behind us now.
        - id: ch04-b21
          speaker: eagle
          text: Drop the large stone you lifted beside the stable door.
        - id: ch04-b22
          speaker: narrator
          text: The man dropped the stone, and it became a great, high mountain. Farmer Weathersky had to break a path through it. Halfway through, he stumbled and broke one leg. He had no choice but to limp home and mend it. Meanwhile, the Eagle carried the man and the hare safely back to the man's house.
        - id: ch04-b23
          speaker: narrator
          text: As soon as they arrived, the father took the hare into the churchyard and sprinkled Christian earth over it. In a flash, the hare became his son Jack.
        - id: ch04-b24
          speaker: narrator
          text: You may imagine how glad the old dame was to have her son home. Even then, she could not stop worrying about his trade. She would not rest until Jack proved that he truly was master above all masters.
    - id: ch05
      title: Three Horses at the Fair
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: When fair day came, Jack changed himself into a bay horse and told his father to lead him there.
        - id: ch05-b02
          speaker: jack
          text: If anyone wants to buy me, ask one hundred dollars. But you must take off my headstall before you let me go. Farmer Weathersky will be the buyer, and if he gets the headstall too, he'll keep me forever.
        - id: ch05-b03
          speaker: narrator
          text: Everything happened just as Jack had said. A horse dealer came up, eager to own the bay horse, and paid one hundred dollars. Once the bargain was settled and the money was in the father's pocket, the dealer demanded the headstall.
        - id: ch05-b04
          speaker: father
          text: No, no. The headstall wasn't part of our bargain, and you can't have it. I have other horses at home to bring to town tomorrow.
        - id: ch05-b05
          speaker: narrator
          text: So the two men went their separate ways. Before Jack and his buyer had traveled far, Jack took his own shape and ran off. When his father came home, there sat Jack by the fire.
        - id: ch05-b06
          speaker: narrator
          text: The next day, Jack became a brown horse and told his father to take him to the fair again.
        - id: ch05-b07
          speaker: jack
          text: This time, ask two hundred dollars. He'll pay it and buy you a drink as well. No matter how much you drink, remember the headstall. If you leave it on me, you'll never see me again.
        - id: ch05-b08
          speaker: narrator
          text: Once again, it all came true. The buyer paid the father two hundred dollars for the brown horse and treated him to a glass of drink as well. When buyer and seller were ready to part, the father almost walked away without the headstall. At the last moment, he remembered Jack's warning and pulled it off. Before the buyer and horse had gone far along the road, Jack changed back into himself and ran home. By the time his father arrived, Jack was already sitting by the fire.
        - id: ch05-b09
          speaker: narrator
          text: On the third day, they tried the same trick again. Jack became a black horse.
        - id: ch05-b10
          speaker: jack
          text: Someone will offer three hundred dollars for me, and he'll fill you with food and drink besides. However much you eat and drink, don't forget my headstall. If you do, I'll belong to Farmer Weathersky for the rest of my life.
        - id: ch05-b11
          speaker: father
          text: No, no. Don't worry. I won't forget.
        - id: ch05-b12
          speaker: narrator
          text: At the fair, the father sold the black horse for three hundred dollars. Farmer Weathersky made sure the bargain was not a dry one. He gave the man so much to drink that this time the headstall slipped entirely from his mind. Farmer Weathersky led the horse away.
        - id: ch05-b13
          speaker: narrator
          text: After a little while, Farmer Weathersky decided to stop for another glass of brandy. He placed a barrel of red-hot nails beneath the horse's nose and a sieve of oats behind its tail. Then he hung the halter on a hook and went into the inn. The horse stamped, pawed, snorted, and reared.
        - id: ch05-b14
          speaker: narrator
          text: A lassie came outside and saw how the horse was being treated.
        - id: ch05-b15
          speaker: lassie
          text: Oh, you poor creature! What a cruel master you have.
        - id: ch05-b16
          speaker: narrator
          text: She lifted the halter from the hook so the horse could turn around and reach the oats.
        - id: ch05-b17
          speaker: farmer_weathersky
          text: I'M AFTER YOU!
          emotion: angry
    - id: ch06
      title: The Chase of Many Shapes
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: Farmer Weathersky rushed out through the door. But the horse had already shaken off the headstall. Jack leaped into a duck pond and became a tiny fish. Farmer Weathersky plunged in after him as a great pike.
        - id: ch06-b02
          speaker: narrator
          text: Jack changed next into a dove. Farmer Weathersky became a hawk and chased him, striking at the dove as they flew. At that moment, a Princess stood at a palace window and saw the struggle.
        - id: ch06-b03
          speaker: princess
          text: Oh, poor dove! If only you knew what I know, you would fly in here to me.
        - id: ch06-b04
          speaker: narrator
          text: The dove flew through her window and became Jack again. He told the Princess his whole story.
        - id: ch06-b05
          speaker: princess
          text: Change yourself into a gold ring and sit on my finger.
        - id: ch06-b06
          speaker: jack
          text: No, that won't work. Farmer Weathersky will make the king ill. No one will be able to cure him until Weathersky arrives, and he'll demand the gold ring as his payment.
        - id: ch06-b07
          speaker: princess
          text: Then I'll say the ring came from my mother, and I cannot give it away.
        - id: ch06-b08
          speaker: narrator
          text: Jack became a gold ring and placed himself on the Princess's finger. Farmer Weathersky could not reach him there. But everything Jack had predicted soon happened. The king fell ill, and no doctor in the kingdom could cure him. At last Farmer Weathersky came, restored the king's health, and named his fee. He wanted the ring from the Princess's finger.
    - id: ch07
      title: The Ring in the Ashes
      blocks:
        - id: ch07-b01
          speaker: narrator
          text: The king sent a messenger to fetch the ring.
        - id: ch07-b02
          speaker: messenger
          text: The king commands you to give him the gold ring from your finger.
        - id: ch07-b03
          speaker: princess
          text: I will not part with it. My mother left it to me.
        - id: ch07-b04
          speaker: narrator
          text: When the king heard her answer, he flew into a rage. He declared that he would have the ring, no matter who had left it to her.
        - id: ch07-b05
          speaker: princess
          text: Being angry won't help. I can't pull it off. If you insist on taking the ring, you'll have to take my finger with it.
        - id: ch07-b06
          speaker: farmer_weathersky
          text: Let me try. I'll have that ring off in no time.
        - id: ch07-b07
          speaker: princess
          text: No, thank you. I'll try it myself.
        - id: ch07-b08
          speaker: narrator
          text: The Princess hurried to the grate and rubbed ashes over her finger. The ring slipped free and disappeared among them. Farmer Weathersky turned himself into a cock. He scratched and pecked through the grate until the ashes came up around his ears.
        - id: ch07-b09
          speaker: narrator
          text: While the cock was still searching, Jack became a fox and bit off its head. And if the Evil One truly lived inside Farmer Weathersky, then that was the end of him.
