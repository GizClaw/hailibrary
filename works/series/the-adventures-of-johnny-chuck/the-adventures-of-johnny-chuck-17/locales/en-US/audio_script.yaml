audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm, lively storytelling with a gentle sense of wonder
        timbre: clear and rounded
        pace: measured
        pitch: medium
    sammy_jay:
      display_name: Sammy Jay
      tts:
        delivery: clever, mischievous, and pleased with his own schemes
        timbre: bright and crisp
        pace: brisk
        pitch: medium-high
    reddy_fox:
      display_name: Reddy Fox
      tts:
        delivery: sly and watchful, with a hungry edge
        timbre: smooth and lean
        pace: moderate
        pitch: medium
    farmer_browns_boy:
      display_name: Farmer Brown's Boy
      tts:
        delivery: practical, alert, and quietly confident
        timbre: clear and youthful
        pace: moderate
        pitch: medium
  chapters:
    - id: ch01
      title: More Mischief
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Mischief is like a snowball rolling downhill. It gets bigger with every turn, and bigger, and bigger still.
        - id: ch01-b02
          speaker: narrator
          text: Sammy Jay had started the mischief by telling Reddy Fox where Johnny Chuck's new house was. Sammy would have insisted that he had told Reddy nothing. He had only mentioned being in Farmer Brown's old orchard and stopping by Johnny's new home.
        - id: ch01-b03
          speaker: narrator
          text: Reddy Fox was very sly. Oh, very sly indeed. He had acted as though he had known all along where Johnny lived. Then he left Sammy and headed toward the Green Meadows, just as if he had no thought at all of visiting Farmer Brown's old orchard.
        - id: ch01-b04
          speaker: narrator
          text: But Sammy Jay could be every bit as sly as Reddy. He was not fooled for even a moment. Sammy chuckled and set off to find Jimmy Skunk. Then he changed his mind.
        - id: ch01-b05
          speaker: sammy_jay
          text: "I believe I'll visit the old orchard myself!"
        - id: ch01-b06
          speaker: narrator
          text: Away Sammy flew. He arrived first and hid high in a big apple tree, where he could watch everything below.
        - id: ch01-b07
          speaker: narrator
          text: Before long, Reddy Fox slipped out of the Green Forest and crossed to the old orchard. He was terribly nervous. It was broad daylight, and the orchard stood very close to Farmer Brown's house. Reddy knew he should have waited until night. But Johnny would be fast asleep then. Right now, Johnny might believe that no one knew where he lived. Perhaps he would not be on watch, and Reddy might be able to catch him.
        - id: ch01-b08
          speaker: narrator
          text: Reddy crept into the orchard with one eye on Farmer Brown's house and the other searching for any sign of Johnny Chuck. Every few steps, he stopped to look and listen. Each little noise made him jump. From his hiding place, Sammy Jay chuckled softly.
        - id: ch01-b09
          speaker: narrator
          text: Reddy crept and tiptoed here and there through the old orchard. With every passing minute, he grew more nervous. With every passing minute, he also grew more disappointed, because he could find no trace of Johnny's house. Soon he began to think Sammy Jay had tricked him. The very thought made Reddy grind his teeth. At last, he decided to give up the search.
        - id: ch01-b10
          speaker: narrator
          text: By then, Reddy had reached the far corner of the orchard beside the old stone wall. He was ready to leap over it when he happened to glance around the other side of the big apple tree above him. There it was at last. Johnny Chuck's new house!
        - id: ch01-b11
          speaker: narrator
          text: Johnny was nowhere in sight. Still, there stood his new house, so Johnny had to be inside it or somewhere close by. Reddy grinned. It was a sly, wicked, hungry grin. Then he pressed himself flat in the grass behind the big apple tree.
        - id: ch01-b12
          speaker: reddy_fox
          text: "Johnny Chuck is about to get the biggest surprise of his life!"
        - id: ch01-b13
          speaker: narrator
          text: Sammy Jay had watched the whole thing. He knew Johnny was safe inside. Johnny had spotted Reddy as soon as the fox entered the orchard, and he knew Reddy would hide once he found the new house.
        - id: ch01-b14
          speaker: sammy_jay
          text: "Johnny won't come out again today. Now there won't be any excitement at all."
          emotion: sad
        - id: ch01-b15
          speaker: narrator
          text: Sammy was disappointed. He had hoped to watch Reddy Fox and Johnny Chuck fight. Just then, he looked toward Farmer Brown's house. Farmer Brown's boy was getting ready to saw wood. The mischievous little idea under Sammy's pert cap sprang to life.
        - id: ch01-b16
          speaker: narrator
          text: Sammy flew to the old apple tree and perched directly over Reddy's head. Then he screamed as loudly as he could.
        - id: ch01-b17
          speaker: narrator
          text: Farmer Brown's boy stopped working and looked toward the old orchard.
        - id: ch01-b18
          speaker: farmer_browns_boy
          text: "When a jay makes that much noise, there's usually a fox nearby."
        - id: ch01-b19
          speaker: narrator
          text: He reached down and unfastened Bowser the Hound.
