audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖亲切，带着轻快而含蓄的幽默
        timbre: 清亮柔和
        pace: 舒缓而有变化
        pitch: 中等
    sammy_jay:
      display_name: 松鸦萨米
      tts:
        delivery: 机灵活泼，话里常藏着恶作剧的得意
        timbre: 清脆明亮
        pace: 稍快
        pitch: 中高
    reddy_fox:
      display_name: 红狐狸雷迪
      tts:
        delivery: 狡黠轻快，带着不怀好意的亲热
        timbre: 尖细而灵活
        pace: 稍快
        pitch: 中高
    farmer_browns_boy:
      display_name: 农夫布朗家的男孩
      tts:
        delivery: 自然爽快，带着乡野少年的亲切
        timbre: 清朗明亮
        pace: 中等
        pitch: 中高
  chapters:
    - id: ch01
      title: 越滚越大的雪球
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 淘气就像一个雪球，顺着山坡滚下去。每滚一圈，它就大上一圈，越滚越大，越滚越大。
        - id: ch01-b02
          speaker: narrator
          text: 松鸦萨米告诉红狐狸雷迪，土拨鼠强尼的新房子就在什么地方，这便惹出了麻烦。可要是有人问他，萨米准会说，自己什么也没有告诉雷迪。他只是提了一句，自己碰巧去了农夫布朗家的老果园，还顺路看望了住在新房子里的强尼。
        - id: ch01-b03
          speaker: narrator
          text: 红狐狸雷迪狡猾得很。他在萨米面前装得像是早就知道强尼住在哪里。离开萨米时，他还特意朝绿草地走去，仿佛根本没打算去农夫布朗家的老果园。
        - id: ch01-b04
          speaker: narrator
          text: 可松鸦萨米也一样狡猾，连一丁点儿都没上当。他本来一边偷笑，一边去找臭鼬吉米，走着走着却改了主意。
        - id: ch01-b05
          speaker: sammy_jay
          text: “我看，我还是自己去一趟老果园吧！”
        - id: ch01-b06
          speaker: narrator
          text: 说完，萨米拍拍翅膀飞走了。
    - id: ch02
      title: 雷迪偷偷来了
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 萨米抢先赶到老果园，藏在一棵大苹果树的树梢。下面不管发生什么，他都看得清清楚楚。没过多久，红狐狸雷迪果然偷偷溜出绿森林，朝老果园走来。
        - id: ch02-b02
          speaker: narrator
          text: 雷迪非常紧张。现在天光大亮，老果园离农夫布朗家又近。他知道，自己本来该等到夜里再来。可是到了夜里，强尼早就睡熟了。眼下，强尼也许以为没人知道他的住处，不会留心防备。这样一来，雷迪说不定能逮住他。
        - id: ch02-b03
          speaker: narrator
          text: 雷迪溜进老果园，一只眼睛盯着农夫布朗的房子，另一只眼睛四处寻找强尼。每走几步，他都要停下来看看，再竖起耳朵听听。哪怕只有一点儿动静，也会吓得他猛然一惊。每到这时，萨米就在树上偷偷发笑。
        - id: ch02-b04
          speaker: narrator
          text: 雷迪踮着脚，在老果园里东钻西探。他越找越紧张，也越找越失望，因为四处都不见强尼新房子的踪影。他开始怀疑自己中了萨米的圈套，一想到这里，便气得咬紧牙齿。最后，他决定放弃了。
    - id: ch03
      title: 苹果树后的新房子
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 这时，雷迪已经走到老果园最偏远的角落，旁边就是古老的石墙。他刚摆好架势，准备跳过去，却无意间往头顶那棵大苹果树的另一边看了一眼。
        - id: ch03-b02
          speaker: narrator
          text: 他苦苦寻找的东西，就在那里。那正是土拨鼠强尼的新房子！强尼虽然没有露面，可房子就在眼前。他不是躲在里面，就是待在附近。
        - id: ch03-b03
          speaker: narrator
          text: 雷迪咧开嘴，露出一个又狡猾、又凶恶、又馋的笑。他把身子压得紧贴草地，藏到了大苹果树后面。
        - id: ch03-b04
          speaker: reddy_fox
          text: “这一次，我非得让土拨鼠强尼大吃一惊，一辈子都忘不了！”
        - id: ch03-b05
          speaker: narrator
          text: 雷迪把声音压得很低，独自嘟囔着。松鸦萨米一直在树上看着。他知道强尼安全地待在家里。因为雷迪才走进老果园，强尼就已经看见他了。萨米也知道，强尼心里很清楚，雷迪只要发现这座新房子，就会像现在这样躲起来。
    - id: ch04
      title: 萨米又有了主意
      blocks:
        - id: ch04-b01
          speaker: sammy_jay
          text: “土拨鼠强尼今天肯定不会再出来了。这下什么热闹也看不成啦。”
        - id: ch04-b02
          speaker: narrator
          text: 萨米很失望。他原本还盼着红狐狸雷迪和土拨鼠强尼打上一架呢。
        - id: ch04-b03
          speaker: narrator
          text: 就在这时候，萨米朝农夫布朗家望了一眼。农夫布朗家的男孩正准备锯木头。萨米那顶神气的小帽子下面，淘气鬼忽然给他出了个主意。
        - id: ch04-b04
          speaker: narrator
          text: 萨米飞到那棵老苹果树上，正好停在雷迪头顶。他扯开嗓门，拼命尖叫起来。
        - id: ch04-b05
          speaker: narrator
          text: 农夫布朗家的男孩停下手里的活儿，转头望向老果园。
        - id: ch04-b06
          speaker: farmer_browns_boy
          text: “松鸦这样叫，附近多半藏着一只狐狸。”
        - id: ch04-b07
          speaker: narrator
          text: 他一边小声嘟囔，一边把猎犬鲍泽放开了。
