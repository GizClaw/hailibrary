audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖亲切，带着轻快而含蓄的幽默
        timbre: 清亮柔和
        pace: 舒缓而有变化
        pitch: 中等
    sammy_jay:
      display_name: 松鸦萨米
      tts:
        delivery: 机灵活泼，话里常藏着恶作剧的得意
        timbre: 清脆明亮
        pace: 稍快
        pitch: 中高
  chapters:
    - id: ch01
      title: 藏在心底的善良
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 世上没有谁会坏到无可救药。每个人的心灵深处，总有一个小小的角落，能让一点善良悄悄钻进去，躲在里面。
        - id: ch01-b02
          speaker: narrator
          text: 松鸦萨米也是这样。是的，先生，他也是这样。萨米虚荣，爱惹是生非，还会偷东西。你也许觉得他从头坏到了脚，其实不是。就像所有人一样，萨米身上也有善良的一面。
        - id: ch01-b03
          speaker: narrator
          text: 要是他一点儿好心都没有，老大自然妈妈绝不会让他在绿森林里到处淘气。萨米偏偏最爱把别人拖进麻烦，所以谁都不喜欢他。
        - id: ch01-b04
          speaker: narrator
          text: 可你要是看得够仔细，就能发觉，那身漂亮的蓝白外衣下面，确实藏着一点善良。可能要找上很久，不过早晚会找到。土拨鼠强尼就找到了。
    - id: ch02
      title: 又一个惹麻烦的好机会
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 萨米已经给强尼添过不少麻烦。森林和草地上的小居民里，是他最先找到强尼的新房子。为了捣乱，他先把消息告诉红狐雷迪，后来又把猎犬鲍泽和农夫布朗家的男孩引了过去。
        - id: ch02-b02
          speaker: narrator
          text: 现在，萨米连强尼最大的秘密也知道了。原来强尼有了一个家，还有了自己的孩子！这可是个惹麻烦的大好机会。
        - id: ch02-b03
          speaker: narrator
          text: 萨米使劲扇着翅膀，飞快地赶往绿森林。他打算去告诉红狐雷迪和红尾鹰。那两个家伙对土拨鼠宝宝可喜欢得很。要是他们突然出现，强尼一家准会吓坏。萨米一想到那番情景，就觉得一定非常有趣。
    - id: ch03
      title: 萨米的笑声变了
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 萨米一路飞，一路不怀好意地窃笑。到了绿森林，他落在最喜欢的铁杉树上休息，嘴里仍在笑。可是仔细听听，那已经是另一种笑声了。是的，先生，这种笑声可顺耳多了。
        - id: ch03-b02
          speaker: narrator
          text: 原来，萨米已经忘了自己能惹出多大的麻烦。他正想着门阶上的三只土拨鼠宝宝。那几个小家伙坐成一排，强尼做什么，他们就跟着做什么，模样实在滑稽。萨米越想越好笑，笑得根本停不下来。
        - id: ch03-b03
          speaker: narrator
          text: 他正笑得起劲，红尾鹰飞来了。萨米张开嘴，本想叫住红尾鹰，把强尼的秘密说出来。可下一刻，他又“啪”地把嘴闭紧了。
        - id: ch03-b04
          speaker: sammy_jay
          text: “现在还是别告诉他了。万一他抓走一只土拨鼠宝宝怎么办？那几个小家伙那么滑稽可爱，真被抓走就太可惜了。我看，再等一阵吧。”
    - id: ch04
      title: 回心转意
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 说完，萨米飞走了，又去别处寻找新的恶作剧。你瞧，他已经回心转意。那一点藏在心底深处的善良，终于走出了藏身的地方。
        - id: ch04-b02
          speaker: narrator
          text: 可土拨鼠强尼对此一无所知。在老果园远处角落的新房子里，他和波莉还在不停地担心。他们认定，秘密很快就会传得人人皆知。
        - id: ch04-b03
          speaker: narrator
          text: 到那时候，亲爱的土拨鼠宝宝们就不安全了。他们恐怕连滑稽的小鼻子也不能伸出门外。
