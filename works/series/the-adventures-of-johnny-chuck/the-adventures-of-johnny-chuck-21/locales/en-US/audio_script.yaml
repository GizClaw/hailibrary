audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm, lively storytelling with a gentle sense of wonder
        timbre: clear and rounded
        pace: measured
        pitch: medium
    sammy_jay:
      display_name: Sammy Jay
      tts:
        delivery: sharp, nosy, and quick with a teasing remark
        timbre: bright and piercing
        pace: brisk
        pitch: medium-high
  chapters:
    - id: ch01
      title: Sammy Jay Has a Change of Heart
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: No one is ever quite so bad that a little goodness cannot find some hidden place deep inside.
        - id: ch01-b02
          speaker: narrator
          text: That was true of Sammy Jay. Yes, Sir, it was. Sammy was vain. He made trouble, and he stole. You might think that made him bad through and through, but it did not. There was goodness in Sammy, just as there is in everyone. Otherwise, Old Mother Nature would never have let him go on with his mischievous ways in the Green Forest.
        - id: ch01-b03
          speaker: narrator
          text: Sammy dearly loved getting other people into trouble. That was one reason nobody loved him. Still, if you watched very closely, you could find some goodness tucked beneath his beautiful blue-and-white coat. It might take a long while to appear, but sooner or later it would. Johnny Chuck discovered that for himself.
        - id: ch01-b04
          speaker: narrator
          text: Sammy had already caused Johnny plenty of trouble. He had been the first of the little forest and meadow people to discover Johnny's new house. Then, simply to stir up trouble, he told Reddy Fox where it was. After that, he called Bowser the Hound and Farmer Brown's boy over to the house. Now Sammy had uncovered Johnny's greatest secret. Johnny had a family. What a wonderful chance this was to cause even more trouble!
        - id: ch01-b05
          speaker: narrator
          text: Sammy flew toward the Green Forest as fast as his wings could carry him. He planned to tell Reddy Fox and Redtail the Hawk. Both of them were very fond of young Chucks. Sammy thought it would be great fun to watch Johnny and his family grow frightened when Reddy or Redtail came near.
        - id: ch01-b06
          speaker: narrator
          text: Sammy chuckled wickedly as he flew. He reached the Green Forest and stopped to rest in his favorite hemlock tree. He was still chuckling then, but the sound had changed. Yes, Sir, this was a different chuckle, and it was much nicer to hear.
        - id: ch01-b07
          speaker: narrator
          text: Sammy was no longer laughing about the trouble he could make. Instead, he remembered those three funny baby Chucks. They had sat up on Johnny's doorstep and tried to copy everything their father did. The more Sammy pictured them, the more the memory tickled him, and the harder he laughed.
        - id: ch01-b08
          speaker: narrator
          text: Right in the middle of Sammy's laughter, Redtail the Hawk came along. Sammy opened his mouth to call out and reveal Johnny's secret. Then he snapped it shut.
        - id: ch01-b09
          speaker: sammy_jay
          text: I won't tell him yet. He might catch one of those baby Chucks, and they're such funny little fellows. That really would be too bad. I think I'll wait a while.
        - id: ch01-b10
          speaker: narrator
          text: With that, Sammy flew away to look for some other mischief. You see, his heart had changed. The little goodness hidden deep inside him had finally come out.
        - id: ch01-b11
          speaker: narrator
          text: Of course, Johnny Chuck knew nothing about Sammy's change of heart. Far away in the new house at the old orchard's distant corner, Johnny and Polly Chuck worried and worried. They felt certain everyone would soon learn their secret. Then it would not be safe for their dear baby Chucks to put even their funny little noses outside the door.
