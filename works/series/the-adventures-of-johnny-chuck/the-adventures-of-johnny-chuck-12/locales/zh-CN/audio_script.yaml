audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖亲切，带着轻快而含蓄的幽默
        timbre: 清亮柔和
        pace: 舒缓而有变化
        pitch: 中等
    johnny_chuck:
      display_name: 土拨鼠强尼
      tts:
        delivery: 朴实直爽，偶尔带一点不耐烦
        timbre: 浑厚温暖
        pace: 中等
        pitch: 中低
    polly_chuck:
      display_name: 土拨鼠波莉
      tts:
        delivery: 温柔腼腆，说话小心而真诚
        timbre: 轻柔清甜
        pace: 稍慢
        pitch: 中高
    young_dog:
      display_name: 小狗
      tts:
        delivery: 莽撞冲动，逞强时透着稚气
        timbre: 明亮粗涩
        pace: 偏快
        pitch: 中高
  chapters:
    - id: ch01
      title: 第十二章　强尼证明了他的爱
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 春天的绿草地真美。强尼觉得，这片草地从来没有这么可爱，鸟儿也从来没有唱得这么甜。他连那些老朋友都忘了，臭鼬吉米、长耳兔彼得，还有草地上的其他小居民，一个也没想起来。
        - id: ch01-b02
          speaker: narrator
          text: 因为啊，强尼心里只有波莉。他只想陪着波莉，连自己原本要去看看世界这件事都忘得干干净净。现在，他根本不在乎外面的世界了。只要波莉在身边，他就觉得什么都不缺。
        - id: ch01-b03
          speaker: narrator
          text: 强尼已经找到了世上最伟大的东西，那就是爱。可他还有一个很大的心愿。他想让波莉亲眼看看，自己有多勇敢，多强壮，又有多会照顾她。
        - id: ch01-b04
          speaker: narrator
          text: 一天早晨，他们来到一道古老的石墙附近，钻进一片香甜的三叶草，美美地吃了起来。强尼小时候被老白尾泽鹰追赶，就是躲进这道石墙，才逃过了一劫。
        - id: ch01-b05
          speaker: narrator
          text: 忽然，波莉害怕地轻叫了一声。强尼抬头一看，一条狗已经快扑到她身上了。他头一个念头，就是赶快逃进石墙。毕竟，他离石墙更近。
        - id: ch01-b06
          speaker: narrator
          text: 可强尼马上看明白了。波莉还没跑到石墙，那条可怕的狗就会抓住她。
        - id: ch01-b07
          speaker: narrator
          text: 强尼心里腾地燃起一股怒火，就跟他大战灰色老土拨鼠时一样。他全身的毛一下子竖了起来。那不是害怕，是愤怒。他猛地跳到波莉前面，把她挡在身后。
        - id: ch01-b08
          speaker: johnny_chuck
          text: “快跑，波莉，快跑！”
        - id: ch01-b09
          speaker: narrator
          text: 波莉转身跑了，强尼却留在原地。对，他一步也没有逃。他绷紧身子，随时准备扑出去，还龇出尖牙，恶狠狠地磨着。两只眼睛里，简直像在往外迸火星。强尼身上连一丁点儿害怕的影子也没有。
        - id: ch01-b10
          speaker: narrator
          text: 小狗冲到他面前，忽然停下来，朝他汪汪大叫。这条狗还小，又年轻又莽撞，这会儿兴奋得不得了。他叫得上气不接下气，却不敢靠近强尼那口尖牙。
        - id: ch01-b11
          speaker: narrator
          text: 于是，小狗绕着强尼转圈，想偷偷绕到他背后。可小狗转到哪边，强尼就跟着转到哪边。无论小狗怎么绕，一抬头，那口尖牙总在正前方等着他。
        - id: ch01-b12
          speaker: narrator
          text: 小狗只能接着叫，叫了又叫，简直快把自己的脑袋叫掉了。
        - id: ch01-b13
          speaker: narrator
          text: 最后，这条又年轻又莽撞的小狗烦了。他不想再绕着圈子空叫，便对自己说。
        - id: ch01-b14
          speaker: young_dog
          text: “呸！不就是一只土拨鼠吗！”
        - id: ch01-b15
          speaker: narrator
          text: 小狗不叫了。他发出一声凶狠的低吼，照直朝强尼扑过去。
        - id: ch01-b16
          speaker: narrator
          text: 强尼早有准备，而且比小狗更快。他一口咬住小狗的一只耳朵，尖牙紧紧不松，结实的爪子同时又抓又撕。
        - id: ch01-b17
          speaker: narrator
          text: 小狗太年轻，也太莽撞，还根本不会打架。他怎么都咬不住强尼，只好拼命甩动身子，想把强尼甩下来。
        - id: ch01-b18
          speaker: narrator
          text: 可这也没用。强尼的尖牙牢牢咬着那只耳朵，小狗怎么甩也甩不掉他。
        - id: ch01-b19
          speaker: young_dog
          text: “嗷呜——咿——咿——咿！嗷呜——咿——咿——咿！”
        - id: ch01-b20
          speaker: narrator
          text: 强尼的尖牙咬得他疼极了。
        - id: ch01-b21
          speaker: narrator
          text: 他们翻过来，滚过去，扭成了一团。小狗拼命要逃，强尼却死死咬住他的耳朵。最后，强尼实在需要喘口气，这才不得不松开嘴。
        - id: ch01-b22
          speaker: narrator
          text: 小狗立刻跳起来，转身冲过绿草地，使出最快的速度，一路逃回家去了。
        - id: ch01-b23
          speaker: narrator
          text: 强尼抖了抖身子。小狗那一声声“嗷呜——咿——咿”越飘越远，他听着听着，咧嘴笑了。
        - id: ch01-b24
          speaker: johnny_chuck
          text: “还好来的不是猎犬鲍泽。”
        - id: ch01-b25
          speaker: narrator
          text: 强尼低声嘟囔完，便朝古老的石墙走去。波莉正从石墙里探出头来看他，身子还因为害怕而不停发抖。
        - id: ch01-b26
          speaker: polly_chuck
          text: “你可真勇敢呀！”
        - id: ch01-b27
          speaker: johnny_chuck
          text: “嗨，没什么大不了的！”
