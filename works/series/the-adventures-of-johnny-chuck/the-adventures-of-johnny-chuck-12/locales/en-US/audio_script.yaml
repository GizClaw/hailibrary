  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm, lively storytelling with a gentle sense of wonder
        timbre: clear and rounded
        pace: measured
        pitch: medium
    johnny_chuck:
      display_name: Johnny Chuck
      tts:
        delivery: good-natured, thoughtful, and quick to brighten with discovery
        timbre: warm and youthful
        pace: moderate
        pitch: medium
    polly_chuck:
      display_name: Polly Chuck
      tts:
        delivery: gentle, warm, and sincerely expressive
        timbre: soft and youthful
        pace: moderate
        pitch: medium-high
