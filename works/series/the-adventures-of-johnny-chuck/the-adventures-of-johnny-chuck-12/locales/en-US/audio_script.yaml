  chapters:
    - id: ch01
      title: Johnny Chuck Proves His Love
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Spring had brought beautiful days to the Green Meadows. To Johnny Chuck, the meadows had never looked lovelier, and the birds had never sung more sweetly. He had forgotten all about Jimmy Skunk, Peter Rabbit, and his other old friends.
        - id: ch01-b02
          speaker: narrator
          text: Johnny could think of no one but Polly Chuck. He did not want to be with anyone else. All he wanted was to stay close to Polly, and when he was with her, he was perfectly happy. He had even forgotten that he had set out to see the world. He no longer cared about seeing it at all. Johnny had found the greatest thing in the world, and that was love.
        - id: ch01-b03
          speaker: narrator
          text: Still, Johnny had one great wish. More than anything, he longed for a chance to show Polly how brave and strong he was. He wanted her to see just how well he could take care of her.
        - id: ch01-b04
          speaker: narrator
          text: One morning, Johnny and Polly were feasting on sweet clover near an old stone wall. It was the very wall where Johnny had escaped from old Whitetail the Marshhawk when he was a very little fellow.
        - id: ch01-b05
          speaker: narrator
          text: Without warning, Polly gave a frightened little scream. Johnny looked up. A dog was almost on top of her! His first thought was to race for the old stone wall. Johnny was closer to it than Polly, and he knew the terrible dog would catch her before she got there.
        - id: ch01-b06
          speaker: narrator
          text: Then a great rage swept through Johnny, just as it had when he fought the old gray Chuck. Every hair stood on end. It was anger, not fear. Johnny sprang between Polly and the dog.
        - id: ch01-b07
          speaker: johnny_chuck
          text: "Run, Polly! Get to the wall!"
          emotion: angry
        - id: ch01-b08
          speaker: narrator
          text: Polly raced toward the old stone wall, but Johnny did not run. Oh, my, no! Johnny gathered himself, ready to spring. He bared his sharp teeth and ground them fiercely. His eyes seemed to flash with tiny sparks of fire. There was not the least little bit of fear in Johnny Chuck.
        - id: ch01-b09
          speaker: narrator
          text: The dog stopped right in front of him and barked. He was a little dog, young and foolish, and terribly excited. He barked until he could hardly breathe, but he did not like the sight of Johnny's sharp teeth.
        - id: ch01-b10
          speaker: narrator
          text: The little dog circled around, trying to get behind Johnny. Johnny turned with him every time. Wherever the dog went, those sharp teeth were waiting right in front of him. Still the dog barked and barked, as if he might bark his head right off.
        - id: ch01-b11
          speaker: narrator
          text: At last, the young and foolish dog grew tired of dancing around and making so much noise.
        - id: ch01-b12
          speaker: little_dog
          text: "Pooh! He's only a Chuck!"
        - id: ch01-b13
          speaker: narrator
          text: The little dog stopped barking. With an ugly growl, he sprang straight at Johnny.
        - id: ch01-b14
          speaker: narrator
          text: But Johnny was ready, and he was quicker. His sharp teeth snapped shut on one of the dog's ears. Johnny held tight while his stout claws scratched and tore.
        - id: ch01-b15
          speaker: narrator
          text: The little dog had never learned how to fight, and he could not get hold of Johnny anywhere. He tried to shake Johnny off, but Johnny's teeth stayed clamped on that ear.
        - id: ch01-b16
          speaker: little_dog
          text: "Kiyi-yi-yi-yi! Oh, let go! Kiyi-yi-yi-yi!"
        - id: ch01-b17
          speaker: narrator
          text: Those teeth hurt dreadfully. Over and over the two of them rolled and tumbled. The little dog fought to get away, and Johnny kept his grip on the dog's ear. At last, Johnny had to let go so he could breathe.
        - id: ch01-b18
          speaker: narrator
          text: The little dog jumped to his feet and raced for home across the Green Meadows as fast as he could go.
        - id: ch01-b19
          speaker: narrator
          text: Johnny shook himself and grinned. The little dog's cries of "Kiyi-yi-yi!" faded farther and farther away.
        - id: ch01-b20
          speaker: johnny_chuck
          text: "I'm glad that wasn't Bowser the Hound."
        - id: ch01-b21
          speaker: narrator
          text: Johnny muttered this as he headed for the old stone wall. Polly was there, peeping out at him and trembling all over with fright.
        - id: ch01-b22
          speaker: polly_chuck
          text: "Oh, Johnny! You were so brave!"
        - id: ch01-b23
          speaker: johnny_chuck
          text: "Pooh! That was nothing."
