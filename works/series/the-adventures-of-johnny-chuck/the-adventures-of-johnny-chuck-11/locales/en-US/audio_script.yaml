  chapters:
    - id: ch01
      title: The Greatest Thing in the World
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: These days, Johnny Chuck could hardly stop thinking about his clothes. Yes, Sir, he kept looking at himself and wishing his coat were handsomer. He had never envied Reddy Fox before, but now he envied Reddy's beautiful red coat. His own seemed so plain and dull that no one would look twice. Worse still, it was torn from Johnny's great fight with the old gray Chuck from the Old Pasture. He smoothed every bit of it and brushed it with care, trying his very best to look neat.
        - id: ch01-b02
          speaker: johnny_chuck
          text: "Oh, dear! Why didn't Old Mother Nature give me a handsome coat like Reddy Fox's? Jimmy Skunk has a finer one. So does Happy Jack the Gray Squirrel. Why, almost everyone has a better coat than mine!"
          emotion: sad
        - id: ch01-b03
          speaker: narrator
          text: Now, that was not like Johnny Chuck at all. He had already become unhappy with his house and given it to Jimmy Skunk. This time, it was his clothes that bothered him. What had come over Johnny? He could not have told you. At least, he would not have admitted that he could.
        - id: ch01-b04
          speaker: narrator
          text: But deep in his heart, Johnny had one great wish. He wanted Polly Chuck to admire him. Yes, Sir, that was it! And Johnny thought she would admire him much more if he had fine clothes. He had not yet learned something Peter Rabbit had learned long ago. Fine clothes may catch someone's eye for a moment, but fine deeds win love everywhere.
        - id: ch01-b05
          speaker: narrator
          text: No matter how long Johnny wished for a handsome suit, one never appeared. All he could do was make his old coat look its best. Once that was done, he set out to look for Polly Chuck.
        - id: ch01-b06
          speaker: narrator
          text: Some days, Polly paid no attention to Johnny. On others, he spotted her peeking shyly from behind a clump of grass. Then Johnny made himself look terribly important. He would strut this way and that, pretending he owned the Green Meadows.
        - id: ch01-b07
          speaker: narrator
          text: Polly sometimes hid, then scampered off as soon as Johnny found her. Other times, she treated him as sweetly as anyone could. Together, they had a wonderful time searching for sweet clover and all sorts of tasty things. On those happy outings, Johnny's heart felt ready to burst.
        - id: ch01-b08
          speaker: narrator
          text: Before this, Johnny had meant to drive Polly out of the Green Meadows, the same way he drove out the old gray Chuck. He did not want that anymore. Now he worried that she might leave. The very thought made his heart sink. Each time it troubled him, he rushed away to find Polly and be certain she had not gone.
        - id: ch01-b09
          speaker: narrator
          text: Beside Polly, Johnny felt bigger, stronger, and braver than ever. If only he had a chance to prove his courage to her! Polly was very timid, and the smallest things could frighten her. Johnny did not mind. Every little fright was another chance for him to keep her safe.
        - id: ch01-b10
          speaker: narrator
          text: Whenever they were apart, Johnny hunted for fresh patches of sweet clover where he could take Polly. In the beginning, she went only after he coaxed and coaxed her. Soon that changed. She came without any coaxing, and seemed just as delighted by Johnny's company as he was by hers.
        - id: ch01-b11
          speaker: narrator
          text: Day by day, Johnny Chuck became happier. Never in his whole life had he felt anything like it.
        - id: ch01-b12
          speaker: narrator
          text: You see, Johnny Chuck had found the greatest thing in the world. Do you know what it is? It is called love.
