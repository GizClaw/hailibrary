audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖亲切，带着轻快而含蓄的幽默
        timbre: 清亮柔和
        pace: 舒缓而有变化
        pitch: 中等
    johnny_chuck:
      display_name: 土拨鼠强尼
      tts:
        delivery: 朴实直爽，偶尔带一点不耐烦
        timbre: 浑厚温暖
        pace: 中等
        pitch: 中低
    polly_chuck:
      display_name: 土拨鼠波莉
      tts:
        delivery: 温柔腼腆，说话小心而真诚
        timbre: 轻柔清甜
        pace: 稍慢
        pitch: 中高
  chapters:
    - id: ch01
      title: 第十一章　世上最伟大的东西
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 土拨鼠强尼开始为自己的衣裳操心了。真的，他花了好多时间琢磨自己的模样，一心盼着能有一件更漂亮的外套。平生头一回，他甚至羡慕起红狐雷迪那身漂亮的红毛来。雷迪一直为那身毛骄傲，强尼却觉得自己的毛又朴素又暗淡，根本不会有人多看一眼。
        - id: ch01-b02
          speaker: narrator
          text: 再说，强尼刚跟那只从老牧场下来的灰色老土拨鼠狠狠打过一架，身上的毛都弄破了。他把毛抚平，又仔仔细细刷了一遍，使出自己知道的全部办法，想让自己显得整洁又神气。
        - id: ch01-b03
          speaker: johnny_chuck
          text: “唉，大自然老妈妈为什么不给我一件像红狐雷迪那样漂亮的外套呢？再看看臭鼬吉米、灰松鼠快乐杰克，还有……哎呀，差不多谁的衣裳都比我的好看！”
          emotion: sad
        - id: ch01-b04
          speaker: narrator
          text: 这可一点儿也不像平日的强尼。他先是嫌自己的家不好，把家让给了臭鼬吉米。现在，他又嫌起自己的衣裳来了。强尼究竟怎么啦？连他自己都说不清。至少，就算心里明白，他也不肯承认。
        - id: ch01-b05
          speaker: narrator
          text: 其实，他心底藏着一个强烈的愿望。他希望土拨鼠波莉能欣赏自己。没错，就是这么回事。强尼觉得，要是穿得漂亮些，波莉一定会更喜欢他。可他还不懂长耳兔彼得早就明白的道理。
        - id: ch01-b06
          speaker: narrator
          text: 华服只能招来匆匆一瞥，善行才会赢得上下喜爱。
        - id: ch01-b07
          speaker: narrator
          text: 强尼盼了又盼，多希望自己也有一套漂亮衣裳。可他没有，怎么盼也不会凭空变出一套来。他只好把身上这一套尽量收拾好，然后动身去找波莉。
        - id: ch01-b08
          speaker: narrator
          text: 有时候，波莉根本不理他。有时候，她会藏在一丛草后面，羞答答地偷看他。强尼一发现，就赶紧摆出一副了不起的样子。他昂首阔步地走来走去，好像整片绿草地真是他的一样。
        - id: ch01-b09
          speaker: narrator
          text: 有时候，波莉会躲着强尼。等强尼找到她，她又跑开。可另一些时候，她待强尼好得不能再好。他们会快快活活地一起找香甜的三叶草，也找其他好吃的东西。每逢这时候，强尼的心里都盛满了幸福，满得简直快要撑破了。
        - id: ch01-b10
          speaker: narrator
          text: 强尼曾经一心想把灰色老土拨鼠赶出绿草地。可对波莉，他不但不想赶走，反而担心她不会留下。每次想到波莉可能离开，他的心就一直往下沉。他总要马上跑去找她，亲眼看见她还在，才能放下心来。
        - id: ch01-b11
          speaker: narrator
          text: 只要待在波莉身边，强尼就觉得自己又高大，又强壮，还特别勇敢。他巴不得马上有个机会，好让波莉看看自己究竟有多勇敢。
        - id: ch01-b12
          speaker: narrator
          text: 波莉的胆子很小，一丁点儿动静都能吓着她。强尼倒很高兴她是这样，因为这么一来，他就有机会保护她了。
        - id: ch01-b13
          speaker: narrator
          text: 不陪着波莉的时候，强尼就到处寻找新长出来的香甜三叶草，准备带她去吃。起初，他非得好说歹说半天，波莉才肯跟着去。可过了一阵子，强尼再也不用劝了。看起来，波莉也像强尼喜欢陪着她那样，喜欢陪着强尼。
        - id: ch01-b14
          speaker: narrator
          text: 土拨鼠强尼就这样越来越快乐，比他这一辈子任何时候都要快乐。你瞧，他已经找到了世上最伟大的东西。你知道那是什么吗？它的名字叫作爱。
