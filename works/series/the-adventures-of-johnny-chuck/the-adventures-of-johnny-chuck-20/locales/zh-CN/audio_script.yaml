audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖亲切，带着轻快而含蓄的幽默
        timbre: 清亮柔和
        pace: 舒缓而有变化
        pitch: 中等
    sammy_jay:
      display_name: 松鸦萨米
      tts:
        delivery: 机灵活泼，话里常藏着恶作剧的得意
        timbre: 清脆明亮
        pace: 稍快
        pitch: 中高
  chapters:
    - id: ch01
      title: 美丽的春日清晨
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 这是一个美丽的早晨。圆滚滚、红彤彤的太阳先生早早掀开被子，带着最灿烂的笑容，一点点爬上天空。
        - id: ch01-b02
          speaker: narrator
          text: 老西风妈妈已经把沿途的云彩扫得一干二净。她的孩子们，也就是那些快乐小微风，跳着舞穿过绿草地，一直来到老果园。
        - id: ch01-b03
          speaker: narrator
          text: 小微风抓起苹果花白色和粉色的花瓣，互相丢着玩。花瓣越落越多，铺了满满一地。每棵苹果树都像一大束盛开的鲜花。这个春天的早晨，真是美极了。
        - id: ch01-b04
          speaker: narrator
          text: 松鸦萨米也起得很早，只比太阳先生和老西风妈妈晚了一点儿。早饭刚咽下去，他便飞向老果园，藏进白白粉粉的苹果花里，等着土拨鼠强尼露面。
        - id: ch01-b05
          speaker: narrator
          text: 萨米已经看出来了，强尼藏着一个秘密。那个秘密让强尼骄傲极了，可它究竟是什么，萨米连一点儿也猜不着。
        - id: ch01-b06
          speaker: narrator
          text: 别人有秘密，自己却打听不出来，再没有什么比这更让萨米难受了。他只好一动不动地待在花丛里，耐着性子等呀，看呀。
    - id: ch02
      title: 强尼为什么这样小心
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 过了一会儿，强尼终于走上门阶。他兴奋得很，身子挺得笔直，一会儿看看这边，一会儿瞧瞧那边。
        - id: ch02-b02
          speaker: narrator
          text: 强尼又抬头望向苹果树。萨米吓得屏住呼吸，生怕被他发现。幸好花朵把萨米遮得严严实实。强尼的眼睛再亮，也没瞧见他。
        - id: ch02-b03
          speaker: narrator
          text: 强尼还是不放心。他竟然爬上老石墙，想站得高些，看得远些。他坐在那里望了好半天，还在不停地四处打量。
        - id: ch02-b04
          speaker: narrator
          text: 萨米等得越来越不耐烦。
        - id: ch02-b05
          speaker: sammy_jay
          text: “他今天怎么这么警惕？我以前可没见他这样小心过。到底是怎么回事？”
        - id: ch02-b06
          speaker: narrator
          text: 又过了一阵，强尼总算认定周围没有别人。他跳下石墙，飞快地跑到新房门口，朝屋里叽叽咕咕地说起话来。
        - id: ch02-b07
          speaker: narrator
          text: 萨米把脖子伸得老长，伸到发疼，也没能听清一个字。谁叫强尼把脑袋探进门里去了呢。
    - id: ch03
      title: 门里探出的脑袋
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 没多久，强尼倒退着从门里钻出来，直起身子坐好。瞧他那副模样，又骄傲，又神气。
        - id: ch03-b02
          speaker: narrator
          text: 接着，萨米看到了一样东西，惊得差点儿喘不过气来。土拨鼠波莉的脑袋，从门里探了出来！萨米以前从没见过她。
        - id: ch03-b03
          speaker: sammy_jay
          text: “原来强尼有了伴侣，我却什么都不知道！这一定就是他的秘密。难怪他最近总是那么骄傲！”
          emotion: surprised
        - id: ch03-b04
          speaker: narrator
          text: 波莉走到门阶上，挨着强尼坐了起来。她和强尼一样骄傲，却又非常不安。她学着强尼刚才的样子，朝这边看看，又朝那边瞧瞧。
        - id: ch03-b05
          speaker: narrator
          text: 随后，波莉把脑袋探进门里，用最轻柔的声音呼唤着。
        - id: ch03-b06
          speaker: narrator
          text: 才过了一会儿，门里竟又探出一颗脑袋。萨米惊讶得险些失去平衡。那颗脑袋长得和强尼一模一样，只是小得不能再小。
        - id: ch03-b07
          speaker: narrator
          text: 紧接着，又探出一颗。然后，又是一颗！波莉一直轻声说着话。强尼却把胸脯越挺越高，看上去简直要被满心的骄傲胀破了。
    - id: ch04
      title: 秘密不再是秘密
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 萨米终于明白了。怪不得强尼这几天一直那么骄傲，原来他有了自己的家，还有了三个孩子！
        - id: ch04-b02
          speaker: narrator
          text: 三只土拨鼠宝宝并排坐在门阶上，都在学强尼的样子，努力想把身子直起来。萨米低头一看，觉得他们实在太滑稽了。
        - id: ch04-b03
          speaker: narrator
          text: 他完全忘了自己还躲在树上，忍不住放声大笑。笑声刚一响起，波莉和三只宝宝转眼便全躲回了屋里。
        - id: ch04-b04
          speaker: narrator
          text: 强尼气冲冲地抬头望去。他知道，自己的秘密再也不是秘密了。
