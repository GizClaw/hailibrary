audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm, lively storytelling with a gentle sense of wonder
        timbre: clear and rounded
        pace: measured
        pitch: medium
    johnny_chuck:
      display_name: Johnny Chuck
      tts:
        delivery: plainspoken, friendly, and a little gruff when bothered
        timbre: warm and earthy
        pace: relaxed
        pitch: medium-low
    sammy_jay:
      display_name: Sammy Jay
      tts:
        delivery: quick, curious, and openly delighted by a secret
        timbre: bright and crisp
        pace: brisk
        pitch: medium-high
  chapters:
    - id: ch01
      title: Sammy Jay Understands
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: It was a beautiful spring morning. Jolly, round, red Mr. Sun had thrown off his bedclothes early and begun climbing the sky with his broadest smile. Old Mother West Wind had swept every cloud from his path. Her children, the Merry Little Breezes, danced across the Green Meadows to the old orchard. There they pelted one another with pink and white apple blossoms until petals covered the ground. Every apple tree looked like one enormous bouquet. Yes, it truly was a beautiful morning.
        - id: ch01-b02
          speaker: narrator
          text: Sammy Jay was up almost as early as Mr. Sun and Old Mother West Wind. The moment he finished breakfast, he flew to the old orchard. Then he tucked himself among the pink and white blossoms and watched for Johnny Chuck. Sammy knew Johnny had a secret, and that secret had filled Johnny with pride. But Sammy couldn't guess what it was. Nothing bothered him more than knowing someone else's secret was still hidden from him. So he kept perfectly still among the blossoms. He waited, and he watched.
        - id: ch01-b03
          speaker: narrator
          text: After a while, Johnny Chuck came to his doorstep. He seemed terribly excited. Johnny sat up straight and looked one way, then the other. When he searched the apple trees, Sammy held his breath. He was afraid Johnny might spot him. But the blossoms hid Sammy so well that even Johnny's bright eyes missed him. Johnny climbed onto the old stone wall for a better view. He stayed there a long time, turning and searching from his high seat on the wall. Again and again, he looked all around.
        - id: ch01-b04
          speaker: narrator
          text: Sammy began to lose his patience. He muttered to himself.
        - id: ch01-b05
          speaker: sammy_jay
          text: "He's being awfully watchful this morning. I've never seen him watch like this before. What can he be doing?"
        - id: ch01-b06
          speaker: narrator
          text: At last, Johnny seemed sure that no one was nearby. He hopped down from the wall and scampered to the doorway of his new house. There he began to chatter. Sammy stretched his neck until it hurt, trying to catch Johnny's words. But Johnny had his head inside the doorway, so Sammy couldn't hear a thing.
        - id: ch01-b07
          speaker: narrator
          text: Soon Johnny backed out and sat up. He looked very proud and important. Then Sammy saw something that almost took his breath away. Polly Chuck's head was peeping through the doorway. Sammy had never seen her before.
        - id: ch01-b08
          speaker: sammy_jay
          text: "Why, Johnny Chuck must have a mate, and I never knew! So that's his secret. That's why he's been acting so proud lately!"
          emotion: surprised
        - id: ch01-b09
          speaker: narrator
          text: Polly came out and sat on the doorstep. She looked every bit as proud as Johnny, but she also seemed terribly anxious. She sat up beside him and searched all around, just as he had. Then she leaned her head into the doorway and called in the softest voice.
        - id: ch01-b10
          speaker: narrator
          text: A minute later, Sammy saw something else. The surprise nearly made him lose his balance. Another head was peeping from the doorway. It looked just like Johnny Chuck's head, only teeny-weeny. Sammy watched as the three tiny heads came into view, one after another. Polly kept speaking softly while Johnny puffed himself up with pride until he looked ready to burst.
        - id: ch01-b11
          speaker: narrator
          text: Now Sammy understood why Johnny had been so proud for the past few days. Johnny Chuck had a family! Sammy looked down at the three little Chucks on the doorstep. They were trying to sit up exactly as Johnny did, and they looked so funny that Sammy forgot all about hiding and laughed aloud.
        - id: ch01-b12
          speaker: narrator
          text: In a flash, Polly and all three little Chucks vanished inside the house. Johnny looked up angrily. He knew his secret was a secret no longer.
