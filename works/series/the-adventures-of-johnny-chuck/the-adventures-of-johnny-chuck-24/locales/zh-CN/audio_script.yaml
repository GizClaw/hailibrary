audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖亲切，带着轻快而含蓄的幽默
        timbre: 清亮柔和
        pace: 舒缓而有变化
        pitch: 中等
    sammy_jay:
      display_name: 松鸦萨米
      tts:
        delivery: 机灵响亮，语气敏捷而略带顽皮
        timbre: 清脆明亮
        pace: 偏快而灵活
        pitch: 中高
    farmer_browns_boy:
      display_name: 布朗农夫的男孩
      tts:
        delivery: 朴实自然，带着少年人的好奇
        timbre: 清朗温和
        pace: 中等
        pitch: 中等
  chapters:
    - id: ch01
      title: 石墙边的新功课
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 松鸦萨米很久没有这么快活了。布朗农夫的老果园里开着一所滑稽的小学校，他一堂课接一堂课地看着，觉得比什么都有趣，怎么也舍不得离开。土拨鼠强尼在教三个宝宝学习每只小土拨鼠都非会不可的本领，好让他们平安长大。
        - id: ch01-b02
          speaker: narrator
          text: 孩子们先学会了立刻听话，不能等着问为什么，也记住了危险临近时的各种信号。于是，强尼开始带他们越走越远。他领着孩子们沿老石墙往前，教他们在石缝里寻找安全的藏身处。
        - id: ch01-b03
          speaker: narrator
          text: 走到离石墙稍远的地方，强尼忽然发出危险信号。三个小家伙赶紧奔回石墙，转眼就钻得无影无踪。那样子真是滑稽极了。
        - id: ch01-b04
          speaker: narrator
          text: 头一回，两个宝宝偏要往同一个洞里挤。他们谁也不肯让谁先进，很快就发起脾气，打成一团。他们早忘了，要是真有危险在旁边，自己准会遭殃。强尼狠狠训了他们一顿，又叫他们从头练了一遍。
    - id: ch02
      title: 狐狸的脚印与天上的鹰
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 有一回，强尼在松软的泥土上发现了小狐狸雷迪夜里留下的脚印。他叫三个宝宝挨个闻一闻，再把雷迪和老狐狸奶奶的事讲给他们听。那两个家伙又聪明又狡猾，还最喜欢拿鲜嫩的小土拨鼠当晚餐。
        - id: ch02-b02
          speaker: narrator
          text: 三个宝宝闻到雷迪的气味，都打起了哆嗦，连脊背上的毛也根根竖了起来。那模样实在有趣。
        - id: ch02-b03
          speaker: narrator
          text: 接着，强尼把他们带到老果园边上，让他们探头望向绿草地。老白尾沼泽鹰正在草地上空来回翱翔。强尼指给孩子们看，还告诉他们，自己小时候有一次离家出走，差点儿就被老白尾捉住了。
        - id: ch02-b04
          speaker: narrator
          text: 他又讲起布朗农夫的男孩、猎犬鲍泽，还有许许多多小土拨鼠要平安长大就应该知道的事情。
    - id: ch03
      title: 再警觉也会有意外
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 强尼教课的时候，始终万分警觉地提防着危险。他常常发出信号，让大家紧贴草地趴下，一动也不动。有时，他们也会沿着强尼踩出的小路，飞快跑回老苹果树下那个舒适安稳的家。
        - id: ch03-b02
          speaker: narrator
          text: 可再警觉的人，也有猝不及防的时候。
        - id: ch03-b03
          speaker: narrator
          text: 一天早晨，强尼带着三个宝宝走得比平常更远。偏偏这时，布朗农夫的男孩忽然想去老果园看看。果园里的草已经长得很高，就算强尼把身子坐得再直，也不一定能越过草尖看清外面。这一次，他没有发现那个男孩正在走来。
    - id: ch04
      title: 萨米作出的选择
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 可松鸦萨米看见了。他正舒舒服服地藏在一棵老苹果树顶上，那双锐利的眼睛立刻闪起了光。现在可有热闹看啦！说不定那个男孩会捉住一个土拨鼠宝宝。萨米仿佛已经看见强尼和三个孩子吓坏的模样，乐得简直要抱紧自己。他最爱看的，就是别人倒霉。
        - id: ch04-b02
          speaker: narrator
          text: 可他随即想起，看三个宝宝上课给自己带来了多少乐趣。一想到他们可能出事，萨米忽然浑身不自在。他几乎没来得及多想，就扯开嗓门喊了起来。
        - id: ch04-b03
          speaker: sammy_jay
          text: 土拨鼠强尼，快跑！布朗农夫的男孩来啦！
        - id: ch04-b04
          speaker: narrator
          text: 强尼拔腿就跑。他没有停下问话，甚至连看也没看，马上让三个宝宝跑在前面，自己在后头轻咬他们的脚跟，催他们快一点。就在最后一刻，他们赶回了远处角落那棵老苹果树下的小屋。
    - id: ch05
      title: 松鸦并不全坏
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 布朗农夫的男孩只来得及看见他们消失。接着，他望见萨米朝绿森林飞去，一边飞，一边大叫。
        - id: ch05-b02
          speaker: sammy_jay
          text: 有小偷！有小偷！
        - id: ch05-b03
          speaker: narrator
          text: 男孩若有所思地挠了挠头。
        - id: ch05-b04
          speaker: farmer_browns_boy
          text: 那只松鸦是不是故意给那些土拨鼠报信呢？
        - id: ch05-b05
          speaker: narrator
          text: 要是兔子彼得在场，他就能告诉男孩，萨米确实是故意的。彼得对萨米和他的种种把戏知道得一清二楚。可彼得不在那里。
        - id: ch05-b06
          speaker: narrator
          text: 说起来，彼得正忙着做自己一生中最傻的一件事，那就是设法给自己改名字。你可以在《棉尾兔彼得历险记》里读到事情的来龙去脉。你瞧，要讲完彼得和他干的那些事，非得用整整一本书不可。
