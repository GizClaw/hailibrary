  chapters:
    - id: ch01
      title: Sammy Jay Proves That He Is Not All Bad
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Sammy Jay hadn't enjoyed himself this much in a long while. In Farmer Brown's old orchard, Johnny Chuck was running a funny little school for his three baby Chucks. He was teaching them everything a little Chuck needed to know in order to grow into a big one. First, they learned to obey without stopping to ask why. Then they learned the signals that told them exactly what to do whenever danger came near. Once they knew those lessons, Johnny began taking them farther and farther from home.
        - id: ch01-b02
          speaker: narrator
          text: Johnny led them beside the old stone wall and showed them where they could hide safely among the stones. Then he took them a short distance away and suddenly sounded the danger signal. The three little Chucks went racing back to the wall and wriggled out of sight. Watching them was very funny indeed.
        - id: ch01-b03
          speaker: narrator
          text: On their first try, two of the little Chucks rushed for the very same hole. Each one was in such a hurry that neither would let the other enter first. They both grew angry and started fighting over it. They had completely forgotten that real danger would surely catch them while they quarreled. Johnny gave those two a tremendous scolding. Then he made them do the whole lesson again.
        - id: ch01-b04
          speaker: narrator
          text: Another time, Johnny found a footprint in some soft earth. Reddy Fox had left it there during the night. Johnny made each little Chuck sniff the track. As they did, he told them about Reddy and old Granny Fox. Both foxes were clever and sly, he warned, and both were very, very fond of having tender young Chucks for dinner.
        - id: ch01-b05
          speaker: narrator
          text: All three little Chucks shivered when they smelled Reddy's track. The hair rose along their backs in the funniest way.
        - id: ch01-b06
          speaker: narrator
          text: Next, Johnny took them to the edge of the old orchard, where they could peek across the Green Meadows. He showed them old Whitetail the Marshhawk, sailing back and forth above the grass. Johnny told them that when he was a little Chuck, he had once run away from home, and old Whitetail had almost caught him. He taught them about Farmer Brown's boy and Bowser the Hound too, along with many other things every little Chuck ought to know.
        - id: ch01-b07
          speaker: narrator
          text: Through every lesson, Johnny kept the sharpest possible watch for danger. Many times, he gave the danger signal. The little Chucks would flatten themselves in the grass and lie perfectly still. Or they would race along the small paths Johnny had made, all the way to the snug home beneath the old apple tree. Still, even the most watchful person can sometimes be surprised.
        - id: ch01-b08
          speaker: narrator
          text: One morning, Johnny led the three little Chucks farther from home than ever before. That same morning, Farmer Brown's boy decided to visit the old orchard. Johnny never saw him coming. The orchard grass had grown so tall that even when Johnny sat up as straight as he possibly could, he couldn't always see above it. And this time, the boy came closer without being seen.
        - id: ch01-b09
          speaker: narrator
          text: Sammy Jay saw him, though. Sammy was sitting in his snug hiding place at the top of an old apple tree. At first, his sharp eyes twinkled. Now there would be some fun! Perhaps Farmer Brown's boy would catch one of the little Chucks. Sammy pictured how frightened Johnny and all three youngsters would be. He hugged himself with delight. You see, Sammy dearly loved watching other people get into trouble.
        - id: ch01-b10
          speaker: narrator
          text: But then Sammy remembered all the fun those three little Chucks had given him while he watched their lessons. All at once, the thought of something happening to them made him uncomfortable. He hardly stopped to think before he screamed as loudly as he could.
        - id: ch01-b11
          speaker: sammy_jay
          text: "Run, Johnny Chuck! Run! Farmer Brown's boy is coming!"
        - id: ch01-b12
          speaker: narrator
          text: Johnny ran. He didn't ask a single question, and he didn't even turn to look. He sent the three little Chucks ahead, then nipped at their heels to make them hurry. They reached the snug house under the old apple tree in the far corner just in time.
        - id: ch01-b13
          speaker: narrator
          text: Farmer Brown's boy arrived just soon enough to see the Chucks disappear. Then he watched Sammy Jay fly toward the Green Forest, crying, "Thief! Thief!" all the way.
        - id: ch01-b14
          speaker: farmer_browns_boy
          text: "I wonder if that jay meant to warn those Chucks."
        - id: ch01-b15
          speaker: narrator
          text: Farmer Brown's boy scratched his head and thought about it.
        - id: ch01-b16
          speaker: narrator
          text: If Peter Rabbit had been there, he could have answered the question. Peter knew all about Sammy Jay and his tricks, and he knew that Sammy had warned the Chucks on purpose. But Peter wasn't there.
        - id: ch01-b17
          speaker: narrator
          text: The truth was, Peter was busy doing the most foolish thing he had ever done. He was trying to change his name. You can read that whole story in The Adventures of Peter Cottontail. It takes an entire book to tell you about Peter and all his doings.
