audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖亲切，带着轻快而含蓄的幽默
        timbre: 清亮柔和
        pace: 舒缓而有变化
        pitch: 中等
    johnny_chuck:
      display_name: 土拨鼠强尼
      tts:
        delivery: 朴实直爽，偶尔带一点不耐烦
        timbre: 浑厚温暖
        pace: 中等
        pitch: 中低
    sammy_jay:
      display_name: 松鸦萨米
      tts:
        delivery: 机灵活泼，话里常藏着恶作剧的得意
        timbre: 清脆明亮
        pace: 稍快
        pitch: 中高
  chapters:
    - id: ch01
      title: 强尼心里的牵挂
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 农夫布朗家的男孩和红狐狸雷迪发现了新房子以后，强尼一直放不下心。房子虽然藏在老果园最偏僻的角落，他还是忍不住担忧。不过，他怕的可不是自己。哎呀，才不是呢！强尼觉得自己又高大又强壮，照顾自己完全不成问题。
        - id: ch01-b02
          speaker: narrator
          text: 他真正放心不下的是波莉。波莉没有他那么高大强壮，有时又不够小心。强尼怕她遇到危险，为这件事着实操了不少心。
        - id: ch01-b03
          speaker: narrator
          text: 好在雷迪白天不敢再来了。猎犬鲍泽上回把他吓得够呛，他哪儿还有胆量露面。到了夜里，雷迪偶尔会溜到门外，饿馋馋地闻来闻去。强尼和波莉却安稳地待在屋里，根本不用怕他。
        - id: ch01-b04
          speaker: narrator
          text: 农夫布朗家的男孩好像也忘记了这所房子。日子一久，强尼渐渐不再担心，因为他心里有了另一件事。那是一个秘密。没错，强尼藏着一个秘密。
    - id: ch02
      title: 萨米猜不透的秘密
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 松鸦萨米几乎每天早晨都飞到老果园。他眼睛尖，很快便看出强尼心里藏着什么。可任凭他怎么打听，也猜不到那个秘密究竟是什么。无论那是什么，只要看看强尼的模样，就知道那一定让他非常快乐。
        - id: ch02-b02
          speaker: narrator
          text: 萨米只知道，这件事让强尼快活极了。强尼常常走到门阶上笑眯眯地坐着，有时还会因为太高兴，吹出一声滑稽的小口哨。
        - id: ch02-b03
          speaker: narrator
          text: 萨米怎么想也想不通。春天本来就是快乐的时节。绿森林很美，绿草地很美，就连老牧场也变得可爱了，大家当然都高兴。可强尼的快乐不只因为春天，萨米认定，那里面一定还有一个不肯告诉别人的秘密。
        - id: ch02-b04
          speaker: narrator
          text: 他翻来覆去地猜，却一点儿头绪也没有。说起来真有趣，萨米光顾着琢磨这件事，竟连出去淘气捣蛋都忘了。
    - id: ch03
      title: 强尼神气地踱起步来
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 一天早晨，强尼出来时，比平常还要快活。他咯咯笑个不停，那是快乐的土拨鼠才会发出的笑声。笑着笑着，他便干起了傻事。
        - id: ch03-b02
          speaker: narrator
          text: 他踢起后脚跟，在草地上滚过来、滚过去，又吹起了口哨。后来，他居然想唱歌。可土拨鼠根本不会唱，也实在不该试着唱。
        - id: ch03-b03
          speaker: narrator
          text: 强尼忽然一骨碌站起来，把外衣仔仔细细地理好，换上一副端端正正的模样。他挺着胸，在门前来回踱步，好像正为什么事情骄傲极了。每迈一步，他都把脚落得神气十足，脑袋也一直昂得高高的。萨米看了半天，终于忍不住了。
        - id: ch03-b04
          speaker: sammy_jay
          text: “强尼，你到底在得意什么？我要是只有你身上那么一件外衣，才不会摆出这副神气样子！”
        - id: ch03-b05
          speaker: narrator
          text: 萨米最得意的，正是自己那身漂亮的蓝白外衣。他只要逮着机会，就爱把它展示给别人看。
        - id: ch03-b06
          speaker: johnny_chuck
          text: “我才不是为了外衣。”
    - id: ch04
      title: 这得由你自己找出来
      blocks:
        - id: ch04-b01
          speaker: sammy_jay
          text: “那你是觉得自己躲进老果园，谁也找不到你，所以特别聪明吗？告诉你吧，我早就发现你了。雷迪、鲍泽，还有农夫布朗家的男孩，也全都知道你住在这里。”
        - id: ch04-b02
          speaker: narrator
          text: 萨米说这些话时，语气别提有多讨厌了。
        - id: ch04-b03
          speaker: johnny_chuck
          text: “也不是为了这个。”
        - id: ch04-b04
          speaker: sammy_jay
          text: “那你究竟为什么这么骄傲？”
        - id: ch04-b05
          speaker: johnny_chuck
          text: “这就得由你自己找出来了。”
        - id: ch04-b06
          speaker: johnny_chuck
          text: “骄傲有愚蠢，也有荒唐和卑微。唯有坦荡的骄傲，才是我要的光辉。”
        - id: ch04-b07
          speaker: narrator
          text: 说完，土拨鼠强尼转身钻进新房子，不见了。
