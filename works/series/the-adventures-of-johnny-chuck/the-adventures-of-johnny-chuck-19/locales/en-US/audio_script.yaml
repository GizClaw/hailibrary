audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm, lively storytelling with a gentle sense of wonder
        timbre: clear and rounded
        pace: measured
        pitch: medium
    johnny_chuck:
      display_name: Johnny Chuck
      tts:
        delivery: good-natured, thoughtful, and quick to brighten with discovery
        timbre: warm and youthful
        pace: moderate
        pitch: medium
    sammy_jay:
      display_name: Sammy Jay
      tts:
        delivery: sharp, nosy, and quick with a teasing remark
        timbre: bright and piercing
        pace: brisk
        pitch: medium-high
  chapters:
    - id: ch01
      title: Johnny Chuck's Pride
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Ever since Farmer Brown's boy and Reddy Fox found the new house in the far corner of the old orchard, Johnny Chuck had been worried. He was not afraid for himself. Oh, my, no! Johnny felt quite able to look after himself. It was Polly Chuck he feared for. Polly was not as big and strong as Johnny, and she could be careless. For a while, he worried a great deal about what might happen to her.
        - id: ch01-b02
          speaker: narrator
          text: But Reddy Fox did not return during the day. Bowser the Hound had frightened him so badly that he did not dare. Reddy sometimes crept over at night and sniffed hungrily around Johnny's doorway. Johnny and Polly were safe inside, though, so that did not bother them at all. Farmer Brown's boy seemed to have forgotten the new house, too. Before long, Johnny worried much less.
        - id: ch01-b03
          speaker: narrator
          text: The truth was, Johnny had something else on his mind. He had a secret. Yes, Sir, Johnny Chuck had a secret.
        - id: ch01-b04
          speaker: narrator
          text: Sammy Jay flew to the old orchard nearly every morning. His sharp eyes soon told him that Johnny was hiding something, but no matter how hard Sammy tried, he could not discover what it was. Whatever the secret might be, it made Johnny wonderfully happy. Johnny would step outside, stand on his doorstep smiling, and sometimes let out a funny little whistle simply because he felt so joyful.
        - id: ch01-b05
          speaker: narrator
          text: Sammy could not understand it. Why should Johnny be happier than usual? Of course, it was a joyful time of year. Spring had come, and everyone was happy. The Green Forest and the Green Meadows were beautiful, and so was the Old Pasture. Still, Sammy felt certain there was more to it. Johnny had some private secret that filled him with happiness, and Sammy could not imagine what it might be. He spent so long wondering about it that, for once, he had no time to get into mischief.
        - id: ch01-b06
          speaker: narrator
          text: One morning, Johnny came out looking happier than ever. He chuckled the way only a happy Chuck can chuckle. Then he began acting very foolishly. He kicked up his heels and rolled over and over in the grass. He whistled. He even tried to sing, though no Chuck can sing, and no Chuck ought to try.
        - id: ch01-b07
          speaker: narrator
          text: All at once, Johnny jumped to his feet. He brushed his coat with great care and tried his best to look dignified. Then he strutted back and forth before his doorway as though he had something to be very proud of. Pride showed in every step he took and in the way he carried his head. At last, Sammy Jay could stand it no longer.
        - id: ch01-b08
          speaker: sammy_jay
          text: "What makes you so proud, Johnny Chuck? If my coat looked no better than yours, I certainly wouldn't strut around like that!"
        - id: ch01-b09
          speaker: narrator
          text: Sammy spoke in his harshest voice. He was very proud of his own handsome blue-and-white coat, and he loved showing it off.
        - id: ch01-b10
          speaker: johnny_chuck
          text: That isn't what I'm proud of.
        - id: ch01-b11
          speaker: sammy_jay
          text: "Well, maybe you think you're clever because you hid yourself here in the old orchard. I found you long ago! So did Reddy Fox, Bowser the Hound, and Farmer Brown's boy."
        - id: ch01-b12
          speaker: narrator
          text: Sammy gave him the most disagreeable sneer.
        - id: ch01-b13
          speaker: johnny_chuck
          text: That isn't it, either.
        - id: ch01-b14
          speaker: sammy_jay
          text: Then what are you so proud of?
        - id: ch01-b15
          speaker: johnny_chuck
          text: You'll have to find that out for yourself.
        - id: ch01-b16
          speaker: johnny_chuck
          text: "There's foolish pride and silly pride and pride of low degree. A better pride is honest pride, and that's the pride for me."
        - id: ch01-b17
          speaker: narrator
          text: And with that, Johnny Chuck disappeared into his new house.
