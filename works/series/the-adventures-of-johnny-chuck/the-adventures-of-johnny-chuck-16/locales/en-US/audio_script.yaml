audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm, lively storytelling with a gentle sense of wonder
        timbre: clear and rounded
        pace: measured
        pitch: medium
    sammy_jay:
      display_name: Sammy Jay
      tts:
        delivery: pert, clever, and delighted by mischief
        timbre: bright and crisp
        pace: quick
        pitch: medium-high
    reddy_fox:
      display_name: Reddy Fox
      tts:
        delivery: sly, playful, and always ready to tease
        timbre: sharp and bright
        pace: brisk
        pitch: medium
  chapters:
    - id: ch01
      title: Sammy Jay Plans Mischief
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Mischief may not set out to be truly bad, but somehow it always seems to make someone sad. It does something mean and unpleasant, then tries to call it fun. And when the trouble begins, away it runs.
        - id: ch01-b02
          speaker: narrator
          text: No one in the Green Forest or on the Green Meadows loved mischief more than Sammy Jay. Sometimes it seemed that the pert little cap on his head covered more mischief than all the other little people's heads put together. If Sammy wasn't making trouble, he was busy planning it. Mischief had become a habit with him, and bad habits have a way of growing and growing.
        - id: ch01-b03
          speaker: narrator
          text: Sammy had no quarrel at all with Johnny Chuck. Oh, no! If anyone had asked him, he would have said that he liked Johnny. Everyone liked Johnny Chuck. Even so, the moment Sammy found Johnny's new house, he began thinking of ways to tease him. Sammy didn't truly want anything bad to happen to Johnny. He only wanted to make him uncomfortable. To Sammy, watching someone else squirm was his idea of fun.
        - id: ch01-b04
          speaker: narrator
          text: So Sammy slipped away to a thick hemlock tree in the Green Forest. He sat there trying to dream up a plan that would bother Johnny Chuck.
        - id: ch01-b05
          speaker: narrator
          text: Of course, Sammy knew that Johnny had hidden his new home in a corner of Farmer Brown's old orchard because he wanted to keep it secret. Sammy didn't know why Johnny wanted secrecy, and he didn't care. The fact that it was a secret was enough. Telling everyone about it would be great fun. Sammy was wondering whom to tell first when he saw Reddy Fox trotting down the Lone Little Path.
        - id: ch01-b06
          speaker: sammy_jay
          text: "Hello there, Reddy Fox!"
        - id: ch01-b07
          speaker: narrator
          text: Reddy looked up.
        - id: ch01-b08
          speaker: reddy_fox
          text: "Hello, Sammy Jay! What are you thinking about this morning?"
        - id: ch01-b09
          speaker: sammy_jay
          text: "Oh, nothing much. Have you heard any news?"
        - id: ch01-b10
          speaker: narrator
          text: Reddy grinned.
        - id: ch01-b11
          speaker: reddy_fox
          text: "There isn't any news. I was about to ask you the same question."
        - id: ch01-b12
          speaker: narrator
          text: Now Sammy grinned, too.
        - id: ch01-b13
          speaker: sammy_jay
          text: "As if I could ever tell you something new, Reddy Fox! Everyone knows you're so clever that you hear about things the moment they happen."
        - id: ch01-b14
          speaker: narrator
          text: Reddy felt very flattered. People who spend plenty of time flattering others are often the easiest ones to flatter, if you know how. Reddy tried hard to look modest. But no one liked being thought clever and important more than he did. He was greatly pleased that Sammy seemed to think Reddy already knew every piece of news. Sammy understood him perfectly. He chuckled to himself while Reddy went on pretending to be modest.
        - id: ch01-b15
          speaker: sammy_jay
          text: "Have you visited Johnny Chuck at his new home yet?"
        - id: ch01-b16
          speaker: narrator
          text: Sammy asked the question as casually as he could.
        - id: ch01-b17
          speaker: reddy_fox
          text: "Not yet, but I'm going to visit him soon."
        - id: ch01-b18
          speaker: narrator
          text: Reddy spoke as though he knew all about Johnny's new home. In truth, he had not the slightest idea in the world where it was. He had searched and searched without finding a single trace. Sammy knew perfectly well that Reddy didn't know, but he gave no sign of it.
        - id: ch01-b19
          speaker: sammy_jay
          text: "I happened to be in Farmer Brown's old orchard this morning, so I stopped to see Johnny. By the way, he thinks you don't know where he lives now."
        - id: ch01-b20
          speaker: narrator
          text: Sammy chuckled when he saw Reddy's ears prick up.
        - id: ch01-b21
          speaker: reddy_fox
          text: "Huh! Johnny Chuck couldn't fool me. Well, I'd better be going. Good-bye, Sammy Jay."
        - id: ch01-b22
          speaker: narrator
          text: Reddy trotted toward the Green Meadows. But as soon as Sammy could no longer see him, he turned toward Farmer Brown's old orchard. That was exactly what Sammy had expected him to do.
        - id: ch01-b23
          speaker: sammy_jay
          text: "It looks as though Johnny Chuck will have a visitor."
        - id: ch01-b24
          speaker: narrator
          text: Sammy chuckled and started off to find Jimmy Skunk.
