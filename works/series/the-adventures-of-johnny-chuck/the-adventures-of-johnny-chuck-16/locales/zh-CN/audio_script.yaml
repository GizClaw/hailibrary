audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖亲切，带着轻快而含蓄的幽默
        timbre: 清亮柔和
        pace: 舒缓而有变化
        pitch: 中等
    sammy_jay:
      display_name: 松鸦萨米
      tts:
        delivery: 机灵活泼，话里常藏着恶作剧的得意
        timbre: 清脆明亮
        pace: 稍快
        pitch: 中高
    reddy_fox:
      display_name: 红狐狸雷迪
      tts:
        delivery: 狡黠轻快，带着不怀好意的亲热
        timbre: 尖细而灵活
        pace: 稍快
        pitch: 中高
  chapters:
    - id: ch01
      title: 淘气的坏习惯
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 淘气也许不是真心要使坏，可不知为什么，它总让别人难过起来。它做了刻薄又讨厌的事，还硬把这当成好玩的笑话。等它惹出了麻烦，唉，自己却早已逃得没影了。
        - id: ch01-b02
          speaker: narrator
          text: 住在绿森林和绿草地上的小居民里，谁也没有松鸦萨米那么淘气。他那顶神气的小帽子下面，藏着数不清的坏点子，简直比草地和森林里其他所有小居民脑袋里的坏点子加在一起还多。萨米要是没在淘气，就一定在想下一次怎么淘气。这已经成了习惯，而坏习惯总会越长越厉害。
        - id: ch01-b03
          speaker: narrator
          text: 萨米和土拨鼠强尼没有任何过节。哎呀，真是一点儿也没有！要是有人问起来，他还会告诉你，自己挺喜欢强尼。大家不都喜欢强尼吗？可萨米一发现强尼的新房子，立刻就想捉弄他。萨米没想伤害强尼，只想让他不舒服。因为在萨米眼里，看别人不舒服，就是一种乐趣。
        - id: ch01-b04
          speaker: narrator
          text: 于是，他悄悄飞到绿森林里一棵浓密的铁杉树上，开始琢磨怎么让强尼不得安生。
    - id: ch02
      title: 孤零零的小径上
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 萨米知道，强尼把新家藏在农夫布朗家老果园的角落里，就是想保守秘密。他不知道强尼为什么要保密，也不在乎。他只觉得，强尼越想瞒着大家，把秘密说出去就越有意思。
        - id: ch02-b02
          speaker: narrator
          text: 萨米正想着该先告诉谁，忽然看见红狐狸雷迪沿着孤零零的小径跑了过来。
        - id: ch02-b03
          speaker: sammy_jay
          text: “嗨，红狐狸雷迪！”
        - id: ch02-b04
          speaker: narrator
          text: 雷迪抬头看了看。
        - id: ch02-b05
          speaker: reddy_fox
          text: “你好啊，松鸦萨米！今天一早，你又在琢磨什么呢？”
        - id: ch02-b06
          speaker: sammy_jay
          text: “没什么要紧的。你听到什么新鲜事了吗？”
        - id: ch02-b07
          speaker: narrator
          text: 雷迪咧开嘴笑了。
        - id: ch02-b08
          speaker: reddy_fox
          text: “今天哪有什么新闻。我刚才还想问你呢。”
    - id: ch03
      title: 萨米的奉承话
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 这回，萨米也咧嘴笑了。
        - id: ch03-b02
          speaker: sammy_jay
          text: “我怎么可能有消息告诉你呀，红狐狸雷迪！我哪会有什么消息能告诉你！谁不知道你聪明得很？不管发生什么，你马上就全打听清楚了。”
        - id: ch03-b03
          speaker: narrator
          text: 这几句奉承话，雷迪听着可受用了。说来也怪，越爱奉承别人的家伙，只要你说对了话，往往越容易被人奉承。雷迪装得十分谦虚，可他最喜欢别人夸自己聪明又重要。听萨米说，自己厉害得根本不需要别人告诉他新闻，雷迪别提多得意了。
        - id: ch03-b04
          speaker: narrator
          text: 萨米早就看透了雷迪。他瞧着雷迪假装谦虚，心里偷偷地笑，然后故意用平常得不能再平常的口气问了一句。
        - id: ch03-b05
          speaker: sammy_jay
          text: “你去强尼的新家看过他了吗？”
        - id: ch03-b06
          speaker: reddy_fox
          text: “还没去。不过，我很快就会去的。”
        - id: ch03-b07
          speaker: narrator
          text: 雷迪说得好像他早就知道强尼住在哪里。其实，他连那地方究竟在哪儿都毫无头绪。他已经到处找了又找，始终没发现新家的半点踪迹。萨米从头到尾都知道这些，却装作什么也不知道。
    - id: ch04
      title: 强尼要有客人了
      blocks:
        - id: ch04-b01
          speaker: sammy_jay
          text: “今天早上，我正好去了农夫布朗家的老果园，就顺路看了看强尼。”
        - id: ch04-b02
          speaker: narrator
          text: 萨米看见雷迪的耳朵猛地竖了起来，又暗暗笑了一声。
        - id: ch04-b03
          speaker: sammy_jay
          text: “对了，强尼好像还觉得，你不知道他现在住在哪儿呢。”
        - id: ch04-b04
          speaker: reddy_fox
          text: “哼，强尼以为这就能瞒住我吗？我该赶路了。再见，松鸦萨米。”
        - id: ch04-b05
          speaker: narrator
          text: 雷迪先朝绿草地跑去。可他刚离开萨米的视线，就转身奔向农夫布朗家的老果园。萨米早就料到他会这样。
        - id: ch04-b06
          speaker: sammy_jay
          text: “看来，土拨鼠强尼马上就要有客人上门了。”
        - id: ch04-b07
          speaker: narrator
          text: 萨米一边偷笑，一边动身去找臭鼬吉米。
