cover_prompt: |-
  A wordless cover scene in a rural American old orchard around 1913 shows a family of woodchucks hurrying through tall summer grass toward their burrow beneath an old apple tree. A sturdy adult woodchuck follows close behind three small young woodchucks while a second adult waits at the dark round doorway. High in the apple tree, a bright blue jay leans forward with spread wings and an open beak as a farm boy approaches at the distant edge of the orchard. The family's quick dash to safety is the clear focal action, energetic but child-friendly and non-frightening. Use a wide child-height view with the woodchucks forming a strong diagonal toward the burrow, the jay framed above them, and broad calm sky left open at the top. Keep the animals anatomically believable, the farm boy's simple clothing appropriate to the period, and every figure independent of film or animation designs. No readable text, letters, numbers, labels, logos, captions, speech bubbles, signatures, or watermarks.
