audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖亲切，带着轻快而含蓄的幽默
        timbre: 清亮柔和
        pace: 舒缓而有变化
        pitch: 中等
    johnny_chuck:
      display_name: 土拨鼠强尼
      tts:
        delivery: 朴实直爽，偶尔带一点不耐烦
        timbre: 浑厚温暖
        pace: 中等
        pitch: 中低
    polly_chuck:
      display_name: 土拨鼠波莉
      tts:
        delivery: 温柔腼腆，说话小心而真诚
        timbre: 轻柔清甜
        pace: 稍慢
        pitch: 中高
  chapters:
    - id: ch01
      title: 第十章　强尼为什么没有打架
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 怒火真是可怕。它从来不肯停下来想想道理，不管到了什么时节，说沸腾就会沸腾起来。
        - id: ch01-b02
          speaker: narrator
          text: 土拨鼠强尼就是这样。他刚瞧见孤零零的榆树旁边有只陌生的土拨鼠，怒气一下塞满了心，整个人都暴跳如雷。这当然很愚蠢，实在愚蠢极了。那只土拨鼠什么也没说，什么也没做，天底下没有一点儿惹他生气的地方，只是来到了绿草地。绿草地那么宽，住得下许多土拨鼠。强尼却想把别人全赶走，这实在太自私了。
        - id: ch01-b03
          speaker: narrator
          text: 可怒火哪里肯讲道理，这一回也没有停下来想一想。强尼甩开四条短腿，飞快地奔向那棵榆树。他一心只想把陌生家伙赶出绿草地，再狠狠教训一顿，让对方永远也不敢动回来的念头。他气得根根毛发都竖了起来，一路吱吱乱叫，还不停地责骂。
        - id: ch01-b04
          speaker: johnny_chuck
          text: “我非收拾他不可！绿草地是我的，没有我点头，谁也不许待在这里！我一定要好好收拾他！”
          emotion: angry
        - id: ch01-b05
          speaker: narrator
          text: 强尼把牙齿磨得咯咯响，眼神凶得吓人。他那副样子一点儿也不好看，半点儿也不。西风妈妈手下那些快活的小微风都认不出他了。眼前这个家伙，真是它们认识多年的强尼吗？真是那个随和快活、谁都喜欢的强尼吗？
        - id: ch01-b06
          speaker: narrator
          text: 小微风们躲得远远的，谁也不愿靠近这么一个大发脾气的家伙。强尼连看也没看见。就算看见了，他也不会在乎。怒火一旦占满一颗心，别的东西便再也挤不进去了。
        - id: ch01-b07
          speaker: narrator
          text: 强尼起先还以为，那就是昨天跟他恶战一场、最后被他打败的灰色老土拨鼠。也许他这样恼火，正因为那只老土拨鼠曾想把他赶出绿草地。
        - id: ch01-b08
          speaker: narrator
          text: 跑着跑着，强尼不得不停下来喘口气。他直起身又看了一眼，这才发现自己认错了。对方不是灰色老土拨鼠，而是一只年轻得多、个头也小得多的土拨鼠，甚至比强尼自己还小。
        - id: ch01-b09
          speaker: johnny_chuck
          text: “哼，那我打败他就更容易了。”
        - id: ch01-b10
          speaker: narrator
          text: 强尼嘟囔一句，又往前跑。他压根儿没想过，欺负一个比自己弱小的家伙有多不公平。他正在气头上，而怒火从来不管什么公平不公平。
        - id: ch01-b11
          speaker: narrator
          text: 没多久，强尼赶到了孤零零的榆树下。可是那个陌生家伙不见了。真的，他哪儿也不在，四下里连个影子都没有。强尼直起身，这边瞧瞧，那边望望，到处都找不着。
        - id: ch01-b12
          speaker: johnny_chuck
          text: “呸！他一定是怕了，不敢跟我打。这个胆小鬼，以为躲起来就能甩掉我吗？我会把他揪出来，然后——”
          emotion: angry
        - id: ch01-b13
          speaker: narrator
          text: 强尼没再说下去，只把牙齿磨得咯咯作响。那声音真不好听。
        - id: ch01-b14
          speaker: narrator
          text: 强尼接着四处搜寻。找得越久，他的火气就越大。可那个陌生家伙也不知用了什么办法，始终没让他看见。强尼差一点儿就要放弃了，忽然脚下一绊，险些撞上藏在一小丛灌木里的陌生土拨鼠。就在这时候，一件有趣的事发生了。你猜是什么？
        - id: ch01-b15
          speaker: narrator
          text: 强尼满腔的怒火忽然全没了，原先根根竖起的毛也全落了下来。他说不清这是为什么，只觉得自己一下子变得很傻，实在傻透了。
        - id: ch01-b16
          speaker: johnny_chuck
          text: “你到底是谁？”
        - id: ch01-b17
          speaker: narrator
          text: 强尼粗声粗气地逼问起来。陌生的土拨鼠却用细小而怯生生的声音答道。
        - id: ch01-b18
          speaker: polly_chuck
          text: “我——我是土拨鼠波莉。”
          emotion: fearful
