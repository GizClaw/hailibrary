audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm, lively storytelling with a gentle sense of wonder
        timbre: clear and rounded
        pace: measured
        pitch: medium
    johnny_chuck:
      display_name: Johnny Chuck
      tts:
        delivery: plainspoken, friendly, and a little gruff when bothered
        timbre: warm and earthy
        pace: relaxed
        pitch: medium-low
    polly_chuck:
      display_name: Polly Chuck
      tts:
        delivery: gentle, shy, and plainly spoken
        timbre: soft and youthful
        pace: measured
        pitch: medium-high
  chapters:
    - id: ch01
      title: Why Johnny Chuck Didn't Fight
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Anger is an awful thing. It never stops to reason. It boils right over all at once, no matter what the season.
        - id: ch01-b02
          speaker: narrator
          text: That was just what happened to Johnny Chuck. The moment he spotted a strange Chuck near the lone elm tree, anger filled his heart and boiled over. He flew into a terrible rage. It was very foolish indeed. The stranger had not said or done a single thing to offend Johnny. Not one thing in the world. The newcomer had only come down to the Green Meadows. Those meadows were broad, with plenty of room for many Chucks. Johnny was simply being selfish when he decided no other Chuck could stay.
        - id: ch01-b03
          speaker: narrator
          text: But anger never stops to reason, and Johnny didn't stop now. He hurried toward the lone elm tree as fast as his short legs could carry him. He could think of only one thing. He would chase that stranger away and punish him so badly that he would never even think of coming back. Johnny was so angry that every hair stood on end. As he ran, he chattered and scolded.
        - id: ch01-b04
          speaker: johnny_chuck
          text: "I'll teach him! These Green Meadows belong to me. Nobody has any right to come here unless I allow it! I'll teach him. Just wait!"
          emotion: angry
        - id: ch01-b05
          speaker: narrator
          text: Johnny ground his teeth, and the ugliest look filled his eyes. He was not pleasant to see. The Merry Little Breezes of Old Mother West Wind hardly knew what to think of him. Was this really the good-natured, happy Johnny Chuck they had known so long, the one everybody loved? They drew away from him. They wanted nothing to do with anyone in such a dreadful temper.
        - id: ch01-b06
          speaker: narrator
          text: Johnny never even noticed them. If he had noticed, he would not have cared. That is the trouble with anger. Once it fills the heart, it crowds everything else out.
        - id: ch01-b07
          speaker: narrator
          text: At first, Johnny had been sure the stranger was the old gray Chuck he had fought and beaten the day before. Perhaps that made him even angrier, because the old gray Chuck had tried to drive Johnny away from the Green Meadows.
        - id: ch01-b08
          speaker: narrator
          text: Then Johnny had to stop and catch his breath. He sat up for another look. This was not the old gray Chuck at all. It was a younger Chuck, much smaller than the old gray one and smaller than Johnny himself.
        - id: ch01-b09
          speaker: johnny_chuck
          text: "Good. He'll be much easier to beat."
          emotion: angry
        - id: ch01-b10
          speaker: narrator
          text: Johnny muttered the words and hurried on. Not once did he think how unfair it was to fight someone smaller than he was. His anger would not let him think fairly.
        - id: ch01-b11
          speaker: narrator
          text: Before long, Johnny reached the lone elm tree. The stranger had vanished. Yes, sir, there was no stranger anywhere in sight. Johnny sat up and looked this way, then that way. He looked all around, but he could not see the newcomer at all.
        - id: ch01-b12
          speaker: johnny_chuck
          text: "Hah! He's scared to face me. What a coward! But he won't get away that easily. He's hiding somewhere. I'll find him, and then..."
          emotion: angry
        - id: ch01-b13
          speaker: narrator
          text: Johnny left the threat unfinished and ground his teeth. It was not a pleasant sound.
        - id: ch01-b14
          speaker: narrator
          text: He hunted for the stranger, growing angrier all the while. Somehow, the other Chuck kept out of sight. Johnny was nearly ready to give up when he almost tripped over the stranger, who was hiding in a small clump of bushes. And then something funny happened. Can you guess what it was?
        - id: ch01-b15
          speaker: narrator
          text: Every bit of Johnny's anger disappeared. His hair fell flat again. He could not explain it, but suddenly he felt foolish. Very foolish indeed. Still, his voice was gruff when he spoke.
        - id: ch01-b16
          speaker: johnny_chuck
          text: "Who are you?"
        - id: ch01-b17
          speaker: polly_chuck
          text: "I... I'm Polly Chuck."
          emotion: fearful
