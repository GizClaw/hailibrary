audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖亲切，带着轻快而含蓄的幽默
        timbre: 清亮柔和
        pace: 舒缓而有变化
        pitch: 中等
    johnny_chuck:
      display_name: 土拨鼠强尼
      tts:
        delivery: 朴实直爽，偶尔带一点不耐烦
        timbre: 浑厚温暖
        pace: 中等
        pitch: 中低
    jimmy_skunk:
      display_name: 臭鼬吉米
      tts:
        delivery: 随和机灵，话里常带善意的笑
        timbre: 圆润清晰
        pace: 从容
        pitch: 中等
  chapters:
    - id: ch01
      title: 第五章　土拨鼠强尼不满意了
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 土拨鼠强尼不快活。明明是欢欢喜喜的春天，大家照说都该比平日更快活，他却偏偏不快活。为什么呢？连强尼自己也弄不明白。漫长的冬天里，他一直睡得舒舒服服。刚醒来时确实饿坏了，可现在吃的已经多得很。四周的鸟儿有的在唱歌，有的忙着搭新家，强尼心里却还是不痛快。没有半点儿正经缘故，却一直这样难受，真是糟糕。
        - id: ch01-b02
          speaker: narrator
          text: 一个晴朗的早晨，强尼坐在家门口，看啄木鸟鼓手在老苹果树上修新家。鼓手的红脑袋来来回回地晃，尖嘴一次只能凿下一丁点儿木屑。活儿又慢又累，他却干得快活极了。强尼看着看着，便想到了自己的家。那一直是个很不错的住处，样样都照着他的心意建成。坐在门口，绿草原四面八方都看得见。这里有前门，还有一扇藏得好好的后门。对，强尼一向觉得自己的家好极了。
        - id: ch01-b03
          speaker: narrator
          text: 可就在这一天，强尼忽然对它处处不满意。离孤零零小径太近啦，知道这里的人太多啦，屋子不够大啦，前门也该朝着另一边啦。你瞧，一颗不知足的心，竟能从一向好端端的东西上挑出这么多毛病！这所房子陪强尼度过了许多快乐的日子，护着他没受过伤害，刚建成时更让他满心自豪。如今，它竟成了全世界最糟糕的房子。别人能住新房，他为什么不能？强尼越想越不满意，越想越不知足，也就越来越不快活。谁也没法一边满心不满，一边又觉得快活。
        - id: ch01-b04
          speaker: narrator
          text: 可是，成天不满意又不知足的人，待在谁身边都不讨人喜欢。强尼本来是草原小居民里脾气最好的一个，大家都很喜欢他。所以臭鼬吉米沿着孤零零小径走来时，怎么也想不通。强尼的心情坏透了，吉米跟他说话，他连理也不理。
        - id: ch01-b05
          speaker: narrator
          text: 吉米自己的心情倒好得很。他刚美美地吃了一顿肥甲虫，觉得世上一切都安安稳稳。于是他挨着强尼坐下，只当身边还是平日那个好脾气的朋友，自顾自地聊了起来。
        - id: ch01-b06
          speaker: jimmy_skunk
          text: “今天这天气多好啊。”
        - id: ch01-b07
          speaker: narrator
          text: 强尼不回答，只从鼻子里哼了一声。吉米又换了句话。
        - id: ch01-b08
          speaker: jimmy_skunk
          text: “你今天看起来也挺精神嘛。”
        - id: ch01-b09
          speaker: narrator
          text: 强尼还是不说话，只沉下了脸。吉米便装作欣赏风景，朝四周看了看。
        - id: ch01-b10
          speaker: jimmy_skunk
          text: “依我看，绿草原上最适合安家的地方，就是你这里了。”
        - id: ch01-b11
          speaker: narrator
          text: 强尼的脸色更难看了。吉米却像没瞧见一样，接着夸了下去。
        - id: ch01-b12
          speaker: jimmy_skunk
          text: “再看看这所房子，多漂亮！我要是也有一所就好啦。”
        - id: ch01-b13
          speaker: johnny_chuck
          text: “既然你这么喜欢，那正好送给你！这所破房子，我才不要了！”
          emotion: angry
        - id: ch01-b14
          speaker: narrator
          text: 强尼没好气地嚷起来。吉米把眼睛睁得大大的，马上追问。
        - id: ch01-b15
          speaker: jimmy_skunk
          text: “你刚才说什么？”
          emotion: surprised
        - id: ch01-b16
          speaker: johnny_chuck
          text: “我说，这房子归你了。我要搬到别处去。”
        - id: ch01-b17
          speaker: narrator
          text: 其实，在那句话冲出口以前，强尼从来没想过搬家，连自己为什么会那么说也不知道。可话已经说了，而他偏偏又是个倔强的小家伙，于是非把这话当真不可。
        - id: ch01-b18
          speaker: jimmy_skunk
          text: “这么说，我什么时候能搬进来？”
        - id: ch01-b19
          speaker: narrator
          text: 吉米问这话时，眼睛里闪着笑意。
        - id: ch01-b20
          speaker: johnny_chuck
          text: “随你的便。你想现在搬进来，也可以。”
        - id: ch01-b21
          speaker: narrator
          text: 说完，强尼便大摇大摆地沿着孤零零小径走了。臭鼬吉米留在原地，盯着他的背影，仿佛强尼忽然发了疯。其实，吉米心里真是这么想的。
