audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm, lively storytelling with a gentle sense of wonder
        timbre: clear and rounded
        pace: measured
        pitch: medium
    johnny_chuck:
      display_name: Johnny Chuck
      tts:
        delivery: plainspoken, friendly, and a little gruff when bothered
        timbre: warm and earthy
        pace: relaxed
        pitch: medium-low
    jimmy_skunk:
      display_name: Jimmy Skunk
      tts:
        delivery: easygoing, good-humored, and quietly confident
        timbre: smooth and mellow
        pace: unhurried
        pitch: medium-low
  chapters:
    - id: ch01
      title: Johnny Chuck Becomes Dissatisfied
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Johnny Chuck was unhappy. Glad springtime had come, when everyone was supposed to be happier than ever, but Johnny was not happy at all. Why? He hardly knew. He had slept comfortably through the long winter. He had woken up terribly hungry, but now there was plenty for him to eat. Birds sang all around him or worked busily on their new homes. Still, Johnny felt miserable. And it was dreadful to feel that way without knowing why.
        - id: ch01-b02
          speaker: narrator
          text: One bright morning, Johnny sat on his doorstep and watched Drummer the Woodpecker make a new home in the old apple tree. Drummer's red head darted back and forth as his sharp bill chipped away tiny pieces of wood. The job was slow and hard, but Drummer seemed very happy doing it.
        - id: ch01-b03
          speaker: narrator
          text: As Johnny watched, he began thinking about his own home. He had always thought it was a fine one. He had built it exactly the way he wanted it. From his doorstep, he could see in every direction across the Green Meadows. There was a front door and a hidden back door. Yes, Johnny had always been very pleased with his home.
        - id: ch01-b04
          speaker: narrator
          text: But all at once, Johnny was dissatisfied with it. The house stood too close to the Lone Little Path. Far too many people knew where to find it. It was too small, and the front door faced the wrong way. My, how many faults a discontented heart can find in something that once seemed just right!
        - id: ch01-b05
          speaker: narrator
          text: That was exactly what happened to Johnny. This home had given him many happy days. It had kept him safe from harm, and he had been so proud when he first built it. Now he decided it was the worst house in the world. If other people could have new houses, why couldn't he? The longer he thought, the more dissatisfied and discontented he grew. And the more discontented he became, the unhappier he felt. After all, no one can be discontented and happy at the same time.
        - id: ch01-b06
          speaker: narrator
          text: A dissatisfied, discontented person is not very pleasant company. Johnny had always been one of the most good-natured little people on the Green Meadows, and everyone liked him. So when Jimmy Skunk came along the Lone Little Path, he could not understand what was wrong. Johnny was in such a bad temper that he would not even answer when Jimmy spoke to him.
        - id: ch01-b07
          speaker: narrator
          text: Jimmy himself was feeling wonderfully good-natured. He had just eaten a fine breakfast of fat beetles, and he felt at peace with the whole world. He sat beside Johnny and began talking as though his friend were acting just like his usual cheerful self.
        - id: ch01-b08
          speaker: jimmy_skunk
          text: "What a lovely day this is."
        - id: ch01-b09
          speaker: narrator
          text: Johnny only sniffed.
        - id: ch01-b10
          speaker: jimmy_skunk
          text: "And you're looking especially well today."
        - id: ch01-b11
          speaker: narrator
          text: Johnny answered with a scowl.
        - id: ch01-b12
          speaker: jimmy_skunk
          text: "You know, I believe your house has the finest spot anywhere on the Green Meadows."
        - id: ch01-b13
          speaker: narrator
          text: Jimmy pretended to admire the view, while Johnny's scowl grew darker.
        - id: ch01-b14
          speaker: jimmy_skunk
          text: "And what a wonderful house it is! I wish I owned one just like it."
        - id: ch01-b15
          speaker: johnny_chuck
          text: "Well, I'm glad somebody likes it! You can have the awful old place!"
          emotion: angry
        - id: ch01-b16
          speaker: jimmy_skunk
          text: "What did you say?"
          emotion: surprised
        - id: ch01-b17
          speaker: narrator
          text: Jimmy's eyes opened very wide.
        - id: ch01-b18
          speaker: johnny_chuck
          text: "I said you can have this house. I'm moving away."
        - id: ch01-b19
          speaker: narrator
          text: Until that very moment, Johnny had never even considered moving. He had no idea why he said it. But the words were out, and Johnny was an obstinate little fellow. Once he had said a thing, he would not take it back.
        - id: ch01-b20
          speaker: narrator
          text: Jimmy's eyes twinkled.
        - id: ch01-b21
          speaker: jimmy_skunk
          text: "Then how soon may I move in?"
        - id: ch01-b22
          speaker: johnny_chuck
          text: "You can move in this very minute, if that's what you want."
        - id: ch01-b23
          speaker: narrator
          text: Johnny swaggered away down the Lone Little Path. Jimmy stayed behind, staring after him as though Johnny Chuck had suddenly gone crazy. And that was exactly what Jimmy thought.
