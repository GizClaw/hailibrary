audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm, lively storytelling with a gentle sense of wonder
        timbre: clear and rounded
        pace: measured
        pitch: medium
    johnny_chuck:
      display_name: Johnny Chuck
      tts:
        delivery: good-natured, thoughtful, and quick to brighten with discovery
        timbre: warm and youthful
        pace: moderate
        pitch: medium
    jerry_muskrat:
      display_name: Jerry Muskrat
      tts:
        delivery: dryly playful, observant, and pleased with his own teasing
        timbre: light and slightly reedy
        pace: measured
        pitch: medium-high
    farmer_browns_boy:
      display_name: Farmer Brown's Boy
      tts:
        delivery: open, eager, and sure of what he hears
        timbre: clear and boyish
        pace: moderate
        pitch: medium-high
  chapters:
    - id: ch01
      title: Johnny Chuck Finds Out Who the Sweet Singers Are
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Johnny Chuck simply could not stay away from the Smiling Pool. No, Sir, he could not. Ever since he and Peter Rabbit had gone there to look for the sweet singers, something had been troubling him. Those singers sang every night and for part of each day. They told anyone who listened how glad they were that Mistress Spring had come to the Green Meadows and the Green Forest. Johnny had to find out more.
        - id: ch01-b02
          speaker: narrator
          text: Johnny and Peter had been certain the singers were birds. Nothing else had even crossed their minds, so birds were all they looked for. But when they reached the Smiling Pool, the voices seemed to rise straight out of the water. Johnny knew that some birds, including many of Mrs. Quack's cousins, could stay underwater for a long time. Perhaps other birds could do it too.
        - id: ch01-b03
          speaker: narrator
          text: Whenever Johnny returned to the pool, Jerry Muskrat was watching for him. Jerry's eyes would twinkle, though his voice sounded very serious.
        - id: ch01-b04
          speaker: jerry_muskrat
          text: "Hello, Johnny Chuck! Have you spotted those birds singing underwater yet?"
        - id: ch01-b05
          speaker: narrator
          text: Johnny always took the teasing in good humor.
        - id: ch01-b06
          speaker: johnny_chuck
          text: "Not yet, Jerry. Maybe you could show me where they are."
        - id: ch01-b07
          speaker: jerry_muskrat
          text: "Your two eyes are bright, I know. Perhaps someday you'll learn where to look, and then you'll see."
        - id: ch01-b08
          speaker: narrator
          text: Johnny would sit as still as he possibly could. He watched and watched the Smiling Pool. The singers were there, but he never saw a single bird in the water.
        - id: ch01-b09
          speaker: narrator
          text: Then one day, a new thought popped into his head. What if the singers were not birds at all? Why had he never thought of that? He had been searching so hard for birds that he might have missed everything else. From then on, Johnny stopped looking for one particular thing. He tried to see everything around him.
        - id: ch01-b10
          speaker: narrator
          text: Almost at once, he noticed tiny dark spots on the water. They hardly looked like anything, and they were so small that he had never seen them before. One spot was quite close. As Johnny stared, it began to look like a tiny nose. And then Johnny became certain that one of the singing voices was coming from that very spot.
        - id: ch01-b11
          speaker: narrator
          text: Johnny was so surprised that he jumped to his feet and waved excitedly to Jerry Muskrat. At once, the nearby voices fell silent. The little spots vanished from the surface, leaving only the tiniest rings, like the rings made by raindrops on the Smiling Pool. When the nearest little nose disappeared, Johnny caught one quick glimpse of a small shape beneath the water.
        - id: ch01-b12
          speaker: johnny_chuck
          text: "Why... why, the singers are Grandfather Frog's children!"
          emotion: surprised
        - id: ch01-b13
          speaker: narrator
          text: Jerry laughed and rubbed his hands with delight.
        - id: ch01-b14
          speaker: jerry_muskrat
          text: "No, they aren't his children. But they are close cousins. They're old Mr. Tree Toad's grandchildren, and they're called Hylas! I told you that if you really used your eyes, you would learn to see."
          emotion: happy
        - id: ch01-b15
          speaker: narrator
          text: Johnny started home across the Green Meadows.
        - id: ch01-b16
          speaker: johnny_chuck
          text: "My, their voices are much bigger than they are! I'm glad I finally know who sings at the Smiling Pool. I must remember their name. Hylas. What a funny name!"
          emotion: happy
        - id: ch01-b17
          speaker: narrator
          text: That evening, Farmer Brown's boy listened to the same song. He did not call the singers Hylas.
        - id: ch01-b18
          speaker: farmer_browns_boy
          text: "Listen to the peepers! Spring is surely here."
