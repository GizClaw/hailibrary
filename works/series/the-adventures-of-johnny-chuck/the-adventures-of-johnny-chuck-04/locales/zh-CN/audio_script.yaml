audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖亲切，带着轻快而含蓄的幽默
        timbre: 清亮柔和
        pace: 舒缓而有变化
        pitch: 中等
    johnny_chuck:
      display_name: 土拨鼠强尼
      tts:
        delivery: 朴实直爽，偶尔带一点不耐烦
        timbre: 浑厚温暖
        pace: 中等
        pitch: 中低
    jerry_muskrat:
      display_name: 麝鼠杰里
      tts:
        delivery: 爽朗活泼，笑声里带着善意的打趣
        timbre: 明亮饱满
        pace: 稍快
        pitch: 中等
    farmer_browns_boy:
      display_name: 农夫布朗家的男孩
      tts:
        delivery: 自然爽快，带着乡野少年的亲切
        timbre: 清朗明亮
        pace: 中等
        pitch: 中高
  chapters:
    - id: ch01
      title: 第四章　土拨鼠强尼发现甜美的歌唱家是谁
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 土拨鼠强尼就是没法不去微笑池。真的，他一次又一次往那里跑。自从他和兔子彼得去找过那些甜美的歌唱家，他心里就总惦记着一件事。那些歌声整夜响着，白天也会响上一阵，告诉每个愿意听的人，春姑娘来到绿草原和绿森林，他们有多欢喜。强尼放不下的，正是这件事。
        - id: ch01-b02
          speaker: narrator
          text: 原来，强尼和彼得一开始就认准了，唱歌的当然是鸟儿。他们根本没想过别的，只顾四处找鸟。可到了微笑池，声音分明是从水里传来的。强尼知道，嘎嘎太太的许多亲戚都能在水下待很久。那么，别的鸟儿也许同样能办到吧？强尼可不敢断定。
        - id: ch01-b03
          speaker: narrator
          text: 强尼每次来到微笑池，麝鼠杰里都等着看他。杰里的眼睛闪着笑，脸上却装得一本正经，然后又问起同一个问题。
        - id: ch01-b04
          speaker: jerry_muskrat
          text: “你好啊，土拨鼠强尼！你看见那些鸟儿在水底下唱歌了吗？”
        - id: ch01-b05
          speaker: narrator
          text: 强尼脾气好，只是笑一笑。
        - id: ch01-b06
          speaker: johnny_chuck
          text: “还没看见呢，麝鼠杰里。你就不能指给我看看吗？”
        - id: ch01-b07
          speaker: narrator
          text: 杰里每次都用两句顺口溜回答他。
        - id: ch01-b08
          speaker: jerry_muskrat
          text: “两只眼睛亮晶晶，总有一天看得清。”
        - id: ch01-b09
          speaker: narrator
          text: 强尼便拿出自己最大的本事，坐在那里一动不动。他盯着微笑池，看了又看。歌声还在，水里却一只鸟也没有。直到有一天，一个念头突然钻进他脑袋。唱歌的也许根本不是鸟！他以前怎么就没想到呢？一定是因为只顾着找鸟，旁的东西全让他忽略了。这一回，强尼不再专找什么，只把眼前的一切都仔细看清楚。
        - id: ch01-b10
          speaker: narrator
          text: 没过多久，他就发现水面上浮着几个黑乎乎的小点儿。那些小点儿看不出究竟是什么，又小得几乎看不见，难怪强尼以前从没留意。一个小点儿就在近处。他越看，越觉得那像一只小鼻子。就在这时，强尼听清了。一阵歌声，真的从那个小点儿传了出来！
        - id: ch01-b11
          speaker: narrator
          text: 强尼惊得跳起来，赶紧朝杰里招手。他才一动，附近的歌声就停了。小黑点儿也沉了下去，水面只剩几圈极细的波纹，跟雨点落进微笑池时一模一样。那个像小鼻子的点儿消失时，强尼还瞧见一个小小的身影从水下闪过。
        - id: ch01-b12
          speaker: johnny_chuck
          text: “这……这……哎呀！唱歌的是青蛙爷爷的孩子！”
          emotion: surprised
        - id: ch01-b13
          speaker: jerry_muskrat
          text: “不，不是他的孩子，不过确实是他们的表亲。他们是树蟾老先生的孙辈，名字叫海拉斯！”
          emotion: happy
        - id: ch01-b14
          speaker: narrator
          text: 杰里笑得直搓手，别提多快活了。
        - id: ch01-b15
          speaker: jerry_muskrat
          text: “我早就说过，你肯好好用眼睛，自然会学会怎么看。”
          emotion: happy
        - id: ch01-b16
          speaker: narrator
          text: 强尼动身回家，穿过绿草原时还在感叹。
        - id: ch01-b17
          speaker: johnny_chuck
          text: “哎呀，他们个头那么小，嗓门倒那么大！这下我总算知道微笑池里的歌唱家是谁了。我可不能忘记他们的名字，海拉斯。这个名字真古怪！”
        - id: ch01-b18
          speaker: narrator
          text: 可是那天晚上，农夫布朗家的男孩听见这歌声，却没把他们叫作海拉斯。
        - id: ch01-b19
          speaker: farmer_browns_boy
          text: “听，春雨蛙在叫呢！春天准是来了。”
