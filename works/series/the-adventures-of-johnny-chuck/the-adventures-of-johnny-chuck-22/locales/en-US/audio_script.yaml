audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm, lively storytelling with a gentle sense of wonder
        timbre: clear and rounded
        pace: measured
        pitch: medium
    mother_chuck:
      display_name: Mother Chuck
      tts:
        delivery: practical, affectionate, and firmly encouraging
        timbre: warm and mature
        pace: unhurried
        pitch: medium-low
  chapters:
    - id: ch01
      title: Johnny's Lazy Ways
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Johnny Chuck is lazy by nature. His wants are simple, and most of the time he is perfectly content. Everything he likes to eat grows close to his own doorstep. He does not have to hunt for meals the way so many little folk of the meadow and forest do.
        - id: ch01-b02
          speaker: narrator
          text: That leaves Johnny plenty of time to sit by his door, watch the world pass, dream pleasant dreams, and grow fat. People who have no work to do often become lazy. It is the easiest habit to pick up and the hardest one to lose. Since Johnny seldom has to work, being lazy comes quite naturally to him.
    - id: ch02
      title: When Work Must Be Done
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: But when work truly needs doing, Johnny can work. Only Digger the Badger or Miner the Mole might dig faster. Give Johnny a necessary job, and he puts his whole heart into it. Long ago, when he was a tiny Chuck, old Mother Chuck taught him a little rhyme.
        - id: ch02-b02
          speaker: mother_chuck
          text: "When work there is that must be done, don't fret and whine and spoil the day. The quicker that you do your work, the longer time you'll have to play."
        - id: ch02-b03
          speaker: narrator
          text: Johnny has never forgotten those words. Whenever work is really needed, no one works harder. First, though, he makes quite sure the job is necessary. He will not waste his time doing foolish things that never needed doing at all.
        - id: ch02-b04
          speaker: narrator
          text: Now Johnny Chuck was busier than he had ever been in his life. Even if he felt lazy during those beautiful spring days, he had no time to notice. No, Sir, he could not even remember that laziness came naturally to him.
        - id: ch02-b05
          speaker: narrator
          text: Johnny had a family to care for. He had to find sweet, tender young clover for three babies. He had to teach them everything a Chuck should know. And he had to keep watch so that no harm came to them. Johnny was so busy that he could hardly find enough time to eat.
    - id: ch03
      title: The Family's Morning
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: Each morning, Johnny came outside as soon as jolly, round, red Mr. Sun began his daily climb into the blue sky. Johnny looked one way and then the other. He had to be certain that Reddy Fox, Granny Fox, Redtail the Hawk, Bowser the Hound, and every other danger were far away. He always checked the apple trees, too, in case Sammy Jay was hiding there.
        - id: ch03-b02
          speaker: narrator
          text: Only then did Johnny call Polly Chuck and the three baby Chucks. Polly came out looking very worried. Behind her tumbled the three funny little babies, rolling over one another on the doorstep as they played.
        - id: ch03-b03
          speaker: narrator
          text: When Johnny decided they had played long enough, he led them down a little private path he had made through the grass. The three small Chucks trotted after him in a row. Polly marched behind them all and made sure that no one wandered away.
        - id: ch03-b04
          speaker: narrator
          text: At the patch of sweet, tender young clover, Johnny sat very straight and very still. He watched as sharply as he knew how for the smallest sign of danger. The babies ate until their three little stomachs were full.
        - id: ch03-b05
          speaker: narrator
          text: Then Johnny proudly led everyone home. Once they arrived, he sat straight up again and kept watch. The three baby Chucks stretched out on the doorstep and took a nap in the sun.
    - id: ch04
      title: Eyes in the Apple Tree
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: Those were busy days for Johnny Chuck, and anxious ones as well. He had not forgotten that Sammy Jay had discovered his secret. Johnny felt certain Sammy would tell Reddy Fox. So from the first moment of morning until the very end of the day, Johnny kept watching for danger.
        - id: ch04-b02
          speaker: narrator
          text: All that time, though Johnny did not know it, two sharp eyes watched him from a snug hiding place in one of the old apple trees. Whose eyes were they? Why, Sammy Jay's, of course.
        - id: ch04-b03
          speaker: narrator
          text: After all, Sammy Jay had not told Johnny Chuck's great secret.
