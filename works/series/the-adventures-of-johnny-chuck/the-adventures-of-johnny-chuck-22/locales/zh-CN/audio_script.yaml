audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖亲切，带着轻快而含蓄的幽默
        timbre: 清亮柔和
        pace: 舒缓而有变化
        pitch: 中等
    mother_chuck:
      display_name: 土拨鼠老妈妈
      tts:
        delivery: 慈爱爽朗，说话朴实而有教诲意味
        timbre: 温厚柔和
        pace: 从容
        pitch: 中低
  chapters:
    - id: ch01
      title: 懒散却能干的强尼
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 土拨鼠强尼生来就有些懒。其实，他要的东西不多，日子也过得很知足。想吃东西，出门没几步就能找到，根本不用像草地和森林里的许多小居民那样，到处辛苦觅食。
        - id: ch01-b02
          speaker: narrator
          text: 所以呀，强尼常常坐在门阶上，看着眼前的世界来来往往。他做着美滋滋的白日梦，身子也一天天胖起来。不必干活的人，很容易就会变懒。懒惰这个习惯，学起来最容易，改掉却最难。强尼平常很少有活儿要做，自然就越来越懒了。
        - id: ch01-b03
          speaker: narrator
          text: 不过，真需要出力时，强尼一点儿也不含糊。要说挖土，除了獾迪格和鼹鼠迈纳，谁都赶不上他。只要事情非做不可，他马上就会使出全身的力气。
        - id: ch01-b04
          speaker: narrator
          text: 强尼还小的时候，土拨鼠老妈妈就教过他一首小诗。
        - id: ch01-b05
          speaker: mother_chuck
          text: “该做的活儿既然躲不过，别烦恼抱怨，白白误了时光！手脚越麻利，活儿越早做完，留给玩耍的时间就越长。”
        - id: ch01-b06
          speaker: narrator
          text: 强尼一直记着这几句话。每逢必须干活，他比谁都肯卖力。当然，动手之前，他总会先想清楚，这件事到底有没有必要。他可不愿把时间耗在又傻又多余的事情上。
    - id: ch02
      title: 一家之主忙起来了
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 可眼下，强尼忙得一辈子都没这么厉害。春光再好，他犯了懒也顾不上去想。是的，先生，他忙得连自己天生懒散这回事都忘了。
        - id: ch02-b02
          speaker: narrator
          text: 因为强尼得照顾全家。三只宝宝要吃鲜嫩香甜的三叶草，他得去找。每只土拨鼠都该会的本领，他得一样样教。孩子们会不会碰上危险，他也得时时盯紧，不能让他们受一点伤。强尼忙个不停，连自己好好吃顿饭的工夫都快没有了。
    - id: ch03
      title: 每天的三叶草之行
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 每天早晨，快活、滚圆、红彤彤的太阳先生刚开始爬上蓝蓝的天空，强尼就走出家门。他朝这边看看，又向那边瞧瞧，先要确定红狐雷迪、狐狸奶奶、红尾鹰和猎犬鲍泽都不在附近，别的危险也没有靠近。
        - id: ch03-b02
          speaker: narrator
          text: 苹果树上也不能漏看。松鸦萨米会不会躲在那里呢？强尼仔细查过，才把土拨鼠波莉和三个孩子叫出来。
        - id: ch03-b03
          speaker: narrator
          text: 波莉总是满脸担忧地出门。三只滑稽的小土拨鼠跟在后面，一到门阶上就滚来滚去，互相绊成一团。等他们玩够了，强尼便走上自己从草丛里开出的小路，在前面领路。
        - id: ch03-b04
          speaker: narrator
          text: 三只宝宝排成一列，跟着爸爸一路小跑。波莉走在队伍最后面，留心看着，免得有哪个孩子走岔了路。
        - id: ch03-b05
          speaker: narrator
          text: 一家人来到鲜嫩香甜的三叶草地，强尼就把身子挺得直直的，坐在那里一动不动。他使出自己所有的本领，警觉地看守四周，绝不放过一丁点儿危险的迹象。
        - id: ch03-b06
          speaker: narrator
          text: 三只小肚皮全都吃饱以后，强尼又得意地领着大家回家。到了家，他还是直挺挺地坐着放哨。三个孩子呢，早就摊开四肢躺在门阶上，晒着太阳打起盹儿来了。
    - id: ch04
      title: 苹果树上的一双眼睛
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 对土拨鼠强尼来说，那真是一段忙碌的日子，也是一段叫他时刻担心的日子。他忘不了，松鸦萨米已经发现了自己的秘密。他也认定，萨米一定会把秘密告诉红狐雷迪。
        - id: ch04-b02
          speaker: narrator
          text: 因此，从早晨一睁眼，到夜里准备睡觉，强尼始终留神提防，不敢错过任何危险。
        - id: ch04-b03
          speaker: narrator
          text: 可强尼不知道，就在这些日子里，一双锐利的眼睛一直在盯着他。那双眼睛躲在一棵老苹果树上，藏身的地方又舒服又隐蔽。
        - id: ch04-b04
          speaker: narrator
          text: 那是谁的眼睛？当然是松鸦萨米的。你瞧，萨米终究没有把土拨鼠强尼的大秘密说出去。
