  chapters:
    - id: ch01
      title: Johnny's First Adventure
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: After old Whitetail the Marshhawk passed without trying to touch him, Johnny Chuck felt very brave, very bold, and very important. He strutted along as well as his short legs allowed, with his head held high. He thought he had already had one adventure, and now he wanted another.
        - id: ch01-b02
          speaker: narrator
          text: Johnny forgot how terribly lonely he had felt a little while before. He forgot that he had given away his only home. Somewhere deep inside, he suddenly felt that he did not care about that old home at all. He would not even mind if he never had another one. Yes, Sir, that was how Johnny felt. And do you know why? He was just beginning to understand how big and strong he really was.
        - id: ch01-b03
          speaker: narrator
          text: Feeling big and strong and brave can be splendid. It really can. But it is a bad thing when that feeling turns into foolish pride. Old Whitetail had not been afraid of Johnny at all. He had simply winked and flown past because there was plenty to eat without the trouble of a fight. Whitetail never fought just for the fun of it.
        - id: ch01-b04
          speaker: narrator
          text: Foolish Johnny truly believed Whitetail had feared him. The longer he thought about it, the more pleased and puffed up he became. Soon he was bragging aloud to himself.
        - id: ch01-b05
          speaker: johnny_chuck
          text: "I'm not scared of anyone. They're all scared of me! One look at my teeth, and off they run!"
        - id: ch01-b06
          speaker: gray_old_chuck
          text: "Pooh! It would take two Chucks your size to make me run!"
        - id: ch01-b07
          speaker: narrator
          text: Johnny gave a startled jump. Behind a small clump of grass, a strange Chuck was glaring at him. He was a big, gray, old fellow Johnny had never seen on the Green Meadows before. And he did not look afraid at all. No, Sir, not even the teeniest, weeniest bit.
        - id: ch01-b08
          speaker: narrator
          text: Somehow, Johnny no longer felt half as big, strong, or brave as he had a few minutes earlier. But he could not let this stranger know it. Of course not. Though Johnny felt very small inside, he made all his hair stand up and tried his best to look fierce.
        - id: ch01-b09
          speaker: johnny_chuck
          text: "Who are you? And what are you doing here on my Green Meadows?"
        - id: ch01-b10
          speaker: gray_old_chuck
          text: "Your Green Meadows? Ho, ho, ho! Since when did they belong to you? I've just come down from the Old Pasture, and I like this place so much that I mean to stay. Now run along, little boaster. There isn't room here for both of us, so you'd better be on your way."
        - id: ch01-b11
          speaker: narrator
          text: The stranger gave an unpleasant laugh. Then he bared all his teeth and ground them together.
        - id: ch01-b12
          speaker: narrator
          text: Anger filled Johnny's heart. This stranger was ordering him away from the Green Meadows, where Johnny had been born and had always lived. Johnny could hardly believe his ears. He would show that gray old Chuck who was master here.
        - id: ch01-b13
          speaker: narrator
          text: With a furious squeal, Johnny sprang at him. The fight that followed was worse than any the Merry Little Breezes of Old Mother West Wind had ever seen. They danced about in excitement. They loved Johnny dearly, and they hoped he would win.
        - id: ch01-b14
          speakers: [little_breeze_1, little_breeze_2, little_breeze_3]
          ensemble: chorus
          text: "Oh, how dreadful!"
          emotion: fearful
        - id: ch01-b15
          speaker: narrator
          text: Over and over the two fighters rolled. They bit and scratched and tore at each other, growling and snarling all the while. Jolly, round, red Mr. Sun slipped behind a cloud so he would not have to watch such a dreadful sight.
        - id: ch01-b16
          speaker: narrator
          text: The stranger had been in many fights before, and he was very crafty. He knew tricks that young Johnny had never learned. For a while, Johnny felt that he was getting the worst of the fight. He began to wonder whether he truly would have to leave the Green Meadows. The very thought filled him with fresh anger, and he fought harder than ever.
        - id: ch01-b17
          speaker: narrator
          text: But the stranger was old, and his teeth were worn. Johnny was young, and his teeth were very sharp. After a long, long time, Johnny felt the old Chuck growing weaker. Little by little, he could feel the change. So Johnny fought harder still.
        - id: ch01-b18
          speaker: gray_old_chuck
          text: "Enough!"
        - id: ch01-b19
          speaker: narrator
          text: The moment the stranger could break free, he started back toward the Old Pasture.
        - id: ch01-b20
          speaker: narrator
          text: Johnny Chuck had won!
