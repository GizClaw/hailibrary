audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖亲切，带着轻快而含蓄的幽默
        timbre: 清亮柔和
        pace: 舒缓而有变化
        pitch: 中等
    johnny_chuck:
      display_name: 土拨鼠强尼
      tts:
        delivery: 朴实直爽，偶尔带一点不耐烦
        timbre: 浑厚温暖
        pace: 中等
        pitch: 中低
    gray_old_chuck:
      display_name: 灰色老土拨鼠
      tts:
        delivery: 粗鲁强硬，话里带着嘲弄
        timbre: 粗哑厚重
        pace: 稍慢
        pitch: 低沉
    merry_breeze_1:
      display_name: 快乐小微风一
      tts:
        delivery: 天真活泼，情绪来得直接
        timbre: 清脆轻盈
        pace: 稍快
        pitch: 偏高
    merry_breeze_2:
      display_name: 快乐小微风二
      tts:
        delivery: 天真活泼，语气柔软而真切
        timbre: 明亮轻柔
        pace: 稍快
        pitch: 高
    merry_breeze_3:
      display_name: 快乐小微风三
      tts:
        delivery: 天真活泼，带着孩子般的热心
        timbre: 轻快清澈
        pace: 中快
        pitch: 偏高
  chapters:
    - id: ch01
      title: 第七章　强尼的第一次冒险
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 老白尾从强尼身边飞过，压根儿没想碰他。强尼马上觉得自己又勇敢又威风，简直成了个了不起的大人物。他的腿虽然短，走起路来却能有多神气，就有多神气，脑袋也抬得老高。他认定自己刚刚经历了一场冒险，还想再来一场。不久前的孤单和害怕，都被他抛到了脑后。就连送掉唯一的家，他也忘了。强尼说不清是怎么回事，只觉得自己根本不在乎那个老家。哪怕以后再没有家，好像也没什么大不了。可不是嘛，他当时真是这么想的。你猜这是为什么？强尼刚刚发现，原来自己已经长得这么大、这么壮了。
        - id: ch01-b02
          speaker: narrator
          text: 觉得自己高大、强壮又勇敢，本来是件好事。可要是因此变得骄傲自大，那就糟了。老白尾并不怕强尼。他眨眨眼飞走，只是因为别的食物多得很，何必费力打架呢？白尾可不会为了好玩就跟谁动手。
        - id: ch01-b03
          speaker: narrator
          text: 傻乎乎的强尼却真以为老白尾怕了他。他越想越开心，越想越得意，胸脯也挺得越来越高。没过多久，他就自言自语地吹起牛来。可不是嘛，强尼真的吹起了牛。
        - id: ch01-b04
          speaker: johnny_chuck
          text: “谁来我也不会怕，个个见我忙逃跑！只消让他瞧瞧牙，吓得转身没影了！”
        - id: ch01-b05
          speaker: gray_old_chuck
          text: “呸！别吹啦！就算来两个你这样的，也吓不跑我！”
        - id: ch01-b06
          speaker: narrator
          text: 强尼吓得猛跳起来。小草丛后面，一只陌生的土拨鼠正狠狠瞪着他。那家伙年纪不小，个头很大，一身灰毛。强尼以前从没在绿草地见过他。他没有一丁点儿害怕的样子，真的，连一丁点儿也没有！强尼心里一下觉得，自己根本没有几分钟前那么高大、强壮、勇敢了。可他绝不能让陌生家伙看出来。当然不能！所以，哪怕心里觉得自己小得可怜，他还是把全身的毛竖得高高的，拼命装出凶狠的样子。
        - id: ch01-b07
          speaker: johnny_chuck
          text: “你是谁？到我的绿草地来干什么？”
        - id: ch01-b08
          speaker: narrator
          text: 强尼厉声问道。陌生土拨鼠却刺耳地大笑起来。
        - id: ch01-b09
          speaker: gray_old_chuck
          text: “你的绿草地？哈，哈，哈！这里什么时候成你的了？我刚从老牧场下来，觉得这地方不错，正打算留下呢。快走吧，小小吹牛大王！这里可住不下我们两个。你还是趁早滚开的好。”
        - id: ch01-b10
          speaker: narrator
          text: 说完，陌生土拨鼠露出满口牙齿，凶巴巴地磨了几下。强尼顿时火冒三丈。一个外来的家伙，竟然命令他离开绿草地！强尼生在这里，从小到大也一直住在这里，简直不敢相信自己的耳朵。他，土拨鼠强尼，一定要让这个陌生家伙瞧瞧，谁才是这里的主人。
        - id: ch01-b11
          speaker: narrator
          text: 强尼气得尖叫一声，朝灰色老土拨鼠扑了过去。一场恶战就这样开始了。西风妈妈的快乐小微风们从来没见过这么凶的打斗。她们急得在旁边团团转。
        - id: ch01-b12
          speakers: [merry_breeze_1, merry_breeze_2, merry_breeze_3]
          ensemble: chorus
          text: “太可怕了！”
          emotion: fearful
        - id: ch01-b13
          speaker: narrator
          text: 小微风们都盼着强尼获胜，因为她们非常喜欢他。两个小小的对手滚来滚去，又咬又抓，又撕又扯，嘴里还不停地低吼、咆哮。快活、滚圆、红彤彤的太阳先生不愿看这么可怕的场面，便躲到一朵云后面，用云遮住了自己的脸。
        - id: ch01-b14
          speaker: narrator
          text: 陌生土拨鼠打过许多架，狡猾得很。有一阵子，强尼渐渐落了下风。他开始担心，忍不住想，难道自己真的要离开绿草地吗？这个念头又激起了他的怒火。他越打越狠，比先前更加拼命。
        - id: ch01-b15
          speaker: narrator
          text: 不过，陌生土拨鼠毕竟老了，牙齿早已磨损。强尼还年轻，牙齿却锋利得很。打了很久很久以后，强尼感觉对手越来越没力气，便打得越发起劲。
        - id: ch01-b16
          speaker: gray_old_chuck
          text: “够了！”
        - id: ch01-b17
          speaker: narrator
          text: 陌生土拨鼠终于喊了出来。等到终于找到机会，他一挣脱强尼，就转身朝老牧场逃去。
        - id: ch01-b18
          speaker: narrator
          text: 土拨鼠强尼赢了！
