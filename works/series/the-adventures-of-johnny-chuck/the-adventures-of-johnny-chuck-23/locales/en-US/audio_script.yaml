audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm, lively storytelling with a gentle sense of wonder
        timbre: clear and rounded
        pace: measured
        pitch: medium
    johnny_chuck:
      display_name: Johnny Chuck
      tts:
        delivery: plainspoken, friendly, and a little gruff when bothered
        timbre: warm and earthy
        pace: relaxed
        pitch: medium-low
    sammy_jay:
      display_name: Sammy Jay
      tts:
        delivery: quick, curious, and openly delighted by a secret
        timbre: bright and crisp
        pace: brisk
        pitch: medium-high
  chapters:
    - id: ch01
      title: The School in the Old Orchard
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Little Foxes, little Chucks, little Squirrels, Mice, and Mink go to school, just like little boys and girls. That is where they learn to think.
        - id: ch01-b02
          speaker: narrator
          text: You didn't know that, did you? Well, it is a fact. Yes, sir, it truly is. Every baby born in the Green Forest, on the Green Meadows, or around the Smiling Pool must start school as soon as it is old enough to leave its own doorstep. They all attend the greatest school in the world. It is called the School of Experience.
        - id: ch01-b03
          speaker: narrator
          text: Old Mother Nature is in charge, though fathers and mothers usually teach the first few weeks. After that, Old Mother Nature gives the youngsters some lessons herself. She is a very stern teacher. They simply have to learn what she teaches, because something dreadful is almost sure to happen if they do not.
        - id: ch01-b04
          speaker: narrator
          text: Of course Sammy Jay knew all about that. He had gone to school himself when he was little. So he wasn't very surprised when he found a school right there in Farmer Brown's old orchard. Sammy was snug in his hiding place among the branches of an old apple tree. From there, he could see Johnny Chuck teaching his three baby Chucks.
        - id: ch01-b05
          speaker: narrator
          text: That funny little school interested Sammy so much that he forgot all about making mischief.
        - id: ch01-b06
          speaker: narrator
          text: The first lesson for the three little Chucks was obedience, and Johnny was very particular about it. He knew they had to learn that lesson before any of the others would do much good. When he gave an order, they must obey at once, without stopping to ask questions.
        - id: ch01-b07
          speaker: narrator
          text: Dear me, dear me, Johnny certainly had his hands full! Those three little fellows were so lively. There were so many new and wonderful things to see that sitting perfectly still just because Johnny told them to was terribly hard.
        - id: ch01-b08
          speaker: narrator
          text: But if they did not obey right away, Johnny gave their ears a sound boxing. Sometimes he sent them back into the house without even one taste of the sweet, tender young clover they loved so much.
        - id: ch01-b09
          speaker: narrator
          text: After a few lessons like that, the little Chucks discovered it was always best to obey at once. Then Johnny began teaching them other things that every Chuck needs to know.
        - id: ch01-b10
          speaker: narrator
          text: First came the signals. One special whistle from Johnny meant that a stranger was in sight and there might be danger.
        - id: ch01-b11
          speaker: narrator
          text: At that whistle, each little Chuck sat up very straight and kept perfectly still. From a short distance, the three of them looked just like tiny stumps. Only their sharp little eyes moved, looking this way and that for whatever the danger might be.
        - id: ch01-b12
          speaker: narrator
          text: After a while, Johnny gave another little whistle to tell them the danger had passed. Then the youngsters went right back to filling their little stomachs with sweet, tender young clover.
        - id: ch01-b13
          speaker: narrator
          text: Sometimes Johnny gave a sharp whistle instead. That one meant they must run. Off they scampered as fast as they could, following the nearest little path to the house beneath the old apple tree in the far corner. Not one of them looked back.
        - id: ch01-b14
          speaker: narrator
          text: One after another, they dived headfirst through the doorway. They did not poke so much as a nose outside again until Johnny or Polly Chuck told them they could.
        - id: ch01-b15
          speaker: narrator
          text: Johnny had one more whistle, different from all the others. It warned them that danger was very close and they must lie low. Wherever the little Chucks happened to be, they flattened themselves against the grass. They held their breath and never moved until Johnny gave them permission.
        - id: ch01-b16
          speaker: narrator
          text: Of course there was no real danger during any of these lessons. Johnny was only preparing his children. Real danger was sure to come sooner or later, and when it did, they would know exactly what to do.
        - id: ch01-b17
          speaker: narrator
          text: It truly was a funny little school. Sometimes Sammy Jay could hardly keep from laughing aloud.
