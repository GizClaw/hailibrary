audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖亲切，带着轻快而含蓄的幽默
        timbre: 清亮柔和
        pace: 舒缓而有变化
        pitch: 中等
  chapters:
    - id: ch01
      title: 世上最大的学校
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 小狐狸、小土拨鼠、小松鼠，还有小老鼠和小水貂，都跟小男孩、小女孩一样，也要上学校学习怎样动脑筋。
        - id: ch01-b02
          speaker: narrator
          text: 你以前不知道吧？可这是真的。是的，先生，千真万确。绿森林、绿草地和微笑池塘周围出生的宝宝，只要长大到能离开自家门阶，就得去上学。
        - id: ch01-b03
          speaker: narrator
          text: 他们上的，是世上最大的一所学校，名字叫“经验学校”。大自然老妈妈掌管这所学校，不过在最初几个星期里，教课的通常是爸爸妈妈。
        - id: ch01-b04
          speaker: narrator
          text: 再往后，大自然老妈妈就要亲自来上几课了。她可是个非常严厉的老师。她教的功课，孩子们非学会不可。学不会，十有八九就会碰上可怕的事情。
    - id: ch02
      title: 强尼的第一课
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 松鸦萨米当然明白这些，因为他小时候也上过这所学校。所以，他舒舒服服地藏在一棵老苹果树上，发现布朗农夫的老果园里也开了学校，并没有多么吃惊。
        - id: ch02-b02
          speaker: narrator
          text: 土拨鼠强尼当老师，三个土拨鼠宝宝当学生。这所小学校实在滑稽又有趣，萨米看得出了神，连淘气都忘了。
        - id: ch02-b03
          speaker: narrator
          text: 三个孩子最先要学的，是听话。强尼对这一课格外认真。他很清楚，这一课要是没先学好，后面的本领学得再多，也派不上多少用场。孩子们必须一听吩咐就照办，不能追问。
        - id: ch02-b04
          speaker: narrator
          text: 哎呀呀，要让三个小家伙乖乖听话，强尼可真忙坏了！他们个个活泼好动，四周又到处是没见过的新鲜东西。只因为爸爸叫他们坐好，就得一动不动，这实在太难啦。
        - id: ch02-b05
          speaker: narrator
          text: 可他们要是不马上照办，耳朵准会挨一顿结结实实的拍打。有时候，他们还会被赶回家，连最爱吃的鲜嫩香甜的三叶草也尝不到一口。
        - id: ch02-b06
          speaker: narrator
          text: 这样上过几堂课，三个孩子总算懂了，立刻听话才最稳妥。强尼便开始教别的本领，那些本领，每一只土拨鼠都非懂不可。
    - id: ch03
      title: 各种口哨信号
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 首先要学的是信号。强尼用一种调子吹口哨，就是在说：“看见陌生人，可能有危险！”
        - id: ch03-b02
          speaker: narrator
          text: 三只小土拨鼠一听，马上把身子挺得直直的，一丁点儿也不动。从稍远的地方看过去，他们活像几截小树桩。不过，那几双机灵的小眼睛一直东瞧西看，想弄清危险到底是什么。
        - id: ch03-b03
          speaker: narrator
          text: 过一会儿，强尼会换一种口哨，告诉他们：“危险过去了。”三个小家伙这才继续吃鲜嫩香甜的三叶草，把小肚皮填得饱饱的。
        - id: ch03-b04
          speaker: narrator
          text: 有时，强尼会尖利地吹上一声。那是在说：“快跑！”孩子们立刻沿着最近的小路，拼命奔向远处角落那棵老苹果树下的家，一次也不回头。
        - id: ch03-b05
          speaker: narrator
          text: 他们一个接一个，脑袋朝前，一头扎进门洞。直到强尼或土拨鼠波莉准许他们出来，谁也不会再把鼻子露到外面。
    - id: ch04
      title: 趴在草丛里的功课
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 强尼还有一种完全不同的口哨。它的意思是：“危险就在近处，快趴下！”
        - id: ch04-b02
          speaker: narrator
          text: 不管三个孩子当时走到了哪里，只要听见这个信号，就立刻紧贴着草地伏下去。他们屏住呼吸，一动也不动，一直等到强尼发出可以起来的信号。
        - id: ch04-b03
          speaker: narrator
          text: 当然啦，那时候并没有真正的危险。强尼只是在教孩子们该怎么应付。因为真正的危险迟早会来，等它来了，他们就知道该做什么了。
        - id: ch04-b04
          speaker: narrator
          text: 老果园里的这所小学校，真是滑稽极了。有时候，躲在树上的松鸦萨米得费好大劲，才能忍住不放声笑出来。
