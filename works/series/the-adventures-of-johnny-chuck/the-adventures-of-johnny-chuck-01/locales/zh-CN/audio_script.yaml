audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖亲切，带着轻快而含蓄的幽默
        timbre: 清亮柔和
        pace: 舒缓而有变化
        pitch: 中等
    news_bearer:
      display_name: 报信者
      tts:
        delivery: 欢快响亮，像在把好消息传遍原野
        timbre: 明亮清脆
        pace: 轻快
        pitch: 中高
    peter_rabbit:
      display_name: 兔子彼得
      tts:
        delivery: 好奇直率，带一点孩子气的困惑
        timbre: 清脆灵活
        pace: 稍快
        pitch: 中高
    sister_south_wind:
      display_name: 南风姐姐
      tts:
        delivery: 温柔从容，话里带着亲切的笑意
        timbre: 轻柔温暖
        pace: 舒缓
        pitch: 中等
  chapters:
    - id: ch01
      title: 第一章　温柔的南风姐姐来了
      blocks:
        - id: ch01-b01
          speaker: news_bearer
          text: “好消息，好消息，天上地下都听好！俊俏的蓝鸟公子已经来到，要用口哨把白雪赶跑！”
          emotion: happy
        - id: ch01-b02
          speaker: narrator
          text: 消息已经传遍了绿草原和绿森林，这都是兔子彼得四处报信的功劳。每个小居民听说以后，都赶紧跑出来亲耳听一听，好确定消息是真的。蓝鸟公子那甜甜的歌声一响，他们便高高踢起脚跟，欢呼叫好。
        - id: ch01-b03
          speaker: narrator
          text: 大家心里明白，蓝鸟公子飞到以后，温柔的南风姐姐很快就会跟来。等她抵达时，又凶又爱吼的北风哥哥早就在回北国的路上了。那里冷得很，冰雪一年到头都不会融化。
        - id: ch01-b04
          speaker: narrator
          text: 蓝鸟公子当然不可能真的吹一声口哨，就把雪赶走。不过，他来了以后，积雪总是化得特别快，看起来就像是他吹化的一样。你瞧，一点好消息带来的变化可真大。
        - id: ch01-b05
          speaker: narrator
          text: 蓝鸟公子的哨声刚在草原和森林里响起时，周围其实还是老样子。可大家觉得，一切都已经不同了。那甜美的歌声带来了一个保证，而且人人都知道，这个保证一定会成真。绿草原和绿森林里的每一颗心都快活起来。连总是板着脸的老狐狸奶奶也不例外。红狐狸雷迪更是难得地和彼得好好说话，还问他身子怎么样。
        - id: ch01-b06
          speaker: narrator
          text: 随后，温柔的南风姐姐终于到了。她趁着夜色来到这里。第二天一早，她已经忙着为春姑娘打点绿草原和绿森林了。微笑池和欢笑溪被冰困了很久，她一来，冰的绳索便断开了。微笑池重新露出笑脸，欢笑溪也先是轻轻咕噜，接着笑出声，最后唱起欢快的歌。
        - id: ch01-b07
          speaker: narrator
          text: 地上还留着几小堆雪。南风姐姐伸手一碰，它们马上就化得无影无踪。她又亲了亲负鼠比利叔叔的八个宝宝。负鼠太太原本把他们好好盖在被窝里，孩子们却一脚蹬开被子，抢着爬出大空心树玩去了。
        - id: ch01-b08
          speaker: narrator
          text: 南风姐姐来到土拨鼠强尼门前，探头进去，轻轻叫了他一声。睡了很久的强尼醒了。他打个哈欠，心想，自己也该起床啦。
        - id: ch01-b09
          speaker: narrator
          text: 她又敲响獾迪格的门，把迪格叫醒。花栗鼠条纹本来已经醒了一半，她挠挠他的鼻尖，他打了个喷嚏，立刻跳下床，奔到门口，追着她大声说早安。这时，她正赶去瞧浣熊博比还睡没睡呢。
        - id: ch01-b10
          speaker: narrator
          text: 兔子彼得一直跟在南风姐姐身后，越看越不明白。听见她在强尼门外那么轻地叫人时，他还偷偷笑过。整个冬天，彼得一次又一次站在这里，扯着嗓门朝长长的地道深处喊，可从来没能叫醒强尼。
        - id: ch01-b11
          speaker: narrator
          text: 现在呢？南风姐姐只低低地唤了一声，彼得就听到了强尼的哈欠。他吃惊得险些翻倒在地。
        - id: ch01-b12
          speaker: peter_rabbit
          text: “她是怎么办到的呀？我怎么想也想不通。”
          emotion: surprised
        - id: ch01-b13
          speaker: narrator
          text: 彼得说着，还用长长的左后腿挠了挠自己长长的左耳朵。南风姐姐看着他，笑了起来。
        - id: ch01-b14
          speaker: sister_south_wind
          text: “彼得，这世上有好多事情，你怎么也不会弄明白。你只要相信它们，知道事情的确如此，也就够了。”
        - id: ch01-b15
          speaker: narrator
          text: 说完，南风姐姐便匆匆赶去绿森林。她要告诉负鼠比利叔叔，他的老朋友秃鹰老爷已经离开老弗吉尼亚，正在一路往北赶来。
