  chapters:
    - id: ch01
      title: Gentle Sister South Wind Arrives
      blocks:
        - id: ch01-b01
          speaker: news_crier
          text: "Good news, good news for everyone, above or down below! Master Winsome Bluebird has come to whistle off the snow!"
        - id: ch01-b02
          speaker: narrator
          text: All across the Green Meadows and the Green Forest, everyone had heard. Peter Rabbit had made sure of that. As soon as the little meadow and forest folk got the news, each one hurried outside to listen and find out if it was true. Then they heard Winsome Bluebird's sweet voice.
        - id: ch01-b03
          speakers: [meadow_voice_1, meadow_voice_2, meadow_voice_3]
          ensemble: chorus
          text: Hurrah!
          emotion: happy
        - id: ch01-b04
          speaker: narrator
          text: Heels flew up everywhere. They all knew Winsome Bluebird never came very far ahead of gentle Sister South Wind. Once she arrived, rough old Brother North Wind would already be heading back to that cold, cold country where the ice never melts.
        - id: ch01-b05
          speaker: narrator
          text: Now, Winsome Bluebird did not truly whistle the snow away. Still, after he came, it vanished so quickly that you might think he had. That is what a little good news can do. On the first day his whistle rang over the Green Meadows and through the Green Forest, nothing had changed yet. But everything felt different. His sweet whistle carried a promise, and everyone knew that promise would come true.
        - id: ch01-b06
          speaker: narrator
          text: Joy filled every heart in the meadows and the forest. Even grim old Granny Fox felt it. And Reddy Fox? Why, Reddy called pleasantly to Peter Rabbit and hoped Peter was feeling well.
        - id: ch01-b07
          speaker: narrator
          text: Then gentle Sister South Wind arrived. She came during the night. By morning, there she was, already busy getting the Green Meadows and the Green Forest ready for Mistress Spring. The Smiling Pool and the Laughing Brook had been held tight by ice for so long. Sister South Wind broke those icy bands. The Smiling Pool began to smile again. The Laughing Brook first gurgled, then laughed, and at last sang merrily.
        - id: ch01-b08
          speaker: narrator
          text: A few little banks of snow still remained. Sister South Wind touched them, and at once they melted away. Then she kissed Unc' Billy Possum's eight babies. Old Mrs. Possum had tucked them beneath the bedclothes, but out they came. They kicked the covers aside, scrambled from the big hollow tree, and went to play.
        - id: ch01-b09
          speaker: narrator
          text: Next, Sister South Wind peeped through Johnny Chuck's doorway and called to him in a soft voice. Johnny woke from his long sleep. He yawned and began thinking it might be time to get up.
        - id: ch01-b10
          speaker: narrator
          text: She knocked at Digger the Badger's door, and Digger woke up. Striped Chipmunk was only half awake when she tickled his nose. He sneezed, jumped out of bed, and hurried to his doorway. He called good morning after her as she went on to see whether Bobby Coon was still asleep.
        - id: ch01-b11
          speaker: narrator
          text: Peter Rabbit followed Sister South Wind everywhere, and he could not make sense of what he saw. When she called so softly into Johnny Chuck's doorway, Peter smiled to himself. All winter long, he had stopped at Johnny's house again and again. He had shouted down the long hallway as loudly as he could, and not once had Johnny awakened.
        - id: ch01-b12
          speaker: narrator
          text: But now, at Sister South Wind's very first quiet call, Peter heard Johnny Chuck yawn. Peter was so surprised that he nearly fell over. He lifted his long left hind leg and scratched his long left ear.
        - id: ch01-b13
          speaker: peter_rabbit
          text: "How can she do that? I just don't understand it!"
          emotion: surprised
        - id: ch01-b14
          speaker: narrator
          text: Gentle Sister South Wind smiled at Peter.
        - id: ch01-b15
          speaker: sister_south_wind
          text: "Peter Rabbit, there are many things in this world that you will never understand. You simply have to believe them, even without understanding, and be satisfied to know they are true."
        - id: ch01-b16
          speaker: narrator
          text: Then she hurried over to the Green Forest. She had news for Unc' Billy Possum. His old friend, Ol' Mistah Buzzard, was traveling up from ol' Virginny.
