audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm, lively storytelling with a gentle sense of wonder
        timbre: clear and rounded
        pace: measured
        pitch: medium
    johnny_chuck:
      display_name: Johnny Chuck
      tts:
        delivery: good-natured, thoughtful, and quick to brighten with discovery
        timbre: warm and youthful
        pace: moderate
        pitch: medium
    chatterer:
      display_name: Chatterer the Red Squirrel
      tts:
        delivery: sharp, brisk, and confidently inquisitive
        timbre: bright and wiry
        pace: quick
        pitch: high
  chapters:
    - id: ch01
      title: Another Strange Chuck
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Johnny Chuck woke just as jolly, round, red Mr. Sun took off his nightcap. For a moment, Johnny could not remember where he was. He blinked several times, then rolled over.
        - id: ch01-b02
          speaker: johnny_chuck
          text: "Ouch!"
        - id: ch01-b03
          speaker: narrator
          text: Johnny was stiff and sore after his great fight the day before, so even rolling over hurt. The sting of his wounds brought everything back. Just before dark, he had found this old hollow log at the edge of the Green Meadows. He had never slept anywhere but underground before. Lying there and blinking, he thought the log felt strange, but rather nice too.
        - id: ch01-b04
          speaker: chatterer
          text: "Well, well! What are you doing in there?"
        - id: ch01-b05
          speaker: narrator
          text: Johnny looked toward the open end of the log. A little face was peeping in, and it looked every bit as sharp as the voice had sounded.
        - id: ch01-b06
          speaker: johnny_chuck
          text: "Hello, Chatterer!"
        - id: ch01-b07
          speaker: chatterer
          text: "But what are you doing here?"
        - id: ch01-b08
          speaker: narrator
          text: It was Chatterer the Red Squirrel, and he would not let the question go.
        - id: ch01-b09
          speaker: johnny_chuck
          text: "I'm just waking up."
        - id: ch01-b10
          speaker: narrator
          text: Johnny answered with a grin.
        - id: ch01-b11
          speaker: chatterer
          text: "It's about time. But you still haven't told me why you're so far from home."
        - id: ch01-b12
          speaker: johnny_chuck
          text: "I don't have a home anymore."
        - id: ch01-b13
          speaker: narrator
          text: Johnny looked just a little wistful as he said it.
        - id: ch01-b14
          speaker: chatterer
          text: "You don't have a home? What happened to it?"
          emotion: surprised
        - id: ch01-b15
          speaker: narrator
          text: Chatterer sounded as though he could not believe his ears.
        - id: ch01-b16
          speaker: johnny_chuck
          text: "I gave it to Jimmy Skunk."
        - id: ch01-b17
          speaker: narrator
          text: Chatterer never gave anything to anybody. He simply could not understand how anyone could give away a home. He stared at Johnny as though Johnny had lost his mind. At last, he found his voice.
        - id: ch01-b18
          speaker: chatterer
          text: "I don't believe you! If Jimmy Skunk has your old home, he must have chased you out."
          emotion: angry
        - id: ch01-b19
          speaker: johnny_chuck
          text: "He did nothing of the kind! I'd like to see Jimmy Skunk, or anyone else, try to put me out of my own home. I gave it to him because I was through with it. I'm going to see the world, and then I'll build a new home. Everyone else seems to be building this spring, so why shouldn't I?"
          emotion: angry
        - id: ch01-b20
          speaker: narrator
          text: Johnny spoke scornfully.
        - id: ch01-b21
          speaker: chatterer
          text: "Well, I'm not building! I know when I have a good thing. A discontented heart, you see, is sure to make its owner sorry."
        - id: ch01-b22
          speaker: narrator
          text: Johnny crawled out of the old log and stretched, though it hurt a little.
        - id: ch01-b23
          speaker: johnny_chuck
          text: "Maybe so, but there is more than one kind of discontent. If you never look for anything better, you'll spend your whole life going around in little rings. Well, if I'm going to see the world, I'd better get moving."
        - id: ch01-b24
          speaker: narrator
          text: Johnny said good-by to Chatterer and went on his way. It was delightful to wander across the Green Meadows on such a beautiful spring morning. The violets and windflowers nodded to him, and the dandelions smiled up at him. Before long, Johnny almost forgot his torn clothes and all the bites and scratches from his fight with the old gray Chuck. He could go wherever he pleased, without a care in the world, and that was fun.
        - id: ch01-b25
          speaker: narrator
          text: Johnny sat up to look across the Green Meadows, still thinking how pleasant it all was. Then his heart gave a great thump. What was that near the lone elm tree? Yes, there could be no mistake. It was another Chuck! Could the old gray Chuck have come back for another fight?
        - id: ch01-b26
          speaker: narrator
          text: Anger filled Johnny's heart. He gave a sharp whistle, but the strange Chuck did not answer. Johnny ground his teeth and set off for the lone elm tree. He would show this other Chuck who was master of the Green Meadows!
