audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖亲切，带着轻快而含蓄的幽默
        timbre: 清亮柔和
        pace: 舒缓而有变化
        pitch: 中等
    johnny_chuck:
      display_name: 土拨鼠强尼
      tts:
        delivery: 朴实直爽，偶尔带一点不耐烦
        timbre: 浑厚温暖
        pace: 中等
        pitch: 中低
    chatterer:
      display_name: 红松鼠喳喳
      tts:
        delivery: 机敏急促，爱追问，话里常带几分尖刻
        timbre: 清脆尖亮
        pace: 稍快
        pitch: 中高
  chapters:
    - id: ch01
      title: 第九章　另一只陌生的土拨鼠
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 快活、滚圆、红彤彤的太阳先生刚摘下睡帽，土拨鼠强尼就醒了。起初，他完全想不起自己在哪儿，只顾眨眼睛。他翻了个身，伤口立刻疼了起来。
        - id: ch01-b02
          speaker: johnny_chuck
          text: “哎哟，好疼！”
        - id: ch01-b03
          speaker: narrator
          text: 前一天那场恶战，让强尼浑身又僵又痛。伤口这一刺痛，他才记起来，自己睡在绿草地边缘那根中空的老倒木里。强尼以前一直住在地底下，这还是头一回睡在地面上。他躺着眨了眨眼，觉得怪新鲜的，倒也挺舒服。
        - id: ch01-b04
          speaker: chatterer
          text: “嘿，嘿，嘿！你在这儿干什么？”
        - id: ch01-b05
          speaker: narrator
          text: 这声音尖厉得很。强尼朝倒木敞开的那一头看去，只见一张小小的尖脸探了进来。那张脸，简直跟声音一样尖。
        - id: ch01-b06
          speaker: johnny_chuck
          text: “你好啊，喳喳！”
        - id: ch01-b07
          speaker: chatterer
          text: “我正问你呢，你跑到这里来干什么？”
        - id: ch01-b08
          speaker: narrator
          text: 原来，来的是红松鼠喳喳。他非要问个明白不可。
        - id: ch01-b09
          speaker: johnny_chuck
          text: “我刚刚睡醒。”
        - id: ch01-b10
          speaker: narrator
          text: 强尼说着，咧嘴笑了笑。
        - id: ch01-b11
          speaker: chatterer
          text: “你也该醒了。可我问的是，你为什么跑到离家这么远的地方来？”
        - id: ch01-b12
          speaker: johnny_chuck
          text: “我已经没有家了。”
          emotion: sad
        - id: ch01-b13
          speaker: narrator
          text: 强尼脸上掠过一丝惆怅。喳喳听了，简直不敢相信自己的耳朵。
        - id: ch01-b14
          speaker: chatterer
          text: “你没有家了？你的家怎么啦？”
          emotion: surprised
        - id: ch01-b15
          speaker: johnny_chuck
          text: “我把它送给臭鼬吉米了。”
        - id: ch01-b16
          speaker: narrator
          text: 喳喳从来不把任何东西送给别人。他怎么也想不通，世上竟有人肯把自己的家送出去。他瞪着强尼，觉得强尼一定是疯了。好半天，他才又开口。
        - id: ch01-b17
          speaker: chatterer
          text: “我才不信呢！臭鼬吉米要是住进了你的老家，准是他把你赶出来了。”
          emotion: angry
        - id: ch01-b18
          speaker: johnny_chuck
          text: “才不是呢！臭鼬吉米也好，别人也好，我倒要看看谁能把我赶出自己的家！那所房子是我不想住了，才送给他的。我要去见识这个世界，回来再给自己造一所新房子。今年春天，大家好像都在造新家，我为什么不能造？”
        - id: ch01-b19
          speaker: narrator
          text: 强尼轻蔑地说完，喳喳马上顶了回去。
        - id: ch01-b20
          speaker: chatterer
          text: “我就不造！我过得这么舒服，难道自己还不知道吗？心里总是嫌不够，到头准会吃苦头。”
        - id: ch01-b21
          speaker: narrator
          text: 强尼从老倒木里爬出来，忍着浑身的疼，慢慢伸了个懒腰。
        - id: ch01-b22
          speaker: johnny_chuck
          text: “也许吧，可不知足也分好多种。从来不把好处寻，一生只在小圈里混。好啦，我要想见识这个世界，就得继续赶路了。”
        - id: ch01-b23
          speaker: narrator
          text: 强尼向喳喳道了别，又上路了。春天的早晨这么美，走在绿草地上实在舒服。紫罗兰和银莲花朝他点头，蒲公英仰着脸冲他微笑。强尼几乎忘了破烂的衣服，也忘了前一天跟灰色老土拨鼠打架留下的抓痕和咬伤。想去哪里就去哪里，什么都不用操心，可真快活。
        - id: ch01-b24
          speaker: narrator
          text: 他正想着这些，便坐起身，朝绿草地上望去。忽然，他的心猛地一跳。孤零零的榆树旁边，那是什么？那是另一只土拨鼠，绝不会错！难道灰色老土拨鼠又回来找他打架了？强尼顿时怒火中烧，尖厉地吹了一声口哨。可那只陌生的土拨鼠没有回应。
        - id: ch01-b25
          speaker: narrator
          text: 强尼咬紧牙齿，朝孤零零的榆树走去。他非要让对方明白，谁才是绿草地的主人！
