audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖亲切，带着轻快而含蓄的幽默
        timbre: 清亮柔和
        pace: 舒缓而有变化
        pitch: 中等
    johnny_chuck:
      display_name: 土拨鼠强尼
      tts:
        delivery: 朴实直爽，偶尔带一点不耐烦
        timbre: 浑厚温暖
        pace: 中等
        pitch: 中低
    polly_chuck:
      display_name: 土拨鼠波莉
      tts:
        delivery: 温柔腼腆，说话小心而真诚
        timbre: 轻柔清甜
        pace: 稍慢
        pitch: 中高
  chapters:
    - id: ch01
      title: 第十四章　终于有了新家
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 家在哪里并不重要，房子是大是小也不重要。因为在这个世上，最最可爱的地方，就是自己的家。
        - id: ch01-b02
          speaker: narrator
          text: 强尼正使出浑身力气干活，心里想的就是这个道理。他盖的是一座新房子，可在他心里，这里已经是家了。每想到一次，他心头就多一分奇妙的牵挂。因为这不只是他的家，也是波莉的家。房子还没完工，强尼已经觉得它格外珍贵。
        - id: ch01-b03
          speaker: narrator
          text: 你猜，这座新家造在哪里？它远在农夫布朗家的老果园边上！没错。强尼从前那么不愿意让别的土拨鼠住在绿草地，还把灰毛老土拨鼠赶回了老牧场。可最后，离开绿草地的竟是他自己。
        - id: ch01-b04
          speaker: narrator
          text: 其实，强尼一点也不想走。他那么爱绿草地，怎么舍得离开呢？可是，他更爱波莉。所以他嘴上虽然嘟囔了几句，还是一路跟她来到老果园，准备在这里住下。只是想到农夫布朗、农夫布朗家的男孩和猎犬鲍泽都在附近，他有时还是会吓得打个寒战。
        - id: ch01-b05
          speaker: narrator
          text: 强尼从来没有走到离老家这么远的地方，眼前的一切都很陌生，却也很美。波莉正是在这片老果园里出生的，这里的每个角落她都熟悉。知道这件事以后，强尼安心多了。
        - id: ch01-b06
          speaker: narrator
          text: 他认真动手盖起房子，这回也彻底拿定了主意。往后波莉想改多少次主意都行，反正这里就是他们的家，他们就要住在这里。
        - id: ch01-b07
          speaker: narrator
          text: 自从头一回逃离出生的家，强尼已经见过了不少世面。他后来又盖过两座房子，也知道怎样把这一座盖得比前两座更好。波莉想让他在另一个地方挖，见他不肯，便撅起嘴来。强尼没有理会，只顾在一棵棵高大的老苹果树之间仔细寻找。
        - id: ch01-b08
          speaker: narrator
          text: 他一直找到果园尽头。那里靠着一堵塌下来的石墙，角落里长着最后一棵苹果树。树下有两条向外伸展的粗根，强尼一看就知道，自己可以从两条根中间挖进去。
        - id: ch01-b09
          speaker: narrator
          text: 波莉看着他准备开工，嘴撅得更高了。
        - id: ch01-b10
          speaker: polly_chuck
          text: “那边的草地明明更漂亮，泥土也更好挖呀。”
        - id: ch01-b11
          speaker: narrator
          text: 强尼笑了笑，继续往外刨土。等他停下来喘气，才开口回答。
        - id: ch01-b12
          speaker: johnny_chuck
          text: “那里当然好挖。可要是鲍泽或者狐狸奶奶来挖我们，他们也会觉得很省事。这两条老树根隔得刚刚好，我们能进能出，就像有了一道漂亮的门。鲍泽却钻不过来，也没法把洞口挖宽。住在这里，不是安全得多吗？”
        - id: ch01-b13
          speaker: narrator
          text: 波莉只好承认，这里确实比空荡荡的草地安全。强尼便接着挖。他先挖出一条长通道，直通地底深处那间舒适的卧室。然后，他又从卧室往后挖出一条长通道。这次挖出的沙土，他全都从前门搬了出去。
        - id: ch01-b14
          speaker: narrator
          text: 挖到后来，强尼在后通道尽头开出了一扇门。门外正好挡着一块从古老石墙上掉下来的大石头。谁从那里经过，也不会猜到石头后面还藏着一道出口。
        - id: ch01-b15
          speaker: narrator
          text: 新房子终于盖好了。强尼和波莉一起坐在门阶上，看着快活、浑圆、红彤彤的太阳先生落到紫山后面去睡觉。他们俩幸福极了。
