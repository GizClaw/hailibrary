audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm, lively storytelling with a gentle sense of wonder
        timbre: clear and rounded
        pace: measured
        pitch: medium
    johnny_chuck:
      display_name: Johnny Chuck
      tts:
        delivery: plainspoken, friendly, and a little gruff when bothered
        timbre: warm and earthy
        pace: relaxed
        pitch: medium-low
    polly_chuck:
      display_name: Polly Chuck
      tts:
        delivery: gentle, shy, and plainly spoken
        timbre: soft and youthful
        pace: measured
        pitch: medium-high
  chapters:
    - id: ch01
      title: A New Home at Last
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Home may be anywhere, and it may be big or small. But of all the places in the world, home is the one we love most of all.
        - id: ch01-b02
          speaker: narrator
          text: Johnny Chuck thought about that as he worked with all his might. He was building a new house, but it already felt like home. Each time he thought of it, he felt a strange little tug at his heart. This home would belong to Polly Chuck as well as Johnny, and that made it twice as dear to him before it was even finished.
        - id: ch01-b03
          speaker: narrator
          text: And where was Johnny building? Far across the Green Meadows, right at the edge of Farmer Brown's old orchard! Yes, sir. Johnny had made a great fuss about another Chuck living on the Green Meadows. He had even driven the old gray Chuck back to the Old Pasture. Now Johnny himself had left the Green Meadows behind.
        - id: ch01-b04
          speaker: narrator
          text: Johnny had not left because he wanted to. No, indeed. He loved the Green Meadows far too much. But he loved Polly more. So, after grumbling a little, he had followed her up to the old orchard. That was where they planned to stay. Still, Johnny sometimes shivered when he remembered how close they were to Farmer Brown, Farmer Brown's boy, and Bowser the Hound.
        - id: ch01-b05
          speaker: narrator
          text: Johnny had never traveled so far from his old home, and everything up there seemed strange. It was lovely, too. Then he learned that Polly had been born in that very orchard and knew every corner of it. That made him feel better.
        - id: ch01-b06
          speaker: narrator
          text: Johnny went to work on their home, and this time he was determined. Polly could change her mind as often as she liked. This would be their home, and this was where they would live.
        - id: ch01-b07
          speaker: narrator
          text: Johnny had learned a great deal about the world since the day he first ran away from the home where he was born. He had built two homes since then. This third one would be better than either of them.
        - id: ch01-b08
          speaker: narrator
          text: Polly pouted because Johnny would not dig where she wanted, but he paid no attention. He inspected one big old apple tree after another. At last, in a corner near a broken-down stone wall, he found exactly the right place. Two wide roots spread apart with just enough room for him to dig between them.
        - id: ch01-b09
          speaker: narrator
          text: Polly watched Johnny getting ready to work, and she pouted again.
        - id: ch01-b10
          speaker: polly_chuck
          text: "That grassy spot would make a much nicer home. The digging would be much easier there, too."
        - id: ch01-b11
          speaker: narrator
          text: Johnny smiled and sent the dirt flying. When he paused to catch his breath, he answered her.
        - id: ch01-b12
          speaker: johnny_chuck
          text: "Oh, it would be easier to dig there. Easier for me, and easier for Bowser the Hound or old Granny Fox if either one tried to dig us out. These roots are just far enough apart for us to come and go. They'll make a fine doorway. Bowser can't squeeze through, and he can't dig the doorway any wider. See how much safer this place is?"
        - id: ch01-b13
          speaker: narrator
          text: Polly had to admit that Johnny's place was much safer than any home out in the open. So Johnny kept digging. First he made a long hallway that led down, deep beneath the ground, to the coziest bedroom he could build.
        - id: ch01-b14
          speaker: narrator
          text: Next he dug a long back hallway. He carried every bit of sand from that tunnel out through the front entrance. After a while, he opened a back door at the far end. It came out behind a large stone that had fallen from the old wall. No one would ever have guessed that a back door was hidden there.
        - id: ch01-b15
          speaker: narrator
          text: At last, the new house was finished.
        - id: ch01-b16
          speaker: narrator
          text: Johnny Chuck and Polly Chuck sat together on their doorstep. They watched jolly, round, red Mr. Sun go to bed behind the Purple Hills, and they were happy.
