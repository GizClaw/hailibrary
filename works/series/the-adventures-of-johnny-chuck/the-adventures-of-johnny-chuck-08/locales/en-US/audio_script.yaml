audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm, lively storytelling with a gentle sense of wonder
        timbre: clear and rounded
        pace: measured
        pitch: medium
    johnny_chuck:
      display_name: Johnny Chuck
      tts:
        delivery: good-natured, thoughtful, and quick to brighten with discovery
        timbre: warm and youthful
        pace: moderate
        pitch: medium
    mr_blacksnake:
      display_name: Mr. Blacksnake
      tts:
        delivery: sharp, threatening, and full of bluster
        timbre: thin and hissing
        pace: deliberate
        pitch: low
  chapters:
    - id: ch01
      title: Johnny Has Another Adventure
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Johnny Chuck lay flat on the cool, soft grass of the Green Meadows, trying to catch his breath. He was tired all over, and he hurt all over too. Scratches and bites covered his face. His clothes were torn, and a dozen sore places stung badly. Even so, Johnny was happy.
        - id: ch01-b02
          speaker: narrator
          text: He lifted his head and watched an old gray Chuck limp away toward the Old Pasture. Now and then, the old Chuck looked back and bared his teeth. But he never stopped. He kept going toward the Old Pasture, and Johnny smiled.
        - id: ch01-b03
          speaker: narrator
          text: It had been a tremendous fight. More than once, Johnny had believed he would have to give in. As he remembered that, he also remembered all his bragging before the fight, and he felt ashamed. What if he had lost? Johnny promised himself he would never brag or boast again. Still, if anyone came looking for a quarrel, Johnny meant to show that he was not afraid.
        - id: ch01-b04
          speaker: narrator
          text: Late afternoon had come by the time Johnny felt rested enough to move. He still needed somewhere to spend the night. Stiff and sore, he hobbled across the meadow until he reached the place where the Green Meadows meet the Green Forest.
        - id: ch01-b05
          speaker: narrator
          text: Jolly, round, red Mr. Sun was nearly ready for bed behind the Purple Hills. Shadows had begun to creep among the trees. Those shadows brought back the lonely feeling Johnny had known when he first left his old home. He had spent his whole life out on the Green Meadows, and the Green Forest frightened him at night.
        - id: ch01-b06
          speaker: narrator
          text: So Johnny did not enter the forest. He wandered along its edge instead, searching for a place to sleep. At last, he found a hollow log lying just out on the meadow. Johnny examined it with great care to make sure no one else was living there.
        - id: ch01-b07
          speaker: johnny_chuck
          text: "This is exactly the place I need!"
        - id: ch01-b08
          speaker: narrator
          text: At that very moment, a sharp, fierce hiss cut through the air. The hair rose on Johnny's neck, just as it always did at that sound. He turned and was not surprised to see Mr. Blacksnake close beside him. Mr. Blacksnake slid quickly to the old log and coiled himself across the entrance. Then he raised his head and flicked out his tongue as rudely as he could.
        - id: ch01-b09
          speaker: mr_blacksnake
          text: "Be on your way, Johnny Chuck! I've made up my mind to sleep here tonight."
          emotion: angry
        - id: ch01-b10
          speaker: narrator
          text: When Johnny was very small, he had been terribly afraid of Mr. Blacksnake, and with good reason. He had gone on fearing him ever since because he did not know any better. Mr. Blacksnake knew it. That was why he now tried to look as ugly as possible. But there was something he did not know. Johnny had just won a great fight.
        - id: ch01-b11
          speaker: narrator
          text: Winning an honest fight had left Johnny feeling strong and sure of himself. He looked closely at Mr. Blacksnake. Somehow, the snake did not seem half as big as Johnny had always imagined. Johnny had found the old log first, so he decided he had the better right to sleep there.
        - id: ch01-b12
          speaker: johnny_chuck
          text: "I was here first, and this log is mine to keep!"
          emotion: angry
        - id: ch01-b13
          speaker: narrator
          text: Johnny's answer came out with a snap. Every hair stood on end, and he gritted his teeth as he walked straight toward Mr. Blacksnake.
        - id: ch01-b14
          speaker: narrator
          text: Now, Mr. Blacksnake was a great bluffer, but deep down he was a coward. He gave a furious hiss and rushed straight at Johnny. He expected Johnny to turn and run. Johnny did not move away. He held his ground and showed every one of his sharp teeth. Mr. Blacksnake did not attack him after all. He slipped right past Johnny and sneaked off through the grass.
        - id: ch01-b15
          speaker: narrator
          text: Johnny Chuck gave a quiet chuckle and crawled into the hollow log.
        - id: ch01-b16
          speaker: johnny_chuck
          text: "A coward is the only one who runs away without a fight."
