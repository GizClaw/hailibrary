audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖亲切，带着轻快而含蓄的幽默
        timbre: 清亮柔和
        pace: 舒缓而有变化
        pitch: 中等
    johnny_chuck:
      display_name: 土拨鼠强尼
      tts:
        delivery: 朴实直爽，偶尔带一点不耐烦
        timbre: 浑厚温暖
        pace: 中等
        pitch: 中低
    blacksnake:
      display_name: 黑蛇先生
      tts:
        delivery: 阴冷傲慢，威吓时尖厉而咄咄逼人
        timbre: 细窄沙哑
        pace: 稍慢
        pitch: 中低
  chapters:
    - id: ch01
      title: 第八章　强尼又遇上一场冒险
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 土拨鼠强尼四肢摊开，趴在绿草地清凉柔软的草地上，呼哧呼哧喘着气。他累坏了，浑身疼得厉害。脸上有抓痕，也有咬伤，衣服破破烂烂，身上十几个地方都火辣辣的。可强尼还是很快活。他抬头一看，那只灰色老土拨鼠正一瘸一拐地走向老牧场。老家伙偶尔回头龇龇牙，却始终不停步，只管朝老牧场走。强尼笑了。
        - id: ch01-b02
          speaker: narrator
          text: 刚才那一架可真凶。有好几回，强尼都以为自己非认输不可。现在想起来，他又记起开打前吹过的那些牛，不由得害臊。要是自己输了呢？他暗暗发誓，以后再也不吹牛说大话了。不过，要是还有谁故意找他打架，他也一定会让对方知道，自己并不害怕。
        - id: ch01-b03
          speaker: narrator
          text: 等强尼终于觉得歇够了，能继续赶路，午后已经很晚。他得找个地方过夜。可他浑身僵硬，哪儿都疼，只能一瘸一拐地往前走，直到绿草地的边缘。那里正挨着绿森林。
        - id: ch01-b04
          speaker: narrator
          text: 快活、滚圆、红彤彤的太阳先生，就要到紫山后面睡觉去了。暮色已经悄悄爬进绿森林。那些阴影让强尼又觉得孤零零的，就像刚离开老家时一样。你知道，强尼一直住在开阔的绿草地上。夜里的绿森林，他总有些害怕。
        - id: ch01-b05
          speaker: narrator
          text: 所以，强尼没有走进绿森林，只沿着森林边缘慢慢游荡，寻找过夜的地方。最后，他在绿草地边上发现一根中空的倒木。他仔仔细细地检查了一遍，确定里面没有别的住客。
        - id: ch01-b06
          speaker: johnny_chuck
          text: “太好了，这正是我要找的地方！”
        - id: ch01-b07
          speaker: narrator
          text: 话音刚落，身后突然响起一声尖厉又凶狠的嘶叫。强尼一听见这种声音，颈后的毛总会竖起来，这回也一样。他转头看见黑蛇先生就在旁边，一点儿也不意外。黑蛇先生飞快地滑到老倒木前，盘起身子堵住洞口，又昂起脑袋，无礼地吐了吐舌头。
        - id: ch01-b08
          speaker: blacksnake
          text: “走开，土拨鼠强尼！今晚我要睡在这里！”
          emotion: angry
        - id: ch01-b09
          speaker: narrator
          text: 强尼还很小的时候，非常害怕黑蛇先生。那时候，他确实有害怕的理由。后来强尼一直不懂得更多的道理，这份害怕也就留到了现在。黑蛇先生知道这件事，便故意摆出自己所能摆出的最凶恶模样。可是，他不知道强尼刚打赢了一场恶战。
        - id: ch01-b10
          speaker: narrator
          text: 光明正大地赢过一架，会让人觉得自己很强壮，心里也更有把握。强尼看着黑蛇先生，忽然发现，他好像根本没有以前想的那么庞大。强尼拿定了主意，这根老倒木是自己先找到的，当然自己最有权住进去。
        - id: ch01-b11
          speaker: johnny_chuck
          text: “是我先找到的，我就要住在这儿！”
          emotion: angry
        - id: ch01-b12
          speaker: narrator
          text: 强尼厉声说完，全身的毛根根竖起，牙齿咬得紧紧的，径直朝黑蛇先生走去。黑蛇先生最会虚张声势，其实骨子里是个胆小鬼。他凶狠地嘶叫一声，直冲强尼扑来，满以为会看到强尼掉头逃跑。
        - id: ch01-b13
          speaker: narrator
          text: 可强尼站在原地，一步也不退，还露出了满口尖牙。黑蛇先生没有扑上去，反倒从强尼身边滑了过去，偷偷钻进草丛，溜走了。
        - id: ch01-b14
          speaker: narrator
          text: 强尼轻声笑着，爬进中空的倒木。
        - id: ch01-b15
          speaker: johnny_chuck
          text: “不打就逃的，才是胆小鬼呢。”
