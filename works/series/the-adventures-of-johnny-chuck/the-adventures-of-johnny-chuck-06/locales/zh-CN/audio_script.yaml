audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖亲切，带着轻快而含蓄的幽默
        timbre: 清亮柔和
        pace: 舒缓而有变化
        pitch: 中等
    johnny_chuck:
      display_name: 土拨鼠强尼
      tts:
        delivery: 朴实直爽，偶尔带一点不耐烦
        timbre: 浑厚温暖
        pace: 中等
        pitch: 中低
  chapters:
    - id: ch01
      title: 第六章　土拨鼠强尼当起了流浪汉
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 土拨鼠强尼当起了流浪汉。可不是嘛，他真的把自己变成了一个四处漂泊的流浪汉。听起来挺可笑，他却已经这么做了。强尼也说不清原因。他只觉得，住在老家越来越不满意，心里越来越不知足，也越来越不快活。几乎没想过后果，他就把自己的房子送给了臭鼬吉米。那是他去年夏天辛辛苦苦建起来的，当时不知道有多自豪。可现在，强尼大摇大摆地走上孤零零小径，头也不回，把家远远地抛在了身后。
        - id: ch01-b02
          speaker: narrator
          text: 强尼要去哪儿呢？说真的，他心里一点儿数也没有。他只是想出去看看世界。也许等世界看够了，再给自己造一所新房子。臭鼬吉米还能望见他，所以强尼一路昂首阔步，装得像个走惯四方的旅客，好像晚上没有舒服的小屋可回，根本算不了什么。其实，他心里哪有看上去那么有胆量。
        - id: ch01-b03
          speaker: narrator
          text: 强尼小时候曾跟彼得兔一起离开土拨鼠老妈妈，偷偷跑出去玩。自那以后，他就没怎么离开过自家门口。他一向守着家，把自己吃得胖乎乎、圆滚滚的，再听臭鼬吉米、彼得兔、小浣熊博比和负鼠比利大叔讲外面的大世界。那些朋友个个走过不少地方，称得上见多识广。
        - id: ch01-b04
          speaker: narrator
          text: 可这一次，强尼真的上路了，而且已经没有家可以回啦！他早就打定主意，房子既然给了臭鼬吉米，以后不管碰上什么事，自己都绝不回去。
        - id: ch01-b05
          speaker: narrator
          text: 走到强尼认为吉米看不见的地方，他终于转身望了一眼。一股怪怪的滋味突然涌上来，喉咙像被什么堵住了，连气都透不过来。原来，强尼已经想家了。他使劲咽了几下，硬对自己说，这一路别提有多快活。然后，他不再回头，又往前走去。走着走着，强尼唱起一首从前听吉米唱过的歌。
        - id: ch01-b06
          speaker: johnny_chuck
          text: “世界纵然又宽又广，那又与我何相干？我从这头走到那头，自由勇敢闯四方！”
        - id: ch01-b07
          speaker: narrator
          text: 这首歌听着真有气势，可强尼自己并没有歌里那么勇敢。他已经在犯愁，今晚到底睡在哪儿。就在这时，他想起了沼泽鹰白尾。强尼还小的时候，白尾曾把他吓得够呛，差一点儿就捉住了他。想到这里，强尼连忙四下张望。真不巧，老白尾就在前面，正饿着肚子飞来飞去。
        - id: ch01-b08
          speaker: narrator
          text: 强尼一下子被恐惧攫住了。附近没有藏身的地方，他只能把身子压得扁扁的，紧贴在草丛里。不过，他也已经拿定了主意。真要躲不过去，那就拼上一拼。
        - id: ch01-b09
          speaker: narrator
          text: 老白尾越来越近，越来越近！最后，他正从强尼头顶飞了过去，却一点儿也没想碰他。强尼甚至觉得，老白尾在冲自己咧嘴笑，还眨了一下眼睛。就在这一刻，他心里的害怕全没了。
        - id: ch01-b10
          speaker: johnny_chuck
          text: “呸！谁会怕他！”
        - id: ch01-b11
          speaker: narrator
          text: 强尼轻蔑地说完，忽然明白过来。自己已经不是从前那个连自己都照顾不了的小土拨鼠了。他如今长得又大又壮，还有一口锋利的牙齿。老对头犯不着靠近了领教这些牙。老鼠和蛇多的是，抓它们又不用先打一架。强尼于是挺起胸膛，接着往前走。这回，他真的觉得旅行有点儿意思了，甚至盼着来个机会，让别人见识一下自己有多么高大、多么强壮。
