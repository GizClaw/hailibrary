audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm, lively storytelling with a gentle sense of wonder
        timbre: clear and rounded
        pace: measured
        pitch: medium
    johnny_chuck:
      display_name: Johnny Chuck
      tts:
        delivery: plainspoken, friendly, and a little gruff when bothered
        timbre: warm and earthy
        pace: relaxed
        pitch: medium-low
  chapters:
    - id: ch01
      title: Johnny Chuck Turns Tramp
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Johnny Chuck had turned tramp. Yes, sir, that was exactly what he had done. It seemed a funny thing for Johnny to do, but he had done it all the same. He couldn't quite say why. He only knew that his old home had begun to leave him restless, discontented, and unhappy.
        - id: ch01-b02
          speaker: narrator
          text: Then, almost before he knew what he was doing, Johnny told Jimmy Skunk he could have the house. Johnny had worked hard to build it the summer before, and he had been very proud of it. Now he swaggered away down the Lone Little Path without looking back once.
        - id: ch01-b03
          speaker: narrator
          text: Where was he going? To tell the truth, Johnny didn't know. He meant to see the world. Perhaps after he had seen it, he would build himself a new house. As long as Jimmy could still see him, Johnny swaggered along as though traveling without a snug home for the night was perfectly ordinary. Deep down, though, he felt only half as bold as he looked.
        - id: ch01-b04
          speaker: narrator
          text: Johnny had hardly ever gone far from his own doorstep. The last time was when he was a little Chuck and ran away from old Mother Chuck with Peter Rabbit. Since then, he had been content to grow fat and roly-poly close to home. He let great travelers like Jimmy Skunk, Peter Rabbit, Bobby Coon, and Unc' Billy Possum tell him about the wide world instead.
        - id: ch01-b05
          speaker: narrator
          text: But now Johnny was truly setting out, with no home waiting for him. He had given his house to Jimmy, and he had made up his mind. Whatever happened, he would not go back.
        - id: ch01-b06
          speaker: narrator
          text: When Johnny reached a place where he thought Jimmy could no longer see him, he turned and looked back. A queer little feeling rose in his throat until it seemed to choke him. Johnny was already homesick. He swallowed hard and tried to believe he was having a splendid time. Then he faced forward and marched on.
        - id: ch01-b07
          speaker: narrator
          text: As he tramped along, Johnny tried to sing a song he had once heard Jimmy Skunk sing.
        - id: ch01-b08
          speaker: johnny_chuck
          text: "The world may stretch both far and wide. What does that matter to me? I'll tramp it up, and tramp it down, for I am bold and free!"
        - id: ch01-b09
          speaker: narrator
          text: It was a brave little song. Johnny still didn't feel nearly as brave as he wanted to. He had already begun to wonder where he would spend the night.
        - id: ch01-b10
          speaker: narrator
          text: Then Johnny remembered old Whitetail the Marshhawk. When Johnny was little, Whitetail had frightened him badly and nearly caught him. Johnny looked around in a hurry. There was old Whitetail himself, sailing hungrily back and forth just ahead.
        - id: ch01-b11
          speaker: narrator
          text: Fear swept over Johnny. There was nowhere to hide, so he pressed himself as flat as he could in the grass. One thing was settled. If Whitetail came for him, Johnny would fight.
        - id: ch01-b12
          speaker: narrator
          text: Whitetail came nearer and nearer. At last he passed directly over Johnny, but he made no move to touch him. Johnny even thought the old Marshhawk grinned and winked. In that instant, all Johnny's fear vanished.
        - id: ch01-b13
          speaker: johnny_chuck
          text: "Pooh! Who's afraid of old Whitetail?"
        - id: ch01-b14
          speaker: narrator
          text: Johnny suddenly understood that he was no longer a helpless little Chuck. He was big and strong now, with sharp teeth. Whitetail had no wish to meet those teeth when he could catch mice and snakes without a fight. Johnny puffed out his chest and went on. This time, he really began to enjoy himself. He almost wished for a chance to show just how big and strong he was.
