audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm, lively storytelling with a gentle sense of wonder
        timbre: clear and rounded
        pace: measured
        pitch: medium
    reddy_fox:
      display_name: Reddy Fox
      tts:
        delivery: sly and sharp, quick to turn cross when thwarted
        timbre: lean and bright
        pace: brisk
        pitch: medium-high
    sammy_jay:
      display_name: Sammy Jay
      tts:
        delivery: mischievous and teasing, with bold theatrical surprise
        timbre: crisp and ringing
        pace: lively
        pitch: high
    bowser_the_hound:
      display_name: Bowser the Hound
      tts:
        delivery: booming, eager, and direct
        timbre: deep and resonant
        pace: energetic
        pitch: low
    farmer_browns_boy:
      display_name: Farmer Brown's Boy
      tts:
        delivery: curious, practical, and alert
        timbre: clear and youthful
        pace: moderate
        pitch: medium
  chapters:
    - id: ch01
      title: Farmer Brown's Boy Makes a Discovery
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Reddy Fox glared up at Sammy Jay. Reddy was afraid Johnny Chuck might hear all that noise and realize there was danger nearby.
        - id: ch01-b02
          speaker: reddy_fox
          text: "What's wrong with you? Why can't you leave other folks alone instead of stirring up trouble?"
          emotion: angry
        - id: ch01-b03
          speaker: sammy_jay
          text: "Why, hello, Reddy! I thought you'd gone down to the Green Meadows!"
        - id: ch01-b04
          speaker: narrator
          text: Sammy sounded very surprised, but he wasn't surprised at all. He had watched Reddy searching for Johnny Chuck's new house. Reddy had acted as though he meant to visit the Green Meadows that morning, so now Sammy acted as though he had believed him.
        - id: ch01-b05
          speaker: reddy_fox
          text: "I decided not to go! And why are you making such a racket?"
          emotion: angry
        - id: ch01-b06
          speaker: sammy_jay
          text: "I'm giving my lungs some exercise. That way, I'll be ready whenever I need a good scream!"
        - id: ch01-b07
          speaker: narrator
          text: Sammy screamed even louder.
        - id: ch01-b08
          speaker: reddy_fox
          text: "Then go scream somewhere else. I'm trying to sleep!"
          emotion: angry
        - id: ch01-b09
          speaker: narrator
          text: Sammy knew Reddy had no plans to take a nap. He was hiding there, hoping to catch Johnny Chuck. Sammy also knew Farmer Brown's boy could hear those screams. The boy knew that when Sammy called that way, a fox was nearby. From the top of the apple tree, Sammy saw him coming toward the old orchard, with Bowser the Hound racing ahead.
        - id: ch01-b10
          speaker: narrator
          text: Farmer Brown's boy had no gun, so Sammy knew no harm would come to Reddy. Still, Reddy would get a terrible fright. That was exactly what Sammy wanted, simply because he was feeling mischievous. So Sammy screamed louder than ever.
        - id: ch01-b11
          speaker: narrator
          text: Reddy lost his temper. He sat up, called Sammy every bad name he could think of, and forgot all about where he was. He told Sammy exactly what he thought of him and what he would do if he ever caught him.
        - id: ch01-b12
          speaker: narrator
          text: Sammy kept screaming. He made so much noise that Reddy never heard the footsteps drawing closer and closer. Then, all at once, a tremendous roar sounded right behind him.
        - id: ch01-b13
          speaker: bowser_the_hound
          text: "Bow, wow, wow! Bow, wow, wow, wow!"
        - id: ch01-b14
          speaker: narrator
          text: Reddy was so frightened that he jumped without looking and struck his head against the apple tree. Then he raced for the Green Forest, with Bowser the Hound close behind him.
        - id: ch01-b15
          speaker: narrator
          text: Sammy laughed until he ran out of breath and nearly tumbled from his perch in the apple tree. Then he flew away, laughing all the while. He thought it was the greatest joke that had ever happened.
        - id: ch01-b16
          speaker: narrator
          text: Meanwhile, Farmer Brown's boy had followed Bowser into the old orchard.
        - id: ch01-b17
          speaker: farmer_browns_boy
          text: "What was a fox doing up here in the middle of the day? Maybe one of my hens hid her nest down here, and he found it. I might as well take a look."
        - id: ch01-b18
          speaker: narrator
          text: He went on to the far corner of the orchard, heading straight for the spot where he had seen Reddy jump. As soon as he reached it, he saw Johnny Chuck's new house.
        - id: ch01-b19
          speaker: farmer_browns_boy
          text: "Well, look at that! Brer Fox was hunting Chucks. I'll watch this place. If Mr. Chuck causes trouble in my garden, I'll know where to find him."
