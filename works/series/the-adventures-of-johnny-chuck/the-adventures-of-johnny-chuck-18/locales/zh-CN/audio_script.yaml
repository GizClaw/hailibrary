audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖亲切，带着轻快而含蓄的幽默
        timbre: 清亮柔和
        pace: 舒缓而有变化
        pitch: 中等
    sammy_jay:
      display_name: 松鸦萨米
      tts:
        delivery: 机灵活泼，话里常藏着恶作剧的得意
        timbre: 清脆明亮
        pace: 稍快
        pitch: 中高
    reddy_fox:
      display_name: 红狐狸雷迪
      tts:
        delivery: 狡黠轻快，带着不怀好意的亲热
        timbre: 尖细而灵活
        pace: 稍快
        pitch: 中高
    farmer_browns_boy:
      display_name: 农夫布朗家的男孩
      tts:
        delivery: 自然爽快，带着乡野少年的亲切
        timbre: 清朗明亮
        pace: 中等
        pitch: 中高
    bowser_hound:
      display_name: 猎犬鲍泽
      tts:
        delivery: 响亮急促，充满追逐时的冲劲
        timbre: 浑厚有力
        pace: 快
        pitch: 中低
  chapters:
    - id: ch01
      title: 萨米装起糊涂
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 红狐狸雷迪抬起头，恶狠狠地瞪着松鸦萨米。
        - id: ch01-b02
          speaker: reddy_fox
          text: “你到底怎么回事？管好你自己的事不行吗？为什么偏要给别人添麻烦？”
          emotion: angry
        - id: ch01-b03
          speaker: narrator
          text: 雷迪怕萨米的叫声传进强尼耳朵，让强尼有了防备。
        - id: ch01-b04
          speaker: sammy_jay
          text: “你好呀，红狐狸雷迪！我还以为你已经去绿草地了呢！”
        - id: ch01-b05
          speaker: narrator
          text: 萨米装得像是非常吃惊，其实他一点儿也不意外。他一直在看着雷迪寻找强尼的新房子。早晨，雷迪假装要去绿草地。现在，萨米便也假装自己真的相信了他。
        - id: ch01-b06
          speaker: reddy_fox
          text: “我改主意了！你为什么叫个不停？”
          emotion: angry
        - id: ch01-b07
          speaker: sammy_jay
          text: “我在活动嗓子呀。免得真想叫的时候，反倒叫不出来。”
        - id: ch01-b08
          speaker: narrator
          text: 萨米说着，叫得更响了。
        - id: ch01-b09
          speaker: reddy_fox
          text: “要叫就到别处去。我还想睡觉呢。”
          emotion: angry
    - id: ch02
      title: 鲍泽悄悄赶来
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 萨米当然知道，雷迪根本不想打盹儿。他藏在那里，只等着逮住土拨鼠强尼。萨米也知道，农夫布朗家的男孩听得见自己的叫声，而且那个男孩明白，萨米这样尖叫，就表示附近有狐狸。
        - id: ch02-b02
          speaker: narrator
          text: 萨米坐在苹果树顶，已经看见那个男孩朝老果园赶来了。猎犬鲍泽跑在最前面。
        - id: ch02-b03
          speaker: narrator
          text: 男孩没有带枪，所以雷迪不会受到伤害，只会给吓个半死。这正是萨米想要的。他纯粹是存心淘气，想狠狠捉弄雷迪一回。于是，他索性扯开嗓子，叫得比刚才更响了。
        - id: ch02-b04
          speaker: narrator
          text: 雷迪气得失去了耐性。他坐起身，把想得出的难听话全骂给萨米听。他连自己躲在哪里都忘了，把心里怎么看萨米全都说了出来，还说萨米要是落到他手里，他会怎样收拾萨米。
        - id: ch02-b05
          speaker: narrator
          text: 萨米仍旧尖叫个不停。声音太吵，雷迪一点儿也没听见脚步越来越近。突然，他身后爆出一阵巨吼，正是这样的声音。
        - id: ch02-b06
          speaker: bowser_hound
          text: “汪！汪！汪！汪汪汪汪！”
    - id: ch03
      title: 雷迪逃进绿森林
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 雷迪吓得顾不上看方向，猛地一跳，一头撞上了苹果树。随后，他拔腿逃向绿森林，猎犬鲍泽就在身后紧追。
        - id: ch03-b02
          speaker: narrator
          text: 松鸦萨米笑得上气不接下气，差一点儿从树枝上掉下来。他飞走时还笑个不停，觉得世上再没有比这更好笑的恶作剧了。
        - id: ch03-b03
          speaker: narrator
          text: 农夫布朗家的男孩跟着鲍泽走进了老果园。
        - id: ch03-b04
          speaker: farmer_browns_boy
          text: “狐狸怎么会大白天跑到这里来？说不定我家哪只母鸡偷偷在这里做了窝，又让他发现了。无论如何，我得去看看。”
    - id: ch04
      title: 男孩发现了新房子
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 男孩继续往前走，一直走到老果园最远的角落。他径直来到自己刚才看见雷迪跳起来的地方。刚到那里，他自然一眼就发现了土拨鼠强尼的新房子。
        - id: ch04-b02
          speaker: farmer_browns_boy
          text: “哈！狐狸老兄原来是在找土拨鼠。我要留心盯着这里。要是土拨鼠先生到我的菜园里捣乱，我就知道该去哪儿逮他了。”
