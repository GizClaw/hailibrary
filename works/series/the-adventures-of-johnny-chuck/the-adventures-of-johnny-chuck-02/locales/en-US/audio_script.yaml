audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm, lively storytelling with a gentle sense of wonder
        timbre: clear and rounded
        pace: measured
        pitch: medium
    peter_rabbit:
      display_name: Peter Rabbit
      tts:
        delivery: curious, animated, and quick to wonder
        timbre: bright and youthful
        pace: lively
        pitch: medium-high
    johnny_chuck:
      display_name: Johnny Chuck
      tts:
        delivery: plainspoken, friendly, and a little gruff when bothered
        timbre: warm and earthy
        pace: relaxed
        pitch: medium-low
    jimmy_skunk:
      display_name: Jimmy Skunk
      tts:
        delivery: easygoing, good-humored, and quietly confident
        timbre: smooth and mellow
        pace: unhurried
        pitch: medium-low
    reddy_fox:
      display_name: Reddy Fox
      tts:
        delivery: sly, playful, and always ready to tease
        timbre: sharp and bright
        pace: brisk
        pitch: medium
  chapters:
    - id: ch01
      title: Johnny Chuck Receives Callers
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: The next morning, after gentle Sister South Wind reached the Green Meadows, Peter Rabbit came hopping and skipping along the Lone Little Path from the Green Forest. Peter was happy, though he couldn't have told you why. Happiness seemed to be everywhere that morning. Everyone else felt it, too. Every few minutes, Peter had to stop, kick up his heels, and try to jump over his own shadow. He had felt that way ever since Sister South Wind arrived.
        - id: ch01-b02
          speaker: peter_rabbit
          text: "I simply have to kick and dance! I cannot help but gaily prance! Somehow I feel it in my toes whenever gentle South Wind blows."
          emotion: happy
        - id: ch01-b03
          speaker: narrator
          text: Peter sang as he bounced along the path. Then, right in the middle of his song, he stopped. He sat straight up and stared toward Johnny Chuck's house. Someone was sitting on the doorstep. At first, Peter thought it was Johnny. Then he thought it looked more like Johnny's shadow. He rubbed his eyes and took another look.
        - id: ch01-b04
          speaker: narrator
          text: Then Peter raced toward the house, lipperty-lipperty-lip. But the closer he came, the less that thin fellow looked like Johnny Chuck. Johnny had been round and roly-poly when he went to sleep, so fat that he could barely waddle. This fellow was even thinner than Peter. Then the stranger lifted one thin hand and waved.
        - id: ch01-b05
          speaker: johnny_chuck
          text: "Hello, Peter Rabbit! I said I'd see you when spring came. How did you get through that long winter?"
        - id: ch01-b06
          speaker: narrator
          text: It was Johnny Chuck's voice. Peter was so delighted that he hurried too fast and tripped over his own feet.
        - id: ch01-b07
          speaker: peter_rabbit
          text: "Johnny Chuck, is that really you?"
          emotion: surprised
        - id: ch01-b08
          speaker: johnny_chuck
          text: "Of course it's me. Who else did you think it was?"
        - id: ch01-b09
          speaker: narrator
          text: Johnny sounded rather cross. Peter was staring at him as though they had never met.
        - id: ch01-b10
          speaker: peter_rabbit
          text: "I—I couldn't tell. One moment I thought you were Johnny, and the next moment I didn't. What happened to you? Your coat looks three sizes too large now. The last time I saw you, it wasn't large enough!"
        - id: ch01-b11
          speaker: narrator
          text: Peter hopped in a circle around Johnny and kept looking him over. He could hardly believe what he saw.
        - id: ch01-b12
          speaker: jimmy_skunk
          text: "Oh, Johnny is fine. He has just been living on his own fat."
        - id: ch01-b13
          speaker: narrator
          text: That was Jimmy Skunk. Neither Peter nor Johnny had noticed him come up. Now Jimmy stood there, holding out his hand to Johnny and grinning in his good-natured way. Peter's big eyes opened wider than ever.
        - id: ch01-b14
          speaker: peter_rabbit
          text: "Are you saying he ate his own fat?"
          emotion: surprised
        - id: ch01-b15
          speaker: narrator
          text: Johnny Chuck and Jimmy Skunk both laughed.
        - id: ch01-b16
          speaker: jimmy_skunk
          text: "No, Peter. He didn't eat it. But while he slept all winter, he lived on it just the same. Look at him now. There isn't a bit of fat left on him."
        - id: ch01-b17
          speaker: peter_rabbit
          text: "But if he didn't eat the fat, how could he live on it?"
        - id: ch01-b18
          speaker: narrator
          text: Peter went right on staring at Johnny as if he had never seen him before. Jimmy only shrugged.
        - id: ch01-b19
          speaker: jimmy_skunk
          text: "Don't ask me. That's one of Old Mother Nature's secrets. You'll have to ask her."
        - id: ch01-b20
          speaker: johnny_chuck
          text: "And don't ask me, either. I was asleep the whole time. My, but I'm hungry!"
        - id: ch01-b21
          speaker: reddy_fox
          text: "So am I!"
        - id: ch01-b22
          speaker: narrator
          text: There stood Reddy Fox, grinning at them. Johnny dived through his doorway, and Peter Rabbit rushed in right behind him. There was nowhere else for them to go. Jimmy Skunk stayed exactly where he was and chuckled. He knew Reddy Fox did not dare touch him.
