audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖亲切，带着轻快而含蓄的幽默
        timbre: 清亮柔和
        pace: 舒缓而有变化
        pitch: 中等
    peter_rabbit:
      display_name: 兔子彼得
      tts:
        delivery: 好奇直率，带一点孩子气的困惑
        timbre: 清脆灵活
        pace: 稍快
        pitch: 中高
    johnny_chuck:
      display_name: 土拨鼠强尼
      tts:
        delivery: 朴实直爽，偶尔带一点不耐烦
        timbre: 浑厚温暖
        pace: 中等
        pitch: 中低
    jimmy_skunk:
      display_name: 臭鼬吉米
      tts:
        delivery: 随和机灵，话里常带善意的笑
        timbre: 圆润清晰
        pace: 从容
        pitch: 中等
    reddy_fox:
      display_name: 红狐狸雷迪
      tts:
        delivery: 狡黠轻快，带着不怀好意的亲热
        timbre: 尖细而灵活
        pace: 稍快
        pitch: 中高
  chapters:
    - id: ch01
      title: 第二章　土拨鼠强尼接待来客
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 温柔的南风姐姐来到绿草原后的第二天早晨，兔子彼得从绿森林出来，沿着孤零零的小径，一路蹦蹦跳跳。彼得自己也不知道为什么，反正就是快活。那股快活劲儿就在空气里，大家好像也都很高兴。彼得每隔几分钟，就要停下来踢踢后腿，再试着跳过自己的影子。南风姐姐来了以后，他一直就是这样。
        - id: ch01-b02
          speaker: peter_rabbit
          text: “我就是想踢腿又跳舞，谁也拦不住我欢快的脚步！不知怎的，脚趾头一阵发痒，准是温柔的南风吹过了草场。”
          emotion: happy
        - id: ch01-b03
          speaker: narrator
          text: 彼得唱着歌，在小径上蹦蹦跳跳。可唱到一半，他突然停住，端端正正坐起来，盯着强尼的家。门阶上坐着一个人，像是土拨鼠强尼，又像只是强尼的一道影子。
        - id: ch01-b04
          speaker: narrator
          text: 彼得揉揉眼睛，又仔细看了一遍，马上飞快地赶过去，一跳，一蹿，又一跳。可是离得越近，那个人看着就越不像强尼。强尼睡着以前，身子又圆又胖，连走路都快走不动了。眼前这个家伙却瘦巴巴的，甚至比彼得还瘦。他抬起一只细瘦的手，朝彼得挥了挥。
        - id: ch01-b05
          speaker: johnny_chuck
          text: “你好啊，兔子彼得！我早就说过，春天我们会再见。这个漫长的冬天，你过得怎么样？”
        - id: ch01-b06
          speaker: narrator
          text: 彼得一听，这的确是强尼的声音。他高兴坏了，急着往前跑，竟被自己的脚绊了一跤。
        - id: ch01-b07
          speaker: peter_rabbit
          text: “你真的是土拨鼠强尼吗？真的是你？”
          emotion: surprised
        - id: ch01-b08
          speaker: johnny_chuck
          text: “当然是我。你还以为是谁？”
        - id: ch01-b09
          speaker: narrator
          text: 彼得一直盯着强尼，两眼一眨不眨，活像从来没见过他。这让强尼有些恼火。
        - id: ch01-b10
          speaker: peter_rabbit
          text: “我——我也说不准。我看着像你，又觉得不像。强尼，你把自己怎么啦？这件外套现在大了足足三个尺码，可我上回见你时，它明明还小得快装不下你了。”
        - id: ch01-b11
          speaker: narrator
          text: 彼得围着强尼跳了一圈又一圈，左看右看，怎么看都不敢相信自己的眼睛。这时，旁边忽然传来另一个声音。
        - id: ch01-b12
          speaker: jimmy_skunk
          text: “强尼好得很。他只不过整个冬天都靠自己身上的脂肪过日子。”
        - id: ch01-b13
          speaker: narrator
          text: 原来是臭鼬吉米。他笑呵呵地站在那里，伸手要和强尼握手。吉米是什么时候走近的，彼得和强尼谁也没有看见。彼得的两只大眼睛一下子睁得更圆了。
        - id: ch01-b14
          speaker: peter_rabbit
          text: “你的意思是，他把自己身上的脂肪吃掉了？”
          emotion: surprised
        - id: ch01-b15
          speaker: narrator
          text: 强尼和吉米听完，都笑了起来。
        - id: ch01-b16
          speaker: jimmy_skunk
          text: “不，他没有把脂肪吃下去。不过，他睡了一整个冬天，的确一直靠它活着。你瞧，他身上现在连一点儿脂肪都没有了。”
        - id: ch01-b17
          speaker: peter_rabbit
          text: “他又没吃，怎么能靠脂肪活下来呢？”
        - id: ch01-b18
          speaker: narrator
          text: 彼得一边问，一边又盯着强尼看，仿佛过去从没见过他。吉米听了，只是耸了耸肩。
        - id: ch01-b19
          speaker: jimmy_skunk
          text: “这可别问我。它是大自然老妈妈的秘密，你得去问她。”
        - id: ch01-b20
          speaker: johnny_chuck
          text: “也别问我，我从头到尾都在睡觉。哎哟，我现在可真饿呀！”
        - id: ch01-b21
          speaker: reddy_fox
          text: “我也饿！”
        - id: ch01-b22
          speaker: narrator
          text: 又一个声音冒了出来。红狐狸雷迪正站在他们面前，咧着嘴直笑。强尼一头钻进自家门洞，彼得紧紧跟在后面，因为他们没有别的地方可逃。臭鼬吉米却留在原地，低声笑着。他知道，红狐狸雷迪根本不敢碰他。
