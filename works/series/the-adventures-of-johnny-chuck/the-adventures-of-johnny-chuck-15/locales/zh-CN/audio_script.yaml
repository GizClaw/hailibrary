audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖亲切，带着轻快而含蓄的幽默
        timbre: 清亮柔和
        pace: 舒缓而有变化
        pitch: 中等
    johnny_chuck:
      display_name: 土拨鼠强尼
      tts:
        delivery: 朴实直爽，偶尔带一点不耐烦
        timbre: 浑厚温暖
        pace: 中等
        pitch: 中低
  chapters:
    - id: ch01
      title: 大家都在想念强尼
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 土拨鼠强尼搬走以后，绿草地上的老邻居都很想他。强尼要是知道大家有多惦记自己，准会想办法回去看望他们，哪怕只去一回也好。
        - id: ch01-b02
          speaker: narrator
          text: 后来，小草地居民发现臭鼬吉米住进了强尼的旧屋，一个个都吃惊极了。吉米告诉大家，这座房子是强尼送给他的。起初，有些居民不大相信，看他的眼神也有几分怀疑，还说起了些不好听的话。
        - id: ch01-b03
          speaker: narrator
          text: 直到强尼托快乐小微风捎回口信，大家才相信吉米说的是真的，也不再提那些难听的话。不过，他们全都认定强尼一定是疯了。没错，先生，他们觉得强尼准是疯了。等快乐小微风说，强尼已经出发去见识世界，他们就更相信自己的判断了。
        - id: ch01-b04
          speaker: narrator
          text: 春天那么明媚，那么灿烂，可大家都忙着自己的事，没多少工夫一直猜强尼去了哪里。每当有人经过他的旧屋，总会想起他。可是走过去以后，也就把他忘了。至少，大多数小草地居民都是这样。
        - id: ch01-b05
          speaker: narrator
          text: 兔子彼得却一直记着强尼。以前，他每天都要停在强尼家门口聊一会儿，把听来的新闻全讲给强尼。现在强尼不在了，彼得可真想他。住进旧屋的臭鼬吉米呢，不是睡着了，就是出了门。何况吉米常常四处旅行，消息来得特别快，几乎和彼得一样早就知道了所有新闻。
    - id: ch02
      title: 快乐小微风守住秘密
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 快乐小微风曾经告诉彼得，强尼还在绿草地上，正在寻找新家。彼得便拿定主意，只要强尼安顿好了，他就去找到强尼，登门拜访。他从没想过强尼会离开绿草地，还以为新房子一盖好，快乐小微风自然会告诉自己，那座房子究竟在哪儿。可彼得这回想错了。
        - id: ch02-b02
          speaker: narrator
          text: 快乐小微风跟所有小草地居民和森林居民都是朋友。可要是听到什么都往外说，这些朋友哪还能长久呢？
        - id: ch02-b03
          speaker: narrator
          text: 它们把快乐的小舌头守得牢牢的，不该说的事，绝不往外捎。很久以前，它们就学会了一个道理。秘密不论到了白天还是夜里，都要好好藏住。
        - id: ch02-b04
          speaker: narrator
          text: 所以，当快乐小微风在农夫布朗家老果园的角落里找到强尼的新房子，它们便答应强尼，绝不把这件事告诉别人。它们果然一个字也没泄露。谁都没想到要去老果园的角落里寻找强尼，于是过了很久，才有别人发现他的下落。
    - id: ch03
      title: 树叶间的锐利眼睛
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 快乐小微风每天都会来看强尼，还把外面的消息带给他。一想到兔子彼得到处找啊找，却怎么也找不到他们，强尼和波莉就笑个不停，乐得你挠我一下，我也挠你一下。
        - id: ch03-b02
          speaker: narrator
          text: 一天早晨，强尼坐在自家门阶上晒太阳。他迷迷糊糊地打着盹儿，心里别提多满足了。忽然，他一抬头，正好对上了两只锐利的眼睛。那双眼睛藏在苹果树的叶丛中，正从高处往下盯着他。强尼的新家，就盖在这棵树下面。
        - id: ch03-b03
          speaker: narrator
          text: 强尼认得那双眼睛。它们尖锐得让人很不舒服。他甚至不必再找那件蓝白相间的外衣，也知道是谁发现了这个舒适的小家。
        - id: ch03-b04
          speaker: narrator
          text: 可强尼一点儿也没显露出来。他仍旧装作在打盹儿。没过多久，那双眼睛的主人便没发出一点声音，悄悄消失了。
    - id: ch04
      title: 强尼加倍警醒
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 强尼叹了一口气。
        - id: ch04-b02
          speaker: johnny_chuck
          text: “唉，这可糟了。刚才那个家伙是松鸦萨米。用不了多久，全世界都会知道我们住在哪儿。”
        - id: ch04-b03
          speaker: narrator
          text: 可说着说着，强尼的脸又亮了起来。
        - id: ch04-b04
          speaker: johnny_chuck
          text: “不过，萨米没看见波莉。他根本不知道她的事。以后我得比从前多留一倍的神。”
