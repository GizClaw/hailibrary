audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm, lively storytelling with a gentle sense of wonder
        timbre: clear and rounded
        pace: measured
        pitch: medium
    johnny_chuck:
      display_name: Johnny Chuck
      tts:
        delivery: plainspoken, friendly, and a little gruff when bothered
        timbre: warm and earthy
        pace: relaxed
        pitch: medium-low
  chapters:
    - id: ch01
      title: Sammy Jay Finds the New Home
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Johnny Chuck was missed back at his old home on the Green Meadows. If he had known just how much everyone missed him, he surely would have gone back to visit his old neighbors. When they discovered Jimmy Skunk living in Johnny's old house, the little meadow people were amazed. At first, some of them even looked at Jimmy with suspicion when he said Johnny had given the house to him.
        - id: ch01-b02
          speaker: narrator
          text: Then Johnny sent word by the Merry Little Breezes that Jimmy's story was true. Everyone believed Jimmy and stopped hinting at unpleasant things about him. Still, every one of them thought Johnny Chuck must be crazy. Yes, sir, they thought he must be crazy. And when the Merry Little Breezes told them Johnny had set off to see the world, they felt certain of it.
        - id: ch01-b03
          speaker: narrator
          text: But it was bright, beautiful springtime, and everyone had plenty of business of their own. They couldn't spend long wondering about Johnny. Most of the little meadow people missed him whenever they passed his old house, but then they soon forgot about him.
        - id: ch01-b04
          speaker: narrator
          text: Peter Rabbit didn't forget. Every day, Peter used to stop and gossip with Johnny and tell him all the news. Now Johnny was gone, and Peter missed him very much. Jimmy Skunk was usually asleep or away somewhere. Besides, Jimmy traveled so much that he heard nearly all the news as quickly as Peter did.
        - id: ch01-b05
          speaker: narrator
          text: The Merry Little Breezes told Peter that Johnny was still somewhere on the Green Meadows, looking for a new home. So Peter decided to visit him as soon as he settled down. It never entered Peter's head that Johnny might leave the Green Meadows. Of course, he thought, the Merry Little Breezes would tell him exactly where Johnny built his new house. That was Peter's mistake.
        - id: ch01-b06
          speaker: narrator
          text: The Merry Little Breezes are friends with all the little people of the meadow and forest. They wouldn't keep those friends for long if they told every secret they learned.
        - id: ch01-b07
          speaker: narrator
          text: Their merry tongues they guard full well, and things they shouldn't never tell. For long ago they learned the way to keep a secret night and day.
        - id: ch01-b08
          speaker: narrator
          text: So when they found Johnny's new house in a corner of Farmer Brown's old orchard, they promised him they would tell no one. And they kept their promise. Nobody thought to search that corner of the old orchard, so a long time passed before anyone else learned what had become of Johnny Chuck.
        - id: ch01-b09
          speaker: narrator
          text: The Merry Little Breezes visited each day and brought Johnny all the news. Johnny and Polly Chuck would laugh when they imagined Peter Rabbit hunting and hunting without ever finding them.
        - id: ch01-b10
          speaker: narrator
          text: Then, one morning, Johnny sat on his doorstep in the sunshine. His heart was full of contentment, and he was half asleep. By chance, he looked up. Two sharp eyes were peering down through the leaves of the apple tree above his house.
        - id: ch01-b11
          speaker: narrator
          text: Johnny knew those eyes. They were sharp, unpleasant eyes. He didn't need to spot their owner's blue-and-white coat to know who had discovered his snug home. Still, Johnny pretended to doze. Before long, the owner of those eyes slipped away without a sound.
        - id: ch01-b12
          speaker: johnny_chuck
          text: "Oh, dear. Now the whole world will find out where we live. That was Sammy Jay."
        - id: ch01-b13
          speaker: narrator
          text: Johnny sighed as he said it. Then his face grew bright again.
        - id: ch01-b14
          speaker: johnny_chuck
          text: "Anyway, he didn't see Polly Chuck, so he doesn't know anything about her. From now on, I'll watch twice as carefully as I did before."
