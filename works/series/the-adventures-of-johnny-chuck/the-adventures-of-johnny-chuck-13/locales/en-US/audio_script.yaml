audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm, lively storytelling with a gentle sense of wonder
        timbre: clear and rounded
        pace: measured
        pitch: medium
    johnny_chuck:
      display_name: Johnny Chuck
      tts:
        delivery: plainspoken, friendly, and a little gruff when bothered
        timbre: warm and earthy
        pace: relaxed
        pitch: medium-low
    polly_chuck:
      display_name: Polly Chuck
      tts:
        delivery: gentle, shy, and plainly spoken
        timbre: soft and youthful
        pace: measured
        pitch: medium-high
  chapters:
    - id: ch01
      title: Polly and Johnny Chuck Go House Hunting
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Johnny Chuck was happy. Yes, sir, he was so happy that he felt ready to do the silliest things. Johnny loved Polly Chuck, and now he knew that Polly loved him too. He had known it ever since he fought the foolish little dog that dared to frighten her.
        - id: ch01-b02
          speaker: narrator
          text: When the fight was over, the little dog went home crying, “Kiyi-yi!” Polly crept out from the old stone wall where she had hidden. She nestled close beside Johnny and gazed at him as though he were the most wonderful Chuck in the whole world. And that was exactly what she thought. Johnny's heart filled and filled with happiness until he could hardly breathe.
        - id: ch01-b03
          speaker: narrator
          text: Before long, Johnny began thinking about a new home again. He had forgotten all about going out to see the world. Now he wanted only a house made just the way he liked it, with a front door, a hidden back door, and enough room for two. Johnny Chuck would not be living alone anymore. With shy little Polly beside him, he set off to find the right place for their home.
        - id: ch01-b04
          speaker: narrator
          text: The more Johnny considered it, the more he wanted to build beside the lone elm tree, right where he had first seen Polly. It was a wonderful spot. They could look out a long way in every direction. The tree would shade them on hot summer days, and a great patch of sweet clover grew nearby. To Johnny, no place on the Green Meadows could be better. He quietly told Polly what he thought. Polly turned up her nose.
        - id: ch01-b05
          speaker: polly_chuck
          text: “That place is much too low!”
        - id: ch01-b06
          speaker: narrator
          text: Johnny looked puzzled. The spot was really one of the highest places on the Green Meadows.
        - id: ch01-b07
          speaker: johnny_chuck
          text: “Oh, is it?”
        - id: ch01-b08
          speaker: polly_chuck
          text: “Yes, it is far too low. The ground is probably wet.”
        - id: ch01-b09
          speaker: narrator
          text: Polly sounded brisk and quite certain.
        - id: ch01-b10
          speaker: johnny_chuck
          text: “Oh, do you think so?”
        - id: ch01-b11
          speaker: narrator
          text: Of course Johnny knew the ground was not wet. Still, if Polly did not want to live there, he would not argue. Not a word.
        - id: ch01-b12
          speaker: polly_chuck
          text: “Look at that spot over there. I think that's where we'll build our house.”
        - id: ch01-b13
          speaker: narrator
          text: Johnny opened his mouth to answer, then closed it without saying anything. He meekly trotted after Polly to the place she had chosen. It lay in a little hollow. Even before he started digging, Johnny knew the soil was damp, almost wet. But if Polly wanted to live there, then she would. Johnny began to dig.
        - id: ch01-b14
          speaker: narrator
          text: After a while, he stopped for a rest. Where was Polly? Johnny looked one way and then the other, growing anxious. He was just about to search for her when she hurried back.
        - id: ch01-b15
          speaker: polly_chuck
          text: “I've found the loveliest place for our new home!”
          emotion: happy
        - id: ch01-b16
          speaker: narrator
          text: Johnny looked sadly at the hole he had worked so hard to dig. Then he brushed the dirt from his clothes and followed Polly.
        - id: ch01-b17
          speaker: narrator
          text: This time, Johnny could find nothing wrong with the ground. It was high and dry. But Polly had picked a spot close to a road that curved across the Green Meadows. Johnny shook his head because he was not so sure about it, but he started digging anyway.
        - id: ch01-b18
          speaker: narrator
          text: Now Johnny kept one eye on Polly. The moment she began to wander off, he stopped his work. He chuckled as he watched her go. Sure enough, she soon came rushing back, more excited than ever. She had found an even better place.
        - id: ch01-b19
          speaker: narrator
          text: So Polly and Johnny roamed across the Green Meadows, with Polly always leading. By then, Johnny had learned not to waste his time digging. He had also made up his mind about one thing. Can you guess what it was?
        - id: ch01-b20
          speaker: narrator
          text: Johnny would follow Polly until she chose a place that suited him. Once she did, he would make sure she had no chance to change her mind again.
