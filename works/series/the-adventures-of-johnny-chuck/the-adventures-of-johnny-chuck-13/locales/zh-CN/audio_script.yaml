audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖亲切，带着轻快而含蓄的幽默
        timbre: 清亮柔和
        pace: 舒缓而有变化
        pitch: 中等
    johnny_chuck:
      display_name: 土拨鼠强尼
      tts:
        delivery: 朴实直爽，偶尔带一点不耐烦
        timbre: 浑厚温暖
        pace: 中等
        pitch: 中低
    polly_chuck:
      display_name: 土拨鼠波莉
      tts:
        delivery: 温柔腼腆，说话小心而真诚
        timbre: 轻柔清甜
        pace: 稍慢
        pitch: 中高
  chapters:
    - id: ch01
      title: 第十三章　波莉和强尼去找新家
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 强尼快活极了。真的，他快活得简直想做点傻事。因为他爱波莉，也终于知道，波莉同样爱着他。自从他赶跑那条胆敢吓唬波莉的傻小狗以后，他就明白了。
        - id: ch01-b02
          speaker: narrator
          text: 那场架打完，小狗一路惨叫着逃回了家。波莉从藏身的古老石墙里悄悄爬出来，紧紧偎在强尼身旁。她看着强尼，就像在看全世界最了不起的土拨鼠。其实在她心里，强尼就是这么了不起。
        - id: ch01-b03
          speaker: narrator
          text: 强尼心里的幸福越涨越满，几乎让他说不出话来。
        - id: ch01-b04
          speaker: narrator
          text: 于是，强尼又想起了新家的事。他早把看看世界的念头忘光了。现在，他只想要一座称心的房子。房子要有前门，也要有一扇藏起来的后门，还得宽敞到足够住下两个。因为从今以后，强尼再也不会独自生活了。
        - id: ch01-b05
          speaker: narrator
          text: 腼腆的小波莉陪在他身边，他们一起出发去找安家的地方。
        - id: ch01-b06
          speaker: narrator
          text: 强尼越想，越觉得房子应该造在那棵孤零零的榆树旁。他就是在那里头一次见到了波莉。那地方视野开阔，朝四面八方都能望出很远。夏天有树荫，附近还有一大片香甜的三叶草。强尼觉得，整个绿草地再也找不到更好的地方了。
        - id: ch01-b07
          speaker: narrator
          text: 他悄悄把这个主意告诉波莉。波莉却把鼻子一翘。
        - id: ch01-b08
          speaker: polly_chuck
          text: “那里太低了！”
        - id: ch01-b09
          speaker: johnny_chuck
          text: “哦？怎么会太低呢？”
        - id: ch01-b10
          speaker: narrator
          text: 强尼满脸不解。说真的，那明明是绿草地上最高的地方之一。
        - id: ch01-b11
          speaker: polly_chuck
          text: “就是太低了，实在太低了。那里八成还很潮湿。”
        - id: ch01-b12
          speaker: johnny_chuck
          text: “哦，那好吧。”
        - id: ch01-b13
          speaker: narrator
          text: 强尼当然知道，那里根本不潮湿。可是波莉不想住，他就不争辩。那是当然的。
        - id: ch01-b14
          speaker: polly_chuck
          text: “你看，那边有个地方。我看，我们就把房子造在那里吧。”
        - id: ch01-b15
          speaker: narrator
          text: 强尼张开嘴，本来想说些什么，却又一声不响地把嘴闭上了。他老老实实跟着波莉，跑到她选中的地方。那里是一处小洼地。还没开挖，强尼就知道泥土很潮，差不多已经是湿的。
        - id: ch01-b16
          speaker: narrator
          text: 可只要波莉想住，强尼就让她住。他动手挖了起来。过了一阵，他停下歇气，却发现波莉不见了。强尼焦急地东瞧西望，正要去找她，她就急匆匆地跑了回来。
        - id: ch01-b17
          speaker: polly_chuck
          text: “我找到一个特别棒的地方，正好可以造我们的新家！”
        - id: ch01-b18
          speaker: narrator
          text: 强尼愁眉苦脸地看了看那个费了好大力气才挖出的洞，又掸掉身上的泥土，跟波莉走了。
        - id: ch01-b19
          speaker: narrator
          text: 这一次，泥土倒是没毛病。那里又高又干爽。可波莉选的位置，紧挨着一条蜿蜒穿过绿草地的路。强尼迟疑地摇摇头，还是开始挖了。
        - id: ch01-b20
          speaker: narrator
          text: 不过这回，他一边挖，一边盯着波莉。一看见她又往别处溜达，强尼马上停下，望着她暗暗发笑。果然，没过多久，波莉就兴冲冲地回来了。她又找到了一个更好的地方！
        - id: ch01-b21
          speaker: narrator
          text: 就这样，他们在绿草地上走来走去，波莉在前面领路。强尼已经学乖了，再也不肯白费力气挖洞。
        - id: ch01-b22
          speaker: narrator
          text: 他还拿定了一个主意。你猜是什么？强尼会一直跟着波莉，直到她找到一个也合他心意的地方。可一旦找到了，他绝不会再给她机会改变主意。
