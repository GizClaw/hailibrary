  chapters:
    - id: ch01
      title: CHAPTER XIV
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: My brother bows to stone and brass, Kabir says, and worships in a heathen way. Yet in his voice I hear the same unanswered pain that lives in mine. Fate may choose his God, but his prayer belongs to all the world, and to me.
        - id: ch01-b02
          speaker: narrator
          text: The cautious coolies started at moonrise. Sleep and spirits had revived the lama, and with only Kim's shoulder beneath his hand, he walked swiftly and silently. For an hour they crossed grass scattered with shale. Then they rounded the shoulder of a vast cliff and climbed into a country completely hidden from the Chini valley.
        - id: ch01-b03
          speaker: narrator
          text: A great pasture spread upward like a fan until it met the living snow. At the bottom, a few huts of earth and timber stood on half an acre of level ground. Behind those huts, the earth dropped sheer for two thousand feet into Shamlegh-midden, where no person had ever set foot.
        - id: ch01-b04
          speaker: narrator
          text: The men would not divide their plunder until the lama lay safely in the best room, while Kim rubbed his feet in the Mohammedan fashion.
        - id: ch01-b05
          speaker: ao_chung_man
          text: We will send you food and the red-topped basket. By dawn, no one will remain to give evidence either way. If you find anything in the basket that you do not need, look here.
        - id: ch01-b06
          speaker: narrator
          text: He pointed through the window into empty space, bright with moonlight reflected from the snow, and tossed out a whisky bottle.
        - id: ch01-b07
          speaker: ao_chung_man
          text: Do not bother listening for it to land. This is the end of the world.
        - id: ch01-b08
          speaker: narrator
          text: He left. The lama placed both hands on the window ledge and gazed out, his eyes shining like yellow opals. White peaks rose from the enormous pit and reached toward the moon. Everything else was as black as the space between stars.
        - id: ch01-b09
          speaker: lama
          text: These truly are my Hills. A man should live like this, high above the world, apart from its pleasures, with his mind upon great things.
        - id: ch01-b10
          speaker: kim
          text: Yes, if he has a chela to make his tea, fold a blanket beneath his head, and drive out cows that are about to calve.
        - id: ch01-b11
          speaker: narrator
          text: A smoky lamp burned in a wall niche, though the full moon nearly drowned its light. In that strange mixture of smoke and silver, Kim bent over the food bag and cups like a tall ghost.
        - id: ch01-b12
          speaker: lama
          text: Ai! My blood has cooled, but my head still pounds like a drum. It feels as if a cord were pulled tight behind my neck.
        - id: ch01-b13
          speaker: kim
          text: No wonder. He struck you hard. May the man who did it...
        - id: ch01-b14
          speaker: lama
          text: If not for my own passions, no evil would have come of it.
        - id: ch01-b15
          speaker: kim
          text: What evil? You saved those Sahibs from a death they had earned a hundred times.
        - id: ch01-b16
          speaker: narrator
          text: The lama settled on a folded blanket while Kim continued the familiar work of preparing their evening.
        - id: ch01-b17
          speaker: lama
          text: You have not learned the lesson, chela. The blow was only a shadow falling on another shadow. By itself, it was evil, and my legs grow tired very quickly now. But that evil met anger in me, and rage, and the wish to answer hurt with hurt. Those passions boiled in my blood, churned my stomach, and filled my ears with noise.
        - id: ch01-b18
          speaker: narrator
          text: He took a cup from Kim and drank the scalding black tea with ceremony.
        - id: ch01-b19
          speaker: lama
          text: If I had been free of passion, the blow could only have harmed my body. It might have left a scar or a bruise, and the body is illusion. But my mind was not free. At once I wanted the Spiti men to kill those who struck me. Fighting that desire tore my soul worse than a thousand blows. Only after I repeated the Blessings did calm return.
        - id: ch01-b20
          speaker: lama
          text: Still, the evil planted in that careless instant must grow to its end. The Wheel is just. It does not turn aside by even a hair. Learn from this, chela.
        - id: ch01-b21
          speaker: kim
          text: The lesson is too high for me. I am shaken even now, and I am glad I hurt that man.
        - id: ch01-b22
          speaker: lama
          text: I knew it while I slept on your knees in the wood. The evil in your soul reached mine and troubled my dreams. Yet I gained merit by saving two lives, even though those men had wronged me. Now I must look into the Cause of Things. The boat of my soul is unsteady.
        - id: ch01-b23
          speaker: kim
          text: Sleep and grow strong. That would be wisest.
        - id: ch01-b24
          speaker: lama
          text: I will meditate. The need is greater than you understand.
        - id: ch01-b25
          speaker: narrator
          text: The lama faced the wall until dawn. Hour followed hour. Moonlight faded from the high peaks, and the black bands on the distant slopes slowly became soft green forest. Sometimes the lama groaned.
        - id: ch01-b26
          speaker: narrator
          text: Beyond the barred door, unhappy cows came looking for their old stable. Around them, Shamlegh and the coolies surrendered to plunder and wild feasting. The Ao-chung man led them. Once they opened the Sahibs' tins and tasted the food, they could not turn back. Everything unwanted went into the bottomless rubbish pit below.
        - id: ch01-b27
          speaker: narrator
          text: After a night of bad dreams, Kim slipped outside to clean his teeth in the cold morning air. A fair-skinned woman wearing a headdress studded with turquoise drew him aside. Her bright eyes met his boldly, unlike the hidden glances of most hillwomen.
        - id: ch01-b28
          speaker: woman_of_shamlegh
          text: The others have gone. As they promised, they left this basket for you. I do not love Sahibs, but you must make us a charm in payment. Little Shamlegh must not earn a bad name because of the accident. I am the Woman of Shamlegh.
        - id: ch01-b29
          speaker: kim
          text: Certainly. But the work must be secret.
        - id: ch01-b30
          speaker: narrator
          text: She lifted the heavy basket as if it weighed nothing and carried it into her hut.
        - id: ch01-b31
          speaker: kim
          text: Go outside and bar the door. Let no one come close until I finish.
        - id: ch01-b32
          speaker: woman_of_shamlegh
          text: And afterward, may we talk?
        - id: ch01-b33
          speaker: narrator
          text: Kim tipped the basket over. Survey instruments, books, diaries, letters, maps, and strangely scented native correspondence poured across the floor. Beneath them all lay an embroidered bag. Inside it was a sealed document, gilded and painted, of the sort one king sends to another. Kim caught his breath. Then he studied the heap with a Sahib's eyes.
        - id: ch01-b34
          speaker: kim
          text: I do not want the printed books. They are only logarithms for the Survey, I suppose. I cannot understand the letters, but Colonel Creighton can, so I must keep every one. Their maps are better than mine. Those stay too. And here are all the native letters. Oho! Most important of all, here is the murasla.
        - id: ch01-b35
          speaker: narrator
          text: He smelled the embroidered bag.
        - id: ch01-b36
          speaker: kim
          text: This must come from Hilas or Bunar. Hurree Babu spoke the truth. By Jove, what a prize! I wish he knew. Everything else must go through the window.
        - id: ch01-b37
          speaker: narrator
          text: Kim handled a splendid prismatic compass and the shining head of a theodolite. A Sahib could hardly steal such things, and later they might become dangerous evidence. So he gathered every scrap of writing, every map, and every native letter into one soft, thick slab. He also set apart three locked, iron-backed books and five worn pocketbooks.
        - id: ch01-b38
          speaker: kim
          text: The letters and the murasla go beneath my coat and belt. The handwritten books go in the food bag, though they will make it very heavy. I see nothing else worth keeping. If there was more, the coolies threw it down the ravine, so that is settled. Now the rest of you can go too.
        - id: ch01-b39
          speaker: narrator
          text: He filled the basket again with everything he meant to destroy and heaved it onto the window ledge. A thousand feet below, a long round bank of mist lay untouched by the rising sun. Another thousand feet beneath that stood an ancient pine forest. When the wind thinned the cloud, its green treetops looked like moss.
        - id: ch01-b40
          speaker: kim
          text: No, I do not think anyone will follow you down there!
        - id: ch01-b41
          speaker: narrator
          text: The basket turned as it fell and spilled its contents. The theodolite struck a ledge and burst like a shell. For a moment, books, inkpots, paint boxes, compasses, and rulers swarmed in the air like bees. Then all of them vanished. Kim leaned halfway through the window and listened with his sharp young ears, but no sound rose from the gulf.
        - id: ch01-b42
          speaker: kim
          text: Five hundred rupees would not buy those things. Perhaps not even a thousand. What a waste! Still, I have all the papers, all the work they did. I hope I have it all. But how can I tell Hurree Babu? What am I supposed to do now, with my old man sick and no one here to help me? First I must wrap the letters in oilskin, or my sweat will ruin them. At least that is one thing I can do.
        - id: ch01-b43
          speaker: narrator
          text: A lifetime on the road had made Kim as orderly as an old hunter. He pressed the stiff, sticky oilskin into a neat packet, sealed its edges, and packed the books with double care at the bottom of the food bag. Then the woman knocked.
        - id: ch01-b44
          speaker: woman_of_shamlegh
          text: But you have not made any charm.
        - id: ch01-b45
          speaker: narrator
          text: She looked around the hut. Kim had forgotten that he needed some impressive talk to complete the trick.
        - id: ch01-b46
          speaker: kim
          text: There is no need for one.
        - id: ch01-b47
          speaker: narrator
          text: The woman laughed without respect at his confusion.
        - id: ch01-b48
          speaker: woman_of_shamlegh
          text: Perhaps you need no charm. One wink of your eye can cast a spell. But think of us poor people after you leave. They were all too drunk last night to listen to a woman. You are not drunk, are you?
        - id: ch01-b49
          speaker: kim
          text: I am a priest.
        - id: ch01-b50
          speaker: narrator
          text: Kim recovered his dignity. Since the woman was far from ugly, he thought it safest to stand firmly upon his holy office.
        - id: ch01-b51
          speaker: woman_of_shamlegh
          text: I warned them the Sahibs would be angry. They may hold an inquiry and report us to the Rajah. And the Babu is with them. Clerks have very long tongues.
        - id: ch01-b52
          speaker: kim
          text: Is that the whole of your trouble?
        - id: ch01-b53
          speaker: narrator
          text: A complete plan formed in Kim's mind, and he gave her his most charming smile.
        - id: ch01-b54
          speaker: woman_of_shamlegh
          text: Not quite all of it.
        - id: ch01-b55
          speaker: narrator
          text: She reached toward him with a hard brown hand covered in silver-set turquoise.
        - id: ch01-b56
          speaker: kim
          text: I can settle the other trouble in a breath. The Babu is that very healer who wandered near Ziglaur. You have heard of him. I know the man.
        - id: ch01-b57
          speaker: woman_of_shamlegh
          text: He will tell what happened if someone offers a reward. Sahibs cannot tell one hillman from another, but Babus notice both men and women.
        - id: ch01-b58
          speaker: kim
          text: Then take him a message from me.
        - id: ch01-b59
          speaker: woman_of_shamlegh
          text: There is nothing I would refuse to do for you.
        - id: ch01-b60
          speaker: narrator
          text: Kim accepted the compliment as calmly as a man must in a country where women do the courting. He tore a leaf from a notebook. With an indelible pencil, he wrote in rough Shikast, the script naughty boys used for dirty words on walls.
        - id: ch01-b61
          speaker: kim
          text: I have everything they wrote, including their pictures of the country and many letters. Most of all, I have the murasla. Tell me what to do. I am at Shamlegh-under-the-Snow. The old man is sick.
        - id: ch01-b62
          speaker: kim
          text: Give this to the Babu. It will close his mouth completely. He cannot have gone far.
        - id: ch01-b63
          speaker: woman_of_shamlegh
          text: No, he is not far away. They are still in the forest beyond the spur. When daylight came, our children watched them and called out news of every movement.
        - id: ch01-b64
          speaker: narrator
          text: Kim could not hide his surprise. Then a sharp cry floated from the edge of the sheep pasture, high and thin as a kite's call. A child with the cattle had received the news from another child across the slope overlooking Chini valley.
        - id: ch01-b65
          speaker: woman_of_shamlegh
          text: My husbands are out there too, gathering wood.
        - id: ch01-b66
          speaker: narrator
          text: She took walnuts from her clothes, cracked one cleanly, and began to eat. Kim pretended not to understand.
        - id: ch01-b67
          speaker: woman_of_shamlegh
          text: Priest, do you truly not know what a walnut means?
        - id: ch01-b68
          speaker: narrator
          text: She handed him the two halves of the shell.
        - id: ch01-b69
          speaker: kim
          text: That is clever. I can hide the paper inside. Have you a little wax to seal the shell around it?
        - id: ch01-b70
          speaker: narrator
          text: The woman sighed so loudly that Kim softened toward her.
        - id: ch01-b71
          speaker: kim
          text: Payment comes only after the service. Take this to the Babu and tell him it came from the Son of the Charm.
        - id: ch01-b72
          speaker: woman_of_shamlegh
          text: Ai, yes! From a magician who looks like a Sahib.
        - id: ch01-b73
          speaker: kim
          text: No, from the Son of the Charm. Ask him whether he has an answer.
        - id: ch01-b74
          speaker: woman_of_shamlegh
          text: What if he insults me? I am afraid.
        - id: ch01-b75
          speaker: narrator
          text: Kim laughed.
        - id: ch01-b76
          speaker: kim
          text: He must be cold, exhausted, and hungry. The Hills are hard companions at night. Hai, my sister, you are wise and quick. By now, every village has heard what happened to the Sahibs, has it not?
        - id: ch01-b77
          speaker: woman_of_shamlegh
          text: Yes. The news reached Ziglaur before midnight, and tomorrow it will reach Kotgarh. The villages are frightened and angry.
        - id: ch01-b78
          speaker: kim
          text: They need not be. Tell them to feed the Sahibs and send them onward in peace. We want those men quietly out of our valleys. Stealing is one thing, but killing is another. The Babu will understand, and afterward there will be no complaints. Go quickly. I must care for my master when he wakes.
        - id: ch01-b79
          speaker: woman_of_shamlegh
          text: Very well. You said reward follows service. Remember, I am the Woman of Shamlegh, and I hold this place from the Rajah. I am no ordinary mother. All Shamlegh is yours, every hoof and horn and hide, all its milk and butter. Take it or leave it.
        - id: ch01-b80
          speaker: narrator
          text: Her silver necklaces clicked across her breast as she marched uphill to meet the morning sun, fifteen hundred feet above. Kim went back to sealing the oilskin and thought in the language of the hills.
        - id: ch01-b81
          speaker: kim
          text: How can a man follow the Way or play the Great Game when women always bother him? First there was the girl at Akrola of the Ford, then the kitchen maid's wife behind the dovecote, and others besides. Now this woman comes along. It was simple when I was a child. Now I am a man, yet they refuse to treat me as one. Walnuts indeed! In the Plains, the sign is almonds. Ho! Ho!
        - id: ch01-b82
          speaker: narrator
          text: Kim went out to claim supplies from the village, not humbly with a begging bowl, but like a prince collecting what was owed. Only three families lived in Shamlegh during summer, four women and eight or nine men. After their night of plunder, all of them were full of tinned meat and strange mixtures of drink, from medicine flavored with ammonia to clear vodka. Pieces of the Sahibs' fine tents had already been shared out, and new aluminum pans shone here and there.
        - id: ch01-b83
          speaker: narrator
          text: The villagers believed the lama's presence would protect them from every consequence. Without a trace of shame, they gave Kim the best they had, even chang, the barley beer brought from Ladakh. Then they warmed themselves in the sun, perched with their legs over endless drops, and talked and laughed and smoked.
        - id: ch01-b84
          speaker: narrator
          text: They judged India and its government by the wandering Sahibs who had hired them or their friends as hunting guides. Kim heard every detail of shots those Sahibs had missed at ibex, serow, and markhor, even when the hunter had been dead for twenty years. Each memory flashed as sharply as branches seen against lightning.
        - id: ch01-b85
          speaker: narrator
          text: They described their small illnesses, and spoke even longer about the illnesses of their tiny, sure-footed cattle. They told of journeys to Kotgarh, home of strange missionaries, and even beyond to wonderful Simla. They said its streets were paved with silver, and anyone could find work with the Sahibs, who rode in two-wheeled carts and scattered money as if using a shovel.
        - id: ch01-b86
          speaker: narrator
          text: At last the lama came heavily to join the talk beneath the eaves, grave and distant. Everyone made a wide space for him. The thin air revived him. He sat with the others on the edge of the precipice, and whenever the talk faded, he tossed pebbles into the emptiness.
        - id: ch01-b87
          speaker: narrator
          text: The next mountain range lay thirty miles away by an eagle's flight. Its sides were cut and hollowed, with little patches of brush that were really forests, each one a full dark day's march. Behind the village, Shamlegh hill blocked every view to the south. They might have been sitting in a swallow's nest beneath the roof of the world.
        - id: ch01-b88
          speaker: narrator
          text: Now and then the lama stretched out his hand. After a quiet question, he would point toward the road to Spiti or north across the Parungla.
        - id: ch01-b89
          speaker: lama
          text: There, where the hills crowd thickest, stands De-chen, the great monastery you call Han-le. S'Tag-stan-ras-ch'en built it, and there is a tale about him.
        - id: ch01-b90
          speaker: narrator
          text: He told them a towering, fantastic story filled with spells and miracles, until all Shamlegh stared in wonder. Then he turned a little west toward Kulu's green hills and searched the distance for Kailung beneath the glaciers.
        - id: ch01-b91
          speaker: lama
          text: I went there in the old, old days. I came from Leh across the Baralachi.
        - id: ch01-b92
          speakers: [shamlegh_man_1, shamlegh_man_2, shamlegh_woman]
          ensemble: chorus
          text: Yes, yes. We know that road.
        - id: ch01-b93
          speaker: lama
          text: I spent two nights with the priests at Kailung. These are the Hills I love, shadows more blessed than any other shadows. Here my eyes first opened upon the world, and here they opened to its meaning. Here I found Enlightenment and prepared myself for my Search. I came out of the high Hills and their strong winds. The Wheel is just!
        - id: ch01-b94
          speaker: narrator
          text: He blessed the country piece by piece, like a dying man blessing his family. He named the great glaciers and bare rocks, the piled moraines and fallen shale, the dry high ground and hidden salt lakes, the ancient forests and the rich valleys cut by water. Kim had never seen such passion in him.
        - id: ch01-b95
          speakers: [shamlegh_man_1, shamlegh_man_2, shamlegh_woman]
          ensemble: chorus
          text: Yes, yes. Nowhere can equal our Hills.
        - id: ch01-b96
          speaker: narrator
          text: The people began wondering how anyone could endure the dreadful heat of the Plains. They had heard that cattle grew as large as elephants there and could never plough a hillside. Villages touched one another for a hundred miles. Thieves traveled in gangs, and whatever robbers left behind, the Police carried away.
        - id: ch01-b97
          speaker: narrator
          text: The quiet morning passed. At its end, Kim's messenger came down the steep pasture without breathing any harder than when she left. As she bowed to the lama, Kim explained that he had sent word to the healer.
        - id: ch01-b98
          speaker: lama
          text: Did he join the idolaters? No, I remember that he healed one of them, though the man used his recovered strength for evil. Even so, the healer gained merit. The Wheel is just. What news of him?
        - id: ch01-b99
          speaker: kim
          text: I feared you were badly hurt, and I knew he was wise.
        - id: ch01-b100
          speaker: narrator
          text: Kim opened the waxed walnut shell. On the back of his own note, Hurree Babu had answered in English. He could not leave his present companions yet, but would take them to Simla and then try to rejoin Kim. Following angry gentlemen would be unwise. Kim should return by the road he had come, and Hurree would catch up. He was greatly pleased that his foresight had won the correspondence.
        - id: ch01-b101
          speaker: kim
          text: Holy One, he says he will get away from the idolaters and return to us. Should we wait here in Shamlegh for a while?
        - id: ch01-b102
          speaker: narrator
          text: The lama gazed at the hills for a long time, full of love, and then shook his head.
        - id: ch01-b103
          speaker: lama
          text: We cannot stay, chela. Every bone in me longs for it, but I am forbidden. I have seen the Cause of Things.
        - id: ch01-b104
          speaker: kim
          text: Why must we go when the Hills restore your strength each day? Remember how weak and faint we were in the Doon below.
        - id: ch01-b105
          speaker: lama
          text: I grew strong so that I could do evil and forget my purpose. I became a fighter and a swaggerer on these hillsides.
        - id: ch01-b106
          speaker: narrator
          text: Kim stopped himself from smiling.
        - id: ch01-b107
          speaker: lama
          text: The Wheel is perfectly just and never moves aside by a hair. Long ago, when I was a man, I made a pilgrimage through the poplars to Guru Ch'wan, where they keep the Sacred Horse.
        - id: ch01-b108
          speakers: [shamlegh_man_1, shamlegh_man_2, shamlegh_woman]
          ensemble: chorus
          text: Speak softly! That is Jam-lin-nin-k'or, the Horse That Can Go Around the World in a Day.
        - id: ch01-b109
          speaker: lama
          text: I am speaking only to my chela.
        - id: ch01-b110
          speaker: narrator
          text: His rebuke was gentle, but the listeners scattered as quickly as frost leaving a roof in the morning sun.
        - id: ch01-b111
          speaker: lama
          text: In those days I did not seek truth. I only wanted to argue doctrine. It was all illusion. I drank Guru Ch'wan's beer and ate his bread. The next day, someone said we were going down the valley to fight Sangor Gutok. Notice how Desire fastens itself to Anger. The fight would decide which Abbot ruled the valley and took the profit from the prayers printed there. I went with them, and we fought all day.
        - id: ch01-b112
          speaker: kim
          text: How did holy men fight, Holy One?
        - id: ch01-b113
          speaker: lama
          text: We used our long pen cases. I could have shown you once. Both Abbots and every monk fought beneath the poplars. One man cut my forehead open to the bone. Look here.
        - id: ch01-b114
          speaker: narrator
          text: He pushed back his cap and revealed a puckered silver scar.
        - id: ch01-b115
          speaker: lama
          text: The Wheel is perfectly just. Yesterday that scar began to itch. After fifty years, I remembered the blow and the face of the man who gave it. For a little while, I lived inside that illusion. Then came the struggle and foolishness you saw. The idolater struck the very same scar.
        - id: ch01-b116
          speaker: lama
          text: My soul shook and darkened. Its boat rolled upon the waters of illusion. Only here at Shamlegh could I meditate on the Cause of Things and follow evil down to its tangled roots. I struggled with it through the whole night.
        - id: ch01-b117
          speaker: kim
          text: But you have done no evil, Holy One. Let me be your sacrifice!
        - id: ch01-b118
          speaker: narrator
          text: The old man's grief truly distressed Kim, and Mahbub Ali's own phrase escaped his lips without thought.
        - id: ch01-b119
          speaker: lama
          text: Enlightenment came at dawn. I am an old man, born and fed among the hills, yet I must never settle in my Hills. For three years I crossed Hind. But can the earth be stronger than Mother Earth? From the country below, my foolish body ached for these slopes and snows.
        - id: ch01-b120
          speaker: lama
          text: I knew my Search was certain. Still, at the Kulu woman's house, I persuaded myself to turn toward the mountains. The healer is not to blame. Desire led him to promise the Hills would strengthen me. They did, but they made me strong enough to forget my Search and do evil.
        - id: ch01-b121
          speaker: lama
          text: I delighted in life and wanted more of it. I hunted for steep slopes so I could test my body's strength against the high Hills. At Jamnotri, I mocked you when you lost your breath. At the pass, I laughed because you feared the snow.
        - id: ch01-b122
          speaker: kim
          text: Where was the harm? I really was afraid, and it was right for me to be. I am no hillman. I loved you for becoming strong again.
        - id: ch01-b123
          speaker: lama
          text: More than once, I wanted you and the healer to praise the mere strength of my legs.
        - id: ch01-b124
          speaker: narrator
          text: He leaned his cheek sadly against his hand.
        - id: ch01-b125
          speaker: lama
          text: One evil followed another until the cup was full. The Wheel is just. For three years, all Hind honored me. From the Fountain of Wisdom in the Wonder House to a small child playing beside a great gun, everyone cleared my road. Why did they do that?
        - id: ch01-b126
          speaker: kim
          text: Because we loved you. The blow has given you a fever. I am still sick and shaken myself.
        - id: ch01-b127
          speaker: lama
          text: No. They honored me because I walked upon the Way. I was tuned to the Law's purpose as cymbals are tuned to one another. Then I left that order. The music broke, and punishment followed. In my own Hills, beside my own country, in the very place where desire led me, the blow fell here.
        - id: ch01-b128
          speaker: narrator
          text: He touched his forehead.
        - id: ch01-b129
          speaker: lama
          text: A novice who puts the cups in the wrong place is corrected with a beating. I too was corrected, though I was once Abbot of Such-zen. There was no warning, chela. There was only a blow.
        - id: ch01-b130
          speaker: kim
          text: But the Sahibs did not know who you were, Holy One.
        - id: ch01-b131
          speaker: lama
          text: We were evenly matched. Their ignorance and desire met mine upon the road, and together they produced Anger. The blow was a sign to me, no better than a wandering yak, that I do not belong here. A man who can read the Cause of an act is halfway to Freedom.
        - id: ch01-b132
          speaker: lama
          text: The Blow tells me to return to the path. It says the Hills are not mine. No one can choose Freedom while remaining chained to the pleasure of life.
        - id: ch01-b133
          speaker: kim
          text: I wish we had never met that cursed Russian!
        - id: ch01-b134
          speaker: lama
          text: Even our Lord cannot turn the Wheel backward. Yet the merit I earned has brought me another sign.
        - id: ch01-b135
          speaker: narrator
          text: From inside his robe, the lama drew the Wheel of Life.
        - id: ch01-b136
          speaker: lama
          text: I studied this after my meditation. The idolater tore it until only a strip as wide as my fingernail remained.
        - id: ch01-b137
          speaker: kim
          text: I see it.
        - id: ch01-b138
          speaker: lama
          text: That narrow strip shows the length of my life in this body. I served the Wheel through all my days, and now the Wheel serves me. Because I gained merit by guiding you on the Way, I need not pass through another life before finding my River. Do you understand, chela?
        - id: ch01-b139
          speaker: narrator
          text: Kim stared at the ruined chart. The tear ran diagonally from the Eleventh House, where Desire gives birth to the Child, across the worlds of humans and animals, and into the empty Fifth House of the Senses. By the lama's reasoning, there could be no answer.
        - id: ch01-b140
          speaker: lama
          text: Before our Lord reached Enlightenment, temptation came to Him. Temptation came to me as well, but it has ended. The Arrow fell in the Plains, not in the Hills. Why, then, are we here?
        - id: ch01-b141
          speaker: kim
          text: Can we not at least wait for the healer?
        - id: ch01-b142
          speaker: lama
          text: I know how much time remains to me in this body. What could any healer do?
        - id: ch01-b143
          speaker: kim
          text: You are sick and shaken. You cannot even walk.
        - id: ch01-b144
          speaker: lama
          text: How can I be sick when I can see Freedom?
        - id: ch01-b145
          speaker: narrator
          text: He struggled unsteadily to his feet.
        - id: ch01-b146
          speaker: kim
          text: Then I must find food in the village. Oh, that weary Road!
        - id: ch01-b147
          speaker: narrator
          text: Kim felt that he too badly needed rest.
        - id: ch01-b148
          speaker: lama
          text: Getting food is lawful. We will eat, and then we will go. The Arrow fell in the Plains, but I gave way to Desire. Make ready, chela.
        - id: ch01-b149
          speaker: narrator
          text: Kim turned to the Woman of Shamlegh. She had been idly throwing pebbles over the cliff, and now she smiled at him with great kindness.
        - id: ch01-b150
          speaker: woman_of_shamlegh
          text: I found your Babu like a lost buffalo in a field of corn. He was snorting and sneezing from the cold. Hunger made him forget his pride, and he spoke sweetly to me. The Sahibs have nothing left. One of them is very ill in the stomach. Did your own work succeed?
        - id: ch01-b151
          speaker: narrator
          text: Kim nodded, his eye bright.
        - id: ch01-b152
          speaker: woman_of_shamlegh
          text: First I spoke to the Bengali, and then to the people in a nearby village. They will feed the Sahibs whenever food is needed and ask no money. The stolen goods have already been scattered. The Babu tells the Sahibs one lie after another. Why does he stay with them?
        - id: ch01-b153
          speaker: kim
          text: Because his heart is so great.
        - id: ch01-b154
          speaker: woman_of_shamlegh
          text: No Bengali ever had a heart larger than a dried walnut. Never mind that. Now we must speak about walnuts. The service is done, so the reward should follow. I told you the whole village was yours.
        - id: ch01-b155
          speaker: kim
          text: It is my great loss. Even now I had been imagining delightful things, but my master has been guided by a vision.
        - id: ch01-b156
          speaker: narrator
          text: Kim sighed deeply and gave her all the graceful compliments the moment required.
        - id: ch01-b157
          speaker: kim
          text: He is turning away from your village. We must go down to the Plains again.
        - id: ch01-b158
          speaker: woman_of_shamlegh
          text: Huh! What can old eyes see besides a full begging bowl?
        - id: ch01-b159
          speaker: kim
          text: He says we leave within the hour. I am his chela, so I must go with him. We need food for the journey. Every village treats him as an honored guest, but the food here is especially good. Give me some.
        - id: ch01-b160
          speaker: woman_of_shamlegh
          text: Tell him to stay.
        - id: ch01-b161
          speaker: narrator
          text: Kim shook his head.
        - id: ch01-b162
          speaker: kim
          text: I know my Holy One. If anyone crosses him, his rage is terrible. His curses can shake the Hills.
        - id: ch01-b163
          speaker: woman_of_shamlegh
          text: It is a pity they could not save his head from being broken. I heard you were the tiger-hearted one who struck the Sahib. Let the old man dream a little longer. You stay.
        - id: ch01-b164
          speaker: kim
          text: Hillwoman, such matters are far above you.
        - id: ch01-b165
          speaker: narrator
          text: Kim tried to look severe, but he could not harden the young curves of his face.
        - id: ch01-b166
          speaker: woman_of_shamlegh
          text: Gods preserve us! Since when have men and women been anything but men and women?
        - id: ch01-b167
          speaker: kim
          text: A priest is still a priest. My master means to leave now. I am his chela, and I go where he goes. Give us food for the Road.
        - id: ch01-b168
          speaker: woman_of_shamlegh
          text: What if I refuse? I rule this village.
        - id: ch01-b169
          speaker: kim
          text: Then I will curse you. Only a little curse, but strong enough for you to remember.
        - id: ch01-b170
          speaker: narrator
          text: He could not keep himself from smiling.
        - id: ch01-b171
          speaker: woman_of_shamlegh
          text: Your lowered eyelids and raised chin have cursed me already. Why should mere words frighten me?
        - id: ch01-b172
          speaker: narrator
          text: She clenched both hands against her breast.
        - id: ch01-b173
          speaker: woman_of_shamlegh
          text: Still, I do not want you leaving in anger and thinking badly of me. I may gather dung and grass here in Shamlegh, but I am a woman of property.
        - id: ch01-b174
          speaker: kim
          text: I think only that I am sorry to leave because I am very tired, and that we need food. Here is the bag.
        - id: ch01-b175
          speaker: narrator
          text: She snatched it from him in anger.
        - id: ch01-b176
          speaker: woman_of_shamlegh
          text: I was foolish. Who is your woman in the Plains? Is she fair or dark? I was fair once. Do you laugh? Long ago, a Sahib admired me. I wore European clothes at the Mission-house near Kotgarh, and I spoke English as the Sahibs do.
        - id: ch01-b177
          speaker: woman_of_shamlegh
          text: My Sahib said he would come back and marry me. I had cared for him while he was ill, but he left and never returned. Then I knew the Christian Gods had lied, and I went home to my own people. I have not looked upon a Sahib since.
        - id: ch01-b178
          speaker: woman_of_shamlegh
          text: Do not laugh, little priest. The madness has passed. Your face and walk and way of speaking reminded me of my Sahib, though you are only a wandering beggar receiving my charity. You cannot truly curse or bless me. Your Gods are lies, your deeds are lies, and your words are lies. There are no Gods beneath all Heaven. I know that.
        - id: ch01-b179
          speaker: narrator
          text: She planted her hands on her hips and laughed bitterly.
        - id: ch01-b180
          speaker: woman_of_shamlegh
          text: For a little while, I believed my Sahib had returned. He was my God. Once I even played music on a piano at the Mission-house. Now I give food to heathen priests.
          emotion: sad
        - id: ch01-b181
          speaker: narrator
          text: She ended with the English word and tied shut the mouth of the bulging food bag.
        - id: ch01-b182
          speaker: lama
          text: I am waiting for you, chela.
        - id: ch01-b183
          speaker: narrator
          text: The lama leaned against the doorpost. The woman studied his tall body from head to foot.
        - id: ch01-b184
          speaker: woman_of_shamlegh
          text: Walk? He could not manage half a mile. Where do those old bones expect to go?
        - id: ch01-b185
          speaker: narrator
          text: Kim was already troubled by the lama's collapse and worried about the heavy bag. Now he truly lost his temper.
        - id: ch01-b186
          speaker: kim
          text: Woman of bad luck, what business is it of yours where he goes?
          emotion: angry
        - id: ch01-b187
          speaker: woman_of_shamlegh
          text: None at all, but it matters to you, priest with a Sahib's face. Will you carry him on your back?
        - id: ch01-b188
          speaker: lama
          text: I am going to the Plains, and no one must prevent me. I wrestled with my soul until my strength left me. This foolish body is exhausted, and the Plains are far away.
        - id: ch01-b189
          speaker: woman_of_shamlegh
          text: Look at him.
        - id: ch01-b190
          speaker: narrator
          text: She stepped aside so Kim had to face his helplessness.
        - id: ch01-b191
          speaker: woman_of_shamlegh
          text: Curse me. Perhaps that will make him stronger. Work a charm. Call upon your mighty God. You are a priest, after all.
        - id: ch01-b192
          speaker: narrator
          text: She turned away. The lama sank weakly to the ground, still clutching the doorpost. An old man struck down by a blow cannot recover overnight like a boy. Weakness bent him into the dust, though his eyes remained alive and pleaded with Kim.
        - id: ch01-b193
          speaker: kim
          text: It will be all right. This thin air is what weakens you. We will leave very soon. It is only mountain sickness. Even my own stomach feels a little ill.
        - id: ch01-b194
          speaker: narrator
          text: Kim knelt beside him and offered whatever poor comfort came first to mind. Then the woman returned, standing straighter than ever.
        - id: ch01-b195
          speaker: woman_of_shamlegh
          text: Your Gods are useless, are they? Then try mine. I am the Woman of Shamlegh!
        - id: ch01-b196
          speaker: narrator
          text: She shouted hoarsely. Her two husbands and three other men came from a cow pen carrying a dooli, the rough hill litter used for sick people and important visits.
        - id: ch01-b197
          speaker: woman_of_shamlegh
          text: These cattle are yours for as long as you need them.
        - id: ch01-b198
          speaker: shamlegh_man_1
          text: But we will not take the road toward Simla. We will not go anywhere near the Sahibs.
        - id: ch01-b199
          speaker: woman_of_shamlegh
          text: They will not run off like the other men, and they will not steal your baggage. Two of them are weaklings, but they will do. Sonoo and Taree, take the rear pole. Lower the litter now and lift the holy man into it. I will manage the village and your virtuous wives until you return.
        - id: ch01-b200
          speaker: shamlegh_man_2
          text: When will we return?
        - id: ch01-b201
          speaker: woman_of_shamlegh
          text: Ask the priests, and stop bothering me. Put the food bag at the lama's feet. It will balance the litter better.
        - id: ch01-b202
          speaker: kim
          text: Oh, Holy One, your Hills are kinder than our Plains. This is a king's bed, a place of honor and comfort, and we owe it all to...
        - id: ch01-b203
          speaker: woman_of_shamlegh
          text: A woman of bad luck. I need your blessings as little as I need your curses. This is my command, not yours. Lift him and go! Wait. Have you money for the road?
        - id: ch01-b204
          speaker: narrator
          text: She called Kim into her hut and bent over a battered English cashbox kept beneath her cot.
        - id: ch01-b205
          speaker: kim
          text: I need nothing more. You have already loaded me rather roughly with favors.
        - id: ch01-b206
          speaker: narrator
          text: Kim sounded angry when gratitude would have served him better. The woman looked up with a strange smile and put one hand on his shoulder.
        - id: ch01-b207
          speaker: woman_of_shamlegh
          text: At least thank me. My face is ugly and I am only a hillwoman, but by your way of speaking, I have earned merit. Shall I show you how a Sahib gives thanks?
        - id: ch01-b208
          speaker: narrator
          text: Her hard eyes softened.
        - id: ch01-b209
          speaker: kim
          text: I am only a wandering priest. You need neither my blessing nor my curse.
        - id: ch01-b210
          speaker: woman_of_shamlegh
          text: No. But for one little moment, if you were a Sahib, shall I show you what you would do? The litter is only ten strides away. You can easily catch it.
        - id: ch01-b211
          speaker: kim
          text: What if I can guess?
        - id: ch01-b212
          speaker: narrator
          text: Kim put an arm around her waist, kissed her cheek, and spoke in English.
        - id: ch01-b213
          speaker: kim
          text: Thank you very much, my dear.
        - id: ch01-b214
          speaker: narrator
          text: Kissing was almost unknown among Asiatics. Perhaps that was why she leaned back with wide eyes and panic across her face.
        - id: ch01-b215
          speaker: kim
          text: Next time, do not be so certain about your heathen priests. Now I say goodbye.
        - id: ch01-b216
          speaker: narrator
          text: He offered his hand in the English manner, and she took it without thinking.
        - id: ch01-b217
          speaker: kim
          text: Goodbye, my dear.
        - id: ch01-b218
          speaker: woman_of_shamlegh
          text: Goodbye, and... will you come back again? Goodbye, and thee God bless you.
        - id: ch01-b219
          speaker: narrator
          text: Half an hour later, the litter creaked along the hill path leading southeast from Shamlegh. Kim looked back and saw a tiny figure at the hut door waving a white cloth.
        - id: ch01-b220
          speaker: lama
          text: Her merit is greater than anyone else's. To set a man upon the road to Freedom is half as great as finding Freedom herself.
        - id: ch01-b221
          speaker: kim
          text: Hmm. Perhaps I gained some merit as well. At least she did not treat me like a child.
        - id: ch01-b222
          speaker: narrator
          text: He thought over what had happened. Then he adjusted his robe over the thick packet of documents and maps, settled the precious food bag again at the lama's feet, and placed a hand on the litter. Matching the slow pace of the grunting husbands, he bent himself to the road.
        - id: ch01-b223
          speaker: lama
          text: These men are earning merit too.
        - id: ch01-b224
          speaker: narrator
          text: They had traveled three miles.
        - id: ch01-b225
          speaker: kim
          text: They will earn more than merit. I shall pay them in silver.
        - id: ch01-b226
          speaker: narrator
          text: The Woman of Shamlegh had given Kim the money. It seemed only fair to him that her husbands should earn it back.
