audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts: {delivery: "从容而机敏的讲述", timbre: "温暖清晰", pace: "舒展而有变化", pitch: "中音"}
    kim:
      display_name: 金
      tts: {delivery: "机灵大胆，话里常带笑", timbre: "明亮的少年声", pace: "轻快敏捷", pitch: "中高音"}
    lama:
      display_name: 德舒喇嘛
      tts: {delivery: "慈爱虔诚，沉思中透着天真", timbre: "清瘦柔和的老人声", pace: "从容缓慢", pitch: "中低音"}
    ao_chung:
      display_name: 奥仲猎手
      tts: {delivery: "豪爽果断，惯于领头", timbre: "粗厚洪亮", pace: "明快", pitch: "中低音"}
    shamlegh_man:
      display_name: 沙姆莱山民
      tts: {delivery: "机敏圆滑，善于说服", timbre: "明亮粗朴", pace: "轻快", pitch: "中音"}
    shamlegh_man_2:
      display_name: 沙姆莱山民乙
      tts: {delivery: "质朴爽直，随众应和", timbre: "粗粝结实", pace: "平稳", pitch: "中低音"}
    shamlegh_man_3:
      display_name: 沙姆莱山民丙
      tts: {delivery: "热情好奇，情绪外露", timbre: "清亮粗朴", pace: "稍快", pitch: "中音"}
    shamlegh_woman:
      display_name: 沙姆莱女人
      tts: {delivery: "大胆泼辣，机敏中藏着沧桑", timbre: "明亮坚实的女声", pace: "明快而有变化", pitch: "中音"}
  chapters:
    - id: ch01
      title: 第十四章
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: "迦比尔说，我的兄弟跪在地上，照异教规矩膜拜石头和黄铜。可他的声音里，有着和我一样无人回答的痛苦。他的神由命数指定，他的祈祷却属于整个世界，也属于我。"
        - id: ch01-b02
          speaker: narrator
          text: "月亮升起，谨慎的挑夫们动身了。喇嘛睡过一觉，又借酒恢复了几分精神。他扶着金的肩，沉默而迅速地走了一个钟头。众人沿页岩遍地的草坡前行，绕过古老峭壁的山肩，便进了另一方天地。奇尼谷完全隐到群山背后。眼前一片巨大牧场，像扇面一样铺向终年不化的雪线。牧场底部只有半英亩平地，几间泥木茅屋立在那里。屋后便是两千英尺的陡坠，直落沙姆莱垃圾谷，从没人到过谷底。"
        - id: ch01-b03
          speaker: narrator
          text: "众人先把喇嘛安顿进村里最好的屋子。金照穆斯林的办法替师父揉脚，挑夫们看了一阵，这才去分赃。"
        - id: ch01-b04
          speaker: ao_chung
          text: "吃的会给你们送来，那只红盖基尔塔也会送来。天亮以前，不管出了什么事，都不会留下证据。基尔塔里若有用不着的东西，你们看着。"
        - id: ch01-b05
          speaker: narrator
          text: "奥仲人指向窗外。那里只有雪光填满的虚空。他随手把一只空威士忌酒瓶扔了出去。"
        - id: ch01-b06
          speaker: ao_chung
          text: "不用等它落地，这里就是世界尽头。"
        - id: ch01-b07
          speaker: narrator
          text: "奥仲人走了。喇嘛两手扶住窗框向外望，双眼亮得像黄蛋白石。窗外是一个深得看不见底的巨坑。白色峰峦从坑底探出，像在伸向月光。除此以外，只剩星辰之间那样的黑暗。"
        - id: ch01-b08
          speaker: lama
          text: "这些才真是我的群山。人本该住在这种地方，高悬在尘世之上，远离享乐，只想那些广大深远的事。"
        - id: ch01-b09
          speaker: kim
          text: "是啊，只要他有个徒弟替他煮茶，把毯子叠成枕头，再把要生小牛的母牛赶出去。"
        - id: ch01-b10
          speaker: narrator
          text: "壁龛里有一盏熏得发黑的灯，满屋月光却压过了那点火。两种光交在一起，金低头摆弄食物袋和杯子，身影高大得像个鬼。"
        - id: ch01-b11
          speaker: lama
          text: "唉，方才身上的血一冷，脑袋又怦怦敲起来了，后颈也像有根绳子勒着。"
        - id: ch01-b12
          speaker: kim
          text: "这有什么奇怪？那一拳太重了。打你的人活该受罪。"
        - id: ch01-b13
          speaker: lama
          text: "若不是我自己的激情作祟，世上便不会有这场恶。"
        - id: ch01-b14
          speaker: kim
          text: "什么恶？你救了那两个少爷。他们就是死上一百次，也不算多。"
        - id: ch01-b15
          speaker: narrator
          text: "喇嘛说金还没学会这门功课。金照常收拾晚间用的东西，老人则在折好的毯子上躺稳。"
        - id: ch01-b16
          speaker: lama
          text: "那一拳只是落在影子上的影子。拳头本是恶，而它撞上的，也是我心里的恶。这几天我的腿越来越容易疲倦。可挨打时，愤怒、狂暴，还有以恶报恶的欲望，都在我血里翻滚，搅乱肚腹，震得耳朵发昏。"
        - id: ch01-b17
          speaker: narrator
          text: "喇嘛郑重地接过金递来的滚烫浓茶，不加奶，慢慢喝了起来。"
        - id: ch01-b18
          speaker: lama
          text: "如果我心里没有激情，那只拳头只能伤到肉身，留下一道伤或一块青肿。肉身原是幻象。可我的心并未超脱。我立刻想叫斯皮提人杀了他们。为了压住这个欲念，我的灵魂撕裂扭曲，比挨一千拳还痛。直到反复诵念诸福，我才平静下来。可一时疏忽种下的恶，仍会结完它的果。生命之轮公正无误，分毫不偏。徒儿，记住这个教训。"
        - id: ch01-b19
          speaker: kim
          text: "这道理太高深了。我到现在还在发抖，可我很高兴自己打伤了那个人。"
        - id: ch01-b20
          speaker: lama
          text: "方才在下面树林里，我枕着你的膝头睡觉，已经感觉到了。你灵魂里的恶传进来，搅扰了我的梦。不过，我救下了两个伤害我的人，也积了功德。如今我必须看清万物的起因。我的灵魂之舟正在摇晃。"
        - id: ch01-b21
          speaker: kim
          text: "那就睡一觉，把力气养回来。这才最明智。"
        - id: ch01-b22
          speaker: lama
          text: "我要冥想。有件事很要紧，只是你还不知道它有多要紧。"
        - id: ch01-b23
          speaker: narrator
          text: "月光渐渐从高峰上退去，远山腰间那圈黑色露出了嫩绿树林。喇嘛一直望着墙壁，一小时又一小时，不时呻吟。门牢牢闩着，几头牛守在门外，想讨回原来的牛棚。外面，沙姆莱人和挑夫们大吃大喝，痛快分赃。奥仲人带头撬开少爷们的罐头，尝出滋味以后，谁也停不下来。不要的行李，全叫沙姆莱垃圾谷吞了。"
        - id: ch01-b24
          speaker: narrator
          text: "金做了一夜噩梦。清早，他偷偷出去，在寒气中刷牙。一个皮肤白皙、头饰镶满绿松石的女人把他拉到一旁。"
        - id: ch01-b25
          speaker: shamlegh_woman
          text: "其他人都走了，按约定把这只基尔塔留给你。我不喜欢那些少爷，不过你得替我们做道护符。我们可不想因为那场意外，叫小小的沙姆莱坏了名声。我是沙姆莱女人。"
        - id: ch01-b26
          speaker: narrator
          text: "她用大胆明亮的眼睛打量金，毫不躲闪。"
        - id: ch01-b27
          speaker: kim
          text: "当然可以，不过这事得偷偷办。"
        - id: ch01-b28
          speaker: narrator
          text: "女人轻轻举起沉重的基尔塔，甩进自己的茅屋。"
        - id: ch01-b29
          speaker: kim
          text: "出去，把门闩上！我没做完以前，谁都不许靠近。"
        - id: ch01-b30
          speaker: shamlegh_woman
          text: "等你做完了，我们能说说话吗？"
        - id: ch01-b31
          speaker: narrator
          text: "金把基尔塔倒在地上。测量仪器、书本、日记、书信和地图像瀑布一样涌出来，其中还有散发怪香的本地人信函。最底下是一只刺绣袋，里面包着加封、描金、彩绘的公文，正是国王送给另一位国王的东西。金欢喜得屏住呼吸，立刻站到少爷的立场上盘算。"
        - id: ch01-b32
          speaker: kim
          text: "书不要。这些是对数表，大概给测量用。信虽看不懂，克赖顿上校却看得懂，一封也不能少。地图画得比我好，当然得拿。所有本地人的信也要，尤其是穆拉斯拉。这个刺绣袋的气味，多半来自希拉斯或布纳尔。胡里先生果然没说错。老天，这次收获可真大！要是他知道就好了。其余东西全得扔出窗外。"
        - id: ch01-b33
          speaker: narrator
          text: "金摸摸精美的棱镜罗盘，又摸摸经纬仪闪亮的顶盖。公然偷走少爷的仪器不大妥当，以后也可能成为麻烦的证据。他挑出每张手稿、每幅地图和所有本地书信，叠成软软一摞。另一边放着三本带锁扣、铁包书脊的大书，还有五本磨旧的袖珍笔记本。"
        - id: ch01-b34
          speaker: kim
          text: "信和穆拉斯拉藏进外衣，塞到腰带底下。手写的本子放进食物袋，就是会很沉。没有别的了。即使还有，也被挑夫扔下了山沟，所以不要紧。现在，该你们走了。"
        - id: ch01-b35
          speaker: narrator
          text: "他把不要的东西装回基尔塔，又把背篓搬上窗台。脚下一千英尺处，横着一道圆肩的长雾堤，朝阳还没有照上去。雾堤再往下一千英尺，是一片百年松林。风涡吹薄云雾时，绿色树冠看起来像一床苔藓。"
        - id: ch01-b36
          speaker: kim
          text: "不，我想不会有人下去追你们！"
        - id: ch01-b37
          speaker: narrator
          text: "背篓一路翻滚，里面的东西四散喷出。经纬仪撞上崖台，像炮弹一样炸开。书本、墨水瓶、颜料盒、罗盘和直尺像一群蜜蜂，在半空显了一瞬，随即消失。金把半个身子探出窗外，竖起灵敏的耳朵。深谷里始终没有声音传上来。"
        - id: ch01-b38
          speaker: kim
          text: "这些东西花五百，甚至一千卢比也买不回来，扔了实在可惜。可他们其余的东西全在我手里。希望他们做过的事，也全记录在这里。现在该怎么通知胡里先生？接下来又该怎么办？我的老人还病着。先用油布把信包好，不然会叫汗浸透。可眼下只有我一个人！"
        - id: ch01-b39
          speaker: narrator
          text: "金把信扎成整齐的一包，用力压平又硬又黏的油布四角。他一生漂泊，路上的事做起来，早已像老猎手一样有条理。随后，他格外小心地把本子放进食物袋底部。女人在外面敲门。"
        - id: ch01-b40
          speaker: shamlegh_woman
          text: "可你还没有做护符。"
        - id: ch01-b41
          speaker: kim
          text: "用不着做。"
        - id: ch01-b42
          speaker: narrator
          text: "金把原先想好的装神弄鬼全忘了。女人见他窘迫，毫不客气地笑起来。"
        - id: ch01-b43
          speaker: shamlegh_woman
          text: "你当然用不着，只消眨眨眼就能施法。可你走了以后，也该替我们这些可怜人想想。昨晚那些人全喝醉了，根本不肯听女人的话。你没喝醉吧？"
        - id: ch01-b44
          speaker: kim
          text: "我是个祭司。"
        - id: ch01-b45
          speaker: narrator
          text: "金已经镇定下来。那女人并不难看，他觉得自己最好摆出身份。"
        - id: ch01-b46
          speaker: shamlegh_woman
          text: "我早警告过他们，少爷会发火，会盘问，还会写信向土王告状。跟少爷同行的还有那位先生。办文书的人，舌头最长。"
        - id: ch01-b47
          speaker: kim
          text: "你只担心这个？"
        - id: ch01-b48
          speaker: narrator
          text: "一个完整的计划马上在金心里成形，他笑得十分迷人。女人伸出结实的棕色手掌，上面戴满银托绿松石。"
        - id: ch01-b49
          speaker: shamlegh_woman
          text: "不只这个。"
        - id: ch01-b50
          speaker: kim
          text: "这件事我一口气就能办妥。那位先生是哈基姆。就是先前在齐格劳尔附近行医的那个人，你听说过吧？我认识他。"
        - id: ch01-b51
          speaker: shamlegh_woman
          text: "他会为了赏钱告发我们。少爷分不清这个山民和那个山民，可孟加拉人认得男人，也认得女人。"
        - id: ch01-b52
          speaker: kim
          text: "替我捎句话给他。"
        - id: ch01-b53
          speaker: shamlegh_woman
          text: "只要是为你，我什么都能做。"
        - id: ch01-b54
          speaker: narrator
          text: "女人主动求爱，男人便只能平静接受这份赞美。金撕下一页纸，用永不褪色的专利铅笔，写出潦草粗大的谢卡斯特体。坏男孩往墙上写脏话，用的正是这种字。"
        - id: ch01-b55
          speaker: kim
          text: "他们写过的一切都在我手里，有本地地图，还有许多信，特别是穆拉斯拉。告诉我下一步怎么办。我在雪线下面的沙姆莱，老人病了。把这张纸交给哈基姆。他看见便会闭紧嘴巴。他走不远。"
        - id: ch01-b56
          speaker: shamlegh_woman
          text: "确实不远。那些人还在山嘴另一面的树林里。天一亮，我们的孩子便去盯着他们，一路把消息传回来。"
        - id: ch01-b57
          speaker: narrator
          text: "金满脸惊讶。牧场边缘随即传来一声尖利颤音，像风筝的鸣叫。一个放牛孩子从兄弟姐妹那里接到了信号。守在山坡另一面的人，可以俯瞰奇尼谷。"
        - id: ch01-b58
          speaker: shamlegh_woman
          text: "我的丈夫们也在那里捡柴。"
        - id: ch01-b59
          speaker: narrator
          text: "她从怀里抓出一把核桃，利落地劈开一个吃起来。金装作什么也不知道。"
        - id: ch01-b60
          speaker: shamlegh_woman
          text: "祭司，你难道不懂核桃的意思？"
        - id: ch01-b61
          speaker: narrator
          text: "她含情脉脉地递来两片核桃壳。"
        - id: ch01-b62
          speaker: kim
          text: "这个主意好。纸片夹进壳里。你有蜡吗？替我把信封上。"
        - id: ch01-b63
          speaker: narrator
          text: "女人高声叹气，金听得心软了。"
        - id: ch01-b64
          speaker: kim
          text: "事情办成以前，没有报酬。把它交给那位先生，就说是护符之子送来的。"
        - id: ch01-b65
          speaker: shamlegh_woman
          text: "哎呀，果然是个魔法师，跟少爷一样会施法！"
          emotion: surprised
        - id: ch01-b66
          speaker: kim
          text: "不是魔法师，是护符之子。记得问他有没有回信。"
        - id: ch01-b67
          speaker: shamlegh_woman
          text: "可他要是说了无礼的话呢？我会害怕。"
          emotion: fearful
        - id: ch01-b68
          speaker: narrator
          text: "金笑了。"
        - id: ch01-b69
          speaker: kim
          text: "我敢说，他又累又饿。群山从不是温暖的床伴。嗨，我的姐姐，你聪明又有趣。现在所有村子都知道少爷们出了什么事，对吗？"
        - id: ch01-b70
          speaker: narrator
          text: "金险些叫她母亲，及时改了口。"
        - id: ch01-b71
          speaker: shamlegh_woman
          text: "对。半夜以前，齐格劳尔已经知道了。明天消息就会传到科特加尔。每个村子都又害怕，又生气。"
        - id: ch01-b72
          speaker: kim
          text: "不用怕。告诉大家给少爷们食物，让他们平安通过。要悄悄把他们送出山谷。偷东西是一回事，杀人是另一回事。哈基姆懂得这个道理，往后便没人来告状。快去吧。师父醒了，我还得照顾他。"
        - id: ch01-b73
          speaker: shamlegh_woman
          text: "那就这么办。你刚才说，办成以后有报酬。我是沙姆莱女人，这片地方是土王给我的。整个沙姆莱都归你，蹄子、角、皮，还有牛奶和黄油。要不要，随你。"
        - id: ch01-b74
          speaker: narrator
          text: "她坚决地转身上山，宽阔胸前的银项链一路叮当，向一千五百英尺高处的晨光走去。金留下来，用蜡封紧油布包的边缘。"
        - id: ch01-b75
          speaker: kim
          text: "一个男人又要走大道，又要参加大游戏，女人为什么偏要没完没了地缠着他？阿克罗拉渡口有一个，鸽舍后面有厨娘的妻子，别处还有。如今又来一个！小时候倒还好，现在我已经是男人，她们反而不把我当男人。核桃！哈，哈！平原上用的明明是杏仁！"
        - id: ch01-b76
          speaker: narrator
          text: "金出门向村里征收供奉。平原上还能托钵乞食，在这里却得摆出王子的气派。沙姆莱夏天只有三户人家，四个女人和八九个男人。他们吃了很多罐头肉，又把从加氨奎宁到白伏特加的各种饮料混着喝，这时个个肚子饱胀。昨夜的赃物人人有份。整齐的欧式帐篷早被割碎分掉，村里到处是新式铝锅。"
        - id: ch01-b77
          speaker: narrator
          text: "山民认定只要喇嘛在这里，便能挡住一切后果。他们毫不后悔，把最好的食物送给金，甚至给了他一杯拉达克传来的青稞酒。大家在太阳下暖身，坐到无底深渊边，两腿悬空，聊天、发笑、抽烟。他们只从来打猎的少爷那里认识印度和印度政府，也记得朋友替少爷做猎手的旧事。哪位少爷二十年前一枪打偏了北山羊、喜马拉雅鬣羚或捻角山羊，他们至今还能讲清每个细节。"
        - id: ch01-b78
          speaker: narrator
          text: "山民谈自己的小病，也谈那些矮小稳健的牛得了什么病。他们讲起远行科特加尔的见闻，那里住着古怪的传教士。有人甚至到过西姆拉，听说街道由白银铺成，谁都能去给少爷当差。少爷们坐两轮车出门，花钱像拿铲子往外扬。过了一阵，喇嘛迈着沉重步子，庄严而疏离地走到屋檐下。众人给他让出很大一块地方。稀薄空气使他振作起来。他也坐在悬崖边，谈话一停，便向虚空扔几颗小石子。"
        - id: ch01-b79
          speaker: narrator
          text: "三十英里外横着另一道山脉。山坡沟壑间的矮小灌木，其实每一片都是要走整整一天的黑暗森林。村后，沙姆莱山挡住南方全部景色。坐在这里，就像坐进世界屋檐下的燕窝。喇嘛不时伸手，在山民提醒下，指出通往斯皮提，再向北越过帕隆拉山口的道路。"
        - id: ch01-b80
          speaker: lama
          text: "群山最密的那边就是德钦，也就是汉莱。那里有座大寺院，是达丹热钦修建的。关于他，还有一个故事。"
        - id: ch01-b81
          speaker: narrator
          text: "喇嘛讲起一个满是妖术和奇迹的故事，山民听得惊叹不已。随后，他转向西边，顺着库卢的绿山寻找冰川下的凯隆。"
        - id: ch01-b82
          speaker: lama
          text: "很久以前，我就是从那里来的。我从列城出发，翻过巴拉拉查山口。"
        - id: ch01-b83
          speakers: [shamlegh_man, shamlegh_man_2, shamlegh_man_3]
          ensemble: chorus
          text: "对，对，我们知道那个地方。"
        - id: ch01-b84
          speaker: lama
          text: "我在凯隆的僧人那里住过两夜。这些是我深爱的群山，是一切影子中最蒙福的影子。我的眼睛在那里第一次睁开，看见世界，也在那里再次睁开，看透世界。我在那里得到觉悟，也在那里束紧衣带，踏上寻觅之路。我从群山中来，从高山和强风中来。啊，生命之轮公正无误！"
        - id: ch01-b85
          speaker: narrator
          text: "喇嘛一一祝福巨大的冰川、裸露的岩石、层层冰碛和翻滚的页岩。他也祝福干燥高地、隐秘盐湖、苍老林木，还有水流灌溉、果实丰盛的山谷，就像临终的人逐个祝福亲族。金从没见过师父这样激动，心里十分惊奇。"
        - id: ch01-b86
          speakers: [shamlegh_man, shamlegh_man_2, shamlegh_man_3]
          ensemble: chorus
          text: "对，没什么地方比得上我们的群山。"
        - id: ch01-b87
          speaker: narrator
          text: "接着，山民纳闷起世上为何有人住在炎热可怕的平原。他们听说那里的牛大得像象，不能在山坡上犁地。村庄一个挨着一个，能绵延百英里。人们成群偷盗，强盗剩下的东西，还会被警察扫荡干净。上午就这样安静过去。将近中午，金派出的信使从陡坡上轻快下来，呼吸和出发时一样平稳。"
        - id: ch01-b88
          speaker: kim
          text: "我托她给哈基姆捎了话。"
        - id: ch01-b89
          speaker: lama
          text: "他去投奔那些偶像崇拜者了？不，我记得他医治了其中一个。那人虽用恢复的力气作恶，哈基姆仍积了功德。生命之轮公正无误！哈基姆现在怎样？"
        - id: ch01-b90
          speaker: kim
          text: "我担心你受伤，而且我知道他有智慧。"
        - id: ch01-b91
          speaker: narrator
          text: "金接过蜡封的核桃壳。自己写的字条背面，胡里用英文回了信。他感谢金的好意，说眼下不能离开同伴，但会把他们带到西姆拉，随后设法会合。他劝金沿原路返回，自己会追上来，还说凭借远见拿到那些书信，叫他十分满意。"
        - id: ch01-b92
          speaker: kim
          text: "他说自己会从那些人身边脱身，再回来找我们。圣人，我们要不要在沙姆莱多等一阵？"
        - id: ch01-b93
          speaker: narrator
          text: "喇嘛眷恋地望了群山很久，最后摇头。"
        - id: ch01-b94
          speaker: lama
          text: "不行，徒儿。我的每根骨头都想留下，可我不能留下。我已经看见万物的起因。"
        - id: ch01-b95
          speaker: kim
          text: "为什么？群山一天比一天让你强健。别忘了，在下面的杜恩谷，我们又虚弱又头晕。"
        - id: ch01-b96
          speaker: lama
          text: "我的确强健了，却拿力气作恶，也忘了自己的寻觅。我在山坡上变成了一个打架的莽汉。生命之轮公正而完美，分毫不偏。我还是个男子时，很久以前，曾到白杨林里的楚宛上师那里朝圣。圣马就养在那里。"
        - id: ch01-b97
          speakers: [shamlegh_man, shamlegh_man_2, shamlegh_man_3]
          ensemble: chorus
          text: "安静，都别出声！他说的是嘉林宁阔，那匹一天就能绕世界一周的马。"
        - id: ch01-b98
          speaker: lama
          text: "我只是在跟徒儿说话。"
        - id: ch01-b99
          speaker: narrator
          text: "喇嘛温和地责备一句，众人便像南檐上的晨霜一样散开。"
        - id: ch01-b100
          speaker: lama
          text: "那时候，我不求真理，只爱争论教义。那全是幻象。我喝了楚宛上师的酒，也吃了他的面包。第二天，有人提议去谷里同桑戈古托打架，看哪位住持该管那座山谷，收取桑戈古托印经的收益。你看，欲望就是这样同愤怒绑在一起。我跟着他们去了，整整打了一天。"
        - id: ch01-b101
          speaker: kim
          text: "圣人，你们怎么打？"
        - id: ch01-b102
          speaker: lama
          text: "我们用长笔盒打。我原本可以拿给你看。两边的住持和僧人都到了，大家就在白杨树下动手。有人劈开我的额头，伤口深得见骨。你看，这里还有一道银白的疤。生命之轮公正而完美！昨天这道疤忽然发痒。隔了五十年，我想起它是怎么来的，也想起了打我的那张脸。我的心在幻象里停了一瞬，接着便有了你亲眼看见的争斗和愚蠢。"
        - id: ch01-b103
          speaker: lama
          text: "生命之轮公正无误。那个偶像崇拜者的一拳，正打在旧疤上。我的灵魂受了震动，暗了下去。灵魂之舟也在幻象之水上摇荡。直到来到沙姆莱，我才能静看万物的起因，追寻恶怎样像草根一样蔓延。我为此努力了整整一夜。"
        - id: ch01-b104
          speaker: kim
          text: "可你根本没做过恶啊，圣人。愿我替你作牺牲！"
        - id: ch01-b105
          speaker: narrator
          text: "金真心为老人的悲痛难过，马哈布·阿里的口头禅便自己溜出了嘴。喇嘛拨动念珠，在一句句慢话之间，珠子咔嗒作响。"
        - id: ch01-b106
          speaker: lama
          text: "天亮时，我终于明白了。就在这里，我明白自己已经老了。我生在山里，吃山里的食物长大，却注定不能坐在自己的群山中。我在印度走了三年，可土地的力量，难道能胜过大地母亲吗？在下面时，这具愚蠢的身体总想念群山，想念山上的雪。我说自己的寻觅一定会成功，这句话并没有错。"
        - id: ch01-b107
          speaker: lama
          text: "到了库卢女人家，我转身朝群山走，被自己的想法说服得太深。哈基姆没有错。他追随欲望，说群山会让我强健。群山确实让我强健，却让我拿力气作恶，忘了寻觅。我为生命欢喜，也贪恋活着的欲望。我想要陡坡，便到处找陡坡。我拿肉身的力量同高山较量，那也是恶。在亚穆纳河源下面，你喘不过气时，我还嘲笑你。你怕山口的积雪，我也取笑过你。"
        - id: ch01-b108
          speaker: kim
          text: "这有什么错？我的确害怕，你说得很公道。而且你恢复了力气，我心里很爱你。"
        - id: ch01-b109
          speaker: lama
          text: "我不止一次，只因双腿有力，便想得到你和哈基姆的夸奖。恶就这样跟着恶，直到杯子装满。生命之轮公正无误。三年来，整个印度都尊敬我。从奇迹屋的智慧之泉，到大炮旁玩耍的小孩子，世上的一切都替我铺平道路。你说，这是为什么？"
          emotion: sad
        - id: ch01-b110
          speaker: kim
          text: "因为我们爱你。只是那一拳让你发烧了。我自己到现在也难受，还在浑身发颤。"
        - id: ch01-b111
          speaker: lama
          text: "不是这样。那是因为我走在大道上，像一面调准音律的铙钹，正合佛法的目的。我离开准则，音律便断了，惩罚也随之而来。就在我自己的群山里，在故乡的边缘，在邪恶欲望发生的地方，一拳落到了我的额头。初学僧人摆错杯子会挨打。我曾是圣泽寺的住持，如今也挨了打。没有一句话，徒儿，只有一拳。"
        - id: ch01-b112
          speaker: kim
          text: "可那些少爷根本不认识你，圣人。"
        - id: ch01-b113
          speaker: lama
          text: "我们正好相配。无知和欲望在路上遇见了无知和欲望，于是生出愤怒。那一拳给了我信号。我同一头走失的牦牛没有分别，我的位置不在这里。能读懂一个行为的起因，已经走到自由的半途。那一拳对我说，回到大道上去。群山不属于你。你不能既选择自由，又被生命的欢乐绑住。"
        - id: ch01-b114
          speaker: kim
          text: "真希望我们从没碰见那个该诅咒的俄国人！"
        - id: ch01-b115
          speaker: lama
          text: "即使世尊亲来，也不能让生命之轮倒转。我凭着已经积下的功德，又得到一个信号。你看，我冥想以后仔细看过这幅生命之轮。那个偶像崇拜者把它撕坏了，完好的地方只剩一片指甲那么宽。"
        - id: ch01-b116
          speaker: kim
          text: "我看见了。"
        - id: ch01-b117
          speaker: lama
          text: "这就是我用这具身体留在世上的余数。我终身侍奉生命之轮，如今它也来侍奉我。若不是我引你走上大道，积了功德，我还要多活一世，才能找到我的河。徒儿，你明白了吗？"
        - id: ch01-b118
          speaker: narrator
          text: "金盯着那幅被粗暴毁坏的图。裂口从左向右斜穿过去，从欲望生出婴孩的第十一宫，越过人界和畜生界，直达代表空无感官的第五宫。金找不出话来反驳。喇嘛恭敬地收起图。"
        - id: ch01-b119
          speaker: lama
          text: "世尊得到觉悟以前，也受过诱惑。我也受了诱惑，可现在一切都结束了。箭落在平原，不在群山。我们还留在这里做什么？"
        - id: ch01-b120
          speaker: kim
          text: "至少等一等哈基姆吧？"
        - id: ch01-b121
          speaker: lama
          text: "我知道这具肉身还能活多久。哈基姆又能做什么？"
        - id: ch01-b122
          speaker: kim
          text: "可你病了，又受了惊。你根本走不动。"
        - id: ch01-b123
          speaker: lama
          text: "既然已经看见自由，我怎么会生病？"
        - id: ch01-b124
          speaker: narrator
          text: "喇嘛摇摇晃晃地站起来。"
        - id: ch01-b125
          speaker: kim
          text: "那我得去村里拿些食物。唉，这条路真叫人疲惫！"
        - id: ch01-b126
          speaker: narrator
          text: "金觉得自己也需要休息。"
        - id: ch01-b127
          speaker: lama
          text: "这很合理。吃过东西，我们便走。箭落在平原。我曾向欲望屈服。准备吧，徒儿。"
        - id: ch01-b128
          speaker: narrator
          text: "金转向那个戴绿松石头饰的女人。她一直懒洋洋地往悬崖下扔石子，这时亲切地笑了。"
        - id: ch01-b129
          speaker: shamlegh_woman
          text: "我找到那个孟加拉人时，他像一头闯进玉米地的迷路水牛，又喷鼻，又打嚏，整个人都冻坏了。他饿得连体面也忘了，还对我说甜话。那些少爷已经什么都没有了。你的事情办得怎样？"
        - id: ch01-b130
          speaker: narrator
          text: "女人摊开空空的手掌。金眼睛一亮，向她点头。"
        - id: ch01-b131
          speaker: shamlegh_woman
          text: "我先告诉了那个孟加拉人，又通知附近村子。少爷们要什么吃的，大家都会给，也不会收钱。赃物早就分光了。那位先生正忙着给少爷们编谎话。他为什么还不离开？"
        - id: ch01-b132
          speaker: kim
          text: "因为他心胸宽大。"
        - id: ch01-b133
          speaker: shamlegh_woman
          text: "孟加拉人的心，没有一颗比干核桃更大。不过算了。现在该谈核桃了。事情办完，就该给报酬。我说过，这个村子归你。"
        - id: ch01-b134
          speaker: kim
          text: "这可叫我吃亏了。直到刚才，我心里还安排了许多美好的事，只是我的师父受幻象引领，决定离开这里，回平原去。"
        - id: ch01-b135
          speaker: narrator
          text: "金说足了这种场合该有的客套话，又深深叹了一口气。"
        - id: ch01-b136
          speaker: shamlegh_woman
          text: "哼！老眼睛除了装满食物的钵，还能看见什么？叫他留下。"
        - id: ch01-b137
          speaker: narrator
          text: "金摇摇头。"
        - id: ch01-b138
          speaker: kim
          text: "我了解我的圣人。谁要拦他，他发起怒来可不得了。他的诅咒能摇动群山。"
        - id: ch01-b139
          speaker: shamlegh_woman
          text: "可惜他的诅咒保不住自己的脑袋！我听说你才有虎胆，动手打了少爷。让他再做一阵梦吧。你留下来。"
        - id: ch01-b140
          speaker: kim
          text: "山里的女人，这些事对你太高深了。"
        - id: ch01-b141
          speaker: narrator
          text: "金努力摆出严峻的神情，可他年轻柔和的脸怎么也硬不起来。"
        - id: ch01-b142
          speaker: shamlegh_woman
          text: "诸神保佑我们！男人和女人，从古到今不就是男人和女人吗？"
        - id: ch01-b143
          speaker: kim
          text: "祭司就是祭司。他说这个钟头便要动身。我是他的徒弟，自然得跟他走。我们需要路上的食物。别的村子都把他当贵客，不过这里的饭很好。给我装一些吧。"
        - id: ch01-b144
          speaker: narrator
          text: "说到最后，金忽然露出纯粹的孩子气笑容。"
        - id: ch01-b145
          speaker: shamlegh_woman
          text: "我要是不给呢？我可是这个村子的女人。"
        - id: ch01-b146
          speaker: kim
          text: "那我便诅咒你。只诅咒一点，不会太重，却足够让你记住。"
        - id: ch01-b147
          speaker: narrator
          text: "金说着，自己先忍不住笑了。"
        - id: ch01-b148
          speaker: shamlegh_woman
          text: "你把睫毛一垂，下巴一扬，早就诅咒过我了。几句空话，我怕什么？可我不想让你带着怒气走，在心里轻看我。我只是沙姆莱一个捡牛粪、割草的女人，可也有自己的家产。"
        - id: ch01-b149
          speaker: narrator
          text: "她两手按在胸口，紧紧攥住衣裳。"
        - id: ch01-b150
          speaker: kim
          text: "我什么也没想。只是我实在太累，不想离开，我们又需要食物。袋子在这里。"
        - id: ch01-b151
          speaker: narrator
          text: "女人生气地夺过袋子。"
        - id: ch01-b152
          speaker: shamlegh_woman
          text: "是我傻。平原上你的女人是谁？她皮肤白，还是黑？我从前也是白的。你笑什么？很久以前，你若肯信，也有一位少爷喜欢过我。那时我在科特加尔的传教所穿欧洲衣服。我是个克里斯蒂安，会像少爷一样说英语。我的少爷说，他会回来娶我。对，他说要娶我。生病时，还是我照料他。可他走了，再也没有回来。"
        - id: ch01-b153
          speaker: shamlegh_woman
          text: "于是我明白，克里斯蒂安人的神都在说谎。我回到自己人中间，从此再没见过少爷。别笑我，小祭司，方才那阵疯劲已经过去了。你的脸、你走路的样子，还有你说话的方式，都让我想起我的少爷。可你不过是个四处游荡、等着我施舍的乞丐。你还想诅咒我？你既不能诅咒，也不能赐福！"
          emotion: sad
        - id: ch01-b154
          speaker: narrator
          text: "她双手叉腰，苦涩地笑了。"
        - id: ch01-b155
          speaker: shamlegh_woman
          text: "你的神是假的，你的行为是假的，你的话也是假的。整个天空下面，根本没有神。我知道。可有那么一小会儿，我以为自己的少爷回来了。他就是我的神。从前，我还在科特加尔传教所弹过皮安诺。现在，我却在给希森祭司施舍。"
          emotion: sad
        - id: ch01-b156
          speaker: narrator
          text: "最后两个词，她特意用了英语。接着，她把装得满满的袋口扎紧。"
        - id: ch01-b157
          speaker: lama
          text: "徒儿，我在等你。"
        - id: ch01-b158
          speaker: narrator
          text: "喇嘛倚在门柱上。女人从头到脚扫了那道高瘦身影一眼。"
        - id: ch01-b159
          speaker: shamlegh_woman
          text: "他还想走路？半英里也撑不住。这把老骨头要去哪里？"
        - id: ch01-b160
          speaker: narrator
          text: "喇嘛突然垮下去，已经叫金困惑。如今再想起沉重的食物袋，他终于彻底发了脾气。"
        - id: ch01-b161
          speaker: kim
          text: "不祥的女人，他去哪里跟你有什么关系？"
          emotion: angry
        - id: ch01-b162
          speaker: shamlegh_woman
          text: "跟我没关系，可跟你有关系，长着少爷脸的祭司。难道你要把他扛在肩上？"
        - id: ch01-b163
          speaker: lama
          text: "我要回平原，谁也不能拦住我。我同自己的灵魂搏斗，力气已经用完了。这具愚蠢的肉身也耗尽了，可平原还很远。"
        - id: ch01-b164
          speaker: shamlegh_woman
          text: "你看吧！"
        - id: ch01-b165
          speaker: narrator
          text: "她退到一边，让金看清自己有多么束手无策。"
        - id: ch01-b166
          speaker: shamlegh_woman
          text: "诅咒我呀，说不定能给他添点力气。做道护符！叫你的大神来帮忙。你不是祭司吗？"
        - id: ch01-b167
          speaker: narrator
          text: "她转过身去。喇嘛已经软软蹲下，一只手仍抓着门柱。老人受过重击，不可能像孩子那样睡一夜便恢复。虚弱把他往地面压，望着金的双眼却仍清醒，满是哀求。"
        - id: ch01-b168
          speaker: kim
          text: "没事，只是高处的空气太稀薄，让你没了力气。歇一会儿我们就能走。这是高山病，我的胃也有一点不舒服。"
          emotion: calm
        - id: ch01-b169
          speaker: narrator
          text: "金跪下来，用最先想到的几句笨拙话安慰老人。女人很快回来了，腰背挺得比刚才更直。"
        - id: ch01-b170
          speaker: shamlegh_woman
          text: "你的神不管用，是不是？那就试试我的。我是沙姆莱女人！"
        - id: ch01-b171
          speaker: narrator
          text: "她粗声一喊，两个丈夫和另外三个男人从牛栏里抬出一乘本地轿子。那东西十分粗陋，山里人既用它抬病人，也用它隆重出行。"
        - id: ch01-b172
          speaker: shamlegh_woman
          text: "这几头牲口都归你使唤，爱用多久就用多久。"
        - id: ch01-b173
          speaker: shamlegh_man
          text: "可我们不去西姆拉！我们也不靠近少爷！"
        - id: ch01-b174
          speaker: shamlegh_woman
          text: "他们不会像别人一样逃跑，也不会偷行李。我知道其中两个是软骨头。索努、塔里，你们站到后面的轿杠去。现在把轿子放低，请圣人坐进去。你们回来以前，村子由我照看，你们贤惠的妻子也由我照看。"
        - id: ch01-b175
          speaker: shamlegh_man
          text: "我们什么时候回来？"
        - id: ch01-b176
          speaker: shamlegh_woman
          text: "去问祭司，别拿这些事烦我。食物袋放在圣人脚边，还能多压一点分量。"
        - id: ch01-b177
          speaker: narrator
          text: "两个被点到的男人立刻听命。喇嘛踉跄着坐进轿子，金终于松了一口气。"
        - id: ch01-b178
          speaker: kim
          text: "啊，圣人，你的群山比我们的平原仁慈！这是国王才配睡的床，又尊贵，又舒服。我们全靠一位好心人。"
        - id: ch01-b179
          speaker: shamlegh_woman
          text: "一位不祥的女人。你的祝福和诅咒，我都需要。这是我的命令，与你无关。抬起来，走！喂，你身上有路费吗？"
        - id: ch01-b180
          speaker: narrator
          text: "她招手把金叫进茅屋，弯腰从床下拿出一只破旧的英国钱匣。"
        - id: ch01-b181
          speaker: kim
          text: "我什么也不要。我身上已经粗暴地压满了别人的恩惠。"
        - id: ch01-b182
          speaker: narrator
          text: "金本该感激，语气里却带着火。女人抬起头，露出一个古怪的微笑，把手放到他肩上。"
        - id: ch01-b183
          speaker: shamlegh_woman
          text: "至少该谢我一句。我脸丑，又是个山里女人，可照你们的说法，我也积了功德。要不要我教你，少爷会怎样道谢？"
        - id: ch01-b184
          speaker: narrator
          text: "她坚硬的眼睛柔和下来。"
        - id: ch01-b185
          speaker: kim
          text: "我只是个云游祭司。你既不需要我的祝福，也不需要我的诅咒。"
        - id: ch01-b186
          speaker: shamlegh_woman
          text: "不需要。不过，只要一小会儿。你走十步就能追上轿子。假如你是个少爷，要不要我教你怎么做？"
        - id: ch01-b187
          speaker: kim
          text: "说不定我自己猜得到呢？"
        - id: ch01-b188
          speaker: narrator
          text: "金伸手搂住她的腰，在她脸颊上亲了一口，又用英语道谢。"
        - id: ch01-b189
          speaker: kim
          text: "真是泽常谢谢你，亲爱的。"
        - id: ch01-b190
          speaker: narrator
          text: "亚洲人几乎从不亲吻。也许正因为如此，女人猛地往后一仰。她双眼滚圆，满脸惊慌。"
        - id: ch01-b191
          speaker: kim
          text: "下一回，可别再泽么小看你的希森祭司。现在我要告别了。"
        - id: ch01-b192
          speaker: narrator
          text: "金照英国人的方式伸出手。女人木然同他握了握。"
        - id: ch01-b193
          speaker: kim
          text: "再见，亲爱的。"
        - id: ch01-b194
          speaker: shamlegh_woman
          text: "再见。还有，你会再回来吗？再见，愿上帝保佑你。"
        - id: ch01-b195
          speaker: narrator
          text: "半个钟头以后，轿子吱嘎作响，沿着沙姆莱向东南伸去的山路颠簸上行。金回头时，看见茅屋门边有个小小身影，正在挥动一块白布。"
        - id: ch01-b196
          speaker: lama
          text: "她积下的功德胜过所有人。帮助一个人走上自由之路，便有自己找到一半自由的功德。"
        - id: ch01-b197
          speaker: kim
          text: "唔，也许我也积了功德。至少，她没再把我当孩子。"
        - id: ch01-b198
          speaker: narrator
          text: "金若有所思地回味刚才的事。他提了提长袍前襟，文件和地图就藏在里面。接着，他把珍贵的食物袋重新放好，搁在喇嘛脚边。他一手扶着轿沿，低下头，跟上几位丈夫喘息着迈出的缓慢脚步。"
        - id: ch01-b199
          speaker: narrator
          text: "走出三英里后，喇嘛开了口。"
        - id: ch01-b200
          speaker: lama
          text: "他们也在积功德。"
        - id: ch01-b201
          speaker: kim
          text: "不只功德，他们还会拿到银钱。"
        - id: ch01-b202
          speaker: narrator
          text: "钱是沙姆莱女人给金的。按金的道理，让她的男人们把这些钱挣回去，才算公平。"
