audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts: {delivery: "从容而机敏的讲述", timbre: "温暖清晰", pace: "舒展而有变化", pitch: "中音"}
    kim:
      display_name: 金
      tts: {delivery: "机灵大胆，话里常带笑", timbre: "明亮的少年声", pace: "轻快敏捷", pitch: "中高音"}
    lurgan:
      display_name: 勒根先生
      tts: {delivery: "沉静莫测，温和中带着审视", timbre: "柔和低沉", pace: "从容缓慢", pitch: "中低音"}
    hindu_boy:
      display_name: 印度教孩子
      tts: {delivery: "敏感好胜，情绪来得又快又烈", timbre: "纤细清亮的童声", pace: "轻快", pitch: "高音"}
    hurree:
      display_name: 胡里·钱德尔·穆克吉
      tts: {delivery: "一本正经而滔滔不绝，英语腔调夸张", timbre: "厚重圆润", pace: "稍快", pitch: "中音"}
    lama:
      display_name: 喇嘛
      tts: {delivery: "慈悲安详，讲述时庄重悠远", timbre: "苍老柔和", pace: "舒缓", pitch: "中低音"}
    rissaldar:
      display_name: 骑兵队长
      tts: {delivery: "爽直豪迈，带着老军人的笃定", timbre: "浑厚苍劲", pace: "从容", pitch: "低音"}
    mahbub:
      display_name: 马哈布·阿里
      tts: {delivery: "老练深沉，幽默里藏着试探", timbre: "粗厚低沉", pace: "从容", pitch: "低音"}
  chapters:
    - id: ch01
      title: 勒根先生的店
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: "俄勒冈有一则古老传说。鸦族酋长、智慧的耶尔思有个儿子，名叫斯多克斯。熊伊茨伍特把他留在身边，要教他做巫医。斯多克斯学得一天比一天快，胆子也一天比一天大，竟跳起可怕的克卢—夸利之舞，逗那头熊发笑。"
        - id: ch01-b02
          speaker: narrator
          text: "命运之轮转到了下一程，金立刻全心扑了上去。他决定暂时再做一回少爷。走到西姆拉市政厅下方的大路，他正想找个人摆摆少爷的威风，便看见路灯下蹲着一个十来岁的印度教孩子。"
        - id: ch01-b03
          speaker: kim
          text: "勒根先生住在哪里？"
        - id: ch01-b04
          speaker: hindu_boy
          text: "我听不懂英语。"
        - id: ch01-b05
          speaker: narrator
          text: "金只好改说当地话。孩子答应带路，两个人一同走进神秘的暮色。山坡下传来满城声响，杰科山上的雪松仿佛托着星群，清风从树梢吹来。高低错落的屋灯像另一片星空，有些一动不动，有些随着黄包车而去，送那些爽直自在的英国人出门赴宴。"
        - id: ch01-b06
          speaker: hindu_boy
          text: "到了，就是这里。"
        - id: ch01-b07
          speaker: narrator
          text: "孩子停在大路边的一处凉廊。门口没有门，只有一道芦珠帘，把里头的灯光切成碎片。"
        - id: ch01-b08
          speaker: hindu_boy
          text: "他来了。"
        - id: ch01-b09
          speaker: narrator
          text: "话音轻得像一声叹息，孩子随即消失。金猜到他早就奉命等在路上，却还是大着胆子掀开珠帘。桌边坐着一个黑胡子男人，眼睛罩着绿色眼罩。一双白净的短手飞快拈起珍珠，穿上闪亮的丝线。灯圈外堆满了奇物，气味像汇聚了整个东方的寺庙。麝香、檀香和甜腻的茉莉油，一阵阵钻进金的鼻子。"
        - id: ch01-b10
          speaker: kim
          text: "我来了。"
        - id: ch01-b11
          speaker: narrator
          text: "那些气味叫他忘了原本要做少爷，不由自主说起当地话。男人一面穿珠，一面数到八十一，手指快得让人看不清。他摘下眼罩，盯着金看了足足半分钟。瞳孔忽大忽小，竟像能随意操纵。塔克萨利门边也有个苦行僧会这一手，还能像山羊一样抖耳朵。眼前的人不会抖耳朵，金反倒有点失望。"
        - id: ch01-b12
          speaker: lurgan
          text: "别害怕。"
        - id: ch01-b13
          speaker: kim
          text: "我有什么可怕的？"
        - id: ch01-b14
          speaker: lurgan
          text: "今晚你睡在这里。等到该回勒克瑙时再离开我。这是命令。"
        - id: ch01-b15
          speaker: kim
          text: "既然是命令，我就听从。可我睡哪儿？"
        - id: ch01-b16
          speaker: lurgan
          text: "就睡这间屋，睡在我身后的黑暗里。"
        - id: ch01-b17
          speaker: kim
          text: "那就这样吧。现在就睡吗？"
        - id: ch01-b18
          speaker: narrator
          text: "勒根先生点点头，把灯举过头顶。光一晃，墙上猛然跳出许多西藏魔舞面具，有的长角，有的怒目，有的露出痴呆的恐怖。角落里，披甲戴翎的日本武士举戟威吓，四周的长矛、阔剑和短刀闪着摇晃的光。可金在拉合尔博物馆见过魔舞面具，更吸引他的，是珠宝桌底下那个印度教孩子。那孩子盘腿坐着，柔软的眼睛看着他，红嘴唇上带着一点笑。"
        - id: ch01-b19
          speaker: narrator
          text: "金心想，勒根先生和桌下那个魔崽子，分明都在等着看他害怕。"
        - id: ch01-b20
          speaker: kim
          text: "这里像奇迹之屋。我的床呢？"
        - id: ch01-b21
          speaker: narrator
          text: "勒根先生指向角落里一床本地棉被，提灯走了，屋里顿时漆黑。金躺下后问刚才的人是不是勒根先生，没有回答。他循着另一个孩子的呼吸爬过去，朝黑暗里挥了一拳。"
        - id: ch01-b22
          speaker: kim
          text: "回答我，魔鬼！你就这样欺骗一位少爷吗？"
        - id: ch01-b23
          speaker: narrator
          text: "黑暗中仿佛有谁窃笑。挨打的孩子正在哭，那笑声不可能是他发出的。金便提高嗓门。"
        - id: ch01-b24
          speaker: kim
          text: "勒根先生！不准你的仆人跟我讲话，也是命令吗？"
        - id: ch01-b25
          speaker: lurgan
          text: "也是命令。"
        - id: ch01-b26
          speaker: narrator
          text: "声音忽然从背后响起，金吓了一跳。他摸回棉被，低声警告那个孩子，明早一定会揍他，因为自己不喜欢印度教徒。"
        - id: ch01-b27
          speaker: narrator
          text: "这一夜一点也不安静，屋里仿佛塞满人声和音乐。有人两次喊金的名字。第二次，他摸黑起身寻找，鼻子狠狠撞上一只箱子，痛得他立刻发火。那箱子明明用人的舌头讲话，口音却不像任何人。金用手摸索，发现它的末端似乎连着锡喇叭，又有电线接到地板上一只小箱子。又硬又颤的声音从喇叭里钻出来。他一边揉鼻子，一边像平时那样用印地语在心里骂起来。"
        - id: ch01-b28
          speaker: kim
          text: "拿这东西吓集市上的乞丐还差不多。我可是少爷，是少爷的儿子，更是勒克瑙圣泽维尔学校的学生。该死的勒根先生！这机器跟缝纫机一样，勒克瑙的人才不会给这种把戏吓住。可他为什么这样做？他只是个商人，我却在他的店里。克赖顿先生是上校，准是上校下过命令，才让他这样试我。等天亮了，我非好好揍那个印度教徒不可。"
        - id: ch01-b29
          speaker: narrator
          text: "喇叭箱忽然吐出一长串恶毒咒骂，连金都没听过这么厉害的脏话。他后颈的短毛一下竖起。可声音停下来换气时，缝纫机似的轻响又使他镇定下来。"
        - id: ch01-b30
          speaker: kim
          text: "住嘴！再不住嘴，我就砸烂你的脑袋。"
        - id: ch01-b31
          speaker: narrator
          text: "箱子根本不听。金一把扯住锡喇叭，只听咔嗒一声，像是掀开了盖子。里头若真有魔鬼，这时正该现身。他闻到缝纫机的气味，越发确信自己能收拾这个恶魔，便脱下外衣，叠了三层塞进箱口。手下一个又长又圆的东西被压弯，机器嗡地一响，声音断了。原来那是一架昂贵的留声机。衣服卡住蜡筒，又塞进机件，任何声音都非停不可。金这才心平气和地睡到天亮。"
        - id: ch01-b32
          speaker: narrator
          text: "早晨醒来，勒根先生正低头看着他。金决心牢牢守住少爷的身份。"
        - id: ch01-b33
          speaker: kim
          text: "夜里有只箱子骂我，我已经叫它住嘴了。那是你的箱子吗？"
        - id: ch01-b34
          speaker: lurgan
          text: "握个手吧，奥哈拉。是我的箱子。王公朋友们喜欢这种玩具，所以我留着它。现在虽然坏了，可坏得很值得。那些国王爱玩具，有时我也爱。"
        - id: ch01-b35
          speaker: narrator
          text: "金从眼角斜着打量他。他穿着英国少爷的衣服，从这一点看像个少爷。可乌尔都语的口音、英语的腔调都明明白白告诉金，他绝不是英国少爷。更奇妙的是，金还没开口，他就像已经看清这个孩子心里转着什么。维克托神父和勒克瑙的老师总要费力解释自己的做法，勒根先生却从不这样。最叫金舒服的，是在属于亚洲人的那一面，勒根先生把他当成平辈。"
        - id: ch01-b36
          speaker: lurgan
          text: "今天早晨，你恐怕揍不成我的孩子了。他说要用刀或者毒药杀你。他嫉妒你，我便罚他站墙角，今天一句话也不跟他说。他刚刚还想杀我。你得帮我预备早饭，因为他眼下嫉妒得太厉害，不能信任。"
        - id: ch01-b37
          speaker: narrator
          text: "正牌英国人听见这番话，一定会大惊小怪。勒根先生却说得平平常常，像马哈布谈起自己在北方办过的那些小事。"
    - id: ch02
      title: 摔碎的水壶
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: "店铺后廊悬在陡峭山坡外，照西姆拉的习惯，站在那里可以俯视邻家的烟囱。勒根先生亲手做了纯正的波斯早饭，可金更着迷于满屋奇物。拉合尔博物馆更大，这里的怪东西却更多。有西藏降魔匕首和转经轮，有绿松石、琥珀和碧玉首饰，还有插在镶满石榴石原矿的罐子里、包得古里古怪的线香。墙上挂着魔鬼面具和孔雀蓝帷幔，下面摆着镀金佛像与便携漆神龛。俄国茶炊的盖子镶着绿松石，薄胎瓷器收在八角藤盒里，日本竟还送来了发黄的象牙十字架。恶臭的旧地毯塞在腐朽屏风后，旁边有饭后净手的波斯水壶、雕着一圈恶鬼的暗铜香炉、打结像生皮的失色银腰带、各色发簪和兵器。上千件杂物塞满屋子，只有一张摇晃的白松桌周围还留着空地。"
        - id: ch02-b02
          speaker: lurgan
          text: "那些都不算什么。我买下它们，只因看着漂亮。有时遇见顺眼的买主，我也会卖。真正的活儿，有一些在桌上。"
        - id: ch02-b03
          speaker: narrator
          text: "晨光照在桌上，红光、蓝光、绿光一片灿烂，偶尔又迸出钻石凶厉的蓝白冷芒。金不由得睁圆眼睛。"
        - id: ch02-b04
          speaker: lurgan
          text: "这些石头还算健康，晒太阳伤不了它们，而且也便宜。生病的宝石可完全不同。除了我，没人能医好病珍珠，也没人能让绿松石重新变蓝。蛋白石谁都会治，病珍珠却只有我能救。要是我死了，可就没有人了。至于你，你摆弄不了珠宝。将来能稍稍懂一点绿松石，就很不错。"
        - id: ch02-b05
          speaker: narrator
          text: "说着，他走到凉廊另一头，要给沉重的陶壶添水。"
        - id: ch02-b06
          speaker: lurgan
          text: "想喝水吗？"
        - id: ch02-b07
          speaker: narrator
          text: "金点了点头。勒根先生站在整整十五英尺外，把一只手放到刚刚灌满的水壶上。下一瞬，那只沉重的陶壶竟已经稳稳出现在金的肘边。里面的水满得离壶口只差半英寸，却没有泼洒出来。白桌布上只留下很小的一道褶皱，说明水壶刚才曾沿着那里滑过，可金完全没看清它是怎样来到身边的。"
        - id: ch02-b08
          speaker: kim
          text: "哇！这是真魔法。"
        - id: ch02-b09
          speaker: narrator
          text: "勒根先生笑了，这句赞叹显然正中他的心意。"
        - id: ch02-b10
          speaker: lurgan
          text: "把壶扔回来。"
        - id: ch02-b11
          speaker: kim
          text: "扔过去会摔碎。"
        - id: ch02-b12
          speaker: lurgan
          text: "我叫你扔。"
        - id: ch02-b13
          speaker: narrator
          text: "金随手一掷，水壶没能落到对面，摔成了五十块。水从粗糙的廊板缝间滴下去。"
        - id: ch02-b14
          speaker: kim
          text: "我早说过，它会碎。"
        - id: ch02-b15
          speaker: lurgan
          text: "不要紧。盯着最大的一块，好好看。"
        - id: ch02-b16
          speaker: narrator
          text: "最大那块碎片的凹面闪着水光，像一颗星落在地板上。金定睛看去。勒根先生把手轻轻放在他后颈，抚摸了两三下，声音压成耳语，叫他一刻也别移开目光。"
        - id: ch02-b17
          speaker: lurgan
          text: "看着。它会一片一片重新活过来。先是最大这块，跟左边、右边的两块接到一起。别移开眼睛。"
        - id: ch02-b18
          speaker: narrator
          text: "就算拿性命相逼，金也转不开头。那只轻柔的手像铁钳一样制住他，血液里泛起舒服的麻痒。方才明明分开的三片碎陶，如今仿佛已经合成一大块。它们上方渐渐浮出整只水壶朦胧的轮廓。起初还能透过那层影子看见凉廊，可轮廓随着金每一次脉搏跳动，一点点变厚、变暗。金的思绪越来越迟缓，几乎抓不住自己的念头。可是水壶明明在他的眼前摔碎了。勒根先生的手轻轻一动，又一股带刺的热流顺着金的脖子窜下去。"
        - id: ch02-b19
          speaker: lurgan
          text: "看，它正在恢复原样。"
        - id: ch02-b20
          speaker: narrator
          text: "金原本一直用印地语思考。身体忽然发颤时，他察觉自己的心智正在被一片黑暗吞没。它像一个在海里遭到鲨鱼追赶的游泳者，拼尽力气把半个身子跃出水面，从黑暗里猛然挣起，最后一头躲进了学校里用英语背诵的乘法表。"
        - id: ch02-b21
          speaker: lurgan
          text: "看，它马上就要完整了。"
        - id: ch02-b22
          speaker: narrator
          text: "水壶已经摔碎。金死死抓住英语里的这个词，不许自己改用本地话去想。它摔成了五十块，绝不可能自己恢复。二三得六，三三得九，四三十二。他拼命一遍又一遍背下去。水壶的影子像揉过眼睛以后散开的雾，终于逐渐消失。碎片依旧散在地上，泼出的水仍在阳光下慢慢晒干。透过凉廊的板缝，还能看见下面那堵白房墙上一道道凸出的筋骨。三乘十二，三十六！"
        - id: ch02-b23
          speaker: lurgan
          text: "怎么样？它是不是正在合起来？"
        - id: ch02-b24
          speaker: kim
          text: "它明明摔碎了，真的碎了！你看，碎片还跟刚才一样躺在那里。"
        - id: ch02-b25
          speaker: narrator
          text: "勒根先生已经低声念叨了半分钟。金猛地挣开头，一边喘气一边揉脖子。勒根先生紧盯着他，擦了擦宽阔的额头。"
        - id: ch02-b26
          speaker: lurgan
          text: "不错，碎片还在那里。这么多人里，你是头一个从始至终看清它的人。"
        - id: ch02-b27
          speaker: kim
          text: "刚才那也是魔法吗？"
        - id: ch02-b28
          speaker: narrator
          text: "血管里的麻痒已经退去，金觉得自己清醒得异乎寻常。"
        - id: ch02-b29
          speaker: lurgan
          text: "不是魔法，只是在试一块宝石有没有瑕疵。有些极好的宝石，落进懂得手法的人掌中便会突然裂开。所以镶嵌以前必须小心。告诉我，你看见那只壶的形状了吗？"
        - id: ch02-b30
          speaker: kim
          text: "看见了一小会儿。它像一朵花，从地上慢慢长出来。"
        - id: ch02-b31
          speaker: lurgan
          text: "后来你做了什么？我是问，你怎么想的？"
        - id: ch02-b32
          speaker: kim
          text: "我知道它已经碎了，心里便只想着，它的确碎了。"
        - id: ch02-b33
          speaker: lurgan
          text: "以前有人对你施过这种魔法吗？"
        - id: ch02-b34
          speaker: kim
          text: "如果有过，你以为我还会让人再来一次？我早逃走了。"
        - id: ch02-b35
          speaker: lurgan
          text: "那么，你现在不怕了？"
        - id: ch02-b36
          speaker: kim
          text: "现在不怕。"
        - id: ch02-b37
          speaker: lurgan
          text: "以后我得问问马哈布·阿里。我对你满意，可又不完全满意。你是第一个靠自己挣脱的人。我真想知道，究竟是什么救了你。不过你不说是对的，这件事连我也不该知道。"
        - id: ch02-b38
          speaker: narrator
          text: "勒根先生比先前任何时候都看得仔细。说完以后，他走进店铺幽暗深处，在桌边坐下，轻轻搓着手。一堆地毯后传来微弱沙哑的抽泣。那个印度教孩子一直听话地面朝墙站着，哭得瘦削的肩膀一下一下发抖。"
        - id: ch02-b39
          speaker: lurgan
          text: "唉，他嫉妒得不得了。不知道他会不会又在早饭里下毒，害我再做一遍。"
        - id: ch02-b40
          speaker: hindu_boy
          text: "再也不会了，我再也不做了。"
        - id: ch02-b41
          speaker: lurgan
          text: "那他会不会杀掉这个新来的孩子呢？"
        - id: ch02-b42
          speaker: hindu_boy
          text: "不会，永远不会！"
        - id: ch02-b43
          speaker: lurgan
          text: "金，你看他会怎么做？"
        - id: ch02-b44
          speaker: kim
          text: "我怎么知道？也许放他走吧。不过，他为什么要毒你？"
        - id: ch02-b45
          speaker: lurgan
          text: "因为他太喜欢我。假如你很喜欢一个人，后来又来了一个孩子，而你喜欢的人见到那个孩子比见到你还高兴，你会怎么办？"
        - id: ch02-b46
          speaker: narrator
          text: "金认真想了想。勒根先生又用当地话慢慢说了一遍。"
        - id: ch02-b47
          speaker: kim
          text: "我不会毒那个大人。要是另一个孩子也喜欢他，我会揍那个孩子。不过动手以前，我得先问清楚是不是真的。"
        - id: ch02-b48
          speaker: lurgan
          text: "听见没有？少爷的儿子说你是个小傻瓜。出来吧。下次心里难受，别那么明目张胆地用白砒霜。那天准是魔鬼达西姆管着我们的桌布。这毒可能害我生病，到时只好让陌生人看守珠宝了。"
        - id: ch02-b49
          speaker: narrator
          text: "孩子哭肿了眼，从地毯后爬出来，扑倒在勒根先生脚边。那副激烈悔恨的样子，连金也吃了一惊。"
        - id: ch02-b50
          speaker: hindu_boy
          text: "我会看守墨池，也会忠心守住珠宝！我的父亲，我的母亲，请把他赶走吧！"
        - id: ch02-b51
          speaker: narrator
          text: "他说着，用赤裸的脚后跟朝金一撇。"
        - id: ch02-b52
          speaker: lurgan
          text: "现在还不能赶他。过些时候，他自然会走。眼下他进了新经院，你来做他的老师。跟他玩珠宝游戏，我替你们记分。"
    - id: ch03
      title: 珠宝游戏
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: "孩子立刻擦干眼泪，跑进店铺后面，端来一只铜盘。"
        - id: ch03-b02
          speaker: hindu_boy
          text: "东西让你亲手拿出来。要不然，他输了会说我早就见过。"
        - id: ch03-b03
          speaker: narrator
          text: "勒根先生叫他别急，从桌下抽屉抓出半把叮当作响的小东西，撒进盘里。孩子挥着一张旧报纸，骄傲地转过身去。"
        - id: ch03-b04
          speaker: hindu_boy
          text: "陌生人，随你看多久。你可以数，也可以拿起来摸。我只要看一眼就够了。"
        - id: ch03-b05
          speaker: kim
          text: "这到底怎么玩？"
        - id: ch03-b06
          speaker: hindu_boy
          text: "等你确信全都记住，我就拿报纸盖住盘子。你把数目报给勒根先生，我把我的答案写下来。"
        - id: ch03-b07
          speaker: narrator
          text: "金的好胜心立刻醒了。盘里不过十五颗石头，他看了一分钟，便说太容易。孩子把报纸盖上闪光的宝石，飞快在本地账簿里写起来。"
        - id: ch03-b08
          speaker: kim
          text: "下面有五颗蓝石头，一颗大，一颗小些，三颗很小。绿的有四颗，其中一颗打了孔。还有一颗透明的黄石头，一颗像烟斗柄。红石头有两颗。我明明数到十五，可还有两颗忘了。等一等，其中一颗是褐色的小象牙。另一颗……再给我一点时间。"
        - id: ch03-b09
          speaker: narrator
          text: "勒根先生从一数到十。金还是想不起来，只好摇头。那个孩子笑声清脆，抢着报出自己的答案。"
        - id: ch03-b10
          speaker: hindu_boy
          text: "先是两颗有瑕疵的蓝宝石，一颗约两拉蒂，一颗约四拉蒂。四拉蒂那颗边缘缺了一块。有一颗带黑纹的土耳其斯坦绿松石，另有两颗刻字的。一颗用金字刻着真主之名，另一颗从旧戒指上拆下，横着裂开，字已经读不清。这就是五颗蓝石。还有四颗有瑕疵的祖母绿，其中一颗钻了两个孔，另一颗略微雕过。"
        - id: ch03-b11
          speaker: lurgan
          text: "四颗祖母绿分别多重？"
        - id: ch03-b12
          speaker: hindu_boy
          text: "我估计是三、五、五、四拉蒂。然后是一块发绿的老烟嘴琥珀，一颗欧洲切面的黄玉，一颗没有瑕疵、重两拉蒂的缅甸红宝石，还有一颗同样重两拉蒂、带瑕疵的浅红尖晶石。再有一件中国象牙雕，是老鼠吮鸡蛋。最后一件，是一颗蚕豆大小的水晶球，托在金叶上。"
        - id: ch03-b13
          speaker: narrator
          text: "孩子说完，高兴地拍起手。"
        - id: ch03-b14
          speaker: lurgan
          text: "他比你强，是你的老师。"
        - id: ch03-b15
          speaker: kim
          text: "他只是知道宝石的名字。再试一次，换成我们都认识的普通东西！"
        - id: ch03-b16
          speaker: narrator
          text: "他们从店里甚至厨房里找来杂物，一次次重新堆满托盘。可无论放什么，都是那个孩子获胜。"
        - id: ch03-b17
          speaker: hindu_boy
          text: "你们尽管蒙住我的眼，让我只用手摸一遍。就算你睁着眼，我也能把你远远甩下。"
        - id: ch03-b18
          speaker: narrator
          text: "他果然做到了，金气得直跺脚。"
        - id: ch03-b19
          speaker: kim
          text: "要是换成人或者马，我一定做得更好。镊子、刀子、剪子这些东西，全都小得没意思。"
        - id: ch03-b20
          speaker: lurgan
          text: "先学会，再想着教别人。现在承认他是你的老师了吗？"
        - id: ch03-b21
          speaker: kim
          text: "承认。可他究竟是怎么办到的？"
        - id: ch03-b22
          speaker: lurgan
          text: "一遍一遍练，直到做得十全十美。因为这件事值得做好。"
        - id: ch03-b23
          speaker: narrator
          text: "印度教孩子得意极了，竟伸手拍了拍金的背。"
        - id: ch03-b24
          speaker: hindu_boy
          text: "别灰心，我会亲自教你。"
        - id: ch03-b25
          speaker: lurgan
          text: "我会保证你学得扎实。除了我这个孩子，我很久没见过像你这样值得教的人了。他为了毒我，竟自己买那么多白砒霜，实在太傻。如果开口问，我本可以给他。你再过十天才回勒克瑙，那个地方花费很高，却什么也不教。我看我们会成为朋友。"
        - id: ch03-b26
          speaker: narrator
          text: "接下来的十天疯狂透顶，金却玩得太高兴，根本不去想其中的古怪。每天早晨，他们都要玩珠宝游戏，一遍遍训练眼睛、手指和记忆。有时盘里放真正的宝石，有时改成一大堆刀剑匕首，有时又摆出许多本地人的照片。到了下午，金和印度教孩子便替勒根先生守店。他们一声不出地藏在地毯捆或屏风后面，不但观察那些稀奇访客买卖什么，还要留心每个人的脸、声音和一举一动。"
        - id: ch03-b27
          speaker: narrator
          text: "来客里有买留声机和机械玩具的小王公，他们的随从留在凉廊上咳嗽等候。有寻找项链的太太，也有金觉得专来寻找那些太太的男人。独立邦和封邦的人带着断项链，说是来修补。项链铺到桌上，便像一道道宝石的光河。可这些人的真正目的，多半是替发怒的王后或年轻王公筹钱。有些巴布受到勒根先生严厉而威严的盘问，每次谈完，他却会交给他们银币和钞票。偶尔，还有一群穿长袍、像在演戏的本地人聚在一起，用英语和孟加拉语谈论玄学。勒根先生听得兴致勃勃，因为他对一切宗教都有兴趣。"
        - id: ch03-b28
          speaker: narrator
          text: "一天结束后，两个孩子必须把所见所闻详细复述出来。哪个人先到，哪个人后走，说过什么话，脸上是什么神情，一样也不能漏。他们还要从每个访客的相貌、谈吐和举止判断性情，再猜出对方藏在表面买卖后面的真正来意。晚饭后，则轮到乔装游戏。勒根先生对这门本领格外精通，画脸更是惊人。只要用画笔在这里点一下，在那里勾一道，眼前的人便会变得连熟人也认不出来。"
        - id: ch03-b29
          speaker: narrator
          text: "店里各种衣裳和头巾一应俱全。金先后扮过体面穆斯林人家的少年和卖油匠。最快乐的一晚，他穿戴上从头到脚最齐全的礼服，成了奥德地主的儿子。勒根先生有一双鹰眼，再小的破绽也逃不过。他躺在磨旧的柚木榻上，一讲就是半个钟头，教金某个种姓怎样说话、怎样走路，又怎样咳嗽、吐痰和打喷嚏。他说，世上的事情只知道怎样发生并不顶用，所以不仅要讲他们怎样做，还要讲清他们为什么会这样做。"
        - id: ch03-b30
          speaker: narrator
          text: "印度教孩子不擅长这种游戏。他数珠宝时，脑子锋利得像冰锥，却没法走进另一个人的心里。金换上不同衣服时，连言语和动作也一起改变，心里仿佛有个小魔鬼醒来，快活地唱起歌。"
        - id: ch03-b31
          speaker: narrator
          text: "一天晚上，金演得兴起，主动示范拉合尔某一派苦行僧的弟子怎样在路边乞讨。那些苦行僧都是他的旧相识。他不但演出讨布施时的动作，还分别示范遇见英国人该用什么话，遇见赶集的旁遮普农夫该怎么开口，碰到不戴面纱的女人又该换成哪种口气。勒根先生笑个不停，求他保持原样，在后屋盘腿坐上半个钟头。金全身涂着灰，瞪着狂野的眼睛，真的一动也不动。"
        - id: ch03-b32
          speaker: narrator
          text: "时间一到，一个庞大肥胖的巴布走进门来。他套着长袜的两条腿肥肉乱颤。金立刻使出路边乞丐的口吻，劈头盖脸戏弄他。可勒根先生只盯着巴布，不看金的表演，叫金十分恼火。"
        - id: ch03-b33
          speaker: hurree
          text: "鄙人认为，这是极端非同寻常而且富有效率的表演。如果你没有事先告诉我，我一定以为你在拉我的腿。他还要多久，才能大致成为富有效率的测链员？到了那个时候，我便要正式征用他。"
        - id: ch03-b34
          speaker: lurgan
          text: "那正是他得在勒克瑙学会的本领。"
        - id: ch03-b35
          speaker: hurree
          text: "那就命令他快得见鬼吧。晚安，勒根。"
        - id: ch03-b36
          speaker: narrator
          text: "巴布迈着陷在泥里的母牛般的步子，摇摇摆摆走了。晚上复述访客名单时，勒根先生问金，他猜那个男人是什么身份。"
        - id: ch03-b37
          speaker: kim
          text: "那只有真主知道。"
        - id: ch03-b38
          speaker: narrator
          text: "金说得轻松快活，仿佛自己真的毫无猜测，也从没有认真想过。那腔调几乎骗得过老练的马哈布·阿里，却一点也骗不过眼前这位专门医治病珍珠的人。"
        - id: ch03-b39
          speaker: lurgan
          text: "不错，真主知道。不过我问的是，你自己怎么想？"
        - id: ch03-b40
          speaker: narrator
          text: "金斜眼看看他。勒根先生的目光逼着人说真话。"
        - id: ch03-b41
          speaker: kim
          text: "我想，等我从学校出来，他会用得着我。可我不明白，这样一个人怎么能换很多种衣服，还会说很多种语言。"
    - id: ch04
      title: 有字母和数字的人
      blocks:
        - id: ch04-b01
          speaker: lurgan
          text: "以后你会明白许多事。他替某位上校写故事。他的尊贵只在西姆拉管用，而且他没有名字，只有一个字母和一个数字。我们这里就是这样的规矩。"
        - id: ch04-b02
          speaker: kim
          text: "那么，他的脑袋也有赏格吗？像马哈布，还有其他人一样？"
        - id: ch04-b03
          speaker: lurgan
          text: "现在还没有。不过，假如坐在这里的某个孩子起身出门，走到下集市旧戏院后面那所有红凉廊的房子，隔着百叶窗低声说，胡里·钱德尔·穆克吉带来了上个月的坏消息，他也许能带走满满一腰带卢比。"
        - id: ch04-b04
          speaker: kim
          text: "一共有多少卢比？"
        - id: ch04-b05
          speaker: lurgan
          text: "五百，一千，或是他开口要的任何数目。"
        - id: ch04-b06
          speaker: kim
          text: "很好。说出消息以后，这孩子还能活多久？"
        - id: ch04-b07
          speaker: lurgan
          text: "那得仔细想想。要是他非常机灵，也许活得到当天结束。但他绝对活不过那一夜。"
        - id: ch04-b08
          speaker: kim
          text: "既然巴布的脑袋值这么多，他每月能领多少薪水？"
        - id: ch04-b09
          speaker: lurgan
          text: "八十，也许一百，也许一百五十卢比。不过薪水是最不重要的。真主偶尔会叫一种人生到世上，你也是其中一个。他们愿意冒着生命危险四处奔走，探听消息。今天查遥远地方的事，明天寻找一座隐秘的山，后天又盯上附近那些冒犯政府的蠢人。这样的灵魂很少，最出色的不过十个。我把那个巴布算在十人之中，这实在稀奇。一份事业能让孟加拉人的心也大胆起来，可见它多么伟大，多么诱人。"
        - id: ch04-b10
          speaker: kim
          text: "这话没错。可日子在我身上走得太慢。我还是个孩子，两个月前才会写英语，现在连读都读不好。要过许多年，漫长的许多年，我才做得成测链员。"
        - id: ch04-b11
          speaker: lurgan
          text: "耐心些，世界之友。你嫌岁月太多，我倒希望能从你那里拿走几年。我已经用几样小事试过你。等我向上校禀报时，不会忘记这些。"
        - id: ch04-b12
          speaker: narrator
          text: "他忽然换成英语，低沉地笑起来。"
        - id: ch04-b13
          speaker: lurgan
          text: "天哪，奥哈拉！你这个孩子很有些东西。不过你不能骄傲，也不能多嘴。回勒克瑙去，做个听话的小孩子，好好念书。也许下次放假，只要你愿意，还能回到我这里。我的意思是，只要你喜欢。我知道你真正想去哪里。"
        - id: ch04-b14
          speaker: narrator
          text: "金的脸沉了下来，因为勒根先生知道，他真正盼望的是回到喇嘛身边。四天后，有人为他和那只小箱子在卡尔卡双轮驿车的后排订好座位。同行的正是那个鲸鱼般肥大的巴布。巴布用带穗披肩严严实实包住头，把套着镂花长袜的肥左腿盘在身下，在清晨寒气里不停哆嗦、哼哼。"
        - id: ch04-b15
          speaker: narrator
          text: "驿车颠下山路，金望着那果冻般摇晃的后背，怎么也想不通这种人为何会是自己一伙的。这个疑问没有让他不安，反倒把他带进了愉快的白日梦。勒根先生临行前给了他五卢比，那是一笔很可观的钱。他还答应，只要金肯用功，就会给他庇护。马哈布从来不会明说奖赏，勒根先生却把服从之后能得到什么讲得清清楚楚，因此金十分满足。"
        - id: ch04-b16
          speaker: narrator
          text: "金梦想自己也有一个字母和一个数字，还能让脑袋标上赏格。总有一天，他会拥有这一切，而且还要得到更多。到那时，他也许会变得几乎和马哈布·阿里一样了不起。他要把半个印度的屋顶当作搜寻之地，追踪国王和大臣，就像从前为了马哈布，在拉合尔全城跟踪诉讼代理人和律师掮客。眼下，圣泽维尔学校正在前方等他，这件事倒也不算讨厌。会有新来的孩子让他摆摆架子，也能听同学讲各自的假日历险。曼尼普尔茶园主的儿子小马丁夸口说，他要亲自扛着步枪去打猎头族。"
        - id: ch04-b17
          speaker: narrator
          text: "也许小马丁真会去，可他肯定没让爆炸的焰火从帕蒂亚拉宫殿前院这头掀到那头。他也没有金经历过的其他事情。金在心中从头讲起过去三个月的奇遇，越想越觉得精彩。要是允许他说出来，圣泽维尔学校的学生准会全都听呆，就连那些已经开始刮胡子的大孩子也不例外。可他当然不能说。勒根先生答应过，他的脑袋迟早会有赏格。若现在胡乱多嘴，不但那一天永远不会来，克赖顿上校还会抛弃他。接下来，他剩下的短短一生，便只能用来承受勒根先生和马哈布的怒火。"
        - id: ch04-b18
          speaker: narrator
          text: "为了一条鱼丢掉德里，那可太不值得。金拿这句谚语劝住自己，决定把真实的假日经历全忘掉。反正不能说真话时，他还能编造一些虚构的奇遇来取乐。余下的事，就是照勒根先生吩咐的那样认真学习。从沙漠里的苏库尔到棕榈树下的加勒，赶回圣泽维尔学校的所有孩子中，再没有谁比金博尔·奥哈拉更一心向善。他坐在胡里身后的座位上，一路颠向安巴拉。人种调查局某个部门的名册上，这位巴布的姓名写作R.17。"
        - id: ch04-b19
          speaker: narrator
          text: "要是金还需要人鞭策，胡里完全能胜任。他们在卡尔卡饱餐以后，巴布便一路滔滔不绝。金既然要上学，他这位加尔各答大学文学硕士就有责任解释教育的好处。认真学习拉丁文和华兹华斯的《远足》，考试时便能拿到分数。法语也至关重要，要学最好的法语，应当去离加尔各答只有几英里的昌德纳戈尔。还有《李尔王》和《尤利乌斯·恺撒》，两出戏都很受考试官欢迎。一个人只要像巴布本人那样认真研读，便能走得很远。《李尔王》的历史典故比《尤利乌斯·恺撒》少。书原价四安那，在鲍巴扎买旧书却只需两安那。这一大通话对金而言，简直像希腊文一样难懂。"
        - id: ch04-b20
          speaker: narrator
          text: "巴布接着说，比华兹华斯，甚至比伯克和黑尔这些大作家更重要的，是测量的艺术与科学。偏偏这些科目没有应试书可供临时死背。一个孩子若能通过考试，只要拿着罗盘和水准仪，再带上一双平直的眼睛，亲自走过一片土地，就能把那片土地的完整图景装进脑中带走。这样的图景可以卖成大把铸好的银币。可测链并不总能随身携带，所以必须准确知道自己一步有多长。这样，即使失去巴布所谓的外加辅助器具，也能一步步踩出距离。要数清成千上万步，最好用八十一颗或一百零八颗的念珠，因为它能整除，也能再分成许多倍数和约数。"
        - id: ch04-b21
          speaker: narrator
          text: "英语像炮弹一样从巴布嘴里滚出，金还是捉住了大意。这是一门能藏在脑袋里的新本领。大世界正在眼前展开，一个人知道得越多，自然越好。"
        - id: ch04-b22
          speaker: hurree
          text: "鄙人希望，将来能以公务身份与阁下结识。在此期间，请恕我这样表达，我把这只极有价值的槟榔盒送给你。仅仅四年前，它就花了我两卢比。"
        - id: ch04-b23
          speaker: narrator
          text: "那其实是只廉价的心形黄铜盒，分成三格，本来用来装槟榔、石灰和蒌叶，现在却塞满了装药片的小瓶。"
        - id: ch04-b24
          speaker: hurree
          text: "这是你扮演圣人的表现优异奖。年轻人总以为自己永远不会完蛋，所以不肯照料身体。办事办到一半生病，是巨大讨厌。我本人爱好药物，拿来医治穷人也方便。这些都是上好的公家药，有奎宁等等。我送给你留作纪念。现在再见，我在路边有紧急私人事务。"
        - id: ch04-b25
          speaker: narrator
          text: "到了安巴拉路上，巴布像猫一样无声溜下车，叫住一辆过路大车，叮叮当当地走了。金说不出话，只能把黄铜槟榔盒拿在手里翻来转去。"
        - id: ch04-b26
          speaker: narrator
          text: "孩子的求学记录，除了父母，很少有人关心。金偏偏又是孤儿。海外圣泽维尔学校的正式簿册记着，每个学期结束，金的成绩报告都会分别送给克赖顿上校和维克托神父，学费也按时从他们手中交来。同一本簿册还写明，金在数学和地图绘制上都很有天分。他凭这些成绩拿到一套两卷本《劳伦斯勋爵传》，书用树纹小牛皮装订，价值九卢比八安那。十四岁零十个月时，他还入选学校十一人队，对战阿利格尔穆斯林学院。勒克瑙大概又闹了一场天花，因为差不多就在那时，金重新接种过牛痘。"
        - id: ch04-b27
          speaker: narrator
          text: "旧点名册边缘的铅笔字写着，他几次因跟不适当的人交谈而受罚。有一次，他被判严厉处罚，罪名是整日旷课，与街头乞丐为伍。那天他翻过校门，沿贡蒂河岸陪喇嘛走了整整一天，恳求老人下次假期带他上路。一个月也好，短短一周也好。喇嘛却硬起心肠不肯答应，说时机还没成熟。两人一起吃糕饼时，老人告诉他，眼下的本分是学尽少爷们的智慧，到时自然会懂。友谊之手想必替他挡开了灾祸之鞭，因为六周后，金以极优异的成绩通过初等测量考试，年龄是十五岁零八个月。此后记录突然中止。他没有参加印度测量局下级职位的考试，名字旁边只写着，因获任用离校。"
    - id: ch05
      title: 命定的时刻
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: "那三年间，喇嘛几次回到贝拿勒斯的耆那教寺院。他比以前更瘦了。如果那张脸还有变黄的余地，似乎也更黄了一分，可他依旧温和，依旧不染尘埃。有时他从南方的杜蒂戈林以南回来。那里有神奇的火船驶向锡兰，岛上的僧侣通晓巴利文。有时他从湿润碧绿的西方回来，从环绕孟买的上千根棉纺厂烟囱之间回来。还有一次，他从北方来，却特意折返八百英里，只为去拉合尔的奇迹之屋，同守护神像的人谈上一整天。"
        - id: ch05-b02
          speaker: narrator
          text: "寺里的祭司一向善待老人。他大步走进凉爽的雕花大理石小室，先洗去满身旅尘，再做祈祷，随后便动身去勒克瑙。铁路的走法，他早已熟悉，知道怎样坐三等车厢来回。每次探望金回来，他的朋友探寻者都会向大祭司指出一件事。喇嘛有一阵不再哀悼失去圣河，也不再一幅接一幅描画生命之轮，反而总在谈一个神秘弟子的美好与智慧。寺院里没有任何人见过那位弟子。"
        - id: ch05-b03
          speaker: narrator
          text: "喇嘛说，自己已经在全印度追随过佛陀足迹。博物馆馆长手中，至今还保存着一份极精彩的游历与冥想记。此生余下的事只有一件，就是找到箭河。可梦中已有启示，这项探寻若想成功，探寻者身边必须有那位命定的唯一弟子。正是那名弟子会把事情引向圆满，而且他已经学得极大智慧，拥有白发神像守护者那样的见识。喇嘛说到这里，便拿出鼻烟葫芦。和善的耆那教祭司知道故事要开始了，赶紧停止交谈，安静倾听。"
        - id: ch05-b04
          speaker: lama
          text: "很久以前，提婆达多做贝拿勒斯国王的时候，众人且听这则《本生经》。国王的猎手捉住一头大象，囚禁了它一段时日。大象后来挣脱束缚，腿上却留着一只沉重铁环，日日给它带来痛苦。它满怀仇恨和狂怒，一心想把铁环除掉，于是在森林中来回奔走，请求所有兄弟大象帮忙。兄弟们一个接一个走上前，用各自强壮的长鼻拼命拉扯，却没有谁能扯断。最后，整个象群都说，这只铁环不是任何兽类的力量能够打破的。"
        - id: ch05-b05
          speaker: lama
          text: "附近一片灌木中，躺着一头刚出生一天的小象。它身上还带着出生时的湿气，母亲已经死了。戴环的大象忘了自己的痛苦。它说，如果自己不救这头吃奶的小象，小家伙就会死在象群脚下。于是它站在幼象上方，把四条腿撑成柱子，挡住不断躁动的象群。它又向一头有德行的母牛讨来乳汁，让幼象活下去。小象渐渐长大，戴环的大象始终做它的向导，也始终护它周全。"
        - id: ch05-b06
          speaker: lama
          text: "众人且听这则《本生经》。大象要过三十五年，气力才会完全长成。整整三十五个雨季，戴环的大象都在照顾年轻伙伴，引它走路，替它抵挡危险。与此同时，那副镣铐也一刻不停地咬进它的血肉。后来有一天，已经长大的年轻象终于看见半埋在肉中的铁环。它转身问年长的大象，腿上的东西究竟是什么。那头照料了它三十五年的大象回答，这正是我的痛苦。"
        - id: ch05-b07
          speaker: lama
          text: "年轻的大象伸出长鼻。一眨眼之间，那只所有成年大象都无力扯断的铁环，便给它弄得无影无踪。它对年长的大象说，命定的时刻已经来了。就这样，那头有德行的大象耐心等候，没有被自己的苦难夺走善心，始终行善。终于到了命定的时刻，解除它痛苦的，正是自己当年特意转身照料的那头幼象。众人且听这则《本生经》，因为年长的大象正是阿难，扯断铁环的小象不是别人，正是世尊本人。"
        - id: ch05-b08
          speaker: narrator
          text: "故事讲完，喇嘛慈祥地摇头，一边拨动咔嗒作响的念珠，一边指出那头小象毫无骄傲之罪。它拥有那样强的力量，却依然谦卑，正像一名弟子看见师父坐在学问之门外的尘土中，便一跃越过紧锁的大门，当着那座高傲自大的城市，把师父紧紧拥进怀里。等命定的时刻终于来到，师父与弟子将一同踏上寻找解脱的路。到了那一天，这样的师父和这样的弟子，会得到何等丰厚的回报。"
        - id: ch05-b09
          speaker: narrator
          text: "喇嘛便这样讲述着，也这样旅行着，像蝙蝠一样悄无声息地来往于印度各地。萨哈兰普尔后方的一片果园中，住着一个舌头尖刻的老妇人。她尊敬喇嘛，就像古时那位妇人尊敬先知，不过喇嘛住的房间可不在城墙上。他坐在前院一间鸽声咕咕的屋里，老妇人一进门便摘下毫无用处的面纱。她向老人絮叨库卢的精怪和恶魔，谈那些尚未出生的孙辈，还要说起当初在歇脚处跟她放肆顶嘴的那个小崽子。"
        - id: ch05-b10
          speaker: narrator
          text: "另一次，喇嘛独自离开安巴拉下方的大干道，走进那个曾有祭司企图给他下药的村庄。老人一路沉浸在思索中，完全没有戒心。黄昏时，护佑喇嘛的慈悲上天引他穿过庄稼地，恰好来到骑兵队长门前。这里差点生出一场严重误会。老兵见到喇嘛，立刻问他，星辰之友为什么仅仅六天前刚从同一条路走过。"
        - id: ch05-b11
          speaker: lama
          text: "这不可能。他已经回到自己人那里去了。"
        - id: ch05-b12
          speaker: rissaldar
          text: "五个夜晚以前，他就坐在那个角落，讲了一百个有趣的故事。不错，他跟我孙女说了一通胡话，天亮时忽然不见了。他长得飞快，可还是当初给我送来准确战讯的星辰之友。难道你们分开了？"
        - id: ch05-b13
          speaker: lama
          text: "是，也不是。我们并没有完全分开，只是共同上路的时机还没有成熟。他正在别处获取智慧，我们必须等待。"
        - id: ch05-b14
          speaker: rissaldar
          text: "那都一样。如果来的人不是那个孩子，他为什么一直说起你？"
        - id: ch05-b15
          speaker: lama
          text: "他都说了些什么？"
        - id: ch05-b16
          speaker: rissaldar
          text: "他说了十万句甜蜜的话，说你既是他的父亲，也是他的母亲。他不肯为女王效力，实在可惜。那孩子什么也不怕。"
        - id: ch05-b17
          speaker: narrator
          text: "这消息令喇嘛十分惊讶。那时他还不知道，金一直虔诚地遵守自己与马哈布·阿里订下的约定。那份约定后来又不得不由克赖顿上校批准。金按照约定，每逢学校放假便回到自己的人民中间，四处来去。上校曾经指出，放假时任由一个学生在印度各地流浪，实在太荒唐。马哈布却用马贩子的口气回答了他。"
        - id: ch05-b18
          speaker: mahbub
          text: "年轻的小马一旦上场，谁也拦不住。就算不许他自由来去，他也不会把禁令当回事。到时谁抓得住他？上校先生，一千年里也未必生得出一匹这样适合这场游戏的小马。而我们需要人手。"
