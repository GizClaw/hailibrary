  chapters:
    - id: ch01
      title: The House of Wonders
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: S'doaks was the son of wise Yelth, chief of the Raven clan. Itswoot the Bear took charge of him and trained him as a medicine man. Quick to learn and bold enough to dare, he danced the dreadful Kloo-Kwallie Dance just to tickle Itswoot the Bear.
        - id: ch01-b02
          speaker: narrator
          text: Kim threw himself gladly into the next turn of his life. For a while, he would be a Sahib again. On the broad road below Simla Town Hall, he found a Hindu child of about ten sitting beneath a lamp.
        - id: ch01-b03
          speaker: kim
          text: Where is Mr. Lurgan's house?
        - id: ch01-b04
          speaker: hindu_boy
          text: I do not understand English.
        - id: ch01-b05
          speaker: narrator
          text: Kim changed languages at once, and the boy offered to lead him. They walked through the mysterious dusk. The city murmured below the hillside, cool wind moved through the deodars on Jakko, and lights shone at every height like a second sky. Some stayed still. Others bobbed with rickshaws carrying English people out to dinner.
        - id: ch01-b06
          speaker: hindu_boy
          text: Here it is.
        - id: ch01-b07
          speaker: narrator
          text: The boy stopped on a veranda beside the road. There was no door, only a curtain of beaded reeds breaking the lamplight into pieces.
        - id: ch01-b08
          speaker: hindu_boy
          text: He has come.
        - id: ch01-b09
          speaker: narrator
          text: The words were hardly louder than a breath, and then the guide vanished. Kim suspected the boy had been waiting for him all along. Still, he put on a bold face and pushed through the curtain. A black-bearded man sat at a table with a green shade over his eyes. His short white hands lifted shining pearls from a tray and threaded them on silk while he hummed. Beyond the lamplight, the room smelled of musk, sandalwood, and heavy jasmine oil, as if every temple in the East had left something there.
        - id: ch01-b10
          speaker: kim
          text: I am here.
        - id: ch01-b11
          speaker: narrator
          text: The smells had made Kim forget his plan to act like a Sahib, so he spoke in the language of the bazaar. The man counted seventy-nine, eighty, eighty-one, moving so quickly that Kim could barely follow his fingers. Then he removed the shade and stared for half a minute. His pupils widened and shrank to pinpoints whenever he chose. Kim knew a fakir near the Taksali Gate who earned money with that trick while cursing foolish women. That fakir could twitch his ears like a goat as well, and Kim was disappointed that this man could not.
        - id: ch01-b12
          speaker: lurgan
          text: Do not be frightened.
        - id: ch01-b13
          speaker: kim
          text: Why should I be frightened?
        - id: ch01-b14
          speaker: lurgan
          text: You will sleep here tonight and stay with me until it is time to return to Lucknow. Those are your orders.
        - id: ch01-b15
          speaker: kim
          text: Orders are orders. But where do I sleep?
        - id: ch01-b16
          speaker: lurgan
          text: Here in this room.
        - id: ch01-b17
          speaker: kim
          text: Very well. Do I sleep now?
        - id: ch01-b18
          speaker: narrator
          text: Lurgan raised the lamp. Its light swept across Tibetan devil-dance masks, dreadful embroidered hangings, a mailed Japanese warrior with a halberd, and rows of lances and knives. Kim had seen masks in the Lahore Museum. What interested him was the soft-eyed guide sitting under the pearl table with a little smile. Kim decided that Lurgan wanted to frighten him and the boy wanted to watch it happen.
        - id: ch01-b19
          speaker: kim
          text: This is like a Wonder House. Where is my bed?
        - id: ch01-b20
          speaker: narrator
          text: Lurgan pointed to a quilt beside the masks, took the lamp, and left the room black. Kim curled down and asked whether that truly had been Lurgan Sahib. No one answered. He heard the other boy breathing, crawled toward the sound, and struck out into the darkness. His blow landed, and the child began to cry.
        - id: ch01-b21
          speaker: kim
          text: Answer me, little devil! Is that how you lie to a Sahib?
        - id: ch01-b22
          speaker: narrator
          text: A chuckle seemed to echo in the room. It could not have come from the boy, who was still weeping.
        - id: ch01-b23
          speaker: kim
          text: Lurgan Sahib! Is your servant forbidden to speak to me?
        - id: ch01-b24
          speaker: lurgan
          text: It is forbidden.
        - id: ch01-b25
          speaker: narrator
          text: The voice came from behind Kim and made him jump.
        - id: ch01-b26
          speaker: kim
          text: Very well. But you there, remember that I shall beat you in the morning. I do not love Hindus.
        - id: ch01-b27
          speaker: narrator
          text: It was not a cheerful night. The crowded room seemed full of voices and music. Twice Kim woke because someone called his name. The second time he searched in the dark and struck his nose against a box that spoke in a hard, whirring voice through a tin trumpet. Wires seemed to run from it to a smaller box on the floor.
        - id: ch01-b28
          speaker: kim
          text: This trick might frighten a bazaar beggar, but I am a Sahib, the son of a Sahib, and a student of Lucknow. Yes, a boy of St. Xavier's! Curse Mr. Lurgan's eyes. It is only machinery, something like a sewing machine. We are not frightened that way at Lucknow. Creighton Sahib must have ordered this. How I shall beat that Hindu boy! But what is this now?
        - id: ch01-b29
          speaker: narrator
          text: The box poured out the most elaborate insults Kim had ever heard. Its high, careless voice lifted the hairs on his neck for a moment. Then it paused, and the soft sewing-machine whir told him there was no devil in it.
        - id: ch01-b30
          speaker: kim
          text: Be quiet, or I will break your head!
        - id: ch01-b31
          speaker: narrator
          text: Another chuckle settled his mind. The box ignored him. Kim pulled at the trumpet and heard a lid click open. The oily smell was exactly like a bazaar sewing machine. He took off his jacket, folded it three times, and rammed it into the mouth of the box. Something long and round bent. The machine whirred, then fell silent. An expensive phonograph could not speak with a coat crushed against its wax cylinder and works. Kim went back to sleep in perfect peace.
        - id: ch01-b32
          speaker: narrator
          text: In the morning, he opened his eyes and found Lurgan looking down at him.
        - id: ch01-b33
          speaker: kim
          text: There was a box last night that spoke badly to me, so I stopped it. Was it yours?
        - id: ch01-b34
          speaker: narrator
          text: Lurgan held out his hand.
        - id: ch01-b35
          speaker: lurgan
          text: Shake hands, O'Hara. Yes, it was mine. Rajahs enjoy such things. The box is broken now, but what it taught me was worth the price. Kings are very fond of toys, and sometimes I am too.
    - id: ch02
      title: The Broken Jar
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: Kim studied Lurgan from the corners of his eyes. The man wore a Sahib's clothes, but his Urdu and English did not sound like a Sahib's. He seemed to know Kim's thoughts before Kim spoke, and he did not explain everything as the priests and schoolmasters did. Best of all, he treated Kim as an equal on the Asiatic side.
        - id: ch02-b02
          speaker: lurgan
          text: You cannot beat my boy this morning. He says he means to kill you with a knife or poison. He is jealous, so I put him in the corner and will not speak to him today. He has already tried to kill me. You must help with breakfast, because just now he is too jealous to trust.
        - id: ch02-b03
          speaker: narrator
          text: An Englishman newly come from home would have made a great commotion over such news. Lurgan told it as simply as Mahbub Ali told stories of his affairs in the North. They ate a Persian breakfast on the back veranda, high above their neighbors' chimneys. Yet Kim cared even more for the shop. It held Tibetan daggers and prayer wheels, amber and turquoise, jade bangles, incense jars crusted with garnets, devil masks and blue hangings, golden Buddhas, lacquer altars, Russian samovars, eggshell china, Japanese ivory crucifixes, dusty carpets, Persian water jugs, strange copper burners, silver belts, jeweled hairpins, weapons, and a thousand other wonders. Only the space around Lurgan's rough table remained clear.
        - id: ch02-b04
          speaker: lurgan
          text: Those things are nothing. I buy them because they are pretty, and sometimes I sell one if I like the buyer. My real work is here on the table.
        - id: ch02-b05
          speaker: narrator
          text: Jewels burned in the morning light, red, blue, and green, with the sharp white flash of a diamond among them.
        - id: ch02-b06
          speaker: lurgan
          text: These stones are healthy enough, and sunlight will not hurt them. Sick stones are another matter. No one but me can heal a sick pearl or make a turquoise blue again. Any fool can cure an opal. If I died, who would tend the pearls? No, you cannot work with jewels. It will be enough if someday you understand a little about turquoise.
        - id: ch02-b07
          speaker: narrator
          text: He went to refill a heavy clay water jar fifteen feet away.
        - id: ch02-b08
          speaker: lurgan
          text: Are you thirsty?
        - id: ch02-b09
          speaker: narrator
          text: Kim nodded. Lurgan touched the jar, and in the next instant it stood full beside Kim's elbow. Only a wrinkle in the white cloth showed where it had slid.
        - id: ch02-b10
          speaker: kim
          text: Wah! That is magic.
        - id: ch02-b11
          speaker: lurgan
          text: Throw it back to me.
        - id: ch02-b12
          speaker: kim
          text: It will break.
        - id: ch02-b13
          speaker: lurgan
          text: Throw it.
        - id: ch02-b14
          speaker: narrator
          text: Kim tossed it without aim. It fell short, shattered into fifty pieces, and spilled its water through the veranda boards.
        - id: ch02-b15
          speaker: kim
          text: I told you it would break.
        - id: ch02-b16
          speaker: lurgan
          text: Never mind. Look at the largest piece.
        - id: ch02-b17
          speaker: narrator
          text: Water sparkled in the curved shard. Lurgan put a hand on the back of Kim's neck and stroked it gently. He told Kim that the jar would live again, piece by piece. Kim could not turn his head. The touch held him fast while a pleasant tingling ran through his blood. Three fragments seemed to become one. Above them rose the faint shape of the whole jar, transparent at first, then darker with every beat of his pulse.
        - id: ch02-b18
          speaker: lurgan
          text: Look. It is taking shape again.
        - id: ch02-b19
          speaker: narrator
          text: A tremor seized Kim. His mind felt as though darkness were swallowing it. With the effort of a swimmer leaping from sharks, he escaped into the English multiplication table.
        - id: ch02-b20
          speaker: kim
          text: The jar was smashed. Smashed into fifty pieces. Twice three is six. Three times three is nine. Four times three is twelve.
        - id: ch02-b21
          speaker: narrator
          text: He held desperately to the words. The shadow jar cleared like mist from tired eyes. Broken pieces lay on the boards, water dried in the sun, and the white wall below showed through the cracks.
        - id: ch02-b22
          speaker: lurgan
          text: Look. Is it coming back?
        - id: ch02-b23
          speaker: kim
          text: No. It is smashed! Look, it is still there exactly as it fell.
        - id: ch02-b24
          speaker: narrator
          text: Kim tore his head away. Lurgan had been murmuring for half a minute. Now he wiped his broad forehead and watched Kim rub his neck.
        - id: ch02-b25
          speaker: lurgan
          text: Yes, it is still broken. But of all the people I have tried, you are the first to see it that way.
        - id: ch02-b26
          speaker: kim
          text: Was that another kind of magic?
        - id: ch02-b27
          speaker: lurgan
          text: No. I was testing a jewel for a flaw. Fine jewels sometimes fly apart when a man holds them in the proper way, so they must be tested before they are set. Did you see the pot whole?
        - id: ch02-b28
          speaker: kim
          text: For a little while. It grew out of the floor like a flower.
        - id: ch02-b29
          speaker: lurgan
          text: Then what did you do? How did you think?
        - id: ch02-b30
          speaker: kim
          text: I knew it had broken. I thought about that, and then it was broken again.
        - id: ch02-b31
          speaker: lurgan
          text: Has anyone ever worked that kind of magic on you before?
        - id: ch02-b32
          speaker: kim
          text: If anyone had, do you think I would allow it twice? I would run away.
        - id: ch02-b33
          speaker: lurgan
          text: And you are not afraid now?
        - id: ch02-b34
          speaker: kim
          text: Not now.
        - id: ch02-b35
          speaker: lurgan
          text: Someday I shall ask Mahbub Ali about you. I am pleased with you, and yet I am not. No one else has ever saved himself. I wish I knew what helped you, but you are right to keep it secret, even from me.
        - id: ch02-b36
          speaker: narrator
          text: A husky sob came from behind the carpets. Lurgan's boy was still facing the wall, his thin shoulders shaking.
        - id: ch02-b37
          speaker: lurgan
          text: He is terribly jealous. Perhaps he will poison my breakfast again and make me cook it twice. Perhaps he will kill you too.
        - id: ch02-b38
          speaker: hindu_boy
          text: Never. Never again!
          emotion: sad
        - id: ch02-b39
          speaker: lurgan
          text: Kim, what do you think he will do?
        - id: ch02-b40
          speaker: kim
          text: I do not know. Let him out. Why did he try to poison you?
        - id: ch02-b41
          speaker: lurgan
          text: Because he loves me. If you loved someone, and that person liked a new boy better than you, what would you do?
        - id: ch02-b42
          speaker: kim
          text: I would not poison the man. I might beat the boy if he loved my man too, but first I would ask whether it was true.
        - id: ch02-b43
          speaker: lurgan
          text: He believes everyone must love me.
        - id: ch02-b44
          speaker: kim
          text: Then he is a fool.
        - id: ch02-b45
          speaker: lurgan
          text: Do you hear? The Sahib's son calls you a little fool. Come out. Next time your heart hurts, do not buy white arsenic so openly. It might have made me ill, and then a stranger would have guarded the jewels.
        - id: ch02-b46
          speaker: narrator
          text: The child crept out with swollen eyes and threw himself at Lurgan's feet.
        - id: ch02-b47
          speaker: hindu_boy
          text: I will study the ink pools and guard the jewels faithfully! Oh, my father and my mother, send this boy away!
          emotion: sad
        - id: ch02-b48
          speaker: lurgan
          text: Not yet. He will leave later. For now, he is at a new school, and you shall teach him. Play the Jewel Game with him. I will keep score.
        - id: ch02-b49
          speaker: narrator
          text: The tears vanished at once. The boy fetched a copper tray and demanded that Lurgan choose the objects so Kim could not accuse him of knowing them beforehand. Lurgan scattered fifteen small jewels onto the tray.
        - id: ch02-b50
          speaker: hindu_boy
          text: Look as long as you like, stranger. Count them and touch them if you need to. One glance is enough for me.
        - id: ch02-b51
          speaker: kim
          text: What is the game?
        - id: ch02-b52
          speaker: hindu_boy
          text: When you are sure you remember everything, I cover the tray. Then you tell Lurgan Sahib what was there, and I write my own list.
        - id: ch02-b53
          speaker: narrator
          text: Competition woke in Kim. He studied the fifteen stones for a minute and called the task easy. Once the paper covered them, he hurried through five blue stones, four green ones, a transparent yellow stone, pipe-shaped amber, two red stones, and a brownish piece of ivory. Two details escaped him before Lurgan counted to ten.
        - id: ch02-b54
          speaker: hindu_boy
          text: Now hear my list! Two flawed sapphires, one of two ruttees and one of four, with a chip on the larger. One veined Turkestan turquoise and two inscribed turquoises, one bearing a Name of God in gold and one cracked from an old ring. Four flawed emeralds, one drilled twice and one carved.
        - id: ch02-b55
          speaker: lurgan
          text: And their weights?
        - id: ch02-b56
          speaker: hindu_boy
          text: Three, five, five, and four ruttees. Then old green pipe amber, a European topaz, a flawless two-ruttee Burma ruby, a flawed balas ruby of two ruttees, a Chinese ivory rat sucking an egg, and a bean-sized crystal ball set on gold leaf.
        - id: ch02-b57
          speaker: lurgan
          text: He is your master.
        - id: ch02-b58
          speaker: kim
          text: He knew the names. Try again with ordinary things that both of us know!
        - id: ch02-b59
          speaker: narrator
          text: They filled the tray from the shop and kitchen, but the child won every time. Blindfolded, he could touch the objects once and still defeat Kim.
        - id: ch02-b60
          speaker: kim
          text: If these were men or horses, I would do better. Tweezers and knives and scissors are too small for me.
        - id: ch02-b61
          speaker: lurgan
          text: Learn first and teach later. Is he your master?
        - id: ch02-b62
          speaker: kim
          text: Yes, he truly is. But how does he do it?
        - id: ch02-b63
          speaker: lurgan
          text: By repeating the game until he does it perfectly. Anything worth doing is worth that practice.
        - id: ch02-b64
          speaker: hindu_boy
          text: Do not lose heart. I shall teach you myself.
        - id: ch02-b65
          speaker: lurgan
          text: And I shall make sure you learn. Apart from this foolish boy, who could have asked me for arsenic instead of buying so much, I have not met anyone so worth teaching in a long time. You have ten days before Lucknow. We shall be friends.
    - id: ch03
      title: Ten Days of Lessons
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: The next ten days were wildly strange, and Kim enjoyed them too much to wonder about that. Each morning brought the Jewel Game. Sometimes the tray held real stones, sometimes swords and daggers, and sometimes photographs of people.
        - id: ch03-b02
          speaker: narrator
          text: In the afternoons, Kim and the Hindu boy hid behind carpets or screens and watched Lurgan's visitors. Little Rajahs came for phonographs and mechanical toys while their escorts coughed outside. Ladies looked for necklaces. Men appeared to be looking for the ladies. Courtiers brought broken necklaces that poured rivers of light across the table, though their true need was often money for angry queens or young princes. Lurgan spoke sternly to certain Babus and gave them silver or banknotes when the interview ended. Actors in long coats gathered to debate religion and philosophy in English and Bengali, which delighted him.
        - id: ch03-b03
          speaker: narrator
          text: Every evening, the boys had to report exactly what they had seen and heard. They judged each visitor from face, voice, and manners, then guessed the person's real business. After dinner came disguises. With a touch of paint here and a line there, Lurgan could change a face beyond recognition. He dressed Kim as a well-born young Muslim, an oil seller, and, on one glorious evening, the richly clothed son of an Oudh landowner.
        - id: ch03-b04
          speaker: narrator
          text: Lurgan saw every flaw. For half an hour at a time, he explained how each caste walked, spoke, coughed, spat, and sneezed, and why it did so. The Hindu boy remembered jewels like an icicle remembers cold, but he could not enter another person's nature. In Kim, a delighted little demon woke whenever his clothes changed. His voice and gestures changed with them.
        - id: ch03-b05
          speaker: narrator
          text: One evening Kim offered to show how a certain kind of Lahore fakir begged beside the road, and how he spoke differently to an Englishman, a Punjabi farmer bound for a fair, and a woman without a veil. Lurgan laughed and left Kim sitting cross-legged for half an hour, smeared with ashes and staring wildly. Then a huge, fat Babu entered, his stockinged legs trembling. Kim showered him with roadside mockery. To Kim's annoyance, Lurgan watched the Babu instead of the performance.
        - id: ch03-b06
          speaker: babu
          text: In my opinion, this is a most extraordinary and efficient performance. If you had not warned me, I might have thought he was making sport of me. How soon can he become a useful chain-man? When he can, I shall ask for him.
        - id: ch03-b07
          speaker: lurgan
          text: That is what he must learn at Lucknow.
        - id: ch03-b08
          speaker: babu
          text: Then order him to be very quick about it. Good night, Lurgan.
        - id: ch03-b09
          speaker: narrator
          text: The Babu rolled out with the walk of a cow stuck in deep mud. Later, while the boys reviewed the day's visitors, Lurgan asked Kim what the man might be.
        - id: ch03-b10
          speaker: kim
          text: God knows!
        - id: ch03-b11
          speaker: narrator
          text: The cheerful tone might have fooled Mahbub Ali. It did not fool the healer of pearls.
        - id: ch03-b12
          speaker: lurgan
          text: God knows, certainly. I want to know what you think.
        - id: ch03-b13
          speaker: kim
          text: I think he will want me after school. But I do not see how that man can wear many disguises and speak many languages.
        - id: ch03-b14
          speaker: lurgan
          text: You will understand later. He writes reports for a certain Colonel. His honor reaches no farther than Simla, and he has no name in the work, only a number and a letter. That is our custom.
        - id: ch03-b15
          speaker: kim
          text: Is there a price on his head, as there is on the others?
        - id: ch03-b16
          speaker: lurgan
          text: Not yet. But suppose a boy went to the house with the red veranda behind the old Lower Bazaar theater. Suppose he whispered through the shutters that Hurree Chunder Mookerjee carried last month's bad news. That boy could ask for five hundred rupees, perhaps a thousand.
        - id: ch03-b17
          speaker: kim
          text: Good. How long would the boy live afterward?
        - id: ch03-b18
          speaker: lurgan
          text: If he were very clever, he might survive the day. He would certainly not survive the night.
        - id: ch03-b19
          speaker: kim
          text: Then what is the Babu paid, if his head could be worth so much?
        - id: ch03-b20
          speaker: lurgan
          text: Perhaps eighty rupees, perhaps a hundred and fifty. Pay is the smallest part. Now and then, God makes someone who longs to travel at the risk of his life and bring back news. One day it concerns distant lands, another a hidden mountain, another men nearby who have acted foolishly against the State. Few souls are made that way, and fewer than ten are truly first-rate. Strange as it seems, I count the Babu among them. Think how desirable the work must be if it can make a Bengali brave.
        - id: ch03-b21
          speaker: kim
          text: That is true, but the days pass slowly for me. I am still a boy. I learned to write English only two months ago, and I still read badly. Years and years must pass before I can even be a chain-man.
        - id: ch03-b22
          speaker: lurgan
          text: Have patience, Friend of all the World. I wish I had some of the years that trouble you. I have tested you in several small ways, and I shall remember them when I report to the Colonel.
        - id: ch03-b23
          speaker: narrator
          text: The old street name made Kim start. Lurgan suddenly changed to English and laughed deeply.
        - id: ch03-b24
          speaker: lurgan
          text: By Jove, O'Hara, there is a great deal in you. Do not grow proud, and do not talk. Go back to Lucknow, mind your books like a good boy, and perhaps next holiday you may return, if you care to.
        - id: ch03-b25
          speaker: narrator
          text: Kim's face fell, and Lurgan softened the offer. He knew where Kim truly wished to go.
    - id: ch04
      title: The Road Back to School
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: Four days later, Kim and his small trunk took the rear seat of a tonga bound for Kalka. Beside him sat the enormous Babu, wrapped in a fringed shawl, one fat stockinged leg tucked under him as he shivered in the morning cold. Kim wondered how this man could belong to their secret company, and the thought opened delicious dreams.
        - id: ch04-b02
          speaker: narrator
          text: Lurgan had given Kim five rupees and promised protection if he worked. Unlike Mahbub, he had plainly described the reward for obedience. Kim imagined a number and letter of his own, and even a price upon his head. Someday he might follow kings and ministers across half India, as once he had followed lawyers and their agents through Lahore for Mahbub. Someday he might become almost as great as Mahbub Ali.
        - id: ch04-b03
          speaker: narrator
          text: For now, St. Xavier's waited. Kim would have new boys to patronize and holiday stories to hear. Young Martin, the tea planter's son, had boasted of going to fight headhunters with a rifle. Perhaps he would. But Martin had never been blown across a palace courtyard by exploding fireworks. Kim began rehearsing the adventures of his last three months. They would astonish even boys old enough to shave, but he could tell none of them. Loose talk would cost him the future Lurgan had promised and bring the anger of Creighton, Lurgan, and Mahbub down on him.
        - id: ch04-b04
          speaker: kim
          text: I will not throw away Delhi for the sake of one fish.
        - id: ch04-b05
          speaker: narrator
          text: He would forget the true holiday and invent harmless adventures instead. Of all the boys returning to St. Xavier's from the sands of Sukkur to the palms of Galle, none felt more virtuous than Kimball O'Hara as he jolted toward Umballa behind Hurree Chunder Mookerjee, known in one office of the Ethnological Survey as R.17.
        - id: ch04-b06
          speaker: narrator
          text: After an enormous meal at Kalka, the Babu talked for an hour and a half. Since Kim was going to school, a Master of Arts of Calcutta University would explain education. Latin and Wordsworth brought examination marks. French mattered too, and Chandernagore was the place to learn it. King Lear and Julius Caesar pleased examiners, though Lear had fewer historical references. Julius Caesar cost four annas new and two annas used in Bow Bazaar.
        - id: ch04-b07
          speaker: babu
          text: More important than all those writers is mensuration. Learn that, and with a compass, a level, and a straight eye, you can walk across a country and carry its picture away in your head. Such a picture may sell for a large sum in silver.
        - id: ch04-b08
          speaker: babu
          text: A measuring chain is not always convenient. Learn the exact length of your own stride. Then you can measure without tools. To count thousands of steps, use a rosary of eighty-one or one hundred and eight beads. Those numbers divide into many useful parts.
        - id: ch04-b09
          speaker: narrator
          text: Much of the rolling English passed over Kim, but he understood the main idea and liked it. Here was another craft a person could hide inside his head. The wide world opened before him, and it seemed that the more a man knew, the better prepared he was.
        - id: ch04-b10
          speaker: babu
          text: I hope one day to meet you in an official capacity. Until then, accept this valuable betel box. It cost me only two rupees four years ago.
        - id: ch04-b11
          speaker: narrator
          text: The heart-shaped brass box was cheap and had three spaces for betel nut, lime, and leaf, but the Babu had filled it with tiny medicine bottles.
        - id: ch04-b12
          speaker: babu
          text: This rewards your excellent holy-man performance. Young people think they will live forever and neglect their bodies. Falling sick during business is a great nuisance. I like medicines, and they also help poor people. These are sound Department drugs, quinine and the like. Keep them as a souvenir. Good-bye. I have urgent private business beside this road.
        - id: ch04-b13
          speaker: narrator
          text: He slipped from the tonga as quietly as a cat, hailed a passing cart, and jingled away. Kim could only turn the brass box in his hands.
        - id: ch04-b14
          speaker: narrator
          text: The education of a boy interests few people besides his parents, and Kim was an orphan. Still, the records of St. Xavier's say that each term brought reports to Colonel Creighton and Father Victor, who supplied his school money. Kim showed unusual skill in mathematics and mapmaking. He won a costly two-volume Life of Lord Lawrence as a prize. At fourteen years and ten months, he played for St. Xavier's against Alighur Mohammedan College. He was vaccinated again, probably during another smallpox outbreak.
        - id: ch04-b15
          speaker: narrator
          text: Notes on an old roll say he was punished repeatedly for talking with improper persons. Once he received a severe punishment for spending a day with a street beggar. He had climbed over the gate and followed the lama along the Gumti, begging to join him on the Road for the next holidays, then for one month, then merely one week.
        - id: ch04-b16
          speaker: lama
          text: The time has not come, my chela. First gather all the wisdom of the Sahibs. After that, we shall see.
        - id: ch04-b17
          speaker: narrator
          text: Friendship must somehow have turned aside calamity, because six weeks later Kim passed elementary surveying with great credit. He was then fifteen years and eight months old. After that, the school record falls silent. His name is absent from the year's candidates for the lower Survey of India. Beside it stand only the words, removed on appointment.
    - id: ch05
      title: The Appointed Time
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: Several times during those three years, the lama returned to the Temple of the Tirthankars in Benares. He was a little thinner and, if possible, a little more yellow, but as gentle and unstained as ever. Sometimes he came from the far South below Tuticorin, where fire-boats crossed to Ceylon and priests knew Pali. Sometimes he came from the wet green West and the thousand factory chimneys around Bombay. Once he returned from the North after traveling eight hundred extra miles to spend one day with the Keeper of the Images in the Wonder House.
        - id: ch05-b02
          speaker: narrator
          text: He would enter his cool marble room, wash away the dust, pray, and leave for Lucknow in a third-class railway carriage. After visiting Kim, he spoke less for a while about losing his River or about the Wheel of Life. Instead, he praised the beauty and wisdom of a mysterious chela whom no one at the temple had seen.
        - id: ch05-b03
          speaker: lama
          text: I have followed the traces of the Blessed Feet across India, and only the River of the Arrow remains. Yet dreams have shown me that I cannot find it unless the appointed chela comes with me, filled with the wisdom kept by white-haired Keepers of Images. Listen now to a Jataka.
        - id: ch05-b04
          speaker: lama
          text: Long ago, when Devadatta ruled Benares, the king's hunters captured an elephant and fastened a cruel iron ring around his leg. The elephant escaped, but the ring remained. In pain and anger he begged each of his brothers to tear it away. They tried with all their strength and failed. At last they said no animal power could break it.
        - id: ch05-b05
          speaker: lama
          text: In a thicket lay a newborn calf whose mother had died. The wounded elephant forgot his own pain. He feared the herd would trample the little one, so he stood above it and made his legs into walls. He found milk from a virtuous cow. The calf lived, and the ringed elephant became its guide and defender.
        - id: ch05-b06
          speaker: lama
          text: For thirty-five rainy seasons, the elder cared for the younger while the iron cut deeper into his flesh. Then the grown calf saw the half-buried ring and asked what it was. The elder answered that it was his sorrow. The younger reached out his trunk and broke the ring in an instant.
        - id: ch05-b07
          speaker: lama
          text: The appointed time has come, he said. Because the elder had waited without anger and had done good, the very calf he saved released him. Listen well. The elephant was Ananda, and the calf that broke the ring was the Lord himself.
        - id: ch05-b08
          speaker: narrator
          text: The lama clicked his rosary and explained how free the calf had been from pride. He was as humble as a chela who found his master sitting outside locked Gates of Learning, leaped over those gates, and embraced him before the proud city. Great would be the reward when such a master and chela sought freedom together.
        - id: ch05-b09
          speaker: narrator
          text: So the lama moved softly across India. The sharp-tongued old woman received him at her house among the fruit trees near Saharunpore. He sat in a courtyard room beneath cooing doves while she dropped her useless veil and talked of Kulu spirits, unborn grandchildren, and the bold child who had teased her at the resting place.
        - id: ch05-b10
          speaker: narrator
          text: Once he wandered from the Grand Trunk Road near Umballa toward the village where a priest had tried to drug him. At twilight, the kindly power that guards lamas led him through the crops to the Rissaldar's door. A serious misunderstanding nearly followed, because the old soldier said the Friend of the Stars had passed that way only six days earlier.
        - id: ch05-b11
          speaker: lama
          text: That cannot be. He has returned to his own people.
        - id: ch05-b12
          speaker: rissaldar
          text: Five nights ago he sat in that corner and told a hundred merry stories. At dawn he vanished after some foolish talk with my granddaughter. He is taller now, but he is the same Friend of the Stars who brought me true news of the war. Have you two parted?
        - id: ch05-b13
          speaker: lama
          text: Yes, and no. We have not entirely parted, but the proper time for the Road has not come. He gathers wisdom elsewhere, and we must wait.
        - id: ch05-b14
          speaker: rissaldar
          text: Then if it was not your boy, why did he speak of you without stopping?
        - id: ch05-b15
          speaker: lama
          text: What did he say?
        - id: ch05-b16
          speaker: rissaldar
          text: A hundred thousand sweet words. He called you father and mother and everything dear to him. It is a pity he will not serve the Queen. He has no fear.
        - id: ch05-b17
          speaker: narrator
          text: The news astonished the lama. He did not yet know how faithfully Kim kept the agreement made with Mahbub Ali and accepted by Colonel Creighton.
        - id: ch05-b18
          speaker: mahbub
          text: You cannot keep a young polo pony away from the game. Refuse him leave to travel in the holidays, and he will ignore the refusal. Then who will catch him? Colonel Sahib, only once in a thousand years is a colt born so perfectly suited to the Game. We need men like him.
