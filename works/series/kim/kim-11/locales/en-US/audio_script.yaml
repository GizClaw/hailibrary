  chapters:
    - id: ch01
      title: Who Is Kim?
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: A man who is not born to a juggler's trade may try swords, coins, cures, and snakes, only to be cut by his blade, betrayed by his clumsy hands, and laughed at by the crowd. But a born juggler needs no grand equipment. A pinch of dust, a dead flower, a tossed fruit, or a borrowed stick will serve him well.
        - id: ch01-b02
          speaker: narrator
          text: After the excitement of the journey, a sudden reaction came over Kim. He was alone now, utterly alone.
        - id: ch01-b03
          speaker: kim
          text: No one in all India is as alone as I am. If I die today, who would carry the news, and who would they tell? But if I live, and God is good, there will be a price on my head. I am a Son of the Charm. I am Kim.
        - id: ch01-b04
          speaker: narrator
          text: Very few white people can do what Kim did then, though many people in Asia can. By repeating their own names over and over, they may fall into a strange wonder. The mind seems to drift free and begins to ask what personal identity means, and what sort of thing the self truly is. As people grow older, that power usually leaves them. While it remains, however, it can seize a person suddenly, at any hour and without warning.
        - id: ch01-b05
          speaker: kim
          text: Who is Kim? Kim... Kim?
        - id: ch01-b06
          speaker: narrator
          text: He crouched in a corner of the noisy waiting room with his hands folded and his pupils narrowed to points. One more minute, one more heartbeat, and he felt sure he would solve the enormous riddle. Then his thoughts fell from that height like a wounded bird. He passed a hand before his eyes and shook his head.
        - id: ch01-b07
          speaker: narrator
          text: A long-haired Hindu holy man had just bought a ticket. He stopped and studied Kim closely.
        - id: ch01-b08
          speaker: bairagi
          text: I lost it too. That is one of the gates to the Way, but it closed against me many years ago.
          emotion: sad
        - id: ch01-b09
          speaker: kim
          text: What are you talking about?
        - id: ch01-b10
          speaker: bairagi
          text: You were searching your spirit to learn what your soul might be. It came over you suddenly. I know that feeling. Where are you going?
        - id: ch01-b11
          speaker: kim
          text: Toward Kashi, toward Benares.
        - id: ch01-b12
          speaker: bairagi
          text: There are no gods there. I have tested them. I am going to Prayag for the fifth time, still seeking the Road to Enlightenment. What faith do you follow?
        - id: ch01-b13
          speaker: kim
          text: I am a Seeker too, though only Allah knows what I am seeking.
        - id: ch01-b14
          speaker: narrator
          text: Kim had used one of the lama's favorite words and, for a moment, forgotten the northern clothes he wore. The old man tucked his crutch beneath his arm and settled on a patch of reddish leopard skin as the Benares train was called.
        - id: ch01-b15
          speaker: bairagi
          text: Go with hope, little brother. The road to the feet of the One is long, but every one of us travels there.
          emotion: calm
        - id: ch01-b16
          speaker: narrator
          text: Kim felt less lonely after that. Before the crowded train had carried him twenty miles, he was entertaining his neighbors with marvelous tales of his own magic and his master's.
        - id: ch01-b17
          speaker: narrator
          text: Benares struck Kim as an especially filthy city. Still, it pleased him to discover how much respect people showed to the holy man's clothes he wore. At least a third of the people seemed to be praying forever to one group or another among the many millions of gods. In a city so full of worship, every possible kind of holy man could expect reverence.
        - id: ch01-b18
          speaker: narrator
          text: A Punjabi farmer from near Jullundur showed him the way to the Temple of the Tirthankars outside the city, near Sarnath. The man had begged every god at home to cure his small son. None had helped, so Benares was his last hope. He pushed through the packed, foul-smelling lanes like his own favorite bull.
        - id: ch01-b19
          speaker: jat
          text: You come from the North?
        - id: ch01-b20
          speaker: kim
          text: Yes. I know the Punjab. My mother was a hill woman, and my father came from Amritsar, near Jandiala.
        - id: ch01-b21
          speaker: narrator
          text: Kim's ready tongue was already shaping itself for the Road.
        - id: ch01-b22
          speaker: jat
          text: Jandiala and Jullundur! Then we are almost neighbors. Who is your master?
        - id: ch01-b23
          speaker: narrator
          text: He looked tenderly at the crying child in his arms.
        - id: ch01-b24
          speaker: kim
          text: A very holy man from the Temple of the Tirthankars.
        - id: ch01-b25
          speaker: jat
          text: They are all very holy, and very greedy. I have walked around pillars and through temples until my feet are raw, but the boy is no better. His mother is sick too. Hush, little one. When the fever came, we changed his name and dressed him as a girl. We tried everything. I told his mother that Sakhi Sarwar Sultan would help us best, because we know his kindness. These southern gods are strangers to us.
        - id: ch01-b26
          speaker: kim
          text: And none of it helped?
        - id: ch01-b27
          speaker: jat_child
          text: None of it helped. None.
          emotion: sad
        - id: ch01-b28
          speaker: jat
          text: At least the gods gave him a quick mind. Think how carefully he listened! There is your temple. I am poor, and too many priests have taken from me already. But my son is my son. If a gift to your master would cure him, I would give it. I have no other hope.
        - id: ch01-b29
          speaker: narrator
          text: Kim thought it over, and pride tingled through him. Three years earlier he would have taken a quick profit from such a chance and gone on without another thought. Now things were different. The farmer treated him with respect, and that respect proved to Kim that he had become a man. He had also suffered fever once or twice himself. He knew what it felt like, and he knew the hollow look of starvation when he saw it in the child.
        - id: ch01-b30
          speaker: jat
          text: Call your master out. If he cures the child, I will pledge my finest pair of oxen.
    - id: ch02
      title: The Lama and the Healer
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: At the carved temple gate, a white-robed Oswal banker from Ajmir asked Kim what he wanted.
        - id: ch02-b02
          speaker: kim
          text: I am the disciple of Teshoo Lama, the Holy One from Tibet. He told me to come, so I am waiting. Please tell him.
        - id: ch02-b03
          speaker: jat
          text: Do not forget my child! Holy One! Disciple of the Holy One! Gods above every world, look at the suffering here at your gate!
        - id: ch02-b04
          speaker: narrator
          text: The farmer's shout was so common in Benares that no passerby turned. The peaceful banker carried Kim's message into the darkness. The minutes drifted by. The lama slept in his cell, and no priest would wake him. At last his rosary clicked again in the still inner court among the calm images of the Arhats.
        - id: ch02-b05
          speaker: novice
          text: Your disciple is here.
        - id: ch02-b06
          speaker: narrator
          text: The lama rose at once, leaving his prayer unfinished. As soon as his tall figure appeared, the farmer ran forward and lifted the child. He fumbled out a little silver coin.
        - id: ch02-b07
          speaker: jat
          text: Look at him, Holy One. If the gods allow it, he will live. He will live!
        - id: ch02-b08
          speaker: lama
          text: What is this?
        - id: ch02-b09
          speaker: narrator
          text: The lama looked to Kim. His Urdu was much clearer than it had been beneath Zam-Zammah, but the father allowed no private conversation.
        - id: ch02-b10
          speaker: kim
          text: It is only fever. The child has not had enough food.
        - id: ch02-b11
          speaker: jat
          text: Everything makes him ill, and his mother is not here.
        - id: ch02-b12
          speaker: kim
          text: If you permit it, Holy One, I may be able to cure him.
        - id: ch02-b13
          speaker: lama
          text: What? Have they taught you to heal? Then do it. I will wait here.
          emotion: surprised
        - id: ch02-b14
          speaker: narrator
          text: The lama sat beside the farmer on the lowest step. Kim slowly opened his small betel box, glancing sideways as he searched the medicine bottles with a wrinkled brow. At school he had dreamed of returning as a Sahib and teasing the lama before revealing himself. Those were only a boy's dreams. This quiet search, broken by pauses for thought and muttered prayers, held more drama.
        - id: ch02-b15
          speaker: narrator
          text: He had quinine tablets and dark brown meat lozenges, probably beef, though that was no concern of his. The child would not eat, but sucked eagerly at a lozenge and liked its salty taste.
        - id: ch02-b16
          speaker: kim
          text: Take these six lozenges. Praise the gods, and boil three in milk and three in water. After he drinks the milk, give him half of this white pill and wrap him warmly. When he wakes, give him the water from the other three and the rest of the pill. He may suck this other brown medicine on the way home.
        - id: ch02-b17
          speaker: jat
          text: Gods above, what wisdom!
          emotion: surprised
        - id: ch02-b18
          speaker: narrator
          text: Kim had remembered as much as he could of the treatment given to him during an autumn attack of malaria. The medicines and their order came from that memory. The solemn pauses, the muttered prayers, and all the rest were a performance meant to impress the lama.
        - id: ch02-b19
          speaker: kim
          text: Go now, and come back in the morning.
        - id: ch02-b20
          speaker: jat
          text: But what is the price? My son is my son. When he is well, how could I face his mother and say I accepted help on the road without giving even a bowl of curds?
        - id: ch02-b21
          speaker: kim
          text: Jats are all alike. A Jat stood on his dung heap as the King's elephants passed. He called to the driver, "What will you take for those little donkeys?"
        - id: ch02-b22
          speaker: narrator
          text: The farmer roared with laughter, then hurriedly apologized to the lama.
        - id: ch02-b23
          speaker: jat
          text: That is our own saying, the very voice of our country. Yes, that is what we Jats are like. I will return tomorrow with the boy. May the good little gods of our farms bless you both. Come, my little prince. Do not spit out the medicine. By morning we shall be strong men, wrestlers with clubs!
          emotion: happy
        - id: ch02-b24
          speaker: narrator
          text: He went away crooning and murmuring to his son as he carried him through the street. The lama turned back toward Kim, and all his loving old soul shone through his narrow eyes.
        - id: ch02-b25
          speaker: lama
          text: Healing the sick earns merit, but knowledge must come first. You acted wisely, Friend of all the World.
        - id: ch02-b26
          speaker: kim
          text: You made me wise, Holy One. I owe my teaching to you. For three years I have eaten your bread. My schooling is finished, and they have released me. I have come back to you.
        - id: ch02-b27
          speaker: narrator
          text: The little performance vanished from Kim's mind. He forgot St. Xavier's, his white blood, and even the Great Game. In the dust of the Jain temple, he bent as a Muslim would and touched his master's feet.
        - id: ch02-b28
          speaker: lama
          text: Then this is my reward. Come in! Is everything well? Stand where I can see you. Yes. You are no longer a child. You are a man now, ripened in wisdom and walking as a physician. I did well to give you to the soldiers on that black night. Do you remember our first day beneath Zam-Zammah?
          emotion: happy
        - id: ch02-b29
          speaker: kim
          text: I remember. And do you remember when I jumped from the carriage on my first day at the school?
        - id: ch02-b30
          speaker: lama
          text: The Gates of Learning! Of course. And the day we ate cakes behind the river near Lucknow. Many times you begged for me, but that day I begged for you.
        - id: ch02-b31
          speaker: kim
          text: With good reason. I was a student inside the Gates of Learning, dressed as a Sahib. Do not forget, Holy One, that by your favor I am still a Sahib.
        - id: ch02-b32
          speaker: lama
          text: True, and a Sahib held in high honor. Come to my cell, disciple.
        - id: ch02-b33
          speaker: kim
          text: How did you learn that?
        - id: ch02-b34
          speaker: lama
          text: First, the kind priest from the soldiers' camp sent letters. He has gone to his own country now, so I send the money to his brother. But Sahib letters are hard for me and must be explained. I found a surer way. Whenever I returned here from my Search, a man from Leh came seeking Enlightenment. He said he had once been a Hindu but had grown tired of all those gods.
        - id: ch02-b35
          speaker: kim
          text: Was he a fat man?
        - id: ch02-b36
          speaker: lama
          text: Very fat. Soon I saw that he cared only for useless things. He asked about devils and charms, how we drink tea in the monasteries, and how novices are received. He had endless questions, but he was your friend. He told me you were gaining honor as a scribe, and now I see you are a physician too.
        - id: ch02-b37
          speaker: kim
          text: I am a scribe when I live as a Sahib. Here, as your disciple, I put that aside. I have completed the years set for a Sahib.
        - id: ch02-b38
          speaker: lama
          text: Like a novice finishing his training? Are you truly free of the schools? I would not have you leave before you are ready.
        - id: ch02-b39
          speaker: kim
          text: I am free. In time I will serve the Government as a scribe.
        - id: ch02-b40
          speaker: lama
          text: Not as a warrior. That is good.
        - id: ch02-b41
          speaker: kim
          text: First I will wander with you. That is why I came. But who begs your food now?
        - id: ch02-b42
          speaker: narrator
          text: Kim changed the subject quickly. The ice beneath that question was thin.
        - id: ch02-b43
          speaker: lama
          text: Often I beg for myself. You know I am seldom here, except when I return to look once more at my disciple. I have crossed all India on foot and by train. It is a vast and wonderful land. Yet when I rest here, it feels almost like my own Tibet.
        - id: ch02-b44
          speaker: narrator
          text: The little cell was clean and orderly. The lama settled cross-legged on a low cushion, looking like a Bodhisat just risen from meditation. Before him stood a black teak table no more than twenty inches high, with copper cups for tea. In one corner was a tiny altar, also made of heavily carved teak. A gilded copper image of the seated Buddha rested there, with a lamp and an incense holder before it. Two copper flowerpots stood beside them.
        - id: ch02-b45
          speaker: lama
          text: The Keeper of the Images at the Wonder House gave me these a year ago and gained merit by it. When we are far from home, such things help us remember. We honor the Lord because he showed the Way. Look at this mound of colored rice and its metal crown. When I was an abbot, before I gained better knowledge, I offered it every day. It is the whole universe given to the Lord. We Tibetans offer the world each day to the Excellent Law. I still do it, though I know the Excellent One is beyond all our little ceremonies.
        - id: ch02-b46
          speaker: kim
          text: It is well done, Holy One.
        - id: ch02-b47
          speaker: narrator
          text: Kim sank comfortably onto the cushions, happy and rather tired.
        - id: ch02-b48
          speaker: lama
          text: I also draw the Wheel of Life. Each picture takes three days. I was working on one, or perhaps resting my eyes, when they told me you had come. I will show you my art because you must learn it. The Sahibs do not possess all the wisdom in the world.
        - id: ch02-b49
          speaker: narrator
          text: From beneath the table he drew a sheet of strangely scented yellow Chinese paper, along with his brushes and a slab of Indian ink. In severe, perfect lines he had drawn the great Wheel with its six spokes. At the very center, the Hog, Snake, and Dove were joined together. They stood for Ignorance, Anger, and Lust. All around them lay every heaven and hell and every possible turn in a human life. People said the Bodhisat himself first drew that Wheel with grains of rice scattered on dust, so his disciples could understand what causes all things. Over many ages, the design had settled into this wonderful form. Hundreds of tiny figures crowded its spaces, and every line carried meaning. Very few people could explain the picture as a parable. Fewer than twenty in the world could draw it correctly without copying another, and only three could both draw it and unfold its meaning.
        - id: ch02-b50
          speaker: kim
          text: I have learned a little drawing, but this is a wonder beyond wonders.
        - id: ch02-b51
          speaker: lama
          text: I have drawn it for many years. Once I could finish the whole Wheel between one evening lamp and the next. After you prepare yourself, I will teach you the art and its meaning.
        - id: ch02-b52
          speaker: kim
          text: Then we are taking the Road again?
        - id: ch02-b53
          speaker: lama
          text: The Road and our Search. I waited only for you. A hundred dreams showed me that without you I would never find my River. The clearest came the night after the Gates of Learning first closed upon you. Again and again I feared it was an illusion, so I would not take you from Lucknow when we ate the cakes. I waited until the right time. I searched from the Hills to the Sea and back again, but found nothing. Then I remembered the tale of the elephant and its leg iron.
        - id: ch02-b54
          speaker: narrator
          text: He told the old story as he had often told it to the Jain priests.
        - id: ch02-b55
          speaker: lama
          text: I need no further sign. You were sent to help me. When that help was taken away, my Search failed. We will go out together now, and this time our Search is sure.
        - id: ch02-b56
          speaker: kim
          text: Where will we go?
        - id: ch02-b57
          speaker: lama
          text: What does that matter, Friend of all the World? Our Search is sure. If it must, the River will spring from the earth at our feet. By sending you to the Gates of Learning, I earned merit and gave you the jewel of Wisdom. Now you return as a follower of Sakyamuni the Physician. That is enough. We are together, and everything is as it was. Friend of all the World, Friend of the Stars, my disciple!
          emotion: happy
        - id: ch02-b58
          speaker: narrator
          text: After that they spoke of ordinary, worldly things. One thing stood out. The lama never asked Kim for details of life at St. Xavier's, and he showed not the slightest curiosity about the habits or customs of the Sahibs. His mind moved entirely through the past. Step by step, he brought their wonderful first journey back to life. He rubbed his hands and chuckled over the memories until, all at once, old age took hold of him and he curled up in sudden sleep.
        - id: ch02-b59
          speaker: narrator
          text: Kim watched the last dusty sunlight fade from the inner court. He played idly with his ghost dagger and his rosary. Beyond the walls, the clamor of Benares continued by day and night. It was the oldest of all earthly cities, awake before the gods, and its noise beat around the temple like the sea roaring against a breakwater. From time to time, a Jain priest crossed the court carrying some small offering for the images. He swept the path before every step so that he would not accidentally take the life of any living creature. A lamp began to twinkle in the darkness, and then Kim heard a prayer. One by one, he watched the stars rise into the still, sticky night. At last he fell asleep at the foot of the altar. All that night he dreamed in Hindustani, and not one English word entered his dreams.
    - id: ch03
      title: Northward Again
      blocks:
        - id: ch03-b01
          speaker: kim
          text: Holy One, the child we treated is coming back at daylight.
        - id: ch03-b02
          speaker: narrator
          text: It was about three in the morning. The lama had awakened from dreams too and was ready to begin the pilgrimage.
        - id: ch03-b03
          speaker: lama
          text: You have answered me well. In my hurry I would have done wrong.
        - id: ch03-b04
          speaker: narrator
          text: He sat down again and took up his rosary.
        - id: ch03-b05
          speaker: lama
          text: Old people are like children. They want something, and it must happen at once or they fret. On the Road I have nearly stamped my feet because an ox cart blocked me, or because dust blew past. I was not like that when I was a man, long ago. Still, it is wrong.
        - id: ch03-b06
          speaker: kim
          text: But you truly are old, Holy One.
        - id: ch03-b07
          speaker: lama
          text: The deed was done and its cause released into the world. Old or young, sick or healthy, wise or foolish, who can stop the result? Does the Wheel stand still because a child or a drunkard spins it? Disciple, this is a great and terrible world.
        - id: ch03-b08
          speaker: kim
          text: I think it is a good world. What is there to eat? I have had nothing since yesterday.
        - id: ch03-b09
          speaker: lama
          text: I forgot your need. There is good Tibetan tea and cold rice.
        - id: ch03-b10
          speaker: narrator
          text: Kim wanted meat, which the Jain temple could not provide. Still, he quieted his stomach with slabs of cold rice until dawn brought the farmer, stumbling over his own thanks.
        - id: ch03-b11
          speaker: jat
          text: The fever broke in the night, and then he sweated. Feel his skin. It is fresh and new! He loved the salty lozenges and drank the milk greedily.
          emotion: happy
        - id: ch03-b12
          speaker: narrator
          text: The farmer pulled the cloth away from the child's face, and the boy gave Kim a sleepy smile. A small knot of Jain priests gathered silently beside the temple door and watched everything. They knew the story of how the old lama had first met his disciple, and Kim knew perfectly well that they knew it. They were courteous people. The night before, they had not pushed themselves into the reunion by appearing, speaking, or even making a gesture. As the sun rose, Kim found a way to repay their courtesy.
        - id: ch03-b13
          speaker: kim
          text: Thank the gods of the Jains, brother. The fever has truly broken.
        - id: ch03-b14
          speaker: lama
          text: Look at him! Was there ever such a disciple? He follows our Lord the Healer.
          emotion: happy
        - id: ch03-b15
          speaker: narrator
          text: The Jains officially recognized all the gods of the Hindu faith, along with the sacred symbol and the Snake. They wore the Brahmin thread and obeyed every demand of Hindu caste law. More important in that moment, they knew and loved the lama. He was an old man, a seeker of the Way, and their guest for three years. On many nights he had talked deep into the darkness with their head priest, a fearless thinker who could split a single hair into seventy separate arguments. For all those reasons, the gathered priests murmured their agreement.
        - id: ch03-b16
          speaker: kim
          text: Remember, the fever may return.
        - id: ch03-b17
          speaker: jat
          text: Not if you know the proper spell.
        - id: ch03-b18
          speaker: kim
          text: But we are leaving soon.
        - id: ch03-b19
          speaker: lama
          text: Yes. We leave together on the Search I have so often described. I waited until my disciple was ready. Look at him. We go North. People of good will, I shall never see this resting place again.
        - id: ch03-b20
          speaker: jat
          text: But I am not a beggar.
        - id: ch03-b21
          speaker: jain_priest
          text: Be quiet. Do not trouble the Holy One.
        - id: ch03-b22
          speaker: kim
          text: Meet us beneath the great railway bridge. By every god of the Punjab, bring food. Bring curry, lentils, cakes fried in fat, and sweets. Especially sweets. Hurry.
        - id: ch03-b23
          speaker: narrator
          text: Hunger had left Kim pale. In his flowing sand-colored robes, one hand holding his rosary and the other raised in a blessing copied from the lama, he might have looked to an Englishman like a young saint in colored glass. In truth, he was a growing boy faint for want of food.
        - id: ch03-b24
          speaker: narrator
          text: "The farewells were long and formal. Three times they seemed to end, and three times they began again. The Seeker who had invited the lama to that refuge from distant Tibet took no part. He was a silver-faced, hairless ascetic, and as always, he meditated alone among the images. The other priests were more human. They pressed little comforts on the old man for his journey: a betel box, a fine new iron pen case, a food bag, and other useful gifts. They warned him about every danger waiting beyond the temple and foretold a happy end to his Search. While all this continued, Kim crouched on the steps. He felt lonelier than ever and swore quietly to himself in the language he had learned at St. Xavier's."
        - id: ch03-b25
          speaker: kim
          text: It is my own fault. With Mahbub, I ate his bread. With Lurgan Sahib, I ate his. At St. Xavier's, I had three meals every day. Now I must look after myself. I am out of training too. What I would give for a plate of beef! Are they finished yet, Holy One?
        - id: ch03-b26
          speaker: narrator
          text: The lama raised both hands and gave one last blessing in elaborate Chinese. When the temple gates shut behind them, he spoke to Kim.
        - id: ch03-b27
          speaker: lama
          text: I must lean on your shoulder. I think I am growing stiff.
        - id: ch03-b28
          speaker: narrator
          text: A six-foot man was heavy to steady through miles of crowded streets. Kim also carried their bundles, and he was thankful when they reached the railway bridge. The blue-robed farmer appeared with a basket in one hand and his child in the other.
        - id: ch03-b29
          speaker: kim
          text: We eat here.
        - id: ch03-b30
          speaker: jat
          text: Come and eat, Holy Ones! I brought rice, good curry, hot cakes scented with hing, curds, and sugar. Come, king of my fields. We will show these holy men that a Jat of Jullundur pays for a service. I heard the Jains eat nothing they did not cook themselves. Still, where no one watches, caste cannot see.
        - id: ch03-b31
          speaker: kim
          text: And we stand beyond every caste.
        - id: ch03-b32
          speaker: narrator
          text: Kim turned his back and filled a leaf plate for the lama. They ate in silence until not a crumb remained. Only after licking the last sticky sweetness from his finger did Kim notice that the farmer was dressed for travel too.
        - id: ch03-b33
          speaker: jat
          text: If our roads run together, I am coming with you. One does not often meet a worker of miracles, and my son is still weak. I am not helpless either. People call Jats quarrelsome, but that is false. Unless someone crosses us, we are gentle as our own buffaloes.
        - id: ch03-b34
          speaker: narrator
          text: He swung his five-foot bamboo staff, ringed with polished iron.
        - id: ch03-b35
          speaker: kim
          text: Then come. A strong stick is a strong argument.
        - id: ch03-b36
          speaker: narrator
          text: The lama looked peacefully upstream. In the distance, endless columns of smoke rose from the burning ghats, one behind another until they blurred together. The river was full and moved steadily beneath them. Despite every rule the city had made, a piece of a half-burned body would sometimes rise and bob past upon the current.
        - id: ch03-b37
          speaker: jat
          text: Without you, I might have gone there today with my son. The priests say Benares is holy and good to die in, and no one doubts it. But their gods are strangers to me, and every priest demands money. Finish one worship and a shaven head says it is useless without another. Wash here, drink there, scatter flowers, and always pay. Give me the Punjab, and above all the soil between the rivers at Jullundur.
        - id: ch03-b38
          speaker: lama
          text: I have often said that, if need be, the River will open at our feet. We shall go North. I remember a pleasant place among fruit trees, where a man may meditate. Cool air comes there from the Hills and their snow.
        - id: ch03-b39
          speaker: kim
          text: What is the place called?
        - id: ch03-b40
          speaker: lama
          text: How should I know? You were not with me then. The Army had risen from the earth and taken you away. I stayed in a room beside a dovecote, except when a woman talked without end.
        - id: ch03-b41
          speaker: kim
          text: Ah, the woman from Kulu! That is near Saharunpore.
          emotion: happy
        - id: ch03-b42
          speaker: jat
          text: Does your master walk to punish old sins? Delhi is very far.
        - id: ch03-b43
          speaker: kim
          text: No. I will beg tickets for the train.
        - id: ch03-b44
          speaker: narrator
          text: In India, a wise traveler did not admit that he had money.
        - id: ch03-b45
          speaker: jat
          text: Then, by the gods, we will take the fire carriage. My boy belongs in his mother's arms. The Government burdens us with taxes, but it has given us one good thing. The train joins friends and brings anxious hearts together. It is a wonder.
    - id: ch04
      title: A Healing on the Train
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: Two hours later they all crowded into a train and slept through the fiercest heat of the day. Whenever he was awake, the farmer poured out question after question about the lama's journeys, his daily life, and his work. Kim answered him, though some of the answers were curious ones. Kim himself was perfectly content. He watched the broad, flat country of the Northwest slide past the window, and he talked easily with the shifting crowd of passengers who entered and left the compartment along the way.
        - id: ch04-b02
          speaker: narrator
          text: To country travelers, tickets and ticket punching were a dark kind of oppression. They could not understand why, after paying for a magical piece of paper, they had to let strangers cut great pieces out of the charm. Long, furious debates with the Eurasian ticket collectors followed. Kim joined two or three of them. With a grave face he offered advice designed to confuse the question still further. It also gave him the pleasure of showing off his wisdom before the lama and the admiring farmer.
        - id: ch04-b03
          speaker: narrator
          text: At Somna Road, fate sent Kim something more serious to consider. As the train was already moving away from the station, a thin, mean-looking little man tumbled into their compartment. Kim studied the tight turban and the particular angle at which it sat, and from that he judged the stranger to be a Mahratta. Cuts marked the man's face. His light muslin upper garment had been badly torn, and one whole leg was wrapped in bandages. Between frightened breaths, he gave the other passengers his explanation. A country cart had overturned, he said, and had come very close to killing him. Now he was bound for Delhi because his son lived there and would take him in.
        - id: ch04-b04
          speaker: narrator
          text: Kim watched every movement. If a cart had thrown the man and rolled him over the earth, there should have been gravel grazes on his skin. Instead, all his wounds were clean cuts. Nor could a mere tumble from a cart explain the terrible fear in him. His fingers shook as he knotted the torn cloth around his neck, and the movement uncovered an amulet called a keeper-up of the heart. Amulets were common enough, but few hung from square-braided copper wire, and fewer still bore black enamel on silver. Only the farmer and the lama shared the compartment with them, and the old carriage had solid ends. Kim pretended to scratch inside his robe and lifted his own amulet into sight. At once the stranger's whole expression changed. He placed his amulet plainly on his chest so Kim could see it.
        - id: ch04-b05
          speaker: e23
          text: Yes, I was in a hurry. The worthless driver caught the cartwheel in a ditch. Besides these injuries, I lost a whole dish of tarkeean. I was no Son of the Charm that day.
        - id: ch04-b06
          speaker: jat
          text: That was a serious loss.
        - id: ch04-b07
          speaker: narrator
          text: After Benares, the farmer had learned suspicion and lost interest.
        - id: ch04-b08
          speaker: kim
          text: Who cooked it?
        - id: ch04-b09
          speaker: e23
          text: A woman.
        - id: ch04-b10
          speaker: jat
          text: Any woman can cook tarkeean. It is good curry. I know that much.
        - id: ch04-b11
          speaker: e23
          text: Yes, good curry.
        - id: ch04-b12
          speaker: kim
          text: Cheap too. But what happens to caste?
        - id: ch04-b13
          speaker: e23
          text: There is no caste where men go to look for tarkeean. Whose service are you in?
        - id: ch04-b14
          speaker: kim
          text: I serve this Holy One.
        - id: ch04-b15
          speaker: lama
          text: He was sent from Heaven to help me. People call him Friend of all the World, and they also call him Friend of the Stars. Now that the proper time has come, he walks as a physician. His wisdom is very great.
        - id: ch04-b16
          speaker: kim
          text: And I am a Son of the Charm.
        - id: ch04-b17
          speaker: e23
          text: Who is that man?
        - id: ch04-b18
          speaker: kim
          text: His child was sick, and we cured him. He owes us a great debt. Sit by the window, man of Jullundur. Here is another sick man.
        - id: ch04-b19
          speaker: jat
          text: I want nothing to do with strangers picked up on the road. My ears are not long, and I am no woman trying to steal secrets.
        - id: ch04-b20
          speaker: e23
          text: Are you a healer? I am buried ten leagues deep in disaster.
        - id: ch04-b21
          speaker: kim
          text: He is cut and bruised everywhere. I mean to treat him. No one interfered when I treated your son.
        - id: ch04-b22
          speaker: jat
          text: You have corrected me. I owe you my son's life. I know you work miracles.
        - id: ch04-b23
          speaker: kim
          text: Show me the wounds. Tell me your story quickly, brother, while I speak a charm.
        - id: ch04-b24
          speaker: narrator
          text: Kim's heart nearly choked him. This was the Great Game in earnest.
        - id: ch04-b25
          speaker: e23
          text: My work was in the South. One of our people was killed beside the road. Did you hear of it? I had been sent to search for a certain letter, and I found it. Then I escaped from the city and ran all the way to Mhow. I was so certain that no one knew what I had done that I did not trouble to change my face. At Mhow, a woman appeared and accused me of stealing jewelry in the city I had just left. That was when I understood the alarm had gone out against me. I escaped from Mhow after dark. I had to bribe the police, because my enemies in the South had already bribed them to hand me over without asking any questions.
        - id: ch04-b26
          speaker: e23
          text: After that I spent a week in old Chitor, hiding as a penitent inside a temple. I could not keep carrying the letter that had been placed in my charge, so I buried it under the Queen's Stone, at the place known to all our people. In Chitor I was surrounded by the princes' country. Kotah lies to the east, outside the Queen's law, and beyond it are Jaipur and Gwalior. None of them loves a spy, and there is no justice for a man like me. They hunted me like a wet jackal. I broke through at Bandakui, but there I learned they had accused me of a murder back in the southern city. They said I had killed a boy, and they already had both a corpse and witnesses waiting.
        - id: ch04-b27
          speaker: kim
          text: Can the Government not protect you?
        - id: ch04-b28
          speaker: e23
          text: Those of us in the Game live beyond protection. If we die, we die, and our names are simply crossed out of the book. At Bandakui, where one of our people lives, I tried to throw the hunters off by changing my face and becoming a Mahratta. From there I reached Agra, and I meant to turn back toward Chitor to recover the hidden letter. I was certain I had shaken them off. That was why I never sent a telegram telling anyone where the letter lay. I wanted the whole achievement, and all the credit for it, to belong to me.
        - id: ch04-b29
          speaker: narrator
          text: Kim understood that feeling perfectly.
        - id: ch04-b30
          speaker: e23
          text: Then a man in Agra accused me of owing him money. He brought witnesses and tried to drag me to court, claiming I had been his cotton agent. The South is clever!
          emotion: angry
        - id: ch04-b31
          speaker: kim
          text: Had you been his agent?
        - id: ch04-b32
          speaker: e23
          text: Fool! I was the man they wanted because of the letter. That supposed creditor had recognized me. I ran into the butchers' quarter and came out beside a Jewish man's house. The owner feared there would be a riot, so he pushed me back into the street. I escaped Agra on foot and walked to Somna Road. By then I had only enough money left to buy this ticket to Delhi. I was lying in a ditch with a fever when someone sprang from the bushes. He beat me, slashed me, and searched me from head to foot. He did it so close to the railway that I could hear the train.
        - id: ch04-b33
          speaker: kim
          text: Why did he not kill you there?
        - id: ch04-b34
          speaker: e23
          text: They are much too clever to kill me here. When I arrive in Delhi, lawyers will have me arrested on a murder charge that appears fully proven. The Government will then hand my body to the state that demands it. I will be taken south under guard, and there they will kill me slowly so that my death warns every other one of us. The South is not my own country. I cannot find my way through it, and I keep running in circles like a goat with only one eye. I have not eaten for two days. Worse still, they marked me with this bandage so their people will know me the instant I reach Delhi.
          emotion: fearful
        - id: ch04-b35
          speaker: kim
          text: At least you are safe on the train.
        - id: ch04-b36
          speaker: e23
          text: Live for one year in the Great Game, and then tell me a train is safe. The telegraph wires will carry word to Delhi before we arrive. The message will describe every tear and every rag I am wearing. If they need twenty witnesses, twenty will swear they saw me murder that boy. If they need a hundred, then a hundred will appear. They will have every detail ready, and you are no help to me at all!
          emotion: fearful
        - id: ch04-b37
          speaker: narrator
          text: Kim knew enough about the local ways of destroying an enemy to believe every word. By the time the accusation reached court, the false case would be complete in every detail, even down to a corpse. From time to time the Mahratta's fingers jerked with pain. The farmer glared sullenly from his corner. The lama remained busy with his beads and seemed to notice nothing. Kim kept up the appearance of a doctor, feeling around the wounded man's neck and muttering invocations while, behind that performance, he worked out a plan.
        - id: ch04-b38
          speaker: e23
          text: Can your charm change my shape? Without that, I am dead. If I had been given five minutes alone, I might have managed it.
        - id: ch04-b39
          speaker: jat
          text: Have you cured him yet, miracle-worker? You have chanted long enough.
        - id: ch04-b40
          speaker: kim
          text: His wounds have only one cure. He must spend three days dressed as a bairagi.
        - id: ch04-b41
          speaker: jat
          text: One priest always wants to turn another man into a priest.
        - id: ch04-b42
          speaker: kim
          text: Will your son become a priest, then? It is time for more quinine.
        - id: ch04-b43
          speaker: jat
          text: We Jats are all buffaloes.
        - id: ch04-b44
          speaker: narrator
          text: He softened at once. Kim touched a fingertip of bitter medicine to the child's trusting lips.
        - id: ch04-b45
          speaker: kim
          text: I asked you for nothing except food. Do you begrudge me even that while I heal another man? Have I your permission, Prince?
        - id: ch04-b46
          speaker: jat
          text: No, no! Do not mock me.
        - id: ch04-b47
          speaker: kim
          text: I choose to cure him, and you will gain merit by helping. The ash in your pipe is white. That is fortunate. Do you have raw turmeric among your food?
        - id: ch04-b48
          speaker: jat
          text: I... I...
        - id: ch04-b49
          speaker: kim
          text: Open your bundle.
        - id: ch04-b50
          speaker: narrator
          text: The bundle held the usual collection of a country traveler. There were scraps of cloth, quack medicines, cheap little fairground purchases, and a cloth filled with coarse gray flour. Twists of southern tobacco lay beside gaudy pipe stems and a packet of curry spices. Everything was wrapped together in a quilt. Kim turned the objects over slowly, wearing the solemn air of a wise magician while he murmured a Muslim prayer beneath his breath.
        - id: ch04-b51
          speaker: kim
          text: I learned this wisdom from the Sahibs, Holy One. The Stars show a great evil in this man's fortune. It troubles him badly. Shall I remove it?
        - id: ch04-b52
          speaker: lama
          text: Friend of the Stars, you have acted well in everything. Do as you wish. Is this another healing?
        - id: ch04-b53
          speaker: e23
          text: Hurry! The train may stop.
          emotion: fearful
        - id: ch04-b54
          speaker: kim
          text: This healing is against the shadow of death.
        - id: ch04-b55
          speaker: narrator
          text: Kim mixed flour with charcoal and tobacco ash in the clay bowl of the pipe. E23 pulled off his turban and let his long black hair fall.
        - id: ch04-b56
          speaker: jat
          text: That is my food, priest!
          emotion: angry
        - id: ch04-b57
          speaker: kim
          text: A buffalo has entered the temple! How dare you look? I must perform mysteries in front of a fool, but guard your eyes. Is darkness already spreading over them? I saved your child, and this is my reward? Shall I curse you?
          emotion: angry
        - id: ch04-b58
          speaker: narrator
          text: Kim threw the bundle's outer cloth over the farmer's bowed head.
        - id: ch04-b59
          speaker: kim
          text: If you even wish to look, I may not be able to save you. Sit still and say nothing.
        - id: ch04-b60
          speaker: jat
          text: I am blind and silent. Please do not curse me. Come, child. We will play at hiding. For my sake, do not peek from under the cloth.
          emotion: fearful
        - id: ch04-b61
          speaker: e23
          text: Now I see hope. What is your plan?
        - id: ch04-b62
          speaker: kim
          text: This shirt must come off next. Why worry about caste when your throat is about to be cut? We have to turn you into a yellow holy man from head to foot. Strip, and do it quickly. Let your long hair fall forward over your eyes while I scatter ash across your body. Do not stop moving. Now hold still for one moment while I paint the caste mark on your forehead.
        - id: ch04-b63
          speaker: narrator
          text: E23 disliked baring himself, but worked for his life. Kim opened his Survey paint box and laid a bold crimson mark over the ash.
        - id: ch04-b64
          speaker: e23
          text: Are you only a beginner?
        - id: ch04-b65
          speaker: kim
          text: I entered the Game two days ago, brother. Put more ash on your chest.
        - id: ch04-b66
          speaker: e23
          text: Have you met the doctor of sick pearls?
        - id: ch04-b67
          speaker: narrator
          text: With flying hands, E23 wound his long turban cloth into a holy man's loin covering.
        - id: ch04-b68
          speaker: kim
          text: You know his touch? He taught me for a time. We must stripe your legs. Ash heals wounds, so smear on more.
        - id: ch04-b69
          speaker: e23
          text: I was once his pride, but you may be better than I was. The gods favor us. Give me those pills.
        - id: ch04-b70
          speaker: narrator
          text: He swallowed a handful of opium pills from the farmer's bundle.
        - id: ch04-b71
          speaker: e23
          text: They fight hunger, fear, and cold, and they redden the eyes. Now I have courage for the Game. We lack only a holy man's tongs. What will you do with my clothes?
        - id: ch04-b72
          speaker: kim
          text: The blood on them could hang you.
        - id: ch04-b73
          speaker: narrator
          text: Kim rolled the bloody clothes into the smallest bundle he could make and pushed them deep into the loose folds of his own tunic. He took a cake of yellow ochre from his paint box and went on with the disguise. Across E23's legs and bare chest, he painted broad yellow streaks. Beneath them lay the rough mixture of flour, white pipe ash, black charcoal, tobacco dust, and turmeric. Layer by layer, the hunted agent disappeared and the wandering holy man took shape.
        - id: ch04-b74
          speaker: e23
          text: Perhaps, but do not throw them from the window.
        - id: ch04-b75
          speaker: kim
          text: It is done. Turn around and look, Jat!
          emotion: happy
        - id: ch04-b76
          speaker: jat
          text: May the gods protect us! Where did the Mahratta go? What have you done?
          emotion: surprised
        - id: ch04-b77
          speaker: narrator
          text: Lurgan Sahib had trained Kim well, and the work of the Great Game had made E23 an expert actor. The trembling, frightened trader had disappeared completely. In his place lounged a nearly naked holy man. Ash covered his skin, ochre stripes crossed his body, and dusty black hair hung wildly around his face. His legs were folded beneath him with careless ease. The opium had acted quickly on his empty stomach, swelling his eyes and making them shine with bold, animal insolence. Kim's brown rosary hung around his neck, and barely a yard of worn flowered cloth rested on his shoulders. The change was so complete that the child buried his face in his astonished father's arms.
        - id: ch04-b78
          speaker: jat
          text: Look up, little prince. We travel with magicians, but they will not hurt you. Do not cry. What sense is there in curing you one day and frightening you to death the next?
        - id: ch04-b79
          speaker: kim
          text: He will be fortunate all his life because he has seen a great healing. When I was small, I made men and horses from clay.
        - id: ch04-b80
          speaker: jat_child
          text: I made them too. Sir Banas comes at night and makes them alive behind our rubbish heap.
        - id: ch04-b81
          speaker: kim
          text: Then nothing frightens you, does it, Prince?
        - id: ch04-b82
          speaker: jat_child
          text: I was frightened because Father was frightened. I felt his arms shaking.
        - id: ch04-b83
          speaker: kim
          text: What a chicken of a man! I healed this poor trader. He must leave his profits and account books and sit beside the road for three nights until his enemies' evil passes. The Stars oppose him.
        - id: ch04-b84
          speaker: narrator
          text: Even the ashamed farmer laughed.
        - id: ch04-b85
          speaker: jat
          text: The fewer moneylenders, the better. But holy man or not, he should pay for the things he is wearing.
        - id: ch04-b86
          speaker: kim
          text: And what price will you pay for the child on your shoulder? Less than two days ago you believed he was destined for the burning ghat. One matter still remains. Need was very great, so I worked this charm in your presence. Before your eyes, I changed this man's shape and changed his soul as well. If you ever remember what you saw, beware. Do not speak of it beneath the village tree among the elders. Do not whisper it inside your own house. Do not tell it even to the priest when he comes to bless your cattle. If you do, sickness will spread through the buffaloes. Fire will seize the thatch above your family. Rats will devour the grain in your bins. The curse of our gods will fall upon your fields, and the soil will lie barren both before your feet and behind your plowshare.
        - id: ch04-b87
          speaker: narrator
          text: Kim had learned that curse from a beggar near Lahore's Taksali Gate when he was younger, and repetition had made it no weaker.
        - id: ch04-b88
          speaker: jat
          text: Stop, Holy One! Have mercy. Do not curse my home. I saw nothing and heard nothing. I am your cow!
          emotion: fearful
        - id: ch04-b89
          speaker: narrator
          text: The farmer reached for Kim's bare foot as it beat time on the carriage floor. Kim explained that because the man had supplied flour, opium, and other small things for the art, the gods would return a blessing. He gave him one learned from Lurgan Sahib, and the farmer sagged with relief.
        - id: ch04-b90
          speaker: narrator
          text: The lama stared through his spectacles. Not even the disguise had held his gaze like Kim's blessing.
        - id: ch04-b91
          speaker: lama
          text: Friend of the Stars, you have gained great wisdom. Take care that it does not give birth to pride. No one who keeps the Law before his eyes speaks hastily of anything he has seen or met.
        - id: ch04-b92
          speaker: jat
          text: No, no, never!
          emotion: fearful
        - id: ch04-b93
          speaker: narrator
          text: He feared the master might add to the pupil's warning. E23 relaxed into the opium that served an exhausted man as food, tobacco, and medicine. In awed silence and vast misunderstanding, they rolled into Delhi as the lamps were being lit.
