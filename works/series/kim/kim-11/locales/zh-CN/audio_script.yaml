audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts: {delivery: "从容而机敏的讲述", timbre: "温暖清晰", pace: "舒展而有变化", pitch: "中音"}
    kim:
      display_name: 金
      tts: {delivery: "机灵大胆，话里常带笑", timbre: "明亮的少年声", pace: "轻快敏捷", pitch: "中高音"}
    hurree:
      display_name: 胡里·钱德尔·穆克吉
      tts: {delivery: "一本正经而滔滔不绝，英语腔调夸张", timbre: "厚重圆润", pace: "稍快", pitch: "中音"}
    lama:
      display_name: 德舒喇嘛
      tts: {delivery: "慈爱虔诚，沉思中透着天真", timbre: "清瘦柔和的老人声", pace: "从容缓慢", pitch: "中低音"}
    bairagi:
      display_name: 拜拉吉苦行僧
      tts: {delivery: "忧郁深思，言语温和", timbre: "干涩苍老", pace: "缓慢", pitch: "低音"}
    jatt:
      display_name: 甘波族农夫
      tts: {delivery: "粗豪直率，爱子心切", timbre: "洪亮粗厚", pace: "明快而有起伏", pitch: "中低音"}
    child:
      display_name: 农夫的幼子
      tts: {delivery: "虚弱却伶俐，话语短而直接", timbre: "稚嫩轻细", pace: "缓慢", pitch: "高音"}
    oswal:
      display_name: 奥斯瓦尔钱庄老板
      tts: {delivery: "客气平和", timbre: "清润稳重", pace: "平稳", pitch: "中音"}
    novice:
      display_name: 见习僧
      tts: {delivery: "恭谨轻声", timbre: "年轻清朗", pace: "舒缓", pitch: "中音"}
    e23:
      display_name: E二三
      tts: {delivery: "机警急迫，危境中仍精于算计", timbre: "干瘦沙哑", pace: "急促而多停顿", pitch: "中高音"}
  chapters:
    - id: ch01
      title: 第十一章
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: "把不是天生干这行的人交给这门营生，让他把刀剑抛起再接住，把钱币弹响再攫住，伤人以后再医人，引蛇出洞以后再驯服，结果会怎样呢？刀锋会割伤他自己，毒蛇会抗命反噬，笨手笨脚也藏不住，只会惹得众人笑断肠。天生的戏法师却不同。一撮尘土、一朵枯花，偶然抛来的果子，甚至一根借来的手杖，到了他手里都能应手施展本领。他一会儿缚住法术，一会儿又放出笑声。"
        - id: ch01-b02
          speaker: narrator
          text: "紧接着，金心里生出一个再自然不过的念头。他觉得如今只剩自己孤零零一个，全印度再没有人比他更孤单。要是今天死了，会有谁去报信？又能报给谁听？要是活下去，上帝又肯照看他，那么护符之子金的脑袋，迟早会有人悬赏。这个人就是他自己，是金。"
        - id: ch01-b03
          speaker: narrator
          text: "白人里极少有人做得到，亚洲人中却有许多人能做到。只要一遍又一遍默念自己的名字，他们就会忽然坠进一阵迷惘，任思绪自由游荡，追问那个所谓的自己到底是谁。年纪渐长以后，这种本领多半会消失。可只要它还没有消失，随时都可能忽然攫住一个人。"
        - id: ch01-b04
          speaker: kim
          text: "金是谁？金……金……"
        - id: ch01-b05
          speaker: narrator
          text: "他蹲在候车室一角，双手叠在膝上。四周一片铿锵，他却全忘了，瞳孔缩得像针尖。再有一分钟，甚至半秒，他仿佛就能解开这个惊人的谜。可他的心灵又像一只受伤的鸟，从高处猛地坠落。他抬手在眼前晃了晃，又摇摇头。"
        - id: ch01-b06
          speaker: narrator
          text: "一个刚买好票、蓄着长发的拜拉吉苦行僧停在他面前，目不转睛地望着他。"
        - id: ch01-b07
          speaker: bairagi
          text: "我也失去它了。那原是一扇通往大道的门，可它向我关闭，已经有许多年了。"
          emotion: sad
        - id: ch01-b08
          speaker: kim
          text: "你在说什么？"
        - id: ch01-b09
          speaker: bairagi
          text: "刚才你忽然迷惘了，心里正在问自己的灵魂究竟是什么模样。我懂，除了我，还有谁能懂呢？你要去哪里？"
        - id: ch01-b10
          speaker: kim
          text: "去迦尸，也就是贝拿勒斯。"
        - id: ch01-b11
          speaker: bairagi
          text: "那里没有神，我已经把他们全试过。这是我第五次去钵罗耶伽，也就是阿拉哈巴德，找那条通往觉悟的路。你信哪一种教？"
        - id: ch01-b12
          speaker: kim
          text: "我也是个探寻者。不过……只有真主知道，我究竟在找什么。"
        - id: ch01-b13
          speaker: narrator
          text: "他说的是喇嘛最爱用的词，却一时忘了自己身上穿着北方人的衣裳。老苦行僧把拜拉吉拐杖夹在腋下，在一块赤褐色豹皮上坐下来。去贝拿勒斯的火车已经开始招呼旅客上车，金这才站了起来。"
        - id: ch01-b14
          speaker: kim
          text: "怀着希望走吧，小兄弟。去往那唯一者足下的路很长，可我们人人都在朝那里走。"
        - id: ch01-b15
          speaker: narrator
          text: "从此，金不再那么孤独。拥挤的车厢才走二十英里，他已经说起自己和师父的种种神奇法术，用一串少见的奇闻把邻座逗得兴高采烈。"
        - id: ch01-b16
          speaker: narrator
          text: "贝拿勒斯在金看来肮脏得出奇，好在他这身僧衣处处受敬重，让他很是得意。城里至少三分之一的人，整天向千万神祇中的这一群或那一群祷告，所以见了什么圣人都心怀敬畏。金偶然遇上一个旁遮普农夫。那人来自贾朗达尔一带，是甘波族，便领金出城约一英里，去鹿野苑附近的蒂尔坦迦罗寺。他求遍家乡诸神，也没治好幼子，只能把贝拿勒斯当作最后的希望。"
        - id: ch01-b17
          speaker: jatt
          text: "你是从北方来的？"
        - id: ch01-b18
          speaker: narrator
          text: "他抱着孩子挤过狭窄恶臭的街巷，人群一路退让，就像躲他家那头最受宠的公牛。"
        - id: ch01-b19
          speaker: kim
          text: "是啊，我熟悉旁遮普。我母亲是山里人，父亲来自阿姆利则那边的詹迪亚拉。"
        - id: ch01-b20
          speaker: narrator
          text: "金那条机敏的舌头，又为了大路上的需要活动起来。"
        - id: ch01-b21
          speaker: jatt
          text: "詹迪亚拉和贾朗达尔？哦呵，那我们也算半个邻居。你侍奉哪一位？"
        - id: ch01-b22
          speaker: kim
          text: "蒂尔坦迦罗寺里的一位至圣高人。"
        - id: ch01-b23
          speaker: jatt
          text: "谁都说自己至圣，可谁都贪得没底。我绕了多少圣柱，走过多少寺院，脚底全磨烂了，孩子还是一点不见好。他母亲偏偏也病着。别哭，小宝贝。高烧一来，我们替他改过名字，还让他穿女孩的衣裳，能试的全试了。我早说该去求萨基·萨瓦尔苏丹，他是慷慨的。可孩子的母亲硬把我赶来贝拿勒斯，她自己又该来不来。南方这些神，我们一个也不认识。"
          emotion: sad
        - id: ch01-b24
          speaker: narrator
          text: "孩子躺在他筋肉盘结的巨臂上，转过脸，从沉重的眼皮下看着金。"
        - id: ch01-b25
          speaker: kim
          text: "你们试的办法，一样也没管用？"
        - id: ch01-b26
          speaker: child
          text: "一样也没用，全没用。"
        - id: ch01-b27
          speaker: narrator
          text: "高烧已经把孩子的嘴唇烧裂。"
        - id: ch01-b28
          speaker: jatt
          text: "诸神至少给了他一副好头脑，你听，他什么都明白。那边就是你的寺院。我是穷人，又被许多祭司盘剥过，可儿子总归是我的儿子。要是给你师父一份礼就能救他，我也愿意。我实在没有别的办法了。"
        - id: ch01-b29
          speaker: narrator
          text: "金停下来想了一会儿，心里因自豪而微微发麻。三年前碰上这种机会，他早会当场捞一笔好处，然后头也不回地走掉。如今农夫这样敬重他，反倒恰好证明他已经是个成人。何况他自己也发过一两回烧，眼前这个孩子是不是挨饿，他一眼就看得出来。"
        - id: ch01-b30
          speaker: jatt
          text: "把他请出来吧。只要孩子能好，我愿拿最好的一对牛作保。"
        - id: ch01-b31
          speaker: narrator
          text: "金停在寺院雕花的外门前。一个身穿白衣、来自阿杰梅尔的奥斯瓦尔钱庄老板，刚洗清了放高利贷的罪孽，便来问他有什么事。"
        - id: ch01-b32
          speaker: kim
          text: "我是勃提亚尔德舒喇嘛的弟子。圣人就在里面，是他叫我来的。我在这里等，请替我通报。"
        - id: ch01-b33
          speaker: jatt
          text: "别忘了孩子！圣人啊，圣人的弟子啊，凌驾万界的诸神啊，苦难就坐在门口，求你们垂看！"
        - id: ch01-b34
          speaker: narrator
          text: "这种喊声在贝拿勒斯太常见，路人连头也不回。奥斯瓦尔人把口信带进幽暗的寺院。时间从容地一点点流过去。喇嘛正在小室里睡觉，没有祭司肯叫醒他。直到念珠又在安详的阿罗汉像之间响起咔嗒声，一个见习僧才低声开口。"
        - id: ch01-b35
          speaker: novice
          text: "您的弟子来了。"
        - id: ch01-b36
          speaker: narrator
          text: "老人立刻大步出来，连祷词的结尾都忘了。高大身影才到门口，农夫已经冲上去，把孩子高高举起。"
        - id: ch01-b37
          speaker: jatt
          text: "请看看他，圣人！诸神若肯怜悯，他就能活，他就能活啊！"
          emotion: fearful
        - id: ch01-b38
          speaker: narrator
          text: "农夫从腰带里摸出一枚小银币。"
        - id: ch01-b39
          speaker: lama
          text: "这是怎么回事？"
        - id: ch01-b40
          speaker: narrator
          text: "喇嘛望向金。他的乌尔都语，比当年在扎姆—扎玛大炮下流利多了，可农夫不肯让师徒私下说话。"
        - id: ch01-b41
          speaker: kim
          text: "只是发烧。这孩子还没吃饱。"
        - id: ch01-b42
          speaker: jatt
          text: "他吃什么都恶心，母亲又不在身边。"
        - id: ch01-b43
          speaker: kim
          text: "圣人若准许，也许我能治他。"
        - id: ch01-b44
          speaker: lama
          text: "什么？他们竟把你教成医者了？你在这里等。"
          emotion: surprised
        - id: ch01-b45
          speaker: narrator
          text: "喇嘛挨着农夫，坐在寺院最下一级台阶上。金用眼角留意四周，慢慢打开小槟榔盒。他在学校时曾想过，等自己以少爷身份回来，先把喇嘛戏弄一通，再表明真身。如今那些孩子气的梦都没了。他皱着眉，心不在焉地翻找一瓶瓶药片，偶尔停下来想一想，再含混念句咒语，场面反而更有戏剧意味。盒里有奎宁，也有深褐色的肉锭，多半是牛肉，不过那不关他的事。孩子原本什么都不肯吃，此刻却贪婪地吮起一块肉锭，还说很喜欢那股咸味。"
        - id: ch01-b46
          speaker: kim
          text: "这六块拿好。先赞美诸神，把三块放在牛奶里煮，另外三块用水煮。喝过奶，给他吃这半片白药，再把他裹暖和。等他醒来，让他喝另外三块煮的水，再吃剩下半片。还有一块褐色的药，让他回家路上含着。"
        - id: ch01-b47
          speaker: jatt
          text: "诸神啊，这得有多大的智慧！"
          emotion: surprised
        - id: ch01-b48
          speaker: narrator
          text: "农夫一把抢过药。除去那套特意说给喇嘛听的念白，这已经是金记得的全部疗法。他有一回秋天犯疟疾，别人就是这么治他的。"
        - id: ch01-b49
          speaker: kim
          text: "现在回去吧，明早再来。"
        - id: ch01-b50
          speaker: jatt
          text: "可报酬呢？我的儿子就是我的儿子。如今他要好了，我怎么能回去告诉他母亲，我在路边受了恩，却连一碗凝乳也没有回赠？"
        - id: ch01-b51
          speaker: kim
          text: "贾特人真是个个一样。有个贾特人站在自家粪堆上，看国王的象队从面前经过，就问赶象人，那几头小毛驴卖多少钱。"
        - id: ch01-b52
          speaker: narrator
          text: "农夫放声大笑，又赶紧压低声音向喇嘛赔不是。"
        - id: ch01-b53
          speaker: jatt
          text: "这是家乡的谚语，真把我们说中了。明天我带孩子回来。愿家宅诸神，那些善良的小神，赐福给你们。来，儿子，我们又要壮实了。别吐，小王子，我的心肝大王，千万别吐！明早我们就会成为壮汉，能摔跤，也能舞大棒！"
          emotion: happy
        - id: ch01-b54
          speaker: narrator
          text: "他一路哼哼唱唱、嘟嘟囔囔，渐渐走远。喇嘛转向金，细长的眼睛里满是这位慈爱老人全部的心意。"
        - id: ch01-b55
          speaker: lama
          text: "治好病人能积功德，可先得有学识。世界之友，你做得很有智慧。"
        - id: ch01-b56
          speaker: kim
          text: "是您让我有了智慧，圣人。我的教诲全从您来。我吃了您三年的饭，如今期限已满，学校放我自由了。我回来找您。"
        - id: ch01-b57
          speaker: narrator
          text: "金忘了刚才的小小表演，也忘了圣泽维尔、自己的白人血统和大游戏。他照穆斯林的礼数俯身，在耆那教寺院的尘土里触摸师父的双足。"
        - id: ch01-b58
          speaker: lama
          text: "这就是给我的回报。进来，快进来！一切都好吗？站好，让我看看。对，你已不是孩子，而是个有智慧的成人，还以医者身份行走世间。那个漆黑的夜里，我把你交给带兵器的人，果然没有做错。你还记得我们第一次在扎姆—扎玛大炮下相逢吗？"
          emotion: happy
        - id: ch01-b59
          speaker: kim
          text: "记得。您还记得我第一次去学问之门那天吗？我从马车上跳下来……"
        - id: ch01-b60
          speaker: lama
          text: "当然记得。还有我们在勒克瑙河对岸一起吃糕饼。你替我化缘过许多次，只有那天，是我替你化缘。"
        - id: ch01-b61
          speaker: kim
          text: "那是应当的。当时我是学问之门里的学生，穿着少爷衣裳。圣人，您可别忘了，托您的福，我如今还是个少爷。"
        - id: ch01-b62
          speaker: lama
          text: "不错，还是个很受敬重的少爷。到我的小室来，弟子。"
        - id: ch01-b63
          speaker: kim
          text: "您怎么知道？"
        - id: ch01-b64
          speaker: lama
          text: "最初，是我们在军营遇见的善良祭司写信告诉我。如今他回自己的国家了，我就把钱寄给他的兄弟。可少爷们写的信，我不大读得懂，总要请人解释，所以我另找了一个更可靠的办法。每次探寻结束，我都会回到这座寺院，这里一直像我的巢。每当我回来，总有个列城来的人也在这里寻找觉悟。他说自己从前信印度教，后来厌倦了那么一大群神。"
        - id: ch01-b65
          speaker: kim
          text: "是个胖子？"
        - id: ch01-b66
          speaker: lama
          text: "很胖。我不久便看出，他脑子里全是没用的东西。魔鬼、符咒、寺院喝茶的规矩、接纳见习僧的办法，他什么都问。不过他是你的朋友。他说你做文书很有前途，将来会有极大的荣耀。现在我又亲眼看见，你还是医者。"
        - id: ch01-b67
          speaker: kim
          text: "不错。做少爷的时候，我是文书。回到您身边做弟子，那些事就先放下。少爷该过的年限，我已经过完了。"
        - id: ch01-b68
          speaker: lama
          text: "就像见习僧期满？学校真的放你自由了？我可不愿你还没成熟就离开。"
        - id: ch01-b69
          speaker: kim
          text: "我完全自由了。时候一到，我会进政府做文书。"
        - id: ch01-b70
          speaker: lama
          text: "不是去做武士，那很好。"
        - id: ch01-b71
          speaker: kim
          text: "眼下我先回来陪您云游，所以我来了。这些日子，是谁替您化缘？"
        - id: ch01-b72
          speaker: narrator
          text: "金赶紧换了话题，他知道脚下这层冰很薄。"
        - id: ch01-b73
          speaker: lama
          text: "常常是我自己。我很少留在这里，除非回来看看弟子。我用双脚走，也坐火——车，从印度这一头走到那一头。这个国土多么辽阔，又多么奇妙。每次回来，却都像回到我自己的勃提亚尔。"
        - id: ch01-b74
          speaker: narrator
          text: "他心满意足地环顾那间干净的小室。地上放着一个矮坐垫，他盘腿坐好，姿态像刚从冥想里醒来的菩萨。面前是一张不到二十英寸高的黑柚木桌，上面摆着几只铜茶杯。角落里立着一座同样由厚重雕花柚木做成的小祭坛，供着一尊鎏金铜坐佛。坐佛前面，灯、香座和一对铜花瓶摆得整整齐齐。"
        - id: ch01-b75
          speaker: lama
          text: "这些东西是一年前奇迹之屋的神像守护者送我的，他也积下了功德。人离故土太远，旧物能唤回记忆。世尊为我们指出大道，我们理当敬奉他。你再看这个。"
        - id: ch01-b76
          speaker: narrator
          text: "他指着一座彩米堆成的奇异小丘，顶上冠着形状奇幻的金属饰物。"
        - id: ch01-b77
          speaker: lama
          text: "从前我在故乡做住持，还没有如今这番认识，每天都供奉它。这是把宇宙献给世尊的供物。我们勃提亚尔人，就是这样每天把整个世界献给妙法。如今我仍旧照做，虽然我明白，那位至善者早已超越一切捏塑和摆布。"
        - id: ch01-b78
          speaker: narrator
          text: "他说完，从葫芦里吸了一撮鼻烟。"
        - id: ch01-b79
          speaker: kim
          text: "做得很好，圣人。"
        - id: ch01-b80
          speaker: narrator
          text: "金舒舒服服陷进坐垫，满心快活，也有些疲倦。"
        - id: ch01-b81
          speaker: lama
          text: "还有，我会画生命之轮，一幅要画三天。他们来报你到了时，我正在画，也可能只是稍稍合了眼。你来得真好。这门技艺，我一定要给你看。不是为了炫耀，是因为你必须学。少爷们并没有掌握世上一切智慧。"
        - id: ch01-b82
          speaker: narrator
          text: "他从桌下取出一张散发奇异香气的中国黄纸，又拿出画笔和墨锭。纸上用最洁净、最严峻的线条，画出一个六辐大轮。轮心纠缠着猪、蛇和鸽，象征无明、嗔怒和贪欲。轮中一处处格子，容纳了所有天堂、地狱和人生可能遭逢的命运。传说菩萨最初用米粒在尘土上摆出这幅图，为弟子解释万事的因由。历经许多时代，它凝成一套精妙无比的定式，挤满数百个小人物，每一根线都有含义。世上能阐释这幅图画寓言的人很少，能不看样本准确画出的不到二十个，既能画又能讲的，只有三个。"
        - id: ch01-b83
          speaker: kim
          text: "我学过一点画画，可这个真是奇迹中的奇迹。"
        - id: ch01-b84
          speaker: lama
          text: "我画它许多年了。从前，从点亮一盏灯到再点下一盏灯，我就能画完。等你准备好了，我会教你，也会把轮中的含义讲给你听。"
        - id: ch01-b85
          speaker: kim
          text: "那么，我们要上路了？"
        - id: ch01-b86
          speaker: lama
          text: "上路，继续我们的探寻。我一直在等你。上百个梦都告诉我，没有你，我永远找不到圣河。最清楚的那个梦，就在学问之门第一次把你关住的那晚降临。我一次又一次推开这个念头，怕它只是幻象。所以我们在勒克瑙吃糕饼那天，我没有带你走。我得等时机成熟，征兆吉祥。从山岭到大海，再从大海回到山岭，我处处走遍，却什么也没找到。后来，我想起了那则《本生经》。"
        - id: ch01-b87
          speaker: narrator
          text: "他把脚戴铁环的大象的故事讲给金听，就像过去多次讲给耆那教祭司听。"
        - id: ch01-b88
          speaker: lama
          text: "不必再找别的明证。你被送来帮助我。失去这份帮助，我的探寻便没有结果。所以我们要再次一同出发。这一次，探寻一定会成功。"
          emotion: calm
        - id: ch01-b89
          speaker: kim
          text: "我们去哪里？"
        - id: ch01-b90
          speaker: lama
          text: "去哪里又有什么要紧，世界之友？只要有必要，圣河会从我们脚下涌出来。我送你进学问之门，把智慧的宝石交给你，因此积了功德。如今你回来，我又亲眼看见，你成了医者释迦牟尼的追随者，在勃提亚尔，他有许多祭坛。这就够了。我们又在一起，一切恢复了从前的模样。世界之友，星辰之友，我的弟子！"
          emotion: happy
        - id: ch01-b91
          speaker: narrator
          text: "接着，他们谈起尘世间的事。值得留意的是，喇嘛从没追问金在圣泽维尔过着怎样的生活，对少爷们的种种习俗也毫不好奇。他的心全留在过去，一步一步重温两人第一次结伴远行的奇妙旅程。他不住搓着手，低声发笑，直到把自己说得高兴起来。随后他蜷起身子，忽然落进老人说来就来的睡眠。"
        - id: ch01-b92
          speaker: narrator
          text: "金看着最后一缕蒙尘的阳光从院子里慢慢退去，一面摆弄降魔匕首和念珠。贝拿勒斯是世上最古老的城市，诸神还没有苏醒时，它已经醒着。城里的喧声昼夜不停，一阵阵撞着墙，像海浪轰鸣着扑上防波堤。偶尔有耆那教祭司带着一点供品穿过院子，走路时还要用扫帚扫净前方，免得无意间踩伤任何生灵。一盏灯先亮起来，随后又响起祷告声。金继续望着夜空。闷热黏滞的静夜里，星星一颗接一颗升起，他也一直看着，直到自己在祭坛脚下睡去。那一夜，他的梦里只有印度斯坦语，连一个英语词也没有。"
        - id: ch01-b93
          speaker: kim
          text: "圣人，还有那个服过药的孩子。天一亮，贾特人就会回来。"
        - id: ch01-b94
          speaker: narrator
          text: "凌晨三点左右，喇嘛也从梦中醒来，正要出门朝圣。"
        - id: ch01-b95
          speaker: lama
          text: "你提醒得好。我一时心急，差点做错事。老人果然和孩子一样，一旦想做什么，就非得立刻做到，不然便烦恼哭泣。我走在大路上，常常只因为牛车挡住路，或有尘土扬起来，就恨不得跺脚。很久以前，我还强壮时，并不这样。可不管怎样，这都是错。"
          emotion: sad
        - id: ch01-b96
          speaker: narrator
          text: "喇嘛坐回垫子，又拨起念珠。"
        - id: ch01-b97
          speaker: kim
          text: "可您确实老了，圣人。"
        - id: ch01-b98
          speaker: lama
          text: "一件事只要做下，一个因就投入了世间。不论老幼、病健，也不论明白还是糊涂，谁能勒住那个因结出的果？孩子去拨，醉汉去拨，轮就会停下吗？弟子，这是个广大又可怕的世界。"
        - id: ch01-b99
          speaker: kim
          text: "我倒觉得它很好。有什么吃的吗？我从昨天起就没吃过东西。"
        - id: ch01-b100
          speaker: lama
          text: "我竟忘了你的需要。那边有上好的勃提亚尔茶，还有冷饭。"
        - id: ch01-b101
          speaker: narrator
          text: "金身上那一半欧洲人血统，此刻只想吃肉，可耆那教寺院偏偏没有。他没马上拿化缘钵出门，只拿一块块冷饭填肚子，一直熬到天亮。农夫来了，激动得话也说不利索。"
        - id: ch01-b102
          speaker: jatt
          text: "夜里烧退了，还发了汗！摸摸这里，这身皮又清爽又新鲜！他很喜欢那种咸药锭，牛奶也喝得又多又香。"
          emotion: happy
        - id: ch01-b103
          speaker: narrator
          text: "他掀开孩子脸上的布。孩子睡意蒙眬地朝金笑。寺门边聚起一小群耆那教祭司，人人沉默，却什么都看见了。他们知道，金也知道他们知道，老喇嘛怎样同弟子重逢。昨夜，他们没有用身影、话语或手势打扰师徒。太阳升起时，金也回报了这份体贴。"
        - id: ch01-b104
          speaker: kim
          text: "兄弟，要谢就谢耆那教的诸神。烧确实退了。"
        - id: ch01-b105
          speaker: lama
          text: "你们看，世上可曾有过这样的弟子？他追随的是医者世尊。"
          emotion: happy
        - id: ch01-b106
          speaker: narrator
          text: "耆那教正式承认印度教的一切神祇，也承认林伽和蛇神。他们佩戴婆罗门圣线，遵守印度教种姓律法的每一项主张。可他们了解也爱戴喇嘛。他是老人，是大道的探寻者，也是他们的客人，还常在深夜同大祭司长谈。那位大祭司是个自由思考的玄学家，能把一根头发劈成七十份。所以众人低声表示赞同。"
        - id: ch01-b107
          speaker: kim
          text: "记住，这病也许还会再犯。"
        - id: ch01-b108
          speaker: jatt
          text: "只要你有合适的咒语，它就不会再来。"
        - id: ch01-b109
          speaker: kim
          text: "可我们过一会儿就要走了。"
        - id: ch01-b110
          speaker: lama
          text: "不错。我们现在一同出发，继续我常对你们说的探寻。我一直等弟子长大。看，他已经来了！我们往北走。善心的人们，我再不会回到这处安歇之地了。"
        - id: ch01-b111
          speaker: jatt
          text: "可我不是乞丐。"
        - id: ch01-b112
          speaker: narrator
          text: "农夫抱紧孩子站起来。"
        - id: ch01-b113
          speaker: novice
          text: "安静，别打扰圣人。"
        - id: ch01-b114
          speaker: kim
          text: "走吧，到铁路的大桥下面来找我们。看在旁遮普诸神的份上，带点吃的。咖喱、豆子、油煎饼，还有甜食，甜食一定多带。快去！"
        - id: ch01-b115
          speaker: narrator
          text: "饥饿让金脸色苍白，倒很衬他。他高挑清瘦，沙色长袍垂在身上，一手握念珠，一手做出祝福姿势，忠实地模仿喇嘛。英国人看见，也许会说他像彩绘玻璃上的少年圣徒。其实他只是个正在长身体、饿得发晕的孩子。"
        - id: ch01-b116
          speaker: narrator
          text: "告别仪式又长又郑重，结束三次，又重新开始三次。当初请喇嘛从遥远西藏来到这里安身的探寻者没有参加。他面色如银，无须无发，仍像往常一样独自在神像间冥想。其他人却很有人情味，硬把许多轻便物件塞给老人。有一只槟榔盒，一管精致崭新的铁笔匣，一个食物袋，还有别的小东西。他们一遍遍警告外面的世界多么危险，又预言这场探寻一定会有美满结局。金却比任何时候都孤单。他蹲在台阶上，用圣泽维尔学校的语言暗自咒骂。"
        - id: ch01-b117
          speaker: kim
          text: "这全怪我自己。跟着马哈布，就吃马哈布的饭。跟着勒根先生，就吃他的饭。圣泽维尔每天还有三顿。如今我得自己照顾自己，而且我已经一点也不经饿。现在若有一盘牛肉就好了！结束了吗，圣人？"
        - id: ch01-b118
          speaker: narrator
          text: "喇嘛举起双手，用华美的汉语吟完最后一段祝福。寺门终于关上。"
        - id: ch01-b119
          speaker: lama
          text: "我得靠着你的肩。我想，我们的腿脚都已经僵了。"
        - id: ch01-b120
          speaker: narrator
          text: "一个六英尺高的男人，扶着走过几英里拥挤的街道，并不轻松。金还挂满了旅途包裹，走到铁路桥的阴影下，才真正松了口气。"
        - id: ch01-b121
          speaker: kim
          text: "就在这里吃。"
        - id: ch01-b122
          speaker: narrator
          text: "穿着蓝袍、满脸笑容的农夫已经出现在视野里。他一手提着盛满食物的篮子，另一只胳膊稳稳抱着孩子，隔着很远就朝桥下走来。"
        - id: ch01-b123
          speaker: jatt
          text: "吃吧，圣人们！有米饭、上好的咖喱、刚出锅的阿魏油饼，还有凝乳和糖。我的田野之王，让两位圣人看看，贾朗达尔的贾特人受了恩，懂得怎么回报。我听说耆那教徒不吃别人做的食物，不过说真的，眼睛看不见，种姓也就不存在。"
        - id: ch01-b124
          speaker: narrator
          text: "他说到最后，客气地望向宽阔河面。两人藏在第一孔桥下的浅滩边，寺院里挨饿的祭司看不见。"
        - id: ch01-b125
          speaker: kim
          text: "至于我们，早已超脱了一切种姓。"
        - id: ch01-b126
          speaker: narrator
          text: "金背过身，把食物堆到喇嘛的叶盘里。师徒默不作声，痛快吃饱。直到金舔净小指上最后一点黏甜食物，才发现农夫也收拾了行装。"
        - id: ch01-b127
          speaker: jatt
          text: "若是同路，我就跟你们走。能施奇迹的人不常遇见，孩子身体也还弱。不过，我可不是任人折弯的芦苇。别人总说贾特人好斗，那不对。只要没人惹我们，我们就像自家的水牛一样温顺。"
        - id: ch01-b128
          speaker: narrator
          text: "他拾起自己的拉提长棍。那是一根五英尺长的雄竹，棍身箍着一道又一道打磨发亮的铁环。他单手一挥，让这根沉重的长棍在空中舞了一整圈。"
        - id: ch01-b129
          speaker: kim
          text: "那就一道走。一根好棍，也是一条好道理。"
        - id: ch01-b130
          speaker: narrator
          text: "喇嘛安详地望着上游。沿着河岸看去，一列又一列焚尸河坛升起烟柱。那些烟柱一路排开，在漫长而模糊的远景里渐渐淡去。市政当局虽然颁下种种规章，也管不尽这条大河。丰沛的河水上仍不时漂过一截没有烧完的尸身，随着水流一起起伏。"
        - id: ch01-b131
          speaker: jatt
          text: "若不是你，今天我也许已经抱着孩子去那边了。祭司说贝拿勒斯是圣城，死在这里最好，这话没人怀疑。可我不认识他们的神，他们只会要钱。做完一项敬拜，马上又有个光头赌咒，说不做下一项，前面便不算数。这里洗，那里洗，又要倾倒，又要喝，又要沐浴撒花，可每一样都得付钱。不，我还是回旁遮普。旁遮普最好的地，就在贾朗达尔河间地。"
        - id: ch01-b132
          speaker: lama
          text: "我在寺里说过许多次，只要有必要，圣河会从我们脚下涌出，所以我们往北走。我记得有个宜人的地方，四周全是果树，可以一边散步，一边冥想。那里也凉爽些，风从山岭和积雪上吹来。"
        - id: ch01-b133
          speaker: kim
          text: "那地方叫什么？"
        - id: ch01-b134
          speaker: lama
          text: "我怎么知道？那是在军队从地里冒出来，把你带走以后。我曾住在那里，在一间挨着鸽舍的屋里冥想，只有一个女人总说个没完。"
        - id: ch01-b135
          speaker: kim
          text: "哦呵，是库卢来的那个女人。那地方在萨哈兰普尔附近。"
        - id: ch01-b136
          speaker: jatt
          text: "你师父打算怎么办？为了赎旧日的罪，要一路走去吗？德里还远得很。"
        - id: ch01-b137
          speaker: kim
          text: "不走。我要化缘一张火——车票。"
        - id: ch01-b138
          speaker: narrator
          text: "在印度，没人肯承认自己身上带钱。"
        - id: ch01-b139
          speaker: jatt
          text: "那就看在诸神的份上，坐喷火的车吧。我儿子最好快些回到母亲怀里。政府给我们加了许多赋税，可也给了一样好东西。火——车让朋友相聚，也让忧心的人团圆，真是奇妙。"
        - id: ch01-b140
          speaker: narrator
          text: "两小时后，三人全挤进车厢，在白昼酷热里一路睡去。农夫拿喇嘛一生怎样行走、做过什么，向金问了成千上万个问题，也听到许多稀奇古怪的回答。金只要身在此处，心里就觉得满足。他望着窗外铺展开来的平坦西北大地，也同一车车不断更换的旅伴攀谈。"
        - id: ch01-b141
          speaker: narrator
          text: "即使到了今天，车票和剪票对印度乡民仍像一种黑暗的压迫。他们怎么也想不明白，自己明明花钱买下这张有魔力的纸，陌生人为什么还要在护符上打出一个又一个洞。因此，旅客与欧亚混血检票员之间，总少不了漫长激烈的争执。金参加了两三场，还一本正经地献上意见。他不是为了讲清道理，反而故意把道理搅得更乱，只为在喇嘛和满眼崇拜的农夫面前卖弄智慧。"
        - id: ch01-b142
          speaker: narrator
          text: "到了索姆纳路，命运送来一件真正值得他思量的事。火车将要开动，一个干瘦猥琐的小个子跌进车厢。看他那顶紧扎头巾翘起的角度，金猜他是马拉塔人。他脸上有伤，细棉布上衣撕得厉害，一条腿还缠着绷带。那人说，乡间一辆大车翻倒，险些要了他的命，如今正赶去德里投奔儿子。"
        - id: ch01-b143
          speaker: narrator
          text: "金细细观察。一个人若真像他所说，在地上接连滚过几圈，皮肤上该留下沙石擦痕，可这人的伤全像利刃割成。只凭一辆翻倒的大车，也不能把人吓成这样。他用发抖的手指重新系好颈边的破布，露出一枚俗称提心符的护符。护符本身并不稀奇，一般却不会穿在方股编织的铜线上，银面还带黑珐琅的更少。车厢里除了他，只有农夫和喇嘛。幸好，这还是一节两头封死的旧式车厢。金假装胸口发痒，顺手提起自己的护符。那人一见，整张脸顿时变了，也把自己的护符端端正正摆在胸前。"
        - id: ch01-b144
          speaker: e23
          text: "我急着赶路，赶车的杂种却把车轮卡进冲沟。人受伤不算，还丢了满满一盘塔尔基安。那天我可不是护符之子，一点好运也没有。"
        - id: ch01-b145
          speaker: jatt
          text: "那损失可不小。"
        - id: ch01-b146
          speaker: narrator
          text: "贝拿勒斯的经历让农夫处处多疑，他说完便没了兴趣。"
        - id: ch01-b147
          speaker: kim
          text: "是谁煮的？"
        - id: ch01-b148
          speaker: e23
          text: "一个女人。"
        - id: ch01-b149
          speaker: jatt
          text: "女人谁不会煮塔尔基安？那种蔬菜咖喱很好吃，我知道。"
        - id: ch01-b150
          speaker: e23
          text: "哦，是啊，很好吃。"
        - id: ch01-b151
          speaker: kim
          text: "而且便宜。可种姓怎么办？"
        - id: ch01-b152
          speaker: e23
          text: "人们去——找塔尔基安时，没有种姓之分。你替谁效力？"
        - id: ch01-b153
          speaker: kim
          text: "替这位圣人效力。"
        - id: ch01-b154
          speaker: narrator
          text: "金指了指昏昏欲睡的喇嘛。老人听见那个心爱的称呼，一下醒来。"
        - id: ch01-b155
          speaker: lama
          text: "啊，他是上天派来帮助我的。他叫世界之友，也叫星辰之友。时机成熟以后，他便以医者身份行走世间。他的智慧广大无边。"
        - id: ch01-b156
          speaker: kim
          text: "还是护符之子。"
        - id: ch01-b157
          speaker: narrator
          text: "金压低了声音。农夫赶紧准备烟斗，免得陌生人开口讨烟。"
        - id: ch01-b158
          speaker: e23
          text: "那一个又是谁？"
        - id: ch01-b159
          speaker: narrator
          text: "他紧张地斜眼望向农夫。"
        - id: ch01-b160
          speaker: kim
          text: "他的孩子给我，也就是给我们治好了，所以欠了大恩。贾朗达尔人，坐到窗边去，这里有个病人。"
        - id: ch01-b161
          speaker: jatt
          text: "哼，我可不想跟路上碰见的废物搅在一起。我的耳朵不长，也不是个偷听秘密的女人。"
        - id: ch01-b162
          speaker: narrator
          text: "农夫沉重地挪到远处一角。"
        - id: ch01-b163
          speaker: e23
          text: "你也会治病？我已经陷进十里深的灾祸了！"
        - id: ch01-b164
          speaker: kim
          text: "这人浑身是割伤和瘀伤，我要医治他。我给你孩子治病时，可没人阻拦。"
        - id: ch01-b165
          speaker: jatt
          text: "是我错了。你救过我儿子的命，我欠你的恩。你是创造奇迹的人，这一点我知道。"
        - id: ch01-b166
          speaker: kim
          text: "把伤口给我看。兄弟，我念咒的时候，你赶紧把事情说清楚。"
        - id: ch01-b167
          speaker: narrator
          text: "金俯向那人颈边，心跳几乎堵住喉咙。这才是真正的大游戏。"
        - id: ch01-b168
          speaker: e23
          text: "我从南方来，差事也在那里。我们有个人在路旁被杀了，你听说了吗？我找到了奉命寻找的一封信，便动身离开。我逃出那座城，一直跑到姆霍。我太相信没人知道，甚至连面孔都没换。到了姆霍，一个女人忽然告我，说我在刚刚离开的城里偷过珠宝。我这才明白，对方早已发出追捕。我连夜逃离姆霍，还花钱买通警察。那些警察早收过对方的钱，正准备不问缘由就把我交给南方的仇敌。"
        - id: ch01-b169
          speaker: narrator
          text: "金摇摇头。他当然不知道，E二三的前任曾在南方扮作阿拉伯商人，后来遭人杀害。"
        - id: ch01-b170
          speaker: e23
          text: "我后来在契托尔古城的寺庙里扮成忏悔者，藏了一个星期。那封信始终脱不了手，我只好埋在契托尔的王后石下。那个地方，我们的人全知道。"
        - id: ch01-b171
          speaker: narrator
          text: "金其实不知道。可就算整个世界摆到眼前，他也不会打断这条线索。"
        - id: ch01-b172
          speaker: e23
          text: "你得明白，到了契托尔，四周便都是土王领地。东边的科塔不受女王法律管，再往东还有斋浦尔和瓜廖尔。那些地方不喜欢间谍，更谈不上什么公道。我像一只淋湿的豺狗，到处被人追，好不容易才从班迪奎闯出来。到了那里，我又听说自己刚离开的那座城控告我杀了一个男孩。尸体和证人都已经准备齐全，只等我落网。"
        - id: ch01-b173
          speaker: kim
          text: "政府不能保护你？"
        - id: ch01-b174
          speaker: e23
          text: "干大游戏的人没有保护。死了就是死了，名字从名册上一笔勾掉，仅此而已。班迪奎有我们的人。我想换张脸甩掉追踪，就扮成马拉塔人。到了阿格拉，我本来想折回契托尔取信。我太相信自己已经甩掉他们，所以没打电——报告诉任何人信埋在哪里。我想独占全部功劳。"
        - id: ch01-b175
          speaker: narrator
          text: "金点点头，他很懂这种心情。"
        - id: ch01-b176
          speaker: e23
          text: "可我走在阿格拉街上时，忽然有人冲出来，说我欠他一笔债。他带着许多证人走近，当场就要拖我去法院。南方人真聪明！他一口咬定，我是替他收买棉花的代理人。愿他下地狱受火烧！"
          emotion: angry
        - id: ch01-b177
          speaker: kim
          text: "你真替他做过事？"
        - id: ch01-b178
          speaker: e23
          text: "蠢货！我就是他们为了那封信追捕的人！我逃进屠夫区，又从一个犹太人的屋子里穿过去。那人怕惹出骚乱，转眼又把我推到外面。我只好徒步来到索姆纳路，身上只剩下买一张德里车票的钱。我发着烧躺在沟里时，忽然有人从灌木丛扑出来。他们把我打伤、割伤，从头到脚搜了一遍。那地方甚至能听见火——车！"
          emotion: angry
        - id: ch01-b179
          speaker: kim
          text: "他为什么不当场杀你？"
        - id: ch01-b180
          speaker: e23
          text: "他们没那么蠢。只要律师拿出滴水不漏的杀人案，让我在德里被捕，我这副身体就会交给那个要我的土邦。我会在押送下回去，再被他们慢慢弄死，好给我们其他人做榜样。南方不是我的地盘，我只能兜圈乱跑，像一只瞎了一只眼的山羊。我已经两天没吃东西。你看腿上这块肮脏绷带，他们给我做了记号，到了德里就能凭它认出我。"
          emotion: fearful
        - id: ch01-b181
          speaker: kim
          text: "至少在火——车上，你是安全的。"
        - id: ch01-b182
          speaker: e23
          text: "等你在大游戏里活过一年，再来讲这句话！电线会抢先到德里，把我身上每一道裂口、每一片破布都说清楚。二十个，必要时一百个证人，都会说亲眼看见我杀了孩子。可你一点用也没有！"
          emotion: fearful
        - id: ch01-b183
          speaker: narrator
          text: "金深知本地人陷害仇敌的手段。他毫不怀疑，那桩案子会准备得严密周全，足以要人性命，连一具尸体也绝不会缺。马拉塔人不时因为疼痛而抽动手指。农夫坐在角落里，闷闷地瞪着他们。喇嘛忙着拨动念珠，对这边毫不干预。金则像个真正的医者一样，继续摸索那人的颈侧，在一声又一声咒语之间飞快盘算解救他的办法。"
        - id: ch01-b184
          speaker: e23
          text: "你有没有咒语，能替我换一副模样？不然我死定了。只要让我独处五分钟，十分钟也行。若不是他们追得太紧，我本来可以……"
        - id: ch01-b185
          speaker: jatt
          text: "还没治好吗，创造奇迹的人？你念咒已经念得够久了。"
        - id: ch01-b186
          speaker: kim
          text: "还没有。依我看，他这些伤只有一个疗法。披上拜拉吉的衣裳，静坐三天。"
        - id: ch01-b187
          speaker: narrator
          text: "这是常见的苦行，精神导师常拿它惩罚肥胖商人。"
        - id: ch01-b188
          speaker: jatt
          text: "祭司总想把别人也变成祭司。"
        - id: ch01-b189
          speaker: narrator
          text: "他和大多数极迷信的人一样，总忍不住嘲弄自己的宗教。"
        - id: ch01-b190
          speaker: kim
          text: "那么，你儿子也该做祭司了？他该再吃一点奎宁。"
        - id: ch01-b191
          speaker: jatt
          text: "我们贾特人全是水牛。"
        - id: ch01-b192
          speaker: narrator
          text: "农夫又软了下来。金用指尖蘸一点苦药，抹到孩子毫无防备的小嘴唇上。"
        - id: ch01-b193
          speaker: kim
          text: "除了食物，我什么也没向你要。难道连这一点，你也舍不得？我要救另一个人。王子，你准我救他吗？"
        - id: ch01-b194
          speaker: narrator
          text: "农夫的两只巨掌立刻高高举起，做出哀求的样子。"
        - id: ch01-b195
          speaker: jatt
          text: "不，不！请别这样嘲弄我。"
        - id: ch01-b196
          speaker: kim
          text: "我愿意治这个病人。你从旁帮忙，也能积功德。烟斗钵里的灰是什么颜色？白的，是好兆头。食物里有没有姜黄？"
        - id: ch01-b197
          speaker: jatt
          text: "我……我……"
        - id: ch01-b198
          speaker: kim
          text: "把包袱打开！"
        - id: ch01-b199
          speaker: narrator
          text: "包袱里是乡民随身带的一堆零碎。有布片、江湖药物、集市上买来的廉价玩意儿，还有一包灰色粗糙的阿塔面粉。几卷南方烟草、花哨便宜的烟管和一包咖喱香料，也都裹在一床被子里。金摆出高明巫师的架势，一边慢慢翻找，一边低声念着穆斯林的咒语。"
        - id: ch01-b200
          speaker: kim
          text: "这是我从少爷们那里学来的智慧。星象显示，这个人命里有一股很强的邪气，正折磨着他。我要不要把它赶走？"
        - id: ch01-b201
          speaker: narrator
          text: "金压低声音对喇嘛说。想到勒根的训练，这话并不假。"
        - id: ch01-b202
          speaker: lama
          text: "星辰之友，你做什么都做得好。随你的心意吧。这也是一场医治吗？"
        - id: ch01-b203
          speaker: e23
          text: "快，快些！火车随时会停。"
          emotion: fearful
        - id: ch01-b204
          speaker: kim
          text: "这场医治，是要挡住死亡的影子。"
        - id: ch01-b205
          speaker: narrator
          text: "金把面粉、木炭灰和烟灰混进赤陶烟斗钵里。E二三一声不响地解下头巾，抖开长长的黑发。"
        - id: ch01-b206
          speaker: jatt
          text: "那是我的食物，祭司。"
        - id: ch01-b207
          speaker: kim
          text: "寺院里闯进一头水牛！你竟敢偷看？我不得不当着蠢人的面施展秘术，可你得小心自己的眼睛。是不是已经蒙上一层翳了？我救了孩子，你却这样报答。真不知羞耻！"
          emotion: angry
        - id: ch01-b208
          speaker: narrator
          text: "金神情认真，目光直射过去，吓得农夫往后一缩。"
        - id: ch01-b209
          speaker: kim
          text: "我是该诅咒你，还是该……"
        - id: ch01-b210
          speaker: narrator
          text: "金抓起包袱外面的布，罩住农夫低垂的脑袋。"
        - id: ch01-b211
          speaker: kim
          text: "你哪怕动一个偷看的念头，就连我也救不了你。坐下，别出声！"
        - id: ch01-b212
          speaker: jatt
          text: "我瞎了，也哑了。请别下咒！来，孩子，我们玩躲藏。看在我的份上，千万别从布底下偷看。"
        - id: ch01-b213
          speaker: e23
          text: "我看见希望了。你打算怎么办？"
        - id: ch01-b214
          speaker: kim
          text: "下一步做这个。刀都架到脖子上了，还管什么种姓？我们得把你从头到脚变成黄色的萨杜。脱，快脱！头发垂下来遮住眼睛，我给你撒灰。额头还要画个种姓印记。"
        - id: ch01-b215
          speaker: narrator
          text: "金揪住那件单薄贴身衫。E二三迟疑片刻，西北人不愿袒露身体的习惯仍束缚着他。最后他只留一条腰布站着，实实在在地为性命忙碌。金取出小测绘颜料盒，在灰白额头上画出一道气派的深红印记。"
        - id: ch01-b216
          speaker: e23
          text: "你只是个新手吗？"
        - id: ch01-b217
          speaker: kim
          text: "进大游戏才两天，兄弟。胸口再多抹些灰。"
        - id: ch01-b218
          speaker: e23
          text: "你见过那个医治病珍珠的人吗？"
        - id: ch01-b219
          speaker: narrator
          text: "E二三猛地抖开卷得又长又紧的头巾布，两手快得惊人。他让布绕过腰间，穿来穿去，结成萨杜腰布的复杂样式。"
        - id: ch01-b220
          speaker: kim
          text: "哈，原来你认得他的手法？他做过我一阵老师。腿上也得画横纹。灰能治伤，再抹一层。"
        - id: ch01-b221
          speaker: e23
          text: "从前我是他的骄傲，可你几乎比我更强。诸神真眷顾我们！把那个给我。"
        - id: ch01-b222
          speaker: narrator
          text: "农夫的杂物里有只装鸦片丸的锡盒。E二三一口吞下小半把。"
        - id: ch01-b223
          speaker: e23
          text: "鸦片能顶住饥饿、恐惧和寒冷，还会让眼睛发红。现在我有胆量把游戏玩下去了。只少一把萨杜用的火钳。这些旧衣服怎么办？"
        - id: ch01-b224
          speaker: narrator
          text: "金没有把旧衣扔出窗外。他把那些衣裳仔细卷成一个小团，塞进自己宽松长袍的褶子里。接着，他又拿起一块赭黄颜料，在面粉、灰烬和姜黄打成的底色上，把那人的双腿与胸膛涂出一道又一道宽纹。"
        - id: ch01-b225
          speaker: kim
          text: "上面的血，足够把你送上绞架，兄弟。"
        - id: ch01-b226
          speaker: e23
          text: "也许吧，可别从窗户扔出去。"
        - id: ch01-b227
          speaker: kim
          text: "好了！转过来瞧瞧，贾特人！"
          emotion: happy
        - id: ch01-b228
          speaker: jatt
          text: "诸神保佑！可那个马拉塔人去了哪里？你把他怎么样了？"
          emotion: surprised
        - id: ch01-b229
          speaker: narrator
          text: "蒙头的农夫像水牛钻出芦苇一样探出来。金受过勒根先生训练，E二三更是靠这门本事吃饭，两人的演技自然不差。那个颤抖畏缩的商人已经不见。车厢角落懒散地歪着一个几乎赤裸的萨杜。他浑身抹灰，画满赭黄条纹，长发也蒙着尘，双腿盘在身下。金的褐色念珠挂在他颈上，肩头只搭着不到一码长的破旧印花棉布。鸦片在空腹里发作得极快，他双眼肿胀，射出无礼又充满兽欲的目光。孩子惊得把脸埋进父亲怀里。"
        - id: ch01-b230
          speaker: jatt
          text: "抬起头来，小王子。我们跟巫师一起旅行，可他们不会害你。哦，别哭！昨天才把孩子治好，今天又吓死他，这算什么道理？"
        - id: ch01-b231
          speaker: kim
          text: "这孩子一辈子都会有好运。他亲眼见过一场伟大的医治。我小时候会捏泥人和泥马。"
        - id: ch01-b232
          speaker: child
          text: "我也会捏。西尔·巴纳斯夜里会来，在厨房后面的粪堆边，把它们全变活。"
        - id: ch01-b233
          speaker: kim
          text: "那么你什么也不怕，对不对，王子？"
        - id: ch01-b234
          speaker: child
          text: "我是因为爸爸害怕，才跟着害怕。我感觉他的胳膊在抖。"
        - id: ch01-b235
          speaker: kim
          text: "哦，胆小鸡！"
        - id: ch01-b236
          speaker: narrator
          text: "连羞窘的农夫也笑了。"
        - id: ch01-b237
          speaker: kim
          text: "我已经治好这个可怜商人。他得丢下收入和账簿，在路边静坐三夜，才能压住仇敌的恶意。星辰对他不利。"
        - id: ch01-b238
          speaker: jatt
          text: "放债的人越少越好，我就是这么看。不过不管是不是萨杜，他肩上的那块布总该付钱给我。"
        - id: ch01-b239
          speaker: kim
          text: "是吗？可你肩上的孩子，两天前还已经交给焚尸河坛了。还有最后一件事。我当着你的面施展这道法术，只因为情势太紧急。我不但换掉了这人的外貌，也换掉了他的灵魂。即便这样，贾朗达尔人，只要你碰巧记起今天看到的一切，不管是在村中树下说给老人听，还是在自己家里谈起，或等祭司来给牲口祝福时告诉他，你家的水牛就会染上瘟疫，茅屋顶会起火，粮仓里会生满老鼠。我们诸神的诅咒还会落在你的田地里，让庄稼在你脚前、在犁头经过以后，全都枯死。"
        - id: ch01-b240
          speaker: narrator
          text: "这是金年幼无知时，从塔克萨利门边一个法基尔那里听来的古老诅咒。如今由他郑重地重新说出来，威力一点也没有减。"
        - id: ch01-b241
          speaker: jatt
          text: "停下，圣人！求您慈悲，别再说了！不要诅咒我的家。我什么也没看见，什么也没听见。我是您的牛！"
          emotion: fearful
        - id: ch01-b242
          speaker: narrator
          text: "他伸手去抱金那只正在车厢地板上有节奏敲打的赤脚。"
        - id: ch01-b243
          speaker: kim
          text: "不过，你既然获准相助，让我借了一撮面粉、一点鸦片和几件受法术垂青的东西，诸神也会赐福给你。"
        - id: ch01-b244
          speaker: narrator
          text: "金念了一长篇从勒根先生那里学来的祝词，农夫终于松了口气。喇嘛隔着眼镜凝视金。方才改装时，他还没有这样看过。"
        - id: ch01-b245
          speaker: lama
          text: "星辰之友，你已经得到很大的智慧。千万小心，不要让智慧生出骄傲。眼里守着妙法的人，绝不会把亲眼看见、亲身经历的事情匆忙说出去。"
        - id: ch01-b246
          speaker: jatt
          text: "不会，不会，绝对不会！"
          emotion: fearful
        - id: ch01-b247
          speaker: narrator
          text: "农夫唯恐师父还要在徒弟的话上添几句。E二三的嘴巴已经松弛下来，任自己一点点沉进鸦片的效力。对一个筋疲力尽的亚洲人来说，那东西既是食物，也是烟草，又是药物。就这样，在一片敬畏和深深的误解中，他们随着列车前行，于掌灯时分缓缓驶进德里。"
