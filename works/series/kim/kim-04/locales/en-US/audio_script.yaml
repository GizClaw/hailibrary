  chapters:
    - id: ch01
      title: CHAPTER IV
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Good Luck is no fine lady. She is a cursed, tricky creature, hard to lead and harder to drive. Greet her, and she calls to someone else. Meet her, and she is already leaving. Ignore the sharp-tongued shrew, and she comes tugging at your sleeve. Give freely, Fortune, or hold back if you choose. If I care nothing for Fortune, Fortune must follow me still.
        - id: ch01-b02
          speaker: narrator
          text: The old soldier and his son lowered their voices and talked together. Kim settled under a tree, but the lama pulled impatiently at his elbow.
        - id: ch01-b03
          speaker: lama
          text: Come. We must keep going. The River is not here.
        - id: ch01-b04
          speaker: kim
          text: Hai mai! Haven't we walked far enough to rest a little? Our River won't run away. Wait, and that man will give us something.
        - id: ch01-b05
          speaker: old_soldier
          text: This boy is the Friend of the Stars. Yesterday he brought me the news. He saw the great man himself in a vision, giving the orders for war.
        - id: ch01-b06
          speaker: soldier_son
          text: Hm! He heard a rumor in the bazaar and found a way to profit from it.
        - id: ch01-b07
          speaker: narrator
          text: The old soldier laughed.
        - id: ch01-b08
          speaker: old_soldier
          text: At least he did not ride here begging me for a new charger and the gods know how many rupees. Are your brothers' regiments under orders too?
        - id: ch01-b09
          speaker: soldier_son
          text: I don't know. I took leave and came straight to you, in case—
        - id: ch01-b10
          speaker: old_soldier
          text: In case they reached me first to beg! Every one of you is a gambler and a spendthrift. Still, you have never ridden in a charge. You will truly need a good horse, and a good follower with a good pony for the march. Let me think.
        - id: ch01-b11
          speaker: narrator
          text: He drummed his fingers on the saddle.
        - id: ch01-b12
          speaker: soldier_son
          text: This is no place to settle the cost, Father. Come home.
        - id: ch01-b13
          speaker: old_soldier
          text: Then pay the boy. I have no small coins, and his news brought good luck. Ho, Friend of all the World! War is coming, just as you said.
        - id: ch01-b14
          speaker: kim
          text: Not just any war. The war. I know it.
        - id: ch01-b15
          speaker: narrator
          text: The lama fingered his beads, eager to be moving.
        - id: ch01-b16
          speaker: lama
          text: Eh?
        - id: ch01-b17
          speaker: kim
          text: My master does not consult the Stars for money. We brought the news. Remember that. Now we are leaving.
        - id: ch01-b18
          speaker: narrator
          text: Kim curved one hand at his side. The son tossed a silver coin through the sunlight and muttered about beggars and jugglers. It was worth four annas, enough to feed Kim and the lama well for days. At the flash of silver, the lama murmured a blessing.
        - id: ch01-b19
          speaker: old_soldier
          text: Go well, Friend of all the World. For once in my life, I have met a true prophet who was not in the Army.
        - id: ch01-b20
          speaker: narrator
          text: The old soldier wheeled his skinny horse. Father and son turned together, and the old man sat as straight as the younger one.
        - id: ch01-b21
          speaker: narrator
          text: A Punjabi constable in yellow linen trousers wandered across the road. He had seen the coin change hands.
        - id: ch01-b22
          speaker: constable
          text: Halt! Do you not know there is a tax of two annas for each person who enters the main road from this side road? That makes four annas. It is the government's order, and the money pays for trees and beautiful roads.
        - id: ch01-b23
          speaker: kim
          text: And for policemen's bellies! Think, mud-head. Do you imagine we came out of the nearest pond like your father-in-law the frog? Have you heard what your brother once did?
        - id: ch01-b24
          speaker: senior_constable
          text: And who was this brother? Leave the boy alone.
        - id: ch01-b25
          speaker: narrator
          text: A senior constable squatted on the veranda to smoke his pipe, delighted by the exchange.
        - id: ch01-b26
          speaker: kim
          text: He took a label from a soda-water bottle, stuck it on a bridge, and collected taxes there for a month. He told everyone it was the government's order. Then an Englishman came along and broke his head. Brother, I am a town crow, not a village crow!
        - id: ch01-b27
          speaker: narrator
          text: The constable drew back in embarrassment. Kim hooted at him all the way down the road.
        - id: ch01-b28
          speaker: kim
          text: Was there ever a disciple like me? Everyone within ten miles of Lahore would have picked your bones if I had not protected you.
          emotion: happy
        - id: ch01-b29
          speaker: lama
          text: Sometimes I wonder whether you are a spirit. At other times, I think you may be a little demon.
        - id: ch01-b30
          speaker: narrator
          text: The lama smiled slowly.
        - id: ch01-b31
          speaker: kim
          text: I am your chela.
        - id: ch01-b32
          speaker: narrator
          text: Kim fell into step beside him, using the tireless stride of long-distance travelers everywhere.
        - id: ch01-b33
          speaker: lama
          text: Now we will walk.
        - id: ch01-b34
          speaker: narrator
          text: The lama's rosary clicked as they went on in silence, mile after mile. As usual, he was lost in meditation. Kim's bright eyes stayed wide open. This broad, smiling river of life seemed far better to him than the tight, crowded streets of Lahore. Every step brought new people and new sights. Some castes he knew, and some he had never met before.
        - id: ch01-b35
          speaker: narrator
          text: A band of long-haired Sansis hurried by with a strong smell about them. They carried baskets of lizards and other food that higher castes would not touch, while lean dogs sniffed close behind their heels. The Sansis kept to their own edge of the road in a quick, secretive jog. Every other caste left a wide space around them, because people believed even coming near them brought deep pollution.
        - id: ch01-b36
          speaker: narrator
          text: Behind them came a man newly released from jail. He walked with his legs spread wide and stiff, as if the irons were still on him. His full belly and shining skin showed that the government fed prisoners better than many honest men could feed themselves. Kim knew that walk and joked loudly as the man passed.
        - id: ch01-b37
          speaker: narrator
          text: Next came an Akali, a wild-eyed Sikh holy man with wild hair and the blue-checked clothing of his faith. Polished steel rings shone on his tall blue turban. He was returning from one of the independent Sikh states, where he had sung of the old glory of the Khalsa to college-trained princes wearing riding boots and white breeches. Kim took care not to annoy him. An Akali had a quick temper and a quicker arm.
        - id: ch01-b38
          speaker: narrator
          text: Whole villages in bright festival clothes passed them on the way to a local fair. Women walked behind the men with babies on their hips. Older boys pranced along on sticks of sugarcane. Some pulled rough brass toy engines that had cost half a penny, while others flashed sunlight from cheap mirrors straight into their elders' eyes. You could tell at once what everyone had bought. If there was any doubt, you only had to watch the wives hold their brown arms side by side and compare new bracelets of dull glass from the northwest.
        - id: ch01-b39
          speaker: narrator
          text: The merry crowds moved slowly. They called to one another, bargained with sweet sellers, and prayed at roadside shrines, Hindu or Muslim, that poor people of both faiths used without quarrel. Then a solid line of blue would rise and dip through the trembling dust like the back of a hurrying caterpillar. Quick voices cackled as it swept past. These were the changar women, who had taken charge of carrying earth for all the northern railways. Flat-footed, broad-bodied, and strong-limbed, they hurried north as soon as they heard of work and wasted no time on the road. Their men counted for little in their caste. The women strode in blue skirts with elbows square, hips swinging, and heads held high, as suited people accustomed to heavy loads.
        - id: ch01-b40
          speaker: narrator
          text: A wedding procession might burst onto the Grand Trunk Road with music and shouting. Marigold and jasmine smelled stronger than the dust. Through the haze came the bride's litter, staggering beneath its cloth until it looked like a red and silver blur. The bridegroom's garlanded pony turned aside to steal a mouthful from a passing fodder cart. Kim joined the rapid fire of blessings and rude jokes, wishing the couple a hundred sons and no daughters, as the old saying went.
        - id: ch01-b41
          speaker: narrator
          text: Better still, and worth even more shouting, was a wandering showman with half-trained monkeys or a weak and panting bear. Sometimes a woman tied goats' horns beneath her feet and used them to dance on a slack rope. The strange performances made the horses shy away and brought long, high cries of amazement from the women. Kim always had plenty to shout about.
        - id: ch01-b42
          speaker: narrator
          text: The lama never looked up. He missed the moneylender hurrying to collect cruel interest on a short, high-backed pony. He missed a noisy little troop of deep-voiced soldiers on leave. They still marched in military order, but they were delighted to be rid of their uniform trousers and leg wrappings. They called outrageous remarks to the most respectable women they could see. The lama did not even notice the seller of Ganges water, though Kim had expected him to buy at least one bottle of the precious liquid. The old man watched the ground and walked steadily hour after hour, his soul busy somewhere else.
        - id: ch01-b43
          speaker: narrator
          text: Kim, though, was in perfect joy. Here the Grand Trunk Road ran on a raised bank that protected it from winter floods flowing down from the foothills. Walking there felt like moving through a grand corridor a little above the land, with all India spread on both sides. Wagons loaded with grain and cotton crawled along the country tracks, pulled by team after team of oxen. Their axles began groaning a mile away. The sound crept closer until, with yelling, swearing, and one driver abusing another, the wagons struggled up the steep bank and plunged onto the hard main road.
        - id: ch01-b44
          speaker: narrator
          text: Kim also loved watching little groups in red, blue, pink, white, and saffron leave the road for their villages. They crossed the flat plain by twos and threes, spreading apart and slowly growing small in the distance. He felt the beauty of all these things, though he could not put the feeling into words. Instead, he bought peeled sugarcane and spat the chewed pieces generously along the road. The lama took snuff now and then. At last Kim could bear the silence no longer.
        - id: ch01-b45
          speaker: kim
          text: This southern country is good! The air is good, and the water is good. Isn't it?
        - id: ch01-b46
          speaker: lama
          text: Yet all these people are bound to the Wheel, from one life to another. None of them has been shown the Way.
        - id: ch01-b47
          speaker: narrator
          text: The lama shook himself back into the world around him.
        - id: ch01-b48
          speaker: kim
          text: And we have walked a very long way. We must be near a resting place. Shall we stop there? Look, the sun is going down.
        - id: ch01-b49
          speaker: lama
          text: Who will take us in tonight?
        - id: ch01-b50
          speaker: kim
          text: That doesn't matter. This land is full of good people. Besides, we have money.
        - id: ch01-b51
          speaker: narrator
          text: Kim lowered the last words to a whisper. The crowd thickened as they approached the resting place at the end of their day's walk. Such a place on the Grand Trunk Road needed little to mark it. There was a row of stalls selling the simplest food and tobacco, a stack of firewood, a police station, a well, a horse trough, and a few trees. Beneath those trees lay beaten ground dotted with the black ashes of old fires. Beggars waited there too, and crows. Both were hungry.
        - id: ch01-b52
          speaker: narrator
          text: The setting sun drove broad golden spokes through the lower branches of the mango trees. Hundreds of parakeets and doves came home. Gray-backed Seven Sisters seemed to chatter over the day's adventures as they walked back and forth in twos and threes, almost under the travelers' feet. Shuffling and scratching in the branches showed that the bats were waking and preparing to fly their watch through the night.
        - id: ch01-b53
          speaker: narrator
          text: The fading light seemed to gather itself for one last moment. It painted faces, cartwheels, and ox horns as red as blood. Then night fell. The air changed against the skin, and a low, even blue haze spread over the face of the land like a thin veil. Wood smoke, cattle, and the good scent of wheat cakes baking in the ashes became suddenly sharp and clear. The evening patrol hurried from the police station with important coughs and repeated commands. In the bowl of a roadside carter's hookah, a live coal glowed red. Kim's eye followed the final flicker of sunlight on the little brass tongs beside it.
        - id: ch01-b54
          speaker: narrator
          text: The resting place was like the Kashmir Serai on a smaller scale. Kim plunged into its cheerful Asian confusion. Given enough time, that confusion would somehow bring a simple traveler everything he needed. Kim and the lama needed very little. The lama had no rules about which caste might prepare his meal, so cooked food from the nearest stall would serve them. For the small pleasure of having their own fire, Kim also bought a handful of dried dung cakes and set them burning.
        - id: ch01-b55
          speaker: narrator
          text: Men moved around the little flames, calling for oil, grain, sweets, or tobacco. They pushed against one another while they waited at the well. Beneath their voices came the shrill laughter of women hidden inside stopped carts with closed shutters.
        - id: ch01-b56
          speaker: narrator
          text: Educated men had begun to say that women should travel quickly by train in properly screened compartments, and the new custom was spreading. But many old families still preferred the ways of their ancestors. Old women especially went on pilgrimage near the end of their lives. By then they were withered enough that, in certain circumstances, they did not mind showing their faces. They had spent long years indoors, yet had always kept a hand in a thousand matters beyond the walls. Now they loved the busy road, the gatherings at shrines, and the endless chance to gossip with other old ladies. Their patient families often welcomed the chance to send a strong-tongued, iron-willed grandmother traveling, since pilgrimage pleased the gods.
        - id: ch01-b57
          speaker: narrator
          text: So all over India, in the loneliest places and the most crowded ones, you could find a little band of gray old servants said to be in charge of a lady hidden behind the curtains of an ox cart. The servants were solemn and careful. Whenever a European or an important Indian came near, they wrapped their mistress away behind screens with great ceremony. In the ordinary confusion of a pilgrimage, they did not always take those precautions. The old lady was deeply human, after all, and she lived to watch life passing around her.
        - id: ch01-b58
          speaker: narrator
          text: Kim noticed a richly decorated family cart that had just entered the resting place. Its embroidered canopy rose in two domes like the humps on a camel's back. Eight men escorted it, and two of them carried rusty swords. Common people did not go armed, so the weapons were a sure sign that someone important sat inside. A growing storm of complaints, commands, jokes, and language that Europeans would have called very bad crackled behind the curtains. This was plainly a woman accustomed to command.
        - id: ch01-b59
          speaker: narrator
          text: Kim studied her followers. Half were thin-legged, gray-bearded Ooryas from the south. The rest were northern hillmen in thick coats and felt hats. The two groups never stopped sparring, and their quarrels told him nearly as much as their clothes. The old lady was traveling south to visit a wealthy relation, most likely a son-in-law who had sent an escort to show his respect. The hillmen must be her own people from Kulu or Kangra, while the Ooryas belonged to the household down-country.
        - id: ch01-b60
          speaker: narrator
          text: She could not be taking a daughter to her wedding. If she were, the curtains would be tied shut and no stranger would get near the cart. Kim decided she was a lively, high-spirited lady. With food in one hand and a dung cake in the other, he guided the lama with his shoulder and wondered what profit might come from meeting her. The lama would be no help, but Kim was a dutiful disciple and enjoyed begging for them both.
        - id: ch01-b61
          speaker: narrator
          text: He built his fire as close to the cart as he dared and waited to be ordered away. The tired lama sank to the ground like a heavy fruit bat folding itself up, then returned to his rosary.
        - id: ch01-b62
          speaker: hillman
          text: Move farther away, beggar!
        - id: ch01-b63
          speaker: kim
          text: Huh! Only a hillman. Since when have hill donkeys owned all Hindustan?
        - id: ch01-b64
          speaker: narrator
          text: The hillman answered with a brilliant insult to Kim's family through three generations.
        - id: ch01-b65
          speaker: kim
          text: Ah! In my country, we call that the beginning of a love song.
        - id: ch01-b66
          speaker: narrator
          text: A harsh, thin laugh sounded behind the curtains. Encouraged, the hillman tried a second insult.
        - id: ch01-b67
          speaker: kim
          text: Not bad. Not bad at all. But be careful, brother. We may decide to send a curse back, and our curses know how to bite.
        - id: ch01-b68
          speaker: narrator
          text: The Ooryas laughed. The hillman sprang toward Kim, threatening him. Then the lama lifted his head, and the fire shone fully on his huge round cap.
        - id: ch01-b69
          speaker: lama
          text: What is happening?
        - id: ch01-b70
          speaker: narrator
          text: The hillman stopped as if he had turned to stone.
        - id: ch01-b71
          speaker: hillman
          text: I—I have been saved from a terrible sin.
        - id: ch01-b72
          speaker: oorya
          text: The foreign boy has finally found himself a priest.
        - id: ch01-b73
          speaker: old_lady
          text: Hai! Why has no one beaten that beggar brat?
        - id: ch01-b74
          speaker: narrator
          text: The hillman went back to whisper through the curtain. Silence followed, then a low muttering. Kim pretended to notice nothing and thought the game was going well.
        - id: ch01-b75
          speaker: hillman
          text: When the Holy One has eaten, someone requests the honor of speaking with him.
        - id: ch01-b76
          speaker: kim
          text: After he eats, he will sleep. Now I must go and find his food.
        - id: ch01-b77
          speaker: narrator
          text: Kim did not know what turn the game had taken, but he meant to profit from it. He spoke the last words loudly and ended with a faint, hungry sigh.
        - id: ch01-b78
          speaker: hillman
          text: If you permit it, my people and I will see to the food ourselves.
        - id: ch01-b79
          speaker: kim
          text: You have permission. Holy One, these people will feed us.
        - id: ch01-b80
          speaker: lama
          text: This is a good land. All the South is good. It is a vast and terrible world.
        - id: ch01-b81
          speaker: narrator
          text: The lama mumbled drowsily.
        - id: ch01-b82
          speaker: kim
          text: Let him sleep, but have plenty of food ready when he wakes. He is a very holy man.
        - id: ch01-b83
          speaker: narrator
          text: One of the Ooryas made another scornful remark.
        - id: ch01-b84
          speaker: kim
          text: He is no common holy beggar from the plains. He is the holiest of holy men, above every caste. I am his chela.
        - id: ch01-b85
          speaker: old_lady
          text: Come here!
        - id: ch01-b86
          speaker: narrator
          text: Kim went to the cart, knowing that hidden eyes were watching him. One thin brown finger, heavy with rings, rested on its edge.
        - id: ch01-b87
          speaker: old_lady
          text: Who is that man?
        - id: ch01-b88
          speaker: kim
          text: A very holy man from far away. He comes from Tibet, beyond the snow, from a place far beyond this one. He understands the stars, casts horoscopes, and reads people's fortunes at birth. But he takes no money. He does it from kindness and charity. I am his disciple, and people also call me the Friend of the Stars.
        - id: ch01-b89
          speaker: old_lady
          text: You are no hill boy.
        - id: ch01-b90
          speaker: kim
          text: Ask him. He will tell you the Stars sent me to guide him to the end of his pilgrimage.
        - id: ch01-b91
          speaker: old_lady
          text: Humph! Remember, brat, I am old, but I am not a complete fool. I know lamas and honor them. You are no more a true chela than my finger is the pole of this cart. You are a shameless, casteless Hindu beggar, following the Holy One for profit.
        - id: ch01-b92
          speaker: kim
          text: Don't we all work for profit? I did hear something once—
        - id: ch01-b93
          speaker: old_lady
          text: What did you hear?
        - id: ch01-b94
          speaker: kim
          text: I hardly remember. It was only bazaar talk and surely a lie. People said that even rajahs, small hill rajahs—
        - id: ch01-b95
          speaker: old_lady
          text: Who are still of good Rajput blood.
        - id: ch01-b96
          speaker: kim
          text: Of the best blood, certainly. People said that even they sell their prettier women for money, down south to landowners all across Oudh.
        - id: ch01-b97
          speaker: narrator
          text: Small hill rajahs denied that charge more fiercely than anything else, though the bazaars believed it whenever people whispered about India's hidden slave trade. In a tight, furious whisper, the old lady explained exactly what kind of wicked liar Kim was. Had he said such a thing when she was young, an elephant would have crushed him before the evening ended. That much was true.
        - id: ch01-b98
          speaker: kim
          text: Ahai! I am only a beggar's brat, just as the Eye of Beauty says.
        - id: ch01-b99
          speaker: narrator
          text: He wailed in enormous pretend terror.
        - id: ch01-b100
          speaker: old_lady
          text: Eye of Beauty! Who am I, that you throw a beggar's sweet names at me? Forty years ago, that name might have been true. Even thirty years ago. But when a king's widow must wander all over India, she has to mix with every sort of scum and let beggars mock her.
        - id: ch01-b101
          speaker: narrator
          text: Still, she laughed at the name she had not heard for so long.
        - id: ch01-b102
          speaker: kim
          text: Great Queen, I am exactly what you say I am. But my master is holy all the same. He has not yet heard your order that—
        - id: ch01-b103
          speaker: old_lady
          text: An order? Would I order a Holy One, a Teacher of the Law, to speak with a woman? Never!
        - id: ch01-b104
          speaker: kim
          text: Forgive my stupidity. I thought it was an order.
        - id: ch01-b105
          speaker: old_lady
          text: It was a request. Is that clear now?
        - id: ch01-b106
          speaker: narrator
          text: A silver coin clicked against the edge of the cart. Kim took it and bowed deeply. The old lady understood that the lama depended on the boy's eyes and ears, so the boy must be kept pleased.
        - id: ch01-b107
          speaker: kim
          text: I am only the Holy One's disciple. Perhaps he will come after he has eaten.
        - id: ch01-b108
          speaker: old_lady
          text: You shameless little villain!
        - id: ch01-b109
          speaker: narrator
          text: Her jeweled finger shook at him, but Kim heard her chuckling.
        - id: ch01-b110
          speaker: kim
          text: No, tell me. Does your family need a son? Speak freely. We priests understand these matters—
        - id: ch01-b111
          speaker: narrator
          text: Kim used the soft, secret voice that few people could resist. He had stolen the last phrase from a holy beggar near the Taksali Gate.
        - id: ch01-b112
          speaker: old_lady
          text: We priests! You are not even old enough to— No, listen. Sometimes we women think about things besides sons. Besides, my daughter has already borne a boy.
        - id: ch01-b113
          speaker: narrator
          text: Another laugh swallowed the end of her joke.
        - id: ch01-b114
          speaker: kim
          text: Two arrows in the quiver are better than one, and three are better still.
        - id: ch01-b115
          speaker: narrator
          text: Kim coughed thoughtfully and looked with great care at the ground.
        - id: ch01-b116
          speaker: old_lady
          text: True, very true. Perhaps another will come. Those priests from the plains were useless. I sent them gifts, money, and still more gifts. Then they made prophecies.
        - id: ch01-b117
          speaker: kim
          text: Ah. They made prophecies.
        - id: ch01-b118
          speaker: narrator
          text: Kim drew the words out with perfect contempt. A professional priest could not have done better.
        - id: ch01-b119
          speaker: old_lady
          text: My prayers were not answered until I remembered my own gods. At the proper hour, I asked the Abbot of the Lung-Cho monastery for help. Perhaps your Holy One knows him. In time, everything happened just as I wished. The Brahmin in my daughter's father-in-law's house now claims his prayers did it. I will correct that little mistake when I arrive. Afterward, I am going to Buddh Gaya to honor the father of my children.
        - id: ch01-b120
          speaker: kim
          text: We are going there too.
        - id: ch01-b121
          speaker: old_lady
          text: Twice the good fortune! Then surely there will be a second son.
          emotion: happy
        - id: ch01-b122
          speaker: lama
          text: Friend of all the World!
        - id: ch01-b123
          speaker: narrator
          text: The lama had woken like a child confused in a strange bed, and he called for Kim.
        - id: ch01-b124
          speaker: kim
          text: I am coming, Holy One!
        - id: ch01-b125
          speaker: narrator
          text: Kim ran back to the fire. Dishes of food already surrounded the lama. The hillmen gazed at him in worship, while the southern servants looked sour.
        - id: ch01-b126
          speaker: kim
          text: Go away! Give us room! Do you think we eat in public like dogs?
        - id: ch01-b127
          speaker: narrator
          text: Kim and the lama finished their meal in silence, each turned a little away from the other. Then Kim lit a locally made cigarette.
        - id: ch01-b128
          speaker: kim
          text: Haven't I told you again and again that the South is a good country? A noble and virtuous widow of a hill rajah is traveling to Buddh Gaya. She sent us all this food. When you are rested, she hopes to speak with you.
        - id: ch01-b129
          speaker: lama
          text: Did you arrange this too?
        - id: ch01-b130
          speaker: narrator
          text: The lama dipped deep into his snuff gourd.
        - id: ch01-b131
          speaker: kim
          text: Who else has looked after you since our wonderful journey began? Have I ever failed to see that you are comfortable?
        - id: ch01-b132
          speaker: narrator
          text: Kim's eyes danced as he blew the harsh smoke through his nostrils and stretched out on the dusty ground.
        - id: ch01-b133
          speaker: lama
          text: Blessings upon you. I have known many people in my long life and had more than a few disciples. Yet my heart has never gone out to anyone as it does to you, if you were indeed born of a woman. You are thoughtful, wise, and courteous, with just a little of the imp in you.
        - id: ch01-b134
          speaker: narrator
          text: The lama bowed his solemn head.
        - id: ch01-b135
          speaker: kim
          text: And I have never met a priest like you. We have traveled together for less than three days, but it feels like a hundred years.
        - id: ch01-b136
          speaker: narrator
          text: Kim studied every wrinkle in the lama's kind yellow face.
        - id: ch01-b137
          speaker: lama
          text: Perhaps I served you in an earlier life. Maybe I freed you from a trap. Or perhaps, before I understood the Way, I caught you on a hook and then threw you back into the river.
        - id: ch01-b138
          speaker: narrator
          text: The lama smiled.
        - id: ch01-b139
          speaker: kim
          text: Maybe. Now, about the woman in the cart. I think she wants another son for her daughter.
        - id: ch01-b140
          speaker: narrator
          text: Kim had often heard such thoughts from people whom the English would never have called imaginative.
        - id: ch01-b141
          speaker: lama
          text: That has nothing to do with the Way. Still, she comes from the Hills. Ah, the Hills and their snow!
        - id: ch01-b142
          speaker: narrator
          text: The lama rose and went to the cart. Kim would have given his ears to follow, but he had not been invited. He caught only a few words, for the lama and the old lady spoke in a mountain language he did not know. She seemed to ask questions. The lama considered each one before answering, sometimes in the singsong rhythm of a Chinese quotation.
        - id: ch01-b143
          speaker: narrator
          text: Kim watched through half-closed eyes. The lama stood tall and straight. Firelight cut black lines through the deep folds of his yellow robe, like low sunlight striking a knotted tree trunk. Before him, the painted and silvered cart burned like a many-colored jewel in the uncertain light. The patterns on its gold-worked curtains slid up and down as the cloth moved, melting away and forming again in every fold. Whenever the talk grew more serious, one jeweled finger darted through the embroidery and threw off tiny sparks of light.
        - id: ch01-b144
          speaker: narrator
          text: Beyond the cart lay a wall of uncertain darkness. Small fires dotted it, and half-seen bodies, faces, and shadows moved between them. The many voices of early evening had settled into one gentle hum. Its deepest note was the steady chopping sound of oxen chewing their cut straw. Its highest was the tinkle of a Bengali dancing girl's sitar. Most of the men had eaten. They drew deeply on gurgling, grunting hookahs that, at full bubble, sounded like bullfrogs.
        - id: ch01-b145
          speaker: narrator
          text: At last the lama came back. A hillman followed with a padded cotton quilt and spread it beside the fire. Kim thought the old lady deserved ten thousand grandchildren. Even so, none of those gifts would have arrived without him.
        - id: ch01-b146
          speaker: lama
          text: She is a virtuous and wise woman. The world is full of kindness toward those who follow the Way.
        - id: ch01-b147
          speaker: narrator
          text: The lama lowered himself joint by joint like a slow camel, then threw half the quilt over Kim.
        - id: ch01-b148
          speaker: kim
          text: What did she say?
        - id: ch01-b149
          speaker: narrator
          text: Kim rolled himself into his share of the quilt.
        - id: ch01-b150
          speaker: lama
          text: She asked many questions and gave me many problems. Most were foolish tales she heard from priests who serve demons while claiming to follow the Way. I answered some and told her the rest were nonsense. Many people wear the Robe, but few remain on the Way.
        - id: ch01-b151
          speaker: kim
          text: True. That is very true.
        - id: ch01-b152
          speaker: narrator
          text: Kim used the thoughtful, agreeable voice of someone inviting a confidence.
        - id: ch01-b153
          speaker: lama
          text: Still, according to what she knows, her heart is rightly turned. She greatly wants us to travel with her toward Buddh Gaya. Her road follows ours south for many days.
        - id: ch01-b154
          speaker: kim
          text: And then?
        - id: ch01-b155
          speaker: lama
          text: Have patience. I told her my Search must come before everything. She knew many foolish legends, but she had never heard the great truth of my River or the tale of the Arrow. That is what comes of the priests in the lower hills! She knew the Abbot of Lung-Cho, yet knew nothing of my River.
        - id: ch01-b156
          speaker: kim
          text: And then?
        - id: ch01-b157
          speaker: lama
          text: So I told her of the Search, the Way, and other useful matters. She asked only that I travel beside her and pray for a second son.
        - id: ch01-b158
          speaker: kim
          text: Aha! So women never think of anything but children.
        - id: ch01-b159
          speaker: lama
          text: Since our roads run together, I see no reason we should leave our Search by joining her, at least as far as— I have forgotten the town's name.
        - id: ch01-b160
          speaker: kim
          text: Ohe! Where is your master's home?
        - id: ch01-b161
          speaker: narrator
          text: Kim whispered sharply to an Oorya a few yards away.
        - id: ch01-b162
          speaker: oorya
          text: A little beyond Saharunpore, among the fruit gardens.
        - id: ch01-b163
          speaker: narrator
          text: The servant gave the village's name.
        - id: ch01-b164
          speaker: lama
          text: Yes, that was it. We can go with her that far.
        - id: ch01-b165
          speaker: oorya
          text: Flies always find carrion.
        - id: ch01-b166
          speaker: kim
          text: A crow comes to a sick cow, and a Brahmin comes to a sick man.
        - id: ch01-b167
          speaker: narrator
          text: Kim offered the proverb to the dark treetops as if it had nothing to do with anyone nearby. The Oorya grunted and said no more.
        - id: ch01-b168
          speaker: kim
          text: Then we are going with her, Holy One?
        - id: ch01-b169
          speaker: lama
          text: Why should we not? I may still leave the road to test every river we cross. She wishes me to come. She wishes it very strongly.
        - id: ch01-b170
          speaker: narrator
          text: Kim smothered a laugh beneath the quilt. Once that commanding old lady lost her natural awe of a lama, she would be worth hearing.
        - id: ch01-b171
          speaker: lama
          text: The husbands of talkative women receive a great reward in the next world.
        - id: ch01-b172
          speaker: narrator
          text: Kim was almost asleep when the lama suddenly spoke the proverb. He heard the old man take snuff three times, then drifted off laughing.
        - id: ch01-b173
          speaker: narrator
          text: A diamond-bright dawn woke the men, crows, and oxen together. Kim sat up, yawned, shook himself, and thrilled with pleasure. This was truly seeing the world. This was life exactly as he wanted it, full of bustle and shouting. Men buckled their belts. Drivers beat the oxen into motion, wheels creaked, fires caught, and food cooked. Wherever Kim turned his eager eyes, some new sight was waiting.
        - id: ch01-b174
          speaker: narrator
          text: The morning mist spun away in a silver whirl. Parrots shot toward a distant river in screaming green flocks, and every well wheel within hearing began to turn. India was awake. Kim sat in the middle of it, more awake and more excited than anyone. He chewed the end of a twig that he would soon use to clean his teeth. From every people in the country he knew and loved, he borrowed whichever custom suited him, taking as easily with either hand.
        - id: ch01-b175
          speaker: narrator
          text: There was no reason to worry about breakfast or spend even the smallest coin at the crowded stalls. He was the disciple of a holy man whom a strong-willed old lady had taken under her protection. Their food would be prepared, and they would sit down when respectfully invited. Kim giggled as he cleaned his teeth. The old lady would make the road even more entertaining.
        - id: ch01-b176
          speaker: narrator
          text: He inspected her grunting oxen as they came beneath the yokes. If they traveled too fast, which was unlikely, he could ride comfortably on the pole, and the lama could sit by the driver. The escort would walk. The old lady would talk without stopping, and judging by the night before, her talk would have plenty of bite. Already she was commanding, scolding, and cursing her servants for every delay.
        - id: ch01-b177
          speaker: oorya
          text: Give her the pipe! In the name of the gods, give her the pipe and silence that unlucky mouth. She and the parrots both scream at dawn.
        - id: ch01-b178
          speaker: narrator
          text: The Oorya tied up his shapeless bundles of bedding.
        - id: ch01-b179
          speaker: hillman
          text: The lead oxen! Hai, watch the lead oxen! Son of an owl, where are you going?
        - id: ch01-b180
          speaker: narrator
          text: A grain cart had caught the animals' horns with its axle, and they backed and twisted while the hillman shouted at the grinning driver.
        - id: ch01-b181
          speaker: carter
          text: Ai! Yai! Yai! The Queen of Delhi is inside, going to pray for a son. Make room for the Queen of Delhi and her prime minister, that gray monkey climbing his own sword!
        - id: ch01-b182
          speaker: narrator
          text: A second cart, piled with bark for a southern tannery, pressed close behind. Its driver added insults of his own. The curtains shook, and the old lady answered with one burst of abuse. It was brief, but every word struck so sharply that even Kim had never heard its equal.
        - id: ch01-b183
          speaker: narrator
          text: The first carter's bare chest seemed to cave in with amazement. He bowed deeply to the hidden voice, jumped down, and helped the escort drag their boiling volcano onto the main road. As he worked, the voice told him exactly what kind of wife he had married and what she was doing while he was away.
        - id: ch01-b184
          speaker: kim
          text: Oh, well done!
          emotion: happy
        - id: ch01-b185
          speaker: narrator
          text: Kim could not hold the praise back as the carter crept away.
        - id: ch01-b186
          speaker: old_lady
          text: Well done? It is shameful that a poor woman cannot pray to her gods without every piece of rubbish in Hindustan pushing and insulting her. I must swallow abuse as men swallow butter. But my tongue can still move, and I still know the right word for the moment. And I am still waiting for my tobacco! Which one-eyed, unlucky son of shame has failed to prepare my pipe?
        - id: ch01-b187
          speaker: narrator
          text: A hillman pushed the pipe through the curtain at once. Thick smoke curled from both sides of the cart, and peace returned.
        - id: ch01-b188
          speaker: narrator
          text: Kim had walked proudly the day before as the disciple of a holy man. Now he was ten times prouder. He marched in a half-royal procession with an accepted place beneath the protection of an old lady whose manners delighted him and whose resources seemed endless. The escort tied up their heads in the local fashion and fell in beside the cart, kicking up huge clouds of dust.
        - id: ch01-b189
          speaker: narrator
          text: Kim and the lama kept a little to one side. Kim chewed sugarcane and made way for no one below the rank of a priest. The old lady's voice clacked behind them as steadily as a machine pounding rice. She ordered the escort to tell her everything happening on the road. As soon as they left the resting place, she threw back the curtains and peered out with her veil covering only a third of her face. Her men avoided looking straight at her, so proper behavior was more or less preserved.
        - id: ch01-b190
          speaker: narrator
          text: A dark-faced English District Superintendent of Police trotted past on a tired horse, dressed in a perfect uniform. One look at the servants told him what sort of lady rode inside, and he teased her.
        - id: ch01-b191
          speaker: superintendent
          text: Mother, do women behave this way inside their private rooms? What if an Englishman rides by and discovers you have no nose?
        - id: ch01-b192
          speaker: old_lady
          text: What? Your own mother has no nose? Why announce it on the open road?
        - id: ch01-b193
          speaker: narrator
          text: It was a clean answer. The Englishman raised one hand like a swordsman admitting a hit. The old lady laughed and nodded.
        - id: ch01-b194
          speaker: old_lady
          text: Is this a face that could lead a good man away from virtue?
        - id: ch01-b195
          speaker: narrator
          text: She pulled her veil away and stared. Her face was not beautiful. Yet as the officer gathered his reins, he called her a Moon of Paradise, a Disturber of Honesty, and several other grand names. She doubled over laughing.
        - id: ch01-b196
          speaker: old_lady
          text: That one is a rogue. Every constable is a rogue, but senior police officers are the worst. My son, you cannot have learned all this since you came from Europe. Who nursed you?
        - id: ch01-b197
          speaker: superintendent
          text: A hillwoman from Dalhousie, Mother. Keep your beauty in the shade, O Giver of Delights.
        - id: ch01-b198
          speaker: narrator
          text: Then he rode away.
        - id: ch01-b199
          speaker: old_lady
          text: That is the kind of man who should oversee justice. He knows this land and its customs. The others come fresh from Europe, nursed by white women, and learn our languages from books. They are worse than disease. They bring harm to kings.
        - id: ch01-b200
          speaker: narrator
          text: The old lady filled her mouth with pan and spoke like a judge. Then she told the whole road a very long story about an ignorant young policeman. He had interfered with a small hill rajah, her ninth cousin, over a minor land dispute. The tale wound on and on, gathering every complaint she held against officers who knew India only from books. She finished with a quotation from a work that was not at all religious.
        - id: ch01-b201
          speaker: narrator
          text: After that, her mood changed. She sent a servant to ask the lama to walk beside her and discuss religion. Kim dropped back into the dust and returned to his sugarcane. For more than an hour, the lama's round cap floated like a moon through the haze. From the sounds he heard, Kim understood that the old woman was crying.
        - id: ch01-b202
          speaker: oorya
          text: I spoke too rudely last night. I have never known my mistress to be so gentle. It must be the strange priest. I trust Brahmins myself, though everyone knows how clever and greedy they are. But the Brahmins kept demanding gifts from my master's wife's mother. She drove them away so angrily that they cursed our whole party. That is why the second ox on the far side went lame and why the cart pole broke last night. After that, I am ready to accept any other sort of priest in India or beyond it.
        - id: ch01-b203
          speaker: narrator
          text: Kim nodded wisely.
        - id: ch01-b204
          speaker: kim
          text: Notice that my lama accepts no money. Whatever you spend feeding us will come back a hundred times over in the good fortune that follows your caravan.
        - id: ch01-b205
          speaker: narrator
          text: Kim also told stories about Lahore and sang one or two songs that made the escort laugh. He was a city mouse who knew the newest songs by the most fashionable composers, most of them women. That gave him a clear advantage over men from a small fruit-growing village beyond Saharunpore, but he let them discover the advantage for themselves.
        - id: ch01-b206
          speaker: narrator
          text: At noon they left the road to eat. The meal was generous, plentiful, and neatly served on plates made of clean leaves, well away from the drifting dust. They gave every scrap to waiting beggars so that all proper duties were fulfilled. Then the travelers sat down together for a long, comfortable smoke.
        - id: ch01-b207
          speaker: narrator
          text: The old lady had gone behind her curtains, but she joined freely in the talk. Her servants argued with her and contradicted her as servants did throughout the East. She compared the cool air and pine forests of Kangra and Kulu with the southern dust and mango trees. She told a story about old local gods who lived at the edge of her husband's territory. She fiercely criticized the very tobacco she was smoking, abused every Brahmin without exception, and openly considered how many more grandsons might be coming.
