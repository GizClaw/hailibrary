audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts: {delivery: "从容而机敏的讲述", timbre: "温暖清晰", pace: "舒展而有变化", pitch: "中音"}
    kim:
      display_name: 金
      tts: {delivery: "机灵大胆，话里常带笑", timbre: "明亮的少年声", pace: "轻快敏捷", pitch: "中高音"}
    lama:
      display_name: 喇嘛
      tts: {delivery: "慈和虔敬，偶有孩子般的急切", timbre: "苍老柔厚", pace: "缓慢沉思", pitch: "中低音"}
    soldier:
      display_name: 老兵
      tts: {delivery: "豪迈自负，念旧时格外热烈", timbre: "低沉风霜", pace: "稳健有力", pitch: "低音"}
    soldier_son:
      display_name: 老兵的儿子
      tts: {delivery: "火爆威风，见父亲时亲热恭敬", timbre: "强健成熟", pace: "明快", pitch: "中低音"}
    policeman:
      display_name: 警察
      tts: {delivery: "随和中带着官差派头", timbre: "宽厚结实", pace: "平稳", pitch: "中低音"}
    senior_policeman:
      display_name: 老警察
      tts: {delivery: "老练诙谐，爱看同僚出丑", timbre: "沙哑厚实", pace: "从容", pitch: "中低音"}
    hill_servant:
      display_name: 山民随从
      tts: {delivery: "粗直强硬，敬畏圣人", timbre: "粗厚有力", pace: "稍快", pitch: "中低音"}
    oriya_servant:
      display_name: 奥里亚随从
      tts: {delivery: "世故刻薄，爱在一旁嘀咕", timbre: "干瘦低哑", pace: "平稳", pitch: "中音"}
    widow:
      display_name: 山地王公遗孀
      tts: {delivery: "泼辣威严，机锋里带着爽朗", timbre: "尖亮苍老", pace: "明快多变", pitch: "中高音"}
    carter:
      display_name: 车夫
      tts: {delivery: "受了委屈，叫嚷不休", timbre: "粗哑紧绷", pace: "急促", pitch: "中高音"}
    police_chief:
      display_name: 地区警务长
      tts: {delivery: "风趣放松，熟悉本地人情", timbre: "清朗成熟", pace: "轻快", pitch: "中音"}
  chapters:
    - id: ch01
      title: 战争的赏钱
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: "好运从来不是淑女。她刁钻、胆怯，又野得难驯。你迎上去，她偏去招呼别人。你碰见她，她正要离开。可你若由她去，不把她放在心上，她反倒会来扯住你的衣袖。这首《许愿帽》唱的，正是这样的命运。"
        - id: ch01-b02
          speaker: narrator
          text: "老兵和儿子压低声音谈着。金在树下停住脚，喇嘛却不耐烦地扯了扯他的胳膊肘。"
        - id: ch01-b03
          speaker: lama
          text: "我们继续走吧。我要找的河不在这里。"
        - id: ch01-b04
          speaker: kim
          text: "嗨呀，我们走了这么久，还不能歇一会儿？河又不会跑。耐心等着，他会给我们一点布施。"
        - id: ch01-b05
          speaker: soldier
          text: "这孩子就是星辰的朋友。昨天的消息是他带来的。他在异象里亲眼看见那位大人下令开战。"
        - id: ch01-b06
          speaker: soldier_son
          text: "哼，他不过在集市上听到传闻，转手拿来赚几个钱。"
        - id: ch01-b07
          speaker: soldier
          text: "至少他没骑马来找我，开口就要一匹新战马，再添上天知道多少卢比。你那些兄弟的兵团也接到命令了吗？"
        - id: ch01-b08
          speaker: soldier_son
          text: "我不知道。我请假赶来见你，是怕……"
        - id: ch01-b09
          speaker: soldier
          text: "怕他们赶在你前面来讨钱。你们个个都是赌鬼、败家子！不过你还没真正冲锋过。上了战场，确实需要一匹好马。行军还得有个好随从，再备一匹好小马。让我好好想想。"
        - id: ch01-b10
          speaker: narrator
          text: "老人一边说，一边用手指敲着鞍桥。"
        - id: ch01-b11
          speaker: soldier_son
          text: "父亲，这儿不是算账的地方。我们回家再说。"
        - id: ch01-b12
          speaker: soldier
          text: "那也得先给这孩子钱。我身上一个派萨也没有，他带来的又是吉利消息。喂，全世界的朋友，果然让你说中了，战争要来了。"
        - id: ch01-b13
          speaker: kim
          text: "不是让我说中，是我本来就知道。来的正是那场战争。"
        - id: ch01-b14
          speaker: lama
          text: "嗯？"
        - id: ch01-b15
          speaker: narrator
          text: "喇嘛捻着念珠，心里只惦记着上路。"
        - id: ch01-b16
          speaker: kim
          text: "我师父不会为了赏钱去惊动星辰。这个消息是我们带来的，请天地作证，就是我们带来的。现在，我们该走了。"
        - id: ch01-b17
          speaker: narrator
          text: "金在身侧微微弯起一只手。老兵的儿子把一枚银币掷过阳光，嘴里还嘟囔着叫花子和戏法师。那是四安那，够两人好好吃上几天。喇嘛看见银光闪过，低声念了一句祝福。"
        - id: ch01-b18
          speaker: soldier
          text: "走你的路吧，全世界的朋友。我活了这么久，总算见到一个真正的预言家，而且还不是军队里的人。"
        - id: ch01-b19
          speaker: narrator
          text: "老兵拨转那匹瘦骨嶙峋的小马，父子俩一同离开。老人仍坐得笔直，一点也不输给身旁的年轻人。"
        - id: ch01-b20
          speaker: narrator
          text: "一个穿黄麻裤的旁遮普警察懒洋洋地横过道路。他看见刚才递钱的一幕，立刻用很有威势的英语叫住他们。"
        - id: ch01-b21
          speaker: policeman
          text: "站住！从这条岔路进入大路，每人要缴两安那税。你们两个人，正好四安那。这是政府的命令，收来的钱要种树，美化道路。"
        - id: ch01-b22
          speaker: kim
          text: "还要美化警察的肚皮。泥巴脑袋，你先想明白。你以为我们像你岳父家的青蛙，刚从附近池塘里爬出来？你听过你那位兄弟的名声没有？"
        - id: ch01-b23
          speaker: narrator
          text: "金边说边溜到警察够不着的地方。廊下，一个老警察蹲着抽烟，看得十分开心。"
        - id: ch01-b24
          speaker: senior_policeman
          text: "他说的是谁呀？别欺负这孩子。"
        - id: ch01-b25
          speaker: kim
          text: "你那位兄弟从一瓶洋汽水上撕下标签，贴在桥头，硬说是政府命令。他就这样收了整整一个月的过桥税。后来有个英国人来了，把他的脑袋打破。哎呀，兄弟，我可是城里的乌鸦，不是乡下的乌鸦！"
        - id: ch01-b26
          speaker: narrator
          text: "那警察羞得缩了回去。金一路冲他发出嘲弄的叫声，直到走远。"
        - id: ch01-b27
          speaker: kim
          text: "世上还有我这样的弟子吗？若不是我护着你，出了拉合尔十英里，你这一身骨头早让天下人拆光了。"
          emotion: happy
        - id: ch01-b28
          speaker: lama
          text: "有时候我真弄不清，你到底是个精灵，还是个小恶鬼。"
        - id: ch01-b29
          speaker: narrator
          text: "喇嘛慢慢笑了。"
        - id: ch01-b30
          speaker: kim
          text: "我是你的弟子。"
        - id: ch01-b31
          speaker: narrator
          text: "金走到他身边，迈开天下长途跋涉的人共有、却说不清是什么样的步子。"
        - id: ch01-b32
          speaker: lama
          text: "现在走吧。"
    - id: ch02
      title: 大干道上的印度
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: "念珠咔嗒作响，两人一声不响地走过一英里又一英里。喇嘛仍沉在冥想里，金却睁大明亮的眼睛。眼前这条宽阔欢笑的生命之河，比拉合尔拥挤狭窄的街道好得太多。每走一步，都有新面孔、新景象。有些种姓他很熟悉，有些他从没见过。"
        - id: ch02-b02
          speaker: narrator
          text: "一群长发、气味刺鼻的桑西人迎面过来。他们背着装有蜥蜴和其他不洁食物的篮子，脚边跟着嗅来嗅去的瘦狗。桑西人紧贴路边，偷偷摸摸地小跑。别的种姓都躲得远远的，嫌他们污秽。"
        - id: ch02-b03
          speaker: narrator
          text: "接着，一个刚出狱的人跨过浓重的树影。他双腿分得又宽又僵，仿佛还记得脚镣有多沉。饱满的肚子和油亮的皮肤证明，政府喂囚犯，比大多数老实人喂自己还周到。金一眼认出那种走法。两人擦肩时，他便放肆地取笑起来。"
        - id: ch02-b04
          speaker: narrator
          text: "随后来了一个阿卡利教徒。他是狂热的锡克教徒，眼神和头发一样野。蓝色衣裳裹着全身，高高的蓝头巾扎成尖锥，上面闪着磨亮的钢轮。他刚从一个独立的锡克邦回来，曾在那里对穿长靴、白灯芯绒马裤、受过学院教育的小王公们，歌颂卡尔萨往日的荣光。金小心不去招惹他。阿卡利人脾气急，出手更快。"
        - id: ch02-b05
          speaker: narrator
          text: "一群群盛装的村民不断迎面走来，也有人从后面赶上。整村的人都去附近赶集。女人抱着婴儿走在男人后面，大孩子骑着甘蔗棍逞威风。他们有的拖着半便士一个的粗陋黄铜火车头，有的拿廉价小镜子，把阳光晃进长辈眼里。每个人买了什么，几乎一眼就能看明白。若还有拿不准的，只要瞧瞧妻子们把褐色胳膊并在一起，比较新买的灰暗玻璃镯子，也就知道了。"
        - id: ch02-b06
          speaker: narrator
          text: "赶集的人走得慢悠悠，一路互相呼喊。他们会停下同糖果贩子讨价还价，也会到路边神龛前祷告。神龛有时属于印度教，有时属于伊斯兰教。两教的低种姓却不计较，碰见哪一座便拜哪一座。"
        - id: ch02-b07
          speaker: narrator
          text: "忽然，颤动的尘土里涌出一条结实的蓝色队伍。她们一起一伏，像一条赶路的毛毛虫，伴着急促尖利的吵嚷声小跑过去。那是昌加尔女人。北方铁路的路堤工程都由她们承揽。她们脚掌扁平，四肢强壮，全族都穿蓝裙，靠运土为生。听说北方有活，她们便匆匆赶去，一刻也不耽搁。在她们的种姓里，男人根本不值一提。她们横着手肘，摆动臀部，高昂着头，走出惯于负重的女人才有的步态。"
        - id: ch02-b08
          speaker: narrator
          text: "再过一会儿，迎亲队伍带着乐声和喊声拐上大路。万寿菊和茉莉花的香味，甚至盖过了尘土。新娘的轿子在烟尘里摇晃，只看得见一团红色和金箔。新郎那匹挂满花环的小马却歪过头，忙着从路过的饲料车上偷吃。金也加入密集的祝福和坏笑话，照俗话祝新人将来有一百个儿子，一个女儿也没有。"
        - id: ch02-b09
          speaker: narrator
          text: "更值得大喊大叫的，是四处卖艺的戏法师。他们可能带着几只没驯熟的猴子，也可能牵着一头喘个不停的瘦熊。有个女人把山羊角绑在脚上，踩着角在松绳上跳舞。马被吓得连连躲闪，女人们也拖长声音尖叫起来。"
        - id: ch02-b10
          speaker: narrator
          text: "喇嘛始终没有抬眼。他没看见放债人骑着屁股像鹅的矮马，赶去收取狠毒的利钱。也没看见休假的本地士兵仍挤成军伍的小方阵，沿路放声低喊。他们庆幸终于脱了马裤和绑腿，就算碰见最体面的女人，也照样说得出最无礼的话。就连卖恒河水的人，喇嘛也没看见。金原以为那样珍贵的水，他至少会买一瓶。"
        - id: ch02-b11
          speaker: narrator
          text: "喇嘛低头稳稳地走了一小时又一小时，灵魂却在别处忙碌。金快活得像登上了七重天。这里的大干道筑在高堤上，是为了挡住山麓冬季的洪水。行人走在上面，仿佛穿过一条庄严的长廊，略高于四周田野。向两边望去，整个印度都铺展开来。"
        - id: ch02-b12
          speaker: narrator
          text: "许多牛套在粮车和棉车前，拖着车在乡间小路慢慢爬行。一英里外就能听见车轴的抱怨声，一路越响越近。车夫叫骂着催牛爬上陡坡，一头冲进坚硬的大路，随即又彼此痛骂。红色、蓝色、粉色、白色和藏红色的小小人群，三两个一伙，拐向各自的村庄。他们越走越远，渐渐缩小在平坦的原野上。"
        - id: ch02-b13
          speaker: narrator
          text: "金把这一切都收进心里，却说不出那是什么滋味。他只好买了一根削过皮的甘蔗，边走边大方地吐着蔗渣。喇嘛偶尔吸一撮鼻烟。到最后，金再也忍不住这片沉默。"
        - id: ch02-b14
          speaker: kim
          text: "南方这片土地真好！空气好，水也好。你说是不是？"
        - id: ch02-b15
          speaker: lama
          text: "可他们全都被缚在轮回上，一世接一世，怎么也挣脱不了。没有一个人看见那条道路。"
        - id: ch02-b16
          speaker: narrator
          text: "喇嘛抖擞一下，终于回到了眼前的世界。"
        - id: ch02-b17
          speaker: kim
          text: "我们已经走得够累了。前面总该有歇脚站了吧？今晚就住在那里，好不好？你看，太阳已经斜了。"
        - id: ch02-b18
          speaker: lama
          text: "今晚会有谁收留我们？"
        - id: ch02-b19
          speaker: kim
          text: "谁都行。这地方到处是好人。再说，我们有钱。"
        - id: ch02-b20
          speaker: narrator
          text: "最后几个字，比耳语还轻。快到当日路程尽头的歇脚站时，人渐渐多起来。那里有几排卖粗茶淡饭和烟草的摊子，一垛柴，一间警察所，一口井，一个马槽和几棵树。树下的泥地被踩得结实，散落着旧火堆的黑灰。除了同样饥饿的乞丐和乌鸦，大干道上的歇脚站，该有的标志全在这里。"
        - id: ch02-b21
          speaker: narrator
          text: "太阳把宽阔的金色轮辐射进芒果树低垂的枝叶。几百只鹦鹉和鸽子飞回巢里。灰背的七姐妹鸟吵着交换一天的见闻，三两只一群，在旅人脚边踱步。枝头发出窸窣碰撞声，蝙蝠也准备出门值夜。"
        - id: ch02-b22
          speaker: narrator
          text: "光线忽然收拢，在人的脸上、车轮上、牛角上抹过一瞬血红。紧接着，夜色落了下来。空气的触感变了，一层低垂均匀的薄雾，像蓝色蛛纱一样蒙住大地。柴烟、牲口，还有埋在灰里烘烤的麦饼，气味一下变得鲜明浓烈。"
        - id: ch02-b23
          speaker: narrator
          text: "晚间巡逻队从警察所匆匆出发，郑重其事地咳嗽，一遍遍发号施令。路边车夫的水烟锅里，活炭烧得通红。金机械地盯着黄铜火钳，看上面最后一点夕照渐渐熄灭。这个歇脚站，就像一座缩小的克什米尔客店。金一头钻进亚洲式的快活混乱里。只要肯花时间，这片混乱能把一个朴素的人需要的一切送到手边。"
    - id: ch03
      title: 帘幕后的老妇
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: "他们要的不多。喇嘛不在意种姓，最近摊子买来的熟食就够了。金却想过得舒服些，又买了一把干牛粪饼来生火。小火堆周围，人们来来去去，高声要油、粮食、糖果和烟草，在井边排队时互相推挤。男人的声浪下面，还能听见封闭大车里女人们尖细的笑闹。按规矩，她们的脸不该露给外人看。"
        - id: ch03-b02
          speaker: narrator
          text: "如今，受过良好教育的本地人更愿让家中女眷坐进遮得严严实实的车厢，搭火车迅速抵达目的地。可总有人守着祖辈的老规矩，尤其是上了年纪、晚年要去朝圣的女人。她们长年深居家中，却一直实际操持着外面千百桩事务。终于走上大路，她们最爱沿途的喧闹，爱神庙前的人群，也爱同别的老太太没完没了地闲谈。"
        - id: ch03-b03
          speaker: narrator
          text: "一个牙尖嘴利、意志如铁的老妇若能这样周游印度，往往也正合家中那些忍耐已久之人的心意。何况朝圣能讨诸神欢喜。所以，不论在印度多偏僻或多热闹的地方，总能看见几名灰白头发的老仆，名义上照看藏在牛车里的老妇。有欧洲人或高种姓本地人在场时，他们会郑重地把主人遮好。到了朝圣路上的混杂人群中，规矩就松了。老妇终究也是血肉之躯，她活着，就是为了看看人间生活。"
        - id: ch03-b04
          speaker: narrator
          text: "金留意到一辆装饰华丽的家用牛车刚进歇脚站。车顶两座绣花穹篷，像双峰骆驼。八个随从跟在四周，其中两人佩着生锈的马刀。这是服侍贵人的标志，平民不会带武器。帘幕后不断传出尖声，越来越响。有抱怨，有吩咐，有玩笑，也有欧洲人听来会算粗话的句子。车里显然坐着一位惯于发号施令的女人。"
        - id: ch03-b05
          speaker: narrator
          text: "金仔细打量随从。一半是南方来的奥里亚人，腿细，胡须灰白。另一半是北方山民，穿粗呢衣，戴毡帽。两拨人一路斗嘴，已经把内情说得很清楚。老妇正南下探亲，多半去见一个富裕亲戚，也许就是女婿。女婿派护卫北上迎接，好表示敬重。山民则是她自己的族人，来自库卢或坎格拉。她不会是送女儿出嫁，不然帘子早就绑得密不透风，守卫也绝不会容人靠近。"
        - id: ch03-b06
          speaker: narrator
          text: "金一手托着牛粪饼，一手端着熟食，用肩膀轻推喇嘛往前。他觉得这位贵妇快活又意气飞扬，这场相逢大概很有用。喇嘛帮不上忙，可金是个尽责的弟子，十分乐意替两个人讨饭。"
        - id: ch03-b07
          speaker: narrator
          text: "他把火生在尽量靠近牛车的地方，等着随从来赶。喇嘛累得坐到地上，像一只沉重的食果蝙蝠，蜷起身子拨弄念珠。"
        - id: ch03-b08
          speaker: hill_servant
          text: "叫花子，站远一点！"
        - id: ch03-b09
          speaker: kim
          text: "哈，不过是个山里人。山里的驴什么时候成了全印度斯坦的主人？"
        - id: ch03-b10
          speaker: narrator
          text: "山民立刻还嘴，把金祖孙三代的来历痛痛快快地骂了一遍。金掰着牛粪饼，声音反而更甜。"
        - id: ch03-b11
          speaker: kim
          text: "在我们那里，你这几句话只能算调情的开场。"
        - id: ch03-b12
          speaker: narrator
          text: "帘幕后响起干涩尖厉的笑声。山民受了鼓舞，又骂了一轮。"
        - id: ch03-b13
          speaker: kim
          text: "不坏，真不坏。不过你得小心些，兄弟，免得我们也想回敬几句诅咒。我们的诅咒一口咬下去，可是会咬进肉里的。"
        - id: ch03-b14
          speaker: narrator
          text: "奥里亚人笑出了声，山民却气势汹汹地扑上来。喇嘛忽然抬头，巨大的苏格兰圆帽整个照进刚生起的火光。"
        - id: ch03-b15
          speaker: lama
          text: "出了什么事？"
        - id: ch03-b16
          speaker: narrator
          text: "山民一下僵住，像被人点成了石头。"
        - id: ch03-b17
          speaker: hill_servant
          text: "我……我差点犯下大罪。幸好及时得救了。"
        - id: ch03-b18
          speaker: oriya_servant
          text: "这个外乡人总算给自己找到祭司了。"
        - id: ch03-b19
          speaker: widow
          text: "嗨！怎么不把那个小叫花子狠狠打一顿？"
        - id: ch03-b20
          speaker: narrator
          text: "山民退回牛车旁，对着帘子低声说了几句。四下一时安静，随后又传出一阵咕哝。金心想，事情进行得很顺利，脸上却装作什么也没看见。"
        - id: ch03-b21
          speaker: hill_servant
          text: "等他吃过饭，里边那位想请圣人赏光，同一个想见他的人谈谈。"
        - id: ch03-b22
          speaker: kim
          text: "他吃过饭就要睡觉。我现在得去替他取饭。"
        - id: ch03-b23
          speaker: narrator
          text: "金还没完全看懂局面为何突然改变，却决心从中得到好处。他故意把最后一句说得很响，末了又虚弱地叹了一口气。"
        - id: ch03-b24
          speaker: hill_servant
          text: "如果准许，我和同伴愿意替你们把饭食办好。"
        - id: ch03-b25
          speaker: kim
          text: "准了。圣人，这些人会把饭送来。"
        - id: ch03-b26
          speaker: lama
          text: "这里是片好土地。南方处处都好。这世界真伟大，也真可怕。"
        - id: ch03-b27
          speaker: narrator
          text: "喇嘛困倦地咕哝着。"
        - id: ch03-b28
          speaker: kim
          text: "让他睡吧。他醒来以后，你们得让我们吃饱。他是一位极其神圣的人。"
        - id: ch03-b29
          speaker: narrator
          text: "一个奥里亚人又轻蔑地嘀咕了一句。金板起脸，对着星空开口。"
        - id: ch03-b30
          speaker: kim
          text: "他不是法基尔，也不是南方的叫花子。他是圣人中的圣人，高于一切种姓。我是他的弟子。"
        - id: ch03-b31
          speaker: widow
          text: "过来！"
        - id: ch03-b32
          speaker: narrator
          text: "金走到帘前，知道一双看不见的眼睛正在打量他。一根褐色枯瘦、戴满戒指的手指搭上车沿，谈话就这样开始了。"
        - id: ch03-b33
          speaker: widow
          text: "那个人是谁？"
        - id: ch03-b34
          speaker: kim
          text: "一位极其圣洁的人。他从很远的西藏来。"
        - id: ch03-b35
          speaker: widow
          text: "西藏什么地方？"
        - id: ch03-b36
          speaker: kim
          text: "雪山背后，远得很。他懂星辰，会排星盘，也会推算生辰。不过他从不为钱做这些，只因为仁慈，心里又有大善。我是他的弟子，人们也叫我星辰的朋友。"
        - id: ch03-b37
          speaker: widow
          text: "你不是山里人。"
        - id: ch03-b38
          speaker: kim
          text: "你去问他。他会告诉你，是星辰把我送到他身边，领他走完朝圣的路。"
        - id: ch03-b39
          speaker: widow
          text: "哼，小崽子！我虽然老了，还没有蠢到家。喇嘛我见过，也知道该敬重。可你若是个正经弟子，我这根手指就是车辕。你是个没种姓的印度教小子，是个大胆无耻的小叫花子。你缠上那位圣人，多半只是为了捞好处。"
        - id: ch03-b40
          speaker: kim
          text: "世人做事，哪个不是为了好处？不过，我倒听说过一件事……"
        - id: ch03-b41
          speaker: widow
          text: "你听说了什么？"
        - id: ch03-b42
          speaker: kim
          text: "我记不大清。只是集市上有人说，当然一定是假话。他们说，就连山里的那些小王公……"
        - id: ch03-b43
          speaker: widow
          text: "王公虽小，也流着高贵的拉杰普特血！"
        - id: ch03-b44
          speaker: kim
          text: "血统当然高贵。可人们说，他们为了钱，也会把家里长得漂亮的女人卖到南方，卖给奥德的地主之类。"
        - id: ch03-b45
          speaker: narrator
          text: "山地小王公最不能容忍这种指控，偏偏集市上的人一谈到神秘的奴隶买卖，最相信的就是这一桩。老妇压低声音，愤怒地细数金有多恶毒、多会撒谎。她说，若在自己年轻时听见这种暗示，当晚就会让大象踩死他。这倒完全是真话。"
        - id: ch03-b46
          speaker: kim
          text: "哎呀！美人之眼已经说了，我只是个小叫花子。"
        - id: ch03-b47
          speaker: narrator
          text: "金夸张地哀号，装得像真被吓坏了。"
        - id: ch03-b48
          speaker: widow
          text: "还美人之眼呢！我是什么人，轮得到你拿叫花子的甜话来哄？不过四十年前，这称呼也许不算假。对，三十年前也还当得起。如今上上下下走遍印度，王公的遗孀也得同遍地渣滓挤在一起，还要受叫花子嘲弄。"
        - id: ch03-b49
          speaker: narrator
          text: "她嘴上责骂，听见那句久违的称呼，却还是笑了。随后又气得声音发抖。"
        - id: ch03-b50
          speaker: kim
          text: "伟大的王后，我确实像你说的，只是个小叫花子。可我师父仍是一位圣人。他还没听见伟大的王后吩咐他过去。"
        - id: ch03-b51
          speaker: widow
          text: "吩咐？我会吩咐一位圣人、一位正法导师来同女人说话？绝不可能！"
        - id: ch03-b52
          speaker: kim
          text: "请原谅我愚钝。我还以为那是命令。"
        - id: ch03-b53
          speaker: widow
          text: "不是命令，是请求。现在懂了吗？"
        - id: ch03-b54
          speaker: narrator
          text: "一枚银币在车沿上叮当一响。金接住钱，深深行礼。老妇也明白，金是喇嘛的耳目，必须先把他哄好。"
        - id: ch03-b55
          speaker: kim
          text: "我只是圣人的弟子。他吃过饭以后，也许会来。"
        - id: ch03-b56
          speaker: widow
          text: "你这坏蛋，无耻的滑头！"
        - id: ch03-b57
          speaker: narrator
          text: "戴宝石的手指责备似的摇了摇，金却听得出老妇正在偷笑。"
        - id: ch03-b58
          speaker: kim
          text: "别绕弯了，究竟是什么事？是不是你家里还想要一个儿子？尽管说，我们做祭司的……"
        - id: ch03-b59
          speaker: narrator
          text: "金的声音忽然变得温存又亲密。这套话，他直接从塔克萨利门旁一个法基尔那里学来。"
        - id: ch03-b60
          speaker: widow
          text: "我们做祭司的！你还没长到能说这种……算了。相信我，祭司啊，我们女人偶尔也会想想儿子以外的事。况且我女儿已经给她男人生了一个儿子。"
        - id: ch03-b61
          speaker: kim
          text: "箭囊里两支箭胜过一支，有三支就更好。"
        - id: ch03-b62
          speaker: narrator
          text: "金若有所思地咳了一声，谨慎地垂下眼睛。"
        - id: ch03-b63
          speaker: widow
          text: "不错，一点不错。也许还会有。南方那些婆罗门全是废物。我送礼物，送钱，又送礼物，他们也给我作了预言。"
        - id: ch03-b64
          speaker: kim
          text: "啊，他们作了预言！"
        - id: ch03-b65
          speaker: narrator
          text: "金把声音拖得很长，鄙夷得恰到好处，真正的行家也演不过他。"
        - id: ch03-b66
          speaker: widow
          text: "后来我想起自己的神明，祈求才有回应。我挑了吉时。也许你的圣人听过隆乔寺院的住持。我把事情交托给他，时候一到，果然样样如愿。可我外孙父亲家的婆罗门，后来偏说这是靠他的祷告。等到了旅途终点，这点小误会我自会同他讲清。之后，我还要去菩提伽耶，为我孩子们的父亲举行亡灵祭。"
        - id: ch03-b67
          speaker: kim
          text: "我们也去那里。"
        - id: ch03-b68
          speaker: widow
          text: "那就是双倍吉利。至少再得一个儿子！"
          emotion: happy
        - id: ch03-b69
          speaker: lama
          text: "全世界的朋友！"
        - id: ch03-b70
          speaker: narrator
          text: "喇嘛醒了，像个忽然在陌生床上睁眼、不知道身在何处的孩子。"
        - id: ch03-b71
          speaker: kim
          text: "来了，来了，圣人！"
        - id: ch03-b72
          speaker: narrator
          text: "金跑回火边。喇嘛身旁已经摆满饭菜。山民们显然对他敬畏极了，南方来的随从却个个沉着脸。"
        - id: ch03-b73
          speaker: kim
          text: "退开，全都退开！难道我们要像狗一样，当着众人的面吃东西？"
        - id: ch03-b74
          speaker: narrator
          text: "两人安静地吃完饭，各自略微背向对方。最后，金又点起一支本地烟卷。"
        - id: ch03-b75
          speaker: kim
          text: "我不是说过一百遍，南方是片好地方吗？这里有一位品德高尚、出身尊贵的山地王公遗孀，正去朝圣。饭菜就是她送的。等你休息好，她想同你谈谈。"
        - id: ch03-b76
          speaker: lama
          text: "这也是你的功劳吗？"
        - id: ch03-b77
          speaker: narrator
          text: "喇嘛把手深深伸进鼻烟葫芦。"
        - id: ch03-b78
          speaker: kim
          text: "自从这趟奇妙旅程开始，除了我，还有谁照顾你？圣人，我可曾疏忽过你的安适？"
        - id: ch03-b79
          speaker: narrator
          text: "金眼里跳着快乐的光。他从鼻孔喷出辛辣的烟，舒展开身体，躺在尘土上。"
        - id: ch03-b80
          speaker: lama
          text: "愿你得福。我活了这么久，见过许多人，也收过不少弟子。可是这世上没有谁，假如你真是女人生下来的，能像你这样叫我倾心。你体贴、聪明、有礼，只是还带着一点小恶鬼的性子。"
        - id: ch03-b81
          speaker: kim
          text: "我也从没见过你这样的祭司。我们同行还不到三天，却像已经过了一百年。"
        - id: ch03-b82
          speaker: lama
          text: "也许我们前世有缘，我曾经帮过你。说不定你掉进陷阱，是我放了你。也可能我还没觉悟时，用钩子钓到你，又把你放回河里。"
        - id: ch03-b83
          speaker: kim
          text: "也许吧。"
        - id: ch03-b84
          speaker: narrator
          text: "金安静地答应。类似的推想，他已经从许多人嘴里听过一遍又一遍，而英国人绝不会觉得那些人富有想象力。"
        - id: ch03-b85
          speaker: kim
          text: "说到牛车里的女人，我看她想让女儿再生个儿子。"
        - id: ch03-b86
          speaker: lama
          text: "那不是正道关心的事。不过，她至少来自山中。啊，群山，还有山上的雪！"
        - id: ch03-b87
          speaker: narrator
          text: "喇嘛站起身，大步走向牛车。金宁肯舍掉两只耳朵也想跟去，可喇嘛没有请他。他偶尔听见几句话，也完全听不懂，因为两人说的是山里某种共同的语言。老妇问了许多问题，喇嘛每次都仔细想过才回答。中间偶尔响起一段悠长的汉文吟诵。"
        - id: ch03-b88
          speaker: narrator
          text: "金垂着眼皮，看见一幅奇异的景象。喇嘛高大笔直地站着，黄色长袍一层层垂下来。歇脚站的火光在衣褶间切出黑影，像低斜的夕阳在盘结树干上刻出深纹。他面对那辆缀满金箔、髹着亮漆的牛车。车子在摇晃的火光里，烧成一颗五彩宝石。"
        - id: ch03-b89
          speaker: narrator
          text: "夜风吹动帘幕，金绣花纹随褶皱上下游走，融化了，又重新出现。谈话一认真，那根戴宝石的手指便从绣帘中伸出来，闪出细小的光点。车后是一堵模糊的黑暗，零星火焰点在其中，人形、面孔和影子若隐若现。黄昏时万般声响已经沉成安稳的嗡鸣。最低的一调，是牛嚼碎秸秆时稳定的咂嘴声。最高的一调，是孟加拉舞女弹奏西塔琴的叮咚声。吃饱的人们深深吸着水烟，咕噜哼响的声音，活像牛蛙。"
        - id: ch03-b90
          speaker: narrator
          text: "喇嘛终于回来。一个山民跟在后面，抱来絮棉被，仔细铺在火旁。金心想，这位老妇该有一万个孙儿。可若没有自己，这些东西一件也不会送来。"
        - id: ch03-b91
          speaker: lama
          text: "她是个贤德的女人，也很有智慧。"
        - id: ch03-b92
          speaker: narrator
          text: "喇嘛像骆驼卧倒那样，一个关节接一个关节地松下来，又把棉被的一半盖到金身上。"
        - id: ch03-b93
          speaker: kim
          text: "她都说了些什么？"
        - id: ch03-b94
          speaker: lama
          text: "她问了很多问题，也出了很多难题。大半都是那些侍奉魔鬼、却假装遵循正道的祭司告诉她的无聊故事。有些我回答了，有些我直说十分愚蠢。披法衣的人很多，真正守正道的人却很少。"
        - id: ch03-b95
          speaker: kim
          text: "不错，一点不错。"
        - id: ch03-b96
          speaker: narrator
          text: "金换上深思又随和的语气，那是他想把别人心里话套出来时惯用的腔调。"
        - id: ch03-b97
          speaker: lama
          text: "不过，照她自己的见识来说，她的心很端正。她盼我们陪她去菩提伽耶。据我所知，她的路同我们的路一致，要向南走上许多天。"
        - id: ch03-b98
          speaker: kim
          text: "然后呢？"
        - id: ch03-b99
          speaker: lama
          text: "耐心些。我告诉她，我的寻求高于一切。她听过许多愚蠢传说，却从没听说过我的河，也不知道神箭的故事。这就是低山一带的祭司！她认得隆乔寺院的住持，却不知道我的河。"
        - id: ch03-b100
          speaker: kim
          text: "后来呢？"
        - id: ch03-b101
          speaker: lama
          text: "后来我给她讲了我的寻求、正道，还有种种有益的事。可她只盼我陪着她，为第二个儿子祈祷。"
        - id: ch03-b102
          speaker: kim
          text: "啊哈，看来我们女人果真什么都不想，只想着孩子。"
        - id: ch03-b103
          speaker: narrator
          text: "金已经睡意朦胧。"
        - id: ch03-b104
          speaker: lama
          text: "既然有一段路正好同走，我看不出陪她同行会妨碍我们的寻求。至少可以陪到那座城，只是我忘了城名。"
        - id: ch03-b105
          speaker: kim
          text: "喂，你们主人家住在哪里？"
        - id: ch03-b106
          speaker: narrator
          text: "金翻过身，朝几码外的奥里亚人尖声低语。"
        - id: ch03-b107
          speaker: oriya_servant
          text: "在萨哈兰普尔后面不远，果园中间。"
        - id: ch03-b108
          speaker: narrator
          text: "他说出了村名。"
        - id: ch03-b109
          speaker: lama
          text: "对，就是那里。至少走到那里，我们可以同她一起。"
        - id: ch03-b110
          speaker: oriya_servant
          text: "苍蝇总爱往腐肉上飞。"
        - id: ch03-b111
          speaker: kim
          text: "病牛会招乌鸦，病人会招婆罗门。"
        - id: ch03-b112
          speaker: narrator
          text: "金若无其事地对着头顶的暗树梢说出谚语。奥里亚人哼了一声，不再开口。"
        - id: ch03-b113
          speaker: kim
          text: "那么，我们就跟她一起走，圣人？"
        - id: ch03-b114
          speaker: lama
          text: "为什么不呢？道路每跨过一条河，我还是可以离开队伍，一条条去查看。是她盼我同行，而且盼望得很。"
        - id: ch03-b115
          speaker: narrator
          text: "金把笑声闷进被子。他想，等这个专横的老妇从面对喇嘛的天然敬畏中缓过来，她说的话一定很值得听。"
        - id: ch03-b116
          speaker: lama
          text: "话多女人的丈夫，来世必得厚报。"
        - id: ch03-b117
          speaker: narrator
          text: "金快睡着时，忽然听喇嘛念出这句谚语，又连吸三次鼻烟。他自己仍笑着，朦朦胧胧地睡了过去。"
    - id: ch04
      title: 同路南行
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: "钻石般明亮的黎明，同时唤醒了人、乌鸦和牛。金坐起来，打着哈欠，抖擞全身，欢喜得发颤。这才是真正见世面，这才是他想要的生活。四处都在忙乱叫喊。人们扣紧腰带，抽打牛只。车轮咯吱转动，火堆重新燃起，食物下了锅。目光每转一下，都有新鲜景象。"
        - id: ch04-b02
          speaker: narrator
          text: "晨雾卷成银色旋涡，忽然散去。鹦鹉结成尖叫的碧绿大军，射向远处一条河。耳朵能听见的每一架水车都开始工作。印度醒了。金就在它正中央，比谁都清醒，也比谁都兴奋。"
        - id: ch04-b03
          speaker: narrator
          text: "他嚼着一根细枝，准备拿它刷牙。这个熟悉而热爱的国家，不论哪一方的习惯，他都能随手借来。他用不着为吃饭发愁，也不必在拥挤的摊子上花一个贝壳钱。他是圣人的弟子，而圣人已经被一个意志强硬的老妇收归门下。所有东西自然会备好。等人恭敬来请，他们只管坐下吃。"
        - id: ch04-b04
          speaker: narrator
          text: "想到别的事，金一边刷牙一边咯咯地笑。这位女主人只会让一路更加有趣。他挑剔地查看她的牛。牛套好轭，喘着气走来。若它们跑得太快，当然这几乎不可能，车辕上还有个舒服的位置给他，喇嘛则会坐在车夫身旁。随从自然只能步行。老妇也一定会说个不停。按昨夜听见的情形，那些话绝不会无聊。她果然已经在吩咐、训斥、责骂，而且也确实在咒骂仆人动作太慢。"
        - id: ch04-b05
          speaker: oriya_servant
          text: "把烟袋给她！看在诸神分上，快拿去堵住她那张不吉利的嘴。她和鹦鹉一个样，天一亮就开始尖叫。"
        - id: ch04-b06
          speaker: narrator
          text: "一个奥里亚人边喊，边捆起不成形的铺盖卷。忽然，一辆粮车的车轴勾住牛角，两头牛倒退着原地打转。"
        - id: ch04-b07
          speaker: hill_servant
          text: "领头的牛！嗨，看住领头的牛！猫头鹰的儿子，你这是往哪儿赶？"
        - id: ch04-b08
          speaker: carter
          text: "哎呀呀，车里坐的是德里王后，要去求儿子呢！快给王后让路，也给她那位灰猴子宰相让路。他正顺着自己的刀往上爬！"
        - id: ch04-b09
          speaker: narrator
          text: "车夫隔着高高的货堆回喊。后面又紧跟来一辆装树皮、要送到南方制革场的车。那车夫见家用牛车一退再退，也加了几句问候。"
        - id: ch04-b10
          speaker: narrator
          text: "震动的帘幕后猛地喷出一阵痛骂。话不算长，可种类齐全，火候十足，又灼人又咬人，每一句都正中要害。连金也从没听过这样的杰作。车夫赤裸的胸膛惊得塌了下去。他恭恭敬敬地朝那声音行礼，从车辕跳下来，帮随从把这座火山拖上大路。帘后的声音还如实告诉他，他娶了怎样的妻子，以及那妻子趁他不在时都做些什么。"
        - id: ch04-b11
          speaker: kim
          text: "哦，漂亮！"
        - id: ch04-b12
          speaker: narrator
          text: "车夫灰溜溜离开时，金忍不住低声赞叹。"
        - id: ch04-b13
          speaker: widow
          text: "漂亮？一个可怜女人想去向神明祈祷，却一路受全印度斯坦的渣滓推撞欺负。这是羞耻，是丑闻！我们吞下辱骂，就像男人吞酥油。幸好我的舌头还能甩动，遇上事情，总找得到一两句合用的话。可我的烟草怎么还没来？究竟是哪个独眼、倒霉的无耻之子，到现在还没装好烟袋？"
        - id: ch04-b14
          speaker: narrator
          text: "一个山民赶紧把烟袋送进车里。浓烟从帘子两边一缕缕流出来，和平总算恢复。"
        - id: ch04-b15
          speaker: narrator
          text: "头一天，金以圣人弟子的身份走路，已经十分神气。今天，他跟在这支半皇家仪仗后面，在这位举止迷人、办法无穷的老妇庇护下有了公认的位置，神气更胜十倍。随从照本地习惯裹好头，分列牛车两边，拖着脚走，扬起遮天蔽日的尘云。"
        - id: ch04-b16
          speaker: narrator
          text: "喇嘛和金走在稍偏一点的地方。金嚼着甘蔗棍，来人若不是身份高过祭司，他绝不让路。老妇的舌头一刻不停地啪嗒作响，稳得像舂米机。她让随从把路上的动静一一说给她听。刚离开歇脚站，她就掀帘向外看，面纱只遮了三分之一张脸。她同手下讲话时，男人们不直视她，礼法多少还算保住了。"
        - id: ch04-b17
          speaker: narrator
          text: "一个肤色黝暗发黄、制服整洁得无可挑剔的英国人，骑着疲惫的马小跑过来。他是地区警务长，一看随从就知道老妇是谁，便拿她取笑。"
        - id: ch04-b18
          speaker: police_chief
          text: "老妈妈，深闺里的女人也这样露脸吗？要是有英国人经过，看见你没有鼻子，那可怎么办？"
        - id: ch04-b19
          speaker: widow
          text: "什么？你亲娘没有鼻子？那你何必在大路上喊给人人都听？"
        - id: ch04-b20
          speaker: narrator
          text: "这一击回得漂亮。英国人举起一只手，像剑术交锋时挨了一剑。老妇笑着朝他点头。"
        - id: ch04-b21
          speaker: widow
          text: "我这张脸，难道还会勾引正人君子走上邪路？"
        - id: ch04-b22
          speaker: narrator
          text: "她索性把面纱全揭开，瞪着警务长。那张脸实在算不上美。可英国人收紧缰绳，仍称它是天堂的明月，是操守的扰乱者，又送上好几个荒唐华丽的称号，逗得老妇笑弯了腰。"
        - id: ch04-b23
          speaker: widow
          text: "这人是个坏蛋。警察全是坏蛋，警官尤其坏。嗨，我的儿子，你从英国来以后可学不会这些话。到底是谁的奶把你喂大的？"
        - id: ch04-b24
          speaker: police_chief
          text: "达尔豪西的一个山地女人，我的母亲。欢乐的施予者，把你的美貌藏回阴凉里吧。"
        - id: ch04-b25
          speaker: narrator
          text: "警务长说完，骑马走远。"
        - id: ch04-b26
          speaker: widow
          text: "这种人才配掌管公道。他们懂这片土地，也懂这里的规矩。另一些人刚从欧洲来，是白女人喂大的，只从书本里学我们的语言。他们比瘟疫还坏，早晚会祸害王公。"
        - id: ch04-b27
          speaker: narrator
          text: "老妇摆出精审明断的样子，把蒌叶塞进嘴里。接着，她对着整个世界讲起一个长故事。有个无知的年轻警官，为了一桩微不足道的田地案，惊扰了一位山地小王公。那人还是她的第九等表亲。故事讲到最后，她引用了一部绝不是劝人虔诚的作品。"
        - id: ch04-b28
          speaker: narrator
          text: "随后，她心情一转，叫随从去问喇嘛，愿不愿走在车边谈谈宗教。金退到尘土里，继续啃甘蔗。一个多小时中，喇嘛的苏格兰圆帽像月亮一样，在尘雾里时隐时现。从传来的动静听，金猜老妇哭过。"
        - id: ch04-b29
          speaker: narrator
          text: "一个奥里亚人为了昨夜的无礼，略略表示歉意。他说从没见女主人这样温和，一定是陌生祭司带来的影响。他自己信婆罗门，虽然也同所有本地人一样，很清楚那些人有多狡猾、多贪婪。婆罗门只会无休止地讨东西，惹恼了主人家的岳母。她把他们赶走时，他们气得诅咒整支队伍。依奥里亚人的看法，右边第二头牛跛脚，还有昨夜车辕折断，全是这道诅咒造成的。既然如此，印度内外不管哪个宗派的祭司，他都愿意接受。"
        - id: ch04-b30
          speaker: narrator
          text: "金老练地点头赞同，又让奥里亚人留意，喇嘛分文不取。往后，好运会一路跟随车队，把两人的饭钱百倍偿还。他还讲了几个拉合尔城的故事，唱了一两首歌，逗得随从们大笑。金是一只熟悉最新曲调的城里老鼠。当红作曲家大半是女人。跟萨哈兰普尔后面小果园村来的男人相比，他占尽优势，却只让众人自己慢慢看出来。"
        - id: ch04-b31
          speaker: narrator
          text: "正午，他们离开大路吃饭。饭菜丰盛可口，干净叶片做成的盘子摆得整整齐齐，也避开飞扬的尘土。剩饭先分给几个乞丐，该守的规矩都守到了。众人这才坐下，悠闲地抽了很久的烟。"
        - id: ch04-b32
          speaker: narrator
          text: "老妇退回帘幕后，却很随意地加入谈话。她的仆人也像东方各处的仆人一样，同她争辩，驳她的话。她比较坎格拉和库卢山中的清凉、松树，与南方的尘土、芒果。她讲起丈夫领地边缘几位古老的地方神明，又痛痛快快地骂她正在抽的烟草。随后，她把所有婆罗门痛骂一遍。最后，她毫不避讳地猜起将来还会有多少个孙子。"
