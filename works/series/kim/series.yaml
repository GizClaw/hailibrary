cover_prompt: |-
  A wordless cover scene outside the Lahore Museum in British India at the turn of the twentieth century shows a lean, sun-browned boy perched astride the great green-bronze Zam-Zammah cannon as a Tibetan lama approaches. The barefoot boy wears loose, worn trousers, a simple shirt, and a battered hat, while the nearly six-foot-old pilgrim has a yellow, deeply wrinkled face, narrow dark eyes, layered dingy woollen robes, a huge soft round cap, a wooden rosary, and an openwork iron pencase at his belt. The boy drops lightly from the cannon and reaches toward the curious stranger, making their first meeting the focal action. Behind them stand the museum's red-brick facade, a Punjabi policeman, a water-carrier, market children, and the moving colors of the nearby bazaar. Use a wide child-height view with the cannon forming a strong foreground diagonal, the two main figures clearly silhouetted near the center, and calm open sky above the museum. Keep the architecture, clothing, street life, and objects faithful to Lahore around 1900, with warm curiosity and no reference to any screen adaptation. No readable text, letters, numbers, labels, logos, captions, speech bubbles, signatures, or watermarks.
