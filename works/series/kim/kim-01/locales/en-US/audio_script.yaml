  chapters:
    - id: ch01
      title: CHAPTER I
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Listen gently when those you call heathen pray to Buddha at Kamakura. Kim sat astride Zam-Zammah in spite of the city orders, high on the great gun's brick platform across from Lahore's old Wonder House. Whoever held that fire-breathing dragon was said to hold the Punjab, for each conqueror claimed the huge green-bronze gun first.
        - id: ch01-b02
          speaker: narrator
          text: Kim had kicked Lala Dinanath's boy off the trunnions, and he thought he had some right to the seat. The English held the Punjab, and Kim was English. Yet the sun had burned him as dark as any bazaar child. He preferred the local speech, while his English came in a clipped, uncertain singsong. He played as an equal with all the small boys of the bazaar. He was white, but as poor as any white child could be.
        - id: ch01-b03
          speaker: narrator
          text: The half-caste woman who cared for him smoked opium and pretended to sell secondhand furniture near the square where the cheap cabs waited. She told missionaries she was the sister of Kim's mother. In truth, his mother had served as a nursemaid in a colonel's family. She married Kimball O'Hara, a young Irish color-sergeant in the Mavericks. Later he worked for the Sind, Punjab, and Delhi Railway, while his regiment went home without him.
        - id: ch01-b04
          speaker: narrator
          text: Kim's mother died of cholera at Ferozepore. O'Hara took to drink and wandered along the railway with his sharp-eyed three-year-old son. Charitable societies and chaplains tried to catch the child, but O'Hara slipped away. At last he met the opium-smoking woman, learned her habit, and died in the miserable way poor whites often died in India.
        - id: ch01-b05
          speaker: narrator
          text: All he left were three papers. One he called his ne varietur because those words stood beneath his signature. Another was his clearance certificate, and the third was Kim's birth certificate. In his grand opium dreams, O'Hara said those papers would make little Kimball a man. Kim must never lose them, because they belonged to a powerful magic practiced behind the Museum in the blue-and-white Magic House, the Masonic Lodge.
        - id: ch01-b06
          speaker: narrator
          text: Someday, O'Hara promised, everything would come right. Kim would be raised between enormous pillars of beauty and strength. The colonel himself would ride at the head of the finest regiment in the world and see to the boy who should have lived better than his father. Nine hundred first-class devils, whose God was a Red Bull on a green field, would help Kim if they still remembered poor O'Hara, once a gang foreman on the Ferozepore line. Then O'Hara would weep in his broken chair on the veranda.
        - id: ch01-b07
          speaker: narrator
          text: After he died, the woman sewed the parchment, the paper, and the birth certificate into a leather amulet case and hung it around Kim's neck.
        - id: ch01-b08
          speaker: woman
          text: Someday a great Red Bull on a green field will come for you. The colonel will come too, riding his tall horse. And there will be nine hundred devils.
        - id: ch01-b09
          speaker: kim
          text: I will remember. A Red Bull and a colonel on horseback will come. But Father said two men would come first and prepare the ground. That is always how men begin their magic.
        - id: ch01-b10
          speaker: narrator
          text: If she had taken Kim and his papers to the local Masonic Lodge, the Provincial Lodge would have sent him to the Masonic orphanage in the hills. But she distrusted any magic she had heard about, and Kim had ideas of his own. As he grew old enough to act unwisely, he learned to dodge missionaries and grave-looking white men who asked his name and his business.
        - id: ch01-b11
          speaker: narrator
          text: Kim did nothing, and did it brilliantly. He knew walled Lahore from the Delhi Gate to the outer Fort Ditch. He knew men whose lives were stranger than the dreams of Haroun al Raschid, and he lived among adventures as wild as the Arabian Nights. The missionaries and charity secretaries saw none of that beauty. Across the city wards he was known as Little Friend of all the World.
        - id: ch01-b12
          speaker: narrator
          text: Because he was quick and easy to overlook, fashionable young men often sent him across the crowded rooftops at night. Kim knew it was intrigue. He had known every sort of wickedness since he could speak. But he loved the game itself. He loved creeping through dark lanes, climbing a water pipe, catching the sights and sounds of the women's world on the flat roofs, and racing from roof to roof beneath the hot dark sky.
        - id: ch01-b13
          speaker: narrator
          text: He also knew the ash-smeared holy men beside their brick shrines under the riverside trees. He greeted them when they returned from long begging rounds. When no one watched, he sat beside them and ate from the same dish. His guardian wept and insisted that he wear European trousers, a shirt, and a battered hat. Kim obeyed when it suited him, but European clothes made him too easy to notice. For certain errands he found Hindu or Mohammedan dress far more useful, because then he could melt into the streets and pass for whatever kind of boy the work required.
        - id: ch01-b14
          speaker: narrator
          text: One fashionable young man, later found dead in a well on the night of the earthquake, had given him the whole outfit of a low-caste Hindu street boy. Kim hid it beneath timber in Nila Ram's yard beyond the Punjab High Court, among the fragrant deodar logs seasoning after their journey down the Ravi. Whenever business or fun called, he put it on. At dawn he came back exhausted from shouting behind a wedding procession or yelling at a Hindu festival. If there was no food at home, as often happened, he went out and ate with his local friends.
        - id: ch01-b15
          speaker: narrator
          text: Now Kim drummed his heels against Zam-Zammah and played king of the castle with little Chota Lal and Abdullah, the sweetmeat seller's son. Between rounds he shouted rude remarks at the policeman guarding the rows of shoes outside the Museum. The big Punjabi only grinned. He had known Kim for years and knew how the boy talked. So had the water carrier, who sent shining fans of water over the dry road from his goatskin bag. Jawahir Singh knew him too. The Museum carpenter was bent over a set of new packing cases while the noisy game went on above the street.
        - id: ch01-b16
          speaker: narrator
          text: Everyone nearby knew him except the country people hurrying into the Wonder House to see things made in their own province and far beyond it. The Museum held the arts and manufactures of India, and anyone who wanted knowledge could ask the Curator.
        - id: ch01-b17
          speaker: abdullah
          text: Get off! Move! Let me climb up!
        - id: ch01-b18
          speaker: kim
          text: Your father baked pastries, and your mother stole the ghee! All the Muslims fell off Zam-Zammah long ago!
        - id: ch01-b19
          speaker: chota_lal
          text: Let me up there!
        - id: ch01-b20
          speaker: narrator
          text: Chota Lal's cap glittered with gold embroidery. His father was worth perhaps half a million pounds, but in India rich and poor boys played together.
        - id: ch01-b21
          speaker: kim
          text: The Hindus fell off too. The Muslims pushed them down. Your father baked pastries—
        - id: ch01-b22
          speaker: narrator
          text: Kim stopped. A stranger shuffled around the corner from the roaring Motee Bazar. Though Kim believed he knew every caste, he had never seen anyone like this man. He stood nearly six feet tall. Fold after fold of dingy cloth, thick as horse blankets, wrapped his body, but the clothes belonged to no trade Kim recognized. An open iron pencil case and a wooden holy man's rosary hung from his belt. A huge cap sat on his head. His face was yellow and wrinkled like Fook Shing's, the Chinese bootmaker, and his narrow dark eyes turned upward at the corners.
        - id: ch01-b23
          speaker: kim
          text: Who is that man?
        - id: ch01-b24
          speaker: abdullah
          text: Maybe he is a man.
        - id: ch01-b25
          speaker: narrator
          text: Abdullah stared with one finger in his mouth.
        - id: ch01-b26
          speaker: kim
          text: Of course he is. But I have never seen a man of India like him.
        - id: ch01-b27
          speaker: chota_lal
          text: Maybe he is a priest. Look at his rosary! He is going into the Wonder House!
        - id: ch01-b28
          speaker: narrator
          text: At the door, the stranger tried to speak with the policeman. Dunnoo shook his head because the old man's language was not Punjabi.
        - id: ch01-b29
          speaker: policeman
          text: No, no. I cannot understand you. Friend of all the World, what is this man saying?
        - id: ch01-b30
          speaker: kim
          text: Send him over here. He is a foreigner, and you are a buffalo.
        - id: ch01-b31
          speaker: narrator
          text: Kim dropped from the gun, flashing his bare heels. The helpless stranger moved toward the boys. He was old, and his woolen robe still smelled of the bitter mountain herb from the high passes.
        - id: ch01-b32
          speaker: lama
          text: Children, what is that great house?
        - id: ch01-b33
          speaker: narrator
          text: His Urdu was quite good.
        - id: ch01-b34
          speaker: kim
          text: That is the Ajaib-Gher, the Wonder House.
        - id: ch01-b35
          speaker: narrator
          text: Kim gave him no respectful title, for he could not guess the stranger's faith.
        - id: ch01-b36
          speaker: lama
          text: Ah, the Wonder House. May anyone go inside?
        - id: ch01-b37
          speaker: kim
          text: It says so above the door. Everyone may enter.
        - id: ch01-b38
          speaker: lama
          text: Must one pay?
        - id: ch01-b39
          speaker: kim
          text: I go in and out, and I am certainly no banker.
        - id: ch01-b40
          speaker: lama
          text: Ah, I am old and did not know.
        - id: ch01-b41
          speaker: narrator
          text: He touched his rosary and half turned toward the Museum.
        - id: ch01-b42
          speaker: kim
          text: What caste are you? Where is your home? Have you traveled far?
        - id: ch01-b43
          speaker: lama
          text: I came through Kulu from beyond Kailas. But what would you know of that? I come from hills where the air and water are fresh and cool.
        - id: ch01-b44
          speaker: narrator
          text: He sighed for those hills.
        - id: ch01-b45
          speaker: abdullah
          text: Aha! A Chinaman!
        - id: ch01-b46
          speaker: narrator
          text: Abdullah sounded proud of his answer. Once, Fook Shing had chased him from the boot shop for spitting at the little god above the boots.
        - id: ch01-b47
          speaker: chota_lal
          text: He is a hillman.
        - id: ch01-b48
          speaker: lama
          text: Yes, child, a hillman from hills you will never see. Have you heard of Tibet? I am not Chinese. I am Tibetan, since you wish to know. I am a lama, or what you would call a guru.
        - id: ch01-b49
          speaker: kim
          text: A guru from Tibet! I have never met one. Are the people in Tibet Hindus, then?
        - id: ch01-b50
          speaker: lama
          text: We follow the Middle Way and live peacefully in our monasteries. Before I die, I am going to see the Four Holy Places. Now you children know as much as this old man knows.
        - id: ch01-b51
          speaker: narrator
          text: He smiled kindly at them.
        - id: ch01-b52
          speaker: kim
          text: Have you eaten?
        - id: ch01-b53
          speaker: narrator
          text: The lama reached inside his robe and brought out a worn wooden begging bowl. The boys nodded. Every priest they knew begged for food.
        - id: ch01-b54
          speaker: lama
          text: I do not want food yet. Tell me, is it true that the Wonder House of Lahore holds many sacred images?
        - id: ch01-b55
          speaker: narrator
          text: He repeated the Museum's name carefully, as if checking an address.
        - id: ch01-b56
          speaker: abdullah
          text: It is true. The place is full of heathen idols. You worship idols too.
        - id: ch01-b57
          speaker: kim
          text: Pay no attention to him. It is the Government's house, so no one worships idols there. Only a white-bearded Sahib looks after it. Come, and I will show you.
        - id: ch01-b58
          speaker: chota_lal
          text: Strange priests eat boys.
        - id: ch01-b59
          speaker: abdullah
          text: And he is a foreign idol worshiper.
        - id: ch01-b60
          speaker: kim
          text: He is something new. Run back to your mothers if you want to be safe. Come with me!
        - id: ch01-b61
          speaker: narrator
          text: Kim clicked through the counting turnstile, and the lama followed. He stopped in amazement inside the entrance hall. Large Greco-Buddhist figures stood all around them, carved long ago by forgotten hands that had somehow caught the touch of Greek art. Hundreds of stone pieces filled the hall. There were raised processions, broken statues, and slabs crowded with figures, all dug from the old Buddhist shrines and monasteries of the North Country and carefully labeled for the Museum.
        - id: ch01-b62
          speaker: narrator
          text: The lama turned from one treasure to another with his mouth open. At last he stood still before a great carving of the Lord Buddha seated upon a deeply cut lotus. Kings, elders, and Buddhas of former times adored him. Below lay lotus-covered water, fishes, and birds. Two winged spirits held a wreath above his head, while another pair raised an umbrella topped by the jeweled headdress of the Bodhisat.
        - id: ch01-b63
          speaker: lama
          text: The Lord! The Lord! It is Sakya Muni himself. To Him who found the Way and the Law, whom Maya carried beneath her heart, Ananda's Lord, the Bodhisat.
        - id: ch01-b64
          speaker: narrator
          text: The lama's voice broke into a half sob, then sank to a whisper as he spoke the Buddhist prayer.
        - id: ch01-b65
          speaker: lama
          text: He is here, and the Most Excellent Law is here too. My pilgrimage has begun well. And this work! What marvelous work!
        - id: ch01-b66
          speaker: kim
          text: There is the Sahib.
        - id: ch01-b67
          speaker: narrator
          text: Kim slipped sideways among the display cases in the arts and manufactures wing. The white-bearded English Curator had been watching the lama. The old pilgrim turned, greeted him gravely, and after much searching produced a notebook and a scrap of paper.
        - id: ch01-b68
          speaker: curator
          text: Yes, that is my name.
        - id: ch01-b69
          speaker: narrator
          text: He smiled at the large, childish writing.
        - id: ch01-b70
          speaker: lama
          text: A pilgrim who visited the Holy Places gave it to me. He is now the abbot of Lung-Cho Monastery. He told me about all these things.
        - id: ch01-b71
          speaker: narrator
          text: His thin hand trembled as he pointed around the hall.
        - id: ch01-b72
          speaker: curator
          text: Then welcome, lama from Tibet. Here are the images, and I am here to gather knowledge. Come and sit in my office for a while.
        - id: ch01-b73
          speaker: narrator
          text: Excitement shook the old man. The office was only a little wooden room divided from the gallery of sculptures. Kim lay down outside with his ear against a crack in the cedar door, split by the heat. Trusting his instinct, he stretched out to listen and watch.
        - id: ch01-b74
          speaker: narrator
          text: Much of their talk passed far above Kim's understanding. Slowly at first, the lama described his monastery, Such-zen, across from the Painted Rocks and four months' march away. The Curator opened a huge book of photographs and showed him that very monastery on its crag above a vast valley striped with many colors.
        - id: ch01-b75
          speaker: lama
          text: Yes, yes! There is the little door where we carry in wood before winter. And you Englishmen know these places? The present abbot of Lung-Cho told me so, but I did not believe him. Is the Excellent One honored here too? Do you know the story of His life?
        - id: ch01-b76
          speaker: narrator
          text: The lama put on horn-rimmed spectacles made in China and bent close to the picture.
        - id: ch01-b77
          speaker: curator
          text: His whole story is carved on these stones. When you are rested, come and see it.
        - id: ch01-b78
          speaker: narrator
          text: The lama shuffled back into the main hall with the Curator beside him. He looked with a worshiper's reverence and a craftsman's knowing eye. On the worn stones he recognized one event after another from the beautiful story. Greek ways of showing the scenes sometimes puzzled him, because they were unlike the forms he knew from his own monastery. Even so, every discovery delighted him like a child finding a fresh treasure. When the carved sequence broke and part of the story was missing, as it did at the Annunciation, the Curator supplied the lost event from piles of French and German books filled with photographs and careful copies.
        - id: ch01-b79
          speaker: narrator
          text: They found the holy Asita holding the infant on his knee while the child's parents listened. They found tales of the cousin Devadatta, and the wicked woman whose false charge against the Master was exposed. They saw the teaching in the Deer Park, the miracle before the fire worshipers, the Bodhisat living as a prince, his miraculous birth, and his death at Kusinagara, where a weak disciple fainted. Again and again the stones showed meditation beneath the Bodhi tree, while images of people honoring the begging bowl appeared everywhere.
        - id: ch01-b80
          speaker: narrator
          text: Before long, the Curator understood that this visitor was no ignorant beggar counting beads. The lama was a true scholar. So they began again. The lama took snuff, wiped his spectacles, and poured out a swift mixture of Urdu and Tibetan. He knew of the journeys of the Chinese pilgrims Fu-Hiouen and Hwen-Tsiang and desperately wanted a translation of their records.
        - id: ch01-b81
          speaker: lama
          text: It is all here, but the treasure is locked away from me.
        - id: ch01-b82
          speaker: narrator
          text: He helplessly turned the pages of books by Beal and Stanislas Julien. Then he settled himself respectfully and listened while the Curator quickly put pieces into Urdu. For the first time, the lama heard how European scholars had compared those writings with many others and identified Buddhism's Holy Places.
        - id: ch01-b83
          speaker: narrator
          text: Next the Curator unfolded a mighty map, marked and crossed with yellow. The lama's brown finger followed the Curator's pencil. Here was Kapilavastu. Here lay the Middle Kingdom. Here was Mahabodhi, Buddhism's great center, and there stood sad Kusinagara, where the Holy One died. The lama bowed over the map in silence. The Curator lit another pipe. Kim fell asleep, and when he woke their overflowing talk had reached matters he could understand.
        - id: ch01-b84
          speaker: lama
          text: And so, Fountain of Wisdom, I chose to visit every Holy Place touched by His feet. I will go to the Birthplace at Kapila, then to Mahabodhi at Buddh Gaya, to the Monastery, the Deer Park, and the place where He died.
        - id: ch01-b85
          speaker: lama
          text: I have come alone. For five years, seven, eighteen, perhaps forty, I have felt that we no longer follow the Old Law well. Devils, charms, and idols have covered it. Even the child outside saw that and called it idol worship.
        - id: ch01-b86
          speaker: curator
          text: That happens to every faith.
        - id: ch01-b87
          speaker: lama
          text: Do you think so? I read my monastery's books until they seemed like dry pith. The later rituals of our Reformed Law have no value to these old eyes either. Even followers of the Excellent One quarrel among themselves. It is all illusion, all maya. But I seek something more.
        - id: ch01-b88
          speaker: narrator
          text: His deeply lined face came within inches of the Curator's. One long fingernail tapped the table.
        - id: ch01-b89
          speaker: lama
          text: Your scholars used these books to follow the Blessed Feet through all His journeys, but there are things they never searched for. I know nothing, truly nothing. Yet I mean to leave the Wheel of Things by a broad, open road. A pilgrimage to the Holy Places earns merit, but there is more. Listen to a true story. When our Lord was young and sought a wife, men at His father's court said He was too gentle for marriage. You know this?
        - id: ch01-b90
          speaker: narrator
          text: The Curator nodded and wondered where the story would lead.
        - id: ch01-b91
          speaker: lama
          text: They gave Him three trials of strength against every challenger. At the trial of the bow, He broke the bow they first brought Him. Then He called for one no other man could bend. You know that too?
        - id: ch01-b92
          speaker: curator
          text: Yes. It is written, and I have read it.
        - id: ch01-b93
          speaker: lama
          text: His arrow flew beyond every other mark and vanished from sight. At last it struck the ground. A stream sprang from that spot and grew into a River. Through our Lord's goodness and the merit He earned before gaining freedom, anyone who bathes there is washed clean of every stain of sin.
        - id: ch01-b94
          speaker: curator
          text: So the story says.
        - id: ch01-b95
          speaker: narrator
          text: Sadness entered the Curator's voice. The lama drew a long breath.
        - id: ch01-b96
          speaker: lama
          text: Where is that River? Fountain of Wisdom, where did the arrow fall?
        - id: ch01-b97
          speaker: curator
          text: My brother, I am sorry. I do not know.
        - id: ch01-b98
          speaker: lama
          text: Please do not hide the one thing you have not told me. Surely you must know. I am old, and I ask with my head at your feet. We know He drew the bow. We know the arrow fell. We know the stream burst out. Then where is the River? A dream commanded me to find it, and that is why I came. I am here now. Where is it?
        - id: ch01-b99
          speaker: curator
          text: If I knew, would I not tell the whole world?
        - id: ch01-b100
          speaker: lama
          text: That River frees a person from the Wheel of Things. Think once more. Could it be some small stream that dries in the hot season? The Holy One would never deceive an old man this way.
        - id: ch01-b101
          speaker: curator
          text: I do not know. I truly do not know.
        - id: ch01-b102
          speaker: narrator
          text: The lama brought his wrinkled face close again.
        - id: ch01-b103
          speaker: lama
          text: I see now that you do not know. Because you do not follow the Law, this matter is hidden from you.
        - id: ch01-b104
          speaker: curator
          text: Yes. It is hidden.
        - id: ch01-b105
          speaker: lama
          text: You and I are both bound, brother. But I am going to cut myself free. Come with me!
        - id: ch01-b106
          speaker: narrator
          text: He rose, sweeping his heavy robe around him.
        - id: ch01-b107
          speaker: curator
          text: I am bound here. Where will you go?
        - id: ch01-b108
          speaker: lama
          text: First to Kashi, of course. In a Jain temple there I will meet a secret Seeker of the pure faith. Perhaps he can teach me something, and perhaps he will come to Buddh Gaya. Then I will travel north and west to Kapilavastu. I will search for the River there, and everywhere along the way, because no one knows where the arrow landed.
        - id: ch01-b109
          speaker: curator
          text: How will you travel? Delhi is far, and Benares is farther still.
        - id: ch01-b110
          speaker: lama
          text: I will use the road and the trains. After leaving the hills, I came from Pathankot in a train. It moved very fast. At first those tall poles beside the track amazed me. They kept bending down and snatching up their wires as we rushed past. Later I felt cramped and wished to walk as I usually do.
        - id: ch01-b111
          speaker: curator
          text: Are you certain you know the way?
        - id: ch01-b112
          speaker: lama
          text: One asks a question and pays money. Then the appointed people send everyone to the appointed place. Reliable travelers told us that much at my monastery.
        - id: ch01-b113
          speaker: narrator
          text: The lama spoke proudly.
        - id: ch01-b114
          speaker: curator
          text: When will you leave?
        - id: ch01-b115
          speaker: narrator
          text: The Curator smiled at this mixture of ancient devotion and modern travel.
        - id: ch01-b116
          speaker: lama
          text: As soon as I can. I will follow the places of His life until I reach the River of the Arrow. There is also a printed paper that lists the times of the southbound trains.
        - id: ch01-b117
          speaker: curator
          text: And how will you find food?
        - id: ch01-b118
          speaker: narrator
          text: Lamas usually carried money somewhere in their robes, but the Curator wanted to be certain.
        - id: ch01-b119
          speaker: lama
          text: For this journey I will carry the Master's begging bowl. I will go as He went and leave the comfort of my monastery. A disciple came with me from the hills and begged as our Rule requires. But while we rested in Kulu, fever took him and he died. I have no disciple now. I will carry the bowl myself and let charitable people earn merit.
        - id: ch01-b120
          speaker: narrator
          text: He nodded bravely. Learned monastery doctors did not beg, but this search had filled him with enthusiasm.
        - id: ch01-b121
          speaker: curator
          text: Very well. Now let me earn some merit. You and I are craftsmen together. Here is a new notebook of white English paper, and here are several sharp pencils, thick and thin, all fit for a scribe. Now lend me your spectacles.
        - id: ch01-b122
          speaker: narrator
          text: The Curator looked through the scratched lenses. Their strength nearly matched his own, so he placed his own pair in the lama's hand.
        - id: ch01-b123
          speaker: curator
          text: Try these.
        - id: ch01-b124
          speaker: lama
          text: They are as light as a feather on my face. I can hardly feel them. And how clearly I see!
          emotion: happy
        - id: ch01-b125
          speaker: narrator
          text: Delighted, he turned his head and wrinkled his nose.
        - id: ch01-b126
          speaker: curator
          text: The lenses are crystal, so they will never scratch. They are yours. May they help you find your River.
        - id: ch01-b127
          speaker: lama
          text: I accept the spectacles, the pencils, and the white notebook as signs of friendship between one priest and another. And now I have something for you.
        - id: ch01-b128
          speaker: narrator
          text: He unfastened the open iron pencil case from his belt and laid it on the table.
        - id: ch01-b129
          speaker: lama
          text: Keep my pencil case so that we remember one another. It is old, just as I am.
        - id: ch01-b130
          speaker: narrator
          text: The case was an ancient Chinese design made from a kind of iron no longer smelted. The collector inside the Curator had wanted it from the first, and nothing he said could persuade the lama to take it back.
        - id: ch01-b131
          speaker: lama
          text: When I return after finding the River, I will bring you a painted writing of Padma Samthora, like those I made on silk at the monastery. I will bring the Wheel of Life too, because we are craftsmen together, you and I.
        - id: ch01-b132
          speaker: narrator
          text: The lama chuckled. The Curator wanted to keep him longer, for few people still knew the old method of making Buddhist pictures that were half writing and half drawing. But the lama walked out with his head high. He paused before a great meditating Bodhisat, then passed through the turnstiles.
        - id: ch01-b133
          speaker: narrator
          text: Kim followed like a shadow. Everything he had overheard thrilled him. This man was unlike anyone in his experience, and Kim meant to study him as carefully as a strange festival or a new building in Lahore. He wanted to know how the lama would find food, where he would sleep, how he would travel, and what might happen when such an innocent old stranger met the road. The lama was a treasure Kim had found, and he planned to claim him before anyone else did. That was the Irish part of Kim coming to the surface, for his mother had been Irish too.
        - id: ch01-b134
          speaker: narrator
          text: Beside Zam-Zammah the old man stopped and searched until he saw Kim. For the moment, the great purpose of his pilgrimage had faded. He felt old, lonely, and very hungry.
        - id: ch01-b135
          speaker: policeman
          text: Do not sit beneath that gun.
        - id: ch01-b136
          speaker: kim
          text: Be quiet, you owl! He may sit there if he chooses. Tell me, Dunnoo, when did you steal the milk woman's slippers?
        - id: ch01-b137
          speaker: narrator
          text: Kim had invented the charge on the spot. Still, it silenced Dunnoo, who knew one clear yell from Kim could summon a whole army of troublesome bazaar boys.
        - id: ch01-b138
          speaker: kim
          text: Who did you worship inside?
        - id: ch01-b139
          speaker: narrator
          text: Kim squatted pleasantly beside the lama in the shade.
        - id: ch01-b140
          speaker: lama
          text: I worshiped no one, child. I bowed before the Excellent Law.
        - id: ch01-b141
          speaker: narrator
          text: Kim accepted this unfamiliar god without surprise. He already knew dozens.
        - id: ch01-b142
          speaker: kim
          text: What will you do now?
        - id: ch01-b143
          speaker: lama
          text: I will beg. Now I remember that I have gone a long time without food or water. How do people ask for charity in this city? Do they stand silently, as we do in Tibet, or call aloud?
        - id: ch01-b144
          speaker: kim
          text: Those who beg in silence also starve in silence.
        - id: ch01-b145
          speaker: narrator
          text: The lama tried to rise but sank back with a sigh, thinking of the disciple who had died far away in Kulu. Kim tilted his head and watched with growing interest.
        - id: ch01-b146
          speaker: kim
          text: Give me your bowl. I know everyone in this city who gives to beggars. Hand it over, and I will bring it back full.
        - id: ch01-b147
          speaker: narrator
          text: Trusting him as simply as a child, the old man passed over the bowl.
        - id: ch01-b148
          speaker: kim
          text: You rest here. I know these people.
        - id: ch01-b149
          speaker: narrator
          text: Kim ran to the open stall of a low-caste vegetable seller across from the tramway in Motee Bazar. She knew him well.
        - id: ch01-b150
          speaker: vegetable_seller
          text: Oh! Have you become a holy beggar now, carrying that bowl?
        - id: ch01-b151
          speaker: kim
          text: No. A new priest has come to the city, and I have never seen anyone like him.
        - id: ch01-b152
          speaker: vegetable_seller
          text: An old priest means a young tiger to feed! I am sick of new priests. They land on my goods like flies. Do you think my husband is an endless well of charity?
          emotion: angry
        - id: ch01-b153
          speaker: kim
          text: No. Your husband is more bad-tempered than holy. But this priest is truly new. The Sahib in the Wonder House spoke to him like a brother. Mother, please fill the bowl. He is waiting.
        - id: ch01-b154
          speaker: vegetable_seller
          text: Fill that enormous basket? You have all the grace of Shiva's sacred bull. That beast already stole the best onions this morning, and now I must fill your bowl. Look, here he comes again!
        - id: ch01-b155
          speaker: narrator
          text: The ward's huge gray Brahmini bull pushed through the bright crowd with a stolen plantain hanging from his mouth. He knew his sacred privileges and headed straight for the shop. Lowering his head, he blew across the baskets while choosing what to take. Kim's hard bare heel flew up and struck his wet blue nose. With an offended snort, the bull crossed the tram rails and walked away, his hump shaking with rage.
        - id: ch01-b156
          speaker: kim
          text: See? I saved you three times the price of one bowl. Now give me a little rice, dried fish, and some vegetable curry on top.
        - id: ch01-b157
          speaker: narrator
          text: A growl came from her husband, who lay behind the shop.
        - id: ch01-b158
          speaker: vegetable_seller
          text: He drove away the bull. Giving to the poor is a good deed.
        - id: ch01-b159
          speaker: narrator
          text: She spoke softly toward the back, then filled the bowl with hot rice.
        - id: ch01-b160
          speaker: kim
          text: My holy man is not a cow. A little curry would be good, and a fried cake. I think a bite of preserve would please him too.
        - id: ch01-b161
          speaker: narrator
          text: Kim dug a hollow in the rice with his fingers.
        - id: ch01-b162
          speaker: vegetable_seller
          text: That hole is as large as your head!
        - id: ch01-b163
          speaker: narrator
          text: Though she complained, she filled it with steaming vegetable curry. She added a fried cake, a dab of clarified butter, and a lump of sour tamarind preserve. Kim gazed lovingly at the food.
        - id: ch01-b164
          speaker: kim
          text: Good. Whenever I am in the bazaar, that bull will stay away from your shop. He is a shameless beggar.
        - id: ch01-b165
          speaker: vegetable_seller
          text: And what are you? But do not insult bulls. Did you not say a Red Bull would someday come from a field to help you? Carry that carefully. Ask the holy man to bless me. Maybe he knows a cure for my daughter's sore eyes, so ask him that as well, Little Friend of all the World.
        - id: ch01-b166
          speaker: narrator
          text: Kim danced away before she finished, dodging hungry friends and stray dogs.
        - id: ch01-b167
          speaker: kim
          text: This is how people beg when they know the proper way. Eat now, and I will eat with you. Ho, water carrier! Bring water. We men are thirsty.
        - id: ch01-b168
          speaker: water_carrier
          text: We men, is it? Will one whole skin of water be enough for such a pair? Drink, then, in the name of the Compassionate.
        - id: ch01-b169
          speaker: narrator
          text: Laughing, the water carrier poured a narrow stream into Kim's cupped hands. Kim drank in the local fashion. The lama drew a cup from the seemingly endless folds of his robe and drank with ceremony.
        - id: ch01-b170
          speaker: kim
          text: He is a foreigner.
        - id: ch01-b171
          speaker: narrator
          text: The lama answered the water carrier with a blessing in an unknown tongue. Then he and Kim ate happily together until the bowl was clean. The lama took snuff from a huge wooden gourd, moved his fingers along his rosary, and fell into the easy sleep of old age as Zam-Zammah's shadow lengthened.
        - id: ch01-b172
          speaker: narrator
          text: Kim wandered to a tobacco seller, a lively young Mohammedan woman, and begged a harsh cigar of the kind sold to university students who copied English habits. He smoked beneath the gun with his knees drawn to his chin and thought. Then he suddenly slipped away toward Nila Ram's timber yard.
        - id: ch01-b173
          speaker: narrator
          text: The lama slept until lamps began to shine and white-robed clerks returned from Government offices. He woke and stared around in confusion. No one noticed him except a Hindu street boy in a dirty turban and dusty yellow-brown clothes. The old man suddenly bowed his head onto his knees and wailed.
        - id: ch01-b174
          speaker: kim
          text: What has happened? Did someone rob you?
        - id: ch01-b175
          speaker: lama
          text: My new disciple has left me, and I do not know where he has gone.
          emotion: sad
        - id: ch01-b176
          speaker: kim
          text: What kind of person was this disciple?
        - id: ch01-b177
          speaker: lama
          text: He was a boy who came in place of the disciple who died. Perhaps he was sent because I earned merit by bowing before the Law in that house. He found me when I had lost my way. He led me inside and gave me courage to speak to the Keeper of the Images. That meeting cheered me and made me strong. When hunger weakened me, he begged food as a disciple should. He came suddenly, and now he has suddenly gone. I meant to teach him the Law while we traveled to Benares.
        - id: ch01-b178
          speaker: narrator
          text: Kim was astonished. He had heard the Museum conversation and knew the lama was telling the exact truth, something a traveler rarely offered to a stranger on the road.
        - id: ch01-b179
          speaker: lama
          text: Now I understand. He was sent only for that purpose. It is a sign that I will find the River I seek.
        - id: ch01-b180
          speaker: kim
          text: You mean the River of the Arrow?
        - id: ch01-b181
          speaker: narrator
          text: Kim smiled as if he knew more than the old man.
        - id: ch01-b182
          speaker: lama
          text: Is this another Sending? I told no one about my search except the Priest of the Images. Who are you?
          emotion: surprised
        - id: ch01-b183
          speaker: kim
          text: I am your disciple. Never in my life have I met anyone like you. I will go with you to Benares. Besides, an old man who tells the truth to strangers after dark badly needs a disciple.
        - id: ch01-b184
          speaker: lama
          text: But the River of the Arrow? Do you know where it is?
        - id: ch01-b185
          speaker: kim
          text: No. I heard you tell the Englishman about it because I was lying beside the door.
        - id: ch01-b186
          speaker: narrator
          text: The lama sighed.
        - id: ch01-b187
          speaker: lama
          text: I thought you might be a guide sent to me. Such blessings sometimes happen, but I am not worthy of one. So you do not know my River?
        - id: ch01-b188
          speaker: kim
          text: No.
        - id: ch01-b189
          speaker: narrator
          text: Kim laughed, though not quite comfortably.
        - id: ch01-b190
          speaker: kim
          text: I am searching for something too. I must find a Red Bull on a green field, and that Bull will help me.
        - id: ch01-b191
          speaker: narrator
          text: Like any boy hearing another person's grand plan, Kim quickly brought forward one of his own. He truly had spent as much as twenty minutes at a time thinking about his father's prophecy.
        - id: ch01-b192
          speaker: lama
          text: What will the Bull help you do, child?
        - id: ch01-b193
          speaker: kim
          text: God knows. That is what my father told me. I heard you speak of strange new places in the hills. If someone as old, small, and truthful as you can travel for a mere river, then I should travel too. If fate means us to find these things, we will. You will find your River. I will find my Bull, the Strong Pillars, and some other things I have forgotten.
        - id: ch01-b194
          speaker: lama
          text: I seek freedom from a Wheel, not pillars.
        - id: ch01-b195
          speaker: kim
          text: It is all the same. Perhaps they will make me a king.
        - id: ch01-b196
          speaker: narrator
          text: Kim was calmly ready for any possibility.
        - id: ch01-b197
          speaker: lama
          text: On the road I will teach you to want better things. Let us leave for Benares.
        - id: ch01-b198
          speaker: kim
          text: Not at night. Thieves are out now. We should wait for daylight.
        - id: ch01-b199
          speaker: lama
          text: But we have nowhere to sleep.
        - id: ch01-b200
          speaker: narrator
          text: The lama obeyed his monastery's rule and slept on the ground, but he still preferred order and decency.
        - id: ch01-b201
          speaker: kim
          text: We can sleep well at the Kashmir Serai. I have a friend there. Come along!
        - id: ch01-b202
          speaker: narrator
          text: The hot, crowded bazaars blazed with lamps as they pushed among all the peoples of Upper India. The lama moved through them like a dreamer. He had never known a great manufacturing city, and a packed tram with screaming brakes frightened him. Half pushed and half pulled, he reached the high gate of the Kashmir Serai across from the railway station.
        - id: ch01-b203
          speaker: narrator
          text: The serai was a huge open square ringed by arched cloisters, where camel and horse caravans rested after returning from Central Asia. Every corner held people from the North in different clothes and colors. They tended tethered ponies and made kneeling camels groan back to their feet. Men shifted bales and bundles from one back to another. Others drew water for the evening meal from groaning well windlasses, piled grass before wild-eyed stallions that screamed at one another, and struck at bad-tempered caravan dogs. Camel drivers were paid off, fresh grooms were hired, and shouting, joking, cursing, bargaining, and argument rolled together across the crowded yard.
        - id: ch01-b204
          speaker: narrator
          text: A few stone steps led to the cloisters, which offered shelter from the storm of men and animals. Traders rented most of those arches. Brick or boards closed the gaps between pillars to make rooms with heavy doors and enormous local padlocks. A locked door meant its owner was traveling, and rough messages named the place. One said Lutuf Ullah had gone to Kurdistan. Beneath it, someone had written a rude verse asking why Allah let that particular louse live so long.
        - id: ch01-b205
          speaker: narrator
          text: Kim shielded the lama from excited beasts and men as they edged toward the far end by the station. Mahbub Ali, the horse trader, stayed there whenever he returned from the mysterious country beyond the northern passes.
        - id: ch01-b206
          speaker: narrator
          text: Kim had often dealt with Mahbub between the ages of ten and thirteen. The large Afghan dyed his graying beard bright red with lime because he was old and did not want anyone to see the gray. He valued the boy's gift for gathering talk. Sometimes he ordered Kim to watch a man who had nothing whatever to do with horses. Kim would follow that man for a whole day, remembering every turn and every meeting. At night he told Mahbub each person the man had spoken with, while the horse trader listened without a word, a nod, or any other sign.
        - id: ch01-b207
          speaker: narrator
          text: Kim knew it was another kind of intrigue. The important thing was never to mention it to anyone else. In return, Mahbub bought him beautiful hot meals from the cookshop and once paid him a whole eight annas.
        - id: ch01-b208
          speaker: kim
          text: He is here. Ho, Mahbub Ali!
        - id: ch01-b209
          speaker: narrator
          text: Kim struck an ill-tempered camel on the nose, stopped at a dark arch, and slipped behind the confused lama. Mahbub lay on silk carpet saddlebags with his embroidered Bokhara belt loosened, drawing lazily on an enormous silver hookah. At the call he barely turned his head. Seeing only the tall silent lama, he chuckled deep in his chest.
        - id: ch01-b210
          speaker: mahbub
          text: Allah! A lama, and a Red Lama at that. Lahore lies far from the passes. What are you doing here?
        - id: ch01-b211
          speaker: narrator
          text: The lama held out his begging bowl without thinking.
        - id: ch01-b212
          speaker: mahbub
          text: God's curse on unbelievers! I give nothing to a lousy Tibetan. Ask my Baltis behind the camels. Perhaps they value your blessings. Horseboys, here is one of your countrymen. Find out whether he is hungry.
        - id: ch01-b213
          speaker: narrator
          text: One shaven Balti horseboy crouched before the priest. He was called a Buddhist, though not a very good one, and in thick mountain speech begged the Holy One to join their fire.
        - id: ch01-b214
          speaker: balti
          text: Holy One, please come and sit beside the horseboys' fire.
        - id: ch01-b215
          speaker: kim
          text: Go with him.
        - id: ch01-b216
          speaker: narrator
          text: Kim gave the lama a gentle push. The old man walked away, leaving the boy at the cloister's edge.
        - id: ch01-b217
          speaker: mahbub
          text: You go too, little Hindu. Beg from the men among my horses. Some of my followers must share your faith.
        - id: ch01-b218
          speaker: narrator
          text: Mahbub returned to his hookah.
        - id: ch01-b219
          speaker: kim
          text: Great lord, my father is dead, my mother is dead, and my stomach is empty.
        - id: ch01-b220
          speaker: narrator
          text: Kim whined in the Hindu manner and enjoyed every moment of the trick.
        - id: ch01-b221
          speaker: mahbub
          text: I told you to ask my horsemen. There must be Hindus among them.
        - id: ch01-b222
          speaker: kim
          text: Oh, Mahbub Ali, am I really a Hindu?
        - id: ch01-b223
          speaker: narrator
          text: Kim spoke in English. The trader showed no surprise but looked at him from under his thick eyebrows.
        - id: ch01-b224
          speaker: mahbub
          text: Little Friend of all the World, what game is this?
        - id: ch01-b225
          speaker: kim
          text: No game. I am that holy man's disciple now. We are making a pilgrimage to Benares, or so he says. He is completely mad, and I am tired of Lahore. I want new air and water.
        - id: ch01-b226
          speaker: mahbub
          text: Who sent you? Why have you come to me?
        - id: ch01-b227
          speaker: narrator
          text: Suspicion hardened Mahbub's voice.
        - id: ch01-b228
          speaker: kim
          text: Who else would I ask? I have no money, and traveling without money is foolish. You will sell many of these fine new horses to the officers. Give me a rupee. When I become rich, I will sign a bond and repay you.
        - id: ch01-b229
          speaker: narrator
          text: Mahbub thought quickly.
        - id: ch01-b230
          speaker: mahbub
          text: You have never lied to me before. Call the lama back, then stand in the darkness.
        - id: ch01-b231
          speaker: kim
          text: Our stories will agree.
        - id: ch01-b232
          speaker: narrator
          text: Kim laughed. When the lama understood Mahbub's questions, he answered at once.
        - id: ch01-b233
          speaker: lama
          text: We are going to Benares, the boy and I. I seek a certain River.
        - id: ch01-b234
          speaker: mahbub
          text: Perhaps you are. But what about the boy?
        - id: ch01-b235
          speaker: lama
          text: He is my disciple. I believe he was sent to guide me to the River. I was sitting beneath a gun when he suddenly appeared. Guidance sometimes comes that way to fortunate men. But now I remember that he said he belonged to this world and was a Hindu.
        - id: ch01-b236
          speaker: mahbub
          text: What is his name?
        - id: ch01-b237
          speaker: lama
          text: I did not ask. Is he not my disciple?
        - id: ch01-b238
          speaker: mahbub
          text: What country and people does he come from? What is his village? Is he Muslim, Sikh, Hindu, or Jain? Is his caste high or low?
        - id: ch01-b239
          speaker: lama
          text: Why should I ask those things? On the Middle Way there is no high or low. If he is my disciple, can anyone take him from me? Without him, I will never find my River.
        - id: ch01-b240
          speaker: narrator
          text: The lama wagged his head solemnly.
        - id: ch01-b241
          speaker: mahbub
          text: No one will take him. Go and sit with my Baltis.
        - id: ch01-b242
          speaker: narrator
          text: Comforted by the promise, the lama drifted away.
        - id: ch01-b243
          speaker: kim
          text: You see how mad he is. Why would I lie to you, Hajji?
        - id: ch01-b244
          speaker: narrator
          text: Mahbub smoked in silence, then lowered his voice almost to a whisper.
        - id: ch01-b245
          speaker: mahbub
          text: If you truly go to Benares, Umballa lies along the road.
        - id: ch01-b246
          speaker: kim
          text: I told you, he does not know how to lie the way we do.
        - id: ch01-b247
          speaker: mahbub
          text: Carry a message to Umballa for me, and I will pay you. It concerns a white stallion I sold to an officer after my last journey from the passes. The horse's pedigree was uncertain, and the officer asked me to settle the matter.
        - id: ch01-b248
          speaker: narrator
          text: Mahbub described both the stallion and the officer.
        - id: ch01-b249
          speaker: mahbub
          text: Tell the officer, “The pedigree of the white stallion is fully established.” Then he will know I sent you. He will ask what proof you have. Answer, “Mahbub Ali gave me the proof.”
        - id: ch01-b250
          speaker: kim
          text: All this trouble for one white stallion?
        - id: ch01-b251
          speaker: narrator
          text: Kim giggled, and his eyes shone.
        - id: ch01-b252
          speaker: mahbub
          text: I will give you that pedigree now, along with some harsh words. Stand closer and hold your hands out like a beggar.
        - id: ch01-b253
          speaker: narrator
          text: A shadow moved behind Kim near a feeding camel. Mahbub raised his voice.
        - id: ch01-b254
          speaker: mahbub
          text: Allah! Are you the only beggar in Lahore? Your mother is dead and your father is dead. So are everyone else's. Well, well.
        - id: ch01-b255
          speaker: narrator
          text: Pretending to feel about on the floor, Mahbub tossed him a piece of soft greasy Muslim bread.
        - id: ch01-b256
          speaker: mahbub
          text: Go sleep among my horseboys tonight, both you and the lama. Tomorrow I may find work for you.
        - id: ch01-b257
          speaker: narrator
          text: Kim slunk off biting the bread. Hidden inside, just as he expected, was a little packet of folded tissue paper wrapped in oilskin, along with three silver rupees, a magnificent payment. Smiling, he pushed the money and paper into the leather amulet case around his neck.
        - id: ch01-b258
          speaker: narrator
          text: Mahbub's Baltis had fed the lama generously, and the old man already slept in a corner of a stall. Kim lay beside him and laughed. He knew he had done Mahbub a service, and he did not believe for one moment that the secret concerned a horse's pedigree.
        - id: ch01-b259
          speaker: narrator
          text: Kim did not know that the Survey Department kept Mahbub Ali in one of its locked books under the name C25 IB. Two or three times a year, C25 sent them a plain little story. The writing was bare and simple, but its news was always fascinating. Officials checked it against separate statements from R17 and M4, and it generally proved true. His reports concerned distant mountain kingdoms that few outsiders ever saw. They followed explorers of nations other than England and traced the secret trade in guns. Each report was only a small part of a much greater mass of information received, but that information helped decide how the Indian Government acted.
        - id: ch01-b260
          speaker: narrator
          text: Recently, five kings had joined together when they had no business doing so. A friendly northern power warned them that news was leaking from their lands into British India. Their prime ministers became seriously angry and answered in the eastern fashion. They suspected many people, including the red-bearded horse trader whose caravans crossed their snowy mountain country.
        - id: ch01-b261
          speaker: narrator
          text: That season, attackers had twice ambushed Mahbub's caravan. His men killed three strange ruffians who might have been hired for the work. Mahbub therefore hurried past dangerous Peshawur and came straight to Lahore, expecting his countrymen to grow curious. More important, he carried something he wanted out of his hands without another hour's delay.
        - id: ch01-b262
          speaker: narrator
          text: It was the tight-folded tissue packet in its oilskin wrapper, with no address or person's name anywhere on it. Only five tiny pinholes marked one corner. Yet the statement scandalously exposed the five kings and the friendly northern power that encouraged them. It also betrayed a Hindu banker in Peshawur, a company of gun makers in Belgium, and an important half-independent Mohammedan ruler in the south. That final part was R17's work. Mahbub had collected it beyond the Dora Pass because circumstances had trapped R17 at his observation post. Beside C25's report, dynamite seemed harmless and milky. Even a man with a loose eastern sense of time could see the paper must reach the proper hands quickly.
        - id: ch01-b263
          speaker: narrator
          text: Mahbub had no wish to die violently just yet. Two or three family blood feuds still waited unfinished beyond the Border, and he intended to settle every one of those accounts first. After that, he planned to stop wandering and become a more or less virtuous citizen. Since reaching Lahore two days earlier, he had not once passed through the serai gate. Instead, he made a great public show of sending business telegrams. One went to Bombay, where he kept some of his money. Another went to the Delhi partner from his own clan who was selling horses to an agent of a Rajputana state. More messages went to the Englishman in Umballa who loudly demanded the white stallion's pedigree.
        - id: ch01-b264
          speaker: narrator
          text: A public letter writer who knew English composed polished messages for him. Mahbub told Creighton at Laurel Bank, Umballa, that the horse was Arabian as already described. He apologized sorrowfully for the delayed pedigree and claimed he was translating it. A later wire promised again to send it. To Lutuf Ullah, his partner in Delhi, he wrote that two thousand rupees had been placed to the man's credit at Luchman Narain's bank. Everything sounded exactly like ordinary horse trade. Still, people who thought the business concerned them discussed and discussed every word before a foolish Balti carried the telegrams toward the railway station and allowed all kinds of strangers to read them on the road.
        - id: ch01-b265
          speaker: narrator
          text: Mahbub liked to say he had stirred mud into the wells of inquiry. Then Kim dropped upon him as if sent from Heaven. Mahbub was quick, unscrupulous, and accustomed to sudden risks, so he hired the boy at once. A wandering lama with a low-caste servant might draw a glance while traveling through a land full of pilgrims, but no one would suspect them or think them worth robbing.
        - id: ch01-b266
          speaker: narrator
          text: Mahbub ordered a fresh coal for his hookah and considered the danger. If the worst happened and Kim was harmed, the unaddressed report would name no messenger. Mahbub could later travel slowly to Umballa and, though it might arouse fresh suspicion, repeat the information aloud. Yet R17's news was the heart of the affair, and losing it would cause grave trouble.
        - id: ch01-b267
          speaker: narrator
          text: Still, God was great, and Mahbub had done all he could. Kim was the one person who had never lied to him. That honesty would have been a terrible flaw if Mahbub had not known how beautifully Kim could lie to everyone else whenever his own purpose or Mahbub's work required it.
        - id: ch01-b268
          speaker: narrator
          text: Mahbub crossed the serai to the gate of the painted women who trapped unwary strangers. He took special care to visit the woman called the Flower of Delight. He had reason to think she was a particular friend of a smooth-faced Kashmiri pundit, the same man who had stopped Mahbub's simple Balti and drawn him into talk about the telegrams. Visiting her was a foolish act, but Mahbub went all the same. They began drinking perfumed brandy together, though the Prophet's law forbade it. Mahbub became magnificently drunk. His careful mouth opened, and words began to spill out. He chased the Flower across the cushions on unsteady feet until he fell flat. Then the Flower, helped by the smooth-faced pundit, searched him thoroughly from head to foot.
        - id: ch01-b269
          speaker: narrator
          text: At about the same time, Kim heard quiet footsteps inside Mahbub's empty stall. The horse trader had strangely left the door unlocked, while his men celebrated their return to India by feasting on a whole sheep. A polished young gentleman from Delhi entered with the keys the Flower had taken from Mahbub's belt. He searched every box, bundle, mat, and saddlebag even more carefully than the other two searched Mahbub himself.
        - id: ch01-b270
          speaker: flower
          text: I think he is nothing but an Afghan pig who cares only for horses and women. Besides, if such a thing ever existed, he may already have sent it away.
        - id: ch01-b271
          speaker: narrator
          text: An hour later, she rested one rounded elbow on Mahbub's snoring body and spoke with contempt.
        - id: ch01-b272
          speaker: pundit
          text: No. In a matter concerning Five Kings, he would keep it close to his black heart. Did you find nothing?
        - id: ch01-b273
          speaker: narrator
          text: The Delhi man entered, laughing as he adjusted his turban.
        - id: ch01-b274
          speaker: delhi_man
          text: I even cut between the soles of his slippers while the Flower searched his clothes. He is not our man. It must be someone else. Very little escapes me.
        - id: ch01-b275
          speaker: pundit
          text: No one claimed he was certainly the man. We were told to see whether he might be, because our plans are in danger.
        - id: ch01-b276
          speaker: flower
          text: The northern country has as many horse traders as an old coat has lice. Sikandar Khan, Nur Ali Beg, and Farrukh Shah all lead caravans and trade there.
        - id: ch01-b277
          speaker: pundit
          text: They have not arrived yet. You must trap them when they come.
        - id: ch01-b278
