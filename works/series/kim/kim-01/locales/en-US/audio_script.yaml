          text: Phew! I work hard for my money. Farrukh Shah is a bear, Ali Beg is a swaggering brute, and old Sikandar Khan—enough! Go away. I am going to sleep. This swine will not wake before dawn.
          emotion: disgusted
        - id: ch01-b279
          speaker: narrator
          text: At dawn, when Mahbub woke, the Flower lectured him sternly about drunkenness. Eastern men do not wink when they have beaten an enemy at his own game, but as Mahbub cleared his throat, tightened his belt, and stumbled into the early starlight, he nearly did.
        - id: ch01-b280
          speaker: mahbub
          text: What an old trick! Every girl in Peshawur knows it. Still, she played it prettily. God alone knows how many others on the road have orders to test me, perhaps with a knife. The boy must reach Umballa by train, because that writing is urgent. I will stay here, chase the Flower, and drink like an Afghan horse dealer should.
        - id: ch01-b281
          speaker: narrator
          text: He stopped at the stall beside his own. His men lay deep in sleep, and neither Kim nor the lama was there.
        - id: ch01-b282
          speaker: mahbub
          text: Wake up! Where are the lama and the boy who slept here last night? Is anything missing?
        - id: ch01-b283
          speaker: horseboy
          text: Nothing is missing. The old madman got up at the second cockcrow and said he was leaving for Benares. The boy led him away.
        - id: ch01-b284
          speaker: mahbub
          text: God's curse on every unbeliever!
        - id: ch01-b285
          speaker: narrator
          text: Mahbub said it with great feeling, then climbed into his stall, growling into his red beard.
        - id: ch01-b286
          speaker: narrator
          text: But Kim had awakened the lama. With one eye against a knothole in the wooden wall, he had watched the Delhi man search Mahbub's goods. This was no common thief. An ordinary burglar would not turn over letters, bills, and saddles, slide a little knife through the soles of slippers, or open saddlebag seams with such skill.
        - id: ch01-b287
          speaker: narrator
          text: At first Kim meant to give the long cry of “Thief! Thief!” that could set the whole serai blazing with alarm. Then he watched more closely. With one hand resting on his amulet, he reached his own conclusion.
        - id: ch01-b288
          speaker: kim
          text: He must be searching for the pedigree in that invented horse story, the thing I am carrying to Umballa. We had better leave now. Men who cut open bags with knives may soon cut open bellies too. And there is surely a woman behind this.
        - id: ch01-b289
          speaker: kim
          text: Hai! Wake up, but keep quiet. It is time for us to leave for Benares.
        - id: ch01-b290
          speaker: narrator
