audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 沉稳从容，像在讲一段古老而鲜活的往事
        timbre: 温暖清晰，略带沧桑
        pace: 舒缓而有变化
        pitch: 中低
    kim:
      display_name: 金
      tts:
        delivery: 机灵大胆，反应极快，带街头少年的顽皮
        timbre: 清亮灵活的少年声线
        pace: 偏快
        pitch: 中高
    opium_woman:
      display_name: 照料金的女人
      tts:
        delivery: 含混疲惫，偶尔流露伤感
        timbre: 沙哑暗沉
        pace: 缓慢
        pitch: 中低
    abdullah:
      display_name: 阿卜杜拉
      tts:
        delivery: 好胜活泼，孩子气十足
        timbre: 明亮的男孩声线
        pace: 偏快
        pitch: 中高
    chota_lal:
      display_name: 小乔塔·拉尔
      tts:
        delivery: 娇气尖锐，又好奇爱凑热闹
        timbre: 细亮的男孩声线
        pace: 偏快
        pitch: 高
    policeman:
      display_name: 警察敦努
      tts:
        delivery: 一本正经，却拿顽童没有办法
        timbre: 厚实粗粝
        pace: 中等
        pitch: 中低
    lama:
      display_name: 西藏喇嘛
      tts:
        delivery: 诚恳温厚，谈到正法时虔敬而热切
        timbre: 苍老柔和，带山地口音
        pace: 缓慢
        pitch: 中低
    curator:
      display_name: 博物馆馆长
      tts:
        delivery: 博学克制，对求知者亲切耐心
        timbre: 清楚温和的老年男声
        pace: 从容
        pitch: 中低
    vegetable_woman:
      display_name: 卖菜妇
      tts:
        delivery: 泼辣爽快，嘴硬心软
        timbre: 洪亮结实
        pace: 偏快
        pitch: 中
    water_carrier:
      display_name: 送水夫
      tts:
        delivery: 豪爽随和，带着笑意
        timbre: 粗犷明亮
        pace: 中等
        pitch: 中
    mahbub_ali:
      display_name: 马哈布·阿里
      tts:
        delivery: 老练警醒，表面粗豪，话里常藏着试探
        timbre: 浑厚低沉
        pace: 从容
        pitch: 低
    balti_groom:
      display_name: 巴尔蒂马倌
      tts:
        delivery: 恭顺质朴，带浓重山地口音
        timbre: 粗哑
        pace: 缓慢
        pitch: 中低
    groom:
      display_name: 马倌
      tts:
        delivery: 睡意朦胧，回答简短
        timbre: 粗沉
        pace: 缓慢
        pitch: 低
    flower_of_delight:
      display_name: 欢喜花
      tts:
        delivery: 圆滑妩媚，嘲讽时干脆冷淡
        timbre: 圆润成熟
        pace: 中等
        pitch: 中
    scholar:
      display_name: 克什米尔博学者
      tts:
        delivery: 谨慎阴冷，句句都在盘算
        timbre: 平滑克制
        pace: 稍慢
        pitch: 中低
    delhi_man:
      display_name: 德里来的年轻人
      tts:
        delivery: 自负利落，透着职业般的冷静
        timbre: 光滑清晰
        pace: 中等
        pitch: 中
  chapters:
    - id: ch01
      title: 第一章
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 走窄路的人啊，听我讲。地狱火会照着你，一直照到审判场。异教徒向镰仓大佛祈祷时，还请温和些，不要伤害他们。
        - id: ch01-b02
          speaker: narrator
          text: 金违抗了市政禁令，跨坐在赞—扎玛大炮上。炮架立在砖台上，正对着古老的阿杰布—盖尔。当地人这样称呼拉合尔博物馆，意思是奇珍馆。谁占有赞—扎玛，谁就占有旁遮普。这尊青铜大炮像一条喷火的巨龙，征服者进城以后，总要先把它抢到手。
        - id: ch01-b03
          speaker: narrator
          text: 金觉得自己坐在上面很有道理。英国人统治旁遮普，而他也是英国人，所以他一脚把拉拉·迪纳纳特家的孩子踢下了炮耳。可金晒得和本地人一样黑，平时宁愿说本地话。他的英语反而又短又硬，调子忽高忽低。他和市场里的小男孩从来不分高下。不过，他终究是个白人，而且是穷白人里最穷的那一种。
        - id: ch01-b04
          speaker: narrator
          text: 照料金的是个抽鸦片的混血女人。她在廉价马车候客的广场旁边，装作经营一家旧家具店，还告诉传教士，自己是金的姨妈。其实，金的母亲原先在一位上校家里当保姆，后来嫁给了金博尔·奥哈拉。奥哈拉是爱尔兰军团独行侠队的年轻掌旗军士。退伍以后，他在信德—旁遮普—德里铁路找了份差事，军团却把他留下，自己回国去了。
        - id: ch01-b05
          speaker: narrator
          text: 金的母亲在菲罗兹普尔死于霍乱。奥哈拉从此酗酒，带着眼尖的三岁孩子沿铁路四处漂荡。慈善会和牧师想抓住孩子，奥哈拉却一路躲开了。他遇见那个抽鸦片的女人，也染上了烟瘾，最后像印度的穷白人一样死去。留下来的只有三张纸。一张有他的签名，下面写着“不可更易”，所以他就这样称呼它。另一张是退役证明，第三张是金的出生证。
        - id: ch01-b06
          speaker: narrator
          text: 奥哈拉吞云吐雾、神采飞扬的时候，总说这三张纸早晚会叫小金博尔出人头地。金绝不能把它们弄丢，因为它们属于一场大法术。法术就在博物馆后面那座蓝白相间的高大贾杜—盖尔里施展。我们叫那里共济会会所，本地人却叫它魔法屋。他还说，金的角终有一天会高高扬在两根象征美与力量的柱子之间。上校本人会骑马来，带着全世界最精锐的军团照管金，让孩子过得比父亲好。只要那九百个一流的魔鬼还记得菲罗兹普尔铁路那个可怜的工头奥哈拉，他们就会来。那些魔鬼的神，是绿地上的一头红公牛。说到这里，奥哈拉总会坐在游廊的破藤椅里哭起来。
        - id: ch01-b07
          speaker: narrator
          text: 奥哈拉死后，女人把羊皮纸、证明书和出生证缝进一只皮护身符袋，挂在金的脖子上。
        - id: ch01-b08
          speaker: opium_woman
          text: 总有一天，一头站在绿地上的大红公牛会来找你。还有一个骑着高头大马的上校。对了，还有九百个魔鬼。
        - id: ch01-b09
          speaker: kim
          text: 我记得。红公牛和骑马的上校都会来。不过我父亲说，在他们之前，会先来两个人替这些事铺路。施法的人一向这么做，每次都一样。
        - id: ch01-b10
          speaker: narrator
          text: 女人要是把金和文件送进当地的魔法屋，旁遮普分会就会接管他，再把他送到山里的共济会孤儿院。可那些魔法把她吓坏了。金也有自己的主意。到了最不知轻重的年纪，他已经会躲开传教士，也躲开那些满脸严肃、追问他是谁、做什么的白人。
        - id: ch01-b11
          speaker: narrator
          text: 金整天无所事事，而且做得非常成功。他熟悉拉合尔这座奇妙的城，从德里门一直到城堡外壕，处处都认得。他和许多人亲密来往，那些人的生活，比哈伦·拉希德梦见的一切还离奇。他自己也活在一片《一千零一夜》似的狂野天地里。可传教士和慈善会干事看不出这里面的美妙。城里每个区都叫他“全世界的小朋友”。
        - id: ch01-b12
          speaker: narrator
          text: 他身子灵活，又不惹眼，常在夜里替衣冠楚楚的年轻公子办事，在拥挤的平屋顶间来来去去。他当然知道那是私情勾当。他刚会说话，就懂得世上的坏事。可他喜欢的是这场游戏。他悄悄穿过黑巷，顺着水管爬上屋顶，偷看偷听平顶上女人世界里的声色，再趁着炎热的夜色，从一座屋顶飞奔到另一座屋顶。
        - id: ch01-b13
          speaker: narrator
          text: 河边树下的砖龛旁，住着许多满身炉灰的苦行僧。金和他们都很熟。他们化缘回来，金会上前问候。四下没人的时候，他还和他们同吃一盘饭。照料他的女人总含着眼泪，逼他穿上欧洲人的裤子、衬衫和破帽子。可有些事情，穿印度教徒或穆斯林的衣服更方便。
        - id: ch01-b14
          speaker: narrator
          text: 有个年轻公子送过他一整套低种姓街头孩子穿的印度教服装。后来发生地震，那个人被发现死在井底。金把衣服藏在旁遮普高等法院外的尼拉·拉姆木场，压在几根大梁下面。芬芳的雪松木顺拉维河漂来，正在那里风干。只要有差事或热闹，金就取出那套衣服。天亮时，他才筋疲力尽地回到游廊。有时他跟着婚礼队伍一路叫喊，有时又在印度教节庆上大声喧闹。家里偶尔有饭，更多时候没有。没饭时，他便出去和本地朋友一起吃。
        - id: ch01-b15
          speaker: narrator
          text: 这会儿，金正用脚跟敲着赞—扎玛，同卖糖果的阿卜杜拉之子和小乔塔·拉尔玩攻占城堡。他还不时回过头，粗声取笑守在博物馆门口一排鞋子旁边的本地警察。那个高大的旁遮普人只是宽容地咧嘴笑。他早就认识金。提着山羊皮水袋给土路洒水的送水夫认识金，弯腰给新木箱钉钉子的博物馆木匠贾瓦希尔·辛格也认识金。眼前人人都认得他，只有从乡下赶来的农民例外。
        - id: ch01-b16
          speaker: narrator
          text: 农民们匆匆涌进奇珍馆，要看本省和别处的人做出来的东西。博物馆专门陈列印度的工艺和制品。谁想知道得更多，都可以请馆长讲解。
        - id: ch01-b17
          speaker: abdullah
          text: 快下来！下来，让我也坐上去！
        - id: ch01-b18
          speaker: kim
          text: 你爹做糕饼，你娘偷酥油。穆斯林呀，早就全从赞—扎玛上摔下去喽！
        - id: ch01-b19
          speaker: chota_lal
          text: 该让我上去了！
        - id: ch01-b20
          speaker: narrator
          text: 小乔塔·拉尔戴着金绣小帽，嗓音尖得刺耳。他父亲的家产也许值五十万英镑，不过印度是世上唯一真正讲平等的地方。
        - id: ch01-b21
          speaker: kim
          text: 印度教徒也掉下去了，是穆斯林推的。你爹就是个糕饼匠！
        - id: ch01-b22
          speaker: narrator
          text: 金突然停住了。一个人从喧闹的莫蒂市场转过街角，拖着脚慢慢走来。金自以为看遍了所有种姓，却从没见过这样的人。那人差不多有六英尺高，身上一层又一层，裹着像马毯一样暗沉的布。金看不出哪一层属于什么营生。他腰间挂着镂空长铁笔盒，又戴着圣人常用的木念珠。头上那顶苏格兰软帽大得出奇。他的脸发黄，满是皱纹，很像市场里的中国鞋匠福兴。两只眼角向上挑着，仿佛两道细细的黑玉。
        - id: ch01-b23
          speaker: kim
          text: 那是谁？
        - id: ch01-b24
          speaker: abdullah
          text: 也许是个人吧。
        - id: ch01-b25
          speaker: kim
          text: 他当然是人。可这样的印度人，我还真没见过。
        - id: ch01-b26
          speaker: chota_lal
          text: 也许是个祭司。快看，他进奇珍馆了！
        - id: ch01-b27
          speaker: policeman
          text: 不，不，我听不懂他的话。喂，全世界的小朋友，他在说什么？
        - id: ch01-b28
          speaker: kim
          text: 叫他过来。他是外国人，你倒是头水牛。
        - id: ch01-b29
          speaker: narrator
          text: 金从赞—扎玛上跳下来，晃着光脚后跟。那人茫然地转过身，慢慢走到孩子们跟前。他上了年纪，羊毛长袍上还带着山口臭蒿草的气味。
        - id: ch01-b30
          speaker: lama
          text: 孩子们，那座大房子是什么地方？
        - id: ch01-b31
          speaker: kim
          text: 阿杰布—盖尔，就是奇珍馆！
        - id: ch01-b32
          speaker: narrator
          text: 金没叫他拉拉，也没称他米安，因为实在猜不出他信什么教。
        - id: ch01-b33
          speaker: lama
          text: 啊，奇珍馆！什么人都可以进去吗？
        - id: ch01-b34
          speaker: kim
          text: 门上写着呢，人人都能进去。
        - id: ch01-b35
          speaker: lama
          text: 不收钱吗？
        - id: ch01-b36
          speaker: kim
          text: 我进进出出，从来不给钱。我又不是财主。
        - id: ch01-b37
          speaker: lama
          text: 唉，我是个老人，不懂这里的规矩。
        - id: ch01-b38
          speaker: narrator
          text: 他拨弄着念珠，半转过身，朝博物馆望去。
        - id: ch01-b39
          speaker: kim
          text: 你是什么种姓？家在哪儿？走了很远吗？
        - id: ch01-b40
          speaker: lama
          text: 我从冈底斯山那边来，经过了库卢。可你们这些孩子哪里会懂呢？我来自群山。那里的空气和水，都又凉又新鲜。
        - id: ch01-b41
          speaker: abdullah
          text: 哈，是契丹人，就是中国人。
        - id: ch01-b42
          speaker: narrator
          text: 阿卜杜拉说得很得意。福兴曾把他赶出鞋店，因为他朝鞋子上方供着的神像吐过口水。
        - id: ch01-b43
          speaker: chota_lal
          text: 他是山里人。
        - id: ch01-b44
          speaker: lama
          text: 是啊，孩子。我来自你永远也看不到的山。你听说过博提亚，也就是西藏吗？既然你们非要问，我就告诉你们。我不是契丹人，我是博提亚人，是西藏人。我是个喇嘛，用你们的话，也可以叫古鲁。
        - id: ch01-b45
          speaker: kim
          text: 西藏来的古鲁，我还是头一次见。西藏人也信印度教吗？
        - id: ch01-b46
          speaker: lama
          text: 我们追随中道，住在寺院里。我死以前，要去朝拜四处圣地。现在，你们虽然还是孩子，知道的却已经和我这老人一样多了。
        - id: ch01-b47
          speaker: narrator
          text: 他慈祥地朝孩子们笑了笑。
        - id: ch01-b48
          speaker: kim
          text: 你吃过饭了吗？
        - id: ch01-b49
          speaker: narrator
          text: 喇嘛伸手在怀里摸索，取出一只磨旧的木钵。孩子们都点了点头。他们认识的祭司，全都靠化缘吃饭。
        - id: ch01-b50
          speaker: lama
          text: 我现在还不想吃。听说拉合尔奇珍馆里有很多圣像，是真的吗？
        - id: ch01-b51
          speaker: narrator
          text: 阳光下，他像只老龟那样转着头，又把最后几个字念了一遍，仿佛在核对一个地址。
        - id: ch01-b52
          speaker: abdullah
          text: 真的，里面塞满了异教徒的偶像。你也是拜偶像的。
        - id: ch01-b53
          speaker: kim
          text: 别理他。那是政府的房子，里面没人拜偶像，只有一个白胡子老爷。跟我来，我领你进去看。
        - id: ch01-b54
          speaker: chota_lal
          text: 陌生祭司会吃小孩。
        - id: ch01-b55
          speaker: abdullah
          text: 他还是外乡人，又拜偶像。
        - id: ch01-b56
          speaker: kim
          text: 他才刚到这里。你们快逃回妈妈怀里，那就安全啦。来吧！
        - id: ch01-b57
          speaker: narrator
          text: 金笑着转动自动计数的旋转门，门发出咔嗒一声。老人跟着进去，一到门厅就惊呆了。
        - id: ch01-b58
          speaker: narrator
          text: 门厅里陈列着许多大型的希腊式佛教雕像。谁也说不清是在多少年前，一群早被遗忘的工匠雕出了它们。他们的双手摸索着一种神秘传来的希腊神韵，手艺相当不错。展品有几百件。有人物浮雕的横饰带，有残缺的雕像，还有挤满人像的石板。它们从前覆盖在北方佛塔和寺院的砖墙上，如今被人挖掘出来，贴上标签，成了博物馆的骄傲。
        - id: ch01-b59
          speaker: narrator
          text: 喇嘛张着嘴，一件件看过去。最后，他停在一方巨大的高浮雕前，连气也屏住了。那上面刻着佛陀加冕，也可能是成佛。世尊坐在莲花上，花瓣刻得很深，几乎一片片脱离了石面。虔敬的国王、长老和古佛围在四周。下方的水面覆着莲叶，鱼和水鸟在里面游动。两位长着蝶翼的天神，在世尊头顶托起花环。更高处还有两位天神，撑着一把宝伞，伞顶装饰着菩萨的珠冠。
        - id: ch01-b60
          speaker: lama
          text: 世尊！世尊！这正是释迦牟尼本人！
          emotion: surprised
        - id: ch01-b61
          speaker: narrator
          text: 喇嘛几乎哽咽了。随后，他低声念起一首奇妙的佛偈。
        - id: ch01-b62
          speaker: lama
          text: 道路、正法、出尘之境，都归于他。摩耶夫人曾将他怀在心下。阿难之主，伟大的菩萨。
        - id: ch01-b63
          speaker: lama
          text: 他就在这里！无上正法也在这里。我的朝圣有了好开端。看看这手艺，看看这手艺！
          emotion: happy
        - id: ch01-b64
          speaker: kim
          text: 那边就是白人老爷。
        - id: ch01-b65
          speaker: narrator
          text: 金说完便闪进工艺制品馆的陈列柜之间。一个白胡子英国人正望着喇嘛。喇嘛庄重地转身行礼，摸索了一阵，拿出一本小册子和一张纸片。
        - id: ch01-b66
          speaker: curator
          text: 对，这上面写的是我的名字。
        - id: ch01-b67
          speaker: narrator
          text: 英国人看着那歪歪扭扭、像孩子写出来的字，笑了。
        - id: ch01-b68
          speaker: lama
          text: 我们那里有一位朝拜过圣地的人。他如今是隆乔寺的住持。这是他交给我的。他还提起过这里的这些东西。
        - id: ch01-b69
          speaker: narrator
          text: 喇嘛说得磕磕绊绊，瘦削的手颤抖着朝四周挥了一下。
        - id: ch01-b70
          speaker: curator
          text: 那么，欢迎你，西藏来的喇嘛。圣像都在这里，我也在这里。我留在这里，是为了搜求学问。请到我的办公室坐一会儿。
        - id: ch01-b71
          speaker: narrator
          text: 馆长端详着喇嘛的脸。老人兴奋得全身发抖。办公室只是雕像长廊里隔出来的一间小木屋。金趴在地上，把耳朵贴着那扇被暑热晒裂的雪松木门缝。他凭着本能舒展开身子，一边偷听，一边偷看。
        - id: ch01-b72
          speaker: narrator
          text: 起初的谈话大半超出了金的理解。喇嘛结结巴巴地讲起自己的寺院，苏禅寺。那里离拉合尔有四个月的路程，正对着彩绘岩壁。馆长搬出一本巨大的影集，翻出寺院的照片。寺院立在峭壁上，俯瞰一道大峡谷，谷里的岩层五彩斑斓。
        - id: ch01-b73
          speaker: lama
          text: 对，对，就是这里！你看这扇小门，入冬以前，我们从这里把柴运进去。你们英国人连这些也知道吗？现在做隆乔寺住持的人告诉过我，我一直不信。世尊，无上尊者，在这里也受人敬奉吗？人们也知道他一生的故事吗？
          emotion: surprised
        - id: ch01-b74
          speaker: narrator
          text: 喇嘛戴上中国制造的玳瑁边眼镜，凑近照片看。
        - id: ch01-b75
          speaker: curator
          text: 全都刻在石头上。你要是休息好了，我们现在就去看。
        - id: ch01-b76
          speaker: narrator
          text: 喇嘛拖着脚回到大厅，馆长陪在身边。他们一件一件地观看。喇嘛既带着信徒的虔诚，也有匠人欣赏手艺的眼光。
        - id: ch01-b77
          speaker: narrator
          text: 他从模糊的石刻里，一幕幕认出那个美丽的故事。有时，陌生的希腊表现手法把他弄糊涂了。每发现一件新珍品，他又高兴得像个孩子。石刻的次序要是有缺漏，比如缺了佛陀降生的预告，馆长便从成堆的书里补上。这些法文和德文书中，都印着照片和摹本。
        - id: ch01-b78
          speaker: narrator
          text: 一块石头上刻着虔诚的阿私陀。他就像基督教故事里的西面，把圣婴抱在膝头，孩子的父母站在一旁倾听。另一处是佛陀堂兄提婆达多的种种传说。诬告世尊不洁的恶妇羞惭败露。鹿野苑说法和震慑拜火教徒的神迹，也都刻在眼前。这里的菩萨还是一位仪态尊贵的王子。那里又有神奇的诞生、拘尸那罗涅槃，还有软弱弟子昏厥的场面。菩提树下冥想的图景几乎数不清，供奉钵盂的形象也随处可见。
        - id: ch01-b79
          speaker: narrator
          text: 馆长很快看出来，这位客人不是一个只会数念珠的乞僧，而是个很有学问的学者。于是两人又从头看起。喇嘛吸着鼻烟，擦着眼镜，把乌尔都语和藏语混在一起，像火车一样飞快地讲，叫人眼花缭乱。
        - id: ch01-b80
          speaker: narrator
          text: 他听说过中国僧人法显和玄奘的游记，急着想知道，那些记载有没有译本。他无助地翻着比尔和斯坦尼斯拉斯·朱利安的书页，忽然倒吸一口气。
        - id: ch01-b81
          speaker: lama
          text: 全都在这里，可这是一座上了锁的宝库。
        - id: ch01-b82
          speaker: narrator
          text: 他随即恭敬地收住心神，听馆长把书里的片段匆匆译成乌尔都语。他第一次知道，欧洲学者凭这些书和上百种别的文献，考定了佛教圣地的位置。馆长又摊开一幅巨大的地图，上面布满黄色斑点和线条。棕色的手指跟着馆长的铅笔一点点移动。这里是迦毗罗卫，这里是中部国土。这里是佛教的麦加，摩诃菩提。这里又是拘尸那罗，是世尊逝去的悲伤之地。
        - id: ch01-b83
          speaker: narrator
          text: 老人低头对着地图，很久没有说话。馆长又点起一斗烟。金已经睡着了。等他醒来，两人还说个不停，不过这时的话，他已经能听懂一些。
        - id: ch01-b84
          speaker: lama
          text: 智慧之泉啊，事情就是这样。我决定走遍世尊留下足迹的圣地。先去他的诞生地迦毗罗，再去摩诃菩提，也就是菩提伽耶。接着去寺院，去鹿野苑，最后再去他离世的地方。
        - id: ch01-b85
          speaker: lama
          text: 而且，我是独自来到这里的。五年，七年，十八年，四十年来，我一直觉得，古老的正法没有受到好好遵奉。它被鬼怪、符咒和偶像崇拜一层层盖住了。就像外面那个孩子说的。对，他说的是拜偶像。
        - id: ch01-b86
          speaker: curator
          text: 每一种信仰，到了最后都会变成这样。
        - id: ch01-b87
          speaker: lama
          text: 你也这么想吗？寺里的经书，我已经全读过了。读起来只像晒干的木髓。我们改革教派后来添上的那些仪轨，这双老眼也看不出有什么价值。就连无上尊者的追随者，也彼此争斗不休。这些全是幻象。对，是摩耶，是幻象。
        - id: ch01-b88
          speaker: lama
          text: 不过，我还有一个心愿。你们的学者凭这些书，沿着佛陀受福的足迹，走过他生前去过的地方。可是，还有一些东西，他们没有寻找。我什么都不知道，什么都不知道。可我要沿着一条宽阔明亮的路，从万物轮回中解脱。
        - id: ch01-b89
          speaker: narrator
          text: 那张沟壑纵横的黄脸凑到馆长面前，离他还不到三英寸。长长的指甲轻轻敲着桌面。说到最后，老人笑得纯真，又十分得意。
        - id: ch01-b90
          speaker: lama
          text: 以朝圣者的身份走遍圣地，我能积下功德。可我的追寻还不只这些。请听一个真实的故事。仁慈的世尊年轻时要选择妻子，父王宫廷里的人却说，他性情太柔弱，不适合成婚。这个故事，你知道吗？
        - id: ch01-b91
          speaker: narrator
          text: 馆长点点头，却猜不出他接下来要说什么。
        - id: ch01-b92
          speaker: lama
          text: 后来，他们叫世尊和所有来客比试三种力气。比到弓箭的时候，他先折断了别人拿来的弓，又要了一张没人拉得开的强弓。这件事，你知道吗？
        - id: ch01-b93
          speaker: curator
          text: 经书上记着，我读过。
        - id: ch01-b94
          speaker: lama
          text: 世尊一箭射过所有靶子，飞得很远，很远，最后从人们眼里消失了。那支箭落到地上，落下的地方涌出一股泉水，不久便成了一条河。凭世尊的恩德，也凭他解脱以前积下的功德，任何人在河里沐浴，都能洗净身上的罪孽和污点。
        - id: ch01-b95
          speaker: curator
          text: 经书上确实这样写。
          emotion: sad
        - id: ch01-b96
          speaker: narrator
          text: 馆长说得有些忧伤。喇嘛长长地吸了一口气。
        - id: ch01-b97
          speaker: lama
          text: 智慧之泉啊，那条河究竟在哪里？那支箭落在什么地方？
        - id: ch01-b98
          speaker: curator
          text: 唉，我的兄弟，我不知道。
        - id: ch01-b99
          speaker: lama
          text: 不，也许你只是一时忘了。这恰好是唯一一件你没告诉我的事。你一定知道。你看，我已经老了！智慧之泉啊，我伏在你脚下求你。我们知道世尊拉开过那张弓，也知道箭落下来了。我们知道那里喷出了泉水。那么，那条河在哪里？梦指引我来找它，所以我来了。如今我就在这里。可那条河究竟在哪儿？
        - id: ch01-b100
          speaker: curator
          text: 如果我知道，难道我不会大声告诉全世界吗？
        - id: ch01-b101
          speaker: lama
          text: 人只要在那条河里沐浴，就能脱离万物轮回。箭河！请你再想想。它也许只是一条小溪，到了热天就干了？可世尊绝不会这样欺骗一个老人。
        - id: ch01-b102
          speaker: curator
          text: 我不知道。我真的不知道。
        - id: ch01-b103
          speaker: narrator
          text: 喇嘛再次把布满深纹的脸凑过去，这一次，离英国人只剩一掌的距离。
        - id: ch01-b104
          speaker: lama
          text: 我看得出来，你确实不知道。你不在正法之中，所以这件事才对你隐去了。
        - id: ch01-b105
          speaker: curator
          text: 是啊，隐去了，隐去了。
        - id: ch01-b106
          speaker: lama
          text: 我的兄弟，你和我都受着束缚。可是我——我要斩断自己的束缚。你也来吧！
        - id: ch01-b107
          speaker: narrator
          text: 喇嘛猛地站起来，柔软厚重的袍子跟着翻卷起来。
        - id: ch01-b108
          speaker: curator
          text: 我脱不开身。可你准备去哪里？
        - id: ch01-b109
          speaker: lama
          text: 先去迦尸，也就是贝拿勒斯。不去那里，还能去哪儿？我会在城里一座耆那教寺庙见一个信仰纯正的人。他也在暗中寻找，也许我能从他那里学到什么。说不定，他还会同我一起去菩提伽耶。然后我再往北，往西，一直走到迦毗罗卫，在那里寻找那条河。不，我会沿路到处寻找。没有人知道那支箭究竟落在哪里。
        - id: ch01-b110
          speaker: curator
          text: 你打算怎么去？德里已经很远，贝拿勒斯还要更远。
        - id: ch01-b111
          speaker: lama
          text: 我会走路，也会坐火车。离开群山以后，我在帕坦科特坐上一列火车来到这里。它跑得太快了。起先，我看见路边一根根高杆不断抓起自己的长线，又把它们向后甩出去，真叫我吃惊。
        - id: ch01-b112
          speaker: narrator
          text: 他一面说，一面弯腰转身，比画电线杆从车窗外飞掠过去的样子。
        - id: ch01-b113
          speaker: lama
          text: 后来，车里挤得我浑身难受，我就想下来走路。这才是我平常用的办法。
        - id: ch01-b114
          speaker: curator
          text: 你有把握认得路吗？
        - id: ch01-b115
          speaker: lama
          text: 只要开口问一声，再付了钱，管事的人自然会把每个人送到要去的地方。这个办法，我在寺里听人可靠地讲过。
        - id: ch01-b116
          speaker: curator
          text: 你什么时候动身？
        - id: ch01-b117
          speaker: narrator
          text: 馆长笑了。古老的虔诚和现代的进步混在一起，这正是今天的印度。
        - id: ch01-b118
          speaker: lama
          text: 越快越好。我会沿着世尊一生的足迹走，直到找到箭河。另外，我还有一张纸，上面写着南行火车的时刻。
        - id: ch01-b119
          speaker: curator
          text: 那你吃饭怎么办？
        - id: ch01-b120
          speaker: narrator
          text: 喇嘛通常会把一笔钱藏在身上的某个地方，不过馆长还是想把这事问清楚。
        - id: ch01-b121
          speaker: lama
          text: 走在路上，我会捧起世尊的托钵。我要像他那样行走，舍弃寺院里的安逸。我离开群山时，带过一个弟子。他替我按照戒律化缘，可是在库卢停留时，他发烧死了。如今我没有弟子。不过，我会带上钵，让愿意施舍的人有机会积下功德。
        - id: ch01-b122
          speaker: narrator
          text: 喇嘛勇敢地点点头。寺院里的博学高僧原本不靠乞食为生，可这位老人一颗心全放在追寻上了。
        - id: ch01-b123
          speaker: curator
          text: 那就这样吧。现在，请让我也积一点功德。你和我都是手艺人。这是一本崭新的英国白纸簿，还有两三支削好的铅笔，有粗的，也有细的，抄写起来都很好用。现在，把你的眼镜借给我看看。
        - id: ch01-b124
          speaker: narrator
          text: 馆长戴上喇嘛的眼镜。镜片上全是划痕，度数却和他自己的那副差不多。他把自己的眼镜塞到喇嘛手里。
        - id: ch01-b125
          speaker: curator
          text: 试一试这副。
        - id: ch01-b126
          speaker: lama
          text: 羽毛！戴在脸上，简直像一根羽毛。我几乎感觉不到。看得多清楚啊！
          emotion: happy
        - id: ch01-b127
          speaker: curator
          text: 镜片是水晶的，不会被划伤。愿这副眼镜帮你找到那条河。从现在起，它归你了。
        - id: ch01-b128
          speaker: lama
          text: 眼镜、铅笔和白纸簿，我都收下，作为祭司与祭司之间友谊的见证。现在，我也有件东西给你。
        - id: ch01-b129
          speaker: narrator
          text: 喇嘛摸索着腰带，解下那只镂空铁笔盒，放在馆长桌上。
        - id: ch01-b130
          speaker: lama
          text: 这个留给你，纪念我们相识。这是我的笔盒。它很古老，和我一样老。
        - id: ch01-b131
          speaker: narrator
          text: 那是一件古老的中国器物，用的铁如今已经没有人会冶炼。馆长那颗收藏家的心，第一眼就被它吸引住了。不管他怎么劝，喇嘛都不肯把礼物收回。
        - id: ch01-b132
          speaker: lama
          text: 等我找到那条河回来，我会送你一幅莲花生大师的写像，就像我从前在寺里画在绢上的那种。对了，我还会再画一幅生命之轮。因为你和我都是手艺人。
        - id: ch01-b133
          speaker: narrator
          text: 喇嘛轻声笑了。馆长原想把他留下。如今世上还懂传统佛画笔法的人已经不多，那些画像仿佛一半是写出来的，一半是画出来的。可是喇嘛昂首走了出去。他在那尊沉思的大菩萨像前停了一下，随后穿过旋转门。
        - id: ch01-b134
          speaker: narrator
          text: 金像影子一样跟在后面。刚才偷听到的一切叫他兴奋极了。这个人完全超出了他过去的经验。金决心继续探个究竟，就像考察拉合尔城里一座新房，或是一场陌生的节庆。喇嘛是他发现的宝贝，他打算把老人据为己有。更何况，金的母亲也是爱尔兰人。
        - id: ch01-b135
          speaker: narrator
          text: 老人走到赞—扎玛旁边，停下来四处张望，直到看见金。朝圣带给他的灵感暂时退去了。他只觉得自己又老，又孤单，肚子还空空的。
        - id: ch01-b136
          speaker: policeman
          text: 别坐在那门炮底下。
        - id: ch01-b137
          speaker: kim
          text: 哼，猫头鹰！你爱坐哪儿就坐哪儿。敦努，你什么时候偷了挤奶女人的拖鞋？
        - id: ch01-b138
          speaker: narrator
          text: 这桩指控毫无根据，是金临时编出来的，却让敦努闭上了嘴。他知道，只要金尖声一喊，市场里的坏小子们随时会成群结队地来帮忙。
        - id: ch01-b139
          speaker: kim
          text: 你刚才在里面拜了谁？
        - id: ch01-b140
          speaker: narrator
          text: 金和和气气地问，在喇嘛身边的阴影里蹲了下来。
        - id: ch01-b141
          speaker: lama
          text: 孩子，我谁也没有拜。我只是在正法面前行礼。
        - id: ch01-b142
          speaker: narrator
          text: 金毫不惊讶地接受了这个新神。他已经认识几十位神了。
        - id: ch01-b143
          speaker: kim
          text: 那你靠什么过日子？
        - id: ch01-b144
          speaker: lama
          text: 我靠乞食。现在我才想起来，自己已经很久没吃，也很久没喝了。在这座城里，化缘有什么规矩？像我们在西藏那样一句话不说，还是要高声开口？
        - id: ch01-b145
          speaker: kim
          text: 讨饭时一声不吭，那就只好一声不吭地饿死。
        - id: ch01-b146
          speaker: narrator
          text: 金借用了一句本地谚语。喇嘛想站起来，却叹着气重新坐下。他想起那个在遥远的库卢死去的弟子。金歪着头看老人，既在盘算，也觉得有趣。
        - id: ch01-b147
          speaker: kim
          text: 把钵给我吧。这城里的人，我都认识。哪些人肯施舍，我也全知道。给我，我会装得满满的再拿回来。
        - id: ch01-b148
          speaker: narrator
          text: 老人像孩子一样单纯，把钵交给了他。
        - id: ch01-b149
          speaker: kim
          text: 你在这儿歇着。我认识这里的人。
        - id: ch01-b150
          speaker: narrator
          text: 金小跑到一家敞着门的蔬菜铺。铺子在莫蒂市场环线电车轨道的对面。店主是个低种姓卖菜妇，早就认识金。
        - id: ch01-b151
          speaker: vegetable_woman
          text: 哟，你端上讨饭钵，也做起瑜伽行者啦？
        - id: ch01-b152
          speaker: kim
          text: 才不是。城里来了个新祭司，是我从来没见过的那一种。
        - id: ch01-b153
          speaker: vegetable_woman
          text: 老祭司，小老虎！新祭司我早就受够了。他们一个个像苍蝇，全落在我的货物上。难道我孩子的爹是一口慈善井，谁来讨东西，都能从里面往外舀吗？
          emotion: angry
        - id: ch01-b154
          speaker: kim
          text: 不是。你家男人与其说是瑜伽士，还不如说是个坏脾气鬼。可这位祭司不一样。奇珍馆里的白人老爷待他就像兄弟。我的母亲啊，帮我把这只钵装满吧。他还在等着呢。
        - id: ch01-b155
          speaker: vegetable_woman
          text: 就这只钵？这简直是个牛肚子那么大的筐！你的福分倒和湿婆神的圣牛一样大。那家伙今天早上已经吃掉我一筐最好的洋葱，现在还要我装满你的钵。看哪，它又来了。
        - id: ch01-b156
          speaker: narrator
          text: 本区那头鼠灰色的大婆罗门圣牛，嘴里叼着偷来的香蕉，正在五彩的人群里往前挤。它很清楚圣兽享有什么特权，径直走到菜铺前，低下头，朝一排菜筐重重喷气，准备慢慢挑选。金硬邦邦的小脚跟突然飞起，正好踢中它湿润的青鼻子。圣牛愤怒地哼了一声，跨过电车轨道走了，背上的肉峰气得直抖。
        - id: ch01-b157
          speaker: kim
          text: 看，我救下来的菜，值这碗饭的三倍都不止。现在，母亲，给我来点米饭，上面放些鱼干。对，再添一点蔬菜咖喱。
        - id: ch01-b158
          speaker: narrator
          text: 店铺后面躺着个男人，那里传来一声低吼。
        - id: ch01-b159
          speaker: vegetable_woman
          text: 他把那头牛赶走了。施舍穷人，也是件好事。
        - id: ch01-b160
          speaker: narrator
          text: 女人压低声音，接过木钵，盛满了热气腾腾的米饭。
        - id: ch01-b161
          speaker: kim
          text: 可我的瑜伽士又不是牛。
        - id: ch01-b162
          speaker: narrator
          text: 金说得一本正经。他用手指在饭堆顶上挖出一个洞。
        - id: ch01-b163
          speaker: kim
          text: 有点咖喱才好。再放一块炸饼，还有一小口蜜饯。我想，他会喜欢。
        - id: ch01-b164
          speaker: vegetable_woman
          text: 这个洞都和你的脑袋一样大了。
        - id: ch01-b165
          speaker: narrator
          text: 女人虽然烦躁，还是往洞里盛了香喷喷的热蔬菜咖喱。她在顶上拍了一块炸饼，又放上一小块酥油，旁边抹了一团酸罗望子酱。金满心喜爱地端详这份沉甸甸的食物。
        - id: ch01-b166
          speaker: kim
          text: 这就对了。只要我待在市场里，那头牛就不会再来你家。它可是个胆大包天的乞丐。
        - id: ch01-b167
          speaker: vegetable_woman
          text: 那你呢？不过，你可别说公牛的坏话。你不是告诉过我，总有一天，一头红公牛会从田野里出来帮你吗？拿稳了。请那位圣人也赐福给我。说不定，他知道怎么治我女儿眼睛上的疮。全世界的小朋友啊，这件事也替我问问他。
        - id: ch01-b168
          speaker: narrator
          text: 可她还没说完，金已经踩着舞步跑远了。他在野狗和饥饿的熟人之间左躲右闪，把饭送回喇嘛身边。
        - id: ch01-b169
          speaker: kim
          text: 懂门道的人，就是这样化缘的。
        - id: ch01-b170
          speaker: narrator
          text: 喇嘛睁开眼，看见木钵里的东西，惊讶极了。
        - id: ch01-b171
          speaker: kim
          text: 现在吃吧。我也和你一起吃。喂，送水的！拿水来。我们这些男人都渴了。
        - id: ch01-b172
          speaker: water_carrier
          text: 还“我们这些男人”呢！像你们这样的一老一小，一整皮袋水够不够喝？来吧，以慈悲者的名义喝水。
        - id: ch01-b173
          speaker: narrator
          text: 送水夫笑着，把一股细细的水流放进金手里。金照本地人的习惯喝了。喇嘛却一定要从仿佛永远掏不空的上层袍子里拿出杯子，郑重地喝水。
        - id: ch01-b174
          speaker: narrator
          text: 老人用一种金听不懂的语言说了句显然是祝福的话。金只把它解释成两个字，外乡人。
        - id: ch01-b175
          speaker: narrator
          text: 两个人心满意足地吃完了饭，托钵里一点也没剩。喇嘛从一只大得吓人的木鼻烟壶里吸了些鼻烟，又拨弄了一阵念珠。赞—扎玛的影子越拉越长，他像老人那样轻易地睡着了。
        - id: ch01-b176
          speaker: narrator
          text: 金晃到最近的烟草铺，向一个很活泼的年轻穆斯林女人讨来一支气味刺鼻的雪茄。这个牌子专卖给旁遮普大学里模仿英国习惯的学生。他坐在大炮肚子底下，抽着烟，抱着膝盖盘算。最后，他突然无声无息地站起来，往尼拉·拉姆木场去了。
        - id: ch01-b177
          speaker: narrator
          text: 城里的夜生活开始以后，喇嘛才醒。街灯一盏盏亮起来。穿白衣的文书和下级官员，也从政府衙门回来了。老人晕头转向地四处张望。没有人看他，只有一个裹脏头巾、穿淡黄褐色衣服的印度教小顽童站在附近。他忽然把头埋进膝盖，哭了起来。
        - id: ch01-b178
          speaker: kim
          text: 出什么事了？你被人抢了吗？
        - id: ch01-b179
          speaker: lama
          text: 我的新弟子离开我了。我不知道他去了哪里。
          emotion: sad
        - id: ch01-b180
          speaker: kim
          text: 你的弟子是什么模样？
        - id: ch01-b181
          speaker: lama
          text: 是个男孩。原来的弟子死后，他来到我身边。因为我在里面向正法行礼，积下了功德。我迷路时，他来为我带路。他领我进奇珍馆，还用话鼓励我去见圣像的看守人，让我得到了安慰和力量。我饿得虚弱时，他又像弟子侍奉师父那样，替我化缘。他来得突然，走得也突然。我本想去贝拿勒斯的路上教他正法。
        - id: ch01-b182
          speaker: narrator
          text: 金听得目瞪口呆。他偷听过博物馆里的谈话，知道老人说的句句都是真话。在路上，本地人很少会把真话白白送给一个陌生人。
        - id: ch01-b183
          speaker: lama
          text: 现在我明白了。他被派来，只为完成一件事。因此我知道，我一定能找到自己寻找的那条河。
        - id: ch01-b184
          speaker: kim
          text: 你说的是箭河吗？
        - id: ch01-b185
          speaker: lama
          text: 难道这又是一次天意的指引？除了那位圣像祭司，我没有对任何人说起自己的追寻。你是谁？
          emotion: surprised
        - id: ch01-b186
          speaker: kim
          text: 我是你的弟子。我这辈子没见过你这样的人。我要跟你去贝拿勒斯。再说了，你这么老，天黑时还会对偶然遇见的人说真话，实在很需要一个弟子。
        - id: ch01-b187
          speaker: lama
          text: 那条河呢？箭河呢？
        - id: ch01-b188
          speaker: kim
          text: 你和英国人说话时，我趴在门外听见了。
        - id: ch01-b189
          speaker: lama
          text: 唉，我还以为你得到了准许，是专门来为我引路的。有时，的确会有这样的事。可我不配得到它。那么，你不知道那条河在哪儿？
        - id: ch01-b190
          speaker: kim
          text: 我不知道。我要去找别的东西。我要找绿地上的一头红公牛，它会帮助我。
        - id: ch01-b191
          speaker: narrator
          text: 金笑得有些不安。孩子就是这样。只要熟人有了一个打算，他马上也会有自己的打算。也因为他还是孩子，所以父亲的预言每次被想起时，真的能在他心里占上足足二十分钟。
        - id: ch01-b192
          speaker: lama
          text: 孩子，那头公牛要帮你做什么？
        - id: ch01-b193
          speaker: kim
          text: 天知道。反正我父亲就是这样告诉我的。我听见你在奇珍馆里谈到山里那些新奇的地方。你这么老，又这么弱，还这么习惯说真话，都能为了找一条小河出门远行。我觉得，自己也该出去走走。要是命里注定我们找到那些东西，我们自然会找到。你找到你的河，我找到我的公牛、坚固的柱子，还有几样被我忘掉的东西。
        - id: ch01-b194
          speaker: lama
          text: 我要摆脱的不是柱子，是一只轮。
        - id: ch01-b195
          speaker: kim
          text: 都差不多。也许，他们还会叫我做国王。
        - id: ch01-b196
          speaker: narrator
          text: 金安然等着接受任何可能。
        - id: ch01-b197
          speaker: lama
          text: 走在路上，我会教你生出别的愿望，更好的愿望。现在，我们去贝拿勒斯。
        - id: ch01-b198
          speaker: kim
          text: 夜里不能赶路，外面有贼。等天亮再走。
        - id: ch01-b199
          speaker: lama
          text: 可我们没有地方睡觉。
        - id: ch01-b200
          speaker: narrator
          text: 老人习惯了寺院里的规矩。戒律虽然规定睡在地上，他还是喜欢把这件事安排得体面一点。
        - id: ch01-b201
          speaker: kim
          text: 克什米尔客栈有好地方住。我在那里还有个朋友。来吧！
        - id: ch01-b202
          speaker: narrator
          text: 炎热拥挤的市场灯火通明。他们从北印度各色人等汇成的人潮里穿过去。喇嘛像梦游一样跟在金后面。这是他第一次见到一座工业大城。拥挤的电车一路尖叫着刹车，把他吓得不轻。老人半被人群推着，半被金拖着，总算走到克什米尔客栈的高大门楼下。
        - id: ch01-b203
          speaker: narrator
          text: 客栈是一座巨大的露天方场，正对着火车站，四面环绕着拱廊。从中亚回来的骆驼队和马队都在这里歇脚。北方各族的人挤满场内。有的照管拴好的小马和跪着的骆驼，有的装卸大包小包。有人在吱嘎作响的辘轳井旁打水做晚饭，有人给嘶鸣瞪眼的种马堆草料。还有人抽打凶恶的商队狗，结算骆驼夫的工钱，或是雇用新的马倌。咒骂、呼喊、争辩和讨价还价的声音，混成了一片。
        - id: ch01-b204
          speaker: narrator
          text: 登上三四级石阶就是拱廊。它围着这片狂暴的海洋，倒像一圈避风港。大多数拱洞租给了商人，就像我们把高架桥下的拱洞租出去一样。两根柱子之间砌上砖墙，或钉起木板，就隔成一间屋。门上装着沉重的木门和笨大的本地挂锁。门锁着，就表示主人不在。墙上几行粗陋的粉笔字或油漆字，会告诉别人他去了哪里。有些话还粗鄙得很。
        - id: ch01-b205
          speaker: narrator
          text: 比如一处写着，卢图夫·乌拉去了库尔德斯坦。下面还有首粗俗的打油诗，求真主解释，既然能让跳蚤住在喀布尔人的袍子上，为什么还让卢图夫这只虱子活那么久。
        - id: ch01-b206
          speaker: narrator
          text: 金护着喇嘛，在焦躁的人群和牲口中挤过去，又沿拱廊侧着身，一直走到最远、最靠近火车站的地方。贩马人马哈布·阿里每次从北方山口之外那片神秘土地回来，就住在那里。
        - id: ch01-b207
          speaker: narrator
          text: 金短短的一生里，和马哈布做过许多买卖，尤其是在十岁到十三岁之间。那个魁梧的阿富汗人已经不年轻了。他为了遮住白胡子，用石灰把胡须染成鲜红。他很清楚金有多会打听消息。有时，他让金盯住一个和马匹毫无关系的人，整整跟上一天，再回来报告那个人同谁说过话。
        - id: ch01-b208
          speaker: narrator
          text: 晚上，金会从头到尾说一遍。马哈布一个字也不插，脸上也不露任何神色。金知道，那是一种秘密勾当。不过事情真正的价值，就在于绝不能对马哈布以外的人提起。作为报酬，马哈布会请他吃客栈门口饭铺里的热饭。有一次，他甚至给了金整整八安那钱。
        - id: ch01-b209
          speaker: kim
          text: 他在这里。
        - id: ch01-b210
          speaker: narrator
          text: 金敲了敲一头坏脾气骆驼的鼻子，在一座阴暗的拱洞前停下，又溜到茫然的喇嘛身后。
        - id: ch01-b211
          speaker: kim
          text: 喂，马哈布·阿里！
        - id: ch01-b212
          speaker: narrator
          text: 贩马人松开绣花的宽大布哈拉腰带，躺在一对丝毯马鞍袋上，懒洋洋地吸着巨大的银水烟壶。听见有人喊，他只略微转头。眼前只有一个高高的沉默身影，他便从胸腔深处低笑起来。
        - id: ch01-b213
          speaker: mahbub_ali
          text: 真主啊，是个喇嘛！一个红衣喇嘛！从拉合尔到北方山口，可是远得很。你来这里做什么？
        - id: ch01-b214
          speaker: narrator
          text: 喇嘛下意识地伸出托钵。
        - id: ch01-b215
          speaker: mahbub_ali
          text: 愿上帝诅咒所有不信道的人！我才不施舍给长虱子的西藏人。去问骆驼后面那些巴尔蒂人吧。他们也许看重你的祝福。喂，马倌们，这儿来了个你们的同乡。看看他是不是饿了。
        - id: ch01-b216
          speaker: narrator
          text: 一个跟着马队下山的巴尔蒂人剃着头，背也弓了。他名义上算是某种低等佛教徒，见到祭司便百般恭顺。
        - id: ch01-b217
          speaker: balti_groom
          text: 圣人，请到我们火边坐吧。
        - id: ch01-b218
          speaker: narrator
          text: 他用粗重的喉音恳请喇嘛过去。
        - id: ch01-b219
          speaker: kim
          text: 去吧！
        - id: ch01-b220
          speaker: narrator
          text: 金轻轻推了老人一下。喇嘛大步走开，把他留在拱廊边。
        - id: ch01-b221
          speaker: mahbub_ali
          text: 走开，小印度教徒。愿上帝诅咒所有不信道的人！滚去找我马队里和你同教的人讨饭，总会有几个印度教徒。
        - id: ch01-b222
          speaker: kim
          text: 大人，我父亲死了，母亲也死了，肚子还是空的。
        - id: ch01-b223
          speaker: narrator
          text: 金拿出印度教徒哀求时的哭腔，十分陶醉于这场戏。
        - id: ch01-b224
          speaker: mahbub_ali
          text: 我说了，去马群里找我的人讨。队里总有和你同教的。
        - id: ch01-b225
          speaker: kim
          text: 哎呀，马哈布·阿里，难道我是印度教徒吗？
        - id: ch01-b226
          speaker: narrator
          text: 金换成英语。贩马人一点也不惊讶，只从浓密的眉毛底下打量着他。
        - id: ch01-b227
          speaker: mahbub_ali
          text: 全世界的小朋友，这是怎么回事？
        - id: ch01-b228
          speaker: kim
          text: 没什么。我现在是那位圣人的弟子，我们要一起去朝圣。他说要去贝拿勒斯。他疯得很。我也在拉合尔待腻了，想换换空气和水。
        - id: ch01-b229
          speaker: mahbub_ali
          text: 可你在替谁办事？你为什么来找我？
        - id: ch01-b230
          speaker: narrator
          text: 马哈布的声音突然严厉起来，满是疑心。
        - id: ch01-b231
          speaker: kim
          text: 不找你，我还能找谁？我没钱，出门时一个钱都没有可不妙。你要把很多马卖给军官，这批新马都很不错，我已经看过了。马哈布·阿里，借我一卢比吧。等我发了财，就写借据还你。
        - id: ch01-b232
          speaker: mahbub_ali
          text: 嗯，让我想一想。
        - id: ch01-b233
          speaker: narrator
          text: 马哈布飞快地盘算起来。
        - id: ch01-b234
          speaker: mahbub_ali
          text: 你从没骗过我。把那喇嘛叫回来。然后你退到暗处去。
        - id: ch01-b235
          speaker: kim
          text: 哦，我们两个说的话一定对得上。
        - id: ch01-b236
          speaker: narrator
          text: 金笑了。喇嘛回来以后，很快听明白马哈布的问题。
        - id: ch01-b237
          speaker: lama
          text: 我们要去贝拿勒斯。这孩子和我同行。我要寻找一条河。
        - id: ch01-b238
          speaker: mahbub_ali
          text: 也许吧。可这个孩子为什么跟着你？
        - id: ch01-b239
          speaker: lama
          text: 他是我的弟子。我想，他是被派来领我找到那条河的。我正坐在一门大炮下面，他忽然出现。幸运的人如果获准得到指引，有时就会遇上这样的事。不过，我想起来了。他说自己属于尘世，是个印度教徒。
        - id: ch01-b240
          speaker: mahbub_ali
          text: 他叫什么名字？
        - id: ch01-b241
          speaker: lama
          text: 我没有问。他不是我的弟子吗？
        - id: ch01-b242
          speaker: mahbub_ali
          text: 他是哪国人？哪个族？哪个村？是穆斯林、锡克人、印度教徒，还是耆那教徒？他的种姓是高是低？
        - id: ch01-b243
          speaker: lama
          text: 我为什么要问？在中道之中，没有高，也没有低。他既然是我的弟子，难道还有谁会把他从我身边夺走吗？谁愿意，谁又能这样做？你看，没有他，我就找不到那条河。
        - id: ch01-b244
          speaker: narrator
          text: 喇嘛庄重地摇了摇头。
        - id: ch01-b245
          speaker: mahbub_ali
          text: 没人会把他夺走。去吧，回到我的巴尔蒂人那里坐着。
        - id: ch01-b246
          speaker: narrator
          text: 喇嘛得到了保证，安心地走开了。
        - id: ch01-b247
          speaker: kim
          text: 他是不是疯透了？我为什么要骗你，朝觐者？
        - id: ch01-b248
          speaker: narrator
          text: 金重新走到亮处。马哈布默默抽着水烟。过了一会儿，他几乎用耳语开口。
        - id: ch01-b249
          speaker: mahbub_ali
          text: 安巴拉就在去贝拿勒斯的路上。要是你们两个人真的往那里去。
        - id: ch01-b250
          speaker: kim
          text: 啧，啧！我已经说过了。他和你我不一样，他根本不会撒谎。
        - id: ch01-b251
          speaker: mahbub_ali
          text: 你替我带一封口信到安巴拉，我就给你钱。事情关系到一匹马，是一匹白种马。我上次从山口回来，把它卖给了一位军官。不过，那匹白马的血统，当时还没有完全查清。那位军官现在就在安巴拉，叫我查明以后告诉他。
        - id: ch01-b252
          speaker: narrator
          text: 马哈布叫金站近一点，伸出手，装作向他乞讨。接着，他仔细描述了那匹马，也说清楚那位军官的相貌。
        - id: ch01-b253
          speaker: mahbub_ali
          text: 见到军官，你就告诉他，白种马的血统已经完全查清。他一听，就知道你是我派去的。他会问，有什么凭据？你就回答，马哈布·阿里已经把凭据交给我。
        - id: ch01-b254
          speaker: kim
          text: 原来全是为了一匹白种马的血统。
        - id: ch01-b255
          speaker: narrator
          text: 金咯咯笑着，眼睛却亮得像火。
        - id: ch01-b256
          speaker: mahbub_ali
          text: 那份血统证明，我现在就用自己的办法交给你。然后，我还得狠狠骂你几句。
        - id: ch01-b257
          speaker: narrator
          text: 一道影子从金身后掠过去，旁边还有一头正在吃东西的骆驼。马哈布忽然抬高了嗓门。
        - id: ch01-b258
          speaker: mahbub_ali
          text: 真主啊！全城只有你一个乞丐吗？你娘死了，你爹也死了。哪个乞丐不是这样？好了，好了，拿去！
        - id: ch01-b259
          speaker: narrator
          text: 他转身在身边摸索，扔给男孩一块柔软油腻的穆斯林面饼。
        - id: ch01-b260
          speaker: mahbub_ali
          text: 今晚滚去和我的马倌睡。你和那个喇嘛都去。明天，也许会有差事交给你。
        - id: ch01-b261
          speaker: narrator
          text: 金咬着面饼溜走了。果然，饼里包着一小团折起来的薄纸，外面裹着油布。旁边还有三枚银卢比。这份赏赐大得惊人。金微微一笑，把钱和纸一起塞进脖子上的皮护身符袋。
        - id: ch01-b262
          speaker: narrator
          text: 马哈布的巴尔蒂人盛情款待了喇嘛。老人已经吃饱，睡在马厩的一角。金在他身边躺下，暗暗发笑。他知道，自己又替马哈布·阿里办了一件事。而且，他连短短一分钟也没相信过那个种马血统的故事。
        - id: ch01-b263
          speaker: narrator
          text: 可是金不知道，马哈布·阿里不只是旁遮普最出色的马商之一，也不只是一个富有而敢闯的生意人。他的商队深入天涯海角。在印度测绘局一本上锁的册子里，他还有一个代号，C25 IB。
        - id: ch01-b264
          speaker: narrator
          text: 每年会有两三次，C25送来一份小小的报告。文字写得干巴巴的，内容却很有意思。拿R17和M4的报告核对以后，通常句句属实。里面写着偏远山国的情形，写着英国以外各国的探险者，也写军火买卖。简单说，这些报告只是印度政府据以行动的那一大堆所得情报里，很小的一部分。
        - id: ch01-b265
          speaker: narrator
          text: 最近，五位原本不该结盟的国王结成了同盟。一个友善的北方强国又向他们透露，有消息正从他们的领地漏到英属印度。五国的首相很恼怒，便照东方人的办法采取了行动。他们怀疑很多人，其中就有这个蛮横的红胡子马商。他的商队穿越那些险地时，常常要在齐腹深的雪里开路。
        - id: ch01-b266
          speaker: narrator
          text: 至少在这一季下山途中，他的商队已经两次遇到伏击和枪击。马哈布的手下收拾了三个陌生匪徒。那些人也许受雇来对付他，也许不是。因此，马哈布没有在有害健康的白沙瓦停留，而是一口气赶到拉合尔。他了解自己的同胞，知道后面还会有很值得琢磨的事情。
        - id: ch01-b267
          speaker: narrator
          text: 马哈布身上确实有一样东西，他一刻也不想多留。那是一团紧紧折起、包在油布里的薄纸。纸上没有署名，也没有收件人，只在一角扎了五个针尖大的小孔。那份陈述可耻地出卖了五位结盟的国王、同情他们的北方强国、白沙瓦的一名印度教银行家、比利时的一家枪械制造商，还有南方一位地位显赫、半独立的穆斯林统治者。
        - id: ch01-b268
          speaker: narrator
          text: 最后一部分是R17的工作。马哈布越过多拉山口以后，替他取走了报告。因为一些无法控制的情况，R17不能离开观察哨。和C25的这份报告相比，炸药简直温顺得像牛奶。哪怕是个把时间看得和东方人一样随意的人，也知道它越早送到正确的人手里越好。
        - id: ch01-b269
          speaker: narrator
          text: 马哈布不想横死。边境外还有两三桩家族血仇等着他了结。等这些账清完，他准备安顿下来，做一个多少还算有德行的公民。两天前到了拉合尔以后，他一步也没有走出客栈大门，却大张旗鼓地往许多地方发了电报。
        - id: ch01-b270
          speaker: narrator
          text: 电报发到孟买，那里存着他的一部分钱。也发到德里，因为一个同族合伙人正在那里，把马匹卖给拉杰普塔纳某邦的代理人。还有电报发往安巴拉，那里有个英国人急着索要一匹白种马的血统证明。
        - id: ch01-b271
          speaker: narrator
          text: 懂英语的代笔人替他拟出漂亮的电文。安巴拉月桂银行克赖顿收。马匹确如先前所告，系阿拉伯种。万分抱歉，血统文件因翻译耽搁。后来，同一个地址又收到一封。耽搁深感抱歉，血统文件将寄出。发给德里合伙人的电报则说，卢图夫·乌拉收，已经汇两千卢比到卢奇曼·纳兰银行贵账户。
        - id: ch01-b272
          speaker: narrator
          text: 这些看起来全是生意来往。可每一封电报，都会由一个愚笨的巴尔蒂人送去火车站。一路上，各种人都可以随意查看。电报发出以前，那些自以为利益相关的人，还会把内容反复讨论一遍又一遍。
        - id: ch01-b273
          speaker: narrator
          text: 用马哈布自己的生动说法，他拿谨慎这根棍子，把调查之井搅得一片浑浊。就在这个时候，金从天而降。马哈布做事果断，也不讲顾忌。他一向敢抓住任何突然出现的机会，所以当场就把金派上了用场。
        - id: ch01-b274
          speaker: narrator
          text: 一个云游喇嘛，带着低种姓的小仆人，在朝圣者遍地的印度行走，最多只会惹人多看一眼。没人会怀疑他们。更重要的是，也没人会抢他们。
        - id: ch01-b275
          speaker: narrator
          text: 马哈布叫人给水烟壶换上新炭，仔细想了想。哪怕事情坏到极点，男孩遇了害，那张纸也牵连不到任何人。他可以慢慢去安巴拉，冒一点惹出新怀疑的风险，再把消息亲口告诉有关的人。
        - id: ch01-b276
          speaker: narrator
          text: 不过，R17的报告是整件事的核心。要是没送到，会非常不方便。但上帝至大，马哈布觉得眼下能做的都已经做了。世上只有金从不对他撒谎。幸亏马哈布也知道，为了自己的目的，或者为了替马哈布办差，金对别人撒起谎来活像个东方人。不然，不对马哈布撒谎这一点，反而会成为金性格上致命的缺陷。
        - id: ch01-b277
          speaker: narrator
          text: 后来，马哈布晃出客栈，去了鸟身女妖之门。那里的女人描画眼睛，专门诱捕异乡人。他特意去拜访其中一个姑娘，因为有理由相信，她和一个脸庞光滑的克什米尔博学者非常亲近。那个学者曾为电报的事，拦住过马哈布那个头脑简单的巴尔蒂人。
        - id: ch01-b278
          speaker: narrator
          text: 他们不顾先知的戒律，喝起加香的白兰地。这种做法实在愚蠢。马哈布醉得厉害，嘴上的门闩也松了。他迈着沉醉的脚步追逐欢喜花，最后一头扑倒在软垫之间。欢喜花在那个光面孔博学者的帮助下，把他从头到脚搜了个遍。
        - id: ch01-b279
          speaker: narrator
          text: 差不多在同一时候，金听见马哈布空荡的马厩里传来轻轻的脚步声。说来也怪，贩马人居然没锁门。他的手下正忙着吃一整只羊，庆祝回到印度。那是马哈布赏给他们的。
        - id: ch01-b280
          speaker: narrator
          text: 一个从德里来的油头粉面年轻人，拿着一串钥匙走进马厩。钥匙是欢喜花从昏迷不醒的马哈布腰带上解下来的。年轻人翻遍每一只箱子、包袱、垫子和马鞍袋。他搜得比欢喜花和博学者检查主人时还要细。
        - id: ch01-b281
          speaker: flower_of_delight
          text: 要我说，他只是一头阿富汗贩马猪。脑子里除了女人和马，什么都没有。再说，就算真有那件东西，他也可能早已送出去了。
        - id: ch01-b282
          speaker: narrator
          text: 一个小时以后，欢喜花把圆润的胳膊肘支在马哈布那具鼾声大作的身躯上，轻蔑地说着。
        - id: ch01-b283
          speaker: scholar
          text: 不会。那件事关系到五位国王，他一定会把东西贴着自己的黑心藏好。真的什么都没找到？
        - id: ch01-b284
          speaker: narrator
          text: 德里来的男人走进屋，笑着重新扎好头巾。
        - id: ch01-b285
          speaker: delhi_man
          text: 我连他的鞋底夹层都搜过了，就像欢喜花搜他的衣服一样仔细。他不是我们要找的人。一定另有其人。很少有什么东西能逃过我的眼睛。
        - id: ch01-b286
          speaker: scholar
          text: 他们也没有说，他一定就是那个人。他们只说，我们的谋划受到了搅扰，所以查一查，看他是不是那个人。
        - id: ch01-b287
          speaker: flower_of_delight
          text: 北方来的马贩子，多得像旧袍子上的虱子。还有西坎达尔·汗、努尔·阿里·贝格和法鲁克·沙阿。他们个个都是商队头领，也都在那里做买卖。
        - id: ch01-b288
          speaker: scholar
          text: 他们还没到。以后，你也得把他们套住。
        - id: ch01-b289
          speaker: flower_of_delight
          text: 呸！这钱可真不容易挣。法鲁克·沙阿是头熊，阿里·贝格是个亡命徒。至于老西坎达尔·汗——咿呀！走吧，我要睡了。这头猪到天亮以前都醒不了。
          emotion: disgusted
        - id: ch01-b290
          speaker: narrator
          text: 欢喜花厌恶地把马哈布的脑袋从自己腿上推开。等马哈布醒来，她又一本正经地训斥他喝醉酒的罪过。亚洲人胜过敌手时，并不会眨眼示意。不过，马哈布·阿里清清嗓子，系紧腰带，在清晨的星光下摇晃着走出去时，差点还是眨了一下眼。
        - id: ch01-b291
          speaker: mahbub_ali
          text: 只有小马驹才会上这种当！好像白沙瓦的姑娘个个不会这一套似的。不过，这场戏倒演得漂亮。如今只有上帝知道，大路上还有多少人奉命试探我。说不定，他们会拿刀来试。所以，那孩子必须去安巴拉，还得坐火车。那份文字很紧急。我就留在这里，继续追逐欢喜花，喝酒喝得像个阿富汗马贩子。
        - id: ch01-b292
          speaker: narrator
          text: 他在自己马厩隔壁的第二间停住。手下们全都睡得很沉，金和喇嘛却不见了。
        - id: ch01-b293
          speaker: mahbub_ali
          text: 起来！昨晚睡在这里的喇嘛和男孩去哪儿了？有没有少东西？
        - id: ch01-b294
          speaker: groom
          text: 没少。第二遍鸡叫的时候，那个老疯子起来了，说要去贝拿勒斯。小家伙领着他走了。
        - id: ch01-b295
          speaker: mahbub_ali
          text: 愿真主诚心诅咒所有不信道的人！
        - id: ch01-b296
          speaker: narrator
          text: 马哈布爬回自己的马厩，胡须里还在低声咒骂。
        - id: ch01-b297
          speaker: narrator
          text: 可真正叫醒喇嘛的人，正是金。夜里，他把一只眼睛贴在木板节孔上，看见了德里人搜查箱子。那绝不是普通的贼。普通窃贼不会翻看信件、账单和马鞍，不会用小刀横着割开马哈布的鞋底，也不会那么熟练地挑开马鞍袋的接缝。
        - id: ch01-b298
          speaker: narrator
          text: 一开始，金想拖长声音大喊捉贼。只要他这样叫上一声，整座客栈都会在黑夜里沸腾起来。可是，他看得更仔细了。他把手按在护身符袋上，自己得出了结论。
        - id: ch01-b299
          speaker: kim
          text: 他们一定在找那个白马谎话里的血统证明，也就是我要带去安巴拉的东西。我们最好现在就走。拿刀搜袋子的人，接下来也许会拿刀搜肚子。这背后肯定有个女人。
        - id: ch01-b300
          speaker: narrator
          text: 金贴近睡得很浅的老人，轻声叫他。
        - id: ch01-b301
          speaker: kim
          text: 嗨，嗨，起来吧。时候到了。我们该去贝拿勒斯了。
        - id: ch01-b302
          speaker: narrator
          text: 喇嘛顺从地站起身。两个人像影子一样，走出了客栈。
