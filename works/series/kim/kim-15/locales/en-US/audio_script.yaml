  chapters:
    - id: ch01
      title: CHAPTER XV
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: I would not make room for an emperor, though I might hold the road for a king. I would never bow to the Triple Crown. But this is different. I will not fight the Powers of Air. Let the sentries pass him and lower the drawbridge. He is lord of us all, the dreamer whose dream came true.
        - id: ch01-b02
          speaker: narrator
          text: Two hundred miles north of Chini, Yankling Sahib stood on the blue shale of Ladakh. He angrily searched the ridges through his spyglass for his favorite tracker from Ao-chung. The man was nowhere near. Armed with a new Mannlicher rifle and two hundred cartridges, he was shooting musk deer for sale. Yankling would not learn how badly ill his tracker had been until the next season.
        - id: ch01-b03
          speaker: narrator
          text: Far south in the valleys of Bushahr, the far-seeing Himalayan eagles swerved above a new blue-and-white umbrella. Beneath it hurried Hurree Babu, once fat and fine-looking, now lean and weather-beaten from hard travel. Two distinguished foreigners had thanked him for guiding them with considerable skill toward Mashobra tunnel and the grand capital at Simla. Wet mist had hidden the telegraph station and the European settlement at Kotgarh, so naturally he had led them past both. Then, while discoursing charmingly about the gods, he had taken them into Nahan. The Rajah there mistook the foreigners for British soldiers who had deserted.
        - id: ch01-b04
          speaker: narrator
          text: Hurree explained how great his companions were in their own country until the sleepy little king smiled. He gave that explanation loudly, often, and in a new form to everyone who asked. He begged their meals, found them lodging, and expertly treated the sort of groin injury a man might get by tumbling down a rocky hill in darkness. In every difficulty, he made himself essential.
        - id: ch01-b05
          speaker: narrator
          text: His reason for helping them did him credit. Like millions of his countrymen, he had learned to think of Russia as the great liberator from the North. He was, he said, a fearful man. He had dreaded the thought that angry villagers might harm his distinguished employers. As for striking a holy man himself, he would never dream of it. He was only deeply grateful that his little efforts had brought their expedition to success, apart from their lost baggage. He had forgotten every blow and denied that any had been struck on that disgraceful first night beneath the pines.
        - id: ch01-b06
          speaker: narrator
          text: Hurree wanted no pension or regular fee. He asked only for a testimonial, if they thought him worthy. It might help if their friends ever crossed the passes. He hoped they would remember him when they rose to greatness, for he subtly believed that Mohendro Lal Dutt, Master of Arts of Calcutta, had done the State some service.
        - id: ch01-b07
          speaker: narrator
          text: The foreigners gave him a certificate praising his courtesy, helpfulness, and perfect skill as a guide. He tucked it into his waist-belt and wept over the dangers they had shared. At noon he led them through the crowds on Simla Mall to the Alliance Bank, where they meant to prove who they were. Then he vanished like a morning cloud over Jakko.
        - id: ch01-b08
          speaker: narrator
          text: Soon he was climbing toward Shamlegh, drawn too fine even to sweat and too hurried to advertise the medicines in his little brass-bound box. He had put aside every trace of the self-important Babu. At noon he smoked on a cot while a woman in a turquoise-studded headdress pointed southeast across bare grass. A litter, she told him, could not move as quickly as a man alone, but his birds ought to be down in the Plains by now. Lispeth had urged the holy man to stay, but he would not.
        - id: ch01-b09
          speaker: narrator
          text: Hurree groaned, gathered himself, and set out again. He disliked traveling after dark, yet his marches by day would have astonished anyone who mocked his race. Villagers remembered the Dacca medicine seller from two months before and sheltered him from the spirits of the woods. At night he dreamed of Bengali gods, university textbooks, and the Royal Society in London. At dawn, the blue-and-white umbrella bobbed onward.
        - id: ch01-b10
          speaker: narrator
          text: Meanwhile, at the edge of the Doon, Mussoorie lay far behind and the Plains opened ahead in golden dust. A worn litter rested there. Everyone in the Hills knew it carried a sick lama searching for a River that would heal him. Villages had nearly fought for the honor of bearing him. The lama gave blessings, and Kim paid well, a full third of a Sahib's rate.
        - id: ch01-b11
          speaker: narrator
          text: The greasy, rubbed ends of the poles showed that the litter had covered twelve miles a day over roads few Sahibs used. It had crossed the Nilang Pass in a storm, with driven snow filling every fold of the lama's robe. It had passed between the black horns of Raieng while wild goats whistled through the clouds. It pitched over loose shale, and men gripped it between shoulder and jaw around the dreadful curves below Bhagirati. It creaked downhill into the Valley of the Waters, pushed through the valley's steamy floor, then climbed again into the roaring winds from Kedarnath.
        - id: ch01-b12
          speaker: narrator
          text: At noon it rested in the dim shelter of friendly oak woods. At chilly dawn it passed from village to village, while even faithful bearers cursed an impatient holy man. Sometimes it moved by torchlight, when even brave people thought of ghosts. Now its last stage was over. In the gentler heat of the lower Siwaliks, the little hill men wiped away their sweat and gathered around the two priests for a blessing and the wages they had earned.
        - id: ch01-b13
          speaker: lama
          text: You have earned merit, more merit than you know. And you will return to the Hills.
        - id: ch01-b14
          speaker: hill_bearer
          text: Surely we will. Back to the high Hills as soon as we can.
        - id: ch01-b15
          speaker: narrator
          text: The bearer rubbed his shoulder, drank water, spat it out, and tightened his grass sandal. Kim's face was drawn with weariness. He paid out tiny silver coins, lifted down the food bag, pushed an oilskin packet of supposed holy writings inside his robe, and helped the lama stand. Peace had returned to the old man's eyes. He no longer feared that the hills would fall and crush him, as he had on the terrible night when a flooded river delayed them.
        - id: ch01-b16
          speaker: narrator
          text: The bearers raised the litter and disappeared between clumps of scrub.
        - id: ch01-b17
          speaker: narrator
          text: The lama lifted one hand toward the wall of the Himalayas.
        - id: ch01-b18
          speaker: lama
          text: The Arrow of Our Lord did not fall among you, blessed Hills. I shall never breathe your air again.
          emotion: sad
        - id: ch01-b19
          speaker: kim
          text: But this good air makes you ten times stronger. The Arrow fell here, or somewhere near. We can go gently, perhaps one kos a day, because our Search is certain now. Only this bag is very heavy.
        - id: ch01-b20
          speaker: lama
          text: Yes, our Search is certain. I have escaped a great temptation.
        - id: ch01-b21
          speaker: narrator
          text: From then on they managed no more than a couple of miles a day, and Kim carried every burden. He supported the old man, hauled the heavy food bag with its locked books, kept the writings hidden against his heart, and handled every part of their daily life. At dawn he begged. He spread blankets for the lama's meditation. Through the midday heat, he held the weary head in his lap and drove off flies until his wrists ached. He begged again each evening and rubbed the lama's feet. In return, the lama promised Freedom today, tomorrow, or the next day at the latest.
        - id: ch01-b22
          speaker: lama
          text: No one ever had such a chela. Sometimes I wonder whether Ananda served Our Lord more faithfully. Yet you are a Sahib. Long ago, when I was still a man of the world, I forgot that. Now I look at you and remember it each time. How strange.
        - id: ch01-b23
          speaker: kim
          text: You taught me there is no black or white, so why trouble me with that now? Give me your other foot. I am not a Sahib. I am your chela, and my head feels heavy on my shoulders.
        - id: ch01-b24
          speaker: lama
          text: Be patient a little longer. We will reach Freedom together. From the far bank of the River, we will look back on our lives as we looked down from the Hills upon the road behind us. Perhaps I too was once a Sahib.
        - id: ch01-b25
          speaker: kim
          text: There was never a Sahib like you. I swear it.
        - id: ch01-b26
          speaker: lama
          text: I am sure the Keeper of the Images in the Wonder House was a wise abbot in another life. Yet not even his spectacles can clear my sight. Shadows come when I try to look steadily. It does not matter. We know how the foolish body plays its tricks, one shadow changing into another. Time and Space still bind me. How far did our bodies travel today?
        - id: ch01-b27
          speaker: kim
          text: Perhaps half a kos.
        - id: ch01-b28
          speaker: narrator
          text: It had been three quarters of a mile, and every step was hard.
        - id: ch01-b29
          speaker: lama
          text: Half a kos! In the spirit I traveled ten thousand times ten thousand. We are wrapped and bound in these senseless things.
        - id: ch01-b30
          speaker: narrator
          text: He looked at his thin, blue-veined hand. Even the prayer beads felt heavy in it.
        - id: ch01-b31
          speaker: lama
          text: Chela, do you never wish to leave me?
        - id: ch01-b32
          speaker: narrator
          text: Kim thought of the oilskin packet and the books in the food bag. If someone with proper authority would only take them, the Great Game could play itself for all he cared. His head was hot with fatigue, and a deep cough troubled him.
        - id: ch01-b33
          speaker: kim
          text: No. I am not a dog or a snake that bites after it has learned to love.
        - id: ch01-b34
          speaker: lama
          text: You are too tender with me.
        - id: ch01-b35
          speaker: kim
          text: It is not that. I did one thing without asking you. I sent word to the Kulu woman through the woman who brought goat's milk this morning. I said you were weak and needed a litter. I blame myself for waiting until now. We will stay here until it comes.
        - id: ch01-b36
          speaker: lama
          text: I am content. She has a heart of gold, as you say, though she does talk. She talks a little.
        - id: ch01-b37
          speaker: kim
          text: She will not tire you. I arranged that too. Holy One, my heart is heavy with all the ways I failed you. I made you walk too far. I did not always find good food. I forgot the heat. I stopped to talk with people and left you alone. I have done so much wrong. Hai mai! I love you, but now it is too late. I was only a child. Why was I not a man?
          emotion: sad
        - id: ch01-b38
          speaker: narrator
          text: The strain, exhaustion, and burden that were too great for his years overcame him. Kim fell at the lama's feet and sobbed.
        - id: ch01-b39
          speaker: lama
          text: What is all this? You never moved a hair's breadth from the Way of Obedience. Neglect me? Since Shamlegh, I have lived on your strength as an old tree lives on the lime of a new wall. Day after day, I stole that strength from you. Your weakness comes from no fault of yours. It is the silly, stupid Body speaking now, not the certain Soul. Take comfort. At least know the devils you fight. They are born of earth and illusion.
          emotion: calm
        - id: ch01-b40
          speaker: lama
          text: We will go to the woman from Kulu. She will gain merit by sheltering us, and especially by caring for me. You will run free until your strength returns. I had forgotten the foolish Body. If anyone is to blame, it is I. But we stand too close to the Gates of Deliverance to weigh blame now. I might praise you, but why should I? Very soon we will sit beyond every need.
          emotion: calm
        - id: ch01-b41
          speaker: narrator
          text: The lama stroked and comforted Kim. He offered wise sayings and solemn texts about the Body, that little-understood creature which claims to be the Soul, darkens the Way, and breeds countless unnecessary devils.
        - id: ch01-b42
          speaker: lama
          text: Hai! Let us speak of the Kulu woman. Will she ask for another charm for her grandsons? When I was young, these vapors and others troubled me. I went to an abbot, a holy seeker of truth, though I did not know it then. Sit up and listen, child of my soul. When I had told my tale, he said, "Chela, the world holds many lies and many liars, but none lie like our bodies, except the feelings of our bodies." His words comforted me, and in his kindness he allowed me to drink tea with him. Now allow me tea, for I am thirsty.
        - id: ch01-b43
          speaker: narrator
          text: Kim laughed through his tears, kissed the lama's feet, and began making tea.
        - id: ch01-b44
          speaker: kim
          text: You lean on me with your body, Holy One, but I lean on you for other things. Do you know that?
        - id: ch01-b45
          speaker: lama
          text: I may have guessed. We must change that.
        - id: ch01-b46
          speaker: narrator
          text: Soon, amid scraping feet and a great air of importance, the Sahiba's own palanquin arrived after a journey of twenty miles. Her familiar gray-haired Oorya servant led it. They carried Kim and the lama to the rambling white house behind Saharunpore, where disorder somehow had its own order.
        - id: ch01-b47
          speaker: narrator
          text: After the usual greetings, the Sahiba called cheerfully from an upper window.
        - id: ch01-b48
          speaker: sahiba
          text: What use is an old woman's advice to an old man? I told you to watch your chela. I told you, Holy One! And how did you do it? Do not answer. I know. He has been running after women. Look at those hollow eyes and that betraying line from his nose downward. They have drained him dry. Shame! And he a priest!
        - id: ch01-b49
          speaker: narrator
          text: Kim was too exhausted even to smile. He only shook his head.
        - id: ch01-b50
          speaker: lama
          text: Do not joke. That time is past. We have come on serious business. My soul fell sick in the Hills, and his body fell sick. Since then, I have lived by consuming his strength.
        - id: ch01-b51
          speaker: sahiba
          text: Both children, the old one and the young one! May my hospitality restore you. Wait there. I will come and hear all about those fine high Hills.
        - id: ch01-b52
          speaker: narrator
          text: Her son-in-law had returned, so she did not need to inspect the farm that evening. The lama quietly explained the heart of the matter. The two old heads nodded together. Kim had staggered into a room with a cot and fallen into a heavy doze. The lama had forbidden him to lay blankets or fetch food.
        - id: ch01-b53
          speaker: sahiba
          text: I understand. Who would, if I did not? We old people going down to the burning ghats clutch at the hands of the young coming up from the River of Life with brimming water jars. I judged the boy wrongly. He lent you his strength? Yes, the old consume the young every day. Now we must give it back.
        - id: ch01-b54
          speaker: lama
          text: You have gained merit many times.
        - id: ch01-b55
          speaker: sahiba
          text: My merit? What use is it? I am an old bag of bones, cooking curries for men who never ask who made them. If only I could store merit for my grandson.
        - id: ch01-b56
          speaker: lama
          text: The grandson who had the pain in his belly?
        - id: ch01-b57
          speaker: sahiba
          text: The Holy One remembers that! I must tell his mother. What an honor! He remembered the child with the bellyache at once. She will be proud.
        - id: ch01-b58
          speaker: lama
          text: My chela is to me what a son is to those who lack enlightenment.
        - id: ch01-b59
          speaker: sahiba
          text: Say a grandson. Mothers lack the wisdom of our years. When a child cries, they think the heavens are falling. A grandmother stands far enough from the pain of birth and the pleasure of nursing to ask whether the cry means wickedness or merely wind. Speaking of wind, Holy One, perhaps I pressed you too hard for charms the last time you came.
        - id: ch01-b60
          speaker: lama
          text: Sister, if charms give you comfort, then I, once Abbot of Such-zen, will make all you wish. I have never seen your face.
        - id: ch01-b61
          speaker: sahiba
          text: Even the monkeys stealing our loquats count that in my favor!
          emotion: happy
        - id: ch01-b62
          speaker: lama
          text: Yet the boy sleeping across the courtyard called your heart golden. In spirit, he is truly my grandson.
        - id: ch01-b63
          speaker: sahiba
          text: Good! Then I am the Holy One's cow. I am old, and I have borne sons. Once I knew how to please men. Now I know how to cure them. I will take the boy, give him medicine, fill him with food, and make him whole. Hai! We old people still know a few things.
        - id: ch01-b64
          speaker: narrator
          text: When Kim woke aching in every bone, he tried to go to the cookhouse for his master's food. Instead he found the veiled old Sahiba blocking the door, with the gray-haired servant beside her. They told him precisely what he must not do.
        - id: ch01-b65
          speaker: sahiba
          text: You say you must have something? You shall have nothing. A locked box for holy books? That is different. Heaven forbid I should stand between a priest and his prayers. We will bring it, and you may keep the key.
        - id: ch01-b66
          speaker: narrator
          text: They pushed a chest beneath his cot. Kim locked away Mahbub's pistol, the packet of letters in oilskin, and the books and diaries. He groaned with relief. For some absurd reason, carrying them on his shoulders had been far easier than bearing them in his mind. Through every helpless day, he had known they were there and could tell no one what they meant. At night, that hidden weight seemed to settle on his neck until it ached.
        - id: ch01-b67
          speaker: sahiba
          text: Your illness is rare among the young now that they have stopped caring for their elders. Sleep and certain medicines will cure it.
        - id: ch01-b68
          speaker: narrator
          text: Kim gladly yielded to the blankness that frightened and soothed him at once. In some mysterious workroom, the Sahiba brewed foul-smelling drinks that tasted even worse. She watched until he swallowed them, then questioned him closely when they came back up.
        - id: ch01-b69
          speaker: narrator
          text: She banned everyone from the courtyard and posted an armed man to enforce her order. He was more than seventy years old, and his sword had no blade beyond the hilt. Still, he carried the Sahiba's authority. Loaded carts, noisy servants, calves, dogs, and hens all made a wide circle around him.
        - id: ch01-b70
          speaker: narrator
          text: Best of all, she chose a cousin's widow from the crowd of poor relations behind the house, those household dogs who never tired of praising their patroness. The woman understood what Europeans ignorantly called massage. The two women laid Kim east to west so the mysterious currents of the earth would help rather than hinder his body. All afternoon they worked him apart, bone by bone, muscle by muscle, ligament by ligament, and finally nerve by nerve. Behind veils that forever flicked and shifted before their eyes, they kneaded him into helpless pulp and left him almost hypnotized. Then Kim sank ten thousand miles into sleep. For thirty-six hours it soaked him like rain after drought.
        - id: ch01-b71
          speaker: narrator
          text: Afterward the Sahiba fed him, and the whole house spun beneath her orders. Chickens were killed. The old, slow gardener sweated to bring vegetables. She called for spices, milk, onions, little river fish, limes for sherbet, fat quail, and chicken livers threaded on skewers with slices of ginger.
        - id: ch01-b72
          speaker: sahiba
          text: I have seen enough of the world to know there are two kinds of women. One kind takes a man's strength, and the other puts it back. I was the first once. Now I am the second. Do not give me that little-priest look. I was joking. The joke may not suit you today, but it will when you return to the Road. Cousin, look at him. His skin shines like a horse after a fresh currying. We polish jewels only to have them tossed to a dancing girl, do we not?
        - id: ch01-b73
          speaker: narrator
          text: Kim sat up smiling. His terrible weakness had fallen away like an old shoe. A week before, the lightest word had clogged his tongue like ashes. Now he longed to talk freely. The pain in his neck, which he thought he must have caught from the lama, had vanished. So had the heavy dengue aches and the foul taste in his mouth. Less careful of their veils, though still not entirely careless, the two old women clucked as merrily as the hens pecking through the open door.
        - id: ch01-b74
          speaker: kim
          text: Where is my Holy One?
        - id: ch01-b75
          speaker: sahiba
          text: Hear him! Your Holy One is well, though he deserves none of the credit. If I knew a charm that could give him sense, I would sell my jewels to buy it. He refused the good food I cooked, wandered in the fields for two nights without eating, and finally fell in a stream. Is that holiness? Then, after nearly breaking what remained of my heart, he claimed he had gained merit. No, not merit. He said he was free from sin. I could have told him that before he soaked himself. It happened a week ago, and he is well now. A three-year-old has more sense. Do not fret over him. Whenever he is not wading through our streams, he watches you with both eyes.
        - id: ch01-b76
          speaker: kim
          text: I do not remember seeing him. Days and nights went past like white and black bars opening and closing. I was not ill. I was only tired.
        - id: ch01-b77
          speaker: sahiba
          text: That kind of weariness belongs to someone many years older. It is over now.
        - id: ch01-b78
          speaker: narrator
          text: Kim began with a formal title, but the look in her eye made him choose the plain name of love.
        - id: ch01-b79
          speaker: kim
          text: Mother, I owe you my life. How can I thank you? Ten thousand blessings on your house and—
        - id: ch01-b80
          speaker: sahiba
          text: Let the house go without blessings! Thank the gods like a priest if you must, but thank me like a son if you care. Heavens! Did I lift you, turn you, slap you, and twist every one of your toes merely to have sacred texts thrown at my head? Somewhere a mother bore you only to have her heart broken. What were you to her, son?
        - id: ch01-b81
          speaker: kim
          text: I had no mother, my mother. They say she died when I was little.
        - id: ch01-b82
          speaker: sahiba
          text: Hai mai! Then no one can accuse me of stealing her place if, when you take the Road again, this house becomes one among a thousand shelters you have used and forgotten after tossing us a blessing. Never mind. I need no blessing, but—
        - id: ch01-b83
          speaker: narrator
          text: She stamped her foot at the poor relation.
        - id: ch01-b84
          speaker: sahiba
          text: Take those trays back to the house! Why leave stale food here, woman of ill omen?
        - id: ch01-b85
          speaker: cousin_widow
          text: I bore a son too, but he died. You know he died. I was only waiting to be told to carry the tray away.
          emotion: sad
        - id: ch01-b86
          speaker: sahiba
          text: No, I am the woman of ill omen. We old people going down to the funeral shelters clutch hard at the young who carry life's full water jars. When a woman cannot dance at the festival, she must watch from the window, and grandmothering fills all her time. Your master gives me every charm I want for my daughter's eldest because he is free from sin, or so he says. The hakim has fallen low. He poisons my servants because no better victims are available.
          emotion: sad
        - id: ch01-b87
          speaker: kim
          text: What hakim, mother?
        - id: ch01-b88
          speaker: sahiba
          text: The Dacca man whose pill nearly split me into three pieces. He turned up a week ago like a lost camel. He swore you two had become blood brothers in Kulu and pretended to be terribly worried about you. He was thin and hungry, so I ordered them to stuff both him and his worry with food.
        - id: ch01-b89
          speaker: kim
          text: If he is here, I want to see him.
        - id: ch01-b90
          speaker: sahiba
          text: He eats five times a day and lances my workers' boils so he will not burst. His anxiety keeps him beside the cookhouse door, feeding on scraps. He can wait. We will never be rid of him.
        - id: ch01-b91
          speaker: kim
          text: Send him here, mother. I will try.
        - id: ch01-b92
          speaker: sahiba
          text: I will send him, though driving him away would be poor thanks. At least he had sense enough to pull the Holy One from the stream. In doing that, as the Holy One did not say, he gained merit.
        - id: ch01-b93
          speaker: kim
          text: He is a very wise hakim. Send him, mother.
        - id: ch01-b94
          speaker: sahiba
          text: One priest praising another? A miracle! If he is your friend, though you quarreled the last time, I will drag him in with horse ropes and feed him a proper caste dinner afterward. Get up and look at the world. Lying in bed gives birth to seventy devils, my son. My son!
        - id: ch01-b95
          speaker: narrator
          text: She hurried out to raise a storm near the cookhouse. Hurree rolled in almost on her heels. His robe covered his shoulders like a Roman emperor's, his jowls belonged to Titus, his head was bare, and new patent-leather shoes shone below him. He was fat again and overflowed with joy and greetings.
        - id: ch01-b96
          speaker: hurree
          text: By Jove, Mister O'Hara, I am extremely glad to see you. I will kindly shut the door. Such a pity you are sick. Are you very sick?
        - id: ch01-b97
          speaker: kim
          text: The papers from the kilta! The maps and the letters!
        - id: ch01-b98
          speaker: narrator
          text: Kim impatiently held out the key. More than anything, he needed to be rid of the captured papers.
        - id: ch01-b99
          speaker: hurree
          text: Quite right. That is the correct Departmental view. You have everything?
        - id: ch01-b100
          speaker: kim
          text: I took everything handwritten from the kilta. I threw the rest down the hill.
        - id: ch01-b101
          speaker: narrator
          text: The key scraped in the lock. Oilskin slowly tore apart, and papers shuffled. Through all his helpless days, knowing the bundle lay beneath him had tormented Kim beyond reason. Now Hurree bounced to his feet and shook his hand again, and Kim felt the blood tingle through his body.
        - id: ch01-b102
          speaker: hurree
          text: This is fine! It is finest, Mister O'Hara! You have swiped the entire bag of tricks, lock, stock, and barrel. They said eight months' work had gone up the spout. By Jove, how they beat me! Look, here is the letter from Hilas.
        - id: ch01-b103
          speaker: narrator
          text: Hurree chanted a few words of Court Persian, the language of both official and unofficial diplomacy.
        - id: ch01-b104
          speaker: hurree
          text: Mister Rajah Sahib has put his foot straight into a hole. He must officially explain why he writes love letters to the Czar. These maps are very clever too. The letters involve three or four Prime Ministers. By Gad, sir! The British Government will change the succession in Hilas and Bunar and choose new heirs. Most base treason! But perhaps you do not understand?
        - id: ch01-b105
          speaker: kim
          text: Are the papers in your hands now?
        - id: ch01-b106
          speaker: narrator
          text: That was all Kim cared about.
        - id: ch01-b107
          speaker: hurree
          text: You may jolly well bet they are. They go straight to the office. The old lady thinks I am fixed here forever, but I leave immediately. Mister Lurgan will be proud. Officially, you are under my authority, but I will put your name in my spoken report. It is a pity written reports are forbidden. We Bengalis excel in that exact science.
        - id: ch01-b108
          speaker: narrator
          text: Hurree hid the whole treasure around his body in the way only an Oriental could, tossed back the key, and showed Kim the empty chest.
        - id: ch01-b109
          speaker: kim
          text: Good. That is good. I was so tired. My Holy One was ill too. Did he fall into—
        - id: ch01-b110
          speaker: hurree
          text: Oh yes. I am his good friend, you know. He acted very strangely when I came after you, and I thought he might have the papers. I followed him during his meditations and also wished to discuss ethnology. Compared with his charms, I am a very small person here now. Mister O'Hara, he suffers from fits. Catalepsy, and perhaps epilepsy too. I found him under a tree almost dead. Then he jumped up, walked into a stream, and nearly drowned. I pulled him out.
        - id: ch01-b111
          speaker: kim
          text: Because I was not there! He could have died.
        - id: ch01-b112
          speaker: hurree
          text: Yes, he could. He is dry now and claims he has been transfigured.
        - id: ch01-b113
          speaker: narrator
          text: Hurree tapped his forehead knowingly.
        - id: ch01-b114
          speaker: hurree
          text: I took notes for the Royal Society, if the opportunity comes. Get well quickly and return to Simla. I will tell you the whole tale at Lurgan's. It was splendid. Their trouser bottoms were completely torn, and old Nahan Rajah took them for deserting European soldiers.
        - id: ch01-b115
          speaker: kim
          text: The Russians? How many days were they with you?
        - id: ch01-b116
          speaker: hurree
          text: One was French. They stayed days and days. Now every hill person thinks all Russians are beggars. By Jove, they owned nothing I did not beg for them. And the tales I told the common people! I will give you every one at old Lurgan's when you come up. We will have a night out. This is a feather in both our caps. They even gave me a certificate. That is the richest joke. You should have watched them prove their identities at the Alliance Bank. Thank Almighty God you secured the papers. You do not laugh much now, but you will when you are well. I must go straight to the railway. You will receive every kind of credit for your part. We are proud of you, though you frightened us badly, especially Mahbub.
        - id: ch01-b117
          speaker: kim
          text: Mahbub. Where is he?
        - id: ch01-b118
          speaker: hurree
          text: Selling horses nearby, of course.
        - id: ch01-b119
          speaker: kim
          text: Here? Why? Go slowly. My head is still thick.
        - id: ch01-b120
          speaker: narrator
          text: Hurree looked shyly down his nose.
        - id: ch01-b121
          speaker: hurree
          text: You see, I am a fearful man. I dislike responsibility. You were ill, and I had no idea where the papers were or how many existed. After I came down, I sent Mahbub a private telegram. He was at the Meerut races. I explained the situation, so he arrived with his men and talked with the lama. Then he called me a fool and became extremely rude.
        - id: ch01-b122
          speaker: kim
          text: But why?
        - id: ch01-b123
          speaker: hurree
          text: That is what I asked. I only suggested that if someone stole the papers, I would like some strong and courageous men to steal them back. They are vitally important, and Mahbub did not know where you were.
        - id: ch01-b124
          speaker: kim
          text: Mahbub Ali rob the Sahiba's house? You are mad, Babu!
          emotion: angry
        - id: ch01-b125
          speaker: hurree
          text: I wanted the papers. Suppose she had stolen them? It seemed a practical suggestion. You are not pleased?
        - id: ch01-b126
          speaker: narrator
          text: Kim answered with an unrepeatable native proverb that made his deep disapproval perfectly clear.
        - id: ch01-b127
          speaker: hurree
          text: Well, tastes cannot be explained. Mahbub was angry too. He has sold horses all around here, and he says the old lady is a proper old lady who would never lower herself to anything so ungentlemanly. I do not care. I have the papers, and Mahbub's support made me feel safer. Somehow, the more frightened I am, the tighter the places I enter. I was glad you came to Chini with me, and glad Mahbub stayed close. The old lady can be very rude about my beautiful pills.
        - id: ch01-b128
          speaker: kim
          text: Allah be merciful! What a marvelous beast a Babu is! That man walked alone, if he truly walked, beside angry foreigners he had robbed!
          emotion: happy
        - id: ch01-b129
          speaker: hurree
          text: Oh, that was nothing once they had finished beating me. Losing the papers would have been seriously bad. Mahbub nearly beat me too, then talked endlessly with the lama. From now on, I shall keep to ethnological research. Goodbye, Mister O'Hara. If I hurry, I can catch the four twenty-five train to Umballa. We will have fine times telling the story at Mister Lurgan's. I will improve your official report. Goodbye, my dear fellow. Next time emotion overcomes you, please do not use Mohammedan expressions while dressed as a Tibetan.
        - id: ch01-b130
          speaker: narrator
          text: Hurree shook Kim's hand twice, a Babu down to his boot heels, and opened the door. Sunlight struck his triumphant face, and in an instant he became the humble quack doctor from Dacca again.
        - id: ch01-b131
          speaker: narrator
          text: Kim forgot his own share in the adventure. Hurree had robbed the foreigners, tricked them, and lied to them like a Bengali. They had rewarded him with a testimonial. He had made fools of them at the risk of his life. Kim knew he himself would never have dared approach those men again after the pistol shots. Yet Hurree called himself fearful, and truly was fearful. That was the wonder of him. Kim decided he must return to the world.
        - id: ch01-b132
          speaker: narrator
          text: At first his legs folded like weak pipe stems, and the flood and rush of sunlit air dazzled him. He crouched beside the white wall. His mind searched through the long litter journey and the lama's weakness. Now that Hurree's talk no longer stirred him, those memories tangled with the rich store of self-pity that sickness had left behind. His shaken mind drew away from the world as a raw horse, once wounded by the spur, sidles away from it. At least the treasure from the kilta was gone. It was off his hands and no longer in his keeping.
        - id: ch01-b133
          speaker: narrator
          text: He tried to think of the lama and wonder why he had fallen into the stream. But the huge world beyond the courtyard gates broke his thoughts apart. For half an hour he stared strangely at trees, broad fields, and thatched huts half hidden in crops. He could not understand their size, their place, or their use. His soul seemed out of gear with everything around it, like the loose cogwheel of a cheap sugar press lying useless in a corner. Breezes touched him. Parrots shrieked. Behind him the busy house rang with quarrels, orders, and scoldings, but his ears heard nothing.
        - id: ch01-b134
          speaker: kim
          text: I am Kim. I am Kim. What is Kim?
        - id: ch01-b135
          speaker: narrator
          text: His soul asked the question again and again. Kim did not want to cry. He had never felt less like crying. Yet simple, foolish tears suddenly ran down his nose. Almost with a click, the wheels inside him caught hold of the outside world again.
        - id: ch01-b136
          speaker: narrator
          text: In one moment, everything returned to its proper size and meaning. Roads were for walking. Houses were for living. Cattle were driven, fields were tilled, and men and women were spoken to. All of it was real, solid, and easy to understand, made of the same clay as Kim. He shook himself like a dog bothered by a flea and wandered through the gate.
        - id: ch01-b137
          speaker: narrator
          text: Watchful eyes reported his departure to the Sahiba.
        - id: ch01-b138
          speaker: sahiba
          text: Let him go. I have done my part. Mother Earth must do the rest. Tell the Holy One when he comes back from meditation.
        - id: ch01-b139
          speaker: narrator
          text: Half a mile away, an empty bullock cart stood on a low rise with a young banyan behind it, like a lookout above newly plowed ground. The soft air bathed Kim's eyes and made his lids heavy as he came near. Beneath his bare feet was clean, good dust. It was not new grass, already halfway toward death, but hopeful earth holding the seeds of all life. He felt it between his toes and patted it with both palms. Then, one joint at a time, with a long, luxurious sigh, he stretched full length in the cart's shadow.
        - id: ch01-b140
          speaker: narrator
          text: Mother Earth proved as faithful as the Sahiba. She breathed through him and restored the balance he had lost while lying so long on a cot, cut off from her good currents. His head rested helplessly against her breast, and his open hands yielded to her strength. The many-rooted tree above him and even the dead wood of the cart, shaped and handled by men, seemed to know what he needed, though Kim himself did not know. Hour after hour, he lay deeper than sleep.
        - id: ch01-b141
          speaker: narrator
          text: Toward evening, cattle returning home raised dust until every horizon smoked. The lama and Mahbub Ali approached on foot. The household had told them where Kim lay, and both men walked carefully.
        - id: ch01-b142
          speaker: mahbub
          text: Allah! What a foolish thing to do in open country. A man could shoot him a hundred times. Still, this is not the Border.
        - id: ch01-b143
          speaker: lama
          text: There was never such a chela. He is temperate, kind, wise, and generous. His heart is merry on the Road. He forgets nothing. He is learned, truthful, and courteous. Great will be his reward.
        - id: ch01-b144
          speaker: mahbub
          text: I know the boy, as I have told you.
        - id: ch01-b145
          speaker: lama
          text: Was he truly all those things?
        - id: ch01-b146
          speaker: mahbub
          text: Some of them. I have not yet found a Red Hat's charm that makes him too truthful. Someone has certainly nursed him well.
        - id: ch01-b147
          speaker: lama
          text: The Sahiba has a heart of gold. She regards him as her son.
        - id: ch01-b148
          speaker: mahbub
          text: Hmph! Half of Hind seems to feel the same. I only wanted to make sure the boy was unharmed and free to choose. You know he and I were friends from the first days of your pilgrimage.
        - id: ch01-b149
          speaker: lama
          text: That makes a bond between us.
        - id: ch01-b150
          speaker: narrator
          text: The lama sat down.
        - id: ch01-b151
          speaker: lama
          text: We have reached the end of the pilgrimage.
        - id: ch01-b152
          speaker: mahbub
          text: No thanks to you that your pilgrimage did not end forever a week ago. I heard the Sahiba when we carried you up on the cot.
        - id: ch01-b153
          speaker: narrator
          text: Mahbub laughed and pulled at his newly dyed beard.
        - id: ch01-b154
          speaker: lama
          text: My mind was on other matters then. The hakim from Dacca interrupted my meditation.
        - id: ch01-b155
          speaker: mahbub
          text: Otherwise, unbeliever and idolater, you would have completed your meditation on the hot side of Hell, innocent as you are. But tell me, Red Hat. What happens now?
        - id: ch01-b156
          speaker: narrator
          text: Mahbub spoke in Pashtu for decency. The lama's answer came slowly, trembling with triumph.
        - id: ch01-b157
          speaker: lama
          text: This very night, Kim will become as free from sin as I am. When he leaves his body, his Freedom from the Wheel of Things will be as certain as mine. The torn chart against my chest gives me a sign that my own time is short. Yet through all the years ahead, he will be safe. Remember, I reached Knowledge, as I told you three nights ago.
          emotion: happy
        - id: ch01-b158
          speaker: narrator
          text: Mahbub thought that the Tirah priest must have spoken truly when he called him a free thinker. Here he sat, drinking in blasphemy no man should imagine.
        - id: ch01-b159
          speaker: mahbub
          text: I remember the story. So Kim goes to the Gardens of Eden. But how? Will you kill him, or drown him in that wonderful river where the Babu pulled you out?
        - id: ch01-b160
          speaker: lama
          text: No one pulled me from a river. You forget what happened. Through Knowledge, I found it.
        - id: ch01-b161
          speaker: mahbub
          text: Oh yes. True. I forgot exactly how the thing went. You found it knowingly.
        - id: ch01-b162
          speaker: narrator
          text: Mahbub struggled between outrage and enormous laughter.
        - id: ch01-b163
          speaker: lama
          text: To say I would take a life is more than sinful. It is simple madness. My chela helped me reach the River, so he has the right to be cleansed of sin beside me.
        - id: ch01-b164
          speaker: mahbub
          text: He certainly needs cleansing. But afterward, old man? What happens afterward?
        - id: ch01-b165
          speaker: lama
          text: What can that matter beneath all the Heavens? He is certain of enlightenment and Nibban, as I am.
        - id: ch01-b166
          speaker: mahbub
          text: Well said. I feared he might mount Mohammed's Horse and fly away.
        - id: ch01-b167
          speaker: lama
          text: No. He must go out into the world as a teacher.
        - id: ch01-b168
          speaker: mahbub
          text: Aha! Now I understand. That is the right pace for the colt. Of course he must teach. The State rather urgently needs him as a scribe, for example.
        - id: ch01-b169
          speaker: lama
          text: He was prepared for that purpose. By giving alms for him, I gained merit, and a good act does not die. He helped me in my Search, and I helped him in his. The Wheel is just, horse-seller from the North. Teacher or scribe, what does it matter? He will find Freedom in the end. Everything else is illusion.
        - id: ch01-b170
          speaker: narrator
          text: Mahbub thought of his own position. He needed Kim beyond Balkh in six months. Because that chicken Hurree had alarmed him, he had brought ten lame horses and three strong-backed men, ready to drag a sick boy from an old woman's house by force. Instead, he stood by while a young Sahib was lifted into Allah knew what sort of idolater's heaven by an old man in a red hat. Mahbub was counted a player of the Great Game himself, yet this was where the Game had brought him. The mad lama loved Kim, and perhaps Mahbub was nearly as mad himself.
        - id: ch01-b171
          speaker: lama
          text: What prayer are you saying?
        - id: ch01-b172
          speaker: narrator
          text: Rough Pashtu had rumbled beneath Mahbub's red beard.
        - id: ch01-b173
          speaker: mahbub
          text: Nothing worth hearing. Now that I know the boy can be promised Paradise and still enter Government service, my mind is easier. I must return to my horses before dark. Do not wake him. I do not want to hear him call you master.
        - id: ch01-b174
          speaker: lama
          text: But he is my disciple. What else should he call me?
        - id: ch01-b175
          speaker: mahbub
          text: He has told me. I am not entirely of your faith, Red Hat, if so small a matter concerns you.
        - id: ch01-b176
          speaker: narrator
          text: Mahbub swallowed his irritation and rose laughing.
        - id: ch01-b177
          speaker: lama
          text: It does not concern me.
        - id: ch01-b178
          speaker: mahbub
          text: I thought not. Then it will not disturb you, sinless and newly washed and three parts drowned, if I call you a good man. A very good man. We have talked for four or five evenings. I bargain in horses, but I can still see holiness beyond a horse's legs. I can also understand why our Friend of all the World put his hand in yours at the beginning. Treat him well. When you have bathed his legs, if that is the proper cure for this colt, let him return to the world as a teacher.
        - id: ch01-b179
          speaker: lama
          text: Why not follow the Way yourself and travel with the boy?
        - id: ch01-b180
          speaker: narrator
          text: Mahbub stared. Across the Border, such magnificent insolence would have earned more than a blow. Then its humor reached his worldly heart.
        - id: ch01-b181
          speaker: mahbub
          text: Softly, softly. One foot at a time, like the lame gelding crossing the Umballa jumps. I may reach Paradise later. I feel certain movements in that direction, and I owe them to your simplicity. Have you truly never lied?
        - id: ch01-b182
          speaker: lama
          text: What need would there be?
        - id: ch01-b183
          speaker: mahbub
          text: O Allah, hear him! He asks what need there is for lying in this world. Have you never harmed a man either?
        - id: ch01-b184
          speaker: lama
          text: Once, with a pen case, before I had wisdom.
        - id: ch01-b185
          speaker: mahbub
          text: Indeed? I like you better for that. Your teaching is good. You turned one man I know from violence.
        - id: ch01-b186
          speaker: narrator
          text: Mahbub laughed hugely.
        - id: ch01-b187
          speaker: mahbub
          text: He arrived here ready to commit a house robbery. His mind was open to cutting, robbing, killing, and carrying off whatever he wanted.
        - id: ch01-b188
          speaker: lama
          text: A great foolishness!
        - id: ch01-b189
          speaker: mahbub
          text: And a black shame. He understood that after meeting you and a few other men and women. So he abandoned the plan. Now he is going to beat one large, fat Babu.
        - id: ch01-b190
          speaker: lama
          text: I do not understand.
        - id: ch01-b191
          speaker: mahbub
          text: Allah forbid that you should. Some men are strong in knowledge, Red Hat, but your strength is stronger. Keep it. I think you will. If the boy fails to serve well, pull off his ears.
        - id: ch01-b192
          speaker: narrator
          text: Mahbub hitched up his broad Bokhara belt and swaggered into the dusk. The lama came down from his lofty thoughts far enough to watch that broad back disappear.
        - id: ch01-b193
          speaker: lama
          text: That man lacks courtesy and is deceived by outward appearances. Still, he spoke well of my chela, who now enters his reward. Let me make the prayer. Wake, most fortunate of all born from women. Wake! It is found!
          emotion: happy
        - id: ch01-b194
          speaker: narrator
          text: Kim rose from those deep wells of sleep. The lama watched his long, contented yawn and snapped his fingers to turn away evil spirits.
        - id: ch01-b195
          speaker: kim
          text: I have slept a hundred years. Where am I? Holy One, have you been here long? I came out to find you, but I fell asleep on the way. I am well now. Have you eaten? We should go back to the house. I have not tended you for days. Did the Sahiba feed you properly? Who rubbed your legs? Is the weakness gone from your belly and neck? Has the pounding in your ears stopped?
        - id: ch01-b196
          speaker: lama
          text: Gone. All of it is gone. Do you not know?
        - id: ch01-b197
          speaker: kim
          text: I know only that I have not seen you in a monkey's age. What should I know?
        - id: ch01-b198
          speaker: lama
          text: Strange that the knowledge did not reach you, when every thought I had turned toward you.
        - id: ch01-b199
          speaker: kim
          text: I cannot see your face, but your voice rings like a gong. Did the Sahiba's cooking make you young again?
        - id: ch01-b200
          speaker: narrator
          text: Kim peered at the lama sitting cross-legged, a shape of perfect black against the lemon-colored evening light. He looked like the stone Bodhisat who watched over the self-registering turnstiles at the Lahore Museum.
        - id: ch01-b201
          speaker: narrator
          text: The lama said nothing. His rosary clicked softly. Far away came the faint clop of Mahbub's retreating feet. Around them settled the smoky silence of an Indian evening.
        - id: ch01-b202
          speaker: lama
          text: Hear me. I bring news.
        - id: ch01-b203
          speaker: kim
          text: But let us—
        - id: ch01-b204
          speaker: narrator
          text: The lama's long yellow hand shot out and commanded silence. Kim obediently tucked his feet beneath the edge of his robe.
        - id: ch01-b205
          speaker: lama
          text: Hear my news. The Search is finished. Now comes the Reward.
          emotion: happy
        - id: ch01-b206
          speaker: lama
          text: This is how it happened. In the Hills, I lived on your strength until the young branch bent and almost broke. Once we left the Hills, I was troubled for you and for other matters hidden in my heart. My soul was a boat with no direction. I could not see the Cause of Things. So I gave you entirely into the care of the virtuous woman.
        - id: ch01-b207
          speaker: lama
          text: I ate nothing and drank no water, but the Way remained hidden. They brought food and called outside my closed door. I left them and found a hollow beneath a tree. There I sat in meditation for two days and two nights, taking no food or water. I emptied my mind and breathed in and out as the rule commands.
        - id: ch01-b208
          speaker: lama
          text: On the second night, I received a reward greater than any before. The wise Soul slipped free of the foolish Body. Before then, I had only stood at the threshold of such a thing. Think of it, for it was a marvel.
          emotion: happy
        - id: ch01-b209
          speaker: kim
          text: A marvel indeed. Two whole days and nights without food! Where was the Sahiba?
        - id: ch01-b210
          speaker: narrator
          text: Kim spoke under his breath.
        - id: ch01-b211
          speaker: lama
          text: My Soul flew free. Wheeling like an eagle, it saw that there was no Teshoo Lama and no separate soul anywhere. As a drop is drawn to water, my Soul drew near the Great Soul beyond all things.
        - id: ch01-b212
          speaker: lama
          text: Lifted high in contemplation, I saw all of Hind at once, from Ceylon in the sea to the Hills and my own Painted Rocks at Such-zen. I saw every village and every camp where we had rested, down to the smallest. They stood together in one time and one place because all were inside the Soul. Then I knew I had passed beyond the illusion of Time, Space, and Things. I knew I was free.
        - id: ch01-b213
          speaker: lama
          text: I saw you lying on your cot. At the same moment, I saw you falling down the hill beneath the idolater. Both were in my Soul, which had touched the Great Soul. I also saw the foolish body of Teshoo Lama under the tree and the Dacca hakim kneeling beside it, shouting into its ear.
        - id: ch01-b214
          speaker: lama
          text: Then my Soul was alone. I saw nothing, because I had become all things in the Great Soul. For a thousand times a thousand years, I meditated without passion and understood the Causes of all Things.
        - id: ch01-b215
          speaker: lama
          text: At last a voice cried, "What will happen to the boy if you are dead?" Pity for you shook me through and through. I answered, "I will return to my chela, or he may lose the Way."
        - id: ch01-b216
          speaker: lama
          text: Then my Soul, the Soul of Teshoo Lama, pulled away from the Great Soul. It struggled and yearned and suffered pains no words can tell. As an egg leaves the fish, as the fish leaves water, as water leaves a cloud, and as the cloud rises from thick air, so the Soul of Teshoo Lama came away from the Great Soul.
        - id: ch01-b217
          speaker: lama
          text: A voice called, "The River! Look to the River!" I gazed down upon the whole world, all in one time and one place, and saw the River of the Arrow plainly at my feet.
        - id: ch01-b218
          speaker: lama
          text: Some evil from which I was not fully cleansed weighed upon my arms and coiled around my waist. I threw it aside. Then, like an eagle, I flew toward the River. For your sake, I pushed world after world from my path. Below me shone the River of the Arrow. I descended, and its waters closed above me.
        - id: ch01-b219
          speaker: lama
          text: At once I was inside the body of Teshoo Lama again, but now I was free from sin. The Dacca hakim supported my head in the River. It is here, Kim! The River runs behind the mango grove, here in this very place!
          emotion: happy
        - id: ch01-b220
          speaker: kim
          text: Allah kerim! Thank goodness the Babu was there. Were you very wet?
          emotion: surprised
        - id: ch01-b221
          speaker: lama
          text: Why should that matter? I remember the hakim was worried about Teshoo Lama's body. He dragged it from the holy water with his own hands. Then your horse-seller from the North arrived with men and a cot. They laid the body upon it and carried it to the Sahiba's house.
        - id: ch01-b222
          speaker: kim
          text: What did the Sahiba say?
        - id: ch01-b223
          speaker: lama
          text: I was meditating inside the body, so I heard nothing. And that is how the Search ended. Because of the merit I had gained, the River of the Arrow was here. It sprang up at our feet, just as I have told you. I found it.
        - id: ch01-b224
          speaker: lama
          text: Son of my Soul, I pulled my Soul back from the Threshold of Freedom so that you could be cleansed of every sin, as I am cleansed and sinless. The Wheel is just. Our deliverance is certain. Come!
          emotion: happy
        - id: ch01-b225
          speaker: narrator
          text: He folded his hands in his lap and smiled like a man who had won salvation for himself and for the person he loved.
