audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts: {delivery: "从容而机敏的讲述", timbre: "温暖清晰", pace: "舒展而有变化", pitch: "中音"}
    kim:
      display_name: 金
      tts: {delivery: "机灵大胆，话里常带笑", timbre: "明亮的少年声", pace: "轻快敏捷", pitch: "中高音"}
    lama:
      display_name: 德舒喇嘛
      tts: {delivery: "慈爱虔诚，沉思中透着天真", timbre: "清瘦柔和的老人声", pace: "从容缓慢", pitch: "中低音"}
    hurree:
      display_name: 胡里先生
      tts: {delivery: "殷勤夸张，机敏中带着自得", timbre: "圆润饱满的男声", pace: "快而滔滔不绝", pitch: "中音"}
    porter:
      display_name: 山地挑夫
      tts: {delivery: "朴实直爽，带着劳作后的疲惫", timbre: "粗粝结实", pace: "平稳", pitch: "中低音"}
    sahibah:
      display_name: 萨希巴
      tts: {delivery: "泼辣慈爱，笑骂里透着威严", timbre: "洪亮温厚的老妇声", pace: "明快而有变化", pitch: "中音"}
    old_servant:
      display_name: 奥里亚老仆
      tts: {delivery: "恭谨严正，不容商量", timbre: "苍老低沉", pace: "沉稳", pitch: "低音"}
    widowed_cousin:
      display_name: 守寡表亲
      tts: {delivery: "柔顺勤快，感情真挚", timbre: "轻柔苍老的女声", pace: "舒缓", pitch: "中音"}
    mahbub:
      display_name: 马哈布·阿里
      tts: {delivery: "豪迈老练，讥诮中藏着关切", timbre: "粗重浑厚的男声", pace: "从容有力", pitch: "低音"}
  chapters:
    - id: ch01
      title: 第十五章
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: "皇帝来了，我也不让路。国王挡在前头，我照样直走。三重冠冕休想叫我低头，可这一位却大不相同！我不与空中的神力争斗。哨兵，放他过去！放下吊桥，他就是我们的主人，那位美梦成真的寻梦人。这几句出自《围攻仙境》。"
        - id: ch01-b02
          speaker: narrator
          text: "奇尼以北两百英里，拉达克的蓝色页岩地上，快活的扬克林少爷守在那里。他愤愤地举着望远镜，扫过一道又一道山脊，寻找自己心爱的奥仲追踪手。那个叛徒却带着一支崭新的曼利夏步枪和两百发子弹，早去别处猎麝卖钱了。要到下一个季节，扬克林少爷才会知道他病得多厉害。"
        - id: ch01-b03
          speaker: narrator
          text: "布沙尔山谷里，一个孟加拉人正匆匆赶路。喜马拉雅山上的鹰眼力再好，瞧见他新换的蓝白雨伞也得闪开。他从前肥胖体面，如今已经又瘦又憔悴。两位显贵的外国人谢过他，因为他很有本事地把他们领到了马绍布拉隧道。穿过那里，便是印度那座繁华热闹的都城。一路上，浓重湿润的雾气把什么都裹住了，害他们错过科特加尔的电报站，也错过欧洲人的居住区，这当然不能怪胡里。后来，他又兴致勃勃地谈了一路诸神，带着两人误入纳汉邦。那里的土王把他们当成英国逃兵，这仍不能怪胡里，只能怪诸神。"
        - id: ch01-b04
          speaker: narrator
          text: "胡里先生向昏昏欲睡的小王公解释，两位同伴在自己国家有多么伟大、多么显赫。他一直说到土王脸上终于露出笑容。此后不管谁来询问，他都得再解释一遍。一遍又一遍，他站在人前高声说明，而且每次说法都不一样。他替两人讨来食物，给他们安排住处，还替别人医治腹股沟上的伤，医术颇为高明。那处伤很像黑夜里从乱石山坡滚下去时挨的一撞。一路上少了什么都可以，就是少不了胡里。"
        - id: ch01-b05
          speaker: narrator
          text: "他如此友善，还有个很给自己长脸的理由。他和千百万同为臣仆的人一样，早把俄国看成北方来的大救星。他胆子小，一路都在担心，怕自己救不出两位显贵的雇主，叫他们落到激愤的乡民手里。他本人倒不介意有人打圣人，只不过，说起那一夜，他总要稍稍停一停。如今他由衷感激，也由衷欢喜，因为自己已经尽了那一点微薄之力。除了丢失的行李先不去说，两位外国人的事业总算圆满收场。"
        - id: ch01-b06
          speaker: narrator
          text: "胡里早已忘了自己挨打，还坚决否认松林下那个不体面的头一夜，曾经有谁动过手。他不求养老金，也不要常年津贴，只请两位想一想，他是否还配得到一张品行证明。以后若有他们的朋友越过山口，那张纸也许能派上用场。他又恳请两位，将来飞黄腾达时千万不要忘记他。因为连他这个加尔各答文学硕士莫亨德罗·拉尔·杜特，也私下认为自己确实为国家出过一点力。"
        - id: ch01-b07
          speaker: narrator
          text: "两人果真给他写了证明，夸他礼数周全、乐于助人，带路从不出错。他把证明塞进腰带，感动得抽泣起来。他们毕竟一同经历了许多险难。正午，他领两人穿过拥挤的西姆拉林荫大道，到联盟银行证明身份，随后便像杰科山的晓云一样消失了。"
        - id: ch01-b08
          speaker: narrator
          text: "再看胡里。他已经瘦得连汗都流不出，脚步却依旧匆匆忙忙。就连那只铜边小药箱里的药，他也顾不上停下来吹嘘。他一路往沙姆莱山坡上爬，一个正直的人终于修成了正果。正午时分，他把孟加拉先生的整套做派暂时丢在一旁，坐到一张小床上抽烟。那个头饰镶满绿松石的女人越过光秃秃的草地，伸手指向东南方。她告诉他，轿子无论如何也走不过一个单身汉，不过他的鸟儿眼下应该已经到达平原。"
        - id: ch01-b09
          speaker: narrator
          text: "莉斯佩思苦苦挽留，圣人还是不住。胡里重重呻吟，勒紧肥大的腰身，再次上路。他不喜欢天黑后赶路，可他每天走过的里程，足以叫那些嘲笑他种族的人目瞪口呆，只是没人会把这些写进书里。好心村民记得两个月前那个达卡药贩，让他留下过夜，免得林中恶鬼伤他。梦里有孟加拉诸神、大学教育学课本，还有伦敦皇家学会。天一亮，蓝白雨伞又颠颠地上路了。"
        - id: ch01-b10
          speaker: narrator
          text: "在杜恩谷边，穆索里已经远远落在身后，平原披着金色尘雾铺向前方。一顶磨旧的轿子停在那里。满山人都知道，轿里躺着一位生病的喇嘛，正寻找能治愈他的河。沿途村庄几乎为争抬轿的荣耀打起来。喇嘛给他们祝福，他的徒弟也肯付好价钱，足有少爷们所付的三分之一。轿杠两端油亮光滑，磨痕累累。这顶轿子每天走十二英里，走的尽是少爷们很少走的路。"
        - id: ch01-b11
          speaker: narrator
          text: "他们顶着风雪越过尼朗山口，飞雪钻进喇嘛安然不动的每一道衣褶。轿子穿过拉延那两座黑角似的山峰，云中传来野山羊的呼哨。下方的页岩路颠簸不平，轿身不停摇晃，轿杠也受尽拉扯。绕过帕吉拉蒂河上方凿出的可怕弯道时，挑夫们咬紧牙关，用肩死死顶住轿杠，不敢有一点松动。一路小跑下到众水之谷，轿子左右摇摆，木头吱呀作响。他们又被催着穿过封闭山谷里闷热潮湿的平地，再往上走，继续往上，终于钻出谷口，迎住凯达尔纳特方向怒吼而来的狂风。"
        - id: ch01-b12
          speaker: narrator
          text: "到了正午，轿子停在一片亲切的橡树林中。林子把光都遮住，四周暗得像褐色的暮霭。黎明的寒气里，它又从一个村传到下一个村。圣人催得实在太急，就连虔诚的信徒忍不住骂上几句，也算情有可原。有时他们还得举着火把连夜赶路，那光景叫最胆大的人看了，也会想到林中的鬼怪。如今，这顶轿子终于来到最后一站。下西瓦利克山地的暑气虽然已经减弱，小个子的山民仍热得满头大汗。他们围住师徒，既等喇嘛赐下祝福，也等金付清工钱。"
        - id: ch01-b13
          speaker: lama
          text: "你们积下的功德，比自己明白的还多。如今你们又要回山里去了。"
        - id: ch01-b14
          speaker: narrator
          text: "喇嘛叹了口气。"
        - id: ch01-b15
          speaker: porter
          text: "当然。越早回到高山越好。"
        - id: ch01-b16
          speaker: narrator
          text: "挑夫揉揉肩，喝下一口水，又把水吐掉，重新系紧草鞋。金面容消瘦，满脸倦色。他从腰带里掏出几枚小银币付钱，又费力拖出食物袋，把装着圣书的油布包塞进怀里，扶喇嘛站起来。老人眼里恢复了安宁，不再像洪水拦路的那个可怕夜晚一样，疑心群山会塌下来压碎自己。挑夫们抬起轿子，在灌木丛间摇摇晃晃地远去了。"
        - id: ch01-b17
          speaker: lama
          text: "世尊之箭没有落在你们中间啊，群山中最有福的群山！我也不会再呼吸你们的空气了！"
        - id: ch01-b18
          speaker: kim
          text: "可在这片好空气里，你比原先强壮了十倍。箭落在这里，就在附近。我们慢慢走，一天也许只走一拘卢舍。这回一定能找到。不过，这袋子可真沉。"
        - id: ch01-b19
          speaker: lama
          text: "是啊，我们一定能找到。我已经走出了那场巨大的诱惑。"
        - id: ch01-b20
          speaker: narrator
          text: "如今他们每天最多走两英里，所有重量都落在金肩上。老人的身体是担子，上锁的书把食物袋压得沉重，经文贴在金胸口，日常起居的琐事也全归他。天亮，他出去乞食，替喇嘛铺冥想的毯子。正午酷热，他把老人疲惫的头托在膝上，不停赶苍蝇，直到手腕发酸。傍晚，他再去乞食，再给喇嘛揉脚。喇嘛则答应拿解脱酬谢他，就在今天、明天，最迟后天，他们一定能得到解脱。"
        - id: ch01-b21
          speaker: lama
          text: "从没有过你这样的徒弟。有时我甚至想，阿难侍奉世尊，也未必比你尽心。可你是个少爷吗？我从前还是凡夫的时候，那已经很久了，我忘记了这件事。如今每次看你，我都会想起你是个少爷。真是奇怪。"
        - id: ch01-b22
          speaker: kim
          text: "你说过世上没有黑，也没有白。圣人，何必再拿这些话烦我？把另一只脚给我揉吧。这话真叫我恼火。我不是少爷，我是你的徒弟，脑袋还沉沉地压在肩上。"
        - id: ch01-b23
          speaker: lama
          text: "再忍一会儿！我们会一起抵达解脱。到那时，我们坐在河的彼岸回望一生，就像在山里回头看一天走过的路，一程一程都铺在身后。也许我以前也做过少爷。"
        - id: ch01-b24
          speaker: kim
          text: "我发誓，从来没有哪个少爷像你。"
        - id: ch01-b25
          speaker: lama
          text: "我敢说，奇迹馆里的图像守护人，前世是位极有智慧的住持。可连他的眼镜也不能让我看清，定睛一看，眼前总有阴影。不要紧。这副可怜愚笨的臭皮囊，不过让一层阴影换成另一层。我还困在时间和空间的幻象里。我们这肉身今天走了多远？"
        - id: ch01-b26
          speaker: kim
          text: "大概半拘卢舍。"
        - id: ch01-b27
          speaker: narrator
          text: "其实他们走了四分之三英里，而且走得十分辛苦。"
        - id: ch01-b28
          speaker: lama
          text: "半拘卢舍。哈！我的神魂却走了千万里。我们被这些无知无觉的东西一层层裹住，像襁褓里的婴儿。徒儿，你从没想过离开我吗？"
        - id: ch01-b29
          speaker: narrator
          text: "喇嘛望着青筋隐现的瘦手，如今那只手连念珠都嫌沉。金想起油布包和食物袋里的书。只要有个名正言顺的人接手，他才不在乎大游戏以后怎么自行运转。他累极了，脑袋发热，一阵从胃里翻上来的咳嗽又折磨着他。"
        - id: ch01-b30
          speaker: kim
          text: "没有。我不是狗，也不是蛇，不会刚学会爱谁，转头就去咬他。"
        - id: ch01-b31
          speaker: narrator
          text: "他的语气几乎有些严厉。"
        - id: ch01-b32
          speaker: lama
          text: "你待我太温柔了。"
        - id: ch01-b33
          speaker: kim
          text: "也不是因为这个。有件事我没问你，自己做了主。今早我托送羊奶的女人给库卢女人捎话，说你身体虚弱，需要一顶轿子。刚进杜恩谷时我就该办。一想到拖到现在，我就恨不得在心里揍自己。轿子回来前，我们住在这里。"
        - id: ch01-b34
          speaker: lama
          text: "我没有异议。照你说的，她有一颗金子般的心，只是话多了一点，一点点。"
        - id: ch01-b35
          speaker: kim
          text: "她不会烦你，我也安排好了。圣人，我有那么多地方没照顾好你，每次想起，心里都沉得厉害。我让你走了太远，没能次次给你挑到好食物，也没顾到天热。一路上，我只管跟别人说话，把你独自丢下。我……我……嗨，妈呀！可我爱你。现在一切都太迟了。我那时只是个孩子。唉，我为什么不是个大人？"
          emotion: sad
        - id: ch01-b36
          speaker: narrator
          text: "紧张、疲劳，还有远超过他年纪的重担，终于把金压垮。他扑倒在喇嘛脚边，放声痛哭。"
        - id: ch01-b37
          speaker: lama
          text: "这是怎么啦！你从没偏离服从之道一根头发丝。说你怠慢我？孩子，我一直靠你的力气活着，就像老树靠新墙上的石灰撑住。从沙姆莱下山起，我一天一天偷走你的力气。你现在虚弱，不是因为犯了错。说话的是肉身，那副愚蠢糊涂的肉身，不是笃定的灵魂。安心吧，先认清你正和什么魔鬼争斗。它们生在尘土里，都是幻象的孩子。"
          emotion: calm
        - id: ch01-b38
          speaker: lama
          text: "我们去库卢女人那里，请她收留我们，尤其请她照料我，让她积些功德。你只管自由自在地跑动，等力气恢复。我竟忘了那副愚蠢的肉身。真有过错，也该由我承担。可我们离解脱之门已经很近，不必再分谁是谁非。我本可以赞美你，可又何必？再过很短一会儿，我们就会坐到一切需求之外。"
          emotion: calm
        - id: ch01-b39
          speaker: narrator
          text: "老人用明智的箴言和庄严的经文抚慰金，哄他平静。他说的都是这副很少有人理解的肉身。它明明只是幻象，却偏要冒充灵魂，遮暗道路，还凭空生出无数魔鬼。"
        - id: ch01-b40
          speaker: lama
          text: "嗨！我们来说库卢女人吧。你想，她会不会又替孙子讨护符？我年轻时也受过这种郁气和另外几种毛病折磨，那已经很久了。我去见一位极圣洁、追寻真理的住持，只是当时还不懂。坐起来听，我灵魂的孩子！我把情形告诉他，他说，世上谎言很多，骗子也不少，可除了肉身带来的感觉，再没有哪个骗子比肉身更会骗人。我细想以后，心里得到安慰。他还格外开恩，让我当面喝茶。现在也让我喝茶吧，我渴了。"
        - id: ch01-b41
          speaker: narrator
          text: "金含着泪笑起来，吻了喇嘛的脚，动手烧茶。"
        - id: ch01-b42
          speaker: kim
          text: "圣人，你的肉身依靠我，我却在别的事上依靠你。你知道吗？"
        - id: ch01-b43
          speaker: lama
          text: "也许我早猜到了。我们得把这情形改过来。"
        - id: ch01-b44
          speaker: narrator
          text: "萨希巴最心爱的轿子从二十英里外一路划来。轿夫们又磨又蹭地走着，浑身带着热腾腾的郑重气派，领头的还是那个灰白头发的奥里亚老仆。他们来到萨哈兰普尔后方那座长长的白房子。屋舍虽然杂乱，却自有章法。喇嘛也有了自己的安排。"
        - id: ch01-b45
          speaker: sahibah
          text: "老太婆劝老头子，能有什么用？我告诉过你，告诉过你呀，圣人，要好好照看徒弟。你怎么照看的？不许回答！我知道。他准在女人堆里胡闹。瞧那双眼睛，陷得多深！再瞧鼻子下面那条泄密的纹！他已经被榨干啦！呸！呸！亏你还是个出家人！"
        - id: ch01-b46
          speaker: narrator
          text: "金抬头看她，累得连笑也笑不出，只能摇头。"
        - id: ch01-b47
          speaker: lama
          text: "别说笑了。那种日子已经过去。我们是为大事来的。我在山里害了灵魂的病，他却害了肉身的病。从那以后，我一直靠他的力气活着，一直在吃他。"
        - id: ch01-b48
          speaker: sahibah
          text: "一老一小，都是孩子。但愿现在这番款待能让你们复原！等一会儿，我下去跟你们聊聊高山，那片好山。"
        - id: ch01-b49
          speaker: narrator
          text: "到了晚上，她的女婿回来，不用她再巡视农庄。喇嘛低声说明事情的要害。两个苍老的脑袋凑在一起，不停会意地点头。金早已踉跄着进了一间有床的屋子，昏沉沉打起盹来。喇嘛不准他铺毯子，也不许他取食物。"
        - id: ch01-b50
          speaker: sahibah
          text: "我知道，我知道。除了我还有谁懂？我们这些往火葬场走的人，总想拉住那些刚从生命之河上来的人。他们手里提着满满的水罐，水都快溢出来了。我先前错怪那孩子啦。他把力气借给你？老人天天吃年轻人，这话一点不假。现在得把力气还给他。"
        - id: ch01-b51
          speaker: lama
          text: "你已经积下许多功德。"
        - id: ch01-b52
          speaker: sahibah
          text: "我的功德算什么？不过是一袋老骨头，给一群从不问是谁做饭的男人烧咖喱。要是这些功德能替我孙子存起来……"
        - id: ch01-b53
          speaker: lama
          text: "就是那个肚子疼的孩子？"
        - id: ch01-b54
          speaker: sahibah
          text: "圣人居然还记得！我一定告诉他母亲，这是多大的荣耀！圣人一下就想起了那个肚子疼的孩子，她准会骄傲死。"
        - id: ch01-b55
          speaker: lama
          text: "我的徒弟对我，就像儿子对那些还没开悟的人。"
        - id: ch01-b56
          speaker: sahibah
          text: "还是说孙子吧。母亲哪有我们这个年纪的智慧？孩子一哭，她们便以为天塌了。祖母离生产的痛和喂奶的乐都够远，才能分清孩子是在使坏，还是肚子有风。既然又说到风，上回圣人来时，我也许不该硬逼你讨护符。"
        - id: ch01-b57
          speaker: lama
          text: "姐妹，只要护符能让你安心，我这个从前做过苏禅寺住持的人，你要多少，我就做多少。我从没见过你的脸。"
        - id: ch01-b58
          speaker: sahibah
          text: "这一点，连偷我们枇杷的猴子都能作证。嘻！嘻！"
        - id: ch01-b59
          speaker: lama
          text: "不过，正像睡在对面客房里的人说的，你有一颗金子般的心。在精神上，他正是我的孙子。"
        - id: ch01-b60
          speaker: sahibah
          text: "好！那我就是圣人的奶牛。我老了，也亲自生过儿子。从前我也能叫男人喜欢，如今却能替他们治病。把这孩子交给我。我给他灌药，给他填吃的，一定把他养得完完整整。嗨！我们老人还懂得些事。"
        - id: ch01-b61
          speaker: narrator
          text: "金醒来时浑身骨头酸痛。他想去厨房替师父拿食物，四周的人却硬逼他躺好。门口站着蒙面的萨希巴，灰白头发的老仆陪在一旁。两人一本正经地告诉他，哪些事绝对不准做。"
        - id: ch01-b62
          speakers: [sahibah, old_servant]
          ensemble: duo
          text: "你什么也别想要！"
        - id: ch01-b63
          speaker: sahibah
          text: "什么？你要一只带锁的箱子来收圣书？哦，那是另一回事。老天不许我挡在出家人和祈祷之间！箱子会送来，钥匙归你。"
        - id: ch01-b64
          speaker: narrator
          text: "箱子被推进小床底下。金把马哈布的手枪、装信的油布包、上锁的书和日记都放进去，长长舒了口气。说也奇怪，这些东西压在肩头，还不如压在他可怜的心上沉。夜里，连脖颈都被这份重担压得酸痛。"
        - id: ch01-b65
          speaker: sahibah
          text: "你这种病，如今的年轻人不大得，因为他们早就不肯伺候长辈了。治法就是睡觉，再吃几味药。"
        - id: ch01-b66
          speaker: narrator
          text: "那片空白一半像威胁，一半又像安慰，金很愿意把自己交给她。萨希巴从某个神秘的亚洲药房熬出一碗又一碗汤剂，闻着像瘟疫，喝着比闻着更糟。她守在金身边，亲眼盯着他一滴不剩地吞下去。等他把药吐出来，她又从头到尾仔细盘问，非弄清每一件事不可。她下令任何人不得靠近前院，还派了个带武器的人守门。那人确实七十多岁，刀鞘里也确实只剩一个刀柄，可他代表萨希巴的威权。满载的大车、说个不停的仆人、牛犊、狗和母鸡，到了这边全都服从命令，远远绕路。"
        - id: ch01-b67
          speaker: narrator
          text: "等金的身体清理干净，她从后屋那群穷亲戚里挑出一个守寡的表亲。那些人挤在那里，就像我们所说的家犬。那女人精通欧洲人因为一无所知而叫作按摩的手艺。她们把金按东西方向放好，让穿过泥土肉身的神秘大地之流从旁帮助，不来阻挠。整整一个长下午，两人把他拆开来料理。先是一根接一根骨头，然后是一块接一块肌肉、一条接一条韧带，最后连神经也一根根揉过。面纱总不安分，她们一边甩开，一边又重新遮好。金被揉成一摊不知所以的软泥，几乎让动作催眠，随后一下滑进万里之外的梦乡。他足足睡了三十六小时，那睡眠像久旱后的雨，一寸寸浸透全身。"
        - id: ch01-b68
          speaker: narrator
          text: "接着，萨希巴开始给他进补。整座宅院都在她的吆喝里飞转。她命人杀鸡，又叫人去取蔬菜，把那个清醒得很慢、几乎和她一样老的园丁累出满身大汗。她一会儿要香料、牛奶和洋葱，一会儿又要溪里捞来的小鱼。东西才刚送到，她转眼又吩咐人拿酸橙来调果子露，再取来陷阱捉住的肥鹌鹑。最后，她还亲自照看着，把鸡肝一块块串到细签上，每两块之间都夹进一片生姜。"
        - id: ch01-b69
          speaker: sahibah
          text: "这世面我也见过一些。天下女人只有两种，一种抽走男人的力气，一种把力气还给男人。我从前是第一种，现在是第二种。别摆小出家人的架子，方才只是玩笑。就算现在说得不准，等你重新上路也会应验。表妹，他的皮肤亮起来了，像一匹刚用咖喱擦过的新马。我们把宝石擦亮，又要扔给舞女，是不是？"
        - id: ch01-b70
          speaker: narrator
          text: "金坐起来笑了。那阵可怕的虚弱像旧鞋一样脱落。舌头又痒起来，想痛快说话。一星期前，哪怕最轻的一句话都像灰堵在喉咙里。脖颈的疼痛消失了，登革热似的全身酸痛和嘴里的怪味也没了。两个老妇人稍稍留意起面纱，却也没有多留意。她们快乐地咯咯说话，就像从敞开的门口踱进来啄食的母鸡。"
        - id: ch01-b71
          speaker: kim
          text: "我的圣人在哪里？"
        - id: ch01-b72
          speaker: sahibah
          text: "听听他呀！你的圣人好着呢，不过可不是他的功劳。我要知道哪道护符能让他聪明些，卖掉首饰也会买。竟敢不吃我亲手做的好东西，空着肚子在田里游荡两夜，最后一头栽进溪里，这也叫圣洁？他把我这颗被你折腾过的心吓得快碎了，才来告诉我自己积了功德。唉，天下男人都一样！不对，他说自己洗清了罪孽。其实他浑身湿透以前，我就能告诉他。他一个星期前就好了，可这种圣洁还是烧掉吧！三岁孩子都比他懂事。别担心圣人。他不在溪里趟水时，两眼一直盯着你。"
        - id: ch01-b73
          speaker: kim
          text: "我不记得见过他。只记得白昼和黑夜像一根根白栏杆、黑栏杆，开了又关。我没病，只是累了。"
        - id: ch01-b74
          speaker: sahibah
          text: "这种昏睡本该几十年以后才轮到你。不过现在已经过去了。"
        - id: ch01-b75
          speaker: kim
          text: "母亲，是你救了我的命。我该怎么谢你？愿一万重福泽降在你家，还有……"
        - id: ch01-b76
          speaker: sahibah
          text: "这宅子不受福也罢！你要像出家人一样谢诸神，只管去谢。真把我放在心上，就像儿子一样谢我。老天在上！我把你翻来搬去，又拍又拧，连十个脚趾都扳过，难道为的是听你拿经文砸我脑袋？总有一个母亲生下你，好让你伤透她的心。儿子，你以前怎么对她？"
        - id: ch01-b77
          speaker: kim
          text: "我没有母亲，母亲。听说我很小的时候，她就死了。"
        - id: ch01-b78
          speaker: sahibah
          text: "嗨，妈呀！那就没人能说我抢了她的权利。等你重新上路，这宅子会变成你住过又忘掉的一千所房子之一，只留下随口一句祝福。也没人能那样说。没关系，我不稀罕祝福，不过……"
        - id: ch01-b79
          speaker: narrator
          text: "她朝那个穷亲戚跺了一脚。"
        - id: ch01-b80
          speaker: sahibah
          text: "把托盘拿回屋！你这不吉利的女人，旧饭留在这里做什么？"
        - id: ch01-b81
          speaker: widowed_cousin
          text: "我以前也有个儿子，可他死了。你知道他死了！我只是在等吩咐，准备把托盘拿走。"
          emotion: sad
        - id: ch01-b82
          speaker: sahibah
          text: "我才是那个不吉利的女人！我们这些走向火葬场大伞亭的人，总抓着提水罐的年轻人不放。我们不能下场跳节庆舞，只好从窗口看。何况给人做祖母，已经占去女人全部时间。你师父答应把护符都做给我女儿的长子，因为他已经洗净罪孽。那个哈基姆近来可落魄了，找不到像样的人下手，便到处给我的仆人下毒。"
        - id: ch01-b83
          speaker: kim
          text: "哪个哈基姆，母亲？"
        - id: ch01-b84
          speaker: sahibah
          text: "那个达卡人。他的药丸差点把我裂成三块。一星期前，他像走丢的骆驼一样突然冒出来，赌咒说在库卢那边跟你结成了血兄弟，还装得非常担心你的身体。他又瘦又饿，我叫人把他也填饱，连那份担心一起填进去！"
        - id: ch01-b85
          speaker: kim
          text: "他还在的话，我想见他。"
        - id: ch01-b86
          speaker: sahibah
          text: "他每天吃五顿饭，还给我的佃农割疖子，免得自己撑得中风。他太担心你，整天守着厨房门，靠残羹剩饭活命。让他等着吧，我们永远赶不走他。"
        - id: ch01-b87
          speaker: kim
          text: "叫他来吧，母亲。我来试试。"
        - id: ch01-b88
          speaker: sahibah
          text: "我会叫他来，可赶他走太不厚道。至少他有脑子，知道把圣人从溪里捞出来。也因为这样，照圣人没说过的话，他积了功德。"
        - id: ch01-b89
          speaker: kim
          text: "他是个很有智慧的哈基姆。请叫他来吧，母亲。"
        - id: ch01-b90
          speaker: sahibah
          text: "出家人夸出家人？真是奇迹！他若是你的朋友，上回见面你们明明还吵过，我就用拴马的绳子拖他来，再请他吃一顿合乎种姓的饭。儿子，起来看看这个世界！躺在床上，是七十个魔鬼的母亲。我的儿子！我的儿子！"
        - id: ch01-b91
          speaker: narrator
          text: "她小跑出去，要在厨房那边掀起一场台风。影子刚刚过去，胡里先生便滚了进来。袍子披到肩头像罗马皇帝，腮帮子像提图斯，头上没帽子，脚穿新漆皮鞋，浑身胖得正合时候，一路喷薄着欢喜和问候。"
        - id: ch01-b92
          speaker: hurree
          text: "天哪，奥哈拉先生，见到你真是太高兴啦！劳驾先把门关上。你生病太可惜了，病得厉害吗？"
        - id: ch01-b93
          speaker: kim
          text: "文件。基尔塔里的文件，地图，还有穆拉斯拉！"
        - id: ch01-b94
          speaker: narrator
          text: "金不耐烦地递出钥匙。现在压在心头最急的事，就是把这些战利品交出去。"
        - id: ch01-b95
          speaker: hurree
          text: "完全正确。这才是本部门该有的看法。东西全拿到了吗？"
        - id: ch01-b96
          speaker: kim
          text: "基尔塔里手写的东西，我全拿了。其余的都扔下山。"
        - id: ch01-b97
          speaker: narrator
          text: "钥匙在锁里刮擦，黏住的油布慢慢撕开，纸张飞快翻动。生病躺着的日子里，金明知东西就在床下，却没法交出，因此烦躁得毫无道理。如今胡里像大象一样跳起来，再次握住他的手，金只觉得血液欢快地跑遍全身。"
        - id: ch01-b98
          speaker: hurree
          text: "太好啦，好得不能再好！奥哈拉先生，你把他们整套把戏连锁带托，全端走了。听说他们八个月的工作都泡了汤！天哪，他们把我打得可真狠。瞧，这是希拉斯来的信！"
        - id: ch01-b99
          speaker: narrator
          text: "胡里用宫廷波斯语吟了几行。无论官方还是私下外交，都用这种语言。"
        - id: ch01-b100
          speaker: hurree
          text: "土王大人这一脚踩进洞里了。他得正式解释，自己究竟发什么疯，要给沙皇写情书。地图也泽常精细。附近还有三四个首相被信牵连。天哪，先生！英国政府会更改希拉斯和布纳尔的王位继承次序，另选继承人。泽是最卑劣的叛国。可你不明白，对不对？"
        - id: ch01-b101
          speaker: kim
          text: "东西已经在你手里了？"
        - id: ch01-b102
          speaker: hurree
          text: "尽管打赌，当然在我手里。东西马上送到办事处。老太太以为我是这里的固定摆设，可我立刻就走。勒根先生一定会骄傲。公事上你归我管，我会在口头报告里写上你的名字。不能交书面报告实在可惜，我们孟加拉人最擅长泽门精密科学。"
        - id: ch01-b103
          speaker: narrator
          text: "胡里把战利品塞到全身各处，只有东方人才有这种本事。他扔回钥匙，让金看空箱子。"
        - id: ch01-b104
          speaker: kim
          text: "好，这很好。我当时累极了，圣人也病了。他真的掉进了……"
        - id: ch01-b105
          speaker: hurree
          text: "哦，是的。我是他的好朋友。追你们下山时，他的举动泽常古怪。我想文件也许在他身上，便跟去看他冥想，顺便讨论民族学。如今跟他的护符相比，我在这里已经是泽常渺小的人物。奥哈拉，你知道吗？他会抽搐，也可能是强直昏厥，甚至癫痫。我看见他躺在树下，已经快死了。他忽然跳起来，走进溪里。若不是我，他几乎淹死。是我把他拖出来的。"
        - id: ch01-b106
          speaker: kim
          text: "因为我不在那里！他差点会死。"
        - id: ch01-b107
          speaker: hurree
          text: "是啊，差点死，可现在已经干了，还坚称自己经历过变形。我把他的话记下来，以后有机会交给皇家学会。你快点好起来，回西姆拉以后，我在勒根家讲完整的故事。精彩极了。那两人的裤脚全撕破，纳汉老土王还以为他们是逃跑的欧洲兵。"
        - id: ch01-b108
          speaker: kim
          text: "那两个俄国人？他们跟你待了多久？"
        - id: ch01-b109
          speaker: hurree
          text: "一个是法国人。哦，好多天，好多天，好多天！现在所有山民都认定俄国人全是叫花子。天哪！他们每一样该死的东西都得由我去弄。我还给那些普通人讲故事，很多故事和趣闻。等你上来，我们在老勒根家慢慢说，还要出去快活一夜！泽是你我帽子上各添一根羽毛的大功劳。他们还给了我一张证明，泽才是笑话上最香的奶油。你真该看他们在联盟银行证明身份的样子！还得感谢万能的上帝，幸亏文件都在你手里。等你身体好些，准会笑。现在我直奔火车站。这场游戏会给你记下许多功劳。你什么时候来？你把我们吓得不轻，可我们还是泽常以你为荣，尤其是马哈布。"
        - id: ch01-b110
          speaker: kim
          text: "是啊，马哈布。他在哪里？"
        - id: ch01-b111
          speaker: hurree
          text: "当然在泽附近卖马。"
        - id: ch01-b112
          speaker: kim
          text: "在这里？为什么？慢慢说，我脑袋里还有一层厚雾。"
        - id: ch01-b113
          speaker: hurree
          text: "你瞧，我胆子小，又不喜欢担责任。你病了，我不知道那些见鬼的文件在哪里，也不知道有多少。所以一到这里，我便私下给正在密拉特看赛马的马哈布发电报，告诉他情形。他带着手下来，又跟喇嘛来往，后来骂我是傻瓜，对我泽常无礼。"
        - id: ch01-b114
          speaker: kim
          text: "可为什么？"
        - id: ch01-b115
          speaker: hurree
          text: "泽也正是我问的。我只提议，万一有人偷走文件，希望几个强壮勇敢的汉子把它们再抢回来。那些东西泽关重要，马哈布·阿里又不知道你在哪儿。"
        - id: ch01-b116
          speaker: kim
          text: "让马哈布·阿里来抢萨希巴的宅子？你疯了，先生！"
          emotion: angry
        - id: ch01-b117
          speaker: hurree
          text: "我要文件。万一是她偷了呢？我觉得泽只是个实际的建议。你不高兴吗？"
        - id: ch01-b118
          speaker: narrator
          text: "金用一句无法照录的本地谚语，说明自己有多鄙夷。"
        - id: ch01-b119
          speaker: hurree
          text: "好吧，人的口味真没道理。马哈布也生气。他在附近到处卖马，还说老太太是地地道道的老夫人，绝不会做那种不体面的事。我不管。文件到手，马哈布又在附近给我壮胆，我泽常高兴。我是个胆小的人，可不知为什么，越害怕，越会掉进该死的险境。所以你陪我去奇尼，我很高兴。马哈布在附近，我也高兴。老太太有时对我和我的漂亮药丸泽常无礼。"
        - id: ch01-b120
          speaker: kim
          text: "愿真主慈悲！先生真是一头神奇的怪兽！那个人竟独自走下山，若真是走下来的，身边还带着又挨抢又愤怒的外国人！"
          emotion: happy
        - id: ch01-b121
          speaker: hurree
          text: "他们打过我以后，倒没什么。可文件要是丢了，事情就泽常严重。马哈布也差点打我，还跟喇嘛来往个没完。以后我还是研究民族学吧。再见，奥哈拉先生。动作快些，我还能赶上四点二十五分去安巴拉的火车。等大家在勒根先生家讲这故事，那才是好日子。我会在正式报告里把你写得更好。再见，我亲爱的伙计。下回情绪激动时，别穿着西藏衣服，却满嘴穆斯林说法。"
        - id: ch01-b122
          speaker: narrator
          text: "胡里握了两次手，从头到脚都是个十足的先生。门一开，阳光照上他依旧洋洋得意的脸，他又成了卑微的达卡庸医。"
        - id: ch01-b123
          speaker: narrator
          text: "金想，抢那两个人的是胡里。他骗了他们，像孟加拉人那样撒谎，他们反倒给他品行证明。他冒着生命危险，把他们耍成笑柄。枪一响，金自己绝不敢再走近他们。可胡里还说自己胆小，而他的确胆小。金知道，自己得重新回到世上去了。"
        - id: ch01-b124
          speaker: narrator
          text: "起初，金的双腿像坏烟管一样弯来折去。阳光下的空气奔流着涌来，晃得他眼花。他蹲在白墙边，脑子翻找漫长轿程里的每一幕，又想起喇嘛一路变得多么虚弱。谈话带来的兴奋退去，他又开始怜惜自己，病人心里总积着许多这种怜惜。受惊的脑子避开外界，像被马刺狠狠扎过的生马，侧着身子躲开刺尖。基尔塔里的战利品已经交出，不再归他，也不用他看管。那份责任已经从肩上卸下，这就够了，完全够了。"
        - id: ch01-b125
          speaker: narrator
          text: "他试着想喇嘛，想弄明白老人为什么掉进溪里。可从前院门望出去，世界实在太大，刚连起的思绪一下又散了。他望着树、广阔的田野，还有藏在庄稼间的茅草屋。那双眼睛很陌生，竟认不出万物的大小、比例和用处。他呆看了整整半个钟头。总有一种说不出的感觉缠着他。他的灵魂和周围一切脱了齿，像一只没接上机器的齿轮，又像廉价榨糖机里拆下后丢在角落的齿轮。微风吹过，鹦鹉尖叫，身后的大宅里有人争吵、命令、斥责，可这些声音只撞上了一双充耳不闻的耳朵。"
        - id: ch01-b126
          speaker: kim
          text: "我是金。我是金。金到底是什么？"
        - id: ch01-b127
          speaker: narrator
          text: "他的灵魂一遍又一遍地问。他根本不想哭，这一生没有哪一刻比现在更没有哭意，几滴轻易而迟钝的泪却忽然顺鼻子流下。随后，他几乎听见咔嗒一声，感觉自己的齿轮重新咬住了外面的世界。方才那些东西只从眼球上滑过，没有名字，也没有意义。现在它们一下回到各自的位置，都有了恰当的大小和用处。道路就是让人走的，房屋就是让人住的。牛要有人驱赶，田地要有人耕种，男人和女人则可以走上前去交谈。它们全都真实稳固，牢牢站在自己脚上，也全都可以理解。它们和金属于同一片泥土，不多，也不少。"
        - id: ch01-b128
          speaker: narrator
          text: "金像耳朵里钻了跳蚤的狗一样用力抖抖身体，信步走出大门。眼线把消息告诉萨希巴。"
        - id: ch01-b129
          speaker: sahibah
          text: "让他去吧。我的那份已经做完，剩下的该由大地母亲来做。圣人冥想回来以后，告诉他一声。"
        - id: ch01-b130
          speaker: narrator
          text: "半英里外有座小丘。丘上停着一辆空牛车，车后长着一株小榕树，像一座望台，俯瞰着几片刚犁过的平地。柔软的空气沐浴金的眼皮，他越往前走，眼皮就越沉。脚下是干净的好尘土，不是刚长出的青草。青草虽然活着，却已经走完通向死亡的一半。尘土不同，它充满希望，里面藏着一切生命的种子。金让土从脚趾之间钻过去，又摊开手掌，轻轻拍了拍它。随后他满足地叹息，从脚趾到肩头，一节关节接一节关节地舒展开，最后直直躺进那辆用木销钉拼成的牛车阴影里。"
        - id: ch01-b131
          speaker: narrator
          text: "大地母亲和萨希巴一样忠实。金在床上躺了太久，和她善意的流动隔绝开来，所以失去了平衡。如今，她的气息从泥土里升起，穿过他的身体，又把那平衡一点点扶正。他已经没有力气，只能把头枕在她胸前。摊开的双手也不再抵抗，完全向她的力量投降。头顶那株根须繁多的活树，连同身边那辆任人摆布的死木牛车，都知道他在寻找什么。只有金自己还不知道。他一小时又一小时地躺着，越沉越深，最后进入了一个比睡眠还深的地方。"
        - id: ch01-b132
          speaker: narrator
          text: "傍晚，归来的牛群扬起尘土，四面天际都像冒着烟。喇嘛和马哈布·阿里步行而来。他们走得很小心，因为宅里的人已经说了金在哪里。"
        - id: ch01-b133
          speaker: mahbub
          text: "真主啊！竟在空地上做这种蠢事！别人能开枪打死他一百次。不过，这里不是边疆。"
        - id: ch01-b134
          speaker: lama
          text: "从来没有过这样的徒弟。他节制、仁厚、明智，从不吝惜。上路时总带着一颗快活的心，从不忘事。他有学问，诚实，又谦恭有礼。他的报偿多么丰厚！"
        - id: ch01-b135
          speaker: mahbub
          text: "我了解这孩子，已经说过了。"
        - id: ch01-b136
          speaker: lama
          text: "这些品性，他真的样样都有？"
        - id: ch01-b137
          speaker: mahbub
          text: "有几样吧。可我还没见过哪道红帽子的护符，能叫他诚实过头。他的确被照料得很好。"
        - id: ch01-b138
          speaker: lama
          text: "萨希巴有一颗金子般的心。她把他当自己的儿子。"
        - id: ch01-b139
          speaker: mahbub
          text: "哼！半个印度好像都想这样。我只要亲眼看看他没有受伤，还能自己做主。你也知道，你们刚开始朝圣时，我和他已经是老朋友。"
        - id: ch01-b140
          speaker: lama
          text: "这就是你我之间的纽带。我们的朝圣已经到了终点。"
        - id: ch01-b141
          speaker: mahbub
          text: "一个星期前，要不是有人救你，朝圣早就彻底到终点了。可别把那算成自己的功劳。我们拿小床抬你回来时，萨希巴对你说的话，我全听见了。"
        - id: ch01-b142
          speaker: lama
          text: "那时我在冥想别的事。达卡来的哈基姆打断了我。"
        - id: ch01-b143
          speaker: mahbub
          text: "不然，你这个异教徒、拜偶像的人，纵使有孩子般的单纯，也已经在地狱最热的一面结束冥想了。红帽子，你现在打算怎么办？"
        - id: ch01-b144
          speaker: lama
          text: "就在今夜，他会和我一样洗清所有罪污，也和我一样得到保证。离开肉身时，他必能摆脱万物之轮，获得解脱。我得到了一个征兆，知道自己的日子已经不多。可往后的岁月里，我都会护他周全。记住，我已经抵达真知，三天前就告诉过你。"
          emotion: happy
        - id: ch01-b145
          speaker: narrator
          text: "他说得很慢，每一个字都因胜利而颤动。手掌放在怀里那幅破损的图卷上。马哈布暗想，蒂拉那个教士说得不错。那人说马哈布偷走他表亲的妻子，这足以证明他是个不拘教条的苏菲。现在，他竟坐在一个红帽子身旁，把这些无法想象的亵渎话一滴一滴喝下去，而且还记得这整套说法。照喇嘛的意思，金以后会去阿德恩天堂。可究竟要怎么去？难道就在今晚，由眼前这个老人把他送过去吗？"
        - id: ch01-b146
          speaker: mahbub
          text: "你要杀了他，还是把他淹死在那条把你从先生手中拖走的神奇河里？"
        - id: ch01-b147
          speaker: lama
          text: "没人把我拖出河。你忘了当时的事。我凭真知找到了它。"
          emotion: calm
        - id: ch01-b148
          speaker: mahbub
          text: "哦，是啊，不错。我忘了准确的说法。你是有意找到它的。"
        - id: ch01-b149
          speaker: narrator
          text: "马哈布说得结结巴巴，一半义愤填膺，一半又觉得可笑。"
        - id: ch01-b150
          speaker: lama
          text: "说我会夺取生命，并不是罪过，只是一句彻底的疯话。徒弟帮我来到河边，他有权和我一起洗清罪孽。"
        - id: ch01-b151
          speaker: mahbub
          text: "是啊，他的确该洗洗。可以后呢，老头子？以后怎么办？"
        - id: ch01-b152
          speaker: lama
          text: "普天之下，还有什么重要？他和我一样，已经得到涅槃的保证，也会开悟。"
        - id: ch01-b153
          speaker: mahbub
          text: "说得好。我方才还怕他骑上穆罕默德的天马，一下飞走。"
        - id: ch01-b154
          speaker: lama
          text: "不会。他必须回到世上教导众人。"
        - id: ch01-b155
          speaker: mahbub
          text: "啊哈！这下我懂了！小马就该这样走。他当然得出去做导师。比如国家眼下就很需要他当一名书记。"
        - id: ch01-b156
          speaker: lama
          text: "他早已为此受过教导。我替他布施，也积下功德。善行不会消亡。他帮我寻找，我也帮他寻找。万物之轮公正无误，来自北方的马贩啊。让他做导师也好，做书记也好，有什么要紧？最后他总会解脱，其余都是幻象。"
        - id: ch01-b157
          speaker: narrator
          text: "马哈布心里反驳，怎么会不要紧？六个月以后，他得带金越过巴尔赫。都怪那个胆小的先生。马哈布带着十匹瘸马和三个背脊强壮的汉子赶来，本来是要从一个老太婆家里强行救出病孩子。必要时，他们会闯进宅子，把拦路的人推开。如今倒好，他站在一旁，看一个红帽子把年轻少爷吊进真主才知道什么模样的异教天堂。他自己明明还是大游戏里有些本领的玩家，竟然陪着老人谈这种事。可这个疯子确实喜欢那孩子，看来马哈布自己疯得也很有道理。粗重的普什图话在红胡子里滚动。"
        - id: ch01-b158
          speaker: lama
          text: "你在念什么祷词？"
        - id: ch01-b159
          speaker: mahbub
          text: "没什么要紧。如今我明白了，这孩子虽然稳稳进了天堂，还是能替政府办事。我放心了。我要去看马，天快黑了。别叫醒他，我不想听他开口叫你师父。"
        - id: ch01-b160
          speaker: lama
          text: "他本来就是我的徒弟，不然还能是什么？"
        - id: ch01-b161
          speaker: mahbub
          text: "他已经告诉过我。我并不完全相信你的教法，红帽子，若这点小事值得你费心的话。"
        - id: ch01-b162
          speaker: lama
          text: "没什么。"
        - id: ch01-b163
          speaker: mahbub
          text: "我就知道。所以我才说你是个好人，一个非常好的人，也不去搅动你这个无罪、刚洗干净、外加淹了四分之三的人。我们一起谈了四五个晚上。虽说我是马贩，也能越过马腿看见圣洁。我也明白了，为什么我们这位全世界的朋友当初会把手放进你手里。好好待他。等你替他洗完腿，若这真是医治小马的正经办法，就让他以导师的身份回到世上。"
        - id: ch01-b164
          speaker: lama
          text: "你为什么不亲自走这条路，也好陪伴这孩子？"
        - id: ch01-b165
          speaker: narrator
          text: "马哈布瞪大眼睛。这要求气魄十足，简直放肆。若在边疆，他回敬的绝不只是一拳。随后，话里的滑稽触动了他久经世故的心。"
        - id: ch01-b166
          speaker: mahbub
          text: "慢慢来，慢慢来。一次迈一只脚，就像那匹瘸骟马跳安巴拉的栏杆。以后我也许会进天堂。我心里已经有些变化，很大的变化，全要归功于你的单纯。你从没撒过谎？"
        - id: ch01-b167
          speaker: lama
          text: "何必呢？"
        - id: ch01-b168
          speaker: mahbub
          text: "真主啊，听听！在你的世界里，他竟问何必。你也从没伤过人？"
        - id: ch01-b169
          speaker: lama
          text: "还没有智慧时，我曾用笔盒伤过一个人。"
        - id: ch01-b170
          speaker: mahbub
          text: "是吗？那我更看得起你了。你的教导很好。我知道一个人，已经被你从争斗的路上领回来。那人来时心胸开阔，准备干一场达科伊蒂，闯进宅子抢劫。他本来想砍人、抢东西、杀人，再拿走想要的一切。"
        - id: ch01-b171
          speaker: narrator
          text: "马哈布放声大笑。"
        - id: ch01-b172
          speaker: lama
          text: "太愚蠢了！"
        - id: ch01-b173
          speaker: mahbub
          text: "哦，也极可耻。他见过你，又见过几个人，有男有女，也开始这样想，于是放弃了。现在他要去揍一个肥胖的大先生。"
        - id: ch01-b174
          speaker: lama
          text: "我不明白。"
        - id: ch01-b175
          speaker: mahbub
          text: "但愿真主不让你明白！红帽子，有些人的力量在知识里，你的力量却更强。守住它，我想你会守住。那孩子若不是好仆人，就把他的耳朵揪下来。"
        - id: ch01-b176
          speaker: narrator
          text: "帕坦人提了提宽大的布哈拉腰带，大摇大摆走进暮色。喇嘛这才稍稍从云端落下，望了一眼那宽阔的背影。"
        - id: ch01-b177
          speaker: lama
          text: "这个人不懂礼数，还受外相的阴影蒙骗。不过他把我的徒弟说得很好，而我的徒弟就要得到报偿。让我念祷词吧！醒来呀，所有女子所生的人里最有福的一个。醒来！已经找到了！"
          emotion: happy
        - id: ch01-b178
          speaker: narrator
          text: "金从那些深井里浮上来。喇嘛看着他舒舒服服地打哈欠，又照规矩打响手指，赶走恶灵。"
        - id: ch01-b179
          speaker: kim
          text: "我睡了一百年。这是什么地方？圣人，你在这里很久了吗？我出去找你，可半路睡着了。我现在全好了。你吃过东西吗？我们回宅子吧。我好多天没有照料你。萨希巴给你吃得好吗？谁替你揉腿？那些虚弱呢，肚子、脖颈，还有耳朵里的怦怦声？"
        - id: ch01-b180
          speaker: lama
          text: "全好了，全都好了。你不知道吗？"
        - id: ch01-b181
          speaker: kim
          text: "我什么都不知道，只知道已经猴年马月没见你了。知道什么？"
        - id: ch01-b182
          speaker: lama
          text: "真奇怪。我的每道念头都朝着你，那份真知竟没有伸到你那里。"
        - id: ch01-b183
          speaker: kim
          text: "我看不清你的脸，可声音响得像一面锣。萨希巴用饭菜把你变年轻了吗？"
        - id: ch01-b184
          speaker: narrator
          text: "金眯起眼睛，努力看清那个盘腿坐着的身影。柠檬色的暮光在天地之间缓缓流动，喇嘛的身影立在光里，黑得清清楚楚。那模样就像拉合尔博物馆里的石菩萨，低垂着眼睛，望向最新式的自动计数旋转门。喇嘛没有说话。只有念珠在手里轻轻咔嗒，马哈布渐渐远去的脚步传回模糊的嗒、嗒声。印度傍晚的寂静柔软，又带着烟气，从四面八方合拢，把他们两人紧紧裹住。"
        - id: ch01-b185
          speaker: lama
          text: "听我说！我带来了消息。"
        - id: ch01-b186
          speaker: kim
          text: "可是我们先……"
        - id: ch01-b187
          speaker: narrator
          text: "那只黄色长手猛然伸出，要他住口。金顺从地把双脚收进袍角。"
        - id: ch01-b188
          speaker: lama
          text: "听我说！我带来了消息！寻找结束了，现在该拿报偿。我们在山里时，我一直靠你的力气活着，直到年轻枝条弯下去，几乎折断。离开群山以后，我为你担忧，也为心里别的事烦恼。灵魂之舟失了方向，看不见万物之因。我便把你完全交给那位有德的女人。"
        - id: ch01-b189
          speaker: lama
          text: "我不吃也不喝，还是看不见路。他们强把食物塞给我，又在紧闭的门外叫喊。于是我离开宅子，来到树下的洼地。我静坐两天两夜，不吃不喝，收束心神，照法门呼吸。第二夜，我得到极丰厚的报偿。智慧的灵魂从愚蠢的肉身里松开，终于自由。我从未到过那里，虽然以前曾站在门槛上。想想看，这是怎样的奇迹！"
          emotion: happy
        - id: ch01-b190
          speaker: kim
          text: "的确是奇迹。两天两夜没吃东西！萨希巴在哪里？"
        - id: ch01-b191
          speaker: narrator
          text: "金压低了声音。"
        - id: ch01-b192
          speaker: lama
          text: "我的灵魂自由了，像鹰一样盘旋升起。我真真切切看见，世上既没有德舒喇嘛，也没有任何别的灵魂。一滴水怎样流向另一滴水，我的灵魂也怎样靠近那个超越万物的大灵。那时，我升进观照，看见整个印度。从海中的锡兰一直看到北方群山，也看见苏禅寺里属于我的那些彩绘岩壁。我们一路歇过的每一处营地、经过的每一个村庄，我也全都看见了，连最小的地方都没有漏掉。它们明明相隔遥远，我却在同一时刻、同一地点看见一切，因为它们全都在灵魂之中。由此我知道，灵魂已经越过时间、空间和万物的幻象。我已经自由。"
        - id: ch01-b193
          speaker: lama
          text: "我看见你躺在小床上，也看见你在异教徒身下滚下山坡。一个是现在，一个是从前，可两幕同时发生在同一个地方，都在我那已经触到大灵的灵魂里面。我还看见德舒喇嘛那副愚蠢的肉身躺在树下，达卡来的哈基姆跪在旁边，朝它的耳朵大喊。随后，我的灵魂完全孤独，眼前再也没有任何东西，因为我已经成为万物，抵达了大灵。我在那里冥想了千万年，没有欲望，也没有需求，只是清清楚楚地知道万物的起因。"
        - id: ch01-b194
          speaker: lama
          text: "忽然，一个声音问，若你死了，那孩子怎么办？对你的怜惜让我在自身之中来回震荡。我说，我要回到徒弟身边，免得他错失道路。于是，德舒喇嘛的灵魂带着无法形容的挣扎、渴望、干呕和痛苦，从大灵里退出来。卵离开鱼，鱼离开水，水离开云，云离开稠密的空气，我的灵魂也这样生出、跃出、抽离、升腾，离开大灵。"
        - id: ch01-b195
          speaker: lama
          text: "接着有声音喊，河，留心那条河！我俯视全世界，它仍和先前看见的一样，时间全都聚在一处，空间也全都聚在一处。我清清楚楚看见，箭河就在我的脚下。就在那一刻，一种还没有洗净的恶物缠住了我的灵魂。它沉沉压住我的双臂，又盘绕在我的腰身。我用尽力量把它推开，只望着河所在的那一点地方，像鹰一般振翅冲去。为了你，我把挡在前面的一个又一个世界全都推到两旁。"
        - id: ch01-b196
          speaker: lama
          text: "我看见下方那条河，清清楚楚知道它就是我一路寻找的箭河。我朝它所在的地方降下去，直到河水越过头顶，在我头上合拢。看哪，我又回到德舒喇嘛的肉身里，却已经洗清罪孽。达卡来的哈基姆正在河水中，用双手托着我的头。河就在这里，就在这片芒果林后面，真的就在这里！"
          emotion: happy
        - id: ch01-b197
          speaker: kim
          text: "真主慈悲！幸亏先生在旁边！你浑身湿得厉害吗？"
          emotion: surprised
        - id: ch01-b198
          speaker: lama
          text: "我为什么在意？我记得哈基姆很担心德舒喇嘛的肉身。他用双手把那身体拖出圣水。后来，来自北方的马贩带着小床和人赶来。他们把身体放上去，抬回萨希巴的宅子。"
        - id: ch01-b199
          speaker: kim
          text: "萨希巴说了什么？"
        - id: ch01-b200
          speaker: lama
          text: "我在那副身体里冥想，什么也没听见。寻找就是这样结束的。因为我积下的功德，箭河就在这里。正如我说过的，它从我们脚下涌出。我已经找到它了。"
        - id: ch01-b201
          speaker: lama
          text: "我灵魂的儿子啊，我把自己的灵魂从解脱的门槛上硬生生扯回来，为的是像我已经自由、洗净罪孽一样，也替你洗净全部罪孽！万物之轮公正无误！我们的解脱确凿无疑！来吧！"
          emotion: happy
        - id: ch01-b202
          speaker: narrator
          text: "喇嘛双手交叠，放在膝上，微微笑着。那笑容属于一个已经为自己，也为挚爱之人一同赢得救赎的人。"
