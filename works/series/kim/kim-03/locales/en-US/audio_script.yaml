  chapters:
    - id: ch01
      title: CHAPTER III
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: The warm wind brings Kamakura, carrying the voice of every soul that clung to life and struggled upward when Devadatta ruled.
        - id: ch01-b02
          speaker: narrator
          text: Behind Kim and the lama, an angry farmer waved a bamboo pole while his dogs barked. He was an Arain market gardener who raised flowers and vegetables for Umballa. Kim knew the breed well, with its sharp concern for fields, water, and anything that might threaten the next crop.
        - id: ch01-b03
          speaker: lama
          text: My disciple, notice this man. He is rude to strangers, wild in his speech, and without charity. Let his behavior warn you.
        - id: ch01-b04
          speaker: farmer
          text: Ho, you shameless beggars! Be off with you!
          emotion: angry
        - id: ch01-b05
          speaker: lama
          text: We are leaving. We will go out of these unblessed fields.
        - id: ch01-b06
          speaker: kim
          text: Ah! If your next crops fail, blame that tongue of yours.
        - id: ch01-b07
          speaker: narrator
          text: The farmer shifted uneasily in his slippers. He began to excuse himself, saying that the land was full of beggars.
        - id: ch01-b08
          speaker: kim
          text: And what made you think we meant to beg from you, Mali? We only wanted to see that river beyond your field.
        - id: ch01-b09
          speaker: farmer
          text: River? What city are you from, if you cannot recognize a canal? It runs straight as an arrow, and its water costs me like melted silver. There is a branch of a river farther on. But if you need water, I can give you water and milk.
        - id: ch01-b10
          speaker: lama
          text: No. We will go to the river.
        - id: ch01-b11
          speaker: farmer
          text: Then take milk and a meal too. I would not bring evil upon myself or my crops. There are so many beggars in these hard times, that is all.
        - id: ch01-b12
          speaker: lama
          text: Take notice, Kim. The Red Mist of anger made him speak harshly. Now it has cleared from his eyes, and he is courteous again. May his fields be blessed. And farmer, do not judge people too quickly.
        - id: ch01-b13
          speaker: kim
          text: Other holy men would have cursed everything from your hearth to your cattle shed. See how wise and holy he is? I am his disciple.
        - id: ch01-b14
          speaker: narrator
          text: Kim lifted his nose grandly and stepped across the narrow borders of the fields.
        - id: ch01-b15
          speaker: lama
          text: Those who follow the Middle Way have no pride.
        - id: ch01-b16
          speaker: kim
          text: But you called him low-caste and rude.
        - id: ch01-b17
          speaker: lama
          text: I never called him low-caste. How can such a thing exist? He corrected his rudeness, so I forgot it. He is bound upon the Wheel of Things as we are, though he does not walk the path to freedom.
        - id: ch01-b18
          speaker: narrator
          text: At a little stream among the fields, the lama stopped to study the bank, pitted by hooves. Kim crouched in the shade of tall sugar cane.
        - id: ch01-b19
          speaker: kim
          text: How will you know your River when you see it?
        - id: ch01-b20
          speaker: lama
          text: When I find it, enlightenment will surely come to me. I feel that this is not the place. Little stream, if only you could tell me where my River runs! Still, may you be blessed and make these fields fruitful.
        - id: ch01-b21
          speaker: kim
          text: Look! Look there!
          emotion: fearful
        - id: ch01-b22
          speaker: narrator
          text: Kim sprang up and pulled the lama back. A yellow-and-brown streak slid from the rustling purple stems. A great cobra stretched its neck to the water, drank, and lay still, watching with lidless eyes.
        - id: ch01-b23
          speaker: kim
          text: I have no stick! I will find one and break its back.
          emotion: fearful
        - id: ch01-b24
          speaker: lama
          text: Why? He is on the Wheel just as we are, rising or falling through life and still far from freedom. A soul must have done great evil to be cast into that shape.
        - id: ch01-b25
          speaker: kim
          text: I hate every snake.
        - id: ch01-b26
          speaker: narrator
          text: No amount of native training could quiet the white man's horror of serpents. The cobra coiled, hissed, and opened its hood halfway.
        - id: ch01-b27
          speaker: lama
          text: Let him finish his life. May your release come soon, brother. Do you happen to know where my River is?
        - id: ch01-b28
          speaker: kim
          text: I have never met anyone like you. Do even the snakes understand what you say?
          emotion: surprised
        - id: ch01-b29
          speaker: lama
          text: Who knows?
        - id: ch01-b30
          speaker: narrator
          text: The lama walked within a foot of the cobra's raised head. It settled flat among its dusty coils. He called back to Kim.
        - id: ch01-b31
          speaker: lama
          text: Come along.
        - id: ch01-b32
          speaker: kim
          text: Not me. I am going around.
        - id: ch01-b33
          speaker: lama
          text: Come. He will not hurt you.
        - id: ch01-b34
          speaker: narrator
          text: Kim hesitated. The lama droned a Chinese quotation that sounded like a charm to him. At last Kim obeyed and leaped across the stream. The cobra did not move.
        - id: ch01-b35
          speaker: kim
          text: Never have I seen such a man. Now, where do we go?
        - id: ch01-b36
          speaker: lama
          text: You must decide. I am old and far from my own country. I would take the rail carriage to Benares, but its devil drums fill my head with noise, and we might pass the River. Let us search for another river instead.
        - id: ch01-b37
          speaker: narrator
          text: All day they wandered through soil worked hard enough to give three or even four crops a year. They passed patch after patch of sugar cane, tobacco, long white radishes, and kohlrabi. Every flash of water drew them from their path. They woke village dogs and then the villages themselves as they crossed at noon. Questions came at them from every side, but the lama always gave the same simple answer. They were searching for a River, a miraculous River that healed all who bathed in it. Had anyone heard of such a stream, or could anyone show them where it ran?
        - id: ch01-b38
          speaker: narrator
          text: Some men laughed when they heard the story. More often, people listened patiently until the lama reached the end. Then they offered the travelers a place in the shade, a drink of milk, and enough food for a meal. The women were always kind to them. The little children behaved like children everywhere, hanging back shyly at first, then edging closer and growing bold enough to stare and question.
        - id: ch01-b39
          speaker: narrator
          text: By evening they rested beneath the great tree of a little village, where the walls and roofs were made of mud. Cattle came home slowly from the grazing grounds while women prepared the last meal of the day. Kim and the lama had left the crowded belt of market gardens that fed hungry Umballa. Around them now stretched mile after mile of green staple crops.
        - id: ch01-b40
          speaker: narrator
          text: The white-bearded headman was friendly and accustomed to welcoming travelers. He dragged out a woven string bed for the lama, set warm cooked food before him, and prepared a pipe. When the village's evening ceremonies ended at the temple, he sent someone to fetch the priest. Kim gathered the older children and filled their heads with the size and beauty of Lahore, the wonder of railway journeys, and other marvels of city life. Nearby, the men talked as slowly as their cattle chewed the cud. The lama had finished telling his story and sat silently moving the beads through his fingers.
        - id: ch01-b41
          speaker: headman
          text: I cannot make sense of his story. Priest, what do you think it means?
        - id: ch01-b42
          speaker: priest
          text: He is a Seeker. The whole country is full of them. Remember the fakir with the tortoise who came last month?
        - id: ch01-b43
          speaker: headman
          text: That man had a sensible reason. Krishna appeared in a vision and promised him Paradise without the funeral fire if he went to Prayag. This stranger seeks no god I know.
        - id: ch01-b44
          speaker: priest
          text: Peace. He is old, far from home, and mad. Holy One, listen. Six miles west of here runs the great road to Calcutta.
        - id: ch01-b45
          speaker: lama
          text: But I wish to go to Benares.
        - id: ch01-b46
          speaker: priest
          text: It goes to Benares too, and it crosses every stream on this side of Hind. Rest here tonight. Tomorrow, take that road and test each stream it crosses. The power of your River must run through its whole length, not stay in one pool or place. If your gods permit it, you will find your freedom.
        - id: ch01-b47
          speaker: lama
          text: That is wisely said. We will begin tomorrow. Bless you for showing old feet such a short road.
        - id: ch01-b48
          speaker: narrator
          text: The lama ended in a deep Chinese half-chant. It impressed even the priest, and for a moment the headman feared a spell. Yet the lama's eager, innocent face soon quieted every doubt. In return for their courtesy, he began to tell them about Kim.
        - id: ch01-b49
          speaker: lama
          text: Do you see my disciple?
        - id: ch01-b50
          speaker: headman
          text: I see him, and I certainly hear him.
        - id: ch01-b51
          speaker: narrator
          text: The headman glanced at Kim, who was talking to a girl in blue as she fed crackling thorns into a fire.
        - id: ch01-b52
          speaker: lama
          text: He has a Search too. He seeks no river, but a Red Bull on a green field that will lift him to honor. I think he does not belong entirely to this world. He appeared suddenly to help me, and his name is Friend of all the World.
        - id: ch01-b53
          speaker: priest
          text: Ho, Friend of all the World! What are you?
        - id: ch01-b54
          speaker: kim
          text: This Holy One's disciple.
        - id: ch01-b55
          speaker: priest
          text: He says you are a spirit.
        - id: ch01-b56
          speaker: kim
          text: Can spirits eat? Because I am hungry.
        - id: ch01-b57
          speaker: lama
          text: Do not joke. An astrologer in that city whose name I have forgotten cast Kim's horoscope.
        - id: ch01-b58
          speaker: kim
          text: He only means Umballa, where we slept last night.
        - id: ch01-b59
          speaker: lama
          text: Yes, Umballa. The astrologer said my disciple would find what he seeks within two days. Friend of all the World, what did he say your stars meant?
        - id: ch01-b60
          speaker: narrator
          text: Kim cleared his throat, looked around at the gray-bearded villagers, and stood grandly on the brick platform beneath the tree.
        - id: ch01-b61
          speaker: kim
          text: My Star means War.
        - id: ch01-b62
          speaker: narrator
          text: Someone laughed at the ragged little figure. Kim's white blood brought him sharply to his feet.
        - id: ch01-b63
          speaker: kim
          text: Yes. War.
        - id: ch01-b64
          speaker: soldier
          text: That prophecy is safe enough. There is always war along the Border. I know that well.
        - id: ch01-b65
          speaker: narrator
          text: The speaker was a withered old man who had served the Government as a native officer in a newly raised cavalry regiment during the Mutiny. The Government had rewarded him with a good holding in the village. His sons were gray-bearded officers now, and their demands had eaten away much of his wealth, but he remained a person of consequence. English officials came to see him. Even Deputy Commissioners turned off the main road for a visit. Whenever they arrived, he put on the uniform of his ancient service and stood before them straight as a ramrod.
        - id: ch01-b66
          speaker: kim
          text: This will be a great war. Eight thousand men will fight.
        - id: ch01-b67
          speaker: soldier
          text: Redcoats, or our own regiments?
        - id: ch01-b68
          speaker: kim
          text: Redcoats, with guns.
        - id: ch01-b69
          speaker: lama
          text: But the astrologer never said that!
          emotion: surprised
        - id: ch01-b70
          speaker: kim
          text: I know it myself. The word came to me because I am this Holy One's disciple. Eight thousand redcoats will be drawn from Pindi and Peshawur. It is certain.
        - id: ch01-b71
          speaker: priest
          text: The boy heard gossip in the bazaar.
        - id: ch01-b72
          speaker: lama
          text: He has stayed beside me. How could he know? I knew nothing of it.
        - id: ch01-b73
          speaker: narrator
          text: The priest muttered to the headman that Kim would make a clever juggler when the lama died. The old soldier suddenly demanded proof. If war were coming, he said, his sons would have told him.
        - id: ch01-b74
          speaker: kim
          text: Your sons will hear when everything is ready. But news travels a long way from them to the man who gives the orders.
        - id: ch01-b75
          speaker: narrator
          text: Kim warmed to the game. It felt like his days carrying letters for a few coins and pretending to know more than he did. This time the excitement and power were reward enough.
        - id: ch01-b76
          speaker: kim
          text: Old man, you give me a sign. Do underlings command eight thousand redcoats and their guns?
        - id: ch01-b77
          speaker: soldier
          text: No.
        - id: ch01-b78
          speaker: kim
          text: Do you know the man who does give that command?
        - id: ch01-b79
          speaker: soldier
          text: I have seen him. I have known him since he was a lieutenant in the Artillery.
        - id: ch01-b80
          speaker: kim
          text: A tall man with black hair who walks stiffly like this?
        - id: ch01-b81
          speaker: soldier
          text: Yes, but anyone might have seen that.
        - id: ch01-b82
          speaker: kim
          text: Then watch. First he walks so. When he thinks, his finger travels down his forehead to his jaw. Then his fingers twitch, and he pushes his hat under his left arm.
        - id: ch01-b83
          speaker: narrator
          text: Kim acted out every motion. He walked a few stiff, wooden paces, drew one finger down from his forehead to the corner of his jaw, twitched his hand, and tucked an imaginary hat beneath his left arm. Then he stood on one leg like a stork. The old soldier groaned because amazement had left him without words. All through Kim's performance, the gathering crowd had stood breathless. Now a shiver passed among them.
        - id: ch01-b84
          speaker: soldier
          text: Yes, yes! But what does he do just before he gives an order?
        - id: ch01-b85
          speaker: kim
          text: He rubs the back of his neck. One finger drops onto the table. He sniffs through his nose. Then he says, “Send out this regiment. Call out those guns.”
        - id: ch01-b86
          speaker: narrator
          text: The old man rose stiffly and saluted.
        - id: ch01-b87
          speaker: kim
          text: Then he says, “We should have done this long ago. It is not war. It is a punishment.” And he sniffs again.
        - id: ch01-b88
          speaker: soldier
          text: Enough. I believe you. I saw and heard him do exactly that through the smoke of battle. It is he!
          emotion: surprised
        - id: ch01-b89
          speaker: kim
          text: I saw no smoke. I saw darkness. First a man came to make things clear. Horsemen followed. Then he stood inside a ring of light, and everything happened as I told you. Old man, have I spoken the truth?
        - id: ch01-b90
          speaker: soldier
          text: It is he. There can be no doubt.
        - id: ch01-b91
          speaker: narrator
          text: The crowd breathed out in one long, wavering tremble. No one knew quite where to look. Their eyes moved back and forth between the old soldier, still rigidly standing at attention, and ragged little Kim upon the brick platform against the purple evening sky.
        - id: ch01-b92
          speaker: lama
          text: Did I not tell you he came from another world? He is the Friend of all the World and the Friend of the Stars!
        - id: ch01-b93
          speaker: villager
          text: At least the war has nothing to do with us. Young prophet, I own a red-spotted cow. Perhaps she is sister to your Bull.
        - id: ch01-b94
          speaker: kim
          text: I do not care if she is. My Stars have no interest in your cattle.
        - id: ch01-b95
          speaker: village_woman
          text: But she is very sick. My husband is a buffalo, or he would have asked properly. Tell me, will she get well?
        - id: ch01-b96
          speaker: narrator
          text: An ordinary boy might have carried the trick farther and promised to heal the cow himself. But Kim had spent thirteen years learning Lahore, and no one could know that city without learning something about human nature. He knew the fakirs by the Taksali Gate especially well. He also caught the village priest watching him from the side, with a dry smile that could wither a boast before it was spoken.
        - id: ch01-b97
          speaker: kim
          text: Does this village have no priest? I thought I saw a very great one here just now.
        - id: ch01-b98
          speaker: village_woman
          text: Yes, but—
        - id: ch01-b99
          speaker: kim
          text: You and your husband hoped to cure the cow for nothing but thanks. Do not cheat your temple. Give your priest a young calf. Unless your gods are too angry to forgive you, the cow will give milk within a month.
        - id: ch01-b100
          speaker: narrator
          text: The answer struck home. The couple were famous for their stinginess.
        - id: ch01-b101
          speaker: priest
          text: You are a master beggar. Forty years of cunning could not improve that answer. Surely you have made the old man rich?
        - id: ch01-b102
          speaker: kim
          text: A little flour, a little butter, and a mouthful of cardamoms. Can anyone grow rich on that? As you see, he is mad. Still, he feeds me while I learn the roads.
        - id: ch01-b103
          speaker: narrator
          text: Kim copied the exact voice used by the rough disciples of the Taksali Gate fakirs when they spoke among themselves.
        - id: ch01-b104
          speaker: priest
          text: Is his Search real, then, or only a cover for something else? Perhaps he seeks treasure.
        - id: ch01-b105
          speaker: kim
          text: He is mad many times over. There is nothing more to it.
        - id: ch01-b106
          speaker: narrator
          text: The old soldier came bobbing forward and invited Kim to accept his hospitality for the night. The priest advised the boy to go, but insisted that the honor of entertaining the lama belonged to the temple. The lama only smiled, innocent of every hidden purpose. Kim glanced from the priest's face to the soldier's, drew his own conclusions, and beckoned the lama away into the darkness.
        - id: ch01-b107
          speaker: kim
          text: Where is the money?
        - id: ch01-b108
          speaker: lama
          text: Inside my robe. Where else would it be?
        - id: ch01-b109
          speaker: kim
          text: Give it to me, quietly and quickly.
        - id: ch01-b110
          speaker: lama
          text: Why? We have no railway ticket to buy.
        - id: ch01-b111
          speaker: kim
          text: Am I your disciple or not? Do I not guard your old feet on the road? Give it here. I will return it at dawn.
        - id: ch01-b112
          speaker: narrator
          text: Kim slipped a hand above the lama's belt and took the purse.
        - id: ch01-b113
          speaker: lama
          text: So be it. This world is great and terrible. I never knew so many people lived in it.
        - id: ch01-b114
          speaker: narrator
          text: The priest was in a foul temper the next morning, but the lama was perfectly content. Kim had spent a fascinating evening in the old soldier's house. The veteran brought out his cavalry sword and balanced it across his dry knees. For hour after hour, he told stories of the Mutiny, of hard riding and old battles, and of young captains who had lain in their graves for thirty years. Kim listened until sleep overtook him.
        - id: ch01-b115
          speaker: lama
          text: This country air must be good. Old men sleep lightly, but I did not wake once before full daylight. Even now, I feel heavy.
        - id: ch01-b116
          speaker: kim
          text: Drink some hot milk. It is time to take the Road again.
        - id: ch01-b117
          speaker: narrator
          text: Kim knew the remedy from carrying such drinks to opium smokers he knew.
        - id: ch01-b118
          speaker: lama
          text: Yes, the long Road that crosses all the rivers of Hind. But how shall we repay these people, especially the priest, for their kindness? They worship idols, yet perhaps in another life they will find enlightenment. Shall we give the temple a rupee? Its god may be only stone and red paint, but we must honor goodness in the human heart.
        - id: ch01-b119
          speaker: kim
          text: Holy One, have you ever traveled the Road alone?
        - id: ch01-b120
          speaker: lama
          text: Of course, child. I walked from Kulu to Pathankot after my first disciple died. When people treated us kindly, we made offerings. Everyone in the Hills wished us well.
        - id: ch01-b121
          speaker: kim
          text: Things are different here in Hind. Their gods have many arms and nasty tempers. Leave them alone.
        - id: ch01-b122
          speaker: soldier
          text: Friend of all the World, I will guide you and your yellow man for a while. Last night opened the springs of memory in my dry old heart. It blessed me. War is in the air. I can smell it. See, I brought my sword.
        - id: ch01-b123
          speaker: narrator
          text: In the shadowy dawn, the old soldier came ambling up the village street on a squat pony with scissor-shaped hind legs. His own long legs hung down on either side of the little beast. The great sword rested at his hip, one hand lay on its pommel, and he stared fiercely north across the flat land as though the coming war might already be visible there.
        - id: ch01-b124
          speaker: soldier
          text: Tell me once more how he appeared in your vision. Climb up behind me. The pony can carry us both.
        - id: ch01-b125
          speaker: kim
          text: I am this Holy One's disciple.
        - id: ch01-b126
          speaker: narrator
          text: They passed through the village gate together. The villagers seemed almost sorry to lose their strange guests, but the priest's farewell remained cold and distant. During the night, he had used some of his opium on the lama, expecting to find money afterward. Thanks to Kim, he had wasted the drug on a man whose robe held nothing.
        - id: ch01-b127
          speaker: soldier
          text: Well said. I know little of holy men, but respect is always good. There is none left today, not even when a Commissioner comes to visit me. Yet why should a boy whose Star leads him to war follow a holy man?
        - id: ch01-b128
          speaker: kim
          text: Because he truly is holy in his words, his deeds, and his whole nature. He is unlike the others. We are not fortune-tellers, jugglers, or beggars.
        - id: ch01-b129
          speaker: soldier
          text: You are not. I can see that. I am less certain about him, though he walks well.
        - id: ch01-b130
          speaker: narrator
          text: The first freshness of morning carried the lama ahead in long, easy strides like a camel's. Deep in meditation, he clicked his rosary without thinking. They followed a country road worn into ruts as it curved over the flat land between great dark-green mango groves. Far to the east, the snowy Himalayas made a faint line against the sky. All India was already at work in the fields. Well wheels creaked, plowmen shouted behind their cattle, and crows filled the air with clamor. The morning touched even the bony pony with energy. It almost broke into a trot while Kim walked beside it with one hand on the stirrup leather.
        - id: ch01-b131
          speaker: lama
          text: I regret that I did not give a rupee to the shrine.
        - id: ch01-b132
          speaker: narrator
          text: The soldier growled into his beard, and the lama noticed him for the first time.
        - id: ch01-b133
          speaker: lama
          text: Are you searching for the River too?
        - id: ch01-b134
          speaker: soldier
          text: The day has just begun. Why think of a river before the pony needs water at sundown? I came to show you a short path to the Big Road.
        - id: ch01-b135
          speaker: lama
          text: I will remember your kindness, man of goodwill. But why carry a sword?
        - id: ch01-b136
          speaker: narrator
          text: The old soldier looked like a child caught at make-believe.
        - id: ch01-b137
          speaker: soldier
          text: The sword? An old man's fancy. The police forbid weapons throughout Hind, but every constable nearby knows me.
        - id: ch01-b138
          speaker: lama
          text: It is a bad fancy. What good comes from killing men?
        - id: ch01-b139
          speaker: soldier
          text: Very little, as I know. But if evil men were never killed, weaponless dreamers would not live in a good world. I saw the country from Delhi southward covered in blood.
        - id: ch01-b140
          speaker: lama
          text: What madness caused that?
        - id: ch01-b141
          speaker: soldier
          text: Only the gods who sent that plague can know. Madness entered the Army, and the men turned on their officers. That was evil, though it might still have been repaired. Then they killed the Sahibs' wives and children. The Sahibs came from across the sea and made them pay a terrible account.
        - id: ch01-b142
          speaker: lama
          text: I heard some rumor of it long ago. Was it called the Black Year?
        - id: ch01-b143
          speaker: soldier
          text: A rumor? What kind of life have you lived? The whole earth knew of that Year and trembled.
          emotion: surprised
        - id: ch01-b144
          speaker: lama
          text: Our earth shook only once, on the day the Excellent One received Enlightenment.
        - id: ch01-b145
          speaker: soldier
          text: Hmph! I saw Delhi shake, and Delhi is the center of the world.
        - id: ch01-b146
          speaker: lama
          text: They attacked women and children? That was an evil deed, and its punishment could not be escaped.
        - id: ch01-b147
          speaker: soldier
          text: Many tried to escape punishment, and gained very little. I was serving in a cavalry regiment then, and the regiment broke. Out of six hundred and eighty swords, how many men stayed true to the salt they had eaten? Only three. I was one of those three.
        - id: ch01-b148
          speaker: lama
          text: Your merit was great.
        - id: ch01-b149
          speaker: soldier
          text: Merit? We did not call it merit in those days. My own people, my friends, and my brothers all fell away from me. They said the English time had ended and every man should strike out and seize a little holding for himself. But I had talked with men who fought at Sobraon, Chilianwallah, Moodkee, and Ferozeshah. I told the others to wait. The wind would turn again, I said, and no blessing could ever rest on the work they had begun.
        - id: ch01-b150
          speaker: soldier
          text: In those days I rode seventy miles with an English lady and her baby before me on the saddle. Ah, that was a horse fit for a man! I carried them into safety. Then I rode back to my officer, the only one of our five who had not been killed. I told him my own people had cast me out and my cousin's blood was still wet on my sword. I asked him to give me work. He told me to be content. Great work lay before us, he said, and when the madness ended, there would be a reward.
        - id: ch01-b151
          speaker: lama
          text: Surely there is a reward when madness ends.
        - id: ch01-b152
          speaker: soldier
          text: They did not give medals then to every man who happened to hear a gun fire. I fought in nineteen full battles, forty-six cavalry skirmishes, and more little affairs than anyone could count. I carry nine wounds. I have a medal with four clasps and the medal of an Order. When the Empress of India had completed fifty years upon her throne and the whole land celebrated, my old captains remembered me. By then they were generals, and they said I should receive the Order of British India. I wear it around my neck even now.
        - id: ch01-b153
          speaker: soldier
          text: The State also gave land freely to me and my family. Men from the old days come to visit me there. They are Commissioners now, and they ride through my crops high on their horses where the whole village can see them. We sit together and talk through the old skirmishes once again. One dead man's name reminds us of a second, and that name brings back a third.
        - id: ch01-b154
          speaker: lama
          text: And after they leave?
        - id: ch01-b155
          speaker: soldier
          text: They go away, but not before the whole village sees them.
        - id: ch01-b156
          speaker: lama
          text: And what will you do at the very end?
        - id: ch01-b157
          speaker: soldier
          text: At the end, I will die.
        - id: ch01-b158
          speaker: lama
          text: And after that?
        - id: ch01-b159
          speaker: soldier
          text: Let the gods arrange it. I have never bothered them with prayers, and I do not think they will bother me. In my long life, I have noticed that men who forever interrupt Those Above with complaints, reports, bellowing, and tears are soon summoned in a hurry. Our Colonel used to summon loose-jawed men from down-country in exactly that way when they talked too much. No, I have never wearied the gods. They will remember that. They will give me a quiet place where I can plant my lance in the shade and wait to welcome my sons. I have three of them, and every one is a Rissaldar-major in a regiment.
        - id: ch01-b160
          speaker: lama
          text: They too are bound to the Wheel, hurrying from life to life and despair to despair, always hot, restless, and grasping.
        - id: ch01-b161
          speaker: soldier
          text: Yes, three Rissaldar-majors in three different regiments. They gamble a little, but so do I. Officers must be well mounted, and nowadays a man cannot simply take horses as men once took women. My holding can pay their expenses. The strip is well watered, but my workers cheat me. I never learned how to ask for obedience except at the point of a lance. I grow angry and curse them. They pretend to repent in front of me, but behind my back I know they call me a toothless old ape.
        - id: ch01-b162
          speaker: lama
          text: Have you never wished for anything else?
        - id: ch01-b163
          speaker: soldier
          text: A thousand times! I want a straight back, knees that grip a horse, a quick wrist, a sharp eye, and the strength inside a man. Ah, those good old days when I was strong!
        - id: ch01-b164
          speaker: lama
          text: That strength is weakness.
        - id: ch01-b165
          speaker: soldier
          text: It has become weakness now. Fifty years ago, I could have proved otherwise.
        - id: ch01-b166
          speaker: lama
          text: I know a River with great healing power.
        - id: ch01-b167
          speaker: soldier
          text: I drank Ganges water until I nearly swelled with it. It gave me nothing but sickness and no strength at all.
        - id: ch01-b168
          speaker: lama
          text: Mine is not the Ganges. My River washes away every stain of sin. When a man climbs the farther bank, he is free. I do not know your whole life, but your face is honorable and courteous. In that Black Year, when loyalty was hard, you stayed true to your path. Come now to the Middle Way, the path to Freedom. Hear the Most Excellent Law, and stop following dreams.
        - id: ch01-b169
          speaker: soldier
          text: Then speak, old man. At our age, we are all talkers.
        - id: ch01-b170
          speaker: narrator
          text: The lama sat beneath a mango tree while shifting leaves patterned his face with shadow. The soldier remained stiffly on his pony. Kim checked for snakes, then lay among the twisted roots. Small creatures buzzed in the hot sun. Doves cooed, and well wheels droned sleepily across the fields.
        - id: ch01-b171
          speaker: narrator
          text: The lama began slowly and solemnly. Ten minutes later, the soldier slipped from the pony, saying he could hear better on the ground, and sat with the reins looped around his wrist. Soon the lama's voice began to falter and the pauses between his sentences grew longer. Kim paid more attention to a gray squirrel, a small scolding bundle of fur pressed close to a branch. When the squirrel vanished, both teacher and listener were fast asleep. The old officer's strong, sharply cut head rested on his arm. The lama's head had fallen back against the tree trunk, where it looked like a piece of yellow ivory.
        - id: ch01-b172
          speaker: narrator
          text: A small naked child toddled up and stared at the sleepers. Moved by a sudden feeling of reverence, the child made a solemn bow before the lama. But the little body was so short and round that it toppled sideways before the bow was done. Kim burst out laughing at the chubby legs sprawling across the ground. The child, frightened by the fall and furious at the laughter, opened its mouth and screamed.
        - id: ch01-b173
          speaker: soldier
          text: Hai! What is it? What orders? Oh, it is only a child. Little one, do not cry. Did I fall asleep? That was very rude of me.
          emotion: surprised
        - id: ch01-b174
          speaker: child
          text: I am frightened! I am afraid!
          emotion: fearful
        - id: ch01-b175
          speaker: soldier
          text: Afraid of what? Two old men and a boy? How will you ever become a soldier, little prince?
        - id: ch01-b176
          speaker: narrator
          text: The lama woke too and clicked his rosary without directly looking at the child.
        - id: ch01-b177
          speaker: child
          text: What is that? I have never seen those things. Give them to me.
        - id: ch01-b178
          speaker: lama
          text: Ah! Here are cardamoms in my hand, and here is a lump of ghee. Here are millet, chilies, and rice, enough for your supper and mine.
        - id: ch01-b179
          speaker: narrator
          text: Smiling, the lama trailed a loop of beads across the grass. The child squealed with delight and grabbed at the dark, shining rosary.
        - id: ch01-b180
          speaker: soldier
          text: Where did you learn that song, you man who despises the world?
        - id: ch01-b181
          speaker: lama
          text: I learned it while sitting on a doorstep in Pathankot. It is good to be kind to little children.
        - id: ch01-b182
          speaker: soldier
          text: Before we fell asleep, you told me marriage and children darken the true light and block the Way. Do children fall from Heaven in your country? Does the Way teach you to sing to them?
        - id: ch01-b183
          speaker: lama
          text: No person is perfect. Run back to your mother now, little one.
        - id: ch01-b184
          speaker: soldier
          text: Listen to him, Kim! He is ashamed because he made a child happy. My brother, you might have been an excellent householder. Here, child, take this coin. Sweet things are always sweet.
        - id: ch01-b185
          speaker: narrator
          text: The child danced away into the sunlight.
        - id: ch01-b186
          speaker: soldier
          text: Children grow up and become men. Holy One, I am sorry I slept through your teaching. Forgive me.
        - id: ch01-b187
          speaker: lama
          text: We are two old men. The fault was mine. I listened to your talk of the world and its madness, and one fault led to another.
        - id: ch01-b188
          speaker: soldier
          text: What harm do your gods suffer when you play with a child? You sang well. Let us go on, and I will sing you the old song of Nikal Seyn before Delhi.
        - id: ch01-b189
          speaker: narrator
          text: They left the deep shade of the mango grove and went back into the sun. Across the open fields, the old man's thin, high voice carried far as he unfolded the Punjab song one long wail at a time. Kim was delighted by every verse, and the lama listened with deep interest.
        - id: ch01-b190
          speaker: soldier
          text: Ah, Nikal Seyn is dead! He died before Delhi! Lances of the North, take vengeance for Nikal Seyn!
        - id: ch01-b191
          speaker: narrator
          text: He sang to the end, beating out the trills with the flat of his sword against the pony. Kim praised him warmly, though the lama said little.
        - id: ch01-b192
          speaker: soldier
          text: Now we have reached the Big Road. I have not ridden here for years, but your boy's talk stirred me. Look, Holy One. This Great Road is the backbone of Hind. Four rows of trees shade most of it. Fast travelers take the hard road in the center. Before the railways, hundreds of Sahibs passed here. Now you mostly see country carts.
        - id: ch01-b193
          speaker: soldier
          text: The rough tracks on either side carry heavy loads of grain, cotton, timber, fodder, lime, and hides. A police station stands every few miles, so travelers are safe. The police are thieves and extortioners. I would patrol with cavalry, young recruits under a strong captain. Still, the police allow no rival thieves. Every caste and kind of person travels here.
        - id: ch01-b194
          speaker: soldier
          text: Look at them. Brahmins and leather workers, bankers and tinkers, barbers, traders, pilgrims, and potters. The whole world comes and goes. To me it is a river, and I am a log the flood left on its bank.
        - id: ch01-b195
          speaker: narrator
          text: The Grand Trunk Road truly was a wonder. It ran straight for fifteen hundred miles, carrying the traffic of India without crowding it. Nowhere else in the world flowed such a river of life. They stood looking down its green-arched length, where sunlight broke through the leaves in patches. Slow-moving people speckled the broad white surface. Directly opposite them stood a small police station with only two rooms.
        - id: ch01-b196
          speaker: policeman
          text: Who carries a weapon against the law? Are the police not enough to destroy evildoers?
        - id: ch01-b197
          speaker: soldier
          text: I bought the sword because of the police. Does all go well in Hind?
        - id: ch01-b198
          speaker: policeman
          text: Rissaldar Sahib, all goes well.
        - id: ch01-b199
          speaker: soldier
          text: I am an old tortoise. I put my head out from the bank, then draw it back again. Yes, this is the Road of Hindustan. Every man comes this way.
        - id: ch01-b200
          speaker: narrator
          text: A savage voice and the crack of a whip burst from a pillar of dust fifty yards away. A cart had broken down across the road.
        - id: ch01-b201
          speaker: soldier_son
          text: Son of a swine, was the soft roadside made for you to scratch your back on? Your whole shameless family has been cursed for seven generations! What fool told you to drag your carts across the road? If your wheel is broken, take a broken head to match and mend both at your leisure!
          emotion: angry
        - id: ch01-b202
          speaker: narrator
          text: A thin, high-bred Kathiawar mare shot out of the jam, her eyes and nostrils blazing. She snorted and flinched while her tall, gray-bearded rider seemed to sit as part of her body. He forced the almost frantic animal across the road after a shouting man and used his whip with careful skill whenever her plunges brought the victim within reach. The old soldier's face shone with pride. He tugged at his squat pony's reins, trying to bend its neck into an arch worthy of the meeting.
        - id: ch01-b203
          speaker: soldier
          text: My child!
          emotion: happy
        - id: ch01-b204
          speaker: carter
          text: Will he beat me in front of the police? Justice! I demand justice!
          emotion: angry
        - id: ch01-b205
          speaker: soldier_son
          text: Will a screaming ape block my way and spill ten thousand sacks under a young horse's nose? That is how a fine mare is ruined!
          emotion: angry
        - id: ch01-b206
          speaker: soldier
          text: He speaks the truth. And see how closely the mare follows his hand.
        - id: ch01-b207
          speaker: narrator
          text: The carter hid beneath his cart and shouted threats from there.
        - id: ch01-b208
          speaker: policeman
          text: Your sons are strong men.
        - id: ch01-b209
          speaker: narrator
          text: Calmly picking his teeth, the policeman watched the rider give one last vicious stroke, then canter toward them.
        - id: ch01-b210
          speaker: soldier_son
          text: My father!
          emotion: happy
        - id: ch01-b211
          speaker: narrator
          text: He pulled up ten yards away and dismounted. The old man sprang from his pony, and father and son embraced in the manner of the East.
