audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts: {delivery: "从容而机敏的讲述", timbre: "温暖清晰", pace: "舒展而有变化", pitch: "中音"}
    kim:
      display_name: 金
      tts: {delivery: "机灵大胆，话里常带笑", timbre: "明亮的少年声", pace: "轻快敏捷", pitch: "中高音"}
    lama:
      display_name: 喇嘛
      tts: {delivery: "慈和虔敬，偶有孩子般的急切", timbre: "苍老柔厚", pace: "缓慢沉思", pitch: "中低音"}
    farmer:
      display_name: 菜农
      tts: {delivery: "虚张声势，心里容易不安", timbre: "粗粝朴实", pace: "稍快", pitch: "中音"}
    headman:
      display_name: 村长
      tts: {delivery: "好客而稳重", timbre: "温厚苍老", pace: "徐缓", pitch: "低音"}
    priest:
      display_name: 村中祭司
      tts: {delivery: "圆滑精明，略带怀疑", timbre: "干涩沉着", pace: "从容", pitch: "中低音"}
    soldier:
      display_name: 老兵
      tts: {delivery: "豪迈自负，念旧时格外热烈", timbre: "低沉风霜", pace: "稳健有力", pitch: "低音"}
    villager:
      display_name: 村民
      tts: {delivery: "好奇而实在", timbre: "朴素明朗", pace: "平稳", pitch: "中音"}
    village_woman:
      display_name: 村中女人
      tts: {delivery: "焦急直率", timbre: "响亮质朴", pace: "稍快", pitch: "中高音"}
    child:
      display_name: 小娃娃
      tts: {delivery: "天真冲动，喜怒全写在声音里", timbre: "幼小清亮", pace: "轻快", pitch: "高音"}
    policeman:
      display_name: 警察
      tts: {delivery: "随和中带着官差派头", timbre: "宽厚结实", pace: "平稳", pitch: "中低音"}
    carter:
      display_name: 车夫
      tts: {delivery: "受了委屈，叫嚷不休", timbre: "粗哑紧绷", pace: "急促", pitch: "中高音"}
    soldier_son:
      display_name: 老兵的儿子
      tts: {delivery: "火爆威风，见父亲时亲热恭敬", timbre: "强健成熟", pace: "明快", pitch: "中低音"}
  chapters:
    - id: ch01
      title: 田野寻河
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: "众生留恋性命，一阶一阶挣扎向上。提婆达多当道的时候，暖风把他们的声音送到了镰仓。金和喇嘛身后，一个愤怒的菜农正挥着竹竿。他属于阿赖因种姓，靠种菜养花供应安巴拉城。这样的人，金一眼便认得出来。"
        - id: ch01-b02
          speaker: lama
          text: "我的弟子，你看这个人。他对陌生人无礼，说话暴躁，也没有慈悲心。你不要学他的样子。"
        - id: ch01-b03
          speaker: farmer
          text: "不要脸的叫花子！滚开，快滚出我的田！"
          emotion: angry
        - id: ch01-b04
          speaker: lama
          text: "我们走。我们这就离开这片没有福分的田地。"
        - id: ch01-b05
          speaker: kim
          text: "你的下一茬庄稼要是收不好，可别怪别人，只怪你这张嘴。"
        - id: ch01-b06
          speaker: narrator
          text: "菜农穿着拖鞋，不安地挪了挪脚。他的气势立刻矮下去一截，只说这些苦日子里，到处都有讨饭的人。"
        - id: ch01-b07
          speaker: kim
          text: "菜把式，你凭什么说我们要向你讨东西？我们只想看看田那边的河。"
        - id: ch01-b08
          speaker: farmer
          text: "河？你们从哪座城来的，连水渠都不认识？这水渠直得像箭，渠里的水贵得像银子。再往前才有一条河的支流。你们要是口渴，我能给水，也能给牛奶。"
        - id: ch01-b09
          speaker: lama
          text: "不用，我们去河边。"
        - id: ch01-b10
          speaker: farmer
          text: "那就喝牛奶，再吃一顿饭。我可不想给自己或庄稼招祸。只是叫花子太多了，我才会那样说。"
        - id: ch01-b11
          speaker: lama
          text: "金，你留心看。刚才愤怒的红雾遮住了他的眼睛，他才说出狠话。如今红雾散了，他又有礼又和善。愿他的田地蒙福。农人，你也不要急着论断别人。"
        - id: ch01-b12
          speaker: kim
          text: "换成别的圣人，早从你家灶台一路咒到牛棚了。现在知道他有多睿智、多神圣了吧？我是他的弟子。"
        - id: ch01-b13
          speaker: narrator
          text: "金把鼻子高高一翘，庄重地跨过窄窄的田埂。走了一阵，喇嘛忽然提醒他，走中道的人不该傲慢。"
        - id: ch01-b14
          speaker: kim
          text: "可你刚才还说他种姓低，又没礼貌。"
        - id: ch01-b15
          speaker: lama
          text: "我没说他种姓低。并不存在的东西，怎么能说高低？后来他不再无礼，我也忘了那次冒犯。他和我们一样困在万有之轮上，只是还没有踏上解脱之路。"
        - id: ch01-b16
          speaker: narrator
          text: "喇嘛在田间一道小水流前停住。岸上踩满了牲口的蹄印。金蹲进高甘蔗投下的阴影里，问老人怎样才能认出自己寻找的河。"
        - id: ch01-b17
          speaker: lama
          text: "等我找到它，启示自然会来。我觉得不是这里。小小的水流啊，你要是能告诉我，我的河流在哪里，该多好！不过，愿你滋养田地，让庄稼丰收。"
        - id: ch01-b18
          speaker: kim
          text: "快看！看那里！"
          emotion: fearful
        - id: ch01-b19
          speaker: narrator
          text: "金跳起来，一把拖开喇嘛。紫色茎秆沙沙作响，一道黄褐色的影子从中滑出。那是一条大眼镜蛇。它伸长脖子喝了水，随后伏在岸边，用没有眼睑的眼睛盯住他们。"
        - id: ch01-b20
          speaker: kim
          text: "我没带棍子！我去找一根，把它的脊梁打断。"
          emotion: fearful
        - id: ch01-b21
          speaker: lama
          text: "为什么要打它？它和我们一样在轮回里，一世升，一世降，离解脱还很远。一个灵魂必定造过大恶，才会落进这样的身体。"
        - id: ch01-b22
          speaker: kim
          text: "只要是蛇，我都恨。"
        - id: ch01-b23
          speaker: narrator
          text: "金再像本地孩子，也压不住白种人对蛇的恐惧。眼镜蛇盘起身子，嘶嘶吐气，颈后的兜帽张开了一半。"
        - id: ch01-b24
          speaker: lama
          text: "让它活完这一世吧。蛇兄弟，愿你早日解脱。你可知道，我寻找的河在哪里？"
        - id: ch01-b25
          speaker: kim
          text: "我真没见过你这样的人。难道连蛇也听得懂你的话？"
          emotion: surprised
        - id: ch01-b26
          speaker: lama
          text: "谁知道呢？"
        - id: ch01-b27
          speaker: narrator
          text: "喇嘛从昂起的蛇头前走过，近得不到一英尺。眼镜蛇却伏回蒙尘的身体上，一动没动。喇嘛回头叫金跟上。"
        - id: ch01-b28
          speaker: kim
          text: "我才不过去。我要绕着走。"
        - id: ch01-b29
          speaker: lama
          text: "过来吧，它不会伤你。"
        - id: ch01-b30
          speaker: narrator
          text: "金还在犹豫，喇嘛便吟了一段汉文经句。那声音听来像一道护身咒。金终于纵身越过水流，蛇果真没有一点反应。"
        - id: ch01-b31
          speaker: kim
          text: "世上真没有第二个你。好了，我们现在去哪儿？"
        - id: ch01-b32
          speaker: lama
          text: "你来决定吧。我年纪大，又离故乡太远。若不是火车的魔鼓还在我脑子里响，我本想坐车去贝拿勒斯。可坐车会让我们错过那条河。还是继续找别的水流吧。"
        - id: ch01-b33
          speaker: narrator
          text: "他们走了一整天。这一带的土地被人反复翻耕，一年能收三茬，有些地方甚至能收四茬。甘蔗、烟草、长长的白萝卜和球茎甘蓝，一片接着一片铺到远处。只要在田间看见一点水光，两人就马上离开道路，转过去仔细查看。正午时，村狗先被脚步惊醒，叫声又吵醒了沉睡的村庄。人们从门里窗里探出头，问题从四面飞来。喇嘛一次次停下，总是老老实实说出同一个回答。他们在找一条河，一条具有神奇疗愈之力的河。谁听过这样的水流？谁能告诉他们，它究竟在哪里？"
        - id: ch01-b34
          speaker: narrator
          text: "有些男人听完便笑，更多的人却耐心听到最后，再请他们到阴凉处坐下，端来牛奶和饭食。女人们一直待他们和善。孩子们也同各处的孩子一样，先害羞地躲在门边，只敢远远看着，过一会儿又大着胆子凑近，想听听这两个陌生旅人还会说些什么。"
    - id: ch02
      title: 村中的预言
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: "傍晚，两人在一座土墙土顶的小村歇脚。他们坐在村中大树下，牲口正慢吞吞地从牧地回来，女人们开始准备一天里的最后一顿饭。安巴拉城外密密的菜园已经留在身后，四周全是一望无际的青绿庄稼。白胡子村长待人和气，也很会招待远客。他亲手搬来绳床，请喇嘛坐下，又送上热腾腾的熟食，替老人装好烟管。村庙的晚间仪式结束后，他还叫人请来了祭司。金把大孩子们聚在身边，讲拉合尔有多大、多漂亮，讲火车旅行和城里的各种新鲜事。另一边，男人们慢悠悠地谈话，像自家的牛在反刍。喇嘛已经讲完寻找河流的缘由，正安静地拨着念珠。"
        - id: ch02-b02
          speaker: headman
          text: "他说的事，我怎么也想不明白。祭司，你听来是什么意思？"
        - id: ch02-b03
          speaker: priest
          text: "他是个寻求者。这片土地上，这种人多得很。上个月那个带乌龟的苦行僧，你还记得吧？"
        - id: ch02-b04
          speaker: headman
          text: "那人有正经理由。黑天神在异象里答应他，只要去普拉亚格，就不用上火葬柴堆，也能进天国。这个老人找的却不是我认识的任何一位神。"
        - id: ch02-b05
          speaker: priest
          text: "别为难他。他年纪大了，又从远方来，脑子也不清楚。圣人，你听我说。往西六英里，就是通往加尔各答的大路。"
        - id: ch02-b06
          speaker: lama
          text: "可是我要去贝拿勒斯。"
        - id: ch02-b07
          speaker: priest
          text: "那条路也去贝拿勒斯。它会跨过印度这一边的每一道水流。今晚先住下，明天上路。路过一条水，你就试一条。你那条河既然有神力，神力就该贯穿整条河，不会只留在一个水潭里。只要诸神许可，你一定能找到自由。"
        - id: ch02-b08
          speaker: lama
          text: "说得好。明天我们便走。你替这双老脚找到了近路，愿你蒙福。"
        - id: ch02-b09
          speaker: narrator
          text: "喇嘛说完，又用低沉悠长的汉语半吟半诵，为那句话收尾。连见多识广的祭司也听得肃然，村长却一时担心，自己是不是招来了一道邪咒。可谁只要再看一眼老人那张脸，看见那份淳朴和热切，便没法长久怀疑他。喇嘛觉得主人们以礼相待，自己也应当还以礼节。他郑重地把手伸进鼻烟葫芦，深深吸了一口，接着说起自己的弟子。"
        - id: ch02-b10
          speaker: lama
          text: "你们看见我的弟子了吗？"
        - id: ch02-b11
          speaker: headman
          text: "看得见，当然也听得见。"
        - id: ch02-b12
          speaker: narrator
          text: "村长朝火堆旁转了转眼睛。金正和一个蓝衣女孩说话，女孩不断往火里添着噼啪作响的荆棘。"
        - id: ch02-b13
          speaker: lama
          text: "他也在寻找。我要找河，他要找绿地上的红公牛。那头公牛有一天会给他荣耀。我看他不完全属于这个世界。他忽然被派到我身边，帮助我寻找。他的名字就是全世界的朋友。"
        - id: ch02-b14
          speaker: priest
          text: "喂，全世界的朋友！你到底是什么？"
        - id: ch02-b15
          speaker: kim
          text: "我是这位圣人的弟子。"
        - id: ch02-b16
          speaker: priest
          text: "他说你是个布特，是个精灵。"
        - id: ch02-b17
          speaker: kim
          text: "精灵吃不吃饭？反正我已经饿了。"
        - id: ch02-b18
          speaker: lama
          text: "这不是说笑。那座城里有个占星家，城名我一时想不起来了……"
        - id: ch02-b19
          speaker: kim
          text: "就是安巴拉。我们昨晚在那里睡过。"
        - id: ch02-b20
          speaker: lama
          text: "对，是安巴拉。他看过星盘，说我的弟子两天内就会找到想要的东西。全世界的朋友，他说那些星辰代表什么？"
        - id: ch02-b21
          speaker: narrator
          text: "金清清嗓子，打量着村里那一圈白胡子老人。"
        - id: ch02-b22
          speaker: kim
          text: "我的星辰代表战争。"
        - id: ch02-b23
          speaker: narrator
          text: "有人笑了。金衣衫破烂，小小一个人，却在大树下的砖台上挺直身子。别的本地孩子早就躺下了，他身体里的白人血统偏叫他站着说话。"
        - id: ch02-b24
          speaker: soldier
          text: "战争这个预言一定准。边境上从来不缺战争，这一点我知道。"
        - id: ch02-b25
          speaker: narrator
          text: "说话的是个干瘦老人。印度兵变那年，他在一支新建的骑兵团里当本地军官，为政府打过仗。政府在村里赏了他一块好田产。后来，他的儿子们也做了军官，如今胡子都白了。他们的种种花费让老人穷了不少，可他依旧是村里有分量的人。英国官员会特意离开大路来看他，连副专员也不例外。每逢这种日子，他便翻出古老年代的军服，穿戴整齐，在来客面前挺得笔直，像一根枪杆。"
        - id: ch02-b26
          speaker: kim
          text: "这次会是一场大战，要出动八千人。"
        - id: ch02-b27
          speaker: soldier
          text: "红衣兵，还是我们自己的兵团？"
        - id: ch02-b28
          speaker: kim
          text: "红衣兵，还有大炮。"
        - id: ch02-b29
          speaker: lama
          text: "可是那位占星家根本没有说过这些！"
          emotion: surprised
        - id: ch02-b30
          speaker: kim
          text: "他没说，我却知道。消息传给了我，因为我是圣人的弟子。八千红衣兵会从平迪和白沙瓦调来。这件事不会错。"
        - id: ch02-b31
          speaker: priest
          text: "孩子准是在集市上听见了闲话。"
        - id: ch02-b32
          speaker: lama
          text: "可他一直在我身边。他怎么会听到？连我也不知道。"
        - id: ch02-b33
          speaker: narrator
          text: "祭司低声对村长说，等喇嘛一死，金准能当个聪明的戏法师。他不明白孩子这回又在耍什么花招。老兵却猛地站直，用雷鸣般的声音要金拿出证据。他的几个儿子都在军中，若真有战争，他们一定会先告诉父亲。"
        - id: ch02-b34
          speaker: kim
          text: "等事情全准备好，你的儿子自然会知道。可你的儿子离那个真正下命令的人，还远得很呢。老人家，先由你给我一个证据。八千红衣兵和大炮，难道会听底下人的调遣？"
        - id: ch02-b35
          speaker: soldier
          text: "不会。"
        - id: ch02-b36
          speaker: kim
          text: "那你知不知道，下令的人是谁？"
        - id: ch02-b37
          speaker: soldier
          text: "我见过他。他还在炮兵部队当中尉时，我就认识了。"
        - id: ch02-b38
          speaker: kim
          text: "他个子高，头发黑，走路是不是这样？"
        - id: ch02-b39
          speaker: narrator
          text: "金把身子绷得僵直，像木头人一样走了几步。老兵承认很像，却说这样的姿态谁都可能见过。四周的人全屏住了气。"
        - id: ch02-b40
          speaker: kim
          text: "那我再说细些。他先这样走，想事情时，用食指从额头划到下巴旁边。过一会儿，他会抽动手指，再把帽子夹到左胳膊下面。"
        - id: ch02-b41
          speaker: narrator
          text: "金一个动作一个动作地演，最后像只鹳似的站定。老兵惊得呻吟一声，周围的人也跟着打了个寒战。"
        - id: ch02-b42
          speaker: soldier
          text: "对，就是这样！那他要下命令时呢？"
          emotion: surprised
        - id: ch02-b43
          speaker: kim
          text: "他先揉一揉后颈，然后把一根手指落在桌上，鼻子里轻轻哼一声。接着他说，放某某团出去，把某某炮队调来。"
        - id: ch02-b44
          speaker: narrator
          text: "老兵硬挺挺地起身敬礼。金又把自己在安巴拉更衣室外听到的关键话，换成本地语言讲出来。"
        - id: ch02-b45
          speaker: kim
          text: "他说，这事早就该办。这不是战争，是惩罚。说完，他还会这样哼一声。"
        - id: ch02-b46
          speaker: soldier
          text: "够了，我信你。我在战场的烟里见过他这样，也听过他这样说话。一定是他！"
        - id: ch02-b47
          speaker: kim
          text: "我看见的不是烟，而是黑暗。先有一个人来，把事情说明白。随后来了骑兵。最后，他站在一圈光里。余下的一切，就和我刚才讲的一样。老人家，我说的可是真话？"
        - id: ch02-b48
          speaker: soldier
          text: "是真话。绝对是他。"
        - id: ch02-b49
          speaker: narrator
          text: "人群颤巍巍地吸了一口长气。他们一会儿看仍在立正的老兵，一会儿看暮色中那个衣衫破烂的孩子。"
        - id: ch02-b50
          speaker: lama
          text: "我早说过，他来自另一个世界！他不只是全世界的朋友，还是星辰的朋友！"
          emotion: happy
        - id: ch02-b51
          speaker: villager
          text: "不过这场战争和我们没关系。小预言家，我家有头带红斑的母牛，也许还是你那头公牛的姐妹。你的本事要是随时都灵……"
        - id: ch02-b52
          speaker: kim
          text: "是不是姐妹，我都不在乎。我的星辰不管你家的牛。"
        - id: ch02-b53
          speaker: village_woman
          text: "别这么说，那头母牛病得很重。我男人像头笨水牛，才会说错话。你告诉我，她能不能好？"
        - id: ch02-b54
          speaker: narrator
          text: "普通孩子多半会把预言家的戏接着演下去。可金在拉合尔生活了十三年，还熟悉塔克萨利门边的苦行僧。他太懂人心了。祭司正从眼角看他，嘴边带着一道又干又冷的笑。"
        - id: ch02-b55
          speaker: kim
          text: "这个村没有祭司吗？奇怪，我刚才明明看见一位很了不起的祭司。"
        - id: ch02-b56
          speaker: village_woman
          text: "有是有，可是……"
        - id: ch02-b57
          speaker: kim
          text: "可是你和丈夫只肯拿几句谢话，就想把母牛治好。欺骗神庙可不对。送一头小牛给你们的祭司。只要诸神还没气到不肯回头，那头母牛一个月内就会重新产奶。"
        - id: ch02-b58
          speaker: narrator
          text: "金的话正中要害。这对夫妇在村里出了名的小气。那头牛能不能好，已经不再是金的责任。该得供养的村中祭司，也不会再用冷眼拆穿这个小预言家。祭司听完，终于露出赞许。"
        - id: ch02-b59
          speaker: priest
          text: "你真是个讨饭的行家。干四十年的人，也未必能做得更漂亮。你一定叫那个老人发了财吧？"
        - id: ch02-b60
          speaker: kim
          text: "一点面粉，一点黄油，再加一小口豆蔻，这也叫发财？你也看得出，他疯得很。不过我还没学会认路，暂时跟着他有用。"
        - id: ch02-b61
          speaker: narrator
          text: "金受到夸奖，脸都红了，口气却依旧谨慎。他把塔克萨利门外那些苦行僧的弟子学得活灵活现，连他们私下说话时的下流腔调也不差。"
        - id: ch02-b62
          speaker: priest
          text: "那么，他找河究竟是真的，还是另有目的？也许他在寻宝。"
        - id: ch02-b63
          speaker: kim
          text: "他只是疯，疯得厉害。没有别的。"
        - id: ch02-b64
          speaker: narrator
          text: "老兵这时摇摇晃晃走来，请金去自己那里住一夜。祭司也劝他答应，却坚持款待喇嘛的荣耀必须归村庙所有。喇嘛听了只是天真地笑，根本没看出两个人为何争抢。金来回看看他们的脸，已经明白了各人的算盘。他把喇嘛叫到黑暗里，压低声音问钱放在哪里。"
        - id: ch02-b65
          speaker: lama
          text: "在我怀里。不然还能放在哪里？"
        - id: ch02-b66
          speaker: kim
          text: "快把钱给我，别让人看见。"
        - id: ch02-b67
          speaker: lama
          text: "为什么？这里又没有车票要买。"
        - id: ch02-b68
          speaker: kim
          text: "我是不是你的弟子？一路上是不是我照顾你这双老脚？钱交给我，天亮我就还你。"
        - id: ch02-b69
          speaker: narrator
          text: "金伸手到喇嘛腰带上方，取走钱袋。老人点点头，只感叹这世界又广大，又可怕，自己从不知道世上有这么多人。第二天一早，祭司的脸色坏得很，喇嘛却心满意足。金则度过了一个极有意思的夜晚。老兵取出骑兵刀，横放在干瘦的膝盖上，讲印度兵变时的旧事，又讲那些年轻的上尉。那些人早已死去三十年，在他的故事里却又骑着马回来了。老兵一直讲，直到金沉沉睡去。"
    - id: ch03
      title: 老兵同行
      blocks:
        - id: ch03-b01
          speaker: lama
          text: "这里的空气真好。老人都睡得浅，我也一样，可昨晚我一觉睡到天亮。现在身子还沉着。"
        - id: ch03-b02
          speaker: kim
          text: "喝碗热牛奶吧。该重新上路了。"
        - id: ch03-b03
          speaker: narrator
          text: "金认识不少抽鸦片的人，也替他们送过这种醒神的东西。喇嘛听见上路，精神便振作起来。"
        - id: ch03-b04
          speaker: lama
          text: "好，我们去走那条跨过印度所有河流的长路。只是这里的人待我们这样好，尤其那位祭司，我们该怎么报答？他们崇拜偶像，可来世也许能觉悟。不如给神庙一卢比。里面虽只有石头和红漆，只要人心是善的，我们就应当承认。"
        - id: ch03-b05
          speaker: kim
          text: "圣人，你以前独自走过这样的路吗？"
        - id: ch03-b06
          speaker: lama
          text: "当然走过。从库卢到帕坦科特。我的第一个弟子就在那一带死去。别人善待我们，我们就奉上供养。那时走遍群山，人人都很和善。"
        - id: ch03-b07
          speaker: kim
          text: "印度不是那样。这里的神长着许多手臂，心肠也坏。还是别管他们。"
        - id: ch03-b08
          speaker: soldier
          text: "全世界的朋友，我送你和黄衣人走一程。昨夜的谈话，把我干枯心里的记忆全冲开了，对我就像一场祝福。我闻得到，战争已经进了空气。看，我连剑也带来了。"
        - id: ch03-b09
          speaker: narrator
          text: "老兵骑着一匹后腿弯曲、走路颠簸的小马，从朦胧晨色里过来。他两条长腿垂在马腹旁，大剑挂在腰间，一手按着剑柄，目光越过平原，直指北方。"
        - id: ch03-b10
          speaker: soldier
          text: "再讲一遍，那个人怎样在异象里出现。坐到我身后来，这小马驮得动我们两个。"
        - id: ch03-b11
          speaker: kim
          text: "我是这位圣人的弟子。"
        - id: ch03-b12
          speaker: narrator
          text: "他们出了村门。村人站在清晨的阴影里目送，好像都有点舍不得。只有祭司远远告别，声音又冷又淡。他昨夜原想用鸦片换得喇嘛的钱，结果却白白把好东西用在了一个身无分文的人身上。"
        - id: ch03-b13
          speaker: soldier
          text: "这话说得好。我不常接近圣人，可尊重总是好事。现在的人都不懂尊重，就连专员老爷来看我，也不例外。不过，你的星辰既然带你去打仗，为什么还要跟着圣人？"
        - id: ch03-b14
          speaker: kim
          text: "因为他真是圣人。他心里想的、嘴上说的、亲手做的，全都神圣。他不像别的人。我从没见过这样的人。我们不是算命的，不是耍戏法的，也不是叫花子。"
        - id: ch03-b15
          speaker: soldier
          text: "我看得出你不是。那个老人，我还说不准。不过，他走路倒很有力。"
        - id: ch03-b16
          speaker: narrator
          text: "清晨的凉意让喇嘛步履轻快，他迈开骆驼般修长而从容的步子，沉在自己的冥想中，念珠在手里机械地咔嗒作响。乡间道路磨损得很深，车辙一道压着一道，在平原上弯弯曲曲，穿过一片又一片墨绿的芒果林。东方远处，喜马拉雅积雪的轮廓淡淡浮在天边。整个印度都已经在田间劳作。水车吱呀转动，扶犁人跟在牲口后高声吆喝，乌鸦在头顶鼓噪不休。清晨仿佛给一切都添了力气，就连老兵胯下的小马也有了好兴致。金把手搭上马镫皮带时，它几乎小跑起来。"
        - id: ch03-b17
          speaker: lama
          text: "我还是后悔，没有给那座神龛留下一卢比。"
        - id: ch03-b18
          speaker: narrator
          text: "喇嘛拨完第八十一颗念珠，才听见老兵在胡须里咕哝，也才第一次真正注意到同行的人。"
        - id: ch03-b19
          speaker: lama
          text: "你也在寻找那条河吗？"
        - id: ch03-b20
          speaker: soldier
          text: "一天才刚开始，除了日落前给马喝水，还要河做什么？我是来给你指一条通往大路的近道。"
        - id: ch03-b21
          speaker: lama
          text: "好心人，这份情意我会记住。可你为什么带剑？"
        - id: ch03-b22
          speaker: narrator
          text: "老兵一下窘得像个玩假扮游戏，却被人撞破的孩子。他低头摸索着剑，承认这不过是老人偶然生出的念想。照警察的命令，印度各地本来都不许有人带武器。他说到这里还有些心虚，随即又拍拍剑柄，重新神气起来，因为附近所有警察都认得他，谁也不会真的来收这把旧剑。"
        - id: ch03-b23
          speaker: lama
          text: "这念想不好。杀人能得到什么？"
        - id: ch03-b24
          speaker: soldier
          text: "所得很少，我自己知道。可要是不时杀掉几个恶人，这世界对手无寸铁的梦想家就不会这么安稳。我亲眼见过，从德里向南，整片土地都泡在血里。"
        - id: ch03-b25
          speaker: lama
          text: "那是什么样的疯狂？"
        - id: ch03-b26
          speaker: soldier
          text: "只有降下灾祸的诸神知道。军队全发了狂，反过来攻击长官。这已经是恶事，可他们若就此收手，还有挽回的余地。偏偏他们又杀英国人的妻子和孩子。于是英国人渡海而来，把每笔账都算得极严。"
        - id: ch03-b27
          speaker: lama
          text: "很久以前，我仿佛听过这样的传闻。那一年，好像叫黑暗之年。"
        - id: ch03-b28
          speaker: soldier
          text: "那一年你都不知道，还只说是传闻？全世界都知道，全世界都吓得发抖！"
        - id: ch03-b29
          speaker: lama
          text: "我们的世界只震动过一次，就是世尊得到觉悟的那一天。"
        - id: ch03-b30
          speaker: soldier
          text: "我至少亲眼看见德里震动了。德里可是世界的肚脐。"
        - id: ch03-b31
          speaker: lama
          text: "他们真的对女人和孩子下手？那是恶行，谁也逃不过惩罚。"
        - id: ch03-b32
          speaker: soldier
          text: "许多人想逃避，可没有用。我当时在骑兵团里，整个团叛变了。六百八十把马刀，只有三个人忠于吃下的盐粮，我就是其中一个。"
        - id: ch03-b33
          speaker: lama
          text: "那是很大的功德。"
        - id: ch03-b34
          speaker: soldier
          text: "功德？那时谁会这样想！族人、朋友、弟兄全离开我。他们说英国人的气数已尽，大家该去抢一块田。我却见过索布拉翁、奇利安瓦拉、穆德基和费罗兹沙的战士，知道风向还会转。我劝他们住手，这样做没有福分。"
        - id: ch03-b35
          speaker: soldier
          text: "后来，我让一个英国太太抱着婴儿坐在鞍桥上，一口气送了七十英里。那匹马才真正配得上男子汉！把母子送到安全处，我又去找五名长官中唯一活着的一个。我说，自己已被族人抛弃，堂兄的血还湿在刀上，请他给我事情做。他叫我安心，说前面有许多大事。等疯狂过去，自会有报偿。"
        - id: ch03-b36
          speaker: lama
          text: "疯狂结束以后，的确会有报偿吧？"
        - id: ch03-b37
          speaker: soldier
          text: "那年月，可不是谁偶然听见一声炮响，就能往身上挂勋章。我亲自打过十九场堂堂正正的会战，又参加过四十六场骑兵遭遇战，至于没有名目的小仗，更是多得数不清。我身上留下九处伤。这些仗给我换来一枚勋章、四枚勋扣，还有一枚勋位章。每一样都不是白得的。"
        - id: ch03-b38
          speaker: soldier
          text: "从前带过我的上尉后来都做了将军。印度女皇登基五十年，举国庆祝时，他们仍没有忘记我，还特意说，该把英属印度勋章授给这个老骑兵。我如今就把它挂在颈上。国家又亲手赏我一块贾吉尔田产，不收代价，让我和子孙一直保有。旧日那些人如今成了专员，仍会骑着高头大马穿过庄稼来看我。他们故意坐得高高的，让全村人都看见是谁来探望我。我们坐下谈从前的仗，一个死人的名字，又会牵出另一个死人的名字。"
        - id: ch03-b39
          speaker: lama
          text: "他们走后呢？"
        - id: ch03-b40
          speaker: soldier
          text: "当然走了，不过要等全村看清以后。"
        - id: ch03-b41
          speaker: lama
          text: "到最后，你会做什么？"
        - id: ch03-b42
          speaker: soldier
          text: "到最后，我会死。"
        - id: ch03-b43
          speaker: lama
          text: "死后呢？"
        - id: ch03-b44
          speaker: soldier
          text: "让诸神安排。我从不拿祈祷纠缠他们，他们也不会来烦我。我活了这么久，早看明白了。那些总向天上哭诉、告状、吼叫的人，很快就会被叫走，像我们上校叫走嘴松话多的南方人一样。"
        - id: ch03-b45
          speaker: soldier
          text: "我从没让诸神厌烦。他们会记得，给我一块阴凉清静的地方。我把长矛插在那里，等三个儿子来。三个儿子全是骑兵少校，又分别在三个兵团里。"
        - id: ch03-b46
          speaker: lama
          text: "他们也被轮回束缚，从这一世走向下一世，从一种绝望走向另一种绝望，焦躁着，争抢着。"
        - id: ch03-b47
          speaker: soldier
          text: "没错，三个骑兵少校。他们有点爱赌，我也一样。好军官总得骑好马。现在又不能像过去抢女人那样去抢马，只能让我的田产付钱。田里水倒充足，可管事的人都骗我。除了拿长矛逼着他们，我不会问话。我一发火就骂，他们当面装悔过，背后却叫我没牙的老猿猴。"
        - id: ch03-b48
          speaker: lama
          text: "除此以外，你就没有别的愿望？"
        - id: ch03-b49
          speaker: soldier
          text: "有过，一千次！我想再有挺直的腰背，紧贴马身的膝盖，灵活的手腕，锐利的眼睛，还有让人成为男子汉的骨髓。哦，从前那些有力气的好日子！"
        - id: ch03-b50
          speaker: lama
          text: "你怀念的力量，其实就是软弱。"
        - id: ch03-b51
          speaker: soldier
          text: "现在它确实弱了。可在五十年前，我能证明它是力量。"
        - id: ch03-b52
          speaker: narrator
          text: "老兵用马镫的边缘踢了一下小马干瘦的肋腹。喇嘛告诉他，世上还有一条拥有伟大疗愈之力的河。"
        - id: ch03-b53
          speaker: soldier
          text: "我喝恒河水喝到快要水肿。它只让我拉肚子，一点力气也没给我。"
        - id: ch03-b54
          speaker: lama
          text: "我说的不是恒河。那条河能洗去所有罪垢，登上彼岸的人必得自由。我不了解你的一生，可你有一张诚实有礼的脸。黑暗之年，你在最难忠诚的时候仍守住自己的道路。如今走上中道吧，那是自由的路。听闻无上正法，不要再追逐梦幻。"
        - id: ch03-b55
          speaker: soldier
          text: "那就讲吧，老人家。到了我们这个年纪，人人都爱唠叨。"
        - id: ch03-b56
          speaker: narrator
          text: "喇嘛盘膝坐进芒果树荫，枝叶筛下的影子像棋盘一样落在他脸上。老兵仍笔直骑在马上。金先仔细看了看四周，确认附近没有蛇，才躺进盘结树根形成的凹处。热烘烘的阳光里，小虫发出昏昏欲睡的嗡鸣，鸽子低声咕咕，田野那头的水车也懒洋洋地转着。喇嘛缓慢而庄重地开讲。十分钟后，老兵说下马坐近一点才能听得更清楚，于是从鞍上滑下来，把缰绳绕在手腕上。时间一点点过去，喇嘛的声音开始迟缓，完整的句子越拖越长，最后几乎和四周的嗡鸣融在一起。"
        - id: ch03-b57
          speaker: narrator
          text: "金没认真听讲，他正盯着一只灰松鼠。那团爱吵闹的小毛球紧贴树枝，嘴里还在责骂什么，忽然一下不见了。等金回过神，讲道的人和听道的人都已睡着。老军官轮廓分明的头枕在臂上，喇嘛仰靠树干，昂起的脑袋像一块黄色象牙。一个光屁股的小娃娃蹒跚走近，站在那里仔细看他们。不知什么念头让他忽然生出敬意，他恭恭敬敬地向喇嘛行了个礼。可他实在又矮又胖，身子一歪便倒在地上。金见那双肉乎乎的小腿四处乱蹬，忍不住笑了。孩子听见笑声，又怕又气，立刻放声大哭。"
        - id: ch03-b58
          speaker: soldier
          text: "嗨！出了什么事？有什么命令？原来只是个孩子！小家伙，别哭。我竟然睡着了吗？这可太失礼了。"
          emotion: surprised
        - id: ch03-b59
          speaker: child
          text: "我怕！我害怕！"
          emotion: fearful
        - id: ch03-b60
          speaker: soldier
          text: "两个老头加一个男孩，有什么好怕？小王子，你这样以后怎么当兵？"
        - id: ch03-b61
          speaker: narrator
          text: "喇嘛也醒了。他不去正眼看孩子，只让念珠在指间咔嗒作响。孩子哭到一半，忽然停下来。"
        - id: ch03-b62
          speaker: child
          text: "那是什么？我从来没见过。给我！"
        - id: ch03-b63
          speaker: narrator
          text: "喇嘛笑着，把一圈念珠垂到草地上，又给孩子唱起一支短歌。"
        - id: ch03-b64
          speaker: lama
          text: "这是一把小豆蔻，这是一块香酥油。小米辣椒白米饭，你我晚餐吃个够！"
        - id: ch03-b65
          speaker: narrator
          text: "孩子欢喜得尖叫，伸手抓向乌黑发亮的珠子。"
        - id: ch03-b66
          speaker: soldier
          text: "蔑视尘世的人，你从哪儿学来这首歌？"
        - id: ch03-b67
          speaker: lama
          text: "在帕坦科特学的。那时我坐在一户人家的门阶上。善待小娃娃，总是好的。"
        - id: ch03-b68
          speaker: soldier
          text: "睡着以前，你还说婚姻和生育会遮住真光，是路上的绊脚石。难道你们那里的孩子都从天上掉下来？给孩子唱歌也是你说的那条路？"
        - id: ch03-b69
          speaker: lama
          text: "谁也不可能十全十美。小家伙，回你母亲那里去吧。"
        - id: ch03-b70
          speaker: soldier
          text: "听听，他让孩子高兴了，自己反倒害臊。兄弟，你本来能做个很好的居家人，可惜错过了。孩子，拿着这枚派萨。甜食总是甜的。"
        - id: ch03-b71
          speaker: narrator
          text: "孩子蹦蹦跳跳跑进阳光里。老兵望着他，说孩子总会长成大人，接着为自己在讲道中睡着向喇嘛道歉。"
        - id: ch03-b72
          speaker: lama
          text: "我们都是老人，错在我。先听你谈尘世和尘世的疯狂，一个过错便引出了下一个。"
        - id: ch03-b73
          speaker: soldier
          text: "陪孩子玩一会儿，诸神会受什么损害？何况歌也唱得好。继续走吧。我来唱德里城前尼卡尔·塞恩的老歌给你听。"
        - id: ch03-b74
          speaker: narrator
          text: "他们重新上路，走出芒果林的暗影。老人骑在小马上，尖细的歌声越过田野，一声一声拖出悠长的哀调，慢慢展开完整的故事。他唱的是尼卡尔·塞恩，也就是尼科尔森在德里城前的故事。直到如今，旁遮普人还会唱这支歌。那旋律既古老又悲壮，仿佛把旧日战场也带到了眼前。金听得满心欢喜，喇嘛则一路专心倾听，没有漏过一句。"
        - id: ch03-b75
          speaker: soldier
          text: "哀哉，尼卡尔·塞恩死了，他死在德里城前！北方的长矛啊，替尼卡尔·塞恩复仇！"
        - id: ch03-b76
          speaker: narrator
          text: "老兵颤声唱到结尾，还用马刀的刀面拍着小马臀部，为歌里的花腔打节拍。金大声称赞，喇嘛却一直沉默。"
    - id: ch04
      title: 印度大路
      blocks:
        - id: ch04-b01
          speaker: soldier
          text: "我们到了。这就是大路，全印度的脊梁。你的话搅动了我的心，我已经很久没骑马来这里了。你看，道路两边各有两行树。中间铺得坚硬，给走得快的车用。火车出现以前，成百上千的英国人从这里来往，如今只剩乡下大车之类。"
        - id: ch04-b02
          speaker: soldier
          text: "左右两边的土路给重车走，运粮、棉花、木材、饲料、石灰和兽皮。这里还算安全，每隔几科斯就有警察所。警察都是贼，也会敲诈人。要是让我管，我会派骑兵巡逻，叫一个强硬的上尉带新兵。不过警察至少不让别的贼抢生意。所有种姓、所有人，都从这里经过。"
        - id: ch04-b03
          speaker: soldier
          text: "看那些婆罗门和贱民，银行家和补锅匠，理发匠和商贩，朝圣者和陶工。整个世界都在来来去去。这条路在我眼里像条河，我却像洪水后被捞上岸的一根木头，再也不在河里了。"
        - id: ch04-b04
          speaker: narrator
          text: "大干道的确是一幅世上少有的奇景。它笔直伸展一千五百英里，承载全印度的车马人流，却一点也不拥塞。没有别处能看见这样的生命之河。树木在道路上方合成绿色拱顶，阳光从叶缝落下，给长路铺满斑驳碎影。宽阔的白色路面上，行人缓缓移动，一个个身影仿佛水面漂过的浮叶。金、喇嘛和老兵站在那里，看着这条路，也看着对面那座只有两间屋子的警察所。"
        - id: ch04-b05
          speaker: policeman
          text: "谁敢违法带兵器？有我们警察在，还不够对付恶人吗？"
        - id: ch04-b06
          speaker: soldier
          text: "正因为有你们警察，我才买这把剑。印度各处都平安吗？"
        - id: ch04-b07
          speaker: policeman
          text: "骑兵老爷，处处平安。"
        - id: ch04-b08
          speaker: soldier
          text: "你瞧，我像一只岸边的老乌龟，探出头看一眼，又缩回去。是啊，这就是印度斯坦的大路。所有人都会走到这里……"
        - id: ch04-b09
          speaker: soldier_son
          text: "猪崽子！路边的软土是给你蹭背的吗？你这所有淫荡女儿的爹，一万个无德女人的丈夫！你娘听她娘的话，竟去跟魔鬼私通。你家姑姨七代都没长鼻子！是哪只蠢猫头鹰叫你把车横在路上？车轮破了？那我再打破你的脑袋，留着慢慢配成一对！"
          emotion: angry
        - id: ch04-b10
          speaker: narrator
          text: "五十码外，一辆大车坏在路中，堵住了来往车马。尘土高高扬起，恶狠狠的骂声和连续的鞭响从尘柱里一齐冲出。一匹瘦削的卡提阿瓦母马突然从车阵中猛射出来，眼睛和鼻孔像在冒火。它喷着气，受惊似的连连躲闪。骑手却稳稳压住马身，催它横穿道路，追打一名叫喊着逃跑的人。那骑手身材高大，胡须已经灰白，身体仿佛和这匹快发疯的马长在一起。母马每次腾跃，他都算得极准，趁着起伏把鞭子送出去，一次次抽中目标。"
        - id: ch04-b11
          speaker: narrator
          text: "老兵的脸一下亮了。他只说那是自己的儿子，随即收紧缰绳，想叫胯下这匹小马也把脖颈弯得像样一点。"
        - id: ch04-b12
          speaker: carter
          text: "警察就在这里，你还敢打我？我要讨公道！"
          emotion: angry
        - id: ch04-b13
          speaker: soldier_son
          text: "你这吼叫的猿猴挡住道路，把一万只袋子掀翻在小母马眼前，我还不能打？这样会毁掉一匹好马！"
          emotion: angry
        - id: ch04-b14
          speaker: soldier
          text: "他说得对。不过，那匹母马真是紧紧跟着骑手。"
        - id: ch04-b15
          speaker: narrator
          text: "车夫钻到自己的车轮下面，拿车身作挡箭牌，躲在那里大声发誓，说迟早要报各种各样的仇。警察却安安稳稳剔着牙，仿佛眼前的追打一向合情合理，只慢悠悠地说老兵的儿子个个都是壮汉。骑手追到近处，又狠狠补上最后一鞭，这才收住怒气，催马小跑过来。"
        - id: ch04-b16
          speaker: soldier_son
          text: "父亲！"
          emotion: surprised
        - id: ch04-b17
          speaker: narrator
          text: "骑手在十码外猛地勒住马，随即翻身落地。老人也在一瞬间跳下自己的小马，动作快得完全不像刚才那个衰老的人。父亲和儿子迎面走近，紧紧拥抱，用东方人的方式迎接彼此。"
