audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts: {delivery: "从容而机敏的讲述", timbre: "温暖清晰", pace: "舒展而有变化", pitch: "中音"}
    kim:
      display_name: 金
      tts: {delivery: "机灵大胆，话里常带笑", timbre: "明亮的少年声", pace: "轻快敏捷", pitch: "中高音"}
    lama:
      display_name: 喇嘛
      tts: {delivery: "慈和虔敬，偶有孩子般的急切", timbre: "苍老柔厚", pace: "缓慢沉思", pitch: "中低音"}
    hill_servant:
      display_name: 山民随从
      tts: {delivery: "粗直强硬，敬畏圣人", timbre: "粗厚有力", pace: "稍快", pitch: "中低音"}
    oriya_servant:
      display_name: 奥里亚随从
      tts: {delivery: "世故刻薄，爱在一旁嘀咕", timbre: "干瘦低哑", pace: "平稳", pitch: "中音"}
    widow:
      display_name: 山地王公遗孀
      tts: {delivery: "泼辣威严，机锋里带着爽朗", timbre: "尖亮苍老", pace: "明快多变", pitch: "中高音"}
    advance_soldier_1:
      display_name: 先遣兵甲
      tts: {delivery: "粗声粗气，办事利落", timbre: "结实低沉", pace: "明快", pitch: "中低音"}
    advance_soldier_2:
      display_name: 先遣兵乙
      tts: {delivery: "干练直接，带着行军疲态", timbre: "粗厚", pace: "平稳", pitch: "中低音"}
    bennett:
      display_name: 贝内特牧师
      tts: {delivery: "严厉拘谨，话语果断", timbre: "清瘦坚硬", pace: "稍快", pitch: "中音"}
    victor:
      display_name: 维克托神父
      tts: {delivery: "爽直机敏，惊叹时仍带温厚", timbre: "圆润厚实", pace: "从容", pitch: "中低音"}
    colonel:
      display_name: 上校
      tts: {delivery: "威严中带着疲倦的幽默", timbre: "沉稳浑厚", pace: "平稳", pitch: "低音"}
    sergeant:
      display_name: 中士
      tts: {delivery: "粗豪健谈，命令干脆", timbre: "厚重沙哑", pace: "明快", pitch: "中低音"}
    officer_1:
      display_name: 军官甲
      tts: {delivery: "行伍气十足，兴致高昂", timbre: "洪亮", pace: "明快", pitch: "中低音"}
    officer_2:
      display_name: 军官乙
      tts: {delivery: "爽朗随和", timbre: "清亮结实", pace: "明快", pitch: "中音"}
    officer_3:
      display_name: 军官丙
      tts: {delivery: "豪放热烈", timbre: "粗厚", pace: "稍快", pitch: "中低音"}
    officer_4:
      display_name: 军官丁
      tts: {delivery: "年轻快活", timbre: "明亮", pace: "稍快", pitch: "中音"}
  chapters:
    - id: ch01
      title: 第五章
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: "《浪子回头》唱道，我又回到同类中，吃饱了，获赦了，也有人认我。骨肉至亲领我回家，我又是血肉相连的一家人。肥牛犊已经宰好，可我还贪恋从前的豆荚。想来想去，还是猪儿最合心意，我这就重回猪圈。"
        - id: ch01-b02
          speaker: narrator
          text: "那支懒洋洋的队伍又上路了。人们用绳索彼此串着，拖着脚走。老妇一路睡到下一处歇脚站。当天路短，离日落还剩一个钟头，金便四处找乐子。"
        - id: ch01-b03
          speaker: hill_servant
          text: "为什么不坐下来歇着？只有魔鬼和英国人才会没来由地走来走去。"
        - id: ch01-b04
          speaker: oriya_servant
          text: "可别跟魔鬼、猴子或男孩子交朋友。谁知道他们下一步又会做什么。"
        - id: ch01-b05
          speaker: narrator
          text: "金轻蔑地背过身。他不想再听那个老故事，说魔鬼怎样同男孩玩，后来又怎样后悔，整天无事可做，只好在乡间游荡。喇嘛迈着大步跟在后面。这一天，每逢水流，他都离开道路去查看，却始终没有得到启示，证明那就是他寻找的河。有人同他讲明白话，又有一位高贵的女人把他当作精神导师，敬重得恰到好处。这些舒适让他暂时少想了一点寻求。反正他早已准备花宁静的岁月慢慢找下去。他没有白人的急躁，心里的信念却很深。"
        - id: ch01-b06
          speaker: lama
          text: "你这是要去哪里？"
        - id: ch01-b07
          speaker: kim
          text: "哪里也不去。今天才走了这么一点路，这四周的东西，我又全都没见过。"
        - id: ch01-b08
          speaker: lama
          text: "她自然是一位贤明而有见识的女人。只是有她在旁边，我很难静心冥想，因为……"
        - id: ch01-b09
          speaker: kim
          text: "女人都是这样。"
        - id: ch01-b10
          speaker: narrator
          text: "金说得像所罗门王一样老练。喇嘛把磨旧的念珠挽起来，声音也低了下去。"
        - id: ch01-b11
          speaker: lama
          text: "寺院前有一座宽阔的石台。我拿着这串念珠，在上面来回走。直到今天，石台上还留着我的脚印。"
        - id: ch01-b12
          speaker: narrator
          text: "念珠响了起来。喇嘛虔敬地念着唵嘛呢叭咪吽，心里感激此处清凉、安静，也没有尘土。平原上的东西一样接一样，牵住金那双闲不住的眼睛。他只因附近茅屋的样式新鲜，就漫无目的地四处探看。"
        - id: ch01-b13
          speaker: narrator
          text: "两人来到一大片牧场。午后阳光下，草地泛着褐色和紫色，中间密密长着一丛芒果树。这么合宜的地方却没有神龛，金觉得奇怪。他对这些事看得同祭司一样仔细。平原远处有四个人并肩走来，小得几乎看不清。金把手弯在眉上，使劲望去，忽然捕捉到一点黄铜的闪光。"
        - id: ch01-b14
          speaker: kim
          text: "是士兵，白人士兵！我们去瞧瞧。"
        - id: ch01-b15
          speaker: lama
          text: "我们每次单独出来，总会遇到士兵。不过白人士兵，我还没见过。"
        - id: ch01-b16
          speaker: kim
          text: "只要没喝醉，他们不会伤人。藏到这棵树后面。"
        - id: ch01-b17
          speaker: narrator
          text: "他们钻进芒果林，在密密的树干后躲进清凉暗影。四个人里有两个停下，另两个迟疑着走近。他们是行军兵团的先遣队，照例先来划营地。两人扛着五英尺长的旗杆，边分开走过平地，边向彼此呼喊。最后，他们踏着沉重的脚步进了树林。"
        - id: ch01-b18
          speaker: advance_soldier_1
          text: "就是这里，或者就在附近。军官的帐篷扎到树下，其他人留在外面。后头给行李车的位置划好了吗？"
        - id: ch01-b19
          speaker: narrator
          text: "他们又朝远处的同伴高声发问。粗哑的回答传到这里，已经低柔而模糊。"
        - id: ch01-b20
          speaker: advance_soldier_2
          text: "行，那就把旗子插在这儿。"
        - id: ch01-b21
          speaker: lama
          text: "他们在准备什么？这个世界真伟大，也真可怕。旗上画的是什么徽记？"
        - id: ch01-b22
          speaker: narrator
          text: "一个士兵把旗杆插在他们几英尺外，哼了一声，又拔出来同伙伴商量。伙伴沿着树荫形成的绿色洞穴前后看了看，他这才重新插好。金睁大眼睛死死盯住，牙缝间的呼吸又短又急。两个士兵踏着重步，走回阳光里。"
        - id: ch01-b23
          speaker: kim
          text: "圣人！是我的星盘，是安巴拉祭司画在尘土里的图！你记不记得？最先来的是两个法拉什，替一切预备地方，而且他们是在暗处来的。异象总是这样开头。"
          emotion: surprised
        - id: ch01-b24
          speaker: lama
          text: "可这不是异象，只是尘世里的幻象。"
        - id: ch01-b25
          speaker: kim
          text: "接着公牛就来了，绿地上的红公牛。你看，就是它！"
          emotion: surprised
        - id: ch01-b26
          speaker: narrator
          text: "旗子在晚风里噼啪作响，离他们不到十英尺。它本是普通的营地标志旗，不过马弗里克兵团向来认真对待服饰徽记，旗上绣的正是团徽。一头巨大的红牛，站在爱尔兰绿的底色上。"
        - id: ch01-b27
          speaker: lama
          text: "我看见了，也想起来了。这的确是你的公牛。那两个人也确实先来预备一切。"
        - id: ch01-b28
          speaker: kim
          text: "他们是白人士兵。祭司怎么说来着？公牛对面的星相，是战争和武装之人的星相。圣人，这同我的寻求有关。"
        - id: ch01-b29
          speaker: lama
          text: "不错，确实如此。安巴拉的祭司说过，你的星相属于战争。"
        - id: ch01-b30
          speaker: narrator
          text: "喇嘛定定望着徽记。暮色里，那头红牛像红宝石一样燃烧。"
        - id: ch01-b31
          speaker: kim
          text: "那我们现在怎么办？"
        - id: ch01-b32
          speaker: lama
          text: "等。我们就在这里等。"
        - id: ch01-b33
          speaker: kim
          text: "连黑暗都在散开。"
        - id: ch01-b34
          speaker: narrator
          text: "落日穿过一根根树干，横照进林中。几分钟里，整座芒果林都灌满了粉金色的光。这本是再自然不过的景象，在金眼里，却像给安巴拉婆罗门的预言戴上了一顶王冠。"
        - id: ch01-b35
          speaker: lama
          text: "听！远处有人在敲鼓！"
          emotion: surprised
        - id: ch01-b36
          speaker: narrator
          text: "起初，鼓声细细穿过静止的空气，像脑中血脉一下一下跳动。没过多久，鼓点便清楚锐利起来。"
        - id: ch01-b37
          speaker: kim
          text: "啊，是军乐。"
        - id: ch01-b38
          speaker: narrator
          text: "金早已听惯兵团乐队的声音，喇嘛却满心惊奇。平原尽头，一支沉重而满身尘土的纵队慢慢爬进视野。接着，风把曲调一阵阵送到树林。歌声先请众人屈尊听一听，听士兵把自己知道的事情讲明白，讲穆利根卫队怎样行军，一路开往下方的斯莱戈港。尖声的横笛忽然插了进来。士兵唱着，他们扛起枪，行军去远方。从菲尼克斯公园，一路走到都柏林海湾旁。鼓儿响，笛儿唱，乐声悠扬。他们不断行军，随着穆利根卫队向前闯。"
        - id: ch01-b39
          speaker: narrator
          text: "马弗里克兵团的乐队奏着军乐，把全团领进营地。士兵带着行李徒步而来。起伏的纵队摆进平地，后面的车辆向两边散开，像一座受惊的蚁丘，忽然四处奔走。"
        - id: ch01-b40
          speaker: lama
          text: "这分明是妖术！"
          emotion: surprised
        - id: ch01-b41
          speaker: narrator
          text: "一顶顶帐篷仿佛从车辆里自己展开，转眼便撒满了平原。又一群人冲进芒果林，彼此几乎不说一句话，飞快架起一顶巨大的帐篷。紧接着，它旁边又连续升起八九顶。锅、盘和包裹也像从地下冒出来，被等在那里的本地仆役一件件接走。就在金和喇嘛注视的时候，原先安静的芒果林已经变成一座井井有条的城镇。各处营火开始闪烁。白人军官腰间的佩剑叮当作响，他们迈着大步走进军官餐帐。喇嘛看得畏惧，不由得向后退缩。"
        - id: ch01-b42
          speaker: lama
          text: "我们走吧。"
          emotion: fearful
        - id: ch01-b43
          speaker: kim
          text: "再退进暗影一点。隔着火光，谁也看不清后面的东西。"
        - id: ch01-b44
          speaker: narrator
          text: "金仍盯着那面旗。他从没见过一支训练有素的兵团，怎样在半个钟头里把营地扎好。"
        - id: ch01-b45
          speaker: lama
          text: "看，快看！那里来了一个祭司。"
          emotion: surprised
        - id: ch01-b46
          speaker: narrator
          text: "来人是本团的英国国教随军牧师贝内特。他一瘸一拐地走来，一身黑衣全被尘土盖住。他的一个教民曾经粗鲁地讥笑，说牧师没有胆量。为了叫那个人羞愧，贝内特当天一步也不曾落下，硬是跟着全团走完了路。那身黑衣，表链上垂着的金十字架，没有胡须的脸，还有一顶柔软的宽边黑毡帽，在印度任何地方都足够说明他是一位圣职者。他走到军官餐帐门旁，在一张行军椅上坐倒，随即脱掉靴子。三四个军官围到身边，拿他当天完成的这番壮举说笑取乐。"
        - id: ch01-b47
          speaker: lama
          text: "白人说话真没有庄重可言。不过我看那祭司的面相，他应该很有学问。他听得懂我们的话吗？我想同他谈谈我的寻求。"
        - id: ch01-b48
          speaker: kim
          text: "白人没吃饱以前，千万别同他说话。他们马上要吃饭了，我们去讨也多半讨不到。先回歇脚处吧，吃过饭再来。这真的是红公牛，是我的红公牛。"
        - id: ch01-b49
          speaker: narrator
          text: "老妇的随从送来饭菜时，两人都有些心不在焉。谁也没有打扰他们的沉默，因为惹恼客人并不吉利。金剔着牙，先开了口。"
        - id: ch01-b50
          speaker: kim
          text: "现在回去。不过圣人，你得在远一点的地方等我。你的脚步比我重，我又急着再看看那头红公牛。"
        - id: ch01-b51
          speaker: lama
          text: "可你怎么听得懂他们？走慢些，路上很黑。"
        - id: ch01-b52
          speaker: kim
          text: "树林附近有个地方，你能坐在那里等我喊。别反对，这是我的寻求，是寻找我的红公牛。星辰里的征兆不是给你的。我懂一点白人士兵的规矩，也一直想见识新东西。"
        - id: ch01-b53
          speaker: narrator
          text: "喇嘛顺从地蹲进地面一处浅凹，离芒果林隆起的黑影不到一百码。繁星铺满他头顶的夜空。"
        - id: ch01-b54
          speaker: lama
          text: "这世上的事，还有什么是你不知道的？"
        - id: ch01-b55
          speaker: kim
          text: "等我叫你。"
        - id: ch01-b56
          speaker: narrator
          text: "金一闪身便没入暮色。他知道营地周围十有八九布着哨兵。听见一双厚靴踏着地走来，他忍不住暗自发笑。一个能在月夜的拉合尔城屋顶上躲开追赶，懂得利用每一小块暗影和每一个阴暗角落，把追他的人耍得团团转的男孩，怎么会被一道训练有素的士兵防线拦住？他很给哨兵面子，从两个人中间悄悄爬了过去。一路上，他一会儿跑，一会儿停，一会儿蜷起身体，一会儿平贴在地面，慢慢摸到灯火通明的军官餐帐。最后，他紧靠一棵芒果树藏好，耐心等着哪一句偶然听来的话，能给他一条有用的线索。"
        - id: ch01-b57
          speaker: narrator
          text: "他满脑子都只想多打听一点红公牛的事。父亲预言中的九百个十足的魔鬼，会不会在天黑后向这头牲畜祈祷，就像印度教徒向圣牛祷告？金的见识有时无比广阔，受限时却又来得古怪而突然。在他看来，这猜测至少十分正确，也很合道理。佩着金十字架的帕德里，正是最该请教的人。可换一面想，金又记起拉合尔城里那些板着脸、被他躲开过的帕德里。这个祭司也许同样是个爱打听的讨厌鬼，还会命令他去上学。不过，安巴拉的预言不是已经应验了吗？他在高天里的星相预示着战争和武装之人。他不只是全世界的朋友，也是星辰的朋友，肚里装满可怕的秘密。所有飞快转动的念头下面，还有一个最先涌动的想法。这场冒险，虽然他不知道相应的英语词，实在是天大的开心游戏。它接上了从前飞越屋顶的逃跑，又应验了庄严神圣的预言。金肚皮贴地，扭动着爬向军官餐帐门口，一只手牢牢握住颈上的护身符。"
        - id: ch01-b58
          speaker: narrator
          text: "果然，那些英国老爷正在向自己的神祷告。军官餐桌中央放着行军时唯一的装饰。一头金牛低着头，在爱尔兰绿的底座上扬蹄冲撞。它是从北京圆明园得来的战利品。军官们朝它举起酒杯，乱哄哄地一齐高喊。"
        - id: ch01-b59
          speakers: [officer_1, officer_2, officer_3, officer_4]
          ensemble: chorus
          text: "敬红公牛！"
        - id: ch01-b60
          speaker: narrator
          text: "每逢这次祝酒，贝内特牧师总会离席。当天跟全团走得十分疲惫，他起身比平时更急。金刚刚抬头，仍盯着桌上的金牛图腾，牧师一只穿皮靴的脚正踩上他的右肩胛骨。金被踩得猛然缩身，向旁边一滚，竟把贝内特掀倒了。牧师向来是个行动果断的人，立刻一把扼住金的喉咙，险些把他活活掐死。金拼尽力气，一脚踢中牧师的肚子。贝内特喘不上气，身子弯成一团，可两只手仍旧不肯松开。他翻过身来，一声不出地把金拖进自己的帐篷。马弗里克兵团的人爱恶作剧，已经到了无药可救的地步。贝内特想到，在彻底查问清楚这个突然冒出的男孩以前，最好不要惊动他们。"
        - id: ch01-b61
          speaker: bennett
          text: "怎么，是个男孩！你躲在那里做什么？你是贼。贼，听懂了吗？"
          emotion: angry
        - id: ch01-b62
          speaker: narrator
          text: "贝内特把俘虏拖到帐篷杆的灯下，狠狠摇晃。他会的印度斯坦语少得可怜。金又恼又厌，决定继续装成原来的样子。他一边喘匀气，一边编出一个可信的故事，说自己同洗锅的小厮有关系，眼睛却一直盯着牧师左腋下。机会一来，他低身冲向门口。可一条长胳膊猛然伸出，抓住他的脖子，扯断了护身符的绳子。"
        - id: ch01-b63
          speaker: kim
          text: "还给我！把它还给我！那些纸呢？把纸还给我！"
          emotion: fearful
        - id: ch01-b64
          speaker: narrator
          text: "这是英语，是本地长大的孩子说出的那种细薄而生硬的英语。牧师吃了一惊，摊开手掌。"
        - id: ch01-b65
          speaker: bennett
          text: "一枚圣牌？不，是异教徒的护符。怎么，你会说英语？小孩子偷东西，是要挨打的。知道吗？"
        - id: ch01-b66
          speaker: kim
          text: "我没偷！把护身符还我。别从我这里偷走它！"
          emotion: angry
        - id: ch01-b67
          speaker: narrator
          text: "金像一只面对棍子的梗犬，痛苦地跳来跳去。贝内特没理他，只到帐篷门口高声叫人。一个微胖、脸刮得干净的男人走了进来。"
        - id: ch01-b68
          speaker: bennett
          text: "维克托神父，请你来看看。我在餐帐外的黑暗里抓到这个孩子。照平常，我会抽他一顿再放走，因为我认定他是贼。可他会说英语，还把这件护符看得很重。也许你能帮忙。"
        - id: ch01-b69
          speaker: narrator
          text: "贝内特相信，自己同爱尔兰部队的罗马天主教随军神父之间隔着一道鸿沟。可英国国教一遇到人的难题，十有八九还是会请罗马教会来。他在公事上厌恶对方的教义，私下却同样敬重维克托神父。"
        - id: ch01-b70
          speaker: victor
          text: "一个会说英语的贼？让我看看护符。不，这不是圣牌。"
        - id: ch01-b71
          speaker: bennett
          text: "我们有权打开吗？要不先狠狠抽他一顿……"
        - id: ch01-b72
          speaker: kim
          text: "我没偷东西。你已经踢得我浑身都疼了。把护身符还我，我要走。"
        - id: ch01-b73
          speaker: victor
          text: "先别急着走。让我们瞧瞧。"
        - id: ch01-b74
          speaker: narrator
          text: "维克托神父不紧不慢地打开那个可怜的护身符，取出里面一张张折叠的纸。他先展开金博尔·奥哈拉那份永不更改的身份证明，接着是退伍证书，还有金本人的洗礼证。奥哈拉怀着一种混乱的念头，以为自己正在替儿子做出极高明的安排。他在最后一张纸上潦草地写了几十遍同一句话，要别人照看这个孩子，一定要照看这个孩子。那些恳求下面，还签着他的全名和兵团番号。维克托神父看过以后，把所有纸张一并递给贝内特。"
        - id: ch01-b75
          speaker: victor
          text: "地下的黑暗势力啊！你知道这些是什么吗？"
          emotion: surprised
        - id: ch01-b76
          speaker: kim
          text: "知道。它们是我的。现在我要走。"
        - id: ch01-b77
          speaker: bennett
          text: "我还是不明白。也许他故意带着这些，拿来骗钱。"
        - id: ch01-b78
          speaker: victor
          text: "我可没见过哪个乞丐这么急着离开同伴。这里多半藏着一桩痛快的谜案。贝内特，你相信天意吗？"
        - id: ch01-b79
          speaker: bennett
          text: "我希望自己相信。"
        - id: ch01-b80
          speaker: victor
          text: "我相信神迹，其实也就是一回事。金博尔·奥哈拉的儿子！可这孩子明明像本地人。我还亲眼见过金博尔同安妮·肖特结婚。孩子，这些纸跟了你多久？"
        - id: ch01-b81
          speaker: kim
          text: "从我还是小婴儿的时候起。"
        - id: ch01-b82
          speaker: narrator
          text: "维克托神父上前拉开金的衣襟。"
        - id: ch01-b83
          speaker: victor
          text: "你看，他没那么黑。你叫什么？"
        - id: ch01-b84
          speaker: kim
          text: "金。"
        - id: ch01-b85
          speaker: victor
          text: "还是金博尔？"
        - id: ch01-b86
          speaker: kim
          text: "也许吧。你肯放我走了吗？"
        - id: ch01-b87
          speaker: victor
          text: "还有别的名字吗？"
        - id: ch01-b88
          speaker: kim
          text: "人家叫我金·里什蒂克，就是里什蒂的金。"
        - id: ch01-b89
          speaker: victor
          text: "里什蒂是什么？"
        - id: ch01-b90
          speaker: kim
          text: "爱……里什蒂。那是我父亲的兵团。"
        - id: ch01-b91
          speaker: victor
          text: "爱尔兰。哦，我懂了。"
        - id: ch01-b92
          speaker: kim
          text: "对，我父亲这样告诉我的。他从前活着。"
        - id: ch01-b93
          speaker: victor
          text: "从前在哪里活着？"
        - id: ch01-b94
          speaker: kim
          text: "就是从前活着呀。他当然已经死了，熄灭了。"
        - id: ch01-b95
          speaker: victor
          text: "哦，你说起来总是这么干脆吗？"
        - id: ch01-b96
          speaker: bennett
          text: "看来我冤枉了他。他无疑是白人，只是没人照料。我肯定把他弄伤了。我想烈酒不该……"
        - id: ch01-b97
          speaker: victor
          text: "给他一杯雪利酒，让他坐到行军床上。金，没人要伤你。喝下去，再讲讲自己的事。最好说真话，只要你不介意。"
        - id: ch01-b98
          speaker: narrator
          text: "金放下已经喝空的杯子，轻轻咳了几声，仔细盘算起来。眼下的情形，似乎既要他谨慎，也得让他动用想象。一个偷偷钻进营地的小男孩，通常只会挨一顿鞭子，随后就被赶出去。可金并没有挨打。颈上的护身符显然正在替他带来好运。安巴拉祭司画出的星盘，再加上父亲那些胡言乱语里他还记得的只言片语，竟像神迹一样一件件吻合。不然，胖帕德里为什么会震动成那副样子？瘦帕德里又为什么请他坐到行军床上，还给他一杯滚热的黄酒？金索性一头扎进自己的故事，只是还拿不准，真话究竟能帮他走到哪一步。"
        - id: ch01-b99
          speaker: kim
          text: "我很小的时候，父亲就在拉合尔死了。有个女人在出租马车的地方附近开旧货铺。"
        - id: ch01-b100
          speaker: victor
          text: "她是你母亲？"
        - id: ch01-b101
          speaker: kim
          text: "不是！我出生时，母亲就熄灭了。父亲从魔术屋拿到这些纸，因为他品行好。他还说，我会找到绿地上的红公牛，那头牛会帮助我。两天前，安巴拉画尘土图的婆罗门也这样说。"
        - id: ch01-b102
          speaker: bennett
          text: "天生的小骗子。"
        - id: ch01-b103
          speaker: victor
          text: "地下的黑暗势力啊，这到底是什么国家！接着说，金。"
        - id: ch01-b104
          speaker: kim
          text: "我没有偷东西。再说，我现在是一个极神圣之人的弟子，他就坐在外面。我们亲眼看见两个拿旗子的人先来预备地方。梦要出现，或是预言要应验，总会先发生这样的事，所以我知道预言成真了。接着，我看见绿地上的红公牛。父亲从前说过，等我找到红公牛，九百个真正的魔鬼和一位骑马的上校就会照看我。看见公牛以后，我不知道下一步该做什么，便先离开了。等到天黑，我又回来，想再看它一次。果然，我又看见了红公牛，那些英国老爷正在向它祷告。我想，这头公牛一定会帮助我。圣人也说过同样的话。他现在就坐在外面。要是我喊他过来，你们会伤害他吗？他极其神圣，可以替我说的每一句话作证，也知道我根本不是贼。"
        - id: ch01-b105
          speaker: bennett
          text: "英国老爷向公牛祷告？你到底怎么想的？还是圣人的弟子？这孩子疯了吗？"
        - id: ch01-b106
          speaker: victor
          text: "他肯定是奥哈拉的儿子。奥哈拉的儿子竟同所有黑暗势力结了盟。他父亲喝醉时，大概也干得出来。把那位圣人请来吧，也许他知道些什么。"
        - id: ch01-b107
          speaker: kim
          text: "他什么也不知道。跟我来，我指给你们看。他是我师父。看完以后，我们就可以走。"
        - id: ch01-b108
          speaker: narrator
          text: "贝内特一手牢牢按着金的肩膀，带他出去。他们在原处找到了喇嘛。"
        - id: ch01-b109
          speaker: kim
          text: "我的寻求结束了！我找到公牛，可天知道接下来会怎样。他们不会伤你。跟这个瘦子去胖祭司的帐篷，看看事情怎样收场。他们不懂印度话，只是两头没刷洗过的驴。"
        - id: ch01-b110
          speaker: lama
          text: "他们无知，你就不该取笑。弟子，你若欢喜，我也高兴。"
        - id: ch01-b111
          speaker: narrator
          text: "喇嘛庄重而坦然地跟着他们走进小帐篷。他以圣职者对待圣职者的礼节，向两位不同教派的牧师致意，随后在敞开的炭盆旁坐下。帐篷内侧是黄色衬里，灯光映在上面，又反照到老人脸上，把那张脸照成了赤金色。贝内特站在那里打量他，目光中带着自己信条的三重冷漠。在那套信条看来，世上十分之九的人根本不必一一分辨，全都可以一股脑归进异教徒之中。"
        - id: ch01-b112
          speaker: lama
          text: "你的寻求有了什么结果？红公牛给了你什么恩赐？"
        - id: ch01-b113
          speaker: kim
          text: "他问，你们打算怎么办。"
        - id: ch01-b114
          speaker: narrator
          text: "贝内特不安地望向维克托神父。为了自己的打算，金主动做起翻译。"
        - id: ch01-b115
          speaker: bennett
          text: "这个法基尔同孩子有什么关系，我看不出来。孩子多半让他骗了，或者他们本来就是同伙。我们不能让一个英国男孩跟着他。既然孩子是共济会会员的儿子，就该尽快送进共济会孤儿院。"
        - id: ch01-b116
          speaker: victor
          text: "这是你以兵团分会秘书的身份给出的意见吧？不过我们可以把打算告诉老人。他看着不像坏人。"
        - id: ch01-b117
          speaker: bennett
          text: "依我的经验，东方人的心思永远摸不透。金博尔，把我的话逐字告诉他。"
        - id: ch01-b118
          speaker: kim
          text: "圣人，这个像骆驼的瘦傻瓜说，我是英国老爷的儿子。"
        - id: ch01-b119
          speaker: lama
          text: "怎么会这样？"
        - id: ch01-b120
          speaker: kim
          text: "是真的。我出生时就知道，他却要抢走护身符，读完纸才看出来。他们要把我留在兵团，或者送去学校。这以前也发生过，我总能逃走。胖傻瓜一个主意，瘦傻瓜另一个主意，都不要紧。我也许待一夜，再待一夜，然后就溜走，到萨哈兰普尔的大路上追你。"
        - id: ch01-b121
          speaker: lama
          text: "你要告诉他们，你是我的弟子。告诉他们，我昏倒迷失时，你怎样来到我身边。再说说我们的寻求，他们一定会放你走。"
        - id: ch01-b122
          speaker: kim
          text: "我已经说了。他们只是笑，还提到警察。"
        - id: ch01-b123
          speaker: bennett
          text: "你们在说什么？"
        - id: ch01-b124
          speaker: kim
          text: "他说，你们不让我走，就会妨碍他的紧急私人事务。要是知道他的事是什么，你们就不会这样急着插手。"
        - id: ch01-b125
          speaker: victor
          text: "究竟是什么事？"
        - id: ch01-b126
          speaker: kim
          text: "这个国家里有一条河，他很想找到。那条河是由一支箭放出来的，是佛祖释迦牟尼造的。进去洗一洗，所有罪过都会洗掉，人会白得像棉花。我是他的弟子，我们一定要找到它。那条河对我们很宝贵。"
        - id: ch01-b127
          speaker: bennett
          text: "再说一遍。"
        - id: ch01-b128
          speaker: narrator
          text: "金又讲了一遍，还添了些枝叶。"
        - id: ch01-b129
          speaker: bennett
          text: "这简直是严重的亵渎！"
          emotion: angry
        - id: ch01-b130
          speaker: victor
          text: "啧，啧！我要是会讲本地话，花多少钱都愿意。一条能洗去罪孽的河！你们找了多久？"
        - id: ch01-b131
          speaker: kim
          text: "已经找了许多天。现在我们要走，接着去找。你看，那条河不在这里。"
        - id: ch01-b132
          speaker: victor
          text: "我明白。可他不能再跟着老人。金，你是军人的儿子，兵团会照料你，把你培养成像你父亲那样的好汉。告诉老人，他若相信神迹，就必须相信……"
        - id: ch01-b133
          speaker: bennett
          text: "不必利用他的轻信。"
        - id: ch01-b134
          speaker: victor
          text: "我没有。这个孩子为了寻找红公牛，竟找回自己的兵团，这本身就是神迹。全印度只有这一个男孩，行军路上所有兵团里，又偏偏让我们的兵团碰见。这明摆着是天命。告诉他，是天命。"
        - id: ch01-b135
          speaker: narrator
          text: "维克托神父转向喇嘛。就算他说的是美索不达米亚，老人也不会比现在多懂半分。金便用自己的办法解释。他说，两个牧师认定他的星盘已经应验。虽说他只是好奇才走近营地，可红公牛把他带回了这些人中间，他便非得进学校，被变成英国老爷。金打算先装作答应。最坏也不过离开喇嘛，吃上一两天的饭，随后他就会逃走，沿大路追到萨哈兰普尔。他请喇嘛一定跟着那个库卢女人，无论如何别离她的车太远，不然自己回来时就找不到师父的脚印了。金还说，自己的星相毫无疑问属于战争和武装之人。两个牧师给他酒喝，又让他坐在尊贵的床上，看来父亲一定是个了不起的人。若他们肯给他尊荣，那很好。若不肯，也一样好。不管怎样，等他厌倦了，自然会跑回喇嘛身边。说完这番话，金又转向牧师，装作自己已经把每句话都照原样告诉老人。"
        - id: ch01-b136
          speaker: bennett
          text: "看来没必要再让他等。详情以后再查。我给他一枚卢比……"
        - id: ch01-b137
          speaker: victor
          text: "给他一点时间。也许他疼爱这孩子。"
        - id: ch01-b138
          speaker: narrator
          text: "喇嘛取出念珠，把宽大帽檐拉下来遮住眼睛。"
        - id: ch01-b139
          speaker: bennett
          text: "他现在又想要什么？"
        - id: ch01-b140
          speaker: kim
          text: "他说安静。他要单独同我讲话。你们一个字也听不懂。要是开口，他也许会狠狠诅咒你们。他拿起念珠时，总需要安静。"
        - id: ch01-b141
          speaker: narrator
          text: "两个英国人果然不出声了。不过贝内特的眼神表明，等金落进宗教之手，他会有苦头吃。"
        - id: ch01-b142
          speaker: lama
          text: "英国老爷，还是英国老爷的儿子。可没有白人像你这样懂这片土地和这里的规矩。怎么会是真的？"
          emotion: sad
        - id: ch01-b143
          speaker: kim
          text: "这有什么要紧？记住，只是一两夜。我能变得很快。一切都会恢复原样，就像我第一次在萨姆·扎玛大炮下同你说话时那样。"
        - id: ch01-b144
          speaker: lama
          text: "那时你穿白人的衣服，是个小男孩。第二次见面，你成了印度教徒。第三次投生，你又会是什么？唉，弟子，我的心已经向着你，你却伤害了一个老人。"
          emotion: sad
        - id: ch01-b145
          speaker: kim
          text: "我的心也向着你。可我怎么知道，红公牛会把我带进这种事？"
          emotion: sad
        - id: ch01-b146
          speaker: narrator
          text: "喇嘛再次掩住脸，紧张地摇着念珠。金蹲到他身旁，紧紧抓住他衣服的一角。过了一会儿，老人闷声问，如今是否已经确定，这孩子真是一个英国老爷。他说话的样子，像在背诵一篇刚刚学会、却不愿相信的功课。他所知道的白人很少，只能想到拉合尔奇迹屋里那个看守塑像的人。既然金同那个人属于一类，那么金做事便不能不照英国老爷的方式，也必须回到自己的人民中间。"
        - id: ch01-b147
          speaker: kim
          text: "只要一天、一夜，再一天。"
        - id: ch01-b148
          speaker: victor
          text: "休想！"
        - id: ch01-b149
          speaker: narrator
          text: "金一点点往门口挪，维克托神父伸出粗壮的腿拦住了他。"
        - id: ch01-b150
          speaker: lama
          text: "我不懂白人的习俗。拉合尔奇迹屋里的塑像祭司，比这里这个瘦子有礼貌。现在他们要夺走我的弟子，把他变成英国老爷。我真不幸！我还怎么寻找我的河？难道他们没有自己的弟子吗？替我问问。"
          emotion: sad
        - id: ch01-b151
          speaker: kim
          text: "他说自己非常难过，以后再也找不到河。他问，你们为什么没有自己的弟子，偏要来纠缠他。他还想洗清自己的罪。"
        - id: ch01-b152
          speaker: narrator
          text: "两个牧师一时都答不上来。喇嘛如此痛苦，金也急了。"
        - id: ch01-b153
          speaker: kim
          text: "你们现在放我走，我们会安安静静离开，什么也不偷，仍像我被抓以前那样找河。我真希望自己没有来看红公牛，也没碰到这些事。我不要它了。"
          emotion: sad
        - id: ch01-b154
          speaker: bennett
          text: "年轻人，这是你一生中替自己做过的最好一件事。"
        - id: ch01-b155
          speaker: victor
          text: "天哪，我不知道怎样安慰他。他不能带走孩子，可他是个好人，我确信他是。贝内特，你若给他那枚卢比，他会把你连根带枝一起诅咒。"
        - id: ch01-b156
          speaker: narrator
          text: "帐篷里只剩彼此的呼吸。三分钟，又过了五分钟。喇嘛终于抬头，目光越过众人，投向虚空。"
        - id: ch01-b157
          speaker: lama
          text: "可我仍是一个追随正道的人。罪过既然是我的，惩罚也该由我自己承受。我曾经欺骗自己。现在我明白，那不过是自欺。我以为你被送到我身边，是为了帮助我完成寻求。你的仁慈，你待人的礼数，还有小小年纪便有的智慧，一点点让我的心向着你。可是，追随正道的人，不能容许任何欲念与执着的火焰留在心里，因为世间的一切都是幻象。"
          emotion: sad
        - id: ch01-b158
          speaker: narrator
          text: "为了说明一切欲念与执着都只是幻象，他先引用了一段极古老的汉文。接着，他又背出第二段来为前一段作证，随后再用第三段古文加强自己的意思。两个牧师一个字也听不懂，却能从声音里听见他的痛苦。"
        - id: ch01-b159
          speaker: lama
          text: "弟子，我偏离正道，不是你的错。一路看见众生和新人，又看见你为这一切快活，我也心生欢喜。我喜爱你，可我本该只想着寻求。如今你被带走，河又远在天边，我便悲哀起来。我违背了法。"
          emotion: sad
        - id: ch01-b160
          speaker: victor
          text: "地下的黑暗势力啊！"
        - id: ch01-b161
          speaker: lama
          text: "我现在明白，红公牛的征兆既给了你，也给了我。一切欲念都是红色，也是邪恶。我会苦修赎罪，独自寻找我的河。"
        - id: ch01-b162
          speaker: kim
          text: "至少回到库卢女人那里。她会供你吃饭，直到我跑回来。"
        - id: ch01-b163
          speaker: narrator
          text: "喇嘛挥挥手，表示心意已定。接着他转向金，语气忽然变了。"
        - id: ch01-b164
          speaker: lama
          text: "他们会怎样处置你？我至少还能积些功德，弥补从前的过错。"
        - id: ch01-b165
          speaker: kim
          text: "他们想把我变成英国老爷。后天我就回来。别难过。"
        - id: ch01-b166
          speaker: lama
          text: "变成哪一种？像这个人，还是那个人？还是今晚那些佩剑、跺着重步的人？"
        - id: ch01-b167
          speaker: kim
          text: "也许是吧。"
        - id: ch01-b168
          speaker: lama
          text: "那不好。他们追逐欲念，最后只会落进虚空。你不能成为他们那样的人。"
        - id: ch01-b169
          speaker: kim
          text: "安巴拉的祭司说，我的星辰属于战争。我会问问这两个傻瓜。不过也没必要，我今晚就逃。新鲜东西我已经全看完了。"
        - id: ch01-b170
          speaker: narrator
          text: "金用英语问了几个问题，又把回答译给喇嘛。"
        - id: ch01-b171
          speaker: kim
          text: "他问，你们把我从他身边夺走，却说不出要把我培养成什么。塑造一个孩子可不是小事，请在他走前说清楚。"
        - id: ch01-b172
          speaker: victor
          text: "你会进学校，以后再看。金博尔，你应该愿意当兵吧？"
        - id: ch01-b173
          speaker: kim
          text: "白人？不，不！我不当兵。"
        - id: ch01-b174
          speaker: bennett
          text: "你会照吩咐去做。我们肯帮助你，你应该感恩。"
        - id: ch01-b175
          speaker: narrator
          text: "金怜悯地笑了。他们若以为能叫他做不喜欢的事，就让他们误会。沉默又持续很久。贝内特不耐烦地动来动去，提议叫哨兵赶走法基尔。"
        - id: ch01-b176
          speaker: lama
          text: "问他们，英国老爷传授学问，是赠送，还是出售？"
        - id: ch01-b177
          speaker: kim
          text: "他们说钱要付给老师，不过会由兵团出。可这有什么要紧？我只待一夜。"
        - id: ch01-b178
          speaker: lama
          text: "那么，付得越多，得到的学问就越好吗？为学问花钱没有错。帮助无知的人得到智慧，永远都是功德。问他们，明智合宜的教导要多少钱，又在哪座城里。"
        - id: ch01-b179
          speaker: narrator
          text: "喇嘛根本不理会金打算早早逃走的话。他认为，为学问花钱并没有错，帮助无知的人获得智慧更是永远的功德。他手中的念珠像算盘一样急促作响，随后正面朝向两个正在压迫他的人。金把问题译了过去。维克托神父说，这要看情形。兵团可以负担军队孤儿院的全部费用，也可以把金的名字列进旁遮普共济会孤儿院。神父也知道，喇嘛和金都不会懂那究竟是什么。不过，若问印度能给一个男孩的最好教育，那自然是在勒克瑙的圣泽维尔学校。为了把学校、费用和不同的安排都译明白，金费了很久。贝内特一直不耐烦地插话，想叫维克托神父就此打住。维克托却早已不再为这个夜晚发生的任何怪事感到惊奇。"
        - id: ch01-b180
          speaker: kim
          text: "他只想知道要多少钱。"
        - id: ch01-b181
          speaker: victor
          text: "一年两三百卢比。"
        - id: ch01-b182
          speaker: kim
          text: "他要你把学校名字和钱数写下来，再签上姓名。几天后，他会写信给你。他说你是好人，另一个是傻瓜。现在他要走了。"
        - id: ch01-b183
          speaker: lama
          text: "我要继续我的寻求！"
        - id: ch01-b184
          speaker: narrator
          text: "喇嘛突然起身，随即离去。维克托神父跳起来，怕他撞上哨兵，可又不能丢下孩子。金迅速作势要追，最后忍住了。外面没有喝问声，喇嘛已经消失。"
        - id: ch01-b185
          speaker: narrator
          text: "金从容地在牧师的行军床上安顿下来。喇嘛至少已经答应，会同库卢的拉杰普特老妇待在一起。只要师父不会独自在路上迷失，其他事情都微不足道。两个帕德里显然激动得厉害，这让金觉得很有趣。他们压低声音谈了很久。维克托神父极力劝贝内特接受某个办法，贝内特却似乎怎么也不肯相信。新鲜事一件接一件，十分迷人，可金已经困了。后来他们叫了几个人进帐篷，其中一个必定就是父亲预言里骑马的上校。他们没完没了地发问，大多问的是那个曾经照料他的女人。金把自己知道的全都照实回答。听完以后，那些人显然认为，她并不是一个称职的监护人。"
        - id: ch01-b186
          speaker: narrator
          text: "不管怎样，这是金经历过的最新鲜的一段事情。他心里很清楚，只要自己愿意，迟早能逃进那片巨大、灰蒙蒙、没有形状的印度。到了那里，帐篷、帕德里和上校都再也管不住他。可眼下既然需要给英国老爷留下深刻印象，他就会竭尽所能。毕竟，他自己也是一个白人。众人又进行了一番很长的谈话，其中大半他都听不明白。最后，他们把他交给一名中士，严令那个人无论如何不能让孩子逃掉。兵团还要继续开往安巴拉。一部分费用由兵团的分会承担，另一部分由众人捐助。至于金，他会被送往一个叫萨纳瓦尔的地方。"
        - id: ch01-b187
          speaker: victor
          text: "上校，这神迹胜过一切欢呼。那个佛教徒拿走我的姓名地址便走了。我弄不清他要付孩子的学费，还是要施什么巫术。金，将来你会感谢红公牛。我们会在萨纳瓦尔把你培养成男子汉，哪怕代价是把你变成新教徒。"
        - id: ch01-b188
          speaker: bennett
          text: "当然，完全正确。"
        - id: ch01-b189
          speaker: kim
          text: "可你们不会去萨纳瓦尔。"
        - id: ch01-b190
          speaker: victor
          text: "我们当然会去，小家伙。这是总司令的命令。他比奥哈拉的儿子重要那么一点。"
        - id: ch01-b191
          speaker: kim
          text: "你们不会去。你们要去打仗。"
        - id: ch01-b192
          speaker: narrator
          text: "满帐篷的人听见这句预言，一齐哄然大笑。他们只当金把兵团正在走的行军路线，同真正开战的战线混在了一起。可金并没有跟着笑。他记得安巴拉廊下偷听来的谈话，也知道这些人还没有听到那个消息。"
        - id: ch01-b193
          speaker: colonel
          text: "等你多懂一点自己的兵团，就不会把行军路线当成战线了。我们倒希望有一天真能去打仗。"
        - id: ch01-b194
          speaker: kim
          text: "那些我都知道。你们现在没在打仗。可一到安巴拉，你们就会被派去打一场新战争。除了大炮，还有八千人参战。"
        - id: ch01-b195
          speaker: colonel
          text: "说得真够明确。你的本领里还包括预言吗？中士，把他带走，去鼓手那里找套衣服，别让他从指缝里溜掉。谁还敢说神迹的时代过去了？我该睡了，我这可怜的脑子已经发软。"
        - id: ch01-b196
          speaker: narrator
          text: "一个钟头以后，在营地遥远的另一头，金像一头被捉住的野兽，默不作声地坐着。他刚刚被人从头到脚洗得干干净净，又给套上一身可怕的硬衣服。粗硬的布料磨着皮肤，他的胳膊和腿处处发疼。刚才还能在暗影里来去自如的男孩，如今连一条腿都被拴住了，只能坐在原处，听中士向别人讲述他这只稀奇小鸟的来历。"
        - id: ch01-b197
          speaker: sergeant
          text: "真是只稀奇的小鸟。一个黄脑袋的高种姓婆罗门领着他冒出来，他脖子上挂着父亲的分会证书，天知道嘴里还念着什么红公牛。那个婆罗门一句解释也没留下，转眼便蒸发了。这小子倒盘腿坐上牧师的床，向周围所有人预言一场血淋淋的战争。印度真是蛮荒地方，敬畏上帝的人在这里可不好过。我只好把他一条腿拴在帐篷杆上，免得他从房顶跑掉。你刚才说，那场战争有多少人？"
        - id: ch01-b198
          speaker: kim
          text: "除了大炮，还有八千人。很快你就会看见。"
        - id: ch01-b199
          speaker: sergeant
          text: "你真是个会安慰人的小魔鬼。现在乖乖躺到两个鼓手中间睡觉去。他们两个会好好守着你睡，别再想着从营地溜走。"
