  chapters:
    - id: ch01
      title: CHAPTER V
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Here I come back to my own people, fed and forgiven, claimed once more by my own flesh and bone. They have prepared the fatted calf for me, yet the husks still taste better. I think I belong with my pigs, so back to the sties I go. Those were the words of The Prodigal Son.
        - id: ch01-b02
          speaker: narrator
          text: Once again, the lazy procession shuffled forward, its bundles tied with string. The old woman slept until they reached the next place to halt. They had marched only a little way, and sunset was still an hour off. Kim began looking for something to do.
        - id: ch01-b03
          speaker: escort_1
          text: Why not sit down and rest? Only devils and Englishmen walk back and forth for no reason.
        - id: ch01-b04
          speaker: escort_2
          text: Never make friends with a devil, a monkey, or a boy. No one can tell what any of them will do next.
        - id: ch01-b05
          speaker: narrator
          text: Kim turned his back on them with contempt. He had no wish to hear the old tale about the Devil playing with boys, regretting it, and wandering uselessly across the country.
        - id: ch01-b06
          speaker: narrator
          text: The lama followed him. All day, whenever they crossed a stream, the lama had gone aside to examine it. Not one had given him a sign that it was his River. Without noticing it, he had also let the Search slip a little from his thoughts. It was a comfort to speak with someone in a sensible language, and the highborn old woman treated him with proper respect as her spiritual adviser. Besides, he expected his quest to take peaceful years. He had none of the white man's impatience, and his faith was great.
        - id: ch01-b07
          speaker: lama
          text: Where are you going?
        - id: ch01-b08
          speaker: kim
          text: Nowhere. We hardly marched at all today, and everything around here is new to me.
        - id: ch01-b09
          speaker: lama
          text: She is certainly wise, and she sees things clearly. Still, it is difficult to meditate when—
        - id: ch01-b10
          speaker: kim
          text: All women are like that.
        - id: ch01-b11
          speaker: narrator
          text: Kim spoke with all the certainty of Solomon.
        - id: ch01-b12
          speaker: lama
          text: In front of my monastery there was a wide stone platform. I wore my footprints into it while I walked back and forth with these beads.
        - id: ch01-b13
          speaker: narrator
          text: He gathered up his worn rosary, clicked the beads, and began his prayer, "Om mane pudme hum." He was thankful for the cool air, the quiet, and the end of the dust.
        - id: ch01-b14
          speaker: narrator
          text: Kim's idle gaze moved from one thing to another across the plain. He wandered without any purpose, except that the nearby huts were built in a way he had not seen before, and he wanted a closer look.
        - id: ch01-b15
          speaker: narrator
          text: They reached a broad grazing field, brown and purple under the afternoon light. A thick grove of mango trees stood in its center. Kim found it strange that such a fine place had no shrine. He noticed matters like that as quickly as any priest. Far out on the plain, four men walked side by side, tiny with distance. Kim shaded his eyes with curved hands and saw brass flash in the light.
        - id: ch01-b16
          speaker: kim
          text: Soldiers. White soldiers! Come on. Let's see them.
        - id: ch01-b17
          speaker: lama
          text: Whenever you and I go off alone, we seem to find soldiers. But I have never seen white soldiers.
        - id: ch01-b18
          speaker: kim
          text: They do no harm unless they are drunk. Stay behind this tree.
        - id: ch01-b19
          speaker: narrator
          text: They slipped behind the heavy trunks, into the cool darkness of the mango grove. Two distant figures stopped while the other two approached uncertainly. They were the advance party of a marching regiment, sent ahead to mark its camp. Each carried a five-foot staff with a small flag fluttering from it. As they spread across the level ground, they shouted to one another.
        - id: ch01-b20
          speaker: narrator
          text: At last the two men entered the mango grove, their boots falling heavily.
        - id: ch01-b21
          speaker: soldier_1
          text: It should be here, or somewhere close. I reckon the officers' tents go under the trees, and the rest of us can camp outside. Did they mark the ground behind us for the baggage wagons?
        - id: ch01-b22
          speaker: narrator
          text: They called to their companions once more. A rough answer floated back from the distance, softened by the open air.
        - id: ch01-b23
          speaker: soldier_2
          text: Put the flag in here, then.
        - id: ch01-b24
          speaker: lama
          text: What are they getting ready for? This world is vast and terrible. What is that sign on the flag?
        - id: ch01-b25
          speaker: narrator
          text: One soldier drove a staff into the earth only a few feet from them. He grunted, dissatisfied, and pulled it out. After speaking with his companion and peering both ways along the green, shaded passage beneath the trees, he planted it again. Kim stared as hard as he could. His breath came short and sharp through his teeth. Then the soldiers stamped away into the sunlight.
        - id: ch01-b26
          speaker: kim
          text: Holy One! My horoscope! Remember the priest at Umballa drawing in the dust. He said two ferashes would come first to prepare everything, in a dark place, because a vision always begins in darkness.
          emotion: surprised
        - id: ch01-b27
          speaker: lama
          text: But this is no vision. It is only the Illusion of the world.
        - id: ch01-b28
          speaker: kim
          text: Then comes the Bull. The Red Bull on the green field. Look! There he is!
          emotion: surprised
        - id: ch01-b29
          speaker: narrator
          text: Kim pointed to the little flag snapping in the evening wind, less than ten feet away. It was only an ordinary marker for a military camp. Yet the regiment cared greatly about its decorations, so the flag bore its crest. The Mavericks' great Red Bull stood on a field of Irish green.
        - id: ch01-b30
          speaker: lama
          text: I see it, and now I remember. It is certainly your Bull. And yes, those two men came first to prepare the place.
        - id: ch01-b31
          speaker: kim
          text: They are white soldiers. What did the priest say? The sign opposite the Bull was the sign of War and armed men. Holy One, this has something to do with my Search.
        - id: ch01-b32
          speaker: lama
          text: Yes. It is true.
        - id: ch01-b33
          speaker: narrator
          text: The lama fixed his eyes on the emblem. In the dusk it burned like a ruby.
        - id: ch01-b34
          speaker: lama
          text: The priest at Umballa said your sign was the sign of War.
        - id: ch01-b35
          speaker: kim
          text: What should we do now?
        - id: ch01-b36
          speaker: lama
          text: Wait. We should wait.
        - id: ch01-b37
          speaker: kim
          text: Even now, the darkness is clearing.
        - id: ch01-b38
          speaker: narrator
          text: The sinking sun had simply reached an opening between the tree trunks. For a few minutes it flooded the grove with pale gold. To Kim, that light crowned the Brahmin's prophecy.
        - id: ch01-b39
          speaker: lama
          text: Listen! Someone is beating a drum far away.
        - id: ch01-b40
          speaker: narrator
          text: At first the sound came thinly through the still air, like blood beating inside a person's head. Soon it sharpened.
        - id: ch01-b41
          speaker: kim
          text: Ah, that is the music.
        - id: ch01-b42
          speaker: narrator
          text: Kim knew a regimental band when he heard one, though the sound astonished the lama. At the far side of the plain, a thick column appeared and crawled forward through its own dust. Then the wind carried the tune. The men sang of marching with the Mulligan Guards toward Sligo, shouldering their arms and leaving Phoenix Park for Dublin Bay, while drums and shrill fifes played them onward.
        - id: ch01-b43
          speaker: narrator
          text: The Mavericks' band was playing the regiment into camp after a day on the road with its baggage. The long column rolled onto the level ground. Carts at the rear divided to left and right, and men rushed everywhere like ants from a disturbed hill.
        - id: ch01-b44
          speaker: lama
          text: This must be sorcery!
          emotion: surprised
        - id: ch01-b45
          speaker: narrator
          text: Tents seemed to spring fully opened from the wagons until they dotted the plain. More men swept into the grove. Without a word, they raised one enormous tent, then eight or nine smaller ones beside it. They pulled out cooking pots, pans, and bundles, and crowds of native servants took charge of them. Before Kim and the lama's eyes, the mango grove became a neat town.
        - id: ch01-b46
          speaker: lama
          text: Let us leave this place.
          emotion: fearful
        - id: ch01-b47
          speaker: narrator
          text: The lama shrank back as fires began to shine and white officers, their swords jingling, strode into the mess tent.
        - id: ch01-b48
          speaker: kim
          text: Keep back in the shadows. No one looking into firelight can see what lies beyond it.
        - id: ch01-b49
          speaker: narrator
          text: Kim never took his eyes from the flag. He had never watched an experienced regiment build its camp in half an hour.
        - id: ch01-b50
          speaker: lama
          text: Look! Look there! A priest is coming.
        - id: ch01-b51
          speaker: narrator
          text: Reverend Arthur Bennett, the regiment's Church of England chaplain, came limping toward them in dusty black clothes. One of his men had mocked his courage, so Bennett had silenced him by marching every step beside the regiment that day. His black coat, the gold cross on his watch chain, his smooth face, and his soft, broad black hat would have shown anywhere in India that he was a holy man. He dropped into a camp chair beside the mess tent and pulled off his boots. Three or four officers gathered around, laughing and teasing him about his march.
        - id: ch01-b52
          speaker: lama
          text: White men speak without any dignity at all.
        - id: ch01-b53
          speaker: narrator
          text: The lama could judge their conversation only by its sound.
        - id: ch01-b54
          speaker: lama
          text: Still, I have studied that priest's face, and I think he is learned. Might he understand our language? I would like to tell him about my Search.
        - id: ch01-b55
          speaker: kim
          text: Never speak to a white man before he has eaten. They will eat soon, and I do not think they would make good people to beg from. Let us return to our resting place. Once we have eaten, we can come back. That truly was a Red Bull. It was my Red Bull.
        - id: ch01-b56
          speaker: narrator
          text: When the old lady's attendants brought their meal, Kim and the lama were both plainly distracted. No one disturbed their silence, because troubling a guest brings bad luck.
        - id: ch01-b57
          speaker: kim
          text: Now we will go back. But Holy One, you must wait a little distance away. Your feet are heavier than mine, and I want to learn more about the Red Bull.
        - id: ch01-b58
          speaker: lama
          text: How will you understand what they say? Walk carefully. The road is dark.
        - id: ch01-b59
          speaker: narrator
          text: Kim ignored the question.
        - id: ch01-b60
          speaker: kim
          text: I noticed a place near the trees where you can sit until I call you. No, do not argue. This is my Search, the Search for my Red Bull. The sign in the Stars was meant for me, not for you. I know something about white soldiers' customs, and I always want to see new things.
        - id: ch01-b61
          speaker: lama
          text: Is there anything in this world you do not know?
        - id: ch01-b62
          speaker: narrator
          text: The lama obediently settled into a shallow hollow less than a hundred yards from the mango trees. Their dark crowns rose like a hump against a sky powdered with stars.
        - id: ch01-b63
          speaker: kim
          text: Stay here until I call.
        - id: ch01-b64
          speaker: narrator
          text: Kim vanished into the dusk. He expected sentries around the camp, and smiled when he heard the heavy tread of one. A boy who could race over Lahore's roofs by moonlight, using every scrap of darkness to confuse whoever chased him, would not be stopped by a line of trained soldiers. He showed them respect by crawling between two sentries. Running, stopping, crouching, and flattening himself against the ground, he made his way toward the bright mess tent. Then he pressed close behind a mango tree and waited for some useful word.
        - id: ch01-b65
          speaker: narrator
          text: Kim thought only of learning more about the Red Bull. His understanding could suddenly become as narrow as it could be wide. For all he knew, the nine hundred thorough devils from his father's prophecy might worship the beast after dark, just as Hindus worshipped the Holy Cow. That seemed perfectly sensible. If so, the priest with the gold cross would be the right man to ask.
        - id: ch01-b66
          speaker: narrator
          text: Then Kim remembered the solemn priests he had avoided in Lahore. This one might be another meddler who would order him into school. But the Umballa priest had proved that Kim's sign in the heavens meant War and armed men. Was Kim not the Friend of the Stars as well as the Friend of all the World, filled to the teeth with dangerous secrets? Beneath all his quick thoughts ran an even stronger one. He did not know the English word for it, but this was a magnificent lark. It carried on his old games across the rooftops and fulfilled a grand prophecy at the same time.
        - id: ch01-b67
          speaker: narrator
          text: Lying flat on his belly, with one hand on the amulet at his neck, Kim wriggled toward the entrance of the mess tent.
        - id: ch01-b68
          speaker: narrator
          text: He found exactly what he expected. The Sahibs were praying to their God. In the center of their mess table stood its only decoration on the march, a golden bull taken long ago from the Summer Palace in Peking. The red-gold animal lowered its head and charged across a field of Irish green. The Sahibs stretched their glasses toward it and shouted together in a muddle.
        - id: ch01-b69
          speaker: narrator
          text: Bennett always left the mess after that toast. He was tired from the day's march, so he moved more sharply than usual. Kim still had his head raised toward the bull on the table when the chaplain stepped directly on his right shoulder blade.
        - id: ch01-b70
          speaker: narrator
          text: Kim twisted beneath the leather boot and rolled aside, knocking Bennett down. The chaplain was always quick to act. He caught Kim by the throat and nearly squeezed the life from him. Kim kicked desperately into Bennett's stomach. Bennett gasped and folded over, but kept his grip. He rolled again, then silently dragged Kim away to his own tent. The Mavericks loved practical jokes, and Bennett decided he had better learn the whole truth before anyone noticed.
        - id: ch01-b71
          speaker: bennett
          text: Why, it is a boy!
          emotion: surprised
        - id: ch01-b72
          speaker: narrator
          text: He pulled his captive beneath the lantern hanging from the tent pole and shook him hard.
        - id: ch01-b73
          speaker: bennett
          text: What were you doing out there? You are a thief. Choor? Mallum?
          emotion: angry
        - id: ch01-b74
          speaker: narrator
          text: Bennett knew very little Hindustani. Kim, ruffled and disgusted, meant to remain the kind of boy Bennett believed him to be. While he caught his breath, he invented a wonderfully convincing story about being related to one of the kitchen servants. At the same time, he kept watching the chaplain's left armpit and the space beneath it.
        - id: ch01-b75
          speaker: narrator
          text: His chance came. Kim ducked toward the door, but Bennett's long arm shot out and caught the back of his neck. The amulet string snapped, and the amulet remained in the chaplain's hand.
        - id: ch01-b76
          speaker: kim
          text: Give it back! Oh, give it to me! Is it lost? Give me those papers!
          emotion: fearful
        - id: ch01-b77
          speaker: narrator
          text: Kim had spoken English, the thin, harsh English of someone born in India. Bennett jumped at the sound.
        - id: ch01-b78
          speaker: bennett
          text: A scapular? No, this is some kind of heathen charm. Why, you speak English! You know that little boys who steal get beaten, do you not?
        - id: ch01-b79
          speaker: kim
          text: I do not steal. I did not take anything!
        - id: ch01-b80
          speaker: narrator
          text: Kim danced in misery like a terrier watching a raised stick.
        - id: ch01-b81
          speaker: kim
          text: Please give it back. It is my charm. Do not steal it from me!
          emotion: fearful
        - id: ch01-b82
          speaker: narrator
          text: Bennett paid no attention. He went to the tent door and called out. A plump, clean-shaven man appeared.
        - id: ch01-b83
          speaker: bennett
          text: I need your advice, Father Victor. I found this boy lurking in the dark outside the mess tent. Normally I would have punished him and sent him away, because I believe he is a thief. But he speaks English, and he seems to care greatly about this charm from his neck. I thought you might be of some help.
        - id: ch01-b84
          speaker: narrator
          text: Bennett believed there was a gulf no one could cross between himself and Father Victor, the Roman Catholic chaplain of the regiment's Irish soldiers. Yet whenever the Church of England met a human difficulty, it was remarkably likely to ask the Church of Rome for help. Bennett's official horror of Rome was matched only by his private respect for Father Victor.
        - id: ch01-b85
          speaker: father_victor
          text: A thief who speaks English, is he? Let me see this charm. No, Bennett, that is not a scapular.
        - id: ch01-b86
          speaker: narrator
          text: Father Victor held out his hand.
        - id: ch01-b87
          speaker: bennett
          text: Do we have the right to open it? A proper whipping would—
        - id: ch01-b88
          speaker: kim
          text: I did not steal! You have kicked me all over. Give me my charm now, and I will go.
        - id: ch01-b89
          speaker: father_victor
          text: You will not go quite yet. First, we will see what is inside.
        - id: ch01-b90
          speaker: narrator
          text: Slowly, Father Victor unrolled poor Kimball O'Hara's ne varietur parchment, his clearance certificate, and Kim's baptism record. O'Hara had covered that last paper again and again with the same request. He begged whoever found it to look after the boy, and each time he wrote his full name and regimental number.
        - id: ch01-b91
          speaker: father_victor
          text: Powers of Darkness below! Do you know what these papers are?
          emotion: surprised
        - id: ch01-b92
          speaker: narrator
          text: Father Victor passed them all to Bennett.
        - id: ch01-b93
          speaker: kim
          text: Yes. They belong to me, and I want to leave.
        - id: ch01-b94
          speaker: bennett
          text: I do not understand this. Perhaps he brought the papers on purpose. This may be some new trick for begging.
        - id: ch01-b95
          speaker: father_victor
          text: I have never seen a beggar so eager to get away from the people he is begging. There is the beginning of a fine mystery here. You believe in Providence, Bennett, do you not?
        - id: ch01-b96
          speaker: bennett
          text: I hope that I do.
        - id: ch01-b97
          speaker: father_victor
          text: Well, I believe in miracles, and that comes to the same thing. Powers of Darkness! Kimball O'Hara, and this is his son! But the boy looks native. I saw Kimball marry Annie Shott myself. Boy, how long have you carried these papers?
          emotion: surprised
        - id: ch01-b98
          speaker: kim
          text: Since I was a very small baby.
        - id: ch01-b99
          speaker: narrator
          text: Father Victor stepped forward quickly and pulled open the front of Kim's upper garment.
        - id: ch01-b100
          speaker: father_victor
          text: Look, Bennett. His skin is not so dark after all. What is your name?
        - id: ch01-b101
          speaker: kim
          text: My name is Kim.
        - id: ch01-b102
          speaker: father_victor
          text: Or is it Kimball?
        - id: ch01-b103
          speaker: kim
          text: It may be. Will you let me go now?
        - id: ch01-b104
          speaker: father_victor
          text: What else are you called?
        - id: ch01-b105
          speaker: kim
          text: People call me Kim Rishti ke. That means Kim of the Rishti.
        - id: ch01-b106
          speaker: father_victor
          text: What does "Rishti" mean?
        - id: ch01-b107
          speaker: kim
          text: Eye-rishti. It was my father's Regiment.
        - id: ch01-b108
          speaker: father_victor
          text: Irish! Now I understand.
        - id: ch01-b109
          speaker: kim
          text: Yess. That is what my father told me. My father has lived.
        - id: ch01-b110
          speaker: father_victor
          text: Where has he lived?
        - id: ch01-b111
          speaker: kim
          text: Has lived. Of course he is dead. He has gone out.
        - id: ch01-b112
          speaker: father_victor
          text: Oh, that is your sudden way of saying it, is it?
        - id: ch01-b113
          speaker: bennett
          text: I may have treated the boy unfairly. He is certainly white, though no one has looked after him properly. I am afraid I bruised him. I do not think strong drink—
        - id: ch01-b114
          speaker: father_victor
          text: Then give him a glass of sherry and let him sit on the cot. Now, Kim, no one will hurt you. Drink it, and tell us who you are. Tell the truth, if you do not mind.
          emotion: calm
        - id: ch01-b115
          speaker: narrator
          text: Kim emptied the glass, coughed a little, and thought. This was a moment for caution, with perhaps a touch of invention. Boys caught roaming through army camps were usually thrown out after a beating. Kim had not been beaten. His amulet seemed to be helping him, while his horoscope from Umballa and the scraps he remembered from his father's rambling talk were fitting together like a miracle. Why else did the fat priest look so amazed? Why had the thin priest given him that hot yellow drink?
        - id: ch01-b116
          speaker: kim
          text: My father died in Lahore when I was very small. A woman kept a secondhand shop near the place where the hired carriages stand.
        - id: ch01-b117
          speaker: narrator
          text: Kim plunged into his story, unsure how much truth would serve him.
        - id: ch01-b118
          speaker: father_victor
          text: Was she your mother?
        - id: ch01-b119
          speaker: kim
          text: No, she was not!
          emotion: disgusted
        - id: ch01-b120
          speaker: narrator
          text: He threw out one hand in disgust.
        - id: ch01-b121
          speaker: kim
          text: My mother went out when I was born. My father got these papers from the Magic House. What do you call it? He got them because he was in good standing. What do you call that? My father told me so. He also said I would find a Red Bull on a green field, and the Bull would help me. The Brahmin who drew my stars in the dust at Umballa two days ago said the same thing.
        - id: ch01-b122
          speaker: narrator
          text: Bennett nodded at Kim's two questions, but muttered under his breath.
        - id: ch01-b123
          speaker: bennett
          text: This child is an extraordinary little liar.
        - id: ch01-b124
          speaker: father_victor
          text: Powers of Darkness below, what a country this is! Go on, Kim.
        - id: ch01-b125
          speaker: kim
          text: I did not steal. And right now I am the disciple of a very holy man. He is waiting outside. We watched two men come with flags and prepare this place. That always happens in a dream, or when a prophecy is coming true. Then I saw the Red Bull on the green field. My father told me nine hundred proper devils and a colonel on horseback would care for me when I found it.
        - id: ch01-b126
          speaker: kim
          text: I did not know what to do when I saw the Bull, so I went away. After dark, I came back for another look. I saw it again while the Sahibs were praying to it. I think the Bull is meant to help me. The holy man thinks so too. He can prove everything I have said and tell you I am no thief. If I call him now, will you hurt him? He is very holy.
        - id: ch01-b127
          speaker: bennett
          text: Sahibs praying to a bull? What can that possibly mean? And now he claims he is a holy man's disciple. Is the boy insane?
        - id: ch01-b128
          speaker: father_victor
          text: He is certainly O'Hara's son. O'Hara's boy has joined himself to all the Powers of Darkness. His father might have done exactly the same thing after too much drink. We had better ask the holy man to come in. He may know something.
        - id: ch01-b129
          speaker: kim
          text: He does not know anything. Come with me, and I will show you where he is. He is my master. After that, we can leave.
        - id: ch01-b130
          speaker: narrator
          text: Father Victor could only call once more on the Powers of Darkness. Bennett marched Kim outside with a firm hand on his shoulder. They found the lama just where Kim had left him.
        - id: ch01-b131
          speaker: kim
          text: My Search has ended! I found the Bull, but God knows what happens next. They will not harm you. Come to the fat priest's tent with this thin man, and see how it ends. Everything is new, and they cannot speak Hindi. They are only donkeys that have never been groomed.
        - id: ch01-b132
          speaker: lama
          text: Then you should not make fun of what they do not know. I am glad if you have found joy, my chela.
        - id: ch01-b133
          speaker: narrator
          text: The lama entered the little tent with dignity and without suspicion. He greeted the two priests as one holy man greeting others, then sat beside the open charcoal brazier. Lamplight reflected from the tent's yellow lining and made his face glow red and gold.
        - id: ch01-b134
          speaker: narrator
          text: Bennett looked at him with the deep, layered indifference of a faith that bundled nine-tenths of humanity together under one name, heathen.
        - id: ch01-b135
          speaker: lama
          text: So how did your Search end? What gift did the Red Bull give you?
        - id: ch01-b136
          speaker: narrator
          text: The lama spoke to Kim.
        - id: ch01-b137
          speaker: bennett
          text: He is asking what we mean to do, is that it?
        - id: ch01-b138
          speaker: narrator
          text: Bennett watched Father Victor uneasily. For reasons of his own, Kim had made himself their interpreter.
        - id: ch01-b139
          speaker: bennett
          text: I cannot see why this fakir should have any claim on the boy. Kim is probably either his victim or his partner. We cannot allow an English child to live this way. If he truly is a Mason's son, he should be sent to the Masonic Orphanage as soon as possible.
        - id: ch01-b140
          speaker: father_victor
          text: That is what you would say as secretary of the Regimental Lodge. Still, we ought to tell the old man what we intend to do. He does not look like a criminal.
        - id: ch01-b141
          speaker: bennett
          text: In my experience, no one can ever reach the bottom of an Oriental mind. Kimball, translate everything I say to this man, word for word.
        - id: ch01-b142
          speaker: narrator
          text: Kim understood the general meaning of Bennett's next few sentences. Then he began his own translation.
        - id: ch01-b143
          speaker: kim
          text: Holy One, the thin fool with the face of a camel says I am a Sahib's son.
        - id: ch01-b144
          speaker: lama
          text: How can that be?
        - id: ch01-b145
          speaker: kim
          text: Oh, it is true. I have known since I was born. He could only discover it by tearing the amulet from my neck and reading every paper. These two think a person born a Sahib must always be one. They mean to keep me with the Regiment or send me to a madrissah, a school. This has happened before, and I always stayed out of their hands.
        - id: ch01-b146
          speaker: kim
          text: The fat fool thinks one thing, and the camel-faced fool thinks another. That makes no difference. Perhaps I must stay here tonight and tomorrow night. It has happened before. Then I will escape and come back to you.
        - id: ch01-b147
          speaker: lama
          text: Tell them you are my chela. Tell them you found me when I was weak and lost. Explain our Search. Surely then they will release you at once.
        - id: ch01-b148
          speaker: kim
          text: I told them already. They laugh and speak about the police.
        - id: ch01-b149
          speaker: bennett
          text: What are you telling him?
        - id: ch01-b150
          speaker: kim
          text: Oh, he says that keeping me will interfere with his business, his urgent private affairs. And if you knew what his business was, you would not hurry to interfere like a beast.
        - id: ch01-b151
          speaker: narrator
          text: Kim had borrowed the grand English phrase from a Eurasian clerk in the Canal Department. Bennett smiled, and the smile annoyed him.
        - id: ch01-b152
          speaker: father_victor
          text: Then what is the old man's business?
        - id: ch01-b153
          speaker: narrator
          text: Father Victor watched the lama's face with real concern.
        - id: ch01-b154
          speaker: kim
          text: There is a River somewhere in this country, and he wishes very much to find it. The River came from an Arrow that was—
        - id: ch01-b155
          speaker: narrator
          text: Kim tapped his foot while he struggled to turn the lama's language into his own rough English.
        - id: ch01-b156
          speaker: kim
          text: Oh, our Lord God Buddha made it, you know. If you wash in that River, all your sins are washed away, and you become as white as cotton wool. I am his disciple. We must find the River because it is very valuable to us.
        - id: ch01-b157
          speaker: narrator
          text: Kim had heard missionaries talk often enough to supply the phrase about sins.
        - id: ch01-b158
          speaker: bennett
          text: Say that once more.
        - id: ch01-b159
          speaker: narrator
          text: Kim repeated it and added still more explanation.
        - id: ch01-b160
          speaker: bennett
          text: This is outrageous blasphemy!
          emotion: angry
        - id: ch01-b161
          speaker: father_victor
          text: Tck, tck. I would give a great deal to speak the local language. A river that washes sin away! How long have the two of you searched for it?
        - id: ch01-b162
          speaker: kim
          text: Oh, for many days. We want to leave now and continue looking. The River is not here, you see.
        - id: ch01-b163
          speaker: father_victor
          text: I understand. But you cannot go on traveling with that old man. It might be different if you were not a soldier's son. Tell him the Regiment will care for you and make you as good a man as your father, as good a man as anyone can make you. If he believes in miracles, he must see that—
        - id: ch01-b164
          speaker: bennett
          text: There is no reason to take advantage of his foolish beliefs.
        - id: ch01-b165
          speaker: father_victor
          text: I am doing nothing of the kind. The boy came here looking for the Red Bull and found his own Regiment. The old man must see that as a miracle. Think of the odds, Bennett. Out of every boy in India, this one boy meets our Regiment while we happen to be marching past. Anyone can see it was destined. Tell him it is Kismet. Kismet, mallum?
        - id: ch01-b166
          speaker: narrator
          text: Father Victor turned toward the lama, but he might just as well have spoken to him about Mesopotamia. The old man's eyes brightened when Kim began to explain.
        - id: ch01-b167
          speaker: kim
          text: They say my horoscope has now come true. They say I was led back to these people and their Red Bull, though you know I only came because I was curious. Now I must attend a school and be turned into a Sahib. I will pretend to agree. At worst, I will eat a few meals away from you. Then I will slip out and follow the road toward Saharunpore.
        - id: ch01-b168
          speaker: kim
          text: Holy One, stay with the woman from Kulu. Do not wander away from her cart before I return, or I may never find you. There can be no doubt that my sign means War and armed men. See, they gave me wine and seated me on a place of honor. My father must have been important. If these men raise me to honor, that is good. If they do not, that is good too. Either way, I will run back when I have had enough. Only stay with the Rajput woman, so I do not lose your feet.
        - id: ch01-b169
          speaker: kim
          text: Oh yess. I have told him everything you wanted me to say.
        - id: ch01-b170
          speaker: bennett
          text: Then I see no reason for him to remain. We can settle the details later. I will give him a rupee—
        - id: ch01-b171
          speaker: father_victor
          text: Give him a little time. Perhaps he cares for the boy.
        - id: ch01-b172
          speaker: narrator
          text: Father Victor half stopped Bennett from reaching into his pocket. The lama pulled out his rosary and lowered the broad brim of his hat over his eyes.
        - id: ch01-b173
          speaker: bennett
          text: What does he want now?
        - id: ch01-b174
          speaker: kim
          text: He says you must be quiet. He wants to speak with me alone. You cannot understand one word he says, and if you keep talking, he may put terrible curses on you. When he holds his beads like that, he always wants silence.
        - id: ch01-b175
          speaker: narrator
          text: The two Englishmen sat speechless. Bennett's eyes promised that once Kim came under religious discipline, he would pay for this insolence.
        - id: ch01-b176
          speaker: lama
          text: A Sahib, and the son of a Sahib.
          emotion: sad
        - id: ch01-b177
          speaker: narrator
          text: Pain had roughened the lama's voice.
        - id: ch01-b178
          speaker: lama
          text: Yet no white man knows this land and its ways as you do. How can this be true?
        - id: ch01-b179
          speaker: kim
          text: What does it matter, Holy One? Remember, it is only for a night or two. Remember how quickly I can change. Soon everything will be as it was when I first spoke to you beneath Zam-Zammah, the great gun.
        - id: ch01-b180
          speaker: lama
          text: You wore a white boy's clothes when I first went to the Wonder House. The next time, you were a Hindu. What will your third life be?
        - id: ch01-b181
          speaker: narrator
          text: The lama gave a sorrowful little chuckle.
        - id: ch01-b182
          speaker: lama
          text: Ah, chela, you have done an old man a wrong, because my heart went out to you.
          emotion: sad
        - id: ch01-b183
          speaker: kim
          text: And my heart went out to you. But how could I know the Red Bull would lead me into this trouble?
          emotion: sad
        - id: ch01-b184
          speaker: narrator
          text: The lama covered his face once more and shook his rosary nervously. Kim crouched beside him and held a fold of his robe.
        - id: ch01-b185
          speaker: lama
          text: So it is settled that the boy is a Sahib?
        - id: ch01-b186
          speaker: narrator
          text: His voice came out muffled, as if he were carefully repeating a lesson.
        - id: ch01-b187
          speaker: lama
          text: A Sahib like the man who guarded the holy images in the Wonder House. Then the boy must do what Sahibs do. He must return to his own people.
        - id: ch01-b188
          speaker: kim
          text: Only for one day, one night, and one more day.
        - id: ch01-b189
          speaker: father_victor
          text: No, you do not!
        - id: ch01-b190
          speaker: narrator
          text: Father Victor saw Kim edging toward the entrance and blocked him with one strong leg.
        - id: ch01-b191
          speaker: lama
          text: I do not understand the ways of white men. The keeper of the images in Lahore was kinder than this thin priest. They mean to take this boy away from me and make my disciple a Sahib. What will become of me? How can I find my River? Do these priests have no disciples of their own? Ask them that.
          emotion: sad
        - id: ch01-b192
          speaker: kim
          text: He is very sorry that he will no longer be able to find the River. He asks why you have no disciples of your own and why you must trouble his. He wants his sins washed away.
        - id: ch01-b193
          speaker: narrator
          text: Neither Bennett nor Father Victor could think of an answer.
        - id: ch01-b194
          speaker: kim
          text: If you let me go now, we will leave quietly and steal nothing. We will search for the River as we did before you caught me. I wish I had never come to find the Red Bull and all these other things. I do not want any of it.
          emotion: sad
        - id: ch01-b195
          speaker: narrator
          text: The lama's pain had shaken Kim.
        - id: ch01-b196
          speaker: bennett
          text: Finding us was the best day's work you ever did for yourself, young man.
        - id: ch01-b197
          speaker: father_victor
          text: Good heavens, I do not know how to comfort him. He cannot take the child away, yet he is a good man. I am sure of that. Bennett, if you offer him that rupee, he will curse you from your roots to your highest branch.
        - id: ch01-b198
          speaker: narrator
          text: They sat listening to one another breathe. Three full minutes passed, then five. At last the lama lifted his head and gazed beyond them into empty space.
        - id: ch01-b199
          speaker: lama
          text: I am a Follower of the Way. The sin was mine, and the punishment is mine. I told myself you had been sent to help me in the Search, but now I understand that I only pretended it was so. My heart went out to you because you were charitable and courteous, and because you had such wisdom in your few years.
          emotion: sad
        - id: ch01-b200
          speaker: lama
          text: A person who follows the Way must not allow the fire of desire or attachment to burn within him. All desire is Illusion. Yet I stepped away from the Way, my chela. You did nothing wrong. I enjoyed watching life on the roads and meeting new people. I shared your delight in everything we saw, when I should have thought only of my Search.
          emotion: sad
        - id: ch01-b201
          speaker: lama
          text: Now you are being taken from me, and I grieve while my River remains far away. I have broken the Law.
          emotion: sad
        - id: ch01-b202
          speaker: narrator
          text: The lama supported his confession with one ancient Chinese teaching, then another, and then a third.
        - id: ch01-b203
          speaker: father_victor
          text: Powers of Darkness below!
        - id: ch01-b204
          speaker: narrator
          text: Father Victor had heard many confessions. He recognized the pain inside every sentence.
        - id: ch01-b205
          speaker: lama
          text: Now I see the sign of the Red Bull was meant for me as well as for you. All Desire is red, and it is evil. I will do penance. I will find my River alone.
          emotion: sad
        - id: ch01-b206
          speaker: kim
          text: At least return to the woman from Kulu. Otherwise you will lose yourself on the roads. She will feed you until I escape and come back.
        - id: ch01-b207
          speaker: narrator
          text: The lama waved one hand. In his mind, the matter was settled. Then he turned to Kim, and his voice changed.
        - id: ch01-b208
          speaker: lama
          text: What do they intend to do with you? Perhaps I can still gain merit and wipe away some of my past wrong.
        - id: ch01-b209
          speaker: kim
          text: They think they will make me a Sahib. I will return the day after tomorrow. Please do not grieve.
        - id: ch01-b210
          speaker: lama
          text: What kind of Sahib? One like this man, or the other one? Or like those men I saw tonight, with swords at their sides and heavy feet?
        - id: ch01-b211
          speaker: kim
          text: Perhaps I will.
        - id: ch01-b212
          speaker: lama
          text: That would not be good. Those men follow desire, and desire leads them into emptiness. You must not become like them.
        - id: ch01-b213
          speaker: kim
          text: The priest at Umballa said my Star was War. I will ask these fools, though there is no real need. I will escape tonight. I only wanted to see something new.
        - id: ch01-b214
          speaker: narrator
          text: Kim asked Father Victor two or three questions in English, then translated the replies for the lama.
        - id: ch01-b215
          speaker: kim
          text: He says you are taking me away, but you cannot tell what you will make of me. He says you must tell him before he leaves, because making a child into a man is no small matter.
        - id: ch01-b216
          speaker: father_victor
          text: You will go to school. After that, we will decide. Kimball, would you like to become a soldier?
        - id: ch01-b217
          speaker: kim
          text: Gorah-log? White folk? No-ah! No-ah! I will not be a soldier.
        - id: ch01-b218
          speaker: narrator
          text: Kim shook his head fiercely. Nothing in him welcomed drill or routine.
        - id: ch01-b219
          speaker: bennett
          text: You will become whatever you are told to become. You ought to be grateful that we mean to help you.
        - id: ch01-b220
          speaker: narrator
          text: Kim smiled at him with pity. If these men imagined he would do anything he did not choose to do, their mistake would only make matters easier.
        - id: ch01-b221
          speaker: narrator
          text: Another long silence followed. Bennett shifted impatiently and proposed calling a sentry to remove the fakir.
        - id: ch01-b222
          speaker: lama
          text: Ask them whether the Sahibs give away learning or sell it.
        - id: ch01-b223
          speaker: narrator
          text: Kim translated the question.
        - id: ch01-b224
          speaker: kim
          text: They say the teacher must be paid, but the Regiment will pay the money. Why should that matter? I will only stay one night.
        - id: ch01-b225
          speaker: lama
          text: And if they pay more money, will they give you better teaching?
        - id: ch01-b226
          speaker: narrator
          text: The lama took no notice of Kim's plan to escape. His beads clicked furiously beneath his fingers, as if the rosary had become a counting frame.
        - id: ch01-b227
          speaker: lama
          text: There is no wrong in paying for learning. Helping an ignorant person toward wisdom always earns merit.
        - id: ch01-b228
          speaker: narrator
          text: Then he turned squarely toward the men who had taken his disciple.
        - id: ch01-b229
          speaker: lama
          text: Ask how much they charge for wise and proper teaching. Ask in which city that teaching is given.
        - id: ch01-b230
          speaker: father_victor
          text: Well, that depends. The Regiment could pay while you attended the Military Orphanage. Or the Punjab Masonic Orphanage might take responsibility, though neither you nor he would understand what that means. But the best education for a boy in India is at St Xavier's in Partibus, in Lucknow.
        - id: ch01-b231
          speaker: narrator
          text: Kim needed time to interpret all that. Bennett tried to hurry him.
        - id: ch01-b232
          speaker: kim
          text: He still wants to know the price.
        - id: ch01-b233
          speaker: father_victor
          text: Two or three hundred rupees each year.
        - id: ch01-b234
          speaker: narrator
          text: Father Victor had gone beyond amazement. Bennett, still impatient, had not understood what the lama intended.
        - id: ch01-b235
          speaker: kim
          text: He says you must write the school's name and the amount of money on paper. Put your own name beneath them. In a few days, he will write a letter to you. He says you are a good man. He says the other priest is a fool. Now he is leaving.
        - id: ch01-b236
          speaker: narrator
          text: The lama rose without warning.
        - id: ch01-b237
          speaker: lama
          text: I follow my Search!
        - id: ch01-b238
          speaker: narrator
          text: He was gone.
        - id: ch01-b239
          speaker: father_victor
          text: He will walk straight into the sentries!
          emotion: fearful
        - id: ch01-b240
          speaker: narrator
          text: Father Victor jumped up as the lama strode outside.
        - id: ch01-b241
          speaker: father_victor
          text: But I cannot leave the boy.
        - id: ch01-b242
          speaker: narrator
          text: Kim made one quick movement to follow, then stopped himself. No sentry challenged anyone outside. The lama had vanished.
        - id: ch01-b243
          speaker: narrator
          text: Kim made himself comfortable on Bennett's cot. The lama had at least promised to remain with the Rajput woman from Kulu. Nothing else mattered much. Kim enjoyed seeing how excited the two priests had become. They spoke softly for a long while. Father Victor pressed some plan upon Bennett, who seemed unable to believe it. All of this was fresh and fascinating, but Kim was growing sleepy.
        - id: ch01-b244
          speaker: narrator
          text: The priests called several men into the tent. One must have been the Colonel his father had promised. They asked Kim an endless number of questions, mostly about the woman who had raised him. Kim answered every one truthfully. From their faces, they did not consider her a suitable guardian.
        - id: ch01-b245
          speaker: narrator
          text: This was the newest adventure yet. Whenever he wished, Kim believed he could escape into the vast, gray, shapeless India beyond the tents, priests, and colonels. In the meantime, if these Sahibs expected to be impressed, he would impress them. After all, he too was white.
        - id: ch01-b246
          speaker: narrator
          text: After a great deal of talk Kim could not follow, they placed him in a sergeant's charge with strict orders not to let him escape. The Regiment would continue to Umballa. From there, the Lodge and the soldiers together would pay to send Kim to a place called Sanawar.
        - id: ch01-b247
          speaker: father_victor
          text: It is more miraculous than any amount of shouting can express, Colonel. His Buddhist friend disappeared after taking my name and address. I cannot decide whether he means to pay for the boy's schooling or prepare some private piece of witchcraft.
        - id: ch01-b248
          speaker: father_victor
          text: Your friend the Red Bull will make you grateful someday. We will turn you into a man at Sanawar, even if making a Protestant of you is part of the price.
        - id: ch01-b249
          speaker: bennett
          text: Certainly. Most certainly.
        - id: ch01-b250
          speaker: kim
          text: But you will not go to Sanawar.
        - id: ch01-b251
          speaker: father_victor
          text: Oh, we will go to Sanawar, little man. The Commander-in-Chief gave the order, and he is a little more important than O'Hara's son.
        - id: ch01-b252
          speaker: kim
          text: You will not go to Sanawar. You will go to thee War.
        - id: ch01-b253
          speaker: narrator
          text: Everyone in the crowded tent burst out laughing.
        - id: ch01-b254
          speaker: colonel
          text: Once you know your own Regiment a little better, you will stop confusing a line of march with a line of battle. We hope to go to thee War one day.
        - id: ch01-b255
          speaker: kim
          text: Oh, I know all thatt. I know you are not at thee War now. But when you reach Umballa, you will be sent to the new war. It will take eight thousand men, besides the guns.
        - id: ch01-b256
          speaker: narrator
          text: Kim drew his bow and loosed another arrow at chance. If the regiment was not yet marching to war, these men at least did not know what he had heard on the veranda in Umballa.
        - id: ch01-b257
          speaker: colonel
          text: That is very exact. Is prophecy another one of your talents? Take him away, Sergeant. Find him a uniform from the drummer boys, and do not let him slip through your hands. Who says miracles have ended? I think I had better sleep. My poor mind is beginning to fail.
        - id: ch01-b258
          speaker: narrator
          text: An hour later, Kim sat at the far end of the camp, silent as a wild creature. Someone had washed every part of him and forced him into a dreadful stiff suit that scraped his arms and legs.
        - id: ch01-b259
          speaker: sergeant
          text: You are a most astonishing young bird. You arrive with a yellow-headed buck-Brahmin priest, carrying your father's Lodge papers around your neck and babbling about some red bull. The buck-Brahmin disappears without a word, and then you sit cross-legged on the chaplain's bed, prophesying bloody war to every man who will listen.
        - id: ch01-b260
          speaker: sergeant
          text: India is a wild country for a God-fearing man. I will tie your leg to the tent pole, in case you try to escape through the roof. Now, what was that you said about the war?
        - id: ch01-b261
          speaker: kim
          text: Eight thousand men, besides the guns. You will see very soon.
        - id: ch01-b262
          speaker: sergeant
          text: You are a comforting little imp. Lie down between the drummer boys and go to sleep. Those two will watch you through the night.
