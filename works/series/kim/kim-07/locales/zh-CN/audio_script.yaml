audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts: {delivery: "从容而机敏的讲述", timbre: "温暖清晰", pace: "舒展而有变化", pitch: "中音"}
    kim:
      display_name: 金
      tts: {delivery: "机灵大胆，话里常带笑", timbre: "明亮的少年声", pace: "轻快敏捷", pitch: "中高音"}
    victor:
      display_name: 维克托神父
      tts: {delivery: "爽直机敏，惊叹时仍带温厚", timbre: "圆润厚实", pace: "从容", pitch: "中低音"}
    schoolmaster:
      display_name: 校长
      tts: {delivery: "暴躁专横，训斥生硬", timbre: "干硬低沉", pace: "急促", pitch: "中低音"}
    drummer_boy:
      display_name: 鼓手少年
      tts: {delivery: "尖刻自大，满口抱怨", timbre: "尖细的少年声", pace: "急快", pitch: "高音"}
    scribe:
      display_name: 代书人
      tts: {delivery: "精明谨慎，处处盘算", timbre: "清薄利落", pace: "平稳", pitch: "中音"}
    mahbub:
      display_name: 马哈布·阿里
      tts: {delivery: "老练深沉，幽默里藏着试探", timbre: "粗厚低沉", pace: "从容", pitch: "低音"}
    creighton:
      display_name: 克赖顿上校
      tts: {delivery: "彬彬有礼，观察敏锐，偶带干练的玩笑", timbre: "清朗沉稳", pace: "平稳", pitch: "中低音"}
    driver:
      display_name: 车夫
      tts: {delivery: "市侩直率，抱怨里带着打趣", timbre: "粗亮结实", pace: "稍快", pitch: "中音"}
    lama:
      display_name: 喇嘛
      tts: {delivery: "慈悲诚挚，沉思中带着温柔", timbre: "苍老柔和", pace: "缓慢", pitch: "中低音"}
    teacher:
      display_name: 老师
      tts: {delivery: "克制平淡，带着管教口吻", timbre: "清晰端正", pace: "平稳", pitch: "中音"}
    naikan:
      display_name: 纳伊坎
      tts: {delivery: "泼辣俏皮，打趣时爽朗利落", timbre: "明亮圆润", pace: "轻快", pitch: "中高音"}
  chapters:
    - id: ch01
      title: 第七章
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: "孕育万物的太阳，会为谁停下来？痴愚的月亮下面，群星又为何循迹追逐？悄悄从中爬过去吧，你来了，也不会有人知道。天上有崇高的战争，地下也有卑微的争斗。亚当和列祖留下的罪，使你继承骚乱、惊惧与厮杀，永远受它们束缚。抬头窥望群星，排出星盘，说一说，哪颗星会补好你褴褛的命运，哪颗又会把它毁掉。这首诗出自约翰·克里斯蒂爵士。"
        - id: ch01-b02
          speaker: narrator
          text: "到了下午，红脸校长告诉金，他已经从名册上划掉了。金起先没听明白，直到校长叫他出去玩，他才知道自己自由了。他立刻跑进集市，找到那个替他垫过邮票钱的年轻代书人。"
        - id: ch01-b03
          speaker: kim
          text: "我现在来还钱，还要请你替我再写一封信。"
        - id: ch01-b04
          speaker: scribe
          text: "马哈布·阿里正在安巴拉。"
        - id: ch01-b05
          speaker: narrator
          text: "代书人说得轻快。他干这一行，什么假消息都能从他这里打听到。"
        - id: ch01-b06
          speaker: kim
          text: "不是写给马哈布，是写给一位祭司。快拿笔。地址写贝拿勒斯耆那教寺院，转交从菩提亚来、正在寻找一条河的圣人德舒喇嘛。墨蘸足一点。再写，三天以后，我要去勒克瑙，在一所叫圣泽维尔的学校读书。我不知道学校在哪里，只知道它在勒克瑙。"
        - id: ch01-b07
          speaker: scribe
          text: "勒克瑙我熟，那所学校我也知道。"
        - id: ch01-b08
          speaker: kim
          text: "那就把详细地址写给他，我多给你半安那。"
        - id: ch01-b09
          speaker: narrator
          text: "芦管笔沙沙地跑过纸面。代书人写完地址，抬头朝街对面看去。"
        - id: ch01-b10
          speaker: scribe
          text: "这样一来，他怎么也不会找错了。不过，街对面那个人是谁？他一直盯着我们。"
        - id: ch01-b11
          speaker: narrator
          text: "金赶紧回头。克赖顿上校穿着网球衣，正站在那里。"
        - id: ch01-b12
          speaker: kim
          text: "哦，那位少爷认识营房里的胖祭司。他在叫我过去。"
        - id: ch01-b13
          speaker: narrator
          text: "金小跑着来到上校面前。"
        - id: ch01-b14
          speaker: creighton
          text: "你在忙什么？"
        - id: ch01-b15
          speaker: kim
          text: "我没有逃跑。我只是在给贝拿勒斯的圣人寄信。"
        - id: ch01-b16
          speaker: creighton
          text: "这一点我倒没想到。你有没有告诉他，我要带你去勒克瑙？"
        - id: ch01-b17
          speaker: kim
          text: "没有。你不相信，就自己读信。"
        - id: ch01-b18
          speaker: creighton
          text: "既然是写给那位圣人，你为什么不把我的名字写进去？"
        - id: ch01-b19
          speaker: narrator
          text: "上校笑得有些古怪。金鼓起勇气回答。"
        - id: ch01-b20
          speaker: kim
          text: "以前有人教过我，办一件事时若牵涉到陌生人，最好别把那人的名字写下来。很多好计划，都是因为姓名落在纸上才坏掉的。"
        - id: ch01-b21
          speaker: creighton
          text: "教你这话的人很高明。我把雪茄烟盒忘在神父的走廊上了，今晚送到我家来。"
        - id: ch01-b22
          speaker: narrator
          text: "金红了脸。他敏捷的脑筋又提醒他，上校正在用某种办法考验自己，于是马上警觉起来。"
        - id: ch01-b23
          speaker: kim
          text: "你住在哪里？"
        - id: ch01-b24
          speaker: creighton
          text: "到大集市随便找个人问问。"
        - id: ch01-b25
          speaker: narrator
          text: "上校说完便走。金回到代书人那里。"
        - id: ch01-b26
          speaker: kim
          text: "他把雪茄烟盒忘了，今晚要我送去。信就写到这里，最后再写三遍，来找我，来找我，来找我。邮票钱我现在付，你替我把信寄走。"
        - id: ch01-b27
          speaker: narrator
          text: "金起身要走，又像临时想起来似的，随口问了一句。"
        - id: ch01-b28
          speaker: kim
          text: "那个丢了雪茄烟盒、长着一张凶脸的少爷，到底是谁？"
        - id: ch01-b29
          speaker: scribe
          text: "他就是克赖顿少爷。一个蠢得透顶的少爷，做了上校，却连自己的兵团都没有。"
        - id: ch01-b30
          speaker: kim
          text: "他靠什么过日子？"
        - id: ch01-b31
          speaker: scribe
          text: "天知道。他老买自己不会骑的马，还尽问些稀奇古怪的问题，草木石头啦，各地人的风俗啦，都是上帝造出的东西。马贩子都叫他傻瓜之父，因为谁都能在卖马上骗他。马哈布·阿里说，他比多数少爷疯得还厉害。"
        - id: ch01-b32
          speaker: kim
          text: "哦，原来如此。"
        - id: ch01-b33
          speaker: narrator
          text: "金离开以后，把自己见过的人和事一一放到心里掂量。谁会把一条足以调动八千人和大炮的消息交给傻瓜？全印度的总司令，也不会用金亲耳听过的那种口气同傻瓜讲话。马哈布每次提到上校，声音都会改变。如果上校真傻，马哈布绝不会这样。"
        - id: ch01-b34
          speaker: narrator
          text: "想到这里，金高兴得跳了起来。这里面一定有秘密。马哈布替上校打探消息，就像金替马哈布打探一样。上校也像那个马贩子，他看重的是那些不肯显得太聪明的人。"
        - id: ch01-b35
          speaker: narrator
          text: "金很庆幸，自己没露出早已知道上校住处的底细。他回到营房，发现走廊上根本没有雪茄烟盒，更是满脸笑容。这个人正合他的胃口。他绕着弯子，把自己藏得严严实实，玩的是暗中的游戏。好吧，上校能装傻，金也能。"
        - id: ch01-b36
          speaker: narrator
          text: "接连三个漫长的早晨，维克托神父给金讲一整套陌生的神祇，金始终不露心思。里面最要紧的是一位名叫玛利亚的女神。金听来听去，觉得她同马哈布信仰中的比比·米丽娅姆就是一位。讲完课，神父又拖着他一家店一家店地置办行装，金也默默跟着。鼓手少年嫉妒他能去更好的学校，抬脚踢他，他仍不抱怨，只等着时势自己变化。"
        - id: ch01-b37
          speaker: narrator
          text: "最后，好心的维克托神父亲自送他到车站，把他安置在空荡荡的二等车厢。紧挨着的头等车厢里坐着克赖顿上校。神父真心实意地同金道别。"
        - id: ch01-b38
          speaker: victor
          text: "奥哈拉，圣泽维尔会把你教成一个男子汉，一个白人，我也希望是一个好人。学校知道你要来，上校会看着你，免得你半路走丢，或被人送错地方。宗教方面，我总算让你有了一点概念，至少我希望如此。以后有人问你信什么教，记得说自己是天主教徒。最好说罗马天主教，虽说我不太喜欢罗马这两个字。"
        - id: ch01-b39
          speaker: narrator
          text: "金早就在集市买足了味道呛人的香烟。他点上一支，躺下来想心事。这回他孤零零地旅行，跟从前陪喇嘛坐三等车南下的快活完全不同。"
        - id: ch01-b40
          speaker: kim
          text: "少爷们坐车，原来一点也不快活。嗨，妈呀！他们把我从一个地方踢到另一个地方，真像踢皮球。这是我的命数，谁也逃不开自己的命数。可我还得向比比·米丽娅姆祷告，而且我是个少爷。"
        - id: ch01-b41
          speaker: narrator
          text: "他愁眉苦脸地看看脚上的靴子，心思又变了。"
        - id: ch01-b42
          speaker: kim
          text: "不，我是金。外面是广大的世界，我只是金。可金到底是谁？"
        - id: ch01-b43
          speaker: narrator
          text: "他从没这样想过自己的身份，越想越觉得头晕。整个印度都在轰鸣旋转，他只是其中一个微不足道的人，坐着火车一路向南，奔向完全不知道的命运。"
        - id: ch01-b44
          speaker: narrator
          text: "过了一阵，上校把金叫到自己的车厢，跟他谈了很久。金听明白了大意。他得用功读书，将来进印度测量局，先做一名测链员。如果成绩好，也通过那些考试，到了十七岁，每个月就能挣三十卢比。克赖顿上校还会替他安排合适的差事。"
        - id: ch01-b45
          speaker: narrator
          text: "一开始，金装作上校每说三句话，他最多只能听懂一句。上校察觉自己用错了语言，立刻换成流利又生动的乌尔都语，金这才满意。一个人把这门语言懂得这么透，走动时又轻得没有声音，眼睛也不像其他少爷那样迟钝肥厚，他绝不可能是傻瓜。"
        - id: ch01-b46
          speaker: creighton
          text: "你还得学会画道路、山岭和河流。先用眼睛把景物收进去，牢牢记住，等时候合适，再把它们画到纸上。也许有一天，你成了测链员，跟我一起办事。我叫你翻过几座山，看看山后面有什么。可有人警告你，山里住着坏人，他们若发现测链员是一副少爷模样，就会把他杀掉。你会怎么办？"
        - id: ch01-b47
          speaker: narrator
          text: "金想了一会儿。顺着上校递来的话头走下去，到底安不安全？"
        - id: ch01-b48
          speaker: kim
          text: "我会把那个人的警告告诉你。"
        - id: ch01-b49
          speaker: creighton
          text: "可要是我再说，我给你一百卢比，你替我弄清山后的消息，画下河流，还要听听村里人在谈什么。这样呢？"
        - id: ch01-b50
          speaker: kim
          text: "我哪知道？我还是个孩子，等长成男人再说吧。不过，我想用不了几天，我就能挣到那一百卢比。"
        - id: ch01-b51
          speaker: creighton
          text: "你准备走哪条路？"
        - id: ch01-b52
          speaker: narrator
          text: "金坚决地摇头。"
        - id: ch01-b53
          speaker: kim
          text: "我要是说出挣钱的办法，别人也许会听见，抢在我前面。消息不能白送。"
        - id: ch01-b54
          speaker: creighton
          text: "现在就告诉我。"
        - id: ch01-b55
          speaker: narrator
          text: "上校举起一枚卢比。金伸出半只手，又收了回来。"
        - id: ch01-b56
          speaker: kim
          text: "不行，少爷。我知道这个答案值多少钱，却不知道你为什么要问。"
        - id: ch01-b57
          speaker: creighton
          text: "那就把钱当作礼物。你心里有股好精神，别让圣泽维尔把它磨钝。那里不少孩子瞧不起本地人。"
        - id: ch01-b58
          speaker: narrator
          text: "克赖顿把钱抛给金。"
        - id: ch01-b59
          speaker: kim
          text: "那些孩子的母亲，就是集市里的女人。"
        - id: ch01-b60
          speaker: narrator
          text: "金很清楚，混血儿对自己的本地亲族抱着怎样的仇恨，世上很少有别的恨意能同它相比。"
        - id: ch01-b61
          speaker: creighton
          text: "没错。可你是少爷，也是少爷的儿子。无论到了什么时候，都别让别人带得你轻视本地人。我见过刚进政府机关的孩子，故意装作听不懂本地人的话，也不懂他们的规矩，最后因为无知被扣了薪水。世上最大的罪就是无知。把这句话记住。"
        - id: ch01-b62
          speaker: narrator
          text: "火车向南走了整整二十四小时。上校好几次叫金过去，每回都把最后那番道理讲给他听。"
        - id: ch01-b63
          speaker: kim
          text: "这么说，上校、马哈布·阿里，还有将来做测链员的我，全都拴在同一根牵绳上。他大概会像马哈布使唤我那样使唤我。只要能让我回到大路上，那就很好。这身衣服穿了这么久，还是一点也不舒服。"
        - id: ch01-b64
          speaker: narrator
          text: "火车开进拥挤的勒克瑙车站，金没有看见喇嘛。他忍住失望。上校把他和收拾整齐的行李一起塞进出租马车，让他独自去圣泽维尔。"
        - id: ch01-b65
          speaker: creighton
          text: "我不说再见，因为我们还会见面。只要你心里真有那股好精神，我们会见许多次。不过，你还没有受过考验。"
        - id: ch01-b66
          speaker: kim
          text: "那天晚上，我把白种公马的血统送给你，那也不算考验吗？"
        - id: ch01-b67
          speaker: narrator
          text: "金竟大胆地对上校用了平辈之间的你。"
        - id: ch01-b68
          speaker: creighton
          text: "善于忘记的人，得到的最多，小兄弟。"
        - id: ch01-b69
          speaker: narrator
          text: "上校的目光像是一下穿透了金的两片肩胛骨，吓得他赶紧缩进车里。足足过了将近五分钟，金才缓过气来。他闻了闻陌生的空气，觉得十分满意。"
        - id: ch01-b70
          speaker: kim
          text: "这是一座富城，比拉合尔还富。这里的集市一定好得很。车夫，先带我去城里的集市转转。"
        - id: ch01-b71
          speaker: driver
          text: "我的吩咐是把你送到学校。"
        - id: ch01-b72
          speaker: narrator
          text: "车夫竟对一个白人用了不客气的你字。金立刻用最清楚、最流利的本地话指出他的错误，然后爬上车夫座。两个人一下有了默契，在城里来来回回逛了两个钟头。金一路看，一路比较，尽情欣赏。"
        - id: ch01-b73
          speaker: narrator
          text: "要说浓艳华丽的美，除了众城之后孟买，没有哪座城市胜得过勒克瑙。站在跨河大桥上望过去，或登上伊玛目陵，看恰塔尔曼济尔宫的金伞顶和藏在树丛里的全城，都一样美。历代君王用奇异的建筑装点它，出钱设立慈善机构，让领取俸金的闲人挤满城中，也让鲜血浸透这里。懒散、阴谋和奢靡汇聚在一起，这座城还同德里争着说，世上只有自己的乌尔都语最纯正。"
        - id: ch01-b74
          speaker: kim
          text: "真是一座好城，太美了。"
        - id: ch01-b75
          speaker: narrator
          text: "车夫是勒克瑙人，听见夸奖十分高兴，便给金讲了许多惊人的故事。英国向导若来带路，只会没完没了地讲那场兵变。"
        - id: ch01-b76
          speaker: kim
          text: "现在可以去学校了。"
        - id: ch01-b77
          speaker: narrator
          text: "古老宏伟的域外圣泽维尔学校，坐落在辽阔的庭园里。一排排低矮的白房子，隔着一段路望向戈姆蒂河。"
        - id: ch01-b78
          speaker: kim
          text: "那里面都住着什么人？"
        - id: ch01-b79
          speaker: driver
          text: "小少爷，全是魔鬼。我常把他们从车站接来送去，可说实话，还没见过哪一个比我车上这位小少爷更配做十全十美的魔鬼。"
        - id: ch01-b80
          speaker: narrator
          text: "没人教过金，哪些女人是所谓不合规矩的女人。所以路过一条街时，他自然同几扇楼窗里的轻佻女子打了招呼，也很会接她们的俏皮话。他正要回敬车夫，眼角忽然扫到一个人影。天色渐暗，那人正坐在长墙的一根白灰门柱旁。"
        - id: ch01-b81
          speaker: kim
          text: "停车！在这里等着，我还不进学校。"
        - id: ch01-b82
          speaker: driver
          text: "你这样跑来跑去，车钱谁付？这孩子是不是疯了？刚才是舞女，现在又来了个祭司。"
        - id: ch01-b83
          speaker: narrator
          text: "金一头跳下车，伸手抚摸脏黄袍子下面那双沾满尘土的脚。"
        - id: ch01-b84
          speaker: lama
          text: "我已经在这里等了一天半。不，我不是独自来的，身边有一个弟子。耆那教寺院里的朋友派了向导，领我走完这一段路。你的信一到，我便从贝拿勒斯坐火车来了。是的，我吃得很好，什么也不缺。"
        - id: ch01-b85
          speaker: kim
          text: "圣人，你为什么没留在库卢女人那里？后来又怎么到了贝拿勒斯？我们分开以后，我心里一直沉甸甸的。"
        - id: ch01-b86
          speaker: lama
          text: "那个女人总说个不停，还不断叫我替孩子们做护符，我实在厌倦了。我离开他们，只让她用布施积一点功德。她至少很大方。我也答应过，若有需要，便会回她家。后来，我发现自己独自待在这个广大又可怕的世界，便想到了坐火车去贝拿勒斯。耆那教寺院里有位朋友，他同我一样，也在寻道。"
        - id: ch01-b87
          speaker: kim
          text: "啊，你寻找的河！我竟把那条河忘了。"
        - id: ch01-b88
          speaker: lama
          text: "这么快就忘了，我的弟子？我从来没忘。不过离开你以后，我觉得应该先去寺里请教。印度这么大，也许从前有两三位智者，留下过那条河在何处的记载。寺里的人为这件事争个不停，有人这样说，有人那样说，可他们都很有礼。"
        - id: ch01-b89
          speaker: kim
          text: "那也不错。可你现在为什么会在这里？"
        - id: ch01-b90
          speaker: lama
          text: "我帮助弟子获得智慧，也是在积累功德。侍奉红公牛那些人的祭司写信告诉我，你的事情会照我的愿望办理。我寄去足够一年的钱，随后就来到这里。我想亲眼看着你走进学问之门。我等了一天半，不是被对你的情爱引来，那不合正道。寺里的人说，既然学费是我付的，我便应该亲眼看着这件事办妥。他们把我的疑惑解释清楚了。我原先还怕，自己只是想见你，被情爱的红雾迷住才来到这里。其实并不是这样。还有一个梦，一直让我不安。"
        - id: ch01-b91
          speaker: kim
          text: "可你没有忘记大路，也没有忘记我们在路上经历的事，对不对？圣人，你来这里，总有一点是为了见我吧？"
        - id: ch01-b92
          speaker: driver
          text: "马都冷了，喂食的时候也早过了。"
        - id: ch01-b93
          speaker: kim
          text: "滚进火狱，去陪你那个不要脸的姨妈！我孤零零地留在这片土地上，不知道该去哪里，也不知道会遇到什么。我寄给你的信里，装着我的整颗心。除了马哈布·阿里，可他是个普什图人，我再没有别的朋友了，只有你，圣人。求你别彻底离开我。"
          emotion: sad
        - id: ch01-b94
          speaker: lama
          text: "这件事，我也想过。若到那时我仍没找到自己的河，我可以偶尔来看你，看看你的脚有没有走在智慧之路上，这样也能积累功德。我不知道他们会教你什么，不过祭司来信说，全印度少爷们的儿子，没有谁能得到比你更好的教导。所以我会时常回来。也许你会成为拉合尔奇迹屋里那位送我眼镜的少爷。他是一股智慧的泉水，比很多寺院住持还聪明。我盼你成为那样的人。也许，你又会把我忘了，连我们相逢的日子也忘掉。"
          emotion: sad
        - id: ch01-b95
          speaker: narrator
          text: "喇嘛说话时声音发颤，又仔细擦了擦眼镜。"
        - id: ch01-b96
          speaker: kim
          text: "我吃着你给的饭，怎么可能把你忘掉？"
          emotion: sad
        - id: ch01-b97
          speaker: narrator
          text: "喇嘛把孩子轻轻推开。"
        - id: ch01-b98
          speaker: lama
          text: "不，不。我必须回贝拿勒斯。现在我已经懂得这里代书人的规矩，会不时给你寄信，也会偶尔来看你。"
          emotion: sad
        - id: ch01-b99
          speaker: kim
          text: "可我该把信寄到哪里？"
          emotion: sad
        - id: ch01-b100
          speaker: narrator
          text: "金抓紧喇嘛的袍子哀叫，早已忘了自己还是个少爷。"
        - id: ch01-b101
          speaker: lama
          text: "寄到贝拿勒斯的耆那教寺院。在找到我的河以前，我就在那里落脚。不要哭。一切欲念都是幻象，只会给轮回多添一道束缚。走进学问之门吧，让我看着你进去。你爱我吗？那就走吧，不然我的心会裂开。我会再来，一定会再来。"
          emotion: sad
        - id: ch01-b102
          speaker: narrator
          text: "喇嘛望着出租马车隆隆驶进校园，随后迈开大步离去。每走出长长一步，他便抽一下鼻子。"
        - id: ch01-b103
          speaker: narrator
          text: "学问之门哐当一声关上了。"
        - id: ch01-b104
          speaker: narrator
          text: "在印度出生长大的孩子，有一套自己的脾气和习惯，同别处任何国家的孩子都不同。老师接近他们的办法，也不是英国教师能够理解的。所以，金在圣泽维尔两三百名早熟少年当中究竟经历了什么，大概不值得一件件细说。那些孩子大多从没见过大海。城里发生霍乱时，金擅自跑出校界，自然挨了通常的惩罚。那时他还写不好英文，只能去找集市里的代书人。他抽烟，又骂出连圣泽维尔都没听过的粗野脏话，当然也受了申斥。"
        - id: ch01-b105
          speaker: narrator
          text: "他学着土生土长的人，用近乎《利未记》那样严苛的规矩，把身体洗得干干净净，因为这些人心底总觉得英国人不大干净。炎热的夜晚，孩子们躺在寝室里翻来滚去，故事一直讲到天亮。金照例捉弄那些耐心拉风扇的苦力，也暗暗拿自己同那些独立自信的同学比较。"
        - id: ch01-b106
          speaker: narrator
          text: "这些学生的父亲，有的是铁路、电报和运河部门的下级官员，有的是准尉，或已经退役，或在某个土邦王公的军队里做总司令。还有人的父亲是印度海运署船长、领取政府俸金的人、种植园主、管辖区的店主或传教士。少数孩子来自达兰托拉扎根已久的欧亚混血家族，像佩雷拉家、德索萨家和德席尔瓦家。他们明明供得起孩子去英国读书，却全家都爱这所陪伴他们长大的学校，于是一代又一代面色微黄的学生，又走进圣泽维尔。"
        - id: ch01-b107
          speaker: narrator
          text: "他们的家散布在四面八方。有铁路人聚居的豪拉，有蒙吉尔和丘纳尔那样荒废的兵站，有西隆方向偏远的茶园，也有他们父亲在奥德或德干做大地主的村庄。有的家在离铁路还要走一星期的传教站，有的远在南方一千英里、面对黄铜般灼亮海浪的港口，还有的在更南面的金鸡纳种植园。"
        - id: ch01-b108
          speaker: narrator
          text: "他们往返学校遇到的事情，在自己看来一点也不算历险，可只要说出来，西方孩子准会听得头发直竖。他们习惯独自穿过上百英里的丛林，路上若被老虎耽搁，反而觉得是件好事。可要他们到英国八月的英吉利海峡里游泳，他们也会像世界另一头那些任由豹子嗅轿子的兄弟一样，死活不肯下水。"
        - id: ch01-b109
          speaker: narrator
          text: "一个十五岁的孩子曾被困在洪水中央的小岛上，待了一天半，便理所当然地接管了一群从圣地归来、惊慌失措的朝圣者。还有高年级学生讲过，一年雨季冲掉了通往父亲庄园的车道，他们便以圣方济各·泽维尔的名义，征用路上遇见的一位王公的大象，还差点让那头巨兽陷进流沙。另一个孩子说，在猎头的阿卡人还敢袭击偏远种植园的时候，他曾帮父亲从走廊上开枪，击退过一次冲锋。没有谁怀疑他。"
        - id: ch01-b110
          speaker: narrator
          text: "每个故事都用土生土长的人那种平稳、不动感情的口气讲出来。话里混着他们从本地乳母那里无意学来的古怪议论，还有些句子，一听就知道是刚从本地语言翻成英语的。金一边看，一边听，心里很满意。这可不是鼓手少年那种寡淡的谈话，翻来覆去只有几个词。他们讲的是金熟悉，也多少懂得的生活。这里的气息很适合他，他一寸一寸地长起来。"
        - id: ch01-b111
          speaker: narrator
          text: "天气转暖后，学校发给他一套白哔叽衣服。身体新得到的舒适让他高兴，用磨得锋利的头脑对付功课，也同样让他高兴。他的敏捷足以让英国教师惊叹，不过圣泽维尔很懂这种被阳光和环境催熟的脑子。它们起初跑得飞快，到了二十二三岁，却往往有一半会垮下来。"
        - id: ch01-b112
          speaker: narrator
          text: "即使这样，金仍记得藏起自己的本事。炎热夜晚，大家讲起往事，他从不拿自己的回忆压倒别人，因为圣泽维尔瞧不起彻底本地化的孩子。人不能忘记自己是少爷，将来通过考试，就要去统率本地人。金把这一点记住，因为他渐渐明白，考试会把一个人带到什么地方。"
        - id: ch01-b113
          speaker: narrator
          text: "随后，八月到十月的假期到了。炎热和雨季逼得学校放这段长假。有人通知金，他得往北走，去安巴拉后面山中的某个兵站，维克托神父会替他安排。"
        - id: ch01-b114
          speaker: kim
          text: "是去军营学校吗？"
        - id: ch01-b115
          speaker: narrator
          text: "金已经问过许多问题，自己想得更多。"
        - id: ch01-b116
          speaker: teacher
          text: "我想是的。让你少闯一点祸，总没有坏处。你可以跟小德卡斯特罗结伴，一起走到德里。"
        - id: ch01-b117
          speaker: narrator
          text: "金把这件事从头到尾想了很多遍。上校劝他用功，他也确实一直认真读书。同伴们的谈话早让他知道，假期应该由孩子自己支配。况且，已经见识过圣泽维尔，再去军营学校，简直像去受刑。"
        - id: ch01-b118
          speaker: narrator
          text: "还有一样魔法，比其他一切都更厉害。他已经会写字了。三个月里，金发现，只要花半安那，再加上一点知识，人不必借助第三者，也能彼此说上话。喇嘛一直没有来信，可大路仍在那里。金想念软泥从脚趾缝里挤出来的温柔感觉。"
        - id: ch01-b119
          speaker: narrator
          text: "他想到羊肉跟黄油、卷心菜炖在一起，想到撒满浓香豆蔻的米饭，染成藏红花色的饭，还有蒜头、洋葱和集市里不许他吃的油腻甜食，口水一下涌了出来。军营学校只会塞给他一盘生牛肉，连抽烟都得偷偷摸摸。可他又想，自己是少爷，在圣泽维尔上学，还有马哈布·阿里那头猪。不，他不能去试探马哈布肯不肯供他吃喝。可是，他独自在寝室里想透以后，认定从前对马哈布并不公平。"
        - id: ch01-b120
          speaker: narrator
          text: "学校已经空了，老师也几乎全走光。克赖顿上校给的火车通行证，就握在金手中。他颇为得意，因为自己没有拿上校或马哈布的钱挥霍玩乐，身边还剩两卢比七安那。新牛皮箱写着K、O、H三个字母，跟铺盖卷一起留在空寝室。"
        - id: ch01-b121
          speaker: kim
          text: "少爷们总被行李拴住。你们就老老实实待在这里吧。"
        - id: ch01-b122
          speaker: narrator
          text: "金朝箱子和铺盖点点头，脸上露出顽皮的笑，随即走进温暖的雨里。他去找一所早已记住门面的房子。"
        - id: ch01-b123
          speaker: naikan
          text: "哎呀！你知不知道这片街住的是什么女人？真是不害臊。"
        - id: ch01-b124
          speaker: narrator
          text: "金照本地人的姿势，蹲在楼上房间的软垫上。"
        - id: ch01-b125
          speaker: kim
          text: "难道我是昨天才出生的？只要一点染料，再给我三码布，帮我开个玩笑。这要求还算多吗？"
        - id: ch01-b126
          speaker: naikan
          text: "她是谁呀？按少爷们算年纪的办法，你还小得很，不该玩这种鬼把戏。"
        - id: ch01-b127
          speaker: kim
          text: "她是兵站里一个兵团校长的女儿。我穿着这套衣服翻过他们家的墙，她父亲已经揍过我两回。现在我要扮成园丁家的孩子。那个老头最会吃醋。"
        - id: ch01-b128
          speaker: naikan
          text: "这倒没说错。把脸稳住，我给你涂上染料。"
        - id: ch01-b129
          speaker: kim
          text: "别涂得太黑，纳伊坎。我可不想让她以为我是阿比西尼亚黑鬼。"
        - id: ch01-b130
          speaker: naikan
          text: "爱情哪会管这些。她多大？"
        - id: ch01-b131
          speaker: kim
          text: "大概十二岁。胸口也要涂。万一她父亲扯掉我的衣服，看见身上一块黑一块白，那可就糟了。"
        - id: ch01-b132
          speaker: narrator
          text: "这个没脸没皮的孩子笑了起来。姑娘一面忙，一面把卷起的布蘸进盛着棕色染料的小碟，再往金的皮肤上轻轻拍。这种颜色，比任何核桃汁都难洗掉。"
        - id: ch01-b133
          speaker: kim
          text: "现在再叫人找块包头巾的布来。哎呀，我的头一点也没剃！他肯定会把我的头巾打下来。"
        - id: ch01-b134
          speaker: naikan
          text: "我不是剃头匠，不过也能凑合。你天生就是个让人伤心的家伙！费这么大力气乔装，只为了玩一个晚上。记着，这染料洗不掉。可谁给我钱呢？就算胡妮法亲自动手，也涂不出比这更好的颜色。"
          emotion: happy
        - id: ch01-b135
          speaker: narrator
          text: "她笑得浑身发颤，手镯和脚铃叮叮当当地响。"
        - id: ch01-b136
          speaker: kim
          text: "我的姐姐，相信诸神吧。再说，你以前替少爷这样染过颜色吗？"
        - id: ch01-b137
          speaker: naikan
          text: "从来没有。可一个玩笑又不能拿来当钱花。"
        - id: ch01-b138
          speaker: kim
          text: "这可比钱值钱多了。"
        - id: ch01-b139
          speaker: naikan
          text: "孩子，你一定是我这辈子见过最不要脸的魔鬼之子。你拿这种把戏浪费一个可怜姑娘的时间，到最后还要问，这个玩笑还不够吗？你将来准会飞黄腾达。"
        - id: ch01-b140
          speaker: narrator
          text: "她故意照舞女的样子行了个礼。"
        - id: ch01-b141
          speaker: kim
          text: "反正都一样。快把我的头发随便剪短些。"
        - id: ch01-b142
          speaker: narrator
          text: "金兴奋得眼睛发亮。想到前面那些丰足的好日子，他的两只脚一直动个不停。他付给姑娘四安那，跑下楼时，已经彻底变成一个低种姓的印度教男孩，每个细节都挑不出错。下一站是饭铺，他大吃了一顿，把油腻又奢侈的美食享了个够。"
        - id: ch01-b143
          speaker: narrator
          text: "到了勒克瑙车站，金看着浑身长满痱子的小德卡斯特罗钻进二等车厢，自己却屈尊坐进三等车厢，很快就成了全车最引人注目的人。他告诉大家，自己是个戏法师的助手，因为发烧生病，师父才把他留下。他要到安巴拉去追上师父。乘客换了一拨又一拨，他的故事也跟着不断变化。那份刚刚萌芽、又因为太久不能说本地话而越长越旺的想象力，尽情替他添枝加叶。那天夜里，全印度再没有谁比金更快活。"
        - id: ch01-b144
          speaker: narrator
          text: "他在安巴拉下车，向东走进湿透的田野，踩着一处处积水，前往那位老兵住的村庄。差不多就在这个时候，远在西姆拉的克赖顿上校收到勒克瑙发来的电报，说小奥哈拉失踪了。马哈布·阿里当时也在城里卖马。一天早上，两人在安嫩代尔赛马场骑马慢跑，上校把消息告诉了他。"
        - id: ch01-b145
          speaker: mahbub
          text: "哦，这算不了什么。人跟马一样，有些时候非得吃盐。槽里没有，它们就会跑到地上去舔。他不过是回大路上待一阵。学校让他闷坏了，我早知道会这样。下一回，我会亲自带他上路。克赖顿少爷，不用担心。这就像一匹挣脱缰绳的马球小马，自己跑出去学打球。"
        - id: ch01-b146
          speaker: creighton
          text: "这么说，你认为他还活着？"
        - id: ch01-b147
          speaker: mahbub
          text: "热病也许能要他的命，除此以外，我不替那孩子担心。猴子不会从树枝间掉下来。"
        - id: ch01-b148
          speaker: narrator
          text: "第二天清早，他们还在同一座赛马场。马哈布骑着公马跑到上校身边。"
        - id: ch01-b149
          speaker: mahbub
          text: "果然跟我想的一样。他至少经过了安巴拉，还在那里写信给我。他从集市听说我在这里。"
        - id: ch01-b150
          speaker: creighton
          text: "念给我听。"
        - id: ch01-b151
          speaker: narrator
          text: "上校松了一口气。以他的身份，竟会惦记一个土生土长的小流浪汉，实在有些荒唐。可他还记得火车里的谈话，过去几个月也常常想起那个古怪、沉默又镇定的孩子。当然，金擅自逃走，无礼得很，却也显出了机变和胆量。"
        - id: ch01-b152
          speaker: narrator
          text: "马哈布勒住马，走到狭小平地的中央。无论谁想靠近，都躲不过他们的眼睛。马哈布眼里闪着笑。"
        - id: ch01-b153
          speaker: mahbub
          text: "信上先写，星辰之友，也就是全世界的朋友。"
        - id: ch01-b154
          speaker: creighton
          text: "这称呼是什么意思？"
        - id: ch01-b155
          speaker: mahbub
          text: "拉合尔城里的人这样叫他。下面写，全世界的朋友，请允许他回到自己的地方。他会在约定的日子回来。请派人取走箱子和铺盖。如果他犯了错，愿友谊之手拨开灾祸之鞭。后面还有一点，不过……"
        - id: ch01-b156
          speaker: creighton
          text: "没关系，继续念。"
        - id: ch01-b157
          speaker: mahbub
          text: "信上又说，有些事情，拿叉子吃饭的人不会懂。最好暂时换成两只手吃饭。请对不懂这件事的人多讲温和的话，让他的归来有个好兆头。这些漂亮句子自然是代书人写的。不过你看，那孩子把事情安排得多聪明。除了知情的人，谁也猜不出里面的意思。"
        - id: ch01-b158
          speaker: creighton
          text: "原来这就是拨开灾祸之鞭的友谊之手？"
        - id: ch01-b159
          speaker: narrator
          text: "上校笑了。"
        - id: ch01-b160
          speaker: mahbub
          text: "你看他多聪明。正像我说的，他又想回大路上了。他还不知道你做的是什么营生。"
        - id: ch01-b161
          speaker: creighton
          text: "这一点，我可完全拿不准。"
        - id: ch01-b162
          speaker: mahbub
          text: "所以，他才来求我替你们说和。这样还不算聪明吗？他答应会回来，只是出去练练本事。想想看，少爷！他在学校待了三个月，那副嚼子还是没能把他磨服。依我看，这该叫人高兴。小马正在学打球。"
        - id: ch01-b163
          speaker: creighton
          text: "话是这样，可下一次不能再让他独自走。"
        - id: ch01-b164
          speaker: mahbub
          text: "为什么不能？还没得到上校少爷保护的时候，他一直都是独自走。将来参加大游戏，他必须一个人去，孤身一人，拿自己的脑袋冒险。到那时候，他吐一口唾沫，打一个喷嚏，甚至坐下来的样子跟监视的人稍有不同，都可能送掉性命。现在又何必拦他？记得波斯人说过，住在马赞德兰荒野的胡狼，只有马赞德兰的猎犬抓得到。"
        - id: ch01-b165
          speaker: creighton
          text: "说得对，马哈布·阿里。只要他平安，我再没有更满意的事了。不过，他实在太无礼。"
        - id: ch01-b166
          speaker: mahbub
          text: "他连去了哪里都没告诉我。他不傻。日子到了，自然会来找我。也该让那位珍珠医师接手调教他了。照少爷们算年纪的办法，他长得太快。"
        - id: ch01-b167
          speaker: narrator
          text: "一个月后，马哈布的预言一点不差地应验了。他去安巴拉接一批刚到的马。黄昏时，他独自骑在卡尔卡路上，迎面碰见金向他讨施舍。马哈布张口便骂，金却用英语回答。附近一个人也没有，所以没人听见马哈布吃惊地倒抽一口气。"
        - id: ch01-b168
          speaker: mahbub
          text: "哦嗬！你这段日子到底去了哪里？"
          emotion: surprised
        - id: ch01-b169
          speaker: kim
          text: "上上下下，又下下上上。"
        - id: ch01-b170
          speaker: mahbub
          text: "到树下去，先避开雨，再慢慢讲给我听。"
        - id: ch01-b171
          speaker: kim
          text: "我先在安巴拉附近一个老人家里住了些日子，后来又住进城里一户熟人家。我跟着他们家一个人一路向南，到了德里。那真是一座了不得的城市。再后来，我替一个往北走的榨油匠赶牛。听说前面的帕蒂亚拉要举行大庆典，我便跟一个烟火匠去了。那场庆典真盛大。我见到好多王公，还有披满金银饰物的大象。所有烟火一下全点燃，炸死了十一个人，我跟的烟火匠也死在里面。我被气浪掀过一顶帐篷，却半点没受伤。后来，我跟着一个锡克骑兵回到铁路边，替他照料马匹换饭吃。这样就到了这里。"
        - id: ch01-b172
          speaker: narrator
          text: "说到那场庆典，金还揉了揉自己的肚子。"
        - id: ch01-b173
          speaker: mahbub
          text: "好样的！"
          emotion: happy
        - id: ch01-b174
          speaker: kim
          text: "可上校少爷怎么说？我可不想挨打。"
        - id: ch01-b175
          speaker: mahbub
          text: "友谊之手已经替你拨开灾祸之鞭。不过下次你再上路，必须跟我一起。现在还太早。"
        - id: ch01-b176
          speaker: kim
          text: "对我来说，已经够晚了。我在学校学会了一点英文读写，很快就会彻底变成一个少爷。"
        - id: ch01-b177
          speaker: mahbub
          text: "听听他说的！向少爷致敬！"
          emotion: happy
        - id: ch01-b178
          speaker: narrator
          text: "马哈布看着雨里那个手舞足蹈、浑身湿透的小人儿，大笑起来，又故意讥讽地行了一礼。"
        - id: ch01-b179
          speaker: mahbub
          text: "好了，你已经厌倦大路了吗？还是愿意跟我去安巴拉，再同马群一起往回走？"
        - id: ch01-b180
          speaker: kim
          text: "我跟你走，马哈布·阿里。"
