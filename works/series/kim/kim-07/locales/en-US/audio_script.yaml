          speaker: mahbub
          text: It is one of his names in Lahore. He writes, "The Friend of all the World asks leave to visit his own places. He will return on the appointed day. Have someone collect the box and bedding roll. If he has done wrong, may the Hand of Friendship turn away the Whip of Calamity." There is a little more, but—
