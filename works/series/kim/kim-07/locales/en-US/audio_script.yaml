        - id: ch01-b171
          speaker: narrator
          text: Creighton let out a breath of relief. It was absurd for a man in his position to care about a little country-born vagabond. Still, he remembered their talk on the train. During the past few months, he had often caught himself thinking about that strange, quiet, self-possessed boy. Running away was outrageous, of course, but it also showed nerve and resourcefulness.
        - id: ch01-b172
          speaker: narrator
          text: Mahbub's eyes twinkled. He guided his horse into the middle of the small open ground, where no one could come close without being seen.
        - id: ch01-b173
          speaker: mahbub
          text: The letter begins, "The Friend of the Stars, who is the Friend of all the World—"
