        - id: ch01-b168
          speaker: narrator
          text: The next morning, on the same racecourse, Mahbub's stallion moved up beside the Colonel's horse.
        - id: ch01-b169
          speaker: mahbub
          text: It happened as I expected. At least he passed through Umballa. He learned in the bazaar that I was here, and he sent me a letter.
