        - id: ch01-b160
          speaker: narrator
          text: Kim shifted eagerly from one foot to the other, his eyes shining as he imagined the rich days ahead. He paid her four annas and ran downstairs looking exactly like a low-caste Hindu boy. Not one detail was wrong. His next stop was a cookshop, where he feasted with reckless pleasure on rich, greasy food.
        - id: ch01-b161
          speaker: narrator
          text: On the platform at Lucknow station, Kim watched young De Castro, covered in prickly heat, climb into a second-class carriage. Kim chose a third-class compartment and soon became its life and soul.
        - id: ch01-b162
          speaker: narrator
          text: He told his fellow travelers he worked for a juggler who had gone on without him while he lay sick with fever. He would rejoin his master at Umballa. Each time the passengers changed, Kim changed his story too, or decorated it with fresh inventions. His imagination ran all the wilder because he had been kept from Indian speech for so long. That night, no one in all India was happier than Kim.
        - id: ch01-b163
          speaker: narrator
          text: At Umballa he left the train and turned east. He splashed across the rain-soaked fields toward the village where the old soldier lived.
        - id: ch01-b164
          speaker: narrator
          text: Around that time, a telegram reached Colonel Creighton in Simla. Young O'Hara had vanished from Lucknow. Mahbub Ali was in town selling horses, so one morning Creighton told him what had happened as they cantered around the Annandale racecourse.
