          speaker: mahbub
          text: Oh, that is nothing. Men are like horses. Sometimes they need salt, and if there is none in the manger, they lick it from the ground. The boy has gone back to the Road for a while. School tired him. I knew it would. Next time I will take him onto the Road myself. Don't worry, Creighton Sahib. It is only a polo pony breaking loose to learn the game by itself.
