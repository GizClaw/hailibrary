          speaker: naikan
          text: Child, without any doubt, you are the most shameless son of Shaitan who ever wasted a poor girl's time with a game and then asked whether the joke was payment enough. You will go a very long way in this world.
        - id: ch01-b158
          speaker: narrator
          text: She mocked him with the formal salute of the dancing girls.
