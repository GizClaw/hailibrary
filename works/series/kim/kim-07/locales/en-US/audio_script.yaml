  chapters:
    - id: ch01
      title: CHAPTER VII
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: For whose use do the expectant suns stand ready, while foolish moons and stars retrace the paths of stars? Come quietly between them. Heaven has its high wars, just as Earth has its lower ones. You inherit all their tumult and terror, bound by Adam's sin and your fathers' sins and your own. Look up, draw out your horoscope, and tell us which planet repairs your worn-out fate, and which one tears it further.
        - id: ch01-b02
          speaker: narrator
          text: That afternoon, the red-faced schoolmaster told Kim that his name had been struck off the strength. The words meant nothing to Kim until the man ordered him to go out and play.
        - id: ch01-b03
          speaker: narrator
          text: Kim ran straight to the bazaar and found the young letter-writer to whom he still owed the price of a stamp.
        - id: ch01-b04
          speaker: kim
          text: Now I will pay what I owe. And now I need you to write another letter.
        - id: ch01-b05
          speaker: letter_writer
          text: Mahbub Ali is in Umballa.
        - id: ch01-b06
          speaker: narrator
          text: The writer tossed out the news with confidence. His trade made him a busy office for every kind of wrong information.
        - id: ch01-b07
          speaker: kim
          text: This one isn't for Mahbub. It is for a priest. Take up your pen and be quick. Write this. To Teshoo Lama, the Holy One from Bhotiyal who seeks a River, now staying in the Temple of the Tirthankars at Benares. More ink! In three days I am being sent down to school at Lucknow. The school's name is Xavier. I don't know where it is, but it is somewhere in Lucknow.
        - id: ch01-b08
          speaker: letter_writer
          text: But I know Lucknow. I know that school too.
        - id: ch01-b09
          speaker: kim
          text: Then tell him where it is, and I will give you half an anna.
        - id: ch01-b10
          speaker: narrator
          text: The reed pen scratched rapidly over the paper.
        - id: ch01-b11
          speaker: letter_writer
          text: He won't mistake the place. But who is that watching us from across the street?
        - id: ch01-b12
          speaker: narrator
          text: Kim glanced up at once. Colonel Creighton stood there in his tennis clothes.
        - id: ch01-b13
          speaker: kim
          text: Oh, some Sahib who knows the fat priest at the barracks. He is calling me over.
        - id: ch01-b14
          speaker: creighton
          text: What are you doing here?
        - id: ch01-b15
          speaker: kim
          text: I am not running away. I am sending a letter to my Holy One in Benares.
        - id: ch01-b16
          speaker: creighton
          text: I had not thought of that. Did you tell him I am taking you to Lucknow?
        - id: ch01-b17
          speaker: kim
          text: No. If you doubt me, read the letter.
        - id: ch01-b18
          speaker: creighton
          text: Then why did you leave my name out when you wrote to him?
        - id: ch01-b19
          speaker: narrator
          text: The Colonel smiled in a way Kim could not quite read. Kim gathered all his courage before he answered.
        - id: ch01-b20
          speaker: kim
          text: Someone once taught me that it is unwise to write down the names of strangers involved in a matter. Naming names can ruin many good plans.
        - id: ch01-b21
          speaker: creighton
          text: You have been taught well. I left my cheroot-case on the padre's veranda. Bring it to my house this evening.
        - id: ch01-b22
          speaker: narrator
          text: Kim flushed at the praise, but he did not relax.
        - id: ch01-b23
          speaker: kim
          text: Where is your house?
        - id: ch01-b24
          speaker: narrator
          text: His quick mind warned him that this was some sort of test, so he stood on guard.
        - id: ch01-b25
          speaker: creighton
          text: Ask anyone in the big bazaar.
        - id: ch01-b26
          speaker: narrator
          text: The Colonel walked away. Kim returned to the letter-writer.
        - id: ch01-b27
          speaker: kim
          text: He forgot his cheroot-case, and I must take it to him tonight. That is everything for my letter, except you must write this three times. Come to me! Come to me! Come to me! Now I will buy the stamp and put the letter in the post.
        - id: ch01-b28
          speaker: narrator
          text: Kim stood to leave. Then, as if the thought had only just come to him, he asked one more question.
        - id: ch01-b29
          speaker: kim
          text: Who is that angry-looking Sahib who lost the cheroot-case?
        - id: ch01-b30
          speaker: letter_writer
          text: Only Creighton Sahib. He is a very foolish Sahib, a Colonel without any regiment.
        - id: ch01-b31
          speaker: kim
          text: What work does he do?
        - id: ch01-b32
          speaker: letter_writer
          text: God knows. He is always buying horses he cannot ride and asking riddles about God's works, things like plants, stones, and people's customs. The dealers call him the father of fools because they cheat him so easily over horses. Mahbub Ali says he is madder than most Sahibs.
        - id: ch01-b33
          speaker: kim
          text: Oh!
        - id: ch01-b34
          speaker: narrator
          text: Kim went away thinking hard. No fool would be trusted with news that could bring out eight thousand soldiers and guns. The Commander-in-Chief did not speak as Kim had heard him speak to fools. Nor would Mahbub's voice change at the Colonel's name if Creighton were truly foolish.
        - id: ch01-b35
          speaker: narrator
          text: So there had to be a mystery. Perhaps Mahbub spied for the Colonel, much as Kim had spied for Mahbub. And just like the horse-dealer, Creighton seemed to respect people who did not show off how clever they were. The thought sent Kim skipping down the road.
        - id: ch01-b36
          speaker: narrator
          text: He was delighted that he had pretended not to know where Creighton lived. When he returned to the barracks and found that no cheroot-case had been left on the veranda at all, his whole face shone. Here was a man after Kim's own heart, a crooked, secretive man playing a hidden game. If Creighton could act the fool, then Kim could do it too.
        - id: ch01-b37
          speaker: narrator
          text: Kim showed none of these thoughts during the next three mornings. Father Victor lectured him at length about a whole new company of gods and lesser holy beings. Chief among them was a goddess called Mary, whom Kim understood to be the same as Bibi Miriam in Mahbub Ali's faith.
        - id: ch01-b38
          speaker: narrator
          text: He showed no feeling when Father Victor dragged him from shop to shop to buy his school outfit. He did not complain when jealous drummer-boys kicked him for going to a better school. He simply waited, curious to see what circumstances would do next.
        - id: ch01-b39
          speaker: narrator
          text: Father Victor, kind man that he was, took Kim to the station. He settled him in an empty second-class carriage beside Colonel Creighton's first-class compartment, then said goodbye with real feeling.
        - id: ch01-b40
          speaker: father_victor
          text: They will make a man of you at St Xavier's, O'Hara. A white man, and I hope a good man too. They know you are coming, and the Colonel will make sure you are not lost or mislaid on the way. I have given you some notion of religion, or at least I hope I have. When they ask your religion, remember that you are a Catholic. Better say Roman Catholic, though I do not much care for that word.
        - id: ch01-b41
          speaker: narrator
          text: Kim lit one of the harsh cigarettes he had wisely bought in the bazaar, stretched out, and began to think. Traveling alone like this felt nothing like the happy journey south in the third-class carriage with the lama.
        - id: ch01-b42
          speaker: kim
          text: Sahibs get very little pleasure from travel. Hai mai! I am kicked from place to place like a ball. It is my Kismet, and no one can escape his Kismet. But now I must pray to Bibi Miriam, and I am a Sahib.
        - id: ch01-b43
          speaker: narrator
          text: He looked sadly at his boots.
        - id: ch01-b44
          speaker: kim
          text: No. I am Kim. This is the great world, and I am only Kim. Who is Kim?
        - id: ch01-b45
          speaker: narrator
          text: He had never examined his own identity before. He thought until his head spun. In the roaring whirl of India he was one tiny person, traveling south toward a fate he could not see.
        - id: ch01-b46
          speaker: narrator
          text: After a while, the Colonel called Kim into his compartment and spoke with him for a long time. As well as Kim could understand it, he was expected to work hard, then enter the Survey of India as a chain-man. If he behaved well and passed the proper examinations, he could earn thirty rupees a month by the time he was seventeen. Creighton promised to find him suitable work.
        - id: ch01-b47
          speaker: narrator
          text: At first Kim pretended to catch only one word out of every three. The Colonel realized his mistake and changed to fluent, colorful Urdu. Then Kim was satisfied. No fool could know the language so deeply, move so quietly, or have eyes so unlike the dull, heavy eyes of other Sahibs.
        - id: ch01-b48
          speaker: creighton
          text: You must learn to make pictures of roads, mountains, and rivers. You must be able to hold those pictures in your eye until the right time comes to put them on paper. Someday, when you are a chain-man and we are working together, I may send you across some hills to see what lies beyond them. Then someone may warn you that dangerous people live there, and they will kill a chain-man who looks like a Sahib. What would you do?
        - id: ch01-b49
          speaker: narrator
          text: Kim paused. Was it safe to follow where the Colonel was leading him?
        - id: ch01-b50
          speaker: kim
          text: I would report what that man had told me.
        - id: ch01-b51
          speaker: creighton
          text: But what if I offered you a hundred rupees for whatever lies beyond those hills? I might want a picture of the river and a little news about what people are saying in the villages.
        - id: ch01-b52
          speaker: kim
          text: How can I know what I would do? I am only a boy. Wait until I am a man.
        - id: ch01-b53
          speaker: narrator
          text: The Colonel's brow darkened, so Kim added something more.
        - id: ch01-b54
          speaker: kim
          text: Still, I think I could earn those hundred rupees in a few days.
        - id: ch01-b55
          speaker: creighton
          text: What road would you take?
        - id: ch01-b56
          speaker: narrator
          text: Kim shook his head with determination.
        - id: ch01-b57
          speaker: kim
          text: If I told you how I meant to earn the money, someone else might hear and get there first. It is foolish to give away knowledge for nothing.
        - id: ch01-b58
          speaker: creighton
          text: Tell me now.
        - id: ch01-b59
          speaker: narrator
          text: Creighton held up a rupee. Kim's hand moved halfway toward it, then fell back.
        - id: ch01-b60
          speaker: kim
          text: No, Sahib. I know what price you will pay for the answer, but I don't know why you asked the question.
        - id: ch01-b61
          speaker: creighton
          text: Then take the rupee as a gift. There is a good spirit in you. Do not let St Xavier's make it dull. Many boys there despise black men.
        - id: ch01-b62
          speaker: narrator
          text: Creighton tossed him the coin.
        - id: ch01-b63
          speaker: kim
          text: Their mothers were bazaar women.
        - id: ch01-b64
          speaker: narrator
          text: Kim knew that no hatred could match a half-caste man's hatred for his own relations.
        - id: ch01-b65
          speaker: creighton
          text: True. But you are a Sahib and the son of a Sahib. Never let that teach you to look down on black men. I have known boys who entered government service and pretended not to understand black men's speech or customs. Their pay was cut because they were ignorant. There is no sin as great as ignorance. Remember that.
        - id: ch01-b66
          speaker: narrator
          text: During the long twenty-four-hour run south, the Colonel called Kim back several times. Each time he returned to that same lesson.
        - id: ch01-b67
          speaker: kim
          text: Then we are all tied to one lead-rope, the Colonel, Mahbub Ali, and me, once I become a chain-man. I think he will use me the way Mahbub used me. That is good, if it lets me go back to the Road. These clothes do not grow any easier to wear.
        - id: ch01-b68
          speaker: narrator
          text: The lama was nowhere to be seen when they reached the crowded station at Lucknow. Kim swallowed his disappointment. The Colonel bundled him and his tidy belongings into a hired carriage and sent him alone toward St Xavier's.
        - id: ch01-b69
          speaker: creighton
          text: I won't say farewell, because we will meet again. We may meet many times, if you prove to have the right spirit. But you have not been tested yet.
        - id: ch01-b70
          speaker: kim
          text: Was I not tested that night when I brought you a white stallion's pedigree?
        - id: ch01-b71
          speaker: narrator
          text: Kim actually dared to address the Colonel as an equal.
        - id: ch01-b72
          speaker: creighton
          text: Little brother, there is much to gain by forgetting.
        - id: ch01-b73
          speaker: narrator
          text: The look Creighton gave him seemed to pierce straight through his shoulder blades. Kim scrambled into the carriage and needed almost five minutes to recover. Then he sniffed the unfamiliar air with pleasure.
        - id: ch01-b74
          speaker: kim
          text: This is a rich city, richer than Lahore. The bazaars must be wonderful. Driver, take me through them for a little while.
        - id: ch01-b75
          speaker: driver
          text: My orders are to take you to the school.
        - id: ch01-b76
          speaker: narrator
          text: The driver used the rude form of "you," unfit for addressing a white boy. In the clearest, smoothest local speech, Kim explained the mistake. Then he climbed onto the box beside the man. Once they understood each other perfectly, they spent two hours driving up and down while Kim looked, compared, and delighted in everything.
        - id: ch01-b77
          speaker: narrator
          text: Only Bombay could surpass Lucknow's showy beauty. From the river bridge or the high Imambara, golden umbrellas rose above the Chutter Munzil and trees cradled the town. Kings had filled Lucknow with strange buildings, charities, and pensioners, and soaked it in blood. It was a center of idleness, intrigue, and luxury, and with Delhi claimed the purest Urdu.
        - id: ch01-b78
          speaker: kim
          text: It is a fine city. A beautiful city.
        - id: ch01-b79
          speaker: narrator
          text: The driver was a Lucknow man, and the praise pleased him. He told Kim one astonishing tale after another, where an English guide would have talked only about the Mutiny.
        - id: ch01-b80
          speaker: kim
          text: Now we can go to the school.
        - id: ch01-b81
          speaker: narrator
          text: The great old school of St Xavier's in Partibus stood some way outside the city, facing the Gumti River. Its low white buildings rose block behind block in enormous grounds.
        - id: ch01-b82
          speaker: kim
          text: What sort of people live inside?
        - id: ch01-b83
          speaker: driver
          text: Young Sahibs. Every one of them is a devil. But I drive many boys between the station and that school, and in truth I have never seen one with the promise of a more perfect devil than the young Sahib beside me now.
        - id: ch01-b84
          speaker: narrator
          text: Kim had never been taught that it was improper to exchange greetings with the playful ladies who leaned from upper windows in one particular street. He had spoken with one or two of them and answered their compliments very well. He was about to return the driver's insult when, in the growing dusk, he saw someone sitting beside a white gatepost in the long wall.
        - id: ch01-b85
          speaker: kim
          text: Stop! Wait here. I am not going into the school yet.
        - id: ch01-b86
          speaker: driver
          text: And who will pay me for all this stopping and starting? Is the boy mad? Last time it was a dancing girl. Now it is a priest.
        - id: ch01-b87
          speaker: narrator
          text: Kim flew into the road and bent over the dusty feet beneath a dirty yellow robe.
        - id: ch01-b88
          speaker: lama
          text: I have waited here for a day and a half. No, I was not alone at first. My friend at the Temple of the Tirthankars gave me a disciple to guide me. When your letter reached me, I came from Benares on the te-rain. Yes, I have eaten well. I need nothing.
        - id: ch01-b89
          speaker: kim
          text: But why didn't you stay with the woman from Kulu, Holy One? How did you reach Benares? My heart has been heavy ever since we parted.
        - id: ch01-b90
          speaker: lama
          text: Her endless talking tired me, and she always wanted charms for children. I left her company, though I allowed her to gain merit by giving me gifts. She is generous, at least. I promised to return to her house if I had need. Then I found myself alone in this huge and terrible world. I remembered the te-rain to Benares, and I knew there was a Seeker like myself in the Tirthankars' Temple.
        - id: ch01-b91
          speaker: kim
          text: Ah, your River! I had forgotten about the River.
        - id: ch01-b92
          speaker: lama
          text: So soon, my chela? I have never forgotten it. But after I left you, I thought it wiser to ask advice at the Temple. India is very large. Perhaps two or three wise men before us recorded the place where our River runs. The people at the Temple debate it. One says one thing and another says something else, but they are courteous people.
        - id: ch01-b93
          speaker: kim
          text: Very well. But why are you here now?
        - id: ch01-b94
          speaker: lama
          text: I gain merit by helping you toward wisdom, my chela. The priest who belongs to the men serving the Red Bull wrote that everything should be arranged as I wished. I sent enough money for one year. Then I came to watch you enter the Gates of Learning. I waited a day and a half. It was not because I felt affection for you, since affection is not part of the Way. The people at the Temple explained that after paying for your learning, I should see the matter properly finished.
        - id: ch01-b95
          speaker: lama
          text: I had feared that I came only because I wished to see you, led astray by the Red Mist of affection. But that is not so. Besides, a dream has troubled me.
        - id: ch01-b96
          speaker: kim
          text: Surely you have not forgotten the Road and everything that happened there. Surely you came at least a little because you wanted to see me?
        - id: ch01-b97
          speaker: driver
          text: The horses are growing cold, and their feeding time has passed.
        - id: ch01-b98
          speaker: kim
          text: Go to Jehannum and stay there with your shameless aunt!
        - id: ch01-b99
          speaker: narrator
          text: Kim snarled the words over his shoulder, then turned back to the lama.
        - id: ch01-b100
          speaker: kim
          text: I am all alone in this country. I don't know where I am going or what will happen to me. I put my whole heart into that letter. Except for Mahbub Ali, and he is a Pathan, I have no friend but you, Holy One. Please don't go away from me altogether.
        - id: ch01-b101
          speaker: lama
          text: I have thought of that too.
        - id: ch01-b102
          speaker: narrator
          text: The lama's voice shook as he went on.
        - id: ch01-b103
          speaker: lama
          text: If I have not yet found my River, I can gain merit from time to time by making sure your feet stay on the path to wisdom. I do not know what they will teach you. But the priest wrote that no Sahib's son in India would receive better teaching. So I will come back now and then.
        - id: ch01-b104
          speaker: lama
          text: Perhaps you will become like the Sahib who gave me these spectacles in the Wonder House at Lahore.
        - id: ch01-b105
          speaker: narrator
          text: The lama carefully wiped his spectacles.
        - id: ch01-b106
          speaker: lama
          text: That is my hope. He was a Fountain of Wisdom, wiser than many abbots. Or perhaps you will forget me and forget the times we met.
        - id: ch01-b107
          speaker: kim
          text: I have eaten your bread. How could I ever forget you?
        - id: ch01-b108
          speaker: lama
          text: No, no. I must return to Benares. Now that I understand how letter-writers work in this country, I will sometimes send you a letter. And sometimes I will come to see you.
        - id: ch01-b109
          speaker: kim
          text: But where can I send my letters?
          emotion: sad
        - id: ch01-b110
          speaker: narrator
          text: Kim clutched the lama's robe and wailed the question, forgetting completely that he was supposed to be a Sahib.
        - id: ch01-b111
          speaker: lama
          text: Send them to the Temple of the Tirthankars at Benares. I have chosen to stay there until I find my River. Do not cry. All Desire is Illusion, another chain binding us to the Wheel. Go into the Gates of Learning. Let me watch you enter. If you love me, go now, or my heart will break. I will return. I promise I will return.
          emotion: sad
        - id: ch01-b112
          speaker: narrator
          text: The lama stood watching as the hired carriage rumbled into the school grounds. Then he strode away, sniffing between every long step.
        - id: ch01-b113
          speaker: narrator
          text: The Gates of Learning closed behind Kim with a clang.
        - id: ch01-b114
          speaker: narrator
          text: A boy raised in India has customs unlike those of any other country, and his teachers reach him in ways an English master would not understand. So there is little need to tell every detail of Kim's life among the two or three hundred sharp boys of St Xavier's, most of whom had never seen the sea.
        - id: ch01-b115
          speaker: narrator
          text: He received the usual punishments for slipping beyond the school grounds while cholera was in the city. Before he could write proper English, he had to hire a bazaar letter-writer to help him. Naturally, he was charged with smoking and with using language more richly abusive than St Xavier's had ever heard.
        - id: ch01-b116
          speaker: narrator
          text: He learned the strict washing habits of an Indian-born boy, who privately thinks Englishmen rather dirty. He played tricks on the patient servants pulling the dormitory fans. Through hot nights the boys talked until dawn, while Kim quietly measured himself against his confident schoolmates.
        - id: ch01-b117
          speaker: narrator
          text: Their fathers were lower officials in the railway, telegraph, and canal services. Some were warrant officers, retired or commanding a Rajah's army. Others were Indian Marine captains, pensioners, planters, shopkeepers, or missionaries. A few belonged to old Eurasian families in Dhurrumtollah, named Pereira, De Souza, and D'Silva.
        - id: ch01-b118
          speaker: narrator
          text: Many parents could have educated their sons in England, but they loved their old school, and generation followed generation through St Xavier's. The boys came from railway neighborhoods in Howrah and forgotten cantonments like Monghyr and Chunar. Others lived on distant tea gardens near Shillong, in Oudh and Deccan villages where their fathers held large estates, or at mission stations a week's journey from the nearest railway line.
        - id: ch01-b119
          speaker: narrator
          text: Others came from seaports a thousand miles south, facing the hard, shining Indian surf, or from cinchona plantations farther south still. Their journeys to school and back seemed ordinary to them, though the stories would have made a Western boy's hair stand up.
        - id: ch01-b120
          speaker: narrator
          text: They thought nothing of traveling alone through a hundred miles of jungle, where there was always the delightful chance that a tiger might delay them. Yet they would no more swim the English Channel in August than an English boy would lie still while a leopard sniffed his palanquin. Each side found the other danger unthinkable.
        - id: ch01-b121
          speaker: narrator
          text: One fifteen-year-old spent a day and a half on an island in a flooded river, naturally taking charge of a frantic camp of pilgrims returning from a shrine. Some older boys met a Rajah's elephant by chance and claimed it in the name of St Francis Xavier after the Rains erased the cart road to their father's estate. They nearly lost the huge beast in quicksand.
        - id: ch01-b122
          speaker: narrator
          text: Another boy said he had helped his father fire from their veranda when Akas rushed their lonely plantation, back when those head-hunters still dared attack. No one doubted him.
        - id: ch01-b123
          speaker: narrator
          text: They told every adventure in the level voice of the Indian-born, mixing in wisdom learned unconsciously from foster-mothers and phrases that sounded freshly carried over from local speech.
        - id: ch01-b124
          speaker: narrator
          text: Kim watched, listened, and approved. This was not the drummer-boys' dull talk. It concerned a life he partly understood. The place suited him, and he grew steadily. When warm weather brought him a white drill suit, he enjoyed its comfort and enjoyed sharpening his mind on his lessons.
        - id: ch01-b125
          speaker: narrator
          text: An English master might have marveled at Kim's quickness. St Xavier's masters knew that minds could grow fast under the Indian sun, then lose half their force at twenty-two or twenty-three.
        - id: ch01-b126
          speaker: narrator
          text: Kim kept himself in the background and never overwhelmed the boys with his own stories. St Xavier's scorned boys who went altogether native. A boy must remember he was a Sahib and would command Indian men after passing his examinations. Kim noted where examinations could lead.
        - id: ch01-b127
          speaker: narrator
          text: Then came the long holidays from August through October, when the heat and the Rains closed the school. Kim was told that he would travel north to some hill station beyond Umballa. Father Victor would arrange a place for him there.
        - id: ch01-b128
          speaker: kim
          text: Do you mean a barrack-school?
        - id: ch01-b129
          speaker: narrator
          text: By then Kim had asked many questions and thought about even more.
        - id: ch01-b130
          speaker: master
          text: Yes, I suppose that is what it will be. Keeping you out of mischief won't hurt you. You can travel with young De Castro as far as Delhi.
        - id: ch01-b131
          speaker: narrator
          text: Kim considered every side of the plan. He had worked hard as the Colonel ordered, and his schoolmates said a holiday belonged to the boy. After St Xavier's, a barrack-school would be torture.
        - id: ch01-b132
          speaker: narrator
          text: Better still, Kim had learned a priceless magic. He could write. Two people could now speak without a third between them, for half an anna and a little knowledge.
        - id: ch01-b133
          speaker: narrator
          text: No message had come from the lama, but the Road remained. Kim longed for soft mud between his toes, mutton with butter and cabbage, cardamom rice, saffron rice with garlic and onions, and the forbidden greasy sweets of the bazaars.
        - id: ch01-b134
          speaker: narrator
          text: A barrack-school would feed him raw beef and force him to smoke in hiding. Yet he was a Sahib of St Xavier's. Then there was that pig Mahbub Ali. Kim would not seek his hospitality, though perhaps he had judged Mahbub unfairly.
        - id: ch01-b135
          speaker: narrator
          text: Alone in the dormitory, Kim thought the whole matter through. At last he decided that he really had been unfair to Mahbub.
        - id: ch01-b136
          speaker: narrator
          text: The school stood empty around him. Nearly all the masters had left. Colonel Creighton's railway pass was in Kim's hand, and Kim felt proud that he had not wasted the Colonel's money or Mahbub's on wild living. He still possessed two rupees and seven annas. His new bullock trunk, marked with the letters K. O'H., waited beside his rolled bedding in the silent dormitory.
        - id: ch01-b137
          speaker: kim
          text: Sahibs are always tied down by their baggage. You two can stay here.
        - id: ch01-b138
          speaker: narrator
          text: He nodded to the trunk and bedding, then went out into the warm rain with a sinful smile. He made for a certain house whose outside he had carefully noted before.
        - id: ch01-b139
          speaker: naikan
          text: Arre! Do you know what kind of women live in this quarter? Oh, what shame!
        - id: ch01-b140
          speaker: kim
          text: Do you think I was born yesterday?
        - id: ch01-b141
          speaker: narrator
          text: Kim squatted in the Indian fashion among the cushions of the upstairs room.
        - id: ch01-b142
          speaker: kim
          text: I only want a little dye and three yards of cloth to help me play a joke. Is that so much?
        - id: ch01-b143
          speaker: naikan
          text: Who is the girl? You are very young, for a Sahib, to be getting into this sort of devilry.
