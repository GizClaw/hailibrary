  chapters:
    - id: ch01
      title: CHAPTER XIII
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Who has longed for the sea, with its immense, contemptuous waves? Who has felt the ship shudder, stumble, and swerve just before its sharp bowsprit drives into the water? Who has looked beneath the orderly trade-wind clouds and seen ridge after ridge of roaring blue? There are sudden winds hiding by cliffs, and low thunder rolling from the sails at the bow. Yet every sailor knows his own sea. In each wonder it is always the same, and in that sameness every wonder is new. It is the sea that completes his very being. And in just that way, men of the hills long for their hills. They can desire them in no other way. As the saying goes, whoever goes to the hills goes to his mother.
        - id: ch01-b02
          speaker: narrator
          text: Kim and the lama had crossed the Siwaliks and the warm, green Doon. They left Mussoorie behind and followed narrow roads northward, farther into the crowded mountains each day. As they climbed, the lama's strength returned. In the Doon he had leaned on Kim's shoulder and welcomed every rest. At the long rise toward Mussoorie, though, he gathered himself like an old hunter facing a familiar slope. He filled his lungs with the sharp, pure air and strode on like the hillman he was. Kim had grown up on the plains. He sweated and gasped in amazement.
        - id: ch01-b03
          speaker: lama
          text: This is my country, chela. Beside Such-zen, these hills are as flat as a rice field.
        - id: ch01-b04
          speaker: narrator
          text: The lama drove steadily uphill from the hips. Going down, he left Kim even farther behind. They could drop three thousand feet in three hours, while Kim's back ached from holding himself back and the thong of his grass sandal nearly cut through his big toe. The lama moved without tiring through spotted shadows under deodars, past oaks feathered with ferns, through birch, ilex, rhododendron, and pine. He crossed bare slopes of slick, sunburned grass, entered cool woods again, and kept on until oak gave way to bamboo and valley palms.
        - id: ch01-b05
          speaker: narrator
          text: At twilight he looked back over the enormous ridges and the faint thread of road behind them, then planned the next day's march with a hillman's wide sense of distance. At the crest of a pass overlooking Spiti or Kulu, he stretched his hands toward the far snow. Kedarnath and Badrinath rose like kings over that wilderness. At dawn they burned red in the wind above a hard blue sky. By day they shone like melted silver, and at evening they wore their jewels again.
        - id: ch01-b06
          speaker: narrator
          text: At first the mountain winds met the travelers gently as they crawled over the huge rounded ridges. A few days later, nine or ten thousand feet above the sea, those winds began to bite. Kim allowed a hill village to earn merit by giving him a rough blanket coat. The lama seemed mildly puzzled that anyone minded the knife-edged air that had lifted the years from his own shoulders.
        - id: ch01-b07
          speaker: lama
          text: These are only the lower hills, chela. We will not know cold until we reach the true Hills.
        - id: ch01-b08
          speaker: kim
          text: The air and water are good, and the people are devout enough. But the food is terrible. We march like madmen, or Englishmen, and it freezes every night.
        - id: ch01-b09
          speaker: lama
          text: A little, perhaps. Just enough to make old bones glad when the sun returns. We cannot always have soft beds and rich food.
        - id: ch01-b10
          speaker: kim
          text: We could at least stay on the road.
        - id: ch01-b11
          speaker: narrator
          text: Kim loved the beaten path that twisted between the mountains, though it was scarcely six feet wide. The Tibetan lama could never resist a shortcut over a spur or around the rim of a gravel slope. He told his limping disciple that anyone raised among mountains could foresee where a road must go. Low clouds might confuse a stranger, but not a thoughtful man. After hours of hard climbing, they would pant over a saddle, edge past landslides, and plunge through forest at a steep angle, only to meet the road again.
        - id: ch01-b12
          speaker: narrator
          text: Villages clung to the slopes along the way. Their mud huts, with timbers roughly cut by axes, perched like swallows' nests on cliffs, crowded tiny shelves above drops of three thousand feet, or hid where rock walls gathered every wandering wind. Some stood on summer pastures that winter would bury under ten feet of snow. Short-legged people in heavy wool came out to worship the lama. On the plains, he had been honored as one holy man among many. Here the people treated him as a man trusted by every spirit in the hills. Their Buddhism had nearly vanished beneath a wild worship of nature, but they knew his great hat, his clicking rosary, and his rare Chinese books. They also respected the man beneath the hat.
        - id: ch01-b13
          speaker: betah
          text: We watched you come down over the black Breasts of Eua. We almost never use that path, except when cows wander there in summer. Even on a still day, a sudden wind among those stones can throw a man down. But why would people like you fear the Devil of Eua?
        - id: ch01-b14
          speaker: narrator
          text: The Betah villager gave them cheese, sour milk, and bread as hard as stone. Kim ached in every part of his body. Looking down those sheer drops made him dizzy, and his feet were raw from forcing his cramped toes into cracks too small to hold them. Yet the villager's praise transformed the day's suffering. Kim felt as proud as a St Xavier's boy praised by his friends after winning the quarter-mile race on level ground. The mountain work sweated the ghee and sugary fat from his bones. At the top of brutal passes he pulled the dry air into his lungs in gasps, and it broadened and strengthened his upper ribs. Every tilted mile laid new, hard muscle along his calves and thighs.
        - id: ch01-b15
          speaker: narrator
          text: They often spoke of the Wheel of Life, especially because the lama said its visible temptations were far away. Apart from a gray eagle, a distant bear digging on a slope, a bright bird now and then, and one painted leopard devouring a goat at dawn, they had only the wind and the grass singing beneath it. The women in the smoky huts suffered from goiter and lived as wives to several husbands. The simple men farmed or cut wood. Then Fate provided someone to keep their discussions going. Hurree Babu, playing the courteous doctor from Dacca, began to meet them on the road.
        - id: ch01-b16
          speaker: narrator
          text: Hurree paid for food with goiter ointments and advice for peace between husbands and wives. He knew the hill dialects and seemed to know the country too. He explained the routes toward Ladakh and Tibet and said they could return to the plains whenever they wished. For mountain lovers, he added, the road ahead might be interesting. He revealed these things little by little during evenings on stone threshing floors. After treating his patients, he smoked while the lama took snuff. Kim watched tiny cows graze on housetops and stared across blue gulfs between the ranges. In dark woods, Hurree searched for herbs, and Kim went with him as a young physician.
        - id: ch01-b17
          speaker: hurree
          text: You see, Mister O'Hara, I do not know what on earth I shall do when I find our sporting friends. But please remain where you can see my umbrella. It is a very fine fixed point for a survey, and I shall feel much better.
        - id: ch01-b18
          speaker: kim
          text: This is not my country, hakim. Finding one man here would be like finding one louse in a bearskin.
        - id: ch01-b19
          speaker: hurree
          text: Ah, but finding things is my strong point. There is no hurry for Hurree. They were at Leh quite recently. They said they came from the Karakorum with animal heads and horns. My only fear is that they sent their letters and dangerous papers back into Russian territory. Naturally they will go as far east as possible, to pretend they never visited the western states.
        - id: ch01-b20
          speaker: narrator
          text: Hurree scratched a map into the earth with a twig.
        - id: ch01-b21
          speaker: hurree
          text: They should have entered through Srinagar or Abbottabad, then followed the river by Bunji and Astor. That is the short way. But they made trouble in the west, so they keep marching east to Leh, down the Indus to Hanle, and then toward Bushahr and the Chini valley. I know because I removed every other possibility, and because sick people answer questions when I cure them so very well. Our friends have spent a long time making themselves noticed. I shall catch them somewhere in the Chini valley. Keep watching my umbrella.
        - id: ch01-b22
          speaker: narrator
          text: The blue-and-white umbrella nodded like a flower blown by the wind, down valleys and around mountainsides. Kim and the lama steered by compass and caught up with it in the evenings, while Hurree sold medicines and powders. The lama would point carelessly at the ridges they had crossed, and Hurree would pour out compliments.
        - id: ch01-b23
          speaker: narrator
          text: In cold moonlight they crossed a snowy pass. The lama mildly teased Kim as he pushed through knee-deep drifts like one of the shaggy, snow-bred, two-humped camels Kim had watched in the Kashmir Serai. They crossed shallow beds of snow and shale covered in white powder. When a gale struck, they sheltered in a Tibetan camp among travelers hurrying downhill. Those travelers drove tiny sheep, and every sheep carried its own small bag of borax. Kim and the lama came out on broad grassy shoulders still speckled with snow, entered forest, and found open grass once more. Yet all that marching made almost no impression on Kedarnath and Badrinath. Only after days of travel could Kim stand on an ordinary ten-thousand-foot rise and see that one horn or shoulder of those great mountains had shifted its outline by the smallest amount.
        - id: ch01-b24
          speaker: narrator
          text: At last they entered a world inside the world. The valley stretched for leagues, and its high hills seemed no more than loose rubble swept from the knees of the greater mountains. A full day's march carried them no farther than the clogged step of a dreamer trapped in a nightmare. They struggled painfully for hours around one mountain shoulder. When they finally passed it, they discovered it was only a small outer knob on an outer support of the main range. A rounded meadow appeared ahead and promised an easy crossing. Once they reached it, the little meadow opened into an immense tableland running far into the valley. Three days later, when they looked back to the south, that enormous plateau had shrunk to a dim crease in the earth.
        - id: ch01-b25
          speaker: kim
          text: Surely the gods live here. This cannot be a place for men.
          emotion: surprised
        - id: ch01-b26
          speaker: lama
          text: Long ago, someone asked the Lord whether the world lasts forever, and the Excellent One gave no answer. In Ceylon, a wise Seeker showed me the same teaching in the Pali gospel. We know the road to Freedom, so that question cannot help us. But look, chela, and understand illusion. These are the true Hills. They are like my hills near Such-zen. Never have there been such hills!
        - id: ch01-b27
          speaker: narrator
          text: The earth rose far above them toward the snow line. From east to west, across hundreds of miles, the last bold birches stopped as neatly as if a ruler had marked the boundary. Higher still, cliffs and great shattered blocks of rock pushed their heads through the white cover. Above all lay the eternal snow. It had not changed since the world's beginning, yet every movement of sun and cloud gave it a different face. Dark marks wandered across it where storms rose and twisted in a dance. Below the travelers, blue-green forest poured away like a sheet for mile after mile. Farther down stood a village sprinkled among terraced fields and steep grazing land. Beneath that village, the ground dropped another twelve or fifteen hundred feet. A thunderstorm growled there and hid the descent for a while, but Kim and the lama knew that the wet valley waited below. In it, the little streams joined one another and became the mothers of the young Sutlej.
        - id: ch01-b28
          speaker: narrator
          text: As usual, the lama had taken Kim along cattle tracks and side paths, far from the main road. Three days earlier, the fearful Hurree Babu had raced down that road through a storm that most Englishmen would have waited out. Hurree was no brave shot. The click of a trigger drained the color from his face. But he was, as he liked to say, a fairly efficient stalker. From the threshing floor at Ziglaur, he searched the valley with cheap binoculars. Worn white tents show clearly against green, and he found two little dots below the snow line. The next day, they had moved perhaps six inches down the distant slope.
        - id: ch01-b29
          speaker: narrator
          text: Once Hurree had washed and set himself to work, his fat bare legs covered ground at a surprising speed. While Kim and the lama waited in a leaking hut for the storm to pass, Hurree arrived at the foreigners' camp soaked, oily, and smiling. The storm had split a pine nearby. A dozen or more baggage carriers, forced into service by their hill Rajah, declared the day unlucky. They dropped their loads and refused to move. The foreigners had already threatened them with rifles. Most of these men were trackers and hunters who knew both guns and Sahibs, but none had ever been treated this way. They disappeared into the forest and ignored every threat.
        - id: ch01-b30
          speaker: narrator
          text: Hurree had considered pretending to be mad, but now he found a better entrance. The carriers were subjects of a Rajah who rented out their labor for his private profit. They knew the rifles carried by hunters who returned to these valleys for bear and wild goat, and they knew how Sahibs usually behaved. The foreigners' threats had driven them beneath the trees, where neither shouting nor curses could bring them back. Hurree wrung the rain from his clothes, slipped his feet into shiny patent-leather shoes, and opened his blue-and-white umbrella. Then he stepped toward the camp with a delicate little walk while his heart hammered so high that he felt it against his throat.
        - id: ch01-b31
          speaker: hurree
          text: Gentlemen, I am the agent of His Royal Highness, the Rajah of Rampur. What may I do for you?
        - id: ch01-b32
          speaker: narrator
          text: The foreigners were delighted. One was plainly French and the other Russian, though both spoke passable English. Their own servants, they said, had fallen ill at Leh. They wished to carry their hunting trophies to Simla before moths spoiled the skins. They had a general letter for every government official. They had met no other hunters, possessed plenty of supplies, and needed only to move on quickly. Hurree found a frightened hillman in the trees. Three minutes of talk and a little silver brought back eleven carriers and three followers. Spending government money hurt Hurree, but now he could also serve as a witness to their mistreatment.
        - id: ch01-b33
          speaker: hurree
          text: My royal master will be greatly annoyed. These are only common, very ignorant people. If your honors can overlook this unfortunate affair, I shall be most grateful. The rain will stop soon, and then we can proceed. You have been hunting? What a fine achievement!
        - id: ch01-b34
          speaker: narrator
          text: Hurree skipped from basket to basket, pretending to adjust the conical loads. A normal Englishman would have been suspicious of him, but these men were not. One even struck his wrist when Hurree accidentally disturbed the basket with the red oilskin top. They offered him liquor and meat, things an Englishman who understood India would never press on a friendly Bengali. They also asked him many questions, mostly about women, and he answered with easy cheer.
        - id: ch01-b35
          speaker: narrator
          text: They gave Hurree a glass of pale liquor like gin, then another. Soon his dignity vanished. His speech grew thick and treasonous. He complained that the government had forced a white man's education upon him without giving him a white man's salary. He poured out stories of injustice until he wept for India's misery. At last he staggered away, singing Bengali love songs, and collapsed on a wet tree trunk. No miserable product of English rule could have looked more sadly lost among foreigners.
        - id: ch01-b36
          speaker: frenchman
          text: They all follow this pattern. You will see when we reach India itself. I should like to visit his Rajah and say a useful word there. Perhaps the man has heard of us and means to show his good will.
        - id: ch01-b37
          speaker: russian
          text: There is no time. We must reach Simla quickly. I only wish our reports had gone back from Hilas, or at least from Leh.
        - id: ch01-b38
          speaker: frenchman
          text: The English post is safer. They grant every convenience to us, and even to men like this. Can anyone believe such stupidity?
        - id: ch01-b39
          speaker: russian
          text: It is pride, and they will be punished for it.
        - id: ch01-b40
          speaker: frenchman
          text: There is some danger when we play this game against another European. But these people? It is almost too easy.
        - id: ch01-b41
          speaker: russian
          text: Pride, my friend. Nothing but pride.
        - id: ch01-b42
          speaker: hurree
          text: What good is Chandernagore being so near Calcutta if I cannot understand their French? They speak so particularly fast. Cutting their beastly throats would have been much simpler.
        - id: ch01-b43
          speaker: narrator
          text: Hurree said this while apparently snoring on the wet moss. When he returned to the men, he claimed a terrible headache. He begged forgiveness and worried aloud that drink had made him careless. Now he adored the British Government, the source of all prosperity and honor, and insisted his Rajah felt the same. The men mocked him with his earlier words. Little by little, Hurree allowed his defenses to collapse. With embarrassed smiles and crafty looks, he let them believe they had forced the truth from him.
        - id: ch01-b44
          speaker: narrator
          text: The carriers stood in the rain beneath grass mats. Water gathered in the prints around their feet while they watched and pretended not to listen. Later, when Lurgan heard the story, he mourned that he had not been hidden among those stubborn men. Every real Sahib they knew came back gladly, year after year, to a favorite ravine. Those rough-clothed hunters brought servants, cooks, orderlies, and often hillmen who understood the country. These foreigners had no such followers. The carriers decided they must be poor Sahibs and ignorant ones too, because no Sahib in his right mind would follow advice from a Bengali. Yet this Bengali had appeared from nowhere, paid them silver, and managed their dialect. They were used to broad and thorough mistreatment from their own people. That made them certain a trap lay somewhere nearby, though they could not see it, and they remained ready to scatter whenever the chance came.
        - id: ch01-b45
          speaker: narrator
          text: When the storm passed, Hurree led them down through newly washed air that steamed with the rich smell of wet earth. He placed himself carefully between the two halves of the party. Before the carriers, he walked with the pride of a powerful official. Behind the foreigners, he became humility itself. Many thoughts moved through his mind, and even the least of them would have deeply interested the men he guided. Outwardly, he remained pleasant, helpful, and eager to point out every beauty in his royal master's country. If they wanted game, he filled the hills with whatever they hoped to kill. There were thar, ibex, markhor, and even bears, if the prophet Elisha allowed them. He spoke at length about plants and peoples with complete confidence and almost no accuracy. His store of local legends never ran dry. After all, he had spent fifteen years as a trusted servant of the state.
        - id: ch01-b46
          speaker: frenchman
          text: This man is certainly an original. He is like a Viennese courier seen in a nightmare.
        - id: ch01-b47
          speaker: russian
          text: He carries all of India in transition inside him, an ugly mixture of East and West. Men like us know how to manage Orientals.
        - id: ch01-b48
          speaker: frenchman
          text: He has lost his first country without gaining another. Still, his hatred for his conquerors is complete. You should have heard what he told me last night.
        - id: ch01-b49
          speaker: narrator
          text: Beneath the umbrella, Hurree strained to follow their rapid French. At the same time, he watched the extra-large basket under its double red cover. It held maps and documents. He did not yet plan to steal anything. First he needed to learn what should be stolen and how to escape afterward. He thanked every god of India, as well as Herbert Spencer, that the men still carried valuables worth taking.
        - id: ch01-b50
          speaker: narrator
          text: On the second day, the road climbed sharply to a grassy ridge above the forest. Near sunset, the party found an old lama sitting cross-legged over a mysterious chart weighted with stones. He was explaining it to a handsome, dirty young disciple. Kim had spotted the striped umbrella from half a day's march away and persuaded the lama to stop until it reached them.
        - id: ch01-b51
          speaker: hurree
          text: Ah! That is an important local holy man and probably one of my royal master's subjects.
        - id: ch01-b52
          speaker: frenchman
          text: What is he doing? This is very curious.
        - id: ch01-b53
          speaker: hurree
          text: He is explaining a sacred picture. Every part was made by hand.
        - id: ch01-b54
          speaker: narrator
          text: The foreigners stood bareheaded in the low golden sunlight. The tired carriers gladly lowered their loads.
        - id: ch01-b55
          speaker: frenchman
          text: Look at them. It is like a painting of a religion being born, with the first teacher and his first disciple. Is he a Buddhist?
        - id: ch01-b56
          speaker: russian
          text: Some corrupted kind. There are no true Buddhists in these hills. But see the folds of his robe and the look in his eyes. Why does he make our own people seem so young? We have left our mark nowhere, and that troubles me.
        - id: ch01-b57
          speaker: frenchman
          text: Be patient. Our peoples will leave that mark together. For now, draw him.
        - id: ch01-b58
          speaker: narrator
          text: Hurree approached with his back proudly straight, though his words were humble. He winked at Kim.
        - id: ch01-b59
          speaker: hurree
          text: Holy One, these are Sahibs. My medicine cured one of them, and I am taking him to Simla to watch his recovery. They wish to see your picture.
        - id: ch01-b60
          speaker: lama
          text: Healing the sick is always good. This is the Wheel of Life, the same Wheel I showed you in the hut at Ziglaur while the rain fell.
        - id: ch01-b61
          speaker: hurree
          text: They would also like to hear you explain it.
        - id: ch01-b62
          speaker: lama
          text: It is good to teach the Most Excellent Way. Do they know any Hindi, as the Keeper of Images did?
        - id: ch01-b63
          speaker: hurree
          text: A little, perhaps.
        - id: ch01-b64
          speaker: narrator
          text: The lama brightened like a child given a new game. He threw back his head and began the full, ringing invocation used by a learned teacher before opening the doctrine. The foreigners leaned on their mountain staffs and listened. Kim crouched humbly beside his master. He watched the red light of sunset move across the strangers' faces, and he watched their long shadows blend together and pull apart over the gold grass. They wore leggings unlike any Englishman's and curious belts drawn tightly around their bodies. The clothes stirred a hazy memory of an illustrated book in the St Xavier's library, The Adventures of a Young Naturalist in Mexico. The two men looked very much like the marvelous explorer in that tale. To Kim, they looked nothing like the highly unscrupulous people Hurree had promised. Behind them, the carriers crouched close to the earth, silent and reverent, twenty or thirty yards away. The loose edges of Hurree's thin clothes snapped in the cold wind like a survey flag, but he stood over the whole scene with the happy pride of its owner.
        - id: ch01-b65
          speaker: hurree
          text: These are our men. Their books, reports, and maps are in the large basket with the reddish top. I have also seen a King's letter from either Hilas or Bunar. They guard it very closely. Nothing was sent back from Hilas or Leh. I am certain.
        - id: ch01-b66
          speaker: kim
          text: Who travels with them?
        - id: ch01-b67
          speaker: hurree
          text: Only the forced carriers. They have no servants at all. They are so poor they even cook their own food.
        - id: ch01-b68
          speaker: kim
          text: Then what am I supposed to do?
        - id: ch01-b69
          speaker: hurree
          text: Wait. If I find an opening, you will know where the papers are.
        - id: ch01-b70
          speaker: kim
          text: Mahbub Ali would handle this better than a Bengali.
        - id: ch01-b71
          speaker: hurree
          text: A man can reach his sweetheart in more ways than by charging straight through the wall.
        - id: ch01-b72
          speaker: lama
          text: Here is the Hell set aside for greed. Desire stands on one side, and Weariness on the other.
        - id: ch01-b73
          speaker: narrator
          text: The lama grew warmer as he taught, and one foreigner sketched him in the fading light.
        - id: ch01-b74
          speaker: russian
          text: That is enough. I cannot understand the old man, but I want his picture. He draws better than I do. Ask what he will take for it.
        - id: ch01-b75
          speaker: hurree
          text: He says no, sir.
        - id: ch01-b76
          speaker: narrator
          text: The lama would no sooner sell his chart to a passing stranger than an archbishop would pawn the sacred vessels from his cathedral. Cheap Wheels were common in Tibet, but this lama was an artist as well as the wealthy abbot of Such-zen.
        - id: ch01-b77
          speaker: lama
          text: In three days, or four, or ten, if I learn that the Sahib is a Seeker with understanding, I may draw another for him. This Wheel was used to begin a novice in the teaching. Tell him that, hakim.
        - id: ch01-b78
          speaker: hurree
          text: He wants this one now. He offers money.
        - id: ch01-b79
          speaker: narrator
          text: The lama slowly shook his head and began folding the Wheel. The Russian saw only a filthy old man bargaining over dirty paper. Half in jest, he pulled out a fistful of rupees and grabbed the chart. It tore between their hands. The carriers gave a low cry of horror. Some were Spiti men and good Buddhists by their own measure. The lama rose at the insult and reached for the heavy iron pencil case that served a priest as a weapon. Hurree danced in distress.
        - id: ch01-b80
          speaker: hurree
          text: Now you see why I wanted witnesses. These men are highly unscrupulous. Sir, you must not strike a holy man!
        - id: ch01-b81
          speaker: lama
          text: Chela! He has defiled the Written Word!
          emotion: angry
        - id: ch01-b82
          speaker: narrator
          text: Kim was too late to stop him. The Russian struck the old man squarely across the face. An instant later, Kim had him by the throat, and both were rolling over and over downhill. The blow awakened every unknown Irish devil in the boy's blood, and the enemy's sudden fall gave those devils full freedom. The lama sank to his knees, half stunned. The loaded carriers fled uphill with their heavy baskets as quickly as plainsmen could run on level ground. They had seen an unspeakable sacrilege. Before the gods and devils of the mountains took revenge, they meant to put as much distance as possible between themselves and the guilty men.
        - id: ch01-b83
          speaker: narrator
          text: The Frenchman rushed toward the lama, fumbling for his revolver and hoping to seize him as a hostage. The hillmen drove him back with a shower of sharp stones. A carrier from Ao-chung swept up the lama and carried him with the fleeing men. Everything happened as fast as darkness falls in the mountains.
        - id: ch01-b84
          speaker: frenchman
          text: They have stolen the baggage and every gun!
          emotion: surprised
        - id: ch01-b85
          speaker: narrator
          text: He fired blindly into the twilight. Hurree pounded down the slope and threw himself upon a delighted Kim, who was hammering his breathless enemy's head against a rock.
        - id: ch01-b86
          speaker: hurree
          text: It is all right, sir. Stop shooting. I shall rescue him.
        - id: ch01-b87
          speaker: hurree
          text: Go back to the carriers. They have all the baggage. Search every basket, but the papers are beneath the red top. Take those papers, especially the murasla, the King's letter. Go! The other man is coming.
        - id: ch01-b88
          speaker: narrator
          text: Kim raced uphill. A revolver bullet struck a rock beside him, and he ducked like a partridge.
        - id: ch01-b89
          speaker: hurree
          text: If you keep firing, the hillmen will come down and destroy us. I rescued this gentleman, sir. This is particularly dangerous.
        - id: ch01-b90
          speaker: kim
          text: By Jove, this is a terribly tight place. Still, I think it counts as self-defense.
        - id: ch01-b91
          speaker: narrator
          text: Kim reached inside his clothes for Mahbub's gift. Apart from a few practice shots in the Bikanir desert, he had never fired the little pistol. He pulled the trigger uncertainly.
        - id: ch01-b92
          speaker: hurree
          text: What did I tell you, sir? Come down and help bring this man around. Every one of us is trapped.
        - id: ch01-b93
          speaker: narrator
          text: The shooting stopped. Feet stumbled below while Kim hurried through the dark, swearing like a cat and a boy raised in the country.
        - id: ch01-b94
          speaker: lama
          text: Did they wound you, chela?
        - id: ch01-b95
          speaker: kim
          text: No. Did they hurt you?
        - id: ch01-b96
          speaker: narrator
          text: Kim plunged into a patch of stunted firs.
        - id: ch01-b97
          speaker: lama
          text: I am not wounded. Come away. We will go with these people to Shamlegh-under-the-Snow.
        - id: ch01-b98
          speaker: ao_chung_man
          text: We must give the Sahibs justice first. I have all four guns. Let us go back down.
        - id: ch01-b99
          speakers: [spiti_man, hillman]
          ensemble: duo
          text: He struck the Holy One. We saw it! Our cows will have no calves, our wives will bear no children, and snow will crash down on us before we reach home. This comes on top of every other oppression!
          emotion: fearful
        - id: ch01-b100
          speaker: narrator
          text: The fir grove filled with shouting carriers. Panic had made them capable of anything. The Ao-chung hunter worked the bolt of a stolen rifle and started downhill.
        - id: ch01-b101
          speaker: ao_chung_man
          text: Wait here, Holy One. They cannot go far. I will return soon.
        - id: ch01-b102
          speaker: lama
          text: I am the one they wronged.
        - id: ch01-b103
          speaker: ao_chung_man
          text: That is exactly why I must go.
        - id: ch01-b104
          speaker: lama
          text: If I forgive the wrong, your hands remain clean. You will also gain merit by obeying me.
        - id: ch01-b105
          speaker: ao_chung_man
          text: Then wait here, and afterward we will all travel to Shamlegh.
        - id: ch01-b106
          speaker: narrator
          text: The lama hesitated only as long as it took the hunter to load one cartridge. Then he stood and placed a finger on the man's shoulder.
        - id: ch01-b107
          speaker: lama
          text: Listen to me. There will be no killing. I was Abbot of Such-zen, and I forbid it. Do you wish so badly to be reborn as a rat, a snake beneath the roof, or a worm inside the lowest beast?
          emotion: angry
        - id: ch01-b108
          speaker: narrator
          text: His voice boomed like a Tibetan devil-gong. The hunter dropped to his knees.
        - id: ch01-b109
          speakers: [spiti_man, hillman]
          ensemble: duo
          text: Do not curse us, Holy One. Do not curse him. His devotion carried him too far. Put down that rifle, fool!
          emotion: fearful
        - id: ch01-b110
          speaker: lama
          text: Anger added to anger only makes more evil. No one will be killed. Leave the priest-beaters bound to the results of their own deeds. The Wheel is just and certain. It does not turn aside by so much as a hair. They will be born into torment many times.
          emotion: angry
        - id: ch01-b111
          speaker: narrator
          text: The lama's head fell forward, and he leaned heavily on Kim's shoulder.
        - id: ch01-b112
          speaker: lama
          text: I came close to great evil, chela. I wanted the bullet released. In Tibet they would have died slowly and painfully for this. He struck my face. He struck my flesh.
          emotion: sad
        - id: ch01-b113
          speaker: narrator
          text: He slid to the ground, breathing hard. Kim heard his exhausted heart pound, then falter.
        - id: ch01-b114
          speaker: ao_chung_man
          text: Have they injured him so badly that he will die?
          emotion: fearful
        - id: ch01-b115
          speaker: kim
          text: No! It is only weakness. Open the baskets. The Sahibs may have medicine.
          emotion: fearful
        - id: ch01-b116
          speaker: narrator
          text: Kim remembered that he was white and had the equipment of white travelers within reach.
        - id: ch01-b117
          speaker: ao_chung_man
          text: Then I know the medicine. I did not serve Yankling Sahib as a hunter for five years without learning this. I have tasted it myself. Look!
        - id: ch01-b118
          speaker: narrator
          text: He pulled a bottle of cheap explorer's whisky from his coat and skillfully forced a little between the lama's teeth.
        - id: ch01-b119
          speaker: ao_chung_man
          text: I gave Yankling Sahib this when he twisted his foot beyond Astor. I have already looked in their baskets, but we will divide everything fairly at Shamlegh. Give the Holy One a little more. It is good medicine. Feel his heart. It is stronger. Lay down his head and rub some on his chest. If he had let me settle matters with the Sahibs, this would not have happened. If they chase us, surely we may shoot them with their own guns.
        - id: ch01-b120
          speaker: kim
          text: I think one has already been paid. I kicked him in the groin while we rolled downhill. I wish I had killed him.
          emotion: angry
        - id: ch01-b121
          speaker: rampur_man
          text: Bravery is easy when you do not live in Rampur. If the Sahibs give us a bad name, no one will hire us as hunters again.
        - id: ch01-b122
          speaker: spiti_man
          text: These are not English Sahibs like cheerful Fostum Sahib or Yankling Sahib. They are foreigners. They cannot even speak English as Sahibs should.
        - id: ch01-b123
          speaker: narrator
          text: The lama coughed, sat up, and searched for his rosary.
        - id: ch01-b124
          speaker: lama
          text: There must be no killing. The Wheel is just. Evil cannot cure evil.
        - id: ch01-b125
          speaker: ao_chung_man
          text: We are all here, Holy One. No one will die unless you command it. Rest now. We will camp here a little while, then go to Shamlegh-under-the-Snow when the moon rises.
        - id: ch01-b126
          speaker: spiti_man
          text: Sleep is the best thing after a blow.
        - id: ch01-b127
          speaker: lama
          text: The back of my neck feels dizzy and pinched. Let my head rest in your lap, chela. I am old, but passion still holds me. We must consider the Cause of Things.
        - id: ch01-b128
          speaker: hillman
          text: Give him a blanket. We cannot make a fire, or the Sahibs will see it.
        - id: ch01-b129
          speaker: rampur_man
          text: We should leave for Shamlegh. No one will follow us there.
        - id: ch01-b130
          speaker: ao_chung_man
          text: I hunted for Fostum Sahib, and I still hunt for Yankling Sahib. Only this cursed forced service kept me from him today. Two men can watch below with the rifles in case the Sahibs try more foolishness. I will stay beside the Holy One.
        - id: ch01-b131
          speaker: narrator
          text: The men sat a little apart from the sleeping lama. They listened for danger, and when no pursuit came, they passed a water pipe from hand to hand. Its bowl had been made from an old blacking bottle. Each time it moved, the glow of red charcoal showed narrow blinking eyes, high Chinese cheekbones, and thick throats disappearing into the dark wool wrapped around their shoulders. They looked like small spirits from some enchanted mine, mountain gnomes holding a council in the dark. All around them, the snow water ran and whispered down the slope. Then the night frost tightened its grip. One tiny channel after another clogged and fell silent, until those voices disappeared from the darkness.
        - id: ch01-b132
          speaker: spiti_man
          text: Did you see how the Holy One stood against us? Seven seasons ago, near Ladakh, Dupont Sahib wounded an old ibex in the shoulder. It stood just like that. Dupont Sahib was a good hunter.
        - id: ch01-b133
          speaker: ao_chung_man
          text: Not as good as Yankling Sahib. Now listen to me, unless another man believes he knows better.
        - id: ch01-b134
          speaker: narrator
          text: No one accepted the challenge. The Ao-chung man drank from the whisky bottle and passed it on.
        - id: ch01-b135
          speaker: ao_chung_man
          text: When the moon rises, we go to Shamlegh. There we divide the baggage fairly. I will take this new little rifle and all its cartridges.
        - id: ch01-b136
          speaker: hillman
          text: Are the bears worse on your land than anywhere else?
        - id: ch01-b137
          speaker: ao_chung_man
          text: No, but a musk pod brings six rupees now. Your women may take the tent cloth and some cooking gear. Before dawn, we divide everything and go separate ways. We must remember that we never saw these Sahibs and never worked for them. They may accuse us of stealing their loads.
        - id: ch01-b138
          speaker: rampur_man
          text: That suits you. What will our Rajah say?
        - id: ch01-b139
          speaker: ao_chung_man
          text: Who will tell him? The foreigners cannot speak our language. The Babu gave us money for his own purpose, so he will not lead an army against us. We will throw whatever we do not want into the Shamlegh rubbish pit, where no man goes.
        - id: ch01-b140
          speaker: hillman
          text: Who stays at Shamlegh this summer? There are only three or four grazing huts.
        - id: ch01-b141
          speaker: ao_chung_man
          text: The Woman of Shamlegh is there, and she has no love for Sahibs. Small gifts will please the others. There is plenty for everyone in these baskets.
        - id: ch01-b142
          speaker: rampur_man
          text: But still...
        - id: ch01-b143
          speaker: ao_chung_man
          text: I told you, these are not true Sahibs. They bought every skin and animal head in the Leh bazaar. I know the marks, and I showed them to you during the last march.
        - id: ch01-b144
          speaker: spiti_man
          text: That is true. They bought them all. Moths had already eaten some.
        - id: ch01-b145
          speaker: narrator
          text: It was a clever argument, and the Ao-chung man understood his companions.
        - id: ch01-b146
          speaker: ao_chung_man
          text: If trouble comes, I will tell Yankling Sahib, and he will laugh. We have harmed no Sahib we know. These foreigners beat a priest and frightened us, so we ran. Who can say where the baggage fell? Yankling Sahib will never let lowland police disturb his hunting grounds. Simla is far from Chini, and Shamlegh is even farther from its rubbish pit.
        - id: ch01-b147
          speaker: hillman
          text: Very well, but I carry the large red-topped basket that the Sahibs pack themselves every morning.
        - id: ch01-b148
          speaker: ao_chung_man
          text: That proves again they are Sahibs of no importance. Fostum Sahib, Yankling Sahib, and even little Peel Sahib, who stays awake at night to shoot serow, all come with cooks, servants, and a whole tail of well-paid, overbearing followers. These men have none. How could they cause trouble? What is wrong with the basket?
        - id: ch01-b149
          speaker: hillman
          text: It holds the Written Word. There are books, papers covered in their writing, and strange tools that look like objects of worship.
        - id: ch01-b150
          speaker: ao_chung_man
          text: The Shamlegh rubbish pit can swallow all of it.
        - id: ch01-b151
          speaker: hillman
          text: What if throwing it away insults the Sahibs' gods? I will not treat the Written Word so lightly. Their brass idols mean nothing to me. Simple hill people cannot use such plunder.
        - id: ch01-b152
          speaker: ao_chung_man
          text: The old man is still asleep. We will ask his chela. Young priest, we have a basket whose nature we do not understand.
        - id: ch01-b153
          speaker: narrator
          text: The lama breathed easily in natural sleep. Kim had spent the quiet time thinking about Hurree's last instructions. As a player of the Great Game, he now felt considerable respect for the Babu.
        - id: ch01-b154
          speaker: kim
          text: I know that basket. The red-topped one contains very powerful things. Fools should never touch them.
        - id: ch01-b155
          speaker: hillman
          text: I said so! Will it betray us?
        - id: ch01-b156
          speaker: kim
          text: Not if you give it to me. I can remove its magic. Otherwise, it will bring great harm.
        - id: ch01-b157
          speaker: ao_chung_man
          text: A priest always claims his share.
        - id: ch01-b158
          speaker: narrator
          text: The whisky had made the Ao-chung man reckless.
        - id: ch01-b159
          speaker: kim
          text: It makes no difference to me. Divide those things among yourselves and discover what follows.
        - id: ch01-b160
          speaker: ao_chung_man
          text: I was only joking. Give your order. There is enough for all of us. At dawn we leave Shamlegh and go our separate ways.
        - id: ch01-b161
          speaker: narrator
          text: For another hour, the hillmen arranged and rearranged their simple plans. Kim shivered with cold and pride. Both the Irish and the Indian sides of him delighted in the joke. These foreigners were agents of the feared power in the north. In their own country, they might be as important as Mahbub or Colonel Creighton. They had met kings and made promises to them. Now both men had been struck helpless in a single evening, and Kim privately knew that one would remain lame for some time. Somewhere on the dark slope below, they had nothing left. Their charts were gone. So were their food, tents, and guns. Without the carriers, and with no guide except Hurree Babu, they could hardly move. Kim wondered who would receive their report when they finally escaped. Their whole part in the Great Game had collapsed without any clever plan from Hurree and without any contrivance from Kim. It had happened simply, beautifully, and inevitably, just as the eager young policeman at Umballa had once captured Mahbub's disguised friends.
        - id: ch01-b162
          speaker: kim
          text: They are down there with nothing, and I am up here with everything they had. By Jove, they will be angry. I am sorry for Hurree Babu, especially in this cold.
        - id: ch01-b163
          speaker: narrator
          text: Kim need not have pitied him. Hurree suffered sharply in his body, but his spirit had swollen with pride. A mile downhill, at the edge of the pine forest, the two half-frozen foreigners blamed each other, then joined in bitter abuse of the Babu. One of them was seized by violent sickness from time to time. Hurree acted as though terror had driven him out of his mind. When they demanded a plan, he explained that they were fortunate merely to be alive. The carriers had gone beyond recall, unless they were even then creeping through the darkness to finish the work. His Rajah waited ninety miles away. Instead of providing money and a fine train of servants for their journey to Simla, the Rajah would certainly throw them into prison if he learned that they had struck a priest.
        - id: ch01-b164
          speaker: narrator
          text: Hurree described the sin of striking a holy man and all its terrible consequences until the foreigners ordered him to speak of something else. Their only hope, he said, was an unnoticed escape from one village to the next until they reached civilization. For perhaps the hundredth time, he dissolved into tears and demanded that the high stars explain why the Sahibs had beaten a holy man. Ten steps into the creaking darkness of the forest would have placed him entirely beyond their reach. The nearest village would have welcomed a quick-tongued doctor, fed him, and given him shelter. Instead, Hurree chose the cold, the pinch of an empty belly, harsh words, and even an occasional blow in the company of his honored employers. Crouched close against a tree trunk, he sniffed with practiced misery.
        - id: ch01-b165
          speaker: frenchman
          text: Have you considered how we shall look, wandering through these hills among the natives?
          emotion: angry
        - id: ch01-b166
          speaker: narrator
          text: Hurree had considered little else for hours, but the question was aimed at the other foreigner.
        - id: ch01-b167
          speaker: russian
          text: We cannot wander anywhere. I can hardly walk.
        - id: ch01-b168
          speaker: hurree
          text: Perhaps the holy man will show mercy and loving-kindness, sir. Otherwise...
        - id: ch01-b169
          speaker: russian
          text: The next time I meet that young priest, I shall take special pleasure in emptying my revolver into him.
          emotion: angry
        - id: ch01-b170
          speaker: hurree
          text: Revolvers, revenge, priests! And what about everything you have lost? The baggage, gentlemen! All that you carried and all that you gained in eight months of work. You said you knew how to manage Orientals. This has gone very well indeed.
        - id: ch01-b171
          speaker: narrator
          text: The foreigners began attacking each other in several languages, and Hurree smiled to himself. Kim was with the baskets, and inside those baskets lay the harvest of eight months of diplomacy. There was no way to send the boy a message, but Hurree knew he could be trusted. As for the foreigners, Hurree could manage every step of their miserable journey through the hills. By the time he finished, Hilas, Bunar, and four hundred miles of mountain roads would know the tale and repeat it for a generation. In the hills, no one gives much respect to a man who cannot control his own carriers. The hillman's sense of humor is also very keen, especially when proud strangers make themselves ridiculous.
        - id: ch01-b172
          speaker: hurree
          text: If I had planned the whole affair myself, it could not have gone better. And now I think of it, of course I did arrange it. How quick I was! The outrage happened by accident, but only I could have turned it to such excellent use. Think of the effect on these ignorant peoples. No treaties, no papers, no written proof of any kind, and I alone will explain what happened. How the Colonel and I will laugh! I wish I had the papers too, but one cannot occupy two places in space at the same time. That is axiomatic.
