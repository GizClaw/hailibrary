      tts: {delivery: "从容而机敏的讲述", timbre: "温暖清晰", pace: "舒展而有变化", pitch: "中音"}
    kim:
      display_name: 金
      tts: {delivery: "机灵大胆，话里常带笑", timbre: "明亮的少年声", pace: "轻快敏捷", pitch: "中高音"}
    hurree:
      display_name: 胡里·钱德尔·穆克吉
      tts: {delivery: "一本正经而滔滔不绝，英语腔调夸张", timbre: "厚重圆润", pace: "稍快", pitch: "中音"}
    lama:
      display_name: 德舒喇嘛
      tts: {delivery: "慈爱虔诚，沉思中透着天真", timbre: "清瘦柔和的老人声", pace: "从容缓慢", pitch: "中低音"}
    betah:
      display_name: 贝塔山民
      tts: {delivery: "质朴敬畏，说话直爽", timbre: "粗粝结实", pace: "平稳", pitch: "中低音"}
    frenchman:
      display_name: 法国猎人
      tts: {delivery: "自信敏锐，情急时尖刻", timbre: "清亮坚实", pace: "明快", pitch: "中音"}
    russian:
      display_name: 俄国猎人
      tts: {delivery: "傲慢强硬，语气冷峻", timbre: "低沉厚重", pace: "沉稳", pitch: "低音"}
    ao_chung:
      display_name: 奥仲猎手
      tts: {delivery: "豪爽果断，惯于领头", timbre: "粗厚洪亮", pace: "明快", pitch: "中低音"}
    spiti_1:
      display_name: 斯皮提山民甲
      tts: {delivery: "敬畏虔诚，情绪外露", timbre: "清瘦高亢", pace: "稍快", pitch: "中高音"}
    spiti_2:
      display_name: 斯皮提山民乙
      tts: {delivery: "朴实谨慎，说话干脆", timbre: "沙哑结实", pace: "平稳", pitch: "中音"}
    rampur_man:
      display_name: 兰普尔山民
      tts: {delivery: "谨慎胆小，处处权衡", timbre: "紧涩低哑", pace: "稍慢", pitch: "中音"}
    shamlegh_man:
      display_name: 沙姆莱山民
      tts: {delivery: "机敏圆滑，善于说服", timbre: "明亮粗朴", pace: "轻快", pitch: "中音"}
  chapters:
    - id: ch01
      title: 第十三章
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: "谁曾渴望大海，渴望那浩瀚而轻蔑的狂涛？船首刺向星辰以前，会颤抖，会踉跄，会猛然偏转，接着一头扎进波峰。信风上空，云列整整齐齐。云层下面，湛蓝的海隆起脊背，咆哮不止。峭壁旁潜伏的狂飙从不预先招呼，前帆却已发出排炮般的低吼。无论奇景怎样变幻，他的海始终是同一片海，也只有它，能使他的生命圆满。山里人渴望自己的群山，也是这样，绝无二样。这首诗叫《大海与群山》。进山的人，便是回到母亲身边。"
        - id: ch01-b02
          speaker: narrator
          text: "金和喇嘛已经越过西瓦利克群山和半属热带的杜恩谷。他们把穆索里留在身后，沿着狭窄山路一路向北。一天又一天，两人走进层层聚拢的山脉。也是一天又一天，金眼看喇嘛重新长出一个男人该有的力气。在杜恩谷的梯田间，老人还倚着金的肩膀。每逢路边能歇脚，他都巴不得停上一停。到了穆索里脚下的大坡，他却收紧全身，像一个老猎人迎向记忆里熟悉的陡岸。原本该累倒的地方，他反倒甩开长袍，深深吸进整整两肺清亮得像钻石的空气，迈出了只有山里人才迈得出的步子。金生在平原，也吃平原的饭长大，只能跟在后面流汗喘气，惊讶地望着师父。"
        - id: ch01-b03
          speaker: lama
          text: "这才是我的地方。跟圣泽山相比，此地简直平得像稻田。"
        - id: ch01-b04
          speaker: narrator
          text: "喇嘛从腰胯发力，稳稳往上走。可真正让金吃苦的是陡峭下坡，三小时就要下降三千英尺。为了收住脚步，他背脊酸痛，草鞋绳几乎勒断大脚趾，喇嘛却早把他甩在后面。他们穿过高大雪松林里斑驳的树影，也从羽毛般披满蕨叶的橡树下走过。一路还有桦树、冬青、杜鹃和松林。出了树林，便是光秃山坡，晒焦的草又滑又险。重新钻进树林，凉意才裹住身体。就这样，他们一次次走出阴影，又回到阴影。直到橡树让位给山谷里的竹与棕榈，喇嘛一直走得轻快，不见疲色。"
        - id: ch01-b05
          speaker: narrator
          text: "黄昏时，老人回望身后的巨大山脊，再看看他们走来的那缕细路，便替第二天划出新的行程。他会站在通往斯皮提和库卢的垭口上，朝天边雪峰伸出双手。黎明一到，荒野的两位君王凯达尔纳特峰和巴德里纳特峰最先接住阳光，在冷蓝天空下迎风烧红。白天，它们像熔化的银。傍晚，又重新披上珠宝。起初，山风还很温和。过了几天，他们到了九千或一万英尺高处，风便有了刀锋。金让一村山民送给自己一件粗毯外衣，好让他们积些功德。喇嘛却不明白，旁人为何会怕这种风。那风已经把他肩头的岁月一层层削掉。"
        - id: ch01-b06
          speaker: lama
          text: "徒儿，这不过是低山。等到了真正的群山，才算得上冷。"
        - id: ch01-b07
          speaker: kim
          text: "空气和水还不错，百姓也够虔诚，可这里的饭实在难吃。我们走路又像疯子，或者像英国人。夜里还会结冰。"
        - id: ch01-b08
          speaker: lama
          text: "也许结一点冰，不过刚好能让老骨头见了太阳便欢喜。软床和美食，不能时时贪恋。"
        - id: ch01-b09
          speaker: kim
          text: "那我们至少沿着路走吧。"
        - id: ch01-b10
          speaker: narrator
          text: "金是平原人，哪怕现成的路不到六英尺宽，像蛇一样缠在山间，他也觉得比别处可靠。喇嘛却是西藏人，见到山嘴和碎石坡的边缘就忍不住抄近道。他告诉跛着脚跟来的徒弟，山里长大的人能猜出山路转向哪里。低云也许会挡住初来乍到的陌生人，却拦不住肯动脑筋的人。于是，他们常常辛苦攀爬好几个钟头。这样的路程放在所谓文明国家，已经算一场相当体面的登山。两个人气喘吁吁翻过鞍部，侧身贴着几处塌方蹭过去，再从倾斜四十五度的森林陡坡一路下降，最后重新落回那条现成道路。"
        - id: ch01-b11
          speaker: narrator
          text: "沿途的山村，屋子由泥土砌成，木料偶尔带着斧头粗凿的花纹。有的村子像燕窝一样粘在绝壁上，有的挤在三千英尺长坡中间的一小块平地，有的塞进两面峭壁之间，让每阵游荡的风都集中冲来。还有些村子只为夏季牧场而建，怯生生缩在山颈上，冬天会埋进十英尺深的雪里。蜡黄油腻的山民裹着粗呢，露出两条短腿，面孔几乎像爱斯基摩人。他们一看见喇嘛，便倾村出来膜拜。平原待他温厚，把他看作众圣人中的一位。群山却把他当成深受所有鬼神信任的人。这里的佛教已经模糊得快要认不出，上面覆盖的自然崇拜，像本地景色一样奇诡，也像狭小梯田一样繁复。可山民还认得大帽、咔嗒作响的念珠和珍稀的汉文经卷。他们敬畏这些标记，也敬重帽子下面的老人。"
        - id: ch01-b12
          speaker: betah
          text: "我们看见你们从欧阿的黑乳峰下来。那条路平常没人走，除非夏天有刚产犊的母牛迷了路。石头间藏着一阵怪风，就算天气一动不动，它也能把人掀倒。不过像你们这样的人，怎么会怕欧阿的魔鬼！"
        - id: ch01-b13
          speaker: narrator
          text: "金浑身酸痛，向下看得头晕，脚趾为了抠住岩缝也磨破了。听见这番夸奖，他却像圣泽维尔赢下四分之一英里赛跑的男孩一样快活。山路把他骨头上的酥油、糖和板油都榨了出去。垭口的干空气扩开胸廓，倾斜的大地又在腿上炼出了硬实肌肉。"
        - id: ch01-b14
          speaker: narrator
          text: "眼前的诱惑少了，师徒便常常参悟生命之轮。群山里只有灰鹰，偶尔在远坡掘土寻食的熊，黎明时撞见的斑斓豹子。那豹子满身怒气，正在一座寂静山谷里撕吃山羊。除此之外，也只有几只艳丽小鸟。更多时候，陪着他们的只是风，以及风中会唱歌的草。他们下山时，甚至会从烟熏火燎的茅屋顶上走过去。屋里的女人不美，也不洁净，常常一妻多夫，还患着甲状腺肿。男人务农，也伐木，性情温顺，单纯得不可思议。命运怕师徒没有合适的谈资，又把那位彬彬有礼的达卡医生送到路上。他用药膏治肿大的脖子，也拿劝告调解夫妻争执，以此换取食宿。他熟悉山地，不亚于熟悉各处方言，还会讲去往拉达克、西藏的道路。他说，师徒随时都能回平原。如果喜欢山，眼前这条路就很值得消遣。"
        - id: ch01-b15
          speaker: narrator
          text: "他们时而赶上医生，时而被他赶过。这些山地和道路的消息，并不是一口气全说出来的。到了晚上，三个人会在石砌打谷场相聚，再一点点谈起。病人都散去以后，医生坐着抽烟，喇嘛坐着吸鼻烟。金看屋顶上的小牛低头吃草，也任自己的心魂追着目光，飞过一道道山岭间深蓝的沟壑。有时，他们也会在黑沉沉的树林里单独说话。医生要进去寻找药草，金既然是个初学医术的人，自然必须陪他。"
        - id: ch01-b16
          speaker: hurree
          text: "奥哈拉先生，我真是完全不知道，找到那两位打猎的朋友以后该见鬼地怎么办。只求你待在我这把伞看得见的地方。我这把伞可是很好的固定点，拿来做地籍测量都靠得住。"
        - id: ch01-b17
          speaker: kim
          text: "哈基姆，这不是我的地方。要在这些山里找出一个人，只怕比从熊皮里捉一只虱子还难。"
        - id: ch01-b18
          speaker: hurree
          text: "哦，泽恰好是我的长处。胡里从来不急。他们不久前还在列城，说自己从喀喇昆仑下来，兽头、兽角，全都带着。我只怕他们早已把书信和见不得人的东西送回俄国。现在当然要尽量往东，好证明自己没去过西边那些土邦。你看，他们本该从斯利那加或阿伯塔巴德进来，沿河经过本吉和阿斯托尔，那才是近路。可他们在西边闯了祸，只好一路往东，先去寒冷的列城，再沿印度河下到汉莱，最后走到布沙尔和奇尼谷。排除别的路线，再问问被我治好的人，便能确定。我一定会在奇尼谷某处抓到他们。你只管盯住这把伞。"
        - id: ch01-b19
          speaker: narrator
          text: "蓝白雨伞像一朵迎风点头的风铃草，沿着山谷向下，又绕过一面面山坡。时机一到，喇嘛和靠罗盘定方向的金便赶上去。胡里正趁傍晚卖药膏和药粉。喇嘛会随口说，他们从某一条路、某一处山岭走来，再漫不经心地用手指指向身后。那里只有一重又一重看不到尽头的山脊。胡里望上一眼，便把能想出来的赞美和恭维全都倒出来。"
        - id: ch01-b20
          speaker: narrator
          text: "他们在冰冷月色里翻过一道雪口。积雪没到喇嘛膝头，他还温和地笑金走得慢。老人陷在雪里的模样，就像克什米尔客栈里那种生在雪乡、浑身长毛的双峰骆驼。两人穿过铺着薄雪的洼地，也走过撒满雪粉的页岩。大风扑来时，他们躲进一队西藏人的营地。那些人正赶着小羊匆匆下山，每只羊都背着一袋硼砂。后来，他们走出还带着点点残雪的草肩，穿过森林，又走到新的草地。可无论赶了多少路，凯达尔纳特峰和巴德里纳特峰都毫不动心。过了许多天，金站上一座看似不起眼、其实高达一万英尺的小丘，才看出两位君王的一处肩头或尖角，轮廓稍稍变了那么一点。"
        - id: ch01-b21
          speaker: narrator
          text: "最后，他们走进一个藏在世界里面的世界。那是一条绵延许多英里的山谷。谷中那些已经极高的山，仿佛也只是从真正群峰的膝头滚落下来的一堆碎石和残渣。在这里走上一整天，前进的距离仍少得可怜，仿佛噩梦中的人被什么拖住双脚。他们绕着一处山肩艰苦跋涉好几个钟头，回头一看，那不过是主山一条外围支脉上的小小凸起。远看浑圆的一片草地，走近以后竟变成一座伸进山谷深处的辽阔高原。等到三天以后，那座巨大的高原已经落在南边，只剩大地上一道淡淡褶皱。"
        - id: ch01-b22
          speaker: kim
          text: "诸神一定住在这里！这样的地方，不是给人住的！"
          emotion: surprised
        - id: ch01-b23
          speaker: narrator
          text: "雨后，云影在辽阔天地间扫过。那份寂静和无边无际，把金整个压住了。"
        - id: ch01-b24
          speaker: lama
          text: "很久很久以前，有人问世尊，这世界是不是永恒的，至善者没有回答。我在锡兰时，一位有智慧的探寻者也从巴利文写成的福音里证实了这一点。既然我们已经知道解脱之道，这个问题原本没有用处。可是徒儿，你还是要看，也要从眼前景象里认清幻象。这些才是真正的群山！它们像圣泽山旁的山。世上从来没有过这样的山！"
        - id: ch01-b25
          speaker: narrator
          text: "他们头顶极高、极高的地方，大地还在向雪线升去。从东到西几百英里之间，最后一排挺拔桦树像尺子画出来的直线，同时停住。再高处，是一面面峭壁和一块块抬升的巨岩。它们仿佛奋力想从白雪里探出头。最上方，是从世界开始以来便没有变过、又随每一阵日光和云影改变模样的永恒积雪。雪面上有游移的暗斑，那是风暴和飘荡旋风起身跳舞。脚下，蓝绿森林像长毯一样滑落，一连铺出好几英里。森林下面有一座村庄，散落在梯田和陡牧场之间。再向下，是一千二百到一千五百英尺的陡坡，直落进潮湿山谷。此刻，雷雨正在那里烦躁地低吼。许多溪流也在那里汇集，成为年轻萨特莱杰河的母亲。"
        - id: ch01-b26
          speaker: narrator
          text: "喇嘛照旧带金走牛径、抄小道，远远离开了主路。三天前，那个自称胆小的胡里却在主路上顶着暴风雨飞奔，十个英国人里有九个都会给那场风暴老老实实让路。胡里算不上好枪手，听见扳机咔嗒一响就会变脸，却自称是个颇为高效的追踪者。他用一副便宜望远镜扫遍巨大山谷，果然没有白费力气。绿色山坡上的白帆布帐篷已经磨旧，可那一点白色隔得很远也看得见。头一天，它们还是雪线下面的两个小点，第二天又往下挪了六英寸。他坐在齐格劳尔的打谷场上，直线距离有二十英里，沿路却要走四十英里，已经看到了自己想看的一切。只要认真赶路，胡里那两条肥胖的光腿能走出惊人的路程。"
        - id: ch01-b27
          speaker: narrator
          text: "金和喇嘛留在齐格劳尔一间漏雨茅屋里等风暴过去，胡里却浑身油腻、湿淋淋地赶到外国人身边。他始终带着笑，用最漂亮的英语和最难听的句子，讨好两个同样湿透、风湿病也发作起来的男人。雷电刚劈开营地对面的松树，十几个被强征来的挑夫就认定这天不宜前行，一齐扔下担子，再也不肯挪步。他们原本是某个山地土王的臣民。照当地规矩，土王把他们的劳力租出去，钱却全装进自己的口袋。陌生少爷先前还拿步枪威胁过他们。这些北方谷地的追踪者和猎手，追熊、猎野山羊都很在行，也见过枪，服侍过少爷，却从没受过这样的对待。他们逃进森林。任凭咒骂和叫喊，森林也不肯把人交回来。胡里本来想过装疯，此刻又生出一个更好的主意。他拧干衣服，穿上漆皮鞋，撑开蓝白雨伞，迈着轻巧碎步走近，心却一直跳到了嗓子眼。"
        - id: ch01-b28
          speaker: hurree
          text: "两位先生，我是兰普尔土王殿下的代理人。请问有什么能替二位效劳？"
        - id: ch01-b29
          speaker: narrator
          text: "两个外国人大喜。一个显然是法国人，一个是俄国人，英语却不比胡里强多少。他们恳请这位新朋友相助。本地仆人在列城病倒了。他们急着赶到西姆拉，是怕猎来的兽皮还没送到便遭虫蛀。两人带着一封给各地政府官员的通用介绍信，胡里还照东方礼数向那封信行了礼。他们说，路上没有遇见其他猎队，平时凡事亲自动手，食物也还充足，只想尽快重新动身。胡里找到一个藏在林中、吓得缩成一团的山民，跟他谈了三分钟，又花掉一点让自己心疼的公款。替政府办事，终究不能太节省。于是，十一个挑夫和三个随行闲人重新出现。至少，有胡里在场，便能替他们受的欺压作证。"
        - id: ch01-b30
          speaker: hurree
          text: "我的王家主人听说以后，一定泽常生气。这些人只是粗鄙无知的普通百姓。两位尊驾若肯原谅泽场不幸，我会非常高兴。雨很快就停，我们也能继续赶路。二位刚打过猎吗？真是精彩的壮举！"
        - id: ch01-b31
          speaker: narrator
          text: "胡里在一只只锥形基尔塔旁轻巧地跳来跳去，装作替人整理行李，还不小心碰倒了一只红油布盖的背篓。懂亚洲规矩的英国人不会为这点小事打一个和气孟加拉人的手腕。可反过来说，无论双方多么亲近，他也不会硬逼孟加拉人喝酒，更不会邀他吃肉。两个外国人偏偏全做了。他们问了许多问题，大半都关于女人。胡里回答得轻松自然。接着，他们给他一杯像杜松子酒的发白烈酒，又添上一杯。很快，胡里的庄重便不见了。他醉醺醺地大骂英国政府，说它给自己白人的教育，却不给白人的薪水。他絮絮叨叨讲起压迫和冤屈，为祖国的苦难哭得满脸是泪。随后，他唱着下孟加拉的情歌，摇摇晃晃走开，最后倒在一截湿树干上。英国统治造出的不幸产物，再没有一个这样凄惨地送到外国人面前。"
        - id: ch01-b32
          speaker: frenchman
          text: "他们全是这副样子。等进了真正的印度，你就知道了。我倒想见见他的土王，也许能替我们说几句好话。那位土王说不定听过我们的名字，正在向我们表示善意。"
        - id: ch01-b33
          speaker: russian
          text: "来不及了，我们必须尽快赶到西姆拉。真希望那些报告早从希拉斯寄走了，哪怕从列城寄走也好。"
        - id: ch01-b34
          speaker: frenchman
          text: "英国邮政更可靠，也更安全。别忘了，他们为我们提供一切便利。上帝啊，他们竟连这种便利也给我们！世上真有这样难以置信的愚蠢吗？"
        - id: ch01-b35
          speaker: russian
          text: "那不是愚蠢，是傲慢。这样的傲慢应该受罚，也一定会受罚。"
        - id: ch01-b36
          speaker: frenchman
          text: "没错。在这场游戏里，跟另一个欧洲人交手才有意思。那样做总还担着风险，也需要拿出真正的本领。可是眼前这些人，呸，未免太容易对付了。"
        - id: ch01-b37
          speaker: russian
          text: "傲慢。我的朋友，全是傲慢。"
        - id: ch01-b38
          speaker: hurree
          text: "昌德纳戈尔明明离加尔各答泽么近，我却听不懂他们的法语，那到底有个见鬼的什么用？他们说得特别特别快。早知这样，不如割断他们讨厌的喉咙。"
        - id: ch01-b39
          speaker: narrator
          text: "胡里张着嘴躺在湿苔藓上打鼾。再次出现时，他头疼欲裂，悔恨万分，嘴里不停担心醉后说了不该说的话。他赶紧声明，英国政府是一切繁荣和荣誉的来源，兰普尔土王也同样热爱它。外国人拿他醉后的话取笑他，又把那些话一句句引回。胡里带着讨好的傻笑、油滑的咧嘴和狡黠的眼神，一步步失守，最后被迫说出了所谓真话。后来勒根听见这段故事，恨不得自己当时也藏在挑夫中间看戏。那些顽固的挑夫根本不理会眼前表演，只顶着草席等雨停。雨水落进他们的脚印，聚成一汪汪小水洼。他们心里早有判断。自己认识的少爷，总是穿着粗朴，年年高高兴兴回到中意的山沟，还带着仆人、厨子和勤务兵，其中往往就有山民。这两个人却一个随从也没有，必定又穷又无知。稍有头脑的少爷，哪会听孟加拉人的意见？可这个不知从哪里冒出来的孟加拉人给了他们钱，还能勉强说几句山民土话。挑夫们受惯了自己人的百般欺压，认定这里藏着圈套，随时准备再逃。"
        - id: ch01-b40
          speaker: narrator
          text: "雨洗过的空气蒸起泥土香。胡里领着队伍下山，走在挑夫前头时威风凛凛，落到外国人身后时又谦卑万分。他一肚子心思，最不起眼的一桩若说出来，也会叫同行者惊讶得讲不出话。他却只做一个讨人喜欢的向导，一路热心指出王家主人领地中的景致。外国人想杀什么，他便替他们把山地塞满什么。这里有塔尔羊、北山羊、捻角山羊，还有蒙先知以利沙许可的熊。他大谈植物和民族，错误多得不容质疑。地方传说更是说不完，毕竟他已经做了十五年深受信赖的政府代理人。"
        - id: ch01-b41
          speaker: frenchman
          text: "这个人真是个奇才，简直像维也纳向导做的一场噩梦。"
        - id: ch01-b42
          speaker: russian
          text: "他暗中代表了正在变化的印度，是东西方杂交出来的怪物。真正懂得怎样对付东方人的，是我们。"
        - id: ch01-b43
          speaker: frenchman
          text: "他失去了自己的祖国，又没能得到另一个。不过，他对征服者倒是恨得彻底。听听看，他昨晚亲口告诉过我。"
        - id: ch01-b44
          speaker: narrator
          text: "胡里藏在条纹雨伞下，耳朵和脑子一起拼命，追赶两人急流般的法语。两只眼却死死盯着一只双层红油布盖的大基尔塔，里面全是地图和文件。他还不打算偷任何东西，只想先弄明白究竟该偷什么。顺便还得想好，真正偷到手以后怎样脱身。他感谢印度斯坦的所有神，也感谢赫伯特·斯宾塞。幸好，两位外国人还有值得一偷的东西。"
        - id: ch01-b45
          speaker: narrator
          text: "第二天，道路陡陡升上森林外一道长满青草的山嘴。太阳快落山时，他们在那里遇见一位年老喇嘛，两个外国人却把他叫作和尚。老人盘腿坐在一幅神秘图卷前，四角用石块压住。他正向一个显然刚刚入门的年轻人讲解。那少年虽然没有洗脸，却生得格外俊秀。金早在半程以外就看见条纹雨伞，特意提议停下来，等它慢慢赶到自己面前。"
        - id: ch01-b46
          speaker: hurree
          text: "哈！那是本地极有名望的圣人，也许还是我王家主人的臣民。"
        - id: ch01-b47
          speaker: frenchman
          text: "他在做什么？看起来真奇怪。"
        - id: ch01-b48
          speaker: hurree
          text: "他在讲解圣图，每一笔都是亲手画的。"
        - id: ch01-b49
          speaker: narrator
          text: "两个外国人脱帽站在斜照金草的夕阳里。挑夫巴不得停下，立刻卸掉担子。"
        - id: ch01-b50
          speaker: frenchman
          text: "你看，这就像一幅宗教诞生图，第一位导师和第一个门徒。他是佛教徒吗？"
        - id: ch01-b51
          speaker: russian
          text: "信的是堕落的那一种。山里没有真正的佛教徒。可你看看他的袍褶，再看看那双傲慢的眼睛。为什么这景象让人觉得，我们的民族如此年轻？我们还没有在任何地方留下自己的印记，一处也没有。你明白吗？这才是让我不安的事。"
        - id: ch01-b52
          speaker: narrator
          text: "俄国人激动地抽断一株高草，阴沉地望着喇嘛平静的脸和雕像般的姿态。"
        - id: ch01-b53
          speaker: frenchman
          text: "耐心些。我们和你们这些年轻民族会一同留下印记。现在，先替他画张像。"
        - id: ch01-b54
          speaker: narrator
          text: "胡里挺直腰背走过去，神情和谦恭的话语并不相称。他又向金眨眨眼。"
        - id: ch01-b55
          speaker: hurree
          text: "圣人，这两位是少爷。我的药治好了其中一位的痢疾，我正陪他去西姆拉休养。他们想看看您的图。"
        - id: ch01-b56
          speaker: lama
          text: "治病总是善事。这是生命之轮，下雨那天，我在齐格劳尔的茅屋里也给你看过。"
        - id: ch01-b57
          speaker: hurree
          text: "他们还想听您讲解。"
        - id: ch01-b58
          speaker: lama
          text: "讲解至善大道也是善事。他们像图像守护人那样懂印地语吗？"
        - id: ch01-b59
          speaker: hurree
          text: "也许懂一点。"
        - id: ch01-b60
          speaker: narrator
          text: "喇嘛的眼睛亮了。他像遇到新游戏的孩子一样仰起头，先放声念起佛学博士阐发完整教义前的祷文。外国人拄着登山杖，认真听他念。金谦卑地蹲在一旁，看夕阳染红他们的脸，也看两道长影在地上交叠，又慢慢分开。两人穿着不像英国式样的绑腿，腰上扎着奇怪的紧身皮带。这使金想起圣泽维尔图书馆里的一本书，书名是《一位青年博物学家在墨西哥的历险》。眼前的外国人像极了书里那位了不起的叙米克拉斯先生，一点也不像胡里想象中不讲道德的恶徒。肤色如土、沉默无声的挑夫虔敬地蹲在二三十码外。胡里的薄衣松处被寒风吹得像测量标旗一样啪啪作响，他却摆出一副得意的主人神气。"
        - id: ch01-b61
          speaker: hurree
          text: "就是他们。书、报告和地图全在红盖大基尔塔里。我还看见一封国王的信，是希拉斯或布纳尔写的。他们守得泽常严。从希拉斯到列城，一样东西也没有寄出去，泽一点可以确定。"
        - id: ch01-b62
          speaker: kim
          text: "他们还带着谁？"
        - id: ch01-b63
          speaker: hurree
          text: "只有被征来的苦力，连仆人也没有。他们吝啬得连饭都自己做。"
        - id: ch01-b64
          speaker: kim
          text: "那我该做什么？"
        - id: ch01-b65
          speaker: hurree
          text: "先等着。机会若落到我手里，你自然会知道去哪里找文件。"
        - id: ch01-b66
          speaker: kim
          text: "这种差事落在马哈布·阿里手里，也比落在孟加拉人手里强。"
        - id: ch01-b67
          speaker: hurree
          text: "想到心上人身边，不只有撞倒墙这一种走法。"
        - id: ch01-b68
          speaker: lama
          text: "看，这里是为吝啬和贪欲预备的地狱。一边是欲念，另一边是倦怠。"
        - id: ch01-b69
          speaker: narrator
          text: "喇嘛越讲越投入，一个外国人借着最后一点天光替他画起像来。"
        - id: ch01-b70
          speaker: russian
          text: "够了。我听不懂他，可我想要这幅图。他画得比我好。问他肯不肯卖。"
        - id: ch01-b71
          speaker: hurree
          text: "他说不卖，少爷。"
        - id: ch01-b72
          speaker: narrator
          text: "喇嘛绝不会把这幅图卷卖给偶遇的路人，就像大主教不会把主教座堂里的圣器拿去典当。西藏到处都有生命之轮的廉价摹本，这并不是因为图卷本身少见。可眼前这位喇嘛自己就是画师，在故乡还是一位富有的寺院住持。对他来说，这一幅自然不是随手可以买卖的东西。"
        - id: ch01-b73
          speaker: lama
          text: "也许过三天、四天，甚至十天，我看出这位少爷是个探寻者，也确有悟性，会另画一幅送他。这一幅不行，它曾用来引领初学者入门。哈基姆，把我的话告诉他。"
        - id: ch01-b74
          speaker: hurree
          text: "他肯给钱，可现在就要。"
        - id: ch01-b75
          speaker: narrator
          text: "喇嘛缓缓摇头，动手收起生命之轮。俄国人眼里却只有一个脏老头，正在拿一张脏纸讨价还价。他掏出一把卢比，半开玩笑地伸手来夺。两边一扯，图卷竟在喇嘛手里撕裂了。挑夫中立刻传出一片低低的惊呼。有几个斯皮提人，按山里的规矩还算虔诚的佛教徒。喇嘛受了侮辱，猛然站起，一只手摸向沉重的铁笔盒。那不仅用来装笔，也是僧人的武器。胡里看见这一幕，急得在原地直跳。"
        - id: ch01-b76
          speaker: hurree
          text: "现在你们看见了！泽就是我一定要找证人的缘故。他们极不讲道德。少爷，少爷，千万不能打圣人！"
          emotion: fearful
        - id: ch01-b77
          speaker: lama
          text: "徒儿！他亵渎了经文！"
          emotion: angry
        - id: ch01-b78
          speaker: narrator
          text: "已经来不及了。金还没有拦住，俄国人一拳结结实实打中老人面孔。下一刻，金掐住他的喉咙，两个人抱在一起，一路翻滚下山。那一拳叫少年血里所有陌生的爱尔兰恶魔全醒了。敌人猛然摔倒，又让那些恶魔彻底发作。喇嘛半昏半醒，跪倒在地。挑夫连担子也来不及卸，背着重物拼命往山上逃，速度快得像平原人在平地飞奔。他们见到了无法形容的亵渎，只想赶在山中神魔降下报复以前躲开。法国人冲向喇嘛，一边摸索左轮，一边想抓住老人，用他换回同伴。山民投得极准，尖石像骤雨一样飞来，把他逼退。一个奥仲挑夫抄起喇嘛，裹进逃跑的人群。这一切和山间暮色一样，说来就来。"
        - id: ch01-b79
          speaker: frenchman
          text: "他们把所有行李和枪都抢走了！"
          emotion: angry
        - id: ch01-b80
          speaker: narrator
          text: "法国人朝黑暗胡乱开枪。"
        - id: ch01-b81
          speaker: hurree
          text: "没事，少爷，没事！不要开枪，我去救人！"
        - id: ch01-b82
          speaker: narrator
          text: "胡里重重冲下山，一头扑到金身上。金又惊又喜，正把喘不过气来的俄国人的头往巨石上撞。"
        - id: ch01-b83
          speaker: hurree
          text: "快回挑夫那里。行李在他们手里。文件放在红盖背篓，不过每一只都要搜。把文件拿走，尤其是穆拉斯拉，也就是国王的信。快！另一个人来了！"
        - id: ch01-b84
          speaker: narrator
          text: "金拔腿冲上山。一颗子弹打响身边的岩石，他像鹧鸪一样伏低。"
        - id: ch01-b85
          speaker: hurree
          text: "再开枪，他们就会冲下来，把我们全部消灭！我已经把这位先生救出来了。少爷，泽里特别危险。"
        - id: ch01-b86
          speaker: kim
          text: "老天，泽真是个该死的险境。不过我想，泽算正当防卫。"
        - id: ch01-b87
          speaker: narrator
          text: "金伸手摸到马哈布送的小手枪，迟疑着扣动扳机。除了在比卡内尔沙漠练过几枪，他从没真正用它打过人。"
        - id: ch01-b88
          speaker: hurree
          text: "我说什么来着，少爷！快下来帮忙把人救醒。我告诉你，我们全都骑到树上，下不来了！"
        - id: ch01-b89
          speaker: narrator
          text: "枪声终于停了。下面传来踉跄脚步。金一边像野猫，也像土生土长的乡下人那样咒骂，一边赶紧爬回山上。"
        - id: ch01-b90
          speaker: lama
          text: "徒儿，他们打伤你了吗？"
        - id: ch01-b91
          speaker: kim
          text: "没有。你受伤了吗？"
        - id: ch01-b92
          speaker: narrator
          text: "金钻进一片低矮冷杉。"
        - id: ch01-b93
          speaker: lama
          text: "我也没有。快走吧，我们跟这些人一起去雪下的沙姆莱。"
        - id: ch01-b94
          speaker: ao_chung
          text: "走以前得先讨回公道。我已经拿到少爷们的四支枪。我们下山去！"
        - id: ch01-b95
          speakers: [spiti_1, spiti_2]
          ensemble: duo
          text: "他打了圣人，我们亲眼看见了！我们的牛会不再生犊，女人会不再生孩子。回家路上，雪也会滑下来埋住我们！我们受的欺压已经够多了！"
          emotion: fearful
        - id: ch01-b96
          speaker: narrator
          text: "冷杉丛里挤满叫嚷的挑夫。恐惧已经把他们逼到什么都敢做的地步。奥仲人拉响枪栓，转身便要下山。"
        - id: ch01-b97
          speaker: ao_chung
          text: "圣人，请等一会儿。他们跑不远，等我回来。"
        - id: ch01-b98
          speaker: lama
          text: "受了委屈的是我。"
        - id: ch01-b99
          speaker: ao_chung
          text: "正因为您受了委屈，我才要去。"
        - id: ch01-b100
          speaker: lama
          text: "只要我不追究，你们的手就是干净的。听从我的话，还能积下功德。"
        - id: ch01-b101
          speaker: ao_chung
          text: "那么再等一等，大家一同去沙姆莱。"
        - id: ch01-b102
          speaker: narrator
          text: "喇嘛只迟疑了装一颗子弹那么久，便起身把手指按在奥仲人肩上。"
        - id: ch01-b103
          speaker: lama
          text: "你没听见吗？我说不许杀人！我曾是圣泽寺的住持。你难道想来世变成老鼠，变成屋檐下的蛇，或变成最卑贱野兽肚子里的虫？难道你想——"
          emotion: angry
        - id: ch01-b104
          speaker: narrator
          text: "老人的声音像西藏魔神的大锣一样轰响，奥仲人立刻跪倒。"
        - id: ch01-b105
          speakers: [spiti_1, spiti_2]
          ensemble: duo
          text: "别诅咒我们，也别诅咒他！圣人，他只是太热心了。蠢货，快把枪放下！"
          emotion: fearful
        - id: ch01-b106
          speaker: lama
          text: "怒上加怒，恶上添恶！谁也不许杀人。让殴打僧人的恶徒受自己行为的束缚。生命之轮公正无误，绝不会偏离分毫。他们还要在痛苦里轮回许多次。"
          emotion: angry
        - id: ch01-b107
          speaker: narrator
          text: "喇嘛垂下头，沉沉倚住金的肩膀。松树下顿时一片死寂。"
        - id: ch01-b108
          speaker: lama
          text: "徒儿，我刚才险些犯下大恶。我动了放出子弹的念头。若是在西藏，那两个人确实会受到漫长而沉重的死刑……他打了我的脸，打在这具肉身上……"
        - id: ch01-b109
          speaker: narrator
          text: "老人说着便滑倒在地，呼吸越来越沉重。金俯在他身边，清清楚楚听见那颗过度劳累的心怦怦乱撞。它撞上几下，又忽然停顿，随后再艰难跳动。"
        - id: ch01-b110
          speaker: ao_chung
          text: "他们是不是把圣人打得快死了？"
          emotion: fearful
        - id: ch01-b111
          speaker: kim
          text: "没有，只是一时虚弱。把背篓打开！那些少爷也许带着药。"
          emotion: fearful
        - id: ch01-b112
          speaker: narrator
          text: "金跪在老人身边，怕得心里发冷。接着，他想起自己是个白人，面前又有整套白人野营用具。"
        - id: ch01-b113
          speaker: ao_chung
          text: "哦呵！那种药我认识。我给扬克林少爷做了五年猎手，怎么会不知道？我自己也尝过。看！"
        - id: ch01-b114
          speaker: narrator
          text: "奥仲人从怀里取出一瓶列城卖给探险者的廉价威士忌，熟练地灌进喇嘛牙缝。"
        - id: ch01-b115
          speaker: ao_chung
          text: "扬克林少爷在阿斯托尔外面扭伤脚，我也是这样救他的。我已经看过他们的背篓，不过到了沙姆莱再公平分配。再喂圣人一点，摸摸看，他的心跳好多了。让他躺平，再往胸口擦些酒。他刚才若等我收拾那两个少爷，便不会出这种事。不过那两个家伙也许会追来。到时用他们自己的枪打他们，总不能算错吧？"
        - id: ch01-b116
          speaker: kim
          text: "其中一个已经受过报应。滚下山时，我踢中了他的胯下。真恨不得杀了他！"
          emotion: angry
        - id: ch01-b117
          speaker: rampur_man
          text: "不住在兰普尔，勇敢起来当然容易。我们要是在少爷那里得了坏名声，以后就没人雇我们做猎手。"
        - id: ch01-b118
          speaker: ao_chung
          text: "这两个不是真正的英格雷兹少爷，不像福斯特姆少爷和扬克林少爷那么快活。他们是外国人，连英格雷兹话也说得不像少爷。"
        - id: ch01-b119
          speaker: narrator
          text: "喇嘛咳嗽一声，摸着念珠坐了起来。"
        - id: ch01-b120
          speaker: lama
          text: "不许杀人。生命之轮是公正的。恶上添恶……"
        - id: ch01-b121
          speaker: ao_chung
          text: "不会有人死，圣人。我们都在这里。没有您的命令，谁也不会杀人。先歇一会儿。我们在这里扎个小营，等月亮升起再去雪下的沙姆莱。"
        - id: ch01-b122
          speaker: spiti_1
          text: "挨过一拳以后，最好睡上一觉。"
        - id: ch01-b123
          speaker: lama
          text: "我后颈有些晕，还像被什么掐着。徒儿，让我枕着你的腿。我老了，却仍没摆脱激情……我们得参悟万物之因。"
        - id: ch01-b124
          speaker: spiti_2
          text: "给圣人一条毯子。不能生火，否则会被那两个少爷看见。"
        - id: ch01-b125
          speaker: rampur_man
          text: "还是赶快去沙姆莱吧，没人会追到那里。"
        - id: ch01-b126
          speaker: ao_chung
          text: "我给福斯特姆少爷当过猎手，现在又替扬克林少爷做事。若不是这该死的贝加尔劳役，我此刻就在扬克林少爷身边。派两个人拿枪守在下面，免得那两个外国人又做蠢事。我不会离开圣人。"
        - id: ch01-b127
          speaker: narrator
          text: "山民们离喇嘛稍远一些坐下。先侧耳听了一阵四周动静，他们才轮流抽起一只水烟袋，盛水的烟壶是旧戴马丁鞋油瓶。红炭随着烟袋从一双手传到另一双手，也从一张脸移到另一张脸，火光时亮时暗。它照出细窄而眨动的眼睛、高高的中国式颧骨，还有粗壮如牛、向下没入黑色粗呢衣褶的脖子。那些人仿佛刚从魔法矿坑里钻出来的小妖，也像一群围坐开会的山中侏儒。他们低声交谈，四周雪水流淌的声音却一道接一道变小。夜霜正在沟里掐住细流，把水道一点点堵紧，最后让它们彻底沉默。"
        - id: ch01-b128
          speaker: spiti_1
          text: "圣人站起来拦我们的样子，真叫人佩服。七年前，在拉达克那边，杜邦少爷一枪擦过一头老北山羊的肩，那羊也像这样站起来。杜邦少爷是个好猎手。"
        - id: ch01-b129
          speaker: ao_chung
          text: "可他比不上扬克林少爷。现在听我说，除非还有谁自认比我更懂。"
        - id: ch01-b130
          speaker: narrator
          text: "奥仲人仰头喝了一口威士忌，再把瓶子递给身边的人。他环顾围坐的同伴，等着有人反驳，甚至等着有人说自己懂得更多。可四周安安静静，没有一个人愿意接下他的挑战。"
        - id: ch01-b131
          speaker: ao_chung
          text: "月亮升起，我们就去沙姆莱。到了那里，行李由大家公平分。我只要这支新式小步枪和全部子弹，已经足够。"
        - id: ch01-b132
          speaker: spiti_2
          text: "难道只有你那片地方的熊会伤人？"
        - id: ch01-b133
          speaker: ao_chung
          text: "当然不是。可现在一个麝香囊能卖六卢比。你们的女人可以分帐篷帆布和炊具。天亮以前把东西分好，然后各走各路。谁也不记得见过这些少爷，更不记得替他们服过役。免得他们反过来说，是我们偷了行李。"
        - id: ch01-b134
          speaker: rampur_man
          text: "这样安排对你很好，可我们的土王会怎么说？"
        - id: ch01-b135
          speaker: ao_chung
          text: "谁去告诉土王？是听不懂土话的外国人，还是为了自己的打算给我们钱的孟加拉人？难道他真会带兵来打我们？到时候还能剩下什么证据？不要的东西全扔进沙姆莱垃圾谷，那里从来没人下去过。"
        - id: ch01-b136
          speaker: spiti_2
          text: "这个夏天，谁住在沙姆莱？那里不过是个牧场，只有三四间茅屋。"
        - id: ch01-b137
          speaker: shamlegh_man
          text: "沙姆莱女人住在那里。大家都知道，她不喜欢少爷。其余的人，送些小礼物就能哄好。我们手里的东西这么多，人人都有份。"
        - id: ch01-b138
          speaker: rampur_man
          text: "可是……可是……"
        - id: ch01-b139
          speaker: ao_chung
          text: "我说过，他们不是真少爷。那些兽皮和兽头全是在列城集市买的，我认得上面的记号。上次赶路，我还指给你们看过。"
        - id: ch01-b140
          speaker: spiti_1
          text: "没错，全是买来的。有几张皮甚至生了蛀虫。"
        - id: ch01-b141
          speaker: narrator
          text: "这个理由很聪明。奥仲人知道同伴会信什么。"
        - id: ch01-b142
          speaker: ao_chung
          text: "就算闹到最坏，我也可以告诉扬克林少爷。他性情快活，听了只会发笑。我们没有伤害自己认识的少爷。这两个打了僧人，又把我们吓跑。至于逃跑时把行李掉在了哪里，谁知道？扬克林少爷绝不会准许平原警察满山乱转，惊走他的猎物。从西姆拉到奇尼已经够远，从沙姆莱到沙姆莱垃圾谷，还要更远。"
        - id: ch01-b143
          speaker: spiti_2
          text: "好吧，那就这样。不过大基尔塔由我背，就是那只红盖的。每天早晨，那两个少爷都亲手收拾它。"
        - id: ch01-b144
          speaker: shamlegh_man
          text: "这更能证明他们是不值一提的少爷。你们什么时候见过福斯特姆少爷、扬克林少爷，甚至那个熬夜猎鬣羚的小皮尔少爷，进山却不带平原厨子、贴身仆人和一大群薪水高、脾气大、惯会压人的随从？这两个外国人能闹出什么麻烦？那只基尔塔里有什么？"
        - id: ch01-b145
          speaker: spiti_2
          text: "没什么，只有许多文字。有书，有他们写的纸，还有一些古怪仪器，像祭祀用的东西。"
        - id: ch01-b146
          speaker: shamlegh_man
          text: "沙姆莱垃圾谷会把它们全收走。"
        - id: ch01-b147
          speaker: spiti_2
          text: "可是把那些东西扔下去，会不会亵渎外国人的神？我不愿这样处置文字，也弄不懂那些黄铜神像。这种战利品，不适合我们淳朴的山民。"
        - id: ch01-b148
          speaker: narrator
          text: "老人还在安稳睡觉。奥仲人又喝了一口酒，胸膛也随之挺得更高，觉得自己越发像个发号施令的领袖。可谁也不懂那只红盖背篓，他便压低声音，提议去问问圣人的徒弟。"
        - id: ch01-b149
          speaker: ao_chung
          text: "我们手里有一只基尔塔，谁也不知道它到底是什么。"
        - id: ch01-b150
          speaker: kim
          text: "可我知道。红盖基尔塔里装着非常神奇的东西，傻瓜绝不能碰。"
        - id: ch01-b151
          speaker: narrator
          text: "喇嘛枕在金腿上，呼吸自然、平稳，已经睡得很熟。金却没有睡。他一直想着胡里临走前说的那些话，也想着那只红盖背篓。此时此刻，他是大游戏里的一名玩家，也终于愿意认真尊敬那个孟加拉人。"
        - id: ch01-b152
          speaker: spiti_2
          text: "我就说吧！我早知道！那东西会不会出卖我们？"
        - id: ch01-b153
          speaker: kim
          text: "交给我便不会。我能抽走它的法力，不然它一定带来大灾祸。"
        - id: ch01-b154
          speaker: ao_chung
          text: "祭司总要拿自己那一份。"
        - id: ch01-b155
          speaker: narrator
          text: "这句话说得不像方才那位谨慎的领头人。显然，是一口接一口的威士忌让奥仲人渐渐失了分寸。"
        - id: ch01-b156
          speaker: kim
          text: "我无所谓。你们自己分掉它，看看以后会出什么事吧！"
        - id: ch01-b157
          speaker: ao_chung
          text: "我可不要，刚才只是说笑。你来下令吧。这里有的是东西，足够大家分。天一亮，我们就从沙姆莱各走各路。"
        - id: ch01-b158
          speaker: narrator
          text: "又过了一个钟头，山民还在一次次推翻、重排那套天真的计划。金冻得浑身发抖，心里却得意非凡。眼前的局面，同时逗乐了他灵魂里的爱尔兰人和东方人。北方那个可怕强国的使者，在自己国家也许像马哈布或克赖顿上校那样重要，此刻却忽然束手无策。金私下很清楚，其中一个会跛上好一阵子。两人曾向国王许下诺言，如今却躺在山下某个地方，没有地图，没有食物，没有帐篷，也没有枪。除了胡里，他们连向导也没了。他们的大游戏就这样垮掉。金甚至想知道，这两个人以后会向谁报告失败。他们惊慌失措，一头逃进黑夜，不是因为胡里的计策，也不是因为金的安排。一切自然、漂亮而又无法避免，就像安巴拉那个热心的年轻警察，当初抓住马哈布的苦行僧朋友一样。"
        - id: ch01-b159
          speaker: kim
          text: "他们躺在那里，什么都没有。老天，真冷！我却守着他们所有东西。他们一定气疯了。真替胡里先生难过。"
        - id: ch01-b160
          speaker: narrator
          text: "这份怜悯大可省下。胡里的身体确实在受罪，心却已经膨胀得高高在上。山下一英里处，两个几乎冻僵的外国人正在松林边互相责骂，其中一个还不断猛烈呕吐。骂完彼此，他们又一起用最尖刻的话痛骂胡里。胡里则装得怕到神智失常。两人逼他拿出办法，他便解释，能活着已经十分走运。那些挑夫若不是正躲在暗处跟踪他们，就是早已跑远，再也叫不回来。他的土王主人远在九十英里外。若听说他们动手打了僧人，别说借钱，再派一队随从送他们去西姆拉，土王只会把两人关进牢里。胡里把这项罪行和它的后果说得越来越可怕，直到两人命令他再也不准提起。"
        - id: ch01-b161
          speaker: hurree
          text: "我们唯一的希望，是安安静静从一个村子逃到下一个村子，直到回到文明地方。可是高天啊，两位少爷为什么要殴打圣人？"
          emotion: fearful
        - id: ch01-b162
          speaker: narrator
          text: "他已经第一百次说到这里便泪流满面。其实，只要走十步，胡里就能钻进黑暗，去最近的村庄找住处和食物。可他宁愿陪着尊贵的雇主，忍受寒冷、饥饿、咒骂和偶尔落到身上的拳头。他缩在树干旁，凄惨地抽鼻子。"
        - id: ch01-b163
          speaker: frenchman
          text: "你想过没有？我们这个样子在群山里游荡，会让这些土人怎么看？"
          emotion: angry
        - id: ch01-b164
          speaker: narrator
          text: "这几个钟头里，胡里想得最多的就是这件事，可法国人并不是在问他。"
        - id: ch01-b165
          speaker: russian
          text: "我们根本没法游荡！我连路也快走不动了。"
        - id: ch01-b166
          speaker: hurree
          text: "也许圣人会大发慈悲，少爷。要不然……"
        - id: ch01-b167
          speaker: russian
          text: "等我再遇见那个小和尚，一定把左轮里的子弹全打进他身体。那会是一种格外痛快的享受。"
          emotion: angry
        - id: ch01-b168
          speaker: narrator
          text: "胡里缩得更低。左轮、复仇、和尚，两人的战争眼看又要开始。"
        - id: ch01-b169
          speaker: frenchman
          text: "你就不想想我们的损失吗？行李！全部行李！我们带来的一切，得到的一切，还有八个月的收获！你知道那意味着什么吗？还说什么真正能对付东方人的是我们。看看你办的好事！"
          emotion: angry
        - id: ch01-b170
          speaker: narrator
          text: "两人换着几种语言大吵，胡里却悄悄笑了。金和那些基尔塔待在一起，而基尔塔里放着八个月外交活动的成果。眼下没有任何办法给少年传信，可胡里信得过他。至于接下来的路，胡里完全有本事安排成一场大戏，叫希拉斯、布纳尔和四百英里山路上的百姓谈论整整一代。管不住自家挑夫的人，在群山里从来不会受人尊敬。山民又有极敏锐的幽默感，这一场笑话，他们绝不会错过。"
        - id: ch01-b171
          speaker: hurree
          text: "换成我亲手来做，也不会更好。老天，现在想想，一切当然都是我安排的。我反应多快呀！跑下山时，我就已经想好。泽场冒犯虽然是偶然，只有我能利用它，也只有我能榨出它全部该死的价值。想想它会给无知百姓多大的道德影响！没有条约，没有书信，没有任何文字证据，再由我替他们解释。我会跟上校笑成什么样！我只希望那些文件也在自己手中。可惜一个人不能同时占据两个空间位置。泽是公理。"
