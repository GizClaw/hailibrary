audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: observant, vivid, and unhurried
        timbre: warm and clear
        pace: measured
        pitch: medium
    kim:
      display_name: Kim
      tts:
        delivery: quick, confident, and mischievous
        timbre: bright and wiry
        pace: lively
        pitch: medium-high
    mahbub:
      display_name: Mahbub Ali
      tts:
        delivery: shrewd, commanding, and dryly amused
        timbre: deep and rugged
        pace: measured
        pitch: low
    first_attacker:
      display_name: First Attacker
      tts:
        delivery: nervous and hushed
        timbre: tight and raspy
        pace: quick
        pitch: medium
    second_attacker:
      display_name: Second Attacker
      tts:
        delivery: cold, impatient, and threatening
        timbre: hard and dry
        pace: deliberate
        pitch: low
    barton:
      display_name: Barton Sahib
      tts:
        delivery: brisk, eager, and skeptical
        timbre: youthful and clear
        pace: quick
        pitch: medium
  chapters:
    - id: ch01
      title: CHAPTER VIII
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: I owe something to the earth that raised me, and more to the life that fed me. But most of all, I thank Allah for giving me two separate sides to my head. Friends, tobacco, bread, shirts, and shoes may go. I would sooner lose them all than lose either side of my head.
        - id: ch01-b02
          speaker: mahbub
          text: Then, in God's name, trade that Hindu red for Muslim blue.
        - id: ch01-b03
          speaker: narrator
          text: Mahbub meant Kim's shabby red turban.
        - id: ch01-b04
          speaker: kim
          text: I may change my faith and my bedding, but you will have to pay for both.
        - id: ch01-b05
          speaker: narrator
          text: Mahbub laughed so hard that he nearly fell from his horse. At a shop outside the city, he bought the change. When Kim stood up again, he looked like a Mohammedan, at least on the outside.
        - id: ch01-b06
          speaker: narrator
          text: Mahbub rented a room opposite the railway station. He ordered an excellent cooked meal, almond-curd sweets called balushai, and finely chopped Lucknow tobacco. Kim and Mahbub squatted together to eat.
        - id: ch01-b07
          speaker: kim
          text: This is better than the food I had with the Sikh. And they certainly feed us nothing like this at my madrissah.
        - id: ch01-b08
          speaker: mahbub
          text: I want to hear about that madrissah. First, tell me exactly how you escaped. Friend of all the World, Sahibs and their sons do not often run away from such a place.
        - id: ch01-b09
          speaker: narrator
          text: Mahbub ate great mouthfuls of spiced mutton fried in fat with cabbage and golden onions. When he asked for the full truth of the escape, he loosened his belt, which had begun to strain around him.
        - id: ch01-b10
          speaker: kim
          text: Why would they run? They know nothing of the land. My escape was easy.
        - id: ch01-b11
          speaker: narrator
          text: Kim began his story. When he reached the disguise and the girl in the bazaar, Mahbub lost all his solemnity. He roared with laughter and slapped his thigh.
        - id: ch01-b12
          speaker: mahbub
          text: Shabash! Well done, little one! What will the healer of turquoises make of that? Now go slowly. Tell me everything that happened next, step by step.
        - id: ch01-b13
          speaker: narrator
          text: Kim obeyed, though the strong tobacco kept making him cough.
        - id: ch01-b14
          speaker: mahbub
          text: I knew it. The pony is already breaking loose to play polo. The fruit is ripe, except that you must still learn distances, pacing, rods, and compasses. Listen. I turned the Colonel's whip away from your back, and that was no small favor.
        - id: ch01-b15
          speaker: kim
          text: True. That is true.
        - id: ch01-b16
          speaker: mahbub
          text: But you must not make a habit of running in and out.
        - id: ch01-b17
          speaker: kim
          text: It was my holiday, Hajji. I had been a slave for weeks. Why shouldn't I leave when the school was closed? I lived with friends and earned my food with the Sikh. Think how much money I saved the Colonel Sahib.
        - id: ch01-b18
          speaker: narrator
          text: Mahbub's lips twitched beneath his carefully trimmed moustache.
        - id: ch01-b19
          speaker: mahbub
          text: What are a few rupees to the Colonel Sahib? He spends them for a purpose, not because he loves you.
        - id: ch01-b20
          speaker: kim
          text: I understood that long ago.
        - id: ch01-b21
          speaker: mahbub
          text: Who told you?
        - id: ch01-b22
          speaker: kim
          text: The Colonel himself. He did not use those words, but anyone who isn't a mud-head could understand him. He made it plain on the train to Lucknow.
        - id: ch01-b23
          speaker: mahbub
          text: So be it. Then I will tell you more, though I risk my head by telling it.
        - id: ch01-b24
          speaker: kim
          text: Your head was already mine at Umballa, when you lifted me onto your horse after the drummer-boy beat me.
        - id: ch01-b25
          speaker: mahbub
          text: Speak more plainly. Everyone in the world may lie except you and me. Your life is just as surely mine if I raise one finger here.
        - id: ch01-b26
          speaker: kim
          text: I know that too. It ties us together tightly. Your hold is stronger, though. Who would miss a boy beaten to death or thrown into a roadside well? But people here, in Simla, and across the passes behind the Hills would ask what happened if Mahbub Ali were found dead among his horses. The Colonel Sahib would ask questions too.
        - id: ch01-b27
          speaker: kim
          text: He would not ask for long, because then people might wonder what a colonel had to do with a horse dealer. But suppose I lived. I alone would know that someone came at night, perhaps dressed as an ordinary thief, entered your stall in the serai, and killed you. I would know the killer searched your saddlebags and even between the soles of your slippers, either before or after the murder. Should I take that news to the Colonel? Or would he ask me what Mahbub Ali was to him, as he did when he sent me back for the cigar case he had never left behind?
        - id: ch01-b28
          speaker: narrator
          text: A thick cloud of smoke rose. Mahbub was silent for a long time.
        - id: ch01-b29
          speaker: mahbub
          text: With thoughts like these, you lie down among all the Sahibs' little sons at the madrissah, get up again, and meekly learn your lessons?
        - id: ch01-b30
          speaker: kim
          text: It is an order. Who am I to argue with an order?
        - id: ch01-b31
          speaker: mahbub
          text: You are a finished Son of Eblis. But what did you mean about a thief coming to search my things?
        - id: ch01-b32
          speaker: kim
          text: I saw it the night my lama and I slept beside your stall in the Kashmir Serai. You left the door unlocked, which I do not think is your habit. The man entered as if he knew you would not return soon. I watched with my eye against a knothole in the wall. He searched for something small and carefully hidden, not a rug, stirrups, a bridle, or brass pots. Why else would he use an iron to probe between the soles of your slippers?
        - id: ch01-b33
          speaker: mahbub
          text: And what story did you make from that, Well of Truth?
        - id: ch01-b34
          speaker: kim
          text: I made no story. I put my hand on the amulet that always lies next to my skin. Then I remembered the white stallion's pedigree I had bitten from a piece of Mohammedan bread, and I went to Umballa. I understood that a heavy trust had been laid on me. If I had chosen differently, I could have handed the man the paper and said, "Here is something about a horse that I cannot read." What would have happened then?
        - id: ch01-b35
          speaker: mahbub
          text: You would have drunk water twice afterward. Perhaps three times, but no more.
        - id: ch01-b36
          speaker: kim
          text: Yes, that is true. I thought about it for a little while. But most of all, I thought that I loved you, Mahbub. So I went to Umballa, as you know. What you do not know is that I hid in the garden grass to see what Colonel Creighton would do when he read the white stallion's pedigree.
        - id: ch01-b37
          speaker: mahbub
          text: And what did he do?
        - id: ch01-b38
          speaker: narrator
          text: Kim let the conversation stop there.
        - id: ch01-b39
          speaker: kim
          text: Do you give news away for love, or do you sell it?
        - id: ch01-b40
          speaker: mahbub
          text: I sell news, and I buy it.
        - id: ch01-b41
          speaker: narrator
          text: Mahbub held up a four-anna coin.
        - id: ch01-b42
          speaker: kim
          text: Make it eight annas!
        - id: ch01-b43
          speaker: narrator
          text: The old instinct to bargain spoke before Kim could think. Mahbub laughed and put the coin away.
        - id: ch01-b44
          speaker: mahbub
          text: That market is too easy. Tell me for love. We hold each other's lives.
        - id: ch01-b45
          speaker: kim
          text: Very well. I saw the Commander-in-Chief arrive for a great dinner. Later, I saw him inside Creighton Sahib's office. I watched the two men read the white stallion's pedigree together, and I heard with my own ears the orders that opened a great war.
        - id: ch01-b46
          speaker: mahbub
          text: The game was well played. That war is over now, and we hope the evil was cut off before it could flower, thanks to you and me. What did you do with the news afterward?
        - id: ch01-b47
          speaker: kim
          text: I made the news into a hook for catching food and honor among the villagers where the priest drugged my lama. But I carried away the old man's purse, so the Brahmin found nothing and was angry the next morning. Then I used the news again after I fell into the hands of the white Regiment that carried the Red Bull.
        - id: ch01-b48
          speaker: mahbub
          text: That was foolish. News should not be scattered like dung cakes. Use it sparingly, like bhang.
        - id: ch01-b49
          speaker: kim
          text: I know that now. It did me no good. But it happened long ago. Since then, especially through the nights beneath the school punkah, I have thought a great deal.
        - id: ch01-b50
          speaker: mahbub
          text: May I ask where the Heaven-born's mighty thoughts have led him?
        - id: ch01-b51
          speaker: kim
          text: You may. At Lucknow they say a Sahib must never tell a black man that he has made a mistake.
        - id: ch01-b52
          speaker: narrator
          text: Mahbub's hand flew inside his coat. Calling a Pathan a black man was a deadly insult. Then he remembered who had spoken and laughed.
        - id: ch01-b53
          speaker: mahbub
          text: Speak, Sahib. Your black man is listening.
        - id: ch01-b54
          speaker: kim
          text: But I am not a Sahib. I admit I was wrong to curse you that day at Umballa, when I believed a Pathan had betrayed me. I had no sense then. I had only just been caught, and I wanted to kill that low-caste drummer-boy. Now I say that you did well. I can see the whole road before me, leading into good service, and I will stay at the madrissah until I am ripe.
        - id: ch01-b55
          speaker: mahbub
          text: Well said. In this game, you must learn distances, numbers, and compasses. Someone waits in the Hills to teach you.
        - id: ch01-b56
          speaker: kim
          text: I will learn on one condition. When the madrissah closes, my time must be mine without question. Ask the Colonel for that.
        - id: ch01-b57
          speaker: mahbub
          text: Why not ask him yourself in the Sahibs' language?
        - id: ch01-b58
          speaker: kim
          text: The Colonel serves the Government. One word sends him here or there, and he must think of his own advancement. See how much Lucknow has already taught me! Besides, I have known the Colonel for only three months. I have known one Mahbub Ali for six years. So I will go to the madrissah, learn at the madrissah, and be a Sahib inside the madrissah. But when it closes, I must be free to go among my own people, or I will die.
        - id: ch01-b59
          speaker: mahbub
          text: And who are your people, Friend of all the World?
        - id: ch01-b60
          speaker: kim
          text: This great, beautiful land. I want to see my lama again too. And I need money.
        - id: ch01-b61
          speaker: narrator
          text: Kim swept a hand around the little clay-walled room as he named his people. In a wall niche, the oil lamp burned dimly through the heavy tobacco smoke.
        - id: ch01-b62
          speaker: mahbub
          text: Everyone needs money. I will give you eight annas, because not much money can be picked from horses' hooves. It must last you for many days. I am pleased with everything else, and we need say no more about it. Learn quickly, and in three years, perhaps less, you may even be useful to me.
        - id: ch01-b63
          speaker: kim
          text: Have I only hindered you until now?
        - id: ch01-b64
          speaker: narrator
          text: Kim giggled like the boy he was.
        - id: ch01-b65
          speaker: mahbub
          text: Do not answer back. You are my new horseboy. Sleep among my men at the north end of the station.
        - id: ch01-b66
          speaker: kim
          text: Without proof, they will beat me all the way to the south end.
        - id: ch01-b67
          speaker: narrator
          text: Mahbub took a cake of Chinese ink from his belt, wet his thumb, and pressed it onto soft native paper. From Balkh to Bombay, men knew that ridged thumbprint crossed by an old scar.
        - id: ch01-b68
          speaker: mahbub
          text: Show that to my headman. I will come in the morning.
        - id: ch01-b69
          speaker: kim
          text: Which road will you take?
        - id: ch01-b70
          speaker: mahbub
          text: The only road from the city. Afterward, we return to Creighton Sahib. I have saved you a beating.
        - id: ch01-b71
          speaker: kim
          text: Allah! What is a beating when a man's head sits loose on his shoulders?
        - id: ch01-b72
          speaker: narrator
          text: Kim slipped into the night. He circled the house, stayed close to the walls, and walked about a mile beyond the station. Then he looped slowly back, giving himself time to invent a story in case Mahbub's men questioned him.
        - id: ch01-b73
          speaker: narrator
          text: The men had camped on waste ground beside the railway. They had not unloaded their horses. The animals still stood crowded into two trucks among a shipment of country-bred horses bought for the Bombay tram company. A worn-out, sickly-looking Mohammedan headman challenged Kim at once, but the sight of Mahbub's marked paper satisfied him.
        - id: ch01-b74
          speaker: kim
          text: The Hajji has kindly given me work. If you doubt it, wait for him until morning. For now, give me a place beside the fire.
        - id: ch01-b75
          speaker: narrator
          text: Everyone began the usual wandering talk that camp followers raised over any new arrival. At last the voices faded. Kim lay behind Mahbub's little group, almost under the wheels of a horse truck, with a borrowed blanket over him. The night was damp. Broken bricks and railway rubble made his bed, crowded horses stood on one side, and unwashed Baltis slept on the other. Few white boys would have liked it. Kim was perfectly happy.
        - id: ch01-b76
          speaker: narrator
          text: A change of place, work, and companions was as necessary to him as breath through his small nostrils. Remembering the neat white beds lined beneath the punkah at Saint Xavier's gave him the same sharp pleasure as reciting the multiplication table in English.
        - id: ch01-b77
          speaker: kim
          text: I am very old now. Every month makes me a year older. I was young, and a fool besides, when I carried Mahbub's message to Umballa. Even when I stayed with that white Regiment, I was very young and small and had no wisdom. Now I learn every day. In three years, the Colonel will take me from the madrissah and let me travel the Road with Mahbub, hunting for horse pedigrees. Or perhaps I will go by myself. Better still, I may find my lama and walk as his chela again when he returns to Benares.
        - id: ch01-b78
          speaker: narrator
          text: His thoughts came more slowly, breaking apart as he sank toward a beautiful country of dreams. Then his ears caught a thin, sharp whisper above the steady murmur near the fire. The sound came from behind the iron-sided horse truck.
        - id: ch01-b79
          speaker: first_attacker
          text: So he is not here?
        - id: ch01-b80
          speaker: second_attacker
          text: He will be drinking and making trouble in the city. Who searches a frog pond for a rat? Come away. This is not our man.
        - id: ch01-b81
          speaker: first_attacker
          text: The order says he must not cross the Passes again.
        - id: ch01-b82
          speaker: second_attacker
          text: Pay some woman a few rupees to drug him. Then there will be no evidence.
        - id: ch01-b83
          speaker: first_attacker
          text: The woman would be evidence. We need certainty, especially with that price on his head.
        - id: ch01-b84
          speaker: second_attacker
          text: The police reach a long way, and we are far from the Border. If only this were Peshawur.
        - id: ch01-b85
          speaker: first_attacker
          text: Peshawur? His relatives are everywhere there, along with hiding places and women whose skirts could hide him. Peshawur or Hell would serve us equally well.
        - id: ch01-b86
          speaker: second_attacker
          text: Then what do we do?
        - id: ch01-b87
          speaker: first_attacker
          text: Fool, I have told you a hundred times. Wait until he lies down, then fire one sure shot. The trucks will hide us while we run across the lines. No one will see where the shot came from. Stay until dawn. What kind of fakir shivers over a little waiting?
        - id: ch01-b88
          speaker: narrator
          text: Behind his closed eyes, Kim understood. Once again, danger had followed Mahbub. A white stallion's pedigree was plainly not a safe thing to sell to Sahibs. Or perhaps Mahbub had been selling other news. Kim did not know where he was staying. If he came before dawn, the men would shoot him, and that would bring Kim no profit. Calling the police would bring Mahbub no profit either. Kim almost laughed when he realized that no lesson from Lucknow offered an answer. The problem belonged to him alone. First, he must appear to wake and leave without making the hidden men suspicious.
        - id: ch01-b89
          speaker: narrator
          text: Kim decided to wake and leave without making the men suspicious. A bad dream would do it. He flung the blanket from his face, sat up, and gave the terrible, bubbling cry of a man waking from nightmare.
        - id: ch01-b90
          speaker: kim
          text: Urr-urr-urr-urr! Ya-la-la-la-la! Narain! The churel! The churel!
          emotion: fearful
        - id: ch01-b91
          speaker: narrator
          text: A churel was the especially cruel ghost of a woman who died in childbirth. She haunted lonely roads on feet turned backward at the ankles and led men away to torment.
        - id: ch01-b92
          speaker: narrator
          text: Kim's shaking howl grew louder and louder. At last he jumped to his feet and stumbled away as if he were still half asleep, while the whole camp cursed him for waking them. About twenty yards up the line, he lay down again. He carefully made sure the hidden men heard him groan and grunt while he settled himself. After a few minutes, he rolled toward the road and stole away into the thick darkness.
        - id: ch01-b93
          speaker: narrator
          text: He hurried along until he reached a culvert, then dropped behind it with his chin level with the coping stone. From there, he could watch every traveler on the road while remaining unseen. Two or three carts jingled toward the suburbs. A coughing policeman passed. One or two people hurried by on foot, singing to keep evil spirits away. Then Kim heard the sharp beat of iron-shod hoofs.
        - id: ch01-b94
          speaker: narrator
          text: The horse shied when it caught sight of the little head rising above the culvert. The sound of its hoofs and the way it moved told Kim that this traveler was much more likely to be Mahbub.
        - id: ch01-b95
          speaker: kim
          text: Ohe, Mahbub Ali. Be careful!
        - id: ch01-b96
          speaker: narrator
          text: Mahbub pulled the horse almost onto its haunches and forced it close to the culvert.
        - id: ch01-b97
          speaker: mahbub
          text: I will never again use a shod horse for night work. Its feet find every bone and nail in the city.
        - id: ch01-b98
          speaker: narrator
          text: He bent to lift a forefoot, bringing his head within a foot of Kim.
        - id: ch01-b99
          speaker: kim
          text: Keep down. The night has eyes. Two men are waiting behind the horse trucks. They mean to shoot you when you lie down, because there is a price on your head. I heard them while I slept near the horses.
        - id: ch01-b100
          speaker: mahbub
          text: Did you see them? Stand still, Sire of Devils!
        - id: ch01-b101
          speaker: narrator
          text: The last words were for the restless horse.
        - id: ch01-b102
          speaker: kim
          text: No, I did not see them.
        - id: ch01-b103
          speaker: mahbub
          text: Was one dressed like a fakir?
        - id: ch01-b104
          speaker: kim
          text: One asked the other what kind of fakir shivered over a little waiting.
        - id: ch01-b105
          speaker: mahbub
          text: Good. Return to camp and lie down. I will not die tonight.
        - id: ch01-b106
          speaker: narrator
          text: Mahbub wheeled his horse and disappeared. Kim raced back along the ditch until he was opposite his second bed. He slipped across the road as quietly as a weasel and curled inside the blanket again. At least Mahbub knew. He had spoken like a man who expected such danger, and Kim doubted the two watchers would gain anything that night.
        - id: ch01-b107
          speaker: narrator
          text: An hour passed. Kim had every intention of keeping watch all night, but he fell into a deep sleep. Now and then, a night train thundered along the rails within twenty feet of his blanket. Mere noise did not trouble him. The roar did not even weave itself into one of his dreams.
        - id: ch01-b108
          speaker: narrator
          text: Mahbub did not sleep at all. He was furious that men outside his tribe, with no concern in his love affairs, should hunt his life. His first and most natural wish was to cross the railway farther down, circle back, catch his well-wishers from behind, and kill them both. Sadly, another branch of the Government, one unconnected with Colonel Creighton, might demand explanations that were hard to give. South of the Border, people made a perfectly foolish commotion over a corpse or two. No one had troubled Mahbub this way since he sent Kim to Umballa, and he had hoped suspicion was gone for good.
        - id: ch01-b109
          speaker: narrator
          text: Then a splendid idea came to him.
        - id: ch01-b110
          speaker: mahbub
          text: Englishmen forever tell the truth, and so they forever make fools of us. By Allah, I will tell an Englishman the truth! What good are the Government police if a poor Kabuli's horses can be stolen from railway trucks? This is as bad as Peshawur. I should complain at the station. Better yet, I will find a young railway Sahib. Young men are eager, and catching thieves brings them honor.
        - id: ch01-b111
          speaker: narrator
          text: Mahbub tied his horse outside the station and strode onto the platform. A young Assistant District Traffic Superintendent was waiting to travel down the line. He was tall and fair-haired, wore dingy white linen, and had the look of a man who lived around horses.
        - id: ch01-b112
          speaker: barton
          text: Hullo, Mahbub Ali. What brings you here? Selling old nags?
        - id: ch01-b113
          speaker: mahbub
          text: My horses do not trouble me. I am looking for Lutuf Ullah. I have a truckload farther up the line. Could anyone remove the horses without the railway knowing?
        - id: ch01-b114
          speaker: barton
          text: I doubt it. If they did, you could make a claim against us.
        - id: ch01-b115
          speaker: mahbub
          text: I saw two men crouched beneath one truck nearly all night. Fakirs do not steal horses, so I paid no attention. I only want my partner, Lutuf Ullah.
        - id: ch01-b116
          speaker: barton
          text: You saw them and did nothing? It is lucky you found me. What did they look like?
        - id: ch01-b117
          speaker: mahbub
          text: Only fakirs. At worst, they may take a little grain from a truck. There are plenty of them up the line, and the State will never miss the gift. I came to find Lutuf Ullah.
        - id: ch01-b118
          speaker: barton
          text: Forget your partner. Where are the horse trucks?
        - id: ch01-b119
          speaker: mahbub
          text: Just this side of the farthest place where they make lamps for trains.
        - id: ch01-b120
          speaker: barton
          text: The signal box. Yes.
        - id: ch01-b121
          speaker: mahbub
          text: They stand on the rail nearest the road, on the right as you face up the line. But Lutuf Ullah is tall, with a broken nose and a Persian greyhound. Ai!
        - id: ch01-b122
          speaker: narrator
          text: Barton had already rushed away to wake a young, enthusiastic policeman. The railway had lost a great deal to thieves in the goods yard, and Barton took the chance to catch some very seriously. Mahbub chuckled into his dyed beard.
        - id: ch01-b123
          speaker: mahbub
          text: They will stamp along in their boots, scare the fakirs away, and wonder where they went. Barton Sahib and the young policeman are very clever boys.
        - id: ch01-b124
          speaker: narrator
          text: Mahbub waited idly for several minutes, expecting the two young men to hurry noisily up the line, armed and ready. Instead, a light engine slid through the station. In the cab, Mahbub caught a glimpse of young Barton.
        - id: ch01-b125
          speaker: mahbub
          text: I judged that child too harshly. He is not a complete fool. Using a fire carriage to hunt a thief is a new game.
        - id: ch01-b126
          speaker: narrator
          text: Mahbub returned to camp at dawn. No one among his followers thought the night's events worth reporting to him. No one, that is, except the small horseboy who had just risen into the great man's service. Mahbub called Kim into his tiny tent and set him to helping with the packing.
        - id: ch01-b127
          speaker: kim
          text: I know everything. Two Sahibs came on a little train. I ran back and forth in the dark on this side of the trucks while the train crept up and down the line. They rushed the two men sitting beneath this truck. Hajji, what should I do with this lump of tobacco? Wrap it in paper and put it under the salt bag? Yes. One man struck a Sahib with a fakir's joined buck horns, the only weapon such a man carries, and blood came. The other Sahib first knocked his own man senseless. Then he hit the attacker with a short gun that had rolled from the first man's hand. They all fought like madmen together.
        - id: ch01-b128
          speaker: narrator
          text: Mahbub listened to the tale and smiled with the heavenly patience of a saint.
        - id: ch01-b129
          speaker: mahbub
          text: No, that is not merely madness or a civil matter. It is a criminal case. You say there was a gun? That means ten good years in prison.
        - id: ch01-b130
          speaker: kim
          text: Afterward, both men lay still. I think they were nearly dead when the Sahibs put them on the train. Their heads moved like this. There is a great deal of blood on the line. Will you come see it?
        - id: ch01-b131
          speaker: mahbub
          text: I have seen blood before. Prison is certain. They will surely give false names, and no one will discover who they are for a long time. They were enemies of mine. Your fate and mine seem to hang on one string. What a story this will make for the healer of pearls! Now hurry with the saddlebags and the cooking plate. We will unload the horses and leave for Simla.
        - id: ch01-b132
          speaker: narrator
          text: The camp moved quickly, as Eastern travelers understood that word. There were long explanations, loud complaints, careless work, endless talk, and a hundred pauses to recover forgotten objects. At last the untidy camp broke apart. In the cool dawn after rain, they led six stiff, restless horses onto the Kalka road.
        - id: ch01-b133
          speaker: narrator
          text: Everyone who wanted Mahbub's favor now treated Kim as the great man's favorite, so the boy was asked to do no work. They wandered by the easiest stages and stopped every few hours at roadside shelters. Many Sahibs used the Kalka road. As Mahbub said, every young Sahib believed he was a judge of horses. Even if he owed a moneylender more than he could pay, he still had to pretend he might buy one.
        - id: ch01-b134
          speaker: narrator
          text: Again and again, a Sahib rolling by in a stage carriage stopped to talk. Some even climbed down and felt the horses' legs with knowing hands. They asked foolish questions or knew so little of the local language that they gravely insulted the untroubled trader without realizing it.
        - id: ch01-b135
          speaker: mahbub
          text: When I first traded with Sahibs, Colonel Soady was Governor of Fort Abazai and flooded the Commissioner's camp out of spite. I did not yet know how foolish Sahibs could be, so they made me angry.
        - id: ch01-b136
          speaker: narrator
          text: Beneath a tree, while Kim filled his pipe, Mahbub told him how one innocent mistake with a phrase had once caused trouble. Kim folded over with laughter.
        - id: ch01-b137
          speaker: mahbub
          text: Now I understand that Sahibs are like everyone else. They are wise about some things and great fools about others. Never use the wrong word with a stranger. Your heart may mean no insult, but how can he know that? He may search for the truth with a dagger.
        - id: ch01-b138
          speaker: kim
          text: That is true. Fools mention a cat when a woman has just given birth. I have heard them do it.
        - id: ch01-b139
          speaker: mahbub
          text: With your two faces, you must remember this especially well. Among Sahibs, never forget that you are a Sahib. Among the people of Hind, always remember that you are—
        - id: ch01-b140
          speaker: narrator
          text: Mahbub stopped with a puzzled smile.
        - id: ch01-b141
          speaker: kim
          text: What am I? Mohammedan, Hindu, Jain, or Buddhist? That is a hard knot to untie.
        - id: ch01-b142
          speaker: mahbub
          text: You are certainly an unbeliever, so my Law says you will be damned. At least, I think it says so. But you are also my Little Friend of all the World, and I love you. My heart says that.
        - id: ch01-b143
          speaker: mahbub
          text: This matter of Faiths is like horseflesh. A wise man knows that horses are good and that every kind can bring a profit. If I were not a good Sunni who hates the men of Tirah, I might believe the same of all religions. Take a Kathiawar mare from the sands where she was born and move her west of Bengal, and she founders. A Balkh stallion is among the best horses alive, though heavy in the shoulder, but even he is useless in the great northern deserts beside the snow camels I have seen. So, in my heart, I say every Faith has merit in its own country.
        - id: ch01-b144
          speaker: kim
          text: My lama says something entirely different.
        - id: ch01-b145
          speaker: mahbub
          text: He is an old dreamer from Bhotiyal. It troubles me a little that you value a man so little known.
        - id: ch01-b146
          speaker: kim
          text: Even so, Hajji, I see his worth, and my heart goes to him.
        - id: ch01-b147
          speaker: mahbub
          text: And his heart goes to you, I hear. Hearts are like horses. They come and go in spite of bit and spur. Call to Gul Sher Khan over there. Tell him to drive the bay stallion's peg deeper. We cannot have a horse fight at every stop, and that bay will soon tangle with the dun and the black. Now listen. Must you see the lama for your heart to rest?
        - id: ch01-b148
          speaker: kim
          text: It is part of our bond. If I cannot see him, or if he is taken from me, I will leave the madrissah in Lucknow. Once I am gone, who will ever find me?
        - id: ch01-b149
          speaker: mahbub
          text: That is true. No colt was ever held by a lighter heel rope than the one that holds you.
        - id: ch01-b150
          speaker: kim
          text: Do not worry. My lama promised to visit me at the madrissah.
        - id: ch01-b151
          speaker: mahbub
          text: A beggar with his bowl, standing among those young Sa—
        - id: ch01-b152
          speaker: kim
          text: Not all of them! Many have blue-rimmed eyes and dirty nails from low-caste blood. Sons of sweepers, and brothers-in-law to sweepers!
        - id: ch01-b153
          speaker: narrator
          text: There was no need to follow the rest of the insulting pedigree. Kim kept chewing his piece of sugarcane. He made his point clearly, but without the least heat.
        - id: ch01-b154
          speaker: mahbub
          text: Friend of all the World, I have met many men, women, boys, and Sahibs. Never in my life have I known such an imp.
        - id: ch01-b155
          speaker: narrator
          text: Mahbub passed over his pipe for Kim to clean.
        - id: ch01-b156
          speaker: kim
          text: And why am I an imp, when I always tell you the truth?
        - id: ch01-b157
          speaker: mahbub
          text: Perhaps that is why. This world is dangerous for honest men.
        - id: ch01-b158
          speaker: narrator
          text: Mahbub stood, tightened his belt, and walked toward the horses.
        - id: ch01-b159
          speaker: kim
          text: Or perhaps I sell the truth?
        - id: ch01-b160
          speaker: narrator
          text: There was something in Kim's tone that made Mahbub stop at once and turn back toward him.
        - id: ch01-b161
          speaker: mahbub
          text: What new devilry is this?
        - id: ch01-b162
          speaker: kim
          text: Eight annas, and I will tell you. It concerns your peace.
        - id: ch01-b163
          speaker: narrator
          text: Mahbub called him a devil and paid.
        - id: ch01-b164
          speaker: kim
          text: Do you remember the thieves in the dark at Umballa?
        - id: ch01-b165
          speaker: mahbub
          text: Since they wanted my life, I have not completely forgotten. Why?
        - id: ch01-b166
          speaker: kim
          text: And do you remember the Kashmir Serai?
        - id: ch01-b167
          speaker: mahbub
          text: I will twist your ears in a moment, Sahib.
        - id: ch01-b168
          speaker: kim
          text: No need, Pathan. The second fakir, the one the Sahibs beat senseless, was the man who searched your stall in Lahore. I saw his face when they lifted him onto the engine. It was the same man.
        - id: ch01-b169
          speaker: mahbub
          text: Why didn't you tell me before?
        - id: ch01-b170
          speaker: kim
          text: He will be safe in prison for years. There was no reason to say more than necessary. Besides, I did not need sweetmeat money then.
        - id: ch01-b171
          speaker: mahbub
          text: Allah kerim! If the mood takes you one day, will you sell my head for the price of a few sweets?
        - id: ch01-b172
          speaker: narrator
          text: Kim remembered that long, lazy journey for the rest of his life. They went from Umballa through Kalka and the nearby Pinjore Gardens, then climbed toward Simla. A sudden flood in the Gugger River swept away one horse, naturally the most valuable of them all, and nearly drowned Kim among the dancing boulders.
        - id: ch01-b173
          speaker: narrator
          text: Farther up the road, a Government elephant stampeded the horses. They were strong from feeding on grass, and gathering them again took a day and a half. Then Sikandar Khan came downhill with a few unsaleable animals, all that remained of his herd. Mahbub knew more about horse dealing in one fingernail than Sikandar knew in all his tents. Even so, he insisted on buying two of the worst horses. The bargain required eight hours of exhausting diplomacy and more tobacco than anyone could count.
        - id: ch01-b174
          speaker: narrator
          text: To Kim, all of it was pure delight. The wandering Road climbed, dipped, and swept around the rising foothills. Morning light lay across the distant snow. Branching cactus rose in tiers over stony slopes. A thousand water channels murmured, monkeys chattered, and solemn deodar trees climbed one behind another with their branches hanging low. Far beneath them, the broad Plains opened into the distance.
        - id: ch01-b175
          speaker: narrator
          text: Tonga horns twanged without end. Whenever a carriage burst around a bend, the led horses rushed wildly aside. They halted for prayers. Mahbub was deeply religious about dry washing and bellowing his devotion whenever time did not press. In the evening, travelers gathered at the stopping places. Camels and bullocks chewed solemnly together while their steady drivers shared the news of the Road. Every one of these things lifted Kim's heart into song.
        - id: ch01-b176
          speaker: mahbub
          text: Once the singing and dancing end, we go to the Colonel Sahib. That will not be so pleasant.
        - id: ch01-b177
          speaker: kim
          text: Hind is a fair and beautiful land, and the Land of the Five Rivers is fairest of all. I will return there if you or the Colonel raise hand or foot against me. Once I disappear, who will find me? Hajji, is that Simla? Allah, what a city!
        - id: ch01-b178
          speaker: mahbub
          text: My father's brother was already old when Mackerson Sahib's well at Peshawur was new. He remembered when Simla had only two houses.
        - id: ch01-b179
          speaker: narrator
          text: Mahbub led the horses below the main road into the lower Simla bazaar. It was a crowded rabbit warren climbing from the valley toward the Town Hall at an astonishing angle of forty-five degrees. Anyone who knew it could defy every policeman in India's summer capital. Its paths were made for escape. One veranda connected with another, alleys opened into alleys, and secret holes seemed to lead everywhere.
        - id: ch01-b180
          speaker: narrator
          text: The people who served every need of the bright city lived there. Rickshaw pullers carried pretty ladies through the night and gambled until dawn. Grocers, oil sellers, sellers of curios and firewood, priests, pickpockets, and native Government employees filled the lanes. Courtesans discussed matters supposed to be the deepest secrets of the India Council. The smallest agents serving half the Native States gathered there too, trading their own news.
        - id: ch01-b181
          speaker: narrator
          text: Mahbub rented a room there in the house of a Mohammedan cattle dealer. Its door was locked far more securely than the one on his Lahore stall. The room worked a small miracle. At twilight, a Mohammedan horseboy entered. An hour later, a Eurasian schoolboy came out wearing badly fitting clothes bought in a shop. The Lucknow girl's dye had held beautifully.
        - id: ch01-b182
          speaker: mahbub
          text: I have spoken to Creighton Sahib. For a second time, the Hand of Friendship has turned aside the Whip of Calamity. The Colonel says you have wasted sixty whole days on the Road. Because of that, it is now too late to send you to any hill school.
        - id: ch01-b183
          speaker: kim
          text: I have already said that my holidays belong to me. I will not attend school twice over. That freedom is one part of our bargain.
        - id: ch01-b184
          speaker: mahbub
          text: The Colonel Sahib does not know of that bargain yet. Until the time comes for you to return to Lucknow, you will lodge in Lurgan Sahib's house.
        - id: ch01-b185
          speaker: kim
          text: I would rather stay with you.
        - id: ch01-b186
          speaker: mahbub
          text: You do not understand the honor. Lurgan Sahib asked for you himself. Go up the hill and then follow the road along the top. For a while, forget that you have ever seen or spoken to Mahbub Ali, the horse dealer who sells horses to Creighton Sahib, a colonel you do not know. Remember this order exactly.
        - id: ch01-b187
          speaker: narrator
          text: Kim understood the command and nodded.
        - id: ch01-b188
          speaker: kim
          text: Good. And who is Lurgan Sahib? No, truly, I have never even heard his name. Could he perhaps be one of us?
        - id: ch01-b189
          speaker: narrator
          text: He lowered his voice, but Mahbub's glance had become sharp as a sword.
        - id: ch01-b190
          speaker: mahbub
          text: What do you mean by us, Sahib? I am a Pathan. You are a Sahib and a Sahib's son. Lurgan Sahib keeps a shop among the European shops, and all Simla knows it. Ask for him there. Friend of all the World, he is a man to obey down to the last movement of his eyelashes. People say that he works magic, but that need not touch you. Go up the hill and ask for him. Here begins the Great Game.
