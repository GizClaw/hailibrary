audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts: {delivery: "从容而机敏的讲述", timbre: "温暖清晰", pace: "舒展而有变化", pitch: "中音"}
    kim:
      display_name: 金
      tts: {delivery: "机灵大胆，话里常带笑", timbre: "明亮的少年声", pace: "轻快敏捷", pitch: "中高音"}
    mahbub:
      display_name: 马哈布·阿里
      tts: {delivery: "老练深沉，幽默里藏着试探", timbre: "粗厚低沉", pace: "从容", pitch: "低音"}
    assassin_one:
      display_name: 第一个伏击者
      tts: {delivery: "压低嗓音，犹疑不安", timbre: "干涩低沉", pace: "稍慢", pitch: "低音"}
    assassin_two:
      display_name: 第二个伏击者
      tts: {delivery: "冷酷急躁，话里带着讥诮", timbre: "尖利阴沉", pace: "稍快", pitch: "中低音"}
    railway_official:
      display_name: 铁路助理监督
      tts: {delivery: "年轻热心，问话直截了当", timbre: "清亮有力", pace: "稍快", pitch: "中音"}
  chapters:
    - id: ch01
      title: 第八章
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: "有一首歌这样唱。生我的泥土，我欠它几分。养我的生活，我欠得更多。可最该感谢的是安拉，给了我的脑袋两副心思。衬衫鞋子可以不要，朋友、烟草、面包也能丢，唯独脑袋里的两副心思，哪一副都片刻不能少。"
        - id: ch01-b02
          speaker: mahbub
          text: "看在真主的分上，把红色换成蓝色吧。"
        - id: ch01-b03
          speaker: narrator
          text: "马哈布说的是金那顶不像样的印度教徒头巾。"
        - id: ch01-b04
          speaker: kim
          text: "信仰和铺盖，我都可以换。不过这笔钱得由你出。"
        - id: ch01-b05
          speaker: narrator
          text: "马哈布笑得差点从马上摔下去。到了城外一家铺子，两人当场换好装束。金站起身来，起码从外表看，已经是个穆斯林。马哈布又在火车站正对面租下一间屋，叫人送来一桌上好的熟食、杏仁凝乳甜点巴鲁沙希，还有切得细细的勒克瑙烟草。金盘腿坐下，望着这顿饭，笑得十分满足。"
        - id: ch01-b06
          speaker: kim
          text: "这可比我跟那个锡克人一起吃的某些肉强多了。我的学校里也绝没有这样的饭菜。"
        - id: ch01-b07
          speaker: mahbub
          text: "我正想听听那所学校的事。不过先从头到尾老实告诉我，你是怎样逃出来的。世界之友啊，少爷和少爷的儿子从那种地方逃走，恐怕不常见。"
        - id: ch01-b08
          speaker: narrator
          text: "马哈布边问边大口吃着羊肉。那肉加了香料，同卷心菜和焦黄的洋葱一起用油煎过。他吃得腰带都绷紧了。"
        - id: ch01-b09
          speaker: kim
          text: "他们怎么逃？他们又不懂这片土地。那件事没什么稀奇。"
        - id: ch01-b10
          speaker: narrator
          text: "金从头讲起。听到他乔装改扮，又在集市上同姑娘见面，马哈布再也绷不住脸，放声大笑，一巴掌拍在大腿上。"
        - id: ch01-b11
          speaker: mahbub
          text: "好样的，小家伙，干得漂亮！绿松石医师听了会怎么说？来，后来又出了什么事？一步一步慢慢讲，什么也别漏。"
        - id: ch01-b12
          speaker: narrator
          text: "金便一步一步讲述自己的奇遇，照马哈布的要求，一件也没有漏下。浓烈的烟味呛进肺里，他边讲边咳。马哈布听完，低声说，自己早已看出这匹小马要挣脱缰绳，上场打马球。果子已经成熟，只差学会怎样测距离、数步幅，还要懂得标杆和罗盘。"
        - id: ch01-b13
          speaker: mahbub
          text: "你听好。我替你挡开了上校抽向你皮肉的鞭子，这份人情可不小。"
        - id: ch01-b14
          speaker: kim
          text: "不错。这话一点不假。"
        - id: ch01-b15
          speaker: mahbub
          text: "不过你这样说跑就跑，说回就回，绝算不得好事。"
        - id: ch01-b16
          speaker: kim
          text: "那是我的假期，朝觐者。我做了好多个星期的奴隶。学校既然关门，我为什么不能走？一路上我靠朋友接济，也像跟锡克人一起时那样干活换饭，还替上校省了一大笔钱呢。"
        - id: ch01-b17
          speaker: narrator
          text: "马哈布修剪齐整的胡髭下面，嘴唇微微抽动。"
        - id: ch01-b18
          speaker: mahbub
          text: "几个卢比对上校算什么？他花钱自有用处，绝不是因为疼爱你。"
        - id: ch01-b19
          speaker: kim
          text: "这件事，我很久以前就知道了。"
        - id: ch01-b20
          speaker: mahbub
          text: "是谁告诉你的？"
        - id: ch01-b21
          speaker: kim
          text: "上校自己。他没有明说，可只要脑袋还不全是泥，听得就够明白。我们坐火车去勒克瑙时，他已经告诉我了。"
        - id: ch01-b22
          speaker: mahbub
          text: "那好，我再告诉你一些。可这些话一出口，我便把脑袋押给你了。"
        - id: ch01-b23
          speaker: kim
          text: "在安巴拉，你把挨了鼓手少年打的我抱上马时，你的脑袋已经押给我了。"
        - id: ch01-b24
          speaker: mahbub
          text: "把话说清楚。全世界都可以撒谎，只有你我不行。只要我愿意在这里抬一抬手指，你的命也押在我手里。"
        - id: ch01-b25
          speaker: kim
          text: "这个我也知道，所以我们才拴得这样牢。其实你握着的一头更稳。一个孩子给人打死，或被扔进路边的井里，谁会惦记？可你若死在马群里，这里、西姆拉和山后关隘那边的人，都会问马哈布·阿里出了什么事。上校也会查问。"
        - id: ch01-b26
          speaker: narrator
          text: "金狡黠地皱起脸，接着往下说。"
        - id: ch01-b27
          speaker: kim
          text: "不过他不会查得太久，免得别人问，这位上校同那个马贩子有什么关系。可若我还活着，事情就不同了。"
        - id: ch01-b28
          speaker: mahbub
          text: "你当然活不了。"
        - id: ch01-b29
          speaker: kim
          text: "也许吧。可若我活着，便只有我知道，有个家伙趁夜钻进你在客店的隔间，把你杀掉。他还会把鞍袋翻个底朝天，连拖鞋夹层也不放过。这消息该不该告诉上校？还是他会像那次叫我去取根本没落下的雪茄烟盒一样，问我马哈布·阿里同他有什么相干？"
        - id: ch01-b30
          speaker: narrator
          text: "一大团浓烟腾起来。两人沉默了许久。"
        - id: ch01-b31
          speaker: mahbub
          text: "脑子里装着这些事，你居然还能在学校里那群少爷的小儿子中间睡觉起床，乖乖听老师教训？"
        - id: ch01-b32
          speaker: kim
          text: "这是命令。我算什么，敢同命令争辩？"
        - id: ch01-b33
          speaker: mahbub
          text: "真是个十足的魔王之子。不过你说的盗贼和搜查，究竟是怎么回事？"
        - id: ch01-b34
          speaker: kim
          text: "那天夜里，我和喇嘛睡在克什米尔客店你住处旁边。门没有上锁，这可不像你的习惯。那人料定你一时不会回来，进去找一样很小、藏得极严密的东西。不是毯子，不是马镫、笼头，也不是铜锅。我把眼睛贴在木板的节孔上，看见他拿铁签往你拖鞋的夹层里刺。"
        - id: ch01-b35
          speaker: mahbub
          text: "真理之井啊，你看见这些，心里编出了什么故事？"
        - id: ch01-b36
          speaker: kim
          text: "什么也没编。我按住贴身的护符，想起从穆斯林面饼里咬出来的白种公马血统书，便动身去安巴拉。我知道自己受了重托。那时候只消我乐意，你的脑袋就保不住。我只要告诉那个人，我有一张关于马的纸，可自己不识字。接下来会怎样？"
        - id: ch01-b37
          speaker: mahbub
          text: "接下来你会喝两遍水，也许三遍。我想不会更多。"
        - id: ch01-b38
          speaker: kim
          text: "不错。我也想过这件事，可我更想到，我喜欢你，马哈布。所以我去了安巴拉。你不知道的是，我藏在花园草丛里，想看看克赖顿上校读到血统书后会做什么。"
        - id: ch01-b39
          speaker: narrator
          text: "金说到这里，忽然停了。"
        - id: ch01-b40
          speaker: mahbub
          text: "他做了什么？"
        - id: ch01-b41
          speaker: kim
          text: "你白送消息，还是拿来卖钱？"
        - id: ch01-b42
          speaker: mahbub
          text: "我既卖，也买。"
        - id: ch01-b43
          speaker: narrator
          text: "马哈布从腰带里摸出一枚四安那硬币，举在手上。"
        - id: ch01-b44
          speaker: kim
          text: "八安那！"
        - id: ch01-b45
          speaker: narrator
          text: "东方人的讨价还价本能叫他不假思索地喊出这个数。马哈布笑着把钱收了回去。"
        - id: ch01-b46
          speaker: mahbub
          text: "这个市集的买卖太容易了。看在交情上告诉我吧，你我的命都在对方手里。"
        - id: ch01-b47
          speaker: kim
          text: "很好。我看见总司令来赴一场盛大宴会，又走进克赖顿少爷的办公室。他们两人读了白种公马的血统书，我还亲耳听见发动大战的命令。"
        - id: ch01-b48
          speaker: mahbub
          text: "这一局走得漂亮。如今仗已经打完，祸患也幸而在开花以前掐灭了。这里有我的功劳，也有你的。后来你又做了什么？"
        - id: ch01-b49
          speaker: kim
          text: "有个村子的祭司给我的喇嘛下药，我便拿这消息当钩子，从村民那里钓来饭食和敬重。不过我把老人的钱袋拿走了，婆罗门什么也没捞着，第二天早晨气坏了。后来我落进那支供奉红公牛的白人兵团手里，又拿消息用了一回。"
        - id: ch01-b50
          speaker: mahbub
          text: "那可蠢透了。消息不能像牛粪饼一样到处乱扔，得像大麻一样省着用。"
        - id: ch01-b51
          speaker: kim
          text: "如今我也这么想，而且那件事半点好处也没给我带来。那已经是很久以前了。从那以后，尤其躺在学校风扇底下的那些夜晚，我想了许多。"
        - id: ch01-b52
          speaker: mahbub
          text: "天生的少爷想出了什么，容许我问一问吗？"
        - id: ch01-b53
          speaker: kim
          text: "容许。勒克瑙的人说，少爷绝不能向黑人承认自己犯了错。"
        - id: ch01-b54
          speaker: narrator
          text: "把普什图人叫作黑人，是要见血的侮辱。马哈布的手倏地伸进怀里，随即记起眼前是谁，又笑了。"
        - id: ch01-b55
          speaker: mahbub
          text: "请讲吧，少爷。你的黑人听着呢。"
        - id: ch01-b56
          speaker: kim
          text: "可我不是少爷。那天在安巴拉，我以为自己遭普什图人出卖，便咒骂了你。这件事是我错了。那时我刚被抓住，气得只想宰掉那个低种姓的鼓手少年。现在我明白了，朝觐者，你做得对。我也看清了前面的路。我要留在学校里，直到成熟。"
        - id: ch01-b57
          speaker: mahbub
          text: "说得好。要玩那场游戏，尤其得学会距离、数目和罗盘的用法。山上有人等着教你。"
        - id: ch01-b58
          speaker: kim
          text: "我愿意学，可有一个条件。学校关门时，我的时间归我自己，谁也不许过问。替我向上校提出来。"
        - id: ch01-b59
          speaker: mahbub
          text: "你为什么不亲自用少爷们的话去问上校？"
        - id: ch01-b60
          speaker: kim
          text: "上校是政府的仆人，一句话下来便得给派到这里那里，还得顾着升迁。瞧瞧我在勒克瑙学会了多少！再说，我认识上校才三个月，认识你却有六年。学校开着，我就去读书，在那里做少爷。可学校关门时，我必须自由自在，到我的人民中间去。不然我会死！"
        - id: ch01-b61
          speaker: mahbub
          text: "你的人民是谁，世界之友？"
        - id: ch01-b62
          speaker: kim
          text: "这片伟大而美丽的土地。还有，我想再见喇嘛。我也需要钱。"
        - id: ch01-b63
          speaker: narrator
          text: "金说着挥起手，指向泥墙小屋。壁龛里的油灯隔着浓烟，昏沉地燃烧。"
        - id: ch01-b64
          speaker: mahbub
          text: "人人都需要钱。我给你八安那。马蹄底下抠不出多少钱，这些得够你花好多天。至于其余的事，我很满意。赶紧学吧，三年以后，也许还不用三年，你就能派上用场，甚至帮到我。"
        - id: ch01-b65
          speaker: kim
          text: "难道我从前一直只会碍你的事？"
        - id: ch01-b66
          speaker: mahbub
          text: "少顶嘴。你现在是我的新马童，去同我的人睡。他们带着马，在车站北头附近。"
        - id: ch01-b67
          speaker: kim
          text: "我要是没个凭据，他们会一路把我打到车站南头去。"
        - id: ch01-b68
          speaker: narrator
          text: "马哈布用拇指蘸湿一块中国墨，在柔软的本地纸上按下指印。从巴尔赫到孟买，人人都认得那粗糙的纹路，还有斜贯其上的旧伤疤。"
        - id: ch01-b69
          speaker: mahbub
          text: "拿给我的头领看，这就够了。我早晨过去。"
        - id: ch01-b70
          speaker: kim
          text: "你走哪条路？"
        - id: ch01-b71
          speaker: mahbub
          text: "从城里来的那条路，只有那一条。随后我们一起回克赖顿少爷那里。我替你免了一顿打。"
        - id: ch01-b72
          speaker: kim
          text: "安拉！脑袋都在肩膀上晃悠了，挨顿打又算什么？"
        - id: ch01-b73
          speaker: narrator
          text: "金悄悄溜进夜色，贴着墙绕过半栋房子，朝背离车站的方向走了一英里。接着他兜个大圈，慢慢折回，好让自己有时间编出一套说辞，应付马哈布手下可能问起的事。"
        - id: ch01-b74
          speaker: narrator
          text: "他们在铁路旁的一片荒地上扎营。两节货车里挤着马哈布的牲口，也有孟买电车公司买下的一批本地马。那些本地人照自己的老习惯，当然谁也没有动手卸车。领头的是个落魄又像患着痨病的穆斯林。他一看见金便厉声盘问，直到金拿出马哈布亲手留下的印记，他才终于消了气。"
        - id: ch01-b75
          speaker: kim
          text: "朝觐者开恩，给了我一份差事。你若不信，等他早晨来问。现在先在火边给我腾个地方。"
        - id: ch01-b76
          speaker: narrator
          text: "众人照例漫无边际地闲扯一通，仿佛遇上任何事，都非得先这样鼓噪一番。声音终于渐渐低了。金躺到马哈布那一小群随从后面，几乎就在运马货车的轮子底下，盖着一条借来的毯子。潮湿的夜里，一边是挤得密不透风的马，一边是不洗澡的巴尔蒂人，身下只有碎砖和废道砟。没有几个白人孩子受得了这样的床铺，金却快活极了。"
        - id: ch01-b77
          speaker: narrator
          text: "换地方、换差事、换身边的人，对金来说就像呼吸一样要紧。一想到圣泽维尔那一排排白床全摆在风扇底下，他就觉得痛快，仿佛又在用英语背乘法表。睡意渐浓时，他默默盘算起来。"
        - id: ch01-b78
          speaker: kim
          text: "我已经很老了，每过一个月就老上一岁。当初替马哈布送信去安巴拉，我还又小又傻。跟那支白人兵团在一起时，我也没有智慧。可如今我每天都在学习。三年以后，上校会让我跟马哈布走上大路，追查马匹的血统。也许我会独自去，也许会找到喇嘛，同他一起走。对，等他回到贝拿勒斯，我再做他的弟子，这才最好。"
        - id: ch01-b79
          speaker: narrator
          text: "他的思绪越来越慢，也越来越散。正要沉入美丽的梦乡，一道尖细的低语忽然越过火堆旁单调的喃喃声，钻进耳朵。声音来自包着铁皮的货车后面。"
        - id: ch01-b80
          speaker: assassin_one
          text: "这么说，他不在这里？"
        - id: ch01-b81
          speaker: assassin_two
          text: "他除了在城里花天酒地，还能在哪里？谁会到青蛙池里找耗子？走吧，他不是我们要找的人。"
        - id: ch01-b82
          speaker: assassin_one
          text: "不能让他第二次回到关隘那边去。这是命令。"
        - id: ch01-b83
          speaker: assassin_two
          text: "那就雇个女人给他下药。只要几个卢比，也不留证据。"
        - id: ch01-b84
          speaker: assassin_one
          text: "女人本身就是证据。一定得更稳妥，别忘了他脑袋上的赏钱。"
        - id: ch01-b85
          speaker: assassin_two
          text: "可警察的手伸得很长，这里又离边境太远。要是在白沙瓦就好了！"
        - id: ch01-b86
          speaker: assassin_one
          text: "是啊，白沙瓦。那里到处是他的血亲，到处有藏身的洞，还有女人肯把他藏在裙子后面。白沙瓦和地狱一样，都再适合我们不过。"
        - id: ch01-b87
          speaker: assassin_two
          text: "那计划到底是什么？"
        - id: ch01-b88
          speaker: assassin_one
          text: "蠢货，我不是说过一百遍了吗？等他回来躺下，一枪结果他。货车能挡住追兵。我们只消跑回铁轨那边，谁也看不出枪从哪里打来。至少守到天亮。你算什么苦行僧，才盯一会儿梢就抖起来？"
        - id: ch01-b89
          speaker: narrator
          text: "金紧闭双眼，立刻明白这又是冲着马哈布来的。白种公马的血统果然不能随便卖给少爷，也许马哈布还卖过别的消息。金不知道他住在哪里。马哈布若在天亮前回来，伏击者就会开枪。找警察对马哈布没有好处，勒克瑙的课也没教过金怎样应付这种事。他差点笑出声来，随后拿定主意。先醒来，再离开，不能叫那两个人起疑。噩梦正好能把人惊醒。"
        - id: ch01-b90
          speaker: narrator
          text: "金猛地掀开蒙脸的毯子，直起身，发出亚洲人从噩梦中惊醒时那种可怕而毫无意义的号叫。"
        - id: ch01-b91
          speaker: kim
          text: "呜儿——呜儿——呜儿——呜儿！呀——啦啦啦啦！纳拉扬！产鬼！产鬼！"
        - id: ch01-b92
          speaker: narrator
          text: "产鬼是一种格外凶恶的女鬼，由死于分娩的女人变成。她专在荒僻无人的道路上游荡，两只脚从脚踝处倒转向后，还会把遇见的男人引到别处，让他们受尽折磨。金颤抖的号叫越来越响，最后猛地跳起来，装作睡眼惺忪，踉踉跄跄地离开。营里的人全被吵醒，纷纷冲他咒骂。"
        - id: ch01-b93
          speaker: narrator
          text: "他沿铁路线往前走了二十码左右，再次躺下，还故意翻来覆去地重新裹好毯子，发出一阵哼哼呻吟，务必叫货车后的两个人听得清楚。这样又等了几分钟，他才一点点滚向道路，悄悄钻进浓黑的夜色。金沿路飞快趟着脚，直到一座涵洞前才伏下身来。他躲在石头后面，下巴正好与盖顶石齐平。这里能把夜间来往的一切尽收眼底，自己却不会给人发现。"
        - id: ch01-b94
          speaker: narrator
          text: "两三辆大车叮叮当当地驶向郊外。一个警察咳嗽着走过，还有一两个匆匆赶路的人，一路唱歌驱赶恶灵。随后，马蹄铁嗒嗒敲响路面。那匹马一见涵洞上冒出的小脑袋，惊得闪到一边。金听出这更像马哈布来了。"
        - id: ch01-b95
          speaker: kim
          text: "喂，马哈布·阿里，当心！"
        - id: ch01-b96
          speaker: narrator
          text: "马哈布猛勒缰绳，马几乎坐到后腿上，随后又被逼到涵洞旁。"
        - id: ch01-b97
          speaker: mahbub
          text: "夜里办事，我再也不骑钉掌的马了。城里的骨头和钉子，全叫马蹄捡了去。"
        - id: ch01-b98
          speaker: narrator
          text: "他俯身抬起马的前蹄，脑袋离金只剩一英尺。"
        - id: ch01-b99
          speaker: kim
          text: "低下去，别抬头。黑夜里到处是眼睛。有两个人躲在运马货车后面等你。等你回来躺下，他们就开枪，因为你脑袋上有赏钱。我睡在马旁边时听见的。"
        - id: ch01-b100
          speaker: mahbub
          text: "你看见他们了吗？……站好，魔鬼之父！"
        - id: ch01-b101
          speaker: narrator
          text: "最后一句是马哈布冲着坐骑怒喝的。"
        - id: ch01-b102
          speaker: kim
          text: "我没看见他们。"
        - id: ch01-b103
          speaker: mahbub
          text: "其中一个是不是打扮得像苦行僧？"
        - id: ch01-b104
          speaker: kim
          text: "一个人问另一个，他算什么苦行僧，才盯一会儿梢就抖起来。"
        - id: ch01-b105
          speaker: mahbub
          text: "很好。回营地躺下吧。我今晚死不了。"
        - id: ch01-b106
          speaker: narrator
          text: "马哈布拨转马头，消失在夜里。金顺着沟渠飞奔回去，到了第二次歇脚处正对面，便像黄鼠狼一样溜过道路，重新蜷进毯子。马哈布已经知道，口气也像早料到会有这回事。金满意地想，那两个人今晚恐怕捞不到好处。"
        - id: ch01-b107
          speaker: narrator
          text: "一个钟头过去。金虽然诚心想彻夜清醒，却还是沉沉睡去。夜车不时从不到二十英尺外轰鸣而过，他像所有东方人一样，对纯粹的噪声毫不在意，那声音连一丝影子也没织进梦里。"
        - id: ch01-b108
          speaker: narrator
          text: "马哈布可一点睡意也没有。外族人同他偶然有过的风流韵事毫无牵连，却追着要他的命，这叫他恼火至极。他最先冒出的念头，也是最合本性的念头，就是从更远处越过铁路线，再绕回来，从背后逮住那两位好心人，当场宰掉。可他一想，又觉得遗憾。这里另一支政府机关同克赖顿上校完全没有关系，兴许会逼他作出难以交代的解释。边境以南不过多出一两具尸体，人们也会小题大做，闹得荒唐透顶。他自从派金送信去安巴拉，便没再受过这等滋扰，还以为疑心早已引去了别处。"
        - id: ch01-b109
          speaker: narrator
          text: "忽然，一个绝妙的主意闪进他脑海。"
        - id: ch01-b110
          speaker: mahbub
          text: "英国人永远说真话，所以我们本地人永远给他们当成傻瓜。凭安拉起誓，我要对一个英国人说真话！可怜的喀布尔人若连货车里的马都遭人偷走，政府的警察还有什么用？这简直和白沙瓦一样糟。我该去车站报案，最好找铁路上的年轻少爷。他们热心得很，捉住盗贼，功劳还能记在自己名下。"
        - id: ch01-b111
          speaker: narrator
          text: "马哈布把马拴在车站外，大步走上站台。一个年轻的助理区段运输监督正等车南下。他身材高大，淡黄头发，满脑子都是马，穿着一套脏兮兮的白麻布衣服。"
        - id: ch01-b112
          speaker: railway_official
          text: "喂，马哈布·阿里！你来这里做什么？又在卖驽马吗？"
        - id: ch01-b113
          speaker: mahbub
          text: "不，我不是为马操心。我来找卢图夫·乌拉。上面有我一货车的马。有人能瞒着铁路把它们牵走吗？"
        - id: ch01-b114
          speaker: railway_official
          text: "我看不能。真给牵走了，你可以找我们索赔。"
        - id: ch01-b115
          speaker: mahbub
          text: "我看见两个人在一节货车轮子底下蹲了差不多一整夜。苦行僧不偷马，我便没再理会。我只是来找合伙人卢图夫·乌拉。"
        - id: ch01-b116
          speaker: railway_official
          text: "见鬼，你真看见了，居然一点没放在心上？遇到我，你还真算走运。他们什么模样？"
        - id: ch01-b117
          speaker: mahbub
          text: "不过是苦行僧。顶多从某节货车里拿一点粮食。线路上这样的人很多，国家少了那点布施也不知道。我是来找卢图夫·乌拉的。"
        - id: ch01-b118
          speaker: railway_official
          text: "先别管你的合伙人。运马货车在哪里？"
        - id: ch01-b119
          speaker: mahbub
          text: "就在最远处那个给火车制灯的地方近前。"
        - id: ch01-b120
          speaker: railway_official
          text: "你是说信号房，对吧？"
        - id: ch01-b121
          speaker: mahbub
          text: "从这里往线路那头看，在右手边最靠近道路的铁轨上。不过说到卢图夫·乌拉，他是个高个子，断鼻梁，还带着一条波斯猎犬——哎！"
        - id: ch01-b122
          speaker: narrator
          text: "年轻人已经匆匆离开，去叫醒一个同样年轻而热心的警察。铁路货场近来屡遭偷盗，他可不肯错过机会。马哈布把笑声藏进染红的胡须。"
        - id: ch01-b123
          speaker: mahbub
          text: "他们会穿着靴子一路咚咚作响，到了那里再奇怪苦行僧怎么不见了。他们可真聪明，巴顿少爷和那位年轻少爷。"
        - id: ch01-b124
          speaker: narrator
          text: "他闲等了几分钟，想看他们全副武装地沿铁路线赶去。一辆轻型机车悄然滑过车站，他瞥见年轻的巴顿坐在驾驶室里。"
        - id: ch01-b125
          speaker: mahbub
          text: "我错怪那孩子了。他还不算十足的傻瓜。坐一辆火车头去捉贼，这玩法倒新鲜！"
        - id: ch01-b126
          speaker: narrator
          text: "黎明时分，马哈布回到营地。谁也不觉得夜里的消息值得告诉他，仿佛那场打斗根本不值一提。只有一个人例外，那就是刚刚升到这位大人物手下的小马童。马哈布把金叫进自己那顶小帐篷，叫他帮忙收拾行装。金俯在鞍袋上，一面动手，一面压低声音。"
        - id: ch01-b127
          speaker: kim
          text: "我全知道了。两位少爷坐火车头过来。车头缓缓前后挪动，我就在货车这一边的黑暗里来回跑。他们扑向车底下的两个人，把他们打倒。朝觐者，这块烟草怎么办？用纸包好，塞到盐袋下面？好。可其中一个人拿苦行僧的羚羊角刺了一位少爷，血流了出来。另一位少爷先把自己那边的人打昏，又捡起滚落的短枪，猛击那个刺人的家伙。他们全都像疯了一样厮打。"
        - id: ch01-b128
          speaker: narrator
          text: "那种羚羊角由两只黑羚羊角接在一起，是苦行僧唯一的俗世武器。马哈布带着天意般安然的神情笑了。"
        - id: ch01-b129
          speaker: mahbub
          text: "不！这与其说是迪瓦尼，疯狂或民事案件，不如说是尼扎马特，一桩刑事案。你说有枪？那就是好端端十年牢狱。"
        - id: ch01-b130
          speaker: kim
          text: "后来他们两个都躺着不动。给抬上火车头时，我看他们差不多快死了，脑袋还这样晃。铁轨上有许多血。要不要去看看？"
        - id: ch01-b131
          speaker: mahbub
          text: "血我从前见过。牢狱是他们稳稳当当的归宿。他们一定会报假名，也一定很久都不会有人找到。他们是我的仇家。你我的命运像拴在一根绳上。这故事若讲给珍珠医师，不知道会怎样！快收拾鞍袋和做饭的盘子。我们把马卸下来，动身去西姆拉。"
        - id: ch01-b132
          speaker: narrator
          text: "营地很快便拆了，当然是东方人所理解的快。众人解释一大堆，骂声和空话响个不停，做事漫不经心，又为忘掉的上百样小东西一次次停下、回头查找。这支乱糟糟的队伍终于在雨后清新的黎明里动身，赶着六匹身子僵硬、焦躁不安的马，走上通往卡尔卡的大路。"
        - id: ch01-b133
          speaker: narrator
          text: "凡是想讨好普什图人的，都把金当作马哈布的宠儿，因此没人叫他干活。一行人专挑最轻松的路程慢慢走，每隔几个钟头便在路旁歇脚棚停下。卡尔卡路上来往的少爷很多。照马哈布说，每个年轻少爷都非把自己当成相马行家不可，哪怕欠放债人的钱早已没过头顶，也得摆出架势，假装自己当真要买一匹马。"
        - id: ch01-b134
          speaker: narrator
          text: "所以一个又一个少爷坐着驿车隆隆经过，都会停下来攀谈。有些还从车里下来，伸手摸遍马腿，再问上一串毫无意义的问题。也有人根本不懂本地话，一开口便在无意中把始终不动声色的马贩子狠狠侮辱一番。金在树下替马哈布装烟斗时，马哈布讲起自己刚同少爷们做买卖的年月。那时索迪少爷还是阿巴扎伊堡的长官，还曾为了泄愤，放水淹掉专员的营地。"
        - id: ch01-b135
          speaker: mahbub
          text: "那时我还不知道他们能蠢到什么地步，所以一听见这种话就要发怒。比如有这么一回，一个少爷无意间把一句话说错了。"
        - id: ch01-b136
          speaker: narrator
          text: "他把那次误会从头到尾讲给金听。那人本来全无恶意，只因不知道意思，偏偏把一句话用错了地方，逗得金弯下腰来大笑。马哈布等他笑过，才慢慢吐出一口烟雾。"
        - id: ch01-b137
          speaker: mahbub
          text: "现在我明白了，他们跟所有人一样，有些事聪明，有些事蠢得很。对陌生人说错词，实在太愚蠢。就算自己心里没有恶意，陌生人怎么会知道？他更可能拔出匕首来查清真相。"
        - id: ch01-b138
          speaker: kim
          text: "不错，说得很对。比如女人刚生完孩子，傻瓜却在她面前提猫。我就听见过。"
        - id: ch01-b139
          speaker: mahbub
          text: "所以像你这种处境的人，对两副面孔尤其要记住这件事。身在少爷们中间，永远别忘了自己是少爷。身在印度百姓中间，又得记住自己究竟是什么。"
        - id: ch01-b140
          speaker: narrator
          text: "马哈布困惑地笑了笑，没有说完。"
        - id: ch01-b141
          speaker: kim
          text: "我是什么？穆斯林、印度教徒、耆那教徒，还是佛教徒？这可是个难解的结。"
        - id: ch01-b142
          speaker: mahbub
          text: "毫无疑问，你是个不信教的人，所以注定要下地狱。我的教法这样说，至少我想是这样。不过你也是我的世界小友，我爱你。我的心这样说。各种信仰就像各种马，聪明人知道马都是好东西，每一种都有利可图。"
        - id: ch01-b143
          speaker: mahbub
          text: "至于我，若不是虔诚的逊尼派，又恨透提拉人，我简直愿意相信所有信仰也都如此。一匹卡提阿瓦母马离开出生的沙地，到了孟加拉西部，便会坏掉蹄子。巴尔赫种公马虽好，要不是肩膀太沉，世上也没有更好的马，可到了北方大荒漠，仍比不上雪地骆驼。所以我心里说，信仰同马一样，各自在自己的土地上都有长处。"
        - id: ch01-b144
          speaker: kim
          text: "可我的喇嘛说的完全不同。"
        - id: ch01-b145
          speaker: mahbub
          text: "他只是个从菩提亚来的老梦痴。世界之友，你竟这样看重一个默默无闻的人，我心里多少有些不快。"
        - id: ch01-b146
          speaker: kim
          text: "不错，朝觐者。可我确实看见了他的高贵，我的心也被他牵着。"
        - id: ch01-b147
          speaker: mahbub
          text: "听说他的心也被你牵着。人心如马，不管嚼子还是马刺，都拦不住它说来便来，说走便走。喊那边的古尔·谢尔·汗，把枣红种马的拴桩打牢。我们可不想每到一处都看马打一架，那匹黄褐色的和黑色的转眼就会咬在一起……现在听着。你非见到那位喇嘛，心里才安稳吗？"
        - id: ch01-b148
          speaker: kim
          text: "这是约定的一部分。若见不到他，他又给人从我身边夺走，我便离开勒克瑙的学校。然后，然后——我一旦走了，谁还能找到我？"
        - id: ch01-b149
          speaker: mahbub
          text: "不错。从来没有哪匹小马只用这么松的后脚绳就能拴住。"
        - id: ch01-b150
          speaker: kim
          text: "别害怕。我的喇嘛说过，他会到学校来看我。"
        - id: ch01-b151
          speaker: mahbub
          text: "一个端着钵的乞丐，怎么能站在那些年轻少爷面前？"
        - id: ch01-b152
          speaker: kim
          text: "才不是全都如此！他们许多人的眼睛给低种姓的血染蓝了，指甲也给染黑了。清粪女人的儿子，扫街人的连襟。"
        - id: ch01-b153
          speaker: narrator
          text: "那串家世不必再听下去。金嚼着一截甘蔗，不温不火，却把自己的意思说得再明白不过。马哈布把烟斗递给他清理。"
        - id: ch01-b154
          speaker: mahbub
          text: "世界之友，我见过许多男人、女人和孩子，也见过不少少爷。这辈子从没见过你这样的小魔头。"
        - id: ch01-b155
          speaker: kim
          text: "为什么？我不是一向对你说真话吗？"
        - id: ch01-b156
          speaker: mahbub
          text: "也许正因为如此。这个世界对诚实人可危险得很。"
        - id: ch01-b157
          speaker: narrator
          text: "马哈布撑起身，束好腰带，朝马群走去。"
        - id: ch01-b158
          speaker: kim
          text: "还是把真话卖掉？"
        - id: ch01-b159
          speaker: narrator
          text: "那口气叫马哈布停下脚步，回过头来。"
        - id: ch01-b160
          speaker: mahbub
          text: "又有什么新的鬼花样？"
        - id: ch01-b161
          speaker: kim
          text: "八安那，我就告诉你。这关系到你的安宁。"
        - id: ch01-b162
          speaker: mahbub
          text: "你真是个撒旦！"
        - id: ch01-b163
          speaker: narrator
          text: "马哈布还是把钱给了他。"
        - id: ch01-b164
          speaker: kim
          text: "还记得安巴拉那边，黑夜里几个盗贼的小事吗？"
        - id: ch01-b165
          speaker: mahbub
          text: "他们既然想要我的命，我还没有忘得一干二净。怎么？"
        - id: ch01-b166
          speaker: kim
          text: "还记得克什米尔客店吗？"
        - id: ch01-b167
          speaker: mahbub
          text: "我马上就要拧你的耳朵了，少爷。"
        - id: ch01-b168
          speaker: kim
          text: "不必，普什图人。那个被少爷们打昏的第二个苦行僧，正是在拉合尔搜过你隔间的人。他们把他架上火车头时，我看见了他的脸。一点不错，就是他。"
        - id: ch01-b169
          speaker: mahbub
          text: "为什么不早说？"
        - id: ch01-b170
          speaker: kim
          text: "他会进监牢，安稳待上几年。每次说话，没必要说得比当时所需更多。再说，那时我又不需要钱买甜食。"
        - id: ch01-b171
          speaker: mahbub
          text: "安拉仁慈！哪天兴致来了，你会不会为了几块甜食把我的脑袋也卖掉？"
        - id: ch01-b172
          speaker: narrator
          text: "金一辈子都会记得那段漫长又悠闲的路程。他们从安巴拉出发，经过卡尔卡和附近的平焦尔花园，一路向山上的西姆拉走去。格格尔河忽然暴涨，急流冲走了一匹马，当然偏偏是最值钱的那匹。金也落进了在水中翻滚跳跃的岩石之间，差一点便给淹死。"
        - id: ch01-b173
          speaker: narrator
          text: "再往上走，政府的一头大象惊散了马群。马儿吃青草吃得膘肥体壮，众人足足花了一天半才重新聚齐。随后，他们遇见西坎达尔·汗赶着几匹卖不掉的劣马下山，那是他整群马里挑剩的货色。马哈布一根小指头里的相马本领，比那个人所有帐篷里加起来的还多，却偏要买下其中最差的两匹。这笔买卖耗去八个钟头的艰苦周旋，还有数也数不清的烟草。"
        - id: ch01-b174
          speaker: narrator
          text: "可这一切对金来说全是纯粹的欢乐。那条四处游荡的大路，顺着越来越高的山脚一会儿爬升，一会儿下落，又在山间兜转。清晨的红光长长铺在远方积雪上，枝杈横生的仙人掌一层又一层爬满石坡。上千道水渠各自发出声响，猴子吱喳不休。庄严的喜马拉雅雪松一棵接一棵向上伸展，枝条沉沉低垂，而辽阔的平原就在他们脚下远远铺开。"
        - id: ch01-b175
          speaker: narrator
          text: "驿车转过山路的弯道，号角不停铮铮响起，牵行的马匹便受惊狂奔。他们也一路停下来祷告。不赶时间时，马哈布对干洗净礼和高声祈祷格外虔诚。夜里到了歇脚处，骆驼和公牛庄重地并排反刍，木讷的赶车人围坐在旁，讲起大路上刚刚传来的消息。所有这些，都让金心里的歌声飞扬。"
        - id: ch01-b176
          speaker: mahbub
          text: "不过歌唱完了，舞跳完了，接下来便轮到上校少爷。那滋味可没这么甜。"
        - id: ch01-b177
          speaker: kim
          text: "印度是一片好土地，一片最美丽的土地，五河之地又是其中最美的。马哈布·阿里或上校若敢对我动手动脚，我就重新走进这片土地。一旦走了，谁能找到我？看，朝觐者，那边就是西姆拉城吗？安拉啊，好一座城！"
        - id: ch01-b178
          speaker: mahbub
          text: "我父亲的兄弟还记得，这里只有两栋房子的年月。他在白沙瓦的麦克森少爷那口井还是新的时候，就已经老了。"
        - id: ch01-b179
          speaker: narrator
          text: "马哈布赶着马离开上方的大路，进入下西姆拉集市。那地方像一座拥挤的兔子窝，从谷底一路爬向高处的市政厅，坡度足有四十五度。真正熟悉这里道路的人，足以公然蔑视这座印度夏都的所有警察。因为这里的通道安排得巧妙极了，一座阳台暗通另一座阳台，一条巷子接着另一条巷子，一个藏身洞又连着下一个藏身洞。"
        - id: ch01-b180
          speaker: narrator
          text: "住在这里的，都是为欢乐之城的种种欲望效力的人。有夜里替漂亮太太拉人力车、到了白天仍一直赌到天亮的轿夫，也有杂货商、油贩、古玩商、柴薪商、祭司、扒手和政府雇用的本地职员。人们以为印度事务委员会的机密最深不可测，妓女们却能在这里公开把它们当成谈资。一半土邦王公手下那些再不起眼不过、层级低了又低的密探，也都聚在这里，听取和交换各处的消息。"
        - id: ch01-b181
          speaker: narrator
          text: "马哈布也住在这里。他在一个穆斯林牲口贩子的房子里租了间屋，屋门锁得远比他在拉合尔客店的隔间严实。这地方同样会创造奇迹。黄昏时，走进去的明明是一个穆斯林马童。一小时以后，从同一扇门里走出来的却成了一个欧亚混血少年，身上穿着从铺子里买来、并不合身的成衣。勒克瑙姑娘用的染料果然是一流的。"
        - id: ch01-b182
          speaker: mahbub
          text: "我同克赖顿少爷谈过了。友谊之手第二次替你挡开灾祸之鞭。他说你在大路上白白耗掉整整六十天，如今再送你去山地学校已经太迟。"
        - id: ch01-b183
          speaker: kim
          text: "我说过，假期归我自己。我不会把学校再上一遍。这是约定的一部分。"
        - id: ch01-b184
          speaker: mahbub
          text: "上校少爷还不知道有这份约定。你要住在勒根少爷家里，直到该回勒克瑙的时候。"
        - id: ch01-b185
          speaker: kim
          text: "我宁愿跟你住，马哈布。"
        - id: ch01-b186
          speaker: mahbub
          text: "你不懂这是多大的荣幸。勒根少爷亲自点名要你去。你沿山往上走，再顺山顶的路走。到了那里，得暂时忘掉你见过我，也忘掉同我说过话。我是给克赖顿少爷卖马的马哈布·阿里，而你不认识克赖顿少爷。记住这道命令。"
        - id: ch01-b187
          speaker: narrator
          text: "金点点头，刚要追问，便撞上马哈布利剑般锐利的目光。"
        - id: ch01-b188
          speaker: kim
          text: "好吧。勒根少爷是谁？不，我的确从没听过这个名字。他莫非也是我们的人？"
        - id: ch01-b189
          speaker: narrator
          text: "最后一句，金压低了嗓音。马哈布却换上了对欧洲人说话的口气。"
        - id: ch01-b190
          speaker: mahbub
          text: "什么叫我们，少爷？我是普什图人，你是少爷，也是少爷的儿子。勒根少爷在欧洲人的铺子中间开店，全西姆拉都知道。去那里一问便是。世界之友，他这个人，哪怕睫毛只眨一下，你也得服从到底。人们说他会魔法，不过那与你不相干。上山去问吧。大游戏从这里开始。"
