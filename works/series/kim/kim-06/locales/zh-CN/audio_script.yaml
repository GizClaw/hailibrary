audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts: {delivery: "从容而机敏的讲述", timbre: "温暖清晰", pace: "舒展而有变化", pitch: "中音"}
    kim:
      display_name: 金
      tts: {delivery: "机灵大胆，话里常带笑", timbre: "明亮的少年声", pace: "轻快敏捷", pitch: "中高音"}
    bennett:
      display_name: 贝内特牧师
      tts: {delivery: "严厉拘谨，话语果断", timbre: "清瘦坚硬", pace: "稍快", pitch: "中音"}
    victor:
      display_name: 维克托神父
      tts: {delivery: "爽直机敏，惊叹时仍带温厚", timbre: "圆润厚实", pace: "从容", pitch: "中低音"}
    colonel:
      display_name: 上校
      tts: {delivery: "威严中带着疲倦的幽默", timbre: "沉稳浑厚", pace: "平稳", pitch: "低音"}
    soldiers_wife:
      display_name: 士兵妻子
      tts: {delivery: "粗声而迷信，问话急切", timbre: "厚重沙哑", pace: "稍快", pitch: "中低音"}
    schoolmaster:
      display_name: 校长
      tts: {delivery: "暴躁专横，训斥生硬", timbre: "干硬低沉", pace: "急促", pitch: "中低音"}
    drummer_boy:
      display_name: 鼓手少年
      tts: {delivery: "尖刻自大，满口抱怨", timbre: "尖细的少年声", pace: "急快", pitch: "高音"}
    sweeper:
      display_name: 清道夫
      tts: {delivery: "畏缩而市侩，说话吞吐", timbre: "粗哑单薄", pace: "稍快", pitch: "中音"}
    scribe:
      display_name: 代书人
      tts: {delivery: "精明谨慎，处处盘算", timbre: "清薄利落", pace: "平稳", pitch: "中音"}
    mahbub:
      display_name: 马哈布·阿里
      tts: {delivery: "老练深沉，幽默里藏着试探", timbre: "粗厚低沉", pace: "从容", pitch: "低音"}
    creighton:
      display_name: 克赖顿上校
      tts: {delivery: "彬彬有礼，观察敏锐，偶带干练的玩笑", timbre: "清朗沉稳", pace: "平稳", pitch: "中低音"}
  chapters:
    - id: ch01
      title: 第六章
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: "《迭戈·瓦尔德斯之歌》唱起旧日同伴。昔日的玩伴如今漂泊新海，他们曾在蛮荒人中做雌黄买卖。向南走过万里海程，三十年也过去了。他们不认得高贵的瓦尔德斯，却认得我，也爱我。"
        - id: ch01-b02
          speaker: narrator
          text: "天才蒙蒙亮，一顶顶白帐篷已经拆掉，转眼全不见了。独行侠团从岔路开往安巴拉，没有经过昨夜歇脚的地方。金跟着一辆辎重车步行，士兵的妻子们一路对他评头论足。他再没有昨夜那么笃定，因为维克托神父和贝内特先生一左一右，把他看得很紧。"
        - id: ch01-b03
          speaker: narrator
          text: "上午，队伍停下来。一名骑骆驼的传令兵把信交给上校。上校读完，同一位少校说了几句话。金落在队伍后面半英里远，忽然听见沙哑又欢喜的喧嚷穿过浓尘，朝他滚来。有人重重拍他的背，逼问他怎么会事先知道，还叫神父设法让这个小魔崽子开口。随后，一匹小马靠近，有人提起金，把他放到神父鞍桥前。"
        - id: ch01-b04
          speaker: victor
          text: "听着，孩子，你昨晚的预言成真了。命令已经到了。明天我们在安巴拉登上火车，开赴前线。"
        - id: ch01-b05
          speaker: kim
          text: "前线是什么？登上火车又是什么意思？"
        - id: ch01-b06
          speaker: victor
          text: "我们要去打仗，就是你昨晚说的那场战争。"
        - id: ch01-b07
          speaker: kim
          text: "你们本来就要去打那场战争。我昨晚已经告诉你们了。"
        - id: ch01-b08
          speaker: victor
          text: "你是说过。可是黑暗势力在上，你到底怎么知道的？"
        - id: ch01-b09
          speaker: narrator
          text: "金眼睛发亮，紧闭嘴唇，只点了点头，脸上明摆着一副天机不能泄露的样子。神父带着他继续穿过尘土。列兵、中士和尉官一个个叫同伴来看这个孩子，连走在队首的上校也好奇地盯着他。"
        - id: ch01-b10
          speaker: colonel
          text: "多半是他在集市听来的。可即便如此……见鬼，这件事分明才决定了不到四十八小时。"
        - id: ch01-b11
          speaker: victor
          text: "印度还有很多你这样的人吗？还是你天生就是个小怪物？"
        - id: ch01-b12
          speaker: kim
          text: "我已经把事情告诉你了。现在肯让我回老人身边吗？他要是没留在那个库卢女人那里，我怕他会死。"
        - id: ch01-b13
          speaker: victor
          text: "我看他照顾自己不比你差。你不能走。你给我们带来了好运，我们要把你培养成男子汉。现在先回辎重车旁，今晚再来见我。"
        - id: ch01-b14
          speaker: narrator
          text: "这一天剩下的时间里，几百名白人都对金刮目相看。他怎样来到营地，身世怎样被查明，又怎样作了预言，人人反复讲，故事也越讲越精彩。一个身材庞大、模样邋遢的白女人坐在铺盖上，神秘地问金，她丈夫能不能从战场回来。"
        - id: ch01-b15
          speaker: soldiers_wife
          text: "你替我看看吧。他这次上战场，还能平安回来吗？"
        - id: ch01-b16
          speaker: narrator
          text: "金郑重想了想，说她丈夫能回来。女人便给了他食物。庞大的队伍不时奏起乐曲，众人说笑着赶路，处处都像拉合尔城的节庆。眼下还没有什么苦差事，金决定赏脸留下，看看热闹。"
        - id: ch01-b17
          speaker: narrator
          text: "傍晚，几支乐队从城里出来迎接，吹吹打打地领着独行侠团来到安巴拉火车站附近的营地。那一夜很有意思，也十分热闹。别团的士兵跑来拜访独行侠团，独行侠团的人也自行出门，溜去拜访别团。兵团的警戒队急忙赶出去抓自己人，走到半路，又碰上别团为了同样的事派来的警戒队。没过多久，号角疯狂吹响，催来更多警戒队，军官们也跟着赶来收拾乱局。独行侠团一向以活跃出名，这一夜当然没有辜负自己的名声。"
        - id: ch01-b18
          speaker: narrator
          text: "第二天早上，尽管经过昨夜那番胡闹，他们照样穿戴得最齐整，精神十足地在站台列队。火车开走时，金同病号、女人和孩子一起留在后面。他望着兵团远去，自己竟也激动起来，跟着众人高声送别。到这时为止，做个少爷还很有趣，不过金仍旧处处小心。他愿意看这些新鲜事，却不肯把整颗心交出去。"
        - id: ch01-b19
          speaker: narrator
          text: "一个鼓手少年看着金，把他带回空荡荡、刷得雪白的营房。地板上散着破布、绳头和纸屑，屋顶把他孤单的脚步声送了回来。金照本地人的习惯，在一张剥得精光的行军床上蜷起身，很快睡着。一个怒气冲冲的男人重步走过走廊，把他叫醒，说自己是校长。只听这一句，金便立刻缩回自己的壳里。"
        - id: ch01-b20
          speaker: narrator
          text: "在拉合尔，金只勉强认得英文警察告示，因为那关系到他的日子好不好过。照料他的女人有过许多客人，其中一个古怪的德国人替帕西巡回剧团画布景。他说自己在四八年上过街垒，便用教金写字来抵饭钱。金挨着拳脚学会了一个个字母，却从没觉得它们有什么用。"
        - id: ch01-b21
          speaker: kim
          text: "我什么都不知道。你走开！"
        - id: ch01-b22
          speaker: narrator
          text: "金闻到了祸事的味道。校长揪住他的耳朵，把他拖到远处一侧营房。十来个鼓手少年坐在长凳上。校长说，他既然什么都不会，至少该安静。这个要求，金完成得再好不过。"
        - id: ch01-b23
          speaker: schoolmaster
          text: "坐好。不会就别出声，也不许捣乱。"
        - id: ch01-b24
          speaker: narrator
          text: "校长用白粉笔在黑板上画来画去，足足讲了半个钟头。金完全不知道他讲的是什么，索性接着睡方才没睡完的觉。他很不满意，因为自己短短一生有三分之二的时间，躲的正是学校和这套管教。忽然，一个绝妙的主意跳进脑中，他不明白自己怎么没早些想到。"
        - id: ch01-b25
          speaker: narrator
          text: "校长一放人，金第一个穿过走廊，蹿进明亮的阳光。身后立刻响起一个尖嗓子。"
        - id: ch01-b26
          speaker: drummer_boy
          text: "喂，站住！不许跑！命令说你不能离开我的视线。你想去哪儿？"
        - id: ch01-b27
          speaker: narrator
          text: "说话的正是整个上午都在他身边晃荡的鼓手少年。那家伙大约十四岁，肥胖，满脸雀斑。金从他的靴底一直厌恶到帽带。"
        - id: ch01-b28
          speaker: kim
          text: "我去集市买糖，买给你吃。"
        - id: ch01-b29
          speaker: drummer_boy
          text: "不能去集市。去了准挨训。回来！"
        - id: ch01-b30
          speaker: kim
          text: "那我最多可以走到哪儿？"
        - id: ch01-b31
          speaker: narrator
          text: "金并不明白，所谓不能去的界线究竟在哪里，不过他暂时还肯客气。"
        - id: ch01-b32
          speaker: drummer_boy
          text: "你是问能走多远吧？最多到路边那棵树。"
        - id: ch01-b33
          speaker: kim
          text: "好，我就去那棵树。"
        - id: ch01-b34
          speaker: drummer_boy
          text: "随你。我不去，天太热，从这里就看得见你。你逃也没用。这身兵团衣服太显眼，安巴拉随便哪支警戒队都能把你赶回来。"
        - id: ch01-b35
          speaker: narrator
          text: "鼓手少年的威胁并没有真吓住金。让他泄气的是，他很清楚，自己若穿着这身衣服逃跑，不但一眼就会被认出来，没走多远也会累垮。他没精打采地走到树下。树长在光秃秃的路角，那条路一直通往集市。金站在那里打量来来往往的本地人，他们大多是营房里最低种姓的仆役。他叫住一个清道夫。那人理所当然地以为这个欧洲男孩听不懂本地话，立刻回了一句毫无必要的恶话。金压低声音，飞快地回骂一句，马上叫他明白自己错得多么厉害。"
        - id: ch01-b36
          speaker: narrator
          text: "终于又能用最熟悉的话痛骂别人，金快意极了，仿佛受束缚的魂魄全从嘴里冲了出来。"
        - id: ch01-b37
          speaker: kim
          text: "现在去集市，找最近的代书人来。我得写一封信。"
        - id: ch01-b38
          speaker: sweeper
          text: "可你到底是哪一种白人家的儿子？怎么会找集市里的代书人？营房里不是有校长吗？"
        - id: ch01-b39
          speaker: kim
          text: "有啊，地狱里也全是那种人。照我说的办，你这个奥德！你娘是在篮子底下成的亲！拉尔·贝格的仆人！快去，不然我还要接着跟你谈。"
        - id: ch01-b40
          speaker: narrator
          text: "金知道清道夫信哪一位神。那人赶紧拖着脚走了。他碰到集市里的第一个代书人，便结结巴巴地报信。"
        - id: ch01-b41
          speaker: sweeper
          text: "营房旁边有个白人男孩，在树下等你。可他不是白人男孩。他要找你。"
        - id: ch01-b42
          speaker: scribe
          text: "他肯付钱吗？"
        - id: ch01-b43
          speaker: sweeper
          text: "我不知道。他跟别的孩子不同。你去看看吧，值得一看。"
        - id: ch01-b44
          speaker: narrator
          text: "衣着利落的代书人收好书写板、笔和封蜡，跟着来了。金等得直跳脚。那个瘦削年轻的迦耶特人刚走到听得见的地方，金便滔滔不绝地骂起来。"
        - id: ch01-b45
          speaker: scribe
          text: "先付钱。你骂得越多，价钱越高。不过你穿成这样，怎么会用这种口气说话？你究竟是谁？"
        - id: ch01-b46
          speaker: kim
          text: "啊哈，这正是信里要写的。从没有过这样的故事。可我不着急，换个人也行。安巴拉的代书人，跟拉合尔一样多。"
        - id: ch01-b47
          speaker: scribe
          text: "四安那。"
        - id: ch01-b48
          speaker: narrator
          text: "代书人在一座废弃营房侧翼的阴影里坐下，铺开布巾。金不由自主地蹲到他旁边，蹲得只有本地人才蹲得出来，虽然那条可恶的紧身长裤十分碍事。代书人斜眼打量他。"
        - id: ch01-b49
          speaker: kim
          text: "四安那是向少爷开的价。现在给我个实在价。"
        - id: ch01-b50
          speaker: scribe
          text: "一安那半。可是信写完以后，我怎么知道你不会跑？"
        - id: ch01-b51
          speaker: kim
          text: "我不能走过这棵树。价钱里还得算上邮票。"
        - id: ch01-b52
          speaker: scribe
          text: "邮票钱我可拿不到佣金。再问一次，你是哪一种白人男孩？"
        - id: ch01-b53
          speaker: kim
          text: "写信时你就知道了。收信人是马贩子马哈布·阿里，住在拉合尔的克什米尔客栈。他是我的朋友。"
        - id: ch01-b54
          speaker: scribe
          text: "真是一件奇事接着一件！信用印地语写吗？"
        - id: ch01-b55
          speaker: kim
          text: "当然。写给马哈布·阿里。开头这样写。我陪老人坐火车到安巴拉，在那里送去了枣红母马的血统消息。"
        - id: ch01-b56
          speaker: narrator
          text: "金见过花园里的情形，绝不会在信里写白种公马。"
        - id: ch01-b57
          speaker: scribe
          text: "慢一点。枣红母马跟这件事有什么关系？你说的，真是那个大马商马哈布·阿里？"
        - id: ch01-b58
          speaker: kim
          text: "不然还能是谁？我替他办过事。多蘸些墨。接着写。我照吩咐办好了，随后和老人步行去贝拿勒斯，第三天却碰上一个兵团。写下了吗？"
        - id: ch01-b59
          speaker: scribe
          text: "写了。一个兵团。"
        - id: ch01-b60
          speaker: narrator
          text: "代书人的两只耳朵全竖了起来。"
        - id: ch01-b61
          speaker: kim
          text: "再写。我进了他们的营地，结果叫人抓住。他们看了我颈上的护身符，就是你知道的那件东西，查出我是兵团里一个人的儿子。这正应了红公牛的预言。你也知道，集市里人人都讲过它。"
        - id: ch01-b62
          speaker: narrator
          text: "金停下来，让这支箭好好扎进代书人的心，随后清清嗓子，继续口述。"
        - id: ch01-b63
          speaker: kim
          text: "一个祭司给我穿上衣服，又给我一个新名字，不过其中一个祭司是傻瓜。这身衣服很沉，我是少爷，我的心也很沉。他们把我送进学校，还打我。我不喜欢这里的空气和水。马哈布·阿里，来帮我吧。不然就寄些钱来，因为我付不起替我写信的人。"
        - id: ch01-b64
          speaker: scribe
          text: "还要写替你写信的人？是我自己上了当。你聪明得像那个在勒克瑙伪造国库印花的侯赛因·布克斯。可是这个故事，难道真有几分是真的？"
        - id: ch01-b65
          speaker: kim
          text: "对马哈布·阿里撒谎没有好处。借张邮票给他的朋友，倒能做件好事。钱来了，我会还你。"
        - id: ch01-b66
          speaker: narrator
          text: "代书人将信将疑地哼了一声，还是从书写板里拿出邮票，封好信交给金。在安巴拉，马哈布·阿里这个名字很有分量。"
        - id: ch01-b67
          speaker: kim
          text: "这样做，诸神会在你的账上记下一笔好处！"
        - id: ch01-b68
          speaker: scribe
          text: "钱到了，你得加倍付我！"
        - id: ch01-b69
          speaker: drummer_boy
          text: "你刚才跟那个黑鬼嘀咕什么？我一直盯着你呢。"
        - id: ch01-b70
          speaker: kim
          text: "没什么，只是说了几句话。"
        - id: ch01-b71
          speaker: drummer_boy
          text: "你也会像黑鬼那样说话，是不是？"
        - id: ch01-b72
          speaker: kim
          text: "不，不，我只会一点点。现在我们做什么？"
        - id: ch01-b73
          speaker: drummer_boy
          text: "再过半分钟，号角就叫吃饭了。真希望我也跟兵团上前线。留在这鬼地方，除了上课什么也不干，烦死人。你也讨厌吧？"
        - id: ch01-b74
          speaker: kim
          text: "当然讨厌。"
        - id: ch01-b75
          speaker: drummer_boy
          text: "我要是知道能逃去哪儿，早就跑了。大人都说，在这个该死的印度，我们只是放养的囚犯。一开小差，马上就会被抓回来。我真受够了。"
        - id: ch01-b76
          speaker: kim
          text: "你去过英……英国吗？"
        - id: ch01-b77
          speaker: drummer_boy
          text: "当然去过！上一个换防季，我才跟我妈从那里出来。你这个小笨蛋，什么也不知道。你是在阴沟里长大的吗？"
        - id: ch01-b78
          speaker: kim
          text: "是啊。跟我说说英国吧。我父亲就是从那里来的。"
        - id: ch01-b79
          speaker: narrator
          text: "金嘴上不说，心里半个字也不信。鼓手少年所谓的英国，其实不过是利物浦郊外的一小片地方。不过听他一路胡扯，至少能够捱到午饭。饭菜摆在营房的一角，只供几个孩子和少数病号吃，实在叫人倒胃口。若不是那封求救信已经寄给马哈布·阿里，金简直要彻底沮丧了。他早就习惯本地人群对自己漠不关心。可如今困在白人中间，四周都是陌生的规矩和声音，那份沉重的孤独却一点点啃噬着他。"
        - id: ch01-b80
          speaker: narrator
          text: "下午，一个大个子士兵领金穿过另一片尘土飞扬的操场，到另一侧营房去见维克托神父，金心里十分感激。神父正读着一封紫墨水写成的英文信，看金的眼神比从前更加好奇。"
        - id: ch01-b81
          speaker: victor
          text: "到现在为止，你觉得怎么样，孩子？不大喜欢吧？一只野生的小动物掉进这种地方，一定很难受。听着，你那位朋友给我写来了一封了不得的信。"
        - id: ch01-b82
          speaker: kim
          text: "他在哪里？他还好吗？他既然能给我写信，那就一定没事。"
        - id: ch01-b83
          speaker: victor
          text: "这么说，你很喜欢他？"
        - id: ch01-b84
          speaker: kim
          text: "当然喜欢。他也喜欢我。"
        - id: ch01-b85
          speaker: victor
          text: "看这封信，确实如此。他不会写英文，是不是？"
        - id: ch01-b86
          speaker: kim
          text: "我不知道他会不会。不过他当然找得到英文写得好的代书人。我真希望你能看懂。"
        - id: ch01-b87
          speaker: victor
          text: "原来是这样。你知道他有多少钱吗？"
        - id: ch01-b88
          speaker: kim
          text: "我怎么会知道？"
        - id: ch01-b89
          speaker: victor
          text: "我正问你呢。你来听听，看看能不能明白。开头先略过。信从贾加迪尔路寄来。上面说，写信人坐在路旁仔细想过，希望我看在全能上帝分上照办。上等教育是最大的福分，差的教育在世上毫无用处。凭良心说，老人这一箭正中靶心。"
        - id: ch01-b90
          speaker: victor
          text: "他还说，照我们十五日在帐中商定的，请我让他的孩子在圣泽维尔得到最好的教育。我想他指的是域外圣泽维尔学校。若我肯答应，全能上帝会赐福我的事业，直到三四代子孙。他每年会用汇票付三百卢比，作孩子在勒克瑙受教育的费用。我得等些日子，他会把汇票寄来。"
        - id: ch01-b91
          speaker: victor
          text: "信上还说，他眼下无处安放头顶，因为一位老妇说话太多，逼得他受不了。他不愿留在萨哈兰普尔做家里的什么差事，所以正坐火车去贝拿勒斯。这到底是什么意思？"
        - id: ch01-b92
          speaker: kim
          text: "我想，那女人请他在萨哈兰普尔做她的普罗……就是她的祭司。他为了找河，不肯答应。她的确说话很多。"
        - id: ch01-b93
          speaker: victor
          text: "你倒明白，我可完全糊涂了。信上说，他到贝拿勒斯以后会留下地址，也会给心肝宝贝的孩子寄卢比。代书人是没通过阿拉哈巴德大学入学试的索布拉奥·萨泰，写信的是寻找那条河的苏辰寺德舒喇嘛，回信由贝拿勒斯耆那教寺院转交。最后又说一遍，孩子是他的心肝宝贝，每年三百卢比会由汇票寄来。你说，这是一派疯话，还是一桩正经事？"
        - id: ch01-b94
          speaker: kim
          text: "他说每年给三百卢比吗？那他就会给。"
        - id: ch01-b95
          speaker: victor
          text: "哦，你真这么看？"
        - id: ch01-b96
          speaker: kim
          text: "当然。他既然说了，就一定会给。"
        - id: ch01-b97
          speaker: narrator
          text: "神父吹了声口哨，随后把金当作平等的人来讲话。"
        - id: ch01-b98
          speaker: victor
          text: "我不相信，不过可以等着看。本来今天要送你去萨纳瓦尔的军队孤儿院，由兵团养你，年纪到了就入伍。贝内特安排你按英国国教的方式长大。可若去圣泽维尔，你能得到更好的教育，也能信奉正教。你明白我的难处吗？"
        - id: ch01-b99
          speaker: narrator
          text: "金一点也没看见神父有什么难处。他眼前只有喇嘛孤身坐火车南下，身边连一个替他乞食的人也没有。"
        - id: ch01-b100
          speaker: victor
          text: "我只能像世上大多数人那样，先拖一拖。你的朋友若从贝拿勒斯寄来钱，你就去勒克瑙，车钱我付。既然我想让你做天主教徒，就不能动用那笔公捐。要是钱不来，兵团就出钱送你去军队孤儿院。我给他三天。可是一个沿街乞讨的人，到哪儿弄三百卢比？就算这次寄来，以后付不出又怎么办？赞美上帝，世上的路只能一步一步走。贝内特上了前线，却把我留下，好事总不能全叫他占去。"
        - id: ch01-b101
          speaker: kim
          text: "噢，是的。"
        - id: ch01-b102
          speaker: narrator
          text: "金说得心不在焉。神父探身看着他。"
        - id: ch01-b103
          speaker: victor
          text: "我要是能知道你那颗小圆脑袋里在想什么，情愿拿一个月薪水来换。"
        - id: ch01-b104
          speaker: kim
          text: "什么也没想。"
        - id: ch01-b105
          speaker: narrator
          text: "金抓抓脑袋。他想的是，马哈布会不会寄来整整一卢比。那样他就能付清代书人的钱，再写信给贝拿勒斯的喇嘛。也许马哈布下次赶着马群南来，还会顺路看他。金把信交给安巴拉那位军官，这才引发了眼前这场大战。如今大人和孩子每逢吃饭，都在营房的餐桌边高声议论这件事，马哈布多半已经听说。不过，要是马哈布还不知道，金亲口告诉他便太危险。对于知道得太多，或自以为知道太多的孩子，马哈布一向十分严厉。"
        - id: ch01-b106
          speaker: victor
          text: "好了，等我有进一步消息再说。你可以走了，去跟别的孩子玩。他们会教你些东西，不过我猜你不会喜欢。"
        - id: ch01-b107
          speaker: narrator
          text: "这一天又累又长，好不容易才捱到尽头。金想睡时，有人教他怎样把衣服叠好，怎样把靴子摆好，其他孩子全站在旁边嘲笑。黎明时，号角又把他吵醒。吃过早饭，校长抓住他，把一页毫无意义的符号一直塞到他鼻子底下，又给那些符号安上同样没有意义的名字。金既听不懂，也看不出这样做有什么用，校长却无缘无故抽打他。"
        - id: ch01-b108
          speaker: narrator
          text: "金盘算过，向营房的清道夫借些鸦片，把校长毒死。可大家都围着一张桌子吃饭，这已经叫喜欢背对众人用餐的金十分反感。若是下毒，还可能伤到别人，他只好放弃。"
        - id: ch01-b109
          speaker: narrator
          text: "他又想逃去那座村子，就是祭司想给喇嘛吃药、老兵居住的地方。可是每个出口都有眼光锐利的哨兵，把那个小小的猩红身影赶回来。长裤和上衣不仅绑住他的身体，也绑住他的心。金终于不再尝试，照东方人的习惯，把希望交给时间和机缘。"
        - id: ch01-b110
          speaker: narrator
          text: "三天酷刑般的日子，就在空阔、雪白、回声不断的房间里过去。每天下午，鼓手少年都押着他出门。一路上，那同伴翻来覆去只有寥寥几个没用的词，仿佛白人的辱骂有三分之二都靠它们组成。那些词金早听熟了，也早厌恶透顶。他沉默着，提不起一点兴趣。鼓手少年见自己得不到回应，心里越发恼恨，自然而然便动手打他。"
        - id: ch01-b111
          speaker: narrator
          text: "鼓手少年不喜欢任何一处准许他们去的集市，把所有本地人都叫黑鬼。仆人和清道夫当面用最难听的话骂他，他却被他们恭顺的模样骗过，一个字也没听懂。这多少补偿了金挨的打。"
        - id: ch01-b112
          speaker: narrator
          text: "第四天早上，报应终于落到鼓手少年头上。他和金一起往安巴拉赛马场走，回来时却只剩他一个，一路还哭个不停。他向人报告，自己根本没怎么招惹小奥哈拉，小奥哈拉却招呼了一个骑马的红胡子黑鬼。那个黑鬼当场挥起马鞭，鞭子抽在人身上就像咬住不肯松口。他把鼓手少年狠狠揍了一顿，又一把提起小奥哈拉，策马飞奔而去。"
        - id: ch01-b113
          speaker: narrator
          text: "消息传到维克托神父那里，神父把长长的上唇沉了下来。其实，在听到金被带走以前，他已经被贝拿勒斯耆那教寺院寄来的一封信惊得不轻。信里不但装着一张三百卢比的期票，还是由本地银行家开出的，另外还有一大段叫人目瞪口呆、向全能上帝所作的祷告。集市里的代书人把喇嘛积累功德的心愿写成了那副模样。要是喇嘛自己能够看懂，只怕会比神父更加恼火。"
        - id: ch01-b114
          speaker: victor
          text: "地下的黑暗势力啊！如今他又跟一个天亮才冒出来的朋友跑了。我真不知道，把他找回来更叫我轻松，还是让他就此丢掉更轻松。我完全弄不懂他。一个沿街乞讨的人，到底怎么弄到白人孩子上学的钱？"
        - id: ch01-b115
          speaker: narrator
          text: "三英里外的安巴拉赛马场上，马哈布·阿里勒住一匹灰色的喀布尔种公马，金坐在他身前。"
        - id: ch01-b116
          speaker: mahbub
          text: "全世界的小朋友，我也得顾惜自己的名声。各兵团的军官，还有安巴拉所有人，都认识马哈布·阿里。人人看见我把你抱上马，也看见我惩罚那个孩子。隔着这片平原，远处还有人盯着我们。我怎么能带你逃跑？若把你放进庄稼地，让你自己跑掉，我又怎么解释？他们会把我关进牢里。耐心点吧。做过少爷，一辈子都是少爷。等你长大，也许还会感谢我。"
        - id: ch01-b117
          speaker: kim
          text: "带我过岗哨，让我换掉这身红衣服。再给我些钱，我要去贝拿勒斯找回喇嘛。我不想做少爷。还有，那封信是我送到的，你别忘了。"
        - id: ch01-b118
          speaker: narrator
          text: "公马猛地腾跃。马哈布一时不慎，用边缘锋利的马镫狠狠撞了它。他不是那种满口英文、穿英国马靴和马刺的新派马贩子。金从这一下泄露的反应里，自己得出了结论。"
        - id: ch01-b119
          speaker: mahbub
          text: "那只是顺着去贝拿勒斯的大路，捎带办的一件小事。那位少爷和我早都忘了。我常替人传话，他们总问马的事，消息太多，我实在分不清。是不是彼得斯少爷要打听一匹枣红母马的血统？"
        - id: ch01-b120
          speaker: narrator
          text: "金立刻看穿圈套。要是他顺口承认枣红母马，马哈布便会知道，这孩子已经从如此痛快的改口里起了疑心。"
        - id: ch01-b121
          speaker: kim
          text: "枣红母马？不是。我可不会忘记自己传过的话。那是一匹白种公马。"
        - id: ch01-b122
          speaker: mahbub
          text: "对，是一匹白色的阿拉伯种公马。可你信里明明写的是枣红母马。"
        - id: ch01-b123
          speaker: kim
          text: "谁会对代书人说真话？"
        - id: ch01-b124
          speaker: narrator
          text: "金回答时，感觉到马哈布的手掌正按在自己心口。忽然，一个骑着小小马球马的英国人从旁边飞驰过来，高声叫马哈布停下，说自己追了他半个乡下，又问这匹能跑的喀布尔马是不是要卖。"
        - id: ch01-b125
          speaker: mahbub
          text: "我那里有几匹刚长成的幼马，是上天专为精细又艰难的马球运动造的。其中一匹举世无双。它能……"
        - id: ch01-b126
          speaker: creighton
          text: "能打马球，还能伺候饭桌。是，是，我们全知道。你带着的到底是什么？"
        - id: ch01-b127
          speaker: mahbub
          text: "一个孩子。他让另一个孩子打了。他父亲参加过大战，是个白人士兵。这孩子还是婴儿时便在我的马群里玩。如今，他父亲的兵团找到他，随后开赴战场。我想他们会把他训练成士兵，可他似乎不愿意。我带他骑一会儿马。告诉我你住哪座营房，我送你回去。"
        - id: ch01-b128
          speaker: kim
          text: "放我走吧。我认得自己的营房。"
        - id: ch01-b129
          speaker: mahbub
          text: "要是你逃了，谁会相信那不是我的错？"
        - id: ch01-b130
          speaker: creighton
          text: "他吃饭时自然会回去。除了这里，他还能跑到哪儿？"
        - id: ch01-b131
          speaker: mahbub
          text: "他生在这片土地，也有自己的朋友，想去哪里就能去哪里。这小子机灵透顶，只要换身衣服，眨眼就能变成低种姓的印度教男孩。"
        - id: ch01-b132
          speaker: creighton
          text: "见鬼，他真能做到？"
        - id: ch01-b133
          speaker: narrator
          text: "英国人挑剔地打量金，马哈布却掉转马头，往营房走。金咬牙切齿，认定马哈布像所有不讲信义的阿富汗人一样，正拿他取乐。"
        - id: ch01-b134
          speaker: mahbub
          text: "他们会送他进学校，让他穿沉重的靴子，再用衣服紧紧裹住他。这样一来，他就会忘掉自己懂的一切。喂，你住的是哪一座营房？"
        - id: ch01-b135
          speaker: narrator
          text: "金一句话也说不出，只能抬手指向近处。维克托神父那一侧营房白得刺眼。"
        - id: ch01-b136
          speaker: mahbub
          text: "也许他会成为一个好士兵。"
        - id: ch01-b137
          speaker: creighton
          text: "至少能成为好勤务兵。"
        - id: ch01-b138
          speaker: mahbub
          text: "我从前叫他从拉合尔送过一次消息，讲的是一匹白种公马的血统。"
        - id: ch01-b139
          speaker: narrator
          text: "这一下，是在致命伤口上又添了致命的侮辱。偏偏金当初把那封引发战争的信巧妙交给的少爷，也把一切听得清清楚楚。金想象着马哈布因为背叛，在烈火里受尽煎熬。可他自己的眼前，却铺开一道漫长、灰暗、没有尽头的景象。先是一座营房，接着是一所学校，学校过去以后，前面等着他的又是一座营房。"
        - id: ch01-b140
          speaker: narrator
          text: "金哀求地望着那张轮廓分明的脸，可对方一点也不像认出了他。即使到了这一步，金也没想过向白人求情，更没想过揭发那个阿富汗人。马哈布故意盯着英国人，英国人也故意盯着浑身发抖、说不出话的金。"
        - id: ch01-b141
          speaker: mahbub
          text: "我这匹马训练得很好。换成另一匹，早就踢人了，少爷。"
        - id: ch01-b142
          speaker: creighton
          text: "啊。那么是谁要把这孩子训练成士兵？"
        - id: ch01-b143
          speaker: mahbub
          text: "他说，是发现他的兵团，特别是兵团里的帕德里少爷。"
        - id: ch01-b144
          speaker: kim
          text: "帕德里来了！"
        - id: ch01-b145
          speaker: narrator
          text: "金哽着嗓子喊。没戴帽子的维克托神父从走廊冲下来。"
        - id: ch01-b146
          speaker: victor
          text: "地下的黑暗势力啊，奥哈拉！你在亚洲究竟还交了多少杂七杂八的朋友？"
        - id: ch01-b147
          speaker: narrator
          text: "金滑下马，无可奈何地站到神父面前。"
        - id: ch01-b148
          speaker: creighton
          text: "早安，神父。我久闻您的名声，早想来拜访，只是一直没能成行。我叫克赖顿。"
        - id: ch01-b149
          speaker: victor
          text: "民族调查局的克赖顿？凭良心说，见到您我真高兴。您把孩子送回来，我还欠您一份谢意。"
        - id: ch01-b150
          speaker: creighton
          text: "不必谢我，神父。这孩子也没打算逃。您还不了解老马哈布·阿里，在这里住一个月就认识他了。我们的劣马都是他卖的。这孩子倒很有意思，您能不能告诉我一些他的事？"
        - id: ch01-b151
          speaker: victor
          text: "能不能告诉您？您正是唯一能替我解开这些难题的人。黑暗势力啊，我肚子都快撑破了，正想找个懂本地人的人全说出来！"
        - id: ch01-b152
          speaker: narrator
          text: "一个马夫从屋角绕来。克赖顿改用乌尔都语，提高嗓门。"
        - id: ch01-b153
          speaker: creighton
          text: "很好，马哈布·阿里。可你对那匹小马编这么多故事有什么用？我最多给三百五十卢比，多一个派萨也不给。"
        - id: ch01-b154
          speaker: mahbub
          text: "少爷骑过马，身上发热，心里也有火气。等一会儿，他会把我的马看得更清楚。我就在那棵树下，等他跟帕德里谈完。"
        - id: ch01-b155
          speaker: narrator
          text: "马贩子脸上挂着受宠弄臣才敢露出的坏笑。"
        - id: ch01-b156
          speaker: creighton
          text: "该死的家伙！神父，看了马哈布的马，麻烦总是跟着来。他就是一条老水蛭。马哈布，你既然这么有空，就等着吧。神父，现在听您吩咐。孩子去哪儿了？哦，他跑去跟马哈布密谈了。真是个古怪孩子。能否叫人把我的母马牵到阴凉里？"
        - id: ch01-b157
          speaker: narrator
          text: "克赖顿坐到椅子上，从那里正好看清树下的金和马哈布。神父进屋找雪茄烟。克赖顿听见金恨恨地开口。"
        - id: ch01-b158
          speaker: kim
          text: "宁可相信婆罗门，也别相信蛇。宁可相信蛇，也别相信娼妇。宁可相信娼妇，也别相信普什图人，马哈布·阿里。"
          emotion: angry
        - id: ch01-b159
          speaker: mahbub
          text: "都是一样。地毯还在织机上，花纹没有显出来时，孩子不该去偷看。相信我，全世界的朋友，我正在帮你一个大忙。他们不会把你训练成士兵。"
        - id: ch01-b160
          speaker: narrator
          text: "克赖顿心想，这真是个狡猾的老罪人。不过马哈布说得不错。这个孩子若真像传闻中那样，便不能白白糟蹋。"
        - id: ch01-b161
          speaker: victor
          text: "请再等半分钟，我正在找这件事的文件。"
        - id: ch01-b162
          speaker: mahbub
          text: "若是因为我，那位勇敢明智的上校少爷垂青你，让你得到荣耀，等你长大后，要怎样感谢马哈布·阿里？"
        - id: ch01-b163
          speaker: kim
          text: "不，不！我求你让我回到大路上。我原本在那里平安无事，是你把我卖回给英国人。他们要给你多少血钱？"
        - id: ch01-b164
          speaker: narrator
          text: "上校咬住雪茄，暗自觉得这个小魔鬼实在有趣，随后彬彬有礼地转向维克托神父。树下，马哈布忽然叫金站到公马后面，装作查看自己的缰绳。那个胖祭司正朝上校挥动几张东西，马哈布锐利的双眼已经飞快扫过走廊，把一切都看在眼里。"
        - id: ch01-b165
          speaker: kim
          text: "那是我的喇嘛从贾加迪尔路写来的。他说每年肯付三百卢比，让我上学。"
        - id: ch01-b166
          speaker: mahbub
          text: "哦嗬！红帽老人家还有这种本事？要送你去哪所学校？"
        - id: ch01-b167
          speaker: kim
          text: "天知道。我想是在勒克瑙。"
        - id: ch01-b168
          speaker: mahbub
          text: "对，那里有一所大学校，专收少爷和半个少爷的儿子。我去卖马时见过。原来喇嘛也爱全世界的朋友？"
        - id: ch01-b169
          speaker: kim
          text: "是的。他从不撒谎，也没有把我送回囚牢。"
        - id: ch01-b170
          speaker: mahbub
          text: "难怪帕德里解不开这团乱线。看他跟上校讲得多快！凭安拉起誓，你喇嘛寄来的东西像一张期票。汇票买卖，我也做过。上校正在看它。"
        - id: ch01-b171
          speaker: kim
          text: "这些对我有什么用？你一走，他们还是把我送回空房间。那里没有一处好睡觉的地方，孩子们还会打我。"
        - id: ch01-b172
          speaker: mahbub
          text: "我看不会。耐心点，孩子。不是所有普什图人都不讲信义，做马匹买卖时除外。"
        - id: ch01-b173
          speaker: narrator
          text: "五分钟过去，又过了十分钟、十五分钟。维克托神父一直激动地讲述，把自己知道的事情一件件倒出来。讲到拿不准的地方，他偶尔停下提出问题，上校便简短回答一句。树下的金和马哈布只能等着，看这场长谈会把金的命运带到哪里。"
        - id: ch01-b174
          speaker: victor
          text: "现在，这孩子从头到尾的事，只要是我知道的，全告诉您了。能说出来真是上天保佑，我心里痛快多了。您听过这样的事吗？"
        - id: ch01-b175
          speaker: creighton
          text: "不管怎样，老人已经把钱寄来。戈宾德·萨海的期票，从这里一直到中国都有人认。一个人对本地人知道得越多，越不敢断言他们会做什么，又不会做什么。"
        - id: ch01-b176
          speaker: victor
          text: "这话出自民族调查局局长，真叫人安心。可红公牛、疗愈之河、期票，还有共济会证书，全搅在一起，我实在弄不明白。您碰巧也是共济会会员吗？"
        - id: ch01-b177
          speaker: creighton
          text: "天哪，我还真是。您一说我才想起来。这便又多了一个理由。"
        - id: ch01-b178
          speaker: victor
          text: "您能看出理由，我真高兴。可这些事搅成一团，我怎么也想不明白。他坐在我的床上，敞开破衬衣，露出白皮肤，向我们上校预言，结果竟然成真！进了圣泽维尔，这些胡话都会治好吧？"
        - id: ch01-b179
          speaker: creighton
          text: "给他洒些圣水。"
        - id: ch01-b180
          speaker: victor
          text: "凭良心说，有时我真觉得应该这样。我希望他能成为一个好天主教徒。只怕那个老叫花子万一……"
        - id: ch01-b181
          speaker: creighton
          text: "是喇嘛，我亲爱的先生。有些喇嘛在自己的国家还是体面人物。"
        - id: ch01-b182
          speaker: victor
          text: "可他明年要是付不出钱呢？这次安排很有生意头脑，可人总有一天会死。再说，拿异教徒的钱给孩子施行基督教教育……"
        - id: ch01-b183
          speaker: creighton
          text: "他已经把要求说得很清楚。知道孩子是白人后，他似乎就照这个事实作了安排。若能听到他怎样向贝拿勒斯耆那教寺院解释，我情愿拿一个月薪水来换。神父，我不敢说自己很懂本地人，可他答应付，就会付。哪怕他死了，继承人也会承担这笔债。依我看，把孩子送去勒克瑙。至于那位英国国教牧师要是觉得您抢了先……"
        - id: ch01-b184
          speaker: victor
          text: "让贝内特倒霉去吧！上前线的是他，不是我。多蒂给我开了不宜服役的证明。要是他活着回来，我非把他逐出教会不可。贝内特总该满足于……"
        - id: ch01-b185
          speaker: creighton
          text: "满足于荣耀，把宗教留给您。正是如此。其实贝内特不会介意。责任推给我吧。我强烈建议送孩子去圣泽维尔。他能凭通行证，以士兵孤儿的身份南下，连火车钱也省了。衣服由兵团公捐置办，分会省下教育费，也会满意。下星期我正好去勒克瑙，路上由我照看他，或交给我的仆人看管。"
        - id: ch01-b186
          speaker: victor
          text: "您真是个好人。"
        - id: ch01-b187
          speaker: creighton
          text: "一点也不是。喇嘛为一个明确的目的把钱寄来，我们不能退，只能照办。就这样决定吧。下星期二，您在南下的夜车上把他交给我。还剩三天，他三天里闯不出多大祸。"
        - id: ch01-b188
          speaker: victor
          text: "这下我心头的石头落地了。可是这张期票怎么办？我不认识戈宾德·萨海，也不认识他的银行。那银行说不定只是墙上的一个洞。"
        - id: ch01-b189
          speaker: creighton
          text: "您从没做过负债的尉官。我替您兑付，再按规矩送来凭据。"
        - id: ch01-b190
          speaker: victor
          text: "您自己还有那么多工作。这实在太麻烦您了。"
        - id: ch01-b191
          speaker: creighton
          text: "一点也不麻烦。我是民族学家，这件事令我很有兴趣。我正替政府做一项工作，想把它记下来。兵团的红公牛徽记，到了这孩子心里，竟变成他追随的某种神物。这种变化十分有趣。"
        - id: ch01-b192
          speaker: victor
          text: "我真不知道该怎么谢您。"
        - id: ch01-b193
          speaker: creighton
          text: "您可以替我做一件事。我们这些民族学家彼此嫉妒对方的发现，像一群寒鸦。那些发现除了我们，当然谁也不关心，可藏书家的脾气，您也知道。关于这孩子性格里属于亚洲的那一面，还有他的冒险和预言，请您无论直接还是间接，都别说一个字。以后我会慢慢从他嘴里套出来。您明白吧？"
        - id: ch01-b194
          speaker: victor
          text: "明白。您会把它写成绝妙的记录。在我看到它印出来以前，绝不向任何人提起。"
        - id: ch01-b195
          speaker: creighton
          text: "谢谢，这话正中民族学家的心。好了，我得回去吃早饭。老天，老马哈布还在这里？马哈布，你还有什么事？"
        - id: ch01-b196
          speaker: mahbub
          text: "说到那匹小马，一匹幼马若天生就该打马球，不用教便懂得紧跟着球，把它套上沉重的大车，就是大大的不公，少爷！"
        - id: ch01-b197
          speaker: creighton
          text: "我也这么说，马哈布。这匹马驹只会报名去打马球。神父，这些家伙满脑子只有马。马哈布，明天再来见我吧，如果有像样的马要卖。"
        - id: ch01-b198
          speaker: narrator
          text: "马贩子照骑手的礼节，挥起外侧那只手行礼，随后低声对痛苦万分的金说话。"
        - id: ch01-b199
          speaker: mahbub
          text: "再耐心等一等，全世界的朋友。你的前程已经定了，很快就会去勒克瑙。这里有些钱，可以付给代书人。我想我们以后还会见面，而且会见许多次。"
        - id: ch01-b200
          speaker: narrator
          text: "说完，马哈布策马沿着大路离去，转眼便把营房抛在身后。金望着他的背影，只能留在原地。克赖顿仍站在走廊上，他改用金熟悉的本地话，把这个满心不情愿的孩子叫住。"
        - id: ch01-b201
          speaker: creighton
          text: "听我说。三天以后，你随我去勒克瑙。一路上不断会有新鲜事可以看，也可以听。所以安静等三天，别逃。你要去勒克瑙上学。"
        - id: ch01-b202
          speaker: kim
          text: "在那里，我能见到我的圣人吗？"
          emotion: sad
        - id: ch01-b203
          speaker: creighton
          text: "至少勒克瑙比安巴拉离贝拿勒斯更近。也许以后由我照管你。马哈布·阿里知道这件事，你若现在跑回大路，他会生气。记住，别人已经告诉我许多事，我不会忘。"
        - id: ch01-b204
          speaker: kim
          text: "我会等。可是那些孩子会打我。"
          emotion: sad
        - id: ch01-b205
          speaker: narrator
          text: "就在这时，号角响了起来，召集众人去吃饭。"
