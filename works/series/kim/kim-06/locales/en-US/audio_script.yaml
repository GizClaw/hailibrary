  chapters:
    - id: ch01
      title: The Mavericks March Away
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Now I remember comrades, old playmates on new seas. We traded orpiment among the savages, ten thousand leagues to the south and thirty years away. They did not know noble Valdez, but they knew and loved me.
        - id: ch01-b02
          speaker: narrator
          text: Very early the next morning, the Mavericks struck their white tents and took a side road toward Umballa. Their route did not pass the resting place. Kim walked beside a baggage cart while the soldiers' wives called remarks down at him. He felt much less sure of himself than he had the night before. Father Victor watched him from one side, and Mr. Bennett from the other.
        - id: ch01-b03
          speaker: narrator
          text: Before noon, the column stopped. A camel orderly brought the Colonel a letter. The Colonel read it and spoke to a Major. Kim was half a mile behind them when a joyful roar began at the front and rolled back through the heavy dust. Someone thumped him between the shoulders and demanded to know how he had known. Then Father Victor pulled Kim up across the front of his saddle.
        - id: ch01-b04
          speaker: father_victor
          text: Well, my son, last night's prophecy has come true. We have orders to take the train at Umballa tomorrow and go to the Front.
        - id: ch01-b05
          speaker: kim
          text: What does that mean?
        - id: ch01-b06
          speaker: father_victor
          text: It means we're going to the war you told us about.
        - id: ch01-b07
          speaker: kim
          text: Well, of course you are. I told you that last night.
        - id: ch01-b08
          speaker: father_victor
          text: You did indeed. But how in the Powers of Darkness did you know?
        - id: ch01-b09
          speaker: narrator
          text: Kim's eyes shone. He pressed his lips together, nodded wisely, and looked as mysterious as he knew how. As the chaplain rode on, privates, sergeants, and young officers pointed Kim out to one another. Even the Colonel at the head of the column turned to study him.
        - id: ch01-b10
          speaker: colonel_mavericks
          text: It was probably some rumor from the bazaar. Still, this decision was made less than forty-eight hours ago.
        - id: ch01-b11
          speaker: father_victor
          text: Are there many boys like you in India, or are you some wonder of nature?
        - id: ch01-b12
          speaker: kim
          text: Now that I've told you, will you let me go back to my old man? Unless he stayed with the woman from Kulu, I'm afraid he may die.
        - id: ch01-b13
          speaker: father_victor
          text: From what I saw, he can look after himself as well as you can. No, you've brought us luck, and we'll make a man of you. Go back to the baggage cart now. Come to me this evening.
        - id: ch01-b14
          speaker: narrator
          text: For the rest of the day, several hundred white men treated Kim as a person of great importance. They passed around the tale of his arrival in camp, the discovery of his parentage, and his prophecy. With every telling, the story grew, and no detail lost anything along the way.
        - id: ch01-b15
          speaker: soldiers_wife
          text: Tell me, dear. Do you think my husband will come home from the war?
        - id: ch01-b16
          speaker: narrator
          text: A large, shapeless woman asked him that from the top of a bedding pile. Kim considered the matter with a grave face.
        - id: ch01-b17
          speaker: kim
          text: Yes. He will come back.
        - id: ch01-b18
          speaker: narrator
          text: The woman gave him food. The great procession played music from time to time, and everyone talked and laughed easily. It reminded Kim of a festival in Lahore. There was no hard work in sight, so he decided the show deserved his approval.
        - id: ch01-b19
          speaker: narrator
          text: That evening, bands came out to meet the Mavericks and played them into camp beside Umballa station. It became an eventful night. Men from other regiments visited them, and the Mavericks went visiting on their own account. Pickets rushed out to fetch their own men, collided with pickets doing the same work for other regiments, and soon the bugles were wildly calling for still more pickets and officers to control the uproar. The Mavericks had a lively reputation to maintain.
        - id: ch01-b20
          speaker: narrator
          text: Yet the next morning they formed up on the railway platform in perfect shape and condition, as if the wild night had never happened. Kim stayed behind with the sick men, the women, and the boys. He found himself shouting excited goodbyes as the trains pulled away. Being a Sahib seemed amusing so far, though he meant to approach it carefully.
        - id: ch01-b21
          speaker: narrator
          text: A drummer boy marched him back to empty, whitewashed barracks. Scraps of string and paper covered the floors, and every lonely footstep came back from the ceilings. Kim curled up on a bare cot as he would have done anywhere else and went to sleep.
        - id: ch01-b22
          speaker: narrator
          text: An angry man stamped along the veranda, woke him, and announced that he was the schoolmaster. That was enough to make Kim shut himself away inside his own thoughts.
        - id: ch01-b23
          speaker: narrator
          text: He could slowly work out the English police notices in Lahore when they concerned his comfort. Once, a strange German who painted scenery for a traveling Parsee theater had stayed among his guardian's many guests. The man said he had fought on the barricades in the year Forty-eight. For that reason, or so Kim understood it, he offered to teach the boy writing in exchange for food. Kim had been driven as far as learning single letters, and he had formed a poor opinion of them.
        - id: ch01-b24
          speaker: kim
          text: I don't know anything. Go away!
        - id: ch01-b25
          speaker: narrator
          text: The schoolmaster seized him by the ear and dragged him to a distant room. A dozen drummer boys sat there on benches. He told Kim that if he could do nothing else, he could at least keep still. Kim did that beautifully.
        - id: ch01-b26
          speaker: narrator
          text: For half an hour, the man drew white marks on a blackboard and explained something Kim did not care to understand. Kim went back to sleep. He hated this turn of events. Here was the very school and discipline he had spent most of his young life escaping. Then a splendid idea came to him, and he wondered why he had not thought of it sooner.
    - id: ch02
      title: A Letter from Under the Tree
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: When the lesson ended, Kim was first through the veranda and out into the sunlight. A high voice called after him to halt.
        - id: ch02-b02
          speaker: drummer_boy
          text: Here, you! Stop! I've got orders to keep you in sight. Where are you going?
        - id: ch02-b03
          speaker: narrator
          text: It was the drummer boy who had followed him all morning, a fat, freckled lad of about fourteen. Kim loathed everything about him, from his boots to the ribbons on his cap.
        - id: ch02-b04
          speaker: kim
          text: I'm going to the bazaar to buy sweets for you.
        - id: ch02-b05
          speaker: drummer_boy
          text: The bazaar is out of bounds. We'd get a dressing-down if we went there. Come back.
        - id: ch02-b06
          speaker: kim
          text: How near may we go?
        - id: ch02-b07
          speaker: narrator
          text: Kim had no idea what bounds were, but for the moment he wished to sound agreeable.
        - id: ch02-b08
          speaker: drummer_boy
          text: You mean how far. We can go as far as that tree down the road.
        - id: ch02-b09
          speaker: kim
          text: Then I'll go to the tree.
        - id: ch02-b10
          speaker: drummer_boy
          text: Go on, then. I'm staying here where it's cooler. I can watch you from the veranda. Don't bother trying to run. That uniform belongs to the regiment. Every picket in Umballa would know it and bring you back before you got anywhere.
        - id: ch02-b11
          speaker: narrator
          text: The warning mattered less to Kim than the thought of running in those heavy clothes. He wandered to the tree at the turn of the bare road and watched the local people go by. Most were low-caste barrack servants.
        - id: ch02-b12
          speaker: narrator
          text: Kim called to a sweeper. Thinking that a European child could not understand him, the man answered with an insult. Kim's low, quick reply corrected that mistake. All the anger trapped inside him poured out in the language he knew best. Then he gave the man an order.
        - id: ch02-b13
          speaker: kim
          text: Go to the nearest letter writer in the bazaar and bring him here. I need a letter written.
        - id: ch02-b14
          speaker: sweeper
          text: What kind of white man's son needs a bazaar letter writer? Don't you have a schoolmaster in the barracks?
        - id: ch02-b15
          speaker: kim
          text: Yes, and Hell is full of his kind. Do as I say, you servant of Lal Beg. Your mother was married under a basket! Run, or you and I will have another talk.
        - id: ch02-b16
          speaker: narrator
          text: The sweeper hurried away. He found the first bazaar scribe he could and stammered out his news.
        - id: ch02-b17
          speaker: sweeper
          text: There's a white boy waiting under a tree by the barracks, but he isn't a white boy. He wants you.
        - id: ch02-b18
          speaker: letter_writer
          text: Will he pay me?
        - id: ch02-b19
          speaker: sweeper
          text: I don't know. He isn't like other boys. Go and see. It will be worth your time.
        - id: ch02-b20
          speaker: narrator
          text: The neat young Kayeth gathered his little desk, pens, ink, and sealing wax. Kim danced with impatience when he finally saw the slim figure approaching. As soon as the man came within hearing, Kim poured abuse over him.
        - id: ch02-b21
          speaker: letter_writer
          text: I will take my payment first. Those bad words have raised my price. And who are you, dressed like that but speaking like this?
        - id: ch02-b22
          speaker: kim
          text: Ah, that's part of the letter you're going to write. You've never heard such a story. But there's no hurry. I can always find another writer. Umballa has as many of you as Lahore does.
        - id: ch02-b23
          speaker: letter_writer
          text: My price is four annas.
        - id: ch02-b24
          speaker: narrator
          text: He spread his cloth in the shade of an empty barrack wing. Without thinking, Kim squatted beside him exactly as the local people did, in spite of the hateful trousers. The writer studied him from the corner of his eye.
        - id: ch02-b25
          speaker: kim
          text: Four annas is what you ask from Sahibs. Give me an honest price.
        - id: ch02-b26
          speaker: letter_writer
          text: An anna and a half. But once I've written it, how do I know you won't run away without paying?
        - id: ch02-b27
          speaker: kim
          text: I'm forbidden to go beyond this tree. And we still have to pay for the stamp.
        - id: ch02-b28
          speaker: letter_writer
          text: I make nothing from the stamp. Now tell me again, what kind of white boy are you?
        - id: ch02-b29
          speaker: kim
          text: Put that in the letter. It goes to my friend Mahbub Ali, the horse dealer at the Kashmir Serai in Lahore.
        - id: ch02-b30
          speaker: letter_writer
          text: One wonder after another! Do you want it written in Hindi?
        - id: ch02-b31
          speaker: kim
          text: Of course. Begin this way. I came with the old man as far as Umballa by train. There I delivered the news about the bay mare's pedigree.
        - id: ch02-b32
          speaker: narrator
          text: Kim remembered what he had seen in the garden and carefully avoided writing anything about white stallions.
        - id: ch02-b33
          speaker: letter_writer
          text: A little slower. What does a bay mare have to do with this? Wait, do you mean the great dealer Mahbub Ali?
        - id: ch02-b34
          speaker: kim
          text: Who else? I've worked for him. Take more ink. Now write this. I did exactly as I was ordered. Then the old man and I started walking toward Benares, but on the third day we found a certain regiment. Have you written that?
        - id: ch02-b35
          speaker: letter_writer
          text: Yes, I have written "a regiment."
        - id: ch02-b36
          speaker: narrator
          text: The scribe bent close, listening to every word.
        - id: ch02-b37
          speaker: kim
          text: I went into their camp and they caught me. You know the charm around my neck. It proved that I was the son of a man from that regiment. So the prophecy of the Red Bull came true, the one everyone in our bazaar talked about.
        - id: ch02-b38
          speaker: narrator
          text: Kim paused to let that marvel settle into the letter writer's mind. Then he cleared his throat.
        - id: ch02-b39
          speaker: kim
          text: A priest dressed me in these clothes and gave me a new name. One of the priests was a fool. The clothes are heavy. I am a Sahib now, and my heart is heavy too. They send me to school and beat me. I don't like the air or water here. Come and help me, Mahbub Ali, or send some money, because I can't even pay the man writing this letter.
        - id: ch02-b40
          speaker: letter_writer
          text: The man writing this letter! It's my own fault you've tricked me. You're as clever as Husain Bux, the man who forged the Treasury stamps at Nucklao. But what a tale! Can any of it be true?
        - id: ch02-b41
          speaker: kim
          text: Lying to Mahbub Ali brings no profit. You'll do better by helping his friend with the price of a stamp. When the money comes, I'll pay you back.
        - id: ch02-b42
          speaker: narrator
          text: The writer grunted, still doubtful. Yet he took a stamp from his box, sealed the letter, and gave it to Kim. In Umballa, Mahbub Ali's name carried weight.
        - id: ch02-b43
          speaker: kim
          text: That's how a man earns a good account with the gods!
        - id: ch02-b44
          speaker: letter_writer
          text: When your money comes, you can pay me twice over!
        - id: ch02-b45
          speaker: narrator
          text: The writer called that back over his shoulder. When Kim returned to the veranda, the drummer boy had questions ready.
        - id: ch02-b46
          speaker: drummer_boy
          text: What were you jabbering about with that man? I was watching you.
        - id: ch02-b47
          speaker: kim
          text: I was only talking to him.
        - id: ch02-b48
          speaker: drummer_boy
          text: You talk just like the natives, don't you?
        - id: ch02-b49
          speaker: kim
          text: No. No. I only speak a little. What do we do now?
        - id: ch02-b50
          speaker: drummer_boy
          text: The bugle will sound for dinner any moment. I wish I'd gone to the Front with the regiment. Staying here for school is awful. Don't you hate it?
        - id: ch02-b51
          speaker: kim
          text: Oh, yes!
        - id: ch02-b52
          speaker: drummer_boy
          text: I'd run away if I had anywhere to go. The men say that in this miserable India, you're only a prisoner with room to walk. Desert, and someone catches you at once. I'm sick of it.
        - id: ch02-b53
          speaker: kim
          text: Have you been to England?
        - id: ch02-b54
          speaker: drummer_boy
          text: I came out with my mother in the last troop season, so of course I've been there. What an ignorant little beggar you are! You grew up in the gutter, didn't you?
        - id: ch02-b55
          speaker: kim
          text: Oh, yes. Tell me about England. My father came from there.
        - id: ch02-b56
          speaker: narrator
          text: Kim did not believe a word of the drummer boy's stories about the Liverpool suburb that stood for England in his mind, though he kept that disbelief to himself. Still, the talk used up the slow hours before dinner. The meal itself was uninviting and was served to the boys and a few sick men in the corner of a barrack room.
        - id: ch02-b57
          speaker: narrator
          text: If he had not sent his letter to Mahbub Ali, Kim might have sunk into misery. He understood being ignored in a crowd of local people. This powerful loneliness among white men was different, and it pressed upon him.
    - id: ch03
      title: The Lama's Promise
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: That afternoon, a large soldier took Kim across another dusty parade ground to Father Victor's rooms in a different wing. The priest was reading an English letter written in purple ink. He looked at Kim with more curiosity than ever.
        - id: ch03-b02
          speaker: father_victor
          text: How are you liking it so far, my son? Not much, eh? This must be very hard for a wild creature like you. Listen now. I've had an astonishing letter from your friend.
        - id: ch03-b03
          speaker: kim
          text: Where is he? Is he well? Oh, if he knows how to send me letters, then everything is all right.
        - id: ch03-b04
          speaker: father_victor
          text: You're fond of him, are you?
        - id: ch03-b05
          speaker: kim
          text: Of course I am. He was fond of me too.
        - id: ch03-b06
          speaker: father_victor
          text: It certainly looks that way. He can't write English himself, can he?
        - id: ch03-b07
          speaker: kim
          text: Not as far as I know. Of course he found a letter writer who knows English very well. I hope you understand that.
        - id: ch03-b08
          speaker: father_victor
          text: That explains the style. Do you know anything about his money?
        - id: ch03-b09
          speaker: kim
          text: How would I know?
        - id: ch03-b10
          speaker: father_victor
          text: That's why I'm asking. Listen and see whether you can make sense of this. We can skip the beginning. It comes from Jagadhir Road. He says he sits by the roadside in deep thought and hopes I will approve what he now asks me to do for Almighty God's sake. A good education is the greatest blessing, he says. The wrong kind is no earthly use. Faith, the old man struck the center of the target there!
        - id: ch03-b11
          speaker: father_victor
          text: Then he asks me to give his boy the best education at Xavier's, according to our talk in my tent on the fifteenth. Very businesslike! He promises three hundred rupees a year by banker's note to pay for St. Xavier's in Lucknow. He says he has nowhere to rest his head just now, but he is going to Benares by train because an old woman in Saharunpore talked too much and wanted him to live in her house. What can that possibly mean?
        - id: ch03-b12
          speaker: kim
          text: I think she asked him to be her puro, her own priest, in Saharunpore. He wouldn't do that because he has to find his River. And she did talk a great deal.
        - id: ch03-b13
          speaker: father_victor
          text: It's plain to you, is it? It defeats me. The letter goes on. He will send the money from Benares for the boy who is the apple of his eye, and he begs me before Almighty God to arrange the education. It was written by Sobrao Satai, who failed the Allahabad University entrance examination, for the Venerable Teshoo Lama of Such-zen, now searching for a River. His address is the Tirthankars' Temple in Benares. Then there's a final note. The boy is the apple of his eye, the three hundred rupees will come each year, and once more I must do it for Almighty God's sake. Is this wild madness or a real offer? I'm asking you because I don't know what to think.
        - id: ch03-b14
          speaker: kim
          text: He says he'll give three hundred rupees every year? Then that's what he'll do.
        - id: ch03-b15
          speaker: father_victor
          text: So that's how you see it?
        - id: ch03-b16
          speaker: kim
          text: Of course. He said he would.
        - id: ch03-b17
          speaker: narrator
          text: Father Victor whistled. Then he began speaking to Kim as if the boy were his equal.
        - id: ch03-b18
          speaker: father_victor
          text: I don't believe the money will come, but we'll wait and see. Today you were supposed to go to the military orphanage at Sanawar. The regiment would support you there until you were old enough to enlist, and you'd be raised in the Church of England. Bennett arranged it. But St. Xavier's would give you a better education, and you could have the religion too. Do you see my difficulty?
        - id: ch03-b19
          speaker: narrator
          text: Kim saw only the lama traveling south by train with no one beside him to beg for food.
        - id: ch03-b20
          speaker: father_victor
          text: Like most people, I'll put off the decision. If your friend sends the money from Benares, you'll go to Lucknow. I'll pay your fare myself, because I can't use the regimental fund when I mean to have you raised Catholic. But where could a street beggar find three hundred rupees? If he doesn't send it, you'll go to the military orphanage at the regiment's expense. I'll give him three days. And if he fails to pay later, well, that's another problem. We can only take one step at a time, praise God. They sent Bennett to the Front and left me here, so he can't have everything.
        - id: ch03-b21
          speaker: kim
          text: Oh, yes.
        - id: ch03-b22
          speaker: narrator
          text: Kim answered without much attention. The priest leaned toward him.
        - id: ch03-b23
          speaker: father_victor
          text: I'd give a month's pay to know what's happening inside that small round head.
        - id: ch03-b24
          speaker: kim
          text: Nothing is happening.
        - id: ch03-b25
          speaker: narrator
          text: Kim scratched his head. In truth, he was wondering if Mahbub Ali might send a whole rupee. That would pay the scribe and let Kim write to the lama in Benares. Perhaps Mahbub would visit the next time he brought horses south.
        - id: ch03-b26
          speaker: narrator
          text: Mahbub must surely know that the message Kim carried to the officer at Umballa had brought about the great war everyone discussed at the dinner tables. Yet if he did not know, telling him would be dangerous. Mahbub dealt harshly with boys who knew too much, or only imagined that they did.
        - id: ch03-b27
          speaker: father_victor
          text: Until I hear more, you may go and play with the other boys. They'll teach you something, though I doubt you'll enjoy it.
        - id: ch03-b28
          speaker: narrator
          text: The day crawled to its end. At bedtime, they taught Kim how to fold his clothes and set out his boots while the other boys laughed at him. Bugles woke him at dawn. After breakfast, the schoolmaster caught him, shoved a page of meaningless marks under his nose, gave the marks senseless names, and struck him for no reason.
        - id: ch03-b29
          speaker: narrator
          text: Kim considered poisoning the man with opium borrowed from a sweeper. Then he remembered that everyone ate together at an open table. He hated that too, since he preferred to turn his back on the world while eating, but it also made poison too dangerous.
        - id: ch03-b30
          speaker: narrator
          text: Next he tried to escape to the village where the priest had attempted to drug the lama, the same place where the old soldier lived. Watchful sentries stopped the little figure in scarlet at every exit. His trousers and jacket trapped his mind as much as his body. At last he gave up and trusted, in the way of the East, to time and chance.
        - id: ch03-b31
          speaker: narrator
          text: Three days of misery passed through those huge, echoing rooms. Each afternoon he walked out under the drummer boy's guard. The boy's talk consisted mostly of a few useless English curses. Kim had known all those words for years and despised them. His silence annoyed the drummer, who naturally answered by beating him.
        - id: ch03-b32
          speaker: narrator
          text: The drummer called every local person by one ugly name and cared for none of the bazaars they were allowed to visit. Meanwhile, the servants and sweepers insulted him to his face. Their respectful manner fooled him, and he never understood a word. That offered Kim some comfort for the blows.
        - id: ch03-b33
          speaker: narrator
          text: On the fourth morning, judgment found the drummer boy. The two boys had walked toward the Umballa racecourse. Only the drummer came back. He was crying. He reported that young O'Hara, while suffering no particular harm at his hands, had called to a red-bearded horseman. The horseman had whipped the drummer thoroughly, lifted O'Hara onto his horse, and galloped away.
        - id: ch03-b34
          speaker: narrator
          text: When Father Victor heard, his long upper lip drew down. Another surprise already lay in his hand. A letter from the Tirthankars' Temple in Benares had arrived with a banker's promise for three hundred rupees and yet another amazing appeal to Almighty God. The lama would have disliked the phrase if he had known his scribe had used it to translate his wish to acquire merit.
        - id: ch03-b35
          speaker: father_victor
          text: Powers of Darkness below! Now he's ridden off with another friend who appears at dawn. I can't decide whether I'd rather get the boy back or lose him for good. I cannot understand him. How can a street beggar find enough money to educate a white boy?
    - id: ch04
      title: The Colt Meant for Polo
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: Three miles away on the Umballa racecourse, Kim sat in front of Mahbub Ali on a gray Kabuli stallion. Mahbub held the reins and explained his difficulty.
        - id: ch04-b02
          speaker: mahbub
          text: Little Friend of all the World, I must think of my honor and my good name. Every officer in every regiment here knows Mahbub Ali, and all Umballa knows me too. Men watched me take you up and punish that boy. Anyone can see us crossing this open ground. How could I carry you away? If I put you down and let you vanish into the crops, how would I explain it? They would put me in prison. Have patience. Once a Sahib, always a Sahib. When you're grown, perhaps you'll thank Mahbub Ali.
        - id: ch04-b03
          speaker: kim
          text: Take me past their sentries so I can get rid of this red uniform. Give me money, and I'll go to Benares to find my lama. I don't want to be a Sahib. And remember, I delivered your message.
        - id: ch04-b04
          speaker: narrator
          text: The stallion leaped wildly. Mahbub had accidentally pushed the sharp edge of his stirrup into its side. He was not one of the newer, smooth-talking horse dealers who wore English boots and spurs. Kim noticed the sudden movement and drew his own conclusion about how little Mahbub had forgotten.
        - id: ch04-b05
          speaker: mahbub
          text: That little errand was already on your road to Benares. The Sahib and I have both forgotten it by now. I send so many messages to men who ask about horses that I cannot keep them apart. Was it about the pedigree of a bay mare for Peters Sahib?
        - id: ch04-b06
          speaker: narrator
          text: Kim saw the trap. If he eagerly agreed about the bay mare, Mahbub would know that he suspected the message was something else.
        - id: ch04-b07
          speaker: kim
          text: A bay mare? No. I remember my errands. It concerned a white stallion.
        - id: ch04-b08
          speaker: mahbub
          text: Yes, of course. A white Arab stallion. But in your letter to me, you wrote bay mare.
        - id: ch04-b09
          speaker: kim
          text: Why should anyone tell the truth in front of a letter writer?
        - id: ch04-b10
          speaker: narrator
          text: As Kim answered, he felt Mahbub's hand against his chest, testing the beat of his heart.
        - id: ch04-b11
          speaker: colonel
          text: Ho, Mahbub, you old villain! Stop there!
        - id: ch04-b12
          speaker: narrator
          text: An Englishman on a small polo pony raced up beside them.
        - id: ch04-b13
          speaker: colonel
          text: I've chased you across half the countryside. That Kabuli can move. He's for sale, I suppose?
        - id: ch04-b14
          speaker: mahbub
          text: I have young horses coming on that Heaven itself made for the delicate and difficult game of polo. This one has no equal. He can—
        - id: ch04-b15
          speaker: colonel
          text: Play polo and wait at table too. Yes, I've heard it all. What in the world are you carrying there?
        - id: ch04-b16
          speaker: mahbub
          text: A boy. Another boy was beating him. His father was once a white soldier in the great war, and the child grew up in Lahore. He played among my horses when he was very small. His father's regiment found him only last week, before they went to war. Now they mean to make a soldier of him, though I doubt he wants that. I merely took him for a ride. Tell me which barracks are yours, boy, and I will return you.
        - id: ch04-b17
          speaker: kim
          text: Let me down. I can find the barracks myself.
        - id: ch04-b18
          speaker: mahbub
          text: And if you run away, who will believe it wasn't my doing?
        - id: ch04-b19
          speaker: colonel
          text: He'll come back when he's hungry. Where could he run?
        - id: ch04-b20
          speaker: mahbub
          text: He was born here. He has friends and goes wherever he pleases. He's a sharp little fellow. Change his clothes, and in an instant he could pass for a low-caste Hindu boy.
        - id: ch04-b21
          speaker: colonel
          text: Could he indeed?
        - id: ch04-b22
          speaker: narrator
          text: The Englishman looked Kim over carefully as Mahbub turned toward the barracks. Kim ground his teeth. The faithless Afghan was making sport of him.
        - id: ch04-b23
          speaker: mahbub
          text: They'll send him to school, force heavy boots onto his feet, and wrap him in clothes like these. Soon he'll forget everything he knows. Now, which barracks are yours?
        - id: ch04-b24
          speaker: narrator
          text: Kim could not bring himself to speak. He pointed toward Father Victor's wing, glaring white nearby.
        - id: ch04-b25
          speaker: mahbub
          text: Perhaps he would make a good soldier. At least he would serve well as an orderly. Once I sent him all the way from Lahore with a message about the pedigree of a white stallion.
        - id: ch04-b26
          speaker: narrator
          text: It was the worst insult added to the worst injury. The very Sahib to whom Kim had so cleverly delivered that secret letter, the letter that woke a war, heard every word. In his mind, Kim watched Mahbub burn in flames for the betrayal. Ahead of himself, he saw only one long gray road of barracks, schools, and still more barracks.
        - id: ch04-b27
          speaker: narrator
          text: Kim pleaded with his eyes, but the Englishman's sharp face showed no recognition. Even now, Kim never thought of begging a white man for mercy or exposing the Afghan. Mahbub looked steadily at the Englishman. The Englishman looked just as steadily at the trembling, speechless boy.
        - id: ch04-b28
          speaker: mahbub
          text: My horse is well trained, Sahib. Another would have kicked.
        - id: ch04-b29
          speaker: colonel
          text: Ah. Who intends to make the boy a soldier?
        - id: ch04-b30
          speaker: mahbub
          text: He says it is the regiment that found him, especially their Padre-sahib.
        - id: ch04-b31
          speaker: kim
          text: There is the Padre now!
        - id: ch04-b32
          speaker: narrator
          text: Kim choked out the words as Father Victor hurried bareheaded from the veranda. Kim slid from the horse and stood helpless before him.
        - id: ch04-b33
          speaker: father_victor
          text: Powers of Darkness below, O'Hara! How many different sorts of friends do you have in Asia?
        - id: ch04-b34
          speaker: colonel
          text: Good morning, Padre. I know you well enough by reputation. I've meant to call on you. My name is Creighton.
        - id: ch04-b35
          speaker: father_victor
          text: Creighton of the Ethnological Survey?
        - id: ch04-b36
          speaker: narrator
          text: The Englishman nodded.
        - id: ch04-b37
          speaker: father_victor
          text: Faith, I'm glad to meet you. And I owe you thanks for bringing back this boy.
        - id: ch04-b38
          speaker: colonel
          text: I deserve none of them. The boy wasn't leaving. You don't know old Mahbub Ali yet. You will after a month here. He sells all of us our worst horses. But this boy is rather unusual. What can you tell me about him?
        - id: ch04-b39
          speaker: father_victor
          text: What can I tell you? You're the very man who may help with my puzzles. I'm bursting to tell the story to someone who understands the people here.
        - id: ch04-b40
          speaker: narrator
          text: A groom appeared around the corner. Colonel Creighton raised his voice and spoke to Mahbub in Urdu.
        - id: ch04-b41
          speaker: colonel
          text: Very good, Mahbub Ali, but your stories about that pony won't raise my offer. I will not pay one pice more than three hundred and fifty rupees.
        - id: ch04-b42
          speaker: mahbub
          text: The Sahib is hot and cross after his ride. Once he cools down, he will see the horse's virtues more clearly. I will wait beneath that tree until he finishes with the Padre.
        - id: ch04-b43
          speaker: colonel
          text: Confound you!
        - id: ch04-b44
          speaker: narrator
          text: The Colonel laughed.
        - id: ch04-b45
          speaker: colonel
          text: That's what comes of looking at one of Mahbub's horses. He's an old leech, Padre. Wait under your tree, then, if you have time to waste. Now I'm ready to hear you. Where did the boy go? Ah, he's whispering with Mahbub. A curious child. Would you ask someone to take my mare into the shade?
        - id: ch04-b46
          speaker: narrator
          text: Creighton settled into a chair with a clear view of Kim and Mahbub beneath the tree. Father Victor went inside for cigars.
        - id: ch04-b47
          speaker: kim
          text: Trust a Brahmin before a snake, a snake before a harlot, and a harlot before a Pathan, Mahbub Ali.
        - id: ch04-b48
          speaker: mahbub
          text: It makes no difference. A child should not judge a carpet while its pattern is still being woven. Believe me, Friend of all the World, I am doing you a great service. They will not turn you into a soldier.
        - id: ch04-b49
          speaker: narrator
          text: Creighton thought Mahbub a crafty old sinner, but also thought him right. If the boy matched the tale, he should not be wasted.
        - id: ch04-b50
          speaker: father_victor
          text: Give me half a minute. I'm finding all the documents.
        - id: ch04-b51
          speaker: mahbub
          text: Suppose this bold and wise Colonel helps you because of me. Suppose you rise to honor. When you are a man, how will you thank Mahbub Ali?
        - id: ch04-b52
          speaker: kim
          text: I asked you to let me return to the Road, where I would have been safe. Instead, you sold me back to the English. How much blood-money will they pay you?
        - id: ch04-b53
          speaker: narrator
          text: Creighton bit down on his cigar, amused by the cheerful young demon. Then he turned politely as Father Victor returned.
        - id: ch04-b54
          speaker: mahbub
          text: What are those letters the fat priest is waving at the Colonel? Stand behind the stallion and pretend to examine my bridle.
        - id: ch04-b55
          speaker: kim
          text: One is from my lama. He wrote it at Jagadhir Road and promised three hundred rupees each year for my schooling.
        - id: ch04-b56
          speaker: mahbub
          text: Oh, so the old Red Hat has money of that kind. Which school?
        - id: ch04-b57
          speaker: kim
          text: God knows. I think it's in Nucklao.
        - id: ch04-b58
          speaker: mahbub
          text: Yes, there is a large school there for the sons of Sahibs and half-Sahibs. I have seen it while selling horses. So the lama also loved the Friend of all the World?
        - id: ch04-b59
          speaker: kim
          text: Yes, and he never lied to me or carried me back into captivity.
        - id: ch04-b60
          speaker: mahbub
          text: No wonder the Padre cannot untangle the thread. Listen to him racing through the story! By Allah, your lama has sent what looks to me like a banker's note. I've handled a few of those. The Colonel is examining it now.
        - id: ch04-b61
          speaker: kim
          text: What help is any of that to me? You'll ride away, and they'll send me back to those empty rooms. There is nowhere comfortable to sleep, and the boys beat me.
        - id: ch04-b62
          speaker: mahbub
          text: I don't think they will. Be patient, child. Pathans are not faithless in everything. Only in horse dealing.
        - id: ch04-b63
          speaker: narrator
          text: Five minutes passed, then ten, then fifteen. Father Victor talked with great energy and kept stopping to ask questions. The Colonel answered them one by one.
        - id: ch04-b64
          speaker: father_victor
          text: Now you know everything I know about the boy, from start to finish, and telling it is a blessed relief. Have you ever heard anything like it?
        - id: ch04-b65
          speaker: colonel
          text: Whatever else it means, the old man has sent the money. Gobind Sahai's promises are honored from here to China. The more one learns about the people of this country, the less one can say what they will or won't do.
        - id: ch04-b66
          speaker: father_victor
          text: That's a comforting answer from the head of the Ethnological Survey. What defeats me is the mixture. There are Red Bulls, healing Rivers, poor heathen that he is, banker's notes, and Masonic papers. Are you a Mason, by chance?
        - id: ch04-b67
          speaker: colonel
          text: By Jove, I am. Now that you mention it, that gives us one more reason.
        - id: ch04-b68
          speaker: father_victor
          text: I'm glad you can see reasons anywhere in this. But think of the boy sitting on my bed with his shirt torn open and his white skin showing. He prophesied to our Colonel, and the prophecy came true! St. Xavier's will cure that nonsense, won't it?
        - id: ch04-b69
          speaker: colonel
          text: Sprinkle him with holy water.
        - id: ch04-b70
          speaker: narrator
          text: The Colonel laughed.
        - id: ch04-b71
          speaker: father_victor
          text: Sometimes I think I should. I hope to bring him up as a good Catholic. But what happens when the old beggar—
        - id: ch04-b72
          speaker: colonel
          text: Lama, my dear sir. Some lamas are gentlemen in their own country.
        - id: ch04-b73
          speaker: father_victor
          text: What happens when the lama fails to pay next year? He has a fine head for making a sudden plan, but he'll die someday. And should we take a heathen's money to give a child a Christian education?
        - id: ch04-b74
          speaker: colonel
          text: He told you plainly what he wanted. Once he learned the boy was white, he made his plans to fit. I would give a month's pay to hear how he explained it to the Tirthankars at Benares. I don't claim to know much about the people here, Padre, but if that man says he'll pay, the payment will come whether he is alive or dead. His heirs would take on the debt.
        - id: ch04-b75
          speaker: colonel
          text: Send the boy to Lucknow. If your Anglican chaplain thinks you've stolen an advantage over him—
        - id: ch04-b76
          speaker: father_victor
          text: Bad luck to Bennett! He was sent to the Front instead of me because Doughty called me medically unfit. If Doughty returns alive, I'll excommunicate him. Bennett ought to be satisfied with—
        - id: ch04-b77
          speaker: colonel
          text: The glory, while he leaves you the religion. Exactly. I doubt Bennett will object. Blame me if he does. I strongly recommend St. Xavier's. The boy can travel south on a soldier's orphan pass, which saves the railway fare. The regimental fund can buy his clothes, and the Lodge will be pleased to escape the cost of his schooling.
        - id: ch04-b78
          speaker: colonel
          text: It's quite simple. I have to go to Lucknow next week, so I'll watch over him on the journey and leave him with my servants when needed.
        - id: ch04-b79
          speaker: father_victor
          text: You're a good man.
        - id: ch04-b80
          speaker: colonel
          text: Not at all. Don't make that mistake. The lama sent money for a particular purpose. We cannot send it back, so we must do what he requested. Then it's settled. Hand the boy over to me at the southbound night train next Tuesday. That's only three days away. He can't cause too much trouble in three days.
        - id: ch04-b81
          speaker: father_victor
          text: You've lifted a weight from my mind. But what about this note? I don't know Gobind Sahai or his bank. For all I know, the bank is a hole in a wall.
        - id: ch04-b82
          speaker: colonel
          text: You were never a young officer in debt. I'll cash it for you and send the proper receipts.
        - id: ch04-b83
          speaker: father_victor
          text: With all your own work? That's asking too much.
        - id: ch04-b84
          speaker: colonel
          text: It truly is no trouble. As an ethnologist, I find the whole affair interesting. I may make a note about it for some Government work. Think how the Red Bull on a regimental badge became a kind of sacred sign that the boy followed.
        - id: ch04-b85
          speaker: father_victor
          text: I cannot thank you enough.
        - id: ch04-b86
          speaker: colonel
          text: There is one way. We men of the Ethnological Survey guard our discoveries like jealous jackdaws. No one else cares about them, but we behave like collectors fighting over books. So don't tell anyone about the Asiatic side of the boy, not his adventures or his prophecy. I'll draw those stories out of him later. You understand?
        - id: ch04-b87
          speaker: father_victor
          text: I do. You'll make a marvelous account of it. I won't say one word until I see it printed.
        - id: ch04-b88
          speaker: colonel
          text: Thank you. That goes straight to an ethnologist's heart. I must get back to breakfast. Good heavens, is Mahbub still waiting there?
        - id: ch04-b89
          speaker: narrator
          text: The Colonel raised his voice, and the horse dealer stepped out from the tree's shadow.
        - id: ch04-b90
          speaker: colonel
          text: Well, Mahbub, what is it now?
        - id: ch04-b91
          speaker: mahbub
          text: Consider the young horse, Sahib. A colt may be born for polo and follow the ball before anyone teaches him. If such a colt knows the game by instinct, it would be a great wrong to harness him to a heavy cart.
        - id: ch04-b92
          speaker: colonel
          text: I agree, Mahbub. This colt will play polo and nothing else. These horsemen think of nothing but horses, Padre. Come tomorrow if you truly have something worth selling.
        - id: ch04-b93
          speaker: narrator
          text: Mahbub saluted like a horseman, sweeping one hand outward. Then he bent close to the tormented Kim.
        - id: ch04-b94
          speaker: mahbub
          text: Have a little patience, Friend of all the World. Your fortune is made. Soon you will go to Nucklao. Here, take this and pay your letter writer. I think you and I will meet many more times.
        - id: ch04-b95
          speaker: narrator
          text: Mahbub cantered away down the road. From the veranda, Colonel Creighton addressed Kim in the language Kim knew best.
        - id: ch04-b96
          speaker: colonel
          text: Listen carefully. In three days you will travel with me to Lucknow, and all the way you may watch and listen to new things. Until then, stay where you are and do not run away. You will attend school in Lucknow.
        - id: ch04-b97
          speaker: kim
          text: Will I meet my Holy One there?
          emotion: sad
        - id: ch04-b98
          speaker: colonel
          text: Lucknow is at least closer to Benares than Umballa. Perhaps you will be under my protection. Mahbub Ali knows that, and he will be angry if you run back to the Road now. Remember, I have been told a great deal, and I do not forget it.
        - id: ch04-b99
          speaker: kim
          text: I'll wait. But the boys will beat me.
        - id: ch04-b100
          speaker: narrator
          text: Then the bugles sounded for dinner.
