  chapters:
    - id: ch01
      title: Under the Lamp at Delhi
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Who has longed for the Sea, for salt water without an end? Who has wanted the rise, pause, rush, and crash of a wave chased by the wind? There is the smooth, round swell before a storm, gray and enormous, growing without foam. There is the dead calm at the Line, and there is the wild hurricane with madness in its eyes. The Sea never shows the same face, yet beneath every face it remains the same Sea. It fills a sailor's whole being. In that same way, and in no other way, hillmen long for their Hills.
        - id: ch01-b02
          speaker: e23
          text: I have my wits again. Hunger and fear left me dazed, or I might have seen this way out sooner. I was right. They have come hunting for me. You have saved my head.
        - id: ch01-b03
          speaker: narrator
          text: E23 spoke beneath the uproar on the platform. Punjab policemen in yellow trousers pushed through the crowd, led by a young Englishman who was hot and sweating. A small fat man followed as quietly as a cat and looked like a lawyer's tout.
        - id: ch01-b04
          speaker: e23
          text: Look at the young Sahib reading that paper. He has my description. They are searching every carriage, the way fishermen drag a net through a pool.
        - id: ch01-b05
          speaker: narrator
          text: When they reached the compartment, E23 steadily counted his beads. Kim mocked him for being so drugged that he had lost the ringed fire tongs that marked a Saddhu. The lama stared ahead in deep meditation, while the farmer quietly gathered his belongings.
        - id: ch01-b06
          speaker: young_officer
          text: Nothing here but a bundle of holy men.
        - id: ch01-b07
          speaker: narrator
          text: He moved on. Uneasiness ran through the passengers, for people all over India expected native police to squeeze money from them.
        - id: ch01-b08
          speaker: e23
          text: One difficulty remains. I must send a telegram saying where I hid the letter I was sent to find, but I cannot enter the telegraph office dressed like this.
        - id: ch01-b09
          speaker: kim
          text: Was saving your neck not enough?
        - id: ch01-b10
          speaker: e23
          text: Not while the work remains unfinished. Did the healer of sick pearls never teach you that? Another Sahib is coming. Ah!
        - id: ch01-b11
          speaker: narrator
          text: A tall, sallow District Superintendent of Police came strutting along, complete with belt, helmet, polished spurs, and a dark moustache that he twirled as he walked.
        - id: ch01-b12
          speaker: kim
          text: What fools these Police Sahibs are!
        - id: ch01-b13
          speaker: e23
          text: Well said. I am going for water. Keep my place.
        - id: ch01-b14
          speaker: narrator
          text: His voice had changed. He stumbled out and nearly struck the Englishman, who swore at him in clumsy Urdu.
        - id: ch01-b15
          speaker: strickland
          text: Are you drunk? Do not crash about as if Delhi station belonged to you, my friend.
        - id: ch01-b16
          speaker: narrator
          text: Without moving a muscle of his face, E23 poured out such filthy abuse that Kim rejoiced. It reminded him of the drummer boys and barrack sweepers during his first terrible days at Umballa.
        - id: ch01-b17
          speaker: strickland
          text: My good fool, go back to your carriage.
        - id: ch01-b18
          speaker: narrator
          text: E23 retreated one respectful step at a time, lowering his voice as he climbed back aboard. He cursed the officer's furthest descendants, then invoked the Queen's Stone, the writing beneath it, and several Gods with names Kim had never heard. Kim almost jumped. The insults were a message.
        - id: ch01-b19
          speaker: strickland
          text: I cannot understand you, but I know that was blasted insolence. Come out of there!
          emotion: angry
        - id: ch01-b20
          speaker: narrator
          text: Pretending not to understand, E23 solemnly offered his ticket. The officer tore it from his hand.
        - id: ch01-b21
          speaker: farmer
          text: What oppression! And all because of a joke. Your charms are failing today, Holy One.
        - id: ch01-b22
          speaker: narrator
          text: The farmer had enjoyed the Saddhu's bold tongue. Now E23 followed the policeman with bows and pleas. The mass of passengers was too busy with babies and bundles to notice what had happened. Kim slipped out behind the pair. A memory had flashed into his mind. Three years before, near Umballa, he had heard this same angry and foolish-looking Sahib loudly discussing private matters with an old lady. That memory made Kim curious enough to follow.
        - id: ch01-b23
          speaker: e23
          text: It is done. He has gone to send word about the hidden letter. They told me he was in Peshawur, but I should have known. He is like a crocodile, always waiting at the other ford. He has pulled me out of danger, though I owe my life to you.
        - id: ch01-b24
          speaker: narrator
          text: They were jammed in the shouting crowd. A Persian greyhound pressed against E23's feet, and a cage of screaming hawks dug into his back.
        - id: ch01-b25
          speaker: kim
          text: Is he one of Us too?
        - id: ch01-b26
          speaker: e23
          text: He is among the greatest. Fortune has favored us both. I will report what you did, and now I am safe under his protection.
        - id: ch01-b27
          speaker: narrator
          text: E23 forced his way out of the crowd around the carriages and sat beside a bench near the telegraph office.
        - id: ch01-b28
          speaker: e23
          text: Go back before someone takes your seat. Do not fear for the work or for me. You gave me room to breathe, and Strickland Sahib pulled me ashore. We may yet work together in the Game. Farewell!
        - id: ch01-b29
          speaker: narrator
          text: Kim hurried back, delighted and confused, though irritated that he had no key to the secrets all around him.
        - id: ch01-b30
          speaker: kim
          text: I truly am only a beginner. I could never have jumped into safety as the Saddhu did. He knew the darkest place was beneath the lamp. I would never have thought of hiding news inside a curse, and the Sahib understood at once. Still, I saved one man's life. Holy One, where has the Kamboh gone?
        - id: ch01-b31
          speaker: lama
          text: Fear took hold of him. He watched you turn the Mahratta into a Saddhu in a blink, supposedly to protect him from evil. Then your Saddhu fell straight into the hands of the police. The farmer decided your art had changed a quiet trader into a man who insulted Sahibs. He feared you would do the same to him, so he gathered his son and fled. Where is the Saddhu now?
        - id: ch01-b32
          speaker: kim
          text: With the police. But I did save the Kamboh's child.
        - id: ch01-b33
          speaker: narrator
          text: The lama took a mild pinch of snuff.
        - id: ch01-b34
          speaker: lama
          text: Ah, chela, your own deeds have caught you. You healed the child only to gain merit. But you worked proudly upon the Mahratta, glancing sideways to amaze an old man and a foolish farmer. From that came fear and trouble.
        - id: ch01-b35
          speaker: narrator
          text: Kim mastered himself with an effort beyond his years. Like any boy, he hated swallowing an insult and hated being judged wrongly, but there was no easy answer.
        - id: ch01-b36
          speaker: kim
          text: It is true. Wherever I have offended you, I was wrong.
        - id: ch01-b37
          speaker: lama
          text: It is more than that. You have released an act into the world. Its consequences spread like ripples from a stone thrown into a pool, and you cannot know how far they will travel.
        - id: ch01-b38
          speaker: narrator
          text: Kim's ignorance protected both his pride and the lama's peace. At that moment, a coded telegram was being handed in at Simla. It reported E23's arrival at Delhi and, more importantly, the hiding place of the letter he had been ordered to steal. As one accidental result, an eager policeman had arrested an outraged cotton broker from Ajmir for a murder committed in a far southern State. The broker stood on Delhi platform explaining himself to Strickland, while E23 threaded through the side lanes and entered the locked heart of Delhi city.
        - id: ch01-b39
          speaker: narrator
          text: Within two hours, telegrams reached an angry southern minister saying that the bruised Mahratta had vanished. By the time Kim's slow train reached Saharunpore, the last ripple from his stone was touching the steps of a mosque in distant Roum, where it disturbed a devout man at prayer.
    - id: ch02
      title: Loose-Foot Through the Plains
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: Near a dew-wet screen of bougainvillea by the platform, the lama settled himself in the clear morning sun. His disciple was beside him, and his spirits rose.
        - id: ch02-b02
          speaker: lama
          text: We will leave these things behind us. The train is marvelous, but its jolting has turned my bones to water. From now on, we will travel in clean air.
        - id: ch02-b03
          speaker: kim
          text: Then let us go to the Kulu woman's house.
        - id: ch02-b04
          speaker: narrator
          text: Kim stepped cheerfully beneath their bundles. The early morning around Saharunpore smelled fresh. He remembered mornings at St. Xavier's, and the memory made his joy greater still.
        - id: ch02-b05
          speaker: lama
          text: Why this sudden haste? Wise men do not rush like chickens in the sun. We have crossed hundreds of miles, yet I have hardly had one quiet moment with you. How can you learn while crowds push around us? How can I meditate on the Way beneath a flood of talk?
        - id: ch02-b06
          speaker: kim
          text: Has her tongue grown no shorter with age, then?
        - id: ch02-b07
          speaker: lama
          text: Nor has her desire for charms. Once, while I explained the Wheel of Life, she cared only for the devils that trouble children. She may gain merit by feeding us later. Softly, softly. For now we will wander where the Chain of Things leads. The Search is sure.
        - id: ch02-b08
          speaker: narrator
          text: They moved easily among broad orchards heavy with bloom. They passed Aminabad, Sahaigunge, Akrola of the Ford, and little Phulesa. The Siwalik Hills stayed north of them, with the snows beyond. Nothing hurried them. The Road opened from village to village, while the far white line remained before the lama's eyes.
        - id: ch02-b09
          speaker: narrator
          text: After long, sweet sleep beneath dry stars, they entered each waking village at a lordly and unhurried pace. The lama held out his begging bowl without a word. Kim's eyes, defying the Rule, roamed from one edge of the sky to the other and missed very little. Once the bowl was filled, he returned on soft feet through the soft dust. His master waited beneath the dense shadow of a mango tree or the lighter shade cast by a white Doon siris. There they spread out what the village had given and rested without concern.
        - id: ch02-b10
          speaker: narrator
          text: They ate and drank at ease. After a little talk and travel, they slept through noon and met the world again when the air grew cool. At night they entered some new village that they had spotted across the rich land three hours before. As they walked, they considered where to stop and what welcome might await them.
        - id: ch02-b11
          speaker: narrator
          text: Each evening they told their story, and Kim made it a new one every time. A priest or headman always welcomed them, as kindly custom required.
        - id: ch02-b12
          speaker: narrator
          text: When the shadows shortened and the lama leaned harder upon Kim, out came the Wheel of Life. They held the great yellow chart flat with clean stones, and the lama guided Kim through each circle with a long straw.
        - id: ch02-b13
          speaker: narrator
          text: High above sat Gods who were dreams within dreams. Beneath them lay Heaven and the land of demi-Gods, where horsemen fought among hills. Animals suffered there too, their souls climbing or falling and therefore never to be disturbed. Lower still were hot and cold Hells, haunted by tormented ghosts. Kim obediently studied the punishment of overeating, the swollen belly and burning bowels.
        - id: ch02-b14
          speaker: narrator
          text: But when the straw reached the Human World, busy and useless just above the Hells, Kim's attention wandered. The Wheel itself rolled past on the road. People ate, drank, traded, married, and quarreled, all warmly alive.
        - id: ch02-b15
          speaker: narrator
          text: The lama often drew those living pictures into his lesson. Kim was always ready to look. The lama told him how flesh takes a thousand shapes. People call those shapes desirable or disgusting, though in truth neither judgment matters. The foolish spirit stays enslaved to the Hog, the Dove, and the Serpent. It hungers for betel nut, a new yoke of oxen, women, or the favor of kings. Bound to such desires, it follows the body through every Heaven and every Hell, then circles back again.
        - id: ch02-b16
          speaker: narrator
          text: Sometimes a watching woman or poor man laid flowers or cowries on the chart. It was enough for them to have met a Holy One who might remember them in his prayers.
        - id: ch02-b17
          speaker: lama
          text: Heal them when they are ill. Treat a fever, but never work charms. Remember what happened to the Mahratta.
        - id: ch02-b18
          speaker: kim
          text: Then is every action evil?
        - id: ch02-b19
          speaker: narrator
          text: Kim lay beneath a large tree at the fork of the Doon road, watching tiny ants cross his hand.
        - id: ch02-b20
          speaker: lama
          text: It is good to avoid action, except when action earns merit.
        - id: ch02-b21
          speaker: kim
          text: At the Gates of Learning, they taught us that a Sahib should never avoid action. And I am a Sahib.
        - id: ch02-b22
          speaker: lama
          text: Friend of all the World, I am old and still delighted by shows, like a child. But to those who follow the Way, there is no black or white, no Hind or Bhotiyal. We are only souls seeking freedom. Whatever the Sahibs taught you, when we reach my River you will be freed from every illusion beside me. My bones ache for that River as they ached in the train, but my spirit waits above my bones. The Search is sure!
        - id: ch02-b23
          speaker: kim
          text: You have answered me. May I ask one more thing?
        - id: ch02-b24
          speaker: narrator
          text: The lama bowed his head with dignity.
        - id: ch02-b25
          speaker: kim
          text: For three years I ate your bread, as you know. Holy One, where did the money come from?
        - id: ch02-b26
          speaker: lama
          text: In Bhotiyal there is much of what men call wealth. In my own country, I possess the illusion of honor. I ask for what I need, and my monastery keeps the accounts. Ah, the high black seats there, and all the novices in their places!
        - id: ch02-b27
          speaker: narrator
          text: Drawing with one finger in the dust, he told of immense and splendid ceremonies in cathedrals guarded by avalanches. He described long processions and devil dances, monks and nuns changing into pigs, and holy cities standing fifteen thousand feet in the air. He recalled schemes and quarrels between monasteries, voices calling among the hills, and a mysterious mirage that danced over dry snow. He even spoke of Lhassa and the Dalai Lama, whom he had once seen and worshiped.
        - id: ch02-b28
          speaker: narrator
          text: Each perfect day rose behind Kim like a wall, cutting him away from his race and his English speech. He began thinking and dreaming in the language of the road again. Without thought, he copied the lama's ceremonies at meals and at rest.
        - id: ch02-b29
          speaker: narrator
          text: As the lama's eyes turned toward the steady snows, his mind returned more and more to his monastery. The River no longer troubled him. At times he stared for a long while at a twig or tuft of grass, expecting the earth to split and give up its blessing. Yet he was content beside his disciple in the mild wind flowing from the Doon. This was not Ceylon, Buddh Gaya, Bombay, or the grass-covered ruins upon which he had somehow stumbled two years earlier.
        - id: ch02-b30
          speaker: narrator
          text: He spoke of those places like a scholar far removed from vanity. He was a Seeker walking humbly, an old man both wise and moderate, who could suddenly light his knowledge with brilliant understanding. He never told the whole journey at once. A sight beside the road would summon one memory, and that memory another, until bit by bit he had described his wanderings up and down Hind. Kim had loved him without reason. Now he loved him for fifty good reasons.
        - id: ch02-b31
          speaker: narrator
          text: So they lived in great happiness and obeyed the Rule. They avoided evil words and greedy wishes. They did not overeat, lie upon high beds, or dress in rich clothes. Their own stomachs told them the hour, and the people brought them food, just as the old saying promised. Without owning anything, they became lords of Aminabad, Sahaigunge, Akrola of the Ford, and little Phulesa. In Phulesa, Kim even gave his blessing to a woman whom he declared to have no soul.
        - id: ch02-b32
          speaker: narrator
          text: But news crosses India quickly. Too soon, a lean old Oorya servant with white whiskers shuffled over the fields. He carried fruit, Kabul grapes, and gilded oranges. His mistress was distressed that the lama had ignored her so long, and begged both travelers to honor her house.
        - id: ch02-b33
          speaker: lama
          text: Now I remember her. She is a virtuous woman, but she talks beyond all measure.
        - id: ch02-b34
          speaker: narrator
          text: Kim sat on the edge of a cattle trough telling stories to the village smith's children.
        - id: ch02-b35
          speaker: kim
          text: She only wants another son for her daughter. I have not forgotten her. Let her earn merit. Tell her we will come.
    - id: ch03
      title: The Sahiba's Courtyard
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: They crossed eleven miles of fields in two days. At the end, attention overwhelmed them. The old lady upheld a grand tradition of hospitality and forced her son-in-law to pay for it, though his women ruled him and he had to borrow from a moneylender to keep the peace.
        - id: ch03-b02
          speaker: narrator
          text: Age had weakened neither her tongue nor her memory. From a carefully barred upper window, with a dozen servants listening, she praised Kim in terms that would have shocked a European audience.
        - id: ch03-b03
          speaker: sahiba
          text: You are still the shameless little beggar from the resting place. I remember you. Wash and eat. My daughter's husband is away, so we poor women are helpless and silent.
        - id: ch03-b04
          speaker: narrator
          text: To prove how silent and useless the women had become, she scolded the entire household without mercy until food and drink appeared. Evening settled across the fields, smoke-scented and colored copper-brown and turquoise. The Sahiba ordered her palanquin carried into the untidy front courtyard and set down by the light of smoking torches. The curtains were drawn, though not too closely for her purposes, and from inside them she settled down to gossip with her guests.
        - id: ch03-b05
          speaker: sahiba
          text: Had the Holy One come alone, I would have welcomed him differently. With this rogue beside him, a woman must be careful.
        - id: ch03-b06
          speaker: kim
          text: Maharanee, was it my fault that a Police Sahib called you a woman whose face—
        - id: ch03-b07
          speaker: sahiba
          text: Hush! That happened on pilgrimage. When people travel, you know the proverb.
        - id: ch03-b08
          speaker: kim
          text: He called the Maharanee a Breaker of Hearts and a Giver of Delight, did he not?
        - id: ch03-b09
          speaker: sahiba
          text: You remembered! It was true in the days when my beauty flowered. Now tell me where you have been, at least what can be told without shame. How many girls and married women hang from your eyelashes? Did you come from Benares? I would have gone again this year, but my daughter has only two sons. Bah! That comes of these low plains. In Kulu, men are elephants.
        - id: ch03-b10
          speaker: sahiba
          text: Stand aside, rogue. I need your Holy One to make a charm for the terrible wind pains that strike my daughter's eldest boy in mango season. Two years ago, he gave me a powerful spell.
        - id: ch03-b11
          speaker: kim
          text: Oh, Holy One!
        - id: ch03-b12
          speaker: narrator
          text: Kim bubbled with laughter at the lama's unhappy face.
        - id: ch03-b13
          speaker: lama
          text: It is true. I gave her a charm against wind.
        - id: ch03-b14
          speaker: sahiba
          text: It was for his teeth! His teeth!
        - id: ch03-b15
          speaker: kim
          text: Heal the sick, but never work charms. Remember what happened to the Mahratta.
        - id: ch03-b16
          speaker: lama
          text: That was two rainy seasons ago. She exhausted me with begging. For three whole days, while the child was sick, she talked without stopping. See, chela, how idle women push even followers of the Way aside.
        - id: ch03-b17
          speaker: sahiba
          text: Who else could I talk to? The mother knew nothing. It was a cold-weather night, and the father merely told me to pray to the Gods. Then he rolled over and snored!
        - id: ch03-b18
          speaker: lama
          text: So I gave her the charm. What else could an old man do?
        - id: ch03-b19
          speaker: kim
          text: Avoid action, except when it earns merit.
        - id: ch03-b20
          speaker: lama
          text: Ah, chela, if you abandon me, I stand alone.
        - id: ch03-b21
          speaker: sahiba
          text: At least his milk teeth came through easily. Still, all priests are alike.
        - id: ch03-b22
          speaker: narrator
          text: Kim coughed sternly. He was young enough to dislike such disrespect.
        - id: ch03-b23
          speaker: kim
          text: Trouble comes to those who pester the wise at the wrong time.
        - id: ch03-b24
          speaker: sahiba
          text: A talking mynah above the stables has copied that very tone from our family priest. Perhaps I forget the honor owed to guests, but you did not see the child double both fists into his belly. His stomach was round as a half-grown gourd, and he cried out that the pain was there. If you had seen him, you would forgive me. I am half inclined to try the hakim's medicine. He sells it cheaply, and it has certainly made him as fat as Shiv's own bull. Unlike you, he does not deny people remedies. Still, for the child's sake, I distrusted the unlucky colors of those bottles.
        - id: ch03-b25
          speaker: narrator
          text: While she talked, the lama quietly disappeared into the darkness toward his room.
        - id: ch03-b26
          speaker: kim
          text: I think you have angered him.
        - id: ch03-b27
          speaker: sahiba
          text: Nonsense. He is tired, and I forgot because I am a grandmother. Only grandmothers should manage children. Mothers are good for bearing them. Tomorrow he will see how my grandson has grown, write the charm, and judge the new hakim's medicine.
        - id: ch03-b28
          speaker: kim
          text: Who is this hakim, Maharanee?
        - id: ch03-b29
          speaker: sahiba
          text: A traveler like you, but a very sober Bengali doctor from Dacca and a master of medicine. One little pill cured the heaviness I felt after eating, and it worked like a devil set loose. He now travels from place to place selling valuable preparations. He even carries papers printed in English that describe everything he has done for weak-backed men and weary women. He has stayed here for four days. When he heard you were coming, I think he hid himself. Doctors and priests are tiger and snake wherever they meet.
        - id: ch03-b30
          speaker: old_servant
          text: This house is becoming a cattle pen for every fraud and priest. The boy should stop eating mangoes, but who can argue with a grandmother? Sahiba, the hakim is asleep after his meal. He is lodged behind the dovecote.
        - id: ch03-b31
          speaker: narrator
          text: Kim bristled like a terrier waiting for a fight. Outtalking a noisy, Calcutta-trained Bengali drug seller from Dacca would be splendid sport. He would not let such a man displace the lama, or himself along with him. Kim knew the strange, clumsy English advertisements printed on the backs of native newspapers. Boys at St. Xavier's smuggled them into school and laughed over them together, because the grateful patients described every symptom in language that was both simple and far too revealing. The old servant slipped toward the dovecote, not at all unwilling to turn one household guest against another.
        - id: ch03-b32
          speaker: kim
          text: These men sell a little colored water and a great deal of shamelessness. They hunt ruined kings and Bengalis who have eaten too much. They profit most from children who have not even been born.
        - id: ch03-b33
          speaker: sahiba
          text: Do not be jealous. Charms are better, are they? I never denied it. Make sure your Holy One gives me a proper amulet by morning.
        - id: ch03-b34
          speaker: hurree
          text: Only the ignorant deny the worth of charms, and only the ignorant deny the worth of medicines.
        - id: ch03-b35
          speaker: narrator
          text: A heavy voice rolled from the darkness as a figure squatted nearby.
        - id: ch03-b36
          speaker: kim
          text: A rat once found a piece of turmeric and announced that he would open a grocer's shop.
        - id: ch03-b37
          speaker: narrator
          text: The battle had begun. Inside the palanquin, the old lady became very still and listened.
        - id: ch03-b38
          speaker: hurree
          text: A priest's son learns his nurse's name and the names of three Gods. Then he cries, listen to me, or I shall curse you by all three million Great Ones. I myself teach only the alphabet, though I learned the full wisdom of the Sahibs.
        - id: ch03-b39
          speaker: sahiba
          text: Sahibs never grow old. They dance and play like children even as grandfathers. They are a strong-backed race.
        - id: ch03-b40
          speaker: hurree
          text: I also possess medicines for the heated minds of angry men. I have sena mixed beneath the proper moon, yellow earths, Chinese arplan that renews a man's youth and amazes his household, Kashmir saffron, and Kabul's finest salep. Many people have died before—
        - id: ch03-b41
          speaker: kim
          text: I can readily believe that.
        - id: ch03-b42
          speaker: hurree
          text: They died before learning the value of my remedies. I do not offer patients the ink washed from a charm. My hot, tearing medicines descend into the body and wrestle with the evil itself.
        - id: ch03-b43
          speaker: sahiba
          text: They wrestle very powerfully indeed.
        - id: ch03-b44
          speaker: narrator
          text: The hidden doctor launched into a huge account of his misfortunes and bankruptcy. Every part of it was decorated with respectful appeals to the Government. His voice rolled on through the darkness as though one disaster had naturally produced the next.
        - id: ch03-b45
          speaker: hurree
          text: If fate had not ruled against me, I would now hold a Government post. I possess a degree from the great school in Calcutta. Perhaps the son of this house will study there one day.
        - id: ch03-b46
          speaker: sahiba
          text: He certainly will. If our neighbor's brat can become an F.A. after a few years, children as clever as ours will carry away Calcutta's richest prizes.
        - id: ch03-b47
          speaker: hurree
          text: Never have I seen such a child. He was born at a fortunate hour and is destined for long life, unless his colic becomes black cholera and carries him away like a pigeon.
        - id: ch03-b48
          speaker: sahiba
          text: Hai mai! Praising children brings bad luck, or I could listen all night. But the back of the house is unguarded, the father is away, and even in this soft air men imagine they are men. We know what women are. In my old age, I must stand watch. Lift the palanquin! Leave the hakim and young priest to decide whether medicine or charms are stronger. Bring our guests tobacco. I am going around the homestead!
        - id: ch03-b49
          speaker: narrator
          text: The palanquin swayed away among scattered torches and a pack of dogs. Twenty villages knew the Sahiba's sharp tongue, faults, and great charity. By custom older than anyone could remember, those same villages cheated her whenever they could. Yet no reward under heaven could have persuaded a man to steal or rob anywhere beneath her rule. She still made a grand show of these official inspections, and the clamor of each one could be heard halfway to Mussoorie.
    - id: ch04
      title: The Hakim Unmasked
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: Kim relaxed, as one wise man may when he meets another. The hakim pushed over his hookah with his foot, and Kim drew on the good tobacco. The servants expected a grave medical argument and perhaps free treatment.
        - id: ch04-b02
          speaker: hurree
          text: Discussing medicine before ignorant people is like teaching a peacock to sing.
        - id: ch04-b03
          speaker: kim
          text: True courtesy often means paying no attention.
        - id: ch04-b04
          speaker: narrator
          text: These were polished public manners, meant to impress the household.
        - id: ch04-b05
          speaker: scullion
          text: I have an ulcer on my leg. Look at it!
        - id: ch04-b06
          speaker: hurree
          text: Go away! Do honored guests here get pestered by crowds of buffaloes?
        - id: ch04-b07
          speaker: kim
          text: If the Sahiba heard of this—
        - id: ch04-b08
          speaker: scullion
          text: Come away. They are only here for our mistress. Perhaps after her little devil's colic is cured, poor people like us may receive help.
        - id: ch04-b09
          speaker: old_servant
          text: The mistress fed your wife while you were jailed for breaking the moneylender's head. Who dares speak against her? I answer for this house's honor. Go!
        - id: ch04-b10
          speaker: narrator
          text: The old servant drove the others away. Then the hakim barely moved his lips.
        - id: ch04-b11
          speaker: hurree
          text: How do you do, Mister O'Hara? I am very glad to see you again.
        - id: ch04-b12
          speaker: narrator
          text: Kim's hand tightened around the pipe. On the open road, the surprise might have been smaller. Here, in this quiet corner, he had never expected Hurree Babu. Worse, Hurree had fooled him.
        - id: ch04-b13
          speaker: hurree
          text: Ah ha! At Lucknow I told you, resurgam. I would rise again, and you would not know me. How much did you wager?
        - id: ch04-b14
          speaker: narrator
          text: Hurree slowly chewed cardamom seeds, though his breathing was uneasy.
        - id: ch04-b15
          speaker: kim
          text: Why have you come here, Babuji?
        - id: ch04-b16
          speaker: hurree
          text: Ah, that is the question, as Shakespeare says. I came to congratulate you on your wonderfully efficient work at Delhi. We are all proud of you. It was very neat and handy. Our mutual friend is an old friend of mine. He has survived some horribly tight places and will surely see more of them. He gave me the account, I passed it to Mister Lurgan, and Mister Lurgan is pleased that you graduated so nicely. The whole Department is pleased with what you did.
        - id: ch04-b17
          speaker: narrator
          text: For the first time, Kim felt the pure pride of praise from fellow workers who understood his work. Nothing else could match it, though such praise can become a deadly trap. But the Eastern half of him warned that Babus did not travel far merely to hand out compliments.
        - id: ch04-b18
          speaker: kim
          text: Tell me the tale, Babu.
        - id: ch04-b19
          speaker: hurree
          text: It is nothing. I happened to be in Simla when the telegram arrived about the thing our friend had hidden. Old Creighton—
        - id: ch04-b20
          speaker: narrator
          text: Hurree watched to see whether Kim would tolerate that bold familiarity.
        - id: ch04-b21
          speaker: kim
          text: You mean Colonel Sahib.
        - id: ch04-b22
          speaker: hurree
          text: Of course. He found me free and sent me south to Chitor for that beastly letter. I dislike the South and all its railway travel, but the allowance was good. On my way back, I met our friend at Delhi. He is keeping quiet now and finds the Saddhu disguise suits him. There I heard how quickly and cleverly you acted. I told him you took the prize. Splendid! That is why I came.
        - id: ch04-b23
          speaker: kim
          text: I hear you. Go on.
        - id: ch04-b24
          speaker: narrator
          text: Frogs called in the ditches, the moon sank, and somewhere a happy servant beat a drum into the night. Kim changed to the language of the road.
        - id: ch04-b25
          speaker: kim
          text: How did you track us?
        - id: ch04-b26
          speaker: hurree
          text: That was simple. Our mutual friend told me you were going to Saharunpore, and a Red Lama is not easy to hide. I bought a medicine box, for I truly am a good doctor, and made my way to Akrola of the Ford. I talked to one person here and another there. All the common people knew what you and the lama had done. When the hospitable old lady sent out her palanquin, I knew exactly where you were going, because everyone remembered the lama's former visits. I also know that old ladies cannot keep away from medicines. So I became a doctor and arrived first. You heard my professional talk. It was rather good, do you not think? My word, Mister O'Hara, common people know you and the lama for fifty miles around. Do you mind being so famous?
        - id: ch04-b27
          speaker: kim
          text: Babuji, I am a Sahib, and I mean to play the Great Game.
        - id: ch04-b28
          speaker: hurree
          text: At present, you are below me in the Department.
        - id: ch04-b29
          speaker: kim
          text: Then stop chattering like an ape in a tree. A man does not follow someone from Simla and change his clothes merely to offer sweet words. I am no child. Speak Hindi and give me the yolk of the egg. You have hardly spoken one true word in ten. Why are you here? Answer plainly.
        - id: ch04-b30
          speaker: hurree
          text: Europeans find that very unsettling, Mister O'Hara. At your age, you should know better.
        - id: ch04-b31
          speaker: kim
          text: I want the truth. If this is the Game, perhaps I can help. How can I do anything while you babble around the whole shop?
        - id: ch04-b32
          speaker: narrator
          text: Hurree took the pipe and sucked until it bubbled.
        - id: ch04-b33
          speaker: hurree
          text: I will speak plainly now. Sit still, Mister O'Hara. This concerns the pedigree of a white stallion.
        - id: ch04-b34
          speaker: kim
          text: Again? That business ended long ago.
        - id: ch04-b35
          speaker: hurree
          text: The Great Game ends only when everyone is dead. Listen to all of it. Three years ago, when Mahbub Ali gave you that pedigree, five kings were preparing a sudden war. Because of the warning, our army struck before they were ready.
        - id: ch04-b36
          speaker: kim
          text: Yes. Eight thousand men and guns. I remember the night.
        - id: ch04-b37
          speaker: hurree
          text: The Government did not finish the war. That is the Government's habit. It decided the five kings were frightened and called the troops home, because feeding men in the high passes costs money. The rulers of Hilas and Bunar owned guns and offered to guard the passes against anyone entering from the North. For a price, naturally. They protested that they feared us and loved us. Officially, of course, I tell you this only to explain the political situation. I am forbidden to criticize the acts of my superiors.
        - id: ch04-b38
          speaker: hurree
          text: The Government was pleased to avoid expense and made a formal agreement. As soon as the State troops withdrew, Hilas and Bunar would receive a fixed number of rupees each month for guarding the passes. After selling tea in Leh, I became an army accounts clerk. When the troops marched away, I remained behind to pay the laborers who cut new roads through the Hills. That road building was another part of the agreement between the two kings and the Government.
        - id: ch04-b39
          speaker: kim
          text: And then what happened?
        - id: ch04-b40
          speaker: hurree
          text: Once summer ended, the cold became beastly. Every night I expected the Bunar men to cut my throat and take the pay chest. My native guards laughed at my fear. Never mind that. I repeatedly sent word that the two kings had sold themselves to the North, and Mahbub Ali, working still farther north, fully confirmed my warning. Nothing was done. Only my feet froze, and one toe dropped away. I sent another report. The roads whose laborers I paid with Government rupees were being prepared for the feet of strangers and enemies. Even the men digging them understood it.
        - id: ch04-b41
          speaker: kim
          text: Prepared for whom?
        - id: ch04-b42
          speaker: hurree
          text: Russians. The road workers joked openly about it. I was called south to explain in person, and Mahbub came too. Now see what followed. After this year's snow melted, two strangers crossed the passes pretending to hunt wild goats. They carry guns, but also chains, levels, and compasses.
        - id: ch04-b43
          speaker: kim
          text: Ah! Now the shape of it appears.
        - id: ch04-b44
          speaker: hurree
          text: Hilas and Bunar welcomed them warmly. They made great promises and spoke for an emperor who would send gifts. Up one valley and down the next, they pointed out a place for a breastwork, another for a fort, and another where the road could be held against an army. Those were the very roads for which I had paid out rupees each month. The Government knew, yet did nothing. The other three kings, who had received no money for guarding the passes, sent runners to report the bad faith of Hilas and Bunar. Only after the two strangers had made all five kings believe that a great army might sweep through tomorrow or the next day did the order come. Hurree Babu must go north and discover what they were doing.
        - id: ch04-b45
          speaker: hurree
          text: I told Colonel Creighton that this was not a lawsuit requiring evidence. Why not quietly order some brave man to poison them as an example? Such delay was shameful. He only laughed. It is English pride. You imagine nobody dares conspire against you. Tommy-rot!
        - id: ch04-b46
          speaker: narrator
          text: Kim smoked slowly and turned over as much of the matter as he understood.
        - id: ch04-b47
          speaker: kim
          text: So you are going out to follow the strangers?
        - id: ch04-b48
          speaker: hurree
          text: No, I am going to meet them. They are traveling toward Simla so the horns and heads they shot can be sent to Calcutta and mounted. They are officially nothing but sporting gentlemen, and the Government has granted them special conveniences. We always treat such visitors generously. British pride insists upon it. I mean to join them before they come down and walk beside them all the way to Simla.
        - id: ch04-b49
          speaker: kim
          text: Then what danger do they present?
        - id: ch04-b50
          speaker: hurree
          text: They are not black men. I can manage black men easily. These are Russians, and Russians have no scruples. I do not wish to enter their camp without a witness.
        - id: ch04-b51
          speaker: kim
          text: Do you think they will kill you?
        - id: ch04-b52
          speaker: hurree
          text: Death is a small matter. As a good follower of Herbert Spencer, I accept whatever fate brings. But they might beat me.
        - id: ch04-b53
          speaker: kim
          text: Why would they do that?
        - id: ch04-b54
          speaker: hurree
          text: I must attach myself to their camp in some extra position. Perhaps I will be an interpreter, or a harmless fool with an empty stomach, or anything else they might tolerate. Then I must pick up every fact I can. For me, that part is as easy as pretending to be the old lady's doctor. But I am an Asiatic, and in some situations that is a serious disadvantage. Worse still, I am a Bengali, and therefore a fearful man.
        - id: ch04-b55
          speaker: kim
          text: God made both the hare and the Bengali. Where is the shame in that?
        - id: ch04-b56
          speaker: hurree
          text: Evolution from primal necessity made us, I think, but the fact remains. I am terribly fearful. Once, on the road toward Lhassa, men threatened to cut off my head. No, I have never actually reached Lhassa. I sat down and cried while imagining every Chinese torture before it happened. I do not suppose these two gentlemen will torture me. Still, a wise man prepares for every possible accident. I would feel much safer with European assistance close enough to reach me in an emergency.
        - id: ch04-b57
          speaker: hurree
          text: This request is completely unofficial, and you may refuse it. If you have no urgent duty with your old man, perhaps you could turn his wishes northward, or perhaps I could attract his interest. I want you to remain in Departmental touch with me until I find those sporting fellows. Since I met our friend at Delhi, my opinion of your abilities has become very high. When the matter is finally judged, I will also place your name in my official report. That will be a fine feather in your cap. Now you have the real reason I came.
        - id: ch04-b58
          speaker: kim
          text: I believe the end of your story. How much of the beginning was true?
        - id: ch04-b59
          speaker: hurree
          text: The part about the five kings contains far more truth than you would guess. Will you come? I travel through the green Doon to Mussoorie, then by Rampur into Chini. That is the only route the strangers can take. I dislike waiting in the cold, but I must. One Russian is actually French, and I speak French rather well because I have friends in Chandernagore.
        - id: ch04-b60
          speaker: kim
          text: He would be glad to see the Hills again. For ten days, he has spoken of little else. If we travel together—
        - id: ch04-b61
          speaker: hurree
          text: We can appear to be complete strangers on the road if your lama prefers. I will remain four or five miles ahead of you. There is no hurry for Hurree. That is a European pun. We have plenty of time, because the strangers will stop to plot, survey, and map everything. I leave tomorrow. If you choose, you and the lama can follow the next day. Think it over until morning. By Jove, it is almost morning already.
        - id: ch04-b62
          speaker: narrator
          text: With a huge yawn and no farewell, Hurree lumbered off to bed. Kim hardly slept. His thoughts raced in the language of Hind.
        - id: ch04-b63
          speaker: kim
          text: The Game is well named. At Quetta, I spent four days as a kitchen boy, serving the wife of the very man whose book I stole. That strange little task belonged to the Great Game too. From the South, from only God knows how far away, the Mahratta came north while playing the Game in fear for his life. Now I will travel far into the North and play it there. Truly, the Game runs backward and forward like a shuttle through all Hind.
        - id: ch04-b64
          speaker: kim
          text: My share in it and my joy come from the lama. Mahbub Ali and Creighton Sahib helped, but chiefly it was the Holy One. He is right. This is a great and wonderful world, and I am Kim, one person alone in the center of it. I will see those strangers with their levels and chains.
    - id: ch05
      title: The Road Turns North
      blocks:
        - id: ch05-b01
          speaker: lama
          text: What came of all that babbling last night?
        - id: ch05-b02
          speaker: narrator
          text: The lama had finished his morning prayers.
        - id: ch05-b03
          speaker: kim
          text: A wandering medicine seller had attached himself to the Sahiba. I defeated him with argument and prayer, proving that our charms were better than his colored water.
        - id: ch05-b04
          speaker: lama
          text: Alas for my charms! Does the virtuous woman still demand another?
        - id: ch05-b05
          speaker: kim
          text: With all her strength.
        - id: ch05-b06
          speaker: lama
          text: Then I must write it, or her noise will deafen me.
        - id: ch05-b07
          speaker: narrator
          text: He searched through his pencil case.
        - id: ch05-b08
          speaker: kim
          text: There are always too many people on the Plains. I understand that the Hills hold fewer.
        - id: ch05-b09
          speaker: lama
          text: Ah, the Hills, and the snow upon them! But what do you know of the Hills?
        - id: ch05-b10
          speaker: narrator
          text: The lama tore off a tiny square of paper for the amulet. Kim opened the door. Across the morning, the long peaceful Himalayas glowed with gold.
        - id: ch05-b11
          speaker: kim
          text: They are very near. I have never entered them except while dressed as a Sahib.
        - id: ch05-b12
          speaker: narrator
          text: The lama lifted his face and breathed the wind with longing.
        - id: ch05-b13
          speaker: kim
          text: If we turn north, could we not escape much of the midday heat by walking among the lower hills? Is the charm ready, Holy One?
        - id: ch05-b14
          speaker: lama
          text: I have written the names of seven foolish devils, and not one is worth a speck of dust in the eye. See how silly women drag us away from the Way!
        - id: ch05-b15
          speaker: narrator
          text: Hurree emerged from behind the dovecote and made a great ceremony of cleaning his teeth. He was full-fleshed and heavy in the hips, with a bull neck and a deep voice. Nothing in his appearance suggested a fearful man. Kim gave him a sign so small that nobody else could have noticed it. Everything was moving as they had planned.
        - id: ch05-b16
          speaker: narrator
          text: After washing, Hurree approached the lama with flowing courtesy. They ate separately. Then the old lady, half veiled behind a window, returned to the urgent question of green-mango colic in children.
        - id: ch05-b17
          speaker: narrator
          text: The lama's medical knowledge rested on sympathy rather than science. He believed that dung from a black horse, mixed with sulfur and carried inside snakeskin, was a reliable cure for cholera. Even then, the symbols interested him much more than the medicine. Hurree listened to every opinion with enchanting respect, never pressing his own learning forward. His courtesy pleased the lama so much that the old man called him a truly courteous physician.
        - id: ch05-b18
          speaker: hurree
          text: Holy One, I merely dabble at the edge of these mysteries, but thank the Gods I can recognize a master. The Sahibs taught me in Calcutta's grand halls, where expense means nothing. Yet beyond earthly wisdom lies the high, lonely knowledge found in meditation.
        - id: ch05-b19
          speaker: narrator
          text: Kim watched with envy. The nervous, oily Hurree he knew had vanished. So had the brazen medicine seller of the night. In their place sat a polished and attentive man of learning, hardship, and experience, gathering wisdom from the lama.
        - id: ch05-b20
          speaker: sahiba
          text: Their talk has risen beyond me. Give me a charm with plenty of ink. I can wash it into water, swallow it, and be finished. Otherwise, what use are the Gods?
        - id: ch05-b21
          speaker: narrator
          text: The Sahiba preferred people to theories. She told Kim about minor kings she had known, her youth and beauty, the damage done by leopards, and the odd turns taken by love in Asia. She moved on to taxes, crushing rents, funeral customs, the care of children, and her son-in-law, whom she criticized without quite naming. Last came the modern age and its terrible lack of decency. Kim loved the life of this world as deeply as she did, though hers was nearly over. He sat with his feet tucked beneath the hem of his robe and drank in every word. Nearby, the lama patiently destroyed each new theory of bodily healing that Hurree offered him.
        - id: ch05-b22
          speaker: narrator
          text: At noon, Hurree strapped up his brass-bound medicine box. He carried his shiny formal shoes in one hand and a bright blue-and-white umbrella in the other. Then he started north toward the Doon, where he claimed the smaller kings needed his services.
        - id: ch05-b23
          speaker: lama
          text: We will follow in the cool evening, chela. That doctor is learned in medicine and courtesy. He says the people in the lower hills are devout and generous, with great need of a teacher. Before long, he says, we will reach cool air scented with pine.
        - id: ch05-b24
          speaker: sahiba
          text: You are going to the Hills by the Kulu road? Three times fortunate! If this household did not need my care, I would take my palanquin and go as well. No, that would be shameless, and my reputation would crack. I know the road, every single march of it. You will find charity everywhere. Nobody refuses it to men who look respectable. I shall order provisions for your journey. You will not take a servant to start you on your way? Then I will at least cook good food for you.
        - id: ch05-b25
          speaker: old_servant
          text: What a woman our Sahiba is! She has never forgotten a friend or an enemy. And her cooking! Wah!
        - id: ch05-b26
          speaker: narrator
          text: A roar rose near the kitchens as the Sahiba took charge. Soon there were cakes and sweetmeats. There was cold chicken cooked to shreds with rice and prunes. She prepared so much food for the road that the provisions weighed on Kim like a mule's burden.
        - id: ch05-b27
          speaker: sahiba
          text: I am old and useless. Nobody loves me now, and nobody respects me. Yet when I call upon the Gods and sit beside my cooking pots, there are few women who can compare with me. Come back, people of good will. Holy One and disciple, this room will always be prepared, and your welcome will always be ready. Watch the women of Kulu. Do not let them follow your chela too openly. And you, chela, make sure the Holy One does not run away when he smells his Hills again. Hai! Do not tip that rice bag upside down! Bless this household, Holy One, and forgive your servant for all her foolishness.
        - id: ch05-b28
          speaker: narrator
          text: She wiped her red old eyes on her veil and made a thick sound in her throat.
        - id: ch05-b29
          speaker: lama
          text: Women talk. It is their weakness. Yet I gave her the charm. She remains caught on the Wheel and devoted to the shows of this life. Even so, chela, she is virtuous, kind, generous, and wholehearted. Who can say she earns no merit?
        - id: ch05-b30
          speaker: kim
          text: Not I, Holy One. Behind my eyes, I tried to imagine her freed from the Wheel, wanting nothing and causing nothing, like a nun.
        - id: ch05-b31
          speaker: lama
          text: And what did you see, you imp?
        - id: ch05-b32
          speaker: kim
          text: I could not make the picture.
        - id: ch05-b33
          speaker: lama
          text: Nor could I. But she has millions of lives ahead. Perhaps she will gain a little wisdom in each.
        - id: ch05-b34
          speaker: kim
          text: Along that road, will she forget how to cook stew with saffron?
        - id: ch05-b35
          speaker: lama
          text: Your thoughts cling to unworthy things. Still, she has great skill. Her food has refreshed me from head to foot. The hakim spoke truly this morning when he said a single breath from the snows can blow twenty years away from a man's life.
        - id: ch05-b36
          speaker: lama
          text: We will climb into the Hills, into the high Hills, for a little while. We will hear snow water running and wind sounding through the trees. The hakim says we can return to the Plains whenever we wish, because we will only be skirting pleasant places. He is full of learning, yet he shows no pride. While you talked with the Sahiba, I told him of the dizziness that takes hold of the back of my neck at night. He said too much heat causes it, and cool air will cure it. After considering his answer, I marveled that I had failed to see so simple a remedy myself.
        - id: ch05-b37
          speaker: kim
          text: Did you tell him about your Search?
        - id: ch05-b38
          speaker: narrator
          text: Jealousy touched Kim. He preferred to guide the lama with his own words, not through Hurree's tricks.
        - id: ch05-b39
          speaker: lama
          text: Certainly. I told him my dream and how I earned merit by arranging your education.
        - id: ch05-b40
          speaker: kim
          text: You did not tell him I was a Sahib?
        - id: ch05-b41
          speaker: lama
          text: Why should I tell him? I have said many times that we are only two souls seeking freedom. He rightly explained that the River of Healing will break forth at my feet if that is needed, exactly as it appeared in my dream. Once I have found the Way, and that Way frees me from the Wheel, why should I trouble myself with finding a road through the ordinary fields of earth? Those fields and roads are no more than illusion. To worry over them would be senseless.
        - id: ch05-b42
          speaker: lama
          text: I have my dreams repeated night after night. I have the Jataka, and I have you, Friend of all the World. Your horoscope promised that a Red Bull on a green field would bring you honor. I saw the prophecy fulfilled, and I was its instrument. In return, you will be the instrument that finds my River. The Search is sure!
        - id: ch05-b43
          speaker: narrator
          text: The lama set his ivory-yellow face toward the beckoning Hills. It was serene, untroubled, and completely free of doubt. The sun stood behind him, and across the dusty road his long shadow seemed to shoulder its way far ahead, already climbing north before either traveler had taken the first step.
