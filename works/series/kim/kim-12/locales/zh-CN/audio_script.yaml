audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts: {delivery: "从容而机敏的讲述", timbre: "温暖清晰", pace: "舒展而有变化", pitch: "中音"}
    kim:
      display_name: 金
      tts: {delivery: "机灵大胆，话里常带笑", timbre: "明亮的少年声", pace: "轻快敏捷", pitch: "中高音"}
    hurree:
      display_name: 胡里·钱德尔·穆克吉
      tts: {delivery: "一本正经而滔滔不绝，英语腔调夸张", timbre: "厚重圆润", pace: "稍快", pitch: "中音"}
    lama:
      display_name: 德舒喇嘛
      tts: {delivery: "慈爱虔诚，沉思中透着天真", timbre: "清瘦柔和的老人声", pace: "从容缓慢", pitch: "中低音"}
    jatt:
      display_name: 甘波族农夫
      tts: {delivery: "粗豪直率，爱子心切", timbre: "洪亮粗厚", pace: "明快而有起伏", pitch: "中低音"}
    e23:
      display_name: E二三
      tts: {delivery: "机警急迫，危境中仍精于算计", timbre: "干瘦沙哑", pace: "急促而多停顿", pitch: "中高音"}
    young_officer:
      display_name: 年轻英国警官
      tts: {delivery: "生硬傲慢，带着暑热中的不耐烦", timbre: "年轻而紧绷", pace: "短促", pitch: "中音"}
    strickland:
      display_name: 斯特里克兰
      tts: {delivery: "威严敏锐，怒意来得直接", timbre: "结实低沉", pace: "果断", pitch: "中低音"}
    old_woman:
      display_name: 古鲁老太太
      tts: {delivery: "泼辣健谈，尖刻中带着热心", timbre: "苍老而响亮", pace: "飞快多变", pitch: "中高音"}
    servant:
      display_name: 白胡子老仆人
      tts: {delivery: "忠心守礼，私下爱发牢骚", timbre: "干瘦沙哑", pace: "不紧不慢", pitch: "中低音"}
    kitchen_boy:
      display_name: 洗锅小厮
      tts: {delivery: "冒失直白", timbre: "年轻粗亮", pace: "急切", pitch: "中高音"}
  chapters:
    - id: ch01
      title: 德里站的脱身计
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: "谁会渴望无边无际的咸水，渴望风浪涌起、停顿、猛扑、轰鸣，渴望风暴前灰暗无沫的长浪，也渴望赤道的死寂和飓风的狂啸？大海千变万化，却始终是那片让人生命圆满的大海。山里人对群山的渴望，也正是这样。"
        - id: ch01-b02
          speaker: e23
          text: "我的心总算回来了。饥饿和害怕把人搅得头昏，不然我早该想到这个脱身法。我没猜错，他们真来抓我了。兄弟，是你救了我的脑袋。"
        - id: ch01-b03
          speaker: narrator
          text: "站台的喧闹正好遮住他的声音。一队穿黄裤的旁遮普警察拨开车厢前的人群。带头的年轻英国人热得满脸通红，汗流不止。队尾还跟着一个矮胖子，走路无声，像律师手下招揽官司的掮客。"
        - id: ch01-b04
          speaker: e23
          text: "你看，那个年轻少爷正对着纸念呢。纸上写的就是我的模样。他们会把每节车厢都搜一遍，就像渔夫拉着网，把整口池塘扫过去。"
        - id: ch01-b05
          speaker: narrator
          text: "警察搜到这节车厢时，E二三正稳稳转着手腕，一颗颗拨念珠。金笑他醉得连苦行僧的带环火钳都丢了。喇嘛两眼直望前方，沉在冥想里。甘波族农夫偷看几眼，悄悄收拾起行李。"
        - id: ch01-b06
          speaker: young_officer
          text: "这里只装着一包活神仙。"
        - id: ch01-b07
          speaker: narrator
          text: "年轻人说完便继续往前。车厢里却起了一阵不安的骚动。在印度百姓眼里，本地警察一出现，多半就要敲诈勒索。"
        - id: ch01-b08
          speaker: e23
          text: "现在还有个麻烦。我得拍电报，告诉他们，那封奉命寻找的信被我藏在哪儿。可穿成这样，我进不了电报局。"
        - id: ch01-b09
          speaker: kim
          text: "我已经救了你的脖子，这还不够？"
        - id: ch01-b10
          speaker: e23
          text: "差事没完，就还不够。医治病珍珠的那位，可没这么教过你吧？等等，又来了一个少爷！"
        - id: ch01-b11
          speaker: narrator
          text: "这次来的是区警察总监。他身材高挑，脸色蜡黄，皮带、头盔和亮闪闪的马刺一样不少。他昂着头阔步走来，一路捻着黑胡子。"
        - id: ch01-b12
          speaker: kim
          text: "这些警察少爷，可真是一群蠢货。"
        - id: ch01-b13
          speaker: e23
          text: "这句话说得好。我去喝口水，你替我守住位子。"
        - id: ch01-b14
          speaker: narrator
          text: "E二三立刻换了嗓音，踉踉跄跄走出去，差点一头撞进总监怀里。总监用生硬的乌尔都语骂了起来。"
        - id: ch01-b15
          speaker: strickland
          text: "图姆·马特？你喝醉了？别到处乱撞，好像德里车站是你家。"
        - id: ch01-b16
          speaker: narrator
          text: "E二三脸上一动不动，嘴里却泼出一串污秽骂词。金听得心花怒放，想起刚进学校时遇见的鼓手男孩和营房清扫工。"
        - id: ch01-b17
          speaker: strickland
          text: "你这个傻瓜。尼克勒·焦！滚回车厢去。"
        - id: ch01-b18
          speaker: narrator
          text: "黄衣苦行僧毕恭毕敬地后退，声音越来越低，却把总监连同最遥远的后代一路咒了个遍。他还以女王石、石下文字和一长串陌生神祇的名义发咒。金听见女王石，险些跳起来。"
        - id: ch01-b19
          speaker: strickland
          text: "我听不懂，可这准是该死的无礼话。你，出来！"
          emotion: angry
        - id: ch01-b20
          speaker: narrator
          text: "E二三装作不明白，郑重掏出车票。总监一把夺走。"
        - id: ch01-b21
          speaker: jatt
          text: "哎呀，祖鲁姆！这算什么欺压？他不过开个玩笑。圣人，看来你的法术今天不大灵。"
        - id: ch01-b22
          speaker: narrator
          text: "苦行僧一路低声哀求，跟着警察走了。旅客们只顾孩子和包袱，没人留意这点风波。金也悄悄溜下车。他忽然记起，三年前在安巴拉附近听过这个又怒又蠢的少爷，当众揭一位老太太的短。"
        - id: ch01-b23
          speaker: e23
          text: "办成了。他现在会替我发消息，报告藏信的地点。别人说他在白沙瓦，我早该想到，他像鳄鱼一样，总守在另一处渡口。他替我解了眼前的祸，可真正救我命的是你。"
        - id: ch01-b24
          speaker: narrator
          text: "苦行僧被挤在叫卖呼喊的人潮里，脚边夹着一条波斯灵缇，背后顶着一笼尖叫的猎鹰。金低头钻过赶骆驼人油腻的腋窝，又撞散一群叽叽喳喳的锡克妇人。"
        - id: ch01-b25
          speaker: kim
          text: "他也是我们的人？"
        - id: ch01-b26
          speaker: e23
          text: "他不比最了不起的人差。我们俩今天都走运。我会把你的功劳告诉他。现在有他护着，我安全了。"
        - id: ch01-b27
          speaker: narrator
          text: "E二三从车厢边的人群里硬挤出来，在电报局附近的长凳旁蹲下。"
        - id: ch01-b28
          speaker: e23
          text: "快回车上，位子要被人占了。别替差事担心，也别替我的命担心。你替我争来喘气的工夫，斯特里克兰少爷又把我拖上了岸。以后我们说不定还能一起玩大游戏。再会！"
        - id: ch01-b29
          speaker: narrator
          text: "金回到已经挤满人的车厢，心里振奋，又迷惑，还有点恼火。四周全是秘密，可他连一把钥匙也没有。"
        - id: ch01-b30
          speaker: kim
          text: "我在大游戏里，果然还是个新手。我想不到钻进最显眼的地方反而安全，也想不到假装骂人就能传消息。那位少爷也真机灵。不过我总算救了一个人的命。圣人，那个甘波人去哪儿了？"
        - id: ch01-b31
          speaker: lama
          text: "恐惧抓住了他。他亲眼看你一眨眼就把马拉塔人变成苦行僧，说是为了避邪，心里已经动摇。后来苦行僧又径直落进警察手里，他便认定全是你的法术。他抱着儿子逃了，怕你也把他变成敢同白人少爷顶嘴的无礼之徒。那苦行僧呢？"
        - id: ch01-b32
          speaker: kim
          text: "跟警察走了。可不管怎样，我救过甘波人的孩子。"
        - id: ch01-b33
          speaker: narrator
          text: "喇嘛温和地吸了吸鼻子。"
        - id: ch01-b34
          speaker: lama
          text: "徒儿，看看自己的行为怎样追上了你。你给孩子治病，是为了积德。可你给马拉塔人施法时满心骄傲，我看见了。你还斜着眼偷看，迷惑一个年迈老人和一个愚蠢农夫，结果只招来灾祸和猜疑。"
        - id: ch01-b35
          speaker: narrator
          text: "金费了远超这个年纪的力气，才把自己按住。他不愿忍气吞声，更受不了被误解，可他也明白，自己已经进退两难。火车驶出德里，滚进夜色。"
        - id: ch01-b36
          speaker: kim
          text: "你说得对。凡是我冒犯了你的地方，都是我的错。"
        - id: ch01-b37
          speaker: lama
          text: "还不止这些。你把一个行动放进世间，它造成的后果就像石子落进池塘，一圈圈荡开。你根本不知道，那些水波会传到多远。"
        - id: ch01-b38
          speaker: narrator
          text: "他们的无知保全了金的虚荣，也保全了喇嘛的安宁。这时，一封密码电报已经送往西姆拉，报告E二三到了德里，也报告那封奉命窃取的信藏在何处。一个过分热心的警察错抓了愤怒的阿杰梅尔棉商，说他在南方某个土邦犯过谋杀。棉商正在站台上向斯特里克兰竭力申辩，E二三却穿过僻巷，潜进德里紧锁的城门深处。"
        - id: ch01-b39
          speaker: narrator
          text: "两个钟头里，几封电报先后送到南方那位愤怒的大臣手里，说浑身带着青肿的马拉塔人已经彻底失踪。等慢车停在萨哈兰普尔，金帮忙掷出的石子所荡起的最后一圈水波，已经拍到遥远罗姆一座清真寺的台阶，惊扰了一个正在祷告的虔诚信徒。"
    - id: ch02
      title: 在大道上漫游
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: "清晨，喇嘛在站台旁沾着露水的九重葛花架下舒展身体。阳光晴好，徒弟又在身边，他的精神也振作起来。"
        - id: ch02-b02
          speaker: lama
          text: "把这些东西抛在身后吧。那特……火车确实奇妙，可它颠得我一身骨头都化成水了。往后，我们只走在清净空气里。"
        - id: ch02-b03
          speaker: kim
          text: "那就去古鲁女人家吧。"
          emotion: happy
        - id: ch02-b04
          speaker: narrator
          text: "金背起包袱，大步出发。萨哈兰普尔的清晨清新芬芳，让他想起圣泽维尔的早晨，心里本来已经有三层满足，如今又添上一层。"
        - id: ch02-b05
          speaker: lama
          text: "你这股急性子是从哪儿来的？智者不会像烈日下的鸡，到处乱跑。我们走过成百上千科斯，我却几乎没能同你单独待一会儿。人群推来挤去，你怎么听教诲？话头像洪水一样淹过来，我又怎么静心想大道？"
        - id: ch02-b06
          speaker: kim
          text: "这么多年了，那女人的舌头还没短一点吗？"
        - id: ch02-b07
          speaker: lama
          text: "她想求符咒的心也没少一点。我给她讲生命之轮，她只问纠缠孩子的恶鬼。我们以后可以去，让她积些功德。可眼下别急。我们自在走走，等因缘自己接上。寻访一定会有结果。"
        - id: ch02-b08
          speaker: narrator
          text: "他们轻松走过一片片宽阔果园，经过阿米纳巴德、萨海贡杰、渡口的阿克罗拉和小富莱萨。北边一直横着西瓦利克群山，更远处还有皑皑雪峰。他们在干爽星空下睡一场长长的好觉，再从容穿过刚刚醒来的村庄。"
        - id: ch02-b09
          speaker: narrator
          text: "托钵默默伸在身前，眼睛却不守戒律，从天边看到天边。化缘以后，金踩着软尘回到师父身边。师徒俩在芒果浓荫或杜恩谷白合欢稀薄的树影里安稳吃喝。正午说说话，走一小段，便躺下睡觉。等空气凉了，他们又精神十足地迎向世界。"
        - id: ch02-b10
          speaker: narrator
          text: "每到夜晚，他们都会走进一片新天地，通常就是三小时前隔着肥田看见、一路议论过的村庄。金每晚讲一个不同的故事。祭司也好，村长也好，都照东方待客的老规矩，热情接纳他们。"
        - id: ch02-b11
          speaker: narrator
          text: "日影渐短，喇嘛越来越沉地靠在金身上时，他们便铺开生命之轮，用擦净的石头压住，再拿长草秆一圈圈讲解。高处坐着众神，可众神也只是梦里的梦。半神骑马在山间厮杀，禽兽承受苦难，灵魂沿阶梯上升或下沉，谁也不能干预。冷热地狱里，还有受苦幽灵。"
        - id: ch02-b12
          speaker: narrator
          text: "金恭恭敬敬低着头，褐色手指随时跟上草秆。可说到地狱上方那个人事繁忙却徒劳无益的世界，他总会走神。因为路边正有一只活生生的巨轮滚过，吃喝、买卖、嫁娶、争吵，到处热气腾腾。"
        - id: ch02-b13
          speaker: narrator
          text: "喇嘛有时就拿眼前的人作讲义。他让金看肉身变成千百种模样，世人觉得有的可爱，有的可厌，其实都没有意义。愚昧的灵魂甘愿做猪、鸽和蛇的奴隶，为蒌叶、新牛轭、女人或君王恩宠而贪恋，便跟着肉身走遍天堂地狱，最后丝毫不差地绕回原处。"
        - id: ch02-b14
          speaker: narrator
          text: "每次展开那张黄色巨图，总有妇人和穷人停下来，撒几朵花，或丢下一把贝壳钱。对这些卑微的人来说，路上遇见一位圣人，或许肯在祈祷时想起自己，便已经够了。"
        - id: ch02-b15
          speaker: lama
          text: "他们生病，你就医治。发烧，也可以治。只是千万别施符作法。别忘了那个马拉塔人。"
        - id: ch02-b16
          speaker: kim
          text: "这么说，所有行动都是恶的吗？"
        - id: ch02-b17
          speaker: narrator
          text: "金躺在杜恩谷岔路口的大树下，看一只小蚂蚁爬过手背。"
        - id: ch02-b18
          speaker: lama
          text: "不行动是好事，除非行动是为了积德。"
        - id: ch02-b19
          speaker: kim
          text: "可学问之门的先生们说，不行动配不上白人少爷。我就是个白人少爷。"
        - id: ch02-b20
          speaker: lama
          text: "世界之友，我年纪老了，却也像孩子一样爱看热闹。可追随大道的人眼里，没有黑白，没有印度人和西藏人。我们都是寻求解脱的灵魂。你从白人少爷那里学了什么都好，等我们走到我的河边，你会在我身旁摆脱幻象。我的骨头渴望那条河，可我的精神高高坐在骨头上，安静等着。寻访必有结果。"
        - id: ch02-b21
          speaker: kim
          text: "我懂了。那我能问一件事吗？我吃了你三年的饭，那些钱到底从哪儿来？"
        - id: ch02-b22
          speaker: lama
          text: "按世人的算法，西藏有许多财富。在自己的地方，我也享有名望这种幻象。我要什么，只管开口，账目由寺院操心。唉，那高高的黑座，还有一排排整齐的小沙弥！"
        - id: ch02-b23
          speaker: narrator
          text: "喇嘛用手指在尘土上画着，讲起被雪崩守护的大寺院，讲华美法事、仪仗和跳神，也讲僧尼变成猪的故事。他讲一万五千英尺高处的圣城，讲寺院间的争斗，讲群山里的声音和干雪上舞动的神秘幻景，甚至讲到自己亲眼见过、诚心敬拜的达赖喇嘛。"
        - id: ch02-b24
          speaker: narrator
          text: "一天又一天，漫长而完美的日子在金身后升起，渐渐筑成一道屏障，把他同自己的种族和母语隔开。他重新用本地话思考，也用本地话做梦。吃饭、喝水和做别的事情时，他也自然跟着喇嘛，守那些熟悉的仪轨。老人的眼睛越望着一动不动的雪山，心思就越回到自己的寺院。那条河已经不再让他烦恼。他偶尔还会久久盯住一簇草或一截细枝，等大地裂开，送出它的福泽。可只要徒弟在身边，只要杜恩谷的风吹来让人舒畅，他便心满意足。这里不是锡兰，不是菩提伽耶，也不是孟买，更不是两年前偶然闯进的荒草废墟。他谈起那些地方时，既像一个放下虚荣的学者，也像一个谦卑赶路的探寻者。他还是个睿智而有节制的老人，用忽然闪现的灿烂见解，照亮自己的学问。"
        - id: ch02-b25
          speaker: narrator
          text: "喇嘛把南来北往的经历一点点讲给金听，每个故事都由路边的东西勾起。金从前爱他，不需要理由。如今，他有了五十个好理由。他们远离恶语与贪欲，不过量吃喝，不睡高床，也不穿华服。肚子告诉他们时辰，百姓送来饭食。他们仿佛成了沿途村庄的主人。就在小富莱萨，金还给那个没有灵魂的女人赐了福。"
    - id: ch03
      title: 古鲁宅院的夜客
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: "消息在印度跑得很快。不久，一个干瘦的奥里萨老仆人拖着脚穿过田地，送来一篮水果，里面有喀布尔葡萄和涂金橙子。他说女主人想到喇嘛长久不肯来，心里十分难过，请两位赏光。"
        - id: ch03-b02
          speaker: lama
          text: "我想起来了。她很有德，只是话实在太多。"
        - id: ch03-b03
          speaker: narrator
          text: "金正坐在牛槽边，给铁匠家的孩子讲故事。"
        - id: ch03-b04
          speaker: kim
          text: "她不过想替女儿再求一个儿子，我没忘。就让她积些功德吧，告诉她我们会去。"
        - id: ch03-b05
          speaker: narrator
          text: "两天里，他们慢慢穿过田野，一共只走了十一英里。到了宅院，殷勤的款待立刻像潮水一样涌来，把两个人从头到脚淹没。老太太一向把待客看成大事，还硬逼女婿照她的规矩来。女婿凡事都听家中女人摆布，只能向放债人借钱，给自己换一点清静。岁月没磨短老太太的舌头，也没削弱她的记性。她坐在楼上一扇装着谨慎栅栏的窗后，当着至少十二个仆人的面，一句接一句地打趣金，又把他捧得老高。那些话大胆得很，若叫一群欧洲人听见，准会羞得四散逃开。"
        - id: ch03-b06
          speaker: old_woman
          text: "你还是宿营地上那个没羞没臊的讨饭崽子，我全记得。快去洗，去吃饭。外孙子的父亲出门了，我们这些可怜女人便成了哑巴，既不能说话，也派不上用场。"
        - id: ch03-b07
          speaker: narrator
          text: "为了证明自己不能说话，她把全家数落一遍，直到饭和水都送齐。傍晚，田野烟气弥漫，天空一半赤铜，一半松石。她叫人点起冒烟的火把，把轿子放在乱糟糟的前院，自己隔着没有拉严的轿帘闲聊。"
        - id: ch03-b08
          speaker: old_woman
          text: "圣人若独自来，我自然另有招待法。可带着你这个坏小子，谁敢不小心？"
        - id: ch03-b09
          speaker: kim
          text: "王后殿下，难道能怪我？明明是那位警察少爷，说殿下是他见过的那张脸。"
        - id: ch03-b10
          speaker: old_woman
          text: "呸！那是在朝圣路上。出门在外，那句俗话你也懂。"
        - id: ch03-b11
          speaker: kim
          text: "他说殿下是芳心的摧毁者、欢乐的赐予者，对不对？"
        - id: ch03-b12
          speaker: old_woman
          text: "亏你还记得！他说得没错，那时我的美貌正盛。现在说说你这些年来的事，只说不至于羞出口的。多少姑娘，多少别人的妻子，都挂在你睫毛上？你们从贝拿勒斯来吧？我也想再去，可我女儿只有两个儿子。都是低地害的，古鲁男人才壮得像大象。"
        - id: ch03-b13
          speaker: old_woman
          text: "我还想求圣人给一道符，治我女儿长子那种可怜的胀气绞痛。他一到芒果季就发作。两年前，圣人给过一张很灵的符。你走开些，坏小子。"
        - id: ch03-b14
          speaker: kim
          text: "哦，圣人！"
          emotion: happy
        - id: ch03-b15
          speaker: lama
          text: "这是真的。我给过她一道祛风符。"
        - id: ch03-b16
          speaker: old_woman
          text: "是长牙！长牙！长牙！"
        - id: ch03-b17
          speaker: kim
          text: "有人说过，病人可以医治，可千万别施符。别忘了马拉塔人。"
        - id: ch03-b18
          speaker: lama
          text: "那是两个雨季前。她缠了整整三天，我实在没有办法。徒儿要记住，一心走大道的人，也会被无所事事的女人挤到一边。"
        - id: ch03-b19
          speaker: old_woman
          text: "我不跟你说，还能跟谁说？孩子母亲不懂事，父亲更别提。冷天夜里，他只说一句向众神祈祷吧，翻身就打呼噜。"
        - id: ch03-b20
          speaker: lama
          text: "所以我给了符。一个老人还能怎么办？"
        - id: ch03-b21
          speaker: kim
          text: "不行动是好事，为积德而行动除外。"
        - id: ch03-b22
          speaker: lama
          text: "徒儿，连你也背弃我，我就真是孤零零的了。"
        - id: ch03-b23
          speaker: old_woman
          text: "反正他的乳牙顺顺当当长出来了。不过祭司全是一路货色。马厩上有只会说话的八哥，把我们家祭司学得一模一样。孩子疼起来，两只拳头顶着肚子，喊着这里疼，你们见了也会原谅我。"
        - id: ch03-b24
          speaker: old_woman
          text: "我倒想试试新来哈基姆的药。他卖得便宜，那些药又把他养得像湿婆神的公牛一样肥。只是瓶子的颜色不吉利，我不敢给孩子吃。"
        - id: ch03-b25
          speaker: narrator
          text: "趁她滔滔不绝，喇嘛悄悄隐进黑暗，回房去了。"
        - id: ch03-b26
          speaker: kim
          text: "你大概惹恼他了。"
        - id: ch03-b27
          speaker: old_woman
          text: "没有，他只是累了。明天看见我外孙长得那么大，自然会写符，还能评评哈基姆的药。"
        - id: ch03-b28
          speaker: kim
          text: "王后殿下，那位哈基姆是什么人？"
        - id: ch03-b29
          speaker: old_woman
          text: "他和你一样，也是个四处游荡的人。不过他是达卡来的孟加拉人，稳重得很，还是用药大师。我饭后肚子不舒服，他给我一颗小药丸。药一下肚，简直像放出一个挣脱锁链的魔鬼，把病痛一扫而空。现在他四处游走，卖那些价值非凡的药。他还有用昂格雷齐文印的纸，上面写着，他治好了多少腰背无力的男人，又治好了多少筋骨松弛的女人。他在这里已经住了四天。可听说你们要来，他大概就躲起来了。哈基姆和祭司走到哪里都是蛇和老虎，谁也不肯让谁。"
        - id: ch03-b30
          speaker: servant
          text: "这宅子快成江湖骗子和祭司的牲口棚了。叫孩子别吃芒果就行，可谁能同祖母讲道理？夫人，哈基姆吃过饭，正在鸽舍后的屋里睡觉。"
        - id: ch03-b31
          speaker: narrator
          text: "金立刻像要扑出去的小猎狗一样警醒。他很想驳倒这个受过加尔各答教育的卖药郎。老仆人也盼着两个食客斗起来，偷偷往鸽舍去了。"
        - id: ch03-b32
          speaker: kim
          text: "他们做生意，只靠一点有颜色的水，再加一大堆厚脸皮。他们专找垮掉的国王和吃撑的孟加拉人，赚的却是尚未出世孩子的钱。"
        - id: ch03-b33
          speaker: old_woman
          text: "别眼红。符咒更好，我从没否认。记得叫圣人明早给我写一张好护符。"
        - id: ch03-b34
          speaker: hurree
          text: "只有无知的人，才否认符咒的价值。也只有无知的人，才否认药物的价值。"
        - id: ch03-b35
          speaker: kim
          text: "老鼠捡到一块姜黄，就说自己要开香料铺。"
        - id: ch03-b36
          speaker: narrator
          text: "黑暗中的人影走近，盘腿坐下。老太太也在轿里挺直身子，专心听这场交锋。"
        - id: ch03-b37
          speaker: hurree
          text: "祭司的儿子只认得奶妈和三个神，就说不听我的，我便请三百万尊大神降咒。我不过是个学字母的学生，却已经学尽白人少爷的智慧。"
        - id: ch03-b38
          speaker: old_woman
          text: "白人少爷从来不老，当了祖父还像孩子一样蹦跳，真是一族腰杆结实的人。"
        - id: ch03-b39
          speaker: hurree
          text: "我有疏散头脑郁滞的药，专治暴躁的人。还有按月亮宫位配的西那叶、黄色药土、中国来的阿尔普兰、克什米尔藏红花和喀布尔白芨。从前死过许多人……"
        - id: ch03-b40
          speaker: kim
          text: "这句话我完全相信。"
        - id: ch03-b41
          speaker: hurree
          text: "他们都懂我的药多珍贵。我给人的不是符上那点墨水，而是又热又猛的真药。药沉进身体，会同邪气拼命搏斗。"
        - id: ch03-b42
          speaker: old_woman
          text: "那一定斗得很猛。"
        - id: ch03-b43
          speaker: narrator
          text: "哈基姆的声音滔滔不绝，讲起一段关于厄运和破产的长故事，里面还夹着一次又一次请求政府施恩的话。他说，要不是命运压倒一切，自己早已在政府里供职。他有加尔各答那所大学校颁发的学位，这家的公子以后也许会去那里求学。老太太立刻说，他当然会去。邻居家的小崽子几年都能混到一个文科初级学位，她认识的孩子个个聪明，到了富庶的加尔各答，怎么会不把奖赏全拿回来？哈基姆说，自己从没见过这样的孩子。孩子出生在吉时，只可惜有绞痛。那病若变成黑霍乱，就会像鹰叼鸽子一样把他带走。不过孩子命里该有许多年，实在叫人羡慕。老太太听了先叫一声妈呀，说夸奖孩子不吉利，随后又承认自己很爱听。她又想起宅后无人看守。孩子父亲不在家，她一把年纪，只好亲自充当守夜人。"
        - id: ch03-b44
          speaker: old_woman
          text: "嗨，妈呀！夸孩子不吉利，不过这话我爱听。都起来，抬轿！让哈基姆和小祭司自己争符咒和药。我得绕宅子巡查。你们这些没用的家伙，先给客人拿烟草！"
        - id: ch03-b45
          speaker: narrator
          text: "轿子带着火把和狗群摇晃远去。二十座村庄都知道她的利舌、毛病和慷慨，也都占她便宜，却没人敢在她地面上偷抢。她每次巡夜还是声势浩大，喧闹仿佛能传到穆索里。"
        - id: ch03-b46
          speaker: narrator
          text: "金松弛下来，像一个占卜师认出了同道。哈基姆用脚把水烟袋推来，金吸起好烟草。周围食客都等着看同行辩论，最好还能免费看病。"
        - id: ch03-b47
          speaker: hurree
          text: "在无知的人面前谈医术，就像教孔雀唱歌。"
        - id: ch03-b48
          speaker: kim
          text: "真正懂礼貌的人，往往干脆不理他们。"
        - id: ch03-b49
          speaker: kitchen_boy
          text: "我腿上长了溃疡，给我看看吧！"
        - id: ch03-b50
          speaker: hurree
          text: "走开！这里难道专门纠缠尊贵客人？你们挤得像一群水牛。"
        - id: ch03-b51
          speaker: servant
          text: "女主人养活过你的妻子，谁敢说她坏话？这宅子的名声归我管。全都滚！"
        - id: ch03-b52
          speaker: narrator
          text: "老仆人把下人赶走。哈基姆几乎不动嘴唇，声音压得极轻。"
        - id: ch03-b53
          speaker: hurree
          text: "你好，奥哈拉先生。又见到你，我真高兴。"
        - id: ch03-b54
          speaker: narrator
          text: "金猛地攥紧烟管。在外面大路上相见，他也许不惊讶，可这里平静偏僻，他怎么也没想到会碰上胡里先生。想到自己被骗，他更加恼火。"
        - id: ch03-b55
          speaker: kim
          text: "啊哈！我在勒克瑙就说过，雷苏尔伽姆总会再站起来，到时你认不出我。你那时赌了多少？不过，你为什么到这里来？"
        - id: ch03-b56
          speaker: hurree
          text: "套用莎士比亚的话，泽特才是问题。我来祝贺你在德里的高效表演。大家都为你骄傲。我们共同的朋友告诉了我，我又告诉勒根先生。你毕业得这样漂亮，整个部门都满意。"
        - id: ch03-b57
          speaker: narrator
          text: "这是金第一次尝到部门嘉奖带来的纯粹骄傲。做同样事情的伙伴把他当作平等的人，称赞他的本领，这诱惑无可相比。可他心里的东方人立刻提醒他，孟加拉先生绝不会跋涉这么远，只送几句好话。"
        - id: ch03-b58
          speaker: kim
          text: "说正事吧，先生。"
        - id: ch03-b59
          speaker: hurree
          text: "没什么。藏信地点的电报送到时，我在西姆拉。老克赖顿正好见我没活儿，就派我去奇托尔取信。我不爱南方，火车坐得太久，不过旅费不少。我回程在德里见了那位朋友。他正安静躲着，还说苦行僧装束最合适。"
        - id: ch03-b60
          speaker: kim
          text: "是克赖顿上校先生。"
        - id: ch03-b61
          speaker: hurree
          text: "当然。那位朋友告诉我，你办得又快又漂亮，临场应变也好。我说这回该死的甜面包被你赢去了。真的，干得好。我就是特地来告诉你。"
        - id: ch03-b62
          speaker: narrator
          text: "沟渠里青蛙叫得正响，月亮却往下沉。一个快活仆人走到夜色里敲起鼓。金换成本地话，追问胡里如何找到他们。"
        - id: ch03-b63
          speaker: hurree
          text: "那没什么。我知道你去萨哈兰普尔，便一路跟来。红喇嘛很显眼。我买了药箱，在阿克罗拉听到你们的事，再四处打听。百姓全知道你们。老太太一派轿子，我就明白了。她见了药一定伸手，所以我扮医生。你也听见了，我说得相当好。你介意吗？"
    - id: ch04
      title: 大游戏通往群山
      blocks:
        - id: ch04-b01
          speaker: kim
          text: "先生，我是个白人少爷，也想参加大游戏。"
        - id: ch04-b02
          speaker: hurree
          text: "按部门关系，你眼下是我的下级。"
        - id: ch04-b03
          speaker: kim
          text: "那你为什么像树上的猿猴一样绕着话叫？没人会只为几句称赞，从西姆拉追到这里，还换一身衣服。我不是孩子。说印地语，直取鸡蛋黄。你十句话里没一句真话。到底为什么来？"
        - id: ch04-b04
          speaker: hurree
          text: "欧洲人这样逼问，真让人泽么难堪。你这年纪，本该懂得多些。"
        - id: ch04-b05
          speaker: kim
          text: "我就是要知道。若这是大游戏，我也许能帮忙。你一直绕着铺子走，我怎么做事？"
        - id: ch04-b06
          speaker: narrator
          text: "胡里接过烟管，用力吸得水烟袋重新咕噜起来。"
        - id: ch04-b07
          speaker: hurree
          text: "我用本地话说，你坐稳。这件事关系到一匹白种马的谱系。"
        - id: ch04-b08
          speaker: kim
          text: "那件事不是早结束了？"
        - id: ch04-b09
          speaker: hurree
          text: "等所有人都死光，大游戏才会结束，在那以前绝不会。三年前，马哈布·阿里把白种马的谱系交给你。那时候有五个国王正在准备一场突然发动的战争。正因为那个消息，我们的军队才能赶在他们准备好以前压上去。可战争没有继续打，这是政府的老习惯。政府以为五个国王已经吓破胆，也觉得在高山隘口养兵太费钱，于是把军队召回。希拉斯和布纳尔都是手里有枪炮的土王。他们答应收钱替政府守住隘口，不许任何人从北方过来。嘴上还说，他们既害怕我们，又愿意做我们的朋友。政府急着省钱，对这个安排满意得很，于是立下契约，每月付给他们一笔卢比。土邦军队一撤，他们就负责守路。"
        - id: ch04-b10
          speaker: hurree
          text: "我们相识以后，我原本在列城卖茶，后来成了军队里的账房。军队撤走时，我留在山里，给修新路的苦力发工钱。修路也是布纳尔、希拉斯和政府契约里的一条。夏天一过，那上面冷得该死。我每天夜里都怕布纳尔人为了钱箱割断我的喉咙，守卫我的本地兵还拿这件事笑我。我发过好几次消息，说两个国王已经把自己卖给北方。在更北边的马哈布也送来充分证据，证明我没说错。可什么都没发生。只有我的脚冻坏了，还掉了一根脚趾。我又发消息，说那些由我付钱、叫苦力修出来的道路，实际上是在替外人和敌人的脚修。"
        - id: ch04-b11
          speaker: kim
          text: "给谁修？"
        - id: ch04-b12
          speaker: hurree
          text: "俄国人。雪化以后，两个外国人借口打野山羊，带着枪、测链、水平仪和罗盘越过山口。希拉斯和布纳尔热情招待。他们自称代表送礼物的恺撒，沿山谷到处指点，哪里能修胸墙，哪里能筑堡垒，哪里能挡住大军。偏偏全是我花政府卢比修的路。"
        - id: ch04-b13
          speaker: hurree
          text: "另外三个国王揭发那两家背信弃义。可等外国人让五个国王都相信，大军明后天就会横扫山口，命令才落到我手里，叫我北上看看他们在干什么。我对克赖顿说，这又不是官司，何必搜证据？找个勇敢的人毒死他们，杀一儆百，不就行了？他竟然笑我。你们这种英国式傲慢，总以为没人敢密谋。"
        - id: ch04-b14
          speaker: narrator
          text: "金慢慢吸烟，把听懂的事情在敏捷的脑子里来回整理。"
        - id: ch04-b15
          speaker: kim
          text: "所以你要去跟踪他们？"
        - id: ch04-b16
          speaker: hurree
          text: "不是跟踪，是迎接。他们正去西姆拉，要把猎来的角和兽头送往加尔各答加工。他们只是打猎的绅士，政府还给了特别便利。我们总是这样，这就是英国式傲慢。"
        - id: ch04-b17
          speaker: kim
          text: "那你怕什么？"
        - id: ch04-b18
          speaker: hurree
          text: "他们不是黑人。对付黑人，我什么法子都敢用。他们是俄国人，而且很不讲道德。我不想没有证人就同他们混在一起。"
        - id: ch04-b19
          speaker: kim
          text: "他们会杀你？"
        - id: ch04-b20
          speaker: hurree
          text: "杀人没什么。我是个相当不错的赫伯特·斯宾塞信徒，死亡这种小事应付得了，反正都是命定。可是，他们也许会打我。"
          emotion: fearful
        - id: ch04-b21
          speaker: kim
          text: "为什么？"
        - id: ch04-b22
          speaker: hurree
          text: "我要混进营地做帮闲，也许当翻译，也许装成没脑子又挨饿的人，再把能听的都听来。就像我扮医生骗老太太一样容易。可我毕竟是亚洲人，还是孟加拉人。我是个胆小的人。"
        - id: ch04-b23
          speaker: kim
          text: "上帝造了野兔，也造了孟加拉人，有什么可羞？"
        - id: ch04-b24
          speaker: hurree
          text: "我认为那是从原初必然性开始的进化，不过事实还是事实。我真的怕得要命。以前去拉萨路上，有人想割我的头。其实我没到拉萨，只坐下哭，等着受中国酷刑。这两位大概不折磨我，可我喜欢把意外都先防住，危急时好有欧洲人帮忙。"
        - id: ch04-b25
          speaker: hurree
          text: "这只是非官方请求，你完全可以拒绝。要是你和老人家没有非办不可的事，也许能让他改路，也许我能劝动他。我希望找到那两个猎人前，你能同我保持部门联系。德里那位朋友让我很看重你。事情结束后，我也会把你的名字写进正式报告，给你的帽子添一根漂亮羽毛。这才是我真正来的原因。"
        - id: ch04-b26
          speaker: kim
          text: "哼，看来故事只有结尾是真的。前面五个国王那些话呢？"
        - id: ch04-b27
          speaker: hurree
          text: "真话很多，比你以为的多得多。你来不来？我直接进杜恩谷，再到穆索里，经过兰普尔去奇尼。他们只能从那条路来。我要陪他们一路去西姆拉。那个俄国人其实是法国人，我的法语不错，在昌德纳戈尔还有朋友。"
        - id: ch04-b28
          speaker: kim
          text: "喇嘛一定愿意再见群山。这十天，他说得最多的就是山。要是我们一起走……"
        - id: ch04-b29
          speaker: hurree
          text: "只要喇嘛喜欢，我们路上尽可装作陌生。我走在前面四五英里，你们跟着。时间多得很，他们还要密谋、测量、画图。我明天走，你们后天再走。想一夜，早晨决定。真的，天快亮了。"
        - id: ch04-b30
          speaker: narrator
          text: "胡里打了个沉重哈欠，连客气话都省了，拖着身体回去睡觉。金却几乎没睡，思绪全用印度斯坦语奔跑。"
        - id: ch04-b31
          speaker: kim
          text: "大游戏这个名字真没叫错，果然够大。我在奎达当过四天洗锅小厮，偷走那人的账簿，那也是游戏的一部分。马拉塔人从遥远南方来，冒着命玩游戏。现在我也要走得很远，到北方去。它像一只梭子，穿遍整个印度。我的份额，我的快乐，都要感谢喇嘛，也感谢马哈布、克赖顿少爷。可最该谢的是圣人。世界确实伟大又奇妙，而我是金，金，金，独自一个人，一个自由的人，就在这一切中央。我要去看看那两个带水平仪和测链的外国人。"
        - id: ch04-b32
          speaker: lama
          text: "昨夜那些废话，最后说出了什么？"
        - id: ch04-b33
          speaker: kim
          text: "来了个四处卖药的人，是夫人的食客。我用道理和祷告打败他，证明我们的符咒胜过他的有色药水。"
        - id: ch04-b34
          speaker: lama
          text: "唉，我的符咒！那位有德的女人还要新的？那就非写不可，不然她会吵聋我的耳朵。"
        - id: ch04-b35
          speaker: kim
          text: "平原上人总是太多。依我看，山里人少一些。"
        - id: ch04-b36
          speaker: lama
          text: "群山，还有山上的雪。可你对群山知道什么？"
        - id: ch04-b37
          speaker: kim
          text: "它们就在眼前。除了穿白人衣服的时候，我还没进过山。往北走，在低山间赶路，不也能避开正午的热？符写好了吗？"
        - id: ch04-b38
          speaker: lama
          text: "我写了七个愚蠢魔鬼的名字，它们连落进眼睛的一粒灰都不如。愚蠢女人总把我们拖离大道。"
        - id: ch04-b39
          speaker: narrator
          text: "胡里从鸽舍后走出来，大张旗鼓地照足仪式刷洗牙齿。他身躯肥硕，臀部厚重，牛颈粗壮，声音又低沉，怎么看都不像自己所说的胆小鬼。金只打了一个几乎看不见的手势，告诉他事情进展顺利。等晨间梳洗结束，胡里便带着华丽辞藻，前来向喇嘛致敬。三个人自然分开用饭。饭后，老太太半遮着身子坐在窗后，又说起孩子吃青芒果闹绞痛这件生死大事。喇嘛的医药知识全凭心意相通。他相信把黑马粪和硫黄混在一起，装进蛇皮随身带着，就是治霍乱的可靠办法。不过，比起医理，他更喜欢其中的象征意义。胡里对这些见解表现出迷人的敬重，喇嘛便称他是一位谦恭有礼的医生。胡里回答，自己不过在医道秘术的门外胡乱摸索。至少他感谢众神，让自己坐在大师面前时还能认出大师。他曾在加尔各答气派的厅堂里向白人少爷学习，那些人花钱从不计较。可他始终承认，尘世智慧背后还有另一层智慧，那就是冥想中高远而孤独的学问。金在旁边看得羡慕。他熟悉的油滑、过分热情又神经兮兮的胡里不见了，昨夜厚颜无耻的卖药郎也不见了。眼前只剩一个圆融文雅、礼数周全、专心倾听的人，一个饱经世事、学问沉稳的智者，正从喇嘛口中吸取智慧。"
        - id: ch04-b40
          speaker: narrator
          text: "中午，胡里捆好黄铜包边的药箱，提着漆皮鞋，撑开蓝白雨伞，朝北走进杜恩谷。他说低山里的小国君很需要他。"
        - id: ch04-b41
          speaker: lama
          text: "徒儿，我们傍晚凉快时动身。那位精通医理又彬彬有礼的医生说，低山里的人虔诚慷慨，很需要导师。再走一小段，我们就能闻到凉爽空气和松树香气。"
        - id: ch04-b42
          speaker: old_woman
          text: "你们要进山，还走古鲁路？真是三倍福气！那条路每一站我都熟，处处有人施舍。我要备干粮。圣人和徒弟，往后还要来！房间永远留着，欢迎你们的心也永远留着。圣人，请祝福这一家，也原谅你仆人的愚蠢。"
          emotion: sad
        - id: ch04-b43
          speaker: narrator
          text: "她一边指挥人装饼、甜食、冷鸡、米饭和西梅炖肉，一边用面纱擦着衰老发红的眼睛，喉咙里咯咯作响。"
        - id: ch04-b44
          speaker: lama
          text: "女人爱说话，这是她们的弱点。我给了她符。她还在生命之轮上，把整颗心都交给今生幻象。可她有德、和善、好客，还有一颗完整热烈的心。谁能说她没积功德？"
        - id: ch04-b45
          speaker: kim
          text: "我不能。我试着想她彻底脱离生命之轮，无欲无求，也不引起结果，像一个修女，可我想不出来。"
        - id: ch04-b46
          speaker: lama
          text: "我也不能。她前面还有千千万万次生命，也许每一世都能添一点智慧。"
        - id: ch04-b47
          speaker: kim
          text: "她在那条路上，会不会忘了怎样用藏红花炖菜？"
        - id: ch04-b48
          speaker: lama
          text: "你的心净想不该想的东西。不过她的确有手艺，我从头到脚都恢复了精神。到了低山，我会更强壮。哈基姆说，雪山吹来一口气，能从人的生命里吹走二十年。这疗法简单得很，我从前竟没想到。"
        - id: ch04-b49
          speaker: lama
          text: "我们要到高高的山里，听雪水，也听林木，在那里住一阵。我们随时可以回平原，只沿宜人的地方绕行。哈基姆学问渊博，却不骄傲。我把夜里攫住后颈的晕眩告诉他，他说是酷热所致，凉爽空气便能治。"
        - id: ch04-b50
          speaker: kim
          text: "你连自己的寻访也告诉他了？没说我是白人少爷吧？"
        - id: ch04-b51
          speaker: lama
          text: "为什么要说？我们只是两个求解脱的灵魂。我告诉他自己的梦，也告诉他我怎样送你去学智慧，积下功德。他说得很公正，圣河会照梦中那样涌出，哪怕必须从我脚下涌出。"
        - id: ch04-b52
          speaker: lama
          text: "我已经找到大道，知道它会让我脱离生命之轮，又何必操心穿过尘世田野的道路？田野不过是幻象。我的梦夜夜重来，我还有《本生经》，还有你，世界之友。你的星盘说，绿地上的红牛会带来荣耀，是我亲眼看着预言实现。既然我是实现它的工具，你也会成为替我找到河流的工具。寻访必有结果！"
          emotion: calm
        - id: ch04-b53
          speaker: narrator
          text: "喇嘛象牙黄色的脸宁静无忧，朝向正在召唤他的群山。他的影子伸在尘土前方，仿佛替他扛住肩膀，走向很远很远的地方。"
