audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts: {delivery: "从容而机敏的讲述", timbre: "温暖清晰", pace: "舒展而有变化", pitch: "中音"}
    kim:
      display_name: 金
      tts: {delivery: "机灵大胆，话里常带笑", timbre: "明亮的少年声", pace: "轻快敏捷", pitch: "中高音"}
    lurgan:
      display_name: 勒根先生
      tts: {delivery: "沉静莫测，温和中带着审视", timbre: "柔和低沉", pace: "从容缓慢", pitch: "中低音"}
    hurree:
      display_name: 胡里·钱德尔·穆克吉
      tts: {delivery: "一本正经而滔滔不绝，英语腔调夸张", timbre: "厚重圆润", pace: "稍快", pitch: "中音"}
    mahbub:
      display_name: 马哈布·阿里
      tts: {delivery: "老练深沉，幽默里藏着试探", timbre: "粗厚低沉", pace: "从容", pitch: "低音"}
    creighton:
      display_name: 克赖顿上校
      tts: {delivery: "冷静克制，判断简明果断", timbre: "坚实沉稳", pace: "平稳", pitch: "中低音"}
    headmaster:
      display_name: 校长
      tts: {delivery: "严肃训诫，带着师长的郑重", timbre: "清朗端正", pace: "平稳", pitch: "中音"}
    huneefa:
      display_name: 胡妮法
      tts: {delivery: "慵懒低回，施术时诡秘激越", timbre: "沙哑厚重", pace: "缓慢而忽急", pitch: "中低音"}
  chapters:
    - id: ch01
      title: 第十章
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: "古戏剧里有人劝国王，别再把雄鹰困在架上。那不是没受过训练的雏鹰，而是一只过境时被人捉住的野鹰。被捉以前，它早已捕过猎，尝惯了天空，野性难驯。那人凭良心说，要是鹰属于自己，虽然鹰撕食时戴的手套确实是他的，他也会找一只老练的鹰领它飞。如今它已到了亚拉克，羽翼丰满，驯得服帖，也经得住风雨。把上帝为它造的苍穹还给它吧，看还有什么能在空中胜过它。"
        - id: ch01-b02
          speaker: narrator
          text: "勒根先生没有说得这么直白，意思却和马哈布一样。金因此占了便宜。如今他已经明白，穿着本地衣裳绝不能走出勒克瑙城。只要书信还能找到马哈布，他一放假就直奔营地，在那个帕坦人警觉的眼皮底下换装。要是他上课给地图着色的那只小测绘颜料盒会说话，把假日见闻全抖出来，学校大概早把他开除了。"
        - id: ch01-b03
          speaker: narrator
          text: "有一回，他跟马哈布押着三车有轨马车用的马，一直走到孟买。他听阿卜杜勒·拉赫曼的跟班说，波斯湾的阿拉伯马比普通喀布尔马值钱，马上提议坐三角帆船横渡印度洋去买马，吓得马哈布险些瘫倒。"
        - id: ch01-b04
          speaker: narrator
          text: "马哈布和几位同教朋友受邀去赴一场盛大的朝觐宴席，金也跟着这位大商人同桌抓食。回程时，他们从卡拉奇乘船回来。金坐在沿岸轮船的前舱口，头一次尝到晕船的滋味，却一口咬定自己中了毒。他在孟买才重新装满胡里先生那只著名的药箱，这回却一点用也没有。"
        - id: ch01-b05
          speaker: narrator
          text: "到了奎达，马哈布有事要办。按他自己的说法，金不光挣出了饭钱，兴许还多挣了一点。金在一个胖胖的军需处中士家里，做了四天稀奇古怪的洗碗杂役。他瞅准机会，从那人的公文箱里拿出一本羊皮纸小账簿，里面看着全是牛和骆驼的买卖。一个闷热的夜里，他趴在外屋后面，借着月光把整本账抄完，又把原账放回原处。他照马哈布的吩咐，工钱也没领便辞了差事，追了六英里赶上马哈布，怀里揣着一份干干净净的抄本。"
        - id: ch01-b06
          speaker: mahbub
          text: "那个军人只是条小鱼，我们迟早能钓到大的。他把牛卖成两个价，一个自己拿，一个报给政府。在我看来，这还算不上多大的罪。"
        - id: ch01-b07
          speaker: kim
          text: "那我为什么不把小账簿直接拿走？不是省事多了？"
        - id: ch01-b08
          speaker: mahbub
          text: "你一拿走，他就会惊动主人。那样一来，我们也许会错过一大批正从奎达往北运的新步枪。大游戏没有边，一个人一回只能看见眼前那一小块。"
        - id: ch01-b09
          speaker: kim
          text: "哦呵！"
        - id: ch01-b10
          speaker: narrator
          text: "金说完便闭了嘴。那是雨季假期，他刚拿到数学奖。到了圣诞假期，他只留十天给自己玩，其余时间都住在勒根先生那里。杰科路上的雪足有四英尺深，印度教孩子回家成亲去了，金便常坐在旺火前替勒根穿珍珠。"
        - id: ch01-b11
          speaker: narrator
          text: "勒根让他整章背《古兰经》，要背出毛拉那样抑扬顿挫的声调。他还教金辨认许多本地药材，讲每种药的效用和用药时该念的咒。夜里，他们在羊皮纸上写护符。精巧繁复的五芒星顶上写着魔鬼穆拉和帝王之伴阿万，四角也填满形状古怪的字。更有用的是，勒根教他怎样照料身体，怎样医治阵发高烧，还教了不少赶路时能用的简便药方。离下山只剩一星期，克赖顿上校竟又送来一张笔试卷，从头到尾全是测杆、测链、链节和角度。金觉得实在不公平。"
        - id: ch01-b12
          speaker: narrator
          text: "再下一个假期，金又随马哈布出门。他骑骆驼穿过沙地去神秘的比卡内尔，路上差点渴死。那里的井深四百英尺，从井口到底都用骆驼骨头衬着。金一点也不喜欢这趟差事，因为上校违背先前的约定，要他测绘这座荒凉的城。"
        - id: ch01-b13
          speaker: narrator
          text: "高墙严严实实围着这座都城。在这个独立土邦，谁也不会指望穆斯林马童或烟袋仆人拖着测链满街走，那样立刻会惹人起疑。金只好拨着一串念珠数脚步，量出每一段距离。主要等到天黑、骆驼都喂饱以后，他才找机会用罗盘定方向，再拿那只装着六块颜料和三支画笔的小测绘盒作图。画出来的地图，颇有点像杰伊瑟尔梅尔城。马哈布看过以后笑了很久，又劝他添一份书面报告。金翻到马哈布爱用的那本大账簿后页。账簿平时藏在马鞍鞍翼下，他就在上面开始动笔。"
        - id: ch01-b14
          speaker: mahbub
          text: "你见过的、摸过的、心里想过的，全写下来。写的时候就想，总督亲自带着大军偷偷来到这里，马上要开战。"
        - id: ch01-b15
          speaker: kim
          text: "多大的军队？"
        - id: ch01-b16
          speaker: mahbub
          text: "五万人吧。"
        - id: ch01-b17
          speaker: kim
          text: "胡说！沙地里的井又少又坏，你忘了吗？一千个口渴的人都别想走近这里。"
        - id: ch01-b18
          speaker: mahbub
          text: "那就把这件事写进去。城墙上哪里有旧缺口，柴火从哪儿来，国王是什么脾气，也都写清楚。马还没卖完，我会留在这里。我在城门旁租间屋，你替我管账，门上有一把好锁。"
        - id: ch01-b19
          speaker: narrator
          text: "报告用一眼就能认出的圣泽维尔学生连笔字写成，还附了一张涂着棕色、黄色和胭脂红的地图。几年前，它们还保存得好好的，只是一个粗心文书把它们归进了E第二次锡斯坦测量草稿里。如今那些铅笔字，大概已经很难看清。他们踏上归途的第二天，金坐在油灯下，一边流汗，一边把整份报告译给马哈布听。"
        - id: ch01-b20
          speaker: narrator
          text: "马哈布站起来，俯身探进一对花斑马鞍袋。"
        - id: ch01-b21
          speaker: mahbub
          text: "我早知道这份功劳该配一套荣服，所以先备好了。我要是阿富汗的埃米尔，也许哪天我们真会见到他，我一定拿黄金塞满你的嘴。"
        - id: ch01-b22
          speaker: narrator
          text: "他郑重地把衣物一件件摆在金脚下。先是一顶绣金的白沙瓦尖顶小帽，再是一大幅末端垂着宽宽金穗的头巾布。还有一件德里绣花背心，套在乳白色衬衫外面。衬衫从右襟扣合，宽松又飘逸。绿裤子配着绞丝裤带。为了样样齐全，最后还有一双香气醉人的俄罗斯皮拖鞋，鞋尖傲慢地高高翘着，神气十足。"
        - id: ch01-b23
          speaker: mahbub
          text: "星期三早晨穿新衣最吉利。不过，世上的坏人也不能忘。接着！"
        - id: ch01-b24
          speaker: narrator
          text: "最后拿出来的，是一把点四五零口径左轮手枪。枪身镀镍，镶着珍珠母，还能自动退壳。这件礼物像一顶冠冕，落在那套已经美得让金屏住呼吸的行头上。"
        - id: ch01-b25
          speaker: mahbub
          text: "我本来想挑一把口径小些的，后来转念一想，这把能用政府的子弹。那种子弹总有办法弄到，过了边境尤其容易。站起来，让我好好看看。愿你永不疲倦，帕坦人！唉，不知道要有多少颗心被你伤碎！又有多少双藏在睫毛底下的眼睛，会斜着偷看你！"
        - id: ch01-b26
          speaker: narrator
          text: "他重重拍了金的肩。金转了一圈，绷直脚尖，挺起身子，下意识摸了摸刚开始冒出来的胡须。接着他俯到马哈布脚边，双手飞快地颤动、轻轻拍打，照着规矩谢恩。他心里满得一句话也说不出来，马哈布抢先一步，把他抱进怀里。"
        - id: ch01-b27
          speaker: mahbub
          text: "我的儿子，你我之间还用说什么？这小枪多讨人喜欢。只要一扭，六颗弹壳一起退出。把它贴着皮肤藏在怀里，也好时时替它上油，千万别放在别处。真主若肯帮忙，总有一天你会用它杀人。"
        - id: ch01-b28
          speaker: kim
          text: "嗨，妈呀！少爷要是杀了人，会在牢里被绞死的。"
        - id: ch01-b29
          speaker: mahbub
          text: "不错。不过跨过边境一步，人就聪明多了。收好它，先把子弹装满。枪若饿着肚子，还有什么用？"
        - id: ch01-b30
          speaker: kim
          text: "等我回经院，只能把它还给你。学校不许带小枪。你替我收着，行吗？"
        - id: ch01-b31
          speaker: mahbub
          text: "儿子，我真厌透那所经院了。他们夺走一个人最好的年华，却只教那些非得在大路上才能学会的事。少爷们犯起傻来，上不见顶，下不见底。不过，你这份报告也许能让你少坐些日子的牢。真主知道，大游戏里的人手越来越不够。"
        - id: ch01-b32
          speaker: narrator
          text: "他们迎着扑面的飞沙，咬紧牙关，穿过盐碱荒漠，终于到了焦特布尔。马哈布和他那位相貌英俊的侄儿哈比卜·乌拉在那里做了不少买卖。随后，金满心不舍，只得脱下那套漂亮的本地衣裳，换回早已快穿不下的欧式衣服，坐二等车回圣泽维尔。"
        - id: ch01-b33
          speaker: narrator
          text: "三星期后，克赖顿上校正在勒根店里给几柄西藏降魔匕首估价。马哈布当面反对他的安排，勒根也站在马哈布一边。"
        - id: ch01-b34
          speaker: mahbub
          text: "这匹小马已经练好了，彻底练好了。它吃得稳衔铁，步法也调顺了。再天天关在场里耍把戏，好规矩反而会一点点丢掉。把缰绳搭到它背上，放它出去吧，先生。我们需要他。"
        - id: ch01-b35
          speaker: creighton
          text: "可他还很年轻，马哈布。还不到十六岁，对吧？"
        - id: ch01-b36
          speaker: mahbub
          text: "我十五岁时，已经杀过我的人，也生下了我的人，先生。"
        - id: ch01-b37
          speaker: creighton
          text: "你这个死不悔改的老异教徒！"
        - id: ch01-b38
          speaker: narrator
          text: "克赖顿转向勒根。黑胡子点了点头，赞同红胡子的阿富汗人。"
        - id: ch01-b39
          speaker: lurgan
          text: "要听我的，我早就用上他了。越年轻越好。我把真正值钱的珠宝交给孩子守，也是这个道理。你送他来让我试，我什么办法都用过。他是唯一一个不肯照我的意思看见幻象的孩子。"
        - id: ch01-b40
          speaker: mahbub
          text: "是在水晶里，还是墨池里？"
        - id: ch01-b41
          speaker: lurgan
          text: "都不是。就在我手下，我对你说过的。从没有别人办得到。这说明他的意志够强。克赖顿上校虽然觉得这些都是无聊把戏，可金的意志强得能让别人照他的意思做。那是三年前。后来我又教了他许多。上校，你现在只是在白白糟蹋他。"
        - id: ch01-b42
          speaker: creighton
          text: "唔，也许你说得对。可眼下没有测量任务能交给他。"
        - id: ch01-b43
          speaker: mahbub
          text: "那就放他出来，让他走走。谁会让小马第一次上路就驮重物？让他先跟商队跑一程，就像白色小骆驼跟队，讨个好兆头。我本来可以亲自带他，只是……"
        - id: ch01-b44
          speaker: lurgan
          text: "南方有件小差事，正适合他。"
        - id: ch01-b45
          speaker: creighton
          text: "E二三已经接手了。不能让金去，而且他不会突厥语。"
        - id: ch01-b46
          speaker: lurgan
          text: "只要告诉他那些信长什么样，有什么气味，他就会把信带回来。"
        - id: ch01-b47
          speaker: creighton
          text: "不行，那是成年人的差事。"
        - id: ch01-b48
          speaker: narrator
          text: "那桩棘手的案子牵涉一批未经许可、足以煽动乱子的信。一边自称对全世界一切穆斯林宗教事务拥有最高权威，另一边是某王室的年轻成员。他曾在英国领地绑架妇女，因此受过惩处。那位大主教说话斩钉截铁，傲慢过了头。年轻王子不过是因为特权受限而闹脾气，可也不能让他继续这场来往，免得有一天反受信件牵累。确实有人弄到一封信，可那个人后来被发现死在路旁，身上穿着阿拉伯商人的衣服。接手此案的E二三把这件事照实写进了报告。加上几件不能公开的事实，马哈布和克赖顿都摇了头。"
        - id: ch01-b49
          speaker: mahbub
          text: "让他跟红喇嘛走吧。他喜欢那个老人，至少还能拨着念珠练脚程。"
        - id: ch01-b50
          speaker: creighton
          text: "我通过书信跟老人打过几次交道。他要去哪里？"
        - id: ch01-b51
          speaker: mahbub
          text: "还是像这三年一样，到处走。他在找一条治病的河。愿真主诅咒所有……算了。他从大路回来，就在耆那教神庙或菩提伽耶落脚，再去经院看金。我们知道，因为金为此挨过两三次罚。老人疯得很，脾气倒温和。我见过他，胡里也跟他来往过。我们盯了三年。印度没几个红喇嘛，丢不了。"
        - id: ch01-b52
          speaker: lurgan
          text: "先生们个个好奇。你知道胡里真正想要什么吗？他想靠民族学笔记当上皇家学会会员。马哈布和金告诉我的事，我全讲给他了。后来胡里去了贝拿勒斯，我想旅费是他自己出的。"
        - id: ch01-b53
          speaker: creighton
          text: "我看不是。"
        - id: ch01-b54
          speaker: narrator
          text: "其实正是克赖顿付的钱。他很想弄清喇嘛到底是什么人。"
        - id: ch01-b55
          speaker: lurgan
          text: "这几年，胡里好几次向喇嘛打听喇嘛教、魔舞、咒语和护符。圣母在上，那些事我早几年就能全告诉他。我看他年纪大了，不适合再跑大路。他更喜欢搜集风俗。没错，他就是想做皇家学会会员。"
        - id: ch01-b56
          speaker: creighton
          text: "胡里很看重金，是吗？"
        - id: ch01-b57
          speaker: lurgan
          text: "看重得不得了。我们在我的小屋里一起过了几个很愉快的夜晚。不过，把金丢给胡里去做民族学，未免浪费。"
        - id: ch01-b58
          speaker: creighton
          text: "第一次历练不算浪费。马哈布，你看这样如何？让金跟喇嘛走六个月，以后再看。他能多长些见识。"
        - id: ch01-b59
          speaker: mahbub
          text: "他早有见识了，先生，就像鱼生来就懂得怎样驾驭身边的水。不过不论怎么说，能离开学校总是好事。"
        - id: ch01-b60
          speaker: creighton
          text: "那就定了，让他跟喇嘛走。胡里若愿意顺便照看他们，更好。他不会像马哈布一样把孩子带进险境。胡里想进皇家学会，这倒有趣，也很有人情味。民族学确实最适合他。"
        - id: ch01-b61
          speaker: narrator
          text: "无论给他金钱还是升迁，都不能诱使克赖顿离开印度测量局的工作。可在内心深处，他也盼着有朝一日，自己的姓名后面能添上皇家学会会员几个字。他知道，有些荣誉能靠机巧和朋友相助拿到。不过照他的信念，要想进入皇家学会，除了老老实实工作，再拿出一篇凝聚毕生心血的论文，根本没有别的路。这些年来，他不断把有关亚洲奇异教派和无名习俗的专论寄给那个学会。"
        - id: ch01-b62
          speaker: narrator
          text: "十个人里有九个走进皇家学会的晚会，都会无聊得落荒而逃，克赖顿偏偏是第十个。有时他的灵魂真会向往伦敦那些舒适又拥挤的大厅。满头银发或者秃着脑袋、对军队一窍不通的绅士们，在光谱实验、冻原上的微小植物、电动飞行测量机，还有能把雌蚊左眼切成几分之一毫米薄片的仪器之间来回穿行。照理说，真正该吸引他的应是皇家地理学会，可人选玩具时跟孩子一样没准头。他想到这里笑了。同一种欲望，也让他对胡里更多了几分好感。"
        - id: ch01-b63
          speaker: narrator
          text: "他放下降魔匕首，望向马哈布。"
        - id: ch01-b64
          speaker: mahbub
          text: "小马多久能从马厩里牵出来？"
        - id: ch01-b65
          speaker: creighton
          text: "唔，我要是现在命令他离校，你猜他会怎么做？这样的孩子，我以前从没参与教过。"
        - id: ch01-b66
          speaker: mahbub
          text: "他会来找我。勒根先生和我会替他把上路的东西备齐。"
        - id: ch01-b67
          speaker: creighton
          text: "那就办吧。他可以自由自在跑六个月。不过，谁给他担保？"
        - id: ch01-b68
          speaker: lurgan
          text: "如果你担心他泄露秘密，他不会的，克赖顿上校。"
        - id: ch01-b69
          speaker: creighton
          text: "他毕竟还是孩子。"
        - id: ch01-b70
          speaker: lurgan
          text: "不完全是。第一，他根本没什么可泄露。第二，他知道泄露会有什么后果。况且，他很喜欢马哈布，也有一点喜欢我。"
        - id: ch01-b71
          speaker: mahbub
          text: "他有薪水吗？"
        - id: ch01-b72
          speaker: creighton
          text: "只有食宿津贴，每月二十卢比。"
        - id: ch01-b73
          speaker: narrator
          text: "秘密部门有个好处，就是不受烦人的审计纠缠。当然，经费少得可笑，可钱只握在少数人手中。他们不索要收据，也不要求逐项报账。马哈布眼睛一亮，爱钱的样子几乎像个锡克人。勒根一向不动声色，这时脸色也有了变化。他已经看见往后的岁月。金会投身那场昼夜不停、席卷全印度的大游戏，并在那里受足磨炼。少数入选者会交口称赞这个学生，那份荣誉和声望也会归到老师身上。E二三当初不过是西北省一个糊里糊涂、出言无礼、满口谎话的小个子，正是勒根把他塑成了今天的E二三。"
        - id: ch01-b74
          speaker: narrator
          text: "可两位老师的欢喜，跟金的狂喜一比，简直淡得像烟。圣泽维尔的校长把金叫到一旁，说克赖顿上校派人来要他。"
        - id: ch01-b75
          speaker: headmaster
          text: "奥哈拉，我听说上校替你在运河部门找了个助理测链员的职位。你学数学总算有了回报。你才十六岁，运气实在太好。不过秋季考试必须通过，你才能正式任职。所以别以为从此可以在外面尽情玩，也别以为前程已经稳了。你还有许多苦功要下。等你成了正式雇员，将来可以一路升上去，每月拿四百五十卢比。"
        - id: ch01-b76
          speaker: narrator
          text: "校长接着讲了一大篇好话，教他该有怎样的行为、礼貌和品德。那些年纪更大、却没被一阵顺风吹进好职位的学生，用英印少年特有的口气大谈偏袒和贪腐。年轻的卡扎莱特说得更直白。他父亲是住在丘纳尔的退职领俸者，他暗示克赖顿上校之所以如此照顾金，是因为两人有亲生父子的关系。金不但没有还手，甚至连一句粗话都没说。他满脑子只装着未来无穷的乐趣，还有马哈布前一天那封用英文写得工工整整的信。信里约他当天下午去一所房子相见，那地方光是名字，就足以把校长的头发吓得根根卷起来。"
        - id: ch01-b77
          speaker: narrator
          text: "当天傍晚，勒克瑙火车站里，两人站在行李秤上方。"
        - id: ch01-b78
          speaker: kim
          text: "我一直怕到了最后一刻，屋顶会塌下来，原来全是一场空。现在真的结束了吗，我的父亲？"
        - id: ch01-b79
          speaker: narrator
          text: "马哈布弹响手指，表示结束得干干净净。他的眼睛像通红的炭火。"
        - id: ch01-b80
          speaker: kim
          text: "那么手枪呢？我要带在身上。"
        - id: ch01-b81
          speaker: mahbub
          text: "别忙！你先有半年自由，脚后跟不拴绳，爱往哪里跑就往哪里跑。这是我向克赖顿上校求来的。每月二十卢比。红帽老人已经知道你要来。"
        - id: ch01-b82
          speaker: kim
          text: "头三个月，我每月从薪水里给你两卢比佣金。不过得先脱掉这身衣服。上路的东西我都带来了，箱子已经送到勒根先生那里。"
        - id: ch01-b83
          speaker: narrator
          text: "金扯了扯薄麻布长裤，又拉拉衣领。"
        - id: ch01-b84
          speaker: mahbub
          text: "勒根先生托我向你问候，少爷。"
        - id: ch01-b85
          speaker: kim
          text: "勒根先生真聪明。那你要去做什么？"
        - id: ch01-b86
          speaker: mahbub
          text: "我还得往北走，继续大游戏。不然还能做什么？你还是一心想跟红帽老人走？"
        - id: ch01-b87
          speaker: kim
          text: "别忘了，是他造就了今天的我，虽然他自己不知道。年复一年，都是他寄钱供我上学。"
        - id: ch01-b88
          speaker: mahbub
          text: "要是我这颗笨脑袋早想到了，这钱我也会出。走吧，灯已经点起来，集市上没人会留意你。我们去胡妮法家。"
        - id: ch01-b89
          speaker: narrator
          text: "前往那所房子的一路上，马哈布不断给金忠告。那些话和利慕伊的母亲给儿子的教诲大致相同。说来也怪，他还特意讲得清清楚楚，胡妮法这一类女人究竟会怎样毁掉国王。"
        - id: ch01-b90
          speaker: mahbub
          text: "我记得有人说过，宁可信蛇，也别信娼妓。宁可信娼妓，也别信帕坦人马哈布·阿里。除了最后一句，因为我自己就是帕坦人，其余都是真的。在大游戏里更是如此。多少计划都坏在女人手里，等天一亮，我们便横尸野外，喉咙也被割开。某某人就是这么死的。"
        - id: ch01-b91
          speaker: narrator
          text: "他又把最血淋淋的细节全讲了一遍。金来到一道污秽的楼梯前，忽然停住。楼上是间温暖幽暗的屋子，藏在阿齐姆·乌拉烟草铺后的街区。熟悉这里的人叫它鸟笼，因为里面总塞满低语、口哨和啁啾。"
        - id: ch01-b92
          speaker: kim
          text: "那为什么还要来这里？"
        - id: ch01-b93
          speaker: narrator
          text: "屋里散着肮脏的靠垫和抽到一半的水烟，陈烟发出难闻的恶臭。角落躺着一个身材庞大、不成形的女人，身上裹着泛绿的薄纱。她的额头、鼻子、耳朵、脖子、手腕、胳膊、腰间和脚踝都挂满沉重的本地首饰。一转身，整个人就像一堆铜锅撞在一起。窗外阳台上，一只瘦猫饿得喵喵直叫。金站在门帘边，迷惑地停下脚步。"
        - id: ch01-b94
          speaker: huneefa
          text: "这就是新货吗，马哈布？哦，布克塔努斯！这孩子长得真俊。"
        - id: ch01-b95
          speaker: narrator
          text: "胡妮法懒洋洋地说，连烟嘴都懒得从唇边挪开。她这一类女人常拿精灵赌咒。"
        - id: ch01-b96
          speaker: mahbub
          text: "这是卖马时少不了的一套。"
        - id: ch01-b97
          speaker: kim
          text: "这种话，我出生第六天起就听惯了。它会把我带到哪里？"
        - id: ch01-b98
          speaker: narrator
          text: "金笑着在灯边蹲下。"
        - id: ch01-b99
          speaker: mahbub
          text: "带你得到保护。今晚先换掉你的肤色。你总睡在屋顶下，白得像杏仁。胡妮法有种染色秘方，染上以后不会一两天就褪。我们还要把你的防护加固，挡住路上的意外。这是我送你的礼物，儿子。把金属东西全取出来，放在这里。胡妮法，动手吧。"
        - id: ch01-b100
          speaker: narrator
          text: "金掏出罗盘、测绘颜料盒和刚装满的药箱。这些东西陪他走了一路，在少年眼里，每一件都珍贵无比。胡妮法慢慢站起，双手向前探着走。金这才发现她是盲人。"
        - id: ch01-b101
          speaker: huneefa
          text: "不，不，帕坦人说得没错。我的颜色一个星期不会褪，一个月也不会褪。受我保护的人，还有强大的守卫护着。"
        - id: ch01-b102
          speaker: mahbub
          text: "一个人孤零零待在异乡，皮肤忽然一块块掉色，像得了麻风，可不是好事。你跟着我时，我还能照看，何况帕坦人原本就肤色浅。现在脱下上衣，看看你白成什么样了。别担心，她看不见。"
        - id: ch01-b103
          speaker: narrator
          text: "胡妮法从里屋摸索回来，马哈布从她戴满戒指的手里接过锡碗。碗里的染料泛蓝，又黏又稠。金拿棉花蘸了一点，试着涂在手腕背面，胡妮法听见了。"
        - id: ch01-b104
          speaker: huneefa
          text: "不，不，不能这样。必须照合宜的仪式来。染色只是最不打紧的一点，我要把大路上的全部保护都给你。"
        - id: ch01-b105
          speaker: kim
          text: "魔法？"
          emotion: fearful
        - id: ch01-b106
          speaker: narrator
          text: "金微微一颤。他不喜欢那双惨白的盲眼。马哈布一手按住他的后颈，把他压倒在地，鼻尖离木板不到一英寸。"
        - id: ch01-b107
          speaker: mahbub
          text: "别动，不会有东西伤你，儿子。我愿替你作牺牲！"
          emotion: calm
        - id: ch01-b108
          speaker: narrator
          text: "金看不见女人在做什么，只听见她满身首饰像碟盘相撞，响了很久。一根火柴短暂照亮黑暗，熟悉的香粒随即噼啪作响。浓烟很快灌满屋子，香气又重又浓，让人昏沉。金越来越困，耳边却接连响起一个又一个魔鬼的名字。"
        - id: ch01-b109
          speaker: narrator
          text: "有伊布利斯之子祖尔巴赞，住在集市和旅站，路边歇脚处突如其来的淫邪恶事都由它挑起。还有杜尔汉，藏在清真寺信徒的拖鞋里，专门阻挠人祷告。再有谎言与恐慌之主穆斯布特。胡妮法时而贴着金的耳朵低语，时而像在极远处说话。她那双可怕的软手不停碰他。马哈布始终按着他的后颈，直到少年叹了口气，身子软下来，失去知觉。"
        - id: ch01-b110
          speaker: mahbub
          text: "真主啊，他挣扎得真厉害！不用药，我们绝对办不成。大概是他那一半白人血统在作怪。继续念，把全部保护都给他。"
        - id: ch01-b111
          speaker: huneefa
          text: "听者啊，你用双耳听见这一切，请你亲自来吧。听啊，听者！"
        - id: ch01-b112
          speaker: narrator
          text: "胡妮法呻吟着，把死寂的眼睛转向西方。幽暗屋里满是呜咽和喷鼻声。阳台上，一个肥硕的身影抬起弹丸般圆滚滚的脑袋，紧张地咳了一声。"
        - id: ch01-b113
          speaker: hurree
          text: "朋友，请别打断这场腹语通灵术。依我看，它虽然让你极度不安，可开明的观察者绝不会见鬼地害怕。"
        - id: ch01-b114
          speaker: huneefa
          text: "我要设下计谋，毁灭他们！先知啊，请容忍不信的人，暂且任他们去吧！"
        - id: ch01-b115
          speaker: narrator
          text: "胡妮法把脸转向北方，五官可怕地抽动，屋顶仿佛真有声音回应。胡里低头继续写窗台上的笔记，手却抖个不停。胡妮法盘腿坐在昏迷的金身边，像陷进药物催起的迷狂，身子向各个方向猛烈扭动。她照古老仪式的次序，一个个召来魔鬼，命令它们不得妨碍少年做任何事。"
        - id: ch01-b116
          speaker: huneefa
          text: "一切隐秘之事的钥匙都在他手里！除了他，没有人知晓。他知道陆地和海洋中的一切！"
        - id: ch01-b117
          speaker: narrator
          text: "非人的尖啸声又应和起来。"
        - id: ch01-b118
          speaker: hurree
          text: "我，我明白，这场施术应该完全没有恶意吧？她大概不会已经杀了这孩子吧？要真杀了，我拒绝在审判时作证。还有，刚才最后那个假设性的魔鬼叫什么？"
          emotion: fearful
        - id: ch01-b119
          speaker: mahbub
          text: "先生，印度的魔鬼我不放在眼里，伊布利斯的子孙却不一样。不管它们是和善还是凶暴，都不喜欢异教徒。"
        - id: ch01-b120
          speaker: hurree
          text: "那么，你认为我最好离开？它们当然只是非物质化的现象。斯宾塞说过。"
        - id: ch01-b121
          speaker: narrator
          text: "胡里半站起身。胡妮法的狂态终于到了尽头。她发作般号叫，唇边泛出一点白沫，随后精疲力尽地倒在金身旁，再也不动。那些疯狂的声音也停了。"
        - id: ch01-b122
          speaker: mahbub
          text: "哇，事情办妥了。愿孩子从中得益。胡妮法的祈祷术真是出神入化。先生，搭把手，把她拖到一边。别害怕。"
        - id: ch01-b123
          speaker: hurree
          text: "我怎么会怕绝对不存在的东西？"
        - id: ch01-b124
          speaker: narrator
          text: "胡里用英语给自己壮胆。他表面上轻蔑地考察魔法，心里却依然怕得要命。一边替皇家学会搜集民俗，一边又真心相信所有黑暗力量，这差事实在不好做。马哈布笑了。他从前和胡里一起在大路上办过事，早就知道这个人的脾气。"
        - id: ch01-b125
          speaker: mahbub
          text: "把他的肤色染完吧。要是空中的诸主真长着耳朵，这孩子现在已经保护妥当。我是苏菲派，不拘教条。可女人、种马或魔鬼若有盲点可以利用，何必非从正面走过去挨一脚？先生，送他上路。看好红帽老人，别让他把孩子带出我们的掌握。我得回马群那里了。"
        - id: ch01-b126
          speaker: hurree
          text: "完全正确。他现在真是个有趣的奇观。"
        - id: ch01-b127
          speaker: narrator
          text: "约莫鸡叫第三遍的时候，金终于醒了过来，仿佛自己已经沉睡了一千年。胡妮法蜷缩在屋子的角落里，鼾声大作，马哈布却已经离开了。"
        - id: ch01-b128
          speaker: hurree
          text: "但愿你没有害怕。我监督了全部操作。从民族学的角度说，非常有意思。这是最高等级的祈祷术。"
        - id: ch01-b129
          speaker: kim
          text: "哼！"
        - id: ch01-b130
          speaker: narrator
          text: "金认出了胡里那张满是讨好笑容的脸。"
        - id: ch01-b131
          speaker: hurree
          text: "另外，我还有幸从勒根先生那里带来你现在要穿的衣服。按正式惯例，我不会替下属搬这些华而不实的东西。不过，档案上已经注明，你的情形不寻常。但愿勒根先生会记下我做的事。"
        - id: ch01-b132
          speaker: narrator
          text: "胡里咯咯一笑。金打个哈欠，舒展四肢。终于又能穿上宽松衣裳，自在地转身扭动，感觉真好。他好奇地看着那身厚重粗呢料，上面满载遥远北方的气息。"
        - id: ch01-b133
          speaker: kim
          text: "这是什么衣服？"
        - id: ch01-b134
          speaker: hurree
          text: "哦呵，这是服侍喇嘛教喇嘛的弟子穿的，不会惹人注意，每一样都齐备。依我看，那位老人信的不完全是这一教，而是其中一个旁支。我曾把一批相关笔记投给《亚洲季刊》，可惜退稿了，仍可供有关人士参考。奇怪的是，老人自己毫无宗教性，根本不怎么讲究。"
        - id: ch01-b135
          speaker: narrator
          text: "胡里滚到阳台，用陶罐里的水清洁牙齿。"
        - id: ch01-b136
          speaker: kim
          text: "你认识他？"
        - id: ch01-b137
          speaker: narrator
          text: "胡里举起一只手，表示自己正在进行一套规定仪式。体面孟加拉人洁齿以及做其他事情时，总少不了这些规矩。做完以后，他用英语念了一段带有有神论意味的雅利安社祷词，又往嘴里塞进蒌叶和槟榔。"
        - id: ch01-b138
          speaker: hurree
          text: "当然认识。我在贝拿勒斯见过他几次，在菩提伽耶也见过。我问过他宗教和魔鬼崇拜的事。他是个纯粹的不可知论者，跟我一样。"
        - id: ch01-b139
          speaker: narrator
          text: "胡妮法在梦里动了一下。胡里紧张地跳到铜香炉旁。晨光下，香炉又黑又脏。他从灯烟里抹了一指，斜斜涂过自己的脸。"
        - id: ch01-b140
          speaker: kim
          text: "你家里死了谁？"
        - id: ch01-b141
          speaker: hurree
          text: "没人死。不过那女巫说不定有邪眼。"
        - id: ch01-b142
          speaker: kim
          text: "那你现在要做什么？"
        - id: ch01-b143
          speaker: hurree
          text: "你若去贝拿勒斯，我会送你上路，再把我们的人必须知道的事告诉你。"
        - id: ch01-b144
          speaker: kim
          text: "我去。火——车几点开？还要付钱给那个女巫吗？"
        - id: ch01-b145
          speaker: narrator
          text: "金站起来，看看凌乱冷落的屋子，又看看胡妮法蜡黄的脸。低低的朝阳正一点点爬过地板。"
        - id: ch01-b146
          speaker: hurree
          text: "不用。她借那些魔鬼的名义施法，保你不受任何魔鬼和危险侵害。这是马哈布的意思。依我看，他纵容这种迷信，实在太落伍。哎呀，这全是腹语，肚子说话，懂吗？"
        - id: ch01-b147
          speaker: narrator
          text: "金下意识弹了弹手指，想赶走胡妮法施法时可能混进来的什么邪祟。他知道马哈布绝不会害他。胡里又咯咯笑起来，可轮到他走过屋子时，脚下仍旧小心翼翼。他一步也不敢踩上胡妮法投在木板上的矮胖斑驳的影子。女巫邪力发作时，谁要是踩了她的影子，她就能抓住那个人的灵魂脚跟。"
        - id: ch01-b148
          speaker: narrator
          text: "两人离开那间凌乱冷落的屋子，来到清新明亮的户外，向火车站走去。"
        - id: ch01-b149
          speaker: hurree
          text: "现在你要仔细听。我们刚才亲眼看见的仪式，其中一项就是给本部门的人配发有效护符。摸摸脖子，你会找到一枚很便宜的小银护符。那是我们的，明白吗？"
        - id: ch01-b150
          speaker: kim
          text: "明白。哈瓦—迪利，也就是提心符。"
        - id: ch01-b151
          speaker: narrator
          text: "金摸着脖子。"
        - id: ch01-b152
          speaker: hurree
          text: "胡妮法做一个，收两卢比十二安那，另外还要算上各种各样的驱邪仪式。这样的护符很常见，不过有一部分涂着黑色珐琅，里面都装一张写满本地圣人名字之类的纸。那一部分归胡妮法制作，而且只替我们做。怕她没有照办，我们收到护符以后，还会在发出去之前放进一小片绿松石。石片由勒根先生提供，别处没有。整套办法都是我发明的。当然，这完全不是正式制度，可下属用着很方便。克赖顿上校不知道，他是欧洲人。绿松石就包在那张纸里。"
        - id: ch01-b153
          speaker: hurree
          text: "现在假定你跟着喇嘛，或者以后跟着我、跟着马哈布，陷进一个该死的绝境。我胆小，胆小透顶，可我去过的该死险地比头发还多。这时候，你就说，我是护符之子。很好。"
        - id: ch01-b154
          speaker: kim
          text: "我还是不大懂。而且这里不能让别人听见我们说英语。"
        - id: ch01-b155
          speaker: hurree
          text: "完全没事。我只是个先生，在你面前卖弄英语。我们这些先生都爱这样。我是说，护符之子表示你也许属于七兄弟。这是一个印度教和密宗组织，大家以为它早已绝迹，不过我写过笔记，证明它还在。你看，这都是我发明的。"
        - id: ch01-b156
          speaker: hurree
          text: "七兄弟成员很多。有人准备见鬼地割断你的喉咙时，或许会因此给你一线生机。总之会有用。这些愚蠢的本地人只要还没激动过头，听见一个人自称属于某个组织，杀他以前总会停下来想想。所以到了绝境，就说你是护符之子，也许能让你多喘一口气。这句话只能在万分危急时说，或者拿来跟陌生人开始接头。现在明白了吗？"
        - id: ch01-b157
          speaker: hurree
          text: "再假定我，或本部门任何一个人，改头换面来找你。只要我不愿意，你绝认不出我。将来我会证明给你看。比方说，我扮成拉达克商人，或者随便什么人，问你，要买宝石吗？你就说，我看着像买得起宝石的人吗？我会回答，再穷的人也买得起一块绿松石，或一份塔尔基安。"
        - id: ch01-b158
          speaker: kim
          text: "塔尔基安不是杂烩饭，也就是蔬菜咖喱吗？"
        - id: ch01-b159
          speaker: hurree
          text: "当然。你接着说，让我看看塔尔基安。我会说，这是女人煮的，可能坏了你的种姓。你再回答，人们去——找塔尔基安时，没有种姓之分。说到去——找，中间稍微停一下。全部暗号就是这些，秘密只在那个小停顿里。"
        - id: ch01-b160
          speaker: narrator
          text: "金把接头的句子重复了一遍。"
        - id: ch01-b161
          speaker: hurree
          text: "完全正确。时间够的话，我会给你看我的绿松石。你便知道我是谁，我们再交换意见、文件和其他东西。本部门任何人都一样。有时谈绿松石，有时谈塔尔基安，可那几个词中间总要停一下。这很容易。"
        - id: ch01-b162
          speaker: hurree
          text: "第一，陷进绝境就说护符之子，也许有用，也许没用。第二，要和陌生人办公务，就用塔尔基安暗号。当然，你现在没有公务。你是，啊哈，编外见习人员，非常罕见的样本。你若生来就是亚洲人，马上就能录用。这半年假期，是让你把英国味脱掉，明白吗？"
        - id: ch01-b163
          speaker: hurree
          text: "喇嘛正等着你。我已经半正式地告诉他，你通过了全部考试，很快会有政府职位。哦呵，你现在领的是代理津贴。所以护符之子若叫你帮忙，记得见鬼地尽力去办。现在该说再见了，亲爱的朋友。希望你最后能好端端地占到上风。"
        - id: ch01-b164
          speaker: narrator
          text: "到了勒克瑙车站入口，胡里向后退了两三步，没入人群，转眼不见。金深吸一口气，伸手把自己从头到脚摸了一遍。他能感觉到镀镍左轮手枪正贴着黯淡长袍的胸口。护符挂在颈上，化缘葫芦、念珠和降魔匕首也都在手边。勒根先生一样也没忘。除此以外，药物、测绘颜料盒和罗盘也全都带齐了。"
        - id: ch01-b165
          speaker: narrator
          text: "一条绣着豪猪刺花纹的破旧钱带里，装着整整一个月的薪水。此时此刻，世上的国王也不可能比金更富有。他向一个印度教小贩买了一叶杯甜食，欢天喜地地吃起来，直到一名警察把他从台阶上赶走。"
