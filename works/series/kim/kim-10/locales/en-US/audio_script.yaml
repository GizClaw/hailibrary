  chapters:
    - id: ch01
      title: Lessons on the Road
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: An old play describes a young hawk that has been kept too long from flight. It is no helpless nestling, but a traveling hawk that had caught prey before it was captured. It is fully feathered, trained, and dangerously hungry for the air. Give it the sky God made for it, the old words say, and what can keep it from flying? Lurgan Sahib's advice agreed with Mahbub's, though he gave it less plainly, and things went well for Kim. He had learned not to leave Lucknow in native clothes. Whenever Mahbub was near enough to receive a letter, Kim went to his camp and changed under the Pathan's careful eye. The little Survey paint-box he used at school could have told dangerous tales about those holidays, enough to have him expelled.
        - id: ch01-b02
          speaker: narrator
          text: Once, Kim and Mahbub traveled to Bombay with three truckloads of tram horses. Kim heard that horses from the Gulf sold for more than Kabul horses, and calmly proposed sailing across the Indian Ocean in a dhow to buy some. The idea nearly melted Mahbub. Kim also ate from the same dish as the great trader at a large Haj dinner. They returned by sea through Karachi. On the coasting steamer, Kim sat miserably on the forward hatch, certain that someone had poisoned him. Even the Babu's famous medicine-box, freshly stocked in Bombay, did him no good.
        - id: ch01-b03
          speaker: narrator
          text: Mahbub had business in Quetta. There Kim earned his keep, and perhaps more, by spending four strange days as a kitchen boy in the home of a fat Commissariat sergeant. At the right moment, he slipped a small vellum ledger out of the man's office-box. It seemed to record nothing but cattle and camel sales. Kim lay behind an outhouse through one hot moonlit night and copied every line. Then he returned the ledger, left without his wages when Mahbub told him to, and met the horse dealer six miles down the road with the clean copy hidden against his chest.
        - id: ch01-b04
          speaker: mahbub
          text: That soldier is only a little fish. In time, we may catch the larger one. He sells oxen at two prices, one for himself and one for the Government. I do not call that a sin.
        - id: ch01-b05
          speaker: kim
          text: Why didn't I just take the little book away?
        - id: ch01-b06
          speaker: mahbub
          text: Because he would have taken fright and warned his master. Then we might lose the trail of many new rifles moving north from Quetta. The Game is so large that we can see only a little of it at one time.
        - id: ch01-b07
          speaker: narrator
          text: Kim understood and said no more. This was during the monsoon holiday after he had won the mathematics prize.
        - id: ch01-b08
          speaker: narrator
          text: He spent the Christmas holiday with Lurgan Sahib, apart from ten days kept for his own amusement. Snow lay four feet deep on Jakko Road, so Kim sat mostly before a roaring wood fire. The little Hindu boy had gone away to be married, and Kim helped Lurgan string pearls. Lurgan made him memorize whole chapters of the Koran until he could give them the roll and rhythm of a mullah. He taught him the names and uses of many native drugs and the proper charms to recite while giving them. More usefully, he showed Kim how to care for his own body, treat attacks of fever, and use simple Road remedies. In the evenings, Lurgan wrote elaborate charms on parchment. Pentagrams crowned with the names of devils filled the pages. Murra and Awan, the Companion of Kings, appeared among fantastic marks in the corners.
        - id: ch01-b09
          speaker: narrator
          text: A week before Kim was due back at school, Colonel Creighton unfairly sent an examination made entirely of rods, chains, links, and angles.
        - id: ch01-b10
          speaker: narrator
          text: On the next holiday, Kim went out with Mahbub again. He nearly died of thirst while riding a camel across the sand to the mysterious walled city of Bikanir, where wells dropped four hundred feet and were lined from top to bottom with camel bone. Kim found no pleasure in the journey. Against their agreement, the Colonel ordered him to map that wild city. A Muslim horse boy or pipe tender could hardly drag Survey chains around the capital of an independent state, so Kim measured his distances by pacing them off with a bead rosary. He took compass bearings whenever he found the chance, mostly after dark when the camels had been fed. With six cakes of color and three brushes from his paint-box, he made something not entirely unlike a map of Jeysulmir.
        - id: ch01-b11
          speaker: narrator
          text: Mahbub laughed heartily and told him to add a written report. Kim began work in the back of the large account book kept beneath the flap of Mahbub's favorite saddle.
        - id: ch01-b12
          speaker: mahbub
          text: Put down everything you saw, touched, or thought about. Write as if the Viceroy himself had slipped in with a huge army ready for war.
        - id: ch01-b13
          speaker: kim
          text: How huge an army?
        - id: ch01-b14
          speaker: mahbub
          text: Say fifty thousand men.
        - id: ch01-b15
          speaker: kim
          text: That's foolish. Think how few wells there are, and how bad the water is. Not even a thousand thirsty men could come this way.
        - id: ch01-b16
          speaker: mahbub
          text: Then write that. Add the old breaks in the walls, where the firewood comes from, and what sort of temper the King has. I will stay until my horses are sold. We can hire a room by the gateway, and you can serve as my accountant. The door has a good lock.
        - id: ch01-b17
          speaker: narrator
          text: Kim wrote the report in the unmistakable running hand taught at St. Xavier's and painted the map in brown, yellow, and lake. Years later, both still survived, misfiled by a careless clerk among the rough notes of another survey, though the pencil writing must be almost gone by now. On the second day of their return journey, Kim sweated beside an oil lamp and translated the report aloud for Mahbub.
    - id: ch02
      title: A Dress of Honor
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: Mahbub rose and bent over his dappled saddlebags.
        - id: ch02-b02
          speaker: mahbub
          text: I knew your work would deserve a dress of honor, so I prepared one. If I were Amir of Afghanistan, and perhaps one day we shall see him, I would fill your mouth with gold.
        - id: ch02-b03
          speaker: narrator
          text: Smiling, he laid the clothes at Kim's feet. There was a gold-embroidered Peshawur cap shaped like a cone, and a great turban cloth with a wide gold fringe. There was an embroidered Delhi waistcoat over a flowing milk-white shirt, green pajamas with a twisted silk cord, and fine Russia-leather slippers. Their toes curled proudly, and they smelled wonderful.
        - id: ch02-b04
          speaker: mahbub
          text: New clothes put on Wednesday morning bring good luck. But we must remember that wicked people live in the world too.
        - id: ch02-b05
          speaker: narrator
          text: Kim had barely caught his breath at all this splendor when Mahbub completed it with a nickel-plated, mother-of-pearl revolver that held six cartridges.
        - id: ch02-b06
          speaker: mahbub
          text: I considered a smaller weapon, but this one takes Government bullets. A man can always find those, especially beyond the Border. Stand up. Let me see you.
        - id: ch02-b07
          speaker: narrator
          text: Mahbub clapped him on the shoulder and admired him as a young Pathan, joking about the hearts he would break and the eyes that would glance at him from beneath their lashes. Kim turned, pointed his toes, stretched, and reached without thinking for the moustache that had only begun to grow. Then he bent toward Mahbub's feet in thanks, his hands fluttering quickly because his heart was too full for speech. Mahbub stopped him and drew him into an embrace.
        - id: ch02-b08
          speaker: mahbub
          text: My son, what need have we for words? But isn't that little gun a delight? One twist throws out all six cartridges. Carry it inside your clothes, against your skin. That keeps it oiled. Never put it anywhere else, and God willing, one day you will kill a man with it.
        - id: ch02-b09
          speaker: kim
          text: Hai mai! If a Sahib kills a man, they hang him in jail.
        - id: ch02-b10
          speaker: mahbub
          text: True. One step beyond the Border, men know better. Put it away, but load it first. What use is an unfed gun?
        - id: ch02-b11
          speaker: kim
          text: I must give it back when I return to the school. They forbid little guns there. Will you keep it for me?
        - id: ch02-b12
          speaker: mahbub
          text: Son, I am tired of that school. They take a man's best years to teach him what he can learn only on the Road. The Sahibs' foolishness has no top or bottom. Still, perhaps this report will free you from more bondage. God knows we need more and more men in the Game.
        - id: ch02-b13
          speaker: narrator
          text: They crossed the salt desert toward Jodhpur with their jaws clenched against the blowing sand. Mahbub and his handsome nephew Habib Ullah traded busily there. Then the holiday ended. Kim sadly put on European clothes that were already growing too small and returned second-class to St. Xavier's, leaving the freedom of the Road behind him once more.
    - id: ch03
      title: The Colt Leaves the Stable
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: Three weeks later, Colonel Creighton was pricing Tibetan ghost daggers in Lurgan's shop when Mahbub openly rebelled. Lurgan stood ready to support him.
        - id: ch03-b02
          speaker: mahbub
          text: The pony is trained, finished, bridled, and taught his paces, Sahib. Keep him doing tricks now, and every day he will lose what he has learned. Drop the reins on his back. Let him go. We need him.
        - id: ch03-b03
          speaker: colonel
          text: But he is very young, Mahbub. He cannot be more than sixteen.
        - id: ch03-b04
          speaker: mahbub
          text: At fifteen, I had shot my man and fathered my man, Sahib.
        - id: ch03-b05
          speaker: narrator
          text: Creighton called him an unrepentant old heathen and turned to Lurgan. The black beard nodded agreement with the Afghan's scarlet-dyed one.
        - id: ch03-b06
          speaker: lurgan
          text: I would have used the boy long ago. The younger, the better. That is why I set a child to watch my most valuable jewels. You sent Kim to me for testing, and I tried him in every way. He is the only boy I could not force to see things.
        - id: ch03-b07
          speaker: mahbub
          text: You mean in the crystal, and in the pool of ink?
        - id: ch03-b08
          speaker: lurgan
          text: No. I mean under my hand, as I told you. It had never failed before. That was three years ago. It proves he is strong enough to make another person do what he wants, though the Colonel thinks such things are nonsense. I have taught him much since then. You are wasting him now.
        - id: ch03-b09
          speaker: colonel
          text: Hmm. You may be right. But you know there is no Survey work for him just now.
        - id: ch03-b10
          speaker: mahbub
          text: Let him out. Let him go. No one loads a young colt with a heavy burden at once. Let him run with the caravans like one of our white camel colts, for luck. I would take him myself, but—
        - id: ch03-b11
          speaker: lurgan
          text: There is a small matter in the South where he could be extremely useful.
        - id: ch03-b12
          speaker: narrator
          text: Lurgan spoke with peculiar softness and lowered his heavy blue eyelids.
        - id: ch03-b13
          speaker: colonel
          text: E.23 is handling that. Kim must not go there. Besides, he knows no Turki.
        - id: ch03-b14
          speaker: lurgan
          text: Tell him the shape and smell of the letters we need. He will bring them back.
        - id: ch03-b15
          speaker: colonel
          text: No. That work is for a man.
        - id: ch03-b16
          speaker: narrator
          text: It was a twisted affair involving secret letters that had not been authorized and could stir up violence. One writer claimed the final word on the Muslim faith throughout the world. The other was a younger member of a royal house who had already been called to account for kidnapping women inside British territory. The religious leader had written with fierce, overbearing certainty. The young prince merely sulked because his privileges had been cut down. There was no reason to let the exchange continue, since the letters might one day compromise him. An agent had secured one of them, but was later found dead beside the road dressed as an Arab trader. E.23 reported the death when he took over the work. These facts, along with several others that could not be published, made Creighton and Mahbub shake their heads.
        - id: ch03-b17
          speaker: mahbub
          text: Let him travel with his Red Lama. He loves the old man. At least he can learn to count his paces with a rosary.
        - id: ch03-b18
          speaker: colonel
          text: I have dealt with the old man by letter. Where does he go?
        - id: ch03-b19
          speaker: mahbub
          text: Everywhere, just as he has for three years. He searches for a River of Healing. When he leaves the Road, he stays at the Temple of the Tirthankars or at Buddh Gaya. Then he visits the boy at school. We know because Kim was punished for it more than once. The lama is mad but harmless. I have met him. The Babu has dealt with him too. We have watched him for three years. A Red Lama is too rare in India to lose.
        - id: ch03-b20
          speaker: lurgan
          text: Babus are very curious. Do you know what Hurree Babu truly wants? He wants to enter the Royal Society by collecting notes about different peoples. I tell him everything about the lama that Mahbub and Kim tell me. Then Hurree travels to Benares, at his own expense, I believe.
        - id: ch03-b21
          speaker: colonel
          text: I don't believe that.
        - id: ch03-b22
          speaker: narrator
          text: Creighton had paid Hurree's travel costs himself because he was intensely curious about the lama.
        - id: ch03-b23
          speaker: lurgan
          text: Hurree asks the lama about Lamaism, devil dances, spells, and charms. He has done it several times. Holy Virgin, I could have told him all that years ago. Perhaps Hurree is growing too old for the Road. He would rather collect manners and customs now. Yes, he wants those letters after his name.
        - id: ch03-b24
          speaker: colonel
          text: He thinks well of Kim, doesn't he?
        - id: ch03-b25
          speaker: lurgan
          text: Very well indeed. We have spent pleasant evenings together at my place. But it would be wasteful to hand Kim over entirely to Hurree's study of peoples.
        - id: ch03-b26
          speaker: colonel
          text: Not for his first experience. What do you say, Mahbub? Let Kim travel with the lama for six months. Then we can decide. He will gain experience.
        - id: ch03-b27
          speaker: mahbub
          text: He already has experience, Sahib, as naturally as a fish has the water it swims in. But for every reason, freeing him from school is wise.
        - id: ch03-b28
          speaker: colonel
          text: Very well. He may go where he chooses with the lama, and Hurree Babu may watch them if he wishes. Hurree will not lead the boy into danger the way Mahbub would. His wish to join the Royal Society is curious, and very human. Ethnology truly is his best work.
        - id: ch03-b29
          speaker: narrator
          text: Creighton himself could not have been tempted away from the Indian Survey by money or promotion. Yet deep in his heart, he too longed to put the letters F.R.S. after his name. Lesser honors might come through cleverness and the aid of friends. As far as he knew, though, the Royal Society admitted a man only for real work, with papers representing a lifetime of it. For years he had bombarded the Society with studies of strange Asian faiths and unknown customs. Nine men out of ten would flee a Royal Society evening from sheer boredom, but Creighton was the tenth man. Sometimes he yearned for those crowded, comfortable rooms in London. He pictured silver-haired and bald-headed gentlemen who knew nothing of the Army strolling among spectroscope experiments and displays of small plants from the frozen tundra. There would be electrical machines for measuring flight and devices for cutting the left eye of a female mosquito into fractions of a millimeter. By every sensible rule, the Royal Geographical Society ought to have attracted him more. But grown men choose their toys as unpredictably as children. Thinking of Hurree's matching desire, Creighton smiled and liked him better for it.
        - id: ch03-b30
          speaker: narrator
          text: He let the ghost dagger fall and looked up. Mahbub read the answer in his eyes.
        - id: ch03-b31
          speaker: mahbub
          text: How soon can we take the colt out of the stable?
        - id: ch03-b32
          speaker: colonel
          text: If I remove him by official order now, what do you think he will do? I have never helped educate anyone like him.
        - id: ch03-b33
          speaker: mahbub
          text: He will come to me. Lurgan Sahib and I will prepare him for the Road.
        - id: ch03-b34
          speaker: colonel
          text: Then it is settled. For six months, he may run as he pleases. But who will answer for him?
        - id: ch03-b35
          speaker: narrator
          text: Lurgan inclined his head slightly.
        - id: ch03-b36
          speaker: lurgan
          text: If you fear he will talk, he will not.
        - id: ch03-b37
          speaker: colonel
          text: He is only a boy.
        - id: ch03-b38
          speaker: lurgan
          text: Yes, but first, he has nothing to reveal. Second, he knows what would happen if he did. And he is deeply attached to Mahbub, and a little attached to me.
        - id: ch03-b39
          speaker: mahbub
          text: Will he be paid?
        - id: ch03-b40
          speaker: colonel
          text: Only a food and water allowance. Twenty rupees each month.
        - id: ch03-b41
          speaker: narrator
          text: The Secret Service had one advantage. It demanded no troublesome audit. Its funds were absurdly small, but the few men controlling them asked for no vouchers or detailed accounts. Mahbub's eyes brightened with almost a Sikh's love of money, and even Lurgan's still face changed. Lurgan looked into the years ahead. Once Kim had entered the Great Game that never stopped, day or night, anywhere in India, the praise of a chosen few would bring honor and credit to the man who had trained him. Lurgan had already made E.23 what he was, shaping him from a bewildered, cheeky, lying little man of the North-West Provinces.
        - id: ch03-b42
          speaker: narrator
          text: Yet their smoky, guarded pleasure was nothing beside Kim's joy when the head of St. Xavier's called him aside. Colonel Creighton had sent for him.
        - id: ch03-b43
          speaker: principal
          text: O'Hara, I understand the Colonel has found you work as an assistant chainman in the Canal Department. That is the reward for doing well in mathematics. You are only sixteen, so this is extraordinary luck. Of course, you will not become permanent until you pass the autumn examination. Do not imagine you are going into the world for amusement, or that your fortune is already made. Much hard work lies ahead. Still, if you become permanent, you might earn four hundred and fifty rupees a month one day.
        - id: ch03-b44
          speaker: narrator
          text: The Principal gave long advice about Kim's behavior, manners, and morals. Older boys who had received no jobs talked bitterly of favoritism and corruption. Young Cazalet even hinted that Colonel Creighton must be Kim's father. Kim did not strike back or even swear. He was thinking of the tremendous fun ahead and of Mahbub's neat English letter from the day before. It told him to meet that afternoon at a house whose very name would have horrified the Principal.
    - id: ch04
      title: Huneefa's Protection
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: That evening, above the luggage scales at Lucknow station, Kim asked Mahbub whether everything was truly finished. He had feared that at the final moment the roof would fall and cheat him. Mahbub snapped his fingers to show how completely school had ended, and his eyes glowed like red coals.
        - id: ch04-b02
          speaker: kim
          text: Then give me the pistol, so I can wear it.
        - id: ch04-b03
          speaker: mahbub
          text: Gently! You have half a year to run without heel ropes. I begged that much from Colonel Creighton, at twenty rupees a month. Old Red Hat knows you are coming.
        - id: ch04-b04
          speaker: kim
          text: I will pay you commission for three months. Two rupees a month. But first, we must be rid of these things.
        - id: ch04-b05
          speaker: narrator
          text: Kim tugged at his collar and thin linen trousers. He had brought everything he needed for the Road, and sent his trunk to Lurgan Sahib.
        - id: ch04-b06
          speaker: mahbub
          text: Lurgan sends his greetings to you, Sahib.
        - id: ch04-b07
          speaker: kim
          text: Lurgan Sahib is very clever. But where are you going?
        - id: ch04-b08
          speaker: mahbub
          text: North again, into the Great Game. Where else? Are you still determined to follow old Red Hat?
        - id: ch04-b09
          speaker: kim
          text: Don't forget that he made me what I am, though he never knew it. Every year, he sent the money for my schooling.
        - id: ch04-b10
          speaker: mahbub
          text: I would have paid as much if the thought had entered my thick head. Come. The lamps are lit, and no one will notice you in the bazaar. We are going to Huneefa's house.
        - id: ch04-b11
          speaker: narrator
          text: As they walked, Mahbub warned Kim about women much as Lemuel's mother had warned her son. With curious care, he explained exactly how Huneefa and women like her had brought kings to ruin. Then he teasingly repeated an old insult once aimed at himself. It advised a man to trust a snake before a harlot, and a harlot before a Pathan named Mahbub Ali.
        - id: ch04-b12
          speaker: mahbub
          text: Except for the insult to Pathans, since I am one, every word of that advice is true. It is most true in the Great Game. Women are the means by which careful plans come to ruin. Then morning finds us lying in the open with our throats cut. I knew one man whose story ended exactly that way.
        - id: ch04-b13
          speaker: narrator
          text: Mahbub supplied the bloodiest details. Kim began to ask why, then stopped before a filthy staircase leading into the warm darkness above Azim Ullah's tobacco shop. Those who knew the place called it the Birdcage because it was packed with whispers, whistles, and chirps.
        - id: ch04-b14
          speaker: narrator
          text: The upper room held dirty cushions and half-smoked hookahs and reeked of stale tobacco. In one corner lay a huge, shapeless woman in greenish gauze. Heavy jewelry covered her from brow to ankle, and when she moved, she sounded like copper pots striking together. A thin cat mewed hungrily on the balcony. Kim stopped, confused, at the curtain.
        - id: ch04-b15
          speaker: huneefa
          text: Is this the new merchandise, Mahbub? O Buktanoos, he is handsome.
        - id: ch04-b16
          speaker: narrator
          text: Huneefa barely bothered to lift the hookah mouthpiece. Mahbub explained that her words were part of selling a horse, and Kim laughed.
        - id: ch04-b17
          speaker: kim
          text: I have heard talk like that since I was six days old. Where does it lead?
        - id: ch04-b18
          speaker: mahbub
          text: To protection. Tonight, we change your color. Sleeping under roofs has bleached you like an almond. Huneefa knows a dye that stays, not paint that fades in a day or two. She will also guard you against dangers on the Road. That is my gift to you, my son. Remove every piece of metal and put it here. Huneefa, begin.
        - id: ch04-b19
          speaker: narrator
          text: Kim pulled out his compass, Survey paint-box, and newly filled medicine-box. They had traveled everywhere with him, and he prized them as a boy would. Huneefa rose slowly with her hands spread before her. Then Kim realized that she was blind.
        - id: ch04-b20
          speaker: huneefa
          text: No, the Pathan speaks truly. My color does not vanish in a week or a month. Those under my protection are strongly guarded.
        - id: ch04-b21
          speaker: mahbub
          text: A man traveling far and alone should not suddenly turn blotched like a leper. When you were with me, I could watch over this. A Pathan's skin is fair too. Strip to the waist and see how pale you have grown. It does not matter. She cannot see.
        - id: ch04-b22
          speaker: narrator
          text: Huneefa returned from an inner room, and Mahbub took a pewter bowl from her jeweled hand. The dye was blue and sticky. Kim dabbed a little cotton on his wrist, but Huneefa heard him.
        - id: ch04-b23
          speaker: huneefa
          text: No! That is not how it is done. There must be proper ceremonies. The color is the smallest part. I give you the full protection of the Road.
        - id: ch04-b24
          speaker: kim
          text: Magic?
        - id: ch04-b25
          speaker: narrator
          text: Kim started. He disliked her white, sightless eyes. Mahbub pressed his neck until his face was within an inch of the floorboards.
        - id: ch04-b26
          speaker: mahbub
          text: Be still. Nothing will hurt you, my son. I offer myself in your place.
        - id: ch04-b27
          speaker: narrator
          text: Kim could not see Huneefa's work, but for many minutes he heard her jewelry clash like dishes. A match flared in the darkness. Incense purred and fizzed, and heavy, sweet smoke filled the room until he grew numb with sleep. Through the gathering haze, he heard the names of devils. Zulbazan, son of Eblis, lived in bazaars and roadside camps and stirred up the sudden wickedness of halting places. Dulhan hid near mosques among the faithful's shoes and kept people from prayer. Musboot ruled lies and panic. Huneefa whispered close to Kim's ear, then seemed to speak from an immense distance. Her horribly soft fingers touched him, but Mahbub's grip never moved from his neck. Kim fought against them until, at last, the hand relaxed with a sigh and he lost consciousness.
        - id: ch04-b28
          speaker: mahbub
          text: Allah, how he fought! Without the drugs, we could never have done it. I suppose that was his white blood. Continue the invocation. Give him complete protection.
        - id: ch04-b29
          speaker: huneefa
          text: O Hearer, you who hear with ears, come near. Listen, O Hearer!
        - id: ch04-b30
          speaker: narrator
          text: Huneefa turned her dead eyes westward and moaned. Snorts and cries filled the dark room. On the outer balcony, a large figure raised his round head and coughed nervously.
        - id: ch04-b31
          speaker: hurree
          text: Please do not interrupt this ventriloquial necromancy, my friend. I understand it is disturbing, but no enlightened observer becomes jolly well upset.
        - id: ch04-b32
          speaker: huneefa
          text: I will plan their destruction! O Prophet, be patient with the unbelievers. Leave them alone for a little while!
        - id: ch04-b33
          speaker: narrator
          text: Huneefa faced north, her features twisting, while voices seemed to answer from the ceiling. Hurree returned to the notebook balanced on the sill, though his hand shook. Beside Kim's motionless head, Huneefa rocked in a drugged trance. She summoned devils in the ritual's ancient order and bound each one to stay away from everything the boy did.
        - id: ch04-b34
          speaker: huneefa
          text: He holds the keys to secret things! He alone knows them. He knows all that is on dry land and in the sea!
        - id: ch04-b35
          speaker: narrator
          text: The unearthly whistling broke out again.
        - id: ch04-b36
          speaker: hurree
          text: I understand that none of this is harmful? She has not killed the boy, has she? If she has, I refuse to appear at the trial. What was the name of that last theoretical devil?
        - id: ch04-b37
          speaker: mahbub
          text: Babuji, I care nothing for the devils of India. The Sons of Eblis are different. Whether friendly or terrible, they do not love unbelievers.
        - id: ch04-b38
          speaker: hurree
          text: Then perhaps I should leave? They are only dematerialized phenomena, of course. Spencer says so.
        - id: ch04-b39
          speaker: narrator
          text: Like all such crises, Huneefa's ended in a violent fit of howling, with foam touching her lips. Still sitting cross-legged beside Kim, she had twisted herself back and forth through the ancient ritual. Now she collapsed beside his unmoving head, completely spent and motionless. At once, the room's mad whistling and the voices that seemed to come from nowhere fell silent.
        - id: ch04-b40
          speaker: mahbub
          text: Wah! It is finished. May it help the boy. Huneefa truly masters these invocations. Help me pull her aside, Babu. Do not be afraid.
        - id: ch04-b41
          speaker: hurree
          text: How could I fear something that absolutely does not exist?
        - id: ch04-b42
          speaker: narrator
          text: Hurree spoke English to steady himself. It is a terrible thing to study magic with contempt while still fearing it, and to collect folklore for the Royal Society while holding a lively belief in every Power of Darkness. Mahbub chuckled because he knew the Babu well. The two men had already traveled together on the Road.
        - id: ch04-b43
          speaker: mahbub
          text: Let us finish dyeing him. The boy is protected, if the Lords of the Air can hear. I am a free thinker, but if one can approach a woman, a stallion, or a devil from the blind side, why walk around and invite a kick? Set Kim on his way, Babu, and make sure old Red Hat does not take him beyond our reach. I must return to my horses.
        - id: ch04-b44
          speaker: hurree
          text: All right. At present, he is a most curious spectacle.
    - id: ch05
      title: Son of the Charm
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: Near the third crowing of the cock, Kim woke from what felt like a thousand years of sleep. Huneefa snored heavily in her corner. Mahbub was gone.
        - id: ch05-b02
          speaker: hurree
          text: I hope you were not frightened. I supervised the complete operation. From an ethnological point of view, it was most interesting. That was a very high-class invocation.
        - id: ch05-b03
          speaker: narrator
          text: Kim grunted when he recognized Hurree Babu's oily voice. Hurree smiled at him.
        - id: ch05-b04
          speaker: hurree
          text: I also had the honor of bringing your present costume down from Lurgan. Officially, I do not carry such decorations for subordinates, but your case is marked as exceptional in the records. I hope Mr. Lurgan takes notice of my service.
        - id: ch05-b05
          speaker: narrator
          text: Kim yawned, stretched, and delighted in the freedom of loose clothes again. Then he examined the heavy woolen garment, full of scents from the far North.
        - id: ch05-b06
          speaker: kim
          text: What is this?
        - id: ch05-b07
          speaker: hurree
          text: That is the modest clothing of a disciple who serves a Lamaist lama, complete in every detail. It is not precisely your old gentleman's religion, in my opinion, but a branch of it. I once sent the Asiatic Quarterly Review some rejected notes on the subject. Curiously, your old gentleman himself has no real religion. He is not particular at all.
        - id: ch05-b08
          speaker: kim
          text: Do you know him?
        - id: ch05-b09
          speaker: narrator
          text: Hurree held up one hand while he cleaned his teeth in the proper Bengali fashion. Then he recited an Arya-Somaj prayer in English and filled his mouth with betel.
        - id: ch05-b10
          speaker: hurree
          text: Oh yes. I have met him several times in Benares and at Buddh Gaya. I questioned him about religion and devil worship. He is a pure agnostic, exactly like me.
        - id: ch05-b11
          speaker: narrator
          text: Huneefa moved in her sleep. Hurree jumped, hurried to the blackened incense burner, rubbed soot on one finger, and drew it diagonally across his face.
        - id: ch05-b12
          speaker: kim
          text: Who has died in your house?
        - id: ch05-b13
          speaker: hurree
          text: No one. But that sorceress may possess the Evil Eye.
        - id: ch05-b14
          speaker: kim
          text: What will you do now?
        - id: ch05-b15
          speaker: hurree
          text: If you are going to Benares, I shall start you on your way and explain what people in our service must know.
        - id: ch05-b16
          speaker: kim
          text: I am going. What time does the train leave? Do we owe that witch money?
        - id: ch05-b17
          speaker: narrator
          text: Kim stood, looked around the ruined room, and watched the low sun cross Huneefa's yellow, waxen face.
        - id: ch05-b18
          speaker: hurree
          text: No money is owed. At Mahbub's request, she called on her own devils to charm you against every devil and every danger. I consider him extremely old-fashioned to encourage such superstition. Why, the whole performance was ventriloquism, you see. It was only belly speaking.
        - id: ch05-b19
          speaker: narrator
          text: Kim snapped his fingers without thinking, to turn aside any evil that might have entered through Huneefa's work. He knew Mahbub meant him no harm, and Hurree giggled once more. Still, as the Babu crossed the room, he carefully avoided Huneefa's squat, blotched shadow where it lay across the boards. When their power is upon them, witches can catch a man's soul by the heels if he steps there.
        - id: ch05-b20
          speaker: hurree
          text: Listen very carefully now. One part of the ceremony was the issue of an official amulet to members of our Department. Feel your neck. You will find a small, very cheap silver charm. That one belongs to us. Do you understand?
        - id: ch05-b21
          speaker: kim
          text: Oh yes. A heart-lifter.
        - id: ch05-b22
          speaker: hurree
          text: Huneefa makes them for two rupees and twelve annas, with all sorts of exorcisms. They are common charms, except for part of the black enamel and the paper inside, which is full of local saints' names and similar things. That part is Huneefa's responsibility. She makes these only for us. If one somehow reaches us without it, we add a small piece of turquoise before issuing it. Mr. Lurgan supplies the stones, wrapped inside the paper. There is no other source. I invented the entire arrangement. It is unofficial, naturally, but convenient for subordinates. Colonel Creighton knows nothing about it. He is European.
        - id: ch05-b23
          speaker: hurree
          text: Suppose you travel with the lama, with Mahbub, or someday with me. We might find ourselves in a devilishly tight place. I am a very fearful man, but I have been in more tight places than I have hairs on my head. Then you say, "I am a Son of the Charm."
        - id: ch05-b24
          speaker: kim
          text: I do not quite understand. And we should not speak English where people can hear us.
        - id: ch05-b25
          speaker: hurree
          text: That is all right. I am only a Babu displaying my English. All Babus do that. "Son of the Charm" suggests that you might belong to the Sat Bhai, the Seven Brothers. It is a Hindi and Tantric society that people believe is extinct, though I have written notes proving that it survives. Of course, the whole arrangement is my invention. But the Sat Bhai is supposed to have many members. Before a man cuts your throat, he may give you just one chance to live. These foolish natives, unless they are too excited, will always stop and think before killing anyone who claims a particular organization. So the words may give you time to catch your breath and open negotiations with a stranger. Use them only in the most extreme danger. Do you see?
        - id: ch05-b26
          speaker: narrator
          text: Kim understood that much. Hurree went on to explain how members of the Department recognized one another in disguise.
        - id: ch05-b27
          speaker: hurree
          text: Suppose I come to you dressed as a Ladakhi trader. You would never know me unless I chose. I ask, "Would you like to buy precious stones?" You answer, "Do I look like a buyer of precious stones?" I say, "Even a very poor man can buy a turquoise, or tarkeean."
        - id: ch05-b28
          speaker: kim
          text: But tarkeean is a vegetable curry.
        - id: ch05-b29
          speaker: hurree
          text: Exactly. You ask to see the tarkeean. I warn that a woman cooked it, so it might violate your caste. Then you say, "There is no caste when men go to—look for tarkeean." Pause just before "look." That little pause is the whole secret.
        - id: ch05-b30
          speaker: narrator
          text: Kim repeated the sentence with the pause in the right place.
        - id: ch05-b31
          speaker: hurree
          text: Very good. If there is time, I show you my turquoise. Then you know who I am, and we can exchange information, papers, and whatever else is needed. Every other man in our service uses the same test. Sometimes we talk about turquoises and sometimes about tarkeean, but the little pause in the sentence is always there. It is very easy. Remember the two rules. Say "Son of the Charm" when you are trapped. Perhaps it will help you, and perhaps it will not. Use the tarkeean sentence when you need to conduct official business with a strange man.
        - id: ch05-b32
          speaker: hurree
          text: For now, you have no official business. You are an extra man on trial, a completely unusual specimen. If you had been born Asian, you could begin work at once. This half-year of leave is meant to rub the Englishness out of you. The lama expects you because I partly and unofficially told him that you had passed every examination and would soon receive a Government appointment. You are drawing an acting allowance now. So if anyone who is a Son of the Charm asks for your aid, be sure you make a serious attempt to help. Now I say good-bye, my dear fellow. I hope you come safely through and finish on top.
        - id: ch05-b33
          speaker: narrator
          text: Hurree stepped backward a pace or two into the crowd at the entrance to Lucknow station and vanished. Kim drew a deep breath and hugged himself all over. He could feel the nickel-plated revolver against his chest inside the dull-colored robe, and the silver amulet rested at his neck. His begging bowl, rosary, and ghost dagger were all within reach. Lurgan had forgotten nothing. Kim also carried the medicine-box, the little Survey paint-box, and his compass. A full month's pay lay in a worn old purse belt embroidered with patterns made from porcupine quills.
        - id: ch05-b34
          speaker: narrator
          text: No king anywhere could have been richer. Kim bought sweetmeats in a leaf cup from a Hindu trader and ate them in pure delight until a policeman ordered him away from the steps.
