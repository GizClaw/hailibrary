audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts: {delivery: "从容而机敏的讲述", timbre: "温暖清晰", pace: "舒展而有变化", pitch: "中音"}
    kim:
      display_name: 金
      tts: {delivery: "机灵大胆，话里常带笑", timbre: "明亮的少年声", pace: "轻快敏捷", pitch: "中高音"}
    lama:
      display_name: 喇嘛
      tts: {delivery: "慈和虔敬，偶有孩子般的急切", timbre: "苍老柔厚", pace: "缓慢沉思", pitch: "中低音"}
    sikh_artisan:
      display_name: 锡克工匠
      tts: {delivery: "沉稳爽直", timbre: "粗厚结实", pace: "平稳", pitch: "中低音"}
    cultivator:
      display_name: 农夫
      tts: {delivery: "朴实克制", timbre: "宽厚低沉", pace: "不紧不慢", pitch: "低音"}
    cultivator_wife:
      display_name: 农夫妻子
      tts: {delivery: "泼辣利落，善心藏在锋利话头里", timbre: "响亮有力", pace: "明快", pitch: "中高音"}
    amritsar_woman:
      display_name: 阿姆利则女人
      tts: {delivery: "世故从容，略带戏谑", timbre: "柔亮成熟", pace: "从容", pitch: "中音"}
    moneylender:
      display_name: 放债人
      tts: {delivery: "圆滑自得", timbre: "饱满油润", pace: "稍慢", pitch: "中音"}
    dogra_soldier:
      display_name: 多格拉士兵
      tts: {delivery: "年轻好胜，带军人的干脆", timbre: "清朗硬实", pace: "利落", pitch: "中音"}
    guard:
      display_name: 列车员
      tts: {delivery: "不耐烦而公事公办", timbre: "沙哑", pace: "短促", pitch: "中低音"}
    creighton:
      display_name: 克赖顿
      tts: {delivery: "谨慎低调，措辞简短", timbre: "冷静清楚", pace: "平稳", pitch: "中低音"}
    woman_voice:
      display_name: 屋内女人
      tts: {delivery: "亲近而催促", timbre: "清亮成熟", pace: "自然", pitch: "中音"}
    young_officer:
      display_name: 年轻军官
      tts: {delivery: "愉快而服从", timbre: "清朗", pace: "敏捷", pitch: "中音"}
    commander:
      display_name: 总司令
      tts: {delivery: "果断威严，不容迟疑", timbre: "锐利低沉", pace: "紧凑", pitch: "低音"}
    scullion:
      display_name: 帮厨
      tts: {delivery: "忙乱粗鲁", timbre: "粗亮", pace: "急促", pitch: "中音"}
    family_priest:
      display_name: 家中祭司
      tts: {delivery: "庄重自信，喜欢卖弄学问", timbre: "苍老浑厚", pace: "徐缓", pitch: "中低音"}
    woman_guest:
      display_name: 院中女人
      tts: {delivery: "好奇而兴奋", timbre: "明亮", pace: "稍快", pitch: "中高音"}
  chapters:
    - id: ch01
      title: 夜车南行
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: "谁若摆脱傲慢，不轻蔑任何信仰，也不鄙薄任何祭司，便能感到整个东方的灵魂。长夜快要过去，金和喇嘛走进了堡垒般的火车站。货场上方，电线咝咝作响，北方运来的大宗粮食正在那里装卸。"
        - id: ch01-b02
          speaker: lama
          text: "这是魔鬼造的！"
          emotion: fearful
        - id: ch01-b03
          speaker: narrator
          text: "幽暗的大厅空空荡荡，到处都是回声。砖砌月台之间，铁轨发着微光，头顶的钢梁纵横交错，叫人眼花缭乱。喇嘛站在巨大的石厅里，只见三等车的乘客头一晚就买好了票，此刻全睡在候车室的地上，远看像一排排蒙着白布的死人。东方人不大计较一天里的时辰，火车自然也昼夜都载客。"
        - id: ch01-b04
          speaker: kim
          text: "喷火的车就在这里停。你看那个洞，后面坐着卖票的人。他会给你一张纸，让你去安巴拉。"
        - id: ch01-b05
          speaker: lama
          text: "可我们要去贝拿勒斯。"
        - id: ch01-b06
          speaker: kim
          text: "都一样，那就买到贝拿勒斯。快点，车来了！"
        - id: ch01-b07
          speaker: lama
          text: "钱袋交给你吧。"
        - id: ch01-b08
          speaker: narrator
          text: "喇嘛先前装得像是很懂火车，其实一点也不懂。凌晨三点二十五分，南行列车轰隆隆冲进车站，他吓得直往后退。满地熟睡的人一下全醒了。卖水的、卖糖果的放声叫卖，警察高声吆喝，女人们尖叫着收拢篮子、孩子和丈夫。喇嘛竟把一小袋卢比全交给金，单纯得叫他吃惊。"
        - id: ch01-b09
          speaker: kim
          text: "别怕，只是火——车。它不会冲到这里来。你在这儿等着！"
        - id: ch01-b10
          speaker: narrator
          text: "金付钱买去安巴拉的票。昏昏欲睡的售票员却扔给他一张只到下一站的车票，那地方才六英里远。"
        - id: ch01-b11
          speaker: kim
          text: "不对。这招骗得过乡下人，可我住在拉合尔。巴布，你这一手倒聪明。现在把安巴拉的票给我。"
        - id: ch01-b12
          speaker: narrator
          text: "售票员沉着脸换了票。金却又叫他拿一张只到阿姆利则的。原来金根本不打算花马哈布·阿里的钱，老老实实买全程票去安巴拉。在他看来，这样花钱实在太笨。票价应该多少，找回的钱应该多少，他全算得一清二楚。"
        - id: ch01-b13
          speaker: kim
          text: "我懂火——车的规矩。从来没有哪个瑜伽士像你这样离不开弟子。没有我，他们早把你扔在米安米尔了。来，走这边！"
        - id: ch01-b14
          speaker: narrator
          text: "金把钱袋还给喇嘛，只从安巴拉票价的每个卢比里留下一个安那，当作自己的佣金。这是亚洲从古到今的规矩。三等车厢挤得满满的，敞开的车门后全是陌生的脸。喇嘛来到门口，身子往后一缩，又不肯进去了。"
        - id: ch01-b15
          speaker: lama
          text: "我们走路不是更好吗？"
        - id: ch01-b16
          speaker: sikh_artisan
          text: "他害怕吗？别怕。我从前也怕火车。进来吧，这是政府造的东西。"
        - id: ch01-b17
          speaker: lama
          text: "我并不怕。里面还能容下两个人吗？"
        - id: ch01-b18
          speaker: cultivator_wife
          text: "连只老鼠都塞不进来了！"
        - id: ch01-b19
          speaker: narrator
          text: "说话的是个家境富裕的农夫妻子。她丈夫是印度教贾特人，来自富饶的贾朗达尔地区。夜车不像日车照管得那么周到，男女并没有严格分坐不同车厢，所以这一车人才能挤在一处斗嘴。"
        - id: ch01-b20
          speaker: cultivator
          text: "孩子他娘，总能挤出一点地方。把孩子抱起来吧。你看，这是一位圣人。"
        - id: ch01-b21
          speaker: cultivator_wife
          text: "我腿上堆着七七四十九件包袱！不要脸的，你怎么不叫他坐我膝上？男人全是这个样子！"
        - id: ch01-b22
          speaker: narrator
          text: "她四下张望，想找人赞同。窗边坐着一个阿姆利则女人，靠卖笑为生。她把脸藏在头巾后面，只从鼻子里哼了一声。"
        - id: ch01-b23
          speaker: moneylender
          text: "进来，快进来！善待穷人，总归是好事。"
        - id: ch01-b24
          speaker: narrator
          text: "这是个肥胖的印度教放债人。他把折叠账簿包在布里，紧紧夹在腋下，脸上堆着油滑的笑容，仿佛刚才那句话真是出于一片慈悲。"
        - id: ch01-b25
          speaker: dogra_soldier
          text: "当然好。每月收七分利，还得拿没出生的牛犊作抵押。"
        - id: ch01-b26
          speaker: narrator
          text: "说话的是一个向南休假的年轻多格拉士兵，车里的人全笑了。"
        - id: ch01-b27
          speaker: lama
          text: "这辆车会开到贝拿勒斯吗？"
        - id: ch01-b28
          speaker: kim
          text: "当然会，要不大家上来干什么？快进来，不然车要开了！"
        - id: ch01-b29
          speaker: amritsar_woman
          text: "你们快看，他从来没坐过火车！"
        - id: ch01-b30
          speaker: cultivator
          text: "来，我拉你上来。老人家，就是这样上车。"
        - id: ch01-b31
          speaker: lama
          text: "可是我要坐在地上。戒律不许我坐长凳，而且那样坐着，我浑身不自在。"
        - id: ch01-b32
          speaker: moneylender
          text: "要我说，世上每一条正当生活的规矩，都叫火——车破坏了。你看，我们竟得和各个种姓、各色人等挨着坐。"
        - id: ch01-b33
          speaker: cultivator_wife
          text: "不错，还得跟最不要脸的人坐在一起。"
        - id: ch01-b34
          speaker: narrator
          text: "她狠狠瞪着阿姆利则女人。那女人正朝年轻士兵暗送秋波。农夫没接她的话，只嘟囔说，早知如此，不如坐车沿着大路走，还能省下一点钱。"
        - id: ch01-b35
          speaker: cultivator_wife
          text: "省下的钱，路上吃饭又得花掉两倍。这件事早说过一万遍了。"
        - id: ch01-b36
          speaker: cultivator
          text: "是啊，你用一万条舌头说过。"
        - id: ch01-b37
          speaker: cultivator_wife
          text: "可怜我们女人，要是连话都不许说，只好求神保佑了。原来这位圣人不能看女人，也不能答女人的话。他的弟子也守这规矩吗？"
        - id: ch01-b38
          speaker: kim
          text: "不守，母亲。要是女人长得漂亮，尤其还肯给饿肚子的人东西吃，我就更不守了。"
        - id: ch01-b39
          speaker: sikh_artisan
          text: "一听就是讨饭人的回答。姐姐，这是你自己招来的！"
        - id: ch01-b40
          speaker: narrator
          text: "金把双手弯在胸前，摆出乞求的样子。农夫妻子从油腻的包裹里掰下半块饼，递给他。"
        - id: ch01-b41
          speaker: cultivator_wife
          text: "你要去哪里？"
        - id: ch01-b42
          speaker: kim
          text: "一直去贝拿勒斯。"
        - id: ch01-b43
          speaker: dogra_soldier
          text: "你们是耍把戏的吧？会不会变点戏法，让大家解解闷？那个黄脸人怎么一句话也不说？"
        - id: ch01-b44
          speaker: kim
          text: "因为他是圣人，正在想你根本不懂的事。"
        - id: ch01-b45
          speaker: dogra_soldier
          text: "那也好。我们卢迪亚纳锡克团的人不拿教义烦自己的脑袋，我们只管打仗。"
        - id: ch01-b46
          speaker: sikh_artisan
          text: "我姐姐的兄弟有个儿子，也在你们团里当下士。团里还有几个多格拉连。"
        - id: ch01-b47
          speaker: narrator
          text: "年轻士兵狠狠瞪了工匠一眼。多格拉人与锡克人不是同一种姓，工匠偏偏当面点破团里还有多格拉连。放债人看见士兵不痛快，便在一旁偷偷发笑。"
        - id: ch01-b48
          speaker: amritsar_woman
          text: "在我看来，他们全都一样。凡是拿着武器为政府效力的人，都算一个弟兄会。种姓有种姓的弟兄会，可在那之外，还有军团里的情谊，对不对？"
        - id: ch01-b49
          speaker: cultivator_wife
          text: "你当然觉得他们全都一样。"
        - id: ch01-b50
          speaker: cultivator
          text: "我兄弟就在贾特团里。多格拉人都是好汉。"
        - id: ch01-b51
          speaker: dogra_soldier
          text: "至少你们锡克人也承认这一点。还不到三个月前，皮尔扎伊山口的山脊上竖着八面阿夫里迪人的军旗。我们两个连赶去支援，那时你们正觉得多格拉人是好汉。"
        - id: ch01-b52
          speaker: narrator
          text: "士兵接着讲起边境上的那场战斗，把卢迪亚纳锡克团里的多格拉连说得英勇非凡。阿姆利则女人听着，微微一笑。她很清楚，年轻士兵讲得这么起劲，无非是想得到自己的赞赏。"
        - id: ch01-b53
          speaker: cultivator_wife
          text: "唉，那么他们的村子烧光了，孩子们也没家了？"
        - id: ch01-b54
          speaker: dogra_soldier
          text: "他们侮辱过我们的死者。我们团给了他们教训，他们也付出了惨重代价。事情就是这样。这是阿姆利则吗？"
        - id: ch01-b55
          speaker: moneylender
          text: "不错，到这里该查票了。"
    - id: ch02
      title: 车厢里的追寻
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: "黎明快到了，站灯渐渐失去光亮。混血列车员走进车厢查票。在东方，人人都把票藏在稀奇古怪的地方，查起来很慢。金拿出自己的票，却被赶下了车。"
        - id: ch02-b02
          speaker: kim
          text: "可我要去安巴拉，我得跟这位圣人一起走。"
        - id: ch02-b03
          speaker: guard
          text: "你爱去地狱也随便。这张票只到这里。"
        - id: ch02-b04
          speaker: narrator
          text: "金顿时放声大哭。他说喇嘛既是自己的父亲，也是自己的母亲，自己是老人晚年的依靠，离了他，喇嘛一定会死。全车人都替他求列车员开恩，放债人在这件事上说得尤其动听。可列车员不为所动，还是抓住金，把他拖到了月台上。喇嘛只顾眨眼，根本追不上眼前的变化。金已经站在车窗外，仰起脸，扯开嗓子哭了起来。"
        - id: ch02-b05
          speaker: kim
          text: "我穷得很，父亲死了，母亲也死了。各位善心人啊，要是把我留在这里，谁来照顾那个老人？"
          emotion: sad
        - id: ch02-b06
          speaker: lama
          text: "这是怎么回事？他得去贝拿勒斯，也必须跟我一起走。他是我的弟子。若是还该付钱，我来付就是了。"
        - id: ch02-b07
          speaker: kim
          text: "别出声。世人这么慷慨，我们何必像王公一样乱花银钱？"
        - id: ch02-b08
          speaker: narrator
          text: "阿姆利则女人也提着包袱下了车。金一直盯着她，他知道这样的女人出手大方。"
        - id: ch02-b09
          speaker: kim
          text: "叫人心碎的美人啊，赏我一张到安巴拉的小票吧！你就没有一点慈悲心吗？"
        - id: ch02-b10
          speaker: amritsar_woman
          text: "那位圣人是从北方来的吗？"
        - id: ch02-b11
          speaker: kim
          text: "从北方极远的群山里来。"
        - id: ch02-b12
          speaker: amritsar_woman
          text: "北方松树间有雪，山里也有雪。我母亲就是库卢人。拿去买票吧，再请他给我祝福。"
        - id: ch02-b13
          speaker: kim
          text: "祝福你一万次！圣人啊，这位金子心肠的女人给了钱，我能跟你同行了。我这就去买票。"
        - id: ch02-b14
          speaker: narrator
          text: "女人抬头看着喇嘛。喇嘛已经机械地跟着金走下车，却仍守着自己的戒律。他低下头，不肯看她，只在她提着包袱、随着人群走过时，用藏语低声祝祷。农夫妻子把这一切看在眼里，嘴上立刻又刻薄起来。"
        - id: ch02-b15
          speaker: cultivator_wife
          text: "来得容易，去得也快。"
        - id: ch02-b16
          speaker: lama
          text: "她积下了功德。毫无疑问，那是一位尼姑。"
        - id: ch02-b17
          speaker: moneylender
          text: "光阿姆利则就有一万个这样的尼姑。快回来吧，老人家，不然火车要开了。"
        - id: ch02-b18
          speaker: kim
          text: "钱不但够买票，还能买一点吃的。现在吃吧，圣人。看，天亮了！"
        - id: ch02-b19
          speaker: narrator
          text: "金色、玫瑰色、藏红花色和粉红色的晨雾，在平坦青翠的大地上袅袅散开。雾气退去，富饶的旁遮普全境都铺展在清亮而锐利的阳光下，田野一直伸向远方。电线杆从车窗外一根根飞驰而过，仿佛不断把长线抓起，又甩到身后。喇嘛看着它们来去，身子又微微缩了一下。"
        - id: ch02-b20
          speaker: moneylender
          text: "火车真快。从拉合尔到这里的路，你走两天也走不完。傍晚我们就到安巴拉了。"
        - id: ch02-b21
          speaker: lama
          text: "可那里离贝拿勒斯还很远。"
        - id: ch02-b22
          speaker: narrator
          text: "喇嘛疲倦地嚼着金递来的饼。大家也解开各自的包裹，拿出早饭。放债人、农夫和士兵装好烟斗，很快就用辛辣呛人的烟雾塞满了车厢。他们一边吐痰，一边咳嗽，自己却快活得很。锡克工匠和农夫妻子慢慢嚼着槟榔，喇嘛吸了鼻烟，又一颗颗拨动念珠。金盘腿坐着，肚子吃饱了，心里十分舒坦。"
        - id: ch02-b23
          speaker: lama
          text: "贝拿勒斯那边都有什么河？"
        - id: ch02-b24
          speaker: moneylender
          text: "我们有恒河。"
        - id: ch02-b25
          speaker: lama
          text: "还有别的河吗？我想找的是一条能治愈人的河。"
        - id: ch02-b26
          speaker: moneylender
          text: "那就是恒河。谁到河里沐浴，谁就洗净罪孽，升到诸神身边。我已经朝拜过恒河三次了。"
        - id: ch02-b27
          speaker: dogra_soldier
          text: "看来你确实很需要去。"
        - id: ch02-b28
          speaker: narrator
          text: "众人的笑声全转向了放债人。喇嘛却没有跟着笑。他低声想着，恒河只能让人洗净罪孽，回到诸神那里，之后仍要重新进入生生世世的轮回，依旧被缚在轮上。这和他寻找的解脱并不是一回事。他不耐烦地摇头，只怀疑自己是不是听错了。"
        - id: ch02-b29
          speaker: lama
          text: "也许哪里弄错了。那么，最初是谁造了恒河？"
        - id: ch02-b30
          speaker: moneylender
          text: "当然是诸神。你信的到底是哪一种教？"
          emotion: surprised
        - id: ch02-b31
          speaker: lama
          text: "我追随正法，追随无上正法。既然恒河是诸神造的，那些神又是什么样的神？"
        - id: ch02-b32
          speaker: narrator
          text: "满车的人都惊呆了。他们想不到，世上竟有人不知道恒河。"
        - id: ch02-b33
          speaker: moneylender
          text: "那么，你的神是谁？"
        - id: ch02-b34
          speaker: lama
          text: "请听，我现在就讲他。印度的众人啊，请听！"
        - id: ch02-b35
          speaker: narrator
          text: "喇嘛先用乌尔都语讲佛陀世尊的故事。讲着讲着，他被自己的思绪带走，不知不觉换成了藏语，又拖着长长的调子，诵起汉文佛传里的经句。车里的人虽然听不懂，却都温和宽容，带着敬意肃然看着他。印度遍地都是这样的圣人，他们结结巴巴地用陌生语言传讲自己的福音，被热忱之火摇撼，也被那火吞噬。他们是梦想家，是喋喋不休的人，也是看见幻象的人。这样的声音从古老的年代便在路上回荡。自太初以来如此，直到世界终结也会如此。"
        - id: ch02-b36
          speaker: dogra_soldier
          text: "我们驻在皮尔扎伊山口时，旁边有个穆斯林团。他们有个祭司，好像也是下士。他一发作就说预言。不过疯人都归神照管，他的长官也就不大计较。"
        - id: ch02-b37
          speaker: narrator
          text: "喇嘛想起自己身在异乡，别人听不懂藏语，便重新说起乌尔都语。他讲了世尊如何开弓放箭，箭飞过所有靶子，落地后涌出泉水，最后化作一条河。这种故事比长篇经文更合众人的胃口，大家都好奇地听完。"
        - id: ch02-b38
          speaker: lama
          text: "印度的众人啊，我正要去找那条箭河。你们可知道什么线索，能为我引路？我们男男女女，全都困在苦海里。"
        - id: ch02-b39
          speakers: [moneylender, cultivator, cultivator_wife]
          ensemble: chorus
          text: "只有恒河，只有恒河能洗去罪孽。"
        - id: ch02-b40
          speaker: cultivator_wife
          text: "不过贾朗达尔也有好神。你们看，他们把庄稼赐福得多好。"
        - id: ch02-b41
          speaker: cultivator
          text: "要找遍旁遮普的每一条河，可不是小事。我只要河水能给田里留下好淤泥，就会感谢家园之神布米亚。"
        - id: ch02-b42
          speaker: lama
          text: "金，你说世尊会来过这么北边的地方吗？"
        - id: ch02-b43
          speaker: kim
          text: "也许来过。"
        - id: ch02-b44
          speaker: sikh_artisan
          text: "最后一位来到北方的大人物，是西坎德尔·祖尔卡尔奈，也就是亚历山大大帝。他铺了贾朗达尔的街道，还在安巴拉附近修过一座大水池。路和水池如今都在，可我从没听说过你的神。"
        - id: ch02-b45
          speaker: dogra_soldier
          text: "头发留长，再会说旁遮普话，这两件事就足够让人当锡克人了。"
        - id: ch02-b46
          speaker: narrator
          text: "士兵引用一句北方谚语打趣金，说只要留长头发，再会讲旁遮普话，就算得上锡克人。不过这话他没敢说得太响。喇嘛叹了一口气，整个人向里缩去，变成一堆灰暗而没有形状的东西。谈话一停，便能听到他低低念诵“唵嘛呢叭咪吽”，木念珠也发出厚重的咔嗒声。"
        - id: ch02-b47
          speaker: lama
          text: "这速度和响声都叫我难受。我的弟子，也许我们已经越过那条河了。"
        - id: ch02-b48
          speaker: kim
          text: "安心吧。河不是在贝拿勒斯附近吗？我们离那里还远。"
        - id: ch02-b49
          speaker: lama
          text: "可世尊若来过北方，那条河也许就是刚才飞驰着越过的小河。你是被派来找我的吗？我在苏禅寺积过功德，你便从大绿炮旁走来，还带着两张面孔、两套衣裳。"
        - id: ch02-b50
          speaker: kim
          text: "这些话不能在这里讲。那里只有一个我。你再想想，是一个印度教男孩站在大绿炮旁。"
        - id: ch02-b51
          speaker: lama
          text: "那里还有一个白胡子的英国圣人，站在许多圣像中间。正是他让我更确信箭河存在。"
        - id: ch02-b52
          speaker: kim
          text: "我们去拉合尔奇珍馆向那些神祈祷，馆里的老爷同他说过话。这个圣人来自群山那边极远的地方。现在歇歇吧，我们会到安巴拉的。"
        - id: ch02-b53
          speaker: lama
          text: "可我那条能治愈我的河呢？"
        - id: ch02-b54
          speaker: kim
          text: "到了安巴拉，我们就走路找。这样不会漏掉任何东西，连田边最小的水沟也不会漏掉。"
        - id: ch02-b55
          speaker: lama
          text: "你不是也有自己的追寻吗？是那头红公牛。它会来帮助你，还会载你去什么地方。是在绿地上的红公牛，对吗？"
        - id: ch02-b56
          speaker: kim
          text: "它不会载我去哪里。那不过是我讲给你听的故事。"
        - id: ch02-b57
          speaker: cultivator_wife
          text: "你们两人都做梦吗？绿地上的红公牛，要载你升天不成？是有人给你说过预言吗？我们村就在贾朗达尔城后面，村里正有一头红公牛，它还专挑最绿的田吃草！"
        - id: ch02-b58
          speaker: sikh_artisan
          text: "给女人一个老太婆的故事，再给织巢鸟一片叶子、一根线，它们都能织出不得了的东西。圣人会做梦，弟子跟久了，也会学会。"
        - id: ch02-b59
          speaker: lama
          text: "也许你前世积过功德，红公牛会来报答你。"
        - id: ch02-b60
          speaker: kim
          text: "不，那只是别人说来逗我的。不过我会在安巴拉找公牛，你也可以找河。这样还能躲开火车的哐啷声，歇一歇。"
        - id: ch02-b61
          speaker: lama
          text: "也许公牛知道河在哪里，是派来给我们两个人引路的。这个孩子昨天才被派到我身边，我想，他不是尘世中人。"
        - id: ch02-b62
          speaker: cultivator_wife
          text: "讨饭的和圣人，我都见过不少。这样的瑜伽士和弟子，可从来没见过。"
        - id: ch02-b63
          speaker: narrator
          text: "农夫听完，只笑着用一根手指轻轻点了点自己的额头，仿佛在说这两个人脑子都有些古怪。不过喇嘛下一次要吃东西时，大家还是留心把自己最好的食物分给了他。列车继续向南，在阳光下不停摇晃。最后，他们又疲倦，又困乏，身上落满尘土，终于到了安巴拉城车站。"
    - id: ch03
      title: 白种马的消息
      blocks:
        - id: ch03-b01
          speaker: cultivator_wife
          text: "我们来安巴拉打官司，住在我男人的堂弟的弟弟家。院里也容得下你和这位瑜伽士。他愿意给我祝福吗？"
        - id: ch03-b02
          speaker: kim
          text: "圣人啊，这位金子心肠的女人愿意留我们过夜。南方这片土地真和善，从天亮到现在，一路都有人帮助我们。"
        - id: ch03-b03
          speaker: narrator
          text: "喇嘛低头祝福。农夫扛起沉重的竹杖，抱怨妻子要把闲人领进亲戚家。"
        - id: ch03-b04
          speaker: cultivator_wife
          text: "你堂弟的弟弟给女儿办婚宴时，还欠我父亲的堂兄一笔人情。让他把饭钱记在那笔账上。再说，瑜伽士自己会化缘。"
        - id: ch03-b05
          speaker: kim
          text: "是啊，我替他讨饭。"
        - id: ch03-b06
          speaker: narrator
          text: "金只想赶快把喇嘛安顿在有遮蔽的地方，好去找马哈布·阿里的英国人，把白种马的血统消息送到。那户体面的印度教人家在兵营后面。喇嘛终于在内院里坐稳，金确认老人不会再跟着自己，便准备离开。"
        - id: ch03-b07
          speaker: kim
          text: "我要去一会儿，去市场买吃的。我回来以前，你别到外面乱走。"
        - id: ch03-b08
          speaker: lama
          text: "你一定会回来吗？回来时还会是现在的样子吗？今晚去找河，已经太晚了吗？"
        - id: ch03-b09
          speaker: kim
          text: "太晚了，天也太黑。放心吧，你已经离拉合尔一百科斯了。"
        - id: ch03-b10
          speaker: lama
          text: "是啊，离我的寺院也更远了。这个世界真是又广大，又可怕。"
        - id: ch03-b11
          speaker: narrator
          text: "金悄悄溜出去。他看起来毫不起眼，颈间却挂着自己和另外几万人的命运。马哈布·阿里的指示已经让他大致认出那幢房子，又恰好有个马夫从俱乐部赶着双轮车回来，这下再没有疑问了。可金还得认准收信的人。他钻过花园树篱，藏在游廊旁一丛羽毛般的高草里。屋里灯火通明，仆人围着摆满鲜花、玻璃器皿和银器的餐桌来回忙碌。一个穿黑白礼服的英国人哼着曲子走出来，可天太暗，金看不清他的脸，只好用乞丐屡试不爽的老办法试探。"
        - id: ch03-b12
          speaker: kim
          text: "穷人的保护者！马哈布·阿里有话——"
        - id: ch03-b13
          speaker: creighton
          text: "马哈布·阿里说什么？"
        - id: ch03-b14
          speaker: narrator
          text: "那人朝声音传来的方向退了一步，却不曾四下寻找说话的人。这个反应已经足够了。金立刻知道，他正是马哈布·阿里所说的知情人。"
        - id: ch03-b15
          speaker: kim
          text: "白种马的血统已经完全查明。"
        - id: ch03-b16
          speaker: creighton
          text: "证据在哪里？"
        - id: ch03-b17
          speaker: kim
          text: "马哈布·阿里把证据交给我了。"
        - id: ch03-b18
          speaker: narrator
          text: "金把一沓折好的纸弹到空中。纸落在那人脚边，恰好有园丁从转角走来，他便先若无其事地用脚踩住。等仆人走远，他才拾起纸，又扔下一卢比，大步进屋，始终没有回头。金听见银币落地的叮当声，马上把钱捡起。可他生来终究是爱尔兰人，在这种游戏里，银钱是最不重要的东西。他真正想看的是自己的行动会造成什么后果。于是他没有悄悄离开，反而贴着草地，又朝房子爬近了一些。"
        - id: ch03-b19
          speaker: narrator
          text: "印度平房前后通透，屋里的动静很容易看清。金看见那人回到游廊角落的小更衣室。房间一半也当办公室用，文件和公文箱散得到处都是。他坐下细读马哈布·阿里的消息。煤油灯的光正照着他的脸，那张脸一点点改变，神色越来越沉，最后完全阴了下来。每个乞丐都得学会观察人的脸色，从眉眼和嘴角判断接下来会发生什么，金自然也把这些变化牢牢记住。"
        - id: ch03-b20
          speaker: woman_voice
          text: "威尔，亲爱的！你该到客厅来了，客人马上就到。"
        - id: ch03-b21
          speaker: narrator
          text: "那人仍低头读信。五分钟后，女人又叫他。"
        - id: ch03-b22
          speaker: woman_voice
          text: "威尔，他来了！我听见车道上的骑兵了。"
        - id: ch03-b23
          speaker: narrator
          text: "那人连帽子也没戴就冲出去。一辆宽大的马车停在游廊前，后面跟着四名本地骑兵。一个黑发高个子走下车，身板挺得像一支箭。前面还有个面带笑容的年轻军官。金肚皮贴地，几乎碰到高高的车轮。"
        - id: ch03-b24
          speaker: young_officer
          text: "当然，长官。只要事情牵涉到一匹马，别的事都可以等。"
        - id: ch03-b25
          speaker: creighton
          text: "我们用不了二十分钟。请你替我们招待客人，让他们高兴些。"
        - id: ch03-b26
          speaker: commander
          text: "留下一名骑兵。"
        - id: ch03-b27
          speaker: narrator
          text: "高个子叫一名骑兵留下，马车便滚滚离去。克赖顿和他一同进了更衣室，两颗脑袋挨在一起，低头查看马哈布·阿里的消息。金仍平伏在草地上，身体几乎贴着刚才的高大车轮。他一动不动，只听见屋里有两个声音，一个低沉恭谨，另一个尖锐果断。"
        - id: ch03-b28
          speaker: commander
          text: "这不是几星期的问题，而是几天，甚至只剩几小时。我早料到会这样，可这份消息把事情彻底坐实了。格罗根今晚在这里吃饭吗？"
        - id: ch03-b29
          speaker: creighton
          text: "是的，长官。麦克林也来。"
        - id: ch03-b30
          speaker: commander
          text: "很好，我亲自同他们谈。事情当然要提交委员会，不过现在有理由假定会立即行动。通知平迪和白沙瓦两个旅。夏季换防全会被打乱，但没有办法。第一次没彻底击溃他们，才闹到今天。八千人应当够了。"
        - id: ch03-b31
          speaker: creighton
          text: "炮兵怎么办，长官？"
        - id: ch03-b32
          speaker: commander
          text: "我得同麦克林商量。"
        - id: ch03-b33
          speaker: creighton
          text: "这么说，要开战了？"
        - id: ch03-b34
          speaker: commander
          text: "不，不是战争，是惩罚。问题在于前任所作所为留下的约束。"
        - id: ch03-b35
          speaker: creighton
          text: "可C二十五号也许撒了谎。"
        - id: ch03-b36
          speaker: commander
          text: "他的情报和另一人的相互印证。他们六个月前已经露了底牌，德文尼什却坚持说还有和平的可能。他们当然趁机壮大了自己。立刻发电报，用新密码，不要旧的，签我的名字和沃顿的名字。别让女士们再等了，其余的事抽雪茄时商量。我早料到这一天。这是惩罚，不是战争。"
        - id: ch03-b37
          speaker: narrator
          text: "骑兵策马送信去了。金绕着房子爬到后面。他凭拉合尔的经验断定，厨房里既有食物，也有消息。厨房果然挤满了兴奋的帮厨，每个人都忙着这场大宴会，装汤的盘碗正要送进屋去。其中一个看见金混进来，抬脚就踢了他。"
        - id: ch03-b38
          speaker: kim
          text: "哎哟！我只是想洗盘子，换一顿饱饭。"
        - id: ch03-b39
          speaker: scullion
          text: "全安巴拉的人都想这么干，快滚。他们现在要上汤了。我们是给克赖顿老爷办事的，这样一场大宴会，还用得着陌生帮厨来帮忙吗？"
        - id: ch03-b40
          speaker: kim
          text: "这场宴会确实很大。"
        - id: ch03-b41
          speaker: scullion
          text: "那还用说。今晚的贵客正是江伊拉特老爷，也就是军队总司令。"
        - id: ch03-b42
          speaker: kim
          text: "嚯！"
          emotion: surprised
        - id: ch03-b43
          speaker: narrator
          text: "金从喉咙深处发出一声恰到好处的惊叹，仿佛只是个被大人物名号吓住的孩子。其实他已经得到想要的消息。帮厨刚一转身，他便从拥挤的厨房里溜走，转眼没了踪影。"
        - id: ch03-b44
          speaker: kim
          text: "只为一匹马的血统，就闹出这么大的阵仗！马哈布·阿里真该向我学学怎么撒谎。以前我送的消息都和女人有关，这回却是男人，这样更好。高个子要放出一支大军，去惩罚某个地方的人。平迪和白沙瓦都要收到消息，还要出动大炮。真该爬得更近些。这可是天大的消息！"
    - id: ch04
      title: 星辰与红公牛
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: "金回到住处时，农夫的堂弟的弟弟正同农夫夫妇和几个朋友一起，从各个方面议论家里的官司，喇嘛则在一旁打盹。晚饭后，有人递给金一支水烟。他在月光下叉开两腿，吸着光滑的椰壳烟斗，不时咂咂舌，插上一两句议论，觉得自己已经是个了不起的大人。主人们对他十分客气，因为农夫妻子已经说起了红公牛的异象，还说金大概来自另一个世界。何况那位年高而奇异的喇嘛，本身就叫大家又好奇，又敬畏。"
        - id: ch04-b02
          speaker: narrator
          text: "后来，家里的老祭司来了。他是个宽厚的萨尔萨特婆罗门，为了让这家人佩服自己的学问，自然要挑起一场神学争论。全家按信仰都站在自家祭司一边，可喇嘛既是客人，又十分新奇。老人慈和亲切，引用的汉文经句气势不凡，听起来仿佛咒语，众人都喜欢得不得了。在这片亲切淳朴的气氛里，他的心也打开了，像菩萨自己的莲花一样舒展开来。他讲起苏禅寺所在的大山，也讲起自己尚未“起身寻求觉悟”时的往日生活。"
        - id: ch04-b03
          speaker: narrator
          text: "大家这才知道，喇嘛从前还牵挂尘世时，推算星盘和生辰八字很有本领。家中祭司顺势引着他讲自己的方法。两人给行星起的名字，彼此谁也听不懂，只能一同抬手，指着夜空中缓缓航行的大星，努力说明自己的意思。孩子们围在老人身边，拉扯他的念珠，也没人责备。喇嘛讲起终年不化的积雪、轰然落下的山崩、封死的关口，讲起人们寻找蓝宝石和绿松石的遥远峭壁，还有那条一路穿过高地、最终通向大中华的奇妙道路。那些景象仿佛又出现在他眼前。他说得兴起，连不许看女人的戒律都忘得干干净净。"
        - id: ch04-b04
          speaker: cultivator
          text: "你觉得这位老人怎么样？"
        - id: ch04-b05
          speaker: family_priest
          text: "他是圣人，的确是位圣人。他信的神不是正神，可他的双脚已经踏上正道。至于他推算生辰的方法，你虽然不懂，却既高明，又可靠。"
        - id: ch04-b06
          speaker: kim
          text: "那你替我看看，我能不能像预言说的那样，在绿地上找到红公牛。"
        - id: ch04-b07
          speaker: family_priest
          text: "你知道自己的出生时辰吗？"
        - id: ch04-b08
          speaker: kim
          text: "五月第一个夜晚，在头遍鸡鸣和二遍鸡鸣之间。"
        - id: ch04-b09
          speaker: family_priest
          text: "哪一年？"
        - id: ch04-b10
          speaker: kim
          text: "我不知道。不过我第一次哭出声时，克什米尔的斯利那加发生了大地震。"
        - id: ch04-b11
          speaker: narrator
          text: "这是照料金的女人告诉他的，那女人又是听金博尔·奥哈拉说的。克什米尔虽远，印度也感觉到了那场地震。此后很长时间，它都成了旁遮普人记年月的一件大事。这个日期一说出来，院里的人立刻觉得金的来历更加非凡。"
        - id: ch04-b12
          speaker: woman_guest
          text: "哎呀！某某人的女儿，不也是那时出生的吗？"
          emotion: surprised
        - id: ch04-b13
          speaker: cultivator_wife
          text: "她母亲四年里生了四个儿子，个个都是壮实的好孩子。"
        - id: ch04-b14
          speaker: family_priest
          text: "有学问的人都不会忘记，那一夜行星落在各宫的什么位置。至少你占了金牛宫的一半。预言是怎么说的？"
        - id: ch04-b15
          speaker: narrator
          text: "祭司摆出庄重的神气，开始在院里的泥地上画星盘。他说金确实占了金牛宫的一半，又追问预言的原话。金看见大家都等着自己开口，很为造成这样的轰动得意。"
        - id: ch04-b16
          speaker: kim
          text: "有一天，我会因为绿地上的红公牛发达。不过在那以前，要先来两个人，把一切准备好。"
        - id: ch04-b17
          speaker: family_priest
          text: "不错，异象开头都是这样。浓黑的雾慢慢散开，有人拿扫帚进来，把地方收拾妥当，异象才真正开始。你说有两个人？太阳离开金牛宫，进入双子宫，所以会有两个人。小家伙，替我拿根细枝来。"
        - id: ch04-b18
          speaker: narrator
          text: "祭司皱紧眉头，拿细枝在泥地上划出神秘的符号。他划了又抹，抹平以后又重新画，仿佛星辰的意思极难弄清。院里的人围着看，除了喇嘛，人人都惊叹不已。喇嘛凭着自己的见识，很有分寸地没有插手，也不曾打断祭司。足足过了半个钟头，祭司才哼了一声，把细枝扔开。"
        - id: ch04-b19
          speaker: family_priest
          text: "星辰这样说。三天之内，那两个人会来，把一切准备好。随后，公牛会出现。可是与它相对的，是战争和武装之人的征兆。"
        - id: ch04-b20
          speaker: cultivator_wife
          text: "我们从拉合尔来的车厢里，确实有一个卢迪亚纳锡克团的士兵。"
        - id: ch04-b21
          speaker: family_priest
          text: "不，是武装的人，成百上千。你和战争有什么关系？你的星兆鲜红而愤怒，战争很快就要爆发。"
        - id: ch04-b22
          speaker: lama
          text: "没有，一点关系也没有。我们只寻找和平，寻找我们的河。"
        - id: ch04-b23
          speaker: narrator
          text: "金想起自己在更衣室外听到的那番话。总司令正要调动成百上千的武装士兵，祭司却从泥地和星辰里看出了同一件事。他忍不住笑了，觉得自己毫无疑问深受星辰宠爱。祭司看不出更多东西，便抬脚抹掉泥地上粗略的星盘。"
        - id: ch04-b24
          speaker: family_priest
          text: "更多的我看不出来了。孩子，三天之内，公牛会来到你身边。"
        - id: ch04-b25
          speaker: lama
          text: "那我的河呢？我原以为，他的公牛会带我们两个人找到那条河。"
        - id: ch04-b26
          speaker: family_priest
          text: "我的兄弟，那条神奇的河，可不是常见的东西。"
        - id: ch04-b27
          speaker: narrator
          text: "第二天清早，主人们再三挽留，喇嘛仍坚持马上动身。大家为两人的旅途准备了一大包好吃的，交给金背着，又凑出将近三个安那的铜钱，让他留作路上的花费。晨曦里，他们一遍遍送上祝福，站在原地看着金和喇嘛离开院子，沿着道路向南走去。"
        - id: ch04-b28
          speaker: lama
          text: "可惜这些人，还有所有像他们这样的人，都不能从轮回中解脱。"
        - id: ch04-b29
          speaker: kim
          text: "别这么说。要是他们都解脱了，地上不就只剩坏人？到时候，谁给我们肉吃，谁给我们地方过夜？"
        - id: ch04-b30
          speaker: narrator
          text: "金背着沉甸甸的食物包袱，听见喇嘛惋惜那些善良的施主不能得到解脱，脚步却仍然轻快。他可舍不得这个宽厚好脾气的世界。他觉得，要是所有善人都离开了，只让坏人留在地上，就再没人肯给他们肉吃，也没人肯在夜里腾出院子，让他们有个住处。两个人一路不停地向前走。"
        - id: ch04-b31
          speaker: lama
          text: "那边有一条小溪，我们去看看。"
        - id: ch04-b32
          speaker: narrator
          text: "喇嘛一看见水，立刻离开白色大路，带着金从田野中直穿过去。田埂和庄稼地都没能让他慢下脚步。他只想着那会不会是自己寻找的箭河，却没有料到田间聚着一群野狗。两人就这样一头闯进了野狗的马蜂窝。"
