  chapters:
    - id: ch01
      title: CHAPTER II
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Whoever can set pride aside, without scorning any faith or priest, may feel the soul of all the East around him at Kamakura. Kim and the lama entered the fortress-like railway station while the last of the night still lay black around it. Electricity hissed above the goods yard, where the heavy grain from the North was handled.
        - id: ch01-b02
          speaker: lama
          text: This is the work of devils!
          emotion: fearful
        - id: ch01-b03
          speaker: narrator
          text: The lama drew back from the echoing dark. Rails gleamed between stone platforms, and girders crossed overhead. The great hall seemed paved with sleeping third-class passengers, wrapped in sheets like the dead. They had bought their tickets the night before and settled in the waiting rooms. To them, any hour of day or night was fit for travel.
        - id: ch01-b04
          speaker: kim
          text: The fire-carriages come here. See that opening? A man behind it will sell you a paper for Umballa.
        - id: ch01-b05
          speaker: lama
          text: But we are going to Benares.
        - id: ch01-b06
          speaker: kim
          text: Then ask for Benares. Hurry. The train is coming!
        - id: ch01-b07
          speaker: lama
          text: You take the purse.
        - id: ch01-b08
          speaker: narrator
          text: The lama had claimed to know more about trains than he truly did. When the southbound train thundered in at three twenty-five, he jumped. Sleepers sprang awake. The station filled with shouting, with cries from sellers of water and sweets, with policemen calling orders, and with women shrieking as they gathered baskets, families, and husbands.
        - id: ch01-b09
          speaker: kim
          text: It is only the train. It will not run over us here. Wait!
        - id: ch01-b10
          speaker: narrator
          text: The lama's trust amazed Kim. The old man had handed him a little bag full of rupees. Kim asked and paid for a ticket to Umballa, but the sleepy clerk grunted and tossed out a ticket for the next station, only six miles away.
        - id: ch01-b11
          speaker: kim
          text: No, no. That trick may fool a country farmer, but I live in Lahore. Nicely tried, Babu. Now give me the Umballa ticket.
        - id: ch01-b12
          speaker: narrator
          text: The clerk scowled and handed over the right ticket.
        - id: ch01-b13
          speaker: kim
          text: Now sell me one for Amritzar. The fare is this much, and this is exactly the change you owe me. I know how trains work.
        - id: ch01-b14
          speaker: narrator
          text: Kim had no intention of spending Mahbub Ali's money on anything as plain as paying his own way to Umballa. He turned cheerfully to the bewildered lama.
        - id: ch01-b15
          speaker: kim
          text: No holy man ever needed a disciple as badly as you need me. Without me, they would have thrown you out at Mian Mir. Come this way!
        - id: ch01-b16
          speaker: narrator
          text: He returned the purse, keeping one anna from each rupee of the Umballa fare as his commission, in the ancient custom of Asia. At the open door of a packed third-class carriage, the lama stopped short.
        - id: ch01-b17
          speaker: lama
          text: Would walking not be better?
        - id: ch01-b18
          speaker: narrator
          text: A broad Sikh craftsman pushed his bearded head through the doorway.
        - id: ch01-b19
          speaker: sikh_artisan
          text: Is he frightened? There is no need. I was frightened of trains once myself. Get in! This machine belongs to the Government.
        - id: ch01-b20
          speaker: lama
          text: I am not afraid. Is there space inside for both of us?
        - id: ch01-b21
          speaker: cultivator_wife
          text: There is not enough room for a mouse!
        - id: ch01-b22
          speaker: narrator
          text: The shrill answer came from the wife of a prosperous Hindu Jat farmer from the rich Jullundur district. Night trains were not managed as carefully as day trains, where men and women were kept strictly apart.
        - id: ch01-b23
          speaker: cultivator
          text: Oh, mother of my son, we can find some room. Pick up the child. Look, he is a holy man.
        - id: ch01-b24
          speaker: cultivator_wife
          text: And my lap is buried under seventy times seven bundles! Why not tell him to sit on my knee, shameless man? Men are all alike!
        - id: ch01-b25
          speaker: narrator
          text: She looked around for support. Near the window, an Amritzar courtesan sniffed behind her head covering.
        - id: ch01-b26
          speaker: money_lender
          text: Come in, come in! We should always show kindness to the poor.
        - id: ch01-b27
          speaker: narrator
          text: The fat Hindu money-lender tucked his folded account book under one arm and smiled an oily smile.
        - id: ch01-b28
          speaker: dogra_soldier
          text: Certainly. At seven percent a month, with the unborn calf as security.
        - id: ch01-b29
          speaker: narrator
          text: The young Dogra soldier was going south on leave. Everyone laughed at his answer.
        - id: ch01-b30
          speaker: lama
          text: Does this train go to Benares?
        - id: ch01-b31
          speaker: money_lender
          text: Of course it does. Why else would any of us be here?
        - id: ch01-b32
          speaker: kim
          text: Get in now, or the train will leave us!
        - id: ch01-b33
          speaker: amritzar_girl
          text: Look at him! He has never been on a train before. Just look!
        - id: ch01-b34
          speaker: cultivator
          text: Here, let me help. This is how you do it, father.
        - id: ch01-b35
          speaker: narrator
          text: The cultivator reached out a large brown hand and hauled the lama inside.
        - id: ch01-b36
          speaker: lama
          text: But I must sit on the floor. The Rule forbids me to sit on a bench. Besides, a bench makes me cramped.
        - id: ch01-b37
          speaker: money_lender
          text: I tell you, these trains make us break every rule for proper living. Here we are, sitting shoulder to shoulder with every caste and kind of person.
        - id: ch01-b38
          speaker: cultivator_wife
          text: And with some people who have no shame at all.
        - id: ch01-b39
          speaker: narrator
          text: She glared at the Amritzar girl, who was making eyes at the young soldier.
        - id: ch01-b40
          speaker: cultivator
          text: I said we should take a cart along the road. We would have saved money.
        - id: ch01-b41
          speaker: cultivator_wife
          text: Yes, and we would spend twice the savings on food. We settled that ten thousand times already.
        - id: ch01-b42
          speaker: cultivator
          text: With ten thousand tongues, perhaps.
        - id: ch01-b43
          speaker: cultivator_wife
          text: May the Gods help poor women if we are forbidden to speak. Oh! So this holy man cannot look at a woman or answer her. Is his disciple the same?
        - id: ch01-b44
          speaker: narrator
          text: Bound by his Rule, the lama paid no attention to her at all.
        - id: ch01-b45
          speaker: kim
          text: Not at all, mother. Especially when the woman is pretty and generous to a hungry boy.
        - id: ch01-b46
          speaker: sikh_artisan
          text: That is a beggar's answer! Sister, you invited it yourself.
        - id: ch01-b47
          speaker: narrator
          text: The Sikh laughed as Kim crooked his hands together in supplication.
        - id: ch01-b48
          speaker: cultivator_wife
          text: Where are you going?
        - id: ch01-b49
          speaker: narrator
          text: She handed him half a cake from a greasy parcel.
        - id: ch01-b50
          speaker: kim
          text: All the way to Benares.
        - id: ch01-b51
          speaker: dogra_soldier
          text: Are you jugglers, perhaps? Can you show us a trick on the journey? And why will that man in yellow not answer?
        - id: ch01-b52
          speaker: kim
          text: Because he is holy. He is thinking about things hidden from you.
        - id: ch01-b53
          speaker: dogra_soldier
          text: Perhaps that is wise. We men of the Ludhiana Sikhs do not trouble ourselves with doctrine. We fight.
        - id: ch01-b54
          speaker: narrator
          text: He rolled out the regiment's name in a grand voice.
        - id: ch01-b55
          speaker: sikh_artisan
          text: My sister's brother's son is a corporal in that regiment. There are Dogra companies in it too.
        - id: ch01-b56
          speaker: narrator
          text: The soldier glared because Dogras and Sikhs were different castes. The money-lender gave a little laugh.
        - id: ch01-b57
          speaker: amritzar_girl
          text: They are all the same to me.
        - id: ch01-b58
          speaker: cultivator_wife
          text: That, we can easily believe.
        - id: ch01-b59
          speaker: amritzar_girl
          text: No, I mean that everyone who carries a weapon for the Government belongs to one brotherhood. There is the brotherhood of caste, yes, but beyond it there is the bond of the regiment. Is that not so?
        - id: ch01-b60
          speaker: narrator
          text: She looked around rather timidly.
        - id: ch01-b61
          speaker: cultivator
          text: My brother serves in a Jat regiment. Dogras are good men.
        - id: ch01-b62
          speaker: dogra_soldier
          text: Your Sikhs thought so too. Not three months ago, our two companies came to help them at the Pirzai Kotal. Eight Afridi standards stood on the ridge against us.
        - id: ch01-b63
          speaker: narrator
          text: He told them how the Dogra companies of the Ludhiana Sikhs had fought well in that Border action. The Amritzar girl smiled, for she knew the tale was meant to impress her.
        - id: ch01-b64
          speaker: cultivator_wife
          text: And after all that, their villages burned and their little children had no homes?
          emotion: sad
        - id: ch01-b65
          speaker: dogra_soldier
          text: They marked our dead. After we Sikhs taught them their lesson, they paid dearly. That is how it happened. Are we at Amritzar?
        - id: ch01-b66
          speaker: money_lender
          text: Yes. This is where they clip our tickets.
        - id: ch01-b67
          speaker: narrator
          text: Dawn was draining the color from the station lamps when the half-caste guard came through. Collecting tickets took time, because passengers hid them in all sorts of unlikely places. Kim showed his ticket and was ordered off the train.
        - id: ch01-b68
          speaker: kim
          text: But I am going to Umballa! I belong with this holy man.
        - id: ch01-b69
          speaker: train_guard
          text: You may go to hell for all I care. This ticket takes you only as far as—
        - id: ch01-b70
          speaker: narrator
          text: Kim burst into tears. He cried that the lama was father and mother to him, that he supported the old man in his declining years, and that the lama would die without his care. The whole carriage begged the guard for mercy, with the money-lender pleading loudest. The guard still dragged Kim onto the platform. The lama blinked, unable to understand what was happening, while Kim wept beneath the carriage window.
        - id: ch01-b71
          speaker: kim
          text: I am terribly poor. My father is dead, and my mother is dead. Kind people, if you leave me here, who will care for that old man?
          emotion: sad
        - id: ch01-b72
          speaker: lama
          text: What is happening? He must go to Benares. He must travel with me. He is my chela. If more money must be paid—
        - id: ch01-b73
          speaker: kim
          text: Hush! Are we rajahs, throwing good silver away when the world is full of charity?
        - id: ch01-b74
          speaker: narrator
          text: The Amritzar girl stepped down with her bundles, and Kim watched her closely. He knew that women of her profession could be generous.
        - id: ch01-b75
          speaker: kim
          text: One little ticket to Umballa, O Breaker of Hearts! Have you no charity for me?
        - id: ch01-b76
          speaker: narrator
          text: She laughed.
        - id: ch01-b77
          speaker: amritzar_girl
          text: Did the holy man come from the North?
        - id: ch01-b78
          speaker: kim
          text: From far, far in the North. He came from among the hills.
        - id: ch01-b79
          speaker: amritzar_girl
          text: Snow lies among the pine trees in those northern hills. My mother came from Kulu. Go and buy your ticket. Then ask him to bless me.
        - id: ch01-b80
          speaker: kim
          text: Ten thousand blessings! Holy One, a woman with a golden heart has given me enough to travel with you. I am running for the ticket now!
        - id: ch01-b81
          speaker: narrator
          text: The girl looked up at the lama, who had followed Kim onto the platform without quite knowing why. He bowed his head so he would not see her and murmured in Tibetan as she moved away with the crowd.
        - id: ch01-b82
          speaker: cultivator_wife
          text: Easily earned and easily spent.
        - id: ch01-b83
          speaker: lama
          text: She has gained merit. Surely she must have been a nun.
        - id: ch01-b84
          speaker: cultivator_wife
          text: Amritzar alone has ten thousand nuns like that.
        - id: ch01-b85
          speaker: money_lender
          text: Come back, old man, or the train will leave without you!
        - id: ch01-b86
          speaker: kim
          text: There was enough for my ticket and a little food besides. Now eat, Holy One. Look, the day is coming!
        - id: ch01-b87
          speaker: narrator
          text: Gold, rose, saffron, and pink spread through the morning mist above the flat green land. The rich Punjab opened beneath the keen sunlight. As the telegraph poles flew past, the lama flinched a little.
        - id: ch01-b88
          speaker: money_lender
          text: The train is wonderfully fast. Since Lahore we have traveled farther than you could walk in two days. We shall reach Umballa by evening.
        - id: ch01-b89
          speaker: lama
          text: And Benares is still far beyond it.
        - id: ch01-b90
          speaker: narrator
          text: The weary lama chewed the cakes Kim gave him. Everyone opened their bundles for breakfast. Then the money-lender, the cultivator, and the soldier lit their pipes. Soon the carriage filled with bitter, choking smoke as they spat, coughed, and enjoyed themselves. The Sikh and the cultivator's wife chewed pan. The lama took snuff and counted his beads. Kim sat cross-legged, smiling over his full stomach.
        - id: ch01-b91
          speaker: lama
          text: What rivers do you have near Benares?
        - id: ch01-b92
          speaker: narrator
          text: A small laugh went around the carriage before the money-lender answered.
        - id: ch01-b93
          speaker: money_lender
          text: We have the Gunga.
        - id: ch01-b94
          speaker: lama
          text: What other rivers are there?
        - id: ch01-b95
          speaker: money_lender
          text: What river could there be besides the Gunga?
        - id: ch01-b96
          speaker: lama
          text: I was thinking of one special River, a River that heals.
        - id: ch01-b97
          speaker: money_lender
          text: Then you mean the Gunga. Whoever bathes in her is washed clean and goes to the Gods. I have made that pilgrimage three times.
        - id: ch01-b98
          speaker: narrator
          text: He looked around proudly.
        - id: ch01-b99
          speaker: dogra_soldier
          text: You must have needed all three.
        - id: ch01-b100
          speaker: narrator
          text: Now the travelers laughed at the money-lender instead.
        - id: ch01-b101
          speaker: lama
          text: Washed clean only to return to the Gods, then sent out through the lives again, still bound to the Wheel. No. Perhaps we have misunderstood each other. Who made the Gunga at the beginning?
        - id: ch01-b102
          speaker: money_lender
          text: The Gods made her. What faith do you belong to?
        - id: ch01-b103
          speaker: narrator
          text: The question had appalled him.
        - id: ch01-b104
          speaker: lama
          text: I follow the Law, the Most Excellent Law. So the Gods made the Gunga. What sort of Gods were they?
        - id: ch01-b105
          speaker: narrator
          text: Everyone stared. They could not imagine a man who knew nothing of the Gunga.
        - id: ch01-b106
          speaker: money_lender
          text: Then what is your God?
        - id: ch01-b107
          speaker: lama
          text: Listen now, people of Hind. I will tell you of Him.
        - id: ch01-b108
          speaker: narrator
          text: In Urdu, the lama began the story of Lord Buddha. His thoughts carried him away, and soon he slipped into Tibetan, chanting long passages from a Chinese account of the Buddha's life. The gentle, patient travelers watched with reverence. India was full of holy men who stammered their teachings in strange languages, dreamers and visionaries burning with their own devotion. It had always been so, and always would be.
        - id: ch01-b109
          speaker: dogra_soldier
          text: A Mohammedan regiment camped beside us at the Pirzai Kotal. One of their priests was a corporal, as I recall. When the spirit took him, he spoke prophecies. Madmen are in God's keeping, and his officers forgave him a great deal.
        - id: ch01-b110
          speaker: narrator
          text: The lama remembered that he was in a foreign land and returned to Urdu.
        - id: ch01-b111
          speaker: lama
          text: Hear the story of the Arrow that our Lord shot from his bow.
        - id: ch01-b112
          speaker: narrator
          text: This suited the passengers much better. They listened with curiosity as he told the tale.
        - id: ch01-b113
          speaker: lama
          text: And now, people of Hind, I am searching for that River. Do you know anything that can guide me? Every man and woman among us suffers from evil.
        - id: ch01-b114
          speakers: [money_lender, cultivator, cultivator_wife, sikh_artisan]
          ensemble: chorus
          text: There is only the Gunga. She alone washes sin away.
        - id: ch01-b115
          speaker: cultivator_wife
          text: Still, we have good Gods near Jullundur. Just look at the crops they have blessed.
        - id: ch01-b116
          speaker: cultivator
          text: Searching every river in the Punjab would be no small task. I am content with any stream that leaves rich earth on my fields, and I thank Bhumia, God of the Homestead.
        - id: ch01-b117
          speaker: narrator
          text: He shrugged one hard, sun-browned shoulder.
        - id: ch01-b118
          speaker: lama
          text: Do you think our Lord could have traveled this far north?
        - id: ch01-b119
          speaker: kim
          text: He may have done.
        - id: ch01-b120
          speaker: narrator
          text: Kim spoke soothingly and spat red pan juice onto the floor.
        - id: ch01-b121
          speaker: sikh_artisan
          text: The last of the Great Ones was Sikander Julkarn. He paved the streets of Jullundur and built a great tank near Umballa. The paving still holds, and the tank is still there. I have never heard of your God.
        - id: ch01-b122
          speaker: dogra_soldier
          text: Let your hair grow long and speak Punjabi. That is all you need to become a Sikh.
        - id: ch01-b123
          speaker: narrator
          text: The soldier aimed the northern proverb at Kim as a joke, but kept his voice low. The lama sighed and folded into himself like a shapeless bundle of dingy cloth. In every pause, the others heard his quiet chant of Om mane pudme hum and the thick click of wooden beads.
        - id: ch01-b124
          speaker: lama
          text: The speed and noise trouble me. And, my chela, I fear we may already have passed the River.
        - id: ch01-b125
          speaker: kim
          text: Be easy. Was the River not near Benares? We are still a long way from there.
        - id: ch01-b126
          speaker: lama
          text: But if our Lord came north, the River might be any one of those little streams we crossed.
        - id: ch01-b127
          speaker: kim
          text: I cannot tell you.
        - id: ch01-b128
          speaker: lama
          text: Yet you were sent to me. Were you sent because of the merit I gained at Such-zen? You came from beside the cannon with two faces and two kinds of clothing.
        - id: ch01-b129
          speaker: kim
          text: Quiet. We must not discuss that here. There was only one of me. Think carefully. You saw one Hindu boy beside the great green cannon.
        - id: ch01-b130
          speaker: lama
          text: But was there not an Englishman too, white-bearded and holy among the images? Did he not make me more certain of the River of the Arrow?
        - id: ch01-b131
          speaker: kim
          text: We went to Lahore's Wonder House to pray before the Gods. The Sahib there spoke with him. That is the truth, brothers. This is a very holy man who came from beyond the Hills. Rest now. We shall reach Umballa in time.
        - id: ch01-b132
          speaker: lama
          text: But what of my River, the River that will heal me?
        - id: ch01-b133
          speaker: kim
          text: Once we arrive, we can hunt for it on foot if you wish. Then we will miss nothing, not even the smallest stream beside a field.
        - id: ch01-b134
          speaker: lama
          text: And you have a Search of your own?
        - id: ch01-b135
          speaker: narrator
          text: Delighted that he had remembered, the lama sat straight up.
        - id: ch01-b136
          speaker: kim
          text: Yes, I do.
        - id: ch01-b137
          speaker: narrator
          text: Kim humored him. The boy was perfectly happy to be out in the wide, friendly world, chewing pan and meeting new people.
        - id: ch01-b138
          speaker: lama
          text: It was a bull, a Red Bull that would come to help you and carry you somewhere. I forget where. Was it a Red Bull on a green field?
        - id: ch01-b139
          speaker: kim
          text: It will not carry me anywhere. That was only a tale I told you.
        - id: ch01-b140
          speaker: cultivator_wife
          text: What is this? Do both of you dream visions? Will a Red Bull on a green field carry you to heaven? Was there a prophecy? We have a Red Bull in our village beyond Jullundur, and he always chooses the greenest field!
        - id: ch01-b141
          speaker: sikh_artisan
          text: Give a woman an old tale, or a weaverbird a leaf and thread, and either one will weave wonders. Holy men dream visions, and their disciples learn the same gift by following them.
        - id: ch01-b142
          speaker: lama
          text: A Red Bull on a green field. Perhaps you earned merit in an earlier life, and the Bull will come as your reward.
        - id: ch01-b143
          speaker: kim
          text: No, it was only a story someone told me, perhaps as a joke. Still, I will search for the Bull near Umballa. You can search for your River, and we will both be free of the train's noise.
        - id: ch01-b144
          speaker: lama
          text: Perhaps the Bull knows where the River lies. Perhaps he was sent to guide us both.
        - id: ch01-b145
          speaker: narrator
          text: He sounded as hopeful as a child. Then he pointed Kim out to the other passengers.
        - id: ch01-b146
          speaker: lama
          text: This boy was sent to me only yesterday. I do not believe he belongs entirely to this world.
        - id: ch01-b147
          speaker: cultivator_wife
          text: I have met beggars enough, and holy men besides, but never a yogi or disciple like these two.
        - id: ch01-b148
          speaker: narrator
          text: Her husband touched one finger to his forehead and smiled. Yet when the lama next ate, they made sure he received the best they had.
        - id: ch01-b149
          speaker: narrator
          text: At last, tired, dusty, and heavy with sleep, they reached Umballa City Station.
        - id: ch01-b150
          speaker: cultivator_wife
          text: We are staying here for a lawsuit, at my husband's cousin's younger brother's house. There is room in the courtyard for your yogi and for you. Will he give me a blessing?
        - id: ch01-b151
          speaker: kim
          text: Holy One! A golden-hearted woman offers us a place for the night. This southern country is kind. Think how people have helped us since dawn!
        - id: ch01-b152
          speaker: narrator
          text: The lama bowed his head and blessed her.
        - id: ch01-b153
          speaker: cultivator
          text: So now we shall fill my cousin's younger brother's home with idle wanderers—
        - id: ch01-b154
          speaker: narrator
          text: He lifted his heavy bamboo staff onto his shoulder.
        - id: ch01-b155
          speaker: cultivator_wife
          text: Your cousin's younger brother still owes my father's cousin for his daughter's wedding feast. He can put their food against that debt. Besides, the yogi will beg for his meals.
        - id: ch01-b156
          speaker: kim
          text: Yes, I beg for him.
        - id: ch01-b157
          speaker: narrator
          text: Kim cared only about finding the lama shelter for the night. Then he could seek Mahbub Ali's Englishman and deliver the white stallion's pedigree. In the inner courtyard of a decent Hindu house behind the cantonments, the lama finally settled down.
        - id: ch01-b158
          speaker: kim
          text: I must go out for a while to buy food in the bazaar. Stay here until I come back.
        - id: ch01-b159
          speaker: lama
          text: You will come back? You are certain? And will you return in this same shape? Is it already too late to search for the River tonight?
        - id: ch01-b160
          speaker: narrator
          text: The old man caught Kim by the wrist.
        - id: ch01-b161
          speaker: kim
          text: It is too late and too dark. Do not worry. Think how far you have come. We are already a hundred kos from Lahore.
        - id: ch01-b162
          speaker: lama
          text: Yes, and farther from my monastery too. What a vast and terrible world this is.
        - id: ch01-b163
          speaker: narrator
          text: Kim slipped away. No one would have noticed the small figure who carried his own fate, and the fate of many thousands, in a packet around his neck. Mahbub Ali's directions nearly told him which house belonged to the Englishman. A groom bringing a dogcart home from the Club removed the last doubt.
        - id: ch01-b164
          speaker: narrator
          text: Kim pushed through the garden hedge and hid in tall, feathery grass beside the veranda. The house shone with light. Servants moved around tables bright with flowers, glass, and silver. Soon an Englishman in black and white came out, humming. Kim could not see his face in the darkness, so he tried an old beggar's trick.
        - id: ch01-b165
          speaker: kim
          text: Protector of the Poor!
        - id: ch01-b166
          speaker: narrator
          text: The man stepped backward toward the voice.
        - id: ch01-b167
          speaker: kim
          text: Mahbub Ali says—
        - id: ch01-b168
          speaker: englishman
          text: Ah! What does Mahbub Ali say?
        - id: ch01-b169
          speaker: narrator
          text: He made no effort to find the speaker. That told Kim he knew how the game was played.
        - id: ch01-b170
          speaker: kim
          text: The pedigree of the white stallion has been proved beyond doubt.
        - id: ch01-b171
          speaker: englishman
          text: And what proof do you carry?
        - id: ch01-b172
          speaker: narrator
          text: The Englishman flicked his switch at the rose hedge beside the drive.
        - id: ch01-b173
          speaker: kim
          text: Mahbub Ali gave me the proof himself.
        - id: ch01-b174
          speaker: narrator
          text: Kim tossed the folded packet through the air. It landed in the path, and the man planted one foot on it as a gardener rounded the corner. Once the servant had passed, he picked it up and dropped a rupee. Kim heard the silver strike the ground. The Englishman went inside without once turning around.
        - id: ch01-b175
          speaker: narrator
          text: Kim snatched up the coin. But despite all his street training, he was Irish enough to value the money less than seeing what his action caused. Instead of slipping away, he pressed himself into the grass and wriggled nearer the house.
        - id: ch01-b176
          speaker: narrator
          text: Indian bungalows stood open from front to back. Kim saw the Englishman enter a little dressing room at one end of the veranda. It served as half an office and was strewn with papers and dispatch boxes. He sat beneath a bright kerosene lamp and studied Mahbub Ali's message. His face darkened and changed. Kim, like every practiced beggar, knew how to watch a face, and he missed nothing.
        - id: ch01-b177
          speaker: englishwoman
          text: Will, dear! You should be in the drawing room. They will arrive any minute.
        - id: ch01-b178
          speaker: narrator
          text: The man kept reading.
        - id: ch01-b179
          speaker: englishwoman
          text: Will! He is here. I can hear the troopers in the drive.
        - id: ch01-b180
          speaker: narrator
          text: Five minutes had passed. The Englishman rushed out bareheaded. A large carriage stopped at the veranda with four native troopers behind it. A tall, black-haired man, straight as an arrow, swung down after a young officer who was laughing pleasantly.
        - id: ch01-b181
          speaker: narrator
          text: Kim lay flat on his stomach, almost beneath the high wheels. His Englishman and the tall visitor traded two quick sentences.
        - id: ch01-b182
          speaker: young_officer
          text: Certainly, sir. If a horse is involved, everything else must wait.
        - id: ch01-b183
          speaker: englishman
          text: We will be no more than twenty minutes. Please do the honors and keep everyone entertained.
        - id: ch01-b184
          speaker: commander
          text: Have one of the troopers remain here.
        - id: ch01-b185
          speaker: narrator
          text: The carriage rolled away, and the two men entered the dressing room. Kim watched their heads bend over Mahbub Ali's message. One voice stayed low and respectful. The other was sharp and decisive.
        - id: ch01-b186
          speaker: commander
          text: We are not talking about weeks. We have days, perhaps only hours. I expected this, but this message settles it. Grogan is dining here tonight, is he not?
        - id: ch01-b187
          speaker: englishman
          text: Yes, sir. Macklin is here too.
        - id: ch01-b188
          speaker: commander
          text: Good. I will speak to both of them. The Council must hear of it, of course, but we are justified in acting now. Warn the Pindi and Peshawar brigades. It will upset every summer relief, but that cannot be helped. We should have crushed them completely the first time. Eight thousand men will be enough.
        - id: ch01-b189
          speaker: englishman
          text: What shall we do about the artillery, sir?
        - id: ch01-b190
          speaker: commander
          text: I need Macklin's advice.
        - id: ch01-b191
          speaker: englishman
          text: Then this means war?
        - id: ch01-b192
          speaker: commander
          text: No. It means punishment. When a man is tied by what his predecessor did—
        - id: ch01-b193
          speaker: englishman
          text: But C25 might have lied.
        - id: ch01-b194
          speaker: commander
          text: His report supports the other information. They practically revealed their plan six months ago, but Devenish insisted peace was still possible. Naturally, they used the time to grow stronger. Send the telegrams now. Use the new code, not the old one, and send both mine and Wharton's. We need not keep the ladies waiting. We can finish our plans over the cigars. I knew this was coming. Remember, it is punishment, not war.
        - id: ch01-b195
          speaker: narrator
          text: A trooper galloped off. Kim crawled behind the house, trusting his Lahore experience to lead him toward food and information. The kitchen swarmed with excited workers. One scullion kicked him.
        - id: ch01-b196
          speaker: kim
          text: Ah! I only came to wash dishes for something to fill my stomach.
        - id: ch01-b197
          speaker: narrator
          text: Kim pretended to cry.
        - id: ch01-b198
          speaker: scullion
          text: Everyone in Umballa wants the same thing. Be off! They are carrying in the soup. Do you imagine the servants of Creighton Sahib need unknown dishwashers for a great dinner?
        - id: ch01-b199
          speaker: kim
          text: It certainly is a great dinner. Just look at all those plates.
        - id: ch01-b200
          speaker: scullion
          text: Of course it is. The guest of honor is the Commander-in-Chief himself.
        - id: ch01-b201
          speaker: kim
          text: Oh!
          emotion: surprised
        - id: ch01-b202
          speaker: narrator
          text: Kim gave exactly the right throaty sound of wonder. He had learned what he wanted. The moment the scullion turned, he vanished.
        - id: ch01-b203
          speaker: kim
          text: All that trouble over a horse's pedigree! Mahbub Ali should ask me for lessons in lying. Every message I carried before this was about a woman. Now it is about men. That is better. The tall man will send a great army to punish someone somewhere. Word goes to Pindi and Peshawar, and guns are involved too. I wish I had crept closer. This is great news!
        - id: ch01-b204
          speaker: narrator
          text: Kim returned to the house. The cultivator's cousin's younger brother was examining every side of the family lawsuit with the cultivator, his wife, and several friends. The lama dozed nearby.
        - id: ch01-b205
          speaker: narrator
          text: After supper, someone handed Kim a water pipe. He sat in the moonlight with his legs spread wide, drawing on the smooth coconut shell and clicking his tongue whenever he offered a remark. He felt very much like a man. His hosts treated him with great respect. The cultivator's wife had told them about his vision of the Red Bull and his possible descent from another world. The lama, too, was a grand and venerable curiosity.
        - id: ch01-b206
          speaker: narrator
          text: Later, the family's old Sarsut Brahmin priest came by. He was tolerant, but naturally began a religious argument to impress the household. Their creed placed them on his side. Still, the lama was their guest and something new. His gentle kindness delighted them, and his great Chinese quotations sounded like spells. In that simple, sympathetic company, he opened like the Bodhisat's own lotus and told them about his life in the high hills of Such-zen.
        - id: ch01-b207
          speaker: lama
          text: That was my life before I rose and went in search of enlightenment.
        - id: ch01-b208
          speaker: narrator
          text: They soon learned that in his worldly years he had been highly skilled at casting horoscopes and reading nativities. The family priest encouraged him to explain his methods. Each man used names for the planets that the other did not understand, and both pointed upward as the great stars crossed the dark sky.
        - id: ch01-b209
          speaker: narrator
          text: The children tugged at the lama's rosary without being scolded. He completely forgot the Rule against looking at women. He spoke of lasting snow, landslides, blocked mountain passes, far cliffs where men found sapphires and turquoise, and the marvelous high road that ran at last into Great China.
        - id: ch01-b210
          speaker: cultivator
          text: What do you make of this holy man?
        - id: ch01-b211
          speaker: narrator
          text: The cultivator spoke quietly to the priest.
        - id: ch01-b212
          speaker: family_priest
          text: He is holy indeed. His Gods are not the true Gods, but his feet are set upon the Way. You would not understand this, but his methods of reading a birth are wise and certain.
        - id: ch01-b213
          speaker: kim
          text: Then tell me whether I will find the Red Bull on a green field that was promised to me.
        - id: ch01-b214
          speaker: narrator
          text: Kim spoke lazily.
        - id: ch01-b215
          speaker: family_priest
          text: What do you know about the hour of your birth?
        - id: ch01-b216
          speaker: narrator
          text: The priest swelled with importance.
        - id: ch01-b217
          speaker: kim
          text: I was born between the first and second crow of the cock, on the first night of May.
        - id: ch01-b218
          speaker: family_priest
          text: In which year?
        - id: ch01-b219
          speaker: kim
          text: I do not know. But when I first cried, the great earthquake struck Srinagar in Kashmir.
        - id: ch01-b220
          speaker: narrator
          text: Kim had learned that from the woman who cared for him, and she had heard it from Kimball O'Hara. The earthquake had been felt across India and remained an important date in the Punjab for many years.
        - id: ch01-b221
          speaker: house_woman
          text: Ah! Was that not when so-and-so's daughter was born—
          emotion: surprised
        - id: ch01-b222
          speaker: narrator
          text: To her, the date made Kim's supernatural origin seem even more certain.
        - id: ch01-b223
          speaker: cultivator_wife
          text: And that girl's mother gave her husband four fine sons in four years!
        - id: ch01-b224
          speaker: narrator
          text: The cultivator's wife sat outside the circle in shadow.
        - id: ch01-b225
          speaker: family_priest
          text: Every educated man remembers where the planets stood in their Houses that night.
        - id: ch01-b226
          speaker: narrator
          text: He began drawing in the courtyard dust.
        - id: ch01-b227
          speaker: family_priest
          text: At the very least, you have a strong claim on half the House of the Bull. Now, how exactly does your prophecy go?
        - id: ch01-b228
          speaker: kim
          text: One day a Red Bull on a green field will make me great. Before that happens, two men will come to prepare everything.
        - id: ch01-b229
          speaker: narrator
          text: Kim enjoyed the excitement he was causing.
        - id: ch01-b230
          speaker: family_priest
          text: Yes, that is how a vision opens. First comes deep darkness. Then a man enters with a broom and prepares the place. Only then does the true vision begin. You say there were two men? Yes, yes. The Sun leaves the House of the Bull and enters the House of the Twins. That explains the two men. Now let us consider the rest. Little one, bring me a twig.
        - id: ch01-b231
          speaker: narrator
          text: He frowned over the dust, scratched mysterious signs, rubbed them away, and scratched again. Everyone watched in wonder except the lama, who wisely chose not to interfere. After half an hour, the priest grunted and threw down the twig.
        - id: ch01-b232
          speaker: family_priest
          text: This is what the stars reveal. Within three days, the two men will come and prepare the way. The Bull follows them. But opposite the Bull stands the sign of War and armed men.
        - id: ch01-b233
          speaker: cultivator_wife
          text: There was a man from the Ludhiana Sikhs in our carriage from Lahore.
        - id: ch01-b234
          speaker: narrator
          text: She offered this hopefully.
        - id: ch01-b235
          speaker: family_priest
          text: No, no. I see armed men by the hundreds. What business could you have with war? Your sign is red with anger, and war will be unleashed very soon.
        - id: ch01-b236
          speaker: lama
          text: None at all. We seek only peace and my River.
        - id: ch01-b237
          speaker: narrator
          text: Kim smiled as he remembered the words from the dressing room. Clearly, the stars favored him.
        - id: ch01-b238
          speaker: family_priest
          text: I can see no more than this. Boy, the Bull will come to you within three days.
        - id: ch01-b239
          speaker: lama
          text: But what of my River? I hoped his Bull might guide us both to it.
        - id: ch01-b240
          speaker: family_priest
          text: Ah, brother, that marvelous River is another matter. Such wonders are not common.
        - id: ch01-b241
          speaker: narrator
          text: The next morning, their hosts urged them to remain, but the lama insisted on leaving. They gave Kim a large bundle of good food and almost three annas in copper for the journey. With many blessings, they watched the two travelers set off southward at dawn.
        - id: ch01-b242
          speaker: lama
          text: It is a pity that these people, and others like them, cannot be freed from—
        - id: ch01-b243
          speaker: kim
          text: But then only wicked people would remain on earth. Who would give us food and shelter?
        - id: ch01-b244
          speaker: narrator
          text: Kim walked cheerfully beneath his load.
        - id: ch01-b245
          speaker: lama
          text: There is a little stream over there. Let us examine it.
        - id: ch01-b246
          speaker: narrator
          text: The lama turned from the white road and led them across the fields, straight into a hornets' nest of barking pariah dogs.
