audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm, observant storytelling with quiet gravity
        timbre: clear and gentle
        pace: measured
        pitch: medium
    student:
      display_name: Young Playwright
      tts:
        delivery: dreamy and suddenly encouraged
        timbre: youthful and warm
        pace: natural
        pitch: medium
    nightingale:
      display_name: Nightingale
      tts:
        delivery: ardent, lyrical, and utterly sincere
        timbre: clear and musical
        pace: flowing
        pitch: high
    green_lizard:
      display_name: Green Lizard
      tts:
        delivery: curious, dry, and lightly mocking
        timbre: quick and wiry
        pace: brisk
        pitch: medium-high
    butterfly:
      display_name: Butterfly
      tts:
        delivery: airy and mildly amused
        timbre: light and delicate
        pace: quick
        pitch: high
    daisy:
      display_name: Daisy
      tts:
        delivery: soft, wondering, and discreet
        timbre: small and gentle
        pace: unhurried
        pitch: high
    white_rose_tree:
      display_name: White Rose-tree
      tts:
        delivery: gracious and matter-of-fact
        timbre: pale and whispering
        pace: measured
        pitch: medium-high
    yellow_rose_tree:
      display_name: Yellow Rose-tree
      tts:
        delivery: gracious and matter-of-fact
        timbre: warm and rustling
        pace: measured
        pitch: medium
    red_rose_tree:
      display_name: Red Rose-tree
      tts:
        delivery: grave, compassionate, and urgent when time is short
        timbre: deep and woody
        pace: slow
        pitch: medium-low
    oak_tree:
      display_name: Oak-tree
      tts:
        delivery: tender and quietly sorrowful
        timbre: old and leafy
        pace: unhurried
        pitch: low
