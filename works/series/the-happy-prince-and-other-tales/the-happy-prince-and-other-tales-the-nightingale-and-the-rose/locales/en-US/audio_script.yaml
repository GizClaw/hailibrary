  chapters:
    - id: ch01
      title: The Student's Sorrow
      blocks:
        - id: ch01-b01
          speaker: student
          text: She promised to dance with me if I brought her red roses. But there isn't one red rose anywhere in my garden.
          emotion: sad
        - id: ch01-b02
          speaker: narrator
          text: The Nightingale heard him from her nest in the holm-oak. She peered through the leaves and wondered about him.
        - id: ch01-b03
          speaker: student
          text: Not one red rose in the whole garden! My happiness depends on such a little thing. I've read everything the wise men wrote. I know all the secrets of philosophy. And still, because I have no red rose, my life is miserable.
          emotion: sad
        - id: ch01-b04
          speaker: narrator
          text: As he spoke, his beautiful eyes filled with tears. All the wisdom he had found in books could not give him the one small thing he wanted.
        - id: ch01-b05
          speaker: nightingale
          text: At last, here is a true lover. Night after night, I've sung about him without knowing who he was. Night after night, I've told his story to the stars, and now I see him. His hair is dark like a hyacinth flower, and his lips are as red as the rose he longs for. But passion has turned his face pale as ivory, and sorrow has left its mark upon his brow.
        - id: ch01-b06
          speaker: student
          text: The Prince is giving a ball tomorrow night, and the girl I love will be there. If I bring her a red rose, she'll dance with me until dawn. I'll hold her in my arms. Her head will rest on my shoulder, and her hand will be in mine. But there are no red roses here. I'll have to sit alone while she passes me by. She won't even notice me, and my heart will break.
          emotion: sad
        - id: ch01-b07
          speaker: nightingale
          text: He truly is the lover I've always sung about. He suffers from the very thing that fills my songs with joy. Love is surely a wonderful thing. It's more precious than emeralds and dearer than fine opals. Pearls and pomegranates cannot buy it. You won't find it laid out in the marketplace. No merchant can sell it, and no one can weigh out enough gold to pay for it.
        - id: ch01-b08
          speaker: student
          text: The musicians will sit in the gallery and play their stringed instruments. My love will dance to the sound of the harp and violin. She'll dance so lightly that her feet will hardly touch the floor, and courtiers in their bright clothes will crowd around her. But she won't dance with me. I have no red rose to give her.
          emotion: sad
        - id: ch01-b09
          speaker: narrator
          text: He threw himself onto the grass, hid his face in his hands, and wept.
        - id: ch01-b10
          speaker: green_lizard
          text: Why is he crying?
        - id: ch01-b11
          speaker: narrator
          text: A little Green Lizard had run past with his tail in the air.
        - id: ch01-b12
          speaker: butterfly
          text: Yes, why is he?
        - id: ch01-b13
          speaker: narrator
          text: A Butterfly fluttered after a sunbeam as he spoke.
        - id: ch01-b14
          speaker: daisy
          text: Why is he?
        - id: ch01-b15
          speaker: narrator
          text: A Daisy whispered the question softly to the flower beside him.
        - id: ch01-b16
          speaker: nightingale
          text: He's crying because he needs a red rose.
        - id: ch01-b17
          speakers: [green_lizard, butterfly, daisy]
          ensemble: chorus
          text: A red rose? How ridiculous!
        - id: ch01-b18
          speaker: narrator
          text: The little Lizard, who liked to laugh at serious things, laughed aloud. But the Nightingale understood the secret of the Student's sorrow. She sat quietly in the oak and thought about the mystery of Love.
    - id: ch02
      title: Three Rose-trees
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: Suddenly, the Nightingale spread her brown wings and rose into the air. Like a shadow, she flew through the grove and across the garden. A beautiful Rose-tree stood in the middle of the lawn. She flew to it and landed on one of its sprays.
        - id: ch02-b02
          speaker: nightingale
          text: Give me one red rose, and I'll sing you my sweetest song.
        - id: ch02-b03
          speaker: narrator
          text: The Tree shook its head.
        - id: ch02-b04
          speaker: white_rose_tree
          text: My roses are white. They're as white as the foam on the sea, and even whiter than the snow high on the mountain. But go to my brother who grows around the old sundial. Perhaps he can give you what you need.
        - id: ch02-b05
          speaker: narrator
          text: The Nightingale flew to the Rose-tree that grew around the old sundial.
        - id: ch02-b06
          speaker: nightingale
          text: Give me one red rose, and I'll sing you my sweetest song.
        - id: ch02-b07
          speaker: narrator
          text: That Tree shook its head too.
        - id: ch02-b08
          speaker: yellow_rose_tree
          text: My roses are yellow. They're as yellow as the hair of the mermaid who sits on an amber throne. They're yellower than the daffodil that blooms in the meadow before the mower arrives with his scythe. Go to my brother beneath the Student's window. Perhaps he can give you what you need.
        - id: ch02-b09
          speaker: narrator
          text: So the Nightingale flew to the Rose-tree beneath the Student's window.
        - id: ch02-b10
          speaker: nightingale
          text: Give me one red rose, and I'll sing you my sweetest song.
        - id: ch02-b11
          speaker: narrator
          text: The third Tree shook its head.
        - id: ch02-b12
          speaker: red_rose_tree
          text: My roses are red. They're as red as a dove's feet, and redder than the great coral fans that wave and wave inside an ocean cave. But winter has chilled the sap in my veins. The frost has bitten all my buds, and the storms have broken my branches. I won't bear a single rose this whole year.
          emotion: sad
        - id: ch02-b13
          speaker: nightingale
          text: I only need one red rose. Just one! Is there any way I can get it?
        - id: ch02-b14
          speaker: red_rose_tree
          text: There is one way. But it's so terrible that I hardly dare tell you.
          emotion: fearful
        - id: ch02-b15
          speaker: nightingale
          text: Tell me. I'm not afraid.
        - id: ch02-b16
          speaker: red_rose_tree
          text: Then you must make the rose from music in the moonlight, and stain it with blood from your own heart. You must press your breast against one of my thorns and sing to me all night long. The thorn must pierce your heart, and the blood of your life must flow into my veins and become part of me.
        - id: ch02-b17
          speaker: nightingale
          text: Death is a terrible price for one red rose, and every living creature treasures life. How lovely it is to sit in the green wood and watch the Sun ride in his golden chariot, and the Moon in her chariot of pearl. The scent of the hawthorn is sweet. So are the bluebells hidden in the valley and the heather blooming on the hill. Yet Love is better than Life. What is the heart of a bird beside the heart of a man?
          emotion: sad
        - id: ch02-b18
          speaker: narrator
          text: She spread her brown wings again. Like a shadow, she swept over the garden and sailed back through the grove.
    - id: ch03
      title: One Last Song
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: The young Student still lay where she had left him. The tears had not dried in his beautiful eyes.
        - id: ch03-b02
          speaker: nightingale
          text: Be happy! Be happy, because you shall have your red rose. I'll make it from music in the moonlight and stain it with blood from my own heart. In return, I ask only that you be a true lover. Love is wiser than Philosophy, even though she is wise, and mightier than Power, even though he is mighty. Love has wings the color of flame, and his body is colored like fire. His lips are sweet as honey, and his breath is like incense.
        - id: ch03-b03
          speaker: narrator
          text: The Student raised his head from the grass and listened. But he could not understand anything the Nightingale was saying to him. He knew only the things that had been written down in books.
        - id: ch03-b04
          speaker: narrator
          text: The Oak-tree did understand. He was very fond of the little bird who had built her nest among his branches, and sadness filled him.
        - id: ch03-b05
          speaker: oak_tree
          text: Sing me one last song. I'll be very lonely after you're gone.
          emotion: sad
        - id: ch03-b06
          speaker: narrator
          text: The Nightingale sang to the Oak-tree, and her voice sounded like water bubbling from a silver jar.
        - id: ch03-b07
          speaker: narrator
          text: When the song ended, the Student stood up. He took a notebook and a pencil from his pocket. As he walked away through the grove, he considered the bird's music.
        - id: ch03-b08
          speaker: student
          text: She certainly understands form. No one can deny that. But does she have any real feeling? I'm afraid she doesn't. She's like most artists, all style and no sincerity. She would never sacrifice herself for anyone. Music is all she thinks about, and everyone knows the arts are selfish. Still, I have to admit there are some beautiful notes in her voice. What a pity they don't mean anything or do any practical good.
        - id: ch03-b09
          speaker: narrator
          text: He went to his room and lay on his narrow bed. He thought about the girl he loved, and after a while he fell asleep.
    - id: ch04
      title: The Rose in the Moonlight
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: When the Moon shone in the sky, the Nightingale flew to the Rose-tree and placed her breast against the thorn. All night long she sang with the thorn against her breast, while the cold, crystal Moon bent down and listened. All night long, the thorn sank deeper and deeper, and the blood of her life slowly drained away.
        - id: ch04-b02
          speaker: narrator
          text: First she sang about love being born in the hearts of a boy and a girl. On the highest spray of the Rose-tree, a marvelous flower began to bloom. One petal followed another, just as one song followed another. At first the rose was pale as mist hanging above a river. It was pale as the feet of morning and silver as the wings of dawn. It looked like the shadow of a rose reflected in a silver mirror, or the shadow of a rose resting in a pool of water.
        - id: ch04-b03
          speaker: red_rose_tree
          text: Press closer, little Nightingale, or daylight will come before the rose is done!
        - id: ch04-b04
          speaker: narrator
          text: The Nightingale leaned closer to the thorn, and her song grew louder. Now she sang about passion awakening in the souls of a man and a woman.
        - id: ch04-b05
          speaker: narrator
          text: A delicate flush of pink spread through the rose's leaves. It was like the color that rises in a bridegroom's face when he kisses his bride. But the thorn had not yet reached the Nightingale's heart, so the heart of the rose remained white. Only a Nightingale's heart's blood could turn the heart of a rose crimson.
        - id: ch04-b06
          speaker: red_rose_tree
          text: Press closer, little Nightingale, or daylight will come before the rose is done!
        - id: ch04-b07
          speaker: narrator
          text: She pressed closer. At last, the thorn touched her heart, and a fierce pain shot through her. The agony was bitter, bitter, and her song became wilder and wilder. She sang of the Love made perfect by Death, and of the Love that does not die even in the grave.
        - id: ch04-b08
          speaker: narrator
          text: The marvelous rose turned crimson, like the rose-colored sky in the east. The whole ring of petals was crimson now, and the heart at its center glowed as red as a ruby.
        - id: ch04-b09
          speaker: narrator
          text: But the Nightingale's voice began to fade. Her little wings fluttered, and a mist covered her eyes. Her song grew fainter and fainter. Something seemed to close around her throat.
        - id: ch04-b10
          speaker: narrator
          text: Then she poured out one last burst of music. The white Moon heard it. She forgot about the dawn and lingered in the sky. The red rose heard the song and trembled all over with joy, opening its petals to the cold morning air. Echo carried the music into her purple cave among the hills and woke the sleeping shepherds from their dreams. It floated through the river reeds, and they carried its message onward to the sea.
        - id: ch04-b11
          speaker: red_rose_tree
          text: Look! Look! The rose is finished now!
        - id: ch04-b12
          speaker: narrator
          text: The Nightingale did not answer. She lay dead in the long grass, with the thorn through her heart.
    - id: ch05
      title: The Red Rose
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: At noon, the Student opened his window and looked outside.
        - id: ch05-b02
          speaker: student
          text: What extraordinary luck! There's a red rose! I've never seen a rose like this in my life. It's so beautiful that it must have a long Latin name.
          emotion: surprised
        - id: ch05-b03
          speaker: narrator
          text: He leaned down and picked it. Then he put on his hat and ran to the Professor's house with the rose in his hand.
        - id: ch05-b04
          speaker: narrator
          text: The Professor's daughter sat in the doorway, winding blue silk around a reel. Her little dog lay at her feet.
        - id: ch05-b05
          speaker: student
          text: You said you'd dance with me if I brought you a red rose. Here is the reddest rose in the world. Wear it beside your heart tonight. While we dance together, it will tell you how much I love you.
        - id: ch05-b06
          speaker: narrator
          text: The girl frowned.
        - id: ch05-b07
          speaker: professor_daughter
          text: I'm afraid that rose won't go with my dress. Besides, the Chamberlain's nephew has sent me some real jewels. Everybody knows that jewels cost far more than flowers.
        - id: ch05-b08
          speaker: student
          text: Honestly, you are very ungrateful!
          emotion: angry
        - id: ch05-b09
          speaker: narrator
          text: In his anger, he threw the rose out into the street. It fell into the gutter, and the wheel of a passing cart rolled over it.
        - id: ch05-b10
          speaker: professor_daughter
          text: Ungrateful? You're terribly rude! And who are you, anyway? You're only a Student. I don't believe you even have silver buckles on your shoes like the Chamberlain's nephew does.
          emotion: angry
        - id: ch05-b11
          speaker: narrator
          text: She rose from her chair and went inside. The Student walked away.
        - id: ch05-b12
          speaker: student
          text: What a foolish thing Love is. It isn't half as useful as Logic, because it doesn't prove anything. Love is always telling you about things that will never happen and making you believe things that aren't true. In fact, it's completely impractical. And in this age, being practical is everything. I'll go back to Philosophy and study Metaphysics.
        - id: ch05-b13
          speaker: narrator
          text: He returned to his room, pulled out a large dusty book, and began to read.
