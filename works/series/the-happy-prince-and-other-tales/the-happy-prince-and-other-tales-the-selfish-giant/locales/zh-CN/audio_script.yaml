audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温暖沉静，带着童话叙事的从容与克制
        timbre: 清澈柔和
        pace: 舒缓而富有变化
        pitch: 中
    giant:
      display_name: 巨人
      tts:
        delivery: 起初粗暴生硬，后来真诚温厚，年老时平静慈爱
        timbre: 浑厚低沉
        pace: 稍慢
        pitch: 低
    child_1:
      display_name: 孩子甲
      tts:
        delivery: 天真爽朗，说话直率而有朝气
        timbre: 清亮稚嫩
        pace: 轻快
        pitch: 高
    child_2:
      display_name: 孩子乙
      tts:
        delivery: 活泼自然，语气柔和而真挚
        timbre: 明快柔嫩
        pace: 稍快
        pitch: 中高
    snow:
      display_name: 雪
      tts:
        delivery: 得意而轻盈，带着冷冰冰的欢喜
        timbre: 柔亮冰凉
        pace: 舒缓
        pitch: 中高
    frost:
      display_name: 霜
      tts:
        delivery: 顽皮而干脆，透着冷冷的兴奋
        timbre: 清脆锐亮
        pace: 中等
        pitch: 高
    north_wind:
      display_name: 北风
      tts:
        delivery: 喧闹张扬，声音里带着呼啸感
        timbre: 粗砺有力
        pace: 中等
        pitch: 低
    autumn:
      display_name: 秋天
      tts:
        delivery: 简短冷淡，判断明确
        timbre: 成熟清亮
        pace: 从容
        pitch: 中
    tree:
      display_name: 树
      tts:
        delivery: 温柔急切，像在努力帮助一个孩子
        timbre: 柔和轻盈
        pace: 稍慢
        pitch: 中
    little_boy:
      display_name: 小男孩
      tts:
        delivery: 稚嫩安静，后段带着神秘而庄严的平和
        timbre: 纯净明亮
        pace: 舒缓
        pitch: 高
  chapters:
    - id: ch01
      title: 高墙里的花园
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 每天下午一放学，孩子们都会跑进巨人的花园玩。那座花园又大又美，绿草柔软，花朵像星星一样散落在草地上。园里有十二棵桃树，春天开出粉红和珠白的花，秋天结满果实。鸟儿在枝头唱得那么甜，孩子们常常玩到一半就停下来听。
        - id: ch01-b02
          speakers: [child_1, child_2]
          ensemble: duo
          text: 在这里玩，我们真快活呀！
          emotion: happy
        - id: ch01-b03
          speaker: narrator
          text: 有一天，巨人回来了。他去看望康沃尔的食人魔朋友，一住就是七年。七年过去，他能跟朋友说的话全说完了。毕竟，他原本就没多少话可说。于是巨人回到自己的城堡，刚进门，就发现花园里全是玩耍的孩子。
        - id: ch01-b04
          speaker: giant
          text: 你们跑到这里来干什么？
          emotion: angry
        - id: ch01-b05
          speaker: narrator
          text: 巨人的嗓音又粗又凶，孩子们吓得四散而逃。
        - id: ch01-b06
          speaker: giant
          text: 这是我的花园，只能归我一个人。谁都懂这个道理。我不许别人进来玩！
          emotion: angry
        - id: ch01-b07
          speaker: narrator
          text: 他在花园四周砌起高墙，又立下一块牌子，警告擅自闯入的人一定会受惩处。他实在是个自私的巨人。
        - id: ch01-b08
          speaker: narrator
          text: 可怜的孩子们再也找不到玩耍的地方。他们试过在路上玩，可那里满是飞扬的尘土和坚硬的石块，一点儿也不好。每次放学以后，他们只能沿着高墙走来走去，一遍遍说起墙内那座美丽的花园。
        - id: ch01-b09
          speakers: [child_1, child_2]
          ensemble: duo
          text: 从前能在花园里玩，那时候多快活呀。
          emotion: sad
    - id: ch02
      title: 忘了离开的冬天
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 春天来了。全国各处都有小花开放，也有小鸟歌唱，只有自私巨人的花园还留在冬天里。没有孩子，鸟儿不愿唱，树也忘记了开花。有朵美丽的小花探出草地，正想开放，却看见了那块告示牌。它想起那些无处可玩的孩子，难过得缩回地下，又睡着了。只有雪和霜高兴得不得了。
        - id: ch02-b02
          speakers: [snow, frost]
          ensemble: duo
          text: 春天已经忘了这座花园。那就让我们整年都住在这里吧！
          emotion: happy
        - id: ch02-b03
          speaker: narrator
          text: 雪把宽大的白斗篷铺满草地，霜把每棵树都染成银色。他们还请来北风。北风裹着毛皮，在园里吼了一整天，连烟囱帽也吹落了。
        - id: ch02-b04
          speaker: north_wind
          text: 这地方可真好！我们应该把冰雹也请来。
          emotion: happy
        - id: ch02-b05
          speaker: narrator
          text: 冰雹来了以后，每天都要在城堡屋顶噼啪乱跳三个钟头。他砸坏大半屋瓦以后，才跳下屋顶，用最快的速度绕着花园一圈又一圈地奔跑。他穿着一身灰衣，吐出的气冷得像冰。
        - id: ch02-b06
          speaker: giant
          text: 春天为什么还不来呢？但愿这又冷又白的天气快些变一变。
        - id: ch02-b07
          speaker: narrator
          text: 巨人坐在窗边，望着又冷又白的花园，等着天气改变。可春天没有来，夏天也没有来。秋天把金色果实送进每一座花园，却没有给巨人一颗。
        - id: ch02-b08
          speaker: autumn
          text: 他太自私了。
        - id: ch02-b09
          speaker: narrator
          text: 从那以后，花园里一直都是冬天。北风、冰雹、霜和雪终日在树间乱舞。
    - id: ch03
      title: 春天回来了
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 一天早晨，巨人醒着躺在床上，忽然听到一阵好听的音乐。那歌声甜美得叫他以为国王的乐师正从外面经过。其实，窗外只有一只小红雀。可花园太久没有鸟唱歌了，这声音听起来简直是世上最美的音乐。冰雹停下了舞步，北风也闭了嘴，敞开的窗子送进一缕芬芳。
        - id: ch03-b02
          speaker: giant
          text: 看来春天终于到了！
          emotion: happy
        - id: ch03-b03
          speaker: narrator
          text: 巨人跳下床，往窗外一看。你猜他看见了什么？孩子们从墙上的小洞钻进来了，他望得见的每棵树上，都有一个孩子坐在枝头。树木因为孩子回来，高兴得开满鲜花，还把枝条当作手臂，在他们头顶轻轻摇动。鸟儿欢快地飞来飞去，花朵也从绿草里抬起脸笑。
        - id: ch03-b04
          speaker: narrator
          text: 整座花园都美极了，只有最远的角落仍旧是冬天。一个很小的男孩站在那里。他够不到树枝，只能绕着树走，哭得很伤心。那棵树还盖满霜雪，北风也在树顶怒吼。
        - id: ch03-b05
          speaker: tree
          text: 小男孩，快爬上来吧！
        - id: ch03-b06
          speaker: narrator
          text: 树把枝条压到最低，可男孩还是太小，怎么也爬不上去。巨人看着这一切，心一下子软了。
        - id: ch03-b07
          speaker: giant
          text: 我以前真是太自私了！现在我终于知道，春天为什么不肯来。我要把那个可怜的小男孩抱到树上，再把高墙拆掉。从今以后，我的花园永远是孩子们的游乐场。
          emotion: sad
        - id: ch03-b08
          speaker: narrator
          text: 巨人想到自己做过的那些事，心里十分懊悔。他悄悄下楼，轻轻打开前门，走进花园。可孩子们一见到他，还是吓得逃走了。孩子一走，花园立刻又变成冬天。只有那个小男孩没跑。他哭得满眼都是泪，根本没看见巨人走近。
        - id: ch03-b09
          speaker: narrator
          text: 巨人来到男孩身后，用手轻轻托起他，把他放上树。那棵树一下子开满鲜花，鸟儿也飞来唱歌。小男孩张开双臂，搂住巨人的脖子，亲了他一下。其他孩子看见巨人不再凶恶，全都跑了回来，春天也跟着他们回来了。
        - id: ch03-b10
          speaker: giant
          text: 孩子们，这座花园现在是你们的了。
        - id: ch03-b11
          speaker: narrator
          text: 巨人拿起大斧头，拆掉了高墙。到了正午，去赶集的人们看见巨人正和孩子们一起玩，而那座花园，是他们一生中见过的最美的花园。
    - id: ch04
      title: 巨人思念的孩子
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 孩子们玩了一整天。傍晚，他们来向巨人告别。
        - id: ch04-b02
          speaker: giant
          text: 你们那个小伙伴呢？就是我抱上树的男孩，他到哪里去了？
        - id: ch04-b03
          speaker: narrator
          text: 巨人最喜欢那个男孩，因为男孩亲过他。
        - id: ch04-b04
          speakers: [child_1, child_2]
          ensemble: duo
          text: 我们不知道。他已经走了。
        - id: ch04-b05
          speaker: giant
          text: 你们见到他，一定叫他明天再来。
        - id: ch04-b06
          speaker: narrator
          text: 可孩子们从不知道男孩住在哪里，在那天以前也从没见过他。巨人听完非常难过。往后每天下午，孩子们放学都会来和巨人玩，只有那个小男孩再也没出现。巨人待每个孩子都很和善，可他最想念的还是最初的那个小朋友。他盼着男孩回来，也常常对孩子们念起他。
        - id: ch04-b07
          speaker: giant
          text: 我真想再见他一面啊！
          emotion: sad
        - id: ch04-b08
          speaker: narrator
          text: 年复一年，巨人老了，身体也越来越衰弱。他再也不能跑着玩，只好坐在巨大的扶手椅里，一边看孩子们游戏，一边欣赏自己那座美丽的花园。
        - id: ch04-b09
          speaker: giant
          text: 我的花园里有许多美丽的花，可孩子们才是最美的花。
    - id: ch05
      title: 天堂的花园
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 一个冬日的早晨，巨人一边穿衣，一边望向窗外。他早已不再讨厌冬天，因为他懂得了，冬天只是睡着的春天，花朵也正在休息。
        - id: ch05-b02
          speaker: narrator
          text: 忽然，巨人惊讶地揉揉眼睛，一看再看。花园最远的角落里，那棵树竟然开满美丽的白花。金色枝条上垂着银色果实，树下站着他一直思念的小男孩。
        - id: ch05-b03
          speaker: narrator
          text: 巨人高兴极了，飞奔下楼，冲进花园，急忙穿过草地来到孩子面前。可他一走近，脸顿时气得通红。孩子的两只手掌上各有一道钉痕，两只小脚上也各有一道。
        - id: ch05-b04
          speaker: giant
          text: 是谁胆敢伤害你？告诉我！我要拿起长剑，杀掉那个伤害你的人！
          emotion: angry
        - id: ch05-b05
          speaker: little_boy
          text: 不。这些是爱的伤痕。
        - id: ch05-b06
          speaker: giant
          text: 你到底是谁？
        - id: ch05-b07
          speaker: narrator
          text: 一股奇异的敬畏落在巨人心上。他跪在小男孩面前。男孩望着巨人，微微一笑。
        - id: ch05-b08
          speaker: little_boy
          text: 你曾让我在你的花园里玩。今天，你要跟我到我的花园去，那座花园就是天堂。
          emotion: calm
        - id: ch05-b09
          speaker: narrator
          text: 那天下午，孩子们跑进花园。他们看见巨人已经死了。他躺在树下，满身盖着白色的花朵。
