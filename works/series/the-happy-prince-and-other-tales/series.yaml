cover_prompt: |-
  A wordless cover scene in a late-Victorian European city gathers the central wonders of Oscar Wilde's tales beneath an evening sky. The gilded statue of the Happy Prince stands high above rooftops with a blue sapphire gaze and a red jewel at his sword hilt, while a small dark swallow hovers beside him carrying a thin gold leaf. Below, a giant opens his garden gate to children, a nightingale rests among rose branches, and a proud firework waits unlit near a palace garden. The swallow placing the gold leaf into its beak for delivery is the focal action, expressing compassion without showing suffering directly. Use an upward city view with layered rooftops and gardens, balancing the tall statue against generous calm sky at the top. Keep all costumes and architecture rooted in the nineteenth century and all figures original rather than based on later illustrated or screen versions. No readable text, letters, numbers, labels, logos, captions, speech bubbles, signatures, or watermarks.
