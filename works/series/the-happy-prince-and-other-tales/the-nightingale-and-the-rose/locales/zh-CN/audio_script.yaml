audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 温柔克制，带着清醒的童话叙述感
        timbre: 温暖清澈
        pace: 舒缓而有变化
        pitch: 中
    student:
      display_name: 年轻的学生
      tts:
        delivery: 自负而多愁善感，情绪来得快也去得快
        timbre: 清亮年轻
        pace: 稍快
        pitch: 中高
    nightingale:
      display_name: 夜莺
      tts:
        delivery: 真挚坚定，怀着诗意的热情
        timbre: 轻盈明亮
        pace: 从容
        pitch: 高
    lizard:
      display_name: 绿蜥蜴
      tts:
        delivery: 好奇中带着讥诮
        timbre: 细而干脆
        pace: 轻快
        pitch: 中高
    butterfly:
      display_name: 蝴蝶
      tts:
        delivery: 漫不经心，轻飘随意
        timbre: 轻柔
        pace: 轻快
        pitch: 高
    daisy:
      display_name: 雏菊
      tts:
        delivery: 轻声细语，单纯好奇
        timbre: 柔细
        pace: 缓慢
        pitch: 高
    rose_tree:
      display_name: 玫瑰树
      tts:
        delivery: 沉静庄重，语气坦率
        timbre: 温厚低沉
        pace: 平稳
        pitch: 中低
    oak_tree:
      display_name: 橡树
      tts:
        delivery: 苍老慈爱，含着不舍
        timbre: 深沉柔和
        pace: 缓慢
        pitch: 低
    professor_daughter:
      display_name: 教授的女儿
      tts:
        delivery: 挑剔傲慢，言语直截了当
        timbre: 清脆冷淡
        pace: 适中
        pitch: 中高
  chapters:
    - id: ch01
      title: 一朵红玫瑰
      blocks:
        - id: ch01-b01
          speaker: student
          text: “她明明说过，只要我带一朵红玫瑰去，她就会跟我跳舞。可这满园里，偏偏一朵红玫瑰也找不到！”
          emotion: sad
        - id: ch01-b02
          speaker: narrator
          text: 年轻的学生哭了。冬青橡树上，夜莺正在自己的巢里。她听见他的声音，便从层层叶子中探头望去，心里很奇怪，不知道眼前这个年轻人为何这样伤心。
        - id: ch01-b03
          speaker: student
          text: “一朵也没有！幸福竟会系在这么小的一件东西上。我读遍了智者的著作，也懂得哲学的奥秘，如今却因为少了一朵红玫瑰，什么快乐都没有了。”
          emotion: sad
        - id: ch01-b04
          speaker: nightingale
          text: “原来真正的恋人就在这里。我夜夜对星星唱起他的故事，却从没见过他。如今我看见了。他有风信子般乌黑的头发，嘴唇像他渴望的玫瑰那样红，可爱情把他的脸熬成了苍白的象牙，忧愁也压在他的眉间。”
        - id: ch01-b05
          speaker: student
          text: “王子明晚举行舞会，她也会去。只要有一朵红玫瑰，我就能同她跳到天亮。我会拥着她，她会靠在我肩头，把手放在我手里。可我没有玫瑰，只能独自坐着，看她从身边走过去。她连看都不会看我，我的心一定会碎。”
          emotion: sad
        - id: ch01-b06
          speaker: nightingale
          text: “他果然是真正的恋人。他正在亲身忍受我歌里唱的一切。我唱出来只觉得欢欣，落在他的心上却全是痛苦。爱情真奇妙，比翡翠和上好的蛋白石都珍贵。珍珠和石榴买不到它，市集上没有人出售，商人手里也寻不着。哪怕把黄金放上天平，也称不出爱情的价钱。”
        - id: ch01-b07
          speaker: student
          text: “乐师会坐在楼廊上，弹起竖琴和小提琴。她会跳得那么轻，双脚仿佛不沾地，华服的廷臣们都会围着她。只有我不能同她跳舞，因为我没有红玫瑰。”
          emotion: sad
        - id: ch01-b08
          speaker: narrator
          text: 学生再也说不下去了。他扑倒在草地上，两手紧紧蒙住脸，伤心地哭个不停。一只小绿蜥蜴恰好从旁边跑过，尾巴高高翘在空中。
        - id: ch01-b09
          speaker: lizard
          text: “他这是为什么哭呀？”
        - id: ch01-b10
          speaker: butterfly
          text: “对呀，他到底为什么哭呢？”
        - id: ch01-b11
          speaker: narrator
          text: 一只追着阳光飞舞的蝴蝶也来问。旁边的雏菊压低了声音。
        - id: ch01-b12
          speaker: daisy
          text: “他究竟遇上什么事了？”
        - id: ch01-b13
          speaker: nightingale
          text: “他是为了求不到一朵红玫瑰。”
        - id: ch01-b14
          speaker: lizard
          text: “为了一朵红玫瑰？这也太荒唐了！”
        - id: ch01-b15
          speaker: narrator
          text: 另外几个小家伙也跟着叫了起来，觉得为一朵花落泪实在可笑。小蜥蜴向来爱冷嘲热讽，说完更是放声大笑。夜莺却懂得学生悲伤的秘密。她没有笑，只是静静坐在橡树上，想着那深不可测的爱情。
    - id: ch02
      title: 可怕的办法
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 忽然，夜莺展开棕色的翅膀，飞向空中。她穿过小树林时，像一道无声的影子。越过花园时，也像一道影子在地面上滑行。草坪正中央立着一株美丽的玫瑰树，她一看见，立刻飞过去，停在一根嫩枝上。
        - id: ch02-b02
          speaker: nightingale
          text: “请送我一朵红玫瑰吧，我会把最甜美的歌唱给你听。”
        - id: ch02-b03
          speaker: rose_tree
          text: “可我的玫瑰都是白色的，白得像海上的泡沫，比山顶的雪还白。去问问日晷旁边的兄弟吧，也许它有你要的花。”
        - id: ch02-b04
          speaker: narrator
          text: 夜莺便飞到古老日晷旁的玫瑰树上，再一次提出请求。
        - id: ch02-b05
          speaker: nightingale
          text: “只要给我一朵红玫瑰，我就为你唱一支最动听的歌。”
        - id: ch02-b06
          speaker: rose_tree
          text: “我的玫瑰是黄的，像琥珀宝座上美人鱼的头发，比割草人到来前草地上的水仙还要黄。你去找学生窗下的兄弟吧，它或许能帮你。”
        - id: ch02-b07
          speaker: narrator
          text: 夜莺又飞到学生窗下，落在第三株玫瑰树的枝头。
        - id: ch02-b08
          speaker: nightingale
          text: “请给我一朵红玫瑰吧，我愿把最甜的歌送给你。”
        - id: ch02-b09
          speaker: rose_tree
          text: “我的玫瑰确实是红的，像鸽子的脚，比海底洞穴里那些一摇再摇的巨大珊瑚扇还要鲜红。可冬天冻住了我的血脉，寒霜打坏了花苞，风暴也折断了枝条。今年我连一朵玫瑰也开不出来。”
        - id: ch02-b10
          speaker: nightingale
          text: “我只求一朵，只要一朵红玫瑰！难道真的没有办法吗？”
        - id: ch02-b11
          speaker: rose_tree
          text: “办法是有的，可它太可怕，我实在不敢说。”
          emotion: fearful
        - id: ch02-b12
          speaker: nightingale
          text: “你告诉我吧，我不怕。”
        - id: ch02-b13
          speaker: rose_tree
          text: “你得在月光下用歌声造出玫瑰，再拿自己的心血染红它。你要把胸口抵住一根刺，整夜为我歌唱。尖刺必须穿透你的心，让生命之血流进我的血脉，成为我的血。”
        - id: ch02-b14
          speaker: nightingale
          text: “用死亡换一朵玫瑰，代价真大。谁不爱惜生命呢？坐在绿色的树林里，看太阳驾着金色马车经过，又看月亮乘着珍珠马车升起，是多么美好。山楂散发着甜香，蓝铃花藏在山谷里，石南花开满山坡，这一切都值得留恋。可是爱情比生命更可贵。一只鸟儿的心，怎么比得上一个人的心呢？”
    - id: ch03
      title: 夜莺最后的歌
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 夜莺展开翅膀，再次飞上空中。她像影子一样掠过花园，又穿过那片小树林。学生还伏在她离开时的草地上，那双美丽眼睛里的泪水甚至还没有干。
        - id: ch03-b02
          speaker: nightingale
          text: “别再伤心了，你会有红玫瑰的。我会在月光下用歌声造出它，再用自己的心血染红它。我只求你做一个真心的恋人。爱情比哲学更有智慧，也比权力更强大。它有火焰般的翅膀和身躯，嘴唇甜如蜂蜜，呼吸带着乳香。”
        - id: ch03-b03
          speaker: narrator
          text: 学生抬头听着，却一个字也没听懂，因为他只懂书里写下来的事。橡树却听明白了。它疼爱这只把巢筑在枝头的小夜莺，想到她将离去，心里很难过。
        - id: ch03-b04
          speaker: oak_tree
          text: “走以前，最后再给我唱一支歌吧。以后没有你，我会很寂寞。”
          emotion: sad
        - id: ch03-b05
          speaker: narrator
          text: 夜莺答应了，站在橡树的枝头，为它唱了最后一曲。那歌声清清亮亮，像水从一只银瓶中汩汩流出来。歌声停下以后，学生才从草地上站起身，从衣袋里摸出一本笔记簿和一支铅笔。
        - id: ch03-b06
          speaker: student
          text: “她的曲式确实不错，可她有感情吗？我看没有。她跟许多艺术家一样，只有形式，没有真心，绝不会为别人牺牲。她只顾音乐，而艺术本来就是自私的。当然，她有几个音唱得很美，可那些音毫无意义，也派不上实际用场。”
        - id: ch03-b07
          speaker: narrator
          text: 学生一路说着，穿过树林，回到自己的房间。他躺上窄小的床，满脑子仍是心上人的模样，过了一阵便睡着了。月亮升上天空时，夜莺飞到窗下的玫瑰树前，把胸口贴在那根尖刺上。她就这样唱了整整一夜。清冷如水晶的月亮低低俯下身，一直听着。尖刺越扎越深，她体内的生命之血也一点一点流进树的血脉。
        - id: ch03-b08
          speaker: narrator
          text: 一开始，她唱的是爱情怎样在一个男孩和一个女孩心中诞生。就在玫瑰树最高的枝头，一朵不可思议的花慢慢绽开。歌声一曲接着一曲，花瓣也一片接着一片。起初，花的颜色十分苍白，像笼在河面上的雾，像清晨踏来的双足，又闪着黎明翅膀上的银光。看上去，它仿佛一朵玫瑰映在银镜里的影子，也像落在水潭中的倒影。
        - id: ch03-b09
          speaker: rose_tree
          text: “再贴近一点，小夜莺！否则天亮以前，这朵花就长不成了。”
        - id: ch03-b10
          speaker: narrator
          text: 夜莺照它的话去做，让胸口离尖刺更近。她唱得越来越响，唱的是炽热的爱情怎样在一个男人和一个少女的灵魂中生出来。玫瑰的花瓣上渐渐浮起一层柔嫩的粉红，正像新郎吻上新娘的嘴唇时，脸上泛起的红晕。可是尖刺还没有碰到她的心，玫瑰的花心仍然雪白。因为世上只有夜莺的心血，才能把一朵玫瑰的心染红。
        - id: ch03-b11
          speaker: rose_tree
          text: “再靠近些，小夜莺！不然白昼会先到来，玫瑰就来不及长成了。”
        - id: ch03-b12
          speaker: narrator
          text: 夜莺再次用力压向尖刺。这一回，刺尖终于碰到了她的心，一阵猛烈的疼痛霎时穿透全身。那痛楚如此尖锐，又如此残酷，她的歌声却越来越狂放。她歌唱被死亡成全的爱情，也歌唱那份进了坟墓仍不会死去的爱情。
        - id: ch03-b13
          speaker: narrator
          text: 那朵奇妙的玫瑰终于变成深红，像东方天空盛开的一朵红玫瑰。围成花冠的层层花瓣全都红了，中央的花心也红得像一颗宝石。夜莺的声音却越来越微弱，小小的翅膀开始扑动，眼前渐渐蒙起一层薄雾。她觉得有什么堵在喉咙里，叫她再也唱不出来。
        - id: ch03-b14
          speaker: narrator
          text: 就在这时，她用最后的力气，让歌声再一次冲向天空。白月亮听见后，竟忘了黎明将至，仍停在天上不肯离开。红玫瑰也听见了，它欢喜得浑身战栗，朝清冷的晨风打开花瓣。回声带着歌飞进山中紫色的洞穴，把睡梦里的牧人唤醒。歌声又飘过河边的芦苇，芦苇接过它的消息，一路传给大海。
        - id: ch03-b15
          speaker: rose_tree
          text: “快看，快看！玫瑰已经长成了！”
          emotion: happy
        - id: ch03-b16
          speaker: narrator
          text: 夜莺没有回答。她已经死去，躺在长长的草丛里，尖刺还扎在心上。
    - id: ch04
      title: 被丢弃的玫瑰
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 到了中午，学生打开窗户，一眼便看见了那朵花。
        - id: ch04-b02
          speaker: student
          text: “我的运气真不错！这里居然有一朵红玫瑰。我从没见过这么美的花，它一定有个长长的拉丁学名。”
          emotion: surprised
        - id: ch04-b03
          speaker: narrator
          text: 他俯下身，把玫瑰从枝头摘了下来。随后，他戴好帽子，手里紧握着花，一路跑到教授家。教授的女儿正坐在门口，慢慢把蓝色丝线缠到线轴上。她的小狗安安静静地伏在脚边。
        - id: ch04-b04
          speaker: student
          text: “你说过，我若送来红玫瑰，你就跟我跳舞。瞧，这一定是全世界最红的玫瑰。今晚把它佩在心口吧。等我们共舞时，它会告诉你，我有多爱你。”
        - id: ch04-b05
          speaker: narrator
          text: 姑娘却皱起眉头。
        - id: ch04-b06
          speaker: professor_daughter
          text: “它恐怕配不上我的裙子。何况宫廷大臣的侄子送了我真正的珠宝。谁都知道，珠宝比花贵重得多。”
        - id: ch04-b07
          speaker: student
          text: “说句实话，你真是不知感恩！”
          emotion: angry
        - id: ch04-b08
          speaker: narrator
          text: 学生听完怒气冲冲，一把将玫瑰扔到街上。那朵用夜莺生命换来的花掉进路旁的阴沟里，紧接着，一辆马车驶过，车轮从它上面重重碾了过去。
        - id: ch04-b09
          speaker: professor_daughter
          text: “你还敢说我不知感恩？我看你才无礼。再说，你不过是个学生，有什么了不起？你鞋上连银搭扣都没有，怎么能跟宫廷大臣的侄子相比？”
          emotion: angry
        - id: ch04-b10
          speaker: narrator
          text: 姑娘说完，便从椅子上站起来，头也不回地走进屋里。学生独自留在门外，只好转过身，沿原路离开。
        - id: ch04-b11
          speaker: student
          text: “爱情真愚蠢，连逻辑一半的用处都没有。逻辑至少能证明事情，爱情却什么也证明不了。它总拿那些不会发生的事哄人，又让人去相信根本不真实的话。说到底，爱情一点也不实际。而我们这个时代，最要紧的就是实际。我还是回去研究哲学，好好钻研形而上学吧。”
        - id: ch04-b12
          speaker: narrator
          text: 他回到自己的房间，抽出一本落满灰尘的厚书，把书翻开，开始一页一页读下去。
