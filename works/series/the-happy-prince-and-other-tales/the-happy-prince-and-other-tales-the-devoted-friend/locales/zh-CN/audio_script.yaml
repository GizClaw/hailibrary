  chapters:
    - id: ch01
      title: 池塘边的故事
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            一天早晨，老水鼠从洞口探出了脑袋。他的眼睛像两颗亮珠子，灰胡须硬邦邦的，长尾巴像一条黑橡胶。池塘里，一群小鸭正在游水，黄灿灿的，仿佛一群金丝雀。雪白的鸭妈妈有两条鲜红的腿，这会儿正忙着教孩子们在水里倒立。
        - id: ch01-b02
          speaker: duck
          text: >-
            你们得学会倒立，不然以后可进不了上流社会。
        - id: ch01-b03
          speaker: narrator
          text: >-
            她说了一遍又一遍，还隔一会儿就亲自钻进水里示范。小鸭子们却谁也不理她，只顾自己游来游去。它们年纪实在太小，哪里知道上流社会有什么好处。
        - id: ch01-b04
          speaker: water_rat
          text: >-
            这些孩子真不听话！照我看，它们活该淹死。
        - id: ch01-b05
          speaker: duck
          text: >-
            哪有这样的事。凡事都得学，做父母的怎么耐心也不算多。
        - id: ch01-b06
          speaker: water_rat
          text: >-
            我可不懂父母是什么心情。我不是个有家室的人，从来没结过婚，以后也永远不想结。爱情当然有爱情的用处，可友谊比它高尚得多。说真的，世上再也找不到什么东西，能比忠实的友谊更高贵、更稀有了。
        - id: ch01-b07
          speaker: narrator
          text: >-
            一只朱顶雀停在附近的柳树上，把这番话全听见了。
        - id: ch01-b08
          speaker: linnet
          text: >-
            那么，一个忠实的朋友究竟该做些什么呢？
        - id: ch01-b09
          speaker: duck
          text: >-
            对，我也很想听听。
        - id: ch01-b10
          speaker: narrator
          text: >-
            鸭妈妈一面说，一面游到池塘另一头，又在水里倒立起来，好给孩子们做个榜样。
        - id: ch01-b11
          speaker: water_rat
          text: >-
            这是什么傻问题？忠实的朋友当然应该一心一意对我好，不然还能怎样？
        - id: ch01-b12
          speaker: linnet
          text: >-
            那你会怎样回报他呢？
        - id: ch01-b13
          speaker: narrator
          text: >-
            小鸟站在一根银亮的细柳枝上，随着枝条轻轻摇荡，还拍了拍小小的翅膀。
        - id: ch01-b14
          speaker: water_rat
          text: >-
            你这话我听不明白。
        - id: ch01-b15
          speaker: linnet
          text: >-
            那我讲一个关于友谊的故事吧。
        - id: ch01-b16
          speaker: water_rat
          text: >-
            故事讲的是我吗？要是这样，我倒愿意听。我最爱听虚构的故事了。
        - id: ch01-b17
          speaker: linnet
          text: >-
            这个故事放在你身上，正合适。
        - id: ch01-b18
          speaker: narrator
          text: >-
            朱顶雀从树上飞下来，落在池塘岸边，讲起了《忠实的朋友》。从前有个诚实的小伙子，名叫汉斯。
        - id: ch01-b19
          speaker: water_rat
          text: >-
            他是个大人物吗？
        - id: ch01-b20
          speaker: linnet
          text: >-
            不是。他唯一出众的地方，大概就是心地善良，还有一张圆圆的、总是和和气气的脸。
        - id: ch01-b21
          speaker: narrator
          text: >-
            汉斯独自住在一间小茅屋里，每天都在花园中劳作。附近没有哪座花园比他的更美。美国石竹、紫罗兰、荠菜花和“法国美人”开在园中。大马士革玫瑰和黄玫瑰挨着淡紫色番红花，香堇菜则有金色、紫色和白色。耧斗菜谢了，草甸碎米荠又开。接着轮到墨角兰、野罗勒、报春花、鸢尾、水仙和丁香石竹。月份一换，花也一茬接一茬，园里总有美景可看，总有清香可闻。
        - id: ch01-b22
          speaker: narrator
          text: >-
            小汉斯朋友很多，其中最忠实的，是富有而高大的磨坊主休。休每次从花园外经过，都要探过墙头摘一大束花，或者抓走一把香草。若是李子和樱桃熟了，他还会装满两个口袋。
        - id: ch01-b23
          speaker: miller
          text: >-
            真正的朋友，什么东西都该一起分享。
        - id: ch01-b24
          speaker: narrator
          text: >-
            每逢听见这话，小汉斯便笑着点头。朋友能有这样高尚的想法，他觉得特别光荣。邻居却难免奇怪。磨坊主那么富有，为什么从来不回赠汉斯一点东西呢？他的磨坊里存着整整一百袋面粉，牛棚里有六头能产奶的牛，田野上还有一大群毛茸茸的绵羊。汉斯倒从不费心想这些。他最快乐的时候，正是听休讲真正的友谊应当多么无私。
        - id: ch01-b25
          speaker: narrator
          text: >-
            汉斯一直在花园里勤勤恳恳。春、夏、秋三季，他过得很快乐。冬天一来，既没有花，也没有水果可卖，他便又冷又饿。有时晚饭只吃几只干梨或几颗硬果仁，有时什么也没有，只能空着肚子睡觉。冬天的汉斯也十分寂寞，因为磨坊主一次都不会来看他。
        - id: ch01-b26
          speaker: miller
          text: >-
            只要雪还在，我就不该去看小汉斯。人倒霉的时候需要清静，访客只会打扰他。这就是我对友谊的看法，我肯定没错。等到春天，我再去看他。那时，他可以送我满满一篮报春花，该有多高兴啊。
        - id: ch01-b27
          speaker: millers_wife
          text: >-
            你想别人想得真周到。听你谈友谊，简直是一种享受。连牧师都说不出这么美的话呢，虽然他住着三层楼，小指上还戴着金戒指。
        - id: ch01-b28
          speaker: narrator
          text: >-
            她舒舒服服地坐在宽大的扶手椅里，面前烧着旺旺的松木火，屋里又暖又安逸。
        - id: ch01-b29
          speaker: millers_son
          text: >-
            那我们为什么不请小汉斯来呢？要是他没有吃的，我可以分一半麦片粥给他，还能让他看看我的白兔子。
        - id: ch01-b30
          speaker: miller
          text: >-
            你这傻孩子，我真不懂送你上学有什么用，你看来什么也没有学会。汉斯若看见我们的炉火这么暖，晚饭这么好，还有一大桶红酒，也许就会嫉妒。嫉妒是最可怕的东西，会毁掉任何人的性情。我是他最好的朋友，当然要一直照管他，不能让他受到这种诱惑。再说，他来了，没准会向我赊面粉，这一点我绝不能答应。面粉和友谊是两回事，绝不能混在一起。它们连拼法都不同，意思自然也不一样，谁都看得出来。
        - id: ch01-b31
          speaker: millers_wife
          text: >-
            你讲得真好。我听得都困了，就像坐在教堂里一样。
        - id: ch01-b32
          speaker: narrator
          text: >-
            她一边说，一边给自己倒了一大杯热啤酒。
        - id: ch01-b33
          speaker: miller
          text: >-
            做得好的人很多，可真正说得好的人少得很。这就说明两件事当中，说要比做困难得多，自然也高明得多。
        - id: ch01-b34
          speaker: narrator
          text: >-
            磨坊主隔着桌子，严厉地瞪了小儿子一眼。孩子顿时羞得低下脑袋，脸涨得通红，眼泪一颗颗落进茶杯里。不过，他毕竟还小，我们就原谅他吧。
        - id: ch01-b35
          speaker: water_rat
          text: >-
            故事到这里就完了吗？
        - id: ch01-b36
          speaker: linnet
          text: >-
            怎么会？这还只是开头。
        - id: ch01-b37
          speaker: water_rat
          text: >-
            那你已经落伍啦。如今好的故事家都先说结尾，再说开头，最后才说中间。这叫新式讲法。前几天有个批评家带着一位年轻人绕池塘散步，我听他讲了好久。他戴蓝眼镜，又是个秃头，肯定不会错。年轻人每开一次口，他就回答一声“呸！”你继续吧，我太喜欢磨坊主了。我也有许多美好的情操，我们很合得来。
    - id: ch02
      title: 一辆还没送出的独轮车
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            朱顶雀一会儿用这只脚站着，一会儿又换成另一只脚，继续往下讲。冬天刚刚过去，报春花才绽开一朵朵淡黄的小星星，磨坊主便告诉妻子，自己该下山看看小汉斯了。
        - id: ch02-b02
          speaker: millers_wife
          text: >-
            你的心肠可真好，总是惦记着别人。记得带那只大篮子去装花。
        - id: ch02-b03
          speaker: narrator
          text: >-
            磨坊主先拿一条结实的铁链，把风车的几片翼叶牢牢锁在一起。随后，他把大篮子挎在胳膊上，沿着山路来到汉斯的花园。
        - id: ch02-b04
          speaker: miller
          text: >-
            早上好啊，小汉斯。
        - id: ch02-b05
          speaker: narrator
          text: >-
            汉斯靠着铁锹，笑得嘴都合不上。
        - id: ch02-b06
          speaker: hans
          text: >-
            早上好！
        - id: ch02-b07
          speaker: miller
          text: >-
            这个冬天，你过得怎么样？
        - id: ch02-b08
          speaker: hans
          text: >-
            你特地问起我，真好！冬天确实很难熬，不过春天到了，我现在开心极了，花儿也全都长得不错。
        - id: ch02-b09
          speaker: miller
          text: >-
            冬天里我们经常谈到你，也常猜想你过得好不好。
        - id: ch02-b10
          speaker: hans
          text: >-
            你们真有心。我还担心你们把我忘了呢。
        - id: ch02-b11
          speaker: miller
          text: >-
            汉斯，这话太让我吃惊了。友谊从来不会遗忘，它的奇妙就在这里。恐怕你还不明白生活中的诗意。对了，你的报春花开得真漂亮。
        - id: ch02-b12
          speaker: hans
          text: >-
            是啊，多亏我有这么多。我准备拿到市场上卖给市长的女儿，再用卖花的钱赎回独轮车。
        - id: ch02-b13
          speaker: miller
          text: >-
            赎回独轮车？难道你竟把它卖了？这可太蠢了。
        - id: ch02-b14
          speaker: hans
          text: >-
            我实在没办法。冬天太难过，我连面包也买不起。先是礼拜日外套上的银纽扣，后来是银表链，再后来是大烟斗，最后只好把独轮车也卖掉。现在有花可卖了，我会把它们一件件赎回来。
        - id: ch02-b15
          speaker: miller
          text: >-
            汉斯，我把自己的独轮车送给你。它确实不太好，一边已经掉了，轮辐也坏了。不过，我还是愿意送给你。别人也许会笑我太傻，可我和他们不一样。慷慨是友谊的根本，何况我已经有了新车。你不用担心，这辆旧车就是你的了。
        - id: ch02-b16
          speaker: hans
          text: >-
            你真慷慨！我屋里正好有块木板，修这辆车一定不难。
        - id: ch02-b17
          speaker: narrator
          text: >-
            听见这份许诺，汉斯那张逗人的圆脸顿时亮了起来，满脸都是欢喜。
        - id: ch02-b18
          speaker: miller
          text: >-
            你有木板？我的谷仓屋顶正缺一块呢！那里破了个大洞，再不堵上，谷物都会受潮。幸好你提起它。一件善事果然会带来另一件善事。我送你独轮车，你把木板送给我。虽说独轮车比木板值钱得多，真正的友谊可不计较这些。快去拿来吧，我今天就修屋顶。
        - id: ch02-b19
          speaker: hans
          text: >-
            好，我这就去！
        - id: ch02-b20
          speaker: narrator
          text: >-
            汉斯一口答应下来，马上跑进棚屋，使劲把那块木板拖到外面。磨坊主把木板从头到尾打量了一番。
        - id: ch02-b21
          speaker: miller
          text: >-
            这块板不算大。我修完谷仓以后，恐怕不会剩下木料给你修车了。当然，这可不能怪我。现在，我既然送了你一辆独轮车，你也一定愿意回赠我一些花。篮子给你，要装得满满的。
        - id: ch02-b22
          speaker: hans
          text: >-
            要装满整只篮子吗？
        - id: ch02-b23
          speaker: narrator
          text: >-
            汉斯难过起来。篮子那么大，要是装满，市场上就没有花可卖了，他还盼着赎回银纽扣呢。
        - id: ch02-b24
          speaker: miller
          text: >-
            我连独轮车都送给你了，只要几朵花，难道还算多吗？也许是我想错了。不过在我看来，真正的友谊不该带一丁点儿私心。
        - id: ch02-b25
          speaker: hans
          text: >-
            我最亲爱的朋友，也是我最好的朋友，园里的花你全都可以拿走。不论到什么时候，我都宁可得到你的赞许，也不要那些银纽扣。
        - id: ch02-b26
          speaker: narrator
          text: >-
            汉斯跑遍花园，把自己那些美丽的报春花全都摘了下来，直到大篮子装得满满当当。磨坊主把木板扛在肩上，另一只手提起沉甸甸的花篮，转身朝山上走去。
        - id: ch02-b27
          speaker: miller
          text: >-
            再见，小汉斯。
        - id: ch02-b28
          speaker: hans
          text: >-
            再见！
        - id: ch02-b29
          speaker: narrator
          text: >-
            汉斯留在空了许多的花园里。可他一想到磨坊主许下的那辆独轮车，心里还是高兴极了，拿起铁锹快快活活地挖起土来。
    - id: ch03
      title: 友谊的实践
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            第二天，汉斯正站在梯子上，把忍冬藤钉到门廊边。磨坊主忽然在路上喊他。他赶紧跳下来，跑过花园，从墙头望出去。磨坊主背上驮着一大袋面粉。
        - id: ch03-b02
          speaker: miller
          text: >-
            亲爱的小汉斯，能不能替我把这袋面粉送到市场？
        - id: ch03-b03
          speaker: hans
          text: >-
            真对不起，我今天忙得很。藤蔓都要钉起来，花都要浇，草地也等着滚平呢。
        - id: ch03-b04
          speaker: miller
          text: >-
            可我就要把独轮车送给你了。现在你拒绝帮忙，我觉得不太像朋友该做的事。
        - id: ch03-b05
          speaker: hans
          text: >-
            别这样说！无论如何，我也不能做一个不够朋友的人。
        - id: ch03-b06
          speaker: narrator
          text: >-
            汉斯跑回屋拿来帽子，把又大又沉的面粉袋扛上肩，拖着脚步往市场走去。那一天天气热得厉害，道路上的尘土也十分呛人。太阳晒着那袋沉重的面粉，汉斯每走一步都很吃力。他还没走过第六块里程碑，就累得再也走不动，只得坐下来歇息。可他仍旧鼓起勇气，再次扛起袋子赶路，最后总算到了市场。汉斯在那里等了好一阵，才把面粉卖出一个很好的价钱。他拿好钱，立刻往家里赶，生怕回去得太迟，会在路上遇见强盗。
        - id: ch03-b07
          speaker: hans
          text: >-
            今天实在太辛苦了。不过，我很高兴自己没有拒绝磨坊主。他是我最好的朋友，而且还答应把独轮车送给我呢。
        - id: ch03-b08
          speaker: narrator
          text: >-
            第二天一早，磨坊主来拿卖面粉的钱。汉斯实在太疲倦，还躺在床上。
        - id: ch03-b09
          speaker: miller
          text: >-
            你也太懒了吧！我都打算把独轮车送给你，你难道不该更勤快一点？懒惰是大罪，我不喜欢朋友懒散度日。我说得直，你可别介意。若不是你的朋友，我也不会对你讲这些。朋友之间若不能说真话，友谊还有什么用？好听的话谁都会讲，讨好奉承也容易。真正的朋友偏要说不中听的，哪怕对方难受也不怕。他甚至宁愿这么做，因为他知道，这是为了朋友好。
        - id: ch03-b10
          speaker: hans
          text: >-
            对不起，我只是太累了，想在床上多躺一会儿，听听鸟儿唱歌。我每次听过鸟叫，干活都会更有精神。
        - id: ch03-b11
          speaker: narrator
          text: >-
            汉斯揉揉眼睛，摘下了睡帽。磨坊主在他背上拍了拍。
        - id: ch03-b12
          speaker: miller
          text: >-
            那就好。等你穿好衣服，马上到磨坊去，帮我补谷仓屋顶。
        - id: ch03-b13
          speaker: narrator
          text: >-
            可怜的汉斯实在很想照料自己的花园。他的花已经整整两天没喝到一滴水了，再耽搁下去，不知会变成什么样。可休是他那么要好的朋友，他实在不好意思开口推辞。
        - id: ch03-b14
          speaker: hans
          text: >-
            要是我说今天很忙，你会不会觉得我不够朋友？
        - id: ch03-b15
          speaker: narrator
          text: >-
            他的声音既羞怯，又胆怯。
        - id: ch03-b16
          speaker: miller
          text: >-
            我都要送你独轮车了，这点要求应该不算过分。不过，你要是不肯去，我自己做也行。
        - id: ch03-b17
          speaker: hans
          text: >-
            不，不，那可绝对不行！
        - id: ch03-b18
          speaker: narrator
          text: >-
            汉斯一听，立刻跳下床，匆匆穿好衣服，赶到磨坊主的谷仓。他爬上屋顶，从早到晚不停地修补，一直干到太阳落山。傍晚，磨坊主终于过来，看看事情做得怎么样了。
        - id: ch03-b19
          speaker: miller
          text: >-
            小汉斯，屋顶的洞补完了吗？
        - id: ch03-b20
          speaker: narrator
          text: >-
            他的声音听起来十分愉快。汉斯从梯子上爬了下来。
        - id: ch03-b21
          speaker: hans
          text: >-
            已经全补好了。
        - id: ch03-b22
          speaker: miller
          text: >-
            啊，世上再没有哪一种工作，能比替别人做事更叫人快乐了。
        - id: ch03-b23
          speaker: hans
          text: >-
            能听你讲这些道理，我真有福气。只是，我怕自己永远想不出这么好的念头。
        - id: ch03-b24
          speaker: narrator
          text: >-
            汉斯坐下来，擦了擦额头。
        - id: ch03-b25
          speaker: miller
          text: >-
            以后会有的，不过你得多下功夫。现在，你只会实践友谊，将来还要学会友谊的理论。
        - id: ch03-b26
          speaker: hans
          text: >-
            你真的觉得我能学会吗？
        - id: ch03-b27
          speaker: miller
          text: >-
            我一点也不怀疑。屋顶既然补好了，你就回家休息吧。明天还得替我把羊群赶到山上。
        - id: ch03-b28
          speaker: narrator
          text: >-
            汉斯听完这话，害怕得不敢再说什么。第二天一大早，磨坊主果然把羊群赶到了他的茅屋前。汉斯只好领着羊群一路上山，光是走到山上再赶回来，就花掉了整整一天。回到家时，他累得连床也走不到，一坐进椅子就睡着了，直到第二天天光大亮才醒来。
        - id: ch03-b29
          speaker: hans
          text: >-
            今天总算能好好照料我的花园了！
        - id: ch03-b30
          speaker: narrator
          text: >-
            他一醒来就这样说，也马上动手干活。可是，汉斯不知怎么总也顾不上那些花。磨坊主一次次上门，不是打发他到很远的地方办事，就是把他叫到磨坊帮工。汉斯有时苦恼极了，他真怕花儿会以为自己把它们忘得干干净净。但他转念一想，休毕竟是自己最好的朋友，便又想办法安慰自己。
        - id: ch03-b31
          speaker: hans
          text: >-
            再说，他还会把独轮车送给我。这才是真正无私的慷慨。
        - id: ch03-b32
          speaker: narrator
          text: >-
            于是，汉斯就这样一天又一天地替磨坊主干活。磨坊主也说出种种关于友谊的漂亮道理。汉斯舍不得忘记任何一句，便把它们全都记进一本小册子里，到了晚上还要拿出来反复读，因为他是个十分用功的人。
    - id: ch04
      title: 风暴之夜
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            有一天晚上，汉斯独自坐在炉火旁，门上忽然传来一阵猛烈的敲击声。外面正是个风狂雨骤的夜晚，狂风绕着小屋呼啸怒吼，他起初还以为那不过是暴风发出的响声。可是门又响了第二次，随后是第三次，而且这一回比先前两次都要响。
        - id: ch04-b02
          speaker: hans
          text: >-
            一定是哪位可怜的过路人。
        - id: ch04-b03
          speaker: narrator
          text: >-
            汉斯赶忙开门。磨坊主站在外面，一手提着灯笼，另一手握着粗木棍。
        - id: ch04-b04
          speaker: miller
          text: >-
            亲爱的小汉斯，我碰上大麻烦了。我的小儿子从梯子上摔下来，受了伤，我得请医生。医生住得太远，今晚又这么糟，我刚想到，还是你替我去更合适。我要把独轮车送给你，你为我做件事作为回报，也是应该的。
        - id: ch04-b05
          speaker: hans
          text: >-
            当然，我马上出发。你遇到事情肯来找我，我觉得很荣幸。不过，能不能把灯笼借给我？外面太黑，我怕掉进路沟。
        - id: ch04-b06
          speaker: miller
          text: >-
            实在对不住，这是我的新灯笼。它要是出了什么事，我会损失很大。
        - id: ch04-b07
          speaker: hans
          text: >-
            没关系，没有灯笼我也能去。
        - id: ch04-b08
          speaker: narrator
          text: >-
            汉斯从墙上取下厚厚的毛皮大衣，戴上暖和的鲜红帽子，再把围巾紧紧围住脖子，独自走进暴风雨。那一夜实在可怕。夜色黑得让他几乎什么也看不见，风又强得让他连身子都站不稳。汉斯却十分勇敢，一步也没有退缩。顶着风雨走了大约三个小时，他终于摸到医生家门口，抬手敲响了门。
        - id: ch04-b09
          speaker: doctor
          text: >-
            外面是谁？
        - id: ch04-b10
          speaker: narrator
          text: >-
            医生从卧室窗口探出头来。
        - id: ch04-b11
          speaker: hans
          text: >-
            医生，是我，小汉斯。
        - id: ch04-b12
          speaker: doctor
          text: >-
            小汉斯，这么晚来做什么？
        - id: ch04-b13
          speaker: hans
          text: >-
            磨坊主的儿子从梯子上摔下来，伤着了。磨坊主请你立刻过去。
        - id: ch04-b14
          speaker: doctor
          text: >-
            好，我这就去！
        - id: ch04-b15
          speaker: narrator
          text: >-
            医生立刻吩咐人备好马匹，又叫人拿来他的高筒靴和灯笼。他穿戴妥当，走下楼，骑上马朝磨坊主家赶去。灯笼跟着马匹向前移动，小汉斯只能徒步跟在后面，一步一步地走。
        - id: ch04-b16
          speaker: narrator
          text: >-
            风暴越来越凶，大雨像从天上整盆整盆地倒下来。汉斯根本看不清自己往哪里走，也渐渐追不上医生的马。最后，他彻底迷了路，误入一片荒原。那里遍布很深的坑，是个非常危险的地方。可怜的小汉斯就这样落进水中，淹死了。
        - id: ch04-b17
          speaker: narrator
          text: >-
            第二天，几个牧羊人在一大片积水里发现了汉斯的尸体。尸体正漂在水面上，他们便把他送回那间小茅屋。汉斯一向很受大家喜爱，所以所有人都来参加他的葬礼。磨坊主则成了送葬队伍里最显眼、地位最高的哀悼者。
        - id: ch04-b18
          speaker: miller
          text: >-
            我是汉斯最好的朋友，最重要的位置当然应该留给我。
        - id: ch04-b19
          speaker: narrator
          text: >-
            他披着一件长长的黑斗篷，走在整个送葬队伍的最前头。一路上，他每隔一会儿便拿出一块大手帕，在眼睛上擦一擦。葬礼结束后，大家来到小客栈，舒舒服服地坐下，一边喝热腾腾的香料酒，一边吃甜糕饼。
        - id: ch04-b20
          speaker: blacksmith
          text: >-
            小汉斯走了，对每个人都是很大的损失。
          emotion: sad
        - id: ch04-b21
          speaker: miller
          text: >-
            对我尤其是这样。我差不多已经把独轮车送给他了，如今真不知道怎么处理。放在家里碍手碍脚，车又破得不成样子，卖也卖不出价钱。以后我一定不会再把东西送人。一个人只要慷慨，最后吃苦的总是自己。
    - id: ch05
      title: 寓意
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: >-
            朱顶雀说完以后，池塘边安静了很久。
        - id: ch05-b02
          speaker: water_rat
          text: >-
            后来呢？
        - id: ch05-b03
          speaker: linnet
          text: >-
            没有后来，故事已经讲完了。
        - id: ch05-b04
          speaker: water_rat
          text: >-
            那磨坊主最后怎么样了？
        - id: ch05-b05
          speaker: linnet
          text: >-
            我不知道，而且我一点也不关心。
        - id: ch05-b06
          speaker: water_rat
          text: >-
            这么看来，你根本没有同情心。
        - id: ch05-b07
          speaker: linnet
          text: >-
            恐怕你没听懂这个故事的寓意。
        - id: ch05-b08
          speaker: water_rat
          text: >-
            什么东西？
        - id: ch05-b09
          speaker: linnet
          text: >-
            我说的是寓意。
        - id: ch05-b10
          speaker: water_rat
          text: >-
            你的故事居然还有寓意？
        - id: ch05-b11
          speaker: linnet
          text: >-
            当然有。
        - id: ch05-b12
          speaker: water_rat
          text: >-
            那你一开始就该告诉我！早知道有寓意，我根本不会听。我会学那个批评家，先对你说一声“呸！”不过，现在说也来得及。呸！
          emotion: angry
        - id: ch05-b13
          speaker: narrator
          text: >-
            水鼠扯开嗓门，那声“呸”喊得震天响。他猛地把长尾巴一甩，转身钻回自己的洞里。又过了几分钟，鸭妈妈才从池塘那头划着水游了过来。
        - id: ch05-b14
          speaker: duck
          text: >-
            你觉得水鼠怎么样？他倒有不少优点。可是我有做母亲的心肠，一看见那种铁了心不结婚的单身汉，眼泪就忍不住往下掉。
        - id: ch05-b15
          speaker: linnet
          text: >-
            我好像惹他生气了。其实，我不过是给他讲了个有寓意的故事。
        - id: ch05-b16
          speaker: duck
          text: >-
            啊，讲这种故事一向很危险。
        - id: ch05-b17
          speaker: narrator
          text: >-
            这一点，我完全赞同鸭妈妈。
