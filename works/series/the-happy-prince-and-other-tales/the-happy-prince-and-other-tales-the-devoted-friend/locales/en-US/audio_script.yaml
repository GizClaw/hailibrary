  chapters:
    - id: ch01
      title: A Story About Friendship
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: One morning, the old Water-rat poked his head out of his hole. His eyes were bright and beady, his gray whiskers stood stiff, and his tail looked like a long strip of black rubber. Little yellow ducks were swimming around the pond like canaries. Their mother was pure white, with real red legs, and she was trying to teach them to stand on their heads in the water.
        - id: ch01-b02
          speaker: duck
          text: If you cannot stand on your heads, you will never belong in the best society.
        - id: ch01-b03
          speaker: narrator
          text: She kept saying this and showing them how. But the ducklings paid no attention. They were far too young to understand why society might matter.
        - id: ch01-b04
          speaker: water_rat
          text: What disobedient children! They deserve to be drowned.
          emotion: angry
        - id: ch01-b05
          speaker: duck
          text: Nonsense. Everyone has to begin somewhere, and parents can never be too patient.
        - id: ch01-b06
          speaker: water_rat
          text: I know nothing about a parent's feelings. I am not a family man. I have never married, and I never mean to. Love is all very well, but friendship stands much higher. Nothing in the world is nobler or rarer than a devoted friendship.
        - id: ch01-b07
          speaker: narrator
          text: A Green Linnet sat in a willow tree close by. He had heard the whole conversation.
        - id: ch01-b08
          speaker: linnet
          text: And what do you think a devoted friend ought to do?
        - id: ch01-b09
          speaker: duck
          text: Yes, I would like to know that too.
        - id: ch01-b10
          speaker: narrator
          text: The Duck swam to the far end of the pond and stood on her head, to set her children a good example.
        - id: ch01-b11
          speaker: water_rat
          text: What a foolish question! Naturally, I expect my devoted friend to be devoted to me.
        - id: ch01-b12
          speaker: narrator
          text: The little bird swung on a silver branch and fluttered his tiny wings.
        - id: ch01-b13
          speaker: linnet
          text: But what would you do for your friend?
        - id: ch01-b14
          speaker: water_rat
          text: I do not understand what you mean.
        - id: ch01-b15
          speaker: linnet
          text: Then let me tell you a story about it.
        - id: ch01-b16
          speaker: water_rat
          text: Is the story about me? If it is, I will listen. I am extremely fond of fiction.
        - id: ch01-b17
          speaker: linnet
          text: It certainly applies to you.
        - id: ch01-b18
          speaker: narrator
          text: The Linnet flew down to the bank and began the story of the Devoted Friend.
        - id: ch01-b19
          speaker: linnet
          text: Once upon a time, there was an honest little fellow named Hans.
        - id: ch01-b20
          speaker: water_rat
          text: Was he an important person?
        - id: ch01-b21
          speaker: linnet
          text: No, not at all. The only remarkable things about him were his kind heart and his funny, round, cheerful face. He lived alone in a tiny cottage and worked in his garden every day.
        - id: ch01-b22
          speaker: narrator
          text: No other garden in the whole countryside was so lovely. Sweet-william, gillyflowers, shepherd's-purses, and fair-maids of France grew there. There were damask roses and yellow roses, lilac crocuses, and violets of gold, purple, and white. Columbine and ladysmock blossomed beside marjoram and wild basil. Cowslips, irises, daffodils, and clove-pinks all opened in their proper season. As the months passed, one kind of flower faded and another took its place. Hans's garden always held beautiful things to look at and pleasant scents to enjoy.
        - id: ch01-b23
          speaker: narrator
          text: Little Hans had many friends, but the most devoted was big Hugh the Miller. The Miller was rich. He never passed Hans's garden without leaning over the wall to pick a large bunch of flowers or a handful of herbs. When fruit was ripe, he filled his pockets with plums and cherries.
        - id: ch01-b24
          speaker: miller
          text: Real friends should share everything.
        - id: ch01-b25
          speaker: narrator
          text: Hans would nod and smile. He felt proud to have a friend with such noble ideas. The neighbors sometimes wondered why the rich Miller never gave Hans anything in return. After all, the Miller had a hundred sacks of flour in his mill, six milk cows, and a large flock of woolly sheep. Hans never worried about that. Nothing pleased him more than hearing the Miller's wonderful speeches about the unselfishness of true friendship.
    - id: ch02
      title: Winter at the Mill
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: Hans worked steadily in his garden. Through spring, summer, and autumn, he was very happy among his flowers and fruit trees. Then winter came. There were no flowers to cut and no fruit to carry to market, so Hans had nothing to sell. He suffered badly from cold and hunger. Many nights, his whole supper was a few dried pears or some hard nuts, and sometimes he had to go to bed with almost nothing. Winter was lonely as well. The Miller, who called himself Hans's most devoted friend, never once came down to see him while the snow lay on the ground.
        - id: ch02-b02
          speaker: miller
          text: There is no point in visiting little Hans while the snow is on the ground. People in trouble should be left alone, without visitors bothering them. That is my idea of friendship, and I am sure it is right. I will wait for spring. Then Hans can give me a large basket of primroses, and that will make him very happy.
        - id: ch02-b03
          speaker: narrator
          text: The Miller's Wife sat in a comfortable armchair beside a great pinewood fire.
        - id: ch02-b04
          speaker: millers_wife
          text: You are so thoughtful about other people. It is a treat to hear you speak about friendship. Even the clergyman could not say such beautiful things, though he lives in a three-story house and wears a gold ring on his little finger.
        - id: ch02-b05
          speaker: millers_son
          text: Could we ask little Hans to come here? If he is in trouble, I will give him half my porridge and show him my white rabbits.
        - id: ch02-b06
          speaker: miller
          text: What a foolish boy you are! I do not know why we send you to school. You seem to learn nothing. If Hans saw our warm fire, our good supper, and our great barrel of red wine, he might become envious. Envy ruins a person's nature. As his best friend, I must protect him from temptation. Besides, he might ask me for flour on credit, and I could never allow that. Flour is one thing and friendship is another. Even the words are spelled differently. Anyone can see they mean different things.
        - id: ch02-b07
          speaker: millers_wife
          text: How beautifully you talk! It makes me quite sleepy. It is just like being in church.
        - id: ch02-b08
          speaker: narrator
          text: She poured herself a large glass of warm ale.
        - id: ch02-b09
          speaker: miller
          text: Many people behave well, but very few can talk well. That proves talking is much harder, and much finer too.
        - id: ch02-b10
          speaker: narrator
          text: The Miller stared sternly across the table at his youngest son. The boy felt deeply ashamed of what he had suggested. He lowered his head, turned scarlet, and began to cry into his tea. Still, he was very young, so you must excuse him for wanting to share his porridge and rabbits with poor Hans.
        - id: ch02-b11
          speaker: water_rat
          text: Is that the end?
        - id: ch02-b12
          speaker: linnet
          text: Certainly not. That is only the beginning.
        - id: ch02-b13
          speaker: water_rat
          text: Then you are far behind the times. A good modern storyteller begins with the end, moves on to the beginning, and finishes in the middle. That is the new method. A critic told me all about it while he walked around this pond with a young man. He spoke for a very long time, so he must have been right. He wore blue spectacles and had a bald head, and whenever the young man said anything, the critic answered, “Pooh!” But please continue. I like the Miller immensely. I have beautiful sentiments myself, so he and I have a great deal in common.
    - id: ch03
      title: The Miller's Gift
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: The Linnet hopped from one leg to the other and went on with his tale. At last, winter ended. Snow melted from the countryside, and in Hans's garden the primroses began to open their pale yellow stars. As soon as those flowers appeared, the Miller told his wife that the time had come for him to walk down the hill and visit little Hans.
        - id: ch03-b02
          speaker: millers_wife
          text: What a good heart you have! You are always thinking of other people. Remember to take the big basket for the flowers.
        - id: ch03-b03
          speaker: narrator
          text: The Miller tied the windmill sails together with a strong iron chain. Then he went down the hill with the basket over his arm.
        - id: ch03-b04
          speaker: miller
          text: Good morning, little Hans. And how did you manage through the winter?
        - id: ch03-b05
          speaker: narrator
          text: Hans leaned on his spade and smiled from ear to ear.
        - id: ch03-b06
          speaker: hans
          text: It is very kind of you to ask. I had a rather hard time, I am afraid. But spring is here now, so I am happy again, and all my flowers are growing well.
        - id: ch03-b07
          speaker: miller
          text: We often spoke about you during the winter and wondered how you were doing.
        - id: ch03-b08
          speaker: hans
          text: That was kind. I was almost afraid you had forgotten me.
        - id: ch03-b09
          speaker: miller
          text: Hans, I am surprised at you! Friendship never forgets. That is what makes it so wonderful. I fear you do not understand the poetry of life. By the way, your primroses look lovely.
        - id: ch03-b10
          speaker: hans
          text: They really are lovely, and I am lucky to have so many. I mean to sell them to the Burgomaster's daughter at the market. Then I can buy back my wheelbarrow.
        - id: ch03-b11
          speaker: miller
          text: Buy it back? You sold your wheelbarrow? What a stupid thing to do!
        - id: ch03-b12
          speaker: hans
          text: I had no choice. Winter was very bad, and I had no money for bread. First I sold the silver buttons from my Sunday coat. Then I sold my silver chain, then my big pipe, and at last my wheelbarrow. But now I mean to buy them all back.
        - id: ch03-b13
          speaker: miller
          text: Hans, I will give you my wheelbarrow. It is not in good repair. One side is missing, and something is wrong with the spokes. Even so, I will give it to you. Many people would call me foolish for being so generous, but I am not like everyone else. Generosity is the very heart of friendship. Besides, I have bought myself a new wheelbarrow. So put your mind at ease. The old one is yours.
        - id: ch03-b14
          speaker: hans
          text: That truly is generous! I can repair it easily. I have a wooden plank in the house.
          emotion: happy
        - id: ch03-b15
          speaker: narrator
          text: Hans's round face shone with pleasure.
        - id: ch03-b16
          speaker: miller
          text: A wooden plank? That is exactly what I need for my barn roof. There is a large hole in it, and all my corn will get damp unless I cover it. How fortunate that you mentioned the plank! One good deed always leads to another. I am giving you my wheelbarrow, and now you will give me your plank. Of course, the wheelbarrow is worth much more, but true friendship never pays attention to such things. Fetch it at once, please. I will repair my barn today.
        - id: ch03-b17
          speaker: hans
          text: Of course I will!
        - id: ch03-b18
          speaker: narrator
          text: Hans ran into his shed and dragged out the plank. The Miller looked it over.
        - id: ch03-b19
          speaker: miller
          text: It is not a very large plank. Once I mend my barn, there may be nothing left for you to repair the wheelbarrow. But that is hardly my fault. And since I am giving you the wheelbarrow, I am sure you would like to give me flowers in return. Here is the basket. Be sure to fill it right to the top.
        - id: ch03-b20
          speaker: hans
          text: Fill it right to the top?
          emotion: sad
        - id: ch03-b21
          speaker: narrator
          text: Hans looked sorrowful. It was a very large basket. If he filled it, he would have no flowers left for market, and he badly wanted to buy back his silver buttons.
        - id: ch03-b22
          speaker: miller
          text: Since I have given you my wheelbarrow, a few flowers do not seem like much to ask. Perhaps I am mistaken, but I thought true friendship was free from every kind of selfishness.
        - id: ch03-b23
          speaker: hans
          text: My dear friend, my best friend, you may have every flower in my garden. I would rather keep your good opinion than get my silver buttons back.
        - id: ch03-b24
          speaker: narrator
          text: Hans ran through the garden and began picking. He gathered every one of his pretty primroses, though they were the flowers he had meant to sell. He kept filling the Miller's enormous basket until it was packed right to the top. Now there would be no primroses for the market and no money for the silver buttons.
        - id: ch03-b25
          speaker: miller
          text: Good-bye, little Hans.
        - id: ch03-b26
          speaker: narrator
          text: The Miller climbed the hill with the plank on his shoulder and the full basket in his hand.
        - id: ch03-b27
          speaker: hans
          text: Good-bye!
          emotion: happy
        - id: ch03-b28
          speaker: narrator
          text: Hans began digging merrily. He was so pleased about the wheelbarrow.
    - id: ch04
      title: The Work of Friendship
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: The next day, Hans was fastening honeysuckle to his porch when the Miller called from the road. Hans jumped down from his ladder, ran through the garden, and looked over the wall. The Miller stood there with a large sack of flour on his back.
        - id: ch04-b02
          speaker: miller
          text: Dear little Hans, would you carry this sack of flour to market for me?
        - id: ch04-b03
          speaker: hans
          text: I am very sorry, but I am terribly busy today. I must tie up all my climbing plants, water every flower, and roll all the grass.
        - id: ch04-b04
          speaker: miller
          text: Really, Hans, I am going to give you my wheelbarrow. It seems rather unfriendly of you to refuse me.
        - id: ch04-b05
          speaker: hans
          text: Oh, please do not say that! I would not be unfriendly for anything in the world.
        - id: ch04-b06
          speaker: narrator
          text: Hans forgot his own long list of work at once. He ran inside for his cap, lifted the big sack onto his shoulders, and trudged away toward the market. The sun beat down on him. The road was terribly dusty, and the flour weighed heavily on his back. Before Hans reached the sixth milestone, he was so tired that he had to put the sack down, sit beside the road, and rest. Even then, he did not turn back. He lifted the load again and went bravely on. At last, he reached the market. He waited there for quite some time before finding a buyer, but finally sold the Miller's flour for a very good price. Then Hans started home at once. He did not dare stay late, because he feared he might meet robbers on the road after dark.
        - id: ch04-b07
          speaker: hans
          text: That was certainly a hard day. Still, I am glad I did not refuse the Miller. He is my best friend, and he is going to give me his wheelbarrow.
        - id: ch04-b08
          speaker: narrator
          text: Early next morning, the Miller came to collect the money from the sale. Hans was so exhausted that he was still in bed.
        - id: ch04-b09
          speaker: miller
          text: Upon my word, you are very lazy! Since I am going to give you my wheelbarrow, you ought to work harder. Idleness is a terrible sin, and I do not want my friends to be idle or slow. You must forgive me for speaking plainly. I would never do it if I were not your friend. What use is friendship if a person cannot say exactly what he means? Anyone can say pleasant things and flatter you. A true friend says unpleasant things and does not mind causing pain. In fact, he prefers it, because he knows he is doing you good.
        - id: ch04-b10
          speaker: narrator
          text: Hans rubbed his eyes and pulled off his nightcap.
        - id: ch04-b11
          speaker: hans
          text: I am very sorry. I was so tired that I thought I would stay in bed for a little while and listen to the birds. I always work better after I hear them singing.
        - id: ch04-b12
          speaker: miller
          text: I am glad to hear it. As soon as you are dressed, come to the mill and mend my barn roof.
        - id: ch04-b13
          speaker: narrator
          text: The Miller clapped Hans on the back. Poor Hans badly wanted to work in his garden. His flowers had gone two days without water. But the Miller was such a good friend that Hans did not like to refuse him.
        - id: ch04-b14
          speaker: hans
          text: Would it be unfriendly if I said I was busy?
        - id: ch04-b15
          speaker: narrator
          text: His voice was shy and timid.
        - id: ch04-b16
          speaker: miller
          text: I do not think repairing my roof is much to ask when I am going to give you my wheelbarrow. Of course, if you refuse, I will do it myself.
        - id: ch04-b17
          speaker: hans
          text: Oh, no! I could never allow that.
        - id: ch04-b18
          speaker: narrator
          text: Hans jumped straight out of bed. He dressed as quickly as he could and went up to the Miller's barn, leaving his own thirsty flowers behind. The hole in the roof took the entire day to repair. Hans climbed, carried, fitted, and nailed until the sun was setting. Only then did the Miller come out to inspect how the work was going.
        - id: ch04-b19
          speaker: miller
          text: Have you repaired the hole yet, little Hans?
          emotion: happy
        - id: ch04-b20
          speaker: hans
          text: Yes, the roof is completely mended.
        - id: ch04-b21
          speaker: narrator
          text: Hans climbed down the ladder.
        - id: ch04-b22
          speaker: miller
          text: No work is so delightful as work done for someone else.
        - id: ch04-b23
          speaker: hans
          text: It is a great privilege to hear you talk. I am afraid I will never have such beautiful ideas.
        - id: ch04-b24
          speaker: narrator
          text: Hans sat down and wiped his forehead.
        - id: ch04-b25
          speaker: miller
          text: The ideas will come, but you must try harder. Right now, you only practice friendship. One day, you may understand the theory as well.
        - id: ch04-b26
          speaker: hans
          text: Do you truly think I will?
        - id: ch04-b27
          speaker: miller
          text: I have no doubt. Now that the roof is finished, you should go home and rest. Tomorrow, I want you to drive my sheep up the mountain.
        - id: ch04-b28
          speaker: narrator
          text: Hans was afraid to say anything about this new request. Early the next morning, the Miller brought his whole flock around to Hans's cottage. Hans set out with the sheep and drove them all the way up the mountain. Keeping the flock together on the outward road and bringing every sheep safely back took the entire day. When Hans finally reached home, he was too tired even to go properly to bed. He dropped into his chair, fell asleep there, and did not wake until broad daylight.
        - id: ch04-b29
          speaker: hans
          text: Now I will have a wonderful day in my garden!
          emotion: happy
        - id: ch04-b30
          speaker: narrator
          text: Hans hurried outside and began work at once. Yet the delightful day he had imagined never really came. Somehow, he was never able to look after his garden at all. Whenever he tried, the Miller appeared with another long errand or called Hans away to help with work at the mill. Hans sometimes felt very distressed as he watched his neglected garden. He was afraid his flowers would think he had forgotten them. Then he pushed the worry aside by reminding himself that the Miller was his best friend.
        - id: ch04-b31
          speaker: hans
          text: Besides, he is going to give me his wheelbarrow. That is pure generosity.
        - id: ch04-b32
          speaker: narrator
          text: So Hans went on working for the Miller instead of himself. While Hans carried loads, ran errands, and helped at the mill, the Miller went on saying all kinds of beautiful things about friendship. Hans carefully wrote those sayings in a notebook. At night, after the work was done, he read them over and tried to learn from them, because he was a very good student.
    - id: ch05
      title: The Night of the Storm
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: One evening, Hans was sitting beside his fire when someone knocked loudly at the door. It was a wild night. The wind roared around the cottage so fiercely that Hans first thought he had only heard the storm. Then came a second knock, and a third, louder than the others.
        - id: ch05-b02
          speaker: hans
          text: It must be some poor traveler.
        - id: ch05-b03
          speaker: narrator
          text: He hurried to the door. The Miller stood outside, holding a lantern in one hand and a large stick in the other.
        - id: ch05-b04
          speaker: miller
          text: Dear little Hans, I am in terrible trouble. My young son fell from a ladder and hurt himself. I must fetch the Doctor, but he lives far away and the night is dreadful. It occurred to me that it would be much better for you to go instead. Remember, I am going to give you my wheelbarrow. It is only fair that you should do something for me in return.
        - id: ch05-b05
          speaker: hans
          text: Of course I will go! I take it as a great compliment that you came to me. I will leave at once. But please lend me your lantern. The night is so dark that I am afraid I might fall into a ditch.
        - id: ch05-b06
          speaker: miller
          text: I am very sorry, but this is my new lantern. It would be a great loss if anything happened to it.
        - id: ch05-b07
          speaker: hans
          text: Never mind. I will manage without it.
        - id: ch05-b08
          speaker: narrator
          text: Hans took down his heavy fur coat and pulled it on. He put his warm scarlet cap on his head, wrapped a muffler tightly around his throat, and stepped into the storm without a light. What a dreadful night it was! Darkness covered the road so completely that Hans could barely see where to place his feet. The wind struck him so hard that he could hardly stand upright. Still, he was very courageous. He struggled forward through the roaring wind for about three hours. At last, cold and weary, he reached the Doctor's house and knocked at the door.
        - id: ch05-b09
          speaker: doctor
          text: Who is there?
        - id: ch05-b10
          speaker: narrator
          text: The Doctor put his head out of his bedroom window.
        - id: ch05-b11
          speaker: hans
          text: It is little Hans, Doctor.
        - id: ch05-b12
          speaker: doctor
          text: What do you need, little Hans?
        - id: ch05-b13
          speaker: hans
          text: The Miller's son fell from a ladder and hurt himself. The Miller wants you to come at once.
        - id: ch05-b14
          speaker: doctor
          text: All right, I will come!
        - id: ch05-b15
          speaker: narrator
          text: The Doctor immediately called for his horse, his tall boots, and his lantern. He came downstairs, mounted, and rode away toward the Miller's house. Little Hans followed on foot, trudging behind the horse as fast as he could. But the storm grew worse and worse. Rain poured down in torrents, hiding the road. Hans had no lantern of his own, so he could not see where he was going, and soon he could no longer keep pace with the Doctor's horse. At last, Hans lost the road altogether. He wandered out onto the moor, a dangerous place filled with deep holes hidden by darkness and rain. There, poor little Hans fell into deep water and drowned.
        - id: ch05-b16
          speaker: narrator
          text: Morning came after the storm, but Hans did not return to his cottage. Some goatherds crossed the moor that day and found his body floating in a great pool of water. They lifted poor Hans from the pool and carried him all the way back to the tiny cottage where he had once lived and tended his beautiful garden.
    - id: ch06
      title: The End of the Story
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: Everyone attended little Hans's funeral, because Hans had been popular throughout the countryside and everyone had liked him. The Miller declared himself the chief mourner and claimed the place of honor.
        - id: ch06-b02
          speaker: miller
          text: I was his best friend, so it is only fair that I should walk in the best place.
        - id: ch06-b03
          speaker: narrator
          text: The Miller walked at the very front of the funeral procession in a long black cloak. Every now and then, where everyone could see him, he wiped his eyes with a large pocket handkerchief. When the funeral was over, the mourners went to the inn. There they all sat comfortably together, drinking warm spiced wine and eating sweet cakes as they spoke about Hans.
        - id: ch06-b04
          speaker: blacksmith
          text: Little Hans is a great loss to everyone.
          emotion: sad
        - id: ch06-b05
          speaker: miller
          text: He is certainly a great loss to me. I had practically given him my wheelbarrow, and now I have no idea what to do with it. It gets in my way at home, but it is in such poor repair that nobody would pay for it. I will make sure never to give anything away again. A person always suffers for being generous.
        - id: ch06-b06
          speaker: narrator
          text: The Linnet finished speaking. For a long moment, the Water-rat said nothing.
        - id: ch06-b07
          speaker: water_rat
          text: What happens next?
        - id: ch06-b08
          speaker: linnet
          text: Well, that is the end.
        - id: ch06-b09
          speaker: water_rat
          text: But what happened to the Miller?
        - id: ch06-b10
          speaker: linnet
          text: I truly do not know, and I am sure I do not care.
        - id: ch06-b11
          speaker: water_rat
          text: Then you clearly have no sympathy in your nature.
        - id: ch06-b12
          speaker: linnet
          text: I am afraid you did not understand the moral of the story.
        - id: ch06-b13
          speaker: water_rat
          text: What did you say?
          emotion: surprised
        - id: ch06-b14
          speaker: linnet
          text: I said, the moral.
        - id: ch06-b15
          speaker: water_rat
          text: Are you saying that story had a moral?
          emotion: surprised
        - id: ch06-b16
          speaker: linnet
          text: Yes, it certainly did.
        - id: ch06-b17
          speaker: water_rat
          text: Then you should have warned me before you began! If you had, I would never have listened. I would have said, “Pooh!” just like the critic. But I can say it now. Pooh!
