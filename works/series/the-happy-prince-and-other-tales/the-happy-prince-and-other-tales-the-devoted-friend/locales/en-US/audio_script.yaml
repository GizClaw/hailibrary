        - id: ch06-b18
          speaker: narrator
          text: He shouted the last word at the top of his voice, whisked his tail, and disappeared into his hole. A few minutes later, the Duck paddled over.
        - id: ch06-b19
          speaker: duck
          text: What do you think of the Water-rat? He has many good qualities. Still, I have a mother's feelings, and the sight of a confirmed bachelor always brings tears to my eyes.
