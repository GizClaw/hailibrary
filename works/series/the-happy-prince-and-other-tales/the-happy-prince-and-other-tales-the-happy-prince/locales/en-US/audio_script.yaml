  chapters:
    - id: ch01
      title: The Statue and the Swallow
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: High above the city, on top of a tall column, stood the statue of the Happy Prince. Fine leaves of gold covered him from head to foot. Two bright sapphires formed his eyes, and a great red ruby shone from the hilt of his sword.
        - id: ch01-b02
          speaker: narrator
          text: Everyone admired him. One Town Councillor wanted people to think he had artistic taste, though he was careful to sound practical too.
        - id: ch01-b03
          speaker: town_councillor_1
          text: He is every bit as beautiful as a weathercock. Of course, he is not quite as useful.
        - id: ch01-b04
          speaker: narrator
          text: A sensible mother spoke to her little boy, who was crying because he could not have the moon.
        - id: ch01-b05
          speaker: mother
          text: Why can't you behave like the Happy Prince? He never cries because he wants something.
        - id: ch01-b06
          speaker: narrator
          text: A disappointed man stared up at the wonderful statue.
        - id: ch01-b07
          speaker: disappointed_man
          text: Well, at least someone in this world is perfectly happy.
        - id: ch01-b08
          speaker: narrator
          text: Children from the charity school came out of the cathedral in scarlet cloaks and clean white pinafores.
        - id: ch01-b09
          speakers: [charity_child_1, charity_child_2, charity_child_3]
          ensemble: chorus
          text: He looks just like an angel!
        - id: ch01-b10
          speaker: mathematical_master
          text: And how would you know? None of you has ever seen an angel.
        - id: ch01-b11
          speakers: [charity_child_1, charity_child_2, charity_child_3]
          ensemble: chorus
          text: Oh, but we have seen them in our dreams.
        - id: ch01-b12
          speaker: narrator
          text: The Mathematical Master frowned. He looked very severe, because he did not approve of children dreaming.
        - id: ch01-b13
          speaker: narrator
          text: One night, a little Swallow flew over the city. His friends had left for Egypt six weeks earlier, but he had stayed behind because he was in love with the most beautiful Reed. He had met her early in spring, while flying down the river after a large yellow moth. Her slender waist caught his eye so strongly that he forgot the moth and stopped to speak to her instead.
        - id: ch01-b14
          speaker: swallow
          text: May I love you?
        - id: ch01-b15
          speaker: narrator
          text: The Reed answered with a low bow. The Swallow circled her again and again, brushing the water with his wings and making silver ripples. His courtship lasted all summer.
        - id: ch01-b16
          speakers: [swallow_friend_1, swallow_friend_2]
          ensemble: duo
          text: What a silly match! She has no money, and she has far too many relations.
        - id: ch01-b17
          speaker: narrator
          text: The river really was full of Reeds, just as his friends had said. When autumn came, the other Swallows all flew away to Egypt. Once they were gone, the little Swallow felt lonely. With no friends beside him, he also began to grow tired of his lady-love.
        - id: ch01-b18
          speaker: swallow
          text: She never has anything to say. And I think she may be a flirt, because she is forever bowing to the wind. Yes, she likes staying at home, but I love to travel. My wife ought to love traveling too.
        - id: ch01-b19
          speaker: narrator
          text: Whenever the wind blew, the Reed did make the most graceful bows. At last, the Swallow asked her his final question.
        - id: ch01-b20
          speaker: swallow
          text: Will you come away with me?
        - id: ch01-b21
          speaker: narrator
          text: The Reed shook her head. She was too attached to her home.
        - id: ch01-b22
          speaker: swallow
          text: You have been playing with me! I am leaving for the Pyramids. Good-bye!
          emotion: angry
        - id: ch01-b23
          speaker: narrator
          text: He flew away. He traveled all day and reached the city at night.
        - id: ch01-b24
          speaker: swallow
          text: Where shall I stay tonight? I hope this town is ready for visitors.
        - id: ch01-b25
          speaker: narrator
          text: Then he noticed the statue on its tall column.
        - id: ch01-b26
          speaker: swallow
          text: I'll stay up there. What a fine spot, and there is plenty of fresh air.
        - id: ch01-b27
          speaker: narrator
          text: He landed between the Happy Prince's feet.
        - id: ch01-b28
          speaker: swallow
          text: Why, I have a golden bedroom.
        - id: ch01-b29
          speaker: narrator
          text: He looked around and got ready to sleep. Just as he tucked his head beneath his wing, a large drop of water fell on him.
        - id: ch01-b30
          speaker: swallow
          text: How strange! There isn't one cloud in the sky, and the stars are clear and bright, yet it is raining. The weather in northern Europe is dreadful. The Reed enjoyed rain, but that was only because she was selfish.
        - id: ch01-b31
          speaker: narrator
          text: Another drop fell.
        - id: ch01-b32
          speaker: swallow
          text: What good is a statue if it cannot keep off the rain? I had better find a proper chimney pot.
        - id: ch01-b33
          speaker: narrator
          text: He decided to leave and find a chimney pot instead. But before he could open his wings, a third drop struck him. He looked up, and what a sight met his eyes. The Happy Prince's eyes were full of tears, and those tears ran down his golden cheeks. His face was so beautiful in the moonlight that the little Swallow forgot his annoyance and was filled with pity.
        - id: ch01-b34
          speaker: swallow
          text: Who are you?
        - id: ch01-b35
          speaker: happy_prince
          text: I am the Happy Prince.
        - id: ch01-b36
          speaker: swallow
          text: Then why are you crying? You have soaked me through.
        - id: ch01-b37
          speaker: happy_prince
          text: When I was alive and had a human heart, I knew nothing about tears. I lived in the Palace of Sans-Souci, where sorrow was never allowed inside. By day, I played with my companions in the garden. At night, I led the dancing in the Great Hall. A very high wall surrounded the garden, but everything near me was so beautiful that I never asked what lay beyond it. My courtiers called me the Happy Prince. And I truly was happy, if pleasure is the same as happiness. That was how I lived, and then I died. Now they have placed me high above the city. From here, I can see all its ugliness and misery. My heart is made of lead, but still I cannot help weeping.
        - id: ch01-b38
          speaker: swallow
          text: So he isn't made of solid gold after all.
        - id: ch01-b39
          speaker: narrator
          text: The Swallow kept that thought to himself. He was far too polite to make a personal remark aloud.
    - id: ch02
      title: The Ruby
      blocks:
        - id: ch02-b01
          speaker: happy_prince
          text: Far away, in a little street, I can see a poor house through an open window. A woman sits at a table. Her face is thin and tired, and her rough red hands are covered with needle marks. She is a seamstress, sewing passion flowers onto a satin gown for the loveliest of the Queen's maids of honour to wear at the next Court ball. Her little boy lies sick in a bed at the corner of the room. He has a fever and keeps asking for oranges. His mother has only river water to give him, so he is crying. Swallow, Swallow, little Swallow, please take her the ruby from my sword. My feet are fixed to this pedestal, and I cannot move.
        - id: ch02-b02
          speaker: swallow
          text: They are expecting me in Egypt. My friends are flying over the Nile and talking to the great lotus flowers. Soon they will sleep in the tomb of the great King. He lies there in his painted coffin, wrapped in yellow linen and preserved with spices. Pale green jade hangs around his neck, and his hands look like dry leaves.
        - id: ch02-b03
          speaker: happy_prince
          text: Swallow, Swallow, little Swallow, stay with me for one night and carry my message. The boy is terribly thirsty, and his mother is so sad.
          emotion: sad
        - id: ch02-b04
          speaker: swallow
          text: I don't think I care for boys. Last summer, beside the river, the miller's two rude sons kept throwing stones at me. Naturally, they never hit me. Swallows fly much too well for that, and my family is famous for being quick. Even so, throwing stones showed no respect at all.
        - id: ch02-b05
          speaker: narrator
          text: The Happy Prince looked so sad that the little Swallow felt sorry for him.
        - id: ch02-b06
          speaker: swallow
          text: It is very cold here, but I will stay for one night and be your messenger.
        - id: ch02-b07
          speaker: happy_prince
          text: Thank you, little Swallow.
        - id: ch02-b08
          speaker: narrator
          text: The Swallow pulled the great ruby from the Prince's sword and carried it in his beak across the rooftops. He passed the cathedral tower, where white marble angels were carved into the stone. Then he passed the palace and heard the sound of dancing inside. A beautiful girl stepped onto a balcony with her lover.
        - id: ch02-b09
          speaker: palace_lover
          text: Just look at those wonderful stars. And think how wonderful love is!
          emotion: happy
        - id: ch02-b10
          speaker: maid_of_honour
          text: I only hope my dress is finished before the State ball. I asked for passion flowers to be embroidered on it, but seamstresses are so lazy.
        - id: ch02-b11
          speaker: narrator
          text: The Swallow crossed the river, where lanterns hung from the masts of the ships. Over the Ghetto, he saw old Jewish merchants bargaining with one another and weighing money on copper scales. At last, he reached the poor house and peered through the open window. The feverish boy tossed from side to side on his bed. His mother was so tired that she had fallen asleep at the table.
        - id: ch02-b12
          speaker: narrator
          text: The Swallow hopped into the room and set the ruby on the table beside her thimble. Then he circled the bed, gently fanning the boy's forehead with his wings.
        - id: ch02-b13
          speaker: sick_boy
          text: I feel so cool now. I think I must be getting better.
        - id: ch02-b14
          speaker: narrator
          text: The boy slipped into a deep, pleasant sleep. The Swallow returned to the Happy Prince and told him everything he had done.
        - id: ch02-b15
          speaker: swallow
          text: How odd. The night is cold, but I feel quite warm now.
          emotion: surprised
        - id: ch02-b16
          speaker: happy_prince
          text: That warmth comes from doing a good deed.
        - id: ch02-b17
          speaker: narrator
          text: The little Swallow thought about that, and soon he fell asleep. Thinking always made him sleepy.
        - id: ch02-b18
          speaker: narrator
          text: At daybreak, he flew down to the river for a bath. A Professor of Ornithology was crossing the bridge and spotted him.
        - id: ch02-b19
          speaker: ornithology_professor
          text: This is most remarkable. A swallow in winter!
          emotion: surprised
        - id: ch02-b20
          speaker: narrator
          text: The Professor wrote a long letter to the local newspaper. Everyone quoted it because it contained so many words they could not understand.
        - id: ch02-b21
          speaker: swallow
          text: Tonight, I leave for Egypt!
          emotion: happy
        - id: ch02-b22
          speaker: narrator
          text: The thought put him in high spirits. He visited every public monument in the city and spent a long time perched on top of the church steeple. Wherever he went, the Sparrows chirped to one another.
        - id: ch02-b23
          speakers: [sparrow_1, sparrow_2]
          ensemble: duo
          text: What a distinguished stranger!
        - id: ch02-b24
          speaker: narrator
          text: The Swallow heard them and enjoyed himself very much.
        - id: ch02-b25
          speaker: narrator
          text: When the moon rose, he flew back to the Happy Prince.
        - id: ch02-b26
          speaker: swallow
          text: Do you have anything to send to Egypt? I am leaving right now.
        - id: ch02-b27
          speaker: happy_prince
          text: Swallow, Swallow, little Swallow, won't you stay with me for one more night?
        - id: ch02-b28
          speaker: swallow
          text: They are waiting for me in Egypt. Tomorrow, my friends will fly to the Second Cataract. The river horse rests there among the rushes, and the god Memnon sits on a great granite throne. He watches the stars all night. When the morning star appears, he gives one joyful cry, then falls silent. At noon, yellow lions come to drink at the river's edge. Their eyes shine like green beryls, and their roar is louder than the cataract.
    - id: ch03
      title: The Two Sapphires
      blocks:
        - id: ch03-b01
          speaker: happy_prince
          text: Swallow, Swallow, little Swallow, across the city I can see a young man in an attic. He bends over a desk covered in papers, with a bunch of dried violets in a glass beside him. He has curly brown hair, lips as red as a pomegranate, and large, dreamy eyes. He is trying to finish a play for the Theatre Director, but he is too cold to keep writing. There is no fire in his grate, and hunger has made him faint.
        - id: ch03-b02
          speaker: swallow
          text: I will stay for one more night. Shall I bring him another ruby?
        - id: ch03-b03
          speaker: happy_prince
          text: I have no ruby left. All I have now are my eyes. They are rare sapphires brought from India a thousand years ago. Take one eye to the young man. He can sell it to a jeweler, buy food and firewood, and finish his play.
        - id: ch03-b04
          speaker: swallow
          text: Dear Prince, I can't do that.
          emotion: sad
        - id: ch03-b05
          speaker: narrator
          text: The Swallow began to weep.
        - id: ch03-b06
          speaker: happy_prince
          text: Swallow, Swallow, little Swallow, do as I ask.
        - id: ch03-b07
          speaker: narrator
          text: The Swallow plucked out one sapphire eye and carried it to the student's attic. A hole in the roof made it easy to enter. He darted through and flew into the room. The young man had buried his face in his hands, so he never heard the bird's wings. When he looked up, he saw the beautiful sapphire resting on the dried violets.
        - id: ch03-b08
          speaker: student
          text: Someone is finally noticing my work! This must be a gift from a great admirer. Now I can finish my play.
          emotion: happy
        - id: ch03-b09
          speaker: narrator
          text: His whole face brightened with happiness.
        - id: ch03-b10
          speaker: narrator
          text: The next day, the Swallow went to the harbor. He perched on the mast of a large ship and watched sailors haul heavy chests from the hold with ropes.
        - id: ch03-b11
          speakers: [sailor_1, sailor_2, sailor_3]
          ensemble: chorus
          text: Heave away!
        - id: ch03-b12
          speaker: narrator
          text: They shouted each time another chest rose.
        - id: ch03-b13
          speaker: swallow
          text: I am going to Egypt!
        - id: ch03-b14
          speaker: narrator
          text: No one paid him any attention. When the moon rose, he returned to the Happy Prince.
        - id: ch03-b15
          speaker: swallow
          text: I have come to say good-bye.
        - id: ch03-b16
          speaker: happy_prince
          text: Swallow, Swallow, little Swallow, stay with me for one more night.
        - id: ch03-b17
          speaker: swallow
          text: Winter is here, and the cold snow will soon fall. In Egypt, sunlight warms the green palms, while crocodiles lie in the mud and gaze lazily around. My friends are building a nest in the Temple of Baalbec. Pink and white doves watch them and coo together. Dear Prince, I must go. I will never forget you. Next spring, I will bring two beautiful jewels to replace the ones you gave away. The ruby will be redder than a rose, and the sapphire will be as blue as the great sea.
        - id: ch03-b18
          speaker: happy_prince
          text: In the square below us, a little match girl is standing alone. Her matches fell into the gutter, and every one of them is ruined. If she goes home without money, her father will beat her. That is why she is crying. She has no shoes or stockings, and nothing covers her head. Take my other eye and give it to her. Then her father will not beat her.
        - id: ch03-b19
          speaker: swallow
          text: I will stay for one more night, but I cannot take your other eye. You would be completely blind.
          emotion: sad
        - id: ch03-b20
          speaker: happy_prince
          text: Swallow, Swallow, little Swallow, do as I ask.
        - id: ch03-b21
          speaker: narrator
          text: The Swallow plucked out the Prince's second eye and darted down to the square. He swept past the match girl and slipped the jewel into her hand.
        - id: ch03-b22
          speaker: match_girl
          text: What a lovely piece of glass!
          emotion: happy
        - id: ch03-b23
          speaker: narrator
          text: She ran home laughing. The Swallow flew back to the Prince.
        - id: ch03-b24
          speaker: swallow
          text: Now you are blind, so I will stay with you forever.
        - id: ch03-b25
          speaker: happy_prince
          text: No, little Swallow. You must go to Egypt.
        - id: ch03-b26
          speaker: swallow
          text: I will stay with you forever.
        - id: ch03-b27
          speaker: narrator
          text: That night, he slept at the Prince's feet.
    - id: ch04
      title: The Gold Leaves and the Winter
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: All the next day, the Swallow sat on the Prince's shoulder and told him about distant lands. He described red ibises standing in long rows on the Nile, catching goldfish in their beaks. He spoke of the Sphinx, as old as the world, living in the desert and knowing everything. He told of merchants walking slowly beside camels with amber beads in their hands, and of the King of the Mountains of the Moon, whose skin was black as ebony and who worshiped a great crystal. There was also a huge green snake asleep in a palm tree, fed honey cakes by twenty priests, and a race of tiny people who sailed across a lake on broad, flat leaves and were always at war with the butterflies.
        - id: ch04-b02
          speaker: happy_prince
          text: Dear little Swallow, those are wonderful things. But nothing is more astonishing than the suffering of men and women. Misery is the greatest mystery of all. Fly over my city, little Swallow, and tell me what you find.
        - id: ch04-b03
          speaker: narrator
          text: The Swallow flew across the great city and looked down into every part of it. In beautiful houses, rich people feasted and enjoyed themselves while beggars sat outside their gates. He went down dark lanes and saw starving children with pale faces staring weakly out at the black streets. Beneath the stone arch of a bridge, two little boys lay in each other's arms, trying to share what little warmth they had.
        - id: ch04-b04
          speakers: [bridge_boy_1, bridge_boy_2]
          ensemble: duo
          text: We are so hungry.
          emotion: sad
        - id: ch04-b05
          speaker: watchman
          text: You cannot sleep there. Move along!
          emotion: angry
        - id: ch04-b06
          speaker: narrator
          text: The boys wandered away into the rain. The Swallow returned and told the Prince everything he had seen.
        - id: ch04-b07
          speaker: happy_prince
          text: Fine gold covers my body. Peel it away, one leaf at a time, and give it to the poor. People who are alive always believe that gold can make them happy.
        - id: ch04-b08
          speaker: narrator
          text: The Swallow picked off one fine gold leaf after another, until the Happy Prince looked dull and gray. He carried every leaf to the poor. The children's faces grew rosier. They laughed and played games in the street.
        - id: ch04-b09
          speakers: [poor_child_1, poor_child_2]
          ensemble: duo
          text: We have bread now!
          emotion: happy
        - id: ch04-b10
          speaker: narrator
          text: Then the snow came, and after the snow came the frost. The streets glittered so brightly that they looked as though they were made of silver. Long icicles, sharp as crystal daggers, hung from the edges of the roofs. Everyone who went outdoors wrapped themselves in furs, while little boys put on scarlet caps and skated across the ice.
        - id: ch04-b11
          speaker: narrator
          text: The poor little Swallow grew colder every day, but he loved the Prince too much to leave him. When the baker was not looking, he picked up crumbs outside the shop. He flapped his wings again and again, trying to keep warm.
        - id: ch04-b12
          speaker: narrator
          text: At last, he knew he was dying. With the last of his strength, he flew up to the Prince's shoulder.
        - id: ch04-b13
          speaker: swallow
          text: Good-bye, dear Prince. May I kiss your hand?
          emotion: sad
        - id: ch04-b14
          speaker: happy_prince
          text: I am glad you are finally leaving for Egypt, little Swallow. You have stayed here far too long. But kiss me on the lips, because I love you.
          emotion: sad
        - id: ch04-b15
          speaker: swallow
          text: I am not going to Egypt. I am going to the House of Death. Death is Sleep's brother, isn't he?
          emotion: sad
        - id: ch04-b16
          speaker: narrator
          text: He kissed the Happy Prince on the lips and fell dead at his feet.
        - id: ch04-b17
          speaker: narrator
          text: At that moment, a strange crack sounded inside the statue, as though something had broken. The leaden heart had snapped cleanly in two. The frost that night was terribly hard.
    - id: ch05
      title: The Two Most Precious Things
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: Early the next morning, the Mayor walked through the square with the Town Councillors. As they passed beneath the column, he looked up at the statue.
        - id: ch05-b02
          speaker: mayor
          text: Dear me! The Happy Prince looks terribly shabby.
          emotion: surprised
        - id: ch05-b03
          speakers: [town_councillor_1, town_councillor_2, town_councillor_3]
          ensemble: chorus
          text: Terribly shabby indeed!
        - id: ch05-b04
          speaker: narrator
          text: The Town Councillors always agreed with the Mayor. They went closer to inspect the statue.
        - id: ch05-b05
          speaker: mayor
          text: The ruby is missing from his sword. He has lost both eyes, and there is no gold left on him. Why, he looks no better than a beggar!
        - id: ch05-b06
          speakers: [town_councillor_1, town_councillor_2, town_councillor_3]
          ensemble: chorus
          text: No better than a beggar!
        - id: ch05-b07
          speaker: mayor
          text: And there is a dead bird lying at his feet! We must issue an official order. Birds may not die here.
        - id: ch05-b08
          speaker: narrator
          text: The Town Clerk carefully wrote down the Mayor's suggestion so that it could become an official proclamation. Then the city workers pulled the statue of the Happy Prince down from its tall column.
        - id: ch05-b09
          speaker: art_professor
          text: Now that the statue is no longer beautiful, it has no use.
        - id: ch05-b10
          speaker: narrator
          text: They melted the statue in a furnace. The Mayor called a meeting of the city leaders to decide what should be done with the metal.
        - id: ch05-b11
          speaker: mayor
          text: Naturally, we need another statue. It should be a statue of me.
        - id: ch05-b12
          speaker: town_councillor_1
          text: No, it should be a statue of me.
        - id: ch05-b13
          speaker: town_councillor_2
          text: I say it should be me.
        - id: ch05-b14
          speaker: town_councillor_3
          text: The new statue must be mine.
        - id: ch05-b15
          speaker: narrator
          text: They began to quarrel. The last anyone heard, they were still quarreling.
        - id: ch05-b16
          speaker: foundry_overseer
          text: Now, that is strange. This broken lead heart will not melt in the furnace. We will have to throw it away.
          emotion: surprised
        - id: ch05-b17
          speaker: narrator
          text: The workmen threw the heart onto a rubbish heap. The dead Swallow was lying there too.
        - id: ch05-b18
          speaker: god
          text: Bring me the two most precious things in the city.
        - id: ch05-b19
          speaker: narrator
          text: God spoke to one of His Angels, and the Angel brought Him the broken lead heart and the dead bird.
        - id: ch05-b20
          speaker: god
          text: You have chosen well. In my garden of Paradise, this little bird will sing forever. And in my city of gold, the Happy Prince will praise me.
