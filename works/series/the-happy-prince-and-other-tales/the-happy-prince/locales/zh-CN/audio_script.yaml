  chapters:
    - id: ch01
      title: 金像与迟归的燕子
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 城市上空有一根高高的石柱，快乐王子的雕像就立在顶上。他全身贴着一层层薄薄的纯金叶片，两颗明亮的蓝宝石做成了眼睛，剑柄上还嵌着一颗耀眼的大红宝石。城里人经过时，总要仰头看看，无不称赞他的美丽。
        - id: ch01-b02
          speaker: town_councillor
          text: 他美得像一只风信鸡。当然了，要说实用，他还是比风信鸡差一点。
        - id: ch01-b03
          speaker: narrator
          text: 说话的市议员很想让大家知道自己懂艺术，又怕别人觉得自己不讲实际，这才赶紧补上了后一句。
        - id: ch01-b04
          speaker: sensible_mother
          text: 你就不能学学快乐王子吗？人家可从来不会哭着要这要那。
        - id: ch01-b05
          speaker: narrator
          text: 一位母亲这样劝着哭闹要月亮的儿子。一个失意的人仰望雕像，也低声感叹。
        - id: ch01-b06
          speaker: disappointed_man
          text: 世上总算还有一个人是真正快乐的。
          emotion: sad
        - id: ch01-b07
          speaker: charity_children
          text: 你们看，他就像一位天使！
        - id: ch01-b08
          speaker: narrator
          text: 慈善学校的孩子们刚从大教堂出来，鲜红的斗篷干干净净，洁白的围裙也一尘不染。他们一起仰望着高处的王子。数学老师听见了这句话，立刻板起脸来追问。
        - id: ch01-b09
          speaker: mathematical_master
          text: 你们从来没见过天使，怎么会知道他像不像？
        - id: ch01-b10
          speaker: charity_children
          text: 可我们在梦里见过呀！
        - id: ch01-b11
          speaker: narrator
          text: 老师皱起眉，摆出一副严厉的神情。他可不赞成孩子们做梦。
        - id: ch01-b12
          speaker: narrator
          text: 一天夜里，一只小燕子独自飞过城市。他的伙伴们早在六个星期前就去了埃及，只有他留在了北方。原来早春的时候，他追着一只黄色大飞蛾沿河飞去，遇见了一株最美丽的芦苇。那纤细的腰肢一下就迷住了他，他立刻停下来跟她说话。
        - id: ch01-b13
          speaker: swallow
          text: 我可以爱你吗？
        - id: ch01-b14
          speaker: narrator
          text: 小燕子向来有话直说。芦苇弯下腰，深深行了个礼。他便绕着她一圈圈地飞，翅尖轻轻掠过水面，留下一道道银色涟漪。这样的求爱持续了一整个夏天。
        - id: ch01-b15
          speaker: other_swallows
          text: 这门恋爱太荒唐了！她一文不名，亲戚还多得数不清。
        - id: ch01-b16
          speaker: narrator
          text: 河里的确长满了芦苇，一株挨着一株，尽是她的亲戚。秋天一到，别的燕子结伴飞往远方，只有小燕子独自留在河边。他慢慢觉得寂寞，也开始对自己的意中人厌烦起来。
        - id: ch01-b17
          speaker: swallow
          text: 她一句话也不会说，还总跟风眉来眼去。风一吹，她就弯腰行礼。恋家倒是很恋家，可我喜欢旅行，我的妻子当然也该喜欢旅行。你愿意跟我一起走吗？
        - id: ch01-b18
          speaker: narrator
          text: 芦苇摇了摇头。她舍不得自己的家。
        - id: ch01-b19
          speaker: swallow
          text: 原来你一直在戏弄我！我要去金字塔了，再见！
          emotion: angry
        - id: ch01-b20
          speaker: narrator
          text: 小燕子飞了一整天，夜里才到这座城。他在夜空中盘旋，四处寻找住处。
        - id: ch01-b21
          speaker: swallow
          text: 今晚该住在哪儿呢？但愿这座城已经为我准备好了地方。
        - id: ch01-b22
          speaker: narrator
          text: 就在这时，他看见了石柱顶上的雕像。
        - id: ch01-b23
          speaker: swallow
          text: 就住那里吧！地方好，空气也新鲜。瞧，我还有一间金卧房呢。
        - id: ch01-b24
          speaker: narrator
          text: 他落在快乐王子的双脚之间，环顾这处金光闪闪的住处，满意地准备睡觉。可他刚把头往翅膀下藏，一大滴水就落在身上。
        - id: ch01-b25
          speaker: swallow
          text: 奇怪！天上一片云也没有，星星亮得清清楚楚，怎么会下雨？北欧的天气真是糟透了。芦苇喜欢下雨，那也只是因为她自私。
        - id: ch01-b26
          speaker: narrator
          text: 第二滴水又落在小燕子身上。他抖了抖羽毛，对这处住处失望透了。
        - id: ch01-b27
          speaker: swallow
          text: 一尊雕像连雨都挡不住，还能有什么用？我还是找一个好烟囱过夜吧。
        - id: ch01-b28
          speaker: narrator
          text: 小燕子打定主意要飞走。可他还没张开翅膀，第三滴水就掉下来了。他抬头一看，顿时怔住。
        - id: ch01-b29
          speaker: narrator
          text: 快乐王子的眼里盛满了泪，泪珠沿着金色脸颊往下流。月光照着那张美丽的脸，小燕子心里一下有了怜悯。
        - id: ch01-b30
          speaker: swallow
          text: 你是谁？
        - id: ch01-b31
          speaker: happy_prince
          text: 我是快乐王子。
        - id: ch01-b32
          speaker: swallow
          text: 那你为什么哭？你把我都淋湿了。
        - id: ch01-b33
          speaker: happy_prince
          text: 我活着的时候有一颗凡人的心，却不知道眼泪是什么。我住在无忧宫里，忧愁不准进去。白天，我和伙伴们在花园玩耍，夜里就在大厅领舞。花园四周有高墙，可身边的一切都太美了，我从没问过墙外有什么。臣子叫我快乐王子。要是享乐就是快乐，那时的我确实很快乐。我就那样活着，也那样死去。如今他们把我立得这么高，整座城的丑陋和苦难全在眼前。我的心虽然是铅做的，还是忍不住要流泪。
          emotion: sad
        - id: ch01-b34
          speaker: narrator
          text: 小燕子暗自吃惊，原来王子并不是纯金的。不过他很有礼貌，没有把这话说出来。
    - id: ch02
      title: 第一颗宝石
      blocks:
        - id: ch02-b01
          speaker: happy_prince
          text: 在很远的一条小街上，有一间穷屋子。窗户开着，我看见一个女裁缝坐在桌旁。她又瘦又憔悴，粗糙发红的手上全是针眼。她正为王后最美丽的侍女赶制礼服，在缎子上绣西番莲花，好让那位侍女穿去参加下一场宫廷舞会。屋角的床上，她的小儿子发着烧，一直想吃橙子。母亲什么也没有，只能给他喝河水，孩子便哭个不停。燕子，燕子，小燕子，把我剑上的红宝石送给她好吗？我的双脚固定在这里，哪儿也去不了。
        - id: ch02-b02
          speaker: swallow
          text: 可埃及那边还在等我。伙伴们正在尼罗河上飞来飞去，陪大莲花说话。过些日子，他们就会睡进大王的墓穴。大王本人躺在彩绘的棺木里，裹着黄色亚麻布，遗体用香料保存。他脖子上挂着淡绿色的玉石，双手像枯叶一样。
        - id: ch02-b03
          speaker: happy_prince
          text: 燕子，燕子，小燕子，只陪我住一夜，替我送一次东西吧。孩子渴得那么厉害，母亲又那么伤心。
          emotion: sad
        - id: ch02-b04
          speaker: swallow
          text: 我可不怎么喜欢小男孩。去年夏天，磨坊主家的两个儿子老拿石头扔我。他们当然打不中，我们燕子飞得多快呀，何况我这一家向来身手敏捷。可就算打不中，那也很不尊重我。
        - id: ch02-b05
          speaker: narrator
          text: 快乐王子的神情太悲伤了，小燕子终于心软。
        - id: ch02-b06
          speaker: swallow
          text: 这里冷得很，不过我答应你。我陪你住一夜，也替你送这一次。
        - id: ch02-b07
          speaker: happy_prince
          text: 谢谢你，小燕子。
        - id: ch02-b08
          speaker: narrator
          text: 小燕子啄下剑柄上的红宝石，衔着它飞过城里的屋顶。他经过雕着白色大理石天使的教堂尖塔，又从王宫旁飞过。宫里传出舞曲，一位美丽的姑娘和她的爱人走到了阳台上。
        - id: ch02-b09
          speaker: palace_lover
          text: 星星多美啊，爱情的力量也一样美妙！
          emotion: happy
        - id: ch02-b10
          speaker: palace_lady
          text: 我只盼礼服能在国宴舞会前做好。我叫人绣上西番莲花，可那些女裁缝实在太懒了。
        - id: ch02-b11
          speaker: narrator
          text: 小燕子越过河面，看见一盏盏灯笼挂在船桅上。他又飞过犹太人区，看见老人们彼此讨价还价，还把钱币放在铜秤上称量。最后，他终于找到那间穷屋子，停在窗外往里看。男孩烧得厉害，在床上翻来覆去。母亲已经累得伏在一旁睡着了。
        - id: ch02-b12
          speaker: narrator
          text: 小燕子从开着的窗户跳进屋，把嘴里的大红宝石轻轻放到桌上，就放在女人的顶针旁边。他又绕着孩子的床飞了几圈，用翅膀一下一下给发热的额头扇风。
        - id: ch02-b13
          speaker: sick_boy
          text: 好凉快啊，我的病一定快好了。
        - id: ch02-b14
          speaker: narrator
          text: 男孩很快进入了香甜的梦乡。小燕子飞回王子身边，把这一切都告诉了他。
        - id: ch02-b15
          speaker: swallow
          text: 真奇怪，明明这么冷，我现在却觉得暖和极了。
        - id: ch02-b16
          speaker: happy_prince
          text: 那是因为你做了一件好事。
        - id: ch02-b17
          speaker: narrator
          text: 小燕子想了想，随后便睡着了。只要一思考，他总会犯困。
        - id: ch02-b18
          speaker: narrator
          text: 天亮后，小燕子飞到河里洗澡。一位鸟类学教授从桥上经过，正好看见他。
        - id: ch02-b19
          speaker: ornithology_professor
          text: 真是罕见！冬天竟然还有燕子！
          emotion: surprised
        - id: ch02-b20
          speaker: narrator
          text: 教授特意写了一封长信投给当地报纸。信里塞满大家看不懂的词，反倒叫人人都爱引用。小燕子想到当晚就能去埃及，心情好极了。他在城里到处游逛，参观了所有公共纪念建筑，还在教堂尖顶上坐了很久。
        - id: ch02-b21
          speaker: sparrows
          text: 快看，多么不凡的一位外乡客！
        - id: ch02-b22
          speaker: narrator
          text: 麻雀们走到哪儿都这样议论，小燕子听得十分得意。月亮升起来，他又飞回快乐王子身边。
        - id: ch02-b23
          speaker: swallow
          text: 有什么东西要我捎去埃及吗？我马上就要出发了。
        - id: ch02-b24
          speaker: happy_prince
          text: 燕子，燕子，小燕子，你愿意再陪我住一夜吗？
    - id: ch03
      title: 王子的双眼
      blocks:
        - id: ch03-b01
          speaker: swallow
          text: 埃及的伙伴们还在等我呢。明天，他们会飞到尼罗河第二瀑布。河马伏在灯芯草里，门农神坐在巨大的花岗岩宝座上，整夜望着星星。晨星一亮，他就欢呼一声，然后再不开口。中午，黄色狮子会到水边喝水。它们的眼睛像绿色宝石，吼起来，比瀑布还响。
        - id: ch03-b02
          speaker: happy_prince
          text: 燕子，燕子，小燕子，城那边有个年轻人住在阁楼里。他伏在堆满稿纸的桌上，身旁的玻璃杯里插着枯萎的紫罗兰。他有鬈曲的棕发，石榴一样红的嘴唇，还有一双又大又爱做梦的眼睛。他得为剧院经理写完一出戏，可屋里没有火，他冷得写不动，又饿得头昏无力。
        - id: ch03-b03
          speaker: swallow
          text: 那我再陪你一夜。要不要再送给他一颗红宝石？
        - id: ch03-b04
          speaker: happy_prince
          text: 可惜红宝石已经没有了。如今只剩我的眼睛。它们是稀有的蓝宝石，一千年前从印度运来。啄下一颗，送给那个年轻人吧。他卖给珠宝商，就能买食物和柴火，也能把戏写完。
        - id: ch03-b05
          speaker: swallow
          text: 亲爱的王子，我不能那么做。
          emotion: sad
        - id: ch03-b06
          speaker: narrator
          text: 小燕子说着，哭了起来。
        - id: ch03-b07
          speaker: happy_prince
          text: 燕子，燕子，小燕子，照我说的去做吧。
        - id: ch03-b08
          speaker: narrator
          text: 小燕子只好啄下王子的一只眼睛，衔着宝石飞向那间阁楼。屋顶正好破了个洞，他一下就钻进屋里。年轻人坐在桌旁，把头深深埋在双手间，根本没听见鸟儿翅膀扇动。过了一会儿，他终于抬起头，才看见那颗漂亮的蓝宝石正躺在枯萎的紫罗兰上。
        - id: ch03-b09
          speaker: playwright
          text: 终于有人懂得欣赏我了！这一定是某位了不起的仰慕者送来的。现在我能写完那出戏了！
          emotion: happy
        - id: ch03-b10
          speaker: narrator
          text: 年轻人满脸欢喜。第二天，小燕子飞到港口，停在一艘大船的桅杆上。他看着水手们放下粗绳，再合力把一只只沉重的大箱子从船舱深处吊上来。
        - id: ch03-b11
          speaker: sailors
          text: 嗨哟，大家一起使劲拉！
        - id: ch03-b12
          speaker: swallow
          text: 我要去埃及啦！
        - id: ch03-b13
          speaker: narrator
          text: 没有一个水手理会他。到了月夜，小燕子又回到王子身边。
        - id: ch03-b14
          speaker: swallow
          text: 我来跟你告别了。
        - id: ch03-b15
          speaker: happy_prince
          text: 燕子，燕子，小燕子，再陪我一个晚上好吗？
        - id: ch03-b16
          speaker: swallow
          text: 冬天来了，凛冽的雪很快就会落下。埃及的太阳暖暖照着绿色棕榈树，鳄鱼躺在泥里，懒洋洋地四处看。我的伙伴们在巴勒贝克神庙里筑巢，粉红和雪白的鸽子守在旁边，彼此咕咕低语。亲爱的王子，我非走不可，可我永远不会忘记你。明年春天，我会带两颗宝石回来补给你。新的红宝石要比红玫瑰更红，新的蓝宝石要像大海一样蓝。
        - id: ch03-b17
          speaker: happy_prince
          text: 下面的广场上有个卖火柴的小女孩。她把火柴掉进阴沟，全泡坏了。要是赚不到钱，她父亲会打她，所以她正哭呢。她没有鞋袜，头上也没戴帽子。把我另一只眼睛送给她吧，她就不会挨打了。
        - id: ch03-b18
          speaker: swallow
          text: 我可以再陪你一夜，可不能再拿走你的眼睛。那样一来，你就完全看不见了。
        - id: ch03-b19
          speaker: happy_prince
          text: 燕子，燕子，小燕子，照我的吩咐做吧。
        - id: ch03-b20
          speaker: narrator
          text: 小燕子啄下王子的另一只眼睛，带着宝石直冲下去。他从女孩身边掠过，把宝石塞进她的手心。
        - id: ch03-b21
          speaker: match_girl
          text: 多漂亮的一小块玻璃呀！
          emotion: happy
        - id: ch03-b22
          speaker: narrator
          text: 小女孩把那颗蓝宝石当成了一块漂亮玻璃。她握着宝石，笑着往家跑去。小燕子也立刻飞回高柱顶上，回到王子身边。
        - id: ch03-b23
          speaker: swallow
          text: 你现在什么也看不见了，所以我要一直陪着你。
        - id: ch03-b24
          speaker: happy_prince
          text: 不，小燕子，你一定要去埃及。
        - id: ch03-b25
          speaker: swallow
          text: 我会永远陪着你。
        - id: ch03-b26
          speaker: narrator
          text: 那一夜，小燕子就睡在王子的脚边。
    - id: ch04
      title: 城里的苦难
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 第二天一整天，小燕子都坐在王子肩头，慢慢讲起自己在遥远异国的见闻。尼罗河岸边，红鹮鸟排成长长的队伍，用嘴捉起水里的金鱼。和世界一样古老的斯芬克斯独自住在沙漠里，世上的事没有一样瞒得过他。商人手里捻着琥珀念珠，缓缓走在骆驼身旁。皮肤黑得像乌木的月亮山之王，日日崇拜一块硕大的水晶。还有一条巨大的绿蛇，盘在棕榈树上睡觉，由二十名祭司拿蜜饼喂养。小矮人则坐着宽大的扁叶渡过一片大湖，总在跟蝴蝶打仗。
        - id: ch04-b02
          speaker: happy_prince
          text: 亲爱的小燕子，你说的这些都很奇妙，可世上最奇妙的，还是男人和女人所受的苦。再没有比苦难更深的奥秘了。飞过我的城市吧，把你看见的一切说给我听。
          emotion: sad
        - id: ch04-b03
          speaker: narrator
          text: 小燕子从城市的一头飞到另一头。他看见富人们聚在漂亮房子里寻欢作乐，乞丐却只能坐在大门外。他又转进一条条阴暗的小巷。那里，挨饿的孩子脸色苍白，从屋里向外望着漆黑的街道，眼神已经麻木。桥洞下面，两个小男孩躺在那里，紧紧抱住对方，想从彼此身上得到一点暖意。
        - id: ch04-b04
          speaker: hungry_boys
          text: 我们好饿啊！
          emotion: sad
        - id: ch04-b05
          speaker: watchman
          text: 不准躺在这里！快走！
          emotion: angry
        - id: ch04-b06
          speaker: narrator
          text: 两个男孩只得走进雨里。小燕子飞回王子身边，把看到的一切都告诉了他。
        - id: ch04-b07
          speaker: happy_prince
          text: 我全身贴满了纯金叶片。你把它们一片片揭下来，送给城里的穷人吧。活着的人总以为黄金会给他们幸福。
        - id: ch04-b08
          speaker: narrator
          text: 小燕子一片又一片地啄下细薄的金叶，快乐王子身上的光彩也一寸寸消失，直到整尊雕像变得灰暗无光。他又把每一片金叶送到穷人手里。挨饿的孩子终于有了食物，苍白的脸渐渐红润，又能在街上笑着追逐，重新玩起游戏。
        - id: ch04-b09
          speaker: charity_children
          text: 我们有面包吃啦！
          emotion: happy
        - id: ch04-b10
          speaker: narrator
          text: 雪终于落了下来，雪停以后，紧跟着又是一场严霜。整条街道亮得耀眼，闪着光，像是用白银铺成。屋檐下垂着一根根长冰柱，锋利得如同水晶匕首。人人都裹着厚厚的皮衣出门，小男孩们戴上鲜红的帽子，在结冰的水面上滑行。
        - id: ch04-b11
          speaker: narrator
          text: 小燕子越来越冷，却始终不肯离开王子，因为他实在太爱王子了。他趁面包师不留神，到店外捡一点面包屑，又不停拍打翅膀，想让自己暖和起来。
        - id: ch04-b12
          speaker: narrator
          text: 最后，小燕子知道自己就要死了。他只剩下一点力气，勉强又飞到王子肩上。
        - id: ch04-b13
          speaker: swallow
          text: 再见了，亲爱的王子。你愿意让我亲一亲你的手吗？
          emotion: sad
        - id: ch04-b14
          speaker: happy_prince
          text: 小燕子，我真高兴你终于要去埃及了。你留在这里实在太久。不过别亲我的手，请亲我的嘴唇吧，因为我爱你。
          emotion: happy
        - id: ch04-b15
          speaker: swallow
          text: 我要去的不是埃及，而是死亡的家。死亡就是睡眠的兄弟，对不对？
          emotion: sad
        - id: ch04-b16
          speaker: narrator
          text: 小燕子吻了快乐王子的嘴唇，随即跌落在王子脚下，死去了。
        - id: ch04-b17
          speaker: narrator
          text: 就在这一刻，雕像里面传出一声奇怪的裂响，像是有什么东西断了。原来那颗铅做的心裂成了两半。那一夜的霜冻，的确冷得可怕。
    - id: ch05
      title: 铅心与小鸟
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 第二天一早，市长带着市议员们从广场走过。到了高高的石柱下面，市长抬起头，这才看见雕像如今的模样。
        - id: ch05-b02
          speaker: mayor
          text: 哎呀，快乐王子怎么变得这么破旧！
          emotion: surprised
        - id: ch05-b03
          speaker: town_councillors
          text: 的确太破旧了！
        - id: ch05-b04
          speaker: narrator
          text: 市议员们一向赞同市长。他们走近了一些，仔细打量起来。
        - id: ch05-b05
          speaker: mayor
          text: 剑上的红宝石没了，两只眼睛也不见了，身上一点金色都没有。现在的他，简直跟乞丐差不多！
        - id: ch05-b06
          speaker: town_councillors
          text: 简直跟乞丐差不多！
        - id: ch05-b07
          speaker: mayor
          text: 他的脚边居然还有一只死鸟！我们真该发布告示，不许鸟儿死在这里。
        - id: ch05-b08
          speaker: narrator
          text: 跟在一旁的市政书记员把这条建议记了下来。随后，人们把曾经受人仰慕的快乐王子拆了下来。
        - id: ch05-b09
          speaker: art_professor
          text: 他既然不再美丽，也就没有用处了。
        - id: ch05-b10
          speaker: narrator
          text: 说这话的是大学里的艺术教授。雕像被送进熔炉，市长又召集市政委员会，商量熔下来的金属该拿去做什么。
        - id: ch05-b11
          speaker: mayor
          text: 当然应该再铸一尊雕像，而且要铸成我的模样。
        - id: ch05-b12
          speaker: town_councillors
          text: 不，该铸成我的模样！
          emotion: angry
        - id: ch05-b13
          speaker: narrator
          text: 每一位市议员都这样争起来。我最后一次听到他们的消息时，他们还没有停下。
        - id: ch05-b14
          speaker: foundry_foreman
          text: 真奇怪！这颗裂开的铅心在炉子里怎么也熔不掉。只能把它扔了。
          emotion: surprised
        - id: ch05-b15
          speaker: narrator
          text: 工人们把铅心扔到垃圾堆上。死去的小燕子也躺在那里。
        - id: ch05-b16
          speaker: god
          text: 把这座城里最珍贵的两样东西带给我。
        - id: ch05-b17
          speaker: narrator
          text: 上帝的一位天使听从吩咐，把那颗铅心和死去的小鸟带到了他面前。
        - id: ch05-b18
          speaker: god
          text: 你选得很对。在我的乐园里，这只小鸟将永远歌唱。在我的黄金城中，快乐王子将永远赞美我。
