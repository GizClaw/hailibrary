audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 亲切机敏，带着温和的调侃
        timbre: 温暖清亮
        pace: 舒缓而有变化
        pitch: 中音
    peter_rabbit:
      display_name: 彼得兔
      tts:
        delivery: 机灵顽皮，盘算时压低声音
        timbre: 年轻明亮
        pace: 轻快
        pitch: 中高音
    sammy_jay:
      display_name: 冠蓝鸦萨米
      tts:
        delivery: 好奇直率，发火时尖锐急促
        timbre: 清脆响亮
        pace: 偏快
        pitch: 高音
    reddy_fox:
      display_name: 红狐雷迪
      tts:
        delivery: 狡猾自信，盘算时带着得意
        timbre: 圆润低沉
        pace: 从容偏慢
        pitch: 中低音
  chapters:
    - id: ch01
      title: 别拿性命开玩笑
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 若非必要把命冒，实在愚蠢又可笑。这句话可千万别忘。更别学彼得兔，为了开一个玩笑，竟肯冒险让红狐雷迪来抓自己。还有比这更傻的事吗？可每天都有不少人像他一样，粗心大意地拿性命冒险，只为了省下几分钟，或是为了同样不值当的理由。
        - id: ch01-b02
          speaker: narrator
          text: 彼得根本没有停下来想过，要是计划出了岔子，后果会有多可怕。他也没想过住在老荆棘丛里的彼得太太。万一他再也回不了家，她该多难过。欠考虑就是这样，只顾眼前，从来想不起别人。
        - id: ch01-b03
          speaker: narrator
          text: 雷迪正贴着老果园边上的旧石墙，偷偷往前摸。彼得一直知道他走到了哪里，雷迪却一点儿也不知情。要是雷迪知道彼得早有防备，他准会猜到，这又是彼得设下的花招。
    - id: ch02
      title: 雷迪跃过石墙
      blocks:
        - id: ch02-b01
          speaker: peter_rabbit
          text: 他会从墙头探头看我。一看见我，他准觉得这回一定抓得到。接着，他会摸到墙最低的地方，从那儿跳过来。他起跳的那一刻，我也得马上跳，一点儿都不能迟。
        - id: ch02-b02
          speaker: narrator
          text: 果然，每一步都让彼得猜中了。他装作只顾着听萨米骂人，眼睛却牢牢盯着石墙最低的地方。很快，雷迪的尖鼻子从墙头冒了出来。他要确认彼得还在不在。那只尖鼻子刚缩回去，彼得就做好了逃命的准备。
        - id: ch02-b03
          speaker: narrator
          text: 一秒钟后，雷迪纵身跃过石墙。彼得转身就跑，使出了全身力气，雷迪几乎贴在他的脚后。萨米刚才忙着骂彼得，压根儿没有看见雷迪。现在他立刻忘了两个人还在吵架。
        - id: ch02-b04
          speaker: sammy_jay
          text: 快跑，彼得！快跑啊！
        - id: ch02-b05
          speaker: narrator
          text: 瞧，这就是萨米。刚才还在生彼得的气，一见他遇上危险，马上又替他着急起来。
    - id: ch03
      title: 山坡边的旧木桶
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 彼得当然拼命跑。他也只能拼命跑。雷迪见他直奔绿草地，得意地咧开了嘴。这里离老荆棘丛还远得很，他认定自己一定能在彼得到家前把他抓住。
        - id: ch03-b02
          speaker: narrator
          text: 雷迪紧盯着彼得，就怕他突然转弯，逃回旧石墙边。他绝不会让彼得溜回去。可是彼得连试也没试，只管朝绿草地上方的山坡边缘直冲。雷迪这才看见，前面横着一只旧木桶。
        - id: ch03-b03
          speaker: reddy_fox
          text: 他难道想躲进那只桶里？
        - id: ch03-b04
          speaker: narrator
          text: 雷迪又笑了。他记得几天前路过那里时看得很清楚。木桶一头开着，另一头封得死死的。
        - id: ch03-b05
          speaker: reddy_fox
          text: 他要是钻进去，我不用怎么追，就能轻轻松松抓住他。
        - id: ch03-b06
          speaker: narrator
          text: 想到这里，雷迪偷偷笑出了声。
    - id: ch04
      title: 彼得凌空一跃
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 啪嗒啪嗒啪嗒，彼得飞快地跑。啪嗒啪嗒啪嗒，雷迪紧紧追在后面。萨米看得清清楚楚。再跳几步，雷迪恐怕真要抓住彼得了。
        - id: ch04-b02
          speaker: sammy_jay
          text: 快跑啊，彼得！哎呀，快跑！快跑！
        - id: ch04-b03
          speaker: narrator
          text: 萨米虽然常跟彼得争吵，可他绝不愿看到彼得真的受伤。彼得冲到旧木桶旁时，雷迪已经靠得那么近，他几乎能感觉到背后喷来的气息。
        - id: ch04-b04
          speaker: narrator
          text: 就在那一刻，彼得漂亮地凌空一跃，从木桶上方飞了过去。他落地以后脚步不停，沿山坡一路往下跑，直奔土拨鼠约翰尼的一处旧宅。那地方他早就知道。
        - id: ch04-b05
          speaker: narrator
          text: 彼得跑到旧宅，马上回头看身后出了什么事。萨米还在尖叫，那边又传来别的声响，显然正闹得不可开交。彼得心里明白，自己安排的玩笑，多半正照着他的计划上演呢。
