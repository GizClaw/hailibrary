audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm, observant storytelling with a gently playful edge
        timbre: clear and rounded
        pace: measured
        pitch: medium
    peter_rabbit:
      display_name: Peter Rabbit
      tts:
        delivery: lively, clever, and pleased with his own schemes
        timbre: bright and youthful
        pace: quick
        pitch: medium-high
    sammy_jay:
      display_name: Sammy Jay
      tts:
        delivery: sharp, curious, and quick to take offense
        timbre: crisp and piercing
        pace: brisk
        pitch: high
    reddy_fox:
      display_name: Reddy Fox
      tts:
        delivery: sly, confident, and hungry for an advantage
        timbre: smooth and slightly husky
        pace: measured
        pitch: medium-low
  chapters:
    - id: ch01
      title: A Foolish Risk
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            To risk your life when there is no need is foolish indeed. Never forget that. And never do anything as wild as what Peter Rabbit was doing now. What was he doing? Why, he was putting himself in danger of being caught by Reddy Fox, all for the sake of a joke. Can you imagine anything more foolish?
        - id: ch01-b02
          speaker: narrator
          text: >-
            Yet Peter was no different from plenty of people who take careless risks every day just to save a few minutes, or for some other reason just as foolish. He never once stopped to think about the dreadful thing that might happen if his plan failed. He did not think about little Mrs. Peter waiting in the dear Old Briar-patch, or how she would feel if he never came home. That is the trouble with thoughtlessness. It forgets about everyone else.
    - id: ch02
      title: Reddy Creeps Closer
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            Reddy Fox was creeping behind the old stone wall at the edge of the Old Orchard. Peter knew exactly where he was, though Reddy had no idea Peter knew. If Reddy had guessed that, he might have suspected another of Peter's tricks.
        - id: ch02-b02
          speaker: peter_rabbit
          text: >-
            Reddy will peek over the wall. When he sees me, he'll be sure he can catch me this time. Then he'll sneak to the lowest part and jump over. I must be ready to run the instant he jumps.
        - id: ch02-b03
          speaker: narrator
          text: >-
            Everything happened just as Peter expected. He made it look as though he cared about nothing but Sammy Jay, yet all the while he kept watching the low place in the wall. Soon Reddy's sharp nose appeared above the stones. Reddy was making sure Peter was still there. The instant that sharp nose vanished, Peter got ready to run for his life.
    - id: ch03
      title: The Chase to the Barrel
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            A second later, Reddy sprang over the wall. Peter shot away as fast as he could, with Reddy almost on his heels. Sammy had been so busy calling Peter names that he had not noticed Reddy at all. He had never seen the fox creeping along behind the wall. Now he forgot their quarrel.
        - id: ch03-b02
          speaker: sammy_jay
          text: >-
            Run, Peter! Run!
          emotion: surprised
        - id: ch03-b03
          speaker: narrator
          text: >-
            That was just like Sammy. Peter ran with all his might because he had to. When Reddy saw him heading toward the Green Meadows, he grinned. The dear Old Briar-patch was far away, and Reddy felt certain he would catch Peter long before he reached it.
        - id: ch03-b04
          speaker: narrator
          text: >-
            Reddy watched closely for Peter to dodge back toward the old stone wall. He meant to prevent that. But Peter never tried. He raced straight toward the edge of the hill above the Green Meadows. Only then did Reddy notice the old barrel lying there on its side.
        - id: ch03-b05
          speaker: reddy_fox
          text: >-
            Does Peter think he can hide in that barrel? I passed it a few days ago. One end is open, but the other is closed. If he goes inside, I'll catch him without much more running.
        - id: ch03-b06
          speaker: narrator
          text: >-
            Reddy grinned again and chuckled. Lipperty-lipperty-lip went Peter, with Reddy right behind him. To Sammy, it looked as though Reddy would surely catch Peter in only a few more jumps.
        - id: ch03-b07
          speaker: sammy_jay
          text: >-
            Run, Peter! Oh, run! Keep going!
          emotion: fearful
        - id: ch03-b08
          speaker: narrator
          text: >-
            Sammy might quarrel with Peter, but he did not want Peter to come to real harm.
    - id: ch04
      title: Peter's Flying Jump
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            By the time Peter reached the barrel, Reddy was so close that Peter was almost sure he could feel the fox's breath. Then Peter made a splendid flying jump right over the old barrel and kept going.
        - id: ch04-b02
          speaker: narrator
          text: >-
            Peter kept racing down the hill, lipperty-lipperty-lip, as fast as ever he could go. He ran straight to an old house that belonged to Johnny Chuck, a house Peter knew well.
        - id: ch04-b03
          speaker: narrator
          text: >-
            When Peter reached it, he turned to see what was happening behind him. Sammy Jay was screaming, and Peter heard other sounds as well, so he knew a great deal was going on. In fact, he suspected that the joke he had planned was working out exactly as he had hoped.
