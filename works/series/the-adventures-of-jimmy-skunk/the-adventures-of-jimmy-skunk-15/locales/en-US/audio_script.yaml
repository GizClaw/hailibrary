audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm, observant storytelling with a gently playful edge
        timbre: clear and rounded
        pace: measured
        pitch: medium
    jimmy_skunk:
      display_name: Jimmy Skunk
      tts:
        delivery: easygoing and deliberate, with quiet confidence
        timbre: mellow and grounded
        pace: unhurried
        pitch: medium-low
    unc_billy_possum:
      display_name: Unc' Billy Possum
      tts:
        delivery: sly and good-humored, with an easy Southern drawl
        timbre: light and wiry
        pace: relaxed
        pitch: medium-high
  chapters:
    - id: ch01
      title: A Second Meeting
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            Jimmy Skunk could think of nothing but eggs. The longer he thought about them, the more he wanted some. After he and Unc' Billy Possum parted in the Green Forest, Jimmy went back to the Green Meadows. He prowled around, searching for the nests of his feathered neighbors who built on the ground. But he had no better luck than before.
        - id: ch01-b02
          speaker: narrator
          text: >-
            Unc' Billy was doing no better. He simply could not stop thinking about Mrs. Grouse's eggs. Every time he tried to forget them, they filled his thoughts again.
        - id: ch01-b03
          speaker: unc_billy_possum
          text: >-
            Ah can feel it in mah bones. There isn't a bit of use in hunting for those eggs. No, Sah, not a bit. Ah've already looked everywhere Ah can think of. Still, there isn't anything else Ah need to do, and those eggs surely would taste good. Ah reckon Ah must need them. Why else would Ah keep thinking about them? Carrying eggs on mah mind all day is mighty uncomfortable. Carrying them in mah stomach would be much nicer. Yes, Sah, it surely would.
        - id: ch01-b04
          speaker: narrator
          text: >-
            Unc' Billy had watched Jimmy amble away up the Lone Little Path while he talked to himself. Then he grinned and began to wander without any particular place in mind. Perhaps, if he was lucky, chance would lead him to Mrs. Grouse's nest.
        - id: ch01-b05
          speaker: narrator
          text: >-
            But no matter what he did, Unc' Billy could not put eggs out of his thoughts. The more he thought about them, the more he wanted some. Soon he was thinking about Farmer Brown's henhouse.
        - id: ch01-b06
          speaker: narrator
          text: >-
            Long ago, Unc' Billy had promised himself that he would never go there again. Now his hunger for eggs was stronger than that promise. He waited until jolly, round, red Mr. Sun had gone down behind the Purple Hills. Black Shadows crept across the Green Meadows and through the Green Forest. Then Unc' Billy slipped away, taking care that old Mrs. Possum would not guess where he was going.
        - id: ch01-b07
          speaker: narrator
          text: >-
            He came out of the Green Forest and kept close to the Black Shadows beside the old stone wall. The wall ran along the edge of the Old Orchard, and Unc' Billy followed it until he reached Farmer Brown's henhouse.
        - id: ch01-b08
          speaker: narrator
          text: >-
            There he stopped and listened. He could find no sign of Bowser the Hound. Unc' Billy let out a soft sigh of relief. Then he crept around one corner of the henhouse, heading for a certain hole underneath it that he remembered very well.
        - id: ch01-b09
          speaker: narrator
          text: >-
            Just as he reached the hole, something white caught his eye. It moved. It was coming toward him from the far end of the henhouse. Unc' Billy froze. He could not decide whether to run away or stay where he was.
        - id: ch01-b10
          speaker: narrator
          text: >-
            Then he heard a little grunt. At once, he decided to stay. He even began to grin. A few seconds later, Jimmy Skunk came up beside him. The white thing Unc' Billy had seen was the stripe on Jimmy's coat.
        - id: ch01-b11
          speaker: narrator
          text: >-
            Jimmy nearly bumped into Unc' Billy. He gave a little snort of surprise.
        - id: ch01-b12
          speaker: jimmy_skunk
          text: >-
            What brings you here?
        - id: ch01-b13
          speaker: unc_billy_possum
          text: >-
            Ah'm only taking a little walk to sharpen mah appetite. And what brings you here, Brer Skunk?
        - id: ch01-b14
          speaker: narrator
          text: >-
            Unc' Billy's grin grew broader than ever.
        - id: ch01-b15
          speaker: jimmy_skunk
          text: >-
            I'm out for the very same reason.
        - id: ch01-b16
          speaker: narrator
          text: >-
            Jimmy chuckled. Meeting Unc' Billy there was the last thing he had expected.
        - id: ch01-b17
          speaker: jimmy_skunk
          text: >-
            Well, this is a surprise. I suppose you've been thinking about the same thing all day that I have.
        - id: ch01-b18
          speaker: unc_billy_possum
          text: >-
            Ah reckon Ah have.
        - id: ch01-b19
          speaker: narrator
          text: >-
            And there beside Farmer Brown's henhouse, Jimmy Skunk and Unc' Billy Possum both grinned.
