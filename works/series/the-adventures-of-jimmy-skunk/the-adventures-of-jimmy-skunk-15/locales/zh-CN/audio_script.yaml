audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 亲切机敏，带着温和的调侃
        timbre: 温暖清亮
        pace: 舒缓而有变化
        pitch: 中音
    jimmy_skunk:
      display_name: 臭鼬吉米
      tts:
        delivery: 平日温厚从容，发怒时严厉干脆
        timbre: 沉稳厚实
        pace: 从容偏慢
        pitch: 中低音
    unc_billy_possum:
      display_name: 比利负鼠大叔
      tts:
        delivery: 乡音浓厚，风趣世故，玩笑说得一本正经
        timbre: 粗暖而略带沙哑
        pace: 慢条斯理
        pitch: 中低音
  chapters:
    - id: ch01
      title: 谁也忘不了鸡蛋
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 臭鼬吉米怎么也忘不了鸡蛋。越想越馋，越馋越想。和比利负鼠大叔在绿森林里分开以后，他又回到绿草地，到处寻找那些把窝筑在地上的羽族邻居。可惜，他的运气还是和先前一样糟。
        - id: ch01-b02
          speaker: narrator
          text: 比利大叔也没比他强。松鸡太太的那窝蛋一直在他脑子里打转。他越想忘，反倒记得越牢。
        - id: ch01-b03
          speaker: unc_billy_possum
          text: 俺这把骨头早告诉俺啦，再找下去也没半点儿用。对，先生，没半点儿用。能想到的地方，俺已经找了个遍。可俺眼下也没别的要紧事，那些蛋吃起来准香得很。
        - id: ch01-b04
          speaker: unc_billy_possum
          text: 俺看哪，一定是俺身子需要鸡蛋。不然，俺怎么老想着它们？把鸡蛋一直搁在心上，实在累得慌。要能装进肚子里，俺可就享受啦。没错，俺一定会好好享受。
        - id: ch01-b05
          speaker: narrator
          text: 比利大叔说着，望了望沿孤独小径慢慢走远的吉米，又咧嘴一笑。他漫无目的地四处闲逛，只盼运气能把自己领到松鸡太太的窝前。
    - id: ch02
      title: 黑影里的鸡舍
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 可是不管怎么努力，比利大叔都甩不掉鸡蛋这个念头。他越想越馋，最后又想起了农夫布朗家的鸡舍。他早就下过决心，再也不去那里。偏偏想吃鸡蛋的念头越来越强，把那个好端端的决心彻底挤到了一边。
        - id: ch02-b02
          speaker: narrator
          text: 快活的太阳先生圆滚滚、红彤彤地落到紫山后面，黑影也悄悄爬过绿草地，钻进绿森林。就在这时，比利大叔偷偷溜了出去。他处处小心，生怕老负鼠太太猜出自己要去哪里。
        - id: ch02-b03
          speaker: narrator
          text: 比利大叔离开绿森林，沿着老果园边上的旧石墙往前走。他始终藏在黑影里，一路悄悄摸到了农夫布朗家的鸡舍。
        - id: ch02-b04
          speaker: narrator
          text: 到了那里，他先停下来听了听。四周没有猎犬鲍泽的动静。比利大叔终于轻轻舒了口气，这才绕过鸡舍的一角，爬向鸡舍底下那个他记得很清楚的洞口。
        - id: ch02-b05
          speaker: narrator
          text: 他刚爬到洞口，就看见一团白色的东西动了起来，正从鸡舍另一头朝自己走来。比利大叔顿时停在原地，不知道该逃还是该留。接着，他听见一声轻轻的哼哼，便决定留下，脸上甚至露出了笑容。
        - id: ch02-b06
          speaker: narrator
          text: 几秒以后，臭鼬吉米走到了他面前。原来，比利大叔看见的那团白色，是吉米外套上的白条纹。
    - id: ch03
      title: 第二次碰面
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 吉米险些撞上比利大叔，惊得轻轻哼了一声。
        - id: ch03-b02
          speaker: jimmy_skunk
          text: 你跑到这里来干什么？
        - id: ch03-b03
          speaker: unc_billy_possum
          text: 没什么，俺只是出来走走，好让自己胃口更好一点儿。
        - id: ch03-b04
          speaker: narrator
          text: 比利大叔的嘴咧得更开了。
        - id: ch03-b05
          speaker: unc_billy_possum
          text: 那你呢，臭鼬老弟？你上这儿来干什么？
        - id: ch03-b06
          speaker: jimmy_skunk
          text: 和你一样。
        - id: ch03-b07
          speaker: narrator
          text: 吉米低声笑了起来。
        - id: ch03-b08
          speaker: jimmy_skunk
          text: 真没想到，咱们会在这里碰面。我看哪，你这一整天惦记的东西，一定和我惦记的一模一样。
        - id: ch03-b09
          speaker: unc_billy_possum
          text: 俺看也是。
        - id: ch03-b10
          speaker: narrator
          text: 两个人都咧嘴笑了。
