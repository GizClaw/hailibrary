audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 亲切机敏，带着温和的调侃
        timbre: 温暖清亮
        pace: 舒缓而有变化
        pitch: 中音
    reddy_fox:
      display_name: 红狐雷迪
      tts:
        delivery: 狡猾自信，盘算时带着得意
        timbre: 圆润低沉
        pace: 从容偏慢
        pitch: 中低音
    billy_mink:
      display_name: 水貂比利
      tts:
        delivery: 活泼直率，取笑人时尖刻顽皮
        timbre: 清脆明亮
        pace: 轻快
        pitch: 中高音
  chapters:
    - id: ch01
      title: 雷迪羞愧地离开
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 偷偷溜走，就是躲开大家的眼睛，悄悄离开。通常，只有那些不知为什么羞于见人的家伙，才会这么做。臭鼬吉米把那股可怕的“香水”喷到雷迪脸上以后，雷迪的眼睛刚能看见，便往绿森林走去。他只想独自躲起来。
        - id: ch01-b02
          speaker: narrator
          text: 平日里，雷迪总是昂着头小跑，毛茸茸的大尾巴翘得神气十足。这一次可不是。他低着脑袋，把漂亮的尾巴夹在两腿之间，任谁看见都知道他有多羞愧。那股气味牢牢粘在红毛上，至少在很长一段时间里，他都休想摆脱。雷迪心里明白，自己走到哪里，邻居们都会捏着鼻子笑他，谁也不肯跟他打交道。
        - id: ch01-b03
          speaker: narrator
          text: 雷迪就这样穿过绿草地，偷偷朝绿森林走。他既恶心又难受，心里又羞又苦，连冠蓝鸦萨米都懒得生气了。萨米一路取笑他，还嚷着说，雷迪受的惩罚一点儿也不算多，完全是他自作自受。
    - id: ch02
      title: 哪里也容不下他
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 可怜的雷迪不知道该怎么办，更不知道能去哪儿。他不敢回家。老狐狸奶奶警告过他许多次，绝不能招惹臭鼬吉米。要是他胆敢把这股可怕的气味带到家附近，奶奶准会把他赶出去，绝不会原谅他。
        - id: ch02-b02
          speaker: narrator
          text: 很快，绿森林和绿草地上的小居民都会知道这件事。萨米一定会四处传扬。到时，大家会指着雷迪取笑个没完，这件事永远也不会过去。他觉得自己再也、再也抬不起头，也翘不起尾巴了。每隔几分钟，他就停下来，在地上滚过来又滚过去，拼命想把那股气味蹭掉。
        - id: ch02-b03
          speaker: narrator
          text: 到了绿森林，雷迪急忙跑到欢笑溪边洗眼睛。他今天的运气实在糟透了，偏偏水貂比利这时经过。比利根本不用问，就知道发生了什么。他捏紧鼻子叫起来。
        - id: ch02-b04
          speaker: billy_mink
          text: 呸，这味儿真难闻！
          emotion: disgusted
        - id: ch02-b05
          speaker: narrator
          text: 比利立刻转身跑远，直到闻不见那股“香水”才停下。他隔着老远取笑雷迪，把能想到的气人话说了个遍。雷迪完全不理他。他已经难受得连架也不想吵了。
    - id: ch03
      title: 躲到老郊场
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 洗过脸，雷迪总算好受了一点儿。水洗不掉那股可怕的气味，却洗去了眼睛里的刺痛。接下来，他得想想该怎么办。
        - id: ch03-b02
          speaker: reddy_fox
          text: 我只能躲得离大家越远越好。看来，我得去老郊场住上一阵子了。
        - id: ch03-b03
          speaker: narrator
          text: 雷迪动身去老郊场，一路尽量藏着，不让谁看见。走着走着，他想起老郊狼也住在那里。他当然不能靠近老郊狼的家。要是老郊狼闻见这股难闻的“香水”，又查出气味正是雷迪带来的，一定会把他赶出老郊场。真到了那一步，雷迪还能去哪儿呢？
        - id: ch03-b04
          speaker: narrator
          text: 于是，雷迪来到老郊场最偏僻的角落，钻进一座旧洞穴。很久以前，他和奶奶曾挖过这个洞。那时候，他们偷了鸡，农夫布朗家的男孩和猎犬鲍泽一路追捕，逼得他们只能住在老郊场。雷迪在洞里伸直身子躺下，心里别提多难受了。他越想越委屈，忍不住低声嘟囔起来。
    - id: ch04
      title: 会不会是彼得的圈套
      blocks:
        - id: ch04-b01
          speaker: reddy_fox
          text: 要真是我的错，我还不会这么难受。可这不是我的错呀。我不知道吉米在木桶里，也没想让木桶滚下山坡。这全是意外，而且……
        - id: ch04-b02
          speaker: narrator
          text: 雷迪突然不说了。他那双黄眼睛里慢慢露出了怀疑的神色。过了一会儿，他才缓缓开口。
        - id: ch04-b03
          speaker: reddy_fox
          text: 会不会是彼得兔早就知道吉米在桶里，故意设下圈套，让我惹上这些麻烦？会不会呢？
