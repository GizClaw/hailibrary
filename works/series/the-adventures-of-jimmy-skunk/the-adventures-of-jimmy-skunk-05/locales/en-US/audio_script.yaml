audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm, observant storytelling with a gently playful edge
        timbre: clear and rounded
        pace: measured
        pitch: medium
    sammy_jay:
      display_name: Sammy Jay
      tts:
        delivery: sharp, curious, and quick to take offense
        timbre: crisp and piercing
        pace: brisk
        pitch: high
    reddy_fox:
      display_name: Reddy Fox
      tts:
        delivery: sly and self-important, turning low and miserable when defeated
        timbre: smooth and slightly nasal
        pace: moderate
        pitch: medium
    billy_mink:
      display_name: Billy Mink
      tts:
        delivery: lively, teasing, and boldly amused
        timbre: bright and nimble
        pace: quick
        pitch: medium-high
  chapters:
    - id: ch01
      title: Reddy Fox Sneaks Away
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            When someone sneaks away, he slips off while trying not to be seen. Usually, it is because he is ashamed. As soon as Reddy Fox could see again after Jimmy Skunk had thrown that terrible perfume in his face, he headed for the Green Forest. He wanted to be alone.
        - id: ch01-b02
          speaker: narrator
          text: >-
            This time Reddy did not trot along with his head high and his big, plumy tail held proudly. No indeed. His head hung low, and his handsome tail drooped between his legs. He looked like shame itself. Jimmy's terrible perfume clung to his red coat, and Reddy knew it would not come off for a long, long time.
        - id: ch01-b03
          speaker: narrator
          text: >-
            Reddy also knew what would happen wherever he went. His neighbors would hold their noses, laugh at him, and want nothing to do with him. So he crept across the Green Meadows toward the Green Forest. He felt too sick, mean, and unhappy even to be angry with Sammy Jay. All the while, Sammy made fun of him and said that Reddy had gotten exactly what he deserved.
    - id: ch02
      title: Nowhere to Go
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            Poor Reddy did not know what to do or where to go. He could not go home. Old Granny Fox would drive him right back out. Again and again, she had warned him not to provoke Jimmy Skunk. Reddy knew she would never forgive him for bringing that terrible perfume near their home.
        - id: ch02-b02
          speaker: narrator
          text: >-
            Before long, every little person in the Green Forest and on the Green Meadows would hear what had happened. Sammy Jay would make sure of that. Reddy could already imagine them pointing at him and laughing. He would never hear the end of it. It seemed as if he would never be able to hold his head and tail high again.
        - id: ch02-b03
          speaker: narrator
          text: >-
            Every few minutes, Reddy stopped and rolled over and over on the ground. But no matter how much he rolled, that dreadful perfume stayed with him.
        - id: ch02-b04
          speaker: narrator
          text: >-
            When he reached the Green Forest, he hurried to the Laughing Brook to wash his eyes. Just his luck, Billy Mink came by while Reddy was washing. Billy understood what had happened without being told.
        - id: ch02-b05
          speaker: billy_mink
          text: Phew! What an awful smell!
          emotion: disgusted
        - id: ch02-b06
          speaker: narrator
          text: >-
            Billy held his nose and hurried beyond the perfume's reach. Then he stopped and teased Reddy with every provoking thing he could think of. Reddy paid no attention at all. He was far too miserable to quarrel.
    - id: ch03
      title: A Plan for the Old Pasture
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            After Reddy washed his face, he felt a little better. The water could not carry away the awful smell, but it did stop his eyes from smarting. Now he had to decide what to do next.
        - id: ch03-b02
          speaker: reddy_fox
          text: >-
            There is only one thing I can do. I have to get as far away from everybody as possible. I suppose I'll have to live up in the Old Pasture for a while.
        - id: ch03-b03
          speaker: narrator
          text: >-
            Reddy set out for the Old Pasture and kept himself hidden as much as he could. Along the way, he remembered that Old Man Coyote lived there. Reddy must not go anywhere near the coyote's home. If Old Man Coyote smelled that awful perfume and learned who had brought it, he would surely chase Reddy out of the Old Pasture. Then where could Reddy go?
        - id: ch03-b04
          speaker: narrator
          text: >-
            So Reddy made his way to the loneliest part of the pasture. There he crept into an old house that he and Granny Fox had dug long ago. They had lived in it back when Farmer Brown's boy and Bowser the Hound were hunting them for stealing chickens.
    - id: ch04
      title: Reddy Begins to Wonder
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            Reddy stretched himself out inside the old house, perfectly miserable.
        - id: ch04-b02
          speaker: reddy_fox
          text: >-
            It would not feel quite so bad if this really were my fault. But it isn't! I had no idea Jimmy Skunk was inside that barrel, and I never meant to send it rolling down the hill. The whole thing was an accident, and—
        - id: ch04-b03
          speaker: narrator
          text: >-
            Reddy stopped. A suspicious look crept into his yellow eyes.
        - id: ch04-b04
          speaker: reddy_fox
          text: >-
            I wonder if Peter Rabbit knew Jimmy was in that barrel. Maybe Peter planned all of this trouble for me. I wonder.
