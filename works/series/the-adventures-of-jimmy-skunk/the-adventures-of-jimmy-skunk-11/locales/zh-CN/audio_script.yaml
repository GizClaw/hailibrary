audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 亲切机敏，带着温和的调侃
        timbre: 温暖清亮
        pace: 舒缓而有变化
        pitch: 中音
    jimmy_skunk:
      display_name: 臭鼬吉米
      tts:
        delivery: 平日温厚从容，发怒时严厉干脆
        timbre: 沉稳厚实
        pace: 从容偏慢
        pitch: 中低音
    peter_rabbit:
      display_name: 彼得兔
      tts:
        delivery: 机灵顽皮，盘算时压低声音
        timbre: 年轻明亮
        pace: 轻快
        pitch: 中高音
  chapters:
    - id: ch01
      title: 一句半真半假的话
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 无论做什么，说到就要做到。对自己的内心，也要真诚可靠。
        - id: ch01-b02
          speaker: narrator
          text: 臭鼬吉米朝土拨鼠约翰旧屋的门道里喊，说天黑以后还会回来。这句话其实有一半是在逗彼得。他就是想让彼得心里不安，多发一会儿愁。吉米早已不生气了，好脾气也回来了。一想起彼得的恶作剧，他自己甚至都有点儿想笑。
        - id: ch01-b03
          speaker: narrator
          text: 不过，吉米觉得不能一点儿教训也不给，就让彼得这样过关。他打算吓唬彼得一下。旧屋门口里面住着黄胡蜂，彼得白天不敢出来。他也不敢当面碰上吉米，生怕自己会像红狐雷迪那样吃苦头。所以吉米才说，天黑后他要回来。
        - id: ch01-b04
          speaker: narrator
          text: 让彼得困在里面，始终琢磨着该怎么逃走，这就是吉米的主意。经过这一回，彼得下次再想用同样的把戏捉弄谁，大概就不会那么大胆了。
    - id: ch02
      title: 说出口就得做到
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 吉米慢悠悠地走开，找甲虫去了。他边走边笑，笑了一路，怎么也停不下来。
        - id: ch02-b02
          speaker: jimmy_skunk
          text: 彼得这会儿准在后悔，不该想出那个玩笑来捉弄红狐雷迪和我。今晚我可能回去，也可能不回去。他弄不清我到底会不会来，自然不敢出来。
        - id: ch02-b03
          speaker: narrator
          text: 吉米说着说着停了下来。他认真地挠挠头，叹了一口气。随后，他又挠了一回，又叹了一声。
        - id: ch02-b04
          speaker: jimmy_skunk
          text: 其实我今晚真不想再跑一趟，可我恐怕非去不可。既然说了会回去，我就得做到。我向来都觉得，人得说话算数。要是我失了信，哪天让彼得知道了，以后我再答应做什么，他可不会信我。
        - id: ch02-b05
          speaker: jimmy_skunk
          text: 对，先生，我一定得回去。你得让人家知道，自己说出口的话都是当真的。守信用，别人才会敬重你。
    - id: ch03
      title: 天黑以后
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 吉米天生有点儿懒，不愿再走远，便只走到老果园边上。那里离土拨鼠约翰的旧屋不远，而彼得还被困在屋里。吉米找了一块暖和又有阳光的地方，蜷起来睡觉。这一睡，他就在那儿待了整整一天。
        - id: ch03-b02
          speaker: narrator
          text: 圆滚滚、红彤彤的太阳先生落到紫山背后，黑影也一群群越过绿草地。吉米这才起身，打了个哈欠，又笑了一声，然后不紧不慢地走向那座旧屋。
        - id: ch03-b03
          speaker: narrator
          text: 门阶的沙地上没有新脚印，吉米一看就明白，彼得始终没出来。他坐着等到天色全黑，才把头探进门口。黄胡蜂已经过夜去了。
        - id: ch03-b04
          speaker: jimmy_skunk
          text: 出来呀，彼得。我就在这里等你！
          emotion: angry
        - id: ch03-b05
          speaker: narrator
          text: 吉米朝门道里面喊，故意把嗓音装得尽可能生气，心里却一直在偷笑。喊完，他从容地转过身，忙自己的事去了。他遵守了诺言。
    - id: ch04
      title: 最难熬的一天
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 对彼得兔来说，那是他记得的日子里最难熬的一天。黄胡蜂蜇过的伤处又痛又辣。他从早到晚都在担心，真碰见臭鼬吉米会有什么下场。偏偏这时候，他的肚子还饿了。
        - id: ch04-b02
          speaker: narrator
          text: 彼得只剩下一点儿希望。他盼着天黑以后，吉米不会真的回来。夜色才刚露头，他就沿着门道往上爬了一段，伸直身子趴在那里。他得等到完全确定，那些可怕的黄胡蜂全都睡着了。
        - id: ch04-b03
          speaker: narrator
          text: 彼得终于快要拿定主意，觉得冲出去不会有事了。就在这时，吉米的声音沿着门道传了下来。可怜的彼得听见那个声音，一颗心几乎碎了。
        - id: ch04-b04
          speaker: peter_rabbit
          text: 他真的回来了。他没有食言。
          emotion: sad
        - id: ch04-b05
          speaker: narrator
          text: 彼得半哭着说完，只好又退回土拨鼠约翰从前的卧室。
    - id: ch05
      title: 天亮前逃出去
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 那天夜里剩下的大半时间，彼得一直躲在卧室里。哪怕肚子空得发疼，他也没敢离开。直到太阳先生快要升起，他才鼓起勇气，从土拨鼠约翰的旧屋里飞奔出去。
        - id: ch05-b02
          speaker: narrator
          text: 黄胡蜂还没有醒，彼得平安闯过了它们的家。他一颗心都提到了嗓子眼，猛地蹿出门口。外面没有臭鼬吉米。彼得总算松了一口气，立刻朝亲切又安全的老荆棘丛跑去。一蹦一跳，一蹦一跳，他使出全身力气，跑得飞快。
        - id: ch05-b03
          speaker: peter_rabbit
          text: 我再也不拿别人开玩笑了。再也不干了。
        - id: ch05-b04
          speaker: narrator
          text: 彼得一路跑，一路把这句话说了一遍又一遍。
