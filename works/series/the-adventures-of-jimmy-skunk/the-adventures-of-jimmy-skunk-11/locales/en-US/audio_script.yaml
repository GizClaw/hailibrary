audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm, observant storytelling with a gently playful edge
        timbre: clear and rounded
        pace: measured
        pitch: medium
    peter_rabbit:
      display_name: Peter Rabbit
      tts:
        delivery: lively, clever, and pleased with his own schemes
        timbre: bright and youthful
        pace: quick
        pitch: medium-high
    jimmy_skunk:
      display_name: Jimmy Skunk
      tts:
        delivery: easygoing and deliberate, with quiet confidence
        timbre: mellow and grounded
        pace: unhurried
        pitch: medium-low
  chapters:
    - id: ch01
      title: A Little Fright for Peter
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            Whatever you do, keep your word, and be true to yourself deep down inside.
        - id: ch01-b02
          speaker: narrator
          text: >-
            Jimmy Skunk had shouted down the hall of Johnny Chuck's old house that he would return when it was dark. At the time, he was half joking. He wanted Peter Rabbit to feel uneasy and wonder what was going to happen.
        - id: ch01-b03
          speaker: narrator
          text: >-
            The truth was, Jimmy was no longer angry. His good nature had returned, and he was almost ready to laugh at Peter's trick himself. Still, he didn't think Peter should escape without any punishment. A little fright ought to do it.
        - id: ch01-b04
          speaker: narrator
          text: >-
            Jimmy knew Peter would not come out in daylight. The Yellow Jackets had built their home just inside the doorway. Peter would not dare face Jimmy either, because he feared getting the same treatment Reddy Fox had received.
        - id: ch01-b05
          speaker: narrator
          text: >-
            That was why Jimmy promised to return after dark. If Peter had to stay trapped for a while, worrying over how he could get away, he might think twice before playing another trick like that.
        - id: ch01-b06
          speaker: narrator
          text: >-
            Jimmy ambled off to hunt for beetles, chuckling again and again.
        - id: ch01-b07
          speaker: jimmy_skunk
          text: >-
            By now, I expect Peter wishes he'd never thought up that joke on Reddy Fox and me. Maybe I'll go back tonight, and maybe I won't. Peter won't know, and he won't dare come out.
    - id: ch02
      title: Jimmy Makes Up His Mind
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            Then Jimmy stopped. He scratched his head and thought about it. He sighed, scratched his head once more, and sighed again.
        - id: ch02-b02
          speaker: jimmy_skunk
          text: >-
            I truly don't want to go back tonight, but I suppose I must. I said I would, so I have to do it. I believe in keeping my word.
        - id: ch02-b03
          speaker: jimmy_skunk
          text: >-
            If I break my word and Peter finds out someday, he won't believe me the next time I say I'll do something. Yes, sir, I have to return. People should know that when I say something, I mean it. Keeping your word earns their respect.
        - id: ch02-b04
          speaker: narrator
          text: >-
            Jimmy was naturally rather lazy. He decided to go no farther than the edge of the Old Orchard, just a little way above the old house where Peter remained a prisoner.
        - id: ch02-b05
          speaker: narrator
          text: >-
            There he found a warm, sunny place, curled up, and took a nap. In fact, Jimmy spent the whole day there.
    - id: ch03
      title: A Promise Kept at Dark
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            At last, jolly, round, red Mr. Sun went to bed behind the Purple Hills. Black Shadows came marching across the Green Meadows. Jimmy got up, yawned, and chuckled. Then he slowly ambled down to Johnny Chuck's old house.
        - id: ch03-b02
          speaker: narrator
          text: >-
            Jimmy looked at the footprints in the sand by the door. They showed him that Peter had not been outside. So Jimmy sat down and waited until darkness had fully settled.
        - id: ch03-b03
          speaker: narrator
          text: >-
            Then he poked his head through the doorway. The Yellow Jackets had gone to bed for the night.
        - id: ch03-b04
          speaker: jimmy_skunk
          text: >-
            Come on out, Peter! I'm right here waiting for you!
          emotion: angry
        - id: ch03-b05
          speaker: narrator
          text: >-
            Jimmy made himself sound as angry as he could, though he was chuckling inside. Then he calmly turned away and went about his business. Jimmy Skunk had kept his word.
    - id: ch04
      title: Peter's Long Night
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            For Peter Rabbit, it had been one of the worst days he could remember. The Yellow Jacket stings ached and smarted. All day, he worried about what Jimmy might do if they met. And Peter was hungry too.
        - id: ch04-b02
          speaker: narrator
          text: >-
            Peter held on to one small hope. Perhaps Jimmy would not return after dark.
        - id: ch04-b03
          speaker: narrator
          text: >-
            At the first sign of night, Peter crept partway up the hall. He stretched out there and waited until he could be certain those dreadful Yellow Jackets were asleep.
        - id: ch04-b04
          speaker: narrator
          text: >-
            Peter had almost decided it was safe to scamper outside when Jimmy's voice came rolling down the hall. Poor Peter! Hearing it nearly broke his heart.
        - id: ch04-b05
          speaker: peter_rabbit
          text: >-
            He really came back. Jimmy kept his word.
          emotion: sad
        - id: ch04-b06
          speaker: narrator
          text: >-
            Peter half sobbed the words, then went all the way back to Johnny Chuck's old bedroom.
        - id: ch04-b07
          speaker: narrator
          text: >-
            He stayed there for nearly the rest of the night, even though his empty stomach hurt. Just before Mr. Sun was due to rise, Peter finally dared to dash out of the old house.
        - id: ch04-b08
          speaker: narrator
          text: >-
            He slipped safely past the Yellow Jackets' home because they were not awake yet. His heart seemed to jump into his mouth as he sprang through the doorway.
        - id: ch04-b09
          speaker: narrator
          text: >-
            Jimmy Skunk was gone. Peter sighed with relief and raced toward the dear, safe Old Briar-patch. Lipperty-lipperty-lip he went, as fast as his legs could carry him.
        - id: ch04-b10
          speaker: peter_rabbit
          text: >-
            I'll never play another joke. Never, never again!
        - id: ch04-b11
          speaker: narrator
          text: >-
            Peter said it over and over as he ran.
