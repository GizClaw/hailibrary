audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm, observant storytelling with a gently playful edge
        timbre: clear and rounded
        pace: measured
        pitch: medium
    jimmy_skunk:
      display_name: Jimmy Skunk
      tts:
        delivery: easygoing and deliberate, with quiet confidence
        timbre: mellow and grounded
        pace: unhurried
        pitch: medium-low
    unc_billy_possum:
      display_name: Unc' Billy Possum
      tts:
        delivery: sly and good-humored, with an easy Southern drawl
        timbre: light and wiry
        pace: relaxed
        pitch: medium-high
  chapters:
    - id: ch01
      title: Jimmy Skunk Gets a Bump
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            Jimmy Skunk followed close behind Unc' Billy Possum and slipped into the hole beneath Farmer Brown's henhouse. They had only just gone in when Bowser the Hound arrived, sniffing every step of the way. That made Unc' Billy nervous. At the hole, Bowser smelled where both animals had passed. He grew excited and started digging. My, how the dirt flew! All the while, Bowser whined because he was so eager.
        - id: ch01-b02
          speaker: narrator
          text: >-
            Unc' Billy moved fast. Over in one corner, he found a hole in the floor and squeezed through it. Farmer Brown's boy had meant to nail a board over that hole long ago, but the job had never been done. Even if Bowser dug beneath the henhouse, Unc' Billy knew he couldn't fit through this smaller opening. Safe inside, Unc' Billy took a long breath. He was all right for now. Whatever came later could wait.
        - id: ch01-b03
          speaker: narrator
          text: >-
            Jimmy hurried after him. Now, Jimmy wasn't hurrying because he was afraid. No, indeed. Bowser's sudden arrival had startled him, and that was why he had struggled to get through the first hole ahead of Unc' Billy. Afterward, Jimmy felt a little ashamed. He had not behaved with his usual dignity.
        - id: ch01-b04
          speaker: narrator
          text: >-
            Jimmy knew he could turn back and make Bowser go away, and he nearly did. But then he changed his mind. Unc' Billy was already through the hole in the floor. Besides, Jimmy remembered those eggs. That was what had brought both of them here, and leaving Unc' Billy alone near the nests would never do.
        - id: ch01-b05
          speaker: narrator
          text: >-
            So Jimmy Skunk did something he almost never does. He hurried. Yes, Sir, he hurried after Unc' Billy Possum, determined to get his share of the eggs he felt sure they would find up there.
        - id: ch01-b06
          speaker: narrator
          text: >-
            Nesting boxes stood in three rows along one side of the henhouse. The first row was close to the floor, the second was above it, and the third was higher still. Jimmy doesn't climb, but Unc' Billy is a famous climber.
        - id: ch01-b07
          speaker: jimmy_skunk
          text: >-
            I'll search the nests down here.
        - id: ch01-b08
          speaker: narrator
          text: >-
            As Jimmy spoke, he raised his tail in a way that made Unc' Billy nervous.
        - id: ch01-b09
          speaker: unc_billy_possum
          text: >-
            All right, Brer Skunk. Whatever yo' say.
        - id: ch01-b10
          speaker: narrator
          text: >-
            Unc' Billy quickly scrambled up to the middle row. Jimmy grinned and began checking the lower nests. As usual, he took his time. The first nest was empty. So was the second, and then the third. Jimmy was disappointed, to say the least, and he began moving a little faster.
        - id: ch01-b11
          speaker: narrator
          text: >-
            Up above, Unc' Billy hurried along the middle row without finding anything either. Before Jimmy had searched half of the lower nests, Unc' Billy was already trying the top row. He did find some eggs there, but they were hard china nest eggs, not real ones. Farmer Brown's boy had placed them in certain boxes to tempt the hens into laying there.
        - id: ch01-b12
          speaker: narrator
          text: >-
            Unc' Billy's disappointment was making him lose his temper. Whenever he peered into a nest and spotted one of those china eggs, he hoped it was real. Each time he discovered it wasn't, he grew a little angrier.
        - id: ch01-b13
          speaker: narrator
          text: >-
            Then Unc' Billy found one more false egg, and that was too much. In a burst of anger, he kicked it from the nest. Jimmy Skunk was standing just below. The hard china egg dropped straight down and struck him on the head.
        - id: ch01-b14
          speaker: narrator
          text: >-
            For a moment, Jimmy saw stars. At least, he thought he did. Then he saw the egg. He knew Unc' Billy had knocked it down, and he knew that was what had struck him.
        - id: ch01-b15
          speaker: narrator
          text: >-
            Jimmy was already sore at heart because he had found no eggs. Now he also had a sore bump on his head. Jimmy Skunk lost his temper, and that is something he rarely does.
