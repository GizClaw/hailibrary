audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 亲切机敏，带着温和的调侃
        timbre: 温暖清亮
        pace: 舒缓而有变化
        pitch: 中音
    jimmy_skunk:
      display_name: 臭鼬吉米
      tts:
        delivery: 平日温厚从容，发怒时严厉干脆
        timbre: 沉稳厚实
        pace: 从容偏慢
        pitch: 中低音
    unc_billy_possum:
      display_name: 比利负鼠大叔
      tts:
        delivery: 乡音浓厚，风趣世故，玩笑说得一本正经
        timbre: 粗暖而略带沙哑
        pace: 慢条斯理
        pitch: 中低音
  chapters:
    - id: ch01
      title: 鲍泽追来了
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 臭鼬吉米紧跟着比利负鼠大叔，才钻进农夫布朗鸡舍底下的洞，猎犬鲍泽就赶到了。他一边走，一边用力嗅着，听得比利大叔心里发慌。
        - id: ch01-b02
          speaker: narrator
          text: 到了洞口，鲍泽闻出比利大叔和吉米刚刚来过，一下子兴奋起来。他马上刨起土，刨得泥土到处飞，还急得不停呜呜叫。天哪，他可真卖力！
        - id: ch01-b03
          speaker: narrator
          text: 比利大叔不敢耽搁，赶紧挤过远处墙角的地板洞。农夫布朗家的男孩早就想用木板把它封住，却一直没动手。比利大叔很清楚，就算鲍泽真挖到鸡舍底下，也绝对过不了这个小洞。
        - id: ch01-b04
          speaker: narrator
          text: 等他安安稳稳进了鸡舍，终于长长地松了一口气。至少眼下安全了。以后会怎样？比利大叔才不愿现在就操心。
        - id: ch01-b05
          speaker: narrator
          text: 吉米也赶紧追了过去。可别以为他是害怕鲍泽。没错，先生，他可不害怕。只是鲍泽突然出现，把他吓了一跳，他刚才才会拼命想抢先钻进那个洞。
        - id: ch01-b06
          speaker: narrator
          text: 进洞以后，吉米想起自己方才那副慌张的样子，反倒有些难为情。他知道自己只要转过身，就能把鲍泽赶走，心里也很想这么做。可他又想了想，决定还是算了。
        - id: ch01-b07
          speaker: narrator
          text: 再说，比利大叔已经钻过地板洞，上了鸡舍。吉米没有忘记，他们两个都是来找鸡蛋的。要是让比利大叔独自在上面待久了，那还得了？
        - id: ch01-b08
          speaker: narrator
          text: 于是，吉米做了一件很少做的事。他加快了脚步。没错，先生，他匆匆追着比利大叔去了。上面准有鸡蛋，他得看住自己该得的那一份。
    - id: ch02
      title: 空空的窝箱
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 鸡舍靠近地板的一边，排着一排母鸡下蛋用的窝箱。上面是一排，再上面还有一排。吉米不会爬高，比利大叔却很会爬。
        - id: ch02-b02
          speaker: jimmy_skunk
          text: 下面这些窝归我。
        - id: ch02-b03
          speaker: narrator
          text: 吉米说话时抬了抬尾巴。比利大叔一看，心里顿时紧张起来。
        - id: ch02-b04
          speaker: unc_billy_possum
          text: 好嘞，好嘞，臭鼬老弟。俺听你的，你怎么说就怎么办。
        - id: ch02-b05
          speaker: narrator
          text: 比利大叔立刻爬上第二排窝箱。吉米咧嘴笑了笑，这才查看下面的一排。他还是老样子，慢悠悠的，一点儿也不着急。
        - id: ch02-b06
          speaker: narrator
          text: 第一个窝是空的，第二个也是空的，第三个仍旧什么都没有。这可太叫人失望了。吉米查窝的速度，不知不觉快了一些。
        - id: ch02-b07
          speaker: narrator
          text: 比利大叔倒是一开始就很着急。他从第二排的这个窝赶到那个窝，可结果一点儿也不比吉米好。吉米才查完自己那排的一半，比利大叔已经爬上最顶上一排了。
        - id: ch02-b08
          speaker: narrator
          text: 他倒是见到了几枚蛋，可那些全是硬邦邦的瓷蛋。农夫布朗家的男孩把它们放在窝里，是想哄母鸡到这些地方下蛋。
        - id: ch02-b09
          speaker: narrator
          text: 比利大叔一次次失望，脾气也越来越坏。每当他探头看见一枚瓷蛋，心里总盼着那会是真的。等他弄清又是假的，心里的火气便烧得更旺。
    - id: ch03
      title: 从天而降的瓷蛋
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 最后，比利大叔彻底失去了耐性。他又找到一枚瓷蛋，气得抬脚就踢，把那枚蛋直接踢出了窝。
        - id: ch03-b02
          speaker: narrator
          text: 偏偏这时候，臭鼬吉米就在下面。硬瓷蛋直直落下来，正好砸在他的头顶。
        - id: ch03-b03
          speaker: narrator
          text: 有那么一会儿，吉米眼前全是乱闪的金星。至少，他自己觉得看见了。接着，他瞧见那枚掉下来的蛋，也弄明白了。是比利大叔把蛋踢下来的，砸中他的就是这东西。
        - id: ch03-b04
          speaker: narrator
          text: 吉米一枚鸡蛋也没找到，心里本来就窝着火。现在，他的头上还肿起一个包，碰着就疼。
        - id: ch03-b05
          speaker: narrator
          text: 臭鼬吉米终于发火了。这样的事，在他身上可不常见。
