audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 亲切机敏，带着温和的调侃
        timbre: 温暖清亮
        pace: 舒缓而有变化
        pitch: 中音
    jimmy_skunk:
      display_name: 臭鼬吉米
      tts:
        delivery: 平日温厚从容，发怒时严厉干脆
        timbre: 沉稳厚实
        pace: 从容偏慢
        pitch: 中低音
    unc_billy_possum:
      display_name: 比利负鼠大叔
      tts:
        delivery: 乡音浓厚，风趣世故，玩笑说得一本正经
        timbre: 粗暖而略带沙哑
        pace: 慢条斯理
        pitch: 中低音
  chapters:
    - id: ch01
      title: 两个朋友都发了火
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 臭鼬吉米坐在农夫布朗鸡舍的地板上，不停揉着脑袋。他气得眼睛发红，抬头死死瞪着最上面那排窝箱。
        - id: ch01-b02
          speaker: narrator
          text: 这时是夜里，鸡舍里黑漆漆的。不过，吉米和许多披着毛皮的小家伙一样，黑暗里也看得清。他一眼就瞧见了比利负鼠大叔。比利大叔从上面的窝箱里探出脸，正不安地望着他。
        - id: ch01-b03
          speaker: jimmy_skunk
          text: 你明明是故意的！别想骗我，说什么你不是故意的！
          emotion: angry
        - id: ch01-b04
          speaker: unc_billy_possum
          text: 俺拿名誉担保，真不是故意的。那完全是个意外。俺砸到了你，心里也实在过意不去。
        - id: ch01-b05
          speaker: jimmy_skunk
          text: 说得可真好听，我才不信！你就是故意的，怎么解释都没用。下来跟我打一架！你有胆子就下来！
          emotion: angry
        - id: ch01-b06
          speaker: narrator
          text: 吉米越说越恼火。可听着听着，比利大叔也动了气。那枚蛋确实是他弄掉的，这一点他认。可他不知道吉米正好站在下面，蛋砸中吉米，怎么能全怪在他头上呢？
        - id: ch01-b07
          speaker: narrator
          text: 比利大叔觉得自己已经道过歉，能做的都做了。谁知吉米根本不肯相信他的话。他的一双小眼睛顿时气得直冒火。
        - id: ch01-b08
          speaker: unc_billy_possum
          text: 你真想打，就自己爬上来！俺哪儿也不去，就在这儿等着你！
          emotion: angry
    - id: ch02
      title: 谁也不肯让步
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 这一下，吉米气得更厉害了。他不会爬，根本到不了那么高的地方。比利大叔明明知道这一点，才敢安安稳稳地说要在上面等他。
        - id: ch02-b02
          speaker: jimmy_skunk
          text: 你就是个胆小鬼，一个没用的胆小鬼！我才不会爬上去。不过你听好了，我就在下面守着。除非你下来，不然哪怕等到明年，我也不走！
          emotion: angry
        - id: ch02-b03
          speaker: jimmy_skunk
          text: 谁敢拿东西砸我的头，我一定跟他算账。我以前还把你当朋友，现在可算看清你了！
          emotion: angry
        - id: ch02-b04
          speaker: unc_billy_possum
          text: 那你就慢慢等吧。俺寻思，你能在下面待多久，俺就能在上面待多久！
          emotion: angry
        - id: ch02-b05
          speaker: narrator
          text: 比利大叔一边回嘴，一边狠狠磨着牙，牙齿咬得咔咔直响。
        - id: ch02-b06
          speaker: jimmy_skunk
          text: 随你的便！我头上这个包，非得找你算清楚不可。算不清楚，我绝不罢休！
          emotion: angry
    - id: ch03
      title: 原来是失望惹的祸
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 就这样，他们你一句我一句，越吵越凶，还不停地骂对方。吵着吵着，两个人竟然忘了自己正待在农夫布朗的鸡舍里，也忘了这里根本不是他们该来的地方。
        - id: ch03-b02
          speaker: narrator
          text: 唉，这场面实在糟透了。可说到底，他们会闹成这样，是因为心里都太失望。
        - id: ch03-b03
          speaker: narrator
          text: 他们原以为鸡舍里一定有许多鸡蛋。找过之后才发现，一枚真正的鸡蛋也没有。原来，农夫布朗家的男孩晚上关好母鸡时，早把所有鸡蛋都收走了。
        - id: ch03-b04
          speaker: narrator
          text: 你有没有留意过？人一失望，脾气常常也跟着变坏。这可真是一件糟糕的事。
