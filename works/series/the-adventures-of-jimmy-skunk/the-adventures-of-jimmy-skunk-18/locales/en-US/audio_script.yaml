audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm, observant storytelling with a gently playful edge
        timbre: clear and rounded
        pace: measured
        pitch: medium
    jimmy_skunk:
      display_name: Jimmy Skunk
      tts:
        delivery: easygoing and deliberate, with quiet confidence
        timbre: mellow and grounded
        pace: unhurried
        pitch: medium-low
    unc_billy_possum:
      display_name: Unc' Billy Possum
      tts:
        delivery: sly and good-humored, with an easy Southern drawl
        timbre: light and wiry
        pace: relaxed
        pitch: medium-high
  chapters:
    - id: ch01
      title: A Sad, Sad Quarrel
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            Jimmy Skunk sat on the floor of Farmer Brown's henhouse. He rubbed his head and glared at the nests in the upper row, his eyes red with anger. Night had left the henhouse dark, but Jimmy could see in darkness, just as many other little people in fur can. Looking down at him was the worried face of Unc' Billy Possum.
        - id: ch01-b02
          speaker: jimmy_skunk
          text: >-
            You meant to do that! Don't try telling me you didn't.
          emotion: angry
        - id: ch01-b03
          speaker: unc_billy_possum
          text: >-
            On mah honor, Ah didn't mean it, Brer Skunk. It was a real accident, and Ah'm mighty sorry it happened.
        - id: ch01-b04
          speaker: jimmy_skunk
          text: >-
            That's a fine story, but I don't believe one word. You did it on purpose, and nothing you say will change my mind. Come down and fight me. I dare you!
          emotion: angry
        - id: ch01-b05
          speaker: narrator
          text: >-
            With every passing minute, Jimmy grew angrier.
        - id: ch01-b06
          speaker: narrator
          text: >-
            Now Unc' Billy began to get angry, too. It was entirely his fault that the egg had fallen. But he had not known Jimmy was standing right below, so he did not think it was his fault that the egg had struck him. Unc' Billy had apologized, and he could not see what more anyone could do.
        - id: ch01-b07
          speaker: narrator
          text: >-
            Then Jimmy refused to take him at his word. Being called a liar made Unc' Billy furious. His little eyes shone with rage.
        - id: ch01-b08
          speaker: unc_billy_possum
          text: >-
            If it's a fight yo' want, then come on up. Ah'll be waiting for yo' right here.
          emotion: angry
        - id: ch01-b09
          speaker: narrator
          text: >-
            That only made Jimmy angrier. He could not climb up to the nests, and he knew Unc' Billy knew it, too. From up there, Unc' Billy could safely promise to wait for him.
        - id: ch01-b10
          speaker: jimmy_skunk
          text: >-
            You're nothing but a worthless coward! I won't climb up there. I'll sit right here until you come down, even if I have to wait until next year. No one drops something on my head and gets away without paying for it. I used to think you were my friend. Now I know you aren't.
          emotion: angry
        - id: ch01-b11
          speaker: unc_billy_possum
          text: >-
            Wait just as long as yo' like. Ah reckon Ah can stay up here every bit as long as yo' can stay down there.
          emotion: angry
        - id: ch01-b12
          speaker: narrator
          text: >-
            Unc' Billy ground his teeth and snapped them together.
        - id: ch01-b13
          speaker: jimmy_skunk
          text: >-
            Have it your way. One way or another, you'll pay for this bump on my head.
          emotion: angry
        - id: ch01-b14
          speaker: narrator
          text: >-
            So the two of them went right on quarreling and calling each other names. For the moment, both forgot that neither one had any business being in that henhouse. It was a dreadful quarrel, and it had all begun because they were both terribly disappointed.
        - id: ch01-b15
          speaker: narrator
          text: >-
            Jimmy and Unc' Billy had expected to find plenty of eggs, but they had found none at all. Farmer Brown's boy had collected every egg when he closed the henhouse for the night.
        - id: ch01-b16
          speaker: narrator
          text: >-
            Have you ever noticed how often disappointment can put someone in a very bad temper?
