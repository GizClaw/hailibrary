audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 亲切机敏，带着温和的调侃
        timbre: 温暖清亮
        pace: 舒缓而有变化
        pitch: 中音
    jimmy_skunk:
      display_name: 臭鼬吉米
      tts:
        delivery: 平日温厚从容，发怒时严厉干脆
        timbre: 沉稳厚实
        pace: 从容偏慢
        pitch: 中低音
    unc_billy_possum:
      display_name: 比利负鼠大叔
      tts:
        delivery: 乡音浓厚，风趣世故，玩笑说得一本正经
        timbre: 粗暖而略带沙哑
        pace: 慢条斯理
        pitch: 中低音
    farmer_browns_boy:
      display_name: 农夫布朗家的男孩
      tts:
        delivery: 直爽利落，遇事机灵又有分寸
        timbre: 明亮结实
        pace: 轻快自然
        pitch: 中音
  chapters:
    - id: ch01
      title: 有备无患
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 小事看着不值一想，到了最后，却常常能带来意想不到的大结果。
        - id: ch01-b02
          speaker: narrator
          text: 农夫布朗家的男孩望着臭鼬吉米安安稳稳地走远，不禁咧嘴笑了。他挠挠头，认真想了想。
        - id: ch01-b03
          speaker: farmer_browns_boy
          text: 这真是再好不过的例子了，有准备就是管用。吉米早知道，要是我找他麻烦，他随时都能对付我。正因为这样，他也知道我不会去招惹他。瞧他走得多从容，好像他比我高大多少，就跟我比他高大多少一样。想躲开麻烦，事先做好准备准没错。
        - id: ch01-b04
          speaker: narrator
          text: 男孩说完，又转身走进鸡舍。他仔细看了一圈，想确定没有哪只傻母鸡睡在吉米够得着的地方。母鸡们全都平安，他便准备像往常一样，开始早晨喂鸡的活儿。就在这时，地板上一样东西引起了他的注意。那是一枚瓷做的引窝蛋。
        - id: ch01-b05
          speaker: farmer_browns_boy
          text: 咦！这枚蛋怎么会在这儿？一定是臭鼬吉米从下面哪个窝箱里拖出来的。
          emotion: surprised
    - id: ch02
      title: 一枚蛋引出的疑问
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 哪些窝箱里放了引窝蛋，男孩记得很清楚。他很快就把下面那排窝箱查了一遍，一枚蛋也没有少。
        - id: ch02-b02
          speaker: farmer_browns_boy
          text: 这就奇怪了。这枚蛋准是从上面的窝箱掉下来的，可吉米根本够不着那里。昨晚也不可能是母鸡踢的。我关门时，它们明明都在栖架上。今天早晨就更不可能了。吉米在下面，它们哪敢离开栖架？我得把这事弄明白。
        - id: ch02-b03
          speaker: narrator
          text: 于是，男孩先从第二排查起，一个窝箱接一个窝箱地往里看。接着，他又查看最上面一排。终于，他来到了比利大叔藏身的窝箱前。
        - id: ch02-b04
          speaker: narrator
          text: 比利大叔埋在干草底下，正屏住呼吸。他把自己盖得挺严实，却偏偏忘了尾巴。没错，那条尾巴正从窝箱边沿垂下来。农夫布朗家的男孩当然看见了。这样一条尾巴挂在眼前，谁也没法装作看不见。男孩一发现它，马上叫了起来。
    - id: ch03
      title: 比利大叔露馅了
      blocks:
        - id: ch03-b01
          speaker: farmer_browns_boy
          text: 哈，哈！原来昨晚的客人还不止一个。看来我家的鸡舍可真受欢迎。吃过早饭，我头一件事就得拿块木板，把地板上的洞钉住。
          emotion: surprised
        - id: ch03-b02
          speaker: farmer_browns_boy
          text: 比利负鼠大叔，原来是你把那枚引窝蛋踢了出去。那东西太硬，咬不动吧？所以你发了脾气，一脚把它踢下来，对不对？你这样可太傻了。别为一点小事发火，一点好处也没有。现在，我倒要想想该怎么处置你。
        - id: ch03-b03
          speaker: narrator
          text: 男孩说了这么多，比利大叔还是一动不动。他既听不懂男孩的话，也看不见男孩在做什么，根本不知道自己已经露了馅。他只能继续屏住呼吸，盼了又盼，一心希望男孩还没发现他。要不是那枚引窝蛋把秘密泄露出去，他也许真能躲过这一回。
        - id: ch03-b04
          speaker: narrator
          text: 比利大叔所有的麻烦，偏偏都是地板上那枚蛋惹来的。你一定还记得，它先掉到臭鼬吉米头上，把吉米惹恼了。现在，它又让农夫布朗家的男孩把每个窝箱都查了一遍。
        - id: ch03-b05
          speaker: narrator
          text: 当时，比利大叔不过是把一枚蛋踢出窝箱，看起来只是件微不足道的小事。可瞧瞧，它带来了多大的结果。小事往往并不像看起来那么小。
