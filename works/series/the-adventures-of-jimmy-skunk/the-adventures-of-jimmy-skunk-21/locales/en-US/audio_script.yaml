audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm, observant storytelling with a gently playful edge
        timbre: clear and rounded
        pace: measured
        pitch: medium
    jimmy_skunk:
      display_name: Jimmy Skunk
      tts:
        delivery: easygoing and deliberate, with quiet confidence
        timbre: mellow and grounded
        pace: unhurried
        pitch: medium-low
    unc_billy_possum:
      display_name: Unc' Billy Possum
      tts:
        delivery: sly and good-humored, with an easy Southern drawl
        timbre: light and wiry
        pace: relaxed
        pitch: medium-high
    farmer_browns_boy:
      display_name: Farmer Brown's Boy
      tts:
        delivery: practical and good-natured, with lively curiosity
        timbre: youthful and clear
        pace: medium
        pitch: medium
  chapters:
    - id: ch01
      title: Ready for Trouble
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            Little things may hardly seem worth a thought, yet sometimes they bring about very big results.
        - id: ch01-b02
          speaker: narrator
          text: >-
            Farmer Brown's boy watched Jimmy Skunk go peacefully on his way. As he watched, he grinned and scratched his head, thinking hard.
        - id: ch01-b03
          speaker: farmer_browns_boy
          text: >-
            Now, that is just about the best example of being prepared that I have ever seen. Jimmy knew he was ready if I tried to make trouble. And because I knew it too, I left him alone. He walked away as calmly as if he were bigger than I am, instead of the other way around. If you want to keep out of trouble, it certainly pays to be ready for it.
        - id: ch01-b04
          speaker: narrator
          text: >-
            Then Farmer Brown's boy turned back to the henhouse and went inside.
    - id: ch02
      title: The Egg on the Floor
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            First he checked that no foolish hen had gone to sleep where Jimmy might have caught her. All the hens were safe. He was about to begin his usual morning work and feed them when something on the floor stopped him. It was a china nest egg.
        - id: ch02-b02
          speaker: farmer_browns_boy
          text: >-
            Well, hello! How in the world did you get down there? Jimmy Skunk must have pulled you out of one of the lower nests.
          emotion: surprised
        - id: ch02-b03
          speaker: narrator
          text: >-
            Farmer Brown's boy knew exactly which nests held china eggs. In less than a minute, he had checked every nest in the lower row. Not one egg was missing.
        - id: ch02-b04
          speaker: farmer_browns_boy
          text: >-
            That's strange. This egg must have come from one of the nests above. Jimmy couldn't reach those. And none of the hens could have kicked it out last night, because they were all on the roost when I shut them in. They couldn't have done it this morning either. With Jimmy here, they wouldn't have dared to leave those roosts. I had better find out what happened.
        - id: ch02-b05
          speaker: narrator
          text: >-
            He searched the nests in the second row, one after another. Then he began on the highest row.
    - id: ch03
      title: The Tail over the Edge
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            At last he came to the nest where Unc' Billy Possum was hiding beneath the hay, holding his breath. Unc' Billy had covered himself quite well, but he had forgotten one thing. He had forgotten his tail. Yes, sir, his tail was hanging right over the edge of the nest. Farmer Brown's boy could not help seeing it.
        - id: ch03-b02
          speaker: farmer_browns_boy
          text: >-
            Ho, ho! So Jimmy wasn't my only visitor last night. This henhouse is becoming a very popular place.
          emotion: surprised
        - id: ch03-b03
          speaker: farmer_browns_boy
          text: >-
            The first thing I'll do after breakfast is nail a board over that hole in the floor. And now I know who kicked out that china egg. It was you, Unc' Billy Possum. Was it too hard for your teeth? You lost your temper and kicked it away, didn't you?
        - id: ch03-b04
          speaker: farmer_browns_boy
          text: >-
            That was a foolish thing to do, Unc' Billy. Very foolish. Never lose your temper over something so small. It isn't worth it. Now, what in the world am I going to do with you?
    - id: ch04
      title: A Little Thing with Big Results
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            Through all of this, Unc' Billy had not moved at all. He could not understand what Farmer Brown's boy was saying, and he could not see what the boy was doing. He simply held his breath and hoped with all his might that no one had found him.
        - id: ch04-b02
          speaker: narrator
          text: >-
            Perhaps he really would have escaped notice if that telltale china egg had not been lying on the floor. It was the cause of every bit of his trouble.
        - id: ch04-b03
          speaker: narrator
          text: >-
            First, the egg had made Jimmy Skunk angry when it fell on his head. Then it had made Farmer Brown's boy search every nest in the henhouse. Kicking that egg away had seemed like such a small thing. But look at all that came from it.
        - id: ch04-b04
          speaker: narrator
          text: >-
            Truly, little things often are not as little as they seem.
