audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 亲切机敏，带着温和的调侃
        timbre: 温暖清亮
        pace: 舒缓而有变化
        pitch: 中音
    peter_rabbit:
      display_name: 彼得兔
      tts:
        delivery: 机灵顽皮，盘算时压低声音
        timbre: 年轻明亮
        pace: 轻快
        pitch: 中高音
    sammy_jay:
      display_name: 冠蓝鸦萨米
      tts:
        delivery: 好奇直率，发火时尖锐急促
        timbre: 清脆响亮
        pace: 偏快
        pitch: 高音
  chapters:
    - id: ch01
      title: 淘气精灵在耳边嘀咕
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 淘气精灵真叫人愁，忙忙碌碌从不肯休。难怪总有人惹上麻烦。他就是闲不住。不，先生，他可绝不会自己停下来。除非有人拦住他，要不然一闹起来，谁也猜不到他会闹到哪一步。
        - id: ch01-b02
          speaker: narrator
          text: 彼得兔刚看见臭鼬吉米钻进山顶的一只旧木桶，淘气精灵就在他耳边说起了悄悄话。那只桶横倒在地上。彼得当然不该听，可他还是听了。只要玩笑是开在别人身上，他就喜欢得不得了。彼得坐在原地盯着木桶，想看看吉米会不会出来。等了一阵，吉米还是没有露面。他便悄悄走到桶边，探头一看。吉米正蜷在里面睡午觉。
    - id: ch02
      title: 彼得想出了主意
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 彼得踮着脚，轻轻走开。淘气精灵一路都在他耳边说，眼下正是捉弄吉米的好机会。要知道，谁睡着了，捉弄起来都很容易。可彼得平时很少有机会拿吉米开玩笑。吉米醒着时，这么做可不安全，彼得再清楚不过。
        - id: ch02-b02
          speaker: narrator
          text: 他在离木桶有一段距离的地方坐下，位置选得刚好，随时都能盯着桶。接着，他一声不响地使劲想办法。他想捉弄吉米，却跟所有爱开玩笑的人一样，不想让玩笑掉过头来砸中自己。最好让吉米压根儿不知道，这件事跟彼得有关。那样对彼得才最有利。
        - id: ch02-b03
          speaker: narrator
          text: 彼得正想得出神，无意间往绿草地上瞧了一眼，忽然看见那里有个红色的东西。他使劲看了看，很快认出那是红狐雷迪。彼得的脑筋马上转了起来，盘算怎么借雷迪来捉弄吉米。一个主意猛地冒了出来，逗得彼得当场笑出了声。淘气精灵还在他耳边忙个不停呢。
        - id: ch02-b04
          speaker: peter_rabbit
          text: 只要雷迪肯上山，我就能把这事办成。到时候，吉米和雷迪两个都得挨捉弄。
          emotion: happy
        - id: ch02-b05
          speaker: narrator
          text: 彼得越想越得意，又笑出了声。
    - id: ch03
      title: 萨米发了脾气
      blocks:
        - id: ch03-b01
          speaker: sammy_jay
          text: 彼得，你到底在笑什么？
        - id: ch03-b02
          speaker: narrator
          text: 问话的是冠蓝鸦萨米。一听见他的声音，彼得立刻想到了把雷迪引上山的办法。他要故意惹恼萨米。萨米一发火就会尖声大叫，雷迪听见他闹出那么大的动静，准会上来看看出了什么事。萨米的脾气一点就着，这一点谁都没有彼得清楚。他本该客客气气地回答，却偏偏粗声粗气地赶起人来。
        - id: ch03-b03
          speaker: peter_rabbit
          text: 飞走吧，萨米，快走！我笑什么，才不关你的事！
        - id: ch03-b04
          speaker: narrator
          text: 萨米顿时火冒三丈，张口就骂彼得。彼得也毫不客气地回嘴，于是萨米越发恼火。他只要一生气就会尖叫，很快便吵得不可开交。绿草地上的红狐雷迪想听不见都难。彼得看见他抬起头来，侧耳听了听。没过多久，雷迪就朝这边小跑过来，要看看这里到底为什么这么吵。
    - id: ch04
      title: 旧石墙后的脚步
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 彼得知道，雷迪绝不会直奔这里。那不是他的作风。他一定会绕到老果园边的旧石墙后面，再悄悄摸上来。那堵石墙就在彼得身后。雷迪会藏在那里，先看清这里发生了什么，同时不让别人发现自己。
        - id: ch04-b02
          speaker: peter_rabbit
          text: 他一看见我，准会觉得这回终于能抓到我了。我得使出全身力气跑。不过只要事情顺利，他很快就顾不上我了。但愿萨米别吵醒吉米，免得吉米跑出来看热闹。
        - id: ch04-b03
          speaker: narrator
          text: 彼得就这么等着。一只眼睛盯住木桶，那里睡着臭鼬吉米。另一只眼睛盯住旧石墙，红狐雷迪随时可能从墙后偷偷摸上来。冠蓝鸦萨米还在骂个不停，可那些难听话，彼得一句也没往心里去。
