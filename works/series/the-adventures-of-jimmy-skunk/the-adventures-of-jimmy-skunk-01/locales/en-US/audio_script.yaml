audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm, observant storytelling with a gently playful edge
        timbre: clear and rounded
        pace: measured
        pitch: medium
    peter_rabbit:
      display_name: Peter Rabbit
      tts:
        delivery: lively, clever, and pleased with his own schemes
        timbre: bright and youthful
        pace: quick
        pitch: medium-high
    sammy_jay:
      display_name: Sammy Jay
      tts:
        delivery: sharp, curious, and quick to take offense
        timbre: crisp and piercing
        pace: brisk
        pitch: high
  chapters:
    - id: ch01
      title: The Imp of Mischief
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            The Imp of Mischief, woe is me, is always busy as a bee. That is why so many people are forever getting into trouble. That imp simply will not sit still unless someone makes him. And once he starts, no one can tell where he will stop.
        - id: ch01-b02
          speaker: narrator
          text: >-
            Peter Rabbit had just watched Jimmy Skunk disappear into an old barrel. It lay on its side at the top of the hill. At once, the Imp of Mischief began whispering to Peter. Peter should not have listened. Of course he should not. But he did. Peter dearly loved a joke when it was played on somebody else.
        - id: ch01-b03
          speaker: narrator
          text: >-
            Peter stayed where he was and watched the barrel to see whether Jimmy would come out. Jimmy did not appear. After a little while, Peter crept over and peeped inside. There was Jimmy Skunk, curled up and taking a nap.
    - id: ch02
      title: Peter Thinks Hard
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            Peter tiptoed away as softly as he could. All the while, the Imp of Mischief kept whispering that this was a splendid chance to play a joke on Jimmy. It is easy to play a joke on someone who is asleep. Peter rarely got such a chance with Jimmy Skunk. Trying it while Jimmy was awake was not safe at all, and Peter knew that better than anyone.
        - id: ch02-b02
          speaker: narrator
          text: >-
            He sat down some distance away, in a spot where he could still watch the barrel. Then he went into a brown study. That is another way of saying he thought very hard. Peter wanted his joke, but like most jokers, he did not want it coming back on him. It would be much better, he decided, if Jimmy never knew Peter had anything to do with it.
        - id: ch02-b03
          speaker: narrator
          text: >-
            While Peter sat thinking, he glanced across the Green Meadows and noticed something red. He stared until he could make it out. It was Reddy Fox. Peter's nimble wits began working at once. How could he use Reddy to play a joke on Jimmy? Then the whole idea came to him in a flash, and Peter laughed aloud. The Imp of Mischief was whispering very busily now.
        - id: ch02-b04
          speaker: peter_rabbit
          text: >-
            If only Reddy were up here, I think I could manage it. Then the joke would be on Reddy as well as Jimmy!
          emotion: happy
        - id: ch02-b05
          speaker: narrator
          text: >-
            Peter laughed aloud once more.
    - id: ch03
      title: Sammy Loses His Temper
      blocks:
        - id: ch03-b01
          speaker: sammy_jay
          text: What is so funny?
        - id: ch03-b02
          speaker: narrator
          text: >-
            The voice belonged to Sammy Jay. As soon as Peter heard him, a plan for bringing Reddy up the hill flashed into his mind. Peter would make Sammy angry. Sammy would start screaming, and Reddy would surely come to learn what all the fuss was about. Sammy had a very quick temper, and no one knew it better than Peter.
        - id: ch03-b03
          speaker: narrator
          text: >-
            Peter should have answered politely. Instead, he spoke as crossly as he could.
        - id: ch03-b04
          speaker: peter_rabbit
          text: >-
            Go on, Sammy. Fly away! What I'm laughing at is none of your business.
          emotion: angry
        - id: ch03-b05
          speaker: narrator
          text: >-
            Sammy's temper flared at once. He began calling Peter names, and Peter called names right back. That only made Sammy angrier. Whenever Sammy was angry, he screamed. Soon he was making such a racket that Reddy Fox could not help hearing him, even from down on the Green Meadows.
    - id: ch04
      title: Reddy Comes to Investigate
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            Peter saw Reddy lift his head and listen. A few minutes later, the fox began trotting toward the hill. He was coming to find out what the fuss was about.
        - id: ch04-b02
          speaker: narrator
          text: >-
            Peter knew Reddy would not come straight up. That was not Reddy's way. He would sneak behind the old stone wall at the edge of the Old Orchard. The wall stood behind Peter, and from there Reddy could try to see everything without being seen.
        - id: ch04-b03
          speaker: peter_rabbit
          text: >-
            The moment Reddy sees me, he'll think he finally has a chance to catch me. I'll have to run as fast as I can. But if my plan works, he will soon forget all about me. I only hope Sammy's racket doesn't wake Jimmy and bring him out to see what is happening.
        - id: ch04-b04
          speaker: narrator
          text: >-
            So Peter waited. He kept one eye on the barrel, where Jimmy Skunk still slept, and the other on the old stone wall, where he expected Reddy Fox to creep into sight. And while Sammy Jay went on calling him names, Peter did not mind in the least.
