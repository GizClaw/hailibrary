audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm, observant storytelling with a gently playful edge
        timbre: clear and rounded
        pace: measured
        pitch: medium
    unc_billy_possum:
      display_name: Unc' Billy Possum
      tts:
        delivery: sly and good-humored, with an easy Southern drawl
        timbre: light and wiry
        pace: relaxed
        pitch: medium-high
    farmer_browns_boy:
      display_name: Farmer Brown's Boy
      tts:
        delivery: curious and good-natured, with a playful confidence
        timbre: clear and youthful
        pace: conversational
        pitch: medium
  chapters:
    - id: ch01
      title: The Discovery
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            Unc' Billy Possum first learned that he had been discovered through his tail. Yes, sir, it was his tail that told him. Farmer Brown's boy pinched it.
        - id: ch01-b02
          speaker: narrator
          text: >-
            That was not a very nice thing to do, but Farmer Brown's boy was curious. He wanted to find out what Unc' Billy would do. The pinch was not hard enough to truly hurt him. Farmer Brown's boy was much too kindhearted to hurt anyone when he could help it.
        - id: ch01-b03
          speaker: narrator
          text: >-
            Anyone else from the Green Forest or the Green Meadows would have jerked that tail away at once. Unc' Billy did nothing of the kind. No, sir, he did not. You might have thought the tail belonged to someone else, because he gave no sign that he felt a thing.
        - id: ch01-b04
          speaker: narrator
          text: >-
            Of course he wanted to pull it away. Anyone would have wanted to. Still, Unc' Billy did not move his tail even the tiniest bit. When he chose to control himself, Unc' Billy could do it remarkably well.
    - id: ch02
      title: Playing Dead
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            Farmer Brown's boy gave the tail another pinch, a little harder this time. Unc' Billy still did not react. Then the boy chuckled and began to pull. He kept pulling until Unc' Billy came all the way out of his hiding place. There he hung, swinging by his tail from the boy's hand.
        - id: ch02-b02
          speaker: narrator
          text: >-
            Unc' Billy showed no sign of life. He looked dead, and he acted dead. Anyone who did not know him would have been certain that he really was dead.
        - id: ch02-b03
          speaker: narrator
          text: >-
            Farmer Brown's boy dropped him on the floor. Unc' Billy stayed exactly as he fell. The boy rolled him over with one foot, but still there was not a single sign of life. Unc' Billy hoped the boy truly believed he was dead. That was exactly what he wanted.
        - id: ch02-b04
          speaker: narrator
          text: >-
            The boy picked him up again and laid him on a box. Then he covered the hole in the floor with a board and shut the henhouse door. After that, he went back to his chores. He cleaned out the henhouse and measured grain for the biddies.
        - id: ch02-b05
          speaker: narrator
          text: >-
            Unc' Billy certainly made a pitiful sight on top of that box. A dead animal or bird always looks pitiful, and no one could have looked more so than Unc' Billy Possum just then.
        - id: ch02-b06
          speaker: narrator
          text: >-
            His hair was rumpled, as it usually was, and now it was full of dust from the floor and little pieces of straw. His lips had drawn back, and his mouth hung partly open. His eyes appeared to be shut.
        - id: ch02-b07
          speaker: narrator
          text: >-
            In truth, those eyes were open just the tiniest bit. That narrow crack was enough for Unc' Billy to keep watch on Farmer Brown's boy. But anyone looking at him would have thought he was as dead as anything could possibly be.
    - id: ch03
      title: Carried Away
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            As Farmer Brown's boy worked, he kept glancing at Unc' Billy and chuckling to himself.
        - id: ch03-b02
          speaker: farmer_browns_boy
          text: >-
            You old trickster! You may think you're fooling me, but I know what you're up to. A possum doesn't just die for no reason in a hen's nest. You're a clever old rascal, and I've never seen a better actor. How long are you going to keep this up? I wish I could control myself half as well as you can.
        - id: ch03-b03
          speaker: narrator
          text: >-
            When his chores were done, Farmer Brown's boy took Unc' Billy by the tail once more. He opened the door and set off toward the house. Unc' Billy swung from his hand and bumped against his legs as he walked.
        - id: ch03-b04
          speaker: narrator
          text: >-
            Still, Unc' Billy showed no sign of life. He had no idea where the boy was taking him, and he was terribly frightened. Even so, he kept using his old trick of playing dead. That trick had saved him more than once before.
