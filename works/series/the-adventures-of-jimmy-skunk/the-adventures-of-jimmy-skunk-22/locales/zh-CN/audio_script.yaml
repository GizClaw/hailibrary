audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 亲切机敏，带着温和的调侃
        timbre: 温暖清亮
        pace: 舒缓而有变化
        pitch: 中音
    unc_billy_possum:
      display_name: 比利负鼠大叔
      tts:
        delivery: 乡音浓厚，风趣世故，玩笑说得一本正经
        timbre: 粗暖而略带沙哑
        pace: 慢条斯理
        pitch: 中低音
    farmer_browns_boy:
      display_name: 农夫布朗家的男孩
      tts:
        delivery: 直爽利落，遇事机灵又有分寸
        timbre: 明亮结实
        pace: 轻快自然
        pitch: 中音
  chapters:
    - id: ch01
      title: 尾巴泄露了秘密
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 比利大叔发觉自己已经被人找到了。是谁告诉他的呢？不是眼睛，也不是耳朵，而是他的尾巴。农夫布朗家的男孩在那条尾巴上轻轻捏了一下。
        - id: ch01-b02
          speaker: narrator
          text: 这样做是有点不厚道，可男孩实在想知道，比利大叔会有什么反应。他下手并不重，绝不会真把比利大叔捏疼。只要能避免，这个好心肠的男孩从来不愿伤害谁。
        - id: ch01-b03
          speaker: narrator
          text: 要是换了绿森林或绿草地上的别人，尾巴一挨捏，早就抽回去了。比利大叔偏偏一动不动。没错，那条尾巴就像长在别人身上，他一点儿也不肯露出破绽。
        - id: ch01-b04
          speaker: narrator
          text: 其实，比利大叔当然想把尾巴收回来。谁遇到这种事不想呢？可他连最轻微的一下都忍住了。比利大叔认真使出自制力的时候，本领可真不小。
    - id: ch02
      title: 装得死透了
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 男孩又捏了一次，手上稍稍多用了点力。比利大叔还是没有反应。男孩忍不住笑起来，索性抓住那条尾巴往外拉。他拉呀，拉呀，终于把比利大叔从藏身的地方整个拖了出来。
        - id: ch02-b02
          speaker: narrator
          text: 比利大叔被倒提着尾巴，悬在男孩手下晃荡，浑身看不出一丝活气。他看着像死了，做出的样子也像死了。要是不知道他的老把戏，谁都会相信他真的没命了。
        - id: ch02-b03
          speaker: narrator
          text: 男孩把他丢到地板上。他落下时是什么模样，之后就一直保持什么模样。男孩用脚把他翻过来，他还是毫无动静。比利大叔一心盼着男孩真把自己当成死的。这正是他想要的。
        - id: ch02-b04
          speaker: narrator
          text: 男孩再次把他捡起来，搁到一只箱子上。然后，他用木板盖住地板上的洞，关好鸡舍门，开始打扫鸡舍，又量出喂母鸡的饲料。
        - id: ch02-b05
          speaker: narrator
          text: 比利大叔躺在那里，那副模样别提多可怜了。死去的鸟兽看着总叫人难过，可这时候的比利大叔，简直比什么死去的动物都显得可怜。
        - id: ch02-b06
          speaker: narrator
          text: 他那身毛还是平常那样乱蓬蓬的，里面沾着地板上的尘土和碎稻草。他的嘴唇向后缩，嘴巴半张着，眼睛仿佛也闭紧了。
        - id: ch02-b07
          speaker: narrator
          text: 不过，那双眼睛其实还留着一条小得不能再小的缝，刚好能让他盯住男孩。别人可看不出来。无论谁看见他，准会觉得他已经死得不能再死了。
    - id: ch03
      title: 老把戏还要演下去
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 农夫布朗家的男孩一边干活，一边留意箱子上的比利大叔，还不时偷偷发笑。过了一会儿，他终于开口了。
        - id: ch03-b02
          speaker: farmer_browns_boy
          text: 你这个老骗子，还以为能把我蒙过去呢。我可知道你的把戏。哪有负鼠会平白无故死在母鸡窝里？
        - id: ch03-b03
          speaker: farmer_browns_boy
          text: 你真是个狡猾的老家伙，也是我见过最会演戏的一个。我倒想看看，你究竟能装多久。我要是有你一半能忍就好了。
        - id: ch03-b04
          speaker: narrator
          text: 男孩忙完活儿，又提起比利大叔的尾巴。他打开鸡舍门，朝屋子走去。比利大叔悬在他手下，身子一路晃着，不时撞到男孩腿上，可还是没有露出半点儿活气。
        - id: ch03-b05
          speaker: narrator
          text: 比利大叔不知道自己会被带到哪里，心里怕得厉害。不过，他还是死守着装死这套老把戏。过去不止一次，就是这招帮他逃过了麻烦。
