audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 亲切机敏，带着温和的调侃
        timbre: 温暖清亮
        pace: 舒缓而有变化
        pitch: 中音
    jimmy_skunk:
      display_name: 臭鼬吉米
      tts:
        delivery: 平日温厚从容，发怒时严厉干脆
        timbre: 沉稳厚实
        pace: 从容偏慢
        pitch: 中低音
    unc_billy_possum:
      display_name: 比利负鼠大叔
      tts:
        delivery: 乡音浓厚，风趣世故，玩笑说得一本正经
        timbre: 粗暖而略带沙哑
        pace: 慢条斯理
        pitch: 中低音
  chapters:
    - id: ch01
      title: 谁也不来招惹他们
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 有个道理，无论走到哪里都不会错。凡事早有准备，烦恼自然就少。臭鼬吉米要让比利大叔明白的，正是这个道理。他先拿自己问了起来。
        - id: ch01-b02
          speaker: jimmy_skunk
          text: 先说我吧。我的个头并不算很大，对不对？
        - id: ch01-b03
          speaker: narrator
          text: 比利大叔咧嘴一笑。
        - id: ch01-b04
          speaker: unc_billy_possum
          text: 那当然啦，臭鼬老弟。俺认识的家伙里，比你个头大的可多着哩。
        - id: ch01-b05
          speaker: narrator
          text: 这话一点儿不错。跟一些邻居相比，臭鼬吉米的确是个小个子。吉米又问起了自己的爪子和牙齿。
        - id: ch01-b06
          speaker: jimmy_skunk
          text: 我的爪子不长，牙齿也不大，是不是？
        - id: ch01-b07
          speaker: unc_billy_possum
          text: 俺看呐，你的爪子和牙齿，跟俺的差不多长，也差不多大。
        - id: ch01-b08
          speaker: narrator
          text: 比利大叔越听越糊涂。吉米没有马上解释，只管接着问。
        - id: ch01-b09
          speaker: jimmy_skunk
          text: 可是，你从没见谁来找我的麻烦，对吧？
        - id: ch01-b10
          speaker: unc_billy_possum
          text: 没见过。
        - id: ch01-b11
          speaker: jimmy_skunk
          text: 刺猬波奇也一样。你见过谁去招惹他吗？有谁想过要伤害他吗？
        - id: ch01-b12
          speaker: unc_billy_possum
          text: 也没见过。
        - id: ch01-b13
          speaker: jimmy_skunk
          text: 那是为什么？
    - id: ch02
      title: 比利大叔说出缘由
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 比利大叔这回把嘴咧得更大了。他当然知道答案。
        - id: ch02-b02
          speaker: unc_billy_possum
          text: 俺寻思，根本没人想招惹你和刺猬老弟。大伙儿都知道，真惹了你们会有什么下场。离你们远点儿，日子才舒坦呢。至少俺不会跟你们两位过不去。
        - id: ch02-b03
          speaker: unc_billy_possum
          text: 臭鼬老弟，你随身带着的那个小香囊，威力可大得很。刺猬老弟又爱亮出一身小尖矛，半点儿也不吝啬。俺也不想撞上去。俺知道眼下安安稳稳有多好，别人多半也这么想。
        - id: ch02-b04
          speaker: narrator
          text: 臭鼬吉米听完，轻轻笑了。他还有一个问题。
        - id: ch02-b05
          speaker: jimmy_skunk
          text: 比利大叔，你见过我主动挑起争斗吗？有没有谁还没来袭击我，我就先拿香囊去对付他？
        - id: ch02-b06
          speaker: narrator
          text: 比利大叔认真想了好一会儿。
        - id: ch02-b07
          speaker: unc_billy_possum
          text: 这个嘛，俺还真没见过。
    - id: ch03
      title: 有准备的妙处
      blocks:
        - id: ch03-b01
          speaker: jimmy_skunk
          text: 刺猬波奇也从不四处找麻烦。我们不去找麻烦，麻烦也不来找我们。为什么呢？因为我们时刻准备着应付麻烦，而且谁都知道。
        - id: ch03-b02
          speaker: jimmy_skunk
          text: 大熊巴斯特只要一脚踩下来，就能把我压扁，可他从来不试。你一定注意到了，每回我们碰面，他对我总是客客气气。波奇和我带着武器，是为了防卫，绝不会拿来进攻。
        - id: ch03-b03
          speaker: jimmy_skunk
          text: 谁也不招惹我们，我们也不招惹谁。事先有准备，妙就妙在这里。
        - id: ch03-b04
          speaker: narrator
          text: 比利大叔没有马上回答。他把吉米这番话翻来覆去想了好几分钟。接着，他长叹一声，停了停，又叹了一声。
        - id: ch03-b05
          speaker: unc_billy_possum
          text: 俺看，你和刺猬老弟大概是俺认识的家伙里最走运的了。没错，先生，你们就是这么走运。跟俺个头一样大的，俺谁也不怕。可碰见某些家伙的时候——是谁俺就不提啦——俺还真会吓得够呛。
          emotion: fearful
        - id: ch03-b06
          speaker: unc_billy_possum
          text: 俺真希望老大自然也给了俺点儿什么，好让别人怕俺，就像怕你们一样。臭鼬老弟，见了你以后，俺可真信服凡事要有准备这个道理了。俺的的确确信了。
        - id: ch03-b07
          speaker: unc_billy_possum
          text: 对了，你最近找到过新鲜的好鸡蛋没有？
