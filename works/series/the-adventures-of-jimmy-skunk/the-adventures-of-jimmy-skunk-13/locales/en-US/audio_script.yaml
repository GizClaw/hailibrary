audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm, observant storytelling with a gently playful edge
        timbre: clear and rounded
        pace: measured
        pitch: medium
    jimmy_skunk:
      display_name: Jimmy Skunk
      tts:
        delivery: easygoing and deliberate, with quiet confidence
        timbre: mellow and grounded
        pace: unhurried
        pitch: medium-low
    unc_billy:
      display_name: Unc' Billy Possum
      tts:
        delivery: folksy and expressive, with an easy Southern drawl
        timbre: light and slightly raspy
        pace: relaxed
        pitch: medium-high
  chapters:
    - id: ch01
      title: Jimmy Asks Some Questions
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            Wherever you may go, you will find that folks who are prepared have fewer troubles. Jimmy Skunk began explaining this to Unc' Billy Possum by asking him a question.
        - id: ch01-b02
          speaker: jimmy_skunk
          text: >-
            First of all, I'm not a very big fellow, am I?
        - id: ch01-b03
          speaker: unc_billy
          text: >-
            Ah reckon Ah know plenty of folks bigger than you, Brer Skunk.
        - id: ch01-b04
          speaker: narrator
          text: >-
            Unc' Billy grinned as he answered. Compared with some of his neighbors, Jimmy really was a little fellow.
        - id: ch01-b05
          speaker: jimmy_skunk
          text: >-
            And my claws aren't very long, and my teeth aren't very big. Wouldn't you say so?
        - id: ch01-b06
          speaker: unc_billy
          text: >-
            Ah reckon my claws are about as long, and my teeth are about as big.
        - id: ch01-b07
          speaker: narrator
          text: >-
            Unc' Billy looked more puzzled than ever. Jimmy kept questioning him.
        - id: ch01-b08
          speaker: jimmy_skunk
          text: >-
            But you never see anyone bothering me, do you?
        - id: ch01-b09
          speaker: unc_billy
          text: >-
            No, Ah don't.
        - id: ch01-b10
          speaker: jimmy_skunk
          text: >-
            It's the same with Prickly Porky the Porcupine. Nobody bothers him or tries to hurt him either, do they?
        - id: ch01-b11
          speaker: unc_billy
          text: >-
            No, they don't.
        - id: ch01-b12
          speaker: jimmy_skunk
          text: >-
            Then why is that?
    - id: ch02
      title: The Beauty of Being Prepared
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            Unc' Billy's grin spread wide. He knew the answer to that one.
        - id: ch02-b02
          speaker: unc_billy
          text: >-
            Ah reckon nobody wants to meddle with you or Brer Porky. Most folks know what would happen, and they know it's much more comfortable to leave you both alone. Ah surely do. Ah'm not looking for trouble with either one of you. That little bag of scent you carry is mighty powerful, Brer Skunk. And Ah don't want to brush against those little spears Brer Porky is so quick to use. Ah know when things are going well, and Ah reckon most folks feel the same.
        - id: ch02-b03
          speaker: narrator
          text: >-
            Jimmy chuckled. He had one more question for Unc' Billy.
        - id: ch02-b04
          speaker: jimmy_skunk
          text: >-
            Have you ever known me to start a quarrel and use my scent before somebody attacked me?
        - id: ch02-b05
          speaker: narrator
          text: >-
            Unc' Billy thought about that for a few minutes.
        - id: ch02-b06
          speaker: unc_billy
          text: >-
            No, Ah can't say Ah ever have.
        - id: ch02-b07
          speaker: jimmy_skunk
          text: >-
            And you've never known Prickly Porky to go looking for trouble. Neither of us hunts for trouble, and trouble doesn't hunt for us. That's because we're always prepared, and everybody knows it. Buster Bear could squash me just by stepping on me, but he never tries. You may have noticed how polite he is whenever we meet. Prickly Porky and I carry weapons for defense, but we never use them to attack. Nobody bothers us, and we bother nobody. That's the beauty of being prepared.
    - id: ch03
      title: Unc' Billy Changes the Subject
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            Unc' Billy considered all that for several minutes. Then he sighed, and sighed once more.
        - id: ch03-b02
          speaker: unc_billy
          text: >-
            Ah reckon you and Brer Porky are about the luckiest folks Ah know. Yes, sah, that's just what Ah reckon. Ah'm not afraid of anybody my own size, but Ah surely have some scary times when Ah meet certain folks Ah could name. Ah wish Old Mother Nature had given me something that would make others as afraid of me as they are of you. After seeing you, Brer Skunk, Ah surely do believe in being prepared. Yes, sah, Ah surely do. By the way, have you found any nice fresh eggs lately?
