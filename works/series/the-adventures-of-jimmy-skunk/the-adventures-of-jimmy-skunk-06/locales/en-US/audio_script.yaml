audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm, observant storytelling with a gently playful edge
        timbre: clear and rounded
        pace: measured
        pitch: medium
    peter_rabbit:
      display_name: Peter Rabbit
      tts:
        delivery: lively, clever, and pleased with his own schemes
        timbre: bright and youthful
        pace: quick
        pitch: medium-high
    reddy_fox:
      display_name: Reddy Fox
      tts:
        delivery: sly and self-assured, with sudden bursts of alarm
        timbre: lean and keen
        pace: brisk
        pitch: medium
    jimmy_skunk:
      display_name: Jimmy Skunk
      tts:
        delivery: easygoing and deliberate, with quiet confidence
        timbre: mellow and grounded
        pace: unhurried
        pitch: medium-low
  chapters:
    - id: ch01
      title: Peter Rabbit Doesn't Enjoy His Joke
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            While Jimmy Skunk was punishing Reddy Fox for sending him downhill in a barrel, Peter Rabbit lay low in Johnny Chuck's old house. The house was close to where Jimmy's wild ride had ended. Peter felt greatly relieved when Jimmy stood up. Now he knew that Jimmy had not been hurt.
        - id: ch01-b02
          speaker: narrator
          text: >-
            Peter lay flat in the doorway. He could see everything without being seen, and he could hear every word. When Reddy came up, Peter chuckled. His eyes nearly popped with excitement as he waited to see what would happen. He was sure something unpleasant was coming for Reddy, and that pleased him.
        - id: ch01-b03
          speaker: narrator
          text: >-
            It was not at all nice of Peter to feel that way, and deep down he knew it. But Reddy had chased him so many times and frightened him so badly that Peter felt he was finally getting even. So he kept chuckling as he waited.
        - id: ch01-b04
          speaker: narrator
          text: >-
            Then his chuckle stopped short.
        - id: ch01-b05
          speaker: peter_rabbit
          text: >-
            Ouch!
        - id: ch01-b06
          speaker: narrator
          text: >-
            A pain shot through Peter as if a hot needle had pierced him. He almost jumped right out of the doorway. Just in time, he remembered that he must not show himself. If he did, Reddy and Jimmy would suspect that he had something to do with Jimmy's wild barrel ride. No, Peter could not go outside now.
        - id: ch01-b07
          speaker: narrator
          text: >-
            All Peter could do was kick and squirm. He twisted his head around to find out what was happening. Even as he looked, another sharp pain struck him. It made him kick harder and brought another cry from him.
        - id: ch01-b08
          speaker: peter_rabbit
          text: >-
            Ouch!
        - id: ch01-b09
          speaker: narrator
          text: >-
            Peter kicked harder than ever. Two furious little insects were getting ready to sting him again, and more were on the way. They were Yellow Jackets. Yellow Jackets belong to the wasp family, and they carry very sharp little lances in their tails.
        - id: ch01-b10
          speaker: narrator
          text: >-
            Johnny Chuck's old house had stood empty for so long that the Yellow Jackets had decided to use it themselves. They had begun building their home just inside the hall. And now Peter was lying much too close to it.
        - id: ch01-b11
          speaker: narrator
          text: >-
            Poor Peter had nowhere to go. He did not dare run outside, but he simply could not stay where he was. Whatever he chose, he had to act quickly. A whole army of Yellow Jackets seemed to be coming, and their little lances caused some of the worst pain Peter knew.
        - id: ch01-b12
          speaker: narrator
          text: >-
            By then, Peter had forgotten everything happening outside. Far too much was happening inside. Then he remembered that Johnny Chuck dug his house deep into the ground. Peter peered along the hall. It was dark down there. Perhaps the angry little warriors would not follow if he went deeper. It was worth a try.
        - id: ch01-b13
          speaker: narrator
          text: >-
            Peter scrambled to his feet and rushed down the long hall. The Yellow Jackets kept after him as he ran. Their sharp little lances were very busy, and Peter had no way to fight back. He could only hurry toward the darkness ahead.
        - id: ch01-b14
          speaker: peter_rabbit
          text: >-
            Ouch! Ouch! Oh! Ohoo!
        - id: ch01-b15
          speaker: narrator
          text: >-
            At the far end of the hall, Peter found a snug little room. It was very dark, but it was cool and comfortable. Just as he had hoped, the Yellow Jackets did not follow him. They had chased him away from their home near the entrance, and that was enough for them.
        - id: ch01-b16
          speaker: narrator
          text: >-
            But Peter was in a dreadful fix. He could stay in the dark room for now, but he could not remain there forever. He ached and smarted all over. My goodness, how he smarted! And when the time came to leave, he would have to pass the Yellow Jackets' home again.
        - id: ch01-b17
          speaker: narrator
          text: >-
            Peter tried and tried to find a comfortable position, but he could not.
        - id: ch01-b18
          speaker: peter_rabbit
          text: >-
            Oh, dear. I wish I'd never thought of that joke. I suppose this is just what I deserve.
          emotion: sad
        - id: ch01-b19
          speaker: narrator
          text: >-
            I rather think it was just what Peter deserved. Don't you?
