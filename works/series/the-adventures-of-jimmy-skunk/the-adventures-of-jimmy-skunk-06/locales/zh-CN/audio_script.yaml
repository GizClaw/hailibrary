audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 亲切机敏，带着温和的调侃
        timbre: 温暖清亮
        pace: 舒缓而有变化
        pitch: 中音
    peter_rabbit:
      display_name: 彼得兔
      tts:
        delivery: 机灵顽皮，盘算时压低声音
        timbre: 年轻明亮
        pace: 轻快
        pitch: 中高音
  chapters:
    - id: ch01
      title: 躲在暗处看热闹
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 臭鼬吉米为了木桶滚下山坡那件事惩罚红狐雷迪，把他喷得满身“香水”。雷迪偷偷溜向绿森林，想赶快藏起来。这一切发生时，彼得兔一直趴在土拨鼠约翰尼的旧屋里。旧屋就在吉米那场惊险旅程结束的地方附近。
        - id: ch01-b02
          speaker: narrator
          text: 看见吉米重新站起来，彼得知道他没有在那场飞驰中受伤，总算松了一大口气。彼得平贴在门口，既能把外面的动静看得清清楚楚，也能听见外面的每句话，别人却发现不了他。
        - id: ch01-b03
          speaker: narrator
          text: 雷迪一走近，彼得就暗暗发笑，两眼兴奋得睁得圆圆的。他认定雷迪要吃苦头了，心里十分高兴。彼得这样当然不对，他自己也明白。可雷迪追过他太多回，也把他吓得够呛。彼得觉得，这一次总算轮到自己报仇了。
    - id: ch02
      title: 笑声变成哎哟
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 彼得一边偷笑，一边等着看接下来的好戏。没想到，笑声突然断在了半截。他身上一阵刺痛，好像一根烧红的针猛地扎了进去，疼得差点儿从门口跳出去。
        - id: ch02-b02
          speaker: peter_rabbit
          text: 哎哟，真疼！
          emotion: surprised
        - id: ch02-b03
          speaker: narrator
          text: 幸好彼得及时想起，自己绝不能露面。只要跑到外面，雷迪和吉米马上就会怀疑，那只木桶飞驰下坡的事跟他有关。他现在无论如何也不能出去。
        - id: ch02-b04
          speaker: narrator
          text: 彼得只好又蹬又扭，拼命转过头去查看。答案很快就来了。他刚一回头，身上又猛地一痛，疼得两条腿蹬得更厉害了。
        - id: ch02-b05
          speaker: peter_rabbit
          text: 哎哟，又来一下！
        - id: ch02-b06
          speaker: narrator
          text: 两只愤怒的小虫子正准备再蜇他，后面还有更多。原来，它们是黄胡蜂。黄胡蜂属于胡蜂一族，尾巴上带着锐利的小长矛。约翰尼的旧屋荒废太久，它们见没人居住，就搬了进来，还在过道入口里面筑起了巢。
    - id: ch03
      title: 逃进地底深处
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 可怜的彼得该怎么办？他不敢出去，又实在不能留在门口，而且必须赶快行动。他眼看一支黄胡蜂大军扑来。那些小长矛蜇起人来，几乎比他知道的任何东西都疼。彼得再也顾不上屋外发生了什么。屋里的麻烦已经够多了，甚至多得过了头。
        - id: ch03-b02
          speaker: narrator
          text: 彼得想起来，土拨鼠约翰尼的屋子会一直通到很深的地下。他望向黑漆漆的长过道。也许躲到下面，这些愤怒的小武士就不会再追了。不管怎样，实在值得试一试。
        - id: ch03-b03
          speaker: narrator
          text: 彼得一骨碌爬起来，顺着长长的过道飞奔，一路疼得直叫。那些锐利的小长矛还在忙着扎他，他既不能抵挡，也没有别的办法。
        - id: ch03-b04
          speaker: peter_rabbit
          text: 哎哟！这些刺真疼！哎哟！啊！噢——！
          emotion: fearful
        - id: ch03-b05
          speaker: narrator
          text: 过道尽头有一间舒适的小屋，虽然很暗，却又凉快又舒服。事情果然像彼得希望的那样。黄胡蜂没有追下来。它们只是要把彼得赶离入口附近的巢穴，如今目的达到了，也就满意了。
    - id: ch04
      title: 自己惹来的苦头
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 黄胡蜂虽然不追了，彼得却被困在地底，进退两难，处境实在糟透了。他浑身都在疼，被蜇过的地方火辣辣的，疼得别提多厉害。更麻烦的是，要想离开这间地下小屋，他还得原路返回，再次经过黄胡蜂的巢穴。那可又要从它们眼前经过一回。
        - id: ch04-b02
          speaker: narrator
          text: 彼得翻来覆去，怎么也找不到一个舒服的姿势，只能呻吟起来。
        - id: ch04-b03
          speaker: peter_rabbit
          text: 唉，我真不该想出这个恶作剧。看来我吃这些苦头，的确是活该。
          emotion: sad
        - id: ch04-b04
          speaker: narrator
          text: 我看他确实是活该，你说呢？
