audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 亲切机敏，带着温和的调侃
        timbre: 温暖清亮
        pace: 舒缓而有变化
        pitch: 中音
    sammy_jay:
      display_name: 冠蓝鸦萨米
      tts:
        delivery: 好奇直率，发火时尖锐急促
        timbre: 清脆响亮
        pace: 偏快
        pitch: 高音
    jimmy_skunk:
      display_name: 臭鼬吉米
      tts:
        delivery: 平日温厚从容，发怒时严厉干脆
        timbre: 沉稳厚实
        pace: 从容偏慢
        pitch: 中低音
  chapters:
    - id: ch01
      title: 萨米的暗示
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 臭鼬吉米紧盯着冠蓝鸦萨米，萨米也紧盯着他。过了一会儿，萨米慢慢闭上一只眼睛，又慢慢睁开。原来，他是在朝吉米眨眼。
        - id: ch01-b02
          speaker: jimmy_skunk
          text: 你的意思是，你猜彼得兔知道我在木桶里。他故意从桶上跳过去，就是想让红狐雷迪一头撞上去。对不对？
        - id: ch01-b03
          speaker: narrator
          text: 萨米不回答，只又眨了一次眼。吉米先咧嘴一笑，接着认真想了起来，开口时说得很慢。
        - id: ch01-b04
          speaker: jimmy_skunk
          text: 彼得会不会只是想拖住雷迪，好让自己有时间逃走？
        - id: ch01-b05
          speaker: sammy_jay
          text: 我也在想。
        - id: ch01-b06
          speaker: jimmy_skunk
          text: 也可能，他就是想让雷迪惹上麻烦。
        - id: ch01-b07
          speaker: sammy_jay
          text: 我也在想。
        - id: ch01-b08
          speaker: narrator
          text: 吉米若有所思地挠了挠头。
        - id: ch01-b09
          speaker: jimmy_skunk
          text: 还有一种可能。他只是想开个玩笑，一下捉弄雷迪和我两个。
        - id: ch01-b10
          speaker: sammy_jay
          text: 我也在想。
        - id: ch01-b11
          speaker: narrator
          text: 萨米说完，再也忍不住，放声大笑起来。
    - id: ch02
      title: 彼得去了哪里
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 别看臭鼬吉米脑袋不大，里面可精明得很。这下，他明白萨米猜的是什么了。
        - id: ch02-b02
          speaker: jimmy_skunk
          text: 原来你是这么想的。嗯，要是你猜对了，我一点儿也不会意外。我得去找彼得。他该受点教训。拿别人冒险，让别人难受，这种玩笑怎么也说不过去。木桶载着我疯狂冲下山时，我的脖子差点儿折断，也把我颠得实在难受。肚子里的东西好像全被摇离了原位，又乱糟糟地挤成一团。直到现在，我的胃还怪怪的，像是跑错了地方。对了，彼得跳过木桶以后去哪儿了？
        - id: ch02-b03
          speaker: narrator
          text: 萨米摇了摇头。
        - id: ch02-b04
          speaker: sammy_jay
          text: 我不知道。木桶刚滚起来时，场面太刺激了。我们听见桶里有动静，知道里面藏着谁，就更顾不上别的了。雷迪大概忘了彼得，反正我完全忘了。后来木桶撞上山下的石头，摔得四分五裂，你又跟雷迪面对面站在那里，那才叫刺激。事情结束以后，我去找过彼得，可哪儿也看不见他。他根本来不及跑到老荆棘丛。说真的，我也很想知道他去了哪里。
    - id: ch03
      title: 下山寻找
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 臭鼬吉米转过身，朝山坡下望了望。接着，他照平常的样子，慢悠悠地往破木桶走去。
        - id: ch03-b02
          speaker: sammy_jay
          text: 你要去哪儿？
        - id: ch03-b03
          speaker: jimmy_skunk
          text: 去找彼得兔。我要问他几个问题。
        - id: ch03-b04
          speaker: narrator
          text: 吉米晃晃悠悠地走下山坡。起初，他一想到彼得做的事就非常生气，决心给彼得一个永远忘不了的教训。可是走着走着，他忽然发现，整件事也有好笑的一面。吉米本来就很有幽默感，越想越忍不住。还没到山脚，他的怒气已经消得干干净净，只顾自己低声发笑了。
    - id: ch04
      title: 只吓他一跳
      blocks:
        - id: ch04-b01
          speaker: jimmy_skunk
          text: 要是我冤枉了红狐雷迪，那是有点儿对不住他。不过，他平时给别人惹了那么多麻烦，我想不会有人替他抱不平。他这阵子大概不会再打扰任何人了。彼得确实该受罚，可不知怎么，我现在已经不像刚才那么想罚他。只要吓他一跳，这回就放过那个小淘气吧。
        - id: ch04-b02
          speaker: jimmy_skunk
          text: 可他藏到哪儿去了？我觉得他应该就在附近。让我想想。对了，土拨鼠约翰有一座旧屋，好像离这里不远。我去里面看看。
