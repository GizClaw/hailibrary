audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm, observant storytelling with a gently playful edge
        timbre: clear and rounded
        pace: measured
        pitch: medium
    sammy_jay:
      display_name: Sammy Jay
      tts:
        delivery: sharp, curious, and quick to take offense
        timbre: crisp and piercing
        pace: brisk
        pitch: high
    jimmy_skunk:
      display_name: Jimmy Skunk
      tts:
        delivery: slow, thoughtful, and good-humored, with quiet firmness
        timbre: mellow and sturdy
        pace: unhurried
        pitch: medium-low
  chapters:
    - id: ch01
      title: Jimmy Skunk Looks for Peter
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            Jimmy Skunk stared hard at Sammy Jay, and Sammy stared right back. Then Sammy slowly closed one eye and slowly opened it again. He was winking.
        - id: ch01-b02
          speaker: jimmy_skunk
          text: >-
            Do you mean you think Peter Rabbit knew I was inside that barrel? And he jumped over it so Reddy Fox would crash into it? Is that what you mean?
        - id: ch01-b03
          speaker: narrator
          text: >-
            Sammy did not answer. He only winked again. Jimmy grinned, but then his face grew thoughtful.
        - id: ch01-b04
          speaker: jimmy_skunk
          text: >-
            I wonder if Peter did it to give himself more time to get away from Reddy.
        - id: ch01-b05
          speaker: sammy_jay
          text: I wonder.
        - id: ch01-b06
          speaker: jimmy_skunk
          text: >-
            And I wonder if he only wanted to get Reddy into trouble.
        - id: ch01-b07
          speaker: sammy_jay
          text: I wonder.
        - id: ch01-b08
          speaker: jimmy_skunk
          text: >-
            Or maybe Peter meant it as a joke on both of us. I wonder if that was it.
        - id: ch01-b09
          speaker: narrator
          text: >-
            Jimmy scratched his head as he tried to work it out.
        - id: ch01-b10
          speaker: sammy_jay
          text: I wonder!
          emotion: happy
        - id: ch01-b11
          speaker: narrator
          text: >-
            Sammy burst out laughing. Jimmy had a very shrewd little head on his shoulders, and now he nodded.
        - id: ch01-b12
          speaker: jimmy_skunk
          text: >-
            So that is what you think happened. Well, you may be right. I would not be surprised at all. I am going to find Peter, because he needs to learn a lesson. There is no excuse for a joke that puts others in danger or makes them miserable. My neck could have broken during that wild ride down the hill. And miserable? I felt as if everything inside me had been shaken loose and mixed together. Even now, my stomach feels a little queer, as though it might not be where it belongs. By the way, what happened to Peter after he jumped over the barrel?
        - id: ch01-b13
          speaker: narrator
          text: >-
            Sammy shook his head.
        - id: ch01-b14
          speaker: sammy_jay
          text: >-
            I don't know. When the barrel began rolling, everything got so exciting. We could hear that someone was trapped inside it. I think Reddy forgot Peter, and I know I did. Then the barrel smashed against that stone down there, and you and Reddy stood face-to-face. That was even more exciting. When it was all over, I looked for Peter, but he had disappeared. He could not have reached the Old Briar-patch that quickly. I would really like to know where he went.
        - id: ch01-b15
          speaker: narrator
          text: >-
            Jimmy turned to look down the hill. Then, moving at his usual slow pace, he started back toward the shattered barrel.
        - id: ch01-b16
          speaker: sammy_jay
          text: Where are you going?
        - id: ch01-b17
          speaker: jimmy_skunk
          text: >-
            I am going to find Peter Rabbit. I have a few questions to ask him.
        - id: ch01-b18
          speaker: narrator
          text: >-
            Jimmy ambled down the hill. At first, thinking about Peter's trick made him very angry. He decided that Peter should get a lesson he would never forget.
        - id: ch01-b19
          speaker: narrator
          text: >-
            But as Jimmy went along, he began to see how funny the whole affair was. Jimmy had a wonderful sense of humor. Before he reached the bottom of the hill, all his anger had vanished, and he was chuckling to himself.
        - id: ch01-b20
          speaker: jimmy_skunk
          text: >-
            I am sorry if I blamed Reddy unfairly. Still, he causes so much trouble for everyone else that I don't suppose anyone will feel sorry for him. He probably won't bother anybody for quite a while. Peter really should be punished, but I don't feel much like punishing him now. I will give the rascal a little scare, and that will be enough. Now, where could he be? I have a feeling he has not gone far. Let me think. I seem to remember an old house of Johnny Chuck's near here. I will look inside it.
