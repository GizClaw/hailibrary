audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm, observant storytelling with a gently playful edge
        timbre: clear and rounded
        pace: measured
        pitch: medium
    peter_rabbit:
      display_name: Peter Rabbit
      tts:
        delivery: lively, clever, and pleased with his own schemes
        timbre: bright and youthful
        pace: quick
        pitch: medium-high
    sammy_jay:
      display_name: Sammy Jay
      tts:
        delivery: sharp, curious, and quick to take offense
        timbre: crisp and piercing
        pace: brisk
        pitch: high
    reddy_fox:
      display_name: Reddy Fox
      tts:
        delivery: sly and self-assured, with sudden bursts of alarm
        timbre: lean and keen
        pace: brisk
        pitch: medium
    jimmy_skunk:
      display_name: Jimmy Skunk
      tts:
        delivery: easygoing and deliberate, with quiet confidence
        timbre: mellow and grounded
        pace: unhurried
        pitch: medium-low
    old_man_coyote:
      display_name: Old Man Coyote
      tts:
        delivery: watchful and crafty, turning sharp when startled
        timbre: rough and resonant
        pace: measured
        pitch: low
  chapters:
    - id: ch01
      title: What Happened at the Old Barrel
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            Peter Rabbit's leap over the old barrel caught Reddy Fox completely by surprise. Reddy was right at Peter's heels, thinking of nothing but catching him. He never gave the barrel a thought. He was running so fast that when Peter sailed over it, Reddy had no time to jump. He crashed smack into that old barrel instead.
        - id: ch01-b02
          speaker: narrator
          text: >-
            Remember, the barrel stood at the very edge of the hill. Reddy struck it so hard that it rolled over, and that sent it down the slope. A barrel is a very rolly thing, you know. Once one gets going down a hill, nothing can stop it.
        - id: ch01-b03
          speaker: narrator
          text: >-
            By the time Reddy picked himself up, the barrel was halfway down the hill and going faster and faster. It bounced over the rough ground. Whenever it struck a little hummock, it seemed to jump right into the air. All the while, the strangest noises came from inside it. Reddy forgot the smarting, sore places where he had hit the barrel. He simply stood there and stared at the runaway barrel.
        - id: ch01-b04
          speaker: reddy_fox
          text: >-
            Well, I do believe someone is inside that old barrel!
          emotion: surprised
        - id: ch01-b05
          speaker: narrator
          text: >-
            Someone was inside. Jimmy Skunk had curled up there for a nap, and now he was awake. He was very much awake. For once in his life, Jimmy was moving fast, much faster than he had ever moved since he was born. And it was not a comfortable way to travel. No, sir, it was not comfortable at all.
        - id: ch01-b06
          speaker: narrator
          text: >-
            Jimmy tumbled over and over so fast that he grew dizzy. One moment he was right side up, and the next he was upside down. The barrel turned so quickly that he could no longer tell which way was which. Each time it bounced over a hummock, Jimmy was tossed up against whichever part of the barrel happened to be above him. Of course he could not climb out. He was rolling too fast even to get a chance to try.
        - id: ch01-b07
          speaker: narrator
          text: >-
            Reddy had no idea who was in there. The sounds only told him that somebody was. So he started down the hill after the barrel. He wanted to see what would happen when it finally stopped.
        - id: ch01-b08
          speaker: narrator
          text: >-
            Peter Rabbit danced around in great excitement. Still, he took great care to stay close to Johnny Chuck's old house. That way, he could dart inside if danger came. Reddy had forgotten him completely. He was far too curious about the passenger in the barrel. Peter chuckled when he imagined Reddy discovering who it was. Overhead, Sammy Jay flew along and screamed as if he might split his throat. All together, it was the most exciting thing Peter had ever seen.
        - id: ch01-b09
          speaker: narrator
          text: >-
            Just then, Old Man Coyote was crossing the Green Meadows at the foot of the hill. He heard the noise and looked up. The barrel was rushing straight toward him. Old Man Coyote gave one frightened yelp and raced toward the Old Pasture like a gray streak. Peter saw just how fast he could run and decided on the spot that he would never race Old Man Coyote.
        - id: ch01-b10
          speaker: narrator
          text: >-
            A big stone lay at the bottom of the hill. The barrel struck it, its hoops broke, and the whole thing fell apart. Peter decided it was time to disappear. He slipped into Johnny Chuck's old house and crouched just inside the doorway, where he could still watch.
        - id: ch01-b11
          speaker: narrator
          text: >-
            Jimmy Skunk lay perfectly still among the pieces of the barrel. A great fear crept into Peter's heart. Had Jimmy been killed? When Peter planned his joke, he had never once stopped to think about what might happen to Jimmy.
        - id: ch01-b12
          speaker: narrator
          text: >-
            Then Jimmy moved one leg, and after that another, as though he were checking that all his legs were still there. Slowly, he rolled over and stood up. Peter let out a long breath of relief.
