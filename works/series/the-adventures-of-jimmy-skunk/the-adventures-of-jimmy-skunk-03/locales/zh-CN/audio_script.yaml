audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 亲切机敏，带着温和的调侃
        timbre: 温暖清亮
        pace: 舒缓而有变化
        pitch: 中音
    reddy_fox:
      display_name: 红狐雷迪
      tts:
        delivery: 狡猾自信，盘算时带着得意
        timbre: 圆润低沉
        pace: 从容偏慢
        pitch: 中低音
  chapters:
    - id: ch01
      title: 木桶滚下山坡
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 彼得兔从山坡边的旧木桶上飞身跃过，这一下完全出乎红狐雷迪的意料。雷迪紧追在彼得脚后，心里只想着抓住他，根本顾不上别的。他跑得太快，已经来不及跟着起跳，结果一头撞上了旧木桶。
        - id: ch01-b02
          speaker: narrator
          text: 那只木桶正横在山坡边。雷迪撞得又重，木桶当场翻了过去，顺着山坡往下滚。木桶这种东西最会骨碌骨碌地滚了，一旦从坡上滚起来，什么也挡不住。
        - id: ch01-b03
          speaker: narrator
          text: 雷迪才从地上爬起来，木桶已经到了半山腰，而且越滚越快。它一路颠着、跳着，每碰到一个小土包，仿佛就会飞到空中。桶里还不停传出十分古怪的声音。雷迪忘了身上被撞得火辣辣的地方，只顾站在那里，呆呆望着那只失控的木桶。
    - id: ch02
      title: 吉米的飞快旅程
      blocks:
        - id: ch02-b01
          speaker: reddy_fox
          text: 我的老天，那只旧木桶里准是有谁！
          emotion: surprised
        - id: ch02-b02
          speaker: narrator
          text: 桶里的确有谁。臭鼬吉米原本蜷在那里睡午觉，现在他已经彻底醒了。这是他一生中头一回移动得这么快，比他出生以来任何时候都快。可这样的旅程，一点儿也不舒服。
        - id: ch02-b03
          speaker: narrator
          text: 吉米跟着木桶一圈圈翻滚，很快就转得头昏眼花。他一会儿头朝上，一会儿头朝下，快得连哪边才是上面都弄不清。木桶每次越过土包跳起来，吉米也会被高高抛起，撞上刚好转到头顶的桶壁。
        - id: ch02-b04
          speaker: narrator
          text: 他当然逃不出去。木桶翻滚得实在太快，他连试着往外爬的机会都没有。
    - id: ch03
      title: 山坡上下的追逐
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 雷迪只知道桶里藏着谁，却不知道那是谁。他马上追着木桶跑下山，等着看木桶停下来会发生什么。
        - id: ch03-b02
          speaker: narrator
          text: 彼得兔在一旁兴奋得手舞足蹈，又小心地守在土拨鼠约翰尼的旧宅附近。要是有危险，他就能立刻钻进去。他看得出来，雷迪一心想知道桶里是谁，早把他忘得干干净净。彼得想到木桶停下以后，雷迪可能会发现什么，忍不住暗暗发笑。
        - id: ch03-b03
          speaker: narrator
          text: 冠蓝鸦萨米飞在空中，拼命尖叫，仿佛要把嗓子喊破。这可真是彼得有生以来见过的最刺激的一幕。
        - id: ch03-b04
          speaker: narrator
          text: 木桶刚开始往下滚时，老郊狼正要从山脚下穿过绿草地。他听见响声，抬头一看，只见那只木桶正朝自己飞滚而来。
        - id: ch03-b05
          speaker: narrator
          text: 老郊狼吓得叫了一声，随即像一道灰影，直奔老牧场。这回，彼得亲眼看见了他究竟能跑多快。彼得立刻拿定主意，自己绝不要跟老郊狼赛跑。
    - id: ch04
      title: 木桶散了架
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 山脚下有一块大石头。木桶猛地撞了上去，桶箍崩开，整只桶一下散了架。彼得觉得，现在正该赶紧躲起来。他闪身钻进土拨鼠约翰尼的旧宅，伏在门口不动，只从那里往外看。
        - id: ch04-b02
          speaker: narrator
          text: 臭鼬吉米躺在地上，一动也不动。彼得心里慢慢生出一阵深深的恐惧。吉米难道摔死了吗？他设计这个玩笑的时候，从来没有想过吉米可能会出事。
        - id: ch04-b03
          speaker: narrator
          text: 过了一会儿，吉米先动了动一条腿，又动了动另一条，好像要确认自己的腿还一条不少。然后，他慢慢翻过身，站了起来。
        - id: ch04-b04
          speaker: narrator
          text: 彼得终于松了一口气。
