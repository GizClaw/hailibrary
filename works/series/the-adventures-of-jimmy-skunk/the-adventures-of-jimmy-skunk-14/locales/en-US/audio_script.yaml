audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm, observant storytelling with a gently playful edge
        timbre: clear and rounded
        pace: measured
        pitch: medium
    jimmy_skunk:
      display_name: Jimmy Skunk
      tts:
        delivery: easygoing and deliberate, with quiet confidence
        timbre: mellow and grounded
        pace: unhurried
        pitch: medium-low
    mrs_grouse:
      display_name: Mrs. Grouse
      tts:
        delivery: tender and sincere, with quiet motherly warmth
        timbre: soft and full
        pace: gentle
        pitch: medium
    unc_billy_possum:
      display_name: Unc' Billy Possum
      tts:
        delivery: sly and good-humored, with an easy Southern drawl
        timbre: wiry and warm
        pace: relaxed
        pitch: medium
  chapters:
    - id: ch01
      title: A Little Something About Eggs
      blocks:
        - id: ch01-b01
          speaker: jimmy_skunk
          text: >-
            An egg is good. Yes, sir, it's very good to eat.
        - id: ch01-b02
          speaker: narrator
          text: >-
            That is how Jimmy Skunk thinks about an egg. Mrs. Grouse sees it very differently.
        - id: ch01-b03
          speaker: mrs_grouse
          text: >-
            An egg is precious to me. Before long, it will hatch into a dear little baby.
        - id: ch01-b04
          speaker: narrator
          text: >-
            So eggs are like many other things. What they mean depends on who is looking at them. Jimmy Skunk and Unc' Billy Possum think of eggs as food. Their stomachs do the thinking. Eggs fill an empty stomach, and the very thought of one makes them smack their lips. They say they love eggs, but that is not quite true. They like eggs. Loving and liking are not the same.
        - id: ch01-b05
          speaker: narrator
          text: >-
            Mrs. Grouse and most of the other feathered folk truly do love eggs. The thought of eggs stirs their hearts, not their stomachs. Eggs are almost as precious to them as babies, because they know those eggs will soon become babies.
        - id: ch01-b06
          speaker: narrator
          text: >-
            Sad to say, a few feathered folk love their own eggs but only like everyone else's. They like those other eggs in the very same way Jimmy Skunk and Unc' Billy do. They like to eat them. Blacky the Crow is one of those birds, and so is his cousin Sammy Jay.
        - id: ch01-b07
          speaker: narrator
          text: >-
            That is why spring brings such a battle of wits to the Green Forest, the Green Meadows, and the Old Orchard. The little people who have eggs try to keep them secret. They hide their nests, or build them where no hungry egg hunter can reach them. Meanwhile, everyone with a taste for eggs is trying just as hard to find them.
        - id: ch01-b08
          speaker: narrator
          text: >-
            Unc' Billy Possum had suddenly asked Jimmy whether he had found any nice fresh eggs lately. That question touched Jimmy very close to the heart. No, the stomach would be more truthful. A longing for eggs was the very reason Jimmy had come to the Green Forest.
        - id: ch01-b09
          speaker: narrator
          text: >-
            Somewhere in the forest, Jimmy felt sure, Mrs. Grouse had hidden a nest filled with the nicest eggs. Jimmy had come there to hunt for that nest.
        - id: ch01-b10
          speaker: jimmy_skunk
          text: >-
            No, I haven't found a single one this spring. I'm beginning to forget what an egg even tastes like. Maybe I'm getting slow and foolish, or maybe everyone else is getting cleverer. Say, have you happened to see Mrs. Grouse lately?
        - id: ch01-b11
          speaker: narrator
          text: >-
            Jimmy tried to look perfectly innocent as he asked. Unc' Billy chuckled so hard that his sides shook.
        - id: ch01-b12
          speaker: unc_billy_possum
          text: >-
            Do you reckon I'd tell you if I had? Mrs. Grouse can't have any more eggs than I could comfortably take care of myself. And that is without even mentioning Mrs. Possum.
        - id: ch01-b13
          speaker: narrator
          text: >-
            Unc' Billy glanced back over his shoulder to make sure old Mrs. Possum could not hear him. Jimmy chuckled.
        - id: ch01-b14
          speaker: unc_billy_possum
          text: >-
            Seems to me, Brer Skunk, you'd do better hunting eggs over on the Green Meadows. You leave the Green Forest to me, and that will be fair. You know I never did care to wander far from the trees, but you don't mind doing it.
        - id: ch01-b15
          speaker: unc_billy_possum
          text: >-
            Besides, you can find more eggs on the Green Meadows than I can find here in the forest. A right smart number of birds build their nests on the ground over there. There's Brer Bob White, and Brer Meadowlark, and Brer Bobolink, and Brer Field Sparrow, and Brer—
        - id: ch01-b16
          speaker: jimmy_skunk
          text: >-
            That's enough, Unc' Billy. I already know all I care to know about those birds. The one thing I don't know is where they keep their eggs. I just told you I haven't found any at all. That's why I came over here.
        - id: ch01-b17
          speaker: unc_billy_possum
          text: >-
            Well, you won't do any better here unless you're a great deal sharper than your Unc' Billy. When it comes to hunting eggs, I don't step aside for anybody. No, sir, not even for you, Brer Skunk.
