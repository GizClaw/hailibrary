audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 亲切机敏，带着温和的调侃
        timbre: 温暖清亮
        pace: 舒缓而有变化
        pitch: 中音
    jimmy_skunk:
      display_name: 臭鼬吉米
      tts:
        delivery: 平日温厚从容，发怒时严厉干脆
        timbre: 沉稳厚实
        pace: 从容偏慢
        pitch: 中低音
    unc_billy_possum:
      display_name: 比利负鼠大叔
      tts:
        delivery: 乡音浓厚，风趣世故，玩笑说得一本正经
        timbre: 粗暖而略带沙哑
        pace: 慢条斯理
        pitch: 中低音
    mrs_grouse:
      display_name: 松鸡太太
      tts:
        delivery: 慈爱认真，谈起孩子时格外温柔
        timbre: 柔和温润
        pace: 舒缓
        pitch: 中高音
  chapters:
    - id: ch01
      title: 爱鸡蛋，还是喜欢鸡蛋
      blocks:
        - id: ch01-b01
          speaker: jimmy_skunk
          text: 鸡蛋好，鸡蛋妙，吃进肚里味道好。
        - id: ch01-b02
          speaker: mrs_grouse
          text: 鸡蛋亲，鸡蛋乖，孵出宝宝真可爱。
        - id: ch01-b03
          speaker: narrator
          text: 鸡蛋这回事，就像许多别的事情一样，全看你站在哪一边。吉米和比利大叔一看到蛋，先想到的就是自己的肚子。是肚子催着他们惦记鸡蛋。空着肚子的时候，鸡蛋正好拿来填一填。光是想想，他们就会忍不住咂嘴。
        - id: ch01-b04
          speaker: narrator
          text: 他们总说自己“爱”鸡蛋，其实只是“喜欢”鸡蛋。这两个字听着相近，意思却差得远了。
        - id: ch01-b05
          speaker: narrator
          text: 松鸡太太，还有绿森林、绿草地和老果园里大多数长羽毛的居民，才是真的爱鸡蛋。他们一想到蛋，动的不是肚子，是心。蛋在他们眼里几乎和小宝宝一样珍贵，因为他们知道，用不了多久，每一颗蛋里都会孵出一个小宝宝。
        - id: ch01-b06
          speaker: narrator
          text: 可惜也有少数长羽毛的家伙，他们爱自己窝里的蛋，却喜欢别人窝里的蛋，而且是像吉米和比利大叔那样，喜欢把蛋吃进肚里。乌鸦布莱基就是这样，他的表亲冠蓝鸦萨米也一样。
        - id: ch01-b07
          speaker: narrator
          text: 因此每到春天，绿森林、绿草地和老果园的小居民之间，总要展开一场斗智。有蛋的拼命保守窝里的秘密，不让别人知道，或者把窝筑在馋嘴家伙够不到的地方。想吃蛋的呢，就到处寻找这些藏起来的窝。
    - id: ch02
      title: 吉米打听松鸡太太
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 比利大叔忽然问吉米，最近有没有找到新鲜的好鸡蛋。这一下正问到吉米的心坎上。不，应该说是问到他的肚子里。吉米就是馋鸡蛋，才来到绿森林的。
        - id: ch02-b02
          speaker: narrator
          text: 他认定松鸡太太在这附近藏着满满一窝顶好的蛋。他来这里，就是要找到它们。
        - id: ch02-b03
          speaker: jimmy_skunk
          text: 没有。这个春天，我的运气坏透了，连鸡蛋是什么滋味都快忘啦。要么是我越来越迟钝，越来越笨，要么就是有些家伙比从前聪明了。
        - id: ch02-b04
          speaker: jimmy_skunk
          text: 对了，比利大叔，你最近见过松鸡太太吗？
        - id: ch02-b05
          speaker: narrator
          text: 吉米问得一脸无辜。比利大叔一听，咯咯笑起来，两肋都笑得直颤。
        - id: ch02-b06
          speaker: unc_billy_possum
          text: 就算俺见过，你觉得俺会告诉你吗？松鸡太太那一窝蛋，就算全归俺，大概也不够俺舒舒服服地吃一顿。何况家里还有负鼠太太哩。
        - id: ch02-b07
          speaker: narrator
          text: 说完，比利大叔赶紧回头瞧了瞧，先确定老负鼠太太不在近旁，听不到这话。臭鼬吉米也咯咯笑了。
    - id: ch03
      title: 谁该去哪里找蛋
      blocks:
        - id: ch03-b01
          speaker: unc_billy_possum
          text: 依俺看，臭鼬老弟，你还是上绿草地找蛋去吧，把绿森林留给俺。这样才算公平。
        - id: ch03-b02
          speaker: unc_billy_possum
          text: 你知道，俺不乐意离树太远，你却不在乎。再说，绿草地上的蛋比绿森林里多。好多鸟都把窝筑在地上哩。
        - id: ch03-b03
          speaker: unc_billy_possum
          text: 你瞧，山齿鹑鲍勃老弟、草地鹨老弟、食米鸟鲍勃老弟和田雀老弟，它们全都把窝筑在地上哩。
        - id: ch03-b04
          speaker: jimmy_skunk
          text: 行了，比利大叔，别再数啦。这些鸟的事，我想知道的全知道。只有一件事除外，那就是它们把蛋藏在哪儿。
        - id: ch03-b05
          speaker: jimmy_skunk
          text: 我刚才不是说了吗？这个春天，我一点儿运气也没有。正因为这样，我才跑到绿森林来。
        - id: ch03-b06
          speaker: unc_billy_possum
          text: 好吧，可你到了这里也不会走运。除非你比你比利大叔高明一大截。
        - id: ch03-b07
          speaker: unc_billy_possum
          text: 要说找鸡蛋，俺可不服任何人。就连你臭鼬老弟，俺也不服。
