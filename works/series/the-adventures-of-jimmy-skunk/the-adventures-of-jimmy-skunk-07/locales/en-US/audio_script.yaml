audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm, observant storytelling with a gently playful edge
        timbre: clear and rounded
        pace: measured
        pitch: medium
    sammy_jay:
      display_name: Sammy Jay
      tts:
        delivery: sharp, curious, and quick to take offense
        timbre: crisp and piercing
        pace: brisk
        pitch: high
    jimmy_skunk:
      display_name: Jimmy Skunk
      tts:
        delivery: easygoing, dignified, and plainspoken
        timbre: mellow and full
        pace: unhurried
        pitch: medium-low
  chapters:
    - id: ch01
      title: Sammy Jay Does Some Guessing
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            Sammy Jay is a queer fellow. He is a scamp who dearly loves making trouble for his neighbors. But when someone else makes trouble for them, Sammy is always ready to take their side. Many times, he has warned them when danger was near. That is one reason they are willing to forgive his faults.
        - id: ch01-b02
          speaker: narrator
          text: >-
            In many ways, Sammy is no better than Reddy Fox. Even so, he loves to spoil Reddy's plans, and he is usually delighted when Reddy gets into trouble. Sammy had been right there when Reddy struck the old barrel at the top of the hill and sent it rolling. He was just as surprised as Reddy to discover someone inside. He followed Reddy to find out who it was, and so he saw everything that happened to him.
        - id: ch01-b03
          speaker: narrator
          text: >-
            Sammy did not feel sorry for poor Reddy. Far from it. He openly rejoiced over Reddy's trouble, laughing and making fun of him. A great many people are like that. They enjoy seeing someone who is thought to be very clever get into trouble. For Sammy, the whole thing had been exciting, and he dearly loves excitement. It would also make a splendid story, and no one enjoys carrying tales more than Sammy Jay.
        - id: ch01-b04
          speaker: narrator
          text: >-
            Sammy watched Reddy sneak off toward the Green Forest. Then he watched Jimmy Skunk walk slowly away with great dignity. Sammy flew back to the Old Orchard to spread the news among the little people who lived there.
        - id: ch01-b05
          speaker: narrator
          text: >-
            Only when he reached the orchard did Sammy remember Peter Rabbit. He had meant to fly around telling everyone what had happened to Jimmy and Reddy. Instead, he settled on a comfortable branch in an old apple tree and became strangely quiet. For Sammy, that was most unusual. The splendid story could wait. Sammy was thinking hard. He had begun to wonder why Peter had disappeared so suddenly.
        - id: ch01-b06
          speaker: narrator
          text: >-
            An idea had popped into his shrewd little head.
        - id: ch01-b07
          speaker: sammy_jay
          text: >-
            Jimmy is certain Reddy rolled that barrel downhill on purpose, and I can see why he thinks so. But I watched the whole thing. I know it was an accident as far as Reddy was concerned. I didn't know Jimmy was inside, and Reddy couldn't have known either. He came up here after I did. But maybe Peter knew. Why did he run straight for the barrel and jump over it when he could have gone around?
        - id: ch01-b08
          speaker: sammy_jay
          text: >-
            Maybe Peter only meant to send Reddy slam bang into the barrel. That would stop Reddy long enough for Peter to escape. It would be a clever trick, and just like Peter. Still, I have a feeling Peter knew Jimmy was sleeping inside. He must have known that disturbing Jimmy would cause trouble.
        - id: ch01-b09
          speaker: sammy_jay
          text: >-
            The longer I think about it, the more I believe Peter planned everything. If he did, that was one of the smartest tricks I've ever heard of. I never thought Peter had it in him. It was hard on Jimmy, but it got rid of Reddy for a while. Reddy won't dare show his face around here for a long time, so Peter has one less thing to worry about.
        - id: ch01-b10
          speaker: narrator
          text: >-
            Just then, Sammy saw Jimmy Skunk coming.
        - id: ch01-b11
          speaker: sammy_jay
          text: >-
            Hello! Here comes Jimmy. I'll ask him a few questions.
        - id: ch01-b12
          speaker: narrator
          text: >-
            Jimmy came ambling along in his usual lazy way. His good nature had returned. He felt that he and Reddy were more than even now. The wild ride in the barrel had done him no harm, so he had quite forgotten losing his temper.
        - id: ch01-b13
          speaker: sammy_jay
          text: >-
            Hello, Jimmy! Did you happen to see Peter Rabbit this morning?
        - id: ch01-b14
          speaker: narrator
          text: >-
            Jimmy looked up and grinned.
        - id: ch01-b15
          speaker: jimmy_skunk
          text: >-
            Yes. I saw him up here early this morning. Why do you ask?
        - id: ch01-b16
          speaker: sammy_jay
          text: >-
            Did Peter watch you climb into that old barrel?
        - id: ch01-b17
          speaker: jimmy_skunk
          text: >-
            I don't know. He might have. What are you thinking about, Sammy Jay?
        - id: ch01-b18
          speaker: sammy_jay
          text: >-
            Oh, not much. Only Reddy Fox was chasing Peter when Reddy crashed into the barrel and sent you rolling downhill.
        - id: ch01-b19
          speaker: narrator
          text: >-
            Jimmy's ears pricked up.
        - id: ch01-b20
          speaker: jimmy_skunk
          text: >-
            Then Reddy didn't do it on purpose!
          emotion: surprised
        - id: ch01-b21
          speaker: sammy_jay
          text: >-
            No, he didn't. I'm quite sure Reddy had no idea you were inside. But what about Peter Rabbit? That's what I'm wondering about. And I'm doing a little guessing too.
