audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 亲切机敏，带着温和的调侃
        timbre: 温暖清亮
        pace: 舒缓而有变化
        pitch: 中音
    sammy_jay:
      display_name: 冠蓝鸦萨米
      tts:
        delivery: 好奇直率，发火时尖锐急促
        timbre: 清脆响亮
        pace: 偏快
        pitch: 高音
    jimmy_skunk:
      display_name: 臭鼬吉米
      tts:
        delivery: 平日温厚从容，发怒时严厉干脆
        timbre: 沉稳厚实
        pace: 从容偏慢
        pitch: 中低音
  chapters:
    - id: ch01
      title: 古怪的萨米
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 冠蓝鸦萨米是个古怪的家伙。他是个淘气鬼，最爱给邻居们惹麻烦。可别人要来找邻居们的麻烦，他又总肯站出来帮忙。好多次，都是他及时警告大家，告诉他们危险就要来了。这也正是邻居们愿意原谅他那些毛病的原因之一。
        - id: ch01-b02
          speaker: narrator
          text: 萨米在许多方面并不比红狐雷迪好多少，却最爱破坏雷迪的计划。每次雷迪惹上麻烦，他还常常看得很开心。雷迪在山顶撞上旧木桶，把桶撞得滚下山坡时，萨米就在旁边。他和雷迪一样吃惊，没想到桶里竟然藏着谁。为了看清那是谁，他跟着雷迪一路追了下去，也就看到了雷迪后来的遭遇。
        - id: ch01-b03
          speaker: narrator
          text: 萨米一点儿也不同情雷迪，反倒当众欢呼起来。他又笑又嘲弄，尽拿可怜的雷迪取乐。许多人就是这样，平时公认很聪明的家伙一倒霉，他们就爱看热闹。再说，这件事实在刺激，而萨米最喜欢的就是刺激。它还能讲成一个多么精彩的故事啊！谁也没有萨米那么爱到处传闲话。
    - id: ch02
      title: 老苹果树上的疑问
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 萨米看着雷迪悄悄溜进绿森林，又看着臭鼬吉米迈着庄重的步子慢慢离开。接着，他飞回老果园，准备把消息告诉那里的小居民。
        - id: ch02-b02
          speaker: narrator
          text: 一直到了老果园，他才想起彼得兔。萨米本来要飞来飞去，把吉米和雷迪的遭遇讲给每个人听。可他没有那样做，反而在一棵老苹果树上找了根舒服的树枝落下，出奇地一声不响。原来，他正在拼命动脑筋。他突然起了疑心。彼得怎么一下子不见了？这个问题钻进他那颗机灵的小脑袋里，越想越古怪。
        - id: ch02-b03
          speaker: sammy_jay
          text: 吉米认定是雷迪故意把木桶撞下山坡的，他会这么想也难怪。可我全看见了。对雷迪来说，这完全是个意外。我不知道吉米在桶里，雷迪更不可能知道，他比我还晚来呢。可是彼得也许知道。旁边明明能跑，他为什么偏要从木桶上跳过去？
        - id: ch02-b04
          speaker: sammy_jay
          text: 也许彼得只是想叫雷迪狠狠撞上木桶，让木桶拦他一会儿，自己好趁机逃走。这主意很聪明，也像是彼得会想出来的。可我总觉得，他早就知道吉米在桶里睡午觉。他也知道，一旦吵醒吉米，准会出事。
        - id: ch02-b05
          speaker: sammy_jay
          text: 我越想越觉得，整件事就是彼得安排的。要真是这样，这可是我听过的最聪明的花招之一。我以前真没想到，他还有这等本事。吉米是吃了点儿苦头，可雷迪有一阵子不会来捣乱了。他很久都不敢在附近露脸，彼得也就少了一件操心事。
    - id: ch03
      title: 吉米走来了
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 正想着，萨米看见臭鼬吉米来了。
        - id: ch03-b02
          speaker: sammy_jay
          text: 嘿，吉米来了。我得问他几个问题。
        - id: ch03-b03
          speaker: narrator
          text: 吉米还是平常那副慢悠悠的样子，一路晃了过来。他的好脾气已经全回来了。如今，他觉得自己不但跟红狐雷迪扯平了，还占了上风。那趟木桶里的疯狂旅程并没有伤着他，所以他早把自己发过脾气的事忘得一干二净。
        - id: ch03-b04
          speaker: sammy_jay
          text: 你好啊，吉米。今天早上，你见过彼得兔吗？
        - id: ch03-b05
          speaker: narrator
          text: 吉米抬起头，咧嘴笑了。
        - id: ch03-b06
          speaker: jimmy_skunk
          text: 见过。今天一大早，我在这上面看见他了。怎么啦？
        - id: ch03-b07
          speaker: sammy_jay
          text: 那你钻进旧木桶的时候，彼得看见了吗？
        - id: ch03-b08
          speaker: jimmy_skunk
          text: 我不知道。他也许看见了。萨米，你到底在琢磨什么？
    - id: ch04
      title: 萨米的猜测
      blocks:
        - id: ch04-b01
          speaker: sammy_jay
          text: 没什么大不了的。就是雷迪撞上木桶，把你撞得滚下山坡时，他正在追彼得兔呢。
        - id: ch04-b02
          speaker: narrator
          text: 吉米一听，马上竖起了耳朵。
        - id: ch04-b03
          speaker: jimmy_skunk
          text: 这么说，雷迪不是故意干的！
          emotion: surprised
        - id: ch04-b04
          speaker: sammy_jay
          text: 不是，他不是故意的。我敢肯定，雷迪根本不知道你在桶里。可是彼得兔是不是早就知道呢？这我可说不好。我心里一直在琢磨，也正在猜呢。
