audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm, observant storytelling with a gently playful edge
        timbre: clear and rounded
        pace: measured
        pitch: medium
    jimmy_skunk:
      display_name: Jimmy Skunk
      tts:
        delivery: easygoing and deliberate, with quiet confidence
        timbre: mellow and grounded
        pace: unhurried
        pitch: medium-low
  chapters:
    - id: ch01
      title: Jimmy Smiles to Himself
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            Jimmy Skunk smiled as he ambled toward Johnny Chuck's old house near the foot of the hill. No one was around to see him, and that made his smile grow even wider. Not long before, he had thrown his perfume at Reddy Fox. The smell was still very, very strong there, so Jimmy knew nobody else would come near the place until it faded away.
        - id: ch01-b02
          speaker: narrator
          text: >-
            Jimmy did not mind the smell at all. He could never understand why everyone else found it so unpleasant, though he had puzzled over that many times. Still, he was glad they disliked it. Because of his perfume, everyone treated him with respect and took special care not to quarrel with him.
        - id: ch01-b03
          speaker: jimmy_skunk
          text: >-
            I suppose it's a good thing Old Mother Nature didn't make us all the same. I think something must be wrong with their noses, and they probably think something is wrong with mine. But there isn't. Not one thing! Oh, look. Johnny Chuck's old house is right ahead. Now we'll see what we shall see.
    - id: ch02
      title: Soft Steps to the Door
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            As Jimmy drew close to the old house, he began to walk softly. If Peter was deep inside, it would not matter how Jimmy came near. But Peter might be lying just inside the doorway. If he heard footsteps, he might decide to run, especially if they were too light to belong to Reddy Fox, Granny Fox, or Old Man Coyote.
        - id: ch02-b02
          speaker: narrator
          text: >-
            Jimmy meant to give Peter no such chance. Once Peter got outside, his long legs would soon carry him beyond Jimmy's reach. Jimmy knew that very well. If he was going to give Peter the fright he had planned, he first had to catch him somewhere he could not run away.
        - id: ch02-b03
          speaker: narrator
          text: >-
            So Jimmy moved as quietly as he could. He also kept out of sight of the doorway, in case Peter was lying where he could look outside.
        - id: ch02-b04
          speaker: narrator
          text: >-
            At last Jimmy reached a spot where one jump would carry him straight onto the doorstep. He waited there for a few minutes with his head cocked to one side, listening. Not a sound told him whether Peter was inside. Then he sprang lightly onto the step and peered through the doorway. Peter was nowhere to be seen.
        - id: ch02-b05
          speaker: jimmy_skunk
          text: >-
            If Peter is here, he must be far down inside. But is he really here? I think I'll look around before I go in.
    - id: ch03
      title: Tracks in the Sand
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            Johnny Chuck's doorstep was made of sand, just as all his doorsteps were. Jimmy had barely begun to look when he chuckled. There were Peter's tracks, pointing straight into the old house.
        - id: ch03-b02
          speaker: narrator
          text: >-
            Jimmy searched carefully, but he could not find a single track pointing back out. That made him chuckle again.
        - id: ch03-b03
          speaker: jimmy_skunk
          text: >-
            That scamp is here, all right. He hid in this house and watched everything happen. Then he decided to stay quiet until the way was clear and no one could see him leave.
        - id: ch03-b04
          speaker: narrator
          text: >-
            Jimmy was partly right and partly wrong about that, as you and I know.
    - id: ch04
      title: Yellow Jackets at the Door
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            For a moment, Jimmy stared down the long, dark doorway. Then he made up his mind.
        - id: ch04-b02
          speaker: jimmy_skunk
          text: >-
            I'll go down and pay Peter a visit. I don't think I'll bother knocking.
        - id: ch04-b03
          speaker: narrator
          text: >-
            Jimmy chuckled and poked his head into the doorway. But that was as far as he went. Yes, sir, that was exactly as far as Jimmy Skunk went. The instant he tried to enter Johnny Chuck's old house, a great many Yellow Jackets met him, and they were in a very bad temper.
        - id: ch04-b04
          speaker: narrator
          text: >-
            Jimmy knew all about Yellow Jackets and the sharp little lances they carried in their tails. He had the greatest respect for them. He backed out in a hurry and even hurried away until he was a safe distance from the house. Then he sat down to think.
        - id: ch04-b05
          speaker: narrator
          text: >-
            After a little while, Jimmy began to chuckle once more.
        - id: ch04-b06
          speaker: jimmy_skunk
          text: >-
            Now I know what happened. Peter Rabbit jumped into that doorway, and those Yellow Jackets went straight after him. He was afraid to come back out because Reddy Fox and I were there, so he kept going until he reached Johnny Chuck's old bedroom. He's down there now, wondering how he'll ever get out without being stung. I don't need to frighten Peter to pay him back for that joke. I reckon he's been punished already.
