audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 亲切机敏，带着温和的调侃
        timbre: 温暖清亮
        pace: 舒缓而有变化
        pitch: 中音
    jimmy_skunk:
      display_name: 臭鼬吉米
      tts:
        delivery: 平日温厚从容，发怒时严厉干脆
        timbre: 沉稳厚实
        pace: 从容偏慢
        pitch: 中低音
  chapters:
    - id: ch01
      title: 没人靠近的地方
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 臭鼬吉米面带微笑，慢悠悠地走向山脚附近土拨鼠约翰的旧屋。四周一个人也没有，他笑得更开心了。不久前，他才朝红狐雷迪喷过一股“香水”，那味道还浓得很。吉米知道，气味不散，谁也不会靠近，因为大家闻了都觉得难受。可他自己完全不讨厌这个味道，也一直弄不明白，别人为什么那么嫌弃。他想过好多次，却始终想不通。不过，吉米很庆幸大家不喜欢。正是因为这股气味，谁都敬他三分，也不敢轻易跟他争吵。
        - id: ch01-b02
          speaker: jimmy_skunk
          text: 大自然妈妈没把我们全都造得一样，看来是件好事。他们的鼻子准有点儿毛病。当然，他们可能觉得我的鼻子才有毛病。可我的鼻子好得很，一点儿问题也没有。嘿，前面就是土拨鼠约翰的旧屋。现在去看看，里面究竟有什么。
    - id: ch02
      title: 悄悄靠近旧屋
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 快到旧屋时，吉米放轻了脚步。要是彼得躲在地洞深处，吉米怎样靠近都不要紧。可彼得要是正待在门里面，听到脚步声，很可能拔腿就跑。尤其那脚步不够沉，一听就知道来的不是红狐雷迪、老狐狸奶奶或老郊狼，他就更可能溜走。吉米不想给彼得这个机会。彼得只要逃到屋外，就会用那双长腿把他远远甩开。吉米心里清楚，自己既然打算吓彼得一跳，就得先把彼得堵在逃不掉的地方。所以，他走得能有多轻就有多轻，还绕到彼得看不见的一边靠近旧屋。这样一来，就算彼得正躺在门口朝外张望，也发现不了他。
        - id: ch02-b02
          speaker: narrator
          text: 终于，吉米来到一个地方，从那里轻轻一跃，正好能落上门阶。他先等了几分钟，歪着脑袋听了听。屋里静悄悄的，听不出彼得到底在不在。接着，他轻巧地跳上门阶，往门里一瞧，哪里有彼得的影子。
        - id: ch02-b03
          speaker: jimmy_skunk
          text: 他要是真在这儿，准是躲到地洞深处了。可他到底在不在呢？我还是先在周围找一找，再进去吧。
    - id: ch03
      title: 沙地上的脚印
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 土拨鼠约翰家的门阶总是沙地，这座旧屋也一样。吉米很快就低声笑了起来。他看见了彼得的脚印，那些脚印一直朝旧屋里面伸去。他仔仔细细找了一遍，却没发现一个朝外的脚印。这下，吉米又笑了。
        - id: ch03-b02
          speaker: jimmy_skunk
          text: 那个小淘气果然藏在这里。他躲在屋里看完了外面发生的事，就决定老老实实藏着，等到确定外面安全，也没人能看见他，再悄悄出来。
        - id: ch03-b03
          speaker: narrator
          text: 你我都知道，吉米这番猜测，有一半对了，另一半却猜错了。他朝又长又黑的门道里看了一会儿，心里有了主意。
        - id: ch03-b04
          speaker: jimmy_skunk
          text: 我下去拜访一下彼得吧，门也不用敲了。
        - id: ch03-b05
          speaker: narrator
          text: 吉米低声笑着，把脑袋探进门道。可他也只走到了这里。没错，臭鼬吉米一步也没再往前。因为他刚想钻进土拨鼠约翰的旧屋，一大群黄胡蜂就迎面扑了过来。它们的脾气坏透了。
    - id: ch04
      title: 彼得已经受了罚
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 臭鼬吉米很了解黄胡蜂，也知道它们尾巴上的小长矛有多尖。他对这些小家伙敬畏得很，连忙退了出去，竟一口气跑到安全的远处。他在那里坐下，认真想了想。过了一会儿，吉米又低声笑了起来。
        - id: ch04-b02
          speaker: jimmy_skunk
          text: 我知道是怎么回事了。彼得兔一头钻进门道，黄胡蜂自然追着他蜇。他怕出来以后碰上红狐雷迪和我，只能继续往下逃，一直逃到土拨鼠约翰从前的卧室。现在，他准躲在下面，正发愁怎么才能逃出来，又不挨黄胡蜂的蜇。为了报复那个玩笑，我本来还想吓唬彼得。现在看来，用不着了。他大概已经受过惩罚啦。
