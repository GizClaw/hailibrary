audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 亲切机敏，带着温和的调侃
        timbre: 温暖清亮
        pace: 舒缓而有变化
        pitch: 中音
    jimmy_skunk:
      display_name: 臭鼬吉米
      tts:
        delivery: 平日温厚从容，发怒时严厉干脆
        timbre: 沉稳厚实
        pace: 从容偏慢
        pitch: 中低音
    reddy_fox:
      display_name: 红狐雷迪
      tts:
        delivery: 狡猾自信，盘算时带着得意
        timbre: 圆润低沉
        pace: 从容偏慢
        pitch: 中低音
  chapters:
    - id: ch01
      title: 吉米动了真火
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 臭鼬吉米一生气，大伙儿千万要当心！这时候离他越远越好，最好压根儿别靠近。
        - id: ch01-b02
          speaker: narrator
          text: 吉米这回真的气坏了，一点儿也不假。你也知道，他本来是世上脾气最好的小家伙之一。他只管自己的事。别人不招惹他，他也绝不去招惹别人。可是，只要有人惹火了他，让他觉得受了欺负，那可就得小心了。
        - id: ch01-b03
          speaker: narrator
          text: 吉米站起身，抖抖身子，确认自己还是完完整整的。他从头到脚都在生气，我想谁也不能怪他。他原本舒舒服服地睡着午觉，却突然被弄醒，又被旧木桶载着滚下山坡，一路翻来倒去，颠得差点儿送了命。换了谁，都会动火。
        - id: ch01-b04
          speaker: narrator
          text: 吉米可一点儿也不笨。他知道，躺在原地很久的旧木桶不会自己动起来。一定有谁碰了它，它才会滚下山坡。吉米心里毫不怀疑，那家伙明明知道他在桶里，却故意要让他难受。他一确定自己真的还活着，身上也没少什么，马上四处张望，要找出是谁开了这个玩笑。
    - id: ch02
      title: 雷迪就在近旁
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 吉米第一个看见的是红狐雷迪。雷迪就在近旁。木桶往山下翻滚跳跃时，里面不断传出怪声，他便跟着一路飞奔下来，想看看桶里究竟是谁。
        - id: ch02-b02
          speaker: narrator
          text: 要是雷迪早知道里面是臭鼬吉米，他一定会心满意足地留在山顶，哪里也不去。可他不知道。说实话，他还盼着桶里能滚出谁来，正好给他当一顿美味的早餐呢。雷迪跑得上气不接下气，刚赶到木桶摔散架的地方，吉米正好从地上站起来。
    - id: ch03
      title: 大自然妈妈的香水袋
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 臭鼬吉米发怒时，既不咬人，也不抓人。大自然妈妈送给他一个小小的香水袋。吉米并不讨厌那股味道，可大多数人一闻见，就只想捂住鼻子逃走。
        - id: ch03-b02
          speaker: narrator
          text: 平常，吉米从不用这件法宝。只有生气或遇到危险，他才会出手。可他只要一用，敌人总会掉头就跑。所以吉米谁也不怕，大伙儿也都尊重他和他的权利。
        - id: ch03-b03
          speaker: narrator
          text: 这一次，吉米半点儿也没耽搁。雷迪还没来得及转身，也没来得及开口，一股“香水”已经迎面喷来，正落在他的脸上。
        - id: ch03-b04
          speaker: jimmy_skunk
          text: 尝尝这个！这回你该学会了吧，别再捉弄规规矩矩的邻居！
          emotion: angry
    - id: ch04
      title: 雷迪的辩解
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 可怜的雷迪！“香水”溅进眼睛，刺得他疼痛难忍。有一会儿，他什么也看不见。那股气味又浓得吓人，熏得他直犯恶心。雷迪倒在地上滚来滚去，不住地呛咳、喘气、揉眼睛。吉米只站在旁边看着，眼里没有半点儿同情。
        - id: ch04-b02
          speaker: jimmy_skunk
          text: 怎么样，这滋味好受吗？你让木桶载着我滚下山坡，还觉得自己聪明得很，是不是？你差点儿摔断我的脖子！
          emotion: angry
        - id: ch04-b03
          speaker: reddy_fox
          text: 我根本不知道你在桶里，也不是故意把木桶弄下山坡的。
        - id: ch04-b04
          speaker: narrator
          text: 雷迪好不容易才能说出话，声音里带着呜咽。吉米听完，从鼻子里重重哼了一声。
        - id: ch04-b05
          speaker: jimmy_skunk
          text: 哼！你说的这些，我一个字也不信。
          emotion: angry
        - id: ch04-b06
          speaker: reddy_fox
          text: 真不是我干的，我说的都是真的！我当时在追彼得兔，不小心撞上了木桶。我完全不知道里面有人。
    - id: ch05
      title: 彼得兔在哪儿
      blocks:
        - id: ch05-b01
          speaker: jimmy_skunk
          text: 哼！你要是真的在追彼得兔，那他现在在哪儿？
          emotion: angry
        - id: ch05-b02
          speaker: narrator
          text: 雷迪只好承认，他也不知道。彼得连影子都不见了，可这么短的工夫，他又绝不可能已经跑回亲爱的老荆棘丛。吉米朝这边看看，又往那边瞧瞧，到处都没有彼得兔的踪影。
        - id: ch05-b03
          speaker: narrator
          text: 吉米又从鼻子里哼了一声。他背过身去，不再理会红狐雷迪，迈着十分庄重的步子走了。
