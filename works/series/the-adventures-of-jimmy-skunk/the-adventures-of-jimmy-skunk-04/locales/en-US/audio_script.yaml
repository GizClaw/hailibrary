audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm, observant storytelling with a gently playful edge
        timbre: clear and rounded
        pace: measured
        pitch: medium
    jimmy_skunk:
      display_name: Jimmy Skunk
      tts:
        delivery: plainspoken, self-possessed, and firm when provoked
        timbre: compact and steady
        pace: measured
        pitch: medium-low
    reddy_fox:
      display_name: Reddy Fox
      tts:
        delivery: quick-witted and sly, turning breathless and pleading under pressure
        timbre: bright and wiry
        pace: brisk
        pitch: medium-high
  chapters:
    - id: ch01
      title: Jimmy Skunk Is Very Mad Indeed
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            When Jimmy Skunk is angry, then everyone watch out! At such a time, it is much better to be nowhere near him.
        - id: ch01-b02
          speaker: narrator
          text: >-
            This time, Jimmy Skunk was angry indeed. There was no mistake about it. He was simply mad, and no one wanted to be close when he felt that way. Usually, Jimmy was one of the best-natured little fellows in the world. He minded his own business. If no one bothered him, he bothered no one. But once he was roused, and felt that someone had treated him unfairly, it was time to watch out.
        - id: ch01-b03
          speaker: narrator
          text: >-
            Jimmy got to his feet, mad clear through. He shook himself to make sure every part of him was still there. And who could blame him? He had been enjoying a comfortable nap. Then that wild ride in the old barrel had woken him, rolled him over and over, and shaken him almost to death. That was enough to make anyone angry.
    - id: ch02
      title: Jimmy Looks for the Trickster
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            No one could ever call Jimmy stupid. An old barrel that had rested in one place for a long time would not suddenly move by itself. Someone had to start it down the hill. Jimmy had no doubt that whoever did it knew he was inside and meant to make him uncomfortable. First, he made sure that he truly was alive and quite whole. Then he looked around for the person who had played such a trick on him.
        - id: ch02-b02
          speaker: narrator
          text: >-
            The first person Jimmy saw was Reddy Fox, standing very close by. Reddy had raced after the barrel to find out who was inside. He had heard strange noises as it rolled and bounced downhill. If he had known Jimmy Skunk was in there, Reddy would have been perfectly happy to stay at the top. But he had not known. To tell the truth, he hoped the barrel might hold someone who could make him a good breakfast.
        - id: ch02-b03
          speaker: narrator
          text: >-
            Reddy ran until he was out of breath. He reached the spot where the old barrel had broken into pieces just as Jimmy stood up.
    - id: ch03
      title: Jimmy Teaches Reddy a Lesson
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            When Jimmy Skunk is angry, he does not bite or scratch. Old Mother Nature gave him a little bag of perfume. Jimmy does not object to that perfume in the least, but it makes most other people hold their noses and run. He never uses it unless he is angry or in danger. Whenever he does use it, his enemies turn and flee. That is why Jimmy is afraid of no one, and why everyone respects him and his rights.
        - id: ch03-b02
          speaker: narrator
          text: >-
            Jimmy used that perfume now, and he did not waste a moment. Before Reddy had a chance to turn away or say a single word, Jimmy sent some of it straight into his face.
        - id: ch03-b03
          speaker: jimmy_skunk
          text: >-
            There! Maybe that will teach you to stop playing tricks on honest neighbors!
          emotion: angry
        - id: ch03-b04
          speaker: narrator
          text: >-
            Poor Reddy! Some of the perfume got into his eyes, and they smarted terribly. For a little while, he could not see at all. Then there was the smell. It was so strong that it made him quite sick. He rolled over and over on the ground, choking, gasping, and rubbing his eyes. Jimmy Skunk simply stood there and watched. There was not a bit of pity in his eyes.
        - id: ch03-b05
          speaker: jimmy_skunk
          text: >-
            Well, how do you like it? You thought you were so clever when you rolled me downhill in that barrel, didn't you? You could have broken my neck!
          emotion: angry
    - id: ch04
      title: Reddy Tells His Story
      blocks:
        - id: ch04-b01
          speaker: reddy_fox
          text: >-
            I didn't know you were inside! And I never meant to send the barrel down the hill!
        - id: ch04-b02
          speaker: narrator
          text: >-
            Reddy whined those words as soon as he could speak again.
        - id: ch04-b03
          speaker: jimmy_skunk
          text: Huh! I don't believe a word of that at all.
        - id: ch04-b04
          speaker: narrator
          text: Jimmy snorted.
        - id: ch04-b05
          speaker: reddy_fox
          text: >-
            But I didn't do it on purpose. Truly, I didn't! I was chasing Peter Rabbit and bumped into the barrel by accident. I had no idea anyone was in there.
        - id: ch04-b06
          speaker: jimmy_skunk
          text: >-
            Huh! Then if you were after Peter Rabbit, where is he now?
        - id: ch04-b07
          speaker: narrator
          text: >-
            Reddy had to admit that he did not know. Peter was nowhere to be seen, though he could not possibly have reached the dear Old Briar-patch so quickly. Jimmy looked one way, then the other. There was no sign of Peter Rabbit.
        - id: ch04-b08
          speaker: jimmy_skunk
          text: Huh! I still don't believe your story.
        - id: ch04-b09
          speaker: narrator
          text: >-
            Jimmy turned his back on Reddy Fox and walked away with great dignity.
