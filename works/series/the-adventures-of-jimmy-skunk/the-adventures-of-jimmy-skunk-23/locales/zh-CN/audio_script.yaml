audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 亲切机敏，带着温和的调侃
        timbre: 温暖清亮
        pace: 舒缓而有变化
        pitch: 中音
    unc_billy_possum:
      display_name: 比利负鼠大叔
      tts:
        delivery: 乡音浓厚，风趣世故，玩笑说得一本正经
        timbre: 粗暖而略带沙哑
        pace: 慢条斯理
        pitch: 中低音
    farmer_browns_boy:
      display_name: 农夫布朗家的男孩
      tts:
        delivery: 直爽利落，遇事机灵又有分寸
        timbre: 明亮结实
        pace: 轻快自然
        pitch: 中音
    bowser_the_hound:
      display_name: 猎犬鲍泽
      tts:
        delivery: 忠诚直率，满怀坦荡的好奇
        timbre: 低沉厚实
        pace: 平稳
        pitch: 低音
    mrs_brown:
      display_name: 布朗太太
      tts:
        delivery: 实在温厚，话语里带着母亲般的关切
        timbre: 柔和饱满
        pace: 从容
        pitch: 中音
  chapters:
    - id: ch01
      title: 鲍泽来验真假
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 比利大叔装死的老把戏，从没演得像这回这么逼真。农夫布朗家的男孩明明知道他活得好好的，只是在等一个机会偷偷溜走。可是，比利大叔装得实在太像了。男孩看着那副死透了的模样，连自己明知无误的事实都快不敢相信了。
        - id: ch01-b02
          speaker: narrator
          text: 从鸡舍围场到屋子，他们走到一半，猎犬鲍泽小跑着迎了上来。
        - id: ch01-b03
          speaker: farmer_browns_boy
          text: 这下可知道结果了。比利大叔要是连鲍泽这一关都过得去，以后我每次见他，都得脱帽向他致敬。
        - id: ch01-b04
          speaker: narrator
          text: 男孩把比利大叔举到鲍泽面前。鲍泽凑上鼻子，从头到脚闻了个遍。想想吧，一个让你怕得要命的家伙正拿鼻子碰你，在你身上闻来闻去，你却连耳朵尖儿也不能动一下。那得有多难受！可比利大叔真的一动没动。
        - id: ch01-b05
          speaker: narrator
          text: 男孩又把他扔到地上。鲍泽拱着他翻了个身，重新闻遍全身，接着抬头看向小主人。那副神情已经把意思说得明明白白。
        - id: ch01-b06
          speaker: bowser_the_hound
          text: 这个家伙没什么好看的，他已经死了。昨晚钻到鸡舍底下的准是他。你是怎么把他弄死的？
        - id: ch01-b07
          speaker: narrator
          text: 农夫布朗家的男孩笑了，又提着尾巴把比利大叔拎起来。
        - id: ch01-b08
          speaker: farmer_browns_boy
          text: 老伙计，他把你骗得好惨，你自己还不知道呢。
        - id: ch01-b09
          speaker: narrator
          text: 鲍泽蹦蹦跳跳地先往屋子跑去。布朗太太正站在门口，看着他们过来。
    - id: ch02
      title: 可怜的小家伙
      blocks:
        - id: ch02-b01
          speaker: mrs_brown
          text: 你手里拿着什么？哎呀，是只负鼠！你在哪里把他弄死的？刚才母鸡闹出那么大的动静，就是他惹的吗？
        - id: ch02-b02
          speaker: narrator
          text: 男孩把比利大叔带进厨房，随手往一把椅子上一放。布朗太太走到椅子旁边，凑近了仔细瞧他。
        - id: ch02-b03
          speaker: mrs_brown
          text: 可怜的小家伙，真可怜。偏偏闯了祸，连命也丢了，实在叫人难过。我想，他根本不懂自己做错了什么。这些小动物压根儿不知道自己在闯祸，只因为惹了点麻烦就要杀掉它们，我总觉得不应该。
        - id: ch02-b04
          speaker: narrator
          text: 她轻轻摸着比利大叔。男孩的眼睛却闪着笑意。他走到墙角，从母亲的扫帚上抽出一根稻草，又回到椅子旁，拿稻草挠比利大叔的鼻子。布朗太太满脸不解，怎么也猜不出儿子想干什么。
        - id: ch02-b05
          speaker: mrs_brown
          text: 你挠他的鼻子做什么？
        - id: ch02-b06
          speaker: farmer_browns_boy
          text: 就是闹着玩儿。
        - id: ch02-b07
          speaker: narrator
          text: 男孩没有停手。尾巴挨捏，比利大叔忍得住。被人头朝下倒提着，他忍得住。让人扔到地上，他还是忍得住。可这根稻草在鼻子上挠个不停，实在超过了他的忍耐。他想打喷嚏，而且非打不可。
    - id: ch03
      title: 一声喷嚏露了马脚
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 比利大叔终于打了一个喷嚏。哪怕这一声可能要了他的命，他也实在忍不住。
        - id: ch03-b02
          speaker: mrs_brown
          text: 我的老天！难道这只负鼠还活着？
          emotion: surprised
        - id: ch03-b03
          speaker: narrator
          text: 布朗太太吓得向后一跳，两手紧抓住裙子，仿佛比利大叔会钻到她裙后躲起来。稻草还在挠他的鼻子，于是他又打了一个喷嚏。
        - id: ch03-b04
          speaker: farmer_browns_boy
          text: 看样子当然还活着。这个老坏蛋跟我一样好好的，他只是在装死。他骗过了你，妈妈，可没骗过我。我连他一根毛都没碰伤。你该了解我呀，我怎么会伤害他呢？
        - id: ch03-b05
          speaker: narrator
          text: 男孩委屈地看着母亲，好像在怪她怎么会不相信自己。布朗太太见了，连忙向儿子道歉，却也忍不住反问他。
        - id: ch03-b06
          speaker: mrs_brown
          text: 可我还能怎么想呢？我从没见过比他更像死了的家伙。孩子，你打算怎样安置他？
        - id: ch03-b07
          speaker: farmer_browns_boy
          text: 等吃过早饭，我就把他带到绿森林放掉。
    - id: ch04
      title: 回到绿森林
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 男孩果然说到做到。比利大叔一得到自由，片刻也不耽搁，赶紧回了家。
        - id: ch04-b02
          speaker: narrator
          text: 过了很久，比利大叔才再次碰见臭鼬吉米。吉米还是平常那副和和气气的样子。比利大叔也学聪明了，对鸡蛋的事只字不提。
