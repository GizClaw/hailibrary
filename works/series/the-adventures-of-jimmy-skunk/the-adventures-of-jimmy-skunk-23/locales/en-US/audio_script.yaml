audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm, observant storytelling with a gently playful edge
        timbre: clear and rounded
        pace: measured
        pitch: medium
    unc_billy_possum:
      display_name: Unc' Billy Possum
      tts:
        delivery: sly and good-humored, with an easy Southern drawl
        timbre: light and wiry
        pace: relaxed
        pitch: medium-high
    farmer_browns_boy:
      display_name: Farmer Brown's Boy
      tts:
        delivery: bright and confident, with an amused, kindly spirit
        timbre: clear and youthful
        pace: lively
        pitch: medium-high
    bowser_the_hound:
      display_name: Bowser the Hound
      tts:
        delivery: loyal and straightforward, with open curiosity
        timbre: deep and sturdy
        pace: steady
        pitch: low
    mrs_brown:
      display_name: Mrs. Brown
      tts:
        delivery: practical and warm, with motherly concern
        timbre: gentle and full
        pace: measured
        pitch: medium
  chapters:
    - id: ch01
      title: Bowser Puts Unc' Billy to the Test
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            Unc' Billy Possum had never played his old trick better. Farmer Brown's boy knew he was only pretending to be dead. Even so, Unc' Billy looked so lifeless that the boy could hardly believe what he knew was true. Unc' Billy was very much alive. He was watching and waiting for the first chance to slip away.
        - id: ch01-b02
          speaker: narrator
          text: >-
            They were halfway from the henyard to the house when Bowser the Hound trotted out to meet his master.
        - id: ch01-b03
          speaker: farmer_browns_boy
          text: >-
            Now we'll find out what happens. If Unc' Billy can pass this test, I'll take off my hat to him whenever we meet from now on.
        - id: ch01-b04
          speaker: narrator
          text: >-
            The boy held Unc' Billy out, and Bowser sniffed him from one end to the other. Imagine being nosed and sniffed by someone you feared terribly, without even twitching an ear. But Unc' Billy never moved.
        - id: ch01-b05
          speaker: narrator
          text: >-
            Farmer Brown's boy dropped him on the ground. Bowser rolled him over, sniffed him all over again, and looked up at his master.
        - id: ch01-b06
          speaker: bowser_the_hound
          text: >-
            This fellow doesn't interest me at all. He's dead. He must be the one I saw go under the henhouse last night. How did you kill him?
        - id: ch01-b07
          speaker: narrator
          text: >-
            That was just what Bowser's look seemed to say. Farmer Brown's boy laughed and picked Unc' Billy up by the tail again.
        - id: ch01-b08
          speaker: farmer_browns_boy
          text: >-
            He fooled you, old fellow, and you don't even know it.
        - id: ch01-b09
          speaker: narrator
          text: >-
            Bowser pranced ahead toward the house. Mrs. Brown stood in the doorway, watching them come.
    - id: ch02
      title: A Poor Little Fellow
      blocks:
        - id: ch02-b01
          speaker: mrs_brown
          text: >-
            What have you got there? Why, it's a possum! Where did you kill him? Was he the one who made all that noise among the chickens?
        - id: ch02-b02
          speaker: narrator
          text: >-
            Farmer Brown's boy carried Unc' Billy into the kitchen and set him on a chair. Mrs. Brown came closer for a better look.
        - id: ch02-b03
          speaker: mrs_brown
          text: >-
            Poor little fellow. Poor little fellow. It's too bad he got into mischief and had to be killed. I don't suppose he knew any better. It always feels wrong to kill little creatures for getting into mischief when they don't even know they're doing anything wrong.
        - id: ch02-b04
          speaker: narrator
          text: >-
            She gently stroked Unc' Billy. Farmer Brown's boy had a twinkle in his eyes. He went to a corner, pulled one straw from his mother's broom, and came back. Then he began to tickle Unc' Billy's nose with it. Mrs. Brown watched him, puzzled.
        - id: ch02-b05
          speaker: mrs_brown
          text: >-
            Why are you doing that?
        - id: ch02-b06
          speaker: farmer_browns_boy
          text: >-
            Just for fun.
        - id: ch02-b07
          speaker: narrator
          text: >-
            He kept tickling Unc' Billy's nose. Unc' Billy could bear having his tail pinched. He could bear being carried head down and dropped on the ground. But this was too much. He wanted to sneeze. He had to sneeze.
    - id: ch03
      title: The Sneeze That Gave Him Away
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            At last, Unc' Billy sneezed. He couldn't help it, even if that sneeze might cost him his life.
        - id: ch03-b02
          speaker: mrs_brown
          text: >-
            Land of love! Do you mean that possum is alive?
          emotion: surprised
        - id: ch03-b03
          speaker: narrator
          text: >-
            Mrs. Brown jumped back and clutched her skirts in both hands, as though Unc' Billy might try to hide behind them. The straw was still tickling his nose, and Unc' Billy sneezed again.
        - id: ch03-b04
          speaker: farmer_browns_boy
          text: >-
            It seems that way. Yes, I'd certainly say so. That old sinner is no more dead than I am. He's only pretending. He fooled you, Mother, but he didn't fool me. I haven't hurt one hair on him. You know me well enough by now to know I wouldn't harm him.
        - id: ch03-b05
          speaker: narrator
          text: >-
            Farmer Brown's boy looked at his mother as if she should have known better, and she quickly apologized.
        - id: ch03-b06
          speaker: mrs_brown
          text: >-
            But what else could I think? I've never seen any creature look more dead. What will you do with him, son?
        - id: ch03-b07
          speaker: farmer_browns_boy
          text: >-
            After breakfast, I'll take him to the Green Forest and let him go.
    - id: ch04
      title: Back to the Green Forest
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            And that is exactly what Farmer Brown's boy did. Once Unc' Billy was free, he lost no time getting home.
        - id: ch04-b02
          speaker: narrator
          text: >-
            A long time passed before Unc' Billy met Jimmy Skunk again. When they finally met, Jimmy was as good-natured as ever. Unc' Billy had learned enough to say nothing at all about eggs.
