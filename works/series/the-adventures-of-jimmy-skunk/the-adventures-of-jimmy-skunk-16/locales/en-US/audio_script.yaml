audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm, observant storytelling with a gently playful edge
        timbre: clear and rounded
        pace: measured
        pitch: medium
    jimmy_skunk:
      display_name: Jimmy Skunk
      tts:
        delivery: easygoing and deliberate, with quiet confidence
        timbre: mellow and grounded
        pace: unhurried
        pitch: medium-low
    unc_billy_possum:
      display_name: Unc' Billy Possum
      tts:
        delivery: sly and good-humored, with an easy Southern drawl
        timbre: light and wiry
        pace: relaxed
        pitch: medium-high
  chapters:
    - id: ch01
      title: Two Friends at the Same Hole
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            Being polite costs very little, and it is always the right thing to do.
        - id: ch01-b02
          speaker: narrator
          text: >-
            Among the Black Shadows beside Farmer Brown's henhouse, Unc' Billy Possum and Jimmy Skunk stood face-to-face near a hole that led underneath. Each one chuckled when he guessed why the other had come.
        - id: ch01-b03
          speaker: narrator
          text: >-
            It is strange how the same thought can bring two people together. Unc' Billy felt the same hungry longing Jimmy did, and both had the very same thing on their minds. This was already their second meeting that day. They had crossed paths that morning in the Green Forest, and now evening had brought them together again. Eggs were the reason for it all. Yes, sir, it was all because of eggs.
        - id: ch01-b04
          speaker: jimmy_skunk
          text: >-
            Are you on your way out, Unc' Billy, or were you about to go in?
        - id: ch01-b05
          speaker: unc_billy_possum
          text: >-
            Ah was about to go in, Brer Skunk, but Ah'll follow right behind yo'.
        - id: ch01-b06
          speaker: jimmy_skunk
          text: >-
            Oh, no. I wouldn't dream of stepping in ahead of you. I should hope I have better manners than that.
        - id: ch01-b07
          speaker: unc_billy_possum
          text: >-
            Brer Skunk, yo' surely are a polite fellow. Yo' were brought up mighty well, but then good manners always have run in your family. Folks say handsome is as handsome does, and your manners are every bit as fine as your looks. Ah'll move aside and let yo' go first, just to show how much Ah value your friendship.
        - id: ch01-b08
          speaker: narrator
          text: >-
            Jimmy gave a chuckle.
        - id: ch01-b09
          speaker: jimmy_skunk
          text: >-
            I think you've missed another old saying, Unc' Billy. It's age before beauty. Since you're older than I am, you must go first. I simply couldn't be rude enough to step in before you.
    - id: ch02
      title: What Their Politeness Was Hiding
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            Back and forth they went, each one politely insisting that the other should enter first. But if you knew the truth, you would know that good manners had nothing to do with it.
        - id: ch02-b02
          speaker: narrator
          text: >-
            Jimmy wanted Unc' Billy to lead the way because Jimmy believed in putting safety first. A thought had come to him. There might, just possibly might, be a trap inside that hole. If there was one, Jimmy would much rather have Unc' Billy discover it. Yes, sir, that was the real reason Jimmy was being so polite.
        - id: ch02-b03
          speaker: narrator
          text: >-
            Unc' Billy had his own reason for wanting Jimmy in front. He always felt safer behind Jimmy than he did ahead of him. Unc' Billy had great respect for the little scent bag Jimmy carried. He knew that when Jimmy used it, Jimmy sent the scent forward and never backward.
        - id: ch02-b04
          speaker: narrator
          text: >-
            Jimmy hardly ever used it. Still, he might if something startled him and made him think danger was close. So Unc' Billy wanted Jimmy to go first. His manners had nothing to do with it either. Both of them were being a little selfish. Each one was thinking about himself.
    - id: ch03
      title: Politeness Is Forgotten
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            No one knows how long they might have kept arguing and trying to look polite if nothing had interrupted them. But something did.
        - id: ch03-b02
          speaker: narrator
          text: >-
            From just around the corner of the henhouse came a sudden, loud sniff. It was Bowser the Hound.
        - id: ch03-b03
          speaker: narrator
          text: >-
            In that instant, Unc' Billy Possum and Jimmy Skunk forgot every bit of their politeness. Both of them tried to dive through the hole at once. The opening was not wide enough, so neither one could get in, though they pushed as hard as they could.
        - id: ch03-b04
          speaker: narrator
          text: >-
            Bowser sniffed once more. This time Unc' Billy managed to squeeze Jimmy aside and slip into the hole. Jimmy followed right at his heels.
