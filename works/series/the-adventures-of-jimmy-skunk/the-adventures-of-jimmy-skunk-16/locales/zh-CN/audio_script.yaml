audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 亲切机敏，带着温和的调侃
        timbre: 温暖清亮
        pace: 舒缓而有变化
        pitch: 中音
    jimmy_skunk:
      display_name: 臭鼬吉米
      tts:
        delivery: 平日温厚从容，发怒时严厉干脆
        timbre: 沉稳厚实
        pace: 从容偏慢
        pitch: 中低音
    unc_billy_possum:
      display_name: 比利负鼠大叔
      tts:
        delivery: 乡音浓厚，风趣世故，玩笑说得一本正经
        timbre: 粗暖而略带沙哑
        pace: 慢条斯理
        pitch: 中低音
  chapters:
    - id: ch01
      title: 又是为了鸡蛋
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 礼貌待人费不了什么，何况这样做永远没错。
        - id: ch01-b02
          speaker: narrator
          text: 农夫布朗的鸡舍底下有个洞口。洞旁的黑影里，比利负鼠大叔和臭鼬吉米迎面碰上了。两个人看着对方，想到对方为什么会来这里，都忍不住低声发笑。同一个念头常常会把人凑到一起，还真是奇妙。
        - id: ch01-b03
          speaker: narrator
          text: 比利大叔肚子里那股馋劲儿，和吉米一模一样。吉米心里盘算的事，也和比利大叔毫无分别。这已经是他们当天第二次碰面了。早晨，两人才在绿森林里见过。到了晚上，他们又在鸡舍边的黑影里相遇。说到底，全是鸡蛋惹的。没错，先生，全是为了鸡蛋。
        - id: ch01-b04
          speaker: jimmy_skunk
          text: 你这是刚从里面出来，还是正准备进去？
        - id: ch01-b05
          speaker: unc_billy_possum
          text: 俺正要进去呢。不过，臭鼬老弟，还是让俺跟在你后头吧。
    - id: ch02
      title: 谁应该先走
      blocks:
        - id: ch02-b01
          speaker: jimmy_skunk
          text: 那怎么行？我可从没想过要抢在你前面。我的礼数还不至于那么差。
        - id: ch02-b02
          speaker: unc_billy_possum
          text: 臭鼬老弟，你真是太客气啦，实在太客气啦。家里把你教得这样好，你可真给家里长脸。再说，你们一家向来都讲礼貌。
        - id: ch02-b03
          speaker: unc_billy_possum
          text: 常言道，人俊不俊，要看做的事俊不俊。臭鼬老弟，你的礼数这么周全，自然也俊俏得很。俺这就让到一边，请你先走，也好让你知道，俺多么看重你这个朋友。
        - id: ch02-b04
          speaker: narrator
          text: 吉米听完，低声笑了。
        - id: ch02-b05
          speaker: jimmy_skunk
          text: 比利大叔，你是不是忘了另一句老话？年长的，要走在漂亮的前头。所以还是你先请。你比我年长，我怎么能抢在前面呢？那也太失礼了。这种事，我想都不敢想。
        - id: ch02-b06
          speaker: narrator
          text: 就这样，他们争来争去，客客气气地坚持让对方先走。可要说实话，两个人谁也不是为了礼貌。没错，先生，这事和礼貌根本不沾边。
        - id: ch02-b07
          speaker: narrator
          text: 吉米总觉得安全最要紧。他忽然想到，那个洞里说不定正好有一只捕兽夹。只是说不定，可万一真有呢？吉米宁愿让比利大叔先去发现。这才是他如此客气的真正原因。
        - id: ch02-b08
          speaker: narrator
          text: 比利大叔也有自己的算盘。对他来说，跟在吉米身后，要比走在吉米前面安全得多。他很敬畏吉米随身带着的那个小臭液囊。吉米一旦用上它，臭液总是喷向前方，从来不会喷到身后。
        - id: ch02-b09
          speaker: narrator
          text: 吉米很少动用这个本事。不过有时候，他突然受了惊，又觉得危险就在附近，还是会用的。因此，比利大叔只想让吉米走在前面。这同样不是为了礼貌。他们两个都有点儿自私，都只顾着自己。
    - id: ch03
      title: 礼貌全忘了
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 要是没有事情突然发生，谁也不知道他们还会争多久，又会装多久的客气。偏偏就在这时，鸡舍拐角那边传来一声响亮的嗅鼻声。那是猎犬鲍泽。
        - id: ch03-b02
          speaker: narrator
          text: 比利负鼠大叔和臭鼬吉米一下子把礼貌忘得干干净净。他们同时冲向洞口，拼命想钻进去。可洞口太小，容不下两个家伙一起过。他们还是谁也不肯退，使足了劲儿往里挤。
        - id: ch03-b03
          speaker: narrator
          text: 鲍泽又嗅了一声。这一次，比利大叔总算把吉米挤到旁边，抢先钻进洞里。吉米就紧紧跟在他的脚后。
