cover_prompt: |-
  A wordless cover scene on the edge of a New England meadow and old orchard in the early twentieth century centers on a small black-and-white skunk with broad white stripes and a high plumed tail. He stands calmly beside an old wooden barrel lying on a grassy hill, while a brown rabbit with long ears peers from behind a low stone wall and a red fox pauses farther down the slope. The skunk steps out of the barrel with quiet confidence as the rabbit realizes that his mischievous plan has gone wrong, making that moment the focal action. Weathered farm fences, wild grasses, orchard trees, and the distant Green Forest establish the rural setting without modern objects. Use a child-height three-quarter view with the figures arranged along the curving hillside and generous calm sky at the top. Keep the animals anatomically believable, warmly expressive, original, and entirely child-friendly. No readable text, letters, numbers, labels, logos, captions, speech bubbles, signatures, or watermarks.

