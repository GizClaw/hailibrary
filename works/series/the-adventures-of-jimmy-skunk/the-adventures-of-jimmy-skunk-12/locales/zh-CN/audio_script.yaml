audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 亲切机敏，带着温和的调侃
        timbre: 温暖清亮
        pace: 舒缓而有变化
        pitch: 中音
    jimmy_skunk:
      display_name: 臭鼬吉米
      tts:
        delivery: 平日温厚从容，发怒时严厉干脆
        timbre: 沉稳厚实
        pace: 从容偏慢
        pitch: 中低音
    unc_billy_possum:
      display_name: 比利负鼠大叔
      tts:
        delivery: 乡音浓厚，风趣世故，玩笑说得一本正经
        timbre: 粗暖而略带沙哑
        pace: 慢条斯理
        pitch: 中低音
  chapters:
    - id: ch01
      title: 孤独小径上的两位慢性子
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 臭鼬吉米正沿着绿森林里的孤独小径，慢悠悠地往下走。他不赶时间，也从来不爱着急。匆忙和忧愁这两件事，他全都留给邻居们去做了。
        - id: ch01-b02
          speaker: narrator
          text: 吉米走走停停，不时翻开一片树皮，或是拨动一根枯枝，想找几只肥甲虫。不过谁都看得出来，他这会儿心里想的，并不只有甲虫。
        - id: ch01-b03
          speaker: narrator
          text: 孤独小径的另一头，比利负鼠大叔拖着脚步往上走。他同样不着急。天气暖烘烘的，何必赶路呢？不过，比利大叔和吉米不一样。有时候他也会急，特别是怀疑猎犬鲍泽就在附近的时候。
        - id: ch01-b04
          speaker: narrator
          text: 比利大叔偶尔还会发愁，因为有些家伙觉得，拿他做晚餐一定很不错。比利大叔本人当然不同意，而且丝毫不想让谁真的试上一试。每当这种嘴馋的家伙出现，他就难免要担心一阵。
        - id: ch01-b05
          speaker: narrator
          text: 可是今天，比利大叔既不用赶路，也不用发愁。没有必要的事，他从来不做。就这样，他拖着脚步往上走，吉米不紧不慢地往下走。到了小径的一处弯道，两人正好碰了面。
    - id: ch02
      title: 谁更需要梳理外衣
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 臭鼬吉米咧开嘴，先打了招呼。
        - id: ch02-b02
          speaker: jimmy_skunk
          text: 你好啊，比利大叔！今天早上，你瞧见肥甲虫了吗？
        - id: ch02-b03
          speaker: narrator
          text: 比利大叔也笑了起来。
        - id: ch02-b04
          speaker: unc_billy_possum
          text: 早上好哇，臭鼬老弟。俺还真没瞧见。正巧，俺也打算拿这话来问你哩。
        - id: ch02-b05
          speaker: narrator
          text: 吉米坐下来，眼里闪着调皮的光。他越笑越开心，最后忍不住从喉咙里笑出了声。
        - id: ch02-b06
          speaker: jimmy_skunk
          text: 比利大叔，你这一辈子到底梳没梳过头？有没有好好刷过自己的外衣？
        - id: ch02-b07
          speaker: narrator
          text: 这话可不是随便问的。比利大叔平常那副模样，就像身上每一根毛都在跟别的毛闹别扭，非要朝不同的方向支棱。吉米却总是整整齐齐，一身漂亮的黑白外衣又顺又平，仿佛每天有一半时间都在打理它。
        - id: ch02-b08
          speaker: narrator
          text: 比利大叔眼里也闪起了笑意，可脸上偏偏一本正经。
        - id: ch02-b09
          speaker: unc_billy_possum
          text: 俺寻思，小时候还很小很小的时候，大概梳过一两回吧，臭鼬老弟。不过，那也太糟蹋工夫了。俺还有更要紧的事要操心哩。对了，臭鼬老弟，你这一辈子有没有叫谁撵得逃跑过？
    - id: ch03
      title: 吉米为什么不发愁
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 吉米没想到比利大叔会反问这个，一时愣住了。他认真挠了挠头，想了一会儿才开口。
        - id: ch03-b02
          speaker: jimmy_skunk
          text: 我可不记得逃跑过。大多数家伙一见到我，倒会自己转身就跑。
        - id: ch03-b03
          speaker: narrator
          text: 吉米说到这里，从喉咙里轻轻笑了一声。
        - id: ch03-b04
          speaker: jimmy_skunk
          text: 那些不跑的，也会客客气气地让到一边。也许我小时候还不懂这个大千世界，也不熟悉住在里面的家伙，真躲着谁逃跑过。可就算有，我也想不起来了。比利大叔，你怎么忽然问起这个？
        - id: ch03-b05
          speaker: unc_billy_possum
          text: 噢，没什么特别的缘故，臭鼬老弟，真没什么。俺有时候只是想啊，你到底知不知道自己有多走运。要是俺不用天天提防那些肚子饿的邻居，兴许也会多刷几回外衣哩。
        - id: ch03-b06
          speaker: narrator
          text: 比利大叔说着，眼里的笑意更浓了。吉米却摆出一副很有见识的样子，认真回答了他。
        - id: ch03-b07
          speaker: jimmy_skunk
          text: 会发愁，是因为事先没有准备好。只要准备得周全，就没什么可担心的。比利大叔，你仔细想想吧。
        - id: ch03-b08
          speaker: narrator
          text: 这回轮到比利大叔挠头了。他想来想去，还是没能弄明白。
        - id: ch03-b09
          speaker: unc_billy_possum
          text: 臭鼬老弟，俺怕是还没大听懂你的意思。
        - id: ch03-b10
          speaker: jimmy_skunk
          text: 那你坐下来吧，比利大叔。我讲给你听。
