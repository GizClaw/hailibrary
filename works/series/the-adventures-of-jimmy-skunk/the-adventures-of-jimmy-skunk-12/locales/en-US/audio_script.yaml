audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm, observant storytelling with a gently playful edge
        timbre: clear and rounded
        pace: measured
        pitch: medium
    jimmy_skunk:
      display_name: Jimmy Skunk
      tts:
        delivery: easygoing and deliberate, with quiet confidence
        timbre: mellow and grounded
        pace: unhurried
        pitch: medium-low
    unc_billy_possum:
      display_name: Unc' Billy Possum
      tts:
        delivery: dry, good-humored, and thoughtful with a gentle Southern drawl
        timbre: warm and slightly rough
        pace: relaxed
        pitch: medium-low
  chapters:
    - id: ch01
      title: Along the Lone Little Path
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            Jimmy Skunk ambled down the Lone Little Path through the Green Forest. He was in no hurry. Jimmy never hurries. He leaves hurrying and worrying to his neighbors.
        - id: ch01-b02
          speaker: narrator
          text: >-
            Every now and then, Jimmy stopped and turned over a piece of bark or a stick. He hoped to find some fat beetles underneath. Even so, anyone could see that fat beetles were not the only thing on his mind.
    - id: ch02
      title: Unc' Billy Comes the Other Way
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            Up the same path shuffled Unc' Billy Possum. He was not hurrying either. It was much too warm for that. Unc' Billy does hurry sometimes, especially when he thinks Bowser the Hound may be nearby.
        - id: ch02-b02
          speaker: narrator
          text: >-
            He worries sometimes, too. You see, some people think Unc' Billy would make a very good dinner. Unc' Billy does not agree, and he has no wish to let anyone test the idea. So when he meets one of those hungry neighbors, he does worry a little.
        - id: ch02-b03
          speaker: narrator
          text: >-
            Just then, though, Unc' Billy had no reason to hurry or worry. And he never does anything unless there is a reason to do it. So Unc' Billy shuffled up the Lone Little Path while Jimmy ambled down it. They came face-to-face at a bend in the path.
    - id: ch03
      title: Two Neighbors Trade Questions
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            Jimmy Skunk greeted him with a grin.
        - id: ch03-b02
          speaker: jimmy_skunk
          text: >-
            Hello, Unc' Billy! Have you come across any fat beetles this morning?
        - id: ch03-b03
          speaker: narrator
          text: >-
            Unc' Billy grinned back.
        - id: ch03-b04
          speaker: unc_billy_possum
          text: >-
            Good mo'nin', Brer Skunk. Ah can't say that Ah have. Matter of fact, Ah was just about to ask you that very thing.
        - id: ch03-b05
          speaker: narrator
          text: >-
            Jimmy sat down. His eyes twinkled as his grin spread into a chuckle.
        - id: ch03-b06
          speaker: jimmy_skunk
          text: >-
            Tell me, Unc' Billy. Have you ever combed your hair or brushed your coat in your whole life?
        - id: ch03-b07
          speaker: narrator
          text: >-
            Unc' Billy usually looks as though every hair is trying to point a different way. Jimmy, on the other hand, always looks neat. His handsome black-and-white coat is so smooth that you might think he spends half his time brushing it.
        - id: ch03-b08
          speaker: narrator
          text: >-
            Unc' Billy's eyes twinkled, but he kept a perfectly straight face.
        - id: ch03-b09
          speaker: unc_billy_possum
          text: >-
            Ah reckon Ah tried it once or twice when Ah was very small, Brer Skunk. Seems like a mighty poor use of time to me. Ah've got more important things to worry about. Say, Brer Skunk, have you ever had to run away from anybody?
    - id: ch04
      title: Why Jimmy Never Worries
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            That question surprised Jimmy. He scratched his head and thought for a moment.
        - id: ch04-b02
          speaker: jimmy_skunk
          text: >-
            Not that I can remember. Most folks are the ones who run away from me.
        - id: ch04-b03
          speaker: narrator
          text: >-
            A quiet chuckle rumbled in Jimmy's throat.
        - id: ch04-b04
          speaker: jimmy_skunk
          text: >-
            The ones who stay are always polite enough to step aside. Maybe I ran from someone when I was very small and knew hardly anything about the Great World or the people in it. If I did, I've forgotten all about it. Why did you ask, Unc' Billy?
        - id: ch04-b05
          speaker: unc_billy_possum
          text: >-
            Oh, no special reason, Brer Skunk. No special reason at all. Sometimes Ah wonder if you know just how lucky you are. If Ah didn't have hungry neighbors to worry about, maybe Ah'd brush mah coat a little more often.
        - id: ch04-b06
          speaker: narrator
          text: >-
            Unc' Billy's eyes were twinkling more than ever. Jimmy answered him very wisely.
        - id: ch04-b07
          speaker: jimmy_skunk
          text: >-
            Worry comes from not being ready. When you're prepared, there's nothing to worry about. Think that over, Unc' Billy.
        - id: ch04-b08
          speaker: narrator
          text: >-
            Now it was Unc' Billy's turn to scratch his head and think.
        - id: ch04-b09
          speaker: unc_billy_possum
          text: >-
            Ah'm afraid Ah don't quite understand what you mean, Brer Skunk.
        - id: ch04-b10
          speaker: jimmy_skunk
          text: >-
            Then sit down, Unc' Billy, and I'll explain it to you.
