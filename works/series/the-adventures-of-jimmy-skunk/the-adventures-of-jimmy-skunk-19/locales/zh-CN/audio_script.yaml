audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 亲切机敏，带着温和的调侃
        timbre: 温暖清亮
        pace: 舒缓而有变化
        pitch: 中音
    jimmy_skunk:
      display_name: 臭鼬吉米
      tts:
        delivery: 平日温厚从容，发怒时严厉干脆
        timbre: 沉稳厚实
        pace: 从容偏慢
        pitch: 中低音
    unc_billy_possum:
      display_name: 比利负鼠大叔
      tts:
        delivery: 乡音浓厚，风趣世故，玩笑说得一本正经
        timbre: 粗暖而略带沙哑
        pace: 慢条斯理
        pitch: 中低音
  chapters:
    - id: ch01
      title: 难熬的一夜
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 比利负鼠大叔这一夜过得实在不痛快。跟臭鼬吉米吵累之后，他本想打个盹儿。他先钻进这个窝，又换到另一个窝，可始终没有一个真正合他的心意。其实，不是窝不好，是他饿着肚子，根本睡不着。
        - id: ch01-b02
          speaker: narrator
          text: 比利大叔越想越后悔。他真不该由着脾气来，一脚把瓷蛋踢出窝箱。偏偏那枚蛋砸中了吉米的头，把吉米惹得火冒三丈。
        - id: ch01-b03
          speaker: narrator
          text: 吉米还守在下面，比利大叔说什么也不肯下去。他以为吉米等一会儿就会厌烦，自己走掉。起初，他一点儿也不着急。可是眼看天就要亮了，他心里开始发慌。要是农夫布朗家的男孩来喂母鸡，发现他藏在鸡舍里，那可怎么办？
    - id: ch02
      title: 谁也不肯先让步
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 比利大叔原本盼着饱餐一顿鸡蛋，结果一枚也没找到。这会儿，他很想出去另找吃的，可出去就得跟吉米碰面。想来想去，他觉得还是挨饿好。是的，先生，挨饿也比下去强得多。
        - id: ch02-b02
          speaker: narrator
          text: 他几次以为吉米已经睡着，便轻手轻脚地往下溜。他已经尽力不发出半点声音，可每一次，吉米都察觉到了，还在原处等着他。
        - id: ch02-b03
          speaker: narrator
          text: 比利大叔懊悔得许起了傻愿。他巴不得世上从来没有农夫布朗家的鸡舍，巴不得自己从没想过鸡蛋，更巴不得自己没有乱发脾气，把蛋踢下去砸中吉米。
        - id: ch02-b04
          speaker: narrator
          text: 第一缕晨光从门缝下钻了进来，栖架上的母鸡不安地动起来。比利大叔终于急得待不住了。
        - id: ch02-b05
          speaker: unc_billy_possum
          text: 臭鼬兄弟，要不俺们和好吧，赶紧一起离开这儿，成不成？
        - id: ch02-b06
          speaker: narrator
          text: 他小心翼翼地试探着吉米。
        - id: ch02-b07
          speaker: jimmy_skunk
          text: 我可不想走。这里挺舒服，我待得好着呢。
        - id: ch02-b08
          speaker: narrator
          text: 吉米一边回答，一边抬头看着比利大叔。那眼神叫比利大叔浑身不自在。很明显，吉米根本没有原谅他。
    - id: ch03
      title: 天快亮了
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 比利大叔沉默了好一阵，却越来越坐不住。他知道，再过不久，农夫布朗家的男孩就会打开鸡舍，放母鸡出去，再来给它们喂食。忍了又忍，他只好再次开口。
        - id: ch03-b02
          speaker: unc_billy_possum
          text: 俺寻思，你好像忘了一件事。
        - id: ch03-b03
          speaker: jimmy_skunk
          text: 什么事？
        - id: ch03-b04
          speaker: unc_billy_possum
          text: 农夫布朗家的男孩马上就要来了。俺们让他撞见待在这儿，那可不行。
        - id: ch03-b05
          speaker: jimmy_skunk
          text: 我不怕他。他想多早来，就让他多早来吧。
        - id: ch03-b06
          speaker: narrator
          text: 吉米说完，还咧嘴笑了笑。这话听着像吹牛，其实绝不是。不是的，先生，吉米说的是真心话，比利大叔也知道。
        - id: ch03-b07
          speaker: narrator
          text: 这下，比利大叔彻底绝望了。留在上面，他不敢。下去面对吉米，他也不敢。他只能不上不下地困在那里。唉，对比利负鼠大叔来说，这一夜可真够糟糕的。
