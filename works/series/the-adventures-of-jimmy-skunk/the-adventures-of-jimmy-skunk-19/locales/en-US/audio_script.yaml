audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm, observant storytelling with a gently playful edge
        timbre: clear and rounded
        pace: measured
        pitch: medium
    jimmy_skunk:
      display_name: Jimmy Skunk
      tts:
        delivery: easygoing and deliberate, with quiet confidence
        timbre: mellow and grounded
        pace: unhurried
        pitch: medium-low
    unc_billy_possum:
      display_name: Unc' Billy Possum
      tts:
        delivery: sly and good-humored, with an easy Southern drawl
        timbre: light and wiry
        pace: relaxed
        pitch: medium-high
  chapters:
    - id: ch01
      title: A Bad Night for Unc' Billy
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            Unc' Billy Possum was having a very bad night. When he grew tired of quarreling with Jimmy Skunk, he tried to take a nap. First he settled into one nest, and then he tried another. None of them felt right.
        - id: ch01-b02
          speaker: narrator
          text: >-
            The real trouble was that Unc' Billy was not sleepy at all. He was hungry. With all his heart, he wished he had not given in to his temper. In a foolish fit of anger, he had kicked a china nest egg out of a nest. It had fallen right onto Jimmy Skunk's head, and now Jimmy was thoroughly angry.
    - id: ch02
      title: Trapped Until Morning
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            Unc' Billy had no intention of climbing down while Jimmy was there. He expected Jimmy to get tired of waiting and leave, so at first he did not worry. But morning drew nearer, and Unc' Billy began to feel anxious. He certainly did not want Farmer Brown's boy to find him in the henhouse when he came to feed the biddies.
        - id: ch02-b02
          speaker: narrator
          text: >-
            And Unc' Billy was still hungry. He had counted on a fine meal of eggs, but he had not found even one. He wanted to go out and hunt for something else to eat. To do that, though, he would have to face Jimmy Skunk. Going hungry seemed much better than that. Yes, sir, much better.
        - id: ch02-b03
          speaker: narrator
          text: >-
            Several times, Unc' Billy thought Jimmy had fallen asleep. Each time he crept downward as quietly as he possibly could. But Jimmy always knew, and every time he was waiting.
        - id: ch02-b04
          speaker: narrator
          text: >-
            Unc' Billy wished Farmer Brown's henhouse had never existed. He wished he had never thought about eggs. He made all sorts of foolish wishes. Most of all, he wished he had not lost his temper and kicked that egg onto Jimmy's head.
    - id: ch03
      title: Unc' Billy Tries to Make Peace
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            At last, the first light slipped beneath the door. The biddies began to stir uneasily on their roosts, and Unc' Billy was too worried to sit still any longer.
        - id: ch03-b02
          speaker: unc_billy_possum
          text: >-
            Brer Skunk, don't yo' think we-uns ought to make peace and get out of here?
        - id: ch03-b03
          speaker: jimmy_skunk
          text: >-
            I don't mind staying. I'm quite comfortable here.
        - id: ch03-b04
          speaker: narrator
          text: >-
            Jimmy looked up at Unc' Billy in a way that made Unc' Billy feel anything but comfortable. Jimmy plainly had not forgiven him.
    - id: ch04
      title: Jimmy Is Not Worried
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            For a while, Unc' Billy said nothing more. He only grew more restless. He knew Farmer Brown's boy would soon arrive to let the hens out and feed them. Finally, he tried speaking again.
        - id: ch04-b02
          speaker: unc_billy_possum
          text: >-
            Ah reckon yo've forgotten something.
        - id: ch04-b03
          speaker: jimmy_skunk
          text: >-
            What have I forgotten?
        - id: ch04-b04
          speaker: unc_billy_possum
          text: >-
            It's nearly time for Farmer Brown's boy to come. We-uns can't let him find us in here.
        - id: ch04-b05
          speaker: jimmy_skunk
          text: >-
            I'm not worried about Farmer Brown's boy. He can come whenever he likes.
        - id: ch04-b06
          speaker: narrator
          text: >-
            Jimmy grinned. His words might have sounded like boasting, but they were not. No, sir, they were not, and Unc' Billy knew it. Jimmy meant every word.
        - id: ch04-b07
          speaker: narrator
          text: >-
            Unc' Billy was in despair. He did not dare stay where he was, and he did not dare climb down and face Jimmy Skunk. So there he sat. It certainly had been a bad night for Unc' Billy Possum.
