audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 亲切机敏，带着温和的调侃
        timbre: 温暖清亮
        pace: 舒缓而有变化
        pitch: 中音
    jimmy_skunk:
      display_name: 臭鼬吉米
      tts:
        delivery: 平日温厚从容，发怒时严厉干脆
        timbre: 沉稳厚实
        pace: 从容偏慢
        pitch: 中低音
    peter_rabbit:
      display_name: 彼得兔
      tts:
        delivery: 机灵顽皮，盘算时压低声音
        timbre: 年轻明亮
        pace: 轻快
        pitch: 中高音
  chapters:
    - id: ch01
      title: 后悔也来不及了
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 要说谁曾因为捉弄别人而后悔，那就是彼得兔。不过，他后悔得可不大对。他并不是替臭鼬吉米和红狐雷迪难过，而是在心疼自己吃的苦头。此刻，彼得躲在土拨鼠约翰旧屋下面的卧室里。黄胡蜂用尖尖的小长矛把他赶到了这里，蜇得他浑身又痛又辣。他甚至没来得及看清红狐雷迪后来怎么样了。
        - id: ch01-b02
          speaker: narrator
          text: 这已经够糟了，可彼得最发愁的，是出去时还得再闯过那群暴躁的黄胡蜂。他真希望自己早就知道，这座旧屋里有黄胡蜂的家。那样的话，他说什么也不会躲进来。可这种愿望最没用，眼下根本救不了他。他觉得自己哪怕再挨一下也受不了，却又想不出怎样才能出去，不再多挨几下。
    - id: ch02
      title: 堵死的后门
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 忽然，彼得想到一件让人宽心的事。土拨鼠约翰的家通常都有后门。要是这座旧屋也有，他就得救了。他决定亲自去找找看。彼得小心地把头探出那间舒适的卧室。来时那条长门道就在眼前，旁边果然还有另一条门道。没错，那一定通向后门。他放轻脚步，摸着黑，十分谨慎地爬了过去。
        - id: ch02-b02
          speaker: peter_rabbit
          text: 真奇怪，前面怎么一点儿光也看不见？
        - id: ch02-b03
          speaker: narrator
          text: 话音刚落，彼得的鼻子就结结实实撞在了门道尽头。老房子大多难免失修，这座旧屋也早已东塌西坏。后门被一块大石头堵死了，两边的土墙也已经坍下来，这条路根本走不通。
        - id: ch02-b04
          speaker: narrator
          text: 彼得只好垂头丧气地退回小卧室。他决定等到夜里。那时黄胡蜂也许都睡着了，他便能从前门偷偷溜走，不再挨蜇。眼下，他想先打个盹儿，好忘掉身上的疼痛。
    - id: ch03
      title: 门口传来的警告
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 彼得才刚蜷起身子，就听见了一个声音。那声音听起来很远，可他立刻知道，它是从旧屋门口传来的。他也听出了说话的是谁。那是臭鼬吉米。
        - id: ch03-b02
          speaker: jimmy_skunk
          text: 彼得兔，我知道你藏在哪儿，也知道你为什么躲在下面。我还弄清楚了，自己怎么会坐着那只桶滚下山。
        - id: ch03-b03
          speaker: jimmy_skunk
          text: 我只是来提醒你一声。上面有一大群正在气头上的黄胡蜂。你要是天黑以前出来，马上就会领教它们的厉害。我现在走了，等天快黑时，我还会回来等你。你拿我开了那样一个玩笑，我说不定也想开个小玩笑回敬你呢。
    - id: ch04
      title: 身子难受，心里也难受
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 彼得再也别想打盹儿了。一想到被臭鼬吉米抓住以后可能发生什么，他就浑身发抖。黄胡蜂蜇出的伤处又痛又辣，他又怕落到吉米手里。疼痛和恐惧搅在一起，他哪里还能睡得着？
        - id: ch04-b02
          speaker: narrator
          text: 与其留在这里等吉米回来，彼得几乎宁愿立刻出去面对黄胡蜂。可一想到那些尖尖的小长矛，他又害怕了。他两次鼓起勇气走向那条长门道，可每一次都退了回来。他实在经不住再挨蜇了。彼得难受极了。没错，他身上难受，心里也难受，简直坐立难安。
        - id: ch04-b03
          speaker: peter_rabbit
          text: 我真希望自己从来没想过那个玩笑。我还以为它很了不起，可它根本不好笑。那是个又坏又可恶的玩笑。我为什么偏要想出它来？为什么呀？
          emotion: sad
        - id: ch04-b04
          speaker: narrator
          text: 彼得带着哭腔说着这些话。与此同时，臭鼬吉米已经低声笑着走远了。
