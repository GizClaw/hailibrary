audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm, observant storytelling with a gently playful edge
        timbre: clear and rounded
        pace: measured
        pitch: medium
    peter_rabbit:
      display_name: Peter Rabbit
      tts:
        delivery: lively, clever, and pleased with his own schemes
        timbre: bright and youthful
        pace: quick
        pitch: medium-high
    jimmy_skunk:
      display_name: Jimmy Skunk
      tts:
        delivery: easygoing and deliberate, with quiet confidence
        timbre: mellow and grounded
        pace: unhurried
        pitch: medium-low
  chapters:
    - id: ch01
      title: Peter Rabbit Is Most Uncomfortable
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            If anyone ever felt sorry for playing tricks on others, it was Peter Rabbit. But Peter was sorry for the wrong reason. He wasn't thinking about what had happened to Jimmy Skunk or Reddy Fox. He was thinking about what had happened to him.
        - id: ch01-b02
          speaker: narrator
          text: >-
            Peter was down in the bedroom of Johnny Chuck's old house. He smarted and ached all over from the Yellow Jackets' sharp little lances. They had driven him underground before he could see what happened to Reddy. That was bad enough. What troubled him even more was knowing that he could not leave without facing those hot-tempered Yellow Jackets again.
        - id: ch01-b03
          speaker: narrator
          text: >-
            How Peter wished he had known they lived in Johnny Chuck's old house before he ever chose it for a hiding place. But a wish like that is no help at all when trouble has already found you.
        - id: ch01-b04
          speaker: narrator
          text: >-
            Peter already had so many aches and stings that he couldn't imagine bearing even one more. Still, he saw no way out that wouldn't bring him several more. Then a hopeful thought came to him. Johnny Chuck usually made a back door. If this old house had one, Peter would be safe.
        - id: ch01-b05
          speaker: narrator
          text: >-
            He decided to find out. Very carefully, he poked his head out of the snug bedroom. He saw the long hall he had come down. And there, yes, there was another hall! Surely that one led to the back door. Peter crept along it with great care.
        - id: ch01-b06
          speaker: peter_rabbit
          text: >-
            That's strange. Why can't I see any light ahead?
        - id: ch01-b07
          speaker: narrator
          text: >-
            Then Peter bumped his nose against the end of the hall. The old house was falling apart, as old houses often do. A great stone blocked the back door, and the walls of the back hall had caved in. There was no way out.
        - id: ch01-b08
          speaker: narrator
          text: >-
            Sadly, Peter backed into the little bedroom again. He would wait for night. Perhaps the Yellow Jackets would be asleep by then, and he could slip out through the front without another sting. Until then, he would try to nap and forget his aches and pains.
        - id: ch01-b09
          speaker: narrator
          text: >-
            Peter had barely curled up when he heard a voice. It sounded far away, but he knew exactly where it came from. Someone was speaking from the doorway of the old house. Peter also knew whose voice it was. Jimmy Skunk had found him.
        - id: ch01-b10
          speaker: jimmy_skunk
          text: >-
            I know you're down there, Peter Rabbit, and I know why you're hiding. I also know how I came to roll downhill in that barrel. So here's a little warning. A lot of very angry Yellow Jackets are up here. Try coming out before dark, and you'll find that out for yourself.
        - id: ch01-b11
          speaker: jimmy_skunk
          text: >-
            I'm leaving now, but I'll be back around dark to wait for you. I might feel like playing a little joke of my own, just to pay you back for the one you played on me.
        - id: ch01-b12
          speaker: narrator
          text: >-
            There went Peter's hope of a nap. He shivered at the thought of what Jimmy might do if he caught him. The Yellow Jacket stings made his whole body ache, and fear of Jimmy filled his mind. Sleep was impossible now.
        - id: ch01-b13
          speaker: narrator
          text: >-
            Peter almost preferred facing the Yellow Jackets to waiting there for Jimmy. Twice he started up the long hall. Twice he turned back. He simply could not bear any more stings.
        - id: ch01-b14
          speaker: narrator
          text: >-
            Poor Peter was miserable. His body hurt, and his mind was full of fear. He was uncomfortable in every possible way.
        - id: ch01-b15
          speaker: peter_rabbit
          text: >-
            I wish I'd never thought of that joke. I thought it would be wonderful, but it wasn't. It was horrible and mean. Oh, why did I ever think of it?
          emotion: sad
        - id: ch01-b16
          speaker: narrator
          text: >-
            Peter's voice was almost a sob. Meanwhile, Jimmy Skunk had gone away, chuckling to himself.
