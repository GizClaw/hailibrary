audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 亲切机敏，带着温和的调侃
        timbre: 温暖清亮
        pace: 舒缓而有变化
        pitch: 中音
    jimmy_skunk:
      display_name: 臭鼬吉米
      tts:
        delivery: 平日温厚从容，发怒时严厉干脆
        timbre: 沉稳厚实
        pace: 从容偏慢
        pitch: 中低音
    unc_billy_possum:
      display_name: 比利负鼠大叔
      tts:
        delivery: 乡音浓厚，风趣世故，玩笑说得一本正经
        timbre: 粗暖而略带沙哑
        pace: 慢条斯理
        pitch: 中低音
    farmer_browns_boy:
      display_name: 农夫布朗家的男孩
      tts:
        delivery: 直爽利落，遇事机灵又有分寸
        timbre: 明亮结实
        pace: 轻快自然
        pitch: 中音
  chapters:
    - id: ch01
      title: 鸡舍里闹起来了
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 晨光从鸡舍门下越爬越远，母鸡们已经全醒了。等它们发现臭鼬吉米就在下面，立刻咯咯咯地吵成一片。比利大叔听着这阵叫声，心里明白，农夫布朗家的男孩很快就会赶来查看。
        - id: ch01-b02
          speaker: unc_billy_possum
          text: 臭鼬兄弟，你只要躲到看不见的地方去，俺寻思，这些傻母鸡也就能安静了。
        - id: ch01-b03
          speaker: jimmy_skunk
          text: 它们吵它们的，跟我有什么关系？这声音一点儿也碍不着我。
        - id: ch01-b04
          speaker: narrator
          text: 吉米说着咧嘴一笑。比利大叔看得清清楚楚，吉米正觉得眼前这一切很有意思。可他自己一点儿也不觉得好玩。他急得停不下来，只能在上排窝箱前的搁板上来回踱步。
        - id: ch01-b05
          speaker: narrator
          text: 他拿不定主意。下去吧，就得面对吉米。躲起来吧，也许能钻进一个窝箱，藏到干草下面。不管怎么选，他一直竖着耳朵听，只怕农夫布朗家的男孩的脚步声突然传来。
    - id: ch02
      title: 吉米等着门开
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 脚步声终于响了起来，而且急匆匆的。一定是农夫布朗家的男孩听见母鸡吵闹，正赶来看个究竟。比利大叔只盼吉米快从地板上的洞退走，给自己留出逃跑的机会。
        - id: ch02-b02
          speaker: unc_billy_possum
          text: 他来了！臭鼬兄弟，农夫布朗家的男孩来了！现在还来得及，你快走吧！
        - id: ch02-b03
          speaker: narrator
          text: 比利大叔把声音压得低低的，吉米却依旧十分平静。
        - id: ch02-b04
          speaker: jimmy_skunk
          text: 我早听见了。我就在这儿等他把门打开，好直接走出去。从那个洞里挤来挤去，哪有走门省事？
        - id: ch02-b05
          speaker: narrator
          text: 比利大叔惊得倒吸一口气。他知道吉米一向说自己谁也不怕，可这里毕竟是农夫布朗家的鸡舍，吉米根本不该进来。他真不敢相信，吉米还要当面迎上人家的男孩。
        - id: ch02-b06
          speaker: narrator
          text: 比利大叔暗暗盼着，吉米这回会因为胆子太大而惹上麻烦。是的，他真这么盼。要是吉米倒了霉，他也许就能趁机溜走。要不然，他自己的处境可就糟了。
    - id: ch03
      title: 黑白花的坏家伙
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 门闩咔嗒一响，比利大叔赶紧爬进一个窝箱。尽管怕得厉害，他还是忍不住从边沿上露出眼睛，要看看接下来会怎样。门一下敞开，晨光涌满鸡舍，母鸡们立刻安静了。农夫布朗家的男孩站在门口，往里面望去。
        - id: ch03-b02
          speaker: narrator
          text: 臭鼬吉米把那条蓬松得像大羽饰的尾巴又翘高了一点。他没有半点慌张，也一点儿不着急，只管朝敞开的门直直走去。农夫布朗家的男孩当然一眼就看见了他。
        - id: ch03-b03
          speaker: farmer_browns_boy
          text: 原来是你呀，你这个黑白花的坏家伙！你早就认定我会给你让路，对吧？好吧，我看我还真得让。你是我见过最厚脸皮、最不管别人怎么想的家伙。说的就是你。
        - id: ch03-b04
          speaker: farmer_browns_boy
          text: 不过，昨晚我把鸡蛋全收走了，你一枚也没吃到。小鸡也够聪明，一直待在栖架上，你连一只都没捉到。这样看来，我也没什么要跟你算账的。再说，我一点儿也不想招惹你。来吧，你这个坏家伙，快从里面出来。
        - id: ch03-b05
          speaker: narrator
          text: 农夫布朗家的男孩让到一旁。吉米还是那样从从容容，不急也不怕，就这么走出了鸡舍。他先在鸡场的水盆边停下，喝了些水，然后穿过鸡场大门，转身朝老果园边上的石墙走去。
