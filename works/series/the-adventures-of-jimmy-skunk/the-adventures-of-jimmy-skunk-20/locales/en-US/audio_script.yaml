audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm, observant storytelling with a gently playful edge
        timbre: clear and rounded
        pace: measured
        pitch: medium
    jimmy_skunk:
      display_name: Jimmy Skunk
      tts:
        delivery: easygoing and deliberate, with quiet confidence
        timbre: mellow and grounded
        pace: unhurried
        pitch: medium-low
    unc_billy_possum:
      display_name: Unc' Billy Possum
      tts:
        delivery: sly and good-humored, with an easy Southern drawl
        timbre: light and wiry
        pace: relaxed
        pitch: medium-high
    farmer_browns_boy:
      display_name: Farmer Brown's Boy
      tts:
        delivery: practical and forthright, with youthful confidence
        timbre: clear and lively
        pace: medium
        pitch: medium
  chapters:
    - id: ch01
      title: The Hens Raise an Alarm
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            More light crept beneath the henhouse door. By now, every hen was awake. They had spotted Jimmy Skunk below them, and what a fuss they made! Their cackling was so loud that Unc' Billy felt sure Farmer Brown's boy would hear it. Then he would come running to see what was wrong.
        - id: ch01-b02
          speaker: unc_billy_possum
          text: >-
            Brer Skunk, if yo' would only hide somewhere, Ah reckon those foolish hens might hush up.
        - id: ch01-b03
          speaker: jimmy_skunk
          text: >-
            Their racket doesn't bother me. I don't mind it at all.
        - id: ch01-b04
          speaker: narrator
          text: >-
            Jimmy grinned. Unc' Billy could plainly see that Jimmy was enjoying every moment of this.
        - id: ch01-b05
          speaker: narrator
          text: >-
            Unc' Billy certainly was not. He was too worried to stay still. He paced along the shelf in front of the upper nests. Should he climb down and face Jimmy, or burrow under the hay in a nest? He could not decide which choice would be better. All the while, he listened and listened for the footsteps of Farmer Brown's boy.
    - id: ch02
      title: Footsteps at the Door
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            At last, Unc' Billy heard those footsteps. From their quick sound, he knew Farmer Brown's boy was hurrying toward the henhouse. The boy had heard the hens and was coming to learn what all the noise meant. Unc' Billy hoped Jimmy would finally slip back through the hole in the floor. Then Unc' Billy might have a chance to escape.
        - id: ch02-b02
          speaker: unc_billy_possum
          text: >-
            He's coming, Brer Skunk! Farmer Brown's boy is coming! Yo' had better leave while yo' still can!
          emotion: fearful
        - id: ch02-b03
          speaker: jimmy_skunk
          text: >-
            I can hear him. I'll wait for him to open the door, and then I'll walk out. That will be much easier than squeezing through the hole.
          emotion: calm
        - id: ch02-b04
          speaker: narrator
          text: >-
            Unc' Billy gasped. Jimmy always boasted that he feared no one, but could he truly mean to face Farmer Brown's boy inside the boy's own henhouse? Jimmy had no business being there. Unc' Billy hoped that such boldness would finally land Jimmy in trouble. Yes, he really did. If Jimmy caused trouble, Unc' Billy might slip away. Without that chance, he was in a terrible fix.
        - id: ch02-b05
          speaker: narrator
          text: >-
            The door latch rattled. Unc' Billy crept into one of the nests. Even though he was frightened, he had to peek over the edge and see what came next.
    - id: ch03
      title: Jimmy Walks Out
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            The door swung open, and a flood of light poured in. At once, the hens fell silent. Farmer Brown's boy stood in the doorway, looking around. Jimmy raised his great plume of a tail a little higher than usual. Without the slightest hurry, he walked straight toward the open door. Farmer Brown's boy saw him immediately.
        - id: ch03-b02
          speaker: farmer_browns_boy
          text: >-
            So you're the black-and-white rascal who caused all this! I suppose you expect me to move aside, and I suppose that's exactly what I'll do. You are the boldest, most independent fellow I know. You didn't get any eggs because I gathered them last night. You didn't catch a chicken either. They were wise enough to stay up on their roosts. So I can't say I have a quarrel with you, and I certainly don't want one. Come on out, you rascal.
        - id: ch03-b03
          speaker: narrator
          text: >-
            Farmer Brown's boy stepped aside. Jimmy walked out as calmly as ever, without one sign of hurry or worry. He stopped to drink from the water pan in the henyard. Then he passed through the gate and turned toward the stone wall at the edge of the Old Orchard.
