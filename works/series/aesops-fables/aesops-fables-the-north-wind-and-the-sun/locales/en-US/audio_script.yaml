audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm and gently dramatic
        timbre: clear and rounded
        pace: measured
        pitch: medium
    sun:
      display_name: Sun
      tts:
        delivery: calm and quietly assured
        timbre: warm and luminous
        pace: measured
        pitch: medium
    north_wind:
      display_name: North Wind
      tts:
        delivery: forceful and boastful
        timbre: rough and gusty
        pace: brisk
        pitch: medium-low
  chapters:
    - id: ch01
      title: A Test of Strength
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: The North Wind and the Sun were quarreling over which one was stronger. As their argument grew hotter and louder, a Traveler came down the road with a cloak wrapped around him.
        - id: ch01-b02
          speaker: sun
          text: Let's settle this. Whoever can make that Traveler take off his cloak is the stronger one.
        - id: ch01-b03
          speaker: north_wind
          text: Very well.
    - id: ch02
      title: The North Wind Blows
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: The North Wind immediately sent a cold, howling blast at the Traveler. The first gust whipped the ends of the cloak around his body. He quickly pulled it close and wrapped himself more tightly.
        - id: ch02-b02
          speaker: narrator
          text: The harder the Wind blew, the tighter the Traveler held his cloak. The North Wind tore at it angrily, but nothing he tried could pull it away.
    - id: ch03
      title: The Sun Shines
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: Then the Sun began to shine. His first rays were gentle. After the North Wind's bitter cold, the warmth felt so pleasant that the Traveler unfastened his cloak and let it hang loosely from his shoulders.
        - id: ch03-b02
          speaker: narrator
          text: The sunlight grew warmer and warmer. The Traveler took off his cap and wiped his brow. Soon he was so hot that he pulled off the cloak. To escape the blazing sunshine, he lay down in the welcome shade of a roadside tree.
        - id: ch03-b03
          speaker: narrator
          text: Gentleness and kind persuasion win where force and bluster fail.
