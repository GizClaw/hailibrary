audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm and gently dramatic
        timbre: clear and rounded
        pace: measured
        pitch: medium
  chapters:
    - id: ch01
      title: A Desperate Thirst
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: During dry weather, the Birds could find little to drink. A thirsty Crow found a pitcher with a little water inside. But the pitcher was tall and narrow-necked. However he tried, the Crow could not reach the water. The poor bird felt he might die of thirst.
    - id: ch02
      title: The Crow's Idea
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: Then the Crow had an idea. He picked up small pebbles and dropped them into the pitcher, one by one. Each pebble made the water rise a little higher.
    - id: ch03
      title: Water at Last
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: At last, the water rose within the Crow's reach, and he drank.
        - id: ch03-b02
          speaker: narrator
          text: When trouble comes, using our wits well may help us find a way out.
