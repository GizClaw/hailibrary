audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 从容而略带讽意的讲述
        timbre: 温暖清晰
        pace: 舒缓
        pitch: 中等
    fox:
      display_name: 狐狸
      tts:
        delivery: 自负而善于自我辩解
        timbre: 灵巧明亮
        pace: 稍快
        pitch: 中高
  chapters:
    - id: ch01
      title: 诱人的葡萄
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 一天，狐狸看见树枝间缠着葡萄藤，上面挂着一串熟透的葡萄。那葡萄又美又饱满，像是马上就要迸出汁来。狐狸眼馋地望了半天，口水都流出来了。
    - id: ch02
      title: 怎么也够不着
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 可那串葡萄挂得太高，狐狸只好跳起来够。他头一回跳得差了老远，就退后几步，助跑着又扑过去，结果还是没够着。他跳了一次又一次，却始终没有成功。
        - id: ch02-b02
          speaker: narrator
          text: 最后，狐狸坐了下来，厌恶地盯着那串葡萄。
    - id: ch03
      title: 酸葡萄
      blocks:
        - id: ch03-b01
          speaker: fox
          text: 我真是个傻瓜，干吗非要累坏自己，去够那串酸葡萄？那种葡萄，根本不值得我张嘴去够。
          emotion: disgusted
        - id: ch03-b02
          speaker: narrator
          text: 说完，狐狸走开了，样子别提有多轻蔑。
        - id: ch03-b03
          speaker: narrator
          text: 许多人正是这样，明明得不到一样东西，却偏要装作瞧不起它，还把它说得一文不值。
