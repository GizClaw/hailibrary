audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm and gently dramatic
        timbre: clear and rounded
        pace: measured
        pitch: medium
    fox:
      display_name: Fox
      tts:
        delivery: clever and self-important
        timbre: light and crisp
        pace: lively
        pitch: medium
  chapters:
    - id: ch01
      title: Grapes in the Tree
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: One day, a Fox spotted a beautiful bunch of ripe grapes. They hung from a vine that ran along the branches of a tree. The grapes looked ready to burst with juice. The Fox stared at them hungrily, and his mouth began to water.
    - id: ch02
      title: Just Out of Reach
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: The bunch was high above him, so the Fox jumped for it. On his first try, he missed by a long way.
        - id: ch02-b02
          speaker: narrator
          text: He backed up a little and ran toward the grapes. Then he leaped, but once again, he fell short. He tried again and again. Nothing worked.
    - id: ch03
      title: Sour Grapes
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: At last, the Fox sat down. He looked up at the grapes with disgust.
        - id: ch03-b02
          speaker: fox
          text: What a fool I've been! I'm wearing myself out for a bunch of sour grapes. They aren't even worth staring at.
          emotion: disgusted
        - id: ch03-b03
          speaker: narrator
          text: Then he walked away, looking very, very scornful.
        - id: ch03-b04
          speaker: narrator
          text: Many people pretend to despise and belittle what they cannot reach.
