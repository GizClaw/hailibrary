audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 沉稳而亲切的讲述
        timbre: 温暖清晰
        pace: 从容舒缓
        pitch: 中等
    mouse:
      display_name: 小老鼠
      tts:
        delivery: 机灵而真诚
        timbre: 轻柔明亮
        pace: 稍快
        pitch: 偏高
  chapters:
    - id: ch01
      title: 意外相遇
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 森林里，一头狮子正把硕大的脑袋枕在两只前爪上酣睡。一只胆小的小老鼠突然撞见了他，吓得转身就逃，慌乱中竟从狮子的鼻子上跑了过去。狮子从睡梦中惊醒，怒气冲冲地伸出巨掌，按住小老鼠，准备把她杀死。
        - id: ch01-b02
          speaker: mouse
          text: 求求您饶了我，放我走吧！总有一天，我一定会报答您的。
          emotion: fearful
        - id: ch01-b03
          speaker: narrator
          text: 狮子听了，只觉得好笑。一只小老鼠，怎么可能会有帮上他的一天呢？不过，狮子很宽宏大量，最后还是放了她。
    - id: ch02
      title: 落入猎网
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 几天后，狮子在森林里悄悄追踪猎物，却落进了猎人的网。他怎么挣扎也出不来，只能愤怒地大吼，吼声传遍了森林。小老鼠一听就认出了他的声音，很快找到网中的狮子。她跑到一根捆住狮子的粗绳旁，不停地啃，终于把绳子咬断。没过多久，狮子自由了。
    - id: ch03
      title: 小老鼠的报答
      blocks:
        - id: ch03-b01
          speaker: mouse
          text: 我说要报答您的时候，您还笑我呢。现在您看见了吧？就算是一只老鼠，也能帮得上一头狮子。
        - id: ch03-b02
          speaker: narrator
          text: 一片好心，永远不会白费。
