audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 亲切从容，带着讲古老寓言的意味
        timbre: 温暖清亮
        pace: 舒缓有致
        pitch: 中等
  chapters:
    - id: ch01
      title: 干旱中的水罐
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 天气干旱时，鸟儿们很难找到水喝。一只乌鸦渴极了，看见一个水罐，里面还有一点水。可那罐子很高，口又那么窄。不管怎么试，他就是碰不到水。乌鸦觉得，自己怕是要渴死了。
    - id: ch02
      title: 一颗颗小石子
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 就在这时，乌鸦有主意了。他找来小石子，衔起一颗，投进罐里，再衔一颗，再投进去。石子每落下一颗，水就往上升一点。水终于升到乌鸦够得着的地方，他总算喝到了水。
    - id: ch03
      title: 智慧带来的出路
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 到了危急的时候，好好动动脑筋，也许就能找到出路。
