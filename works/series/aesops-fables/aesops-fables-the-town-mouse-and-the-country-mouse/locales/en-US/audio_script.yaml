audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm and gently dramatic
        timbre: clear and rounded
        pace: measured
        pitch: medium
    town_mouse:
      display_name: Town Mouse
      tts:
        delivery: polished and confident
        timbre: bright and smooth
        pace: lively
        pitch: medium-high
    country_mouse:
      display_name: Country Mouse
      tts:
        delivery: openhearted and practical
        timbre: soft and earthy
        pace: unhurried
        pitch: medium
  chapters:
    - id: ch01
      title: A Country Visit
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: Once, a Town Mouse went to visit a relative in the country. At lunchtime, the Country Mouse brought out wheat stalks, roots, and acorns, with a little cold water to drink.
        - id: ch01-b02
          speaker: narrator
          text: The Town Mouse barely ate. She took one tiny nibble here and another there. It was easy to see that she tasted the simple meal only to be polite.
    - id: ch02
      title: An Invitation to the City
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: After lunch, the friends talked for a long while. Mostly, the Town Mouse described her city life, and the Country Mouse listened. That night, they curled up in a cozy nest in the hedgerow. They slept peacefully until morning.
        - id: ch02-b02
          speaker: narrator
          text: As she slept, the Country Mouse dreamed that she lived in town. She imagined all the luxuries and pleasures her friend had told her about.
        - id: ch02-b03
          speaker: narrator
          text: The next day, the Town Mouse invited her to come home to the city. The Country Mouse gladly agreed.
    - id: ch03
      title: A Feast Full of Fear
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: The Town Mouse lived in a mansion. When the two friends arrived, they found the remains of a grand banquet on the dining room table. There were sweetmeats, jellies, pastries, and delicious cheeses. It was everything a mouse could wish for.
        - id: ch03-b02
          speaker: narrator
          text: The Country Mouse was just about to taste a fine piece of pastry when a Cat mewed loudly and scratched at the door. Terrified, both Mice raced into hiding. They stayed perfectly still for a long time and hardly dared to breathe.
        - id: ch03-b03
          speaker: narrator
          text: At last, they crept back toward the feast. Then the door suddenly opened. Servants came in to clear the table, and the House Dog followed them.
    - id: ch04
      title: Home to the Country
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: The Country Mouse stayed in the Town Mouse's den only long enough to collect her carpetbag and umbrella.
        - id: ch04-b02
          speaker: country_mouse
          text: You may have luxuries and fine treats that I don't have, but I'll take my plain food and simple country life. At home, I can live in peace and safety.
        - id: ch04-b03
          speaker: narrator
          text: And with that, she hurried away.
        - id: ch04-b04
          speaker: narrator
          text: It is better to have little and feel safe than to have plenty while living in fear and uncertainty.
