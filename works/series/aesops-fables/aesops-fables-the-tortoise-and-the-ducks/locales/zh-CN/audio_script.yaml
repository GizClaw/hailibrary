audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 从容而带一点警醒意味
        timbre: 温暖清晰
        pace: 舒缓
        pitch: 中音
    tortoise:
      display_name: 乌龟
      tts:
        delivery: 缓慢沉厚，得意时脱口而出
        timbre: 厚实
        pace: 偏慢
        pitch: 中低音
    duck_1:
      display_name: 鸭子甲
      tts:
        delivery: 友善而耐心，叮嘱时格外认真
        timbre: 清亮柔和
        pace: 适中
        pitch: 中高音
    duck_2:
      display_name: 鸭子乙
      tts:
        delivery: 热心而稳重，语气坚定
        timbre: 明朗厚实
        pace: 稍慢
        pitch: 中音
    crow:
      display_name: 乌鸦
      tts:
        delivery: 惊奇而响亮
        timbre: 清脆
        pace: 轻快
        pitch: 中高音
  chapters:
    - id: ch01
      title: 背上的房子
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 你知道，乌龟无论走到哪里，都得把房子驮在背上。想把家留在身后，他怎么努力也办不到。据说，这是朱庇特给他的惩罚。乌龟从前太懒，总爱待在家里。朱庇特特意请他参加婚礼，他也不肯出门。
        - id: ch01-b02
          speaker: narrator
          text: 许多年后，乌龟后悔了。他看见鸟儿自在地飞来飞去，又看见野兔、花栗鼠和别的动物轻快地跑过。大家都想把世上的新鲜事看个遍，乌龟越看越难过，心里也越来越不满。他也想出去看看，可背上的房子沉甸甸的，四条小短腿连身子都快拖不动了。
    - id: ch02
      title: 鸭子的办法
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 一天，乌龟遇见两只鸭子，就把心里的烦恼全说给他们听。
        - id: ch02-b02
          speakers:
            - duck_1
            - duck_2
          ensemble: duo
          text: 想看看这个世界，我们有办法。你用牙咬紧这根木棍，我们带你飞到高空。到了上面，整片乡野都能看见。只是一路上千万别开口，不然你一定会后悔。
        - id: ch02-b03
          speaker: narrator
          text: 乌龟听了别提多高兴。他一口咬紧木棍，两只鸭子各自衔住一头，带着他一路飞向云端。
    - id: ch03
      title: 空中的一句话
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 就在这时，一只乌鸦从旁边飞过。眼前这副奇怪的景象让他吃惊极了，他高声喊起来。
        - id: ch03-b02
          speaker: crow
          text: 这位准是乌龟国王！
          emotion: surprised
        - id: ch03-b03
          speaker: tortoise
          text: 那当然！
        - id: ch03-b04
          speaker: narrator
          text: 乌龟刚说出这句蠢话，嘴就松开了木棍。他从空中直落下去，摔在地面的岩石上，粉身碎骨。
        - id: ch03-b05
          speaker: narrator
          text: 愚蠢的好奇心和虚荣心，往往会招来不幸。
