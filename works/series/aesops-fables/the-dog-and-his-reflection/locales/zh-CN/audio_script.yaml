audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 亲切而警醒的讲述
        timbre: 温暖清晰
        pace: 从容有变化
        pitch: 中音
  chapters:
    - id: ch01
      title: 叼着骨头回家
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 屠夫扔给一条狗一根骨头。它叼起这件宝贝，急着往家跑，一路跑得飞快。经过一座窄窄的木桥时，它低头看见自己的模样映在平静的水面上，就像照镜子一样。可这条贪心的狗没认出那是倒影。它以为水里真有另一条狗，嘴里的骨头还比自己的大得多。
    - id: ch02
      title: 扑进河里
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 它只要停下来想一想，就不会弄错。可它根本没想，松开嘴里的骨头，朝水中的狗猛扑过去。这一扑，它落进了河里，只好拼命划水，费了好大劲才游到岸边。
    - id: ch03
      title: 失去骨头
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 它终于挣扎着爬上岸，难过地想着那根丢掉的好骨头。到这时，它才明白，自己刚才有多愚蠢。
        - id: ch03-b02
          speaker: narrator
          text: 贪心，实在是件很愚蠢的事。
