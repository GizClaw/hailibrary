audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 从容而富有故事感
        timbre: 温暖清晰
        pace: 舒缓
        pitch: 中等
    sun:
      display_name: 太阳
      tts:
        delivery: 温和自信
        timbre: 明亮柔和
        pace: 从容
        pitch: 中等
    north_wind:
      display_name: 北风
      tts:
        delivery: 粗暴好胜
        timbre: 低沉有力
        pace: 稍快
        pitch: 低
  chapters:
    - id: ch01
      title: 谁的力量更强
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 北风和太阳吵了起来，都说自己的力量更强。他们正争得厉害，一个旅人披着斗篷，沿路走来。
        - id: ch01-b02
          speaker: sun
          text: 那就比一比吧。谁能让那个旅人脱下斗篷，谁的力量就更强。
        - id: ch01-b03
          speaker: north_wind
          text: 好，那就这么办！
    - id: ch02
      title: 北风使劲吹
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 北风低吼着，马上送出一阵刺骨的狂风，呼啸着扑向旅人。
        - id: ch02-b02
          speaker: narrator
          text: 风刚刮起来，斗篷下摆就在旅人身边乱甩。他赶紧裹紧斗篷。北风越使劲，他就抓得越牢。
        - id: ch02-b03
          speaker: narrator
          text: 北风气冲冲地撕扯了半天，还是没能把斗篷扯下来。
    - id: ch03
      title: 太阳照下来
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 接着，太阳开始放出光芒。起初，阳光轻轻照着。挨过北风的严寒，这暖意可真舒服。旅人解开斗篷，让它松松搭在肩头。
        - id: ch03-b02
          speaker: narrator
          text: 阳光越来越暖。旅人摘下帽子，擦了擦额头。
        - id: ch03-b03
          speaker: narrator
          text: 最后，他热得受不了，干脆脱下斗篷。为了躲开灼热的阳光，他躺进路旁一棵树的阴凉里。
        - id: ch03-b04
          speaker: narrator
          text: 温和地好言相劝，能做到蛮力和恫吓做不到的事。
