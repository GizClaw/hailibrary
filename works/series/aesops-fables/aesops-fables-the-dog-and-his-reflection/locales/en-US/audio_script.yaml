audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm and gently dramatic
        timbre: clear and rounded
        pace: measured
        pitch: medium
  chapters:
    - id: ch01
      title: A Prize to Carry Home
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: A butcher tossed a bone to a Dog, who hurried home with his prize. He crossed a narrow footbridge and glanced down. In the quiet water, he saw his reflection as clearly as if he were looking into a mirror.
        - id: ch01-b02
          speaker: narrator
          text: But the greedy Dog thought the reflection was a real Dog with a much bigger bone.
    - id: ch02
      title: The Leap into the Water
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: If he had stopped to think, he would have known better. Instead, he dropped his bone and sprang at the Dog in the river.
        - id: ch02-b02
          speaker: narrator
          text: He found himself swimming for his life, struggling to reach the shore.
    - id: ch03
      title: The Bone He Lost
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: At last, the Dog managed to scramble out. He stood sadly on the bank, thinking about the good bone he had lost. Only then did he understand how foolish he had been.
        - id: ch03-b02
          speaker: narrator
          text: Greed can make anyone act very foolishly.
