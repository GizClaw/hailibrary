audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 从容讲述，语气里带一点温和的幽默
        timbre: 温暖清晰
        pace: 舒缓而有变化
        pitch: 中音
    hare:
      display_name: 兔子
      tts:
        delivery: 自信外露，说话轻快，嘲笑对手时透着得意
        timbre: 明亮轻巧
        pace: 偏快
        pitch: 中高音
    tortoise:
      display_name: 乌龟
      tts:
        delivery: 坚定直接，不急不躁
        timbre: 沉稳厚实
        pace: 缓慢
        pitch: 中低音
  chapters:
    - id: ch01
      title: 一场挑战
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 有一天，兔子取笑乌龟，说他爬得实在太慢。兔子笑得满是嘲弄，还问起乌龟来。
        - id: ch01-b02
          speaker: hare
          text: 你走得这么慢，到底能不能到得了地方？
        - id: ch01-b03
          speaker: tortoise
          text: 我当然到得了，而且会比你想的更早。你跟我赛一场，就知道了。
    - id: ch02
      title: 比赛开始
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 要跟乌龟赛跑，兔子觉得这个主意太好笑了。不过他只当是找个乐子，便答应下来。狐狸愿意担任裁判，就划好了赛程，让他们同时出发。
    - id: ch03
      title: 谁先到达
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 没过多久，兔子已经跑得连影子都看不见了。他还要让乌龟瞧瞧，想跟兔子比赛有多可笑，于是躺在赛道边睡起觉来，只等乌龟赶上。
        - id: ch03-b02
          speaker: narrator
          text: 乌龟呢，还是慢慢地向前走，一步也没有停。过了一会儿，他走过了兔子睡觉的地方，可兔子依旧睡得安安稳稳。
        - id: ch03-b03
          speaker: narrator
          text: 兔子终于醒来时，乌龟已经离终点不远了。兔子立刻拼命飞奔，可还是没能及时追上乌龟。
        - id: ch03-b04
          speaker: narrator
          text: 跑得最快的，也不一定总能赢得比赛。
