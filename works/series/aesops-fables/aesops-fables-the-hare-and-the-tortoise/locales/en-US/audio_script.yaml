audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: warm and gently dramatic
        timbre: clear and rounded
        pace: measured
        pitch: medium
    hare:
      display_name: Hare
      tts:
        delivery: lively and self-assured
        timbre: bright and nimble
        pace: quick
        pitch: medium-high
    tortoise:
      display_name: Tortoise
      tts:
        delivery: steady and quietly confident
        timbre: soft and grounded
        pace: unhurried
        pitch: medium-low
  chapters:
    - id: ch01
      title: The Challenge
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: One day, a Hare mocked a Tortoise for moving so slowly.
        - id: ch01-b02
          speaker: hare
          text: Do you ever get anywhere at that pace?
        - id: ch01-b03
          speaker: narrator
          text: He gave a mocking laugh.
        - id: ch01-b04
          speaker: tortoise
          text: I do get where I'm going, and sooner than you expect. Race me, and I'll prove it.
    - id: ch02
      title: The Race
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: The idea of racing the Tortoise amused the Hare, but he agreed for fun. The Fox agreed to judge, marked the distance, and started the race.
        - id: ch02-b02
          speaker: narrator
          text: Soon the Hare was far out of sight. He wanted the Tortoise to feel how ridiculous it was to race a hare, so he lay down beside the course for a nap. He would sleep until the Tortoise caught up.
    - id: ch03
      title: The Finish
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: All this time, the Tortoise kept moving. His pace was slow, but it never changed. After a while, he went right past the place where the Hare lay sleeping.
        - id: ch03-b02
          speaker: narrator
          text: The Hare slept peacefully on. When he finally woke, the Tortoise was already close to the goal. The Hare ran as fast as he could, but there was too little time left. He could not catch the Tortoise.
        - id: ch03-b03
          speaker: narrator
          text: The race is not always won by the swift.
