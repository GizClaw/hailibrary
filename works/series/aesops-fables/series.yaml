cover_prompt: |-
  A wordless cover gathering several unmistakable fable moments in a sunlit ancient Mediterranean meadow. A patient brown tortoise crosses a path beside a resting swift hare, a small mouse frees a tawny lion from a loose net, and a black crow drops a pebble toward a clay pitcher. An olive tree and low stone hills place the scene in an imagined classical Greek landscape without modern objects. The crow's descending pebble is the central action, while the other animals form a balanced circle of smaller stories around it. Use a gently elevated wide view with simple readable silhouettes and generous pale sky at the top. Keep the animals natural enough to recognize yet warmly expressive and entirely child-friendly. No readable text, letters, numbers, labels, logos, captions, speech bubbles, signatures, or watermarks.
