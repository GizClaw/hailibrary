audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 讲述者
      tts:
        delivery: 从容而生动，带着古老寓言的意味
        timbre: 温暖清晰
        pace: 舒缓
        pitch: 中
    country_mouse:
      display_name: 乡下老鼠
      tts:
        delivery: 朴实坦率，语气真诚
        timbre: 柔和自然
        pace: 适中
        pitch: 中
  chapters:
    - id: ch01
      title: 乡下的午饭
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 从前，城里老鼠到乡下去看望一位亲戚。乡下老鼠拿出麦秆、草根和橡子招待她，喝的呢，是一点凉水。
        - id: ch01-b02
          speaker: narrator
          text: 城里老鼠吃得很少。这个啃一点，那个尝一口。看她那副样子就知道，她肯吃这些简单的食物，只是为了不失礼。
    - id: ch02
      title: 城里的邀请
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 吃过饭，两个朋友谈了很久。其实，差不多都是城里老鼠在说她的城市生活，乡下老鼠坐在一旁听着。
        - id: ch02-b02
          speaker: narrator
          text: 夜里，她们睡在树篱下温暖的窝里，安安静静，一直睡到早晨。乡下老鼠做了一个梦。梦里，她也成了城里老鼠，享受着朋友说过的那些奢华和乐趣。
        - id: ch02-b03
          speaker: narrator
          text: 第二天，城里老鼠问她愿不愿意一起回城。
        - id: ch02-b04
          speaker: country_mouse
          text: 好呀，我跟你去！
          emotion: happy
    - id: ch03
      title: 宅邸里的盛宴
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 她们到了城里老鼠住的宅邸。餐厅的桌上，摆着宴席吃剩的好东西。糖果、果冻、酥点，还有香喷喷的奶酪，全是老鼠想得到的美味。
        - id: ch03-b02
          speaker: narrator
          text: 乡下老鼠刚要咬一口精巧的酥点，就听见猫在门外大声叫，还用爪子抓着门。两只老鼠吓得赶紧蹿进藏身的地方，趴在那里一动也不敢动，连呼吸都小心翼翼。
        - id: ch03-b03
          speaker: narrator
          text: 过了很久，她们才敢回到餐桌旁。可门突然开了，仆人们走进来收拾桌子，宅子里的狗也跟在后面。
    - id: ch04
      title: 乡下老鼠的选择
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 乡下老鼠回到城里老鼠的窝，只停了一小会儿。她拿上旅行袋和雨伞，马上就要离开。
        - id: ch04-b02
          speaker: country_mouse
          text: 你这里确实有我没有的享受，也有我吃不到的美味。可我还是愿意回乡下，吃简单的饭，过简单的日子。那里安宁，也让人踏实。
        - id: ch04-b03
          speaker: narrator
          text: 清贫却安稳的生活，总好过富足之中处处是恐惧和不安。
