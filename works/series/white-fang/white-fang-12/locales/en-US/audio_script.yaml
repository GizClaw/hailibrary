  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: grave and vivid storytelling
        timbre: warm and resonant
        pace: measured
        pitch: medium-low
  chapters:
    - id: ch01
      title: THE TRAIL OF THE GODS
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            Fall came, the days grew shorter, and frost began to bite the air. Then White Fang saw his chance to be free. For several days, the village had been full of noise and movement. The summer camp was coming down, and the whole tribe was packing for the fall hunt. White Fang watched eagerly. Once the tepees were lowered and the canoes began filling at the riverbank, he understood. Canoes were already moving away, and some had vanished down the river.
        - id: ch01-b02
          speaker: narrator
          text: >-
            White Fang made up his mind to stay behind. When no one was watching, he slipped out of camp and into the woods. He walked through a running stream where ice was just beginning to form, hiding his trail in the water. Then he crawled deep into a thick patch of brush and waited.
        - id: ch01-b03
          speaker: narrator
          text: >-
            Hours passed, and he slept in fits. Grey Beaver's voice woke him, calling his name. Other voices joined the search. He heard Grey Beaver's wife, Kloo-kooch, and their son, Mit-sah. White Fang trembled. Part of him wanted to crawl out, but he forced himself to stay hidden. At last the voices faded. He waited longer, then crept out to enjoy the success of his plan.
        - id: ch01-b04
          speaker: narrator
          text: >-
            Darkness was gathering. For a little while, White Fang played among the trees and delighted in his freedom. Then loneliness came over him all at once. He sat still and listened. The forest made no sound, and that silence troubled him. Nothing moved. Nothing stirred. It felt like a warning. Danger might be waiting anywhere, unseen and unknown. The great shapes of the trees looked threatening, and every dark shadow might be hiding something deadly.
        - id: ch01-b05
          speaker: narrator
          text: >-
            Then he felt the cold. There was no warm tepee wall to curl against. Frost stung his feet, and he kept lifting one front paw, then the other. He wrapped his bushy tail around them. As he did, memories rose before him. He saw the camp again, with its tepees and bright fires. He heard the women's high voices, the men's deep ones, and the dogs snarling. Hunger made him remember the scraps of meat and fish they had thrown him. Out here there was no food, only a silence that threatened him and could not be eaten.
        - id: ch01-b06
          speaker: narrator
          text: >-
            Life in bondage had made him soft. Because others had cared for him, he had forgotten how to care for himself. Night opened wide around him. In camp, his senses had always been busy with movement and sound. Now there was nothing to watch and nothing to hear. He strained for anything that might break the stillness. The emptiness frightened him, and he felt that something terrible was about to happen.
        - id: ch01-b07
          speaker: narrator
          text: >-
            Suddenly, a huge shapeless thing swept across his sight. White Fang jumped in terror. It was only the shadow of a tree, thrown across the ground when the clouds moved away from the moon. His fear eased, and he whimpered softly. Then he stopped himself. A sound like that might draw whatever dangers were hiding nearby.
        - id: ch01-b08
          speaker: narrator
          text: >-
            Above him, a tree contracted in the night cold and cracked loudly. White Fang yelped. Panic seized him, and he raced toward the village. More than anything, he wanted the protection and company of people. He seemed to smell the camp smoke and hear the cries and noises of camp. He burst from the forest into the open moonlight, beyond the shadows and darkness. But there was no village. For one desperate moment, he had forgotten that it was gone.
        - id: ch01-b09
          speaker: narrator
          text: >-
            His wild run ended at once. There was nowhere left to flee. He crept miserably through the empty camp, sniffing the rubbish heaps and the scraps the gods had left behind. He would gladly have heard an angry woman throw stones at him. He would have welcomed Grey Beaver's punishing hand. He would even have been delighted to find Lip-lip and the whole snarling, cowardly pack.
        - id: ch01-b10
          speaker: narrator
          text: >-
            White Fang reached the place where Grey Beaver's tepee had stood and sat in the middle of it. He lifted his nose toward the moon. His throat tightened again and again. Then his mouth opened, and one heartbroken cry carried everything inside him. It held his loneliness and fear, his grief for Kiche, all the misery he had known, and his dread of the suffering still to come. It was the long, full, mournful howl of a wolf. It was the first howl of his life.
        - id: ch01-b11
          speaker: narrator
          text: >-
            Daylight drove away his fear, but it made the loneliness worse. The bare ground had been crowded with life only a short time before. Now its emptiness pressed in on him. White Fang quickly decided what to do. He plunged into the forest and followed the river downstream.
        - id: ch01-b12
          speaker: narrator
          text: >-
            He ran all day without resting. His body seemed made to run forever. At first, his iron strength took no notice of weariness. When weariness finally came, the endurance he had inherited kept him struggling on and forced his aching body forward. He never stopped searching for the people who had gone downriver ahead of him.
        - id: ch01-b13
          speaker: narrator
          text: >-
            When the river curved against steep bluffs, White Fang climbed the high ground behind them. He waded or swam across every river and stream that joined the main current. Often he ventured onto the thin rim of new ice. More than once it broke under him, leaving him to fight for his life in the freezing water. All the while, he watched for the trail of the gods in case it turned away from the river and went inland.
        - id: ch01-b14
          speaker: narrator
          text: >-
            White Fang was unusually intelligent for one of his kind, but he could not imagine that the trail might lie across the Mackenzie, on the other bank. Someday, after more travel and more years, he might understand rivers and trails well enough to think of that. For now, he ran blindly onward. The bank beneath his own feet was the only one he considered.
        - id: ch01-b15
          speaker: narrator
          text: >-
            He ran through the whole night. In the darkness, he stumbled into obstacles and accidents that slowed him but never made him give up. By the middle of the second day, he had run for thirty hours. His body's iron strength was failing now, and only his determination kept him moving.
        - id: ch01-b16
          speaker: narrator
          text: >-
            He had gone forty hours without food, and hunger had left him weak. Every plunge into icy water had drained more strength from him. His handsome coat hung wet and ragged. The broad pads of his feet were bruised and bleeding. He began to limp, and the limp grew worse with every hour. Then the sky darkened and snow started falling. It was wet, clinging snow that melted as it landed. It made the ground slippery, hid the country ahead, and covered every rough place underfoot. Each step became harder and more painful.
        - id: ch01-b17
          speaker: narrator
          text: >-
            Grey Beaver had planned to camp that night across the Mackenzie, where the hunting grounds lay. But shortly before dark, on the near bank, Kloo-kooch spotted a moose coming down to drink. Mit-sah had steered off course because of the snow, and Grey Beaver killed the animal with a lucky rifle shot. Each chance mattered. Without that drinking moose, Mit-sah's mistake, Kloo-kooch's sharp eyes, and Grey Beaver's shot, everything afterward would have changed.
        - id: ch01-b18
          speaker: narrator
          text: >-
            Grey Beaver would not have camped on White Fang's side of the river. White Fang would have run past. He might have died, or he might have reached his wild brothers and lived out all his days as a wolf.
        - id: ch01-b19
          speaker: narrator
          text: >-
            Night had fallen, and the snow was coming down more thickly. White Fang stumbled and limped onward, whimpering under his breath. Then he found a fresh trail in the snow. It was so new that he knew at once what it meant. This was the trail he had been seeking through all those hours of pain. Eagerly whining, he followed it back from the riverbank and in among the trees.
        - id: ch01-b20
          speaker: narrator
          text: >-
            The sounds of camp reached him. He saw the fire blazing, Kloo-kooch cooking, and Grey Beaver squatting there, chewing a piece of raw tallow. There was fresh meat in the camp.
        - id: ch01-b21
          speaker: narrator
          text: >-
            White Fang expected a beating. The thought made him crouch and raise his fur. Still, he moved forward. He feared the punishment he believed was waiting, and he hated it. But the fire would warm him. The gods would protect him. The dogs would be there too. They were enemies, but even hostile company was company, and he needed to belong among others.
        - id: ch01-b22
          speaker: narrator
          text: >-
            He crept into the firelight, cringing low and groveling in complete submission. Grey Beaver saw him and stopped chewing. White Fang crawled straight toward him. Every inch came more slowly and hurt more than the last. At length, he lay at his master's feet. No one had dragged him back. He had returned by his own choice and surrendered himself, body and soul. He had chosen the fire of man, and he had chosen to be ruled by man.
        - id: ch01-b23
          speaker: narrator
          text: >-
            White Fang trembled as he waited for punishment. A hand moved above him, and he shrank beneath the blow he was sure would fall. But it never came. He stole a look upward. Grey Beaver was breaking his lump of tallow in half and offering one piece to him.
        - id: ch01-b24
          speaker: narrator
          text: >-
            White Fang sniffed the tallow gently and with some suspicion. Then he ate it. Grey Beaver called for meat and kept the other dogs away while White Fang fed.
        - id: ch01-b25
          speaker: narrator
          text: >-
            Afterward, grateful and content, White Fang lay at Grey Beaver's feet. He watched the fire that warmed him, blinking and slipping toward sleep. He no longer had to fear another lonely night in the cold, silent woods. Tomorrow would not find him wandering alone through miles of bleak forest. He would still be here, in the camp of the man-animals, among the gods to whom he had given himself and on whom he now depended.
