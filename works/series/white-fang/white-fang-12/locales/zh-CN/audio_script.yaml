audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 沉着克制，带着北国故事的冷峻张力
        timbre: 温厚清晰，略显低沉
        pace: 舒缓而有变化
        pitch: 中低
  chapters:
    - id: ch01
      title: 第四章　诸神的踪迹
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            秋天到了，白昼越来越短，空气也有了霜冻的寒意。白牙终于等来一次逃走的机会。村子里已经闹哄哄地忙了好几天。族人拆掉夏季营地，收拾好全部家当，准备出发秋猎。白牙一直眼巴巴地看着。圆锥帐篷倒下一座又一座，河岸边的独木舟装满东西，他明白他们要走了。有些独木舟已经顺流而下，消失在远处。
        - id: ch01-b02
          speaker: narrator
          text: >-
            白牙是有意留下来的。他瞅准机会，悄悄溜出营地，钻进树林。那里有一条刚刚结冰的流水，他踏进水中，让水洗掉自己的踪迹，再爬进浓密的灌木丛深处，藏起来等着。几个钟头慢慢过去，他睡睡醒醒。忽然，灰海狸呼唤他名字的声音惊醒了他。外面还有其他人在找。灰海狸的妻子来了，儿子米特萨也来了。
        - id: ch01-b03
          speaker: narrator
          text: >-
            白牙吓得直发抖。他很想爬出去，可还是忍住了。那些呼唤声终于渐渐远去。又过了一阵，他才从藏身处出来，享受成功逃脱的滋味。天正在变黑，他先在林间玩了一会儿，为自由感到快活。可没过多久，一阵孤独突然抓住了他。他坐下来，静静听着森林。四周没有动静，也没有声音，这份寂静叫他心里发慌，仿佛哪里藏着看不见、猜不到的危险。高大的树木成了一团团黑影，那些阴暗的角落里，似乎什么可怕的东西都有。
        - id: ch01-b04
          speaker: narrator
          text: >-
            寒冷也来了。这里没有温暖的圆锥帐篷，不能贴着帐篷边偎依。脚掌被寒霜冻得疼，白牙只好轮流抬起两只前脚，再把蓬松的尾巴弯过来盖住它们。这时，他想起了从前的画面。营地、圆锥帐篷，还有明亮的火光，全都回到眼前。女人尖厉的声音，男人粗沉的嗓音，狗群的咆哮，也一起回到耳边。他饿了，又想起人们扔给他的肉块和鱼。可眼前没有吃的，只有一片带着威胁、又填不饱肚子的寂静。
        - id: ch01-b05
          speaker: narrator
          text: >-
            被人管束的生活已经让白牙变软弱了。什么都不用自己操心，也让他忘了该怎样独自活下去。黑夜在四周张开大口。他的眼睛和耳朵早已习惯营地里的忙乱，习惯那些不断出现的景象和声音。现在，它们忽然没了用处。没有事可做，没有东西可看，也没有声音可听。他拼命想从死寂中找出一点动静。可是什么也没有。越是这样，他越觉得有可怕的事情就要发生。
        - id: ch01-b06
          speaker: narrator
          text: >-
            白牙猛地吓了一跳。一个巨大又没有形状的东西，突然从他眼前冲了过去。其实，只是云从月亮前散开，月光把树影投到地上。白牙放下心，轻轻呜咽了一声，又马上把声音压住。他怕那声呜咽惊动潜伏在暗处的危险。
        - id: ch01-b07
          speaker: narrator
          text: >-
            夜里越来越凉，头顶一棵树收缩起来，突然发出一声巨响。白牙惊叫着跳起，恐慌一下子淹没了他。他发疯似的朝村子跑去，从来没有这样渴望过人的保护和陪伴。他仿佛闻到了营火的烟，听见了营地里的喧闹和呼喊。他冲出森林，跑进月光照亮的空地。这里没有阴影，也没有黑暗，可眼前同样没有村子。白牙忘了，村子早已迁走。
        - id: ch01-b08
          speaker: narrator
          text: >-
            他一下停住了，再也没有地方可逃。他凄凄凉凉地走过废弃的营地，闻遍垃圾堆，也闻遍诸神留下的破布碎片。这时候，就算有个恼怒的女人拿石头砸他，石块在身边噼啪落下，他也会高兴。就算灰海狸气冲冲地一巴掌打下来，他也愿意。哪怕唇唇带着那整群又胆小、又爱咆哮的狗出现在眼前，白牙也会欢欢喜喜地迎上去。
        - id: ch01-b09
          speaker: narrator
          text: >-
            白牙走到灰海狸原先搭帐篷的地方，在空地正中坐下。他抬起鼻子，对准月亮。喉咙紧紧抽动起来，他张开嘴，发出了一声心碎的号叫。孤独、恐惧、对基奇的思念，还有从前受过的所有苦，以及对未来危险的害怕，全都涌进了那道声音。这是一声悠长、响亮又悲凉的狼嗥。白牙有生以来，第一次像狼那样嗥叫。
        - id: ch01-b10
          speaker: narrator
          text: >-
            天亮了，白牙不再那么害怕，却觉得更加孤单。不久前，这块光秃秃的土地还挤满了人。现在，它越空，越显得只剩下他一个。白牙很快作出决定。他钻进森林，沿着河岸顺流追赶。他整整跑了一天，一次也没有停下。那副铁打般的身体仿佛永远不会疲倦。后来，疲劳终于来了，可血脉中传下的坚忍仍撑住了他，逼着酸痛的身体继续跑。
        - id: ch01-b11
          speaker: narrator
          text: >-
            河水转弯，贴着陡峭山崖流过时，白牙就爬上后面的高山。一路上，许多河流和溪水汇入大河。他能走过去就走过去，不能走就游过去。有时，他踩上岸边刚结成的薄冰。冰面不止一次突然破裂，把他摔进刺骨的急流，他只好在水中拼命挣扎。无论走到哪里，白牙都在寻找诸神的踪迹，生怕它离开河岸，拐进内陆。
        - id: ch01-b12
          speaker: narrator
          text: >-
            白牙比大多数同类都聪明，可他的心智还没有开阔到能想到麦肯齐河的另一岸。诸神的踪迹会不会从对岸离开河边？这个念头根本没有出现。将来，他会走过更多地方，会长大，变得更聪明，也会更加熟悉道路和河流。到了那时，他也许能想到这种可能。但现在还不能。他只是盲目地向前跑，心里只有自己脚下的这一岸。
        - id: ch01-b13
          speaker: narrator
          text: >-
            白牙又跑了一整夜。黑暗中，他不断撞上障碍，遇到意外。这些东西拖慢了脚步，却没能吓退他。到了第二天中午，他已经连续跑了三十个钟头，连铁打般的身体也撑不住了。只有那股不肯停下的意志还在推动他。他四十个钟头没吃东西，饿得浑身发软，又一次次掉进冰水，整身皮毛已经湿乱不堪。宽大的脚垫磨破了，流着血。他一瘸一拐，而且越来越严重。偏偏天空又暗下来，雪开始落了。那雪又冷又湿，落在身上便融化，牢牢黏住。地面又湿又滑，四周的景物看不清，坑坑洼洼也全被雪盖住。白牙每走一步，都更加费力，也更加疼痛。
        - id: ch01-b14
          speaker: narrator
          text: >-
            灰海狸原本想在麦肯齐河对岸过夜，因为猎场就在那边。可黄昏前，一头麋鹿来到近岸喝水，正好被他的妻子克卢库奇看见。许多事情只要有一件没有发生，后来的结果就会完全不同。要是麋鹿没有来喝水，要是米特萨没有因为风雪让船偏离航线，要是克卢库奇没有发现它，要是灰海狸没有幸运地一枪打中，灰海狸便不会留在近岸扎营。白牙也会从旁边跑过去，一直跑下去。他或许会死，或许会找到荒野中的兄弟，成为它们的一员，从此到死都是一头狼。
        - id: ch01-b15
          speaker: narrator
          text: >-
            夜已经降下，雪越下越密。白牙轻轻呜咽着，踉踉跄跄地向前挪。忽然，他在雪地里发现了一道新鲜的踪迹。那道踪迹实在太新鲜了，他一眼就明白了它是什么。他急切地哼叫起来，沿着痕迹离开河岸，折回树林。很快，营地的声音传进耳中。白牙看见燃烧的火堆，看见克卢库奇正在做饭，也看见灰海狸蹲在那里，嘴里嚼着一大块生油脂。营地里有新鲜的肉。
        - id: ch01-b16
          speaker: narrator
          text: >-
            白牙知道自己一定会挨打。想到那顿毒打，他伏低了身子，背毛也微微竖起。可他还是向前走去。他怕挨打，也厌恶挨打。不过他同样知道，火堆会给他温暖，诸神会保护他，狗群也会陪着他。当然，那些狗都把他当作敌人。可再充满敌意的陪伴也还是陪伴，他需要回到群体中去。
        - id: ch01-b17
          speaker: narrator
          text: >-
            白牙缩着身子，贴地爬进火光。灰海狸看见他，停下嘴，不再嚼那块油脂。白牙一点点向主人爬去，姿态卑微到了极点。越靠近灰海狸，他爬得越慢，也越痛苦。终于，他伏在主人脚下，自愿把自己的肉体和灵魂都交了出去。他自己选择回到人的火堆旁，接受人的统治。白牙浑身发抖，等着惩罚落下。头顶那只手动了，他以为巴掌来了，本能地缩成一团。可是，没有巴掌。白牙偷偷抬头一看，灰海狸正把手里的油脂掰成两半，还把其中一块递给了他。白牙小心地闻了闻，仍有些不敢相信，然后才吃起来。灰海狸又让人拿肉给他，还在他进食时拦住其他的狗。吃饱以后，白牙又感激又满足，伏在灰海狸脚边，望着温暖的火，慢慢眨眼打盹。他知道，明天醒来，自己不会再孤零零地流浪在寒冷荒凉的森林里。他会留在人形动物的营地，留在那些他已经献身、也从此依赖的诸神身边。
