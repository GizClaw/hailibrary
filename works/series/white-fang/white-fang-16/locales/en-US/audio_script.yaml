audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: grave and vivid storytelling
        timbre: warm and resonant
        pace: measured
        pitch: medium-low
    grey_beaver:
      display_name: Grey Beaver
      tts:
        delivery: blunt and restrained
        timbre: deep and weathered
        pace: deliberate
        pitch: low
    beauty_smith:
      display_name: Beauty Smith
      tts:
        delivery: sly and harsh
