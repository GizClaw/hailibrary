  chapters:
    - id: ch01
      title: THE MEN OF FORT YUKON
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            Only a few white men lived at Fort Yukon, and they had been in the country a long time. They proudly called themselves Sour-doughs. They had nothing but scorn for men who had just arrived. Those newcomers stepped ashore from the steamers and were called chechaquos, a name that always made them wilt. They baked bread with baking powder. The Sour-doughs used sourdough because they had no baking powder, and somehow that became the great difference between them.
        - id: ch01-b02
          speaker: narrator
          text: >-
            But the bread was not really the point. The men at the fort loved to watch newcomers get into trouble. Best of all, they enjoyed seeing White Fang and his rough gang tear into the newcomers' dogs. Whenever a steamer arrived, the fort men made sure to gather on the riverbank and watch the fun. They looked forward to the fighting as eagerly as the Indian dogs did, and they were quick to understand just how savage and clever White Fang was.
        - id: ch01-b03
          speaker: narrator
          text: >-
            One man enjoyed it more than anyone else. At the first whistle of a steamboat, he came running. When the last fight ended and White Fang's pack scattered, he walked slowly back to the fort with regret heavy on his face. Sometimes a gentle southland dog went down beneath the pack, screaming as it died. Then this man could not contain himself. He would leap into the air and shout with delight. And all the while, he watched White Fang with sharp, greedy eyes.
        - id: ch01-b04
          speaker: narrator
          text: >-
            The fort men called him Beauty. No one knew his first name, and throughout the country he was known as Beauty Smith. The name was a joke, because he was anything but beautiful. Nature had given him very little to work with. He was a small man with a thin body and an even smaller head. The top rose to a point. As a boy, before people called him Beauty, they had called him Pinhead.
        - id: ch01-b05
          speaker: narrator
          text: >-
            From that point, his skull sloped back toward his neck and forward toward a low, very wide forehead. It was as though Nature regretted making the top so narrow and tried to make up for it by spreading the features below. His eyes were large, with enough room for two more eyes between them. His face looked enormous beside the rest of him, and his jaw was wider and heavier still. It pushed so far out and down that it almost seemed to rest on his chest, as if his narrow neck had grown tired of holding it up.
        - id: ch01-b06
          speaker: narrator
          text: >-
            That jaw made him look fiercely determined, but the look was false. Perhaps it was simply too large to be convincing. Beauty Smith was known everywhere as a cringing, sniveling coward. His teeth were big and yellow, with two long eye-teeth showing like fangs beneath his thin lips. His eyes were a muddy yellow, as if Nature had mixed the last dirty drops of color left in her paint tubes. His sparse, uneven hair had the same muddy shades. It stuck out from his head and face in unexpected tufts, like clumps of grain tossed by the wind.
        - id: ch01-b07
          speaker: narrator
          text: >-
            In short, Beauty Smith was a monstrosity, though he was not to blame for the way he had been made. He did the fort's cooking, dishwashing, and hardest chores. The other men did not exactly despise him. In their rough human way, they tolerated him as they might tolerate any creature that had been badly treated in the making. They feared him too. In one of his cowardly rages, he might shoot a man in the back or slip poison into the coffee. Still, someone had to cook, and whatever else was wrong with Beauty Smith, he was a good cook.
    - id: ch02
      title: A THING TO BE HATED
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            This was the man who watched White Fang, thrilled by his ferocity, and wanted him for his own. At first, he tried to make friends with White Fang. White Fang ignored him. When the man became more persistent, White Fang raised his fur, showed his teeth, and backed away. He disliked the man. Something about him felt wrong. White Fang sensed evil there. He feared the reaching hand and the softly spoken words that tried to draw him close. Because of that fear, he hated Beauty Smith.
        - id: ch02-b02
          speaker: narrator
          text: >-
            Simple creatures understand good and bad in simple ways. Good means comfort, satisfaction, and relief from pain, so it is liked. Bad means discomfort, danger, and hurt, so it is hated. Everything White Fang felt from Beauty Smith was bad. Something unhealthy seemed to rise from the man's misshapen body and twisted mind like mist from a fever-filled marsh. White Fang did not reason his way to that knowledge. His five senses alone did not give it to him. Some deeper, distant sense, one that no one had mapped or named, warned him that this man promised evil and pain. He was a bad thing, and White Fang wisely hated him.
        - id: ch02-b03
          speaker: narrator
          text: >-
            White Fang was in Grey Beaver's camp the first time Beauty Smith visited. Before the man even appeared, the faint sound of his distant steps told White Fang who was coming. He sprang up from where he had been resting and slipped to the edge of camp like a wolf. He could not understand what the two men said, but he watched them talk. When Beauty Smith pointed at him from fifty feet away, White Fang snarled as if that hand were already coming down on his head. Beauty Smith laughed. White Fang glided into the shelter of the woods, looking back as he went.
        - id: ch02-b04
          speaker: narrator
          text: >-
            Grey Beaver would not sell him. Trading had made Grey Beaver rich, and he needed nothing. Besides, White Fang was valuable. He was the strongest sled dog Grey Beaver had ever owned and his finest leader. No other dog on the Mackenzie or the Yukon could match him. He could fight, and he killed other dogs as easily as men killed mosquitoes. At that thought, Beauty Smith's eyes shone and his tongue passed eagerly over his thin lips. Even then, Grey Beaver's answer remained the same. White Fang was not for sale at any price.
    - id: ch03
      title: THE PRICE IN BOTTLES
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            Beauty Smith knew how to deal with Indians. He began visiting Grey Beaver's camp often, always carrying a black bottle or two beneath his coat. Whisky creates a thirst for more whisky, and soon Grey Beaver had that thirst. His mouth and stomach burned, then demanded more of the same scorching drink. His brain was not used to such a powerful stimulant. It threw his thinking so far out of order that he would go to any length for another bottle. The money from his furs, mittens, and moccasins began to disappear, faster and faster. The smaller his money bag grew, the shorter his temper became.
        - id: ch03-b02
          speaker: narrator
          text: >-
            At last, his money, his goods, and his temper were all gone. Only his thirst remained, and that was a huge possession by itself. Every sober breath made it stronger. Beauty Smith came again to talk about buying White Fang. This time, he offered bottles instead of dollars, and Grey Beaver's ears were much more eager to listen.
        - id: ch03-b03
          speaker: grey_beaver
          text: >-
            You catch dog. You take him. All right.
        - id: ch03-b04
          speaker: narrator
          text: >-
            Beauty Smith handed over the bottles. Two days passed before he came to collect what he had bought.
        - id: ch03-b05
          speaker: beauty_smith
          text: >-
            You catch dog.
        - id: ch03-b06
          speaker: narrator
          text: >-
            One evening, White Fang slipped into camp and lay down with a contented sigh. The white god he dreaded was nowhere in sight. For days, Beauty Smith had made his desire to seize him more and more obvious. White Fang had been forced to avoid the camp during that time. He did not know exactly what those grasping hands meant to do. He only knew they promised some kind of evil, and he must keep beyond their reach.
        - id: ch03-b07
          speaker: narrator
          text: >-
            He had barely settled down when Grey Beaver staggered over and tied a leather thong around his neck. Then Grey Beaver sat beside him, gripping the thong in one hand and a bottle in the other. From time to time, he tipped the bottle above his head, and it made a gurgling sound.
        - id: ch03-b08
          speaker: narrator
          text: >-
            An hour went by. Then footsteps sent faint vibrations through the ground. White Fang heard them first. His fur rose as he recognized the man, while Grey Beaver still nodded stupidly beside him. White Fang tried to ease the thong from his master's loose hand. But the fingers suddenly tightened, and Grey Beaver woke.
    - id: ch04
      title: SOLD TO THE WHITE GOD
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            Beauty Smith strode into camp and stood over White Fang. White Fang gave a low snarl and watched the fearful man's hands with great care. One hand reached out and slowly descended toward his head. White Fang crouched beneath it and stared with hatred. His breath quickened. His low snarl grew tense and harsh, then came in shorter bursts as the hand drew nearer. At the last instant, he struck with his teeth, quick as a snake. Beauty Smith snatched his hand away, and White Fang's jaws closed on empty air with a sharp click.
        - id: ch04-b02
          speaker: narrator
          text: >-
            Beauty Smith was frightened and furious. Grey Beaver struck White Fang on the side of the head, and White Fang dropped close to the earth in respectful obedience. Still suspicious, he followed every movement the men made. Beauty Smith left, then returned carrying a heavy club. Grey Beaver handed him the end of the thong.
        - id: ch04-b03
          speaker: narrator
          text: >-
            Beauty Smith walked away, and the thong pulled tight. White Fang resisted. Grey Beaver struck him from both sides until he stood and followed. Then White Fang suddenly rushed the stranger who was dragging him away. Beauty Smith did not leap back. He had expected the attack. He swung the club hard, stopped White Fang in the middle of his rush, and smashed him to the ground. Grey Beaver laughed and nodded his approval. Beauty Smith pulled the thong tight again, and White Fang struggled dizzily to his feet.
        - id: ch04-b04
          speaker: narrator
          text: >-
            White Fang did not attack again. One blow was enough to show him that this white god knew how to use a club, and he was too wise to fight what could not be avoided. He followed unhappily at Beauty Smith's heels with his tail between his legs, though he kept snarling quietly under his breath. Beauty Smith watched him closely and warily, and the club stayed ready in his hand at all times.
        - id: ch04-b05
          speaker: narrator
          text: >-
            At the fort, Beauty Smith tied White Fang securely and went inside to sleep. White Fang waited for an hour. Then he put his teeth to the leather thong, and ten seconds later he was free. There had been no wasted motion and no useless gnawing. He cut the thong on a slant, almost as cleanly as a knife could have done it. Bristling and growling, he looked up at the fort. Then he turned and trotted back to Grey Beaver's camp. He owed no loyalty to this strange and terrible god. He had given himself to Grey Beaver, and he still believed that was where he belonged.
        - id: ch04-b06
          speaker: narrator
          text: >-
            What had happened before now happened again, but with one difference. Grey Beaver tied White Fang with another thong and gave him back to Beauty Smith the next morning. This time, Beauty Smith beat him. White Fang was fastened too securely to escape or fight back. He could only rage helplessly and endure the club and whip. It was the worst beating of his life. Even the terrible beating Grey Beaver had given him as a puppy seemed mild beside it.
        - id: ch04-b07
          speaker: narrator
          text: >-
            Beauty Smith loved every moment of it. He gloated over his helpless victim. His dull eyes burned as he swung the whip or club and listened to White Fang's cries of pain, his helpless bellows, and his snarls. Beauty Smith had the cruelty of a coward. When a man struck him or spoke angrily, he cringed and whimpered. In turn, he took his revenge on creatures weaker than himself.
        - id: ch04-b08
          speaker: narrator
          text: >-
            Every living thing likes to feel power, and Beauty Smith was no different. He could not show power among other men, so he turned to lesser creatures and proved his strength there. Yet he had not made himself. He had come into the world with a twisted body and a brutal mind. That was the clay he had been given, and the world had not shaped it kindly.
        - id: ch04-b09
          speaker: narrator
          text: >-
            White Fang understood why he was being beaten. Grey Beaver had tied the thong around his neck and handed it to Beauty Smith, so Grey Beaver wanted him to go. Beauty Smith had tied him outside the fort, so Beauty Smith wanted him to stay. White Fang had disobeyed the will of both gods, and he believed he had earned the punishment that followed. He had seen other dogs change owners before. He had also seen dogs run away from new masters and receive the same kind of beating when they were caught.
        - id: ch04-b10
          speaker: narrator
          text: >-
            White Fang was wise, but something in him was stronger than wisdom. That something was faithfulness. He did not love Grey Beaver. Even when he faced his old master's will and anger, he remained faithful to him. He could not help it. Faithfulness was part of the clay that made him. It belonged especially to his kind and set his kind apart from every other species. That was the quality that had led the wolf and the wild dog in from the open to become the companions of man.
    - id: ch05
      title: THE MAD GOD
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: >-
            After the beating, White Fang was dragged back to the fort. This time, Beauty Smith tied him with a stick. A god is not easily given up, and Grey Beaver was still White Fang's own particular god. In spite of Grey Beaver's command, White Fang kept clinging to him. Betrayal and abandonment made no difference. White Fang had surrendered his whole body and soul without holding anything back. That bond would not break easily.
        - id: ch05-b02
          speaker: narrator
          text: >-
            During the night, while the men in the fort slept, White Fang set his teeth to the stick. The wood was seasoned, dry, and hard. It was tied so close against his neck that he could hardly reach it. He strained every muscle and arched his neck until he caught the barest edge between his teeth. Even then, he could barely hold it. Only enormous patience kept him gnawing through the long hours of the night.
        - id: ch05-b03
          speaker: narrator
          text: >-
            Dogs were not supposed to do such a thing. No one had known one to do it before. But White Fang did. Early in the morning, he trotted away from the fort with the broken end of the stick still hanging from his neck.
        - id: ch05-b04
          speaker: narrator
          text: >-
            If wisdom alone had ruled him, he would never have returned to the man who had betrayed him twice. But faithfulness ruled him too. White Fang went back to Grey Beaver and was betrayed for the third time. Again, he yielded while Grey Beaver tied a thong around his neck. Again, Beauty Smith came to claim him. And this time, the beating was even more severe than the one before.
        - id: ch05-b05
          speaker: narrator
          text: >-
            Grey Beaver watched without feeling while the white man used the whip. He did nothing to protect White Fang. White Fang was no longer his dog. When it ended, White Fang was sick. A gentle dog from the south would have died from such a beating, but White Fang had learned life in a harder school. He was made of tougher stuff. There was too much life in him, and his hold on it was too strong. Still, he was very sick.
        - id: ch05-b06
          speaker: narrator
          text: >-
            At first, he could not even drag himself forward. Beauty Smith had to wait half an hour for him. At last White Fang managed to rise. Nearly blind, reeling, and swaying on his feet, he followed at Beauty Smith's heels back to the fort.
        - id: ch05-b07
          speaker: narrator
          text: >-
            Now Beauty Smith fastened him with a chain his teeth could not cut. White Fang threw himself against it again and again. He tried to tear the metal staple from the heavy timber where it had been driven, but all his lunging was useless.
        - id: ch05-b08
          speaker: narrator
          text: >-
            A few days later, Grey Beaver was sober and bankrupt. He had nothing left. He began the long journey up the Porcupine River toward the Mackenzie. White Fang stayed behind on the Yukon as Beauty Smith's property. He now belonged to a man who was more than half mad and completely brutal.
        - id: ch05-b09
          speaker: narrator
          text: >-
            But how could a dog understand madness? To White Fang, Beauty Smith was a true god, though a terrible one. He was a mad god, but White Fang knew nothing about madness. He knew only that he must yield to this new master's will and obey every whim and desire.
