audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 沉着克制，带着北国故事的冷峻张力
        timbre: 温厚清晰，略显低沉
        pace: 舒缓而有变化
        pitch: 中低
    grey_beaver:
      display_name: 灰海狸
      tts:
        delivery: 简短生硬，醉意中依然带着主人的命令口气
        timbre: 粗粝厚重
        pace: 缓慢
        pitch: 低
    beauty_smith:
      display_name: 美人史密斯
      tts:
        delivery: 阴沉黏腻，贪婪时急切，发怒时尖刻
        timbre: 干涩刺耳
        pace: 中等偏慢
        pitch: 中高
  chapters:
    - id: ch01
      title: 第二章　疯狂的神
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            育空堡里只住着几个白人。他们在这一带待得久，自称“老酵子”，说起这个名号还很得意。至于刚来到北方的人，他们打心眼里瞧不起。汽船送来的新手叫作“切查科”，一听见别人这样叫，个个都像霜打的草一样蔫了。新手用发酵粉做面包，老酵子没有发酵粉，只能养酸面团。人们偏偏就拿这点差别，把两群人分出了高下。
        - id: ch01-b02
          speaker: narrator
          text: >-
            说到底，这些称呼并不重要。重要的是，堡里的人爱看新手倒霉。他们最喜欢的热闹，就是看白牙带着那群声名狼藉的印第安狗，去祸害新手从南方带来的狗。每逢汽船靠岸，堡里的人准会赶到河边。他们和那些狗一样盼着好戏开场，也都看得明白，白牙在这场残酷的游戏里既凶狠又狡猾。
        - id: ch01-b03
          speaker: narrator
          text: >-
            其中有一个人尤其爱看。汽笛刚响，他就飞跑过去。等最后一场厮杀结束，白牙和狗群散开了，他才拖着脚步回堡里，脸上全是遗憾。有时，一条温顺的南方狗被扑倒，在群狗牙下发出临死的尖叫，这人竟会高兴得跳起来，放声叫好。而他那双尖刻又贪婪的眼睛，总盯在白牙身上。
        - id: ch01-b04
          speaker: narrator
          text: >-
            堡里的人叫他“美人”。没人知道他的名字，这一带只知道他叫美人史密斯。其实，他跟美这个字毫不相干。大家这样叫，正是因为他丑得出奇。大自然在他身上十分吝啬。他个子矮小，身子瘦弱，偏偏还顶着一颗更小的脑袋。头顶尖得像一个点。小时候，同伴还没给他取名“美人”，都叫他“尖脑袋”。
        - id: ch01-b05
          speaker: narrator
          text: >-
            从尖尖的头顶往后看，脑袋一路斜到脖子。往前看，它又直直斜向一片又低又宽的额头。到了额头这里，大自然仿佛忽然嫌自己给得太少，索性把他的五官全铺开来。他两眼之间宽得还能塞下两只眼，脸跟身体一比，大得不成比例。为了给这张脸腾地方，大自然又给了他一副硕大的下巴。它又宽又沉，向前凸，也向下坠，简直像压在胸口。也许只是他那根细脖子太累，实在托不住这份重量。
        - id: ch01-b06
          speaker: narrator
          text: >-
            那副下巴看起来凶狠而坚定，可这模样是假的。也许它太大了，反倒缺了真正的力量。美人史密斯远近闻名，是个腿软又爱哼唧的胆小鬼。他的牙又大又黄，两颗犬齿从薄唇底下露出来，像野兽的獠牙。眼睛又黄又浑，仿佛大自然用完了颜色，只好刮出所有颜料管底下的残渣，混在一起给他涂上。头发也是一绺泥黄，一绺污黄，稀疏地从头顶和脸上乱冒，像被风吹倒以后黏成团的庄稼。
        - id: ch01-b07
          speaker: narrator
          text: >-
            总之，美人史密斯活像一个怪物，可他并不能为自己的长相负责。造物时，他这团泥就是这样被捏出来的。他替堡里其他人做饭、洗碗，什么苦活都干。人们没有鄙视他，只像容忍一个生来就被亏待的可怜生灵那样容忍他。可他们也提防他，生怕这个懦夫突然发疯，从背后开一枪，或者往咖啡里下毒。终究得有人做饭，而美人史密斯不管有多少毛病，饭菜确实做得不错。
        - id: ch01-b08
          speaker: narrator
          text: >-
            就是这个人看中了白牙。他喜欢白牙厮杀时的凶猛，一心想把白牙弄到手。起初，他试着靠近，白牙根本不理。后来他越缠越紧，白牙便竖起毛，龇着牙往后退。白牙讨厌他。从这个人身上，白牙闻到了坏的气息。他知道那里面藏着邪恶，因此害怕那只伸来的手，也害怕那故意放软的声音。白牙恨美人史密斯。
        - id: ch01-b09
          speaker: narrator
          text: >-
            对动物来说，善恶其实很简单。能让身体舒适、让愿望满足、让疼痛停止的，就是善，所以值得亲近。会带来不适、威胁和伤害的，就是恶，所以必须憎恨。白牙感到，美人史密斯就是恶。这个人畸形的身体和扭曲的心里，飘出一种病态的气息，像疟疾沼泽升起的雾。白牙不是靠思考得出这个判断，也不只靠眼耳鼻舌和触觉。他体内还有更遥远、更神秘的感觉。那些感觉告诉他，这个人带着凶兆，满身都是伤害。憎恨他，才是明智的选择。
        - id: ch01-b10
          speaker: narrator
          text: >-
            美人史密斯第一次来到灰海狸的营地时，白牙也在那里。远处才响起轻微的脚步，人还没有出现，白牙已经认出了他，毛立刻竖起来。白牙本来正放松地躺着，这时一下站起，像狼那样悄无声息地滑到营地边缘。他听不懂两人在说什么，只看见美人史密斯和灰海狸交谈。美人史密斯抬手指了指他。那只手明明离着五十英尺，白牙却像看见它正往自己头上落，马上发出低吼。美人史密斯笑了。白牙退进树林，一边贴着地面无声地走，一边回头盯着他。
        - id: ch01-b11
          speaker: narrator
          text: >-
            灰海狸不肯卖。他做买卖赚了钱，已经什么都不缺。再说，白牙是他最值钱的牲畜，是他养过的雪橇犬里最强壮的一条，也是最好的领头犬。麦肯齐河和育空河一带，再找不到第二条这样的狗。白牙打起架来，杀死别的狗就跟人拍死蚊子一样轻松。美人史密斯听见这话，两眼发亮，还急切地舔了舔薄嘴唇。可灰海狸的意思很清楚，出多少钱也别想买走白牙。
        - id: ch01-b12
          speaker: narrator
          text: >-
            美人史密斯却懂得怎样对付印第安人。他一次又一次来到营地，大衣里总藏着一两只黑瓶子。威士忌有一种力量，它会让人越喝越渴。灰海狸也染上了这种渴。嘴里灼热，胃里火烧火燎，整个身体都嚷着还要更多。突如其来的刺激搅乱了他的脑子，为了再喝一口，他什么都做得出来。卖毛皮、手套和鹿皮鞋换来的钱不断流走，而且越流越快。钱袋越来越空，他的脾气也越来越坏。
        - id: ch01-b13
          speaker: narrator
          text: >-
            到最后，钱没了，货没了，就连脾气也耗光了。灰海狸只剩下一股巨大的渴，而且每清醒地喘一口气，那股渴就长得更大。美人史密斯又来谈买白牙。现在他拿出的价钱不再是钱，而是一瓶瓶酒。灰海狸终于肯认真听了。
        - id: ch01-b14
          speaker: grey_beaver
          text: “狗你抓到，就带走。”
        - id: ch01-b15
          speaker: narrator
          text: >-
            这就是灰海狸最后的答复。酒瓶交了过去。可两天以后，白牙还没有到手，美人史密斯只好再次来催。
        - id: ch01-b16
          speaker: beauty_smith
          text: “你去把狗抓住。”
        - id: ch01-b17
          speaker: narrator
          text: >-
            一天傍晚，白牙溜回营地，满足地叹了口气，趴下休息。那个可怕的白皮肤神不在。连日来，美人史密斯越来越急着伸手抓他，害得他连营地也不敢靠近。白牙不知道那双手究竟会带来哪一种邪恶，只知道危险一定藏在里面，自己最好躲得远远的。
        - id: ch01-b18
          speaker: narrator
          text: >-
            可他刚躺下，灰海狸就摇摇晃晃地走来，把皮条拴在他脖子上。接着，灰海狸在旁边坐下，一手抓住皮条，一手拿着酒瓶。过一会儿，他便把瓶底朝天举到嘴边，喉咙里咕嘟咕嘟一阵响。一个钟头以后，远处的脚步震动顺着地面传来。白牙先听见了。他认出来人，立刻竖起毛，灰海狸却还在迷迷糊糊地点头。白牙想悄悄把皮条从主人手里抽走，可那几根松开的手指猛地抓紧，灰海狸也醒了。
        - id: ch01-b19
          speaker: narrator
          text: >-
            美人史密斯大步走进营地，站到白牙面前。白牙盯紧他的双手，低低地向这个可怕的东西咆哮。一只手伸出来，慢慢往白牙头上落。白牙伏低身子，恶狠狠地看着它。手越靠近，他呼吸越急，吼声也越短、越硬。忽然，他像蛇一样猛地一口咬去。那只手赶快缩回，白牙的牙齿咔嚓一声撞在一起，什么也没咬到。美人史密斯又怕又怒。灰海狸朝白牙脑袋侧面狠狠打了一下，白牙只得服从地伏到地上。
        - id: ch01-b20
          speaker: narrator
          text: >-
            白牙仍怀疑地盯着每一个动作。他看见美人史密斯走开，又带回一根粗棍。灰海狸把皮条交给他，美人史密斯便转身往前走。皮条绷紧了，白牙不肯跟。灰海狸从左右两边接连打他，逼他站起来。白牙终于起身，却猛然冲向拖走自己的陌生人。美人史密斯早就在等这一扑。他没有躲，反手挥出粗棍，半路截住白牙，把他砸倒在地。灰海狸看得笑起来，还点头表示赞许。皮条再次收紧，白牙头晕眼花，只能软绵绵地爬起来。
        - id: ch01-b21
          speaker: narrator
          text: >-
            白牙没有再扑。只挨这一下，他就知道白皮肤的神会用棍子。他太聪明，不会跟躲不过的事情硬拼。于是他夹着尾巴，阴沉地跟在美人史密斯脚后，喉咙里仍旧轻轻低吼。美人史密斯一路防着他，粗棍始终举在手里，随时可以再打。
        - id: ch01-b22
          speaker: narrator
          text: >-
            到了堡里，美人史密斯把白牙牢牢拴住，自己进屋睡了。白牙等了一个钟头，便开始咬皮条。不到十秒，他就自由了。他没有浪费一口力气，皮条被斜着咬断，切口整齐得像刀割。白牙抬头望着堡垒，竖起毛发出低吼，然后转身小跑回灰海狸的营地。他不欠这个陌生又可怕的神任何忠诚。他曾经把自己交给灰海狸，所以他认为，自己依然属于灰海狸。
        - id: ch01-b23
          speaker: narrator
          text: >-
            先前的一切又发生了一遍，却多了一个不同的结果。灰海狸再次给白牙套上皮条，第二天早晨又把他交出去。这一次，美人史密斯狠狠打了白牙。白牙被牢牢拴住，除了徒劳地挣扎、咆哮，什么也做不了。棍子和鞭子一齐落下来，那是他一生挨过的最重的一顿毒打。小时候灰海狸给过他的那顿狠打，和这次相比也算温和。
        - id: ch01-b24
          speaker: narrator
          text: >-
            美人史密斯喜欢毒打白牙。他挥动棍子和鞭子，得意地看着自己的牺牲品，听着白牙痛苦地哀号、无力地咆哮和低吼，眼里亮起阴暗的火。他的残忍正是胆小鬼的残忍。面对男人的拳头和怒骂，他只会畏缩哀求。转过身，他便把报复全发泄在比自己弱小的动物身上。所有生命都喜欢权力，他也不例外。他无法在同类面前表现力量，只能欺负弱小，借此证明自己活着。可他没有创造自己。他来到世上时，身体已经扭曲，头脑也像野兽。那便是他的泥土，而这个世界从没温柔地塑造过他。
        - id: ch01-b25
          speaker: narrator
          text: >-
            白牙明白自己为什么挨打。灰海狸给他拴上皮条，又把皮条交给美人史密斯，就表示他的神要他跟这个人走。美人史密斯把他拴在堡外，也表示他必须留在那里。白牙逃走，便违背了两位神的命令，所以惩罚跟着来了。他见过狗更换主人，也见过逃回来的狗挨打。他虽然聪明，身体里却有比聪明更强的力量，其中一样就是忠诚。他不爱灰海狸，可就算面对灰海狸的命令和怒火，他还是忠于灰海狸。这由不得他。忠诚原本就在组成他的泥土里，是狼和野狗特有的禀赋。正因为有了它，它们才能离开荒野，走到人类身边，成为人的伙伴。
        - id: ch01-b26
          speaker: narrator
          text: >-
            毒打过后，白牙被拖回堡里。这回，美人史密斯把一根木棍紧紧拴在他脖子上。一位神哪能轻易放弃，白牙也做不到。灰海狸是他自己的神。就算灰海狸要他离开，白牙还是不肯放手。背叛和抛弃也没有改变他。白牙把身体和灵魂交出去的时候，没有留下一丝一毫。这样的纽带，不可能轻易断掉。
        - id: ch01-b27
          speaker: narrator
          text: >-
            夜里，堡里的人全都睡着了，白牙便开始啃脖子上的木棍。木头又干又硬，还贴着脖颈系得很紧，他几乎够不着。白牙使出全身力气，把脖子弯到极限，才勉强用牙尖夹住它。接下来，他耐着性子，一口接一口啃了好几个钟头，终于把木棍咬穿。谁也不会想到一条狗能做成这种事，从前也没有狗做过。可白牙做到了。天刚亮，他便小跑着离开堡垒，断棍的一头还挂在脖子下面。
        - id: ch01-b28
          speaker: narrator
          text: >-
            白牙很聪明。可要是他只有聪明，就不会再回到已经两次背叛他的灰海狸身边。偏偏他还有忠诚，所以他回去了，也因此遭到第三次背叛。灰海狸又把皮条拴到他脖子上，白牙又一次顺从。美人史密斯来领走他，这一次下手比前两次更加狠毒。
        - id: ch01-b29
          speaker: narrator
          text: >-
            白人挥动鞭子时，灰海狸只在旁边冷冷看着，没有保护白牙。白牙已经不是他的狗了。毒打结束以后，白牙病得很重。若是换成一条温顺的南方狗，早就被打死了，可白牙经受过更严酷的磨炼，自己的筋骨也更硬。他的生命力太强，活下去的意志也抓得太紧。但这一次，他还是倒下了。起初，他连身体也拖不动，美人史密斯只得等上半个钟头。后来，白牙眼前模糊，脚步摇晃，还是跟在美人史密斯身后，一路回到堡里。
        - id: ch01-b30
          speaker: narrator
          text: >-
            现在，白牙脖子上换成了铁链，牙齿再也咬不断。他一次次猛冲，想把铁环从木头里拔出来，却怎么也做不到。几天以后，灰海狸已经清醒，也已经一贫如洗。他沿着豪猪河向上游去了，要走很远的路回到麦肯齐河。白牙留在育空河畔，成了一个半是疯子、半是野兽的人的财产。可一条狗怎么会懂什么叫疯狂呢？对白牙来说，美人史密斯确实是一位神，只不过是一位可怕的神。他至多算个疯狂的神，可白牙不知道疯狂是什么。白牙只知道，从今以后，他必须服从新主人的意志。这个人每一个古怪的念头，每一次任性的摆布，他都必须听从。
