  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: grave and vivid storytelling
        timbre: warm and resonant
        pace: measured
        pitch: medium-low
  chapters:
    - id: ch01
      title: THE LAIR
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            For two days, the she-wolf and One Eye stayed near the Indian camp. He was uneasy and watchful there, but something about the camp kept drawing his mate back, and she did not want to leave. Then one morning a rifle cracked close by. A bullet struck a tree only inches from One Eye's head. That ended their hesitation. They set off at a long, swinging run and quickly put miles between themselves and the danger.
        - id: ch01-b02
          speaker: narrator
          text: >-
            They traveled only another two days. The she-wolf urgently needed to find what she had been seeking. Her body had grown heavy, and she could no longer run fast. Once she chased a rabbit that would normally have been easy prey, but soon she gave up and lay down. One Eye came over and gently touched her neck with his muzzle. She snapped so fiercely that he tumbled backward trying to escape her teeth. Her temper was shorter than ever. He only grew more patient and attentive.
        - id: ch01-b03
          speaker: narrator
          text: >-
            At last she found what she needed. A few miles up a small stream, a high clay bank hung over the frozen bed. Summer water would have carried that stream into the Mackenzie, but now it was frozen all the way to its rocky bottom. Spring storms and melting snow had worn away part of the bank, leaving a little cave inside a narrow crack.
        - id: ch01-b04
          speaker: narrator
          text: >-
            The she-wolf stopped at the opening and carefully studied the whole bank. First she ran along its base in one direction, then she came back and checked the other side, all the way to where the steep wall softened into the land. Only then did she return to the crack and go inside. For the first three feet, she had to crouch low. Beyond that, the walls widened and rose into a round chamber nearly six feet across. The roof just cleared her head. The place was dry and snug.
        - id: ch01-b05
          speaker: narrator
          text: >-
            She examined every part of it while One Eye stood at the entrance and watched. Then she lowered her nose toward the ground between her gathered feet and circled that spot several times. With a tired sigh that was almost a grunt, she curled up, let her legs relax, and dropped down facing the entrance.
        - id: ch01-b06
          speaker: narrator
          text: >-
            One Eye's ears pointed forward with interest. From where she lay, the she-wolf could see the brush of his tail waving against the white light outside. She tucked the sharp tips of her ears backward and down for a moment. Her mouth opened, and her tongue hung out peacefully. In her own way, she showed that she was pleased and satisfied. This place would do.
        - id: ch01-b07
          speaker: narrator
          text: >-
            One Eye was hungry. He lay in the entrance and tried to sleep, but his rest came in short, uneasy stretches. Again and again he woke, lifted his ears, and listened to the bright April day outside. Beneath the snow, hidden water had begun to trickle. The sun had returned, and the whole Northland seemed to be calling him. Life moved under the snow. Sap climbed the trees, and buds strained against the last grip of the frost.
        - id: ch01-b08
          speaker: narrator
          text: >-
            He glanced anxiously at his mate, but she showed no wish to rise. Outside, half a dozen snowbirds fluttered past. One Eye started to get up, looked back at her, and settled down again. Then a tiny, shrill hum reached him. He brushed his nose with a paw once, then twice, and opened his eyes. A lone mosquito buzzed at the tip of his nose. It had spent the whole winter frozen inside a dry log, and the sun had thawed it awake.
        - id: ch01-b09
          speaker: narrator
          text: >-
            One Eye could resist the spring world no longer. Besides, his belly was empty. He crawled over and tried to coax the she-wolf to get up with him, but she answered with a snarl. So he went out alone into the bright sunshine. The open snow had softened under his feet, making travel slow and difficult. He turned up the frozen bed of the stream instead. There, in the shade of the trees, the snow was still hard and crystalline enough to carry his weight.
        - id: ch01-b10
          speaker: narrator
          text: >-
            Eight hours later, One Eye returned through the darkness, hungrier than when he had left. He had found game, but he had caught nothing. Again and again, his weight had broken through the melting crust and left him struggling in the deep snow. The snowshoe rabbits had skimmed lightly across the top as easily as ever, leaving him behind.
        - id: ch01-b11
          speaker: narrator
          text: >-
            At the cave mouth, he stopped with a sudden shock of suspicion. Faint, strange noises came from inside. They were not his mate's sounds, though something about them seemed familiar. He crept in on his belly. The she-wolf met him with a warning snarl. It did not upset him, but he obeyed and kept his distance. Still, those other sounds held his attention. They were tiny, muffled sobs and wet, helpless noises, coming from somewhere close to his mate.
        - id: ch01-b12
          speaker: narrator
          text: >-
            His mate drove him away again, and he curled up to sleep at the entrance. By morning, dim light filled the lair, and One Eye tried once more to discover where the sounds came from. This time jealousy sharpened the she-wolf's warning. He stayed well back, but now he could see five tiny bundles nestled between her legs and against her body. They were weak and helpless. Their eyes were still closed, and they made soft whimpering sounds.
        - id: ch01-b13
          speaker: narrator
          text: >-
            One Eye was surprised. This was not the first litter he had seen during his long and successful life. It had happened many times before, yet each time the sight seemed fresh and astonishing. The she-wolf watched him anxiously. Every little while she gave a low growl. Whenever she thought he had moved too close, the warning climbed in her throat and broke into a sharp snarl.
        - id: ch01-b14
          speaker: narrator
          text: >-
            She had no memory of this happening to her before. But instinct carried a different kind of memory, the experience of all the mother wolves who had come before her. Somewhere in that ancient memory were fathers that had eaten their helpless newborn young. The fear was strong in her, though One Eye had done nothing to earn it. She would not let him come close enough to inspect the cubs he had fathered.
        - id: ch01-b15
          speaker: narrator
          text: >-
            There was no danger from One Eye. Another ancient instinct had awakened in him, passed down through generations of wolf fathers. It lived in every fiber of his body. He did not question it or wonder what it meant. To obey it felt like the most natural thing in the world. He turned his back on his new family and trotted away along the trail that meant meat and life.
        - id: ch01-b16
          speaker: narrator
          text: >-
            Five or six miles from the lair, the stream split into two forks that ran toward the mountains at right angles. A fresh track led up the left fork. One Eye smelled it and knew its maker had passed very recently. He crouched and stared along the trail. Then he deliberately turned into the right fork. The print was much larger than his own, and he knew there would be little meat for him behind an animal that size.
        - id: ch01-b17
          speaker: narrator
          text: >-
            Half a mile farther on, his sharp ears caught the scrape of gnawing teeth. He crept toward the sound and found a porcupine standing upright against a tree, testing its teeth on the bark. One Eye approached carefully, though without much hope. He knew what kind of animal it was, even though he had never seen one this far north. In all his long life, no porcupine had ever become his meal. Even so, he had learned that chance and opportunity were real. With living creatures, events never unfolded quite the same way twice. Something unexpected could always happen.
        - id: ch01-b18
          speaker: narrator
          text: >-
            The porcupine rolled into a tight ball, with long, sharp quills pointing in every direction. When One Eye was young, he had sniffed too close to just such a still bundle. Its tail had whipped into his face. One quill stayed buried in his muzzle for weeks, burning and aching until it finally worked free.
        - id: ch01-b19
          speaker: narrator
          text: >-
            Remembering that lesson, One Eye settled into a comfortable crouch. He kept his nose a full foot away and safely out of reach of the tail. Then he waited without moving. Perhaps the porcupine would uncurl. Perhaps he would get one quick chance to rip his paw across its soft, unguarded belly.
        - id: ch01-b20
          speaker: narrator
          text: >-
            For half an hour, nothing happened. At last One Eye stood and growled angrily at the motionless ball. He had waited for porcupines to open many times before, and every one of those waits had been useless. He knew better than to spend more of this day the same way. He trotted on up the right fork. Hour followed hour, and still the hunt gave him nothing.
        - id: ch01-b21
          speaker: narrator
          text: >-
            The new pull of fatherhood drove him onward. He had to find meat. That afternoon, he blundered upon a ptarmigan. He stepped from a thicket and found the slow-witted bird perched on a log, less than a foot from his nose. For one instant, each animal stared at the other. The startled bird sprang upward. One Eye struck it down with his paw, then pounced as it scrambled across the snow and tried to lift into the air again. His teeth closed around it before it could escape.
        - id: ch01-b22
          speaker: narrator
          text: >-
            His teeth crushed the tender flesh and thin bones, and he naturally began to eat. Then he remembered the lair. He turned toward home with the ptarmigan held in his mouth.
        - id: ch01-b23
          speaker: narrator
          text: >-
            A mile above the forks, he found newer marks from the large animal whose track he had avoided that morning. The trail now ran in his direction, so he followed it. He moved on his usual soft, silent feet, like a shadow sliding over the snow. At every new stretch of trail, he searched ahead and prepared himself to meet the creature around the next turn.
        - id: ch01-b24
          speaker: narrator
          text: >-
            At an unusually wide bend, he eased his head around a corner of rock. What he saw brought him down into a crouch at once. The maker of the tracks was there, a large female lynx. She was crouching just as he had crouched earlier that day, and before her sat the same tight ball of quills. One Eye had moved like a shadow before. Now he became the ghost of one. He crept away, circled the silent pair, and came back well downwind, where his scent could not reach them.
        - id: ch01-b25
          speaker: narrator
          text: >-
            One Eye set the ptarmigan beside him and lay under the needles of a low spruce. Through them, he watched the lynx and the porcupine in their silent contest. Each animal was intent on staying alive. The lynx's way to life was to eat the porcupine. The porcupine's way was to keep itself from being eaten. Hidden nearby, the old wolf had his own part in the contest. One Eye waited for some strange turn of chance that might put him back on the trail to meat.
        - id: ch01-b26
          speaker: narrator
          text: >-
            Half an hour passed, and then a full hour. Nothing changed. The ball of quills might have been a stone. The lynx might have been frozen into marble, and One Eye might have lain dead beneath the spruce. Yet all three were more fiercely alive than ever. Their attention was stretched so tight that the stillness itself seemed painful.
        - id: ch01-b27
          speaker: narrator
          text: >-
            One Eye shifted slightly and peered out with fresh eagerness. At last, something was changing. The porcupine had decided its enemy must be gone. Very slowly and carefully, it began to loosen its armor. There was no tremble of excitement in the movement. The bristling ball simply straightened and stretched, a little at a time. As the living meat opened before him like a waiting meal, One Eye's mouth grew wet, and saliva began to run.
        - id: ch01-b28
          speaker: narrator
          text: >-
            Before the porcupine had fully unrolled, it discovered the lynx. At that instant, the great cat struck. Her paw flashed beneath its tender belly, rigid claws curved like hooks, and ripped backward. If the porcupine had opened all the way, or noticed its enemy a moment later, the paw would have escaped. Instead, the tail flicked sideways as the lynx pulled back, driving sharp quills into her paw.
        - id: ch01-b29
          speaker: narrator
          text: >-
            Everything seemed to happen at once. There was the ripping blow, the answering flick of the tail, and the porcupine's squeal of agony. The lynx cried out in sudden pain and astonishment. One Eye half rose in excitement, with his ears high and his straight tail trembling behind him.
        - id: ch01-b30
          speaker: narrator
          text: >-
            The lynx lost her temper and sprang savagely at the creature that had hurt her. Torn almost apart, the porcupine squealed and grunted as it struggled to roll up again. Its tail struck a second time. Again the lynx screamed in pain and surprise.
        - id: ch01-b31
          speaker: narrator
          text: >-
            She backed away, sneezing, with her nose bristling like a huge pincushion. She pawed at the fiery quills and tried to pull them free. She pushed her face into the snow, then rubbed it against twigs and branches. Pain and fear sent her leaping forward, sideways, and straight into the air. Her short tail could not lash properly, but it jerked as hard and violently as it could while the sneezing went on.
        - id: ch01-b32
          speaker: narrator
          text: >-
            For one long minute, the lynx became still. One Eye watched. Then, without warning, she shot straight upward and gave a terrible cry. Even One Eye started, and the hair rose along his back. The lynx bounded away up the trail, crying out at every leap, until the sound faded into the distance.
        - id: ch01-b33
          speaker: narrator
          text: >-
            Only when the lynx's cries had faded away and died in the distance did One Eye dare to come out. He placed each foot delicately, as if the whole field of snow were covered with upright quills ready to pierce his soft pads. The porcupine met him with furious squeals and a clash of long teeth. It had pulled itself into a ball again, but not the firm, tight ball it had made before. Its torn muscles could no longer hold that shape. The lynx had ripped it nearly in half, and blood still flowed from the deep wound.
        - id: ch01-b34
          speaker: narrator
          text: >-
            One Eye scooped up mouthfuls of blood-soaked snow. He chewed, tasted, and swallowed. The blood served only as a first taste and made his hunger much stronger. But he had lived too long in the world to abandon caution now. He lay down and waited. The porcupine ground its teeth, grunted and sobbed, and sometimes gave a sharp little cry.
        - id: ch01-b35
          speaker: narrator
          text: >-
            After a while, the quills began to droop, and a great trembling ran through the porcupine. Suddenly the trembling stopped. Its long teeth clashed once in a final act of defiance. Then every quill sank flat, the body relaxed, and it did not move again.
        - id: ch01-b36
          speaker: narrator
          text: >-
            One Eye reached out with a nervous, shrinking paw. He stretched the porcupine to its full length and rolled it onto its back. Nothing happened. It was truly dead. He studied it for a long moment, then carefully took it in his teeth. He started down the stream, half carrying and half dragging the body, with his head turned aside so his feet would not touch the prickly hide.
        - id: ch01-b37
          speaker: narrator
          text: >-
            Then One Eye remembered something. He dropped the porcupine and trotted back to the ptarmigan. He knew exactly what to do. Without hesitating, he ate the bird. Then he returned, picked up the porcupine, and continued home.
        - id: ch01-b38
          speaker: narrator
          text: >-
            When One Eye dragged the prize of his day's hunt into the cave, the she-wolf inspected it. Then she turned her muzzle toward him and lightly licked his neck. A moment later, she warned him away from the cubs again. But this snarl was softer than the others, almost apologetic instead of threatening. Her ancient fear of the father was beginning to fade. One Eye had behaved exactly as a wolf father should. He had shown no unnatural desire to devour the young lives she had brought into the world.
