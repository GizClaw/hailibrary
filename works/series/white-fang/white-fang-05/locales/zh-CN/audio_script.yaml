audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 沉着克制，带着北国故事的冷峻张力
        timbre: 温厚清晰，略显低沉
        pace: 舒缓而有变化
        pitch: 中低
  chapters:
    - id: ch01
      title: 巢穴
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            母狼和独眼狼在印第安人的营地附近徘徊了两天。独眼狼始终忧心又警觉，母狼却像被营地吸引住了，不肯离开。直到一天早晨，近旁突然响起一声枪响。子弹击中树干，离独眼狼的脑袋只有几英寸。两头狼再不迟疑，立刻放开步子飞奔，很快就跑出好几英里，把危险甩在了身后。
        - id: ch01-b02
          speaker: narrator
          text: >-
            它们又走了两天，便不再远行。母狼急着找到一直在寻觅的东西。她身子越来越沉，已经跑不快了。有一回，她去追一只平时很容易捉到的兔子，追到一半便放弃，趴下来休息。独眼狼走过去，拿鼻吻轻碰她的脖颈，她却凶狠地一口咬来。独眼狼吓得向后跌倒，慌忙躲开她的牙齿，模样滑稽极了。她的脾气从没这么急躁过，独眼狼倒变得格外耐心，也格外体贴。
        - id: ch01-b03
          speaker: narrator
          text: >-
            后来，母狼终于找到了那个地方。那是在一条小溪上游几英里处。夏天，溪水会汇入麦肯齐河。眼下，整条溪从水面冻到岩石河床，自源头到河口，只有一片死寂的白。母狼疲惫地小跑着，独眼狼已经走到前面。她来到一面高高探出的黏土岸壁前，忽然转向那里。春日的风暴和融雪掏空了岸壁，在一道窄缝里冲出一个小洞。
        - id: ch01-b04
          speaker: narrator
          text: >-
            母狼停在洞口，把整面岸壁仔细看了一遍。她先沿着岸脚跑向一边，再折回来查看另一边，一直走到陡峭的土壁渐渐融进平缓的地势，才回来钻进窄小的入口。起初三英尺，她只能伏低身子。再往里，洞壁向两旁拓开，也逐渐升高，围出一间直径近六英尺的圆形小室。洞顶刚好高过她的头，里面干燥暖和。
        - id: ch01-b05
          speaker: narrator
          text: >-
            独眼狼已经回来，站在入口耐心等候。母狼把洞里一处处检查清楚，然后低下头，让鼻子贴近拢在身前的四足，绕着中间那一点转了几圈。她发出一声疲倦的叹息，听起来几乎像哼了一声。接着，她蜷起身子，放松四肢，面朝洞口卧倒。
        - id: ch01-b06
          speaker: narrator
          text: >-
            独眼狼竖着耳朵看她，仿佛在笑。洞外的白光勾出它的身影，蓬松的尾巴友善地摇着。母狼也把尖尖的耳朵向后贴低了一会儿，又张开嘴，安适地垂下舌头。这就是她表示欢喜和满意的方式。这个地方正合她的心意。
        - id: ch01-b07
          speaker: narrator
          text: >-
            独眼狼饿了。它趴在洞口睡下，却总是睡不安稳。它一次次醒来，竖起耳朵听着外面明亮的四月雪原。积雪下面，暗藏的流水发出细细的声音。太阳回来了，苏醒的北国都在召唤它。雪下的生命正在生长，树液向枝头涌去，嫩芽也在挣脱严霜的束缚。
        - id: ch01-b08
          speaker: narrator
          text: >-
            它焦急地看着伴侣，母狼却没有一点起身的意思。洞外，六七只雪鹀飞过眼前。独眼狼才要站起来，又回头看看她，重新伏下打盹。这时，一阵极细的嗡鸣钻进耳朵。它迷迷糊糊地用爪子拂了两次鼻子，睁眼一看，一只蚊子正在鼻尖前飞。这只长成的蚊子藏在干木头里冻了一冬，刚被阳光融醒。春天的世界实在难以抗拒，况且独眼狼还饿着肚子。
        - id: ch01-b09
          speaker: narrator
          text: >-
            它爬到母狼身旁，想劝她一同起身，只得到一声低吼。于是，独眼狼独自走进阳光。外面的雪已经变软，每一步都很费力。它改走冰封的溪床，树荫下的雪仍旧坚硬，结着晶亮的冰粒。八小时以后，它摸黑回来，比出发时还饿。它遇见了猎物，却什么也没捉到。它一次次踩破融化的雪壳，在深雪里挣扎，雪鞋兔却照旧轻轻掠过雪面。
        - id: ch01-b10
          speaker: narrator
          text: >-
            到了洞口，独眼狼突然停住，心里起了疑。洞中传来陌生而微弱的声音。那不是母狼的声音，却又有一点熟悉。它贴着肚皮小心爬进去，母狼立刻低吼着警告。独眼狼并不惊慌，但还是顺从地停在远处。那些细小、含混的呜咽和咂嘴声，仍牢牢吸引着它。
        - id: ch01-b11
          speaker: narrator
          text: >-
            母狼烦躁地把它赶开，它便蜷在洞口睡了。第二天清晨，幽暗的光渗进巢穴，独眼狼又去寻找声音的来处。这一次，母狼的警告里多了护食般的戒心。它小心地留在远处，却终于看清了。母狼两腿之间，紧贴着她的身体，藏着五小团陌生的生命。它们那么柔弱，毫无自保之力，眼睛还没有睁开，只会发出细小的呜咽。
        - id: ch01-b12
          speaker: narrator
          text: >-
            独眼狼很惊讶。它漫长而顺遂的一生中，并非头一回见到这样的事，过去已经有过许多回。可无论经历多少次，每一回仍旧像第一次那样新鲜，叫它吃惊。母狼不安地盯着它，隔一会儿就低吼一声。只要觉得它靠得太近，低吼便会从喉咙里猛地蹿起，变成尖厉的咆哮。
        - id: ch01-b13
          speaker: narrator
          text: >-
            母狼自己并不记得曾经生育过，可她的本能记得。本能中积着历代母狼的经验，也藏着一个可怕的记忆。有些父狼会吃掉自己刚出生、无法抵抗的幼崽。独眼狼并没有做过什么，可这份恐惧仍在她体内十分强烈。所以，她绝不让它靠近，仔细察看那些由它孕育的小狼。
        - id: ch01-b14
          speaker: narrator
          text: >-
            不过，幼崽没有危险。独眼狼也受到一股古老本能的驱使，那是历代父狼传下来的冲动，藏在它生命的每一丝纤维里。它不怀疑，也不琢磨，只觉得服从再自然不过。于是，它背过身去，离开刚出生的一家，沿着那条带来肉食、也维系生命的小径跑了出去。
        - id: ch01-b15
          speaker: narrator
          text: >-
            离洞穴五六英里，溪流分成两股，各自朝群山伸去。左边岔道上有一行新鲜足迹。独眼狼闻出留下足迹的野兽才刚过去，立即伏低身体，盯着足迹消失的方向。接着，它有意转入右边的岔道。那个脚印比它自己的大得多。跟在这样一头野兽身后，它分不到多少肉。
        - id: ch01-b16
          speaker: narrator
          text: >-
            再走半英里，它灵敏的耳朵听见牙齿啃咬的声音。它悄悄靠近，发现一只豪猪直立着靠在树上，正在啃试树皮。独眼狼谨慎地走过去，心里却没抱多少希望。它认得这种动物，只是从未在这么北的地方见过。活了这么多年，也从没哪只豪猪成为它的一顿饭。但它早就明白，世上有偶然，也有机会。只要面对的是活物，事情便不会每次都照着同一种方式发生，总可能冒出意料之外的变化。
        - id: ch01-b17
          speaker: narrator
          text: >-
            豪猪立刻蜷成圆球，长而尖的刺指向四面八方。独眼狼年轻时，也曾凑近一个看似不动的刺球。豪猪的尾巴猛地抽中它的脸，一根刺在鼻吻里留了好几个星期，像火一样疼，最后才掉出来。有过这番教训，它舒舒服服地伏下，把鼻子留在一英尺外，也躲开尾巴能够扫到的地方。
        - id: ch01-b18
          speaker: narrator
          text: >-
            独眼狼纹丝不动地等着。说不定豪猪会舒展开来，说不定它能抓住机会，用爪子撕开毫无遮蔽的柔软肚腹。可是半小时过去，刺球还是不动。独眼狼恼怒地朝它低吼，站起身继续赶路。过去，它已经白等过太多次，不能再把时间耗在这里。白昼渐渐过去，这场狩猎仍旧毫无收获。
        - id: ch01-b19
          speaker: narrator
          text: >-
            刚刚苏醒的父性本能催促着独眼狼。它必须找到肉。午后，它意外遇见一只雷鸟。它走出灌木丛，和那只迟钝的鸟打了个照面。雷鸟栖在倒木上，离它鼻尖不到一英尺。双方刚看清对方，受惊的鸟儿便飞起来。独眼狼一爪将它拍落，又扑向贴着雪面仓皇奔逃、还想再次起飞的雷鸟，一口把它咬住。
        - id: ch01-b20
          speaker: narrator
          text: >-
            细嫩的血肉和脆弱的骨头在牙齿间碎裂，独眼狼本能地吃了起来。可它忽然想起洞穴里的家，于是叼着雷鸟转身回去。
        - id: ch01-b21
          speaker: narrator
          text: >-
            离岔道一英里，它再次看见早晨那串大脚印留下的新痕迹。足迹正顺着归途延伸，它便跟了上去。它依旧用柔软的脚掌悄然奔跑，像一道滑过雪地的影子。小径每出现一段新景象，它都先仔细探看，准备好在下一处转弯遇见留下脚印的野兽。
        - id: ch01-b22
          speaker: narrator
          text: >-
            到了一处格外宽阔的弯道，独眼狼从岩角后探出头，一看清前方，立刻伏倒。留下脚印的是一只巨大的雌猞猁。她像独眼狼早些时候一样伏着，面前正是那个紧紧蜷起的刺球。先前，独眼狼还是一道影子。现在，它成了影子的幽灵。它悄然绕过这两个静止的对手，从下风处接近，免得气味飘过去。
        - id: ch01-b23
          speaker: narrator
          text: >-
            它把雷鸟放在身边，伏进雪里，透过低矮云杉的针叶，望着这场生命的角逐。猞猁在等，豪猪也在等，双方都只想活下去。猞猁要活，便得吃掉豪猪。豪猪要活，便不能被她吃掉。藏在暗处的独眼狼也有自己的角色。它等待一次古怪的偶然，好让自己重新走上寻找肉食的路。
        - id: ch01-b24
          speaker: narrator
          text: >-
            半小时过去，又过了整整一小时，仍然没有动静。刺球像一块石头，猞猁像冻成了大理石，独眼狼也像死在云杉下面。可三只动物的神经全都绷得发痛。它们看似已经石化，却从没有哪一刻比此时更强烈地活着。就算往后还有漫长的一生，这样的时刻也不会有几次。
        - id: ch01-b25
          speaker: narrator
          text: >-
            独眼狼轻轻动了一下，更急切地向外看。事情终于有了变化。豪猪以为敌人已经离开，开始一点点解开牢不可破的铠甲。它没有激动得发抖，只是极慢、极慢地把刺球舒展开来，拉长身体。眼看活生生的肉像一席饭菜铺在面前，独眼狼嘴里一阵湿润，馋涎不由得流了下来。
        - id: ch01-b26
          speaker: narrator
          text: >-
            豪猪还没完全展开，就发现了敌人。猞猁在那一瞬出手，快得像一道闪光。她把弯钩般的硬爪探到柔软的肚腹下面，猛地向后一扯。要是豪猪已经完全伸开，或者再晚一点发现敌人，猞猁的爪掌本能安然收回。偏偏就在爪子撤走时，豪猪的尾巴向旁一甩，把尖刺扎了进去。
        - id: ch01-b27
          speaker: narrator
          text: >-
            扑击、反击、豪猪痛苦的尖叫，还有大猫又疼又惊的号叫，全在同一刹那爆发。独眼狼兴奋得半站起来，双耳高竖，笔直的尾巴在身后颤动。猞猁的暴脾气占了上风，凶狠地扑向伤害她的豪猪。豪猪几乎被撕成两半，一面尖叫哼哼，一面无力地想蜷回刺球。它又一次甩出尾巴，猞猁也再次疼得惊叫。
        - id: ch01-b28
          speaker: narrator
          text: >-
            猞猁打着喷嚏向后退，鼻子竖满尖刺，像一个大得吓人的针插。她拿爪子去擦，想把那些火辣辣的尖刺弄掉。她又把鼻子扎进雪里，在细枝和树枝上来回摩擦。疼痛和恐惧逼得她向前、向旁乱跳，还不断蹿上蹿下。她短短的尾巴无法真正抽打，只能拼命地迅猛抖动，喷嚏始终没有停下。
        - id: ch01-b29
          speaker: narrator
          text: >-
            闹腾一阵后，猞猁安静了长长一分钟。独眼狼盯着她。忽然，她毫无预兆地笔直跃起，发出一声漫长而可怕的号叫。就连独眼狼也吓得一颤，背毛顿时竖起。猞猁沿小径逃走，每跳一步就号叫一声，声音终于消失在远方。
        - id: ch01-b30
          speaker: narrator
          text: >-
            等猞猁的号叫在远处减弱，彻底消失，独眼狼才敢出来。它小心落下每一只脚，仿佛整片雪地都插满了朝上的豪猪刺，等着扎进柔软的足垫。豪猪用愤怒的尖叫和长牙的撞击声迎接它。豪猪虽然重新蜷起，却已经无法缩成从前那样紧密结实的圆球。肌肉撕裂得太厉害，它几乎断成两半，还在不停流血。
        - id: ch01-b31
          speaker: narrator
          text: >-
            独眼狼一口口铲起染血的雪，慢慢咀嚼，仔细尝过滋味，再咽下去。这点血腥味仿佛一道开胃小菜，只让它更加饥饿。不过，它在世上活得够久了，不会因为饿就丢掉警惕。它仍旧伏在雪地上耐心等待。豪猪嘎吱嘎吱地磨着牙，哼叫，呜咽，偶尔发出一声短促的尖叫。不久，尖刺垂了下来，身体开始剧烈发抖。颤抖突然停止，长牙最后挑衅般撞了一下。接着，所有尖刺彻底伏倒，身体松弛下来，再也不动了。
        - id: ch01-b32
          speaker: narrator
          text: >-
            独眼狼紧张地缩着爪子，试探着把豪猪拉直，又翻到肚皮朝上。什么也没发生。豪猪确实已经死了。它仍专注地察看了好一会儿，确认毫无危险，才用牙小心咬住，一半叼、一半拖着往溪流下游走。它把头歪向旁边，以免脚掌碰到满身尖刺。
        - id: ch01-b33
          speaker: narrator
          text: >-
            走了一阵，独眼狼想起一件事。它放下豪猪，跑回丢下雷鸟的地方。它很清楚该怎么办，没有丝毫犹豫，立刻把雷鸟吃掉。然后，它回去叼起重担，继续回家。
        - id: ch01-b34
          speaker: narrator
          text: >-
            独眼狼终于把一整天狩猎得来的豪猪拖进洞里。母狼先仔细察看这份猎物，又转过鼻吻，轻轻舔了一下它的脖颈。下一刻，她仍低吼着警告它远离幼崽，可这声低吼温和了许多，听来歉意多过威胁。她对幼崽父亲的本能恐惧正在一点点消退。独眼狼做了一头父狼该做的事，也没有显出任何邪恶的欲望，要去吞吃她带到世上的幼小生命。
