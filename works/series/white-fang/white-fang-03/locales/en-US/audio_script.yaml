  chapters:
    - id: ch01
      title: THE HUNGER CRY
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            The day began well. No dogs had vanished during the night, and the men set out in fairly good spirits. Once more they moved along the trail and into the silence, darkness, and cold. Bill seemed to have forgotten all his gloomy warnings from the night before. At midday, when the dogs overturned the sled on a rough stretch of trail, he was cheerful enough to joke with them about it.
        - id: ch01-b02
          speaker: narrator
          text: >-
            The accident left them in a terrible tangle. The sled lay upside down, wedged between a tree trunk and a huge rock. Before the men could free it, they had to unharness the dogs. Henry and Bill were bent over the load, trying to turn it upright, when Henry noticed One Ear slipping away.
        - id: ch01-b03
          speaker: henry
          text: Hey! One Ear, get back here!
        - id: ch01-b04
          speaker: narrator
          text: >-
            One Ear ran across the snow with his loose traces dragging behind. The she-wolf was waiting out on the trail they had just traveled. As the dog came near, he suddenly grew careful. He slowed to tiny, watchful steps, then stopped. He looked at her with doubt and desire. She showed her teeth as if she were smiling, not threatening him. She stepped toward him playfully, then waited. One Ear moved closer with his head high, his ears and tail raised, but he stayed alert.
        - id: ch01-b05
          speaker: narrator
          text: >-
            He tried to touch noses with her, but she drew away in a teasing, playful way. Each time he advanced, she retreated the same distance. Step by step, she led him farther from the safety of his human companions. Once, some faint warning seemed to pass through his mind. He turned his head and looked back at the overturned sled, the other dogs, and the two men calling him to return.
        - id: ch01-b06
          speaker: narrator
          text: >-
            Then the she-wolf came close and touched noses with him for one quick instant. When she slipped away again, One Ear followed, and the warning was forgotten.
        - id: ch01-b07
          speaker: narrator
          text: >-
            Meanwhile, Bill remembered the rifle. It was trapped beneath the overturned sled, so he could not reach it until Henry helped him lift the whole load upright. By then, One Ear and the she-wolf were running too close together, and both were too far away. Bill could not fire without risking a shot into his own dog.
        - id: ch01-b08
          speaker: narrator
          text: >-
            One Ear understood his mistake too late. The men saw him turn and race back before they saw what had frightened him. Then they spotted a dozen lean gray wolves bounding across the snow at a right angle to the trail. The pack was cutting off his way to the sled. The she-wolf stopped playing at once. With a snarl, she sprang at One Ear. He knocked her aside with his shoulder. Since the direct path was blocked, he changed course and began a wide circle, still trying desperately to reach the men. More wolves appeared with every moment and joined the chase. The she-wolf stayed only one leap behind him without losing ground.
        - id: ch01-b09
          speaker: henry
          text: Where are you going?
        - id: ch01-b10
          speaker: narrator
          text: Henry caught Bill by the arm, but Bill pulled free.
        - id: ch01-b11
          speaker: bill
          text: >-
            I can't just watch this. If there's anything I can do, they won't take another one of our dogs.
        - id: ch01-b12
          speaker: narrator
          text: >-
            Bill gripped the rifle and plunged into the brush beside the trail. One Ear was circling the sled, and Bill meant to cut across that circle ahead of the pack. In broad daylight, the rifle might frighten the wolves away and save the dog.
        - id: ch01-b13
          speaker: henry
          text: Bill! Be careful! Don't risk your life!
          emotion: fearful
        - id: ch01-b14
          speaker: narrator
          text: >-
            Henry sat on the sled and watched because there was nothing else he could do. Bill had already vanished into the brush. Now and then Henry caught sight of One Ear as the dog appeared and disappeared between the thickets and scattered spruce trees. His chance looked hopeless. One Ear fully understood his danger, but he ran around the outside of the circle while the pack ran along the shorter inside path. He could never outrun them far enough to cut across their circle in front and regain the sled before they reached him.
        - id: ch01-b15
          speaker: narrator
          text: >-
            Their paths were closing fast. Somewhere beyond the trees and thickets, Bill, One Ear, and the wolves were all coming together. It happened sooner than Henry expected. One shot rang out, then two more in quick succession. Bill had used every cartridge. A storm of snarls and yelps followed. Henry knew One Ear's cry of pain and terror. He also heard the cry of a wounded wolf. Then the snarling stopped, the yelps faded, and silence returned to the lonely land.
        - id: ch01-b16
          speaker: narrator
          text: >-
            Henry remained on the sled for a long time. There was no reason to go through the trees and look. He knew what had happened as clearly as if it had taken place before his eyes. Once he jerked out of his thoughts and hurriedly pulled the axe from under the sled lashings. Even then, he did not rise. He sat brooding again for a long while, with the two remaining dogs crouched at his feet and trembling.
        - id: ch01-b17
          speaker: narrator
          text: >-
            At last Henry rose, weary and emptied of strength. He harnessed the dogs, put a pulling rope over his own shoulder, and hauled beside them. He did not travel far. At the first sign of darkness, he hurried to make camp and gathered a great supply of firewood. He fed the dogs, cooked and ate his supper, and spread his bed close to the flames.
        - id: ch01-b18
          speaker: narrator
          text: >-
            He never got to enjoy it. Before he could close his eyes, the wolves came too near for safety. They formed a tight circle around him and the fire. In the firelight, he could plainly see them lying down, sitting up, crawling on their bellies, or slipping back and forth. Some even slept, curled in the snow like dogs, while Henry had no chance to sleep at all.
        - id: ch01-b19
          speaker: narrator
          text: >-
            He kept the fire blazing. It was the only thing between his living body and their hungry teeth. His two dogs pressed against him, one on each side. They cried and whimpered, and whenever a wolf crept closer, they snarled desperately. At once the whole ring stirred. The wolves rose and pressed forward, snarling and yelping with hunger. Then they settled again, and a few returned to their broken sleep.
        - id: ch01-b20
          speaker: narrator
          text: >-
            Yet the circle never stopped closing. Bit by bit, an inch at a time, one wolf here and another there crawled nearer on its belly. The ring narrowed until the animals were almost close enough to spring at Henry. Then he would snatch burning wood from the fire and fling it among them. The wolves always jumped back in a rush. When a well-aimed brand struck and scorched one of the boldest, it answered with frightened snarls and angry yelps.
        - id: ch01-b21
          speaker: narrator
          text: >-
            Morning found Henry haggard, exhausted, and wide-eyed from missing sleep. He cooked breakfast while it was still dark. At nine, when full daylight finally drove the pack back, he began the work he had planned through the long night. He cut young trees and lashed them high across the trunks of standing trees to make a raised platform. Then he used the sled lashing as a hauling rope. With the dogs pulling beside him, he lifted the coffin all the way to the top.
        - id: ch01-b22
          speaker: henry
          text: >-
            They got Bill, and they may get me. But they'll never get you, young man.
        - id: ch01-b23
          speaker: narrator
          text: >-
            Henry left the dead man safe in his resting place among the trees. Then he took the trail again. With its load lighter, the sled bounded behind the two willing dogs. They also knew their only safety was out in the open direction of Fort McGurry. The wolves no longer hid their pursuit. They trotted steadily behind and ranged along both sides of the trail. Their red tongues hung out, and their ribs rose and fell beneath lean hides with every step. They were little more than skin stretched over bony frames, with muscles like thin cords. Henry could not understand how creatures so starved still kept their feet instead of collapsing into the snow.
        - id: ch01-b24
          speaker: narrator
          text: >-
            He did not dare keep traveling until darkness. At midday the sun warmed the southern sky, and its pale golden upper rim even rose above the horizon. Henry welcomed it as a hopeful sign. The days were lengthening. The sun was returning. But the moment its cheerful light disappeared, he made camp. Several hours of gray daylight and gloomy twilight remained, and he spent every one of them chopping an enormous supply of firewood for the night ahead.
        - id: ch01-b25
          speaker: narrator
          text: >-
            Night brought terror again. The starving wolves grew bolder, and Henry's sleeplessness began to overpower him. He dozed beside the fire with blankets around his shoulders and the axe between his knees. A dog pressed close on either side. Once he woke to see a huge gray wolf less than twelve feet away. As Henry watched, it stretched like a lazy dog. Then it yawned in his face and looked at him as if he were nothing more than a meal that had been delayed.
        - id: ch01-b26
          speaker: narrator
          text: >-
            The rest of the pack seemed just as certain that their meal would come. Henry counted twenty wolves. Some stared at him hungrily while others slept calmly in the snow. They reminded him of children gathered around a table covered with food, all waiting for permission to begin. But here Henry himself was the food on the table. He could not stop wondering when the meal would begin, or how the wolves would begin it.
        - id: ch01-b27
          speaker: narrator
          text: >-
            While he fed the fire, Henry began to value his own body in a way he never had before. He watched his muscles move. In the firelight, he bent his fingers one by one, then all together. He spread them wide, closed them quickly, studied the nails, and pressed the fingertips to feel their delicate nerves. This living flesh worked so smoothly that it fascinated him. He had become deeply fond of it.
        - id: ch01-b28
          speaker: narrator
          text: >-
            Then he looked at the circle of wolves waiting around him, and the truth struck him like a blow. To those starving animals, his wonderful body and all its living flesh were only meat. Their hungry teeth would tear and slash it apart. His body would feed them in the same way that the bodies of moose and rabbits had so often fed him.
        - id: ch01-b29
          speaker: narrator
          text: >-
            He woke from a half-nightmare and found the red she-wolf sitting six feet away. His dogs whimpered and snarled, but she ignored them. She only watched Henry, and he watched her. She did not threaten him. Her look seemed full of longing, but he knew that longing came from terrible hunger. He was food to her. The sight of him made her mouth open. Saliva ran from it, and she licked her jaws as if she could already taste him.
        - id: ch01-b30
          speaker: narrator
          text: >-
            A sudden wave of fear passed through Henry. He reached quickly for a burning brand to throw at her. Before his fingers could close around the wood, she jumped safely away. Henry knew then that she was used to having things thrown at her. As she sprang back, she bared her white teeth down to their roots and snarled. Her hungry longing vanished at once. In its place was such savage hatred that Henry shuddered.
        - id: ch01-b31
          speaker: narrator
          text: >-
            He stared at the hand gripping the brand. Its clever fingers fitted themselves over, under, and around every rough place in the wood. One little finger had settled too near the burning end. It felt the painful heat and moved by itself to a cooler place without Henry having to think. At that same instant, he imagined those sensitive, delicate fingers crushed and torn by the she-wolf's white teeth. Never had he felt so fond of his own body as he did now, when his right to keep it had become so uncertain.
        - id: ch01-b32
          speaker: narrator
          text: >-
            All night he fought the hungry pack with burning brands. Whenever sleep took him in spite of everything, the dogs' whimpers and snarls brought him awake. Morning came, but for the first time daylight did not scatter the wolves. Henry waited for them to leave, but they stayed in a circle around him and his fire. They watched with the bold confidence of animals who believed both already belonged to them. The courage that morning light had always given him began to fail.
        - id: ch01-b33
          speaker: narrator
          text: >-
            Henry made one desperate try to return to the trail. The instant he stepped away from the fire, the boldest wolf leaped. It fell short, and Henry sprang back as its jaws snapped only six inches from his thigh. The whole pack surged toward him. He had to throw burning wood in every direction before they moved back.
        - id: ch01-b34
          speaker: narrator
          text: >-
            Even in daylight, Henry did not dare leave the fire to chop fresh wood. A great dead spruce towered only twenty feet away, but the wolves held the ground between. He spent half the day slowly extending the campfire until it reached the tree. At every moment he kept half a dozen burning sticks ready to fling at his enemies. When he finally reached the spruce, he studied the trees around it and planned how to make it fall toward the greatest supply of firewood.
        - id: ch01-b35
          speaker: narrator
          text: >-
            The next night repeated the one before, except that Henry's need for sleep had become almost impossible to resist. The dogs snarled constantly now, so their warnings no longer woke his numb, drowsy mind. He started awake and found the she-wolf less than a yard away. Without letting go of the brand, he drove its burning end straight into her open, snarling mouth.
        - id: ch01-b36
          speaker: narrator
          text: >-
            She sprang away with a cry of pain. This time Henry took pleasure in the smell of scorched hair and flesh. From twenty feet away, the she-wolf shook her head again and again and growled at him with fury.
        - id: ch01-b37
          speaker: narrator
          text: >-
            Before he let himself doze again, Henry tied a burning knot of pine to his right hand. His eyes had been closed only a few minutes when its flame burned his flesh and woke him. For several hours he followed the same plan. Each time the heat brought him awake, he drove the wolves back with flying brands, built the fire high again, and moved the pine knot to a new place on his hand. The plan worked until at last he tied the knot too loosely. As soon as his eyes closed, it slipped away from him.
        - id: ch01-b38
          speaker: narrator
          text: >-
            Henry dreamed he was safe at Fort McGurry. The room was warm and comfortable, and he sat playing cribbage with the Factor. Wolves had surrounded the fort and were howling at the very gates. Every so often, Henry and the Factor paused in their game to listen. Then they laughed at the wolves' useless attempts to break in. Suddenly there was a crash. The door burst open, and wolves poured into the large living room. They leaped straight toward Henry and the Factor. Their howling became tremendous. The strange dream began to change into something else, but that terrible sound followed Henry through it.
        - id: ch01-b39
          speaker: narrator
          text: >-
            Henry woke and found that the howling was real. A great storm of snarls and yelps surrounded him. The wolves were rushing at him from all sides. One animal's teeth had already closed on his arm. By instinct he leaped straight into the fire. As he jumped, another set of teeth slashed through the flesh of his leg. Then the fight became a battle with fire. His thick mittens protected his hands for a little while as he scooped up live coals and hurled them in every direction. The quiet campfire suddenly erupted like a volcano.
        - id: ch01-b40
          speaker: narrator
          text: >-
            He could not stay in the heart of the fire for long. The heat blistered his face and burned away his eyebrows and lashes. Soon his feet could hardly bear it. Holding a flaming brand in each hand, he jumped to the edge of the fire and saw that the wolves had drawn back. All around him, the live coals he had thrown were hissing in the snow. Every so often, a retreating wolf stepped on one and leaped wildly away with a snort and snarl.
        - id: ch01-b41
          speaker: narrator
          text: >-
            Henry threw both brands at the nearest wolves. Then he pushed his smoking mittens into the snow and stamped his feet to cool them. His two dogs were gone. He knew they had become another course in the long meal that began with Fatty days ago. If the wolves succeeded, Henry himself would be the final course.
        - id: ch01-b42
          speaker: henry
          text: You haven't got me yet!
          emotion: angry
        - id: ch01-b43
          speaker: narrator
          text: >-
            Henry shook his fist fiercely. His voice stirred the whole pack, and a general snarl rose around him. The she-wolf slid close over the snow and watched him with that hungry, longing look.
        - id: ch01-b44
          speaker: narrator
          text: >-
            Then Henry began carrying out a new idea. He spread the campfire until it made one large circle around him. Inside it, he crouched on his sleeping gear to protect himself from the melting snow. Once he disappeared behind that shelter of flame, the whole pack came curiously to the rim to see where he had gone. Until now, the fire had always kept them at a distance. They settled into a tight ring like so many dogs, blinking, yawning, and stretching their lean bodies in the warmth they had never been allowed to enjoy.
        - id: ch01-b45
          speaker: narrator
          text: >-
            The she-wolf sat down, lifted her nose toward a star, and began to howl. One wolf after another joined her. Soon the whole pack sat with noses raised to the sky, howling its hunger cry.
        - id: ch01-b46
          speaker: narrator
          text: >-
            Dawn arrived, and then full daylight. Henry's fire was burning low because every piece of fuel was gone. He needed more wood, so he tried to step outside the circle. At once the wolves surged forward to meet him. Burning brands made them jump aside, but now they refused to stay back. Henry tried again and again, and every attempt to drive them away failed. At last he gave up and stumbled inside the circle. A wolf leaped after him. It missed Henry and landed with all four feet among the coals. Crying and snarling in terror, it scrambled back to cool its burned paws in the snow.
        - id: ch01-b47
          speaker: narrator
          text: >-
            Henry sat down on his blankets and folded himself into a crouch. His body sagged forward from the hips, his shoulders hung loose and low, and his head rested on his knees. Every part of him showed that he had given up the fight. Now and then he raised his head to watch the dying fire. The circle of flame and coals was breaking into separate pieces, with open spaces between them. Those spaces grew wider and wider while the burning pieces became smaller.
        - id: ch01-b48
          speaker: henry
          text: >-
            I suppose you can come and take me whenever you want. I'm going to sleep now.
          emotion: sad
        - id: ch01-b49
          speaker: narrator
          text: >-
            Once Henry woke and saw the she-wolf directly in front of him, staring through an opening in the broken circle of fire.
        - id: ch01-b50
          speaker: narrator
          text: >-
            He woke again a little later, though it felt like hours. Something had changed so completely that he came fully awake. At first he could not understand it. Then he saw that the wolves were gone. Only the trampled snow showed how closely they had surrounded him. Sleep rose over him again, and his head was sinking toward his knees when he suddenly jerked upright.
        - id: ch01-b51
          speaker: narrator
          text: >-
            Men were shouting. Sleds churned through the snow, harnesses creaked, and straining dogs whimpered eagerly. Four sleds climbed from the riverbed and pulled into the camp among the trees. Half a dozen men gathered around Henry, who still crouched in the center of his dying fire. They shook him and prodded him, trying to bring him back to consciousness. Henry stared at them like a drunken man who could not understand what he saw. Then strange, broken, sleepy words began to wander from his mouth.
        - id: ch01-b52
          speaker: henry
          text: >-
            Red she-wolf... She came among the dogs at feeding time... First she ate their food... then she ate the dogs... and then she ate Bill...
        - id: ch01-b53
          speaker: rescuer
          text: Where is Lord Alfred?
        - id: ch01-b54
          speaker: narrator
          text: One rescuer shouted into Henry's ear and shook him hard. Henry slowly moved his head.
        - id: ch01-b55
          speaker: henry
          text: >-
            No, she didn't eat him... He's sitting up in a tree at our last camp.
        - id: ch01-b56
          speaker: rescuer
          text: Is he dead?
        - id: ch01-b57
          speaker: henry
          text: >-
            And he's in a box. Now leave me alone... I'm completely worn out... Good night, everybody.
        - id: ch01-b58
          speaker: narrator
          text: >-
            Henry pulled his shoulder away from the rescuer's grip. His eyelids fluttered shut, and his chin fell to his chest. Even while the men lowered him onto the blankets, his snores rose into the frosty air.
        - id: ch01-b59
          speaker: narrator
          text: >-
            But another sound came from far away. Faint in the distance, the hungry wolf-pack cried as it followed the trail of different meat, leaving behind the man it had almost taken.
