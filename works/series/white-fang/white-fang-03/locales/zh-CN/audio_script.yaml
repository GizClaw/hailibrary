audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 沉着克制，带着北国故事的冷峻张力
        timbre: 温厚清晰，略显低沉
        pace: 舒缓而有变化
        pitch: 中低
    bill:
      display_name: 比尔
      tts:
        delivery: 粗直敏感，疲惫中渐渐透出不安
        timbre: 粗粝结实
        pace: 中速，担忧时稍慢
        pitch: 中低
    henry:
      display_name: 亨利
      tts:
        delivery: 务实强硬，常用挖苦压住恐惧
        timbre: 稳健有力
        pace: 中速利落
        pitch: 中
    rescuer:
      display_name: 救援者
      tts:
        delivery: 急切直接，嗓门洪亮
        timbre: 粗犷清楚
        pace: 稍快
        pitch: 中低
  chapters:
    - id: ch01
      title: 独耳的末路
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 这一天开头不错。夜里一条狗也没丢。队伍踏上雪道，走进寂静、黑暗和严寒时，心情还算轻松。比尔像是忘了昨晚的不祥预感。中午，雪橇在一段坏路上翻倒，他还有心思拿狗开玩笑。
        - id: ch01-b02
          speaker: narrator
          text: 场面乱得很棘手。雪橇底朝天，正好卡在一根树干和一块巨石之间。要把纠缠在一起的东西理顺，两个人只得先解开所有狗的挽具，再弯下腰，一起设法把雪橇扶正。就在两人忙着用力的时候，亨利抬眼看见独耳侧着身子，正悄悄离开狗群。
        - id: ch01-b03
          speaker: henry
          text: 喂，独耳！回来！
        - id: ch01-b04
          speaker: narrator
          text: 独耳没有回来。它拖着挽索跑过雪地，奔向来路上等候的母狼。快到跟前时，它倒谨慎起来，放慢脚步，一步一步小心试探，最后停在她面前。它既疑惑，又被她吸引。母狼露出牙齿，像在冲它微笑，那模样更像讨好，没有一点威吓。她顽皮地上前几步，又站住了。独耳昂着头，竖起耳朵和尾巴，继续向她靠近。
        - id: ch01-b05
          speaker: narrator
          text: 独耳想和她碰碰鼻子，她却娇羞地退开。独耳进一步，她就退一步，一点点把它引离人类的保护。有一回，独耳似乎察觉了危险。它回头看看翻倒的雪橇、狗伙伴，还有呼喊自己的两个男人。
        - id: ch01-b06
          speaker: narrator
          text: 可母狼又迎上去，飞快地和它碰了一下鼻子。独耳心里刚冒出的警告立刻散了。它再次追来，母狼也再次退开。比尔这才想起步枪，可枪压在雪橇下面。等雪橇扶正，独耳和母狼已经贴得太近，离他们又太远，根本不能冒险开枪。
        - id: ch01-b07
          speaker: narrator
          text: 独耳终于明白自己错了，可已经太迟。两个男人先看到它突然转身，拼命往回跑，这才看见十来只精瘦的灰狼从雪道侧面冲来，切断了退路。母狼的娇羞和顽皮一下消失。她低吼着扑向独耳，独耳用肩头把她撞开。回去的路已经被堵住，它却仍想逃回雪橇，只能改变方向，试着绕一个大圈。越来越多的狼出现，加入追逐。母狼一直跟在它身后一跃之遥，半步也没有落下。
        - id: ch01-b08
          speaker: henry
          text: 你要去哪儿？
        - id: ch01-b09
          speaker: narrator
          text: 亨利抓住比尔的胳膊，比尔却甩开了他。
        - id: ch01-b10
          speaker: bill
          text: 我不能眼睁睁看着。只要还有办法，就不能让它们再叼走一条狗。
        - id: ch01-b11
          speaker: narrator
          text: 比尔提枪钻进雪道边的灌木。独耳正绕着雪橇跑一个大圈，他想提前截到那个圆上。大白天里，手上又有枪，也许他能吓退狼群，把狗救回来。
        - id: ch01-b12
          speaker: henry
          text: 比尔，小心！千万别拿命冒险！
          emotion: fearful
        - id: ch01-b13
          speaker: narrator
          text: 亨利只能坐在雪橇上看着。比尔已经消失。独耳还不时出现在灌木和云杉丛之间，又一闪不见。亨利知道它没有活路了。狗跑的是外圈，狼群跑的是更短的内圈。独耳不可能先甩开追兵，再横穿内圈逃回来。
        - id: ch01-b14
          speaker: narrator
          text: 几路奔跑的轨迹正在迅速聚到一点。狼群、独耳和比尔，就要在林木遮住的那片雪地里撞到一起。亨利虽然看不见那里，却清楚知道正在发生什么。事情来得比他预料的快得多。突然，一声枪响传来，紧跟着又是两声。三发子弹全打完了。随后响起一大片低吼和尖嗥。亨利听出了独耳因痛苦和恐惧发出的惨叫，也听见一头受伤的狼在嗥叫。接着，低吼停了，尖嗥也渐渐消失。荒原重新陷入寂静。
        - id: ch01-b15
          speaker: narrator
          text: 亨利久久坐在雪橇上。他不用去看，也知道发生了什么。有一回，他猛地惊醒，连忙从绑索下抽出斧头。可他仍然坐着，满心阴郁。仅剩的两条狗蜷在脚边，不停发抖。
    - id: ch02
      title: 一个人的营火
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 终于，亨利疲惫地站了起来，仿佛身体里再也没有一点弹回去的力气。他把两条狗重新套好，又把供人拉橇的绳索搭上自己的肩，和它们一起向前拉。队伍没有走出多远。天色刚露出变暗的迹象，他便赶紧停下扎营，先备足大堆柴火。然后，他喂过狗，煮好自己的晚饭，吃完以后，才把铺盖紧贴着火堆放下。
        - id: ch02-b02
          speaker: narrator
          text: 可他根本睡不成。眼睛还没有合上，狼群就已经围住营火，而且靠得很近。如今，他不用费力张望也能看清它们。火光里，有的狼趴着，有的坐着，有的贴着肚皮向前爬，有的来回潜行。它们甚至就在他眼前睡了起来。这里一只，那里一只，像狗一样蜷在雪上。狼能睡，亨利却不能。
        - id: ch02-b03
          speaker: narrator
          text: 他让火一直烧得很旺，因为他知道，隔开自己的血肉和饥饿獠牙的，只有这堆火。两条狗守在身旁，一边一条，紧紧靠着他寻求保护，不停地哀鸣、呜咽。只要有狼比平时更靠近一些，它们就绝望地低吼。整个狼圈马上骚动起来。群狼纷纷站起，试探着往前挤，四周同时响起低吼和急切的尖嗥。过一会儿，狼圈又会全部趴下，有些被打断好梦的狼还会继续刚才的睡眠。
        - id: ch02-b04
          speaker: narrator
          text: 狼圈却始终在缩小。一寸又一寸，这里一只狼贴着肚皮挪近，那里又一只悄悄爬来，直到它们几乎一跃就能扑到亨利身上。他只能不断抓起燃烧的木柴扔出去。群狼慌忙后退。要是火棍击中某个大胆的家伙，四周便会响起愤怒的尖叫和受惊的低吼。
        - id: ch02-b05
          speaker: narrator
          text: 清晨，亨利已经熬得憔悴不堪，两眼因彻夜未眠而圆睁着。他在黑暗中做了早饭。九点天亮，狼群终于退开。他立刻实行整夜盘算的计划。他砍下几棵幼树，把它们当作横木，高高绑在几棵大树的树干之间，搭成一座架子。接着，他拿捆雪橇的绳索当吊绳，再借上两条狗的力气，一点点把棺材吊到架子顶上。
        - id: ch02-b06
          speaker: henry
          text: 狼吃了比尔，也许还会吃掉我。可你呢，年轻人，它们绝对吃不到。
        - id: ch02-b07
          speaker: narrator
          text: 他把话说给树上棺材里的死者听，然后重新赶路。雪橇轻了，在两条卖力的狗身后跳跃。狗也知道，只有尽快赶到麦格里堡的开阔地带才安全。
        - id: ch02-b08
          speaker: narrator
          text: 狼群不再躲藏。它们从容地小跑在后面，也沿着道路两侧奔跑，红舌垂在嘴外。随着每一步起落，一根根肋骨都在瘦削的身体上清晰浮动。那些狼饿得只剩一层皮蒙着骨架，肌肉细得像一根根绳索。它们竟然还能用脚站着，没有立刻倒进雪里，亨利都觉得不可思议。
        - id: ch02-b09
          speaker: narrator
          text: 他不敢走到天黑。中午，太阳温暖了南方地平线，还把苍白金黄的一小道上缘探到天际之上。这是个好兆头。白昼在变长，太阳就要回来了。可那一点光刚消失，亨利便停下扎营。灰白的天光和阴沉暮色还没用尽，他抓紧时间，砍下了堆积如山的柴。
        - id: ch02-b10
          speaker: narrator
          text: 黑夜又带来恐怖。狼越来越大胆，睡意也越来越沉。亨利裹着毯子，蹲在火边。斧头夹在膝间，两条狗紧靠两侧，他还是打起了瞌睡。一次醒来，一头大灰狼就在前方不到十二英尺的地方。它是狼群里最大的一头，竟像懒狗一样，当着亨利的面伸懒腰、打呵欠。它看他的眼神像在说，这不过是一顿晚了一点的饭，马上就能吃到了。
        - id: ch02-b11
          speaker: narrator
          text: 整个狼群都是同样笃定。亨利数得出至少二十头。有的饿着肚子盯住他，有的安稳地睡在雪上。它们就像一群围着丰盛餐桌的孩子，只等有人准许，便要开始吃饭。而亨利自己，就是桌上的食物。他忍不住去想，这顿饭究竟会怎样开始，又会在什么时候开始。
    - id: ch03
      title: 血肉与獠牙
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 亨利往火里添柴时，忽然珍爱起自己的身体，这是过去从没有过的。他看着肌肉随着动作起伏，又借着火光，慢慢弯起手指。一会儿一根接一根，一会儿全部收拢。他把手指张到最开，又飞快做出抓握的动作。他端详指甲的形状，再轻轻或用力戳着指尖，细细分辨神经传来的感觉。这身血肉的运转如此优美、顺畅又精细，他看得入迷，也一下对它生出深深的喜爱。
        - id: ch03-b02
          speaker: narrator
          text: 可他一抬头，又看见满怀期待的狼群。一个念头重重击中了他。这具奇妙的身体，在它们眼里只是肉。獠牙会把它撕开、咬碎。狼会吃掉他，正像他过去吃掉驼鹿和兔子。
        - id: ch03-b03
          speaker: narrator
          text: 他从半是噩梦的瞌睡中惊醒，发现红色母狼正坐在六英尺外，渴盼地望着他。两条狗在脚边呜咽低吼，她连看都不看。她只盯着亨利。她没有做出威胁的样子，可他知道，那份渴盼就是饥饿。他是食物。母狼看着他，嘴巴张开，口水淌下来，还满怀期待地舔了舔嘴。
        - id: ch03-b04
          speaker: narrator
          text: 恐惧猛地穿过亨利全身。他伸手去抓火棍，手指还没合拢，母狼已经退到安全的地方。她显然很熟悉别人扔来的东西。她跳开时龇出雪白的牙，渴盼一下变成食肉野兽的凶恶，叫亨利浑身发抖。
        - id: ch03-b05
          speaker: narrator
          text: 他低头看着握住火棍的手。手指精巧地扣住木头，顺着粗糙表面的每一处凹凸，上下弯曲，自己调整位置。小指离火太近，感到灼痛，便立刻缩到较凉的地方，重新抓稳。这时，他仿佛看见这些同样灵敏、精细的手指已经落进母狼嘴里，正被雪白的牙咬碎、撕裂。身体随时可能不再属于自己，他也从未像现在这样爱惜过它。
        - id: ch03-b06
          speaker: narrator
          text: 他挥着火棍，和饥饿的狼群斗了一夜。睡意一来，狗的呜咽和低吼就会把他唤醒。清晨到了，可天光第一次没能赶走群狼。它们依旧围着人和火，仿佛亨利已经归它们所有。早晨刚给他的勇气又动摇了。
        - id: ch03-b07
          speaker: narrator
          text: 亨利拼命试了一次，想拉起雪橇上路。他才离开火堆的保护，最大胆的狼就扑了过来，只是这一跃稍稍短了一点。亨利纵身退回，才救了自己。狼嘴在离他大腿只有六英寸的地方咔嚓合拢。其余的狼也全站起来，一齐朝他涌来。他只能不停向左向右投掷火棍，才让它们退到不敢再进的距离。
        - id: ch03-b08
          speaker: narrator
          text: 即使到了白天，他也不敢离开火堆去砍新柴。二十英尺外立着一棵巨大的枯云杉。他只好用半天时间，把营火一点点朝树下延伸。每向前挪动一步，手边都备着六根燃烧的柴枝，随时可以扔向敌人。终于到了树旁，他还要仔细察看周围的树林，选好砍伐方向，让倒下的树落向柴火最多的地方。
        - id: ch03-b09
          speaker: narrator
          text: 下一夜和前一夜一样，只有睡意变得更难抵抗。狗始终在低吼，本来能把他叫醒的声音渐渐失去作用。亨利的感觉又麻木又困倦，已经分不出吼声高低和强弱的变化。他猛然醒来，母狼离他不到一码。他机械地抬起手，没有松开火棍，直接把燃烧的一端捅进她张开低吼的嘴。母狼痛得惨叫，跳到二十英尺外，摇着脑袋，愤怒咆哮。亨利闻到毛发和皮肉烧焦的气味，心里竟很痛快。
        - id: ch03-b10
          speaker: narrator
          text: 再打瞌睡以前，他把一块燃烧的松树结绑在右手上。闭眼没几分钟，火焰烧到皮肉，疼痛把他惊醒。此后几个钟头，他一直照这个办法抵抗睡意。每次醒来，他先挥出燃烧的木柴，把靠近的狼赶退，再给火堆添柴，最后重新调整绑在手上的松树结。这个办法一直很管用。可有一回，他没有把绳子系牢。眼睛刚刚合上，那块燃烧的木头就从手边掉了下去。
    - id: ch04
      title: 火圈里的长夜
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 亨利做了个梦。他仿佛回到温暖舒适的麦格里堡，正和商站主管坐着打克里比奇牌。可堡垒也被狼群包围了。狼就在大门外嗥叫。他和主管偶尔停下牌局，侧耳听一阵，再笑那些狼白费力气，因为它们怎么也闯不进来。
        - id: ch04-b02
          speaker: narrator
          text: 梦忽然变了。一声巨响，大门被撞开。狼群涌进宽大的起居室，径直扑向他和主管。门一破，嗥叫猛然变响，吵得亨利难受。梦境正融进别的东西，他说不清那是什么。可嗥声一直跟着他，怎么也不消失。
        - id: ch04-b03
          speaker: narrator
          text: 他醒来才发现，嗥声是真的。狼群正朝他猛冲，到处都是低吼和尖叫。它们已经围在身边，甚至扑到了他身上。一头狼的牙咬住了他的胳膊。亨利本能地跳进火里，跃起时，腿上的皮肉又被尖牙狠狠划开。接着，他和狼打起了一场火仗。厚实的连指手套暂时护住双手，他不停抓起通红的炭，朝四面八方扬去，直到整堆营火看起来像一座喷发的火山。
        - id: ch04-b04
          speaker: narrator
          text: 但他不可能这样支撑太久。高温把他的脸烤起水泡，眉毛和睫毛全都燎没了，双脚也越来越受不住火焰。亨利两手各拿一根燃烧的木柴，跳到火堆边缘。狼群总算退开。四面八方，只要通红的炭火落下，积雪就被烫得嘶嘶响。隔一会儿，就有一头正在后退的狼踩中红炭，猛地跳起，鼻子喷气，嘴里发出低吼。
        - id: ch04-b05
          speaker: narrator
          text: 亨利把火棍扔向最近的狼，把冒烟的手套插进雪里，又跺脚给双脚降温。两条狗都不见了。他知道，这顿漫长的宴席从几天前的胖子开始，两条狗刚成了新的一道菜。等到后来，最后一道很可能就是他。
        - id: ch04-b06
          speaker: henry
          text: 你们还没吃到我！
          emotion: angry
        - id: ch04-b07
          speaker: narrator
          text: 他凶狠地挥舞拳头。声音一响，狼圈顿时骚动，低吼从四周升起。母狼从雪地上滑近，用饥饿的眼睛盯着他。
        - id: ch04-b08
          speaker: narrator
          text: 亨利想出了新办法。他把火向四周延伸，围成一个很大的圆圈，自己蹲在圈子中央，身下垫着全部铺盖，隔开正在融化的雪。他藏进火焰围成的屏障后，狼群全都好奇地凑到火圈边缘，想看这个人究竟去了哪里。过去，火一直挡住它们，不许它们靠近。现在，它们却像一群狗一样紧挨着围坐，在从未享受过的温暖中眨眼、打呵欠，再慢慢舒展开一具具瘦削的身体。
        - id: ch04-b09
          speaker: narrator
          text: 接着，母狼坐了下来。她把鼻尖对准天上的一颗星，开始独自嗥叫。没过多久，一头狼接着一头狼加入了她。最后，整个狼群都坐在后腿上，一齐把鼻尖指向天空，让那饥饿的嗥叫汇成一片，响彻寒冷的夜空。
        - id: ch04-b10
          speaker: narrator
          text: 黎明来了，天亮了。柴已耗尽，火越来越弱。亨利想迈出火圈，狼群马上涌来。火棍还能让它们闪开，却再也不能让它们后退。他怎么也赶不走狼，只好放弃，踉跄着退回去。一头狼向他扑来，没有扑中，四只脚全落进炭火。它又惊叫又低吼，连忙逃到雪上给爪子降温。
        - id: ch04-b11
          speaker: narrator
          text: 亨利蜷着身子坐到毯子上。身体从腰部向前折去，肩膀放松下来，软软低垂，脑袋也落在膝头。这副模样已经清楚说明，他放弃了抵抗。隔一会儿，他才抬起头，看看快要熄灭的火。原本完整的火焰和炭火之圈正在断成一截一截。中间的缺口越来越大，余下的火段越来越短。
        - id: ch04-b12
          speaker: henry
          text: 我看你们随时都可以来吃我。反正我要睡了。
        - id: ch04-b13
          speaker: narrator
          text: 有一回醒来，他看见母狼就在正前方，从火圈的缺口里望着他。
        - id: ch04-b14
          speaker: narrator
          text: 后来他又醒了一次。明明只过了片刻，感觉却像过了几个钟头。周围发生了一种神秘的变化，惊得他彻底清醒。他起先弄不明白出了什么事，接着才发现，狼群全不见了。只有被无数爪子踩乱的雪，还能告诉他，它们刚才逼得有多近。睡意再次涌上来，牢牢抓住他。脑袋正往膝上垂，他突然又吃了一惊，抬起头来。
    - id: ch05
      title: 远方的嗥叫
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 人声传来，雪橇翻搅着积雪，挽具吱呀作响，奋力拉橇的狗急切地呜咽。四架雪橇从河床驶来，进入林间营地。六个男人很快围住蜷在将熄火堆中央的亨利。他们摇晃他，又用手戳他，想让他恢复清醒。亨利像个喝醉的人，茫然望着这些突然出现的面孔，只能用困倦而古怪的声音含糊念叨。
        - id: ch05-b02
          speaker: henry
          text: 红色的母狼……狗开饭时，她就混进来……先吃狗食……再吃狗……后来又吃了比尔……
        - id: ch05-b03
          speaker: rescuer
          text: 阿尔弗雷德勋爵在哪儿？
        - id: ch05-b04
          speaker: narrator
          text: 一个男人对着亨利的耳朵大吼，还粗暴地摇晃他。亨利慢慢摇头。
        - id: ch05-b05
          speaker: henry
          text: 不，她没吃他……他留在上一个营地，还栖在树上呢。
        - id: ch05-b06
          speaker: rescuer
          text: 他死了？
          emotion: surprised
        - id: ch05-b07
          speaker: henry
          text: 还装在箱子里。喂，别烦我了……我已经累得一点儿力气也没有……大家晚安。
        - id: ch05-b08
          speaker: narrator
          text: 亨利赌气似的耸肩，挣开那只抓住他的手。眼皮扑闪几下便合上了，下巴垂在胸前。众人把他轻轻放到毯子上时，他的鼾声已经升进严寒的空气。
        - id: ch05-b09
          speaker: narrator
          text: 可远方还有另一个声音。它从荒原深处传来，距离极远，又轻又淡，几乎听不真切。那是饥饿狼群的嗥叫。它们已经重新踏上雪道，去追逐别处的肉食，刚刚这个人终究从它们嘴边逃过了一劫。
