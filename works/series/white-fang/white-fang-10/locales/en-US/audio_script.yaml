  chapters:
    - id: ch01
      title: THE BONDAGE
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            Every day brought White Fang new experiences. While Kiche remained tied to the stick, he roamed through the camp, looking into things and learning. He soon understood many of the man-animals' ways. Knowing them better did not make him think less of them. Each mysterious power they showed made them seem greater, until they loomed before him more and more like gods.
        - id: ch01-b02
          speaker: narrator
          text: >-
            Human beings may suffer when their gods are overthrown and their altars fall. Wolves and wild dogs that crouch at human feet know no such grief. A person's gods are unseen. They are shaped from hope and imagination, like mist that cannot be caught and clothed in reality. But a wolf that comes to the fire finds its gods alive in the flesh. No act of faith is needed to believe in them, and no effort of will can make them disappear. There they stand, solidly on two legs, with clubs in their hands. They need time to act, and their bodies take up space on the earth. They can be angry, loving, and terribly powerful. They are mystery and power wrapped in flesh, though that flesh can bleed and be eaten like any other.
        - id: ch01-b03
          speaker: narrator
          text: >-
            White Fang could not doubt those gods or escape them. Kiche had obeyed at the first cry of her name, and now he began to obey as well. He yielded the trail when they passed. If they called, he came. If they threatened, he crouched. If they ordered him away, he hurried off. Behind each wish stood the power to enforce it, through a blow, a club, a flying stone, or the sting of a whip.
        - id: ch01-b04
          speaker: narrator
          text: >-
            He belonged to them, just as every dog in camp did. They could command his actions. They could strike his body, trample him, or simply allow him to live. The lesson came quickly, but it went against everything strong and ruling in his nature, so learning it was hard. He hated the lesson while it was being forced upon him. Yet, without knowing it, he also began to welcome it. His fate now rested in other hands. He was giving up the need to decide and struggle for everything himself, and someone else carried the burden of keeping him alive. That surrender offered something in return. It was easier to lean on another than to stand alone.
        - id: ch01-b05
          speaker: narrator
          text: >-
            Still, he did not surrender his body and spirit in a single day. His wild blood and his memories of the Wild remained. Sometimes he crept to the forest's edge and stood listening to a call from far away. But he always returned, uneasy and restless, to whimper beside Kiche and lick her face as if asking her what he should do.
        - id: ch01-b06
          speaker: narrator
          text: >-
            White Fang learned the camp quickly. When meat or fish was thrown down, the older dogs were greedy and unfair. Men treated him more justly. Children were crueler, while women were kinder and more likely to toss him a scrap of meat or a bone. After two or three painful encounters with mothers of half-grown puppies, he learned another rule. Stay far away from them, and avoid them whenever they came near.
        - id: ch01-b07
          speaker: narrator
          text: >-
            The worst part of his life was Lip-lip. He was bigger, older, and stronger, and he chose White Fang as the one puppy he would always torment. White Fang was willing to fight, but he was no match for him. Whenever White Fang left his mother's side, Lip-lip followed close behind, snarling and provoking him. The moment no man-animal was near, he sprang. Lip-lip always won. Tormenting White Fang became his greatest pleasure, while Lip-lip became White Fang's nightmare.
        - id: ch01-b08
          speaker: narrator
          text: >-
            The bullying did not break White Fang's spirit. He took most of the wounds and lost every fight, but he would not submit. Even so, the endless persecution changed him in a darker way. He had been born savage, and now he grew more savage still. He became bitter and gloomy, always expecting trouble. His warm, friendly, playful puppy nature had almost no chance to appear, because every attempt to join the others brought Lip-lip down upon him again.
        - id: ch01-b09
          speaker: narrator
          text: >-
            Lip-lip never let him play with the other puppies. As soon as White Fang came near them, the bully was on him, driving him off with threats or a fight. White Fang never had the chance to tumble and race with the others. Much of his puppyhood was stolen from him, and he began to act older than he was. All the energy that should have gone into play had nowhere to go. It turned back upon him instead. He watched, thought, and learned. With long idle hours to consider tricks, he became cunning.
        - id: ch01-b10
          speaker: narrator
          text: >-
            Lip-lip also kept him from his share when meat and fish were thrown to all the camp dogs, so White Fang learned to steal. He had to find food for himself, and he became very good at it, though the women often suffered for his skill. He learned to slip quietly through camp and move with care. He kept track of what was happening everywhere. He saw and heard everything he could, reasoned from it, and planned accordingly. Most of all, he used that knowledge to find successful ways of escaping the enemy who never stopped hunting him.
        - id: ch01-b11
          speaker: narrator
          text: >-
            Early in those days of torment, White Fang carried out his first great trick and tasted revenge for the first time. Kiche had once lured dogs away from human camps so the wolf pack could destroy them. Now her son used a similar trick to lead Lip-lip straight into her waiting jaws.
        - id: ch01-b12
          speaker: narrator
          text: >-
            White Fang retreated before Lip-lip, taking a winding course around and between the tepees. He could outrun any puppy his size, including Lip-lip, but he held back. He stayed only one leap ahead, close enough to keep his pursuer racing after him.
        - id: ch01-b13
          speaker: narrator
          text: >-
            Lip-lip became so excited by the chase, and by the sight of his victim always just within reach, that he forgot to be cautious. By the time he remembered where he was, it was too late. He flew around a tepee at full speed and ran straight into Kiche, lying at the end of her stick. He gave one startled yelp. Then her jaws closed on him.
        - id: ch01-b14
          speaker: narrator
          text: >-
            Kiche was tied, but Lip-lip could not escape her easily. She knocked his legs from under him so he could not run, then tore and slashed him again and again with her fangs. At last he rolled free and dragged himself upright. He was battered in body and spirit, and his fur stuck out in tufts wherever her teeth had seized him.
        - id: ch01-b15
          speaker: narrator
          text: >-
            Lip-lip opened his mouth and began a long, heartbroken puppy wail. He never finished it. White Fang rushed in and buried his teeth in Lip-lip's hind leg. There was no fight left in the bully. He fled without shame, with his former victim snapping at him all the way back to his tepee. The women came to Lip-lip's rescue. White Fang had become a raging little demon, and only a shower of stones finally drove him away.
        - id: ch01-b16
          speaker: narrator
          text: >-
            Then came the day when Grey Beaver decided Kiche would no longer run away and released her. White Fang was overjoyed. He followed his mother happily around the camp, and as long as he stayed beside her, Lip-lip kept a respectful distance. White Fang even raised his hackles and walked stiff-legged toward him. Lip-lip refused the challenge. He was cunning too, and he could wait for revenge until White Fang was alone.
        - id: ch01-b17
          speaker: narrator
          text: >-
            Later that day, Kiche and White Fang wandered to the edge of the woods. White Fang had led her there a few steps at a time. When she stopped, he tried to draw her farther. The stream, the old lair, and the quiet forest seemed to call him home.
        - id: ch01-b18
          speaker: narrator
          text: >-
            He ran ahead, stopped, and looked back. Kiche had not moved. He whined and darted playfully through the brush. Then he ran to her, licked her face, and bounded forward once more. Still she stayed where she was. White Fang stared at her, his whole body eager. Slowly that eagerness faded as she turned her head and looked back toward the camp.
        - id: ch01-b19
          speaker: narrator
          text: >-
            The open wilderness was calling to White Fang, and Kiche heard it too. But she also heard a stronger call, the call of fire and man. Of all animals, the wolf and the wild dog, who are brothers, had been given the power to answer it.
        - id: ch01-b20
          speaker: narrator
          text: >-
            Kiche turned and slowly trotted toward camp. The stick no longer held her, but the camp held her more firmly than the stick ever had. The gods still gripped her with an unseen power and would not let her go.
        - id: ch01-b21
          speaker: narrator
          text: >-
            White Fang sat beneath a birch and whimpered softly. The strong smell of pine and the faint scents of the woods filled the air. They brought back his old free life, before the days of bondage. Yet he was still only a half-grown puppy. The call of his mother was stronger than the call of man or the Wild. He had depended on her through every hour of his short life. Independence would come one day, but that day had not arrived. He was not ready to stand alone.
        - id: ch01-b22
          speaker: narrator
          text: >-
            He rose and followed her sadly to camp. Once, and then again, he stopped to sit, whimper, and listen to the call that still sounded from deep in the forest.
        - id: ch01-b23
          speaker: narrator
          text: >-
            In the Wild, a mother stays with her young only a short time. Under the rule of man, that time can be shorter still. So it was for White Fang. Grey Beaver owed a debt to Three Eagles, who was leaving on a journey up the Mackenzie to Great Slave Lake. The debt was paid with scarlet cloth, a bearskin, twenty cartridges, and Kiche.
        - id: ch01-b24
          speaker: narrator
          text: >-
            White Fang watched his mother being put into Three Eagles' canoe and tried to follow. Three Eagles struck him back onto the shore, and the canoe pushed away. White Fang leaped into the water and swam after it. Grey Beaver called sharply for him to return, but he would not listen. In his terror of losing Kiche, he ignored even the command of a man-animal, a god.
        - id: ch01-b25
          speaker: narrator
          text: >-
            Gods expect obedience. Grey Beaver angrily launched another canoe and went after him. When he caught up, he seized White Fang by the back of the neck and lifted him from the water. He did not put the puppy down. He held White Fang in one hand and beat him with the other.
        - id: ch01-b26
          speaker: narrator
          text: >-
            This was no ordinary punishment. Grey Beaver's hand was heavy, and every one of the many blows was meant to hurt. They struck from one side and then the other, swinging White Fang back and forth like a jerking pendulum.
        - id: ch01-b27
          speaker: narrator
          text: >-
            Surprise came first. Then White Fang felt fear and yelped several times as the hand struck him. But fear soon turned to anger. His free nature rose up. He bared his teeth and snarled without fear into the face of the wrathful god. That only made Grey Beaver more furious, and the blows fell faster and harder.
        - id: ch01-b28
          speaker: narrator
          text: >-
            Grey Beaver kept beating him, and White Fang kept snarling. It could not continue forever. One of them had to yield, and it was White Fang. Fear swept through him again. For the first time, a man was truly using his full strength against him. The scattered blows of sticks and stones he had known before seemed almost like caresses beside this beating. His defiance broke, and he began to cry. For a while, each blow forced out one yelp. Then fear grew into terror. The cries poured from him in one unbroken stream, no longer rising and falling with the rhythm of the punishment.
        - id: ch01-b29
          speaker: narrator
          text: >-
            At last Grey Beaver stopped. White Fang hung limply from his hand and went on crying. His master seemed satisfied and threw him into the bottom of the canoe. They had drifted downstream, and now Grey Beaver took up the paddle. White Fang lay in his way, so Grey Beaver kicked him savagely aside.
        - id: ch01-b30
          speaker: narrator
          text: >-
            In that instant, White Fang's free nature flashed up once more. He sank his teeth into Grey Beaver's moccasined foot.
        - id: ch01-b31
          speaker: narrator
          text: >-
            The first beating had been nothing beside the one that followed. Grey Beaver's rage was terrible, and so was White Fang's fright. This time the hard wooden paddle joined the hand. By the time Grey Beaver threw him down again, every part of his small body was bruised and sore.
        - id: ch01-b32
          speaker: narrator
          text: >-
            Grey Beaver kicked him once more, and this time he did it deliberately. White Fang did not bite again. He had learned another law of bondage. Whatever happened, he must never sink his teeth into the god who ruled him. His master's body was sacred. To bite it was the greatest of crimes, an offense that would never be forgiven or ignored.
        - id: ch01-b33
          speaker: narrator
          text: >-
            When the canoe reached shore, White Fang lay still and whimpered, waiting to learn what Grey Beaver wanted. Grey Beaver flung him onto the land. He struck heavily on his side, and all his bruises hurt again. Trembling, he crawled to his feet and stood there crying softly.
        - id: ch01-b34
          speaker: narrator
          text: >-
            Lip-lip had watched everything from the bank. Now he rushed in, knocked White Fang down, and drove his teeth into him. White Fang was too helpless to fight back, and things would have gone badly if Grey Beaver had not kicked Lip-lip into the air. The blow sent him crashing to the ground twelve feet away.
        - id: ch01-b35
          speaker: narrator
          text: >-
            This was the justice of the man-animal. Even in his misery, White Fang felt a small thrill of gratitude. He limped obediently behind Grey Beaver through the village to the tepee. Now he understood that the gods kept the right to punish for themselves. The lesser creatures beneath them were not allowed to claim it.
        - id: ch01-b36
          speaker: narrator
          text: >-
            That night, when everything was quiet, White Fang remembered his mother and grieved for her. His cries woke Grey Beaver, who beat him. After that, he mourned softly whenever the gods were near. But sometimes he wandered alone to the forest's edge. There he let his sorrow loose in loud whimpers and wails.
        - id: ch01-b37
          speaker: narrator
          text: >-
            During those days, memories of the lair and the stream might have drawn him back into the Wild. Instead, his memory of Kiche kept him in camp. The hunting men went away and returned, so he believed she would also return to the village one day. He remained in bondage and waited for her.
        - id: ch01-b38
          speaker: narrator
          text: >-
            Yet bondage was not entirely unhappy. The camp was full of things that interested him. Something was always happening, and the gods never seemed to reach the end of their strange deeds. His curiosity kept drawing him to watch what they would do next. He was also learning how to live with Grey Beaver. His master demanded complete, rigid, unwavering obedience. When White Fang gave it, he escaped the punishments that followed disobedience, and Grey Beaver allowed him to go on living near the fire.
        - id: ch01-b39
          speaker: narrator
          text: >-
            Sometimes Grey Beaver even threw him a piece of meat and protected him from the other dogs while he ate it. That piece had a strange value. Somehow, meat from Grey Beaver mattered more than a dozen pieces given by one of the women. Grey Beaver never stroked or caressed him, and he offered no tenderness in return for obedience. Perhaps it was the weight of his hand. Perhaps it was his justice, or the sheer power he held over White Fang's life. Perhaps all of those things worked together. Whatever the reason, a bond of attachment was beginning to form between White Fang and his harsh master.
        - id: ch01-b40
          speaker: narrator
          text: >-
            The chains of White Fang's bondage were being fastened in many ways. Sticks, stones, and blows tightened them openly, while quieter forces worked by hidden and distant paths, beyond his understanding. Long ago, certain qualities within his kind had allowed wolves to come near the fires of men. Those qualities were still there, and they could grow stronger. They were growing in White Fang now. Camp life held plenty of misery, yet every day it drew him closer. Without his knowing it, that life was secretly becoming dear to him.
        - id: ch01-b41
          speaker: narrator
          text: >-
            White Fang knew nothing of that change. He knew only his sorrow at losing Kiche, his hope that she would return, and his hungry longing for the free life he had once known.
