audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 沉着克制，带着北国故事的冷峻张力
        timbre: 温厚清晰，略显低沉
        pace: 舒缓而有变化
        pitch: 中低
  chapters:
    - id: ch01
      title: 第二章　束缚
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            白牙的每一天，都塞满了新鲜经历。基切还被木棍拴着，他已经跑遍营地，四处探问，四处察看，也四处学习。没过多久，他便知道了人形动物的许多习性。可他越熟悉他们，越不敢轻视。他们不断证明自己高高在上。白牙每认识一种神秘的本领，他们在他眼里就更高大一分，也更像神一分。
        - id: ch01-b02
          speaker: narrator
          text: >-
            人有时会眼看自己的神倒下，连祭坛也跟着崩塌。来到人脚边俯伏的狼和野狗，却从没尝过这种悲哀。人的神看不见，只能过度猜想，像一团抓不住的烟雾，始终穿不上现实的外衣。那是人盼望善与力量，才从自己心中召来的游魂，也是投向灵界的一道影子。狼和野狗在火边见到的神完全不同。他们有血有肉，伸手就能碰到。他们占据实在的空间，做事和生活也需要时间。这样的神，不用努力去相信，也没法逼自己不信，更没有地方可以逃。他就站在那里，用两条后腿支撑身体，手里拿着木棒，藏着惊人的力量。他会冲动，会发怒，也会爱。他把神性、奥秘和威力全裹在肉身里。那肉身破了会流血，也和别的肉一样能吃。
        - id: ch01-b03
          speaker: narrator
          text: >-
            白牙看到的正是这样的神，清清楚楚，怎么也躲不开。基切听见自己的名字，立刻向他们低头。现在，白牙也开始服从。他认定道路是他们的，他们走来，他就让开。他们叫，他便过去。他们一威吓，他马上伏低身体。他们赶他，他就匆匆离开。因为他们想要什么，背后总有力量逼他照做。那力量会疼，会变成巴掌、木棒、飞石，还有抽得火辣的鞭子。
        - id: ch01-b04
          speaker: narrator
          text: >-
            他属于他们，就像所有的狗都属于他们。他做什么，由他们支配。他这副身体，也任他们打伤、踩踏，或者容许它继续活着。这就是他很快领会的功课。可学起来很苦，因为他天性中那些强硬又高傲的东西，全在反抗。奇怪的是，他一边讨厌，一边又在不知不觉中喜欢上了这种生活。把命运交到别人手中，也就不用独自承担活下去的一切。这本身也算是一种补偿。能有所依靠，总比独自站着容易。
        - id: ch01-b05
          speaker: narrator
          text: >-
            当然，白牙并没有在一天之内，就把身体和心都交给人形动物。荒野留给他的血脉与记忆，也不可能立刻消失。有些日子，他会悄悄来到林边，站着听远方的召唤。可是最后，他总会焦躁地回到基切身旁，低声呜咽，再眼巴巴地舔她的脸，仿佛想问母亲该怎么办。
        - id: ch01-b06
          speaker: narrator
          text: >-
            营地里的规矩，他学得很快。肉和鱼一扔出来，老狗便又贪婪又不公。他还发现，男人更公正，孩子更残忍，女人比较和善，也更愿意给他一点肉或一根骨头。至于那些半大幼犬的母亲，他吃过两三回苦头，也就明白了。离她们越远越好，看见她们过来，马上躲开。
        - id: ch01-b07
          speaker: narrator
          text: >-
            可他最大的祸害还是唇唇。唇唇比他大，比他年长，也比他强壮，偏偏认准了要欺负他。白牙从不怕还手，只是实力相差太远，根本打不过。唇唇也因此成了他的噩梦。只要白牙离开母亲，那个恶霸准会跟来，咬着他的脚后跟低吼挑衅，时刻寻找机会。等附近没有人形动物，它就扑上去逼白牙厮打。唇唇每次都赢，也把这当成最大的快乐。对白牙来说，这却是最深的折磨。
        - id: ch01-b08
          speaker: narrator
          text: >-
            白牙没有被吓服。哪怕每次受伤更多，每一战都输，他的精神也不肯低头。不过，这种没完没了的迫害还是改变了他。他变得阴沉而凶狠，天生的野性也越来越暴烈。他本来还有幼犬和善、贪玩的一面，却几乎没有机会显露。他从来不能跟营地里的幼犬一起追逐嬉戏，唇唇绝不允许。白牙才一靠近，它便立刻扑来，欺压他，吓唬他，甚至动口撕咬，直到把他赶走。
        - id: ch01-b09
          speaker: narrator
          text: >-
            他的幼年时光，就这样被夺走了大半，举止也比同龄幼犬老成。精力不能用来嬉戏，便全缩回心里，推动着他的心智生长。他有大把时间琢磨诡计，渐渐变得狡猾。狗群一起吃饭时，他抢不到自己那份肉和鱼，只好学着偷，竟成了一个机灵的小偷。他必须独自觅食，而且很会寻找，只是常把营地里的女人搅得烦恼不堪。他还学会了在营地中偷偷来去，弄清各处正在发生什么。什么都看，什么都听，再根据这些动静想出办法，避开那个死缠不放的敌人。
        - id: ch01-b10
          speaker: narrator
          text: >-
            受欺负没多久，白牙便使出了生平第一个大计谋，也第一次尝到复仇的滋味。基切跟狼群生活时，曾把营地里的狗引出去送死。如今，白牙也把唇唇引向母亲复仇的利齿。他装作逃跑，在一座座帐篷之间穿来绕去。他跑得比同样大小的幼犬都快，也胜过唇唇，可这回偏不使出全力，只让自己始终领先一跃。
        - id: ch01-b11
          speaker: narrator
          text: >-
            唇唇越追越兴奋，猎物又一直近在眼前，它便忘了谨慎，也忘了自己跑到了哪里。等它想起来，已经迟了。它全速绕过一座帐篷，一头撞上躺在木棍尽头的基切。唇唇惊叫一声，基切的利齿已经咬住它。她虽然还被拴着，却将它掀翻在地，不让它逃跑，又一次次用牙撕咬。
        - id: ch01-b12
          speaker: narrator
          text: >-
            唇唇好不容易从基切牙下滚开，狼狈地爬起来。它身上痛，心里也受了伤。被利齿蹂躏过的地方，一簇簇毛全翘着。它就站在爬起的地方，张嘴发出幼犬那种漫长又心碎的哀号。可是连这声哀号都没能叫完。白牙已经冲来，一口咬住它的后腿。唇唇身上再也没有半点斗志，顾不得颜面，转身就逃。刚才的受害者紧追在它脚后，一路撕咬，直到它逃回自家帐篷。女人们赶来相救，最后靠着一阵石头雨，才赶走了已经化作狂怒恶魔的白牙。
        - id: ch01-b13
          speaker: narrator
          text: >-
            后来，灰海狸认定基切不会逃走，终于解开了她的绳索。白牙为母亲重获自由而快活，陪着她走遍营地。只要待在她身边，唇唇就会恭敬地躲远。白牙甚至竖起毛，绷直四腿，故意向它挑战。唇唇却不理睬。它也不傻，想报仇的话，等白牙落单也不迟。
        - id: ch01-b14
          speaker: narrator
          text: >-
            那天晚些时候，基切和白牙来到营地旁的林边。白牙一步步把母亲领来，还想哄她继续往前。溪流、洞穴和安静的树林都在召唤他，他也想让母亲一同回去。他跑出几步，停下回望，基切没有动。他恳求似的低声呜咽，在灌木间欢快地钻进钻出，又跑回来舔她的脸，然后再次朝前跑。可她仍旧站着。白牙停下来，全神贯注地看着她，满身都是急切与渴望。直到母亲转头看向营地，他身上那股热切才一点点消失。
        - id: ch01-b15
          speaker: narrator
          text: >-
            开阔的荒野正在呼唤白牙，基切也听见了。但她还听见另一声更响的召唤，那是火与人的声音。所有动物里，只有狼愿意回应它。狼和野狗本是兄弟，也只有它们会走向那声音。
        - id: ch01-b16
          speaker: narrator
          text: >-
            基切转过身，慢慢跑回营地。营地抓住她的力量，比木棍更牢。那些神仍用看不见的神秘力量攥着她，不肯让她离开。白牙坐在桦树的阴影里，轻声呜咽。浓浓的松香与林木的幽香充满四周，让他想起受束缚以前的自由生活。可他毕竟还是一头没长大的幼犬。人的召唤也好，荒野的召唤也好，都敌不过母亲的召唤。他短短一生里的每个时刻，都依靠着她，还没到独立的时候。于是，他站起身，凄凉地跑回营地。路上，他停下一次，又停下第二次，坐着哀鸣，倾听森林深处依然不散的呼唤。
        - id: ch01-b17
          speaker: narrator
          text: >-
            在荒野里，母兽陪伴幼崽的日子很短。落到人手里，有时还要更短。白牙就遇上了这样的事。灰海狸欠三鹰一笔债，三鹰又要沿马更些河去大奴湖。为了抵债，灰海狸交出一条鲜红的布、一张熊皮、二十发子弹，还有基切。白牙看着母亲被带上三鹰的独木舟，立刻想跟过去，却被一击打回岸上。船离开了，他纵身跳进水里，跟在后面游。灰海狸厉声叫他回来，他也不听。失去母亲的恐惧压倒了一切，连神的命令都不再管用了。
        - id: ch01-b18
          speaker: narrator
          text: >-
            可神向来习惯别人服从。灰海狸怒冲冲地划船追来。赶上白牙以后，他伸手揪住后颈，把白牙提出水面，却没有马上放进船底。他一只手悬空提着幼犬，另一只手狠狠打下去。这真是一顿毒打。他的手又沉又重，每一下都知道该打在哪里才最疼，而且一刻也不停。
        - id: ch01-b19
          speaker: narrator
          text: >-
            巴掌从两边不断落下，白牙被打得来回摇晃，像一只抽搐乱摆的钟摆。他心里的感受也不断变化。最先是惊讶，接着是短暂的害怕，每挨一下便叫一声。可恐惧很快又变成愤怒。那股自由不羁的天性猛地站了起来。他露出牙，对着发怒的神勇敢咆哮。灰海狸更加恼火，巴掌也更快、更重，打得更疼。
        - id: ch01-b20
          speaker: narrator
          text: >-
            灰海狸继续打，白牙继续吼。可是总有一方要先屈服，那一方只能是白牙。恐惧又涌了上来。这是他第一次真正被人毒打，从前挨过的木棍和石头，相比之下简直像抚摸。他终于撑不住，哭叫起来。起先，每挨一记才叫一声。后来恐惧变成惊骇，惨叫便连成一片，再也跟不上巴掌的起落。
        - id: ch01-b21
          speaker: narrator
          text: >-
            灰海狸终于停手。白牙软软地悬着，却还在哭。主人像是满意了，粗暴地把他扔进船底。这时，独木舟已经顺流漂远。灰海狸拿起船桨，白牙却挡在脚边，于是他凶狠地踢了一脚。就在那一刻，白牙自由的天性再次闪现。他扑上去，一口咬住那只穿着鹿皮鞋的脚。
        - id: ch01-b22
          speaker: narrator
          text: >-
            接下来这顿打，让先前的毒打都算不了什么。灰海狸暴怒，白牙也怕到了极点。落下来的不只有巴掌，还有坚硬的木桨。等他再次被扔进船底，小小的身体已经到处青肿，浑身疼痛。灰海狸又故意踢了他一脚，白牙没有再咬。他学会了束缚中的另一课。无论发生什么，都不能咬统治他的神，不能咬自己的主人。主人的身体是神圣的，绝不能让低等生灵用牙玷污。这是最重的罪，永远不会得到原谅，也绝不会被放过。
        - id: ch01-b23
          speaker: narrator
          text: >-
            独木舟靠岸时，白牙一动不动地躺着哀鸣，等灰海狸处置。他被一把扔到岸上，身体侧面重重着地，碰得旧伤又疼起来。他发着抖爬起身，唇唇已经从岸边冲来，将他撞倒，一口咬住。白牙虚弱得没法还手，眼看就要遭殃。幸好灰海狸猛地一脚踢出，把唇唇送上半空，又摔在十二英尺外。这就是人形动物的公正。哪怕自己如此可怜，白牙心里还是掠过一丝感激。他顺从地跟在灰海狸脚后，一瘸一拐地穿过村落，回到帐篷。现在他明白了，只有神才有惩罚的权利，手下的低等生灵不准碰这项权利。
        - id: ch01-b24
          speaker: narrator
          text: >-
            那天夜里，四周安静下来，白牙想起母亲，难过得哭出了声。哭声吵醒灰海狸，他又挨了打。从此，只要神在附近，他就轻轻地哀悼。可有时，他会独自走到森林边缘，把悲伤全放出来，大声呜咽，长声哀号。
        - id: ch01-b25
          speaker: narrator
          text: >-
            那段日子里，洞穴和溪流的记忆本可以把他引回荒野，母亲的记忆却留住了他。出去打猎的人形动物都会回来，基切将来也一定会回到村落。他这样想着，便继续留在束缚中，等候母亲归来。
        - id: ch01-b26
          speaker: narrator
          text: >-
            这份束缚也并非只有不幸。营地里有太多事情让白牙感兴趣。神总在做各种古怪的事，他每次都想看个明白。他还学着怎样跟灰海狸相处。灰海狸要的只有服从，严格而绝不偏离的服从。只要照做，白牙就不会挨打，也可以继续活下去。
        - id: ch01-b27
          speaker: narrator
          text: >-
            灰海狸有时还会扔给他一块肉，并在他吃的时候赶开别的狗。这样一块肉，对白牙格外珍贵。不知为什么，它比女人给的十二块肉还有分量。灰海狸从不抚摸他，也从不亲昵地爱护他。也许是那只沉重的手，也许是他的公正，也许是他强大的力量。或许这一切加在一起，让白牙和那个阴沉的主人之间，慢慢生出了一道依恋。
        - id: ch01-b28
          speaker: narrator
          text: >-
            白牙身上的锁链，就这样一点点铆紧。木棍、石块和巴掌在用力，另外还有更隐秘、更迂回的力量。当初，他这一族能走到人的火边，正因为天性中藏着一些能够继续生长的禀赋。现在，那些禀赋正在白牙体内长大。营地生活虽然苦难重重，却一直暗暗变得越来越难以割舍。白牙自己还不知道这场变化。他只知道失去基切的悲伤，盼望她回来的希望，还有那种饥渴般的向往。他想念自己曾经拥有的自由生活。
