cover_prompt: |-
  A wordless cover scene at a Yukon cabin around the turn of the twentieth century shows a powerful gray wolf-dog cautiously approaching a seated man in the snow. The animal has a dense gray coat, a broad chest, alert triangular ears, and a tense, wary posture, while the man wears practical winter frontier clothing and holds out a small piece of meat in one bare hand. The wolf-dog's careful forward step toward the offered food is the focal action, capturing the first fragile moment of trust after long fear. A rough log cabin and its low stoop stand behind the man, with a frozen clearing and dark spruce forest extending into the winter dusk. Use a wide, low viewpoint that gives the animal dignity, leads the eye along their outstretched forms, and leaves calm open sky across the top. Keep the clothing, cabin, landscape, and animal anatomy faithful to the North American frontier period, with gentle tension and no resemblance to any screen adaptation. No readable text, letters, numbers, labels, logos, captions, speech bubbles, signatures, or watermarks.
