audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 沉着克制，带着北国故事的冷峻张力
        timbre: 温厚清晰，略显低沉
        pace: 舒缓而有变化
        pitch: 中低
  chapters:
    - id: ch01
      title: 第六章　饥荒
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            灰海狸走完漫长的旅程时，春天已经近了。那是四月，白牙刚满一岁。他把雪橇拉回故乡的村落，米特萨替他卸下挽具。白牙还远没有长成，却已是村里仅次于唇唇的最大一岁幼犬。狼父和基奇把高大的身材与强健的体魄传给了他，他已经能与成年狗比肩。只是他的身躯还没长得紧凑，依旧瘦长，力量藏在筋骨里，并不雄浑厚重。他披着纯正的狼灰色皮毛，看起来就是一头真正的狼。基奇传给他的四分之一狗的血统没有显在外形上，却已经进入了他的心性。
        - id: ch01-b02
          speaker: narrator
          text: >-
            白牙在村子里闲逛，认出远行以前熟悉的一个个神，心里感到沉静而满足。他也看见了那些狗。有些幼犬跟他一样正在长大，那些成年狗却不再像记忆中那么高大可怕了。他也不像从前那样畏惧它们。他从狗群里昂然走过，带着一种从未有过的自在，觉得十分畅快。
        - id: ch01-b03
          speaker: narrator
          text: >-
            一条毛色斑白的老狗名叫巴西克。它年轻的时候，只要露出尖牙，就能把白牙吓得伏下身子，转身慌忙避开。那时，白牙从它那里一次次懂得自己有多渺小。现在，巴西克又要让他看清自己已经有了多大的长进。岁月正使巴西克衰弱，青春却让白牙越来越强壮。
        - id: ch01-b04
          speaker: narrator
          text: >-
            一头刚猎到的驼鹿被剖开分肉时，白牙终于看清了自己在狗群中的新地位。他抢到一只蹄子和一截带着许多肉的胫骨，便离开争抢的狗群，躲到灌木丛后面独自吞食，别的狗连他的影子都看不见。巴西克突然闯了进来。白牙还没来得及思量，已经连挥两爪，随后跃到一旁。巴西克没想到他敢还击，而且出手这么快，一时惊呆了。它站在那里，隔着地上那截鲜红的胫骨，愣愣地盯住白牙。
        - id: ch01-b05
          speaker: narrator
          text: >-
            巴西克早就发觉，那些从前任它欺负的狗越来越敢反抗了。它不得不咽下这些苦涩的教训，靠一生的经验来应付。换作过去，它早已带着自以为理直气壮的怒火扑向白牙，可衰退的体力不允许它这么做。它凶狠地竖起毛，隔着胫骨阴沉地瞪过去。白牙心中又升起旧日的敬畏，仿佛越缩越小。他已经想要退却，只在盘算怎样离开才不至于太丢脸。
        - id: ch01-b06
          speaker: narrator
          text: >-
            巴西克偏偏在这时犯了错。如果它只站在那里摆出凶相，白牙终究会退走，把肉让给它。可它认定自己已经赢了，便朝肉走去，漫不经心地低头嗅了嗅。白牙微微竖起毛。事情仍有转圜的余地，巴西克只要昂着头守在肉上，白牙最后还是会溜走。可鲜肉的气味太浓了，贪欲催着巴西克咬上一口。
        - id: ch01-b07
          speaker: narrator
          text: >-
            这一下，白牙再也忍耐不住。几个月来，他一直压服同队的狗，怎能站着看别人吞掉自己的肉？他照例不发警告，猛然出击。第一爪就把巴西克的右耳撕成碎片。老狗还没从震惊中回过神，更多惨痛的打击已经落了下来。它被撞倒，喉咙挨了一口。才要起身，白牙又两次把牙齿扎进它肩头。一切快得叫巴西克茫然。它扑向白牙，愤怒地咬了一口，却只咬中空气。转眼间，它的鼻子又被撕开，只能踉跄后退，离开那块肉。
        - id: ch01-b08
          speaker: narrator
          text: >-
            局面完全倒了过来。白牙浑身竖毛，威风凛凛地守着胫骨。巴西克站在远处，准备退走。它不敢和这道年轻的闪电交战，再一次、更苦涩地尝到了衰老的滋味。可它仍英勇地设法保住尊严，平静地转过身，仿佛白牙和那块骨头都不配让自己费心，然后昂首走开。直到远远离开白牙的视线，它才停下脚步，舔舐流血的伤口。
        - id: ch01-b09
          speaker: narrator
          text: >-
            这一战让白牙更加自信，也更加骄傲。他走在成年狗之间时，不再轻手轻脚，也不肯轻易退让。他无意四处挑衅，只要求自己走过时不受侵扰，也绝不给任何狗让路。它们必须把他当回事，不能再像忽视普通幼犬那样忽视他。与他同队的幼犬还是会给成年狗让路，被迫交出食物，白牙却不再受这种待遇。他孤僻、阴郁，几乎不看左右。他冷峻而危险，像一个疏远的异类，却已被困惑的成年狗视作同等的对手。它们很快学会既不攻击他，也不亲近他。只要它们不来打扰，白牙也不会理会它们。几次交锋以后，大家都觉得这种相处方式最好。
        - id: ch01-b10
          speaker: narrator
          text: >-
            到了仲夏，白牙去查看村边新搭的一座圆锥帐篷。那是他跟猎人外出捕猎驼鹿时竖起来的。他悄无声息地跑去，迎面遇见了基奇。白牙停住脚步，看着她。他的记忆已经模糊，却终究认出了母亲，基奇却认不出他。她掀起嘴唇，发出从前那种警告的低吼。白牙顿时想起了幼年，想起与那声低吼相连的一切。在他还不知道诸神以前，基奇就是整个宇宙的中心。那时候的熟悉感情全回来了，在他心里不断翻涌。白牙欢喜地扑向她，迎接他的却是尖牙。基奇一口把他的脸颊撕得深可见骨。白牙完全不明白，只能困惑地退开。
        - id: ch01-b11
          speaker: narrator
          text: >-
            这并不是基奇的错。母狼天生不会记住一年左右以前生下的幼崽。对她来说，白牙只是一头陌生的野兽，一个闯入者。她眼下还有一窝幼崽，当然要赶走这个不速之客。
        - id: ch01-b12
          speaker: narrator
          text: >-
            一只幼崽摇摇晃晃地爬到白牙身边。他们是同母异父的兄弟，彼此却毫不知情。白牙好奇地嗅了嗅幼崽，基奇立刻冲来，第二次抓伤他的脸。他退得更远了。刚刚复苏的回忆和牵绊又渐渐消退，重新埋进坟墓。他看着基奇舔舐幼崽，时不时停下来冲他低吼。她对他已经没有价值。他早就学会没有她也能活下去，也忘了她曾经代表什么。她在他的世界里没有位置，就像他在她的世界里也没有位置。
        - id: ch01-b13
          speaker: narrator
          text: >-
            白牙还是呆呆地站着，刚才唤醒的回忆已经消失，他不明白这一切究竟为了什么。基奇第三次扑过来，一心要把他彻底赶走。白牙没有反抗，任她驱赶。她是同类中的雌性，而同类有一条法则，雄性不能和雌性争斗。没有谁把这条法则教给白牙，它也不是头脑归纳出的结论，更不是他从经历中想出来的道理。他只是受到本能的隐秘催促。正是这本能，让他在夜里向月亮和星辰长嚎，也让他畏惧死亡与未知。
        - id: ch01-b14
          speaker: narrator
          text: >-
            几个月过去，白牙越来越强壮，越来越沉重，身躯也长得更加紧凑。他的性情，则沿着遗传和环境划下的道路继续发展。遗传带来的生命质料，就像一团黏土，藏着许多可能，可以塑成不同的形状。环境则伸手捏塑它，赋予它确定的模样。如果白牙从未走近人的火堆，荒野本会把他塑成真正的狼。可是诸神给了他另一种环境，他便成了一条狼性浓重的狗。他终究是狗，不是狼。
        - id: ch01-b15
          speaker: narrator
          text: >-
            天性的黏土承受着周遭的压力，白牙的性情就这样成了形，他无法逃开。他一天比一天阴郁、不合群、孤僻而凶猛。狗群也越来越明白，与他和平相处比向他开战好得多。灰海狸则越来越看重他。
        - id: ch01-b16
          speaker: narrator
          text: >-
            白牙浑身上下似乎都凝聚着力量，却有一个摆脱不了的弱点。他不能忍受别人嘲笑他。人的笑声令他憎恶。人们拿别的事互相取笑，他并不在意，可只要笑声落到自己身上，他便会狂怒。白牙本来庄重、自尊而阴沉，一声嘲笑却能把他逼得狂乱失态，甚至可笑得荒唐。那种冒犯和烦扰会延续几个钟头，让他一直像恶魔般发作。哪条狗这时不幸碰到他，哪条狗便要遭殃。白牙太了解法则，不敢找灰海狸泄愤，因为灰海狸背后有棍棒和神的威权。狗的身后却只有一片空地，所以白牙带着被嘲笑激起的狂怒一出现，它们便纷纷朝远处逃去。
        - id: ch01-b17
          speaker: narrator
          text: >-
            白牙三岁那年，麦肯齐印第安人遇上了一场大饥荒。夏天没有鱼，冬天的驯鹿也离开了往常迁徙的路线。驼鹿变得稀少，野兔几乎绝迹，就连捕食其他动物的猛兽也纷纷死去。它们失去了惯常的食物，被饥饿削弱，只好互相扑咬吞食。最后只有强者活下来。白牙的诸神都是猎人，部族里的老人和弱者却饿死了。村中到处都是哭声。妇女和孩子宁愿自己饿着，也要把仅有的一点食物留给瘦得皮包骨、眼窝深陷的猎人。这些猎人踏遍森林，徒劳地追寻肉食，却总是空手而归。
        - id: ch01-b18
          speaker: narrator
          text: >-
            诸神被逼到绝境，连鹿皮鞋和手套上揉得柔软的皮革都吃掉了。狗把自己背上的挽具吃掉，连鞭梢也不放过。狗开始吃狗，诸神也开始吃狗。最弱、最无用的总是最先被吃掉。活着的狗在一旁看着，也明白发生了什么。几条最大胆、最聪明的狗逃离诸神的火堆，因为那里已经成了屠场。它们躲进森林，可到头来不是饿死，就是被狼吃掉。
        - id: ch01-b19
          speaker: narrator
          text: >-
            白牙也在这段苦难中悄悄进了树林。幼年时受过的历练仍在指引他，所以他比别的狗更适合野外生活。他尤其擅长追踪小动物。为了等一只谨慎的树松鼠下到地面，他能藏上几个钟头，盯住它的一举一动。他忍耐得有多久，就饿得有多深。可即使松鼠已经落地，白牙也不急着出手。他要等到确信它来不及逃回树上，才从藏身处猛然射出。他就像一枚灰色的飞矢，快得惊人，每次都能扑中那只逃得不够快的松鼠。
        - id: ch01-b20
          speaker: narrator
          text: >-
            白牙很会捕捉松鼠，可松鼠实在太少，不能让他填饱肚子，更不能让他长胖。他只好寻找更小的猎物。有时饿得太厉害，他甚至从地洞里刨出林鼠。碰上和自己一样饥饿、却凶悍好几倍的鼬，他也照样扑上去厮杀。
        - id: ch01-b21
          speaker: narrator
          text: >-
            饥荒最难熬的时候，白牙也会偷偷回到诸神的火堆附近，但从不真正走进去。他藏在林中，不让人发现。陷阱偶尔捉到猎物，这样的机会少得可怜，他还是会把猎物偷走。有一次，他甚至从灰海狸的套索里偷了一只野兔。那时灰海狸虚弱得喘不过气，在林中走得摇摇晃晃，常常要坐下来休息。
        - id: ch01-b22
          speaker: narrator
          text: >-
            一天，白牙遇见一头年轻的狼。那狼饿得瘦骨嶙峋，四肢关节都松垮无力。如果白牙自己没有挨饿，也许会跟它一起走，最后加入野外同胞的狼群。可他同样饥饿，于是追上年轻的狼，把它杀死吃掉了。
        - id: ch01-b23
          speaker: narrator
          text: >-
            好运似乎一直跟着白牙。食物最难找到时，他总能捕到猎物。他身体虚弱时，也从没碰上更大的猛兽。有一回，他刚吃了一头猞猁，足足吃了两天，一群饿狼就全速追了上来。这场追逐漫长而残酷，可白牙吃得比它们饱，最终甩掉了狼群。他不但逃走，还兜了一个大圈，沿自己的来路折回去，杀掉一个已经筋疲力尽的追兵。
        - id: ch01-b24
          speaker: narrator
          text: >-
            后来，白牙离开那片地方，回到了自己出生的山谷。他在旧洞穴里遇见基奇。她又做出了从前的选择，也离开了已经无法容身的诸神之火，回到旧日藏身处生育幼崽。白牙来到时，一窝幼崽只剩下一只活着，而这唯一的一只也注定活不了多久。在这样的饥荒里，幼小的生命几乎没有活下去的机会。
        - id: ch01-b25
          speaker: narrator
          text: >-
            基奇对长大的儿子毫无亲热之意，白牙却不在乎。他早已不需要母亲了。他平静地掉头离开，沿着溪流向上游跑去。到了岔流，他转向左边，找到很久以前自己和母亲合力恶斗过的那头猞猁的巢穴。他在废弃的洞穴里住下，休息了一天。
        - id: ch01-b26
          speaker: narrator
          text: >-
            初夏时分，饥荒已经到了最后几天。白牙遇见了唇唇。唇唇也逃进了森林，一直在那里勉强维持着悲惨的生命。
        - id: ch01-b27
          speaker: narrator
          text: >-
            这次相遇来得十分突然。它们沿着一道高崖脚下，朝相反的方向小跑，同时绕过一处岩角，迎面撞在一起。两条狗立刻警觉地停下，互相猜疑地盯着对方。
        - id: ch01-b28
          speaker: narrator
          text: >-
            白牙的状态好极了。他最近捕猎顺利，整整一星期都吃得很饱，才刚刚吞下最近捕到的猎物，肚子甚至还有些发撑。可看见唇唇的那一刻，他背上的毛还是全竖了起来。这完全出于本能。过去唇唇欺负迫害他时，那种恐惧和仇恨总会伴着浑身竖起的毛一同出现。从前看见唇唇，他会竖毛低吼。如今还是一样。他没有耽搁，立刻干净利落地出手。唇唇想往后退，白牙却用肩膀猛撞过去，把它撞翻在地，滚成了肚皮朝上。白牙的牙齿随即扎进它瘦削的喉咙。唇唇挣扎着死去，白牙绷直四腿，在旁边警觉地来回走动。随后，他继续上路，沿着高崖脚下跑远了。
        - id: ch01-b29
          speaker: narrator
          text: >-
            不久以后，白牙来到森林边缘。一条狭窄的开阔地从那里斜向麦肯齐河。他以前走过这里，当时地上一无所有，如今却出现了一座村庄。白牙藏在树林里停下，仔细查看。眼前的景象、传来的声音，还有空气里的气味，全都让他觉得熟悉。这就是那座搬到新地方的老村庄，可它已经不像白牙逃走时那样了。呜咽和哭号全都消失，耳边传来的全是心满意足的声音。一个女人正愤怒地喊叫，白牙一听便知道，只有吃饱的人才会这样发怒。空气里还飘着鱼的气味。食物回来了，饥荒结束了。白牙坦然走出森林，穿过营地，径直来到灰海狸的圆锥帐篷。灰海狸不在，克卢库奇却欢呼着迎接他，还给了他一整条刚捕到的鲜鱼。白牙趴下来，等灰海狸回来。
