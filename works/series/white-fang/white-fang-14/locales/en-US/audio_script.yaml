audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: grave and vivid storytelling
        timbre: warm and resonant
        pace: measured
        pitch: medium-low
  chapters:
    - id: ch01
      title: THE FAMINE
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            Spring was near when Grey Beaver's long journey ended. It was April, and White Fang was a year old when he reached the home villages and Mit-sah freed him from the harness. He still had a long way to go before he was fully grown. Even so, only Lip-lip was larger among the village yearlings. White Fang had inherited size and strength from both his wolf father and Kiche, and he already stood nearly as big as the grown dogs. Still, he was not filled out. His frame was lean and long, with tough, wiry strength instead of heavy muscle. His coat was true wolf-grey, and anyone looking at him would have thought he was all wolf. The quarter of dog blood he had from Kiche left no mark on his body, though it had helped shape his mind.
        - id: ch01-b02
          speaker: narrator
          text: >-
            He wandered around the village, quietly pleased to recognize the different people he had known before the long journey. Then he looked over the dogs. There were puppies that had grown up alongside him, and adults that no longer seemed as huge or frightening as the pictures he carried in his memory. He feared them less now. Instead of crouching and keeping out of their way, he walked among them with a casual ease. That confidence was new to him, and he enjoyed it.
        - id: ch01-b03
          speaker: narrator
          text: >-
            One of those dogs was Baseek, an old fellow with a grizzled coat. In earlier days, he only had to show his fangs to send White Fang cringing and turning away. Baseek had taught the cub just how small and unimportant he was. Now that same dog would teach White Fang how much he had developed. While age had steadily weakened Baseek, youth had steadily made White Fang stronger.
        - id: ch01-b04
          speaker: narrator
          text: >-
            White Fang discovered the difference when a freshly killed moose was being cut up and the dogs gathered around it. He seized a hoof and part of the lower leg, with plenty of meat still attached. Then he withdrew from the scramble, carried his prize behind a thicket, and ate where the other dogs could not see him. Baseek suddenly charged in. Before White Fang even knew what he was doing, he slashed the intruder twice and sprang clear. Baseek could only stare stupidly at such nerve and speed. The raw red bone lay on the ground between them.
        - id: ch01-b05
          speaker: narrator
          text: >-
            Baseek had already suffered bitter lessons from younger dogs he used to bully. He had been forced to swallow each of them, and now he called on all his wisdom to deal with this one. In the old days, he would have thrown himself at White Fang in righteous fury. His failing strength would no longer allow it. Instead, he raised his fur and glared threateningly across the bone. Much of White Fang's old awe came back. He seemed to wilt and shrink as he searched for a way to retreat without looking completely beaten.
        - id: ch01-b06
          speaker: narrator
          text: >-
            That was where Baseek made his mistake. If he had only kept glaring, White Fang would have backed off and surrendered the meat. Instead, Baseek assumed he had won and stepped toward it. He lowered his head to smell it, and White Fang's fur lifted a little. Baseek still could have stood over the meat and stared him down. But its fresh scent filled his nose, and greed made him bend down for a bite.
        - id: ch01-b07
          speaker: narrator
          text: >-
            That was more than White Fang could endure. After months of ruling his teammates, he could not stand quietly by while another dog ate meat that belonged to him. As always, he attacked without warning. His first slash tore Baseek's right ear to ribbons. The old dog was stunned by the sudden blow, but worse came just as quickly. White Fang knocked him off his feet and bit his throat. As Baseek struggled up, the young dog sank his teeth into the old dog's shoulder twice. Baseek made one useless rush in return, snapping furiously at empty air. A moment later his nose was split open, and he staggered backward away from the meat.
        - id: ch01-b08
          speaker: narrator
          text: >-
            Now White Fang stood bristling over the bone, while Baseek prepared to retreat. The old dog would not risk fighting this young flash of lightning. Once more, and more painfully than ever, he understood how weak age had made him. Still, he tried to preserve his dignity. He calmly turned his back as if White Fang and the bone meant nothing to him, then walked grandly away. Only when he was safely out of sight did he stop to lick his wounds.
        - id: ch01-b09
          speaker: narrator
          text: >-
            The victory gave White Fang more confidence and pride. He no longer moved so softly around the grown dogs, and he was less willing to give way. That did not mean he went looking for trouble. He did nothing of the kind. But he demanded the right to pass without being bothered, and he refused to leave the trail for any dog. From now on, they had to take him into account. He could no longer be ignored as a mere puppy. His former teammates still moved aside for adult dogs and surrendered their meat when forced, but White Fang did neither. He remained lonely, grim, and distant, hardly glancing to either side. His forbidding manner puzzled the older dogs, yet they accepted him as an equal. After a few encounters, they learned not to attack him or offer friendship. If they left him alone, he left them alone, and they found that arrangement suited them very well.
        - id: ch01-b10
          speaker: narrator
          text: >-
            In midsummer, White Fang trotted toward a new tepee at the edge of the village and suddenly met Kiche. He stopped and studied her. His memory was faint, but he did remember. Kiche did not. She lifted her lip in the old threatening snarl, and his whole cubhood came rushing back. Before he knew the people, she had been the center of his world. His old love surged up, and he bounded toward her with joy. Her sharp teeth met him and cut his cheek to the bone. He backed away, bewildered.
        - id: ch01-b11
          speaker: narrator
          text: >-
            Kiche was not to blame. A wolf mother was not made to remember cubs after a year or so. To her, White Fang was a strange intruder, and she had a new litter to defend.
        - id: ch01-b12
          speaker: narrator
          text: >-
            One of the puppies sprawled toward White Fang. They were half brothers, though neither of them knew it. White Fang sniffed the little one with curiosity. At once Kiche rushed him and gashed his face a second time, forcing him to back farther away. The old memories and feelings faded again. They returned to the grave they had risen from. White Fang watched Kiche lick her puppy and pause now and then to snarl at him. She had no value to him anymore. He had learned to live without her, and even the meaning she once held had been forgotten. There was no place for her in the way his life now worked, just as there was no place for him in hers.
        - id: ch01-b13
          speaker: narrator
          text: >-
            He was still standing there, dazed and confused, when Kiche attacked a third time to drive him completely away. White Fang let her do it. She was a female of his kind, and the males did not fight the females. He had never reasoned out that law or learned it through experience. Instinct told him, just as instinct made him howl at the moon and stars and fear death and the unknown.
        - id: ch01-b14
          speaker: narrator
          text: >-
            As the months passed, White Fang became stronger, heavier, and more solid. At the same time, his character kept developing under the pull of what he had inherited and what life had taught him. His inborn nature was like clay. It held many possibilities and could be molded into many forms. His surroundings were the hands that gave the clay its final shape. If White Fang had never come to the fires of men, the Wild would have shaped him into a true wolf. But the gods had placed him in a different world. That world made him into a dog, though he was still a very wolfish dog.
        - id: ch01-b15
          speaker: narrator
          text: >-
            So the clay of his nature and the pressure of his surroundings continued to shape one particular character. White Fang could not escape that shaping. He grew more grim, more unfriendly, more solitary, and more fierce. The other dogs learned more clearly each day that peace with him was much better than war. Grey Beaver, meanwhile, came to value White Fang more and more as time passed.
        - id: ch01-b16
          speaker: narrator
          text: >-
            White Fang seemed to be made entirely of strength, but he had one weakness that always overcame him. He could not bear to be laughed at. People could laugh among themselves about anything they liked, and he paid no attention. The moment their laughter turned toward him, however, he flew into a terrible rage. He was usually grave, dignified, and gloomy. Being laughed at hurt and confused him so badly that for hours he behaved like a demon. Any dog that crossed him then was in danger. White Fang knew the law too well to attack Grey Beaver. Behind his master stood a club and the power of a god. Behind the other dogs lay nothing but open space, and into that space they fled whenever laughter drove White Fang mad.
        - id: ch01-b17
          speaker: narrator
          text: >-
            In White Fang's third year, a great famine struck the Mackenzie people. The fish failed that summer. In winter, the caribou abandoned the trail they usually followed. Moose became scarce, and rabbits almost disappeared. The animals that hunted for a living lost their usual food. Hunger weakened them until they turned on one another, killing and eating their own kind. Only the strong survived. White Fang's gods were hunters too. Their old and weak died of hunger, and the village filled with mourning. Women and children went without food so the little they had could fill the bellies of the thin, hollow-eyed hunters. Day after day, those men walked through the forest in a useless search for meat.
        - id: ch01-b18
          speaker: narrator
          text: >-
            Hunger drove the people to desperate extremes. They ate the soft leather of their moccasins and mittens. The dogs chewed the harnesses from their own backs and ate even the leather lashes from the whips. Then the dogs began eating one another, and the people began eating the dogs. The weakest and least useful were killed first. The dogs that remained watched all of this and understood what was happening. A few of the boldest and wisest abandoned the fires of the gods, which had become a slaughter place, and escaped into the forest. But leaving did not save them. In the end, they either starved to death or were eaten by wolves.
        - id: ch01-b19
          speaker: narrator
          text: >-
            During that time of misery, White Fang also slipped away into the woods. His lessons as a cub had prepared him for life there better than the other dogs. He became especially skilled at stalking small creatures. For hours he would lie hidden and watch every move of a cautious tree squirrel. His patience was as great as the hunger inside him. Even when the squirrel finally dared to come down onto the ground, White Fang did not attack too soon. He waited until he was certain he could strike before it reached the safety of a tree. Only then did he shoot from hiding like a grey projectile, moving with incredible speed and never missing the fleeing squirrel that could not flee fast enough.
        - id: ch01-b20
          speaker: narrator
          text: >-
            But even his success could not keep him alive and growing fat on squirrels, because there were never quite enough of them. Hunger forced him to hunt still smaller prey. Sometimes it grew so sharp that he was willing to dig wood mice from their burrows in the ground. Nor would he refuse a battle with a weasel that was just as hungry as he was and many times more ferocious.
        - id: ch01-b21
          speaker: narrator
          text: >-
            When the famine squeezed him hardest, White Fang stole back near the fires of the gods, but he would not go among those fires. He stayed hidden in the forest and carefully avoided discovery. On the rare occasions when the people's snares actually caught game, he robbed them. He even stole a rabbit from one of Grey Beaver's snares. By then, his master was so weakened by hunger and so short of breath that he staggered and tottered through the forest, often having to sit down and rest.
        - id: ch01-b22
          speaker: narrator
          text: >-
            One day he met a young wolf, thin, starved, and loose in the joints. If White Fang had not been hungry himself, he might have joined the wolf and eventually found a place among his wild brothers. Instead, he chased the young wolf down, killed him, and ate him.
        - id: ch01-b23
          speaker: narrator
          text: >-
            Fortune seemed to favor White Fang. Whenever hunger pressed him hardest, he found something to kill. Whenever weakness made him vulnerable, he was lucky enough not to meet any of the larger hunting animals. Once, he killed a lynx and fed on it for two days. That meal had made him strong when a starving wolf pack came charging straight at him. The chase that followed was long and cruel, but White Fang was better fed than his pursuers. In the end, he outran them. He did more than escape. Circling far around and returning along his own trail, he caught one of the wolves after the animal had exhausted itself in the chase.
        - id: ch01-b24
          speaker: narrator
          text: >-
            After that, White Fang left that part of the country and traveled to the valley where he had been born. In the old lair, he found Kiche. She had returned to her old ways. Like White Fang, she had fled the cruel and unwelcoming fires of the gods. She had gone back to her old refuge so she could give birth to her young. But when White Fang came upon the den, only one cub from the entire litter remained alive. That last cub was not meant to live much longer either. Young life had very little chance during such a famine.
        - id: ch01-b25
          speaker: narrator
          text: >-
            Kiche did not greet her grown son with affection, but White Fang did not care. He had outgrown his mother. He turned away without fuss and trotted upstream. At the forks, he took the left branch and found the den of the lynx he and Kiche had fought long ago. The den was empty now, so he settled there and rested for a day.
        - id: ch01-b26
          speaker: narrator
          text: >-
            In early summer, near the end of the famine, White Fang met Lip-lip. The other dog had also escaped into the woods and barely managed to survive there.
        - id: ch01-b27
          speaker: narrator
          text: >-
            The meeting came without warning. They were trotting toward each other below a high bluff when they rounded a rock and stood face to face. Both stopped in alarm and watched the other suspiciously.
        - id: ch01-b28
          speaker: narrator
          text: >-
            White Fang was in splendid condition. Hunting had been good, and for a full week he had eaten as much as he wanted. He was even stuffed from his latest kill. Yet the instant he looked at Lip-lip, the hair rose along the whole length of his back. The reaction came on its own. In the past, Lip-lip's bullying and persecution had always produced that same state in both White Fang's body and mind. Now his body remembered before his mind could act. Just as he had always done at the sight of Lip-lip, he automatically bristled and snarled.
        - id: ch01-b29
          speaker: narrator
          text: >-
            White Fang wasted no time, and he did the work quickly and completely. Lip-lip tried to back away, but White Fang struck him hard, shoulder against shoulder. Lip-lip was knocked down and rolled onto his back. White Fang's teeth drove into his thin throat. There was a final struggle. Through it, White Fang walked around his fallen enemy with stiff legs, watching closely. When it was over, he simply resumed his course and trotted onward along the foot of the bluff.
        - id: ch01-b30
          speaker: narrator
          text: >-
            One day not long afterward, White Fang reached the edge of the forest. Below him, a narrow strip of open ground sloped toward the Mackenzie. He had crossed that ground before when it was bare, but a village stood there now. Still hidden among the trees, he stopped to study everything before him. The sights, sounds, and scents were familiar. This was the old village moved to a new place. Yet what reached his senses was very different from what he had left behind when he fled. No one whimpered or wailed. Instead, his ears were greeted by the sounds of people who were content. When he heard the angry voice of a woman, he knew it was the kind of anger that came from a full stomach. And in the air, he smelled fish. There was food again. The famine was gone.
        - id: ch01-b31
          speaker: narrator
          text: >-
            White Fang came boldly out of the forest and trotted straight to Grey Beaver's tepee. Grey Beaver was away, but Kloo-kooch greeted him with joyful cries and gave him a whole fresh-caught fish.
        - id: ch01-b32
          speaker: narrator
          text: >-
            White Fang lay down to wait for Grey Beaver to return.
