audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 沉着克制，带着北国故事的冷峻张力
        timbre: 温厚清晰，略显低沉
        pace: 舒缓而有变化
        pitch: 中低
    crowd_man:
      display_name: 围观者
      tts:
        delivery: 粗野起哄，带着看热闹的兴奋
        timbre: 粗哑有力
        pace: 明快
        pitch: 中
    scott:
      display_name: 威登·斯科特
      tts:
        delivery: 正直果断，愤怒时依然清醒
        timbre: 清朗坚实
        pace: 稳健有力
        pitch: 中低
    matt:
      display_name: 马特
      tts:
        delivery: 老练朴实，说话直接
        timbre: 粗粝温厚
        pace: 从容
        pitch: 低
    tim_keenan:
      display_name: 蒂姆·基南
      tts:
        delivery: 油滑傲慢，故意拖腔
        timbre: 干涩粗硬
        pace: 稍慢
        pitch: 中低
    beauty_smith:
      display_name: 美人史密斯
      tts:
        delivery: 阴狠怯懦，受逼迫时畏缩尖刻
        timbre: 刺耳干涩
        pace: 偏快
        pitch: 中高
  chapters:
    - id: ch01
      title: 陌生的对手
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            美人史密斯解下白牙脖子上的铁链，退到后面。这一次，白牙竟没有马上进攻。他竖着双耳，警觉又好奇地望着对面的陌生动物。他从没见过这样的狗。蒂姆·基南推了斗牛犬一把，低声催他上阵。那家伙又矮又壮，模样笨拙，摇摇摆摆走到圈子中央，停下来眨眼看着白牙。
        - id: ch01-b02
          speaker: crowd_man
          text: “上啊，切罗基！咬他！把他吃掉！”
        - id: ch01-b03
          speaker: narrator
          text: >-
            切罗基却一点也不着急。他回头看着叫喊的人，短尾巴还和气地摇着。他不是害怕，只是懒得动。在他看来，人们不会真叫他跟眼前这条狗打。他从没跟这种狗交过手，还以为真正的对手没有带来呢。蒂姆·基南走进场内，弯腰抚弄他的肩膀。那双手逆着毛摩擦，一下下把他往前推，既在催促，也在激怒他。切罗基的喉咙深处响起轻轻的低吼，正好跟手上的动作合拍。每推到头，吼声便陡然升高。手一收回，声音又落下去，等下一推开始再度响起。
        - id: ch01-b04
          speaker: narrator
          text: >-
            白牙也受到了影响。他从颈后到肩头的毛渐渐竖起。蒂姆·基南最后猛推一把，便向后退开。那股力量消失以后，切罗基仍自己向前跑去，两条弯腿迈得飞快。白牙就在这时出手了。观众惊叹起来。他像猫一样掠过两者之间的距离，又以猫一般的迅疾撕下一口，立刻跃开。
        - id: ch01-b05
          speaker: narrator
          text: >-
            切罗基一只耳朵后面的粗颈被撕破，鲜血流了出来。他却毫无表示，连咆哮也没有，只转身继续追。一个迅捷，一个沉稳，看客立刻分成两派，纷纷下起新赌注，还给原来的赌注加码。白牙一再扑近，咬上一口，再毫发无伤地退开。这个古怪的对手始终跟着他，不快也不慢，每一步都坚定得像在专心办一件正事。他似乎认准了自己要做什么，无论发生什么，也不能叫他忘掉那个目的。
        - id: ch01-b06
          speaker: narrator
          text: >-
            切罗基的整个神态，每个动作，都带着那股执意，叫白牙困惑。他从没见过这样的狗。对方没有厚毛护身，皮肉柔软，轻易便会流血。白牙过去咬同种的狗时，牙齿常被厚厚的毛结挡住，可这一次，獠牙总能轻易陷进松软的肉里。切罗基却好像不会防卫。更不寻常的是，他从不像别的狗那样惨叫。除了一声低吼或闷哼，他默默承受所有撕咬，追赶的脚步也从不松懈。
        - id: ch01-b07
          speaker: narrator
          text: >-
            切罗基并不迟缓。他转身和打旋都足够快，可每一次扑到眼前，白牙总已闪开。他也像白牙一样困惑，不明白为什么这个对手不肯近身厮打。从前交手时，双方总有一样的念头，都想靠近，都想紧紧咬住。眼前的白牙却始终保持距离，只在他前后左右来回跳跃、躲闪。即便牙齿已经咬中了切罗基，他也不肯抓牢，而是立即松口，转眼又窜到了远处。
        - id: ch01-b08
          speaker: narrator
          text: >-
            可白牙同样有够不到的地方。切罗基太矮，硕大的双颚又护住了喉咙下方的软肉。白牙不断扑进扑出，自己没有受伤，切罗基的脑袋和颈侧却添了一道又一道伤口。他满身流血，没有丝毫慌乱，仍踏着沉重的步子向前。有一回，他暂时想不出办法，干脆完全停了下来。他眨着眼睛看看周围的观众，还摇动那截短尾巴，仿佛在告诉大家，他并没有厌倦，仍然很愿意继续打。
        - id: ch01-b09
          speaker: narrator
          text: >-
            白牙趁机冲来，撕破了他只剩一点的耳朵，随即闪开。切罗基终于微微动怒。他沿内圈紧追，想把致命的一口扣在白牙喉间，只差一点便成功了。白牙突然反向折回，逃出了危险，人群又高声喝彩。
    - id: ch02
      title: 咬住不放
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            时间慢慢过去。白牙仍在圈内舞动，闪避，折返，扑进又跃出，每一次都给对手增添新的伤口。切罗基则带着阴沉的把握，吃力地跟在后面。他知道迟早会达到自己的目的，咬到决定胜负的那一口。在那之前，白牙能够给他多少伤害，他便承受多少。两只耳朵已经被撕成穗子，颈肩被划开了二十来处，连嘴唇也破了，鲜血不断流下。白牙的獠牙快得像闪电，切罗基既无法预料，也来不及防备。
        - id: ch02-b02
          speaker: narrator
          text: >-
            白牙屡次想撞倒切罗基，可两条狗的身高相差太多。这条斗牛犬实在太矮，也太敦实，身体几乎贴着地面。白牙把同一招用得太多，终于出了错。那一次，他快速折返，又换了方向绕圈，正撞见切罗基转得较慢，脑袋朝着别处，肩头毫无遮挡。他全力撞过去，自己的肩膀却高出太多，冲势又太猛，身体竟顺着那股力量，从切罗基身上翻了过去。观众第一次看见白牙在搏斗中失去立足之处。他在半空翻了半圈，眼看就要仰面摔下。白牙急忙像猫一样扭转身体，拼命把四足转向地面。可他还是重重跌在侧腹上。下一刻，他刚刚站起，切罗基的牙齿已经扣住他的喉间。
        - id: ch02-b03
          speaker: narrator
          text: >-
            这一口位置太低，靠近胸膛，并不算好，可切罗基一旦咬住便再不松开。白牙跳起来疯狂冲撞，想把斗牛犬甩掉。这个紧紧黏住、拖在身上的重量叫他发了狂。它限制他的动作，夺走他的自由，简直像捕兽夹。白牙所有的本能都在反抗。接下来的几分钟，他完全失去了理智。体内最原始的生命控制了他，血肉只有一个念头，就是活下去，就是不停地动。智慧已经消失，盲目的求生渴望把理智推翻了。
        - id: ch02-b04
          speaker: narrator
          text: >-
            白牙绕着圈狂奔，不停旋转、掉头、折返，拼命甩动喉间那五十磅重的身体。切罗基只管咬住。偶尔，他的四足能够落地，抵住白牙一会儿，转眼又失去立足之处，被拖进疯狂的旋转里。他只听从自己的本能，也知道咬住便是对的。有时，一阵满足甚至叫他闭上眼睛，任身体被甩来甩去，根本不管会不会受伤。伤痛不重要，重要的是这一口绝不能松。
        - id: ch02-b05
          speaker: narrator
          text: >-
            白牙一直挣扎到精疲力尽，才终于停下。他做什么都没有用，也无法理解眼前的事。从前的狗总是扑来，撕咬，再退开，从没有谁这样贴在他身上。他半侧着身子躺下，大口喘气。切罗基仍旧咬着，还把身体压过去，想让他彻底侧倒。白牙奋力抵抗，也能感觉那双颚正在一点点移动。牙齿稍稍松开，马上又像咀嚼一样合拢。每动一次，咬住的地方就离咽喉更近。切罗基的办法很简单，先牢牢守住已经咬到的地方，等机会来了，再往里多咬一点。白牙一安静，机会便来了。白牙一挣扎，他就不再挪动，只守住原处。
        - id: ch02-b06
          speaker: narrator
          text: >-
            白牙只能咬到切罗基隆起的后颈。他抓住颈肩相接的地方，可他既不懂一点点啃进去的打法，那双颚也不适合这样做。他只好断断续续地用獠牙又撕又扯。没过多久，两条狗的位置发生变化，打断了他的反击。切罗基设法把他翻得仰面朝天，自己仍咬着喉咙，压在上方。白牙像猫一样弓起后半身，四足蹬进对手的腹部，用长爪一下下猛抓。切罗基若不是赶紧绕着咬住的地方转开身子，从白牙身上撤下来，与他成了直角，恐怕已经被开膛了。
        - id: ch02-b07
          speaker: narrator
          text: >-
            那双颚像命运本身一样无从逃脱，正沿着颈部的大血管慢慢向上挪。白牙还没有死，只因为颈上的松皮与厚毛在切罗基嘴里挤成了很大一团。毛发塞在牙齿之间，几乎叫它们无法合拢。但每逢有机会，切罗基就把更多松皮和毛含进口中。结果没有改变，白牙正被一点点扼住。每过一刻，他吸气都比先前更加困难。
        - id: ch02-b08
          speaker: narrator
          text: >-
            众人都觉得胜负已定。押切罗基的人兴高采烈，开出荒唐的赔率。押白牙的人却十分沮丧，十赔一、二十赔一也不肯接。只有美人史密斯接下了一笔五十赔一的赌注。他走进圈子，伸手指着白牙，轻蔑地大笑。那笑声果然激起了白牙的怒火。他榨出最后的力量，重新站起来。可拖着咬在喉间的五十磅对手绕圈挣扎时，愤怒很快变成了恐慌。体内最根本的生命又一次占据了他，血肉的求生意志赶走了全部智慧。他绕过去，又折回来，跌倒，又爬起。有时，他甚至用后腿站立，把切罗基整个提离地面。可一切挣扎都没有用，他始终甩不掉这个紧咬不放的死神。
        - id: ch02-b09
          speaker: narrator
          text: >-
            白牙终于耗尽力气，向后倒下。切罗基立刻把双颚挪得更深，咬烂更多裹着毛的皮肉，把他扼得更紧。观众为胜者喝彩，不停高喊切罗基的名字。斗牛犬用力摇着短尾巴回应，可欢呼声并没有分散他的注意。尾巴尽管摇，那双可怕的颚仍旧死死扣在白牙喉间。
    - id: ch03
      title: 清醒的愤怒
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            就在这时，观众的注意被别处吸引了。铃铛声和赶狗人的呼喝从远处传来。除了美人史密斯，所有人都不安地望过去，大家都怕警察找上门。可来的不是警察，而是两个驾着狗拉雪橇的人。他们从小路上方沿溪而下，并非从城镇方向过来，显然刚结束一次勘探。两人见这里围着人，便停住狗队，走来看看究竟是什么事这样热闹。赶狗人留着小胡子。另一个年轻些，也高大些，脸刮得干干净净。血液因奔跑而涌动，再加上严寒空气的拍打，叫他的脸色透着红润。
        - id: ch03-b02
          speaker: narrator
          text: >-
            白牙几乎不再挣扎，偶尔才徒劳地抽动一下。他本就吸不进多少空气，无情的双颚还在不断收紧。幸亏切罗基第一口咬得太低，几乎落在胸前。否则，就算有厚毛护住，白牙喉间的大血管也早被撕开了。切罗基花了很长时间，才把咬住的地方一点点向上移。这个缓慢的过程也让越来越多松皮和厚毛塞进牙间，使那双颚更难彻底合拢。正是这些偶然凑到一起的阻碍，才让白牙活到现在。
        - id: ch03-b03
          speaker: narrator
          text: >-
            美人史密斯心里那头卑劣的野兽，此刻爬进脑子，压倒了他原本就不多的理智。他看见白牙的眼睛渐渐失去光彩，知道自己输定了，竟扑过去凶狠地踢他。人群只是发出嘘声和几句抗议，除此以外，没有谁阻止。美人史密斯继续踢打时，那个高大的年轻人已经从人堆里硬挤进来。他毫不客气，也不肯放慢脚步，只用肩膀把左右挡路的人撞开。他闯进圈子时，美人史密斯正要再踢一脚，全身重量都落在一条腿上，站得很不稳。年轻人的拳头正中他的脸。美人史密斯另一只脚也离开地面，整个身体像被提了起来，向后翻倒，重重砸进雪里。年轻人随即转身面对人群。
        - id: ch03-b04
          speaker: scott
          text: “你们这些懦夫！你们这些畜生！”
          emotion: angry
        - id: ch03-b05
          speaker: narrator
          text: >-
            他同样怒不可遏，可这是一种清醒的愤怒。灰色的眼睛扫过众人，闪着金属与钢铁般的冷光。美人史密斯爬起来，抽着鼻子，畏缩地走向他。年轻人不了解这个家伙，不知道他其实卑怯到了极点，还以为他是回来动手的。于是，他又骂了一声畜生，第二拳砸在美人史密斯脸上，再次将他打得向后翻倒。美人史密斯认定雪地才是最安全的地方，便老老实实躺在摔倒之处，再也不肯起身。
        - id: ch03-b06
          speaker: scott
          text: “马特，快来搭把手。”
        - id: ch03-b07
          speaker: narrator
          text: >-
            两人一同俯身。马特抓住白牙，只等切罗基松口便往外拉。年轻人双手抓住斗牛犬的上下颚，拼命想把它们掰开，可全无用处。每拉扯一次，每喘出一口气，他都忍不住骂一声畜生。围观的人渐渐骚动，有些还抱怨他们坏了这场好戏。年轻人抬头狠狠一瞪，那些声音立刻安静下来。
        - id: ch03-b08
          speaker: scott
          text: “你们这些该死的畜生！”
          emotion: angry
        - id: ch03-b09
          speaker: matt
          text: “没用的，斯科特先生。这样掰不开它们。”
        - id: ch03-b10
          speaker: narrator
          text: 两人停下手，查看仍旧锁在一起的两条狗。
        - id: ch03-b11
          speaker: matt
          text: “血没流多少。牙还没完全咬进去。”
        - id: ch03-b12
          speaker: scott
          text: “可随时都会咬进去。看见了吗？他刚刚又往里挪了一点。”
        - id: ch03-b13
          speaker: narrator
          text: >-
            斯科特越来越焦急，也越来越担心白牙。他一再狠打切罗基的脑袋，那双颚还是不松。切罗基只摇着短尾巴，仿佛在说，他明白这些打击的意思，可他认定自己没有做错，守住这一口正是他的本分。
        - id: ch03-b14
          speaker: scott
          text: “你们就没有一个人肯来帮忙吗？”
          emotion: fearful
        - id: ch03-b15
          speaker: narrator
          text: >-
            没有人上前。大家反倒冷嘲热讽地为他喝彩，还七嘴八舌地抛来些取笑人的主意。
        - id: ch03-b16
          speaker: matt
          text: “得找一样东西，把他的嘴撬开。”
    - id: ch04
      title: 撬开死亡之口
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            斯科特从腰间枪套里拔出左轮手枪，把枪口往斗牛犬的双颚之间塞。他推得很用力，钢铁擦过紧咬的牙齿，声音刺耳而清楚。两人都跪在雪上，俯身围住两条狗。蒂姆·基南大步走进圈子，在斯科特身边停下，拍拍他的肩膀，话里带着威胁。
        - id: ch04-b02
          speaker: tim_keenan
          text: “陌生人，别把他的牙弄坏了。”
          emotion: angry
        - id: ch04-b03
          speaker: scott
          text: “那我只好扭断他的脖子。”
        - id: ch04-b04
          speaker: narrator
          text: 斯科特说着，仍用枪口往里推挤。
        - id: ch04-b05
          speaker: tim_keenan
          text: “我再说一次，别弄坏他的牙。”
          emotion: angry
        - id: ch04-b06
          speaker: narrator
          text: >-
            这番威吓没能奏效。斯科特手上不停，只冷静地抬起眼睛。
        - id: ch04-b07
          speaker: scott
          text: “这是你的狗？”
        - id: ch04-b08
          speaker: narrator
          text: 蒂姆·基南哼了一声。
        - id: ch04-b09
          speaker: scott
          text: “那就过来，把他的嘴弄开。”
        - id: ch04-b10
          speaker: tim_keenan
          text: “这个嘛，陌生人，我不妨告诉你，这办法我自己还没琢磨出来。我不知道该怎么做。”
        - id: ch04-b11
          speaker: scott
          text: “那就让开，别打扰我。我正忙着。”
        - id: ch04-b12
          speaker: narrator
          text: >-
            蒂姆·基南还站在头顶，斯科特已经不再理他。枪口从一侧塞进了牙关，他又设法让它穿到另一侧。等枪口终于卡好，斯科特不敢猛撬，只能小心地一点点撑开双颚。每当牙关松开一线，马特就把白牙被咬烂的脖颈往外抽出一点。两个人一寸一寸地做着，既不能让切罗基重新咬紧，也不能再伤到已经奄奄一息的白牙。
        - id: ch04-b13
          speaker: scott
          text: “抓好你的狗，准备把他接过去。”
        - id: ch04-b14
          speaker: narrator
          text: 蒂姆·基南顺从地弯下腰，牢牢抓住切罗基。
        - id: ch04-b15
          speaker: scott
          text: “现在！”
        - id: ch04-b16
          speaker: narrator
          text: >-
            斯科特完成最后一撬，两条狗终于被拉开。切罗基还在拼命挣扎。
        - id: ch04-b17
          speaker: scott
          text: “把他带走。”
        - id: ch04-b18
          speaker: narrator
          text: >-
            蒂姆·基南把还在用力挣扎的切罗基拖回人群。白牙几次想站起来，都没能成功。有一次，他勉强撑起身体，双腿却虚弱得承不住他，于是慢慢瘫软，重新倒进雪里。他半闭着眼睛，眼球蒙着玻璃般的光。嘴巴张开，舌头从牙缝间垂出来，又脏又软。无论怎么看，他都像一条已经被勒死的狗。马特跪在旁边，仔细检查他的情形。
        - id: ch04-b19
          speaker: matt
          text: “差不多要完了，不过他还能好好喘气。”
    - id: ch05
      title: 白牙易主
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 美人史密斯这时也从雪地上爬了起来。他慢慢走到近前，站在一旁，低头查看躺在地上、几乎一动不动的白牙。
        - id: ch05-b02
          speaker: scott
          text: “马特，一条好雪橇犬能值多少钱？”
        - id: ch05-b03
          speaker: narrator
          text: 马特仍跪在地上，俯身守着白牙。他估算了一会儿。
        - id: ch05-b04
          speaker: matt
          text: “三百美元。”
        - id: ch05-b05
          speaker: scott
          text: “那这条被咬得满身是伤的呢？还能值多少？”
        - id: ch05-b06
          speaker: narrator
          text: 斯科特用脚轻轻碰了碰白牙。
        - id: ch05-b07
          speaker: matt
          text: “一半吧。”
        - id: ch05-b08
          speaker: narrator
          text: 斯科特转身面对美人史密斯。
        - id: ch05-b09
          speaker: scott
          text: “听见了吗，畜生先生？这条狗我要了，给你一百五十美元。”
        - id: ch05-b10
          speaker: narrator
          text: >-
            斯科特打开钱夹，当场数出钞票，递到美人史密斯面前。美人史密斯却把双手藏到背后，摆明了不肯碰那些钱。
        - id: ch05-b11
          speaker: beauty_smith
          text: “我不卖。”
        - id: ch05-b12
          speaker: scott
          text: “不，你会卖。因为我已经买下了。钱在这里，狗归我。”
        - id: ch05-b13
          speaker: narrator
          text: >-
            美人史密斯还是把双手藏在背后，一步步往后退。斯科特突然朝他冲去，拳头已经向后扬起，准备再打。美人史密斯立刻畏缩地弯下身体，等着那一拳落到身上。
        - id: ch05-b14
          speaker: beauty_smith
          text: “我有我的权利。”
          emotion: fearful
        - id: ch05-b15
          speaker: scott
          text: “你已经没资格再养这条狗。你拿不拿钱？还是要我再揍你一次？”
        - id: ch05-b16
          speaker: beauty_smith
          text: “好吧。不过我拿钱，不等于我愿意卖。这条狗能赚大钱，你不能就这么抢走。谁都有自己的权利。”
          emotion: fearful
        - id: ch05-b17
          speaker: scott
          text: “说得对。人有人的权利。可你不是人，你是畜生。”
        - id: ch05-b18
          speaker: narrator
          text: 斯科特说完，把钱交给了他。
        - id: ch05-b19
          speaker: beauty_smith
          text: “等我回到道森，我就去告你。”
          emotion: angry
        - id: ch05-b20
          speaker: scott
          text: “你回到道森以后，只要敢开口，我就让人把你赶出城。听懂了吗？”
        - id: ch05-b21
          speaker: narrator
          text: 美人史密斯只哼了一声。
        - id: ch05-b22
          speaker: scott
          text: “我问你听懂了吗？”
          emotion: angry
        - id: ch05-b23
          speaker: beauty_smith
          text: “懂了。”
          emotion: angry
        - id: ch05-b24
          speaker: narrator
          text: 他一边回答，一边向后缩去。
        - id: ch05-b25
          speaker: scott
          text: “懂了什么？”
        - id: ch05-b26
          speaker: beauty_smith
          text: “懂了，先生。”
          emotion: angry
        - id: ch05-b27
          speaker: crowd_man
          text: “当心！他会咬人！”
        - id: ch05-b28
          speaker: narrator
          text: >-
            人群哄堂大笑。斯科特转过身，把美人史密斯丢在背后，回去帮助正在照料白牙的马特。这场搏斗已经结束，有些人开始离开，另一些仍三五成群地站着，一边看着雪地上的白牙，一边谈论刚才发生的事。蒂姆·基南也走进其中一群人。他没有再去碰斯科特，却忍不住打听这个陌生人的来历。
        - id: ch05-b29
          speaker: tim_keenan
          text: “刚才那家伙是谁？”
        - id: ch05-b30
          speaker: crowd_man
          text: “威登·斯科特。”
        - id: ch05-b31
          speaker: tim_keenan
          text: “威登·斯科特到底是什么人物？”
        - id: ch05-b32
          speaker: crowd_man
          text: “他是顶尖的采矿专家，跟那些大人物都有交情。听我一句，你要是不想惹麻烦，就离他远点。他和官员熟得很，黄金专员还是他的特殊朋友。”
        - id: ch05-b33
          speaker: tim_keenan
          text: “我就知道他有点来头。所以一开始，我才没动手碰他。”
