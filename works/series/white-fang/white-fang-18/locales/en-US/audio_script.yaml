  chapters:
    - id: ch01
      title: THE CLINGING DEATH
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            Beauty Smith slipped the chain from White Fang's neck and moved back. Yet White Fang did not attack at once. He stood motionless, ears pointed forward, watching the strange animal across from him. He had never seen a dog like this one.
        - id: ch01-b02
          speaker: tim_keenan
          text: Go on. Get at him.
        - id: ch01-b03
          speaker: narrator
          text: >-
            Tim Keenan pushed the bulldog forward. Cherokee waddled to the middle of the ring on short, bowed legs, then stopped and blinked at White Fang.
        - id: ch01-b04
          speakers: [crowd_man_1, crowd_man_2, crowd_man_3]
          ensemble: chorus
          text: Go get him, Cherokee! Sick him! Eat him up!
        - id: ch01-b05
          speaker: narrator
          text: >-
            Cherokee did not look eager to fight. He blinked at the shouting men and wagged the stump of his tail in a friendly way. He was not frightened. He was simply lazy, and White Fang did not look like the kind of dog he was used to fighting. Cherokee seemed to be waiting for someone to bring out the real dog.
        - id: ch01-b06
          speaker: narrator
          text: >-
            Tim stepped into the ring and bent over Cherokee. He rubbed both sides of the dog's shoulders, pushing his hands against the grain of the hair. Each stroke ended with a small shove forward. The movements carried a clear suggestion, and they began to irritate Cherokee. A very soft growl stirred deep in his throat. It rose as each push reached its end, faded as the hand drew back, then began again with the next stroke. The rubbing and the growling kept the same steady beat, with each abrupt shove bringing a sharp rise in the sound.
        - id: ch01-b07
          speaker: narrator
          text: >-
            The sound and movement had their effect on White Fang. The hair lifted along his neck and over his shoulders. Tim gave Cherokee one last hard shove and stepped aside. For a moment, the force of that push carried the bulldog forward. When it died away, Cherokee continued by choice, trotting fast on his bowed legs. Then White Fang struck. The crowd cried out in startled wonder. He covered the space more like a cat than a dog. With the same catlike speed, he slashed with his fangs and sprang clear before Cherokee could answer.
        - id: ch01-b08
          speaker: narrator
          text: >-
            Blood ran behind one of Cherokee's ears where White Fang had ripped the thick neck. Cherokee showed no reaction. He neither cried nor snarled. He only turned and followed. The crowd grew excited by the contrast between them, White Fang so quick and Cherokee so steady. Men called out new bets and added more money to the old ones. Again White Fang rushed in, cut him, and escaped untouched. Then he did it again. Still the strange dog followed. Cherokee did not hurry too much, but neither was he slow. He moved with calm determination, almost as if this were ordinary work. He had one thing to do, and nothing could turn him from it.
        - id: ch01-b09
          speaker: narrator
          text: >-
            That single purpose showed in every movement Cherokee made, and White Fang could not understand it. He had never met a dog like this. Cherokee had no thick coat to protect him. His body was soft, and he bled easily. White Fang's teeth did not meet the heavy mat of fur that usually slowed them when he fought dogs of his own kind. Every bite sank straight into yielding flesh. Yet Cherokee seemed unable to defend himself and did not appear troubled by that. He gave no howl of pain. Except for an occasional growl or grunt, he accepted every slash in silence. Through it all, he never stopped following.
        - id: ch01-b10
          speaker: narrator
          text: >-
            That did not mean Cherokee was slow. He could turn and whirl quickly enough, but White Fang was never there when he finished. Cherokee was puzzled in his own way. He had never fought a dog he could not close with. Before this, both fighters had always wanted to come together and hold on. White Fang wanted nothing of the kind. He kept his distance, dancing and dodging from side to side and all around Cherokee. When he did sink his teeth into the bulldog, he would not hold the flesh. He let go at once and darted safely away again.
        - id: ch01-b11
          speaker: narrator
          text: >-
            There was one place White Fang could not reach. The soft underside of Cherokee's throat stayed below him because the bulldog stood so short, and Cherokee's massive jaws guarded it as well. White Fang flew in and out without a wound, while the damage to Cherokee kept growing. Both sides of the bulldog's neck were ripped, and cuts crossed his head. He bled freely, but showed no sign of confusion or fear. He kept up that heavy, plodding pursuit. Once, when White Fang's movements baffled him, Cherokee came to a complete stop. He blinked at the watching men and wagged his little tail, as if to show them he remained perfectly willing to fight.
        - id: ch01-b12
          speaker: narrator
          text: >-
            White Fang flashed past and ripped what remained of one trimmed ear. Cherokee showed a touch of anger now. He took up the chase again, keeping to the inside of White Fang's circle as he tried to lock those deadly jaws on White Fang's throat. Once he missed by the width of a hair. The crowd shouted praise when White Fang doubled back and escaped the other way.
        - id: ch01-b13
          speaker: narrator
          text: >-
            Time passed, and the same struggle went on. White Fang danced ahead, dodging and doubling back, leaping in and out, always leaving another wound. Cherokee toiled after him with grim certainty. Sooner or later, the bulldog meant to accomplish his purpose. He would get the grip that won the fight. Until that moment came, he accepted every injury White Fang could give him. The small tufts of his ears had become bloody tassels. His neck and shoulders were slashed in place after place, and even his lips were cut and bleeding. White Fang's lightning strikes came too fast for Cherokee to foresee them or guard against them.
        - id: ch01-b14
          speaker: narrator
          text: >-
            White Fang tried again and again to knock Cherokee off his feet. The difference in their height defeated him every time. The bulldog was too squat and stood too close to the ground. At last White Fang tried the trick once too often. The chance came during one of his quick turns and counter-circles. Cherokee was whirling more slowly, with his head turned away and one shoulder open. White Fang hurled himself at that shoulder. But White Fang's own shoulder was much higher, and the force of his charge carried him straight over Cherokee's body. For the first time in all his fights, the watching men saw White Fang lose his footing. His body turned half a somersault in the air. He twisted like a cat, fighting to bring his feet beneath him, but landed hard on his side. He was up in an instant. In that same instant, Cherokee's teeth closed on his throat.
        - id: ch01-b15
          speaker: narrator
          text: >-
            The grip was not a good one. It lay too low, down near White Fang's chest, but Cherokee held fast. White Fang sprang to his feet and tore wildly around the ring, trying to shake off the bulldog's body. The clinging, dragging weight drove him frantic. It trapped his movements and took away his freedom. It felt like the trap he remembered, and every instinct in him rebelled against it. For several minutes, that rebellion became madness. The deepest force of life inside him took command. Thought and reason disappeared. Only his body's blind need to exist remained, demanding that he move at any cost because movement itself meant that he was still alive.
        - id: ch01-b16
          speaker: narrator
          text: >-
            Round and round White Fang went. He spun one way and the other, wheeling, turning, and reversing as he tried to throw off those fifty pounds hanging from his throat. Cherokee did almost nothing except keep his hold. Only now and then did his feet touch the ground. He would brace himself for a moment, but White Fang's next wild turn swept his feet away and dragged him back into the whirl. Cherokee followed his own instinct as surely as White Fang followed his. He knew that holding on was the right thing to do. At moments the knowledge brought him such deep satisfaction that he closed his eyes and let his body be flung wherever White Fang carried it. He did not care what injuries the tossing might cause. They counted for nothing. The grip was everything, and the grip he kept.
        - id: ch01-b17
          speaker: narrator
          text: >-
            White Fang stopped only when he had worn himself out. He could do nothing, and he could not understand what was happening. In all his fighting, no dog had ever treated him this way. The others fought as he did. They snapped, slashed, and jumped clear, then did it all over again. Now he lay partly on his side, gasping for breath. Cherokee still held him and pushed against his body, trying to roll him completely onto his side. White Fang resisted. He could feel the jaws loosen slightly, then come together again with a slow chewing motion. Each small shift brought the grip nearer his throat. Cherokee's method was simple. He kept whatever he had and worked inward whenever the chance appeared. When White Fang struggled, Cherokee was content merely to hold on. When White Fang lay still, the bulldog worked his jaws closer.
        - id: ch01-b18
          speaker: narrator
          text: >-
            White Fang's teeth could reach only the bulging back of Cherokee's neck. He caught it low, where the neck rose from the shoulders, and tore at it in quick, desperate bursts. But White Fang did not know the slow chewing method, and his jaws were not shaped to fight that way. Before he could do more, their position changed. Cherokee managed to roll White Fang onto his back, then stayed above him without releasing his throat. Like a cat, White Fang curled his hindquarters inward. He dug his feet into the belly above him and began to rake with long, tearing strokes. The claws might have ripped Cherokee open. But the bulldog quickly turned around the fixed point of his grip, swinging his body off White Fang and bringing it around until he lay at a right angle to him.
        - id: ch01-b19
          speaker: narrator
          text: >-
            There was no escape from that grip. It was like Fate itself, and just as merciless. Slowly, it crept upward along the great vein in White Fang's throat. Only the loose skin of his neck and the thick fur over it saved him from death. Together they formed a heavy roll inside Cherokee's mouth, and the mass of fur almost defeated his teeth. Almost, but not quite. Whenever the chance came, the bulldog gathered in a little more of the loose skin and fur. The protection that kept his teeth from the vein was also letting him tighten his hold. Bit by bit, Cherokee was choking White Fang. As the moments passed, each breath came harder than the one before.
        - id: ch01-b20
          speaker: narrator
          text: >-
            The fight seemed nearly over. Cherokee's supporters celebrated and offered foolish odds. White Fang's supporters were just as discouraged. They would not take bets of ten to one or even twenty to one. One man alone was reckless enough to accept a wager at fifty to one. That man was Beauty Smith. He stepped into the ring, pointed a finger at White Fang, and began to laugh at him with open, mocking scorn.
        - id: ch01-b21
          speaker: narrator
          text: >-
            The laughter did exactly what Beauty Smith wanted. White Fang exploded in rage. He called up the last of his strength and forced himself upright. He struggled around the ring with Cherokee's fifty pounds still dragging from his throat, and soon his anger turned to terror. Again, the deepest force of life ruled him, and all intelligence fled before his body's need to survive. He went round and round, then doubled back. He stumbled, fell, and rose again. Sometimes he reared onto his hind legs and lifted Cherokee completely off the ground. Still every effort was useless. Nothing could shake off the clinging death.
        - id: ch01-b22
          speaker: narrator
          text: >-
            At last White Fang fell backward, completely exhausted. Cherokee immediately shifted his hold closer. His teeth crushed more of the fur-wrapped flesh, choking White Fang more fiercely than ever. The crowd roared its applause for the winner, and voice after voice called Cherokee's name. Cherokee answered with a vigorous wag of his stump of a tail. Yet all that noise and approval could not distract him from his task. There was no connection between his friendly tail and his massive jaws. The tail might wag as hard as it pleased. The jaws kept their terrible grip on White Fang's throat.
        - id: ch01-b23
          speaker: narrator
          text: >-
            Then something else drew the spectators' attention. Sleigh bells jingled, and the calls of dog drivers sounded nearby. Everyone but Beauty Smith looked around uneasily because they feared the police. But the newcomers were coming from up the trail, not from the direction of town. Two men ran beside a sled and its dogs as they came down the creek, plainly returning from a prospecting trip. They stopped their team at the sight of the crowd and came over, curious to know what had caused the excitement. One was a dog driver with a mustache. The other was younger and taller, clean-shaven, with his face flushed by his pounding blood and the run through the freezing air.
        - id: ch01-b24
          speaker: narrator
          text: >-
            White Fang had almost stopped fighting. Once in a while his body jerked in a useless struggle, but that was all. Very little air reached him now, and the amount grew smaller as Cherokee's merciless hold tightened. White Fang's armor of fur still protected the great vein in his throat. If Cherokee's first grip had not landed so low, almost on the chest, the vein would have been torn open long before. Working the grip upward had taken time. It had also packed Cherokee's jaws more and more tightly with folds of skin and masses of fur.
        - id: ch01-b25
          speaker: narrator
          text: >-
            Meanwhile, the brute in Beauty Smith had taken control of what little sense he possessed. When White Fang's eyes began to turn glassy, Beauty knew the fight was lost. He rushed forward and kicked the helpless animal again and again. The crowd hissed and protested, but no one stopped him.
        - id: ch01-b26
          speaker: narrator
          text: >-
            The tall newcomer drove through the men, throwing them aside without care. He reached the ring just as Beauty Smith raised his foot for another kick. All Beauty's weight rested on one leg. The newcomer's fist smashed into his face. His other foot flew from the ground, and he turned backward through the air before crashing into the snow.
        - id: ch01-b27
          speaker: weedon_scott
          text: You cowards! You beasts!
          emotion: angry
        - id: ch01-b28
          speaker: narrator
          text: >-
            His anger was fierce but sane. His grey eyes flashed like steel at the crowd. Beauty Smith got up and crept toward him, sniffling. The young man did not know what a coward Beauty was. He thought the man meant to fight.
        - id: ch01-b29
          speaker: weedon_scott
          text: You beast!
          emotion: angry
        - id: ch01-b30
          speaker: narrator
          text: >-
            A second blow knocked Beauty backward into the snow. This time he decided the ground was the safest place and made no attempt to rise.
        - id: ch01-b31
          speaker: weedon_scott
          text: Come on, Matt. Give me a hand.
        - id: ch01-b32
          speaker: narrator
          text: >-
            The dog driver followed him into the ring, and both men bent over the animals. Matt took hold of White Fang, ready to pull the instant Cherokee's jaws came loose. The younger man clutched the bulldog's jaws with both hands and tried to spread them apart. It was useless. He pulled, twisted, and wrenched with all his strength, but the jaws would not open. With every hard breath he forced out, he called the watching men beasts.
        - id: ch01-b33
          speaker: narrator
          text: >-
            The crowd grew restless. Some men objected to having their sport ruined. The newcomer looked up from the dogs and silenced them with one hard stare.
        - id: ch01-b34
          speaker: weedon_scott
          text: You damned beasts!
          emotion: angry
        - id: ch01-b35
          speaker: narrator
          text: Then he bent back to the locked jaws.
        - id: ch01-b36
          speaker: matt
          text: It's no good, Mr. Scott. You can't pull them apart that way.
        - id: ch01-b37
          speaker: narrator
          text: The two men stopped and studied the dogs.
        - id: ch01-b38
          speaker: matt
          text: He isn't bleeding much. Those teeth haven't gone all the way in yet.
        - id: ch01-b39
          speaker: weedon_scott
          text: But they could at any moment. There! Did you see that? He just worked his grip farther in.
        - id: ch01-b40
          speaker: narrator
          text: >-
            Scott's fear for White Fang kept rising. He struck Cherokee over the head again and again, but the jaws stayed shut. Cherokee wagged his short tail. He understood the blows, yet his instinct told him he was right to hold on, and that was what he meant to do.
        - id: ch01-b41
          speaker: weedon_scott
          text: Won't any of you help us?
        - id: ch01-b42
          speaker: narrator
          text: >-
            No one moved. The men only cheered him with mock praise and shouted useless advice.
        - id: ch01-b43
          speaker: matt
          text: You'll need something to pry his jaws open.
        - id: ch01-b44
          speaker: narrator
          text: >-
            Scott reached into the holster at his hip and drew his revolver. He turned it in his hand and tried to drive the muzzle between the bulldog's jaws. He pushed, stopped, and pushed harder against the locked teeth until everyone nearby could hear steel grating on them. Both Scott and Matt were down on their knees, bent close over the dogs. Tim Keenan strode into the ring, stopped beside Scott, and laid a hand on his shoulder.
        - id: ch01-b45
          speaker: tim_keenan
          text: Don't you break those teeth, stranger.
        - id: ch01-b46
          speaker: weedon_scott
          text: Then I'll break his neck.
        - id: ch01-b47
          speaker: narrator
          text: Scott kept driving and wedging the revolver between the jaws.
        - id: ch01-b48
          speaker: tim_keenan
          text: I told you, don't break those teeth.
        - id: ch01-b49
          speaker: narrator
          text: >-
            If Tim meant to frighten him, it failed. Scott never stopped working. He only looked up with perfect coolness.
        - id: ch01-b50
          speaker: weedon_scott
          text: Is he your dog?
        - id: ch01-b51
          speaker: narrator
          text: Tim answered with a grunt.
        - id: ch01-b52
          speaker: weedon_scott
          text: Then come down here and make him let go.
        - id: ch01-b53
          speaker: tim_keenan
          text: Well, stranger, that's one trick I never figured out. I don't know how to make him do it.
        - id: ch01-b54
          speaker: weedon_scott
          text: Then move aside and quit bothering me. I'm busy.
        - id: ch01-b55
          speaker: narrator
          text: >-
            Tim stayed above him, but Scott paid no more attention to his presence. He had managed to wedge the muzzle between the teeth on one side of Cherokee's mouth. Now he worked to bring its tip out between the teeth on the opposite side. When he finally succeeded, he used the weapon as a lever. He pried gently and carefully, opening the bulldog's jaws by the smallest amount each time. As each little space appeared, Matt eased another part of White Fang's mangled neck free.
        - id: ch01-b56
          speaker: weedon_scott
          text: Get ready to take your dog.
        - id: ch01-b57
          speaker: narrator
          text: Tim bent down and took a firm hold of Cherokee.
        - id: ch01-b58
          speaker: weedon_scott
          text: Now!
        - id: ch01-b59
          speaker: narrator
          text: The men pulled the dogs apart, and Cherokee fought against them with all his strength.
        - id: ch01-b60
          speaker: weedon_scott
          text: Take him away.
        - id: ch01-b61
          speaker: narrator
          text: >-
            Tim dragged Cherokee back into the crowd. White Fang made several useless attempts to rise. Once he managed to reach his feet, but his legs were too weak to support him. He slowly wilted and sank back into the snow. His eyes were half shut, and their surface had turned glassy. His jaws hung apart. Between them, his tongue stuck out, limp, wet, and dirty. To anyone looking at him, he seemed like a dog that had already been strangled to death. Matt knelt and examined him.
        - id: ch01-b62
          speaker: matt
          text: He's nearly finished, but he's still breathing.
        - id: ch01-b63
          speaker: narrator
          text: Beauty Smith had finally climbed to his feet. He came over to stare at White Fang.
        - id: ch01-b64
          speaker: weedon_scott
          text: Matt, what would a good sled dog be worth?
        - id: ch01-b65
          speaker: narrator
          text: Still kneeling over White Fang, Matt thought for a moment.
        - id: ch01-b66
          speaker: matt
          text: Three hundred dollars.
        - id: ch01-b67
          speaker: weedon_scott
          text: And what about one that's been chewed up like this?
        - id: ch01-b68
          speaker: narrator
          text: Scott touched White Fang with his foot.
        - id: ch01-b69
          speaker: matt
          text: Half that much.
        - id: ch01-b70
          speaker: narrator
          text: Scott turned on Beauty Smith.
        - id: ch01-b71
          speaker: weedon_scott
          text: Did you hear that, Mr. Beast? I'm taking your dog, and I'm paying you one hundred and fifty dollars.
        - id: ch01-b72
          speaker: narrator
          text: >-
            Scott opened his pocketbook and counted the bills. Beauty put both hands behind his back and refused the money.
        - id: ch01-b73
          speaker: beauty_smith
          text: I ain't selling him.
        - id: ch01-b74
          speaker: weedon_scott
          text: Yes, you are, because I'm buying him. Here's the money. The dog belongs to me now.
        - id: ch01-b75
          speaker: narrator
          text: Beauty kept his hands behind him and began to back away.
        - id: ch01-b76
          speaker: narrator
          text: >-
            Scott sprang at him with one fist drawn back. Beauty crouched, waiting for the blow.
        - id: ch01-b77
          speaker: beauty_smith
          text: I've got rights.
          emotion: fearful
        - id: ch01-b78
          speaker: weedon_scott
          text: You gave up the right to own that dog. Will you take the money, or do I have to hit you again?
        - id: ch01-b79
          speaker: beauty_smith
          text: >-
            All right, I'll take it, but I'm doing it under protest. That dog is worth a fortune. You can't rob me like this. A man has rights.
          emotion: fearful
        - id: ch01-b80
          speaker: weedon_scott
          text: That's true. A man has rights. But you aren't a man. You're a beast.
        - id: ch01-b81
          speaker: narrator
          text: Scott handed him the money.
        - id: ch01-b82
          speaker: beauty_smith
          text: Wait until I get back to Dawson. I'll bring the law down on you.
          emotion: angry
        - id: ch01-b83
          speaker: weedon_scott
          text: Say one word in Dawson, and I'll have you driven out of town. Do you understand?
        - id: ch01-b84
          speaker: narrator
          text: Beauty answered with a grunt.
        - id: ch01-b85
          speaker: weedon_scott
          text: Do you understand me?
          emotion: angry
        - id: ch01-b86
          speaker: beauty_smith
          text: Yes.
          emotion: fearful
        - id: ch01-b87
          speaker: narrator
          text: He shrank away as he said it.
        - id: ch01-b88
          speaker: weedon_scott
          text: Yes, what?
        - id: ch01-b89
          speaker: beauty_smith
          text: Yes, sir.
          emotion: angry
        - id: ch01-b90
          speaker: crowd_man_1
          text: Watch out! He'll bite you!
        - id: ch01-b91
          speaker: narrator
          text: >-
            The crowd burst into laughter. Scott turned his back on Beauty and went to help Matt, who was still tending White Fang.
        - id: ch01-b92
          speaker: narrator
          text: >-
            Some men began to leave. Others stood talking in small groups. Tim Keenan joined one of them.
        - id: ch01-b93
          speaker: tim_keenan
          text: Who's that fellow?
        - id: ch01-b94
          speaker: crowd_man_1
          text: Weedon Scott.
        - id: ch01-b95
          speaker: tim_keenan
          text: And who in hell is Weedon Scott?
        - id: ch01-b96
          speaker: crowd_man_1
          text: >-
            He's one of the best mining experts around. He works with all the important men. If you want to stay out of trouble, keep clear of him. He knows every official worth knowing, and the Gold Commissioner is a close friend of his.
        - id: ch01-b97
          speaker: tim_keenan
          text: I knew he had to be somebody. That's why I didn't lay a hand on him in the first place.
