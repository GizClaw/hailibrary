audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: grave and vivid storytelling
        timbre: warm and resonant
        pace: measured
        pitch: medium-low
  chapters:
    - id: ch01
      title: THE BATTLE OF THE FANGS
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            The she-wolf heard the men's voices and the whining sled-dogs first. She was also the first to spring away from the cornered man and his circle of dying fire. The pack hated to give up the kill it had hunted down. For several minutes, the wolves lingered and listened to make sure. Then they, too, raced away along the she-wolf's trail.
        - id: ch01-b02
          speaker: narrator
          text: >-
            A large grey wolf ran at the head of the pack. He was one of several leaders, and he guided the others after the she-wolf. Whenever a younger wolf tried to pass, he warned it with a snarl or struck at it with his fangs. Then he caught sight of the she-wolf trotting slowly over the snow, and he drove the pack to a faster pace.
        - id: ch01-b03
          speaker: narrator
          text: >-
            The she-wolf fell into place beside him and matched the speed of the pack. If one of her leaps carried her ahead, he did not snarl or bare his teeth. In fact, he was far too friendly for her liking. He kept trying to run close beside her. When he came too near, she showed her teeth, snarled, and sometimes slashed his shoulder. He never became angry. He only jumped aside and ran stiffly for a few awkward bounds, looking like a shy young suitor who had been put in his place.
        - id: ch01-b04
          speaker: narrator
          text: >-
            That was the grey leader's one difficulty. The she-wolf had another on her right. A thin old wolf ran there, grey with age and scarred by many fights. He had only his left eye, which may have been why he always kept to her right. He crowded close again and again until his scarred muzzle brushed her side, shoulder, or neck. She drove him away with her teeth just as she did the younger leader.
        - id: ch01-b05
          speaker: narrator
          text: >-
            When both males pressed against her at once, they knocked her roughly between them. She had to snap first to one side, then the other, while still keeping pace with the pack and watching where her feet landed. Neither suitor made that easy. The two males bared their fangs and growled at each other across her. They might have fought, but hunger mattered more than courtship or rivalry just then. Even that rivalry had to wait until the pack had eaten.
        - id: ch01-b06
          speaker: narrator
          text: >-
            Each time the old wolf jumped away from the she-wolf's sharp teeth, he bumped into a strong three-year-old running on his blind side. The young wolf had reached his full size, and even among that weak, starving pack, he had unusual strength and spirit. Still, he kept his head level with the old wolf's shoulder. On the rare occasions when he moved up beside him, one snarl and snap sent him back.
        - id: ch01-b07
          speaker: narrator
          text: >-
            Sometimes the three-year-old slowly fell behind, then edged between the old leader and the she-wolf. That angered them both, and sometimes the younger leader on her left joined them. The she-wolf would snarl, the old leader would spin toward him, and the other leader might turn as well.
        - id: ch01-b08
          speaker: narrator
          text: >-
            Faced with three sets of savage teeth, the young wolf stopped short and dropped onto his haunches. His forelegs went stiff, his mouth threatened them, and the fur along his neck stood high. Every time he caused this confusion at the front, the wolves behind crashed into him. They showed their annoyance by biting sharply at his hind legs and sides. Hunger made every temper short, and he was inviting trouble. Yet he had all the confidence of youth. Before long he would try the same trick again, though it earned him nothing but pain and embarrassment.
        - id: ch01-b09
          speaker: narrator
          text: >-
            With enough food, the wolves would have begun courting and fighting, and the pack would have broken apart. But their need was desperate. Long hunger had left the whole pack lean. They ran more slowly than wolves usually ran. The weakest trailed behind, both the very young and the very old, while the strongest held the front. Even those strong wolves looked more like skeletons than well-fed animals.
        - id: ch01-b10
          speaker: narrator
          text: >-
            Except for the limping wolves, they moved as though they could run forever. There was no wasted effort in their stride and no sign of tiredness. Their ropy muscles tightened with easy strength. Beneath every hard pull of muscle, another seemed ready to follow, then another, and another, with no end in sight.
        - id: ch01-b11
          speaker: narrator
          text: >-
            They covered many miles that day, ran all through the night, and were still running the next day. The world beneath them was frozen and dead. Nothing else stirred across it. Only the wolves moved through that immense stillness. They were alive, and they searched for other living things to eat so that they could remain alive.
        - id: ch01-b12
          speaker: narrator
          text: >-
            They crossed low ridges and followed a dozen little streams through lower country before their search brought them food. At last, they found moose. The first was a great bull. Here were meat and life with no strange fires to guard them and no burning weapons flying through the air. The wolves understood his spreading hoofs and broad antlers. They forgot their usual patience and caution and rushed him.
        - id: ch01-b13
          speaker: narrator
          text: >-
            The fight was short and savage. Wolves attacked the bull from every side. He split them open and crushed their skulls with well-aimed kicks. He smashed them with his heavy antlers and stamped them down into the snow as they struggled around him. But he had no hope of escaping. At last he fell, with the she-wolf tearing at his throat and teeth fastened all over his body. The pack began eating him while he still fought his final fight and dealt his last blows.
        - id: ch01-b14
          speaker: narrator
          text: >-
            There was more than enough meat. The bull weighed over eight hundred pounds, which meant nearly twenty pounds for every one of the forty-odd wolves. They could go an astonishingly long time without food, but when food came, they could eat just as astonishingly. Soon, only a few scattered bones remained of the powerful animal that had faced them hours before.
        - id: ch01-b15
          speaker: narrator
          text: >-
            Now the wolves rested and slept. Their stomachs were full, and the younger males began snapping and quarreling. That went on through the next few days as the pack slowly broke apart. The famine had ended. They had reached a country rich in game. They still hunted together for a while, but they no longer threw caution aside. When they met small herds of moose, they worked to separate a heavy cow or an old, crippled bull from the others before attacking.
        - id: ch01-b16
          speaker: narrator
          text: >-
            One day, the pack divided in two and the halves went different ways. The she-wolf traveled with the younger leader on her left and the one-eyed elder on her right. Together they led their half down to the Mackenzie River, then crossed into the lake country to the east. Every day, their smaller pack lost more wolves. Males and females left in pairs. Now and then, competing males drove a lone wolf away. In the end, only four remained. There was the she-wolf, the young leader, One Eye, and the ambitious three-year-old.
        - id: ch01-b17
          speaker: narrator
          text: >-
            By then, the she-wolf's temper had become fierce. All three males carried marks from her teeth. None ever struck back or tried to defend himself against her. When she slashed at them, they turned their shoulders toward her. They wagged their tails and stepped lightly, trying to calm her anger. But though they were gentle with her, they were vicious with one another.
        - id: ch01-b18
          speaker: narrator
          text: >-
            The three-year-old finally became too bold. He attacked One Eye from the blind side and tore the old wolf's ear into strips. The younger wolf had youth and strength, and One Eye could see from only one side. But the grey old fighter had the wisdom of years. His missing eye and scarred muzzle showed what those years had taught him. He had survived too many battles to hesitate now.
        - id: ch01-b19
          speaker: narrator
          text: >-
            The fight began fairly, but it did not stay fair. No one could know how it might have ended because the younger leader joined One Eye. Together, the two rivals turned on the ambitious three-year-old and began to destroy him. Their merciless fangs closed on him from both sides. The days of hunting together meant nothing now. They forgot the animals they had brought down and the hunger they had endured. That part of life was behind them. Now they fought for the she-wolf, and this struggle was harsher and crueler than the struggle for food.
        - id: ch01-b20
          speaker: narrator
          text: >-
            All the while, the she-wolf sat comfortably on her haunches and watched the fight she had caused. She was pleased. Such a day did not come often. Manes rose, fangs struck fangs, and yielding flesh ripped beneath their teeth, all because the males wanted her.
        - id: ch01-b21
          speaker: narrator
          text: >-
            The three-year-old's first adventure in love cost him his life. When it ended, his two rivals stood on either side of his body and looked toward the she-wolf, who sat smiling in the snow.
        - id: ch01-b22
          speaker: narrator
          text: >-
            But One Eye understood love as wisely as he understood battle. The young leader turned to lick a wound on his shoulder and exposed the curve of his neck. One Eye saw his chance. He darted low and drove in his fangs. His teeth tore a long, deep wound and burst the wall of the great vein in the younger wolf's throat. Then One Eye sprang out of reach.
        - id: ch01-b23
          speaker: narrator
          text: >-
            The young leader gave a terrible snarl, but it broke into a choking cough. Blood poured from him. Even though the wound had already doomed him, he attacked the elder and kept fighting as his life faded. His legs weakened beneath him. Daylight dimmed in his eyes. Every blow fell shorter, and every leap carried him less distance than the one before.
        - id: ch01-b24
          speaker: narrator
          text: >-
            Through it all, the she-wolf remained on her haunches and smiled. The battle stirred a dim gladness in her. This was the love-making of the Wild, the cruel struggle between males in the natural world. It was a tragedy only for the wolves that died. For the wolves that survived, it was not tragedy at all. It meant desire fulfilled and victory won.
        - id: ch01-b25
          speaker: narrator
          text: >-
            When the younger leader lay still in the snow, One Eye walked toward the she-wolf. He looked triumphant, but cautious too. He clearly expected her to drive him away. Instead, she surprised him by keeping her teeth hidden. For the first time, she welcomed him kindly. They touched noses. Then she jumped and frisked around him like a puppy. Old and experienced as he was, One Eye acted just as puppyish, and even a little more foolish.
        - id: ch01-b26
          speaker: narrator
          text: >-
            The defeated wolves and the story written in red upon the snow were already forgotten. One Eye remembered only once, when he stopped to lick his stiffening wounds. His lips twisted halfway into a snarl. The fur along his neck and shoulders rose by itself, and he crouched as if ready to leap, his claws gripping the snow for better footing. A moment later, that memory was gone too. The she-wolf led him teasingly through the trees, and he bounded after her.
        - id: ch01-b27
          speaker: narrator
          text: >-
            After that, they ran side by side like good friends who understood each other at last. The days passed. They stayed together, hunted together, and shared whatever they killed. Before long, the she-wolf became restless. She seemed to be looking for something she could not find.
        - id: ch01-b28
          speaker: narrator
          text: >-
            Hollows beneath fallen trees drew her attention. She nosed among the larger cracks in the rocks where snow had piled high, and she searched the caves beneath overhanging banks. One Eye showed no interest, but he followed in a good-natured way. Whenever she spent a long time examining one place, he lay down and waited until she was ready to move on.
        - id: ch01-b29
          speaker: narrator
          text: >-
            They did not settle anywhere. They crossed the country until they reached the Mackenzie River again, then followed it slowly downstream. Often, they left it to hunt beside one of the little streams that flowed into it, but they always came back.
        - id: ch01-b30
          speaker: narrator
          text: >-
            Sometimes they met other wolves, usually traveling in pairs. Neither pair showed any friendliness or pleasure at the meeting. There was no wish on either side to join together and form another pack. Several times, lone wolves crossed their path. These were always males, and they pushed hard to join One Eye and his mate. He strongly resented them. When the she-wolf stood shoulder to shoulder with him, her fur raised and her teeth showing, the hopeful stranger backed away, turned tail, and continued alone.
        - id: ch01-b31
          speaker: narrator
          text: >-
            One moonlit night, as they ran through a quiet forest, One Eye stopped without warning. He lifted his muzzle, stiffened his tail, and widened his nostrils to test the air. One forepaw rose like a dog's. Whatever he smelled troubled him. He kept drawing in the air and trying to understand its message.
        - id: ch01-b32
          speaker: narrator
          text: >-
            One careless sniff told his mate enough, and she trotted ahead as though to assure him there was no danger. He followed, but he remained doubtful. Every so often, he stopped again and studied the warning scent more carefully.
        - id: ch01-b33
          speaker: narrator
          text: >-
            The she-wolf crept carefully to the edge of a broad clearing among the trees. For a while, she stood there alone. Then One Eye crawled up beside her. Every sense was alert, and every hair seemed to carry his suspicion. Side by side, they watched, listened, and smelled.
        - id: ch01-b34
          speaker: narrator
          text: >-
            They heard dogs snarling and fighting, men's deep cries, and women's sharper scolding voices. Once, a child gave a high, unhappy wail. They could see little beyond the huge shapes of the skin lodges. Flames showed through moving bodies, and smoke rose slowly into the still air. But their noses found far more than their eyes could see. The scent of the Indian camp brought countless messages from the people, dogs, fires, and lodges gathered there. One Eye understood almost none of them. The she-wolf knew every detail.
        - id: ch01-b35
          speaker: narrator
          text: >-
            The she-wolf grew strangely excited. She sniffed again and again, taking more pleasure in every breath. One Eye remained uneasy and began to edge away. She turned, touched her muzzle to his neck to reassure him, then looked back at the camp.
        - id: ch01-b36
          speaker: narrator
          text: >-
            A new longing came into her face, and it was not hunger. Something pulled her toward those fires. She wanted to go nearer, to quarrel with the dogs, and to dodge the stumbling feet of men.
        - id: ch01-b37
          speaker: narrator
          text: >-
            One Eye shifted impatiently beside her. Then her old restlessness returned, along with the urgent need to find the thing she had been seeking. She turned away and trotted back into the forest. One Eye followed with great relief and moved slightly ahead once the trees sheltered them.
        - id: ch01-b38
          speaker: narrator
          text: >-
            They glided through the moonlight without a sound, as quiet as shadows, until they found a narrow animal trail. Both lowered their noses to the tracks in the snow. The prints were very fresh. One Eye went ahead cautiously, and his mate followed close behind. Their broad footpads spread against the snow and touched it as softly as velvet.
        - id: ch01-b39
          speaker: narrator
          text: >-
            One Eye caught a faint white movement among all that white. Until then, his smooth running had only seemed fast. Now he truly raced. Ahead, the pale shape bounded away from him.
        - id: ch01-b40
          speaker: narrator
          text: >-
            They were in a narrow passage with young spruce trees on both sides. Its far end opened into a clearing bright with moonlight. One Eye quickly gained on the fleeing shape. With every bound, he drew closer, while the white patch raced for the open space ahead. Now he was almost upon it. One more leap, and his teeth would sink into his prey.
        - id: ch01-b41
          speaker: narrator
          text: >-
            But he never made that leap. The white shape shot straight up into the air. It was a snowshoe rabbit, struggling high above him. It kicked and twisted in a wild dance, but never came back to the ground.
        - id: ch01-b42
          speaker: narrator
          text: >-
            One Eye jumped back with a frightened snort. Then he flattened himself in the snow and growled threats at this terrifying thing he could not understand. The she-wolf calmly pushed past him. She paused, gathered herself, and sprang at the dancing rabbit. She rose high, but not as high as her prey, and her teeth snapped together on empty air. She tried once, then tried again.
        - id: ch01-b43
          speaker: narrator
          text: >-
            One Eye slowly came out of his crouch and watched her. When she kept missing, he showed his annoyance. At last, he made a tremendous jump. His jaws closed on the rabbit, and he brought it down with him.
        - id: ch01-b44
          speaker: narrator
          text: >-
            At that same moment, something crackled beside him. To his astonishment, a young spruce tree bent down as if it meant to strike him. He released the rabbit and sprang backward from this strange danger. His lips pulled away from his fangs. He snarled, and every hair rose with rage and fear. Then the young tree lifted its slender trunk upright, and the rabbit went dancing into the air once more.
        - id: ch01-b45
          speaker: narrator
          text: >-
            The she-wolf became angry. She bit One Eye's shoulder to punish him. Still frightened and not understanding this new attack, he struck back savagely. His teeth tore down the side of her muzzle. She had never expected him to fight against her correction, and she leaped on him in furious outrage.
        - id: ch01-b46
          speaker: narrator
          text: >-
            One Eye realized his mistake and tried to make peace. The she-wolf would not allow it. She punished him so fiercely that he finally stopped trying to soothe her. He turned around in a circle, keeping his head away while his shoulders took the bites from her teeth.
        - id: ch01-b47
          speaker: narrator
          text: >-
            Meanwhile, the rabbit continued its dance overhead. The she-wolf sat down in the snow. One Eye was now more afraid of his mate than of the mysterious spruce, so he jumped for the rabbit again. He came down with it between his teeth, watching the tree all the way.
        - id: ch01-b48
          speaker: narrator
          text: >-
            Just as before, the spruce bent toward the earth after him. One Eye crouched beneath the expected blow, his fur standing up, but he kept a firm grip on the rabbit. The blow never landed. The tree stayed bent above him. When he moved, it moved. When he held still, it held still. He growled through his closed jaws and decided that staying still was safest. Besides, the rabbit's warm blood tasted good.
        - id: ch01-b49
          speaker: narrator
          text: >-
            His mate solved the puzzle for him. She took the rabbit from his mouth. While the spruce swayed and bobbed above her, she calmly chewed off the rabbit's head. At once, the young tree sprang upright. It caused no more trouble and stood straight again, just as nature meant a tree to stand. Then the she-wolf and One Eye ate the animal that the mysterious spruce had caught for them.
        - id: ch01-b50
          speaker: narrator
          text: >-
            Other narrow trails had rabbits hanging in the air. The two wolves explored every one of them. The she-wolf led, and One Eye followed closely, watching how she robbed the snares. He learned the method well, and in the days ahead, that knowledge would serve him.
