audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 沉着克制，带着北国故事的冷峻张力
        timbre: 温厚清晰，略显低沉
        pace: 舒缓而有变化
        pitch: 中低
  chapters:
    - id: ch01
      title: 獠牙之战
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            最先听见人声和雪橇犬哀鸣的是母狼。她也最先从亨利身边跑开，离开那圈将要熄灭的火。狼群却舍不得放弃已经逼入绝境的猎物。它们又等了几分钟，确认远处真的有人和狗，这才跟上母狼的踪迹，纷纷追了出去。
        - id: ch01-b02
          speaker: narrator
          text: >-
            狼群前面跑着一头高大的灰狼，它是几名首领之一。母狼在前，它领着群狼紧追。年轻的狼若想抢到它前头，它便用低吼警告，有时还会直接用獠牙撕咬，把对方赶回去。等它望见母狼正在雪地上慢慢小跑，立刻把整个狼群的速度提了起来。
        - id: ch01-b03
          speaker: narrator
          text: >-
            母狼靠到它身旁，像是本来就该跑在那里。偶尔她一跃超过灰狼，对方也不吼她，更不朝她露牙。灰狼待她实在亲热，甚至亲热过了头，总想贴得更近。每到这时，反倒是母狼低吼龇牙，偶尔还狠狠咬它的肩。灰狼从不发怒，只会赶紧闪开，僵着身子向前跑几步，活像一个害羞又笨拙的乡下小伙子。
        - id: ch01-b04
          speaker: narrator
          text: >-
            这只是灰狼的一桩烦恼，母狼的麻烦却在两边。她右侧还有一头瘦骨嶙峋的老狼，灰白的皮毛布满多年搏斗留下的旧伤。它只剩左眼，也许正因为看不见右侧，才总守在母狼右边。它也不停往她身上挤，直到伤疤纵横的嘴碰到她的身体、肩头或脖颈。
        - id: ch01-b05
          speaker: narrator
          text: >-
            母狼照样用牙赶它。可两头公狼一起献殷勤时，她就会被挤得站不稳。她得一边向左咬，一边向右咬，还不能落下狼群，更不能看漏脚下的路。两个追求者隔着她互相龇牙低吼，各自威胁对方，随时都像要打起来。不过，饥饿比求偶更紧迫，这场争斗只好暂时忍住。
        - id: ch01-b06
          speaker: narrator
          text: >-
            独眼老狼每次被母狼赶开，都会撞上右边一头三岁的公狼。那头年轻狼已经完全长成。在饥饿虚弱的狼群里，它比别的狼更有力量，也更有精神，可它仍只敢把头放在老狼肩后。它偶尔想并肩而行，一声低吼和一次扑咬就会把它逼回原位。
        - id: ch01-b07
          speaker: narrator
          text: >-
            有时，三岁狼会故意落后，再偷偷挤进独眼狼和母狼之间。这一下同时惹怒了三个对手。母狼一表示不满，独眼狼就会转身扑它。有时母狼也一同扑上去，左边的年轻首领偶尔还会加入。
        - id: ch01-b08
          speaker: narrator
          text: >-
            三副獠牙同时逼来，三岁狼只得猛然停步，后腿坐下，前腿绷直，张嘴威吓，颈毛全都竖起。它这一停，奔跑中的狼群前列立刻乱了，后面的狼接连撞上来，再狠狠咬它的后腿和腰侧，发泄被挡路的不满。挨饿的狼都没有好脾气，它分明是在自讨苦吃。可年轻的自信没有边际。明明每次都只换来疼痛和难堪，它过一会儿还是会再试一次。
        - id: ch01-b09
          speaker: narrator
          text: >-
            要是食物充足，求偶和争斗早就让队形散开了。可现在，狼群已经饿到绝境。它们个个瘦得脱了形，跑得比平常慢。年幼和年老的弱者拖在最后，最强壮的守住前方，可所有狼都像一具具会跑的骨架。
        - id: ch01-b10
          speaker: narrator
          text: >-
            即便这样，除了几头跛行的狼，其余的动作依然轻松流畅，看不出一点多余的力气，也像永远不会疲倦。瘦长的肌肉一次次像钢铁般收紧。每一股力量之后，都有下一股力量等着，后面还有下一股，仿佛永远用不完。
        - id: ch01-b11
          speaker: narrator
          text: >-
            它们白天跑过许多英里，整夜不停，第二天仍在奔跑。脚下是一个冻僵死去的世界，没有别的生命在活动，也没有别的东西在荒原上移动。无边的寂静里，只有狼群还在向前。它们寻找活物，把对方吞下去，好让自己活下去。
        - id: ch01-b12
          speaker: narrator
          text: >-
            它们翻过低矮的分水岭，又沿着低地里十几条小溪一路搜寻，终于找到了驼鹿。第一头就是雄壮的公鹿。这里有血肉和生命，旁边没有神秘的火，也没有燃烧的武器飞来。狼群熟悉分叉的蹄子和宽大的鹿角，便把耐心和谨慎全抛开，直接扑了上去。
        - id: ch01-b13
          speaker: narrator
          text: >-
            这一战短促又凶猛。狼从四面围攻，公鹿用巨蹄准确猛踢，撕破肚腹，踩碎头骨。它用硕大的角碾压、挑断狼的身体。大家翻滚混战时，巨蹄还把一头头狼踏进雪里。可公鹿逃不过这一劫。它终于倒下，母狼咬住它的喉咙，更多狼牙从全身各处陷进去。它还在最后挣扎，还在拼命给敌人造成伤害，狼群已经开始活活吞食它了。
        - id: ch01-b14
          speaker: narrator
          text: >-
            这头公鹿超过八百磅，足够四十多头狼一张嘴分到二十磅肉。狼群能忍受惊人的饥饿，有食物时也能吃下惊人的分量。几个小时以前，那头强壮的野兽还在迎战群狼。很快，雪地上只剩几根散乱的骨头。
        - id: ch01-b15
          speaker: narrator
          text: >-
            吃饱以后，群狼花了许多时间休息和睡觉。年轻公狼之间有了力气，也开始争吵撕咬。接下来的几天里，它们争个不停，狼群也慢慢走向分散。饥荒结束了，这片土地到处都有猎物。它们仍会一起捕猎，却重新变得谨慎。遇上小群驼鹿，它们会耐心追赶，先从鹿群里分出笨重的母鹿，或跛脚的老公鹿，再围攻下手。
        - id: ch01-b16
          speaker: narrator
          text: >-
            有一天，狼群终于分成两半，去了不同的方向。母狼、左侧的年轻首领和右侧的独眼狼，带着其中一半来到麦肯齐河，又越过河流，走进东边的湖区。这个小狼群每天都在缩减。公狼和母狼成双离开，落单的公狼也会被情敌咬走。最后，只剩母狼、年轻首领、独眼狼和野心勃勃的三岁狼。
        - id: ch01-b17
          speaker: narrator
          text: >-
            母狼的脾气已经变得非常凶暴。三个追求者身上都有她留下的牙印，却没有谁还击。她扑咬时，它们只把肩头转过去，摇着尾巴，小步讨好她。它们对她一味温顺，对彼此却毫不留情。
        - id: ch01-b18
          speaker: narrator
          text: >-
            三岁狼终于野心过盛。它从独眼狼看不见的一边袭击，把老狼的耳朵撕成条条碎片。它有青春，也有力量，独眼狼却只看得见一侧。不过，那头灰白的老狼懂得多年搏斗教给它的智慧。瞎掉的眼睛和满嘴伤疤，就是它活过一场场恶战的证据。此刻该怎么做，它根本不需要犹豫。
        - id: ch01-b19
          speaker: narrator
          text: >-
            开始时，这场搏斗还算公平，后来却完全变了。要是只有两个对手，谁也不知道结局，可年轻首领偏偏加入独眼狼，两个情敌一同攻击三岁狼。无情的獠牙从左右落下，要把从前的伙伴置于死地。从前一同狩猎的日子，一起扑倒的猎物，还有共同熬过的饥荒，全都不算数了。谋取食物已经是过去的事，现在它们要争夺母狼。而爱情的争斗，向来比填饱肚子的争斗更严酷，也更残忍。
        - id: ch01-b20
          speaker: narrator
          text: >-
            引起这一切的母狼蹲坐在一旁，满意地观看。她甚至感到高兴。这样的日子并不多见。鬃毛竖起，獠牙相撞，柔软的血肉被撕开，而这一切都是为了得到她。
        - id: ch01-b21
          speaker: narrator
          text: >-
            三岁狼第一次踏进爱情的争斗，也就此交出了生命。战斗结束时，两个对手站在尸体两旁，一起望向母狼。她坐在雪地上，像在微笑。
        - id: ch01-b22
          speaker: narrator
          text: >-
            可独眼狼不只懂战斗，也懂爱情。年轻首领转过头去舔肩上的伤，把弯曲的脖颈露给了对手。独眼狼立刻抓住机会，低身扑近，獠牙狠狠咬下，再撕出一道又长又深的伤口。年轻狼颈部的大血管被咬破，独眼狼随即跃开。
        - id: ch01-b23
          speaker: narrator
          text: >-
            年轻首领发出一声可怕的低吼，声音却在半途变成呛咳。它流着血，也咳着血。死亡已经击中它，它仍扑向老狼，趁生命一点点消失，继续搏斗。双腿越来越软，眼前的日光越来越暗。它的每一击都比上一次更短，每一跃也比上一次更近。
        - id: ch01-b24
          speaker: narrator
          text: >-
            母狼始终蹲在那里微笑。眼前的战斗给她带来一种朦胧的快乐。这就是荒野中的求偶，也是自然世界里雌雄争夺的悲剧。只是，悲剧只属于死去的狼。对活下来的狼来说，它根本不是悲剧，而是愿望终于实现，也是胜利终于到手。
        - id: ch01-b25
          speaker: narrator
          text: >-
            年轻首领躺在雪里不动了。独眼狼这才走向母狼，既带着胜利的得意，也带着提防。它以为她一定会赶走自己，可母狼没有龇牙，这叫它十分惊讶。她第一次温和地迎接它，和它碰碰鼻尖，还像小狼崽一样，在它身边蹦跳玩耍。独眼狼年纪虽老，经验虽多，这时也变成了狼崽，甚至比她还要傻气一点。
        - id: ch01-b26
          speaker: narrator
          text: >-
            失败的对手已经被忘掉，雪地上那篇用鲜血写成的爱情故事也被忘掉。只有一次，独眼狼停下来舔舔逐渐僵硬的伤口。它的嘴唇微微扭曲，几乎又要低吼，颈部和肩头的毛也不由自主地竖起。它半蹲着想要扑击，爪子一阵抽搐，紧扣雪面，好让自己站得更稳。可下一刻，这一切又被忘了。母狼故意在林间跑开，引它来追，独眼狼立刻跟着她跃了出去。
        - id: ch01-b27
          speaker: narrator
          text: >-
            从那以后，它们并肩奔跑，像一对终于彼此明白的朋友。日子一天天过去，它们始终结伴，一起寻找猎物，一起追赶、扑杀，再共同吃掉猎物。慢慢地，母狼又开始焦躁。她仿佛在找一样东西，却怎么也找不到。
        - id: ch01-b28
          speaker: narrator
          text: >-
            倒木下的凹洞总会吸引她。岩石间那些宽大的缝隙被雪堆得满满的，悬崖伸出的岩壁下也藏着洞穴。每到这样的地方，她都要用鼻子久久查探，仿佛她要找的东西就躲在里面。独眼狼一点也不感兴趣，却好脾气地跟着。母狼若在某处停得太久，它就躺下来等，直到她愿意继续上路。
        - id: ch01-b29
          speaker: narrator
          text: >-
            它们没有在任何地方定居，而是穿过荒野，重新来到麦肯齐河，沿河慢慢向下游走。它们经常离开河岸，到汇入大河的小溪边捕猎，不过最后总会回到河边。
        - id: ch01-b30
          speaker: narrator
          text: >-
            它们偶尔遇到别的狼，通常也是一公一母。双方既不亲近，也不为相遇高兴，更不想重新结成狼群，只冷淡地各走各路。它们还遇到过几头独行的公狼。那些狼纠缠不休，一心想加入独眼狼和它的伴侣，叫独眼狼十分恼火。母狼会和它肩并肩站定，一同竖起毛，露出牙。满怀希望的陌生公狼只得后退，掉转身，夹着尾巴，独自继续赶路。
        - id: ch01-b31
          speaker: narrator
          text: >-
            一个月夜，它们跑过寂静的森林，独眼狼忽然停下。它抬高嘴鼻，尾巴绷直，鼻孔张开，一只前脚也像狗那样提了起来。空气里的气味让它不安。它不断嗅闻，想弄懂那份警告。
        - id: ch01-b32
          speaker: narrator
          text: >-
            母狼只随便闻了一下，便知道那是什么。她小跑向前，像是在告诉伴侣不必害怕。独眼狼跟在后面，却依旧疑虑重重。它不时停住，更仔细地辨认空气里的消息。
        - id: ch01-b33
          speaker: narrator
          text: >-
            母狼小心地爬到一大片林间空地的边缘，独自站了一会儿。独眼狼随后才匍匐过来。它全身每一种感觉都绷紧了，每一根毛都透着怀疑。两头狼站在一起，看着，听着，也闻着。
        - id: ch01-b34
          speaker: narrator
          text: >-
            那里传来狗争抢打斗的声音，也有男人粗哑低沉的喊叫，女人尖厉的斥骂。一个孩子忽然发出凄厉又委屈的哭声。它们看不清多少东西。眼前只有一顶顶兽皮帐篷的巨大暗影。火焰不时被来往的人影遮住，烟在无风的空气里缓缓升高。
        - id: ch01-b35
          speaker: narrator
          text: >-
            鼻子告诉它们的远比眼睛多。印第安营地送来纷繁的气味，每一种都在讲述这里的人、狗、火焰和帐篷。独眼狼几乎听不懂这个故事，母狼却明白其中每一个细节。
        - id: ch01-b36
          speaker: narrator
          text: >-
            母狼变得异样兴奋。她一次次嗅闻，每次都更加欣喜。独眼狼却越来越不安，试探着想要离开。她转过身，用嘴轻轻碰了碰它的脖颈，像是在安抚，随后又望向营地。
        - id: ch01-b37
          speaker: narrator
          text: >-
            她脸上出现了新的渴望。那不是饥饿。她想走近那堆火，想和狗争抢打闹，也想在人们跌撞的脚步之间躲来躲去。这个愿望在催促她向前。
        - id: ch01-b38
          speaker: narrator
          text: >-
            独眼狼在她身旁不耐烦地挪动。母狼也再次感到焦躁，想起自己还在急着寻找一样东西。她终于转身，向森林里小跑而去。独眼狼如释重负，立刻跟上。等树林完全遮住它们，它甚至走到了母狼前面。
        - id: ch01-b39
          speaker: narrator
          text: >-
            两头狼在月光里滑过，安静得就像影子。它们找到一条兽径，一起低头去闻雪上的脚印。痕迹非常新鲜。独眼狼小心地走在前面，母狼紧跟在后。它们宽大的脚掌完全张开，轻轻贴住雪面，落下时柔软得仿佛天鹅绒。
        - id: ch01-b40
          speaker: narrator
          text: >-
            白茫茫的前方有一抹白影微微晃动。独眼狼刚才跑得看似很快，现在才真正显出速度。那抹淡白在前面纵跃逃窜，它立刻追了上去。
        - id: ch01-b41
          speaker: narrator
          text: >-
            它们跑进一条狭窄的通道，两边长满幼小的云杉。通道尽头是一片月光照亮的空地。独眼狼迅速逼近白影，每一次跳跃都拉近一段距离。它已经追到猎物身后，只差一跃，獠牙就能咬进去。
        - id: ch01-b42
          speaker: narrator
          text: >-
            可这最后一跃没有发生。白影直直飞上半空。那原来是一只雪鞋兔，正在独眼狼头顶挣扎。它又踢又跳，跳着一场古怪的舞，却始终不落回地面。
        - id: ch01-b43
          speaker: narrator
          text: >-
            独眼狼吓得喷出一口气，猛然退开，接着伏低身体，贴在雪上，对着无法理解的怪物低吼。母狼却从容地挤到前面。她停住，蓄足力量，向跳舞的兔子扑去。她跳得很高，却还是够不到。牙齿在空中咔嚓一响，咬了个空。她再跳一次，还是没有成功。
        - id: ch01-b44
          speaker: narrator
          text: >-
            独眼狼渐渐不再蜷伏，站在一旁观看。母狼接连扑空，它开始不耐烦，便亲自奋力跃起。这一次，牙齿终于合拢在兔子身上，它带着猎物落回地面。
        - id: ch01-b45
          speaker: narrator
          text: >-
            就在这时，身旁忽然发出可疑的咔嚓声。一株小云杉弯了下来，来到它头顶，像要迎头打它。独眼狼惊讶地松开兔子，向后跳去，躲避这个从没见过的危险。它龇着牙，喉中低吼，浑身的毛因为愤怒和恐惧一齐竖起。小树细长的树身却在这时弹回直立，兔子也重新飞上半空，又跳起那场怪舞。
        - id: ch01-b46
          speaker: narrator
          text: >-
            母狼生了气，一口咬住伴侣的肩头，要惩罚它。独眼狼本来就在害怕，又不明白为什么遭到袭击，竟凶狠地反咬，在她的嘴边撕开一道伤。母狼没想到它胆敢还击，顿时愤怒地扑上去。独眼狼明白自己闯了祸，连忙求和，可她毫不理会，狠狠教训它。最后，独眼狼只好绕着圈转，把头躲开，让肩膀承受她的牙齿。
        - id: ch01-b47
          speaker: narrator
          text: >-
            兔子还在头顶跳舞。母狼坐到雪地上。现在，独眼狼更怕自己的伴侣，倒没有那么怕那棵怪树了。它再次跃起，叼着兔子落下，眼睛始终盯紧云杉。小树果然跟着弯了下来。
        - id: ch01-b48
          speaker: narrator
          text: >-
            独眼狼缩在树下等着挨打，浑身毛发直立，却没有松开嘴。那一下始终没有落下。它一动，树就跟着动。它停下，树也停下。独眼狼隔着紧咬的兔子低吼，最后决定还是不动最安全。况且，兔子温热的血含在嘴里，味道很好。
        - id: ch01-b49
          speaker: narrator
          text: >-
            母狼替它解开了难题。她从伴侣嘴里接过兔子。云杉在她头顶来回摇摆，像是在不断威胁，她却平静地把兔头啃掉。小树立刻弹直，再没有闹出别的动静，只像大自然原本安排的那样，端端正正地立在那里。随后，两头狼一起吃掉了神秘小树替它们捉住的猎物。
        - id: ch01-b50
          speaker: narrator
          text: >-
            附近还有别的兽径和狭道，那里也有兔子吊在半空。母狼领着独眼狼，把这些地方逐一找遍。独眼狼跟在后面仔细观察，终于学会怎样从套索里偷走猎物。日后的日子里，这门本领会给它很大的帮助。
