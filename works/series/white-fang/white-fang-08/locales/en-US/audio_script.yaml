  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: grave and vivid storytelling
        timbre: warm and resonant
        pace: measured
        pitch: medium-low
  chapters:
    - id: ch01
      title: THE LAW OF MEAT
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            The cub grew quickly. After resting for two days, he ventured out from the cave again. On that trip he found the young weasel whose mother he had helped eat, and the young one met the same end. This time, though, the cub did not get lost. When he was tired, he made his way back to the cave and slept. After that, he went out every day and ranged a little farther each time.
        - id: ch01-b02
          speaker: narrator
          text: >-
            He was learning the measure of his strength and his weakness. He began to know when he could be bold and when he had to be careful. Most of the time, caution was best. Only now and then, when he felt sure of his courage, did he give himself over to some small fury or fierce desire.
        - id: ch01-b03
          speaker: narrator
          text: >-
            A stray ptarmigan could still turn him into a little demon of rage. The squirrel on the blasted pine only had to chatter, and he answered savagely. A moose-bird could send him into an even wilder temper, because he had never forgotten the first one's peck on his nose.
        - id: ch01-b04
          speaker: narrator
          text: >-
            Yet even a moose-bird could not distract him when a more dangerous hunter was near. He remembered the hawk. Whenever its shadow crossed the ground, he crouched in the nearest thicket. His clumsy sprawling walk was gone now. He was beginning to move like his mother, low and secretive, seeming to make no effort even as he slipped along with surprising speed.
        - id: ch01-b05
          speaker: narrator
          text: >-
            His early luck with meat had not continued. The seven ptarmigan chicks and the young weasel were still all he had killed. But his hunger to kill grew stronger by the day. He longed to catch the squirrel that chattered so loudly and warned every wild creature that the wolf-cub was coming. Birds could escape into the air, and squirrels could climb trees. All he could do was creep toward the squirrel whenever it came down to the ground.
        - id: ch01-b06
          speaker: narrator
          text: >-
            The cub had great respect for his mother. She knew how to find meat and always brought him his share. She also seemed afraid of nothing. He could not understand that her courage came from knowledge and experience. He only saw her power. As he grew older, he felt it more sharply. Her warning paw struck harder now, and the firm nudge of her nose became a slash of her fangs. That made him respect her too. She demanded obedience, and as he grew, her patience grew shorter.
        - id: ch01-b07
          speaker: narrator
          text: >-
            Then famine came again, and now the cub understood the bite of hunger much more clearly. The she-wolf ran herself thin searching for meat. She hardly slept in the cave. Most of her time was spent following trails that brought her nothing. The famine did not last long, but while it lasted, it was severe. Her milk dried up, and the cub could not find a single mouthful of meat.
        - id: ch01-b08
          speaker: narrator
          text: >-
            Before, he had hunted as a game, simply because it delighted him. Now he hunted in deadly earnest, but still he found nothing. Failure made him learn faster. He watched the squirrel more closely and tried to creep upon it with greater skill. He studied the wood-mice and dug at their burrows. He learned more about moose-birds and woodpeckers too.
        - id: ch01-b09
          speaker: narrator
          text: >-
            At last there came a day when the hawk's shadow no longer sent him diving into the bushes. He was stronger, wiser, and more confident. He was also desperate. He sat out in the open and challenged the hawk to come down from the sky. Up there in the blue was meat, and his stomach ached for it. But the hawk would not accept the challenge. In the end, the cub crawled into a thicket and whimpered with hunger and disappointment.
        - id: ch01-b10
          speaker: narrator
          text: >-
            Then the famine ended. The she-wolf came home with meat unlike anything she had brought before. It was a lynx kitten, partly grown and smaller than the cub. The whole kill was his. His mother had already eaten somewhere else. He did not know that the rest of the lynx's litter had fed her, and he knew nothing of the desperate risk she had taken. He only knew that the soft-furred kitten was meat. With every mouthful, he grew happier.
        - id: ch01-b11
          speaker: narrator
          text: >-
            A full stomach made him sleepy. He lay in the cave against his mother's side until a terrible snarl woke him. He had never heard such a sound from her before. There was good reason for it, and the she-wolf knew that reason well. No one could rob a lynx's den and expect to escape the consequences.
        - id: ch01-b12
          speaker: narrator
          text: >-
            In the bright afternoon light, the cub saw the mother lynx crouching at the cave entrance. The fur rose along his back. This was fear, and instinct did not need to name it for him. Then the lynx cried out in rage. Her snarl climbed suddenly into a rough screech, and that sound made the danger plain.
        - id: ch01-b13
          speaker: narrator
          text: >-
            The life inside the cub surged up. He stood beside his mother and snarled bravely. She shoved him behind her without ceremony. The low cave roof kept the lynx from leaping inside. When she rushed in on her belly, the she-wolf sprang and pinned her down.
        - id: ch01-b14
          speaker: narrator
          text: >-
            The cub saw little of what followed. The cave filled with snarls, spitting, and screeches as the two mothers thrashed about. The lynx tore with her claws and struck with her teeth. The she-wolf had only her teeth.
        - id: ch01-b15
          speaker: narrator
          text: >-
            Once the cub rushed in and buried his teeth in one of the lynx's hind legs. He held on and growled with all his fury. He did not know that the weight of his body was slowing that leg and saving his mother from some of its claws. Then the twisting fight rolled over him. Both bodies crushed him down, and his grip was torn loose.
        - id: ch01-b16
          speaker: narrator
          text: >-
            The two mothers broke apart for an instant. Before they could clash again, the lynx swept a huge front paw at the cub. Her claws laid his shoulder open to the bone and hurled him sideways against the cave wall. His sharp cries of pain and terror joined the uproar.
        - id: ch01-b17
          speaker: narrator
          text: >-
            The battle lasted so long that the cub cried until he had no cries left. Then courage rose in him a second time. When the fight finally ended, he was once more hanging from a hind leg, growling furiously through his clenched teeth.
        - id: ch01-b18
          speaker: narrator
          text: >-
            The lynx was dead, but the she-wolf was weak and badly hurt. At first she nuzzled the cub and licked his wounded shoulder. Then the blood she had lost took away her strength. For a whole day and night, she lay beside her dead enemy without moving and hardly seemed to breathe.
        - id: ch01-b19
          speaker: narrator
          text: >-
            For a week she left the cave only to drink. Each journey was slow and painful. By the end of that week, they had eaten the lynx, and the she-wolf's wounds had healed enough for her to follow the meat-trail again.
        - id: ch01-b20
          speaker: narrator
          text: >-
            The cub's shoulder stayed stiff and sore, and the terrible slash made him limp for some time. Still, the world felt different now. He moved through it with a confidence he had never possessed before the battle. He felt capable in a way he had not felt before. He had seen life's fiercer face. He had fought, sunk his teeth into an enemy's flesh, and lived through it.
        - id: ch01-b21
          speaker: narrator
          text: >-
            After that, he carried himself more boldly. There was a new touch of defiance in him. Small things no longer frightened him, and much of his old shyness had disappeared. But the unknown never stopped pressing around him. Its mysteries and terrors could not be seen or touched, yet they always seemed to threaten.
        - id: ch01-b22
          speaker: narrator
          text: >-
            He began to follow his mother on the meat-trail. He watched many kills and slowly learned to take a part in them. In his own dim way, he was learning the law of meat.
        - id: ch01-b23
          speaker: narrator
          text: >-
            To him, life came in two kinds. There was his own kind, which meant his mother and himself. Then there was the other kind, every living thing that moved. Yet that other kind was divided again. Some creatures were killed and eaten by his own kind. They were the creatures that did not kill and the smaller creatures that did. The rest might kill and eat his own kind, unless his own kind killed and ate them first.
        - id: ch01-b24
          speaker: narrator
          text: >-
            From all this came the law. The aim of life was meat, and life itself was meat. Life lived upon life. There were eaters, and there were the eaten. The law was simple. Eat or be eaten. The cub never put it into words or stopped to draw a lesson from it. He did not even think about the law. He simply lived it.
        - id: ch01-b25
          speaker: narrator
          text: >-
            Everywhere he looked, he saw that law at work. He had eaten the ptarmigan chicks. The hawk had eaten their mother, and the hawk would have eaten him as well. Later, when the cub had grown stronger, he wanted to eat the hawk. He had eaten the lynx kitten. Its mother would have eaten him if she had not been killed and eaten herself.
        - id: ch01-b26
          speaker: narrator
          text: >-
            And so it went. Every living creature around him obeyed the law, and the cub belonged to it too. He was a killer. His only food was meat, living meat. It might race away from him, fly into the sky, climb a tree, or hide beneath the ground. It might turn and fight him. Sometimes it might turn the hunt around and come racing after him.
        - id: ch01-b27
          speaker: narrator
          text: >-
            If the cub could have thought like a person, he might have seen life as one great hunger. The world would have seemed full of hungry creatures, each driven by its own appetite. They chased and were chased. They hunted and were hunted. They ate and were eaten. Everything moved blindly through violence and confusion, a chaos of hunger and killing. Chance ruled it all, without mercy, without a plan, and without an end.
        - id: ch01-b28
          speaker: narrator
          text: >-
            But the cub did not think like a person, and he could not stand back and see the whole. He followed one purpose and held one desire at a time. The law of meat was only one among countless smaller laws he still had to learn and obey.
        - id: ch01-b29
          speaker: narrator
          text: >-
            The world was full of surprises. The life moving inside him and the play of his muscles gave him endless happiness. Every run let him feel that life working through his body. Chasing down meat brought fierce excitement and delight. He enjoyed his rages and his battles. Even terror and the mystery of the unknown urged him onward into life.
        - id: ch01-b30
          speaker: narrator
          text: >-
            There were easier pleasures too. A full stomach and a lazy sleep in the sunshine repaid every struggle and hardship. Yet running, hunting, raging, and fighting carried their own reward. They let the life within him pour itself out through his body. Life was happy when it could express itself. So the cub had no complaint against the hard and dangerous world around him.
        - id: ch01-b31
          speaker: narrator
          text: >-
            He was very much alive, very happy, and very proud of himself.
