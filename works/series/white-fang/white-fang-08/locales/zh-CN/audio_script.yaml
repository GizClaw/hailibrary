audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 沉着克制，带着北国故事的冷峻张力
        timbre: 温厚清晰，略显低沉
        pace: 舒缓而有变化
        pitch: 中低
  chapters:
    - id: ch01
      title: 第五章　肉之法则
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            灰色幼崽长得很快。休息两天后，他又走出了洞穴。这次，他找到了那只小黄鼠狼，就是被他吃掉的黄鼠狼母亲留下的幼崽。他也杀死了它。好在这一回，他没再迷路。累了，他就自己回洞睡觉。从此，他每天都会出门，游荡得一天比一天远。
        - id: ch01-b02
          speaker: narrator
          text: >-
            他慢慢摸清了自己有多强，又有多弱，也知道了什么时候可以大胆，什么时候必须小心。对他来说，时时刻刻保持谨慎总没有错。只有偶尔确信自己不会输时，他才会放任怒火和欲望，闹上一场。
        - id: ch01-b03
          speaker: narrator
          text: >-
            一看见落单的雷鸟，他就会变成一头怒气冲冲的小恶魔。雷劈松树上的那只松鼠只要吱吱叫，他也总会恶狠狠地回应。松鸡更容易惹怒他，几乎每次露面都能叫他大发雷霆。第一次见到这种鸟时，鼻尖挨的那一啄，他一直记得。
        - id: ch01-b04
          speaker: narrator
          text: >-
            不过，当别的猎肉者在附近游荡时，他连松鸡也顾不上了。那只鹰，他从来没有忘记。只要鹰影从地面扫过，他马上就会缩起身子，钻进最近的灌木。他走路也不再四脚岔开，笨拙摇摆。如今，他开始像母亲那样压低身体，悄悄前行。看着似乎毫不费力，速度却快得叫人难以察觉。
        - id: ch01-b05
          speaker: narrator
          text: >-
            他真正杀死过的猎物，仍旧只有七只雷鸟雏鸟和一只小黄鼠狼。早先那点好运已经用完了，可他想要捕杀的欲望越来越强。那只松鼠总爱没完没了地大叫，把幼狼靠近的消息告诉荒野里所有生灵。他饿着肚子，一心想把它捉住。可鸟能飞上天空，松鼠能爬上树。他只能等松鼠下到地面，再设法偷偷接近，不让它发现。
        - id: ch01-b06
          speaker: narrator
          text: >-
            幼崽很敬畏母亲。她总能弄到肉，也一定会分给他。她还什么都不怕。他不知道，那是经验和见识给她的勇气，只觉得母亲身上有一股强大的力量。对他来说，母亲就是力量本身。等他再长大些，这份力量变得更加鲜明。母亲教训他的爪子越来越重，鼻吻责备地一拱，也变成了尖牙猛然一划。他反而更敬畏她了。她一定要他服从，而他越大，她越没有耐心。
        - id: ch01-b07
          speaker: narrator
          text: >-
            饥荒再次降临。幼崽的心智比从前清楚，这次更真切地尝到了饥饿。母狼到处寻找猎物，跑得越来越瘦。她很少回洞睡觉，大部分时间都在追寻肉食，却一次次空手而归。这场饥荒持续得不算久，却十分严酷。母狼没了奶，幼崽也连一口肉都找不到。
        - id: ch01-b08
          speaker: narrator
          text: >-
            过去，他捕猎只是为了好玩，享受追逐的快乐。现在，他是为了活命认真捕猎，可仍然什么都捉不到。失败逼着他更快成长。他仔细观察松鼠的习性，琢磨怎样更加巧妙地偷偷接近。他研究林鼠，想把它们从洞中挖出来。他也渐渐熟悉了松鸡和啄木鸟的生活门道。终于有一天，鹰影掠过，他没有逃进灌木。此时，他更强壮、更聪明，也更相信自己。更要紧的是，他已经饿得不顾一切。
        - id: ch01-b09
          speaker: narrator
          text: >-
            幼崽就那样坐在空地中央，向天上的鹰挑战。他知道，蓝天里浮着的是肉，是肚子苦苦渴求的肉。可鹰不肯下来跟他打。最后，他只能爬进灌木丛，为饥饿和失望低声呜咽。
        - id: ch01-b10
          speaker: narrator
          text: >-
            饥荒终于结束了。母狼带回来一种陌生的肉，那是一只还没长大的猞猁幼崽，年纪与灰色幼崽差不多，个头却更小。整只猎物都给了他。母狼已经在别处吃饱，可他不知道，她吃的是这窝里剩下的猞猁幼崽。他也不知道，母亲为此冒了多大的险。他只知道，这只皮毛柔软的小兽是肉。他一口口吃下去，越来越快活。
        - id: ch01-b11
          speaker: narrator
          text: >-
            吃饱以后，幼崽贴着母亲，在洞里沉沉睡去。母亲的低吼忽然把他惊醒。那吼声可怕极了，也许她一生都不曾这样吼过。她比谁都清楚，侵犯了猞猁的巢穴，绝不可能不付代价。午后强烈的光照进洞口。幼崽伏在那里，看见了猞猁母亲，背上的毛一下全竖了起来。恐惧就在眼前，根本用不着本能来提醒。接着，闯入者发出狂怒的叫声。低吼陡然拔高，变成沙哑刺耳的尖啸。就算眼前的一切还不够，这叫声也足以让他明白危险。
        - id: ch01-b12
          speaker: narrator
          text: >-
            体内的生命激起了幼崽的勇气。他站到母亲身边，英勇地低吼。母狼却毫不客气地把他顶到身后。洞口太低，猞猁不能直接跳进来，只好伏身猛冲。母狼迎上去，把她压倒。幼崽几乎看不清这场恶战，只见两头野兽滚作一团，吼声、喷气声和尖啸声震动洞穴。猞猁利爪与尖牙并用，又抓又咬。母狼只靠牙齿与她厮杀。
        - id: ch01-b13
          speaker: narrator
          text: >-
            有一次，幼崽猛地扑进战团，咬住了猞猁的后腿。他一边凶狠低吼，一边死死吊在那里。他并不知道，自己的重量拖住了那条腿，使它不能自如挥动，也让母亲少受了许多伤。战局忽然一变，他被两头猛兽一起压在身下，牙齿也给硬生生扯开了。她们刚一分开，还没再次扑向对方，猞猁便挥动巨大的前爪，扫向幼崽。利爪把他的肩头撕到骨头，又将他横着抛向洞壁。他因疼痛和恐惧尖声惨叫，洞里的混乱声响又添了一重。
        - id: ch01-b14
          speaker: narrator
          text: >-
            可搏斗还在继续。幼崽哭了很久，直到再也哭不动。随后，第二股勇气又从胸中涌起。等恶战终于结束时，他已经再次咬住猞猁的一条后腿，仍从齿缝间发出愤怒的低吼。
        - id: ch01-b15
          speaker: narrator
          text: >-
            猞猁死了，母狼也变得虚弱不堪，伤势很重。起初，她还舔着幼崽受伤的肩膀，轻轻爱抚他。可流失的鲜血带走了她的力气。整整一天一夜，她躺在敌人的尸体旁边，不动，也几乎不呼吸。接下来一个星期，她只为喝水离开洞穴，每一步都缓慢又痛苦。到后来，猞猁被他们吃得一干二净，母狼的伤也终于好到能再次踏上猎肉之路。
        - id: ch01-b16
          speaker: narrator
          text: >-
            幼崽的肩膀又僵又痛，那道可怕的爪伤让他跛了很久。但他眼里的世界已经不同了。他多了一份战斗以前从未有过的信心。他亲眼见过生命凶残的样子，也亲自战斗过。他的牙齿咬进过敌人的血肉，而他活了下来。从此，他走得更大胆，还多了一点从前没有的挑衅。他不再害怕那些微小的东西，胆怯也消失了许多。只有未知依然无形无体，带着秘密与恐怖，时时从暗处压迫他，威胁他。
        - id: ch01-b17
          speaker: narrator
          text: >-
            后来，他跟着母亲走上猎肉之路。他看见猎物怎样被杀死，自己也开始参与。渐渐地，他用那还很蒙眬的头脑，懂得了肉之法则。生命分成两类，一类是母亲和他，另一类是其余所有会活动的生灵。其余的生灵又能分成两种。一种会被他们杀死吃掉，其中有不杀生的动物，也有弱小的猎杀者。另一种会杀死并吃掉他们，或者反过来，被他们杀死吃掉。
        - id: ch01-b18
          speaker: narrator
          text: >-
            生命的目标是肉，生命本身也是肉，生命依靠生命活下去。世上有吞食者，也有被吞食者。肉之法则说得明白，不是吃掉别人，就是被别人吃掉。幼崽没有把它想成一句清楚的话，更不曾拿它来讲什么道理。他根本没有想过这条法则，只是依照它活着。
        - id: ch01-b19
          speaker: narrator
          text: >-
            这法则在他周围处处运转。他吃了雷鸟雏鸟，鹰吃了雷鸟母亲，鹰也差点吃了他。等他变得更凶猛，便又想吃掉鹰。他吃过猞猁幼崽。要不是猞猁母亲先被杀死吃掉，她也会吃掉他。所有活着的生灵都依照这条法则生活，幼崽自己也是法则不可分割的一部分。他是猎杀者，唯一的食物就是活生生的肉。那些肉会飞快逃走，会飞上天空，会爬上树，会钻进地底。有时，它们也会回过头来搏斗，甚至反过来追杀他。
        - id: ch01-b20
          speaker: narrator
          text: >-
            如果幼崽能像人一样思考，他也许会觉得，生命就是永远填不满的食欲。这个世界挤满了饥饿的生灵，它们追逐别人，也被别人追逐。它们捕猎，也被捕猎。它们吞食，也被吞食。一切都在盲目和混乱中发生，只有暴力、贪食与杀戮。偶然支配着这个冷酷的世界。这里没有安排，没有目的，也没有尽头。
        - id: ch01-b21
          speaker: narrator
          text: >-
            可幼崽并不会这样想。他看不了那么远。他一次只想一件事，也只追逐一个欲望。肉之法则之外，还有无数细小的法则，等着他学习和服从。世界里总有意外。体内生命的跃动，肌肉伸展收缩的感觉，都让他快乐。追逐猎物令他激动，发怒和战斗也令他痛快。甚至恐惧，还有未知的秘密，都在引着他继续活下去。
        - id: ch01-b22
          speaker: narrator
          text: >-
            生命当然也会给他轻松与满足。肚子饱了，就懒洋洋地躺在阳光下打盹。这样的享受，足以补偿他付出的所有力气和经历的所有辛苦。其实，就连奔波和搏斗也有自己的回报，因为那正是生命在他体内尽情施展。生命能够这样活出来，总是快乐的。所以，幼崽并不怨恨这个处处与他为敌的世界。他活力十足，快活极了，也为自己感到骄傲。
