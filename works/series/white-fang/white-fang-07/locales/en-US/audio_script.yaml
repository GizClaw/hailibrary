audio_script:
  language: en-US
  cast:
    narrator:
      display_name: Narrator
      tts:
        delivery: grave and vivid storytelling
        timbre: warm and resonant
        pace: measured
        pitch: medium-low
  chapters:
    - id: ch01
      title: THE WALL OF THE WORLD
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            By the time his mother began leaving the cave to hunt, the grey cub had learned the law that kept him away from the entrance. Her nose and paw had driven the lesson into him many times. Now the instinct of fear was growing inside him too. He had never met anything frightening in his short cave life, yet fear was already there. It had traveled down through a thousand thousand lives. He received it from One Eye and the she-wolf, who had received it from every generation of wolves before them. Fear was the Wild's ancient legacy, and no animal could escape it or trade it away.
        - id: ch01-b02
          speaker: narrator
          text: >-
            The cub knew fear without knowing what it was made of. Perhaps he accepted it as one more limit on his life. He already understood limits. Hunger had shown him one whenever he could not satisfy it. So had the solid cave wall, his mother's sharp nudge, the crushing blow of her paw, and the hunger left unanswered through several famines. All these had taught him that the world did not offer complete freedom. Life had laws and restraints. Obeying them meant escaping pain and reaching the things that felt good.
        - id: ch01-b03
          speaker: narrator
          text: >-
            He never reasoned this out as a person would. His mind made no argument about laws or freedom. He simply sorted the world into things that hurt and things that did not. Once he had made that division, he avoided whatever hurt, along with the limits that caused the pain. That left him free to seek the comforts and rewards of being alive.
        - id: ch01-b04
          speaker: narrator
          text: >-
            So he obeyed both his mother and that unknown thing called fear. He stayed away from the cave mouth, which was still a white wall of light to him. While she was gone, he slept most of the time. When he woke, he lay very still and held back the little cries that wanted to rise from his throat.
        - id: ch01-b05
          speaker: narrator
          text: >-
            Once, as he lay awake, a strange sniff came from the white wall. A wolverine stood outside, trembling at its own boldness as it smelled what was inside the cave. The cub knew none of that. He knew only that the sound was strange. It was unknown, and the unknown was one of the things that made fear terrible.
        - id: ch01-b06
          speaker: narrator
          text: >-
            The fur rose along his back, but he made no sound. He had never learned what a wolverine was, or why he should bristle at one. The reaction came from the fear within him, not from anything he had learned in his own life. And fear brought another instinct with it. It told him to hide. Though terror raged through him, he lay without moving or making a sound. He was frozen so completely that he looked dead. When his mother returned, she smelled the wolverine's trail and growled. Then she bounded inside, licking and nuzzling him with more affection than usual. Somehow, the cub felt he had escaped a terrible hurt.
        - id: ch01-b07
          speaker: narrator
          text: >-
            But other forces were working in the cub, and the greatest was growth. Instinct and law demanded obedience. Growth demanded that he disobey. His mother and fear pushed him away from the white wall, while growth was life, and life was always moving toward the light. The tide inside him could not be held back. It rose with every mouthful of meat he swallowed and every breath he drew. At last its rush swept fear and obedience aside. One day, the cub spread his legs wide and sprawled toward the entrance.
        - id: ch01-b08
          speaker: narrator
          text: >-
            This wall did not behave like any wall he knew. As he approached, it kept moving away. He pushed his tender little nose ahead of him, waiting for the collision, but no hard surface met it. The wall seemed to let him through as easily as the light it was made of. To his eyes, brightness had always been a solid shape. Now he entered what he had believed was a wall and felt its substance bathing him on every side.
        - id: ch01-b09
          speaker: narrator
          text: >-
            He could not understand it. He seemed to be crawling through a solid thing, yet nothing stopped him, and the light kept growing brighter. Fear urged him to turn back, but growth drove him on. Then, all at once, he reached the cave mouth. The wall he thought surrounded him leaped away to an immeasurable distance. The brightness hurt his eyes and left him dazzled. At the same time, the cave's small space opened into a world so enormous that the sudden change made him dizzy.
        - id: ch01-b10
          speaker: narrator
          text: >-
            Without any choice on his part, his eyes began to adjust to the brightness and the greater distance. At first the wall had jumped beyond everything he could see. Soon it came into view again, but it was unbelievably far away and looked completely different. It was a many-colored wall now. Trees lined the stream. Beyond them, a mountain towered above the trees. Above the mountain stretched the sky, towering higher still.
        - id: ch01-b11
          speaker: narrator
          text: >-
            A great fear seized him. Here was more of the terrible unknown than he had ever imagined. He crouched low on the cave's edge and stared out at the world. Everything beyond him was unfamiliar. Because he did not know it, he believed it must be hostile. The fur lifted along his back, and his lips drew weakly into what he meant to be a fierce, frightening snarl. From all his smallness and fear, he challenged and threatened the whole wide world.
        - id: ch01-b12
          speaker: narrator
          text: >-
            Nothing answered his challenge. He kept looking until interest made him forget to snarl. Soon he forgot to be afraid as well. For the moment, growth had defeated fear by taking the form of curiosity. His attention moved to the things nearest him. A patch of open stream flashed in the sunlight. A blasted pine stood at the foot of the slope. The slope itself climbed all the way to the cave and stopped only two feet beneath the ledge where he crouched.
        - id: ch01-b13
          speaker: narrator
          text: >-
            All his life, the cub had walked on the level floor of the cave. He had never felt the pain of a fall, so he did not even know that falling was possible. The empty air before him looked like one more place to put his paw. He stepped boldly out. With his hind legs still planted on the cave ledge, his body tipped forward and his head dropped. The earth struck his nose with a hard blow that made him yelp. Then he began rolling down the slope, over and over.
        - id: ch01-b14
          speaker: narrator
          text: >-
            Terror swept through him. The unknown had caught him at last. It held him savagely and seemed ready to do some dreadful harm, though he had no idea what that harm might be. This was nothing like lying frozen while danger waited nearby. Now danger had him in its grip, and silence could not save him. He cried again and again like any frightened puppy as the ground tumbled him onward. The slope slowly grew gentler, and grass covered its base. He lost speed and stopped. After one last desperate yell, he let out a long, whimpering wail. Then, as naturally as if he had cleaned himself a thousand times, he began licking the dry clay from his fur.
        - id: ch01-b15
          speaker: narrator
          text: >-
            When he was clean, he sat up and looked around, like the first person from Earth landing on another planet. The cub had broken through the wall of the world. The unknown had released him, and here he was without injury. Yet even that first person on another planet would have found more that seemed familiar. The cub had no past knowledge to guide him and had received no warning that any of these things existed. All at once, he had become an explorer in a completely new world.
        - id: ch01-b16
          speaker: narrator
          text: >-
            Since the terrible unknown had let him go, he forgot its terror and grew curious about everything. He examined the grass beneath him, a moss-berry plant nearby, and the dead trunk of the blasted pine. A squirrel raced around the trunk and suddenly found him there. The cub crouched and snarled in fright. The squirrel was just as scared. It rushed up the tree, then chattered savagely from safety.
        - id: ch01-b17
          speaker: narrator
          text: >-
            Seeing the squirrel run away gave the cub courage. A woodpecker startled him next, but he recovered and went on with growing confidence. Soon a moose-bird hopped boldly up to him as if it had no respect for him at all. The cub was confident enough to reach toward it with a playful paw. The bird answered with a sharp peck right on the end of his nose. He dropped down and cried in pain. His noise proved too much for the moose-bird, and it flew away to safety.
        - id: ch01-b18
          speaker: narrator
          text: >-
            The cub was learning. His cloudy little mind had already begun making a new, unconscious division. Some things were alive, and some were not. Lifeless things stayed where they were. Living things moved about, and he could never know what they might do next. The only thing he could expect from them was the unexpected. From now on, he would have to watch living things and be prepared.
        - id: ch01-b19
          speaker: narrator
          text: >-
            He traveled very clumsily through the new world. He ran into sticks and other obstacles. A twig that looked far away would strike his nose the next moment or scrape along his ribs. The ground itself was uneven. Sometimes he stepped too far and bumped his nose. Just as often, he did not step far enough and stubbed his feet. Pebbles and stones shifted when he put his weight on them. So he learned that lifeless things were not all as steady as the floor and walls of his cave. He also learned that little lifeless things were more likely than large ones to roll over or fall. Every accident taught him. The farther he went, the better he walked. His body was adjusting with every step. He was learning how to control his muscles, where his strength ended, and how to measure the distance between himself and everything around him.
        - id: ch01-b20
          speaker: narrator
          text: >-
            A beginner's luck was with him. He had been born to hunt meat, though he did not know it, and on his very first journey he stumbled upon meat just outside his cave. He found it through pure clumsiness. While trying to walk along the trunk of a fallen pine, he stepped on rotten bark. It crumbled beneath his feet. With a hopeless yelp, he pitched over the curved side of the trunk, smashed through the leaves and stalks of a small bush, and landed on the ground at its heart. There, hidden from sight, was a nest holding seven ptarmigan chicks.
        - id: ch01-b21
          speaker: narrator
          text: >-
            Their noises frightened him at first. Then he saw how small they were, and his courage returned. They moved, so he set one paw on a chick and made it struggle faster. That pleased him. He sniffed it, then lifted it in his mouth. The tiny body fought against him and tickled his tongue. At that same moment, he became aware of his hunger. His jaws closed. Fragile bones crunched, and warm blood filled his mouth. The taste was good. This was the meat his mother brought him, only now it was alive between his teeth, and that made it better. He ate the chick. Then he went on until he had swallowed the entire brood of seven. After licking his jaws just as his mother did, he began crawling out of the bush.
        - id: ch01-b22
          speaker: narrator
          text: >-
            As he crawled out, a whirlwind of feathers struck him. The rush confused and blinded him. Angry wings beat around his body until he could neither see nor understand what was happening. He hid his head between his paws and yelped, but the blows only came faster and harder. The mother ptarmigan was wild with fury. Before long, the cub's fear turned to anger. He rose snarling and lashed out with his paws. His little teeth sank into one wing. He held on and pulled with all his strength while the bird showered him with blows from the other.
        - id: ch01-b23
          speaker: narrator
          text: >-
            This was his first battle, and it thrilled him. He forgot everything about the unknown and was no longer afraid of anything. He was fighting and tearing at a living creature that fought back. And this living creature was also meat. The desire to kill swept over him. He had destroyed the small creatures. Now he would destroy this large one. He was too busy and too happy to understand that he was happy. Feelings greater than any he had known surged through him. For the first time, he was discovering his place in the world. He was doing what his body had been made to do. He was killing meat and battling in order to kill it.
        - id: ch01-b24
          speaker: narrator
          text: >-
            He growled through tightly clenched teeth and held fast to the wing. The ptarmigan dragged him out of the bush. When she turned and tried to pull him back beneath its shelter, he braced himself and hauled her away from it, farther into the open. All the while, she cried out and hammered him with her free wing. Feathers flew around them like falling snow. The cub's excitement rose higher and higher. All the fighting blood of his breed was awake in him and rushing through him. This was what it meant to live, though he could not know it, and he clung to the wing with all his strength.
        - id: ch01-b25
          speaker: narrator
          text: >-
            After a while, the ptarmigan stopped struggling. Cub and bird lay on the ground, staring at each other. He tried to give a savage growl. She pecked the nose that was already sore from his other adventures. He flinched but kept his grip. She pecked again and again until his flinching turned to whimpering. He tried to back away, forgetting that his teeth pulled her with him. Peck after peck landed on his aching nose. At last his fighting spirit drained away. He released her and fled across the open ground.
        - id: ch01-b26
          speaker: narrator
          text: >-
            On the far side of the open space, he lay near the edge of the bushes. His tongue hung from his mouth, and his chest heaved as he panted. His battered nose still hurt enough to keep him whimpering. Then, without warning, he felt that something terrible was about to happen. All the fear of the unknown rushed back over him. By instinct, he shrank into the shelter of the bush. At that instant, moving air brushed across him and a great winged body swept past, dark and silent. A hawk had plunged from the blue and missed him by the smallest distance.
        - id: ch01-b27
          speaker: narrator
          text: >-
            The cub stayed hidden, recovering from his fright and peering fearfully from the leaves. Across the open space, the mother ptarmigan fluttered from her ruined nest. Her loss held all her attention, so she did not notice the winged bolt falling from the sky. But the cub saw, and what he saw became both a warning and a lesson. The hawk plunged straight down with terrible speed. Its body skimmed just above the earth. Its talons struck deep into the ptarmigan, and she gave one cry of pain and fear. Then the hawk rushed upward again, carrying her away into the blue.
        - id: ch01-b28
          speaker: narrator
          text: >-
            The cub waited a long time before leaving the bushes. He had learned that living things were meat and tasted good. He had also learned that large living things could hurt him. Small creatures like ptarmigan chicks were better to eat, while large ones like their mother were better left alone. Even so, a small ambition pricked at him. He wanted another battle with a ptarmigan hen. The hawk had taken this one, but perhaps he could find another.
        - id: ch01-b29
          speaker: narrator
          text: >-
            He followed a sloping bank down to the stream. He had never seen water before. The footing looked good, smooth and free of bumps or holes, so he stepped boldly out. He went straight through the surface and plunged crying into the arms of the unknown. The water was cold, and he gasped in quick, frightened breaths. But when he tried to breathe, water rushed into his lungs instead of the air that had always come before. The choking felt like the pain of death, and to him it meant death. He had no conscious knowledge of dying, but the instinct for it lived in him as it lived in every creature of the Wild. Death was the greatest possible hurt. It was the heart of the unknown, the sum of all its terrors, and the final disaster he feared without knowing anything about it.
        - id: ch01-b30
          speaker: narrator
          text: >-
            He rose to the surface, and sweet air poured into his open mouth. He did not sink again. As if he had always known how, he struck out with all four legs and began to swim. The near bank was only a yard away, but he surfaced with his back toward it. He saw the opposite bank first and headed that way across the pool, where the little stream spread twenty feet wide.
        - id: ch01-b31
          speaker: narrator
          text: >-
            Halfway across, the current seized him and swept him into the small rapid below the pool. Swimming could do little for him there. The quiet water had suddenly turned angry. One moment he was beneath it, and the next he was on top. It spun him around, rolled him over, and slammed him against rocks. He yelped at every blow, so that his cries marked each rock he struck.
        - id: ch01-b32
          speaker: narrator
          text: >-
            Below the rapid lay another pool. An eddy caught him there, carried him gently toward shore, and set him just as gently on a bed of gravel. He scrambled frantically beyond the water's reach and collapsed. The world had taught him another lesson. Water was not alive, yet it moved. It looked as solid as earth, yet it had no solidity at all. Things were not always what they seemed. His distrust of the unknown had been born in him, passed down through his ancestors. Now his own experience had made it stronger. From then on, he would not trust the look of a thing. He would first have to discover what it truly was.
        - id: ch01-b33
          speaker: narrator
          text: >-
            One more adventure still waited for him that day. First, he remembered that there was such a being as his mother. The memory brought a feeling stronger than all his curiosity. He wanted her more than everything else in the world put together. His little body was worn out by all it had gone through. His small brain was equally tired, because in all his life it had never worked so hard as it had that day. Sleep pulled at him too. Overwhelmed by loneliness and helplessness, he set out to find his mother and the cave.
        - id: ch01-b34
          speaker: narrator
          text: >-
            As he sprawled between some bushes, a sharp, threatening cry rang out. Yellow flashed before his eyes, and a weasel sprang away. It was small, so he was not afraid. Then he noticed an even smaller creature at his feet, only a few inches long. It was a young weasel that, like him, had disobeyed and gone exploring. The little weasel tried to escape. The cub rolled it over with one paw, and it made a strange grating sound.
        - id: ch01-b35
          speaker: narrator
          text: >-
            The yellow flash returned. The sharp cry came again, and in the same instant the mother weasel struck the side of his neck. Her teeth cut into his flesh. The cub yelped, cried, and scrambled backward. He saw her leap to her young one and vanish with it into the nearby thicket. His neck hurt, but his wounded feelings hurt even more. How could something so small be so savage? He had not yet learned that, for her size and weight, the weasel was among the fiercest and most terrible killers in the Wild. He was about to learn part of that lesson.
        - id: ch01-b36
          speaker: narrator
          text: >-
            While he still sat there whimpering, the mother weasel came back. With her young one safe, she no longer rushed straight at him. She approached with care, giving the cub a clear look at her lean body, as narrow and quick as a snake. Her head rose eagerly above it and looked snakelike too. Her sharp, threatening cry lifted the fur along his back, and he snarled a warning. She kept coming, closer and closer. Then she leaped with more speed than his untrained eyes could follow. The lean yellow body vanished from his sight for a moment. An instant later, she was at his throat, with her teeth buried through his hair and into his flesh.
        - id: ch01-b37
          speaker: narrator
          text: >-
            At first he snarled and tried to fight her. But he was very young. This was only his first day in the world beyond the cave, and his first day of real battles. His snarl soon broke into a whimper. Instead of fighting to win, he struggled only to escape. The weasel never relaxed her hold. She hung from his throat and pressed her teeth deeper, trying to reach the great vein where his lifeblood pulsed. The weasel was a drinker of blood. Whenever she could, she drank directly from the throat where life itself flowed.
        - id: ch01-b38
          speaker: narrator
          text: >-
            The grey cub would have died there. If the she-wolf had not come bounding through the bushes, there would have been no more story to tell about him. The weasel let go of the cub and flashed toward his mother's throat. She missed the throat but fastened onto the she-wolf's jaw instead. The she-wolf whipped her head with one sudden snap. The motion tore away the weasel's grip and flung her high into the air. While the lean yellow body was still above the ground, the she-wolf's jaws closed around it. Her teeth crunched together, and the weasel met death between them.
        - id: ch01-b39
          speaker: narrator
          text: >-
            Once again, his mother covered the cub with affection. Her joy at finding him seemed even greater than his joy at being found. She nuzzled and caressed him, then licked the wounds left by the weasel's teeth. After that, mother and cub ate the blood-drinker together. Then they returned to the cave and slept.
