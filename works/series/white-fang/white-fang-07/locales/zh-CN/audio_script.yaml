audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 沉着克制，带着北国故事的冷峻张力
        timbre: 温厚清晰，略显低沉
        pace: 舒缓而有变化
        pitch: 中低
  chapters:
    - id: ch01
      title: 恐惧的规矩
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            母亲开始离开洞穴出去捕猎时，灰色幼崽已经把一条规矩记得牢牢的，那就是不许靠近洞口。母亲用鼻吻和爪子，一次次把规矩教给他。他身体里那种惧怕的本能，也渐渐醒了。虽然他短短的一生中还没遇见过真正可怕的东西，恐惧却早已藏在血脉里，从遥远的祖先那里，经过千百万次生命，一代代传到他身上。他从独眼狼和母狼那里接过这份遗产，而他们又从之前无数代狼那里得到它。恐惧，是荒野留给所有动物的遗产，谁也逃不掉，更不能拿它换来一口吃的。
        - id: ch01-b02
          speaker: narrator
          text: >-
            灰色幼崽不知道什么叫恐惧，也许只把它当成生命里的一种限制。他早就知道限制是什么。饿着肚子却找不到食物，是限制。坚硬的洞壁挡住去路，是限制。母亲尖锐的鼻吻会拱疼他，沉重的爪子会把他打回去。几场饥荒里无法平息的饥饿，也一直束缚着他。一次次挨饿和受疼，让他懂得世界并不处处自由。生命有它的界限，这些界限就是法则。只要服从它们，就能躲开伤害，过得舒服一点。
        - id: ch01-b03
          speaker: narrator
          text: >-
            他当然不会像人那样想清其中的道理。他只是分辨哪些东西会带来疼痛，哪些不会。分清以后，他便避开那些会伤害他的东西。因此，他服从母亲，也服从那个没有名字的未知之物，始终离洞口远远的。那儿在他眼里，仍是一面白色的光墙。母亲不在时，他大多睡着。偶尔醒来，也静静忍住喉咙里要冒出来的呜咽。
        - id: ch01-b04
          speaker: narrator
          text: >-
            有一次，他醒着躺在洞里，听见白墙外传来陌生的嗅闻声。他不知道那里站着一只貂熊。那家伙正为自己的大胆浑身发抖，却还在小心嗅探洞中的气味。幼崽只听出那声音不属于任何熟悉的东西。它未知，也就可怕，因为恐惧很大一部分正是由未知构成的。
        - id: ch01-b05
          speaker: narrator
          text: >-
            灰色幼崽背上的毛一下竖起，却没发出半点声音。没有任何亲身经历教过他该这样反应，藏在体内的恐惧却自己显露出来，还唤醒了隐藏的本能。他怕得发狂，却一动不动，仿佛成了一块没有生命的石头。母狼回来后闻见貂熊的足迹，先低声咆哮，随即冲进洞里，急切地舔他、拱他。幼崽觉得，自己像是躲过了一场大难。
        - id: ch01-b06
          speaker: narrator
          text: >-
            可他的身体里还有别的力量，其中最强的就是成长。天性和规矩让他服从，成长却催他反抗。母亲和恐惧要他远离白墙，生命却总要奔向光明。每吃下一口肉，每吸进一口气，他体内的生命之潮就涨高一点。终于有一天，奔涌的生命冲破了恐惧与服从。灰色幼崽叉开小腿，跌跌撞撞地向洞口爬去。
    - id: ch02
      title: 穿过世界之墙
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: >-
            这面墙和他遇过的所有墙都不同。他越靠近，它越往后退。他试着伸出柔嫩的鼻尖，却没撞上坚硬的表面。这墙像光一样，能让他穿过去，也会在他面前退开。本来只是一片景象，他却一直把它当作有形的东西。现在，他走进了那面墙，浑身沐浴在光里。
        - id: ch02-b02
          speaker: narrator
          text: >-
            他迷惑地向前爬。明明是在坚实的东西里面行走，光却越来越亮。恐惧催他回头，成长却推着他向前。忽然，他到了洞口。那面仿佛包围着他的墙猛地跃向远方，退到了无法丈量的地方。强光刺痛他的双眼，晃得他什么也看不清。骤然展开的辽阔空间又叫他头晕。他的眼睛自己适应起强光，重新调整焦点，去看那些突然变得遥远的东西。起初，那面墙完全跳出了视野。等他再次看见它时，它已经远得出奇，也换了模样。溪边的树木、树后的山峰，还有高过山峰的天空，共同筑成了一面色彩斑斓的墙。
        - id: ch02-b03
          speaker: narrator
          text: >-
            巨大的恐惧抓住了他。眼前尽是可怕的未知。他伏在洞口边缘，望着这个陌生而充满敌意的世界，背毛根根竖起，嘴唇无力地皱着，想挤出一声吓人的低吼。就这样，一个弱小又惊恐的生命，向整个广阔的世界发出了威胁。
        - id: ch02-b04
          speaker: narrator
          text: >-
            可什么也没发生。他继续望着，很快看得入了神，忘了低吼，也忘了害怕。成长又一次击退恐惧，化成好奇心占据了他。他看见近处的溪水在阳光下闪动，坡脚立着一棵雷劈死的松树。山坡一直伸到眼前，却在洞口下方两英尺的地方突然断开。
        - id: ch02-b05
          speaker: narrator
          text: >-
            灰色幼崽出生以来只走过平地，既没摔疼过，也不知道什么叫跌落。他大胆地一脚踩进空中，后腿还搭在洞口，脑袋已经向下栽去。地面狠狠撞上鼻子，他疼得叫了一声，紧接着便一圈圈滚下山坡。未知终于抓住了他，仿佛正要降下可怕的伤害。恐惧压倒成长，他像受惊的小狗一样尖声哀叫。
        - id: ch02-b06
          speaker: narrator
          text: >-
            他一路翻滚，一路又叫又号。未知还藏在身边时，他会僵住不动。如今未知已经牢牢抓住了他，仿佛正把他拖向某种可怕的伤害，安静再也救不了他。这时折磨他的已经不只是畏惧，而是让身体抽搐的惊恐。山坡渐渐平缓，坡底的草让他慢了下来。完全停住以后，他最后发出一声痛苦的尖叫，又拖长声音呜呜哀鸣。接着，他自然而然地舔掉满身干泥，好像已经这样梳洗过无数次。
        - id: ch02-b07
          speaker: narrator
          text: >-
            舔干净后，他坐起来望向四周，仿佛地球上第一个登上火星的人。他已经穿破了世界之墙，未知也放开了他，而他还好端端的。只是，就算真有人第一次登上火星，也不会像他这样对眼前的一切毫无准备。转眼间，他就成了一个全新世界里的探险者。
    - id: ch03
      title: 新世界的功课
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: >-
            危险的未知既然放过了他，他很快忘记了刚才的害怕，只觉得周围处处新奇。他看脚下的草，看不远处的岩高兰，也看空地边那棵雷劈松树的枯干。每一样东西都是第一次出现在他眼前，都等着他去靠近、去弄明白。一只松鼠绕过树根，迎面撞上他，吓得他立刻伏低身体，发出低吼。松鼠也吓坏了，飞快蹿上树，在安全的高处冲他凶狠地叫。
        - id: ch03-b02
          speaker: narrator
          text: >-
            这反而让幼崽多了几分胆量。那个小活物既然会逃到高处躲着，他便觉得自己没有那么弱小。后来碰见啄木鸟，他虽吃了一惊，仍然自信地往前走。一只松鸡大模大样地跳到近前时，他甚至顽皮地伸爪去碰。鸟喙猛啄在他的鼻尖上，他疼得缩成一团，叫声尖得连松鸡都受不了。那只鸟马上飞快地振翅逃走了。
        - id: ch03-b03
          speaker: narrator
          text: >-
            幼崽却在不断学习。他蒙眬的小脑袋已经无意中把东西分成两类，一类会动，一类不会动。会动的活物必须提防，因为它们会到处活动，谁也猜不出接下来会做什么。面对活物，什么意外都可能发生，他得随时准备应付。那些不会动的东西总待在原处，不会忽然改变动作，看起来似乎可靠一些。
        - id: ch03-b04
          speaker: narrator
          text: >-
            可他走得实在笨拙，总会撞上树枝。看着还远的细枝，转眼就抽在鼻子上，或擦过肋侧。地面也高低不平。他有时一步跨得太远，一头磕下去，有时又迈得不够，撞疼了脚趾。小石块踩上去还会滚动。于是他发现，不会动的东西也不都像洞穴那样安稳，越小的死物，反而越容易倒下或翻动。
        - id: ch03-b05
          speaker: narrator
          text: >-
            每一次失足都让他学到一点东西。他走得越久，脚步越稳。他正在适应这个新世界，也在学习怎样控制自己。他开始懂得该让肌肉做出多大的动作，身体能做到什么，又做不到什么。他也慢慢会判断东西之间的距离，以及它们离自己有多远。原先总会撞上他的障碍，现在渐渐能被他提前看见了。
    - id: ch04
      title: 第一场战斗
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: >-
            初学者的运气眷顾了他。他生来注定要捕猎血肉，自己却还不知道。第一次走出洞穴，他竟误打误撞找到了肉食。准确地说，是一头栽进了雷鸟的巢。他正沿着一棵倒下的松树行走，脚下腐朽的树皮突然塌了。他绝望地叫着，从圆圆的树干上摔下，砸穿矮树枝叶，落进灌木丛中央。身边正围着七只雷鸟雏鸟。
        - id: ch04-b02
          speaker: narrator
          text: >-
            雏鸟一齐叫起来，先把他吓了一跳。等看清它们个头很小，他的胆子就大了。他用爪子按住一只。雏鸟挣扎得越快，他越觉得有趣。他闻了闻，又把它叼进嘴里。那小东西扭来扭去，弄得舌头发痒。就在这时，饥饿醒了。他合拢上下颌，细骨咔嚓碎裂，温热的血流进嘴里。那味道好极了，和母亲带回来的肉一样，却还活在他的牙齿之间，因此更加鲜美。他吃掉一只，又把整窝都吞进肚里，这才学着母亲舔舔嘴，向灌木丛外爬去。
        - id: ch04-b03
          speaker: narrator
          text: >-
            一阵长着羽毛的旋风迎面扑来。猛烈的冲撞和愤怒拍打的翅膀让他眼前发花。他把脑袋埋进两爪之间，尖声哀叫，落在身上的打击却越来越重。雷鸟母亲已经怒不可遏。幼崽也发了火。他站起来低吼着挥爪反击，细牙咬住一边翅膀，拼命拉扯。雷鸟用另一边翅膀劈头盖脸地打他。
        - id: ch04-b04
          speaker: narrator
          text: >-
            这是他一生中的第一场战斗，他兴奋得把未知彻底忘了，再也不怕任何东西。他正和一个攻击自己的活物搏斗，一边挨打，一边撕咬它，而这个活物也是肉。杀戮的欲望抓住了他。他刚杀死几个小活物，现在还想杀死一个大的。他忙碌又快活，却不知道自己正在快活。一种从未有过的激动和狂喜，在他体内奔涌起来，胜过了往日的一切感受。
        - id: ch04-b05
          speaker: narrator
          text: >-
            他咬紧翅膀，从牙缝里低吼。雷鸟把他拖出灌木丛，又想把他拉回遮蔽下，他却反过来向外使劲，一直将她拖到空地上。雷鸟尖叫着拍打，羽毛像雪片一样四处飞散。幼崽已经亢奋到了极点，血脉里的战斗天性全被唤醒，在全身汹涌激荡。这就是活着，虽然他并不知道。他开始明白自己在世上的意义，开始做自己生来就该做的事，杀死肉食，为了杀死它而战斗。他正尽自己的全部力量，完成生命交给他的事情。
        - id: ch04-b06
          speaker: narrator
          text: >-
            过了一会儿，雷鸟不再挣扎。幼崽仍咬着她的翅膀，两个躺在地上互相瞪着。他拼命挤出威胁的低吼，雷鸟却一口啄中他那只早已疼痛不堪的鼻子。他缩了一下，还是不肯松口。一下，又一下，密集的啄击全落在鼻子上。他从畏缩变成呜咽，想往后逃，却忘了嘴里还咬着她，退一步就把她也拖一步。终于，他的战意退去，只好松开猎物，夹着尾巴逃过空地。
        - id: ch04-b07
          speaker: narrator
          text: >-
            他在空地另一边、靠近灌木边缘的地方躺下休息，舌头伸在嘴外，胸膛剧烈起伏，呼哧呼哧地喘气，鼻子疼得不停呜咽。就在这时，他感觉可怕的东西正要降临，本能地缩进灌木丛。几乎同时，一股气流擦过身体，一具长着巨大翅膀的躯体无声地掠过。一只鹰从蓝天俯冲下来，差一点就抓住了他。
        - id: ch04-b08
          speaker: narrator
          text: >-
            幼崽躲在灌木下，心有余悸地向外看。空地另一边，雷鸟母亲从被洗劫的巢边扑腾出来。她只顾为失去孩子而悲痛，没有看见天上那支长着翅膀的利箭。幼崽却看见了。鹰迅疾地冲下，贴着地面滑过，利爪扎进雷鸟身体。雷鸟发出痛苦惊恐的叫声，鹰已经带着她升上高空，飞进一片蔚蓝。
        - id: ch04-b09
          speaker: narrator
          text: >-
            很久以后，幼崽才走出藏身处。这一天，他已经学会了许多。活物是好吃的肉，可活物长得足够大，也会伤害他。最好吃雷鸟雏鸟那样的小活物，别去惹雷鸟母亲那样大的。不过，他心里仍有一点小小的雄心，还想跟那只雷鸟母亲再打一场。刚才密密麻麻落在鼻子上的啄击，并没让这愿望彻底消失。可她已经被鹰抓走了。也许别处还有雷鸟母亲，他要去找找。
    - id: ch05
      title: 水的真相
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: >-
            他顺着缓斜的河岸来到溪边，第一次见到了水。水面平平的，没有一点高低起伏，看起来很好落脚。他大胆地踩上去，立刻沉进未知的怀抱，吓得大叫。冰冷的水包住了他。他猛吸一口气，灌进肺里的却不是一直伴随他的空气，而是溪水。窒息带来的剧痛，对他来说就是死亡。他并不真的懂得死亡，却和荒野里所有动物一样，本能地知道它意味着最深的伤害，是未知的本质，也是未知之中一切恐怖的总和。那是可能落到他身上的终极灾难，他完全无法想象，也正因为一无所知，才怕得更深。
        - id: ch05-b02
          speaker: narrator
          text: >-
            他浮出水面，甘甜的空气立刻涌进张开的嘴。他没有再次沉下去，仿佛游泳是早已养成的习惯，四条腿一齐划动。近岸离他只有一码，可他浮上来时背对着它，睁眼先看到了对岸，于是马上向那边游去。溪流原本很窄，到了水潭却足足展开了二十英尺。他根本不知道自己选的是更远的岸，只顾朝眼睛最先看见的地方划去。
        - id: ch05-b03
          speaker: narrator
          text: >-
            游到一半，水流卷走了他，把他冲进水潭下端的小急流。刚才还平静的水突然发起怒来。他一会儿沉下，一会儿浮起，不停地翻滚、旋转，又一次次撞上石头。每撞一下，他就惨叫一声。单听那一路的叫声，简直可以数清他撞了多少块石头。
        - id: ch05-b04
          speaker: narrator
          text: >-
            急流下面还有一处水潭。回旋的水接住他，轻轻送到岸边，又把他放上一片砾石滩。他发疯似的爬出水面，倒在地上。现在，他对世界又多了一层认识。水不是活物，却会流动。它看起来像结实的地面，其实根本托不住身体。原来东西并不总像表面看起来那样。
        - id: ch05-b05
          speaker: narrator
          text: >-
            他本来就天生不信任未知，如今亲自吃了苦，这份不信任变得更深。他已经知道，水看起来和大地一样牢靠，真踩上去却完全是另一回事。从此，他自然会永远提防事物的表象。非得亲自弄清一样东西的真相，他才肯相信它。
    - id: ch06
      title: 回到母亲身边
      blocks:
        - id: ch06-b01
          speaker: narrator
          text: >-
            这一天，还有另一场历险在等他。他忽然想起，世上还有母亲，立刻觉得自己想要母亲，胜过想要任何东西。接连不断的遭遇让身体疲惫，也让小小的脑袋疲惫。在他短短的一生里，它从没像今天这样不停运转。他刚认识了天空、树木、活物和死物，又尝过跌落、战斗与流水，每一样都逼着他去感觉，去学习。何况，他已经困了。于是，他动身寻找洞穴和母亲，强烈的孤独与无助一齐涌了上来。
        - id: ch06-b02
          speaker: narrator
          text: >-
            他正在灌木间跌跌撞撞地走，忽然听见一声尖厉吓人的叫声。一道黄色影子从眼前闪过，一只黄鼠狼飞快跳开。那只是个小活物，他没有害怕。接着，他看见脚边还有个只有几英寸长的小东西，是一只黄鼠狼幼崽。它也和他一样，不听话地溜出来探险。小黄鼠狼想退开，他伸爪把它翻了个身。它发出刺耳的怪叫。
        - id: ch06-b03
          speaker: narrator
          text: >-
            黄色影子立刻又闪了回来。威吓的尖叫再次响起，灰色幼崽颈侧也挨了重重一下。黄鼠狼母亲锋利的牙齿切进他的皮肉。他号叫着向后挣扎，看见她扑到幼崽身边，带着它消失在灌木丛里。伤口还在疼，可更疼的是受伤的自尊。他坐下来，无力地呜咽。那只黄鼠狼明明瘦小，却凶猛得吓人。他还不知道，若按同样的体形和重量来算，黄鼠狼是荒野里最凶狠、最记仇、也最可怕的杀手。不过，他很快就要亲身学到这份知识的一部分。
        - id: ch06-b04
          speaker: narrator
          text: >-
            他还在呜咽，黄鼠狼母亲又出现了。她的孩子已经安全，所以不再猛冲，只是一步步谨慎地逼近。灰色幼崽这才看清，她的身躯又细又长，像条蛇。她高高昂起的脑袋急切而警觉，也像蛇一样。她发出锐利的威胁声，幼崽背毛顿时竖起。他低吼着警告，她却越靠越近。
        - id: ch06-b05
          speaker: narrator
          text: >-
            突然，黄鼠狼纵身跃起，快得幼崽毫无经验的眼睛根本跟不上。细瘦的黄色身影刚从视野里消失，下一刻已经扑上他的喉咙，牙齿深深咬进皮毛和血肉。起初，他还低吼着反击。可他太年幼了，这也只是他来到外面世界的第一天。低吼很快成了呜咽，反击也成了拼命挣脱。
        - id: ch06-b06
          speaker: narrator
          text: >-
            黄鼠狼死死吊在他身上，始终不肯松口。无论幼崽怎样扭动挣扎，她都跟着贴在他的喉咙上。她竭力把牙齿向下压，想咬到那条奔流着生命之血的大血管。黄鼠狼嗜血，最爱从猎物的咽喉直接吸取鲜血。再这样下去，灰色幼崽就会死掉，世上也不会再有关于他的故事。
        - id: ch06-b07
          speaker: narrator
          text: >-
            就在这时，母狼从灌木中飞奔而来。黄鼠狼松开幼崽，像闪电一样扑向母狼的喉咙。她没有咬中，却咬住了母狼的下颌。母狼猛地一甩头，快得像挥响一条鞭子。黄鼠狼的牙齿被挣开，细长的身体高高飞向空中。她还没有落地，母狼的双颌已经合拢，咬住那具黄色的身体。在牙齿的碎裂声里，黄鼠狼尝到了死亡。
        - id: ch06-b08
          speaker: narrator
          text: >-
            幼崽又一次感受到了母亲汹涌的爱。母亲终于找到了走失的孩子，她的喜悦似乎比幼崽被找到时还要强烈。她用鼻吻拱着他，温柔地抚弄他，又把黄鼠狼牙齿留下的一处处伤口舔干净。最后，母亲和幼崽一起吃掉了这个吸血者，回到洞穴，沉沉睡去。
