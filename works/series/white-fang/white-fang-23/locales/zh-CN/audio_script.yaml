audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 沉着克制，带着北国故事的冷峻张力
        timbre: 温厚清晰，略显低沉
        pace: 舒缓而有变化
        pitch: 中低
    scott:
      display_name: 威登·斯科特
      tts:
        delivery: 正直果断，愤怒时依然清醒
        timbre: 清朗坚实
        pace: 稳健有力
        pitch: 中低
    scott_father:
      display_name: 老斯科特
      tts:
        delivery: 稳重随和，偶尔流露长辈式的诙谐
        timbre: 浑厚清楚
        pace: 不疾不徐
        pitch: 低
    groom:
      display_name: 马夫
      tts:
        delivery: 朴实直接，受惊时声音骤然紧绷
        timbre: 粗厚有力
        pace: 中等偏快
        pitch: 中低
    beth:
      display_name: 贝丝
      tts:
        delivery: 活泼爽直，爱在家人谈笑时机敏插话
        timbre: 明亮清脆
        pace: 轻快
        pitch: 中高
    mary:
      display_name: 玛丽
      tts:
        delivery: 温和开朗，与家人相处自然亲切
        timbre: 柔亮清晰
        pace: 从容轻快
        pitch: 中
  chapters:
    - id: ch01
      title: 第三章　神的领地
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            白牙天生就会适应环境，又走过许多地方，既明白顺应环境是什么意思，也知道有时候非改变自己不可。斯科特法官的庄园叫山景庄园。白牙来到这里不久，便渐渐有了回家的感觉，也没再跟狗群闹出大冲突。这里的狗比他更懂南方诸神的规矩。它们亲眼看见神准许这头狼走进屋里。神让狼进屋虽然从未有过，可既然神已经认可，身为神的狗，它们也只能承认白牙有资格留下。
        - id: ch01-b02
          speaker: narrator
          text: >-
            迪克起初不得不跟他郑重地周旋几回，后来便平静地接受了庄园里新来的这个伙伴。要是由迪克作主，他们原本可以成为朋友，白牙却只想独处。他一辈子都远离同类，如今也不愿改变。迪克每次示好，都叫他心烦，他便低吼着把对方赶开。白牙记得北方的规矩，主人的狗不能伤害，可他也坚决守着自己的清静，不许谁闯进来。他对迪克不理不睬，做得十分彻底。久而久之，那条好脾气的狗终于放弃了，对白牙的兴趣还不如对马厩旁的拴马柱多。
        - id: ch01-b03
          speaker: narrator
          text: >-
            柯莉可不肯罢休。她服从神的命令，让白牙留在庄园，却没答应叫他过安生日子。白牙和他的同类曾对她的祖先犯下无数罪行。狼群蹂躏羊圈的古老记忆仿佛生在她血肉里，不会一天便淡去，也不会隔一代就消失，反而时时催她报复。她不能公然违抗神，便处处找白牙的小麻烦，好让他记住这场绵延了无数代的世仇。
        - id: ch01-b04
          speaker: narrator
          text: >-
            柯莉仗着自己是雌性，专门欺负白牙。白牙的天性不准他还击，她的纠缠又叫他没法装作看不见。她扑来时，他就把厚毛护住的肩膀迎向利齿，僵着腿，尽量威严地走开。她若逼得太紧，他只能拿肩膀挡着她，一圈圈地转，扭头望向别处，满脸耐心又厌烦。有时她一口咬中他的后腿，那份庄严顿时就没了。可只要办得到，白牙仍会当她不存在。听见她过来，他便起身避开。
        - id: ch01-b05
          speaker: narrator
          text: >-
            白牙要学的还多着呢。北方的生活跟山景庄园相比，实在太单纯了。头一件事，就是认清主人的家人。从前，米特萨和克卢库奇属于灰海狸，跟他共用食物、炉火和毯子。如今，屋里所有人也都属于爱的主人。
        - id: ch01-b06
          speaker: narrator
          text: >-
            可这座庄园远比一顶帐篷庞大，要留意的人也多得多。这里有斯科特法官和妻子，有主人的姐妹贝丝与玛丽，有他的妻子爱丽丝，还有四岁和六岁的两个孩子，威登与莫德。白牙不懂血缘，也没人能向他解释亲属关系，他这辈子都不会弄懂。他只摸清一件事，这些人全都属于主人。以后每逢有机会，他就观察他们怎样行动、怎样说话，连声音里最细微的变化也不放过。他慢慢看出每个人跟主人有多亲近，又得到多少宠爱。主人看重谁，白牙便看重谁。主人珍爱谁，他也要珍爱，并且仔细守护。
        - id: ch01-b07
          speaker: narrator
          text: >-
            对两个孩子也是这样。白牙从前讨厌孩子，既憎恶他们的手，也害怕那些手。印第安村里的孩子曾专横而残酷地对待他，给他的教训没有半点温柔。威登和莫德刚走近时，他便恶狠狠地瞪着他们，低吼警告。主人打了一下，又厉声喝止，他才容许两只小手在身上抚摸，可喉咙里始终只有警告，听不见半点爱的低吟。后来，他看出这个男孩和女孩在主人眼中有多么珍贵。从那以后，他们要摸他，再也不需要主人先来责罚了。
        - id: ch01-b08
          speaker: narrator
          text: >-
            白牙依旧不会热烈地亲近人。他不大情愿，却老老实实地让主人的孩子摆弄，像忍受一场痛苦的手术。实在忍不住了，他就站起来，坚定地大步走开。可慢慢地，他真的喜欢上了他们。他还是不会主动走过去，但看见他们时也不再转身避开，而肯留在原地等他们来。再往后，孩子们一靠近，他眼里便会亮起愉快的光。他们扔下他，去玩别的游戏时，他还会带着奇异的遗憾，目送他们离开。
        - id: ch01-b09
          speaker: narrator
          text: >-
            这种感情要一点点长出来，自然需要时间。孩子之后，他最看重的是斯科特法官，或许有两个原因。法官显然是主人珍爱的人，又从不强求白牙亲近。主人不在时，法官坐在宽阔的门廊上读报，白牙便喜欢卧在他脚边。法官偶尔看他一眼，说上一句话，不来打扰，只是安静地告诉他，自己知道他在那里，也承认他的存在。可主人一出现，对白牙来说，别的人便全都消失了。
        - id: ch01-b10
          speaker: narrator
          text: >-
            家里每一个人都能摸他、宠他，却永远得不到主人所得的那一份。无论他们怎样爱抚，都唤不出他喉咙里的爱之低鸣。再怎么努力，也哄不来他的依偎。毫无保留的托付与降服，还有那份绝对的信赖，他全都只给主人。事实上，在白牙眼中，家人从来没有别的身份，他们只是爱的主人所拥有的人。
        - id: ch01-b11
          speaker: narrator
          text: >-
            白牙也早早分清了家人和仆人。仆人害怕他，他则仅仅克制着不去攻击，因为在他看来，他们同样属于主人。双方只有中立，再没有别的关系。他们为主人做饭、洗碗，还干各种各样的活，跟马特从前在克朗代克时一样。说到底，这些人也是整个庄园的附属。
        - id: ch01-b12
          speaker: narrator
          text: >-
            屋外还有更多规矩。主人的领地虽然宽广又复杂，也有清楚的界线，只到郡道为止。道路和街巷属于所有神，别的栅栏里面又是别的神各自拥有的地盘。无数法则管着这一切，规定大家该怎样行动。可白牙听不懂神的语言，除了亲身经历，再没有别的学习办法。他先顺着本能行事，直到撞上某条法则。同样的事发生几回，他便把法则记住，以后不再触犯。
        - id: ch01-b13
          speaker: narrator
          text: >-
            教他最有用的，是主人的巴掌和责备。正因为爱得太深，主人轻轻打一下，也比灰海狸和比美·史密斯的任何毒打更让他痛苦。从前那些殴打只能伤到血肉，他的精神仍在血肉下面怒吼，壮烈又不可征服。主人的手掌却总是很轻，轻得伤不了身体，落下去的地方反而更深。那一下说的是主人不赞同他。白牙一明白这一点，原本不肯屈服的精神也会萎顿低垂。
        - id: ch01-b14
          speaker: narrator
          text: >-
            其实主人很少动手，只用声音就够了。白牙从那声音里听出自己做得对不对，再一点点改正举止。主人的声音就像一只罗盘，领着他辨明这个新天地和新生活的方向。
        - id: ch01-b15
          speaker: narrator
          text: >-
            在北方，只有狗是家养的。其余动物都属于荒野，只要不是太强大，任何狗都可以捕食。白牙一辈子都在活物中寻找食物，从没想过南方另有规矩。来到圣克拉拉谷不久，一天清早，他悠闲地绕过屋角，碰见一只逃出鸡场、独自冒险的鸡。本能催他吃掉它。白牙纵跃两下，牙光一闪，那只鸡惊恐地咯叫一声，便进了他的肚子。农场养出来的鸡又肥又嫩，他舔舔嘴，觉得这样的食物好极了。
        - id: ch01-b16
          speaker: narrator
          text: >-
            当天晚些时候，他又在马厩旁发现一只鸡。一个马夫冲来相救，随手抄起轻巧的马车鞭。第一鞭刚落下，白牙便丢下鸡，转而扑向这个人。棍棒也许能拦住他，鞭子可不行。他迎着第二鞭往前冲，没有躲闪，也没有出声。等他腾身扑向喉咙，马夫吓得踉跄后退。
        - id: ch01-b17
          speaker: groom
          text: “上帝啊！”
          emotion: fearful
        - id: ch01-b18
          speaker: narrator
          text: >-
            马夫扔掉鞭子，举起双臂护住咽喉。白牙的牙齿撕开了他的前臂，伤口深得露出骨头。真正叫马夫胆寒的还不是凶猛，而是白牙进攻时一声不响。他仍用撕裂流血的手臂挡着脸和喉咙，一点点退向马厩。若不是柯莉赶到，他一定会遭殃。柯莉曾救下迪克，如今又救了马夫。她狂怒地扑向白牙。她早就知道，那些笨拙糊涂的神全看错了。眼前这一幕证明她的怀疑句句属实，这个自古以来的劫掠者果然又在干他的老勾当。
        - id: ch01-b19
          speaker: narrator
          text: >-
            马夫终于逃进马厩。白牙在柯莉凶狠的利齿前节节后退，一会儿用肩膀挡着她，一会儿绕圈躲避。平日里，柯莉惩罚够一阵便会收手，可这一回完全不同。她每一刻都比刚才更激动，也更愤怒，最后逼得白牙把尊严全抛到脑后，干脆转身逃过田野，任她在后面穷追不舍。
        - id: ch01-b20
          speaker: scott
          text: “他会学会不碰鸡的。可我得当场捉住他，才能教会他这条规矩。”
        - id: ch01-b21
          speaker: narrator
          text: >-
            两夜以后，主人果真捉了现行，只是场面比他预想的大得多。白牙早已仔细看过鸡场，摸清了鸡群的习惯。等鸡上架睡熟，他爬上新运来的木料，再跳上鸡舍屋顶，翻过屋脊落进围栏。片刻后，他钻进鸡舍，开始了屠杀。
        - id: ch01-b22
          speaker: narrator
          text: >-
            第二天清早，主人来到门廊，看见马夫把五十只白色来航鸡排成一行。他轻轻吹了声口哨，先是惊讶，后来竟有些赞叹。白牙也在旁边，身上看不出半点羞愧，更没有一点内疚。他昂首挺胸，仿佛刚做成一桩值得表扬、值得夸耀的大事，根本不知道自己犯了罪。主人知道，眼前有件很不愉快的事非做不可，嘴唇便紧紧抿了起来。他用充满神一般震怒的声音严厉训斥这个不知罪的犯人，又把白牙的鼻子按向死鸡，结结实实打了他几下。
        - id: ch01-b23
          speaker: narrator
          text: >-
            从此，白牙再也没袭击过鸡舍。他懂了，那违反法则。主人又带他走进鸡场。活生生的食物就在身旁扑腾，甚至从鼻子底下经过，本能立刻催他扑上去。白牙刚顺从冲动，主人的声音便把他喝住。他们在鸡场里足足待了半个小时。捕食的欲望一遍遍涌上来。每次白牙才要照着本能行动，都被同一个声音拦下。离开鸡的领地以前，他已经学懂这条法则，也学会把那些鸡看成根本不存在。
        - id: ch01-b24
          speaker: scott_father
          text: “吃过鸡的狗，永远也改不好。只要养成了习惯，又尝过血味……”
        - id: ch01-b25
          speaker: narrator
          text: 午餐时，老斯科特听完儿子的讲述，伤感地摇了两次头。威登却不赞同。
        - id: ch01-b26
          speaker: scott
          text: “那我们试试看。我把白牙跟鸡关在一起，关一整个下午。”
        - id: ch01-b27
          speaker: scott_father
          text: “可你想想那些鸡啊。”
        - id: ch01-b28
          speaker: scott
          text: “他每杀一只，我就赔你一枚货真价实的一美元金币。”
        - id: ch01-b29
          speaker: beth
          text: “那爸爸也得受点罚，这才公平。”
        - id: ch01-b30
          speaker: mary
          text: “贝丝说得对。”
        - id: ch01-b31
          speaker: narrator
          text: 桌边众人都赞成，斯科特法官只好点头。
        - id: ch01-b32
          speaker: scott
          text: “好。要是一下午过去，白牙没伤害一只鸡，那他每在鸡场里待十分钟，你就得对他说一遍：‘白牙，你比我想的还聪明。’要慢慢说，郑重地说，就像你坐在法官席上，正在庄严宣判。”
        - id: ch01-b33
          speaker: narrator
          text: >-
            全家人各自找了隐蔽的位置，躲在那里偷看，结果这场表演平淡得叫人失望。主人把白牙锁进鸡场，独自离开，他就在地上躺下睡觉。中途只起来一回，走到水槽边喝了些水。那些鸡，他始终平静地不理不睬。在他眼里，它们根本不存在。到了四点，白牙助跑起跳，先跃上鸡舍屋顶，再从那里跳到围栏外面，随后端庄从容地踱回屋去。他确实学会了法则。于是在门廊上，面对满心欢喜的一家人，斯科特法官站到白牙面前，缓慢又庄严地说了十六遍同一句话。
        - id: ch01-b34
          speaker: scott_father
          text: “白牙，你比我想的还聪明。”
        - id: ch01-b35
          speaker: narrator
          text: >-
            可法则实在太多，白牙常被弄糊涂，也常因此丢脸。别的神养的鸡不能碰，猫、家兔和火鸡也得放过。起初，他还以为所有活物都不能伤害。在庄园后面的牧场上，一只鹌鹑从鼻子底下飞起，他浑身绷紧，急得微微发抖，却硬是站着没动。他在服从神的意志。
        - id: ch01-b36
          speaker: narrator
          text: >-
            后来有一天，也是在那片牧场，迪克惊起一只长耳大野兔，追了上去。主人就在旁边看着，不但没阻止，还鼓励白牙加入追赶。白牙这才明白，捕杀长耳大野兔并不受禁。最终，完整的法则在他心里成了形。家养动物不得彼此为敌，不能友好相处，也至少要保持中立。松鼠、鹌鹑和棉尾兔却属于荒野，它们从没向人臣服，任何狗都可以正当地捕杀。神只保护驯养的动物，不准它们彼此进行生死争斗。神只许自己掌握臣民的生死，不容其他生灵夺走这份权力。
        - id: ch01-b37
          speaker: narrator
          text: >-
            跟北方的单纯日子比起来，圣克拉拉谷的生活复杂极了。文明这些繁密的规矩，首先要求白牙学会控制和克制。他得把自己稳稳约束住，这份自制既要像薄纱翅翼的颤动一样精细，又要像钢铁一样坚硬。生活有一千副面孔，他得一一应付。进圣何塞时，他或是跟在马车后奔跑，或是等车停下，独自在街上闲逛。深沉、广阔又多变的生活不停从身边流过，不停碰触他的每一种感觉，逼他立刻调整自己，长久适应变化，也逼他几乎每一次都压下本能。
        - id: ch01-b38
          speaker: narrator
          text: >-
            肉铺里的肉挂在伸嘴就够得到的地方，他不能碰。主人拜访的人家养着猫，他得放过。到处都有狗冲他咆哮，他也不准还击。拥挤的人行道上，数不清的人会因为他停下脚步。他们指给彼此看，围着他端详，谈论他。最糟的是，还要伸手来摸。那些陌生的手每一次靠近，都像一次危险的接触，白牙却只好忍耐。后来，他不但习惯了，也不再局促。他带着高高在上的气派，接受众多陌生神屈尊来摸他的头。可他身上自有一种威势，叫人不敢过分亲近。那些人摸完便走，对自己的胆量又满意又得意。
        - id: ch01-b39
          speaker: narrator
          text: >-
            并非所有事情都这样容易。白牙跟车跑过圣何塞郊外时，总有几个男孩朝他扔石头。他明明有力量追上去，把他们扑倒撕碎，却知道法则不准这样做。他只得违背保护自己的本能，因为他正在被驯服，正在取得进入文明世界的资格。
        - id: ch01-b40
          speaker: narrator
          text: >-
            白牙并不满意。他不懂什么叫正义和公平，生命里却自有一种朴素的公平感，叫他无法忍受这种不准自卫的安排。他忘了，自己同神订下的盟约里，也有神照料和保护他的承诺。终于有一天，主人拿着马鞭跳下车，把扔石头的男孩狠狠教训了一顿。以后再没人朝白牙扔石头，他也明白了，满意了。
        - id: ch01-b41
          speaker: narrator
          text: >-
            还有一件事与此相似。进城路上的十字路口有一家酒馆，三条狗常在外面游荡。白牙每次经过，它们都要冲来袭击。主人知道白牙搏杀的手段有多么致命，所以从没停止教他一条法则，那就是不准打斗。白牙把规矩记得太牢，每回路过这里反而十分难熬。三条狗第一次冲来时，他一声低吼便能让它们不敢靠近，可它们还是跟在后面，一路叫嚷、争吵，不停挑衅辱骂。这种日子持续了很久。酒馆里的男人甚至怂恿它们进攻。一天，他们干脆明着放狗来咬，主人停住了马车。
        - id: ch01-b42
          speaker: scott
          text: “去吧。”
        - id: ch01-b43
          speaker: narrator
          text: 白牙不敢相信。他看看主人，又看看那三条狗，再急切而疑惑地望回主人。
        - id: ch01-b44
          speaker: scott
          text: “去吧，老伙计。把它们全收拾了。”
        - id: ch01-b45
          speaker: narrator
          text: >-
            主人点了头，白牙再不迟疑。他转身无声地跃进敌群，三条狗一齐迎战。咆哮与怒吼混在一起，牙齿不断撞击，翻滚的身体搅成一团。路上的尘土腾起一片云雾，把整场厮杀遮住。几分钟过去，两条狗倒在尘土里挣扎，第三条已经没命地逃跑。它一跃跨过路沟，又穿过一道木栅栏，冲进开阔的田野。白牙立刻追上去，以狼的姿态、狼的速度贴着地面滑过，迅疾得惊人，却没有发出一点声音。他一路追到田野中央，终于赶上那条逃跑的狗，将它扑倒咬死。
        - id: ch01-b46
          speaker: narrator
          text: >-
            白牙一举杀死这三条狗以后，他跟狗群之间最大的麻烦也结束了。这场搏杀的消息沿着山谷传开，又传了回来，住在各处的人全都听说了它。从此，人们都留了心，会把自己的狗好好管住，不准它们再去骚扰白牙，也不再让它们招惹那头“战狼”。
