  chapters:
    - id: ch01
      title: THE GOD'S DOMAIN
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            White Fang had a gift for changing with his surroundings. He had also traveled far enough to understand why change was sometimes necessary. At Sierra Vista, Judge Scott's estate, he soon began to feel at home. His serious trouble with the other dogs was over. They understood the laws of the Southland gods better than he did, and by their standards he had earned a place among them. They had seen him enter the house beside the gods themselves. No wolf had been granted such a privilege before. That made his standing clear to every dog on the estate. Strange as it was, their masters had approved his presence. The dogs who belonged to those masters could only accept their decision.
        - id: ch01-b02
          speaker: narrator
          text: >-
            Dick first had to go through a few stiff ceremonies with White Fang. Once those were over, he quietly accepted the newcomer as another dog on the estate. Dick would gladly have become his friend, but White Fang wanted no friendship. He asked only to be left alone. He had spent his whole life apart from other dogs, and he still preferred it that way. When Dick tried to be friendly, White Fang drove him off with a snarl. He remembered the northern law that told him not to harm his master's dogs, but he guarded his solitude just as firmly. He ignored Dick so completely that the good-natured dog finally gave up. Before long, Dick paid him scarcely more attention than he paid the hitching post by the stable.
        - id: ch01-b03
          speaker: narrator
          text: >-
            Collie was different. She obeyed the gods and accepted White Fang's presence, but she saw no reason to give him peace. Deep in her nature lived the memory of wolves raiding the sheepfolds of her ancestors. To her, White Fang carried the guilt of his whole kind. Those old crimes could not be forgotten in a day, or even in a generation. They drove her to strike back. She could not disobey the gods who allowed him there, so she found smaller ways to make his life miserable. An ancient feud stood between them, and Collie meant to remind him of it.
        - id: ch01-b04
          speaker: narrator
          text: >-
            Because she was female, White Fang's instinct would not let him attack her. Because she was Collie, she would not let him ignore her. When she charged, he turned his thickly furred shoulder toward her teeth and walked away on stiff legs, trying to look grand. If she pressed him hard, he had to circle with that shoulder still facing her and his head turned aside. His eyes wore a patient, bored look. A nip on the hindquarters sometimes sent him off with far less dignity. Usually, though, he kept an almost solemn pride. He avoided her when he could. The moment he saw or heard her coming, he rose and walked away.
        - id: ch01-b05
          speaker: narrator
          text: >-
            Dogs were only the beginning. Life in the Northland had been simple beside life at Sierra Vista. First White Fang had to learn who belonged to his master. He already understood the basic idea. Mit-sah and Kloo-kooch had belonged to Grey Beaver because they shared his food, his fire, and his blankets. In the same way, everyone in this great house belonged to the love-master.
        - id: ch01-b06
          speaker: narrator
          text: >-
            But Sierra Vista held many more people than Grey Beaver's tepee. There were Judge Scott and his wife, the master's sisters Beth and Mary, his wife Alice, and his two young children, Weedon and Maud. One child was four and the other six. No one could explain family ties to White Fang, and he could never have understood them. Still, he quickly saw that every one of these people belonged to his master.
        - id: ch01-b07
          speaker: narrator
          text: >-
            He watched whenever he had the chance. He studied what people did, how they spoke, and even the smallest changes in their voices. Little by little, he learned how close each person was to the master and how much favor each one enjoyed. That became White Fang's measure for deciding how to treat them. If someone mattered to his master, that person mattered to him. Anyone his master held dear must be cherished and carefully guarded.
        - id: ch01-b08
          speaker: narrator
          text: >-
            The two children tested this new rule. White Fang had always hated and feared children's hands. In the Indian villages, children had taught him cruel lessons. When Weedon and Maud first came near, he warned them with a growl and a threatening look. A cuff and a sharp word from the master made him endure their small hands, though his growl held none of the soft crooning he gave his master. Later he saw how precious the boy and girl were to the love-master. After that, they could pet him without any cuff or command.
        - id: ch01-b09
          speaker: narrator
          text: >-
            White Fang did not suddenly become affectionate. He submitted to the children's games with a sour but honest patience, as if he were enduring a painful operation. When he could bear no more, he stood up and marched away. In time, though, he actually began to like them. He never showed it openly and never went to seek them out. But instead of walking away at the sight of them, he waited for them to come to him. Later, people noticed the pleased light in his eyes as they approached. When they left him for some other game, he watched them go with a strange, regretful look.
        - id: ch01-b10
          speaker: narrator
          text: >-
            All of that took time. After the children, Judge Scott came next in White Fang's regard. The judge clearly mattered to the master, and he was also a quiet man. When the master was away, White Fang liked to lie at the judge's feet on the broad porch while the old man read his newspaper. Now and then the judge gave him a look or a word. That was enough to show he knew White Fang was there, and it asked nothing in return. But when the master appeared, every other person vanished from White Fang's thoughts.
        - id: ch01-b11
          speaker: narrator
          text: >-
            White Fang let the whole family pet him and make much of him, but what he gave the master belonged to the master alone. No one else's caress could draw the love-croon from his throat, no matter how hard they tried. No one else could coax him close enough to lean against them. That complete surrender and absolute trust were reserved for the love-master. White Fang cared for the others, but he never saw them as anything more than the master's treasured possessions.
        - id: ch01-b12
          speaker: narrator
          text: >-
            He also learned to tell the family from the household servants. The servants feared him, and he simply chose not to attack them. They too belonged to the master, but there was only a truce between them and White Fang. They cooked, washed dishes, and did the other work Matt had once done in the Klondike. They were part of the household, and that was all.
        - id: ch01-b13
          speaker: narrator
          text: >-
            Beyond the house, the lesson grew harder. His master's land was large and complicated, but even that domain had boundaries. It ended at the county road. The roads and streets beyond were common ground shared by all gods. Behind other fences lay the private lands of other gods. Countless laws ruled these places and decided how he must behave. White Fang could not understand human speech, and no one could explain the rules to him. Experience was his only teacher. He followed his instincts until they brought him against a law. After that happened a few times, he learned the law and obeyed it.
        - id: ch01-b14
          speaker: narrator
          text: >-
            The master's hand and voice taught him most powerfully. Because White Fang loved him so deeply, one light cuff hurt more than all the beatings Grey Beaver or Beauty Smith had ever given him. Those men had hurt his flesh, but beneath the pain his spirit had stayed fierce and unconquered. The love-master's cuff was too gentle to hurt his body. It went much deeper because it carried the master's disapproval, and that made White Fang's spirit shrink.
        - id: ch01-b15
          speaker: narrator
          text: >-
            In truth, the master rarely struck him. His voice was usually enough. From its sound, White Fang knew whether he had done right or wrong. He used that voice to correct his behavior and shape every action. It became the compass that guided him through the customs of his new land and his new life.
        - id: ch01-b16
          speaker: narrator
          text: >-
            In the Northland, dogs were the only tame animals. Everything else lived wild, and any creature that was not too dangerous could become a dog's rightful meal. White Fang had spent his whole life hunting living things for food. It never entered his mind that the Southland followed another rule. Early one morning, he came around the corner of the house and found a chicken that had escaped its yard. Instinct took over. Two quick leaps, a flash of teeth, and one frightened squawk ended the bird's adventure. The farm-raised chicken was fat and tender. White Fang licked his lips and decided this new kind of food was very good indeed.
        - id: ch01-b17
          speaker: narrator
          text: >-
            Later that day, he found another stray chicken near the stables. A groom rushed over to save it. The man knew nothing about White Fang's kind, so he came armed with a light buggy whip. At the first stroke, White Fang forgot the chicken and turned on the man. A club might have stopped him, but a whip could not. He took another cut without a sound and sprang for the groom's throat.
        - id: ch01-b18
          speaker: groom
          text: >-
            My God!
          emotion: fearful
        - id: ch01-b19
          speaker: narrator
          text: >-
            The groom stumbled backward, dropped the whip, and threw his arms across his throat. White Fang's teeth tore his forearm open to the bone. What terrified the man most was not the attack itself, but White Fang's terrible silence. Holding his bleeding arm over his face and throat, the groom tried to retreat into the barn.
        - id: ch01-b20
          speaker: narrator
          text: >-
            Collie saved him. Just as she had once saved Dick, she now came at White Fang in a frenzy. In her mind, she had been right all along, while the blundering gods had been wrong. This attack proved every suspicion she had ever held. The ancient robber was doing exactly what wolves had always done. While the groom escaped into the stable, White Fang backed away from her snapping teeth. He turned his protected shoulder and circled, but this time Collie did not stop after the usual punishment. She grew more excited and angry by the moment. At last White Fang threw dignity aside and openly fled from her across the fields.
        - id: ch01-b21
          speaker: weedon_scott
          text: >-
            He'll learn to stay away from the chickens. But I have to catch him doing it before I can teach him.
        - id: ch01-b22
          speaker: narrator
          text: >-
            Two nights later, White Fang gave his master a much greater chance than anyone expected. He had studied the chicken yards and the birds' habits. After they went to roost, he climbed a stack of newly delivered lumber, reached the roof of a chicken house, crossed its ridge, and dropped inside the yard. A moment later he entered the house, and the slaughter began.
        - id: ch01-b23
          speaker: narrator
          text: >-
            The next morning, the master stepped onto the porch and found fifty white Leghorn hens laid in a row by the groom. He gave a low whistle to himself, first in surprise and then in admiration at the size of the deed. White Fang stood nearby without a trace of guilt or shame. He held himself proudly, as though he had accomplished something worthy of praise. There was no sense of sin in him at all.
        - id: ch01-b24
          speaker: narrator
          text: >-
            The master's mouth tightened as he faced an unpleasant duty. He spoke harshly to White Fang, and his voice held nothing but a god's anger. He pushed the wolf-dog's nose down toward the dead hens and cuffed him soundly. White Fang never raided a chicken house again. The act was against the law, and now he knew it.
        - id: ch01-b25
          speaker: narrator
          text: >-
            Next, the master took him inside the chicken yards. Live food fluttered all around him and passed almost beneath his nose. His natural impulse told him to spring. He obeyed it, but the master's voice stopped him. For half an hour they stayed among the birds. Again and again the desire surged through White Fang. Again and again he started to give in, and each time the voice checked him. Before he left the chickens' domain, he had learned its law. He could stand among them and behave as though they did not exist.
        - id: ch01-b26
          speaker: judge_scott
          text: >-
            You can never cure a dog that kills chickens. Once he has the habit and knows the taste of blood...
        - id: ch01-b27
          speaker: narrator
          text: >-
            Judge Scott shook his head sadly over lunch as his son described the lesson. Weedon did not agree.
        - id: ch01-b28
          speaker: weedon_scott
          text: >-
            Then here's what I'll do. I'll shut White Fang in the chicken yard for the whole afternoon.
        - id: ch01-b29
          speaker: judge_scott
          text: >-
            But what about the chickens?
        - id: ch01-b30
          speaker: weedon_scott
          text: >-
            And I'll pay you one gold dollar for every chicken he kills.
        - id: ch01-b31
          speaker: beth
          text: >-
            There ought to be a penalty for Father too.
        - id: ch01-b32
          speaker: narrator
          text: >-
            Mary agreed with her sister, and approving voices rose all around the table. Judge Scott nodded and accepted the condition.
        - id: ch01-b33
          speaker: weedon_scott
          text: >-
            All right. If White Fang reaches the end of the afternoon without hurting a chicken, then for every ten minutes he spent in that yard, you must tell him, slowly and solemnly, as if you were passing judgment from the bench, "White Fang, you are smarter than I thought."
        - id: ch01-b34
          speaker: narrator
          text: >-
            The family hid where they could watch the test. Nothing happened. Left alone in the yard, White Fang lay down and went to sleep. Once he rose, walked to the trough, and drank some water. He calmly ignored the chickens. To him, they did not exist.
        - id: ch01-b35
          speaker: narrator
          text: >-
            At four o'clock, White Fang took a running leap onto the chicken-house roof. He jumped down outside the yard and strolled gravely back to the house. He had learned the law. On the porch, with the delighted family watching, Judge Scott stood face-to-face with him and delivered the promised sentence sixteen times.
        - id: ch01-b36
          speaker: judge_scott
          text: >-
            White Fang, you are smarter than I thought.
        - id: ch01-b37
          speaker: narrator
          text: >-
            The hardest part for White Fang was the sheer number of laws. They confused him, and his mistakes often brought him into disgrace. He had to discover that the chickens of other gods were protected too. Then there were cats, rabbits, and turkeys, and he had to leave all of them alone. While he was still learning, he reached the mistaken belief that every living creature was forbidden. In the back pasture, a quail once burst into flight beneath his nose, and he let it go unharmed. His whole body tightened and trembled with eagerness and desire, but he mastered his instinct and held still. He believed he was obeying the will of the gods.
        - id: ch01-b38
          speaker: narrator
          text: >-
            Then, in that same pasture, he watched Dick flush a jackrabbit and chase it. The master saw the chase and did not stop it. He even urged White Fang to join. That was how White Fang discovered that jackrabbits were not forbidden.
        - id: ch01-b39
          speaker: narrator
          text: >-
            At last he worked out the complete law. There could be no hostility between him and any animal that belonged to humans. Friendship was not required, but there had to be peace. Squirrels, quail, cottontails, and the other wild creatures had never accepted human rule. They were still lawful prey for any dog. The gods protected only the tame animals, and no deadly fighting was allowed among those animals. Human beings claimed the power of life and death over every creature that served them, and they jealously guarded that power for themselves.
        - id: ch01-b40
          speaker: narrator
          text: >-
            After the simple Northland, life in Santa Clara Valley was a complicated business. Above all, civilization demanded control and restraint. White Fang needed a balance as delicate as the flutter of gossamer wings and at the same time as rigid as steel. Life showed him a thousand different faces, and he had to meet every one. When he went into San Jose, he ran behind the carriage and wandered around the streets whenever it stopped. The world flowed past him, deep and wide and always changing. It pressed continually on his senses. Every moment asked for a new response, and nearly every moment required him to suppress his natural impulses.
        - id: ch01-b41
          speaker: narrator
          text: >-
            Meat hung within reach at the butcher shops, but he could not touch it. Cats lived at the houses his master visited, but he had to leave them alone. Dogs snarled at him everywhere, but he was forbidden to attack. Worst of all were the crowds on the sidewalks. People stopped to stare. They pointed him out, studied him, and talked about him. Then they reached down and patted him.
        - id: ch01-b42
          speaker: narrator
          text: >-
            White Fang learned to endure those dangerous touches from strange hands. With practice, he lost his awkwardness and stopped feeling self-conscious. He received the attention of all those unfamiliar gods with a lofty air. They treated him as though they were granting him a favor, and he accepted their favor as though he were granting one in return. Still, something about him warned them against becoming too familiar. They patted his head and moved on, contented and pleased with their own daring.
        - id: ch01-b43
          speaker: narrator
          text: >-
            Still, life was not easy. On the outskirts of San Jose, certain small boys made a habit of throwing stones at him whenever he ran behind the carriage. White Fang knew the law would not allow him to pursue them, pull them down, and destroy them. To obey, he had to turn against the instinct that told him to preserve and defend himself. He forced himself to do exactly that. Each time, he endured the stones because he was becoming tame and earning his place within civilization.
        - id: ch01-b44
          speaker: narrator
          text: >-
            Yet the arrangement did not satisfy him. He had no human ideas about justice, but something within him knew the situation was unfair. The boys could hurt him, while the law denied him any defense. He had forgotten one part of his agreement with the gods. In return for his obedience, they had promised to protect him.
        - id: ch01-b45
          speaker: narrator
          text: >-
            One day the master jumped from the carriage with a whip and thrashed the boys who had been throwing stones. They never threw another stone at White Fang. Now he understood the agreement, and he was satisfied.
        - id: ch01-b46
          speaker: narrator
          text: >-
            Another trial waited at a crossroads on the way to town. Three dogs hung around the saloon there, and they made a practice of rushing out whenever White Fang passed. The master knew White Fang's deadly way of fighting, so he never stopped teaching him that he must not fight. White Fang learned that lesson thoroughly. Because he obeyed it, every trip past the crossroads saloon put him in a painful position.
        - id: ch01-b47
          speaker: narrator
          text: >-
            After their first rush, White Fang's snarl kept the three dogs from coming too close. But they always followed behind him, yelping, bickering, and insulting him while he endured them. The men outside the saloon enjoyed the scene and urged their dogs to attack. This treatment went on for some time, with White Fang refusing every challenge because the master had forbidden him to fight. Then one day the men openly set all three dogs on him. The master stopped the carriage.
        - id: ch01-b48
          speaker: weedon_scott
          text: >-
            Go on. Fight them.
        - id: ch01-b49
          speaker: narrator
          text: >-
            White Fang could not believe what he had heard. He looked at his master, then at the dogs. Eagerly, questioningly, he turned back to his master.
        - id: ch01-b50
          speaker: narrator
          text: >-
            The master nodded.
        - id: ch01-b51
          speaker: weedon_scott
          text: >-
            Go get them, old fellow. Finish them.
        - id: ch01-b52
          speaker: narrator
          text: >-
            White Fang did not hesitate again. He turned and sprang silently among his enemies. All three met him. Snarls and growls filled the road. Teeth struck teeth, bodies twisted together, and dust rose in a cloud that hid the fight.
        - id: ch01-b53
          speaker: narrator
          text: >-
            The fight raged behind that curtain of dust for several minutes. When it cleared enough to see, two dogs lay struggling in the dirt and the third was running for its life. It leaped a ditch, slipped through a rail fence, and raced across a field. White Fang followed with the low, smooth movement of a wolf and all the speed of a wolf. He made no sound as he closed the distance. In the middle of the field, he pulled the fleeing dog down and killed it.
        - id: ch01-b54
          speaker: narrator
          text: >-
            After those three deaths, White Fang's worst troubles with dogs came to an end. Word traveled all through the valley. From then on, men made sure their dogs left the Fighting Wolf alone.
