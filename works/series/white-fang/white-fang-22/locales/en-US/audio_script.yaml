  chapters:
    - id: ch01
      title: THE SOUTHLAND
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            White Fang stepped off the steamer in San Francisco, and the city appalled him. Somewhere deep inside, beyond thought or understanding, he had always joined power with godhead. Now the white men seemed more like marvelous gods than ever. He stood on the city's slimy pavement, surrounded by sights beyond anything he had known. Log cabins had given way to buildings that towered above him. The streets swarmed with dangers. Wagons, carts, and automobiles crowded past. Great horses strained against enormous trucks. Cable cars and electric cars pushed through the middle, hooting and clanging. Their shrill warnings reminded him of lynxes crying out in the northern woods.
        - id: ch01-b02
          speaker: narrator
          text: >-
            Everywhere he looked, he saw power. Behind all of it stood man, ruling and controlling, showing once again his mastery over the things of the world. It was vast. It stunned him and filled him with awe. Fear settled over White Fang. When he was a cub, his first entrance into Grey Beaver's village had taught him how small and weak he was. Now he was grown and proud of his strength, but San Francisco made him feel small and weak all over again.
        - id: ch01-b03
          speaker: narrator
          text: >-
            And there were gods everywhere. Their endless swarm made him dizzy. The streets thundered in his ears. The great rush of movement never stopped, and he could make no sense of it. More than ever, he knew how much he depended on the love-master. He stayed close behind Scott's heels. Whatever happened, he never let the man out of his sight.
        - id: ch01-b04
          speaker: narrator
          text: >-
            White Fang saw the city only for a short while, like a terrible and unreal glimpse from a nightmare. Yet that glimpse returned to trouble his dreams for a long time. Scott put him in a baggage car and chained him in one corner among piles of trunks and suitcases. A short, powerful god ruled that place with a great deal of noise. He dragged trunks through the door and hurled them onto the heaps. Then he flung other boxes out with crashes and bangs to the gods waiting outside.
        - id: ch01-b05
          speaker: narrator
          text: >-
            In that inferno of luggage, the master left White Fang behind. At least, White Fang believed he had been deserted. Then he caught the scent of Scott's canvas clothes bags beside him. He settled down to guard them.
        - id: ch01-b06
          speaker: baggage_man
          text: >-
            “About time you got here. That dog of yours won't let me put one finger on your things.”
        - id: ch01-b07
          speaker: narrator
          text: >-
            An hour had passed before Weedon Scott appeared in the doorway. White Fang came out of the car and stopped in astonishment. The nightmare city had vanished. To him, the railway car had been nothing more than a room in a house. The city had surrounded it when he entered, but while he was inside, the whole city had somehow disappeared. Its roar no longer battered his ears. In front of him lay quiet, smiling countryside, warm with sunlight.
        - id: ch01-b08
          speaker: narrator
          text: >-
            He had little time to wonder at the change. Like all the other mysterious works of the gods, he simply accepted it. Such things were their way.
        - id: ch01-b09
          speaker: narrator
          text: >-
            A carriage stood waiting. A man and a woman came toward Scott. Suddenly the woman threw her arms around his neck. To White Fang, it looked like an attack. Scott broke away from the embrace at once and seized White Fang, who had turned into a snarling, raging demon.
        - id: ch01-b10
          speaker: weedon_scott
          text: >-
            “It's all right, Mother. I've got him. He thought you meant to hurt me, and he wasn't going to allow that. It's all right. He'll learn soon enough.”
        - id: ch01-b11
          speaker: narrator
          text: Scott held White Fang tightly and soothed him.
        - id: ch01-b12
          speaker: scotts_mother
          text: >-
            “Until he does, perhaps I can hug my son when his dog isn't there.”
        - id: ch01-b13
          speaker: narrator
          text: >-
            She laughed, but the fright had left her pale and weak. She looked at White Fang. He stared back with a hateful glare, his fur raised and a snarl still on his lips.
        - id: ch01-b14
          speaker: weedon_scott
          text: “He has to learn, and he's going to learn right now.”
        - id: ch01-b15
          speaker: narrator
          text: >-
            Scott spoke gently until White Fang quieted. Then his voice turned firm.
        - id: ch01-b16
          speaker: weedon_scott
          text: “Down, sir! Get down!”
        - id: ch01-b17
          speaker: narrator
          text: >-
            The master had taught him that command. White Fang obeyed, though he lowered himself with sullen reluctance.
        - id: ch01-b18
          speaker: weedon_scott
          text: “Now, Mother.”
        - id: ch01-b19
          speaker: narrator
          text: >-
            Scott opened his arms to her without taking his eyes off White Fang.
        - id: ch01-b20
          speaker: weedon_scott
          text: “Down! Stay down!”
        - id: ch01-b21
          speaker: narrator
          text: >-
            White Fang rose halfway, crouching and bristling without a sound. At the warning, he sank back and watched the hostile act happen again. No harm came from it. Nor did any harm come when the strange man-god embraced Scott next.
        - id: ch01-b22
          speaker: narrator
          text: >-
            The clothes bags went into the carriage. The strange gods and the love-master climbed in after them, and White Fang followed on foot. At times he ran watchfully behind. At times he bristled at the horses and warned them that he was there. They might pull his god swiftly over the earth, but White Fang would make sure they did him no harm.
        - id: ch01-b23
          speaker: narrator
          text: >-
            Fifteen minutes later, the carriage passed through a stone gateway. The road ran between two rows of walnut trees whose branches arched and intertwined overhead. Wide lawns opened on both sides, broken here and there by sturdy old oaks. Beyond the fresh green grass lay fields of hay, burned by the sun into tan and gold. Farther off rose tawny hills and high pastures. A house with deep porches and many windows looked down from the first gentle rise above the valley.
        - id: ch01-b24
          speaker: narrator
          text: >-
            White Fang had almost no chance to take it in. The carriage had barely entered the grounds when a sheepdog came at him. She was bright-eyed and sharp-muzzled, and she was furious at the intruder. She cut between White Fang and the master. His fur rose. Without wasting a snarl on her, he rushed forward in deadly silence.
        - id: ch01-b25
          speaker: narrator
          text: >-
            Then he stopped so suddenly that his front legs went stiff against his own speed, and he nearly dropped onto his haunches. He had seen that the dog was female. The law of his kind stood between them. Attacking her would mean breaking one of his deepest instincts.
        - id: ch01-b26
          speaker: narrator
          text: >-
            The sheepdog felt no such restraint. Her own instincts told her to fear the Wild, and above all to fear the wolf. To her, White Fang was the old enemy who had hunted sheep ever since her distant ancestors first guarded their flocks. The instant he pulled back from his attack, she sprang on him. Her teeth sank into his shoulder, and he snarled before he could stop himself. Still, he made no move to hurt her.
        - id: ch01-b27
          speaker: narrator
          text: >-
            He backed away on stiff legs and tried to pass her. He dodged one way, then the other. He curved and turned, but nothing worked. Again and again, she placed herself between White Fang and the path he wanted.
        - id: ch01-b28
          speaker: scotts_father
          text: “Here, Collie!”
        - id: ch01-b29
          speaker: narrator
          text: >-
            The strange man called from the carriage, and Weedon Scott laughed.
        - id: ch01-b30
          speaker: weedon_scott
          text: >-
            “Leave her alone, Father. The discipline will do him good. White Fang has many things to learn, so he might as well begin now. He'll settle in.”
        - id: ch01-b31
          speaker: narrator
          text: >-
            The carriage rolled on, but Collie kept blocking White Fang. He left the drive and raced in a wide circle across the lawn, hoping to pass her. She took the shorter inside curve and met him head-on. He crossed the drive and circled over the other lawn. Once more, she cut him off.
        - id: ch01-b32
          speaker: narrator
          text: >-
            The carriage was carrying his master away. Through the trees, White Fang caught broken glimpses of it disappearing. He had to get past. He tried one more circle, and Collie ran with him. Then, without warning, he wheeled on her and used an old fighting trick. He drove his shoulder squarely into hers.
        - id: ch01-b33
          speaker: narrator
          text: >-
            Collie went down hard. She had been running so fast that she rolled over and over, first on her back and then on her side. Her paws clawed at the gravel as she fought to stop, and she cried out in wounded pride and anger.
        - id: ch01-b34
          speaker: narrator
          text: >-
            White Fang did not wait. The way was open, and that was all he wanted. Collie raced after him, crying out the whole time. Now the chase ran straight ahead, and White Fang could show her what real running was. She threw herself after him in a frantic effort, every leap proclaiming how hard she ran. White Fang made no sound. He slipped smoothly away from her without effort, gliding over the ground like a ghost.
        - id: ch01-b35
          speaker: narrator
          text: >-
            He rounded the house toward the covered carriage entrance and found the carriage waiting there. The master was climbing down. White Fang was still running at full speed when he sensed an attack coming from the side. A deerhound rushed at him.
        - id: ch01-b36
          speaker: narrator
          text: >-
            White Fang tried to turn and meet it, but he was moving too fast and the hound was already too close. The blow caught him in the side. His own speed and the surprise of the strike sent him tumbling across the ground. He twisted out of the tangle with his ears flat and his face drawn back in fury. His teeth snapped together, barely missing the hound's soft throat.
        - id: ch01-b37
          speaker: narrator
          text: >-
            Scott ran toward them, but he was too far away. Collie was the one who saved the hound. White Fang was just beginning the leap that would end the fight when she arrived like a tornado. He had outmaneuvered her, outrun her, and tumbled her in the gravel. Now wounded dignity, righteous anger, and her old hatred of the wolf all drove her forward. She struck White Fang from the side in the middle of his leap. For the second time, he was knocked off his feet and sent rolling.
        - id: ch01-b38
          speaker: narrator
          text: >-
            A moment later, the master reached him and held him with one hand while Scott's father called the other dogs away.
        - id: ch01-b39
          speaker: weedon_scott
          text: >-
            “Well, this is quite a welcome for one poor wolf from the Arctic. He'd only been knocked off his feet once in his whole life. Now it's happened twice in thirty seconds.”
        - id: ch01-b40
          speaker: narrator
          text: >-
            White Fang settled under the touch of Scott's gentle hand. The carriage moved away, and more strange gods came out of the house. Some kept a respectful distance. But two women came forward and committed that same hostile act, wrapping their arms around the master's neck.
        - id: ch01-b41
          speaker: narrator
          text: >-
            This time, White Fang began to tolerate it. The embraces did no harm, and the sounds the gods made held no threat. They tried to approach White Fang too, but he warned them back with a snarl. Scott also told them to stay away. Whenever they came near, White Fang pressed close against his master's legs and felt the reassuring touch of a hand on his head.
        - id: ch01-b42
          speaker: narrator
          text: >-
            At the command, “Dick! Lie down, sir!” the deerhound went up the steps and lay to one side of the porch. He kept growling as he watched the intruder with a dark expression. One of the women held Collie by the neck and stroked her. Collie whined and shifted restlessly. She was troubled and confused. The gods were allowing a wolf to remain among them, and she was certain they had made a terrible mistake.
        - id: ch01-b43
          speaker: narrator
          text: >-
            The gods started up the steps to enter the house, and White Fang stayed close behind his master. Dick growled from the porch. White Fang bristled on the steps and answered with a growl of his own.
        - id: ch01-b44
          speaker: scotts_father
          text: >-
            “Take Collie inside and let those two settle it between themselves. They'll be friends afterward.”
        - id: ch01-b45
          speaker: weedon_scott
          text: >-
            “Then White Fang can prove his friendship by leading the mourners at Dick's funeral.”
        - id: ch01-b46
          speaker: narrator
          text: >-
            Scott laughed. His father looked first at White Fang, then at Dick, and finally back at his son. He could hardly believe what he was hearing.
        - id: ch01-b47
          speaker: scotts_father
          text: “You mean...?”
          emotion: surprised
        - id: ch01-b48
          speaker: narrator
          text: Weedon nodded.
        - id: ch01-b49
          speaker: weedon_scott
          text: >-
            “That's exactly what I mean. Dick would be dead in one minute. Two at the very most.”
        - id: ch01-b50
          speaker: narrator
          text: Scott turned to White Fang.
        - id: ch01-b51
          speaker: weedon_scott
          text: “Come on, you wolf. You're the one who has to go inside.”
        - id: ch01-b52
          speaker: narrator
          text: >-
            White Fang climbed the steps on stiff legs and crossed the porch with his tail held rigidly upright. He watched Dick in case the hound attacked from the side. At the same time, he braced himself for whatever unknown terror might leap at him from within the house.
        - id: ch01-b53
          speaker: narrator
          text: >-
            Nothing frightening sprang out. Once he was inside, he searched the room with care. He looked all around and found no danger. Then he lay at his master's feet with a satisfied grunt. He watched everything that happened, always ready to leap up and fight for his life against the terrors he felt must be hiding beneath the house's trap-like roof.
