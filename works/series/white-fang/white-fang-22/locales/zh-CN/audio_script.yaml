audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 沉着克制，带着北国故事的冷峻张力
        timbre: 温厚清晰，略显低沉
        pace: 舒缓而有变化
        pitch: 中低
    scott:
      display_name: 威登·斯科特
      tts:
        delivery: 正直果断，愤怒时依然清醒
        timbre: 清朗坚实
        pace: 稳健有力
        pitch: 中低
    baggage_man:
      display_name: 行李车管理员
      tts:
        delivery: 粗声粗气，带着劳作后的不耐烦
        timbre: 粗哑厚实
        pace: 稍快
        pitch: 中低
    scott_mother:
      display_name: 斯科特太太
      tts:
        delivery: 慈爱端庄，受惊时仍带温和的幽默
        timbre: 柔和成熟
        pace: 从容
        pitch: 中
    scott_father:
      display_name: 老斯科特
      tts:
        delivery: 稳重随和，偶尔流露长辈式的诙谐
        timbre: 浑厚清楚
        pace: 不疾不徐
        pitch: 低
  chapters:
    - id: ch01
      title: 第二章　南方
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            白牙乘汽船到了旧金山。刚踏上湿滑的路面，他就吓住了。在他心里最深的地方，在理智和意识都碰不到的地方，力量总是属于神的。而眼前的白人，比任何时候都更像神。他熟悉的圆木小屋变成了高耸的大楼。街上到处是危险，有马车、货车和汽车，有使足力气拖着巨大载重车的高头大马，还有庞大的缆车和电车。它们鸣笛，敲铃，从车流中穿过，那不住响起的尖叫，像极了北方森林里山猫的威吓。
        - id: ch01-b02
          speaker: narrator
          text: >-
            这一切都在显露力量。无论表面还是背后，都是人在支配，在驾驭。人征服万物，再借万物显出自己的力量。那力量庞大得叫白牙震惊，也叫恐惧牢牢攫住了他。小时候，他第一次从荒野走进灰海狸的村子，曾觉得自己十分弱小。如今他早已长大，也为一身力量骄傲，却又有了同样的感觉。这里的神实在太多了，成群结队地从他身边涌过。街道的雷鸣震着耳朵，无穷无尽的车马与人潮不停流动，他看得头晕，也不知所措。白牙从没这样依赖过爱的主人。他紧跟在脚后，不管发生什么，都绝不让主人离开视线。
        - id: ch01-b03
          speaker: narrator
          text: >-
            好在这座城市只让白牙看见了噩梦般的一小段。那情景既不真实，又十分可怕，后来很长时间，它还会闯进他的梦里。主人把他送进行李车，拴在堆满皮箱和旅行袋的角落。一个矮壮结实的神管着这里，闹出的声响震天动地。他把箱笼从门外拖进来，甩进行李堆，又把它们轰隆哐啷地抛出门，交给外面等着的其他神。
        - id: ch01-b04
          speaker: narrator
          text: >-
            白牙以为主人把他丢在了这座行李地狱里。直到闻出身边就是主人的帆布衣袋，他才放下心，守在行李旁边。
        - id: ch01-b05
          speaker: baggage_man
          text: “你总算来了。你这条狗守得可真严，我连你的东西碰都碰不得。”
        - id: ch01-b06
          speaker: narrator
          text: >-
            一个小时后，斯科特来到车门前。白牙跟着下了车，立刻愣住了。噩梦般的城市竟然消失了。在他看来，车厢不过是一间屋子。走进去时，城市还围在屋外，如今它却无影无踪。震耳的喧嚣听不见了，面前只有洒满阳光的乡野，安静得近乎慵懒。白牙没有多少时间惊叹。神做的事本来就无法解释，他像接受其他神迹一样接受了这种变化。神向来如此。
        - id: ch01-b07
          speaker: narrator
          text: >-
            一辆马车等在那里，一男一女走向主人。女人突然伸手搂住主人的脖子。白牙认定这是袭击，转眼就成了一头咆哮的恶魔。斯科特赶紧挣脱母亲，死死抱住白牙，低声安抚他。
        - id: ch01-b08
          speaker: scott
          text: “没事，妈妈。他以为你要伤害我，所以才不肯罢休。别怕，他很快会明白的。”
        - id: ch01-b09
          speaker: scott_mother
          text: “那在他明白以前，只好等这条狗不在身边时，我再来疼爱自己的儿子了。”
          emotion: fearful
        - id: ch01-b10
          speaker: narrator
          text: >-
            她虽然笑着，脸色却还苍白，身体也吓得发软。她看向白牙，白牙正竖着毛，龇牙低吼，恶狠狠地瞪着她。
        - id: ch01-b11
          speaker: scott
          text: “他得马上学会，不能再拖。”
        - id: ch01-b12
          speaker: narrator
          text: 斯科特先柔声哄到白牙平静下来，接着把语气一沉。
        - id: ch01-b13
          speaker: scott
          text: “趴下！听话，趴下！”
        - id: ch01-b14
          speaker: narrator
          text: >-
            主人教过这个命令。白牙不情愿地伏下，满肚子怨气。斯科特向母亲张开双臂，眼睛却一直盯着他。
        - id: ch01-b15
          speaker: scott
          text: “来吧，妈妈。白牙，趴着！不许起来！”
        - id: ch01-b16
          speaker: narrator
          text: >-
            白牙悄无声息地竖起毛，才半蹲着起来，又伏了回去。他看着那种敌对行为再次发生，却发现主人没有受伤。后来，陌生的男神也拥抱了主人，同样没带来伤害。帆布衣袋搬上马车以后，陌生的神和爱的主人一起上了车。白牙紧追在后面，时而警觉地奔跑，时而冲飞奔的马匹竖起毛。他要让它们知道，自己一直守在这里，绝不许它们伤害那个被它们拖着飞快掠过大地的神。
        - id: ch01-b17
          speaker: narrator
          text: >-
            十五分钟后，马车穿过一道石门，沿着两排胡桃树前行。树枝在上方交拱，又彼此缠绕。道路两边是宽阔的草坪，几株枝干粗壮的大橡树散落其间。精心照料的草地一片嫩绿，近处晒黄的干草田却泛着黄褐色和金色，再远处则是茶褐色的山丘和高地牧场。草坪尽头，地势从谷底微微隆起，一座门廊幽深、开着许多窗户的房子俯瞰四周。
        - id: ch01-b18
          speaker: narrator
          text: >-
            白牙根本来不及细看。马车刚进庄园，一条眼睛明亮、嘴吻尖细的牧羊犬便怒气冲冲地扑来。她横在白牙与主人之间，彻底截断了路。白牙没有先低吼示警，只竖起浑身的毛，沉默而致命地直扑过去。可眼看就要撞上，他猛地停住，动作显得十分狼狈。两条前腿僵直地撑着，后腿几乎坐到地上，只想避开那条自己正要攻击的狗。原来对方是雌性。同类的天性在他们中间立下禁令。白牙若要攻击她，就非得违背自己的本性不可。
        - id: ch01-b19
          speaker: narrator
          text: >-
            牧羊犬却没有这种顾忌。她天生害怕荒野，尤其怕狼。白牙在她眼中就是一头狼，是从祖先第一次替人聚拢并守护羊群起，便世世代代抢夺羊群的仇敌。白牙收住了冲势，她反而扑上去，一口咬住他的肩膀。白牙本能地低吼，却不肯伤她，只能僵着腿后退，再想办法绕过去。他闪向这边，又转去那边，绕来绕去，可她次次都挡在他想走的路上。
        - id: ch01-b20
          speaker: scott_father
          text: “回来，柯莉！”
        - id: ch01-b21
          speaker: narrator
          text: 斯科特笑了起来。
        - id: ch01-b22
          speaker: scott
          text: “别管她，爸爸。正好让她给白牙立立规矩。他有许多事要学，现在开始也好。他会慢慢适应的。”
        - id: ch01-b23
          speaker: narrator
          text: >-
            马车接着往前走，柯莉仍不让路。白牙绕出车道，从草坪外圈追赶，她却占着更短的内圈，总能抢先亮出两排闪光的牙齿，迎面挡住他。白牙只好折回去，穿过车道，换到另一边的草坪，她还是截在前头。主人正被马车带走，只能从树木之间偶尔看见，而且越来越远。情势变得万分危急。白牙又试着绕了一圈，柯莉依旧飞快地紧追不舍。
        - id: ch01-b24
          speaker: narrator
          text: >-
            白牙突然回身，使出从前打斗的老办法。他肩膀一撞，把柯莉结结实实掀翻。她跑得太快，倒下以后一路翻滚，一会儿仰面，一会儿侧身，四只爪子拼命抓着碎石。那尖叫声里，全是自尊受伤后的愤怒。
        - id: ch01-b25
          speaker: narrator
          text: >-
            路一让开，白牙拔腿便跑。他要的本来就只是追上主人。柯莉尖叫着赶在后面，一刻也没有停。眼下比的是直线奔跑，白牙足以教教她该怎么跑。她近乎发狂，使尽全力，每跳一步都要闹出很大的动静，仿佛在向四周宣扬自己有多么卖力。可她远不是白牙的对手。白牙无声地向前滑去，看不出花了一点力气，像一道贴着地面掠过的幽灵。
        - id: ch01-b26
          speaker: narrator
          text: >-
            白牙绕过房子，在门廊车道前追上了马车。车已经停住，主人正往下走。可白牙还在全速飞奔，忽然察觉侧面有东西袭来。一条猎鹿犬冲过来，重重撞在他身上。白牙想转身迎击，但他跑得太快，对方也已经逼得太近。向前的冲势，加上这场猝不及防的撞击，让他顿时摔倒，整整滚了一圈。他一挣起来，已是一副凶神恶煞的样子。耳朵贴到脑后，嘴唇抽动，鼻子皱紧，两排牙咔嚓合拢。尖牙擦着猎鹿犬柔软的喉咙掠过，只差一点就咬中了。
        - id: ch01-b27
          speaker: narrator
          text: >-
            主人正在赶来，可距离还远。真正救下猎鹿犬的是柯莉。白牙正要扑过去咬出致命的一口，就在身体腾起的那一刻，她像旋风一样赶到了。她刚刚被白牙用计甩开，跑又跑不过，还被毫不客气地掀进碎石里。受伤的尊严、理直气壮的怒火，还有对荒野劫掠者的本能仇恨，全跟着她一起撞上白牙。她从侧面拦腰撞中腾空的白牙，他又一次失去立足之处，翻滚着倒在地上。
        - id: ch01-b28
          speaker: narrator
          text: >-
            下一刻，斯科特到了。他一手按住白牙，父亲则喝退两条狗。白牙在主人的抚摸下慢慢安静。
        - id: ch01-b29
          speaker: scott
          text: “这欢迎可真够热烈，专门招待一头从北极来的孤单老狼。他这一辈子只被打倒过一回，到了这里，三十秒里竟然连滚两次。”
        - id: ch01-b30
          speaker: narrator
          text: >-
            马车离开后，屋里又出来几个陌生的神。有些恭敬地站在远处，两个女人却也做出白牙眼里的敌对举动，伸手搂住了主人的脖子。白牙开始明白，这种举动并不会伤人，神们发出的声音听起来也没有威胁。有人试着亲近他，他就用低吼把人警告回去，主人也开口阻止他们。每到这时，白牙便紧紧贴住主人的腿，任由主人轻拍他的脑袋，让他安心。
        - id: ch01-b31
          speaker: narrator
          text: >-
            猎鹿犬名叫迪克。听到“迪克，趴下”的命令后，他走上台阶，在门廊一边伏下，仍旧低声吼着，阴沉地监视这个闯入者。一个女神抱住柯莉的脖子，不停抚摸安慰她。柯莉却又困惑又焦急。她呜咽着，烦躁得怎么也安静不下来。在她看来，神们准是弄错了，这头狼绝不该获准留在这里。
        - id: ch01-b32
          speaker: narrator
          text: >-
            众人走上台阶，要进屋了。白牙贴着主人脚后。门廊上的迪克低吼一声，台阶上的白牙立刻竖起毛，也低吼着回敬。
        - id: ch01-b33
          speaker: scott_father
          text: “把柯莉带进去，让他们两个自己打一场。等打完了，没准就成朋友了。”
        - id: ch01-b34
          speaker: scott
          text: “真要这样，白牙只好在迪克的葬礼上当头一个哭丧的，表示他们交情不错。”
        - id: ch01-b35
          speaker: narrator
          text: 老斯科特先看看白牙，再看看迪克，最后难以置信地望向儿子。
        - id: ch01-b36
          speaker: scott_father
          text: “你的意思是……”
          emotion: surprised
        - id: ch01-b37
          speaker: scott
          text: “就是你想的那样。不到一分钟，最多两分钟，你就得把死掉的迪克抬进屋。”
        - id: ch01-b38
          speaker: narrator
          text: 斯科特转过身，招呼白牙。
        - id: ch01-b39
          speaker: scott
          text: “来吧，你这头狼。看来只能让你进屋了。”
        - id: ch01-b40
          speaker: narrator
          text: >-
            白牙四条腿僵硬地走上台阶，穿过门廊，尾巴笔直竖着。他一直盯着迪克，防备对方从侧面袭击，同时也准备迎战屋里随时可能扑来的凶恶未知之物。可什么可怕的东西也没有出现。白牙进屋后，小心地四处巡查，每个地方都看过一遍，什么也没发现。他这才满意地哼了一声，在主人脚边躺下，一面观察周围发生的一切，一面随时准备跳起来，为性命而战。在他看来，这座屋子的屋顶下，一定还藏着某种可怕的东西。
