audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 沉着克制，带着北国故事的冷峻张力
        timbre: 温厚清晰，略显低沉
        pace: 舒缓而有变化
        pitch: 中低
    scott:
      display_name: 威登·斯科特
      tts:
        delivery: 正直果断，愤怒时依然清醒
        timbre: 清朗坚实
        pace: 稳健有力
        pitch: 中低
    matt:
      display_name: 马特
      tts:
        delivery: 老练朴实，说话直接
        timbre: 粗粝温厚
        pace: 从容
        pitch: 低
  chapters:
    - id: ch01
      title: 第六章　爱的主人
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            威登·斯科特一步步走近，白牙立刻竖起全身的毛，龇着牙发出低吼。他绝不会乖乖等着受罚。咬伤斯科特的手已经是二十四小时前的事了。那只手包着绷带，吊在胸前，免得血涌进伤口。白牙从前挨过许多迟来的惩罚，所以认定这一次也不会例外。他竟把牙刺进一位神的肉里，而且是地位更高的白人之神。照他懂得的一切规矩来看，一定有什么可怕的事正在前面等他。

            斯科特却在几英尺外坐下了。白牙不觉得这个姿势能带来危险，因为神惩罚他时总是站着。何况斯科特没带棍子、鞭子或枪，白牙身上也没有铁链和木棍。只要对方一起身，他就能抢先逃到安全的地方。眼下，他只需要等着看。
        - id: ch01-b02
          speaker: narrator
          text: >-
            斯科特静静坐着，没有任何动作。白牙的咆哮渐渐轻了，只剩喉咙深处的低吼，最后连低吼也停了。可斯科特刚一开口，白牙颈后的毛又竖起来，吼声一下冲回喉头。斯科特没有露出敌意，只是平静地说下去。一时间，他说一句，白牙便低吼一声，两种声音竟应着同一个节拍。

            斯科特一直没有停。他说话的方式，是白牙从没听过的。那声音温和，让人安心，里面的暖意碰到了白牙心底某个地方。本能明明竖起尖刺，不住地警告他，他却还是一点点相信了这个神。安全的感觉悄悄钻进心里，而他过去同人相处的每一次经历，都在告诉他不该有这种感觉。
        - id: ch01-b03
          speaker: narrator
          text: >-
            过了许久，斯科特站起来，走进木屋。等他再次出来，白牙提心吊胆地看遍了他全身。他没拿鞭子，也没拿棍子和武器，那只完好的手更没有藏在背后。斯科特又在原来的地方坐下，离白牙仍有几英尺，手里却多了一小块肉。

            白牙竖着耳朵，疑心重重地来回打量。他要同时盯住那块肉和眼前的神，还要防备突袭。全身的肌肉都绷紧了，只要出现一点敌意，他马上就会跃开。
        - id: ch01-b04
          speaker: narrator
          text: >-
            惩罚始终没有来。斯科特只把肉送到白牙鼻子附近，那肉看上去也没有问题。可白牙不信。斯科特把手往前送了几次，想引他来吃，他连碰也不碰。神什么都知道，谁能猜出那块无害的肉后面藏了什么圈套？过去，特别是在那些印第安女人手里，肉后面常常就跟着惩罚，结果从来没有好事。

            最后，斯科特把肉扔到白牙脚边的雪上。白牙低头嗅肉时，眼睛仍死死盯着他。没有事情发生。白牙衔起肉，一口吞下，还是没有事情发生。斯科特又递来一块，他仍不肯从手上接，于是那块肉也被扔了过来。这样重复好几次之后，斯科特终于不肯再扔，只把肉稳稳地留在掌心，伸向白牙。
        - id: ch01-b05
          speaker: narrator
          text: >-
            肉很好，白牙也确实饿了。他极慢地向那只手靠近，每一步都小心得不能再小心。最后，他决定直接去取。白牙的目光没有一刻离开斯科特。他向前伸长脑袋，把耳朵紧贴在脑后，颈毛不由得根根立起，喉间还滚着低沉的警告，仿佛在说，千万别跟我耍花招。

            他吃掉那块肉，什么也没发生。接着一块，再一块，直到所有肉都吃完，惩罚依然不见踪影。
        - id: ch01-b06
          speaker: narrator
          text: >-
            白牙舔了舔嘴，继续等待。斯科特仍在说话，那声音里有白牙从未体验过的善意。它又唤起一种陌生的感受，带给他一丝奇异的满足，好像有个长久的需要终于被安抚，生命里的空处也正在填满。可是旧日经验和本能很快又刺痛了他。神总是狡猾，为了达到目的，什么想不到的手段都使得出来。

            果然，他没有猜错。就在这时，那只会伤害人的手伸了过来，正向他的头顶落下。斯科特仍用温柔的声音说着。逼近的手让白牙害怕，那声音却叫他相信。声音带来安稳，手掌带来怀疑，两股冲动在他身体里狠狠撞在一起，几乎要把他撕开。他从没这样犹疑过，只能拼命克制自己，勉强不让其中一股力量突然占据上风。
        - id: ch01-b07
          speaker: narrator
          text: >-
            白牙最后选择了妥协。他照旧龇牙低吼，毛发耸立，耳朵压平，却没有咬，也没有躲。手掌越来越近，终于碰到了他竖起的毛尖。白牙向下缩，手也跟着落下，贴得更紧。他怕得几乎全身发抖，却还控制着自己。让人手碰到身体，处处违背他的本能，简直像折磨一样。一天时间，根本不可能抹掉人手曾经给他的伤害。可这是神的意志，他努力让自己服从。

            那只手抬起，再落下，开始轻拍他，又抚摸他。动作一次次重复。手一抬，白牙的毛便跟着立起。手一落，他便把耳朵压在脑后，喉咙深处涌出洞穴般的低吼。他不停警告斯科特，告诉对方，只要伤害出现，自己随时都会报复。他不知道神的真正用意会在哪一刻露出来。也许下一刻，温柔的声音就会变成暴怒的咆哮，爱抚他的手也会化作铁钳，把他牢牢抓住，交给随之而来的惩罚。
        - id: ch01-b08
          speaker: narrator
          text: >-
            然而，斯科特始终温和地说着，手掌也始终轻轻起落，没有一丝敌意。白牙体内仍有两种相反的感觉。这样的触碰束缚着他，挡住了他对自由的追求，也违反了他的本能。可身体不但没受伤，反而感到舒服。轻拍慢慢变成小心地揉搓耳根，那份舒服又增加了一些。他依旧害怕，依旧防备着无法预料的灾祸，只能在痛苦和享受之间来回摇摆。
        - id: ch01-b09
          speaker: matt
          text: “嗬，这可真见了鬼！”
          emotion: surprised
        - id: ch01-b10
          speaker: narrator
          text: >-
            马特卷着袖子走出木屋，手里还端着一盆洗碗水。他正要把水泼掉，却看见斯科特在抚摸白牙，顿时僵在原地。他的声音划破寂静，白牙立刻向后一跃，冲着他凶狠地咆哮起来。马特看向雇主，脸上又痛心，又不赞同。
        - id: ch01-b11
          speaker: matt
          text: “斯科特先生，你要是不介意，我可就直说了。把十七种混账傻瓜凑在一块儿，种种都不重样，也还凑不出你这么一个来。”
        - id: ch01-b12
          speaker: narrator
          text: >-
            斯科特带着几分高高在上的神气笑了笑，随后站起身，再次向白牙走去。他柔声安抚了一阵，才慢慢伸出手，放到白牙头上，继续刚才被打断的抚摸。白牙忍受着手掌的触碰，警惕的目光却越过斯科特，盯住门口的马特。
        - id: ch01-b13
          speaker: matt
          text: “你挖矿也许真是一等一的好手，这个我承认。可你小时候居然没离家去投奔马戏团，那才叫错过了这辈子最大的机会。”
        - id: ch01-b14
          speaker: narrator
          text: >-
            白牙听见马特说话，又低吼起来。但这一次，他没有再跳开。头和后颈仍留在斯科特手下，任那只手缓慢而温柔地来回抚摸。

            这便是结束的开端。过去那种被仇恨支配的生活，开始走向终点。一种崭新而美好的生活，也露出了最初的微光。斯科特必须付出许多心思和无尽的耐心，白牙则要经历一场彻底的改变。他得不理会本能和理性的催促，反抗自己的经验，甚至否定生命从前教给他的一切。
        - id: ch01-b15
          speaker: narrator
          text: >-
            白牙从前的生活里，根本没有地方容纳他现在所做的事。他过去总被一股股潮流推着走，如今却任由自己奔向完全相反的方向。把一切都算进去，这次改变比他幼时离开荒野、接受灰海狸做主人还要巨大。那时他只是只幼崽，还没长成固定的模样，很容易被环境的拇指捏出形状。

            现在可不同。环境早已把他塑造得太过彻底，让他成了凶猛无情的战狼，不爱任何人，也从没被谁爱过。想改变，就等于让整个生命调转方向。幼时的柔韧已经消失，他身上的每根纤维都又粗又硬，紧紧打着结。他的性情像钻石一样冷硬，不肯屈服，心灵仿佛由铁铸成。那些本能和信条，也早凝成了不能违背的法则，里面装满警戒、憎恶和欲望。

            可这一次，依旧是环境的拇指在推动他。它一点点揉软硬化的地方，要把他重新塑成更好的模样。而斯科特就是那根拇指。他触到了白牙天性的深处，用善意唤醒那些已经衰弱、几乎死去的东西。其中有一样，就是爱。它将取代喜欢，因为从前白牙面对人类时，心里能有的最好感情，也不过是喜欢。
        - id: ch01-b16
          speaker: narrator
          text: >-
            爱当然不会在一天里降临。它先是喜欢，再从喜欢中慢慢长出来。白牙没有逃走，尽管谁也没拴着他，因为他喜欢这个新的神。这样的日子总比困在美人史密斯的笼子里好。而且，他必须有一个神。服从人类的统治，本来就是他天性里的需要。

            早在他离开荒野，爬到灰海狸脚边，等着挨那顿毒打的时候，依赖人类的印记就已经盖在了他身上。漫长的饥荒过去，灰海狸的村子重新有了鱼，他第二次从荒野回来，那道印记又烙得更深，再也无法抹掉。
        - id: ch01-b17
          speaker: narrator
          text: >-
            白牙需要一个神，又宁愿选斯科特，不愿选美人史密斯，所以他留了下来。为了表明忠诚，他主动守起主人的财物。雪橇犬都睡下以后，他就在木屋周围巡逻。头一个夜里来访的人拿棍子挡住他，直到斯科特出来解围。不过，白牙很快便学会辨认谁是贼，谁是正派的来客，也能从脚步和举止里判断一个人的来意。

            有人脚步响亮，沿直线走向木屋门口，他不会阻拦，只会警觉地看着，直到门打开，主人接纳对方。可要是有人故意放轻脚步，绕来绕去，一边窥探一边遮掩行踪，白牙便会立刻作出裁决。那个人转眼就会狼狈地逃走，什么体面也顾不上了。
        - id: ch01-b18
          speaker: narrator
          text: >-
            斯科特给自己定下一个任务。他要救回白牙，或者说，要替人类赎清对白牙犯下的罪。这不只是原则，也出于他的良心。他认为，人类欠白牙的债，必须由人来偿还。于是，他特意对这头战狼付出更多善意。每天，他都要抚摸白牙，亲近地陪他很久。

            白牙起初满怀怀疑和敌意，后来却逐渐喜欢上了这样的爱抚。不过有个习惯始终改不掉。从抚摸开始，一直到抚摸结束，他总会低吼个不停。只是那声音里，已经多出一种新的音调。
        - id: ch01-b19
          speaker: narrator
          text: >-
            陌生人听不出那点不同。他们只听见原始的野性，神经会随之绷紧，血也会冷下来。白牙幼时第一次在洞穴里发出粗哑细小的怒声，从那以后，他年年都在吐出凶狠的声音，喉咙早就磨得粗硬。他再也没法把声音放柔，去表达心中的温情。

            可斯科特的耳朵足够敏锐，也真正懂得他的心。他能从那片凶猛的声音里，分辨出一缕几乎被淹没的新音调。那是极轻的满足低吟，除了斯科特，没有别人听得见。
        - id: ch01-b20
          speaker: narrator
          text: >-
            日子不断过去，喜欢也更快地长成了爱。白牙已经察觉这种感受，却不知道它叫作爱。对他来说，那更像生命里出现了一个空洞，既饥饿，又疼痛，还装满渴望，总在喊着要被填满。这种痛苦让他坐立不安，只有新的神来到身边，才能让它平息。

            斯科特在的时候，爱就是欢喜，是强烈而尖锐的满足，能让白牙全身颤动。斯科特一旦离开，痛苦和不安便再次回来。那个空洞在身体里张开，挤压着他，饥饿感则没完没了地啃着他。
        - id: ch01-b21
          speaker: narrator
          text: >-
            白牙正在寻找真正的自己。他已经成年，塑造他的模具也被野蛮的生活冻硬了，可他的天性还是开始舒展开来。陌生的感情和从未有过的冲动，在他身体里萌生，旧日的行为准则也随之改变。

            从前，他喜欢舒服，喜欢避开疼痛，一切行动都照着这两点来。现在却不一样。为了新的神，他常常主动选择不适，甚至选择痛苦。清晨，他不再四处寻找食物，也不到避风的地方躺下，宁愿在寒冷空荡的木屋台阶上等几个小时，只求看一眼斯科特的脸。夜里，斯科特回家时，他会离开雪地里温暖的卧处，去迎接那声招呼和友好的弹指。只要能陪着斯科特，接受他的抚摸，或跟他一起进城，白牙连肉也肯放弃，哪怕那是真正的肉。
        - id: ch01-b22
          speaker: narrator
          text: >-
            喜欢终于让位给了爱。爱像一根测深绳，落进白牙体内喜欢从未到过的深处。那深处也给出了回应，升起同样崭新的感情。别人把爱给了他，他也把爱还了回去。

            这才是他真正的神，一个带来爱的神。他温暖，又放射着光。白牙的天性沐浴在那光里，渐渐伸展开来，像花朵迎着阳光开放。
        - id: ch01-b23
          speaker: narrator
          text: >-
            白牙却不懂怎样表达感情。他年纪太大，早已定形，很难学会新的表达方式。他太克制，也太习惯独自站稳。漫长的生活让他变得沉默、疏远又阴郁。他从没吠叫过，如今也学不会在斯科特走近时叫出欢迎。

            他从不挡路，更不会用夸张或愚蠢的举动表示爱意。他不跑去迎接斯科特，只在远处等着。可是，他永远都在等，也永远都在那里。他的爱几乎像一种崇拜，安静得没有声音。他只能用稳定而专注的目光来表达，不停追随着斯科特的每一个动作。有时斯科特望着他，同他说话，他反而会显得笨拙而不自在。那是他的爱拼命寻找出口，身体却不知道该怎样把它放出来。
        - id: ch01-b24
          speaker: narrator
          text: >-
            他还从许多地方调整自己，去适应新的生活。白牙渐渐明白，主人的狗不能伤害。不过，他支配狗群的天性仍然存在。第一件事，就是把那些狗一条条打服，让它们承认自己的地位和领导权。等这件事办完，他和狗群之间便很少再有麻烦。他来去时，狗都会为他让路。只要他表明意志，它们就会服从。

            他也慢慢容忍了马特，因为马特属于主人。斯科特很少亲手喂他，通常都是马特送来食物。可白牙猜得出，那依旧是主人的食物，只不过经过马特的手交给他。
        - id: ch01-b25
          speaker: narrator
          text: >-
            马特曾想给白牙套上挽具，让他和其他狗一起拉雪橇，可他没有成功。直到斯科特亲手套好挽具，命令白牙干活，他才明白过来。既然这是主人的意志，那么马特就可以像使唤其他狗一样使唤他，也可以叫他做事。

            克朗代克的雪橇装着滑板，不像麦肯齐地区那种长长的平底雪橇，驾狗的方法也不同。这里的狗不会扇形排开，而是从前到后一条接一条，用两根挽绳拉车。领头狗是真正的首领，必须最聪明，也必须最强壮。整支狗队都要服从他，也惧怕他。

            白牙很快便占据了那个位置，这件事没有别的可能。他绝不会甘心待在别处。马特吃了不少苦头，添了许多麻烦，才终于明白这一点。白牙自己选中了领头的位置，试过以后，马特用一串狠话表示，他同意白牙的选择。
        - id: ch01-b26
          speaker: narrator
          text: >-
            白天，白牙在雪橇队里工作。到了夜里，他仍守卫着主人的财物。他一刻也不放松，永远警醒，永远忠诚，也因此成了所有狗里最有价值的一条。
        - id: ch01-b27
          speaker: matt
          text: “斯科特先生，我今天非把心里的话倒出来不可。你花那笔钱买下这条狗，实在精明得很。你先一拳打扁美人史密斯的脸，又顺手把他骗了个精光。”
        - id: ch01-b28
          speaker: narrator
          text: 斯科特灰色的眼睛里再次闪起怒火。
        - id: ch01-b29
          speaker: scott
          text: “那个畜生！”
          emotion: angry
        - id: ch01-b30
          speaker: narrator
          text: >-
            暮春时，一场大难突然落到白牙头上。爱的主人毫无预兆地消失了。其实，预兆一直都在，只是白牙不懂，也不知道收拾行李意味着什么。后来他才想起，斯科特离开前曾把东西装进行囊，可当时的他没有起疑。

            那天夜里，白牙一直等着主人回来。到了午夜，寒风逼得他躲到木屋背后。他在那里打盹，却睡得极浅，两只耳朵始终等着那阵熟悉的脚步声。凌晨两点，焦虑又把他赶回冰冷的前门台阶。他蜷着身体伏在那里，继续等候。

            主人始终没有回来。
        - id: ch01-b31
          speaker: narrator
          text: >-
            清晨，门打开，马特走了出来。白牙满怀期待地看着他。可他们没有共同的语言，他没办法问出心里的问题。一天过去，又一天过去，主人还是没有出现。

            白牙一生从没病过，这一次却病倒了，而且病得很重。马特最后只好把他带进木屋。写信给远方的雇主时，马特还特意加上一段，说起白牙的情形。
        - id: ch01-b32
          speaker: narrator
          text: 威登·斯科特远在瑟克尔城，他在信里读到了马特写下的话。
        - id: ch01-b33
          speaker: matt
          text: “那头该死的狼不肯干活，也不肯吃东西，整个没了精神。现在什么狗都敢欺负他。他想知道你去了哪儿，可我又没法告诉他。我看，他也许就要死了。”
          emotion: sad
        - id: ch01-b34
          speaker: narrator
          text: >-
            情形和马特写的一模一样。白牙不再吃东西，也失去了斗志，任由狗队里的每条狗欺负他。他躺在木屋的炉边，对食物没有兴趣，对马特没有兴趣，连生命也不再关心。

            马特可以温声哄他，也可以对他大声咒骂，白牙都没有反应。他最多抬起暗淡的眼睛看一眼，然后又把头放回前爪上，恢复原先一动不动的姿势。
        - id: ch01-b35
          speaker: narrator
          text: >-
            后来的一天夜里，马特独自看书。他一边含糊咕哝，一边无声地动着嘴唇，忽然听见白牙低低呜咽了一声。白牙已经站起来，两只耳朵朝着门口竖起，正全神贯注地听着。片刻后，马特也听到了脚步声。

            门开了，威登·斯科特走进木屋。两个人握过手，斯科特立刻环顾四周。
        - id: ch01-b36
          speaker: scott
          text: “那头狼在哪儿？”
        - id: ch01-b37
          speaker: narrator
          text: >-
            接着，他看见了白牙。白牙仍站在炉边，正是他原来躺卧的地方。他没有像别的狗那样猛扑上去，只是站着，凝望着，等着。
        - id: ch01-b38
          speaker: matt
          text: “我的老天！快看，他居然在摇尾巴！”
          emotion: surprised
        - id: ch01-b39
          speaker: narrator
          text: >-
            斯科特一边叫着白牙，一边大步跨过半间屋子。白牙也向他走去。他没有飞扑，步子却很快，连往日的拘谨都忘了。越靠近主人，他眼里的神情就越奇异。那双眼睛里涌起一种无法说出口的感情，既深又广，最后像光一样照了出来。
        - id: ch01-b40
          speaker: matt
          text: “你走了以后，他一次也没这样看过我！”
          emotion: surprised
        - id: ch01-b41
          speaker: narrator
          text: >-
            斯科特根本没听见。他脚跟落地蹲下，同白牙脸对着脸，一刻不停地抚摸他。他揉揉白牙的耳根，又从脖颈一路长长地摸到肩头，随后用指尖轻敲他的脊背。白牙用低吼回答，而那吼声里的吟唱，比过去任何时候都清楚。

            可事情还没有结束。他心中的喜悦和那股巨大的爱意，一直翻涌着，要冲出来，现在终于找到了新的出口。白牙忽然向前一探，把脑袋硬从斯科特的手臂和身体之间挤进去。他把头藏在里面，只露出两只耳朵。他不再低吼，只是不断往里钻，紧紧偎着主人。
        - id: ch01-b42
          speaker: narrator
          text: 两个男人互相看了一眼。斯科特的双眼闪闪发亮。
        - id: ch01-b43
          speaker: matt
          text: “老天啊！”
          emotion: surprised
        - id: ch01-b44
          speaker: narrator
          text: 过了一会儿，马特才从敬畏中回过神。
        - id: ch01-b45
          speaker: matt
          text: “我早就说了，这头狼骨子里其实是条狗。你现在看见了吧！”
        - id: ch01-b46
          speaker: narrator
          text: >-
            爱的主人回来以后，白牙很快恢复了。他在木屋里又待了两夜和一个白天，然后便走到外面。雪橇犬已经忘记他从前有多威风，只记得他最近病得虚弱。一见他出来，狗群立刻一拥而上。
        - id: ch01-b47
          speaker: matt
          text: “这下可有一场好架看了。上啊，你这头狼！让它们吃点苦头，再狠狠来几下！”
          emotion: happy
        - id: ch01-b48
          speaker: narrator
          text: >-
            白牙根本不需要鼓励。爱的主人已经回来，这就够了。生命重新在他身体里奔流，明亮而不可战胜。他只因为喜悦而战，要用搏斗说出那些声音表达不了的感情。

            这场战斗的结局没有第二种可能。狗队遭到一场耻辱的惨败，四散奔逃。直到天黑以后，那些狗才一条接一条偷偷回来，用温顺和低头表示，它们重新服从白牙。
        - id: ch01-b49
          speaker: narrator
          text: >-
            自从学会偎依，白牙便常常这样做。这是他能够说出的最后一个字，再没有更深一步的表达。过去，他尤其不准别人碰自己的头。头部一被触碰，他就会厌恶。那是身体里的荒野在反抗，也是他对伤害和圈套的恐惧，让他本能地躲开所有接触。脑袋必须保持自由，这是本能给他的命令。

            可面对爱的主人，他会主动偎进怀里，故意把自己放在完全无助的位置。这代表彻底的信任，也是绝对的交托。仿佛他正对主人说，我把自己交给你，随你怎么处置。
        - id: ch01-b50
          speaker: narrator
          text: >-
            主人回来没多久，一天夜里，斯科特和马特临睡前正在玩克里比奇牌。马特沿着记分板挪动小钉，嘴里数着分数。
        - id: ch01-b51
          speaker: matt
          text: “一个十五点是两分，另一个十五点又是两分，再算上一对，总共六分。”
        - id: ch01-b52
          speaker: narrator
          text: >-
            就在这时，屋外突然传来喊声和咆哮声。两人互相看了一眼，同时起身。
        - id: ch01-b53
          speaker: matt
          text: “那头狼逮到人了。”
        - id: ch01-b54
          speaker: narrator
          text: >-
            一声凄厉的惨叫紧接着传来，里面满是痛苦和恐惧，催得他们冲出木屋。
        - id: ch01-b55
          speaker: scott
          text: “把灯拿来！”
        - id: ch01-b56
          speaker: narrator
          text: >-
            斯科特喊着跃出门外，马特提起灯紧跟上去。灯光照见一个男人仰面倒在雪地上，两条手臂交叉挡住脸和喉咙。他必须这样护住自己。白牙已经陷入狂怒，一口口咬向人体最脆弱的地方。

            从肩头到手腕，那男人交叠的双臂上，外套、蓝法兰绒衬衫和贴身内衣的袖子，全都被扯成碎片。他的手臂也被咬得十分可怕，鲜血不断流出来。
        - id: ch01-b57
          speaker: narrator
          text: >-
            两人一眼就看清了这一切。下一刻，斯科特抓住白牙的后颈，把他硬拖开。白牙一边挣扎，一边咆哮，却没有试图咬主人。斯科特厉声喝止，他很快便安静下来。

            马特扶起地上的男人。那人站起来时，放下挡在脸前的手臂，露出美人史密斯那张野兽般的脸。马特像是摸到了烧红的火炭，猛然松开手。美人史密斯在灯下眨着眼，慌张地四处看。他一看见白牙，恐惧立刻爬满了脸。
        - id: ch01-b58
          speaker: narrator
          text: >-
            与此同时，马特注意到雪地里掉着两样东西。他把灯移近，用脚尖指给斯科特看。一件是钢制的狗链，另一件是粗重的棍子。

            斯科特看见以后，只点了点头。没有人说话。马特把手搭在美人史密斯肩上，让他转向右边。什么都不必解释，美人史密斯迈开脚步，离开了那里。
        - id: ch01-b59
          speaker: narrator
          text: 爱的主人一边抚摸白牙，一边对他说话。
        - id: ch01-b60
          speaker: scott
          text: “他想把你偷走，对不对？可你没让他得手。好，好，这回他可彻底算错了，是不是？”
        - id: ch01-b61
          speaker: matt
          text: “他一定觉得，自己刚才撞上了十七个魔鬼。”
        - id: ch01-b62
          speaker: narrator
          text: >-
            白牙仍然很激动。他全身的毛还竖着，喉咙里一声接一声地低吼。慢慢地，那些竖起的毛伏了下去。吼声中的吟唱依然遥远而微弱，却正一点点从喉咙深处升起。
