  chapters:
    - id: ch01
      title: THE LOVE-MASTER
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: >-
            White Fang watched Weedon Scott coming toward him and raised his hackles. He snarled to warn that he would not accept a beating. Only twenty-four hours had passed since he had torn open Scott's hand. Now that hand was bandaged and held up in a sling to stop the bleeding. White Fang knew from the past that men sometimes waited before punishing him, and he was sure such a punishment was about to fall. How could it be otherwise? To his mind, he had committed a sacred crime. He had sunk his teeth into the holy flesh of a god, and this was a white-skinned god who stood above the others. The natural order of life with men told him that something terrible must come next.
        - id: ch01-b02
          speaker: narrator
          text: >-
            Scott sat down several feet away. White Fang could see no danger in that. Men stood on their legs when they handed out punishment. Besides, Scott carried no club, whip, or gun, and his unhurt hand was not hidden behind his back. White Fang was not tied by chain or stick, either. If danger appeared, he could reach safety while the man was still struggling to rise. For the moment, he decided to stay and see what happened.
        - id: ch01-b03
          speaker: narrator
          text: >-
            Scott made no move. White Fang's snarl faded into a growl, then died in his throat. But when Scott began to speak, White Fang's neck hair rose and the growl came back. Still the man sat quietly and kept talking. Soon his gentle voice and White Fang's growl fell into a rhythm together.
        - id: ch01-b04
          speaker: narrator
          text: >-
            Scott went on for what seemed an endless time. No one had ever spoken to White Fang this way. The soft, soothing voice carried a gentleness that found and touched something hidden inside him. Every sharp warning of instinct told him to beware, and all his experience with men argued against trust. Yet in spite of himself, he began to trust this god. He began to feel a safety that everything in his past said could not be real.
        - id: ch01-b05
          speaker: narrator
          text: >-
            After a long while, Scott stood and went into the cabin. White Fang watched fearfully when he came back out. There was still no whip, club, or weapon, and the uninjured hand hid nothing behind his back. Scott sat in the same place, several feet away, and held out a small piece of meat. White Fang pricked his ears and studied the food with suspicion. Somehow he kept the meat and the man in sight at the same time. His body stayed tight, ready to spring away at the first openly hostile move.
        - id: ch01-b06
          speaker: narrator
          text: >-
            The punishment still did not come. Scott only held the meat near White Fang's nose, moving it forward in short, inviting little motions. White Fang would not touch it. The gods were clever and seemed to know everything. Any amount of treachery could be hidden inside that harmless-looking morsel. In White Fang's past, especially with the women of the village, meat from human hands had often been joined with punishment, and the result had been painful.
        - id: ch01-b07
          speaker: narrator
          text: >-
            In the end, Scott tossed the piece onto the snow at White Fang's feet. White Fang sniffed it carefully but never looked down. His eyes stayed fixed on the man. Nothing happened, so he took the meat into his mouth and swallowed it. Still nothing happened. Scott was already offering another piece. Again White Fang refused the hand, and again Scott tossed the meat to him. They repeated this several times. Then Scott changed the game. He refused to throw the next piece and held it steadily before him.
        - id: ch01-b08
          speaker: narrator
          text: >-
            White Fang was hungry, and the meat was good. Bit by bit, with endless caution, he moved closer to the hand. He kept his eyes on Scott as he stretched his head forward. His ears lay flat, and the hair along his neck rose without his willing it. A low growl warned the man that White Fang would not accept a trick. At last he made his choice and took the meat from the hand. Piece after piece, he ate everything Scott held out. Nothing bad happened. The punishment still did not come.
        - id: ch01-b09
          speaker: narrator
          text: >-
            White Fang licked his lips and waited while Scott went on talking. There was kindness in that voice, something he had never known from a man. It stirred feelings he had never experienced, either. A strange satisfaction moved through him, as if some need were finally being answered and an empty place inside him were being filled. Then instinct pricked him again, and his past renewed its warning. The gods were always crafty. Men had hidden ways of reaching their purposes, ways an animal could never guess beforehand.
        - id: ch01-b10
          speaker: narrator
          text: >-
            Ah, there it was at last. Scott's hand reached toward his head, clever and ready to hurt. Yet Scott continued talking in the same gentle tone. The soft voice promised safety while the approaching hand warned of pain. White Fang felt those two messages pulling him in opposite directions. The conflict was so fierce that he seemed ready to fly apart. It took a kind of control he had never needed before simply to hold himself together and remain where he was.
        - id: ch01-b11
          speaker: narrator
          text: >-
            He found a middle path between trust and escape. He snarled, flattened his ears, and bristled, but he did not bite or jump away. The hand came nearer and nearer. At last it touched the tips of his raised hair. White Fang shrank beneath it, almost trembling, but the hand followed him down and pressed more closely against him. The touch itself felt like a torment because every instinct ordered him to avoid it. Human hands had done him too much evil for him to forget in one day. Yet this god willed him to stay, and with all his strength he struggled to obey.
        - id: ch01-b12
          speaker: narrator
          text: >-
            Scott lifted his hand and brought it down again in a gentle, caressing pat. He continued the motion over and over. Each time the hand rose, White Fang's hair rose beneath it. Each time it returned, his ears flattened and a deep growl rolled from the hollow of his chest. He kept up that warning without a break. It told Scott that White Fang stood ready to strike back against any hurt. At any instant, the soothing voice might become a roar of anger, and the gentle hand might close like a vise to hold him helpless for punishment.
        - id: ch01-b13
          speaker: narrator
          text: >-
            But Scott kept speaking softly, and the hand continued its gentle rise and fall. The voice never broke into a roar, and the hand never closed like a trap. The touch offended every instinct that guarded White Fang's freedom, yet it did not cause physical pain. In fact, it felt good. Slowly and carefully, the patting became a rub around the roots of his ears, and the pleasure grew a little stronger. He never stopped expecting some unknown evil. Fear and pleasure took turns ruling him while he suffered and enjoyed the touch at the same time.
        - id: ch01-b14
          speaker: matt
          text: >-
            Well, I'll be gosh-swoggled!
          emotion: surprised
        - id: ch01-b15
          speaker: narrator
          text: >-
            Matt had stepped out of the cabin with his sleeves rolled up and a pan of dirty dishwater in his hands. The sight of Scott petting White Fang stopped him cold. At the sound of his voice, White Fang sprang back and snarled fiercely.
        - id: ch01-b16
          speaker: matt
          text: >-
            If you don't mind me saying so, Mr. Scott, you're seventeen different kinds of fool, and then a few more besides.
        - id: ch01-b17
          speaker: narrator
          text: >-
            Scott smiled as if he knew better. He stood, walked over to White Fang, and spoke soothingly. Then he slowly set his hand on White Fang's head and began petting him again. White Fang endured it, but his suspicious eyes stayed fixed on Matt in the doorway.
        - id: ch01-b18
          speaker: matt
          text: >-
            You may be a first-rate mining expert, all right, but you missed your true calling. You should've run off and joined a circus when you were a boy.
        - id: ch01-b19
          speaker: narrator
          text: >-
            White Fang snarled at Matt's voice. This time, though, he did not pull away from the hand stroking his head and neck.
        - id: ch01-b20
          speaker: narrator
          text: >-
            This was the beginning of the end for White Fang. His old life and its rule of hatred were passing away, and a new, far kinder life was beginning. Weedon Scott would need careful thought and endless patience to bring it about. White Fang would need nothing less than a revolution. He had to turn against every warning of instinct and reason. He had to deny the hard lessons of experience and treat as false the only life he had ever known.
        - id: ch01-b21
          speaker: narrator
          text: >-
            The change was greater than the one he had made when he first left the Wild and accepted Grey Beaver as his master. He had been only a puppy then, with a nature still soft and ready for life to shape. Now it was different. The years had done their work too well. They had formed and hardened him into the Fighting Wolf, fierce and without mercy, unable to love and impossible to love. Youth could no longer make him flexible. The very fibers of him had grown tough and knotted. His spirit had become like iron, and every caution, dislike, and desire had hardened into a fixed rule.
        - id: ch01-b22
          speaker: narrator
          text: >-
            Yet life began shaping him again, pressing and working upon what had grown hard until it slowly softened. This time Weedon Scott was the hand that reached all the way to the roots of White Fang's nature. With kindness, Scott woke powers that had lain unused for years and had almost died. One of those powers was love. It would take the place of liking, which until then had been the warmest feeling White Fang had ever known toward a man.
        - id: ch01-b23
          speaker: narrator
          text: >-
            Love did not appear in a day. It began as liking and grew from there. White Fang was free to leave, but he stayed because he liked his new god. Life with Scott was certainly better than the cage of Beauty Smith, and White Fang felt a deep need to belong to some master. That dependence on man had first been stamped into him when he turned away from the Wild and crawled to Grey Beaver's feet, expecting a beating. It had been stamped into him a second time when he returned from the Wild after the long famine and found fish in Grey Beaver's village once more.
        - id: ch01-b24
          speaker: narrator
          text: >-
            Because he needed a god and preferred Scott to Beauty Smith, White Fang remained. He gave his loyalty by taking responsibility for everything that belonged to his master. While the sled dogs slept, he prowled around the cabin and kept watch. The first night visitor who approached found him ready. The man had to beat him back with a club until Scott came out and rescued him.
        - id: ch01-b25
          speaker: narrator
          text: >-
            White Fang soon learned the difference between honest visitors and thieves. He judged the sound of a step and the way a man carried himself. A man who walked loudly and straight to the cabin door was allowed to pass. White Fang still watched closely until the door opened and his master showed that the visitor was welcome. A man who moved softly, followed a roundabout path, peered about, and tried to hide what he was doing received no such patient judgment. That man left suddenly, in a great hurry, with no dignity at all.
        - id: ch01-b26
          speaker: narrator
          text: >-
            Scott had set himself the task of redeeming White Fang. Or, as he saw it, he was trying to redeem mankind from the wrong it had done White Fang. It was a matter of principle and conscience. Men had injured the animal, so men carried a debt that had to be paid. Scott went out of his way to treat the Fighting Wolf with special kindness. Every day, without fail, he made time to pet and stroke White Fang, and he kept at it for a long while.
        - id: ch01-b27
          speaker: narrator
          text: >-
            White Fang was hostile and suspicious at first, but he came to enjoy the petting. One thing never changed. He growled from the first touch to the last. A stranger would have heard only the oldest kind of savagery, a sound that shook the nerves and chilled the blood. White Fang's throat had grown harsh through all the years since his first little rasp of anger in the cub's lair. He could no longer soften that throat enough to express the gentleness he felt.
        - id: ch01-b28
          speaker: narrator
          text: >-
            But Scott's ear was guided by sympathy, and he heard what no stranger could. Deep beneath the fierceness was a new note, almost drowned by the growl. It was the faintest beginning of a contented croon, and Scott alone could hear it.
        - id: ch01-b29
          speaker: narrator
          text: >-
            As the days passed, liking grew more quickly into love. White Fang began to feel the change, though he did not know what love was or have a name for it. He knew it as an empty place inside himself, hungry and aching and always asking to be filled. That emptiness brought pain and restless longing. Only the touch of his god's presence could quiet it. When Scott was near, love became a wild and thrilling joy. When Scott went away, the pain and unrest returned. The empty place rose inside him again, and its hunger kept gnawing without relief.
        - id: ch01-b30
          speaker: narrator
          text: >-
            White Fang was in the process of finding a new self. Though he was fully grown and his savage nature had long been set, something inside him was opening. Strange feelings appeared, along with urges he had never known. His old law had been simple. He liked comfort and freedom from pain. He disliked discomfort and pain, and shaped every action by those choices. Now the new feeling changed his law. For the sake of his god, he sometimes chose discomfort and even pain.
        - id: ch01-b31
          speaker: narrator
          text: >-
            In the early morning, instead of roaming for food or lying in a sheltered corner, he might wait for hours on the bleak cabin steps just to see Scott's face. At night, when Scott came home, White Fang left the warm sleeping hollow he had dug in the snow. He came out for the friendly snap of fingers and the word of greeting. He would even give up meat, precious meat itself, to stay beside his god, receive a caress, or follow him down into town.
        - id: ch01-b32
          speaker: narrator
          text: >-
            Like had been replaced by love. Love dropped deep into places inside White Fang that liking had never reached. From those same depths came his answer, the new gift of love returned for love received. Scott had truly become the love-master, a warm and radiant god. In his light, White Fang's nature opened as a flower opens beneath the sun.
        - id: ch01-b33
          speaker: narrator
          text: >-
            White Fang could not show that love easily. He was too old and too firmly shaped to learn new forms of expression. He had lived too long in silence, distance, and loneliness. He had never barked in his life, and he could not learn to bark a welcome now. He never got in the way or made a foolish, noisy show of affection. He never ran out to meet Scott. He waited at a distance, but he always waited and was always there. His love had the nature of worship. It was wordless, unable to speak, and full of silent devotion.
        - id: ch01-b34
          speaker: narrator
          text: >-
            He showed it through the steady gaze of his eyes. Wherever Scott moved, White Fang's eyes followed him without a break. Sometimes his god looked back and spoke to him. Then White Fang became awkward and strangely self-conscious. The love inside him struggled to show itself, while his body struggled just as strongly because it did not know how.
        - id: ch01-b35
          speaker: narrator
          text: >-
            He also learned to fit himself into the rules of his new life. He understood that he must leave his master's dogs alone. But his need to rule was too strong to disappear. First he had to thrash them until they accepted that he stood above them and led them. Once that was settled, he had little trouble. They made a path when he came and went among them, and whenever he asserted his will, they obeyed.
        - id: ch01-b36
          speaker: narrator
          text: >-
            In the same way, White Fang learned to tolerate Matt as someone who belonged to Scott. His master rarely fed him. That was Matt's job. Even so, White Fang understood that the meat belonged to Scott, and that Scott was feeding him through Matt's hands. Matt tried to put him into harness and make him haul with the sled dogs, but White Fang refused. Only after Scott himself placed the harness on him and put him to work did he understand. His master wanted Matt to drive and work him just as Matt drove and worked all the other dogs.
        - id: ch01-b37
          speaker: narrator
          text: >-
            The Klondike sleds were different from the Mackenzie toboggans. They ran on runners, and the dogs were driven in a different formation. Here the team did not spread out like a fan. The dogs pulled on double traces, one behind another in a single line. In the Klondike, the leader truly led. He had to be the wisest dog as well as the strongest, and every animal in the team obeyed and feared him.
        - id: ch01-b38
          speaker: narrator
          text: >-
            It was only natural that White Fang quickly gained that place. He could accept no position but the lead, so he chose it for himself. Matt tried the arrangement and, after plenty of trouble and strong language, admitted that White Fang's judgment had been right. White Fang pulled the sled all day but never gave up guarding his master's property at night. He was always on duty, always watchful, and always faithful. Of all the dogs, he became the most valuable.
        - id: ch01-b39
          speaker: matt
          text: >-
            I'll just say what's on my mind. You knew what you were doing when you paid for that dog. You cheated Beauty Smith good, on top of smashing him in the face.
        - id: ch01-b40
          speaker: narrator
          text: >-
            Anger flashed again in Scott's gray eyes.
        - id: ch01-b41
          speaker: weedon_scott
          text: >-
            The beast!
          emotion: angry
        - id: ch01-b42
          speaker: narrator
          text: >-
            In late spring, great trouble came to White Fang without warning. The love-master disappeared. There had really been a warning, because Scott had packed a traveling bag, but White Fang did not understand what the packing meant. Only later did he remember that it had come before the disappearance. At the time, he suspected nothing. That night he waited for his master to return. At midnight, the cold wind drove him behind the cabin for shelter. He dozed there only half asleep, his ears ready for the first sound of the familiar step. By two in the morning, worry had become stronger than the cold. It brought him back to the frozen front steps, where he crouched and waited.
        - id: ch01-b43
          speaker: narrator
          text: >-
            But no master came. In the morning, Matt opened the door and stepped outside. White Fang gazed at him with a silent, longing question, but man and wolf had no shared speech through which he could ask what he needed to know. One day followed another, and still the master never appeared. White Fang had never known sickness in his life. Now he became ill, then very ill, until Matt finally had to carry him into the cabin.
        - id: ch01-b44
          speaker: narrator
          text: >-
            Matt wrote to Scott in Circle City and added a message about White Fang.
        - id: ch01-b45
          speaker: matt
          text: >-
            That fool wolf won't work or eat. There's no spirit left in him, and all the dogs are beating him. He wants to know where you went, and I can't tell him. Maybe he's going to die.
          emotion: sad
        - id: ch01-b46
          speaker: narrator
          text: >-
            Everything Matt wrote was true. White Fang had stopped eating. He had lost heart and no longer found the will to resist. Every dog in the team could thrash him now, and he allowed it. Inside the cabin he lay on the floor near the stove, with no interest in food, in Matt, or in life itself. Matt might speak gently to him or fill the room with swearing. It made no difference. White Fang would do no more than turn his dull eyes toward the man for a moment. Then his head dropped back to its usual place on his front paws.
        - id: ch01-b47
          speaker: narrator
          text: >-
            Then one night, Matt sat reading with moving lips and a low mumble. A quiet whine from White Fang startled him. White Fang was standing now, ears pointed toward the door, listening with all his strength. A moment later, Matt heard a footstep. The door opened, Weedon Scott came in, and the two men shook hands.
        - id: ch01-b48
          speaker: weedon_scott
          text: >-
            Where's the wolf?
        - id: ch01-b49
          speaker: narrator
          text: >-
            Scott found White Fang standing by the stove where he had been lying. He had not rushed forward like another dog. He only stood there, watching and waiting.
        - id: ch01-b50
          speaker: matt
          text: >-
            Holy smoke! Look at him wagging his tail!
          emotion: surprised
        - id: ch01-b51
          speaker: narrator
          text: >-
            Scott crossed half the room and called him. White Fang came quickly, though not with the wild bound another dog might have made. For once he forgot his usual self-consciousness. As he drew near, his eyes took on a strange expression. A vast feeling that could never be put into speech rose into them. It appeared there like a light and shone out at his master.
        - id: ch01-b52
          speaker: matt
          text: >-
            He never once looked at me like that while you were gone!
          emotion: surprised
        - id: ch01-b53
          speaker: narrator
          text: >-
            Scott did not hear Matt's comment. He had dropped onto his heels and was crouching face-to-face with White Fang. He rubbed the roots of the ears, made long, loving strokes down the neck to the shoulders, and gently tapped the backbone with the tips of his fingers. White Fang answered every touch with his growl. This time the crooning note within it sounded more clearly than it ever had before.
        - id: ch01-b54
          speaker: narrator
          text: >-
            Still, the growl was not enough for all the joy inside him. His great love kept surging up and struggling to find some way out. Suddenly it discovered a new form of expression. White Fang thrust his head forward and pushed it between Scott's arm and body. There he was enclosed and hidden from sight except for his ears. He stopped growling, then kept nudging and pressing himself closer.
        - id: ch01-b55
          speaker: narrator
          text: >-
            The two men looked at each other. Scott's eyes were shining.
        - id: ch01-b56
          speaker: matt
          text: >-
            Gosh!
          emotion: surprised
        - id: ch01-b57
          speaker: matt
          text: >-
            I always said that wolf was a dog. Just look at him!
        - id: ch01-b58
          speaker: narrator
          text: >-
            White Fang recovered quickly after the love-master returned. He spent two nights and one full day inside the cabin, gathering his strength. Then he went outside again. The sled dogs had forgotten his old fighting power and remembered only what they had seen most recently, his weakness and sickness. The moment he came through the cabin door, the whole pack sprang upon him.
        - id: ch01-b59
          speaker: matt
          text: >-
            Now that's what I call a roughhouse.
        - id: ch01-b60
          speaker: matt
          text: >-
            Give 'em hell, you wolf! Give 'em hell, and then some!
          emotion: happy
        - id: ch01-b61
          speaker: narrator
          text: >-
            White Fang needed no encouragement. The love-master was back, and life rushed through him again, splendid, strong, and unconquerable. He fought from sheer joy. Battle gave him a way to express feelings that had no other speech. There could be only one ending. The whole team scattered in disgraceful defeat. Not until after dark did the dogs come creeping back, one by one. Their meek bodies and humble movements told White Fang that they accepted his rule once more.
        - id: ch01-b62
          speaker: narrator
          text: >-
            Now that White Fang had learned to snuggle, he did it often. It was his final word of love, the furthest he could go. All his life he had guarded his head more jealously than any other part of himself. He had always hated having it touched. The Wild had planted that fear in him, the fear of injury and the trap. Instinct ordered him to keep his head free so he could always defend himself or escape.
        - id: ch01-b63
          speaker: narrator
          text: >-
            But when White Fang pressed his head beneath the love-master's arm, he deliberately placed himself where he was completely helpless. Nothing could have shown greater confidence or more complete surrender. He offered the very part of himself that instinct had always commanded him to protect. His act seemed to say, "I put myself in your hands. Do whatever you wish with me."
        - id: ch01-b64
          speaker: narrator
          text: >-
            Not long after Scott's return, he and Matt sat down to a game of cribbage before bed. Matt was counting his score when a cry and a burst of snarling sounded outside. Both men started to rise.
        - id: ch01-b65
          speaker: matt
          text: >-
            The wolf's caught somebody.
        - id: ch01-b66
          speaker: narrator
          text: >-
            A wild scream of pain and terror sent them running.
        - id: ch01-b67
          speaker: weedon_scott
          text: >-
            Bring a light!
        - id: ch01-b68
          speaker: narrator
          text: >-
            Scott sprang outside, and Matt followed with the lamp. In its light they saw a man lying flat on his back in the snow. His arms were crossed one above the other over his face and throat as he tried to shield himself from White Fang's teeth. He desperately needed that protection. White Fang was attacking in a wicked fury, always striking for the most vulnerable place. From shoulder to wrist, the man's coat sleeves, blue flannel shirt, and undershirt had been ripped into rags. The arms beneath them were terribly slashed and streaming blood.
        - id: ch01-b69
          speaker: narrator
          text: >-
            In the next instant, Scott seized White Fang by the throat and dragged him away. White Fang struggled and snarled but never tried to bite him. One sharp word from his master quickly quieted him.
        - id: ch01-b70
          speaker: narrator
          text: >-
            Matt helped the stranger to his feet. As the man rose, he lowered his crossed arms and uncovered the brutal face of Beauty Smith. Matt released him at once, with the same quick motion a man might make after picking up something burning hot. Beauty Smith blinked in the lamplight and looked around him. Then his eyes found White Fang, and terror rushed across his face.
        - id: ch01-b71
          speaker: narrator
          text: >-
            At that same moment, Matt noticed two things lying in the snow. He lowered the lamp close to them and pointed each one out to Scott with his toe. One was a steel dog chain. The other was a thick, heavy club. They made Beauty Smith's purpose clear.
        - id: ch01-b72
          speaker: narrator
          text: >-
            Scott looked at the chain and club, understood, and nodded. Neither man spoke. Matt laid a hand on Beauty Smith's shoulder, turned him firmly around to face the other way, and sent him off. No words were needed for that, either. Beauty Smith started walking.
        - id: ch01-b73
          speaker: narrator
          text: >-
            While Beauty Smith left, the love-master petted White Fang and spoke to him.
        - id: ch01-b74
          speaker: weedon_scott
          text: >-
            He tried to steal you, did he? And you wouldn't let him. Well, he made a mistake, didn't he?
        - id: ch01-b75
          speaker: matt
          text: >-
            Must've thought he'd grabbed hold of seventeen devils.
        - id: ch01-b76
          speaker: narrator
          text: >-
            White Fang was still bristling and shaken. He growled on and on. Slowly his hair settled, and deep in his throat the faint crooning note began to grow.
