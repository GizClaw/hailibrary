audio_script:
  language: zh-CN
  cast:
    narrator:
      display_name: 旁白
      tts:
        delivery: 沉着克制，带着北国故事的冷峻张力
        timbre: 温厚清晰，略显低沉
        pace: 舒缓而有变化
        pitch: 中低
    bill:
      display_name: 比尔
      tts:
        delivery: 粗直敏感，疲惫中渐渐透出不安
        timbre: 粗粝结实
        pace: 中速，担忧时稍慢
        pitch: 中低
    henry:
      display_name: 亨利
      tts:
        delivery: 务实强硬，常用挖苦压住恐惧
        timbre: 稳健有力
        pace: 中速利落
        pitch: 中
  chapters:
    - id: ch01
      title: 黑暗中的追猎
      blocks:
        - id: ch01-b01
          speaker: narrator
          text: 早饭吃完，轻便的用具捆上雪橇，两个人背过温暖的火堆，再次走进黑暗。凶狠又悲凉的嗥叫马上响了起来，穿过严寒彼此呼应。他们不再说话。九点钟天才亮。到了正午，南方天空短暂泛起玫瑰色，那是藏在地面弧线后的太阳留下的一点痕迹。转眼间，暖色消失，灰白的天光也只撑到三点，北极长夜又罩住了寂静的荒原。
        - id: ch01-b02
          speaker: narrator
          text: 黑暗越浓，左右和后方的狩猎嗥声就越近。声音有时近得像要贴上雪橇，苦苦拉橇的狗听得浑身发紧，接连陷入短促的惊慌。每次骚乱，挽索都会乱成一团，两个人只得停下来，把狗重新赶回原位。又一次收拾妥当后，比尔终于开口。
        - id: ch01-b03
          speaker: bill
          text: 要是它们能碰上别的猎物，追过去不再管咱们，那该多好。
        - id: ch01-b04
          speaker: henry
          text: 这些东西真能把人的神经逼疯。
        - id: ch01-b05
          speaker: narrator
          text: 此后直到扎营，两人一句话也没说。营地里，亨利俯身往咕嘟作响的豆子锅里添冰。忽然，一记棍响从身后传来，紧跟着是比尔的叫骂，还有狗群中一声尖厉凶狠的痛嗥。亨利连忙直起腰，只来得及看见一个模糊影子飞快越过雪地，躲进黑暗。再回头，比尔还站在狗群中，一手拿着粗棍，一手抓着晒干鲑鱼剩下的尾巴和半截身子。他打中了来偷鱼的家伙，却也丢了半条鱼，脸上既得意，又懊丧。
        - id: ch01-b06
          speaker: bill
          text: 它抢走一半，不过我也狠狠打了它一下。你听见它叫了吧？
        - id: ch01-b07
          speaker: henry
          text: 看清是什么样了吗？
        - id: ch01-b08
          speaker: bill
          text: 没看清。四条腿，有嘴有毛，看着就跟狗一样。
        - id: ch01-b09
          speaker: henry
          text: 那准是只驯过的狼。
        - id: ch01-b10
          speaker: bill
          text: 不管是什么，它可真够驯的。竟敢趁开饭钻进来，抢走自己那份鱼。
        - id: ch01-b11
          speaker: narrator
          text: 晚饭后，两人坐在长方形箱子上抽烟斗。黑暗里那一圈发亮的眼睛，比从前靠得更近。
        - id: ch01-b12
          speaker: bill
          text: 真希望它们惊起一群驼鹿什么的，赶快追走，别再缠着咱们。
        - id: ch01-b13
          speaker: narrator
          text: 亨利哼了一声，语气里却没有多少同情。接下来整整一刻钟，两人都默默坐在箱子上。亨利盯着火焰，比尔则望着火光以外，那一圈在黑暗里像炭火般燃烧的眼睛。眼睛时隐时现，却一直没有散去。最后，比尔又忍不住开了口。
        - id: ch01-b14
          speaker: bill
          text: 要是咱们现在已经到了麦格里堡就好了。
        - id: ch01-b15
          speaker: henry
          text: 别再许愿，也别再说丧气话。你就是胃里发酸。吞一勺苏打粉，肚子舒服了，人也会好相处些。
          emotion: angry
    - id: ch02
      title: 又少了一条狗
      blocks:
        - id: ch02-b01
          speaker: narrator
          text: 第二天清早，亨利被比尔一连串猛烈的咒骂惊醒。他从温暖的毯子里撑起身，看见同伴站在重新添旺的火堆旁、剩下的狗群中间，双臂举在空中，气得脸都变了形。
        - id: ch02-b02
          speaker: henry
          text: 喂，又怎么了？
        - id: ch02-b03
          speaker: bill
          text: 青蛙没了。
        - id: ch02-b04
          speaker: henry
          text: 不会吧。
        - id: ch02-b05
          speaker: bill
          text: 我说没了就是没了。
          emotion: angry
        - id: ch02-b06
          speaker: narrator
          text: 亨利从毯子里跳出来，仔细数过狗，也和比尔一起咒骂起夺走又一条狗的荒原。
        - id: ch02-b07
          speaker: bill
          text: 青蛙可是这群狗里最壮的。
        - id: ch02-b08
          speaker: henry
          text: 它也绝不是条傻狗。
        - id: ch02-b09
          speaker: narrator
          text: 两天之内，第二篇墓志铭就这样写下了。他们阴沉沉地吃过早饭，把剩下四条狗套上雪橇。这一天和先前那些日子没有两样。两个人一句话也不说，只在冰封的世界上费力前行。四周的寂静，只有看不见的追兵发出的嗥叫能够打破。下午过半，黑夜再次降临，狼群又照老习惯逼近。嗥声越来越近，狗群又惊又怕，接连发狂，挽索一次次搅成乱麻。每耽搁一回，两个人的心情就更沉重一点。到了晚上，比尔忙完手上的活，满意地站直身子。
        - id: ch02-b10
          speaker: bill
          text: 好了，这下总能管住你们这些蠢家伙。
        - id: ch02-b11
          speaker: narrator
          text: 亨利放下饭锅来看。比尔照印第安人的办法，在每条狗的颈圈和地桩之间加了一根四五英尺长的硬木棍。狗够不到自己颈边的皮条，也隔着木棍咬不着另一头。
        - id: ch02-b12
          speaker: henry
          text: 只有这玩意儿拴得住独耳。它咬皮条跟刀割一样干净，速度也不慢。明早它们准会全在这儿。
        - id: ch02-b13
          speaker: bill
          text: 那当然。要是再少一条，我就不喝咖啡。
        - id: ch02-b14
          speaker: henry
          text: 那些狼知道咱们没子弹杀它们。只要打中一两只，它们就会懂规矩。它们每晚都更近。别盯着火，仔细看那边。看见了吗？
        - id: ch02-b15
          speaker: narrator
          text: 两人看了好一阵火光边缘的模糊身影。黑暗里，一双双眼睛不断移动。只要选中一双，稳稳盯住不放，那只野兽的身形就会一点点从夜色里浮出来。有时，他们甚至能看见那轮廓在缓缓走动。忽然，狗群里传来响动。独耳发出一连串短促而急切的呜咽，朝黑暗猛扑，把木棍扯到尽头。够不到外面的东西，它就回过头，发疯似的用牙撕咬木棍。
        - id: ch02-b16
          speaker: henry
          text: 比尔，快看。
        - id: ch02-b17
          speaker: narrator
          text: 一只狗样的野兽侧着身，悄无声息地滑进火光。它每走一步都十分谨慎，一边提防两个男人，一边把全部注意力放在狗群身上。它对营地满怀疑惧，却又大胆地继续靠近。独耳把身体探到最远，木棍绷得笔直，嘴里急不可耐地哼叫着，仿佛只想奔到这个陌生来客身边。
        - id: ch02-b18
          speaker: bill
          text: 独耳这个傻瓜，好像一点也不害怕。
        - id: ch02-b19
          speaker: henry
          text: 那是只母狼。胖子和青蛙就是这么没的。它把狗引出去，狼群再一拥而上，把狗吃掉。
        - id: ch02-b20
          speaker: narrator
          text: 木柴忽然裂开，爆出一阵响声。那野兽立刻跳回黑暗。
        - id: ch02-b21
          speaker: bill
          text: 亨利，我在想一件事。我看它就是刚才挨了我一棍的家伙。
        - id: ch02-b22
          speaker: henry
          text: 一点也错不了。
        - id: ch02-b23
          speaker: bill
          text: 而且它对营火熟得很，这可疑得很，也太不成体统了。
        - id: ch02-b24
          speaker: henry
          text: 它懂的确实比一只正经狼该懂的多。敢趁狗吃饭混进来，准是经历过不少事。
        - id: ch02-b25
          speaker: bill
          text: 老维兰有条狗，以前跟狼群跑了。我在小棍河那边的驼鹿牧场，从狼群里一枪打死了它。老维兰哭得像个孩子，说三年没见它了。那三年，它一直跟狼生活。
        - id: ch02-b26
          speaker: henry
          text: 我看你猜对了。这狼其实是狗，以前常从人手里吃鱼。
        - id: ch02-b27
          speaker: bill
          text: 只要有机会，我就把这条狗狼变成一块肉。咱们不能再丢狗了。
        - id: ch02-b28
          speaker: henry
          text: 可你只剩三发子弹。
        - id: ch02-b29
          speaker: bill
          text: 我会等到肯定打得中再开枪。
    - id: ch03
      title: 不喝咖啡的早晨
      blocks:
        - id: ch03-b01
          speaker: narrator
          text: 清早，亨利重新生起火。比尔还在一旁打着鼾，他就伴着这鼾声做好了早饭。等一切准备妥当，他才过去把同伴从睡梦里赶起来。
        - id: ch03-b02
          speaker: henry
          text: 你睡得太香，我都不忍心叫醒你。
        - id: ch03-b03
          speaker: narrator
          text: 比尔迷迷糊糊吃起来。他发现杯里没咖啡，伸手去够壶，可壶就在亨利身旁。
        - id: ch03-b04
          speaker: bill
          text: 亨利，你是不是忘了什么？
        - id: ch03-b05
          speaker: narrator
          text: 亨利仔仔细细看了一圈，摇了摇头。比尔举起空杯。
        - id: ch03-b06
          speaker: henry
          text: 你今天没咖啡喝。
        - id: ch03-b07
          speaker: bill
          text: 咖啡没了？
        - id: ch03-b08
          speaker: henry
          text: 没有。
        - id: ch03-b09
          speaker: bill
          text: 你怕它伤我的胃？
        - id: ch03-b10
          speaker: henry
          text: 也不是。
        - id: ch03-b11
          speaker: narrator
          text: 比尔的脸一下涨红了。
        - id: ch03-b12
          speaker: bill
          text: 那我可真着急听你解释了。
          emotion: angry
        - id: ch03-b13
          speaker: henry
          text: 斯潘克没了。
        - id: ch03-b14
          speaker: narrator
          text: 比尔没有立刻跳起来。他像是已经习惯了厄运，慢慢转过头，仍坐在原地，把剩下的狗一条一条数过来。
        - id: ch03-b15
          speaker: bill
          text: 怎么会没的？
        - id: ch03-b16
          speaker: henry
          text: 不知道。除非独耳咬断了它的皮条。斯潘克自己肯定够不到。
        - id: ch03-b17
          speaker: bill
          text: 该死的独耳。自己逃不掉，就把斯潘克放走。
        - id: ch03-b18
          speaker: henry
          text: 不管怎么说，斯潘克再也不用受罪了。我猜它早就让狼消化掉了，这会儿正分别装在二十条狼的肚子里，跟着它们满世界乱跑。这就是它的墓志铭。现在喝点咖啡吧，比尔。
        - id: ch03-b19
          speaker: narrator
          text: 比尔摇头。亨利举起壶，再劝了一次。
        - id: ch03-b20
          speaker: henry
          text: 喝吧。
        - id: ch03-b21
          speaker: bill
          text: 我说过少一条狗就不喝，我一定说到做到。
        - id: ch03-b22
          speaker: henry
          text: 这咖啡可香得很。
        - id: ch03-b23
          speaker: narrator
          text: 比尔还是不肯。他固执地把咖啡推开，干吃完早饭，嘴里含混地咒骂着独耳玩的花招。上路时，他说今晚一定要把狗分开，拴得谁也碰不到谁。队伍走出一百码左右，领头的亨利弯下腰，拾起一个被雪鞋碰到的东西。天色很暗，他看不清，可手指一摸就认出来了。他把东西往身后一扔。那东西先砸上雪橇，又一路弹跳，最后停在比尔的雪鞋前。
        - id: ch03-b24
          speaker: henry
          text: 你的活儿也许用得上这个。
        - id: ch03-b25
          speaker: narrator
          text: 比尔惊叫一声。那是斯潘克唯一的遗物，拴它的木棍。
        - id: ch03-b26
          speaker: bill
          text: 它们把斯潘克连皮带毛都吃了，木棍舔得干干净净，两头的皮条也没剩。它们饿疯了，亨利。这趟路走完以前，咱们有得受。
        - id: ch03-b27
          speaker: henry
          text: 我以前确实没让狼这样一路跟过，可比这更糟的事，我也闯过来了，而且照样活得好好的。就凭这么一小撮讨厌鬼，还远远要不了我的命，我的好比尔。
        - id: ch03-b28
          speaker: bill
          text: 这可说不准。
        - id: ch03-b29
          speaker: henry
          text: 等到了麦格里堡，你就知道了。
        - id: ch03-b30
          speaker: bill
          text: 我可没那么乐观。
        - id: ch03-b31
          speaker: henry
          text: 你只是身体不舒服，需要吃奎宁。到了麦格里堡，我给你来一大剂。
        - id: ch03-b32
          speaker: narrator
          text: 比尔哼了一声，显然不赞同亨利的诊断，随后又沉默下来。这一天仍和所有日子一样。九点钟，天光才出现。到了十二点，看不见的太阳把南方地平线染得稍稍温暖。可是那点暖意很快就开始退去，寒冷灰暗的下午随即到来。三个钟头以后，下午又无声地融进黑夜。
    - id: ch04
      title: 母狼现身
      blocks:
        - id: ch04-b01
          speaker: narrator
          text: 正午的太阳藏在地平线下面，只徒劳地让南方天空亮过一阵。那点微光才刚刚退去，比尔便停下脚步，从捆扎雪橇的绑索下面抽出了步枪。他显然已经打定主意，要亲自去看看紧跟不放的狼群。
        - id: ch04-b02
          speaker: bill
          text: 亨利，你接着走。我去看看那些狼。
        - id: ch04-b03
          speaker: henry
          text: 最好别离开雪橇。你只有三发子弹，谁知道会碰上什么。
        - id: ch04-b04
          speaker: bill
          text: 现在又是谁说丧气话？
        - id: ch04-b05
          speaker: narrator
          text: 亨利没有回答，独自跟着雪橇继续赶路。一路上，他常常转头，焦急地望向身后的灰色荒野，可比尔早已消失在那里。一个钟头后，比尔利用雪道的弯曲抄近路，越过几个雪橇必须慢慢兜行的弯道，终于从侧面追了上来。
        - id: ch04-b06
          speaker: bill
          text: 它们散得很开，搜索的范围很大。一面跟着咱们，一面还在四处找别的猎物。你看，它们认定咱们已经跑不了，只不过知道还得等上一阵。等待的时候，只要附近有什么能吃的东西，它们也乐意顺便捡来填肚子。
        - id: ch04-b07
          speaker: henry
          text: 是它们自以为咱们跑不了。
        - id: ch04-b08
          speaker: bill
          text: 我看见了几只，瘦得吓人。除了胖子、青蛙和斯潘克，它们大概几个星期没吃过东西。狼太多，三条狗也填不饱。它们的肋骨像搓衣板，肚子贴着脊梁。它们已经急疯了，很快真会发狂，到时候可得小心。
        - id: ch04-b09
          speaker: narrator
          text: 几分钟后，走在雪橇后面的亨利低低吹了声口哨，提醒前面的比尔。比尔回头看见了，立刻安静地停住狗。就在他们刚走过的雪道上，一个毛茸茸、鬼鬼祟祟的身影从最后一道弯后跑了出来。它把鼻子贴近雪道，步子十分奇特，像滑行一样轻松，几乎不费力气。两个人停下，它也停下，昂起头定定望着他们。它的鼻翼不停抽动，正在捕捉并细细辨认他们的气味。
        - id: ch04-b10
          speaker: bill
          text: 就是那只母狼。
        - id: ch04-b11
          speaker: narrator
          text: 狗群已经伏在雪地上。比尔从它们身边走过，来到雪橇后的亨利身旁。两个人一起望着这只陌生的野兽。它跟了他们好几天，已经毁掉半支狗队。母狼仔细观察很久，才向前小跑几步，又停下来重新打量。它一次又一次这样靠近，直到离他们不足一百码。随后，它站在一簇云杉旁，昂着头，用眼睛和鼻子研究两个男人和他们的行装。它像狗一样渴望地望着他们，可那眼神里没有狗的亲爱。那是饥饿生出的渴望，像它自己的獠牙一样残酷，像北国的严霜一样无情。
        - id: ch04-b12
          speaker: narrator
          text: 以一只狼来说，它的个头大得出奇。虽然饿得身架瘦削，那副高大骨架仍看得清清楚楚，足以说明它在同类之中也属于最大的一批。
        - id: ch04-b13
          speaker: henry
          text: 肩高快有两英尺半了。我看身长离五英尺也差不了多少。
        - id: ch04-b14
          speaker: bill
          text: 这颜色可真怪。我从没见过红狼，看着几乎像肉桂色。
        - id: ch04-b15
          speaker: narrator
          text: 它并不是肉桂色。那是真正的狼毛，以灰色为主，却若有若无地泛着红光。那点红忽隐忽现，像眼睛造成的幻觉。一会儿分明是灰，一会儿又闪出一种寻常经验说不清的朦胧红色。
        - id: ch04-b16
          speaker: bill
          text: 简直就是一条大哈士奇雪橇犬。它要是摇起尾巴，我都不会奇怪。喂，哈士奇！过来，你这不知道叫什么的家伙！
        - id: ch04-b17
          speaker: henry
          text: 它根本不怕你。
        - id: ch04-b18
          speaker: narrator
          text: 比尔抬手威吓它，又扯开嗓门大喊。母狼没有显出半点恐惧。两个人能看出的唯一变化，就是它比刚才更加警觉。它依旧站在那里，用饥饿而无情的目光盯着他们。对它来说，两个人就是肉，而它已经饿坏了。只要胆量足够，它就会立刻走进来，把他们吃掉。
        - id: ch04-b19
          speaker: bill
          text: 听着，亨利。咱们有三发子弹，这距离肯定一枪就中。它弄走了三条狗，该让它停手了。你觉得呢？
        - id: ch04-b20
          speaker: narrator
          text: 亨利点头同意。比尔小心翼翼地从雪橇绑索下抽出枪。枪管刚刚抬起，还没有抵到肩头，母狼就在那一瞬间横着跃离雪道，蹿进旁边的云杉丛，彻底不见了。两个男人互相看着。亨利拖长声音吹了声口哨，他现在全明白了。
        - id: ch04-b21
          speaker: bill
          text: 我早该想到。它懂得趁狗吃饭混进来，当然也懂枪。咱们的麻烦全是它惹的。要不是它，现在还有六条狗，不会只剩三条。我一定要逮住它。明处打不中，我就埋伏着等。只要我还叫比尔，就一定从暗处干掉它。
        - id: ch04-b22
          speaker: henry
          text: 埋伏时别走太远。狼群真扑上来，三发子弹也只顶三声空喊。它们饿得厉害，一旦动手，一定会吃掉你。
    - id: ch05
      title: 陆地上的鲨鱼
      blocks:
        - id: ch05-b01
          speaker: narrator
          text: 那天晚上，他们很早就停下来扎营。三条狗毕竟不是六条狗，雪橇拉得没有从前快，能支撑的时间也短得多。到了营地，它们已经明显露出快要累垮的样子。两个男人也早早躺下。睡觉以前，比尔仔细安置了狗，把它们分开拴好，让任何一条都够不到另一条的皮条。
        - id: ch05-b02
          speaker: narrator
          text: 狼群却越来越大胆。夜里，两个人不止一次从睡梦中惊醒。狼靠得那么近，狗群一听见动静便吓得发狂。为了不让那些大胆的掠食者闯进营地，他们只得一次又一次爬起来，给火堆添上木柴，借突然蹿高的火焰把狼逼回较为安全的距离。又添过一次火后，比尔钻回毯子。
        - id: ch05-b03
          speaker: bill
          text: 我听水手讲过，鲨鱼会跟着船。这些狼就是陆地上的鲨鱼。它们比咱们更懂这件事，也不是为了散心才一路跟着。它们要吃咱们。亨利，它们一定会吃掉咱们。
        - id: ch05-b04
          speaker: henry
          text: 照你这么说，它们已经吃掉你一半了。人说自己败了，就已经败了一半。听你这口气，你也已经让它们吃掉一半。
        - id: ch05-b05
          speaker: bill
          text: 比你我更强的人，它们照样吃过。
        - id: ch05-b06
          speaker: henry
          text: 闭嘴吧，别再说丧气话。你真让我烦透了。
          emotion: angry
        - id: ch05-b07
          speaker: narrator
          text: 亨利生气地翻过身，朝向另一边。他本来等着比尔同样发一通脾气，却惊讶地发现身后没有动静。尖刻的话平时最容易激怒比尔，像这样一声不响，实在不像他。亨利迟迟没有睡着，把这件事翻来覆去想了很久。最后，他的眼皮开始颤动，慢慢合上。迷迷糊糊睡去时，心里还留着一个念头。绝不会错，比尔已经灰心透了。明天，他得想办法让比尔重新振作起来。
